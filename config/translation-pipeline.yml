schema_version: 1
project: youjo-senki-vi
stages:
  - translator_luna
  - terminology_review_argon
  - prose_polish_gemini
  - semantic_regression_luna
gemini:
  enabled: true
  writes_only: polish-candidates/
  preserve_locked_choices: true
  candidate_pattern: polish-candidates/vol-*/ch-*-b*.gemini.jsonl
acceptance:
  reject_on:
    - critical
    - locked_choice_violation
  coordinator_only: true
  require_semantic_receipt: true
paths:
  local_config: project.local.yml
  manifests: segments/vol-*/manifest.yml
  handoffs: handoffs/
  translations: translations/
  polish_candidates: polish-candidates/
  state_dir: work/run-state
  session: work/run-state/herdr-session.json
  checkpoint: work/run-state/translation-coordinator.yml
  pending: work/run-state/pending-terms.yml
scope:
  volumes: all_available_in_source_dir
  units: segment_id
  include: [story]
  exclude: [copyright, newsletter, cover, toc, image_page, image_appendix]
  missing_manifest: preparation_required
  completion: [committed, validator_pass, required_reviews_resolved, no_open_serious_or_moderate, semantic_regression_pass, polished_promoted]
batch:
  min_source_words: 600
  max_source_words: 900
  preserve_segment: true
  sequential_workers: false
  concurrency:
    max_parallel_workers: 2
    allow_role_pairs:
      - [translator_luna, prose_polish_gemini]
    require_disjoint_allowlists: true
    candidate_root: polish-candidates/
    canonical_translation_writer: one_at_a_time
review:
  every_batch: true
  risk_flags: [meaning, new_pending_terms, emphasis, validator_warning]
  reviewer_writes: [reviews/prose/]
pending_terms:
  policy: temporary_consistent_not_canon
  ledger: work/run-state/pending-terms.yml
  automatic_canon_promotion: false
checkpoint:
  after_each_batch: true
  summary_max_words: 500
  compact_after_batches: 4
  compact_on_context_warning: true
  fallback: new_coordinator_with_recovery_ack
hard_stops:
  - validator_failure
  - diff_check_failure
  - unresolved_serious_error
  - out_of_scope_git_change
  - agent_or_herdr_failure
  - plot_affecting_canon_decision
  - preparation_required
runtime:
  herdr_required_env: true
  reuse_current_workspace: true
  preserve_tab_and_cwd: true
  focus: false
  ready_timeout_seconds: 60
  shutdown_timeout_ms: 60000
  codex:
    launcher_alias: codex-personal
    via: ai-isolator
    source_rc: /home/$USER/.zshrc
    model: gpt-6-luna
    effort: medium
    sandbox: danger-full-access
    approval_policy: never
  reviewer:
    launcher_alias: agy
    via: agy
    source_rc: /home/$USER/.zshrc
    model: gemini-4-argon-medium
    effort: medium
    mode: auto
    approval_policy: never
  gemini:
    launcher_alias: agy
    via: agy
    source_rc: /home/$USER/.zshrc
    model: gemini-3.8-flash-medium
    effort: medium
    mode: auto
    approval_policy: never
  semantic_regression:
    launcher_alias: codex-personal
    via: ai-isolator
    source_rc: /home/$USER/.zshrc
    model: gpt-6-luna
    effort: medium
    sandbox: danger-full-access
    approval_policy: never
tools:
  validator: tools/validate_translation.py
  polished_promotion: tools/promote_polished_translation.py
  extraction: tools/extract_epub.py
  batch_planner: tools/plan_batches.py
  # Chung cho các EPUB LN 01-14; chương được lấy từ TOC/NCX và bộ lọc spine.
  prepared_adapter_volumes:
  - vol-01
  - vol-02
  - vol-03
  - vol-04
  - vol-05
  - vol-06
  - vol-07
  - vol-08
  - vol-09
  - vol-10
  - vol-11
  - vol-12
  - vol-13
  - vol-14
  prepared_adapter_chapters:
  - all_story_chapters_from_toc_or_ncx
