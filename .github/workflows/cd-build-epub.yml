name: CD Build & Release Vietnamese EPUB

on:
  workflow_dispatch:
    inputs:
      volume:
        description: "Volume cần đóng gói (nhập 'all-completed' hoặc mã tập như 'vol-02', 'vol-03')"
        required: false
        default: "all-completed"
        type: string
      require_reviewed:
        description: "Chỉ đóng gói các tập đã được review/polish 100%"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Đẩy file EPUB lên GitHub Release (tag epub-latest)"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - "translations/**"
      - "segments/**"
      - "tools/build_epub.py"
      - ".github/workflows/cd-build-epub.yml"

permissions:
  contents: write

concurrency:
  group: cd-build-epub
  cancel-in-progress: false

jobs:
  build-epub:
    name: Build & Publish Vietnamese EPUBs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml lxml

      - name: Inspect volume completion status
        run: |
          python3 tools/build_epub.py --list-status | tee volume-status.json

      - name: Build EPUB packages
        id: build
        env:
          INPUT_VOLUME: ${{ github.event.inputs.volume || 'all-completed' }}
          REQUIRE_REVIEWED: ${{ github.event.inputs.require_reviewed || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [ "$REQUIRE_REVIEWED" = "true" ]; then
            EXTRA_ARGS="--require-reviewed"
          fi
          if [ "$INPUT_VOLUME" = "all-completed" ]; then
            python3 tools/build_epub.py --all-completed $EXTRA_ARGS
          else
            python3 tools/build_epub.py $INPUT_VOLUME $EXTRA_ARGS
          fi
          ls -lh output/*.epub

      - name: Generate Step Summary
        run: |
          echo "## 📚 Danh sách EPUB tiếng Việt đã đóng gói" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tập | File EPUB | Dung lượng | Số đoạn dịch | Đã review/polish |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          statuses = {s["volume"]: s for s in json.loads(Path("volume-status.json").read_text(encoding="utf-8"))}
          for epub in sorted(Path("output").glob("youjo-senki-vi-*.epub")):
              vol = epub.stem.replace("youjo-senki-vi-", "")
              st = statuses.get(vol, {})
              size_kb = f"{epub.stat().st_size / 1024:.1f} KB"
              total = st.get("story_units", "?")
              rev = st.get("reviewed_units", "?")
              print(f"| `{vol}` | `{epub.name}` | {size_kb} | {total}/{total} | {rev}/{total} |")
          PY

      - name: Upload EPUB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youjo-senki-vi-epubs
          path: output/*.epub
          if-no-files-found: error
          retention-days: 90

      - name: Publish to GitHub Release (epub-latest)
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="epub-latest"
          TITLE="Youjo Senki Tiếng Việt — Bản dựng EPUB tự động (CD)"
          NOTES="Bản dựng EPUB tiếng Việt tự động từ nhánh \`main\` (commit \`${GITHUB_SHA::7}\`)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.epub --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" output/*.epub --title "$TITLE" --notes "$NOTES"
          fi
