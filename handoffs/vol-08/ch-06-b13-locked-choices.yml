choices:
- segment_id: YS-LN08/Text/chapter022.xhtml/p000484
  kind: terminology_and_voice
  value: choices=["Trần thuật ngôi thứ ba gọi Tanya là 'cô' và Zettour là 'ông'; giữ
    đúng sắc thái ngạc nhiên trong nhận xét nội tâm tiếp nối."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: xưng ''tôi'', dịch ''honor student
    outlook'' là ''quan điểm rất chuẩn mực kiểu học sinh gương mẫu''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: gọi ''Ngài'', thêm tiểu từ kính ngữ
    ''ạ'' đúng lễ nghi cấp dưới – cấp trên."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000487
  kind: terminology_and_voice
  value: choices=["Giữ đối lập thuật ngữ 'chiến thuật vượt trội' (superior tactics)
    và 'chiến lược tồi tệ' (poor strategy); 'on the strategic level' là 'ở cấp độ
    chiến lược'; xưng hô 'tôi – cô', gộp 'chúng ta'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000488
  kind: terminology_and_voice
  value: choices=["Giữ phủ định tuyệt đối 'Không đời nào Tanya có thể mở miệng nói
    rằng cô cũng nghĩ như vậy' và động cơ 'vì muốn bảo toàn bản thân'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: ''Thưa Tướng quân'', xưng ''tôi – ngài'', ''chúng
    ta là quân nhân''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000490
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm của Tanya dùng 'chúng ta'; 'Career soldiers—that
    is, officers' dịch là 'Những quân nhân chuyên nghiệp—tức là các sĩ quan'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Giữ chuẩn xác mệnh đề lý thuyết chính trị – quân sự: ''kiểm soát
    công cụ bạo lực'' và ''việc sử dụng vũ lực một cách văn minh''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000492
  kind: terminology_and_voice
  value: choices=["Giữ tình thái giả định chắc chắn ('chắc chắn sẽ bị trừng phạt nghiêm
    khắc') và thuật ngữ 'hành vi vi phạm hợp đồng' (breach of contract)."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000493
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc giới hạn 'chỉ làm những việc được quy định rõ ràng
    là nghĩa vụ quân sự' và phủ định 'Công việc của chúng ta không bao gồm chuyện
    chính trị'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Giữ cấu trúc phủ định ngoại trừ của Zettour: ''chẳng thấy điểm
    nào chê trách được cả, trừ một vấn đề duy nhất là đáng buồn thay nó lại phi thực
    tế''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000495
  kind: terminology_and_voice
  value: choices=["Giữ nguyên 2 vùng nhấn mạnh Markdown '*Mình thực sự bắt đầu ghét
    cuộc tranh luận này rồi đấy*' và '*hoàn toàn không*' theo DEC-P01-002; nội tâm
    trực tiếp tự xưng 'Mình' theo DEC-P01-001, phần trần thuật dùng 'cô'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000496
  kind: terminology_and_voice
  value: choices=["Zettour gọi 'Trung tá von Degurechaff'; 'morale' dịch là 'sĩ khí';
    giữ phép so sánh hai vế phủ định về muối."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000497
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Zettour là 'Ông', giữ tương phản giữa thái độ trang
    trọng và nội dung hiển nhiên."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: ''Tanya không hiểu ông đang muốn ám chỉ
    điều gì''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya với Zettour: ''Xin ngài thứ lỗi... phải không ạ?'',
    giữ giọng lịch sự bề ngoài của cấp dưới."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000500
  kind: terminology_and_voice
  value: choices=["Zettour gọi 'Trung tá von Degurechaff', xưng 'cô'; 'imperial capital'
    là 'đế đô', 'alchemy using salt' là 'thuật giả kim dùng muối'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi lại: ''thủ đô'', ''biến muối thành vàng'', ''hòn
    đá triết gia''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Trần thuật kết hợp độc thoại nội tâm của Tanya: ''Thuật giả kim
    cơ đấy!'', ''xã hội mông muội'', ''khoa học ma pháp''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000503
  kind: terminology_and_voice
  value: choices=["Giữ nhận xét nội tâm về 'phép ẩn dụ' (metaphor)."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000504
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*Kẻ ngu xuẩn nào lại đi làm
    cái trò đó cơ chứ?!*' theo DEC-P01-002; trần thuật dùng 'Cô'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: giữ ẩn dụ đánh bạc (''đặt cược cả gia tài kếch
    xù'', ''gỡ gạc lại được tất cả'') và ''niềm tin mù quáng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi ngắn gọn, lễ phép: ''Liệu có cơ may thành công
    nào không ạ?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000507
  kind: terminology_and_voice
  value: choices=["Giữ phép chơi chữ 'đem muối cả Đế quốc này' (pickle the whole Empire)
    để liên kết trực tiếp với ẩn dụ muối và điển cố ở p000508."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000508
  kind: terminology_and_voice
  value: choices=["Toàn bộ câu đặt trong nhấn mạnh Markdown '*Sodom và Gomorrah, thành
    phố muối.*' theo DEC-P01-002."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000509
  kind: terminology_and_voice
  value: choices=["Giữ sự chuyển đổi điểm nhìn từ trần thuật ('Tanya', 'cô') sang
    nội tâm ngôi thứ nhất ('mình') theo DEC-P01-001; giữ 'tà thần như Being X' và
    câu hỏi tự vấn cuối đoạn."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: ''Thưa Tướng quân'', ''Bộ Tư lệnh Tối cao ở hậu phương''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000511
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*bị cai trị bởi người chết*'
    theo DEC-P01-002."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000512
  kind: terminology_and_voice
  value: choices=["Giữ nguyên cụm trích dẫn lại có nhấn mạnh Markdown '*bị cai trị
    bởi người chết*'; phân biệt 'bộ tư lệnh cấp cao' (high command) và 'hậu phương'
    (the rear)."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Zettour gọi tên cấp bậc: ''Trung tá von Degurechaff?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000514
  kind: terminology_and_voice
  value: choices=["Giữ nét lắp bắp 'X-xin ngài thứ lỗi' và trích dẫn trong ngoặc đơn
    'bị cai trị bởi người chết' (không in nghiêng, đúng theo bản gốc)."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000515
  kind: terminology_and_voice
  value: choices=["Trần thuật nội tâm dùng 'cô' và đại từ phản thân 'mình', giữ cụm
    'ở ngoài tiền tuyến quá lâu rồi'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000516
  kind: terminology_and_voice
  value: choices=["Zettour hỏi Tanya ('Cô'), giữ cụm trích dẫn trong ngoặc đơn 'những
    hy sinh mà chúng ta đã bỏ ra từ trước đến nay'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000517
  kind: terminology_and_voice
  value: choices=["Tanya đáp lễ phép ('Một chút ạ'), dịch 'Colonel Uger' là 'Trung
    tá Uger'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000518
  kind: terminology_and_voice
  value: choices=["Zettour gọi Uger là 'Anh ta'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000519
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm ngôi thứ nhất của Tanya tự xưng 'Mình'/'mình'
    theo DEC-P01-001; khóa các thuật ngữ 'bản quốc' (the homeland), 'cắt lỗ' (cut
    our losses), 'bồi thường chiến phí' (reparations), 'hiệu ứng Concorde' (Concorde
    effect), 'vốn con người' (human capital)."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Giữ đúng sự chuyển dịch đại từ của bản gốc: câu đầu ngôi thứ nhất
    (''Mình''), câu hai trần thuật ngôi thứ ba (''cô'')."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya với Zettour: xưng ''tôi'', gọi ''Trung tá Uger'',
    có kính ngữ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: gọi Uger là ''anh ta'', giữ chuỗi tính từ ''cảm
    tính, phi lý nhưng đầy sức nặng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp ngắn gọn: ''Vâng, thưa ngài.''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba quá khứ: ''Tanya đã không thể hiểu nổi
    những gì Uger nói.''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000525
  kind: terminology_and_voice
  value: choices=["Giữ đúng câu nhấn mạnh Markdown '*Chắc chắn anh ta không đến mức
    ngu xuẩn như thế!*' theo DEC-P01-002 và cụm 'những kẻ ngu xuẩn cỡ siêu thiết giáp
    hạm'."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000526
  kind: terminology_and_voice
  value: choices=["Toàn bộ câu hỏi nội tâm đặt trong nhấn mạnh Markdown '*Chuyện đó
    thực sự xảy ra ư?*' theo DEC-P01-002."]
- segment_id: YS-LN08/Text/chapter022.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: xưng ''tôi'', khóa các cụm ''Lục quân Đế quốc''
    (Imperial Army), ''Trung tá Uger'' (Colonel Uger), và giả định quá khứ ''có lẽ
    anh ta vẫn còn đang đánh giá thấp tình hình''."]'
