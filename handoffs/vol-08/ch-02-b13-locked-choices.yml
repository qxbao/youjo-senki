choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ đối lập: quy chiếu Zettour bằng ''ông'';
    giữ sự tách biệt giữa chức danh hình thức mà Zettour được trao với phần công việc
    thực tế ông cần phải làm."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định trong thoại: Tanya gọi Zettour là
    ''Thưa Tướng quân'' / ''ngài'' và xưng ''tôi''; giữ câu khẳng định thẳng thắn
    đi kèm phủ định ''Nói thẳng ra là tôi không theo kịp ý ngài.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái biểu cảm: Zettour gọi Tanya là ''Cô'' trong
    câu hỏi ngắn ''Cô không hiểu chỗ nào?''; quy chiếu Zettour bằng ''ông'' và giữ
    miêu tả nụ cười bí hiểm, quỷ quyệt."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái suy đoán: quy chiếu Tanya bằng ''nó''
    theo DEC-P01-001 và Zettour bằng ''ông''; giữ dấu hai chấm và tình thái suy đoán
    chắc chắn ''Đây hẳn phải là một trong những lúc có âm mưu động trời nào đó đang
    được ủ mưu ở hậu trường.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi mục đích: Tanya gọi Zettour là ''ngài'';
    ''reserves'' -> ''quân dự bị'' (''Thực chất ngài muốn dùng số quân dự bị này vào
    việc gì ạ?'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi phủ định trong thoại: Zettour gọi Tanya là ''Cô''
    và xưng ''ta''; giữ câu hỏi vặn lại ''Cô không tin rằng ta chỉ đơn thuần muốn
    có sự chuẩn bị trước sao?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhượng bộ & tình thái: ''B Group'' -> ''Cụm B''; ''eastern
    front'' -> ''mặt trận phía đông''; ''at home'' -> ''ở bản quốc''; giữ mệnh đề
    nhượng bộ ''ngay cả khi họ không được thông báo về tình hình ở bản quốc'' và tình
    thái chắc chắn ở câu sau."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & phủ định: Tanya tự xưng ''mình''
    theo DEC-P01-001; ''homeland'' -> ''bản quốc''; giữ mệnh đề nhượng bộ và phủ định
    ''mình cũng không tài nào hình dung ra có điều gì cần phải bổ sung thêm vào bản
    mô tả công việc ấy cả''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định nhấn mạnh: Tanya tự xưng ''mình''
    theo DEC-P01-001, quy chiếu Zettour bằng ''ông ấy''; giữ thành ngữ nhấn mạnh phủ
    định ''có nghĩ nát óc mình cũng chẳng thể nào hiểu nổi ông ấy đang định làm gì''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & dấu chấm lửng: Tanya gọi Zettour là ''Thưa
    Tướng quân'' và xưng ''tôi''; ''reserves'' -> ''số quân dự bị này''; giữ dấu chấm
    lửng ngắt nhịp trước cụm danh từ mục đích."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, phủ định & quân hàm trong thoại: trần thuật
    quy chiếu Tanya bằng ''Nó'' theo DEC-P01-001 và Zettour bằng ''ông''; giữ phủ
    định ''quyết không bỏ sót dù chỉ một thoáng dao động nhỏ nhất''; trong thoại ''Colonel
    von Degurechaff'' -> ''Trung tá von Degurechaff'' và ''we'' -> ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn đáp lệnh: giữ ''Rõ, thưa ngài.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & dấu gạch ngang dài: Tanya tự xưng
    ''Mình'' / ''mình'' theo DEC-P01-001; ''eastern front'' -> ''mặt trận phía đông'';
    giữ dấu gạch ngang dài nối hai mệnh đề."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & phủ định: ''lieutenant general'' -> ''vị trung tướng'';
    giữ mệnh đề quan hệ phủ định ''mà những người ở cấp bậc như Tanya vẫn chưa được
    biết''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối chiếu thông tin: giữ phủ định giảm nhẹ ''nó cũng
    chẳng khác biệt là bao so với các vị trí đóng quân mà Tanya và những người chỉ
    huy khác đã được thông báo'' (trong đó ''nó'' quy chiếu tấm bản đồ)."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ đánh đổi: ''Imperial Army'' -> ''Lục quân
    Đế quốc''; ''A Group'' -> ''Cụm A''; ''B Group'' -> ''Cụm B''; ''offensive'' ->
    ''cuộc tiến công''; giữ sự đối lập về bố trí binh lực nam - bắc/trung tâm và hệ
    quả đánh đổi khiến một dải rộng lớn của mặt trận bị hớ hênh."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, thuật ngữ & phủ định: dùng ''chúng ta''; ''the
    academy'' -> ''học viện''; giữ tình thái phỏng đoán đi kèm phủ định toàn phần
    ''có lẽ chẳng một ai từng hình dung tới những điều kiện cực đoan đến mức này''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ nhân quả: quy chiếu Zettour bằng ''ông'';
    giữ sự phân biệt giữa danh nghĩa cố vấn phòng ngự với thực tế bị trút toàn bộ
    trách nhiệm lên đầu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & câu bỏ lửng: Tanya gọi Zettour là ''Thưa Tướng
    quân'' / ''ngài'' và xưng ''tôi''; ''reserve troops'' -> ''quân dự bị''; giữ dấu
    chấm lửng bỏ lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Phủ định, xưng hô & giả định trái thực tế: Zettour tự xưng ''ta'';
    giữ từ phủ định mở đầu ''Không cần thiết.'' và điều kiện giả định ''Điều đó đúng
    nếu ta định xử lý việc này theo cách thông thường.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi phủ định ngắn: Tanya gọi Zettour là ''Ngài''
    (''Ngài không làm theo cách đó sao ạ?'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô trong thoại: Zettour gọi Tanya là ''Trung tá''
    và tự xưng ''Ta''; giữ dấu chấm lửng mở đầu và nhận định ''sự thông thường là
    một thứ xa xỉ''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Câu trần thuật ngắn: giữ ''Một tiếng lẩm bẩm bất chợt vang lên.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & tình thái quá khứ: quy chiếu Zettour bằng ''Ông'';
    giữ tình thái suy đoán quá khứ ''hẳn là đã vô tình buột ra'' và khả thể ''rất
    dễ bị bỏ lọt''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & lập luận bác bỏ trong thoại: ''B Group'' -> ''Cụm
    B''; ''main lines'' -> ''các chiến tuyến chính''; ''sustained defense'' -> ''phòng
    ngự duy trì''; ''offensive defense'' -> ''phòng ngự tích cực''; giữ hình ảnh ẩn
    dụ ''chuyện viển vông'', ''mỏng như giấy'' và giải pháp duy nhất có rủi ro cực
    kỳ cao."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya gọi Zettour là ''ngài'', xưng ''tôi''
    và dùng ''chúng ta''; ''enemy field army'' -> ''đạo quân dã chiến của địch'';
    ''mobility'' -> ''tính cơ động''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ đối lập: ''B Group'' -> ''Cụm B''; ''reserves''
    -> ''lực lượng dự bị''; ''armored division'' -> ''sư đoàn thiết giáp''; giữ sự
    tương phản giữa phần lớn đã bị rút đi với việc vẫn còn một sư đoàn thiết giáp."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: ''offensive'' -> ''cuộc tiến công''; giữ
    câu phản biện phủ định ''Nhưng như vậy vẫn không đủ lực lượng để thực hiện một
    cuộc tiến công.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & tình thái suy đoán: giữ sự ngạc nhiên của Tanya và
    câu suy đoán chắc chắn ''Zettour hẳn phải biết rõ chuyện đó từ trước rồi mới phải.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, câu hỏi nội tâm & phủ định: quy chiếu Zettour
    bằng ''Ông'' / ''ông'' và Tanya bằng ''nó'' theo DEC-P01-001; giữ sự tương phản
    giữa vẻ tự tin thường ngày với sự rụt rè khác thường, câu hỏi nghi vấn về việc
    bị giáng chức và câu phủ định kết đoạn."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Tanya gọi Zettour là ''Ngài'';
    ''annihilate'' -> ''tiêu diệt hoàn toàn''; giữ câu hỏi xác nhận mở đầu bằng dấu
    chấm lửng và vế phủ định ''nhưng chẳng có lý do gì để quân địch mắc bẫy cả''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Tên riêng lịch sử & liên tưởng chiến lược: giữ nguyên ''Austerlitz'',
    ''Trafalgar'', ''Napoleon'', ''Nelson'' và nhận định về độ khó của việc nhử đối
    thủ lộ sơ hở."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & ý đồ tác chiến: Zettour gọi Tanya là ''Cô'' và tự xưng
    ''Ta''; giữ chuỗi câu hỏi dẫn dắt trên bản đồ về các tuyến đường sắt hậu cần và
    ý định tung mồi nhử để khóa chặt tuyến đường."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điều kiện tiên quyết: dùng ''chúng ta''; giữ cách diễn
    giải lại ý đồ thao túng kẻ địch và điều kiện phụ thuộc vào việc có nhử được chúng
    lộ diện hay không."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ tác chiến: dùng ''chúng ta''; ''Maneuvers,
    encirclement, annihilation'' -> ''Cơ động, bao vây, tiêu diệt hoàn toàn''; giữ
    câu hỏi đuôi và nhận định về giải pháp kinh điển, chóng vánh."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thuật ngữ & phủ định kép: quy chiếu Zettour bằng ''ông'';
    ''Imperial Army'' -> ''Lục quân Đế quốc''; ''protracted battle'' -> ''trận chiến
    kéo dài''; giữ hai cấu trúc phủ định ''không nên đánh một trận chiến kéo dài''
    và ''làm mọi cách có thể để không dây dưa kéo dài mọi chuyện''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & mệnh đề nhượng bộ: dùng ''chúng ta''; giữ quan
    hệ hệ quả - mức độ (''lớn đến mức chúng ta cần phải khẩn trương'') và mệnh đề
    nhượng bộ (''ngay cả khi việc đó đầy rủi ro'')."]'
