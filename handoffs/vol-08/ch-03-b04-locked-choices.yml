choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, dấu câu & câu hỏi mở: Zettour tự xưng ''tôi'', gọi các
    sĩ quan tham mưu là ''các vị''; giữ dấu chấm lửng và câu hỏi cuối đoạn (''Còn
    vấn đề gì khác nữa không?'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân quả & đại từ: ''Lieutenant General von Rudersdorf''
    -> ''Trung tướng von Rudersdorf''; ''Lieutenant Colonel von Degurechaff'' -> ''Trung
    tá von Degurechaff''; ''mild academic'' -> ''học giả ôn hòa''; ''relative assessment''
    -> ''sự đánh giá mang tính tương đối''; quy chiếu Zettour bằng ''Ông'' trong trần
    thuật."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & cảm thán: bọc toàn bộ câu cảm thán nội tâm
    ''*Ôi, con người ta thay đổi tùy theo môi trường biết bao!*'' trong dấu sao theo
    DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & câu hỏi tu từ: ''military man'' -> ''quân
    nhân''; ''annihilate the enemy field army'' -> ''tiêu diệt hoàn toàn đạo quân
    dã chiến của địch''; ''encirclement'' -> ''vòng vây''; Zettour dùng ''chúng ta''
    với các sĩ quan tham mưu, gọi quân địch là ''chúng'' và giữ câu hỏi đề xuất ở
    cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''staffers'' -> ''các sĩ quan tham mưu'';
    ''badges'' -> ''tấm phù hiệu''; giữ cấu trúc phủ định (''cũng không phải chỉ để
    làm cảnh'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Sắc thái & nhượng bộ: giữ sắc thái nhượng bộ (''dù vẫn còn rụt
    rè'') khi một vài sĩ quan thắc mắc lên tiếng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & dấu câu: sĩ quan tham mưu gọi Zettour là ''Thưa
    Tướng quân'' (''General''), xưng hô ''ngài''; giữ dấu chấm lửng và câu hỏi thăm
    dò về sự điềm nhiên của Zettour."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa & hàm ý: giữ nhận định về mối nghi ngờ ẩn sau lời nói rằng
    cuộc trò chuyện đang diễn tiến hơi quá trơn tru.'']'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & nhân quả: ''fog of war'' -> ''sương mù chiến
    tranh''; giữ phủ định (''mà chẳng mảy may bận tâm tới'') và quan hệ nguồn gốc
    (''bắt nguồn từ một mánh khóe'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Phủ định tình thái & thuật ngữ: giữ phủ định tình thái (''Có vẻ
    không giống như ông đã tiên đoán được...''); ''backup plan'' -> ''phương án dự
    phòng''; quy chiếu Zettour bằng ''ông'' và kẻ địch bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Tình thái tất yếu & dấu câu: giữ câu suy luận bỏ lửng ''Điều đó
    chỉ có thể có nghĩa là…''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế, quân hàm & thuật ngữ: giữ điều kiện giả
    định (''nếu họ không đánh hơi thấy có điều gì đó bất thường, hẳn ông đã phải than
    thở cho sự ngây thơ của họ rồi''); ''staff officer'' / ''staffer'' -> ''sĩ quan
    tham mưu''; ''Lieutenant Colonel Uger'' -> ''Trung tá Uger''; giữ điều kiện phủ
    định (''Nếu không có... rất dễ bị đào thải'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu trả lời ngắn gọn của Zettour ''“Chỉ là kinh nghiệm
    và sự chuẩn bị thôi.”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định bộ phận: chỉ bọc ''*chuẩn bị*''
    trong dấu sao theo DEC-P01-002; giữ phủ định bộ phận ở câu cuối (''Xem ra không
    phải ai trong số họ cũng nhút nhát.'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Định danh đơn vị & dấu câu: ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''; giữ câu hỏi bỏ lửng với dấu chấm lửng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định giới hạn & xưng hô: giữ phủ định
    giới hạn (''Tôi sẽ không đi xa đến mức phủ nhận điều đó đâu''); chỉ bọc câu nội
    tâm ''*Đúng đấy, những nghi ngờ mơ hồ của các vị hoàn toàn chính xác.*'' trong
    dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu chuyển đoạn ngắn gọn ''Hãy đi thẳng vào sự thật.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phạm vi giới hạn & nhân quả: ''The Empire'' -> ''Đế
    quốc''; ''main forces'' -> ''lực lượng chủ lực''; ''eastern front'' -> ''mặt trận
    phía đông''; ''selection and concentration'' -> ''lựa chọn và tập trung''; ''staff
    of the eastern army'' -> ''bộ tham mưu của đạo quân phía đông''; giữ giới hạn
    (''lẽ ra chỉ được phép giới hạn bản thân trong việc bảo vệ những gì mình đang
    nắm giữ'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: ''General'' -> ''Thưa Tướng quân'';
    xưng hô ''ngài''; ''existing defensive policy'' -> ''chủ trương phòng ngự hiện
    hành''; giữ câu hỏi chất vấn về việc tự ý bác bỏ chủ trương bằng thẩm quyền riêng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ lời đáp ngắn gọn của Zettour ''“Diễn giải như thế thì
    ác ý quá.”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Phủ định tuyệt đối & cảm thán: giữ câu phản bác ''“Nhưng chẳng
    còn lời giải thích nào khác cả!”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Đối lập, dấu câu & định danh: giữ đối lập hướng nhìn (''Trong
    lúc tất cả các vị mải nhìn về bên phải, tôi đã đề phòng phía bên trái—chỉ có vậy
    thôi''); giữ dấu gạch ngang dài; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen'';
    xưng hô ''tôi'' - ''các vị''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: ''General'' -> ''Thưa Tướng quân''; xưng hô
    ''ngài''; giữ câu hỏi phản ứng ''sao ngài có thể nói như vậy được?''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & địa danh: ''eastern front'' -> ''mặt trận
    phía đông''; ''Soldim 528'' -> ''Soldim 528''; giữ phủ định (''chẳng lời nào ông
    nói đủ sức thuyết phục họ'') và hệ quả (''Lựa chọn duy nhất còn lại của ông là
    buộc Degurechaff phải đánh cược mạng sống...'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & nhân quả: giữ phủ định (''chẳng khó khăn
    gì lắm đâu''); ''textbook defense'' -> ''thế phòng ngự theo sách giáo khoa'';
    ''pipe dream'' -> ''giấc mộng hão huyền''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Nói lắp, dấu câu & xưng hô: giữ tật nói lắp đầu câu (''V-vậy''),
    dấu chấm lửng, đại từ ''ngài'' (Zettour) và ''họ'' (Kampfgruppe Lergen)."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm & tổ chức: chỉ bọc đúng ba cụm ''*quyết
    định tự nguyện*'', ''*hy sinh quên mình*'' và ''*Đại tá von Lergen*'' trong dấu
    sao theo DEC-P01-002; ''Operations'' -> ''Cục Tác chiến''; giữ dấu gạch ngang
    dài và đại từ ''anh ấy'' quy chiếu Đại tá von Lergen."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & đại từ: chỉ bọc ''*cô nàng*'' trong
    dấu sao theo DEC-P01-002; giữ phủ định (''chẳng hề tự nguyện chút nào'') và dấu
    chấm lửng; ''Lieutenant Colonel Degurechaff'' -> ''Trung tá Degurechaff''; quy
    chiếu Zettour bằng ''ông'' và Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Đối lập & lượng từ hạn chế: giữ quan hệ đối lập giữa ''Màn đánh
    tráo ấy thật nực cười'' và thực tế ''hiếm có ai lại từ chối tiến hành giải cứu
    sau khi nghe lời giải thích đó''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ, phủ định & câu hỏi tu từ: ''The colonel''
    -> ''vị đại tá'' (quy chiếu bằng ''Anh ấy''); ''tactical call'' -> ''quyết định
    chiến thuật''; ''lose the initiative'' -> ''đánh mất thế chủ động''; ''thinking
    at the operational level'' -> ''tư duy ở cấp độ chiến dịch''; ''passive defense''
    -> ''thế phòng ngự bị động''; ''gentlemen'' -> ''thưa các quý ông''; giữ câu hỏi
    tu từ phủ định ở cuối đoạn (''chẳng phải chúng ta nên xuất kích nghênh đón chúng
    sao?'')."]'
