segment_id_end: YS-LN08/Text/chapter002.xhtml/p000031
choices:
- segment_id: YS-LN08/Text/chapter002.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ định dạng viết hoa toàn bộ ''HẬU
    CHIẾN, TẠI LONDINIUM''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc chính xác bốn cụm ''*tác chiến*'',
    ''*chiến dịch quân sự*'', ''*trận đánh dàn trận*'' và ''*trận quyết chiến*'' theo
    DEC-P01-002; giữ tình thái khẳng định chắc chắn (''tất nhiên'', ''chắc chắn đều
    có chiến đấu'')."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc nhấn mạnh: ''eastern front'' -> ''mặt trận
    phía đông''; giữ cấu trúc nhấn mạnh ''chính dòng máu rỉ ra chậm rãi hơn mới vắt
    kiệt hai đạo quân đối địch''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''veterans'' -> ''các cựu binh''; ''eastern
    front'' -> ''mặt trận phía đông''; ''skirmishes'' -> ''cuộc đụng độ nhỏ lẻ'';
    ''theater of operations'' -> ''chiến trường''; giữ mệnh đề phủ định ''nơi mà những
    cuộc cơ động quy mô lớn đơn giản là không hề xảy ra''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''the Rhine'' -> ''mặt trận Rhine''; giữ câu trần thuật
    ngắn liên kết mạch so sánh."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nghĩa: chỉ bọc cụm ''*không có gì để báo
    cáo*'' trong dấu sao theo DEC-P01-002; giữ hình ảnh đối lập với ''những núi xác
    cao ngất ẩn khuất phía sau''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thời gian: giữ hai phủ định (''không xuất
    hiện trong sách lịch sử'', ''hầu như chẳng bao giờ được tưởng nhớ''), khẳng định
    (''không còn nghi ngờ gì nữa'') và sự chuyển đổi thời gian từ quá khứ (''đã được
    định đoạt'') sang hiện tại (''giờ đây... đang yên giấc trong lặng im'')."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: người kể chuyện ngôi thứ nhất Andrew tự xưng
    ''tôi'' (quy ước DEC-P01-001 chỉ áp dụng cho Tanya)."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: Andrew tự xưng ''Tôi''; ''embedded
    reporters'' -> ''phóng viên đi theo đơn vị''; giữ mệnh đề quan hệ phủ định ''mà
    chẳng ai nhắc đến''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: Andrew xưng ''Tôi''; ''memoir''
    -> ''hồi ký''; ''preface'' -> ''lời tựa''; giữ tình thái suy đoán ''Có lẽ tôi
    là người quá giàu sự đồng cảm''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tự vấn & tình thái: giữ câu hỏi nghi vấn nội tâm với tình
    thái ''Hay biết đâu... tôi hy vọng sẽ thoát khỏi quá khứ?''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Phủ định giảm nhẹ & sắc thái: giữ hai cấu trúc phủ định giảm nhẹ
    (''Tôi không cho rằng mình đặc biệt muốn chạy trốn'', ''tôi cũng sẽ không gọi
    đó là những tháng ngày hạnh phúc'') và cụm tự giễu ''một gã bất lương chán chường
    sự đời''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý: giữ câu khẳng định ngắn ''Dẫu vậy, tôi vẫn là
    một nhân chứng.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & thuật ngữ: giữ sự dè dặt về độ tin cậy của
    ký ức (''Khó mà nói được...'', ''chẳng có mấy khả năng tôi nhớ chính xác mọi điều
    mình từng thấy'', ''không thực sự nắm được''); ''Federation'' -> ''Liên bang''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi ngoặc đơn: ''reporter embedded with the multinational
    unit'' -> ''phóng viên đi theo đơn vị đa quốc gia''; ''Federation'' -> ''Liên
    bang''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''heads of state'' ->
    ''nguyên thủ hai nước''; ''brothers-in-arms'' -> ''những người chiến hữu''; giữ
    nguyên phần ngoặc đơn và câu hỏi hướng tới độc giả trẻ."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & dấu câu: chỉ bọc chữ ''*bởi vì*'' trong dấu
    sao theo DEC-P01-002; giữ cặp dấu gạch ngang dài bao quanh ''nghịch lý thay''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''Federation authorities'' -> ''nhà chức trách
    Liên bang''; giữ sự mỉa mai rằng kẻ non nớt và thiếu hiểu biết lại là ứng viên
    hoàn hảo."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng kể: ''embedded reporters'' -> ''các phóng viên
    đi theo đơn vị''; ''Communist'' -> ''người Cộng sản''; giữ nhịp tự sửa lời bằng
    gạch ngang và ngoặc kép (''điên rồ—xin thứ lỗi, ý tôi là “nhiệt huyết”'')."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ tình thái ''Nhưng có lẽ tôi nên biết ơn vì...''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: dùng ''chúng ta'' cho ''we'' (người viết và
    độc giả) và ''người ta'' cho ''you'' khái quát; giữ tình thái ''Xem ra'' và ''Có
    lẽ''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn: giữ câu ngắn điệp từ ''Ký ức, phải rồi. Những ký ức.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & đại từ: ''Toad Offensive'' -> ''Cuộc tiến
    công Cóc''; ''Operation Andromeda'' -> ''Chiến dịch Andromeda''; ''Imperial Army''
    -> ''Lục quân Đế quốc''; ''phantom Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen
    xuất quỷ nhập thần kia''; ''censors'' -> ''bộ phận kiểm duyệt''; giữ tình thái
    suy đoán ''có lẽ chính là'' và đại từ ''chúng tôi'' chỉ phe đơn vị đa quốc gia."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán quá khứ, phủ định kép & thuật ngữ: giữ tình
    thái ''hẳn các nhân viên kiểm duyệt đã có...'' và phủ định kép ''chẳng thể nào
    tránh khỏi việc phạm phải quy định này hay quy định khác''; ''multinational unit
    of Federation and Commonwealth troops'' -> ''đơn vị đa quốc gia gồm binh lính
    Liên bang và Khối Thịnh vượng chung''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ nhận định mỉa mai rằng kết quả lại trở thành tài liệu
    tham khảo hữu ích để học cách diễn giải đúng một bài báo.'']'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Xưng hô với độc giả & câu cảm thán: Andrew xưng ''tôi'' và gọi
    ''young readers'' là ''các bạn''; giữ nguyên câu cảm thán ở cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Tình thái trái thực tế & phủ định kép: giữ tình thái ''Những gì
    đáng lý phải là bản tin dựa trên sự thật'', phép ví von với chuyến thám hiểm lên
    bề mặt mặt trăng, và cấu trúc phủ định kép ''không tài nào tìm ra sự thật đã diễn
    ra nếu không đọc hiểu ẩn ý giữa các dòng chữ''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thành ngữ: ''hard truths that couldn’t be swept under
    the rug'' -> ''những sự thật phũ phàng không thể bị giấu nhẹm''; ''front page''
    -> ''trang nhất''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''“Zettour the Terrible”'' -> ''“Zettour
    Bạo tàn”''; ''eastern front'' -> ''mặt trận phía đông''; giữ dấu chấm lửng trước
    ''một sinh vật đáng sợ''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Phủ định, đại từ & thuật ngữ: giữ phủ định ''Ngay cả bây giờ,
    tôi cũng không nghĩ có ai có thể kể lại đầy đủ...''; quy chiếu Zettour bằng ''ông
    ta'' / ''con người ấy''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; giữ dấu
    hai chấm mở ra lời kết ở đoạn sau."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''Imperial Army General Staff'' -> ''Bộ
    Tổng tham mưu Lục quân Đế quốc''; ''that lunatic'' -> ''gã điên đó''; ''eastern
    front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & cấu trúc nhấn mạnh: ''Imperial Army'' ->
    ''Lục quân Đế quốc''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''eastern
    front'' -> ''mặt trận phía đông''; giữ tình thái ''có thể coi là'', ''Có lẽ tôi
    nên'' và cấu trúc nhấn mạnh ''không ai khác ngoài Zettour đã biến cuộc sống của
    chúng tôi thành địa ngục''."]'
