choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu hỏi ngắn gọn, lạnh lùng của Tanechka (''Chuyện
    gì?'') đáp lại lời mở đầu của Drake ở cuối lô trước."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: Drake xưng ''Tôi'', dùng ''chúng
    ta''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; giữ cấu trúc phủ định (''Tôi
    không có ý định làm theo một mệnh lệnh bắt chúng ta khoanh tay ngồi nhìn trong
    một cuộc vây hãm khi điều đó đồng nghĩa với việc dâng quyền chủ động cho địch'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & cấu trúc tăng tiến: bảo toàn chính xác chữ nghiêng
    cho câu hỏi tu từ cuối đoạn ''*Chứ không thì cần có sĩ quan để làm gì cơ chứ?!*''
    theo DEC-P01-002; giữ cấu trúc ''Không chỉ sĩ quan quân đội mà bất kỳ ai dẫn dắt
    người khác đều cần phải...''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ, đại từ & phủ định: ''Colonel Mikel'' -> ''Đại
    tá Mikel''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''Communist Party''
    -> ''Đảng Cộng sản''; dùng ''tôi'' và ''chúng tôi'' (phân biệt với phía Đảng Cộng
    sản của quốc gia khác); giữ phủ định ''Chẳng có lý do gì buộc tôi phải tuân theo
    mệnh lệnh từ Đảng Cộng sản của một quốc gia khác cả''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: Tanechka gọi Drake là ''ngài'', tự xưng phía
    mình là ''chúng tôi''; ''Western journalists'' -> ''các nhà báo phương Tây'';
    giữ sắc thái phẫn nộ về thể diện chính trị."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Drake gọi Tanechka là ''Thưa cô'' / ''cô'',
    xưng ''tôi'', dùng ''Chúng ta''; ''the Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng điệu: Tanechka gọi Drake là ''ngài'', dùng ''chúng
    ta''; giữ giọng phản bác sắc lạnh (''Đúng như ngài đã tinh tường nhận xét...'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái: ''political officers'' -> ''các
    sĩ quan chính trị''; quy chiếu bằng ''họ''; giữ mức tình thái ''chiến thắng rất
    có thể sẽ tuột khỏi tầm tay''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Đại từ phân ngôi & thuật ngữ: phân biệt rõ ''chúng tôi'' (lực
    lượng Khối Thịnh vượng chung) và ''quân đội các người'' (Quân đội Liên bang);
    ''mages'' -> ''pháp sư''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Phủ định & từ vựng: Tanechka xưng ''Tôi''; giữ câu từ chối ''Tôi
    không thể làm vậy!'' và cụm ''Tự ý hành động'' để liên kết từ vựng với p000549."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, quân hàm & thuật ngữ: trần thuật quy chiếu
    Drake bằng ''Ông'', trong thoại Drake xưng ''tôi'' - ''cô'', dùng ''chúng tôi''
    (đơn vị) và ''Chúng ta''; ''HQ'' -> ''Sở chỉ huy''; ''political officer'' -> ''sĩ
    quan chính trị''; ''Colonel Mikel'' -> ''Đại tá Mikel''; ''officers’ academy''
    -> ''trường sĩ quan''; ''eastern front'' -> ''mặt trận phía đông''; ''Devil of
    the Rhine'' -> ''Ác quỷ sông Rhine''; ''all-out offensive'' -> ''cuộc tổng tấn
    công''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: quy chiếu Drake bằng ''Ông''; ''political
    officer'' -> ''viên sĩ quan chính trị''; giữ mệnh đề phủ định ''mà không kiểm
    tra xem ai có thể đang nghe thấy đã dẫn đến hậu quả tai hại''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & phủ định: ''magic first lieutenant'' -> ''trung
    úy pháp sư''; ''canteen'' -> ''chiếc bi đông''; quy chiếu Drake bằng ''ông'';
    giữ phủ định ''chẳng mảy may bận tâm tới chiếc bi đông mình vừa đánh rơi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000531
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & sắc thái: giữ nhận định cảm thán ngắn gọn theo điểm
    nhìn của Drake về thời điểm tồi tệ nhất.'']'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000532
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: giữ dấu chấm lửng mở đầu và đại từ ''Ả ta''
    trong lời lẩm bẩm của Mary Sue khi nhắc tới Ác quỷ sông Rhine."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000533
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu trần thuật ngắn gọn ''Đã quá muộn để làm bất cứ
    điều gì.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000534
  kind: terminology_and_voice
  value: 'choices=["Quân hàm: dịch ''Lieutenant Sue'' là ''Trung úy Sue'' khớp với
    cấp bậc ''first lieutenant'' ở p000530."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000535
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Mary Sue bằng ''cô nàng'' / ''cô'',
    Drake bằng ''ông''; giữ phủ định ''ông thừa biết cô không phải kiểu người sẽ về
    phòng rồi ngồi yên một chỗ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000536
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & thành ngữ: dịch ''that girl'' là ''con bé đó'',
    ''jumping the gun'' là ''hấp tấp cầm đèn chạy trước ô tô'' đúng giọng bực dọc
    của Drake."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000537
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, điểm nhìn & thuật ngữ: bảo toàn chính xác chữ nghiêng
    cho câu độc thoại nội tâm ''*Mình phải ngăn cô ta lại*'' theo DEC-P01-002; ''political
    officer'' -> ''viên sĩ quan chính trị''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000538
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: quy chiếu Drake bằng ''ông'', Mary
    Sue bằng ''cô nàng'' / ''cô''; ''voluntary mages'' -> ''các pháp sư tình nguyện'';
    giữ các bậc tình thái (''có vẻ đang trực chiến'', ''rõ ràng là họ đã thất bại'',
    ''Xem chừng cô đang bắt đầu một chuyến bay tầm xa, vòng qua trận địa địch'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000539
  kind: terminology_and_voice
  value: 'choices=["Phân biệt đại từ quy chiếu: phân biệt rõ chủ ngữ ''Cô ta'' (Mary
    Sue) và tân ngữ ''ả'' (Ác quỷ sông Rhine) trong câu thốt lên bị ngắt nhịp của
    Drake (''Cái đồ—Cô ta thực sự định đuổi theo ả sao?'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000540
  kind: terminology_and_voice
  value: 'choices=["Giả định & giọng điệu: giữ câu điều kiện giả định ở quá khứ phản
    ánh sự bất lực của Drake (''Nếu cô nàng chỉ muốn bùng nổ, thì thiếu gì hướng tốt
    hơn để lao đi cơ chứ!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Giả định đối lập & đại từ: giữ thế đối lập giữa khả thể bị bỏ
    qua (''Lẽ ra cô ta có thể tấn công trận địa địch'') và hành động thực tế (''vậy
    mà thay vào đó lại định đuổi theo đám pháp sư địch ư?!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chữ nghiêng cho toàn bộ đoạn độc
    thoại nội tâm của Drake theo DEC-P01-002; tự xưng ''Mình''; ''encirclement'' ->
    ''việc bao vây''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Drake bằng ''ông'' / ''Ông''; giữ
    phủ định ''ông chẳng muốn đi chút nào. Ông hoàn toàn phản đối chuyện đó.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & thuật ngữ: ''main enemy defensive force'' ->
    ''lực lượng phòng ngự chủ lực của địch''; giữ câu hỏi tự vấn không in nghiêng
    như nguyên bản."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Drake bằng ''Ông'' / ''ông''; ''bereaved
    families'' -> ''gia đình có người tử trận''; giữ phủ định ''Ông thậm chí chẳng
    cần tự hỏi mình—câu trả lời đã quá rõ ràng.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & thuật ngữ: bảo toàn chính xác chữ nghiêng cho câu
    hỏi giả định ở nửa sau đoạn ''*Tại sao gã sĩ quan cấp trên bất tài đó lại cứ thế
    lao đầu đuổi theo lực lượng chủ lực của địch mà không có kế hoạch gì cơ chứ?*''
    theo DEC-P01-002; ''the home country'' -> ''chính quốc''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý & thuật ngữ: giữ quan hệ đối lập ''Nhưng xét
    thuần túy trên phương diện chiến thuật, đây lại là một cơ hội tuyệt vời để cầm
    chân quân địch.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & đại từ: quy chiếu bằng ''họ''; giữ cấu trúc câu điều
    kiện điệp ý chấp nhận thực tế (''Nếu đã buộc phải làm việc cần làm, thì họ chỉ
    đơn giản là phải làm mà thôi.'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & đại từ: ''HQ'' -> ''Sở chỉ huy''; ''Lergen
    Kampfgruppe'' -> ''Kampfgruppe Lergen''; giữ tình thái ''dường như đã tự ý xuất
    kích'' và đại từ ''chúng tôi'' - ''chúng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Tình thái, điều kiện & quân hàm: ''pursuit battle'' -> ''trận
    đánh truy kích''; ''the colonel'' (quy chiếu Mikel) -> ''vị đại tá''; giữ đối
    lập giữa vẻ ngoài của bức điện (''có người hẳn sẽ tưởng rằng...'') và kỳ vọng
    của Drake (''nếu Mikel nhận được nó, vị đại tá sẽ hiểu được tâm trạng thực sự
    của ông'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại: giữ câu hô ngắn gọn, dứt khoát của Drake
    (''Cứ giao cho tôi!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Drake bằng ''Ông''; giữ hai mệnh
    đề phủ định (''chẳng hề ưa việc nhắm mắt làm liều'' và ''Ông không thể phủ nhận
    điều đó'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Định dạng & thuật ngữ tiêu đề chuyển cảnh: giữ toàn bộ chữ in
    hoa ''CÙNG LÚC ĐÓ, KHÔNG PHẬN QUÂN KHU PHÍA ĐÔNG, DẪN ĐẦU TIỂU ĐOÀN PHÁP SƯ TRÊN
    KHÔNG SỐ 203''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: chuyển sang điểm nhìn tập thể Tiểu đoàn 203
    với đại từ ngôi thứ nhất số nhiều ''Chúng tôi'', gọi địch là ''quân địch'' / ''chúng'';
    giữ giọng văn cơ động, sắc bén (''lẻn ra áp sát quân địch và tung cú đá vào hậu
    phương của chúng'')."]'
