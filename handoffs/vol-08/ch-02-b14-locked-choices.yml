- segment_id: YS-LN08/Text/chapter008.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & từ chối lịch sự trong thoại: Tanya gọi Zettour
    là ''ngài'' và xưng ''tôi''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen'';
    giữ câu hỏi xác nhận ý đồ dùng làm mồi nhử và lời từ chối ''Đáng tiếc là tôi xin
    phép được từ chối.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & chức vụ trong thoại: Zettour gọi Tanya là
    ''Cô'' / ''Trung tá'' và tự xưng ''ta''; ''deputy chief of the Service Corps in
    the General Staff'' -> ''Cục phó Cục Quân vụ thuộc Bộ Tổng tham mưu''; giữ mệnh
    đề nhượng bộ về thẩm quyền với quân địa phương đối lập với quyền hạn trọn vẹn
    ở Bộ Tổng tham mưu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & dấu gạch ngang dài: Tanya tự xưng
    ''mình'' theo DEC-P01-001, quy chiếu Zettour bằng ''Ông''; ''chain of command''
    -> ''hệ thống chỉ huy''; giữ dấu gạch ngang dài nhấn mạnh thứ vũ khí bí mật."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi đại từ trần thuật - nội tâm & phủ định: trần thuật
    quy chiếu Tanya bằng ''nó'' và nội tâm tự quy chiếu bằng ''mình'' theo DEC-P01-001;
    ''General Staff'' -> ''Bộ Tổng tham mưu''; ''deputy chief of the Service Corps
    in the General Staff'' -> ''Cục phó Cục Quân vụ thuộc Bộ Tổng tham mưu''; giữ
    phủ định triệt để ''Ngay từ đầu mình vốn đã chẳng có quyền từ chối rồi.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & mong muốn giả định: Tanya gọi Zettour là ''ngài''
    và xưng ''tôi''; ''a company'' -> ''một đại đội''; giữ sự chuyển ý từ việc không
    thể phản đối mệnh lệnh sang mong muốn đòi lại đại đội để đảm bảo chuẩn bị tác
    chiến."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ trong thoại: Zettour gọi Tanya là
    ''Cô'' / ''cô'' và tự xưng ''ta''; ''rapid response force'' -> ''lực lượng phản
    ứng nhanh''; ''observer'' -> ''viên quan sát viên''; giữ phủ định về sự đảm bảo
    huy động lực lượng, lời từ chối và đề nghị cất gánh nặng quan sát viên."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thuật ngữ & ẩn dụ khẩu ngữ: quy chiếu Zettour bằng
    ''ông''; ''front lines'' -> ''tiền tuyến''; giữ cách gọi ''những đứa con cưng
    của Tanya'', ''cục nợ ăn hại'' và câu cảm thán ''Đúng là cướp ngày mà.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi phủ định: trong thoại Tanya dùng
    ''chúng tôi'' / ''tôi''; ''the rear'' -> ''hậu phương''; giữ câu hỏi phủ định
    ''Nói cách khác, tôi sẽ chẳng còn kẽ hở nào để viện cớ thoái thác nữa sao?''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu chấm lửng trong thoại: Zettour gọi Tanya là ''cô''
    và tự xưng ''Ta'' / ''ta''; giữ dấu chấm lửng và ý bắt Tanya phải chịu lấm bùn
    vì mình."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn nội tâm & giả định trái thực tế:
    dùng ''*Hãy lội xuống vũng bùn lầy đi.*'' đúng phạm vi thẻ em trong nguồn theo
    DEC-P01-002; Tanya tự xưng ''mình'' theo DEC-P01-001; ''General Staff'' -> ''Bộ
    Tổng tham mưu''; ''Labor Standards Inspection Office'' -> ''Văn phòng Thanh tra
    Tiêu chuẩn Lao động''; giữ câu điều kiện giả định trái thực tế ở thời chiến."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi xác nhận: Tanya gọi Zettour là ''ngài'' và xưng
    ''tôi''; ''a company'' -> ''một đại đội''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & ẩn dụ đánh cược: Zettour tự xưng ''ta''; giữ lời khẳng
    định ''Đúng vậy.'' và ẩn dụ ''vốn mồi để ta tung xúc xắc''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định: Tanya gọi Zettour là ''ngài'' /
    ''thưa Tướng quân'' và xưng ''Tôi'' / ''tôi''; giữ phủ định nhấn mạnh ''Tôi hoàn
    toàn không ngờ ngài lại là một người ưa đỏ đen đấy''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô trong câu hỏi: Zettour gọi Tanya là ''Trung
    tá von Degurechaff'' và ''cô''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000228
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tật nói lắp do bất ngờ: Tanya gọi Zettour là ''ngài'';
    giữ nhịp lắp bắp ''Hả? Ý-ý ngài là đua ngựa ạ?''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000229
  kind: terminology_and_voice
  value: 'choices=["Thoại xác nhận ngắn: giữ ''Đúng thế.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000230
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thoại ngập ngừng: giữ miêu tả sự ngơ ngác của Tanya
    và câu thoại bỏ lửng ''Dạ không, ý tôi là, tôi…''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định quá khứ trong thoại: Zettour gọi Tanya là ''cô''
    và dùng ''chúng ta''; giữ khẳng định đi kèm phủ định ''Chắc chắn là cô chưa từng
