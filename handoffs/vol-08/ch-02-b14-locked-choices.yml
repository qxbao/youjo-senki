    với rủi ro do thiếu huấn luyện."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000245
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, quân hàm & tình thái: ''aerial magic officer'' -> ''sĩ
    quan ma pháp trên không''; ''the academy'' -> ''học viện''; ''First Lieutenant
    Grantz'' -> ''Trung úy Grantz''; giữ tình thái giới hạn ''ở một mức độ nhất định''
    và suy đoán ''có lẽ là lựa chọn an toàn''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000246
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & dấu chấm lửng trong thoại: ''first lieutenant named
    Grantz'' -> ''trung úy trẻ tên là Grantz''; giữ dấu chấm lửng ở cả đầu và cuối
    câu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000247
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong lời cảm ơn: Zettour tự xưng ''Ta'' và gọi Tanya
    là ''cô'' (''Ta rất cảm kích cô.'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000248
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, tình thái & đại từ khái quát: quy chiếu Zettour bằng
    ''ông''; giữ tình thái phỏng đoán ''Có lẽ'', mức độ khó cảm nhận sự chân thành
    (''thật khó mà cảm nhận được chút lòng biết ơn chân thành nào'') và đại từ khái
    quát ''bạn'' ở câu đúc kết cuối đoạn."]'
