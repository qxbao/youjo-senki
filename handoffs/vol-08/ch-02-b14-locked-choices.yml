- segment_id: YS-LN08/Text/chapter008.xhtml/p000244
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, quân hàm & lập luận loại trừ: ''First Lieutenant Wüstemann’s
    replacement company'' -> ''đại đội bổ sung của Trung úy Wüstemann''; giữ phủ định
