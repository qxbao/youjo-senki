- segment_id: YS-LN08/Text/chapter008.xhtml/p000235
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định kép: Tanya gọi Zettour là ''ngài'' và xưng
    ''tôi''; giữ hai phủ định (''không chuộng chuyện cá cược'', ''không rõ điều đó
