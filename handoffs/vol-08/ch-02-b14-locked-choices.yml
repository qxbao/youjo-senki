- segment_id: YS-LN08/Text/chapter008.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp lễ ngắn: giữ ''Vâng, thưa ngài.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ điều kiện - phủ định: quy chiếu Zettour bằng
    ''ông''; giữ mệnh đề điều kiện và phủ định ''thì cũng chẳng cần chọc vào con rắn
    độc ấy làm gì''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, cấu trúc phủ định - đối lập & ẩn dụ chiến tranh: ''Colonel''
