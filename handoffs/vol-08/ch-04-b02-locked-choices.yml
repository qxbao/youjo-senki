choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái mỉa mai: giữ tương phản giữa việc gom lúa mì
    cháy sém (''vẫn còn bõ công'') với việc gom đạn pháo đã phát nổ để tái sử dụng,
    cùng câu kết ngắn ''Tái chế cũng có giới hạn của nó thôi''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi: dùng ''chúng ta'' trong lời thoại
    của Tanya; ''periphery'' -> ''vòng ngoài''; ''all-out offensive'' -> ''cuộc tổng
    tấn công''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & nhịp câu: giữ mô tả chuẩn bài bản công – thủ theo sách
    giáo khoa (''Đúng chuẩn công thủ theo sách giáo khoa'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: giữ tên riêng ''Tanya''; ''preparatory bombardment''
    -> ''đợt pháo kích chuẩn bị''; ''Gjallarhorn'' -> ''chiếc tù và Gjallarhorn'';
    ''aerial mages'' -> ''các pháp sư trên không''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu nhận định ngắn gọn ''Về lý thuyết là vậy.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ đối lập: ''tactical sneak attack'' -> ''cuộc
    tập kích bất ngờ về mặt chiến thuật''; ''short, concentrated bombardment'' ->
    ''đợt pháo kích ngắn và tập trung''; ''supporting artillery fire'' -> ''hỏa lực
    pháo binh chi viện''; ''offensive'' -> ''cuộc tiến công''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ cấu trúc phủ định tăng tiến ''Đây thậm
    chí còn chẳng phải một cuộc tập kích ban đêm''; ''preparatory bombardment'' ->
    ''pháo kích chuẩn bị''; quy chiếu quân địch bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Meybert gọi Tanya là ''thưa Trung tá'' (''Colonel'')
    kèm tiểu từ kính ngữ ''ạ''; giữ câu hỏi phỏng đoán phủ định về lượng đạn pháo
    của địch."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nửa đầu câu trần thuật ngôi thứ ba (''Tanya''),
    nửa sau chuyển sang độc thoại nội tâm ngôi thứ nhất số nhiều (''chúng ta không
    thể chiều theo sự lạc quan được'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, thuật ngữ & câu hỏi: độc thoại nội tâm tự quy
    chiếu của Tanya dùng ''mình'' theo DEC-P01-001; ''Federation'' -> ''Liên bang'';
    ''matériel'' -> ''vật tư và trang bị quân sự''; giữ câu hỏi tu từ hoài nghi ở
    cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: giữ đại từ ''chúng ta'' trong lời nhắc nhở cảnh
    giác của Tanya."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & nghĩa: giữ liên từ nhượng bộ ''Dẫu đúng là...'' và
    nhận định ''Chính điều đó mới làm tình hình trở nên khó lường.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & nhân vật: dùng ''chúng ta'' trong lời phân
    tích của Tanya; ''Lieutenant Tospan’s unit'' -> ''đơn vị của Trung úy Tospan''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: giữ đúng phạm vi in nghiêng ''*Không
    thể trông mong gì nhiều ở anh ta được*'' theo DEC-P01-002; nội tâm tự quy chiếu
    của Tanya dùng ''mình'' theo DEC-P01-001; quy chiếu Tospan bằng ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật ngôi thứ ba quy chiếu
    Tanya bằng ''Tanya'' và ''cô''; ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ tên riêng ''Serebryakov'' và sắc thái khẩu ngữ mỉa mai (''đá đít đám bộ binh'',
    ''thu xếp sẵn cả tã lót nếu cần'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Tanya’s adjutant'' -> ''Viên sĩ quan phụ
    tá của Tanya''; ''comms equipment'' -> ''thiết bị thông tin liên lạc''; quy chiếu
    Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & giọng thoại: ''Lieutenant Tospan'' -> ''Trung
    úy Tospan''; giữ tiểu từ báo cáo ''ạ'' của Serebryakov."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đại từ: Tanya xưng ''tôi'' khi ra lệnh cho Serebryakov
    đưa ống nghe; trần thuật quy chiếu Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm của Tanya dùng ''chúng
    ta'' khi nói về tình thế đơn vị và ''mình'' khi tự quy chiếu cá nhân theo DEC-P01-001;
    gọi trực tiếp ''Trung úy Tospan'' bằng ''anh'' trong độc thoại nội tâm; ''Commies''
    -> ''đám Cộng sản''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & xưng hô: ''Lieutenant Colonel von Degurechaff''
    -> ''Trung tá von Degurechaff''; ''Lieutenant Tospan'' -> ''Trung úy Tospan'';
    gọi Tospan là ''anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tospan đáp ''Rõ, thưa Trung tá'' (''Yes,
    ma’am'') và xưng hô ''Trung tá'' kèm kính ngữ ''ạ''; ''orders'' -> ''chỉ thị''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & liên kết từ vựng: lặp lại đúng từ ''“Chỉ thị?”''
    khớp với p000050; trần thuật quy chiếu Tanya bằng ''cô'' và Tospan bằng ''anh
    ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi: quy chiếu Tanya bằng ''cô''; giữ câu hỏi tu
    từ thể hiện sự ngỡ ngàng trước yêu cầu xin chỉ thị vào phút chót."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Tospan bằng ''Anh ta''; ''commander
    of the Kampfgruppe'' -> ''chỉ huy trưởng Kampfgruppe''; ''HQ'' -> ''sở chỉ huy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đại từ: Tanya xưng ''tôi'' (kết hợp tự quy chiếu ''mình''
    trong mệnh đề phụ) và gọi ''Trung úy Tospan'' là ''anh''; giữ nhất quán từ ''chỉ
    thị'' cho ''orders''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & nghĩa: Tospan gọi Tanya là ''thưa Trung tá''
    (''Colonel'') và xưng ''chúng tôi'' đại diện cho đơn vị bộ binh; ''orders to fight
    to our deaths'' -> ''lệnh cho chúng tôi tử chiến đến cùng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & chú thích: gọi Tospan là ''Anh''; ''infantry
    manual²'' -> ''cẩm nang bộ binh²'' (giữ nguyên chỉ số chú thích trên cao ²)."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện: Tospan gọi Tanya là ''Trung tá'' và xưng
    ''chúng tôi''; giữ mệnh đề điều kiện bỏ lửng ''nếu Trung tá hạ lệnh cho chúng
    tôi lấy mạng sống ra tử thủ…''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: độc thoại nội tâm tự quy chiếu của Tanya dùng
    ''Mình'' theo DEC-P01-001; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu trần thuật ngắn ''Tanya bất giác nhoẻn miệng cười.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại: trần thuật quy chiếu Tanya bằng ''cô'' và
    Tospan bằng ''anh ta''; giữ lời khen ngắn gọn ''“Đúng là một gã cừ khôi.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ, cấu trúc so sánh & điều kiện: ''human sacrifice'' -> ''vật
    tế sống''; giữ cấu trúc so sánh tăng tiến ''Đầu óc càng nhạy bén, bánh răng suy
    nghĩ quay càng nhanh thì lại càng dễ bỏ chạy khi lâm vào khủng hoảng''; ''meat
    shield'' -> ''tấm bia đỡ đạn''."]'
