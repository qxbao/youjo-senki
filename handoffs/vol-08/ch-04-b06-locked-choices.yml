choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & xưng hô: giữ nét lắp bắp ''R-rõ…'' và dấu chấm lửng;
    Weiss xưng ''Chúng tôi'' đại diện đơn vị pháp sư, thêm tiểu từ kính ngữ ''ạ''
    với cấp trên."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: câu nhận định mở đầu mang sắc thái
    nửa trực tiếp; quy chiếu Weiss bằng ''anh ta''; giữ sắc thái phủ định hạn định
    ''Chẳng còn mấy thời gian'' và cụm ''vài lời động viên tùy hứng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cảnh báo & đại từ: giữ câu báo động khẩn trương; dùng
    ''chúng ta'' cho toàn bộ lực lượng phòng ngự tại khu vực."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, câu hỏi nội tâm & quân hàm: giữ câu hỏi phỏng đoán
    đối tượng ''Là Tospan hay một hạ sĩ quan nào đó bên bộ binh đây?''; ''noncoms''
    -> ''hạ sĩ quan''; ''lower-ranking officer'' -> ''sĩ quan cấp dưới''; trần thuật
    dùng tên riêng ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, điều kiện & tình thái: giữ sự chuyển dịch điểm
    nhìn của nguyên tác từ ngôi thứ ba (''cô'', ''Tanya'') sang ngôi thứ nhất số nhiều
    (''chúng tôi'') khi miêu tả khoảng cách nhìn rõ mặt quân địch (''chúng''), rồi
    trở lại ngôi thứ ba; giữ câu điều kiện cảnh báo nguy cơ và tình thái ''có lẽ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & phủ định: độc thoại nội tâm đánh giá ý
    tưởng mới; giữ tình thái khẳng định ''Chắc chắn'' và phủ định ''chẳng hại gì''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại mệnh lệnh & xưng hô: Tanya gọi ''Các pháp sư'', tự
    xưng ''Tôi''; giữ chỉ thị giới hạn đối tượng ''chỉ một mình bộ binh bắn trả thôi!''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu cảm thán ngơ ngác ngắn gọn ''“Hả?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật & đại từ: trần thuật ngôi thứ ba dùng tên
    riêng ''Serebryakov'' và ''Tanya''; quy chiếu phe Đế quốc bằng ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: trong thoại Tanya dùng ''Chúng ta''
    / ''mình'' cho phe Đế quốc và ''chúng'' cho quân địch; ''Federation'' -> ''Liên
    bang''; giữ cấu trúc so sánh tương đồng và phủ định ở cả hai vế (''không có pháp
    sư'' / ''không có pháo binh'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Serebryakov gọi Tanya là ''Trung tá'', quy
    chiếu địch bằng ''chúng'', kết câu hỏi bằng ''sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & chữ nghiêng: trần thuật dùng ''Tanya'' và
    ''Serebryakov''; trong thoại Tanya tự xưng ''Tôi'', gọi Serebryakov là ''cô''
    và ''*Trung úy Pháp sư* ạ''; giữ đúng phạm vi nhấn mạnh Markdown ''*Trung úy Pháp
    sư*'' theo DEC-P01-002; ''foot soldier'' -> ''người lính bộ binh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ thán từ nghi vấn ngắn gọn ''“Hửm?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, tình thái & thuật ngữ: ''magic officers'' ->
    ''các sĩ quan ma pháp''; ''foot soldier'' -> ''lính bộ binh''; ''enemy infantry''
    -> ''bộ binh địch''; trần thuật dùng ''Tanya'' và ''cô''; giữ tình thái phỏng
    đoán (''Có vẻ như'', ''chỉ có thể phỏng đoán'', ''ắt hẳn phải'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: dùng ''Chúng ta'' cho nhận định
    chung nối tiếp lập luận của Tanya, quy chiếu lính bộ binh địch bằng ''chúng'';
    ''squads'' -> ''từng tiểu đội''; ''machine gun fire'' -> ''làn đạn súng máy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, điều kiện, phủ định & câu hỏi nội tâm: giữ dấu chấm lửng
    mở đầu; giữ mệnh đề giả định có phủ định (''nếu đã đinh ninh rằng chẳng có pháp
    sư nào cả'') và câu hỏi tu từ về tần suất ngước nhìn bầu trời của quân địch (''chúng'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & dấu câu: giữ câu độc thoại nội tâm có dấu chấm lửng
    ''Trên cao… Chà, đúng là một ý hay.'' và câu trần thuật ''Tanya nhếch mép cười.''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & nghĩa: giữ câu nhận định khái quát mang tính châm
    biếm về rắc rối trút xuống từ trên đầu.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & dấu câu: ''General von Zettour'' -> ''Tướng
    von Zettour''; giữ dấu chấm lửng ngập ngừng giữa câu."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: ''ma’am'' -> ''thưa Trung tá''; giữ câu hỏi
    lặp lại từ khóa ''Quá đáng sao ạ, thưa Trung tá?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & chức vụ: trần thuật ngôi thứ ba dùng ''Tanya'',
    ''cô'' và ''sĩ quan phụ tá'' (''her adjutant'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & câu hỏi: Tanya gọi cấp dưới là ''Cô'' và ''Trung
    úy Serebryakov'', dùng ''cấp trên của mình''; giữ câu hỏi trêu chọc về việc làm
    lộ thông tin mật."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, đại từ, thuật ngữ & phủ định: giữ nét lắp bắp phủ
    định ''“K-không ạ.”''; trần thuật dùng ''Serebryakov'', ''cô ấy'' và ''Tanya'';
    ''Federation soldiers'' -> ''lính Liên bang''; giữ phủ định ''chẳng thể nào tốt
    cho sức khỏe tinh thần''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & thuật ngữ: giữ giọng độc thoại nội tâm
    theo lăng kính công sở (''môi trường làm việc này'') và mức độ phỏng đoán cao
    (''rất có thể là tồi tệ nhất'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đại từ & thuật ngữ: giữ dấu chấm lửng đầu câu; dùng ''Chúng
    ta''; ''counterattack'' -> ''đợt phản kích''; giữ giọng câu hỏi rủ rê nhẹ nhàng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn: trần thuật ngôi thứ ba dùng tên riêng ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nghĩa: quy chiếu bộ binh địch bằng ''chúng'';
    giữ đối lập giữa bước tiến hiệu quả trên mặt đất và lối tư duy tác chiến hai chiều
    lỗi thời."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ, phủ định & dấu câu: ''formulas'' -> ''thuật
    thức''; ''enemy foot soldiers'' -> ''đám lính bộ binh địch''; giữ hai lớp phủ
    định (''không bị kẻ địch phóng thuật thức'' và ''chẳng có pháp sư nào cả''); giữ
    dấu gạch ngang dài và tên riêng ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & dấu câu: giữ điệp câu hỏi ngắn ''Dụ được chúng chưa?
    Dụ được chúng chưa?'', dấu chấm lửng và khẩu lệnh xuất kích ''…Được rồi, lên thôi!''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn: trần thuật ngôi thứ ba dùng tên riêng ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật ngôi thứ ba quy chiếu
    Tanya bằng ''cô'' / ''của mình''; ''submachine gun'' -> ''khẩu tiểu liên''; ''Federation
    soldier'' -> ''tên lính Liên bang''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Chữ nghiêng & thuật ngữ: giữ đúng phạm vi nhấn mạnh Markdown cho
    từ tượng thanh ''*Pằng, pằng-pằng-pằng.*'' theo DEC-P01-002; ''formula bullets''
    -> ''đạn thuật thức''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ, dấu câu, tình thái & phủ định: ''Federation
    infantry'' -> ''bộ binh Liên bang''; quy chiếu địch bằng ''Chúng'' / ''chúng''
    / ''mình''; giữ dấu chấm lửng, tình thái ''rất có thể…'' và phủ định ''chẳng hiểu
    nổi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, thuật ngữ & phủ định: ''Mana'' -> ''Ma năng'';
    ''formula bullets'' -> ''những viên đạn thuật thức''; ''explosion formulas'' ->
    ''thuật thức phát nổ''; dùng ''Chúng tôi'' / ''chúng tôi'' cho đơn vị pháp sư
    của Tanya; giữ quan hệ mục đích và phủ định ''không làm hư hại các tòa nhà gần
    đó''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & nhịp câu: giữ hai câu ngắn đối xứng nhấn mạnh bản
    chất cuộc phục kích.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & sắc thái: ''formula bullets'' -> ''những viên
    đạn thuật thức''; giữ cách diễn đạt lạnh lùng của nguyên tác ''các thành phần
    từng là lính Liên bang''; quy chiếu số lính địch còn lại bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại báo cáo: giữ điệp từ báo hiệu ''“Quang đãng! Quang
    đãng!”'' và thông báo lính địch đang mất ý chí chiến đấu."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: giữ câu phủ định khái quát ''Chẳng ai muốn
    chết cả.'' và lập luận về bản năng sinh tồn cùng vai trò của huấn luyện, kỷ luật."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Hô hiệu, quân hàm, đại từ, phủ định & điều kiện: giữ hô hiệu ''01'';
    ''Lieutenant Tospan'' -> ''Trung úy Tospan''; phân biệt ''chúng ta'' (đội pháp
    sư), ''họ'' (bộ binh của Tospan) và ''tôi'' (Tanya); giữ câu mệnh lệnh phủ định
    và câu điều kiện ở cuối đoạn."]'
