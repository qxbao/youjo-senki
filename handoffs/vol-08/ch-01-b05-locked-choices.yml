- segment_id: YS-LN08/Text/chapter004.xhtml/p000054
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=tôi - cậu (Drake
    nói với Andrew); locked_elements=[''Thuật ngữ: pháp sư hải quân đánh bộ.'', "Phủ
    định mở đầu và sắc thái khiêm tốn giả vờ: ''Không đâu, như cậu thấy đấy, tôi chỉ
    là một pháp sư hải quân đánh bộ dạn dày sương gió thôi.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000055
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=Tôi (Andrew); ông
    ấy (Drake); locked_elements=["Nhấn mạnh Markdown: chỉ bọc ''*Ôi, thôi nào.*''
    theo DEC-P01-002.", ''Cấu trúc tự hiệu chỉnh mức độ trong dấu gạch ngang và mục
    đích thử làm đối phương dao động.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000056
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi - ngài (Andrew nói với Drake kèm
    ''ạ''); locked_elements=[''Thuật ngữ: sĩ quan ma pháp hải quân đánh bộ.'', "Sắc
    thái khiêu khích cố ý hạ thấp (''quèn'') đi kèm lời rào đón ''tôi không có ý xúc
    phạm đâu ạ''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000057
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=Cậu / mình (Drake
    nói với Andrew); locked_elements=[''Thuật ngữ: dân thường, nhà báo.'', "Giọng
    điệu điềm nhiên pha chút châm biếm (''một tay nhà báo láu cá'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000058
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi - thưa Trung tá (Andrew đáp lời
    Drake); locked_elements=["Quân hàm trong lời gọi: ''thưa Trung tá'' (ứng với ''Colonel''
    khi gọi Lieutenant Colonel Drake)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000059
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); ông
    ấy (Drake); locked_elements=[''Chuỗi phủ định và điều kiện: không nổi giận, cũng
    không phớt lờ, khiến Andrew không còn nước cờ nào nếu đối phương cứ đáp trả bằng
    châm biếm và nụ cười.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000060
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=tôi (Andrew); Ông
    ấy (Drake); locked_elements=['Ẩn dụ nhìn thấu mọi quân bài trong tay.']
- segment_id: YS-LN08/Text/chapter004.xhtml/p000061
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=tôi (Andrew); ông
    ấy (Drake); locked_elements=['Nhận định chắc chắn về bản lĩnh của vị sĩ quan và
    mức độ khó khăn khi muốn khai thác thông tin.']
- segment_id: YS-LN08/Text/chapter004.xhtml/p000062
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=tôi - cậu / Andrew;
    chúng ta (Drake nói với Andrew); locked_elements=[''Thuật ngữ: Khối Thịnh vượng
    chung.'', ''Lời đề nghị thỏa hiệp và yêu cầu Andrew kể trước về bản thân cùng
    sự nghiệp.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000063
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi (Andrew nói với Drake kèm ''ạ'');
    locked_elements=[''Thuật ngữ: sơ yếu lý lịch, đơn xin đến đây.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000064
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); họ
    (nhân viên Đại sứ quán Liên bang); locked_elements=[''Thuật ngữ: thị thực, Đại
    sứ quán Liên bang ở Londinium.'', "Cấu trúc đệ quy châm biếm thủ tục quan liêu:
    ''một bộ quy tắc để quản lý những quy tắc vốn dùng để quản lý các quy tắc''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000065
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=Tôi (Andrew nói với Drake kèm ''ạ'');
    locked_elements=[''Thuật ngữ: đi theo đơn vị với tư cách phóng viên (embedded
    reporter).'', ''Câu hỏi tu từ cuối đoạn thể hiện sự bất lực trước thủ tục giấy
    tờ của cả hai nước.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000066
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=tôi - cậu (Drake
    nói với Andrew); locked_elements=[''Thuật ngữ: Liên bang.'', ''Chi tiết Drake
    đã xem hồ sơ của Andrew cùng những người Liên bang đa nghi.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000067
  kind: terminology_and_voice
  value: speaker=Andrew; pronouns_and_address=Ngài (Andrew hỏi lại Drake kèm 'ạ');
    họ (phía Liên bang); locked_elements=["Câu hỏi ngắn xác nhận lại nhận xét 'đa
    nghi' của Drake."]
- segment_id: YS-LN08/Text/chapter004.xhtml/p000068
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=cậu (Drake hỏi Andrew);
    locked_elements=[''Thuật ngữ: người của phe Đỏ (a Red).'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000069
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi (Andrew đáp lời Drake kèm ''ạ'');
    locked_elements=["Thuật ngữ và chơi chữ: giữ đối lập màu sắc giữa ''không còn
    non nớt đến mức xanh mặt'' (not green anymore) và ''người của phe Đỏ'' (a Red)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000070
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); vị
    trung tá / Ông ấy (Drake); locked_elements=[''Quân hàm: vị trung tá (the lieutenant
    colonel).'', ''Quan hệ phủ định - đối lập: không chế giễu mà ngược lại còn gật
    đầu hài lòng.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000071
  kind: terminology_and_voice
  value: speaker=Lieutenant Colonel Drake; pronouns_and_address=tôi (Drake nói với
    Andrew); locked_elements=['Lời xin lỗi lịch sự và lời than thở bóng gió có nhiều
    chuyện phải bận tâm gần đây.']
- segment_id: YS-LN08/Text/chapter004.xhtml/p000072
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi - ngài (Andrew hỏi Drake kèm ''ạ'');
    locked_elements=["Nghĩa thành ngữ ''throwing me a bone'': hé lộ chút manh mối."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000073
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=ông ấy / vị trung
    tá (Drake); locked_elements=[''Thuật ngữ và quân hàm: Liên bang, vị trung tá,
    tác chiến liên hợp Liên bang – Khối Thịnh vượng chung.'', ''Câu hỏi nội tâm mở
    đầu và phủ định kép khẳng định sự khó nhằn của Drake.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000074
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi / mình (Andrew);
    ông ấy (Drake); locked_elements=[''Quan hệ điều kiện: muốn nghe thêm thì phải
    chơi theo luật của Drake.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000075
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi (Andrew tự giới thiệu với Drake);
    locked_elements=[''Thuật ngữ: Phóng viên đặc biệt Andrew từ *WTN*, phòng tuyến
    Rhine, người tị nạn của Liên minh Hiệp ước, mặt trận phía đông.'', "Nhấn mạnh
    Markdown: chỉ bọc ''*WTN*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000076
  kind: terminology_and_voice
  value: speaker=Lieutenant Colonel Drake; locked_elements=["Câu hỏi ngắn lặp lại
    động từ 'Bị quẳng ra ư?' khớp với lời của Andrew ở đoạn trước."]
- segment_id: YS-LN08/Text/chapter004.xhtml/p000077
  kind: terminology_and_voice
  value: 'speaker=Andrew; locked_elements=[''Thuật ngữ: *WTN*, Liên bang.'', "Nhấn
    mạnh Markdown: chỉ bọc ''*WTN*'' theo DEC-P01-002.", "Tình thái quá khứ giả định
    (''vốn muốn cử những người kỳ cựu đi hơn'') và thực tế chỉ xin được cho cánh trẻ
    tuổi nhập cảnh."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000078
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=tôi (Andrew); Drake
    / ông ấy; locked_elements=['Cấu trúc nhượng bộ và câu mệnh đề danh ngữ làm chủ
    ngữ khẳng định việc khai thác được tin thật hay không phụ thuộc vào kỹ năng của
    bản thân.']
- segment_id: YS-LN08/Text/chapter004.xhtml/p000079
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; locked_elements=[''Thuật ngữ: Liên bang.'',
