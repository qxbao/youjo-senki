- segment_id: YS-LN08/Text/chapter004.xhtml/p000082
  kind: terminology_and_voice
  value: speaker=Andrew; locked_elements=["Thán từ nghi vấn ngắn 'Ồ?'."]
- segment_id: YS-LN08/Text/chapter004.xhtml/p000083
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=tôi (Andrew); ông
