- segment_id: YS-LN08/Text/chapter004.xhtml/p000085
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=Cậu (Drake nói với
    Andrew); họ (phía Liên bang); locked_elements=[''Thuật ngữ: phim chụp ảnh, máy
    điện báo.'', ''Phạm vi loại trừ: xin được bất cứ thứ gì miễn không phải phim chụp
    ảnh hay máy điện báo.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000086
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); speaker=Andrew; pronouns_and_address=Tôi
