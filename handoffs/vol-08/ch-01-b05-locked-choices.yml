    nên không trông mong được biệt đãi.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000087
  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=cậu (Drake hỏi Andrew);
    locked_elements=["Câu hỏi ngắn gạn ý: ''Ý cậu là sao?''."]'
