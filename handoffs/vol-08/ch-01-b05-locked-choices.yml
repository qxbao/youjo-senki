- segment_id: YS-LN08/Text/chapter004.xhtml/p000084
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); Drake
    / ông ấy; locked_elements=[''Chi tiết quan sát tương phản: cười khúc khích hài
