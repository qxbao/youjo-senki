choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & ẩn dụ: ''staff officer'' -> ''sĩ quan tham
    mưu''; giữ các cấu trúc phủ định (''không được phép cứ thế dùng sức mạnh cưỡng
    ép...'', ''chúng ta cũng không được quên...'', ''Chúng ta không thể đặt lên đó
    bất cứ thứ gì lớn hơn một quả cân'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định: Zettour gọi Tanya là ''Trung tá'',
    tự xưng ''Ta'' và gộp chung ''Chúng ta''; ''field officer'' -> ''sĩ quan cấp tá'';
    giữ các mệnh đề phủ định (''không nên đặt quá nhiều niềm tin...'', ''đâu có được
    trao một tấm séc trắng'', ''Ta không phủ nhận rằng Andromeda là một chiến dịch
    có rủi ro cao'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại & cấu trúc câu chêm: Tanya xưng ''Tôi'' và
    gọi Zettour là ''ngài''; giữ mệnh đề trần thuật chêm giữa hai dấu gạch ngang dài
    (''—Tanya lắc đầu đáp lại—'') và phủ định ''nhưng tôi chỉ là không thích chuyện
    đó''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & câu hỏi: Zettour gọi Tanya là ''Cô''; giữ
    câu phủ định ''Thật chẳng giống cô chút nào'' và câu hỏi thăm dò ''Có chuyện gì
    xảy ra sao?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, điều kiện & phủ định toàn phần: Tanya xưng ''Tôi'' (tự
    quy chiếu ''mình''); giữ mệnh đề điều kiện nhượng bộ ''nhưng nếu vẫn được phép
    lên tiếng'', phủ định ''mình chẳng thích bất cứ điểm nào ở chiến dịch đó cả''
    và nhận định ''Ngay cả cái tên nghe cũng thấy chướng tai gai mắt''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Thán từ nghi vấn: giữ câu hỏi ngắn ''Ồ?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, phủ định & tương phản: quy chiếu Tanya bằng
    ''nó'' theo DEC-P01-001, Zettour bằng ''ông''; giữ phủ định ''không có lời nào
    nó nói ra là nhằm khơi gợi sự tò mò của ông'' và mệnh đề đối lập ''nhưng xem chừng
    nó vẫn thu hút được sự hứng thú của ông''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Cảm thán ngắn trong thoại: giữ nhận xét ''Hiếm thấy thật đấy.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Xưng hô nghi vấn: Tanya hỏi lại cấp trên bằng ''Thưa ngài?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & câu hỏi nội tâm gián tiếp: quy chiếu Tanya
    bằng ''nó'' theo DEC-P01-001; giữ câu hỏi tự vấn ''Nó đã nói điều gì mà lại có
    thể làm vị cấp trên của mình thích thú đến thế cơ chứ?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quan hệ nhượng bộ: Zettour xưng ''Ta'' và gọi Tanya
    là ''cô''; giữ sự đối lập giữa hai vế ''Ta từng đinh ninh cô là lá bùa may mắn
    của ta đấy… Dù ta cứ ngỡ cô là một sĩ quan sống thiên về lý trí hơn một chút cơ.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Tục ngữ / nhận định khái quát: giữ câu đáp ''Tên gọi và bản chất
    vốn thường đi đôi với nhau mà.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Thán từ nghi vấn: giữ ''Hửm?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi điểm nhìn & thuật ngữ: câu đầu trần thuật dùng ''ông''
    và ''nó'', câu hai chuyển sang độc thoại nội tâm dùng ''mình'' theo DEC-P01-001;
    ''structuralism'' -> ''chủ nghĩa cấu trúc''; ''deconstruction'' -> ''sự giải cấu
    trúc''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhân quả: dùng ''Chúng ta'' cho nhận định chung;
    giữ quan hệ nhân quả giữa việc đặt quá nhiều niềm tin vào ngôn từ và xu hướng
    quên mất tư duy, trí tưởng tượng bị định hình, giới hạn bởi từ ngữ."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & tình thái: giữ sự đối lập và mức độ tình thái ''tên
    gọi cũng là từ ngữ, thế nhưng ý nghĩa mà chúng mang theo đôi khi lại có thể gây
    ra những sự hiểu lầm''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc đối lập hai chiều: ''Dacian Army'' -> ''Quân
    đội Dacia''; ''Federation Army'' -> ''Quân đội Liên bang''; giữ dấu nháy đơn quanh
    từ ''‘sư đoàn’'' và cấu trúc đối xứng hai chiều giữa việc đánh giá quá cao Dacia
    với đánh giá thấp Liên bang."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Zettour xưng ''Ta'' và gọi Tanya là ''cô''
    (''Ta hiểu rồi. Nghe cô nhắc tới thì đúng là vậy thật.'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc câu đầu ''*Quả là một
    góc nhìn thú vị.*'' trong dấu sao theo DEC-P01-002; câu cuối là độc thoại nội
    tâm của Tanya tự xưng ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi trực tiếp & tên riêng: giữ ''Vậy cái tên Andromeda gợi
    lên điều gì?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & câu hỏi tu từ: ''The Andromeda Galaxy'' ->
    ''Thiên hà Andromeda''; ''tyranny of distance'' -> ''sự bạo ngược của khoảng cách'';
    Tanya xưng ''tôi'' và dùng ''chúng ta''; giữ câu hỏi tu từ ''Chẳng phải cái tên
    ấy có nghĩa là chúng ta đang vươn tay quá xa một chút hay sao?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Tình thái so sánh giả định: giữ ''Cứ gần như thể những nỗi sợ
    hãi thầm kín bên trong chúng ta đã buột lộ ra dưới hình hài cái tên chiến dịch
    kỳ cục này vậy.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & cặp đối lập: Tanya tự xưng ''mình'' theo DEC-P01-001;
    giữ cặp khả năng ''một cách có ý thức hay vô thức''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & cấu trúc so sánh phủ định: chỉ bọc ''*chiến
    lược tăng trưởng*'' và ''*kế hoạch dài hạn*'' trong dấu sao theo DEC-P01-002;
    giữ cấu trúc so sánh phủ định ''chẳng có công ty nào lại ưa chuộng... hơn những
    công ty sắp sửa phá sản tới nơi''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & đối lập: Tanya xưng ''tôi''; giữ cấu trúc
    phủ định kép ở vế đầu (''Không cần phải tỏ ra quá đỗi hào hùng hay trung tính
    một cách nhạt nhẽo không mùi vị thái quá'') và mệnh đề khẳng định ở vế sau."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & cặp đối lập: dùng ''bạn'' cho chủ thể khái
    quát; giữ sự đối lập ''truyền cảm hứng hay làm nản lòng các thành viên trong tổ
    chức của mình là một vấn đề sống còn''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Zettour gọi Tanya là ''Trung tá''
    và tự xưng ''Ta''; giữ sắc thái mỉa mai ngầm ''Ta chắc chắn sẽ gợi ý khéo điều
    đó cho người đã đặt cái tên này.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Xưng hô nghi vấn: giữ ''Thưa ngài?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & tên riêng: Zettour xưng ''ta'' và gọi Tanya
    là ''cô''; giữ mệnh đề phủ định ''nhưng lần này đó không phải là lựa chọn của
    ta''; ''General von Rudersdorf'' -> ''Tướng von Rudersdorf''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm: giữ ''Lại thêm một bước ngoặt bất ngờ nữa.
    Việc liên tục đánh mất thế chủ động trong cuộc trò chuyện này thật khiến người
    ta phát điên.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & chuyển đổi điểm nhìn: câu đầu và câu cuối
    trần thuật dùng ''Tanya'', ''Zettour'', ''ông''; chỉ bọc câu hỏi nội tâm ''*Chà,
    giờ mình còn phải chịu đựng cả khói thuốc thụ động nữa ư?*'' trong dấu sao theo
    DEC-P01-002; câu độc thoại kế tiếp tự xưng ''Mình'' theo DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định trong thoại: Zettour tự xưng ''Ta''; giữ mệnh
    đề đối lập phủ định ''nhưng xem chừng lại chẳng có hứng nữa rồi''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi lễ phép trong thoại: giữ ''Có chuyện gì không ổn sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện giả định: Zettour xưng ''ta'', gọi Tanya là
    ''cô'', gộp chung ''chúng ta''; giữ câu điều kiện giả định ''Nếu ta đưa cho cô
    một điếu xì gà, cả hai chúng ta sẽ đều bị kỷ luật mất.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trần thuật: chỉ bọc ''*Chắc chắn là vậy rồi.*''
    trong dấu sao theo DEC-P01-002; câu sau trần thuật về Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điểm nhìn nội tâm & câu hỏi tu từ: ''aerial mage''
    -> ''pháp sư trên không''; giữ câu hỏi tu từ ''Một pháp sư trên không chưa đủ
    tuổi lại phớt lờ bổn phận mà đi hút thuốc ư?'' và câu kết độc thoại nội tâm dùng
    ''Mình'' theo DEC-P01-001 (''Mình không thể nghĩ ra hành vi vi phạm hợp đồng nào
    triệt để hơn thế nữa.'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Gác chuyện đó sang một bên, Tanya kéo tâm trí
    hay đi lang thang của mình quay trở lại.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & cấp bậc: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001, Zettour bằng ''vị tướng này'' / ''ông''; ''a mere lieutenant colonel''
    -> ''một trung tá quèn''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Tình thái phỏng đoán chắc chắn: giữ ''Ắt hẳn đó phải là một chuyện
    vô cùng động trời.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & quan hệ đối lập: Tanya tự xưng ''mình'' theo
    DEC-P01-001, quy chiếu Zettour bằng ''ông''; giữ sự giằng xé ''Mình muốn chạy
    trốn, nhưng lại không thể'' và dấu gạch ngang dài ở cuối câu (''—đặc biệt là ở
    trong quân đội'')."]'
