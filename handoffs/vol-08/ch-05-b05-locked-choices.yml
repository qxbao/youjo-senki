segment_id_end: YS-LN08/Text/chapter018.xhtml/p000169
choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Nhận định tình huống: ''Cứ đà này thì việc đột phá chẳng khác
    nào giấc mộng trong mộng.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và quan hệ nhượng bộ: ''trận đánh cơ động'' (maneuver
    battle), ''hệ thống phòng ngự'' (the defenses), ''tuyến giao thông liên lạc''
    (communication lines)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ và tình thái quá khứ: ''tiến quân theo kiểu amip'', ''song
    lẽ ra ít nhất họ cũng phải giữ được đôi chút đà tiến'', ''sụt giảm nghiêm trọng
    hơn mức Zettour đã trông cậy''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và câu điều kiện: ''các sĩ quan tham mưu Cụm B'' (B
    Group staffers); giữ nhịp châm biếm nhẹ ở câu sau ''Chỉ đáng buồn thay, có lý
    thì cũng chỉ dừng lại ở đó mà thôi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Cụm cảm thán bỏ lửng: ''Đã suy yếu lại còn phải đối mặt với kẻ
    địch tầm cỡ thế này…''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*...*'' toàn bộ câu hỏi độc thoại nội
    tâm theo DEC-P01-002.", "Đại từ: ''Quân ta'' (our army)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Độc thoại thành tiếng của Zettour: giữ ẩn dụ ''chiếc đồng hồ cát
    của chúng ta'' và câu hỏi mở ''Phải làm sao để đổ thêm vào đây?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế trong quá khứ: ''Nếu không phải vốn có thói
    quen độc thoại trong xe từ những lúc bình thường, hẳn câu nói vừa rồi của ông
    đã biến thành một tiếng thét thống khổ.''.", "Đại từ trần thuật: ''ông'' (Zettour);
    giữ trọn vẹn ẩn dụ nhúm muối và món ăn chỉ toàn muối."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Kết nối ẩn dụ từ đoạn trước: ''tình hình hiện tại đang mặn chát
    đến phát sợ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Đại từ trong lời độc thoại của Zettour: xưng ''ta'' (cá nhân)
    và ''chúng ta'' (quân đội Đế quốc)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và đại từ trần thuật: ''hậu phương'' (the rear), ''ông''
    (Zettour)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Nhân danh, chức danh và thuật ngữ: ''Hans von Zettour, Cục phó
    Cục Quân vụ'' (deputy chief of the Service Corps), ''hậu phương'' (the rear),
    ''tiền tuyến'' (the front lines), ''thủ đô'' (the capital)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Thoại báo tin tiếp viện: ''Có thêm quân! Quân ta đang tiến về
    phía này!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gián tiếp: ''Ai đó hét lên rằng họ được cứu rồi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự: ''lực lượng bộ binh cơ giới'' (mechanized infantry),
    ''quân tiếp viện của địch'' (enemy reinforcements), ''lối tung quân nhỏ giọt''
    (piecemeal commitment)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh triển khai bộ binh cơ giới từ xe tải: ''Xuống xe! Nhanh
    lên, chuẩn bị chiến đấu!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh tác chiến: ''Chỉ huy chống tăng, nã vào đám xe tăng
    kia đi!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''các sĩ quan lẫn hạ sĩ quan'' (officers commissioned
    and not), ''chiến tuyến'' (battle line), ''quân Đế quốc'' (imperial forces)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đánh đổi: ''Mặc dù đổi lại, đà tấn công của họ đã chậm
    đi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Xưng hô khẩn khoản của cấp dưới với Zettour: ''Thưa Tướng quân,
    xin ngài đấy!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Giữ nguyên chú thích ngoặc đơn và sắc thái nói giảm: ''(nếu buộc
    phải nói thẳng) cũng chẳng lấy gì làm háo hức chuyện bỏ mạng''; đại từ trần thuật
    ''ông''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện – suy luận hợp lý: ''Nếu bộ binh đã lao vào
    hỗn chiến, thì lẽ hợp lý là ông nên về điều hành căn cứ.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Zettour với Cramm: xưng ''ta'', gọi ''anh'' và ''Chỉ
    huy Cramm''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và đại từ: ''Văn phòng Bộ Tổng tham mưu'' (General Staff
    Office), ''sĩ quan tác chiến'' (field officer); đại từ trần thuật ''ông''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và đối lập thời gian: ''đợt xung phong của bộ binh''
    (infantry charge), ''đánh giáp lá cà'' (fought hand to hand), ''trung tá'' (lieutenant
    colonel); giữ đối lập giữa khả năng thời trẻ và thực tại cơ thể không theo kịp."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: Zettour xưng ''ta'' trong thoại, trần thuật
    dùng ''ông''; ''những nguyên tắc cơ bản trong tác chiến bộ binh'' (infantry combat
    fundamentals), ''Chỉ huy Cramm'' (Commander Cramm).", "Giả định trái thực tế:
    ''Nếu nhìn cách di chuyển của Chỉ huy Cramm và những người khác khi rời khỏi xe
    mà không hiểu được ý đồ của họ, hẳn ông đã trở thành một gã sĩ quan cổ lỗ sĩ rồi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000162
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật 'ông' (Zettour) và thành ngữ miêu tả sự ngạc
    nhiên 'tròn mắt kinh ngạc' (made his eyes pop)."]
- segment_id: YS-LN08/Text/chapter018.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''pháo chống tăng'' (anti-tank guns)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán của Zettour: ''Hửm, cách sử dụng này hiếm thấy
    thật đấy…''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Grantz với Zettour: ''Thưa Tướng quân?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Quân hàm: ''Trung úy Grantz'' (Lieutenant Grantz), thuật ngữ ''pháo
    chống tăng'' (anti-tank guns).", "Nhấn mạnh Markdown: chỉ bọc ''*…được phối thuộc
    cho từng đơn vị bộ binh để hộ tống sát sao hay sao?*'' đúng phạm vi phần câu bỏ
    lửng được nhấn mạnh trong nguồn theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh tác chiến và phủ định: ''Bộ binh, không được tiếp cận
    lính địch! Tất cả các khẩu pháo, nã vào chiếc xe tăng Liên bang đang nhô lên kia!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và tình thái: ''pháo chống tăng'' (anti-tank guns),
    ''ưu thế hỏa lực cục bộ'' (local firepower superiority), ''pháo hạng nặng'' (heavy
    [artillery]); giữ tình thái ''xem chừng họ hoàn toàn có thể tiêu diệt xe tăng
    địch ngay cả từ khoảng cách xa''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và phủ định trong lời nhận xét của Zettour: ''Tập trung
    hỏa lực chống tăng, giao quyền tự quyết tại chỗ cho các chỉ huy…'', ''chẳng có
    lý do gì bắt chúng ta phải ngốc nghếch đấu tay đôi một chọi một một cách sòng
    phẳng trong trận tử chiến với những thứ này cả''."]'
