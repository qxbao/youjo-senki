- segment_id: YS-LN08/Text/chapter008.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''market economy'' -> ''kinh
    tế thị trường''; ''risk management'' -> ''quản trị rủi ro''; giữ nguyên tên ''Tanya'',
    mệnh đề phủ định ''không bao giờ được quên'' và khả thể ''có thể dẫn đến bi kịch''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn & phủ định: giữ câu khẳng định phủ định ''Sự an
    toàn chẳng bao giờ là miễn phí.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=["Dấu gạch ngang dài & tình thái: giữ dấu em-dash và nhận định ''Chuyện
    chỉ đơn giản có vậy—đến một đứa trẻ cũng có thể hiểu được.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & câu bỏ lửng: Weiss tự xưng ''tôi'' / ''mình'',
    dùng ''chúng ta''; giữ phủ định quá khứ ''đã không nghĩ'' và cấu trúc bị động
    bỏ lửng ''lại thực sự bị…'' nối tiếp ngữ cảnh bị bao vây."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''Major Weiss'' -> ''Thiếu tá Weiss''; Tanya
    gọi Weiss là ''anh''; ''your superiors'' -> ''cấp trên''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Weiss: giữ nhận xét về những ước tính luôn lạc quan
    quá mức của cấp trên.'']'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thành ngữ & tình thái: Tanya gọi Weiss là ''anh''; dịch
    thành ngữ ''take it with a grain of salt'' -> ''chỉ nên tin một nửa thôi''; ''negative
    prediction'' -> ''dự đoán tiêu cực''; giữ sắc thái ''Lẽ ra anh phải tin tưởng
    vào điều đó được chứ.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & tình thái quá khứ: bọc ''*Chúng đang
    kéo tới, chúng đang kéo tới đấy*'' khớp thẻ em trong nguồn theo DEC-P01-002; dùng
    ''chúng ta'' và giữ cấu trúc ''lẽ ra phải giúp chúng ta phần nào xốc lại quyết
    tâm rồi''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & ẩn dụ trong thoại: Tanya gọi Weiss là ''anh''; giữ hình
    ảnh ẩn dụ biết trời sắp mưa thì nhớ mang theo ô."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi nội tâm: ''B Group'' -> ''Cụm B''; giữ nguyên
    câu hỏi mở ''Câu hỏi đặt ra là: Liệu Cụm B đã chuẩn bị sẵn sàng để đón thời tiết
    này chưa?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: Tanya tự xưng ''mình'' theo DEC-P01-001; giữ nhận
    định nghi ngờ trước cảnh binh lực dàn trải mỏng manh."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại chỉ huy & câu hỏi: lời Tanya hỏi báo cáo trinh sát
    của không quân, bỏ tiểu từ ''ạ'' ở cuối câu để giữ đúng vị thế chỉ huy đối với
    cấp dưới."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=["Sắc thái kính ngữ & số liệu: lời sĩ quan phụ tá Visha báo cáo
    với Tanya có ''ạ''; giữ con số ''bốn hoặc năm sư đoàn''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000339
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, chức danh & thuật ngữ: quy chiếu Tanya bằng
    ''nó'' theo DEC-P01-001; ''adjutant'' -> ''sĩ quan phụ tá''; ''photo analysis''
    -> ''bản phân tích không ảnh''; ''observation unit'' -> ''đơn vị quan sát''; dùng
    ''chúng ta'' ở vế nhận xét."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000340
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & trần thuật xen thoại: ''air support'' -> ''yểm
    trợ đường không''; ''augmented regiment'' -> ''trung đoàn tăng cường''; dùng ''chúng
    ta'' và giữ cấu trúc lời lẩm bẩm của Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000341
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tập quán tổ chức quân sự: ''Federation troops'' ->
    ''Quân Liên bang''; ''B Group'' -> ''Cụm B''; ''unseasoned replacements'' -> ''đám
    lính bổ sung chưa qua thực chiến''; ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ sự đối lập giữa thành lập đơn vị mới và bổ sung quân số."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000342
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi của cấp dưới: giữ câu hỏi xác nhận thông tin về chất lượng
    binh lính địch của Weiss kèm tiểu từ kính trọng ''ạ''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000343
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định: Tanya xưng ''Tôi'', gọi ''Thiếu
    tá Weiss'' (''Major Weiss'') là ''anh''; giữ câu trả lời phủ định dứt khoát ''nhưng
    không, chẳng có thông tin gì đâu''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000344
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ, đại từ nội tâm & nhấn mạnh Markdown: ''Lieutenant
    General von Zettour'' -> ''Trung tướng von Zettour''; ''wishful thinking'' ->
    ''suy nghĩ viển vông''; dùng ''chúng ta'' và đại từ nội tâm ''mình'' theo DEC-P01-001;
    bọc ''*Biết đâu chúng đã kiệt sức rồi*'' khớp thẻ em trong nguồn theo DEC-P01-002;
    giữ phủ định ''chẳng thấy ... mang lại được chút an ủi nào''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000345
  kind: terminology_and_voice
  value: 'choices=["Phủ định, trích dẫn & thuật ngữ: giữ phủ định ''chưa nắm chắc
    được thực lực của địch ngoài con số bề nổi ‘bốn hoặc năm sư đoàn’''; ''guard division''
    -> ''sư đoàn Cận vệ''; giữ giả định bất lợi của Weiss."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000346
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái hoài nghi & thuật ngữ: Tanya xưng ''Tôi'';
    ''guard division'' -> ''sư đoàn Cận vệ''; giữ nhận định phủ định hoài nghi ''Tôi
    không nghĩ đó sẽ là một sư đoàn Cận vệ đâu.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000347
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu bỏ lửng: Weiss gọi Tanya là ''ngài'' / ''thưa Trung
    tá'' (''ma''am'') và xưng ''tôi''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000348
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, chức danh & phủ định: quy chiếu Tanya bằng
    ''nó'' theo DEC-P01-001 và Weiss bằng ''anh''; ''vice commander'' -> ''vị phó
    chỉ huy''; ''front lines'' -> ''tiền tuyến''; ''the rear'' -> ''hậu phương'';
    giữ mệnh đề phủ định ''không thể làm ngơ trước việc anh đang nghi ngờ cả những
    phân tích tình hình xác đáng''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000349
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi tu từ & phủ định: ''Federation Army’s guard
    divisions'' -> ''Các sư đoàn Cận vệ của Quân đội Liên bang''; ''Imperial Army
    Intelligence'' -> ''Tình báo Lục quân Đế quốc''; Tanya xưng ''Tôi'' và giữ câu
    kết ''Tôi thực sự hy vọng là không.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000350
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi ngắn: Weiss hỏi lại Tanya bằng ''Vậy là ngài
    tin họ sao?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, dấu chấm lửng & mệnh lệnh phủ định: Tanya xưng ''Tôi'',
    dùng ''chúng ta''; giữ dấu chấm lửng và lời dặn ''Đừng quên lúc nào cũng phải
    hình dung sẵn kịch bản tồi tệ nhất.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=[''Nhận định nội tâm ngắn: giữ sự phân biệt rạch ròi giữa việc tin
    tưởng ai đó và việc đánh giá quá cao họ.'']'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000353
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc đối lập: ''A Group'' -> ''Cụm A''; ''major
    offensive'' -> ''cuộc tiến công lớn''; giữ tương phản ''mới là bên đang tiến hành...,
    chứ không phải chúng ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000354
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhấn mạnh Markdown: ''Operation Andromeda'' -> ''Chiến
    dịch Andromeda''; ''the Federation'' -> ''Liên bang''; ''the Empire'' -> ''Đế
