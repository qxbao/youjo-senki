    nguồn theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000355
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi tu từ & giả định trái thực tế quá khứ: ''guard
    division'' -> ''sư đoàn Cận vệ''; ''Imperial Army'' -> ''Lục quân Đế quốc''; giữ
    câu hỏi tu từ và điều kiện trái thực tế ở quá khứ ''Nếu chuyện đó chỉ có dù một
    mảy may sự thật thôi, thì chúng đã đẩy lùi Lục quân Đế quốc từ lâu rồi.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000356
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi đề xuất: ''reconnaissance in force'' -> ''trinh
    sát chiến đấu''; ''mages'' -> ''pháp sư''; ''armor'' -> ''thiết giáp''; giữ tiểu
    từ ''ạ'' trong lời đề xuất của Weiss với Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000357
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, ngạch sĩ quan & hai câu hỏi nội tâm: ''young major''
    -> ''thiếu tá trẻ tuổi''; ''field officer'' -> ''sĩ quan cấp tá''; quy chiếu Weiss
    bằng ''anh'' và giữ trọn hai câu hỏi nội tâm của Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000358
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ nội tâm & phủ định kép: ''aerial mage'' -> ''pháp
    sư trên không''; quy chiếu Weiss bằng ''anh''; Tanya tự xưng ''mình'' theo DEC-P01-001;
    giữ cấu trúc phủ định kép ''Dù không phải là mình không hiểu...''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000359
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định trong thoại: giữ nguyên tên ''Tanya'', quy
    chiếu Weiss bằng ''anh''; dùng ''chúng ta'' và giữ phủ định ''không có sự dư dả
    để tự làm kiệt sức mình đâu'' cùng phương châm thu thập thông tin thụ động."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000360
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi đề xuất ngắn: giữ đề xuất ''cuộc tập kích ban đêm bất
    ngờ'' kèm tiểu từ ''ạ'' của Weiss."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000361
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ nguyên tên ''Tanya'' và chi tiết một người không
    ngờ tới lên tiếng ngay khi Tanya định lắc đầu từ chối."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000362
  kind: terminology_and_voice
  value: 'choices=["Phủ định & kính ngữ: giữ phủ định ''Đó không phải là một ý tồi
    đâu ạ'' và nhận định của Visha về hiệu quả của một đòn tập kích."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000363
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya gọi Visha là ''cô'' và ''Trung úy Serebryakov''
    (''Lieutenant Serebryakov'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000364
  kind: terminology_and_voice
  value: 'choices=["Dấu chấm lửng, địa danh & xưng hô: giữ dấu chấm lửng đầu câu;
    ''the Rhine'' -> ''mặt trận Rhine''; Visha tự xưng ''tôi'' kèm ''ạ'' và giữ hình
    ảnh hài hước ''Đem xẻng của chúng ta đi dã ngoại một chuyến có khi lại hay.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000365
  kind: terminology_and_voice
  value: 'choices=["Phủ định & cách gọi trong thoại: Tanya xưng ''tôi'', từ chối thẳng
    thừng và gọi thuộc cấp là ''lũ hiếu chiến các người'' (''you warmongers'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000366
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ nội tâm & phủ định: giữ câu đầu quy chiếu ''Tanya''
    và câu sau chuyển sang ngôi thứ nhất nội tâm ''mình'' / ''bản thân'' ở kiếp trước
    theo DEC-P01-001; giữ phủ định nhấn mạnh ''có nằm mơ cũng chẳng bao giờ tưởng
    tượng nổi''."]'
