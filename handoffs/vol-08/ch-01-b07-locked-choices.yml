    giọng Russy, sĩ quan chính trị.'', ''Thế lưỡng nan mỉa mai giữa việc khen phát
    âm khá chuẩn hay yêu cầu một phiên dịch viên đúng nghĩa.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000153
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=Tôi (Andrew); cô ta
