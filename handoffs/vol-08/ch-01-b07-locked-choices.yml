- segment_id: YS-LN08/Text/chapter004.xhtml/p000168
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); pronouns_and_address=họ (Liên bang); locked_elements=[''Thuật
    ngữ: đoàn phóng viên, Liên bang.'', ''Sự thất vọng của đoàn phóng viên trước câu
