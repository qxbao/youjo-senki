- segment_id: YS-LN08/Text/chapter004.xhtml/p000154
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=Tôi (Andrew); họ
    (Liên bang); locked_elements=[''Thuật ngữ: tuyên truyền, buổi họp báo, nhà báo
    nước ngoài, đơn vị đa quốc gia, cuộc phản công, Liên bang, sĩ quan chính trị.'',
    ''Sự đối lập giữa việc lường trước yếu tố tuyên truyền và nỗi khó hiểu khi Liên
    bang không nhận ra việc để sĩ quan chính trị phiên dịch sẽ gây tác dụng ngược.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000155
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=Tôi (Andrew); locked_elements=['Hành
    động chuyển trạng thái sang tập trung vào công việc làm báo.']
- segment_id: YS-LN08/Text/chapter004.xhtml/p000156
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=Tôi (Andrew); locked_elements=[''Thuật
    ngữ: phóng viên *WTN*, Ban biên tập thời sự, sĩ quan chính trị của Quân đội Liên
    bang.'', "Nhấn mạnh Markdown: chỉ bọc ''*WTN*'' theo DEC-P01-002.", ''Phủ định
    và so sánh: không có phóng viên *WTN* nào khác ở đây nên không được phép xao nhãng,
    vì ban biên tập ở quê nhà đáng sợ hơn bất kỳ sĩ quan chính trị nào.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000157
  kind: terminology_and_voice
  value: pov=Andrew (ngôi thứ nhất 'tôi'); pronouns_and_address=Tôi (Andrew); locked_elements=['Chi
    tiết ghi chép tốc ký các ý chính của phần phổ biến thông tin hơi khó theo dõi.']
- segment_id: YS-LN08/Text/chapter004.xhtml/p000158
  kind: terminology_and_voice
  value: 'speaker=First Lieutenant Tanechka; locked_elements=[''Thuật ngữ: Quân đội
    Liên bang, Quân đội Khối Thịnh vượng chung, các đồng minh và đồng chí, cuộc phản
    công lớn.'', "Giọng điệu tuyên truyền chính trị (''lực lượng phải đẩy lùi quân
    xâm lược vì nhân dân'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000159
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); pronouns_and_address=họ (phía Liên bang); locked_elements=[''Thuật
    ngữ: quan hệ truyền thông.'', ''Nhận xét hai vế: có biết đôi chút về quan hệ truyền
    thông nhưng vẫn còn quá nhiều chi tiết rườm rà khiến thông điệp chưa thực sự dễ
    hiểu.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000160
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=["Nhấn mạnh Markdown: chỉ bọc
    ''*Chúng tôi sẽ cùng nhau phản công*'' theo DEC-P01-002.", ''Câu hỏi tu từ châm
    biếm sự sáo rỗng của lời tuyên truyền.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000161
  kind: terminology_and_voice
  value: 'speaker=First Lieutenant Tanechka; pronouns_and_address=chúng ta; locked_elements=[''Thuật
    ngữ: Lục quân Đế quốc.'', ''Sự phân biệt giữa mục tiêu tối hậu (giành lại mảnh
    đất của nhân dân) và mục tiêu chính (đánh đuổi quân xâm lược là Lục quân Đế quốc).'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000162
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); Họ
    (phía Liên bang và lực lượng liên hợp); locked_elements=[''Thuật ngữ: Lục quân
    Đế quốc, đầu cầu (bridgehead), các chiến dịch trong tương lai.'', ''Chuỗi ba mục
    tiêu quân sự thực chất sau khi bóc tách lời lẽ cường điệu: kìm chân Lục quân Đế
    quốc, thiết lập đầu cầu và đảm bảo tuyến đường làm tiền đề.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000163
  kind: terminology_and_voice
  value: speaker=First Lieutenant Tanechka; locked_elements=['Lời kết thúc phần trình
