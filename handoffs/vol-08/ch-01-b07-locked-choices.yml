- segment_id: YS-LN08/Text/chapter004.xhtml/p000174
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=[''Thuật ngữ: Chúa, đoàn phóng
    viên.'', ''Sự đối lập giữa việc chỉ Chúa mới biết chắc và việc toàn bộ đoàn phóng
    viên đã coi chuyện vị đại tá không hiểu gì gần như là sự thật hiển nhiên.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000175
  kind: terminology_and_voice
  value: 'speaker=East-West News correspondent; pronouns_and_address=Tôi (phóng viên)
