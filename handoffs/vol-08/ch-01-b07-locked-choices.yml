- segment_id: YS-LN08/Text/chapter004.xhtml/p000166
  kind: terminology_and_voice
  value: 'speaker=East-West News correspondent; pronouns_and_address=Tôi (phóng viên
    tờ East-West News); locked_elements=[''Thuật ngữ: tờ *East-West News*, Lục quân
