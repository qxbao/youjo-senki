segment_id_end: YS-LN08/Text/chapter004.xhtml/p000334
choices:
- segment_id: YS-LN08/Text/chapter004.xhtml/p000292
  kind: terminology_and_voice
  value: 'choices=["Thoại & tình thái: giữ câu hỏi phỏng đoán lạc quan của đồng nghiệp
    (''…Vậy thì tôi đoán chuyện này cũng sắp ngã ngũ rồi nhỉ?'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & thuật ngữ: người kể chuyện ngôi thứ nhất
    Andrew tự xưng ''Tôi''; giữ tình thái dè dặt (''Tôi không chắc lắm'', ''Đây chỉ
    là cảm nhận cá nhân của tôi thôi, nhưng có vẻ...''); ''on the Rhine'' -> ''ở mặt
    trận Rhine''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: Andrew xưng ''Tôi'', dùng ''chúng
    tôi'' cho phe đồng minh và ''người ta'' cho đại từ khái quát ngôi thứ hai; giữ
    phủ định (''tôi không có cảm giác kẻ địch của chúng tôi sẽ dễ dàng gục ngã đến
    thế'') và tình thái (''hay có lẽ... dường như''); ''imperial positions'' -> ''trận
    địa của quân Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & nhấn mạnh: giữ nguyên câu hỏi nghi vấn nội tâm
    ''Phải chăng có thứ mãnh thú nào đó đang rình rập bên kia?''; không thêm chữ nghiêng
    theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi thoại: ''on the Rhine'' -> ''ở mặt trận Rhine'';
    giữ sắc thái hỏi xác nhận ''nhỉ?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ câu đáp khẳng định tự nhiên ''Chuyện đó cũng là
    lẽ tự nhiên thôi.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Phủ định & quan hệ nhượng bộ: giữ hai phủ định trong cấu trúc
    nhượng bộ (''Dù linh cảm của tôi không đủ cụ thể...'', ''tôi vẫn không thể xem
    nhẹ trực giác của mình'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn: giữ câu danh ngữ ngắn ''Một cơn mưa đạn pháo.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc phủ định ngoại trừ: ''The Rhine lines'' ->
    ''Phòng tuyến Rhine''; ''artillery barrages on the Rhine'' -> ''pháo kích... trên
    mặt trận Rhine''; giữ cấu trúc ''Không có cách nào khác để miêu tả nơi ấy ngoài...''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đại từ khái quát: ''the lines on the Rhine
    never moved'' -> ''phòng tuyến ở Rhine vẫn chưa từng dịch chuyển''; ''reporter''
    -> ''phóng viên''; dịch đại từ khái quát ngôi thứ hai thành ''người ta''; giữ
    sắc thái đối lập giữa nhãn gọi và ''một con quái vật không sao hiểu nổi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000302
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa: Andrew xưng ''tôi''; ''colleagues'' -> ''các
    đồng nghiệp''; giữ sắc thái ''những câu chuyện vô thưởng vô phạt'' cho các mẩu
    chuyện nhẹ nhàng thay vì nỗi kinh hoàng khó tả."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái nghi ngờ: ''These imperial soldiers''
    -> ''Những người lính Đế quốc này''; ''shell hole on the Rhine'' -> ''hố đạn pháo
    ở mặt trận Rhine''; dùng ''chúng ta'' cho phe mình và giữ tình thái ''Tôi nghi
    ngờ khả năng chúng ta có thể xóa sổ họ tại đây''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000304
  kind: terminology_and_voice
  value: 'choices=["Xưng hô đồng nghiệp: đồng nghiệp gọi tên ''Andrew'' và xưng hô
    ngôi thứ hai là ''Anh''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giả định: giữ phủ định về nguyên tắc (''không đánh
    cược bằng sinh mạng con người'') và hệ quả giả định (''Thắng một vụ cá cược rằng
    đồng minh của mình sẽ bỏ mạng chỉ làm hỏng vị rượu của tôi mà thôi'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000306
  kind: terminology_and_voice
  value: 'choices=["Phủ định giảm nhẹ & câu hỏi đuôi: giữ lời can và câu hỏi nghi
    vấn giảm nhẹ ''Chắc chắn tình hình đâu đến mức tệ hại thế chứ, phải không?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000307
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Andrew xưng ''tôi'', gọi các đồng nghiệp
    là ''các anh''; ''on the Rhine front'' -> ''ở mặt trận Rhine''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000308
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghịch lý: Andrew xưng ''tôi''/''mình''; ''war in
    the trenches'' -> ''cuộc chiến dưới chiến hào''; giữ mệnh đề nghịch lý ''điều
    chắc chắn duy nhất chính là sự bất định''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ quân sự: Andrew gọi các đồng nghiệp là ''các
    anh''; ''imperials'' -> ''quân Đế quốc''; ''counterattack'' -> ''phản công'';
    ''fifty-hour Republican preparatory barrage'' -> ''một đợt pháo kích chuẩn bị
    kéo dài năm mươi tiếng đồng hồ của quân Cộng hòa''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000310
  kind: terminology_and_voice
  value: 'choices=["Phủ định & quan hệ đối lập: giữ đối lập giữa việc miêu tả bằng
    lời và thực tế người từng tận mắt chứng kiến (''ngôn từ đơn giản là không sao
    lột tả hết được'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000311
  kind: terminology_and_voice
  value: 'choices=[''Thoại bỏ lửng & cảm thán: giữ dấu chấm lửng ngắt lời và câu hỏi
    cảm thán khi còi báo động vang lên.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000312
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: làm rõ tiếng còi báo động này giống với tiếng còi trong
    đợt tập kích lần trước của địch.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''press corps'' -> ''đoàn phóng viên''; chuyển
    chủ thể khái quát ở câu sau thành danh ngữ ''Việc tìm cách đi trước các đồng nghiệp
    một bước để chớp lấy một bức ảnh đắt giá cũng là lẽ tự nhiên''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000314
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & nhấn mạnh: dùng ''Chúng tôi'' cho nhóm
    phóng viên; ''front line'' -> ''tiền tuyến''; không dùng dấu sao cho phần suy
    nghĩ chung vì nguồn không có thẻ nhấn mạnh (DEC-P01-002)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000315
  kind: terminology_and_voice
  value: 'choices=["Thoại chiến trường: giữ hai câu cảm thán ngắn gọn ''Chúng tới
    rồi! Đúng như dự tính!''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000316
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''mages'' -> ''các pháp sư''; giữ đại từ ''chúng
    tôi'' chỉ nhóm phóng viên."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000317
  kind: terminology_and_voice
  value: 'choices=[''Thoại nhận xét: giữ dấu chấm lửng đầu câu và nhận xét ngắn về
    tác phong hiệu quả.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000318
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tình thái trái thực tế quá khứ: chỉ bọc từ
    ''*quá*'' trong dấu sao theo DEC-P01-002; giữ tình thái trái thực tế ''Lẽ ra căn
    cứ phải rơi vào cảnh nhốn nháo hỗn loạn...'' đối lập với thực tế trật tự."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=["Phủ định bộ phận & dấu ngoặc kép: giữ phủ định bộ phận (''Dù không
    hẳn là mọi việc vẫn diễn ra bình thường như chẳng có gì'') và dấu ngoặc kép quanh
    cụm ''“tích cực hành động”''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=["Dấu câu: giữ câu dẫn bỏ lửng ''Điều đó có nghĩa là…''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=["Thoại nghi vấn: giữ câu hỏi nhận định ''Họ đã lường trước sẽ có
    một cuộc tấn công ư?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000322
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ chuyển ý: ''encirclement battle'' -> ''trận
    đánh bao vây''; ''dispatch'' -> ''bản tin''; giữ dấu chấm lửng và sự tự đánh giá
    công việc của mình vẫn còn quá mờ nhạt."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000323
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: Andrew xưng ''Tôi'', quy chiếu
    Drake bằng ''ông ấy'' / ''người đàn ông ấy''; ''barracks'' -> ''khu nhà lính'';
    giữ dấu gạch ngang dài ở cuối câu."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=["Tình thái nghi vấn & ẩn dụ: giữ câu hỏi phỏng đoán ''Có lẽ ông
    ấy đang tự thưởng cho mình một bữa tiệc mừng chiến thắng nho nhỏ chăng?'' và lối
    nói ẩn dụ ''Người bạn tốt nhất của cánh nhà báo'' chỉ chai rượu."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Trung tá Drake gọi tên ''Andrew'', xưng ''Tôi''
    và gọi Andrew là ''cậu''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, tình thái suy luận & câu hỏi nội tâm: quy chiếu
    Drake bằng ''ông ấy''; giữ suy luận ''Nếu đang uống rượu thì hẳn ông ấy đã hết
    giờ làm nhiệm vụ'' và câu hỏi cuối đoạn không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=["Đại từ: Andrew xưng ''Tôi'', gọi Drake là ''ông ấy''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Andrew dùng ''Các ngài'' cho ngôi thứ hai
    số nhiều chỉ phía chỉ huy/đơn vị của Drake."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Drake dùng ''bọn tôi'' cho ''we'' và ''chúng''
    cho quân địch; giữ cấu trúc phủ định giảm nhẹ ''Cũng chẳng phải chuyện gì bọn
    tôi đang giấu giếm đâu, nhưng đúng vậy.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: giữ nhất quán ''các ngài'' (phía Drake) và ''chúng''
    (quân địch)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: ''military secret'' -> ''bí mật quân sự'';
    giữ cặp xưng hô ''tôi'' - ''cậu'' của Drake với Andrew."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=["Thoại khẩu ngữ: giữ sắc thái nài nỉ thân mật ''Làm ơn đi mà. Giúp
    chỗ quen biết chút đi.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật gọi Drake là ''ông ấy'', trong
    thoại Drake xưng ''tôi'' - gọi ''cậu''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''; ''its commander'' -> ''vị chỉ huy đơn vị đó''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái: giữ hai câu phủ định liên tiếp (''Đó chẳng
    phải là một câu trả lời thực sự'', ''Chắc chắn đó không phải kiểu câu trả lời
    đáng để tôi phải chật vật săn tìm'') và nhận định mỉa mai về độc giả ở quê nhà."]'
