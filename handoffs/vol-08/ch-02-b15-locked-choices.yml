choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000249
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ trong câu hỏi: Tanya gọi Zettour
    là ''thưa Tướng quân'', xưng ''tôi'' / ''chúng tôi''; ''Salamander Kampfgruppe''
    -> ''Kampfgruppe Salamander''; giữ ẩn dụ ''cụt mất một cánh tay'' (do mất một
    đại đội) và câu hỏi về việc phải tiếp tay cho trò lừa bịp nào."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000250
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & mệnh lệnh trong thoại: Zettour gọi đơn vị
    của Tanya là ''các cô''; ''Andromeda'' -> ''chiến dịch Andromeda''; ''B Front''
    -> ''Mặt trận B''; giữ ẩn dụ ''con chim hoàng yến quân sự'' và mệnh lệnh ''hãy
    cứ để mặc cho mình bị bao vây''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000251
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    giữ nét nghĩa Zettour thản nhiên nói ra điều động trời với vẻ mặt tỉnh bơ như
    không."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000252
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm ngắn: dùng ''*Để bị bao vây
    ư?*'' khớp toàn bộ phạm vi thẻ em trong nguồn theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000253
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát, nhấn mạnh Markdown & trần thuật: dùng đại từ
    khái quát ''bạn'' ở câu đầu; ''airborne unit'' -> ''đơn vị đổ bộ đường không'';
    dùng ''*đừng*'' khớp đúng phạm vi thẻ em trên từ phủ định trong nguồn theo DEC-P01-002;
    trần thuật quy chiếu Tanya bằng ''nó'' và Zettour bằng ''ông'' theo DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000254
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & trình tự tác chiến: Zettour tự xưng ''Ta'',
    dùng ''chúng ta'' và gọi nhóm Tanya là ''các cô''; ''maneuver battle'' -> ''trận
    đánh cơ động''; ''encirclement'' -> ''thế bao vây''; ''main lines'' -> ''các chiến
    tuyến chính''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000255
  kind: terminology_and_voice
  value: 'choices=["Dấu chấm lửng, phủ định & điểm nhìn: giữ dấu chấm lửng mở đầu,
    mệnh đề phủ định ''một người không phải đứng ra làm mồi nhử'' và yêu cầu phải
    có ít nhất một điều được bảo đảm vì quyền lợi của Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000256
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi phủ định: Tanya xưng ''Tôi'' / ''chúng tôi'';
    giữ câu hỏi xác nhận không bị bỏ rơi."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000257
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & giả định điều kiện: Zettour tự xưng ''Ta''
    / ''ta'' và gọi Tanya là ''các cô'' / ''cô''; ''company'' -> ''đại đội''; ''staffers''
    -> ''sĩ quan tham mưu''; giữ lời cam kết không bỏ rơi và kịch bản đích thân dẫn
    đại đội xông vào để kéo các sĩ quan tham mưu đi giải cứu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000258
  kind: terminology_and_voice
  value: 'choices=[''Tình thái & đánh giá rủi ro trong thoại: giữ nhận xét về nước
    đi rủi ro xét theo mức độ có thể ảnh hưởng tới kỷ luật quân đội.'']'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ phân cấp chiến tranh & mệnh lệnh tất yếu: phân biệt
    ''cấp độ chiến lược'' với ''cấp độ chiến dịch''; ''maneuver battle'' -> ''trận
    đánh cơ động''; giữ mệnh đề tất yếu ''Kẻ địch ở ngay trước mắt thì buộc phải tấn
    công.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=["Tình thái & điều kiện giới hạn: giữ quan hệ điều kiện (''có thể
    được biện minh nếu lập được chiến công đủ lớn'') và câu giới hạn phạm vi (''chỉ
    áp dụng trong những tình huống hết sức đặc thù mà thôi'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ, dấu chấm lửng & xưng hô: giữ thành ngữ ''Nói thì dễ
    hơn làm…'' kèm dấu chấm lửng và đại từ ''Tôi'' của Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000262
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phân công nhiệm vụ: Zettour gọi Tanya là ''cô'' và tự
    xưng ''ta''; giữ nhiệm vụ cốt lõi là chốt chặn tuyến đường sắt."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chuyển mạch hội thoại: Tanya xưng ''Tôi'' / ''tôi''
    / ''chúng tôi'' và gọi Zettour là ''ngài''; giữ nhịp tiếp nhận mệnh lệnh trước
    khi chuyển sang hỏi chi tiết nơi đóng quân."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000264
  kind: terminology_and_voice
  value: 'choices=["Điển tích binh pháp, phủ định & đại từ khái quát: dịch chuẩn câu
    danh ngôn Tôn Tử ''biết địch biết ta, trăm trận không nguy''; giữ đại từ khái
    quát ''bạn'', mệnh đề điều kiện phủ định về địa hình và câu nhấn mạnh ''Ngay cả
    chiến tranh hạt nhân cũng cần phải có bản đồ.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000265
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & địa danh mã hóa: Zettour gọi đơn vị của Tanya là ''Các
    cô''; giữ nguyên ''Soldim 528'' và ba đặc điểm vị trí (đô thị hóa vừa phải, khoảng
    cách vừa tầm, nằm ngay trên tuyến đường sắt) khiến nơi này thành mục tiêu tối
    ưu để địch tái chiếm."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000266
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: quy chiếu Zettour bằng ''ông''; giữ chi tiết điểm
    trên bản đồ chỉ được ký hiệu bằng một mã số định danh."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000267
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản biện, thuật ngữ & phủ định hoài nghi: Tanya xưng
    ''Tôi''; ''Federation Army'' -> ''Quân đội Liên bang''; ''stronghold'' -> ''cứ
    điểm kiên cố''; giữ câu hỏi ''Chẳng phải chúng sẽ chỉ việc đi vòng qua thôi sao?''
    và ý nghi ngờ địch không ngu xuẩn đâm đầu vào cứ điểm."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000268
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, giả định quá khứ & nhận định nội tâm: ''Federation
    Army'' -> ''Quân đội Liên bang''; ''Commies'' -> ''đám Cộng sản''; giữ đúng thời
    gian của khả thể quá khứ (''Trong quá khứ từng có những lúc chúng có thể cắn câu'')
    đối lập với sự cải thiện chất lượng gần đây."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000269
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & tình thái nhượng bộ: Tanya gọi Zettour là ''Ngài'';
    ''lower-ranking officers'' -> ''sĩ quan cấp thấp''; giữ cấu trúc nhượng bộ (''Ngay
    cả khi...'', ''Dù gọi họ là xuất sắc thì có lẽ hơi quá lời, nhưng đến giờ hẳn
    họ đã học được những điều cơ bản...'') và câu hỏi xác nhận cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000270
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phân biệt thuật ngữ chuyên môn & nhân quả: Zettour tự
    xưng ''Ta'' / ''ta''; phân biệt ''Operations'' (''Cục Tác chiến'') với ''operations''
    (''tác chiến'') và ''logistics'' (''hậu cần''); giữ quan hệ nhân quả nhấn mạnh
    ''chính vì quân địch biết suy tính hợp lý nên chúng mới nhắm vào tuyến đường sắt''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000271
  kind: terminology_and_voice
  value: 'choices=["Dấu chấm lửng & xưng hô trong câu hỏi: giữ dấu chấm lửng đầu câu;
    Tanya gọi Zettour là ''ngài'' và dùng đại từ phản thân ''mình''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000272
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định triệt để: Zettour gọi Tanya là ''cô''; giữ
    phủ định ''Nguyên lý chiến tranh chẳng liên quan gì đến ý thức hệ cả'' và hệ quả
    tất yếu khi phớt lờ các định luật vật lý."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu chấm lửng: Tanya xưng ''tôi''; giữ câu tán đồng
    ngập ngừng ''Vâng, tôi đồng ý…''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000274
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & điều kiện: ''Federation Army'' -> ''Quân
    đội Liên bang''; giữ phủ định về sự thiếu lựa chọn vận tải bằng xe tải hay ngựa
    kéo và kết luận đường sắt mang tầm quan trọng sống còn nếu địch mưu tính phản
    công."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & chức danh mô tả: ''logistics specialist Zettour''
    -> ''chuyên gia hậu cần Zettour''; giữ chi tiết Tanya bất giác chìm vào suy tư."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm, thuật ngữ & đối chiếu lịch sử: giữ độ mở của
    câu hỏi giả thuyết ''Liệu... chăng?''; ''eastern front'' -> ''mặt trận phía đông'';
    ''Soviet Union'' -> ''Liên Xô''; giữ tình thái đánh giá ''Giả thuyết ấy bắt đầu
    nghe có vẻ khá hợp lý rồi đấy.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & thuật ngữ quân sự: ''eastern army'' -> ''đạo
    quân phía đông''; ''armored vanguard'' -> ''đội tiên phong thiết giáp''; giữ sự
    đối lập giữa giả thuyết đường sắt của Zettour với niềm tin của đạo quân phía đông
    về mũi tiên phong thiết giáp địch."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & so sánh hơn: ''Federation Army'' -> ''Quân
    đội Liên bang''; giữ tình thái ''dường như'' và so sánh hơn ''coi trọng đường
    bộ và đường cao tốc hơn''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & lập luận bác bỏ: Zettour tự xưng ''Ta'' /
    ''ta'' và dùng ''chúng ta''; ''Federation Army'' -> ''Quân đội Liên bang''; ''matériel''
    -> ''vật tư và trang bị quân sự''; ''A Group'' / ''B Group'' / ''B Front'' ->
    ''Cụm A'' / ''Cụm B'' / ''Mặt trận B''; giữ cấu trúc nhượng bộ - hoài nghi về
    giới hạn binh lực thiết giáp của địch và mục tiêu nắm giữ vị trí trọng yếu trên
    đường sắt để tạm thời ổn định Mặt trận B."]'
