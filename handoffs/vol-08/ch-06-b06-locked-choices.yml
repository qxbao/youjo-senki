choices:
- segment_id: YS-LN08/Text/chapter022.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, thuật ngữ & nhấn mạnh: độc thoại nội tâm của
    Tanya tự quy chiếu bằng ''mình'' theo DEC-P01-001; ''Limeys and Commies'' -> ''Đám
    Ăng-lê và lũ Cộng sản''; ''the Commonwealth and the Federation'' -> ''Khối Thịnh
    vượng chung và Liên bang''; bảo toàn chính xác chữ nghiêng ''*mee*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi nội tâm: tiếp nối độc thoại nội tâm tự quy chiếu
    bằng ''mình'', gọi quân địch là ''bọn chúng''; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Báo cáo chiến trường: dịch gọn và rõ ''“Các pháp sư địch đang
    quay đầu!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & nhân vật: ''First Lieutenant Serebryakov'' -> ''Trung
    úy Serebryakov''; giữ tên ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nội tâm Tanya tự quy chiếu bằng ''mình'',
    gọi pháp sư địch là ''đám pháp sư địch'' / ''Chúng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & khẩu ngữ: ''feint'' -> ''đòn nghi binh''; xử lý cụm
    cảm thán thành ngữ ''isn’t performing half-bad, no, sir'' trong lời lẩm bẩm của
    Tanya là ''xoay xở cũng chẳng tệ chút nào đâu, thật đấy'' (không dịch nhầm ''sir''
    thành xưng hô với cấp trên)."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: nội tâm tự quy chiếu bằng ''mình''; ''pursuit
    battle'' -> ''trận truy kích''; giữ sắc thái phủ định dứt khoát ''là chuyện không
    tưởng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: dùng ''chúng ta'' cho đơn vị, ''mình'' cho
    cá nhân Tanya và ''bọn chúng'' cho pháp sư địch; giữ phủ định ''chẳng muốn dây
    vào bọn chúng chút nào''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Giả định & phủ định: giữ câu phàn nàn giả định của Tanya ''“Dù
    có được trả thêm phụ cấp thì cũng chẳng bõ công làm cái việc này...”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''labor union'' -> ''công đoàn''; ''public
    servants'' -> ''công chức''; ''collective bargaining rights'' -> ''quyền thương
    lượng tập thể''; ''labor standards supervisor'' -> ''thanh tra tiêu chuẩn lao
    động''; giữ đại từ ''chúng mình'' và tình thái ''có lẽ'', ''Xem ra đành phải hy
    vọng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng điệu: ''labor standards supervisor'' -> ''thanh
    tra tiêu chuẩn lao động''; ''Commissioned officers'' -> ''Các sĩ quan''; giữ giọng
    gọi khẩn thiết hài hước và quy chiếu thanh tra bằng ''ngài''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mệnh lệnh: ''fighter plane unit'' -> ''đơn vị máy
    bay tiêm kích''; ''Spatial area suppression'' -> ''Chế áp diện rộng trong không
    gian''; ''explosion formulas'' -> ''thuật thức phát nổ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh ngăn chặn: Tanya quát ngăn Grantz ''“Không được, Grantz!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Thán từ: Grantz bật thốt ''“Hả?”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & nghĩa từ: giữ tên ''Tanya''; dịch ''checks her subordinate''
    theo đúng nghĩa kiềm chế/chấn chỉnh thuộc cấp."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: dùng ''chúng ta''; ''anti-aircraft combat''
    -> ''tác chiến phòng không''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ chiến lược: dùng ''Mình'' cho Tanya và ''chúng
    ta'' cho đơn vị; ''engagement range'' -> ''tầm giao chiến''; ''fleet in being''
    -> ''hạm đội hiện hữu''; ''freedom of movement'' -> ''quyền tự do cơ động''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya gọi Grantz là ''anh''; ''Federation
    mage unit'' -> ''Đơn vị pháp sư Liên bang''; ''Type 97'' -> ''Type 97''; ''fighter
    planes'' -> ''máy bay tiêm kích''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & nhân vật: dùng ''chúng ta'' cho đơn vị và
    ''chúng'' cho quân địch; ''long-range fire'' -> ''hỏa lực tầm xa''; ''ground troops''
    -> ''quân mặt đất''; giữ tên ''Zettour''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Châm ngôn hành xử: giữ nhịp ngắt dấu chấm lửng và châm ngôn ''hãy
    chủ động làm những điều người ta ghét''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: dùng ''chúng ta'' cho đối tượng
    giáo dục chung và ''mình'' cho Tanya; ''compulsory education'' -> ''chương trình
    giáo dục bắt buộc''; ''the Empire’s staff officer curriculum'' -> ''chương trình
    đào tạo sĩ quan tham mưu của Đế quốc''; giữ tình thái ''có lẽ mình nên xem đó
    là một quy luật phổ quát''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định kép: giữ câu phản bác ''“Tuy vậy, cũng
    chẳng có lý do gì phải để chúng chạy thoát bình yên vô sự cả!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: nội tâm tự quy chiếu bằng ''mình''; giữ phủ
    định dứt khoát ''sẽ chẳng có màn lao bổ vào nào hết''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & trần thuật: giữ tên ''Grantz'', ''Weiss'', ''Serebryakov''
    và ''Tanya'' trong câu nhận xét tương phản."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kinh tế: ''Labor is a product'' -> ''Sức lao động là
    một loại hàng hóa''; ''dumping founded on sincerity'' -> ''hành vi bán phá giá
    xuất phát từ lòng tận tâm''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mệnh lệnh: ''formula bullets'' -> ''đạn thuật thức'';
    ''long-range optical sniping formulas'' -> ''thuật thức bắn tỉa quang học tầm
    xa''; giữ giọng mệnh lệnh quyết liệt của Tanya."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ: dùng ''chúng ta'' cho đơn vị, ''Mình'' cho Tanya,
    ''chúng'' cho quân địch; giữ lối chơi chữ ''chiêu đãi chúng một chầu kẹo đồng''
    và ẩn dụ ''trao cho mặt đất một cái ôm nồng thắm''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''Federation'' -> ''Liên bang'';
    ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''The Ildoans'' -> ''Người Ildoa'';
    giữ phủ định ''cả... lẫn... đều chẳng có hứng thú'', điều kiện ''nếu có dịp''
    và nhận định ''định mức hòa bình hiện tại đồng nghĩa với việc chúng ta sẽ chưa
    có cơ hội đó trong một thời gian dài''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: dùng ''chúng tôi'' khi Tanya thuật
    lại tầm bắn của đơn vị; ''formula bullets'' -> ''đạn thuật thức''; ''enemy aerial
    mages'' -> ''các pháp sư trên không của địch''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ & thuật ngữ: giữ cấu trúc trái thực tế ở quá
    khứ ''Đáng lẽ đây phải là một trận truy kích đơn giản... vậy mà kết quả lại quá
    nghèo nàn''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Nhân vật, đại từ & mệnh lệnh: giữ tên ''Tanya'', ''Weiss'', ''Grantz'';
    Tanya dùng ''Chúng ta'' khi hạ lệnh ngừng truy kích và rút lui."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Câu bỏ lửng: giữ câu can ngăn bị ngắt ngang của Grantz ''“Nhưng
    nếu chúng ta hành động ngay lúc này—!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Đại từ & hình ảnh hài hước: giữ tên ''Grantz'', quy chiếu Tanya
    bằng ''cô'' và Grantz bằng ''anh ta''; giữ nguyên hình ảnh ví von hài hước ''Grantz
    mê những chiếc ba lô đến mức cô đã quá quen với cảnh anh ta chỉ tay vào tấm lưng
    của quân địch và dùng ánh mắt nôn nóng van nài xin được truy kích''."]'
