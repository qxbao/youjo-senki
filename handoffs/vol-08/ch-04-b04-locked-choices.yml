choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật, đại từ & thuật ngữ: ''Lieutenant Serebryakov''
    -> ''Trung úy Serebryakov''; ''Lieutenant Tospan'' -> ''Trung úy Tospan''; ''periphery''
    -> ''vòng ngoài''; dùng đại từ ''chúng ta'' trong lời thoại của Tanya; không có
    chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Serebryakov đáp ''“Rõ, thưa Trung tá!”'',
    tự xưng ''tôi'' và gọi Tanya là ''ngài'' trong lời thề trung thành đầy nhiệt huyết."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: độc thoại nội tâm tự quy chiếu của Tanya dùng
    ''mình'' theo DEC-P01-001; giữ tên riêng ''Serebryakov''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật & thuật ngữ: trần thuật ngôi thứ ba dùng tên
    riêng ''Tanya'' và ''Tospan''; ''line one'' -> ''tuyến một''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: giữ đại từ ngôi thứ nhất số nhiều ''Chúng
    tôi'' khi thuật lại hoàn cảnh chung của đơn vị trong thời chiến."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & sắc thái: trần thuật ngôi thứ ba quy chiếu
    Tanya bằng ''cô''; giữ sắc thái cảm thán mạnh ''ghê tởm đến mức khốn nạn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại: giữ dấu chấm lửng mở đầu câu cảm thán ''“…Không
    thể tin nổi,”''; trần thuật quy chiếu Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa & nhịp câu: giữ hai câu ngắn nhấn mạnh số lượng xác chết
    nằm la liệt khắp nơi.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Giả định & địa danh: giữ cấu trúc giả định trái thực tế ''Nếu
    đây là mặt trận Rhine vào những ngày đầu, chẳng hạn như năm 1923, thì lại là chuyện
    khác.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & thuật ngữ: giữ phủ định ''còn chưa biết
    đến uy lực của súng máy'' và tình thái ''có lẽ học thuyết xung phong túm tụm sát
    nhau như thế vẫn còn có thể biện minh được''; dùng ''chúng ta'' chỉ con người
    nói chung."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Niên lịch & đối lập: ''Unified Year 1927'' -> ''Năm Thống nhất
    1927''; giữ câu chuyển ý ngắn đối lập với giả định ở hai đoạn trước."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Chuỗi câu hỏi tu từ, xưng hô & thuật ngữ: giữ liên tiếp năm câu
    hỏi tu từ; gọi đối phương trong độc thoại là ''Các người''; ''Federation ideology''
    -> ''hệ tư tưởng của Liên bang''; ''space-time'' -> ''không–thời gian''; ''ancient
    legion'' -> ''quân đoàn cổ đại''; ''close formation'' -> ''đội hình dày đặc''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & giả định: ''Federation Army'' -> ''Quân đội
    Liên bang''; ''human bullets'' -> ''những viên đạn thịt''; ''buttoned-up and fortified
    imperial firing positions'' -> ''các hỏa điểm của Đế quốc đã được đóng kín và
    gia cố kiên cố''; ''unit cohesion'' -> ''sự gắn kết của đơn vị''; ''smoke screen''
    -> ''màn khói ngụy trang''; ''sitting ducks'' -> ''những tấm bia tập bắn''; giữ
    giả định quá khứ ''Có lẽ tình hình đã hơi khác đi đôi chút nếu có màn khói ngụy
    trang''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & quan hệ đối lập: ''our light machine guns''
    -> ''súng trung liên của quân ta''; giữ đối lập giữa âm thanh vững bụng của tiếng
    súng và cảnh con người bị đốn gục hàng loạt trước mắt ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, thuật ngữ & đại từ: ''These damn Communists'' ->
    ''Đám Cộng sản khốn kiếp này''; quy chiếu đối phương bằng ''Chúng'' trong câu
    hỏi tu từ."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ phủ định ''không thể nào biện minh nổi
    dù xét trên phương diện nhân đạo, kinh tế hay quân sự''; ''Communism'' -> ''Chủ
    nghĩa Cộng sản''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi: quy chiếu đối phương bằng ''Chúng'';
    ''human resources'' -> ''nguồn nhân lực''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tên gọi: độc thoại nội tâm tự quy chiếu của
    Tanya dùng ''mình'' theo DEC-P01-001; ''cultists'' -> ''đám cuồng giáo''; giữ
    nguyên ''Being X''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & giọng thoại: giữ lời phê phán giới chỉ huy địch của
    ''Tanya'' và cụm ''bất giác thốt lên nỗi phẫn nộ chính nghĩa của mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & phủ định: trần thuật ngôi thứ ba dùng ''Tanya'';
    ''the Federation'' -> ''Liên bang''; ''human resources'' -> ''nguồn nhân lực'';
    giữ phủ định ''cũng đâu phải chuyện Tanya cần bận tâm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: độc thoại nội tâm tự quy chiếu của Tanya dùng
    ''mình'' theo DEC-P01-001; quy chiếu đối phương bằng ''chúng'' (''một lũ đần độn'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, thuật ngữ & đối lập: dùng họ tên đầy đủ ''Tanya
    von Degurechaff'' và đại từ ''Cô''; ''the Dacians'' -> ''người Dacia''; ''Federation
    Army'' -> ''Quân đội Liên bang''; giữ rõ đối lập giữa việc người Dacia ngốc nghếch
    vì ''không biết gì hơn'' với việc Quân đội Liên bang ''thừa biết mình đang làm
    gì''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa: trần thuật dùng ''Tanya''; giữ sự phân định
    rạch ròi giữa ''tự do tư tưởng'' và ''bổn phận của mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: ''defensive position on the forward-most
    line'' -> ''trận địa phòng ngự ở tuyến đầu tiên''; giữ tên riêng ''Tanya'', quy
    chiếu đơn vị phòng ngự bằng ''họ'' và quân địch bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, thuật ngữ & chú thích: nội tâm tự quy chiếu
    của Tanya dùng ''Mình'' theo DEC-P01-001; quy chiếu binh lính địch bằng ''Họ''
    / ''họ''; ''the plank of Carneades.³'' -> ''tấm ván của Carneades.³'' (giữ nguyên
    chỉ số chú thích ³)."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại mệnh lệnh: giữ ba câu mệnh lệnh ngắn kiểm soát hỏa
    lực ''“Nhử chúng lại gần! Khoan bắn! Chưa đến lúc đâu!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Địa danh & thuật ngữ: ''on the Rhine'' -> ''ở mặt trận Rhine'';
    ''light machine gun barrels'' -> ''nòng súng trung liên''; ''eastern front'' ->
    ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: dùng ''chúng tôi'' cho phía đơn
    vị của Tanya; giữ phủ định nhân quả ''Vì chúng tôi không có đủ nguồn lực để duy
    trì hỏa lực chế áp không giới hạn, binh lính không thể cứ thế xả đạn như mưa được'';
    ''close-range salvo'' -> ''đồng loạt khai hỏa ở cự ly gần''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Đại từ, địa danh & trích dẫn: dùng ''Chúng ta'' khi nhắc lại trải
    nghiệm của quân Đế quốc ở ''mặt trận Rhine''; giữ nguyên cụm trích dẫn trong ngoặc
    kép “sự lãng phí tài nguyên quốc gia một cách ngu xuẩn ở quy mô không thể tin
    nổi”."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ ''chúng ta''; ''supply network'' -> ''mạng
    lưới tiếp vận''; ''raison d’état'' -> ''lý tính nhà nước'' (không in nghiêng do
    nguồn không nhấn mạnh)."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & cấu trúc đảo: độc thoại nội tâm tự quy chiếu
    của Tanya dùng ''mình'' theo DEC-P01-001; giữ cấu trúc đối xứng đảo chiều giữa
    ''kẻ tỉnh táo'' và ''kẻ điên''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Địa danh, đại từ, thuật ngữ & phủ định kép: ''eastern front''
    -> ''mặt trận phía đông''; dùng ''Chúng tôi'' / ''chúng tôi'' cho phía đơn vị
    của Tanya; ''logistics'' -> ''ngành hậu cần''; ''shells'' -> ''đạn pháo''; giữ
    phủ định kép ở cuối đoạn ''chẳng thể giả vờ như không nhận ra''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cảnh báo & thuật ngữ: giữ câu hô cảnh báo khẩn cấp
    ''“Đạn pháo hạng nặng đang bay tới!”''."]'
