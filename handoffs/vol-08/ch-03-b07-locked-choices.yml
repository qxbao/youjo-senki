choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & nhân vật: quy chiếu Tanya bằng ''Tanya''
    / ''cô'' / ''mình'' (phản thân); giữ tên riêng ''Serebryakov'' và ''Grantz'';
    giữ quan hệ đối lập (''thiếu kinh nghiệm, nhưng họ bù đắp điều đó bằng sự nhiệt
    huyết'') và tình thái chắc chắn (''hẳn cô có quyền tự hào'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & giới hạn: giữ tên ''Wüstemann'' và cấu trúc giới hạn
    (''Tất cả những gì Wüstemann cần chỉ là một chút thời gian và sự uốn nắn bằng
    lý lẽ'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya tự xưng ''Tôi'' và gọi Wüstemann là
    ''Trung úy'' (''Lieutenant'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: dịch ''ma’am'' khi Wüstemann cảm ơn Tanya
    là ''Trung tá ạ!''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, dấu hai chấm, phủ định đối lập & điều kiện: Tanya gọi
    Wüstemann là ''anh'' và ''Trung úy''; giữ dấu hai chấm sau lời gọi, cấu trúc đối
    lập phủ định (''không phải ở việc giành điểm số cao nhất mà là có mức trung bình
    tốt nhất'') và câu điều kiện (''Anh sẽ dễ sống sót hơn nếu mài bớt những điểm
    yếu của mình'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: Wüstemann tự xưng ''Tôi'' / ''tôi'', gọi Tanya
    là ''thưa Trung tá'' (''ma’am''); giữ dấu gạch ngang dài."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & mức độ: giữ tên ''Tanya'' và nhận định đánh giá (''Hiếm
    có ai lại chân thành đến vậy'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Weiss gọi Tanya là ''ngài'' và ''thưa Trung
    tá'' (''Colonel''), nhất quán với ch-03-b05."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya gọi Weiss là ''Anh'' / ''anh'' và ''Thiếu
    tá'' (''Major''), dùng ''Chúng tôi'' cho đơn vị."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & đại từ: tự quy chiếu nội tâm của Tanya bằng
    ''Mình'' theo DEC-P01-001; quy chiếu Weiss bằng ''anh ta''; giữ nhận định khái
    quát ở câu thứ hai."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: Tanya tự xưng ''Tôi'', dùng ''Chúng
    ta'', gọi Wüstemann là ''Trung úy Wüstemann'', gọi Weiss là ''anh'' và ''Thiếu
    tá Weiss''; ''intercept the enemy'' -> ''đánh chặn quân địch''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn đan xen, thuật ngữ & điều kiện bỏ lửng: giữ sự chuyển
    đổi từ nội tâm ngôi thứ nhất (''mình'' theo DEC-P01-001) sang câu kết mang tính
    tự trào ở ngôi thứ ba (''Tanya''); ''on-the-job training'' -> ''đào tạo tại chỗ'';
    giữ mệnh đề điều kiện và dấu chấm lửng (''Nếu mình có đủ khoảng trống để bọc lót
    cho họ thì chẳng sao, nhưng…'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đơn vị & quân hàm: tự quy chiếu bằng ''mình''
    theo DEC-P01-001; ''Grantz’s company'' -> ''đại đội của Grantz''; ''General von
    Zettour'' -> ''thưa Tướng von Zettour'' (quy chiếu bằng ''ngài''); giữ dấu gạch
    ngang dài và sắc thái oán thán mỉa mai."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Serebryakov tự xưng ''Tôi'' và gọi Tanya là
    ''thưa Trung tá'' (''ma’am'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm & xưng hô: chỉ bọc câu độc thoại
    xen ngang ''*Có thêm bao nhiêu người hỗ trợ cũng không bao giờ là thừa*'' trong
    dấu sao theo DEC-P01-002; ''Lieutenant Serebryakov'' -> ''Trung úy Serebryakov''
    (gọi là ''cô''); ''Lieutenant Wüstemann'' -> ''Trung úy Wüstemann''; ''adjutant''
    -> ''viên sĩ quan phụ tá''; quy chiếu Tanya trong trần thuật bằng ''Tanya'' /
    ''mình''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhượng bộ & phủ định: ''air superiority'' -> ''ưu thế
    trên không''; ''enemy mages'' -> ''các pháp sư địch''; giữ dấu gạch ngang dài
    và mệnh đề nhượng bộ phủ định (''dẫu việc bay lên chẳng hề đơn giản khi các pháp
    sư địch đang kéo tới tấn công'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, câu hỏi & đối lập: giữ câu hỏi nghi vấn mở
    đầu; tự quy chiếu bằng ''Mình'' theo DEC-P01-001 và dùng ''chúng tôi'' cho đơn
    vị; giữ đối lập (''bay lên theo đội hình thay vì phải vội vã xuất kích trong lúc
    bị quấy rối'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, thuật ngữ & câu hỏi phủ định: giữ dấu chấm lửng mở đầu;
    ''artillery fire'' -> ''pháo kích''; ''charge'' -> ''xung phong''; giữ câu hỏi
    nghi vấn phủ định (''Pháo của chúng chưa được hiệu chỉnh sao?'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & dấu câu: tự quy chiếu bằng ''mình''
    theo DEC-P01-001; ''replacement company'' -> ''đại đội bổ sung''; ''combat discipline''
    -> ''kỷ luật tác chiến''; giữ dấu gạch ngang dài."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trang bị & mức độ: ''Elinium Arms Type 97 Assault Computation
    Orbs'' -> ''Quả cầu Tính toán Xung kích Type 97 của Elinium Arms''; giữ trạng
    ngữ chêm ''dù chỉ vừa vặn đủ sức'' và tên ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''cô'' trong câu trần
    thuật nối tiếp."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi & dấu câu: ''human capital'' -> ''vốn con người''
    theo P03-human-capital; giữ câu hỏi cảm thán đầu thoại, đại từ ''Chúng ta'' và
    dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc song hành & thuật ngữ: giữ phép điệp đối xứng (''Kẻ nghèo
    đấu với kẻ nghèo, đã thế lại còn là đám nghiệp dư đấu với đám nghiệp dư'') và
    nhận định về mức độ ''tổng lực'' của cuộc chiến."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối lập thời gian: ''Imperial Army'' -> ''Lục quân
    Đế quốc''; ''aerial mages'' -> ''pháp sư trên không''; ''newly minted mage(s)''
    -> ''pháp sư mới ra lò''; ''artillery observation'' -> ''quan sát pháo binh'';
    giữ sự đối lập giữa tiêu chuẩn cao thời tiền chiến và tình cảnh bất đắc dĩ hiện
    tại (''chẳng còn lựa chọn nào khác ngoài việc phải giao phó...'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Phủ định, nhân quả & ẩn dụ: giữ câu phủ định mở đầu (''Chẳng có
    thời gian để đào tạo bài bản''); ''front lines'' / ''the front'' -> ''tiền tuyến'';
    giữ quan hệ hệ quả (''Hậu quả là...'') và hai hình ảnh ẩn dụ (''đám gà non'',
    ''cuộc săn gà tây'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn đan xen, thuật ngữ & dấu câu: giữ sự chuyển tiếp từ
    nhận định chung (''chúng ta'') sang độc thoại nội tâm ngôi thứ nhất (''mình''
    theo DEC-P01-001) rồi sang trần thuật ngôi thứ ba (''Tanya''); ''attrition'' ->
    ''sự tiêu hao''; giữ cặp dấu gạch ngang dài giải thích thuật ngữ (''tỷ lệ duy
    trì quân số—tức tỷ lệ sống sót—'') và cụm ''những tấm lá chắn thịt của mình''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thành ngữ: giữ dấu chấm lửng mở đầu; ''going by the
    book'' -> ''hành động rập khuôn theo sách vở''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Trình tự hành động: giữ trình tự chiến thuật ''Lấy độ cao trong
    lúc lập đội hình giữa không trung, rồi mới chạm trán kẻ địch'' và thế giằng co
    ở câu sau."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["So sánh & định danh: dùng ''chúng tôi'' cho ''our''; ''Federation''
    -> ''Liên bang''; giữ cấu trúc so sánh hơn kép (''nhiều nhân sự hơn và co cụm
    sát nhau hơn'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đối lập & chuyển dịch: ''Imperial Army'' -> ''Lục quân
    Đế quốc''; ''Federation'' -> ''Liên bang''; ''Empire'' -> ''Đế quốc''; giữ thành
    ngữ ''tự bắn vào chân mình'', cụm ''ưu thế về chất lượng lẫn số lượng'' và sự
    chuyển dịch thời gian ở câu cuối (''Thế nhưng giờ đây, có vẻ như cán cân quân
    số đang dịch chuyển về thế cân bằng'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & đánh giá phủ định: giữ dấu chấm lửng mở đầu; ''The Federation’s
    no slouch'' -> ''Liên bang cũng chẳng phải tay vừa''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Cảm thán: giữ câu cảm thán ngắn gọn ''Tình cảnh mới đáng buồn
    làm sao.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, phủ định & tăng tiến: tự quy chiếu bằng ''Mình''
    theo DEC-P01-001; giữ sắc thái nói giảm phủ định (''chẳng mấy chán ghét'', ''chẳng
    dễ chịu chút nào'') và cấu trúc tăng tiến (''huống hồ là một cuộc chiến tranh'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Cảnh báo ngắn: giữ câu hô cảnh báo ''“Địch khai hỏa!”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & khẩu lệnh vô tuyến: giữ tên ''Tanya'', hô hiệu ''01''
    và khẩu lệnh ''“01 gọi toàn thể các đơn vị, bắn trả!”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Nhân quả, thuật ngữ & đối lập: ''optical sniper formulas'' ->
    ''thuật thức bắn tỉa quang học''; giữ quan hệ nhân quả ở câu đầu và sự đối lập
    ở câu sau (''Dù vậy, sự bạo ngược của khoảng cách vẫn tàn phá không thương tiếc
    độ chính xác lẫn uy lực của làn đạn bay tới'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhân quả & dấu câu: ''formula bullets'' -> ''đạn thuật
    thức''; giữ quan hệ nguyên nhân – hệ quả, dấu gạch ngang dài và lời than ngắn
    ở cuối câu (''—thật đau đầu'')."]'
