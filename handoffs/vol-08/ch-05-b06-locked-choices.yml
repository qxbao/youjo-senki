choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*…Mặc dù điều này cũng là minh chứng
    cho thấy nếu không có chiến lược đó, chúng ta sẽ chẳng có mấy hy vọng đối phó
    với xe tăng địch.*'' ở câu đầu theo DEC-P01-002.", "Đại từ và đối lập thời gian:
    ''chúng ta'' (we); giữ đối lập giữa học thuyết trước đây (''đợt xung kích cận
    chiến của pháp sư hoặc thậm chí là của bộ binh'') và thực tại (''xem chừng khá
    bất khả thi'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và thuật ngữ: ''người thuyết minh thực địa'' (field commentator),
    ''Trung úy Grantz'' (Lieutenant Grantz), ''pháo chống tăng'' (anti-tank guns),
    ''mặt trận phía đông'' (eastern front)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: Grantz xưng ''chúng tôi'' với Zettour; giữ
    ''Kampfgruppe'', ''các phương tiện phi cơ giới'' (nonmotorized vehicles), ''lực
    lượng pháp sư và cơ giới'' (mage and mechanized forces), ''lực lượng thiết giáp''
    (armored forces), ''tập trung hỏa lực'' (concentrated fire), ''giải pháp tình
    thế'' (stop-gap solution)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn gọn của Zettour: ''Vậy là một biện pháp bất đắc
    dĩ trong thế bí. Nhưng nó hiệu quả.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ và tình thái: ''Cái khó ló cái khôn.'', ''sức sáng tạo
    hẳn sẽ tăng tốc mà chẳng mấy bận tâm đến vẻ bề ngoài''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''ông'' (Zettour)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Pháp sư trên không!'' (Aerial mages!)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Thoại reo hò: ''Họ đến rồi!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: ''Đúng lúc nhất trên đời!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh và thuật ngữ: ''Chuẩn bị pháo hiệu! Bắn lên đi!'' (signal
    flares)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Thoại gọi chi viện: ''Ở đằng này, các pháp sư ơi!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Đại từ và thuật ngữ: ''Ông'' (Zettour), ''ba biên đội'' (three
    formations), ''tiểu đoàn pháp sư trên không'' (aerial mage battalion), ''Cụm B''
    (B Group)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và cấu trúc phủ định: ''không hạm đội'' (aerial fleet),
    ''không phải chỉ có sư đoàn của Cramm đơn độc tác chiến''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''các đơn vị ở miền đông'' (the units in the east)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Trời đất ạ. Không ngờ lại có ngày
    mình phải lo lắng về quân ta khi đang tác chiến.*'' đúng phạm vi câu nội tâm được
    in nghiêng theo DEC-P01-002.", "Đại từ: trần thuật dùng ''ông'', nội tâm tự quy
    chiếu dùng ''mình'' và ''quân ta''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: Zettour xưng ''ta'' trong thoại; ''tiểu
    đoàn pháp sư'' (mage battalion)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ động tác bay và chuyên môn: ''nghiêng cánh chào'' (banking
    to wave), ''lộn vòng ngang trên không'' (barrel-rolled), ''tín hiệu nhận diện
    địch-ta'' (friend-or-foe response), ''pháo hiệu'' (signal flares), ''kẻ ngoại
    đạo đến sau trong lĩnh vực ma pháp hàng không'' (a latecomer layman in the field
    of aerial magic)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Chuỗi danh từ nhận thức: ''những định kiến có sẵn, những ấn tượng
    chủ quan và cả những hiểu lầm''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Đại từ và thuật ngữ: ''ông'' (Zettour), ''các pháp sư trên không
    ở miền đông'' (aerial mages in the east), ''thuật thức nghi binh quang học'' (optical
    deception formulas), ''đợt sát hạch tuyển chọn của Tiểu đoàn Pháp sư Trên không
    số 203'' (the 203rd Aerial Mage Battalion screening process)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Không…*'' ở đầu đoạn theo DEC-P01-002.",
    "Giả định và nhượng bộ: ''Bất kỳ ai sống sót được lâu đến vậy đều sẽ tích lũy
    được vốn kinh nghiệm thực chiến tối thiểu, dù muốn hay không.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Nhân cách hóa trong thoại của Zettour: viết hoa ''Kinh nghiệm''
    (Experience) và gọi bằng ''Ngươi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép và đại từ: ''không thể phủ nhận rằng nó là một người
    thầy tuyệt vời'', ''Chẳng ai có thể bảo hiệu quả giáo dục của nó là kém xuất sắc
    được''; đại từ ''nó'' (Kinh nghiệm) và ''ông'' (Zettour)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và ẩn dụ: ''lĩnh vực ma pháp hàng không'' (the realm
    of aerial magic), ''một người thầy khác ngoài Kinh nghiệm'' (a teacher besides
    Experience); đại từ trần thuật ''ông''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Đây là một cơ hội tuyệt vời, mình
    nên hỏi ý kiến thẳng thắn không giấu giếm của cậu ta*'' theo DEC-P01-002.", "Đại
    từ và xưng hô: nội tâm Zettour dùng ''mình'' và ''cậu ta''; trong thoại gọi ''Trung
    úy Grantz'' và ''cậu''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán ngắn của Grantz: ''Hả?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Zettour với Grantz: xưng ''Ta'', gọi ''cậu''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Grantz với Zettour: ''Ồ? Tôi xin sẵn sàng phục vụ
    ngài, thưa Tướng quân.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ và đại từ: ''Vị trung úy trẻ tuổi'' (The young
    first lieutenant), ''ông'' (Zettour), ''anh'' (Grantz), ''tiền tuyến'' (the front
    line)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi điểm nhìn của Zettour về Grantz: ''Làm sao anh có thể
    bình thản đến thế giữa bầu không khí căng thẳng ngoài tiền tuyến?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và yêu cầu của Zettour: ''Hãy cho ta nghe đánh giá thẳng
    thắn không kiêng dè của cậu về màn thể hiện của họ.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm và thuật ngữ: Grantz xưng ''tôi'', gọi ''Ngài''
    / ''thưa Tướng quân''; ''các pháp sư trên không'' (aerial mages), ''Trung tá von
    Degurechaff'' (Colonel von Degurechaff), ''huấn luyện viên tác chiến'' (combat
    instructor)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''hậu phương'' (the rear)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ trong lời Zettour: xưng ''ta'', gọi ''Cậu'';
    ''cuộc sát hạch chính thức'' (official examination), ''tường thuật trực tiếp''
    (running commentary)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Grantz: ''Thưa Tướng quân? Ý ngài cụ thể là sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Zettour: gọi ''Cậu'', xưng ''ta'' / ''mình''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Thoại của Grantz: ''…Tôi chưa từng nghĩ tới chuyện đó bao giờ
    ạ.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Grantz: ''Chàng thanh niên khuôn phép này'',
    ''Anh''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Mệnh đề khái quát: ''Chiến tranh dẫn tới sự hủy diệt.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Chuỗi lập luận tâm lý quân nhân: ''xử lý bản thân cuộc chiến''
    (deal with war itself), ''đối diện với ý nghĩa của nó'' (confront the meaning
    of it), ''Một sĩ quan không có khoảng thư giãn trong tâm trí sẽ mang một đầu óc
    cứng nhắc. Một đầu óc cứng nhắc là một đầu óc mong manh dễ vỡ.'', ''ngoài việc
    gồng cứng người lên'' (except by stiffening up)."]'
