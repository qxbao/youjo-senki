choices:
- segment_id: YS-LN08/Text/chapter006.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & thuật ngữ: giữ định dạng viết hoa toàn bộ ''NGÀY
    26 THÁNG 5 NĂM THỐNG NHẤT 1927, LÃNH THỔ LIÊN BANG, QUÂN KHU TRUNG TÂM, DOANH
    TRẠI ĐỒN TRÚ CỦA ĐƠN VỊ ĐA QUỐC GIA''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''Federation'' -> ''Liên bang''; ''Commonwealth''
    -> ''Khối Thịnh vượng chung''; ''the tribe'' -> ''bộ tộc''; ''Communists'' ->
    ''đám người Cộng sản''; cần sửa ''superstitious'' thành ''mê tín'' (thay vì ''đa
    nghi'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tên gọi: người kể chuyện ngôi thứ nhất John
    Doe tự xưng ''tôi'' (DEC-P01-001 chỉ áp dụng cho Tanya); ''the man without a name''
    -> ''kẻ vô danh''; ''Mr. John'' -> ''ông John''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: John Doe xưng ''tôi''; ''Commies''
    -> ''đám Cộng sản''; ''visa issuer'' -> ''viên chức cấp thị thực''; ''Commonwealth''
    -> ''Khối Thịnh vượng chung''; giữ tình thái ''có vẻ lại tưởng'' và cấu trúc giới
    hạn ''chẳng qua chỉ là''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: John Doe xưng ''tôi''; ''gentleman'' -> ''quý
    ông''; giữ tình thái ''có lẽ tôi nên''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & so sánh: John Doe xưng ''tôi'' / ''mình'';
    ''Federation'' -> ''Liên bang''; ''messenger'' -> ''người đưa tin''; giữ cấu trúc
    nhượng bộ ''Ngay cả khi chỉ là...'' và so sánh hơn ''căng thẳng hơn bất kỳ lúc
    nào kể từ sau nhiệm vụ đầu tiên của mình''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: John Doe xưng ''tôi'' / ''mình''; giữ quan hệ
    mức độ ''Tệ đến mức tôi thực sự cảm thấy nhẹ nhõm...'' và nhận định ''Dạo gần
    đây hiếm khi nào tôi lại như vậy''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & xưng hô: ''Colonel Drake'' -> ''Trung tá Drake'' (theo
    cấp bậc thực tế của Drake); John Doe (lớn tuổi hơn) gọi Drake là ''anh''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Tên gọi, xưng hô & câu hỏi đuôi phủ định: ''Mr. Johnson'' -> ''ông
    Johnson''; Drake gọi Johnson là ''ông''; ''savages'' -> ''đám mọi rợ''; giữ câu
    hỏi đuôi phủ định ''ông không bị đám mọi rợ nào tấn công đấy chứ?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Đại từ & từ vựng: Johnson tự xưng ''tôi''; giữ sự lặp lại cụm
    ''đám mọi rợ'' để nối tiếp lời thoại của Drake."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''Federation officials'' -> ''giới chức Liên
    bang''; ''diplomatic envoys'' -> ''các phái viên ngoại giao''; ''“visa issuer”''
    -> ''“viên chức cấp thị thực”'' (giữ ngoặc kép); ''Federation’s secret police''
    -> ''cảnh sát mật Liên bang''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thuật ngữ: giữ dấu chấm lửng mở đầu ''…Hóa ra''; ''the
    Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & đại từ: ''Colonel Drake'' -> ''Trung tá Drake''; Johnson
    tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & thành ngữ: quy chiếu Drake bằng ''Anh ta''
    trong lời kể của Johnson; ''front lines'' -> ''tiền tuyến''; ''never say never''
    -> ''chẳng nói trước được điều gì''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Tên gọi, thuật ngữ & tự xưng: ''General Habergram'' -> ''Tướng
    Habergram''; ''eastern front'' -> ''mặt trận phía đông''; Johnson tự xưng ''tôi''
    và tự ví mình là ''một lão già như tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Drake tự xưng ''Tôi'' và gọi Johnson là ''ông''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ & đại từ: ''Lieutenant Colonel Drake'' -> ''Trung
    tá Drake''; ''Intelligence agency'' -> ''cơ quan Tình báo''; Johnson tự xưng ''tôi''
    / ''mình'' và quy chiếu Drake bằng ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Tình thái giả định quá khứ & đại từ: giữ cấu trúc tiếc nuối ''Ước
    gì tôi đã mang cho anh ta một chai gì đó''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: tự xưng ''Tôi'' / ''tôi''; giữ cấu
    trúc phủ định ''chẳng có gì ngoài phiền phức cả'', ''Tôi không biết''; ''evil
    nest of Communists'' -> ''hang ổ tà ác của đám Cộng sản''; ''liaison'' -> ''người
    liên lạc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & phủ định: ''Federation'' -> ''Liên bang'';
    giữ chuỗi tình thái và phủ định (''chẳng có lý do gì phải lo lắng cả'', ''có lẽ
    đang được khoản đãi'', ''Tôi sẽ chẳng ngạc nhiên nếu...'', ''Trái lại, nếu nghĩ
    rằng toàn bộ nơi này không bị cài thiết bị nghe lén thì mới là lạ'', ''Đấy vốn
    chẳng phải vấn đề thuộc về lẽ thường tình'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Federation’s Communist Party’s secret police''
    -> ''Cảnh sát mật của Đảng Cộng sản Liên bang''; quy chiếu bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi: Johnson gọi Drake là ''Anh''; ''the
    higher-ups'' -> ''cấp trên''; giữ câu hỏi gợi mở."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Drake gọi Johnson là ''Ông'' và tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: Johnson tự xưng ''Tôi'', dùng ''chúng ta''
    cho ''we'' (hai người đang đối thoại); giữ tình thái phủ định ''nên sẽ chẳng thành
    vấn đề đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & đại từ: giữ câu điều kiện ''Nếu đằng nào chuyện
    cũng đã phơi bày ra đấy rồi, thì cứ làm tới luôn đi'' và đại từ ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''the home country'' -> ''chính quốc''; ''Federation''
    -> ''Liên bang''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: Drake xưng ''Tôi''; ''the home country'' ->
    ''chính quốc''; ''conservative'' -> ''có tư tưởng bảo thủ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & dấu câu: giữ phủ định giảm nhẹ ''Cũng chẳng
    thay đổi mấy đâu''; ''Communism'' -> ''Chủ nghĩa Cộng sản''; ''the party'' ->
    ''Đảng''; ''agricultural policy'' -> ''chính sách nông nghiệp''; giữ dấu chấm
    phẩy và dấu gạch ngang dài."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ nguyên ''“Nói cách khác là?”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''Communism'' -> ''Chủ nghĩa Cộng sản'';
    giữ dấu nháy đơn quanh ''‘kỳ thú’'' để biểu thị sự mỉa mai."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''Commonwealth'' -> ''Khối Thịnh vượng chung'';
    ''colonials'' -> ''dân thuộc địa''; ''the home country'' -> ''chính quốc''; ''bona
    fide gentleman'' -> ''quý ông chính hiệu''; giữ phép đối lập giữa ''dân thuộc
    địa'' và ''người nào đến từ chính quốc'' cùng sắc thái mỉa mai chua cay."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: Johnson tự xưng ''tôi'', gọi Drake là ''anh
    ta''; giữ tình thái ''có vẻ đang cố nhịn cười''."]'
