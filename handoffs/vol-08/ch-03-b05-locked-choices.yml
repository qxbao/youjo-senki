choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: các sĩ quan cấp cao gọi Trung tướng von Zettour
    là ''thưa Tướng quân'' (''General''); giữ câu cảm thán phản đối ngắn gọn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Phủ định, mức độ & thuật ngữ: giữ phủ định (''Chúng ta không có
    đủ vật tư hay quân lực cho một đợt tấn công'') và mức độ chật vật (''Nội việc
    củng cố các tuyến phòng ngự hiện tại thôi cũng đã là chật vật lắm rồi!''); ''supplies''
    -> ''vật tư''; ''offensive'' -> ''đợt tấn công''; ''defensive lines'' -> ''các
    tuyến phòng ngự''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''high-ranking officers'' -> ''Các sĩ quan
    cấp cao''; giữ biểu cảm ''với vẻ mặt u ám''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ cấu trúc phủ định mức độ (''Zettour
    chẳng mấy khó khăn để hình dung...''); ''staffers of the eastern army'' -> ''các
    sĩ quan tham mưu thuộc đạo quân phía đông''; quy chiếu bằng đại từ ''họ''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định, giả định trái thực tế & thuật ngữ:
    chỉ bọc ''*quả thực*'' trong dấu sao theo DEC-P01-002 để phản ánh nhấn mạnh phủ
    định ở nguồn; ''sally out'' -> ''xuất kích''; ''local offensive'' -> ''đợt tấn
    công cục bộ''; ''textbook strategy'' -> ''chiến lược theo sách giáo khoa''; ''the
    academy'' -> ''học viện''; giữ câu điều kiện giả định trái thực tế (''Nếu đây
    là..., hẳn họ đã thi đỗ'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Đối lập & phủ định: giữ câu chuyển ý phủ định ''Nhưng đáng tiếc
    thay, đây không phải là một môi trường được kiểm soát.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ, dấu ngoặc kép & cấu trúc song hành: giữ tình
    thái giả định (''hẳn sẽ gạt bỏ trường hợp này''), hai cụm trong ngoặc kép (''“tình
    huống cực đoan”'', ''“sẽ không bao giờ xảy ra trong thực tế”'') và cấu trúc điệp
    (''chiến tranh vì bản thân chiến tranh, tiếp tục giao tranh chỉ để tiếp tục giao
    tranh'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Phủ định khả năng: giữ câu ngắn kết đoạn ''Nhưng đến nước này
    thì không thể cười nổi nữa.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Phủ định, điều kiện & ẩn dụ: giữ nhận định phủ định (''Dàn mỏng
    quân lực để rồi bị đội tiên phong của địch xiên thủng là không ổn đâu''), mệnh
    đề điều kiện (''Nếu nước đi ngu xuẩn đó là lựa chọn duy nhất còn lại của chúng
    ta, thì thà... còn hơn'') và hình ảnh so sánh (''vung lên như một cây chùy'');
    ''enemy vanguard'' -> ''đội tiên phong của địch''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ lời gọi ngập ngừng ''“Thưa Tướng quân…”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, nhượng bộ & giới hạn thời gian: Zettour tự xưng ''Tôi''
    / ''tôi'', gọi các sĩ quan tham mưu là ''các vị'', dùng ''chúng ta'' cho phe mình;
    ''rescue plan'' -> ''kế hoạch giải cứu''; giữ quan hệ nhượng bộ – đối lập (''Thận
    trọng cũng tốt thôi, nhưng tôi mong các vị trình cho tôi một phương án đề xuất
    trước khi đồng đội của chúng ta bị xóa sổ'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ định dạng viết hoa toàn bộ ''NGÀY 14 THÁNG 6
    NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & địa danh: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    ''Soldim 528'' -> ''Soldim 528''; ''medium-size forward base'' -> ''căn cứ tiền
    phương cỡ vừa''; ''planned city'' -> ''thành phố quy hoạch''; ''Federation rolling
    stock'' -> ''đầu máy toa xe của Liên bang''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhân quả & tình thái: ''Operation Iron Hammer'' ->
    ''Chiến dịch Búa Sắt''; ''Operation Andromeda'' -> ''Chiến dịch Andromeda''; ''A
    Group’s offensive'' -> ''đợt tấn công của Cụm A''; giữ quan hệ nhân quả (''thành
    thử nơi đây gần như bị bỏ trống''), dấu chấm lửng và nhận định cuối câu (''đúng
    ra phải là như vậy'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế, ẩn dụ & nhân vật: giữ câu điều kiện trái
    thực tế (''Nếu quân địch không xuất hiện, Soldim 528 hẳn đã là...'') đối lập với
    hiện thực (''Thay vào đó, hiện tại nó đang bị bao vây''); giữ lối nói mỉa mai
    (''tiếp đãi cơn lũ khách không mời này''); ''Lieutenant Colonel Tanya von Degurechaff''
    -> ''Trung tá Tanya von Degurechaff''; ''First Lieutenant Serebryakov'' -> ''Trung
    úy Serebryakov''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & dấu câu: Serebryakov gọi Tanya là ''thưa Trung tá''
    (''Colonel''); giữ dấu chấm lửng đầu câu."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nghĩa: quy chiếu Tanya trong trần thuật ngôi
    thứ ba bằng ''cô''; ''change shifts'' -> ''đổi ca''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, phủ định & nhấn mạnh: tự quy chiếu nội tâm
    của Tanya dùng ''Mình'' theo DEC-P01-001; giữ tình thái mong muốn không thành
    và phủ định (''nhưng ở đây rõ ràng làm gì có lựa chọn đó''); không đánh dấu chữ
    nghiêng vì nguồn không có thẻ nhấn mạnh theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & thoại: Tanya đáp ngắn gọn và gọi Serebryakov là ''Trung
    úy'' (''Lieutenant'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhân quả phủ định & giới hạn: ''siege battle'' -> ''trận
    chiến phòng thủ vòng vây''; quy chiếu Tanya trong trần thuật bằng ''Tanya'' /
    ''cô''; giữ quan hệ nhân quả phủ định (''Vì không thể giao quyền chỉ huy cho một
    kẻ thức trắng đêm không ngủ...'') và giới hạn ở vế cuối (''nhưng cô cũng chỉ xoay
    xở được đến thế là cùng'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & hành động song hành: ''semi-submerged bunker'' ->
    ''căn hầm nửa chìm''; ''command post'' -> ''sở chỉ huy''; giữ sự đối lập hành
    động khi Serebryakov đi ngủ còn Tanya ra sở chỉ huy."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''Major Weiss'' -> ''Thiếu tá Weiss''; Tanya
    tự xưng ''Tôi'' khi nhận bàn giao quyền chỉ huy."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & tình thái: Weiss đáp ''Cảm ơn Trung tá'',
    giữ thông báo phủ định (''Không có động thái lớn nào của địch cần báo cáo'') và
    nhận định tình thái (''Có vẻ chúng đang bố trí các đơn vị để chuẩn bị tấn công'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & dấu câu: trần thuật dùng ''Tanya'' / ''mình'',
    chuyển sang độc thoại nội tâm ngôi thứ nhất dùng ''mình'' theo DEC-P01-001; ''adjutant''
    -> ''viên sĩ quan phụ tá''; giữ điều kiện ước muốn phủ định (''ước giá như viên
    sĩ quan phụ tá của mình đang không ngủ'') và dấu chấm lửng cuối câu; không thêm
    chữ nghiêng theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''Cô'' trong câu trần
    thuật ngắn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & dấu câu: Tanya dùng ''chúng ta'' và ''tôi'',
    gọi quân địch là ''đám người này'' / ''chúng''; ''John Bulls'' -> ''đám John Bull'';
    ''Commies'' -> ''đám Cộng sản''; giữ dấu gạch ngang dài và câu hỏi mỉa mai cuối
    đoạn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ đối lập: quy chiếu Tanya bằng ''Cô''; giữ sự
    đối lập giữa ý định nói đùa nhẹ nhàng của Tanya và phản ứng chỉ nhăn mặt lịch
    sự rồi giữ im lặng của Weiss."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''international Communists'' -> ''đám Cộng
    sản quốc tế''; ''pacifists'' -> ''người theo chủ nghĩa hòa bình''; giữ giọng phàn
    nàn châm biếm của Tanya."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & câu hỏi bỏ lửng: ''Colonel'' -> ''Thưa Trung
    tá''; Weiss gọi Tanya là ''ngài''; giữ câu hỏi phủ định bỏ lửng với dấu chấm lửng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Phủ định & câu hỏi tu từ: giữ lời bác bỏ ngắn ''Không hề'' đầu
    câu và câu hỏi tu từ phủ định (''nhưng việc tôi muốn họ coi trọng lập trường chính
    thức của mình chẳng phải là lẽ tự nhiên sao?'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=[''Thời điểm & dấu câu: giữ mệnh đề chỉ thời điểm bị cắt ngang và
    dấu chấm lửng cuối câu.'']'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ hình ảnh và âm thanh mở màn ''Tiếng nổ của một khẩu
    đại bác đơn lẻ vang vọng từ đằng xa.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, ngoại trừ & câu hỏi tu từ: dùng ''tất cả chúng tôi''
    cho ''us all''; ''eastern front'' -> ''mặt trận phía đông''; ''Federation heavy
    artillery'' -> ''trọng pháo của Liên bang''; giữ cấu trúc loại trừ (''Ngoại trừ
    những người đã chìm vào giấc ngủ vĩnh hằng'') và câu hỏi tu từ khẳng định sự ám
    ảnh của tiếng trọng pháo Liên bang."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=[''Dấu câu & mệnh lệnh: giữ dấu chấm lửng mở đầu và mệnh lệnh chuyển
    sang trạng thái chiến đấu.'']'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: dịch ''ma’am'' khi Weiss đáp lệnh Tanya là
    ''thưa Trung tá'', tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh khẩn cấp: giữ hai câu cảm thán ngắn gọn ''“Dựng tất
    cả dậy! Chúng tới rồi!”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện: ''trench battles of the Rhine'' -> ''những
    trận chiến chiến hào ở mặt trận Rhine''; giữ quy chuẩn đánh thức toàn quân mỗi
    khi địch xuất hiện."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, dấu câu & địa danh: chỉ bọc câu cảm thán xen
    ngang ''*Chúng tôi vừa mới đổi ca cơ mà!*'' trong dấu sao theo DEC-P01-002; giữ
    cặp dấu gạch ngang dài và định danh ''Soldim 528''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & mệnh lệnh: giữ câu hỏi suy luận phủ định
    kèm dấu chấm lửng ở đầu đoạn; ''aerial superiority'' -> ''ưu thế trên không'';
    ''intercept the enemy mages'' -> ''đánh chặn các pháp sư địch''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn & lễ độ: giữ câu hỏi xác nhận người chỉ huy ở lại
    của Weiss kèm tiểu từ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, nhân vật & nhân quả: Tanya tự xưng ''tôi'' / ''Tôi'',
    gọi Weiss là ''anh''; ''Captain Meybert'' -> ''Đại úy Meybert'' (quy chiếu bằng
    ''anh ta''); giữ phủ định (''Đừng lo, tôi không bỏ anh ở lại đâu'') và lý do (''Bên
    pháo binh chẳng có việc gì làm cả, nên cứ để anh ta nắm quyền chỉ huy đi'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ câu đáp lễ phép ''“Thật vinh hạnh ạ.”'' của Weiss."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đại từ & phủ định: nội tâm của Tanya tự quy
    chiếu bằng ''mình'' theo DEC-P01-001, gọi Weiss là ''gã hiếu chiến này'' / ''anh
    ta''; ''front lines'' -> ''tiền tuyến''; ''enemy position'' -> ''trận địa địch'';
    ''command post'' -> ''sở chỉ huy''; giữ câu hỏi mở đầu, các phủ định (''vẫn chưa
    đủ làm anh ta thỏa mãn…'', ''hoàn toàn không thể hiểu nổi'', ''sẽ không được ở
    lại hậu phương nơi sở chỉ huy'') và không tự thêm chữ nghiêng theo DEC-P01-002."]'
