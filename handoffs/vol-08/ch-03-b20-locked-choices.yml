choices:
- segment_id: YS-LN08/Text/chapter012.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điểm nhìn & sắc thái: ''Zettour'' -> ''Zettour''; ''matériel''
    -> ''vật tư và trang bị quân sự''; giữ sắc thái nhận thức muộn màng (''mãi đến
    tận lúc này mới thấu hiểu'') và cảm giác bức bối của Rudersdorf; không có chữ
    nghiêng."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nội tâm: bọc toàn câu trong dấu sao theo
    DEC-P01-002 (''*…Chỉ là có quá nhiều vấn đề phải lo nghĩ.*''); giữ dấu chấm lửng
    mở đầu."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & quan hệ điều kiện: bọc toàn câu trong
    dấu sao theo DEC-P01-002; ''we/our'' -> ''chúng ta''; ''the enemy/theirs'' ->
    ''kẻ địch/chúng''; giữ cấu trúc điều kiện tương ứng."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & hành động: quy chiếu Rudersdorf bằng ''ông''
    trong trần thuật ngôi thứ ba; giữ chuỗi hành động ngậm xì gà, nhấc ống nghe quen
    thuộc và quay số."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: ''Operations'' -> ''Cục Tác chiến''; Rudersdorf
    tự xưng ''tôi''; ''ships of unknown nationality'' -> ''đám tàu không rõ quốc tịch'';
    giữ câu hỏi về kết cục sự việc."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Northern Sea Fleet'' -> ''Hạm đội Biển Bắc'';
    ''patrol craft and submarines'' -> ''các tàu tuần tra và tàu ngầm''; ''convoy''
    -> ''đoàn tàu vận tải''; ''Federation'' -> ''phía Liên bang''; sĩ quan Cục Tác
    chiến xưng ''Chúng tôi''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: quy chiếu Rudersdorf bằng ''ông''; giữ hình
    ảnh mạng lưới phân phối của kẻ địch ngày càng mạnh lên và thái độ chán ghét của
    ông."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi phủ định & đại từ: ''board them'' -> ''áp mạn
    kiểm tra chúng''; giữ câu hỏi phủ định của Rudersdorf (''Chúng ta không thể áp
    mạn kiểm tra chúng sao?'') và mong muốn chặn đoàn tàu (''tôi muốn chặn chúng lại'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''Commonwealth Home Fleet'' -> ''Hạm đội
    Bản thổ của Khối Thịnh vượng chung''; ''surface fleet'' -> ''hạm đội tàu mặt nước'';
    giữ câu bỏ lửng cuối đoạn bằng dấu chấm lửng."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & phủ định: chỉ bọc ''*Hạm đội của
    chúng ta không thể địch lại hải quân của Khối Thịnh vượng chung*'' trong dấu sao
    theo DEC-P01-002; ''Operations'' -> ''Cục Tác chiến''; ''Commonwealth’s navy''
    -> ''hải quân của Khối Thịnh vượng chung''; giữ phủ định (''không định nói thẳng
    ra đến mức ấy'', ''chẳng phải kiểu báo cáo mà Rudersdorf muốn nghe'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: quy chiếu Rudersdorf bằng ''ông'' / ''Ông'',
    phía hải quân bằng ''họ''; giữ hai dấu chấm lửng trong câu."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phủ định: ''marine mages'' -> ''pháp sư hải
    quân đánh bộ''; giữ hai câu hỏi phủ định liên tiếp thể hiện sự sốt ruột của Rudersdorf."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000399
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ điều kiện thời gian: ''aerial mages'' -> ''pháp
    sư trên không''; ''maritime navigation'' -> ''điều hướng hàng hải''; giữ phủ định
    (''Quân số không đủ để cưỡng ép thực hiện'') và điều kiện tiên quyết (''cần được
    huấn luyện... trước khi có thể phát huy tác dụng'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & nghĩa: quy chiếu Rudersdorf bằng ''Ông'';
    giữ sắc thái cam chịu tạm thời (''Xem ra lúc này chẳng làm gì được rồi'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & cấu trúc điều kiện: giữ dấu chấm lửng mở
    đầu; ''Andromeda'' -> ''Andromeda''; giữ tiền đề chiến dịch và câu điều kiện (''Nếu
    giả định rằng cả hai bên đều đang kiệt quệ bị đập tan, khả năng thành công sẽ
    trở nên hết sức mong manh'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & logic: ''the Empire'' -> ''Đế quốc''; ''occupied territories''
    -> ''các vùng lãnh thổ bị chiếm đóng''; giữ quan hệ phụ thuộc (''tùy thuộc vào
    mức độ trang bị của đối phương, Đế quốc cũng sẽ phải cân nhắc...'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & địa danh: Rudersdorf gọi sĩ quan Cục Tác chiến là ''Bên
    anh''; ''southern zones'' -> ''các khu vực phía nam''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000404
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhân vật & đại từ: ''Federation’s counterintelligence''
    -> ''Công tác phản gián của Liên bang''; ''Loria'' -> ''Loria'' (quy chiếu bằng
    ''hắn''); ''Commissariat for Internal Affairs'' -> ''Bộ Dân ủy Nội vụ''; giữ phép
    lặp từ ''lập dị'' (''Tên lập dị Loria... lại là một gã lập dị có năng lực'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ nguyên ''“Tình hình tệ đến mức đó sao?”''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & dấu câu: quy chiếu Loria bằng ''Hắn''; ''HUMINT''
    -> ''tình báo con người (HUMINT)''; ''former Federation Council for Self-Government''
    -> ''Hội đồng Tự trị cựu Liên bang''; giữ dấu gạch ngang dài ngắt lời ở cuối câu."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000407
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: quy chiếu Rudersdorf bằng ''ông''; ''aerial
    reconnaissance'' -> ''trinh sát đường không''; giữ mệnh lệnh thúc giục và câu
    hỏi chuyển ý sang việc phá mật mã."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối lập thời gian: ''crypto warfare section'' -> ''Bộ
    phận tác chiến mật mã''; ''Federation Army'' -> ''Quân đội Liên bang''; giữ sự
    đối lập giữa trước đây (''vốn dễ phá'') và hiện tại (''đã trở nên kiên cố hơn
    rất nhiều'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ & câu hỏi tu từ: ''smoke screened at every turn'' ->
    ''đi đến đâu cũng bị tung hỏa mù''; giữ câu hỏi bức xúc của Rudersdorf."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & điều kiện: chỉ bọc ''*Nếu kẻ địch
    đã định lách luật, thì trò này đâu chỉ mình chúng mới biết chơi… Chúng ta cũng
    nên làm theo.*'' trong dấu sao theo DEC-P01-002; ''we'' -> ''Chúng ta''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phủ định: ''enemy convoy'' -> ''đoàn tàu vận
    tải của địch''; giữ dấu chấm lửng và câu hỏi phủ định tìm kiếm phương án chưa
    thử."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đại từ: giữ sắc thái suy đoán hồi tưởng (''Hẳn phải
    có một biện pháp nhằm bóp nghẹt dòng chảy tiếp tế từng được họ đưa ra cân nhắc'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & câu hỏi đuôi: giữ sắc thái sực nhớ mơ hồ (''cái
    kế hoạch kia, tên là gì ấy nhỉ, phải không?'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000414
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: sĩ quan Cục Tác chiến gọi Rudersdorf là ''ngài''
    và thêm ''ạ''; ''unrestricted submarine warfare'' -> ''chiến tranh tàu ngầm không
    hạn chế''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000415
  kind: terminology_and_voice
  value: 'choices=["Lời đáp ngắn: giữ nguyên ''“Đúng, chính là nó,” Rudersdorf đáp.''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000416
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & dấu câu: giữ hai dấu chấm lửng biểu thị sự
    ngập ngừng; ''law of war'' -> ''luật chiến tranh''; gọi Rudersdorf là ''Ngài''
    và kết câu bằng ''ạ''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000417
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & đại từ: chỉ bọc ''*Lại là luật
    pháp ư?*'' trong dấu sao theo DEC-P01-002; ''Operations man'' -> ''người bên Cục
    Tác chiến''; Rudersdorf xưng ''Chúng ta'' và ''Tôi'' trong thoại."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000418
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ pháp lý hải quân & phủ định: ''navy’s legal division''
    -> ''Ban pháp chế của hải quân''; ''wartime contraband regulations'' -> ''các
    quy định về hàng quốc cấm thời chiến''; ''safe sea passage policy'' -> ''chính
    sách bảo đảm an toàn hàng hải''; ''inspection rules'' -> ''quy tắc khám xét'';
    giữ phủ định (''vốn không được soạn thảo với tính toán dành cho tàu ngầm'') và
    hệ quả (''sự vênh nhau đó có thể rất nguy hiểm'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000419
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: chỉ bọc ''*Sao ta phải bận tâm
    chứ?*'' trong dấu sao theo DEC-P01-002; giữ phủ định ở vế đối lập (''nhưng ông
    không thể làm ngơ trước lập luận đó'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000420
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''Supreme Command'' -> ''Bộ Tư lệnh
    Tối cao''; ''Zettour'' -> ''Zettour''; ''eastern front'' -> ''mặt trận phía đông'';
    quy chiếu Rudersdorf bằng ''ông''; giữ phủ định (''vốn chẳng giỏi'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000421
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ nội tâm & giả định: bọc toàn câu trong
    dấu sao theo DEC-P01-002; Rudersdorf tự xưng ''mình'' trong nội tâm và gọi Zettour
    là ''ông ấy''; giữ cấu trúc giả định trái thực tế."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000422
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ dấu chấm lửng mở đầu; Rudersdorf gọi sĩ
    quan Cục Tác chiến là ''anh'' và ra chỉ thị tiếp tục tìm hiểu."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000423
  kind: terminology_and_voice
  value: 'choices=["Xưng hô quân hàm: giữ câu đáp ''“Rõ, thưa Tướng quân.”''."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000424
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu & tương phản: quy chiếu Rudersdorf bằng ''ông'';
    ''MO'' -> ''tác phong''; giữ dấu chấm lửng và sự tương phản giữa tác phong quyết
    đoán thường ngày với sự lúng túng hiện tại."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000425
  kind: terminology_and_voice
  value: 'choices=["Đại từ độc thoại: Rudersdorf tự nhủ xưng ''Mình'' (''“Mình bế
    tắc rồi sao?”'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000426
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: bọc toàn câu trong dấu
    sao theo DEC-P01-002; Rudersdorf tự xưng ''mình''; giữ phủ định kép (''Chẳng giống
    với tác phong của mình chút nào, nhưng... cũng chẳng có gì đáng ngạc nhiên'')."]'
- segment_id: YS-LN08/Text/chapter012.xhtml/p000427
  kind: terminology_and_voice
  value: 'choices=["Đại từ độc thoại & dấu câu: Rudersdorf tự xưng ''mình'' và quy
    chiếu Zettour bằng ''ông ấy''; giữ dấu chấm lửng giữa câu."]'
