- segment_id: YS-LN08/Text/chapter022.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi bỏ lửng: Mikel xưng ''tôi'', gọi Drake là ''ngài'';
    giữ nhịp ngập ngừng của câu hỏi về số thuộc cấp thương vong."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Số lượng: dịch gọn câu trả lời của Drake là ''“Mười ba người.”'';
    không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''A company’s worth of people'' -> ''Quân số
    tương đương cả một đại đội''; giữ thể bị động chỉ tổn thất đã xảy ra."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & phủ định: bảo toàn chính xác chữ nghiêng ở vế đầu
    ''*Nếu không vì cơn cuồng loạn của Sue*'' theo DEC-P01-002; giữ vế tự cắt ngang
    phủ định ''không, giờ có nghĩ đến chuyện đó cũng chẳng ích gì''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & đại từ nội tâm: bảo toàn chính xác chữ nghiêng cho
    toàn bộ đoạn độc thoại nội tâm theo DEC-P01-002; Drake tự quy chiếu bằng ''mình'',
    giữ nhịp tự trách dồn dập."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''Dear God and fatherland'' -> ''Lạy Thượng
    đế kính yêu và Tổ quốc''; giữ sắc thái cầu nguyện khẽ khàng của Drake."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & nhấn mạnh trợ động từ: Mikel gọi Drake là ''Thưa Trung
    tá''; giữ sắc thái khẳng định ''quả thực họ đã ngã xuống khi chiến đấu với kẻ
    thù''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & độ mở câu hỏi: Drake hỏi lại Mikel ''“Ý ngài là sao...?”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & sắc thái: Mikel gọi Drake là ''ngài''; giữ
    phủ định ''chưa quen với cảnh lính của mình hy sinh'' và cách nhìn từng trải ''một
    kết cục tương đối có phúc rồi''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Drake bằng ''Anh''; giữ hình ảnh viết
    tiếp câu chuyện hiệp sĩ thuở nhỏ bằng cống hiến của những thuộc cấp hy sinh nơi
    xa xứ."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & đại từ: bảo toàn chính xác chữ nghiêng ''*Những gì
    chúng ta đang làm đều có ý nghĩa.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: quy chiếu Drake bằng ''Anh''; giữ câu ngắn
    ''Anh muốn tin vào điều đó.'' không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & thuật ngữ: ''homeland'' -> ''bản quốc'', ''Commonwealth''
    -> ''Khối Thịnh vượng chung''; bảo toàn chính xác chữ nghiêng ở câu cuối ''*Hỡi
    Khối Thịnh vượng chung yêu dấu, nguyện xin người hân hoan đón nhận lòng tôn kính
    vô song của chúng con.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chính xác chữ nghiêng cho câu
    tự nhủ ''*Thôi được rồi, giờ thì tạm gác những suy tư ủy mị sang một bên đã.*''
    theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điệp ngữ: quy chiếu Drake bằng ''anh''; giữ nhịp lặp
    ''Lúc này, chỉ riêng lúc này thôi'' và cụm ''thực tại chẳng mấy lãng mạn kia trở
    nên có lý''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi: Drake xưng ''tôi'', gọi Mikel là
    ''ngài'', dùng ''chúng ta''; ''mage battalion'' -> ''Tiểu đoàn pháp sư''; giữ
    đủ hai câu hỏi dự đoán mức độ truy kích của địch."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & địa danh: ''Imperial Army'' -> ''Lục quân Đế quốc'',
    ''imperial mage unit'' -> ''Đơn vị pháp sư Đế quốc'', ''Devil of the Rhine'' ->
    ''Ác quỷ sông Rhine'', ''Soldim 528'' -> ''Soldim 528''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Giả định, thuật ngữ & câu hỏi tu từ: giữ sắc thái ''Đáng lẽ chúng
    cũng phải thấm mệt đôi chút''; ''multinational unit'' -> ''đơn vị đa quốc gia'';
    giữ phép so sánh với ''Sue'' và câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & hình ảnh ẩn dụ: Mikel gọi ''Trung tá Drake''; giữ hình
    ảnh ''ngắm nhìn ba lô của kẻ địch'' (''seeing your enemy’s knapsacks'')."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: dịch câu hỏi ngắn thể hiện sự ngạc nhiên của Drake
    là ''“Cái gì cơ?”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & hình ảnh: giải thích rõ ý nghĩa quân sự của việc nhìn
    thấy ''túi hành trang trên lưng quân địch'' / ''ba lô của quân địch'' khi truy
    kích đối phương đang tháo chạy."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Đại từ & văn hóa: Drake xưng ''tôi'', tự nhận là ''một cậu ấm
    có địa vị'' chuộng trò ''săn cáo''; quy chiếu trần thuật bằng ''Anh''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''the home country'' -> ''chính quốc'';
    giữ sắc thái hoài niệm về truyền thống săn bắn mang tinh thần thượng võ nơi quê
    nhà."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & cảm thán: lược đại từ ngôi thứ hai phiếm chỉ trong
    câu cảm thán về sự trong sáng, giản đơn của việc cầm súng săn đuổi theo con mồi.'']'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ: dùng ''chúng ta''; ''war-loving imperials'' ->
    ''đám quân Đế quốc hiếu chiến''; giữ ẩn dụ ''bữa tiệc chào mừng thật thịnh soạn''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Drake xưng ''Tôi'', gọi ''Đại tá
    Mikel'' là ''ngài'', quy chiếu ''cô sĩ quan chính trị'' bằng ''cô ta''; ''fighter
    planes'' -> ''máy bay tiêm kích''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: Mikel gọi Drake là ''Thưa Trung tá'' / ''ngài'',
    xưng ''Tôi'', quy chiếu nữ sĩ quan chính trị bằng ''cô ấy'' với thái độ ôn hòa."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, xưng hô & phủ định: bảo toàn chính xác chữ nghiêng
    ''*khá khẩm hơn*'' (''*better*'') theo DEC-P01-002; Drake xưng ''tôi'', gọi Mikel
    là ''ngài''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & thuật ngữ: giữ cấu trúc phủ định kép ''Không phải
    anh không nhận ra'' (''He wasn’t unaware''); ''rear guard'' -> ''vị trí đoạn hậu''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & so sánh: Mikel gọi Drake là ''ngài'', quy chiếu nữ sĩ
    quan chính trị bằng ''Cô ấy''; giữ hình ảnh so sánh ''một chú cừu non ngoan ngoãn
    đang cố đóng giả làm sói''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thành ngữ: Drake quy chiếu nữ sĩ quan chính trị bằng
    ''cô ta'', đảo lại hình ảnh thành ''một con sói đội lốt cừu'' và khép lại bằng
    câu ''Đến giờ nhập tiệc rồi.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nhân quả: quy chiếu Drake bằng ''Anh''; diễn đạt tự nhiên
    thành ngữ đốc thúc thuộc cấp vào đội hình nghênh chiến ngay trước khi nhận được
    tin tốt hiếm hoi."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & thuật ngữ: lính thông tin gọi Drake là ''Thưa Trung
    tá!'', báo cáo từ ''Trung úy Sue'' về việc có địch trên ''đường rút quân của chúng
    ta''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''communications kit'' -> ''bộ thiết bị thông tin liên
    lạc''; giữ câu danh ngữ ngắn gọn."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & so sánh: giữ quan hệ nhượng bộ - tất yếu rằng đang
    bị truy kích thì gặp địch là chuyện đương nhiên ''chẳng khác nào mưa rơi xuống
    từ mây đen''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & đánh giá: giữ tên ''Sue'' và cụm định ngữ ''cô trung
    úy quá đỗi ương bướng kia'' đã chấp hành mệnh lệnh đàng hoàng và gửi báo cáo về."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Chỉ dẫn mệnh lệnh: giữ nhịp tự sửa lệnh của Drake ''Giao chiến
    ngay lập tức — không, khoan đã. Ra lệnh cho cô ta đột phá và đảm bảo lộ trình
    cho chúng ta.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: cấp dưới đáp ''Rõ, thưa Trung tá!'', quy
    chiếu Sue bằng ''cô ấy''; ''path of retreat'' -> ''đường rút quân''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Đại từ, câu hỏi & quân hàm: trong góc nhìn của Drake quy chiếu
    Sue bằng ''cô ta''; giữ câu hỏi nghi vấn ''Có lẽ người ta có thể bảo rằng cô ta
    mang lòng trắc ẩn thuần khiết dành cho quân bạn chăng?'' và cụm ''một trung úy
    mới nhậm chức'' (''newly minted first lieutenant'')."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ vế phủ định ''Về bản chất cô ta không
    phải là người xấu'', quan hệ đối lập ''trái lại, rắc rối nằm ở chỗ cô ta chỉ hành
    động xuất phát từ thiện ý'' và kết luận ''chí ít lần này, điều đó lại có lợi cho
    họ''."]'
