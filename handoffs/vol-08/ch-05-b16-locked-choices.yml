choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý & đại từ: giữ liên từ đối lập mở đầu (''Thế nhưng'')
    và đại từ ''họ'' quy chiếu các thành viên Tiểu đoàn 203 vừa xuất kích."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & giọng thoại: dịch lời hô báo cáo khẩn cấp ''Colonel!''
    là ''Thưa Trung tá!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000557
  kind: terminology_and_voice
  value: 'choices=["Sắc thái & từ vựng: giữ câu phản ứng bất ngờ của Tanya (''Cái
    gì? Thế này là quá sớm!'') và cụm miêu tả ''với vẻ mặt bán tín bán nghi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000558
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc: ''The 203rd Aerial Mage Battalion'' -> ''Tiểu
    đoàn Pháp sư Trên không số 203''; ''imperial mages'' -> ''pháp sư Đế quốc''; ''mana
    signal'' -> ''tín hiệu ma năng''; giữ cấu trúc nhượng bộ ''Ngay cả Tanya... cũng
    phải chật vật...''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000559
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''covert flight skills'' -> ''kỹ năng bay
    bí mật''; ''on the Rhine'' -> ''trên mặt trận Rhine''; ''twin-engine Type 97 orbs''
    -> ''những quả cầu Type 97 hai lõi''; giữ phủ định nhấn mạnh ''không đời nào có
    chuyện ma năng bị rò rỉ ra ngoài''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000560
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & đại từ: bảo toàn chính xác chữ nghiêng Markdown ''*điều
    đó*'' tương ứng với nhấn mạnh trong nguồn theo DEC-P01-002; quy chiếu Tanya ở
    ngôi thứ ba bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000561
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya hỏi lại sĩ quan phụ tá bằng ''Ý cô
    là'', dùng ''chúng ta'' (toàn đơn vị) và ''chúng'' (địch); ''with our magic suppressed''
    -> ''ngay cả khi đã ém ma pháp''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000562
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: giữ sự chuyển dịch điểm nhìn đặc
    trưng từ ngôi thứ nhất số nhiều (''Chúng tôi'') sang ngôi thứ ba (''Tanya'', ''cô'');
    ''imperial position'' -> ''trận địa của Đế quốc''; ''core aerial mage battalion''
    -> ''tiểu đoàn pháp sư trên không nòng cốt''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000563
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & giọng thoại: giữ lời cảnh báo gấp gáp ''Thưa Trung
    tá! Nhìn kìa!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000564
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi cảm thán: giữ câu thốt lên sững sờ ''Chúng đuổi
    theo chúng ta ư?!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000565
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & nhịp câu: ''Her adjutant'' -> ''Viên sĩ quan
    phụ tá của cô''; giữ đại từ ''chúng tôi'' - ''chúng'' và hai câu tỉnh lược dồn
    dập ở cuối đoạn (''Quân địch. Pháp sư địch.'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000566
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại & phủ định: Tanya xưng ''tôi'' trong lời thoại trực
    tiếp, dịch chủ ngữ khái quát ''you'' là ''người ta''; giữ câu phủ định mở đầu
    ''Chuyện này chẳng vui chút nào đâu!'' và chỗ ngắt lời ''Chuyện quái gì—''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000567
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ, thuật ngữ & logic: giữ hình ảnh so sánh ''vẫy tấm vải
    đỏ trước mặt một con bò tót''; ''defensive position'' -> ''trận địa phòng ngự'';
    ''all-out attack'' -> ''cuộc tổng tấn công''; ''the 203rd'' -> ''Tiểu đoàn 203''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000568
  kind: terminology_and_voice
  value: 'choices=["Phủ định & dấu câu: giữ dấu chấm lửng mở đầu và câu cảm thán phủ
    định ''…Không thể tin nổi. Chúng thực sự đang lao về phía này.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000569
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị & nhân vật: giữ nguyên tên các sĩ quan ''Weiss, Ahrens
    và Meybert''; ''Salamander Kampfgruppe—rather, the Lergen Kampfgruppe'' -> ''Kampfgruppe
    Salamander—nói đúng hơn là Kampfgruppe Lergen—''; ''defensive battle'' -> ''trận
    đánh phòng ngự''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000570
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & đại từ: quy chiếu Tanya bằng ''cô''; giữ hai vế
    phủ định đối lập (''không đến mức vô tư lự mà nghĩ rằng...'' nhưng ''không ngờ
    chuyện đó lại bại lộ sớm đến thế này'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000571
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại & phủ định: trong lời thoại trực tiếp Tanya xưng
    ''Tôi'', dùng ''chúng ta'' và ''chúng''; giữ phủ định ''tôi chưa bao giờ nghĩ
    rằng chúng lại truy kích chúng ta''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000572
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & giả định: câu độc thoại nội tâm của Tanya tự
    xưng ''mình'' theo DEC-P01-001; giữ cấu trúc giả định trái thực tế (''Nếu ở vào
    vị trí của quân địch, mình sẽ chẳng đuổi theo... mà nhắm thẳng vào...'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000573
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & đại từ: dịch thành ngữ câu hỏi tu từ sang tiếng
    Việt tự nhiên (''Đầu óc phải chập mạch cỡ nào...''), dùng ''chúng tôi'' (phân
    biệt phía mình với địch)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000574
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ & đại từ thoại: giữ câu điều kiện giả định ở
    quá khứ trong lời thoại trực tiếp với đại từ ''tôi'' (''…Nếu biết trước quân địch
    sẽ lao về phía này, tôi đã hành động khác đi rồi.'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000575
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nghĩa: quy chiếu Tanya bằng ''Cô'' và đại
    từ phản thân ''mình''; giữ sắc thái ''những mệnh lệnh mang tính chất trăn trối
    cho thuộc cấp rằng phải tử thủ đến cùng và chiến đấu bên ngoài trận địa''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000576
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Tanya bằng ''cô'', giữ câu khẳng
    định phủ định ở cuối đoạn ''Ý chí sinh tồn của cô sẽ không đời nào bị nghiền nát.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000577
  kind: terminology_and_voice
  value: 'choices=["Tình thái & điều kiện đối lập: giữ mức tình thái ''lẽ ra cô phải
    ở vào một vị thế thuận lợi'' đối lập với mệnh đề điều kiện ''nhưng… nếu quân địch
    đang truy kích, thì vị thế và các tiền đề của cô đã thay đổi hoàn toàn''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000578
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thành ngữ & đại từ: ''Lieutenant General von Zettour''
    -> ''Trung tướng von Zettour''; dịch thành ngữ ''vừa thoát khỏi chảo mỡ đã nhảy
    ngay vào đống lửa''; quy chiếu Tanya bằng ''Cô'' - ''mình''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000579
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & giọng nội tâm: giữ dấu gạch ngang dài mở đầu câu độc
    thoại nội tâm quyết đoán (''—Đành phải tìm cách xoay xở cho xong chuyện này thôi.'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000580
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng điệu: giữ nguyên ''Being X''; dịch ''regulated
    violence'' là ''bạo lực có quy ước'' đối lập với ''tranh luận văn minh''; giữ
    giọng rủa xả cay nghiệt trong nội tâm Tanya."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000581
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & thuật ngữ: tự xưng ''Mình'' / ''mình'' theo DEC-P01-001;
    ''the rear'' -> ''hậu phương''; giữ hình ảnh ''cả một núi đơn khiếu nại bằng văn
    bản''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000582
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & mệnh lệnh: ''Major Weiss'' -> ''Thiếu tá
    Weiss''; ''mana suppression'' -> ''chế độ ém ma năng''; ''anti-magic sniping formula
    rounds'' -> ''đạn thuật thức bắn tỉa kháng ma pháp''; dùng ''chúng ta'' trong
    mệnh lệnh chiến đấu."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000583
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: dịch ''Yes, ma’am!'' là ''Rõ, thưa Trung
    tá!''; giữ nhất quán ''Hủy chế độ ém ma năng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000584
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & thuật ngữ: tự xưng ''Mình'', dùng ''chúng tôi''
    (phân biệt với liên quân địch); ''two-headed chimera of the Federation and Commonwealth
    armies'' -> ''con quái vật chimera hai đầu hợp thành từ quân đội Liên bang và
    Khối Thịnh vượng chung''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000585
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, phủ định & thành ngữ: tự xưng ''mình''; dịch thành
    ngữ sang ''đếm cua trong lỗ'' gắn với cấu trúc phủ định quá khứ (''đã không nên
    đếm cua trong lỗ'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000586
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & giọng nội tâm: giữ câu điều kiện thúc giục bản thân
    ''Nếu đã buộc phải làm việc này, thì hãy giải quyết cho xong đi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000587
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đại từ: dùng ''chúng tôi'' và giữ mệnh đề phủ định
    nhấn mạnh ''Điều duy nhất chúng tôi không được phép làm là giảm tốc độ.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000588
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & mệnh lệnh: ''Major Weiss'' -> ''Thiếu tá Weiss'';
    dùng ''chúng ta'' trong lời hiệu triệu toàn đơn vị; giữ nhịp mệnh lệnh dứt khoát."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000589
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi cảm thán: dùng ''Chúng ta'' khớp với mệnh lệnh
    của Tanya ở p000588; giữ sắc thái kinh ngạc của Weiss."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000590
  kind: terminology_and_voice
  value: 'choices=["Giả định & mệnh lệnh: giữ câu giả định cảnh báo (''Nếu dừng lại
    thì tình hình sẽ còn tệ hơn!'') và khẩu lệnh (''Tiến lên, tiến lên! Duy trì tốc
    độ và bắn trả khi cần thiết!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000591
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''shock troops'' -> ''lực lượng xung kích'';
    ''Elinium Arms Type 97 Assault Computation Orb'' -> ''Quả cầu Tính toán Xung kích
    Type 97 của Elinium Arms''; dùng ''chúng tôi'' trong lời suy tính chiến thuật."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000592
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ thời gian: ''ranged attacks'' -> ''các đòn
    tấn công tầm xa''; ''her adjutant'' -> ''viên sĩ quan phụ tá''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000593
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự: ''firing range'' -> ''tầm bắn''; ''enemy mage
    company'' -> ''đại đội pháp sư địch''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000594
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & thuật ngữ: tự xưng ''Mình'' theo DEC-P01-001;
    ''suppressing your mana signal'' -> ''trạng thái ém tín hiệu ma năng''; ''max
    combat velocity'' -> ''vận tốc chiến đấu tối đa''; quy chiếu đại đội pháp sư địch
    bằng ''chúng''."]'
