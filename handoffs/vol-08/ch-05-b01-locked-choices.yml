segment_id_end: YS-LN08/Text/chapter018.xhtml/p000027
choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ định dạng viết hoa toàn bộ ''NGÀY
    18 THÁNG 6 NĂM THỐNG NHẤT 1927, PHÒNG TUYẾN PHÍA ĐÔNG, ĐƠN VỊ GIẢI CỨU, MŨI TIÊN
    PHONG ĐI ĐẦU''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: trần thuật ngôi thứ ba toàn tri; giữ sắc
    thái phỏng đoán ''có lẽ'' (''probably'') và hình ảnh so sánh ''những chấm nhỏ
    li ti'', ''những đốm vụn vặt chẳng đáng bận tâm''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tình thái chắc chắn ''chắc chắn sẽ
    phải nín thở''; ''armor'' -> ''lực lượng thiết giáp''; ''Imperial Army’s armored
    division'' -> ''sư đoàn thiết giáp của Lục quân Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Phủ định, địa danh & thuật ngữ: giữ mệnh đề phủ định ''không gì
    cản nổi bước tiến''; ''Soldim 528'' -> ''Soldim 528''; ''commander’s tank'' ->
    ''chiếc xe tăng chỉ huy''; ''large wireless set'' -> ''bộ vô tuyến cỡ lớn''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''eastern front'' -> ''mặt trận phía đông'';
    ''armored warfare'' -> ''tác chiến thiết giáp''; ''unit commander'' -> ''chỉ huy
    đơn vị''; ''front lines'' -> ''tiền tuyến''; giữ phủ định nhấn mạnh cuối đoạn
    ''chẳng có gì hiếm lạ ở điểm đó cả''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc chêm, phủ định & thuật ngữ: giữ cấu trúc phủ định kép
    tạo nghĩa khẳng định ''không ít cựu binh dày dạn của sư đoàn thiết giáp''; ''infantry
    trucks'' -> ''xe tải bộ binh''; ''commander’s cluster'' -> ''cụm xe chỉ huy''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & điều kiện: lược đại từ ngôi thứ hai phiếm chỉ trong
    cấu trúc điều kiện ''Chỉ cần lắng tai nghe điện đàm vô tuyến, câu trả lời sẽ rõ
    ngay lập tức''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: thoại báo cáo qua vô tuyến dùng ''Chúng ta'';
    ''Federation Army defensive unit'' -> ''một đơn vị phòng ngự của Quân đội Liên
    bang''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, tình thái & phủ định: bảo toàn chính xác chữ nghiêng
    ''*quân địch*'' theo DEC-P01-002; giữ tình thái ''có lẽ'' và hai vế phủ định ''chẳng
    có gì khác thường, nên… nó hẳn không phải là nguyên nhân gây ra những ánh nhìn
    tò mò kia''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''combat vehicles'' -> ''các phương tiện
    chiến đấu''; giữ cặp trạng thái tâm lý song hành ''vừa hoang mang vừa mong đợi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ, mệnh lệnh & phủ định: quy chiếu Cramm bằng ''ông''; trong
    mệnh lệnh qua vô tuyến xưng ''tôi'', gọi thuộc cấp là ''các anh'', gọi quân địch
    là ''chúng''; giữ chuỗi câu mệnh lệnh dứt khoát kèm phủ định ''Mặc kệ chúng! Đi
    vòng qua! Không giao chiến!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Phủ định & chức vụ quân sự: giữ cấu trúc phủ định tăng tiến ''Ông
    không phải là đại đội trưởng, tiểu đoàn trưởng, hay thậm chí là trung đoàn trưởng.
    Ông là tư lệnh của cả sư đoàn.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & thuật ngữ: ''Commander Cramm'' -> ''Chỉ huy Cramm'';
    ''large wireless set'' -> ''bộ vô tuyến cỡ lớn''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định mệnh lệnh: giữ mệnh lệnh phủ định nhấn
    mạnh ''Đừng bận tâm đến chúng—cứ việc tiến thẳng về phía trước!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ & giả định: bảo toàn chính xác hai cụm chữ nghiêng
    ''*Theo tôi!*'' và ''*Ông già nhà mình cũng y hệt thế!*'' theo DEC-P01-002; giữ
    tình thái giả định ''Nếu chỉ nhìn bề ngoài, hẳn các thuộc cấp của ông sẽ đưa mắt
    nhìn nhau mà nhủ thầm''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại: quy chiếu Cramm bằng ''ông''; trong lời
    tuyên bố xưng ''Tôi'' - ''các anh'' (''Tôi sẽ đi cùng các anh!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & ẩn dụ: giữ hình ảnh ẩn dụ ''trái ngọt từ hạt giống do
    Zettour gieo xuống'' và chi tiết Zettour ngồi ghế sau xe quân sự mỉm cười thích
    thú."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đại từ: Zettour gọi ''Trung úy Grantz'', nhắc tới ''Chỉ
    huy Cramm'' và dùng đại từ bao gộp ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại cấp dưới: Grantz gọi Zettour là ''Thưa Tướng
    quân'', xưng ''tôi'' và giữ sắc thái lễ phép dè dặt ''xin thứ lỗi cho tôi nói
    thẳng…''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Zettour gọi Grantz là ''Trung úy'' (''Sao thế, Trung
    úy?'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, điểm nhìn, xưng hô & phủ định: bảo toàn chính xác câu
    chữ nghiêng biểu thị lời nói thầm qua ánh mắt của Grantz ''*Chẳng phải chính mong
    muốn ra tận tiền tuyến của ngài đã dẫn đến tình cảnh này sao, thưa Tướng quân?*''
    theo DEC-P01-002; trần thuật gọi ''Trung tướng von Zettour'', quy chiếu Grantz
    bằng ''viên trung úy'' / ''anh''; giữ phủ định ''không hề ngần ngại''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, điểm nhìn, đại từ & giả định: bảo toàn chữ nghiêng
    cho toàn bộ đoạn độc thoại nội tâm của Zettour theo DEC-P01-002; Zettour tự xưng
    ''mình'', gọi Tanya là ''Trung tá von Degurechaff'' và quy chiếu bằng ''cô ta'';
    giữ câu hỏi tu từ, phủ định ''chẳng chút sợ sệt hay dè dặt'' và giả định trái
    thực tế ''Nếu cô ta không quá xuất sắc ngoài thực địa, hẳn mình đã tống thẳng
    cô ta về làm công tác đào tạo ở hậu phương rồi…''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô & thuật ngữ: trần thuật quy chiếu Zettour bằng
    ''ông''; trong thoại Zettour xưng ''tôi'', gọi Grantz là ''anh'' / ''Trung úy'';
    ''inspector'' -> ''thanh tra viên''; ''front lines'' / ''front line'' -> ''tiền
    tuyến''; giữ câu hỏi tự hỏi tự đáp ở cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái lễ độ: Grantz gọi Zettour là ''ngài'', ''thưa
    Tướng quân''; giữ mệnh đề nhượng bộ lịch sự ''Dù nói ra điều này có phần mạo phạm,
    nhưng xin ngài hãy bảo trọng, thưa Tướng quân.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái hóm hỉnh: Zettour xưng ''tôi'', giữ nguyên câu
    đùa tỉnh bơ ''Tất nhiên rồi, tôi sẽ cẩn thận sau khi chuyện này kết thúc.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Zettour bằng ''ông''; giữ hai cấu
    trúc phủ định ''chẳng có cách nào lay chuyển được quyết định của ông'' và ''vì
    câu nói đùa của mình không được hưởng ứng nồng nhiệt hơn''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: quy chiếu Cramm bằng ''ông''; ''hatch''
    -> ''cửa nắp xe tăng''; giữ cụm phủ định ''chẳng mảy may bận tâm đến sự an nguy
    của bản thân''."]'
