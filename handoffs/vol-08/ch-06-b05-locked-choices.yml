choices:
- segment_id: YS-LN08/Text/chapter022.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: trong lời dặn của Drake quy chiếu
    Sue bằng ''cô ta''; ''Federation Army'' -> ''Quân đội Liên bang''; ''imperial
    troops'' -> ''đám quân Đế quốc''; giữ mệnh lệnh phủ định dứt khoát ''Dù trong
    bất kỳ hoàn cảnh nào cũng không được phép...'' và ''Tuyệt đối không được nới lỏng
    dây cương!''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: dịch lời đáp nhận lệnh ngắn gọn là ''“Rõ!”''; không
    in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & thuật ngữ: giữ tên ''Sue'', ''Drake''; ''old wingmate''
    -> ''người đồng đội cùng phi đội năm xưa''; ''over the radio'' -> ''qua vô tuyến''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Đại từ & mức độ: quy chiếu Drake bằng ''Anh'', gọi Sue là ''cô
    nàng bất kham ấy''; giữ sắc thái mức độ ''phần nào đã có thể kiểm soát được''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: quy chiếu Sue bằng ''cô ta''; giữ tình thái
    ''xem chừng cô ta đang dần học được cách kiềm chế đôi chút trước những pha xung
    phong liều lĩnh của mình''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ: quy chiếu Drake bằng ''Anh'', Sue bằng ''cô ta'';
    giữ phép ẩn dụ ''dạy cho cô ta một bài học'' và ''cái giá học phí ấy đã phải trả
    bằng sinh mạng của quá nhiều thuộc cấp dưới quyền anh''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Tình thái & nghĩa: giữ từ tình thái ''có lẽ'' và nhận định ''vấn
    đề nằm ở năng lực chỉ huy của Sue nhiều hơn''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & điều kiện: Drake gọi thuộc cấp là ''anh em'',
    xưng ''tôi'' / ''chúng ta''; giữ điều kiện phủ định ''người chết thì chẳng được
    giọt nào đâu'' và ''Nếu không muốn bị cướp mất phần, hãy dốc toàn lực mà chiến
    đấu!''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ định dạng viết hoa toàn bộ ''CÙNG LÚC ĐÓ, TIỂU
    ĐOÀN PHÁP SƯ TRÊN KHÔNG SỐ 203 CỦA LỤC QUÂN ĐẾ QUỐC''; không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Báo cáo quân sự: dịch gọn ''“Phát hiện quân địch — lực lượng pháp
    sư tương đương hai tiểu đoàn.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Tanya đáp lại sĩ quan phụ tá bằng ''“Ừ, tôi thấy chúng
    rồi.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Đại từ & chức danh: quy chiếu Tanya trong trần thuật bằng ''cô'';
    ''adjutant'' -> ''sĩ quan phụ tá''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & cấu trúc hô ứng: Tanya xưng ''tôi''; ''Federation-Commonwealth
    composite unit'' -> ''đơn vị hỗn hợp Liên bang – Khối Thịnh vượng chung''; giữ
    sự hô ứng chính xác của cụm từ ''đối với một'' ở cả hai câu."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Giả định & thuật ngữ: giữ giả định mở đầu ''Sẽ thật tuyệt nếu
    cái tổ chức hai đầu kia rơi vào cảnh rối loạn...''; ''chain of command'' -> ''hệ
    thống chỉ huy''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''Commie'' ->
    ''một tay Cộng sản''; giữ hình ảnh ''một đạo quân Cộng sản và một đạo quân tư
    bản đang phối hợp nhịp nhàng như một''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ lời cảm thán ngắn gọn của Tanya ''“Đúng là một
    cảnh tượng chướng mắt. Thật sự rùng rợn.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Grantz xưng ''chúng tôi'' (kèm ''ạ''), gọi
    Tanya là ''Trung tá'', gọi quân địch là ''bọn chúng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & đại từ: ''First Lieutenant Grantz'' -> ''Trung úy Grantz''
    (quy chiếu bằng ''anh ta''); ''Lieutenant General von Zettour'' -> ''Trung tướng
    von Zettour''; quy chiếu Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ nội tâm: nội tâm tự quy chiếu của Tanya dùng
    ''mình'' theo DEC-P01-001; không tự thêm chữ nghiêng khi nguồn không có nhấn mạnh
    theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: Tanya dùng ''Chúng ta'', giữ phủ định ''không
    thể mặc định rằng quân địch có kỷ luật kém được'' và kết luận dứt khoát ''Vậy
    nên không, bác bỏ.''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ & sắc thái: bảo toàn chính xác chữ nghiêng ''*Chúng
    ta thực sự không thể sao ạ?*'' theo DEC-P01-002; quy chiếu Tanya bằng ''cô'',
    Grantz bằng ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi gián tiếp: quy chiếu Tanya bằng ''Cô'', Grantz
    bằng ''anh ta''; giữ câu hỏi gián tiếp ''hỏi xem anh ta có phải là con nít không''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & câu hỏi tu từ: Tanya gọi ''Trung úy Grantz'',
    xưng ''tôi'', gọi ''Anh''; giữ mệnh đề ''không là không'' và câu hỏi cảnh cáo."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & ngập ngừng: giữ nét lắp bắp ''“K-không, thưa Trung tá.
    Tôi đã rõ!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ đối xứng: giữ tên ''Tanya'' và đại từ ''cô'',
    quy chiếu Grantz bằng ''anh ta''; giữ cấu trúc tương phản ''Dù một mặt... nhưng
    mặt khác...''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Giả định & phủ định: giữ câu điều kiện giả định kèm phủ định ''Dù
    nếu phe địch mà rơi vào cảnh hỗn loạn, cô cũng chẳng phản đối những thành quả
    nắm chắc trong tay đâu.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giọng thoại: giữ lời phàn nàn của Tanya về ''Đám kẻ
    địch không chịu tan rã thế này''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu đơn vị Tanya bằng ''họ'', pháp sư
    địch bằng ''bọn chúng''; giữ phủ định so sánh ''chẳng giống những kẻ sống sót
    đang tháo chạy khỏi một trận thua chút nào''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, thuật ngữ & độ mở câu hỏi: bảo toàn chính xác chữ nghiêng
    cho toàn bộ đoạn nội tâm theo DEC-P01-002; ''pursuit battle'' -> ''trận truy kích'';
    giữ nguyên độ mở câu hỏi ''*rốt cuộc chuyện gì đang diễn ra thế này?*''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện: ''encounter battle'' -> ''trận tao ngộ
    chiến''; giữ quan hệ điều kiện và không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & thuật ngữ: bảo toàn chính xác phạm vi chữ nghiêng
    chỉ ở từ cảm thán đầu đoạn ''*Đây rồi!*'' theo DEC-P01-002; ''indirect approach''
    -> ''lối tiếp cận gián tiếp''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu bỏ lửng: ''path of retreat'' -> ''đường rút quân'';
    giữ câu mệnh lệnh và dự đoán bị cắt ngang bởi dấu chấm lửng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Báo cáo khẩn: giữ câu cảnh báo ngắn ''“Chúng đang lao về phía
    này!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Chức danh, đại từ & câu hỏi: ''adjutant'' -> ''sĩ quan phụ tá'';
    Tanya dùng ''chúng ta'' và ''Chúng'' trong câu hỏi tu từ phẫn nộ."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: dùng ''chúng ta'' cho đơn vị mình và ''bọn
    chúng'' / ''chúng'' cho quân địch; ''pursuit battle'' -> ''trận truy kích''; ''coordinated
    feint attack'' -> ''đòn công kích nghi binh phối hợp''; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh & thán từ: giữ nhịp ngắt ''và... khực!'' cùng mệnh lệnh
    xác nhận mục tiêu ở ''hướng ba giờ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Weiss thưa ''thưa Trung tá'' (''ma’am''),
    giữ sắc thái thận trọng ''Có vẻ là quân địch'' và báo cáo số lượng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Nhân vật: giữ lời khen ngắn gọn ''“Làm tốt lắm, Weiss!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: lược đại từ ngôi thứ hai phiếm chỉ trong
    câu nhận định chiến thuật; ''prestidigitation'' -> ''trò ảo thuật vặt vãnh''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái: dùng ''Chúng ta'' trong suy nghĩ quyết tâm
    của Tanya, đối lập với ''bọn chúng''; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh tác chiến: giữ rõ hai vế mệnh lệnh duy trì cự ly giữa
    các đội hình và tập trung hỏa lực vào từng máy bay địch.'']'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & thuật ngữ: giữ tên ''Tanya''; ''defensive barrages''
    -> ''màn đạn phòng ngự''; ''interdiction fire'' -> ''hỏa lực ngăn chặn''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập: giữ câu chuyển ý ngắn gọn ''Thế nhưng cuộc giao
    chiến của họ lại kết thúc đầy hụt hẫng.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi & cảm thán: giữ câu hỏi ngỡ ngàng và tiếng chửi thề ''“Hả?
    Chúng đi đâu thế kia...? Khốn kiếp!”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: giữ đại từ ngôi thứ nhất số nhiều ''chúng
    tôi'' (''right in front of us'') khi Tanya thuật lại tình huống của tiểu đoàn
    trước pha ngoặt hướng ung dung của địch."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Phủ định & dấu câu: giữ lối chơi chữ đối lập giữa ''đánh rồi rút''
    (''hit-and-run'') và cụm trong ngoặc kép ''“chẳng thèm đánh”'' (''“no hit.”'')."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ đại từ ''chúng tôi'' (''us'' / ''we'');
    ''splendid barrage'' -> ''màn đạn oanh kích tuyệt đẹp''; ''long-range sniping
    fire'' -> ''hỏa lực bắn tỉa tầm xa''."]'
