choices:
- segment_id: YS-LN08/Text/chapter006.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi giả định: Zettour dùng ''chúng ta'' cho ''we'';
    giữ câu hỏi điều kiện ''“Thế còn nếu chúng ta thất bại thì sao?”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, thuật ngữ & tình thái: giữ chính xác phạm vi chữ nghiêng
    ''*Luôn phải có sẵn phương án dự phòng trong đầu.*'' theo DEC-P01-002; ''staff
    officer'' -> ''sĩ quan tham mưu''; giữ tình thái ''Thậm chí có người còn gọi đó
    là bản chất tồn tại của họ.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập, phủ định & nhân quả: quy chiếu các sĩ quan tham
    mưu bằng ''Họ'' / ''họ''; giữ phủ định ''chẳng ai muốn thấy hay muốn nghĩ tới'',
    sự đối lập bề ngoài ''Nghe có vẻ mâu thuẫn'' và cấu trúc nhân quả nhấn mạnh ''nhưng
    chính vì khao khát thành công hơn bất cứ ai khác nên họ mới luôn hình dung tới
    những kịch bản tồi tệ nhất''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: Rudersdorf tự xưng ''Tôi''; giữ hai phủ định
    ''không ngần ngại rút lui'' và ''chẳng hứng thú với việc đặt cược vào một con
    ngựa thua cuộc đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, thuật ngữ, xưng hô & câu điều kiện: giữ dấu chấm lửng
    mở đầu; ''B Group'' -> ''Cụm B''; Zettour gọi Rudersdorf là ''ông'', tự xưng ''tôi'';
    giữ câu điều kiện ''Nếu ông định lui quân thì hãy báo cho tôi biết.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: quy chiếu Zettour bằng ''Ông''; giữ phủ
    định ''Rudersdorf sẽ không chọn sai thời điểm'' và nhận định ''Việc lo lắng về
    chuyện đó có vẻ thật kỳ lạ.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, câu hỏi nội tâm, so sánh & phủ định: quy chiếu ''Zettour''
    bằng ''ông'' / ''mình''; giữ câu hỏi phỏng đoán ''Nhưng biết đâu Zettour lại thấy
    bồn chồn vì đã lâu rồi mới quay lại nhận nhiệm vụ ngoài tiền tuyến?'', phép so
    sánh ''cứ như thể mình vừa cài lệch một cúc áo sơ mi vậy'' và phủ định ''không
    tài nào diễn tả nó thành lời cho rõ ràng được''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & điều kiện: quy chiếu Zettour bằng ''ông'';
    giữ phủ định ''quyết định không nói gì cả'' và câu điều kiện phủ định ''Một khi
    chưa chắc chắn thì tốt hơn hết là đừng lên tiếng ngay từ đầu.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Rudersdorf tự xưng ''Tôi'' / ''tôi'', gọi
    Zettour là ''ông''; ''A Front'' -> ''Mặt trận A''; giữ giới hạn ''chỉ cần lo cho
    Mặt trận A thôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & phủ định: Zettour tự xưng ''Tôi'' / ''mình'';
    giữ tình thái ''Tôi đoán'' và phủ định ''cũng chẳng cần phải làm gì quá điên rồ
    với nó đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu điều kiện: Rudersdorf gọi Zettour là ''ông'', tự
    xưng ''tôi''; giữ câu điều kiện và mức độ chắc chắn ''Nếu ông đã nói sẽ làm, tôi
    tin chắc ông sẽ giải quyết êm xuôi thôi.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, xưng hô & phủ định: giữ dấu chấm lửng mở đầu; Zettour
    tự xưng ''Tôi'' / ''tôi'', gọi Rudersdorf là ''ông''; giữ phủ định giới hạn ''đây
    không phải vấn đề có thể giải quyết chỉ bằng trách nhiệm liên đới''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Rudersdorf gọi Zettour là ''Ông'', giữ
    câu đáp ngắn gọn ''“Ông cứ nói đi.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, đại từ & quan hệ đối lập: ''Colonel Uger'' -> ''Trung
    tá Uger''; Zettour tự xưng ''tôi'', quy chiếu các sĩ quan để lại bằng ''họ'';
    giữ hai vế đối lập ''đều là các sĩ quan xuất sắc, nhưng họ là những người hiền
    lành'' và ''rất có tinh thần hợp tác nhưng lại thường dè dặt trong việc bày tỏ
    quan điểm riêng''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: Rudersdorf gọi Zettour là ''ông''; giữ dấu
    chấm lửng và dấu hỏi trong ''“Ý ông là sao…?”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đối lập & tình thái nhân quả: Zettour gọi Rudersdorf
    là ''Ông'', đối lập giữa ''khi họ nói điều gì đó là bất khả thi'' và ''khi tôi
    nói điều gì đó là bất khả thi''; giữ phủ định ''không thể làm được'', mức độ ''khả
    năng rất cao'' và nguyên nhân ''là vì họ đã cạn kiệt mọi phương án rồi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Service Corps staff officers'' -> ''Các
    sĩ quan tham mưu thuộc Cục Quân vụ''; quy chiếu Zettour bằng ''ông'' và nhóm sĩ
    quan bằng ''Họ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ: quy chiếu nhóm sĩ quan bằng ''họ''; giữ ẩn dụ
    ''những bánh răng hoàn hảo''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Đại từ & bị động: quy chiếu nhóm sĩ quan bằng ''họ''; giữ cấu
    trúc bị động ''họ sẽ được sử dụng như thế nào''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & chỉ dẫn: Zettour tự xưng ''Tôi'' / ''tôi'',
    gọi Rudersdorf là ''ông'', quy chiếu cấp dưới bằng ''họ''; giữ tình thái tăng
    tiến ''Thậm chí có thể nói là họ làm việc quá sức'' và lời dặn ''Xin hãy lưu tâm
    điều đó khi ông đưa ra yêu cầu cho họ.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Phủ định, dấu câu, thuật ngữ & câu điều kiện: quy chiếu nhóm sĩ
    quan bằng ''Họ'' / ''họ''; ''staff officers'' -> ''các sĩ quan tham mưu''; giữ
    phủ định ''chẳng bao giờ làm việc qua loa đại khái'', dấu chấm lửng sau ''nhưng…'',
    phủ định ''không có được sự nghỉ ngơi cần thiết'' và câu điều kiện phủ định ''Nếu
    tự đẩy bản thân tới giới hạn, họ sẽ không còn đủ sức lực dự trữ thích hợp khi
    xảy ra tình huống khẩn cấp.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, xưng hô & so sánh: giữ dấu chấm lửng mở đầu; Rudersdorf
    tự xưng ''Tôi'', gọi Zettour là ''ông''; giữ so sánh hơn ''Việc vắt kiệt nguồn
    lực từ chỗ ông đơn giản hơn nhiều.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & giả định trái thực tế: Zettour gọi Rudersdorf
    là ''ông'', tự xưng ''tôi'' / ''mình'' / ''chúng tôi''; ''Operations'' -> ''Cục
    Tác chiến''; giữ giới hạn ''thứ duy nhất ông vắt ra được chỉ là sự oán hận thôi''
    và câu ước trái thực tế ''Giá như họ có phúc gặp được một người đồng sự tốt hơn.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & giọng trêu chọc: Rudersdorf tự xưng ''tôi'',
    gọi Zettour là ''ông''; ''B Group'' -> ''Cụm B''; giữ giọng bông đùa ''một người
    đồng sự tốt như tôi ở Cụm B nhé''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ tiếng cười và câu đáp ngắn gọn ''“Ha-ha-ha! Được
    thế thì còn gì bằng.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & phủ định: giữ tên ''Zettour'', ''Rudersdorf'';
    giữ mệnh đề nhượng bộ ''Dù cả hai đều đã có tuổi'' và phủ định ''lối đấu khẩu
    trêu chọc giữa họ vẫn chẳng hề thay đổi so với thuở mới cùng nhau nhập ngũ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: giữ lời chúc ''“Chúc ông may mắn.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: giữ lời chào ''“Cảm ơn. Hẹn gặp lại ông vào một lúc nào
    đó.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000228
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & xưng hô: Rudersdorf tự xưng ''Tôi'', gọi Zettour theo
    lối trang trọng pha bông đùa là ''ngài'' – ''Tướng quân'' (''General'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000229
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhượng bộ & phủ định: ''staff officer'' -> ''sĩ quan
    tham mưu''; giữ cấu trúc nhượng bộ ''Cho dù... đến đâu chăng nữa'' và phủ định
    khẳng định chắc chắn ''điều đó chắc chắn chẳng liên quan gì tới việc họ có phải
    là một người tốt hay không''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000230
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Zettour tự xưng ''Tôi'', gọi Rudersdorf
    là ''ông''; giữ giọng bông đùa ''Tôi đang tính làm cho ông sạt nghiệp đấy.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & cách chơi chữ chức vụ: Rudersdorf tự xưng ''Tôi'' /
    ''tôi'', gọi Zettour là ''Ông'' / ''ông'', dùng ''Chúng ta'' cho ''We''; giữ cặp
    danh xưng đối lập ''Zettour của Cục Tác chiến'' (''Operations Zettour'') và ''Zettour
    của Cục Quân vụ'' (''Service Corps Zettour'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, xưng hô, phủ định, tình thái & thuật ngữ: giữ dấu chấm
    lửng mở đầu; Zettour tự xưng ''Tôi'' / ''tôi'', gọi Rudersdorf là ''ông''; giữ
    phủ định ''chưa từng nghĩ'', tình thái ''Xem ra'' và địa danh ''mặt trận phía
    đông'' (''eastern front'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu ''Zettour'' bằng ''mình'' / ''ông'';
    ''batman'' -> ''người lính cần vụ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, xưng hô & dấu câu: người lính cần vụ tự xưng ''tôi'',
    gọi Zettour là ''thưa Tướng quân!'' và ''ngài''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000235
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ nguyên ''“Hành lý ư?”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000236
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu điều kiện: người lính cần vụ đáp ''Vâng, thưa ngài!'',
    tự xưng ''tôi'', gọi Zettour là ''ngài'' kèm tiểu từ ''ạ''; giữ câu điều kiện
    ''Nếu ngài chỉ cho tôi chỗ để hành lý, tôi có thể mang chúng vào giúp ngài ngay
    lập tức ạ.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000237
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ phủ định ''nhưng chẳng có túi hành lý nào đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000238
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & câu hỏi nội tâm: ''young batman'' -> ''người
    lính cần vụ trẻ tuổi'', quy chiếu bằng ''Cậu ta''; giữ câu hỏi ''Cậu ta có nghe
    nhầm không đấy?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000239
  kind: terminology_and_voice
  value: 'choices=["Nói lắp, dấu câu, xưng hô & câu hỏi phủ định: giữ nét nói lắp
    ''V-vâng'', hai dấu chấm lửng, xưng hô ''thưa ngài'' / ''ngài'' kèm ''ạ'' và câu
    hỏi phủ định ''ngài không cần hỗ trợ gì sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000240
  kind: terminology_and_voice
  value: 'choices=["Mức độ, tình thái & cấp bậc: giữ sắc thái mức độ ''suýt nữa đã
    thấy tội nghiệp'' (''almost pitied''), tình thái suy đoán ''có lẽ là'' (''perhaps'')
    và ''một sĩ quan cấp cao'' (''a high-ranking officer'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000241
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ, phủ định, câu hỏi tu từ & điều kiện: Zettour
    gọi người lính cần vụ là ''Cậu'', tự xưng ''tôi'' / ''mình''; ''officer’s suitcase''
    -> ''chiếc vali sĩ quan''; giữ giới hạn ''Tất cả những gì tôi mang theo chỉ là...'',
    phủ định ''Đâu phải tôi đang chuyển nhà'', câu hỏi tu từ ''thế thì mang theo nhiều
    hơn mức mình tự xách nổi để làm gì chứ?'' và điều kiện ''ngay khi có lệnh truyền
    xuống''."]'
