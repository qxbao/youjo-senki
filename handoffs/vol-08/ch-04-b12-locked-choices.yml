choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đối lập & phủ định: ''staff officer'' -> ''sĩ quan
    tham mưu''; ''division commander'' -> ''tư lệnh sư đoàn''; giữ cấu trúc đối lập
    ''Người trước còn lâu mới là kẻ vô dụng, nhưng người sau lại nổi bật ở lòng nhiệt
    huyết đối với những hành động quyết đoán''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Đối lập khái niệm & thuật ngữ: giữ tương phản ''Trước khi hiểu
    bằng cái đầu, họ đã hiểu bằng con tim''; ''Division commanders'' -> ''Các tư lệnh
    sư đoàn''; quy chiếu bằng ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chiến thuật: Zettour xưng ''tôi'' và gọi Cramm là ''anh'';
    dịch nhịp điệu khẩu lệnh chiến thuật là ''đi vòng qua, đi vòng qua, rồi tấn công
    trực diện''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Cramm xưng ''chúng tôi'' (đơn vị) và ''Tôi''
    (cá nhân), đáp ''Vâng''; ''strategic reserve divisions'' -> ''các sư đoàn dự bị
    chiến lược''; ''classic maneuver battle'' -> ''trận đánh cơ động kinh điển''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000404
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nghĩa: quy chiếu Cramm bằng ''ông ta'' nhất
    quán với batch trước; giữ khẳng định phủ định ''là không thể nhầm lẫn dù chỉ nghe
    qua điện thoại''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: in nghiêng toàn đoạn ''*Chúng
    ta sẽ cứu những người đồng đội của mình bằng một trận đánh cơ động!*'' theo DEC-P01-002;
    dùng đại từ ''Chúng ta'' – ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Phủ định, điều kiện giả định & thuật ngữ: giữ phủ định ''Chắc
    chắn chẳng người lính nào có thể ghét bỏ''; ''Imperial Army'' -> ''Lục quân Đế
    quốc''; giữ giả định ''Nếu trong Lục quân Đế quốc mà có kẻ lệch lạc đến thế, kẻ
    đó ắt hẳn phải là gián điệp của địch''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000407
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Zettour gọi Cramm là ''Anh''; ''other division
    commanders'' -> ''các tư lệnh sư đoàn khác''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & kính ngữ: Cramm gọi Zettour là ''ngài'', xưng ''tôi''
    và có tiểu từ kính ngữ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điều kiện: quy chiếu Zettour bằng ''ông'', các tư lệnh
    sư đoàn bằng ''họ''; giữ câu điều kiện ''Nếu Zettour có thể huy động được họ,
    thì canh bạc của ông về cơ bản coi như đã thắng rồi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, chức danh & thuật ngữ: ''Commander'' -> ''Chỉ huy'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''; Zettour xưng ''tôi'' – ''anh'' và ''chúng
    ta''; giữ giọng mệnh lệnh trang trọng theo nghi thức."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận & kính ngữ: giữ câu hỏi ngắn gọn có kính ngữ
    ''“Vậy là đã quyết định rồi sao ạ?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & đại từ: giữ quan hệ đối lập và điều kiện ''miễn là
    họ có được một cái cớ''; quy chiếu các quân nhân bằng ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh ngắn: khóa câu thoại cô đọng ''“Hãy cứu quân ta.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000414
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định so sánh: Cramm xưng ''Tôi'', gọi Zettour là
    ''ngài''; giữ lối nói ''“…Tôi chẳng mong gì hơn thế. Xin ngài cho chỉ thị ạ?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000415
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ tên ''Zettour'', quy chiếu các tư lệnh
    sư đoàn bằng ''họ'' / ''mình''; ''friendly troops'' -> ''quân bạn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000416
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc đoạn: giữ cụm danh động từ bỏ lửng ''Đưa ra một cái cớ…'';
    không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000417
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: giữ tên ''Zettour''; ''eastern front''
    -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000418
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đơn vị & mệnh lệnh phủ định: ''clockwise maneuver''
    -> ''mũi cơ động theo chiều kim đồng hồ''; ''Federation Army'' -> ''Quân đội Liên
    bang''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''; giữ mệnh lệnh phủ định
    ''đừng để nó trở thành mối bận tâm cho mũi tiến công chính ở dưới phía nam''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000419
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp quân sự: khóa câu đáp gọn ''“Rõ.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000420
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định đính chính: Zettour gọi Cramm là ''anh''; giữ
    cấu trúc ''đây không phải là yêu cầu, mà chỉ để báo cho anh biết thôi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000421
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: dịch ''“Sir?”'' là ''“Thưa Tướng quân?”'' nhất quán với
    batch trước."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000422
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thành ngữ tương đương: Zettour xưng ''Tôi'' – ''anh'';
    dịch ''ex post facto approval'' là ''chuyện tiền trảm hậu tấu này''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000423
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: giữ tên ''Cramm'' và ''Zettour''; phân biệt
    rõ ''ông'' (Zettour) và ''ông ta'' (Cramm)."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000424
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''General'' -> ''Tướng quân''; ''First Lieutenant
    Grantz'' -> ''Trung úy Grantz''; Grantz xưng ''tôi'' và gọi Zettour là ''Ngài''
    kèm ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000425
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quân hàm: phân biệt ''ông'' (Zettour) và ''anh'' (Grantz);
    ''Lieutenant Colonel von Degurechaff'' -> ''Trung tá von Degurechaff''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000426
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & đại từ: ''The orderly'' -> ''Người lính
    cần vụ''; quy chiếu bằng ''anh''; giữ tình thái phỏng đoán quá khứ ''Hẳn anh đã
    đứng đợi bên ngoài vì phép lịch sự''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000427
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: quy chiếu Zettour bằng ''ông''; giữ sắc thái
    nhận định ''Xem ra ông có thể trông cậy vào những con người này''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000428
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đại từ trần thuật: trong thoại Zettour gọi sĩ quan cấp
    úy trẻ tuổi Grantz là ''cậu'' để thể hiện khoảng cách tuổi tác/cấp bậc và sự thân
    mật bề ngoài; trong trần thuật quy chiếu Grantz bằng ''viên trung úy trẻ tuổi''
    / ''anh''; ''the orderly'' -> ''người lính cần vụ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000429
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Zettour xưng ''tôi'' và gọi Grantz là ''cậu'';
    giữ lời xin lỗi lịch thiệp vì không hỏi trước sở thích."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000430
  kind: terminology_and_voice
  value: 'choices=["Lắp bắp & xưng hô: giữ nét lắp bắp ''Đ-đó là vinh hạnh của tôi,
    thưa Tướng quân!''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000431
  kind: terminology_and_voice
  value: 'choices=["Tình thái, chức danh & dấu câu: giữ tình thái suy đoán ''đây ắt
    hẳn là một buổi tiệc trà khá cân não''; ''the orderly'' -> ''người lính cần vụ'';
    giữ dấu ba chấm trước nhận định về sự quý báu của thời gian."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000432
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế: giữ câu điều kiện giả định ''Nếu đây không
    phải là chiến trường, có lẽ Zettour cũng đã thuần khiết hơn đôi chút''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000433
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''Lieutenant Grantz'' -> ''Trung úy Grantz'';
    ''Colonel von Degurechaff'' -> ''Trung tá von Degurechaff''; Zettour xưng ''tôi''
    – ''cậu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000434
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Grantz gọi Zettour là ''thưa Tướng quân''
    / ''ngài'' và xưng ''Chúng tôi''; ''on standby for rapid response'' -> ''trong
    tư thế trực chiến để phản ứng nhanh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000435
  kind: terminology_and_voice
  value: 'choices=["Đính chính tăng tiến, đại từ & địa danh: giữ cấu trúc ''Không,
    nó còn tốt hơn cả những gì ông mong đợi''; quy chiếu Zettour bằng ''ông''; ''in
    the east'' -> ''ở miền đông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000436
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & tên riêng: giữ tên ''Degurechaff'' và mệnh đề tương
    phản nhượng bộ ''Dù tràn đầy sự nhạy bén, tham vọng và tinh thần chiến đấu của
    các sĩ quan cấp thấp, nhưng những người lính ở đó có vẻ rất có kỷ luật''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000437
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ, đại từ & thuật ngữ: quy chiếu đơn vị của Tanya bằng ''Họ''
    / ''họ''; ''cogs of state-sanctioned violence'' -> ''những bánh răng của bạo lực
    được nhà nước trao quyền''; ''eastern front'' -> ''mặt trận phía đông''; giữ ẩn
    dụ đối lập giữa thứ cà phê như nước bùn và hương thơm hàng thật giá thật."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000438
  kind: terminology_and_voice
  value: 'choices=["Độc thoại thành tiếng & phủ định: Zettour xưng ''tôi'', gọi họ
    là ''họ''; giữ câu nhận xét phủ định tự nhiên."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000439
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: dịch ''“General?”'' là ''“Thưa Tướng quân?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000440
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phạm vi hạn định: ''General Staff Office''
    -> ''Văn phòng Bộ Tổng tham mưu''; ''General Staff'' -> ''Bộ Tổng tham mưu'';
    ''the forward-most line in the east'' -> ''tuyến tiền tiêu xa nhất ở miền đông'';
    quy chiếu Zettour bằng ''Ông'' / ''ông'' / ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000441
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ngôi khái quát & điều kiện: ''magic officer'' -> ''sĩ
    quan ma pháp''; dịch ''you'' khái quát bằng ''người ta''; giữ câu điều kiện cuối
    đoạn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000442
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ, nhượng bộ & thuật ngữ: ''precious pearl of a mage company''
    -> ''viên ngọc quý là đại đội pháp sư''; ''General Staff Office'' -> ''Văn phòng
    Bộ Tổng tham mưu''; ''eastern army'' -> ''đạo quân phía đông''; giữ quan hệ nhượng
    bộ ''bất chấp việc bị gạt khỏi... mà không có thực quyền''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000443
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thành ngữ: ''Lieutenant Grantz'' -> ''Trung
    úy Grantz''; Zettour xưng ''tôi'' – ''cậu''; dịch ''bend over backward for me''
    là ''dốc hết sức vì tôi một phen''."]'
