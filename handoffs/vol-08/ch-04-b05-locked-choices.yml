choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật & chức vụ: trần thuật ngôi thứ ba dùng tên
    riêng ''Tanya''; ''her adjutant'' -> ''sĩ quan phụ tá''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, câu hỏi nội tâm & đại từ: giữ câu hỏi nội tâm mở đầu;
    giữ sắc thái cảm thán khẩu ngữ ''Chà, khốn thật.''; quy chiếu quân địch bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & điều kiện: quy chiếu địch bằng ''chúng'',
    đơn vị của Tanya bằng ''chúng tôi'', và chủ thể giả định chung bằng ''bạn''; ''Federation
    infantry'' -> ''bộ binh Liên bang''; ''stray Federation artillery fire'' -> ''đạn
    pháo lạc của chính quân Liên bang''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & câu hỏi: giữ câu chửi cảm thán và câu hỏi phẫn nộ
    của Tanya ''“Lũ khốn tàn độc này. Vậy ra bộ binh của chúng chỉ là vật hy sinh
    thôi sao?!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi nội tâm: ''Communists'' -> ''đám Cộng sản'';
    ''human rights'' -> ''nhân quyền''; giữ câu hỏi tu từ phê phán ý thức hệ đối phương."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & đối tượng câu hỏi: giữ câu hỏi ngắn khẩn trương
    của Tanya về ''pháp sư địch''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại báo cáo & thuật ngữ: ''Signals'' -> ''tín hiệu'';
    quy chiếu pháp sư địch bằng ''chúng''; thêm tiểu từ kính ngữ ''ạ'' đúng vai cấp
    dưới báo cáo."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: câu hỏi tự vấn mở đầu dùng ''Chúng
    ta''; trần thuật pha nội tâm dùng ''Tanya'', ''chúng tôi'', ''cô'' và tự quy chiếu
    ''mình''; ''counter-battery fire'' -> ''bắn phản pháo''; ''field telephone'' ->
    ''chiếc điện thoại dã chiến''; giữ dấu chấm lửng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Nhân vật, quân hàm & đại từ: giữ tên riêng ''Serebryakov''; ''Captain
    Meybert'' -> ''Đại úy Meybert''; quy chiếu Meybert trong lời báo cáo của Serebryakov
    bằng ''Anh ấy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại mệnh lệnh: giữ câu bác bỏ ngắn gọn, dứt khoát ''“Bác
    bỏ!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa: giữ tên riêng ''Serebryakov'' và ''Tanya'';
    giữ nguyên ý nhận định chung về tâm lý người lính khi bị pháo kích."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba quy chiếu Tanya bằng
    ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, chữ nghiêng & phủ định: độc thoại nội tâm tự
    quy chiếu của Tanya dùng ''mình'' theo DEC-P01-001; dùng ''chúng tôi'' / ''Chúng
    tôi'' cho đơn vị; giữ đúng phạm vi nhấn mạnh Markdown ''*Thổi bay lũ pháo thủ
    địch chướng mắt đó đi*'' theo DEC-P01-002; giữ tên riêng ''Meybert'', ''shells''
    -> ''đạn pháo'', và phủ định ở câu cuối."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, chức vụ & đại từ: Serebryakov gọi Tanya là ''thưa Trung
    tá'' / ''Trung tá'', tự xưng ''Tôi'' kèm ''ạ''; trần thuật dùng ''Sĩ quan phụ
    tá của Tanya'' và quy chiếu Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định trong thoại: Tanya tự xưng ''Tôi'' với cấp
    dưới; giữ câu phủ định dứt khoát ''“Tôi đã bảo là không!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi, đại từ & thuật ngữ: giữ câu hỏi cầu khẩn của Serebryakov
    dùng ''Chúng ta'', ''counterattack'' -> ''phản kích'', kết câu bằng ''sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, đại từ & phủ định: giữ ba câu cảm thán liên tiếp
    của Tanya; dùng ''Chúng ta'' và ''tôi''; ''shells'' -> ''đạn pháo''; giữ phủ định
    tuyệt đối ''tuyệt đối không có đạn pháo cho việc đó'' và câu cấm đoán ''Đừng có
    cám dỗ tôi thêm nữa!''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định kép: câu đầu độc thoại nội tâm tự
    quy chiếu của Tanya dùng ''mình'' theo DEC-P01-001 và giữ phủ định kép ''Không
    phải là mình không hiểu''; quy chiếu ''Serebryakov'' bằng ''cô ấy''; câu hai chuyển
    sang trần thuật ngôi thứ ba với ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & câu hỏi: trần thuật lời nửa trực tiếp quy
    chiếu Tanya bằng ''Cô'' / ''cô'' và tự quy chiếu ''mình''; giữ hai câu hỏi đối
    lập và câu chốt khẳng định phương án sau."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: hai câu đầu độc thoại nội tâm tự
    quy chiếu của Tanya dùng ''mình'' theo DEC-P01-001; giữ nguyên ''Being X''; ''organizational
    logic'' -> ''logic tổ chức''; câu cuối trần thuật ngôi thứ ba dùng ''Tanya'' và
    ''bản thân''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & tình thái: ''ma’am'' -> ''thưa Trung tá''; dùng
    ''chúng ta''; giữ tình thái cảnh báo nguy cơ ''có thể bị ghìm chân hoàn toàn mất!''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & nhân vật: trong thoại Tanya dùng ''Chúng ta''
    và ''tôi''; trần thuật quy chiếu Tanya bằng ''Cô''; ''Major Weiss'' -> ''Thiếu
    tá Weiss''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & câu hỏi gián tiếp: trần thuật ngôi thứ ba dùng ''Tanya'';
    giữ cấu trúc tự vấn ''không khỏi tự hỏi liệu đây có thực sự là việc nên làm hay
    không''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & đại từ: giữ câu hỏi phủ định tu từ trong nội
    tâm ''Chẳng phải chúng ta nên đề phòng pháp sư địch sao?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Tình thái, nhân vật & thuật ngữ: ''distraction'' -> ''nghi binh'';
    giữ tên riêng ''Weiss''; giữ mức độ phỏng đoán ''có lẽ còn mang lại rủi ro lớn
    hơn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô qua điện thoại: ''Colonel'' -> ''Thưa Trung
    tá''; ''Major Weiss'' -> ''Thiếu tá Weiss''; giữ giọng báo danh chuẩn mực của
    cấp dưới."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & giọng thoại: Tanya gọi Weiss là ''Thiếu tá''; giữ lời
    chào ngắn gọn và chỉ thị vào việc."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: ''Yes, ma’am. At your service.'' -> ''“Rõ,
    thưa Trung tá. Tôi xin nghe lệnh.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & sắc thái: giữ câu cảm thán nội tâm đánh giá cao sự
    hăng hái của cấp dưới.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & thuật ngữ: Tanya gọi Weiss là ''Thiếu tá''
    và tự xưng ''Tôi''; ''shells'' -> ''đạn pháo''; ''defense against artillery''
    -> ''phòng ngự chống pháo kích''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi & dấu câu: Weiss gọi Tanya là ''Trung tá'' và
    xưng ''chúng tôi'' (đại diện lực lượng pháp sư); giữ dấu chấm lửng và sắc thái
    ngạc nhiên."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & giả định trái thực tế: câu đầu trần thuật
    ngôi thứ ba dùng ''cô'', ''của mình'' và tên riêng ''Weiss''; câu hai độc thoại
    nội tâm dùng ''mình'' theo DEC-P01-001, quy chiếu Weiss bằng ''anh ta'', và giữ
    giả định quá khứ trái thực tế ''Giá mà hoàn cảnh chỉ khác đi đôi chút, hẳn mình
    đã đồng cảm với anh ta rồi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: giữ câu nhận định khái quát mở đầu;
    trần thuật dùng ''Tanya'' và ''cô''; giữ phủ định ''đây không phải là vấn đề có
    thể giải quyết bằng cách phàn nàn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya gọi nhóm Weiss là ''Các anh'' và dùng
    ''chúng ta'' / ''Chúng ta'' khi nhắc kỷ niệm chung của tiểu đoàn; ''the homeland''
    -> ''bản quốc''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ, phủ định & thuật ngữ: ''Colonel!'' -> ''Thưa
    Trung tá!''; ''troop density'' -> ''Mật độ binh lực''; ''two companies of aerial
    mages'' -> ''hai đại đội pháp sư trên không''; phân biệt ''chúng ta'' (toàn trận
    địa) và ''Chúng tôi'' (hai đại đội pháp sư); giữ phủ định ''không thể bao quát''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô, câu hỏi & thuật ngữ: ''Major Weiss'' -> ''Thiếu
    tá Weiss''; Tanya xưng ''tôi'' / ''Tôi của ngày xưa'' (''past me'') và gọi Weiss
    là ''anh''; ''exercise grounds'' -> ''thao trường''; giữ hai câu hỏi chất vấn
    liên tiếp."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, phủ định & thuật ngữ: ''mind-over-matter attitude''
    -> ''thái độ duy ý chí''; độc thoại nội tâm tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; giữ phủ định so sánh ''Chẳng thể có thực tại nào kém dễ chịu
    hơn...''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & nhịp câu: giữ câu cảm thán ngắn gọn ''Đúng là một thế
    giới tàn nhẫn.''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, nhân vật & thuật ngữ: ''middle management''
    -> ''tầng lớp quản lý cấp trung''; giữ tên riêng ''Tospan'' và ''Weiss'' cùng
    dấu gạch ngang dài; độc thoại nội tâm tự quy chiếu của Tanya dùng ''mình'' theo
    DEC-P01-001."]'
