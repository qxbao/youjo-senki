task_id: vol-08-ch-05-b04
baseline_sha256: ed669dbbe5c74c80c17971b53a1e6141d78f1a4f3641108d2de19dff47bbb30c
source_sha256: b5e55889614fa6fbd3f59c099ac5b761978d880d2feea29cd7355a432a65d2a4
source_package_sha256: 0a39c1a8e83fcf42e8b9941e5689b0f1a35411e2858cb7c1cc7b243fd8452caf
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 38
segment_id_start: YS-LN08/Text/chapter018.xhtml/p000098
segment_id_end: YS-LN08/Text/chapter018.xhtml/p000135
choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=[''Nhân danh và đại từ trần thuật: Grantz (anh), người tài xế (anh
    ta), Zettour.'', "Khẩu lệnh khẩn cấp của Grantz: ''Tìm chỗ nấp mau! Tìm chỗ nấp
    mau!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000099
  kind: terminology_and_voice
  value: choices=['Thoại cảm thán của Zettour tự trào về tuổi tác và thị lực, không
    thêm đại từ dư thừa.']
- segment_id: YS-LN08/Text/chapter018.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*...*'' đúng phạm vi câu độc thoại nội
    tâm đầu đoạn theo DEC-P01-002.", "Điểm nhìn và đại từ: tự quy chiếu ''mình'' trong
    nội tâm Zettour, ''ông'' trong trần thuật ngôi thứ ba."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*...*'' toàn bộ đoạn độc thoại nội tâm
    theo nguồn.", "Đại từ nội tâm: Zettour tự xưng ''mình''; giữ thuật ngữ ''hậu phương''
    (the rear)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ ma pháp phòng ngự: phân biệt ''lớp vỏ phòng thủ'' (shells)
    và ''màn chắn bảo hộ'' (protective films).", "Giữ cấu trúc phủ định và mệnh lệnh
    trong chỉ dẫn tác chiến: ''Đừng đỡ đạn trực diện—hãy dùng màn chắn bảo hộ để làm
    chệch hướng chúng!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''những quả cầu'' (orbs); đại từ trần thuật ''anh''
    cho Grantz."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Thán từ biểu thị phản ứng bất ngờ: ''…Hự?!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Tên gọi và đại từ: ''Thượng đế'' (God), ''ông'' (Zettour).", "Tình
    thái suy đoán quá khứ: ''hẳn quỹ đạo của nó đã bị làm lệch đi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''hỏa lực bắn thẳng ở cự ly gần'' (point-blank fire
    at this range)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*...*'' toàn bộ đoạn độc thoại nội tâm
    của Zettour.", "Đại từ và nhân danh trong nội tâm Zettour: tự xưng ''mình'', gọi
    ''Degurechaff'' và quy chiếu bằng ''cô ấy''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại của Zettour: ''Trung úy'' (Lieutenant)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Grantz với Zettour: xưng ''tôi'', gọi ''ngài'' và
    ''thưa Tướng quân''; giữ thuật ngữ ''tuyến sau'' (the rear)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Zettour với Grantz: xưng ''ta'', gọi ''Trung úy Grantz''
    và ''cậu''; giữ câu hỏi đuôi ''phải không?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại kính trọng khẩn thiết của Grantz với cấp trên: ''đấy
    ạ!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và đại từ: Zettour xưng ''ta / mình'' trong thoại, trần
    thuật dùng ''Zettour / ông''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''xe tăng Đế quốc'' (imperial tanks), ''các lính tăng''
    (tankmen), ''pháo chính'' (main guns), ''bắn trúng đích trực diện'' (scoring direct
    hits)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Giữ nhịp câu ngắn chuyển ý: ''Nhưng chỉ có một vấn đề.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Thoại bàng hoàng của Zettour trước việc đạn bị bật nảy: ''…Chúng
    làm bật nảy các phát đạn ư? Không thể tin nổi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và phủ định: ''tầm bắn hiệu quả'' (effective range),
    ''chẳng hề phát huy tác dụng'' (wasn''t effective), ''không chút hề hấn'' (unharmed)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và quan hệ điều kiện: ''xích xe tăng'' (tanks'' treads),
    ''hỏa lực tập trung'' (focus fire); giữ điều kiện giới hạn ''chỉ có thể đạt được
    khi tập trung hỏa lực áp đảo vào những mục tiêu đã đứng im bất động''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và nhận định: ''lớp giáp của quân địch'' (enemy armor),
    ''pháo của Đế quốc chẳng khác nào đồ vô dụng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''Ông'' (Zettour); giữ đối lập giữa đọc báo
    cáo và tận mắt chứng kiến."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''ông'' (Zettour); thuật ngữ ''pháo chính của
    xe tăng Đế quốc'' (main guns of imperial tanks)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Zettour với Grantz: gọi ''Trung úy Grantz'', đại từ
    ngôi thứ hai ''cậu / các cậu''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và đại từ: Grantz xưng ''Chúng tôi'' trong thoại, trần
    thuật dùng ''Grantz / anh''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*cảm giác*'' tương ứng với từ nhấn
    mạnh cuối câu trong nguồn.", "Đại từ trong thoại của Zettour: xưng ''ta''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và thông số pháo: ''pháo 50–70 mm'', ''cỡ 37 mm'', ''pháo
    chính cho xe tăng'' (a tank''s main gun)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*...*'' toàn bộ câu hỏi cảm thán nội
    tâm theo nguồn."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Thông số và tình thái: ''cỡ 80 mm, 100 mm, hoặc thậm chí lớn hơn
    nữa làm tiêu chuẩn mới!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ví von của Zettour: ''Vậy là giờ xe tăng đang tiến hóa
    như khủng long sao?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ binh chủng và quân hàm: ''bộ binh, kỵ binh, cộng thêm
    pháo binh và số lượng ít ỏi pháp sư'', ''Tướng von Zettour'', ''trung úy'' (first
    lieutenant)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn của Zettour: ''Mọi thứ đã thay đổi rồi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''chiến tranh thống kê'' (Statistical warfare), ''cỗ
    máy chiến tranh'' (machinery of war)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ và thuật ngữ: ''trước chiến tranh, Zettour hẳn
    sẽ bật cười bỏ qua vì cho rằng nó chỉ bước ra từ một cuốn tiểu thuyết khoa học
    viễn tưởng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trong báo cáo: ''đơn vị xe tăng của Liên bang'' (unit
    of Federation tanks)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Quân dự bị của Liên bang'' (Federation reserves)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Chỉ hướng tác chiến: ''Ở cả hướng mười một giờ nữa! Xe tăng địch!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và phủ định: ''Lục quân Đế quốc'' (Imperial Army); giữ
    nguyên các phủ định ''chẳng mấy khả quan'', ''Chẳng có dấu hiệu nào cho thấy chúng
    sẽ sớm bị quét sạch''."]'
