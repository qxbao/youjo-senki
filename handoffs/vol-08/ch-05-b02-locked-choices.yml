segment_id_end: YS-LN08/Text/chapter018.xhtml/p000054
choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: trong lời lẩm bẩm của Zettour quy
    chiếu Cramm bằng ''Ông ấy''; ''division commanders'' -> ''tư lệnh sư đoàn''; giữ
    sắc thái trách móc ngầm ''nuốt ngược lời phàn nàn rằng đáng lẽ mọi tư lệnh sư
    đoàn đều phải như thế''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Tình thái & câu hỏi tu từ: ''eastern front'' -> ''mặt trận phía
    đông''; giữ tình thái phỏng đoán ''có lẽ'' và câu hỏi tu từ cuối đoạn ''Thế nhưng
    có mấy ai biết rằng điều đó thực ra lại là của hiếm?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc chêm, phủ định & thuật ngữ: ''Imperial Army'' -> ''Lục
    quân Đế quốc''; giữ mệnh đề chêm phủ định ''—dẫu chẳng thể làm gì khác được—''
    và phủ định năng lực ''không sao bù đắp nổi lượng nhân sự đã tổn thất kể từ khi
    cuộc chiến nổ ra''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi, giả định quá khứ & thành ngữ: giữ câu hỏi mở đầu ''Nhân
    sự cấp sư đoàn ư?''; ''B Group staffers'' -> ''các sĩ quan tham mưu Cụm B''; giữ
    giả định trách nhiệm quá khứ ''đáng lý họ phải được luân chuyển từ lâu'', phủ
    định ''chẳng thể tìm đâu ra người để thay thế'' và thành ngữ ''vét đến tận đáy
    thùng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: điểm nhìn Zettour (''tận mắt chứng kiến'');
    ''armored division'' -> ''sư đoàn thiết giáp''; ''a rare silver lining'' -> ''một
    điểm sáng hiếm hoi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại độc thoại: giữ câu nhận xét ngắn gọn, tiết chế của
    Zettour ''Tình hình quả là có hơi gay go.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & thuật ngữ: giữ cấu trúc điều kiện ''Chừng
    nào họ còn phải bảo vệ… thì… vẫn là yếu tố tối cần thiết''; ''the east'' -> ''miền
    đông''; ''aggressive officers'' -> ''những sĩ quan xuất sắc, giàu tính chủ động
    tấn công''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định tăng tiến: dùng đại từ bao gộp ''chúng ta'';
    giữ nhịp phủ định nhấn mạnh ''Nhưng chúng ta lại không có đủ… Chúng ta còn lâu
    mới có đủ sĩ quan.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhượng bộ: ''forward-most line on the eastern front''
    -> ''tuyến đầu tiên trên mặt trận phía đông''; giữ cặp nhượng bộ ''dù muốn hay
    không''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu ngắt nhịp: ''field officers like Degurechaff''
    -> ''những sĩ quan chiến trường như Degurechaff''; ''armored division commanders
    like Cramm'' -> ''những tư lệnh sư đoàn thiết giáp như Cramm''; ''front lines''
    -> ''tiền tuyến''; giữ dấu ba chấm ngắt nhịp trước ''những ngoại lệ cực kỳ hiếm
    hoi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Phủ định, nhượng bộ & tình thái: giữ chuỗi phủ định ''Chẳng còn
    lựa chọn nào khác ngoài việc…'', ''không thể một sớm một chiều mà tạo ra ngay
    được'', mệnh đề nhượng bộ - phủ định ''Ngay cả khi muốn rút người từ hàng ngũ
    hạ sĩ quan lên, thì bản thân nguồn hạ sĩ quan cũng đâu thoát khỏi cảnh tiêu hao
    và thiếu hụt nhân lực'' và tình thái phỏng đoán ''có lẽ sẽ phải mất cả một thế
    hệ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quan hệ thời gian: giữ tâm trạng lưỡng lự của Zettour
    ''chẳng biết nên cảm thấy chán ghét hay u uất nữa'' và mệnh đề thời gian trớ trêu
    ''Đế quốc chỉ nhận ra giá trị của… ngoài tiền tuyến sau khi đã đánh mất họ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Tình thái phỏng đoán: giữ hai cấp độ phỏng đoán ở đầu hai câu
    ''Có lẽ phần lớn đất nước vẫn đang sống trong ảo mộng. Biết đâu họ vẫn đinh ninh
    rằng…''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Nhân quả, thuật ngữ & ẩn dụ: ''The homeland'' -> ''bản quốc'';
    ''eastern front'' -> ''mặt trận phía đông''; giữ quan hệ nhân quả ''Chính vì vậy
    mà'' và hình ảnh chua chát ''ném binh lính xuống vùng đất cằn cỗi này làm phân
    bón''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Đại từ, giả định trái thực tế & phủ định giảm nhẹ: quy chiếu Zettour
    bằng ''ông''; giữ giả định trái thực tế ''Giá như đây là một chuyến du ngoạn ngắm
    cảnh, hẳn sẽ thật tuyệt khi…'' và cách nói giảm nhẹ phủ định ''Dù ông chẳng phải
    người nhiệt tình cổ xúy…, nhưng cảnh sắc này quả thực không tệ chút nào''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & định dạng: giữ nguyên danh từ tiếng Đức ''Heimat''
    không in nghiêng (khớp nguồn theo DEC-P01-002); ''undeveloped space'' -> ''một
    vùng không gian chưa được khai phá''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Zettour bằng ''ông''; ''borderland''
    -> ''vùng biên viễn''; giữ phủ định nhấn mạnh ''thậm chí chẳng thể coi là vùng
    biên viễn''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại lẩm bẩm: giữ dấu ba chấm mở đầu và nhận định chua
    xót ''…Đây đúng là hiện thân của một chiến tuyến cằn cỗi.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điểm nhìn: quy chiếu Zettour bằng ''ông'' (''Những lời
    trong tâm trí ông bất giác bật ra thành tiếng lẩm bẩm'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định: giữ câu lẩm bẩm ngắn gọn báo hiệu linh
    cảm bất an ''Có gì đó không ổn.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Zettour bằng ''ông''; giữ mệnh đề
    phủ định ''mà Zettour chưa sao gọi thành lời''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện & phủ định: ''Operation Andromeda'' -> ''Chiến
    dịch Andromeda''; ''war economy'' -> ''nền kinh tế thời chiến''; ''resource area''
    -> ''vùng tài nguyên''; giữ hai câu điều kiện ''Nếu Chiến dịch Andromeda thành
    công…'' và ''Nếu họ thành công…'' cùng cụm phủ định khẳng định chắc chắn ''ông
    không chút nghi ngờ rằng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Tình thái, điểm nhìn & thuật ngữ: giữ tình thái ''Có lẽ''; ''the
    rear'' -> ''hậu phương''; đại từ ngôi thứ hai phiếm chỉ dịch là ''người ta'' trong
    mệnh đề giới hạn góc nhìn ''đó là khi người ta nhìn nhận tình hình từ phía hậu
    phương''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Đối lập góc nhìn, thuật ngữ & phủ định: tạo thế đối lập rõ với
    hậu phương ở đoạn trước (''Còn đối với những người ở ngoài chiến trường''); ''offensive''
    -> ''cuộc tiến công''; ''occupied territory'' -> ''vùng lãnh thổ chiếm đóng'';
    ''forward-most line'' -> ''tuyến đầu tiên''; giữ mệnh đề phủ định đi kèm đánh
    giá gay gắt ''bất cứ ai không nhận ra đây là một nỗ lực vô nghĩa đến nhường nào
    thì hẳn đầu óc phải có vấn đề''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Phủ định nhấn mạnh: giữ cấu trúc phủ định ''Thậm chí chẳng cần
    phải động não suy luận mới nhận diện được vấn đề. Chỉ nhìn thoáng qua là đã thấy
    rõ mồn một.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện phủ định & nhân quả: ''black soil'' -> ''tầng
    đất đen''; giữ mệnh đề điều kiện phủ định ''Nhưng nếu nó không thể đơm hoa kết
    trái, thì quả thực cũng hoàn toàn vô nghĩa''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ, câu hỏi & phủ định: dùng đại từ ''chúng ta'';
    ''Council for Self-Government'' -> ''Hội đồng Tự trị''; giữ giả định ''Nếu chúng
    ta có thể nâng cao…, chắc hẳn sẽ kỳ vọng được đôi chút cải thiện…'', câu hỏi đúng
    đối tượng ''Phải chăng nút thắt nằm ở phân bón?'' và hai câu phủ định liên tiếp
    cuối đoạn ''Nhưng chúng ta không thể ngừng sản xuất thuốc súng. Tài nguyên chẳng
    đủ để phân bổ cho xuể…''."]'
