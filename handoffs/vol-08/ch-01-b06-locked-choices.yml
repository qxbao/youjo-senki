  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=Tôi - thưa Trung tá / ngài (Andrew
    nói với Drake); locked_elements=[''Quân hàm và thuật ngữ: thưa Trung tá, cuộc
