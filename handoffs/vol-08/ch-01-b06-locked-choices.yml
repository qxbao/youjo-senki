- segment_id: YS-LN08/Text/chapter004.xhtml/p000125
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); locked_elements=[''Phép
