  kind: terminology_and_voice
  value: 'speaker=Lieutenant Colonel Drake; pronouns_and_address=tôi (Drake nói với
    Andrew); locked_elements=[''Thuật ngữ: sĩ quan ma pháp hải quân đánh bộ.'', ''Lý
