choices:
- segment_id: YS-LN08/Text/chapter022.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: dịch câu hỏi ngắn của cấp dưới gọi Tanya là
    ''“Thưa Trung tá?”''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Đại từ, logic & thuật ngữ: Tanya xưng ''Tôi'', dùng ''chúng ta''
    cho đơn vị mình và ''bọn chúng'' / ''chúng'' cho quân địch; giữ quan hệ đối lập
    ''hai hành động vốn hoàn toàn loại trừ lẫn nhau'' và kết luận ''thăm dò chúng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: trần thuật ngôi thứ ba kết hợp đại từ phiếm
    chỉ ''người ta''; giữ phủ định ''không có lấy một lựa chọn tốt đẹp nào''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & sắc thái: câu cảm thán nội tâm không in nghiêng theo
    nguồn; giữ sắc thái chiêm nghiệm ''Thật tồi tệ, nhưng cuộc đời vốn dĩ phần nhiều
    là thế.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm tự quy chiếu của Tanya
    dùng ''mình'' theo DEC-P01-001; giữ nguyên ''Being X'', ''tầng lớp quản lý cấp
    trung''; không tự thêm chữ nghiêng theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: câu tự nhủ khích lệ tinh thần ''Hãy xốc
    lại tinh thần nào.''; không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: giữ nhịp câu hô hào nội tâm ''Hãy đứng
    lên chống lại sự phi lý.''; không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: dùng đại từ bao gộp ''Chúng ta'' (''Chúng
    ta sẽ giữ vững lập trường và hành động thật kiên cường.''); không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Hô hiệu & mệnh lệnh: giữ hô hiệu ''01'', đại từ ''Chúng ta'' và
    mệnh lệnh dứt khoát ''Chuẩn bị công kích!''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & điều kiện: lược đại từ ngôi thứ hai phiếm chỉ trong
    câu châm ngôn hành động ''Một khi đã làm thì phải dứt bỏ mọi do dự.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Nhân vật, quân hàm & đơn vị: giữ nguyên tên ''Tanya'' trong trần
    thuật; ''battalion'' -> ''tiểu đoàn''; ''multinational unit'' -> ''đơn vị đa quốc
    gia''; phân biệt rõ ''Trung tá Drake'' và ''Đại tá Mikel''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ định dạng viết hoa toàn bộ ''CÙNG NGÀY HÔM ĐÓ,
    LỰC LƯỢNG ĐOẠN HẬU CỦA ĐƠN VỊ ĐA QUỐC GIA''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, quân hàm & tình thái: chuyển điểm nhìn sang ''Trung
    tá Drake''; giữ tình thái ''có lẽ'' và cấu trúc đối chiếu tương đồng giữa bên
    truy kích và bên rút lui."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, độ mở câu hỏi & thuật ngữ: bảo toàn chính xác chữ nghiêng
    cho câu hỏi nội tâm ''*Quay về tay trắng liệu có ổn không?*'' theo DEC-P01-002;
    ''magic marine of the Commonwealth'' -> ''pháp sư hải quân đánh bộ của Khối Thịnh
    vượng chung''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ & phủ định: bảo toàn chính xác cụm chữ nghiêng
    ''*mùi vị của bãi nôn*'' theo DEC-P01-002; quy chiếu Drake bằng ''anh''; giữ phủ
    định ''chẳng bao giờ muốn nếm trải thêm lần nào nữa''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại bỏ lửng: Drake xưng ''tôi'', dùng ''chúng
    ta'' và giữ câu cảm thán bỏ lửng ''Thật tình, đúng là một mớ...''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & câu hỏi tu từ: quy chiếu Drake bằng ''anh'';
    giữ từ phủ định mở đầu ''Không, anh sẽ kìm lời lại'' và câu hỏi tự trách ''Sao
    anh lại có thể do dự giữa việc phản kích và tháo chạy cơ chứ?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & tổ chức: quy chiếu Drake bằng ''anh'', gọi
    ''Đại tá Mikel'' và quy chiếu Mikel bằng ''ông ấy''; ''Federation Communist Party''
    -> ''Đảng Cộng sản Liên bang''; giữ vế phủ định ''bản thân anh có về tay trắng
    cũng chẳng sao''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Giả định & độ mở câu hỏi: giữ câu hỏi giả định hai chiều ''Nếu
    đơn vị đa quốc gia rút lui tay trắng, liệu sự an toàn tính mạng của Mikel có được
    đảm bảo hay không?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, thuật ngữ & điều kiện: bảo toàn chính xác câu chữ nghiêng
    ''*Chính vì thế mà Quân đội Liên bang mới mong manh đến vậy.*'' theo DEC-P01-002;
    ''Federation officers'' -> ''sĩ quan Liên bang''; ''military logic'' -> ''tư duy
    quân sự''; ''Commonwealth soldier'' -> ''một người lính Khối Thịnh vượng chung''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giả định: trong lời lẩm bẩm tự hỏi Drake xưng
    ''mình'' (''“...Vậy mình nên làm gì đây?”''); ''organizational theory'' -> ''lý
    thuyết tổ chức''; giữ giả định trái thực tế ''Giá như vấn đề chỉ đơn thuần là
    nện cho kẻ địch trước mặt một trận nhừ tử thì mọi chuyện đã đơn giản hơn nhiều...''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ đánh giá tình thế thực tại ''về cơ
    bản họ đang bị gọng kìm siết chặt''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Mikel gọi Drake là ''ngài''; ''bring up the
    rear'' -> ''bọc hậu''; ''fighting retreat'' -> ''cuộc vừa đánh vừa rút lui''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: Drake xưng ''Tôi'', giữ phủ định kép mở đầu
    thoại ''“...Không, không phải chuyện đó.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: dịch lời gọi ''“Colonel Drake?”'' của Mikel
    là ''“Trung tá Drake?”'' cho nhất quán với cấp bậc thực của Drake."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & nhân vật: quy chiếu Drake bằng ''anh''; ''political
    officer'' -> ''sĩ quan chính trị''; ''First Lieutenant Sue'' -> ''Trung úy Sue'';
    giữ cấu trúc phủ định kép ''nhân lúc cả sĩ quan chính trị lẫn Trung úy Sue lắm
    mồm đều không có mặt ở đây, anh chẳng có thời gian để lãng phí vào những lễ nghi
    vô bổ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Nhịp điệu: giữ điệp ngữ nhấn mạnh ''Rủi ro, rủi ro, toàn là rủi
    ro.''; không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & tổ chức: giữ câu hỏi tu từ thể hiện sự bất mãn
    của Drake và định danh ''Liên bang''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, độ mở câu hỏi & phủ định: Drake xưng ''tôi'', gọi Mikel
    là ''ngài'', dùng ''chúng ta'' cho đơn vị chung; giữ trọn vẹn hai câu hỏi kèm
    phủ định ''mà không đạt được thành quả đáng kể nào không?'' và ''mà không chịu
    hình phạt nào không?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Mikel xưng ''Tôi'', gọi Drake là ''Ngài'';
    giữ hai vế phủ định ''nguyên tắc không bàn chuyện chính trị'' và ''đừng ép tôi
    tiết lộ thông tin mật''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện & phủ định: quy chiếu Mikel bằng ''ông ấy'',
    giữ câu điều kiện phủ định ''Mà một khi đã dính tới chính trị thì ông ấy sẽ chẳng
    thể thoát tội dễ dàng''; trong thoại Drake xưng ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ & thuật ngữ: giữ ẩn dụ ''một món quà lưu niệm'' (''a souvenir'')
    và cụm ''đòi hỏi tất yếu về mặt chính trị'' (''a matter of political necessity'')."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Đại từ & mức độ đánh giá: quy chiếu Drake bằng ''anh''; giữ mức
    độ nhấn mạnh ''thực sự thối nát đến mức vô phương cứu chữa ra sao''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nhân vật & thuật ngữ: Drake xưng ''Tôi'', dùng ''chúng
    ta'', gọi ''Trung úy Sue'' và quy chiếu bằng ''cô ta''; ''rear guard'' -> ''lực
    lượng đoạn hậu''; ''fellow troops'' -> ''quân bạn''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhân quả: ''imperial pincer attack'' -> ''đòn tấn
    công gọng kìm của quân Đế quốc''; giữ quan hệ thời gian - nhân quả giúp tránh
    cảnh toàn quân sụp đổ."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Đại từ & xưng hô: phân biệt rõ ''Chúng tôi'' (đơn vị của Drake)
    và ''các ngài'' (phía Mikel) trong câu ''Chúng tôi sẽ ở lại sát cánh chiến đấu
    cùng các ngài.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái: giữ chi tiết ''Lời cảm ơn pha lẫn áy náy của
    Mikel bị gió cuốn đi mất.''"]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Mikel bằng ''ông ấy''; giữ đủ ba
    cấu trúc phủ định liên tiếp (''không nghe thấy'', ''chẳng phải lời nên thốt ra
    giữa những người chiến hữu'', ''không cần lý do để đứng vững bên cạnh đồng đội
    của mình'')."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & đại từ nội tâm: bảo toàn chính xác chữ nghiêng ''*Đó
    là bằng hữu của mình.*'' theo DEC-P01-002; Drake tự quy chiếu trong nội tâm bằng
    ''mình''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & đại từ nội tâm: bảo toàn chính xác chữ nghiêng ''*Và
    đây là mình.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, điển tích & câu hỏi tu từ: bảo toàn chính xác phạm
    vi chữ nghiêng ở câu đầu ''*Vậy nên giống như Horatius, mình phải bảo vệ những
    gì mình cần bảo vệ.*'' theo DEC-P01-002; giữ nguyên hai câu sau không in nghiêng
    và câu hỏi tu từ kết đoạn ''Còn có gì phải khiếp sợ nữa chứ?''."]'
