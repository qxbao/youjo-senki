segment_id_end: YS-LN08/Text/chapter018.xhtml/p000635
choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000595
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nhấn mạnh & ẩn dụ: quy chiếu Tanya ở ngôi thứ ba bằng
    ''Cô'' / ''cô'', đại đội địch bằng ''Chúng''; bảo toàn chính xác chữ nghiêng Markdown
    ''*Chúng thậm chí còn chẳng buồn cơ động né tránh, cứ thế lao thẳng tới—đúng là
    một lũ mồi ngon liều mạng.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000596
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng mệnh lệnh: ''modern long-range fire'' -> ''hỏa
    lực tầm xa hiện đại''; ''defensive shells'' -> ''lớp vỏ phòng thủ''; dùng đại
    từ ''chúng ta'' - ''chúng'' và giữ hình ảnh ''làm lễ rửa tội cho những bậc anh
    hùng của thời đại đã qua này''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000597
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc: ''the two companies'' -> ''cả hai đại đội'';
    ''The volley'' -> ''Loạt đạn tề xạ''; ''the Federation earth'' -> ''mặt đất Liên
    bang''; giữ cụm đánh giá ''đỉnh cao của thời đại cả về lượng lẫn về chất''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000598
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & phủ định: giữ liên từ chuyển ý ''Thế nhưng''
    và phủ định mức độ ''chiến quả đạt được lại chẳng như Tanya kỳ vọng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000599
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tương phản số lượng: quy chiếu Tanya bằng ''Cô'', giữ
    sự đối lập giữa dự tính (''quét sạch phân nửa quân số của chúng'') và thực tế
    (''chỉ có lác đác vài tên bị bắn hạ'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000600
  kind: terminology_and_voice
  value: 'choices=["Tình thái & quan hệ đối lập: giữ mức tình thái suy đoán (''trông
    hẳn là'', ''đáng lý đã phải hứng trọn'', ''xem chừng'') và đối lập kết quả (''vẫn
    bình chân như vại'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000601
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc nhượng bộ & từ vựng: giữ mệnh đề nhượng bộ ''Ngay cả
    khi đã tính đến những điều kiện bắn tầm xa'' và đánh giá ''tên này vẫn dai sức
    đến mức khó tin''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000602
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & trình tự thời gian: ''defensive shells'' -> ''lớp
    vỏ phòng thủ''; ''optical sniping formula'' -> ''thuật thức bắn tỉa quang học'';
    ''enemy long-range fire'' -> ''hỏa lực tầm xa của địch''; giữ bước ngoặt thời
    gian ''ngay khoảnh khắc sắp khai hỏa''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000603
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, câu hỏi nội tâm & đại từ: giữ câu hỏi phỏng đoán mở
    đầu (''Một bộ phận của toán quân tiến lên phía sau đại đội đột kích đã dừng lại
    để bắn tỉa sao?''), chuyển từ trần thuật ngôi thứ ba (''cô'') sang độc thoại nội
    tâm ngôi thứ nhất (''Mình'') theo DEC-P01-001; làm rõ tương quan lực lượng hai
    đại đội bên mình đối đầu một tiểu đoàn đủ quân số."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000604
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý & phủ định: giữ liên từ ''Nhưng'' và nhận định
    phủ định ''những đối thủ kia sẽ không dễ dàng bỏ cuộc đến thế''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000605
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng báo cáo: ''medium-range and close-quarters combat''
    -> ''giao chiến tầm trung và cận chiến''; ''the Federation'' -> ''phía Liên bang'';
    giữ nhịp cảm thán ''nhanh đấy. Quá đỗi nhanh!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000606
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: Tanya gọi Weiss là ''Thiếu tá''
    và xưng hô ''anh'', dùng ''Chúng ta'' cho đơn vị và ''chúng'' cho địch; ''multinational
    units'' -> ''các đơn vị đa quốc gia''; ''the Federation'' -> ''quân Liên bang''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000607
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, điểm nhìn & quân hàm: bảo toàn chữ nghiêng Markdown
    ''*Xem ra mình chẳng còn lựa chọn nào khác.*'' với đại từ nội tâm ''mình'' theo
    DEC-P01-001 và DEC-P01-002; chuyển sang trần thuật ngôi thứ ba (''Tanya'', ''Cô'')
    và dịch ''First Lieutenant Serebryakov'' là ''Trung úy Serebryakov''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000608
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''the two companies'' -> ''hai đại đội'';
    ''the prominent enemy company'' -> ''đại đội địch đang nhô lên phía trước kia'';
    giữ sắc thái tán thưởng ''quả thực đẹp như mơ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000609
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & hình ảnh đối lập: ''mages of the 203rd'' -> ''Các
    pháp sư của Tiểu đoàn 203''; ''local numerical superiority'' -> ''ưu thế quân
    số cục bộ''; giữ hình ảnh đảo chiều ''từ kẻ đi săn đã hóa thành con mồi'' và phủ
    định khả năng ''không sao phát huy nổi sự dẻo dai mới chỉ vài khắc trước đó''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000610
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ sắc thái bực bội (''Thế nhưng đáng
    ghét thay''), mức độ suy đoán (''có vẻ đang chỉ huy'') và cụm ''đơn vị tách đội
    vọt lên ấy'' (''the breakaway unit'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000611
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu hỏi bực tức của Tanya ''Cái tên khốn này
    là sao thế hả?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000612
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & câu hỏi nội tâm: bảo toàn chữ nghiêng Markdown cho
    toàn bộ câu độc thoại nội tâm ''*Phải chăng phân đội này hoàn toàn phụ thuộc vào
    năng lực của một mình pháp sư đó?*'' theo DEC-P01-002; dịch ''detachment'' là
    ''phân đội''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000613
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & giọng điệu: quy chiếu Tanya bằng ''Tanya''
    / ''cô''; giữ sắc thái mỉa mai thực dụng (''Có lẽ cô nên tưởng niệm cho đám lính
    địch tội nghiệp... nhưng chuyện đó cứ để sau khi cô giữ được mạng sống và giành
    chiến thắng đã'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000614
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: quy chiếu Tanya bằng ''cô''; dịch ''approaching
    follow-up battalion'' là ''tiểu đoàn tiếp ứng đang tiến tới của địch''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000615
  kind: terminology_and_voice
  value: 'choices=["Mã hiệu vô tuyến & thuật ngữ: giữ ''02 gọi 01, tình hình khẩn
    cấp!'' và ''Quân đội Liên bang'' (''Federation Army'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000616
  kind: terminology_and_voice
  value: 'choices=["Chức danh, thuật ngữ & dấu câu: ''her vice commander'' -> ''người
    phó chỉ huy của cô''; ''The Commies'' -> ''đám Cộng sản''; giữ chỗ ngắt câu cảm
    thán ''Chuyện quái gì thế này—!'' và chuỗi câu hỏi sững sờ."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000617
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ nội tâm: ''numerical inferiority'' -> ''mức
    độ thua kém về quân số''; tự quy chiếu Tanya trong nội tâm bằng ''mình'' theo
    DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000618
  kind: terminology_and_voice
  value: 'choices=["Địa danh & đại từ: giữ nguyên ''Soldim 528'' và đại từ ''Chúng''
    quy chiếu quân Liên bang."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000619
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định mỉa mai: quy chiếu Tanya bằng ''Tanya'' / ''cô'';
    giữ cách nói phủ định châm biếm ''đám pháp sư địch cũng chẳng lịch thiệp đến mức
    để mặc cho cô thong thả suy tính''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000620
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại: Serebryakov xưng ''tôi'' / ''Tôi'' và gọi pháp
    sư địch là ''chúng'' khi xung phong nhận nhiệm vụ."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000621
  kind: terminology_and_voice
  value: 'choices=["Giọng mệnh lệnh: giữ lời chấp thuận ngắn gọn dứt khoát của Tanya
    ''Được. Giải quyết nhanh gọn đi!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000622
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & tên nhân vật: giữ quan hệ nhân quả (''Serebryakov...
    đã lao vút đi phản kích để câu thêm chút thời gian, nên Tanya tận dụng khoảng
    trống này để đánh giá lại tình hình'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000623
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''the Federation troops'' ->
    ''quân Liên bang''; ''computation orb'' -> ''quả cầu tính toán''; giữ mức độ dè
    dặt trong suy đoán (''Chủ quan khinh địch thì rất nguy hiểm, nhưng có lẽ hoàn
    toàn có cơ sở để cho rằng...'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000624
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: giữ đại từ tự xưng ''mình'' theo DEC-P01-001 trong
    câu độc thoại nội tâm của Tanya."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000625
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & giả định: ''Commonwealth-Federation composite
    unit'' -> ''đơn vị hỗn hợp Khối Thịnh vượng chung – Liên bang''; ''main forces''
    -> ''lực lượng chủ lực''; dùng đại từ ''chúng tôi'' chỉ đơn vị mình và giữ kết
    luận giả định ''hùa theo ý đồ của chúng mà quay lại phản kích sẽ là đỉnh cao của
    sự ngu xuẩn''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000626
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: dùng ''chúng tôi'' nhất quán với p000625 và
    giữ mức tình thái cân nhắc ''Có lẽ chúng tôi nên rút lui thôi.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000627
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & mệnh lệnh: ''Major Weiss'' -> ''Thiếu tá
    Weiss''; ''the John Bulls and the Commies'' -> ''cả đám John Bull lẫn đám Cộng
    sản''; dùng ''chúng ta'' trong mệnh lệnh rút quân."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000628
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại: giữ câu phản bác lo lắng của Weiss với cặp đại từ
    ''chúng'' - ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000629
  kind: terminology_and_voice
  value: 'choices=["So sánh & thuật ngữ: dịch ''getting bogged down in a melee'' là
    ''bị sa lầy trong một cuộc hỗn chiến''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000630
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & giọng thoại: giữ dấu chấm lửng ngập ngừng trước khi
    tuân lệnh ''…Đã rõ!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000631
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & chức danh: quy chiếu Weiss bằng ''anh ta''
    / ''anh''; giữ sự chuyển dịch điểm nhìn đặc trưng trong cùng một câu từ ngôi thứ
    nhất nội tâm (''Mình'') sang ngôi thứ ba (''Tanya'', ''cô''); dịch ''her adjutant''
    là ''viên sĩ quan phụ tá của cô''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000632
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ thán từ ngạc nhiên ''Hửm?'' khi Tanya nhận ra
    sự bất thường."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000633
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi: phân biệt rõ ''cô'' - ''mình'' (Tanya)
    với ''Serebryakov'' - ''cô ấy''; dịch ''intercept'' là ''đánh chặn''; giữ dấu
    chấm lửng và câu hỏi bất an ở cuối đoạn (''có điều… sao cô ấy vẫn chưa quay lại?'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000634
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & sắc thái: Tanya gọi ''Trung úy Serebryakov''
    và xưng hô ''Cô''; giữ câu hỏi nửa đùa nửa thăm dò ''Cô vẫn đang mải dạo chơi
    ngoài đó sao?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000635
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: giữ câu kết đoạn ''Tanya gọi cô ấy qua vô tuyến,
    nhưng chẳng có tiếng trả lời.''."]'
