choices:
- segment_id: YS-LN08/Text/chapter006.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Zettour tự xưng ''Tôi'', gọi Rudersdorf
    là ''ông''; ''Service Corps'' -> ''Cục Quân vụ''; ''combat theater'' -> ''chiến
    trường''; giữ chuỗi phủ định ''không thể để ông nhìn vào... rồi hiểu lầm được'',
    ''vốn không sinh ra để giải quyết các vấn đề chính trị'', ''Bản thân họ không
    tự suy nghĩ'' và mệnh đề giới hạn ''đừng kỳ vọng bất cứ điều gì ở họ ngoài những
    tuyến đường sắt dẫn ra chiến trường''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu hỏi ngắn gọn ''“Nói cách khác là sao?”''
    của Rudersdorf."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Zettour tự xưng ''tôi'', gọi Rudersdorf là
    ''ông'', quy chiếu Cục Quân vụ bằng ''họ''; giữ phạm vi phủ định ''bất kỳ bên
    nào ngoài quân đội''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ nhận định khái quát ''Những khiếm khuyết trong bất
    kỳ tổ chức nào cũng đều phải do con người khắc phục.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & tình thái: giữ sự đối lập giữa lý thuyết và
    thực tế (''chẳng khác gì việc chỉ tạm gác lại vấn đề bằng một giải pháp chắp vá
    tức thời''), cùng cặp đối chiếu mức độ diễn đạt ''nói giảm nói tránh là ứng biến
    theo tình huống'' (''ad hoc'') và ''nói thẳng toẹt ra... mang tính chắp vá tùy
    tiện'' (''haphazard'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & dấu câu: quy chiếu ''Zettour'' bằng ''mình'';
    giữ dấu chấm lửng giữa câu; ''staff officer in the Service Corps'' -> ''sĩ quan
    tham mưu thuộc Cục Quân vụ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & đối lập: ''administrator of supply and
    matériel'' -> ''nhà quản lý phụ trách hậu cần tiếp vận cùng vật tư và trang bị
    quân sự''; ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ tình thái ''cứ như thể''
    và sự đối lập ''một vũ trụ tương đồng nhưng lại tách biệt rõ rệt''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu điều kiện: Rudersdorf tự xưng ''Tôi''
    / ''tôi'', gọi Zettour là ''ông'', dùng ''chúng ta'' cho ''we''; giữ sự đối lập
    danh xưng ''nhà hành chính Zettour'' và ''một người của Cục Tác chiến là Zettour'';
    ''secondary fronts'' -> ''các mặt trận thứ yếu''; giữ hai dấu chấm lửng và cấu
    trúc điều kiện ''nếu... thì...''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: Zettour tự xưng ''tôi'' / ''mình''; giữ tình
    thái giả định ''Nhưng biết đâu... thì sao''; ''cushy position'' -> ''chức vụ nhàn
    hạ''; ''academic'' -> ''học giả''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định kép & thuật ngữ: Rudersdorf tự xưng ''tôi'',
    gọi Zettour là ''ông'', trần thuật quy chiếu Zettour bằng ''ông''; giữ phủ định
    kép ''Đâu phải tôi không biết ông là kiểu sĩ quan Cục Tác chiến như thế nào''
    và phủ định ''chẳng tưởng tượng nổi chuyện ông quên mất cách mọi thứ vận hành''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Zettour gọi Rudersdorf là ''ông'', tự xưng
    ''tôi''; giữ giọng điệu phàn nàn tự nhiên."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, xưng hô, thuật ngữ & phủ định: Rudersdorf gọi ''Tướng
    von Zettour'', xưng ''Tôi'' – ''ông''; ''staff officer'' -> ''sĩ quan tham mưu'';
    giữ phủ định nhấn mạnh ''Tôi không đời nào để ông thoát thân... đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện & dấu câu: Zettour tự xưng ''tôi'' / ''mình'',
    gọi Rudersdorf là ''ông''; giữ câu điều kiện ''Nếu ông muốn tôi làm việc, ít ra
    ông cũng có thể cho tôi một chút xíu thẩm quyền...'' và dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & đối lập: quy chiếu Zettour bằng ''Ông'' /
    ''ông'', quy chiếu Rudersdorf bằng ''mình''; ''nominal rank and nominal position''
    -> ''một quân hàm hữu danh vô thực và một chức vụ hữu danh vô thực''; ''B Front''
    -> ''Mặt trận B''; giữ sự đối lập giữa ý đồ của cấp trên và toan tính thực tế
    của Rudersdorf."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Câu điều kiện & đại từ: quy chiếu Zettour bằng ''ông''; giữ điều
    kiện ''nếu thẩm quyền cần thiết để giải quyết công việc không được phân định rõ
    ràng, công việc của ông sẽ bị bủa vây bởi vô vàn khó khăn''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Rudersdorf gọi ''Zettour'' là ''ông''; giữ
    phủ định ''Nghe chẳng giống kiểu than vãn thường ngày của ông chút nào''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Đại từ, câu hỏi, thuật ngữ & dấu nháy đơn: Zettour tự xưng ''tôi'',
    dùng ''Chúng ta'' cho ''We''; ''B Front'' -> ''Mặt trận B''; giữ câu hỏi ''Sao
    chỉ có mình tôi là phải chịu khổ thôi?'' và dấu nháy đơn mỉa mai quanh ''‘yêu
    cầu’''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giả định trái thực tế: Rudersdorf tự xưng ''tôi'', gọi
    Zettour là ''ông''; giữ câu điều kiện giả định ''Nếu mọi chuyện được theo ý tôi,
    thì cứ giao phó toàn bộ khâu hậu cần cho ông đã giúp tôi nhẹ nợ hơn nhiều rồi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đại từ & nhấn mạnh: giữ dấu chấm lửng mở đầu; Zettour
    tự xưng ''Tôi'' / ''tôi'', trần thuật quy chiếu Zettour bằng ''Ông'' / ''ông'';
    giữ chính xác phạm vi in nghiêng ''*Vậy là đằng nào tôi cũng phải chịu khổ cả*''
    theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Phủ định & quan hệ nhân quả: giữ cấu trúc ''mải mê trò chuyện
    đến mức chẳng ai nhận ra đã đến giờ phải đi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ nguyên ''“Này, tàu đến rồi kìa. Nhìn xem, Zettour.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Thoại & tình thái: giữ nguyên ''“Ừ, có vẻ vậy.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tình thái suy đoán ''Hẳn phải có'';
    ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ chi tiết lớp sơn rẻ tiền màu sắc ảm đạm nhằm tạo hiệu
    quả ngụy trang khó bị phát hiện từ trên bầu trời.'']'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhượng bộ: quy chiếu ''Zettour'' bằng ''mình''
    / ''ông''; giữ mệnh đề nhượng bộ ''Cho dù Rudersdorf có tô vẽ thế nào đi chăng
    nữa, ông vẫn cảm thấy bất an''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quan hệ nhượng bộ, thuật ngữ & dấu câu: quy chiếu Zettour
    bằng ''mình'' / ''ông''; giữ mệnh đề nhượng bộ ''dù tự biết việc nhắc đi nhắc
    lại thế này vốn chẳng giống tính cách của mình''; ''Andromeda'' -> ''chiến dịch
    Andromeda''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái bắt buộc: quy chiếu Zettour bằng ''Ông''; giữ
    ''Ông buộc phải nói ra điều đó.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ đối lập: quy chiếu Zettour bằng ''Ông'' / ''mình'';
    giữ vế đối lập phủ định ''nhưng rốt cuộc cũng chẳng đi đến đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định, giới hạn & dấu câu: Zettour dùng ''Chúng ta''
    / ''chúng ta''; giữ phủ định ''Không có đủ ngựa'', mức độ giới hạn ''sẽ chỉ vừa
    đủ khả năng sẵn sàng bằng cách dồn ép toàn bộ qua đường sắt'', dấu chấm lửng và
    độ bất định ''trữ lượng nhiên liệu có trụ vững nổi hay không thì vẫn còn bỏ ngỏ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thoại: giữ nguyên ''“…Ừ.”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Câu điều kiện & phủ định: giữ cấu trúc ''Nếu Rudersdorf đã nắm
    trọn những điểm chính và thấu hiểu các vấn đề nhức nhối nhất, thì chẳng còn gì
    khác để Zettour có thể bổ sung một cách có ý nghĩa nữa''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & tình thái: Rudersdorf tự xưng ''Tôi'', gọi
    Zettour là ''ông''; ''A Group'' -> ''Cụm A''; ''B'' -> ''Cụm B''; trần thuật quy
    chiếu Rudersdorf bằng ''mình'' / ''ông''; giữ tình thái suy đoán ''Hẳn cử chỉ
    đó có nghĩa là''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Zettour tự xưng ''Tôi'', gọi Rudersdorf là ''ông''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: Rudersdorf dùng ''chúng ta'' cho ''we'' / ''us'';
    ''inseparable former classmates'' -> ''đôi bạn đồng môn không thể tách rời''."]'
