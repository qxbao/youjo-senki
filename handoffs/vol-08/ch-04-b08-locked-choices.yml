choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000255
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, điểm nhìn, phủ định & dấu câu: ''Lieutenant Wüstemann''
    -> ''Trung úy Wüstemann''; trần thuật ngôi thứ ba dùng ''Cô'' và ''anh ta''; giữ
    dấu gạch ngang dài và chuỗi phủ định nhắc nhở (''không cần bắt tù binh về để tra
    hỏi đâu'', ''Cũng chẳng cần giết chúng làm gì'', ''đừng có lại gần quá mà ăn đạn
    đấy'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000256
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & liên kết từ vựng: dịch nhận xét của Wüstemann là
    ''“…Làm vậy coi sao đặng ạ.”'' để tạo tiền đề bắt chữ tự nhiên cho câu đáp ở p000257."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000257
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô, liên kết từ vựng & dấu câu: giữ lối bắt chữ
    ''một cuộc chiến coi cho đặng ư?''; trần thuật dùng ''Cô'' và ''anh ta''; trong
    thoại Tanya gọi Wüstemann là ''Anh'' / ''anh'', tự xưng ''tôi''; giữ dấu gạch
    ngang dài và ẩn dụ ''nốc vài ngụm rượu lấy dũng khí''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000258
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái, quân hàm & xưng hô: trần thuật dùng ''Anh
    ta'', giữ tình thái phỏng đoán ''có lẽ''; trong thoại Wüstemann gọi Tanya là ''Trung
    tá'' kèm kính ngữ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: độc thoại nội tâm ngôi thứ nhất
    của Tanya tự quy chiếu bằng ''mình'' theo DEC-P01-001, quy chiếu Wüstemann bằng
    ''anh ta'' và chuyển sang câu hỏi trực diện ''Anh chưa từng nghe tới phép ẩn dụ
    bao giờ à?''; giữ phủ định ''không thể để''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô, điều kiện & phủ định: trần thuật dùng ''cô'';
    trong thoại Tanya tự xưng ''tôi'' / ''chúng ta'', gọi Wüstemann là ''anh''; giữ
    câu điều kiện giả định (''Nếu nhìn tôi mà anh thấy giống người lớn...''), phủ
    định (''đâu phải là'') và tình thái (''Có vẻ như'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: ''ma’am'' -> ''thưa Trung tá''; Wüstemann
    tự xưng ''tôi'' / ''mình'', gọi Tanya là ''ngài'', giữ phủ định dè dặt ''không
    chắc là mình hiểu kịp ý ngài ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000262
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu đáp ngắn gọn, dứt khoát ''“Đơn giản hết sức
    thôi.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tên đơn vị: độc thoại nội tâm tự quy chiếu
    bằng ''của mình'' theo DEC-P01-001; giữ tên riêng ''Weiss'' và ''Kampfgruppe Salamander''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000264
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: câu nhận định nội tâm dùng ''chúng ta'' và
    giữ quan hệ tương phản ''Nhưng thực tế là...''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000265
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nhân quả: giữ sự pha trộn điểm nhìn của nguyên tác
    giữa ''chúng ta'' và tên riêng ''Tanya'' (''nhân tính của mình''); giữ cấu trúc
    nhấn mạnh nguyên nhân ''Chính vì... nên...''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000266
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi tu từ: dùng ''Chúng ta'' / ''chúng
    ta''; ''HQ'' -> ''sở chỉ huy''; giữ chuỗi mệnh đề lý do (''vì...'', ''Vì...'')
    và câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000267
  kind: terminology_and_voice
  value: 'choices=["Phủ định & dấu câu: giữ câu phản bác bỏ lửng ''“Nhưng điều đó
    không có nghĩa là…”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000268
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, điểm nhìn, quân hàm & nhân quả: giữ dấu gạch ngang dài
    nối lời ở đầu câu thoại và giữa câu; trần thuật dùng ''Tanya'' và ''anh ta'';
    trong thoại gọi ''Trung úy'', tự xưng ''Tôi'' / ''chúng ta''; giữ chuỗi lập luận
    nhân quả lặp cấu trúc (''Lý do... là vì..., và lý do... là vì...'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000269
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & xưng hô: giữ dấu chấm lửng và nhịp ngập ngừng lặp từ
    ''quân đội… quân đội''; dịch ''you'' là ''Trung tá'' kèm kính ngữ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000270
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & giọng thoại: ''Lieutenant Wüstemann'' ->
    ''Trung úy Wüstemann''; ''front lines'' -> ''tiền tuyến''; giữ câu hỏi mỉa mai
    của Tanya."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000271
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & xưng hô: giữ đúng cấu trúc phủ định kép ''Tôi không
    thể nói là mình không yêu đất nước của mình được ạ…''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000272
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật & tình thái: trần thuật ngôi thứ ba dùng ''Tanya'',
    ''cô'', ''Wüstemann'' (''anh ta'') và ''Tospan''; giữ các sắc thái tình thái ''có
    thể có chút năng khiếu'' và ''có khi lại đáng mến hơn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, quân hàm & thuật ngữ: trần thuật dùng ''Cô'', ''Tospan''
    và ''anh ta''; trong thoại gọi ''Trung úy Tospan'', tự xưng ''tôi''; ''infantry''
    -> ''bên bộ binh''; ''Federation Army'' -> ''Quân đội Liên bang''; giữ cách nói
    ẩn dụ ''món quà lưu niệm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000274
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: giữ câu hỏi xác nhận ngắn và khẩu lệnh
    đáp ''Tuân lệnh ngay, thưa Trung tá.'' (''ma’am'' -> ''thưa Trung tá'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhịp câu & thuật ngữ: giữ hai câu danh ngữ ngắn mở
    đầu (''Một câu trả lời ngay lập tức. Không chút do dự.''); trần thuật dùng ''Tanya''
    và ''cô''; ''human capital'' -> ''vốn con người'' theo P03-human-capital."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, điểm nhìn & đại từ: trong thoại gọi ''Trung úy Wüstemann'';
    trần thuật dùng ''cô'', ''Tospan'' và ''anh ta''; giữ chi tiết chỉ dẫn giới hạn
    cự ly và rà soát quy trình ứng phó phản kích."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc hệ quả: ''Imperial Army'' -> ''Lục quân Đế
    quốc''; giữ cấu trúc mức độ – hệ quả ''được chuẩn hóa cao độ... đến mức chỉ cần...
    là đủ, ngay cả với những người thuộc kiểu như Tospan''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & phủ định: trần thuật dùng ''Tanya'' và
    ''cô''; giữ tình thái ''Có lẽ Tanya nên...'' và phủ định ''Dù cô chẳng thực sự
    muốn nghĩ tới...''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & điều kiện: Tospan gọi ''thưa Trung tá'',
    tự xưng ''Tôi'' / ''chúng ta''; ''outer perimeter'' -> ''vành đai phòng ngự vòng
    ngoài''; giữ hai cấu trúc điều kiện (''Nếu chúng ta đã cử...'', ''Nếu làm ngay
    bây giờ thì...'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000280
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba dùng ''cô'' và ''anh
    ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000281
  kind: terminology_and_voice
  value: 'choices=["Chữ nghiêng & điểm nhìn: bảo toàn chính xác nhấn mạnh Markdown
    ''*Một lời đề xuất ư? Từ Tospan sao?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000282
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ dấu chấm lửng mở đầu và câu hỏi xác nhận
    ''“…Anh muốn tiến lên ư?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000283
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & mức độ: ''Yes, Colonel'' -> ''Vâng, thưa Trung tá'';
    giữ giới hạn mức độ ''chỉ có thể kháng cự ở mức độ hạn chế mà thôi ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000284
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ, điều kiện & phủ định: giữ sự chuyển dịch
    đại từ từ ''chúng ta'' ở vế giả định chiến thuật sang tên riêng ''Tanya'' ở câu
    tương phản; ''forward position'' -> ''vị trí tiền tiêu''; ''delaying battle''
    -> ''trận đánh trì hoãn''; giữ dấu hai chấm và phủ định ''không thể chấp nhận''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000285
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, thuật ngữ & phủ định: giữ dấu chấm lửng ở ''“…Bác bỏ.”'';
    ''matériel'' -> ''vật tư và trang bị quân sự''; giữ phủ định ''chúng ta không
    có'' và cách nói giảm ''đi ra ngoài vay mượn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000286
  kind: terminology_and_voice
  value: 'choices=[''Giọng thoại & dấu câu: giữ dấu chấm lửng và giọng cảm thán của
    Tospan.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000287
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Tanya gọi ''Trung úy Tospan'', tự xưng ''Tôi''
    và gọi cấp dưới là ''anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000288
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & cấu trúc đối xứng: giữ cấu trúc đối lập nghịch lý
    (''lúc chúng ta có người thì lại thiếu đồ tiếp tế, còn lúc có đồ tiếp tế thì lại
    thiếu người'') và câu trần thuật ngôi thứ ba (''Tanya'', ''cấp dưới của mình'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000289
  kind: terminology_and_voice
  value: 'choices=["Quân hàm số nhiều, thuật ngữ & giọng thoại: ''Lieutenants'' ->
    ''Hai Trung úy''; ''rolling stock for freight'' -> ''đầu máy và toa xe chở hàng'';
    ''Federation Army'' -> ''Quân đội Liên bang''; giữ lối nói đùa ''quẹt thẻ ghi
    nợ cũng được''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000290
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, quân hàm & điểm nhìn: giữ dấu chấm lửng mở đầu, cách
    gọi ''thưa Trung tá?'' và câu trần thuật ''Tospan ngơ ngác khó hiểu.''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000291
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô & dấu câu: trần thuật dùng ''Tanya'' và ''anh
    ta''; trong thoại tự xưng ''Tôi'' / ''tôi'', giữ dấu gạch ngang dài."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000292
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật, giả định trái thực tế & dấu câu: trần thuật
    dùng ''cô'' và các tên riêng ''Serebryakov'', ''Tospan'', ''Wüstemann''; giữ cấu
    trúc giả định trái thực tế (''Giá như cô đang nói chuyện với... thì cô còn có
    thể trông đợi...''), dấu chấm lửng và vế đối lập (''nhưng đòi hỏi điều đó... thì
    quả là quá sức'')."]'
