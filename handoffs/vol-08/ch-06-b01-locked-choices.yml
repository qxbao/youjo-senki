choices:
- segment_id: YS-LN08/Text/chapter022.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ định dạng viết hoa toàn bộ ''NGÀY 18 THÁNG 6
    NĂM THỐNG NHẤT 1927, NỬA ĐÊM''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điểm nhìn: trần thuật ngôi thứ ba; ''Federation Army
    units'' -> ''Các đơn vị Quân đội Liên bang''; ''charging imperial armored units''
    -> ''những đơn vị thiết giáp Đế quốc đang xung phong''; ''according to regulations''
    -> ''theo đúng điều lệnh''; ''reserve forces'' -> ''Lực lượng dự bị''; ''rapid-response
    duty'' -> ''nhiệm vụ phản ứng nhanh''; ''imperial rescue units'' -> ''các đơn
    vị giải cứu của Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & phủ định bộ phận: ''Lieutenant General von
    Zettour'' -> ''Trung tướng von Zettour''; ''numerical superiority'' -> ''ưu thế
    quân số''; giữ phủ định bộ phận ''không hẳn đã nắm được ưu thế đó'' (''didn’t
    necessarily have it'') và quan hệ bù trừ ở câu sau."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & phủ định: ''fog of war'' -> ''sương mù chiến
    tranh''; giữ phủ định ''không một chút trục trặc'' (''without a hitch''), ẩn dụ
    ''con cưng mà họ cất kỹ trong túi'' và phần giải thích trong dấu gạch ngang dài
    ''—một sư đoàn thiết giáp đủ biên chế—''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Tổ chức & sắc thái nhượng bộ: ''Imperial Army General Staff''
    -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; giữ cấu trúc nhấn mạnh ''Ngay cả...
    cũng buộc phải công nhận''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''political officers'' -> ''các
    sĩ quan chính trị''; ''military logic'' -> ''tư duy quân sự''; ''frontal attack''
    -> ''đòn tấn công trực diện''; giữ tình thái ''Có lẽ'' và cấu trúc phủ định so
    sánh ''chẳng có gì vững chắc hơn''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ & tình thái: giữ đúng giả định trái thực tế ở
    quá khứ cùng độ chắc chắn phân tầng ''Nếu đơn vị tiếp viện của Đế quốc mà non
    gan, hẳn Liên bang đã nắm chắc phần thắng. Đợt phản kích tiến lên của họ hẳn đã
    đập tan...; thậm chí có lẽ họ còn có thể biến nó thành một cuộc hành quân đường
    dài''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định & ẩn dụ: giữ cấu trúc điều kiện mở đầu ''Nếu
    có một tính toán sai lầm chí mạng nào... thì đó là điều này'', phủ định ''Họ không
    ngờ rằng'' và chuỗi hình ảnh ẩn dụ ''những con thú hoang lại sổng ra từ cứ điểm
    địch tưởng chừng đã bị bao vây kín kẽ, nhe nanh rồi ngoạm một cú chí tử từ phía
    sau''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & tình thái: giữ mệnh đề khái quát ''Trong một cuộc tranh
    giành quyền bá chủ, một nhát đâm sau lưng cũng có thể châm ngòi cho sự sụp đổ
    của ngay cả những đội quân hùng mạnh nhất''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & thuật ngữ: giữ quan hệ nhân quả ''Bởi lẽ...
    nên...''; ''reserve forces'' -> ''lực lượng dự bị''; ''paradigm'' -> ''mô thức
    tư duy'' (nhất quán với ''chuyển đổi mô thức'' trong canon/glossary-pending.yml)."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ: giữ thành ngữ tương đương ''Trong cái rủi có cái may''
    và hình ảnh ẩn dụ ''một con chó chăn cừu đã bám đuổi theo bầy thú ấy''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Nhân vật, đại từ & phủ định: ''Lieutenant Colonel Drake'' -> ''Trung
    tá Drake'', quy chiếu bằng đại từ ''ông''; giữ phủ định nhấn mạnh ''hoàn toàn
    chẳng phải chủ đích của ông''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Nhân vật, đơn vị, địa danh & giả định: ''First Lieutenant Sue''
    -> ''Trung úy Sue''; ''voluntary mage unit'' -> ''đơn vị pháp sư tình nguyện'';
    ''mage battalion'' -> ''tiểu đoàn pháp sư''; ''Soldim 528'' -> ''Soldim 528'';
    giữ sắc thái sát nút ''mới vừa vặn kiềm tỏa được một đòn đánh lẽ ra đã mang tính
    chí mạng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giới hạn: ''ad hoc tactics'' -> ''các chiến thuật
    ứng biến nhất thời''; giữ sắc thái giới hạn ''cũng chỉ phát huy tác dụng được
    đến một mức nào đó mà thôi''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Tổ chức, đơn vị & quan hệ nhân quả: ''Federation Army'' -> ''Quân
    đội Liên bang''; ''B Group'' -> ''Cụm B''; ''Imperial Army'' -> ''Lục quân Đế
    quốc''; ''pincered by the mage battalion from behind'' -> ''bị tiểu đoàn pháp
    sư kẹp gọng kìm từ phía sau''; ''reserve troops'' -> ''quân dự bị''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Tình thái giả định: giữ tình thái giả định khái quát ''Tư lệnh
    của bất kỳ đội quân nào rơi vào cảnh ấy cũng sẽ phải ôm đầu tuyệt vọng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & thuật ngữ: giữ sắc thái đối lập ''Thế nhưng hóa ra...
    tạm thời chỉ mang tính cục bộ''; ''organizational structure'' -> ''cơ cấu tổ chức'';
    ''the issue of decision-making'' -> ''vấn đề ra quyết định''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ, đại từ & phủ định: giữ câu hỏi tu từ ngôi thứ hai
    phiếm chỉ ''Bạn sẽ làm gì khi không thể duy trì phòng tuyến được nữa?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ nhịp ba câu hỏi ngắn liên tiếp ''Phản kích?
    Rút lui? Hay phòng ngự?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Giả định & phủ định: giữ giả định quá khứ ở câu đầu và hai câu
    phủ định tiếp nối ''Nhưng các chỉ huy của Liên bang đã không thể đưa ra quyết
    định mang tính sống còn ấy. Không một ai giành lấy được khoảng thời gian cần thiết
    để tái tổ chức các đội hình đang tan vỡ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép: bảo toàn cấu trúc phủ định kép ''Không phải là không
    có những người chỉ huy đủ khả năng đưa ra quyết định nhanh chóng''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & thuật ngữ: giữ nhịp lặp ''Trải qua hết trận kịch chiến
    này đến trận kịch chiến khác'' và cụm ''trui rèn năng lực phán đoán cùng kỹ năng
    tác chiến với tốc độ sánh ngang những người đồng cấp phía Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & phủ định: giữ câu chuyển ý nhấn mạnh ''Chỉ có một lý do
    duy nhất khiến họ không thể đưa ra quyết định''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''obedience'' -> ''sự phục tùng''; ''disobedience''
    -> ''bất tuân thượng lệnh''; ''acting on one’s own discretion'' -> ''hành động
    theo quyền tự quyết cá nhân''; bảo toàn các cấu trúc phủ định và phủ định kép
    ''đơn giản không phải là một lựa chọn'', ''Không phải là chưa từng có ai làm như
    vậy''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ câu ngắn ''Hầu hết mọi người sẽ chỉ đơn giản là
    chờ đợi''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu tách nhịp: giữ câu ngắn nối tiếp ''Chờ một mệnh lệnh''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu tách nhịp: giữ câu ngắn đính chính ''Hay chính xác
    hơn, là chờ sự cho phép''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''the party'' -> ''Đảng''; giữ cấu trúc so
    sánh hơn ''phải sợ Đảng hơn cả sợ kẻ địch''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định & tình thái: giữ câu điều kiện kèm phủ định
    và tình thái khả năng ''Tất nhiên, nếu nhận ra mình sắp không trụ nổi nữa, rốt
    cuộc họ cũng có thể sẽ hành động''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối xứng cấu trúc: giữ câu phủ định ''Nhưng họ đã không
    đi đủ xa'' để đối xứng trực tiếp với cụm ''không chỉ đi đủ xa'' ở p000031."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & cấu trúc tăng tiến: ''Lieutenant General von Zettour''
    -> ''Trung tướng von Zettour''; giữ cấu trúc tăng tiến cùng chủ thể trong dấu
    gạch ngang dài ''—vốn không chỉ đi đủ xa mà còn tiến tới cùng—''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi, phủ định & đại từ: giữ câu hỏi ba vế ''Đợt xung phong
    kiên quyết này là biểu hiện của lòng dũng mãnh hung bạo, của sự liều lĩnh, hay
    của việc dứt bỏ mọi do dự?''; giữ phủ định khẳng định chắc chắn ''không còn nghi
    ngờ gì rằng Zettour đã thắng canh bạc của ông'' (quy chiếu Zettour bằng ''ông'')."]'
