choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Giả định, dấu câu & đại từ: giữ cấu trúc câu điều kiện giả định
    và mệnh đề xen giữa cặp dấu gạch ngang dài (''—thật lòng thì Zettour rất mong
    chúng sẽ làm vậy—''); quy chiếu Zettour bằng ''ông'' và kẻ địch bằng ''chúng'';
    ''propaganda war'' -> ''cuộc chiến tuyên truyền''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & nhân quả: ''Council for Self-Government''
    -> ''Hội đồng Tự trị''; ''counterintelligence'' -> ''phản gián''; ''the Empire''
    -> ''Đế quốc''; giữ phủ định đánh giá (''chẳng mấy khả quan, dù có đánh giá rộng
    lượng đi chăng nữa'') và kết luận phủ định trong câu điều kiện (''việc kỳ vọng
    họ kìm nén được chứng hoang tưởng của mình là điều phi lý'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện & dấu câu: ''Federation moles'' -> ''nội
    gián của Liên bang''; ''the Empire'' -> ''Đế quốc''; ''Council for Self-Government''
    -> ''Hội đồng Tự trị''; ''flip sides'' -> ''trở mặt đổi phe''; giữ dấu chấm lửng
    giữa câu và nhận định ''Vấn đề này là một thế tiến thoái lưỡng nan nghiêm trọng.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giả định: ''occupied territory'' -> ''vùng
    lãnh thổ bị chiếm đóng''; ''public order and stability'' -> ''trật tự cũng như
    sự ổn định xã hội''; ''Council for Self-Government'' -> ''Hội đồng Tự trị''; giữ
    xu hướng phủ định (''có xu hướng không xét nét lý lịch cá nhân của những người
    mà họ tuyển dụng''), hệ quả giả định (''Nếu làm vậy, bộ máy cai trị của họ tất
    yếu sẽ trở nên khắc nghiệt, không khoan nhượng'') và nhu cầu ''cần một sự thỏa
    hiệp ôn hòa''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & hệ quả: ''friendly, anti-Federation territories''
    -> ''các vùng lãnh thổ thân thiện, chống Liên bang''; ''Federation agents'' ->
    ''các điệp viên Liên bang''; giữ phủ định (''họ không thực sự có lựa chọn loại
    bỏ những cá nhân khả nghi'') và hệ quả tất yếu (''không tránh khỏi việc các điệp
    viên Liên bang sẽ trà trộn vào'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & ẩn dụ: giữ dấu chấm lửng và hình ảnh ẩn dụ ''quăng lưới
    rộng thì thường sẽ vớt phải một số thành phần bất hảo''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Tình thái bất định & thuật ngữ: giữ mức độ bất định (''Không thể
    dám chắc chỉ với đôi ba mảnh bằng chứng củng cố, nhưng… thậm chí còn có một số
    nghi vấn rằng...''); ''Commonwealth Intelligence agent'' -> ''điệp viên Tình báo
    của Khối Thịnh vượng chung''; ''theater of operations'' -> ''chiến trường này''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''intel'' -> ''tin tình báo''; ''classified
    messages'' -> ''các bức điện mật''; ''Council for Self-Government'' -> ''Hội đồng
    Tự trị''; giữ tình thái ''có vẻ là'' và sắc thái ''được phái đi dưới danh nghĩa
    một phái đoàn''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định tuyệt đối: ''imperial codes'' -> ''mật mã
    của Đế quốc''; giữ kết luận ''cho kết quả phủ định hoàn toàn''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện nhượng bộ & phủ định: ''transmission or cipher''
    -> ''một bức điện hay một bộ mật mã''; ''communications security team'' -> ''đội
    ngũ an ninh thông tin liên lạc''; giữ mệnh đề nhượng bộ (''Ngay cả khi...'') kèm
    điều kiện (''chừng nào họ còn...'') và lời cam đoan phủ định (''hệ thống mật mã
    không thể bị xâm phạm'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Suy luận loại trừ, thuật ngữ & giọng mỉa mai: giữ cấu trúc loại
    trừ (''Nếu vấn đề không nằm ở mật mã, thì chỉ còn lại yếu tố con người''); ''Commonwealth''
    -> ''Khối Thịnh vượng chung''; ''HUMINT'' -> ''HUMINT''; ''intelligence agencies
    of hostile states'' -> ''cơ quan tình báo của các quốc gia thù địch''; giữ dấu
    chấm lửng và giọng cay độc ở vế cuối (''chẳng có lý do gì để cung cấp thêm tin
    tình báo cho những gã dường như có mồm chỉ để tiết lộ thêm nhiều chuyện cho kẻ
    địch cả'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: ''staff officers of the eastern army’s B
    Group'' -> ''các sĩ quan tham mưu thuộc Cụm B của đạo quân phía đông''; ''political
    necessity and military rationale'' -> ''nhu cầu chính trị tất yếu và cơ sở hợp
    lý về mặt quân sự''; ''maneuver battle'' -> ''trận đánh cơ động''; Zettour tự
    xưng ''Tôi'', gọi các sĩ quan tham mưu là ''các vị'' và dùng ''chúng ta'' khi
    nêu yêu cầu phá vây."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["So sánh, phủ định giới hạn & giả định: giữ phép so sánh (''giáng
    xuống căn phòng như một quả bom''), cấu trúc giới hạn phủ định (''chẳng được hậu
    thuẫn bởi thứ gì ngoài thẩm quyền mơ hồ'') và giả định (''Trong hoàn cảnh bình
    thường, người ta có thể dễ dàng phớt lờ hoặc từ chối nó'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đối lập: chỉ bọc ''*Chúng ta không được bỏ
    rơi binh lính của mình*'' trong dấu sao theo DEC-P01-002; giữ quan hệ đối lập
    (''Thế nhưng, rắc rối ở chỗ... lại khiến hầu hết bọn họ thấy vô cùng hợp lý và
    xác đáng'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Chức danh, thuật ngữ & xưng hô: Zettour gọi các sĩ quan tham mưu
    là ''các vị'' và tự xưng ''tôi''; ''inspector'' -> ''thanh tra viên''; ''deputy
    chief of the Service Corps'' -> ''Cục phó Cục Quân vụ''; ''General Staff'' ->
    ''Bộ Tổng tham mưu''; ''Council for Self-Government'' -> ''Hội đồng Tự trị'';
    giữ dấu chấm lửng giữa câu."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu trần thuật ngắn gọn ''Bầu không khí đóng băng.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & xưng hô nội tâm: ''staffers''
    -> ''các sĩ quan tham mưu''; chỉ bọc ''*Ngài điên rồi à?*'' trong dấu sao theo
    DEC-P01-002; dùng đại từ ''Ngài'' quy chiếu Zettour trong câu hỏi nội tâm của
    các sĩ quan tham mưu."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''rationality'' -> ''tính hợp lý'' (theo
    P03-rationality); giữ cặp dấu gạch ngang dài nhấn mạnh mức độ (''vừa vặn—chỉ vừa
    vặn—'') và ẩn dụ ''cái vỏ điềm tĩnh bên ngoài vốn có của những sinh vật xã hội''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & dấu câu: sĩ quan tham mưu gọi Zettour là ''thưa
    Tướng quân'' (''General''), xưng hô ''ngài''; giữ dấu chấm lửng ở đầu và cuối
    câu hỏi bỏ lửng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ nhận định khái quát ''Dù hay hoặc dở, những người lính
    được huấn luyện bài bản đều có khả năng tự chủ rất mạnh mẽ.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đối lập: giữ điểm nhìn của Zettour đánh giá các sĩ
    quan tham mưu là ''quá bi quan và thiếu sự quyết đoán''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Xưng hô cá nhân & phủ định kép: Zettour gọi viên sĩ quan tham
    mưu vừa lên tiếng là ''Anh'', tự xưng ''tôi'' / ''mình''; giữ câu mệnh lệnh phủ
    định ''đừng có nề hà'' và cấu trúc phủ định kép ''không bất tài, thiếu tự thức
    hay ngu dốt đến mức không hiểu nổi điều chính miệng mình vừa nói đâu''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Chức danh, thuật ngữ & dấu câu: ''ceremonial title of inspector''
    -> ''chức danh thanh tra viên mang tính nghi thức''; ''deputy chief of the Service
    Corps in the General Staff'' -> ''Cục phó Cục Quân vụ trong Bộ Tổng tham mưu'';
    giữ dấu ngoặc kép quanh từ ''“yêu cầu”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giả định: ''Supreme Command'' -> ''Bộ Tư
    lệnh Tối cao''; giữ phủ định (''cố tình không trao thẩm quyền cho Zettour''),
    dấu chấm lửng và mệnh đề điều kiện (''nên nếu việc này kết thúc tồi tệ, nó sẽ
    trở thành một rắc rối khổng lồ'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Phủ định & nghĩa: giữ câu phủ định (''Zettour chẳng bận tâm'')
    và nhận định khép đoạn (''Có những canh bạc sinh ra là để đặt cược bất kể phần
    thắng bại ra sao.'')."]'
