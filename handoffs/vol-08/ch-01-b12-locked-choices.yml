choices:
- segment_id: YS-LN08/Text/chapter004.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & nhấn mạnh Markdown: người kể chuyện ngôi
    thứ nhất Andrew tự xưng ''tôi''; bọc ''*Kampfgruppe*'' trong dấu sao đúng theo
    thẻ in nghiêng của nguồn (DEC-P01-002)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & dấu câu: giữ dấu ngoặc đơn quanh ''‘Kampfgruppe’''
    (không thêm chữ nghiêng vì nguồn không có thẻ nhấn mạnh), giữ câu hỏi định nghĩa
    và phủ định ''Tôi không quen với thuật ngữ này lắm''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định kép & thuật ngữ: Drake xưng ''Tôi'', gọi Andrew
    là ''cậu'', dùng ''chúng ta'' cho phe đồng minh; giữ phủ định kép ''việc cậu không
    biết cũng chẳng có gì đáng ngạc nhiên''; ''on the Rhine'' -> ''ở mặt trận Rhine'';
    ''the Empire'' -> ''Đế quốc''; ''task force'' -> ''lực lượng đặc nhiệm''; ''multinational
    unit'' -> ''đơn vị đa quốc gia''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự & câu hỏi: ''regiment'' -> ''trung đoàn''; ''brigade''
    -> ''lữ đoàn''; giữ câu hỏi xác nhận sự khác biệt."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000339
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhượng bộ: ''temporary formation'' -> ''biên
    chế lâm thời''; ''battalions of infantry, tanks, aerial mages'' -> ''các tiểu
    đoàn bộ binh, xe tăng, pháp sư trên không''; giữ quan hệ đối lập - nhượng bộ về
    quy mô và cách tổ chức."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000340
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & câu hỏi: dịch ''temporary, ad hoc units'' thành
    ''những đơn vị lâm thời, lập ra theo nhu cầu trước mắt''; giữ dấu chấm lửng và
    câu hỏi suy luận về cách đặt tên theo người chỉ huy."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000341
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & đại từ: ''Imperial Army’s Colonel von Lergen''
    -> ''Đại tá von Lergen của Lục quân Đế quốc''; giữ đại từ ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000342
  kind: terminology_and_voice
  value: 'choices=["Phủ định & xưng hô: Andrew xưng ''tôi''; giữ phủ định giảm nhẹ
    ''Thú thật thì tôi không quen cái tên đó lắm.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000343
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & tình thái: Andrew xưng ''Tôi''/''mình'';
    giữ phủ định ''chưa bao giờ là kẻ thích khoe khoang'' và mức độ tự tin ''khá tự
    tin''; ''high-ranking officers serving on the front lines'' -> ''các sĩ quan cấp
    cao đang phục vụ nơi tiền tuyến''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000344
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điểm nhìn: ''Rhine front'' -> ''mặt trận Rhine'';
    ''the east'' -> ''mặt trận phía đông''; ''news office’s reference room'' -> ''phòng
    tư liệu của tòa soạn''; giữ đại từ ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000345
  kind: terminology_and_voice
  value: 'choices=["Giả định, phủ định & đại từ: giữ giả định ''Có lẽ nếu lục tìm
    trong tủ mục lục thẻ ở quê nhà thì sẽ ra thứ gì đó'', phủ định ''không thể nói
    là mình từng nghe về ông ta'' và câu hỏi về nhân thân; quy chiếu Lergen bằng ''ông
    ta''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000346
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Drake xưng ''tôi'', gọi Andrew là ''cậu'',
    gọi Lergen là ''ông ta''; giữ hai phủ định trong câu."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000347
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Andrew gọi Drake là ''ngài'' (''Sao ngài
    lại nói vậy?'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000348
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định ngoại trừ & nhân quả: ''Imperial Army’s General
    Staff'' -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; ''the rear'' -> ''hậu phương'';
    giữ cấu trúc phủ định ngoại trừ (''Không phải kiểu người... trừ phi...'') và quan
    hệ nhân quả (''nên không có nhiều cơ hội để trở nên nổi bật'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000349
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái phủ định: ''military administration'' ->
    ''ngành hành chính quân sự''; giữ câu hỏi suy luận và nhận định phủ định ''tôi
    không nghĩ một người như vậy lại hăng hái ra trận đâu''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000350
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & cấu trúc nhượng bộ: Drake gọi tên ''Andrew''
    và xưng hô ''cậu''; ''staff officers'' -> ''sĩ quan tham mưu''; ''Operations''
    -> ''Cục Tác chiến''; ''tactician'' -> ''nhà chiến thuật''; giữ phủ định ''không
    thể xem nhẹ'' và mệnh đề nhượng bộ ''Dù ông ta có... hay không, thì chắc chắn...''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái khẩu ngữ: Andrew gọi Drake là ''Ngài'', xưng
    ''Tôi'', gọi Lergen là ''ông ta''; ''pro from the rear'' -> ''dân chuyên nghiệp
    ở hậu phương''; giữ sắc thái mỉa mai về giới bàn giấy."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: giữ dấu gạch ngang dài và dịch ''armchair
    commanders'' thành ''đám chỉ huy salon''; giữ phủ định ''chẳng biết làm sao để
    áp dụng vào thực tế''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000353
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Commonwealth troops'' -> ''binh lính Khối
    Thịnh vượng chung''; giữ cấu trúc phủ định ''không khó để hình dung ra kiểu người
    đó''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000354
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & đối lập: ''home country'' -> ''bản quốc'';
    ''the Empire'' -> ''Đế quốc''; ''urban centers'' -> ''các trung tâm đô thị'';
    Drake xưng ''Tôi'' - gọi ''cậu''; giữ đối lập giữa việc tử thủ đô thị và vứt bỏ
    ngay những khu vực không thể phòng thủ, cùng dấu chấm lửng ở câu cuối."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000355
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: quy chiếu Drake bằng ''ông ấy'';
    giữ tình thái phỏng đoán quá khứ (''Có lẽ ông ấy chỉ đơn giản là đang cảnh giác...'')
    đối lập với nhận xét (''nhưng có điều gì đó... khiến chuyện này nghe cụ thể hơn
    thế'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000356
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Andrew gọi Drake là ''ngài'' (''Ý ngài là họ
    rất đáng gờm sao?'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000357
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái suy đoán chắc chắn: ''Imperial Operations''
    -> ''Cục Tác chiến Đế quốc''; giữ tình thái ''ắt hẳn đều là''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000358
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi nghi vấn: ''Federation Army’s official briefing''
    -> ''buổi phổ biến tình hình chính thức của Quân đội Liên bang''; giữ câu hỏi
    nghi vấn kèm dấu chấm lửng ở đầu đoạn."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000359
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi nội tâm & nhấn mạnh Markdown: ''Communist Party''
    -> ''Đảng Cộng sản''; ''Commonwealth forces'' -> ''lực lượng Khối Thịnh vượng
    chung''; giữ câu hỏi nghi vấn dài và chỉ bọc ''*Chuyện đó*'' trong dấu sao theo
    đúng thẻ in nghiêng của nguồn (DEC-P01-002)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000360
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & cấu trúc lựa chọn: giữ dấu chấm lửng đầu câu và cấu
    trúc ''bị kiểm duyệt hoặc cấm phát sóng''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000361
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: Andrew xưng ''Tôi''/''mình''; giữ tình
    thái khả năng tương lai ''Biết đâu sau này lại có lúc dùng đến''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000362
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & hình ảnh so sánh: ''Colonel Drake'' -> ''Trung
    tá Drake'' (gọi tắt của Lieutenant Colonel Drake); Andrew gọi Drake là ''Ngài'',
    xưng ''tôi'', dùng ''chúng ta'' cho phe mình; ''enemy mages'' -> ''đám pháp sư
    địch''; giữ hình ảnh so sánh nhảy cóc như ếch nhái."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000363
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & khẳng định: ''three divisions'' -> ''ba sư
    đoàn''; giữ nguyên ''Kampfgruppe''; ''Federation troops'' -> ''các cánh quân Liên
    bang''; dùng ''chúng ta'' cho phe đồng minh và ''chúng'' cho quân địch; giữ khẳng
    định mạnh ''Không còn nghi ngờ gì nữa''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000364
  kind: terminology_and_voice
  value: 'choices=["Tình thái & nghĩa: ''combat strength'' -> ''sức mạnh chiến đấu'';
    ''crushing victory'' -> ''thắng lợi áp đảo''; giữ tình thái suy luận ''hẳn phải
    kết thúc bằng...''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000365
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ quan hệ đối lập ''Bất chấp điều đó'' và
    phủ định ''vẫn không hề nao núng''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000366
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: ''Colonel'' (gọi Trung tá Drake)
    -> ''thưa Trung tá''; Andrew gọi Drake là ''ngài''; ''relief'' -> ''viện binh'';
    giữ dấu chấm lửng đầu câu hỏi."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000367
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & tình thái: quy chiếu Drake bằng ''Ông
    ấy'' trong trần thuật; bọc ''*Chính xác*'' trong dấu sao theo đúng thẻ nhấn mạnh
    của nguồn (DEC-P01-002); trong thoại Drake dùng ''Chúng tôi'' (phía quân đội mình)
    và ''tôi'', giữ vẻ lấp lửng ''tôi cũng đang tự hỏi đây''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000368
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi ngắn: giữ câu hỏi ngắn tự nhiên ''Tự hỏi về chuyện gì
    cơ?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000369
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô & phạm vi phủ định: Andrew xưng ''tôi''; trong
    thoại Drake xưng ''Tôi'', gọi Andrew là ''cậu'', dùng ''hai chúng ta''; giữ đúng
    phạm vi phủ định lý do (''Tôi kể cho cậu nghe không phải vì muốn cậu bô bô bí
    mật này cho tất cả mọi người đâu'')."]'
