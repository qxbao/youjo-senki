choices:
- segment_id: YS-LN08/Text/chapter006.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi phủ định: Rudersdorf tự xưng ''Tôi'',
    gọi Zettour là ''ông''; ''the east'' -> ''miền đông''; ''the front'' -> ''tiền
    tuyến''; ''the rear'' -> ''hậu phương''; giữ chuỗi câu hỏi tu từ mang nghĩa phủ
    định ''chẳng có chút thẩm quyền nào ư?'', ''chẳng có vai trò gì ở hậu phương nữa
    chứ?'' và kết luận ''Họ đang gạt ông ra rìa đấy''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giả định: Zettour tự xưng ''Tôi'' / ''mình''; giữ sắc
    thái chủ động chọn cách nhìn nhận như vừa được ban một kỳ nghỉ phép."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, dấu câu & thuật ngữ: Rudersdorf gọi ''Zettour'', xưng
    ''tôi'' – ''Ông''/''ông''; giữ dấu chấm lửng và dấu gạch ngang dài tự đính chính
    ''Cấp trên—không, toàn bộ chính phủ đang để mắt đến ông đấy''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: Zettour dùng ''Chúng ta'' cho ''We'';
    ''Service Corps'' -> ''Cục Quân vụ''; ''total war'' -> ''chiến tranh tổng lực'';
    giữ cấu trúc phủ định kép ''không thể nào tránh khỏi chuyện có lúc bị đổ lỗi''
    và phủ định tuyệt đối ''Không thể nào làm bạn với tất cả mọi người được''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đối lập & dấu câu: giữ sự tương phản giữa ''thanh niên
    phe địch'' và ''những người trẻ tuổi của phe mình'', cùng dấu gạch ngang dài ''—đó
    chính là chiến tranh''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc so sánh phủ định: ''General Staff officer''
    -> ''sĩ quan Bộ Tổng tham mưu''; giữ cấu trúc so sánh bậc nhất phủ định ''Không
    ai kém phù hợp... hơn một kẻ muốn được lòng mọi người''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giả định trái thực tế ở quá khứ: Zettour tự
    xưng ''tôi'', dùng ''Chúng ta'' cho ''We''; ''foreign affairs'' -> ''công việc
    đối ngoại''; ''Supreme Command'' -> ''Bộ Tư lệnh Tối cao''; giữ dấu chấm lửng
    và điều kiện giả định ''Ngay cả khi tôi không tự ý hành động theo thẩm quyền của
    mình hay chống đối Bộ Tư lệnh Tối cao… thì sớm muộn gì tôi cũng sẽ bị trừng phạt
    thôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: quy chiếu Zettour bằng ''ông''; giữ tình thái
    đánh giá ''có thể coi là nhẹ nhàng đến bất ngờ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ nhận định phủ định ''Zettour chẳng hề ôm lòng oán
    hận nào''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, thuật ngữ, đại từ & câu hỏi tu từ: giữ chính xác phạm
    vi in nghiêng ''*Vậy nên những gì đã xảy ra là điều tất yếu*''; Zettour dùng ''chúng
    ta'' cho ''we'', trần thuật quy chiếu Zettour bằng ''ông'' / ''mình''; ''accountability''
    -> ''trách nhiệm giải trình''; ''principles of military command'' -> ''các nguyên
    tắc chỉ huy quân sự''; ''military administration'' -> ''ngành hành chính quân
    sự''; giữ hai câu hỏi tu từ ở giữa và cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định, thuật ngữ & dấu câu: Rudersdorf gọi Zettour
    là ''ông''; giữ phủ định ''như thế không công bằng'', quan hệ nhượng bộ ''Thưởng
    phạt có thể là... nhưng xét cho cùng...''; ''General Staff'' -> ''Bộ Tổng tham
    mưu''; ''human resources'' -> ''nhân sự''; giữ dấu gạch ngang dài bỏ lửng câu
    ở cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & phủ định: giữ cấu trúc ''Ngay cả khi xung
    quanh không có ai, Rudersdorf cũng đang đi quá giới hạn rồi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & nội tâm: giữ chính xác phạm vi in nghiêng ''*Thế này
    thì không ổn rồi*'' cho câu nội tâm của Zettour."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Rudersdorf bằng ''ông''; giữ chi tiết
    biểu cảm chân mày lộ vẻ bất mãn khi kìm lời."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: Zettour dùng ''chúng ta'' cho ''we''; giữ dấu
    chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi phủ định: Rudersdorf dùng ''Chúng ta''; giữ câu
    hỏi ''Chúng ta không có lựa chọn nào khác ư?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, xưng hô, thuật ngữ & tình thái: Zettour gọi ''Tướng von
    Rudersdorf'', xưng ''tôi'' – ''ông'', trần thuật quy chiếu Zettour bằng ''Ông'';
    ''grand strategy'' -> ''đại chiến lược''; ''front lines'' -> ''tiền tuyến''; giữ
    dấu chấm lửng và tình thái suy đoán ''Có lẽ họ đang gợi ý rằng...''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Tình thái, thuật ngữ & xưng hô: giữ tình thái suy đoán ''Biết
    đâu''; ''Federation Army'' -> ''Quân đội Liên bang''; Rudersdorf gọi Zettour là
    ''ông'', quy chiếu cấp trên bằng ''bọn họ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, giả định, thuật ngữ & dấu nháy đơn: Zettour gọi Rudersdorf
    là ''Ông'', tự xưng ''tôi'', dùng ''chúng ta'' cho ''us''; ''east'' -> ''miền
    đông''; ''ceremonial head of a regiment'' -> ''người đứng đầu mang tính nghi lễ
    của một trung đoàn''; giữ dấu nháy đơn ''‘tình nguyện’'' và hai cấu trúc điều
    kiện giả định."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''General Staff'' -> ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, địa danh & đại từ: giữ dấu ngoặc kép mỉa mai ''“thăng
    chức”'' và dấu chấm lửng; ''higher-ups'' -> ''giới cấp trên''; ''Norden'' -> ''Norden'';
    ''Rhine front'' -> ''mặt trận Rhine''; quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái: Zettour tự xưng ''tôi''; giữ trạng ngữ hạn
    định ''Xét tương đối thì''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & phủ định: Rudersdorf gọi ''Zettour'', xưng
    ''Ông''; ''a general'' -> ''một vị tướng''; ''a first lieutenant'' -> ''một gã
    trung úy''; dùng ''mình'' cho ''you'' khái quát trong mệnh đề phủ định tuyệt đối
    ''chẳng bao giờ có chuyện gì diễn ra theo đúng ý mình muốn đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Đại từ, cấp bậc, dấu câu & so sánh: Zettour tự xưng ''Tôi'', dùng
    ''chúng ta'' cho ''we'' và ''ông'' cho ''your''; ''lieutenant colonels'' -> ''trung
    tá''; giữ dấu gạch ngang dài ''—đời là thế mà'' và cấu trúc so sánh tương đồng
    giữa người ở đỉnh và người ở đáy."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Rudersdorf gọi Zettour là ''Ông''; giữ phủ
    định ''Bình thường chẳng ai lại đi đến cái kết luận kiểu đó đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & câu hỏi nội tâm: trần thuật quy chiếu Zettour
    bằng ''ông'' / ''mình''; giữ cấu trúc ''không có lựa chọn nào khác ngoài việc...''
    và hai câu hỏi nội tâm liên tiếp."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ, dấu câu & nhấn mạnh: ''Operations'' -> ''Cục
    Tác chiến''; ''Operations staffers'' -> ''các sĩ quan tham mưu khác của Cục Tác
    chiến''; quy chiếu Zettour bằng ''Ông'' / ''ông''; giữ dấu chấm lửng và chính
    xác phạm vi in nghiêng ''*Ààà.*''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Đại từ: Zettour tự xưng ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu hỏi ngắn gọn ''Chuyện gì?'' của Rudersdorf."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Service Corps'' -> ''Cục Quân vụ''; giữ
    phủ định ''Thế mạnh của nó không nằm ở chính trị''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nhấn mạnh & quan hệ đối lập: quy chiếu Zettour bằng ''ông'';
    giữ chính xác phạm vi in nghiêng ''*Sao tự dưng ông lại nói cái điều hiển nhiên
    đó?*'' và mệnh đề đối lập ''Nhưng việc được nhắc nhở rằng các định chế đều do
    con người vận hành là điều rất quan trọng''."]'
