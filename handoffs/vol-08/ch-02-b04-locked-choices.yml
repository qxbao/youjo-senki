- segment_id: YS-LN08/Text/chapter006.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: trần thuật quy chiếu Zettour bằng ''ông''; giữ
    tên ''Rudersdorf'' và ý ''kịch bản tồi tệ nhất sẽ là bị sa thải hoàn toàn khỏi
    quân ngũ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đại từ: giữ tình thái suy đoán ''Hẳn là'' (''must
    have''); quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Tình thái, đại từ & thuật ngữ: quy chiếu Zettour bằng ''ông'';
    giữ tình thái ''hẳn họ đã sẵn lòng''; ''the east'' -> ''miền đông''; ''Bureaucracy''
    -> ''Bộ máy quan liêu''; ''human resources'' -> ''nguồn nhân lực''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đối lập: giữ ''Tuy nhiên, xem chừng Rudersdorf lại
    có cảm nhận khác với Zettour.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, xưng hô & phủ định kép: giữ dấu chấm lửng mở đầu; Rudersdorf
    gọi ''Zettour'', xưng ''tôi'' – ''ông'' trong thoại, trần thuật quy chiếu Rudersdorf
    bằng ''ông''; giữ cấu trúc phủ định kép ''Đừng nói với tôi là ông không biết đấy
    nhé, Zettour!''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & đối lập: ''Supreme Command'' -> ''Bộ Tư lệnh
    Tối cao''; giữ dấu chấm lửng và sự đối lập giữa bề nổi (''chẳng có sự khác biệt
    nào'') với thực tế (''cả một vực sâu ngăn cách'')."]'
