- segment_id: YS-LN08/Text/chapter006.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & tình thái: quy chiếu Zettour bằng ''Ông ta''
    / ''ông ta''; Johnson tự xưng ''Tôi''; giữ phủ định ''chẳng nắm trong tay chút
    quyền lực nào đáng lẽ phải đi kèm với nó'' và tình thái ''suýt thì muốn thương
    hại''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Phủ định, đại từ & thuật ngữ: giữ phủ định ''Đó không phải là
    tin xấu''; dùng ''chúng tôi'' cho ''those of us''; ''B Group'' -> ''Cụm B''; giữ
    ẩn dụ ''vẫn còn là một dấu hỏi lớn''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu & giả định: Johnson tự xưng ''Tôi'' / ''tôi'';
    giữ tên ''Drake'', dấu chấm lửng ''nhưng…'' và sắc thái giả định tiếc nuối ở quá
    khứ ''cũng muốn mang tới vài tin tức khả quan hơn lắm, nhưng… đó là điều tốt nhất
    tôi có thể đưa ra rồi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & giọng thoại: giữ cấu trúc lựa chọn ''toàn là tin chẳng
    lành hoặc bí mật tối cao cả, thứ lỗi nhé''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Tên gọi, đại từ & điều kiện giả định: Drake tự xưng ''tôi''; ''General
    Habergram'' -> ''Tướng Habergram'' (quy chiếu bằng ''ông ấy''); giữ câu điều kiện
    giả định ''tôi sẽ còn kính trọng ông ấy hơn nữa nếu ông ấy chịu giúp tôi rảnh
    nợ khỏi một vài cô nàng nào đó''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: Johnson tự xưng ''Tôi'', quy chiếu Drake bằng
    ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ, đại từ & tình thái: Johnson tự xưng ''tôi'',
    quy chiếu Drake bằng ''anh ta'', quy chiếu Sue bằng ''cô ta''; ''First Lieutenant
    Sue'' -> ''Trung úy Sue''; ''volunteer mages'' -> ''các pháp sư tình nguyện'';
    ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''Unified States'' -> ''Hợp chúng
    quốc''; ''Entente Alliance'' -> ''Liên minh Hiệp ước''; giữ phủ định ''không phải
    mẫu sĩ quan hay than vãn'', các lớp tình thái suy đoán ''hẳn là'', ''Chắc hẳn
    là'', ''Có vẻ'' và câu hỏi nội tâm ''Hay ít nhất tôi nhớ tên cô ta là vậy thì
    phải?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: Johnson tự xưng ''Tôi'' / ''tôi'', quy chiếu
    Drake bằng ''anh ta''; ''servant of the state'' -> ''kẻ tôi tớ... của nhà nước'';
    ''His Majesty’s'' -> ''Đức Vua''; ''the homeland’s'' -> ''bản quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & đối lập: Johnson tự xưng ''Tôi'' / ''tôi'',
    gọi Drake là ''anh''/''Anh''; giữ phủ định ''không giúp gì cho anh chuyện đó được''
    và cấu trúc đối lập ''cấp trên của Tướng Habergram chứ không phải bản thân ông
    ấy đâu''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi phủ định: Drake gọi ''ông Johnson'' và xưng
    hô ''ông''; giữ câu hỏi phủ định ''Ngay cả một người ở vị trí như ông cũng không
    giúp được sao, ông Johnson?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ: giữ nguyên ''Thật vô cùng đáng tiếc, nhưng
    đúng là như vậy.''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấu trúc phủ định – đối lập & tình thái: ''volunteer
    mage units'' -> ''các đơn vị pháp sư tình nguyện''; ''Intelligence'' -> ''cơ quan
    Tình báo''; ''military rationale'' -> ''tính hợp lý quân sự''; giữ cấu trúc ''không
    phải là... mà là...'' và tình thái ''hoặc thậm chí có lẽ là hoàn cảnh của quốc
    gia''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc: ''the colonel'' (chỉ Trung tá Drake) -> ''vị trung tá''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, tình thái & đại từ: giữ dấu chấm lửng; Drake tự xưng
    ''Tôi''; giữ tình thái ''Thực tế đôi khi thật khắc nghiệt…''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, xưng hô & thuật ngữ: Johnson tự xưng ''tôi'' / ''Tôi'',
    gọi ''Trung tá Drake'' và xưng hô ''anh''; ''Federation customs agent'' -> ''nhân
    viên hải quan Liên bang''; ''the home country'' -> ''chính quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Drake gọi Johnson là ''ông'', tự xưng ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Johnson tự xưng ''Tôi'' / ''tôi'', gọi Drake
    là ''anh'', dùng ''chúng ta'' cho ''we''; ''backwater tour of duty'' -> ''đợt
    làm nhiệm vụ nơi khỉ ho cò gáy này''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh: giữ chữ in hoa toàn bộ ''CÙNG NGÀY HÔM ĐÓ,
    THỦ ĐÔ ĐẾ QUỐC BERUN, GA TRUNG TÂM''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Địa danh & nghĩa: ''imperial capital’s Central Station'' -> ''Ga
    Trung tâm của thủ đô Đế quốc''; giữ đầy đủ các lớp miêu tả âm thanh con người
    và đoàn tàu quân sự lẫn dân sự."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, thuật ngữ & giả định: giữ cặp dấu gạch ngang dài ''—và
