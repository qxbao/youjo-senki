- segment_id: YS-LN08/Text/chapter006.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & xưng hô: giữ dấu chấm lửng mở đầu; Rudersdorf gọi ''Zettour'',
