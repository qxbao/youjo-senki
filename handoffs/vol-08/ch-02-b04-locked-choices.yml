    sẽ coi... là một bằng chứng không thể chối cãi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhượng bộ: ''the Empire'' -> ''Đế quốc'';
    giữ cấu trúc ''vừa là... vừa là...'' và mệnh đề nhượng bộ ''dẫu chẳng nỡ chia
