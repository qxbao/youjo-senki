choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ định dạng viết hoa toàn bộ ''NGÀY
    18 THÁNG 6 NĂM THỐNG NHẤT 1927, PHÒNG TUYẾN PHÍA ĐÔNG, SOLDIM 528''; không có
    chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & điệp từ: độc thoại nội tâm tự quy chiếu của
    Tanya dùng ''mình'' theo DEC-P01-001; giữ lối chơi chữ lặp từ ''trận địa'' (''việc
    củng cố trận địa tại trận địa Soldim 528'', ''Một trận địa mà vẫn chưa ra hình
    hài trận địa'') và câu hỏi tự vấn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ đại từ ngôi thứ nhất số nhiều ''chúng
    tôi'' khi Tanya thuật lại tình cảnh chung của đơn vị; ''wisdom of the field''
    -> ''trí khôn nơi chiến trường''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & câu hỏi: ''Lieutenant Colonel Tanya von Degurechaff''
    -> ''Trung tá Tanya von Degurechaff''; ''underground storehouse'' -> ''nhà kho
    ngầm''; ''subterranean trench'' -> ''chiến hào ngầm''; giữ sắc thái phỏng đoán
    ''có lẽ là... chăng?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: chuyển sang trần thuật ngôi thứ
    ba quy chiếu Tanya bằng ''cô''; ''Federation Army'' -> ''Quân đội Liên bang'';
    ''uncomfortable, underground pseudo-bed'' -> ''cái ổ ngủ tạm bợ, chật vật dưới
    lòng đất của mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ câu trần thuật ngắn tả âm thanh quen thuộc vọng lại
    ngày một gần.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Tanya bằng ''cô''; giữ cấu trúc nhấn
    mạnh ''Thứ đánh thức cô bao giờ cũng là tiếng đạn pháo nổ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, đại từ & địa danh: giữ tiếng tặc lưỡi ''…Chậc'' và
    lời nhận xét mỉa mai; trần thuật dùng ''cô''; ''the Rhine'' -> ''mặt trận Rhine'';
    giữ tương phản phủ định ''Người ta vẫn bảo ký ức là thứ đẹp đẽ, nhưng chẳng có
    gì đẹp đẽ ở mặt trận Rhine cả''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ nhịp câu ngắn ''Tanya lắc đầu. Ít ra cũng có vài thứ
    được cải thiện.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu liệt kê ngắn ''Chẳng hạn như môi trường.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & sắc thái mỉa mai: quy chiếu Tanya bằng ''cô'';
    ''crumbling, partially submerged pseudo-bedroom'' -> ''căn phòng ngủ tạm bợ đang
    sụt lở và ngập nước một phần''; giữ tình thái mỉa mai ''có lẽ nên được ăn mừng
    như một chế độ làm việc tại nhà đầy ấm cúng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=[''Giọng thoại báo động: giữ nguyên nhịp hô cảnh báo khẩn cấp và
    câu lặp lại mệnh lệnh chuẩn bị chiến đấu.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quan hệ nhân quả & phủ định: dùng ''chúng tôi'' cho nhận
    định của phía Tanya; ''major Federation offensive'' -> ''cuộc tổng tấn công lớn
    của Liên bang''; giữ phủ định cuối câu ''chẳng còn chỗ nào cho sự hiểu lầm nữa''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & xưng hô: ''Damn Commies'' -> ''Đám Cộng sản khốn
    kiếp''; gọi đối phương là ''các người''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giả định: giữ phủ định ''chẳng phải loại
    công việc có thể gói gọn trước giờ tan tầm''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; giữ điều kiện giả định ''nếu chỉ làm việc năm tiếng một ngày'';
    ''Commies'' -> ''Đám Cộng sản''; ''capitalists'' -> ''giới tư bản''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: trần thuật ngôi thứ ba kết hợp nội tâm của
    Tanya; giữ các phủ định khẳng định quyết tâm (''sẽ không thể được dung thứ'',
    ''là không thể tha thứ'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & thuật ngữ: ''command post bunker'' -> ''hầm
    sở chỉ huy''; ''Captain Ahrens and Captain Meybert'' -> ''Đại úy Ahrens và Đại
    úy Meybert''; quy chiếu Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & tổ chức: quy chiếu Tanya bằng ''cô''; ''command
    post'' -> ''sở chỉ huy''; ''Lieutenant Serebryakov'' -> ''Trung úy Serebryakov'';
    ''Major Weiss'' -> ''Thiếu tá Weiss''; ''B Group HQ'' -> ''Sở chỉ huy Cụm B'';
    ''air fleet'' -> ''không hạm đội''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu nhận định ngắn ''Mọi việc đều đang được xử lý đúng
    theo quy trình.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc chêm & đại từ: giữ mệnh đề chêm hạn định mức độ ''một
    chút, dù chẳng nhiều nhặn gì, thời gian—thứ còn quý hơn vàng—'' và đại từ ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại độc thoại: dùng ''chúng ta'' trong câu tự lẩm bẩm
    thành tiếng của Tanya; giữ tiểu từ hỏi đuôi ''nhỉ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''preestablished harmony'' -> ''sự hài hòa
    tiền định''; giữ cấu trúc so sánh ''không hẳn là... mà giống... hơn'' và phủ định
    ''cũng chẳng có nhiều dư địa cho những phương án sáng tạo''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & thuật ngữ: ''Captain Ahrens'' -> ''Đại úy
    Ahrens''; ''armored forces'' -> ''lực lượng thiết giáp''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cấp dưới & phủ định: giữ câu báo cáo ngắn gọn có tiểu
    từ kính ngữ ''ạ'' (''Không có tổn thất ạ.'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & quan hệ nhượng bộ: trần thuật dùng ''cô''
    cho Tanya và ''anh'' cho Meybert; giữ kính ngữ ''ạ'' và đại từ ''chúng ta'' trong
    lời báo cáo của Meybert; ''squad'' (pháo binh) -> ''khẩu đội''; giữ mệnh đề nhượng
    bộ sau dấu chấm lửng (''… dù có khoảng mười phần trăm số đạn pháo còn lại của
    chúng ta đã bị vạ lây trong một vụ nổ'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: giữ đại từ ''chúng ta'' trong lời đáp của Tanya;
    giữ chi tiết lương thực bị oanh tạc tan tành."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc nhượng bộ: ''preparatory bombardments'' ->
    ''pháo kích chuẩn bị''; ''harassment'' -> ''bắn quấy rối''; ''Federation'' ->
    ''quân Liên bang''; ''Soldim 528'' -> ''Soldim 528''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: giữ phủ định ''chưa đến mức chí
    mạng''; ''Rhine front'' -> ''mặt trận Rhine''; nội tâm tự quy chiếu của Tanya
    ở cuối đoạn dùng ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: dùng ''chúng tôi'' nhất quán với
    p000003 và p000013; giữ hai câu phủ định liên tiếp về sự thiếu hụt không gian
    cất giữ và khu vực được che chắn bảo vệ; ''bivouacs'' -> ''các khu trại lộ thiên'';
    ''stray enemy shots'' -> ''đạn lạc của địch''."]'
