choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000367
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nghĩa: Tanya xưng ''tôi'' và dùng ''chúng ta'' cho toàn
    đơn vị; giữ cấu trúc nhượng bộ ''Cứ gọi tôi là bảo thủ cũng được, nhưng tôi đang
    ưu tiên việc bảo toàn binh lực của chúng ta''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000368
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & tình thái: cấp dưới (Weiss) xưng ''tôi'',
    gọi Tanya là ''Trung tá'' kèm ''ạ'' (''ma’am''); ''Lieutenant Serebryakov'' ->
    ''Trung úy Serebryakov''; ''party of volunteers'' -> ''một toán quân tình nguyện'';
    giữ sắc thái lịch sự xin phép."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000369
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & tình thái: trần thuật gọi ''Tanya''; trong
    thoại Tanya gọi Weiss là ''Anh'', giữ phủ định dứt khoát ''không vẫn là không''
    và tình thái ''nhiệm vụ của chúng ta là tập trung vào phòng ngự''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000370
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''positional warfare'' -> ''tác chiến trận
    địa''; giữ câu bỏ lửng với dấu ba chấm."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000371
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & phủ định: phân biệt lời thoại (''tôi'',
    ''chúng ta'') và câu nội tâm xen giữa (''chúng ta đang bị vây hãm''); giữ cặp
    phủ định–khẳng định (''không phải là một trận đánh chiến hào—mà là trận phòng
    ngự cứ điểm'', ''không phải là giao lưu văn hóa với chiến hào địch, mà là chuẩn
    bị nghênh đón những vị khách của mình'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000372
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: ''ma’am'' -> ''Trung tá ... ạ''; giữ đúng câu
    hỏi thăm dò ý định tác chiến của chỉ huy."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000373
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & thuật ngữ: ''enemy offensives'' -> ''các đợt tiến công
    của địch''; giữ mốc thời gian ''Hôm nay và ngày mai sẽ dành trọn cho...''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000374
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, phủ định giảm nhẹ & tình thái: độc thoại nội tâm
    của Tanya tự xưng ''mình'' theo DEC-P01-001 và dùng ''chúng ta'' khi bao hàm đơn
    vị; giữ cấu trúc phủ định giảm nhẹ (''Mình sẽ không nói... là một ý tồi''), tình
    thái (''thường trở thành điều bắt buộc'', ''mình hình dung... sẽ phải'') và cụm
    ''xuất kích đánh ra ngoài'' (''sally out and strike'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000375
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, mệnh lệnh & tình thái: ''Lieutenant Tospan’s infantry''
    -> ''lực lượng bộ binh của Trung úy Tospan''; giữ mệnh lệnh ''hãy giữ thái độ
    thụ động'' và cảnh báo ''sẽ rất nguy hiểm nếu mặc định rằng quân tiếp viện có
    thể giải cứu được chúng ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000376
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa: nội tâm tiếp nối dùng ''chúng ta'' / ''mình'';
    giữ ý bảo toàn thể lực phòng bất trắc và xoay xở cầm cự trong lúc chờ đợi."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000377
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & tình thái: ''Captains Ahrens and Meybert''
    -> ''Hai Đại úy Ahrens và Meybert''; ''in reserve'' -> ''làm lực lượng dự bị'';
    ''additional forces'' -> ''lực lượng tăng cường''; giữ tình thái khả năng ''có
    thể tung họ vào'' và mệnh lệnh chuẩn bị cho kịch bản xấu nhất."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000378
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba dùng ''Tanya'' / ''cô''
    và quy chiếu ''Đại úy Meybert'' bằng ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000379
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chỉ thị: Tanya xưng ''tôi'', gọi ''Đại úy Meybert''
    là ''anh''; giữ chỉ thị ''trước mắt tôi muốn anh giữ cho các khẩu pháo im tiếng''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000380
  kind: terminology_and_voice
  value: 'choices=["Xưng hô câu hỏi ngắn: ''Ma’am?'' -> ''Thưa Trung tá?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000381
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya hỏi lại ''Có chuyện gì thế, Đại úy?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000382
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng & trần thuật: giữ nét lắp bắp ''K-không ạ, rõ…'';
    Meybert xưng ''Tôi''; câu trần thuật dùng ''Anh ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000383
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngắn: giữ câu ''Tanya hoàn toàn sửng sốt.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000384
  kind: terminology_and_voice
  value: 'choices=["Giọng nội tâm & dấu câu: giữ nguyên câu hỏi tu từ kết hợp cảm
    thán ''ư?!'' và câu cảm thán ''cơ mà!'' thể hiện sự kinh ngạc của Tanya trước
    việc sĩ quan pháo binh lại lo xin kiềm chế pháo kích."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000385
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Tanya xưng ''Tôi'' / ''mình'', gọi Meybert
    là ''anh'' / ''Đại úy''; giữ phủ định ''chưa bao giờ nghĩ mình sẽ nghe thấy''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000386
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Meybert dùng ''chúng tôi'' (đơn vị pháo binh)
    và ''Tôi''; giữ hai phủ định (''chẳng nhận được thêm đạn pháo nào cả'', ''không
    còn lựa chọn nào khác ngoài việc phải lưu tâm'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thành ngữ & câu hỏi tu từ: Tanya dùng ''tôi'' và ''Chúng
    ta''; ''at a snail’s pace'' -> ''chậm như rùa bò''; giữ dấu gạch ngang dài và
    câu hỏi bức xúc ở cuối."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & tình thái quá khứ: dịch ''You'' khái quát thành
    ''người ta''; giữ phủ định kết hợp tình thái ''chẳng bao giờ có thể tưởng tượng
    ra nổi tình cảnh này'' hồi còn ở học viện."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện loại trừ & tình thái trái thực tế: giữ nguyên
    ''Kampfgruppe''; giữ điều kiện loại trừ ''trừ phi đường ray bị thổi bay thành
    từng mảnh'' và tình thái ''lẽ ra không thể nào có chuyện thiếu hụt vật tư tiếp
    tế được''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Quan hệ hệ quả & phủ định: ''Bởi vậy, lẽ thường chẳng giúp ích
    được gì cho chúng ta cả.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & sắc thái: ''Council for Self-Government''
    -> ''Hội đồng Tự trị''; ''homeland'' -> ''bản quốc''; giữ phủ định ''không hề
    nhận được các chuyến hàng tiếp tế đạn pháo'' và sắc thái than thở ''tình cảnh
    tồi tệ đến mức phát khóc''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật gọi ''Tanya''; ''staying power''
    -> ''sức trụ vững''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sự tương phản giọng điệu: Tanya gọi các sĩ quan là ''các
    vị''; giữ sự tương phản hài hước giữa giọng điệu trang trọng và mệnh lệnh ''Hãy
    chuẩn bị cho binh lính dưới quyền đi chợp mắt. Khẩn trương lên.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Thoại lắp bắp & xưng hô: giữ nét lắp bắp ''T-Trung tá nói thật
    đấy ạ?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & cấu trúc điều kiện đối lập: ''vice commander''
    -> ''vị phó chỉ huy'', quy chiếu bằng ''anh ta''; trần thuật gắn với góc nhìn
    của Tanya (''cô'', ''Tanya''); giữ rõ hai mệnh đề điều kiện phân định lỗi của
    cấp dưới (quản lý thời gian kém) và lỗi của Tanya (lịch luân phiên)."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu khẳng định bằng phủ định ''Chẳng ai có thời
    gian cho kiểu sai lầm đó khi đang đánh trận cả.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh & nghĩa: ''Tuck your soldiers in'' -> ''Hãy thu xếp
    cho binh lính đi ngủ''; ''rotation'' -> ''chế độ luân phiên''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & nghĩa: giữ dấu ba chấm mở đầu câu thoại và nét nghĩa
    ''Vấn đề nan giải sẽ là kiếm đủ chỗ ngủ.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000399
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & lập luận nhân quả: ''First Lieutenant Serebryakov''
    -> ''Trung úy Serebryakov'' (quy chiếu ''cô ấy''); ''veterans'' -> ''những cựu
    binh''; ''round-the-clock interceptions'' -> ''việc đánh chặn suốt ngày đêm'';
    ''Rhine front'' -> ''mặt trận Rhine''; giữ cấu trúc nhượng bộ–tăng tiến (''hại
    da thì rõ rồi, nhưng trước hết và trên hết, nó cực kỳ tai hại cho việc đánh trận'')
    và nhận định về sự suy giảm minh mẫn tinh thần."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & mệnh lệnh: ''half-entrenched position''
    -> ''trận địa bán công sự''; ''vice commander'' -> ''vị phó chỉ huy''; giữ phủ
    định (''hoàn toàn không có đủ giường'', ''không được cắt xén nước uống hay giấc
    ngủ''), tình thái (''Có lẽ chúng ta sẽ phải tận dụng'') và mệnh lệnh đảm bảo ít
    nhất một bữa nóng trong ba bữa ngay cả khi phải dùng pháp sư làm nguồn nhiệt."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''against regulations'' -> ''trái quân quy'';
    giữ dấu ba chấm cuối câu."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & nghĩa: ''Major Weiss'' -> ''Thiếu tá Weiss'';
    ''act on their own authority'' -> ''hành động theo thẩm quyền riêng của mình'';
    giữ lời nhắc các sĩ quan cũng phải thay phiên nhau chợp mắt."]'
