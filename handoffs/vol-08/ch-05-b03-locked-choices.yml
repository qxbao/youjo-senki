choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chính xác chữ nghiêng cho vế độc
    thoại nội tâm ''*Chuyện đó sẽ gay go đây…*'' theo DEC-P01-002; trần thuật ngôi
    thứ ba theo điểm nhìn Zettour."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ & phủ định: bảo toàn chữ nghiêng toàn câu theo
    DEC-P01-002; nội tâm Zettour tự xưng ''mình'' và giữ phủ định ''đó đâu phải là
    phần việc của mình''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ, phủ định & thuật ngữ: bảo toàn chữ nghiêng
    toàn câu theo DEC-P01-002; nội tâm Zettour tự xưng ''mình''; giữ cặp nhượng bộ
    ''Dù tốt hay xấu'', cấu trúc phủ định ''chẳng còn lựa chọn nào khác ngoài việc
    phải…'' và thuật ngữ ''front lines'' -> ''tiền tuyến''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ thán từ nghi vấn ngắn gọn ''Hửm?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ nhịp biến cố đột ngột; ''over the
    radio'' -> ''qua máy vô tuyến''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại báo cáo: quy chiếu quân địch bằng ''Chúng''; ''at
    one o’clock'' -> ''ở hướng một giờ''; ''enemy tanks'' -> ''xe tăng địch''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điểm nhìn: ''Contact'' -> ''Đã chạm trán địch''; ''armored
    forces'' -> ''lực lượng thiết giáp''; giữ sắc thái khó chịu cố hữu của Zettour
    trước kẻ địch có tốc độ cao."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ, so sánh & giả định quá khứ: quy chiếu Zettour
    bằng ''Ông'', quân Đế quốc bằng ''họ''; ''encounter battle'' -> ''trận tao ngộ
    chiến''; ''Soldim 528'' -> ''Soldim 528''; giữ cấp so sánh ''kẻ địch rắc rối nhất
    khi đang ở trạng thái ít suy yếu nhất'' và giả định quá khứ ''nhưng tốt nhất vẫn
    là làm việc đó sau khi đã đột phá tới được Soldim 528''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại chỉ huy & thuật ngữ: giữ khẩu lệnh hào sảng của Cramm;
    ''anti-tank guns'' -> ''pháo chống tăng''; ''a group of tanks'' -> ''một cụm xe
    tăng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Phân biệt đại từ & phủ định: phân biệt rõ chủ thể trong cùng câu
    bằng cách quy chiếu Zettour là ''ông'' và Cramm là ''vị chỉ huy ấy'' / ''ông ta'';
    giữ phủ định ''hoàn toàn không có ý định lùi lại''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: giữ câu phủ định đồng tình ''Mà
    tất nhiên là không rồi'', tình thái bắt buộc ''nhất định phải đi đầu''; ''commander’s
    tank'' -> ''Xe tăng chỉ huy''; ''platoon'' -> ''trung đội''; ''tank regiment''
    -> ''trung đoàn xe tăng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chính xác chữ nghiêng cho câu
    hỏi nội tâm bỏ lửng ''*Nào, để xem họ sẽ làm thế nào đây…?*'' theo DEC-P01-002;
    giữ chi tiết Zettour cầm ống nhòm và mở sổ tay quan sát."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Cramm gọi Zettour là ''Thưa Tướng quân'',
    quy chiếu bằng ''ngài'' và giữ sắc thái khẩn khoản lịch sự ''xin ngài hãy lùi
    về phía sau''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, phủ định & thuật ngữ: bảo toàn chính xác chữ nghiêng
    ''*thô lỗ*'' theo DEC-P01-002; ''division commander'' -> ''vị tư lệnh sư đoàn'';
    giữ phủ định kép ''không khỏi bối rối'' và phủ định triệt để ''Ông hoàn toàn chẳng
    thể hiểu nổi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & phủ định: Zettour gọi ''Chỉ huy Cramm'', xưng
    ''tôi'' - ''ông'' và giữ phủ định ''nhưng tôi không hiểu ý ông''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu thốt sửng sốt ''Cái gì cơ?!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi: Zettour xưng ''tôi'' - ''ông'' với Cramm; giữ
    nguyên hai câu hỏi chất vấn liên tiếp."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Cramm gọi ''Thưa Tướng quân!'', xưng ''Tôi''
    và nhấn mạnh sự khác biệt phương tiện (''Tôi đang ngồi trong xe tăng! Nó có bọc
    giáp đấy!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Tình thái, câu hỏi tu từ & đại từ: giữ tình thái suy đoán ''Hẳn'',
    câu hỏi tu từ ''thế thì sao chứ?''; quy chiếu Cramm bằng ''ông ta'' từ điểm nhìn
    của Zettour; ''unarmored car'' -> ''chiếc xe không bọc giáp''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & phủ định: giữ cấu trúc lặp từ nối tiếp đoạn trước
    kèm phủ định ''Xác đáng thật đấy, nhưng điều đó chẳng có ý nghĩa gì cả''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & phủ định: Zettour gọi ''Chỉ huy Cramm'', xưng
    ''Tôi'' - ''ông''; giữ phủ định trấn an ''Nhưng ông không cần phải lo đâu''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ thán từ ngơ ngác ''Hả?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & mệnh lệnh phủ định: Zettour xưng ''tôi'' -
    ''ông'' với Cramm, quy chiếu các pháp sư hộ tống bằng ''Họ''; giữ mệnh lệnh phủ
    định ''Đừng bận tâm đến tôi; ông cứ tiếp tục đánh trận của mình đi''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & miêu tả: trần thuật quy chiếu Zettour bằng ''ông'';
    Grantz hô gọi ''Thưa Tướng quân!'' trong cơn sửng sốt giận dữ."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & đại từ: ''Colonel von Degurechaff'' -> ''Trung
    tá von Degurechaff''; ''tank desant'' -> ''chiến thuật tùng thiết trên xe tăng'';
    Zettour gọi Grantz là ''anh''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & giọng thoại: bảo toàn chính xác chữ nghiêng ''*xe
    tăng*'' theo DEC-P01-002; giữ giọng phản bác gay gắt của Grantz."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & câu hỏi nội tâm: bảo toàn chính xác chữ nghiêng cho
    câu hỏi độc thoại nội tâm ''*Cramm, rồi cả Grantz nữa—bộ cả hai người họ chỉ biết
    lặp đi lặp lại mỗi ngần ấy lời thôi sao?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Tình thái, đại từ & thuật ngữ: giữ tình thái ''Có lẽ''; quy chiếu
    Zettour bằng ''ông''; ''current paradigm'' -> ''mô thức tư duy hiện tại''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & phủ định: Zettour gọi ''Trung úy Grantz'', dùng
    đại từ bao gộp ''chúng ta'' và giữ cấu trúc đối lập phủ định ''công nghệ chỉ là
    công cụ, chứ không phải thứ chúng ta có thể để mặc cho nó chi phối mình''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, điều kiện & phủ định: Grantz gọi Zettour là ''ngài'';
    ''open-top car'' -> ''chiếc xe mui trần''; giữ câu điều kiện cảnh báo và câu phủ
    định nhấn mạnh ''Lớp giáp đâu phải chỉ để làm cảnh!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & đại từ: bảo toàn chính xác chữ nghiêng ''*À.*'' theo
    DEC-P01-002; quy chiếu Grantz bằng ''anh''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''multipurpose vehicle'' -> ''chiếc
    xe đa dụng''; quy chiếu Grantz bằng ''anh''; giữ phủ định dứt khoát ''tuyệt đối
    không thể làm theo lời khuyên của anh được''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & câu hỏi tu từ: Zettour xưng ''tôi'', gọi Grantz
    là ''Anh'' / ''Trung úy'', dùng ''chúng ta'' cho phe mình; giữ trọn chuỗi ba câu
    hỏi chất vấn liên tiếp."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Phân biệt đại từ & tình thái: phân biệt rõ đại từ sở hữu giữa
    Zettour (''sự liều lĩnh của ông'') và Grantz (''trong tâm trí anh''); giữ tình
    thái phỏng đoán ''có lẽ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Zettour bằng ''ông'' trong lời tự nhìn
    nhận ''Mà quả thực ông đang hành động thiếu thận trọng''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Đại từ & chuyển ý: quy chiếu Zettour bằng ''Ông'', tự quy chiếu
    phản thân bằng ''mình''; giữ nhịp chuyển ý dứt khoát ở câu cuối ''Nhưng điều đó
    là cần thiết.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & cấu trúc chêm: bảo toàn chính xác chữ nghiêng ''*cần
    thiết*'' đặt trong cặp dấu gạch ngang theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & chuỗi điều kiện: Zettour gọi ''Trung úy'',
    xưng ''tôi''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''; giữ chuẩn hai
    mệnh đề điều kiện - hệ quả kèm tình thái khả năng (''có thể khiến…'', ''có lẽ
    sẽ chẳng thể diễn ra'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái lễ độ: Grantz mở đầu bằng ''Với tất cả lòng
    kính trọng, thưa Tướng quân'' và khẳng định tính chất chính thức của hoạt động
    quân sự."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ lời nhận xét điềm tĩnh của Zettour ''Đó là một
    câu trả lời rất đúng mực của một quân nhân.''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ & điều kiện: bảo toàn chữ nghiêng toàn câu theo
    DEC-P01-002; trong nội tâm Zettour quy chiếu Grantz bằng ''cậu ta'' và giữ mệnh
    đề điều kiện rào đón ''*Đó là nếu như cậu ta thực sự tin vào điều ấy.*''"]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Phân biệt đại từ, phủ định & nhân vật: quy chiếu Zettour bằng
    ''ông'', Grantz bằng ''anh''; giữ phủ định ''Zettour không cho rằng bản thân Grantz
    nắm rõ mọi uẩn khúc'' và định danh ''Degurechaff''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Đại từ, câu hỏi, điều kiện & phủ định: Zettour xưng ''tôi'', gọi
    Grantz là ''Anh'', dùng ''quân ta'' / ''chúng ta''; giữ câu hỏi phủ định + điều
    kiện ở đầu đoạn và cấu trúc điều kiện phủ định ở câu cuối (''Không có một đòn
    tấn công mạnh mẽ, tôi e rằng chúng ta chẳng thể phá vỡ được vòng vây đâu'')."]'
