choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và quân hàm: Zettour xưng ''Ta'', gọi Grantz là ''Trung
    úy ạ'' và ''cậu''; giữ cấu trúc rào đón ''Ta không nói việc suy nghĩ nghiêm túc
    là sai... nhưng có lẽ cậu nên xem xét lại lối tư duy của mình.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và sắc thái ngập ngừng của Grantz: ''T-Tôi không chắc
    là mình hiểu ý ngài ạ?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: Zettour xưng ''ta'', gọi ''cậu''; ''một
    sĩ quan đàng hoàng'' (a decent officer), ''hậu phương'' (the rear)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Đạn pháo, những tiếng nổ, tiếng
    la hét và đủ thứ mùi hôi thối xộc thẳng vào mũi… Trong lịch sử nhân loại, đã có
    bao nhiêu cuộc đối thoại diễn ra giữa một khung cảnh thế này nhỉ?*'' đúng phạm
    vi in nghiêng của nguồn theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Giữa một chiến trường mà ngay bên
    ngoài trận địa của chúng ta, xe tăng và pháo chống tăng quân mình đang giao chiến
    ác liệt với xe tăng địch, thế mà mình lại thảnh thơi đến lạ.*'' ở câu nội tâm
    đầu đoạn theo DEC-P01-002.", "Đại từ, xưng hô và thuật ngữ: nội tâm Zettour dùng
    ''chúng ta'', ''quân mình'', ''mình''; trần thuật dùng ''Ông''; thoại xưng ''ta'',
    gọi ''cậu''; giữ ''pháo chống tăng'' (anti-tank guns)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và đại từ: ''Cậu chàng này'' (This guy - chỉ Grantz),
    ''Trung tá von Degurechaff'' (Colonel von Degurechaff)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Đừng nghĩ ngợi gì cả*'' đúng cụm
    in nghiêng trong nguồn theo DEC-P01-002.", "Đại từ: dùng ''cô ấy'' chỉ Tanya dưới
    góc nhìn của Zettour."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và đại từ trong thoại Zettour: gọi Tanya là ''cô ấy'',
    tự xưng ''ta'' (''một lão già đang lải nhải''), gọi Grantz là ''Cậu''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Đại từ và thuật ngữ: ''ông'' (Zettour), ''các pháp sư Đế quốc''
    (imperial mages), ''một người trực tiếp chiến đấu ngoài thực địa'' (someone in
    the field)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: ''Trung úy'' (Lieutenant), ''Cậu'', ''đơn
    vị pháp sư trên không kia của quân ta'' (that aerial mage unit of ours)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và mức độ đánh giá: ''ở mức đạt yêu cầu ạ'' (passable),
    ''Các bài bản tấn công mặt đất'' (surface attack patterns), ''cũng không tệ''
    (aren’t bad, either)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ và sắc thái nhận xét: ''Trung úy Grantz'', ''anh'',
    ''dè dặt chưa muốn đưa ra phán xét hơn là khen ngợi'' (less praise than withholding
    judgment), ''gần như hoàn toàn tiêu cực'' (close to completely negative)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Zettour: ''Lời khen đó nghe chẳng mấy tích cực
    nhỉ. Sao lại thế?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Thoại đánh giá của Grantz: ''Chiến thuật của họ quá cứng nhắc…'',
    ''dấu hiệu cho thấy họ chỉ được rèn luyện một số động tác nhất định''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi ngắn của Zettour: ''Dấu hiệu như thế nào?'' (liên kết
    trực tiếp với từ ''dấu hiệu'' ở p000222)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Mô tả hành động: ''Grantz ngậm miệng lại một thoáng để suy nghĩ.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và đối lập cách làm: Grantz xưng ''tôi'', đối chiếu ''áp
    dụng các cách tiếp cận khác nhau'' với ''lặp đi lặp lại cùng những khuôn mẫu cũ''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu hỏi tóm lược của Zettour: ''Thay vì linh hoạt chọn
    ra phương án tối ưu ngay tại chỗ, họ chỉ chọn lấy một bài trong danh mục hạn hẹp
    có sẵn ư?''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: ''Vâng ạ'' (Yes, sir), ''các pha cơ động
    của họ quá dễ đoán'' (their maneuvers are too predictable), ''quá trình đào tạo
    cấp tốc'' (accelerated education)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000228
  kind: terminology_and_voice
  value: 'choices=["Liên hệ chiến cuộc của Zettour: ''những trận không chiến ở phía
    tây'' (the aerial battles in the west), ''gia tăng được quân số trên sổ sách''
    (increase the head count)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000229
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và đối lập thời gian: ''số binh lính chưa được huấn
    luyện đầy đủ'' (under-trained troops), ''đại đội pháp sư trên không hiện nay''
    (an aerial mage company now), ''các đơn vị thời trước chiến tranh'' (prewar units),
    ''thời gian đào tạo'' (education duration)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000230
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ nhân sự và huấn luyện: ''binh lính và sĩ quan được huấn
    luyện bài bản'' (fully trained soldiers and officers), ''chương trình huấn luyện
    rút gọn, cấp tốc do thiếu hụt nhân sự'' (shortened, accelerated training due to
    lack of personnel)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Lục quân Đế quốc'' (Imperial Army), ''những người
    soạn thảo kế hoạch tác chiến'' (operation drafters)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: Zettour gọi ''cậu'', xưng ''ta'' / ''chúng
    ta''; ''Tiểu đoàn Pháp sư Trên không số 203'' (203rd Aerial Mage Battalion), ''đấu
    tập một trận'' (fight a mock battle)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Đại từ và tỷ lệ tương quan lực lượng: Grantz xưng ''Chúng tôi''
    (đại diện Tiểu đoàn 203); ''một nửa hoặc thậm chí một phần ba quân số của mình''
    (half or even a third of our personnel)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Đối lập hoàn cảnh: ''tự tin thái quá—trong những hoàn cảnh bình
    thường'' đối lập với ''trên chiến trường, dưới sự bảo vệ của họ, Zettour có thể
    hiểu rằng đó là sự thật đúng theo nghĩa đen''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000235
  kind: terminology_and_voice
  value: 'choices=["Đại từ, ẩn dụ và thuật ngữ: ''Ông'' (Zettour), ''những quân cờ
    của mình'' (his playing pieces), ''những pháp sư kia của quân ta'' (mages of ours
    - chỉ đơn vị pháp sư thông thường đang quan sát), ''pháp sư trên không của Liên
    bang'' (Federation aerial mages)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000236
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ và mức độ chắc chắn: Grantz xưng ''Tôi'', dùng
    ''họ'' chỉ các pháp sư thông thường của Đế quốc; giữ sắc thái đánh giá ''có lẽ
    họ có thể đánh ngang ngửa hoặc nhỉnh hơn một chút. Tôi chắc chắn không nghĩ rằng
    họ sẽ lép vế.''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000237
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ: Zettour gọi ''Cậu''; ''các pháp sư trên
    không của Đế quốc'' (imperial aerial mages), ''pháp sư Liên bang'' (Federation
    mages)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000238
  kind: terminology_and_voice
  value: 'choices=["Phân biệt đại từ và thuật ngữ: ''chúng tôi'' (Tiểu đoàn 203 đã
    giao chiến) và ''chúng ta'' (phe Đế quốc nói chung); ''quân Liên bang'' (Federation
    troops), ''lực lượng pháp sư Cận vệ theo lời đồn đại'' (the rumored guard mages)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000239
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và đại từ trần thuật: ''Vị trung úy'' (The lieutenant),
    ''anh'' (Grantz)."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000240
  kind: terminology_and_voice
  value: 'choices=["Đại từ và thuật ngữ: ''Anh'' (Grantz), ''khoảng cách trình độ
    giữa pháp sư Đế quốc và pháp sư Liên bang'' (the skill gap between imperial and
    Federation mages)."]'
