choices:
- segment_id: YS-LN08/Text/chapter016.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Grantz báo cáo với Zettour bằng ''thưa Tướng
    quân... ạ''; khóa ''Đại tá von Lergen''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Zettour tự xưng ''tôi'' khi ra lệnh cho Grantz
    đưa nội dung bức điện."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Grantz đáp lễ phép ''Vâng, thưa ngài, của
    ngài đây ạ''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Định dạng điện văn, dấu nháy đơn & thuật ngữ: giữ nguyên dấu nháy
    đơn và từ ngữ khớp với p000565 của ch-04-b15 (''Từ chỉ huy trưởng Kampfgruppe
    Lergen gửi ‘Tướng von Zettour’: ‘Đại tá von Lergen’ sẽ lập tức bắt đầu các hành
    động ‘đã ấn định’ ư?''); khóa ''Trung úy Grantz'' và ''quả cầu''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Câu ngắn trần thuật: giữ nguyên ''Rõ ràng và súc tích.''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, giả định & đại từ: chỉ in nghiêng câu nội
    tâm đầu đoạn bằng ''*...*'' theo DEC-P01-002; giữ giả định trái thực tế ''Nếu
    cô ấy không nắm được ý định của mình, hẳn cô ấy đã chẳng thể hồi âm...''; quy
    chiếu Zettour bằng ''mình'' (nội tâm) / ''ông'' (trần thuật) và Tanya bằng ''cô
    ấy'' / ''cô''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: khóa ''Trung úy Grantz'', ''Kampfgruppe Lergen'',
    đại từ gộp ''chúng ta'' và cụm ''tạo thế gọng kìm kẹp chặt quân địch''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô & quân hàm: trần thuật gọi Grantz là ''Anh'';
    trong thoại Grantz gọi Zettour là ''Thưa Tướng quân'' / ''ngài'' và gọi Tanya
    (''Colonel von Degurechaff'') là ''Trung tá von Degurechaff''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Phủ định dứt khoát: giữ nguyên ''“Không, hoàn toàn không phải.”''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng: giữ nguyên ''“Hả? Nhưng nếu vậy thì bức điện
    hồi âm này…”''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & chức danh: ''Lieutenant Grantz'' -> ''Trung úy Grantz'';
    ''staff officer'' -> ''sĩ quan tham mưu''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, chức danh & đại từ: ''magic officer'' -> ''sĩ
    quan ma pháp''; chỉ in nghiêng câu hỏi tự vấn nội tâm của Zettour ở cuối đoạn
    bằng ''*...*'' theo DEC-P01-002; Zettour tự xưng ''mình'' và gọi Grantz là ''cậu
    ta'' trong nội tâm."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & chức danh: giữ cấu trúc phủ định ''Bất kỳ ai không
    hiểu được những vấn đề cần thiết vào đúng thời điểm cần thiết thì đều không thể
    được gọi là một sĩ quan tham mưu thực thụ''; khóa ''Trung úy''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Tổ chức & phủ định đính chính: ''Imperial Army'' -> ''Lục quân
    Đế quốc''; giữ câu phủ định đính chính ''Không, đó thậm chí chẳng phải là bí quyết
    gì.''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ in nghiêng cụm ''*có nghĩa*''
    tương ứng với thẻ em trong nguồn theo DEC-P01-002; khóa ''sĩ quan tham mưu'' và
    ''Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, chức danh & đại từ: Zettour tự xưng ''Tôi'', gọi Tanya
    là ''Trung tá von Degurechaff'' / ''cô ấy''; khóa ''sĩ quan tham mưu''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Chức danh: giữ nguyên ''Những thế mạnh của một sĩ quan tham mưu…''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc bổ sung: ''offensive'' -> ''cuộc tiến công'';
    ''autonomous judgments'' -> ''những phán đoán tự chủ''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ khái niệm: ''act on their own discretion'' -> ''tự chủ
    hành động theo quyền tự quyết''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Tổ chức, thuật ngữ & châm ngôn: giữ châm ngôn ''Tất cả trong một
    và một trong tất cả''; khóa ''Bộ Tổng tham mưu'', ''chương trình đào tạo sĩ quan
    tham mưu'' và ''tác chiến dã chiến''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Đại từ trong thoại: Zettour tự xưng ''tôi'', quy chiếu Tanya bằng
    ''cô ấy''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Chức danh & quan hệ nhân quả: khóa ''các sĩ quan tham mưu'', ''quyền
    tự quyết'' và mệnh đề kết quả ''sự đồng bộ và phối hợp nhịp nhàng một cách tự
    nhiên''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & chức danh: khóa ''Sĩ quan ma pháp Degurechaff''
    và ''sĩ quan tham mưu''; chỉ in nghiêng câu cảm thán nội tâm cuối đoạn ''*Thật
    quá đỗi thú vị.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Đại từ gộp trong thoại: giữ ''chúng ta'' trong lời cảm thán của
    Zettour."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Đối lập thời gian & đại từ: giữ đối lập giữa ''Trước đây, ông
    từng cảm thấy hơi nhói lòng...'' và ''nhưng khi đã đi đến nước này, ông cảm thấy
    phấn khích nhiều hơn là do dự hay cắn rứt lương tâm''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: in nghiêng toàn bộ câu nội tâm ''*Cô
    ấy vốn là người như thế mà.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điều kiện & đại từ khái quát: in nghiêng toàn
    bộ câu nội tâm bằng ''*...*''; dịch đại từ khái quát ''you'' là ''người ta'',
    quy chiếu Tanya bằng ''cô ấy''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc so sánh: ''the rear'' -> ''hậu phương'';
    giữ so sánh đối lập giữa những kẻ ở hậu phương không hiểu dù được giải thích từng
    li từng tí với người chỉ cần nói qua là hiểu ngay."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ cơ giới: giữ nguyên ''ngay cả một sĩ quan cũng chỉ là một
    bánh răng trong cỗ máy''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & phủ định tuyệt đối: giữ cấu trúc ''bất cứ thứ gì ngoài
    năng lực ra đều chỉ là sự ủy mị vụn vặt mà thôi''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Chức danh & sắc thái: ''vicious staffer'' -> ''một sĩ quan tham
    mưu sắc sảo đến đáng gờm''; giữ đại từ ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái & đại từ: in nghiêng toàn bộ câu
    nội tâm ''*Ắt hẳn ngay lúc này đây chúng ta cũng đang hô vang những lời giống
    hệt nhau.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Tự đính chính trần thuật & câu hỏi tu từ: giữ nhịp ''Thích thú—không,
    vui sướng từ tận đáy lòng'' và câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter016.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh xuất quân: ''offensive'' -> ''Cuộc tiến công''; giữ
    nhịp mệnh lệnh dứt khoát ''“Cuộc tiến công này chính thức bắt đầu! Chúng ta tiến
    quân. Xuất phát thôi nào.”''."]'
