choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & giọng thoại: trần thuật dùng tên riêng
    ''Tanya''; giữ nguyên ''Kampfgruppe'' và câu hỏi tu từ cảm thán ''ai mà chẳng
    muốn than vãn đôi câu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=["Tình thái quá khứ & thuật ngữ: giữ sắc thái giả định trái thực
    tế ''Đúng lý ra, công việc này chí ít cũng phải giao cho một sư đoàn''; ''division''
    -> ''sư đoàn''; ''Kampfgruppe'' -> ''Kampfgruppe''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: trong thoại Tanya tự xưng ''Tôi'' và giữ
    giọng phân trần tự nhiên."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật ngôi thứ ba dùng ''Tanya''
    và ''họ''; giữ hai cấu trúc phủ định (''đâu có hứng thú'', ''không nói gì'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: ''Lieutenant Tospan'' -> ''Trung
    úy Tospan''; ''Lieutenant Wüstemann'' -> ''Trung úy Wüstemann''; ''collections''
    -> ''việc thu gom'' (đồng bộ với lô ch-04-b08); Tanya tự xưng ''Tôi'' / ''tôi'',
    gọi hai trung úy là ''hai anh'' / ''anh'' và quy chiếu chéo bằng ''anh ấy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Dấu ngoặc kép đôi & xưng hô: bảo toàn cặp ngoặc kép đôi đồng thanh
    ''““Rõ, thưa Trung tá!””'' (''ma’am'' -> ''thưa Trung tá'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, giả định & phủ định: giữ sự chuyển dịch điểm
    nhìn từ trần thuật ngôi thứ ba (''cô'', ''Tanya'', ''họ'') sang độc thoại nội
    tâm ngôi thứ nhất (''của mình'') theo DEC-P01-001; ''human resources'' -> ''nguồn
    nhân lực''; giữ câu điều kiện (''Nếu buộc phải chọn một...''), dấu chấm lửng và
    hai cấu trúc phủ định (''Chẳng còn lựa chọn nào khác ngoài...'', ''cũng không
    phải là một ý tồi'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật dùng ''cô'' / ''Cô''
    và ''họ''; câu nhận định khái quát cuối đoạn dùng đại từ khái quát ''bạn''; giữ
    phủ định mức độ ''hoàn toàn không có ý định trở thành kẻ bất tài đến mức cản đường
    thăng tiến của cấp dưới''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tình thái: độc thoại nội tâm ngôi thứ nhất
    của Tanya tự quy chiếu bằng ''mình'' theo DEC-P01-001; ''HR'' -> ''phòng nhân
    sự''; giữ quan hệ nhượng bộ (''Tuy... nhưng...'') và tình thái (''có lẽ mình nên
    thừa nhận'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000302
  kind: terminology_and_voice
  value: 'choices=["Giọng độc thoại thành tiếng, đại từ, phủ định & dấu câu: giữ dấu
    chấm lửng, đại từ khái quát ''bạn'' kết hợp tự quy chiếu ''mình''; ''in the field''
    -> ''ngoài chiến trường''; giữ phủ định ''Không thể lơ là'' và kết câu bỏ lửng
    ''nhưng dẫu sao thì''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ, điểm nhìn, thuật ngữ & quân hàm: ''necessity is the
    mother of invention'' -> ''cái khó ló cái khôn''; ''human resources'' -> ''nguồn
    nhân lực''; ''human infrastructure'' -> ''Cơ sở hạ tầng nhân lực''; ''the Empire''
    -> ''Đế quốc''; ''Lieutenants Tospan and Wüstemann'' -> ''hai Trung úy Tospan
    và Wüstemann''; trần thuật dùng ''Tanya'' và ''cô'', giữ cấu trúc mức độ – hệ
    quả (''mong manh đến mức... bất chấp...'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000304
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nhịp câu: giữ câu cảm thán ngắn ''Đúng là một mớ hỗn
    độn.'' và câu trần thuật ''Tanya lắc đầu.''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=["Định dạng tiêu đề: dịch toàn bộ chữ in hoa ''NGÀY 18 THÁNG 6 NĂM
    THỐNG NHẤT 1927, SỞ CHỈ HUY CỤM B ĐẠO QUÂN PHÍA ĐÔNG, PHÒNG TÁC CHIẾN'', không
    thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000306
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điểm nhìn: ''war room'' -> ''phòng tác chiến''; ''B
    Group HQ'' -> ''Sở chỉ huy Cụm B''; giữ trần thuật ngôi thứ ba khách quan."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000307
  kind: terminology_and_voice
  value: 'choices=["Giọng trần thuật: giữ câu nhận xét ngắn gọn ''Phần đó thì không
    có gì đáng nói.''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000308
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''Staff officers'' -> ''các sĩ quan tham
    mưu''; giữ cấu trúc so sánh ngang bằng ''cũng tự nhiên như chuyện con người ta
    hít thở vậy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, chức danh, quân hàm & thành ngữ: giữ dấu hai chấm; ''The
    inspector and supervisor nominally in charge'' -> ''Thanh tra viên kiêm người
    giám sát phụ trách trên danh nghĩa''; ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; chuyển dịch thành ngữ chỉ sự im bặt thành ''xem chừng cả
    đám đều đã câm như hến''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000310
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tên đơn vị: Zettour gọi các sĩ quan là ''Thưa các quý
    ông'' / ''các vị'' và tự xưng ''tôi''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000311
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''The staffers of B Group'' -> ''Các sĩ quan tham mưu
    Cụm B''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000312
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, tên đơn vị & đại từ: giữ dấu gạch ngang dài ngắt lời
    ở cuối câu thoại; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''; trần thuật
    quy chiếu viên sĩ quan bằng ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, giọng mỉa mai & thuật ngữ: giữ giọng mỉa mai của Zettour
    (''Thưa các quý ông'', ''các vị'', ''tôi''); trần thuật dùng ''Zettour'' và ''anh
    ta''; ''Soldim 528'' -> ''Soldim 528''; ''isolated stronghold'' -> ''cứ điểm kiên
    cố đang bị cô lập''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000314
  kind: terminology_and_voice
  value: 'choices=["Phủ định, dấu câu, thuật ngữ & đại từ: giữ phủ định kép ''chẳng
    thể nào hiểu lầm'', dấu chấm lửng và dấu gạch ngang dài; ''Federation'' -> ''Liên
    bang'', quy chiếu bằng ''chúng''; ''strategic urban rail stop'' -> ''trạm dừng
    đường sắt đô thị mang tính chiến lược''; giữ phủ định nhấn mạnh ở mệnh đề quan
    hệ ''nơi rõ ràng không phải là điểm nóng giao tranh ác liệt nhất''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000315
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, thuật ngữ & đại từ: ''enemy manpower'' -> ''sinh lực
    địch''; giữ dấu gạch ngang dài và đại từ ''họ'' chỉ phía Đế quốc."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000316
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & giọng mỉa mai: Zettour tự xưng ''Tôi'' / ''tôi'',
    gọi viên sĩ quan vừa phát biểu là ''anh''; giữ phủ định ''mà không cần anh phải
    nói đâu'' và giọng cảm ơn mỉa mai."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000317
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quan hệ tương phản: giữ câu trần thuật ngắn mở đầu
    bằng ''Nhưng'' và tên riêng ''Zettour''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000318
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi trực tiếp: giữ câu hỏi ngắn gọn, sắc lạnh ''“Tại sao kế
    hoạch giải cứu lại chậm tiến độ?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu & nhấn mạnh Markdown: trần thuật quy chiếu Zettour
    bằng ''Ông'' / ''ông'', các sĩ quan tham mưu bằng ''họ''; giữ dấu gạch ngang dài
    và bảo toàn chính xác phạm vi chữ nghiêng ''*Thật không thể tin nổi*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & thuật ngữ: Zettour gọi ''Các vị'' / ''các
    vị''; giữ sắc thái trách cứ ''Đáng lẽ họ phải được bố trí sẵn... rồi'' và suy
    đoán ''hẳn vẫn còn... chứ''; ''B Group’s strategic reserves'' -> ''lực lượng dự
    bị chiến lược của Cụm B''; ''unit dedicated to rapid response'' -> ''đơn vị chuyên
    trách phản ứng nhanh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & xưng hô: giữ dấu chấm lửng mở đầu và cách xưng hô ''Thưa
    Tướng quân''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000322
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ phủ định & thuật ngữ: giữ câu hỏi phản bác ''“Chừng
    đó chẳng phải là quá đủ rồi sao?”''; ''whining B Group staffers'' -> ''đám sĩ
    quan tham mưu Cụm B đang than vãn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000323
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, cơ quan, thuật ngữ & phủ định: ''Lieutenant General
    von Rudersdorf'' -> ''Trung tướng von Rudersdorf''; ''Operations staff'' -> ''các
    sĩ quan tham mưu... thuộc Cục Tác chiến''; ''concentration of force'' -> ''tập
    trung binh lực''; giữ phủ định giới hạn ''nhưng không đến mức để sườn của mình
    hoàn toàn bỏ ngỏ''; ''divisions of armor, mechanized infantry, and regular infantry''
    -> ''các sư đoàn thiết giáp, bộ binh cơ giới và bộ binh thông thường''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phủ định & xưng hô: giữ câu hỏi chất vấn ''“Tại sao các
    vị không điều động họ?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=["Điều kiện phủ định, thuật ngữ, xưng hô & dấu câu: giữ điều kiện
    ''Nếu không được phép thất bại, thì chúng ta cần phải...''; ''Imperial Army''
    -> ''Lục quân Đế quốc''; ''eastern front'' -> ''mặt trận phía đông''; sĩ quan
    tham mưu tự xưng ''tôi'', gọi Zettour là ''ngài''; giữ dấu chấm lửng bỏ lửng cuối
    câu."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & giả định quá khứ: bảo toàn chính
    xác phạm vi chữ nghiêng ''*Chuyện đó tôi biết thừa rồi*'' theo DEC-P01-002 (nội
    tâm Zettour tự xưng ''tôi'', không mở rộng quy ước ''mình'' của Tanya theo DEC-P01-001);
    giữ giả định trái thực tế ''lẽ ra phải được đảm nhiệm bởi tối thiểu ba sư đoàn''."]'
