choices:
- segment_id: YS-LN08/Text/chapter004.xhtml/p000370
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Andrew xưng ''Tôi'', gọi Lieutenant Colonel
    Drake là ''thưa Trung tá'' (dịch từ cách gọi tắt ''Colonel'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000371
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái phủ định & giả định: ''Imperial Army'' ->
    ''Lục quân Đế quốc''; ''reserves'' -> ''lực lượng dự bị''; ''reinforcements''
    -> ''viện binh''; ''encirclement'' -> ''vòng vây''; giữ tình thái phủ định ''hẳn
    là không còn đủ... để vắt ra thêm chút viện binh nào nữa đâu'' và mệnh đề điều
    kiện bỏ lửng ở cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000372
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi suy luận: ''the Empire'' -> ''Đế quốc''; giữ
    tình thái ''ắt hẳn'' và câu hỏi ''Ngay cả Đế quốc ắt hẳn cũng đang bị dàn trải
    quá mỏng sao?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000373
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & nhấn mạnh nghĩa: giữ cặp dấu nháy đơn quanh cụm ''‘nhất
    là Đế quốc’'' (không dùng chữ nghiêng vì nguồn không có thẻ nhấn mạnh)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000374
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: người kể chuyện ngôi thứ nhất Andrew
    xưng ''tôi'', quy chiếu Drake bằng ''ông ấy''; giữ phủ định ''tôi không hiểu tại
    sao''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000375
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & độc thoại nội tâm: Andrew dùng ''tôi'' và tự quy chiếu
    bằng ''mình''; giữ dấu chấm lửng và sắc thái tự nhủ ''Ít nhất mình cũng nên thử
    hỏi xem sao''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000376
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô trong thoại: ''Colonel Drake'' -> ''Trung tá
    Drake''; Andrew gọi Drake là ''Ngài''/''ngài'' và xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000377
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Drake gọi tên ''Andrew'' và dùng đại từ ''cậu''
    (kèm phản thân ''mình''); ''The Empire'' -> ''Đế quốc''; giữ câu hỏi trách nhẹ
    ở đầu đoạn."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000378
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Andrew gọi Drake là ''ngài'', quy chiếu phía
    Đế quốc bằng ''họ''; giữ câu hỏi xác nhận."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000379
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & cấu trúc: Drake gọi Andrew là ''cậu'',
    dùng ''chúng ta'' và quy chiếu Đế quốc bằng ''họ''; trần thuật gọi Drake là ''ông
    ấy''; giữ cấu trúc gác lại hai vế đối lập và kết luận ''đó là một bài toán mà
    thôi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000380
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tên riêng & xưng hô: liên kết tự nhiên với đoạn trước
    bằng câu hỏi ''Toán học ư?''; ''Mr. Johan'' -> ''thầy Johan''; Andrew xưng ''Tôi''/''tôi''/''mình''
    và gọi Drake là ''ngài''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000381
  kind: terminology_and_voice
  value: 'choices=["Phủ định, nhượng bộ & thuật ngữ: giữ phủ định ''Chẳng có gì khó
    hiểu cả đâu''; Drake gọi Andrew là ''cậu''; ''the Empire'' -> ''Đế quốc''; giữ
    cấu trúc nhượng bộ ''Cho dù... đi chăng nữa, thì... cũng chỉ có giới hạn mà thôi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000382
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & tình thái: giữ dấu chấm lửng mở đầu và tình thái suy
    đoán ''hẳn là giờ đây họ đang tiến gần đến giới hạn đó''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000383
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, quan hệ đối lập & tình thái: ''Imperial Army'' -> ''Lục
    quân Đế quốc''; ''homeland'' -> ''bản quốc''; ''diplomatic and political fronts''
    -> ''mặt trận ngoại giao lẫn chính trị''; giữ phép so sánh một chọi năm/sáu, quan
    hệ đối lập và tình thái ''dường như vẫn muốn tiếp tục chiến đấu''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000384
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ nguyên độ mở và sắc thái tự vấn ''Phải chăng
    chiến tranh gây ra tác động có hại lên tâm trí con người?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000385
  kind: terminology_and_voice
  value: 'choices=[''Tình thái dự báo & dấu câu: giữ quan hệ kéo theo ở tương lai
    và dấu chấm than cuối câu thoại.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000386
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & trạng thái chưa xảy ra: Andrew xưng ''Tôi''/''mình'';
    giữ đúng nghĩa ''suýt thì buột miệng nói ra'' (thực tế đã kìm lại, chưa nói ra)."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & bị động: ''scoop'' -> ''Tin độc quyền''; ''Federation
    overseer'' -> ''một giám sát viên của Liên bang''; giữ cấu trúc bị động đã hoàn
    thành."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nhân quả mức độ: ''replacement film'' -> ''cuộn phim
    thay thế''; ''darkroom'' -> ''buồng tối''; giữ quan hệ mức độ ''tệ hại đến mức
    tôi chỉ muốn khóc''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giới hạn nhận thức: ''total war'' -> ''chiến
    tranh tổng lực''; ''The Federation'' -> ''Liên bang''; ''child soldiers'' -> ''lính
    trẻ em''; giữ phủ định kèm giới hạn nhận thức ''vẫn chưa bắt đầu phải dùng đến
    lính trẻ em… theo những gì tôi được biết'' và câu giải thích có hai phủ định ở
    cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Quan hệ so sánh & thuật ngữ: ''the Empire'' -> ''Đế quốc''; ''sortieing
    with guns'' -> ''vác súng xuất kích''; giữ sắc thái so sánh hơn kém."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & câu hỏi phản vấn: ''Colonel'' -> ''thưa Trung
    tá''; Andrew gọi Drake là ''ngài'', dùng ''chúng ta'' cho phe mình; ''checkmate''
    -> ''chiếu hết''; giữ hai câu hỏi phản vấn liên tiếp."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Giả định chung trong thoại: dịch tự nhiên cấu trúc giả định ngôi
    thứ hai khái quát thành ''Ai cũng sẽ nghĩ như vậy, đúng không?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: Andrew đáp ''Vâng'', xưng ''Tôi''; giữ
    trạng ngữ ''Xét một cách hợp lý'' và tình thái ''có vẻ như Đế quốc sẽ sớm phải
    bỏ cuộc thôi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & từ vựng liên kết: Drake gọi Andrew là ''Cậu''; dịch
    ''sensible guy'' là ''một anh chàng có đầu óc hợp lý'' để giữ mạch liên kết từ
    vựng với p000393 và p000397."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thoại ngắn: Andrew xưng ''tôi''; giữ tiếng đáp lấp
    lửng ''Ừm…''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & mệnh lệnh: ''imperials'' -> ''người Đế
    quốc''; giữ tình thái ''đều có khả năng bị điên cả đấy'' và lời dặn của Drake
    (xưng ''tôi'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & trần thuật: ''a sensible Commonwealth soldier''
    -> ''một người lính Khối Thịnh vượng chung có đầu óc hợp lý''; Andrew xưng ''tôi'',
    gọi Drake là ''Ngài''; giữ hình ảnh so sánh chìa sổ tay như chiếc micro."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phạm vi ngoại trừ & xưng hô: ''volunteer mages from
    the Entente Alliance'' -> ''các pháp sư tình nguyện đến từ Liên minh Hiệp ước'';
    giữ giới hạn ngoại trừ ở câu đầu, câu hỏi phản vấn ở câu thứ hai và xưng hô ''tôi''
    - ''cậu'' của Drake."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000399
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & dấu câu: ''Colonel'' -> ''Thưa Trung tá'';
    Andrew gọi Drake là ''ngài'', xưng ''tôi''; giữ câu điều kiện bỏ lửng cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi ngăn cản & thuật ngữ: Drake xưng ''tôi'', gọi
    ''cậu'' và tên ''Andrew''; giữ câu hỏi can ngăn ''Cậu có thể làm ơn đừng khơi
    lại vết thương... được không?''; ''mages'' -> ''các pháp sư''; ''on the Rhine''
    -> ''ở mặt trận Rhine''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: Andrew xưng ''Tôi''; giữ phủ định toàn phần
    ''chẳng thể nói lại được lời nào trước câu đó''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: Drake xưng ''Tôi'', gọi Andrew là ''cậu'';
    giữ dấu chấm lửng giữa câu thoại."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Andrew xưng ''Tôi''/''tôi'', gọi Drake là ''Ngài''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000404
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, quân hàm & đối lập: Andrew xưng ''Tôi''; dịch ''the
    colonel'' (quy chiếu Lieutenant Colonel Drake) thành ''vị trung tá''; giữ quan
    hệ đối lập ''nhưng''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & tên riêng: ''Imperial Army lieutenant general
    called Zettour'' -> ''vị trung tướng Lục quân Đế quốc tên là Zettour''; Drake
    gọi Andrew là ''Cậu''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & câu hỏi: Andrew xưng ''tôi''/''mình'', quy
    chiếu Zettour bằng ''ông ta''; giữ dấu chấm lửng và câu hỏi không chắc chắn ''Tôi
    nghĩ ông ta quản lý đường sắt phải không nhỉ?''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000407
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & chuỗi phủ định: Andrew xưng ''Tôi'', gọi Zettour
    là ''ông ta''; giữ đầy đủ chuỗi phủ định và quan hệ nhân quả giải thích vì sao
    cái tên đó không để lại ấn tượng lớn."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái khuyên nhủ: Drake gọi Andrew là ''cậu''; giữ
    sắc thái khuyên bảo ''Đó là một người mà cậu nên ghi nhớ thì hơn''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp ngắn: dịch ''Okay.'' của Andrew đối với cấp trên/người
    đối thoại thành ''Vâng.''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thành ngữ & dấu câu: giữ câu hỏi ngắn ''Chỉ có thế
    thôi ư?''; Andrew xưng ''Tôi'', quy chiếu Drake bằng ''ông ấy''; giữ thành ngữ
    ''trôi tuột từ tai này sang tai kia'' và dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đối lập thời gian: giữ rõ sự chuyển dịch từ hồi ức
    quá khứ về thời điểm hiện tại của người kể chuyện Andrew (''Nhớ lại chuyện quá
    khứ, tôi ở hiện tại bất giác nở một nụ cười chua chát'')."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & khẳng định trong thoại: Andrew xưng ''tôi''; giữ khẳng
    định nhấn mạnh ''thực sự là một lời khuyên chí lý''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đối lập & điểm nhìn: giữ dấu chấm lửng đầu câu, quan
    hệ đối lập ''Nhưng vào thời điểm ấy'' và cách tự quy chiếu ''bản thân tôi thời
    còn non trẻ''."]'
