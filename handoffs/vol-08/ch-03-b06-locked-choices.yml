segment_id_end: YS-LN08/Text/chapter010.xhtml/p000190
choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Đối lập: giữ câu nhận định ngắn gọn chuyển ý ''Nhưng đây là chiến
    tranh.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''front lines'' -> ''Tiền tuyến''; quy chiếu
    Weiss trong độc thoại nội tâm của Tanya bằng ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & điều kiện: ''Major Weiss'' -> ''Thiếu tá Weiss'';
    ''Captain Meybert'' -> ''Đại úy Meybert''; ''Lieutenant Serebryakov'' -> ''Trung
    úy Serebryakov''; Tanya tự xưng ''Tôi'' / ''chúng tôi'' và gọi Weiss, Meybert
    là ''anh''; giữ câu rào trước điều kiện ở cuối thoại."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Weiss tự xưng ''Tôi'' và cam kết ''sẽ sẵn
    sàng ngay''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thuật ngữ: quy chiếu Weiss bằng ''anh'', giữ
    tên ''Tanya''; ''receiver'' -> ''ống nghe''; ''bunker'' -> ''căn hầm''; ''battalion’s
    marshaling point'' -> ''điểm tập kết của tiểu đoàn''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Tình thái nhượng bộ: giữ cấu trúc nhượng bộ (''Dù có nhìn bao
    nhiêu lần đi nữa thì cảnh này vẫn thật đáng nể'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & quân hàm: ''First Lieutenant Grantz’s company'' ->
    ''đại đội Trung úy Grantz''; ''First Lieutenant Wüstemann’s'' -> ''đại đội Trung
    úy Wüstemann''; giữ tên ''Serebryakov'' và tình thái ''có vẻ như... cũng đã xoay
    xở đến kịp giờ''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi, phủ định & đối lập: giữ câu hỏi cảm thán (''Có vài người
    trong số họ đúng nghĩa là vừa mới ngủ dậy đấy ư?''), chi tiết ''đầu tóc vẫn còn
    rối bù sau giấc ngủ trông phát khiếp'' và mệnh đề đối lập phủ định (''nhưng trong
    trường hợp quân địch tấn công thì chẳng bao giờ có ranh giới rõ ràng là liệu có
    nên bỏ qua chuyện kiểu này hay không'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: dịch ''ma’am'' khi Serebryakov báo cáo quân
    số với Tanya là ''thưa Trung tá''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya gọi Serebryakov là ''cô'' và ''Trung
    úy Serebryakov''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & câu hỏi gián tiếp: giữ sự đan xen điểm nhìn
    của bản gốc khi tự quy chiếu nội tâm bằng ''mình'' theo DEC-P01-001 ở câu đầu
    và dùng ''Tanya'' ở câu cuối; giữ phủ định (''trong thời chiến, một cuộc tấn công
    của quân địch đâu có tự dưng từ trên trời rơi xuống…'') và câu hỏi nghi vấn gián
    tiếp (''có nên hạ thấp tiêu chuẩn của mình hay không'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, dấu ngoặc kép & ẩn dụ: tự quy chiếu nội tâm
    bằng ''Mình'' theo DEC-P01-001; giữ câu châm ngôn trong ngoặc kép (''“quân phục
    xộc xệch phơi bày tâm trí rệu rã”'') và hình ảnh ẩn dụ ''bước trượt dài nguy hiểm
    đối với những con người văn minh''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điểm nhìn: ''uncivilized Commies'' -> ''đám Cộng sản
    mọi rợ''; ''anti-civilization Being X'' -> ''tên Being X phản văn minh''; ''modern
    citizen Tanya'' -> ''công dân hiện đại Tanya''; tự quy chiếu bằng ''mình'' theo
    DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi tu từ & sắc thái: Tanya gọi binh lính dưới quyền
    là ''Các binh sĩ'' / ''các anh'', tự xưng ''tôi'' và dùng ''tiểu đoàn chúng ta'';
    giữ lối nói đùa vòng vo về pháo binh địch và câu hỏi tu từ (''các anh cũng đâu
    thể mặc nguyên đồ ngủ ra đón họ được, đúng không?'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & mục đích: ''Heinrich’s Law'' -> ''Định luật
    Heinrich''; ''rule of thumb'' -> ''quy tắc kinh nghiệm''; giữ phủ định (''nhưng
    điều đó không làm nó bớt đúng đắn đi chút nào''); ''high-average performance''
    -> ''hiệu suất trung bình cao''; ''abide by regulations'' -> ''tuân thủ điều lệnh''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Khẳng định: giữ câu đúc kết ''Thói quen quả thực là quy tắc vàng
    để đi đến thành công.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & địa danh: ''Lieutenant Serebryakov, Lieutenant
    Wüstemann'' -> ''Trung úy Serebryakov, Trung úy Wüstemann''; ''Major Weiss'' ->
    ''Thiếu tá Weiss''; ''intercept the enemy mages'' -> ''đánh chặn các pháp sư địch'';
    ''on the Rhine'' -> ''ở mặt trận Rhine''; dùng đại từ ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & đối lập: quy chiếu Tanya bằng ''Tanya'' /
    ''cô''; giữ dấu chấm lửng và quan hệ đối lập (''Thực ra, đây chỉ là bước xác nhận
    mang tính hình thức... nhưng việc thực hiện những bước kiểm tra này đều có ý nghĩa
    của nó'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhân quả: ''standard procedure'' -> ''quy trình tiêu
    chuẩn''; giữ nhận định nhân quả ngắn gọn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, dấu chấm phẩy & phủ định: giữ dấu chấm phẩy ngăn cách
    vế trần thuật (''Tanya vẫn mỉm cười với những cấp dưới đáng tin cậy của mình'')
    và vế nội tâm ngôi thứ nhất (''mình tin chắc rằng chẳng cần phải lo lắng gì về
    những cựu binh này'') theo DEC-P01-001."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & cụm từ lặp: ''Lieutenant Serebryakov'' -> ''Trung úy
    Serebryakov''; ''business as usual'' -> ''công việc thường ngày''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & cụm từ lặp: dịch ''Yes, ma’am'' là ''Rõ, thưa Trung
    tá''; lặp lại chính xác cụm ''công việc thường ngày'' kèm tiểu từ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ dấu chấm lửng đầu câu; Tanya tự xưng ''tôi''
    và gọi Serebryakov là ''cô''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Đại từ, suy đoán phủ định & biểu cảm: phân biệt đại từ ''cô ấy''
    / ''cô'' (chỉ Serebryakov) với ''Tanya''; giữ suy đoán phủ định (''Hẳn Serebryakov
    không quen được khen như vậy'') và chi tiết ''khẽ nhăn mặt trước vẻ ngơ ngác của
    cô''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đánh giá: giữ cấu trúc danh hóa phủ định (''Lời khen
    của cô không truyền đạt được tới thuộc cấp là một thiếu sót'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, tên riêng, thuật ngữ & dấu câu: tự quy chiếu
    nội tâm bằng ''mình'' theo DEC-P01-001; giữ tên ''Nightingale'' (quy chiếu bằng
    ''bà ấy'' / ''bà'') và địa danh ''Crimea''; ''Human capital'' -> ''Vốn con người''
    theo P03-human-capital; giữ đối lập thời gian (''Hồi còn nhỏ... mình không thực
    sự hiểu... nhưng giờ thì điều đó hoàn toàn dễ hiểu'') và dấu gạch ngang dài."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''human capital'' -> ''vốn con người''; giữ
    cấu trúc so sánh hơn gắn với câu nói của Nightingale (''tích lũy được lượng vốn
    con người còn lớn hơn cả giá trị cân nặng của cô ấy quy ra vàng'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & nhượng bộ: giữ dấu chấm lửng mở đầu, câu mệnh
    lệnh phủ định (''Đừng nhìn tôi như thể cô thấy chuyện đó kỳ lạ lắm vậy'') và quan
    hệ nhượng bộ (''Tuy trông không phải lúc nào cũng có vẻ như thế, nhưng tôi thực
    sự trông cậy vào cô đấy'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Nói lắp & xưng hô: giữ nét nói lắp ''C-cảm ơn'' và cách gọi ''Trung
    tá ạ!''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: câu đầu dùng ''Mình'' cho độc thoại nội
    tâm theo DEC-P01-001, câu sau chuyển sang trần thuật ngôi thứ ba dùng ''Tanya'';
    ''in the rear'' -> ''ở hậu phương''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: giữ dấu chấm lửng sau cụm mở đầu; ''commander
    of the replacement company'' -> ''viên đại đội trưởng của đại đội bổ sung''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, dấu câu & mệnh lệnh: giữ dấu hai chấm sau ''Trung úy
    Wüstemann:'', mệnh lệnh phủ định (''Đừng làm quá sức'') và lời cam đoan của Tanya
    (''Tôi sẽ đảm bảo anh trở về bình an'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ câu đáp dứt khoát ''“Rõ!”'' của Wüstemann."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhượng bộ & giới hạn: ''green company commander'' ->
    ''đại đội trưởng còn non kinh nghiệm''; quy chiếu Wüstemann bằng ''anh chàng hăng
    hái này'' / ''anh ta''; giữ quan hệ nhượng bộ và giới hạn (''Tuy đã có kinh nghiệm
    thực chiến, nhưng anh ta vẫn còn cách rất xa mức có thể tin tưởng giao cho tự
    mình hành động, ít nhất là theo tiêu chuẩn của Tanya'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Nhân vật & quân hàm: ''First Lieutenant Tospan'' -> ''Trung úy
    Tospan''; giữ ý đối chiếu nhượng bộ (''ngay cả một kẻ cứng đầu như Trung úy Tospan
    rốt cuộc cũng tỏ ra có chỗ dùng được'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & điều kiện: giữ cấu trúc phủ định (''cũng không
    phải là Wüstemann thua kém gì'') và mệnh đề điều kiện – hệ quả phủ định (''nên
    chừng nào Tanya còn sử dụng anh ta đúng cách thì anh ta sẽ không đến nỗi vô dụng'')."]'
