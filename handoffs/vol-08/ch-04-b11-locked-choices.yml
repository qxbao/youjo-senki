choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000363
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Quân đội Liên bang bằng ''chúng'';
    ''the tracks'' -> ''tuyến đường sắt''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000364
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''Federation Army'' -> ''Quân đội
    Liên bang''; quy chiếu bằng ''chúng''; giữ chuẩn xác cấu trúc phủ định và điều
    kiện ''đi đường nào cũng chẳng quan trọng miễn là tới được đích''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000365
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & ẩn dụ: giữ liên kết ''Vì vậy vào ngay thời
    điểm này'' và ẩn dụ ''một đòn tấn công từ hướng không ngờ tới sẽ cứa một nhát
    thật sâu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000366
  kind: terminology_and_voice
  value: 'choices=["Chuỗi phủ định & nhượng bộ: giữ đủ ba mệnh đề nhận định về sơ
    hở của địch (''không nhìn xa hơn ngoài tuyến đường sắt'', ''không khép kín hoàn
    toàn vòng vây'', ''chỉ canh gác sơ sài'') dẫn tới kết luận ''vẫn có thể giáng
    đòn bất chấp sự chênh lệch về binh lực''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000367
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: in nghiêng toàn đoạn ''*Thời cơ của
    chúng ta đã tới.*'' theo DEC-P01-002; dùng đại từ ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000368
  kind: terminology_and_voice
  value: 'choices=["Phủ định nhượng bộ & đại từ: giữ cấu trúc ''Không phải việc tranh
    luận để giết thời gian thì có gì sai trái, nhưng logic quân sự đòi hỏi phải hành
    động''; quy chiếu Zettour bằng ''ông'' và các sĩ quan tham mưu Cụm B bằng ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000369
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, chức danh & nhân vật: ''orderly'' -> ''người lính cần
    vụ''; ''Lieutenant Grantz'' -> ''Trung úy Grantz''; Zettour xưng ''tôi'' và gọi
    người lính cần vụ là ''cậu'' với giọng sai bảo tự nhiên như tiện miệng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000370
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái giả định & đại từ: giữ góc nhìn của người
    lính cần vụ (''nghe cứ như thể ông gọi cà phê là để lui về phòng riêng vậy'');
    quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000371
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, giọng điệu & thuật ngữ: Zettour xưng ''tôi'' và gọi các
    sĩ quan trong phòng họp là ''thưa các vị'' / ''các vị'' để tạo khoảng cách khách
    sáo mỉa mai; ''the homeland'' -> ''bản quốc''; ''inspector and advisor'' -> ''thanh
    tra viên kiêm cố vấn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000372
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp: giữ câu đáp ngắn gọn ''“Rõ, thưa Tướng quân.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000373
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Zettour xưng ''Tôi''; giữ lời dặn ''Tôi
    mong sẽ sớm nhận được kết luận hết mức có thể''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000374
  kind: terminology_and_voice
  value: 'choices=["Đại từ & đối lập trong–ngoài: quy chiếu Zettour bằng ''ông'' và
    tự quy chiếu gián tiếp bằng ''mình''; giữ sự tương phản giữa lời nói bên ngoài
    và cảm giác tự thấy mình như một kẻ lừa đảo hoàn toàn ở trong lòng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000375
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm, phủ định kép & tên riêng: giữ nguyên độ mở câu
    hỏi về việc ''Rudersdorf'' rút hết quân nhân có năng lực; giữ phủ định kép ''Cũng
    không phải những người còn lại ở Cụm B hoàn toàn không có đầu óc, nhưng…''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000376
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: in nghiêng toàn bộ câu hỏi nội
    tâm ''*Phải chăng mặt trận phía đông đã quá rệu rã rồi?*'' theo DEC-P01-002; ''eastern
    front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000377
  kind: terminology_and_voice
  value: 'choices=["Phủ định, ẩn dụ & thuật ngữ: ''staffers'' -> ''đám sĩ quan tham
    mưu''; ''staff officer'' -> ''sĩ quan tham mưu''; giữ ẩn dụ ''không thể dùng làm
    một linh kiện được nữa'' và ''đã đánh mất linh hồn của một sĩ quan tham mưu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000378
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & thuật ngữ: giữ tên ''Zettour''; ''war room'' -> ''phòng
    tác chiến''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000379
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Zettour bằng ''Ông''; giữ câu phủ
    định gọn ''Ông chẳng còn việc gì để làm ở đó nữa''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000380
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Zettour bằng ''ông'' và tự quy chiếu
    sở hữu bằng ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000381
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đơn vị: ''commander of one of B Group’s few reserve
    divisions'' -> ''vị chỉ huy một trong số ít những sư đoàn dự bị thuộc Cụm B''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000382
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & chức danh: ''Commander Cramm'' -> ''Chỉ huy Cramm'';
    ''Lieutenant General von Zettour'' -> ''Trung tướng von Zettour''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000383
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Cramm xưng ''tôi'', gọi Zettour là ''ngài''
    và ''thưa Tướng quân''; giữ dấu chấm lửng cuối câu hỏi ngập ngừng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000384
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Zettour xưng ''tôi'', gọi Cramm là ''anh''
    và ''Chỉ huy Cramm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000385
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & ẩn dụ: quy chiếu Cramm bằng ''ông ta'', giữ
    tên ''Zettour'' và hình ảnh ẩn dụ ''thản nhiên ném một quả bom ngôn từ vào ống
    nghe''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000386
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái thoại: dùng ''Chúng ta'' và giữ cách nói giảm
    nhẹ đầy khiêu khích ''đi đánh một trận nho nhỏ nào''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Lắp bắp, xưng hô & sắc thái hành vi: giữ nét lắp bắp ''X-xin thứ
    lỗi cho tôi''; ''General'' -> ''thưa Tướng quân''; giữ chuẩn xác ý ''bằng cách
    cắn câu, song lại làm ra vẻ như mình chỉ buột miệng hỏi bất giác''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & điều kiện: ''Eastern Army Group'' -> ''Cụm
    tập đoàn quân phía Đông''; ''division level'' -> ''cấp độ sư đoàn''; Zettour xưng
    ''tôi'' – ''anh'' và giữ câu điều kiện phủ định ''Nếu anh từ chối thì tôi cũng
    chẳng phiền lòng đâu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: dịch ''“Sir?”'' là ''“Thưa Tướng quân?”'' nhất quán với
    cách Cramm gọi Zettour."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái mỉa mai: ''staff officers of the eastern
    army'' -> ''Các sĩ quan tham mưu của đạo quân phía đông''; giữ nhận xét trần thuật
    về giọng nói điềm tĩnh nhưng mang tính khích tướng của Zettour."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ khái quát & đối lập: ''eastern army staff''
    -> ''Bộ tham mưu của đạo quân phía đông''; dịch ''you'' khái quát bằng ''người
    ta''; giữ đối lập ''Cân nhắc thì phải kỹ lưỡng, nhưng hành động thì phải quyết
    đoán—không bao giờ được ngược lại''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đối lập: Zettour xưng ''tôi'', gọi các sĩ quan tham
    mưu là ''họ'' và gọi Cramm cùng các quân nhân ngoài chiến trường là ''những người
    lính như các anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Cramm gọi Zettour là ''ngài''; giữ tình thái
    phỏng đoán ngỡ ngàng ''“…Chắc hẳn ngài đang nói đùa.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế, phủ định & xưng hô: giữ câu giả định ''Nếu
    đó là đùa thì tốt biết mấy, nhưng đáng tiếc thay, đây lại là hiện thực''; quy
    chiếu Zettour bằng ''Ông''; giữ cách gọi ''Chỉ huy Cramm'' và đại từ ''Anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận & đại từ: dùng ''chúng ta'' và kính ngữ ''đúng
    không ạ?'' phù hợp với vị thế cấp dưới của Cramm."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''B Front'' -> ''Mặt trận B''; ''enemy field
    army'' -> ''đạo quân dã chiến của địch''; ''beleaguered comrades'' -> ''những
    người chiến hữu đang bị bao vây khốn đốn''; giữ khẳng định phủ định kép ''Về điều
    đó thì tôi không mảy may nghi ngờ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, tình thái & xưng hô: Cramm xưng ''tôi'' / ''mình'',
    gọi Zettour là ''ngài''; giữ câu điều kiện và mức độ nhượng bộ ''Nếu là để cứu
    quân ta… thì tôi cho là ít nhất mình cũng sẽ lắng nghe ngài trình bày hết''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nghĩa: Zettour xưng ''Tôi'' – ''anh''; giữ dấu gạch
    ngang dài trong câu khen ''Anh đúng là một sĩ quan mẫu mực—tốt lắm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000399
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & quan hệ nhân quả: quy chiếu Cramm bằng ''Ông
    ta''; giữ quan hệ nhân quả ''Ông ta là người hiểu rõ danh dự, nên một quân nhân
    lão luyện rất dễ dẫn dắt ông ta''."]'
