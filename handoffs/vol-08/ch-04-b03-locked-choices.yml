choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, quân hàm & đại từ: trần thuật ngôi thứ ba dùng tên
    riêng ''Tanya'', gọi ''Lieutenant Tospan'' là ''Trung úy Tospan'' và quy chiếu
    bằng ''anh ta''; không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & giả định: độc thoại nội tâm tự quy chiếu của
    Tanya dùng ''mình'' theo DEC-P01-001; giữ sắc thái giả định ''Mình dám cá là mình
    sẽ bỏ chạy ngay.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm của Tanya tự xưng ''mình''
    và hướng tới Tospan bằng đại từ ''anh''; ''holding your ground'' -> ''bám trụ
    giữ vững trận địa''; ''fighting to the death'' -> ''tử chiến đến cùng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô & ẩn dụ: trần thuật dùng ''Tanya'', giữ ẩn
    dụ ''những bánh răng trong cùng một cỗ máy''; thoại của Tanya xưng ''Tôi'' và
    gọi ''Trung úy Tospan'' là ''anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Tospan đáp hỏi ''“Dạ, thưa Trung tá?”'' (''Ma’am?'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & xưng hô: Tanya xưng ''Tôi'', gọi Tospan là
    ''anh''; ''in Colonel von Lergen’s name'' -> ''dưới danh nghĩa của Đại tá von
    Lergen''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Đại tá von Lergen bằng ''ông ấy'', giữ
    tên riêng ''Tanya'' và mệnh đề nhận định nhân quả – đối ứng ở câu kết."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & câu hỏi: Tanya xưng ''Tôi'', gọi Tospan là ''anh''
    và dùng ''chúng ta'' khi nói về tình thế bị bao vây chung; giữ câu hỏi tu từ ở
    cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & quân hàm: nội tâm của Tanya tự quy chiếu bằng
    ''Mình'' theo DEC-P01-001; ''First Lieutenant Grantz’s unit'' -> ''đơn vị của
    Trung úy Grantz''; ''Lieutenant General von Zettour'' -> ''Trung tướng von Zettour'';
    ''First Lieutenant Wüstemann’s company'' -> ''đại đội của Trung úy Wüstemann''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: tự quy chiếu của Tanya dùng ''mình'';
    ''two mage companies'' -> ''hai đại đội pháp sư''; giữ tên riêng ''Ahrens và Meybert'';
    ''artillery and armor'' -> ''pháo binh và thiết giáp''; ''strategic reserves''
    -> ''lực lượng dự bị chiến lược''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tospan gọi Tanya là ''thưa Trung tá'' / ''Trung
    tá'' kèm kính ngữ ''ạ'' và tự xưng ''tôi''; ''regulation'' -> ''điều lệnh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nhịp câu: Tanya xưng ''Tôi'' và gọi ''Trung úy Tospan'';
    giữ nhịp câu cảm thán dồn dập thể hiện sự tán thưởng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc câu: giữ hai cụm danh từ ngắn ''Bộ binh.
    Bộ binh độc lập.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu khẳng định ngắn ''Nói cách khác, đó chính là nền
    tảng của chiến tranh.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: dịch chủ ngữ khái quát ''You'' là ''Người
    ta''; ''holding company'' -> ''công ty mẹ nắm giữ cổ phần''; ''general staff''
    -> ''bộ tổng tham mưu''; giữ cấu trúc phủ định kép ở câu kết."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba dùng ''Tanya'' và quy
    chiếu ''Tospan'' bằng ''anh chàng Tospan thật thà'' / ''anh ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & đại từ: Tanya xưng ''Tôi'', gọi Tospan là
    ''anh''; ''Lieutenant Wüstemann’s mage company'' -> ''đại đội pháp sư của Trung
    úy Wüstemann''; quy chiếu Wüstemann bằng ''Anh ta'' và giữ tên riêng ''Grantz''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Tospan đáp lời cảm ơn lễ phép ''“Xin cảm
    ơn Trung tá ạ!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật dùng tên riêng ''Tanya''; ''performance
    evaluations'' -> ''đánh giá năng lực''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & quan hệ đối lập: giữ đối lập giữa ''thời bình'' (''peacetime'')
    và ''thời chiến, giữa một trận đánh phòng ngự'' (''wartime, in a defensive battle''),
    cũng như đối lập giữa ''những người lính khôn lanh'' và ''những kẻ lì lợm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm tự quy chiếu của Tanya
    dùng ''mình'' theo DEC-P01-001; ''Human resources'' -> ''Nguồn nhân lực''; ''axle''
    -> ''trục xoay''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & xưng hô: Tanya gọi ''Trung úy Wüstemann''
    là ''Anh'' / ''anh'' và quy chiếu ''Trung úy Tospan'' bằng ''anh ấy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Wüstemann đáp ''“Rõ, thưa Trung tá!”'' (''Yes, ma’am!'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật quy chiếu Wüstemann bằng ''anh
    ta'' và dùng tên riêng ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm tự quy chiếu của Tanya
    dùng ''mình'' theo DEC-P01-001; ''The rear'' -> ''Tuyến sau''; ''headquarters''
    -> ''sở chỉ huy''; giữ tên riêng ''Tospan''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật dùng tên riêng ''Meybert'',
    ''Tanya'' và quy chiếu Meybert bằng ''anh''; ''duty officer'' -> ''sĩ quan trực
    ban''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Nhịp câu: giữ điệp từ ba lần ''Thanh danh, thanh danh, thanh danh.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''political animals'' -> ''động vật chính trị''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân vật & xưng hô: Tanya gọi ''Đại úy Meybert'', tự
    xưng ''tôi'' và gọi Meybert là ''anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Meybert đáp ''Rõ, thưa Trung tá!'', tự xưng
    ''tôi'' và gọi Tanya là ''Trung tá'' kèm tiểu từ nghi vấn lễ phép ''vậy ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: ''front lines'' -> ''tiền tuyến'';
    trần thuật dùng ''Tanya'', quy chiếu Tanya bằng ''cô'' và Meybert bằng ''anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba quy chiếu Tanya bằng
    ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & giả định: Tanya tự xưng ''Tôi''; giữ cấu trúc
    phủ định mức độ (''không mặt dày đến mức...'') và mệnh đề giả định trái thực tế
    ở cuối câu (''dù nếu làm được thế thì cuộc đời hẳn sẽ dễ như ăn kẹo!'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: ''command post'' -> ''sở chỉ huy'';
    quy chiếu Tanya bằng ''cô''; giữ phủ định ''không hề có nguy cơ bị sức nặng của
    nó đè bẹp''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, thuật ngữ & câu hỏi: độc thoại nội tâm tự quy
    chiếu của Tanya dùng ''mình'' theo DEC-P01-001; ''the Empire'' -> ''Đế quốc'';
    giữ câu hỏi phỏng đoán và sắc thái tình thái ''Có lẽ...''."]'
