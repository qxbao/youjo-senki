choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ định dạng viết hoa toàn bộ ''NGÀY
    10 THÁNG 6 NĂM THỐNG NHẤT 1927, SỞ CHỈ HUY CỤM B MẶT TRẬN PHÍA ĐÔNG''; không có
    chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại: giữ tật nói lắp khẩn cấp đầu câu (''T-tin
    khẩn''); ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''; ''Soldim 528'' -> ''Soldim
    528''; ''Federation units'' -> ''các đơn vị Liên bang''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc nhân quả, phủ định kép & thuật ngữ: giữ đúng chủ thể
    mở màn chiến dịch Andromeda và chuyển quân chiếm các thành phố phía nam là Cụm
    A của Đế quốc, còn Quân đội Liên bang phát động tiến công đáp trả nhằm kiềm chân
    địch; giữ phủ định kép ''không phải là chuyện nằm ngoài dự kiến''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nghĩa: trần thuật ngôi thứ ba dùng ''họ''
    cho các sĩ quan tại Sở chỉ huy Cụm B; giữ chi tiết ''nhíu mày và thầm tặc lưỡi
    trong đầu''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu & nghĩa: giữ câu lẩm bẩm ''“Chúng tới rồi…,”'';
    ''defensive lines'' -> ''các phòng tuyến''; ''Soldim 528'' -> ''Soldim 528''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phủ định: ''Melting Line'' -> ''Tuyến Tan
    Băng''; giữ câu hỏi ngỡ ngàng phủ định ''Nó không nằm trên Tuyến Tan Băng sao?!''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thời gian quá khứ hoàn thành: ''HQ'' -> ''Sở chỉ huy'';
    giữ sắc thái dự tính trước đó (''vốn dự tính quân địch sẽ tiến dọc theo tuyến
    đường cao tốc rộng rãi, thuận tiện'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhận thức: ''“Melting Line”'' -> ''“Tuyến Tan Băng”'';
    ''staff officers of B Group'' -> ''các sĩ quan tham mưu của Cụm B''; giữ đối lập
    giữa giả định trước đó và nhận thức hiện tại rằng dự đoán đã hoàn toàn sai lầm."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & dấu câu: giữ phủ định mở đầu (''Chẳng có
    bóng dáng nào của Soldim 528 dọc theo lộ trình dự kiến cả''), dấu chấm lửng và
    mức độ (''gần như không tin nổi vào mắt mình''); ''bridgehead'' -> ''đầu cầu'';
    ''barely operating railway'' -> ''tuyến đường sắt chỉ đang hoạt động cầm chừng''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cảm thán: giữ chuỗi câu cảm thán và câu hỏi bàng hoàng
    ''“Cái quái gì thế này? Chết tiệt! Sao lại là ở đó?”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*Đùa nhau đấy à?*''
    trong dấu sao theo DEC-P01-002; ''B Group staffers'' -> ''các sĩ quan tham mưu
    Cụm B''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: ''we'' -> ''Chúng ta''; ''defending group''
    -> ''cụm quân phòng ngự''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đại từ: giữ lời bác bỏ khẩn cấp ''Không! Muộn quá rồi!
    Họ đã bị bao vây rồi!''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định kép & dấu câu: ''staff officers'' -> ''các
    sĩ quan tham mưu''; ''Federation Army'' -> ''Quân đội Liên bang''; ''high-ranking
    officers'' -> ''các sĩ quan cấp cao''; giữ phủ định kép ''không phải không sẵn
    lòng thừa nhận'' và dấu chấm lửng trước câu thốt kinh ngạc."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Chuỗi phủ định & thuật ngữ: giữ cấu trúc phủ định ba tầng (''Không
    phải rừng rậm, không phải vùng núi non hiểm trở nào đó, cũng chẳng phải khu vực
    biên giới Norden...'') và quan hệ nhượng bộ (''Tuy vùng phụ cận Soldim 528 có
    xu hướng biến thành đầm lầy, nơi đây vẫn là...'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ câu khẳng định ngắn nhấn mạnh sự bất ngờ của hành
    động phía địch.'']'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái quá khứ giả định & phủ định: chỉ
    bọc ''*ngủ gật*'' trong dấu sao theo DEC-P01-002; giữ phủ định mở đầu (''vẫn không
    giải thích được''), tình thái trách cứ (''lẽ ra cũng phải phát hiện được''), cấu
    trúc đối lập giả định (''Nếu báo cáo đầu tiên gửi về nói rằng... thì lại là chuyện
    khác, đằng này...'') và điều kiện loại trừ (''không một lời cảnh báo trừ phi...'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Phủ định tuyệt đối & thuật ngữ: giữ khẳng định phủ định tuyệt
    đối (''không thể nào lại bỏ sót...''); ''Aerial recon by plane'' -> ''Trinh sát
    đường không bằng máy bay''; ''observer mages'' -> ''các pháp sư quan sát''; ''standard
    practice'' -> ''thông lệ tiêu chuẩn''; giữ câu hỏi lửng ở cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''staffers'' -> ''sĩ quan tham mưu''; giữ
    sự chuyển biến tâm lý từ toan kết luận đơn vị bị vây là lũ ngu xuẩn sang lắc đầu
    không tin nổi và bật cười trước tình cảnh nực cười."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tu từ điều kiện: ''Lergen Kampfgruppe'' ->
    ''Kampfgruppe Lergen''; giữ câu hỏi tu từ điều kiện phủ định (''Nếu một đơn vị
    dày dạn kinh nghiệm và lập nhiều chiến công như Kampfgruppe Lergen mà còn không
    được coi là có năng lực, thì ai mới được coi là có năng lực đây?'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi cảm thán: ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & nhân vật: ''Colonel von Lergen'' -> ''Đại tá von Lergen''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''sentries and men on watch'' -> ''Lính gác và người
    trực cảnh giới''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phủ định: ''aerial mages'' -> ''các pháp sư
    trên không''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & tương phản: giữ sự tương phản giữa khung cảnh hỗn
    loạn la hét và một người đàn ông dửng dưng đứng nhìn.'']'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & đại từ: ''Lieutenant General von Zettour''
    -> ''Trung tướng von Zettour''; ''Central'' -> ''Trung ương''; quy chiếu Zettour
    bằng đại từ ''Ông'' trong trần thuật."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, xưng hô & cấu trúc lập luận: chỉ bọc ''*làm*''
    trong dấu sao theo DEC-P01-002; Zettour gọi các sĩ quan tham mưu là ''Thưa các
    quý ông'' / ''các vị'' và xưng ''chúng ta''; giữ điệp cấu trúc phủ định kép ''không
    còn lựa chọn nào khác ngoài việc phải...''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''; ''eastern army staffers'' -> ''các sĩ quan tham mưu của đạo quân phía
    đông''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ mạch suy luận ngắn gọn ''Đồng đội của họ
    đang bị vây khốn, nên họ cần phải được giải cứu.''"]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tình thái ''khó lòng công khai phản
    đối một nhận định như vậy''; ''HQ'' -> ''Sở chỉ huy''; giữ trách nhiệm phải bù
    đắp cho việc phán đoán sai tình hình."]'
