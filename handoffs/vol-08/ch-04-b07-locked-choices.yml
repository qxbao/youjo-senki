- segment_id: YS-LN08/Text/chapter014.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ, tình thái & xưng hô: ''Colonel!'' -> ''Thưa
    Trung tá!''; ''enemy mages'' -> ''Các pháp sư địch''; ''rapid response duty''
    -> ''nhiệm vụ phản ứng nhanh''; giữ tình thái phỏng đoán ''Có vẻ'', dấu gạch ngang
    dài và đại từ ''chúng'' (địch) – ''chúng ta ạ!'' (phe Đế quốc)."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật & chức vụ: trần thuật ngôi thứ ba dùng tên
    riêng ''Serebryakov'' và ''Tanya''; ''vice commander'' -> ''phó chỉ huy''; ''anti-artillery
    duty'' -> ''nhiệm vụ chống pháo kích''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & giọng thoại: ''Major Weiss'' -> ''Thiếu tá Weiss'';
    giữ nhịp câu báo tin khẩn trương của Tanya."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & đại từ: giữ giọng hào hứng của Weiss; quy chiếu
    pháp sư địch bằng ''chúng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, xưng hô & tình thái: Tanya tự xưng ''Tôi'' (''I suppose''
    -> ''Tôi đoán''), dùng ''chúng ta'' và quy chiếu địch bằng ''chúng''; giữ dấu
    gạch ngang dài và giọng châm biếm (''màn tự hủy hoại của chúng'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Weiss gọi Tanya là ''Trung tá'', dùng ''Chúng
    ta'' và giữ câu hỏi rủ rê ''Chúng ta trừng phạt đám trẻ đi muộn đó nhé?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & giọng thoại: câu đáp ngắn ''“Ừ.”''; trần thuật ngôi
    thứ ba quy chiếu Tanya bằng ''Cô''; câu mệnh lệnh trêu đùa ''“Chơi đùa với chúng
    cho vui vẻ vào.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & câu hỏi: ''Yes, ma’am!'' -> ''Rõ, thưa Trung
    tá!''; Weiss tự xưng ''Tôi'', gọi ''Trung úy Serebryakov'', kết câu hỏi xin phép
    bằng ''được không ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & đại từ: Tanya gọi Serebryakov là ''Trung úy'', quy
    chiếu Weiss bằng ''anh ấy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, chức vụ, điều kiện & phủ định: trần thuật ngôi thứ
    ba dùng ''Tanya'' và ''của mình''; ''adjutant'' -> ''sĩ quan phụ tá''; ''buddy''
    -> ''người phối hợp''; giữ cấu trúc điều kiện và phủ định giảm nhẹ ''chẳng phải
    là công việc gì quá khó nhằn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Chữ nghiêng, điểm nhìn, quân hàm & xưng hô: giữ đúng phạm vi nhấn
    mạnh Markdown ''*Quá chuẩn*'' theo DEC-P01-002; trần thuật dùng ''cô'' và ''bộ
    binh của Tospan''; trong thoại Tanya gọi ''Trung úy Wüstemann'', tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ nét lắp bắp bất ngờ ''“R-rõ!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nhân vật & quân hàm: trần thuật dùng ''Wüstemann''
    và ''Tanya''; ''second lieutenant fresh from the academy'' -> ''một thiếu úy vừa
    mới ra trường''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba dùng ''Tanya'', ''đơn
    vị của Wüstemann'' và đại từ ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Chữ nghiêng, thuật ngữ, phủ định & tình thái: giữ đúng phạm vi
    nhấn mạnh Markdown ở động từ tình thái ''*phải*'' (''they *should* know'') theo
