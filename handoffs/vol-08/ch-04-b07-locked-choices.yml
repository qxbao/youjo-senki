- segment_id: YS-LN08/Text/chapter014.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Chữ nghiêng & điểm nhìn: giữ đúng phạm vi nhấn mạnh Markdown ''*Gần
