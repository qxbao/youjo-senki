segment_id_end: YS-LN08/Text/chapter008.xhtml/p000096
choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & quan hệ thời gian: quy chiếu Tanya bằng ''nó''
    theo DEC-P01-001; giữ mệnh đề ''trước khi nó kịp mở miệng chen vào một lời''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định: Tanya tự xưng ''mình'' theo DEC-P01-001;
    giữ phủ định nhấn mạnh ''mình thậm chí còn chẳng muốn tưởng tượng xem mớ thông
    tin này thuộc diện tuyệt mật tới mức nào nữa''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ câu chuyển tiếp khẳng định ''Điều tiếp theo Zettour
    nói ra càng bảo chứng chắc nịch cho chuyện đó.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại & thuật ngữ: Zettour tự xưng ''ta'' và gộp
    chung ''chúng ta''; ''B Group'' -> ''Cụm B''; ''front lines'' -> ''tiền tuyến'';
    ''Andromeda missions'' -> ''các nhiệm vụ của Andromeda''; ''armor'' -> ''lực lượng
    thiết giáp''; giữ câu hỏi đuôi ''nhỉ?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & quan hệ nhượng bộ: quy chiếu Tanya bằng ''nó'';
    giữ sự tương phản ''Dù đáng lý phải tỏ ra kinh ngạc, nó lại chỉ há hốc mồm nghe
    tiếp như một kẻ đần độn.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: ''eastern front'' ->
    ''Mặt trận phía đông''; giữ phủ định ''nhưng cách gọi đó thực ra không chuẩn xác'';
    chỉ bọc ''*quá dài*'' trong dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & đối lập thực tế: ''defensive positions''
    -> ''các trận địa phòng ngự''; ''troop formations'' -> ''đội hình binh lực'';
    ''Commie'' -> ''lũ Cộng sản''; ''strong points'' -> ''các cứ điểm''; ''the Rhine''
    -> ''mặt trận Rhine''; giữ đại từ ''chúng ta'' và sự đối lập giữa trạng thái lý
    tưởng với thực tế tồi tàn."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Tình thái & khái niệm: giữ ''Có thể nói tình trạng tác chiến theo
    kiểu một người gánh vác mọi việc đang trở thành một căn bệnh kinh niên.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ, điều kiện & thuật ngữ: giữ phủ định ''họ đơn
    giản là không có đủ quân số''; ''The Empire’s instrument of violence'' -> ''Công
    cụ bạo lực của Đế quốc''; giữ điều kiện ''chừng nào nhà nước chưa phá sản'' và
    nhận định ''chắc chắn nó đang cảm nhận rõ sự bào mòn cả về quốc lực lẫn nguồn
    nhân lực''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ nội tâm & thuật ngữ: ''armor'' -> ''lực lượng thiết
    giáp''; ''A Group'' -> ''Cụm A''; giữ giọng chất vấn ngỡ ngàng ''Ấy thế mà họ
    lại định... để giao cho Cụm A ư?''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & điều kiện phủ định: giữ câu hỏi tu từ có phủ định
    (''Ai mà nghe tin đó cho nổi mà không xây xẩm mặt mày cơ chứ?'') và điều kiện
    hạn chế (''Mà đấy là còn may nếu nạn nhân xấu số không chết đứng ngay tại chỗ
    vì quá sốc.'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại, điều kiện & thuật ngữ: Zettour xưng ''Ta'',
    gọi Tanya là ''cô'', dùng ''chúng ta'' cho phe Đế quốc; ''Federation Army’s resource
    area'' -> ''vùng tài nguyên của Quân đội Liên bang''; ''war economy'' -> ''nền
    kinh tế thời chiến''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại & điều kiện giới hạn: Tanya xưng ''tôi'' với
    cấp trên và dùng ''chúng ta'' cho phe mình; giữ điều kiện hạn chế ''điều đó chỉ
    xảy ra nếu chúng ta thành công mà thôi''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại & thuật ngữ: Zettour gọi Tanya là ''cô'';
    ''Operation Andromeda'' -> ''Chiến dịch Andromeda''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & dấu câu: Tanya xưng ''Tôi''; giữ dấu chấm
    lửng ở cả đầu và cuối câu cùng thái độ dè dặt ''…Tôi e rằng, xét theo quân hàm
    của mình, tôi không nên…''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & mệnh lệnh trong thoại: Zettour xưng ''Ta'' và gọi Tanya
    là ''cô''; giữ câu mệnh lệnh trực tiếp ''Hãy cho ta biết ý kiến không chút dè
    dặt của cô.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: giữ hai chi tiết phủ định ''thưa rằng việc
    đó không thỏa đáng'' và ''nụ cười hiền hậu trên môi mà chẳng hề chạm tới đáy mắt''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi điểm nhìn: câu đầu độc thoại nội tâm dùng ''mình''
    (''Xem ra mình không còn lựa chọn nào khác rồi.''), hai câu sau chuyển sang trần
    thuật và nhận định chung về trách nhiệm sĩ quan."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu chêm, đại từ trần thuật & thuật ngữ: giữ cấu trúc
    liệt kê hàng loạt bất lợi rồi ngắt bằng mệnh đề trần thuật chêm giữa hai dấu gạch
    ngang dài (''—nó gần như nhổ toẹt ra kết luận của mình—''); ''tyranny of distance''
    -> ''sự bạo ngược của khoảng cách''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, điều kiện phủ định & mệnh lệnh: Zettour xưng ''Ta'',
    gọi Tanya là ''cô''; giữ điều kiện ''Ta sẽ không hiểu được nếu cô nói năng mơ
    hồ đâu. Hãy trình bày cụ thể hơn xem.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & giả định: Tanya xưng ''Tôi''; giữ phủ định
    ''Tôi không có từ nào khác để mô tả chuyện đó cả'' và câu điều kiện giả định ''Nếu
    buộc phải diễn đạt theo cách khác, tôi xin nói rằng chiến dịch này là một canh
    bạc quá đỗi nguy hiểm.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & trần thuật: dùng ''bạn'' cho chủ thể khái quát
    ở câu đầu; câu hai trần thuật về Tanya giữ sắc thái khách quan chuyên nghiệp."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc phủ định tăng tiến: ''B Group'' -> ''Cụm
    B''; ''eastern front'' -> ''mặt trận phía đông''; giữ cấu trúc phủ định tăng tiến
    ''thậm chí còn chẳng có nổi số quân tối thiểu cần thiết theo tiêu chuẩn của mặt
    trận phía đông, chứ đừng nói đến tiêu chuẩn ghi trong sách giáo khoa''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong câu hỏi: Zettour gọi Tanya là ''cô'' (''Trong mắt
    cô thì tình hình có vẻ như vậy sao?'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện phủ định & cấu trúc tăng tiến: ''war college''
    -> ''trường đại học quân sự''; ''the academy'' -> ''học viện''; ''A Group'' /
    ''B Group'' -> ''Cụm A'' / ''Cụm B''; ''Andromeda front'' -> ''mặt trận Andromeda'';
    giữ điều kiện ''Bất kể Cụm A có thành công hay không, nếu Cụm B không thể trụ
    vững...'' và phạm vi tăng tiến ''đặt cả mặt trận Andromeda lẫn vùng hậu phương
    vào vòng nguy hiểm''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhượng bộ & phủ định: ''creative accounting'' -> ''thủ
    thuật xào nấu sổ sách''; ''The brass'' -> ''Giới chóp bu''; ''B Group'' -> ''Cụm
    B''; giữ mệnh đề đối lập phủ định ''nhưng đơn giản là không có đủ quân để biến
    điều đó thành hiện thực''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: ''A Group'' -> ''Cụm A''; ''local superiority''
    -> ''ưu thế cục bộ''; giữ mức độ hạn chế ''dù chỉ vừa vặn sát nút'' và tình thái
    phỏng đoán ''Nhiều khả năng ít nhất họ cũng sẽ khoan thủng được một lỗ mở trên
    phòng tuyến địch.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Phủ định bộ phận & đại từ: giữ phủ định bộ phận ''tuy dày nhưng
    chắc chắn không phải nơi nào cũng đồng đều như nhau'' và đại từ ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi gián tiếp: giữ ''Nhưng câu hỏi lớn nhất là liệu chúng
    ta có khai thác được lỗ mở đó hay không.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Điều kiện phủ định: giữ cấu trúc điều kiện ''Trừ phi có sẵn các
    đơn vị chờ thời ở hai bên cánh..., mọi công sức khổ nhọc của chúng ta sẽ đổ sông
    đổ bể.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Phủ định, cấu trúc tăng tiến & thành ngữ: giữ phủ định ''chúng
    ta không có đơn vị nào ở trạng thái dự bị chờ lệnh'', cấu trúc tăng tiến ''—không
    những thế mà chúng ta còn đang rút bớt các đơn vị khỏi Cụm B!'' và thành ngữ ''đặt
    cái cày trước con trâu''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''staff officer'' -> ''sĩ quan tham mưu'';
    giữ sắc thái thúc ép nhẹ của Zettour ''Chắc chắn bổn phận của một sĩ quan tham
    mưu là phải làm gì đó để giải quyết chuyện ấy chứ.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya xưng ''tôi''; ''staff officer'' ->
    ''sĩ quan tham mưu''; ''war college'' -> ''trường đại học quân sự''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ khái quát & quan hệ nhượng bộ: ''staff officer
    retreat'' -> ''kỳ tập huấn chuyên đề dành cho sĩ quan tham mưu''; dùng ''bạn''
    cho chủ thể khái quát; giữ mệnh đề nhượng bộ ''cho dù bạn có khao khát điều ngược
    lại đến nhường nào đi chăng nữa''."]'
