- segment_id: YS-LN08/Text/chapter014.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi xác nhận: Cramm gọi Zettour là ''Thưa Tướng
    quân'' / ''ngài'', giữ câu hỏi xác nhận cuối câu ''đúng không ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, khẩu ngữ & thuật ngữ: Zettour xưng ''tôi'' – ''Anh'',
    gộp bằng ''chúng ta''; giữ khẩu ngữ ''đá vào mông Cụm B một cú''; ''enemy field
    army'' -> ''đạo quân dã chiến của địch''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & đại từ: giữ cấu trúc phủ định ''Không có lấy nửa
    lời giả dối''; quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giả định trái thực tế: giữ phủ định ''không muốn bỏ
    mặc binh sĩ cho số phận định đoạt'' và câu điều kiện giả định ''Giá mà có một
    đơn vị có thể phái đi cứu họ, tất nhiên ông đã phát động nhiệm vụ giải cứu từ
    lâu rồi.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & xưng hô: chỉ in nghiêng câu ''*Chỉ
    bấy nhiêu tinh túy đó thôi là quá đủ rồi.*'' theo DEC-P01-002; ''eastern army
    staffers'' -> ''các sĩ quan tham mưu của đạo quân phía đông''; ''Federation Army''
    -> ''Quân đội Liên bang''; ''Commander Cramm'' -> ''Chỉ huy Cramm''; giữ các cấu
    trúc phủ định ở cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''Lieutenant Grantz'' -> ''Trung úy Grantz'';
    Zettour xưng ''Tôi'' và gọi Grantz là ''cậu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Grantz đáp ''Rõ, thưa ngài'' và gọi Zettour
    là ''thưa Tướng quân'' / ''ngài'' kèm ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ nguyên ''“Tại sao lại không?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & xưng hô: giữ phủ định ''Nó thậm chí còn
    chẳng được bọc giáp''; ''light tank'' -> ''xe tăng hạng nhẹ''; Grantz xưng ''tôi''
    – ''ngài''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: quy chiếu Grantz bằng ''Anh'', giữ
    tên ''Cramm'' và ''Zettour''; giữ phủ định ''không thể nghe theo lời khuyên đó
    được''; ''a general'' -> ''một vị tướng'', ''front line'' -> ''tiền tuyến''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: giữ câu bác bỏ ''Không được. Việc
    đưa ra yêu cầu không đi kèm với trách nhiệm.''; chỉ in nghiêng ''*công bằng*''
    khớp đúng thẻ em trong nguồn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Cramm gọi Zettour là ''thưa Tướng quân'' / ''ngài'',
    xưng ''sư đoàn chúng tôi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Chức danh, thuật ngữ & xưng hô: ''Commander Cramm'' -> ''Chỉ huy
    Cramm''; ''tank desant'' -> ''chiến thuật tùng thiết trên xe tăng''; Zettour gọi
    Cramm là ''anh'' và gộp bằng ''Chúng ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Câu bỏ lửng: giữ nguyên ''“Nhưng còn tổn thất thì…”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Phủ định bác bỏ & thuật ngữ: giữ cấu trúc bác bỏ ''Đâu phải tôi
    bảo anh cho binh lính ngồi trên xe tăng lao thẳng vào trận địa địch để rồi bị
    tàn sát''; ''tight-knit joint operation of infantry and tanks'' -> ''cuộc tác
    chiến hiệp đồng chặt chẽ giữa bộ binh và xe tăng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Tên chiến dịch: ''Operation Iron Hammer'' -> ''Chiến dịch Búa
    Sắt''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: ''Federation Army'' -> ''Quân đội Liên
    bang''; giữ tên ''Degurechaff''; ''improvised transports'' -> ''phương tiện vận
    tải dã chiến''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi xác nhận: Cramm hỏi lại Zettour bằng ''Ý ngài
    là… sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Thoại xác nhận ngắn: giữ nguyên ''“Đúng vậy.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Đơn vị & xưng hô: ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen'';
    Cramm xưng ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''airborne mission'' -> ''nhiệm vụ đổ bộ đường
    không''; ''eastern front'' -> ''mặt trận phía đông''; quy chiếu Zettour bằng ''Ông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ chiến thuật: ''Tank desant'' -> ''Chiến thuật tùng thiết
    trên xe tăng''; ''enveloping attack'' -> ''đòn tấn công vu hồi''; ''encircle and
    annihilate tactics'' -> ''chiến thuật bao vây tiêu diệt hoàn toàn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Tổ chức & phủ định: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    giữ phủ định ''Họ không có đủ nguồn lực để cân nhắc bất kỳ phương án chiến thuật
    nào khác.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Chức danh, xưng hô & thuật ngữ: ''Commander Cramm'' -> ''Chỉ huy
    Cramm''; Zettour gọi Cramm là ''anh''; ''main thrust'' -> ''mũi chủ công''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp quân sự: giữ nguyên ''“Rõ, thưa ngài.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Đại từ, chức danh & phủ định: Zettour dùng ''Chúng tôi'' (chỉ
    nhóm của ông và Grantz); ''division commanders'' -> ''các tư lệnh sư đoàn''; giữ
    mệnh đề phủ định ''dù tôi chẳng nghĩ đến nước này mà còn ai do dự đâu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh: khóa ''CÙNG NGÀY HÔM ĐÓ, SOLDIM 528''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Giọng chiêm nghiệm: giữ giọng bàn luận khách quan mở đầu cảnh
    Soldim 528 và nhận định ''Hiếm khi nào tìm được một người ghét ngủ.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & chức danh: giữ lối tách ngôi đặc trưng khi
    người kể tự xưng ''mình'' quan sát ''Tanya'' (''cô''); ''adjutant, First Lieutenant
    Serebryakov'' -> ''sĩ quan phụ tá của cô là Trung úy Serebryakov''; giữ phủ định
    ''không bị đánh thức trừ trường hợp khẩn cấp''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Câu cảm thán ngắn: giữ nguyên ''Ấy vậy mà chuyện đó lại tái diễn
    nữa rồi.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: Serebryakov gọi Tanya là ''Trung
    tá'' (''Colonel'') kèm ''ạ''; ''high command'' -> ''bộ chỉ huy cấp cao''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & phủ định: Tanya tự quy chiếu bằng ''mình'' theo
    DEC-P01-001; giữ các cấu trúc phủ định ''Cũng chẳng phải lỗi của Serebryakov''
    và ''mình không được phép ngủ ngon giấc''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & trích dẫn điện văn: Tanya xưng ''tôi''
    trong thoại, trần thuật quy chiếu bằng ''Tanya'' / ''cô''; ''General von Zettour''
    -> ''Tướng von Zettour''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''; ''Colonel
    von Lergen'' -> ''Đại tá von Lergen''; giữ các dấu nháy đơn trong bức điện."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp lễ phép: giữ nguyên ''“Vâng, toàn bộ bức điện chỉ có
    vậy thôi ạ.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Giả định phủ định: giữ câu điều kiện ''Nếu Serebryakov không biết
    thêm điều gì khác, thì đúng theo nghĩa đen là chỉ có bấy nhiêu đó mà thôi.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: giữ phủ định ''Bức điện
    chẳng gợi lên chút manh mối nào''; in nghiêng câu hỏi nội tâm ''*Thứ này là để
    đánh lạc hướng quân địch sao? Phải chăng mình đang quá coi trọng một bức điện
    giả?*'' theo DEC-P01-001 và DEC-P01-002."]'
