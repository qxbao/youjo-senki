choices:
- segment_id: YS-LN08/Text/chapter022.xhtml/p000571
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gắn với góc nhìn của Tanya: giữ ''dây thần kinh giàu
    lương tri của Tanya'' và ''không thể dung thứ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000572
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya với Zettour: xưng ''tôi – ngài'', hô ngữ ''thưa ngài'',
    kính ngữ ''ạ'', khóa ''khoảng cách quân hàm giữa chúng ta''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000573
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour hỏi lại ngắn gọn: ''“Hửm?”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000574
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: tự xưng ''Tôi'', khóa ''thành viên của tổ chức quân
    sự'' và ''tuân phục các mệnh lệnh hợp pháp''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000575
  kind: terminology_and_voice
  value: 'choices=["Nội tâm trực tiếp của Tanya: tự xưng ''mình'' theo DEC-P01-001,
    giữ phủ định nhấn mạnh ''đời nào chịu vượt đèn đỏ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000576
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi ''Tanya'' và đại từ ''cô'', khóa ''công
    dân tuân thủ pháp luật'', ''đồng phạm'' và ''tên tội phạm thứ thiệt''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000577
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm khái quát: dùng ''chính bản thân bạn'' và giữ
    cấu trúc tương phản khẳng định – phủ định."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000578
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha độc thoại nội tâm: gọi Tanya là ''Cô'', giữ định
    danh ''Zettour'', dùng đại từ chung ''bạn'' cho mệnh đề khái quát và hình ảnh
    ''mang vết nhơ suốt đời''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000579
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ tình thái phỏng đoán ''cũng có thể'' và
    cụm ''các tập đoàn thuộc chỉ số Nikkei''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000580
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: khóa ''học thuyết nhân sự ở Đế quốc'', ''những
    phi vụ ngầm'' và câu hỏi giả định về việc ''nhận lệnh phớt lờ pháp luật khi cần
    thiết''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000581
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha giọng tự trào: giữ ''cá nhân luôn tự hào về lòng
    yêu chuộng công lý như Tanya''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000582
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: hô ngữ ''Thưa Tướng quân'', xưng ''tôi'', kính ngữ
    ''ạ'', khóa ''nghĩa vụ phục vụ hợp pháp'', ''các chuẩn mực pháp lý'' và ''phản
    bội lại hoàng gia và Tổ quốc''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000583
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ đối lập ''câu chữ trên mặt giấy của pháp
    luật, chứ không phải tinh thần của nó'' và phủ định kép ở câu sau."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000584
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: gọi Tanya là ''cô'', khóa ''bảo vệ Đế quốc'' và
    câu hỏi đuôi ''phải vậy không?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000585
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp ngắn gọn: ''“Đúng vậy, thưa Tướng quân.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000586
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gắn với điểm nhìn của Tanya: giữ ''Bổn phận trên danh
    nghĩa của cô…''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000587
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha lập luận của Tanya: khóa ẩn dụ ''hợp đồng'', ''điều
    khoản cấm làm nghề tay trái'' và ''chiến thắng của Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000588
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: gọi ''Trung tá von Degurechaff'', xưng ''tôi –
    cô'', giữ dấu nháy đơn quanh từ ''‘tốt nhất’''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000589
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: giữ dấu nháy đơn quanh từ ''‘mệnh lệnh’'', gọi Zettour
    là ''ngài'' và hô ngữ ''thưa ngài…''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000590
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: tự xưng ''Tôi'', giữ mạch câu ngắn dứt khoát."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000591
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi tên ''Tanya'', ''Zettour'' và đại
    từ ''cô''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000592
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: khóa ''sáng kiến hoàn toàn mới'', ''lối thoát mới'',
    ''không chính thống'' và ''tham vọng lớn nhất của đời binh nghiệp''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000593
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: xưng ''Tôi – ngài'', giữ kính ngữ ''ạ'' cuối câu."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000594
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại Zettour: gọi ''Zettour'', xưng hô ''Cô – Trung
    tá'', khóa cụm từ then chốt ''các biện pháp phẫu thuật phòng ngừa''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000595
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ câu ngắn bỏ lửng ''Trong bối cảnh này…''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000596
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ cấu trúc song hành ''Trong cuộc trò chuyện
    này…''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000597
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: in nghiêng toàn câu ''*Các
    biện pháp phòng ngừa.*'' khớp với thẻ em trong XHTML và từ vựng ở p000594."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000598
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: in nghiêng toàn câu hỏi ''*Phẫu
    thuật ư?*'' khớp với thẻ em trong XHTML và từ vựng ở p000594."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000599
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi ''Tanya'', đại từ ''cô'' và ''Zettour'',
    giữ ''chuỗi từ ngữ đầy ẩn ý sâu xa ấy''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000600
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: khóa ''sĩ quan cao cấp'' và sắc thái cảm thán."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000601
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya và nhấn mạnh Markdown theo DEC-P01-002: xưng ''tôi'',
    có kính ngữ ''ạ'', chỉ in nghiêng cụm ''*một người lính Đế quốc*'' đúng phạm vi
    thẻ em của nguồn."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000602
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ câu ngắn ''Lập trường chính thức thật tuyệt
    vời.''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000603
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ cấu trúc điệp song hành ''Lập trường chính
    thức thật an toàn.''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000604
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: khóa định danh đầy đủ ''Trung tá Pháp
    sư Tanya von Degurechaff'', dùng đại từ phản thân ''mình'' và đại từ ''cô''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000605
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi Tanya là ''Cô'' và giữ tên ''Zettour''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000606
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: xưng ''tôi – cô'', giữ đúng giả định trái thực
    tế ở quá khứ ''Nếu cô mà trả lời khác đi, hẳn tôi đã phải bắn cô rồi'' và khóa
    ''biện pháp phẫu thuật thích hợp''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000607
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: gọi Zettour là ''ngài'', giữ kính ngữ ''ạ'' và sắc
    thái bàng hoàng."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000608
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi Tanya là ''Cô'', giữ nguyên hai phủ
    định và quan hệ so sánh hơn."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000609
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: dùng ''chúng ta'', khóa cặp đối lập không gian
    chiến lược ''miền đông'' và ''cuộc chiến ở miền tây''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000610
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: gọi ''ngài'', khóa ''cuộc không chiến ở miền tây''
    và kính ngữ ''sao ạ?''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000611
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi Tanya là ''Cô'', khóa ''suy nghĩ viển
    vông'' và giữ phủ định ''chẳng thể dễ dàng từ bỏ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000612
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: giữ lối nói ẩn ý ''Lui về phía đông hơn chỗ đó
    một chút nữa.''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000613
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown và điểm nhìn theo DEC-P01-002: in nghiêng câu
    đầu ''*Aaaa, khốn kiếp thật.*'' và câu cuối ''*Vậy là mọi chuyện đã đi đến nước
    đó rồi sao?*'', để thường câu trần thuật giữa ''Cô đã hiểu ý ông.'' đúng cấu trúc
    XHTML."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000614
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: gọi ''Tanya'' và ''cô'', khóa ''bản quốc
    thân yêu'' (the dear homeland) và ''rút về hậu phương'' (falling back to the rear)."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000615
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: gọi Tanya là ''Trung tá'', dùng ''Chúng ta'', khóa
    ''kiểu chiến tranh hòa bình'' và ''quê nhà''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000616
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: xưng ''tôi'', phản thân ''mình'', kính ngữ ''ạ'',
    giữ cách nói khiêm nhường theo nghi thức."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000617
  kind: terminology_and_voice
  value: 'choices=["Trần thuật chuyển sang nội tâm trực tiếp: câu đầu dùng ''Tanya''
    và ''cô'', câu cuối chuyển sang tự xưng ''mình'' theo DEC-P01-001 tương ứng với
    đại từ ''I'' trong nguồn."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000618
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha nhận định của Tanya: gọi ''cô'' và ''Zettour'',
    khóa ''chuyên gia về hành chính quân sự'' và ''bậc thầy về thủ tục giấy tờ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000619
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: ''“Tuyệt lắm.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000620
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp lệnh: ''“Rõ, thưa ngài.”''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000621
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: khóa ''kỷ nguyên hoàng kim cho Đế quốc'', hình
    ảnh ẩn dụ ''ánh hoàng hôn – mặt trời sẽ lại mọc'', xưng ''Tôi – cô'' và gọi ''Trung
    tá''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000622
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: lặp lại chính xác cụm ''biến thời khắc này thành
    một kỷ nguyên hoàng kim cho Đế quốc'', dùng ''Chúng ta'' và kính ngữ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000623
  kind: terminology_and_voice
  value: 'choices=["Thoại Zettour: dùng ''Chúng ta'', giữ phủ định ''chẳng có mấy
    lựa chọn đâu''."]'
- segment_id: YS-LN08/Text/chapter022.xhtml/p000624
  kind: terminology_and_voice
  value: 'choices=["Thoại và trần thuật: giữ ''chúng ta hãy chuẩn bị tinh thần phòng
    khi bất trắc ạ'' và ''Tanya lẩm bẩm đáp lời.''."]'
- segment_id: YS-LN08/Text/chapter024.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Nội tâm trực tiếp của Tanya: tự xưng ''Mình'' theo DEC-P01-001,
    giữ điệp cấu trúc khẳng định mức độ chắc chắn và sự bất mãn khi bị ép buộc."]'
- segment_id: YS-LN08/Text/chapter024.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba kết chương: giữ cấu trúc điều kiện phủ
    định, dấu gạch ngang dài và tên ''Tanya''."]'
- segment_id: YS-LN08/Text/chapter024.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: in nghiêng toàn bộ dòng kết
    tập ''*(Tanya Chiến Ký, Tập 8: In Omnia Paratus, Hết)*'' khớp với thẻ em trong
    XHTML."]'
