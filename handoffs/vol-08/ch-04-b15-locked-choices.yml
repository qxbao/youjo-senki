- segment_id: YS-LN08/Text/chapter014.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''Cô'', phản thân bằng
    ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Điều kiện giả định & tình thái: giữ đối lập giữa hai kịch bản
    ''kịch bản khả quan nhất là cô chỉ bị cười nhạo'' và ''trong trường hợp tệ nhất,
    cả đơn vị thậm chí có thể bị bỏ rơi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ điện văn: giữ cụm ''Các hành động đã ấn định'' khớp
    với bức điện ở batch trước."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & dấu ngoặc kép: in nghiêng toàn bộ đoạn nội
    tâm bằng ''*...*'' theo DEC-P01-002; giữ dấu ngoặc kép quanh chữ ''“đã ấn định”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán ngắn: giữ nguyên ''“…Hửm?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: in nghiêng toàn bộ câu hỏi nội
    tâm bằng ''*...*''; khóa ''“Kampfgruppe Lergen,” “Đại tá von Lergen,” “các hành
    động đã ấn định”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: phần đầu trần thuật quy chiếu bằng
    ''cô'', chỉ in nghiêng câu hỏi nội tâm cuối đoạn ''*Vậy có nghĩa là chữ “đã ấn
    định” cũng tương tự sao?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán: giữ mức độ suy đoán ''có lẽ việc cần làm là
    xem xét bức điện sau khi đã lược bỏ những phần đó đi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Thoại lẩm bẩm: giữ cụm trích dẫn điện văn ''“Lập tức hành động…?
    …Hành động.”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: giữ tên ''Tanya'' và đại từ ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000531
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ khái niệm: ''assertive spontaneity'' -> ''sự tự phát
    đầy chủ động''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000532
  kind: terminology_and_voice
  value: 'choices=["Tổ chức, thuật ngữ & cấu trúc đối lập: ''Imperial Army staff officer
    education'' -> ''chương trình đào tạo sĩ quan tham mưu của Lục quân Đế quốc'';
    giữ cấu trúc ''không phải câu chữ bề mặt của mệnh lệnh mà là ý định đằng sau nó''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000533
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại: giữ từ khóa ''Ý định'' (''Intent'') liên kết
    trực tiếp với đoạn trước."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000534
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & phủ định: ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; giữ phủ định ''Tanya không phải kiểu người có thể phớt lờ
    quyết định của cấp trên mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000535
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ công sở & đại từ: giữ ẩn dụ ''sếp'', ''công ty'', ''nhảy
    khỏi con tàu đắm''; quy chiếu Zettour bằng ''ông ta'' trong đánh giá mang giọng
    nội tâm của Tanya."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000536
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & điều kiện: quy chiếu Tanya bằng ''cô'' / ''mình'';
    ''free will'' -> ''ý chí tự do''; ''General Staff'' -> ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000537
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ cấu trúc ''từng có vô khối mệnh lệnh cô
    chẳng muốn chấp hành, nhưng tất cả chúng đều hợp lý''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000538
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, tên gọi & phủ định: chuyển sang ngôi thứ nhất
    nội tâm tự quy chiếu bằng ''mình'' theo DEC-P01-001; giữ nguyên ''Being X''; giữ
    phủ định ''chẳng mảy may đếm xỉa đến ý chí tự do của mình'' và ''không giải thích
    đàng hoàng các điều khoản hợp đồng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000539
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & tôn giáo: ''God'' -> ''Thượng đế'', quy chiếu
    bằng ''ngài''; giữ đại từ tự xưng ''mình'' trong nội tâm của Tanya."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000540
  kind: terminology_and_voice
  value: 'choices=["Câu cảm thán nội tâm: giữ nguyên ''Thế giới này có thể khắc nghiệt
    đến nhường nào chứ.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ in nghiêng từ ''*Không.*'' theo
    đúng thẻ em trong nguồn; phần trần thuật dùng ''Tanya'' và ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Tanya bằng ''Cô'', giữ tên ''Zettour'';
    ''thought experiment'' -> ''thí nghiệm tư duy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế & tự xưng: Tanya tự hỏi bằng đại từ ''mình'',
    gọi Zettour là ''vị tướng ấy'' trong câu điều kiện giả định."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & đại từ: chỉ in nghiêng cụm ''*Một
    cánh cửa xoay, chiến thuật chặt đầu chỉ huy…*'' theo DEC-P01-002; ''logistics''
    -> ''hậu cần''; quy chiếu Zettour bằng ''Ông ấy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Tình thái & câu hỏi suy luận: giữ mức độ chắc chắn ''gần như chắc
    chắn loại trừ'' và câu hỏi suy luận về tính cách của Zettour (''ông ấy'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Trích dẫn từ khóa, đại từ & đối lập: giữ dấu nháy đơn quanh từ
    ''‘lập tức’'' khớp với điện văn; quy chiếu Tanya bằng ''cô'' và Zettour bằng ''ông
    ấy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & chức danh: tự quy chiếu bằng ''mình'' theo
    DEC-P01-001; ''staff officer'' -> ''sĩ quan tham mưu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Khẳng định suy luận: giữ cấu trúc ''Đó chỉ có thể là mệnh lệnh
    bắt đầu một chiến dịch và lựa chọn hành động tối ưu.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: giữ đại từ tự quy chiếu ''mình'' trong độc thoại
    nội tâm của Tanya."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tự vấn ngắn: giữ nguyên ''Tình cảnh này ư? Đó là nỗi thống
    khổ của cảnh bị bao vây.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Mệnh đề chuyển ý: giữ nguyên ''Nếu vậy thì câu trả lời thật đơn
    giản.''"]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ sắc thái dè dặt nhưng kỳ vọng ''nhưng biết đâu
    cách này lại hiệu quả''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & cảm thán: ''General von Zettour'' -> ''Tướng von Zettour'';
    giữ câu cảm thán ''Thật không thể tin nổi''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''maneuver battle'' -> ''trận đánh
    cơ động''; quy chiếu Tanya bằng ''cô'' / ''mình''; giữ phủ định ''không còn mảy
    may nghi ngờ gì''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Đại từ & chức danh: quy chiếu Zettour bằng ''ông ấy'', Tanya bằng
    ''cô''; ''staff officer'' -> ''sĩ quan tham mưu''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000557
  kind: terminology_and_voice
  value: 'choices=["Đại từ gộp trong thoại: Tanya dùng ''Chúng ta'' khi tuyên bố trước
    thuộc cấp."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000558
  kind: terminology_and_voice
  value: 'choices=["Từ khóa hồi ứng & mệnh lệnh quân sự: giữ cụm ''vừa lập tức vừa
    mau lẹ'' hồi ứng từ khóa ''lập tức''; giữ nhịp điệu mệnh lệnh dứt khoát ''Chúng
    ta sẽ rút khỏi đây! Tập hợp tất cả các chỉ huy đơn vị lại! Khẩn trương lên!''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000559
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Serebryakov gọi Tanya (''Colonel'') là ''Thưa
    Trung tá, Trung tá... ạ?''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000560
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ in nghiêng từ cảm thán ''*Ồ.*''
    theo DEC-P01-002; trần thuật dùng ''Tanya'' và ''Cô''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000561
  kind: terminology_and_voice
  value: 'choices=["Từ vựng liên kết: dịch ''attentiveness'' là ''chu đáo'' để liên
    kết trực tiếp với lời khen Serebryakov ở p000563."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000562
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm: giữ câu chiêm nghiệm về nguyên tắc tổ chức
    ''vừa đơn giản lại vừa sâu sắc''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000563
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & giọng điệu: Tanya gọi ''Trung úy Serebryakov''
    là ''Cô'', tự xưng ''Tôi''; ''General von Zettour'' -> ''Tướng von Zettour'';
    giữ cách nói ví von hài hước ''bức thư tình của Tướng von Zettour''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000564
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ in nghiêng ''*Được rồi.*'' khớp với thẻ
    em trong nguồn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000565
  kind: terminology_and_voice
  value: 'choices=["Định dạng điện văn, dấu nháy đơn & thuật ngữ: giữ nguyên dấu nháy
    đơn quanh ''‘Tướng von Zettour’'', ''‘Đại tá von Lergen’'' và ''‘đã ấn định’'';
    khóa ''chỉ huy trưởng Kampfgruppe Lergen'' và từ khóa ''lập tức''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000566
  kind: terminology_and_voice
  value: 'choices=["Cụm chuyển cảnh: giữ nguyên ''Chẳng bao lâu sau…''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000567
  kind: terminology_and_voice
  value: 'choices=["Chức danh, quân hàm & thuật ngữ: ''magic officer'' -> ''sĩ quan
    ma pháp''; ''Lieutenant General von Zettour'' -> ''Trung tướng von Zettour'';
    ''forward command post'' -> ''sở chỉ huy tiền phương''."]'
