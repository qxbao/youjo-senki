    -> ''chính quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & phủ định: ''Intelligence agency'' -> ''cơ
    quan Tình báo''; Johnson tự xưng ''tôi'' / ''chúng tôi'', gọi Drake là ''anh'',
    quy chiếu Zettour bằng ''Ông ta''; giữ phủ định ''không nắm trong tay bất kỳ thực
    quyền nào cả''; ''empty title'' -> ''chức danh hữu danh vô thực''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận: giữ nguyên ''“Chuyện đó đã được xác nhận chưa?”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đại từ & tình thái: giữ dấu chấm lửng mở đầu; Johnson
    tự xưng ''tôi'', dùng ''chúng ta'' cho ''we''; ''classified intel'' -> ''tin tình
    báo tuyệt mật''; giữ tình thái ''tin rằng chuyện đó coi như đã là sự thật'', ''thực
    sự tin điều đó là thật''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, cấp bậc & phủ định: giữ cặp dấu gạch ngang dài ''—tức
    là thứ ma pháp ấy—''; ''the lieutenant general'' -> ''vị trung tướng''; ''B Group''
    -> ''Cụm B''; giữ phủ định ''sẽ không nắm quyền chỉ huy'' và ''không thể tiết
    lộ nguồn tin cho Drake biết''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đối lập: giữ giới hạn ''chỉ bao gồm các chuyến thị
    sát, cùng lắm là đưa ra đôi chút hỗ trợ với tư cách cố vấn'' và sự đối lập ''Trong
    thời bình, nghe có vẻ quan trọng đấy, nhưng trong thời chiến, vai trò của một
    sĩ quan cấp cao không có quyền chỉ huy là rất hạn chế''."]'
