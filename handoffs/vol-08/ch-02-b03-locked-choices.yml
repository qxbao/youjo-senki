choices:
- segment_id: YS-LN08/Text/chapter006.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Tình thái & điều kiện: giữ quan hệ nhượng bộ ''Dù có thể chỉ là
    tin đồn truyền tai nhau'' và điều kiện ''nhưng nếu kẻ địch rối loạn dù chỉ một
    chút thôi thì cũng tuyệt lắm rồi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: dùng ''chúng ta'' cho ''our'';
    ''the Empire'' -> ''Đế quốc''; giữ tình thái ''Nghe đâu... thực sự đã trở nên
    khá phức tạp''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Tên gọi & tình thái: giữ ''Drake'' và hai lớp tình thái ''có vẻ
    thấy chuyện đó thú vị'', ''như thể trong vô thức''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ: Johnson tự xưng ''tôi''; ''throw a wrench into
    the imperial war machine'' -> ''chọc gậy bánh xe vào cỗ máy chiến tranh của Đế
    quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái: giữ tình thái ''Nghe nói'', ''tôi
    còn nghe bảo''; ''Imperial Army General Staff'' -> ''Bộ Tổng tham mưu Lục quân
    Đế quốc''; ''imperial government'' -> ''chính phủ Đế quốc''; ''supply officer''
    -> ''sĩ quan tiếp vận''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''B Group''
    -> ''Cụm B''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phủ định & ẩn dụ: giữ câu hỏi tu từ phủ định ''Chẳng phải
    chỉ là kiểu thằn lằn tự đứt đuôi thôi sao?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & thuật ngữ: giữ cấu trúc ''Dù sự hoài nghi
    lành mạnh của Drake rất đáng khen, nhưng...''; ''the Empire’s leadership'' ->
    ''giới lãnh đạo Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & dấu câu: giữ đối lập khẳng định – phủ định
    ''tự cắt bỏ bộ não chứ chẳng phải cái đuôi đâu''; ''head of the General Staff''
    -> ''người đứng đầu Bộ Tổng tham mưu''; ''central office'' -> ''văn phòng trung
    ương''; ''deputy director of the Service Corps'' -> ''Cục phó Cục Quân vụ''; giữ
    dấu nháy đơn quanh ''‘thăng chức’'' và ''‘điều phối viên’''; ''B Group'' -> ''Cụm
    B''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''General Staff'' -> ''Bộ Tổng tham mưu'';
    ''general'' -> ''vị tướng''; giữ hai câu hỏi liên tiếp của Drake."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ & đại từ: ''military administrator'' -> ''Nhà
    hành chính quân sự''; ''Lieutenant General von Zettour'' -> ''Trung tướng von
    Zettour''; ''the home country'' -> ''chính quốc''; ''General Staff'' -> ''Bộ Tổng
    tham mưu''; quy chiếu Zettour bằng ''ông ta''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: Johnson tự xưng ''tôi'', quy chiếu Drake bằng
    ''anh ta''; trong thoại, Drake tự xưng ''tôi'' và quy chiếu Zettour bằng ''ông
    ta''; giữ dấu chấm lửng mở đầu câu thoại."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & đại từ: giữ dấu gạch ngang dài trong thoại ''“Đúng thế—tài
    giỏi đến mức đáng sợ.”''; Johnson tự xưng ''Tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Đại từ, cấp bậc & thuật ngữ: Johnson tự xưng ''tôi'' / ''mình'',
    dùng ''chúng tôi'' cho phía Tình báo; ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''military man
    of pure evil'' -> ''quân nhân tà ác thuần túy''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & dấu câu: quy chiếu Zettour bằng ''ông ta'',
    dùng ''chúng tôi'' cho ''our''/''we''; ''logistical support'' -> ''chi viện hậu
    cần''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''supply network'' -> ''mạng
    lưới tiếp tế''; ''Council for Self-Government'' -> ''Hội đồng Tự trị''; ''eastern
    front'' -> ''mặt trận phía đông''; ''encoded messages we intercepted'' -> ''các
    bức điện mã hóa chặn thu được''; giữ dấu gạch ngang dài."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Zettour bằng ''ông ta''; ''promoted
    away from Central'' -> ''bị thăng chức để đẩy đi khỏi Trung ương''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: dùng ''chúng ta'' cho ''us''/''our''; quy
    chiếu Zettour bằng ''ông ta''; ''A Group’s logistics'' -> ''hậu cần cho Cụm A'';
    ''the analysts'' -> ''Các nhà phân tích''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''huge offensive'' -> ''cuộc tiến công quy
    mô lớn''; ''military administrator'' -> ''nhà hành chính quân sự''; ''logistics
    and supplies'' -> ''hậu cần và tiếp tế''; ''the Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''human resources'' -> ''nguồn nhân lực''; giữ nhận
    định khái quát về vận hành tổ chức lớn."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi & tình thái: ''the Empire'' -> ''Đế quốc'';
    giữ câu hỏi tu từ ''Chẳng lẽ... rồi sao?'' và tình thái suy đoán ''Có lẽ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đại từ: ''enemy supply network'' -> ''mạng
    lưới tiếp tế của địch''; ''eastern front'' -> ''mặt trận phía đông''; giữ phủ
    định ''không phải là tin xấu''; Drake tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Johnson gọi Drake là ''Anh'' nhất quán với các batch
    trước."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Drake gọi Johnson là ''Ông'' và dùng ''chúng
    ta'' cho ''we''; ''military administrator'' -> ''nhà hành chính quân sự''; ''B
    Group'' -> ''Cụm B''; ''eastern front'' -> ''mặt trận phía đông''; ''defensive
    lines'' -> ''các tuyến phòng ngự''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ nguyên ''“Thế thì sao?”''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & thuật ngữ: giữ tình thái ''rất có thể là''
    và cấu trúc phủ định ''Tôi không thể nhìn... mà lại diễn giải đó là một dấu hiệu
    tốt lành được''; ''defensive battle'' -> ''trận phòng ngự''; ''B Group'' -> ''Cụm
    B''; ''defensive positions'' -> ''các trận địa phòng ngự''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu & thuật ngữ: Johnson tự xưng ''tôi''; giữ dấu
    hai chấm giải thích; ''military administrator'' -> ''nhà hành chính quân sự'';
    ''B Group'' -> ''Cụm B''; ''logistical network'' -> ''mạng lưới hậu cần''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Giả định & thuật ngữ: giữ câu điều kiện giả định ''sẽ là một vấn
    đề khổng lồ nếu...''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''Council for
    Self-Government'' -> ''Hội đồng Tự trị''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giới hạn: Johnson tự xưng ''tôi''; ''Imperial
    Army intel'' -> ''tin tình báo về Lục quân Đế quốc''; giữ cấu trúc giới hạn ''chỉ
    đang bi thảm bị lưu đày về vùng hẻo lánh chứ chẳng có gì hơn''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu, chú thích & thuật ngữ: quy chiếu Zettour bằng
    ''Ông ta'' / ''ông ta''; giữ dấu chấm lửng giữa đoạn và ký hiệu chú thích ''¹'';
