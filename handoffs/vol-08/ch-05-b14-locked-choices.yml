choices:
- segment_id: YS-LN08/Text/chapter018.xhtml/p000481
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, điểm nhìn & đại từ: bảo toàn chính xác câu chữ nghiêng
    mở đầu ''*Do đó, kết luận chúng ta cần đưa ra là quá rõ ràng.*'' theo DEC-P01-002;
    trần thuật quy chiếu Drake bằng ''Ông'', trong thoại dùng đại từ bao gộp ''chúng
    ta'' và giữ mệnh lệnh dứt khoát tấn công trận địa địch ngay lập tức."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000482
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện: ''matériel superiority'' -> ''ưu thế về
    vật tư và trang bị quân sự''; giữ quan hệ điều kiện – hệ quả (''Nếu dùng ưu thế...
    để áp đảo chúng, họ sẽ có thể chọc thủng phòng tuyến'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & đại từ: quy chiếu phe Drake bằng ''họ'', riêng Drake bằng
    ''ông''; giữ hình ảnh ''một phép tính tàn nhẫn'' nhưng mang lại kết quả chắc chắn
    và so sánh hơn (''tốt hơn là tấn công rồi phải bỏ lại thi thể cấp dưới của ông
    ở phía sau'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại mệnh lệnh: ''tank desant'' -> ''chiến
    thuật tùng thiết trên xe tăng''; ''interpreter'' -> ''phiên dịch viên''; giữ nhịp
    câu mệnh lệnh dồn dập, khẩn trương của Drake."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu ngăn cản lịch sự nhưng kiên quyết của Tanechka
    (''Xin hãy khoan đã!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô & sắc thái: trần thuật quy chiếu Drake bằng ''ông'',
    Tanechka bằng ''cô ta''; trong thoại Drake gọi Tanechka là ''cô'', dùng ''chúng
    ta''; giữ hình ảnh so sánh ''như một gáo nước lạnh'' và chuỗi câu hỏi vặn đầy
    sững sờ."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô, thuật ngữ & ngoại lệ: Tanechka gọi ''Trung
    tá Drake'' (''Colonel Drake''), xưng ''Tôi'' - ''ngài'', gọi binh lính là ''các
    đồng chí của ngài''; ''tank desants'' -> ''chiến thuật tùng thiết trên xe tăng'';
    ''flank attacks'' -> ''tấn công vào sườn''; giữ cấu trúc cấm đoán kèm ngoại lệ
    (''bị nghiêm cấm trừ phi là tấn công vào sườn'') và câu bỏ lửng ở cuối."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô, thuật ngữ & cấu trúc tự hiệu chỉnh: trần thuật
    dùng ''Ông'', trong thoại Drake gọi Tanechka là ''Cô''; ''periphery'' -> ''vòng
    ngoài''; ''imperial mage forces'' -> ''lực lượng pháp sư Đế quốc''; giữ nhịp tự
    hiệu chỉnh qua dấu gạch ngang (''Ngay lúc này chính là cơ hội của chúng ta—không,
    đây là cơ hội duy nhất...'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanechka gọi Drake là ''Ngài''; ''definite
    proof'' -> ''bằng chứng xác thực''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Liên kết từ vựng: giữ nguyên cụm ''Bằng chứng xác thực ư? Về chuyện
    gì?'' để nối trực tiếp với câu hỏi ở p000489."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: dùng ''chúng ta''; giữ cấu trúc câu hỏi vặn
    chứa phủ định (''Đâu là bằng chứng cho thấy quân địch không đang nằm phục sẵn
    để đánh úp chúng ta?!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chữ nghiêng cho câu độc thoại
    nội tâm ngắn của Drake ''*Đào đâu ra thứ đó chứ?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chữ nghiêng cho câu hỏi tu từ
    nội tâm của Drake ''*Ai lại đi đòi hỏi thứ đó cơ chứ?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & thuật ngữ: bảo toàn chữ nghiêng ''*Đây là tuyến đầu
    tiên đấy!*'' theo DEC-P01-002; ''forward-most line'' -> ''tuyến đầu tiên''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Drake gọi Tanechka là ''cô'', dùng ''Chúng
    ta''; giữ giọng điệu gay gắt mỉa mai (''Nếu cô muốn rủi ro bằng không, thì cởi
    ngay bộ quân phục đó ra đi! Tự chôn mình xuống đất mà tận hưởng giấc ngủ ngàn
    thu ấy!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & thuật ngữ: dịch đại từ phiếm chỉ ''you'' là
    ''bạn''; ''fog of war'' -> ''màn sương mù chiến tranh''; không dùng chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chữ nghiêng cho toàn bộ câu độc
    thoại nội tâm ''*Nhưng lần này, chúng ta có thể tự tin tung đòn, vậy cớ sao lại
    phải chùn tay?!*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Drake xưng ''tôi'' - ''cô'', gọi
    địch là ''chúng''; ''signals'' -> ''tín hiệu''; ''operating conditions'' -> ''điều
    kiện tác chiến''; ''situational assessment'' -> ''nhận định tình hình''; giữ phủ
    định nhấn mạnh ''trong đầu tôi chẳng còn mảy may nghi ngờ nào cả!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giả định: Tanechka gọi Drake là ''Ngài'', dùng ''chúng
    ta''; giữ câu hỏi giả định về hệ quả nếu thất bại."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''reconnaissance in force'' -> ''trinh sát
    chiến đấu''; ''mage units'' -> ''các đơn vị pháp sư''; ''urban area'' -> ''khu
    vực đô thị''; giữ phủ định ''không đời nào chúng giữ nổi phòng tuyến''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi phủ định: Tanechka xưng ''Tôi'' -
    ''ngài'', dùng ''chúng ta''; ''the party'' -> ''Đảng''; giữ câu hỏi tu từ phủ
    định ''Chẳng lẽ ngài không nhận được thông báo từ Đảng sao?!''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba theo điểm nhìn Drake
    (''ông''), quy chiếu Tanechka bằng ''cô ta''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: quy chiếu Drake bằng ''Ông''; giữ
    phủ định ''không cần thêm cái rào cản là sự cầm tay chỉ việc của một sĩ quan chính
    trị''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi tu từ: Drake gọi Tanechka là ''cô'', dùng ''chúng
    ta''; giữ câu hỏi tu từ phủ định nhấn mạnh (''Chẳng phải chính vì thế nên việc
    chúng ta gây sức ép lên quân địch lại càng có ý nghĩa hay sao?!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & dấu ngắt câu: Tanechka dùng ''chúng ta'';
    ''weakened imperial units'' -> ''các đơn vị Đế quốc đã suy yếu''; giữ dấu gạch
    ngang dài biểu thị lời nói bị ngắt quãng (''bao vây—'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, giả định & phủ định: ''the home country'' -> ''chính
    quốc''; giữ giả định trái thực tế (''nếu ngắt lời một phụ nữ như vậy, hẳn Drake
    đã bị tát vào mặt bằng cuốn cẩm nang nghi thức xã giao rồi'') và mệnh đề phủ định
    đối lập trên chiến trường (''chẳng có sự phân biệt nào giữa đàn ông và phụ nữ
    cả—một kẻ khốn ngu xuẩn thì vẫn cứ là một kẻ khốn ngu xuẩn'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, đại từ, quân hàm & thuật ngữ: bảo toàn chính xác phạm
    vi chữ nghiêng cho hai câu độc thoại nội tâm xen giữa đoạn ''*Sao cô ta lại không
    hiểu nổi cơ chứ? Dù là sĩ quan chính trị đi nữa, cô ta vẫn đeo quân hàm trung
    úy kia mà!*'' theo DEC-P01-002; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen'';
    ''Imperial Army'' -> ''Lục quân Đế quốc''; ''first lieutenant'' -> ''trung úy'';
    ''multinational [unit]'' -> ''đơn vị đa quốc gia''; ''imperial lines'' -> ''phòng
    tuyến của Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh, tình thái & giả định: bảo toàn chính xác câu chữ nghiêng
    cuối đoạn ''*Tại sao cô ta không hiểu rằng khi ấy một đòn giáng tại đây sẽ lại
    càng mang ý nghĩa trọng đại hơn nữa chứ?*'' theo DEC-P01-002; giữ đúng các bậc
    tình thái thận trọng (''xem chừng'', ''nghe nói thậm chí có khả năng'', ''Chưa
    rõ thông tin đó xác thực đến đâu'', ''nhưng nếu đồng minh của họ thực sự có thể
    trụ vững ở phía nam…'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: giữ câu bác bỏ dứt khoát của Tanechka (''Đó
    không phải là quyết định thuộc thẩm quyền của chúng ta!'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Liên kết từ vựng & nhịp câu: giữ sự lặp lại có chủ đích của cụm
    ''đưa ra quyết định'' / ''những quyết định đó'' nối với p000509 và nhịp 3 câu
    ngắn dứt khoát nêu định nghĩa vai trò người sĩ quan."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chữ nghiêng cho câu hỏi nội tâm
    của Drake ''*Thế nhưng cô ta thậm chí còn từ chối cả việc đánh giá tình hình ư?*''
    theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh & điểm nhìn: bảo toàn chữ nghiêng cho câu hỏi nội tâm
    nối tiếp ''*Vậy thì ai sẽ làm việc đó?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''The party'' -> ''Đảng''; dùng ''chúng ta'';
    giữ nghĩa mệnh lệnh vây hãm và giữ chặt quân địch trong vòng vây."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ dấu chấm lửng mở đầu và cặp xưng hô ''Cô''
    - ''tôi'' trong câu hỏi dồn nén của Drake (''…Cô đang bảo tôi phải tuân lệnh Đảng
    đấy à?'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu đáp ngắn gọn, tuyệt đối của Tanechka (''Tất
    nhiên.'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: quy chiếu Tanechka bằng ''cô ta'';
    ''the Federation'' -> ''Liên bang''; giữ hai cấu trúc phủ định (''như thể chẳng
    mảy may nghi ngờ gì'' và ''thì sĩ quan của họ thậm chí chẳng thể coi là sĩ quan
    nữa'')."]'
- segment_id: YS-LN08/Text/chapter018.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái lễ nghi: dịch ''Ma’am'' là ''Thưa cô'', xưng
    ''tôi'' khi Trung tá Drake chuyển sang lối nói lịch sự cứng nhắc theo nghi thức
    để chuẩn bị tuyên bố lập trường chính thức với Trung úy Tanechka."]'
