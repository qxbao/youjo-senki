- segment_id: YS-LN08/Text/chapter014.xhtml/p000453
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu danh ngữ: giữ nhịp câu ngắn ''Một điều gì đó thiêng
    liêng, hay có lẽ là một thoáng cô đơn.''; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000454
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & câu hỏi tu từ: quy chiếu Zettour bằng ''Ông''
    / ''ông''; ''Lieutenant Grantz'' -> ''Trung úy Grantz''; Zettour gọi Grantz là
    ''cậu'' và giữ câu hỏi tu từ khích lệ."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000455
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ nguyên câu hỏi ngập ngừng ''“Thưa Tướng
    quân…?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000456
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & phủ định khuyên nhủ: ''Lieutenant'' -> ''Trung
    úy''; Zettour gọi Grantz là ''cậu''; giữ câu khuyên phủ định ''Không nên kìm nén
    những thắc mắc trong lòng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000457
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi xác nhận: Grantz dùng ''chúng ta'' kèm tiểu
    từ kính ngữ ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000458
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phân tách đại từ điểm nhìn: in nghiêng câu
    đầu ''*Cậu ta có trực giác nhạy bén đấy.*'' (nội tâm Zettour gọi Grantz là ''Cậu
