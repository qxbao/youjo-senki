- segment_id: YS-LN08/Text/chapter014.xhtml/p000459
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, địa danh & đơn vị: ''Lieutenant'' -> ''Trung úy''; ''Soldim
    528'' -> ''Soldim 528''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''; Zettour
    gọi Grantz là ''Cậu'' và gộp bằng ''chúng ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000460
  kind: terminology_and_voice
  value: 'choices=["Thán từ: giữ câu cảm thán ngắn ''“Ồ!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000461
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & tình thái: giữ tên ''Zettour'' và sắc thái phỏng đoán
    ''hoặc có lẽ nó xuất phát từ cảm nhận rằng lời nói của cấp trên là đáng tin cậy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000462
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giọng chiêm nghiệm: giữ mệnh đề định ngữ phủ định ''Tuổi
    trẻ chưa biết đến sự hoài nghi lại rạng rỡ như thế đấy.''; không in nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000463
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đơn vị & xưng hô: ''eastern army'' -> ''đạo quân phía
    đông''; ''B Group'' -> ''Cụm B''; ''division commander'' -> ''tư lệnh sư đoàn'';
    Zettour xưng ''Tôi'' và ''Chúng ta'', quy chiếu trần thuật bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000464
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ in nghiêng cụm ''*điều đúng đắn*'' trong
    câu ''Hãy nói rằng đó là *điều đúng đắn* phải làm.'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000465
  kind: terminology_and_voice
  value: 'choices=["Phủ định, khẩu ngữ & thuật ngữ: giữ phủ định ''Họ không có ý thức
