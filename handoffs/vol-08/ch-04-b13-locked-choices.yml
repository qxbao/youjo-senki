    trên xe tăng''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000446
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: dịch câu hỏi ngắn ''“Dạ, thưa ngài?”'' thể hiện sự ngạc
    nhiên lễ phép của Grantz."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000447
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: giữ nguyên câu nội tâm in nghiêng
    ''*Ra là khả năng ứng biến của họ cũng có giới hạn.*'' theo DEC-P01-002; quy chiếu
    nhóm của Grantz bằng ''họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000448
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: in nghiêng toàn đoạn ''*Không
    sao cả. Mình chỉ cần giải thích thôi.*''; Zettour tự quy chiếu trong nội tâm bằng
    ''Mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000449
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''Lieutenant'' -> ''Trung úy''; Zettour dùng
    đại từ gộp ''Chúng ta''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000450
  kind: terminology_and_voice
  value: 'choices=["Lắp bắp & kính ngữ: giữ nét lắp bắp và kính ngữ trong câu hỏi
    ''“M-một cuộc chiến sao ạ?”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000451
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & xưng hô: Zettour xưng ''tôi'' / ''mình'',
    gộp bằng ''chúng ta''; chỉ in nghiêng cụm ''*của chúng ta*'' khớp đúng thẻ em
    trong nguồn."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000452
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tên riêng & nhấn mạnh Markdown: ''eastern army'' ->
    ''đạo quân phía đông''; giữ tên ''Tanya'' và ''Zettour''; giữ phủ định ''Chẳng
