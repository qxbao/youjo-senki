    cú''; ''blocking action'' -> ''trận đánh ngăn chặn''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000466
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp quân sự: khóa câu đáp ''“Rõ, thưa ngài!”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000467
  kind: terminology_and_voice
  value: 'choices=["Liên từ chuyển đoạn: giữ nguyên ''Tuy nhiên…''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000468
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đại từ: giữ tình thái suy đoán ''Có lẽ Grantz đã được
    huấn luyện quá kỹ càng''; quy chiếu Grantz bằng ''anh''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000469
  kind: terminology_and_voice
  value: 'choices=["Chức danh, cơ quan & phủ định: ''deputy director of the Service
    Corps in the General Staff'' -> ''Cục phó Cục Quân vụ thuộc Bộ Tổng tham mưu'';
    ''the forward-most line'' -> ''tuyến tiền tiêu xa nhất''; giữ nhận định phủ định
    ''không ai khuyến khích ông ngồi xe quân sự lao ra tận tuyến tiền tiêu xa nhất''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000470
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & logic: giữ nguyên nghĩa phủ định kép ''khoác súng
    trường và mang lựu đạn mà không gây chú ý là điều hoàn toàn bất khả thi'' và nhận
    định ''chắc chắn chỉ là số ít ngoại lệ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000471
  kind: terminology_and_voice
  value: 'choices=["Tình thái & chức danh: giữ tình thái ''có vẻ những người bình
    thường đương nhiên sẽ có sự dè dặt trước chuyện đó''; ''Commander Cramm'' -> ''Chỉ
    huy Cramm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000472
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: ''divisional headquarters'' -> ''sở chỉ
    huy sư đoàn''; giữ tên ''Zettour'', ''Grantz'', ''Cramm'' và dấu ba chấm biểu
    thị sự ngập ngừng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000473
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chức danh: Zettour gọi Cramm là ''anh'' và ''Chỉ huy
    Cramm''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000474
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & kính ngữ: Cramm gọi Zettour là ''Thưa Tướng quân'' /
    ''ngài'', xưng ''Tôi'' kèm ''ạ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000475
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chức danh: Zettour xưng ''Tôi'' – ''anh'', gọi Cramm
    là ''Chỉ huy''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000476
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & xưng hô: phân biệt Cramm (''ông ta'') với
    Zettour; trong thoại Cramm xưng ''Chúng tôi'' / ''tôi'', gọi Zettour là ''Thưa
    Tướng quân'' / ''ngài''; giữ nguyên giọng khẩn cầu ở lại tuyến sau."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000477
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định nội tâm: giữ câu nội tâm in nghiêng
    phủ định ''*Nhưng cứ thế thì chúng ta sẽ chẳng đi đến đâu cả…*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000478
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đơn vị & quân hàm: ''General Staff'' -> ''Bộ Tổng tham
    mưu''; ''B Group'' -> ''Cụm B''; ''General von Zettour'' -> ''Tướng von Zettour'';
    giữ ẩn dụ ''đám thỏ đế ở Cụm B''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000479
  kind: terminology_and_voice
  value: 'choices=["Chức danh, tổ chức & xưng hô: ''Commander Cramm'' -> ''Chỉ huy
    Cramm''; ''division commander'' -> ''tư lệnh sư đoàn''; ''Imperial Army'' -> ''Lục
    quân Đế quốc''; Zettour xưng ''Tôi'' – ''anh'', quy chiếu trần thuật bằng ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000480
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & tên riêng: ''major general'' -> ''thiếu tướng'' (quy
    chiếu Cramm); giữ tên ''Zettour''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000481
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Cramm gọi Zettour là ''Thưa Tướng quân'' /
    ''Ngài'', xưng ''chúng tôi''; giữ câu can ngăn phủ định bỏ lửng ''Ngài đâu cần
    phải làm đến mức đó—chúng tôi có thể…''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000482
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & phủ định kép: in nghiêng ''*Nghe
    này, Chỉ huy Cramm*''; dịch ''straitlaced field officers'' là ''những sĩ quan
    chiến trường nghiêm túc'' (hoặc ''những sĩ quan thực địa nghiêm túc'', không dịch
    là ''sĩ quan cấp tá''); giữ phủ định kép ''chẳng thể khẳng định rằng mình sẽ không
    giở mánh khóe nào''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Zettour bằng ''ông''; ''officer
    in the field'' -> ''sĩ quan ngoài chiến trường''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & đính chính: Zettour xưng ''tôi'' – ''Anh'';
    giữ nhịp tự đính chính ''nhưng tôi—không, một sĩ quan Bộ Tổng tham mưu—mới phải
    là người nắm bắt cơ hội này để bao vây một trong các cánh quân của địch'' và câu
    hỏi tu từ cuối đoạn."]'
