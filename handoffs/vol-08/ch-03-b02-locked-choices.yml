choices:
- segment_id: YS-LN08/Text/chapter010.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: sĩ quan tham mưu Cụm B gọi Trung tướng von
    Zettour là ''thưa Tướng quân'' (''General''); giữ câu can ngăn lịch sự ''“Xin
    khoan đã, thưa Tướng quân.”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu hỏi ngắn gọn, điềm tĩnh của Zettour ''“Chuyện
    gì?”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: sĩ quan tham mưu gọi Zettour là
    ''ngài'' và xưng ''chúng ta''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''passive
    defense'' -> ''thế phòng ngự bị động''; giữ phủ định và dấu chấm lửng cuối câu
    (''chúng ta không còn binh lính nào dư dả cả…'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Phủ định bộ phận: giữ đúng mức độ phủ định nhẹ nhưng kiên quyết
    của Zettour ''“Nói vậy không hẳn là đúng.”''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ đối lập: ''B Group staffers'' -> ''Các sĩ
    quan tham mưu Cụm B''; giữ tương phản giữa nỗ lực phản biện rằng việc đó bất khả
    thi của các sĩ quan tham mưu và thái độ kiên quyết xoáy sâu vào luận điểm của
    Zettour."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Zettour gọi các sĩ quan tham mưu
    Cụm B là ''các vị''; ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ sự phân biệt
    giữa nhiệm vụ ''giữ vững phòng tuyến'' và phủ định ''nó không hề hạn chế quyền
    cơ động của các vị''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu cảm thán: sĩ quan tham mưu gọi Zettour là ''ngài'',
    xưng ''chúng ta''; giữ giọng van nài khẩn thiết về tình trạng ít quân."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi đuôi: Zettour xưng ''Tôi'' và dùng
    ''chúng ta''; giữ điều kiện phủ định (''nhưng khi không có phương án thay thế
    nào khác, chúng ta chẳng còn lựa chọn nào cả…''); ''strike of surgical precision''
    -> ''đòn tập kích chuẩn xác như dao mổ''; ''concentrated deployment of our reserves''
    -> ''triển khai tập trung lực lượng dự bị của chúng ta''; giữ câu hỏi đuôi xác
    nhận ''phải không?''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & xưng hô: giữ tật nói lắp bàng hoàng ''Ý-ý-ý ngài
    là'' và câu hỏi xác nhận ''toàn bộ lực lượng dự bị ư?''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: trần thuật ngôi thứ ba quy chiếu
    Zettour bằng ''ông''; giữ lời khẳng định dứt khoát và câu phủ định ''Chúng ta
    không thể bỏ rơi binh lính của mình được.''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện & dấu câu: sĩ quan tham mưu xưng ''Tôi'', dùng
    ''chúng ta'' và gọi đơn vị bị vây là ''họ''; ''withdraw under their own power''
    -> ''tự lực rút lui''; ''mount a major operation to break the encirclement'' ->
    ''phát động một chiến dịch quy mô lớn nhằm phá vỡ vòng vây''; giữ mệnh đề điều
    kiện bỏ lửng ở cuối câu."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Xưng hô cá nhân, thuật ngữ & chuỗi câu hỏi trách cứ: Zettour xưng
    ''tôi'' và gọi viên sĩ quan tham mưu vừa phát biểu là ''anh''; ''staff officer
    curriculum'' -> ''chương trình đào tạo sĩ quan tham mưu''; ''war college'' ->
    ''trường đại học quân sự''; giữ rõ nguyên nhân đơn vị bị vây hãm là ''do sai lầm
    của cấp trên''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Phủ định điều kiện & thuật ngữ: ''basic leadership'' -> ''thuật
    lãnh đạo cơ bản''; giữ cấu trúc phủ định gắn với khả thể (''Không cử quân đi giải
    cứu khi có thể sẽ gây ra những hệ lụy tiêu cực sâu rộng trong quân đội'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Xưng hô số nhiều, thuật ngữ & phủ định kép: Zettour gọi nhóm sĩ
    quan tham mưu là ''các vị'' và xưng ''tôi''; ''matériel'' -> ''vật tư và trang
    bị quân sự''; ''Melting Line'' -> ''Tuyến Tan Băng''; ''Soldim position'' -> ''trận
    địa Soldim''; ''high-ranking General Staff officers'' -> ''những sĩ quan cấp cao
    của Bộ Tổng tham mưu''; ''Rhine front'' -> ''mặt trận Rhine''; ''Great Army''
    -> ''Đại Quân''; giữ cấu trúc phủ định kép ''Đừng nói với tôi là các vị không
    biết tại sao... lại bị giáng chức nhé''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn khái quát, phủ định & câu hỏi tu từ: chuyển chủ ngữ
    khái quát thành ''Người ta'' / câu hỏi vô nhân xưng tự nhiên; ''intangible assets''
    -> ''những tài sản vô hình''; ''fighting spirit, morale, or trust in the organization''
    -> ''tinh thần chiến đấu, sĩ khí hay niềm tin vào tổ chức''; giữ câu hỏi tu từ
    cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ khẳng định phủ định ''quân đội cũng không phải ngoại
    lệ''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, giả định & so sánh: ''command'' -> ''cấp chỉ huy'';
    ''HQ'' -> ''Sở chỉ huy''; giữ phép so sánh sai lầm của cấp chỉ huy với ''một cơn
    cúm độc địa'', mức độ tăng tiến (''sự phi lý thì còn tệ hại hơn cả một sai lầm
    ngớ ngẩn'') và câu hỏi giả định cùng hệ quả (''Chỉ sau một đêm, họ sẽ phải đối
    mặt với một đội quân mất kiểm soát trong tay'')."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc lựa chọn: ''Lergen Kampfgruppe'' -> ''Kampfgruppe
    Lergen''; giữ thế lưỡng nan giữa ''về cơ bản tự bức tử cả đội quân'' và ''chiến
    đấu băng qua một con đường đầy gai góc''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhân quả: ''negligence'' -> ''sự tắc trách''; ''chain
    of command'' -> ''hệ thống chỉ huy''; giữ quan hệ nhân quả và sắc thái bực tức
    của Zettour."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Tình thái bắt buộc & thuật ngữ: giữ dấu chấm phẩy và sắc thái
    bắt buộc ở câu đầu; ''the suicide of the military'' -> ''sự tự sát của quân đội'';
    ''firing squad'' -> ''đội hành quyết''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi tu từ: Zettour gọi các sĩ quan tham mưu là ''Các
    vị'', dùng ''chúng ta''; giữ sự đối lập giữa ''những người lính có kỷ luật'' và
    ''một đám ô hợp hoảng loạn, đáng thương''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đối lập & phủ định: ''staff curriculum'' -> ''Chương
    trình đào tạo tham mưu''; ''staff officers'' -> ''các sĩ quan tham mưu''; ''friendly
    unit'' -> ''đơn vị quân mình''; giữ tiền đề đối lập (dùng sự tàn nhẫn với kẻ địch
    chứ không thể tính đến phương án bỏ rơi đơn vị quân mình có khả năng cứu được)."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: giữ dấu chấm lửng đầu câu; Zettour
    dùng ''các vị'', ''tôi'', ''chúng ta''; ''Imperial Army command'' -> ''bộ chỉ
    huy Lục quân Đế quốc''; ''in the east'' -> ''ở miền đông''; ''staffers'' -> ''các
    sĩ quan tham mưu''; giữ sự đối lập giữa ''đạt được hiệu quả thực chất'' và ''việc
    phô trương thái độ''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Mức độ & đối lập: giữ mức độ không thể cứu vãn (''irrevocably''
    -> ''một cách không thể cứu vãn'') và sự tương phản giữa thời gian gây dựng lại
    niềm tin mà họ không có với việc chỉ một sai lầm duy nhất cũng đủ đập tan nó ''triệt
    để đến mức chẳng còn lại nổi một hạt bụi''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''Federation Army'' -> ''Quân đội Liên bang'';
    ''Council for Self-Government'' -> ''Hội đồng Tự trị''; ''propaganda material''
    -> ''tư liệu tuyên truyền''."]'
- segment_id: YS-LN08/Text/chapter010.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*Nếu tham gia vào cuộc
    chiến của Đế quốc, các người sẽ bị ruồng bỏ.*'' trong dấu sao theo DEC-P01-002;
    ''the Empire'' -> ''Đế quốc''; ''Commonwealth'' -> ''Khối Thịnh vượng chung'';
    ''Council for Self-Government'' -> ''Hội đồng Tự trị''."]'
