- segment_id: YS-LN08/Text/chapter004.xhtml/p000004
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=Tôi (Andrew); ông
    ấy / Drake / mình (quy chiếu Drake); locked_elements=[''Mức độ chắc chắn: khẳng
    định chắc chắn việc Drake nói ghét trường lớp là một lời nói dối trắng trợn.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000005
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=Tôi (Andrew); locked_elements=[''Thuật
    ngữ: chương trình đào tạo sĩ quan toàn diện.'', "Nhấn mạnh Markdown: giữ ''*câu
    đó*'' ứng với thẻ in nghiêng trong nguồn theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000006
  kind: terminology_and_voice
  value: 'speaker=General Drake; pronouns_and_address=Tôi / mình (Drake); locked_elements=[''Phủ
    định và tình thái: chỉ tuân theo mệnh lệnh và làm tròn bổn phận, đâu phải tự chọn
    làm công tác giáo dục.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000007
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi - ngài (Andrew - Drake); locked_elements=[''Thuật
    ngữ: chiến dịch bí mật.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000008
  kind: terminology_and_voice
  value: 'speaker=General Drake; pronouns_and_address=Cậu - tôi (Drake - Andrew);
    locked_elements=[''Quân hàm thời chiến của Drake: trung tá.'', ''Câu hỏi tu từ
    bác bỏ khả năng được tiếp cận thông tin mật ở cấp trung tá.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000009
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); ông
    ấy / vị sĩ quan ma pháp hải quân đánh bộ hào hoa này (Drake); locked_elements=[''Thuật
    ngữ: sĩ quan ma pháp hải quân đánh bộ.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000010
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi (Andrew); locked_elements=[''Phủ
    định: không mắc lại sai lầm tương tự.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000011
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=Ngài - tôi (Andrew - Drake); locked_elements=["Quân
    hàm trích dẫn lại lời Drake: ''mới chỉ là một trung tá''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000012
  kind: terminology_and_voice
  value: 'speaker=General Drake; pronouns_and_address=Tôi (Drake); locked_elements=[''Thuật
    ngữ: mặt trận phía đông.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000013
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=tôi (Andrew); locked_elements=[''Nhân
    vật và quân hàm: Đại tá Mikel.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000014
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); speaker=General Drake; pronouns_and_address=tôi
    (Andrew trần thuật), vị tướng / ông ấy (Drake trong trần thuật); tôi - Cậu / Chúng
    ta (Drake nói với Andrew); locked_elements=[''Thuật ngữ: binh lính Liên bang,
    đồng minh.'', ''Phủ định trong thoại: cái tên đã lâu lắm rồi mới lại được nghe.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000015
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=Ngài / mình (Andrew hỏi Drake); locked_elements=["Câu
    hỏi phủ định gợi mở: ''Ngài không muốn để lại điều gì đó khi mình vẫn còn sống
    sao?''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000016
  kind: terminology_and_voice
  value: 'speaker=General Drake; pronouns_and_address=Tôi / mình - Cậu (Drake - Andrew);
    locked_elements=[''Phủ định: không thể nói về những gì mình không biết.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000017
  kind: terminology_and_voice
  value: 'speaker=Andrew; pronouns_and_address=Lược đại từ, dùng tiểu từ lễ phép ''ạ'';
    locked_elements=["Phủ định lịch sự khi cho phép hút thuốc: ''Không phiền chút
    nào ạ.''"]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000018
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); speaker=General Drake; pronouns_and_address=ông
    ấy (Drake trong trần thuật); Andrew (Drake gọi tên); locked_elements=[''Từ vựng:
    điếu xì gà nhỏ, Andrew.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000019
  kind: terminology_and_voice
  value: 'pov=Tiêu đề thời gian - địa điểm; locked_elements=["Định dạng và thuật ngữ:
    ''NGÀY 8 THÁNG 6 NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, SỞ CHỈ HUY LỰC LƯỢNG
    ĐA QUỐC GIA''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000020
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi'' thời điểm năm 1927); speaker=Andrew; pronouns_and_address=mình
    (lẩm bẩm tự nhủ); tôi (trần thuật ngôi thứ nhất); locked_elements=[''Thuật ngữ:
    phóng viên của *WTN*, phòng tuyến Rhine, Liên bang.'', "Nhấn mạnh Markdown: giữ
    ''*WTN*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000021
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất ''tôi''); pronouns_and_address=tôi / mình (Andrew);
    locked_elements=["Thuật ngữ: Đế quốc, Đảng Cộng sản, ''hang ổ của lũ phản động
    cố chấp''.", ''Phủ định: lý lịch và tư cách tác nghiệp không trở thành rào cản.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000022
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=[''Thuật ngữ: hồng ân của Thượng
    đế, quốc gia tư bản.'', "Tình thái quá khứ: ''Chỉ có ... mới cứu vãn nổi''."]'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000023
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=[''Quan hệ nhân quả: hệ quả
    từ những điều kỳ quặc của con quái vật mang tên chính trị dẫn tới một phép màu.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000024
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=["Nhấn mạnh Markdown: giữ ''*Lũ
    Cộng sản và đám Ăng-lê rốt cuộc cũng về chung một giuộc*'' theo DEC-P01-002.",
    ''Thuật ngữ: phía Đế quốc, phe Cộng sản và phe tư bản.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000025
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=[''Thuật ngữ: Liên bang, Khối
    Thịnh vượng chung, Đảng Cộng sản, phóng viên Khối Thịnh vượng chung, lực lượng
    viễn chinh.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000026
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=[''Thuật ngữ: Liên bang, báo
    chí nước ngoài.'']'
- segment_id: YS-LN08/Text/chapter004.xhtml/p000027
  kind: terminology_and_voice
  value: 'pov=Andrew (ngôi thứ nhất); locked_elements=[''Thuật ngữ: tiếng Liên bang.'',
    ''Phủ định và hệ quả: không kỹ năng nào đạt được chỉ sau một đêm, nên một nhà
    báo quèn rất khó cạnh tranh.'']'
