choices:
- segment_id: YS-LN08/Text/chapter006.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & câu hỏi: Johnson tự xưng ''Tôi'', dùng ''chúng
    ta'' cho ''we''; ''our hosts'' -> ''bên chủ nhà''; giữ phủ định ''chẳng ngại''
    và câu hỏi rủ rê tự nhiên."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng điệu: Drake đáp ''Vâng'' lịch sự với Johnson và
    dùng ''Chúng ta'' cho câu rủ đi dạo."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: Johnson tự xưng ''tôi'', dùng ''chúng tôi''
    cho hai người trong trần thuật; ''outdoor positions'' -> ''các vị trí ngoài trời''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ: Johnson tự xưng ''tôi'' / ''mình''; giữ ẩn dụ
    hoán dụ ''những đôi tai mẫn cán''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhượng bộ: giữ ''Tôi'' / ''chúng tôi'' và cấu
    trúc nhượng bộ ''Nhưng dẫu vậy... vẫn thật rợn người''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Intelligence agent'' -> ''điệp viên Tình
    báo''; ''surveillance state'' -> ''nhà nước giám sát''; ''Federation'' -> ''Liên
    bang''; tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: ''our allies'' -> ''đồng minh của chúng tôi'';
    giữ sắc thái cảm thán mỉa mai và dấu chấm lửng cuối câu."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: tự xưng ''Tôi'' / ''mình''; ''capitalist states''
    -> ''các quốc gia tư bản''; giữ dấu hai chấm giải thích."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: ''Commonwealth'' -> ''Khối Thịnh vượng chung'';
    ''Federation'' -> ''Liên bang''; ''alliance of convenience'' -> ''liên minh vụ
    lợi''; giữ dấu chấm lửng và ẩn dụ ''lớp băng mỏng'' – ''dòng sông nghi kỵ''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: lược đại từ ngôi thứ hai phiếm chỉ ở câu đầu
    (''Chẳng thể nào lơ là cảnh giác...''); tự xưng ''tôi'' ở câu trần thuật tiếp
    theo."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: giữ dấu gạch ngang dài; tự xưng ''tôi'' và dùng
    ''chúng tôi'' khi nói về gia đình mình (''gia đình tôi... chúng tôi'')."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''public servant'' -> ''công chức nhà nước'';
    tự xưng ''tôi''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, xưng hô & thuật ngữ: ''Colonel Drake'' -> ''Trung tá
    Drake''; Johnson xưng ''tôi'' – gọi Drake là ''anh''; ''Imperial Army'' -> ''Lục
    quân Đế quốc''; ''major offensive'' -> ''cuộc tiến công quy mô lớn''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Drake gọi Johnson là ''Ông'' trong câu hỏi ngắn."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ khẳng định bằng phủ định ''Tôi không
    hề nghi ngờ gì cả''; ''eastern front'' -> ''mặt trận phía đông''; ''A Front''
    / ''B Front'' -> ''Mặt trận A'' / ''Mặt trận B''; ''A Group'' / ''B Group'' ->
    ''Cụm A'' / ''Cụm B''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái: ''Federation'' -> ''Liên bang'';
    ''below us'' -> ''ở phía dưới chúng tôi''; ''intercepted communications'' -> ''các
    thông tin liên lạc chặn thu được''; giữ tình thái ''Nhiều khả năng''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & câu hỏi đuôi: giữ dấu gạch ngang dài và câu hỏi đuôi
    ''đúng không?''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''Federation'' -> ''Liên bang''; giữ đúng
    trọng tâm câu hỏi về xác suất trụ vững ở phía nam."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định kép: tự xưng ''Tôi''; giữ cấu trúc phủ định
    cân xứng ''Không đến mức vô vọng, nhưng cũng chẳng mấy khả quan''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Đại từ phiếm chỉ & phủ định: dịch ''you'' phiếm chỉ là ''người
    ta''; giữ cấu trúc phủ định phạm vi ''Chỉ vì... không có nghĩa là...''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Giả định & đại từ phiếm chỉ: giữ câu hỏi giả định và chuyển ''you''
    phiếm chỉ thành ''mình'' / ''bạn'' tự nhiên."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái: ''A Group'' -> ''Cụm A''; ''armor,
    mages, self-propelled guns'' -> ''thiết giáp, pháp sư, pháo tự hành''; ''maneuver
    warfare'' -> ''trận chiến cơ động''; ''Federation’s defending forces'' -> ''lực
    lượng phòng ngự của Liên bang''; giữ đại từ ''chúng ta'' và tình thái ''nghe đâu'',
    ''có lẽ'', ''e là''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''urban battle'' -> ''tác chiến đô thị'';
    giữ dấu chấm lửng trước dấu chấm hỏi."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái ước muốn: quy chiếu Drake bằng ''anh
    ta'' trong lời kể; dùng ''Chúng ta'' trong lời thoại của Drake; ''black humor''
    -> ''hài hước đen tối''; ''front line'' -> ''tiền tuyến''; giữ câu ước giả định
    ''Giá mà có lấy nổi dù chỉ một tin tốt lành…''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đại từ & tình thái: giữ dấu chấm lửng đầu câu và dấu
    gạch ngang dài; tự xưng ''Tôi''; giữ tình thái ''có lẽ tính được là''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: Drake tự xưng ''Tôi''; giữ dấu chấm lửng giữa
    câu."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Đại từ: Johnson tự xưng ''Tôi'' và quy chiếu Drake bằng ''anh
    ta''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ đối lập: ''Imperial Army offensive'' -> ''cuộc
    tiến công... của Lục quân Đế quốc''; giữ sự tương phản với ''một tia hy vọng''."]'
- segment_id: YS-LN08/Text/chapter006.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: dùng ''Chúng tôi'' (cơ quan Tình báo Khối
    Thịnh vượng chung); ''political intel'' -> ''tin tình báo chính trị''; ''imperial
    family'' -> ''hoàng gia''; ''A and B Group formations'' -> ''cách biên chế đội
    hình Cụm A và Cụm B''."]'
