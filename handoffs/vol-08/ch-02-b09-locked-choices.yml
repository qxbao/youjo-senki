choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định kép & thuật ngữ: giữ tình thái ''Nhiều khả
    năng họ vẫn có thể chắp vá ra được một chiến dịch nào đó'' và phủ định kép ''chắc
    chắn Bộ Tổng tham mưu cũng không đến nỗi hoàn toàn bất lực...''; ''General Staff''
    -> ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ câu chuyển ý ngắn ''Vấn đề thực sự nằm ở chỗ khác.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Chuỗi câu hỏi giả định & tự đính chính: giữ nguyên hai câu hỏi
    liên tiếp và từ phủ định mở đầu câu thứ hai (''Không… liệu họ có gượng dậy nổi
    sau khi thất bại ở chiến dịch thứ hai hay không?'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Logic & câu hỏi điều kiện: giữ nhận định khách quan (''khả năng
    bất kỳ kịch bản nào trong hai kịch bản đó diễn ra suôn sẻ đều gần bằng không một
    cách tuyệt vọng'') và câu hỏi giả định điều kiện về nền tảng của Đế quốc."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Quan hệ tăng tiến & phủ định: giữ cấu trúc ''Ngay cả cơ hội phòng
    thủ thành công của họ cũng khó mà lạc quan nổi, huống hồ là tấn công'' và mệnh
    đề phủ định ''giả vờ như không có những vấn đề nghiêm trọng đang âm ỉ dưới toàn
    bộ cục diện này''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: giữ dấu chấm lửng mở đầu; ''Federation
    Army'' -> ''Quân đội Liên bang''; quy chiếu quân địch bằng ''Chúng'' theo điểm
    nhìn của Zettour."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Độc thoại & đại từ: trần thuật gọi Zettour là ''ông''; trong lời
    tự nhủ Zettour dùng ''Chúng ta'' cho phe Đế quốc và tự xưng ''Mình''; giữ sự đối
    lập ''Chúng ta không được phép mắc sai lầm, còn kẻ địch thì được…''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề mốc thời gian – địa điểm: giữ ''NGÀY 28 THÁNG 5 NĂM THỐNG
    NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, CĂN CỨ TIỀN TIÊU CỦA ĐẠO QUÂN PHÍA ĐÔNG''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, cấp bậc & thuật ngữ: quy chiếu Tanya trong
    trần thuật bằng ''nó'' theo DEC-P01-001; ''General Staff'' -> ''Bộ Tổng tham mưu'';
    ''eastern army’s forward base'' -> ''căn cứ tiền tiêu của đạo quân phía đông'';
    ''Colonel von Lergen'' -> ''Đại tá von Lergen''; ''Lieutenant Colonel Uger'' ->
    ''Trung tá Uger''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Logic quy tắc ngầm: giữ ''Bất cứ tin tức nào quá nguy hiểm để
    truyền đạt bằng văn bản, hoặc quá hệ trọng, thông thường đều sẽ do một sĩ quan
    trực tiếp mang tới.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, cấp bậc & phủ định: Tanya tự xưng ''mình''
    theo DEC-P01-001; ''lieutenant colonel'' -> ''trung tá''; ''colonel'' -> ''đại
    tá''; giữ suy luận phủ định ''người đưa tin hẳn sẽ không có cấp bậc nào cao hơn
    đại tá''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhượng bộ: ''Imperial Army'' -> ''Lục quân
    Đế quốc''; ''Central'' -> ''Trung ương''; giữ sự tương phản giữa tâm trạng vui
    vẻ lúc lên đường và trạng thái ''đứng chết trân tại chỗ'' hiện tại của Tanya."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi điểm nhìn & tình thái nuối tiếc: câu đầu trần thuật
    dùng ''nó'', câu hai độc thoại nội tâm dùng ''mình'' theo DEC-P01-001; ''headquarters''
    -> ''sở chỉ huy''; giữ sắc thái tự trách ''Lẽ ra mình phải nhận ra ngay từ lúc
    đó mới phải.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Danh xưng quân hàm trong thoại: ''Colonel von Degurechaff'' ->
    ''Trung tá von Degurechaff'' (gọi tắt trong tiếng Anh đối với cấp bậc Lieutenant
    Colonel của Tanya)."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, chức danh & cấp bậc: quy chiếu Tanya bằng ''nó'';
    ''eastern army batman'' -> ''người lính cần vụ của đạo quân phía đông''; ''mid-ranking
    officer'' -> ''sĩ quan cấp tá''; ''deputy chief of the Service Corps, Lieutenant
    General von Zettour'' -> ''Cục phó Cục Quân vụ, Trung tướng von Zettour''; giữ
    hai câu phủ định nhận diện."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Hình ảnh trần thuật: giữ ''cô bé Tanya'' cho ''little Tanya''
    và hình ảnh phóng đại ''suýt chút nữa đã khiến trái tim của cô bé Tanya nhảy vọt
    ra khỏi cổ họng''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Nội tâm & giả định trái thực tế trong quá khứ: Tanya tự xưng ''mình'';
    giữ cả hai câu điều kiện giả định quá khứ (''Giá như mình có thể..., biết đâu
    mọi chuyện đã khác'', ''nếu có cách nào biết trước..., có lẽ sự việc đã bớt gây
    kinh hãi hơn'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại, đại từ trần thuật & thuật ngữ: Zettour xưng
    ''ta'' và gọi Tanya là ''cô'', trần thuật quy chiếu Zettour bằng ''Ông''; ''General
    Staff Office'' -> ''Văn phòng Bộ Tổng tham mưu''; ''the east'' -> ''miền đông'';
    ''Supreme Command'' -> ''Bộ Tư lệnh Tối cao''; giữ giọng điệu thản nhiên và nhận
    xét phủ định cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, nội tâm & cấp bậc: chỉ bọc ''*sảy chân*''
    trong dấu sao theo DEC-P01-002; Tanya tự xưng ''mình''; ''Lieutenant General von
    Zettour'' -> ''Trung tướng von Zettour''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & cảm thán nội tâm: câu đầu trần thuật về Tanya, hai
    câu cảm thán sau chuyển sang nội tâm trực tiếp tự xưng ''mình'' (''Lãnh đạo phe
    cánh của mình đã thất thế rồi! Bởi thế nên mình mới không sao ưa nổi chính trị!'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ phủ định ''để không càu nhàu như vậy trước
    mặt người khác'' và câu đối lập ''Nhưng chỉ riêng lòng tự trọng và sự kiên nhẫn
    thôi thì sẽ chẳng giải quyết được vấn đề này.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["So sánh toán học & phủ định: giữ phép so sánh với phép nhân số
    âm/dương và khẳng định phủ định ''kết quả cũng chẳng bao giờ ra số dương được''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, giả định & thuật ngữ: quy chiếu Tanya bằng
    ''nó'' và Zettour bằng ''ông''; ''Being X'' -> ''Being X''; giữ câu giả định quá
    khứ (''Giá như có bất kỳ dấu hiệu nào..., có lẽ nó đã phản ứng khác đi'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Danh xưng đầy đủ & phủ định: ''imperial soldier Lieutenant Colonel
    Tanya von Degurechaff'' -> ''người quân nhân Đế quốc là Trung tá Tanya von Degurechaff'';
    giữ phủ định ''việc bỏ chạy khi cấp trên đang nói không phải là một lựa chọn''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: quy chiếu Tanya bằng ''nó''; giữ
    ''tới mức nó không thể rút lui được nữa''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''The General Staff and Supreme Command have clashed.''
    -> ''Bộ Tổng tham mưu và Bộ Tư lệnh Tối cao đã xung đột với nhau.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự: ''major offensive'' -> ''cuộc tiến công quy
    mô lớn''; ''Operation Andromeda'' -> ''Chiến dịch Andromeda''; ''eastern army''
    -> ''đạo quân phía đông''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ phân chia cánh quân & dấu câu: ''A Group'' -> ''Cụm
    A''; ''B Group'' -> ''Cụm B''; ''armor'' -> ''lực lượng thiết giáp''; giữ dấu
    chấm phẩy và dấu chấm lửng kết đoạn."]'
