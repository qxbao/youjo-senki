choices:
- segment_id: YS-LN08/Text/chapter014.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & điều kiện: quy chiếu Zettour bằng ''ông'',
    Cụm B bằng ''họ''; ''B Group'' -> ''Cụm B''; ''counterattack and firefighting
    emergency units'' -> ''các đơn vị phản kích và ứng cứu khẩn cấp''; giữ mệnh đề
    điều kiện hạn định sau dấu gạch ngang dài (''—đó là nếu người ta đang tiến hành
    chiến tranh theo lẽ thường''); không có chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''Federation Army'' -> ''Quân đội Liên bang'';
    ''matériel'' -> ''vật tư và trang bị quân sự''; ''the Empire'' -> ''Đế quốc'';
    giữ cấu trúc đính chính tăng tiến ''Hay đúng hơn, tất cả những điều đó đều vượt
    quá xa định kiến của Đế quốc''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=["Đối lập & thuật ngữ: giữ phép đối lập giữa ''Tiêu diệt một người
    lính Liên bang là chuyện dễ dàng'' và ''Thế nhưng, tiêu diệt Quân đội Liên bang
    lại là cả một kỳ công''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ & đại từ: quy chiếu Zettour bằng ''ông'', phía
    Đế quốc bằng ''họ''; giữ giả định trái thực tế trong quá khứ kết hợp thực tại
    (''Hẳn ông đã bật cười trước ý nghĩ rằng nếu không thể trụ vững trên sợi dây căng
    thì sẽ chẳng còn chỗ nào để đứng, có điều tình cảnh đó hiện giờ lại đang vận vào
    chính ông'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: giữ đúng phạm vi in nghiêng toàn đoạn ''*…Nhưng
    về cơ bản thì…*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & phủ định kép: giữ nguyên cấu trúc điều kiện và phủ
    định ''Nếu thất bại không phải là một lựa chọn, thì tất cả những gì họ cần làm
    chỉ là không được thất bại''; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & nhượng bộ: giữ chuẩn xác cấu trúc ''nhưng điều
    đó không có nghĩa là họ không thể chiến thắng ngay tại đây và ngay lúc này''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại chỉ huy: Zettour xưng ''tôi'' và gọi các
    sĩ quan tham mưu Cụm B là ''các anh''; giữ sắc thái điềm tĩnh nhưng kiên quyết
    yêu cầu lập kế hoạch giải cứu."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: cấp dưới gọi Zettour là ''Thưa Tướng quân'';
    giữ dấu gạch ngang dài biểu thị câu nói bị ngắt lời."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: dùng ''chúng ta''; giữ câu nhắc nhở cô đọng về
    sự hữu hạn của cả binh lực lẫn thời gian."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=["Đối lập vai trò & đại từ: giữ tương phản ''Với tư cách một nhà
    chiến lược... nhưng với tư cách một nhà chiến thuật...''; quy chiếu Zettour bằng
    ''ông'' và tự quy chiếu gián tiếp bằng ''mình''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''time and timing'' -> ''thời gian và thời
    cơ''; quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000339
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & logic chiến lược: ''Andromeda Operation'' -> ''Chiến
    dịch Andromeda''; ''A Group'' -> ''Cụm A''; ''B Group'' -> ''Cụm B''; giữ đánh
    giá phủ định ''là điều không thể chấp nhận được''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000340
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Zettour gọi các sĩ quan tham mưu Cụm B là ''các
    anh''; giữ hai câu hỏi liên tiếp thúc giục tìm phương án giải cứu tối ưu."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000341
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & nhượng bộ: dùng ''chúng ta''; ''eastern front''
    -> ''mặt trận phía đông''; giữ mệnh đề nhượng bộ ''Dù việc đó có cần thiết đi
    chăng nữa''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000342
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhấn mạnh Markdown: ''B Front'' -> ''Mặt trận B'';
    ''enemy field army'' -> ''đạo quân dã chiến của địch''; giữ đúng phạm vi in nghiêng
    ''*Các anh không hiểu điều đó sao?*'' theo DEC-P01-002; trần thuật dùng ''ông''
    cho Zettour."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000343
  kind: terminology_and_voice
  value: 'choices=["Cặp khái niệm đối lập & tên đơn vị: khóa cặp ''Con tim và lý trí''
    cho ''hearts and the minds'' xuyên suốt các đoạn p000343–p000352; ''B Group''
    -> ''Cụm B''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000344
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ ''Về mặt lý trí'' tương ứng ''In their
    minds''; ''brothers-in-arms'' -> ''những người chiến hữu của mình''; ''B Group''
    -> ''Cụm B''; ''maneuver battle'' -> ''trận đánh cơ động''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000345
  kind: terminology_and_voice
  value: 'choices=["Giả định & thuật ngữ: giữ câu điều kiện giả định ''Nếu đây là
    ở trường đại học quân sự''; ''war college'' -> ''trường đại học quân sự''; ''maneuver
    battle'' -> ''trận đánh cơ động''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000346
  kind: terminology_and_voice
  value: 'choices=["Đối lập khái niệm: giữ nhất quán ''con tim'' và ''lý trí'' (''suy
    nghĩ bằng con tim chứ không phải bằng lý trí'')."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000347
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Zettour bằng ''ông'', tham mưu Cụm
    B bằng ''họ''; giữ tương phản nhượng bộ ''bất kể lý trí họ phản ứng ra sao, điều
    đó cũng chẳng thể lay chuyển được con tim họ''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000348
  kind: terminology_and_voice
  value: 'choices=["Tình thái quá khứ & dấu ngoặc kép: giữ sắc thái tiếc nuối ''Zettour
    vốn muốn trông cậy vào tính tự giác của họ''; giữ ngoặc kép mỉa mai ''“sĩ quan
    tham mưu sáng dạ”''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000349
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ câu trần thuật tả Zettour nuốt tiếng thở dài và chìm
    vào trầm tư trước tấm bản đồ.'']'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000350
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điều kiện đối lập & thuật ngữ: chỉ in nghiêng
    câu đầu ''*Nhử chúng vào đủ sâu rồi giáng đòn trước khi chúng kịp chuyển sang
    thế phòng ngự.*'' theo DEC-P01-002; giữ hai câu điều kiện đối lập về thời cơ (''Nếu
    họ hành động quá sớm... Nếu họ hành động quá muộn...''); ''Lergen Kampfgruppe''
    -> ''Kampfgruppe Lergen''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: in nghiêng toàn đoạn ''*Sự quyết đoán. Đó
    chính là điều mà công việc của một người chỉ huy đòi hỏi.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & ngôi khái quát: in nghiêng toàn đoạn theo
    DEC-P01-002; dịch đại từ khái quát chỉ người chỉ huy bằng ''Người chỉ huy'' /
    ''người đó''; giữ đối lập ''với sự quyết tâm không lay chuyển chứ không phải sự
    do dự''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000353
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: in nghiêng toàn đoạn ''*Tất cả quy về phán
    đoán của một cá nhân duy nhất.*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000354
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định kép & nhân vật: chỉ in nghiêng câu
    đầu ''*Trách nhiệm ấy vừa nặng nề vừa khắc nghiệt, nên nếu không cảm thấy buồn
    nôn thì có lẽ người ta chẳng phải là con người.*'' theo DEC-P01-002; giữ tên riêng
    ''Zettour'', ''Rudersdorf'' và đại từ ''ông'' ở câu trần thuật."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000355
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện & thuật ngữ: quy chiếu Zettour bằng ''ông''
    và tự quy chiếu gián tiếp bằng ''mình''; ''staffers of B Group'' -> ''các sĩ quan
    tham mưu của Cụm B''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000356
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Zettour bằng ''ông''; giữ ẩn dụ nhìn
    vào bản đồ và viết thêm gì lên trên đó."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000357
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: giữ đại từ ''họ'' chỉ phía quân Đế quốc và trạng
    từ đánh giá ''May thay''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000358
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ, thuật ngữ & nhấn mạnh Markdown: ''Imperial Army'' -> ''Lục
    quân Đế quốc''; giữ ẩn dụ gieo hạt – gặt hái; chỉ in nghiêng câu hỏi nội tâm cuối
    đoạn ''*Đã đến mùa thu hoạch chưa nhỉ?*'' theo DEC-P01-002."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000359
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & trần thuật: giữ câu lẩm bẩm ''“Chắc hẳn đã đến lúc
    rồi,”'' và quy chiếu Zettour bằng ''ông''."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000360
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Zettour bằng ''ông''; giữ nguyên sắc
    thái khẳng định về thời cơ hoàn hảo."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000361
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: giữ đại từ ''họ'' và nhịp câu ngắn dứt khoát."]'
- segment_id: YS-LN08/Text/chapter014.xhtml/p000362
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả, tình thái & thuật ngữ: ''Federation Army units''
    -> ''các đơn vị Quân đội Liên bang''; ''Imperial Army'' -> ''Lục quân Đế quốc'';
    giữ tình thái suy đoán ''ắt hẳn đã đoán được rằng''."]'
