choices:
- segment_id: YS-LN08/Text/chapter002.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Zettour bằng ''ông ta'' nối tiếp
    p000029–p000031; giữ cấu trúc phủ định nhấn mạnh ''không thể được miêu tả là gì
    khác ngoài một cơn ác mộng''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: Andrew tự xưng ''tôi'', dùng ''chúng
    tôi'' cho nhóm phóng viên và ''người ta'' cho đại từ khái quát; ''embedded journalist''
    -> ''phóng viên đi theo đơn vị''; ''dig up scoops'' -> ''săn tin độc quyền'';
    ''daily body count'' -> ''con số thương vong hằng ngày''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''We special correspondents'' -> ''Đám
    phóng viên đặc biệt chúng tôi''; giữ dấu chấm lửng và tình thái suy đoán chắc
    chắn ''ắt hẳn chính thời đại ấy đã có gì đó lệch lạc''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''special dispatches'' -> ''những bản tin nhanh
    đặc biệt''; ''comrades and brothers-in-arms from the Federation'' -> ''các đồng
    đội và chiến hữu của chúng tôi từ Liên bang''; ''eastern front'' -> ''mặt trận
    phía đông''; ''“railroad” mages'' -> ''những pháp sư “đường sắt”''; ''home country''
    -> ''quê nhà''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thời gian: giữ mức độ chắc chắn ''Tôi dám chắc'' và
    mốc quá khứ ''hồi đó đã có gì đó bất thường''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ câu chuyển ngắn ''Và đó là lý do tôi muốn
    biết.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ phủ định ''Tôi không tìm kiếm sự phán xét, khiển
    trách hay báo thù.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Khẳng định: giữ câu ngắn ''Tôi chỉ muốn biết sự thật.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & cấp bậc: trong bối cảnh gặp mặt trực tiếp hậu chiến,
    Andrew xưng ''tôi'' và gọi ''General Drake'' là ''Ngài'' / ''Tướng Drake''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tướng Drake (lớn tuổi hơn và là chỗ bạn bè
    lâu năm) xưng ''tôi'' và gọi Andrew là ''cậu''; ''memoir'' -> ''hồi ký''; ''censor''
    -> ''kiểm duyệt''; ''a Commie'' -> ''một tên Cộng sản''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Đại từ & từ vựng: ''chronicle'' -> ''biên niên ký''; quy chiếu
    Drake bằng ''vị quý ông''; giữ sự tương phản với phản ứng ''cộc lốc''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Sắc thái: giữ câu tỉnh lược ''Thờ ơ và dửng dưng.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: trần thuật của Andrew gọi Drake là ''ông ấy'';
    giữ mức độ so sánh ''còn cứng rắn bất khả nhượng bộ hơn cả những gì tôi dự tính''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ quan hệ nhân quả ''Xét thấy đây mới chỉ là rào cản
    đầu tiên, tôi thấy khó mà lạc quan nổi.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi tu từ: giữ hai câu hỏi tu từ nối tiếp của Andrew gợi
    ý cùng ôn chuyện cũ như thú vui quen thuộc của các câu lạc bộ hưu trí.'']'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & từ khóa liên kết: Drake gọi ''Andrew'' và xưng hô ''cậu'';
    dịch ''fascinating'' là ''lý thú'' để khớp với đoạn phân tích mỉa mai ở p000049."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn: giữ hai câu ngắn ''Đấy, lại thế rồi. Tôi lên dây cót
    tinh thần.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & phủ định: bọc chính xác câu ''*Cậu
    là đồ ngốc đấy à?*'' trong dấu sao theo DEC-P01-002; ''the colonials'' -> ''dân
    thuộc địa''; ''someone from back home'' -> ''một người từ chính quốc''; giữ cấu
    trúc phủ định ''chẳng có cách nào hiểu câu đó khác hơn ngoài sự mỉa mai cay độc''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & đại từ: giữ đủ bốn cấu trúc phủ định (''không
    tin là mình đã đánh mất...'', ''không thể phủ nhận...'', ''vẫn chẳng hề thay đổi...'',
    ''không có ý định nói thêm...''); ''John Bull spirit'' -> ''tinh thần John Bull'';
    trần thuật gọi ''Drake'' / ''ông ấy''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn: giữ hai câu ngắn ''Được thôi. Tôi củng cố quyết tâm.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & nghĩa: giữ cặp dấu gạch ngang dài giải thích ''một nhà
    báo tự phong—kẻ chỉ cố gắng làm hết sức mình mà không đào sâu quá mức—với bản
    thân tôi, một người làm nghề thực thụ''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ lời than của Andrew ''Tôi cũng có tuổi rồi. Biết
    bao nhiêu thứ giờ đã trở nên phiền phức.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quan hệ tuổi tác: Drake gọi ''Andrew'', xưng ''tôi''
    - ''cậu'' và khẳng định ''Cậu còn trẻ hơn tôi đấy.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Đại từ & hình ảnh so sánh: gọi Drake là ''ông ấy'' / ''vị tướng
    này''; giữ hình ảnh so sánh tư thế thẳng đuột như thể cơ thể được khâu lót bằng
    vải bạt cứng."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nghĩa: chỉ bọc cụm ''*tuổi sinh học*'' trong
    dấu sao theo DEC-P01-002; giữ nhận định cơ thể từng chịu đựng vùi dập thời trẻ
    cũng suy giảm dần theo năm tháng."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & ẩn dụ: Andrew gọi ''Tướng quân'', xưng ''tôi'' - ''ngài'';
    dịch ''soft underbelly'' là ''góc yếu mềm'' để khớp với lời đáp ở p000060."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Đại từ: giữ câu nội tâm ''Thực tình, tôi ghen tị với nguồn năng
    lượng của ông ấy.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''aerial magic officers'' -> ''các sĩ quan
    ma pháp trên không''; giữ hai khả năng đối lập và suy đoán ''Hẳn Drake thuộc nhóm
    thứ hai.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & dấu câu: giữ liên kết từ vựng ''‘Góc yếu
    mềm’ của tôi ư?''; ''young magic officer in the marines'' -> ''sĩ quan ma pháp
    trẻ bên hải quân đánh bộ''; giữ dấu gạch ngang dài ở cuối câu khi lời thoại của
    Drake bị cắt ngang."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Andrew gọi ''Tướng quân'' (''ngài'' - ''tôi'');
    ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Tình thái & câu hỏi nghi vấn: giữ dấu chấm lửng và câu hỏi tự
    vấn của Andrew ''Có vẻ như ông ấy thực sự phật ý vì bị cắt ngang, nhưng liệu có
    đúng là vậy không?''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn: giữ hai câu nội tâm ngắn của Andrew về cảm giác đạt
    được bước tiến thực sự.'']'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô & dấu câu: giữ dấu chấm lửng đầu câu và hai câu hỏi gặng
    của Drake dành cho Andrew.'']'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu đáp ngắn mang sắc thái lịch sự vừa phải ''“À,
    vâng.”''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: giữ câu hỏi của Drake ''“Cậu muốn tôi nói điều gì đây?”''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thời gian: giữ mục đích hướng tới ''các thế hệ tương
    lai'' và mệnh đề phủ định ở quá khứ ''những điều mà bản thân tôi vào thời điểm
    đó cũng chưa hiểu nổi''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn: giữ câu đơn ngắn song hành ''Tôi đã nhìn thấy nó.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn: giữ câu đơn ngắn song hành ''Tôi đã nghe thấy nó.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Nhịp văn & phủ định: giữ câu đơn đối lập ''Nhưng tôi lại không
    thấu hiểu được nó.''"]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Phủ định & nghĩa: giữ mệnh đề phủ định ''việc chỉ đơn thuần có
    mặt vào thời điểm ấy không mang lại sự thấu hiểu''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: ''chap'' -> ''gã'' trong lời nhận xét thân
    mật kiểu Anh của Drake (''Cậu đúng là một gã dai dẳng gớm đấy'')."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu đáp ngắn ''“Đó là tinh thần báo chí mà.”''."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thời gian: giữ sự liên hệ giữa cử chỉ thanh lịch ở hiện
    tại của Drake với những ngày xưa (''back in those days'')."]'
- segment_id: YS-LN08/Text/chapter002.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Tình thái giả định, phủ định kép & tên riêng: giữ cấu trúc giả
    định mở đầu (''Cứ coi như ngài không cưỡng lại được...''), phủ định kép (''Tôi
    cũng sẽ chẳng từ chối nếu được nghe...''); ''General Habergram'' -> ''Tướng Habergram'';
    ''eastern front'' -> ''mặt trận phía đông''; ''Mr. Johnson'' -> ''ông Johnson''."]'
