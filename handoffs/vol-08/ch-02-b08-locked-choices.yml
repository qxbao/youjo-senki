choices:
- segment_id: YS-LN08/Text/chapter008.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nét lắp bắp: lính cần vụ xưng ''tôi'' và thưa ''thưa
    Tướng quân!'' với Zettour; giữ nguyên nét nói lắp ''X-xin thứ lỗi''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Zettour bằng tên riêng và quy chiếu
    người lính cần vụ trẻ bằng ''cậu ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi đuôi: Zettour xưng ''tôi'' và gọi
    người lính cần vụ là ''cậu''; ''the east'' -> ''mặt trận phía đông''; giữ câu
    hỏi xác nhận ''đúng chứ?'' và sắc thái hóm hỉnh điềm đạm."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: giữ ''Rõ, thưa Tướng quân! Tôi sẽ mang lên
    ngay lập tức.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & câu hỏi tu từ: ''The batman'' -> ''Người
    lính cần vụ''; ''peacetime sensibility'' -> ''lối tư duy thời bình ấy''; giữ tình
    thái suy đoán ''Hẳn cậu ta đã được huấn luyện rất bài bản'' và câu hỏi tu từ ở
    cuối đoạn."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Độc thoại & thuật ngữ: giữ dấu chấm lửng mở đầu lời lẩm bẩm; ''field
    service'' -> ''môi trường dã chiến''; quy chiếu người lính cần vụ bằng ''Cậu ta''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: quy chiếu Zettour bằng ''ông''; giữ tình thái
    dự đoán ''Có lẽ ông cũng sẽ phải lên tiếng'' và bước ngoặt nhận thức ''ông chợt
    giật mình nhận ra một chuyện''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: bọc toàn bộ câu trong
    dấu sao ''*Đây không phải là Văn phòng Bộ Tổng tham mưu.*'' theo DEC-P01-002;
    ''General Staff Office'' -> ''Văn phòng Bộ Tổng tham mưu''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái: giữ hai phủ định (''không phải kiểu chỗ...'',
    ''sẽ chẳng thể nhớ xuể mọi thứ'') và tình thái dự tính (''có lẽ đến lúc nào đó
    ông sẽ phải bắt đầu ghi chép lại'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Nghĩa giới hạn: giữ nhận định ngắn ''Quyền đưa ra yêu cầu suy
    cho cùng cũng chỉ có giới hạn.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tự xưng & thuật ngữ: trần thuật gọi Zettour là ''ông'',
    trong lời lẩm bẩm tự nhủ Zettour tự xưng ''mình''; ''B Group'' -> ''Cụm B''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & quy chiếu: ''Supreme Command'' -> ''Bộ Tư
    lệnh Tối cao''; ''Service Corps'' -> ''Cục Quân vụ''; ''B Group'' -> ''Cụm B'';
    phân biệt rõ ''Zettour'' và ''Rudersdorf'' (''ông ta''); giữ cấu trúc phủ định
    kép (''chắc chắn không phải là...'', ''không tài nào lường trước được rằng...
    lại không thể cáng đáng nổi...'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Độc thoại & đại từ: Zettour tự xưng ''mình'' và gọi Rudersdorf
    là ''lão ta''; giữ sắc thái mỉa mai ''Nhờ phúc đó''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giả định nhượng bộ: ''The higher-ups'' ->
    ''Cấp trên''; ''eastern front'' -> ''mặt trận phía đông''; ''Eastern Army Group''
    -> ''Cụm tập đoàn quân phía Đông''; ''General Staff Office'' -> ''Văn phòng Bộ
    Tổng tham mưu''; giữ mệnh đề nhượng bộ giả định trái thực tế (''Kể cả khi... vốn
    không có sẵn mối bất hòa đi chăng nữa'') và ẩn dụ ''nhảy dù xuống đầu họ mà chẳng
    báo trước tiếng nào''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Tình thái phủ định & thuật ngữ: giữ ''Có lẽ ông sẽ chẳng thể thong
    thả...''; ''HQ'' -> ''sở chỉ huy''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Giọng độc thoại: giữ cách gọi ''Lão ngốc Rudersdorf đó'' và câu
    cảm thán mỉa mai ''Làm như mọi chuyện sẽ đơn giản thế không bằng.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: chỉ bọc câu cảm thán
    nội tâm ''*Thế giới chúng ta đang sống thật khó khăn làm sao.*'' trong dấu sao
    theo DEC-P01-002; giữ cấu trúc đối lập ''Không thể ban hành mệnh lệnh thực sự,
    mà chỉ có thể đưa ra yêu cầu''; ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Phủ định & ẩn dụ: giữ câu phủ định ''Trên thực tế, ông chẳng có
    quân cờ nào trong tay để điều khiển.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Độc thoại chuyển ý: giữ ''“Không, vẫn có một quân cờ…”'' nối mạch
    ẩn dụ với p000018."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ: ''wild card'' -> ''quân bài tẩy''; giữ nhịp hai câu ngắn
    ''Một lá bài duy nhất trong tay ông. Nhưng đó lại là một quân bài tẩy.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''“The Salamanders…”'' -> ''“Đội hình Salamander…”''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc & tình thái: ''Kampfgruppe'' -> ''Kampfgruppe'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''; ''Lieutenant Colonel von Degurechaff''
    -> ''Trung tá von Degurechaff''; ''the east'' -> ''miền đông''; giữ phủ định (''chưa
    từng nằm mơ'', ''hiện không được sử dụng quá tích cực'') và tình thái (''nhưng
    có lẽ điều đó sẽ sớm phải thay đổi'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Độc thoại, giả định quá khứ & phủ định: Zettour tự xưng ''mình'';
    ''Kampfgruppen'' -> ''các Kampfgruppe''; ''the east'' -> ''miền đông''; giữ câu
    hỏi tự vấn nuối tiếc và câu tự bác bỏ (''Không, dù mình có muốn thì chuyện đó
    cũng chẳng thể thực hiện được'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: ''experimental Kampfgruppen'' ->
    ''Kampfgruppe thử nghiệm''; ''homeland'' -> ''bản quốc''; giữ dấu chấm lửng và
    lý giải nguyên nhân (''bởi việc triển khai chúng quá đỗi dễ dàng và tiện lợi'')."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế trong quá khứ: giữ cấu trúc ''Giá như các
    đơn vị đó được giữ lại làm lực lượng dự bị, chúng đã có thể được tập hợp lại và
    đưa sang miền đông...''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & phủ định: giữ ''Đằng này, ông lại phải xoay
    xở với hai bàn tay gần như trắng trơn.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Độc thoại, thuật ngữ & tình thái: Zettour tự xưng ''mình''; ''field
    commander'' -> ''chỉ huy chiến trường''; giữ mệnh đề điều kiện (''nếu đây là điềm
    báo...'') và câu nhận xét ''Tất nhiên, thắng được thì vẫn tốt hơn.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''Operation Andromeda'' -> ''Chiến dịch Andromeda'';
    ''eastern front'' -> ''mặt trận phía đông''; giữ dấu gạch ngang dài và mong muốn
    giảm thiểu thương vong."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc điều kiện & thuật ngữ: giữ hai câu điều kiện song hành
    (''Nếu họ có thể giành chiến thắng...'', ''Nếu Mặt trận B lắng dịu...''); ''the
    east'' -> ''miền đông''; ''B Front'' -> ''Mặt trận B''; ''B Group staffers'' ->
    ''các sĩ quan tham mưu của Cụm B''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi giả định: giữ nguyên câu hỏi độc thoại ''“Nhưng nếu chúng
    ta không thể thắng thì sao?”''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ nguyên nghĩa và hình ảnh ''Mối nghi ngại đầy điềm
    gở buột ra từ đôi môi Zettour khiến sống lưng ông lạnh toát.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm, tình thái & phủ định kép: giữ câu hỏi ngắn ''Nếu
    Andromeda thất bại thì sao?'', tình thái ''Có lẽ ông vẫn có thể thu xếp hậu quả''
    và phủ định kép ''ông không cho rằng mình đã lú lẫn tuổi già đến mức không thể
    xoay xở nổi''."]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Phủ định chuyển ý: giữ câu ngắn ''Nhưng đó không phải là vấn đề
    thực sự.''"]'
- segment_id: YS-LN08/Text/chapter008.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Thời gian, tình thái & chuỗi câu hỏi mở: giữ mốc thời gian ''Ở
    thời điểm hiện tại'', chuỗi hành động dự kiến (''Họ sẽ cải thiện..., rút kinh
    nghiệm... và lên kế hoạch...'') cùng hai câu hỏi giả định liên tiếp ở cuối đoạn."]'
