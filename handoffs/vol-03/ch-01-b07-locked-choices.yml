task_id: vol-03-ch-01-b07
baseline_sha256: c019a775121728e38698cdc1ca22cfd8a63f210c699f2ec365c5616a3fcc3b13
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 7c2dfce65f0cab2d24190eb1f00415ff484b1adfb2c0bd2e9e8716bef5c44321
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148: locks: [''Giữ hai
    câu hỏi nội tâm ở dạng văn bản phẳng không in nghiêng theo DEC-P01-002, các danh
    xưng và thuật ngữ “Tướng von Zettour”, “chiến tranh tiêu hao”, “Tướng von Rudersdorf”,
    “chiến dịch phi chính quy dựa vào mưu mẹo”, “chuyên gia sừng sỏ về chiến tranh
    cơ động” và “Bộ Tổng tham mưu”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000149: locks: [''Giữ câu
    thoại lẩm bẩm đứt quãng của Tanya, thuật ngữ “tổng hành dinh địch”, câu hỏi “dẫn
    tới một trận đánh lớn hơn ư?” và câu tự phủ định “Không, chúng sẽ bị vô hiệu hóa…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000150: locks: [''Giữ đại
    từ trần thuật “nó” quy chiếu Tanya theo DEC-P01-001, các thuật ngữ “tổng hành
    dinh địch”, “Bộ Tổng tham mưu”, “Tướng von Rudersdorf” (quy chiếu bằng “ông”),
    “chiến tranh chiến hào”, “chiến tranh cơ động” và quan hệ nhân quả biến đội quân
    hiện đại thành đám ô hợp để tạo thời cơ thoát khỏi chiến tranh chiến hào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000151: locks: [''Giữ ẩn
    dụ “bộ não của nó, tức tổng hành dinh”, các định danh “Hồng quân”, “tên ngốc Stalin
    đó”, thuật ngữ “hệ thống chỉ huy” và phủ định “chẳng còn gì phải bàn cãi” ở dạng
    văn bản phẳng không in nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000152: locks: [''Giữ câu
    chuyển ý ngắn gọn “Và còn một điều nữa.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000153: locks: [''Giữ đại
    từ độc thoại nội tâm “Mình” theo DEC-P01-001, cách gọi “gã khốn Stalin đó—kẻ dường
    như nghĩ rằng binh lính mọc trên cây—”, tình thái “có lẽ” và các thuật ngữ “quân
    chính quy ngoài tiền tuyến”, “Đế quốc Mỹ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000154: locks: [''Giữ câu
    kết luận thành lời trong ngoặc kép của Tanya, mục đích “bao vây và tiêu diệt chúng”,
    đại từ “chúng ta” và định danh “Lục quân Cộng hòa”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000155: locks: [''Giữ phép
    so sánh nghệ thuật dụng binh của “Bonaparte” như một kẻ lừa đảo tại “Austerlitz”,
    cùng sự tương ứng chiến lược giữa “Vùng đất thấp” và “Cao nguyên Pratzen”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000156: locks: [''Giữ cấu
    trúc phủ định tuyệt đối “Không thể nào làm ngơ trước một miếng mồi ngon lành đến
    thế đang lủng lẳng ngay trước mắt.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000157: locks: [''Giữ dấu
    ba chấm mở đầu và câu hỏi nội tâm “Phải chăng toàn bộ cuộc tái tổ chức các tuyến
    phòng thủ đều được thực hiện với ý đồ nhử mồi kẻ địch?” ở dạng văn bản phẳng không
    in nghiêng theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000158: locks: [''Giữ mệnh
    đề điều kiện “Nếu đúng là vậy…”, cấu trúc phủ định tăng tiến “thì đây sẽ là một
    trận đánh cơ động, nhưng không chỉ là một cuộc đột phá đơn thuần” và câu cảm thán
    “Đó là một cánh cửa xoay!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000159: locks: [''Giữ đại
    từ độc thoại nội tâm “Mình” theo DEC-P01-001, địa danh “Vùng đất thấp”, sự đối
    lập giữa việc chỉ từ bỏ vị trí trọng yếu đó với việc không tiếp tục tái tổ chức
    phần còn lại của phòng tuyến, và câu kết “Giờ thì mọi thứ đều đã hợp lý.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000160: locks: [''Giữ câu
    hỏi trực tiếp của Tanya với Lergen, đại từ “chúng tôi” đại diện đơn vị, hình ảnh
    “công tắc khởi động cánh cửa xoay đó” và tiểu từ lễ phép “ạ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000161: locks: [''Giữ câu
    trần thuật ngắn “Những lời đó đã chạm đúng vào một điều gì đó.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000162: locks: [''Giữ lời
    gọi cấp bậc “Thiếu tá!” và đại từ “Cô” trong câu quát hỏi của Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000163: locks: [''Giữ đại
    từ “ông” quy chiếu Lergen, đại từ “nó” quy chiếu Tanya theo DEC-P01-001, chi tiết
    mỉm cười mãn nguyện và dấu nhấn mạnh chữ nghiêng chỉ ở đúng cụm suy nghĩ cuối
    câu `*À há, ra là thế.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000164: locks: [''Giữ giọng
    thoại lễ phép của Tanya (“tôi”, “ạ”, “ngài”, “mình”) và cấu trúc phủ định giảm
    nhẹ “tôi đoán giả thuyết của mình không lệch xa sự thật cho lắm nhỉ?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000165: locks: [''Giữ đại
    từ “Cô” và định danh “Tướng von Zettour” trong câu hỏi dò đầy hoài nghi của Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000166: locks: [''Giữ lời
    đáp phủ định lễ phép “Không ạ”, đại từ “tôi” và phép so sánh cảm giác kỳ lạ “gần
    giống như bị một cái xương nhỏ mắc ngang cổ họng vậy”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000167: locks: [''Giữ chủ
    thể “Tanya” / “nó” theo DEC-P01-001, các thuật ngữ “tái tổ chức tiền tuyến quy
    mô lớn”, “các tuyến tiếp vận của Đế quốc”, “đảm nhiệm việc đoạn hậu” và câu phủ
    định bào chữa ở cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000168: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001 và quan hệ nhân quả giữa sự nhẹ nhõm khi rút
    lui đúng kế hoạch với việc mất một lúc mới nhận ra thực chất sự việc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000169: locks: [''Giữ các
    định danh “Lục quân Cộng hòa”, “bộ phận trinh sát”, “quân Cộng hòa”, “Đế quốc”,
    đại từ trần thuật “nó” theo DEC-P01-001 và sự đối lập giữa khí thế hừng hực với
    tốc độ di chuyển chậm chạp của địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000170: locks: [''Giữ đại
    từ trần thuật “nó” và tự quy chiếu “mình” theo DEC-P01-001, cùng quan hệ nhượng
    bộ giữa sự chắc chắn đang bỏ sót điều gì đó với việc không thể diễn tả thành lời
    nguyên nhân cảm giác kỳ lạ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000171: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, sự chuyển dịch từ thắc mắc trước kia sang
    nhận thức rõ ràng ở hiện tại và hình ảnh “xoay cánh cửa xoay đó một vòng”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000172: locks: [''Giữ đại
    từ độc thoại “mình” và “chúng ta” theo DEC-P01-001, lý do bảo mật tuyệt đối và
    chuẩn bị công phu cho một “lần xuất kích”, cùng phép so sánh “như thể chúng ta
    là màn pháo hoa trong buổi lễ công bố cánh cửa xoay vậy”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000173: locks: [''Giữ định
    danh “Thiếu tá von Degurechaff”, đại từ “cô” và cơ quan “Bộ Tổng tham mưu” trong
    lời nhắn nhủ của Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000174: locks: [''Giữ câu
    đáp chuẩn điều lệnh “Rõ, thưa Đại tá. Tôi hiểu rất rõ ạ.” của Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000175: locks: [''Giữ đại
    từ độc thoại “Chúng ta” và “Mình” theo DEC-P01-001, các thuật ngữ “đội tiên phong”,
    “chiến dịch cơ động quy mô lớn”, “Bộ Tổng tham mưu”, “tái tổ chức các tuyến phòng
    thủ”, giả định đường lùi nếu thất bại và nhận định kết đoạn “buộc phải thành công
    bằng mọi giá”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000176: locks: [''Giữ đại
    từ thoại “tôi” / “chúng tôi”, định danh “đại đội tinh nhuệ thuộc Tiểu đoàn Pháp
    sư Trên không số 203”, “Bộ Tổng tham mưu”, dấu nhấn mạnh chữ nghiêng chỉ ở đúng
    cụm `*nhất định sẽ*` theo DEC-P01-002, đại từ trần thuật “nó” theo DEC-P01-001
    ở câu giữa đoạn, và lời thề tiêu diệt địch cùng lời thỉnh cầu chờ tin thắng trận
    ở cuối đoạn.'']'
  non_canon: true
