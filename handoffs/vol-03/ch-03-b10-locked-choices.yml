task_id: vol-03-ch-03-b10
baseline_sha256: 8e7d874fefc9f90cb3ab783448ecf040efb0378de788d61c56d28ff74111a431
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 1f1a4b58079277e2cc5d9d8335c9f243091df772769b696e87ef078263fcf456
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Trung úy Weiss`, đại từ `anh` và lời hối thúc
    của Tanya bảo Weiss có điều gì muốn nói thì mau nói ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000143: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách xưng hô `Thưa Thiếu tá / Thiếu tá`, đại từ `Tôi`, thuật
    ngữ `chính quốc` và hai nỗi lo ngại của Weiss: việc này đi ngược lại mong muốn
    của chính quốc quá nhiều và là nước đi cực kỳ nguy hiểm đối với chính Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000144: locks: [''Giữ sự
    tương phản giữa kỳ vọng của `Tanya` về một khoản thu hoạch lớn với thái độ vẫn
    còn dè dặt của `các sĩ quan chủ chốt trong tiểu đoàn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000145: locks: [''Giữ chính
    xác phạm vi chữ nghiêng `*Ôi trời ạ*` theo DEC-P01-002, đại từ trần thuật `nó`
    theo DEC-P01-001 và cấu trúc phủ định kép `sự dè dặt của họ không phải là không
    có cơ sở`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000146: locks: [''Giữ câu
    chuyển ý khẳng định tất cả những gì họ cần làm là mang về kết quả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000147: locks: [''Giữ sự
    chuyển đổi điểm nhìn từ trần thuật ngôi ba (`viên phó chỉ huy thiếu nhiệt tình
    của nó`, `họ`, `anh ta`, `Weiss`) sang độc thoại nội tâm ngôi một (`Mình`, `chúng
    ta`) theo DEC-P01-001, cùng thuật ngữ `quyền tự quyết`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000148: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Trung úy`, cặp đại từ `tôi – anh` và lời khẳng
    định cảm kích ghi nhận lời cảnh báo nhưng không có ý định thay đổi mệnh lệnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000149: locks: [''Giữ đại
    từ `Anh ta` quy chiếu Weiss, đại từ nội tâm `mình` theo DEC-P01-001, niềm tin
    rằng một người lính sẽ không chểnh mảng chỉ vì miễn cưỡng và lời khen ngợi sự
    nhiệt huyết với công việc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000150: locks: [''Giữ đại
    từ nội tâm `mình`, cụm `nhân viên thời vụ chống đối chỉ thị một cách thụ động`
    và nỗi bực bội khi phải trả lương cho những kẻ làm xấu mặt công ty.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000151: locks: [''Giữ sự
    đối lập giữa binh lính đáng tin cậy với nhân viên thời vụ, lý do sinh tử nếu chểnh
    mảng và tính chất công việc không dễ dàng đến mức cho phép người ta lơ là.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000152: locks: [''Giữ dấu
    ngoặc kép hội thoại, lời đáp `Không ạ…`, danh xưng `Thiếu tá`, `Chỉ huy căn cứ`,
    đại từ `ông ấy` và định danh `Bộ Tổng tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000153: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu hỏi lặp lại `Với Bộ Tổng tham mưu ư?`, ngôi `tôi`, đại
    từ `ông ta` quy chiếu chỉ huy căn cứ và điều kiện `Miễn là tôi không vượt quá
    thẩm quyền`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000154: locks: [''Giữ các
    định danh `hệ thống chỉ huy`, `Xưởng Vũ khí Kỹ thuật`, đại từ nội tâm `mình`,
    và bảo toàn chính xác phạm vi chữ nghiêng `*Hãy nắm vững luật lệ, hãy nắm vững
    các quy định. Khi ấy anh sẽ có thể tìm ra cách biện minh cho bất kỳ phương án
    hành động nào*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000155: locks: [''Giữ cấu
    trúc đối lập qua dấu gạch ngang dài: quy tắc không phải sinh ra để bị phá vỡ mà
    để bị khai thác và lách qua.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000156: locks: [''Giữ cụm
    `vị chỉ huy tại thực địa`, đại từ nội tâm `mình` và khẳng định việc bác bỏ đề
    xuất đó không hề giới hạn những chiến dịch mà Tanya có thể thực hiện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000157: locks: [''Giữ ngôi
    `chúng ta`, các định danh `Bộ Tổng tham mưu`, `Quân cảng Brest` và nhận định nếu
    theo quy trình thông thường thì dù là đơn vị báo cáo trực tiếp lên Bộ Tổng tham
    mưu cũng khó được phép tấn công Quân cảng Brest.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000158: locks: [''Giữ ngôi
    `chúng ta – mình`, thuật ngữ `quyền tự quyết`, `chỉ huy căn cứ`, `Bộ Tổng tham
    mưu` và lập luận mở rộng cách diễn giải quyền tự quyết trong chiến dịch chế áp
    kẻ địch để Bộ Tổng tham mưu không công khai khiển trách.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000159: locks: [''Giữ sự
    nhượng bộ rằng lời cảnh cáo nghiêm khắc ngầm bên dưới không thể xem nhẹ nhưng
    tới lúc đó thì sự đã rồi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000160: locks: [''Giữ đại
    từ nội tâm `mình` và niềm vui khi bảo đảm được quyền tự do hành động vào thời
    khắc một mất một còn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000161: locks: [''Giữ đại
    từ nội tâm `mình` và hình ảnh ẩn dụ `xóa sổ mầm bệnh ngay trước mắt` để có thể
    nghĩ về tương lai.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000162: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, tiểu từ `ạ` và định danh `Bộ Tư
    lệnh Cụm tập đoàn quân`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000163: locks: [''Giữ định
    danh `Bộ Tư lệnh Cụm tập đoàn quân`, `người lính điện đài`, đại từ nội tâm `mình`
    và lời tự trách vì đã vô tình quắc mắt nhìn người đưa tin.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000164: locks: [''Giữ tên
    `Tanya` và trình tự hành động: sau một lời xin lỗi, nhận lấy bức thông điệp rồi
    đọc lướt qua.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000165: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, chính xác phạm vi chữ nghiêng `*Hạ hỏa đi*`
    theo DEC-P01-002, định danh `Bộ Tư lệnh Cụm tập đoàn quân` và chi tiết đơn vị
    mang danh nghĩa độc lập.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000166: locks: [''Giữ nhận
    định từ vị thế của một người phải tuân thủ bất cứ khi nào có thể thì việc này
    mang lại cảm giác như một sự can thiệp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000167: locks: [''Giữ tên
    `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001 và sự đối lập giữa việc thông
    thường sẽ nhượng bộ trước lập trường cứng rắn đó với hoàn cảnh hiện tại đơn giản
    là không thể.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000168: locks: [''Giữ chính
    xác hai phần chữ nghiêng `*hiểu và tôn trọng*` cùng `*Tự bản thân câu đó thì mình
    đâu có nói dối.*` theo DEC-P01-002, sự phân tách ngôi `tôi` (thoại) – `nó` (trần
    thuật) – `mình` (nội tâm/phản thân) theo DEC-P01-001, và chi tiết cẩn trọng lựa
    chọn, săm soi lại từ ngữ để không có vấn đề gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000169: locks: [''Giữ toàn
    bộ câu độc thoại nội tâm in nghiêng `*Phải, tất cả những gì mình cần làm là hiểu
    và tôn trọng yêu cầu đó rồi cứ thế mà hành động thôi.*` theo DEC-P01-002 và đại
    từ `mình` theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000170: locks: [''Giữ các
    định danh `Bộ Tư lệnh Cụm tập đoàn quân`, `những quả V-1`, `Brest`, ngôi `chúng
    ta` và tính toán rằng khi ai đó nhận ra thì những quả V-1 hẳn đã đánh trúng Brest
    nên không thể ngăn cản được nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000171: locks: [''Giữ chính
    xác phạm vi chữ nghiêng `*Nhưng*` ở đầu đoạn theo DEC-P01-002, tên `Tanya`, sự
    pha trộn điểm nhìn giữa `Mình` và `nó` theo sát cấu trúc bản gốc cùng nhận định
    có bộ phận nào đó đang để mắt tới Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000172: locks: [''Giữ ý chỉ
    mất thêm một chút thời gian nữa thôi nhưng không thể biết trước chuyện gì sẽ xảy
    ra trong khoảng thời gian ngắn ngủi đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000173: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `chúng ta`, thuật ngữ `lịch phóng` và chỉ thị đẩy lịch
    phóng lên sớm hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000174: locks: [''Giữ định
    danh đầy đủ `Thiếu tá Tanya von Degurechaff`, thuật ngữ `quyết định điều hành`
    và ý phải khẩn trương lên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000175: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, cụm `đẩy lịch phóng lên sớm hơn` và quyết
    định ưu tiên hành động nhanh hết mức con người có thể làm được hơn là bảo đảm
    những điều kiện hoàn hảo.'']'
  non_canon: true
