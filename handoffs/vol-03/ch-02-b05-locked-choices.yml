task_id: vol-03-ch-02-b05
baseline_sha256: 29eef6b8de9fba1162553d4e9aff465b5525a943d30d02198e3b3ae58136898f
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: bc9269fde956b8c5862d2be2174c3c14d3c78d542f7fd357fc424e59ca0e1331
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “chúng ta” và câu bông đùa châm biếm rằng nếu họ
    tấn công thì chỉ cần gọi một viên cảnh sát tới bắt giữ vì tình nghi vi phạm luật
    nhập cư.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000076: locks: [''Giữ các
    định danh “Công quốc Dacia”, “Khối Thịnh vượng chung”, “Đế quốc” và phép so sánh
    về mặt quân số cùng tính chất đảo quốc khiến cả hai chiều tiếp cận đều khó khăn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000077: locks: [''Giữ điều
    kiện vận chuyển binh lính bằng đường biển, giả định nhượng bộ về việc vượt chặng
    đường dài trên mặt nước và nhận định quy mô “quân thường trực của Khối Thịnh vượng
    chung” không đủ lớn để thành mối đe dọa nghiêm trọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000078: locks: [''Giữ các
    định danh “Khối Thịnh vượng chung”, “mặt trận Rhine”, thuật ngữ “cấp độ chiến
    thuật”, ước tính hào phóng tối đa “mười sư đoàn” và sự tương phản với hơn một
    trăm sư đoàn đang giao chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000079: locks: [''Giữ cấu
    trúc tăng tiến phủ định giữa “cấp độ chiến dịch” và “cấp độ chiến lược”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000080: locks: [''Giữ dấu
    ngoặc kép hội thoại, sự thừa nhận đối với “lực lượng lục quân”, khoảng cách sức
    mạnh không thể bàn cãi giữa hải quân hai bên và mối lo ngại nếu bị áp đặt lệnh
    phong tỏa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000081: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “tôi – ông”, tên gọi “Zettour”, thuật ngữ “cà phê
    thay thế” và mong muốn sớm kết thúc cuộc chiến thay vì kéo dài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000082: locks: [''Giữ các
    định danh “Khối Thịnh vượng chung”, “Hải quân Hoàng gia”, “Hải quân Đế quốc”,
    “Hải quân Cộng hòa”, “hạm đội bản thổ”, “hạm đội eo biển” và toàn bộ các tầng
    giả định so sánh tương quan lực lượng hải quân.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000083: locks: [''Giữ cụm
    chuyển ý ngắn “Mặt khác…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000084: locks: [''Giữ câu
    nhận định ngắn “Cũng chỉ có vậy.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000085: locks: [''Giữ điều
    kiện thiếu “đòn dứt điểm” thì việc gườm nhau bao lâu tùy thích cũng chỉ dẫn tới
    “một thế bế tắc bất tận”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000086: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu thúc giục ngắn gọn “Hãy giải quyết cho xong chuyện
    này đi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000087: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “tôi – ông”, sự đồng tình muốn kết thúc cuộc chiến
    càng sớm càng tốt và câu hỏi xác nhận “ông muốn tiến hành kế hoạch đó tới cùng
    sao?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000088: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “tôi – ông”, tên gọi “Zettour” và câu hỏi đề nghị
    tìm giải pháp hậu cần để cuộc tiến quân trở nên khả thi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000089: locks: [''Giữ tên
    “Rudersdorf”, các định danh “Lục quân Đế quốc”, “Cộng hòa”, đại từ “ông” và hình
    ảnh ẩn dụ cuộc chạy đua chỉ còn bước lao qua dải băng ở vạch đích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000090: locks: [''Giữ câu
    hỏi gián tiếp về việc liệu họ có thể duy trì thể lực đủ lâu để về tới đích hay
    không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000091: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách gọi “Tướng von Rudersdorf”, ngôi xưng “tôi – ông / chúng
    ta”, các địa danh “phòng tuyến Rhine”, “Parisii” và giới hạn bảo đảm không quá
    “tám quả đạn pháo mỗi ngày”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000092: locks: [''Giữ dấu
    ngoặc kép hội thoại và lời phàn nàn “Thế thì keo kiệt quá mức rồi đấy.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000093: locks: [''Giữ dấu
    ngoặc kép hội thoại, giới hạn “chỉ bao gồm các loại đạn pháo dưới 155 mm”, điều
    kiện duy trì ngắn hạn ở mức tối ưu và cảnh báo “Các tuyến tiếp tế của chúng ta
    đang tiến gần tới giới hạn rồi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000094: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu hỏi bất bình “Không có pháo hạng nặng và chỉ có tám quả
    đạn cho mỗi khẩu pháo thôi ư?” và câu cảm thán “Ông đùa tôi đấy chắc.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000095: locks: [''Giữ tên
    “Zettour”, “Rudersdorf”, đại từ “ông”, “hai người” và chi tiết các sĩ quan tham
    mưu quanh đó kinh ngạc ngoái nhìn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000096: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Không đời nào có thể đánh đấm gì được với cơ
    số đạn pháo như thế.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000097: locks: [''Giữ câu
    trần thuật ngắn “Những lời ấy đã trực trào nơi đầu lưỡi của ông.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000098: locks: [''Giữ dấu
    ngoặc kép hội thoại, điều kiện không dùng được đường sắt của địch nên phải trông
    cậy vào ngựa kéo và xe tải, cùng chi tiết đã trưng dụng mọi thứ có thể từ “các
    cụm tập đoàn quân khu vực và hai vùng lãnh thổ chiếm đóng”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000099: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “bộ phận Hậu cần”, thuật ngữ “trận đấu pháo” và
    mệnh đề điều kiện bỏ lửng về mức tối thiểu “bốn mươi bốn quả đạn cho mỗi khẩu
    pháo mỗi ngày…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000100: locks: [''Giữ dấu
    ngoặc kép hội thoại, các thuật ngữ “công binh dã chiến”, “đường sắt khổ hẹp”,
    “vùng đất giữa hai chiến tuyến” và thực trạng thiếu ngựa, cạn cỏ khô dự trữ, trái
    mùa thu mua tại chỗ khiến chỉ riêng việc tải tám quả đạn pháo cùng lương thực
    ra tiền tuyến cũng đủ làm ngựa kiệt sức gục ngã.'']'
  non_canon: true
