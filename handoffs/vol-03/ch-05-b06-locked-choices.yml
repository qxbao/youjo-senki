choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002: locks: [''Giữ dòng
    tiêu đề thời gian và địa điểm viết in hoa toàn bộ: `NGÀY 24 THÁNG 8, NĂM THỐNG
    NHẤT 1925, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, PHÒNG ĂN SỐ 1`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000003: locks: [''Giữ các
    định danh `Nhà ăn tại Văn phòng Bộ Tổng tham mưu`, `Đế quốc`, `Phòng ăn số 1`,
    quy định so sánh `chất lượng ngang bằng hoặc kém hơn khẩu phần của những người
    lính được huy động ngoài chiến trường` và sắc thái châm biếm `tin đồn đầy cảm
    động ấy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000004: locks: [''Giữ thuật
    ngữ `cà phê giả` và hình ảnh châm biếm `đành nuốt trôi những lời phàn nàn về chất
    lượng của nó bằng thứ nước lã nhạt thếch hoặc chính thứ cà phê giả kia`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000005: locks: [''Giữ đại
    từ `Tôi` – `ông` và cấp hàm mới được thăng trong lời chúc mừng của Rudersdorf:
    `“Tôi cho rằng đây là phần thưởng cho chiến thắng. Cả ông và tôi đều đã được thăng
    quân hàm. Xin chúc mừng, Trung tướng von Zettour.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000006: locks: [''Giữ lời
    đáp của Zettour với đại từ `ông` – `chúng ta` và danh xưng `Trung tướng von Rudersdorf`:
    `“Cảm ơn ông, Trung tướng von Rudersdorf. Giờ thì chúng ta quay lại với công việc
    thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000007: locks: [''Giữ câu
    đồng tình phủ định của Rudersdorf: `“Đúng thế. Dù sao thì đây cũng chẳng phải
    nơi để ăn mừng.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000008: locks: [''Giữ thuật
    ngữ `cà phê thay thế`, cấp hàm viết thường `trung tướng`, cấu trúc phủ định `Rudersdorf
    cũng chẳng cảm thấy bầu không khí ở đây phù hợp để ăn mừng` và câu kết `Nhà ăn
    của Văn phòng Bộ Tổng tham mưu tóm gọn lại chính là một nơi như vậy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000009: locks: [''Giữ câu
    thoại ngắn chuyển mạch: `“Vậy thì được rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000010: locks: [''Giữ quy
    chiếu `họ` / `hai người` và cụm đồng vị `vấn đề tồn đọng trước mắt họ, tức giai
    đoạn tiếp theo trong các chiến dịch của hai người`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000011: locks: [''Giữ đầy
    đủ các định danh `Lục quân Cộng hòa`, `chính quốc`, `Quân đội Cộng hòa Tự do`,
    `các thuộc địa của Cộng hòa`, `Khối Thịnh vượng chung`, `Hạm đội Biển khơi Đế
    quốc` và nhận định về khoảng cách thực lực hải quân giữa đôi bên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000012: locks: [''Giữ mệnh
    đề giả định so sánh quy mô hạm đội giữa `Đế quốc` và `Khối Thịnh vượng chung`:
    `Ngay cả khi Đế quốc tung toàn bộ hạm đội của mình ra, quy mô cũng chỉ bằng một
    nửa so với hạm đội của Khối Thịnh vượng chung.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000013: locks: [''Giữ sự
    tương phản giữa sự hào hứng của công chúng cùng một bộ phận `Bộ Tư lệnh Tối cao`
    về việc xâm lược `chính quốc Khối Thịnh vượng chung` với thế bí của `Zettour và
    Rudersdorf` trước giới hạn sức chiến đấu thực tế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000014: locks: [''Giữ đại
    từ `tôi`, địa danh `Biển Nội địa` và hai mục tiêu của chiến dịch phía nam: `phong
    tỏa Biển Nội địa và đánh bại những lực lượng cuối cùng của Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000015: locks: [''Giữ quan
    hệ nguyên nhân–kết quả và định danh `Lục quân Cộng hòa`: `Vì lý do đó, như một
    phần trong kế hoạch xử lý cục diện chiến tranh, trước tiên họ cân nhắc một chiến
    dịch ở phía nam nhằm vào tàn quân của Lục quân Cộng hòa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000016: locks: [''Giữ các
    danh xưng `Đế quốc`, `Lục quân Cộng hòa` và giả định chiến lược: `Họ sẽ chứng
    minh rằng Đế quốc có đủ khả năng phái quân tới các thuộc địa. Một thực tế như
    vậy chí ít cũng có thể thúc đẩy Lục quân Cộng hòa và các thuộc địa giảng hòa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000017: locks: [''Giữ định
    danh `Bộ Tổng tham mưu Lục quân Đế quốc`, mệnh đề phủ định `những người không
    còn tìm thấy bất kỳ ý nghĩa nào trong cuộc chiến này nữa` và câu giả định về việc
    giải quyết thông qua đàm phán mà không cần chiếm đóng đến tận quốc gia thù địch
    cuối cùng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000018: locks: [''Giữ đại
    từ `tôi` – `ông` – `chúng ta`, thuật ngữ `năng lực triển khai sức mạnh đi xa`
    và địa danh `Biển Nội địa` trong lời lưu ý của Zettour.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000019: locks: [''Giữ lời
    đáp xác nhận của Rudersdorf với đại từ `Ông` – `tôi`: `“Ông nói hoàn toàn đúng,
    Zettour. Đó chính là lý do tôi hỏi ý kiến ông.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000020: locks: [''Giữ cấu
    trúc phủ định kép `cả thực lực của hạm đội lẫn năng lực triển khai sức mạnh đi
    xa của Đế quốc đều không cho phép tính đến chuyện tiến hành một cuộc xâm lược
    hải ngoại dù chỉ ở quy mô hạn chế` và giải thích học thuyết của `Lục quân Đế quốc`
    vốn được thiết lập cho `các chiến dịch tác chiến theo tuyến nội địa trong nước`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000021: locks: [''Giữ giới
    hạn quy mô và mục đích chính trị ở `mặt trận phía nam` cùng câu hỏi kết đoạn của
    Zettour: `“Trong hoàn cảnh này, điều tối đa chúng ta có thể làm ở mặt trận phía
    nam sẽ chỉ là tác chiến ở quy mô hạn chế vì các mục đích chủ yếu mang tính chính
    trị. Như vậy có ổn không?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000022: locks: [''Giữ hai
    mệnh đề phủ định liên tiếp của Zettour về `mặt trận phía nam` và khả năng `nắm
    được quyền kiểm soát Biển Nội địa và cắt đứt các tuyến vận tải` xét từ góc độ
    thuần túy quân sự.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000023: locks: [''Giữ định
    danh `Vương quốc Ildoa`, đại từ `chúng ta` – `Tôi` – `ông` và cấu trúc phủ định
    kép `tôi sẽ không bác bỏ một ý tưởng chỉ vì bản chất của nó không thuần túy mang
    tính quân sự`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000024: locks: [''Giữ quy
    chiếu trần thuật `ông` cho Rudersdorf và nhận định `sẵn sàng chấp nhận chính trị
    như một yếu tố giới hạn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000025: locks: [''Giữ phép
    so sánh nhượng bộ với `chiến dịch Vừng ơi mở ra trên mặt trận Rhine` và quan điểm
    thực dụng của `Rudersdorf và Zettour`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000026: locks: [''Giữ các
    quốc danh `Vương quốc Ildoa`, `Cộng hòa`, `Khối Thịnh vượng chung`, cụm `trung
    lập đầy thiện cảm`, tác động `đe dọa các tuyến huyết mạch của họ. Đặc biệt là
    tại các thuộc địa` và dấu chấm lửng bỏ lửng ở cuối câu thoại `Đó thực sự là điều
    chúng ta đang cần, nhưng…`.'']'
  non_canon: true
