choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002: locks: [''Giữ tiêu
    đề mốc thời gian và địa điểm viết hoa toàn bộ: `NGÀY 22 THÁNG 9, NĂM THỐNG NHẤT
    1925, LỤC ĐỊA PHÍA NAM`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000003: locks: [''Giữ lời
    thoại vô tuyến mở đầu với đại từ `Chúng tôi` – `cô`, danh xưng `Thiếu tá von Degurechaff`
    và câu hỏi phối hợp về phần việc của đơn vị Tanya sau khi đơn vị bạn tiêu diệt
    toàn bộ pháo binh địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000004: locks: [''Giữ thán
    từ và mệnh lệnh khẩn cấp khi mất tín hiệu: `“Hả? Nối lại liên lạc cho tôi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000005: locks: [''Giữ các
    mệnh lệnh và báo cáo: `sở chỉ huy`, `gây nhiễu tín hiệu`, mã số `1105` và yêu
    cầu `chuyển sang đường truyền vòng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000006: locks: [''Giữ thuật
    ngữ `Sở chỉ huy dã chiến lâm thời` và trạng thái náo loạn vì sự cố gián đoạn tín
    hiệu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000007: locks: [''Giữ cụm
    `Trên mặt trận phía nam nơi giao tranh leo thang nhanh chóng` và nhận định `ai
    nấy đều đã mất bình tĩnh`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000008: locks: [''Giữ dấu
    ba chấm mở đầu `…Chà`, phép liên hệ `ở mặt trận Rhine`, nhận định giả định `Giữ
    được vẻ điềm tĩnh trên chiến trường mới là chuyện lạ.` và quy chiếu `Tanya` –
    `nó` với những tháng ngày nơi vùng đất phương nam chẳng khác gì những ngày ở phía
    tây.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000009: locks: [''Giữ đại
    từ `Nó` và quy trình xử lý: thử nối máy tới `sở chỉ huy` qua `đường dây hữu tuyến`
    khi `mạng vô tuyến` không thể kết nối.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000010: locks: [''Giữ đại
    từ `Nó`, hai loại hình `chiến tranh chiến hào lẫn tác chiến cơ động cao`, việc
    rà soát theo danh mục các bước cần thực hiện và chi tiết `Các nhân viên điện đài
    tức tốc mở một đường dây hữu tuyến nối tới sở chỉ huy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000011: locks: [''Giữ câu
    nhận xét ngắn gọn: `Hiệu suất làm việc của họ rất đáng khen ngợi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000012: locks: [''Giữ thuật
    ngữ `chuỗi chỉ huy` và thái độ ứng phó không chút do dự bất chấp sự gián đoạn
    chớp nhoáng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000013: locks: [''Giữ bước
    ngoặt `Nhưng sau một cuộc trao đổi ngắn, mặt mày họ tái mét.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000014: locks: [''Giữ hai
    câu phủ định liên tiếp (`Không phải bị gây nhiễu đâu ạ! Không có chút tạp âm nào
    cả!`), thông tin kết nối rõ ràng với các đơn vị trong khu vực và kết luận nguyên
    nhân là sự cố máy móc bên phía `Tiểu đoàn 44`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000015: locks: [''Giữ chính
    xác câu cảm thán in nghiêng toàn đoạn theo DEC-P01-002: `*A, chết tiệt thật.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000016: locks: [''Giữ đại
    từ `Nó`, cụm `các phòng tuyến Rhine` và hình ảnh `trải qua lửa đạn rửa tội trên
    mặt trận ấy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000017: locks: [''Giữ chuỗi
    mệnh lệnh khẩn trương của Tanya: tiếp tục gọi bằng `Sóng ngắn` và kiểm tra lại
    thiết bị thêm một lần nữa để phòng hờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000018: locks: [''Giữ đại
    từ `Nó` và sự đối lập giữa mong muốn gửi gắm hy vọng vào khả năng mong manh với
    việc thực tâm không trông đợi gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000019: locks: [''Giữ lập
    luận so sánh giữa việc làm một kẻ bi quan lường trước tình huống tồi tệ nhất với
    việc nuôi hy vọng, cùng ẩn dụ `phụ thuộc vào thứ thuốc giảm đau morphine đó trong
    chiến đấu thì cầm chắc sự hủy diệt`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000020: locks: [''Giữ câu
    hỏi mở đầu `Chắc có thể nói là mọi sự đang diễn ra đúng như dự tính nhỉ?`, kết
    quả kiểm tra máy móc tại chỗ đều vận hành ổn định và suy luận khẳng định của các
    nhân viên điện đài rằng `Tiểu đoàn Pháp sư 44` đang gặp sự cố máy móc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000021: locks: [''Giữ câu
    điều kiện ngắn: `Nếu đúng là vậy thì gay go rồi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000022: locks: [''Giữ các
    định danh `trận tác chiến cơ động cao trên Sa mạc Barbad`, `sở chỉ huy của Kampfgruppe
    Bảy`, `đội tiên phong ở cánh trái` và mức độ nghiêm trọng `hậu quả sẽ không chỉ
    dừng lại ở sự hỗn loạn trong chuỗi chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000023: locks: [''Giữ chính
    xác câu hỏi in nghiêng đầu đoạn `*Chuyện gì đang xảy ra thế này?*` theo DEC-P01-002
    (phần trần thuật sau không in nghiêng) và sự tự chủ của các sĩ quan không để lộ
    vẻ bực bội ra mặt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000024: locks: [''Giữ nhận
    định `Một nguyên lý hiển nhiên là nếu các sĩ quan dao động không cần thiết trước
    mặt binh lính dưới quyền, sự hỗn loạn sẽ gia tăng nhanh chóng.` và định danh `Thiếu
    úy Grantz`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000025: locks: [''Giữ lời
    báo cáo nối thông liên lạc: `“Chúng tôi đã thiết lập được liên lạc! Trên tần số
    sóng ngắn!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000026: locks: [''Giữ câu
    báo cáo xác thực: `“Mật mã xác nhận trùng khớp!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000027: locks: [''Giữ hình
    ảnh bầu không khí nhẹ nhõm thoáng lan tỏa khắp `sở chỉ huy dã chiến lâm thời`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000028: locks: [''Giữ sự
    phân tách phạm vi chữ nghiêng theo DEC-P01-002 (chỉ in nghiêng câu hỏi nội tâm
    thứ hai), đại từ tự quy chiếu `Mình` theo DEC-P01-001 và cấu trúc phủ định kép
    `không thể không suy nghĩ theo chiều hướng tích cực nhỉ?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000029: locks: [''Giữ nhận
    định về người có `tư duy logic và đầu óc kinh tế` cũng chẳng dễ hình thành thói
    quen luôn lường trước tình huống tồi tệ nhất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000030: locks: [''Giữ cụm
    `những thương vụ tài chính vốn chẳng phải chuyện sinh tử`, thuật ngữ `kinh tế
    học hành vi`, `các bong bóng kinh tế và khủng hoảng` và chính xác phạm vi chữ
    nghiêng ở mệnh đề độc thoại nội tâm trước dấu phẩy câu cuối theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000031: locks: [''Giữ nguyên
    thông báo tử trận: `“Thiếu tá von Leinburg đã tử trận!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000032: locks: [''Giữ sự
    đối lập `Đó là tin tức tồi tệ nhất, nhưng chưa hẳn đã trở thành một thảm họa`
    và đại từ `nó` thấy nhẹ nhõm theo cách của riêng mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000033: locks: [''Giữ đại
    từ `Nó`, hình ảnh `các cựu binh đều nắm bắt tình hình rất tốt và đang vắt óc tìm
    cách kiểm soát cục diện` và nhận định phủ định ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000034: locks: [''Giữ chính
    xác câu đánh giá in nghiêng toàn đoạn theo DEC-P01-002: `*Không tệ.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000035: locks: [''Giữ nguyên
    nhân Tanya bị chỉ trích và điều tới phương nam (`vì định tự ý hành động và suýt
    chống lệnh`), đại từ `nó`, lợi thế mang theo tiểu đoàn của mình và kết quả giảm
    một nửa thời gian huấn luyện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000036: locks: [''Giữ cấu
    trúc tự bổ sung `Không, nếu giao phó một phần công việc đó cho các thuộc cấp,
    nó lại có thể giảm đi một nửa nữa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000037: locks: [''Giữ con
    số `25 phần trăm gánh nặng thời gian và công sức` và câu kết `Thế mới gọi là hiệu
    quả chứ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000038: locks: [''Giữ ẩn
    dụ bảo dưỡng tổ chức để các bánh răng không bị hoen gỉ, nhận định `Con người chính
    là bộ máy cốt lõi của một tổ chức.` và việc quân đội luôn tính cả số ca tử trận
    vào quá trình hoạch định và duy trì tổ chức.'']'
  non_canon: true
