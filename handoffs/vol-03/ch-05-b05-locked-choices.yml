choices:
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130: locks: [''Giữ danh
    xưng `Hợp chúng quốc`, cụm đồng vị `một bước ngoặt, bước đi quyết định đầu tiên
    của Hợp chúng quốc` và quan hệ hệ quả `và đó cũng là lý do Mary lập tức có phản
    ứng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000131: locks: [''Giữ quy
    chiếu trần thuật `Cô bé`, chi tiết `nộp đơn đăng ký` và câu trả lời trong ngoặc
    kép `“Vẫn còn quá sớm” như mọi khi`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000132: locks: [''Giữ câu
    hỏi lễ phép của Mary với đại từ `ngài` và tiểu từ `ạ`: `“Ý ngài là với tư cách
    một công dân tốt của Hợp chúng quốc sao ạ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000133: locks: [''Giữ đại
    từ `chúng ta` – `cô`, cấu trúc phủ định `Tình hình của chúng ta chưa đến mức nguy
    ngập tới nỗi phải đẩy các em ra chiến trường`, mệnh đề điều kiện `Dù cô có dành
    thêm chút thời gian để suy nghĩ rồi mới đưa ra quyết định thì cũng chẳng muộn
    đâu.` và việc không đóng ngoặc kép ở cuối đoạn do lời thoại còn tiếp tục sang
    `p000134`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000134: locks: [''Giữ câu
    hỏi mở đầu đoạn `“Cô không muốn thử làm một công dân tốt hay sao?” ông hỏi.` cùng
    các thuật ngữ `Hợp chúng quốc`, `song tịch`, `Liên minh Hiệp ước` và điều kiện
    `có người thân ruột thịt đã cư trú sẵn tại đây`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000135: locks: [''Giữ quy
    chiếu `ông` – `cô bé` – `họ` và mệnh đề giải thích nguyên nhân phủ định `Mary
    hiểu rằng lý do họ không muốn đưa lớp trẻ ra chiến trường, như lời ông vừa giải
    thích lại với cô bé, là vì họ hy vọng những người mà mình đã cưu mang sẽ được
    an toàn.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000136: locks: [''Giữ thuật
    ngữ `pháp sư`, quy chiếu `cô bé` và chuỗi nhân quả `Quyền công dân được cấp cùng
    năng lực pháp sư giúp cô bé hội đủ điều kiện. Vì thế, cô bé đã cân nhắc kỹ vị
    thế của mình và đi đến quyết định.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000137: locks: [''Giữ giọng
    đáp lễ phép, kiên định của Mary: `“Cháu biết ạ. Cháu đã suy nghĩ kỹ cả rồi, nhưng
    quả nhiên cháu vẫn muốn đăng ký tình nguyện.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000138: locks: [''Giữ hai
    cấu trúc phủ định liên tiếp cùng các danh xưng `Hợp chúng quốc`, `Liên minh Hiệp
    ước` và chi tiết `người cha và người mẹ cô bé hằng yêu thương, kính trọng từng
    treo trong ngôi nhà của họ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000139: locks: [''Giữ chính
    xác phạm vi chữ nghiêng cho hai câu giả định nội tâm ở nửa sau đoạn theo DEC-P01-002
    với đại từ tự quy chiếu `mình`: `*Nếu bà và mẹ mình, những người thân mà mình
    phải bảo vệ đang ở nơi này… Nếu có điều gì đó mình làm được để góp phần chấm dứt
    cuộc chiến…*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000140: locks: [''Giữ cách
    gọi công vụ `Cô Mary Sue` / `cô` và ba khả năng cảnh báo liên tiếp của vị thiếu
    tá: `“Cô Mary Sue. Nếu ra trận, cô có thể sẽ bị thương. Cô có thể sẽ mất mạng.
    Cô có thể sẽ khiến bà và mẹ của mình phải đau lòng.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000141: locks: [''Giữ cấu
    trúc so sánh giả định trong lời Mary `“…Cháu cũng thấy áy náy về chuyện đó lắm,
    nhưng nếu không làm những gì mình có thể thì cháu sẽ còn hối hận hơn nhiều.”`,
    quy chiếu trần thuật `cô bé` và câu khẳng định cuối đoạn `“Dù có là vậy đi nữa
    thì vẫn có việc mà cháu buộc phải làm ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000142: locks: [''Giữ câu
    hỏi ngắn của vị thiếu tá: `“…Cô chắc chắn chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000143: locks: [''Giữ câu
    đáp xác nhận của Mary: `“Vâng, cháu đã quyết định đăng ký tình nguyện ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000144: locks: [''Giữ hình
    ảnh hồi tưởng `bóng lưng của những người dân đang cầu nguyện tại nhà thờ`, cụm
    `Nỗi đau thương, sự buồn bã và ước nguyện hòa bình…` và mệnh đề điều kiện `nếu
    việc đó có thể tạo nên sự khác biệt`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000145: locks: [''Giữ nhịp
    điệp mục đích và chủ ngữ số nhiều `họ`: `Vì Chúa, vì gia đình và vì chính bản
    thân mình, họ sẽ làm những gì có thể.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000146: locks: [''Giữ đại
    từ `cô` và yêu cầu nghi thức: `“Được rồi. Vậy thì cô cần thực hiện lời tuyên thệ
    trước lá cờ. Cô có nhớ nội dung lời thề không?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000147: locks: [''Giữ câu
    đáp của Mary: `“Vâng, cháu đã học thuộc lòng rồi ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000148: locks: [''Giữ lời
    nhắc nhở về nghĩa vụ quân sự của vị thiếu tá: `“…Có vẻ như cô đã rất quyết tâm
    rồi. Một khi đã đăng ký tình nguyện, cô phải thực hiện bất cứ điều gì mà nghĩa
    vụ quân sự đòi hỏi ở mình… Cô hiểu chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000149: locks: [''Giữ chức
    danh `Vị thiếu tá` và nhận định `nhấn mạnh điểm đó như một lời xác nhận cuối cùng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000150: locks: [''Giữ quan
    hệ nguyên nhân–kết quả và cấu trúc phủ định: `Vì hiểu rằng ông đang hy vọng mình
    sẽ đổi ý, Mary đáp lại thật nhanh để không chừa lại bất kỳ kẽ hở nào cho sự phản
    đối.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000151: locks: [''Giữ sự
    chuyển đổi đại từ từ lời đáp với vị thiếu tá (`“Tất nhiên ạ. Cháu xin tuyên thệ!”`)
    sang công thức tuyên thệ trang trọng trước quốc kỳ `Hợp chúng quốc` (`“Tôi xin
    thề trung thành…”`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000152: locks: [''Giữ thuật
    ngữ `giao ước của một cô gái, Mary Sue, với Hợp chúng quốc` và mệnh đề `Sức mạnh
    phải được vận dụng cùng với công lý, vậy nên cô bé sẽ làm những gì mình có thể.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000153: locks: [''Giữ phần
    tiếp theo của lời tuyên thệ: `“…với Hợp chúng quốc và đồng bào của mình, một quốc
    gia dưới quyền Chúa, không thể chia cắt…”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000154: locks: [''Giữ quy
    chiếu `Cô bé` và mục đích `dốc toàn bộ sức lực vì gia đình mà mình phải bảo vệ,
    vì mọi người. Và để thực thi công lý của Chúa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000155: locks: [''Giữ cụm
    `“…và để bảo vệ nền Cộng hòa của quốc gia…”` để phân biệt rõ thể chế cộng hòa
    của Hợp chúng quốc với quốc gia Cộng hòa ở châu Âu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000156: locks: [''Giữ cấu
    trúc phủ định tương lai và danh xưng `Đế quốc`: `Để kiến tạo một thế giới mà ở
    đó cô bé sẽ không bao giờ còn phải trải qua nỗi đau buồn khi mất đi người thân
    dưới tay Đế quốc nữa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000157: locks: [''Giữ phần
    kết lời tuyên thệ: `“…nhân danh tự do và công lý.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000158: locks: [''Giữ câu
    trần thuật khép lại nghi thức thề: `Cô bé đã thề bằng chính quan niệm về công
    lý mà mình hằng tin tưởng.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000159: locks: [''Giữ lời
    chúc của vị thiếu tá: `“Cầu Chúa che chở cho cô.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000160: locks: [''Giữ toàn
    bộ câu cầu nguyện nội tâm in nghiêng theo DEC-P01-002 với đại từ `Ngài` – `chúng
    con`: `*Lạy Chúa, xin Ngài, cúi xin Ngài hãy che chở cho chúng con.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000161: locks: [''Giữ định
    danh đơn vị `Trung đoàn Pháp sư số 1 Hợp chúng quốc – Liên minh Hiệp ước Tự do`
    và câu kết cảnh: `Như thế, cùng với một lời cầu nguyện thành tâm, Mary Sue đã
    nhập ngũ và được biên chế cùng các pháp sư tình nguyện khác vào Trung đoàn Pháp
    sư số 1 Hợp chúng quốc – Liên minh Hiệp ước Tự do.`.'']'
  non_canon: true
