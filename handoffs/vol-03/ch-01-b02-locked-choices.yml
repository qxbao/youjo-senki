choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000030
  kind: locked_constraint
  value: Giữ sự phân biệt giữa ba chủ thể “con gái bà”, “Mary” và “bà lão”, hành động
    nghe các bản tin về cuộc chiến một cách ám ảnh cùng chi tiết đáp lại cả lời động
    viên lẫn sự an ủi bằng cùng một nụ cười trống rỗng.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000031
  kind: locked_constraint
  value: Giữ chủ thể “bà lão” và hành động vừa dọn dẹp đồ dùng trong bếp vừa thầm
    nghĩ.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000032
  kind: locked_constraint
  value: Giữ định danh “Đế quốc”, tình thái nghe đồn “Hình như theo những gì bà nghe
    được trên bản tin, Đế quốc đang rút lui”, phủ định “Bà không nắm rõ lắm chuyện
    gì đang diễn ra” và dấu nhấn mạnh chữ nghiêng chỉ ở đúng câu ước nguyện nội tâm
    cuối đoạn `*Nếu nó sắp kết thúc, thì mong sao nó kết thúc sớm đi.*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000033
  kind: locked_constraint
  value: Giữ tình thái suy đoán “Có lẽ”, các chủ thể “con gái bà” / “con bé”, “Thượng
    đế”, “Đế quốc” và nguyên nhân “vì đã cướp mất chồng mình”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000034
  kind: locked_constraint
  value: Giữ nhận định “sự báo thù sẽ chỉ mang lại cảm giác trống rỗng và buồn thương”,
    sự phân biệt chủ thể giữa “bà lão” / “bà” với “con gái và cháu gái bà” / “hai
    mẹ con”, và mốc thời gian “cho đến khi nỗi đau ấy nguôi ngoai và phai nhạt dần”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000035
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, tên riêng “Mary”, đại từ gộp “bà cháu mình”
    và lời rủ cùng làm chiếc bánh táo.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000036
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại và lời đáp lễ phép “Vâng ạ!” của Mary với bà.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000037
  kind: locked_constraint
  value: Giữ định dạng tiêu đề thời gian in hoa toàn bộ “THÁNG 5, NĂM THỐNG NHẤT 1925”,
    không thêm dấu nhấn mạnh `*...*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000038
  kind: locked_constraint
  value: Giữ tình thái chuẩn mực “Các chiến dịch cần phải được phát động với mục đích
    và mục tiêu rõ ràng.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000039
  kind: locked_constraint
  value: Giữ thuật ngữ “Bộ Tổng tham mưu”, tên chiến dịch có dấu nhấn mạnh chữ nghiêng
    đúng ở cụm tiếng Đức kèm nghĩa dịch trong ngoặc kép `Chiến dịch *Schrecken und
    Ehrfurcht* (“Kinh hoàng và Khiếp sợ”)` theo DEC-P01-002, cùng cấp bậc và tên riêng
    “Hai vị thiếu tướng là Zettour và Rudersdorf”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000040
  kind: locked_constraint
  value: Giữ khẳng định kèm phủ định “hết sức rõ ràng và không chút mơ hồ” về ý đồ
    trong đề xuất của họ.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000041
  kind: locked_constraint
  value: Giữ các thuật ngữ “tổng hành dinh địch”, “hệ thống chỉ huy của lực lượng
    đối phương”, “phòng tuyến địch” và quan hệ nhân quả từ đòn tấn công cấp tiến nhưng
    trực diện đến sự sụp đổ của phòng tuyến địch.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000042
  kind: locked_constraint
  value: Giữ mệnh đề “Một đơn vị sẽ được phái đi để hoàn thành một mục tiêu” và dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng cụm `*hai cộng hai bằng bốn*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000043
  kind: locked_constraint
  value: Giữ câu khẳng định ngắn và câu phủ định ẩn dụ “Một đội quân đã mất đầu thì
    không thể tiến hành chiến tranh.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000044
  kind: locked_constraint
  value: Giữ hình ảnh “một học viên tại học viện quân sự”, ẩn dụ “chặt đầu quân địch”
    và phần giải nghĩa sau dấu gạch ngang “vô hiệu hóa năng lực chỉ huy vốn đóng vai
    trò sống còn đối với một đội quân hiện đại”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000045
  kind: locked_constraint
  value: Giữ quan hệ chuyển ý “Tuy nhiên”, chủ thể “nhiều sĩ quan tham mưu” và chi
    tiết “dấy lên những mối nghi ngờ nghiêm trọng ngay từ đầu”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000046
  kind: locked_constraint
  value: Giữ sự phân biệt giữa “tổng hành dinh” và “bộ chỉ huy dã chiến”, cùng vị
    trí đóng quân “trong lãnh thổ phe ta, nằm xa ngoài tầm với của kẻ địch”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000047
  kind: locked_constraint
  value: Giữ các thuật ngữ “tổng hành dinh của Cộng hòa”, “mặt trận Rhine”, “trinh
    sát chiến đấu” và chi tiết xác nhận kết luận hiển nhiên bằng cái giá là sinh mạng
    của rất nhiều người.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000048
  kind: locked_constraint
  value: Giữ cấu trúc điều kiện phủ định “Trừ phi… bằng không thì chẳng có mấy hy
    vọng thành công”, các thuật ngữ “màn chắn đánh chặn”, “Bộ Tổng tham mưu”, “lữ
    đoàn pháp sư không quân” và mệnh đề giả định về việc lạnh lùng chấp nhận tổn thất
    để tạo đột phá sẽ làm mất trắng cả một lữ đoàn.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000049
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng ở cụm tên tiếng Đức `Chiến dịch *Schrecken
    und Ehrfurcht*` theo DEC-P01-002, chủ thể “nhiều sĩ quan tham mưu” và cấu trúc
    phủ định hạn định “chẳng mang lại kết quả gì ngoài việc liều lĩnh đẩy binh lính
    vào chỗ chết”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000050
  kind: locked_constraint
  value: Giữ phủ định “không một ai trong số những người theo chủ nghĩa hiện thực
    ở bộ tham mưu phản đối mục đích đề ra của chiến dịch”, các thuật ngữ “hệ thống
    chỉ huy”, “phòng tuyến”, “tổng hành dinh” và điều kiện giả định “Giả sử có cơ
    hội thành công hợp lý, bất kỳ con số thương vong nào cũng đều có thể chấp nhận
    được.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000051
  kind: locked_constraint
  value: Giữ quan hệ nhượng bộ ở đầu câu, chủ thể “các sĩ quan tham mưu”, lý do bác
    bỏ đề xuất vì cơ hội quá mong manh và đánh giá “là một sự ngông cuồng không thể
    tưởng tượng nổi” trong hoàn cảnh bình thường.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000052
  kind: locked_constraint
  value: Giữ câu điều kiện mở đầu, hai câu hỏi tu từ liên tiếp về tỷ lệ thắng thấp
    đến mức bất khả thi và việc đặt cược sự thành bại của cuộc đột phá, cùng câu giả
    định cuối đoạn “Nếu quả thực là vậy, mọi sĩ quan sẽ buộc phải cay đắng thừa nhận
    rằng họ thế là hết.” ở dạng văn bản phẳng không thêm dấu sao.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000053
  kind: locked_constraint
  value: Giữ các thuật ngữ “Bộ Tổng tham mưu”, “tổng hành dinh địch”, “mặt trận Rhine”
    và cấu trúc giả định trái thực tế “giá như có thể giáng đòn trực tiếp vào tổng
    hành dinh địch, thì mặt trận Rhine ngay từ đầu đã chẳng rơi vào thế bế tắc”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000054
  kind: locked_constraint
  value: Giữ tình thái thông thường ở vế đầu, quan hệ đối lập và thông tin định danh
    ở vế sau “được soạn thảo và cùng ký tên bởi không ai khác ngoài hai vị tướng Zettour
    và Rudersdorf”.
  non_canon: true
