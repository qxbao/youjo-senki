task_id: vol-03-ch-02-b24
baseline_sha256: 05948737de067d101d9333b5ea23c3ac4ef4f4605695d9131e119979e24099bb
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: edda0c469332614ca5cf04c3ff9120528fd6fb269faa21d89a8b87701ba6abda
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708: locks: [''Giữ đại
    từ “chúng ta”, định danh “Cộng hòa”, sự đối lập giữa cảm giác đã thực sự hạ gục
    được Cộng hòa với cảm giác rờn rợn khi hoàn toàn không có “hỏa lực phòng không”,
    và câu hỏi nghi vấn về đám người tận tụy với bổn phận cố thủ chờ tự nổ tung kéo
    quân ta chết chung.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000709: locks: [''Giữ lời
    tự phủ định “Không, đây là thủ đô của họ.” và nhận định về mặt chính trị họ đâu
    đến mức dửng dưng tới độ tự tay cho nổ tung nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000710: locks: [''Giữ dấu
    ngoặc kép hội thoại, hiệu lệnh xác nhận “HQ nghe rõ.” và mệnh lệnh tiếp tục quan
    sát điểm đạn rơi cùng đề cao cảnh giác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000711: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “mình” theo DEC-P01-001, thuật ngữ “tác chiến đô thị”,
    ý muốn của quân đội thà san phẳng thành phố trước khi địch kịp cố thủ và sự đồng
    tình của Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000712: locks: [''Giữ đối
    sánh giữa việc đánh một trận chiến đô thị đầy rắc rối rồi lần lượt càn quét từng
    khu vực với việc bao vây và tiêu diệt chúng dễ dàng hơn nhiều và rất hiệu quả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000713: locks: [''Giữ đại
    từ “chúng ta”, hai kịch bản rủi ro khi bỏ thời gian dùng pháo binh bắn phá thành
    phố (để địch trốn thoát hoặc các đơn vị địch rời bỏ cuộc chiến và rút lui) cùng
    hệ quả phải có ai đó chặn đường rút lui của chúng ở hậu phương.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000714: locks: [''Giữ đại
    từ “mình” theo DEC-P01-001, các thuật ngữ “đơn vị đổ bộ đường không”, “các pháp
    sư” và giả định nếu không may thì đơn vị của mình có thể bị cử đi lao xuống tấn
    công chúng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000715: locks: [''Giữ nhận
    định so sánh việc này vẫn tốt hơn nhiều so với phải ở dưới chiến hào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000716: locks: [''Giữ ý bị
    tập kích bất ngờ trong một thành phố nằm giữa lãnh thổ địch nghe chẳng lấy gì
    làm vui vẻ và kết luận tốt nhất vẫn là không phải làm chuyện đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000717: locks: [''Giữ các
    đại từ “chúng ta / mình” theo DEC-P01-001, niềm hy vọng pháo binh nắm bắt được
    động tĩnh của địch cùng địa hình và cân nhắc xem “hỏa lực yểm trợ đối đất” có
    làm nhụt ý chí rút lui của địch hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000718: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu xác nhận “Fairy nghe rõ.” và lời đáp “Chúng tôi sẽ cảnh
    giác.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000719: locks: [''Giữ đúng
    cụm chữ nghiêng `*Chúng ta đã đi được đến tận đây mà không bị lâm vào một vụ Dunkirk.
    Một khi thắng cuộc chiến này, hẳn mình sẽ có thể tận hưởng quãng đời còn lại.*`
    theo DEC-P01-002, cách dịch “bị lâm vào một vụ Dunkirk” nhất quán với b13, và
    câu trần thuật chữ thường nêu rõ định danh “Tanya” cùng đại từ tập thể “họ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000720: locks: [''Giữ cấu
    trúc điều kiện khái quát “Nếu không sống sót đến cuối cùng, người ta sẽ chẳng
    được dự phần vào chiến thắng.” và câu độc thoại ngôi thứ nhất dùng “Mình / mình”
    theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000721: locks: [''Giữ định
    dạng chữ in hoa toàn bộ tiêu đề phân cảnh: “NGÀY 19 THÁNG 6, NĂM THỐNG NHẤT 1925,
    CỘNG HÒA, TỈNH FINISTÈRE, CĂN CỨ HẢI QUÂN BREST”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000722: locks: [''Giữ các
    định danh “Lục quân Đế quốc”, “căn cứ hải quân tại Brest”, chức danh và cấp hàm
    “Thứ trưởng kiêm nhiệm cả Quốc phòng lẫn Lực lượng Vũ trang, Thiếu tướng de Lugo”
    cùng chi tiết chọc thủng các phòng tuyến bên ngoài thủ đô và tiến vào khu vực
    nội đô.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000723: locks: [''Giữ đại
    từ “ông” quy chiếu Thiếu tướng de Lugo và sự tương phản giữa việc đã lường trước
    thông báo với cảm giác vô cùng cay đắng khi thực sự nhận được nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000724: locks: [''Giữ đại
    từ “ông” và sự đối lập giữa việc chính ông dự thảo kế hoạch cho kịch bản này với
    tâm trạng làm điều đó trong nỗi hổ thẹn, nuốt nước mắt vào trong.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000725: locks: [''Giữ câu
    ngắn “Một kế hoạch rút khỏi lục địa…” cùng dấu chấm lửng ở cuối.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000726: locks: [''Giữ định
    danh “Thiếu tướng de Lugo”, “người lính Cộng hòa”, đại từ “ông”, sự đối lập giữa
    quá khứ bước đi trên con đường sáng lạn đầy kiêu hãnh với hiện tại hoàn toàn hổ
    thẹn và bậc tăng tiến “còn hơn cả thế, lòng ông ngập tràn phẫn nộ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000727: locks: [''Giữ các
    định danh “Cộng hòa”, “Lục quân Đế quốc”, đại từ “ông” và quan hệ nhân quả chính
    nhờ nỗ lực tự nguyện của những người lính đã ngã xuống mà họ mới thu hút được
    sự chú ý của Lục quân Đế quốc về phía thủ đô.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000728: locks: [''Giữ đại
    từ “Ông / ông” và mối liên hệ nhân quả vì khoảng thời gian đồng đội dốc sức đánh
    đổi giúp duy trì nhịp đập của Cộng hòa hơn bất cứ điều gì khác nên ông không thể
    lãng phí dù chỉ một khoảnh khắc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000729: locks: [''Giữ định
    danh “người lính Cộng hòa”, đại từ trần thuật “ông”, câu độc thoại nội tâm chữ
    nghiêng `*Chẳng phải lẽ ra tôi phải có mặt ở đó, sát cánh cùng những người đồng
    đội trong hàng ngũ sao?*` theo DEC-P01-002 và câu kết chữ thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000730: locks: [''Giữ tư
    cách “một người chỉ huy”, đại từ “ông” và ý phải chôn chặt những cảm xúc đó vào
    sâu trong lòng vì ai nấy đều đang gánh vác chung một gánh nặng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000731: locks: [''Giữ đại
    từ “ông / Ông”, các định danh “căn cứ hải quân Brest thuộc tỉnh Finistère”, “Đế
    quốc” và việc tập hợp tất cả số tàu thuyền có thể mà không để Đế quốc phát hiện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000732: locks: [''Giữ chi
    tiết khởi hành với những con tàu chất đầy vũ khí hạng nặng và tài nguyên từ thông
    thường đến khan hiếm cùng nhiều binh lính, và sự đối lập chua xót khi mảnh đất
    cùng người dân lẽ ra phải bảo vệ thì họ lại bỏ lại phía sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000733: locks: [''Giữ các
    định danh “Cụm tập đoàn quân Rhine thuộc Cộng hòa”, “Cụm tập đoàn quân Rhine”,
    “quân đội chính quốc”, “chính quốc Cộng hòa”, “Đế quốc” và toàn bộ chuỗi hệ quả
    chiến lược khi phần lớn các đơn vị tác chiến bảo vệ tổ quốc bị xóa sổ, chỉ còn
    lại bộ máy quân sự rỗng tuếch cùng đám quan chức sững sờ ở tầng lớp chóp bu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000708
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000734: locks: [''Giữ các
    định danh “Đế quốc”, “Cộng hòa”, “Khối Thịnh vượng chung” và sự tương phản giữa
    việc sẵn sàng huy động đến từng đơn vị cuối cùng kèm sự hỗ trợ của Khối Thịnh
    vượng chung với nhận thức thẳng thắn của một số người rằng làm vậy chỉ là trì
    hoãn điều tất yếu.'']'
  non_canon: true
