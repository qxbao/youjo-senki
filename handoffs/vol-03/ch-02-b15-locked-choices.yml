source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: a833b4506c1eff923f5af3a5fb06fc80af8293c0b80e6841cdc2edf065e9f800
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405: locks: [''Giữ tên
    “Tanya”, dấu ngoặc kép hội thoại, cụm “Đám John Bull” và câu hỏi vặn xem họ có
    đang can thiệp vào hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000406: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Hotel 09”, “Fairy 01”, ngôi “tôi”, cụm “một
    kiểm soát viên quèn” và lời xin lỗi không dám nói chắc chuyện đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000407: locks: [''Chỉ đánh
    dấu chữ nghiêng đúng cụm `*Ừ thì, cũng phải thôi*` ở đầu câu theo DEC-P01-002;
    giữ đại từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “quy tắc giao chiến”, câu
    hỏi trong ngoặc kép của “Fairy 01” xưng “Chúng tôi”, và câu hỏi nội tâm tiếp nối
    xưng “Chúng ta” về việc phải đánh chặn hay rút lui trong chiến tranh hiện đại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000408: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Các vị”, các cụm “quốc gia thứ ba”, “không phận giao
    tranh” và chỉ dẫn có thể tiêu diệt bất kỳ “pháp sư không phải quân ta” nào như
    kẻ địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000409: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Fairy 01” và câu xác nhận “rõ. Nghe vậy là yên
    tâm rồi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000410: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, thuật ngữ “pháp sư trên không” và hai mệnh đề đối xứng
    “Hễ là kẻ địch thì bắn hạ. Không phải kẻ địch thì yểm trợ.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000411: locks: [''Giữ tên
    “Tanya”, các định danh “đại đội tuyển chọn thuộc Tiểu đoàn Pháp sư Trên không
    số 203”, “Vùng Đất Thấp” và hành động dẫn đầu đơn vị tiến vào không phận được
    chỉ định.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000412: locks: [''Giữ các
    cụm “trận đánh bao vây khổng lồ”, “Cannae”, ký hiệu chú thích `⁶` ngay sau dấu
    chấm câu, “thế trận bao vây kép” và cấu trúc “nuốt trọn không chỉ một quân đoàn
    của Lục quân Cộng hòa mà là toàn bộ lực lượng chủ lực của họ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000413: locks: [''Giữ chữ
    nghiêng toàn bộ đoạn `*Khi Lục quân Đế quốc giam hãm được ngần ấy quân số, bao
    vây họ một cách tài tình đến thế, chiến công ấy đã ghi một dấu ấn không thể phai
    mờ vào lịch sử.*` theo DEC-P01-002 và định danh “Lục quân Đế quốc”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000414: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và chi tiết chợt giật mình nhớ lại quãng đời quân ngũ
    từ trước tới nay khiến nước mắt trào dâng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000415: locks: [''Giữ các
    đại từ nội tâm tự quy chiếu “chúng ta”, “mình” theo DEC-P01-001 và mạch suy nghĩ
    về việc người lính đắm mình trong chiến tranh dễ đánh mất lẽ thường, mong muốn
    trân trọng lý trí cùng sự thông tuệ của một công dân am tường chuẩn mực thời đại
    mới, và niềm tin khi hòa bình trở lại thì tất cả những thứ này sẽ được thay thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000416: locks: [''Giữ các
    đại từ nội tâm tự quy chiếu “mình”, “chúng ta” theo DEC-P01-001, các cụm “Những
    người lính Đế quốc”, “quân nhân tham chiến”, “công dân”, “chuẩn mực dân sự” và
    sắc thái tự trách trong quá khứ “lẽ ra mình phải nhớ rằng”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000417: locks: [''Giữ nhịp
    hai câu ngắn tự nhủ chỉ còn một chút nữa thôi, chỉ cần kiên nhẫn thêm một chút
    nữa thôi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000418: locks: [''Giữ ngôi
    “chúng ta” theo DEC-P01-001, định danh “Lục quân Cộng hòa” và hình ảnh đen tối
    “biến Lục quân Cộng hòa thành thứ phân bón từng một thời là con người” để chấm
    dứt cuộc chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000419: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “Mình / mình” theo DEC-P01-001, cụm “bất kỳ vụ Dunkirk
    nào” nhất quán với b13, và mục đích vì nền hòa bình cùng tương lai của chính bản
    thân mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000420: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Kế hoạch Tấn công 177” được nhắc lại hai lần,
    và mệnh lệnh cho toàn bộ các đơn vị tuân thủ quy trình đã định để bắt đầu giao
    chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000421: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Fairy 01”, cụm “Rõ, thi hành 177.”, ngôi “Chúng
    tôi” và lời hô “Chúc Đế quốc chiến thắng!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000422: locks: [''Giữ tên
    “Tanya”, các cụm “sở chỉ huy”, “mặt trận Rhine”, đại từ “chúng ta” và dấu ngoặc
    kép quanh từ ““ngọn lửa”” được sinh ra từ trí tuệ của nhân loại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000423: locks: [''Giữ sự
    chuyển mạch sang điểm khác biệt của ngày hôm nay và câu nhận xét nếu lắng nghe
    thật kỹ, ta có thể nghe thấy những dấu hiệu ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000424: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Gale 01”, ngôi “Chúng tôi” và báo cáo đã chuẩn
    bị xong cho “giai đoạn hai”, đang chờ lệnh “xuất kích”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000425: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Schwarz 01”, các cụm “Dự kiến có gây nhiễu ma
    pháp.”, “Rõ, thi hành 177.”, ngôi “Chúng tôi” và báo cáo đang triển khai các hành
    động theo quy định.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000426: locks: [''Giữ mạch
    lập luận sóng vô tuyến hoàn toàn trong trẻo và báo cáo truyền về rõ như khi diễn
    tập là bằng chứng cho thấy địch thiếu “cơ sở vật chất của sở chỉ huy” hoặc “nguồn
    điện” để gây nhiễu, đồng thời “lực lượng đánh chặn có tổ chức” của địch về cơ
    bản lại đang xuất hiện sau khi sự đã rồi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000427: locks: [''Giữ sự
    đối sánh hỏa lực giữa “Lục quân Đế quốc” (thoải mái bắn đủ các loại đạn pháo,
    đáng kể nhất là cỡ “255 mm”) với “Lục quân Cộng hòa” (chẳng có đủ đạn pháo “78
    mm” dùng cho bộ binh), cùng hình ảnh lượng sắt thép đổ vào cuộc đấu hỏa lực nhiều
    đến mức phải vẽ lại bản đồ và biến thành “một cuộc thảm sát một chiều”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000428: locks: [''Giữ định
    danh “Lục quân Cộng hòa”, dấu chấm lửng trước nhận xét “thiếu tính gắn kết”, ba
    hướng hành động tự phát của ba đơn vị (đánh thốc ra “phá vây”, “đào chiến hào”
    phòng ngự, tiến về “các cơ sở cảng” tìm đường ra biển thoát thân) và kết luận
    vì cấu trúc quân đội đã tan rã nên họ đang thử mọi giải pháp cùng một lúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000429: locks: [''Giữ sự
    tương phản giữa cảnh hỗn loạn thảm thương của “Lục quân Cộng hòa khi đã mất đầu
    chỉ huy” với các hành động của “một Lục quân Đế quốc vững vàng về mặt cấu trúc”
    xứng đáng được ca ngợi như “một chiến thắng của tính tổ chức”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000430: locks: [''Giữ các
    cụm “quân Đế quốc”, “các tuyến tiếp tế”, “lực lượng chủ lực của Lục quân Cộng
    hòa”, “tuyến Rhine” và lập luận vì các đơn vị này đã bám trụ ở tuyến Rhine một
    thời gian nên dù mang theo bao nhiêu cũng chắc chắn cần được tiếp tế thêm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000431: locks: [''Giữ ước
    tính lượng vật tư “một người lính bộ binh” mang theo tối đa chỉ đủ dùng trong
    ba ngày, chi tiết đạn pháo cho “pháo hạng nặng” đều phải chuyển từ “hậu phương”
    lên, và cấu trúc “không chỉ… mà còn…” cùng chủ thể “Đám người này” (không chỉ
    thiếu đồ ăn nóng mà còn đang cạn dần cả đạn pháo).'']'
  non_canon: true
