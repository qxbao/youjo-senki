source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 912f12f0e3cb3f4512048c4e177e5878e38c0897896ccac27ffe4b0b2f9efb54
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310: locks: [''Giữ danh
    xưng “Vị thủ tướng”, định danh “Đế quốc” và mạch chuyển tiếp từ kết cục cuộc chiến
    sang vấn đề hình hài của trật tự thế giới một khi Đế quốc sụp đổ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000311: locks: [''Giữ đại
    từ “chúng ta” / “họ” và lập luận rằng những người bạn đồng minh đã gánh chịu gần
    hết gánh nặng nên không thể chỉ ngồi hưởng thành quả mà nên giúp đỡ họ một chút.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000312: locks: [''Giữ định
    danh “Liên bang”, “Hợp chúng quốc” và câu hỏi tu từ đề xuất nhân cơ hội tình hình
    an ninh quốc gia đã được cải thiện để hạn chế chi tiêu quân sự.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000313: locks: [''Giữ định
    danh “Khối Thịnh vượng chung” và chi tiết một số người ăn mừng chiến thắng trước,
    cho rằng đã đến lúc làm rõ lập trường quốc gia và chớp cơ hội kiếm lời dễ dàng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000314: locks: [''Giữ ý can
    ngăn rằng làm vậy vẫn còn hơi quá sớm và câu hỏi đề xuất tận dụng vị thế đứng
    ngoài cuộc để thu xếp các cuộc đàm phán hòa bình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000315: locks: [''Giữ định
    danh “Đế quốc”, thuật ngữ “hiệp ước hòa bình” và hai đề xuất hành động: ra lệnh
    cho mỗi cơ quan khảo sát sơ bộ về hiệp ước hòa bình, đồng thời cho hạm đội phô
    trương lực lượng để đánh tiếng rằng nếu không nhanh chóng đi đến hòa bình thì
    Đế quốc sẽ biến họ thành kẻ thù.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000316: locks: [''Giữ nhận
    định rằng ngay cả những người có ý kiến khá thực tế cũng nói chuyện như thể cuộc
    chiến sẽ sớm kết thúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000317: locks: [''Giữ định
    danh “Hải quân Hoàng gia”, “Đế quốc” và niềm tin rằng Đế quốc chắc chắn sẽ từ
    bỏ sự kháng cự liều lĩnh nếu phải gây chiến với lực lượng hàng hải hùng mạnh nhất
    thế giới cùng đội lục quân danh giá nhất thế giới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000318: locks: [''Giữ cụm
    nhận xét “một lũ duy lý đến phát tởm” và giả định rằng nếu hiểu ý nghĩa sự can
    thiệp của Khối Thịnh vượng chung thì biết đâu Đế quốc sẽ ký hiệp ước hòa bình
    trước cả khi họ kịp tham chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000319: locks: [''Giữ câu
    nhận xét nội tâm in nghiêng `*Đó là sự lạc quan nực cười.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000320: locks: [''Giữ cụm
    “người đàn ông ấy”, đại từ “ông ta” và hành động không còn lựa chọn nào khác ngoài
    việc lên tiếng xen vào, đứng bật dậy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000321: locks: [''Giữ danh
    xưng “Ngài Marlborough”, đại từ “Ngài” và câu hỏi khi thấy ông ta đứng dậy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000322: locks: [''Giữ lời
    xin thứ lỗi “thưa Thủ tướng”, danh xưng “các quý ông đây”, câu ngạn ngữ in nghiêng
    `*Lauso la mare e tente’n terro*` theo DEC-P01-002 cùng phần giải nghĩa trong
    ngoặc đơn ‘Hãy ca tụng biển khơi, nhưng hãy giữ đôi chân bám chặt trên mặt đất’.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000323: locks: [''Giữ danh
    xưng “Ngài Marlborough”, đại từ “ngài”, thuật ngữ “những chiếc thuyền chèo thời
    Trung cổ”, “các tàu chiến chủ lực”, “lớp siêu dreadnought” và câu hỏi mỉa mai
    về thẩm quyền hải quân của Marlborough.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000324: locks: [''Giữ đại
    từ “Ông ta / người đàn ông ấy, Marlborough”, chức danh “Ngài Bộ trưởng Tài chính
    Loluyd”, định danh “Đế quốc” và lập luận rằng chỉ có thể giáng đòn quyết định
    vào Đế quốc bằng lục quân vì đó là quốc gia lục địa nên đe dọa các tuyến hàng
    hải sẽ không gây thiệt hại chí mạng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000325: locks: [''Giữ danh
    xưng “Ngài Marlborough”, định danh “Đế quốc”, thuật ngữ “vùng công nghiệp phía
    tây” và câu hỏi phản biện rằng Đế quốc sẽ lấy gì để tiến hành chiến tranh một
    khi đánh mất vùng đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000326: locks: [''Giữ đại
    từ “ông ta”, tên riêng “Loluyd”, định danh “Đế quốc”, thuật ngữ “vùng công nghiệp
    phía tây”, “cơ sở sản xuất lớn nhất cả nước” và hệ quả mất đi phần lớn chỗ dựa
    để tiếp tục cuộc chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000327: locks: [''Giữ câu
    in nghiêng `*Một khi điều đó xảy ra, chắc chắn Đế quốc sẽ buông kiếm.*` theo DEC-P01-002
    và chi tiết Marlborough vẫn nghe thấy hàm ý đó dù không được nói thẳng thành lời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000328: locks: [''Giữ chức
    danh “Bộ trưởng Tài chính”, định danh “Đế quốc”, “Cộng hòa” và cảnh báo về việc
    hai nước gần như đã làm khánh kiệt nền tài chính, sẽ lâm vào cảnh thâm hụt sau
    khi chiến sự chấm dứt và mắc kẹt trả nợ suốt bốn mươi năm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000329: locks: [''Giữ đại
    từ “Ông” (quy chiếu Loluyd), câu in nghiêng `*Dù có chuyện gì xảy ra đi nữa, Đế
    quốc và tất cả các quốc gia còn lại tham gia vào cuộc chiến rồi sẽ khánh kiệt.*`
    theo DEC-P01-002, định danh “Khối Thịnh vượng chung” và chi tiết Loluyd vừa vươn
    tay lấy tách trà vừa buông tiếng “Vớ vẩn!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000330: locks: [''Giữ lời
    kết luận dung hòa: đằng nào cũng sẽ tham gia nên tham gia quá muộn sẽ phiền phức,
    trước mắt chuẩn bị điều hạm đội xuất kích và ra lệnh cho lục quân chuẩn bị viễn
    chinh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000331: locks: [''Giữ tên
    riêng “Marlborough”, đại từ “ông ta”, dấu ngoặc kép quanh chữ “chuẩn bị” và nhận
    định rằng từ quan điểm của ông ta thì chỉ cho phép chuẩn bị như thế sẽ là quá
    muộn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000332: locks: [''Giữ định
    danh “Đế quốc”, danh xưng “các vị” / “các quý ông đây” và lời chất vấn gay gắt
    của Marlborough xem họ có thực sự tin Đế quốc sẽ nhục nhã rút lui và nuốt trôi
    một hiệp ước hòa bình hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000333: locks: [''Giữ chi
    tiết gương mặt phúng phính như chó bull đỏ bừng vì giận dữ, câu in nghiêng `*Đừng
    có đùa cợt nữa!*` theo DEC-P01-002 và ý thức của Marlborough rằng dự đoán kịch
    bản tồi tệ nhất của mình sẽ chẳng có gì đáng cười cả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000334: locks: [''Giữ đại
    từ “ông ta” và câu in nghiêng kết đoạn `*Chuẩn bị xuất quân ư? Chắc hẳn ngài đang
    nói đùa.*` theo DEC-P01-002.'']'
  non_canon: true
