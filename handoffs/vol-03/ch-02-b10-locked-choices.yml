task_id: vol-03-ch-02-b10
baseline_sha256: 3db7ca9a289c697c177e5923d3f971971724b53222780b125a961bb7296aa925
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 3cf0c1468b74b421d2ba0dc7fbce912f6525300b182b2dba8ac846672f45e0ab
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi” và lời hô khẩn cấp thông báo đang hạ độ cao, giục
    gọi cho sở chỉ huy ngay không được chần chừ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000227: locks: [''Giữ chỉ
    đánh dấu chữ nghiêng đúng câu đầu `*Một khi cỗ máy quân sự của Đế quốc đã khởi
    động và đi vào guồng, muốn chặn nó lại chẳng phải chuyện dễ dàng gì.*` theo DEC-P01-002,
    các định danh “Đế quốc”, “Arene”, đại từ “Anh” và việc đã thấm thía bài học đó
    ở Arene.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000228: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn theo DEC-P01-002, ngôi “Đám người đó / Chúng”,
    thuật ngữ “raison d’état” và nhận định về những kẻ cầu toàn chạm ngưỡng tâm thần
    có sự tận tụy dành cho cỗ máy chiến tranh vượt lên trên cả khái niệm raison d’état
    trứ danh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000229: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “sở chỉ huy Cụm tập đoàn quân Rhine”, cụm “các
    đơn vị cơ động và dự bị chiến lược”, ngôi “chúng ta” và điều kiện nếu không điều
    động toàn bộ đến người cuối cùng tới đây thì sẽ không tài nào bịt nổi lỗ thủng
    này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000230: locks: [''Giữ đại
    từ “anh”, chi tiết vừa đáp xuống đất vừa hoảng hốt truyền đạt cuộc khủng hoảng
    qua điện đài vô tuyến và cảnh lao vào khu vực chỉ huy thấy vẻ đau khổ cùng cực
    hiện rõ trên gương mặt vị sĩ quan đang chờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000231: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Trung tướng Michalis, Sư đoàn 10”, “Trung
    tá”, “sở chỉ huy cụm tập đoàn quân”, ngôi “Tôi” – “Anh” và mệnh lệnh lập tức lên
    đường để cảnh báo cho những người khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000232: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi” – “ngài” trong thoại, chỉ đánh dấu chữ nghiêng
    đúng câu hỏi nội tâm `*Sao lại phải mất công cử người đưa tin làm gì?*` theo DEC-P01-002,
    đại từ “anh” và việc vị tư lệnh sư đoàn ngắt lời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000233: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Trung tá”, ngôi “chúng ta” và thông báo đã mất
    toàn bộ các phương thức liên lạc dù là hữu tuyến hay bất kỳ cách nào khác, không
    thứ gì kết nối được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000234: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Mất sạch liên lạc ư…? Vậy có nghĩa là…*` theo
    DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000235: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu thốt “…Cái gì cơ ạ?!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000236: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Vậy có nghĩa là chẳng một ai nhận được lời cảnh
    báo của mình cả!*` theo DEC-P01-002 và ngôi “mình”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000237: locks: [''Giữ đại
    từ “anh”, các thuật ngữ “chiến hào dự bị”, “bộ chỉ huy tiền tuyến”, “sư đoàn”,
    “tập đoàn quân”, câu hỏi tu từ liệu bộ chỉ huy tiền tuyến có còn nổi lấy một sư
    đoàn để xoay xở không khi ngay cả chiến hào dự bị cũng đã bị xóa sổ, và thực tế
    dù còn lại lực lượng nào họ cũng phải dùng chừng ấy để trấn giữ một mặt trận vốn
    do cả một tập đoàn quân bảo vệ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000238: locks: [''Giữ chỉ
    đánh dấu chữ nghiêng đúng từ `*cần*` theo DEC-P01-002 và ý họ cần quân tiếp viện
    càng sớm càng tốt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000239: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Trung tá” và câu hỏi xác nhận quân địch đang tiến
    về hướng này phải không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000240: locks: [''Giữ chỉ
    đánh dấu chữ nghiêng đúng cụm `*Chuyện quái gì thế này?*` theo DEC-P01-002, tên
    “Vianto” và hành động chán nản gật đầu rồi tiếp tục báo cáo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000241: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn theo DEC-P01-002 và chuỗi suy luận rằng sở chỉ
    huy không hề biết chuyện gì đang diễn ra nên chưa cử quân tiếp viện, thậm chí
    có khi còn chẳng nhận ra quân địch sắp sửa chọc thủng phòng tuyến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000242: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Đế quốc”, ngôi “chúng ta / ta”, cấu trúc tăng
    tiến “không chỉ gây nhiễu mà còn đi xa đến mức cắt đứt cả đường dây thông tin
    ở hậu phương của ta” và nhận xét gần như mắc chứng hoang tưởng nhưng hiệu quả
    đến phát sợ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000243: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi”, cụm “sở chỉ huy cụm tập đoàn quân” và lời nhận
    lệnh bay tới đó ngay lập tức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000244: locks: [''Giữ định
    danh “Đế quốc”, cụm “sĩ quan ma pháp làm nhiệm vụ đưa tin” và mạch ý họ đã quá
    quen thuộc đến mức căm ghét sự triệt để của Đế quốc nhưng không còn thời gian
    chìm đắm trong nỗi uất ức mà phải có người gióng hồi chuông báo động nhanh nhất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000245: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi” – “anh”, “chúng ta”, định danh kèm ký hiệu chú
    thích “Horatius⁴” và lời ủy thác chuyển mảnh thư viết vội báo động cho sở chỉ
    huy xin quân tiếp viện ngay lập tức vì đến cả Horatius cũng không thể một mình
    giữ nổi cây cầu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000246: locks: [''Giữ tên
    “Vianto”, đại từ “anh” và chuỗi hành động quẳng chiếc ba lô chất đầy chai lọ và
    thư từ đang đeo, nhận lấy phong bì từ vị tư lệnh, bọc trong mảnh vải cất kỹ vào
    túi ngực rồi bắt tay vị tư lệnh và lập lời thề.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000247: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi”, chỉ đánh dấu chữ nghiêng đúng cụm `*nhất định*`
    theo DEC-P01-002 và lời thề chuyển bức thư tới nơi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000248: locks: [''Giữ đại
    từ “Anh” và câu trần thuật ngắn chẳng cần phải nói thêm bất cứ lời nào nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000249: locks: [''Giữ các
    thuật ngữ “sở chỉ huy tiền tuyến”, “thuật thức bay”, đại từ “anh”, chỉ đánh dấu
    chữ nghiêng đúng câu mệnh lệnh nội tâm `*Hãy báo động cho những người khác về
    cuộc khủng hoảng này!*` theo DEC-P01-002 và sự giằng xé giữa nỗi đau bỏ lại đồng
    đội như tháo chạy với ý thức trách nhiệm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000250: locks: [''Giữ các
    định danh “Sư đoàn 10”, “Horatius”, chỉ đánh dấu chữ nghiêng ở đúng hai câu `*Chính
    vì vậy, bằng mọi giá, mình phải gọi được quân tiếp viện trong lúc họ câu giờ.*`
    và `*Mình phải bay đi thôi.*` theo DEC-P01-002, ngôi nội tâm “mình”, đại từ trần
    thuật “anh” và hình ảnh những người gác cổng bảo vệ Tổ quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000251: locks: [''Giữ tên
    “Vianto”, đại từ “anh”, cụm “sở chỉ huy tuyến sau” và hành động vừa len lỏi qua
    đám binh lính hỗn loạn vừa hét cảnh báo và mệnh lệnh đánh chặn rồi liều mạng bay
    hết tốc lực về sở chỉ huy tuyến sau ngay khi lên không trung.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000252: locks: [''Giữ đại
    từ “anh” và việc chưa kịp đạt đủ độ cao đã buộc phải thực hiện những động tác
    cơ động né tránh bất quy tắc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000253: locks: [''Giữ các
    thuật ngữ “thuật thức bắn tỉa quang học”, “đại đội pháp sư”, “các pháp sư Đế quốc”,
    đại từ “anh” và thế đối lập giữa quy mô đợt tấn công chỉ cỡ một đại đội pháp sư
    với thực tế kinh hoàng rằng pháp sư Đế quốc đã thọc sâu đến tận mức này vào lãnh
    thổ của họ khiến anh buột miệng chửi thề.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000254: locks: [''Giữ đại
    từ “anh”, câu hỏi tu từ ở câu đầu và chỉ đánh dấu chữ nghiêng đúng câu thứ hai
    `*Chúng giỏi chiến tranh đến mức làm mình phát buồn nôn.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000255: locks: [''Giữ dấu
    ngoặc kép hội thoại, lời chửi “Khự! Mẹ kiếp, lũ khốn khoai tây thối rữa các ngươi!”,
    đại từ “anh”, thuật ngữ “thuật thức đánh lừa quang học” và cấu trúc mục đích “không
    phải để đẩy lùi quân địch mà là để giúp mình thoát thân”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000256: locks: [''Giữ đại
    từ “anh”, con số độ cao “8.500” và chi tiết dù ý thức chực chờ lịm đi vẫn dùng
    ý chí ghì chặt nó lại với thế giới này và vắt kiệt buồng phổi đau đớn tột cùng
    để vọt lên cao tránh bị truy kích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000257: locks: [''Giữ đại
    từ “anh”, thuật ngữ “thuật thức dạng nổ” và chi tiết toán địch bắn vài phát thuật
    thức dạng nổ một cách thiếu kỷ luật, có lẽ để nghi binh, rồi quay đầu bỏ mặc anh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000258: locks: [''Giữ tên
    “Vianto”, đại từ “anh”, cụm “Chủ nghĩa duy lý phi nhân tính” và nhận định đối
    với cấp chỉ huy địch thì việc xóa sổ toàn bộ mọi người tại các cơ sở sở chỉ huy
    là ưu tiên cao hơn nhiều so với việc hạ gục Vianto.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000259: locks: [''Giữ đại
    từ “anh” và kết luận sở chỉ huy quân mình vừa mới phái anh đi sẽ phải hứng chịu
    hỏa lực.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000260: locks: [''Giữ đại
    từ “anh” và sự xung đột giữa nỗi nhẹ nhõm vì thoát truy kích với nỗi nhục nhã
    khi phải hy sinh đồng đội để chạy thoát trong hoàn cảnh hiện tại khiến anh điên
    tiết mà chẳng thể làm được gì.'']'
  non_canon: true
