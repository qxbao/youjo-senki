task_id: vol-03-ch-04-b04
baseline_sha256: 276caf8ec877ca39794119e95271701cb603e1e7d5890da3ab92633e6a54e5f1
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 5f79710a9fd3bc2f82d66ec211acf7c77b49a098f52e7052e249a8f6115033c1
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065: locks: [''Giữ lời
    bắt máy của Weiss `“Tôi là Trung úy Weiss nghe đây.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000066: locks: [''Giữ lời
    chào lễ phép của Visha `“Thưa Trung úy, tôi là Thiếu úy Serebryakov. Thật xin
    lỗi vì đã gọi cho Trung úy trong lúc ngài đang nghỉ phép ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000067: locks: [''Giữ đại
    từ `anh` quy chiếu Weiss, tên `Visha` và chính xác cụm chữ nghiêng ở cuối câu
    `*Xin hãy liên lạc với Thiếu tá.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000068: locks: [''Giữ giọng
    điệu trêu chọc khi đang ngà ngà say của Weiss, xưng hô `tôi` / `Bọn tôi` – `Visha`
    / `cô` và câu hỏi trực tiếp về việc ước được ra bãi biển.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000069: locks: [''Giữ câu
    trần thuật ngắn `Đúng vậy, chuyện này thật ngoài dự tính.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000070: locks: [''Giữ sự
    đối lập giữa vẻ điềm tĩnh, chu đáo thường ngày của `Trung úy Weiss` với việc lần
    này `anh` đang say rượu nên lỡ lời, khiến `Visha` hơi bực mình một chút.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000071: locks: [''Giữ đại
    từ `cô` ở phần dẫn và chính xác phạm vi chữ nghiêng ở mệnh đề độc thoại nội tâm
    từ sau dấu hai chấm đến hết câu theo DEC-P01-002, cùng các chức danh `phó chỉ
    huy`, `Thiếu tá`, `sĩ quan phụ tá`, `sĩ quan trực ban` và đại từ tự xưng `mình`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000072: locks: [''Giữ câu
    chuyển ý phủ định `Nhưng mọi chuyện lại chẳng diễn ra như thế.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000073: locks: [''Giữ lời
    phủ định lễ phép `“…Không ạ, tôi có lời nhắn cần chuyển cho Trung úy.”`, định
    danh `Thiếu tá`, `Văn phòng Bộ Tổng tham mưu` và thông tin `chúng tôi` sẽ rời
    đi trong khoảng ba hoặc bốn ngày.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000074: locks: [''Giữ tên
    `Visha`, đại từ `anh` / `cô` và chi tiết nhân lúc Weiss lỡ lời mà thản nhiên nói
    thẳng sự thật bằng `giọng điệu công vụ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000075: locks: [''Giữ câu
    hỏi xác nhận của Weiss `“Vậy là cô báo cho tôi biết để tôi về tiếp quản công việc
    hả?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000076: locks: [''Giữ câu
    trả lời ngắn gọn đúng mực `“Vâng, tôi nhận lệnh thông báo cho Trung úy ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000077: locks: [''Giữ định
    danh `Thiếu tá von Degurechaff`, đại từ `cô` (Visha), và chính xác câu thứ hai
    in nghiêng `*Chúng ta sẽ tới thủ đô, nên cô hãy liên lạc với Trung úy Weiss để
    báo cho anh ta biết.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000078: locks: [''Giữ câu
    hỏi phân vân của Weiss `“…Chắc là giờ cô đã báo cho tôi biết chuyện đó rồi thì
    tôi nên quay về trao đổi với Thiếu tá nhỉ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000079: locks: [''Giữ thái
    độ dửng dưng đúng phép tắc của Visha `“Tùy ý Trung úy ạ. Tôi đã chuyển lời nhắn
    cần thiết rồi, nên không dám lạm bàn gì thêm về việc này.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000080: locks: [''Giữ hình
    ảnh lè lưỡi trêu ngươi trong thầm tưởng và việc `Visha` trả đũa một chút bằng
    sự thật trần trụi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000081: locks: [''Giữ cách
    làm rõ chủ thể `Thiếu tá` để phân biệt với `Visha` (`cô`) và `anh` (Weiss), mệnh
    đề phủ định kép `không nói rõ là bảo anh về hay đừng về`, `không nằm trong phận
    sự của Visha` và nhận định cá nhân dựa trên tư duy thực dụng của cấp trên rằng
    chỉ cần trao đổi qua điện thoại là đủ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000082: locks: [''Giữ mệnh
    đề phủ định `Nhưng cô chẳng có nghĩa vụ phải nói tới mức đó với anh.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000083: locks: [''Giữ sự
    chuyển đổi đối tượng giao tiếp trong lời Weiss: đáp `Thiếu úy` (Visha) rằng `tôi`
    nên trao đổi trực tiếp với `Thiếu tá`, rồi quay sang giao việc cho `Thiếu úy Grantz`
    (`cậu`) với cái cớ hài hước vừa nhận được lời mời từ một quý cô xinh đẹp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000084: locks: [''Giữ định
    danh `Trung úy Weiss`, `Thiếu úy Grantz`, `Visha` và chi tiết Weiss giao phó mọi
    thứ còn lại bằng giọng điệu vui vẻ hơn hẳn mọi khi khiến Visha không khỏi bật
    cười.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000085: locks: [''Giữ lời
    nhận lệnh sốt sắng của Grantz `“Rõ, thưa Trung úy! Ngài đừng bận tâm chuyện gì
    cả! Tất cả chúng tôi cho đến người cuối cùng sẽ bám trụ tới cùng trước kẻ địch
    đáng gờm này và chiến đấu đến cùng!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000086: locks: [''Giữ tên
    `Visha` ở câu trần thuật đầu và chính xác phạm vi chữ nghiêng ở câu độc thoại
    nội tâm thứ hai `*Có lẽ Trung úy Weiss thực sự đã say rồi nên đầu óc không còn
    nhạy bén như thường ngày nữa…*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000087: locks: [''Giữ câu
    cảm thán suồng sã khi say của Weiss với Grantz `“Ôi, chết tiệt! Tôi thật quá may
    mắn khi có một cấp dưới như cậu!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000088: locks: [''Giữ lời
    nhắc nhở lễ phép của Grantz `“Thưa Trung úy! Nếu ngài định đi gặp một quý cô thì
    theo tôi ngài nên giải rượu trước đã!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000089: locks: [''Giữ lời
    dặn lại cả nhóm đầy tính khẩu ngữ của Weiss `“Này! Ngày mai tất cả các cậu liệu
    mà say bết xê lết cho tôi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000090: locks: [''Giữ đại
    từ `anh` quy chiếu Weiss, chuỗi hành động bắt xe về căn cứ, tỉnh rượu dần trên
    đường, thay bộ `thường phục` và lập tức đến `sở chỉ huy tiểu đoàn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000091: locks: [''Giữ định
    danh `Văn phòng Bộ Tổng tham mưu`, thuật ngữ `lệnh ngừng bắn`, mức độ phỏng đoán
    (`biết đâu`, `rất có thể`, `có lẽ`) và việc làm rõ chủ thể `Thiếu tá` trong suy
    nghĩ của Weiss (`anh`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000092: locks: [''Giữ chi
    tiết hy vọng hơi thở không nồng nặc mùi rượu, câu xưng danh `“Trung úy Weiss xin
    phép có mặt.”`, hai định danh `Thiếu tá von Degurechaff` và `Thiếu úy Serebryakov`
    cùng chi tiết đeo `kính bay` và chuẩn bị sẵn hành lý.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000093: locks: [''Giữ giọng
    điệu của Tanya với `Trung úy` (`tôi` – `anh`), thuật ngữ `các sĩ quan tham mưu`,
    nhận định họ quá phấn khích đến mức chẳng buồn nghĩ tới chuyện kết thúc cuộc chiến
    và lời dặn Weiss quán xuyến mọi việc ở đây trong vài ngày.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000094: locks: [''Giữ lời
    đáp ngắn gọn chuẩn quân lệnh `“Rõ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000095: locks: [''Giữ đại
    từ `Anh` và danh xưng `Thiếu tá` trong câu `Anh sẽ là người phụ trách trong thời
    gian Thiếu tá vắng mặt.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000096: locks: [''Giữ đại
    từ `anh` ở câu đầu và câu cuối, cùng chính xác phạm vi chữ nghiêng ở câu độc thoại
    nội tâm thứ hai `*Vậy thì hẳn bây giờ Thiếu tá có điều gì đó quan trọng cần nói
    với mình.*` theo DEC-P01-002 và DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000097: locks: [''Giữ sự
    tương phản hài hước trong lời Tanya (`tôi` – `anh`, `Trung úy`): biết Weiss đang
    nghỉ phép, không ngờ anh cất công tới tận nơi khi chỉ cần một cuộc điện thoại
    là đủ, đoán anh lo nghĩ cho mình và xin lỗi vì đã làm gián đoạn bữa tiệc.'']'
  non_canon: true
