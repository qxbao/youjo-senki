task_id: vol-03-ch-03-b03
baseline_sha256: 413d8e97bf37519a87f7756eec9069fd4dfeb0a0157ef14983fa829063da049d
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: d8c39353e76b2283428d49fa8bc8c2dbcd72bf02197f4c627658a9676b5c2495
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi ngắn lễ phép của Visha: `“Thưa Thiếu tá?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000063: locks: [''Giữ tên
    `Visha`, đại từ `cô`, cụm `cấp trên của cô` (không dùng đại từ `cô` cho Tanya
    theo DEC-P01-001) và trạng thái thoáng bối rối chưa hiểu cấp trên đang thấy có
    vấn đề ở điểm nào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000064: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu hỏi xác nhận nguyên văn từ ngữ được dùng và cụm trích
    dẫn trong dấu nháy đơn `‘Sự kết thúc của cuộc chiến’`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000065: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `Tôi ... ạ` và lời xin lỗi của Visha vì không thấy những
    chữ đó được viết trong thông điệp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000066: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*...*` bao trọn ba câu độc thoại nội tâm đầu đoạn của Visha
    theo DEC-P01-002, ngôi `Mình` và danh xưng `Thiếu tá` trong nội tâm, cùng câu
    trần thuật cuối đoạn về việc `Thiếu tá von Degurechaff` điềm tĩnh hỏi thêm một
    câu nữa khi `Visha` đang hối hận vì sai sót ngớ ngẩn của mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000067: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `Cô`, định danh `Thiếu tướng de Lugo`, đại từ `Chúng`
    và hai câu hỏi liên tiếp: xác nhận mệnh lệnh của Thiếu tướng de Lugo và hỏi nơi
    quân địch đang rút lui về.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000068: locks: [''Giữ dấu
    ngoặc kép hội thoại, thán từ `A!`, lời xin thứ lỗi vì sự thiếu sót và thông tin
    quân địch hình như đang tập trung tại `Quân cảng Brest`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000069: locks: [''Giữ các
    định danh `Brest`, `Thiếu tướng de Lugo`, `Visha`, `Trận chiến sông Rhine`, hai
    phần độc thoại nội tâm đánh dấu `*...*` đúng phạm vi thẻ nhấn mạnh của nguồn theo
    DEC-P01-002, ngôi `mình / chúng ta` trong nội tâm của Visha và quy chiếu Tanya
    bằng `Thiếu tá / cấp trên`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000070: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh `Quân cảng Brest?`, `De Lugo…?`, ngôi `cô –
    tôi` và lời yêu cầu lấy giúp tấm bản đồ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000071: locks: [''Giữ cặp
    dấu gạch ngang dài `—...—`, quy chiếu `vị thiếu tá` (tránh dùng `cô` cho Tanya
    theo DEC-P01-001) và hành động của `Visha` lấy bản đồ trải rộng lên mặt bàn sao
    cho vị thiếu tá quan sát thật rõ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000072: locks: [''Giữ quy
    chiếu `cấp trên / người ấy` từ điểm nhìn của Visha và nhận xét rằng gương mặt
    khi lặng lẽ nhìn chằm chằm vào tấm bản đồ nghiêm túc đến mức sự bất cẩn dường
    như là một khái niệm hoàn toàn xa lạ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000073: locks: [''Giữ sự
    tương phản kịch tính: đúng lúc `Visha` định hỏi có nên mang cà phê vào không nếu
    việc này còn mất thêm một lúc thì `Thiếu tá von Degurechaff` nện mạnh nắm đấm
    xuống bàn rồi đứng phắt dậy, toàn thân run lẩy bẩy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000074: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu ba chấm đầu câu, tiếng chửi `…Khốn kiếp!`, cụm mắng mỏ
    `Cái lũ đầu đất khổng lồ này!` và câu hỏi cảm thán kết thúc bằng `?!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000075: locks: [''Giữ dấu
    ngoặc kép hội thoại và nét lắp bắp sững sờ của Visha: `“Th-Thưa Thiếu tá?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000076: locks: [''Giữ dấu
    ngoặc kép hội thoại, các dấu gạch ngang dài `—`, sự phân biệt rõ danh xưng `Thiếu
    úy!` (gọi Visha ở đầu câu) với `Trung úy Weiss` (ở cuối câu), định danh khí tài
    `V-1`, ngôi `Chúng ta / tôi` và chuỗi mệnh lệnh khẩn cấp chuẩn bị xuất kích, đưa
    toàn bộ số V-1 ra đường băng ngay lập tức và gọi Trung úy Weiss tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000077: locks: [''Giữ hình
    ảnh vẻ dữ tợn trên gương mặt cùng chất giọng đanh gọn chói gắt của cấp trên không
    chừa khoảng trống nào để thắc mắc về mệnh lệnh, và nhận thức rõ hơn ai hết của
    `Visha` rằng làm trái ý `Thiếu tá von Degurechaff` những lúc thế này sẽ ngu ngốc
    đến nhường nào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000078: locks: [''Giữ đại
    từ `cô` (Visha), định danh `Trung úy Weiss`, đại từ `anh`, cụm `các nhà chứa V-1`
    và trình tự hành động: chào điều lệnh, xác nhận mệnh lệnh rồi chạy vụt đi, báo
    cho Trung úy Weiss biết anh đang được triệu tập khẩn cấp, sau đó chạy thẳng tới
    các nhà chứa V-1 để chuẩn bị đưa chúng vào trạng thái sẵn sàng triển khai.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000079: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu chào điều lệnh ngắn gọn khi bước vào phòng: `“Xin phép.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000080: locks: [''Giữ hai
    phần hội thoại kẹp giữa câu trần thuật, các định danh `Phó chỉ huy`, `Tanya`,
    `Trung úy Weiss`, `Brest`, `Cộng hòa`, thuật ngữ `tấm hải đồ`, `lệnh ngừng bắn`,
    đại từ trần thuật `nó` cho Tanya theo DEC-P01-001, cặp xưng hô `tôi – anh / Chúng
    ta` trong thoại và nhận định của Tanya rằng hạm đội địch tập trung ở Brest thực
    chất là đang bí mật đào thoát chứ không đơn thuần rút quân theo lệnh ngừng bắn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000081: locks: [''Giữ nhận
    định thẳng thừng của Tanya rằng trò mà quân địch đang giở chắc chắn không lẫn
    đi đâu được chính là `một vụ Dunkirk`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000082: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `Chúng / chúng ta`, ý định rút những tổ chức quân sự
    còn sót lại ra ngoài để tiếp tục chiến đấu của địch và cảnh báo nếu không đánh
    bại chúng tại đây thì cuộc chiến sẽ không kết thúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000083: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách thưa `Thưa Thiếu tá, với tất cả sự kính trọng`, thuật
    ngữ `lệnh ngừng bắn` sẽ được tuyên bố vào tối nay và câu bỏ lửng bằng dấu ba chấm
    `…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000084: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Trung úy`, ngôi `chúng ta` và lập luận đanh thép
    của Tanya: ngừng bắn không đồng nghĩa với kết thúc chiến tranh mà là chuyện hoàn
    toàn khác hẳn, và tính đến thời điểm hiện tại họ vẫn đang trong tình trạng chiến
    tranh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000085: locks: [''Giữ câu
    độc thoại nội tâm in nghiêng `*Hẳn là anh ta không hiểu rồi.*` theo DEC-P01-002,
    tên `Weiss`, đại từ `nó` quy chiếu Tanya theo DEC-P01-001 và cảm giác ức chế đến
    mức không thể tin nổi trước sự dè dặt thong thả của Weiss đối với mệnh lệnh tấn
    công.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000086: locks: [''Giữ điệp
    cấu trúc ba câu mở đầu bằng `Chúng ta không thể...`, cụm `để bị vố Dunkirk`, định
    danh `de Lugo` kẹp giữa cặp dấu gạch ngang dài `—de Lugo—`, đại từ `hắn` và bước
    tự đính chính nhấn mạnh sau dấu gạch ngang dài: `Không—chúng ta sẽ chẳng thể nào
    kết thúc nổi nó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000087: locks: [''Giữ quan
    hệ hệ quả tăng tiến: nếu chuyện đó xảy ra thì con đường phía trước sẽ dẫn tới
    một bãi lầy, và lối thoát duy nhất khỏi đó chỉ có sự hủy diệt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000088: locks: [''Giữ sự
    phân biệt đại từ theo DEC-P01-001 (`Nó` trong câu trần thuật, `mình` trong câu
    độc thoại nội tâm về chủ sử dụng lao động bị phá sản), định danh `Lục quân Đế
    quốc`, thuật ngữ `chiến tranh tổng lực`, hình ảnh bị vắt kiệt sức như thân trâu
    ngựa, và dấu nhấn mạnh chữ nghiêng `*Do đó*` ở câu kết đoạn theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000089: locks: [''Giữ dấu
    ngoặc kép hội thoại và tiếng ngập ngừng phản bác ngắn gọn của Weiss: `“Nhưng…”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000090: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Trung úy`, đại từ `anh` và lời chốt hạ của Tanya:
    hồ sơ sẽ ghi nhận rằng Weiss đã nêu ý kiến phản đối, còn giờ thì phải hành động,
    chỉ có hành động mà thôi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000091: locks: [''Giữ ngôi
    `Họ / chúng ta / Mình`, cụm `bị vố Dunkirk` và quyết tâm sẵn sàng hủy hoại sự
    nghiệp quân ngũ của mình nếu việc đó ngăn không cho họ bị vố Dunkirk.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000092: locks: [''Giữ tên
    `Tanya`, đại từ `nó` theo DEC-P01-001, các thuật ngữ `trinh sát chiến đấu`, `lệnh
    ngừng bắn`, định danh `Bộ Tổng tham mưu` và lập luận: dù thông báo chung về lệnh
    ngừng bắn sắp tới là một trở ngại đáng kể, nhưng vì đơn vị của nó báo cáo trực
    tiếp lên Bộ Tổng tham mưu nên họ hẳn phải có thẩm quyền phê chuẩn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000093: locks: [''Giữ đại
    từ `Nó` (trần thuật) và `chúng ta / mình` (nội tâm kết đoạn) theo DEC-P01-001,
    các cụm `một trung đội pháp sư`, `trinh sát sĩ quan`, `Chế độ im lặng vô tuyến`,
    `V-1`, `de Lugo`, `tàu chiến chủ lực` và tính toán tận dụng chế độ im lặng vô
    tuyến trong những quả V-1 bay ở tốc độ tối đa làm cái cớ hoàn hảo để chí ít cũng
    giết được de Lugo cùng tàu chiến chủ lực của hắn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000094: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu báo cáo khẩn trương của Visha khi quay lại: `“Xin phép
    Thiếu tá!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000095: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi ngắn gọn của Tanya: `“Đơn vị đã sẵn sàng chưa?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000096: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách thưa `Vâng, ... Thiếu tá ạ` và thông tin `ban chỉ huy
    căn cứ` đang gọi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000097: locks: [''Giữ câu
    mở đầu chuyển cảnh mới: ngay cả khi chuyện đó đang diễn ra ngay trước mắt họ,
    bất kỳ `người lính Đế quốc` hiểu chuyện nào cũng sẽ thấy thật khó tin.'']'
  non_canon: true
