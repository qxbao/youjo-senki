source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: f9f74a3a80eb0cc5dd1533599b64c79e3d70fd5ccf476ccd9ebd3cb297008f20
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682: locks: [''Giữ sự
    tương phản giữa “hỏa lực phòng không” vốn thường ngày đáng sợ với thực tế yếu
    ớt tới mức đáng thương, cùng các định danh “Pháo phòng không”, “Tanya”, “Tiểu
    đoàn Pháp sư Trên không số 203” và phủ định “chẳng phát hiện ra nổi lấy một khẩu”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000683: locks: [''Giữ cụm
    “Đám đầu đất Cộng hòa đó”, hai phỏng đoán song song về lý do không lắp đặt đại
    bác trong thành phố, định danh “Tanya”, đại từ trần thuật “nó” theo DEC-P01-001
    và kết luận “hỏa lực phòng không của địch cực kỳ yếu ớt”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000684: locks: [''Giữ đối
    lập giữa việc chỉ bắt gặp “vài khẩu súng máy 40 mm” với phủ định “Chẳng có khẩu
    pháo 127 mm đáng gờm nào cả.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000685: locks: [''Giữ phủ
    định về sự vắng bóng “pháo hạng nặng” (mục tiêu hàng đầu của các pháp sư), chi
    tiết hỏa lực mạnh nhất thấy được là “một khẩu sơn pháo lỗi thời”, thứ rắc rối
    nhất là “súng cối được trang bị cho bộ binh” và kết luận tương đối ít pháo binh
    địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000686: locks: [''Giữ lập
    luận trong “cận chiến”, “pháo hạng nặng” có nguy cơ “bắn nhầm quân mình” quá cao
    nên hỏa lực mạnh nhất lính bộ binh dùng được là “súng cối”, dấu chấm lửng và kết
    luận đạo ngược “chẳng còn gì khác phải lo ngại cả”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000687: locks: [''Giữ nhận
    định đối với một pháp sư thì chừng đó hỏa lực không đủ cấu thành mối đe dọa và
    điều kiện “Chừng nào họ còn ở trên không, thứ đó chẳng thể làm gì được họ cho
    cam.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000688: locks: [''Giữ dấu
    ngoặc kép hội thoại, mẫu gọi vô tuyến “Fairy 03 gọi tất cả các đơn vị.” và cảnh
    báo chú ý “đường bắn của pháo binh”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000689: locks: [''Giữ đúng
    hai cụm chữ nghiêng `*Thực tình*` và `*điều tệ nhất có thể xảy đến với chúng ta
    lúc này là bị chính pháo của phe mình nhận nhầm thành quân địch.*` theo DEC-P01-002,
    mệnh đề trần thuật phẳng “Tanya càu nhàu trong đầu” và câu kết chữ thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000690: locks: [''Giữ sự
    chuyển đổi điểm nhìn từ câu độc thoại ngôi thứ nhất (“Mình chẳng muốn bị mấy khẩu
    180 mm của phe mình thổi bay đâu.”) sang câu trần thuật ngôi thứ ba (“Tanya”,
    “nó” theo DEC-P01-001) về việc ở trong vùng an toàn nhưng vẫn bay cao hơn để phòng
    hờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000691: locks: [''Giữ đại
    từ trần thuật “nó” ở câu đầu và đại từ nội tâm “Mình” ở câu cuối theo DEC-P01-001,
    chi tiết tầm nhìn tuyệt vời hầu như không có mây, cùng các định danh “pháp sư
    Đế quốc”, “tuyến Rhine”, “quân Cộng hòa” và “sơn pháo 80 mm”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000692: locks: [''Giữ đối
    sánh tầm bắn giữa “pháo 180 mm” và “pháo 80 mm”, các đại từ “mình / Chúng ta”
    theo DEC-P01-001 và nhận định áp đảo về tầm bắn theo đúng nghĩa đen khiến mọi
    chuyện khá dễ dàng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000693: locks: [''Giữ sự
    đối lập giữa “nhiệm vụ tấn công mặt đất” với “nhiệm vụ ném bom”, đại từ “chúng
    ta” và chi tiết bọc giáp nặng làm cơ thể nặng nề hơn nhưng buộc phải ráng chịu
    đựng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000694: locks: [''Giữ đại
    từ “chúng ta”, định danh “Lục quân Cộng hòa” và kế hoạch dự phòng nếu việc chỉ
    điểm cho pháo binh quá nguy hiểm thì sẽ ném hàng tấn lựu đạn lên đầu bộ binh dưới
    đất rồi lao vào đánh giáp lá cà.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000695: locks: [''Giữ các
    đại từ “chúng ta / mình” theo DEC-P01-001, thuật ngữ “lựu đạn chày”, dấu gạch
    ngang và lập luận không thể vứt bỏ đạn dược mua bằng tiền ngân sách quốc gia chỉ
    vì nặng kèm giả định viện cớ cần nhẹ người hơn để cận chiến với pháp sư địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000696: locks: [''Giữ quan
    hệ nhân quả vì không có pháp sư địch nào xuất hiện nên “chúng ta” chẳng có việc
    gì làm ngoài quan sát cho pháo binh trong lúc mang vác toàn bộ đống đồ nặng trịch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000697: locks: [''Giữ dấu
    chấm lửng mở đầu, định danh “Tướng von Rudersdorf” và câu hỏi nghi vấn về việc
    phán đoán sai tình hình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000698: locks: [''Giữ dấu
    ngoặc kép hội thoại, mẫu gọi vô tuyến “Fairy 01 gọi HQ.”, đại từ “Chúng tôi” và
    ba thông báo ngắn: đã chiếm lĩnh không phận được chỉ định, không có sự kháng cự,
    không thấy bóng dáng pháp sư địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000699: locks: [''Giữ các
    định danh “Lục quân Đế quốc”, “Parisii”, đại từ “chúng ta” và câu điều kiện nếu
    thực sự có thể tiến thẳng vào Parisii mà không vấp phải sự kháng cự nào thì hẳn
    có điều gì đó bất thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000700: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*chút ít*` đúng phạm vi `<html:em>` theo DEC-P01-002 và
    nỗi băn khoăn tại sao địch không tập hợp toàn bộ binh lực còn lại để dốc sức kháng
    cự quy mô lớn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000701: locks: [''Giữ đại
    từ “chúng ta”, dấu chấm than ở câu đầu, cấu trúc tăng tiến “không chỉ ngoài dự
    kiến, mà còn thật chẳng thể tin nổi” và suy luận nơi này trống trải đến mức nghi
    ngờ bị nhử vào bẫy nghe còn thực tế hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000702: locks: [''Giữ câu
    phủ định khái quát “Chẳng có điều gì trong chuyện này giống với những gì người
    ta thường dự tính cả.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000703: locks: [''Giữ đại
    từ “chúng ta”, các thuật ngữ “trinh sát chiến đấu”, “tuyến Rhine” và mối liên
    hệ nhân quả vì pháp sư rất dễ ẩn mình phục kích nên mới phải trinh sát chiến đấu
    trên tuyến Rhine nhằm lôi cổ họ ra khỏi sào huyệt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000704: locks: [''Giữ các
    đại từ “chúng ta / mình” theo DEC-P01-001, định danh “Parisii”, dấu chấm lửng,
    sự tương phản kể cả khi không có biện pháp dễ thấy như “pháo phòng không” thì
    chí ít cũng phải có một số pháp sư, và chi tiết nghe thấy mọi người cảnh báo về
    khả năng có phục kích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000705: locks: [''Giữ cấu
    trúc giả định “Nếu Lục quân Cộng hòa mà tìm cách bay qua bầu trời thủ đô Đế quốc,
    hẳn sẽ có một màn đánh chặn dữ dội vô cùng.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000706: locks: [''Giữ đại
    từ “Chúng ta” và kỳ vọng khu vực này sẽ sẵn sàng phủ kín bầu trời bằng “hỏa lực
    chống pháp sư” đủ sức xuyên thủng cả “lớp vỏ phòng thủ” lẫn “màn chắn bảo hộ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000682
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000707: locks: [''Giữ định
    danh “tuyến Rhine”, “quân Cộng hòa”, các đại từ “chúng ta / mình”, phủ định “chẳng
    có lấy một quả đạn pháo nào bắn về phía mình” và suy luận loại trừ “Trừ phi đại
    đa số quân địch đều là tín đồ của chủ nghĩa kháng cự thụ động, bằng không thì
    hẳn là họ căn bản không có mặt ở đây.”.'']'
  non_canon: true
