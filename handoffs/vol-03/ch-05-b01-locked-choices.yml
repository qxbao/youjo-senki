choices:
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002: locks: [''Giữ tiêu
    đề phân cảnh viết hoa toàn bộ: `TẠI MỘT CHIỀU KHÔNG GIAN NỌ, MỘT CÕI TỒN TẠI NỌ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000003: locks: [''Giữ cách
    gọi `Thực thể ở nơi đó` và trạng thái `run lên vì sung sướng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000004: locks: [''Giữ tiếng
    cười cảm thán trong ngoặc kép: `“Hô hô hô. Tuyệt vời làm sao!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000005: locks: [''Giữ đại
    từ `Ông ta`, cấu trúc tự đính chính `suýt chút nữa đã buột miệng... Không, ông
    ta đã làm thế thật.`, các tôn xưng `Chúa`, `Đấng toàn năng` và tiếng hô `hallelujah`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000006: locks: [''Giữ phủ
    định `chẳng một ai ở nơi này lại trách cứ ông ta`, sự đối lập `Đúng hơn là họ
    sẽ cùng hòa giọng hưởng ứng.`, cụm `những tạo vật của Đấng ấy`, phép so sánh `thông
    tuệ ngang ngửa Quái vật Spaghetti` và ký hiệu chú thích `⁸`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000007: locks: [''Giữ câu
    hỏi lễ phép của cấp dưới trong ngoặc kép: `“Thưa ngài Cherub, có chuyện gì xảy
    ra sao ạ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000008: locks: [''Giữ danh
    xưng `Tổng lãnh thiên thần`, ngôi tự xưng `Ta`, đại từ trần thuật `ông ta`, thuật
    ngữ `vòng sinh tử` và chính xác phạm vi chữ nghiêng `*Homo sapiens*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000009: locks: [''Giữ chính
    xác hai cụm chữ nghiêng `*Quả là một tin tức tuyệt vời*` và `*Homo sapiens*` theo
    DEC-P01-002, cách gọi `vị cherub` cùng chi tiết báo cáo tích cực đầu tiên sau
    một thời gian khá dài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000010: locks: [''Giữ cách
    quy chiếu `vị tổng lãnh thiên thần` – `anh ta`, tôn xưng `Đấng Vĩ Đại` và hình
    ảnh khúc thánh ca gần như trào dâng từ tận đáy lòng và toàn bộ bản thể.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000011: locks: [''Giữ câu
    tán tụng in nghiêng toàn đoạn `*Hỡi Thượng đế, Đấng Tạo Hóa, Ngài thật vĩ đại.*`
    theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000012: locks: [''Giữ lời
    thoại chuyển hướng ngập ngừng kèm dấu gạch ngang: `“Chuyện đó quả thực rất tốt
    đẹp. Nhưng lạ thật—khoan đã.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000013: locks: [''Giữ cách
    quy chiếu `vị tổng lãnh thiên thần`, thuật ngữ `vòng sinh tử` và câu giả định
    điều kiện `Nếu lời kêu gọi của họ đối với con người đã phát huy hiệu quả, thì
    rốt cuộc họ sẽ có thể dẫn dắt linh hồn của loài người.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000014: locks: [''Giữ cách
    quy chiếu `vị tổng lãnh thiên thần` – `Anh ta` – `mình` và cảm giác vừa nghe thấy
    một chuyện khác hẳn mới cách đây ít lâu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000015: locks: [''Giữ tôn
    xưng `Đấng Nhất Thể Vạn Hữu`, sự khoan dung bên ngoài tôn ti trật tự chức phận,
    việc được phép thắc mắc lại lời của một thực thể cấp trên và dấu ba chấm cuối
    đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000016: locks: [''Giữ điều
    kiện `Chừng nào vị tổng lãnh thiên thần còn đang thực thi công việc thiêng liêng`,
    cách gọi `vị cherub` và nghĩa vụ phải hỏi bất cứ điều gì chưa hiểu rõ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000017: locks: [''Giữ câu
    hỏi `“Hửm? Có chuyện gì không ổn sao?”` và nhận định `Và vị cherub cũng có nghĩa
    vụ phải trả lời.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000018: locks: [''Giữ phủ
    định `là điều không thể tha thứ` và yêu cầu khắc phục bất kỳ và mọi trở ngại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000019: locks: [''Giữ cách
    quy chiếu `vị cherub` – `ông ta`, thái độ lịch sự đầy thiện ý với chất giọng dịu
    dàng và mục tiêu hợp tác trong cuộc đấu tranh vì vinh quang của Chúa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000020: locks: [''Giữ câu
    trần thuật ngắn gọn: `Cả hai người họ đều chỉ có ý tốt.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000021: locks: [''Giữ ngôi
    tự xưng `Tôi` và nội dung thông báo: `“Tôi nghe nói những kẻ vô thần tà ác đã
    tràn ngập thế giới của họ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000022: locks: [''Giữ quan
    hệ nhân quả `Đó là lý do họ phải đứng lên và dũng cảm đương đầu với cái ác.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000023: locks: [''Giữ câu
    khẳng định ngắn: `Đó là bổn phận thiêng liêng của họ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000024: locks: [''Giữ phủ
    định `Chẳng có chuyện gì như thế đang xảy ra trong địa hạt phụ trách của ta cả.`,
    thuật ngữ `địa hạt phụ trách` / `địa hạt` và cặp xưng hô `ta` – `Cậu` trong câu
    hỏi của vị cherub.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000025: locks: [''Giữ các
    danh xưng `vị tổng lãnh thiên thần`, `vị cherub` và phủ định `chưa từng nghe nói
    tới`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000026: locks: [''Giữ đại
    từ `ông ta`, tôn xưng `Thượng đế` và sự khẳng định `chắc chắn đang bắt đầu cảm
    nhận được sự hiện diện của Thượng đế`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000027: locks: [''Giữ đại
    từ `ngài`, cụm `các tạo vật của ngài` và tôn xưng `Đức Cha toàn năng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000028: locks: [''Giữ cách
    quy chiếu `vị cherub` – `ông ta`, hai cấu trúc phủ định (`chẳng có điều gì khiến
    ông ta hạnh phúc hơn thế`, `không vì bất kỳ mục đích nào khác ngoài việc này`)
    và thuật ngữ tiếng Pháp in thẳng `raison d’être`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000029: locks: [''Giữ câu
    trần thuật ngắn: `Đó là lý do vì sao ông ta mỉm cười hạnh phúc.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000030: locks: [''Giữ các
    cụm `thói cục bộ đáng ghét`, `cái ác khủng khiếp mang danh thiện ý của chủ nghĩa
    vô thần`, ẩn dụ `những chú cừu non` và nỗi đau đớn như muốn nổ tung trong tim
    vị cherub.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000031: locks: [''Giữ cụm
    `những kẻ vô thần đang hoành hành`, thuật ngữ `địa hạt phụ trách` và hình ảnh
    bóng tối phủ lên gương mặt tuyệt mỹ của ông ta.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000032: locks: [''Giữ câu
    chuyển đoạn độc lập: `Bởi vậy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000033: locks: [''Giữ đại
    từ `ông ta`, động cơ `Xuất phát từ lòng tốt vô bờ bến và ý thức trách nhiệm` và
    mệnh đề giả định bỏ lửng `Nếu một bi kịch khủng khiếp nhường ấy đang diễn ra…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000034: locks: [''Giữ ngôi
    tự xưng `Ta`, thiện ý muốn hỗ trợ và câu hỏi `Có ai biết đó là địa hạt phụ trách
    của ai không?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000035: locks: [''Giữ đại
    từ `Ông ta` – `mình` và ý định `phải đưa tay ra giúp đỡ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000036: locks: [''Giữ thán
    từ `Than ôi`, ngôi tự xưng `ta` và lời thú nhận `đó chính là địa hạt của ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000037: locks: [''Giữ cấu
    trúc tự đính chính `Suy cho cùng, đó là công việc của họ với tư cách là những
    người dẫn đường. Không, đó là bổn phận thiêng liêng của họ với tư cách là những
    tạo vật của Chúa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000038: locks: [''Giữ câu
    hỏi tu từ kết hợp giả định phủ định ở câu đầu, hình ảnh `những chú cừu non lạc
    lối`, cụm `người dẫn đường` và thuật ngữ tiếng Pháp in thẳng `raison d’être` ở
    cuối đoạn.'']'
  non_canon: true
