choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227: locks: [''Giữ đại
    từ `ông ta` / `mình` và cụm thuật ngữ `thống nhất hệ thống chỉ huy` nối tiếp trực
    tiếp từ cuối B07.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000228: locks: [''Giữ câu
    hỏi mở đầu cuộc họp của de Lugo: `“Được rồi, tình hình bên ta hiện sao rồi?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000229: locks: [''Giữ sắc
    thái nhượng bộ `Tuy có bị dồn vào chân tường, nhưng Cộng hòa vẫn vừa vặn đủ sức
    được tính là một cường quốc`, nỗ lực lật ngược thế cờ ở `các thuộc địa`, và việc
    giữ được `bộ khung của một đạo quân` ở `bộ tham mưu`, `vị tướng` cùng `những người
    lính dày dạn kinh nghiệm`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000230: locks: [''Giữ nhận
    định các sĩ quan có kinh nghiệm thực chiến hoàn toàn đủ năng lực đảm đương việc
    `phân tích dữ liệu cần thiết` và `lập kế hoạch tác chiến`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000231: locks: [''Giữ giả
    định tàn sát `hai sư đoàn của Đế quốc` nếu giao chiến chính diện đàng hoàng, tầm
    quan trọng của việc lập kế hoạch giao chiến theo cách đó đối với `de Lugo`, và
    dữ kiện `Tướng địch Romel` đã tiêu diệt các lực lượng của `Khối Thịnh vượng chung`
    bằng `những trận đánh cơ động` đầy bất ngờ trước cả khi họ kịp tập kết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000232: locks: [''Giữ kết
    luận chung rằng việc `phân tán lực lượng tiến quân để giao chiến` sẽ là hành động
    liều lĩnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000233: locks: [''Giữ lập
    luận hậu cần sa mạc: khó di chuyển một `đạo quân tập trung`, `nguồn tiếp tế` là
    yếu tố hạn chế lớn, nguồn nước phải được ưu tiên hơn mọi thứ khác, thiếu hụt một
    lần cũng thành `khủng hoảng tiếp tế`, và phép đối sánh `Binh lính không có dầu
    cùng lắm chỉ phải cuốc bộ, nhưng binh lính không có nước sẽ chết khát`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000234: locks: [''Giữ đối
    lập với `lực lượng Đế quốc—chỉ có một quân đoàn—có lẽ đủ khả năng cùng nhau tiến
    quân`, việc ít người hơn giúp vấn đề nước uống dễ xoay xở hơn, và câu khẳng định
    phỏng đoán `Chắc chắn phải là như vậy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000235: locks: [''Giữ dự
    tính của `de Lugo` rằng nếu chia lẻ ra tiến quân, `quân Đế quốc` sẽ tiêu diệt
    sạch toàn bộ bọn họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000236: locks: [''Giữ lời
    báo cáo: `“Mọi việc đều đang diễn ra đúng kế hoạch. Lục quân Đế quốc đang bắt
    đầu di chuyển.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000237: locks: [''Giữ lý
    do `ông ta` làm rùm beng chuyện giành lại phần lãnh thổ đã mất vì nghi ngờ khả
    năng giữ bí mật của đám tướng lĩnh kia, cùng hành động tập kết vật tư tiếp tế
    và khảo sát nhiều tuyến đường để tạo ảo tưởng về nước đi ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000238: locks: [''Giữ phủ
    định kép `Lực lượng Đế quốc tuyệt nhiên không hề bất tài`, việc họ hiểu `quân
    Cộng hòa` muốn đánh chiếm căn cứ, và thông tin tình báo qua phía `Khối Thịnh vượng
    chung` rằng chúng đã bắt đầu xây dựng `các tuyến phòng thủ` ở `Turus`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000239: locks: [''Giữ câu
    nhận định tình hình cho thấy kẻ địch đã nghĩ đúng như những gì `de Lugo` muốn
    chúng nghĩ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000240: locks: [''Giữ lời
    cảm thán ngắn gọn: `“Vậy thì tốt lắm!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000241: locks: [''Giữ chính
    xác từ in nghiêng ở đầu đoạn theo `DEC-P01-002`: `*Nhưng…* Ông ta nhếch môi cười.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000242: locks: [''Giữ chi
    tiết mọi người có mặt đáp lại bằng ánh mắt đầy toan tính và việc cục diện này
    chính xác là điều họ đang nhắm tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000243: locks: [''Giữ danh
    xưng `Tướng von Romel`, đại từ `ông`, cụm `hồ sơ chiến tích`, định danh `chuyên
    gia hàng đầu về chiến tranh cơ động trong thế hệ của mình`, và sự tán thưởng của
    `de Lugo` dù ông là kẻ địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000244: locks: [''Giữ cụm
    `trận đánh cơ động trên sa mạc`, `chia mũi tiến quân đúng thời điểm giữa biển
    cát`, và bảo toàn chính xác phạm vi in nghiêng theo `DEC-P01-002` tại cụm `vị
    trí của *chính mình*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000245: locks: [''Giữ đại
    từ `ông` cho Romel, cụm `hiệu quả tổ chức của ông cao đến mức khiến de Lugo phát
    ốm`, và kết luận đối đầu trực diện là quá mạo hiểm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000246: locks: [''Giữ phân
    tích thế trận: thành phố nằm ở cửa vịnh không thể phòng thủ nếu bị bao vây, ngay
    cả một đứa trẻ cũng biết không nên dùng `một quân đoàn` duy nhất đối đầu với toàn
    bộ `quân Cộng hòa` trên `lục địa phía nam`, và sự cần thiết phải giải quyết tình
    thế này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000247: locks: [''Giữ nhận
    định những quân nhân có năng lực của `quân đội Đế quốc` sẽ có một vài ý tưởng
    dù không nhiều, ví dụ phương án rút quân về `lãnh thổ Ildoa` nếu không cảm thấy
    cần phải tử thủ bảo vệ căn cứ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000248: locks: [''Giữ chính
    xác từ in nghiêng `*Nhưng.*` ở đầu đoạn theo `DEC-P01-002`, chi tiết `De Lugo
    thầm mỉm cười`, và lý do `Lục quân Đế quốc` là một `lực lượng viễn chinh` nên
    muốn rút lui cũng bắt buộc phải giữ được `các cơ sở cảng biển` duy nhất dùng được
    lúc này ở `Turus`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000249: locks: [''Giữ phương
    án rút lui về `Vương quốc Ildoa` và đánh giá phương án đó là không thể chấp nhận
    được về mặt chính trị.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000250: locks: [''Giữ kết
    luận tấn công các đơn vị trước khi kịp tập kết là nước đi duy nhất của `Lục quân
    Đế quốc`, cụm `kịch bản chuẩn mực theo sách giáo khoa`, việc huy động toàn bộ
    sức chiến đấu để giành `ưu thế quân số cục bộ` tấn công `các đơn vị Cộng hòa`
    đang chia lẻ tiến quân, và thuật ngữ `thiết lập được thế phòng ngự cơ động`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000251: locks: [''Giữ câu
    nhận định: `Đó ắt hẳn là lời giải tốt nhất mà Romel có được.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000252: locks: [''Giữ kết
    luận chiến thuật của `de Lugo`: không cử từng đơn vị riêng lẻ ra nộp mạng mà ngược
    lại, `Ông ta` sẽ nhử kẻ địch ra khỏi hang ổ, áp đảo bằng một lực lượng lớn rồi
    nghiền nát chúng.'']'
  non_canon: true
