choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000002
  kind: locked_constraint
  value: Giữ định dạng tiêu đề in hoa toàn bộ “NGÀY 24 THÁNG 5, NĂM THỐNG NHẤT 1925,
    ARKANSAS, HỢP CHÚNG QUỐC”, không thêm dấu nhấn mạnh.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000003
  kind: locked_constraint
  value: Giữ địa danh “Arkansas”, sự phân biệt chủ thể giữa “cô bé” và “người bà yêu
    quý của mình”, cùng hành động “chìa ra một túi táo đỏ tươi”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000004
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp xưng hô “bà – cháu”, đại từ gộp “mình” và
    câu hỏi về chỗ để số táo hàng xóm cho.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000005
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, tên riêng “Mary”, “Carlos”, câu hỏi “lại thêm
    táo nữa sao?” và tình thái suy đoán “Hẳn là vợ ông Carlos quý cháu lắm đấy.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000006
  kind: locked_constraint
  value: Giữ sự phân biệt chủ thể giữa “bà lão” và “Đứa cháu gái” / “cô bé”, thuật
    ngữ “Thượng đế” và nội dung tạ ơn vì cô bé được nuôi dạy thành một đứa trẻ nhân
    hậu, biết quan tâm.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000007
  kind: locked_constraint
  value: Giữ các chủ thể “Những người hàng xóm”, “cháu gái bà” / “cô bé” và “người
    bố”, quan hệ nhượng bộ về việc đang ở cùng gia đình nhưng vẫn là nơi đất khách
    quê người, việc phải để bố ở lại phía sau và chi tiết chinh phục cả những người
    khó tính nhất bằng nụ cười tươi tắn.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000008
  kind: locked_constraint
  value: Giữ cấu trúc phủ định “đã đủ lớn để không còn vô tư trước những chuyện đang
    diễn ra xung quanh mình”, ý cố gắng làm cả gia đình vui lên và quan hệ tương ứng
    “rất tự hào về cháu mình vì điều đó, nhưng cũng chính vì thế mà bà lại thấy hoàn
    cảnh của cô bé thật đáng thương”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000009
  kind: locked_constraint
  value: Giữ chủ thể “người bà” / “bà”, hành động đứng lên rủ cháu cùng nướng bánh
    táo để giữ bầu không khí nhẹ nhàng và cấu trúc phủ định hạn định “Việc không thể
    làm gì khác ngoài lo lắng trước tình cảnh bi đát của cuộc xung đột chỉ càng khiến
    bà thêm bức bối.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000010
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng câu ước nguyện nội tâm mở đầu `*Giá
    mà cuộc chiến tàn khốc này sớm kết thúc cho rồi…*` theo DEC-P01-002, mệnh đề mục
    đích phủ định “để Mary không nhận ra”, sự phân biệt chủ thể giữa “Bà lão” / “bà
    của Mary” với “cô con gái đang đau buồn của mình” đang dán mắt vào đài phát thanh
    và tờ báo trong phòng khách.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000011
  kind: locked_constraint
  value: Giữ mốc thời gian “Kể từ khi”, các định danh “giấy báo tử”, “Anson”, “Liên
    minh Entente”, “Mary” và quan hệ nhân vật giữa người bà, con rể Anson và mẹ của
    Mary.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000012
  kind: locked_constraint
  value: Giữ tên riêng “Anson”, quan hệ đối lập giữa việc hai người từng không ít
    lần xung đột nảy lửa nhưng rốt cuộc vẫn hòa hợp rất tốt, chi tiết bức ảnh đôi
    vợ chồng hạnh phúc gợi nhắc rằng Anson đã không còn nữa và nỗi tự trách của bà
    lão vì đã quên không cất nó đi.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000013
  kind: locked_constraint
  value: Giữ các định danh “Hợp chúng quốc”, “Liên minh Entente”, “Anson”, phủ định
    “tin tức sẽ chẳng thể đến nhanh được”, tình thái suy đoán “hẳn bà đã mất cảnh
    giác” và phủ định “nhưng chưa bao giờ tưởng tượng nổi chuyện Anson sẽ tử trận”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000014
  kind: locked_constraint
  value: Giữ quan hệ nguyên nhân “Và đó là lý do”, cụm “giấy báo tử” và việc bà cứ
    mãi nhớ lại ngày nhận tin cùng cảm giác bàng hoàng lúc ấy.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000015
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Một thông báo ư? Gửi cho
    nhà mình sao?*` theo DEC-P01-002 cùng đúng độ mở và đối tượng của hai câu hỏi
    nội tâm.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000016
  kind: locked_constraint
  value: Giữ chủ ngữ quy chiếu “Nó” (tờ thông báo) và phép so sánh “vào một ngày nắng
    đẹp yên bình hệt như hôm nay”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000017
  kind: locked_constraint
  value: Giữ sự phân biệt giữa ba chủ thể “Con gái bà lão” (bắt đầu mỉm cười trở lại,
    dường như khuây khỏa hơn sau khi về quê nhà), “cô cháu gái” (chạy nhảy khắp vùng
    đất xa lạ trong niềm tò mò háo hức) và “Bà lão” (mỉm cười dõi theo hai mẹ con).
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000018
  kind: locked_constraint
  value: Giữ mốc thời điểm “đúng lúc bà đang gọi hai mẹ con vào dùng trà chiều lúc
    ba giờ” và chủ ngữ “Tin dữ”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000019
  kind: locked_constraint
  value: Giữ định danh “Liên minh Entente”, chi tiết viên chức từ đại sứ quán bước
    xuống xe, lý do con gái bà ra đón thay để bà đỡ đau lưng, sự hối hận phủ định
    “vì mình không lên tiếng bảo” và dấu nhấn mạnh chữ nghiêng chỉ ở đúng phần lời
    nói giả định cuối câu `*“Để mẹ ra cho. Thi thoảng mẹ cũng muốn trò chuyện với
    khách khứa một chút.”*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000020
  kind: locked_constraint
  value: Giữ cấu trúc và thời gian của giả định trái thực tế trong quá khứ “Giá mà
    làm vậy, bà thậm chí đã có thể nhận lấy chiếc phong bì mà ông ta đưa ra bằng đôi
    tay run rẩy cùng vẻ mặt căng thẳng, rồi đem giấu nhẹm đi đâu đó.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000021
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại và câu cảm thán phủ định “Ôi Chúa ơi! Không!”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000022
  kind: locked_constraint
  value: Giữ quan hệ đối lập “Nhưng thay vào đó”, các chủ thể “bà và Mary”, “con gái
    bà” (khuỵu xuống đất đầm đìa nước mắt) và “những người đàn ông mặc đồ đen” với
    vẻ mặt “không đành lòng đứng đó thêm nữa”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000023
  kind: locked_constraint
  value: Giữ trạng ngữ hồi tưởng “Nghĩ lại thì” và cảm giác tự trách của bà lão vì
    đã vô tư pha trà vào khoảnh khắc ấy.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000024
  kind: locked_constraint
  value: Giữ hai câu hỏi tu từ liên tiếp “Những vị khách mặc đồ đen im lặng với vẻ
    trang nghiêm ư? Về cơ bản thì họ đang mặc đồ tang còn gì nữa?” dưới dạng văn bản
    phẳng không in nghiêng theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000025
  kind: locked_constraint
  value: Giữ tình thái nhận định quá khứ “Lý do họ tìm đến lẽ ra phải quá rõ ràng
    rồi mới phải.”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000026
  kind: locked_constraint
  value: Giữ định dạng in hoa toàn bộ “GIẤY BÁO TỬ.”, không thêm dấu nhấn mạnh `*...*`
    theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000027
  kind: locked_constraint
  value: Giữ phủ định “Bà thậm chí còn chẳng hề nghĩ tới khả năng đó”, chi tiết rút
    tờ giấy khỏi đôi bàn tay run rẩy của con gái mình và bước ngoặt khi đọc dòng chữ
    duy nhất in ở mặt trước khiến thời gian như ngừng trôi.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000028
  kind: locked_constraint
  value: Giữ chủ ngữ “Con gái bà” và phủ định “vẫn chưa gượng dậy nổi sau cú sốc ấy”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000029
  kind: locked_constraint
  value: Giữ hai cụm nhấn mạnh chữ nghiêng liên tiếp `*Không chỉ vậy,* *có lẽ đối
    với con bé, thời gian vẫn đang ngừng trôi tại đúng khoảnh khắc đó.*` theo DEC-P01-002,
    tình thái suy đoán “có lẽ”, cách gọi “con bé” quy chiếu con gái bà và thời hiện
    tại tiếp diễn của trạng thái thời gian ngừng trôi.
  non_canon: true
