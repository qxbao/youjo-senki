task_id: vol-03-ch-03-b04
baseline_sha256: ec204e2e24d71d88f12626911fc8cd1908607dfec726eac5766d77cdbd7abfde
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: fd7246429e8bd7582b43b3d79bc11257749966714a63c1d77a484d63a7bc83cc
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098: locks: [''Giữ câu
    nối tiếp trực tiếp từ cuối lô trước (`p000097`) cùng sắc thái phỏng đoán `có lẽ`:
    `Hoặc có lẽ là khó mà nhìn thẳng nổi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000099: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `chúng tôi / Tôi / tôi`, dấu gạch ngang dài `—` ngắt
    lời tự sửa từ cá nhân sang `đơn vị của tôi` và giọng van nài khẩn thiết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000100: locks: [''Giữ nhận
    định so sánh tiếng gào thét thống khổ ấy nghe gần như một lời nguyền rủa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000101: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `chúng tôi / tôi`, thuật ngữ `xuất kích` và lời khẩn
    cầu xin phê chuẩn cho dù chỉ đơn vị của mình được phép xuất kích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000102: locks: [''Giữ đại
    từ `ông` quy chiếu vị chỉ huy căn cứ và sự đối lập song hành của đôi bàn tay đang
    túm chặt lấy ve áo ông: vừa mạnh mẽ lại vừa nhỏ nhắn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000103: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001 và bước tự đính chính tăng tiến: vẻ mặt vặn vẹo cùng
    giọng điệu van nài là lời thỉnh cầu ngăn chặn sự hủy diệt; không, giống tiếng
    ai oán của một kẻ đang tuyệt vọng kiếm tìm sự cứu rỗi hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000104: locks: [''Giữ các
    định danh `Lục quân Đế quốc`, `Trận chiến sông Rhine` và sự tương phản giữa hành
    xử bất chấp thể diện hiện tại với tiếng tăm về sự điềm tĩnh vô song trong Trận
    chiến sông Rhine.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000105: locks: [''Giữ dấu
    ngoặc kép mở đầu đoạn không đóng ở cuối đoạn (do lời thoại tiếp nối sang `p000106`),
    cặp dấu gạch ngang dài `—...—`, định danh `Đế quốc` và thế lưỡng phân định đoạt
    giữa giành được cả thế giới hay mất sạch tất cả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000106: locks: [''Giữ hai
    phần hội thoại kẹp giữa cụm trần thuật `nó nói` (theo DEC-P01-001) và lời van
    nài `Làm ơn hãy để chúng tôi đi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000107: locks: [''Giữ định
    danh `Thiếu tá Tanya von Degurechaff`, đại từ `nó` theo DEC-P01-001 và bộ ba `quy
    tắc, chuẩn mực lẫn điều lệnh` đã bị vứt bỏ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000108: locks: [''Giữ tên
    `von Lergen`, đại từ `ông` (quy chiếu von Lergen và sĩ quan cấp trên), đại từ
    `nó` (quy chiếu Tanya theo DEC-P01-001), cùng chi tiết túm lấy ve áo sĩ quan cấp
    trên và gần như đe dọa ông bằng những tiếng la hét.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000109: locks: [''Giữ quan
    hệ nhân quả giải thích lý do tất cả những người có mặt đều hoang mang đến mức
    chỉ biết đứng chôn chân tại chỗ, không biết phải làm gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000110: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, quan hệ nhượng bộ giữa tư thế đứng nghiêm bất động thành
    những hàng ngũ im phăng phắc của các thuộc cấp với vẻ mặt rúng động và bối rối
    trước màn la hét ồn ào không sao hiểu nổi của cấp trên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000111: locks: [''Giữ đại
    từ `Nó / nó` theo DEC-P01-001 và chuỗi bốn danh ngữ khắc họa năng lực của Tanya:
    chỉ huy thực địa dày dạn kinh nghiệm, sĩ quan lão luyện vượt qua mọi thử thách
    bất khả thi không nao núng, pháp sư gan dạ xuyên thủng lưới phòng không của cả
    hạm đội, chuyên gia tác chiến đêm luồn lách dưới bức màn bóng tối như thể chiến
    trường là của riêng nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000112: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001 và sự tương phản giữa kẻ có lẽ xa lạ nhất thế gian với
    cảm xúc sợ hãi nhưng giờ lại đang gào thét với gương mặt tái nhợt không lẫn vào
    đâu được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000113: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001 và trạng thái các thuộc cấp không còn lựa chọn nào khác
    ngoài việc đứng đực ra đó mà chẳng biết làm sao.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000114: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu gạch ngang dài `—` lặp từ đầu câu, con số `năm trăm kilômét`,
    ngôi `Chúng ta` và lời khẳng định chìa khóa của cuộc chiến, của tương lai thế
    giới đã ở gần ngay trước mắt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000115: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, các định danh `Lục quân Cộng hòa`, `Quân cảng Brest`
    và chi tiết nhóm tàu vận tải khả nghi vừa tập hợp lại theo bản báo cáo mới nhận
    được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000116: locks: [''Giữ các
    định danh `Quân cảng Brest`, `Hải quân Cộng hòa`, `Cộng hòa`, thuật ngữ `lệnh
    ngừng bắn` và nhận định đây là một trong những căn cứ chính nơi Cộng hòa dự kiến
    tập trung hạm đội trước lệnh ngừng bắn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000117: locks: [''Giữ định
    danh `Lục quân Đế quốc`, `hạm đội Cộng hòa`, thuật ngữ `lệnh ngừng bắn` và câu
    lưu ý rằng tất nhiên về mặt pháp lý cuộc chiến vẫn chưa kết thúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000118: locks: [''Giữ chính
    xác hai phần chữ nghiêng `*Dẫu vậy*` và `*chắc chắn Cộng hòa không tài nào tiếp
    tục chiến đấu được nữa khi giờ đây họ đã mất thủ đô. Sự kết thúc của cuộc chiến
    chỉ còn là vấn đề thời gian.*` đúng theo thẻ nhấn mạnh của nguồn (DEC-P01-002).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000119: locks: [''Giữ cặp
    dấu gạch ngang dài `—không, giống một lời van nài hơn—` và nội dung xin phê chuẩn
    tấn công `hạm đội Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000120: locks: [''Giữ hình
    ảnh ẩn dụ `một con nhím xù lông thực thụ` khi căn cứ vốn phòng thủ kiên cố lại
    có thêm dàn đại bác của hạm đội, cùng nhận định kẻ nào muốn lao đầu vào đó ắt
    hẳn đầu óc có vấn đề và bất kỳ chỉ huy biết điều nào cũng phải chùn bước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000121: locks: [''Giữ nhịp
    điệp đầu đoạn `Ấy thế mà. Ấy thế mà...`, đại từ `nó` theo DEC-P01-001 và chi tiết
    gần như mất hết tự chủ, khăng khăng đòi thực hiện kế hoạch tấn công có thể làm
    hỏng cuộc đàm phán chấm dứt chiến tranh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000122: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi `Chúng ta / tôi`, các định danh `Lục quân Cộng hòa`,
    `Brest` và lời khẩn cầu xin binh lực chế áp Lục quân Cộng hòa tại Brest.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000123: locks: [''Giữ dấu
    ngoặc kép hội thoại và lời trấn an gấp gáp gọi cấp hàm ba lần: `“Thiếu tá! Thiếu
    tá von Degurechaff! Xin hãy bình tĩnh lại đi, Thiếu tá!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000124: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Đại tá`, ngôi `chúng ta – chúng`, định danh
    `Đế quốc` và lời cảnh báo nếu để chúng thoát mất thì chúng sẽ trở thành căn nguyên
    cho mọi rắc rối của Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000125: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, cụm `chỉ huy căn cứ`, đại từ `ông` và hành động nắm
    lấy ve áo chỉ huy căn cứ kéo ghì xuống ngang tầm mắt mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000126: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu nói lịch sự theo điều lệnh khi can thiệp: `“Thưa Thiếu
    tá, xin thứ lỗi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000127: locks: [''Giữ cụm
    `Các sĩ quan quân cảnh`, định danh `Degurechaff`, đại từ `nó` theo DEC-P01-001
    và sự đối lập khi quân cảnh cố chen vào giữa hai người nhưng bị tiếng gào thét
    thịnh nộ của Degurechaff đẩy lùi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000128: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Đại tá!`, ngôi `tôi`, định danh `Văn phòng
    Bộ Tổng tham mưu` và lời van nài xin được nói chuyện với Văn phòng Bộ Tổng tham
    mưu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000129: locks: [''Giữ nhận
    định so sánh: `Một con sư tử bị thương có lẽ còn dễ đối phó hơn.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000130: locks: [''Giữ cụm
    `Đám quân cảnh`, cặp dấu gạch ngang dài `—mà chắc chắn chính họ cũng sẽ đồng tình—`
    và điều kiện kèm theo là đối thủ của họ phải là người bình thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000131: locks: [''Giữ các
    thuật ngữ `pháp sư`, `quả cầu tính toán` và nhận định chỉ một pháp sư khác được
    trang bị tương tự mới có thể gây sự với một pháp sư đang đeo quả cầu tính toán.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000132: locks: [''Giữ dấu
    ba chấm `…`, dấu gạch ngang dài `—`, định danh `Huy hiệu Đột kích Cánh bạc đính
    Lá sồi` và dấu nhấn mạnh chữ nghiêng `*còn sống*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000133: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, cụm `vũ khí hình người`, và hai biệt danh trong ngoặc
    kép: `“Bạch Ngân”` (để ghi nhận chiến công) đối lập với `“Ngân Gỉ”` (do những
    giọng nói khác gọi vì nỗi sợ hãi).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000134: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, đại từ `họ` và cặp giả định song hành: nếu là kẻ địch
    thì chẳng muốn bén mảng lại gần, ngay cả khi là đồng minh cũng không hề muốn ngáng
    đường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000135: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*Thế nhưng*` ở đầu câu theo DEC-P01-002, cụm `những người
    lính Đế quốc`, đại từ `nó` theo DEC-P01-001 và hành động nhớ lại bổn phận của
    mình mà cản đường nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_002.xhtml/p000136: locks: [''Giữ quan
    hệ nhượng bộ khép lại cảnh: dù đẫm mồ hôi lạnh và run rẩy trong nỗi sợ hãi, họ
    vẫn trung thành tuyệt đối với bổn phận của mình.'']'
  non_canon: true
