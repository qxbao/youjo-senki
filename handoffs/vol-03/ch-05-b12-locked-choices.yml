choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176: locks: [''Giữ định
    danh `Bộ Tổng tham mưu` và mạch liên kết trực tiếp với cuối batch b11: `Điều đó
    thì Bộ Tổng tham mưu có thể hoàn toàn đón nhận.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000177: locks: [''Giữ hai
    nguyên nhân gây hoảng sợ cho Bộ Tổng tham mưu: `sự xuất hiện của một người hùng
    tại lục địa phía nam` và `việc họ ngày càng không thể ước lượng được thời điểm
    rút lui`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000178: locks: [''Giữ các
    định danh `phe kiểm soát tổn thất`, `Trung tướng von Zettour`, `phe hiếu chiến`
    và mục tiêu `mở rộng thành quả chiến tranh`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000179: locks: [''Giữ giới
    hạn `vượt quá mức tối cần thiết tới lục địa phía nam`, nhận định `một sự lãng
    phí nguồn lực khó lòng chấp nhận` và hệ lụy `gánh nặng đè lên các tuyến tiếp tế
    cũng sẽ vượt quá sức chịu đựng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000180: locks: [''Giữ cấu
    trúc câu hỏi tu từ ngắn và thuật ngữ `các tàu hộ tống đoàn vận tải`: `Còn các
    tàu hộ tống đoàn vận tải thì sao?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000181: locks: [''Giữ cấu
    trúc câu hỏi song hành và thuật ngữ `các tàu vận tải`: `Còn các tàu vận tải thì
    sao?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000182: locks: [''Giữ cấu
    trúc câu hỏi song hành và thuật ngữ `các đơn vị chi viện trực tiếp`: `Còn các
    đơn vị chi viện trực tiếp thì sao?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000183: locks: [''Giữ các
    định danh `phe kiểm soát tổn thất`, `sĩ quan hậu cần`, `Lục quân Đế quốc`, `chiến
    lược tuyến nội địa` và mối hoài nghi `chẳng chắc liệu mình có thể triển khai sức
    mạnh một cách bài bản ở nước ngoài hay không`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000184: locks: [''Giữ sự
    đối sánh giữa việc di chuyển một `quân đoàn` trên `lục địa phía nam` với trong
    phạm vi lãnh thổ nước nhà, ví dụ về lộ trình phức tạp của một khẩu súng trường
    đơn lẻ và hai rủi ro vận chuyển (hư hại theo tỷ lệ nhất định, cả những con tàu
    bị đánh chìm dọc đường).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000185: locks: [''Giữ các
    định danh `Lục quân Đế quốc`, `quân đội Đế quốc`, `năng lực vận tải đường biển`,
    `phần lãnh thổ Đế quốc chiếm đóng tại Norden`, `tàu vận tải` và quan hệ nhân quả
    khiến việc thu mua tàu cũng như công tác bảo dưỡng diễn ra chậm chạp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000186: locks: [''Giữ định
    danh `Đế quốc`, đặc điểm `quốc gia lục địa hầu như chẳng có khái niệm gì về việc
    bảo vệ các tuyến hàng hải huyết mạch`, cụm `hoạt động hộ tống đoàn tàu` và nhận
    định `Điểm yếu đó chắc chắn sẽ quay ngược lại làm hại chính họ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000187: locks: [''Giữ hai
    định danh `Khối Thịnh vượng chung và Cộng hòa`, lợi thế `khả năng tự cung tự cấp
    ở một mức độ nhất định nhờ có sẵn nền tảng công nghiệp tương đối tại các thuộc
    địa` và ưu thế `sở hữu nhiều tàu bè đến mức đếm không xuể`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000188: locks: [''Giữ định
    danh `Lục quân Đế quốc`, cụm `các khu vực mới nằm trong phạm vi ảnh hưởng của
    Đế quốc` và giới hạn `chỉ gắn kết với những nơi ấy ở chừng mực đôi bên còn chung
    lợi ích`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000189: locks: [''Giữ tâm
    lý e ngại của `bất kỳ người lính chân chính nào` khi phải phụ thuộc vào nguồn
    tiếp tế từ đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000190: locks: [''Giữ định
    danh `Bộ Tổng tham mưu` và kết quả `lại rơi vào một cuộc tranh luận nảy lửa khác`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000191: locks: [''Giữ thế
    tiến thoái lưỡng nan khi kẻ địch (`Chúng`) đang ở ngay trước mắt, tên riêng `Zettour`,
    chủ trương `cân nhắc việc chấn chỉnh lại các phòng tuyến nếu cần thiết` và hai
    nhiệm vụ `đại tu cơ cấu tổ chức của các tuyến phòng thủ, đồng thời vận dụng tầm
    ảnh hưởng của mình lên các quốc gia khác ở hậu trường`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000192: locks: [''Giữ định
    danh `Bộ Tổng tham mưu` và tình tiết một báo cáo khác gửi về từ phương nam trước
    khi họ đi đến kết luận.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000193: locks: [''Giữ thông
    báo về `một đại thắng`, việc mở rộng thành quả bằng `một đợt tấn công bồi thêm`,
    tác động kép đẩy người dân vào `một cơn cuồng nhiệt mới` đồng thời gây khó khăn
    hậu cần cho `Zettour`, cùng câu kết `May thay, Zettour vẫn chưa biết điều đó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000194: locks: [''Giữ nguyên
    dòng tiêu đề thời gian – địa điểm viết hoa: `NGÀY 4 THÁNG 9, NĂM THỐNG NHẤT 1925,
    THỦ ĐÔ ĐẾ QUỐC`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000195: locks: [''Giữ đại
    từ `Ông` quy chiếu Tướng von Romel, địa danh `lục địa phía nam` và nghĩa `các
    thuộc cấp của mình` (chỉ các đơn vị thuộc quyền trong biên chế được giải thích
    ngay ở p000196).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000196: locks: [''Giữ cụm
    `trên danh sách biên chế` và quy mô `chỉ có vỏn vẹn hai sư đoàn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000197: locks: [''Giữ phân
    biệt hai sư đoàn: một `sư đoàn bộ binh nhẹ` lập nên chủ yếu từ `tân binh và quân
    dự bị`, và sư đoàn kia gồm `số ít cựu binh mà ông được phân bổ` nhưng không ở
    trạng thái tốt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000198: locks: [''Giữ chữ
    nghiêng `*x*` theo DEC-P01-002 (`sức chiến đấu là *x*`), các định danh `mặt trận
    Rhine`, `Tướng von Romel`, đại từ `ông` và nhận định về sự chênh lệch giữa sức
    mạnh thực tế với quân số trên giấy tờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000199: locks: [''Giữ tên
    riêng `Romel`, đại từ `ông`, các cụm `chiến dịch phía nam`, `một đám quân tuyến
    hai chắp vá`, `Bộ Tổng tham mưu` và việc không nhận được câu trả lời thỏa đáng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000200: locks: [''Giữ các
    thuật ngữ `tiểu đoàn pháp sư tăng cường`, `bộ phận Hậu cần và Cục Tác chiến trong
    Bộ Tổng tham mưu`, `đơn vị tuyến đầu` và ba phẩm chất `trang bị bài bản, kinh
    nghiệm thực chiến cùng đội hình đầy đủ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000201: locks: [''Giữ bước
    chuyển cảm xúc khi tinh thần phấn chấn của `ông` bị dập tắt ngay lúc nhận được
    `các bản đánh giá về vị chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000202: locks: [''Giữ câu
    đính chính ngắn: `Không, bản thân các bản đánh giá thì vẫn ổn.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000203: locks: [''Giữ đại
    từ `cô` (quy chiếu vị chỉ huy tiểu đoàn pháp sư từ góc nhìn của Romel qua hồ sơ),
    cơ quan `học viện` và nhận xét `đạt chuẩn sĩ quan cấp tá`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000204: locks: [''Giữ đại
    từ `cô`, các định danh `Trường Đại học Chiến tranh`, `sĩ quan Bộ Tổng tham mưu`,
    `sĩ quan ma pháp` và lời đánh giá đáp ứng mọi tiêu chuẩn đáng mong đợi ở một sĩ
    quan.'']'
  non_canon: true
