task_id: vol-03-ch-02-b25
baseline_sha256: f32e2216903ce2b6b5b2563d256ebf7e86d12c4d7fad9babaad95fb5ea67a31a
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 62cd23f08101efedaeefc7dd94655f7440eda48c97e4e48a91d4737bab0a8648
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735: locks: [''Giữ chức
    danh và cấp hàm “Thứ trưởng Quốc phòng, Thiếu tướng de Lugo”, đại từ “ông”, thuật
    ngữ “lãnh thổ chính quốc” và thế nhượng bộ dù đang thực thi kế hoạch từ bỏ lãnh
    thổ chính quốc nhưng chắc chắn ông có nhiều trăn trở hơn mức thông thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000736: locks: [''Giữ giả
    định trái thực tế ở quá khứ “Xét về mặt logic, giá như họ xây dựng chiến hào rồi
    bố trí pháo binh và binh lính vào đó, các phòng tuyến hẳn đã có thể được bảo vệ.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000737: locks: [''Giữ đại
    từ “Ông” và nhận định ông biết đó là một mệnh lệnh hợp lý.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000738: locks: [''Giữ toàn
    bộ chuỗi nguyên nhân–hệ quả về lỗ hổng khổng lồ trên mặt trận khiến các đơn vị
    lẽ ra có thể trấn giữ phòng tuyến bị xóa sổ vĩnh viễn khỏi biên chế, tổn thất
    đạn dược cùng pháo hạng nặng, và việc mất đi phần lớn năng lực sản xuất thời chiến
    cùng các ngành công nghiệp nặng khác khiến họ không thể duy trì mức độ tiêu hao
    như trước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000739: locks: [''Giữ câu
    chuyển ý ngắn gọn “Nhưng dù vậy.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000740: locks: [''Giữ định
    dạng chữ nghiêng toàn đoạn `*...*` theo DEC-P01-002, đại từ “chúng ta”, các định
    danh “Khối Thịnh vượng chung”, “lực lượng trung tâm của Lục quân Cộng hòa”, và
    chuỗi giả định nuối tiếc ở quá khứ cùng dấu chấm lửng cuối câu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000741: locks: [''Giữ định
    dạng chữ nghiêng toàn đoạn `*...*` theo DEC-P01-002, các thuật ngữ “lực lượng
    viễn chinh”, “trận cầm chân”, và hai giả định quá khứ về việc có đủ thời gian
    dựng chiến tuyến mới hoặc đưa một số đơn vị thoát khỏi vòng vây.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000742: locks: [''Giữ định
    danh “de Lugo” và cấu trúc phủ định kép “không còn lựa chọn nào khác ngoài việc
    thừa nhận rằng có suy tính thêm nữa cũng chẳng ích lợi gì”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000743: locks: [''Giữ nhận
    định đã quá muộn và phép so sánh thành ngữ “vô ích như khóc tiếc bát sữa đã đổ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000744: locks: [''Giữ các
    định danh “Cộng hòa”, “Lãnh thổ chính quốc”, “Lục quân Đế quốc” và ba mệnh đề
    khẳng định lực lượng chủ lực vĩnh viễn mất khả năng tái tổ chức, lãnh thổ chính
    quốc sẽ bị giày xéo và lời tiên đoán đáng nguyền rủa đã thành tương lai không
    thể tránh khỏi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000745: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu chấm lửng mở đầu và câu hỏi ngắn “…Tiến độ thế nào rồi?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000746: locks: [''Giữ đại
    từ “Ông” và hành động chuyển hướng suy nghĩ để gạt bỏ những ý nghĩ về các cơ hội
    đã bỏ lỡ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000747: locks: [''Giữ các
    định danh “Lục quân Đế quốc”, “tuyến đầu mặt trận Rhine”, “Lục quân Cộng hòa”,
    “Cộng hòa”, cùng nhận định bi quan rằng dù trong cuộc chiến này hay bất kỳ cuộc
    chiến nào khác Cộng hòa có lẽ sẽ chẳng bao giờ tập hợp lại được đội ngũ tinh nhuệ
    như thế nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000748: locks: [''Giữ định
    danh “Cộng hòa”, sự tương phản giữa tiềm lực binh lính và tài nguyên thiên nhiên
    dồi dào ở các vùng lãnh thổ thuộc địa rộng lớn với thực tế nếu cứ phân tán thì
    họ chỉ là mục tiêu cho sự tàn sát hoặc đầu hàng và giải giáp vũ khí.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000749: locks: [''Giữ nhịp
    lặp mở đầu “Tuy nhiên—tuy nhiên…”, định danh “Cộng hòa”, “đạo quân chống Đế quốc”,
    và chuỗi mệnh đề điều kiện về việc liên kết nhân lực và tài nguyên, kiểm soát
    các thế lực suy yếu ở thuộc địa, bảo toàn cụm binh lực rút đi nguyên vẹn tổ chức
    để xây dựng đạo quân chống Đế quốc hùng mạnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000750: locks: [''Giữ định
    danh “Đế quốc”, điều kiện “Nếu họ ẩn nhẫn chờ thời” và cấu trúc phủ định kép “sẽ
    không phải là điều bất khả thi”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000751: locks: [''Giữ dấu
    ngoặc kép hội thoại và các phiên hiệu “Sư đoàn Thiết giáp số 3”, “Một lữ đoàn
    lâm thời thuộc Tập đoàn quân Cơ động Chiến lược số Bảy” đang lên tàu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000752: locks: [''Giữ đúng
    cụm chữ nghiêng `*Đó chính là lý do tại sao dù có thế nào đi nữa tôi cũng phải
    bảo vệ những đơn vị hạng nặng này*` theo DEC-P01-002 với đại từ “tôi”, phần trần
    thuật chữ thường nêu “de Lugo”, “Sư đoàn Thiết giáp số Ba”, “sư đoàn xe tăng”,
    “Tập đoàn quân Cơ động Chiến lược số Bảy”, “các thiết bị tính toán mới nhất vừa
    mới xuất xưởng” và “mẫu xe tăng chủ lực tân tiến nhất”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000753: locks: [''Giữ sự
    đối lập giữa điều may mắn giữa bi kịch khi kết hợp các lực lượng này với điều
    không may cho tiền tuyến khi hai đơn vị ấy ở lại hậu phương huấn luyện với trang
    thiết bị mới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000754: locks: [''Giữ giả
    định quá khứ ở câu đầu, câu chữ nghiêng `*Nhưng nếu giờ họ đang ở đây, Cộng hòa
    vẫn có thể chiến đấu.*` ở giữa đoạn theo DEC-P01-002, và câu kết chữ thường nêu
    việc bảo toàn các đơn vị có thể giao chiến với “các pháp sư Đế quốc” trên chiến
    trường sòng phẳng trong “hình thái chiến tranh cơ động mới này”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000755: locks: [''Giữ các
    định danh “các pháp sư”, “Tập đoàn quân Cơ động Chiến lược số Bảy” và ý dù khả
    năng hội quân từng rất đáng ngờ nhưng cách họ cấp tốc kéo tới đã chứng minh tinh
    thần chiến đấu và ý chí bất khuất vững như bàn thạch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000756: locks: [''Giữ định
    danh “de Lugo”, “Cộng hòa” và sự khẳng định nhấn mạnh bằng dấu gạch ngang rằng
    trên tư cách một quốc gia, Cộng hòa—dù thế nào đi nữa—vẫn chưa hề thua cuộc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000757: locks: [''Giữ câu
    ngắn “Họ vẫn còn những quân bài trong tay.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000758: locks: [''Giữ các
    định danh “Lục quân Cộng hòa”, “mặt trận Rhine”, “Cộng hòa” và thế tương phản
    giữa cú sốc to lớn khi mất toàn bộ số quân ở mặt trận Rhine với việc không phải
    Cộng hòa đã mất tất cả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000759: locks: [''Giữ định
    danh “Thiếu tướng de Lugo”, đại từ “ông” và sự chuyển ý từ việc có lẽ đang tỏ
    ra cứng cỏi sang việc vẫn còn nguyên ý chí chiến đấu và động lực nên tự quở trách
    trái tim đang nản lòng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000760: locks: [''Giữ định
    dạng chữ nghiêng toàn câu `*Người lính nào lại để vận mệnh đất nước mình phụ thuộc
    vào thiện chí của một quốc gia khác chứ?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000761: locks: [''Giữ định
    dạng chữ nghiêng toàn đoạn `*Một người lính không thể cứu lấy đất nước mình thì
    thà chết đi còn hơn. Họ phải bám trụ trên chiến tuyến, chiến đấu vì tổ quốc, vì
    đất nước của mình cho đến tận giây phút cuối cùng.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000735
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000762: locks: [''Giữ đại
    từ “Ông”, định danh “Cộng hòa” và ý muốn hét lên rằng ngay cả khi đối phương thắng
    hiệp đầu thì Cộng hòa sẽ là kẻ trụ vững sau cùng.'']'
  non_canon: true
