task_id: vol-03-ch-01-b16
baseline_sha256: 5f8a162062cdf7191ff41e8142d0ebd5c47e00d741aefdfabbbf1057297e28c6
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: f42c8559b31e1a185b61a6347131f9f587b5e5dfbf3193e06e3416a26aedd42a
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218: locks: [''Giữ đại
    từ độc thoại nội tâm “Mình” / “mình” theo DEC-P01-001, thuật ngữ “thuật thức”
    và nhận định kịch bản tồi tệ nhất khi lao vào ổ pháp sư địch dưới lòng đất để
    giao chiến trong không gian kín.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000219: locks: [''Giữ hai
    cụm nhấn mạnh chữ nghiêng `*Nhưng*` và `*không thể nào.*` theo DEC-P01-002, chủ
    thể “Tanya”, đại từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “tín hiệu ma lực”
    và khả năng bỏ ngỏ rằng đối phương ở quá sâu dưới lòng đất nên không thu nhận
    được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000220: locks: [''Giữ danh
    xưng cấp bậc “Thiếu úy”, cặp đại từ “tôi” - “cô” và thuật ngữ “tín hiệu ma lực”
    trong câu hỏi của Tanya với Serebryakov.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000221: locks: [''Giữ câu
    đáp điều lệnh lễ độ, ngắn gọn của Serebryakov: “Không có ạ.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000222: locks: [''Giữ đại
    từ trần thuật “Nó” theo DEC-P01-001 và định danh “Thiếu úy Serebryakov”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000223: locks: [''Giữ dấu
    ba chấm mở đầu, hai câu hỏi giả định nội tâm nối tiếp và kết luận rằng không có
    pháp sư nào đang dựng “lớp vỏ phòng thủ” và “màn chắn bảo hộ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000224: locks: [''Giữ đại
    từ “chúng ta” và nhận định có một nước đi thông thường vốn không mấy hiệu quả
    với pháp sư nhưng lại phát huy tác dụng tuyệt vời trong tình huống này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000225: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, địa danh “Norden”, thuật ngữ “màn chắn bảo
    hộ” và lập luận rằng dù có thể vô hiệu hóa khí độc bằng màn chắn bảo hộ nhưng
    pháp sư vẫn là sinh vật sống nên không thể tự che chắn trước chất độc khi chưa
    nhận ra sự hiện diện của nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000226: locks: [''Giữ câu
    chuyển đoạn ngắn gọn: “Vì vậy.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000227: locks: [''Giữ dấu
    ba chấm mở đầu, đại từ “Tôi” / “chúng ta” và mệnh lệnh dứt khoát của Tanya: “Tiêu
    diệt chúng đi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000228: locks: [''Giữ câu
    hỏi xác nhận lễ độ của Serebryakov: “Chúng ta sẽ xông vào sao ạ?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000229: locks: [''Giữ cặp
    đại từ “tôi” - “cô”, danh xưng “Thiếu úy”, địa danh “Norden”, chủ thể “Tanya”,
    đại từ sở hữu “của mình” theo DEC-P01-001 và hai phương án tác chiến trong không
    gian kín (dùng khí carbon monoxide hoặc tạo khí hydro rồi quăng que diêm vào nếu
    ưu tiên tốc độ).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000230: locks: [''Giữ câu
    hỏi ngập ngừng rồi chợt hiểu ra nguyên lý đốt oxy của Serebryakov kèm tiểu từ
    lễ độ “ạ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000231: locks: [''Giữ đại
    từ ngôi hai “cô” và lời giải thích của Tanya về tính dễ phản ứng của oxy cùng
    nguy cơ chết ngạt trong môi trường ngầm khép kín.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000232: locks: [''Giữ nhận
    định toàn bộ oxy trong không gian ngầm sẽ bị đốt sạch chỉ trong một vụ nổ và nguy
    cơ ngạt thở cực kỳ hiểm độc mà người ta hay quên mất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000233: locks: [''Giữ nhận
    định thực tế rằng trong không gian kín, riêng sức ép của vụ nổ thôi đã là mối
    đe dọa đủ lớn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000234: locks: [''Giữ đại
    từ nội tâm “chúng ta” / “mình” theo DEC-P01-001, thuật ngữ “thuật thức hóa hơi
    nổ dạng đốt cháy” và mạch suy tính từ việc tạo khí hydro tước đoạt sạch oxy của
    địch đến kỳ vọng thu được kết quả khá khẩm tại nhà kho.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000235: locks: [''Giữ khẩu
    lệnh chỉ huy của Tanya: “Chúng ta sẽ đốt sạch oxy ở dưới đó. Chuẩn bị thuật thức.
    Theo nhịp đếm của tôi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000236: locks: [''Giữ đại
    từ “Chúng ta” / “mình”, thuật ngữ “thuật thức” và cơ chế kìm nén sự phát lộ của
    thuật thức ở dạng tiềm năng tới mức tối đa rồi mới thi triển vào giây cuối cùng
    để làm đòn đánh lén hiệu quả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000237: locks: [''Giữ đại
    từ nội tâm “mình” theo DEC-P01-001, thuật ngữ “thuật thức” và lý do kỹ thuật này
    ít dùng trong thực chiến vì tốn thời gian, công sức kìm nén.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000238: locks: [''Giữ các
    thuật ngữ “tao ngộ chiến”, “tác chiến cơ động cao”, “thuật thức” và ưu điểm kín
    đáo khiến ngay cả pháp sư cũng cực kỳ khó phòng ngự khi thuật thức chỉ phát lộ
    ngay trước lúc phát huy tác dụng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000239: locks: [''Giữ đại
    từ nội tâm “Mình” theo DEC-P01-001, các thuật ngữ “tuyến sau”, “chiến tranh chiến
    hào và chiến tranh phi quy ước” cùng nhận định pháp sư ở đây có lẽ chỉ có kỹ năng
    ứng phó theo sách vở.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000240: locks: [''Giữ nguyên
    khẩu lệnh đếm ngược khai hỏa: “Ba, hai, một, bắn!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000241: locks: [''Giữ đại
    từ trần thuật “Nó” và đại từ sở hữu “của mình” theo DEC-P01-001 cùng thuật ngữ
    “thuật thức”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000242: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “tín hiệu ma lực”, “thuật thức”
    và cảnh hơi nóng cuồn cuộn càn quét xuống tận những ngóc ngách sâu nhất của tầng
    hầm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000243: locks: [''Giữ phiên
    hiệu “Tiểu đoàn Pháp sư Không quân 203”, các thuật ngữ “tác chiến cơ động cao”,
    “thuật thức đốt cháy dạng napalm” và mô tả sở trường bắn nhanh, thi triển thuật
    thức thần tốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000244: locks: [''Giữ hai
    lựa chọn có kết cục gần như tương tự của kẻ địch hứng đòn: bị thổi bay hoặc bị
    thiêu rụi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000245: locks: [''Giữ đại
    từ “chúng ta”, chủ thể “Tanya”, đại từ sở hữu “của mình” theo DEC-P01-001, thuật
    ngữ “thuật thức napalm” và hình ảnh đối lập giữa câu tục ngữ về loài chim ngốc
    làm bẩn tổ với việc đốt sạch cái tổ trước khi rút lui.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000246: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001 và lý do không có thời gian.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000247: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “Bộ Tổng Tham mưu” và nguyên nhân
    lịch trình điên rồ là do đánh giá quá cao phản ứng của kẻ địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000248: locks: [''Giữ đại
    từ “Chúng ta”, thuật ngữ “sở chỉ huy” và giới hạn thời gian vỏn vẹn mười phút
    tính sát tới từng giây.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000249: locks: [''Giữ đại
    từ “chúng ta” và hệ quả nếu dây dưa lâu hơn thì quân địch đóng tại địa phương
    sẽ kéo đến xử lý, khiến triển vọng đảm bảo đường rút lui trở nên vô cùng ảm đạm.'']'
  non_canon: true
