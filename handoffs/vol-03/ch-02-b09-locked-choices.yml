task_id: vol-03-ch-02-b09
baseline_sha256: a1cfe56597d40ce3915040095cf7c572a5f50ad498f440c19d99de8b47d5e6ab
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 46c5d6194f5fb757e878e7410c5987fe3345f76758c1cd68c5081fc57275e19a
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “CP”, ngôi “anh” và lời chúc thượng lộ bình an.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000174: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Whiskey Dog”, ngôi “Tôi” – “các anh” và ý biết
    bên CP đã dặn phải đến nơi đúng giờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000175: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi” – “ngài”, cấp bậc “Trung tá” và câu đùa đặt cược
    vào Trung tá, nếu thua thì Trung tá nợ một chầu rượu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000176: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “cậu” – “tôi” và lời cam đoan cứ tin ở mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000177: locks: [''Giữ tên
    “Vianto”, đại từ “anh”, các thuật ngữ “quả cầu tính toán”, “thuật thức”, mệnh
    đề nhượng bộ bay lên thận trọng hơn thường lệ vì mang nhiều chai rượu nhưng quy
    trình vẫn lặp lại như mọi lần: tập trung vào điểm muốn thao túng qua quả cầu tính
    toán, triển khai thuật thức chỉ can thiệp vừa đủ mức cần thiết, rồi thả mình theo
    cảm giác lơ lửng để lực đẩy đưa vọt lên cao.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000178: locks: [''Giữ đại
    từ “anh” và nhận định khi đã lên không trung an toàn thì đối với anh chẳng có
    gì đặc biệt, chỉ là một pha cất cánh bình thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000179: locks: [''Giữ câu
    chuyển cảnh ngắn “Cho đến khoảnh khắc ngay sau đó.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000180: locks: [''Giữ đại
    từ “anh”, hình ảnh ánh chớp cùng tiếng nổ gầm vang như sấm giáng thẳng vào anh
    không báo trước, làm anh xoay tít như chiếc lá cuốn giữa dòng thác ghềnh trắng
    xóa, mất phương hướng và không phân biệt nổi mình đang xuôi chiều hay lộn ngược.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000181: locks: [''Giữ tên
    “Vianto”, đại từ “anh”, thuật ngữ “sóng xung kích” và việc giữa những đợt sóng
    xung kích khổng lồ cùng chấn động từ vụ nổ dội vào dạ dày, bộ não choáng váng
    của anh chỉ còn biết dốc sức giữ anh lại trên không trung.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000182: locks: [''Giữ ý cơn
    chấn động chỉ kéo dài trong chốc lát.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000183: locks: [''Giữ đại
    từ “anh” và chi tiết vài giây sau khi các giác quan trấn tĩnh đủ để hoạt động
    trở lại, anh mừng rỡ nhận ra cơ thể không hề hấn gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000184: locks: [''Giữ đại
    từ “anh” và tiếng thở phào nhẹ nhõm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000185: locks: [''Giữ đại
    từ “anh” và chi tiết mãi đến lúc ấy não bộ anh mới tự hỏi vụ nổ vừa rồi là cái
    quái gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000186: locks: [''Giữ đại
    từ “anh”, chỉ đánh dấu chữ nghiêng đúng cụm `*ngay phía trên đầu anh*` theo DEC-P01-002
    và cảnh tượng làn khói đen đặc bốc lên ở hướng tiền tuyến và ngay phía trên đầu
    làm não anh đông cứng lại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000187: locks: [''Giữ đại
    từ “anh” và thế đối lập giữa việc đang trong quá trình cất cánh với việc hiện
    tại vẫn đang ở trên không trung.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000188: locks: [''Giữ đại
    từ “anh” và chuỗi ba câu hỏi liên tiếp về làn khói cao đến mức phải ngước lên
    mới thấy, có nhiều cột khói và bao trùm phía trên tiền tuyến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000189: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Tiếng động, chấn động và khói.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000190: locks: [''Giữ đại
    từ “anh”, thuật ngữ “kho đạn” và phỏng đoán đầu tiên rằng kho đạn đã trúng đòn
    phát nổ với một lượng thuốc nổ khổng lồ cùng lúc bùng lên hoặc thứ gì tương tự.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000191: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi lẩm bẩm “…Nhiều hơn một chỗ ư?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000192: locks: [''Giữ đại
    từ “anh” và việc ngay khi thốt ra sự thật đó thì buộc phải thừa nhận phỏng đoán
    của mình hoàn toàn trật lất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000193: locks: [''Giữ câu
    khẳng định có nhiều nguồn bốc lên khói đen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000194: locks: [''Giữ đại
    từ “anh” và chỉ đánh dấu chữ nghiêng đúng cụm `*cách đều nhau*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000195: locks: [''Giữ đại
    từ “anh”, khái niệm “những vụ nổ nhân tạo” và việc nhận thức được chuyện gì vừa
    xảy ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000196: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Những vụ nổ nhân tạo ư?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000197: locks: [''Giữ các
    thuật ngữ “mặt trận Rhine”, “những vụ nổ nhân tạo”, “hoạt động tác chiến”, “kho
    đạn”, và chỉ đánh dấu chữ nghiêng đúng câu hỏi nội tâm `*Vậy là các kho đạn đã
    bị cuốn vào giao tranh sao?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000198: locks: [''Giữ đại
    từ “anh”, thuật ngữ “kho đạn” và chỉ đánh dấu chữ nghiêng đúng câu nội tâm `*Cho
    dù tất cả các kho đạn trên toàn mặt trận có nổ tung cùng một lúc đi chăng nữa,
    cũng chẳng đời nào chúng lại tạo ra những cột khói cách quãng đều tăm tắp đến
    thế.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000199: locks: [''Giữ đại
    từ “anh”, sự đối lập “không phải bằng lý trí mà bằng trực giác đúc kết qua kinh
    nghiệm” và nhận thức tình hình còn tồi tệ hơn xa những gì mình tưởng tượng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000200: locks: [''Giữ các
    định danh “quân Đế quốc”, “thuật thức quan sát”, đại từ “anh”, chỉ đánh dấu chữ
    nghiêng đúng cụm `*Vậy nghĩa là…*` theo DEC-P01-002, và phản ứng chết lặng đến
    nghẹt thở trước cảnh tượng bên dưới làn khói.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000201: locks: [''Giữ các
    thuật ngữ “vùng đất không người”, “hệ thống chiến hào”, “trận địa phòng ngự sâu
    ba lớp chiến hào”, “công sự pháo binh”, “lô cốt” và sắc thái lẽ ra tất cả phải
    nằm ngay tại đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000202: locks: [''Giữ đại
    từ “anh” và cảnh tượng vùng đất hoang tàn rộng lớn ngổn ngang gạch đá vụn cùng
    mịt mù bụi đất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000203: locks: [''Giữ ý toàn
    bộ các trận địa phòng ngự của họ đã bị xóa sổ khỏi bản đồ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000204: locks: [''Giữ ý tất
    cả đều đã bốc hơi theo đúng nghĩa đen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000205: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “CP”, “Whiskey Dog” và hai câu hỏi liên tiếp
    về chuyện gì đang xảy ra và vụ nổ vừa rồi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000206: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu đáp ngắn “…Biến mất rồi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000207: locks: [''Giữ tên
    “Vianto” và chi tiết buột miệng nói gần như trong vô thức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000208: locks: [''Giữ dấu
    ngoặc kép hội thoại, cấp bậc “Trung tá”, ngôi “ngài” và lời xin lỗi đề nghị nhắc
    lại lần nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000209: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Tất cả biến mất sạch rồi.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000210: locks: [''Giữ đại
    từ “Anh”, dấu ngoặc kép hội thoại và tiếng hét giọng run rẩy rằng nó đã bị thổi
    bay thành từng mảnh, toàn bộ tiền tuyến bị đánh sập và các phòng tuyến biến mất
    rồi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000211: locks: [''Giữ dấu
    ngoặc kép hội thoại, cấp bậc “Trung tá”, ngôi “tôi” và câu nói bỏ lửng đầy hoài
    nghi của nhân viên điện đài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000212: locks: [''Giữ các
    định danh “CP”, “Vianto”, thuật ngữ “thuật thức quan sát”, đại từ “anh”, sự bực
    mình trước thái độ đủng đỉnh của nhân viên điện đài và hành động tập trung vào
    một toán quân đang di chuyển rồi gào rách dây thanh quản để cảnh báo toàn bộ các
    đơn vị.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000213: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm thuật ngữ “Một cụm hỗn hợp gồm các đơn vị thiết giáp
    và bộ binh cơ giới!” và tiếng báo động đứt quãng rằng quy mô quân địch lớn đến
    mức chúng ở khắp mọi nơi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000214: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu thốt “Cái gì?!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000215: locks: [''Giữ định
    danh “CP” và trạng thái chết lặng không nói nên lời trong một thoáng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000216: locks: [''Giữ dấu
    ngoặc kép hội thoại, hiệu ứng nói lắp “C-cảnh báo cho tiền tuyến ngay!” và phần
    trần thuật nhân viên điện đài nói thêm như thể cuối cùng cũng sực nhớ ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000217: locks: [''Giữ tên
    “Vianto” và cảm giác lệch pha kỳ lạ trước những chỉ thị thông thường đòi hỏi phải
    cảnh báo cho các phòng tuyến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000218: locks: [''Giữ chỉ
    đánh dấu chữ nghiêng ở đúng hai cụm `*Sao mình lại thấy kỳ lạ thế nhỉ?*` và `*Ồ.*`
    theo DEC-P01-002, ngôi nội tâm “mình”, đại từ “anh” và nụ cười méo xệch trên gương
    mặt rã rời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000219: locks: [''Giữ dấu
