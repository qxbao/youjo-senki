segment_id_end: YS-LN03/Text/chapter005_002.xhtml/p000103
choices:
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073: locks: [''Giữ hai
    cấu trúc phủ định liên tiếp: `chưa từng xảy ra bao giờ, và họ cũng chẳng hề lường
    trước được nó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000074: locks: [''Giữ câu
    thoại cảm thán và câu hỏi sửng sốt: `“Quả thực rất kỳ lạ. Trời đất ơi, rốt cuộc
    chuyện gì đã xảy đến với chúng vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000075: locks: [''Giữ phủ
    định `không thể chỉ ngồi đó than khóc mà không chịu hành động`, nhận định `luôn
    tận tụy không mệt mỏi với bổn phận của mình` và hành động `gom góp toàn bộ trí
    tuệ lại với nhau`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000076: locks: [''Giữ câu
    hỏi điều kiện gợi ý trong ngoặc kép: `“Nếu chúng ta muốn khôi phục đức tin, hay
    là cử… các vị biết đấy, kẻ đó đi thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000077: locks: [''Giữ cụm
    `tôi tớ của Thượng đế` và cấu trúc nhấn mạnh bổ sung `đối với chỉ một cá nhân,
    mà lại còn là một con người nữa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000078: locks: [''Giữ lời
    dẫn trong ngoặc đơn `‘Hãy thấu hiểu ý chỉ của Thượng đế.’`, chính xác phạm vi
    chữ nghiêng `*Homo sapiens*` theo DEC-P01-002 và quan hệ thời gian `chỉ làm được
    điều đó sau khi chúng ta căn dặn chúng nhiều lần và rốt cuộc chúng mới chịu lắng
    nghe`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000079: locks: [''Giữ câu
    hỏi đề xuất ngắn: `“Vậy thì cứ tiếp tục kêu gọi chúng thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000080: locks: [''Giữ phủ
    định `Không, chúng ta không thể cứu rỗi chúng theo cách đó được.`, cụm `những
    linh hồn vô tín` và nhận định `sẽ đi ngược lại ý chỉ của Thượng đế`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000081: locks: [''Giữ cụm
    `thiện ý tuyệt đối` và dấu ngoặc kép quanh cụm `“cách thức thường lệ”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000082: locks: [''Giữ câu
    hỏi tu từ phủ định `chẳng phải cách tốt nhất là... hay sao?`, chính xác chữ nghiêng
    `*Homo sapiens*` theo DEC-P01-002 và cụm `ân sủng của ngài thông qua những thử
    thách`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000083: locks: [''Giữ cách
    quy chiếu `vị cherub` – `ông ta`, mức độ `đôi chút thành công` và sự đồng thuận
    của những người khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000084: locks: [''Giữ ngôi
    tự xưng `Ta`, cụm `kẻ đó`, `tôi tớ của Thượng đế` và `sự cải đạo`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000085: locks: [''Giữ quan
    hệ nhượng bộ giữa thái độ `nhìn chung vốn dửng dưng với từng cá nhân` và việc
    `đã và đang để mắt tới một kẻ trong số đó`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000086: locks: [''Giữ quan
    hệ nhân quả `Vì kết quả là đức tin vốn đã đang tăng trưởng nhờ cách đó, nên trong
    trường hợp này cũng rất đáng để thử.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000087: locks: [''Giữ lời
    can lễ phép `Xin hãy khoan đã.`, phủ định `không nên chỉ dành riêng cho một cá
    nhân đơn lẻ`, thuật ngữ `Sự giác ngộ`, ngôi tự xưng `tôi` và vế bổ sung `đáp lại
    lời cầu nguyện của những tín đồ sùng đạo sâu sắc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000088: locks: [''Giữ chính
    xác phạm vi chữ nghiêng `*kẻ đó*` theo DEC-P01-002, cụm `ân sủng của Thượng đế`
    và sự nhấn mạnh `hoàn toàn xuất phát từ thiện ý`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000089: locks: [''Giữ toàn
    bộ đoạn văn in nghiêng `*Chúng ta phải cải đạo chú cừu non đã lãng quên ánh sáng
    che chở và vinh quang của Thượng đế. Và chúng ta phải cứu rỗi những ai biết cầu
    nguyện.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000090: locks: [''Giữ lời
    thoại ngắn gọn: `“Vậy thì cứ làm thế đi. Còn chi tiết cụ thể thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000091: locks: [''Giữ nhận
    định `Họ là những đấng cứu rỗi.`, cụm `ân sủng của ngài` và cấu trúc phủ định
    kép ở câu cuối `Không, vì chẳng một ai có đôi tai để lắng nghe những lời phản
    kháng ấy, nên cũng sẽ chẳng có ai chỉ ra rằng họ nên lắng nghe cả.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000092: locks: [''Giữ sắc
    thái phỏng đoán `có lẽ đó là sự khác biệt về góc nhìn` và mức độ phủ định `hầu
    như cũng chẳng có khả năng lắng nghe ý kiến của các sinh vật phi nhân loại`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000093: locks: [''Giữ câu
    hỏi `“Chúng ta có nên thỉnh ý bảo tọa không?”` và thuật ngữ `bảo tọa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000094: locks: [''Giữ ngôi
    tự xưng `Ta` và tôn xưng `Chúa` trong câu: `“Được thôi. Ta sẽ bẩm trình chuyện
    này lên Chúa.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000095: locks: [''Giữ phủ
    định `mà không vấp phải bất kỳ một ý kiến phản đối nào`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000096: locks: [''Giữ dòng
    mốc thời gian viết hoa toàn bộ: `NGÀY 22 THÁNG 8, NĂM THỐNG NHẤT 1925`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000097: locks: [''Giữ các
    danh xưng `chính quốc của Cộng hòa`, `Đế quốc`, `Liên minh Hiệp ước`, `Cộng hòa`,
    `Công quốc` và chính xác phạm vi chữ nghiêng `*Chúng ta là Reich, vương miện của
    thế giới*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000098: locks: [''Giữ danh
    xưng `Khối Thịnh vượng chung`, `Cộng hòa`, các cấu trúc phủ định (`cũng không
    đủ để làm nguội đi`, `Khi không có giao tranh lớn hay hải chiến nào nổ ra, chẳng
    một ai nghĩ rằng`) và câu nói truyền miệng `“Họ tham chiến quá muộn màng rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000099: locks: [''Giữ các
    danh xưng `Khối Thịnh vượng chung`, `Đế quốc`, trạng thái `hoang mang` và cấu
    trúc phủ định `Họ không tài nào hiểu nổi điều gì đã khiến cuộc chiến trở nên thú
    vị đến mức Khối Thịnh vượng chung lại nôn nóng muốn tiếp tục nó đến thế.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000100: locks: [''Giữ các
    danh xưng `Đế quốc`, `Quân đội Cộng hòa Tự do`, `Cộng hòa` và chi tiết `đang cầm
    cự yếu ớt tại một số thuộc địa của Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000101: locks: [''Giữ cụm
    `Khối Thịnh vượng chung cùng các vương quốc trực thuộc` và `Quân đội Cộng hòa
    Tự do`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000102: locks: [''Giữ chính
    xác phạm vi chữ nghiêng `*Tại sao họ lại hứng thú với việc tiếp tục cuộc chiến
    đến vậy?*` theo DEC-P01-002, cùng các danh xưng `Lục quân Đế quốc`, `Quân đội
    Liên minh Hiệp ước`, `quân đội của Công quốc` và `Lục quân Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000103: locks: [''Giữ mệnh
    đề nhượng bộ `mặc dù các điều khoản của Đế quốc rất khắc nghiệt`, các cụm `đám
    tàn quân Cộng hòa ngoan cố`, `Khối Thịnh vượng chung cứng đầu` và tiến trình cảm
    xúc `lúc đầu chỉ gây khó chịu, nhưng rồi dần trở nên chọc giận họ`.'']'
  non_canon: true
