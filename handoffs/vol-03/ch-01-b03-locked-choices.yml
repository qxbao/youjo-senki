choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000055
  kind: locked_constraint
  value: Giữ chủ thể “bộ tham mưu” và “hai vị chuyên gia uy tín về chiến tranh cơ
    động quy mô lớn”, tình thái “dường như đang đề xuất chiến dịch này như một nước
    đi thực tế” và cấu trúc điều kiện thời gian “chỉ sau khi đọc kỹ thì họ mới vỡ
    lẽ rằng kế hoạch phi lý ấy lại đáng để cân nhắc nghiêm túc”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000056
  kind: locked_constraint
  value: Giữ tình thái nhượng bộ miễn cưỡng “có lẽ khả thi”, tên đơn vị “Tiểu đoàn
    Pháp sư Trên không số 203”, cấp bậc và tên riêng “Thiếu tá Tanya von Degurechaff”,
    sự chuyển dịch biệt danh từ “Bạch Ngân” sang “Ngân Gỉ” trong dấu ngoặc kép (không
    in nghiêng), cùng thuật ngữ “thiết bị gia tốc bổ sung” và hai tính năng vọt lên
    độ cao không thể bị đánh chặn, đạt tốc độ cắt đuôi mọi kẻ truy kích.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000057
  kind: locked_constraint
  value: Giữ cụm giới hạn tình thái “Ít nhất là trên giấy tờ”, thuật ngữ “thông số
    kỹ thuật của thiết bị gia tốc bổ sung”, “những chiến tích tích lũy được của đơn
    vị” và hệ quả làm đề xuất đủ sức hấp dẫn để đem ra bàn thảo.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000058
  kind: locked_constraint
  value: Giữ chủ thể “các sĩ quan hoạch định” và “Zettour và Rudersdorf”, hai lần
    nhấn mạnh chữ nghiêng đúng ở cụm tên tiếng Đức `*Schrecken und Ehrfurcht*` kèm
    phần dịch nghĩa trong ngoặc kép `(“Kinh hoàng và Khiếp sợ”)` ở lần đầu theo DEC-P01-002,
    tên riêng “Chiến dịch Lock Pick” và mệnh đề điều kiện phủ định “sẽ chẳng có hy
    vọng thực hiện trót lọt Chiến dịch Lock Pick nếu Chiến dịch *Schrecken und Ehrfurcht*
    không thành công”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000059
  kind: locked_constraint
  value: Giữ câu phủ định mở đầu “Đó không phải là một cuộc tranh cãi nhỏ”, các thuật
    ngữ “Chiến dịch Lock Pick”, “Bộ Tổng tham mưu”, “mặt trận Rhine”, hình ảnh ẩn
    dụ “vượt qua sông Rubicon từ lâu rồi” và quan hệ phụ thuộc của ván cược ban đầu
    vào chiến dịch đầy may rủi này.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000060
  kind: locked_constraint
  value: Giữ thuật ngữ “Bộ Tổng tham mưu”, chi tiết các cuộc tranh luận cả trong lẫn
    ngoài phòng họp chia rẽ cơ quan này thành hai nửa, và câu nhận định phủ định mức
    độ ở cuối đoạn.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000061
  kind: locked_constraint
  value: Giữ hình ảnh so sánh như một trận đấu vật khi các sĩ quan túm ve áo và chửi
    rủa đồng cấp, cùng chi tiết nhiều sĩ quan được báo cáo chính thức là đã “bị ngã”
    trong dấu ngoặc kép.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000062
  kind: locked_constraint
  value: Giữ chủ thể “Bộ Tổng tham mưu”, mục tiêu cốt lõi “tấn công trực tiếp vào
    tổng hành dinh địch” và mệnh đề nhượng bộ giả định “ngay cả khi họ không thể xóa
    sổ nó hoàn toàn, thì riêng nỗ lực tấn công thôi cũng vẫn sẽ gây ra sự hỗn loạn
    rất lớn”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000063
  kind: locked_constraint
  value: Giữ tình thái nhượng bộ “Đó có thể là một cuộc xung phong một chiều viển
    vông”, chủ thể “Lục quân Cộng hòa”, thuật ngữ “đơn vị pháp sư trên không” và mốc
    thời gian kéo dài về sau “kể từ đó về sau”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000064
  kind: locked_constraint
  value: Giữ mệnh đề nhượng bộ “ngay cả khi cuộc tấn công thất bại”, các chủ thể và
    thuật ngữ “Lục quân Đế quốc”, “đòn tấn công chặt đầu”, “quân Cộng hòa”, “tổng
    hành dinh mặt trận Rhine”, cùng hệ quả buộc đối phương phải bố trí thêm lực lượng
    ít ỏi quý giá ở hậu phương để phòng bị.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000065
  kind: locked_constraint
  value: Giữ cụm trong ngoặc kép “thử còn hơn không”, phủ định giảm nhẹ “chẳng có
    vẻ gì là một ý tồi” và hệ quả tối thiểu “Ít nhất thì họ cũng sẽ ghìm chân được
    thêm quân địch ở hậu phương”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000066
  kind: locked_constraint
  value: Giữ chủ thể “Một số sĩ quan”, cấp bậc và họ “Thiếu tá von Degurechaff” và
    dấu nhấn mạnh chữ nghiêng đúng ở toàn bộ mệnh đề suy nghĩ cuối đoạn `*Thiếu tá
    von Degurechaff có khi lại thực sự vắt ra được những kết quả còn tốt hơn thế nữa.*`
    theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000067
  kind: locked_constraint
  value: Giữ phủ định kép mở đầu “không ai có thể phủ nhận đây là một chiến dịch đầy
    rủi ro”, giả định trường hợp tệ nhất mất sạch đội quân tinh nhuệ trong một nhiệm
    vụ vô ích, và sự đối lập giữa việc mối đe dọa vẫn còn đó với cái giá quá đắt phải
    trả.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000068
  kind: locked_constraint
  value: Giữ chủ thể “Bộ Tổng tham mưu”, hình ảnh “đứa con cưng không thể thay thế”
    luôn được giữ kè kè bên mình và định danh “đơn vị phản ứng nhanh với bề dày kinh
    nghiệm thực chiến”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000069
  kind: locked_constraint
  value: Giữ tên đơn vị “Tiểu đoàn Pháp sư Trên không số 203”, chủ thể “Bộ Tổng tham
    mưu”, hình ảnh “con ngựa thồ đắc lực đúng nghĩa” và cấu trúc phủ định “Cũng không
    thể phớt lờ những đóng góp ít hào nhoáng hơn nhưng không kém phần thiết yếu của
    đơn vị này trong lĩnh vực thử nghiệm các chiến thuật mới và đánh giá các loại
    vũ khí mới”.
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000070
  kind: locked_constraint
  value: Giữ phủ định “Đây không phải là kiểu đơn vị có thể nhân bản chỉ sau một đêm”,
    quan hệ đối lập tạo nên mâu thuẫn, quyết định của “Bộ Tổng tham mưu” chỉ phái
    đi “một đại đội” và hai yếu tố được cân nhắc là số lượng binh lính họ yên tâm
    điều động cùng quân số cần thiết để thành công.
  non_canon: true
