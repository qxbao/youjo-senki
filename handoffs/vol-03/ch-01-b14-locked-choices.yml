source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: e8bb92e3588ccd3ef17eab0c527eba21598c87f51945803cbd8af6ffce8dbca7
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156: locks: [''Giữ sự
    chuyển đổi điểm nhìn từ độc thoại nội tâm ngôi thứ nhất (“mình”) ở câu đầu sang
    trần thuật ngôi thứ ba (“Tanya”) ở câu hai theo DEC-P01-001, cùng nhận định đây
    là địa điểm đã được chỉ định nên phải hành động thật nhanh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000157: locks: [''Giữ đại
    từ nội tâm “mình” theo DEC-P01-001, cụm “lối tư duy quan liêu”, nhận định cho
    nổ tung cơ sở vô giá trị này cũng chẳng được tính là thành tích gì và mong muốn
    nguyền rủa “bộ phận Tình báo” vì truyền đạt thông tin sai lệch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000158: locks: [''Giữ nguyên
    câu kết luận ngắn gọn: “Thế nên giờ có nói về chuyện đó cũng chẳng ích gì.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000159: locks: [''Giữ đại
    từ nội tâm “mình” ở câu đầu, chủ thể trần thuật “Tanya” / “nó” ở hai câu sau theo
    DEC-P01-001, dấu nhấn mạnh chữ nghiêng `*Ăn cứt đi!*` theo DEC-P01-002 và hình
    ảnh “một bánh răng có kỷ luật của một quốc gia hiện đại” không có khái niệm quyền
    từ chối.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000160: locks: [''Giữ chủ
    thể “Tanya” và đại từ “Nó” theo DEC-P01-001 cùng mệnh lệnh phải thổi bay tòa nhà
    bê tông tẻ nhạt kia thành từng mảnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000161: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và phủ định tuyệt đối rằng nó chẳng mảy may cảm thấy
    một chút tội lỗi nào khi phải tiêu diệt bốn tên lính gác ít ỏi này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000162: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và chuỗi lập luận duy lý về “ý chí của nhà nước”, “quyền
    lực của quốc gia” vận hành “cỗ máy chiến tranh”, cùng mệnh đề “Súng không bắn
    người. Con người mới bắn súng—và chính quân đội, theo lệnh của nhà nước, là bên
    đưa ra những mệnh lệnh đó cho họ.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000163: locks: [''Giữ quan
    hệ nhân quả lạnh lùng từ việc bóp cò phóng đạn chì khỏi nòng súng dẫn tới kết
    quả tự nhiên là “bốn khối protein từng có sự sống đổ gục xuống”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000164: locks: [''Giữ nguyên
    khẩu lệnh báo cáo ngắn gọn: “An toàn!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000165: locks: [''Giữ chủ
    thể “Tanya”, đại từ sở hữu “của nó” theo DEC-P01-001, các thuật ngữ “trung đội”,
    “quân cảnh” và sự đánh giá cao kỹ năng điêu luyện cùng tinh thần cảnh giác của
    thuộc cấp bất chấp mục tiêu vô giá trị.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000166: locks: [''Giữ chủ
    thể “Tanya”, đại từ “Nó” / “của mình” theo DEC-P01-001 và thuật ngữ “súng tiểu
    liên” thuận tiện khi xoay xở tác chiến trong nhà.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000167: locks: [''Giữ đại
    từ “Nó” theo DEC-P01-001, định danh “sĩ quan Liên minh Entente”, phép so sánh
    vừa vặn với vóc dáng cơ thể nó hơn là “súng trường” và chi tiết nó chẳng mấy sẵn
    lòng thừa nhận lợi điểm đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000168: locks: [''Giữ sự
    đối lập giữa kỳ vọng ca khúc khải hoàn với nỗi thất vọng tràn trề và trạng thái
    hoang mang khi Tanya cùng toàn đội chuyển sự chú ý vào lục soát bên trong tòa
    nhà.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000169: locks: [''Giữ nguyên
    nhận xét quan sát: “Đúng như dự đoán, theo một nghĩa nào đó, tòa nhà bỏ không
    và hầu như chẳng có dấu hiệu sử dụng nào.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000170: locks: [''Giữ nguyên
    câu bổ sung ngắn: “Hay thực chất là hoàn toàn trống rỗng.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000171: locks: [''Giữ chủ
    thể “Tanya” và đại từ “nó” theo DEC-P01-001, chi tiết tòa nhà vẫn được giữ sạch
    sẽ nhưng gần như trống không, cùng những tờ ghi chú trên tường và cuốn lịch đều
    là tàn tích từ gần một năm trước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000172: locks: [''Giữ chủ
    thể “Tanya”, đại từ sở hữu “của mình” theo DEC-P01-001, chi tiết tủ và két sắt
    bị bỏ mở toang và kết luận khu vực này đã bị đóng cửa bỏ hoang từ lâu vì nằm quá
    xa “căn cứ chính”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000173: locks: [''Giữ đại
    từ nội tâm “Mình” theo DEC-P01-001 và nhận định đây đơn thuần là một thất bại
    toàn tập của “bên Tình báo”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000174: locks: [''Giữ đại
    từ nội tâm “mình” và “chúng ta” theo DEC-P01-001, hình ảnh ẩn dụ “rút trúng thăm
    độc đắc”, dấu ba chấm lửng sau “kho đạn…” và nỗi thất vọng nhẹ vì không thể cho
    nổ tung kho đạn để gây hỗn loạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000175: locks: [''Giữ cụm
    trích dẫn trong ngoặc đơn ‘Chúc may mắn lần sau’, đại từ “chúng ta” và mệnh lệnh
    cho nổ tung cơ sở theo đúng lệnh cấp trên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000176: locks: [''Giữ nguyên
    câu đáp điều lệnh của cấp dưới: “Rõ. Vậy để đề phòng bất trắc, tôi sẽ đứng canh
    gác.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000177: locks: [''Giữ định
    danh cấp bậc “Thiếu úy Serebryakov”, “Trung úy Weiss” (quy chiếu ngôi ba bằng
    “anh ta”), đại từ “Chúng ta” và chỉ thị báo tin mục tiêu này là đồ xịt trước khi
    tiến tới mục tiêu tiếp theo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000178: locks: [''Giữ nguyên
    câu đáp điều lệnh ngắn gọn: “Rõ.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000179: locks: [''Giữ đại
    từ “tôi”, “chúng ta”, dấu ba chấm ngắt nhịp và câu hỏi thảng thốt khi phát hiện
    “tín hiệu ma lực”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000180: locks: [''Giữ chủ
    thể “Tanya”, đại từ trần thuật “nó” và phản thân “mình” theo DEC-P01-001, cùng
    lời phân tích việc xử lý đám lính gác quá nhàn nhã trái với dự tính về một trận
    chiến ác liệt đã làm lệch trực giác khiến nó bỏ sót thứ ngay dưới mũi mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000181: locks: [''Giữ nguyên
    câu trần thuật ngắn: “Vào khoảnh khắc ấy, Tanya bị bất ngờ vì mất cảnh giác.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000182: locks: [''Giữ nguyên
    câu chuyển ý ngắn: “Nhưng ngược lại, chuyện chỉ dừng ở mức đó mà thôi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000183: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, dấu ngoặc kép quanh cụm “một người nào đó” và lập luận
    quyết đoán rằng đang ở lãnh thổ địch nên không cần thêm thông tin nào khác để
    phán đoán tình hình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000184: locks: [''Giữ đại
    từ “nó” và “mình” theo DEC-P01-001, quá trình ghi nhận kẻ tập kích và phản xạ
    đáp trả với độ chính xác gần như máy móc ngay tích tắc tên địch phóng ánh mắt
    thù địch về phía mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000185: locks: [''Giữ đại
    từ “Nó” theo DEC-P01-001, các thuật ngữ “thuật thức gây nhiễu”, “súng tiểu liên”
    và hành động khai hỏa ngay lập tức để chế áp căn phòng.'']'
  non_canon: true
