choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199: locks: [''Giữ chức
    danh `trưởng bộ phận hậu cần`, đại từ `ông ta` / `gã`, chi tiết sự kiên nhẫn của
    `de Lugo` bị đẩy tới sát giới hạn và câu hỏi nội tâm in nghiêng ở cuối đoạn theo
    `DEC-P01-002`: `*Các người đã cai quản thuộc địa này bao nhiêu năm rồi hả?!*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000200: locks: [''Giữ việc
    một số đơn vị bị cắt cử đi bảo vệ lợi ích riêng của đám tướng lĩnh, nhận xét điều
    mấy gã đần độn coi phục vụ ở thuộc địa như thời gian nghỉ dưỡng tới rồi mặc kệ
    chúng, và hệ quả quân lính không thể cơ động tự do vì lợi ích của đám tướng lĩnh
    gắn chặt vào quá nhiều tài sản thuộc địa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000201: locks: [''Giữ câu
    chuyển ngắn: `Vậy nên de Lugo đã đưa ra quyết định.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000202: locks: [''Giữ ẩn
    dụ nối mạch trực tiếp với `p000197`: `Nếu chiếc bình rượu của mình đã cũ, cách
    duy nhất là kiếm một chiếc bình mới.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000203: locks: [''Giữ lời
    hỏi xác nhận của de Lugo với đúng một từ in nghiêng theo `DEC-P01-002`: `“Xin
    lỗi, *tất cả* các vị đều phản đối sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000204: locks: [''Giữ chính
    xác hai câu đầu in nghiêng theo `DEC-P01-002` (`*Vả lại, một khi mệnh lệnh đã
    ban xuống thì không được phép phản đối. Các người lấy đâu ra cái gan chống đối
    thế hả?*`) và mệnh đề trần thuật về việc `Ông ta` đã nghĩ vậy từ khá lâu nhưng
    luôn tự kìm mình lại cho đến tận hôm nay.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000205: locks: [''Giữ lời
    khẳng định của phe tướng lĩnh thuộc địa: `“Phải, việc phòng thủ các vị trí trọng
    yếu là tối quan trọng.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000206: locks: [''Giữ câu
    phản đối tập thể xưng `Chúng tôi`: `“Chúng tôi không thể tán thành một chiến dịch
    như thế này được.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000207: locks: [''Giữ nhận
    định đám tướng lĩnh thuộc địa chỉ chăm chăm vào lợi ích riêng, mong muốn cho `quân
    cảnh` (hoặc tự tay mình) vạch trần chúng, ưu tiên hàng đầu loại bỏ những tên tướng
    bất tài khỏi `hệ thống chỉ huy` khi kẻ địch ở ngay trước mắt, và việc không bận
    tâm dù phải ban phát vài `suất hạ cánh an toàn béo bở`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000208: locks: [''Giữ cụm
    `cải tổ nhân sự`, việc các đơn vị dưới quyền chúng `trên thực tế` đã nằm trong
    tay `ông ta`, dập tắt từ trong trứng nước khả năng kháng cự quân sự, và việc `Đội
    ngũ hạ sĩ quan và sĩ quan cấp thấp` là những người đầu tiên được lôi kéo về phía
    mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000209: locks: [''Giữ thuật
    ngữ `cơ cấu chỉ huy` của `quân đội thuộc địa` đã tập kết, chi tiết có nhiều `hạ
    sĩ quan và binh sĩ cấp dưới` ưu tú, chế độ luân chuyển một đến hai năm, và thuận
    lợi khi phần lớn bọn họ tuân theo mệnh lệnh từ `Trung ương`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000210: locks: [''Giữ việc
    `de Lugo` nắm chắc quyền kiểm soát `các đơn vị đào thoát`, nắm chắc phần thắng
    trong việc `cải tổ nhân sự` và `thống nhất hệ thống chỉ huy` nên không còn lý
    do chần chừ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000211: locks: [''Giữ chính
    xác câu độc thoại nội tâm in nghiêng ở đầu đoạn theo `DEC-P01-002` (`*Tất cả những
    gì mình cần làm là bãi nhiệm đám người này.*`) và mệnh đề trần thuật giữ `giọng
    điệu công vụ bình thản` tiến hành kế hoạch đã vạch sẵn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000212: locks: [''Giữ lời
    thoại giả vờ nhượng bộ với cặp xưng hô `Tôi` – `các vị`: `“Tôi tin là mình đã
    nắm rõ tình hình. Nếu các vị đã kịch liệt phản đối đến thế thì tôi cũng đành chịu.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000213: locks: [''Giữ câu
    hỏi lại của tướng thuộc địa: `“Tướng de Lugo, ý ngài là ngài đã hiểu rồi sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000214: locks: [''Giữ lời
    đáp lịch sự nhưng mang tính gài bẫy của de Lugo với cặp xưng hô `Tôi` – `các vị`
    về việc khó lòng chỉ huy một chiến dịch mà họ phản đối gay gắt và không muốn gây
    sức ép buộc họ làm chuyện đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000215: locks: [''Giữ nhịp
    kết thúc chóng vánh, việc `ông ta` phải chuẩn bị xong xuôi trước khi phần lớn
    đám tướng lĩnh nhận ra có điều bất thường, và con bài tẩy của `de Lugo`: `quyền
    kiểm soát nhân sự`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000216: locks: [''Giữ thông
    báo điều chuyển nhân sự với cặp xưng hô `Tôi` – `các vị`, cho phép đi nhận nhiệm
    vụ ngay trong tình trạng hiện tại để phục vụ tại `văn phòng chính quyền` với tư
    cách `cố vấn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000217: locks: [''Giữ lời
    giải thích chức `cố vấn` trong `chính quyền thuộc địa` trên `lục địa phía nam`
    là một `chức nhàn bổng hậu` để ngồi sưởi ấm ghế cạnh cửa sổ tại `văn phòng chính
    quyền`, thường trao cho người `mất tích khi làm nhiệm vụ` cho tới khi tìm thấy
    trừ phi bị tuyên bố tử trận.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000218: locks: [''Giữ ý nghĩa
    tuyên bố sự có mặt hay vắng mặt chẳng có ý nghĩa gì, quyết định bổ nhiệm mặc định
    người nhận chức vắng mặt, dấu gạch ngang dài `—chuyện vốn dĩ hết sức tự nhiên
    vì đó là vị trí dành cho người mất tích khi làm nhiệm vụ` và câu kết chẳng ai
    trông đợi người `mất tích khi làm nhiệm vụ` giải quyết được công việc gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000219: locks: [''Giữ nguyên
    dấu ngoặc kép đôi biểu thị tiếng đồng thanh sửng sốt: `““Tướng de Lugo?!””`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000220: locks: [''Giữ cảnh
    đám tướng lĩnh làm ầm ĩ khi nhận ra sự tình và thái độ của `de Lugo` chẳng có
    mảy may ý định lắng nghe họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000221: locks: [''Giữ việc
    `Ông ta` đã có sẵn quyết định bổ nhiệm bằng văn bản, sự hậu thuẫn của các `sĩ
    quan cấp trung` trọng yếu nắm các đơn vị ngoài thực địa, và lý do thực thi quyền
    hạn nhân sự ép thông qua cải tổ để giải quyết vấn đề mà không biến tướng thành
    cuộc đấu đá phiền toái.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000222: locks: [''Giữ lời
    chào từ biệt công vụ pha chút mỉa mai với cặp xưng hô `tôi` – `các vị`: mệnh lệnh
    điều động đã thu xếp xong, xin phép đi chỉ huy chiến dịch và chúc thành công trên
    cương vị mới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000223: locks: [''Giữ giọng
    điệu cho thấy quyết định không thể đảo ngược, hành động đứng phắt dậy đặt tay
    lên cửa rời đi trong cảm giác sảng khoái phớt lờ tiếng la lối hoảng hốt phía sau,
    và bảo toàn chính xác câu độc thoại nội tâm in nghiêng ở cuối đoạn theo `DEC-P01-002`:
    `*Mình đã cho bọn chúng một bài học nhớ đời.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000224: locks: [''Giữ quyết
    tâm của `Ông ta` không để chúng gây rối loạn trong quân đội hay để bất cứ ai ngáng
    đường mình, và hành động của `de Lugo` đi thẳng sang căn phòng khác nơi những
    người khác đang túc trực chờ lệnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000225: locks: [''Giữ lời
    chào trang trọng mở đầu cuộc họp tác chiến: `“Thưa các quý ông, thứ lỗi vì đã
    để các vị phải chờ đợi. Chúng ta hãy bắt đầu triển khai chiến dịch này thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000226: locks: [''Giữ hình
    ảnh các `chỉ huy tác chiến` đứng nghiêm chào, sự kết hợp giữa những người từ `chính
    quốc` và từ các `thuộc địa` tạo thành `bộ tham mưu` của `ông ta`, định danh `Lục
    quân Cộng hòa, Lục quân Cộng hòa Tự do`, và câu kết họ đã chọn `de Lugo` để tiến
    hành tác chiến có tổ chức.'']'
  non_canon: true
