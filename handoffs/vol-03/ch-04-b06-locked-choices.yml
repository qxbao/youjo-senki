choices:
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142: locks: [''Giữ câu
    hỏi cảm thán không in nghiêng `Nhưng giờ lại là cái quái gì đây?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000143: locks: [''Giữ lời
    nhận xét của Zettour gộp Tanya và chỉ huy căn cứ là `cả hai người` / `đôi bên`,
    cùng cách gọi `Thiếu tá` – `cô`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000144: locks: [''Giữ đại
    từ `nó` quy chiếu Tanya, `ông` quy chiếu Zettour, `mình` trong nội tâm theo DEC-P01-001,
    và chính xác câu hỏi độc thoại nội tâm in nghiêng ở cuối đoạn `*Tất cả các sĩ
    quan cấp trên của mình rốt cuộc bị làm sao thế không biết?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000145: locks: [''Giữ lời
    trấn an ngắn của Zettour `“Sao thế? Đừng lo lắng, Thiếu tá.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000146: locks: [''Giữ đại
    từ `ông` quy chiếu Zettour và `nó` quy chiếu Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000147: locks: [''Giữ lời
    Zettour (`Chúng ta`, `cô`) và cụm từ `sự kết thúc của cuộc chiến` để liên kết
    trực tiếp với `p000148`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000148: locks: [''Giữ đại
    từ `nó`, tên `Tanya`, cụm trong ngoặc kép `“sự kết thúc của cuộc chiến”` và chính
    xác câu cuối in nghiêng `*Chuyện đó sẽ không xảy ra đâu.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000149: locks: [''Giữ đại
    từ `nó` / `mình` và mạch hành động ngoảnh mắt nhìn ra cửa sổ vì khó giữ nổi nét
    mặt bình thản rồi nhận ra mình đã lầm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000150: locks: [''Giữ định
    danh `Các sĩ quan tham mưu`, đại từ `nó` và sự tương phản giữa vẻ hân hoan ngất
    ngây của đám sĩ quan với nỗi đau khổ quặn thắt của Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000151: locks: [''Giữ các
    định danh `mặt trận Rhine`, `Parisii`, `sảnh bia` và ý kéo nhau tới sảnh bia để
    buông thả bản thân một lần vì quá đỗi hạnh phúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000152: locks: [''Giữ từ
    cảm thán mở đầu in nghiêng `*À.*` theo DEC-P01-002 và câu trần thuật `Tanya chợt
    vỡ lẽ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000153: locks: [''Giữ định
    danh `Thiếu tướng von Zettour`, đại từ `ông` và nhận định về con người thực dụng
    luôn nhìn nhận khách quan, quy về những con số hay dữ liệu thống kê khi cần thiết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000154: locks: [''Giữ câu
    nhận định `Ngay cả ông ấy cũng đang say trong men chiến thắng ngọt ngào.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000155: locks: [''Giữ dấu
    ba chấm mở đầu, sắc thái phỏng đoán `Có lẽ`, đại từ `ông ấy` và chính xác giới
    từ nhấn mạnh in nghiêng `*bằng*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000156: locks: [''Giữ đại
    từ `ông ấy`, định danh `Cộng hòa`, cấu trúc tăng tiến `chẳng những vô ích đối
    với Cộng hòa mà còn có hại` và suy luận điều kiện ở câu sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000157: locks: [''Giữ dấu
    ba chấm mở đầu, định danh `Tướng von Zettour`, `người Cộng hòa` và bộ ba `cơ hội
    thắng thua, tính hợp lý hay sự lời lỗ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000158: locks: [''Giữ tên
    `Tanya`, đại từ `nó` và câu hỏi tự vấn khách quan về `kết cục của việc bị vố Dunkirk`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000159: locks: [''Giữ ẩn
    dụ `những hạt giống kháng chiến`, định danh `Lục quân Đế quốc` và hai hình ảnh
    bị nghiền nát dưới gót giày hoặc bị nhổ bật gốc bởi các đợt không kích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000160: locks: [''Giữ trọn
    vẹn chuỗi ẩn dụ thực vật (`nguồn nước nuôi dưỡng từ lòng dân`, `khô héo hoàn toàn`,
    `đâm chồi kháng chiến`, `gieo xuống mảnh đất mềm của một thuộc địa`, `đơm hoa
    kết trái`) và câu kết `Đó mới là mối đe dọa thực sự.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000161: locks: [''Giữ định
    danh `Đế quốc` và nhận định khách quan rằng cục diện hiện tại vẫn là một đại thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000162: locks: [''Giữ định
    danh `Khối Thịnh vượng chung`, `Đế quốc` và chi tiết sự can thiệp cùng tối hậu
    thư.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000163: locks: [''Giữ các
    định danh `Cộng hòa`, `Liên minh Hiệp ước`, `quyền quân quản của Đế quốc`, `Dacia`,
    `Đế quốc` và sự đối sánh tốc độ trên ba mặt trận.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000164: locks: [''Giữ cụm
    mở đầu in nghiêng `*Đó là lý do*` theo DEC-P01-002, tên `Tanya`, đại từ `nó` và
    ý nhận ra điểm rẽ nhánh giữa sự thật nó biết với kết luận rút ra bằng logic trong
    thực tại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000165: locks: [''Giữ đại
    từ `nó`, các định danh `Tướng von Zettour`, `Đế quốc`, `lực lượng chủ lực của
    Cộng hòa` và ngôi `chúng ta` trong mệnh đề giải thích thái độ của Zettour.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000166: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm in nghiêng theo DEC-P01-002, định danh `Đế quốc` và
    đại từ nhân hóa `mi` dành cho Chiến thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000167: locks: [''Giữ lời
    đáp lễ phép của Tanya với Zettour (`ngài` – `tôi` / `mình`, `ạ`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000168: locks: [''Giữ lời
    chúc của Zettour `“Không sao đâu. Vậy thì, vì chiến thắng.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000169: locks: [''Giữ lời
    đáp chúc của Tanya `“Vì chiến thắng.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000170: locks: [''Giữ đại
    từ `Nó` / `mình` và chuỗi hành động đè nén cảm xúc bằng sự tự chủ thuần túy, chào
    điều lệnh đáp lễ rồi giữ đúng tác phong chuẩn mực bước ra khỏi phòng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000171: locks: [''Giữ đầy
    đủ các định danh `Thiếu tá Ma pháp Tanya von Degurechaff`, `Trung tá von Lergen`,
    `Tướng von Zettour`, đại từ `nó` quy chiếu Tanya và `ông` quy chiếu Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000172: locks: [''Giữ lời
    hỏi lễ phép của Lergen với Zettour (`Thưa Tướng quân`, `ạ`) và định danh `Thiếu
    tá von Degurechaff`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000173: locks: [''Giữ đại
    từ `Ông` quy chiếu Lergen, định danh `Thiếu tá von Degurechaff` và hình ảnh vẻ
    mặt nhăn nhó chực khóc đúng với một cô bé ở độ tuổi ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000174: locks: [''Giữ cách
    gọi tắt `Đại tá von Lergen` và đại từ `anh` trong lời hỏi lại của Zettour.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000175: locks: [''Giữ câu
    đáp của Lergen (`tôi`, `cô ấy`) và dấu ba chấm cuối câu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000176: locks: [''Giữ lời
    phỏng đoán của Zettour (`cô ấy`, `tôi`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000177: locks: [''Giữ tên
    `Zettour`, đại từ `nó` và ý Zettour sẽ chẳng bao giờ biết được sự thật rằng trông
    nó như thể sắp bật khóc vì tuyệt vọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000178: locks: [''Giữ tên
    `Zettour`, đại từ `nó` và sự đối lập giữa việc cảm nhận được có điều chưa nói
    ra với việc không trực giác nhận ra nó đã buông xuôi trong nỗi cam chịu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000179: locks: [''Giữ câu
    hỏi xin ý kiến của Lergen `“Tôi có nên gọi cô ấy quay lại không ạ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000180: locks: [''Giữ câu
    đáp của Zettour `“Không cần đâu, lần tới có dịp tôi sẽ nói chuyện với cô ấy.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000181: locks: [''Giữ đại
    từ `Ông` quy chiếu Zettour, `nó` quy chiếu Tanya và chức danh `phó cục trưởng
    Cục Hậu cần`.'']'
  non_canon: true
