task_id: vol-03-ch-02-b18
baseline_sha256: d6d928c135d8e0338d0801a2c7bbdcf3730f6e5f3dc7b162a4e24ffbab740b2b
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 81baf7c506aeb85de6d420c6be554239896b8d2dfbb15194029eabea6c1df379
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506: locks: [''Giữ định
    danh “Tanya”, “Trung úy Weiss”, đại từ trần thuật “nó” theo DEC-P01-001, các cụm
    “sở chỉ huy”, “vô tuyến tầm xa” và phép so sánh quay đầu lại tấn công tốt hơn
    nhiều so với bị truy kích từ phía sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000507: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Rhine Control”, thuật ngữ “đơn vị cảnh báo sớm”
    và mệnh lệnh “Hãy hạn chế hỏa lực của các vị.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000508: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, các thuật ngữ “quy tắc giao chiến”, “không chiến”, “đài
    kiểm soát” và nhận định bị áp đặt những giới hạn mâu thuẫn chan chát với lời cho
    phép nổ súng trước đó khiến việc tác chiến rất khó khăn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000509: locks: [''Giữ các
    cụm “Giới chóp bu”, “binh lính ngoài thực địa”, “đại đội pháp sư”, đại từ nội
    tâm tự quy chiếu “mình” theo DEC-P01-001 và hình ảnh ẩn dụ nhảy múa theo điệu
    nhạc của họ rồi rụng xuống như lá mùa thu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000510: locks: [''Giữ định
    danh “Tanya”, đại từ “nó” theo DEC-P01-001 và chi tiết định tiếp tục nài ép yêu
    cầu nhưng chợt nhận ra đang hơi mất bình tĩnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000511: locks: [''Giữ đại
    từ “Nó / nó” theo DEC-P01-001, hành động hít sâu xua đi cơn bực dọc trong lòng
    và nỗ lực không để lộ sự bất mãn khi nêu ý kiến phản đối bằng giọng điềm tĩnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000512: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Fairy 01”, “Rhine Control”, ngôi “Tôi / chúng
    tôi” và câu giả định bỏ lửng có dấu chấm lửng cuối câu về việc không thể “ra đòn
    phủ đầu…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000513: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và câu trần thuật ngắn gọn “Nhưng mọi nỗ lực của nó đều
    trở nên công cốc.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000514: locks: [''Giữ dấu
    ngoặc kép hội thoại, phần giải thích trong cặp dấu gạch ngang “—cỡ một tiểu đoàn—”,
    cụm “Các pháp sư không rõ danh tính” và lời dẫn “Một lời cảnh báo của quân ta
    vang lên qua sóng vô tuyến.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000515: locks: [''Giữ dấu
    ngoặc kép hội thoại và thuật ngữ “yêu cầu nhận dạng địch-ta”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000516: locks: [''Giữ các
    cụm “Sóng vô tuyến”, “quân ta”, “xác nhận được đơn vị đó bằng mắt thường”, định
    danh “Tanya”, đại từ “nó” theo DEC-P01-001 và dấu gạch ngang nhấn mạnh tốc độ
    ra quyết định.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000517: locks: [''Giữ các
    định danh “Chiến dịch Lock Pick”, “Vùng Đất Thấp” và “đại đội tuyển chọn thuộc
    Tiểu đoàn Pháp sư Trên không số 203”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000518: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, cụm “loa phóng thanh” và định danh “Trung úy Weiss”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000519: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách gọi “Trung úy Weiss”, ngôi “chúng ta” và mệnh lệnh báo
    cho tất cả mọi người biết việc quay lại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000520: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Chúng ta”, kính ngữ “ạ” và dấu chấm hỏi cảm thán “?!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000521: locks: [''Giữ đại
    từ “anh” quy chiếu Weiss, “nó” quy chiếu Tanya theo DEC-P01-001, ngôi “Tôi” trong
    thoại và các thuật ngữ “im lặng vô tuyến”, “tín hiệu ma lực”, cùng mệnh lệnh “Hãy
    đánh úp chúng trước!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000522: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Chúng ta” và các định danh “pháp sư thủy quân lục chiến”,
    “Hạm đội Biển khơi”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000523: locks: [''Giữ dấu
    ngoặc kép hội thoại, giả định trái hiện thực về “Hạm đội Biển khơi” và “mật khẩu”,
    cùng mệnh lệnh coi chúng là địch và xử lý.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000524: locks: [''Giữ đại
    từ “anh” quy chiếu Weiss, “nó” quy chiếu Tanya theo DEC-P01-001, các thuật ngữ
    “im lặng vô tuyến”, “cảnh báo toàn chiến trường”, “mục tiêu không xác định” và
    thông tin mục tiêu mới đến từ phía biển.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000525: locks: [''Giữ mốc
    chuyển cảnh “Cùng lúc đó” và chi tiết các chỉ huy của những đơn vị đối phương
    nhận ra năng lực của kẻ địch rồi lớn tiếng tặc lưỡi đầy bực bội.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000526: locks: [''Giữ các
    định danh “Trung tá Drake”, “Khối Thịnh vượng chung” và trạng thái đang bị đánh
    chặn khiến ông đặc biệt cay cú.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000527: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu chấm lửng mở đầu, định danh “Jeffrey” và câu cảm thán
    hỏi ý “kẻ địch không hề do dự đúng là tệ nhất, hử, Jeffrey?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000528: locks: [''Giữ cụm
    “pháp sư Đế quốc”, đại từ “ông” quy chiếu Drake và nhận định mức độ kỷ luật cao
    thể hiện qua từng động tác khiến ông cảm thấy hoàn toàn quá sức đối phó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000529: locks: [''Giữ thành
    ngữ ẩn dụ “Đi thay tã cho đám tai to mặt lớn”, đại từ “ông”, định danh “Đế quốc”
    và nguyên nhân các chính trị gia đã không đọc được nước đi của Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000530: locks: [''Giữ dấu
    ngoặc kép hội thoại, đại từ tôn xưng “Ngài” và nhận định tình hình hiện tại đã
    quá rõ ràng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000531: locks: [''Giữ các
    định danh “Đế quốc”, “Cộng hòa” và thông tin họ được tức tốc phái đi xác minh
    chuyện bất thường xảy ra trên các chiến tuyến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000532: locks: [''Giữ các
    định danh “kiểm soát viên của phe Cộng hòa”, “Đế quốc”, “Trung úy Jeffrey”, “phó
    chỉ huy của Drake”, “Lục quân Đế quốc”, “phe Cộng hòa” và kết luận Lục quân Đế
    quốc đang áp đảo phe Cộng hòa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000533: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách gọi “Chỉ huy Drake”, ngôi “chúng ta / Chúng ta” và dấu
    chấm lửng cuối câu khi nhắc lại chỉ thị tránh giao chiến nếu có thể.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000534: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu trả lời dứt khoát “Không được đâu.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000535: locks: [''Giữ định
    danh “Drake”, chức danh “phó chỉ huy”, đại từ “ông”, cụm “nụ cười bất khả chiến
    bại”, dấu chấm lửng giữa lời thoại và các thuật ngữ “xác suất đột phá được vẫn
    còn khác không”, “trinh sát chiến đấu”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000536: locks: [''Giữ định
    danh “Drake” và nhận định việc thoát thân vẫn còn khả thi nếu họ hành động nhanh
    chóng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000537: locks: [''Giữ cụm
    “đơn vị pháp sư Đế quốc”, đại từ “ông” và chi tiết đối phương lập đội hình mà
    không phát ra bất kỳ tín hiệu nào có thể dò được khiến ông không chắc việc trinh
    sát có khả thi hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000538: locks: [''Giữ dấu
    ngoặc kép hội thoại, đại từ “Ngài” và nhận xét đám người này trông có vẻ rắc rối
    kinh khủng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000539: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi / chúng ta” và câu hỏi tu từ “Nhưng chẳng lẽ chúng
    ta thực sự có thể cứ mặc kệ tình hình như hiện tại sao?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000540: locks: [''Giữ các
    định danh “Drake”, “Jeffrey”, “phe Cộng hòa”, “Khối Thịnh vượng chung”, dấu gạch
    ngang, giả định trái hiện thực “nếu được lựa chọn, chính ông cũng muốn rút lui
    lắm chứ” và hệ quả dẫn đến thảm họa nếu không nắm được lực lượng chủ lực Cộng
    hòa cầm cự được bao lâu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000541: locks: [''Giữ định
    danh “Drake” ở câu trần thuật đầu và dấu nhấn mạnh chữ nghiêng `*...*` bao quanh
    đúng hai câu độc thoại nội tâm phía sau theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000542: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Trung úy Jeffrey”, đại từ “cậu” và câu hỏi “cậu
    quên mất mình là kiểu người gì rồi sao?”.'']'
  non_canon: true
