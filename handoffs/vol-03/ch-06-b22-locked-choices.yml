choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700: locks: [''Giữ sự
    đan xen đại từ `nó` – `mình` theo `DEC-P01-001`, chi tiết `nó` cho `hai đại đội`
    giả vờ làm `đội hậu vệ` để thu hút sự chú ý của quân địch, hình ảnh ví von kẻ
    địch hừng hực khí thế giao chiến như con bò tót điên tiết lao vào tấm khăn choàng
    đỏ, và nhận xét các thuộc cấp của `nó` không mang màu đỏ nhưng `mình` từng nghe
    nói bò tót sẽ húc vào bất cứ thứ gì phất qua phất lại trước mặt chúng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000701: locks: [''Giữ mạch
    triển khai chiến thuật: mượn ví dụ đó, `họ` giả vờ không chống đỡ nổi đợt tấn
    công của địch rồi rút lui trong cảnh hỗn loạn; `Nó` để `hai đại đội` làm tấm khăn
    choàng phất qua phất lại và bị truy đuổi trong khi các đơn vị còn lại giả vờ tháo
    chạy trước mặt quân địch để kéo giãn khoảng cách.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000702: locks: [''Giữ chi
    tiết giả vờ mất sạch ý chí chiến đấu để tản ra hai bên, sau đó chỉ cần phục sẵn
    ở vị trí tối ưu rồi nhử `đám đầu gỗ` chỉ biết hùng hục lao lên kia vào tròng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000703: locks: [''Giữ mệnh
    lệnh của Tanya: bảo `Những người còn lại` tách ra và sau khi nhử quân địch vào
    `không phận D-3`, `chúng ta` sẽ tấn công từ ba hướng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000704: locks: [''Giữ diễn
    biến ngay khoảnh khắc `hai đại đội làm mồi nhử` dẫn dụ quân địch vào `D-3`, các
    đơn vị còn lại vốn đang giả vờ tháo chạy hỗn loạn sẽ vòng ngược trở lại phát động
    tấn công, lập thành `đội hình hình nón` và `đan chéo đường bắn`, đồng thời chú
    ý tránh bắn nhầm lẫn nhau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000705: locks: [''Giữ hình
    ảnh so sánh khoảnh khắc đội hình đó khép lại, quân địch sẽ chẳng khác nào chuột
    sa bẫy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000706: locks: [''Giữ lời
    hô hào của Tanya gọi thuộc cấp là `các vị` và tuyên bố đến lúc dạy cho `lũ khờ
    này` một bài học.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000707: locks: [''Giữ chi
    tiết `Tanya` hả hê reo lên rằng `họ` sẽ dạy cho `chúng` biết cảnh bị bao vây trên
    bầu trời cũng khủng khiếp chẳng kém gì dưới mặt đất, cùng lời bình châm biếm rằng
    chuyện `chúng` có cơ hội vận dụng bài học đó hay không lại thuộc về một chiều
    không gian khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000708: locks: [''Giữ cảnh
    `các pháp sư Đế quốc` trút một lượng `công thức` nhiều không tưởng vào vùng không
    phận chật hẹp đó khiến đám `quân Cộng hòa` đang hăng máu truy đuổi liền tắt thở
    rồi nối đuôi nhau rơi rụng, và nhận định đây là một chiến thắng vô cùng trơn tru
    giúp khích lệ tinh thần binh sĩ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000709: locks: [''Giữ định
    danh đầy đủ `Thiếu tá Tanya von Degurechaff` được dịp làm đẹp thêm `bảng thành
    tích` của mình mà chẳng tốn mấy công sức, cùng lời khen đó là công việc tuyệt
    vời mang lại những thu hoạch dễ dàng và đầy ấn tượng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000710: locks: [''Giữ tiếng
    cười lớn và câu thoại tự xưng `Tôi` của Tanya (`“Ha-ha-ha-ha! Tôi không nhịn được
    cười mất!”`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000711: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001` khi miêu tả trong một dịp hiếm hoi, `nó` có thể vui
    vẻ đến mức bật cười khanh khách.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000712: locks: [''Giữ đại
    từ `Nó` – `nó` theo `DEC-P01-001`, bảo toàn chính xác câu suýt thốt ra đặt trong
    `*...*` theo `DEC-P01-002` (`*Nếu từ giờ trở đi mọi chuyện cứ dễ dàng thế này
    mãi thì tuyệt biết mấy*`), và phản ứng khựng lại khi nhận ra hàm ý trong câu nói
    của mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000713: locks: [''Giữ chính
    xác cụm từ nhấn mạnh `*từ giờ trở đi*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000714: locks: [''Giữ chính
    xác toàn bộ câu hỏi tự vấn in nghiêng `*…Từ giờ trở đi ư?*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000715: locks: [''Giữ ý nghĩa
    vui quá hóa buồn, cảm giác linh cảm đáng sợ về tương lai khiến sống lưng `nó`
    lạnh toát, và hành động `Tanya` khách quan điểm lại tình cảnh hiện tại rồi lắc
    đầu với vẻ mặt lộ rõ sự cay đắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000716: locks: [''Giữ sự
    đối lập giữa việc hiện tại `chúng ta` đang giành chiến thắng dễ dàng, vừa bắn
    rụng `các pháp sư Cộng hòa` chẳng khác nào một `cuộc bắn gà tây`, với thực tế
    chiến tranh thường không như vậy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000717: locks: [''Giữ nhận
    định mọi chuyện dễ dàng đến mức này sẽ làm hỏng con người ta, và tiêu diệt đám
    quân địch ô hợp tất nhiên mang lại chiến thắng đơn giản nhưng sẽ là sai lầm nếu
    kỳ vọng mọi trận đánh đều diễn ra như thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000718: locks: [''Giữ câu
    hỏi phản tỉnh chiến lược của Tanya: trước cả chuyện đó, nếu `chúng ta` đang nắm
    ưu thế lớn đến vậy, chẳng phải `chúng ta` nên hành động để chấm dứt cuộc chiến
    sao?'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000719: locks: [''Giữ tiếng
    ngân nghi hoặc ngắn gọn `“…Hửm?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000720: locks: [''Giữ chi
    tiết `Tanya` chợt tự hỏi tại sao họ vẫn còn đang chiến đấu và bất giác rên rỉ,
    phớt lờ cả ánh mắt dò hỏi của `Thượng úy Weiss`, chìm sâu vào suy tư khi đơn vị
    quay về căn cứ rồi buộc phải thừa nhận một thực tế gây sốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000721: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001` khi hạ cánh xuống `căn cứ sa mạc`, cất khí tài, cho
    binh lính giải tán, nhấp cốc nước lạnh lấy từ bồn chứa với vẻ đăm chiêu thất thần
    và nhìn đoàn xe quân sự Đế quốc nối đuôi nhau bất tận qua lại khắp sa mạc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000722: locks: [''Giữ hình
    ảnh hàng tiếp tế từ `chính quốc` cùng những chiếc `xe tải vận chuyển` vật lộn
    trong cuộc chiến tuyệt vọng với cát bụi để góp sức vào chiến thắng của họ, và
    chi tiết sử dụng lạc đà thay vì ngựa để thồ một phần hàng hóa giúp nâng cao hiệu
    suất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000723: locks: [''Giữ nhận
    xét nỗ lực vất vả của họ đang đơm hoa kết trái và trước mắt mọi chuyện vẫn ổn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000724: locks: [''Giữ định
    danh `tàn quân Cộng hòa` cùng `lực lượng viễn chinh của Khối Thịnh vượng chung`,
    và nhận định bất kể quân số ra sao, `Lục quân Đế quốc` vẫn vượt trội về mặt huấn
    luyện nên bất kỳ trận giao chiến nào cũng cầm chắc là một `cuộc bắn gà tây`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000725: locks: [''Giữ mặt
    trái của vấn đề: nhìn theo chiều ngược lại, `chúng ta` đang lãng phí xe cộ vào
    đám kẻ địch thảm hại này và đè gánh nặng nghiêm trọng lên các `tuyến tiếp tế`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000726: locks: [''Giữ lập
    luận về ý tưởng của `Tướng von Zettour`: xét về một đợt triển khai thuần túy mang
    tính chính trị nhằm gây sức ép lên `Cộng hòa` và mở rộng tầm ảnh hưởng của `chúng
    ta` đối với `Vương quốc Ildoa`, thì một `lực lượng viễn chinh tại lục địa phía
    nam` chính là một câu trả lời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000727: locks: [''Giữ chính
    xác cụm nhấn mạnh mở đầu `*Nhưng điều đó…*` theo `DEC-P01-002` và đại từ `nó`
    theo `DEC-P01-001` khi lời đã mấp máy trên đầu lưỡi nhưng không sao thốt ra được,
    đành buông tiếng thở dài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000728: locks: [''Giữ song
    hành hai kế hoạch của `Trung tướng von Rudersdorf` (quét sạch `tàn quân Lục quân
    Cộng hòa`) và của `Trung tướng von Zettour` (kế hoạch chính trị) đều dựa trên
    giả định số lượng các thế lực lớn tham gia cuộc chiến không tăng thêm, cùng thực
    tế họ đã biến `lực lượng viễn chinh` thành hiện thực bằng mọi phương cách bất
    chấp tình hình ngặt nghèo ở `hậu phương` và binh lực hạn chế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000700
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000729: locks: [''Giữ câu
    dẫn `Tanya không khỏi lo lắng.` và bảo toàn chính xác câu độc thoại nội tâm in
    nghiêng đặt trong `*...*` theo `DEC-P01-002` (`*Xét đến tình hình tài chính, có
    lẽ kế hoạch này đang đưa chúng ta đi chệch hướng quá xa trên một lớp băng mỏng.*`).'']'
  non_canon: true
