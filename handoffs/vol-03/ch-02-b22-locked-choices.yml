choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ nội
    tâm “Mình / mình” theo DEC-P01-001, các câu hỏi “xin chào” / “Chúc ngủ ngon” trong
    ngoặc kép và ý không ngại mỉm cười chúc mọi người một ngày tốt lành.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000656: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “mình
    / chúng ta”, cấu trúc tăng tiến “không chỉ người dân Đế quốc thân yêu của chúng
    ta mà còn tới tất cả mọi người trên toàn thế giới” và cụm “ngay từ tuyến Rhine
    của Đế quốc, nơi chúng ta đang tiếp tục truy quét quân địch”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000657: locks: [''Giữ hai
    phần chữ nghiêng `*Đúng vậy*` và `*Đó là nơi từng là mặt trận Rhine. ... của các
    chiến hào.*` đúng phạm vi `<html:em>` theo DEC-P01-002, định danh “Tanya”, “mặt
    trận Rhine” và chi tiết cây cối, suối nghỉ chân đều bị pháo kích thành hư không,
    chỉ còn tàn tích chiến hào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000658: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “Mình
    / chúng ta”, các định danh “Lục quân Cộng hòa”, “Parisii” và chuỗi hành động vượt
    qua vùng đất vùi đầy xương trắng, nhử chủ lực địch vào rồi bao vây tiêu diệt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000659: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “chúng
    ta / mình”, cụm “Parisii của đám ốc sên” và danh ngữ “Reich, vương miện của thế
    giới”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000660: locks: [''Giữ hai
    câu hỏi mở đầu đoạn, các định danh “Đội tiên phong pháp sư”, “lực lượng Cộng hòa”
    và quan hệ nhân quả chiếm được các tuyến đường sắt nguyên vẹn nên thậm chí có
    cả “pháo hạng nặng”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000661: locks: [''Giữ định
    danh “Lục quân Đế quốc”, “Tanya” và niềm tin rằng cuộc tấn công sẽ tiếp diễn không
    chút trở ngại, việc chiếm thành phố chỉ còn là vấn đề thời gian.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000662: locks: [''Giữ cấu
    trúc “không chỉ các sĩ quan Lục quân Đế quốc mà sĩ quan của bất kỳ quân đội nào
    cũng từng hằng mơ ước” và chi tiết cuộc đua xem ai là người đầu tiên xông vào
    thủ đô địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000663: locks: [''Giữ các
    định danh “Tiểu đoàn Pháp sư Trên không số 203”, “đội tiên phong”, “Parisii”,
    “binh sĩ Cộng hòa” và chi tiết phát hiện địch sẵn sàng tử thủ bảo vệ thủ đô.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000664: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, định danh “Parisii”, quy mô “hai sư đoàn—những
    sư đoàn bộ binh chẳng có điểm nào giống với các đơn vị thiết giáp hay cơ giới
    hóa” và suy luận từ sự thiếu vắng người trẻ tuổi rằng đây chủ yếu là quân dự bị
    được huy động khẩn cấp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000665: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, thuật ngữ “công binh dã chiến” và sự tương phản giữa
    việc đào chiến hào ở vùng ngoại vi với các con phố nội đô cùng những dãy nhà nguyên
    vẹn phía sau chưa bị đụng tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000666: locks: [''Giữ dấu
    chấm lửng mở đầu, cấu trúc giả định trái thực tế quá khứ “Lẽ ra chí ít họ cũng
    phải tháo dỡ một số công trình để tạo tầm bắn thông thoáng cho hỏa lực phòng ngự
    và cho nổ tung các trụ cầu, nhưng họ đã không làm vậy.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000667: locks: [''Giữ sắc
    thái cảm thán cho những người bị huy động khẩn cấp và nguyên nhân chính phủ do
    dự không muốn tiến hành “tác chiến đô thị” ngay trong thủ đô.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000668: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu chấm lửng mở đầu, phép ẩn dụ “bốc phải quẻ xui trong
    trò xổ số chọn sếp”, định danh “Lục quân Đế quốc” và các đại từ “Tôi / chúng ta”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000669: locks: [''Giữ dấu
    chấm lửng mở đầu và câu điều kiện giả định quá khứ “Hoặc biết đâu nếu được huấn
    luyện bài bản và cố thủ trong những trận địa phòng ngự kiên cố có hào lũy vững
    chắc cùng sự yểm trợ của pháo hạng nặng, thì họ đã có thể trở thành một mối đe
    dọa rồi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000670: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*Còn với tình cảnh hiện tại thì…*` đúng phạm vi `<html:em>`
    theo DEC-P01-002 và mệnh đề trần thuật phẳng “Tanya thầm bật cười.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000671: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*đáng thương*` theo DEC-P01-002, các định danh “Lục quân
    Đế quốc”, “tuyến Rhine”, “Quân Cộng hòa”, “Tanya”, “Tướng von Zettour” và ý có
    các mối quan hệ con người tốt đẹp từ cấp dưới cùng cho tới tận cấp cao nhất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000672: locks: [''Giữ dấu
    ngoặc kép hội thoại, mẫu gọi vô tuyến “Fairy 01 gọi CP”, đại từ “chúng tôi” và
    thông tin bộ binh địch quy mô hai sư đoàn đang xây dựng các trận địa phòng ngự.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000673: locks: [''Giữ dấu
    ngoặc kép hội thoại, hiệu lệnh xác nhận “Nghe rõ.” và mệnh lệnh yểm trợ “sư đoàn
    thiết giáp” cho đến khi họ tới nơi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000674: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “chúng
    ta” và dấu gạch ngang.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000675: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, các định danh “bộ phận Tình báo”, “Lục quân
    Cộng hòa”, “Parisii” và nội dung tin tình báo về việc xây dựng các tuyến phòng
    ngự quanh vùng ngoại vi cùng nhiều sư đoàn khác đang tập kết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000676: locks: [''Giữ các
    đại từ “chúng ta / mình” theo DEC-P01-001, sự thay đổi từ kế hoạch “trực chiến
    chờ lệnh” sang “nhiệm vụ trinh sát và tấn công mặt đất” và nỗi phân vân giữa khoản
    phụ cấp nhận thêm với kỳ nghỉ phép bị cắt bớt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000677: locks: [''Giữ hai
    phần chữ nghiêng `*Nhưng*` và `*nhìn vào tình hình hiện tại của mình, ... một
    khoản tiền thưởng nữa.*` đúng phạm vi `<html:em>` theo DEC-P01-002, định danh
    “Tanya” và đại từ nội tâm “mình” theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000678: locks: [''Giữ dấu
    ngoặc kép hội thoại, mẫu gọi vô tuyến “Fairy 03 gọi 01”, đại từ “Tôi” và báo cáo
    đã nhập xong dữ liệu, gửi kết quả quan sát cho pháo binh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000679: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu xác nhận “Fairy 01 nghe rõ.” và mệnh lệnh tập trung quan
    sát.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000680: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng `*đến đáng ngạc nhiên*` ở cuối câu theo DEC-P01-002, danh
    từ “các quan sát viên”, các định danh “Norden”, “các pháp sư Liên minh Hiệp ước”
    và đại từ “chúng ta”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000681: locks: [''Giữ sự
    tương phản giữa vài vụ nổ thỉnh thoảng bốc khói dưới mặt đất với bầu trời xanh
    ngắt trong một ngày nắng đẹp trời.'']'
  non_canon: true
