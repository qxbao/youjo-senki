task_id: vol-03-ch-01-b10
baseline_sha256: 18e6f2935961959f2b5a6b888a141521339113070f04b1ae2d7273cc3bbdbab6
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 01a6b15762b8f772d673f472c4f18a8d092a976acaedf7cc60a66a3588c5e871
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025: locks: [''Giữ đại
    từ trần thuật “nó” quy chiếu Tanya ở câu đầu và đại từ “chúng ta” ở câu thứ hai
    theo DEC-P01-001, định danh “Elinium Arms”, cụm mô tả thiết bị “dù tự động chống
    rách, chống cháy được thiết kế cho các điều kiện khắc nghiệt” và ý nghĩa may mắn
    vì không phải dùng đến chúng trong suốt chuyến bay.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000026: locks: [''Giữ sự
    phủ định đính chính rằng vận mệnh do “con người chúng ta” tự nắm lấy bằng đôi
    tay chứ dứt khoát không phải ơn huệ ban phát từ kẻ khác, dấu nhấn mạnh chữ nghiêng
    chỉ ở đúng cụm `*may mắn*` theo DEC-P01-002, và kết luận đây là kết quả thuận
    lợi do con người tự tạo ra nhờ bảo dưỡng kỹ lưỡng và kiểm tra xác nhận triệt để.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000027: locks: [''Giữ nguyên
    khẩu lệnh vô tuyến của Tanya: “01 gọi tất cả các đơn vị. Đến giờ rồi. Khẩn trương
    đo khoảng cách và tính toán góc tiếp cận ngay lập tức.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000028: locks: [''Giữ quan
    điểm về thế giới lý tưởng nơi thành công đơm hoa kết trái nhờ bàn tay và nỗ lực
    của con người, cùng mệnh đề nhượng bộ rằng dù việc đó có chẳng mang lại năng suất
    gì thì ca ngợi sự tuyệt vời của con người cũng không cần chút giả tạo nào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000029: locks: [''Giữ nguyên
    báo cáo vô tuyến: “05 gọi 01. Đã xác định được vị trí mục tiêu.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000030: locks: [''Giữ nguyên
    báo cáo vô tuyến tiếp nối: “09 gọi 01. Tương tự. Đã xác định được vị trí mục tiêu.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000031: locks: [''Giữ nguyên
    khẩu lệnh xác nhận của Tanya: “Tuyệt vời. Tất cả các đơn vị, xác nhận đã hoàn
    tất công tác chuẩn bị tập kích.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000032: locks: [''Giữ nhận
    định chiến tranh hiếm khi diễn ra đúng kế hoạch nhưng không phải bất khả thi,
    cùng ba điều kiện: chuẩn bị kỹ lưỡng các biện pháp phòng ngừa từ trước, điều kiện
    ngoại cảnh thuận lợi, và bài trừ triệt để sự kém hiệu quả lẫn thói liều lĩnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000033: locks: [''Giữ ba
    câu cảm thán ca ngợi sự hiệu quả ở dạng văn bản phẳng không in nghiêng theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000034: locks: [''Giữ khẩu
    lệnh vô tuyến dùng đại từ điều lệnh “Tôi” (“01 gọi tất cả các đơn vị. Chuyển sang
    giai đoạn bảy. Tôi nhắc lại, chuyển sang giai đoạn bảy.”) và câu trần thuật ngôi
    thứ ba về “Tanya” khi nhận xác nhận từ thuộc cấp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000035: locks: [''Giữ câu
    định danh ngắn gọn: “Giai đoạn bảy, lệnh tập kích.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000036: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “đại đội”, định danh “V-1” và hành
    động tách khỏi V-1 rồi phóng ra ngoài ngay khi phát tín hiệu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000037: locks: [''Giữ quan
    hệ nhân quả giải thích cơ chế phóng: do lực đẩy của “V-1” bắt nguồn từ động cơ
    ở phía đuôi chứ không phải cánh quạt ở phía mũi, “các pháp sư” được phóng về phía
    trước rồi mới bắt đầu “rơi tự do”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000038: locks: [''Giữ chi
    tiết đồng thời “các thùng nhiên liệu rỗng” và “các bộ phận che chắn cho người
    ngồi” tách bỏ khỏi quả tên lửa để đóng vai trò làm “vật ngụy trang”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000039: locks: [''Giữ chủ
    thể “Tanya và các pháp sư khác” hòa lẫn vào những bộ phận bị vứt bỏ trên đà lao
    xuống, thuật ngữ “cú nhảy dù HALO¹” có bảo toàn ký hiệu chú thích chân trang `¹`
    và đánh giá đây là việc khá mạo hiểm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000040: locks: [''Giữ đại
    từ “chúng ta”, thuật ngữ “kỹ thuật HALO”, sự đối lập giữa mức bung dù thông thường
    ở khoảng “980 feet” với việc “chúng ta là pháp sư” nên rơi cùng tốc độ với các
    bộ phận tên lửa và giảm tốc ngay trước mốc “hai trăm năm mươi feet” để giảm thiểu
    đáng kể nguy cơ bị phát hiện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000041: locks: [''Giữ nhận
    định rằng điều đó chỉ có nghĩa xác suất bị phát hiện rất thấp, kế hoạch hoàn toàn
    không tính đến sự an toàn của “chúng ta” mà thuần túy dựa trên nhu cầu chiến thuật.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000042: locks: [''Giữ đại
    từ độc thoại “Mình” / “mình” theo DEC-P01-001 và ý định khi quay về sẽ bắt chính
    kẻ nghĩ ra trò này phải tự mình nếm thử.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000043: locks: [''Giữ câu
    thoại chúc phúc của Tanya: “Hỡi các binh sĩ, cầu Chúa che chở cho các vị.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000044: locks: [''Giữ đại
    từ trần thuật “Nó” / “nó” và phản thân “mình” theo DEC-P01-001, sự trớ trêu khi
    định chúc quân lính may mắn nhưng lại buột miệng nói ra câu chẳng ưa chút nào
    cùng tiếng chửi thề cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000045: locks: [''Giữ sự
    chuyển điểm nhìn từ độc thoại ngôi thứ nhất dùng đại từ “mình” ở câu đầu sang
    trần thuật ngôi thứ ba về “Tanya” ở câu thứ hai theo DEC-P01-001, cụm “vị thần
    đáng ghét kia” và lời than thở về bi kịch chiến trường hủy hoại những tâm trí
    lành mạnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000046: locks: [''Giữ đại
    từ độc thoại “mình” ở câu đầu và trần thuật “Tanya” / “nó” ở câu cuối theo DEC-P01-001,
    định danh “Elinium Type 95”, “gã nhà khoa học điên”, đại từ “ông ta” và mong muốn
    tự tay tiễn ông ta xuống thẳng địa ngục.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000047: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001 và hành động bồi thêm một câu nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000048: locks: [''Giữ câu
    thoại chữa lại của Tanya: “Được rồi, thưa các quý ngài, hãy làm cho Chúa thất
    nghiệp nào!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000049: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng mệnh đề suy nghĩ mở đầu `*Thực sự thì tham vọng
    của mình là tự trở thành sự cứu rỗi cho chính bản thân mình*` theo DEC-P01-002,
    cùng phần trần thuật “Tanya” tuân thủ quy trình từng li từng tí và bung dù ở độ
    cao quy định.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000050: locks: [''Giữ đại
    từ độc thoại “mình” theo DEC-P01-001, các thuật ngữ “lực G giảm tốc”, “kỹ thuật
    PLF”, “pháp sư”, “màn chắn bảo hộ” và trình tự chịu lực giảm tốc, biết ơn cơ thể
    nhỏ nhắn, phân tán chấn động tiếp đất và hoàn tất cú hạ cánh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000051: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng bao trọn hai câu độc thoại đầu đoạn theo DEC-P01-002, đại
    từ “mình”, các thuật ngữ “kỹ thuật hạ cánh khẩn cấp”, “khóa huấn luyện cơ động
    trên không bằng quả cầu tính toán”, và phần trần thuật văn bản phẳng về “Tanya”
    thở dài đấm gã nghĩ ra kỹ thuật thả dù này trong tâm tưởng khi cắt dây thoát khỏi
    chiếc dù.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000052: locks: [''Giữ nhận
    định rằng mọi người trong đơn vị đều đã tiếp đất mà không gặp vấn đề gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000053: locks: [''Giữ đại
    từ “mình” và “chúng ta” theo DEC-P01-001 cùng thuật ngữ khai triển đầy đủ “kỹ
    thuật ngã tiếp đất năm điểm khi nhảy dù”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000054: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng bao trọn toàn bộ đoạn độc thoại nội tâm cuối lô theo DEC-P01-002,
    đại từ “Mình” / “mình” theo DEC-P01-001, chi tiết các huấn luyện viên sẵn lòng
    đẩy một đứa trẻ về mặt ngoại hình ra khỏi máy bay và ý định gửi thư cảm ơn từ
    tận đáy lòng khi trở về.'']'
  non_canon: true
