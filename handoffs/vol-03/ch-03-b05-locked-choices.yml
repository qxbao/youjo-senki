task_id: vol-03-ch-03-b05
baseline_sha256: db03947ac03df701349ca246cf635502695767f6e7ab4f53659cc1fe211a2ba7
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 1c188dbda5c0211e520e60c69ea730cf31c380e7748f7bc01165bbf4eb8c9816
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002: locks: [''Giữ dấu
    ngoặc kép hội thoại và lời can ngăn khẩn thiết gọi cấp hàm hai lần: `“Thiếu tá
    von Degurechaff! Làm ơn đi, Thiếu tá!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000003: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, các thuật ngữ `pháp sư`, `màn chắn bảo hộ`, và quan
    hệ nhân quả khi màn chắn bảo hộ hất văng đám lính ra mới khiến họ nhận ra mức
    độ nghiêm túc khác thường của nó lúc gào thét.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000004: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Đại tá`, ngôi `tôi – ngài / chúng ta`, định
    danh `Đế quốc` và điệp từ `Làm ơn, làm ơn` cầu xin cân nhắc lại và hành động ngay
    vì tương lai Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000005: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu ba chấm kèm thán từ nén tiếng `…Hự.`, định danh `Thiếu
    tá von Degurechaff`, đại từ `cô` và yêu cầu bình tĩnh lại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000006: locks: [''Giữ cụm
    `chỉ huy căn cứ`, `một người lính Đế quốc`, đại từ `ông` và cấu trúc giả định:
    nếu có thể bị một chỉ huy đóng quân dưới quyền mình ép buộc thì đã chẳng xứng
    đáng đứng ở vị trí chỉ huy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000007: locks: [''Giữ dấu
    ngoặc kép hội thoại, địa danh `Brest`, ngôi `Chúng ta / Tôi – Thiếu tá / cô`,
    thuật ngữ `lệnh ngừng bắn` và lập luận rằng Brest thất thủ chỉ là vấn đề thời
    gian nên không cần tiêu hao binh lực vô ích hay làm hỏng lệnh ngừng bắn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000008: locks: [''Giữ dấu
    ngoặc kép hội thoại, thuật ngữ `Lệnh ngừng bắn`, ngôi `Chúng ta` và lời phản bác
    rằng lệnh ngừng bắn chưa được tuyên bố nên vẫn có thể cứu quân đội nếu hành động
    ngay.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000009: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh `Thiếu tá von Degurechaff`, ngôi `chúng ta` và
    nhận định hạm đội đó đã bị đánh bại, không còn là mối đe dọa đối với quân đội
    Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000010: locks: [''Giữ các
    cụm `đám quân cảnh`, `các sĩ quan tham mưu`, đại từ `nó` theo DEC-P01-001 và sự
    đối lập giữa việc không nghĩ có thể thuyết phục bằng sức mạnh cơ bắp với suy tính
    rằng nếu nó là một người lính thì có thể thuyết phục bằng lời lẽ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000011: locks: [''Giữ câu
    trần thuật ngắn nối mạch: `Thế là họ đã thử làm vậy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000012: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách gọi `mọi người` và `Thưa Đại tá!`, cùng lời thúc giục
    khẩn thiết rằng vấn đề nằm ở thời gian và không còn thời gian nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000013: locks: [''Giữ định
    danh `Thiếu tá von Degurechaff`, đại từ `nó` theo DEC-P01-001, quan hệ nhượng
    bộ giữa tiếng đồn là người biết điều không cần nói nhiều lời với sự ngoan cố giữ
    lập trường hôm nay, cùng cấu trúc tăng tiến `Không chỉ vậy` khi sốt ruột đòi dốc
    toàn lực tấn công.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000014: locks: [''Giữ chính
    xác dấu chữ nghiêng `*...*` và dấu ba chấm bỏ lửng theo DEC-P01-002: `*Cứ gần
    như thể là…*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000015: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001 và nhận định khẳng định nó đang van nài cứ như thể đang
    khiếp sợ một thứ gì đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000016: locks: [''Giữ chính
    xác dấu chữ nghiêng `*...*` cho toàn bộ câu cảm thán và hai câu hỏi ngắn theo
    DEC-P01-002 cùng biệt danh `Ngân Gỉ`: `*Thật lố bịch. Ngân Gỉ ư? Sợ hãi ư?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000017: locks: [''Giữ chính
    xác phạm vi chữ nghiêng `*Không thể nào có chuyện đó được*` trước vế trần thuật
    `, vài người đứng xem thầm nghĩ.` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000018: locks: [''Giữ câu
    trần thuật ngắn: `Chỉ là họ vẫn chưa hiểu ra mà thôi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000019: locks: [''Giữ dấu
    ngoặc kép hội thoại, đại từ `Chúng` và hình ảnh so sánh âm thầm đào tẩu, vứt bỏ
    tổ quốc của mình như lũ chuột.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000020: locks: [''Giữ chính
    xác dấu chữ nghiêng `*...*` và dấu ba chấm đầu câu theo DEC-P01-002: `*…Thế thì
    sao chứ?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000021: locks: [''Giữ các
    thuật ngữ `các sĩ quan tham mưu`, `tuyến tiếp vận` và chuỗi lập luận hậu cần:
    quân đội tiêu thụ nhiều lương thực ngay cả trong thời bình, mỗi binh sĩ là một
    cái bụng đói nên đội quân bị cắt đứt khỏi tuyến tiếp vận sẽ chịu số phận bi thảm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000022: locks: [''Giữ nhận
    định bổ sung rằng sự sụp đổ của một đội quân không có căn cứ chỉ còn là vấn đề
    thời gian.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000023: locks: [''Giữ các
    thuật ngữ `Quân cảng Brest`, `tái thiết phòng tuyến`, `chiến dịch phản đổ bộ`,
    `tuyến tiếp vận` và bảo toàn chính xác phạm vi chữ nghiêng ở câu cuối đoạn theo
    DEC-P01-002: `*À ha, sẽ rắc rối lắm nếu chúng làm giống hệt chúng ta và đe dọa
    tuyến tiếp vận của ta bằng cách đổ bộ vào hậu phương.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000024: locks: [''Giữ dấu
    ngoặc kép hội thoại và hai câu hỏi phản vấn liên tiếp của phía tham mưu về việc
    quân địch sẽ chỉ tự hủy diệt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000025: locks: [''Giữ chính
    xác dấu chữ nghiêng `*...*` cho toàn bộ đoạn theo DEC-P01-002 và đại từ `Cô ta`
    trong độc thoại nội tâm: `*Cô ta đang sợ cái gì chứ? Tàn sát một đội quân bị cô
    lập đâu có khó khăn đến thế!*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000026: locks: [''Giữ cấu
    trúc phủ định bộ phận chuyển ý: `Nhưng cũng không phải là ai nấy đều hoàn toàn
    yên tâm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000027: locks: [''Giữ sự
    đối lập giữa hình ảnh cô bé gần như đang mất hết lý trí ngay trước mắt họ với
    việc được tất cả công nhận là sở hữu một bộ óc xuất chúng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000028: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001 và ba danh xưng đánh giá năng lực: thiên tài bước ra
    từ `Trường Đại học Chiến tranh`, cục cưng của `Bộ Tổng tham mưu`, hoặc một chiến
    lược gia chưa được đánh giá đúng tầm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000029: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu gạch ngang dài `—` ở chỗ tự sửa chủ ngữ từ số nhiều sang
    số ít `Chúng đang— Không, hắn đang tìm cách tạo điều kiện cho một phần binh lực
    của mình đào thoát!` và lời khẳng định `Chúng ta không thể để chuyện đó xảy ra
    được!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000030: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, chi tiết tiếng gào thét chói tai vang vọng khắp đường
    băng của căn cứ dù sắp hụt hơi, và sự tương phản khi ai nhìn thấy cũng biết nó
    đang kêu gọi điều gì đó nhưng không hiểu nổi đó là gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000031: locks: [''Giữ chính
    xác dấu chữ nghiêng `*...*` theo DEC-P01-002 và đại từ `cô ta` trong hai câu hỏi
    nội tâm: `*Tại sao cô ta lại khăng khăng đến thế? Làm sao cô ta lại đi đến kết
    luận đó được?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000032: locks: [''Giữ dấu
    ngoặc kép hội thoại và nhận định bác bỏ giả thuyết của Tanya là không có cơ sở,
    cho rằng hợp lý nhất là xem các đơn vị đó như `lực lượng phòng thủ thay thế` hoặc
    `quân phản kích`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000033: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh `Đế quốc`, ngôi `chúng ta – chúng` và lời cảnh
    báo nếu để chúng thoát mất thì chiến thắng của Đế quốc sẽ bị lâm nguy và rốt cuộc
    Đế quốc sẽ sụp đổ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000034: locks: [''Giữ hai
    câu ngắn tạo bước ngoặt bi kịch: một vài người đã cố gắng suy nghĩ, nhưng dù có
    tàn nhẫn đến đâu, tất cả đã quá muộn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000035: locks: [''Giữ chính
    xác dấu chữ nghiêng `*...*` theo DEC-P01-002 cho hai câu lặp lại lời cảnh báo:
    `*Chiến thắng của Đế quốc sẽ bị lâm nguy. Rốt cuộc Đế quốc sẽ sụp đổ.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000036: locks: [''Giữ sự
    đối lập giữa những tiếng gào thét ấy và phản ứng đáp lại khác xa so với những
    gì kẻ gào thét mong đợi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000037: locks: [''Giữ dấu
    ngoặc kép hội thoại, mệnh lệnh `ghì cô ta xuống!` gửi quân cảnh và lời gắt `Thiếu
    tá, thế là đủ rồi đấy!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000038: locks: [''Giữ đại
    từ `nó` theo DEC-P01-001, định danh `Degurechaff`, cụm `Đám quân cảnh và đơn vị
    của nó`, và chi tiết năm người đàn ông hợp sức đối phó với một cô bé nhỏ tuổi
    vẫn phải dốc toàn lực mới kéo được nó ra khỏi người vị chỉ huy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000039: locks: [''Giữ dấu
    ngoặc kép hội thoại và tiếng van nài tuyệt vọng: `“Thưa Đại tá, làm ơn! Làm ơn
    đi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000040: locks: [''Giữ câu
    kết lắng đọng khép lại cảnh: `Đó là một tiếng gào thét còn văng vẳng mãi bên tai.`.'']'
  non_canon: true
