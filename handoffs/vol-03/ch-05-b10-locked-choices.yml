choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113: locks: [''Giữ cụm
    `vượt biển` (nối tiếp `eo biển` ở p000112), định danh `các sĩ quan hoạch định`
    và hình ảnh `một bài toán đau đầu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000114: locks: [''Giữ lời
    thoại với đại từ `tôi`, thuật ngữ `một trận chiến tiêu hao` và cụm `ngay trên
    sân nhà của địch`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000115: locks: [''Giữ quy
    chiếu `Họ`, cấu trúc điều kiện và mục đích `tiến hành một trận chiến kéo dài nhằm
    làm suy kiệt kẻ địch`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000116: locks: [''Giữ các
    cụm `Một trận chiến tiêu hao ngay tại sào huyệt của một cường quốc`, `Đế quốc
    sẽ là bên kiệt quệ trước tiên`, `mặt trận Rhine` và sự đối sánh thế trận `ngang
    tài ngang sức` dọc biên giới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000117: locks: [''Giữ bối
    cảnh `một trận không chiến trên bầu trời chính quốc của địch`, lợi thế `tái nhập
    chiến tuyến ngay lập tức` và việc không phải lo bị bắt làm `tù binh khi tiếp đất`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000118: locks: [''Giữ sự
    tương phản đối với binh sĩ `Lục quân Đế quốc` (`việc bị bắt làm tù binh đã là
    may mắn lắm rồi`) và kết luận về `tổn thất thực tế của mỗi bên sẽ hoàn toàn khác
    biệt` dù bắn hạ nhau cùng tốc độ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000119: locks: [''Giữ các
    định danh `quân đội Đế quốc`, `Khối Thịnh vượng chung`, yêu cầu `hạn chế sự tiêu
    hao về phía mình` và cấu trúc phủ định kép ở câu cuối (`Điều đó không phải là
    bất khả thi, nhưng không thể bàn cãi rằng việc thực hiện nó ngoài thực tế sẽ là
    cả một thách thức.`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000120: locks: [''Giữ lời
    phát biểu nhấn mạnh yếu tố `Thời gian`, đại từ `chúng ta` và nguy cơ khi kẻ địch
    `củng cố xong hệ thống phòng thủ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000121: locks: [''Giữ chính
    xác từ nhấn mạnh in nghiêng `*sẽ*` theo DEC-P01-002 và cụm `một cuộc xâm lược
    chính quốc của địch một khi hệ thống phòng thủ ở đó đã được kiên cố hóa *sẽ* là
    hành động liều lĩnh`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000122: locks: [''Giữ các
    cụm `Một số sĩ quan tham mưu`, `chiến tranh chớp nhoáng`, đại từ `chúng ta` –
    `họ` và phép so sánh quy mô công sự phòng thủ với `mặt trận Rhine`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000123: locks: [''Giữ lời
    đáp của Zettour với đại từ `Chúng ta` – `tôi`: `“Chúng ta cũng có thể củng cố
    hệ thống phòng thủ của mình trong khoảng thời gian đó. Theo tôi thấy thì thế trận
    của hai bên sẽ ngang bằng nhau.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000124: locks: [''Giữ quy
    chiếu `Zettour` – `Ông`, sự đối lập giữa bảo vệ `Đế quốc` với `phần lãnh thổ chiếm
    đóng`, ưu tiên `bảo toàn binh lực` và mục tiêu đi kèm `làm kẻ địch rỉ máu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000125: locks: [''Giữ lời
    giải thích của Zettour với đại từ `chúng ta`, học thuyết `chiến lược tuyến nội
    địa` (đồng bộ với B07), cụm `năng lực viễn chinh` và sự đánh đổi để có những người
    lính mạnh hơn, chất lượng tốt hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000126: locks: [''Giữ câu
    xác nhận bổ sung: `Phải, còn có một vấn đề nữa là làm như vậy thực sự là cách
    duy nhất để duy trì một vùng lãnh thổ rộng lớn đến thế.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000127: locks: [''Giữ đại
    từ `chúng ta` – `họ` – `ông`, danh xưng `Tướng von Zettour` và lập luận phản biện
    rằng việc bám trụ mãi trên chiến trường vì những lo ngại đó sẽ `bào mòn quốc lực
    của chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000128: locks: [''Giữ nhận
    định khái quát và lập trường của `Zettour` không bị thuyết phục rằng việc chinh
    phục `chính quốc Khối Thịnh vượng chung` là điều tối cần thiết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000129: locks: [''Giữ quy
    chiếu `ông` – `họ` – `chúng`, nhận định về `sự điên rồ của việc lao vào bằng sức
    mạnh hải quân` và sự đối lập giữa giao chiến trên `sân nhà của địch` với `kéo
    chúng tới chiến trường do Đế quốc lựa chọn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000130: locks: [''Giữ tâm
    trạng bực bội của Zettour (`ông`) và sự tự tin thái quá của những người khác sau
    khi đánh bại `Cộng hòa` rằng họ có thể hạ gục `Khối Thịnh vượng chung` theo cùng
    một đà tiến suôn sẻ ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000131: locks: [''Giữ các
    định danh `Các sĩ quan hoạch định tác chiến`, `Trung tướng von Rudersdorf`, `Lục
    quân Đế quốc` và câu nói được đặt trong ngoặc kép của người dân cùng giới quan
    chức `“Ồ, Lục quân Đế quốc có thể lo liệu được mà,”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000132: locks: [''Giữ cụm
    `một cuộc tiến công hạn chế` và tiêu chí thu hẹp chiến dịch `mang lại hiệu quả
    cao nhất với mức đổ máu ít nhất`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000133: locks: [''Giữ quy
    chiếu `ông` và thuật ngữ `một kế hoạch kiềm chế tiêu hao`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000134: locks: [''Giữ câu
    mở cảnh mới: `Mặt trận trên lục địa phía nam là một sa mạc.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000135: locks: [''Giữ sự
    đối sánh `Không giống như trên chính quốc, tại đó áp dụng một quy luật nghiệt
    ngã.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000136: locks: [''Giữ toàn
    bộ câu nhấn mạnh in nghiêng theo DEC-P01-002: `*Kẻ mạnh thì sống.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000137: locks: [''Giữ địa
    danh `lục địa phía nam`, ba thế lực `Khối Thịnh vượng chung`, `Cộng hòa`, `Khối
    tập thể Ispagna` và lý do `Khối tập thể Ispagna` giữ trung lập vì không đủ nguồn
    lực can thiệp ra bên ngoài do xung đột chính trị gay gắt ở trong nước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000138: locks: [''Giữ các
    định danh `Vương quốc Ildoa`, từ trong ngoặc kép `“định cư”`, `nhóm các thân vương
    quốc Turkman` và `các khu định cư của Ildoa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000139: locks: [''Giữ chính
    xác từ nhấn mạnh in nghiêng `*hỗn loạn*` theo DEC-P01-002, cụm `các chính quyền
    bù nhìn` và hai thế lực nắm phần lớn ảnh hưởng là `Khối Thịnh vượng chung và Cộng
    hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000140: locks: [''Giữ địa
    danh `lục địa phía nam`, mệnh đề nhượng bộ về vị thế trung lập chính thức và biểu
    hiện lòng trung thành qua việc phái `các đội quân tình nguyện và cung cấp vật
    tư tiếp tế`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000141: locks: [''Giữ cấu
    trúc phủ định bộ phận `Nhưng cũng không phải ai cũng xem Reich là kẻ thù.`, cùng
    các định danh `Reich`, `Khối Thịnh vượng chung`, `Cộng hòa`, `lục địa phía nam`
    và `Đế quốc`.'']'
  non_canon: true
