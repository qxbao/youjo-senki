segment_id_end: YS-LN03/Text/chapter006_002.xhtml/p000667
choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633: locks: [''Giữ cảnh
    tượng đập vào mắt `họ` khi ngẩng lên là khu vực từng là `sở chỉ huy` sau màn bay
    lướt qua của `các pháp sư`, cùng chi tiết ngoài một loạt `công thức nổ sát thương
    sinh lực` rải rác thì `chúng` còn tấn công bằng `lựu đạn và bom năm mươi ký`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000634: locks: [''Giữ góc
    nhìn của những người dưới `hầm trú ẩn` chứng kiến `các pháp sư Đế quốc` dễ dàng
    cắt đuôi làn hỏa lực phòng không bảo vệ và lần lượt bắn hạ `các pháp sư Cộng hòa`
    đang truy kích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000635: locks: [''Giữ sự
    đối lập giữa cuộc truy đuổi quyết liệt và nỗ lực hết sức của `các pháp sư phòng
    thủ` với việc `quân địch` vẫn thoát vây trước sự chứng kiến của `giới chỉ huy
    Cộng hòa` từ dưới `hầm trú ẩn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000636: locks: [''Giữ trạng
    thái sững sờ của hầu hết `các sĩ quan tham mưu` trước khoảnh khắc ngắn ngủi khi
    `Quân địch` lao vào tấn công rồi rút đi mà `họ` chẳng làm được bất cứ điều gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000637: locks: [''Giữ chính
    xác hai câu độc thoại đầu đoạn đặt trong `*...*` theo `DEC-P01-002` (`*Vậy đó
    chính là các pháp sư Đế quốc sao. Đó chính là những kẻ từng hoành hành khắp mặt
    trận Rhine.*`), và sự đối lập giữa đại đa số `các sĩ quan tham mưu` chết lặng
    với `Vianto` bắt đầu kiểm kê thiệt hại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000638: locks: [''Giữ thực
    trạng `Sở chỉ huy` trúng đòn trực diện từ `công thức của pháp sư` khiến trang
    thiết bị bên trong hỏng sạch nên lựa chọn duy nhất của `họ` là dùng `sở chỉ huy
    dự phòng`, và bảo toàn chính xác câu độc thoại cuối đoạn đặt trong `*...*` theo
    `DEC-P01-002` (`*May mà chúng ta có lập một sở chỉ huy dự phòng.*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000639: locks: [''Giữ câu
    hỏi thăm lễ phép của Vianto với cấp trên: `“…Ngài không sao chứ, thưa Tướng quân?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000640: locks: [''Giữ lời
    cảm thán `Nhờ sự che chở của Đức Mẹ Thánh Thần!`, nhận định chậm chút nữa là `chúng
    ta` nguy to, và câu nói pha trò của de Lugo xưng `Ta` – `mình` về việc mừng vì
    có một `cấp dưới` dám không chút do dự mà đá `ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000641: locks: [''Giữ câu
    nhận định ngắn gọn: `Quan trọng nhất là vị tướng vẫn còn sống.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000642: locks: [''Giữ sự
    phân biệt đại từ `ông ta` cho `de Lugo` (chỉ bị vài vết bầm tím lúc lao người
    hay đúng hơn là bị đá văng xuống `hầm trú ẩn`) và `ông` cho `Vianto` (không ai
    trách vì đã ngăn chặn được một thảm họa).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000643: locks: [''Giữ nhận
    định ngay cả khi sự cứng cỏi ấy chỉ là gắng gượng, `họ` vẫn đủ bình tĩnh để bông
    đùa về chuyện vừa xảy ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000644: locks: [''Giữ nhận
    định của `Vianto` (`Ông`) rằng `họ` đã tránh được kịch bản tồi tệ nhất khi nhớ
    lại nguy cơ bại trận cùng cú sốc lúc nghe tin `sở chỉ huy` ở `mặt trận Rhine`
    bị thổi bay, và quyết tâm không để chuyện đó tái diễn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000645: locks: [''Giữ chi
    tiết khi nhận thấy `de Lugo` nhắm nghiền mắt như đang cầu nguyện, `ông` chẳng
    lấy làm ngạc nhiên vì bản thân `ông` cũng đã kinh hãi tột độ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000646: locks: [''Giữ nhận
    định `Lục quân Cộng hòa` suýt bị chặt đầu thêm lần nữa, và sự đối sánh giữa phản
    ứng chậm trễ ở `mặt trận Rhine` vì chiến thuật đó còn mới mẻ với việc lần này
    `họ` suýt soát thoát khỏi việc lặp lại cùng một sai lầm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000647: locks: [''Giữ niềm
    tin có lẽ nhờ sự che chở của `Chúa`, suy nghĩ của `Ông` về tương lai `tổ quốc`
    và niềm kiêu hãnh của `Cộng hòa` truyền lại cho mai sau, cùng quyết tâm gìn giữ
    ánh hào quang rực rỡ dẫu chỉ còn là chút dư quang đang giúp `họ` vừa vặn vượt
    qua cơn khủng hoảng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000648: locks: [''Giữ câu
    hỏi ngắn gọn của tướng de Lugo: `“Thiệt hại thế nào?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000649: locks: [''Giữ lời
    báo cáo của Vianto rằng tình hình rất hỗn loạn nhưng vẫn có thể coi là ở mức tối
    thiểu, và câu xin ý kiến `Chúng ta rút lui chứ ạ?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000650: locks: [''Giữ nhận
    định `Họ` vẫn còn khả năng chiến đấu và ít nhất vẫn có thể nghiền nát đối phương
    trong hiệp tiếp theo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000651: locks: [''Giữ cấu
    trúc đối lập khẳng định đây là `lục địa phía nam`—không phải căn cứ chính của
    `Đế quốc` mà là lãnh thổ của `Cộng hòa` và `Khối Thịnh vượng chung`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000652: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Cơ hội của chúng
    ta trong một cuộc chiến lâu dài không tệ chút nào. Trong trường hợp đó, có lẽ
    tốt nhất là bảo toàn binh lực và quay lại bào mòn quân địch.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000653: locks: [''Giữ quyết
    định của `de Lugo` giảm thiểu tổn thất và rút quân.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000654: locks: [''Giữ sự
    thừa nhận lần này `họ` đã thua của `Ông ta`, bảo toàn chính xác câu độc thoại
    ngắn đặt trong `*...*` theo `DEC-P01-002` (`*Chúng ta bị chơi một vố rồi.*`),
    và thái độ của một nhà chiến lược đã chấp nhận sự thật ấy rồi gác nó lại phía
    sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000655: locks: [''Giữ mệnh
    lệnh của de Lugo dùng `Chúng ta`: rút lui chờ thời cơ phản công, thông báo toàn
    bộ các đơn vị rút quân, tuyệt đối không truy kích xa hơn và bố trí lại đội hình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000656: locks: [''Giữ lập
    luận giả định nếu một trận giao chiến nổ ra thì đằng nào `họ` cũng chẳng thể thắng
    nổi, nên câu trả lời là không giao chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000657: locks: [''Giữ kế
    hoạch nhử kẻ địch vào một `trận chiến tiêu hao` để nghiền nát `chúng` từ từ, và
    nhận định bản thân việc `họ` sống sót qua đòn vừa rồi đã là một bước ngoặt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000658: locks: [''Giữ niềm
    tin `Ông ta và Cộng hòa` sẽ không thua, và định nghĩa chiến thắng đối với `Cộng
    hòa` là chỉ cần đứng vững trên đôi chân của mình khi cuộc chiến kết thúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000659: locks: [''Giữ tiếng
    cười sảng khoái và lời hỏi cấp trên lễ phép nhưng hả hê của thuộc cấp: `“Ha-ha-ha!
    Thiếu tá có thấy bọn chúng không ạ? Vẻ mặt của lũ đần độn đó ấy!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000660: locks: [''Giữ tiếng
    cười đáp lại và lời nhắc nhở xưng `Tôi` – `anh` của Tanya với thuộc cấp: hiểu
    tâm trạng của `anh` nhưng `anh` nên cẩn thận lời ăn tiếng nói một chút.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000661: locks: [''Giữ câu
    trần thuật mở đầu cảnh phía Đế quốc: `Trong một dịp thực sự hiếm hoi, Thiếu tá
    von Degurechaff đang có tâm trạng rất tốt.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000662: locks: [''Giữ đại
    từ `Nó` – `mình` theo `DEC-P01-001` khi miêu tả Tanya cười sảng khoái từ tận đáy
    bụng giống hệt một đứa trẻ đúng lứa tuổi khi dẫn đầu `tiểu đoàn`, cùng nhận định
    khả năng cảm nhận niềm vui thực sự là dấu hiệu của một tâm trí lành mạnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000663: locks: [''Giữ lời
    châm biếm của thuộc cấp gọi Tanya là `thiếu tá` và chế giễu `đám ốc sên này` (`chúng`)
    tự hào về gu thưởng thức tinh tế mà lại thiếu tinh tế đến tệ hại khi chẳng bố
    trí nổi một đội hộ tống đàng hoàng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000664: locks: [''Giữ lời
    đáp thản nhiên của Tanya: `“Ờ thì, chỉ là do chúng quá chậm thôi. Chuyện đó đành
    chịu vậy.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000665: locks: [''Giữ định
    danh `các quả cầu tính toán` được `Lục quân Đế quốc` chính thức trang bị và ưu
    thế vượt trội cả về độ cao lẫn tốc độ của `Type 97` bỏ xa các loại khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000666: locks: [''Giữ nguyên
    cách nói lược đơn vị đo độ cao (`Tám nghìn` là `độ cao tác chiến tối đa` của các
    quả cầu hiện có nhưng là mức thực dụng với `Type 97`, và nếu cố gắng thêm có thể
    tiệm cận mức `mười hai`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000667: locks: [''Giữ nhận
    định mẫu tối ưu cho chiến thuật đặt sự tự bảo toàn lên hàng đầu là đánh rồi rút,
    cùng các thông số `độ cao, tốc độ và tốc độ leo cao` xuất sắc của `Elinium Type
    97` (được biết đến chính thức như một `quả cầu xung kích`).'']'
  non_canon: true
