choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205: locks: [''Giữ mạch
    liên kết trực tiếp với cuối batch b12: `Nói chung thì đây là những đánh giá khá
    tích cực.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000206: locks: [''Giữ đại
    từ `cô`, hai chức danh `sĩ quan tham mưu` và `sĩ quan tác chiến`, cùng sự đối
    lập giữa đánh giá học thuật với những đánh giá `từ chiến trường` đang `hỗn loạn
    đủ kiểu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000207: locks: [''Giữ định
    danh `Cụm tập đoàn quân phương Bắc`, đại từ `cô` và lý do bị thuyên chuyển `sau
    khi thẳng thừng lên tiếng phản đối những người nắm thẩm quyền`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000208: locks: [''Giữ định
    danh `Cụm tập đoàn quân phương Tây`, đại từ `cô`, nhận định `điểm tốt và điểm
    xấu của cô triệt tiêu lẫn nhau nên rất khó xếp loại` và chi tiết `từng tìm cách
    chống lệnh`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000209: locks: [''Giữ cặp
    quy chiếu `Cô` / `ông` và suy luận giả định của Romel: điểm tốt cân bằng được
    với điểm xấu bất chấp việc từng định bất tuân thượng lệnh cho thấy `một năng lực
    đáng gờm nào đó`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000210: locks: [''Giữ đại
    từ `ông`, nghịch lý khi vị chỉ huy của đơn vị mà ông đáng phải trông cậy nhất
    giữa lúc thiếu quân lại là một nhân vật như thế, và câu kết `Chuyện này thực sự
    vượt quá sức tưởng tượng.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000211: locks: [''Giữ tên
    riêng `Romel`, cặp quy chiếu `cô` / `ông`, cụm `phòng thí nghiệm kỹ thuật` và
    nội dung nhận xét nước đôi `dù dự án cô từng tham gia đã đạt được những thành
    quả nhất định nhưng cái giá bỏ ra là không đáng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000212: locks: [''Giữ câu
    chuyển ý ngắn: `Sau khi đọc xong, ông nghĩ đến hai điều.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000213: locks: [''Giữ định
    danh `Bộ Tư lệnh` và ý thứ nhất: `Thứ nhất là gần như tất cả những bản đánh giá
    này đều đến từ Bộ Tư lệnh.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000214: locks: [''Giữ đại
    từ `cô`, chức danh `sĩ quan tác chiến`, danh từ `pháp sư` và nhận xét về xu hướng
    bị gạt sang một bên của những người tuy chấp hành mệnh lệnh nhưng phản đối kế
    hoạch của giới chóp bu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000215: locks: [''Giữ câu
    kết giải thích ngắn gọn: `Suy cho cùng thì họ rất khó điều khiển.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000216: locks: [''Giữ đại
    từ `cô` và ý thứ hai: dù các bản đánh giá mâu thuẫn nhau, cô đã lập được nhiều
    thành tích đến mức được xem là `một quân nhân xuất sắc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000217: locks: [''Giữ sự
    phân tách giữa tư cách `một sĩ quan` và `một cá nhân pháp sư`, đại từ `cô`, định
    danh `mặt trận Rhine` và thành tích số lượng địch bị tiêu diệt nằm trong nhóm
    dẫn đầu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000218: locks: [''Giữ chức
    danh `sĩ quan tác chiến`, cụm `những đợt xung phong đột phá và phục kích`, hai
    biệt danh `“Chó Điên”` và `“Ngân Gỉ”` cùng cặp đại từ `cô` / `ông`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000219: locks: [''Giữ sự
    đối sánh với biệt danh `“Bạch Ngân”`, định danh `quân Cộng hòa`, biệt danh `“Ác
    quỷ sông Rhine”` và cặp đại từ `cô` / `ông`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000220: locks: [''Giữ đánh
    giá kép trên phương diện `một pháp sư` (không có đối thủ) và `một sĩ quan` (tuyệt
    nhiên không phải kẻ bất tài), cùng suy luận họ giao `cô` cho `ông` vừa làm quân
    tiếp viện vừa làm cái cớ tống khứ cái gai trước mắt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000221: locks: [''Giữ đại
    từ `ông` và cảm giác bị đùn đẩy cục nợ: `Thực tình, ông có cảm giác họ đang đùn
    đẩy cục nợ của mình sang cho ông.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000222: locks: [''Giữ lời
    than thở tự xưng `mình` với hình ảnh ẩn dụ `dắt một con chó điên đi dạo mà không
    có dây xích`, định danh `Tướng von Romel`, đại từ `ông` và ẩn dụ `đặt cược vào
    một ván bài xấu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000223: locks: [''Giữ đại
    từ tự xưng `Ta`, định danh `Bộ Tổng tham mưu` và lời chỉ trích `chỉ nhìn số người
    chết như một con số thống kê mà thôi!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000224: locks: [''Giữ đại
    từ `ông`, định danh `Bộ Tổng tham mưu` và thói quen `đùn đẩy những kẻ gây đau
    đầu sang cho người ngoài chiến trường`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000225: locks: [''Giữ chữ
    nghiêng `*Thôi thì, ít nhất mình cũng sẽ gặp cô ta một lần.*` theo DEC-P01-002,
    các định danh `Tướng von Romel`, `Thiếu tá von Degurechaff`, `sĩ quan ma pháp`
    và cặp quy chiếu `ông` / `cô` trong trần thuật.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000226: locks: [''Giữ cặp
    đại từ `Ông` / `cô`, cụm `những nghi thức xã giao lạnh lùng` và chi tiết `thói
    xấu hay dò xét con người của ông lại trỗi dậy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000227: locks: [''Giữ định
    danh `Thiếu tá von Degurechaff`, đại từ `ông` và điểm tương đồng `ưa chuộng lối
    trao đổi trang trọng và đi thẳng vào công việc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000228: locks: [''Giữ các
    danh từ `pháp sư và sĩ quan`, định danh `quân đội Đế quốc` và nhận xét về tính
    kiêu hãnh/kiêu ngạo của họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000229: locks: [''Giữ cụm
    `vị sĩ quan ma pháp này`, cặp đại từ `ông` / `cô` và dự đoán của Romel rằng cô
    thuộc tuýp người `hung hăng, bạo liệt bất chấp vẻ bề ngoài`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000230: locks: [''Giữ tên
    riêng `Romel` và dự đoán rằng kiểu người như thế sẽ khó chịu hoặc nổi giận trước
    `những lời khách sáo quan liêu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000231: locks: [''Giữ đại
    từ `cô`, tên riêng `Romel`, đại từ `ông`, cách cô điềm nhiên đáp lại bằng đúng
    thứ lễ nghi sáo rỗng và việc Romel tự thú nhận tính toán của mình đã trật nhịp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000232: locks: [''Giữ cụm
    `sĩ quan ma pháp`, câu nội tâm in nghiêng `*Có lẽ nào đó là lý do cô ta phớt lờ
    mệnh lệnh và định chống đối?*` theo DEC-P01-002 và mối lo ngại của một sĩ quan
    ngoài chiến trường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000233: locks: [''Giữ đúng
    hai câu nội tâm in nghiêng `*Đúng là cô ta rất gan dạ, nhưng… cô ta lại thuộc
    tuýp người tự ý hành động.*` và `*Cô ta đã quyết định như thế nào nhỉ?*` theo
    DEC-P01-002, cùng hai tên riêng `Romel` và `Degurechaff`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000234: locks: [''Giữ lời
    thoại của Degurechaff (`thưa Tướng quân`, `tôi`, `thẩm quyền để tiểu đoàn của
    mình hành động độc lập`, `Bộ Tổng tham mưu đã phê chuẩn việc đó`), chi tiết gương
    mặt không chút biểu cảm và nhận xét `ngạo mạn đến mức khiến người ta phải sảng
    khoái`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000235: locks: [''Giữ tên
    riêng `Romel`, đại từ `cô` và ấn tượng kết đoạn rằng việc cô thản nhiên đưa ra
    lời yêu cầu trơ tráo đến kinh ngạc này `quả thực tuyệt vời`.'']'
  non_canon: true
