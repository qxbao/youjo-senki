choices:
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002: locks: [''Giữ định
    dạng tiêu đề mở cảnh in hoa toàn bộ “NGÀY 25 THÁNG 5, NĂM THỐNG NHẤT 1925, PHÒNG
    HỌP HỘI NGHỊ LIÊN LẠC BỘ TƯ LỆNH TỐI CAO LỤC QUÂN ĐẾ QUỐC”, không thêm dấu nhấn
    mạnh `*...*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000003: locks: [''Giữ các
    định danh “Bộ Tư lệnh Tối cao Lục quân Đế quốc”, “Bộ Tổng tham mưu”, mức độ “thoáng
    phần kinh hãi” và thế đối đầu căng thẳng khi “các quan chức chính phủ mặt mày
    tái mét đang lặng lẽ nhìn chằm chằm đầy áp lực về phía các sĩ quan Bộ Tổng tham
    mưu” báo hiệu cuộc thảo luận sóng gió.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000004: locks: [''Giữ địa
    danh “Vùng Đất Thấp”, định danh “Lục quân Đế quốc” và nguyên nhân cuộc họp xuất
    phát từ “cuộc rút quân quy mô lớn đáng kinh ngạc”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000005: locks: [''Giữ quân
    hàm và đơn vị “Thiếu tướng von Zettour bên bộ phận Hậu cần”, đại từ quy chiếu
    “ông” và tâm lý kỳ vọng, nóng lòng chờ lời giải thích thỏa đáng của toàn bộ người
    dự họp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000006: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “tôi – chúng ta / quân đội ta” và nội dung báo
    cáo tái tổ chức quy mô lớn các tiền tuyến thành công “bằng cách vừa đánh vừa rút
    lui về một tuyến phòng ngự đã định sẵn”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000007: locks: [''Giữ quan
    hệ đối lập “Thế nhưng”, nỗi thất vọng khi kỳ vọng bị phụ bạc và cách Zettour “thản
    nhiên giải thích bằng giọng điệu công vụ rằng chiến dịch đang diễn ra đúng theo
    kế hoạch”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000008: locks: [''Giữ đúng
    hai cụm nhấn mạnh chữ nghiêng `*Đây là vị tướng được mệnh danh là am hiểu nhất
    toàn quân về công tác hậu cần và tổ chức ở hậu phương đấy ư, vậy mà đây là tất
    cả những gì ông ta làm được sao?*` và `*Vậy là các người đã rút lui thành công.
    Rồi sao nữa?*` theo DEC-P01-002, câu trần thuật ở giữa không in nghiêng, cùng
    sắc thái trách móc của giới công chức và chính trị gia.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000009: locks: [''Giữ phủ
    định “chẳng mảy may nao núng”, hành động thong thả nhấm nháp tách cà phê đến giọt
    cuối cùng và dấu nhấn mạnh chữ nghiêng chỉ ở đúng cụm `*Hạt cà phê tuyệt thật*`
    theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000010: locks: [''Giữ cấu
    trúc tăng tiến cùng chủ thể “Không chỉ có vậy, ông còn...” và chi tiết vươn tay
    lấy hộp xì gà, săm soi từng điếu một để chọn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000011: locks: [''Giữ thái
    độ “miễn cưỡng nói tiếp trước khi đưa điếu xì gà lên miệng”, các định danh “Bộ
    Tổng tham mưu”, “Đế quốc”, “quân Cộng hòa” và việc chuyển sang báo cáo về “thực
    lực trên biển của chúng ta”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000012: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng câu hỏi trong ánh mắt `*Chẳng phải còn chuyện
    khác mà ông nên nói với chúng tôi sao?*` theo DEC-P01-002, hành động thản nhiên
    khép lại chủ đề chiến sự trên bộ và đột ngột chuyển sang điềm tĩnh báo cáo về
    chiến lược đường biển dưới góc độ ngoại giao trước sự câm lặng ngỡ ngàng của mọi
    người.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000013: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Liên minh Hiệp ước”, “Khối Thịnh vượng chung”,
    sự đối lập “đang bị Khối Thịnh vượng chung câu lưu, nhưng thực chất là đang được
    họ bảo vệ” và phủ định “chưa nhận được báo cáo nào cho thấy có bất kỳ nhân sự
    nào trên tàu thực sự bị bắt giữ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000014: locks: [''Giữ nhận
    định đây đều là thông tin đã biết và từng được bàn thảo tại chính nơi này, cùng
    chi tiết Zettour chẳng hề bận tâm đến vẻ hoài nghi trong mọi ánh mắt đang đổ dồn
    vào mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000015: locks: [''Giữ dấu
    ngoặc kép hội thoại, phạm vi giới hạn “ít nhất các mối đe dọa nghiêm trọng trên
    biển cũng chỉ giới hạn ở hải quân của Khối Thịnh vượng chung và Cộng hòa”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000016: locks: [''Giữ chi
    tiết tiếp nối bài phát biểu tưởng chừng dài vô tận bằng cụm đặt trong ngoặc kép
    “Do đó…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000017: locks: [''Giữ sự
    kết hợp giữa bài phát biểu dài dòng với “sự điềm tĩnh đến khó tin của ông trước
    cuộc khủng hoảng” khiến cử tọa ngày càng sốt ruột.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000018: locks: [''Giữ giả
    định nhượng bộ rằng sự điềm tĩnh có thể chấp nhận và lý giải “nếu họ coi ông là
    một quân nhân có tinh thần thép”, đối lập với sự gây sốc khi nghe “một sĩ quan
    thuộc bộ phận Hậu cần phát biểu như thể ông ta chẳng hề hiểu được tính chất nghiêm
    trọng của tình hình”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000019: locks: [''Giữ câu
    hỏi nghi vấn không in nghiêng về việc “quân đội, hay Bộ Tổng tham mưu, đã không
    nhận ra cuộc khủng hoảng ngay trước mắt mình do góc nhìn thuần túy quân sự của
    họ”, phủ định “hoàn toàn không nắm được Bộ Tổng tham mưu đang hiểu tình hình ra
    sao” và nhận định thái độ của Zettour hết sức đáng lo ngại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000020: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu xin phép phát biểu trang trọng từ phía “Bộ Tài chính”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000021: locks: [''Giữ dấu
    ngoặc kép hội thoại và lời đáp ngắn gọn “Xin mời.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000022: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “chúng tôi – các vị / chúng ta”, thực trạng “gần
    như đã phải trông cậy hoàn toàn vào trái phiếu trong nước để có kinh phí chiến
    tranh” và lời cảnh báo rằng việc kéo dài cuộc chiến có thể dẫn tới “những trục
    trặc kinh tế—những vấn đề tài chính—ở quy mô khó lòng làm ngơ được”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000023: locks: [''Giữ sự
    đối lập giữa thái độ “độ lượng gật đầu nhường lời” của Zettour và phong thái trang
    trọng của “vị quan chức bộ tài chính” với phản ứng “ai nấy đều phải nín thở sững
    sờ trước sự thẳng thừng trong phát biểu của ông ta”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000024: locks: [''Giữ đúng
    hai cụm nhấn mạnh chữ nghiêng `*Đó quả là một lời cảnh báo cực kỳ nghiêm trọng
    từ phía bộ tài chính!*` và `*Tình hình đã tồi tệ đến mức ấy rồi sao?*` theo DEC-P01-002,
    giữ cụm nối “Hay đúng hơn là:” ở dạng văn bản phẳng không in nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000025: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Tướng von Zettour”, định danh “Bộ Tổng tham mưu”
    và câu hỏi trực diện về điểm này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000026: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách xưng hô trang trọng “tôi / chúng tôi – ngài”, sự ghi
    nhận vất vả và hy sinh nơi “hậu phương” nhằm duy trì “các tiền tuyến”, lòng biết
    ơn sự chi viện của hậu phương và khẳng định đang dốc toàn lực vào mục tiêu cấp
    bách nhất là “xóa sổ Lục quân Cộng hòa”.'']'
  non_canon: true
