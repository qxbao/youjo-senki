choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335: locks: [''Giữ định
    danh “Liên minh Hiệp ước”, “Dacia”, thuật ngữ “tái thiết hậu chiến”, “số dư dự
    trữ vàng”, “giới tài chính City” và câu hỏi hoài nghi về khả năng chi trả toàn
    bộ khoản phí tái thiết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000336: locks: [''Giữ cụm
    “bọn Đỏ vô chính phủ”, định danh “Liên bang” và nỗi lo cần phải tính đến xem Liên
    bang đang toan tính điều gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000337: locks: [''Giữ chức
    danh “Bộ trưởng Tài chính”, “bộ trưởng nội vụ” và nhận xét rằng qua màn trao đổi
    của họ thì nghe như mọi chuyện đã được định đoạt, không cần tranh luận thêm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000338: locks: [''Giữ quan
    hệ nhân quả về việc họ đặt nặng xử lý tình hình hậu chiến vì thực lòng lo ngại
    nền tài chính kiệt quệ và hỗn loạn kinh tế sẽ tạo khoảng trống khổng lồ cho những
    kẻ cộng sản giở trò.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000339: locks: [''Giữ danh
    xưng “Ngài Marlborough”, đại từ “ngài”, “vị thủ tướng / ông” và câu suy nghĩ nội
    tâm in nghiêng `*Vấn đề này đã khép lại rồi, cớ sao ngài vẫn còn lải nhải mãi
    về nó thế?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000340: locks: [''Giữ đại
    từ “tôi”, “các vị”, “các quý ông đây” và lời nhắc nhở của Marlborough rằng chuyện
    hậu chiến chỉ đến sau khi giải quyết dứt điểm việc mà họ cho là nhỏ nhặt, kèm
    đề nghị bắt đầu vạch kế hoạch điều binh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000341: locks: [''Giữ định
    danh “Hải quân Đế quốc”, danh xưng “Ngài Marlborough” và lập luận của vị thủ tướng
    rằng hải quân nên cử lực lượng hộ tống đi cùng các đơn vị lục quân nên kế hoạch
    tùy thuộc vào Marlborough.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000342: locks: [''Giữ danh
    xưng “Vị thủ tướng / ông”, “vị Bộ trưởng Hải quân” và chi tiết tâm trí ông đang
    bận giải quyết các vấn đề đối nội, đặc biệt là vấn đề nghiêm trọng ở phía bắc,
    nên cảm thấy mâu thuẫn khi mất thời gian vào chuyện đối ngoại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000343: locks: [''Giữ chức
    danh “vị Bộ trưởng Hải quân” và bầu không khí bực dọc bao trùm căn phòng trước
    sự sốt sắng muốn thọc mũi vào chiến tranh và kiếm tìm vinh quang của ông ta.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000344: locks: [''Giữ danh
    xưng “Ngài Marlborough”, số lượng “Bảy sư đoàn, cộng thêm một sư đoàn kỵ binh”,
    thuật ngữ “lực lượng Tình nguyện Phòng vệ Địa phương” và câu hỏi chất vấn về việc
    định làm gì với vỏn vẹn chừng ấy quân.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000345: locks: [''Giữ câu
    trả lời ngắn gọn, sắc lạnh của Marlborough: “Họ có thể chết cùng người Cộng hòa
    mà, chẳng phải sao?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000346: locks: [''Giữ danh
    xưng “Vị thủ tướng”, tước hiệu “Công tước Marlborough” và sự chuyển biến từ vẻ
    ngao ngán như bị trói tay sang thoáng sững người trước câu trả lời kiên quyết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000347: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm in nghiêng `*Chết cùng người Cộng hòa ư…? Ngài định
    nói đó là lý do để đẩy những người trẻ tuổi ra chiến trường sao?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000348: locks: [''Giữ định
    danh “Khối Thịnh vượng chung”, “Cộng hòa”, “quân Đế quốc” và hàm ý chính trị:
    chỉ cần một người lính Khối Thịnh vượng chung đứng chung hàng ngũ với lính Cộng
    hòa ngã xuống trong cuộc tiến công của quân Đế quốc thì Khối Thịnh vượng chung
    sẽ không thể lùi bước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000349: locks: [''Giữ kính
    xưng “thưa Đức ngài”, định danh “Cộng hòa” và ẩn dụ để đám nông dân Cộng hòa cày
    xới sự ổn định của lục địa rồi cung kính thu hoạch thành quả của họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000350: locks: [''Giữ chức
    danh “bộ trưởng nội vụ” và ý kiến không hẳn đồng tình với bộ trưởng nội vụ nhưng
    cũng sẽ không nhảy vào một đám cháy mà mình có khả năng dập tắt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000351: locks: [''Giữ danh
    xưng “các thành viên nội các”, định danh “Khối Thịnh vượng chung” và cảnh họ chau
    mày tự hỏi sao lại có người nghi ngờ chuyện đứng ngoài sự phi lý đó mới phục vụ
    tốt nhất cho lợi ích quốc gia.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000352: locks: [''Giữ cụm
    “ảo tưởng lớn nhất”, chức danh “Bộ trưởng Tài chính” và lập luận rằng cuộc chiến
    đã phình to đến mức không đáng với cái giá phải trả, kèm câu hỏi về báo cáo tài
    chính của các nước tham chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000353: locks: [''Giữ phần
    nội tâm in nghiêng `*Thật nực cười! Họ không thể duy trì những khoản chi tiêu
    phi lý này mãi được. Tại sao chúng ta lại phải phung phí tiền bạc như thế chứ?*`
    theo DEC-P01-002 và câu trần thuật tiếp nối về những mối hoài nghi có con số củng
    cố.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000354: locks: [''Giữ cách
    gọi “Thưa Bộ trưởng Tài chính”, đại từ “ngài” và câu hỏi xác nhận xem có chắc
    chắn không có sự nhầm lẫn nào không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000355: locks: [''Giữ thuật
    ngữ “trái phiếu trong nước”, “các khoản vay nước ngoài”, định danh “Hợp chúng
    quốc”, “Đế quốc”, “Cộng hòa” và chi tiết Hợp chúng quốc bảo lãnh tài chính phần
    lớn để mở rộng ảnh hưởng trong khi Đế quốc và Cộng hòa vẫn thiếu tiền dù đã tung
    biện pháp lâm thời dồn phần lớn ngân sách quốc gia vào quân sự.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000356: locks: [''Giữ thuật
    ngữ “tiền bồi thường chiến tranh”, định danh “Đế quốc”, “Cộng hòa” và nhận định
    rằng Đế quốc sẽ bị loại khỏi vòng chiến nên có lẽ cần lo lắng hơn về sự ổn định
    chính trị ở Cộng hòa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000357: locks: [''Giữ mạch
    suy luận rằng các nước tham chiến đã đối mặt với những rắc rối đó nên cuộc chiến
    đương nhiên sẽ sớm kết thúc vì không quốc gia nào đủ sinh lực duy trì mức tiêu
    hao quá độ mãi mãi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000358: locks: [''Giữ cụm
    “đất nước được Thượng đế chọn lựa”, tên riêng “Marlborough” và việc ông ta không
    có chỗ giải tỏa nỗi bức bối nên đành xây dựng kế hoạch triển khai quân “phòng
    hờ bất trắc”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000359: locks: [''Giữ từ
    chuyển ý ngắn gọn “Nhưng…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000360: locks: [''Giữ tên
    riêng “Marlborough”, đại từ “ông ta”, cụm “bộ hải quân”, định danh “Khối Thịnh
    vượng chung” và cảnh kết chương khi một người đàn ông giận dữ từ bộ hải quân lao
    vào văn phòng báo tin mọi giả định của Khối Thịnh vượng chung đều đang sụp đổ
    ngay từ tận nền móng.'']'
  non_canon: true
