task_id: vol-03-ch-02-b16
baseline_sha256: 2804cca2cbab604ebdbdd158c812a04e1ce21fc8c890524bbac9417e34187a7d
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: a8252bd53e0a09859bc61100d0df4184ac8e9b78b615ec0119b5282e9353644b
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432: locks: [''Giữ từ
    chuyển ý “Thứ hai” nối tiếp mạch cuối b15, các cụm “yếu thế cục bộ”, “bao vây
    hoàn toàn”, “màn chắn”, “pháp sư trên không” và nhiệm vụ “lùng sục và đánh chặn”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000433: locks: [''Giữ dấu
    ngoặc kép hội thoại, dấu chấm lửng mở đầu và nhận xét mọi chuyện đang diễn ra
    khá suôn sẻ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000434: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “mình”, “chúng ta” theo DEC-P01-001, các cụm “các tuyến
    tiếp tế”, “xác suất khác không”, “Lục quân Cộng hòa” và ý chuẩn bị pháp sư đối
    phó với sự kháng cự cũng như khả năng địch tập hợp lại để “phá vòng vây”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000435: locks: [''Giữ các
    định danh “Bộ Tổng tham mưu”, “Lục quân Đế quốc”, “Lục quân Cộng hòa” và sự tương
    phản giữa quân Đế quốc sẵn sàng đón đánh phản công với các đơn vị quân Cộng hòa
    nghe theo chỉ huy riêng rẽ, mạnh ai nấy làm mỗi nơi một kiểu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000436: locks: [''Giữ mạch
    kết luận và cứ thế họ đánh mất cơ hội mong manh vốn có của mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000437: locks: [''Giữ tên
    “Tanya”, cụm “quân Cộng hòa đã suy yếu” và mục tiêu đánh cho địch tối tăm mặt
    mũi để chớp lấy một suất “thăng hàm”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000438: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, các cụm “tiệc tùng trên tàu ngầm vào đêm
    hôm trước”, “cựu binh”, “trinh sát suốt bốn mươi tám giờ liên tục trong lãnh thổ
    địch” và nhận định chẳng cần phải kè kè giám sát từng li từng tí.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000439: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Fairy”, “CP”, ngôi “Chúng tôi” và báo cáo
    lặp lại hai lần rằng không có đánh chặn, đơn vị đang tiến về khu vực được chỉ
    định.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000440: locks: [''Giữ ngôi
    “chúng ta”, các cụm “hỏa lực phòng không”, “đạn pháo”, dấu ngoặc kép quanh từ
    ““rải rác”” và lập luận dù tầm nhìn tốt nhưng mật độ hỏa lực thảm hại chứng tỏ
    địch đã thực sự cạn kiệt đạn dược.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000441: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “Mình” theo DEC-P01-001 và sự ngạc nhiên vì việc tiến
    vào không phận này lại đơn giản, dễ dàng đến thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000442: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “Mình”, “chúng ta” theo DEC-P01-001, định danh “Lục quân
    Cộng hòa” và câu tự hỏi mỉa mai về màn chào đón đạm bạc so với đội quân từng giao
    chiến cách đây chưa lâu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000443: locks: [''Giữ ngôi
    “chúng ta”, các thuật ngữ “pháp sư”, “máy bay tiêm kích”, “công kích mục tiêu
    mặt đất”, “tập trận”, “thuật thức gây nhiễu” và mô tả nhiệm vụ tấn công đơn giản
    chỉ việc từ trên trời giã thuật thức gây nhiễu xuống những mục tiêu cố định.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000444: locks: [''Giữ phép
    so sánh nhiệm vụ này còn dễ hơn cả việc đi dự những buổi tiệc tối của công ty.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000445: locks: [''Giữ dấu
    chấm lửng mở đầu, đại từ “mình” theo DEC-P01-001 và hồi tưởng hồi đó chỉ là một
    nhân viên quèn chứ không phải người chỉ huy nên xét theo nghĩa đó thì ít áp lực
    hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000446: locks: [''Giữ đại
    từ “mình”, “chúng ta” theo DEC-P01-001 và lập luận không hứng thú tự làm giảm
    hiệu suất vì bám lấy quá khứ, nhưng vì cần rút ra bài học từ đó nên việc ngoái
    nhìn lại đôi khi cũng có ý nghĩa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000447: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Viper 01”, “CP”, cụm “hỏa lực phòng không”
    và báo cáo thiệt hại không đáng kể, không cản trở di chuyển.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000448: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “CP”, “Khu vực 42”, các thuật ngữ “tín hiệu
    ma lực”, “thuật thức bắn tỉa quan sát tầm xa” và lời cảnh báo cho toàn bộ các
    đơn vị.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000449: locks: [''Giữ nhận
    xét chiến tranh sẽ dễ dàng hơn nếu biết dùng cái đầu, đại từ “mình” và cấu trúc
    “không chỉ… mà cả…” với hai chủ thể rõ ràng (“đơn vị của mình” và “cả Lục quân
    Đế quốc”).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000450: locks: [''Giữ các
    định danh “Tiểu đoàn Viper”, “CP”, đại từ “chúng ta”, thuật ngữ “pháo binh”, “hỏa
    lực yểm trợ” và mạch khen ngợi đường dây liên lạc thông suốt cùng năng lực nắm
    bắt tình hình, tìm địch, phân tích dữ liệu đúng chức trách của CP.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000451: locks: [''Giữ câu
    hỏi tu từ “Hay có lẽ là ngược lại?” và suy ngẫm rằng chính việc có làm nổi những
    điều cơ bản hay không mới là yếu tố quyết định thắng bại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000452: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Fairy 01”, “Khu vực 42”, cụm “pháo binh—việc
    khẩn cấp” và yêu cầu “hỏa lực chế áp chống pháp sư”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000453: locks: [''Giữ tên
    “Tanya”, đại từ trần thuật “nó” theo DEC-P01-001 và mối quan hệ nhân quả giữa
    việc thấu hiểu công sức để hiện thực hóa những điều cơ bản với nụ cười khi nhận
    được câu trả lời sẵn sàng đáp ứng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000454: locks: [''Giữ ngôi
    “chúng ta”, các cụm “hỏa lực yểm trợ”, “pháo binh”, “nhử kẻ địch tới đây”, “cách
    phân chia các khu vực” và cảm giác vững tâm khi có những khẩu pháo lớn bên mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000455: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm “Pháo binh nghe rõ.” và thông báo khai hỏa ngay kèm lời
    đề nghị quan sát điểm chạm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000456: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Frontline Control”, các thuật ngữ “khẩu đội”,
    “điểm chạm”, “bắn hiệu chỉnh” và khẩu lệnh lặp lại hai lần rằng không cần bắn
    hiệu chỉnh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000457: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “mình” theo DEC-P01-001 và lời cảm thán mê mẩn trình độ
    điêu luyện này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000458: locks: [''Giữ dấu
    ngoặc kép hội thoại và khẩu lệnh pháo binh lặp lại hai lần “Bắn hiệu lực. Nhắc
    lại, bắn hiệu lực.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000459: locks: [''Giữ các
    cụm “Khu vực được quan sát”, “hỏa lực bão hòa cỡ nòng lớn” và chi tiết ngay cả
    các pháp sư cũng khó lòng chống đỡ nổi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000460: locks: [''Giữ đúng
    tính giả định quá khứ (“Nếu các vị trí đó được phòng thủ kiên cố hoặc họ có một
    pháo đài, có lẽ họ đã có thể trụ vững được”) và vế đối lập về sức ép quá lớn đối
    với những công sự phòng ngự được dựng lên riêng lẻ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000461: locks: [''Giữ các
    cụm “pháo kích bão hòa”, thông số “từ 120 đến 255 mm”, “hỏa lực có kỷ luật” và
    “pháo binh có trinh sát viên chỉ điểm”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000462: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Khu vực 42” và thông báo xác nhận khu vực này
    đã im tiếng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000463: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “mình” theo DEC-P01-001 và lập luận ngay cả pháp sư cũng
    gục ngã trước đạn pháo nếu bị giáng đòn khi không thể di chuyển, nên dù không
    muốn vẫn chọn chiến đấu trên bầu trời vì ít khả năng bị bắn trúng hơn mặt đất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000464: locks: [''Giữ đại
    từ “mình”, “chúng ta” theo DEC-P01-001 và ý hôm nay chẳng phải than thở về lựa
    chọn bị động ấy vì mọi thứ từ đầu chí cuối đều suôn sẻ và có thể tiến quân an
    toàn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000465: locks: [''Giữ tên
    “Tanya”, đại từ trần thuật “nó” ở câu đầu theo DEC-P01-001, chỉ đánh dấu chữ nghiêng
    đúng câu thứ hai `*Chà, sự hiệu quả thật tuyệt vời làm sao.*` theo DEC-P01-002,
    và giữ ngôi “chúng ta” cùng liên tưởng Clausewitz ở câu thứ ba (“một sự nối dài
    tàm tạm chấp nhận được của ngoại giao”).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000466: locks: [''Giữ đại
    từ “mình”, “chúng ta” theo DEC-P01-001 và nhận định đồng ý rằng chiến tranh là
    một sự lãng phí tài nguyên nên cần giải quyết cho xong thật nhanh chóng.'']'
  non_canon: true
