task_id: vol-03-ch-04-b05
baseline_sha256: dced5fd1353b9294486b2cf0915d5bc794bb671b8998fec7d22573f8a7496607
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: fb12776001a1085bd7a7e5c13b985e3b046f6ec9159efa7d27f4766fe90c61fc
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098: locks: [''Giữ tên
    `Weiss`, đại từ `Anh` và việc dùng danh xưng `cấp trên` / `Thiếu tá` để phân biệt
    rõ chủ thể trong trần thuật điểm nhìn Weiss.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000099: locks: [''Giữ dấu
    ba chấm mở đầu, đại từ `anh` / `mình` và ý nhận ra mình đã cất công thái quá,
    chạy đôn chạy đáo chẳng vì lý do gì cả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000100: locks: [''Giữ câu
    đáp lễ phép của Weiss `“Ồ, ờ, không đâu ạ. Chuyện đó không có gì to tát cả.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000101: locks: [''Giữ đại
    từ `Anh` / `mình` và chính xác cụm trích dẫn in nghiêng `*“Tùy ý Trung úy ạ”*`
    khớp nguyên văn với `p000079` (`ch-04-b04`) theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000102: locks: [''Giữ câu
    hỏi của Tanya `“Hửm? Có chuyện gì thế, Thiếu úy Serebryakov?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000103: locks: [''Giữ câu
    đáp lễ phép của Visha `“Ồ, tôi chỉ đang khâm phục sự tận tâm và chu đáo tỉ mỉ
    của Trung úy Weiss thôi ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000104: locks: [''Giữ định
    danh `Thiếu tá von Degurechaff`, `Weiss`, `Serebryakov`, giả định trái thực tế
    trong quá khứ (`Lẽ ra Weiss phải hiểu`) và cụm chữ nghiêng `*“Tùy ý Trung úy ạ.”*`
    theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000105: locks: [''Giữ đại
    từ `Anh`, tên `Serebryakov` và cấu trúc giả định quá khứ đi kèm sắc thái phỏng
    đoán (`Nếu đầu óc tỉnh táo, có lẽ anh đã nắm bắt được ẩn ý...`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000106: locks: [''Giữ đại
    từ `mình` trong nội tâm, `anh` ở phần dẫn và chính xác hai mệnh đề chữ nghiêng
    tách bởi phần dẫn trần thuật theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000107: locks: [''Giữ tên
    `Weiss`, cụm trong ngoặc kép `“nghỉ phép thời chiến”` và sự đối lập giữa việc
    điều trị y tế ở hậu phương hay hết ca trực dưới chiến hào với kỳ nghỉ thực sự
    đầu tiên của `anh`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000108: locks: [''Giữ sự
    chuyển đổi đối tượng trong lời Tanya: khen Weiss với Visha (`anh ấy là một tấm
    gương mẫu mực trong việc giữ liên lạc`), rồi dặn dò Weiss (`chúng tôi` / `tôi`
    – `anh`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000109: locks: [''Giữ lời
    chúc của Weiss `“Rõ. Chúc Thiếu tá thượng lộ bình an.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000110: locks: [''Giữ lời
    chào đáp lại của Tanya `“Nhất định rồi, cảm ơn anh, và một lần nữa xin lỗi anh
    nhé.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000111: locks: [''Giữ các
    định danh `Thiếu tá von Degurechaff`, `Tướng von Zettour` và lời yêu cầu gặp khẩn
    cấp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000112: locks: [''Giữ câu
    đáp lễ phép của viên sĩ quan trực ban `“Ồ, thưa Thiếu tá, thật vô cùng xin lỗi,
    nhưng hiện giờ Tướng quân đang ra ngoài ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000113: locks: [''Giữ chính
    xác mệnh đề chữ nghiêng mở đầu `*Hừm, chuyện này không thường xuyên xảy ra lắm*`
    theo DEC-P01-002, đại từ `nó` quy chiếu Tanya và `ông ấy` quy chiếu Zettour theo
    DEC-P01-001, cùng câu hỏi xin gặp `Tướng von Rudersdorf`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000114: locks: [''Giữ đại
    từ `Nó` / `nó` quy chiếu Tanya, định danh `Tướng von Zettour` và thuật ngữ `viên
    sĩ quan tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000115: locks: [''Giữ định
    danh `Thiếu tá von Degurechaff`, `Văn phòng Bộ Tổng tham mưu` và lời thưa ngập
    ngừng lễ phép.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000116: locks: [''Giữ tên
    `Tanya`, chức danh `viên sĩ quan trực ban` và sự đối lập giữa việc chuẩn bị tinh
    thần đối phương sẽ ngần ngại với sự sẵn sàng tiết lộ ngoài dự tính.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000117: locks: [''Giữ câu
    hỏi dò hỏi lịch sự của Tanya `“Ra vậy. Thế họ có thể đang ở đâu được nhỉ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000118: locks: [''Giữ đại
    từ `nó` quy chiếu Tanya, định danh `các sĩ quan Bộ Tổng tham mưu` và mạch suy
    luận dựa trên kinh nghiệm của Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000119: locks: [''Giữ định
    danh `Bộ Tổng tham mưu Lục quân Đế quốc` và quan hệ nhân quả về sự liên lạc chặt
    chẽ giữa các sĩ quan chỉ đạo tác chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000120: locks: [''Giữ câu
    trần thuật ngắn `Đó là lý do Tanya không sao tin nổi chuyện này.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000121: locks: [''Giữ đại
    từ `nó` và ý chưa thực sự hiểu ra vấn đề ngay cả khi được báo văn phòng gần như
    trống không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000122: locks: [''Giữ đại
    từ `nó`, các từ chỉ phỏng đoán (`biết đâu`, `có lẽ`) về buổi lễ lớn ở triều đình
    hay dịp lễ lạt, tiệc tùng và câu kết `Đó là kỳ vọng ngây thơ của nó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000123: locks: [''Giữ định
    danh `Văn phòng Bộ Tổng tham mưu` và nhận định phủ định mạnh về nhóm người nghiêm
    túc cứng nhắc ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000124: locks: [''Giữ câu
    trả lời của sĩ quan trực ban và chính xác cụm chữ nghiêng `*sảnh bia*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000125: locks: [''Giữ câu
    hỏi nhại lại không in nghiêng `“Sảnh bia ư?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000126: locks: [''Giữ đại
    từ `nó` và chức danh `viên sĩ quan trực ban`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000127: locks: [''Giữ toàn
    bộ câu độc thoại nội tâm in nghiêng `*Anh ta vừa nói cái gì với mình thế?*` theo
    DEC-P01-002 và đại từ `mình` theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000128: locks: [''Giữ câu
    độc thoại nội tâm in nghiêng `*Sảnh bia á?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000129: locks: [''Giữ câu
    độc thoại nội tâm in nghiêng `*Sảnh bia là cái gì?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000130: locks: [''Giữ cụm
    độc thoại nội tâm in nghiêng `*Sảnh bia.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000131: locks: [''Giữ câu
    độc thoại nội tâm in nghiêng `*Đó là nơi để uống rượu bia.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000132: locks: [''Giữ toàn
    bộ câu hỏi độc thoại nội tâm in nghiêng và định danh `Bộ Tổng tham mưu` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000133: locks: [''Giữ lời
    giải thích của sĩ quan trực ban (`Tôi` – `Thiếu tá`) về việc họ hô hào uống rượu
    ăn mừng chiến thắng của `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000134: locks: [''Giữ lời
    cảm ơn công vụ chuẩn mực của Tanya `“Vâng, cảm ơn anh vì đã vất vả làm nhiệm vụ.
    Vậy tôi xin phép cáo từ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000135: locks: [''Giữ đại
    từ `nó` và chi tiết buộc phải dồn gần như toàn bộ tâm sức chỉ để giữ nguyên nét
    mặt vô cảm và gật đầu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000136: locks: [''Giữ lời
    chúc ngủ ngon của sĩ quan trực ban `“Vâng, thưa Thiếu tá. Chúc Thiếu tá ngủ ngon.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000137: locks: [''Giữ chức
    danh `viên sĩ quan trực ban`, tên `Tanya` và chi tiết mặt mày tối sầm chui vào
    giường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000138: locks: [''Giữ các
    định danh `các sĩ quan tham mưu`, `Thiếu tá Tanya von Degurechaff`, `Văn phòng
    Bộ Tổng tham mưu` và nét hài hước về việc vật lộn với cơn dư vị say rượu đầu tiên
    sau một thời gian dài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000139: locks: [''Giữ câu
    mở lời của Tanya với Zettour `“Thưa Tướng quân, xin thứ lỗi cho tôi, nhưng…”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000140: locks: [''Giữ đại
    từ `Nó`, định danh `Tướng von Zettour` và `Bộ Tổng tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000141: locks: [''Giữ lời
    nhận xét của Zettour (`Tôi` – `Thiếu tá`), thuật ngữ `hạm đội`, `chỉ huy căn cứ`
    và kết luận rằng `cả hai người` đều đã phạm sai lầm trong quá trình thực thi nhiệm
    vụ.'']'
  non_canon: true
