choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130: locks: [''Giữ cụm
    `Đám cựu binh lắm chuyện`, cấp bậc và chức vụ `Tướng von Romel, tư lệnh quân đoàn`,
    đại từ `ông` và chi tiết cửa cược được đặt nhiều nhất là ông đã nổi trận lôi đình
    rồi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000131: locks: [''Giữ câu
    chuyển ý `Tình hình là như thế đấy.` và lý do tiểu đoàn được chào đón hơn bao
    giờ hết nhờ có toàn các cựu binh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000132: locks: [''Giữ thuật
    ngữ `con tàu chở quân`, danh xưng `Tư lệnh von Romel`, và bảo toàn chính xác hai
    câu độc thoại nội tâm in nghiêng ở cuối đoạn theo `DEC-P01-002` với cặp đại từ
    `Ông ấy` – `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000133: locks: [''Giữ trọn
    câu độc thoại nội tâm in nghiêng toàn đoạn có dấu ba chấm mở đầu theo `DEC-P01-002`:
    `*…Mình muốn đấm cho bản thân trong quá khứ một cú vì đã nghĩ như vậy.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000134: locks: [''Giữ định
    danh đầy đủ `Thiếu úy Ma pháp Warren Grantz`, hành động thầm nện cho bản thân
    trong quá khứ một cú nhẹ trong đầu và việc tập trung vào tình hình trước mắt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000135: locks: [''Giữ câu
    khẳng định ngắn gọn: `Nhiệm vụ rất đơn giản.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000136: locks: [''Giữ mục
    tiêu `nhiệm vụ đối phó lính bắn tỉa`, bối cảnh sa mạc nhấp nhô mênh mông đầy chỗ
    ẩn nấp, lựa chọn duy nhất của `Grantz và các đơn vị của anh` là dùng `công thức
    nổ` thổi tung cả khu vực, cùng bế tắc không biết làm sao xác nhận đã diệt được
    địch hay chưa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000137: locks: [''Giữ thông
    báo vô tuyến chuẩn mực: `“Sở chỉ huy gọi tất cả các đơn vị. Tôi nhắc lại, sở chỉ
    huy gọi tất cả các đơn vị.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000138: locks: [''Giữ tác
    động của bụi cát sa mạc làm hỏng `súng trường bộ binh` và các cỗ máy khác, sự
    đối lập giữa `Quả cầu tính toán` / `Quả cầu Tính toán Xung kích Type 97` đáng
    tin cậy với những viên đạn dùng để `nạp giữ công thức` (`đạn ma pháp`) không ổn
    định đòi hỏi kiểm tra thường xuyên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000139: locks: [''Giữ bước
    tự hiệu chỉnh `Nhưng giới cấp trên lại không tính đến chuyện đó. Hay đúng hơn
    là họ không thể tính đến.` và quyết tâm tiến hành `các trận đánh cơ động` của
    `Tư lệnh von Romel` bất chấp môi trường điên rồ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000140: locks: [''Giữ thông
    tin thông báo truyền tới xác nhận không có gì thay đổi trong mệnh lệnh của họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000141: locks: [''Giữ nguyên
    khẩu lệnh: `“Khép chặt hai sườn! Tôi nhắc lại, khép chặt hai sườn!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000142: locks: [''Giữ thuật
    ngữ `Chiến tranh cơ động` bắt đầu ngay khoảnh khắc họ đặt chân lên bờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000143: locks: [''Giữ sự
    đồng thuận tấn công quân địch lúc chúng đang mất cảnh giác vì nghĩ sẽ mất một
    thời gian để thiết lập xong `các tuyến tiếp tế` và những công tác hậu cần khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000144: locks: [''Giữ lời
    gọi vô tuyến từ `Fairy 01` tới `Kampfgruppe Bảy`, đại từ `chúng ta` và mệnh lệnh
    đẩy các phòng tuyến lên phía trước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000145: locks: [''Giữ lời
    gọi vô tuyến từ `Cerberus 01` tới `Kampfgruppe Ba`, thông tin đang theo sau `Kampfgruppe
    Bảy` và lệnh sẵn sàng yểm trợ cho mũi đột phá.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000146: locks: [''Giữ học
    thuyết vòng ra phía sau bao vây và tiêu diệt trong khi cánh trung tâm ghìm chân
    quân địch, sự so sánh với cánh bên phía bờ biển và nỗi ngán ngẩm khi bị ra lệnh
    thực hiện `mũi cơ động bọc sườn` giữa biển cát.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000147: locks: [''Giữ cụm
    danh ngữ cảm thán có dấu ba chấm cuối câu về cuộc hành quân đường dài trên sa
    mạc hầu như không có lấy một cột mốc địa hình nào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000148: locks: [''Giữ thuật
    ngữ `tốc độ tác chiến`, định danh `hai Kampfgruppe Bảy và Ba`, cùng mong muốn
    quay về `chính quốc` hoặc những bãi biển ở `Brest`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000149: locks: [''Giữ khẩu
    lệnh: `“Chuẩn bị bay theo đội hình! Giữ nguyên vị trí!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000150: locks: [''Giữ mệnh
    lệnh kiểm tra `tín hiệu dẫn đường` và yêu cầu `Các anh báo cáo trực tiếp cho chỉ
    huy tiểu đoàn!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000151: locks: [''Giữ cụm
    ngắn có dấu ba chấm: `Mệnh lệnh bay theo đội hình…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000152: locks: [''Giữ chữ
    viết tắt `CP` và hành động kiểm tra `máy thu` của mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000153: locks: [''Giữ chính
    xác câu đầu in nghiêng `*Quả nhiên.*` theo `DEC-P01-002`, thuật ngữ `tín hiệu
    dẫn đường`, chức danh `chỉ huy tiểu đoàn` và việc `Thiếu tá von Degurechaff` đang
    bay dẫn đầu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000154: locks: [''Giữ sự
    đối lập giữa phản ứng đơn thuần ngạc nhiên của đám lính bên các `Kampfgruppe`
    với nhận thức về việc `cô` đang làm ắt hẳn phải cực kỳ vất vả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000155: locks: [''Giữ trọn
    đoạn độc thoại nội tâm in nghiêng theo `DEC-P01-002`, quy chiếu chỉ huy tiểu đoàn
    bằng `Cô ấy` / `cô ấy` và tự quy chiếu Grantz bằng `mình` trong giả định sẽ quay
    cuồng với chuyện định hướng dẫn đường và trở nên vô dụng trong vai trò chỉ huy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000156: locks: [''Giữ tên
    riêng `Grantz`, đại từ `anh`, thuật ngữ `trận tác chiến cơ động cao` trên sa mạc
    và nhận xét những điều cơ bản vẫn giống như mọi khi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000157: locks: [''Giữ đại
    từ `Anh` – `anh` và sự trưởng thành qua lặp đi lặp lại để giữ cái nhìn không chút
    ủy mị và chuẩn bị hiệu quả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000158: locks: [''Giữ lời
    nhắc thuộc cấp của Grantz: `“Nếu không muốn bị mù thì kiểm tra kính bảo hộ đi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000159: locks: [''Giữ phẩm
    chất linh hoạt, dễ thích nghi của một sĩ quan trẻ (`anh`), danh xưng `Thiếu tá
    von Degurechaff` và thuật ngữ `kính bảo hộ hàng không` cỡ lớn hơn để tác chiến
    trên sa mạc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000160: locks: [''Giữ sự
    đối lập giữa lời phàn nàn của nhiều người về mẫu `kính bảo hộ` mới vừa to vừa
    nặng với việc `Grantz` luôn đảm bảo các thuộc cấp đều đeo chúng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000161: locks: [''Giữ công
    dụng giảm bớt ánh sáng và bảo vệ mắt khỏi cát bụi, đại từ `Anh` và nhận thức bản
    năng rằng đó là trang bị bắt buộc trên `lục địa phía nam`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000162: locks: [''Giữ mệnh
    lệnh xuất phát qua vô tuyến: `“Fairy 01 gọi Kampfgruppe Bảy. Bắt đầu tiến quân!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000163: locks: [''Giữ lời
    hô hưởng ứng: `“Được rồi, lên đường thôi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000164: locks: [''Giữ dấu
    gạch ngang dài và nhận định đó là ý chí của cả đất nước `Thiếu úy Grantz` lẫn
    các quốc gia khác bất kể nơi đâu hay môi trường ra sao.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000165: locks: [''Giữ câu
    kết cảnh ngắn gọn: `Vậy nên những người lính buộc phải thực hiện điều đó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000166: locks: [''Giữ tiêu
    đề chuyển cảnh viết hoa toàn bộ: `CÙNG NGÀY, CUỘC HỌP QUỐC PHÒNG LÂM THỜI CỦA
    CỘNG HÒA TỰ DO`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000167: locks: [''Giữ phép
    đối lập giữa bên giành thắng lợi chắc chắn sẽ ăn mừng và bên hứng chịu tổn thất
    thấy tình hình thật không sao chịu đựng nổi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000168: locks: [''Giữ danh
    xưng `Tướng de Lugo`, đại từ `ông ta`, hình ảnh uống cạn tách trà thở dài ngước
    nhìn trần nhà với vẻ chán ngấy trước màn đổ lỗi khó coi không hồi kết, và động
    tác cụp mắt xuống xấp tài liệu trên bàn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000169: locks: [''Giữ thuật
    ngữ `báo cáo tác chiến`, đại từ `ông ta`, định danh `Lục quân Đế quốc` và thực
    trạng phần lớn báo cáo chủ yếu chỉ trích đồng nghiệp và tự tâng bốc bản thân thay
    vì truyền đạt diễn biến trận chiến.'']'
  non_canon: true
