unit_count: 42
segment_id_start: YS-LN03/Text/chapter006_002.xhtml/p000348
segment_id_end: YS-LN03/Text/chapter006_002.xhtml/p000389
choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348: locks: [''Giữ nhận
    định đây hẳn sẽ là một chuyến bay khá dễ chịu, đại từ `họ` nối mạch từ cuối B11,
    và lựa chọn phát hiện rồi tập kích `các sở chỉ huy nhỏ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000349: locks: [''Giữ sự
    tăng tiến giữa việc được an toàn và thu được kết quả trong khi vẫn an toàn, cùng
    phương án trong tình huống ngược lại—nếu rủi ro bất ngờ leo thang vượt quá ngưỡng
    chấp nhận được—`tiểu đoàn` chỉ cần quay đầu và `thoát ly giao chiến`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000350: locks: [''Giữ hình
    ảnh đêm hôm ấy `Tanya` bay lên bầu trời với tâm thế tương đối thư thái.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000351: locks: [''Giữ cái
    lạnh cóng của sa mạc về đêm đối lập với không gian yên tĩnh êm ả, kinh nghiệm
    ở `mặt trận sông Rhine` và `chiến trường phương bắc`, việc không phải `xuất kích
    khẩn cấp vào ban đêm` hay đối mặt với các đơn vị địch quy mô lớn, và đại từ `nó`
    theo `DEC-P01-001`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000352: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, đại từ `họ` cho đơn vị, và sự chuyển biến từ niềm
    vui vì chuyến bay suôn sẻ sang cảm giác bất an dần gặm nhấm khi bay ra xa hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000353: locks: [''Giữ chính
    xác hai cụm nhấn mạnh tách rời bằng `*...*` theo `DEC-P01-002`: `*Nơi này* quá
    đỗi *yên tĩnh.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000354: locks: [''Giữ dấu
    ba chấm mở đầu, cảnh báo của Tanya dùng `Chúng ta` về khả năng chạm trán `toán
    tuần tra` hoặc `các đơn vị biệt kích` của địch bất cứ lúc nào, và mệnh lệnh quan
    sát mặt đất thật kỹ lưỡng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000355: locks: [''Giữ câu
    đáp chuẩn mực của thuộc cấp: `“Rõ, thưa chỉ huy.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000356: locks: [''Giữ mệnh
    lệnh cho tất cả các đơn vị đề cao cảnh giác với cả bầu trời lẫn mặt đất khi đã
    gần vị trí dự kiến của địch, dè chừng `các toán tuần tra` hoặc `biệt kích`, đặc
    biệt chú ý `những đụn cát` và không bỏ sót bất kỳ nguồn sáng nào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000357: locks: [''Giữ nhận
    định hoàn toàn có khả năng quân địch đang cảnh giác trước nguy cơ bị lùng sục.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000358: locks: [''Giữ thuật
    ngữ `cuộc hành quân phân tán` tiến hành trong bí mật là nước đi hợp lý, và kết
    luận `chúng ta` phải rà soát thật kỹ lưỡng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000359: locks: [''Giữ đại
    từ `chúng ta` / `chính mình` và cấu trúc tăng tiến phủ định: dù tiến xa đến đâu
    cũng chẳng bắt gặp bất kỳ sinh vật sống nào khác ngoài chính mình, huống hồ là
    quân địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000360: locks: [''Giữ câu
    gọi vô tuyến: `“Fairy 01 gọi các thành viên Tiểu đoàn Fairy.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000361: locks: [''Giữ lập
    luận thông thường một chiến trường vắng bóng quân thù là tình trạng đáng hoan
    nghênh vì chẳng mấy ai muốn tự rước rắc rối vào thân, nên thông thường `chúng
    ta` hẳn phải mừng vì không thấy địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000362: locks: [''Giữ ý về
    một số ít trường hợp ngoại lệ đáng kể khi một không gian hoặc vùng lãnh thổ lẽ
    ra phải có thứ gì đó lại trống không, và bảo toàn chính xác hai cụm in nghiêng
    đối lập theo `DEC-P01-002`: `*không có gì ở đây*` và `*có thứ gì đó đang mất tích*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000363: locks: [''Giữ khẩu
    lệnh yêu cầu báo cáo: `“Các đại đội trưởng, báo cáo đi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000364: locks: [''Giữ báo
    cáo của `Đại đội Hai` với đại từ `Chúng tôi`: `“Đại đội Hai, không chạm trán địch.
    Chúng tôi chưa phát hiện thấy gì cả.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000365: locks: [''Giữ báo
    cáo của `Đại đội Ba` với đại từ `chúng tôi`: `“Đại đội Ba, không có gì ngoài chúng
    tôi ở ngoài này cả.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000366: locks: [''Giữ báo
    cáo ngắn gọn của `Đại đội Bốn`: `“Đại đội Bốn, không phát hiện tiếp xúc.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000367: locks: [''Giữ kết
    luận việc một sự việc được dự tính lại không diễn ra là dấu hiệu của một tình
    huống cực kỳ đáng lo ngại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000368: locks: [''Giữ dấu
    ba chấm mở đầu và câu lẩm bẩm: `“…Kỳ lạ thật.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000369: locks: [''Giữ câu
    nhận xét nội tâm: `Chuyện này hơi vô lý rồi đấy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000370: locks: [''Giữ sự
    đối lập giữa việc địch vắng mặt ở một vị trí với vắng mặt ở tất cả mọi vị trí,
    và cảm giác như đang đuổi theo những bóng ma.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000371: locks: [''Giữ thuật
    ngữ `cuộc hành quân phân tán` của `chúng` và hình ảnh so sánh như một ảo ảnh giữa
    sa mạc cát.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000372: locks: [''Giữ dấu
    ba chấm mở đầu và câu hỏi tự vấn: `…Một ảo ảnh ư?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000373: locks: [''Giữ câu
    khẳng định ngắn: `Đó là một giả thuyết.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000374: locks: [''Giữ câu
    hỏi giả định: `Nhưng nhỡ đâu giả thuyết đó lại là sự thật thì sao?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000375: locks: [''Giữ kế
    hoạch tiêu diệt từng cánh quân địch đang tiến lại gần theo hướng phân tán, và
    sự đối lập giữa trường hợp `chúng` tập trung lại (quá sức đối phó) với trường
    hợp tách làm ba (`chúng ta` có thể áp đảo cả về lượng lẫn về chất).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000376: locks: [''Giữ định
    danh `Tướng von Romel`, `Căn cứ Hải quân Turus`, và nhận định ông không phạm sai
    lầm khi cho `chúng ta` xuất quân đi tiêu diệt địch trước khi chúng kịp bao vây
    căn cứ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000377: locks: [''Giữ chính
    xác toàn bộ đoạn in nghiêng theo `DEC-P01-002` cùng thuật ngữ `cuộc hành quân
    phân tán`: `*Ít nhất là không sai, nếu quân địch thực sự đang tiến hành một cuộc
    hành quân phân tán.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000378: locks: [''Giữ suy
    luận phủ định `Nhưng hẳn là chúng không làm vậy`, sự đối lập giữa ý định tấn công
    địch lúc đang chia tách với khả năng thực chất lúc này `chúng` đã tập trung lực
    lượng và thậm chí đã dàn xong `đội hình chiến đấu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000379: locks: [''Giữ chi
    tiết `sở chỉ huy` của `chúng ta` vẫn chưa định vị được địch, hệ quả rơi vào vế
    bất lợi trong `luật Lanchester` nếu bị lực lượng địch quy mô gấp đôi tấn công,
    và sự đối lập chia cắt (có thể thắng) với tập trung (không tài nào đối phó nổi).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000380: locks: [''Giữ mệnh
    lệnh khẩn cấp kết nối với `sở chỉ huy`, bảo toàn chính xác chuỗi câu độc thoại
    nội tâm in nghiêng ở giữa đoạn theo `DEC-P01-002`, đại từ `nó` theo `DEC-P01-001`,
    định danh `Quân đội Đế quốc`, và câu cảm thán kết đoạn: `“Quân đội Đế quốc đã
    quá tự phụ rồi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000381: locks: [''Giữ lời
    tự trách vì đánh giá thấp trí thông minh của kẻ địch, sự phê phán lối tư duy cứng
    nhắc và thiếu đổi mới khi ngừng suy nghĩ để đi theo tiền lệ, cùng hệ quả phải
    trả giá vì suy nghĩ theo `thiên kiến vô thức` rằng chỉ đang đối đầu với một `đội
    quân thuộc địa` ở phương nam.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000382: locks: [''Giữ khẳng
    định kép về cái bẫy do `Lục quân Cộng hòa` giăng ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000383: locks: [''Giữ tiếng
    hô cảnh báo của Tanya: `“Chúng đã lừa chúng ta! Quân địch không có ở đây!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000384: locks: [''Giữ câu
    hỏi và câu trả lời ngắn: `Chúng đang ở đâu? Điều đó quá rõ ràng.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000385: locks: [''Giữ thuật
    ngữ `nguyên tắc tập trung binh lực`, việc địch sử dụng hiệu quả nguồn lực hiện
    có, và hình ảnh chúng đang cười khẩy trước những dự đoán ngây thơ của `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000386: locks: [''Giữ kết
    luận lực lượng địch đã tập trung lại chắc chắn đang được tung vào `chiến trường
    chính`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000387: locks: [''Giữ khẩu
    lệnh vô tuyến của `Tiểu đoàn trưởng` gửi tất cả `các đại đội` yêu cầu hủy bỏ nhiệm
    vụ của `các vị` và lặp lại lệnh tập hợp ngay lập tức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000388: locks: [''Giữ tư
    cách một chỉ huy đang thực hiện `nhiệm vụ trinh sát`, tên riêng `Tanya` đi cùng
    đại từ `nó` theo `DEC-P01-001`, và lý do ra lệnh liên lạc ngay với `sở chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000389: locks: [''Giữ câu
    quát hỏi khẩn trương kết thúc lô: `“Vẫn chưa nối liên lạc được với sở chỉ huy
    sao?!”`.'']'
  non_canon: true
