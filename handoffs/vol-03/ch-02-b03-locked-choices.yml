task_id: vol-03-ch-02-b03
baseline_sha256: e8bd1c0d28c15de861c72c52d0b9d34eca1715b039fec2d8a539cf65b73027f6
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 29f3f0cf703089e5c29cfc21bb9023bbea641964ae4e48d0ea942b7c6bb87e9c
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách xưng hô “thưa quý vị – tôi / chúng ta”, các tên chiến
    dịch “Chiến dịch Rot-Gelb”, “Chiến dịch Kinh hoàng và Khiếp sợ”, “Chiến dịch Lock
    Pick” và thông báo hoàn tất giai đoạn một đồng thời phát động giai đoạn tiếp theo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000022: locks: [''Giữ chi
    tiết những gì “viên sĩ quan” vừa đọc bằng “chất giọng nam trung vang rền” là “một
    câu trong quốc ca”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000023: locks: [''Giữ sự
    ngơ ngác của mọi người khi nghe lời quốc ca trong hoàn cảnh này, hành động Zettour
    “thoăn thoắt bật dậy, xoay ngoắt một trăm tám mươi độ so với vẻ lề mề uể oải trước
    đó”, phủ định “thậm chí chẳng buồn xin phép chủ tọa để phát biểu như lúc nãy”
    và ánh mắt trân trối không tin nổi như thể vừa bị lừa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000024: locks: [''Giữ dấu
    ngoặc kép hội thoại, trạng thái “vẫn đang xác nhận thêm”, căn cứ từ mật mã của
    đơn vị gửi điện tín và kết quả “phá hủy thành công sở chỉ huy Cụm tập đoàn quân
    Rhine thuộc Cộng hòa và khiến chúng hoàn toàn tê liệt”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000025: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi sững sờ “Ông ấy vừa nói cái gì cơ?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000026: locks: [''Giữ câu
    trần thuật ngắn “Lời thì thầm của một ai đó đã nói lên tất cả.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000027: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi nhắc lại báo cáo “Sở chỉ huy Cụm tập đoàn quân
    Rhine thuộc Cộng hòa đã bị phá hủy ư?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000028: locks: [''Giữ chi
    tiết có người thẫn thờ nhắc lại bản báo cáo khiến họ mới bắt đầu hiểu ra tầm vóc
    chấn động của sự việc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000029: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Chúng ta đã thổi bay kẻ địch… quân đội địch…
    tổng hành dinh của chúng ư?*` theo DEC-P01-002 và nhịp ngập ngừng đứt quãng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000030: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Chiến dịch Lock Pick”, “Cụm tập đoàn quân
    Rhine của Cộng hòa”, “Bộ Tổng tham mưu”, “quân đội dã chiến của Cộng hòa” và quan
    hệ suy luận từ lực lượng chủ lực sang mục tiêu tiêu diệt hoàn toàn quân đội dã
    chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000031: locks: [''Giữ chi
    tiết Zettour lập tức lên tiếng bồi thêm để đáp lại sự hoài nghi của họ “như thể
    vẻ uể oải trước đó của ông chỉ là một màn kịch”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000032: locks: [''Giữ dấu
    ngoặc kép hội thoại, khẳng định “Quân đội ta đã phá hủy hệ thống chỉ huy của địch
    ngay trong giai đoạn một” và lời mời đón chờ các báo cáo tiếp theo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000033: locks: [''Giữ định
    dạng tiêu đề chuyển cảnh in hoa toàn bộ “CÙNG NGÀY HÔM ĐÓ, VĂN PHÒNG BỘ TỔNG THAM
    MƯU, CỤC TÁC CHIẾN”, không thêm dấu nhấn mạnh `*...*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000034: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu khẩu lệnh ẩn dụ “Vừng ơi mở ra.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000035: locks: [''Giữ định
    danh “Văn phòng Bộ Tổng tham mưu”, trạng thái “căng thẳng như dây đàn nhưng không
    tài nào nén nổi nỗi phấn khích” và hành động tất bật làm nhiệm vụ chuẩn bị cho
    bước tiếp theo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000036: locks: [''Giữ các
    định danh “Bộ Tổng tham mưu”, “Cục Tác chiến”, “Chiến dịch Kinh hoàng và Khiếp
    sợ” và sự đối lập giữa bầu không khí chung với cảnh Cục Tác chiến vỗ lưng chúc
    mừng nhau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000037: locks: [''Giữ các
    định danh “sở chỉ huy Cụm tập đoàn quân Rhine thuộc Cộng hòa”, “Tiểu đoàn Pháp
    sư Trên không số 203” và việc quy công kết quả hoàn hảo cho màn thể hiện điêu
    luyện của tiểu đoàn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000038: locks: [''Giữ quân
    hàm và tên “Thiếu tướng von Rudersdorf”, câu trích dẫn trực tiếp của những kẻ
    bi quan và sự đối lập với thành quả mỹ mãn khi đặt kỳ vọng vào “cái gã ranh mãnh
    kia”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000039: locks: [''Giữ đúng
    hai cụm nhấn mạnh chữ nghiêng `*Zettour, đồ ranh mãnh. Ông đã rút từ trong túi
    ra cho chúng ta một quân bài cưng thật đáng đồng tiền bát gạo.*` và `*Cạn ly!*`
    theo DEC-P01-002, phần trần thuật ở giữa để phẳng không in nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000040: locks: [''Giữ các
    định danh “bộ phận Hậu cần”, “Chiến dịch Kinh hoàng và Khiếp sợ”, “Chiến dịch
    Lock Pick” và quan hệ nhân quả giúp chiến dịch diễn ra gần như hoàn toàn đúng
    kế hoạch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000041: locks: [''Giữ thắc
    mắc của Rudersdorf về điều đang khiến “người chiến hữu của mình” lo lắng khi bị
    gọi ra khỏi cuộc họp vì việc khẩn cấp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000042: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Bộ Ngoại giao”, “Khối Thịnh vượng chung” và
    việc nhận công hàm chính thức thông qua đại sứ quán.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000043: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi ngắn “Tối hậu thư ư?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000044: locks: [''Giữ dấu
    ngoặc kép hội thoại, phủ định “Không, đúng hơn là ngược lại.” và cụm trích dẫn
    trong dấu nháy đơn “‘thời khắc hợp tác quốc tế để khôi phục hòa bình đã điểm!’”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000045: locks: [''Giữ tiếng
    “ồ” vẻ đã hiểu và việc Rudersdorf thấu hiểu sự khó xử khi nhận lời đề nghị đàm
    phán hòa bình ngay lúc chuẩn bị cho một cuộc tổng tấn công lớn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000046: locks: [''Giữ dấu
    ngoặc kép hội thoại và hai câu hỏi liên tiếp về việc làm trung gian thúc đẩy hòa
    bình khiến mọi chuyện trở nên nhạy cảm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000047: locks: [''Giữ dấu
    ngoặc kép hội thoại, nguyên văn thuật ngữ Latin kèm ký hiệu chú thích chân trang
    “restitutio in integrum.²” (không in nghiêng theo đúng nguồn) và thời hạn đòi
    câu trả lời trong vòng một tuần.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000048: locks: [''Giữ quân
    hàm và tên “Thiếu tướng von Zettour”, câu trần thuật đầu để phẳng và dấu nhấn
    mạnh chữ nghiêng chỉ ở đúng câu hỏi cuối `*Khôi phục tình hình trở lại nguyên
    trạng như trước chiến tranh ư?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000049: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Restitutio in integrum”, “Hiệp ước Londinium”,
    câu hỏi phản bác giả định “Nếu chúng ta định đồng ý với chuyện đó, thì cớ sao
    chúng ta lại phải không chỉ một mà tới hai lần xóa sổ các mối đe dọa trong khu
    vực của mình?” và phủ định tuyệt đối ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000050: locks: [''Giữ định
    danh “Khối Thịnh vượng chung”, sự chuyển biến từ chỗ khó hiểu trước thời điểm
    kỳ lạ của thông báo sang việc các điều khoản xóa tan nỗi bối rối và lời đáp lại
    gay gắt của Rudersdorf.'']'
  non_canon: true
