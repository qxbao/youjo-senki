source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 2ffd561ced106a6f777b3a37539053b74c08e014733900bd64cd65c4fb4fc7b1
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302: locks: [''Giữ dấu
    ngoặc kép hội thoại, kính ngữ “ạ” và câu hỏi tu từ khen ngợi đồ ăn quá mức cầu
    kỳ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000303: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Thiếu tá”, ngôi “tôi / chúng tôi”, thuật ngữ “Bộ
    Tư lệnh Hạm đội” và mạch lời bật mí chuyện câu trộm một đầu bếp xuất sắc cùng
    lời chúc tận hưởng các bữa ăn trong không gian chật hẹp không có mấy thứ khác
    để mong đợi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000304: locks: [''Giữ cụm
    “vị thuyền trưởng”, thuật ngữ “bộ phận Công nghệ”, ngôi “chúng ta” trong suy nghĩ
    nội tâm, và chỉ đánh dấu chữ nghiêng đúng hai phần suy nghĩ `*Và kết quả của chuyện
    đó*` cùng `*là khi số ngư lôi chúng ta mới được cấp gần đây bị phát hiện có lỗi,
    các thuyền trưởng tàu ngầm đã trút cơn giận lên bộ phận Công nghệ thay vì tàu
    địch.*` theo DEC-P01-002 (giữ phần dẫn lời của người kể chuyện nằm ngoài dấu sao).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000305: locks: [''Giữ tên
    “Treizel” và quan hệ nhân quả các thuyền trưởng tàu ngầm được đãi ngộ đặc biệt
    tốt về ăn uống để xoa dịu họ, mà người đầu bếp xuất sắc kia là một ví dụ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000306: locks: [''Giữ dấu
    ngoặc kép hội thoại và nhận định khi nhà nước tâm lý đến thế thì thường có nghĩa
    là đang có chuyện gì khác diễn ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000307: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi”, danh xưng “Thiếu tá” và câu gạt đi đầy ẩn ý.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000308: locks: [''Giữ cụm
    “bộ tư lệnh tối cao” và ý cả hai cùng nhoẻn miệng cười vì các chỉ huy đều hiểu
    nếu cấp trên tình cờ thể hiện chút quan tâm chu đáo thì ắt có lý do riêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000309: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi / chúng tôi”, địa danh “Norden” và lời nhờ chuyển
    lời cảm ơn tới chiếc tàu ngầm đã thực hiện màn nghi binh ngoài khơi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000310: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Thiếu tá” và câu hỏi về việc đã ở trên vùng biển
    đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000311: locks: [''Giữ dấu
    ngoặc kép hội thoại, chỉ đánh dấu chữ nghiêng đúng cụm `*màn đánh lạc hướng tuyệt
    hảo*` theo DEC-P01-002, ngôi “Tôi”, kính ngữ “ạ”, thuật ngữ “bộ phận Công nghệ”
    và dấu nháy đơn quanh cụm ‘ngư lôi nổ nghi binh’.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000312: locks: [''Giữ dấu
    ngoặc kép hội thoại, tiếng cười “Ha-ha-ha!”, ngôi “Chúng tôi” và lời kể hài hước
    về việc mời các nhà phát triển tới dự tiệc trên tàu để tri ân công sức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000313: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi”, tên “Degurechaff”, đại từ “nó” theo DEC-P01-001
    và sắc thái bông đùa nhiều hơn thường lệ nhưng giọng vẫn thoáng chút cam chịu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000314: locks: [''Giữ cụm
    “Vị thuyền trưởng”, dấu ngoặc kép hội thoại, danh xưng “Thiếu tá”, ngôi “tôi”
    và lời sực nhớ ra một chuyện suýt quên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000315: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi ngắn “Thưa ngài?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000316: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Chúng tôi” và định danh “Chiến dịch Lock Pick” đang
    được tiến hành.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000317: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi” và lời xin phép xem qua bức điện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000318: locks: [''Giữ tên
    “Degurechaff”, sự biến mất của bầu không khí nửa đùa nửa thật và chuỗi hành động
    cầm bức điện đọc lướt chăm chú, gật đầu một cái, đọc lại lần nữa rồi mỉm cười
    mãn nguyện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000319: locks: [''Giữ dấu
    ngoặc kép hội thoại và thuật ngữ ẩn dụ chiến lược “cánh cửa xoay”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000320: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và hình ảnh đôi mắt rực sáng như kẻ săn mồi dồn con mồi
    vào chân tường khiến trông nó như mất trí.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000321: locks: [''Giữ đánh
    dấu chữ nghiêng toàn bộ đoạn theo DEC-P01-002, cách gọi “cô bé này” trong suy
    nghĩ của vị thuyền trưởng và biệt danh “Bạch Ngân”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000322: locks: [''Giữ dấu
    ngoặc kép hội thoại, thuật ngữ “trận đánh bao vây cơ động”, “mặt trận Rhine”,
    chỉ đánh dấu chữ nghiêng đúng từ `*thật sự*` thứ hai theo DEC-P01-002, và đại
    từ trần thuật “Nó” theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000323: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, thuật ngữ “tiểu đoàn pháp sư trên không tinh nhuệ” và
    nhận xét về tâm tính của một con mãnh thú đã dồn được con mồi vào đúng vị trí.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000324: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi / chúng tôi”, danh xưng “Thiếu tá”, các định danh
    “Bộ Tổng tham mưu” và “Vùng Đất Thấp”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000325: locks: [''Giữ dấu
    ngoặc kép hội thoại và từ cảm thán “Hả?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000326: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “chúng tôi”, danh xưng “Thiếu tá”, cụm “tuyến tuần tra”
    và thông báo đang hướng về phía đông, sẽ nổi lên trước bình minh trong tư thế
    sẵn sàng cho đơn vị cất cánh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000327: locks: [''Giữ các
    định danh “Bộ Tổng tham mưu”, “Chiến dịch Lock Pick”, đại từ “nó” theo DEC-P01-001
    và dấu ngoặc kép quanh cụm “ngoại lệ đặc biệt”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000328: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “ngài, Thuyền trưởng”, ngôi “tôi” và lời chúc “võ
    vận trường cửu”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000329: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “chúng tôi / Tôi”, danh xưng “Thiếu tá” và lời đáp vinh
    dự được hỗ trợ kèm lời chúc may mắn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000330: locks: [''Giữ tên
    “Treizel”, đại từ “ông”, cụm “người lính Đế quốc” và niềm tự hào vì con tàu đã
    góp sức hoàn thành nhiệm vụ được giao.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000331: locks: [''Giữ tên
    “Degurechaff”, đại từ “ông” cho Treizel, đại từ “nó” cho Tanya theo DEC-P01-001
    và hành động trang trọng đưa tay ra chúc bình an thuận lợi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000332: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, đại từ “ông” và hình ảnh bàn tay nhỏ nhắn như tay cô
    con gái của ông nhưng vẫn là cái bắt tay với một người đồng đội.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000333: locks: [''Giữ danh
    xưng “Thuyền trưởng Treizel”, tên “Tanya” và cụm “các ống phóng ngư lôi phía mũi
    tàu”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000334: locks: [''Giữ dấu
    ngoặc kép hội thoại, các cụm “toàn Đại đội”, “Chỉ huy tiểu đoàn”, ngôi “chúng
    ta” và khẩu lệnh hô nghiêm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000335: locks: [''Giữ dấu
    ngoặc kép hội thoại, các danh xưng “Trung úy”, “thưa các quý ông”, “Mọi người”,
    “Thuyền trưởng Treizel”, ngôi “Chúng ta / tôi” và tên “Chiến dịch Lock Pick”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000336: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và phản ứng của các thuộc cấp khi đoán được đây là việc
    hệ trọng nên xốc lại tinh thần lắng nghe.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000337: locks: [''Giữ chỉ
    đánh dấu chữ nghiêng đúng câu hỏi `*Chiến dịch Lock Pick là gì?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000338: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm “thưa các quý ông”, các định danh “mặt trận Rhine”, “Lục
    quân Cộng hòa”, “Vùng Đất Thấp” và thông tin mũi xung kích đi đầu đã thổi bay
    tuyến chiến hào địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000339: locks: [''Giữ câu
    ngắn “Những tiếng reo hò vang lên.”.'']'
  non_canon: true
