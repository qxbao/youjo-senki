choices:
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182: locks: [''Giữ định
    danh `Đế quốc` và nhận định mở đầu về niềm tin rằng chiến tranh sẽ kết thúc với
    phần thắng thuộc về Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000183: locks: [''Giữ phủ
    định `không phải là một tương lai mà người ta vui lòng đón nhận`, định danh `Khối
    Thịnh vượng chung` và quyết tâm kháng cự đến cùng nhằm tránh khỏi cơn ác mộng
    ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000184: locks: [''Giữ các
    định danh `Lục quân Cộng hòa`, `chính quốc`, `Quân đội Liên minh Hiệp ước`, `các
    thuộc địa hải ngoại của Cộng hòa`, `Đế quốc`, `Cộng hòa Tự do`, `chính quyền quân
    quản` và `Lục quân Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000185: locks: [''Giữ tên
    riêng `Mary Sue`, định danh `Đế quốc` và trạng thái song hành `vừa thù địch vừa
    khiếp sợ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000186: locks: [''Giữ cách
    quy chiếu `Cô bé`, các định danh `Liên minh Hiệp ước`, `những người tị nạn`, `Cộng
    hòa` và nỗi thất vọng nặng nề khi ngay cả Cộng hòa cũng phải rời khỏi cuộc chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000187: locks: [''Giữ các
    định danh `Đế quốc`, `Cộng hòa`, `Lục quân Cộng hòa` và chuỗi diễn biến tâm lý
    từ kỳ vọng, vui mừng khôn xiết đến tuyệt vọng trước cục diện bế tắc và bàng hoàng
    khi chứng kiến sự sụp đổ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000188: locks: [''Giữ câu
    hỏi tu từ nội tâm in nghiêng bao trọn toàn đoạn `*Chẳng lẽ không ai có thể phong
    ấn cái ác của Đế quốc sao?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000189: locks: [''Giữ phủ
    định `không thể chấp nhận điều đó` và hành động `gạt phắt đi nỗi hoài nghi yếu
    đuối của chính mình` của những người tị nạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000190: locks: [''Giữ chính
    xác phạm vi chữ nghiêng ở câu phủ định đầu đoạn `*Chuyện đó không thể xảy ra được.*`
    theo DEC-P01-002, cấu trúc phủ định kép `công lý sẽ không làm ngơ trước sự bất
    công này` và việc nhiều người tị nạn hòa giọng phản đối sự bành trướng thêm nữa
    của Đế quốc tàn bạo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000191: locks: [''Giữ dấu
    ngoặc kép hội thoại và ngôi tự xưng `Chúng tôi`: `“Chúng tôi cũng sẽ chiến đấu.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000192: locks: [''Giữ sắc
    thái song hành `Được truyền cảm hứng, hay có lẽ là say sưa trước tiếng hô hào
    ấy`, hành động tình nguyện tòng quân và sự tiếp nhận của các quốc gia.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000193: locks: [''Giữ cấu
    trúc mở rộng `Mà không chỉ riêng những người tị nạn.`, chủ thể `Giới trẻ ở mỗi
    quốc gia` và chính xác phạm vi chữ nghiêng ở câu cuối `*Chúng ta phải gia nhập
    Quân đội Khối Thịnh vượng chung đang đối đầu với Đế quốc và chiến đấu!*` theo
    DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000194: locks: [''Giữ các
    định danh `Đế quốc`, `Hợp chúng quốc`, chi tiết các bài xã luận cảnh báo kèm bình
    luận chuyên gia và cấu trúc phủ định `chẳng hề tách biệt quá xa khỏi cục diện
    trên lục địa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000195: locks: [''Giữ cụm
    `cán cân quyền lực`, định danh `Đế quốc` và sự chuyển hướng tự nhiên của các cuộc
    tranh luận sang kêu gọi các nước chuẩn bị ứng phó vì sự an toàn của chính mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000196: locks: [''Giữ các
    định danh `Lục quân Cộng hòa`, `Đế quốc`, `Quân đội Cộng hòa Tự do` và sắc thái
    `đưa ra tuyên bố đầy vững tâm`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000197: locks: [''Giữ các
    định danh `Khối Thịnh vượng chung`, `Đế quốc`, `vị tân thủ tướng`, `Công tước
    Marlborough`, đại từ `ông` và mạch liên kết hợp lực chiến đấu dưới sự lãnh đạo
    thời chiến ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000198: locks: [''Giữ câu
    trần thuật ngắn gọn mở đầu phân cảnh: `Cô bé có sức mạnh.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000199: locks: [''Giữ cách
    quy chiếu `cô bé`, cụm `người bố Anson của mình`, hình ảnh thiên phú đưa lên một
    đẳng cấp hoàn toàn khác biệt và cấu trúc giả định trái thực tế trong quá khứ (`Nếu
    không có chiến tranh, tài năng ấy hẳn sẽ chẳng giúp ích gì nhiều cho cô bé, nên
    có lẽ nó đã cứ thế được giấu kín.`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000200: locks: [''Giữ tên
    riêng `Anson`, thuật ngữ `pháp sư` và cấu trúc phủ định `chỉ vì họ có tố chất
    không có nghĩa là họ bắt buộc phải trở thành pháp sư`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000201: locks: [''Giữ tên
    riêng `Mary`, các cách quy chiếu `bố` / `ông` – `cô bé` và quan hệ nhân quả nhấn
    mạnh ở câu cuối `Chính vì thế mà cô bé lại càng quyết tâm đến vậy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000202: locks: [''Giữ định
    danh `Đế quốc` và thái độ `miễn cưỡng chấp nhận thực tế rằng cuộc chiến vẫn tiếp
    diễn` song hành với việc chuẩn bị giành thêm một đại thắng nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000203: locks: [''Giữ chính
    xác từ chuyển ý in nghiêng ở đầu đoạn `*Tuy nhiên*` theo DEC-P01-002 và dấu ba
    chấm cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000204: locks: [''Giữ các
    định danh `Đế quốc`, `Khối Thịnh vượng chung`, `Liên minh Hiệp ước`, hai cấu trúc
    phủ định kép (`không thể tránh khỏi việc phải vượt biển`, `không phải là phương
    án tác chiến đổ bộ đường biển không được tính đến`) và tiền lệ chiến dịch đổ bộ
    cắt đứt tuyến tiếp vận ở hậu phương địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000205: locks: [''Giữ điều
    kiện trong ngoặc kép `“miễn là có thể giành được quyền kiểm soát mặt biển”`, định
    danh `Bộ Tư lệnh Hạm đội` và câu trả lời điều kiện `có lẽ khả thi nếu họ chấp
    nhận mạo hiểm bị xóa sổ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000206: locks: [''Giữ định
    danh `Đế quốc` và cụm `tình thế tiến thoái lưỡng nan nghiêm trọng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000207: locks: [''Giữ cấu
    trúc điều kiện và tình thái suy đoán (`Nếu bước vào một trận hải chiến, có lẽ
    họ có thể loại bỏ hoặc kiềm chế sức kháng cự của Khối Thịnh vượng chung vừa đủ
    lâu để đưa quân lên chính quốc.`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000208: locks: [''Giữ các
    định danh `Đế quốc`, `lực lượng chủ lực của Cộng hòa` và chuỗi hệ quả tất yếu
    nếu hạm đội bị xóa sổ (không còn đủ tiềm lực đánh tiếp một trận hải chiến nào
    nữa, các đơn vị đổ bộ bị cắt đứt tiếp tế và bị tiêu diệt sạch).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000209: locks: [''Giữ các
    định danh `chính quốc của Khối Thịnh vượng chung`, `Quân đội Khối Thịnh vượng
    chung`, hình ảnh `căn cứ chiến lược hùng mạnh của kẻ địch`, dấu ba chấm lửng và
    kết luận `thế hòa bất tận` ở cuối chương.'']'
  non_canon: true
