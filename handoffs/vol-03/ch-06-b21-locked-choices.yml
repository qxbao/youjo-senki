choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668: locks: [''Giữ sự
    đối lập giữa `Type 95` là cỗ máy có khiếm khuyết trầm trọng với `Type 97` mà `mình`
    dùng được khiến ngay cả `Tanya` cũng buộc phải giơ hai tay tán dương `Elinium
    Arms`, và việc `Nó` trân trọng sự an toàn cùng cảm giác yên tâm mà `Type 97` mang
    lại đến mức chọn đây làm `quả cầu chính đáng tin cậy` của `mình`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000669: locks: [''Giữ sự
    đan xen đại từ `nó` – `mình` theo `DEC-P01-001` khi thực sự bị dồn vào chân tường
    phải phớt lờ vô vàn mâu thuẫn nội tâm và ngậm ngùi từ bỏ trụ cột sự tồn tại của
    `mình` là `tự do tư tưởng`, cùng câu kết `Mạng sống quả thực là thứ không gì thay
    thế được.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000670: locks: [''Giữ đại
    từ `mình` khi khẳng định lần này không phải đối mặt với bất kỳ xung đột cực đoan
    nào như thế, và nhận định chẳng cần phải là `Tanya` thì người ta mới thấy vui
    mừng khi vượt qua được một chuyện mà không phải đưa ra những quyết định khó khăn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000671: locks: [''Giữ câu
    thoại nhận xét xu hướng ở `Đế quốc` thay đổi nhanh lắm, đặc biệt là đối với mấy
    tay `lính Cộng hòa` cứ ru rú ở các `thuộc địa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000672: locks: [''Giữ đại
    từ `nó` – `mình` theo `DEC-P01-001` khi miêu tả ngay cả `Tanya` cũng mang tâm
    trạng bông đùa dù chẳng giống tính cách của `nó`, và niềm vui sướng khi thoát
    khỏi lời nguyền bắt `mình` phải ca hát ngợi khen `Thượng đế` hay đại loại thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000673: locks: [''Giữ lời
    hô hào nâng cốc vì `Elinium Type 97`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000674: locks: [''Giữ lời
    khen ngắn gọn rằng thỉnh thoảng `Elinium Arms` cũng làm ăn ra trò.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000675: locks: [''Giữ lời
    hưởng ứng của thuộc cấp (`Tán thành, tán thành.`) và nhận xét nhờ thứ này mà `cuộc
    săn vịt` vừa rồi dễ thở hơn biết bao nhiêu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000676: locks: [''Giữ nhận
    định nếu chỉ nhìn vào nét khái quát thì trông cứ như `tiểu đoàn của mình` đã trải
    qua một trận đánh cam go, và `Chúng ta` có thể khoe rằng về cơ bản chỉ một mình
    `đơn vị ta` đã khiến quân địch phải một phen vất vả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000677: locks: [''Giữ cấu
    trúc nhấn mạnh giữa hai dấu gạch ngang rằng `Một tiểu đoàn`—đúng là đã được `tăng
    cường`, nhưng vẫn chỉ là một tiểu đoàn—đã đục thủng `vòng vây` đang giam hãm `quân
    bạn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000678: locks: [''Giữ mạch
    kể hào hùng giả định: khi `quân tiếp viện của địch` đã nằm gọn trong lòng bàn
    tay, `chúng ta` liền nhử `lực lượng chủ lực` của `chúng` vào rồi chặn đứng bước
    tiến của `chúng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000679: locks: [''Giữ chi
    tiết sau đó `chúng ta` còn quay ngược lại tấn công và thậm chí thực hiện cả một
    `đòn đánh chống mục tiêu mặt đất`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000680: locks: [''Giữ sự
    bóc trần thực tế rằng đó là kết quả khi tô vẽ thêm mỹ từ hoa mỹ vào cảnh `chúng
    ta` chạy đôn chạy đáo tìm đường thoát thân mà chẳng thu được `chiến quả thực tế`
    nào, cùng lời phát biểu giả định của ai đó bên `Lục quân Đế quốc Nhật Bản` về
    việc đơn vị hừng hực khí thế đã giáng đòn táo bạo vào `lực lượng chủ lực` của
    địch mà không hề hấn gì đúng như nhiệm vụ và giờ đang rút quân.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000681: locks: [''Giữ toan
    tính của `Mình` rằng chỉ lẩn tránh quân địch không thôi thì sẽ gay go, nên `chúng
    ta` mới thực hiện `đòn đánh chống mục tiêu mặt đất` đó vào phút chót để có chút
    hành động thực tế mà chỉ vào—quá hoàn hảo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000682: locks: [''Giữ nhận
    xét về mấy tay lính mới nghiệp dư tưởng mình là `pháp sư` chỉ vì thỉnh thoảng
    bay lượn được đôi chút giúp `mình` kiếm thêm kha khá điểm, và sự phân vân không
    biết có nên cộng đám đó vào `thành tích` của `mình` hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000683: locks: [''Giữ giải
    thích vì sao chuyện này nhạy cảm: nếu tính cả mấy chú chim non mới chỉ biết bay
    vào thì người ta sẽ đánh giá thấp `mình`, và cách `Đế quốc` thẩm định `số mạng
    bắn hạ` khá khắt khe nên dù không cố ý `khai khống thành tích` vẫn cần tránh mọi
    điều dễ gây hiểu lầm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000684: locks: [''Giữ sự
    đối sánh giữa việc săn hàng tá tên như thế với những kẻ địch từng đối mặt ở `mặt
    trận Rhine`, nỗi sợ bị đồng nghiệp chế giễu, và bảo toàn chính xác hai cụm nhấn
    mạnh `*...*` tách quanh chữ không in nghiêng ở giữa câu theo `DEC-P01-002` (`*Cô
    muốn khoe khoang con số đi săn của mình đến* mức đó *sao?*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000685: locks: [''Giữ nỗi
    lo bị bàn tán sau lưng nếu tính cả bọn chúng vào, bảo toàn chính xác câu giễu
    nhại in nghiêng bằng `*...*` theo `DEC-P01-002` (`*Khát khao thành tích bắn hạ
    đến mức nào rồi chứ?*`), và chi tiết `Tanya` chợt nảy ra một ý.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000686: locks: [''Giữ câu
    thoại của Tanya quyết định ghi chú rõ đây là một `cuộc bắn gà tây`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000687: locks: [''Giữ câu
    đáp lễ phép của thuộc cấp (`“Vâng, thiếu tá nói phải. Chúng ta không thể lập báo
    cáo gây hiểu lầm được.”`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000688: locks: [''Giữ liên
    hệ lịch sử với `Thế chiến thứ hai` về việc thành tích bắn hạ trước `bọn Nga` ở
    `mặt trận phía đông` hoàn toàn khác với thành tích trước `quân Mỹ hay quân Anh`
    ở `mặt trận phía tây`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000689: locks: [''Giữ câu
    thoại báo cáo kẻ địch lần này rất dai dẳng và xem chừng `chúng` vẫn đang đuổi
    theo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000690: locks: [''Giữ chính
    xác mệnh đề độc thoại nội tâm mở đầu đặt trong `*...*` theo `DEC-P01-002` (`*Mình
    không muốn làm hỏng hồ sơ thành tích của mình đâu*`), đại từ trần thuật `nó` theo
    `DEC-P01-001`, chi tiết quân địch có vẻ đang rất hăng máu khi quay đầu nhìn lại,
    và nỗi phiền phức không biết `lũ gớm ghiếc này` sẽ làm trò gì nếu `nó` để `chúng`
    bám theo về tận nhà.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000691: locks: [''Giữ nhận
    định các đơn vị đang đuổi theo `chúng ta` xem chừng cũng biết mình đang làm gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000692: locks: [''Giữ sự
    bực mình vì không tài nào cắt đuôi được `chúng` dù đã gần đạt `gia tốc tối đa`,
    cùng ý nghĩ hài hước muốn đề xuất một `đạo luật chống kẻ bám đuôi` nhưng quy định
    kiểu đó chẳng áp dụng được trên chiến trường nên đành phải tự cứu lấy thân.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000693: locks: [''Giữ mệnh
    lệnh của Tanya gọi `Các vị`, bảo toàn thuật ngữ chiến thuật in nghiêng `*tsurinobuse*`
    theo `DEC-P01-002`, và lời hô hào tiếp đãi các vị khách của `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000694: locks: [''Giữ ý định
    phục kích `lũ gớm ghiếc này` để `chúng ta` thoát thân, và lý do đằng nào cũng
    đang ở trong `chế độ Shimazu giả tạo` rồi nên việc học hỏi một chiêu từ sách lược
    của họ ở đây chẳng phải ý tồi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000695: locks: [''Giữ chính
    xác hai cụm nhấn mạnh đặt trong `*...*` tách quanh đại từ `chúng ta` theo đúng
    thẻ `<html:em>` của nguồn (`Chúng *mới là kẻ đang truy đuổi* chúng ta*. Mình thà
    chọn phương thức văn minh là trò chuyện hòa bình hơn nhiều*`), lời dẫn `Tanya
    thầm càu nhàu trong đầu`, và câu hỏi tu từ cuối đoạn về việc không còn lựa chọn
    nào khác ngoài tàn sát kẻ địch một khi chúng lao vào tấn công.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000696: locks: [''Giữ nguyên
    dấu ngoặc kép ba lớp `“““...”””` và tiếng reo hò phấn khích của các thuộc cấp:
    `“““Yaaargh! Hãy tặng cho chúng một trận thác lũ âu yếm nào!”””`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000697: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001` khi nhận xét màn hưởng ứng mệnh lệnh từ các thuộc cấp
    sôi nổi đúng như `nó` dự tính.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000698: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, sự hài lòng khi quân lính đang khát khao chiến trận
    nên dễ dàng tìm người tình nguyện đóng vai trò cực kỳ khó nhằn nhưng thú vị là
    làm `mồi nhử` (`đám lính Đế quốc đần độn đang tháo chạy tán loạn`), và lời bình
    luận họ là kiểu người xấu tính thích trêu chọc mấy chú cún con.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000668
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000699: locks: [''Giữ nguyên
    khẩu lệnh vô tuyến `Fairy 01 gọi 02 và 05`, cách gọi `Các anh` giao vai trò làm
    `mồi nhử`, và chỉ thị vào vị trí ở phía sau để khi `lũ hề đó` tấn công thì giả
    vờ vỡ trận rơi vào hỗn loạn rồi tháo chạy.'']'
  non_canon: true
