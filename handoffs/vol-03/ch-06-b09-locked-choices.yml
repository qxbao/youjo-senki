choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253: locks: [''Giữ lời
    báo cáo mở đầu lô: `“Vâng, báo cáo cho biết chúng đã xuất kích.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000254: locks: [''Giữ đại
    từ `ông ta` quy chiếu Tướng de Lugo, định danh `Tình báo Khối Thịnh vượng chung`,
    động từ `tình nguyện đi trinh sát`, và việc nắm rõ tình hình ở `Turus`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000255: locks: [''Giữ câu
    thông báo `“Lục quân Đế quốc đã rời khỏi Turus.”`, chi tiết nhận được báo cáo
    gần như theo thời gian thực, và nhận định `Lục quân Đế quốc` đang làm đúng những
    gì `Lục quân Cộng hòa Tự do` muốn chúng làm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000256: locks: [''Giữ toàn
    bộ đoạn in nghiêng `*...*` theo `DEC-P01-002`, đại từ `chúng ta` / `ta` đối lập
    với `chúng`, cụm `phương pháp chuẩn mực theo sách giáo khoa`, và ý dồn địch vào
    chân tường không còn lựa chọn nào khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000257: locks: [''Giữ toàn
    bộ câu in nghiêng theo `DEC-P01-002`: `*Tất cả những gì chúng ta cần làm bây giờ
    là tiêu diệt chúng.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000258: locks: [''Giữ lời
    cảm thán của de Lugo về việc công sức đối phó với đám tướng lĩnh đần độn trước
    đó không uổng phí: `“À, thế là công sức đối phó với đám đần độn này cũng không
    uổng phí rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000259: locks: [''Giữ chuỗi
    chi tiết nghi binh của `quân Cộng hòa`: cố tình làm rò rỉ `các mục tiêu chiến
    lược`, bảo trì đường cao tốc để đánh lạc hướng, và việc `de Lugo` giao cho `công
    binh dã chiến` chuyên tâm xây dựng `bãi mìn` trong khi `bộ binh` là những người
    `“làm việc”` trên đường cao tốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000260: locks: [''Giữ câu
    kết luận ngắn gọn: `Dù thế nào đi nữa, màn nghi binh của họ cũng đang phát huy
    tác dụng.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000261: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm in nghiêng `*...*` theo `DEC-P01-002`, dấu ngoặc kép
    ở cụm `“cuộc tập kích bất ngờ”`, lập luận ở cự ly ngắn `các tuyến tiếp tế` vẫn
    xoay xở được khi `tập trung lực lượng`, và đại từ tự quy chiếu `mình` ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000262: locks: [''Giữ thuật
    ngữ `cuộc tiến quân phân tán` của `quân Cộng hòa` không vấp phải sự cản trở nào.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000263: locks: [''Giữ lời
    hiệu triệu của de Lugo: `“Được rồi, thưa các quý ông. Chúng ta hãy chuẩn bị sẵn
    sàng thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000264: locks: [''Giữ chính
    xác từ cảm thán in nghiêng theo `DEC-P01-002`: `*Cuối cùng thì.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000265: locks: [''Giữ câu
    trần thuật: `Đó là cảm xúc chung của tất cả bọn họ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000266: locks: [''Giữ chính
    xác phạm vi in nghiêng ở câu đầu theo `DEC-P01-002` và câu trần thuật nối tiếp:
    `*Cuối cùng thì chúng ta cũng có thể giáng trả Đế quốc.* Họ vô cùng phấn khích.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000267: locks: [''Giữ nhận
    định `Lực lượng Đế quốc` có ý định đánh úp nên ưu tiên tốc độ hơn việc phát hiện
    địch khi tiếp cận, cùng kế hoạch nhử chúng vào `bãi mìn` rồi giáng đòn tấn công
    mãnh liệt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000268: locks: [''Giữ chính
    xác phạm vi in nghiêng ở câu đầu theo `DEC-P01-002`, các thuật ngữ `quân tinh
    nhuệ`, `làn đạn giao nhau`, `các đơn vị hạng nhẹ cơ động nhanh`, `các đơn vị hạng
    nặng`, và câu trần thuật khép đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000269: locks: [''Giữ ý ngày
    gặt hái thành quả đã đến và sự tự tin của `quân Cộng hòa` rằng mình nắm thế thượng
    phong về quân số.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000270: locks: [''Giữ lập
    luận khi giao chiến trực diện cũng chưa chắc đã thua kém, sự thừa nhận đối thủ
    là những `cựu binh dày dạn kinh nghiệm`, vai trò quyết định của quân số giữa hai
    `cường quốc`, và điều kiện áp đảo bằng quân số sẽ định đoạt kẻ chiến thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000271: locks: [''Giữ khẩu
    lệnh ngắn gọn: `“Chúng ta phản công!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000272: locks: [''Giữ nguyên
    ba lớp dấu ngoặc kép biểu thị tiếng hô đồng thanh: `“““Rõ, thưa ngài!”””`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000273: locks: [''Giữ chi
    tiết `sĩ khí của quân Cộng hòa` lên cao khi sắp phát động `cuộc phản công` hằng
    mong đợi, và bảo toàn chính xác câu in nghiêng cuối đoạn theo `DEC-P01-002`: `*Chúng
    ta sẽ dọa cho Đế quốc một phen hồn bay phách lạc!*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000274: locks: [''Giữ dòng
    tiêu đề thời gian-địa điểm viết hoa: `NGÀY 6 THÁNG 10, NĂM THỐNG NHẤT 1925, NGOẠI
    Ô CĂN CỨ HẢI QUÂN TURUS`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000275: locks: [''Giữ lời
    than thở mở đầu cảnh của John với đại từ `tôi`: `“Trời đất ơi. Cứ đà này thì đến
    giờ trà chiều tôi cũng chẳng có lấy một chút trà nào mà uống mất.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000276: locks: [''Giữ chi
    tiết thoát khỏi `Căn cứ Hải quân Turus` đang rực lửa và việc giao thương với `các
    bộ tộc du mục` diễn ra vô cùng suôn sẻ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000277: locks: [''Giữ đại
    từ trần thuật `anh` cho John, giá trị của việc trao đổi thông tin tình báo, và
    sự giúp đỡ của `những người du mục` trong việc quan sát `Căn cứ Hải quân Turus`
    cũng như nắm bắt động tĩnh của `Lục quân Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000278: locks: [''Giữ nỗi
    bất bình không sao giải quyết được của `John` về tình trạng thiếu trà (vấn đề
    sinh tử đối với một quý ông văn minh), chi tiết `các loại nước hãm` của `những
    người du mục`, lời từ chối nhẫn tâm từ `chính quốc` bảo anh tự tìm mua tại chỗ,
    và nhận xét về sự yếu đuối của con người vẫn nuôi hy vọng dù biết rõ kết cục.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000279: locks: [''Giữ chi
    tiết người đàn ông nhớ lại phản hồi lạnh nhạt của `chính quốc` mà than vãn đầy
    bi kịch, cùng thực tế `John` đang ở giữa sa mạc và khoác bộ trang phục bản địa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000280: locks: [''Giữ hình
    ảnh `Anh` dẫn đầu một `đoàn lữ hành`, trà trộn vào giữa `những người du mục`,
    cưỡi trên lưng lạc đà và hòa nhập hoàn hảo đến mức nhìn thoáng qua người ta sẽ
    chẳng nhận ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000281: locks: [''Giữ chi
    tiết may mắn thu nạp được một số sĩ quan phần nào thông thuộc sa mạc như một điểm
    sáng trong cái rủi, giúp tiếp tục làm ăn với một số bộ tộc và duy trì `mạng lưới
    tình báo`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000282: locks: [''Giữ chi
    tiết tin nhắn của `anh` đã chuyển tới phía `Cộng hòa` suôn sẻ nên `John` có thể
    nghỉ ngơi đôi chút.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000283: locks: [''Giữ câu
    độc thoại thành tiếng: `“…Dù có chuyện gì khác xảy ra đi nữa, xem chừng công tác
    trinh sát sẽ ổn thỏa thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000284: locks: [''Giữ nhận
    xét mọi chuyện yên ắng đến mức `anh` còn có thời gian phàn nàn và tình cảnh của
    `anh` không đến nỗi tệ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000285: locks: [''Giữ câu
    hỏi xác nhận giao kèo với cách xưng hô `Vị khách quý` / `ngài` — `chúng ta`: `“Vị
    khách quý, ngài sẽ giữ đúng các điều khoản của chúng ta chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000286: locks: [''Giữ câu
    trả lời của John với thuật ngữ `quỹ mật`: `“Tất nhiên rồi, tôi xin hứa. Tôi có
    nhiều quỹ mật đến mức chẳng biết phải làm gì cho hết đây.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000287: locks: [''Giữ chính
    xác câu nội tâm in nghiêng `*Mặc dù mình đang thiếu trà trầm trọng, họ lại bảo
    mình hãy vui mừng vì có tiền ư?*` theo `DEC-P01-002`, cùng phẩm chất tao nhã và
    `tinh thần John Bull` của một quý ông đích thực.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000288: locks: [''Giữ nỗi
    băn khoăn về việc mấy kẻ ngốc ở `Whitehall` bị tiêm nhiễm `tư tưởng của giới tài
    chính thành thị` quá mức, bảo toàn chính xác câu nội tâm in nghiêng `*Đám người
    ở Whitehall đó thực sự bảo mình uống tiền thay trà sao?*` theo `DEC-P01-002`,
    và mong muốn chí ít họ cũng gửi cho `mình` một ít hoặc làm gì đó.'']'
  non_canon: true
