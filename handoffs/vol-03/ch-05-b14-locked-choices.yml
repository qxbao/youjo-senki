segment_id_end: YS-LN03/Text/chapter005_004.xhtml/p000281
choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236: locks: [''Giữ mạch
    liên kết với cuối batch b13, đại từ `cô` và hai định danh `Cụm tập đoàn quân phương
    Bắc` cùng `Cụm tập đoàn quân phương Tây`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000237: locks: [''Giữ sự
    đối sánh giữa việc một `tiểu đoàn pháp sư` tách khỏi `cơ cấu chỉ huy` với việc
    mất đi cả một `sư đoàn`, cùng nhận định không vị chỉ huy nào chấp nhận một `hệ
    thống chỉ huy tách biệt`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000238: locks: [''Giữ lời
    thoại của Romel (`Thiếu tá von Degurechaff`, cặp xưng hô `ta` – `cô`) và câu hỏi
    mang tính thử thách về kỳ vọng đơn vị của cô lập nên những chiến công lớn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000239: locks: [''Giữ đại
    từ `cô`, tên riêng `Romel` và sắc thái không mấy hài lòng của Degurechaff trước
    phản ứng đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000240: locks: [''Giữ đúng
    ba cụm chữ nghiêng `*À.*`, `*của ông*`, `*ông*` theo DEC-P01-002, cặp quy chiếu
    `cô` / `ông`, thái độ `xấc xược đến mức khó tin` và sự liên hệ ngược về việc cấp
    trên của Romel từng ghẻ lạnh ông.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000241: locks: [''Giữ câu
    nhận xét ngắn: `Ngay cả Romel cũng chưa từng ngạo ngược đến mức này.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000242: locks: [''Giữ lời
    thúc ép `“Sao, cô nghĩ thế nào?”`, cặp quy chiếu `Ông` / `cô`, định danh `Bộ Tổng
    tham mưu` và quyết tâm ngầm sẽ trả cô về ngay nếu không trả lời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000243: locks: [''Giữ lời
    đáp của Degurechaff (`Thưa Tướng von Romel`, `tôi`) và cách nói vòng vo đầy kiêu
    ngạo `lược bỏ công sức đáp lại một câu hỏi bất khả thi để trả lời`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000244: locks: [''Giữ câu
    hỏi sững sờ ngắn gọn: `“…Cái gì?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000245: locks: [''Giữ đại
    từ `ông` trong trần thuật và phần độc thoại nội tâm in nghiêng `*Cô ta vừa nói
    gì cơ? Một câu hỏi bất khả thi để trả lời ư?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000246: locks: [''Giữ lời
    thoại của Degurechaff (`Tôi` / `mình` / `chúng tôi`), sự đối lập giữa `một người
    lính` với `một kẻ khéo mồm khéo miệng` và việc không thể giải thích năng lực quân
    sự bằng lời nói.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000247: locks: [''Giữ đại
    từ `cô`, sự thay đổi đột ngột trong giọng nói cùng hai sắc thái `tự cao tự đại`
    và `mỉa mai nặng nề`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000248: locks: [''Giữ lời
    thoại nối tiếp của Degurechaff (`tôi` – `ngài`, `thưa Tướng quân`) và kết luận
    giả định rằng dù có khéo nói cũng khó làm ông hài lòng nên không thể trả lời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000249: locks: [''Giữ cặp
    đại từ `ông` / `cô`, các cụm `ngôn ngữ chính thức của Đế quốc`, `phát âm chuẩn
    xác theo lối Đế quốc tiêu chuẩn` và hình ảnh so sánh `trong trẻo như tiếng chuông
    ngân`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000250: locks: [''Giữ cặp
    đại từ `ông` / `cô` ở câu trần thuật và câu hỏi nội tâm in nghiêng `*Con bé trước
    mặt mình vừa mới nói ra một điều mà mình không tài nào hiểu nổi đấy ư?*` theo
    DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000251: locks: [''Giữ đại
    từ `Ông` / `ông` và quá trình từ chỗ chật vật tìm cách hiểu đến lúc nắm bắt được
    ý nghĩa thực sự của chuỗi từ ngữ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000252: locks: [''Giữ lời
    thoại của Romel (`cô`) và câu thành ngữ đúc kết ý của Degurechaff: `‘trăm nghe
    không bằng một thấy’`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000253: locks: [''Giữ lời
    đáp của Degurechaff (`Tôi` / `tôi` – `ngài`, `Thưa Tướng quân`) và lời đề nghị
    trực diện `xin hãy tin tưởng tôi và đơn vị của tôi`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000254: locks: [''Giữ nhịp
    ngắt ngắn gọn: `Sự im lặng bao trùm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000255: locks: [''Giữ đại
    từ `cô`, chi tiết `một lời thỉnh cầu tha thiết` trong ánh mắt và nhận định `Nếu
    đó chỉ là một màn kịch, thì quả là điên rồ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000256: locks: [''Giữ đại
    từ `Ông` và trạng thái chết lặng, bàng hoàng khi vừa chứng kiến một điều không
    thể tin nổi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000257: locks: [''Giữ câu
    dẫn ngắn: `Một ý nghĩ duy nhất hiện lên trong tâm trí ông.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000258: locks: [''Giữ thuật
    ngữ in nghiêng toàn đoạn theo DEC-P01-002: `*Hội chứng Tiền tuyến.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000259: locks: [''Giữ định
    danh `Thiếu tá von Degurechaff`, cặp đại từ `cô` / `ông`, hai câu chữ nghiêng
    `*Đừng có hỏi những câu ngu ngốc.*` và `*Ông không hiểu tôi mạnh đến mức nào ư?*`
    theo DEC-P01-002, cùng vế đối lập về `tính hợp lý trong những câu trả lời chân
    thành của cô`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000260: locks: [''Giữ cấu
    trúc tăng tiến `không chỉ… mà còn…` và đại từ `cô`: `Vậy là cô không chỉ kiêu
    ngạo, mà rõ ràng còn méo mó một cách khủng khiếp.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000261: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm in nghiêng theo DEC-P01-002, đại từ `Cô ta` / `cô ta`,
    chuỗi phủ định ba đối tượng (năng lực của giới lãnh đạo quân đội, chiến lược,
    đồng đội), định danh `Lục quân Đế quốc` và hình ảnh `một kẻ lập dị trung thành
    vô song, chỉ chăm chăm làm con chó canh gác cho quốc gia`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000262: locks: [''Giữ đúng
    hai cụm in nghiêng ở đầu và cuối đoạn theo DEC-P01-002 (phần trần thuật `Romel
    đã hiểu lý do cô từng bất tuân mệnh lệnh trong quá khứ.` ở giữa không in nghiêng),
    cùng nhận định cô là `một kẻ điên có năng lực` nhưng không nhận ra bản thân bị
    vặn vẹo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000263: locks: [''Giữ lời
    thoại của Romel: `“…Thiếu tá, ta chưa có đủ bằng chứng để tin tưởng cô.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000264: locks: [''Giữ phần
    nội tâm in nghiêng đầu đoạn (`*Cô ta điên rồi. Và có năng lực. Lại còn chân thành
    hơn bất kỳ ai mà mình từng biết.*`) theo DEC-P01-002 và phần trần thuật (`Romel`,
    `ông` / `cô`) ở nửa sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000265: locks: [''Giữ cặp
    đại từ `ông` / `cô` và mối quan hệ nhân quả giải thích lý do câu hỏi thử lòng
    của Romel.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000266: locks: [''Giữ lời
    đáp gọn gàng của Degurechaff (`tôi` / `Tôi` – `ngài`): `“Việc tôi tự liệt kê những
    chiến công của mình là hoàn toàn vô nghĩa. Tôi xin tùy ngài sai phái.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000267: locks: [''Giữ đại
    từ `cô`, tên riêng `Romel` và sắc thái bảo lưu `Thông thường thì Romel cũng đánh
    giá cao thái độ coi trọng hành động hơn lời nói.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000268: locks: [''Giữ đại
    từ `Cô` / `cô`, hai vế phủ định (`không tự phụ về năng lực của mình; cũng chẳng
    phải kẻ nô lệ cho sức mạnh của bản thân`), thái độ `điềm nhiên, thực tế` và khả
    năng phân biệt việc khả thi với việc khó khăn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000269: locks: [''Giữ giả
    định trái thực tế (`Nếu không, cô đã chẳng thể đùa với lửa ngay trước một kho
    đạn như lúc này.`), cặp đại từ `cô` / `Ông` và kết luận rằng sự điên rồ của cô
    được hậu thuẫn bởi năng lực vô hạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000270: locks: [''Giữ lời
    thoại của Romel (`Ta` / `ta` – `cô`) và sự làm rõ `trên cương vị một nhà chiến
    lược kìa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000271: locks: [''Giữ câu
    độc thoại nội tâm in nghiêng toàn đoạn theo DEC-P01-002 (`Mình` / `cô ta`): `*Mình
    sẽ gọi cô ta là một anh hùng, một kẻ điên, một người đồng đội.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000272: locks: [''Giữ đoạn
    nội tâm in nghiêng toàn phần theo DEC-P01-002 (`cô ta` / `Cô ta`) và cặp câu hỏi
    đối lập giữa `một con thú hoang nhuốm màu điên loạn` với `một con mãnh thú xảo
    quyệt sở hữu một trí tuệ điên rồ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000273: locks: [''Giữ tên
    riêng `Romel` và đại từ `ông`: `Romel chợt nhận ra ông muốn biết câu trả lời.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000274: locks: [''Giữ lời
    giao nhiệm vụ của Romel (`Ta` / `ta` – `cô` / `các cô`), các thuật ngữ `nhiệm
    vụ cơ động ứng chiến`, `nhóm thứ hai`, `Kampfgruppe Bảy`, `các Kampfgruppe`, `tiểu
    đoàn đơn lẻ` và lời răn `Đừng làm ta thất vọng.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000275: locks: [''Giữ đoạn
    độc thoại nội tâm in nghiêng toàn phần theo DEC-P01-002 (`Mình` / `mình`, `cô
    ta`): `*Mình sẽ thử sức cô ta trong một nhiệm vụ có phần độc lập. Chà, mình cũng
    phần nào đoán được kết cục sẽ ra sao rồi, nhưng… hy vọng cô ta sẽ mang lại kết
    quả.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000276: locks: [''Giữ câu
    nhận lệnh ngắn gọn của Degurechaff (`Chúng tôi` – `ngài`): `“Rõ. Chúng tôi sẽ
    đáp ứng kỳ vọng của ngài.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000277: locks: [''Giữ câu
    nội tâm in nghiêng toàn đoạn theo DEC-P01-002: `*Nhìn xem kìa.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_004.xhtml/p000278: locks: [''Giữ cụm
    nội tâm in nghiêng toàn đoạn theo DEC-P01-002: `*Nụ cười nham hiểm đó.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000236
  kind: voice_marker
