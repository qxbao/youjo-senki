choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390: locks: [''Giữ sự
    chuyển tiếp đối lập khi thiết bị chỉ thu được tiếng nhiễu, dấu ba chấm lửng và
    nguyên nhân khu vực quanh `sở chỉ huy` của `họ` bị gây nhiễu nặng nề khiến tín
    hiệu bị chặn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000391: locks: [''Giữ sắc
    thái vừa vặn vớt vát được một đường truyền chập chờn của `Họ`, và hành động `Tanya`
    ra lệnh cho `Serebryakov` giải thích tình hình trong khi cố gắng nghĩ ra các biện
    pháp đối phó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000392: locks: [''Giữ dấu
    ba chấm mở đầu và câu hỏi tự nhủ dùng đại từ `chúng ta`: `“…Giờ chúng ta phải
    làm gì đây?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000393: locks: [''Giữ nhận
    định ngắn gọn về vấn đề là làm sao thu xếp ổn thỏa mọi chuyện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000394: locks: [''Giữ thực
    tế `đạo quân dã chiến` của địch đã tập hợp lại với nhau, đại từ `Chúng ta` – `chúng`,
    và kết luận không thể trông đợi các `nhiệm vụ phong tỏa ngăn chặn` như cản trở
    giao thông hay cắt đứt `tuyến tiếp tế` phát huy tác dụng trước khi các lực lượng
    đó tấn công.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000395: locks: [''Giữ điều
    kiện khi lực lượng của `chúng` đã tập trung, phép so sánh sức chiến đấu đơn giản
    cho thấy `chúng ta` bị áp đảo hoàn toàn, và nhận định các phương án yểm trợ `quân
    chủ lực` cũng rất hạn chế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000396: locks: [''Giữ hình
    ảnh `quân đoàn` của `chúng ta` đã tiến lên vì bị dụ bởi miếng mồi ngon là tiêu
    diệt các cánh quân địch bị chia cắt, quán tính không dễ dừng lại của các đạo quân,
    giả định kể cả khi `sở chỉ huy` quyết định rút lui thì địch vẫn bám sát truy kích,
    và hệ quả cắt đứt `các tuyến liên lạc` trước khi `lực lượng chủ lực của Đế quốc`
    kịp thiết lập `các tuyến kháng cự` khiến `mặt trận phương nam` đi vào lịch sử
    như một thất bại thảm hại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000397: locks: [''Giữ đại
    từ `họ`, địa danh `Căn cứ Hải quân Turus`, và hệ quả nếu không nắm được `quyền
    làm chủ mặt biển` thì việc buộc phải đầu hàng chỉ là vấn đề thời gian.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000398: locks: [''Giữ chính
    xác toàn bộ đoạn in nghiêng bằng `*...*` theo `DEC-P01-002`, đại từ `mình` theo
    `DEC-P01-001`, và mục tiêu cao chạy xa bay mà không làm tổn hại đến `hồ sơ quân
    ngũ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000399: locks: [''Giữ định
    danh đầy đủ `Thiếu tá Tanya von Degurechaff`, `Quân đội Đế quốc`, đại từ `nó`
    theo `DEC-P01-001`, quá trình thoáng cân nhắc nghiêm túc việc quay lại yểm trợ
    các đơn vị khác rồi kết luận là bất khả thi, và bảo toàn chính xác câu kết in
    nghiêng theo `DEC-P01-002`: `*Vào thời điểm này, chiến thắng cho Đế quốc là điều
    không tưởng.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000400: locks: [''Giữ tương
    quan `Chúng ta` đối đầu kẻ địch vượt trội hoàn toàn và điều kiện phủ định: nếu
    không thể hạ gục `chúng`, sẽ chẳng có cơ hội chiến thắng nào cả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000401: locks: [''Giữ bối
    cảnh giữa sa mạc khiến phương án cố thủ trong `trận địa phòng ngự lâm thời` do
    `đội công binh dã chiến` dựng lên để chờ chuyển biến là vô vọng, phép so sánh
    nước quý giá ngang ngửa xăng dầu, giả định nếu ở gần nguồn nước đối lập với thực
    tế bị bao vây vài ngày ngoài thực địa là đủ khiến `chúng ta` quằn quại vì khát,
    và kết luận bảo vệ một cứ điểm cố định không có nước là quá nguy hiểm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000402: locks: [''Giữ lời
    cằn nhằn của `Tanya` về nước và sa mạc dùng `chúng ta` và `mình`, đi cùng mệnh
    đề trần thuật dùng đại từ `nó` theo `DEC-P01-001`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000403: locks: [''Giữ định
    danh `Quân đội Đế quốc`, đại từ `Họ` / `họ` – `chúng`, và thế tiến thoái lưỡng
    nan do thiếu nước: không thể đối đầu lực lượng lớn, rút lui thì bị truy đuổi đến
    cùng, giao chiến mà không đánh bại toàn bộ địch thì sẽ cạn sạch nước và chết vì
    mất nước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000404: locks: [''Giữ sự
    trớ trêu khủng khiếp nếu phải chịu cảnh khát khô cổ tại `Căn cứ Hải quân Turus`
    có tầm nhìn hướng ra biển, và câu cảm thán từ chối ngắn gọn ở cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000405: locks: [''Giữ nhận
    định biện pháp `họ` có thể làm để đóng góp vào chiến thắng của Đế quốc chẳng khác
    nào lao vào chỗ chết trước đạo quân khổng lồ của địch, và câu khẳng định nội tâm
    dùng `mình` theo `DEC-P01-001` rằng đời nào lại nhận mấy nhiệm vụ tự sát kiểu
    đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000406: locks: [''Giữ câu
    nói quyết định: `“Được rồi, trong trường hợp này việc duy nhất có thể làm là đánh
    vào nguồn nước của địch!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000407: locks: [''Giữ việc
    `Tanya` thu hẹp lựa chọn về nước đi yểm trợ thực tế là tập kích `các tuyến tiếp
    tế` của địch để cứu quân bạn khỏi bị xóa sổ và bảo vệ sự nghiệp quân ngũ của `nó`
    (`DEC-P01-001`), bảo toàn chính xác từ nối in nghiêng `*Nhưng.*` (`DEC-P01-002`),
    và chi tiết `Nó` chợt hối hận về ý tưởng này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000408: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, niềm tự hào là một trong những đơn vị xuất sắc nhất,
    và giới hạn thực tế đó vẫn chỉ là một `tiểu đoàn pháp sư hàng không` đơn lẻ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000409: locks: [''Giữ chuỗi
    lý do bác bỏ phương án cũ: bị áp đảo hoàn toàn về quân số, không thể yểm trợ quân
    ta rút lui bằng `các phương pháp chính quy`, sự phi lý của việc `thâm nhập tầm
    xa` vào vùng không phận trên thực tế thuộc về địch để đánh `các tuyến vận chuyển
    nước`, việc bản đồ Đế quốc hầu như không có thông tin về các `ốc đảo` lân cận,
    câu hỏi tự vấn về việc tiếp xúc thân thiện với `dân du mục địa phương`, và hai
    câu kết dùng `mình` theo `DEC-P01-001`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000410: locks: [''Giữ lời
    tự nhủ của Tanya: `“Nghĩ đi, nghĩ đi… Logic của kẻ địch là gì?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000411: locks: [''Giữ câu
    hỏi suy luận với tương quan `chúng` – `chúng ta`: `Quân địch nghĩ rằng chúng đã
    lừa được chúng ta, vậy bước đi hợp logic tiếp theo là gì?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000412: locks: [''Giữ định
    danh `Lục quân Cộng hòa`, thuật ngữ `cuộc hành quân phân tán`, và suy nghĩ của
    địch rằng quân Đế quốc tập trung ở một chỗ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000413: locks: [''Giữ nhịp
    nhận ra vấn đề ngắn gọn: `Ồ? Không, chính là nó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000414: locks: [''Giữ lời
    lẩm bẩm của Tanya thừa nhận `Quân chủ lực` quả thực đang tập trung và đề xuất
    dùng chính logic của `chúng` để gậy ông đập lưng ông.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000415: locks: [''Giữ mệnh
    đề mở đầu với đại từ `nó` theo `DEC-P01-001`, định danh `Quân đội Đế quốc`, và
    bảo toàn chính xác hai cụm câu in nghiêng liên tiếp bằng hai cặp `*...*` tách
    biệt theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000416: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, kỳ vọng rằng dưới giả định đó quân địch sẽ chẳng mấy
    để tâm đến khả năng có một đơn vị chiến đấu hùng mạnh tập kích từ sau lưng `chúng`,
    sự nhìn nhận đây phần nào là viễn cảnh bắt nguồn từ mong muốn chủ quan, và chi
    tiết tâm lý con người mang lại cho `nó` hy vọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000417: locks: [''Giữ tiếng
    reo đắc ý `“Tốt lắm,”`, đại từ `nó` theo `DEC-P01-001`, nỗi khổ sở vì chưa biết
    vai trò của `mình` sẽ là gì ngay cả khi giả thuyết đó đúng, và câu bỏ lửng với
    dấu ba chấm cuối đoạn về việc đâm lén từ sau lưng chỉ gây đôi chút hỗn loạn tạm
    thời.'']'
  non_canon: true
