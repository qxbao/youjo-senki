choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098: locks: [''Giữ đại
    từ trần thuật `Nó` theo `DEC-P01-001`, thuật ngữ `sóng ngắn` và chi tiết tín hiệu
    đầy tạp âm với chất lượng sóng tệ hại trên chiến trường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000099: locks: [''Giữ lời
    xin lỗi của Đại úy Carlos dùng đại từ `Tôi` – `tôi` và nguyên nhân lính bắn tỉa
    của địch đã bắn hỏng toàn bộ máy móc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000100: locks: [''Giữ lời
    đáp của Tanya dùng cặp đại từ `tôi` – `chúng ta` và câu chốt `Được rồi, vào việc
    chính nào.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000101: locks: [''Giữ bước
    chuyển cảnh sang điểm nhìn của Grantz (`họ`), định danh `một con tàu chở hàng
    của Reichspost được cải hoán` và nhận xét tiện nghi đến mức đáng ngạc nhiên đối
    với một con tàu chở quân.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000102: locks: [''Giữ mức
    độ phỏng đoán `có lẽ` và nhận định sự đãi ngộ tốt đẹp ấy đã khiến `họ` thả lỏng
    quá mức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000103: locks: [''Giữ thuật
    ngữ `nhà ăn sĩ quan`, tên riêng `Grantz`, chức danh `chỉ huy tiểu đoàn` và chi
    tiết hài lòng đến mức chấm cho nó đạt điểm đậu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000104: locks: [''Giữ trọn
    câu độc thoại nhấn mạnh chữ nghiêng theo `DEC-P01-002`: `*Dù nói vậy, ngay từ
    đầu chúng ta phải đến đây cũng là tại cô ấy.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000105: locks: [''Giữ dấu
    ba chấm đầu câu, đại từ `Cô` quy chiếu chỉ huy tiểu đoàn từ góc nhìn của Grantz,
    thuật ngữ `lệnh ngừng bắn` và hình ảnh thứ mồi lửa có thể gây ra những rắc rối
    nghiêm trọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000106: locks: [''Giữ sự
    đối sánh `giống chống lệnh hơn là vượt thẩm quyền`, tiến trình chiến dịch cùng
    đơn kháng nghị đều bị bác bỏ, và hành động `cô` túm lấy ve áo `chỉ huy căn cứ`
    đe dọa `ông` khiến không thể ém nhẹm chuyện đó đi được nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000107: locks: [''Giữ chi
    tiết suýt xuất kích sau khi gạt phắt nỗ lực ngăn cản của `ông`, cụm `vị chỉ huy
    tiểu đoàn chân thành, tận tâm của họ`, định danh `Trung úy Weiss, sĩ quan phụ
    tá lâu năm của cô`, thuật ngữ `tòa án binh` và `trát triệu tập`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000108: locks: [''Giữ sắc
    thái trớ trêu khi sự xuất hiện của một mối đe dọa từ bên ngoài đã thổi bay toàn
    bộ những rắc rối ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000109: locks: [''Giữ trọn
    câu nhấn mạnh chữ nghiêng theo `DEC-P01-002` và định danh `Khối Thịnh vượng chung`:
    `*Sự can thiệp của Khối Thịnh vượng chung…*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000110: locks: [''Giữ trạng
    ngữ `Trên danh nghĩa`, hai định danh `Cộng hòa` và `Khối Thịnh vượng chung`, cùng
    mục đích làm trung gian hòa giải đàm phán hòa bình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000111: locks: [''Giữ dấu
    ngoặc kép quanh từ `“thông báo”`, dấu gạch ngang dài và giả định rằng các điều
    khoản đó sẽ lại bị bác bỏ lần nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000112: locks: [''Giữ nhận
    định họ chẳng hề có ý định làm trung gian đàm phán hòa bình, các điều khoản quá
    thiên vị và cụm `“thông báo cuối cùng” hoàn toàn áp đặt một chiều`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000113: locks: [''Giữ định
    danh `Đế quốc`, `Khối Thịnh vượng chung`, thuật ngữ `tối hậu thư` và việc nó bị
    bác bỏ thẳng thừng ngay lập tức đúng như dự đoán.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000114: locks: [''Giữ các
    thuật ngữ `kháng chiến toàn diện`, `đầu hàng có điều kiện`, cấp bậc `Tướng de
    Lugo`, chức vụ `Thứ trưởng Quốc phòng`, đại từ `ông ta` và tuyên bố họ mới là
    chính phủ Cộng hòa chân chính.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000115: locks: [''Giữ sự
    đối lập giữa chính phủ chính thức nằm ở thủ đô đã bị `Đế quốc` chiếm đóng với
    việc binh lính và hầu hết các thuộc địa đều đứng về phía `de Lugo`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000116: locks: [''Giữ chi
    tiết trái với suy nghĩ rằng `ông ta` chỉ là con rối của `Khối Thịnh vượng chung`,
    tuyên bố thành lập `Cộng hòa Tự do` và việc tập hợp các thuộc địa trên `lục địa
    phía nam` tiếp tục cuộc chiến chống lại `Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000117: locks: [''Giữ cụm
    `lục địa phía nam đầy biến động chính trị`, thuật ngữ `các đơn vị tuần tra khu
    vực`, cùng các pháp sư đồn trú nhằm đối phó `Khối Thịnh vượng chung` hoặc `Vương
    quốc Ildoa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000118: locks: [''Giữ định
    danh `Bộ Tổng tham mưu Lục quân Đế quốc` và trạng thái lâm vào cảnh bí thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000119: locks: [''Giữ liên
    minh giữa `Cộng hòa Tự do` và `Khối Thịnh vượng chung`, bài toán để lại nhiều
    hơn một số lượng quân nhất định trên `chính quốc` trong khi giải quyết tình hình
    ở `lục địa phía nam`, và quyết định cần đến `chỉ huy tiểu đoàn của Grantz` dù
    `cô` có xu hướng tự ý hành động.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000120: locks: [''Giữ chi
    tiết hủy bỏ toàn bộ các hồ sơ đề nghị trao thưởng huân chương đang chờ duyệt của
    `cô` từ `mặt trận Rhine` và giới hạn cơn thịnh nộ của cấp trên chỉ dừng lại ở
    mức đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000121: locks: [''Giữ nhận
    xét khi xét đến vị chỉ huy của họ thì cách xử lý đó xem chừng cũng là chuyện hết
    sức bình thường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000122: locks: [''Giữ việc
    người ta nhận thức rõ giá trị của một lực lượng pháp sư hùng mạnh và niềm vui
    sướng của `Grantz cùng những người khác` trước mức lương được cải thiện đáng kể.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000123: locks: [''Giữ nghịch
    lý dù được tăng lương nhưng ở vùng đất phương nam bạt ngàn sa mạc này đằng nào
    cũng chẳng có chỗ nào để tiêu tiền lương.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000124: locks: [''Giữ chi
    tiết khí hậu khắc nghiệt của `Lục địa phía nam`, việc chấp nhận số phận ở một
    mức độ nào đó và nỗi thèm khát một cốc bia lạnh buốt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000125: locks: [''Giữ sự
    tán thành đối với chiến lược tấn công các thuộc địa của `Khối Thịnh vượng chung`
    và `Cộng hòa` nhằm tước đi năng lực tiếp tục chiến đấu của chúng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000126: locks: [''Giữ trọn
    câu nhấn mạnh chữ nghiêng theo `DEC-P01-002`: `*Trấn áp mạnh tay là một chiến
    lược tốt.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000127: locks: [''Giữ sự
    đồng tình về cơ bản của cả `Trung úy Weiss` lẫn `chỉ huy` ở điểm đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000128: locks: [''Giữ nhận
    định về chất lượng binh sĩ triển khai tới phương nam, thuật ngữ `các đơn vị tuyến
    hai` và việc đám `quân dự bị và quân bổ sung` được gom góp vội vàng thiếu hụt
    huấn luyện trầm trọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000129: locks: [''Giữ phép
    so sánh khiến ngay cả `Grantz`—người từng bị đối xử như một chú gà con chưa rụng
    hết vỏ trứng trên `mặt trận Rhine`—cũng trông giống một người lính đã được trang
    bị đầy đủ, cùng giá trị của một đơn vị đã trải qua lửa sắt rửa tội ở `vùng Rhine`.'']'
  non_canon: true
