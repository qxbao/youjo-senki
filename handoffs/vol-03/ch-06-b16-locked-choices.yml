choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483: locks: [''Giữ dấu
    ba chấm mở đầu và nhận định nối tiếp quyết định điều quân ở cuối B15: `…Đó là
    một kế hoạch hết sức hợp lý.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000484: locks: [''Giữ sự
    đối lập về tính `hợp lý` giữa kế hoạch của `họ` và đối thủ, cùng thời điểm biến
    cố xảy ra ngay khoảnh khắc đơn vị đó vừa được rút ra và điều sang.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000485: locks: [''Giữ lời
    gọi khẩn cấp qua vô tuyến từ `Tiểu đoàn Pháp sư 5` gửi `sở chỉ huy` và cảnh báo
    `Pháp sư địch đang tiếp cận rất nhanh!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000486: locks: [''Giữ cấu
    trúc đối lập `không phải... mà là...` xác định đơn vị pháp sư phát ra tiếng hét
    cảnh báo đang `yểm trợ trực tiếp` cho `trung tâm` chứ không phải cho `cánh phải`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000487: locks: [''Giữ tiếng
    thốt kinh ngạc và câu hỏi phủ định–nghi vấn về `các khẩu đội pháo`: `“Vô lý! Chúng
    không đánh vào các khẩu đội pháo sao?!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000488: locks: [''Giữ đại
    từ `Ông ta` quy chiếu de Lugo, cùng định danh hai đơn vị vừa được điều sang `cánh
    phải` là `Tiểu đoàn Pháp sư 2` và `Trung đoàn Pháp sư Hỗn hợp 1` mới rút ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000489: locks: [''Giữ đại
    từ `ông ta`, cảm xúc `trong nỗi căm hận tột cùng`, và nhận thức rằng đám pháp
    sư địch vốn đang hoành hành bên `cánh phải` đã đổi hướng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000490: locks: [''Giữ nhận
    định `Pha cơ động ấy` thậm chí chẳng nhắm tới việc chặn `quân tiếp viện`, và sự
    hoang mang trong một thoáng không ai dám chắc quân địch đang nhắm về đâu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000491: locks: [''Giữ cấu
    trúc phủ định kép làm rõ đó không phải nước đi đập tan `vòng vây bên cánh phải`
    đang hấp hối, câu phủ định ngắn `Không.`, và cũng chẳng phải nước đi đánh chặn
    `lực lượng chi viện` đang kéo tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000492: locks: [''Giữ câu
    khẳng định ngắn gọn làm rõ mục tiêu thực sự: `Đó là một đợt xung kích thẳng vào
    lực lượng Cộng hòa ở trung tâm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000493: locks: [''Giữ câu
    cảm thán bỏ lửng ví quân địch với `lũ ác quỷ` và chi tiết sự thật bật ra khỏi
    miệng `Vianto` như một lời than vãn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000494: locks: [''Giữ tên
    riêng `Vianto`, đại từ `ông`, mức độ am hiểu về các pháp sư hơn bất kỳ ai có mặt,
    và sự tự điều chỉnh nhận định rằng ông biết từ kinh nghiệm mục tiêu tiếp theo
    `chúng` nhắm tới sẽ là gì.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000495: locks: [''Giữ nhận
    định đánh vào `cánh phải` chỉ là một trong các mục tiêu của `chúng`, và giả định
    quá khứ nếu `Lục quân Cộng hòa` mặc kệ thì `chúng` đã chọc thủng `cánh phải` rồi
    rút đi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000496: locks: [''Giữ toàn
    bộ câu hỏi nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Nhưng chúng sẽ làm
    gì nếu Lục quân Cộng hòa hành động hợp lý và chi viện cho cánh phải?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000497: locks: [''Giữ câu
    trả lời ngắn: `Đơn giản thôi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000498: locks: [''Giữ dấu
    hai chấm giải thích vị trí bị đánh: `Chúng sẽ đánh vào nơi vừa mới bị rút bớt
    các đơn vị: trung tâm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000499: locks: [''Giữ lập
    luận không thể rút đơn vị từ `cánh trái` sang tận `cánh phải` nên phải rút từ
    `trung tâm` để kiềm tỏa pháp sư địch ở `cánh phải`, cùng giả định khi đám pháp
    sư đó lao thẳng một mạch theo đường thẳng thì `tạp âm và nhiễu sóng` sẽ làm tê
    liệt tạm thời khả năng phát hiện địch của `họ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000500: locks: [''Giữ toàn
    bộ câu hỏi giả định nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Vậy nếu Lục
    quân Đế quốc hành động dựa trên dấu hiệu có quân tiếp viện đang trên đường tới
    thì sao?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000501: locks: [''Giữ chi
    tiết `Vianto` theo bản năng hiểu ra sự thật kinh hoàng và sống lưng `ông` lạnh
    toát.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000502: locks: [''Giữ nghịch
    lý đúng khoảnh khắc các pháp sư vừa tản đội hình bảo vệ `cánh phải` xong thì `họ`
    liền trở nên vô dụng khi `trung tâm` bị tấn công, và bảo toàn chính xác hai cụm
    nhấn mạnh tách rời ở câu cuối theo `DEC-P01-002` (`*Không, chính chúng ta* đã
    biến *họ thành vô dụng!*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000503: locks: [''Giữ sự
    đối lập giữa vẻ ngoài như bước đi quẩn quanh của toán quân bị dồn vào chân tường
    với bản chất quỷ quyệt hơn cả ác quỷ, và nhận định đám pháp sư địch đang thực
    hiện những pha cơ động mà ngay cả về mặt lý thuyết `Vianto` cũng không dám chắc
    là khả thi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000504: locks: [''Giữ đại
    từ `Ông` – `mình` và nhận định ngỡ đã tường tận nỗi kinh hoàng mang tên `pháp
    sư Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000505: locks: [''Giữ lời
    khẩn cầu lịch sự nhưng khẩn cấp của thuộc cấp với cấp trên: `“Thưa Tướng de Lugo,
    xin ngài hãy rút lui.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000506: locks: [''Giữ câu
    hỏi ngắn: `“Gì cơ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000507: locks: [''Giữ lời
    cảnh báo quân địch đang tiến về phía này và ý đồ tái hiện những gì `chúng` từng
    làm ở `mặt trận Rhine`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000508: locks: [''Giữ thuật
    ngữ đặt trong ngoặc kép `“đòn tập kích chính xác”` nhắm vào việc triệt hạ `sở
    chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000509: locks: [''Giữ sự
    đối lập giữa việc bất cứ ai cũng sẽ cười xòa coi đó là cơn ác mộng vô lý với thực
    tế `Đế quốc` đã thực thi nó ngay trên `các phòng tuyến Rhine`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000510: locks: [''Giữ chi
    tiết `Chúng` chọc thủng `các tuyến phòng thủ chính của Cộng hòa` vốn có hệ thống
    phòng ngự kiên cố vô song rồi triệt hạ `sở chỉ huy` vững chãi như pháo đài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000511: locks: [''Giữ mô
    tả cơn hoảng loạn bao trùm `các đơn vị tiền tuyến` vào thời điểm đó có quy mô
    gần như không sao tả xiết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000512: locks: [''Giữ dấu
    ba chấm mở đầu, thực tế `Lục quân Cộng hòa` hiện tại không có người thay thế cho
    `de Lugo`, và ẩn dụ vừa đổi chiếc bình rượu cũ lấy chiếc bình mới nên chẳng còn
    chiếc bình nào khác dự phòng sẵn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000513: locks: [''Giữ định
    danh `Lục quân Cộng hòa Tự do`, công sức khổng lồ để gây dựng, và hệ quả nếu vị
    tướng đứng đầu `Cộng hòa` ngã xuống ngay lúc này thì việc tiếp tục duy trì kháng
    cự có tổ chức sẽ gần như bất khả thi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000514: locks: [''Giữ định
    danh `Lục quân Đế quốc` và `Quân đoàn Viễn chinh Phương Nam`, cùng điều kiện nhượng
    bộ ngay cả khi toàn bộ quân đoàn bị xóa sổ nhưng kéo theo được `de Lugo` thì đó
    vẫn sẽ là một chiến thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000515: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Không, giờ thì
    khó mà tiêu diệt được Lục quân Đế quốc rồi. Cùng lắm chúng cũng chỉ bị bầm dập
    đôi chút mà thôi.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000516: locks: [''Giữ toàn
    bộ câu hỏi nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Và chuyện gì sẽ xảy
    ra với hỏa lực cùng các đơn vị của chúng ta nếu ta cử họ ra đối đầu với đám pháp
    sư đó?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000517: locks: [''Giữ toàn
    bộ câu nhận định nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Chí ít thì chúng
    ta cũng sẽ không đạt được các mục tiêu ban đầu của mình.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000518: locks: [''Giữ mệnh
    lệnh quyết tử của Vianto: `“Các binh sĩ, hãy bảo vệ tướng quân. Đây là trận chiến
    cuối cùng của chúng ta.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000519: locks: [''Giữ sự
    đối lập giữa việc quân địch đã chọc thủng phòng tuyến ở `mặt trận Rhine` với quyết
    tâm của `Vianto` tại đây không dâng thêm một `sở chỉ huy` nào nữa cho `Lục quân
    Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000520: locks: [''Giữ dòng
    tiêu đề chuyển cảnh viết hoa toàn bộ: `CÙNG NGÀY, DOANH TRẠI LỤC QUÂN ĐẾ QUỐC`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000521: locks: [''Giữ chuỗi
    tiếng cười lớn: `“Ha ha ha! Ha ha ha! Ha ha! Ha ha! Ha ha ha ha!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000522: locks: [''Giữ chi
    tiết những `hạ sĩ quan` xấu số đang ngồi chung trên chiếc `xe bọc thép` đều nhăn
    mặt khi nghe tiếng cười đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000523: locks: [''Giữ giọng
    trần thuật bình phẩm bất cứ ai cũng có quyền nhăn mặt nếu vị chỉ huy cấp cao của
    mình bỗng phá lên cười sằng sặc giữa lúc đang bị bao vây.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000524: locks: [''Giữ chính
    xác câu độc thoại đầu đoạn đặt trong `*...*` theo `DEC-P01-002` với đại từ `ông
    ấy` (`*Nếu ông ấy phát điên rồi thì gay go to.*`), và câu trần thuật tiếp theo
    không in nghiêng về cảm xúc của `họ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000525: locks: [''Giữ tên
    riêng `Romel`, đại từ `ông`, và sự đối lập giữa ngày thường biết ý nén tiếng cười
