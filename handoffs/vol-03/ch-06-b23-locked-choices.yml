glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 38
segment_id_start: YS-LN03/Text/chapter006_002.xhtml/p000730
segment_id_end: YS-LN03/Text/chapter006_004.xhtml/p000032
choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730: locks: [''Giữ thức
    giả định quá khứ về vô số hướng đi khác: `Hạm đội Biển khơi` hoàn toàn có thể
    mang thái độ được ăn cả ngã về không để `giành quyền làm chủ mặt biển` từ tay
    `Khối Thịnh vượng chung` dù hải quân hai bên có cùng bị hủy diệt, hoặc dựng lên
    một `chính phủ bù nhìn` ở `Cộng hòa` rồi ký kết hòa ước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000731: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, nhận định của `Tanya` rằng `hạm đội Đế quốc` lại đang
    quay về với `chiến lược “hạm đội hiện hữu”` nhằm tránh rủi ro quân sự và bảo toàn
    lực lượng, và đánh giá dù chiến lược đó có lý lẽ riêng nhưng chắc chắn không thể
    đánh bại kẻ địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000732: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, hệ quả `nó` bị điều tới `các thuộc địa chẳng mấy trọng
    yếu của Cộng hòa trên lục địa phía nam` để truy kích và tiêu diệt `tàn quân của
    Lục quân Cộng hòa`, cùng nhận xét ngay cả khi gạt sang một bên những toan tính
    ngoại giao đối với `Vương quốc Ildoa` thì việc này vẫn chẳng khác nào `đặt cái
    cày trước con trâu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000733: locks: [''Giữ nhận
    định `Đế quốc` như đang phung phí năng lực tác chiến vượt trội một cách vô ích:
    trong các trận đánh nhỏ lẻ, `các tướng lĩnh Đế quốc` sẽ không thua và đang áp
    đảo ở `cấp độ chiến thuật`, còn `Bộ Tổng tham mưu` điều phối rất tốt tính cơ động
    và việc triển khai quân ở `cấp độ chiến dịch`, bất kể là `tác chiến cơ động` hay
    `đột phá vòng vây`, cũng như các vấn đề tiếp tế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000734: locks: [''Giữ lập
    luận xét trên phương diện quân sự, việc gây sức ép quân sự và chính trị lên `tàn
    quân Cộng hòa` cùng `Khối Thịnh vượng chung` thông qua tình hình tại `lục địa
    phía nam`, đồng thời lên kế hoạch hợp tác với `Ildoa` không phải là một sai lầm
    nghiêm trọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000735: locks: [''Giữ giới
    hạn thuần túy trên phương diện quân sự, bảo toàn chính xác hai cụm nhấn mạnh trong
    `*...*` theo `DEC-P01-002` (`*Hoặc là…*` và `*Có lẽ ngay từ đầu Bộ Tổng tham mưu
    đã chỉ đề xuất các chính sách thuần túy dưới góc độ quân sự, còn phần việc còn
    lại họ phó mặc cho chính phủ vì không muốn dẫm chân lên thẩm quyền của chính quyền
    hành pháp.*`), xen giữa là câu dẫn `Tanya nghĩ lại và điều chỉnh kết luận của
    mình.`'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000736: locks: [''Giữ phản
    ứng của `Tanya` chỉ còn nước ôm đầu bất lực nếu quả thực là vậy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000002: locks: [''Giữ câu
    hỏi mở đầu chuyển đoạn `“…Mở rộng chiến tuyến thêm nữa thì có ích lợi gì cơ chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000003: locks: [''Bảo toàn
    chính xác toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`
    với hai câu hỏi liên tiếp về lợi lộc mà `Đế quốc` thu được khi chiếm `các cựu
    thuộc địa của Cộng hòa giữa sa mạc` và việc ý chí hễ gặp kẻ địch nào trên chiến
    trường là quyết đánh tới cùng đã lây sang cả `giới chính trị gia ở hậu phương`,
    những người đáng lý phải giữ cái đầu lạnh và suy tính về mặt chiến lược.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000004: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001` khi lần theo mạch suy nghĩ ấy và rùng mình trước viễn
    cảnh tương lai kinh hoàng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000005: locks: [''Giữ câu
    thoại ngập ngừng của Tanya tự hỏi `Các chính trị gia ở quê nhà` định làm cách
    nào để chấm dứt cuộc chiến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000006: locks: [''Giữ đại
    từ `Nó` theo `DEC-P01-001` (`Nó lẩm bẩm một mình.`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000007: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001` khi ý nghĩ đó khiến `nó` ớn lạnh cả người như trúng
    một lời nguyền, và bảo toàn chính xác câu hỏi nhấn mạnh cuối đoạn đặt trong `*...*`
    theo `DEC-P01-002` (`*Liệu các chính trị gia Đế quốc có đủ khả năng chấm dứt cuộc
    chiến không?*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000008: locks: [''Giữ đại
    từ `Chúng ta` quy chiếu `Lục quân Đế quốc` đang giành chiến thắng trên chiến trường,
    nắm quyền chủ động và tận hưởng những tháng ngày thuận lợi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000009: locks: [''Giữ khẳng
    định cả về mặt chính trị lẫn quân sự, đây chính là `thời khắc huy hoàng nhất`
    của `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000010: locks: [''Giữ câu
    hỏi bỏ lửng `…Vậy nếu đây thực sự là thời khắc huy hoàng nhất của chúng ta, thế
    thì…?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000011: locks: [''Bảo toàn
    chính xác cụm nhấn mạnh đầu đoạn `*Thật uổng phí làm sao*` theo `DEC-P01-002`,
    đại từ `nó` theo `DEC-P01-001`, và nghịch lý đây là `thời khắc huy hoàng nhất`
    của `chúng ta` nhưng `Đế quốc` vẫn đang kiệt quệ `quốc lực` trong một cuộc chiến
    chưa thấy hồi kết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000012: locks: [''Giữ dòng
    tiêu đề thời gian – địa điểm viết hoa toàn bộ: `NGÀY 1 THÁNG 11, NĂM THỐNG NHẤT
    1925, HẠ VIỆN KHỐI THỊNH VƯỢNG CHUNG`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000013: locks: [''Giữ lời
    mở đầu diễn văn trang trọng: `“Hỡi thần dân của Khối Thịnh vượng chung, hôm nay
    tôi xin thông báo với quý vị rằng cái ngày mà Đế quốc, quốc gia quân sự đáng sợ
    kia, dồn sức mạnh nhắm vào chúng ta đang đến gần.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000014: locks: [''Giữ chi
    tiết giọng nói của `vị thủ tướng` gửi tới toàn thể người dân `Khối Thịnh vượng
    chung` qua làn sóng phát thanh truyền tải thực tại khắc nghiệt mà họ đang phải
    đối mặt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000015: locks: [''Giữ thông
    báo `chúng` có ý định tấn công cùng lời hứa thay mặt `Khối Thịnh vượng chung`
    như một niềm an ủi nhỏ nhoi rằng `chúng` sẽ không tài nào tiến sang bằng đường
    biển được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000016: locks: [''Giữ đại
    từ `ông` và nét đối lập giữa nội dung bài phát biểu với giọng điệu phảng phất
    một chút hài hước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000017: locks: [''Giữ hình
    ảnh ẩn dụ lịch sử hải quân `những bức tường gỗ` vẫn được ca tụng từ bao đời nay
    cũng sẽ thấy kẻ thù tà ác đang đối mặt là một thử thách không hề nhỏ, vì chiến
    tranh đã không còn như xưa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000018: locks: [''Giữ câu
    trần thuật ngắn gọn `Ông nói vậy, đề cập đến việc hình thái chiến tranh đã thay
    đổi ra sao.`'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000019: locks: [''Giữ lời
    kêu gọi không được phép nản lòng và thẳng thắn thừa nhận `chúng ta` đang bước
    vào một thời đại khủng khiếp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000020: locks: [''Giữ nhận
    xét bất cứ ai chăm chú lắng nghe đều hiểu ý `ông` muốn nói đây sẽ là một cuộc
    chiến đầy cam go.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000021: locks: [''Giữ dự
    báo cuộc chiến sẽ vô cùng khắc nghiệt, đòi hỏi sự bền bỉ lâu dài, phải chiến đấu
    cho đến khi hoặc `chúng ta` hoặc kẻ thù sụp đổ, và vắt kiệt từng chút sức lực
    cuối cùng của `tổ quốc chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000022: locks: [''Giữ câu
    dẫn `Cùng với những dự báo đó, ông đã đưa ra một lời tuyên bố.`'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000023: locks: [''Giữ lời
    cam kết `“Nhưng tôi xin hứa với tổ quốc thân yêu của mình.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000024: locks: [''Giữ câu
    miêu tả `Từng lời từng chữ đều rõ ràng rành mạch.`'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000025: locks: [''Giữ lời
    tuyên bố đanh thép `“Một ngày nào đó, chúng ta sẽ hủy diệt chúng.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000026: locks: [''Giữ cảnh
    hưởng ứng trong quán rượu: ai đó hô lớn `“Chắc chắn là thế rồi!”` và nhiều người
    gật đầu tán đồng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000027: locks: [''Giữ trọn
    vẹn cấu trúc câu phức trong niềm hy vọng của vị thủ tướng: tại `Khối Thịnh vượng
    chung` của một ngàn năm sau kể từ hôm nay, cháu chắt của con cái `chúng ta` khi
    đọc một cuốn sách lịch sử do một người trong số `chúng ta` chấp bút sẽ thấy rằng
    hiện tại, chính khoảnh khắc này, từng là `thời kỳ huy hoàng nhất của Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000028: locks: [''Giữ câu
    khẳng định `Đó chính là trang sử mà họ có bổn phận phải kiến tạo nên.`'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000029: locks: [''Giữ phép
    đối lập giữa hai vế: đối với `chúng ta`, đây thực sự là `thời kỳ tồi tệ nhất`
    và vô cùng ảm đạm; đồng thời, đối với `Đế quốc`, đây lại là `thời kỳ huy hoàng
    nhất`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000030: locks: [''Giữ nhận
    xét `Ông` thậm chí còn tự tin một cách ngạo nghễ rằng đất nước họ sẽ trường tồn
    vĩnh cửu đến tận một ngàn năm sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000031: locks: [''Giữ lời
    mời nâng cốc kết bài phát biểu: gọi cử tọa là `thưa quý ông và quý bà`, nâng cốc
    vì `thời kỳ tồi tệ nhất của chúng ta`, hai câu hỏi tu từ nối tiếp về việc muốn
    con cháu nói rằng thời kỳ này từng là `thời kỳ huy hoàng nhất của Đế quốc`, và
    lời chúc rượu cuối câu `Vì hiện tại, vì thời kỳ tồi tệ nhất của tổ quốc vĩnh cửu
    của chúng ta—cạn ly!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000730
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_004.xhtml/p000032: locks: [''Giữ dòng
    kết tập đặt trong ngoặc đơn: `(Ấu Nữ Chiến Ký, Tập 3: Thời Khắc Huy Hoàng Nhất,
    Hết)`.'']'
  non_canon: true
