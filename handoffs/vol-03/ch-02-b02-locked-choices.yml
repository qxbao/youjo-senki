task_id: vol-03-ch-02-b02
baseline_sha256: b25552e5b528977241215e4ebc965794581e645a31d03eb204015da8b5b33e52
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 8bf7cd69989f4b52dfdd0effb828af98899e1dbd7b87b19068970b372eddff7d
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027: locks: [''Giữ định
    danh “Bộ Tổng tham mưu”, nhận định câu trả lời của vị đại diện “quá đỗi ung dung
    và chung chung sáo rỗng, đến mức khó lòng nhìn nhận đó là điều gì khác ngoài sự
    thoái thác lập lờ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000028: locks: [''Giữ đại
    từ quy chiếu “ông” và ý “Vẻ mặt của ông đã nói lên tất cả.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000029: locks: [''Giữ hành
    động Zettour phát âm rành rọt từng chữ bằng giọng trầm thấp để tỏ rõ phần trả
    lời đã kết thúc, rồi ngồi xuống quay lại săm soi chọn xì gà với “vẻ khó hiểu không
    hề che giấu trước những ánh mắt đầy vẻ chờ đợi của mọi người”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000030: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng câu đầu `*Chúng tôi không nghi ngờ việc ông thấu
    hiểu tình hình nơi hậu phương, nhưng sự cứng nhắc đầy khuôn sáo trong câu trả
    lời của ông khiến chúng tôi tự hỏi liệu ông có nắm được tính chất nghiêm trọng
    của nó hay không.*` theo DEC-P01-002, câu trần thuật sau để phẳng và giữ thái
    độ buộc phải hỏi cho ra lẽ dù biết là khiếm nhã.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000031: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Bộ Nội vụ”, cấu trúc tăng tiến khác chủ thể “chẳng
    những chúng ta vừa để mất khu công nghiệp Vùng Đất Thấp, mà quân địch còn đặt
    được khu công nghiệp phía tây vào trong tầm bắn pháo hạng nặng của chúng”, điều
    kiện xóa sổ năng lực sản xuất công nghiệp và câu hỏi trực diện cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000032: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Không, chuyện này thật không thể chấp nhận nổi.*`
    theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_002.xhtml/p000033: locks: [''Giữ định
    danh “Bộ Nội vụ”, sự đồng tình của toàn bộ giới công chức và cụm tự hiệu chỉnh
    “Khu công nghiệp Vùng Đất Thấp—à thì, khu công nghiệp phía tây—thực sự là nền
    tảng sản xuất của Đế quốc và, bởi thế, cũng là chìa khóa để tiếp tục cuộc chiến.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000002: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Bộ Ngoại giao”, ngôi xưng “chúng tôi / chúng ta
    – các vị” và yêu cầu quân đội cho biết phương án phù hợp trước nhận định có thể
    phải thực hiện “một số biện pháp chính trị đáng tiếc”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000003: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Bộ Tài chính” và lời mở đầu ngập ngừng bỏ lửng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000004: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng câu đầu `*Tôi không thể tin được là các người
    lại trơ trẽn làm một việc điên rồ như tái tổ chức chiến tuyến để rồi đẩy khu công
    nghiệp Vùng Đất Thấp vào cảnh nguy ngập.*` theo DEC-P01-002, phần trần thuật và
    lời tự nhủ chọn xì gà “Double Corona” của Zettour để phẳng không in nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000005: locks: [''Giữ chi
    tiết Zettour xin phép trả lời bằng giọng điệu thấy phiền phức sau mọi lời thúc
    giục và ý kiến thẳng thắn, khiến mọi người càng thêm giận dữ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000006: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “triều đình”, “Hoàng đế Bệ hạ”, lời tạ lỗi
    thay mặt quân đội và sự tự tin sẽ sớm tạo ra bước đột phá.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000007: locks: [''Giữ nhận
    định nước đi “hoặc là táo bạo hoặc là xa rời thực tế” và hành động “tràng giang
    đại hải tạ lỗi với triều đình Đế quốc”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000008: locks: [''Giữ sự
    đối lập giữa nỗi bực bội vì mất thời gian với lời thì thầm bái phục “độ mặt dày
    đáng nể của ông ta” cùng chi tiết gọi thêm tách cà phê thứ hai.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000009: locks: [''Giữ hành
    động Zettour chợt nhớ tới giờ giấc và ung dung xem đồng hồ bỏ túi, đẩy sự kiên
    nhẫn của cả phòng đến giới hạn cuối cùng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000010: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu lẩm bẩm “…Chắc cũng sắp đến giờ rồi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000011: locks: [''Giữ giọng
    điệu thản nhiên không chút bận tâm của Zettour và ánh mắt nhìn chằm chằm của mọi
    người xem liệu ông có định thu dọn đồ đạc rời đi không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000012: locks: [''Giữ dấu
    ngoặc kép hội thoại và câu hỏi ngắn “Đến giờ?” khớp với câu nói ở p000010.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000013: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng cụm `*Đừng hòng thoát tội dễ dàng nếu chúng tôi
    không hài lòng với câu trả lời của ông*` theo DEC-P01-002, cùng chi tiết Zettour
    phớt lờ họ và nhìn về phía cánh cửa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000014: locks: [''Giữ hình
    ảnh so sánh “Như thể có ai đó vừa kêu thấu trời xanh”, tiếng gõ cửa dồn dập dữ
    dội và phạm vi loại trừ “gây nên một trận xôn xao trong tất cả những người tham
    dự ngoại trừ một người duy nhất”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000015: locks: [''Giữ dấu
    ngoặc kép hội thoại và lời xin lỗi vì làm gián đoạn hội nghị của người lính mới
    tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000016: locks: [''Giữ sự
    tương phản “khác hẳn với Zettour”, hành động người lính lùi lại vài bước và nhìn
    về phía một trong những người đàn ông trong phòng để cầu cứu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000017: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi xưng “anh” và câu hỏi xác nhận “Ồ, anh mang mật mã đến
    rồi đấy à?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000018: locks: [''Giữ câu
    trần thuật ngắn “Chỉ vỏn vẹn có bấy nhiêu lời được thốt ra.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000019: locks: [''Giữ tác
    dụng của một câu hỏi từ người đàn ông nãy giờ vẫn nói chuyện tầm phào giúp kéo
    anh chàng người lính về với thực tại, mở tờ giấy rút từ trong túi ra sẵn sàng
    thông báo cho cả phòng họp.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_002.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000020: locks: [''Giữ dấu
    ngoặc kép hội thoại, cách xưng hô “Thưa ngài – Tôi”, dấu nháy đơn trích dẫn nội
    dung bức điện tín được nhắc lại hai lần “‘Chúng ta là Reich, vương miện của thế
    giới!’”.'']'
  non_canon: true
