task_id: vol-03-ch-04-b02
baseline_sha256: 6a0eaeae4bdda7e1309f0c8e1f9e8cf914fc310cb7cd4e561f275bd604a9f051
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: f6c2c1cc0fb24be53791f50a82c232486b81f8c25185f6449b2d0d224b7a9c1c
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012: locks: [''Giữ nhịp
    ngập ngừng và lời chấp nhận ngắn gọn `Chuyện đó… ừm, cũng không sao.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000013: locks: [''Giữ ẩn
    dụ `nếm trải thứ mật ngọt chiến thắng`, tên `Tanya`, đại từ trần thuật `Nó` theo
    DEC-P01-001 và lập luận rằng việc cấp trên lợi dụng thuộc cấp và xâm phạm quyền
    lợi của họ chỉ vì họ là cấp dưới là điều không thể dung thứ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000014: locks: [''Giữ tên
    `Tanya`, mệnh đề phủ định `không trách binh lính vì đã ăn mừng chiến thắng của
    họ` và lý do họ đã dốc hết sức mình ở vị trí được giao.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000015: locks: [''Giữ chính
    xác hai phần chữ nghiêng tách quanh mệnh đề trần thuật `*Vấn đề là,* Tanya ngước
    nhìn lên trời mà than thở trong khi chỉ vừa khéo kìm nén cơn thịnh nộ như lửa
    địa ngục của mình, *cùng một tâm lý lạc quan ấy lại lây nhiễm sang cả giới chóp
    bu. Thật hết thuốc chữa.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000016: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, định danh `Bộ Tổng tham mưu` ở cả hai vế
    và cụm từ trong ngoặc kép `“đại thắng”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000017: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001 và sự đối lập giữa việc nhờ chút tự chủ ít
    ỏi còn sót lại để tránh bùng nổ ngay tại chỗ với trạng thái sôi sục vì giận dữ
    theo đúng nghĩa đen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000018: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, hành động quẳng mạnh mũ xuống sàn khi vừa
    khép cửa và lời gào trút giận với ngôi `Chúng ta` – `Các người` cùng sự đối lập
    giữa biết giành chiến thắng nhưng không hiểu cách sử dụng nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000019: locks: [''Giữ tên
    `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001 và quan hệ nhân quả giải thích
    vì sao Tanya xả hết bức xúc trong phòng riêng nơi không lo ai tình cờ nghe thấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000020: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, định danh `Bộ Tổng tham mưu` và chính xác
    phạm vi chữ nghiêng ở hai câu hỏi nội tâm `*Bộ Tổng tham mưu phải ngu xuẩn đến
    mức nào mới phởn phơ trước cái “đại thắng” này khi cuộc chiến thậm chí còn chưa
    kết thúc cơ chứ?! Họ đang nghĩ cái quái gì vậy?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000021: locks: [''Giữ hai
    định danh `Bộ Tổng tham mưu` và `Bộ Tư lệnh Tối cao` cùng chuỗi câu hỏi cảm thán
    chất vấn việc không tận dụng chiến thắng và không tiến hành đàm phán để kết thúc
    chiến tranh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000022: locks: [''Giữ nhận
    định cuộc chiến được chia thành nhiều giai đoạn và lập luận rằng các sĩ quan cùng
    binh lính ngoài tiền tuyến đã hoàn thành tốt nhiệm vụ nên có quyền được phép ăn
    mừng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000023: locks: [''Giữ mệnh
    đề điều kiện bỏ lửng với hai định danh `Bộ Tổng tham mưu` (cơ quan chỉ đạo cuộc
    chiến) và `Bộ Tư lệnh Tối cao` (tổ chức cấp trên) đang phấn khích vì chiến thắng
    rồi khui rượu ăn mừng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000024: locks: [''Giữ câu
    kết luận ngắn `Đó là sự tắc trách.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000025: locks: [''Giữ câu
    kết luận ngắn `Đó là một sai lầm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000026: locks: [''Giữ cấp
    độ tăng tiến `Không, hơn thế nữa, đó là tội ác. Đó là sự bất hành động mang tính
    tội phạm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000027: locks: [''Giữ lời
    than bỏ lửng `“Khốn kiếp! Tại sao chuyện này lại xảy ra chứ? Làm thế nào mà Bộ
    Tổng tham mưu lại đột nhiên trở nên…?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000028: locks: [''Giữ toàn
    bộ câu cảm thán nội tâm in nghiêng `*Làm thế nào mà họ lại đột nhiên trở nên đần
    độn đến thế cơ chứ?!*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000029: locks: [''Giữ tên
    `Tanya` và chuỗi hành động bật bếp cồn đun nước sôi rồi với lấy cối xay cà phê.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000030: locks: [''Giữ đại
    từ trần thuật `Nó` / `nó` theo DEC-P01-001, địa danh `Parisii`, quy trình xay
    hạt cà phê arabica thượng hạng, dùng phễu lọc giấy, ủ cho bột cà phê nở bung trên
    bề mặt trước khi chế nước và hít sâu hương thơm để tìm sự bình yên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000031: locks: [''Giữ câu
    thoại tự vấn `“Bộ Tổng tham mưu không hiểu rõ tình hình. Nhưng tại sao lại thế?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000032: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, câu hỏi nội tâm in nghiêng `*Tại sao chuyện
    này lại xảy ra?*` theo DEC-P01-002, các thuật ngữ `Lục quân Đế quốc`, `trường
    quân sự cao cấp`, `sương mù chiến tranh` và cấu trúc tăng tiến `không chỉ ứng
    phó… mà còn phải lập kế hoạch…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000033: locks: [''Giữ lời
    tự nhủ với đại từ `Mình` theo DEC-P01-001: `“…Mình thực sự không tài nào hiểu
    nổi. Chuyện gì đã xảy ra vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000034: locks: [''Giữ tên
    `Tanya`, định danh `Bộ Tổng tham mưu` và chi tiết dù đã tạm thời lấy lại bình
    tĩnh nhưng vẫn không sao hiểu thấu việc họ ngây ngất trong men say chiến thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000035: locks: [''Giữ các
    định danh `Lục quân Đế quốc`, `Bộ Tổng tham mưu`, cụm `những sĩ quan đặc biệt
    lý trí` và lập luận dựa trên `Lý thuyết xác suất`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000036: locks: [''Giữ câu
    hỏi tu từ kết hợp ẩn dụ `Vậy thì tại sao tất cả bọn họ lại say khướt trong men
    rượu chiến thắng như thế?`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000037: locks: [''Giữ đại
    từ tự xưng `mình` theo DEC-P01-001, thành ngữ `trăm nghe không bằng một thấy`
    và quyết định đích thân đến đó một chuyến.'']'
  non_canon: true
