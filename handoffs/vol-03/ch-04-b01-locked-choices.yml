source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: dddc203c7450f8cfac84717d7f8e61583c379a5a7df802d3124cf1d0391360d2
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002: locks: [''Giữ dòng
    tiêu đề thời gian–địa điểm viết hoa toàn bộ `NGÀY 10 THÁNG 7, NĂM THỐNG NHẤT 1925,
    BREST DƯỚI QUYỀN QUÂN QUẢN ĐẾ QUỐC`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000003: locks: [''Giữ câu
    thoại mở đầu `“Xin phép báo cáo!”`, cấp bậc `Thiếu úy Grantz` và chi tiết giữ
    giọng điệu dứt khoát nhờ ý thức trách nhiệm bất chấp bầu không khí căng thẳng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000004: locks: [''Giữ cấp
    bậc `Trung úy Weiss`, đại từ `cậu ta` quy chiếu Grantz, đại từ `anh` quy chiếu
    Weiss và trạng thái bản thân Weiss cũng cảm thấy khá căng thẳng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000005: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Trung úy Weiss` và lời báo cáo toàn bộ thành
    viên của tiểu đoàn đã có mặt đầy đủ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000006: locks: [''Giữ lời
    cảm ơn kèm đại từ `cậu`, danh xưng `Thiếu úy Grantz` và câu hỏi trực tiếp về sự
    chậm trễ hậu cần.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000007: locks: [''Giữ câu
    trả lời phủ định lễ phép `“Thưa ngài, hoàn toàn không có ạ!”`, ngôi `Chúng ta`
    và việc đã trang bị đầy đủ cả nhu yếu phẩm lẫn dụng cụ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000008: locks: [''Giữ cấp
    bậc `Thiếu tá von Degurechaff`, chức danh `viên phó chỉ huy` và cấu trúc đối lập
    nhấn mạnh sự trớ trêu khi báo cáo hệ trọng này lại trình lên phó chỉ huy chứ không
    phải Thiếu tá.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000009: locks: [''Giữ đại
    từ `Anh` và hành động đưa ra phán đoán ngay khi tiếp nhận báo cáo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000010: locks: [''Giữ giả
    định trái thực tế `lẽ ra đích thân chỉ huy phải là người đưa ra quyết định` đối
    lập với thực tại sĩ quan cấp cao nhất lúc này là `Trung úy Weiss`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000011: locks: [''Giữ cấp
    bậc `Thiếu tá von Degurechaff` và chính xác phạm vi chữ nghiêng ở hai câu độc
    thoại nội tâm cuối đoạn `*Thiếu tá từng bảo mình rằng có thể mình sẽ được thăng
    hàm trước khi hết năm nay. Thế giới này quả là một nơi kỳ lạ.*` theo DEC-P01-002,
    trong đó Weiss tự quy chiếu bằng `mình` và gọi cấp trên là `Thiếu tá`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000012: locks: [''Giữ câu
    hỏi dò ý ngắn gọn `“…Thưa ngài?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000013: locks: [''Giữ lời
    đáp phủ định tự nhiên `“À, không có gì đâu, Thiếu úy.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000014: locks: [''Giữ đại
    từ `anh`, mệnh đề phủ định `giờ không phải lúc để do dự`, ẩn dụ `dội một gáo nước
    lạnh vào bầu không khí căng thẳng và đầy kỳ vọng này` và ý thức hoàn thành trách
    nhiệm chỉ huy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000015: locks: [''Giữ khẩu
    lệnh `“Các đại đội trưởng, báo cáo tình hình!”` và đại từ `anh`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000016: locks: [''Giữ quan
    hệ nhượng bộ–đối lập giữa việc cố giữ vẻ điềm tĩnh của một người chuyên nghiệp
    và việc `anh` không sao nén nổi hoàn toàn niềm háo hức mong chờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000017: locks: [''Giữ lời
    báo cáo `“Toàn bộ các đơn vị đã có mặt. Đã vào vị trí chiến đấu loại một!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000018: locks: [''Giữ câu
    trần thuật ngắn gọn về lời báo cáo sẵn sàng đáp lại mệnh lệnh vang dội.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000019: locks: [''Giữ câu
    hỏi trực tiếp `“Tình hình bên các cậu thế nào?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000020: locks: [''Giữ nhận
    định giọng nói cho thấy thời khắc khai màn trận đánh đã cận kề.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000021: locks: [''Giữ lời
    kiểm điểm hài hước `“Bia, đã sẵn sàng! Rượu vang, đã sẵn sàng!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000022: locks: [''Giữ câu
    trần thuật ngắn `Câu trả lời vang lên đầy tự hào.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000023: locks: [''Giữ nhịp
    điệp xác nhận `“Thịt, cá, sẵn sàng, đã sẵn sàng!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000024: locks: [''Giữ hình
    ảnh khẩu phần bổ sung hậu hĩnh như đang thách thức họ xử lý cho hết và việc dốc
    toàn bộ sức chiến đấu của tiểu đoàn vào việc dọn sạch mọi thứ đã chôm chỉa và
    tích trữ được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000025: locks: [''Giữ câu
    hô xác nhận `“Biển, đã sẵn sàng!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000026: locks: [''Giữ tên
    `Weiss`, đại từ `anh` và niềm tin không chút lay chuyển rằng mình đã chọn đúng
    địa điểm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000027: locks: [''Giữ khẩu
    lệnh phát động `“Tuyệt lắm, hỡi toàn quân, chiến dịch này chính thức bắt đầu!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000028: locks: [''Giữ đầy
    đủ các chi tiết miêu tả khung cảnh nắng sớm đầu hạ, vỉ nướng và bàn sơ chế chất
    đầy núi thịt đủ loại, từng thùng bia chai ướp lạnh cùng rượu vang và sâm panh
    kiếm từ tận đẩu tận đâu về.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000029: locks: [''Giữ định
    danh đầy đủ `Tiểu đoàn Pháp sư Trên không số 203` và quyết tâm dốc trọn cả thể
    xác lẫn tâm hồn vào việc tận hưởng bãi biển.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000030: locks: [''Giữ câu
    ngắn nhấn mạnh `Mọi thứ đều là vì ngày hôm nay.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000031: locks: [''Giữ lời
    chúc rượu thứ nhất `“Vì chiến thắng!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000032: locks: [''Giữ lời
    chúc rượu thứ hai `“Vì những người anh em chiến hữu của tôi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000033: locks: [''Giữ lời
    chúc rượu thứ ba `“Vì Reich!”` (bảo toàn từ `Reich` nguyên gốc).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000034: locks: [''Giữ cụm
    ba cặp dấu ngoặc kép đồng thanh `“““Cạn ly!”””`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000035: locks: [''Giữ câu
    miêu tả ba lời chúc rượu cùng một tiếng hô sảng khoái vang dội.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000036: locks: [''Giữ chi
    tiết gác lại mọi lễ nghi quân kỷ chỉ riêng trong ngày hôm nay, các cuộc thi uống
    bia, nút chai sâm panh bật tung và tên bài hát `“Chúng ta là Reich, Vương miện
    của Thế giới”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_002.xhtml/p000037: locks: [''Giữ định
    danh `khu nghỉ dưỡng của Cộng hòa` và hình ảnh ẩn dụ ca ngợi thứ mật ngọt chiến
    thắng mát lạnh như băng trong tay họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000002: locks: [''Giữ lời
    hô `“Vì Đế quốc,”`, cảnh các binh sĩ trưởng thành vác xẻng ra bãi cát nô đùa rồi
    các trung đội thi đào cát với nhau, người nhảy thẳng xuống nước, người lao về
    phía vỉ nướng với tiếng reo `“Trước tiên là thịt đã!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000003: locks: [''Giữ cấu
    trúc liệt kê ba nguồn cơn gây say ngất ngây: chiến thắng, niềm vui sống sót và
    cảm giác thành tựu khi hoàn thành chức trách.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000004: locks: [''Giữ dòng
    tiêu đề chuyển cảnh viết hoa toàn bộ `CÙNG LÚC ĐÓ, CĂN CỨ BREST CỦA LỤC QUÂN ĐẾ
    QUỐC`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000005: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, chức danh `sĩ quan phụ tá` và định danh đầy
    đủ `Thiếu tá Ma pháp Tanya von Degurechaff thuộc Lục quân Đế quốc, sĩ quan Bộ
    Tổng tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000006: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, định danh `Bộ Tổng tham mưu` và ý dù cố đọc
    kỹ ẩn ý giữa các dòng chữ đến đâu cũng không thay đổi được thực tế đây là thông
    báo chính thức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000007: locks: [''Giữ câu
    thoại của Tanya `“…Xin lỗi nhé, Thiếu úy Serebryakov, tôi ra ngoài một lát.”`
    với đại từ `tôi` và danh xưng `Thiếu úy Serebryakov`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000008: locks: [''Giữ tên
    `Tanya`, chức danh `viên phụ tá`, các địa điểm `tòa nhà sinh hoạt` và `sở chỉ
    huy tiểu đoàn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000009: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001 và sự tương phản giữa bầu trời quang đãng
    với tâm trạng của Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000010: locks: [''Giữ câu
    hỏi cảm thán nhẹ `“Sắp sang hè rồi nhỉ…?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter004_002.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter004_004.xhtml/p000011: locks: [''Giữ mức
    độ chắc chắn `có lẽ`, tên `Tanya`, cấp bậc `Trung úy Weiss`, đại từ trần thuật
    `nó` theo DEC-P01-001 và việc chính Tanya đã cho phép thuộc cấp nghỉ phép cũng
    như duyệt chi quỹ tiểu đoàn để họ mở tiệc nướng ngoài bãi biển nhằm ghi nhận công
    lao.'']'
  non_canon: true
