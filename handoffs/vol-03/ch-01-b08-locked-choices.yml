source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: da5cb4e2bf2186d3f5e07e0dd55b7b088952cafcc4cf024db011ef306f5eee19
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177: locks: [''Giữ lời
    nhận xét và chúc phúc của Lergen, cấp bậc “Thiếu tá von Degurechaff”, đại từ “Cô”
    / “cô” và câu cầu chúc “Cầu Chúa phù hộ cho cô.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000178: locks: [''Giữ cấp
    bậc “Đại tá von Lergen”, đại từ “ông”, quan hệ nhượng bộ giữa vẻ mặt bối rối trước
    lời thề có phần đậm chất triết học với hành động cố nở nụ cười gượng gạo và chìa
    tay ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000179: locks: [''Giữ câu
    thoại “Cầu Chúa phù hộ cho Tổ quốc.” và vế bổ sung ngẫu hứng “Mà nghĩ lại thì,
    chừng nào những người lính chúng ta còn ở đây, có lẽ tự tay chúng ta có thể lo
    liệu việc đó thay cho Ngài.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000180: locks: [''Giữ chủ
    thể “Tanya” / “nó” theo DEC-P01-001, tên riêng “Lergen”, dấu nhấn mạnh chữ nghiêng
    chỉ ở đúng câu thứ hai `*Con người có thể làm thay phần việc của Chúa.*` theo
    DEC-P01-002 và cảm giác phấn khích như phải lòng cách diễn đạt ấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000181: locks: [''Giữ câu
    độc thoại ngắn “Chúng ta sẽ thế chỗ của Chúa.” ở dạng văn bản phẳng không in nghiêng
    theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000182: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng bao trọn toàn đoạn nhẩm lại nguyên văn câu nói của Lergen
    theo DEC-P01-002, khớp với p000179.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000183: locks: [''Giữ câu
    cảm thán “Cách diễn đạt mới tuyệt vời làm sao!” ở dạng văn bản phẳng không in
    nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000184: locks: [''Giữ đại
    từ độc thoại “mình” theo DEC-P01-001, định danh “tên Being X khốn kiếp kia” và
    thuật ngữ “chủ nghĩa vô thần”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000185: locks: [''Giữ sự
    chuyển đổi điểm nhìn từ độc thoại ngôi thứ nhất “Mình sẽ cứu lấy Tổ quốc thay
    cho Chúa.” sang trần thuật ngôi thứ ba dùng đại từ “nó” theo DEC-P01-001, cùng
    ý chí quyết tâm lập chiến tích xuất sắc đến mức sự tồn tại của Chúa trở nên thừa
    thãi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000186: locks: [''Giữ nhận
    định “Về mặt lý thuyết, việc đột kích tổng hành dinh địch là một lựa chọn hợp
    logic.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000187: locks: [''Giữ đại
    từ độc thoại “mình” theo DEC-P01-001, thuật ngữ “hoàn toàn hợp lý” và lập luận
    về gánh nặng công việc khác thường khi vừa bảo vệ căn cứ trọng yếu ở hậu phương
    vừa phân bổ quân cho tiền tuyến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000188: locks: [''Giữ định
    danh “quân Cộng hòa”, “tổng hành dinh”, đại từ “chúng ta” và mệnh đề nhượng bộ
    giả định “ngay cả khi chúng ta hoàn toàn không gây ra bất kỳ thiệt hại nào cho
    tổng hành dinh của chúng theo đúng nghĩa đen”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000189: locks: [''Giữ các
    thuật ngữ “tổng hành dinh”, “máy bay ném bom hạng nặng”, “boong-ke”, “các chỉ
    huy địch” và cấu trúc phủ định “cũng chẳng phải điều hiếm gặp”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000190: locks: [''Giữ các
    thuật ngữ quân sự “pháp sư”, “binh chủng đặc thù”, “bộ binh”, “lính đổ bộ đường
    không”, phép so sánh độ cơ động ngang ngửa “trực thăng” và mục đích “thâm nhập
    sâu vào lãnh thổ địch”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000191: locks: [''Giữ đại
    từ “chúng ta”, cụm “phô diễn tinh hoa của sức mạnh tác chiến ma pháp”, mệnh đề
    điều kiện “nếu có thể đưa vào đó chi tiết cứu lấy Tổ quốc thay cho Chúa” và kết
    luận “thì đấy sẽ là màn tuyên truyền tuyệt vời nhất”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000192: locks: [''Giữ chủ
    thể “Tanya”, dấu nhấn mạnh chữ nghiêng chỉ ở đúng mệnh đề tự nhủ `*Mình chỉ đang
    lấy mấy quả chanh chua này để pha nước chanh thôi*` theo DEC-P01-002 và ý cố biến
    nguy thành cơ khi nhìn thấy trước cơ hội tuyệt vời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000193: locks: [''Giữ đại
    từ độc thoại “mình” theo DEC-P01-001 và cấu trúc giả định nhượng bộ hài hước “sẽ
    còn vui vẻ tham gia hơn nữa nếu chiến dịch này không đi kèm với việc bị trói vào
    một khối thuốc nổ” ở dạng văn bản phẳng không in nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000194: locks: [''Giữ đại
    từ độc thoại “Mình” theo DEC-P01-001, các thuật ngữ “đội xung kích”, “thâm nhập
    vào chiến trường” và chi tiết “bị buộc chặt vào một quả V-1”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000195: locks: [''Giữ cấp
    bậc và họ “Thiếu tá von Degurechaff” cùng trạng thái phấn chấn sau khi tìm được
    mục đích rõ ràng để hướng tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000196: locks: [''Giữ các
    biệt danh “Ác quỷ sông Rhine”, “Ngân Gỉ”, thuật ngữ “tổng hành dinh địch” và chi
    tiết lao về phía mục tiêu với tinh thần hăng hái tột độ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000197: locks: [''Giữ đại
    từ trần thuật “nó” quy chiếu Tanya theo DEC-P01-001, dấu nhấn mạnh chữ nghiêng
    đúng ở hai cụm lời phát biểu trực tiếp theo DEC-P01-002, sự phân biệt giữa “các
    vị thần” đi kèm “Valhalla” ở câu đầu với “Chúa” và “Hãy trả cho Caesar những gì
    thuộc về Caesar!” ở câu sau.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000198: locks: [''Giữ sự
    đối lập lịch sử chỉ lưu truyền một mặt của câu chuyện, đại từ trần thuật “nó”
    / phản thân “mình” theo DEC-P01-001, định danh “V-1” và dấu nhấn mạnh chữ nghiêng
    chỉ ở đúng câu hỏi cuối đoạn `*Sao lại là mình chứ?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000199: locks: [''Giữ chính
    xác hai thông số bay: “Độ cao hiện tại: 8.800 feet; tốc độ: 991 hải lý/giờ.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000200: locks: [''Giữ các
    định danh đơn vị “Đại đội”, “Tiểu đoàn 203”, “Tiểu đoàn Pháp sư Đánh chặn Trên
    không số 203”, chi tiết “xuyên qua bức tường âm thanh” và dấu nhấn mạnh chữ nghiêng
    ở thuật ngữ đội hình `*Schwärme*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000201: locks: [''Giữ nhận
    định “Dù tốt hay xấu, chiến dịch đang được triển khai suôn sẻ mà không gặp bất
    kỳ trục trặc cơ khí nào.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000202: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng câu càu nhàu mở đầu `*Gọi là “đang được triển
    khai”, chứ thực chất chúng ta chỉ đang được vận chuyển đi mà thôi*` theo DEC-P01-002,
    định danh “V-1”, bản chất là tên lửa chứ không phải máy bay và giới hạn đổi hướng
    ở mức vài milimét.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000203: locks: [''Giữ định
    danh “V-1”, thuật ngữ “cần điều khiển” và trình tự bật công tắc khởi động động
    cơ rồi thực hiện những tinh chỉnh nhỏ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000204: locks: [''Giữ sự
    chuyển điểm nhìn từ ngôi thứ ba (“Các pháp sư trên khoang”) sang ngôi thứ nhất
    số nhiều (“chúng ta”), các thuật ngữ “màn chắn bảo hộ”, “lớp vỏ phòng thủ”, “cần
    điều khiển”, “góc tiếp cận”, “cơ động né tránh khẩn cấp” và chức năng đặc biệt
    cung cấp thêm gia tốc.'']'
  non_canon: true
