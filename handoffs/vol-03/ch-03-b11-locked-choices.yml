source_package_sha256: 767bf0116248c8eabce8396558feb39ea280af4aef1d8accdcb40c6cf34f744d
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 42
segment_id_start: YS-LN03/Text/chapter003_004.xhtml/p000176
segment_id_end: YS-LN03/Text/chapter003_004.xhtml/p000217
choices:
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176: locks: [''Giữ đại
    từ trần thuật `Nó` theo DEC-P01-001, định danh `những quả V-1`, việc lược bỏ toàn
    bộ khâu kiểm tra dự báo thời tiết cùng phân tích động thái quân địch để chỉ nhận
    tóm tắt sơ lược qua vô tuyến, và lựa chọn tuyến tấn công ngắn nhất nhằm tiết kiệm
    nhiên liệu kiêm tạo vụ nổ lớn hơn khi đánh trúng tàu địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000177: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001 và sự ưu tiên tốc độ hơn là sự trau chuốt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000178: locks: [''Giữ định
    danh `Đế quốc` và lời khen ngợi các kỹ sư lành nghề thoăn thoắt làm việc, thể
    hiện năng lực hỗ trợ kỹ thuật trình độ cao.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000179: locks: [''Giữ đại
    từ nội tâm `Mình` theo DEC-P01-001, cụm `những cỗ máy chính xác` và lòng biết
    ơn khi chúng được bảo dưỡng đàng hoàng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000180: locks: [''Giữ ý chỉ
    còn một chút thời gian nữa thôi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000181: locks: [''Giữ từ
    phủ định chuyển ý `Không`, ngôi `chúng ta` và nhận định chỉ vài phút nữa là có
    thể lên đường.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000182: locks: [''Giữ toàn
    bộ câu hỏi nội tâm in nghiêng `*Có nên ra lệnh cho mọi người vào khoang luôn không
    nhỉ?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000183: locks: [''Giữ tên
    `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001, các định danh `cơ sở thông tin
    liên lạc`, `Bộ Tư lệnh Cụm tập đoàn quân` và chi tiết nét mặt Tanya dần đanh lại
    khi thấy người lính ban nãy hộc tốc chạy tới.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000184: locks: [''Giữ cụm
    `người lính điện đài`, đại từ `anh ta`, đại từ trần thuật `nó` theo DEC-P01-001
    và miêu tả người lính biến sắc, cắm đầu chạy hết sức bình sinh với ánh mắt có
    chuyện cần báo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000185: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, đại từ `anh ta` và nhận thức rằng người lính
    đang cuống cuồng muốn chuyển một thông điệp nào đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000186: locks: [''Giữ dấu
    ngoặc kép hội thoại và tiếng than bực bội `“…Aaa, chết tiệt.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000187: locks: [''Giữ tên
    `Tanya` và hành động chẳng còn biết làm gì ngoài việc ngửa mặt than trời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000188: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, cấu trúc phủ định `Không phải là nó tin vào
    trực giác, nhưng...` và tình thế vẫn còn mất thêm một chút xíu nữa đơn vị mới
    có thể phóng đi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000189: locks: [''Giữ câu
    cảm thán về việc ngay cả một sự chậm trễ nhỏ nhoi không đáng kể trong tác chiến
    cũng có thể dẫn tới hậu quả chí mạng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000190: locks: [''Giữ đại
    từ `anh ta` và ý chỉ chênh nhau vài phút ngắn ngủi nhưng quá đủ để lời người lính
    kia sắp nói kịp thốt ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000191: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, nỗi hối hận muộn màng từ tận đáy lòng và
    chi tiết thoáng nghĩ tới chuyện đánh ngất người đưa tin nhưng lập tức gạt phắt
    đi vì có quá nhiều người đang nhìn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000192: locks: [''Giữ mệnh
    đề phủ định về việc hoảng loạn không giúp cải thiện tình hình, câu hỏi liên tưởng
    tới khoảnh khắc trước khi bước lên pháp trường và nhận định đây là tận cùng của
    sự xui xẻo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000193: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, tiểu từ `ạ` và cụm `mệnh lệnh đặc
    biệt từ Bộ Tổng tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000194: locks: [''Giữ đại
    từ nội tâm `mình` theo DEC-P01-001, chính xác phạm vi chữ nghiêng `*bất cứ thứ
    gì*` theo DEC-P01-002 và ý người lính chẳng cần mở miệng cũng biết đó là tin tồi
    tệ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000195: locks: [''Giữ đại
    từ `cậu` trong lời trách thầm người lính điện đài sao không biết điều hơn và làm
    việc chậm rãi hơn một chút.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000196: locks: [''Giữ đại
    từ nội tâm `Mình` theo DEC-P01-001, đại từ `anh ta` và sự tự nhận thức rằng cảm
    xúc đang gào thét vô lý khi vừa mới thầm tán thưởng lòng tận tụy của người lính
    cách đó ít khoảnh khắc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000197: locks: [''Giữ toàn
    bộ câu ngắn in nghiêng `*Dù vậy.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000198: locks: [''Giữ tên
    `Tanya`, đại từ `anh ta` và cơn bốc đồng không sao kìm nổi muốn bóp cổ người đưa
    tin.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000199: locks: [''Giữ dấu
    ngoặc kép hội thoại, thuật ngữ `Lệnh ngừng bắn`, định danh `Bộ Tổng tham mưu`,
    tiểu từ `ạ` và mức độ ưu tiên cao nhất gửi tới toàn bộ các đơn vị.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000200: locks: [''Giữ dấu
    ngoặc kép hội thoại và hai câu hỏi bàng hoàng xác nhận việc ban bố `lệnh ngừng
    bắn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000201: locks: [''Giữ sự
    chuyển đổi điểm nhìn từ trần thuật ngôi ba (`nó`, `Trung úy Weiss`) sang độc thoại
    nội tâm ngôi một số nhiều (`chúng ta`, `mình`) theo DEC-P01-001, cùng hệ quả tất
    cả những người khác đều nghe thấy nên không thể phát động tấn công rồi vịn cớ
    chưa nghe thấy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000202: locks: [''Giữ đại
    từ nội tâm `mình` theo DEC-P01-001, cấu trúc tăng tiến `chẳng những không... mà...
    còn` và hệ quả bị xử bắn vì tội phá vỡ `lệnh ngừng bắn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000203: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, tiểu từ `ạ` và lời khẩn cầu đình
    chỉ `cuộc xuất kích` ngay lập tức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000204: locks: [''Giữ câu
    khẳng định phủ định rằng không có cách nào hiểu lầm tiếng hét đó được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000205: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm `lệnh ngừng bắn`, tiểu từ `ạ` và lời nhắc lại yêu cầu
    đình chỉ `cuộc xuất kích` ngay lập tức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000206: locks: [''Giữ đại
    từ `Anh ta` và đại từ nội tâm `mình` theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000207: locks: [''Giữ chính
    xác hai câu in nghiêng `*Rồi, tôi nghe thấy cậu rồi.*` và `*Chừng nào đây là nhiệm
    vụ của cậu, mình nên tôn trọng cậu vì đã hoàn thành nó.*` theo DEC-P01-002, tên
    `Tanya`, đại từ `Anh ta`, thuật ngữ `hạ sĩ quan` và nhận định mọi hạ sĩ quan đều
    nên trung thành với chức trách như thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000208: locks: [''Giữ tên
    `Tanya`, đại từ trần thuật `Nó / nó` theo DEC-P01-001, cụm `kế hoạch hành động
    đơn phương`, định danh `Đế quốc` và lý do đây là cơ hội cuối cùng để Đế quốc tránh
    khỏi thất bại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000209: locks: [''Giữ chính
    xác hai câu đầu in nghiêng `*Ngay bây giờ. Nếu chúng ta không hành động ngay bây
    giờ, chúng ta sẽ chẳng còn cách nào kịp trở tay nữa.*` theo DEC-P01-002, định
    danh đầy đủ `Thiếu tá Tanya von Degurechaff`, `Đế quốc` và ẩn dụ lịch sử `Nếu
    để tái diễn một kịch bản kiểu Dunkirk`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000210: locks: [''Giữ toàn
    bộ đoạn độc thoại nội tâm in nghiêng `*Vậy nên chúng ta phải làm chuyện đó ngay
    bây giờ. Nếu không, có lẽ chúng ta chẳng thể cứu vãn nổi Đế quốc.*` theo DEC-P01-002,
    ngôi `chúng ta`, mức độ chắc chắn `có lẽ` và định danh `Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000211: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, ngôi `họ` và nhận thức rằng nếu xuất kích
    thì chính Tanya sẽ phải chịu trách nhiệm vì tội vi phạm `lệnh ngừng bắn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000212: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, giả định trái thực tế ở quá khứ (`Giá như...
    có lẽ đã khác`) và thực tại đã có chỉ thị rõ ràng đình chỉ `cuộc xuất kích` do
    `lệnh ngừng bắn` nên không còn chỗ cho những lý lẽ lập lờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000213: locks: [''Giữ tên
    `Tanya`, đại từ trần thuật `Nó` theo DEC-P01-001, định danh `Đế quốc` và dự cảm
    tất yếu về thảm họa cùng sự diệt vong sẽ giáng xuống Đế quốc nếu không đi ngay
    lúc này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000214: locks: [''Giữ sự
    đối lập rằng cứ thế mà đi lại đồng nghĩa với sự sụp đổ không thể tránh khỏi của
    cá nhân `nó`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000215: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, sự lưỡng nan giữa việc không thể `xuất kích`
    với cái chết từ từ của một sự sụp đổ đang chực chờ, và nỗi đau đớn khi thấy cơ
    hội xóa sổ hoàn toàn khả năng ấy ngay trước mắt mà buộc phải buông tay.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000216: locks: [''Giữ câu
    chuyển đoạn ngắn `Và thế là.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter003_004.xhtml/p000217: locks: [''Giữ đại
    từ trần thuật `nó` theo DEC-P01-001, hành động bùng nổ trong cơn thịnh nộ khuỵu
    xuống đường băng bất chấp ai nghe thấy và lời thoại tuyệt vọng `“…Hừ. Chết tiệt,
    chết tiệt, chết tiệt! Hủy bỏ! Hủy bỏ cuộc xuất kích!”`.'']'
  non_canon: true
