choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444: locks: [''Giữ câu
    nhận định mở đầu nối tiếp niềm tin chiến thắng ở cuối B14: `Cuối cùng thì tất
    cả cũng nằm trong tầm tay.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000445: locks: [''Giữ cụm
    chuyển ý bỏ lửng với dấu ba chấm cuối đoạn: `Đó là lý do vì sao…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000446: locks: [''Giữ dấu
    ba chấm mở đầu, đại từ `ông ta` quy chiếu Tướng de Lugo, và cảm giác tiếng còi
    báo động vang lên chói tai đến thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000447: locks: [''Giữ hiệu
    ứng nói lắp mở đầu, thuật ngữ `tín hiệu cầu cứu khẩn cấp` và định danh đơn vị
    `Đại đội Pháp sư 228`: `“T-tín hiệu cầu cứu khẩn cấp từ Đại đội Pháp sư 228!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000448: locks: [''Giữ chính
    xác câu hỏi in nghiêng mở đầu bằng `*...*` theo `DEC-P01-002` (`*Chuyện gì đang
    xảy ra thế này?*`), chức danh `nhân viên điện đài`, đại từ `anh ta`, và phép so
    sánh vẻ mặt trình báo chẳng khác nào một tiếng kêu cứu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000449: locks: [''Giữ định
    danh `Tiểu đoàn Pháp sư 12`, nhiệm vụ `yểm trợ trực tiếp` cho `cánh phải`, yêu
    cầu chi viện khẩn cấp và thông tin quân địch đã gần như chọc thủng phòng tuyến.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000450: locks: [''Giữ chi
    tiết hàng loạt báo cáo nguy cấp từ `cánh phải` được bổ sung lên bản đồ bằng các
    ký hiệu diễn biến trận đánh, phản ứng mọi người liếc nhìn cục diện mới bằng khóe
    mắt rồi chìm vào im lặng, và ý nghĩa các đơn vị pháp sư bên `cánh phải` chỉ đang
    cầm cự hết sức chật vật.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000451: locks: [''Giữ đại
    từ `bọn họ` / `Họ` và tâm trạng chần chừ vì khó mà tin nổi chuyện đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000452: locks: [''Giữ cảnh
    báo khẩn cấp từ `Bộ chỉ huy Sư đoàn 7` và thông tin một đơn vị pháp sư địch dường
    như có quy mô cỡ `trung đoàn` đang tấn công `cánh phải`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000453: locks: [''Giữ câu
    hỏi thảng thốt dạng phủ định–nghi vấn dùng đại từ `chúng ta` – `chúng`: `“Cái
    gì?! Không phải chúng ta đã bao vây chúng rồi sao?!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000454: locks: [''Giữ danh
    xưng `sở chỉ huy sư đoàn` và `Các sĩ quan tham mưu`, giả định trái thực tế `hẳn
    sẽ thích một thông báo bình tĩnh hơn`, và kết cục những hy vọng ấy đã tan thành
    mây khói.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000455: locks: [''Giữ chi
    tiết bản báo cáo bằng giọng khản đặc từ một sĩ quan tiền tuyến cấp cao về việc
    `họ` đang bị một `trung đoàn pháp sư địch` tấn công, tên riêng `de Lugo`, và câu
    cảm thán cuối đoạn đặt trong `*...*` theo `DEC-P01-002` (`*Chuyện này chẳng vui
    chút nào đâu!*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000456: locks: [''Giữ đại
    từ `Ông ta` (và `mình` phản thân) quy chiếu de Lugo, `chúng` quy chiếu quân Đế
    quốc, và quan hệ nhân quả vì kế hoạch nhắm vào hai bên sườn quân địch nên binh
    lính được huấn luyện chuyên biệt để `đối phó với các đợt tấn công trên bộ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000457: locks: [''Giữ đại
    từ `ông ta` và phân công nhiệm vụ chặn đứng đám pháp sư địch phiền toái thuộc
    về lực lượng pháp sư phe ông ta đang tập trung ở `trung tâm`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000458: locks: [''Giữ chi
    tiết bố trí dự phòng ở mỗi cánh có đủ pháp sư để chặn đứng lực lượng tương đương
    một `tiểu đoàn` nhằm phòng bất trắc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000459: locks: [''Giữ giả
    định bỏ lửng với dấu ba chấm `Nhưng nếu đối phương có cả một trung đoàn…` và suy
    luận có thể đồng nghĩa với việc hầu như chẳng có `pháp sư Đế quốc` nào trên chiến
    trường này bị bao vây cả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000460: locks: [''Giữ dấu
    gạch ngang ngắt lời cảm thán mở đầu và câu hỏi phẫn nộ: `“Thật hết sức ngu xuẩn—!
    Vậy chứ các pháp sư ở trung tâm đang đánh nhau với ai?!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000461: locks: [''Giữ chính
    xác câu độc thoại nội tâm mở đầu đặt trong `*...*` theo `DEC-P01-002` (`*Nhưng
    chuyện đó không khớp với tin tình báo chúng ta có!*`), hành động `De Lugo` chìm
    vào im lặng nhìn tấm bản đồ đối chiếu ước tính của `họ` về binh lực địch với quy
    mô thực tế hiện tại của các đơn vị pháp sư `bên chúng`, và nhận định lẽ ra không
    thể có sự chênh lệch nghiêm trọng đến thế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000462: locks: [''Giữ đại
    từ `ông ta` và `họ`, sự thật là lực lượng pháp sư chủ lực của ông ta đang giao
    chiến với thứ mà họ tin là `lực lượng pháp sư chủ lực của Đế quốc`, và báo cáo
    vừa nhận được rằng nhờ `ưu thế về quân số` nên họ vẫn đang giữ thế thượng phong.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000463: locks: [''Giữ suy
    luận xét theo báo cáo và tin tình báo thu thập từ trước thì quân địch không đời
    nào còn dư pháp sư, cùng liên từ nhấn mạnh `*Nhưng*` ở đầu câu thứ hai theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000464: locks: [''Giữ chính
    xác hai phần nhấn mạnh riêng biệt bằng `*...*` theo `DEC-P01-002`: từ mở đầu `*Nếu*`
    ở câu giả định thứ nhất, câu tự phủ định lửng ở giữa không in nghiêng, và toàn
    bộ câu hỏi nội tâm cuối đoạn (`*Chẳng lẽ chúng ta chỉ có ưu thế về quân số là
    vì quân địch đã rút một trung đoàn pháp sư ra khỏi lực lượng của chúng sao?*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000465: locks: [''Giữ toàn
    bộ đoạn đặt trong `*...*` theo `DEC-P01-002`, hệ đại từ nội tâm `chúng` – `chúng
    ta` – `mình` – `bên ta`, quy mô tương đương cả một `lữ đoàn`, và nhận định khả
    năng `mạng lưới tình báo` bỏ sót lớn hơn không nhưng vẫn tự tin vào việc nắm bắt
    động tĩnh quân địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000466: locks: [''Giữ đại
    từ `ông ta`, định danh `Lục quân Đế quốc` cùng lắm chỉ có một `trung đoàn`, và
    nhận định lẽ ra không thể có chuyện `quân dự bị` bỗng dưng chui ra từ xó xỉnh
    nào như thế này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000467: locks: [''Giữ mệnh
    lệnh ngắn gọn: `“Xác nhận xem có thực sự là một trung đoàn không!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000468: locks: [''Giữ đại
    từ `ông ta` và chi tiết phần điềm tĩnh trong tâm trí vẫn nghi ngờ liệu đó có thực
    sự là một `trung đoàn` hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000469: locks: [''Giữ phân
    biệt đại từ `chúng` (quân địch) và `họ` (quân Cộng hòa) trong giả định địch dùng
    `mưu mẹo nghi binh` để đánh lừa họ tin rằng toán quân ấy có quy mô cỡ `trung đoàn`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000470: locks: [''Giữ giả
    định sự hỗn loạn gây hiểu lầm, câu hỏi ngược về tất cả các báo cáo từ các đơn
    vị của `ông ta`, và sự đối lập giữa việc hiểu rõ ý nghĩa của chúng với việc có
    chấp nhận nổi sự thật đó hay không.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000471: locks: [''Giữ lời
    báo cáo khẩn cấp: `“Thưa Tướng de Lugo, chúng ta đã mất hai đại đội rồi!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000472: locks: [''Giữ câu
    chuyển ý ngắn có dấu ba chấm: `Và quan trọng nhất là…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000473: locks: [''Giữ hình
    ảnh vẻ sững sờ trên gương mặt `các sĩ quan tham mưu` đã nói lên tất cả và việc
    `De Lugo` hiểu rất rõ sự bàng hoàng không dám tin cùng nỗi hoang mang của `họ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000474: locks: [''Giữ suy
    luận việc hai `đại đội` bị hạ gục đồng nghĩa ngoài kia có một lực lượng địch đủ
    lớn để áp đảo `họ` chỉ trong chớp mắt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000475: locks: [''Giữ giả
    định trái thực tế nếu `họ` đã cầm cự kháng cự rồi mới bị đánh bại thì mọi chuyện
    sẽ khác, và lập luận nếu địch chỉ mạnh hơn ở mức thông thường thì tin nhắn đầu
    tiên khi chạm trán sẽ không bao giờ là `tín hiệu cầu cứu khẩn cấp`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000476: locks: [''Giữ câu
    nhận định chiến thuật về `Tiểu đoàn 12`: `“Nếu Tiểu đoàn 12 sắp bị chọc thủng,
    lực lượng địch chí ít cũng phải có quy mô gấp đôi họ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000477: locks: [''Giữ chi
    tiết bản báo cáo như tiếng hét thất thanh từ tiểu đoàn làm nhiệm vụ `yểm trợ trực
    tiếp`, hệ quả `thế phòng ngự trì hoãn` dọc toàn bộ `cánh phải` không vận hành
    như dự kiến, và câu hỏi nội tâm cuối đoạn đặt trong `*...*` theo `DEC-P01-002`
    (`*Ý các người là có một đơn vị pháp sư địch hùng mạnh đến mức chúng ta không
    thể chặn nổi ngay cả khi nhận được sự yểm trợ từ sư đoàn cánh phải sao?*`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000478: locks: [''Giữ tiếng
    gằn mở đầu, mệnh lệnh điều các pháp sư từ `trung tâm` sang chi viện và cảnh báo
    nguy cơ `chúng` phá vỡ `vòng vây`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000479: locks: [''Giữ chi
    tiết đầu óc `de Lugo` đang chìm trong âu lo trước biến cố ngoài sức tưởng tượng
    nhưng tiếng quát của `Đại tá Vianto` đã giúp nó hoạt động trở lại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000480: locks: [''Giữ chi
    tiết trong số tất cả `các sĩ quan tham mưu` đang chết lặng trong thoáng chốc,
    `Vianto` là người lấy lại tinh thần nhanh nhất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000481: locks: [''Giữ chi
    tiết dù chậm nhịp hơn, những người khác cũng bắt đầu hiểu ra việc cần phải làm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000482: locks: [''Giữ lập
    luận khép lại lô: nếu `các khẩu đội pháo` bên `cánh phải` bị đánh trúng thì sẽ
    chẳng còn cách nào ngăn quân địch rút đi được nữa, vì vậy `cánh phải` cần có quân
    tiếp viện.'']'
  non_canon: true
