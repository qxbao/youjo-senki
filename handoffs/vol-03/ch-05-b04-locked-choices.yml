choices:
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104: locks: [''Giữ câu
    hỏi in nghiêng toàn đoạn theo DEC-P01-002: `*Tại sao họ lại muốn tiếp tục cuộc
    chiến?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000105: locks: [''Giữ chính
    xác phạm vi chữ nghiêng cho câu hỏi tu từ phủ định `*Chẳng phải chính bọn họ mới
    là kẻ đã khơi mào cuộc chiến hay sao?*` theo DEC-P01-002 và hai câu khẳng định–phủ
    định kế tiếp `Đó chẳng phải chuyện nhỏ nhặt gì. Không, đó là sự thật hiển nhiên
    ai cũng thấy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000106: locks: [''Giữ danh
    xưng `Đế quốc`, cụm `nền tảng tâm lý vốn đã được định hình ngay từ đầu` và cấu
    trúc đồng vị `đám tàn quân kia, tức kẻ địch, đang hy vọng tiếp tục cuộc chiến`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000107: locks: [''Giữ quan
    hệ hệ quả ngắn gọn: `Từ đó mới dẫn tới hy vọng của chính họ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000108: locks: [''Giữ toàn
    bộ câu in nghiêng theo DEC-P01-002 và danh xưng `Reich`: `*Chúng ta sẽ giáng búa
    sắt xuống đầu những kẻ dám làm hại Reich.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000109: locks: [''Giữ toàn
    bộ câu cầu chúc/nguyện ước in nghiêng theo DEC-P01-002: `*Cầu cho kẻ địch tà ác
    bị xóa sổ khỏi thế gian này.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000110: locks: [''Giữ khẩu
    hiệu trong ngoặc kép `“Hãy trừng phạt kẻ địch!”` và phủ định tuyệt đối `Chẳng
    một ai nghi ngờ niềm tin vào chính nghĩa của đất nước mình cũng như vào công lý.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000111: locks: [''Giữ câu
    chuyển ý phủ định: `Đó là lý do vì sao họ không thể nào hiểu nổi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000112: locks: [''Giữ danh
    xưng `Đế quốc`, cấu trúc giải thích sau dấu gạch ngang dài `—nỗi sợ hãi căn nguyên
    rằng một nhà nước hùng mạnh vô song, một bá quyền không đối thủ, sẽ được xác lập
    ngay tại trung tâm lục địa.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000113: locks: [''Giữ nguyên
    nhân `do cách thức lập quốc của mình` và cụm thuật ngữ `nhiều vùng xung đột`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000114: locks: [''Giữ thế
    đối lập quan điểm sau dấu hai chấm: `Đối với Đế quốc, những nơi đó hiển nhiên
    là lãnh thổ của Đế quốc, trong khi đối với các nước láng giềng xung quanh, vùng
    đất ấy đã bị cướp đoạt khỏi tay họ.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000115: locks: [''Giữ các
    danh xưng `Cộng hòa`, `Đế quốc`, cặp thuật ngữ quân sự đối xứng `chiến lược ngoại
    tuyến` – `chiến lược nội tuyến` và nhận định cuối đoạn `vui mừng khôn xiết khi
    loại bỏ được mọi mối đe dọa đối với nền an ninh của mình`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000116: locks: [''Giữ hai
    cấu trúc phủ định `một mối đe dọa nghiêm trọng không thể làm ngơ đối với an ninh
    của họ` và `mải mê phô trương sự sắc bén của thanh kiếm trong tay đến mức chẳng
    hề nhận ra nó đã khiến tất cả mọi người khiếp sợ đến nhường nào`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000117: locks: [''Giữ cụm
    `chủ nghĩa dân tộc và sự ngờ vực lẫn nhau` cùng hình ảnh ẩn dụ `thổi bùng ngọn
    lửa ấy lên`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000118: locks: [''Giữ nhịp
    khẳng định `Tất nhiên, ai nấy đều mong muốn hòa bình. Phải, một cách vô cùng tha
    thiết.`, mục đích `vì hòa bình và để bảo vệ tất cả mọi người` và câu kết `Các
    quốc gia khác với những toan tính riêng cũng góp phần tiếp sức.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000119: locks: [''Giữ cấu
    trúc tương phản phủ định–khẳng định: `Theo một cách đầy trớ trêu như thế, ước
    nguyện hòa bình đã không làm cho cuộc chiến dịu đi mà chỉ khiến nó leo thang thêm.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000120: locks: [''Giữ dòng
    tiêu đề chuyển cảnh viết hoa toàn bộ: `CÙNG NGÀY HÔM ĐÓ, HỢP CHÚNG QUỐC`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000121: locks: [''Giữ các
    chức danh/địa điểm `văn phòng tuyển quân`, `vị thiếu tá được giới thiệu vừa là
    chủ nhân căn phòng vừa là trưởng bộ phận phụ trách nghĩa vụ quân sự` và chi tiết
    `lên tiếng một cách thẳng thắn khi có phần lúng túng mời Mary ngồi xuống`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000122: locks: [''Giữ cách
    xưng hô công vụ `Cô Mary Sue`, `chúng tôi` / `tôi` – `cô`, quy chiếu trần thuật
    `ông` – `cô bé`, cùng các thuật ngữ `Hợp chúng quốc`, `song tịch`, `luật quốc
    tịch ở Liên minh Hiệp ước`, `Lục quân Hợp chúng quốc` và cảnh báo `dù tuổi đời
    còn trẻ, rất có khả năng cô sẽ cần phải đưa ra sự lựa chọn liên quan đến quốc
    tịch của mình`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000123: locks: [''Giữ cấu
    trúc phủ định–tương phản `không có ý hối thúc cô bé đưa ra quyết định khó khăn
    ấy mà vẫn tôn trọng nguyện vọng của cô bé` và nhận xét `Những người dân tốt bụng
    của Hợp chúng quốc lúc nào cũng chu đáo như vậy.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000124: locks: [''Giữ cụm
    `lũ trẻ tị nạn từ Liên minh Hiệp ước` và chính xác phạm vi chữ nghiêng bao gồm
    cả dấu ngoặc kép theo DEC-P01-002: `*“Chúng tôi rất mừng vì cháu muốn giúp sức,
    nhưng hiện giờ cháu chưa cần phải bận tâm đến chuyện đó đâu.”*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000125: locks: [''Giữ hai
    câu hỏi tu từ phủ định liên tiếp của vị thiếu tá với đại từ `cô`: `“Chẳng phải
    bà của cô, mẹ của cô, và… phải, ngay cả người cha đã khuất của cô cũng đều muốn
    cô được bình an vô sự ở đây, tránh xa vòng hiểm nguy hay sao? Chẳng phải tất cả
    mọi người đều đang lo lắng cho cô sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000126: locks: [''Giữ giọng
    đáp lễ phép của Mary (`Vâng`, xưng `cháu`, kết câu `ạ`) và dấu gạch ngang dài:
    `“Vâng, nhưng chính vì vậy mà cháu mới muốn làm những gì mình có thể—để bảo vệ
    nền hòa bình này. Cháu nghĩ mình có thể giúp sức ạ.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000127: locks: [''Giữ quy
    chiếu trần thuật `cô bé`, `vị thiếu tá`, câu thoại trực tiếp `“Cháu nghĩ ắt hẳn
    phải có việc gì đó mà cháu làm được.”` và mục đích `vì Hợp chúng quốc và vì hòa
    bình`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000128: locks: [''Giữ đại
    từ `cô` trong lời vị thiếu tá, các danh xưng `Lục quân Hợp chúng quốc`, `Khối
    Thịnh vượng chung`, `Hợp chúng quốc` và ý khuyến nghị `vẫn còn rất nhiều công
    việc hữu ích và cần thiết khác mà những người trẻ tuổi có thể đảm nhận ngay trong
    lòng Hợp chúng quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter005_002.xhtml/p000129: locks: [''Giữ định
    danh `Lực lượng Viễn chinh Tình nguyện Hợp chúng quốc`, `Khối Thịnh vượng chung`,
    cấu trúc phủ định kèm dấu ngoặc kép `về nguyên tắc, đội quân này sẽ không can
    dự vào các hoạt động tác chiến mà chỉ “đóng quân” tại Khối Thịnh vượng chung`
    và cụm pháp lý `nhằm bảo đảm quyền tự do đi lại và các quyền của thường dân theo
    luật chiến tranh`.'']'
  non_canon: true
