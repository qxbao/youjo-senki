choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418: locks: [''Giữ câu
    hỏi nghi vấn với động từ nhấn mạnh `*duy trì*` theo `DEC-P01-002`, câu trả lời
    lửng `Chưa chắc.`, giả định việc `họ` chọc thủng một khe hở trên `vòng vây` nhưng
    chưa biết có giữ cho nó mở được không, và phép so sánh đặt niềm tin vào kế hoạch
    đó chẳng khác nào đặt niềm tin vào tên khốn `Being X`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000419: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001` cho nhận định càng nghĩ càng thấy nguy hiểm, và giả
    định nếu `họ` đục thủng được lỗ hổng thì quân đội chắc chắn sẽ ra lệnh tử thủ
    tại chỗ để giữ lỗ hổng đó mở thêm dù chỉ một khoảnh khắc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000420: locks: [''Giữ chính
    xác câu hỏi độc thoại nội tâm in nghiêng mở đầu bằng `*...*` và đại từ `mình`
    theo `DEC-P01-001` & `DEC-P01-002` (`*Hay là mình cứ thế bỏ chạy luôn nhỉ?*`),
    chuyển sang đại từ trần thuật `nó` ở các câu sau cùng thuật ngữ `tòa án quân sự`,
    tội danh `Bỏ chạy trước quân địch` cộng thêm bỏ mặc quân bạn, và nhận định sẽ
    chẳng ai bảo vệ `nó` như hồi làm hỏng chuyện ngoài khơi bờ biển `Norden`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000421: locks: [''Giữ đại
    từ `nó` theo `DEC-P01-001`, đầy đủ ba kết cục giả định (bị giải ra trước một `đội
    xử bắn âm thầm`, bị bắn sau khi áp giải về nước và đưa ra `tòa án quân sự`, hoặc
    nếu may mắn hơn thì người đưa tin mang tới một khẩu súng lục và bảo `nó` tự sát),
    cùng câu kết ngắn `Chẳng có mấy lựa chọn.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000422: locks: [''Giữ nhận
    định chẳng có mấy cách biện minh cho hành vi `bỏ chạy trước quân địch`, sự đối
    lập giữa việc cố lấp liếm với kỳ vọng người lính phải chiến đấu dũng cảm, và phép
    ví von kẻ đánh bài chuồn khi quân bạn gặp nguy khốn với vị `Đô đốc Byng` xui xẻo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000423: locks: [''Giữ định
    danh `Đô đốc Byng`, cụm trích dẫn trong ngoặc kép `“không nỗ lực hết sức mình”`,
    và việc `Tanya` tận mắt chứng kiến những sĩ quan ngoài chiến trường thà lao vào
    một trận đánh liều lĩnh còn hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000424: locks: [''Giữ đại
    từ `nó` (và phản thân `chính mình`) theo `DEC-P01-001`, giả định trái thực tế
    nếu có mệnh lệnh chính thức cho phép rời đi, lý do theo lẽ thường quân sự trước
    cục diện hiện tại là phải giải cứu `lực lượng chủ lực` nên chắc chắn `Tướng von
    Romel` sẽ ban mệnh lệnh như vậy, và câu kết không thể phớt lờ thực tế đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000425: locks: [''Giữ đại
    từ tự quy chiếu nội tâm `mình` theo `DEC-P01-001` trong cả hai câu quyết định
    chiến đấu dưới những điều kiện sẵn có và tìm đường thoát ở phía trước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000426: locks: [''Giữ đại
    từ `mình` – `họ`, thứ tự ưu tiên sống sót và tự bảo toàn bản thân, yêu cầu không
    để mình trông như đã bỏ rơi `quân bạn`, mong muốn giúp `họ` chịu càng ít thiệt
    hại càng tốt kèm câu giới hạn `Dù vậy, cũng chỉ ở mức càng ít càng tốt mà thôi.`,
    và lập luận nếu chứng minh được `họ` chịu ít thiệt hại hơn nhờ `mình` thì thực
    tế góp phần cứu `họ` sẽ làm giảm bớt chỉ trích nhắm vào sự thiếu nhiệt huyết của
    `mình`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000427: locks: [''Giữ câu
    hỏi mở đầu với đại từ `mình` và `quân ta` về bài toán ba mục tiêu (giữ vững danh
    tiếng, giảm thiểu thiệt hại cho quân ta, thoát thân giữ mạng chờ ngày khác), thuật
    ngữ `vừa đánh vừa rút lui`, và nhận định ngay cả khi sống sót thì người ta cũng
    chẳng thực sự bảo vệ được thứ lẽ ra phải bảo vệ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000428: locks: [''Giữ nhận
    định yêu cầu `lực lượng chủ lực` đang bị bao vây trùng điệp rút lui với thương
    vong tối thiểu là quá mạo hiểm, tiền lệ lịch sử đáp ứng cả hai điều kiện là `Trận
    Sekigahara` giữa `Đông quân và Tây quân`, và chuỗi câu hỏi tu từ về phản bội,
    âm mưu, do dự.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000429: locks: [''Giữ mô
    tả thảm cảnh của đội quân bại trận bị tịch thu lãnh thổ hoặc bị nuốt chửng mức
    `*kokudaka*` (in nghiêng bằng `*...*` theo `DEC-P01-002`) ít ỏi tính theo sản
    lượng lúa gạo, chi tiết nhiều người không rời nổi chiến trường, và cấu trúc `không
    chỉ... mà còn...` cùng chủ ngữ chỉ đám người gần như điên rồ vừa đưa được chủ
    tướng thoát ra vừa phô trương `khí thế thượng võ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000430: locks: [''Giữ câu
    hỏi ngắn và biệt danh lịch sử: `Tên của họ ư? Oni-Shimazu.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000431: locks: [''Giữ chính
    xác toàn bộ đoạn in nghiêng bằng `*...*` theo `DEC-P01-002` và dấu ba chấm mở
    đầu: `*…Gia tộc Shimazu ư?*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000432: locks: [''Giữ đại
    từ `chúng ta` và câu hỏi khái quát hóa logic đột phá: tông thẳng qua quân địch
    rồi rời đi thì không phải là đang `bỏ chạy trước quân địch`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000433: locks: [''Giữ chính
    xác cụm mở đầu in nghiêng `*Không, nhưng mà…*` theo `DEC-P01-002`, định danh `Tanya`
    cùng đại từ `nó` theo `DEC-P01-001`, và lời than vãn trong thâm tâm rằng việc
    đột phá xuyên qua quân địch rồi quay trở về là một nhiệm vụ bất khả thi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000434: locks: [''Giữ đại
    từ nội tâm `mình` theo `DEC-P01-001`, cụm liên hệ lịch sử giữa hai dấu gạch ngang
    `—cứ nghĩ tới những đợt xung phong của Kellerman mà xem—`, sự hoài nghi liệu những
    kẻ đó có còn tỉnh táo không, và lời tự nhận là một người biết điều giữa thời đại
    khắc nghiệt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000435: locks: [''Giữ câu
    bỏ lửng với đại từ `mình` theo `DEC-P01-001`: `Nhưng nếu mình buộc phải làm vậy…`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000436: locks: [''Giữ câu
    chốt hạ quyết tâm thực dụng của Tanya với đại từ `mình` theo `DEC-P01-001`: `Nếu
    mình không còn lựa chọn nào khác, thì đó chính là phận sự của mình.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000437: locks: [''Giữ dòng
    tiêu đề chuyển cảnh viết hoa toàn bộ: `SÁNG SỚM NGÀY 13 THÁNG 10, NĂM THỐNG NHẤT
    1925, DOANH TRẠI LỤC QUÂN CỘNG HÒA`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000438: locks: [''Giữ dấu
    ba chấm mở đầu và câu thoại nhận định chiến thắng dùng đại từ `chúng ta`: `“…Xem
    ra chúng ta đã thắng rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000439: locks: [''Giữ câu
    đáp lễ của thuộc cấp: `“Vâng, thưa Tướng quân.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000440: locks: [''Giữ đại
    từ `họ`, màn báo thù của `Cộng hòa` nhắm vào `Đế quốc`, và niềm mơ ước của hầu
    hết `binh lính Cộng hòa` kể từ khi `mặt trận sông Rhine` sụp đổ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000441: locks: [''Giữ đại
    từ `Ông ta` quy chiếu Tướng de Lugo, `chúng` quy chiếu quân Đế quốc, `Họ` quy
    chiếu phía Cộng hòa, thuật ngữ `cuộc tiến quân phân tán` đối lập với `lực lượng
    tập trung`, việc chuẩn bị giáng trả lại Đế quốc đúng những gì từng xảy ra ở `mặt
    trận sông Rhine`, và cấu trúc `không chỉ bộ tham mưu mà cả binh lính`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000442: locks: [''Giữ định
    danh `Tướng de Lugo`, đại từ `ông ta` (và `mình` phản thân), ý nghĩa bước đầu
    tiên trong `cuộc phản công` được chuẩn bị bằng mọi cách có thể, cùng cảm giác
    nhẹ nhõm khi thấy nỗ lực bấy lâu đang phát huy tác dụng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000443: locks: [''Giữ đại
    từ `họ`, điều kiện đánh bại `Lục quân Đế quốc` tại đây để củng cố thế phòng thủ
    trên `lục địa phía nam`, và mục tiêu tái chiếm `Turus` để biến nơi đó thành bàn
    đạp vững chắc cho `cuộc phản công trên lục địa`.'']'
  non_canon: true
