source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: f5dd41687c039c71de73555f7849c2997f0567e0ec10dbaf3b50e094b4651529
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285: locks: [''Giữ đại
    từ “Chúng” quy chiếu lực lượng Đế quốc từ cuối lô trước, định danh “Khối Thịnh
    vượng chung”, “Đế quốc”, “Cộng hòa”, đại từ “ông ta” và diễn biến các nhân sự
    quân sự bàng hoàng tìm đến bàn bạc thẳng thắn khi thấy Đế quốc khéo léo đẩy lùi
    cả đợt tiến công chẳng khác nào đánh lén của Cộng hòa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000286: locks: [''Giữ câu
    nhận định chuyển ý ngắn gọn: “Cho đến thời điểm đó thì mọi chuyện vẫn còn ổn.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000287: locks: [''Giữ câu
    chất vấn nội tâm in nghiêng `*Nhưng các người mất trí rồi sao?*` theo DEC-P01-002,
    đại từ “ông ta”, hành động giận dữ dụi mạnh điếu xì gà vào gạt tàn, thầm rủa đám
    quý ông đầu gỗ cùng niềm hân hoan nực cười đang nhen nhóm và nỗi tuyệt vọng trước
    những gương mặt giãn ra thành nụ cười vui vẻ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000288: locks: [''Giữ định
    danh “Lục quân Đế quốc”, địa danh “Vùng Đất Thấp”, đại từ “ông ta” và nguyên nhân
    của sự lạc quan: quân Đế quốc rút lui để tái tổ chức chiến tuyến khiến bạn bè
    ông ta tưởng kết cục cuộc chiến đã rõ ràng, thậm chí có những kẻ ngốc chỉ bận
    tâm tới giới thượng lưu thời thượng và mong chiến tranh sớm kết thúc để nối lại
    quan hệ với bạn cũ ở Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000289: locks: [''Giữ đại
    từ “ông ta”, định danh “Đế quốc” và sự bàng hoàng khi ngay cả những nhà phê bình
    và kẻ hoài nghi sắc sảo nhất cũng đặt dấu hỏi trên báo chí về khả năng tiếp tục
    chiến đấu của Đế quốc, tuyên bố lực lượng vũ trang của nước này khá mong manh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000290: locks: [''Giữ đại
    từ “ông ta” và thái độ ngán ngẩm trước những tiếng thở phào nhẹ nhõm của tất cả
    những người khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000291: locks: [''Giữ định
    danh “Khối Thịnh vượng chung”, “Whitehall”, thuật ngữ “cán cân quyền lực”, đại
    từ “ông ta” và sự tương phản giữa nỗi khinh miệt của ông ta với những tiếng thở
    phào vang vọng khắp các bức tường Whitehall.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000292: locks: [''Giữ định
    danh “Khối Thịnh vượng chung”, “Đế quốc”, thuật ngữ “cân bằng quyền lực”, cặp
    đối lập “quốc gia hàng hải” – “cường quốc lục địa” và việc cảnh các quý ông quý
    tộc ngồi đánh bài bàn chuyện chiến tranh sắp kết thúc là phản ứng dội lại sau
    cơn ác mộng phải đơn độc đối mặt với một Đế quốc bá quyền thôn tính toàn bộ lục
    địa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000293: locks: [''Giữ điểm
    nhấn từ vựng “đã từng” trong ngoặc kép để chỉ thì quá khứ và cảnh mọi người cố
    tự kiềm chế nhưng vẫn toe toét cười nói, bật ra tiếng cười vang rộn trước viễn
    cảnh tương lai không còn ác mộng an ninh quốc gia.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000294: locks: [''Giữ định
    danh “Đế quốc”, đại từ “ông ta”, thuật ngữ “theo chủ nghĩa Machiavelli” và đúng
    hai cụm nhấn mạnh chữ nghiêng theo DEC-P01-002: lời trách cứ vòng vo `*“Ồ, thôi
    nào, chẳng lẽ ngài lại thực sự muốn tranh luận về một vấn đề đã được giải quyết
    xong xuôi rồi sao?”*` cùng câu cảm thán `*Đúng là một lũ ngốc vui vẻ!*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000295: locks: [''Giữ đại
    từ “ông ta” và tâm trạng sốt ruột, sôi sục bực bội khi buộc phải tham dự một cuộc
    họp nội các khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000296: locks: [''Giữ lời
    mở đầu lịch thiệp của vị thủ tướng: “Chà, thưa các quý ông, xem ra người bạn Cộng
    hòa của chúng ta sẽ giải quyết êm xuôi việc này giúp chúng ta rồi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000297: locks: [''Giữ danh
    xưng “vị thủ tướng”, đại từ “ông” và phép ẩn dụ trang phục “khoác trên mình nỗi
    khốn khổ đặt may riêng từ sự dằn vặt và thống khổ” đối lập với cảnh ngả lưng vào
    ghế phì phèo xì gà hôm nay.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000298: locks: [''Giữ đại
    từ “ông”, danh xưng “các thành viên nội các” và các chi tiết quan sát ngoại hình:
    sự tiết chế trên nét mặt dù không giấu vẻ mãn nguyện, gương mặt thư thái vui vẻ,
    bộ âu phục phẳng phiu khác thường và đôi mắt không còn quầng thâm chứng tỏ đã
    ngủ ngon.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000299: locks: [''Giữ sự
    phân biệt chủ thể giữa “người đàn ông này / Ông ta” với “vị thủ tướng này / ông”,
    cùng lời than thở rằng bất kể xử lý đối nội ra sao thì năng lực chính trị về đối
    ngoại của vị thủ tướng là không thể trông cậy được.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000300: locks: [''Giữ cụm
    “người đàn ông này”, thuật ngữ “Thượng đế” và ý thức tự nhận trách nhiệm bảo vệ
    đất nước mà Thượng đế đã chọn lựa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000301: locks: [''Giữ cụm
    nhấn mạnh chữ nghiêng `*Bất kể thế nào đi nữa.*` theo DEC-P01-002, đại từ “Ông
    ta” và ánh nhìn u ám, bàng hoàng không sao tin nổi trước những gương mặt tự mãn
    của các thành viên nội các.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000302: locks: [''Giữ định
    danh “Cộng hòa”, đại từ “chúng ta” / “tôi” và lời trò chuyện thảnh thơi về việc
    sớm được dành ngày cuối tuần hội ngộ người quen cũ tại các quán cà phê ở Cộng
    hòa cùng nỗi nhớ rượu vang.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000303: locks: [''Giữ thuật
    ngữ ẩm thực “bánh galette” và lời hưởng ứng về hương vị tinh tế khó lòng nhịn
    được của món bánh đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000304: locks: [''Giữ danh
    xưng “các bộ trưởng nội các”, “vị bộ trưởng lớn tuổi ngồi đối diện Thủ tướng”
    và sự đối lập giữa cảm nhận chung rằng ngày trở lại cuộc sống bình thường đã cận
    kề với “duy nhất một người đàn ông” không sao hiểu nổi sự lạc quan đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000305: locks: [''Giữ định
    danh “Khối Thịnh vượng chung”, “Cộng hòa”, “bờ biển Cộng hòa”, thuật ngữ “bánh
    galette” và mạch suy diễn rằng cuộc chiến phiền phức sắp kết thúc, phà sẽ chạy
    lại nên họ có thể thảnh thơi bàn chuyện nhấm nháp rượu vang kèm bánh galette.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000306: locks: [''Giữ nhận
    định về niềm hạnh phúc ngọt ngào khi được giải thoát khỏi nỗi âu lo của các bộ
    trưởng nội các, giúp họ có đủ sự thư thái trong lòng để cười gượng trước nền văn
    hóa ẩm thực nghèo nàn của nước mình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000307: locks: [''Giữ định
    danh “Lục quân Đế quốc”, cụm “ngoài người đàn ông duy nhất này ra” và thực tế
    rằng các bộ trưởng không tuyên bố chiến tranh đã thực sự kết thúc hay quên rằng
    Lục quân Đế quốc vẫn tồn tại, chưa bị xóa sổ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000308: locks: [''Giữ thuật
    ngữ “nền tảng công nghiệp” và lời bình phẩm chắc mẩm của các vị bộ trưởng rằng
    một khi mất đi nền tảng công nghiệp cần thiết để duy trì chiến tranh thì số phận
    Đế quốc coi như đã định đoạt, binh lính có mạnh đến đâu cũng không thay đổi được
    kết cục.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000309: locks: [''Giữ lời
    kết của vị thủ tướng hướng vào thời hậu chiến: đề xuất kế hoạch can thiệp và cảnh
    báo việc khôi phục “cán cân quyền lực” sẽ đi kèm với cả một núi thách thức.'']'
  non_canon: true
