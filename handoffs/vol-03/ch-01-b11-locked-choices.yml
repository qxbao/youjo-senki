task_id: vol-03-ch-01-b11
baseline_sha256: d7f49ea9b590c25a1cd6fb4805003ea5129be917e2a0b2e5e40cf0037e29b24d
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 546858444b8ce5ed555a485f4f4fc8d3189caf16cf2606b217300b86e7bed9df
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055: locks: [''Giữ chủ
    thể trần thuật “Tanya” và đại từ “Nó” / phản thân “mình” theo DEC-P01-001, cùng
    dấu nhấn mạnh chữ nghiêng bao trọn hai câu độc thoại nội tâm ở giữa đoạn (`*Nhiệm
    vụ đã. Mình phải vượt qua chuyện này trước.*`) theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000056: locks: [''Giữ đại
    từ trần thuật “nó” / “Tanya” và tự quy chiếu “mình” theo DEC-P01-001, dấu nhấn
    mạnh chữ nghiêng tại thuật ngữ `*Rotten*` và câu hỏi nội tâm `*Vậy ai đã hạ cánh
    quanh đây nhỉ?*` theo DEC-P01-002, định danh “Thiếu úy Serebryakov”, chức danh
    “sĩ quan phó quan”, cụm “người đồng đội gan lì” và chi tiết sát cánh bên nhau
    từ thời ở Rhine.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000057: locks: [''Giữ nguyên
    báo cáo vô tuyến: “09 gọi 01. Đã hoàn tất hạ cánh. Không có tổn thất.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000058: locks: [''Giữ nguyên
    khẩu lệnh vô tuyến của 01: “01, nghe rõ. Báo cáo kết quả va chạm của các thiết
    bị gia tốc bổ sung.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000059: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng ở câu độc thoại mở đầu `*Đây là một tín hiệu tốt.*` theo
    DEC-P01-002, định danh “Trung úy Weiss”, đại từ “anh”, thuật ngữ “đại đội” và
    nhận định việc tái tổ chức diễn ra suôn sẻ nhất có thể nhờ trình độ huấn luyện
    bài bản.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000060: locks: [''Giữ ẩn
    dụ “Mấy chiếc vòng gõ cửa” trúng hồng tâm gần hết và mục tiêu duy nhất đánh trượt
    là “kho đạn”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000061: locks: [''Giữ câu
    nhận định chuyển ý: “Nhưng mọi chuyện cũng chỉ có thể suôn sẻ đến thế mà thôi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000062: locks: [''Giữ chủ
    thể “Tanya” và đại từ “nó” theo DEC-P01-001, quan hệ nhân quả việc “đầu đạn” vốn
    phải gây hỗn loạn cho an ninh tại “sở chỉ huy địch” sau khi kích nổ “kho đạn”
    đã không hoàn thành nhiệm vụ, chi tiết không quở trách những tiếng tắc lưỡi qua
    vô tuyến và câu suy nghĩ in nghiêng cuối đoạn (`*Mình đã bảo họ phải chạy thử
    nghiệm ít nhất một lần cơ mà.*`) theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000063: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001 và ý tự an ủi rằng nên lấy làm mừng vì cả
    đội được vận chuyển bằng một khối thuốc nổ hầu như chưa qua thử nghiệm mà vẫn
    đạt phần lớn mục tiêu đề ra cho đến lúc này mà không tổn thất ai.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000064: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, thoáng do dự suy tính phương án tiếp theo
    và chi tiết mười một thuộc cấp tiếp đất an toàn đã được xác nhận qua “kênh liên
    lạc bảo mật”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000065: locks: [''Giữ đại
    từ “chúng ta”, việc thất bại khi chưa cho nổ tung nhà kho khổng lồ nghi là “kho
    đạn” khiến địch có lẽ chưa rối loạn lắm, và nhận định “lực lượng phòng thủ” có
    lẽ vẫn chưa nhận ra cuộc tấn công đang chuẩn bị diễn ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000066: locks: [''Giữ dấu
    ba chấm mở đầu, đại từ “chúng ta” và kết luận vẫn có thể cứu vãn tình thế cũng
    như việc phá hủy “kho đạn” đó vẫn hoàn toàn khả thi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000067: locks: [''Giữ khẩu
    lệnh của Tanya dùng đại từ “chúng ta”, “Tôi” và “Các vị”, phân công tự mình xử
    lý “kho đạn” còn thuộc cấp thổi bay mọi “lực lượng phòng thủ” và bám sát lịch
    trình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000068: locks: [''Giữ nguyên
    câu đáp và xin phép của 09: “09, nghe rõ! Tôi dẫn theo hai trung đội được chứ?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000069: locks: [''Giữ nguyên
    khẩu lệnh chấp thuận và điều động của 01: “01, được. 07, 12, đi theo tôi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000070: locks: [''Giữ nguyên
    khẩu lệnh vô tuyến và dấu nhấn mạnh chữ nghiêng tại thuật ngữ tiếng Đức theo DEC-P01-002:
    “04 gọi 09. Tập hợp theo đội hình *Schwarm*.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000071: locks: [''Giữ nguyên
    báo cáo vô tuyến và dấu nhấn mạnh chữ nghiêng tại thuật ngữ tiếng Đức theo DEC-P01-002:
    “02 gọi 01. Chúng tôi cũng đã vào đội hình *Schwarm*.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000072: locks: [''Giữ sự
    đối lập giữa hài lòng trước sự tập hợp nhanh chóng của “các trung đội” với bực
    dọc vì kết quả va chạm nghèo nàn của những quả “V-1” khiến “Tanya” thấy có chút
    bất mãn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000073: locks: [''Giữ sự
    chuyển dịch mượt mà từ trần thuật ngôi thứ ba (“Đơn vị của nó”, “Họ”) sang độc
    thoại nội tâm ngôi thứ nhất số nhiều (“chúng ta”) ở câu cuối theo DEC-P01-001,
    bảo toàn nhận định về sự hiệu quả cải thiện tâm trạng và vấn đề cốt lõi là nhiều
    khả năng chưa tạo ra được cảnh hỗn loạn làm tiền đề cho cuộc tấn công.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000074: locks: [''Giữ đại
    từ độc thoại “Đại đội của mình” và “chúng ta” theo DEC-P01-001, cùng thế bất lợi
    khi phải đối đầu với một “sở chỉ huy địch” mà hệ thống phòng thủ kiên cố vẫn còn
    nguyên vẹn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000075: locks: [''Giữ nguyên
    khẩu lệnh của Tanya: “Chuẩn bị đột kích. Tôi sẽ nhắm vào kho đạn, còn mọi việc
    khác cứ thực hiện đúng theo kế hoạch.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000076: locks: [''Giữ nguyên
    câu hỏi của thuộc cấp: “Chúng ta nên phân chia các mục tiêu thế nào ạ?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000077: locks: [''Giữ nguyên
    lệnh phân chia mục tiêu của Tanya cho 09 (Trung úy Weiss): “09, anh đảm nhận B
    và C. Tôi sẽ lo A.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000078: locks: [''Giữ chủ
    thể “Tanya” và đại từ “nó” theo DEC-P01-001, tâm thế cam chịu nguy cơ tổn thất
    nặng nề khi quyết định tiến hành các cuộc tập kích và sắc thái mỉa mai ở vế cuối
    rằng thực chất chẳng còn lựa chọn nào khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000079: locks: [''Giữ thông
    tin tình báo về ba địa điểm khả dĩ đặt các cơ sở sở chỉ huy chính của “Lục quân
    Cộng hòa”, ý định dựa vào cảnh hỗn loạn để xác định chính xác mục tiêu và vai
    trò của quả “V-1” lẽ ra phải thổi bay “kho đạn” của “Cụm tập đoàn quân Rhine thuộc
    Cộng hòa”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000080: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng bao trọn câu độc thoại nội tâm và đại từ “mình” theo DEC-P01-001,
    DEC-P01-002: `*…Có lẽ mình đã đòi hỏi quá nhiều chăng.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000081: locks: [''Giữ đại
    từ “chúng ta”, các thuật ngữ kỹ thuật “phụ gia boron”, “buồng đốt tăng lực”, “tăng
    tốc lao thẳng xuống mặt đất thay vì lướt theo quán tính”, cùng câu hỏi tu từ châm
    biếm về việc liệu dây chuyền sản xuất có bao giờ gặp trục trặc nếu mọi sản phẩm
    công nghiệp đều vận hành răm rắp theo sổ tay hướng dẫn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000082: locks: [''Giữ nhận
    định phê phán hai kiểu người tin rằng máy móc hoạt động hoàn toàn đúng thiết kế:
    hoặc không có khái niệm về thực tế chiến trường, hoặc là nhà thiết kế trong phòng
    thí nghiệm cố tình nhắm mắt làm ngơ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000083: locks: [''Giữ chủ
    thể “Tanya” và đại từ “nó” theo DEC-P01-001, định danh “V-1”, thông số tốc độ
    “một nghìn hải lý mỗi giờ” trong “giai đoạn cuối”, thuật ngữ “động năng” và khẳng
    định cú đánh trúng trực diện sẽ nghiền nát cả một “lô cốt” thành từng mảnh vụn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000084: locks: [''Giữ mạch
    lập luận rằng các kỹ sư và nhà thiết kế đã quên mất một điều tối quan trọng: dù
    về mặt vật lý “V-1” có thể xóa sổ mọi thứ trừ “hầm trú ẩn ngầm” chống “chiến tranh
    hạt nhân” vốn chưa tồn tại ở thế giới này—đồng nghĩa với việc phá hủy được hầu
    như mọi “cứ điểm kiên cố”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_004.xhtml/p000085: locks: [''Giữ điều
    kiện tiên quyết mà “Tanya” chỉ ra để khép lại lập luận: những kết quả đó chỉ xảy
    ra nếu quả “V-1” đánh trúng trực diện, còn nếu không ghi được cú đánh trúng đích
    ấy thì nó cũng chỉ đang phung phí năng lượng.'']'
  non_canon: true
