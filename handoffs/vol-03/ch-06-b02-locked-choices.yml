choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039: locks: [''Giữ liên
    từ chuyển ý `Nói cách khác`, định danh `chỉ huy Kampfgruppe`, mệnh đề nhượng bộ
    `dù ông ta có là một người lính xuất sắc đến đâu đi nữa` và sự đối lập `vô cùng
    tốn kém nhưng lại có sức chống chịu cực kỳ bền bỉ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000040: locks: [''Giữ lời
    báo cáo khẩn: `“Sở chỉ huy đang gọi Kampfgruppe Bảy trên diện rộng!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000041: locks: [''Giữ thông
    tin mất liên lạc với `Thiếu tá von Leinburg`, kênh truyền tin `tần số sóng ngắn`
    và báo cáo từ `đơn vị bạn` rằng `ông ấy đã tử trận`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000042: locks: [''Giữ mệnh
    đề điều kiện `Trừ phi người ta thực sự đầu óc để trên mây`, nguyên tắc chuyển
    giao quyền chỉ huy để giảm thiểu tác động đến `chuỗi chỉ huy`, và cấu trúc phủ
    định kép ở câu sau (`tuy hiếm nhưng không phải là chuyện chưa từng nghe thấy`).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000043: locks: [''Giữ sắc
    thái cảm thán `Thế nhưng đáng buồn thay` và nhận định việc kế nhiệm quyền chỉ
    huy đang dần trở thành chuyện bình thường do quá nhiều chỉ huy cấp cao ngã xuống.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000044: locks: [''Giữ thông
    báo chuyển giao `quyền chỉ huy Kampfgruppe Bảy thuộc về Thiếu tá von Degurechaff`
    và mệnh lệnh `tổ chức lại các phòng tuyến ngay lập tức!`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000045: locks: [''Giữ lời
    xác nhận ngắn gọn của Tanya: `“Degurechaff, rõ. Anh có thể báo lại với sở chỉ
    huy.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000046: locks: [''Giữ nhận
    xét về cách truyền đạt thông báo thuần thục, tên riêng `Tanya` đi cùng đại từ
    `Nó` theo `DEC-P01-001` và sự kiềm chế không hét lên vì bị vắt kiệt sức.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000047: locks: [''Giữ chức
    vụ `phó chỉ huy của Kampfgruppe Bảy`, đại từ `nó` và phận sự đưa ra phán đoán
    tốt nhất có thể.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000048: locks: [''Giữ đại
    từ `nó` và chuẩn mực `việc trốn tránh sẽ đi ngược lại hợp đồng`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000049: locks: [''Giữ phép
    đối lập giữa `Những kẻ man rợ thời tiền hiện đại` với `một công dân có văn hóa
    được thụ hưởng nền giáo dục hiện đại`, đại từ `nó` và hành động trải bản đồ nắm
    bắt tình hình từ chút thông tin mơ hồ về kẻ địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000050: locks: [''Giữ đại
    từ `nó`, danh xưng `Thiếu tá von Leinburg` và dấu ba chấm lửng ở cuối câu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000051: locks: [''Giữ dấu
    ba chấm mở đầu và chi tiết `…có thứ gì đó sượt qua lưng nó.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000052: locks: [''Giữ đại
    từ `nó` và phản xạ tức thời: cơ thể phản ứng trước cả não bộ, ôm đầu nằm rạp xuống
    đất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000053: locks: [''Giữ đại
    từ `nó`, động tác trườn trên mặt đất cảnh giác phát bắn tiếp theo và chi tiết
    vật thể xé toạc căn lều rồi nảy bật khỏi tòa nhà bên ngoài.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000054: locks: [''Giữ phán
    đoán phương hướng phát bắn bay tới từ vị trí cực gần trận địa phòng ngự của `Quân
    đội Thịnh vượng chung – Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000055: locks: [''Giữ tiếng
    hô cảnh báo: `“Bọn chúng tung lính bắn tỉa ra rồi! Chết tiệt, đạn bắn tỉa chống
    ma pháp 40 mm!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000056: locks: [''Giữ sự
    chuyển đổi sang độc thoại nội tâm ngôi thứ nhất dùng đại từ `Mình` theo `DEC-P01-001`
    và phép so sánh mỉa mai với `một công ty an ninh tư nhân`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000057: locks: [''Giữ nhận
    định không cần kiểm tra thiệt hại cũng biết loại đạn pháo đang dùng vì bất kỳ
    `pháp sư` nào cũng quen thuộc với nó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000058: locks: [''Giữ định
    danh `Súng trường công phá 40 mm.` và khẳng định `Đó là loại súng phi ma pháp
    uy lực nhất.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000059: locks: [''Giữ sự
    đối sánh mục tiêu (`pháp sư` so với `khí tài`), tên gọi phổ biến `súng trường
    chống ma pháp` và hình ảnh `thiên địch của bất kỳ pháp sư nào`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000060: locks: [''Giữ phép
    so sánh với đạn pháo bọc vỏ kim loại nặng có khả năng gần như vô hiệu hóa các
    `công thức gây nhiễu`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000061: locks: [''Giữ chủ
    ngữ khái quát `Người ta`, khả năng chịu vài phát bắn trực diện từ súng máy hạng
    nặng và vai trò chặn đạn của `lớp vỏ phòng thủ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000062: locks: [''Giữ uy
    lực của đạn `40 mm`: hầu như không gặp lực cản khi xé toạc `màn chắn bảo hộ` và
    xuyên thủng cả `lớp vỏ phòng thủ`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000063: locks: [''Giữ định
    danh `Khối Thịnh vượng chung`, hình ảnh mỉa mai chuyển sang săn pháp sư thay vì
    săn cáo truyền thống, và suy đoán cung cấp súng cho `Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000064: locks: [''Giữ giọng
    độc thoại nội tâm với đại từ `mình` – `chúng ta` theo `DEC-P01-001`, nhận xét
    về thể thao và chiến tranh, cùng câu tự trào chưa bị đem làm bia tập săn vịt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000065: locks: [''Giữ mệnh
    lệnh tác chiến: `“Bắn chế áp! Ghìm chặt quân địch xuống!”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000066: locks: [''Giữ thuật
    ngữ `hệ thống phòng thủ vành đai`, đại từ nội tâm `Chúng ta` – `mình` theo `DEC-P01-001`
    và chính xác dấu nhấn mạnh `*Một số*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000067: locks: [''Giữ sự
    chuyển trả về trần thuật ngôi thứ ba với đại từ `nó` theo `DEC-P01-001` và cơn
    tức giận muốn nắm chặt cát hét lên khàn cả giọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000068: locks: [''Giữ nhận
    xét về kích thước khẩu `40 mm`, giả định trái thực tế `nếu đám này không phải
    là quân tuyến hai, nó hẳn sẽ coi đó là sự lười biếng cố ý`, đại từ `Nó` và việc
    kìm nén không tặc lưỡi.'']'
  non_canon: true
