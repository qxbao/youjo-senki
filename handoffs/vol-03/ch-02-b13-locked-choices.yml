source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: c0fe070bdf56fd6b5b546fd0f11fe2beb0e6efa5c665123720f15706b7569190
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340: locks: [''Giữ cụm
    “các cựu binh mặt trận Rhine” và mạch nghĩa một chiến dịch quy mô lớn cùng những
    chuyển biến dự kiến đối với cục diện chiến tranh đồng nghĩa với chiến thắng họ
    hằng mơ ước.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000341: locks: [''Giữ cụm
    “người lính Đế quốc”, hình ảnh chìm xuống bùn lầy để đưa họ lên con đường chiến
    thắng, và việc chọc thủng các tuyến chiến hào rồi ghìm chân quân địch chính là
    điều đưa họ tới đích.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000342: locks: [''Giữ dấu
    ngoặc kép hội thoại, lời hô “Hỡi các binh sĩ”, cụm “bao vây hoàn toàn” và hình
    ảnh so sánh lực lượng chủ lực của địch như chuột sa bẫy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000343: locks: [''Giữ dấu
    ngoặc kép quanh cụm “bao vây hoàn toàn” và lập luận một đạo quân đã bị bao vây
    và cô lập thì không thể gọi là một đạo quân được nữa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000344: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, tên “Tanya”, định danh “Tiểu đoàn Pháp sư Trên không
    số 203”, và chỉ đánh dấu chữ nghiêng đúng câu hỏi nội tâm cuối đoạn `*Đây có thực
    sự là những tinh binh được tuyển chọn của Tiểu đoàn Pháp sư Trên không số 203
    không vậy?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000345: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và ý hôm nay sẽ rộng lượng tán đồng thái độ ấy của họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000346: locks: [''Giữ hai
    câu ngắn và hình ảnh ẩn dụ “Chiến thắng. Đó quả là một trái ngọt đầy mê hoặc.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000347: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “chúng ta / tôi – các vị”, các cụm “trận đánh tiêu diệt”,
    “Vùng Đất Thấp”, “Valhalla”, lời ví von chuyến dã ngoại chỉ kết thúc khi về đến
    nhà và lời cảnh báo hóm hỉnh không tha thứ nếu ai phóng tới Valhalla mà không
    dự tiệc mừng chiến thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000348: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và hình ảnh thành ngữ nhà binh phải thắt chặt quai mũ
    sắt ngay cả sau khi đã giành phần thắng để được nếm mật ngọt chiến thắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000349: locks: [''Giữ dấu
    ngoặc kép hội thoại, các cụm “thưa các quý ông”, “Thuyền trưởng Treizel”, mốc
    giới hạn quy định mười hai tiếng trước giờ bay và khẩu lệnh kết thúc “Hết!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000350: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, chi tiết ăn mừng bằng đồ hộp và cà phê hòa tan, và câu
    nói tâm lý với “Trung úy Weiss” trước khi rút lui để lính tráng cùng các thủy
    thủ hết ca trực thoải mái xả hơi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000351: locks: [''Giữ tên
    “Tanya”, danh xưng “Thuyền trưởng Treizel”, cụm “buồng thuyền trưởng duy nhất
    trên tàu” và đại từ “nó” theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000352: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001 và hai chủ đề suy ngẫm là cục diện chiến sự sắp tới cùng
    cách ứng xử.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000353: locks: [''Giữ các
    định danh “Chiến dịch Lock Pick”, “Đế quốc”, “Cộng hòa”, ngôi “chúng ta”, cách
    dịch “một vụ Dunkirk” và bảo toàn ký hiệu chú thích `⁵` ngay sau dấu phẩy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000354: locks: [''Giữ cụm
    “chiến thắng trên thực tế”, ngôi “chúng ta”, tên “Tanya” và mạch liên kết việc
    kết thúc chiến tranh, hòa bình cùng sự thăng tiến đều phụ thuộc vào kết quả của
    những chiến dịch này.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000355: locks: [''Giữ sự
    chuyển đổi chuẩn xác giữa đại từ trần thuật “nó” ở câu đầu và đại từ nội tâm tự
    quy chiếu “mình” ở câu cuối theo DEC-P01-001, cùng bộ ba “Mục tiêu đúng đắn, phương
    pháp đúng đắn, đãi ngộ xứng đáng.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000356: locks: [''Giữ cụm
    “một vụ Dunkirk” nhất quán với p000353 và nhận định hầu như chẳng có gì phải lo.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000357: locks: [''Giữ các
    định danh “Lục quân Đế quốc”, “Vùng Đất Thấp”, thuật ngữ “thủy lôi” và ba lý do
    chặn đường rút lui trên biển.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000358: locks: [''Giữ định
    danh “Lục quân Cộng hòa” và kết luận đúng nghĩa đen là một con chuột sa bẫy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000359: locks: [''Giữ câu
    cảm thán ngắn “Chà, tuyệt diệu làm sao!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000360: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, tên “Tanya”, hình ảnh nhổ tận gốc linh cảm dai dẳng
    về một thất bại thảm thương rồi quẳng phăng đi, và cảnh nhanh chóng chìm vào giấc
    ngủ trên chiếc giường êm ái hiếm hoi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000361: locks: [''Giữ sự
    đối lập giữa đám thuộc cấp chật vật nhét thân hình dài ngoẵng vào những chiếc
    giường thủy thủ chật hẹp trong “khoang ống phóng ngư lôi” với cảnh “Tanya” tận
    hưởng giấc ngủ yên bình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000362: locks: [''Giữ đại
    từ “nó” theo DEC-P01-001, các thuật ngữ “sĩ quan trực ban”, “đài chỉ huy” và chuỗi
    hành động vươn vai, hỏi thăm vị trí tàu rồi gật đầu mãn nguyện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000363: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Thiếu tá”, đại từ “cô” và kính ngữ “ạ” trong câu
    chào buổi sáng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000364: locks: [''Giữ dấu
    ngoặc kép hội thoại, hai danh xưng phân biệt rõ cấp bậc “Trung úy Weiss” và “Thiếu
    úy Serebryakov”, cùng đại từ ngôi thứ ba “cô ấy”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000365: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm “thưa Thiếu tá”, ngôi “tôi” kèm kính ngữ “ạ” và câu trả
    lời hóm hỉnh dựa trên việc con tàu vẫn chưa chìm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000366: locks: [''Giữ tiếng
    cười ““Ha-ha-ha!”” trong dấu ngoặc kép.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000367: locks: [''Giữ các
    cụm “Trung úy Weiss”, “viên sĩ quan trực ban”, tên “Tanya” và chi tiết tận hưởng
    đôi chút niềm vui của một buổi sáng yên tĩnh trên tàu ngầm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000368: locks: [''Giữ dấu
    ngoặc kép hội thoại, đại từ “Cô ấy”, danh xưng “Thiếu tá”, ngôi “tôi” và nhận
    xét về trạng thái lúc nào cũng như ở trên chiến trường khiến thân tàu hẳn đã thủng
    toạc nếu có kẻ tấn công lúc đang ngủ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000369: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu “Cứ cho là mỗi người một ý đi.”, ngôi “Chúng ta” và câu
    hỏi chuyển sang nắm bắt tình hình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000370: locks: [''Giữ tên
    “Tanya”, đại từ “nó” theo DEC-P01-001, chỉ đánh dấu chữ nghiêng đúng cụm `*bằng
    chứng cho sự vĩ đại của nhân loại*` theo DEC-P01-002, và mạch chuyển từ ấn tượng
    trước sức sống con người trong lòng tàu ngầm sang cắt ngang cuộc trò chuyện phiếm
    vì nhớ tới nhiệm vụ và bổn phận.'']'
  non_canon: true
