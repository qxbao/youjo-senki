source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 7fb2432c2e516c4fc62da3cc408d9b5f159f502b702ea02932087089b030e6ec
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123: locks: [''Giữ điều
    kiện giả định nếu các khẩu pháo không thể tiến lên sau khi quân đội chọc thủng
    chiến hào thì bộ binh phải chiến đấu mà không có pháo binh yểm trợ, cùng mệnh
    đề nhượng bộ rằng dù được pháp sư hoặc không quân yểm trợ cũng không thể kỳ vọng
    mức hỏa lực ngang với “những khẩu đại bác hạng nặng”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000124: locks: [''Giữ tên
    “Zettour”, dấu ngoặc kép hội thoại và điều kiện chỉ thành hiện thực nếu “cánh
    cửa xoay” vận hành đúng như dự tính.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000125: locks: [''Giữ tên
    “Rudersdorf”, dấu ngoặc kép hội thoại, ngôi “tôi” và câu khẩu lệnh “Vừng ơi mở
    ra!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000126: locks: [''Giữ câu
    trần thuật ngắn “Đó là những lời thần chú nhiệm màu.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000127: locks: [''Giữ tên
    “Rudersdorf”, các định danh “Chiến dịch Lock Pick”, “Cộng hòa”, sự đắc ý thầm
    kín về câu khẩu lệnh hợp cảnh và hai hành động nối tiếp: theo đúng nghĩa đen thổi
    bay những chiến hào nơi hai bên chất chồng xác chết trong vô vọng vì chẳng bên
    nào chọc thủng nổi phòng tuyến, qua đó cạy tung hệ thống phòng ngự ngoan cố của
    Cộng hòa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000128: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “ông” và lời nhận xét châm biếm về gu đặt khẩu hiệu
    tệ hại đến mức thảm họa.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000129: locks: [''Giữ hai
    phần hội thoại tách bởi phần trần thuật giữa đoạn, định danh “Cục Tác chiến”,
    chỉ đánh dấu chữ nghiêng đúng câu `*Ông cứ trông cậy ở tôi.*` theo DEC-P01-002,
    cùng từ “‘phục hưng’” và nhận định “Đây chính là trí tuệ của người xưa mà.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000130: locks: [''Giữ chi
    tiết chiến thuật đào đường hầm phá tường thành thời trước khi có đại bác, chỉ
    đánh dấu chữ nghiêng đúng câu nội tâm `*Hãy dạy cho lũ Cộng hòa ngạo mạn kia một
    bài học để chúng chừa thói giễu cợt những ý tưởng cổ xưa đi.*` theo DEC-P01-002
    và niềm vui sướng của “Rudersdorf”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000131: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm “nguyên lý của cánh cửa xoay” và câu hỏi “lịch sử sẽ
    đặt sức nặng lên phía bên nào đây?”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000132: locks: [''Giữ dấu
    ngoặc kép hội thoại, câu trả lời “Cả hai bên—đó sẽ là một cuộc bao vây khổng lồ
    đi vào lịch sử.” và lời kêu gọi “Nào các quý ông, hãy kết thúc cuộc chiến này
    thôi.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000133: locks: [''Giữ các
    định danh “Vùng Đất Thấp”, “Lục quân Đế quốc”, “cánh trái thuộc Cụm tập đoàn quân
    phía Đông của Cộng hòa”, sự tương phản giữa cánh trái đang tiến lên đẩy cao chiến
    tuyến với các đơn vị ở cánh phải vẫn cầm cự đối đầu với cánh trái của Lục quân
    Đế quốc và tâm trạng phát ngán cảnh bế tắc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000134: locks: [''Giữ sự
    đối lập giữa tin tức trên đài phát thanh và báo cáo chính thức chỉ nói về cuộc
    truy kích ở “mặt trận Vùng Đất Thấp” với cuộc sống thường nhật ngập trong sự đơn
    điệu của những phòng tuyến tĩnh lặng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000135: locks: [''Giữ đủ
    ba tầng không gian: “tuyến chiến hào tiền tiêu” (thấp thỏm vì đụng độ lẻ tẻ tại
    “vùng đất không người” và “lính bắn tỉa”), “chiến hào dự bị” (cằn nhằn thực đơn
    không đổi và cãi vã vô bổ với “nhân viên hậu cần”), “sở chỉ huy tiền phương” (ghen
    tị với vận may của cánh quân tại “Vùng Đất Thấp”, các sĩ quan bực dọc và sốt ruột
    ngồi họp mà chẳng có gì để nói), cùng câu kết “Chẳng một ai thấy dễ chịu với hoàn
    cảnh đó cả.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000136: locks: [''Giữ các
    định danh “Khối Thịnh vượng chung”, “Đế quốc”, ba khả năng đồn đoán (can thiệp,
    hòa giải, hoặc tham chiến với tư cách đồng minh), tin đồn trận chiến xóa sổ Đế
    quốc đã gần kề và cảm giác khó chịu khi phải đứng xa chiến trường sôi động vào
    lúc đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000137: locks: [''Giữ hình
    ảnh “viên sĩ quan cấp tá” gương mặt cau có đặc biệt khó đăm đăm, đứng sừng sững
    với điếu thuốc lá nghiến chặt giữa hai hàm răng như sắp nhai nát vụn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000138: locks: [''Giữ định
    danh “Trung tá Vianto”, đại từ “anh”, hình ảnh sự hung hăng hiếu chiến của một
    con chó ngao và việc không được phép giải tỏa nguồn năng lượng ấy khiến anh sôi
    sục cơn thịnh nộ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000139: locks: [''Giữ đại
    từ “Anh”, địa danh “Arene”, dấu ngoặc kép quanh từ ““tái tổ chức””, chi tiết kịch
    liệt phản đối việc điều chuyển số ít pháp sư thoát chết trong gang tấc sang các
    thuộc địa nhưng bị chặn đứng bởi thủ tục quan liêu và giới cấp trên trốn tránh
    trách nhiệm gián tiếp đối với thảm kịch ở Arene.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000140: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Thề có trời là lũ khốn này đéo hiểu cái quái
    gì cả!*` theo DEC-P01-002 và đúng mức độ thô tục, phẫn nộ của câu chửi nội tâm.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000141: locks: [''Giữ tên
    “Vianto”, đại từ “anh”, thuật ngữ “thuật thức”, chi tiết không cảm nhận được vị
    đắng của điếu thuốc bị nghiền nát trong miệng và cú đấm mang theo thuật thức kích
    hoạt vô thức làm nứt tường mà cơn giận vẫn chưa nguôi ngoai.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000142: locks: [''Giữ đại
    từ “Anh” và mức độ căm ghét hoàn cảnh hiện tại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000143: locks: [''Giữ các
    định danh “Arene”, “Đế quốc”, “Lục quân Đế quốc”, đại từ “anh” và mạch công nhận
    chiến dịch ở Arene đã đe dọa hậu cần địch nên hiểu được vì sao giới tướng lĩnh
    chóp bu coi cuộc rút quân của Lục quân Đế quốc là hệ quả của chiến dịch đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000144: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng toàn đoạn `*Nhưng…*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000145: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng từ `*truy kích*` theo DEC-P01-002, định danh
    “Đế quốc” và cấu trúc giả định quá khứ ngược thực tế rằng nếu đuổi theo lực lượng
    Đế quốc khi chúng vừa rút lui thì chắc chắn đã đạt được thành quả nào đó, thậm
    chí biết đâu là một kết cục viển vông như buộc Đế quốc phải đầu hàng.'']'
  non_canon: true
