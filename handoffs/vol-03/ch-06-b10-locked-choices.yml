segment_id_end: YS-LN03/Text/chapter006_002.xhtml/p000322
choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289: locks: [''Giữ đại
    từ `Anh` quy chiếu John, mong muốn yêu cầu quan tâm hơn nữa đến phúc lợi của các
    `điệp viên` đang làm việc ở nước ngoài, bảo toàn chính xác câu in nghiêng ở giữa
    theo `DEC-P01-002` (`*Họ chẳng hiểu nỗi khổ sở mà người ta phải trải qua lấy một
    mảy may nào.*`), và cụm `Đám quý ông rởm` không biết gì về điều kiện làm việc
    thực tế.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000290: locks: [''Giữ quan
    hệ nhân quả `Nhưng chính vì thế mà anh cần tập trung vào công việc trước mắt`
    và hành động kéo sự chú ý của `mình` quay về với thực tại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000291: locks: [''Giữ lời
    thoại ngoại giao của John với đại từ `Tôi` – `chúng ta`: `“Tình hình là như vậy
    đấy. Tôi rất mong chúng ta có thể duy trì mối quan hệ tốt đẹp.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000292: locks: [''Giữ nhận
    xét về `John` là một `điệp viên xuất sắc`, việc duy trì `các mạng lưới quan sát
    và thông tin liên lạc` thông qua `các bộ tộc du mục`, cung cấp vũ khí hỗ trợ `hoạt
    động du kích`, và thỏa thuận tiếp nhận `tù binh Đế quốc` cũng như `các tù binh
    của Khối Thịnh vượng chung`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000293: locks: [''Giữ ý `John`
    đã xây dựng được mạng lưới cần thiết để đối đầu với `Đế quốc` và nhận định đó
    là một khối lượng công việc khổng lồ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000294: locks: [''Giữ hình
    ảnh `John` làm bộ điềm tĩnh trên lưng `con lạc đà một bướu`, việc vượt qua vô
    số tình huống hiểm nghèo, và kỷ niệm bị cuốn vào cuộc xung đột giữa `những người
    du mục` phải thúc tấm thân già của `mình` cầm `súng trường` lên chiến đấu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000295: locks: [''Giữ sự
    đối lập giữa một `tay săn cáo cừ khôi` với nỗi ngán ngẩm `đám kỵ binh cưỡi lạc
    đà tấn công`, cùng mong muốn mang theo một khẩu `súng tiểu liên` hoặc `mẫu súng
    trường tấn công mới do Đế quốc chế tạo`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000296: locks: [''Giữ lời
    đáp của vị tù trưởng với cặp đại từ `ngài` – `chúng tôi`: `“Số vật tư nhận được
    từ ngài cũng giúp ích cho chúng tôi lắm.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000297: locks: [''Giữ định
    danh `tù trưởng bộ tộc`, đại từ `Ông ta`, thái độ tích cực về các giao dịch vì
    có cơ hội nhận `đạn thật` để thống nhất các bộ tộc trong vùng, và lý do `vũ khí
    hạng nặng, thuốc nổ` chủ yếu phải mua từ nước ngoài nên việc nắm nguồn cung ổn
    định trước các bộ tộc khác là chuyện vô cùng trọng đại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000298: locks: [''Giữ sự
    đối lập `Nhưng không giống như John, họ không hề thề kết minh với bất kỳ quốc
    gia nào.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000299: locks: [''Giữ câu
    hỏi đòi hỏi điều kiện của vị tù trưởng dùng `các ngài` – `chúng tôi`: `“Nhưng
    nếu các ngài muốn xem chúng tôi làm được gì, chẳng phải phía các ngài cũng nên
    cử binh lính tới sao?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000300: locks: [''Giữ dấu
    ba chấm mở đầu và nhận xét: `…Điều đó có nghĩa là họ thường đưa ra những điều
    kiện mà những người như John không đời nào nuốt trôi được.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000301: locks: [''Giữ yêu
    cầu giữ bí mật mối quan hệ giữa `các bộ tộc du mục` và `Khối Thịnh vượng chung`,
    cùng hệ quả nếu lộ tin `anh` đang cài cắm trong bộ tộc thì sẽ không thể trà trộn
    vào các `đoàn lữ hành` để thâm nhập khắp nơi như hiện giờ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000302: locks: [''Giữ nguyên
    tắc giữ kín `các hoạt động bí mật` và ví dụ tuyệt đối không được để lại dấu vết
    hồ sơ cho thấy `mình` đang ngầm hợp tác với các bộ tộc theo cách có thể dẫn tới
    một `cuộc chiến chống Cộng hòa` ngay tại `các thuộc địa của Cộng hòa`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000303: locks: [''Giữ câu
    trần thuật về nỗi vất vả của `John` còn tiếp diễn và bảo toàn chính xác câu ước
    nguyện in nghiêng theo `DEC-P01-002`: `*Xin hãy để Lục quân Cộng hòa Tự do làm
    tròn phận sự của họ một cách đàng hoàng.*`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000304: locks: [''Giữ dòng
    tiêu đề thời gian-địa điểm viết hoa toàn bộ: `NGÀY 12 THÁNG 10, NĂM THỐNG NHẤT
    1925, DOANH TRẠI LỤC QUÂN ĐẾ QUỐC`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000305: locks: [''Giữ lời
    mở đầu đề xuất của Tanya: `“Thưa Tướng von Romel, tôi muốn đưa ra một đề xuất.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000306: locks: [''Giữ hình
    ảnh bức màn đêm sắp buông xuống, các định danh `Bộ Tổng tham mưu Lục quân Đế quốc`,
    `Không đoàn`, `báo cáo trinh sát cuối cùng trong ngày`, và công việc phân tích
    trong điều kiện ánh sáng cùng trang thiết bị thiếu thốn đang chờ `các sĩ quan
    tham mưu dưới mặt đất`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000307: locks: [''Giữ sự
    xuất hiện của `Thiếu tá von Degurechaff`, đại từ `nó` theo `DEC-P01-001`, và nỗi
    bất ngờ khi một `sĩ quan cấp tá` tìm đến đóng góp ý kiến vào giờ này trong ngày.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000308: locks: [''Giữ chính
    xác phạm vi in nghiêng ở câu hỏi theo `DEC-P01-002`: `*Chuyện gì thế nhỉ?* họ
    tự hỏi.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000309: locks: [''Giữ nhận
    định hầu như chẳng ai thấy đáng ngờ, giọng điệu của `Degurechaff` không hề căng
    thẳng mà `hoàn toàn mang tính công vụ`, và việc đề xuất điều gì đó với `vị tư
    lệnh` không phải chuyện hiếm lạ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000310: locks: [''Giữ dấu
    ba chấm lửng ở giữa câu và sự phù hợp với `truyền thống chủ động hành động của
    Lục quân Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000311: locks: [''Giữ chính
    xác hai cụm in nghiêng `*Thật vô lễ.*` và `*Viên sĩ quan cấp tá này rốt cuộc đang
    lo lắng về chuyện gì cơ chứ?*` theo `DEC-P01-002`, cùng chi tiết mọi người bất
    giác ngoái nhìn vì tò mò.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000312: locks: [''Giữ tên
    riêng `Tanya` đi cùng đại từ `nó` theo `DEC-P01-001`, nguyên nhân khiến `nó` bất
    an là những ánh mắt thiếu quyết đoán cùng sự do dự của các sĩ quan, và việc gương
    mặt của `các sĩ quan tham mưu` chẳng có vẻ gì là lo lắng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000313: locks: [''Giữ câu
    ngắn với đại từ `Nó` theo `DEC-P01-001`: `Nó phải nói điều gì đó mới được.`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000314: locks: [''Giữ câu
    hỏi ngắn gọn của Tướng von Romel: `“Chuyện gì vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000315: locks: [''Giữ giọng
    suy ngẫm của Tanya với đại từ tự quy chiếu `mình`, nhận định về người sếp biết
    `gia tăng động lực khích lệ cho cấp dưới` tạo ra môi trường quân ngũ tốt nhất,
    và sự dễ dàng khi làm việc cùng người như vậy.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000316: locks: [''Giữ tên
    riêng `Tanya` đi cùng đại từ `nó` theo `DEC-P01-001`, cảm nhận hai bên có thể
    hòa hợp và tôn trọng lợi ích của nhau, cùng ý nghĩ họ nên đứng ra bọc lót cho
    nhau nếu cần thiết.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000317: locks: [''Giữ lời
    xin phép của Tanya: `“Tôi muốn xin phép đi trinh sát phía trước lực lượng chủ
    lực.”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000318: locks: [''Giữ nhận
    định kế hoạch phục vụ lợi ích của cả đôi bên dù che giấu ý định thực sự của `mình`,
    tên riêng `Tanya` và đại từ `nó` với mong muốn hành động thận trọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000319: locks: [''Giữ câu
    hỏi tu từ mở đầu, định danh `các pháp sư` là `binh chủng` sẽ bị vắt kiệt sức hơn
    cả để thực hiện `trinh sát chiến đấu` và `các trận đánh truy kích`, cùng hình
    ảnh ẩn dụ `đi dập lửa một khi đám cháy bùng phát`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000320: locks: [''Giữ câu
    nhận định khái quát về tính cách của `Tanya`: không tiếc công sức ở hiện tại nếu
    có thể giảm thiểu rủi ro trong tương lai.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000321: locks: [''Giữ lời
    chất vấn của Tướng von Romel với thuật ngữ `kế hoạch tập kích bất ngờ` và cặp
    đại từ `chúng ta` – `cô`: `“Việc đó có thể làm lộ kế hoạch tập kích bất ngờ của
    chúng ta. Ý đồ của cô là gì?”`.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter006_002.xhtml/p000322: locks: [''Giữ câu
    trả lời kết thúc lô của Tanya với cặp đại từ `Tôi` – `chúng ta`: `“Tôi cho rằng
    sự hiểu biết của chúng ta về động tĩnh của quân địch là chưa đủ.”`.'']'
  non_canon: true
