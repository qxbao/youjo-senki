source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 62fcf559bda4af12429199d21f728a3cfb1703a61d6fc21b9c25e0996713a5a0
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi / chúng ta”, kính ngữ “đấy ạ” và lời báo cáo đã
    đánh thức mọi người, chắc hẳn họ đã tỉnh rượu và có tình trạng khá hơn nhiều so
    với hồi “huấn luyện sức bền”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000372: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “chúng ta” và câu đùa nếu có ai gục ngã vì dư âm cơn
    say thì sẽ phải quẳng xuống biển để làm mát cái đầu lại.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000373: locks: [''Giữ đại
    từ “nó” cho Tanya theo DEC-P01-001, danh xưng “Trung úy Weiss”, đại từ “anh” cho
    Weiss và chi tiết một “sĩ quan hải quân” lên tiếng gọi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000374: locks: [''Giữ dấu
    ngoặc kép hội thoại, các danh xưng “Thiếu tá von Degurechaff”, “Thuyền trưởng
    Treizel”, ngôi “Tôi / Chúng ta” và thông báo sắp đến tọa độ đã hẹn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000375: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi – anh”, danh xưng “Thuyền trưởng”, lời nhờ báo
    sẽ tập hợp đơn vị lên boong tàu ngay lập tức và câu hỏi xin một “bản tin thời
    tiết” cùng một tấm “hải đồ”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000376: locks: [''Giữ ngôi
    “chúng ta” trong độc thoại nội tâm và mạch ý tạm biệt chuyến hải hành êm ả, những
    bữa ăn tuyệt hảo cùng nguồn cà phê bất tận để dứt điểm cuộc chiến và giành lại
    cuộc sống thường nhật trong chớp mắt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000377: locks: [''Giữ ngôi
    “Chúng ta” và kết luận việc dốc sức cho một cú hích cuối cùng còn mang lại một
    lợi ích khác nữa: công việc có ý nghĩa chính là hạnh phúc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000378: locks: [''Giữ tên
    “Tanya”, sự đối lập giữa quân số cỡ một đại đội đứng chen chúc trên boong tàu
    ngầm chật hẹp nhưng vẫn có cảm giác rộng rãi đến bất ngờ so với bên trong tàu,
    và nhận xét cảm thấy nhẹ nhõm là bản tính tự nhiên của con người.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000379: locks: [''Giữ tên
    “Tanya”, danh xưng “Thuyền trưởng Treizel”, cụm “vị trí quan sát trên đài chỉ
    huy”, đại từ “ông” và suy đoán hẳn ông đã cất công ra tận đây để tiễn họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000380: locks: [''Giữ dấu
    ngoặc kép hội thoại, danh xưng “Thiếu tá”, đại từ “ông” và hành động vừa bước
    xuống vừa chìa tay ra.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000381: locks: [''Giữ cụm
    “Hai vị chỉ huy”, tên “Tanya” và hành động bắt tay đúng theo nghi thức kèm lời
    bày tỏ lòng biết ơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000382: locks: [''Giữ dấu
    ngoặc kép hội thoại, đại từ “ngài” và danh xưng “Thuyền trưởng Treizel”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000383: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi – các vị”, chỉ đánh dấu chữ nghiêng đúng cụm `*các
    vị*` đầu tiên theo DEC-P01-002, và lời chúc bình an ngoài đó.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000384: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi – ngài”, cụm “thủy thủ đoàn” và lời chúc giành
    thắng lợi.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000385: locks: [''Giữ tên
    “Tanya” và chuỗi hành động chào nhau theo điều lệnh, gật đầu ra hiệu cho binh
    sĩ rồi cả đội cất cánh.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000386: locks: [''Giữ dấu
    ngoặc kép hội thoại và khẩu lệnh tiễn biệt “Vẫy mũ đi! Vẫy mũ lên!”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000387: locks: [''Giữ danh
    xưng “Thuyền trưởng Treizel”, cụm “thủy thủ đoàn” và hình ảnh cả đại đội lên đường
    trong màn tiễn biệt giản dị mà chân tình.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000388: locks: [''Giữ các
    định danh “Vùng Đất Thấp”, “Tanya”, “Rhine Control” và mạch diễn biến bay suôn
    sẻ tới không phận được chỉ định rồi gọi liên lạc như thói quen thường lệ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000389: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Fairy 01”, “Rhine Control” và khẩu lệnh gọi
    vô tuyến tiêu chuẩn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000390: locks: [''Giữ thuật
    ngữ “kiểm soát viên”, dấu ngoặc kép hội thoại, các định danh “Fairy 01”, “Rhine
    Control”, “hô hiệu Hotel 09” và thông báo nghe to, rõ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000391: locks: [''Giữ dấu
    ngoặc kép hội thoại, các định danh “Hotel 09”, “Fairy 01”, ngôi “Tôi” và xác nhận
    tín hiệu bên đó cũng rất rõ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000392: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Hotel 09”, ngôi “tôi – các vị” và lời khen chiến
    công xuất sắc kèm câu đùa có cả một đạo quân muốn khao nên sẽ được uống chùa suốt
    đời.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000393: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Fairy 01”, ngôi “tôi” và câu đáp hóm hỉnh thuộc
    “phe Cà phê”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000394: locks: [''Giữ định
    danh “Rhine Control” và nhận định việc có thể bông đùa như vậy cho thấy họ đang
    khá thư thái, là một tín hiệu tốt.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000395: locks: [''Giữ tên
    “Tanya” ở câu đầu văn bản phẳng và chỉ đánh dấu chữ nghiêng toàn bộ câu thứ hai
    `*Thông thường, hẳn họ đang phải điều phối các cuộc đánh chặn, gào thét chỉ đạo
    đến khản cả giọng để xử lý đủ thứ rắc rối; cục diện chiến sự ắt hẳn phải đang
    vô cùng thuận lợi thì họ mới có được sự thảnh thơi trong tâm trí để trò chuyện
    cởi mở và giàu tính người đến vậy.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000396: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “tôi – các vị”, đại từ “anh ấy” và chi tiết vị sĩ quan
    lên kế hoạch cho buổi tiệc mừng trở về lại thuộc “phe Trà”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000397: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Fairy 01”, ngôi “chúng tôi” và câu hỏi về nhiệm
    vụ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000398: locks: [''Giữ dấu
    ngoặc kép hội thoại, cụm nhiệm vụ “lùng sục và đánh chặn”, giới hạn chỉ ở mức
    được phép tấn công nếu tình cờ bắt gặp địch trên đường về, và lời nhắn mọi người
    đang chờ những người hùng là “các vị” trở về an toàn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000399: locks: [''Giữ tên
    “Tanya”, thuật ngữ “kiểm soát viên”, ngôi “chúng ta” trong độc thoại nội tâm và
    nhận xét triển vọng thuận lợi thực sự giúp nâng cao nhân tính của con người.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000400: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “Tôi / Chúng tôi” và ý bộ binh dưới mặt đất đang vất
    vả chiến đấu nên đơn vị sẽ tiến lên gánh đỡ bớt phần nào cho họ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000401: locks: [''Giữ dấu
    ngoặc kép hội thoại, thông tin thời tiết tại không phận (trời quang, gần như không
    có gió, tầm nhìn tốt) và lời nhắc coi chừng hỏa lực từ dưới mặt đất.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000402: locks: [''Giữ đại
    từ nội tâm tự quy chiếu “mình”, tên “Tanya” kèm đại từ ngôi thứ ba “con bé” khi
    nhân vật tự tách góc nhìn với vỏ bọc của mình theo DEC-P01-001, và sắc thái tự
    trào về tâm lý vị tha cùng khao khát làm việc thiện.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000403: locks: [''Giữ dấu
    ngoặc kép hội thoại, định danh “Fairy 01” và câu hỏi về dữ liệu các đơn vị pháp
    sư địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter002_004.xhtml/p000404: locks: [''Giữ dấu
    ngoặc kép hội thoại, ngôi “chúng tôi”, các định danh “Khối Thịnh vượng chung”,
    “Cộng hòa”, thuật ngữ “học thuyết”, “Kiểm soát viên” và chi tiết chỉ riêng trong
    khoảnh khắc cảnh báo ấy giọng anh ta trở nên nghiêm túc.'']'
  non_canon: true
