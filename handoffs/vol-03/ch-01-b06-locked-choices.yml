task_id: vol-03-ch-01-b06
baseline_sha256: b10ea40f14b0afb01f29c028c82a83f577794edaaef10a9550d09dbdf04ee36d
source_sha256: 74f557a5f02ccc0308519579028d46fc0a89698a81e15219feb3add22ffc96a4
source_package_sha256: 0e40e13a6662a898c4f2a7c3fa32c0cd05d4b52bccf7bccbdc1ef7a81fb8dc28
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117: locks: [''Giữ đại
    từ trần thuật “nó” và tự quy chiếu “mình” theo DEC-P01-001, nối tiếp trực tiếp
    p000116 với bước ngoặt nhận thức rằng tự thân lời lẩm bẩm không bị hiểu theo hướng
    xấu nhưng tùy ngữ cảnh lại có thể dẫn đến hậu quả nghiêm trọng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000118: locks: [''Giữ câu
    thoại ngập ngừng đứt quãng của Lergen và đại từ gọi Tanya là “cô” (“Không, cô—à,
    ờ, đúng hơn là đối với cô thì…”).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000119: locks: [''Giữ câu
    hỏi đáp ngắn gọn lễ phép “Dạ?” của Tanya trước lời bỏ lửng của cấp trên.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000120: locks: [''Giữ đúng
    cấp bậc “Trung tá von Lergen” như nguyên tác tại đoạn này, nhận định “Đây có vẻ
    là tình huống tồi tệ nhất rồi” và câu kết “Dù cho một người có cố bấu víu vào
    sự lạc quan chặt đến mấy, ông cũng chẳng phải kẻ ngốc.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000121: locks: [''Giữ thuật
    ngữ “Văn phòng Bộ Tổng tham mưu”, đại từ trần thuật “nó” quy chiếu Tanya theo
    DEC-P01-001, các mức độ đánh giá trong báo cáo giả định (nghi ngờ năng lực thực
    hiện chiến dịch, phơi bày sự thiếu hụt động lực ngay cả khi chưa quy kết bất tuân
    mệnh lệnh) và nhận định chắc chắn về Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000122: locks: [''Giữ câu
    hỏi độc thoại nội tâm ở dạng văn bản phẳng không in nghiêng theo DEC-P01-002,
    cấp bậc “Đại tá von Lergen”, đại từ “ông” và đại từ tự quy chiếu “mình” theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000123: locks: [''Giữ tên
    riêng và cấp bậc “Tướng von Zettour”, “Tướng von Rudersdorf”, đại từ “ông” quy
    chiếu Zettour và cấu trúc tăng tiến giữa dấu gạch ngang “cảm thấy thờ ơ—chứ đừng
    nói đến việc thẳng thừng chỉ trích—đối với một kế hoạch”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000124: locks: [''Giữ đại
    từ “cô” trong lời thoại của Lergen, đại từ trần thuật “ông”, chi tiết nét mặt
    hơi nhăn lại khi lựa lời và suy đoán của Lergen rằng hẳn phải có lý do cho sự
    do dự của Tanya.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000125: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Một con ma cà rồng vừa bị đóng cọc
    xuyên tim có lẽ cũng cảm thấy thế này là cùng.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000126: locks: [''Giữ giọng
    thoại lễ phép của Tanya với cấp trên (“À, ra là vậy… Không, tôi chỉ đang thắc
    mắc một chuyện thôi ạ.”).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000127: locks: [''Giữ câu
    hỏi lặp lại cụm từ khóa “Thắc mắc chuyện gì?” của Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000128: locks: [''Giữ dấu
    nhấn mạnh chữ nghiêng chỉ ở đúng câu giữa đoạn `*Đây là chướng ngại vật bắt buộc
    phải vượt qua bằng mọi giá.*` theo DEC-P01-002, đại từ “mình” / “nó” theo DEC-P01-001
    và chiến thuật kiểm soát thiệt hại bằng cách bày tỏ sự tiếc nuối vì không được
    dẫn đầu một cuộc tấn công quy mô lớn hơn.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000129: locks: [''Giữ đầy
    đủ tên riêng “Tanya von Degurechaff”, đại từ trần thuật “nó” theo DEC-P01-001,
    các thuật ngữ “Lục quân”, “tổng hành dinh địch”, và câu hỏi cuối đoạn của Tanya
    về việc thực hiện cuộc đánh úp công phu chỉ với mục đích duy nhất là gây hỗn loạn
    tại tổng hành dinh địch.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000130: locks: [''Giữ các
    thuật ngữ kỹ thuật “đường ray”, “đường băng”, “các thiết bị gia tốc bổ sung”,
    “các khối khí tài”, “tầng đẩy”, “bình nhiên liệu” và “chất đẩy lỏng dễ bay hơi”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000131: locks: [''Giữ cấu
    trúc phủ định “chắc chắn Tanya không phải là người duy nhất cảm nhận được quyết
    tâm sắt đá trong việc thực hiện chiến dịch đến cùng” và mốc thời điểm khi đường
    ray được lắp xong và tên lửa bắt đầu được nạp nhiên liệu.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000132: locks: [''Giữ đại
    từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “tổng hành dinh địch” và lập luận
    rằng lượng công sức bỏ ra có vẻ không tương xứng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000133: locks: [''Giữ cấu
    trúc phủ định kép trong lời đáp của Lergen (“Tôi không cho rằng việc giả định
    một đòn tấn công nhắm vào tổng hành dinh địch đòi hỏi rất nhiều công tác chuẩn
    bị trước là sai lầm.”).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000134: locks: [''Giữ cấp
    bậc “Đại tá von Lergen”, đại từ trần thuật “nó” theo DEC-P01-001 và câu phủ định
    “Tanya không phản đối sự cần thiết của các công tác chuẩn bị quy mô lớn.”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000135: locks: [''Giữ cách
    xưng hô tôn kính “Ngài nói đúng, thưa Đại tá.” và hình ảnh ẩn dụ quân sự “đóng
    vai trò là loạt đạn mở màn cho một trận đánh lớn hơn”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000136: locks: [''Giữ đại
    từ trần thuật “nó” / “mình” theo DEC-P01-001, thuật ngữ “tính hiệu quả chi phí”,
    lý do kỹ thuật khó hủy phóng một khi các tên lửa đã được nạp đầy “thứ nhiên liệu
    cực kỳ dễ bay hơi của chúng” và thái độ trình bày nghiêm túc.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000137: locks: [''Giữ câu
    hỏi gài bẫy của Lergen và đại từ “cô” (“Hừm, ý cô là kế hoạch như hiện tại sẽ
    chẳng đạt được bao nhiêu kết quả?”).'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000138: locks: [''Giữ lời
    đính chính khéo léo của Tanya, tiểu từ lễ phép “ạ”, thuật ngữ “tổng hành dinh
    địch” và cấu trúc phủ định kép “Tôi không nói rằng việc tấn công tổng hành dinh
    địch sẽ không có tác dụng gì, nhưng…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000139: locks: [''Giữ cấp
    bậc “Đại tá von Lergen”, đại từ phản thân “mình” theo DEC-P01-001 và nhận định
    việc hoài nghi ở điểm này có thể bị coi là mưu toan trốn tránh nhiệm vụ bằng cách
    đặt dấu hỏi về tính hiệu quả.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000140: locks: [''Giữ đại
    từ “ông” quy chiếu Lergen và “nó” / “mình” quy chiếu Tanya theo DEC-P01-001, ở
    dạng văn bản phẳng không in nghiêng theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000141: locks: [''Giữ hình
    ảnh “mạnh dạn vào vai một người yêu nước nhiệt thành không chút e dè”, đại từ
    trần thuật “Nó” theo DEC-P01-001 và gợi ý kết hợp nhiệm vụ này với một nỗ lực
    khác.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000142: locks: [''Giữ phép
    đối sánh giữa đòn tập kích này với việc săn lùng “một chiếc tàu đổ bộ nhỏ lẻ loi
    chở một vị đô đốc nọ trong chuyến thị sát vô tư lự”, cùng mệnh đề điều kiện “Chừng
    nào mục tiêu còn cố định một chỗ, chúng ta nên chọn thời điểm có lợi nhất.” ở
    dạng văn bản phẳng không in nghiêng.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000143: locks: [''Giữ cách
    xưng hô “Theo góc nhìn của tôi, thưa Đại tá”, hình ảnh ví von “chỉ để bắn lên
    vài quả pháo hoa” và câu bỏ lửng với thuật ngữ “Hiệu quả chi phí có phần…”.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000144: locks: [''Giữ chi
    tiết Tanya chợt có cảm giác kỳ lạ rồi bỏ lửng câu nói và dấu nhấn mạnh chữ nghiêng
    chỉ ở đúng câu cuối `*Đúng vậy, chuyện này rất kỳ quặc.*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000145: locks: [''Giữ lời
    gọi cấp bậc ngắn gọn “Thiếu tá?” của Lergen.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000146: locks: [''Giữ cấp
    bậc “Đại tá von Lergen”, đại từ trần thuật “nó” / “mình” theo DEC-P01-001 và hành
    động nghiền ngẫm từ ngữ vừa lướt qua tâm trí để xác nhận cảm giác kỳ lạ.'']'
  non_canon: true
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN03/Text/chapter001_002.xhtml/p000147: locks: [''Giữ thuật
    ngữ “Tính hiệu quả chi phí tệ đến mức đáng ngờ.” và câu hỏi nội tâm kết lô “Liệu
    họ có thực sự đầu tư nhiều đến thế chỉ để đạt được mục tiêu đơn lẻ này không?”
    ở dạng văn bản phẳng không in nghiêng theo DEC-P01-002.'']'
  non_canon: true
