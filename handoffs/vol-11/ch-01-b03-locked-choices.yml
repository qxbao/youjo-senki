segment_id_end: YS-LN11/Text/chapter002.xhtml/p000096
choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông' – 'mình' (quy chiếu Zettour), sự đối
    lập với thực tại và nhận định phủ định 'Chẳng có vinh quang nào trong việc trở
    thành một vị tướng cấp cao hơn chỉ để đứng nhìn sự diệt vong không thể tránh khỏi
    của đất nước mình cả'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc nhận định ngắn gọn về sự tàn nhẫn của số phận ('Đó
    là một bài học về việc số phận có thể tàn nhẫn đến nhường nào.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' (Zettour), 'mình', 'ông ấy' (người bạn cũ / Rudersdorf)
    và hình ảnh mỉa mai 'nhận thêm một ngôi sao vô nghĩa lên vai mình'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ 'ông', ẩn dụ 'bọc câu nói đùa sâu
    cay của mình trong một lớp vỏ lịch thiệp đẹp đẽ' và nhận định 'Hơn bất kỳ ai khác,
    ông hoàn toàn có quyền buông đôi lời than vãn'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'ông', tên riêng 'Rudersdorf', quân hàm 'đại
    tướng' ở câu đầu, danh từ chung 'vị tướng' ở câu sau và ý mỉa mai nhường lại danh
    hiệu vị tướng ít xứng đáng nhất lịch sử cho Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại đổ lỗi ngắn gọn ('Đó là lỗi của cuộc chiến này.'),
    tên riêng 'Zettour', đại từ 'ông ta' (chỉ Rudersdorf) và sự tương phản giữa những
    khía cạnh đã thay đổi với bản tính phủ nhận trách nhiệm cá nhân vẫn trước sau
    như một."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', phủ định 'Thực ra đó chẳng phải là lỗi của
    ai cả', cụm 'mùa xuân cũng đã tới với cánh chuyên gia chiến tranh chúng ta' và
    mệnh đề nhượng bộ về việc không được lòng 'hoàng gia hay giới chính khách'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn lặp lại hình ảnh ẩn dụ ('Mùa xuân ư?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh 'Mùa xuân của cái chết đen', đại từ 'Ông' và hai câu
    hỏi gợi ý nghỉ ngơi/trút bỏ gánh nặng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 duy nhất ở cụm '*người yêu
    nước*', định danh 'Đế quốc', thuật ngữ 'chiến tranh tổng lực', hình ảnh 'đứng
    trên một ngọn núi xác người' và ẩn dụ 'thứ bùi nhùi đang nuôi sống ngọn lửa dữ
    dội của cuộc chiến tranh tổng lực này chính là lớp thanh niên của đất nước họ'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ', ẩn dụ ném thêm 'nhiên liệu quý giá' giữ lửa chiến
    tranh, hình ảnh 'rải khắp lục địa xác của những đứa con đất nước', hai câu hỏi
    tu từ truy vấn mục đích hy sinh và thuật ngữ 'chủ nghĩa chủ bại'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', 'chúng ta' và hai câu hỏi đối lập giữa việc tiếp
    tục 'vũ điệu tử thần' của những bộ xương khô với việc 'chuẩn bị quay trở về nghĩa
    địa'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000083
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', địa điểm 'trung tâm chỉ huy' và chi tiết
    thầm cầu nguyện người bạn cũ 'khép lại đôi tay đang dang rộng đến mức không tưởng
    kia'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', 'chúng ta', cấp bậc và tổ chức 'đại tướng của
    Lục quân Đế quốc', cùng câu hỏi phản vấn khẳng định quyền quyết định ('Giờ chúng
    ta mới là những người đưa ra quyết định, chẳng phải sao?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ tự quy chiếu 'mình' và phủ định
    'thậm chí chẳng thể giả vờ rằng mình là một người tốt được nữa'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000086
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', 'mình', các khái niệm 'Tổ quốc' và 'Heimat' (giữ
    nguyên chữ thường không in nghiêng), cùng chuỗi ba câu chốt về bổn phận kết thúc
    chiến tranh ('Ông sẽ kết thúc nó như thế nào. Nó sẽ kết thúc ra sao.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000087
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ 'Ông', 'mình', thuật ngữ 'quân nhân
    chính trị', mục tiêu giảm thiểu đau đớn cho những giây phút cuối của đất nước
    và hành động quan sát người đối diện nhả khói xì gà."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000088
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' (Zettour), tên riêng 'Rudersdorf' và chi tiết vẻ
    mặt mệt mỏi khi kiên nhẫn chờ lời đáp trả của bạn cũ."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ 'Tôi', 'chúng ta', khái niệm 'Tổ
    quốc', cách gọi trần thuật 'Kẻ ngốc ấy' (chỉ Rudersdorf) và chi tiết 'điếu xì
    gà kẹp giữa hai làn môi cùng ánh mắt đầy kiên định'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'các Đại tướng của Đế chế', cặp đại từ 'Ông và tôi'
    và ẩn dụ 'những bánh răng trong cỗ máy hướng tới chiến thắng này'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ông và tôi' và lời châm biếm về 'hai chiếc bánh
    răng đang kiêu hãnh trưng ra những ngôi sao đổi bằng cái chết của lớp thanh niên
    đất nước mình'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000092
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', 'chúng ta', cấu trúc phủ định kép 'không giả vờ
    như tay chúng ta không nhuốm máu của họ', mệnh đề nhượng bộ về thất bại không
    thể tránh khỏi, định danh 'những người lính của Đế quốc' và ý 'lật ngược cái điều
    không thể tránh khỏi ấy một hai phen trước khi tính đến chuyện tung khăn trắng
    đầu hàng'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu độc thoại
    nội tâm '*Chết tiệt thật. Ông ta nói đúng.*' và đại từ 'Ông ta' quy chiếu Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Ông lão' (chỉ Zettour), đại từ 'mình' và hành động
    'nở một nụ cười chua chát trước khi lắc đầu để xua đi nỗi tuyệt vọng của mình'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', 'chúng ta', tên riêng 'Rudersdorf' và câu hỏi
    mỉa mai về 'đế quốc của người chết'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000096
  kind: terminology_and_voice
  value: 'locks=["Khóa định danh ''Đế quốc'', đại từ ''họ'', vị thế ''hai vị tướng
    có quân hàm cao nhất cả nước'', hình ảnh điều hành vở kịch thảm họa từ sau bàn
    giấy và nghịch lý kết đoạn: việc thẳng thắn bàn thảo về sự sụp đổ sắp tới là cấp
    thiết nhưng họ vẫn từ chối chấp nhận thất bại."]'
