choices:
- segment_id: YS-LN11/Text/chapter006.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn hồi ký ngôi thứ nhất 'Tôi' – 'độc giả', định danh
    'Ildoa', đại từ 'họ' chỉ người dân Ildoa và hình ảnh 'cất cao khúc ca hòa bình';
    không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', đại từ khái quát 'người ta', phủ định 'không
    có các trạm kiểm tra' và thuật ngữ 'tắt đèn phòng không trong các đợt oanh tạc
    của máy bay ném bom'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại '*trung lập*'; khóa
    đại từ 'tôi' – 'bản thân mình' – 'họ', định danh 'Đế quốc', 'công dân Đế quốc',
    'Ildoa' và phép ví von 'thế giới mùa xuân vĩnh cửu'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'họ', định danh 'độc giả người Ildoa' và tình
    thái nghi ngờ 'tôi e rằng chẳng độc giả người Ildoa nào lại vui vẻ'; không có
    nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'họ', định danh 'chính phủ Ildoa' / 'người dân
    Ildoa', và ý bảo vệ giới quan chức trước những chỉ trích chỉ mang tính phán xét
    sau khi sự việc đã ngã ngũ; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại từ '*điều trị*'
    đầu tiên (không in nghiêng vế 'phòng bệnh bao giờ cũng hơn chữa bệnh' phía sau);
    khóa phủ định kép 'không phải là không có những tổn thất nặng nề', định danh 'Đế
    quốc' và 'Ildoa'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000083
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình', định danh 'người Ildoa' và sự tương phản
    giữa tính chất công vụ chính thức với màu sắc cá nhân của hoạt động ngoại giao;
    không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'họ', định danh 'Ildoa' và nhận định về ý nghĩa
    biểu trưng của quà tặng ngoại giao đối với vị thế, sức mạnh quốc gia; không có
    nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', phủ định 'không thể thua kém' và sự đối
    chiếu với món quà của đối tác phía bên kia; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000086
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tập thể 'chúng tôi' (phía Đế quốc) và mục đích giữ thể
    diện, duy trì vẻ bề ngoài của một siêu cường; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000087
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình', phủ định 'không phải là một nhà ngoại
    giao chuyên nghiệp' và áp lực phải chuẩn bị quà tặng xứng tầm; không có nhấn mạnh
    Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000088
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại '*cử chỉ thiện ý
    nhỏ*'; khóa quân hàm – nhân vật 'Đại tá Calandro', định danh 'Ildoa', đại từ 'ông
    ấy' (Calandro) – 'tôi' / 'mình' (Lergen)."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', cơ quan 'Bộ Tổng tham mưu', chuỗi phủ định 'Vấn
    đề không nằm ở ngân sách' / 'chẳng còn món quà hiện vật nào để mà mua nữa' / 'không
    thể cứ thế mò ra chợ đen rồi tiêu tiền công quỹ ở đó được'; không có nhấn mạnh
    Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'độc giả' – 'Họ', định danh 'hoàng cung
    của Đế quốc cũ', 'Bộ Ngoại giao', và phép so sánh hiệu quả chi phí giữa 'các cuộc
    tiến công ngoại giao' với 'chiến tranh tổng lực'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', định danh 'hoàng cung' và 'Bộ Ngoại giao', cùng
    chi tiết phát hiện kho dự trữ rượu vang còn sót lại trong hoàng cung; không có
    nhấn mạnh Markdown."]
