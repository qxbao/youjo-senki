choices:
- segment_id: YS-LN11/Text/chapter006.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn hồi ký ngôi thứ nhất 'tôi', địa danh 'mặt trận phía
    đông', tên đơn vị 'Kampfgruppe' (không in nghiêng), định danh 'Liên bang', thuật
    ngữ 'xe tăng chiến đấu chủ lực', chi tiết 'một sĩ quan còn quá đỗi non trẻ' và
    nhận định 'Chiến tranh càn quét qua lớp người trưởng thành của một quốc gia, buộc
    những đứa trẻ của đất nước ấy phải đứng ra thế chỗ họ'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000029
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'chúng tôi', sự đối lập giữa việc đọc
    báo cáo với 'tận mắt chứng kiến hàng thật lại đáng giá bằng cả triệu bản báo cáo',
    vũ khí 'mìn xung kích gắn sào', cấp bậc 'đại tá' và nhận thức 'hình dung về chiến
    tranh trong đầu tôi cũng đã lỗi thời từ lâu'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', chủ thể khái quát 'Người ta', thuật ngữ 'súng
    trường chống tăng', 'pháp sư trên không', 'pháo cỡ nòng lớn', cùng sự tương phản
    giữa những chiếc xe tăng quen thuộc như 'những món đồ chơi' với 'quái vật khổng
    lồ tôi nhìn thấy trên chiến trường'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000031
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'cánh sĩ quan chúng tôi', địa điểm 'nơi
    tiền tuyến' đối lập với 'hậu phương', và sự khác biệt giữa thế giới trong báo
    cáo với 'thế giới thực, nơi những người lính đang phải dùng mìn gắn trên gậy để
    thổi bay lớp giáp khỏi xe tăng'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'chúng tôi', mệnh đề nhượng bộ phủ định 'Dù tôi
    khó lòng gọi chúng tôi là những kẻ may mắn', tác động của 'những cảnh tượng địa
    ngục ấy' giúp bám sát thế giới thực, và phủ định tương phản ở câu cuối ('cũng
    có rất nhiều người trong chúng tôi sẽ chẳng bao giờ nhận ra điều này, bất chấp
    việc đang đứng ngay trên chiến trường…'); không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'chúng tôi', thuật ngữ 'Heimat' (không
    in nghiêng), sự thất bại khi cố thức tỉnh các đồng cấp ở hậu phương ('nhưng chẳng
    mấy hiệu quả'), lòng biết ơn những người đã giúp sức, và cấu trúc liệt kê ba nhóm
    người hiến dâng tất cả vì quốc gia (người bỏ mạng thành con số thống kê, người
    gánh tiếng phản quốc trong lịch sử, người hiến dâng mọi thứ cho Heimat); không
    có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', cách gọi người đọc 'độc giả' – 'quý vị',
    nghĩa sống sót sau khi những người anh em đồng đội đã ngã xuống, lý do 'ấy là
    bởi quý vị đã không ở đó' và ẩn dụ 'sự sáng suốt của tôi giống một lời nguyền
    hơn bất cứ thứ gì khác'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'Tôi và những người xung quanh' / 'chúng tôi', ẩn dụ
    'tiếng bước chân của sự sụp đổ đang ngày một đến gần', phủ định kép 'chẳng có
    đường nào để chạy trốn, hay thậm chí là nghĩ ra cách để chống trả' và nhận định
    'những tháng ngày đen tối không lối thoát'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa tên cơ quan 'Bộ Ngoại giao', định danh 'hai vị đại tướng, Zettour
    và Rudersdorf', tổ chức 'lục quân', quốc gia 'Đế quốc', đại từ 'chúng tôi' – 'tôi',
    lý do giữ bí mật nỗ lực chấm dứt chiến tranh, và câu chốt 'Và tôi… là một trong
    số ít ỏi những người thừa hành ấy'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'chúng tôi' – 'mình', đại từ ngôi thứ ba 'ông'
    (quy chiếu Conrad), cụm 'nhà ngoại giao Đế quốc có năng lực và chân thành', định
    danh 'Tham tán Conrad', cách gọi 'chiến hữu' và bối cảnh 'khi tôi bước vào cuộc
    đàm phán với Ildoa'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Đại tá Lergen', đại từ tự xưng 'tôi' của Conrad và
    lời mở đầu đề nghị đưa ra một vài gợi ý; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Tham tán Conrad', cụm 'Nhà ngoại giao chuyên nghiệp
    ấy', 'vẻ thanh lịch thời tiền chiến' và 'phong thái quý tộc của mình'; không có
    nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa các nhận định tương phản về bản chất của ngoại giao ('trông
    có vẻ linh hoạt, nhưng thực chất lại khá cứng nhắc', 'nhìn chung nó cũng luôn
    biến chuyển không ngừng') và nguyên lý cốt lõi 'một sự cân bằng tinh tế giữa công
    lý và sự đền bù thỏa đáng'; không có nhấn mạnh Markdown."]
