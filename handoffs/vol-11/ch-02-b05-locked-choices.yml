choices:
- segment_id: YS-LN11/Text/chapter006.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn hồi ký ngôi thứ nhất 'tôi' – 'mình', danh xưng 'vị
    tướng ấy' cùng đại từ 'ông' quy chiếu Tướng Zettour, cấu trúc phủ định kép 'dù
    không phải là không có những trăn trở' và tương quan so sánh 'bớt tự hào về tài
    năng của bản thân hơn và lại càng trân trọng hơn'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại '*sự tất yếu*';
    khóa đại từ 'ông' (Zettour) – 'tôi' (Lergen), hai danh xưng 'Đế chế' và 'Heimat'
    (không in nghiêng), và câu hỏi nội tâm khắc khoải đến cuối đời ('Liệu đây là một
    điều tốt hay một sai lầm')."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', sự chuyển mạch hồi ký ('Dù sao thì tôi
    cũng hơi lạc đề rồi') và cách hiểu lời khuyên của Conrad như 'một bài học vỡ lòng
    về cách đạt được một thỏa thuận'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Ildoa', đại từ 'họ' – 'chúng ta' và phép ẩn dụ 'Những
    nguyên liệu mà họ đặt lên bàn cân của mình đôi khi sẽ khác với chúng ta'; không
    có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'chúng tôi' – 'ông', định danh 'Tham tán Conrad',
    phủ định 'không có chung cách nhìn' / 'chẳng hề nể nang tôi', tình thái phỏng
    đoán 'hẳn vẫn' và phép so sánh với 'một vị giáo sư kiên nhẫn giảng giải cặn kẽ
    bài học cho một cậu học trò kém cỏi'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa cặp mệnh đề đối xứng 'Nếu chiến tranh là hiện thực ở hình thái
    chân thực nhất, thì ngoại giao lại là ảo mộng ở hình thái chân thực nhất', xưng
    hô 'Tôi' – 'ông' và hình ảnh ẩn dụ 'chiếc bàn cân'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000066
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'ông' – 'các sĩ quan tham mưu chúng
    tôi', danh xưng 'Đế chế', lời tự nhận về 'một khiếm khuyết bẩm sinh' và phủ định
    'Bản thân tôi cũng chẳng phải ngoại lệ gì về khoản này'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tập thể 'chúng tôi' ('các sĩ quan tham mưu chúng tôi'),
    sự đảo ngược mệnh đề Clausewitz do nhãn quan quân sự ('đặt chiến tranh lên trước
    chính trị. Đối với chúng tôi, chính trị chỉ đơn thuần là một phần khác của chiến
    tranh'); không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'chúng tôi', định danh 'Tham tán Conrad' và sự
    đối lập giữa 'trí tuệ sắc bén' của Conrad với 'sự ngu xuẩn vô bờ bến' của giới
    sĩ quan tham mưu; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'ông', tình thái biểu kiến 'trông tôi có vẻ như
    đã tiếp thu lời khuyên của ông' và cử chỉ khích lệ của Conrad; không có nhấn mạnh
    Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô 'Tôi' – 'ông', đại từ tập thể 'chúng tôi' (ngành ngoại
    giao) và sự phân vai 'Nếu lục quân có thể mở đường cho chúng tôi, chúng tôi sẽ
    lo liệu phần còn lại'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô 'Ông' – 'tôi' – 'mình' và phép ví von với 'lực lượng
    thiết giáp trong một đơn vị bộ binh cơ giới'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa hai vị trí nhấn mạnh Markdown theo DEC-P01-002 tại '*Xe tăng*'
    và '*người lính bộ binh*'; khóa đại từ 'Tôi' – 'mình', thuật ngữ 'lục quân', 'mặt
    trận phía đông', 'Kampfgruppe' (không in nghiêng) và nhận định kết đoạn về vai
    trò của con người."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'ông', định danh 'Tham tán Conrad',
    'Thượng đế', 'Ildoa', phép đối lập quy mô giữa 'cả một sư đoàn' và 'cả một quân
    chủng hoàn toàn mới', cùng châm ngôn quân sự 'Thượng đế luôn mỉm cười với phe
    có nhiều quân hơn'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' – 'bản thân', định danh 'Ildoa', thuật
    ngữ 'mũi nhọn thiết giáp', giả định 'nếu tình hình dẫn tới mức đó' và sự phân
    biệt giữa 'tuyến đường thực tế' với cảm nhận không thuộc về 'mặt thể chất'; không
    có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', thuật ngữ 'tuyến đường sắt quốc tế', định danh
    'Đế quốc' và 'Ildoa', cùng sự tương phản trực tiếp giữa trạng thái rung lắc của
    đoàn tàu ở hai bên biên giới; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa đại từ khái quát 'người ta', định danh 'Đế quốc' và 'Ildoa',
    hình ảnh 'một người yêu nước trẻ tuổi cảm thấy phát bệnh' và cảnh tượng đối lập
    khi tàu qua dãy núi biên giới ('cả một thế giới hoàn toàn mới—một thế giới rực
    sáng những ánh đèn'); không có nhấn mạnh Markdown."]
