- segment_id: YS-LN11/Text/chapter004.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya: xưng ''Tôi'', ''quân của mình''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Tên gọi và đại từ: ''Tướng Zettour'', ''Ông ấy''; sửa ''quanh
