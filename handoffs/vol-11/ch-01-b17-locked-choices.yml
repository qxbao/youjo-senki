- segment_id: YS-LN11/Text/chapter004.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: gọi ''Ngài'', xưng
    ''tôi'', kết câu hỏi bằng ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: ''Vị cấp trên của mình'' theo DEC-P01-001."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ trong thoại của Zettour: ''Chúng ta'', ''Rudersdorf'',
    ''Đại tá Lergen'', ''thỏa thuận hòa bình với Ildoa''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phủ định tu từ của Tanya: ''Chẳng phải... sao ạ?'', quy
    chiếu Rudersdorf là ''ông ta'' và Lergen là ''vị đại tá''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta'', ''mình''; quy chiếu Rudersdorf là
    ''ông ta''.", "Quân hàm và tên riêng: ''Tướng Rudersdorf'', ''Đại tá Lergen'',
    ''Tướng Zettour''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Phủ định và đối lập trong thoại của Zettour: ''không nằm ở năng
    lực của Đại tá Lergen… mà là ở chỗ cậu ta đứng về phía nào''.", "Giả định trái
    thực tế: ''Nếu thực sự tin tưởng vị đại tá, hẳn ông ta đã giao cho cậu ta phụ
    trách khâu chuẩn bị cho Kế hoạch B...''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Tanya: giữ rõ chủ thể ''vị đại tá'' (Lergen)
    và ''ông ta'' (Rudersdorf), có ''ạ'' cuối câu."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: giữ ''*Chính xác.*'' khớp với thẻ <em> trong
    XHTML gốc theo DEC-P01-002.", "Tên gọi và đại từ: ''Tướng Zettour''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: xưng ''Tôi'', quy chiếu Rudersdorf
    là ''ông ta''.", "Địa danh: ''mặt trận phía đông''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật quy chiếu Zettour: ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''Thưa ngài'', xưng
    ''tôi'', giữ dấu chấm lửng ngập ngừng cuối câu."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: gọi ''Cô'', giữ phủ
    định ''không cần phải nói ra đâu''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn và đại từ nội tâm: ''Vị cấp trên đang mỉm cười của mình'',
    quy chiếu Zettour là ''ông ấy''.", "Thuật ngữ: ''sĩ quan Đế quốc'', ''Liên bang''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong câu hỏi của Zettour với Tanya: gọi ''cô'', xưng
    ''tôi'', giữ đúng chủ thể người thực hiện ''phần việc bẩn thỉu'' là Zettour."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm tự quy chiếu của Tanya: ''Mình''; quy chiếu ''Tướng
    Zettour'' là ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Đại từ quy chiếu Zettour: ''ông ấy''; đổi ''bạn thân nhất của
    mình'' thành ''bạn thân nhất của ông ấy'' để tránh trùng đại từ nội tâm ''mình''
    của Tanya.", "Giữ dấu chấm lửng và cụm trích dẫn trong câu ''khẽ thì thầm “được
    thôi”''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: ''Chúng ta''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Giữ nhịp câu ngắn khẳng định trong độc thoại nội tâm: ''Đó lại
    là phần dễ dàng.''"]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''chúng ta'', ''Ngài'',
    ''ạ''; quy chiếu Rudersdorf là ''ông ta''.", "Địa danh và từ vựng: ''miền đông'',
