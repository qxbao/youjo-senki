- segment_id: YS-LN11/Text/chapter004.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Giữ sắc thái tán đồng thản nhiên của Zettour: ''Những vụ như thế
    thi thoảng vẫn xảy ra.''"]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Giọng mỉa mai lịch sự của Tanya: ''Vâng. Sẽ thật đáng tiếc biết
    bao nếu xảy ra một sự cố bảo dưỡng.''"]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta''.", "Thuật ngữ: ''mạng lưới vận tải
