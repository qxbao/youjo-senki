- segment_id: YS-LN11/Text/chapter004.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn của Zettour: ''Chuyện gì?''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: tự quy chiếu ''Mình'', gọi Zettour trong độc
