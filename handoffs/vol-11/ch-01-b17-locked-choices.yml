- segment_id: YS-LN11/Text/chapter004.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật quy chiếu Zettour: ''Ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000148
