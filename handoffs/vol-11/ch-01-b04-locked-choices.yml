choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ', cụm danh từ 'Các sĩ quan tham mưu cao cấp', hình
    ảnh 'cuộc tử thủ cuối cùng của họ để chống lại thực tại' và mệnh đề phủ định 'không
    thể nào tạo ra thứ gì đó từ hư không được'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ 'tài phù phép của giới tham mưu cao cấp', mệnh đề quan
    hệ phủ định 'một phép màu vốn không thể tồn tại ấy', cách gọi 'giống loài được
    gọi là các sĩ quan bộ tổng tham mưu' và hành động 'tự vực mình đứng dậy'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa cụm chuyển ý ngắn gọn 'Ấy thế mà…'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' (Zettour gọi Rudersdorf), tên riêng 'Ildoa' và
    thành ngữ 'bóp chết Ildoa từ trong trứng nước khi vẫn còn có thể'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' – 'mình', tên riêng 'Zettour' và phạm vi nhấn mạnh
    Markdown theo DEC-P01-002 duy nhất ở cụm '*chính xác là vậy*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Rudersdorf', 'Ildoa', đại từ 'chúng ta', 'họ', thuật
    ngữ 'lý tính nhà nước' (raison d’état), tên 'Kế hoạch B' và nhận định nên tập
    trung xử lý 'lũ đần độn trong chính đất nước chúng ta'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' (Rudersdorf gọi Zettour), 'chúng ta', 'họ', tên
    riêng 'Ildoa', định danh 'Đế quốc', hình ảnh 'cái gai bên sườn Đế quốc' và mệnh
    lệnh phủ định 'Ông không được phép phớt lờ những hệ lụy địa chính trị'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và lời thừa nhận ngắn gọn 'Điểm đó thì ông nói
    đúng…'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông' (Zettour) và cấu trúc phủ định kép 'không
    quên bổ sung thêm một lời chú giải trong thâm tâm'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000106
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu nội tâm
    '*Sự sụp đổ mà ông ta lo sợ đến thế giờ đây đã là điều không thể tránh khỏi rồi.*'
    và đại từ 'ông ta' quy chiếu Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' (Zettour), cụm 'cái gã ngốc Rudersdorf này', tên
    'Kế hoạch B' và câu điều kiện giả định về việc làm gia tăng rủi ro nếu tiếp tục
    ám ảnh với chiến thắng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ta' (Rudersdorf), 'họ', mục tiêu kép 'thống nhất
    giới lãnh đạo đất nước và đảm bảo an toàn cho biên giới phía nam của họ', cùng
    sự đối lập giữa lý thuyết và khả năng thực hiện trên thực tế."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi phản vấn giữ hình ảnh ẩn dụ chiếc bánh ('Tất cả chuyện
    này chẳng phải hơi giống một chiếc bánh vẽ trên trời hay sao?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', danh xưng 'các sĩ quan tham mưu cao cấp'
    và hình ảnh đối đáp 'nướng ra một chiếc bánh có thể ăn được'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', đại từ 'ông' và chi tiết 'một cảm
    giác khó tả dâng trào trong lòng'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa tình thái suy đoán thận trọng 'những dấu hiệu mơ hồ cho thấy
    có thể đang có sự rò rỉ thông tin trong một bộ phận nhỏ của lục quân'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa hai khả năng rò rỉ ('do gián điệp hay chỉ đơn thuần là một sai
    sót trong hệ thống mật mã của họ'), tên riêng 'Zettour', định danh 'Đế quốc' và
    hệ quả phải chiến đấu với những sự gò bó đáng kể."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa tên tổ chức 'Bộ Tổng tham mưu', cấu trúc giả định 'Nếu Bộ Tổng
    tham mưu áp đặt đường lối đặt chiến thắng lên trên hết thảy' và tình thái 'có
    lẽ sẽ không còn mấy hiệu quả trong việc tìm kiếm một con đường sinh tồn'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu cảm thán
    nội tâm '*Chúa ơi. Ôi, Chúa ơi.*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu '*Ngài đúng
    là một tên khốn nạn đốn mạt, thật sự đấy.*' và đại từ ngôi thứ hai 'Ngài' (Zettour
    gọi Chúa)."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu mệnh lệnh
    nội tâm '*Hãy trả lại những lời cầu nguyện của tôi.*' và đại từ 'tôi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu mệnh lệnh
    nội tâm '*Hãy trả lại niềm hy vọng của tôi.*' và đại từ 'tôi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu '*Ngài đã
    ban cho chúng tôi một định mệnh hoàn toàn chẳng có lấy một chút từ bi.*' và cặp
    đại từ 'Ngài' – 'chúng tôi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu '*Ngài đang
    đùa bỡn với chúng tôi.*' và cặp đại từ 'Ngài' – 'chúng tôi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu hỏi nội
    tâm '*Ngài định hủy diệt đất nước chúng tôi bằng một kiểu can thiệp thần thánh
    nào đó sao?*' và cặp đại từ 'Ngài' – 'chúng tôi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000122
  kind: terminology_and_voice
  value: locks=['Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu nội tâm
    ngắn ở p000122 và dấu chấm lửng mở đầu.']
- segment_id: YS-LN11/Text/chapter002.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ mệnh đề giả
    định '*Nếu đó là cách mà mọi chuyện buộc phải kết thúc.*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngắn 'Ông mỉm cười.' (không in nghiêng, đại từ
    'Ông' chỉ Zettour)."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu '*Chúng
    tôi sẽ chấp nhận số phận của mình.*' và đại từ 'Chúng tôi' – 'mình'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' – 'mình', thuật ngữ 'Heimat' (giữ nguyên văn bản
    thường không in nghiêng) và câu hỏi tu từ 'Sao lại không trở thành tên khốn nạn
    mà mảnh đất ấy cần ông trở thành cơ chứ?'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000127
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu tâm niệm
    gửi người bạn cũ '*Thứ lỗi cho tôi nhé, bạn của tôi.*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'chúng ta', 'Ông', 'tôi', tên 'Kế hoạch B', cụm 'người
    học trò mà tôi quý trọng nhất' và lời đề nghị 'Hãy đi thẳng vào vấn đề cốt lõi
    đi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', 'Rudersdorf', đại từ 'Ông ta' (chỉ Rudersdorf)
    và hai nhận định ngắn ('Ông ta trông có vẻ nhẹ nhõm. Ông ta vốn không phải là
    một người xấu…')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'Tôi', 'Ông', 'cô ấy' (quy chiếu Tanya) và câu hỏi
    xin ý kiến đưa Tanya vào cuộc thảo luận."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp phủ định ngắn gọn 'Không hề.'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Degurechaff' và mệnh lệnh gọi vào phòng
    họp ('Trung tá Degurechaff, vào đây đi!')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa bước chuyển điểm nhìn sang ngôi thứ nhất của Tanya với đại từ
    tự quy chiếu 'mình' theo DEC-P01-001, danh xưng 'Tướng Rudersdorf', đại từ 'ông
    ấy', địa điểm 'phòng chờ' và cấu trúc tương phản giữa độ vang của giọng nói với
    rắc rối mà nó mang theo."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm của Tanya 'Chắc là có cố trốn chạy thực tại
    thì cũng chẳng ích gì…'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' và chi tiết 'Nét bực dọc thoáng qua
    trên gương mặt mình biến mất hoàn toàn theo phản xạ'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa đại từ khái quát 'Chúng ta', đại từ tự quy chiếu 'Mình', tên
    riêng 'Rudersdorf', ẩn dụ 'đeo nhiều chiếc mặt nạ khác nhau' và hình ảnh tự giễu
    'đúng chuẩn một người lính nhỏ ngoan ngoãn'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình', quan hệ cấp bậc 'cấp trên', chuỗi
    hành động gõ cửa – nhận lời mời sốt ruột – hít sâu – chuẩn bị cất lời chào dõng
    dạc với âm lượng chuẩn mực."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa câu chào điều lệnh 'Trung tá Degurechaff, có mặt nhận nhiệm
    vụ!'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình', cụm 'động tác chào kiểu nhà binh
    vốn đã ăn sâu vào trí nhớ cơ bắp' và hành động 'tiến hành trinh sát sơ bộ căn
    phòng'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000140
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình', nhận định bầu không khí căng thẳng
    đến mức gần như sờ thấy được và sự đối lập giữa dự tính ban đầu khi mở cửa với
    thực tế vượt xa mọi tưởng tượng."]
