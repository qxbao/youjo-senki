choices:
- segment_id: YS-LN11/Text/chapter006.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn hồi ký ngôi thứ nhất 'tôi' – 'mình', đại từ ngôi thứ
    ba 'ông' (quy chiếu Tham tán Conrad), chức danh 'sĩ quan tham mưu', phủ định 'chưa
    từng một lần nghĩ tới chuyện ngoại giao' và tình thái dự báo ở câu cuối ('chắc
    chắn sẽ khiến tôi hoàn toàn bất ngờ'); không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa hai vị trí nhấn mạnh Markdown theo DEC-P01-002 tại '*kẻ gian
    lận*' và '*kẻ lừa đảo*'; khóa giọng thoại lịch thiệp của Conrad và phủ định 'chẳng
    mang bất kỳ ý nghĩa nào trong các công việc ngoại giao'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa ba vị trí nhấn mạnh Markdown theo DEC-P01-002 tại '*Kẻ gian
    lận*', '*Kẻ lừa đảo*' và '*sự tất yếu*'; khóa đại từ 'Tôi' – 'mình', chức danh
    'sĩ quan tham mưu', cùng hai danh xưng 'Đế chế' và 'Heimat' (không in nghiêng)."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', định danh 'Tham tán Conrad' và chi tiết 'vui lòng
    đáp ứng với ánh mắt đầy thấu hiểu'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô 'Tôi' – 'ông' (Tham tán Conrad nói với Đại tá Lergen),
    ẩn dụ 'tận dụng mọi thứ trong kho vũ khí của mình' và sự quy chiếu về 'điểm cân
    bằng mà tôi đã nhắc tới'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'ông' – 'mình', cụm định danh 'nhà ngoại giao
    chuyên nghiệp' và hành động 'bật ra một tràng cười đầy táo bạo'; không có nhấn
    mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'tôi' của Conrad, chuỗi câu hỏi tu từ 'Nói dối
    ư? Gian lận ư? Lừa gạt ư?', phủ định 'Chẳng có thứ nào trong số đó là vấn đề cả'
    và phép so sánh ngoại giao với 'thuật giả kim' trên phương diện 'tạo ra thứ gì
    đó từ hư không'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', danh xưng 'Tướng Zettour', địa danh 'mặt trận
    phía đông' và kết quả 'phép so sánh tương đồng của tôi đã bị bác bỏ ngay tức khắc';
    không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại '*lòng tin*'; khóa
    cặp mệnh đề đối lập 'Chiến tranh là ngoại lệ. Ngoại giao mới là thông lệ.', đại
    từ bao gộp 'chúng ta' và ẩn dụ so sánh mưu kế/mánh khóe chỉ là 'gia vị' còn nguyên
    liệu quan trọng nhất là '*lòng tin*'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu suy nghĩ
    nội tâm hướng tới Conrad '*Chà, giờ thì ông đang tự mâu thuẫn với chính mình đấy.*'
    và câu trần thuật 'Tôi bật cười cùng ông.'"]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' – 'tôi' – 'mình', thuật ngữ 'lòng tin', cảm nhận
    về sự mâu thuẫn ('chẳng thể dung hòa nổi') và thái độ 'hoàn toàn nghiêm túc' của
    Conrad; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ hai 'ông' (Conrad gọi Lergen), thuật ngữ 'lòng
    tin' và hình ảnh ẩn dụ nấu nướng ('dù là một con người hay một món đồ—trộn nó
    vào nồi rồi dọn ra cho họ'); không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', sự chuyển hóa hình ảnh 'lòng tin' từ
    'nguyên liệu' của nhà ngoại giao sang 'thứ vũ khí' của người lính, và nhận định
    kết đoạn về việc 'một lương tâm tốt đẹp lại thường bị những đòi hỏi của thực tế
    phản bội'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'chúng tôi' (Lergen và Conrad) – 'chúng ta' (toàn
    thể Đế quốc), định danh 'Tham tán Conrad', thuật ngữ 'chiến tranh nóng', sự phân
    biệt trực tiếp 'Đế quốc—Đế chế nay không còn tồn tại nữa', thuật ngữ 'Heimat'
    (không in nghiêng), lời cầu nguyện 'Hỡi các bậc tiền nhân. Xin hãy để những người
    anh hùng không có tiếng nói ấy được yên nghỉ.' và quyết tâm chấm dứt sai lầm;
    không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình' – 'ông', định danh 'Tham tán Conrad',
    hình ảnh 'một sĩ quan sắp sửa bước vào trận chiến của riêng mình' và cụm 'những
    lời lẽ rõ ràng như pha lê'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa ba vị trí nhấn mạnh Markdown theo DEC-P01-002 tại '*chính đáng*',
    '*công bằng*' và '*tin tưởng*'; khóa đại từ ngôi thứ hai 'ông' và thuật ngữ 'lòng
    tin'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa sự phân tách điểm nhìn thời gian giữa hiện tại hậu chiến ('giờ
    đây tôi mới biết rằng') và quá khứ lúc đàm phán ('hồi ấy', 'vào thời điểm đó'),
    định danh 'Tham tán Conrad' / 'người bạn thân mến Conrad của mình', ẩn dụ 'những
    hành khách trên cùng một con thuyền không may bị kẹt giữa cơn bão này' và phủ
    định 'tôi đã không thể nhận ra những ẩn ý mà ông trao cho mình'; không có nhấn
    mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' – 'mình', thuật ngữ 'lòng tin', 'Đối tác phía bên
    kia' và nhận định cốt lõi 'Tất cả những gì còn lại chỉ là lợi ích của từng quốc
    gia tương ứng'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình' – 'ông' – 'đất nước chúng ta', thuật ngữ
    'diễn tập binh cờ' đối sánh với 'thực chiến', chức danh 'Các sĩ quan tham mưu'
    và biệt danh chốt đoạn 'Hung thần Zettour'; không có nhấn mạnh Markdown."]
