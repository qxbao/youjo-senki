segment_id_end: YS-LN11/Text/chapter002.xhtml/p000220
choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000194
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn từ lối tự nhắc tên ngôi thứ ba 'Tanya'
    – 'cô' sang đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001, phủ định 'mình
    chẳng có chỗ nào để trốn thoát cả' và chi tiết đứng nghiêm hứng khói thuốc thụ
    động chờ hai cấp trên lên tiếng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000195
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' kết hợp lối tự nhắc tên 'Tanya', hình ảnh ẩn dụ
    'hai cỗ máy nhả khói', danh xưng 'Tướng Rudersdorf' và chi tiết ông là người đầu
    tiên phá vỡ sự im lặng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000196
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', thuật ngữ 'Kế hoạch B' và lời đề nghị bày
    hết mọi chuyện ra bàn để thảo luận thẳng thắn của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000197
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', đại từ 'Chúng ta' và lời tán đồng
    thẳng thắn giữa hai người bạn của Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000198
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' – 'mình', quyết định phải xen vào
    ngay lập tức và tình thái hy vọng mong manh nếu gặp may."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000199
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' kết hợp lối tự nhắc tên 'Tanya', đại từ 'họ' và
    tính toán giữ giọng điệu vừa khiêm nhường vừa chân thành để xin rút lui."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000200
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' cùng tiểu từ kính ngữ 'ạ' trong câu hỏi dè dặt
    xin phép rút lui của Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000201
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu
    thoại giả định ở đầu đoạn ('*Không, chuyện này vượt quá cấp bậc của cô rồi, Trung
    tá.*'), đại từ 'cô', quân hàm 'Trung tá' và câu hỏi tu từ nội tâm ở vế sau."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000202
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 cho câu đầu ('*Vààà
    ông ấy đang mỉm cười.*'), định danh 'Bộ Tổng tham mưu' và 'Thượng đế', cùng nhận
    định mỉa mai về nụ cười của Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000203
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 cho câu đầu ('*Cô
    không cần phải lo chuyện đó đâu.*'), danh xưng 'Tướng Zettour' và 'Tướng Rudersdorf',
    đại từ 'Cô' – 'mình' – 'Ông ấy' và hành động vỗ mạnh vào lưng báo hiệu số phận
    của Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000204
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi quân hàm 'Trung tá', định danh 'Văn phòng Bộ Tổng tham
    mưu', đại từ 'Cô' – 'cô' và lời khẳng định tiểu đoàn của Tanya sẽ là trọng tâm
    của chiến dịch."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000205
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' và sự tương phản mỉa mai giữa nhận
    xét 'ý tưởng khôi hài' với bản năng tự bảo toàn muốn hét toáng lên."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000206
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ đoạn
    độc thoại nội tâm ('*Trọng tâm của Kế hoạch B ư? …Chết tiệt thật chứ.*') và thuật
    ngữ 'Kế hoạch B'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000207
  kind: terminology_and_voice
  value: locks=["Khóa dấu chấm lửng mở đầu, đại từ 'tôi' kèm kính ngữ 'ạ' và cấu trúc
    tình thái vòng vo đầy miễn cưỡng ('Có lẽ tôi nên bày tỏ rằng việc được ở vào một
    vị trí như vậy sẽ là niềm vinh dự của tôi ạ.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000208
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' và quan hệ đối lập giữa vô số điều
    muốn nói của kẻ bị lùa vào mớ bòng bong với giới hạn cấp bậc chỉ cho phép dùng
    lời lẽ mơ hồ."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000209
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' và trạng thái vắt óc tìm cớ rút lui."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000210
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' – 'mình', thuật ngữ 'tấm ván của Carneades', định
    danh 'phe Cộng sản' và mức độ cực đoan của giả định sẵn sàng dùng mọi cái cớ hoặc
    thề trung thành ở bề ngoài để khỏi tự ký vào bản án tử."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000211
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề phủ định ở câu đầu và đại từ tự quy chiếu 'Mình' trong
    câu cảm thán chấp nhận thực tại ở câu sau."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000212
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi quân hàm 'Trung tá', cặp đại từ 'Tôi' – 'cô', câu hỏi
    phủ định ('Cô không thấy hào hứng sao?') và ý định giao nhiệm vụ vinh dự bậc nhất
    của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000213
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', đại từ 'mình' – 'Mình' kết hợp
    lối tự nhắc tên 'Tanya' – 'cô', thuật ngữ 'động vật chính trị', câu trả lời phủ
    định dứt khoát theo bản năng tự bảo toàn và nhận thức rằng trốn tránh là tự sát
    về cả mặt xã hội lẫn hành chính."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000214
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình', định danh 'Being X' và nhận định quy kết hiện
    thân của cái ác đứng đằng sau tình cảnh nan giải này."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000215
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'những con người chúng ta', lối tự nhắc tên 'Tanya', danh
    xưng 'Tướng Zettour' và sự chuyển tiếp sang việc Zettour đứng ra gánh vác trách
    nhiệm dọn dẹp hậu quả do đám tự xưng là thần thánh bày ra."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000216
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Rudersdorf', các đại từ 'chúng ta' – 'tôi' – 'ông'
    và lời châm biếm của Zettour nhằm giải vây cho cấp dưới."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000217
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', danh xưng 'Tướng Rudersdorf', hình ảnh ẩn dụ
    'Hỏa lực pháo binh chi viện hạng nặng' và mệnh đề phủ định nhận định Rudersdorf
    sẽ không chịu nhượng bộ."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000218
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Zettour', cách gọi thân mật của tướng lĩnh cấp cao
    'con bé' (chỉ Tanya) và yêu cầu Tanya phải trực tiếp trả lời câu hỏi."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000219
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' – 'Mình', danh xưng ngôi thứ hai 'các ngài' và
    chuỗi phủ định liên tiếp thể hiện sự phản kháng tuyệt vọng trong nội tâm của Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000220
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'cô', quan hệ nhượng bộ ('dù có thể cô cần
    chút thời gian để sắp xếp lại cảm xúc của bản thân') và lời cảnh báo có điều kiện
    phủ định ở cuối câu ('sẽ rắc rối đấy nếu cô không thể trả lời')."]
