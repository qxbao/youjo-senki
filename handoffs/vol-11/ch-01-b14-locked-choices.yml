    thể để mất các lãnh đạo cấp cao một cách dễ dàng như thế, chứ đừng nói đến chuyện
    vứt bỏ họ'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000050
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; pronouns=Chúng ta; choices=["Giữ ẩn dụ
