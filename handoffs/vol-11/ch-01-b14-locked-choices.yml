    và nhận định 'Thật phi lý hết sức.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000034
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=chúng ta; choices=["Giữ câu hỏi tu từ nội
    tâm với 'giết quách con người đó đi thôi sao' và đánh giá 'một lập luận phi lý
    chẳng đáng để bàn lấy một khắc'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000035
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; pronouns=Tôi - Cô; choices=["Giữ lời nhận
    trách nhiệm của Zettour và câu hỏi chất vấn ngược 'Cô cũng là người khinh thường
    các công cụ gieo rắc cái chết sao?'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000036
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=mình - ông ấy (Zettour); terms=['General
    Zettour -> Tướng Zettour']; choices=["Giữ nhận định Zettour đang hiểu lầm ý mình,
    câu tự vấn về áp lực căng thẳng của 'Tướng Zettour' và ý định chấn chỉnh lối suy
    nghĩ của ông ấy."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000037
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=Ngài - ông ấy (Rudersdorf); choices=["Giữ
    trọng tâm phản bác của Tanya nằm ở chữ 'chỉ muốn giết quách ông ấy đi' và câu
    phủ định tình thái 'Nhưng hẳn ngài không thể nào nói thật lòng được.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000038
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; pronouns=Tôi; choices=["Giữ lời khẳng định
    dứt khoát 'Tôi hoàn toàn nghiêm túc trong từng lời nói.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000039
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=tôi - ngài; choices=["Giữ mệnh
    đề điều kiện 'Nếu đó là mệnh lệnh của ngài, thì tôi có nghĩa vụ phải bắn ngài
    ngay tại đây, ngay lúc này để bảo vệ phẩm giá của chính mình.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000040
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=mình - ông ấy (Zettour); terms=['General
    Zettour -> Tướng Zettour', 'the Empire -> Đế quốc']; choices=["Giữ phủ định 'không
    được phép đứng nhầm phe', giả định nhượng bộ về việc 'Tướng Zettour' chấp nhận
    sự sụp đổ của 'Đế quốc', và điều kiện 'nếu ông ấy tiến hành theo một phương thức
    không thể nào hiện thực hóa nổi'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000041
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; pronouns=cô; choices=['Giữ câu hỏi kinh
    ngạc của Zettour khi tưởng nhầm Tanya phản đối việc giết đồng minh vào lúc cuối
    cuộc này.']
- segment_id: YS-LN11/Text/chapter004.xhtml/p000042
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=mình - ông ấy (Zettour); choices=["Giữ chi
