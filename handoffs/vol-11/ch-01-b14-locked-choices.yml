    thể tránh khỏi đau đớn đâu…'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000051
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=tôi - ngài; choices=['Giữ sự đồng
    tình của Tanya rằng nỗi đau là một phần tất yếu của quá trình, nhưng chỉ ra vấn
