- segment_id: YS-LN11/Text/chapter004.xhtml/p000031
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; choices=["Giữ lời nhận xét trực diện 'Thật
    là một ý nghĩ ngu xuẩn.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000032
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; choices=["Giữ câu hỏi ngắn biểu thị sự
    sững sờ 'Gì cơ?'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000033
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=Ngài - ông ấy (Rudersdorf); choices=["Giữ
