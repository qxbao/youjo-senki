    ấy đang hiểu lầm một cách tai hại.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000043
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=Tôi - ngài; choices=["Giữ thái
