    của Zettour đang hoàn toàn lệch hướng."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000044
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; pronouns=cô; choices=["Giữ hai câu hỏi
    dồn dập 'Ý cô là sao? Cô đang cố nói điều gì?'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000045
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=tôi - ngài; choices=["Giữ lời
    rào đón 'xin cáo lỗi vì sự xấc xược của mình' và câu hỏi ngập ngừng 'lẽ nào ngài…
    thực sự cần tôi phải nói toạc hết ra sao ạ?'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000046
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=Mình; choices=["Giữ chi tiết cấp trên chỉ
    lắc đầu trước mặt Tanya; có thể lược 'của mình' sau 'cấp trên' để tránh lặp từ."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000047
  kind: terminology_and_voice
  value: speaker=Zettour; addressee=Tanya; pronouns=Tôi - cô; choices=["Giữ sự bối
    rối của Zettour '…Tôi không chắc là cô đang muốn ám chỉ điều gì.'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000048
  kind: terminology_and_voice
  value: 'pov=Tanya_first_person; pronouns=Mình - ông ấy (Zettour); choices=[''Giữ
    sự phân biệt cốt lõi trong lập luận của Tanya: không phản đối chuyện giết người,
    mà chỉ phủ nhận tính hiệu quả của việc ám sát trong hoàn cảnh cụ thể này.'']'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000049
  kind: terminology_and_voice
  value: speaker=Tanya; addressee=Zettour; pronouns=ngài, chúng ta, họ (các lãnh đạo
