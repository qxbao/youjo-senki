    thông suốt được."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000053
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=Mình; choices=["Giữ giọng tự đánh giá đầy
    mâu thuẫn hài hước của Tanya ('tự hào nói rằng mình khá khiêm tốn về khoản này
    dù bản thân là một chuyên gia') và ba kỹ năng giao tiếp trước vế nhượng bộ 'nhưng
    mình đâu có hoàn hảo'."]
- segment_id: YS-LN11/Text/chapter004.xhtml/p000054
  kind: terminology_and_voice
  value: pov=Tanya_first_person; pronouns=mình, bạn (ngôi thứ hai khái quát); choices=["Giữ
