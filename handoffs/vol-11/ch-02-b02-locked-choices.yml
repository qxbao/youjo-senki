choices:
- segment_id: YS-LN11/Text/chapter006.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa phân biệt 'Đế chế' ('the Reich') và 'Đế quốc' ('the Empire'),
    tên cơ quan 'Bộ Tổng tham mưu', biệt danh 'Hung thần Zettour', danh xưng 'Tướng
    Zettour', ẩn dụ 'một con tàu không thuyền trưởng' và nhận định 'trở nên đồng nghĩa
    với cả Đế quốc trong những giờ phút cuối cùng của quốc gia'; không có nhấn mạnh
    Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn hồi ký ngôi thứ nhất xưng 'tôi' (kết hợp đại từ phản
    thân 'mình' trong mệnh đề phụ), phủ định 'chưa bao giờ là điều được chủ ý từ trước'
    và khẳng định vai trò nhân chứng lịch sử 'đây là lời chứng của tôi dành cho các
    thế hệ tương lai'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa hai vị trí nhấn mạnh Markdown theo DEC-P01-002 tại '*vị tướng
    ấy chưa bao giờ có bất kỳ tham vọng nào muốn trở thành một kẻ độc tài*' và '*ngoại
    lệ*'; khóa đại từ 'tôi' – 'những người lính chúng tôi', 'vị tướng ấy' – 'Ông ấy',
    thuật ngữ 'Heimat' (không in nghiêng), định danh 'Đế quốc' và phủ định 'chưa từng
    mảy may tưởng tượng rằng quân đội lại ở vào vị thế dẫn dắt chính sách đối ngoại'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại câu hỏi '*Bao nhiêu
    người không chọn, tại sao lại là một quân nhân?*', đại từ 'tôi' – 'Các sĩ quan
    tham mưu cao cấp chúng tôi', sự phân biệt 'Đế quốc' và 'Đế chế', cặp hình ảnh
    ẩn dụ 'nắm đấm của Đế chế' đối lập với 'bộ não của nó', và phủ định tuyệt đối
    về việc không bao giờ có ý định 'tạo lập một quốc gia riêng của mình ngay trong
    lòng quốc gia'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ nhất 'tôi', sự thừa nhận 'đây là một ngoại lệ',
    thế bị động bất đắc dĩ khi bị cuốn vào 'mưu tính chấm dứt cuộc chiến' và hình
    ảnh 'mọi người dân Ildoa đều coi tôi là một con nhện đê tiện cho đến tận ngày
    hôm nay'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000019
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ ''tôi'' – ''mình'', cách gọi người đọc là ''độc giả''
    và câu hỏi trọng tâm mở đầu phần giải thích: ''Tại sao một quân nhân Đế quốc lại
    đi tiến hành đàm phán ngoại giao để chấm dứt chiến tranh?''; không có nhấn mạnh
    Markdown."]'
- segment_id: YS-LN11/Text/chapter006.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô của người viết với người đọc ('tôi' – 'độc giả'),
    chức danh 'sĩ quan tham mưu cao cấp', phủ định 'Tôi vốn chẳng phải người quen
    bàn luận chuyện lịch sử' và ý chuyển tiếp sang phần mô tả chi tiết chuỗi sự kiện."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa sự phân biệt đại từ 'chúng tôi' (nhóm thực hiện đàm phán/Bộ
    Tổng tham mưu) và 'chúng ta' (toàn thể quốc gia Đế quốc), định danh 'Đế quốc',
    tổ chức 'nhóm cốt lõi thuộc Văn phòng Bộ Tổng tham mưu', 'lục quân', phủ định
    'cho đến trước cuộc chiến này, Đế quốc chưa từng biết đến thất bại' và nhận định
    'chúng ta luôn tìm ra cách giành chiến thắng chung cuộc trong cuộc chiến'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Đế chế thuở trước', định danh 'Đế quốc', đại từ 'chúng
    ta' và luận điểm nền tảng ngoại giao của Đế quốc dựa vào sức mạnh quân sự – kinh
    tế của một 'siêu cường'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', định danh 'Đế chế', sự đối lập giữa nhận thức
    hậu chiến của 'Những người sống sót qua thời Đế chế' với tâm thế đương thời ('Thế
    nhưng vào thời điểm ấy, sự tình chắc chắn không phải như vậy')."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa câu đoạn ngắn nhấn mạnh mốc thời gian quá khứ 'Vào thời điểm
    ấy, khi cuộc chiến vẫn đang diễn ra.'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', cơ quan 'Bộ Ngoại giao', đại từ 'chúng
    ta', phủ định 'Đế quốc chưa bao giờ tiến hành ngoại giao dựa trên giả định rằng
    chúng ta sẽ thua một cuộc chiến' và ý khái niệm thất bại đi ngược lại tâm thức
    chung."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại giới từ '*trong*',
    phủ định 'Những người lính cũng chẳng phải ngoại lệ', chủ thể 'Lục quân' và chi
    tiết mất nhiều thời gian cùng đấu đá nội bộ mới nhận thức được 'thất bại tất yếu
    của mình'."]
- segment_id: YS-LN11/Text/chapter006.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'bản thân mình', cấu trúc giả định trái thực
    tế ở quá khứ ('Tôi e rằng bản thân mình cũng khó lòng từ bỏ hẳn hy vọng nếu trước
    đó không trực tiếp ra tiền tuyến cùng Kampfgruppe Lergen'), tên đơn vị 'Kampfgruppe
    Lergen' (không in nghiêng) và mệnh đề 'Chiến tranh luôn phải chịu sự chi phối
    của các định luật vật lý'."]
