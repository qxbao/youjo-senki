choices:
- segment_id: YS-LN11/Text/chapter008.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đại tá Calandro', đại từ tự xưng 'tôi' của Lergen
    trong mạch hồi ký và giả định so sánh 'như thể tôi đã hiểu lầm'; không có nhấn
    mạnh Markdown."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô ngoại giao trang trọng 'Tôi' – 'Ngài', đại từ 'họ'
    (chỉ phe đối phương/Hiệp ước) và phủ định tình thái 'không rõ liệu họ có đẩy mọi
    chuyện đi xa đến mức đó hay không' cùng lời khuyên không cần nóng vội."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' (Lergen) và 'ông ấy' (Calandro), cùng hai câu hỏi
    tu từ biểu lộ sự bàng hoàng kết thúc bằng dấu '?!'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000092
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'các ngài', định danh 'Đế quốc', cụm trạng ngữ 'xét trên
    mọi phương diện thực chất' và câu hỏi xác nhận việc đối xử với Đế quốc như 'kẻ
    chiến bại trong cuộc chiến này'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đại tá Calandro', đại từ 'ông ấy' – 'tôi', chi tiết
    'ra vẻ có phần miễn cưỡng' và cấu trúc nhượng bộ phủ định 'Dù ông ấy không thể
    thẳng thừng bác bỏ nhận định đó, câu trả lời đã quá đỗi rõ ràng, ngay cả với tôi'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa tên quốc gia 'Ildoa', định danh 'Đế quốc', thuật ngữ 'bên trung
    gian hòa giải', đại từ 'tôi' – 'chúng tôi' và điều kiện phủ định kép 'không thể
    đứng ra làm trung gian hòa giải cho Đế quốc nếu... không sẵn lòng chấp nhận những
    nhượng bộ cần thiết'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'chúng tôi', ẩn dụ 'từng mảnh ghép rơi vào đúng
    vị trí' tạo nên 'một bức tranh toàn cảnh đầy kịch tính' và hai nhận định phủ định
    về 'một cuộc chiến mà chúng tôi không thể nào thắng nổi' cùng cách tiến hành chiến
    tranh sai lầm."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', thuật ngữ 'bên trung gian hòa giải', đại
    từ 'Tôi' – 'mình', phủ định 'chẳng hề nhận ra điều này cho đến khi một người lính
    gặp gỡ một bên trung gian hòa giải' và mệnh đề đối lập 'khó có thể gọi ngoại giao
    là một chiến thắng, nhưng tôi vẫn luôn tự xem mình là một chiến binh giàu danh
    dự của Đế quốc'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình' – 'chúng tôi', cụm mỉa mai 'những đối
    thủ đáng kính của chúng tôi', phủ định tuyệt đối 'tuyệt nhiên không có ý định
    để Đế quốc giữ lại dù chỉ một chút danh dự bề ngoài nào trong thất bại này' và
    câu hỏi tu từ chua chát 'Chẳng phải chuyện đó nực cười lắm sao?'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình', cụm 'sĩ quan Đế quốc ngạo mạn', định
    danh 'Tổ quốc', dấu ba chấm ngập ngừng 'quá đỗi ám ảnh… với việc ghê tởm mọi điều
    nhục nhã và việc hoàn thành bổn phận của mình' và sự tương phản giữa nỗi đau đối
    diện thực tại với 'vận mệnh bi thảm của Tổ quốc'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', thuật ngữ 'tuyến đường sắt quốc tế',
    hình ảnh so sánh tiếng đoàn tàu với 'tiếng rạn nứt từ nền móng đang sụp đổ của
    đất nước mình' và phủ định 'không tài nào phủ nhận được điều đó, hay bất cứ lời
    nào mình đã nghe vào ngày hôm ấy'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'tuyến đường sắt quốc tế', đại từ 'tôi', dấu ba chấm
    ngập ngừng 'nhưng…' và phủ định 'chẳng thể nuốt trôi bất cứ thứ gì'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Tổ quốc', 'Đế quốc', đại từ 'tôi' – 'chúng tôi',
    hình ảnh so sánh 'nhìn xuống một vực thẳm tuyệt vọng', 'cứa vào lòng tôi sắc lạnh
    như những lưỡi dao găm' và nguyên nhân 'hạn chế chiếu sáng do thiếu hụt điện năng'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', đại từ 'tôi' – 'mình', hình ảnh quá khứ
    'một pháo đài rực sáng, lấp lánh ánh đèn bất tận' và mốc chuyển biến tâm lý 'đã
    chấp nhận thất bại của chính mình'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình', dấu gạch ngang giải thích 'công việc—không
    còn bổn phận của mình' và giả định trái thực tế ở quá khứ với mức độ chắc chắn
    'Tôi khá chắc rằng mình đã tìm lấy khẩu súng gần nhất rồi ngậm chặt lấy nòng súng
    mất rồi'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', chức danh 'sĩ quan tham mưu', tên cơ
    quan 'Văn phòng Bộ Tổng tham mưu' và ý phản xạ kỷ luật khiến cơ thể tự động quay
    trở lại cơ quan tham mưu."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', tên cơ quan 'Văn phòng Bộ Tổng tham mưu',
    hình ảnh so sánh 'một con búp bê lên dây cót khi cứ thế bước đi vô định dọc các
    hành lang' và kết luận 'chắc chắn chuyện mình đã nộp báo cáo là sự thật'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000106
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', phủ định 'không tài nào nhớ nổi' và nhấn mạnh
    Markdown theo DEC-P01-002 tại đúng cụm '*Ngoại giao là vô ích.*'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'chúng ta' – 'mình', định danh 'Đế quốc', tên
    quốc gia 'Ildoa', phủ định 'vẫn không thể nhớ lại được bất cứ chi tiết đáng kể
    nào', tình thái suy đoán 'Có lẽ tôi đã đóng một chiếc nút chặn lên não bộ của
    mình' và kết luận 'từ bỏ mọi hy vọng về việc Đế quốc có thể tìm kiếm hòa bình
    thông qua Ildoa'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc' và thời quá khứ hoàn thành 'từng mơ tưởng
    đến việc khép lại cuộc chiến với tư thế của kẻ chiến thắng'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình', đối tượng 'các độc giả ngày nay', phủ
    định 'sẽ chẳng thể nào hiểu hay đồng cảm nổi với cách nhìn nhận đó' và mốc thời
    gian hậu chiến 'khi đọc lại những ghi chép của mình rất lâu sau khi cuộc chiến
    kết thúc'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tập thể 'Chúng tôi' và hai tính từ tự phê phán 'quá tham
    lam. Và cũng quá đỗi ngây thơ'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng tôi', quan hệ nhân quả 'Đó là lý do vì sao vào
    thời điểm ấy' và phủ định khả năng 'đã không thể hy vọng vào bất cứ điều gì hơn
    thế'."]
