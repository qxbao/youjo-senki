choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'tôi' của Rudersdorf và hai câu khẳng định nghĩa
    vụ ngắn gọn ('Đó là bổn phận của tôi. Là việc tôi buộc phải làm.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu cảm thán
    nội tâm '*À, tất nhiên rồi.*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour' và sắc thái 'chất chứa rõ sự thất vọng—hoặc
    có lẽ là cả nỗi tuyệt vọng' trong tiếng thở dài."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa phân biệt đại từ trần thuật 'ông' (Zettour) và 'ông ta' (Rudersdorf),
    thuật ngữ 'Đế chế' (the Reich), tình thái suy đoán 'Có lẽ ông ta sẵn sàng làm
    bất cứ điều gì vì quốc gia của mình' và nhận định 'chẳng khác nào việc gào thét
    và than khóc trước viễn cảnh đánh mất tất cả'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu thúc giục
    nội tâm '*Chúng ta cần phải đưa ra lựa chọn ngay lúc này!*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'Tôi' – 'ông', tên riêng 'Rudersdorf' và lý do mở
    lời trên tư cách bạn bè."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và lời đáp khích lệ nói tiếp của Rudersdorf ('Ồ?
    Để xem ông định nói gì nào.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'Ông', 'chúng ta', 'tôi', tên quốc gia 'Ildoa', địa
    danh 'miền đông', ẩn dụ tài chính 'Ông không thể tuyên bố phá sản đối với một
    khoản nợ vay để đánh bạc được' và yêu cầu điều toàn bộ nguồn lực hiện có sang
    miền đông."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa nhận định trần thuật về việc mọi nguồn lực tiến hành chiến tranh
    đang dần cạn kiệt và 'Tình trạng thiếu hụt cả binh lính lẫn quân nhu đến thời
    điểm này đã trở thành kinh niên'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', 'tôi', 'chúng ta', tên quốc gia 'Ildoa', định
    danh 'Đế quốc', mệnh đề xen '—tôi có cần phải nhắc cho ông nhớ không—', cụm 'kênh
    đàm phán hòa bình khả dĩ duy nhất' và câu mệnh lệnh 'Hãy xét đến tình cảnh hiện
    tại của Đế quốc trước khi mở lời đi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', tên riêng 'Zettour', đại từ 'ông' (ẩn/quy
    chiếu Zettour), phủ định 'Không thể cứ thế làm ngơ một cách tiện lợi trước sự
    sụp đổ đang cận kề của Đế quốc được' và chi tiết 'gần như cảm thấy xấu hổ khi
    phải nói thẳng điều đó ra'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'Cả hai' / 'họ', nhận định 'thất bại gần như đã cầm
    chắc', phủ định 'chiến thắng không còn là điều có thể tính tới nữa', 'thất bại
    của họ không nhất thiết đồng nghĩa với sự chấm hết' và ý tương phản đất nước mất
    nhưng núi sông vẫn còn."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa đối lập khái niệm giữa 'Đế chế hiện tại' (current Reich) và
    'Heimat' (giữ nguyên chữ thường, không in nghiêng), tên riêng 'Rudersdorf', vị
    thế của Heimat là 'thực thể thiêng liêng' mà quân đội phụng sự, trung thành, cần
    bảo vệ, cùng câu hỏi tu từ nghi vấn ở cuối đoạn."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' (chỉ Rudersdorf) và cấu trúc giả định đối lập
    ở quá khứ giữa 'một kẻ tội phạm' với 'một người yêu nước' ('lẽ ra ông ta hoàn
    toàn không thể nào mảy may nghĩ tới chuyện đó mới phải')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', tên riêng 'Rudersdorf' và hai câu hỏi dồn dập
    của Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Người bạn cũ của Zettour', đại từ 'ông' và chi tiết đáp
    lại 'câu hỏi đầy giằng xé của ông bằng một nụ cười nhếch mép'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' – 'ông' và lời đề nghị nói thẳng khi chỉ có
    hai người."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', tên riêng 'Zettour', chi tiết hồi tưởng những
    lời từng chia sẻ với bạn bè nhiều lần trước đây và hành động 'Zettour mỉm cười'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', 'chúng ta', ý 'hành xử cho đúng với quân hàm của
    mình' và sự đối lập giữa tính thất thường của thế sự với 'thực tại của chúng ta'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' – 'ông', 'hai ta' và câu nói đùa mỉa mai về
    việc bảo trợ lý hai bên liên hệ thu xếp cuộc họp hay cứ thẳng thắn với nhau."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa cấp bậc 'một trung tướng và một đại tướng', tên riêng 'Zettour'
    và hành động 'cười trừ và nhún vai bỏ qua câu nói đùa nhằm khiến người bạn của
    mình dẹp bớt những nghi thức xã giao'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'hai ta', 'tôi', 'chúng ta' và thông tin đã được thăng
    hàm nên về thực chất hai người đã ngang cấp nhau."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'ông' và lời thừa nhận người đối thoại nắm
    thông tin nhạy bén."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', 'chúng ta', cụm 'suy nghĩ giống một quan chức
    hành chính' và nhận định việc thăng hàm chỉ là 'một sự điều chỉnh' hoặc 'một nỗ
    lực nhằm cân bằng bộ máy tham mưu'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Rudersdorf', 'Zettour', sự phân biệt đại từ 'ông'
    (Zettour) và 'ông ta' (Rudersdorf), cùng chi tiết Rudersdorf cảm thấy hổ thẹn
    trước việc thăng hàm trên thực tế này."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', cấp bậc 'trung tướng', địa danh 'mặt trận
    phía đông' và cụm 'thăng hàm hữu danh vô thực mang màu sắc chính trị'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và cấu trúc nhấn mạnh 'chính người đàn ông đang
    ngồi trước mặt ông là người đã đứng ra thu xếp những thủ tục cần thiết'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ đoạn độc thoại
    nội tâm mỉa mai của Zettour, gồm danh xưng 'Trung tướng Zettour', địa danh 'mặt
    trận phía đông' và hình ảnh 'kẻ cầm đầu một bè phái nào đó'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Ông lão', tên riêng 'Zettour', đại từ 'Ông' – 'mình'
    và câu giả định trái thực tế ở quá khứ ('Giá như Zettour biết trước tương lai
    đang chờ đợi mình, ngay từ đầu ông đã chẳng bao giờ khao khát leo lên các nấc
    thang quân hàm.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' – 'mình', tên cơ quan 'Tổng hành dinh Bộ Tổng tham
    mưu', hình ảnh 'một người tiên phong mở đường' và cặp khái niệm 'Đế chế và Đế
    quốc' (the Reich and the Empire)."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000066
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ trần thuật ''ông'', đại từ nội tâm ''Mình'' và phạm
    vi nhấn mạnh Markdown theo DEC-P01-002 chỉ ở mệnh đề sau dấu hai chấm: ''*Mình
    chỉ cần giành chiến thắng là được.*''."]'
- segment_id: YS-LN11/Text/chapter002.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' và quân hàm 'chuẩn tướng' (brigadier general)."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', hình ảnh 'nằm trong tầm tay' và quân hàm 'thiếu
    tướng' (major general)."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', trạng thái 'không ngừng khắc khoải hướng về nó'
    và quân hàm 'trung tướng' (lieutenant general)."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và câu cảm thán hoài niệm khép lại đoạn ('Quá khứ
    của ông mới tươi đẹp làm sao.')."]
