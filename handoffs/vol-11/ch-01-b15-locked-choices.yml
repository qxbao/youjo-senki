choices:
- segment_id: YS-LN11/Text/chapter004.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: dùng ''chúng ta'' (we)
    và ''tôi'' (I).", "Thuật ngữ: ''một vị tướng'' (a general), ''Đế chế'' (the Reich),
    ''lợi tức'' (return), ''khoản đầu tư'' (investment), ''nhân sự'' (staff).", "Phủ
    định và tự đính chính: giữ cấu trúc ''Chúng ta không phải, hay ít nhất cá nhân
    tôi chắc chắn không phải...''; sửa ''một phút hứng tình'' thành ''một phút bốc
    đồng'' / ''một phút hứng chí''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: gọi Tanya là ''cô''
    (you).", ''Giữ đúng câu hỏi ngắn gọn truy vấn lập trường của Tanya.'']'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và sắc thái lễ độ: Tanya xưng ''Tôi'' và kết câu bằng
    tiểu từ kính ngữ ''ạ''.", "Thuật ngữ: ''hòa bình'' (peace)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn và đại từ nội tâm: Tanya tự quy chiếu bằng ''mình'';
    gọi ''Tướng Zettour'' và quy chiếu ngôi thứ ba là ''ông ấy''.", "Thuật ngữ: ''hỗn
    loạn'' (chaos), ''trật tự và hòa bình'' (order and peace)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Tình thái và điều kiện loại trừ: giữ cấu trúc ''trừ phi họ là...''
    (lest they be...).", "Thuật ngữ: ''chiến tranh tổng lực'' (all-out war)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''Mình''.", "Thuật ngữ: ''nền hòa bình tươi đẹp
    và năng suất lao động'' (beautiful peace and productivity)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya xưng ''tôi''.", "Quan hệ nhượng bộ:
    giữ ''Dù vậy, với tư cách một người lính tận hiến vì lợi ích quốc gia, tôi chỉ
    đơn thuần mong muốn thực thi chức trách của mình một cách hiệu quả nhất có thể.''"]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''Mình'' (ngôi thứ nhất đơn) và ''chúng ta'' (ngôi
    thứ nhất số nhiều).", "Nhấn mạnh Markdown: giữ đúng phạm vi in nghiêng ''*và nhận
    đồng lương của mình*'' theo DEC-P01-002.", "Thuật ngữ: ''mô hình kinh doanh''
    (business model), ''nguồn vốn'' (capital)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''Chúng ta''.", "Thuật ngữ và ẩn dụ: ''khoản đầu
    tư cảm xúc'' (emotional investment), ''vũng lầy thất bại'' (quagmire of defeat).",
    "Quan hệ tăng tiến: giữ cấu trúc ''Càng... lại càng...''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''mình''.", "Phủ định và thành ngữ: giữ đúng nghĩa
    ''không muốn để lại những đầu mối dang dở'' (don’t want to open up loose ends)
    và ''Sẽ thật ngu ngốc nếu mình tiếc công tiếc sức trong việc hoàn tất thủ tục
    từ chức trước khi nhảy việc'' (foolish for me to spare any effort...)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn: giữ lối tự quy chiếu ngôi thứ ba đặc trưng của Tanya
    (''Tanya sẽ giữ vững lập trường chủ quan và thuyết phục cấp trên hết khả năng
    của mình'').", "Thuật ngữ: ''nguồn nhân lực'' (human resource), ''cấp trên'' (superior)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: ''chúng ta'' (we).", "Tên gọi và thuật ngữ:
    ''Tướng Rudersdorf'' (General Rudersdorf), ''kẻ chủ mưu đứng sau một cuộc đảo
    chính'' (the mastermind behind a coup d’état)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: Tanya xưng ''mình'', gọi ''Tướng Zettour'' là
    ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya xưng ''Tôi'', dùng ''chúng ta'' (we).",
    "Nhấn mạnh Markdown: giữ đúng phạm vi in nghiêng ''*sau khi*'' ứng với thẻ em
    trên từ after của nguồn theo DEC-P01-002.", "Tên gọi và thuật ngữ: ''Kế hoạch
    B của Tướng Rudersdorf'' (General Rudersdorf’s Plan B)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: ''Chúng ta'' (We).", ''Ẩn dụ:
    giữ hình ảnh khối u ác tính gắn với Rudersdorf và dấu chấm lửng bỏ lửng câu nói.'']'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: giữ toàn bộ câu nội tâm trong dấu sao ''*Chính
    xác.*'' theo đúng thẻ em của nguồn (DEC-P01-002)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: Tanya xưng ''Mình'', gọi Zettour là ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Đại từ trong thoại: ''ông ấy'' (His - chỉ Rudersdorf), ''Chúng
    ta'' (We).", "Thuật ngữ: ''cuộc thanh trừng có chọn lọc'' (selective purge), ''lục
    quân'' (the army), ''Bộ Tư lệnh Tối cao'' (Supreme High Command), ''Văn phòng
    Bộ Tổng tham mưu'' (General Staff Office), ''bộ chỉ huy trung ương ngắn hạn''
    (short-term central command)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: tự sửa từ ''của tôi…'' sang ''của
    chúng ta'' (my…our…).", "Thuật ngữ: ''Một cuộc phản đảo chính'' (A counter coup),
    ''Kế hoạch B'' (Plan B)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''Mình'' và ''Chúng ta''.", "Thuật ngữ: ''âm mưu
    lật đổ chính phủ'' (plot to overthrow the government), ''nỗ lực chiến tranh''
    (war effort)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Tên gọi và đại từ: ''Tướng Zettour'', ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Tên gọi: ''Rudersdorf'', ''Đế quốc'' (the Empire).", "Tình thái:
    giữ mức độ suy đoán ''có thể'' (may) ở cả hai vế đối lập."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta''.", "Thuật ngữ: ''Kế hoạch B'' (Plan
    B), ''bộ chỉ huy trung ương'' (central command).", "Mức độ chắc chắn: chuyển từ
    giả định (''sẽ đưa chúng ta tiến gần hơn...'') sang khẳng định chắc chắn (''Không,
    chắc chắn nó sẽ đạt được mục tiêu đó. Lại còn hoàn toàn hợp pháp nữa chứ.'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: ''chúng ta'' (our).", "Thuật ngữ: ''tối đa
    hóa lợi tức thu về'' (maximize our returns)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và cấp bậc trong thoại của Zettour với Tanya: gọi ''Cô''
    (You) và ''Trung tá'' (Colonel)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Đại từ và điểm nhìn nội tâm: ''ông ấy'' / ''Tướng Zettour'', tự
    xưng ''Mình'' và tự quy chiếu ngôi thứ ba ''Tanya'' ở câu hỏi tu từ cuối đoạn.",
    "Nhấn mạnh Markdown: giữ đúng phạm vi in nghiêng ''*đồng minh*'' ứng với thẻ em
    trên từ ally của nguồn theo DEC-P01-002."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: xưng ''tôi'', gọi ''thưa
    ngài'' (sir), có ''ạ'' ở cuối câu hỏi."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: gọi ''cô'' (you)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''Thưa ngài'' (Sir),
    ''quân của tôi'' (my troops), kết câu bằng ''đâu ạ?'' để giữ hàm ý phản vấn rằng
    không có lý do gì phải điều quân."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''Mình''.", "Điển cố: ''Tào Tháo'' (Cao Cao),
    ''đám hoạn quan trong triều'' (the court eunuchs), ''một gã đồ tể nọ'' (a certain
    butcher).", "Nhấn mạnh Markdown: giữ đúng phạm vi in nghiêng ''*Không cần phải
    triệu binh mã đâu.*'' theo DEC-P01-002."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Một cuộc phản đảo chính'' (A countercoup).", "Nhấn
    mạnh Markdown: giữ đúng phạm vi in nghiêng ''*luật pháp và trật tự*'' ứng với
    thẻ em trên cụm law and order của nguồn theo DEC-P01-002."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và sắc thái thoại: dùng ''chúng ta'' (our) và tiểu từ
    lễ phép ''ạ'' ở cuối câu.", "Thuật ngữ: ''Vũ lực quân sự'' (Military force), ''lực
    lượng cảnh sát'' (The police)."]'
