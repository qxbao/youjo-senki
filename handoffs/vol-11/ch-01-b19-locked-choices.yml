segment_id_end: YS-LN11/Text/chapter004.xhtml/p000238
choices:
- segment_id: YS-LN11/Text/chapter004.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và cấp bậc trong thoại của Tanya với Zettour: xưng ''Tôi''
    / ''mình'', có ''ạ'', giữ ''các thanh tra viên mang quân hàm trung tướng'' và
    ''trung tá''.", "Tình thái và phủ định: ''Tôi e là mình chẳng thể khiến bất kỳ
    ai chịu nghe theo mệnh lệnh nào của mình đâu ạ.''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm tự quy chiếu của Tanya: ''mình'' theo DEC-P01-001;
    giữ danh xưng ''Tướng Zettour'' và hình ảnh ẩn dụ ''chiếc giường đinh''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Nhận định khái quát trong nội tâm Tanya: giữ quan hệ đối lập và
    phủ định ''biết mình không thể làm một cách hiệu quả'', ''nơi người lao động có
    thể nói không''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: xưng ''Tôi'', gọi ''Cô'' / ''cô'';
    trần thuật gọi ''Tướng Zettour'' (''ông ấy''), chỉnh cụm phản thân dễ gây nhập
    nhằng theo khuyến nghị."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ trong thoại của Tanya với Zettour: xưng ''tôi'',
    gọi ''ngài'', giữ ''mặt trận phía đông'', ''Đế quốc'' và phủ định ''không nghĩ
    có lấy một ai''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: mở đầu tự quy chiếu ''mình'', câu cuối chuyển
    sang tự nhìn nhận khách quan bằng tên ''Tanya''; giữ ''Tướng Romel'', ''Tướng
    Rudersdorf'', ''Tướng Zettour'', ''sĩ quan chỉ huy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn ngôi thứ ba nối tiếp câu cuối đoạn p000203: quy chiếu
    Tanya là ''cô'', giữ nguyên thuật ngữ ''Kampfgruppe'' và mục đích phủ định ''không
    bị kẹt ở thế hớ hênh''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''mình'', gọi Zettour là ''cấp trên
    của mình''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: dùng ''chúng ta'', ''Tôi'', ''mặt
    trận phía đông'', ''chính quốc'', ''toàn bộ chiến tuyến'', kết câu bằng ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: gọi ''Cô'', xưng ''tôi'', dùng ''Ở
    miền đông''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''mình'', danh xưng ''Tướng Zettour''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''Mình'', dùng ''chúng ta'' cho phía
    Đế quốc; giữ ''Tướng Zettour'' và ''Liên bang''.", "Nhấn mạnh Markdown: giữ ''*độc
    lập*'' tương ứng với thẻ em trong XHTML gốc theo DEC-P01-002."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: dùng ''chúng ta'', ''Hội đồng Tự
    trị'', ''chiến dịch tác chiến chiều sâu'', giữ câu hỏi có ''ạ'' và dấu chấm lửng."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: xưng ''Tôi'' / ''tôi'', quy chiếu Hội đồng
    Tự trị là ''nó'' / ''họ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: quy chiếu Zettour là ''ông ấy'', tự quy chiếu
    ''mình'', giữ tình thái ''Có lẽ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya: quy chiếu hội đồng là ''Họ'' / ''họ'', giữ
    ''Lục quân Đế quốc'' và phủ định ''chẳng bao giờ tự mình gánh vác nổi''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: xưng ''tôi'', quy chiếu Hội đồng Tự trị là
    ''họ'', giữ ''Lục quân Đế quốc'', ''tiền tuyến'', ''trật tự công cộng''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya: quy chiếu Hội đồng Tự trị là ''họ'', giữ ''hậu
    cần ở hậu phương''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya hỏi Zettour: gọi ''Ngài'', quy chiếu Hội đồng
    Tự trị là ''họ'', kết câu hỏi bằng ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour đáp Tanya: xưng ''tôi'', giữ đối lập phủ định
    – khẳng định ''Không, nhưng tôi có niềm tin vào Liên bang.''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya hỏi tiếp Zettour: giữ dấu chấm lửng mở đầu, ''Hội
    đồng Tự trị'', ''kẻ thù không đội trời chung'', kết câu bằng ''sao ạ?''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya: giữ ''Tướng Zettour'', ''Hội đồng Tự trị'',
    ''Đế quốc'', ''chủ nghĩa thực dụng'' và ''lý tính nhà nước''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: gọi ''ngài'', dùng ''chúng ta'',
    có ''ạ'', giữ nghĩa giả định ''ném bom cháy thiêu rụi mọi thứ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: gọi ''Trung tá'', giữ ''ở miền đông''
    và dấu chấm lửng cuối câu."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Trần thuật nội tâm: gọi ''Tướng Zettour'', quy chiếu là ''ông
    ấy'', giữ sắc thái ''chủ nghĩa bại trận''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: dùng ''Chúng ta'', giữ phủ định ''không cần
    phải gieo rắc những hạt giống thù hận''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: dùng ''chúng ta'', quy chiếu Hội
    đồng Tự trị là ''họ'', giữ câu điều kiện ''Nếu chúng ta chiến thắng'' và ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown trong thoại của Zettour: giữ ''*nếu*'' tương
    ứng với thẻ em trong XHTML gốc theo DEC-P01-002."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: đổi ''Cả hai chúng tôi'' thành ''Cả hai chúng
    ta'' theo khuyến nghị để nhất quán giọng độc thoại nội tâm."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: giữ ''một vị trung tướng'' và ''đấy
    ạ'', chỉnh cụm động từ theo khuyến nghị để giữ lễ độ."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000228
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: xưng ''tôi'', gọi ''Cô'' / ''cô''
    và ''Trung tá'', dùng ''chúng ta''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000229
  kind: terminology_and_voice
  value: 'choices=["Thoại xin lỗi của Tanya với Zettour: xưng ''Tôi'', gọi ''ngài'',
    có ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000230
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: quy chiếu Zettour là ''Ông ấy'', thống nhất dùng
    ''cả hai chúng ta'' và ''số phận cay đắng của chúng ta''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: gọi ''Trung tá'' (bỏ ''ạ'' theo khuyến
    nghị), gọi ''quân của cô'', giữ tình thái ''có thể sẽ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: giữ dấu chấm lửng sau ''Chà…'' và
    tiểu từ ''ạ'' cuối câu."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: gọi ''cô'', giữ giọng khích lệ lịch
    sự."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm ngắn của Tanya: giữ ''Đất nước này thật đen
    tối.'' để nối mạch chơi chữ về màu đen ở đoạn p000235."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000235
  kind: terminology_and_voice
  value: 'choices=["Đại từ và chơi chữ trong nội tâm Tanya: dùng ''Chúng ta'' và ''mình'',
    giữ ba lớp nghĩa của màu đen (''màu đen kịt'' của máu oxy hóa, ''con số sổ sách
    màu đen báo lãi'' và ''những hệ thống bóc lột'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000236
  kind: terminology_and_voice
  value: 'choices=["Câu cảm thán nội tâm của Tanya: ''Nguyền rủa cái thế giới bị ruồng
    bỏ này xuống địa ngục đi.''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000237
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Zettour: xưng ''Tôi'', kết câu bằng ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000238
  kind: terminology_and_voice
  value: 'choices=["Thoại kết chương của Zettour: giữ ''nhân danh sự tất yếu''.",
    "Nhấn mạnh Markdown toàn lô: chỉ dùng *...* ở p000209 (''*độc lập*'') và p000225
    (''*nếu*''), toàn bộ 39 đoạn còn lại không có thẻ nhấn mạnh trong XHTML gốc nên
    không dùng *...* theo DEC-P01-002."]'
