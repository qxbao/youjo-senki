segment_id_end: YS-LN11/Text/chapter002.xhtml/p000303
choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000276
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ngài' – 'tôi' kèm kính ngữ 'ạ', thuật ngữ 'trung
    đoàn' và dấu chấm lửng ngập ngừng trước cụm 'trung đoàn của riêng mình'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000277
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'cô' – 'chúng tôi', cấu trúc tăng tiến 'càng... lại
    càng...' và cụm 'lộ trình thăng tiến chính thống'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000278
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001, đại từ
    'ông ấy' chỉ Rudersdorf, các định danh 'Văn phòng Bộ Tổng tham mưu', 'Đế quốc'
    và hình ảnh ẩn dụ con tàu của Đế quốc sắp chìm nhưng vẫn là con tàu cho đến lúc
    chìm hẳn."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000279
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ngài' – 'tôi' kèm kính ngữ 'ạ' và danh xưng 'Đại
    tá Lergen'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000280
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Người đó' (chỉ Lergen), 'cô' (chỉ Tanya) và sự xác nhận
    có điều chỉnh nhẹ của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000281
  kind: terminology_and_voice
  value: locks=["Khóa sự luân phiên giữa đại từ nội tâm 'mình' và tên riêng ngôi thứ
    ba 'Tanya', các định danh 'Bộ Tổng tham mưu', 'Đại tá Lergen' cùng cụm 'chỉ có
    kinh nghiệm làm chỉ huy thực địa trên danh nghĩa'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000282
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', các thuật ngữ 'quy trình đào tạo từ trường
    tiểu học – học viện quân sự – trung đoàn đầu tiên – trường đại học quân sự', 'Văn
    phòng Bộ Tổng tham mưu', 'sĩ quan ma pháp', 'lục quân', các mệnh đề phủ định ('không
    đi qua...', 'chẳng được đi học mẫu giáo', 'không sao rũ bỏ được') và nhận định
    về sự phân biệt đối xử ngầm."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000283
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', chức danh 'cựu đại diện nhân sự', lập luận hai
    mặt về việc dùng 'bộ lọc' trong 'quy trình tuyển dụng' và kết luận chỉ còn lối
    thoát là chuyển việc."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000284
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', phép so sánh nhân viên dùng kinh phí công ty
    cũ lấy bằng thạc sĩ kinh doanh ở trường đại học hàng đầu rồi chuyển việc ngay,
    cùng mệnh đề điều kiện ở câu cuối."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000285
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba gọi tên 'Tanya' và sắc thái
    khó nhọc khi đưa ra câu trả lời."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000286
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' kèm kính ngữ 'ạ' trong lời từ chối trực tiếp."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000287
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và cấu trúc giả định trái thực tế trong
    quá khứ ('Giá như lời đề nghị này đến sớm hơn vài năm, hẳn mình đã...')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000288
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', định danh 'Being X', mốc thời gian 'chín năm
    trước khi cuộc chiến nổ ra' và cụm 'gã thần thánh tự xưng đó'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000289
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'con bé' và đại từ 'tôi' trong câu than của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000290
  kind: terminology_and_voice
  value: locks=["Khóa hai danh xưng 'Tướng Rudersdorf', 'Tướng Zettour' và sự đối
    lập giữa tiếng thở dài chịu thua của Rudersdorf với nụ cười gần như hân hoan của
    Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000291
  kind: terminology_and_voice
  value: locks=['Khóa câu hỏi trêu chọc ngắn gọn không chủ ngữ của Zettour.']
- segment_id: YS-LN11/Text/chapter002.xhtml/p000292
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ấy' / 'ông ấy', danh xưng 'Tướng Rudersdorf', cụm
    'điếu thuốc lá quân đội' và chuỗi cử chỉ nhổm dậy, nhìn đồng hồ tiếc nuối rồi
    buông thõng vai."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000293
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' trong lời Rudersdorf thông báo chuẩn bị cho cuộc
    họp kế tiếp."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000294
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ ngang hàng 'Tôi' – 'ông' giữa hai vị tướng, định
    danh 'Hội đồng Tự trị' và hai mệnh đề khuyên can phủ định ('đừng đưa ra bất kỳ
    lời hứa hão nào', 'cũng đừng vẽ ra một bức tranh ảm đạm và tuyệt vọng')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000295
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', 'Tướng Rudersdorf' và sự tương phản
    giữa ánh nhìn thấu hiểu với vẻ mặt trầm mặc."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000296
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ông' – 'tôi' trong lời mời đi cùng và giám sát cuộc
    họp của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000297
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ nhất số nhiều 'Chúng ta' – 'chúng ta', cụm 'điệp
    viên của Liên bang' và giả định về việc trở thành mục tiêu bị ném bom nếu cả hai
    xuất hiện cùng nhau."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000298
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' – 'chúng ta' và câu hỏi về mức độ thâm nhập của
    đối phương."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000299
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn ngôi thứ nhất số nhiều 'Cả ba người chúng tôi' bao
    gồm Tanya và hai vị tướng cùng thở dài."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000300
  kind: terminology_and_voice
  value: locks=["Khóa cụm danh xưng 'vị chúa tể của mặt trận phía đông' (chỉ Zettour)
    và bầu không khí bất an trong phòng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000301
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' – 'ông' – 'họ', danh xưng 'Trung tá Degurechaff',
    cấu trúc phủ định kép ('Chẳng có bằng chứng nào cho thấy họ chưa làm được điều
    đó') và câu hỏi điều kiện loại trừ ('Trừ phi ông hoặc Trung tá Degurechaff có
    bất kỳ bằng chứng nào chứng minh điều ngược lại?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000302
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' và câu trả lời phủ định ngắn gọn của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000303
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', cặp đại từ 'tôi' – 'ông' (Zettour
    nói với Rudersdorf sau khi sửa finding), đại từ 'chúng ta', lý do ngoại giao tránh
    gây chú ý vào việc có trẻ em làm sĩ quan quân đội và việc cắt cử đội cận vệ gồm
    những người lính tinh nhuệ có ngoại hình tương xứng để bảo vệ Rudersdorf."]
