choices:
- segment_id: YS-LN11/Text/chapter008.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' và danh xưng điển tích 'nàng Cassandra thành
    Troy'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Nàng' – 'mình', phủ định 'chưa từng được ngợi khen vì
    những lời tiên tri đúng sự thật', danh xưng 'Tướng Zettour', định danh 'Đế quốc'
    và phép liên hệ giữa việc trút giận lên người đưa tin dữ với việc Zettour bị ghẻ
    lạnh."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' – 'tôi', từ trong ngoặc kép '“thị sát”', khu vực
    'mặt trận phía đông', chức danh 'phó tổng tham mưu trưởng Bộ Tổng tham mưu', cách
    gọi người đọc 'Nhiều độc giả của tôi' và ẩn dụ 'một bánh răng thiết yếu trong
    cỗ máy' nghiền nát 'những bánh răng xung quanh'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', quan hệ cấp bậc 'cấp dưới của tôi là Trung tá
    Uger', tên quốc gia 'Ildoa' và chi tiết vô tình phát hiện 'một cuộc tiến công
    đã được lên kế hoạch nhắm vào Ildoa'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', câu hỏi gián tiếp có phủ định 'tại sao lúc ấy
    không ngăn chặn cuộc tấn công đó' và khẳng định 'điều ấy là bất khả thi'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa nhân vật 'Trung tá Uger', đại từ 'tôi' – 'anh ấy', ẩn dụ thời
    điểm 'khi các bánh răng đã bắt đầu chuyển động' và chi tiết thu xếp cuộc họp khẩn
    dưới một cái tên khác với vẻ tuyệt vọng trên gương mặt."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô của Uger với Lergen 'Thưa Đại tá, tôi...' cùng
    đại từ bao gộp 'chúng ta' / 'quân ta' và tình thế cấp bách sắp triển khai lực
    lượng."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000140
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi câu hỏi tu từ nội tâm, tên quốc gia 'Ildoa', đại từ 'Chúng
    tôi' – 'Tôi', chi tiết 'đã bị bao vây trên bốn mặt trận khác nhau, và giờ còn
    định mở thêm một mặt trận nữa' cùng nhận định giả định 'hầu hết những người lính
    còn tỉnh táo hẳn sẽ quẳng vũ khí xuống ngay tại chỗ'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Bộ Tổng tham mưu Lục quân Đế quốc', cụm đồng vị trong
    gạch ngang 'ngôi đền thiêng của tư duy logic quân sự', thuật ngữ 'các nguyên tắc
    chiến tranh', 'giành lấy thế chủ động' và đại từ 'Tôi' – 'chúng tôi'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa nhân vật 'Trung tá Uger', đại từ 'tôi' – 'chúng tôi' – 'mình'
    và chi tiết nhìn tờ lịch cân nhắc thời điểm trong năm cùng tình hình thời tiết."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Uger về 'Các cuộc thương lượng hòa giải' và trợ
    từ kính ngữ 'ạ' kèm dấu ba chấm."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', phủ định 'không thể thống nhất được' và thuật
    ngữ 'các điều khoản thỏa đáng'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lặp lại cụm 'Các điều khoản thỏa đáng ư…?' của Uger."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa nhân vật 'Trung tá Uger' và đại từ 'tôi' – 'anh ấy' trong lời
    kể của Lergen."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' – 'chúng ta' và nội dung cốt lõi 'muốn chúng ta
    đầu hàng'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa lời mở đầu lịch sự 'Thứ lỗi cho tôi, nhưng…', đại từ 'chúng
    ta' và câu hỏi phản vấn phủ định 'chẳng phải đó chính là điều chúng ta đang cố
    thực hiện hay sao?'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nhượng bộ 'Về mặt lý thuyết thì đúng là vậy', đại
    từ 'tôi' và nhân vật 'Đại tá Calandro'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc câu hỏi phản vấn của Trung tá Uger gửi tới Đại tá Lergen
    với cách gọi tôn ti 'Đại tá' (sau khi sửa lỗi moderate), cụm 'bản đề xuất' và
    'tất cả những nhượng bộ ấy'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa ngôi thứ hai số nhiều gọi độc giả 'các bạn', nhân vật 'Trung
    tá Uger', đại từ 'Tôi' – 'mình' – 'anh ấy' và thế lưỡng nan cảm xúc 'chẳng biết
    mình nên bật cười tán đồng với anh ấy, hay lắc đầu mà bật khóc nữa'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa nhân vật 'Trung tá Uger', đại từ 'tôi' – 'anh ấy' – 'mình',
    phép đối lập giữa 'một sĩ quan vẫn giữ được nhân tính của mình' với 'một sĩ quan
    Bộ Tổng tham mưu đã biến thành chiếc bánh răng trong cỗ máy chiến tranh' và động
    cơ bổn phận cuối đoạn."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô của Lergen với Uger 'Trung tá' (dịch đúng cấp bậc
    thực tế từ cách gọi rút gọn trong tiếng Anh) và cặp đại từ 'tôi' – 'anh'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa nhân vật 'Trung tá Uger', tên quốc gia 'Ildoa', cụm 'người bạn
    đáng kính của mình là Đại tá Calandro' và đại từ 'Tôi' – 'anh ấy' – 'mình'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' và chi tiết kiềm chế cảm xúc khi cất lời."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Uger', đại từ 'chúng ta' – 'Họ', phép đối
    chiếu 'những gì chúng ta coi là sự nhượng bộ… xem ra lại chẳng khác nào những
    yêu sách trong mắt kẻ thù' và nhận định tăng tiến 'coi chúng là một sự sỉ nhục'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn thể hiện sự sững sờ 'Cái gì cơ…?'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa cặp định danh song hành 'Đế quốc' – 'Đế chế', đại từ 'Họ' –
    'chúng ta', phủ định tuyệt đối 'không hề có ý định giải quyết cuộc chiến bằng
    đàm phán' và hình ảnh hạ nhục 'bắt chúng ta phải quỳ rạp xuống đất mà cầu xin
    sự tha thứ'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn hồi tưởng nhiều năm sau chiến tranh, đại từ 'tôi'
    – 'anh ấy', định danh 'Đế chế', nhân vật 'Đại tá Calandro' và ba sắc thái cảm
    xúc 'nỗi tuyệt vọng, sự cam chịu và cơn phẫn nộ'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000160
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Hai chúng tôi' – 'Tôi' – 'mình' và mức độ cận kề 'suýt
    chút nữa đã buông xuôi tất cả ngay trong khoảnh khắc đó…'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000161
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'chúng tôi' – 'mình', cách tự xưng 'lão già này'
    ở thời điểm viết hồi ký, các mệnh đề phủ định ('không biết phải nói gì', 'chẳng
    thể tìm ra lời nào', 'tuyệt đối không bao giờ nên được nhắc lại nữa', 'sẽ chẳng
    bao giờ được biết') và cụm 'đồng liêu và chiến hữu xuất chúng'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000162
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình' và niềm xác tín về 'ngày phán xét của
    mình rồi cũng sẽ đến'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000163
  kind: terminology_and_voice
  value: locks=["Khóa dòng ghi nguồn cuối chương 'Trích từ hồi ký chưa xuất bản của
    Lergen.'."]
