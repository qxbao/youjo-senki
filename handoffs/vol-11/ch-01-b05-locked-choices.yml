choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' – 'mình' của Tanya theo DEC-P01-001,
    các cấu trúc phủ định ('không sao rũ bỏ được', 'không tài nào dịu xuống được')
    và phép so sánh giả định ('như thể mình sắp sửa rơi vào ổ phục kích của địch')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' – 'mình' kết hợp lối tự nhắc tên
    ngôi thứ ba 'Tanya' đúng như nguyên bản, tên tổ chức 'Văn phòng Bộ Tổng tham mưu'
    và sự tương phản giữa mong muốn bỏ chạy với hành động hăng hái lên tiếng thưa
    với cấp trên."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lễ phép của cấp dưới với cấp trên ('Tôi có thể xin phép
    hỏi mục đích mình được triệu tập tới đây hôm nay là gì không ạ?'), giữ đúng đại
    từ 'Tôi' – 'mình' và đối tượng câu hỏi về mục đích triệu tập."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình', tên riêng 'Rudersdorf', ẩn dụ 'hai
    người đàn ông này đều là những con quái vật' và sự đối lập giữa vẻ mặt bình thường
    thoạt nhìn với câu chuyện khác hẳn từ những chiếc gạt tàn trên bàn."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', 'Tướng Zettour', đại từ 'ông ấy'
    – 'ông', sự đối lập giữa thói quen hút xì gà của Rudersdorf với chiếc gạt tàn
    nhét đầy thuốc lá quân đội rẻ tiền của Zettour và câu phủ định chốt đoạn ('Ông
    ấy thậm chí còn chẳng hút xì gà.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' – 'mình' và quan hệ nhân quả giữa
    luồng ớn lạnh chạy dọc sống lưng với phản xạ đứng thẳng người hơn nữa."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', đại từ 'ông ấy', các bước tự hiệu
    chỉnh phán đoán nội tâm của Tanya và phạm vi nhấn mạnh Markdown theo DEC-P01-002
    duy nhất ở từ '*điềm tĩnh*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ấy' (chỉ Zettour), danh xưng 'Tướng Rudersdorf',
    phủ định 'ông ấy đang không vui' và mệnh đề điều kiện về việc Rudersdorf biết
    rõ mà vẫn cố tình làm ngơ bất chấp mối quan hệ lâu năm."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa nhận định khái quát về điều ngu ngốc nhất một cấp dưới có thể
    làm khi cấp trên phật ý, đại từ tự quy chiếu 'mình', danh xưng 'Tướng Zettour'
    và hành động giữ im lặng chờ cấp trên lên tiếng trước."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Zettour dành cho Tanya ('Tiểu đoàn của cô thế nào
    rồi, Trung tá?'), giữ đại từ 'cô' và cách gọi quân hàm 'Trung tá'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000151
  kind: terminology_and_voice
  value: 'locks=["Khóa cách thưa gửi ''Thưa Tướng quân'', đại từ ''chúng tôi'', danh
    xưng ''Đại úy Ahrens'' và thông tin cốt lõi: sức chiến đấu của đơn vị bị giảm
    đi một nửa do đợt bàn giao các xe tăng mới."]'
- segment_id: YS-LN11/Text/chapter002.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', đại từ 'mình', 'Ông ấy' và chi
    tiết lấy điếu xì gà ra khỏi miệng rồi hỏi với vẻ mặt đầy hoang mang."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn lặp lại nguyên văn cụm từ then chốt ('Giảm đi một
    nửa ư?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng tôi' – 'mình', tên đơn vị 'đội hình Salamander',
    thuật ngữ 'tác chiến cơ động' và quan hệ điều kiện phủ định ('Nếu không thể tin
    tưởng vào khả năng cơ động của mình, đội hình Salamander không thể tiến hành lối
    tác chiến cơ động như thường lệ được ạ.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa dấu chấm lửng mở đầu và câu hỏi xác nhận tình trạng xe tăng
    ('…Tình trạng của chúng thực sự tệ đến mức đó sao?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' – 'mình', danh xưng 'Tướng Rudersdorf',
    đại từ 'ông ấy' – 'ông', chức vụ 'Phó Tổng tham mưu trưởng Văn phòng Bộ Tổng tham
    mưu', địa danh 'mặt trận phía đông' và nhận định phủ định về sự xa rời thực tế
    của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc tăng tiến ('Không chỉ có vậy'), địa danh 'mặt trận
    phía đông' và hình ảnh ẩn dụ về cuộc tiến hóa kiểu khủng long của những chiếc
    xe tăng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Rudersdorf', đại từ ngang hàng 'ông' (Zettour gọi
    Rudersdorf) và câu hỏi mỉa mai mang tình thái suy đoán ('Có lẽ ông đã rời xa tiền
    tuyến quá lâu rồi chăng?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn thể hiện sự ngạc nhiên của Rudersdorf ('Sao cơ?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000160
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', đại từ 'ông ấy', lối tự quy chiếu
    kết hợp tên riêng 'Tanya' và đại từ 'Mình' đúng theo nguyên bản, câu điều kiện
    chấp nhận số phận và ý định lựa lời cẩn thận để tỏ ra đúng chất một chuyên gia."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000161
  kind: terminology_and_voice
  value: locks=["Khóa sự đối lập giữa ưu điểm (lớp giáp dày hơn, vũ khí cỡ nòng lớn
    hơn, uy lực hơn) với nhược điểm (càng nhiều tính năng thì độ tin cậy càng giảm,
    nặng hơn vài tấn) và giới hạn khả năng khắc phục ('Chúng ta cũng chỉ có thể giảm
    trọng lượng của chúng đến một mức độ nhất định mà thôi.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000162
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', định danh 'Liên bang', danh xưng 'Tướng Rudersdorf',
    hai mệnh đề phủ định ('chẳng có gì đảm bảo...', 'chẳng cần phải nói toạc điều
    này ra...') và chi tiết Rudersdorf phả khói xì gà kèm tiếng rên khẽ trước khi
    lộ vẻ trầm ngâm u ám."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000163
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'cô', cách gọi quân hàm 'Trung tá', địa danh
    'ở miền đông' và câu hỏi xin ý kiến Tanya về hướng xử lý những chiếc xe tăng mới."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000164
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc đan xen giữa lời thoại ('Tôi' – 'chúng ta') và độc
    thoại nội tâm tự nhắc tên 'Tanya', danh xưng 'Đại úy Ahrens' cùng đại từ 'anh
    ấy', giả định trái thực tế ở hiện tại ('nếu đang là mùa thu'), sự đánh đổi giữa
    hỏa lực và độ cơ động, cùng câu phủ định chốt đoạn ('Trước đây, thời điểm trong
    năm chưa bao giờ ảnh hưởng nhiều đến xe tăng của chúng ta như thế này.')."]
