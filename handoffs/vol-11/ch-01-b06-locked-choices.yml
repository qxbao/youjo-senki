choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000165
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận xét ngắn của Rudersdorf ('Ra là chúng bị lún trong
    bùn. Tôi sẽ ghi nhớ điều đó.'), giữ đúng đại từ 'chúng' (chỉ số xe tăng mới) và
    'Tôi'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000166
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Vị chiến lược gia già' (chỉ Rudersdorf), 'sếp của
    mình' (chỉ Zettour), đại từ tự quy chiếu 'mình' theo DEC-P01-001 kết hợp lối tự
    nhắc tên ngôi thứ ba 'Tanya' đúng theo nguyên bản, cùng nhận định về hệ quả luôn
    kéo theo thêm rắc rối cho Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000167
  kind: terminology_and_voice
  value: locks=["Khóa lời của Zettour, chức danh 'Phó Tổng tham mưu trưởng Bộ Tổng
    tham mưu', cách gọi quân hàm 'Trung tá' dành cho Tanya và mệnh lệnh đưa cuộc họp
    quay lại đúng quỹ đạo."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000168
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' – 'Mình', danh xưng 'Tướng Zettour',
    sự đối lập giữa hy vọng làm chệch hướng cuộc thảo luận với hành động nén lại nỗi
    thống khổ và nhìn thẳng vào mắt Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000169
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'cô' trong lời Zettour hỏi Tanya và đối tượng
    câu hỏi về khả năng tác chiến."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000170
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp lễ phép chuẩn điều lệnh của Tanya ('Rõ, thưa Tướng quân!
    Xin ngài cứ hỏi bất cứ điều gì ạ.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000171
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', đại từ 'ông ấy', chuỗi miêu tả vẻ
    ngoài thân thiện, điềm nhiên đối lập với cảm giác kinh hãi và phép so sánh 'Chẳng
    khác nào nhìn thấy một con hổ đã dồn được con mồi vào chân tường'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000172
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận của Zettour ('Số xe tăng mới đó có phải là
    vấn đề duy nhất không?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000173
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 ở cụm mở đầu '*Cứ
    nói thẳng suy nghĩ của cô đi*', đại từ 'ông ấy' – 'mình', phủ định 'mình chưa
    thể để bản thân bị đánh lừa lúc này được' và sự tương phản giữa nụ cười bên ngoài
    với ánh mắt lạnh tanh như đá bên trong."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000174
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 duy nhất ở động
    từ '*quan sát*', đại từ 'ông ấy' – 'mình', phép so sánh với ánh mắt nhà khoa học
    quan sát chuột bạch, sự chuyển dịch điểm nhìn sang ngôi thứ ba 'Tanya' – 'cô'
    ở hai câu cuối và hình ảnh ẩn dụ 'diễn tròn vai con thú cưng đã được huấn luyện
    thuần thục'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000175
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ ''tôi'' – ''chúng tôi'' trong lời báo cáo của Tanya,
    tình thái giả định lịch sự (''Có lẽ tôi nên...'') và ba vấn đề được nêu: thiếu
    đạn pháo trong kho dự trữ, thiếu ngựa kéo vận chuyển đạn pháo, và việc điều động
    các pháp sư trên không đi làm nhiệm vụ biệt phái."]'
- segment_id: YS-LN11/Text/chapter002.xhtml/p000176
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn tiếp lời của Zettour ('Còn gì nữa không?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000177
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'Tôi' – 'chúng tôi' – 'Ngài', thuật ngữ 'Kampfgruppe',
    các bất bình về triển khai lực lượng không quân chậm trễ cùng yểm trợ đường không
    ngừng hoạt động, và câu hỏi tu từ mang giả định quá khứ ('lẽ ra tôi đã có thể
    lập được cả một Kampfgruppe mới sẵn sàng xuất kích')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000178
  kind: terminology_and_voice
  value: locks=["Khóa lời tổng kết thản nhiên của Zettour ('Thế là đủ rồi. Vậy tức
    là mọi chuyện vẫn như thường lệ.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000179
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' và chuỗi hành động nuốt tiếng rên,
    khẽ gật đầu trước khi bị một người nghe đầy kinh ngạc chen ngang."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000180
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi phản vấn phủ định của Rudersdorf ('Khoan đã, chẳng phải
    tất cả những chuyện đó đều là các vấn đề nghiêm trọng hay sao?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000181
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', lối tự nhắc tên 'Tanya' và quan
    hệ nhân quả giữa việc đánh giá tình hình tiền tuyến gây ra phản ứng bối rối của
    Rudersdorf với cảm giác lạnh toát sống lưng của Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000182
  kind: terminology_and_voice
  value: locks=["Khóa địa danh 'mặt trận phía đông', đại từ 'chúng tôi' và phạm vi
    nhấn mạnh Markdown theo DEC-P01-002 duy nhất ở từ '*lý tưởng*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000183
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngạc nhiên của Rudersdorf ('Ngay cả với tất cả ngần
    ấy vấn đề sao?')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000184
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp khẳng định ngắn gọn của Zettour ('Phải.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000185
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', cụm 'vị phó tổng tham mưu trưởng
    đang cứng họng' và thái độ hết mực niềm nở của Zettour khi nói tiếp."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000186
  kind: terminology_and_voice
  value: locks=["Khóa tên đơn vị 'Salamander Kampfgruppe', đại từ 'họ' và mệnh đề
    giải thích đặc quyền 'không bị xé lẻ ra để vét thêm người chỉ huy cho các đơn
    vị khác'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000187
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown theo DEC-P01-002 cho câu hỏi bằng
    ánh mắt '*Cô hiểu chứ hả?*', đại từ 'Cô' – 'mình' và phản ứng lặng lẽ gật đầu
    đáp lại."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000188
  kind: terminology_and_voice
  value: locks=["Khóa tên đơn vị 'Tiểu đoàn Pháp sư Trên không số 203', định danh
    'Đế quốc', đại từ 'họ', phủ định 'chẳng có kế hoạch nào nhằm xé lẻ họ ra cả' và
    quan hệ nhượng bộ ('bất chấp thực tế rằng họ đang nắm giữ một lượng pháp sư kỳ
    cựu tương đối lớn của Đế quốc')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000189
  kind: terminology_and_voice
  value: locks=["Khóa cụm chuyển ý kèm dấu chấm lửng ('Nhưng nghĩ đi nghĩ lại thì…')
    và lối tự nhắc tên 'Tanya'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000190
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Rudersdorf', địa danh 'mặt trận phía đông', cặp đại
    từ 'ông' – 'chúng tôi', phạm vi nhấn mạnh Markdown theo DEC-P01-002 duy nhất ở
    từ '*ổn định*' và nhận định chỉ đang cố cầm cự qua ngày một cách chật vật."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000191
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' – 'ông' trong lời đáp lạc quan của Rudersdorf với
    Zettour ('Ông sẽ nghĩ ra cách gì đó thôi. Lúc nào ông chẳng thế.')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000192
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'Tôi' – 'ông' – 'chúng ta' – 'chúng tôi', mệnh đề
    phủ định 'các mánh khóe sẽ không giúp chúng ta trụ lại cuộc chơi được bao lâu
    nữa đâu' và hình ảnh 'bám trụ một cách vô cùng mong manh'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000193
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình', định danh 'Đế quốc', nhận định về
    sự chênh lệch tột cùng trong nhận thức giữa hai vị cấp trên, cấu trúc giả định
    trái thực tế ('Nếu mình là một sử gia, hẳn sẽ là một niềm vinh dự...') và câu
    chốt mỉa mai rằng niềm vinh dự ấy chỉ có thể được tận hưởng ở thế giới bên kia."]
