choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000221
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001, đại từ
    ngôi thứ ba 'ông ấy' (chỉ Rudersdorf) và sắc thái kinh hãi trước việc bị ép trả
    lời câu hỏi tàn nhẫn."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000222
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' – 'ông ấy', định danh 'Being X' và sự so sánh
    ánh mắt kiên định tuyệt đối của kẻ tin mình nắm lẽ phải với Being X."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000223
  kind: terminology_and_voice
  value: locks=["Khóa tình thái nhượng bộ ('Một mức độ do dự nhất định có thể được
    châm chước') đối lập với mệnh lệnh dứt khoát ở câu kết ('đây là việc buộc phải
    làm')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000224
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Rudersdorf', đại từ 'ông ấy' – 'mình' – 'bản thân'
    và mệnh đề điều kiện giả định về hậu quả thảm khốc nếu tuân theo mệnh lệnh của
    ông ấy."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000225
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' và cấu trúc phủ định ('không thể
    nói ra điều mình thực sự mong muốn') trong lời cảm thán nội tâm."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000226
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng kèm kính ngữ 'Thưa Đại tướng ... ạ' và thuật ngữ 'sự
    tất yếu' trong câu hỏi dò xét của Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000227
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', các thuật ngữ 'sự tất yếu', 'Lục quân Đế
    quốc', 'sĩ quan tham mưu cao cấp' và cụm phủ định tuyệt đối 'không có ngoại lệ
    nào'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000228
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình', danh xưng 'Tướng Zettour' và 'Tướng
    Rudersdorf', cùng quan hệ đối lập khi Tanya vừa liếc nhìn cầu cứu Zettour thì
    Rudersdorf đã ra đòn trước."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000229
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' – 'cô', thuật ngữ 'Sự tất yếu', định danh 'Đế
    chế' và yêu cầu thực thi bổn phận không phàn nàn nhiều lời."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000230
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ấy' – 'mình', các định danh 'quân cảnh' – 'bên quân
    cảnh' và 'Bộ Tổng tham mưu', hai mệnh đề phủ định ở hai câu đầu cùng chuỗi ba
    câu hỏi nội tâm tiến thoái lưỡng nan ở cuối đoạn."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000231
  kind: terminology_and_voice
  value: locks=["Khóa lối tự nhắc tên ngôi thứ ba 'Tanya' – 'bản thân' và sự chuyển
    ngoặt từ vòng xoáy lợi ích xung đột sang tia hy vọng vừa lóe lên."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000232
  kind: terminology_and_voice
  value: locks=["Khóa đúng phạm vi nhấn mạnh Markdown theo DEC-P01-002 tại trợ động
    từ tình thái ('*có thể*') và sắc thái phân biệt giữa điều tất yếu hiện hữu với
    điều có khả năng trở nên cần thiết."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000233
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngang hàng 'ông' trong câu hỏi vặn lại ngắn gọn của Rudersdorf
    dành cho Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000234
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf' và 'Tướng Zettour', đại từ 'ông
    ấy' – 'Mình' và câu cảm thán phủ định đề cao đồng minh đáng tin cậy."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000235
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Degurechaff', cặp đại từ 'tôi' – 'Cô', các
    thuật ngữ 'tiểu đoàn', 'đế đô', 'quân ta' và hai tầng giả định điều kiện ('nếu
    tình thế đòi hỏi', 'Kể cả khi điều đó đồng nghĩa với việc...')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000236
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán một từ 'Đính chính!' thể hiện sự quay ngoắt nhận
    định trong nội tâm Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000237
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' trong câu tự thú nhận sai lầm."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000238
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' và hình ảnh ẩn dụ giọt hy vọng duy nhất xuyên
    thẳng qua tim rồi lao thẳng xuống địa ngục."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000239
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' – 'bọn mình' – 'ông ấy' – 'họ', danh xưng 'Tướng
    Zettour', các mệnh đề phủ định ('có lẽ không biết điều này', 'không hề kén chọn
    đối thủ') và phạm vi nhấn mạnh Markdown theo DEC-P01-002 ở cụm '*bất kể điều gì*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000240
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' – 'mình' – 'bọn mình' – 'họ', thuật ngữ 'hoàng
    cung', giả định không nghi ngờ việc cấp dưới nạp tọa độ hoàng cung ngay lúc phổ
    biến nhiệm vụ, câu hỏi tu từ tự trào và phạm vi nhấn mạnh Markdown theo DEC-P01-002
    ở đại từ '*mình*'."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000241
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'Họ' – 'cô' – 'chúng tôi' trong lời thúc giục nói
    thật lòng của Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000242
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', đại từ 'mình' – 'ông ấy' – 'bản thân',
    hai câu hỏi nội tâm liên tiếp cùng các câu phủ định khẳng định quyết tâm nắm lấy
    sợi dây cứu sinh để thoát khỏi cuộc thảo luận vượt cấp bậc."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000243
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' kèm kính ngữ 'ạ' và sắc thái dè dặt xin thêm thời
    gian suy nghĩ câu trả lời."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000244
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' – 'họ', danh xưng 'Tướng Rudersdorf' và 'Tướng
    Zettour', cùng sự tương phản trực tiếp giữa vẻ bất bình của Rudersdorf và sự hài
    lòng của Zettour."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000245
  kind: terminology_and_voice
  value: locks=["Khóa cặp quy chiếu 'người đầu' (Rudersdorf) – 'người sau' / 'ông
    ấy' (Zettour), đại từ 'mình', thuật ngữ 'phép thử lòng trung thành' và chuỗi ba
    câu hỏi nghi kỵ trong nội tâm."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000246
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi quân hàm 'Trung tá', đại từ 'tôi' – 'cô', cách Zettour
    gọi Rudersdorf là 'tên đần độn này' – 'ông ta' và lời bảo Tanya cứ phớt lờ sức
    ép trả lời vội."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000247
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ấy' (chỉ Zettour), cặp đại từ 'Tôi' – 'cô', các
    thuật ngữ 'nhà chiến lược' và 'sĩ quan chỉ huy', cùng yêu cầu phải trả lời thành
    thật ngay lập tức."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000248
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn từ lối tự nhắc tên ngôi thứ ba 'Tanya'
    – 'cô' ở hai câu đầu sang đại từ nội tâm tự quy chiếu 'mình' ở hai câu cuối theo
    DEC-P01-001, cùng hình ảnh ẩn dụ muốn tìm bãi rác gần nhất để trút bỏ cả núi lời
    phàn nàn."]
