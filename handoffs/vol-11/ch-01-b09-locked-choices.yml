segment_id_end: YS-LN11/Text/chapter002.xhtml/p000275
choices:
- segment_id: YS-LN11/Text/chapter002.xhtml/p000249
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'ngài' kèm kính ngữ 'ạ' và cấu trúc giả định
    lịch sự phủ định ('nếu ngài đừng chèn ép tôi quá mức như vậy')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000250
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001, các thuật
    ngữ 'chèn ép bằng quyền chức', 'Văn phòng Thanh tra Tiêu chuẩn Lao động', 'Đế
    chế', giả định trái thực tế ('giá mà làm được thì mình đã chạy thẳng tới...')
    và phủ định tuyệt đối ('con số không tròn trĩnh')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000251
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'tiêu chuẩn lao động', đại từ số nhiều 'Chúng ta'
    và giọng cảm thán bi hài nơi tiền tuyến thế giới khác."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000252
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' – 'bản thân' – 'họ', các thuật ngữ 'người theo
    chủ nghĩa tự do cá nhân' và 'cuộc đảo chính', tình thái khả năng ('có thể sẽ trở
    thành') cùng quan hệ so sánh tăng tiến ở câu kết ('bị bưng bít hoàn toàn... đã
    là một vấn đề rồi… nhưng việc bị đặt vào ngay tâm điểm... còn tệ hơn gấp bội')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000253
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'chúng ta' – 'họ' và lập luận lấy trạng thái
    tinh thần cùng chuẩn mực đạo đức nội tại của từng người lính làm lý do thoái thác."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000254
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'mình' và sự tương phản ngầm giữa vẻ ngoài
    nêu quan ngại chính đáng với việc vắt óc tìm đường thoát thân."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000255
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' – 'bản thân', danh xưng lịch sử 'Mặc Đốn Thiền
    vu', địa danh 'Mông Cổ' / 'thảo nguyên Mông Cổ', giả định trái thực tế ở câu đầu
    ('Giá như ở vào vị trí... mình hẳn sẽ tự hào...'), phủ định kép ('không phải là
    Mông Cổ, cũng chẳng phải thế kỷ thứ hai') và ý tránh đối đầu trực diện với chuẩn
    mực văn hóa – pháp lý hiện đại."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000256
  kind: terminology_and_voice
  value: locks=["Khóa đúng phạm vi nhấn mạnh Markdown theo DEC-P01-002 tại đại từ
    '*mình*', đại từ 'họ' và kết luận bắt buộc phải đánh lừa hai vị tướng để bảo toàn
    triển vọng chuyển việc."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000257
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' kèm kính ngữ 'ạ' và sắc thái từ chối khéo léo giảm
    nhẹ ('việc đó e là khó khăn')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000258
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' – 'mình' – 'bản thân' – 'họ' và thế lưỡng khả
    có chủ đích thông qua cấu trúc phủ định kép ở câu đầu ('không tuyên bố là không
    thể làm được, nhưng họ cũng chẳng thể diễn giải... rằng việc đó là khả thi')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000259
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', đại từ 'Ông ấy' và diễn tiến hành
    động từ vẻ nhìn bất ngờ, khoanh tay cân nhắc sang bày tỏ sự cảm thông."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000260
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta' và lời tạm gác vấn đề lại để tính cách giải
    quyết sau."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000261
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ấy' – 'mình', danh xưng 'Tướng Rudersdorf', hình
    ảnh ẩn dụ lái thuyền lách qua rạn đá ngầm tạm thời thoát mắc cạn và mong muốn
    tìm cớ đi xa khỏi Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000262
  kind: terminology_and_voice
  value: locks=['Khóa câu hỏi tu từ nội tâm nhắc nhở luôn phải lường trước điều bất
    ngờ trong thời chiến.']
- segment_id: YS-LN11/Text/chapter002.xhtml/p000263
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', lối tự nhắc tên ngôi thứ ba 'Tanya'
    và hình ảnh so sánh việc thản nhiên quăng một quả bom vào tay cô."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000264
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'Cô' và câu hỏi gợi ý thăng hàm trực tiếp
    của Rudersdorf."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000265
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' – 'chúng ta', câu hỏi lặp lại 'Thăng hàm ư?',
    phủ định 'không phải ngoại lệ' và mệnh đề điều kiện giới hạn ở câu cuối ('đấy
    là khi chúng ta đang ở trong hoàn cảnh bình thường kìa')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000266
  kind: terminology_and_voice
  value: locks=["Khóa sắc thái dè chừng phủ định kèm kính ngữ 'ạ' trong câu đáp của
    Tanya."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000267
  kind: terminology_and_voice
  value: locks=["Khóa sự luân phiên giữa đại từ nội tâm 'Mình' và tên ngôi thứ ba
    'Tanya', phép so sánh biến động thị trường cùng mệnh đề đối lập đặt sự an toàn
    lên trên danh vọng trong thời khủng hoảng."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000268
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ngài' – 'tôi' kèm kính ngữ 'ạ' và sắc thái suýt
    bị mắc câu ('suýt nữa thì dụ được tôi rồi')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000269
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Phòng nhân sự', đại từ 'Mình' và hai mệnh đề phủ
    định nhấn mạnh sức cám dỗ không thể chối cãi của việc thăng tiến trước khi chuyển
    việc."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000270
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Rudersdorf', đại từ 'ông ấy', hình ảnh ẩn dụ
    'củ cà rốt' nhử những quân tốt thí và cấu trúc phủ định kép khẳng định chắc chắn
    có bẫy ('Chẳng có viễn cảnh nào mà củ cà rốt này lại không bị tẩm thuốc diệt chuột
    cả')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000271
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô' và câu hỏi dò xét của Rudersdorf về việc theo đuổi
    cấp bậc cao."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000272
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ấy' – 'Mình' và sự tương phản giữa vẻ mặt nghiêm
    túc bên ngoài với nỗi tiếc nuối thực sự bên trong khi phải từ chối."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000273
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'ngài' – 'họ' và lập luận lấy trách nhiệm
    với binh lính dưới quyền để phủ định khả năng rời bỏ đơn vị ('không thể cho phép
    bản thân rời bỏ họ')."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000274
  kind: terminology_and_voice
  value: locks=["Khóa giả định điều kiện về cái bẫy phạm pháp nếu cắn vào củ cà rốt,
    danh xưng 'Tướng Rudersdorf' và lối tự nhắc tên ngôi thứ ba 'Tanya' khi mô tả
    vỏ bọc người sĩ quan yêu nước trọng nghĩa tình."]
- segment_id: YS-LN11/Text/chapter002.xhtml/p000275
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' – 'cô' – 'họ', các định danh 'Cục Nhân sự',
    'Trung tá', 'trung đoàn' và câu hỏi đề nghị chỉ huy trung đoàn riêng ở cuối đoạn."]
