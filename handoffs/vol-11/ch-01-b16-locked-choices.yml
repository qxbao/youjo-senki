choices:
- segment_id: YS-LN11/Text/chapter004.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta''.", "Thuật ngữ và địa danh: ''miền
    đông'', ''công binh, pháp sư, pháo binh và bộ binh'', ''Đế quốc'', ''nhân viên
    trị an mặc sắc phục''.", "Phủ định và tình thái: giữ đối lập giữa giả định đánh
    căn cứ địch ở miền đông với mục tiêu thực tế trong lòng Đế quốc (''hẳn đã là quá
    đủ rồi'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Sắc thái thoại của Tanya với Zettour: kết câu bằng tiểu từ lễ
    phép ''ạ''.", "Thuật ngữ: ''đơn vị quân cảnh'' (MP unit), ''cuộc đảo chính'' (the
    coup)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: gọi Tanya là ''cô'',
    dùng ''chúng ta''.", "Thuật ngữ: ''Bộ Tổng tham mưu'' (the General Staff), giữ
    dấu chấm lửng bỏ lửng câu hỏi."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Tên gọi và phủ định: ''Tướng Zettour'', giữ đúng câu trần thuật
    ngắn ''không nói hết câu''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Đại từ quy chiếu Zettour trong trần thuật: ''ông ấy''.", "Giữ
    dấu chấm lửng tạo nhịp ngập ngừng trước khi đi đến kết luận (''rốt cuộc… cũng
    đi đến kết luận'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và đại từ: trần thuật gọi ''Tướng Zettour'' / ''Ông ấy'';
    trong thoại Zettour tự xưng ''tôi'' và dùng ''chúng ta''.", "Phủ định và ẩn dụ:
    giữ cấu trúc ''Chẳng có lý do gì mà... lại cứ phải do các pháp sư thực hiện cả'';
    chỉnh ''cuộc tiểu phẫu nhỏ'' thành ''ca phẫu thuật nhỏ'' (hoặc ''ca tiểu phẫu'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: gọi Zettour là ''ngài''
    và có ''ạ'' ở cuối câu hỏi.", "Từ vựng: ''lũ man rợ'' (barbarians)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: xưng ''Tôi''.", "Giữ quan hệ
    mức độ - hệ quả (''đắm mình vào guồng quay man rợ của chiến tranh sâu đến mức
    quên mất cách đánh những trận ở quê nhà rồi'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn và đại từ nội tâm: Tanya tự quy chiếu bằng ''mình''
    (''vị cấp trên của mình''), quy chiếu Zettour là ''Ông ấy''; tránh dùng ''mình''
    cho Zettour ở vế đầu để không trùng đại từ nội tâm."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: ''chúng ta''.", "Thuật ngữ: ''ra
    tay phủ đầu'' (preemptively), ''lực lượng quân cảnh'' (the MPs), giữ dấu chấm
    lửng cuối câu."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya nối lời Zettour: ''Chúng ta''.",
    "Thuật ngữ: ''tập trung hóa quyền lãnh đạo quân đội'' (centralize our military’s
    leadership), ''trong quá trình xét xử'' (during the trial)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Tên gọi và đại từ: ''Tướng Zettour'', ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=[''Giữ dấu chấm lửng ở cả đầu và cuối câu thoại tự nhủ của Zettour.'',
    "Thuật ngữ: ''cuộc đấu đá ngầm'' (secret feud), ''Đế quốc'' (the Empire)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Sắc thái lễ độ trong thoại của Tanya với Zettour: ''Vâng, ...
    ạ.''"]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: xưng ''tôi'', gọi Tanya
    là ''cô''.", "Ẩn dụ y khoa và cờ bàn: ''các ca phẫu thuật thì càng ít xâm lấn
    bao giờ cũng càng tốt'', ''với bàn cờ hiện tại, nước đi tiếp theo của cô sẽ là
    gì?''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: Tanya tự quy chiếu bằng ''Mình'' theo DEC-P01-001;
    đổi ''như thể mình là'' ở câu đầu thành ''như thể ông ấy là'' để tách bạch chủ
    thể.", "Thuật ngữ: ''giáo sư tại học viện quân sự'' (military academy professor)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''Chúng ta'', ''ông ấy'' (chỉ Zettour), ''mình''
    (chỉ Tanya).", "Phủ định: giữ vế đối lập ''theo cái cách mà mình chẳng bao giờ
    làm nổi''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và cấp bậc trong thoại của Zettour với Tanya: xưng ''Tôi'',
    gọi ''cô'', ''Trung tá'' (Colonel)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya: xưng ''Tôi'', dùng ''chúng ta'',
    gọi ''Tướng Rudersdorf'' và quy chiếu bằng ''ông ta''.", "Thuật ngữ: ''Văn phòng
    Bộ Tổng tham mưu'' (General Staff Office)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta'', quy chiếu Rudersdorf là ''ông ta''.",
    "Thuật ngữ: ''Cuộc thanh trừng'' (The purge), ''cuộc đảo chính'' (the coup)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta'', quy chiếu Rudersdorf là ''ông ta''.",
    "Chức danh và địa danh: ''Phó Tổng tham mưu trưởng Văn phòng Bộ Tổng tham mưu''
    (Deputy Director of the General Staff Office), ''mặt trận phía đông'' (the eastern
    front).", "Phủ định và câu hỏi tu từ: giữ đúng thế bế tắc logic (''chẳng có kịch
    bản nào... Ngay cả khi..., thì rốt cuộc ông ta sẽ bỏ mạng ở đó bằng cách nào đây?'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: xưng ''tôi'', gọi ''cô''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya: ''Chúng ta'', quy chiếu Rudersdorf
    là ''ông ta''.", "Thuật ngữ: ''mặt trận phía đông'' (the eastern front), ''lục
    quân'' (the army)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta''.", "Thuật ngữ và địa danh: ''kinh
    tế học đô thị'' (urban economics), ''quyền bính'' (authority), ''miền đông'' (the
    east)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm và phủ định kép: tự quy chiếu ''mình'', giữ lối
    nói giảm ''cũng chẳng phải chuyện gì mà mình có thể gọi là bất thường''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và cấp bậc trong thoại của Tanya: ''chúng ta'', ''Đại
    tá Lergen'' (Colonel Lergen), ''Tướng Rudersdorf'' (General Rudersdorf), ''miền
    đông'' (the east)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Phủ định dứt khoát trong thoại của Zettour: ''Việc đó không làm
    được đâu.''"]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm tự quy chiếu của Tanya: ''mình'' theo DEC-P01-001.",
