segment_id_end: YS-LN11/Text/chapter004.xhtml/p000197
choices:
- segment_id: YS-LN11/Text/chapter004.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: xưng ''tôi'', gọi ''cô'',
    dùng ''chúng ta'' cho hành động chung.", "Giữ ẩn dụ mẫu tính: ''cái đẩy đầy tình
    mẫu tử của sự tất yếu''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Trần thuật nội tâm: quy chiếu ''Zettour và Rudersdorf'' là ''Họ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm tự quy chiếu của Tanya: ''mình'' theo DEC-P01-001;
    quy chiếu Zettour và Rudersdorf là ''cả hai người họ'' / ''cả hai''.", "Thuật
    ngữ và phủ định: ''sinh vật phi lý tính'', giữ cấu trúc ''không khỏi cảm thấy''
    và tình thái ''có lẽ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''mình''; chỉnh ''việc nói lời chiều lòng cấp
    trên'' thành cách diễn đạt khái quát không gắn thêm ''cấp trên''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Chức danh trong thoại của Tanya: ''Ngài phó tổng tham mưu trưởng''
    (quy chiếu Rudersdorf)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''Mình'', dùng ''chúng ta'' khi gắn
    với ''Đế quốc''; quy chiếu Rudersdorf là ''Ông ta'' / ''ông ta''.", "Phủ định
    đối lập và thuật ngữ: ''chưa bao giờ nằm ở năng lực hoạch định chiến lược mà là
    ở tính khí của ông ta'', ''nguồn nhân lực''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta'', quy chiếu Rudersdorf là ''ông ta'',
    giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ trong thoại của Tanya với Zettour: xưng ''tôi'',
    gọi Rudersdorf một cách lịch sự là ''Ông ấy'', giữ nguyên ''Heimat''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''mình'', danh xưng ''Tướng Zettour''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và quân hàm trong thoại của Zettour với Tanya: gọi ''Trung
    tá'', ''cô'', xưng ''tôi''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''ngài'', ''thưa ngài''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: giữ tiếng cười ''Ha-ha-ha-ha'' và cụm ''người
    mẹ của chúng ta''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''mình'', quy chiếu Zettour là ''ông
    ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Tanya với Zettour: ''Người mẹ của chúng ta ạ?''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''mình'', quy chiếu ''Tướng Zettour''
    là ''ông ấy''; giữ cụm ''sinh vật xã hội''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ và đại từ trong thoại của Zettour: ''Mẹ Tất Yếu'', quy chiếu
    bằng ''bà'' / ''bà ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''mình'', quy chiếu Zettour là ''Ông
    ấy'' / ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour với Tanya: quy chiếu Mẹ Tất Yếu là ''Bà ấy'',
    gọi Tanya là ''Cô'', giữ câu hỏi phủ định ''Cô không đồng ý sao?''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Tên gọi và đại từ nội tâm: giữ ''Being X'', ''Mẹ Tất Yếu'' (''bà
    ấy''), ''Tướng Zettour'' (''ông ấy'')."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: gọi Zettour là ''ngài'',
    quy chiếu Mẹ Tất Yếu là ''bà ấy'', có ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: xưng ''tôi'', gọi ''Cô'',
    giữ phủ định ''không cần phải tâng bốc tôi đâu''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''Mình'' / ''mình'', gọi Zettour
    là ''cấp trên của mình''; bỏ cụm dư ''về phía ông ấy'' theo khuyến nghị."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: quy chiếu Zettour là ''Ông ấy'',
    giữ hai câu hỏi liên tiếp và câu giả định cuối đoạn."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ trong thoại của Zettour: ''chúng ta'', ''Tôi'',
    ''Rudersdorf'', ''đế đô''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ trong thoại của Tanya: ''Chúng ta'', ''quân
    cảnh'', kết câu hỏi bằng ''ạ''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''Mình'', quy chiếu ''Tướng Zettour''
    / ''con quái vật này'' là ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: xưng ''Tôi'' / ''tôi'', dùng
    đại từ phản thân ''mình''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm và tổ chức: tự quy chiếu ''mình'', quy chiếu Zettour
    là ''Ông ấy'' / ''ông ấy'', giữ ''Văn phòng Bộ Tổng tham mưu''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: tự quy chiếu ''mình''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và địa danh trong thoại của Tanya với Zettour: xưng ''tôi'',
    gọi ''Ngài'', ''mặt trận phía đông'', có ''ạ''; đổi ''rời bỏ'' thành ''rời khỏi''
    hoặc ''chia tay với''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Thoại xác nhận ngắn của Zettour: ''Đúng vậy.''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và địa danh trong câu hỏi của Tanya: ''chúng ta'', ''ở
    miền đông'', kết câu bằng ''không ạ?''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: ''chúng ta'', quy chiếu ''Tướng Zettour'' / ''người
    đàn ông này'' là ''ông ấy''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Giữ tính giả định trong nhận định nội tâm: ''Một sự thay đổi ở
    cấp chỉ huy sẽ đủ để đưa cuộc chiến này đến hồi kết tất yếu của nó.''."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Chủ thể phát ngôn và dấu câu: lời của Zettour nói tiếp sang đoạn
    p000197 (xưng ''Tôi'', dùng ''chúng ta'', giữ nguyên việc không đóng ngoặc kép
    ở cuối đoạn p000196)."]'
- segment_id: YS-LN11/Text/chapter004.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và chức danh trong phần thoại tiếp nối của Zettour với
    Tanya: xưng ''Tôi'' / ''tôi'', gọi ''cô'', dùng ''sĩ quan tham mưu cao cấp''.",
    ''Nhấn mạnh Markdown: toàn bộ 36 đoạn từ p000162 đến p000197 không có thẻ nhấn
    mạnh trong XHTML gốc nên không dùng *...* trong bản dịch theo DEC-P01-002.'']'
