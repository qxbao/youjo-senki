choices:
- segment_id: YS-LN11/Text/chapter008.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'Tôi' – 'mình' của Lergen trong mạch hồi ký,
    tên quốc gia 'Ildoa', quan hệ nhân quả qua dấu ba chấm 'và kết quả là…' và cụm
    giải thích sau dấu gạch ngang 'chiến dịch quân sự nọ—mũi xung kích tiên phong
    đánh thốc vào Ildoa'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' và sự chuyển biến vai trò đối lập trong tương lai
    nhìn từ quá khứ 'Từ một nhà đàm phán, tôi sẽ trở thành một kẻ xâm lược'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', tên quốc gia 'Ildoa', định danh 'Đế quốc',
    chức danh 'đặc sứ ngoại giao', hai mệnh đề phủ định tuyệt đối 'chưa từng do thám
    Ildoa...' và 'chưa từng đàm phán hòa bình ở Ildoa với dã tâm xâm lược họ' cùng
    lời thề danh dự về sứ mệnh duy nhất là tìm lối thoát khỏi cuộc chiến cho Đế quốc."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', tên quốc gia 'Ildoa', cấu trúc nhượng
    bộ 'Dù biết... tôi vẫn muốn làm tất cả những gì có thể cho đến tận phút cuối cùng
    để tránh cho đất nước mình khỏi cảnh sụp đổ' và kết cục đối lập 'tất cả đều trở
    thành công cốc'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', dấu ba chấm và dấu gạch ngang tự nhận
    lỗi 'Dẫu nói là vậy… tôi vẫn chấp nhận rằng mình đã sai—tôi buộc phải chấp nhận
    điều đó' cùng mong muốn duy nhất là sự thành tâm."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', mức độ xác tín ở quá khứ 'từng tin chắc rằng còn
    có một kế hoạch khác nằm ngoài con đường ngoại giao' và thuật ngữ quân sự 'một
    cuộc tiến công'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', nhấn mạnh Markdown theo DEC-P01-002 tại đúng cụm
    tình thái '*có thể*' ('*có thể* sẽ có một cuộc tấn công') và mệnh đề điều kiện
    giả định 'nếu những nỗ lực của tôi thất bại, một phần trong tôi hiểu rằng sẽ có
    một phương án khác được khởi động'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Không ai nói thẳng điều đó ra thành lời', đại từ 'tôi'
    và ẩn dụ nhận thức 'phác họa nên toàn bộ bức tranh'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'mình', tên cơ quan 'Bộ Tổng tham mưu', thuật
    ngữ 'thông tin tuyệt mật', câu hỏi tu từ mở đầu và chi tiết liếc thấy tài liệu
    không được phép xem của đồng nghiệp cùng việc có bạn bè ở những vị trí trọng yếu."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'mình', định danh 'Đế quốc', tên quốc gia 'Ildoa',
    cơ quan 'Bộ Tổng tham mưu', danh xưng 'Tướng Rudersdorf', 'Tướng Zettour', phủ
    định 'chưa từng nằm mơ tới chuyện Đế quốc sẽ tấn công Ildoa' và cấu trúc đối sánh
    'không hẳn là một chủ trương chung của Bộ Tổng tham mưu… mà giống một chuỗi những
    nước cờ nhỏ...'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' – 'chúng tôi', điểm nhìn hồi ký hướng tới 'các
    thế hệ tương lai' và lời xin lỗi người đọc khi tạm đi lệch mạch chính."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' và lời dẫn nhập chuyển đoạn 'Trước hết, hãy bắt
    đầu với cấp bậc của tôi'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', tên quốc gia 'Ildoa', tên cơ quan 'Văn phòng Bộ
    Tổng tham mưu' và nhận định về 'một vị trí có phần kỳ lạ'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', ngôi thứ hai số nhiều gọi độc giả 'các bạn', chức
    danh 'sĩ quan cao cấp thuộc Cục Tác chiến của Bộ Tổng tham mưu' và cách ví von
    'một kẻ đụng việc gì làm việc nấy'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', tên cơ quan 'Văn phòng Bộ Tổng tham mưu', định
    danh 'Đế quốc', nhân vật 'Trung tá Uger', chức danh 'Tổng tham mưu trưởng', cấu
    trúc 'không chỉ... mà còn...' và chi tiết nguyên tắc chỉ huy (Tổng tham mưu trưởng
    phát lệnh trực tiếp cho cấp dưới của Lergen cũng là vi phạm quy tắc)."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000127
  kind: terminology_and_voice
  value: locks=['Khóa nhận định khẳng định tính tất yếu và cấp bách của sự thay đổi
    vào thời điểm đó.']
- segment_id: YS-LN11/Text/chapter008.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng tôi' – 'tôi' – 'mình', phủ định 'không tài nào
    nhận ra được bất cứ điều gì bất thường' do khối lượng công việc không tưởng và
    phủ định kép 'không thể phủ nhận rằng...'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' – 'bản thân' – 'chúng tôi', thuật ngữ 'K-Brot',
    'sĩ quan tham mưu', 'hậu phương', ẩn dụ 'chiếc khăn bịt mắt thể chế đã giữ cho
    chúng tôi mãi ngây thơ', giả định quá khứ 'Chúng tôi hẳn đã chết vì làm việc quá
    sức' và sắc thái mỉa mai chua chát 'đón nhận cái chết đầy vẻ vang dưới sức nặng
    nghiền nát của khối lượng công việc nơi hậu phương'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa chức danh 'Phó Tổng tham mưu trưởng Zettour' / 'vị Phó Tổng
    tham mưu trưởng', đại từ 'tôi' – 'Ông', tên cơ quan 'Bộ Tư lệnh Tối cao Đế quốc',
    cụm liệt kê sau dấu gạch ngang 'các hoạt động hậu phương—quản lý quân lương, hậu
    cần, đường sắt và những việc đại loại thế' cùng chú thích trong ngoặc đơn."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', danh xưng kèm chú thích thời gian 'vị tướng (vào
    thời điểm đó)', định danh 'Đế quốc', phép đối chiếu 'tình hình ngoài tiền tuyến
    với tình hình ở quê nhà' và cụm 'viễn cảnh chiến thắng ảm đạm của Đế quốc'."]
- segment_id: YS-LN11/Text/chapter008.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa danh hiệu trong ngoặc kép '“Vĩ đại”' và nhận định khái quát
    mang tính lịch sử kết thúc đoạn."]
