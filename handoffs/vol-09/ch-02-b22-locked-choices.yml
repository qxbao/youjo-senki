segment_id_end: YS-LN09/Text/chapter008.xhtml/p000177
choices:
- segment_id: YS-LN09/Text/chapter008.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & tình thái giả định: giữ đại từ tự quy chiếu
    ''mình'' (DEC-P01-001) và cấu trúc giả định phản thực tế ''rất muốn cãi rằng bản
    thân có bề dày kinh nghiệm phong phú, nhưng đó sẽ là một lời khẳng định vô căn
    cứ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Thán từ nội tâm & trần thuật: giữ câu cảm thán ''Chết tiệt.'',
    tên riêng ''Tanya'', ''Rudersdorf'' và cử chỉ nhận ra vấn đề ''vỗ tay cái bốp''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại & dấu câu: giữ dấu ba chấm mở đầu, cặp đại từ
    ''tôi'' – ''cô'' và nhận định ''Sự thiếu kinh nghiệm của cô là điều quá đỗi hiển
    nhiên rồi.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi lễ phép ngắn: giữ ''Dạ?'' thể hiện sự ngạc nhiên lễ phép
    của Tanya trước cấp trên."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại & lời tự nhận lỗi: giữ cặp đại từ ''tôi'' –
    ''cô'', từ ''quân ngũ'' và lời thừa nhận ''lời chỉ trích vừa rồi của mình là không
    thỏa đáng''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & câu hỏi nghi vấn: giữ đại từ tự quy chiếu
    ''mình'' (DEC-P01-001), danh xưng ''vị tướng'', đại từ ''Ông ta'' trong mạch độc
    thoại bức xúc và hai câu hỏi liên tiếp."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & điểm nhìn nội tâm: giữ đại từ ''ông ta'', ''mình''
    (DEC-P01-001) và cấu trúc điều kiện ''Nếu ông ta muốn nghe phản biện thì mình
    có cả đống.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba, phủ định & câu hỏi giả định: giữ tên ''Tanya'',
    đại từ ''cô'', ''ông ta'', câu phủ định tuyệt đối ''Đời nào cô có thể nói ra bất
    kỳ điều gì trong số đó.'' và câu hỏi giả định ở cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, dấu ngoặc kép mỉa mai & phủ định kép: giữ tên ''Tanya'',
    đại từ ''cô'', dấu ngoặc kép quanh từ ''“tình nguyện”'' và chuỗi phủ định ''chẳng
    có vốn sống nào khác đáng kể, dù chỉ trên danh nghĩa, và tuyệt đối không có cách
    nào để cô tuyên bố ngược lại''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép (DEC-P01-001) & ẩn dụ chiến hào: giữ đại từ nội
    tâm ''Mình'' đi cùng tên ''Tanya'' ở câu dẫn, danh xưng ''vị tướng'', đại từ ''ông'',
    cặp đại từ thoại ''tôi'' – ''cô'' và hình ảnh ''sự tĩnh lặng trước giờ xung phong'',
    ''chờ tiếng còi dưới chiến hào''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Hội thoại tiếp nối ẩn dụ: giữ cụm ''Theo phép ví von đó'' và mệnh
    đề ''khi nền hòa bình rốt cuộc cũng đi đến hồi kết, nó sẽ vỡ vụn chỉ trong chớp
    mắt''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đối lập điều kiện trong thoại: giữ tên ''Rudersdorf'',
    chi tiết ''ngậm điếu xì gà lên môi với vẻ khó nhọc'', thế đối lập có/không có
    ''trật tự'' và hình ảnh ''một lớp băng mỏng''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái giả định & giọng mỉa mai: giữ ''Đế quốc'',
    ''Lục quân Đế quốc'', dấu ba chấm tự đính chính và câu chốt mỉa mai ''nếu chúng
    ta chỉ đang nói những lời sáo rỗng chẳng mang lại ý nghĩa gì''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tài chính & phủ định: giữ ''đầu tư không đi kèm với
    lời bảo đảm rằng bạn sẽ thu hồi được vốn gốc''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ doanh nghiệp & so sánh: giữ các cụm ''đánh mất định nghĩa
    về chiến thắng'', ''bọn lừa đảo đang dắt mũi các cổ đông'' và ''thông cáo báo
    chí của mấy công ty khởi nghiệp''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ tín dụng ngắn: giữ ''Khoản tín dụng mang tên chiến thắng
    giờ chỉ còn là nợ xấu.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tín dụng & phủ định giả định: giữ ''xếp hạng tín nhiệm'',
    ''đầu tư vào nợ xấu'' và phủ định ''chẳng thể tìm thấy lấy một tia hy vọng nào
    trong thương vụ này''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Nghịch lý nội tâm & cảm thán: giữ thế nghịch lý ''điều nực cười
    nhất... là người ta chẳng thể nào cười nổi trước cái tình cảnh phi lý này'' và
    câu cảm thán về ''cơn ác mộng thực sự''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, tên riêng tiền kiếp & câu hỏi hồi tưởng: giữ
    đại từ ''mình'' (DEC-P01-001), cụm ''ký ức chủ quan'', tên ''nước Mỹ'' và câu
    hỏi tu từ hồi tưởng."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tài chính & dấu gạch ngang: giữ ''Mấy khoản vay thế
    chấp dưới chuẩn đó—đúng là một cơn hoảng loạn kinh hoàng.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Dấu ngoặc kép & nhận định cảm thán: giữ dấu ngoặc kép quanh ''“người
    Mỹ bình thường”'', ý ''đồng lòng quyết định phớt lờ sự bất thường ấy'' và câu
    kết ''Thật không thể tin nổi.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Chuỗi danh ngữ mở đầu & xưng hô hội thoại: giữ dấu ba chấm mở
    đầu, ba cụm danh ngữ liên tiếp, danh xưng ''Thưa Tướng quân'' và định danh ''một
    màn kịch lừa bịp trắng trợn''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Liên kết từ vựng trong thoại đáp: giữ từ ''Lừa bịp'' nối với đoạn
    trước và cấu trúc ''kế hoạch vẫn là kế hoạch''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả, phủ định tương lai & kính ngữ: giữ liên kết
    từ ''màn lừa bịp'', mệnh đề giải thích ''vì nó sẽ chẳng thể nào thành hiện thực
    được'' và kính ngữ ''đấy ạ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Đại từ hội thoại, phủ định kép & tên riêng: giữ đại từ ''chúng
    ta'', tên ''Đế quốc'' và cấu trúc phủ định kép ''chẳng có gì bảo đảm rằng chuyện
    đó sẽ không kích nổ quả bom thổi bay cả Đế quốc lên tận trời xanh''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Định nghĩa nội tâm & dấu gạch ngang: giữ ''Một vụ nổ—tức là một
    cơn bạo loạn điên cuồng chưa từng có tiền lệ.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán nội tâm: giữ thán từ ''Ồ'', tình thái ''hẳn
    ông ấy đang nói đến... đây mà'' và nội dung ''khi thua một cuộc chiến''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & câu hỏi phản biện: giữ đại từ ''mình'' (DEC-P01-001),
    cụm ''con người thực tế trong mình'' và câu hỏi ''Liệu một đất nước đã chiến đấu
    vượt quá ngưỡng kiệt quệ có còn đủ sức lực cho một vụ nổ như thế không?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc nghi vấn gián tiếp: giữ cấu trúc ''Chuyện con người có
    tiếp tục bấu víu vào... hay không vẫn là một câu hỏi bỏ ngỏ.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Xưng hô lễ phép, dấu ba chấm & câu hỏi giả định: giữ đại từ ''Tôi'',
    ''chúng ta'', dấu ba chấm ngập ngừng, cụm ''vắt kiệt sức lực'' và câu hỏi ''chẳng
    phải vẫn có khả năng rốt cuộc chúng ta sẽ lặng lẽ đón nhận hòa bình sao ạ?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại & giọng mỉa mai: giữ đại từ ''Cô'' và câu hỏi
    mỉa mai ''gia nhập vào bầy lũ mộng mơ đang đắm chìm trong những ảo tưởng giữa
    ban ngày rồi đấy à?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba & phủ định song hành: giữ đại từ ''ông'',
    tên ''Tanya'', đại từ ''Cô'' và cấu trúc ''chẳng phải kẻ theo chủ nghĩa bại trận
    vô nguyên tắc mà cũng chẳng phải người lạc quan''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, xưng hô & thuật ngữ: giữ tên ''Tanya'', lời phủ định
    lễ phép ''Không đâu, thưa Tướng quân.'', đại từ ''tôi'', kính ngữ ''ạ'' và các
    thuật ngữ ''ngoại suy'', ''chiến tranh tổng lực''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, so sánh tuyệt đối & thành ngữ: giữ phủ định so sánh
    ''Chẳng có bằng chứng nào hùng hồn hơn thực tế.'', tên ''Tanya'' và mệnh đề ''sự
    thật vốn luôn kỳ lạ hơn cả tiểu thuyết''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ cấp bậc: giữ tên ''Tanya'', cụm ''cấp trên
    của mình'', đại từ ''ông'' và hành động ''vặn hỏi ngược lại ông''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Đại từ hội thoại, ẩn dụ & câu hỏi lễ phép: giữ đại từ ''Tôi'',
    hình ảnh ''chiến đấu đến tận tủy xương'', từ ''dân chúng'', ''cơn bùng phát''
    và đuôi câu hỏi ''không ạ?''."]'
