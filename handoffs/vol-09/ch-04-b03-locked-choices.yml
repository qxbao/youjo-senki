- segment_id: YS-LN09/Text/chapter014.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ, nhấn mạnh Markdown tên tàu (DEC-P01-002) và danh xưng
    tôn giáo: thủy thủ đoàn của tàu khu trục *Bermuda* thuộc Khối Thịnh vượng chung
