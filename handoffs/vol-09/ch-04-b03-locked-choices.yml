    đó'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ phân loại tàu chiến, hệ thống dò tìm và quan hệ nhượng
    bộ: Các tàu tuần dương hạng nhẹ và tàu khu trục của Khối Thịnh vượng chung / Họ
    / hệ thống sonar / ngăn chặn thêm các đợt tấn công bằng ngư lôi'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ vũ khí chống ngầm mới của hạm đội: đám tàu ngầm / họ
    / dàn cối chống ngầm Hedgehog / đạn con / hạm đội'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=[''Giữ đúng sắc thái biểu cảm theo điểm nhìn phía Khối Thịnh vượng
    chung: đám tàu ngầm Đế quốc lấc cấc kia'']'
