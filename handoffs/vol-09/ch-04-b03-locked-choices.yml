- segment_id: YS-LN09/Text/chapter014.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown câu cảm thán nội tâm khớp chính xác thẻ in
    nghiêng của nguồn (DEC-P01-002): *Cứ như thể chúng ta vừa cạy tung cánh cổng địa
    ngục ra vậy!*'', ''Phân biệt đại từ nội tâm số nhiều và trần thuật ngôi thứ ba:
    chúng ta / họ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu và biệt danh khớp nguồn (DEC-P01-002):
    Tàu *Hood*! Chiến hạm *Hood Hùng mạnh* đang—!'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=[''Giữ nhịp câu mô tả cảnh tượng hỗn loạn trên vùng biển giao chiến:
    Tiếng la thất thanh của đám thủy thủ / vùng giao chiến / cột khói cuồn cuộn bốc
    lên'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=[''Sắc thái biểu cảm trong trần thuật: Cảnh tượng kinh hoàng ấy
    thật chẳng nỡ nhìn.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trần thuật và nhấn mạnh Markdown tên tàu (DEC-P01-002):
    Họ / thân tàu đang nghiêng hẳn đi / tàu *Hood*'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown cả hai cụm in nghiêng theo nguồn (DEC-P01-002):
    Tàu *Hood*. Chiến hạm *Hood Hùng mạnh…*'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ, tên riêng và nhấn mạnh Markdown (DEC-P01-002): nó
    / cường quốc / Khối Thịnh vượng chung / Chiến hạm *Hood Hùng mạnh* / niềm tự hào
    của hải quân'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=[''Giữ đại từ quy chiếu con tàu nhất quán với câu trước: chỉ một
    đòn đánh trúng đích duy nhất đã nhấn chìm nó'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown câu hỏi nội tâm khớp nguồn (DEC-P01-002) và
    giữ phủ định: *Chỉ một đòn mà đã hóa thành đống mảnh vỡ trôi nổi trên biển sao?*
    / tất cả các thủy thủ đều muốn gào lên rằng đó không thể là sự thật'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tiếng gào khóc khớp nguồn (DEC-P01-002), chức
    danh và phủ định: *Lẽ ra chuyện không thể như thế này được!* / họ / vị thuyền
    trưởng / thủy thủ đoàn thậm chí còn chẳng kịp quằn quại trong đau đớn'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu (DEC-P01-002) và thuật ngữ hải chiến:
    những quân nhân tinh nhuệ này / tàu *Hood* / ngư lôi / phá vỡ đội hình / các động
    tác cơ động né tránh'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh Markdown ở vị trí thẻ neo trang (page-166):
    Những pha đổi hướng ấy được thực hiện với tốc độ và kỷ luật cao nhất'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ biên chế và mức độ đồng bộ: cả hải đội thậm chí còn
    phá vỡ đội hình một cách đồng bộ hoàn hảo'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ đối lập trong trần thuật: Thế nhưng nỗ lực bẻ lái đầy
    quyết tâm của các thủy thủ rốt cuộc lại trở nên vô ích.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=[''Giữ nét nói lắp hoảng loạn và nhấn mạnh Markdown tên tàu (DEC-P01-002):
    “T-tàu *Ark Royale*!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=[''Sắc thái trần thuật: Một tiếng hét thất thanh run rẩy báo hiệu
    số phận nghiệt ngã vừa giáng xuống con tàu.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi và mệnh lệnh khẩn cấp trong thoại: “Chuyện gì thế? Báo
    cáo đi!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=[''Giữ nét nói lắp và nhấn mạnh Markdown tên tàu (DEC-P01-002):
    “T-tàu *Ark Royale* trúng đòn rồi!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ tàu chiến và phủ định khẳng định: chiếc tàu sân bay
    / chiếc tàu khu trục ở xa tâm đội hình hạm đội nhất / không thể nào nhầm lẫn được
    chuyện gì đang xảy ra'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=[''Giữ nguyên câu hỏi phỏng đoán, nhấn mạnh Markdown tên tàu (DEC-P01-002)
    và phủ định: Có phải là do chấn động từ vụ nổ không? / boong tàu *Ark Royale*
    / Thậm chí còn chưa kịp trôi qua đủ thời gian để bất kỳ ai cảm thấy bàng hoàng'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=[''Lời chửi thề cảm thán: “Khốn kiếp!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ quân chủng và quan hệ tương phản: Các pháp sư hải quân
    đánh bộ và thủy thủ đoàn / nhưng biển lửa chỉ càng lúc càng lan rộng'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh cảnh giới và thuật ngữ hải quân: “Quan sát kỹ mặt nước!
    Tìm vệt rẽ nước của ngư lôi!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=[''Chức danh chỉ huy tàu chiến: thuyền trưởng chiếc tàu khu trục
    gầm lên với vẻ quyết tâm nghiệt ngã'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh quyết tử và phủ định: lao thẳng vào đường đạn để chặn
    chúng lại / Đừng để chúng đánh trúng thêm bất kỳ phát nào nữa'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và tình thái phủ định: Các tàu hộ tống không thể để
    thêm bất kỳ quả ngư lôi nào lọt qua được nữa.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=[''Cấu trúc câu mục đích tách đoạn và nhấn mạnh Markdown tên tàu
    (DEC-P01-002): Để cứu thủy thủ đoàn của tàu *Hood*.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=[''Cấu trúc câu mục đích tách đoạn và nhấn mạnh Markdown tên tàu
    (DEC-P01-002): Để cứu tàu *Ark Royale*.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ, đại từ và phủ định: tàu ngầm địch / họ thậm chí còn
