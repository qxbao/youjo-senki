- segment_id: YS-LN09/Text/chapter014.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=[''Đại từ, phân loại tàu và nhấn mạnh Markdown tên tàu (DEC-P01-002):
    họ / chiếc tàu tuần dương *Yliastral*'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=[''Giữ nhịp câu ngắn dồn dập mô tả vụ nổ ngư lôi: Nhưng rồi một
    âm thanh kinh hoàng vang lên. Cột nước đáng sợ lại dựng đứng lên.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh Markdown ở vị trí thẻ neo trang (page-167),
    chỉ in nghiêng đúng hai lần tên tàu (DEC-P01-002): “*Yliastral*! Tàu *Yliastral*!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=[''Phủ định tuyệt đối và nhấn mạnh Markdown tên tàu (DEC-P01-002):
