    canned goods)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000039
  kind: terminology_and_voice
  value: choices=["Khóa cụm danh ngữ nối tiếp 'Hoặc lương thực trưng thu tại chỗ.'
