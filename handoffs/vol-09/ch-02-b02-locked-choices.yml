segment_id_end: YS-LN09/Text/chapter006.xhtml/p000069
choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phủ định: giữ ''cơ trưởng của chiếc máy bay
    ném bom dẫn đường chỉ điểm đang đi đầu đội hình'', câu hỏi nghi vấn phủ định ''…Họ
    không hủy bỏ nhiệm vụ ư?!'' và phủ định nhấn mạnh ''còn lâu mới đủ!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ cụm danh từ ngắn ''Bầu trời đêm.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ cụm danh từ ngắn ''Một bầu trời tối đen như
    mực.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & đại từ khái quát: giữ tình thái phỏng đoán
    ''nhiều khả năng là do...'', phủ định ''rõ ràng nó chẳng hề được che khuất sau
    một bức tường mây dày đặc nào cả'' và đại từ khái quát ''bạn'' trong mệnh đề ẩn
    dụ về vực thẳm."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, thuật ngữ & tình thái: giữ ''Đám chuyên gia khí tượng'',
    tên đồ uống ''rượu aquavit'', tình thái suy đoán ''chắc chỉ phán bừa...'' và đại
    từ trần thuật ''Anh'' cho vị cơ trưởng."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nhịp câu: giữ ''Thứ anh bắt gặp là sắc đỏ'' và ''Một
    luồng sáng chói lòa, dữ dội đột ngột xuất hiện''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trong thoại: giữ ''Đèn pha phòng không!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại: giữ đại từ ''Chúng ta'' và sắc thái khẩn
    cấp ''lộ rõ mồn một rồi!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ báo động: giữ ''Tiêm kích đánh đêm, phía trên cao!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ thời gian: giữ ''kỹ sư cơ giới trên không'',
    ''vị cơ trưởng'', ''cần lái'' và cấu trúc ''định... nhưng đã mất ý thức trước
    khi kịp có cơ hội làm vậy''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & ẩn dụ: giữ ''viên đạn pháo tự động 20 mm
    do máy bay tiêm kích địch bắn xuống từ phía trên'', cấu trúc phủ định ''thậm chí
    chẳng cho vị cơ trưởng lấy một chút thời gian...'' và giọng trần thuật lạnh lùng
    về thần chết."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ đồng thời: giữ ''người đàn ông từng là vị
    cơ trưởng'', ''tổ bay của anh ta'', ''Chiếc máy bay dẫn đường chỉ điểm'', dấu
    gạch ngang dài và hình ảnh ''tù nhân của trọng lực''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng mỉa mai: giữ ''ngọn đèn pha phòng không của
    Đế quốc'' và sắc thái mỉa mai chua chát ''đã tử tế đến mức chiếu sáng trọn vẹn
    cả hiện trường''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mốc chuyển tiếp: giữ ''tổ bay của chiếc máy bay ném
    bom đi kế tiếp''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trong thoại: giữ cách gọi rút gọn ''Chiếc dẫn đường
    chỉ điểm rơi rồi! Ôi, chết tiệt!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Phủ định & ẩn dụ: giữ câu phủ định ngắn ''Không có đủ mây'' và
    ẩn dụ ''phơi mình trơ trọi trong hẻm tử thần''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: giữ ''những chiếc tiêm kích đánh đêm của
    địch'', phép so sánh ''như đàn cá háo hức đớp mồi'' và ''trạng thái tác chiến
    ban đêm sung mãn nhất''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc tăng tiến: giữ cấu trúc ''không chỉ kéo đến từ phía trên
    mà còn từ cả phía dưới'' cho ''Những vị khách phiền toái này''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ trong thoại: giữ ''Đạn cao xạ ngay bên dưới
    chúng ta! Mặt đất đang nhả đạn kìa!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''đèn pha phòng không'', ''cơn bão hỏa lực phòng
    không'' và ''bia ngắm tuyệt vời cho đám tiêm kích đang lao vút tới''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc điều kiện & đại từ khái quát: giữ đại từ khái quát ''bạn''
    và cấu trúc sóng đôi với p000053 (''Bị đèn rọi trúng một phút, tuổi thọ của bạn
    sẽ đứt đi một nửa.'')."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc điều kiện, đại từ & tên gọi: giữ đại từ khái quát ''bạn'',
    ''Thượng đế'' cho ''God'' và cấu trúc sóng đôi với p000052 (''Bị đèn rọi trúng
    hai phút, bạn phải tạ ơn Thượng đế nếu còn sống sót.'')."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ nội tâm & thuật ngữ: bọc chính xác
    chuỗi câu hỏi nội tâm bằng dấu sao ''*Bây giờ ư? Chưa tới sao? Chúng ta vẫn chưa
    đến điểm cắt bom nữa à?*'' theo DEC-P01-002; giữ đại từ tập thể ''Chúng ta'' và
    thuật ngữ ''điểm cắt bom''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nghịch đối: giữ ''tổ bay ném bom thuộc Khối
    Thịnh vượng chung'' và tương phản giữa việc biết trước nguy hiểm với ''sự tra
    tấn tột cùng''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh tác chiến: giữ ''Chuẩn bị cắt bom! Đồng bộ đi!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thẩm quyền: giữ ''chiếc máy bay dẫn đường chỉ điểm'',
    ''vị chỉ huy'' và ''tự mình quyết định ấn định mục tiêu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh tác chiến: giữ ''Ngay bây giờ!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & ẩn dụ: giữ ''các tổ bay ném bom'', ''phía
    Đế quốc'', phủ định tuyệt đối ''Chẳng còn lấy một lý do nhỏ nhoi nào...'', ''các
    trận địa phòng không'', ''không phận Đế quốc'' và ẩn dụ ''nơi hiểm nguy đang rình
    rập tìm con mồi để bám theo về tận nhà''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Nhịp câu bỏ lửng: giữ dấu ba chấm và mệnh đề chuyển cảnh ''Thế
    nhưng khi họ còn đang trên đường rút về…''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Đại từ & giọng thoại: giữ ''Chúng đang đuổi theo chúng ta! Chết
    tiệt! Chúng ta đang trúng đạn!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & địa danh: giữ ''lãnh thổ quân mình'' và ''Eo biển
    Chim Dodo''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & đơn vị: giữ nguyên định dạng in hoa ''NGÀY 1 THÁNG
    7 NĂM THỐNG NHẤT 1927, BỘ TƯ LỆNH KIỂM SOÁT KHÔNG LƯU MIỀN TÂY CỦA LỤC QUÂN ĐẾ
    QUỐC''; không thêm nhấn mạnh Markdown."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & cấu trúc sóng đôi: giữ dấu ngoặc kép cho câu ngạn ngữ
    về chiến tranh và sắc thái phủ định giảm nhẹ ''bên còn lại cũng chẳng sung sướng
    dễ dàng gì''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''Lục quân Đế quốc'', ''các đợt ném
    bom chiến lược của Khối Thịnh vượng chung'' và phủ định ''hoàn toàn chẳng phải
    là những chiến thắng ngọt ngào''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''các sĩ quan trực ban'' và sắc thái ''miễn cưỡng
    nhìn nhau để đối diện với thực tại''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ: giữ câu hỏi tu từ ''Sao ngày hôm nay lại có thể
    khác với những ngày trước đó được chứ?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Thoại & chức danh: giữ câu hỏi ngắn ''“Báo cáo thiệt hại đâu?”''
    và ''vị chỉ huy''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["So sánh ngang bằng: giữ cấu trúc so sánh ''đè nặng lên người lính
    vào báo cáo chẳng kém gì ánh mắt chờ đợi của vị chỉ huy''."]'
