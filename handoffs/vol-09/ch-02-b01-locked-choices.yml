choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ nguyên định dạng in hoa ''NGÀY 30
    THÁNG 6 NĂM THỐNG NHẤT 1927, ĐÀI KIỂM SOÁT KHÔNG LƯU ĐẾ QUỐC TẠI MIỀN TÂY''; không
    thêm nhấn mạnh Markdown."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & định nghĩa: giữ ''Đài Kiểm soát Đánh chặn'', ''Lục
    quân Đế quốc'', ''lực lượng đặc nhiệm'', ''các pháp sư trên không'', ''sĩ quan
    điều khiển đánh chặn'' và ''phòng không''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: giữ ''mặt trận Rhine'', ''các nhiệm
    vụ phản ứng nhanh'', ''đơn vị Cộng hòa'' và ''các nhiệm vụ trinh sát chiến đấu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái dự tính: giữ ''Đài Kiểm soát Rhine'', ''các
    nhiệm vụ đánh chặn'', ''hệ thống chỉ huy riêng biệt'' và tình thái ''hoặc ít nhất,
    mọi chuyện vốn được trù tính sẽ diễn ra như thế''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mốc thời gian: giữ ''Việc giải thể họ cứ bị trì hoãn
    hết lần này đến lần khác'' và tên riêng ''Trận Không chiến Miền Tây''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phân định thẩm quyền: giữ ''Đài Kiểm soát Rhine cũ'',
    ''quyền làm chủ bầu trời'', ''Cộng hòa cũ'' và ''các sĩ quan điều khiển đánh chặn
    lâm thời''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đối lập vai trò: giữ sự phân biệt giữa ''Đài
    Kiểm soát Không lưu'' và ''Đài Kiểm soát Đánh chặn'' bên trong ''Đài Kiểm soát
    Rhine'', cấu trúc khẳng định qua phủ định ''chẳng còn nghi ngờ gì'' và cụm ''máy
    bay trinh sát tầm xa bên địch''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái báo trước: giữ ''miền tây'', ''Đài Kiểm
    soát Không lưu'' và cấu trúc phủ định cảm thán ''Họ nào có ngờ mọi chuyện sẽ thay
    đổi ra sao''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc giới hạn: giữ ''Tương lai mà họ từng coi là điều hiển
    nhiên hóa ra chỉ là một giấc mộng''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''Đài Kiểm soát Rhine cũ'', ''Đài Kiểm soát Không
    lưu Miền Tây'' và ''phòng không và đánh chặn''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái nghịch lý: giữ ''nhóm đặc nhiệm nhỏ bé mà
    trên danh nghĩa vẫn là lâm thời kia'', ''hỗ trợ dẫn đường'' và ''Đài Kiểm soát
    Không lưu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc so sánh phủ định: giữ ''chuyển từ thế công
    sang thế thủ'', ''Đế quốc'', ''Lục quân Đế quốc'', ''các sĩ quan điều khiển đánh
    chặn'', ''phòng điều khiển'' và cấu trúc ''chẳng có gì thể hiện... một cách hùng
    hồn bằng...''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Tình thái & giọng văn châm biếm: giữ tình thái ''Có người hẳn
    sẽ bảo rằng...'' và phép đối lập giữa sự thiếu hụt năng lực sản xuất kinh niên
    của ''Đế quốc'' với những lời cằn nhằn dư thừa."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định: giữ khẩu ngữ nhà binh tự nhiên ''Là đám
    khách quen trên chuyến bay định kỳ của chúng đấy. Lũ này chẳng chịu chừa mà lại
    mò sang nữa rồi.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thông tin tác chiến: giữ ''tách thành ba tốp'' và
    địa danh ''khu công nghiệp vùng trũng''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhịp trần thuật: giữ ''Nhân sự trực ban'', ''vị chỉ
    huy đưa ra quyết định như thường lệ'' và câu kết ngắn ''Đã đến lúc bước vào cuộc
    chiến.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ câu trần thuật ngắn ''Một đêm giao tranh
    nữa vừa mới bắt đầu.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & mệnh lệnh trong thoại: giữ ''trận đánh chặn'', cách
    gọi ''thưa các quý cô và quý ông'', đại từ ''Tôi'' của vị chỉ huy và câu ''Mọi
    người đều biết rõ việc mình đang làm rồi đấy'' khớp nguyên văn với p000019."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ câu lặp lại bằng dấu sao ''*Mọi
    người đều biết rõ việc mình đang làm rồi đấy.*'' đúng theo thẻ em của nguồn (DEC-P01-002)."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''sĩ quan trực ban'', cấu trúc phủ định
    ''mà chẳng hề pha chút mỉa mai nào'' và ''Đế quốc''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ nguyên định dạng in hoa ''CÙNG NGÀY
    HÔM ĐÓ, TRÊN KHÔNG PHẬN TUYẾN ĐƯỜNG DẪN TỚI KHU CÔNG NGHIỆP VÙNG TRŨNG Ở MẶT TRẬN
    RHINE CŨ''; không thêm nhấn mạnh Markdown."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối xứng liên văn bản: giữ ''các tổ bay ném bom của
    Khối Thịnh vượng chung'' và cụm phủ định giảm nhẹ ''chẳng mấy nắm rõ việc mình
    đang làm'' tạo thế đối lập trực tiếp với p000018–p000019."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''phi công'', ''lực lượng dẫn đường chỉ điểm''
    cho ''pathfinders'' và ''các cuộc tập kích ném bom''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: giữ ''máy bay ném bom thuộc Khối
    Thịnh vượng chung'' và chỉ bọc ''*năm mươi đến sáu mươi giờ bay*'' bằng dấu sao
    theo đúng phạm vi nhấn mạnh của nguồn (DEC-P01-002)."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giả định điều kiện: giữ phủ định tuyệt đối ''Chẳng
    đời nào có ai lại hăng hái tình nguyện...'' và tương phản giữa máy bay lỗ chỗ
    vết đạn với tổ bay may mắn giữ được mạng sống."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thuật ngữ: giữ dấu ngoặc kép cho biệt danh ''“phi vụ
    ném bom lao vào địa ngục”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Tình thái may rủi & ẩn dụ: giữ cấu trúc lựa chọn ''trút bom xuống
    địa ngục hay tự gieo mình xuống đó'', hình ảnh ''trò tung đồng xu may rủi'' và
    ''mời gọi tử thần''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["So sánh & sắc thái biểu cảm: giữ cấu trúc so sánh hơn ''còn khắc
    nghiệt hơn bất kỳ ngày tồi tệ, đáng nguyền rủa nào trong số đó''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ câu dẫn ngắn ''Nguyên nhân dẫn đến tai họa
    của họ vô cùng đơn giản.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Câu đơn nhấn nhịp: giữ câu danh từ một từ ''Mây.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Tình thái phản thực tế & điểm nhìn: giữ tình thái ''đáng lẽ phải
    bao phủ lấy địa ngục lại không đủ dày'' và nhận thức của ''các cựu binh vốn đã
    quen với vận rủi''."]'
