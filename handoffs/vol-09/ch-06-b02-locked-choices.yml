choices:
- segment_id: YS-LN09/Text/chapter022.xhtml/p000031
  kind: terminology_and_voice
  value: locked=Tanya xưng 'tôi' trong lời thoại; bảo toàn dấu nhấn mạnh Markdown
    '*của chính tôi*' tương ứng với thẻ em trong nguồn và giữ nguyên quan hệ nhân
    quả.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000032
  kind: terminology_and_voice
  value: locked=Nội tâm Tanya tự quy chiếu 'mình' theo DEC-P01-001; giữ tình thái
    khả năng ('cũng có thể') và phủ định quyết liệt ('tuyệt đối không thể để mặc cho
    sự chuyên quyền ngang ngược này tiếp diễn').
- segment_id: YS-LN09/Text/chapter022.xhtml/p000033
  kind: terminology_and_voice
  value: locked=Lergen xưng 'Tôi', gọi Tanya là 'cô' và 'Trung tá'; giữ cụm 'Sự chuyên
    quyền ngang ngược này' liên kết trực tiếp với p000032.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000034
  kind: terminology_and_voice
  value: locked=Câu hỏi xác nhận của Tanya có kính ngữ 'chứ ạ?'; đại từ 'Cả hai người
    họ' quy chiếu Meybert và Tospan.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000035
  kind: terminology_and_voice
  value: locked=Lergen xưng 'tôi', thuật ngữ 'bên quân cảnh' (MPs).
- segment_id: YS-LN09/Text/chapter022.xhtml/p000036
  kind: terminology_and_voice
  value: locked=Tanya xưng 'Tôi' kèm kính ngữ 'ạ' khi cảm ơn cấp trên.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000037
  kind: terminology_and_voice
  value: locked=Trần thuật gọi Lergen là 'Anh'; thoại Lergen xưng 'tôi', giữ thuật
    ngữ 'Kampfgruppe Lergen'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000038
  kind: terminology_and_voice
  value: locked=Trần thuật ngôi thứ ba gọi 'Tanya'; câu hỏi gợi ý khen thưởng huân
    chương cho hai cấp dưới ('họ').
- segment_id: YS-LN09/Text/chapter022.xhtml/p000039
  kind: terminology_and_voice
  value: locked=Lergen gọi Tanya là 'Trung tá', dùng 'chúng ta'; thuật ngữ 'bộ chỉ
    huy tàu ngầm', 'tờ trình đề nghị khen thưởng'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000040
  kind: terminology_and_voice
  value: locked=Câu hỏi của Tanya giữ hình ảnh đối lập 'bên ngoài boong-ke' và kính
    ngữ 'sao ạ?'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000041
  kind: terminology_and_voice
  value: locked=Lergen gọi 'Trung tá'; bảo toàn đúng phạm vi nhấn mạnh Markdown '*Những
    người hiểu biết về thế giới bên ngoài*' theo DEC-P01-002.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000042
  kind: terminology_and_voice
  value: locked=Trần thuật gọi Lergen là 'anh', gọi 'Tanya' ở ngôi thứ ba; bảo toàn
    đúng phạm vi nhấn mạnh Markdown cho câu độc thoại nội tâm '*Thế nghĩa là tình
    hình ở chính quốc đã tệ đến mức ấy rồi sao?*' theo DEC-P01-002.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000043
  kind: terminology_and_voice
  value: locked=Phân biệt rõ 'chúng ta' / 'tôi' trong lời thoại và 'mình' trong câu
    dẫn nội tâm của Tanya; thuật ngữ 'Tư tưởng cục bộ phe phái', 'mặt trận phía đông',
    'Lục quân Đế quốc'; giữ cặp từ tự hiệu chỉnh '‘sụp đổ’ thay vì ‘mục ruỗng’'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000044
  kind: terminology_and_voice
  value: locked=Lergen hỏi Tanya bằng đại từ 'Cô' và danh xưng 'Trung tá'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000045
  kind: terminology_and_voice
  value: locked=Phân biệt rõ 'Mình' trong trần thuật nội tâm và 'Tôi - mình' / 'ngài'
    trong lời thoại của Tanya; danh xưng 'thưa Đại tá' và thuật ngữ 'sĩ quan cấp tá'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000046
  kind: terminology_and_voice
  value: locked=Lergen đáp ngắn gọn, gọi Tanya là 'Trung tá'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000047
  kind: terminology_and_voice
  value: locked=Điểm nhìn nội tâm của Tanya tự quy chiếu 'mình', gọi Lergen là 'anh';
    thuật ngữ 'Đế quốc'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000048
  kind: terminology_and_voice
  value: locked=Lergen chuyển sang công việc chính, gọi Tanya là 'Trung tá' và dùng
    'Chúng ta'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000049
  kind: terminology_and_voice
  value: locked=Tanya đáp lễ 'Vâng, thưa Đại tá.'
- segment_id: YS-LN09/Text/chapter022.xhtml/p000050
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'Tướng Rudersdorf', 'Tướng Romel', 'tấm huân chương'; Lergen
    xưng 'Tôi', gọi Tanya là 'cô'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000051
  kind: terminology_and_voice
  value: locked=Tanya xưng 'tôi', dùng kính ngữ 'sao ạ?'; thuật ngữ 'Quân đoàn Viễn
    chinh Lục địa Phía nam'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000052
  kind: terminology_and_voice
  value: locked=Trần thuật gọi 'Tanya' là 'cô'; lời thoại Lergen xưng 'Tôi - cô' và
    'chúng ta', giữ đối lập giữa 'về mặt hình thức bên ngoài' và 'người trong cuộc'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000053
  kind: terminology_and_voice
  value: locked=Tanya hỏi lại ngắn gọn với đại từ kính trọng 'ngài ... ạ?'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000054
  kind: terminology_and_voice
  value: locked=Lergen xưng 'Tôi - mình', thuật ngữ 'trưởng bộ phận huân chương'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000055
  kind: terminology_and_voice
  value: locked=Nội tâm cảm thán của Tanya; giữ thuật ngữ 'bộ máy quan liêu', 'Cục
    Tác chiến' và 'khối Hành chính'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000056
  kind: terminology_and_voice
  value: locked=Nội tâm Tanya tự quy chiếu 'mình', gọi Lergen là 'anh ta'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000057
  kind: terminology_and_voice
  value: locked=Nội tâm Tanya tự quy chiếu 'mình', gọi Lergen là 'anh ta'; giữ thán
    từ mở đầu và sắc thái ao ước.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000058
  kind: terminology_and_voice
  value: locked=Câu nhận xét khái quát của Lergen về giới hạn tác dụng của việc đeo
    nhiều huân chương.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000059
  kind: terminology_and_voice
  value: locked=Tanya đồng tình có kính ngữ 'ạ', giữ cấu trúc so sánh hơn giữa việc
    khoe huân chương với con cháu trong thời bình và đeo huân chương giữa thời chiến.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000060
  kind: terminology_and_voice
  value: locked=Tanya gọi 'Đại tá von Lergen' và dùng đại từ 'Ngài'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000061
  kind: terminology_and_voice
  value: locked=Trần thuật gọi Lergen là 'Anh'; thoại Lergen xưng 'tôi', gọi Tanya
    là 'cô'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000062
  kind: terminology_and_voice
  value: locked=Trần thuật ngôi thứ ba 'Tanya'; lời thoại Tanya xưng 'Tôi' và 'chúng
    ta'.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000063
  kind: terminology_and_voice
  value: 'locked=Câu đáp đồng tình ngắn gọn của Lergen: ''Quả đúng thế.'''
- segment_id: YS-LN09/Text/chapter022.xhtml/p000064
  kind: terminology_and_voice
  value: locked=Tanya dùng 'Chúng ta ... đi ạ', xưng 'Tôi'; khóa thuật ngữ 'tiền bản
    quyền' (royalties) liên kết với p000065.
- segment_id: YS-LN09/Text/chapter022.xhtml/p000065
  kind: terminology_and_voice
  value: locked=Trần thuật gọi Lergen là 'anh'; giữ so sánh 'ngơ ngác hệt như một
    con bồ câu vừa bị bắn bằng ống thổi đậu' và câu hỏi lặp lại thuật ngữ 'Tiền bản
    quyền ư?'.
