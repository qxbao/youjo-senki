- segment_id: YS-LN09/Text/chapter020.xhtml/p000464
  kind: terminology_and_voice
  value: choice=Đại từ trần thuật 'anh' cho Meybert, giữ nhịp nối tiếp suy nghĩ từ
    cuối batch trước.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000465
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Tôi đang hành động
    theo quyền tự quyết của mình*', giữ tên 'Degurechaff' và đại từ 'anh' cho Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000466
  kind: terminology_and_voice
  value: choice=Đại từ 'cô ấy' cho Degurechaff trong câu lẩm bẩm tự trào của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000467
  kind: terminology_and_voice
  value: choice=Thuộc cấp hỏi thăm tình hình có kính ngữ 'ạ' ('Mọi chuyện vẫn ổn chứ
    ạ?').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000468
  kind: terminology_and_voice
  value: choice=Meybert xưng 'Tôi' và gọi thuộc cấp là 'các cậu', giữ giọng nửa đùa
    nửa thật về việc thấu hiểu tâm trạng cấp trên khi thăng tiến.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000469
  kind: terminology_and_voice
  value: choice=Giữ tên 'Meybert' và diễn đạt sát cảm giác bức bối khi đích thân rơi
    vào vị thế phải tỏ ra kiên quyết trước ý kiến người khác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000470
  kind: terminology_and_voice
  value: choice=Thuộc cấp gọi 'Thưa Đại úy', xưng 'chúng tôi' và dùng kính ngữ 'ạ'
    khi xin phép khai hỏa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000471
  kind: terminology_and_voice
  value: choice=Meybert gọi thuộc cấp là 'Cậu', dùng 'chúng ta' và bảo toàn chính
    xác nhấn mạnh Markdown duy nhất ở thán từ '*Ồ*'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000472
  kind: terminology_and_voice
  value: choice=Giữ câu nhận định ngắn gọn về quy chuẩn ban mệnh lệnh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000473
  kind: terminology_and_voice
  value: choice=Meybert xưng 'tôi' khi tuyên bố nhận toàn bộ trách nhiệm trước thuộc
    cấp.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000474
  kind: terminology_and_voice
  value: choice=Đại từ trần thuật 'anh' và tự quy chiếu 'mình' cho Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000475
  kind: terminology_and_voice
  value: choice=Giữ đúng cấu trúc điều kiện giả định và sắc thái khẩu ngữ mạnh ('đời
    anh coi như xong' cho 'he’d be shit out of luck').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000476
  kind: terminology_and_voice
  value: choice=Giữ nguyên quan hệ nhân quả về trách nhiệm của sĩ quan có quân hàm
    cao nhất tại trận địa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000477
  kind: terminology_and_voice
  value: choice=Dịch 'batteries' là 'các khẩu đội pháo' và bảo toàn phủ định tuyệt
    đối 'nhưng tuyệt đối không được bắn trúng chúng'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000478
  kind: terminology_and_voice
  value: choice=Dịch 'Warning shots, sir?' là 'Bắn cảnh cáo sao, thưa Đại úy?'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000479
  kind: terminology_and_voice
  value: choice=Meybert xưng 'Tôi' / 'ta', dịch 'warning volley' là 'loạt đạn cảnh
    cáo' và giữ rõ mục đích vừa răn đe vừa quan sát phản ứng của tàu lạ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000480
  kind: terminology_and_voice
  value: choice=Dịch 'eastern front' là 'mặt trận phía đông', đại từ trần thuật 'anh'
    cho Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000481
  kind: terminology_and_voice
  value: 'choice=Khẩu lệnh dứt khoát: ''Các khẩu đội pháo, khai hỏa!''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000482
  kind: terminology_and_voice
  value: choice=Giữ hình ảnh ẩn dụ 'cỗ máy chiến tranh vận hành chính xác' ('precision
    war machine').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000483
  kind: terminology_and_voice
  value: 'choice=Thuộc cấp đáp lệnh: ''Rõ, thưa Đại úy! Bắt đầu bắn!''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000484
  kind: terminology_and_voice
  value: choice=Giữ chuẩn định danh 'Kampfgruppe Lergen—tức Kampfgruppe Salamander'
    và hình ảnh đốt sạch sự do dự làm nhiên liệu.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000485
  kind: terminology_and_voice
  value: choice=Giữ đúng mệnh đề điều kiện và tính tất yếu khi chấp hành mệnh lệnh
    của lính tinh nhuệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000486
  kind: terminology_and_voice
  value: choice=Dịch 'gunners' là 'những pháo thủ', 'baptized in a trial of iron on
    the eastern front' là 'đã trải qua lễ rửa tội bằng thử thách sắt thép ở mặt trận
    phía đông'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000487
  kind: terminology_and_voice
  value: 'choice=Giữ câu trần thuật ngắn, dứt khoát: ''Họ được lệnh bắn.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000488
  kind: terminology_and_voice
  value: 'choice=Giữ nhịp câu song hành ngắn gọn: ''Thế là họ bắn.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000489
  kind: terminology_and_voice
  value: choice=Giữ cụm trạng ngữ độc lập nhấn mạnh tốc độ và độ chính xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000490
  kind: terminology_and_voice
  value: choice=Dịch 'artillerists' là 'những người lính pháo binh' và 'epitome of
    gunnery' là 'đỉnh cao của xạ thuật'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000491
  kind: terminology_and_voice
  value: choice=Giữ nguyên ý nghĩa đòi hỏi đồng thời cả tốc độ lẫn độ chính xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000492
  kind: terminology_and_voice
  value: choice=Giữ cấu trúc đối xứng giữa sự đòi hỏi hiển nhiên của Meybert và sự
    tiếp nhận đương nhiên của cấp dưới.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000493
  kind: terminology_and_voice
  value: choice=Miêu tả tiếng đại bác pháo binh vang vọng khắp bến cảng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000494
  kind: terminology_and_voice
  value: 'choice=Giữ câu danh ngữ ngắn: ''Một tiếng gầm của sắt thép.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000495
  kind: terminology_and_voice
  value: choice=Dịch 'gunners' là 'các pháo thủ', giữ nhịp câu nhấn mạnh sau dấu gạch
    ngang dài.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000496
  kind: terminology_and_voice
  value: choice=Đại từ 'họ' chỉ các pháo thủ dưới quyền Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000497
  kind: terminology_and_voice
  value: choice=Dịch 'coastal guns' là 'các khẩu pháo bờ biển' và 'near miss' là 'phát
    bắn sượt sát sạt'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000498
  kind: terminology_and_voice
  value: choice=Giữ nguyên thế đối lập cân bằng 'Quá gần để nói là bắn trượt nhưng
    lại quá xa để bảo là đã bắn trúng'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000499
  kind: terminology_and_voice
  value: choice=Giữ đánh giá khen ngợi phát bắn đầu tiên gần như hoàn hảo.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000500
  kind: terminology_and_voice
  value: choice=Giữ đúng cấu trúc giả định trái thực tế ở quá khứ về việc chưa quen
    đặc tính riêng của các khẩu pháo bờ biển.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000501
  kind: terminology_and_voice
  value: choice=Dịch 'Calibration shot' là 'Phát bắn hiệu chỉnh', 'fire for effe—'
    là 'bắn tiêu diệ—' (ngắt giữa chừng) và 'coastal artillery' là 'pháo bờ biển'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000502
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Họ đã làm rất tốt.*'
    ở câu đầu, tách biệt với câu trần thuật tiếp theo.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000503
  kind: terminology_and_voice
  value: choice=Bảo toàn nhấn mạnh Markdown cho toàn bộ đoạn độc thoại nội tâm; dùng
    'chúng ta' và dịch 'signal flags' là 'cờ tín hiệu'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000504
  kind: terminology_and_voice
  value: 'choice=Giữ câu trần thuật ngắn tạo nhịp cắt đột ngột: ''Chuông điện thoại
    đột ngột reo vang.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000505
  kind: terminology_and_voice
  value: choice=Đại từ trần thuật 'Anh' cho Meybert, giữ đúng nhận định về thời gian
    phản ứng quá sớm so với loạt pháo vừa bắn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000506
  kind: terminology_and_voice
  value: 'choice=Meybert xưng danh qua điện thoại: ''Vâng, tôi là Đại úy Meybert bên
    pháo binh đây.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000507
  kind: terminology_and_voice
  value: choice=Trung tá Paul gọi 'Đại úy Meybert', xưng 'tôi - anh' và giữ giọng
    gào thét giận dữ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000508
  kind: terminology_and_voice
  value: choice=Dịch 'Lieutenant Colonel Paul' là 'Trung tá Paul', dùng đại từ trần
    thuật 'ông ta' từ điểm nhìn của Meybert.
