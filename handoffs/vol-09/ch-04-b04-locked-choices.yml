choices:
- segment_id: YS-LN09/Text/chapter014.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ hải chiến và đại từ quy chiếu: các hoạt động chống
    tiếp cận khu vực bằng bom chìm / các tàu khu trục / họ đang nắm ưu thế chiến thuật'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=[''Phủ định mệnh lệnh và nhấn mạnh Markdown tên riêng hai tàu khu
    trục theo nguồn (DEC-P01-002): Đừng để mất dấu chúng! Bảo cả tàu *Lewis* và tàu
    *Victor* nện cho chúng một trận nữa!'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ cấu trúc tàu và cấp bậc hải quân: thủy thủ đoàn các
    tàu / các lối đi trên boong / những hành lang chật hẹp / các hạ sĩ quan'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trần thuật ngôi thứ ba và thuật ngữ: Họ / Những người
    lính này tận tụy với Tổ quốc của mình'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=[''Giữ nguyên nhịp câu cảm thán ngắn tách đoạn: Đáng buồn thay…'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhân quả nghịch lý và thuật ngữ: Chính vì những nỗ lực
    ấy là biện pháp cơ động chống ngầm tối ưu nhất nên chúng lại phản tác dụng.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ phân loại tàu và bối cảnh chuẩn bị khai hỏa: Lực lượng
    săn ngầm chuyên trách / các tàu khu trục và tàu tuần dương hạng nhẹ / bày sẵn
    đạn dược trên mặt boong'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh Markdown ở vị trí thẻ neo trang (page-168)
    và giữ sắc thái ẩn dụ: lũ ác quỷ dưới làn nước'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=[''Giữ cấu trúc danh ngữ đặc tả mối hiểm họa: Tai họa bám chặt trên
    lưng những quả ngư lôi.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=[''Định danh quốc gia và hình ảnh xuất kích từ dưới biển: Kẻ thù
    đáng sợ nhất của Khối Thịnh vượng chung trồi lên từ mặt biển.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=[''Giữ nét nói lắp hoảng loạn và thuật ngữ hàng hải: “P-pháp sư
    địch, bên mạn trái! Chúng đang lao tới rất nhanh!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi giả định và thuật ngữ vũ khí – ma pháp: người lính cảnh
    giới / đạn cối chống ngầm Hedgehog / thuật thức phát nổ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=[''Giữ dấu gạch ngang câu mệnh lệnh bị cắt ngang đột ngột: “Chết
    tiệt! Tất cả mọi người, bám chặt chuẩn bị chịu—!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=[''Phủ định, thuật ngữ và chức danh chỉ huy tàu: Lời cảnh báo không
    kịp nữa rồi / triển khai thuật thức / vị thuyền trưởng đang chỉ huy / ông'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu theo nguồn (DEC-P01-002): “Tàu *Bermuda*
    nổ tung rồi sao?!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ cấu trúc tàu, nhấn mạnh Markdown tên tàu (DEC-P01-002)
    và quan hệ nguyên nhân: Sống đáy của con tàu / các tàu đồng hành / tàu *Bermuda*
    / bom chìm cùng ngư lôi / các tàu khu trục'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=[''Giữ câu hỏi ngắn thể hiện sự bàng hoàng: Nhưng bằng cách nào?'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và tình thái trái thực tế: những vụ nổ thứ cấp / Thứ
    vũ khí đáng lẽ phải đem lại lợi thế cho họ thì nay lại quay sang hại chính họ.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=[''Giữ sự lặp lại nguyên văn câu hỏi ngắn với p000136: Nhưng bằng
    cách nào?'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=[''Phủ định nhấn mạnh và thuật ngữ: hoàn toàn không tài nào hiểu
    nổi chuyện đó / người lính cảnh giới'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=[''Tiếng hét cảnh báo trong thoại: “Pháp sư ư?! Pháp sư Đế quốc!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown toàn bộ câu cảm thán nội tâm khớp thẻ in nghiêng
    của nguồn (DEC-P01-002): *À, lũ chó đẻ đó.*'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=[''Sắc thái khẳng định trong trần thuật: Đến nước này thì ai nấy
    đều đã hiểu rõ chuyện gì vừa diễn ra.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ biên chế và nguyên nhân gây rối loạn: Các vị chỉ huy
    của phần hạm đội còn sót lại / đợt tấn công bằng ngư lôi / một đơn vị pháp sư
    hải quân đánh bộ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=[''Tình thái suy đoán chắc chắn: Ắt hẳn phải là như vậy.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và định danh phe phái: Họ / quân Đế quốc / ở ngoài phương
    bắc'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=[''Định danh các phe và thuật ngữ quân sự: Lực lượng Khối Thịnh
    vượng chung / quân Đế quốc / các pháp sư hải quân đánh bộ / tàu ngầm / Liên minh
    Hiệp ước cũ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh Markdown ở vị trí thẻ neo trang (page-169)
    và giữ phủ định tuyệt đối: chẳng có hạm đội tàu mặt nước nào có thể đánh bại được
    mình'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=[''Phủ định kép tạo nghĩa khẳng định và thuật ngữ: Các sĩ quan của
    hạm đội hoàn toàn không hề bất tài / các máy bay tiêm kích cùng lực lượng pháp
    sư hải quân đánh bộ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=[''Hiệu lệnh chiến đấu hải quân: “Tất cả vào vị trí chiến đấu! Bắn
    tự do!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và nhấn mạnh Markdown tên tàu theo nguồn (DEC-P01-002):
    Tàu khu trục *Lewis* lập tức nã đạn bằng mọi thứ vũ khí đang ở trạng thái sẵn
    sàng.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh khẩn cấp trên boong và tên vũ khí: “Vứt bỏ hết mọi
    thứ dễ cháy nổ xuống biển! Phóng toàn bộ số đạn cối chống ngầm Hedgehog đi!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu theo nguồn (DEC-P01-002) và thuật
    ngữ: Tàu khu trục *Victor* / dàn cối chống ngầm Hedgehog / đám tàu ngầm địch /
    mất khả năng chiến đấu vì những vụ nổ thứ cấp'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown cả hai tên tàu theo nguồn (DEC-P01-002): “Tàu
    *Lewis* và tàu *Victor* tiêu đời rồi!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trần thuật và sắc thái trang trọng: Họ đã thực hiện nhiệm
    vụ của mình cho đến tận giây phút bi thảm cuối cùng.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhượng bộ, thuật ngữ và hình ảnh so sánh: quân Đế quốc
    / cặp tàu khu trục / một bản án treo'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=[''Hiệu lệnh cơ động tàu chiến: “Đổi hướng! Tiến hết tốc lực!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ hải chiến và hình ảnh ẩn dụ: tư thế cơ động né tránh
    / một cơn bão tai ương đang ập sát về phía họ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi tự vấn và tự đáp ngắn gọn: Bất công ư? Đúng vậy đấy.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ biên chế, tình thái giả định đối lập và câu hỏi tu
    từ: Lực lượng tiên phong / các chiến hạm và chiếc tàu sân bay / Sẽ là một nhẽ
    nếu họ bị một hạm đội hùng mạnh của địch tấn công / vài quả ngư lôi và một nhúm
    pháp sư chết tiệt'']'
