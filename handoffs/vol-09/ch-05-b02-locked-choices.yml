- segment_id: YS-LN09/Text/chapter018.xhtml/p000035
  kind: terminology_and_voice
  value: choices=["Khóa nhấn mạnh Markdown '*thanh bình*' tương ứng với thẻ em trong
    nguồn.", "Khóa đối chiếu giữa 'Ildoa' và 'Đế quốc' (the Empire)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000036
  kind: terminology_and_voice
  value: choices=["Khóa câu hỏi phỏng đoán mở đầu 'Có lẽ là vì thế chăng?' và đại
    từ nội tâm 'Mình' / 'mình'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000037
  kind: terminology_and_voice
  value: choices=["Khóa cấu trúc phủ định toàn phần và thuật ngữ 'boong-ke U-boat
