    ngạc' (rude stares filled with surprise)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000045
  kind: terminology_and_voice
  value: choices=["Khóa hai câu hỏi nội tâm liên tiếp và đại từ 'Mình'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000046
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình', cụm 'nhân viên đại sứ quán' (embassy
