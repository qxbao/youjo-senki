- segment_id: YS-LN09/Text/chapter018.xhtml/p000038
  kind: terminology_and_voice
  value: choices=["Khóa sự phân biệt từ vựng giữa 'U-boat' ở câu đầu và 'tàu ngầm'
    (submarine) ở câu sau, cùng các thuật ngữ 'boong-ke' (bunker), 'cầu tàu' (pier).",
    "Khóa đại từ nội tâm 'chúng ta' (ngôi thứ nhất số nhiều) và 'mình' (ngôi thứ nhất
    số ít)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000039
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình' và chi tiết cảm xúc bực bội vô cớ khi
    nhìn bầu trời xanh thẫm của Ildoa."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000040
  kind: terminology_and_voice
  value: choices=["Khóa cụm 'máy bay tiêm kích do Khối Thịnh vượng chung chế tạo'
    (Commonwealth-made fighter plane) và sắc thái phỏng đoán 'Chắc hẳn là vì...'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000041
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình' và chi tiết 'những bộ quân phục hồ phẳng
    phiu' (crisply starched uniforms); dùng danh ngữ trung tính 'những người mà mình
    đoán là phái đoàn đón tiếp bên quân đội'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000042
  kind: terminology_and_voice
  value: choices=["Khóa cụm 'phía Đế quốc' (the imperial side) và 'học viện' (the
    academy)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000043
  kind: terminology_and_voice
  value: choices=["Khóa định danh 'Elm', cụm 'các sĩ quan cấp cao đến thăm xã giao'
