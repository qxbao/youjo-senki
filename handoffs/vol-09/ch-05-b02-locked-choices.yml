- segment_id: YS-LN09/Text/chapter018.xhtml/p000051
  kind: terminology_and_voice
  value: choices=["Khóa điểm nhìn trần thuật ngôi thứ ba ('Tanya') và sắc thái cảm
    nhận sự bất thường/sai khác khó tả ('một cảm giác bất thường khó tả' / 'một cảm
