    kẻ ngoại đạo như Tanya'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000065
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình', các định danh 'Người Ildoa' (The Ildoans),
