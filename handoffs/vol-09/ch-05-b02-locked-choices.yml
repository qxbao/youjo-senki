    tình thái 'có lẽ' (perhaps) và 'chắc chắn' (definitely)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000047
  kind: terminology_and_voice
  value: choices=["Khóa điểm nhìn trần thuật ngôi thứ ba với các định danh 'Tanya',
    'Tiểu đoàn Pháp sư Trên không số 203' (203rd Aerial Mage Battalion), 'Elm' và
    'các lính tàu ngầm' (submariners)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000048
  kind: terminology_and_voice
  value: choices=["Khóa giọng giễu nhại quảng cáo du lịch với đại từ ngôi thứ hai
    phiếm chỉ 'bạn' (your), đại từ ngôi thứ nhất số nhiều 'chúng ta' (our) và tên
    cơ quan 'Bộ Tổng tham mưu' (General Staff)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Khóa nguyên văn dòng tiêu đề cảnh viết hoa: ''CÙNG NGÀY HÔM ĐÓ,
