- segment_id: YS-LN09/Text/chapter018.xhtml/p000054
  kind: terminology_and_voice
  value: choices=["Khóa câu hỏi nội tâm ngắn giữ nguyên độ mở về 'cảm giác kỳ lạ'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000055
  kind: terminology_and_voice
  value: choices=["Khóa cặp thuật ngữ 'tiền tuyến' (front lines) và 'hậu phương' (the
