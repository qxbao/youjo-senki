segment_id_end: YS-LN09/Text/chapter006.xhtml/p000278
choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000240
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Họ' chỉ các sĩ quan tham mưu, cụm 'sự đánh đổi giữa
    thời gian và không gian', 'tiền tuyến', phủ định 'không được rút lui khỏi một
    vị trí trọng yếu' và 'sự liêm chính về mặt trí tuệ'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000241
  kind: terminology_and_voice
  value: locked=["Giữ phủ định nhấn mạnh ở hai câu đầu, đại từ 'chúng ta', thuật ngữ
    'lực lượng dự bị chiến lược' và 'trận đánh tiêu hao'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000242
  kind: terminology_and_voice
  value: locked=["Giữ tên 'Zettour', phủ định 'Chẳng một ai vui vẻ gì' và ý chấp nhận
    không còn lựa chọn nào khác."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000243
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Chúng ta', địa danh 'mấu lồi Hofen' và tình thái 'Có
    lẽ' trong đề xuất lên kế hoạch hỗ trợ rút lui."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000244
  kind: terminology_and_voice
  value: locked=["Giữ địa danh 'Soldim 528' và thuật ngữ 'đòn bao vây cục bộ'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000245
  kind: terminology_and_voice
  value: locked=["Giữ nhận định trần thuật 'chẳng qua chỉ là một mong ước tham lam'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000246
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'anh' (chỉ sĩ quan vừa lên tiếng), 'chúng ta', cùng các
    thuật ngữ 'Kampfgruppe tinh nhuệ', 'sư đoàn thiết giáp sung sức' và 'Chiến dịch
    Andromeda'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000247
  kind: terminology_and_voice
  value: locked=["Giữ các thuật ngữ 'Mức độ tập trung binh lực', 'môi trường chiến
    lược', 'đòn tấn công trực diện', 'đơn trưng thu', cùng đại từ tự xưng 'tôi' và
    cách gọi 'các anh' của Zettour."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000248
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'ông' chỉ Zettour và 'bọn họ' chỉ nhóm sĩ quan tham mưu."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000249
  kind: terminology_and_voice
  value: locked=["Giữ cấu trúc giả định và thuật ngữ 'Những sĩ quan tham mưu'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000250
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'họ' và ý nhìn thấy vẻ mặt đau khổ của nhau."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000251
  kind: terminology_and_voice
  value: locked=["Giữ câu thoại ngắn 'Tốt.'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000252
  kind: terminology_and_voice
  value: locked=["Giữ lời gọi 'Thưa Tướng quân?'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000253
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'chúng ta', 'tôi', tên 'Zettour' và mục tiêu 'khiêu khích
    Quân đội Liên bang'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000254
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'ngài' (gọi Zettour), 'chúng' (chỉ quân địch), 'chúng
    ta', thuật ngữ 'mấu lồi' và phủ định 'đâu có đủ binh lực để tiến hành bao vây'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000255
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Tôi', 'chúng ta', thuật ngữ 'tác chiến cơ động' và chuỗi
    ba bước 'nhử mồi, bao vây rồi tiêu diệt hoàn toàn'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000256
  kind: terminology_and_voice
  value: locked=['Giữ phép so sánh với trò ảo thuật nhanh tay lẹ mắt.']
- segment_id: YS-LN09/Text/chapter006.xhtml/p000257
  kind: terminology_and_voice
  value: locked=["Giữ tình thái 'có thể' và sự đối lập giữa dư địa sáng tạo trong
    chiến thuật với hiểm họa khi rơi vào lối mòn."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000258
  kind: terminology_and_voice
  value: locked=['Giữ quan hệ điều kiện - hệ quả phủ định về việc không thể bám mãi
    vào một chiêu trò đã lộ tẩy.']
- segment_id: YS-LN09/Text/chapter006.xhtml/p000259
  kind: terminology_and_voice
  value: locked=["Giữ tên 'Zettour', đại từ 'chúng' (kẻ địch), 'ta' / 'chúng ta' và
    câu rủ gợi mở sự sáng tạo (lưu ý khuyến nghị minor về cách gọi 'Thưa các quý ông')."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000260
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'họ' và sự đối lập giữa căng thẳng vì mất phương thức
    trực diện với tính khả thi thực tế ngoài chiến trường."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000261
  kind: terminology_and_voice
  value: locked=["Giữ tên đơn vị 'Cụm tập đoàn quân phía Đông' và thuật ngữ 'cụm tập
    đoàn quân'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000262
  kind: terminology_and_voice
  value: locked=["Giữ cấu trúc phủ định kép 'Không phải là họ không thể...' cùng các
    thuật ngữ 'chiến lược', 'Hội đồng Tự trị', 'các tuyến tiếp tế' và 'công tác hậu
    cần'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000263
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'họ' và ý bị giới hạn bởi những gì có thể làm ngoài thực
    địa."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000264
  kind: terminology_and_voice
  value: locked=["Giữ câu hỏi nội tâm tự do với hai chủ thể 'Đế quốc' và 'Bộ Tư lệnh
    Tối cao'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000265
  kind: terminology_and_voice
  value: locked=["Giữ phép ẩn dụ cơ thể ('cái đầu', 'tay và chân', 'một ngón tay')
    gắn với 'Quân đội' và 'Cụm tập đoàn quân phía Đông'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000266
  kind: terminology_and_voice
  value: locked=["Giữ các cụm 'đội quân tình nguyện đa quốc gia', 'nghĩa địa đa sắc
    tộc', 'đám Cộng sản', 'tuyên truyền', đại từ 'Ông' và chi tiết tiếc thuốc lá nên
    chỉ cười thay vì hút."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000267
  kind: terminology_and_voice
  value: locked=["Giữ lời thưa 'Thưa Tướng quân', tên 'Chiến dịch Andromeda', thuật
    ngữ 'tiền tuyến' và phủ định 'hoàn toàn chẳng ở gần'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000268
  kind: terminology_and_voice
  value: locked=["Giữ cụm 'logic của người Cộng sản', đại từ 'chúng' (chỉ phía Cộng
    sản), 'chúng ta' và tình thái thận trọng 'không thể biết chắc chắn được, nhưng
    đó là một điều cần phải tính đến'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000269
  kind: terminology_and_voice
  value: locked=["Giữ nguyên dòng tiêu đề chuyển cảnh viết hoa 'CÙNG LÚC ĐÓ, DOANH
    TRẠI ĐỒN TRÚ CỦA ĐỘI QUÂN TÌNH NGUYỆN ĐA QUỐC GIA'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000270
  kind: terminology_and_voice
  value: locked=["Giữ phép ẩn dụ chiến thắng bọc đường cho mọi mâu thuẫn (lưu ý khuyến
    nghị minor về cụm 'phương thuốc bách bệnh')."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000271
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'đơn vị đa quốc gia', 'Lục quân Đế quốc' và cấu trúc
    phủ định kép 'không phải là ngoại lệ'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000272
  kind: terminology_and_voice
  value: locked=["Giữ các danh xưng 'Chiến dịch Andromeda', 'Liên bang', 'Đế quốc'
    và 'các đồng minh của họ'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000273
  kind: terminology_and_voice
  value: locked=["Giữ thế nhượng bộ giữa thất bại trong 'trận đánh cơ động' và 'chiến
    thắng mang tầm chiến lược' không thể phủ nhận."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000274
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'đơn vị đa quốc gia' và 'công tác tuyên truyền'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000275
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Họ' và cấu trúc phủ định so sánh 'chẳng thể nào mong
    cầu một chiến thắng thuận tiện hơn thế về mặt chính trị'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000276
  kind: terminology_and_voice
  value: locked=["Giữ đầy đủ chức danh và đơn vị 'chỉ huy Đơn vị Viễn chinh Pháp sư
    Hải quân đánh bộ của Khối Thịnh vượng chung, Trung tá Drake'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000277
  kind: terminology_and_voice
  value: locked=["Giữ tình thái phỏng đoán 'Chắc là' và đại từ 'chúng ta' trong lời
    thoại của Drake."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000278
  kind: terminology_and_voice
  value: locked=["Giữ phủ định 'Không hề có bóng dáng quân địch' và hai chủ thể đối
    lập 'Lục quân Đế quốc' rút lui — 'Quân đội Liên bang' tiến lên."]
