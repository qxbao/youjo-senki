choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Schugel gọi Tanya là ''Trung tá
    Degurechaff'' và ''Cô'', tự xưng ''Tôi''/''mình'', gộp hai người bằng ''Chúng
    ta''.", "Thuật ngữ tôn giáo: giữ ''những người đồng đạo cầu xin vinh quang của
    Chúa''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định: giữ phủ định nhấn mạnh ''chẳng đem
    lại nổi lấy một mảy may nhẹ nhõm''; Tanya tự quy chiếu bằng ''mình'', gọi Schugel
    là ''ông ta'' (trần thuật nội tâm) và ''ông'' (câu mắng thầm trực tiếp)."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: Tanya tự xưng ''Tôi''; giữ ''một
    sĩ quan của Lục quân Đế quốc''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000404
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ & đối lập: giữ ''Kỹ sư Schugel ngày trước'',
    tình thái giả định ''người hẳn sẽ hiểu...'', thế đối lập ''là một quân nhân chứ
    không phải một con chiên'' và mệnh đề vị ngữ ''giờ không còn ở đây với chúng ta
    nữa rồi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Danh xưng & phủ định: giữ ''Vị tiến sĩ'', cụm ''bị tẩy não đến
    mức sùng đạo vô song'' và phủ định ''sẽ chẳng lọt tai lời bất kỳ ai nói''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Chuyển pha điểm nhìn & phủ định: câu đầu trần thuật ngôi thứ ba
    (''Tanya lắc đầu''), câu sau độc thoại nội tâm tự xưng ''Mình'' theo DEC-P01-001
    (''Mình không nghĩ ngay từ đầu ông ta đã chịu nghe lời ai'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000407
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & chỉ dẫn trong thoại: giữ tên khí tài ''V-1'', chuỗi
    hành động ''đâm thứ này vào quân địch. Rồi thoát thân'' và hình ảnh ''lượng thuốc
    nổ dồi dào trên khoang thổi tung bất cứ rắc rối nào đang ngáng đường mình''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: giữ đại từ số nhiều ''bọn mình''
    (Tanya và các pháp sư dưới quyền), đại từ ''ông ta'' chỉ Schugel và thuật ngữ
    ''ngư lôi sống''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Tên gọi, thuật ngữ & tình thái giảm nhẹ: giữ nguyên ''người Ý''
    theo sát văn bản gốc (liên tưởng lịch sử của Tanya, không đổi thành Ildoa), thuật
    ngữ ''hệ thống thoát hiểm'' và tình thái ''ừm, gọi là có được chút điểm cộng cỏn
    con''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi cảm thán nội tâm: giữ ''Nhưng cái quái gì thế này?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định trong thoại: giữ đại từ ''chúng tôi'' (đơn vị
    pháp sư của Tanya) và tình thái ''Xem chừng sắp chẳng còn việc gì cho chúng tôi
    làm nữa rồi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi đuôi trong thoại: giữ ''hỏa lực tập trung
    dưới hình thức các pháp sư'', ''phương án tối ưu để giải quyết vấn đề của cô''
    và câu hỏi đuôi ''Phải không?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & câu hỏi trong thoại: giữ ''Tanya vẫn cất
    lời bày tỏ một tia hy vọng nhỏ nhoi'' và đại từ ''chúng tôi'' trong câu hỏi về
    sự bảo đảm không bị thổi bay theo."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000414
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái trong thoại: giữ ''tâm ý của Chúa'' và khẳng
    định trấn an ''tôi chắc chắn cô có thể kê cao gối mà ngủ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000415
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & tên gọi: giữ tự quy chiếu ''mình''
    theo DEC-P01-001, định danh ''hiện thân của ác ý mang tên Being X'', bọc chính
    xác ''*Chuyện này chẳng vui chút nào!*'' bằng dấu sao theo DEC-P01-002 và giữ
    câu kết ''Chẳng công bằng chút nào hết.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000416
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & không thêm nhấn mạnh: giữ ''Trung tá Degurechaff'',
    ''Chúa'', ''một người đồng đạo'', đại từ ''Tôi'' – ''cô''; không thêm nhấn mạnh
    Markdown tại vị trí thẻ neo trang page-137."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000417
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn trong thoại: giữ ''“Sao cơ?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000418
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ, thuật ngữ & quân hàm: giữ ''một dự án chung
    được hiện thực hóa nhờ đức tin của những người đồng đạo'', giả định phủ định ''chẳng
    thể nào tạo ra được một thứ thế này nếu thiếu đi hồng ân của Chúa'' và câu khích
    lệ ''Hãy tự hào lên, Trung tá.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000419
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & câu hỏi nội tâm xen kẽ: giữ ''Vị tiến sĩ'',
    câu hỏi nội tâm ''Bộ ông ta đang trào dâng xúc động đấy à?'' và chi tiết ''bắt
    đầu lẩm bẩm tạ ơn Chúa''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000420
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & trần thuật: giữ câu hỏi mở đầu ''Con người này
    đã thỏa mãn chưa vậy?'' và tên riêng ''Tanya''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000421
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ & giọng thoại: giữ ''con của chúng ta'', tiếng cười ''Ha
    ha ha!'' và ''Một quả ngư lôi tuyệt hảo phải không nào?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000422
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại lắp bắp: giữ ''“C-con ư?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000423
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ, giả định trái thực tế & tên riêng: giữ đối lập ''Tôi đã
    sinh ra nó, nhưng chính cô mới là người gieo hạt giống'' và câu điều kiện giả
    định quá khứ với ''mấy quy định đặt tên cứng nhắc vô vị'', ''Tướng Zettour'' và
    ''cha đỡ đầu''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000424
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi cảm thán nội tâm: giữ tự quy chiếu ''mình'', đại từ ''ông''
    gọi Schugel và cặp đối lập ''mình làm bố còn ông làm mẹ đấy hả?!''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000425
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & sắc thái nội tâm: giữ câu trần thuật đầu
    đoạn và chỉ bọc từ ''*điên*'' trong cụm ''Mù quách đi cho rồi, đồ *điên*!'' theo
    đúng thẻ em của nguồn (DEC-P01-002)."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000426
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ lóng hải quân & mức độ khẳng định: giữ hình ảnh ''mấy con
    lươn mà lũ đần bên hải quân đã phát triển'' (chỉ ngư lôi của hải quân) và cụm
    ''dồn sự tỉ mỉ tột bậc vào toàn bộ linh kiện, cho đến tận từng ngòi nổ một''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000427
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chức danh trong thoại: giữ ''“Ý ông là sao, thưa Tiến
    sĩ?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000428
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép, điểm nhìn nội tâm & dấu ngoặc kép: giữ phủ định
    ''chẳng hề mảy may biết... có lẽ ông ta cũng chẳng bao giờ có ý định tìm hiểu…'',
    tự quy chiếu ''Mình'' theo DEC-P01-001 và dấu ngoặc kép mỉa mai quanh từ ''“thành
    tựu”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000429
  kind: terminology_and_voice
  value: 'choices=["Định nghĩa trong thoại: giữ ''Đây là ngư lôi của tôi. Nói cách
    khác, nó là một quả ngư lôi hoạt động đàng hoàng.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000430
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại lắp bắp & chức danh: giữ ''“…Ng-ngư lôi của ông ư,
    thưa Tiến sĩ?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000431
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & câu hỏi tu từ: giữ tự quy chiếu ''mình'',
    các cụm ''nỗi kinh hoàng tột độ'', ''một quả ngư lôi do một gã tiến sĩ điên chế
    tạo'' và câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000432
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ phủ định: giữ ''Ai mà chẳng sợ đến hồn xiêu phách
    lạc cơ chứ?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000433
  kind: terminology_and_voice
  value: 'choices=["Kết luận nội tâm: giữ ''Điều đó có nghĩa vị tiến sĩ là người duy
    nhất hiểu lầm.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000434
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, điều kiện & không thêm nhấn mạnh: giữ tự quy
    chiếu ''Mình''/''mình'', câu điều kiện ''nếu chốc nữa ông ta định bùng nổ thì
    mình muốn lùi ra xa một chút''; không thêm nhấn mạnh Markdown tại vị trí thẻ neo
    trang page-138."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000435
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & quan hệ thời gian: giữ tên riêng ''Tanya'',
    ''vị tiến sĩ cao lêu nghêu'' và cấu trúc ''vừa định lùi lại thì đột nhiên... đã
    sấn sát tới''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000436
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng: giữ dấu chấm lửng ở hai đầu câu ''“…Tôi cứ ngỡ
    mình đã hiểu rõ điều đó về mặt lý trí, nhưng…”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000437
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn trong thoại: giữ ''“Ý ông là sao?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000438
  kind: terminology_and_voice
  value: 'choices=["Liên kết thuật ngữ trong thoại: giữ cụm ''một dự án chung'' đồng
    nhất với p000418."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000439
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn pha trộn theo sát nguồn: giữ tự quy chiếu ''mình'' ở
    mệnh đề phụ đầu câu và tên riêng ''Tanya'' ở mệnh đề chính (''bấu chặt lấy hai
    vai Tanya'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000440
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái trang trọng trong thoại: giữ ''“Tôi xin lỗi.
    Xin hãy cho phép tôi được tạ lỗi từ tận đáy lòng.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000441
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ cụm định danh ''Nhà khoa học rợn người
    kia'' và chi tiết ''sự hối lỗi chân thành''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000442
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm trực tiếp: giữ ''Chuyện gì thế hả, Tiến sĩ?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000443
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu bỏ lửng: bọc chính xác đại từ ''*chúng
    ta*'' bằng dấu sao theo DEC-P01-002 (''“Đó là quả ngư lôi của *chúng ta*. Tôi
    không cố ý…”'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000444
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & so sánh: giữ hình ảnh ''Với gương mặt tái
    mét như một kẻ phạm tội'', hành động ''quỳ sụp xuống'' rồi ''phủ phục xuống đất
    như thể đang xưng thú một trọng tội nào đó''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000445
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ ''“Tôi thực sự rất xin lỗi.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000446
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & độc thoại nội tâm: giữ câu ngắn ''Xin đính
    chính.'', tự quy chiếu ''Mình'', gọi Schugel là ''ông'' và chỉ bọc từ ''*chính
    xác*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000447
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & tình thái suýt xảy ra: giữ cách gọi ''Trung
    tá'', đại từ ''tôi'' / ''chúng ta'', phần giải thích giữa cặp gạch ngang dài ''—sự
    hợp tác giữa chúng ta—'' và hai mốc tình thái ''suýt chút nữa đã sa vào thói ngạo
    mạn'', ''suýt quên mất điều đó''."]'
