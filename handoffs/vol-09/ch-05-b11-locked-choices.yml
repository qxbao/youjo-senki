source_sha256: 6e752589ca5a3bd4200a77b72f89a3f7a99ab03d9c14717b32151e8e5f6cb549
source_package_sha256: 036f83079605daee23aac2eb7c3a6287869adfee766142abe82aa55902cf9a5a
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 38
segment_id_start: YS-LN09/Text/chapter020.xhtml/p000284
segment_id_end: YS-LN09/Text/chapter020.xhtml/p000321
choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000284
  kind: terminology_and_voice
  value: 'locks=["Giữ xưng hô của Đại úy Meybert với Trung úy Tospan: gọi ''cậu'',
    giọng điềm tĩnh của cấp trên trực tiếp.", "Giữ thuật ngữ ''sĩ quan hành chính''
    (administrative officers) và ''doanh trại'' (barracks)."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000285
  kind: terminology_and_voice
  value: 'locks=["Giữ câu đáp lễ quân ngũ của cấp dưới: ''Rõ ạ'' (Understood) và tên
    riêng ''Tospan''."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000286
  kind: terminology_and_voice
  value: locks=["Giữ chính xác phạm vi nhấn mạnh Markdown '*Mình cứ làm cho xong quách
    đi vậy. Mình muốn binh lính quay lại làm việc càng sớm càng tốt…*' theo DEC-P01-002.",
    "Giữ đại từ tự quy chiếu 'Mình' trong độc thoại nội tâm và 'Anh' trong trần thuật
    ngôi thứ ba về Meybert."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000287
  kind: terminology_and_voice
  value: locks=["Giữ phép so sánh ngang bằng giữa 'Bộ máy quan liêu' (Bureaucracy)
    và 'Lục quân Liên bang' (Federation Army)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000288
  kind: terminology_and_voice
  value: 'locks=["Giữ tên ''Meybert'' và các hạng mục bắt buộc trên đơn: đề cương
    tổng quát của công việc, chi phí vận hành, vật tư."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000289
  kind: terminology_and_voice
  value: 'locks=[''Giữ cấu trúc phủ định liệt kê ba hạng mục không làm: xây công sự
    bê tông, thiết lập trận địa nhiều tuyến tinh vi, rải mìn.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000290
  kind: terminology_and_voice
  value: 'locks=[''Giữ chuỗi chi tiết thực tế đối lập với thủ tục: chỉ chất bao cát,
    vật tư duy nhất là bao vải, xúc đất cát có sẵn gần đó nhồi vào và xếp chồng, lính
    đã có sẵn xẻng.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000291
  kind: terminology_and_voice
  value: locks=["Giữ ý khả thể 'gói gọn trên một trang sổ tay'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000292
  kind: terminology_and_voice
  value: locks=["Giữ sự tương phản giữa 'một trang sổ tay' và 'mười biểu mẫu khác
    nhau' với quy cách điền riêng biệt."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000293
  kind: terminology_and_voice
  value: locks=["Giữ từ 'hậu phương' (the rear) và dấu ngoặc kép biểu thị sắc thái
    mỉa mai của từ 'formal'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000294
  kind: terminology_and_voice
  value: 'locks=[''Giữ hình thức câu hỏi liệt kê bốn yêu cầu: nguồn gốc số đất, xác
    nhận quyền sở hữu, kế hoạch phòng thủ hiện hành, kiểm tra bản vẽ thi công.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000295
  kind: terminology_and_voice
  value: locks=["Giữ chính xác phạm vi nhấn mạnh Markdown '*Có khi nhồi đống giấy
    tờ này vào bao còn nhanh hơn là xúc đất ấy chứ!*' theo DEC-P01-002.", "Giữ đại
    từ trần thuật 'anh' chỉ Meybert và ý muốn 'nổi loạn' (mutiny)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000296
  kind: terminology_and_voice
  value: 'locks=[''Giữ hai mệnh đề tăng tiến về sự chậm trễ: thời gian trôi qua nhiều
    hơn dự kiến và công việc chậm tiến độ hơn tính toán.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000297
  kind: terminology_and_voice
  value: 'locks=["Giữ cấp bậc và xưng hô trong thoại của Tospan với Meybert: tự xưng
    ''Tôi là Trung úy Tospan'', gọi ''thưa Đại úy'', có tiểu từ kính ngữ ''ạ''."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000298
  kind: terminology_and_voice
  value: locks=["Giữ câu trả lời phủ định ngắn gọn và đại từ 'Tôi' trong thoại của
    Meybert với cấp dưới."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000299
  kind: terminology_and_voice
  value: locks=["Giữ đại từ 'tôi', sắc thái kính ngữ 'ạ' và ý tự nhận không giỏi chuyện
    giấy tờ của Tospan."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000300
  kind: terminology_and_voice
  value: 'locks=["Giữ đúng các danh xưng và thuật ngữ: ''Trung úy Serebryakov'', ''sĩ
    quan phụ tá'' (adjutant), ''Trung tá Degurechaff'' (Colonel Degurechaff), đại
    từ ''cô ấy''.", ''Giữ tình thái giả định trái thực tế đối với nhận định về Serebryakov
    sau khi áp dụng sửa lỗi.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000301
  kind: terminology_and_voice
  value: locks=["Giữ điểm nhìn hồi tưởng của Meybert ('anh') về Serebryakov ('cô')
    và thuật ngữ 'pháp sư' (mage)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000302
  kind: terminology_and_voice
  value: locks=["Giữ cụm 'mối đe dọa cấp chiến thuật' (tactical threat) và cách gọi
    'Trung úy Tospan', xưng 'tôi' - 'cậu'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000303
  kind: terminology_and_voice
  value: locks=["Giữ câu đáp 'Rõ ạ.' nhất quán với p000285."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000304
  kind: terminology_and_voice
  value: 'locks=[''Giữ quan hệ nhượng bộ: miệng cằn nhằn nhưng không còn lựa chọn
    nào khác ngoài tiếp tục làm.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000305
  kind: terminology_and_voice
  value: locks=["Giữ đại từ khái quát ở câu đầu, quân hàm 'đại úy' (captain) và chuyên
    ngành 'lính pháo binh' (artilleryman) của Meybert."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000306
  kind: terminology_and_voice
  value: locks=['Giữ phép đối lập giữa sức nặng của đạn pháo (p000305) và sự nhẹ bẫng
    của cây bút nhưng không nhích được tiến độ vì không quen tay.']
- segment_id: YS-LN09/Text/chapter020.xhtml/p000307
  kind: terminology_and_voice
  value: locks=["Giữ thuật ngữ 'sở chỉ huy' (command post) và chi tiết vị trí hướng
    ra biển."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000308
  kind: terminology_and_voice
  value: 'locks=[''Giữ hai thao tác gây kiệt sức: lập kế hoạch thi công đúng quy định
    và chép thành văn bản lên đủ loại biểu mẫu để nộp xét duyệt.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000309
  kind: terminology_and_voice
  value: locks=["Giữ câu hỏi tu từ phàn nàn về 'cuốn sổ quy tắc' (rule book) và 'bản
    đề xuất thi công' (construction proposal)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000310
  kind: terminology_and_voice
  value: locks=['Giữ sự đối lập giữa lời lẩm bẩm và đôi tay vẫn tiếp tục viết của
    Meybert.']
- segment_id: YS-LN09/Text/chapter020.xhtml/p000311
  kind: terminology_and_voice
  value: locks=["Giữ thuật ngữ 'hệ thống phân loại' (classification system), con số
    'mười hai loại bao cát khác nhau' và yêu cầu phải chỉ định chính xác loại sử dụng."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000312
  kind: terminology_and_voice
  value: locks=["Giữ độc thoại tự than của Meybert ('mình') và sự đối lập hài hước
    đen giữa 'tử trận nơi sa trường' (killed in action) với bị giấy tờ lấy mạng trước."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000313
  kind: terminology_and_voice
  value: locks=["Giữ thuật ngữ 'mặt trận phía đông' (eastern front) và phạm vi nhấn
    mạnh Markdown '*Tử thủ trận địa đến cùng*' theo DEC-P01-002."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000314
  kind: terminology_and_voice
  value: 'locks=[''Giữ so sánh nghịch lý: lệnh đào công sự bám trụ và giữ vững trận
    địa bằng mọi giá trở nên chẳng đến nỗi tệ khi đặt cạnh việc điền vô số giấy tờ
    chi tiết theo sách quy tắc.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000315
  kind: terminology_and_voice
  value: locks=["Giữ thuật ngữ 'mặt trận phía đông' (eastern front) và ý đối lập giữa
    quyền tự quyết ngoài thực địa (chỉ kèm một tờ mệnh lệnh bằng văn bản duy nhất)
    với mớ việc vặt rườm rà hiện tại."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000316
  kind: terminology_and_voice
  value: locks=["Giữ chi tiết uống nước sạch thỏa thích, sự xa xỉ chỉ có ở 'nơi đồn
    trú' (garrison) và câu cảm thán về 'hệ thống nước máy' (running water)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000317
  kind: terminology_and_voice
  value: locks=['Giữ nhận định chung về tác dụng của nước mát đối với tâm trí rã rời.']
- segment_id: YS-LN09/Text/chapter020.xhtml/p000318
  kind: terminology_and_voice
  value: locks=["Giữ cách gọi 'Trung úy Tospan' và đại từ 'cậu' trong câu hỏi thăm
    tiến độ của Meybert."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000319
  kind: terminology_and_voice
  value: locks=['Giữ trần thuật gián tiếp về câu trả lời của viên trung úy và hành
    động Meybert đưa bình nước để cả hai cùng rót uống.']
- segment_id: YS-LN09/Text/chapter020.xhtml/p000320
  kind: terminology_and_voice
  value: locks=["Giữ đại từ 'Tôi - mình' trong lời thoại của Tospan, thuật ngữ 'công
    binh dã chiến' (field engineer), và chính xác phạm vi nhấn mạnh Markdown '*Thế
    mà ở đây cái gì cũng khác.*' theo DEC-P01-002."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000321
  kind: terminology_and_voice
  value: locks=["Giữ phép chơi chữ đối lập giữa cử động tay chân và cách 'múa bút'
    (the way pens move), cùng chi tiết vẽ sơ đồ khi đi rải mìn."]
