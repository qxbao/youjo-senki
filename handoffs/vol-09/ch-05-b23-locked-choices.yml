segment_id_end: YS-LN09/Text/chapter020.xhtml/p000848
choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000814
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại mở đầu của Tanya giữ đúng xưng hô ('Thưa
    Đại tá Calandro', 'tôi - ngài') và giọng khách sáo mỉa mai.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000815
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('mình') xen lời thoại
    của Tanya ('chúng ta', 'tôi - ngài') và thuật ngữ 'mặt trận phía đông', 'chuyên
    gia tác chiến sơn cước', 'sĩ quan cấp tá' nhất quán.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000816
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp điềm tĩnh của Calandro ('Chúng ta') và
    nhận xét của Tanya tự nhiên, chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000817
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi tu từ nội tâm giữ đúng các thuật ngữ 'sĩ
    quan tham mưu', 'trường đại học quân sự', 'bí mật quân sự' và dấu chấm hỏi cảm
    thán.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000818
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Nhận định nội tâm của Tanya giữ đúng mức độ suy
    đoán ('chí ít cũng là') và thuật ngữ 'điệp viên tình báo', 'chính sách đối ngoại'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000819
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Bảo toàn chính xác các thuật ngữ 'tính thực dụng
    địa chính trị', 'Bộ Tổng tham mưu', 'Kampfgruppe Lergen' và 'quan sát viên quân
    sự'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000820
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi thăm dò lịch sự của Tanya ('tôi - ngài')
    mượt mà, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000821
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp trả của Calandro lặp lại chuẩn xác cụm
    'một sĩ quan cấp tá quèn' mà Tanya đã tự nhận ở p000809.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000822
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Tanya giữ đúng cấu trúc phủ định
    kép ('đâu có gì là không thỏa đáng') và sự đối xứng giữa 'một vị đại tá xuất thân
    từ bộ đội sơn cước' với 'tôi, một sĩ quan cấp tá quèn'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000823
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật ngắn súc tích, đúng nhịp.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000824
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba ('Tanya', 'Calandro', 'cô')
    giữ rõ thế đối lập giữa hai bên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000825
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng cấu trúc phủ định ('chẳng thể... mà không...')
    và hình ảnh 'vỏ bọc công khai'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000826
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Đoạn bình luận mỉa mai giữ chuẩn đại từ khái quát
    'Bạn' và sắc thái nghịch lý của quan hệ Ildoa – Đế quốc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000827
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại nhượng bộ xã giao của Calandro ('tôi')
    tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000828
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ chuẩn cấu trúc giả định trái thực tế ('Nếu
    ông ta thực sự chịu khuất phục thì mọi chuyện đã chẳng...'), tình thái ('có lẽ')
    và phủ định nhấn mạnh ('chẳng hề nao núng lấy một chút nào').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000829
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba ('Tanya') giữ đúng cấu trúc
    phủ định ('chẳng thu được lợi lộc gì'); bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000830
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Đoạn kết hợp lời thoại ('Thưa Đại tá', 'tôi - ngài'),
    trần thuật ('Tanya') và câu hỏi tu từ gián tiếp tự do ('chẳng phải đây là... đó
    sao?') mượt mà, chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000831
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Xưng hô của Calandro với Tanya ('Thưa Trung tá',
    'cô') chuẩn cấp bậc và giữ đúng giọng bông đùa ngoại giao.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000832
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi ngắn của Tanya ('Ngài - tôi') tự nhiên,
    bộc lộ đúng nét hào hứng kín đáo.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000833
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba đối lập rõ 'tia hy vọng
    le lói' của Tanya với phản ứng 'khẽ nhăn mặt' của Calandro.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000834
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Calandro ('Tôi - cô') và phần chêm
    trần thuật giữa hai dấu gạch ngang ('—ông ta cười khổ—') chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000835
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Tanya ('Ngài', 'Tôi', 'chúng tôi')
    giữ đúng sắc thái thăm dò thẳng thắn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000836
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật pha suy đoán nội tâm của Tanya giữ đúng
    đại từ ('ông ta', 'cô') và các từ tình thái suy luận ('Hẳn ông ta muốn nói...',
    'hẳn ông ta đang truyền đạt...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000837
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Nhận xét khái quát về sự pha trộn giữa góc nhìn
    cá nhân và lập trường công vụ rõ nghĩa, gãy gọn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000838
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Calandro giữ đúng cấu trúc phủ định
    kép ('chẳng có lý do gì để từ chối...') và thuật ngữ 'quốc gia trung lập'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000839
  kind: terminology_and_voice
  value: Touch=polish_optional; rationale=Câu hỏi móc máy của Tanya chính xác về nghĩa
    và xưng hô ('các ngài'); có thể cân nhắc giảm lặp từ 'cảng' ở bước chuốt văn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000840
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp của Calandro giữ chuẩn thuật ngữ 'chính
    sách láng giềng thân thiện' và cách diễn đạt thành ngữ tự nhiên ở câu cuối.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000841
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Đoạn đánh giá về Ildoa giữ trọn hình ảnh ẩn dụ
    'con dơi cơ hội' và 'quốc gia gió chiều nào xoay chiều ấy đầy tính hợp lý'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000842
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya phân biệt chuẩn đại
    từ 'Chúng ta' (Đế quốc) và 'mình' (cá nhân Tanya), giữ đúng cụm 'đầu mối liên
    lạc'; bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000843
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba ('cô') chuyển nhịp tự nhiên
    sang hành động nhận phong bì chứa tấm séc và thị thực.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000844
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời chào kết thúc cuộc trò chuyện của Tanya ('thưa
    Đại tá', 'Chúng tôi', 'tôi - ngài') chuẩn mực.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000845
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Tiêu đề chuyển cảnh sang ngày 21 tháng 7 năm Thống
    nhất 1927 trên khoang hạng nhất chuyến tàu quốc tế chuẩn định dạng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000846
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('cấp dưới của mình',
    'Cá nhân mình') giữ đúng sắc thái tiếc nuối pha hài hước sau kỳ nghỉ ngắn ở thủ
    đô Ildoa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000847
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ chuẩn cụm 'chính sách ngoại giao gió chiều
    nào xoay chiều ấy' và giải thích rõ lý do Ildoa không muốn binh lính Đế quốc lưu
    trú dài ngày.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000848
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu kết batch giữ trọn nhịp liệt kê ở đầu câu và
    lý giải hợp lý sự bất tiện ngoại giao đối với Ildoa.
