    tâm 'mình' và đại từ ngôi thứ ba 'ông ta'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000079
  kind: terminology_and_voice
  value: choices=["Khóa nhấn mạnh Markdown '*viên đạn lạc đáng tiếc*' theo đúng thẻ
