    'À không, làm thế thì chắc cũng hơi quá tay'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000080
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình' và mức độ khẳng định tuyệt đối 'dứt
    khoát' (absolutely)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000081
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình' và phản xạ chỉnh lại tư thế ngồi thẳng
    lưng khi có tiếng gọi từ phía sau."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Khóa cách xưng hô của Đại tá Calandro với Tanya: gọi ''Trung tá
    Degurechaff'' (Colonel Degurechaff), xưng ''tôi'' và gọi ''cô''."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000083
  kind: terminology_and_voice
  value: choices=["Khóa lời đáp ngắn của Tanya gọi cấp bậc 'Đại tá!' (Colonel!)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000084
  kind: terminology_and_voice
  value: choices=["Khóa sự phân biệt cử chỉ hai tay (tay phải ra hiệu cứ ngồi yên,
