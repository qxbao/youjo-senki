  kind: terminology_and_voice
  value: 'choices=["Khóa câu lẩm bẩm cảm thán ngắn trong dấu ngoặc kép: ''“…Ghen tị
    chết đi được.”''."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000069
  kind: terminology_and_voice
  value: choices=["Khóa ẩn dụ tài chính 'Cổ tức mà hòa bình mang lại' (The dividends
