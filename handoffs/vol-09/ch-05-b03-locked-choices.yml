- segment_id: YS-LN09/Text/chapter018.xhtml/p000085
  kind: terminology_and_voice
  value: choices=["Khóa cặp đại từ thoại 'cô' (hoặc 'các vị') và chi tiết giới chức
    Đế quốc muốn nhồi kín lịch trình bằng các bữa tiệc."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000086
  kind: terminology_and_voice
  value: choices=["Khóa đại từ thoại ngôi thứ nhất số nhiều 'chúng tôi' và giọng hỏi
    mỉa mai lịch sự của Tanya."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000087
  kind: terminology_and_voice
  value: choices=["Khóa cách gọi 'Trung tá' (Colonel) trong lời thoại của Calandro
    và đại từ trần thuật ngôi thứ ba 'cô' (her) ở phần dẫn thoại.", "Khóa cách diễn
    đạt phù hợp văn phong lịch sử cho ý làm đám quan liêu hiểu ra vấn đề (tránh từ
    lóng hiện đại 'thông não') và sự đối lập giữa tiệc chào mừng chính thức với một
    bữa tối không chính thức đơn giản."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000088
  kind: terminology_and_voice
  value: choices=["Khóa nhấn mạnh Markdown toàn bộ câu độc thoại nội tâm '*Chỉ ăn
    tối lấy lệ với đồng nghiệp rồi sau đó chúng ta được thả tự do ư?!*' theo đúng
    thẻ em trong nguồn và đại từ 'chúng ta'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000089
  kind: terminology_and_voice
  value: choices=["Khóa cách dịch 'một cuộc gặp xã giao' (a courtesy call) và cặp
    đại từ thoại 'tôi' – 'Cô' của Calandro."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000090
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'Mình' và sự tương phản giữa dự tính ban đầu
