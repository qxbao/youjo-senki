    điều kiện 'Nếu có thể... dù chỉ một ngày thôi'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000070
  kind: terminology_and_voice
  value: choices=["Khóa điểm nhìn trần thuật ngôi thứ ba với định danh 'Tanya' và
    đại từ 'cô'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000071
  kind: terminology_and_voice
  value: choices=["Khóa đại từ ngôi thứ hai phiếm chỉ 'Bạn' trong cụm 'Bạn có tin
    nổi không' và chi tiết 'bột mì trắng tinh chế' (processed white flour)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000072
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm ngôi thứ nhất số nhiều 'chúng ta' (chỉ nhóm
    của Tanya) và sắc thái thản nhiên của người phục vụ."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Khóa câu hỏi ngắn trong dấu ngoặc kép lặp lại cụm từ ở p000072:
    ''“Cứ tự nhiên dùng ư?”''."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000074
  kind: terminology_and_voice
  value: choices=["Khóa tên gọi 'Đế quốc' (the Empire) và cụm thuật ngữ 'loại bánh
