- segment_id: YS-LN09/Text/chapter018.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Khóa cụm cảm thán ngắn bỏ lửng: ''Mùi hương này…''."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000077
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình' và nhịp câu ngắn diễn tả sự cám dỗ của
    mùi bánh mì."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000078
  kind: terminology_and_voice
  value: choices=["Khóa nhấn mạnh Markdown '*muộn*' theo đúng thẻ em trong nguồn.",
