task_id: vol-09-ch-02-b03
baseline_sha256: a67a8bd95089d99673bd1c7e46daa462594d900451e44992a476bd19b9d8174c
source_sha256: 6e752589ca5a3bd4200a77b72f89a3f7a99ab03d9c14717b32151e8e5f6cb549
source_package_sha256: f35f393c8128751c5866e137e5801048dfd5b446873527da9290aa50fe5645d6
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 42
segment_id_start: YS-LN09/Text/chapter006.xhtml/p000070
segment_id_end: YS-LN09/Text/chapter006.xhtml/p000111
choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại báo cáo: giữ câu đáp ngắn gọn ''“Nằm trong giới hạn
    cho phép.”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điểm nhìn: giữ ''Các sĩ quan đang rà soát hậu quả
    của đợt không kích'' và địa danh ''Sở chỉ huy Miền Tây''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ cụm danh từ ngắn ''Thiệt hại không đáng kể.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Phủ định & quan hệ thời gian: giữ phủ định ''Chẳng ai dám đòi
    hỏi gì hơn thế'' và mốc thời gian quá khứ hoàn thành ''từ lâu đã từ bỏ hy vọng
    rằng những chiếc máy bay ném bom sẽ chấm dứt kéo tới''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & tình thái: giữ ''Tuyến phòng thủ vành đai'',
    ''các trận địa phòng không nghi binh'', đại từ ''Tôi'' / ''chúng ta'' và hai sắc
    thái tình thái đối lập ''Tôi dám nói...'' – ''Nhưng tôi e là chúng ta khó mà...''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''Một tốp đã không mắc bẫy'' (nhất quán
    với cách dịch ''group'' ở ch-02-b01), ''khu công nghiệp'' và ''một sư đoàn của
    không hạm đội''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái dự báo: giữ đại từ ''chúng ta'', thành ngữ
    ''giáng cho kẻ địch một đòn đau'', tình thái ''có khả năng lớn'' và thuật ngữ
    ''các hoạt động tiến công''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối lập thời gian: giữ ''phi vụ ném bom ban đêm'',
    ''máy bay ném bom hạng nặng'', ''không hạm đội Đế quốc'', ''lực lượng máy bay
    ném bom của Khối Thịnh vượng chung'' và thế tương phản giữa giai đoạn đầu cuộc
    chiến với thực tại bị chọc thủng liên tục."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & ẩn dụ: giữ cấu trúc phủ định kép ''cũng chẳng phải
    phía chủ nhà Đế quốc chỉ ngồi không khoanh tay đứng nhìn'' (hô ứng với hình ảnh
    ''những vị khách'' ở batch trước) và hai câu phủ định liên tiếp về giới hạn năng
    lực."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi gián tiếp & thuật ngữ: giữ ''tự hỏi liệu họ có giữ nổi
    nguyên trạng hiện tại hay không''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh trong thoại: giữ câu mệnh lệnh trực tiếp ''“Bắt tay
    vào việc sửa chữa, phân phát hàng cứu trợ và chăm sóc các nạn nhân đi.”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Chức danh & địa danh: giữ ''vị chỉ huy'', cấu trúc nhấn mạnh ''chẳng
    gì khác ngoài bổn phận trang nghiêm của họ'' và ''những sĩ quan ở miền tây''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Tương phản thời gian: giữ sự đối lập giữa lúc ''các cuộc tập kích
    hằng đêm mới bắt đầu'' với hiện tại ''đã quá đỗi quen thuộc với chúng''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Phạm vi nhận định: giữ trạng ngữ giới hạn ''Ít nhất là đối với
    các sĩ quan''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Sắc thái từ vựng: giữ ''tâm trí từng trải của họ vẫn hướng về
    tương lai''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái suy đoán: giữ phủ định tuyệt đối ''Chẳng
    một ai từng lớn tiếng nói ra'', tình thái ''ắt hẳn mọi người đều đang nghĩ trong
    lòng'' và ''các sĩ quan Đế quốc''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Nhịp câu & dấu câu: giữ dấu ba chấm lửng và sắc thái ''vài lời
    nhận xét khe khẽ lại buột ra''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nhịp thoại bỏ lửng: giữ đại từ ''chúng ta'', câu phủ
    định ''không thể duy trì chuyện đó mãi được'' và dấu ba chấm bỏ lửng ''Cứ đà này,
    không sớm thì muộn…''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tâm lý & tình thái thói quen: giữ ''Tâm lý bi quan là
    điều cấm kỵ lớn nhất đối với một người lính'' và thói quen ''cười xòa cho qua
    những suy nghĩ u ám như thế''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm tập thể: giữ câu hỏi nghi vấn ''Liệu giao tranh
    sẽ chỉ ngày càng trở nên khốc liệt hơn sao?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Phủ định & liên kết mạch văn: giữ phủ định ''chẳng còn đủ sức
    để cười xòa gạt đi những mối âu lo ấy như một biểu hiện của tâm lý bi quan nữa''
    và cụm kết ''cùng một nỗi sợ hãi'' mở đầu chuỗi điệp cấu trúc."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Điệp cấu trúc: giữ cụm danh từ ngắn ''Cùng một mối âu lo.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Điệp cấu trúc: giữ cụm danh từ ngắn ''Cùng một nỗi kinh hoàng.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Điệp cấu trúc: giữ cụm danh từ ngắn ''Cùng một điềm chẳng lành.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: giữ ''chủ nghĩa bại trận'' và phép so sánh
    ''tuôn trào như thể đập vỡ''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ trong thoại: giữ ''Mặt trận phía đông'', ''đơn
    vị tiêm kích'' và đại từ ''chúng ta''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & giọng thoại: bọc chính xác phần nhại lời
    ''*Mặt trận phía đông cần thứ này; mặt trận phía đông cần thứ kia!*'' bằng dấu
    sao theo DEC-P01-002; giữ câu hỏi bức xúc ''Thế còn phần còn lại của chúng ta
    thì sao?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ cụm danh từ ngắn ''Những lời than vãn vô
    bổ.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ cấu trúc kết quả ''tích tụ quá lâu đến mức
    các sĩ quan buộc phải xả chúng ra ngay khi có cơ hội''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''phi công bổ sung mới'', ''số giờ bay thấp hơn
    hẳn tiêu chuẩn trước chiến tranh'' và ''mức hai chữ số!''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ đại từ ''Tôi'', con số ''tối thiểu một
    trăm năm mươi giờ'' và ''đợt điều động thực chiến đầu tiên''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ hiếm: giữ ''lứa đào tạo cấp tốc mới nhất''
    và ''hiếm lắm mới tìm được người nào đạt tới mức ba chữ số''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, chức danh & giả định quá khứ: bọc chính xác
    câu cảm nghĩ đầu đoạn ''*Thật khó mà tin nổi.*'' bằng dấu sao theo DEC-P01-002;
    giữ ''viên sĩ quan liên lạc không quân'' và cấu trúc phủ định ''thậm chí còn chưa
    tốt nghiệp khóa huấn luyện nữa''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Tình thái chuẩn mực & điều kiện: giữ tình thái ''Lẽ ra họ phải
    tích lũy được ít nhất ba trăm giờ bay'' và câu điều kiện rút gọn ''Sáu trăm giờ,
    nếu có thể.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''những tiêu chuẩn nghiêm ngặt trước chiến tranh''
    và ''mức chuẩn nền tảng mà họ luôn tuân theo''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Nhận định khách quan: giữ ''cảm thấy tình hình hiện tại hết sức
    đáng bất an cũng là điều hoàn toàn tự nhiên''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & thành ngữ: giữ câu hỏi tu từ bức xúc ''vắt kiệt
    và đẩy những phi công đầy triển vọng cùng các pháp sư trẻ tuổi của mình vào chỗ
    chết sao?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & thuật ngữ: giữ ''Chúng ta còn lựa chọn nào khác
    đâu?'', ''các đơn vị pháp sư trên không'' và ''bù đắp cho mọi tổn thất ở miền
    đông rồi…''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: giữ ''mặt trận phía đông'' và hình ảnh ẩn dụ
    ''Nơi đó đúng là một bãi lầy.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''Bộ Tư lệnh Trung ương'', ''vật tư và trang bị
    quân sự'', ''mặt trận phía đông'', ''các vùng lãnh thổ chiếm đóng'' và ''cuộc
    chiến tiêu hao ở miền đông''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: giữ cấu trúc nhượng
    bộ – phủ định ''còn lâu mới có đủ đạn pháo phòng không'', ''chính quốc'', bọc
    chính xác lý do nhại lại ''*bởi vì miền đông đang cần chúng*'' bằng dấu sao theo
    DEC-P01-002, và giữ ''hệ thống phòng không''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Điệp phủ định kết đoạn: giữ hai câu phủ định ngắn dứt khoát ''Đơn
    giản là không đủ. Chẳng có thứ gì là đủ cả.''"]'
