choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000368
  kind: terminology_and_voice
  value: choice=Bảo toàn nhấn mạnh Markdown '*Vậy thì tại sao?*' cho câu độc thoại
    nội tâm của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000369
  kind: terminology_and_voice
  value: choice=Giữ nhịp câu hỏi liên tiếp tự vấn thành tiếng của Meybert về còi báo
    động và đội hình bố trí của quân mình.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000370
  kind: terminology_and_voice
  value: choice=Đại từ trần thuật 'anh' cho Meybert; giữ chuẩn xác mệnh đề về nguyên
    tắc căn bản nhất của chiến tranh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000371
  kind: terminology_and_voice
  value: choice=Giữ nguyên cấu trúc nhân quả phê phán sự lạc quan vô căn cứ và lười
    nhác của sĩ quan cấp trên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000372
  kind: terminology_and_voice
  value: choice=Diễn đạt tự nhiên sự bất an của Meybert trước việc thiếu vắng các
    biện pháp phòng bị hiển nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000373
  kind: terminology_and_voice
  value: choice=Dịch 'the navy and other guards here' là 'bên hải quân và các lực
    lượng canh phòng khác ở đây'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000374
  kind: terminology_and_voice
  value: choice=Hạ sĩ quan đáp lời cấp trên xưng 'Tôi', dịch sát ý guồng quay phòng
    thủ cảng thường nhật làm họ trở nên cứng nhắc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000375
  kind: terminology_and_voice
  value: choice=Dịch 'the brass' là 'giới chóp bu', 'the rear' là 'hậu phương', 'Colonel
    Degurechaff' là 'Trung tá Degurechaff' và đại từ 'cô ấy' trong lời thoại của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000376
  kind: terminology_and_voice
  value: choice=Dịch 'NCOs' là 'các hạ sĩ quan', 'little girl—or rather, little commander'
    là 'cô bé ấy—hay đúng hơn, vị chỉ huy nhỏ nhắn ấy', đại từ trần thuật 'Cô' cho
    Tanya từ điểm nhìn của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000377
  kind: terminology_and_voice
  value: 'choice=Giữ giọng nhận xét thẳng thắn của Meybert: đối lập năng lực của Tanya
    (''Cô ấy'') với các lực lượng tại cảng.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000378
  kind: terminology_and_voice
  value: choice=Hạ sĩ quan gọi 'Thưa Đại úy', xưng 'tôi', giữ nhịp ngập ngừng tán
    đồng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000379
  kind: terminology_and_voice
  value: choice=Dịch 'the colonel' là 'vị trung tá' (chỉ Trung tá Tanya von Degurechaff),
    xưng 'tôi - chúng ta'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000380
  kind: terminology_and_voice
  value: 'choice=Hạ sĩ quan nói đùa với Meybert nhưng vẫn giữ lễ tiết quân ngũ: ''Ngài
    - tôi'', ''thưa Đại úy'', ''ạ''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000381
  kind: terminology_and_voice
  value: choice=Giữ nhịp chuyển cảnh tự nhiên sau tràng cười sang việc trao đổi thông
    tin với cấp trên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000382
  kind: terminology_and_voice
  value: choice=Đồng bộ 'HQ' và 'command' thành 'bộ chỉ huy', đại từ trần thuật 'anh'
    cho Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000383
  kind: terminology_and_voice
  value: choice=Bảo toàn nhấn mạnh Markdown cho toàn bộ câu độc thoại nội tâm của
    Meybert, dùng đại từ tự xưng 'mình' và dịch 'runner' là 'lính liên lạc chạy bộ'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000384
  kind: terminology_and_voice
  value: choice=Dịch 'the captain' là 'vị đại úy', giữ nhịp chuyển bất ngờ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000385
  kind: terminology_and_voice
  value: choice=Dịch câu nhận diện đầu dây 'This is port command' là 'Bộ chỉ huy cảng
    nghe đây'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000386
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác nhấn mạnh Markdown '*Ồ?*' và miêu tả sự điềm tĩnh
    từ đầu dây bên kia.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000387
  kind: terminology_and_voice
  value: choice=Giữ chuẩn 'Đại úy Meybert thuộc Kampfgruppe Lergen' và 'sĩ quan trực
    ban' ('duty officer').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000388
  kind: terminology_and_voice
  value: 'choice=Tái hiện nét lắp bắp bất ngờ của lính tín hiệu: ''Kh-khẩn cấp ư?
    Có chuyện gì thế, thưa Đại úy?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000389
  kind: terminology_and_voice
  value: choice=Bảo toàn đúng phạm vi nhấn mạnh Markdown cho phần suy nghĩ nội tâm
    của Meybert (dùng đại từ 'mình') và dịch 'signaler' là 'người lính tín hiệu'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000390
  kind: terminology_and_voice
  value: choice=Bảo toàn nhấn mạnh Markdown '*Chẳng lẽ… họ vẫn chưa nhận ra sao?*'
    cho câu độc thoại nội tâm.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000391
  kind: terminology_and_voice
  value: 'choice=Giữ nhịp mệnh lệnh gấp gáp của Meybert: ''Cho gặp sĩ quan trực ban!
    Ngay lập tức!'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000392
  kind: terminology_and_voice
  value: 'choice=Giữ nét lúng túng của người lính trực tổng đài: ''X-xin chờ một chút.
    Tôi sẽ đi kiểm tra…'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000393
  kind: terminology_and_voice
  value: 'choice=Câu thúc giục khẩn trương của Meybert: ''Tình huống khẩn cấp đấy!
    Nhanh lên!'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000394
  kind: terminology_and_voice
  value: choice=Giữ nhịp câu ngắn thể hiện cảm giác sốt ruột về thời gian chờ đợi
    của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000395
  kind: terminology_and_voice
  value: choice=Bảo toàn đúng phạm vi nhấn mạnh Markdown cho câu độc thoại nội tâm
    cuối đoạn và dịch 'HQ' là 'bộ chỉ huy'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000396
  kind: terminology_and_voice
  value: choice=Giữ đại từ trần thuật 'Anh' cho Meybert và thuật ngữ 'sĩ quan trực
    ban'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000397
  kind: terminology_and_voice
  value: choice=Dịch 'Lieutenant Colonel Paul' là 'Trung tá Paul'; cấp trên xưng 'tôi'
    và gọi Đại úy Meybert là 'anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000398
  kind: terminology_and_voice
  value: choice=Meybert báo cáo ngắn gọn với cấp trên về 'đoàn tàu có hộ tống không
    nằm trong lịch trình', có kính ngữ 'ạ'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000399
  kind: terminology_and_voice
  value: choice=Giữ chuẩn 'Trung tá Paul', 'đoàn tàu có hộ tống', 'Quân đoàn Viễn
    chinh Lục địa Phía nam' và 'các đoàn tàu vận tải có hộ tống'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000400
  kind: terminology_and_voice
  value: 'choice=Phân biệt đại từ trần thuật: ''ông ta'' cho Trung tá Paul và ''Meybert''
    / ''mình'' cho phía Meybert.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000401
  kind: terminology_and_voice
  value: 'choice=Meybert hỏi xác nhận cấp trên: ''Ngài đã có xác nhận chưa ạ?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000402
  kind: terminology_and_voice
  value: 'choice=Giữ giọng điệu đủng đỉnh, chủ quan của Trung tá Paul: ''Chúng tôi
    đang tiến hành rồi. Tôi chắc là sẽ sớm có kết quả thôi.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000403
  kind: terminology_and_voice
  value: choice=Bảo toàn nhấn mạnh Markdown '*Các người vẫn chưa có sao?!*', dịch
    'the lieutenant colonel' là 'vị trung tá' và giữ đúng cấu trúc giả định trái thực
    tế.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000404
  kind: terminology_and_voice
  value: choice=Dịch 'Colonel' (khi gọi Trung tá Paul) là 'thưa Trung tá', xưng hô
    'các ngài' cho phía bộ chỉ huy cảng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000405
  kind: terminology_and_voice
  value: choice=Giữ thuật ngữ 'sương mù chiến tranh' ('fog of war'), 'chỉ huy tiền
    tuyến' ('frontline commander') và cặp đại từ 'tôi - anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000406
  kind: terminology_and_voice
  value: choice=Dịch 'duty to dissent' là 'nghĩa vụ phải lên tiếng phản biện', đại
    từ 'Anh' / 'mình' cho Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000407
  kind: terminology_and_voice
  value: choice=Meybert xưng 'Tôi' / 'chúng tôi' khi phản bác bằng căn cứ mã nhận
    dạng của đoàn tàu đón Quân đoàn Viễn chinh Lục địa Phía nam.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000408
  kind: terminology_and_voice
  value: choice=Giữ giọng kẻ cả, thiếu kiên nhẫn của Trung tá Paul với cặp đại từ
    'Tôi - mình - anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000409
  kind: terminology_and_voice
  value: choice=Dịch 'Colonel Paul' là 'thưa Trung tá Paul', giữ chuẩn 'cờ tín hiệu'
    ('signal flags') và 'mã nhận dạng' ('identification code').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000410
  kind: terminology_and_voice
  value: choice=Miêu tả nỗ lực kiềm chế cơn giận của Meybert, đại từ trần thuật 'Anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000411
  kind: terminology_and_voice
  value: 'choice=Lời báo cáo khẩn của hạ sĩ quan với Meybert: ''Thưa Đại úy, một số
    tàu chưa rõ danh tính đang thẳng hướng tiến vào cảng.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000412
  kind: terminology_and_voice
  value: choice=Dịch 'NCO' là 'người hạ sĩ quan' và bảo toàn chính xác nhấn mạnh Markdown
    cho câu độc thoại nội tâm cuối đoạn.
