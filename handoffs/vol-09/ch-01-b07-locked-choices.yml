- segment_id: YS-LN09/Text/chapter004.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & mức độ đánh giá: giữ tên riêng ''Tanya'',
    hình ảnh ''một cơn ớn lạnh không tài nào chịu nổi chạy dọc sống lưng Tanya'' và
    nhận định ''quá nghiêm trọng để có thể cười xòa cho qua''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Câu ngắn phủ định nội tâm: giữ câu danh ngữ phủ định ''Không có
    tân binh mới.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Câu ngắn phủ định song hành: giữ ''Không có sinh viên mới tốt
    nghiệp.'' song hành với p000074 (không thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Giả định so sánh kinh doanh: giữ ẩn dụ công ty ''chẳng khác nào
    một công ty không còn khả năng tuyển dụng đám trẻ vừa ra trường đại học vậy!''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, điều kiện giả định & đối lập: Tanya tự quy
    chiếu bằng ''mình'' theo DEC-P01-001, dùng ''chúng ta'' cho tổ chức; giữ ''phá
    sản'', ''săn trộm vài nhân sự tài năng'' và đối lập ''chẳng có gì đáng cười ở
    đây cả''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & xưng hô trong thoại: giữ tên riêng ''Lergen''
    ở phần dẫn; trong thoại Lergen xưng ''tôi''/''mình'', gọi Tanya là ''cô'' và giữ
    phủ định ''vẫn chưa được quyết định chính thức đâu''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Xưng hô lễ phép trong thoại: dịch ''sir'' là ''thưa Đại tá'' kèm
    tiểu từ kính ngữ ''ạ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Chuyển pha nội tâm – trần thuật & tình thái: quy chiếu Lergen
    bằng ''anh ta'' trong câu hỏi suy đoán ''biết đâu anh ta đã tìm ra giải pháp chăng…?'';
    giữ ''Tanya''/''cô'' và ''vẻ điềm tĩnh giả tạo'' ở câu trần thuật."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái rào đón trong thoại: Lergen xưng ''Tôi'',
    gọi Tanya là ''cô''; giữ ''thăm dò ý cô'' và lời nhắc ''có lẽ cô hãy chuẩn bị
    tinh thần đi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ tên riêng ''Lergen'', đại từ tự quy chiếu
    ''mình''/''bản thân'' theo DEC-P01-001 và ý ''nhanh chóng điều chỉnh lại kỳ vọng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Phủ định tuyệt đối & câu hỏi nội tâm: giữ tình thái ''Chắc hẳn
    lại là tin xấu rồi'', phủ định ''chưa từng một lần bận tâm đến hoàn cảnh của Tanya'',
    quy chiếu ''cô'' và đại từ ''họ'' chỉ quân đội."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & phủ định nhận thức: giữ ''Lergen'', đại
    từ phản thân ''mình'' quy chiếu Lergen và cụm ''chẳng hề hay biết mình đang khơi
    dậy nỗi kinh hoàng nhường nào''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chỉ dẫn hành động trong thoại: Lergen xưng ''Tôi'',
    gọi Tanya là ''Cô''; giữ ý nhượng bộ ''vẫn thấy rất đắn đo'' và đề nghị ''Cô ghé
    tai lại đây''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & bình luận nội tâm: quy chiếu Lergen bằng
    ''anh'', giữ chi tiết tư thế ''gần như phải ngồi xổm xuống'', tình thái ''có lẽ
    hơi dễ gây dị nghị một chút'' và cái tặc lưỡi ''nhưng… thôi kệ vậy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ tên riêng ''Tanya'' và hành động ''lặng
    lẽ làm theo và nghiêng người lại gần hơn''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & thuật ngữ trong thoại: Lergen dùng ''Chúng
    tôi'' chỉ phía Bộ Tổng tham mưu, gọi Tanya là ''cô''; giữ tình thái ''có thể sẽ''
    và cụm ''nhiệm vụ ném bom thủ đô''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & địa danh trong câu hỏi: Tanya gọi Lergen là ''ngài'',
    kết câu bằng ''sao ạ?''; giữ ''một cuộc tấn công trực diện vào Londinium''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc chính xác cụm ''*đúng là*'' bằng dấu sao
    theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu điều kiện nội tâm: giữ đại từ ''chúng ta'', ''họ''
    (cấp trên), địa danh ''Moskva'' và câu điều kiện nhận định tình thế đã thay đổi
    kể từ đầu cuộc chiến."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & phủ định trong thoại: dịch ''Colonel'' khi
    Lergen gọi Tanya là ''Trung tá''; Lergen xưng ''tôi'' và giữ phủ định ''ý tôi
    không phải vậy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn lễ phép & địa danh: giữ dấu chấm lửng, kính ngữ ''ạ''
    và câu hỏi ''Lại là Moskva sao?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn pha trộn, thuật ngữ & đối lập mức độ: giữ ''lũ Cộng
    sản'', đại từ nội tâm ''mình'' theo DEC-P01-001, tên riêng ''Tanya'', ''Lergen''
    và nhận định đối lập ''ngay cả cái nhìn bi quan ấy vẫn còn là quá lạc quan'' (không
    thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & phủ định trong thoại: giữ ''Không, Trung tá Degurechaff.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật – nội tâm & chi tiết miêu tả: giữ ''Lergen'',
    ''Tanya'', đại từ ''mình'' theo DEC-P01-001, cụm ''người đàn ông này đang run
    rẩy'' và nhịp lặp nhấn mạnh ''Rất khẽ thôi nhưng rõ ràng là đang run rẩy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Câu thoại ngập ngừng: giữ dấu chấm lửng và chỉ định ''“Mục tiêu
    là… ở đây.”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận ngắn: giữ kính ngữ trong câu hỏi ''“Ở đây ạ?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, xưng hô & thuật ngữ: quy chiếu Lergen bằng
    ''Anh''; trong thoại giữ ''Tôi''/''chúng tôi'', ''cô'', câu hỏi tu từ ''Ngoài
    chỗ này ra thì còn ở đâu được nữa?'', cụm ''Berun. Đế đô Berun.'' và ''một đợt
    tập kích ban đêm vào Bộ Tư lệnh Tối cao''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Thán từ sững sờ: giữ dấu chấm lửng và câu hỏi ''“…Hả?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ xử lý dữ liệu: giữ tình thái ''Có vẻ như'' và hình ảnh ''khi
    con người nạp dữ liệu không thể tính toán nổi vào đầu, họ sẽ đứng hình''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Chuyển pha điểm nhìn & phủ định: giữ ''Tanya'' ở câu đầu, đại
    từ tự quy chiếu ''mình'' theo DEC-P01-001 ở câu cuối và phủ định ''mình không
    phản đối chuyện đó''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & thuật ngữ quân sự: giữ ''quân nhân chuyên nghiệp trong
    Lục quân Đế quốc'', ''Trung tá Tanya von Degurechaff'', ''một tiểu đoàn pháp sư
    trên không'' và ''đợt tập kích ném bom hoàn hảo''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Câu chuyển ý cảm thán: giữ câu ngắn ''Dù nói là vậy!''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc chính xác toàn bộ câu cảm thán ''*Berun
    ư?!*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi cảm thán nội tâm: giữ ''Một mệnh lệnh ném bom Berun ư?!''
    không đánh dấu nghiêng theo đúng nguồn."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm – trần thuật: giữ đại từ ''mình'' theo DEC-P01-001
    ở câu đầu, tên riêng ''Tanya'' ở câu sau và mức độ ''gần như là một tiếng hét''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại lắp bắp & thuật ngữ: giữ nét lắp bắp ''Nh-nhưng'',
    thuật ngữ ''đế đô'' và dấu câu ''…?!''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & quan hệ nhượng bộ: giữ đại từ ''cô'' quy
    chiếu Tanya, tên riêng ''Lergen'', chi tiết tư thế ''Vẫn đang ngồi xổm nhưng tránh
    né ánh mắt cô'' và phủ định mức độ ''cũng chẳng mấy bình tĩnh''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Phân biệt đại từ ngôi thứ nhất số nhiều & thuật ngữ: quy chiếu
    Lergen bằng ''anh'' ở phần dẫn; trong thoại phân biệt ''Chúng ta'' (quân đội nói
    chung cần thức tỉnh đám chính khách) với ''Chúng tôi'' (Bộ Tổng tham mưu giao
    việc cho ''cô''); giữ phủ định ''không yêu cầu cô thực sự thả bom xuống đầu họ
    đâu'', ''Bộ Tổng tham mưu'' và ''cuộc diễn tập nhằm gia tăng sức ép''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & nhượng bộ nội tâm: giữ đại từ ''Anh'' chỉ
    Lergen, ''họ'' chỉ Bộ Tổng tham mưu, dấu chấm lửng trước ''kỳ vọng'' và mệnh đề
    nhượng bộ ''cho dù họ có cố ngụy biện rằng đó chỉ là một cuộc diễn tập đi chăng
    nữa, thì sức thuyết phục của cái cớ ấy cũng có giới hạn thôi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định tuyệt đối: giữ ''thưa Đại tá'',
    ''Ngài'', ''chúng tôi'' (đơn vị của Tanya), ''Tanya'' ở phần dẫn; giữ ''quân địch
    giả định'', ''cuộc đảo chính quân sự'', ''cuộc đảo chính thật sự'', ''Bộ Tư lệnh
    Tối cao'' và phủ định tuyệt đối ''tuyệt đối không đời nào có thể nhắm mục tiêu
    vào Bộ Tư lệnh Tối cao được…'' (không thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Giả định tương đồng trong thoại: giữ ''thủ đô của Khối Thịnh vượng
    chung'', đại từ ''chúng ta'' và lý giải ''để cả bên tấn công lẫn bên phòng thủ
    đều phải làm thật nghiêm túc''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận trong thoại: giữ đại từ ''chúng ta'', cụm ''gây
    ra một sự hiểu lầm'' và kính ngữ ''sao ạ?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & kịch bản ngụy tạo: Lergen dùng ''Chúng tôi''/''chúng
    tôi'' chỉ Bộ Tổng tham mưu; giữ ''Bộ Tổng tham mưu'', ''lưới phòng không của thủ
    đô còn lâu mới kín kẽ'', ''cuộc diễn tập'' và lý do hợp thức hóa ''do sai sót
    trong khâu truyền đạt thông tin nên còi báo động mới rú lên''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ nội tâm & câu hỏi hoài nghi: giữ ''câu chuyện bình phong
    khá hợp lý'', đại từ ''họ'', cụm ẩn dụ mỉa mai ''màn hài kịch xen giữa của chúng
    ta'' và câu hỏi ''Nhưng liệu Bộ Tư lệnh Tối cao có thực sự mắc lừa không đây?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm ngắn: giữ ''Chuyện này nghe cứ như một trò điên
    rồ vậy.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & hệ quả pháp lý quân sự: giữ ''đơn vị đảo chính'',
    đại từ ''chúng ta'' và hệ quả ''Chỉ cần sẩy chân một bước thôi là chúng ta sẽ
    phải ra tòa án quân sự với tội danh phản quốc ngay''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & phủ định nhượng bộ: giữ tên riêng ''Tanya'',
    phủ định ''không thể gật đầu đồng ý với chuyện này'' và mệnh đề nhượng bộ ''kể
    cả là để tỏ ra lịch sự xã giao đi chăng nữa''."]'
