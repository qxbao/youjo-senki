segment_id_end: YS-LN09/Text/chapter002.xhtml/p000061
choices:
- segment_id: YS-LN09/Text/chapter002.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại, phủ định & thuật ngữ: Tanya xưng ''Tôi''
    khi nói chuyện với Serebryakov; giữ phủ định nhấn mạnh ''không tài nào tin nổi''
    và thuật ngữ ''hậu phương''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đại từ & thuật ngữ: giữ đại từ ''Chúng ta''
    cho đơn vị của Tanya và tự quy chiếu ''mình'' theo DEC-P01-001; giữ ''lũ Cộng
    sản'', ''mũi lồi'', ''tuyến đầu xa xôi nhất'', ''sự đứt gãy thông tin'' và liên
    tưởng ''chàng Urashima Taro''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại, câu hỏi & thuật ngữ: Tanya xưng ''tôi'' (kết
    hợp ''thấy mình'' tự nhiên khi tự cảm nhận), gọi Serebryakov là ''Cô''; giữ ''tiền
    tuyến'', ''hậu phương'', cấu trúc câu hỏi lựa chọn ''Là... hay...?'' và câu hỏi
    mở ''Cô nghĩ sao?''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn & dấu câu: giữ chuỗi dấu chấm lửng và tiếng cười gượng
    ''“…À… ha ha ha ha.”'' của Serebryakov."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi tu từ: giữ ''Lục quân Đế quốc'',
    ''miền đông'', ''mặt trận phía đông'', đại từ ''chúng ta'' và ''tôi'' trong lời
    thoại của Tanya, cùng hai câu hỏi tu từ mỉa mai."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, tình thái & thuật ngữ: giữ tình thái ''Chắc
    chắn'', tự quy chiếu ''mình'' (''viên sĩ quan phụ tá đang nhăn mặt khổ sở của
    mình''), ''Chế độ kiểm duyệt'' và ''phiên bản sự kiện đã được chính thức phê chuẩn''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & thuật ngữ: giữ đại từ ''chúng ta'', ''Tôi''
    trong lời thoại của Tanya; giữ ''mấy vị kiểm duyệt viên'', tình thái gợi ý ''Hay
    là... nhỉ'' và phủ định ''chẳng ngại''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện phủ định: giữ cấu trúc điều kiện ''Nếu họ không
    bắt đầu nhìn thẳng vào thực tế thì sẽ chỉ toàn chuốc lấy rắc rối mà thôi''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, phủ định & thuật ngữ: giữ tên riêng ''Tanya'',
    cấu trúc phủ định ''chẳng cần ai phải nhắc mới biết'', ''báo chí thời chiến''
    và ''những luận điệu tuyên truyền''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: Tanya tự quy chiếu bằng ''mình''
    theo DEC-P01-001; giữ ''các kiểm duyệt viên'' và quan hệ nhượng bộ ''Dù đã khá
    lâu rồi... mình tin là...''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & tình thái: giữ đại từ tự quy chiếu ''Mình'',
    thành ngữ ''đọc ra ẩn ý giữa những dòng chữ'' và tình thái ''lẽ ra phải tự khắc
    hiển hiện rõ ràng''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & phủ định: giữ câu ngắn chuyển ý phủ định ''Chỉ
    có điều sự tình lại chẳng phải vậy.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế & thuật ngữ: giữ cấu trúc giả định ''Giá
    như đó chỉ là... thì dù gây khó chịu nhưng vẫn còn nằm trong mức chịu đựng được''
    cùng các khái niệm ''lương tâm và trí tuệ của mỗi cá nhân'', ''Quyền tự do tư
    tưởng''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Nội tâm ngắn: giữ câu khẳng định ngắn gọn ''Chuyện đó thì hoàn
    toàn ổn thôi.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, giả định & phủ định: bọc chính xác cụm ''*Nếu
    chỉ dừng lại ở đó*'' bằng dấu sao theo DEC-P01-002; giữ vế kết quả giả định phủ
    định ''thì đã chẳng có vấn đề gì cả''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: giữ ''bản báo cáo từ sở chỉ huy'',
    ''chiến tích của Đế quốc'', ''những lời nửa thật nửa giả'' và đại từ tự quy chiếu
    ''mình''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, xưng hô trong thoại & cấu trúc lựa chọn: tự
    quy chiếu ''mình'' trong lời kể nội tâm; trong lời thoại với ''người lính cần
    vụ đang trực'', Tanya xưng ''tôi'', gọi ''cậu'' và giữ cấu trúc lựa chọn ''Một
    là... hai là...''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, phủ định & thuật ngữ: giữ phủ định ''sẽ
    chẳng có bữa ăn thịnh soạn nào được dọn ra cả'', quy chiếu ''Tanya'' và đại từ
    ''cô'' trong trần thuật, tình thái suy đoán ''có lẽ'' và thuật ngữ ''hậu phương''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & câu hỏi đuôi: giữ cách gọi ''Trung úy'',
    thuật ngữ ''tuyên truyền'' và câu hỏi xác nhận ''phải không?''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cấp dưới: giữ sắc thái ngập ngừng lễ phép ''“À ừm,
    vâng ạ.”'' của Serebryakov."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tình thái ''xem chừng'', cụm ''đám
    người làm công tác tuyên truyền'' và nhận định ''hết thuốc chữa''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: giữ phủ định ''chẳng phải là
    một ý tồi'', quan hệ đối lập ''Nhưng'', thuật ngữ ''tiền tuyến'' và tình thái
    ''hầu như chắc chắn''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ tiếng thở dài trong ngoặc kép, tên riêng
    ''Tanya'' và đại từ ''cô''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya xưng ''tôi'' và gọi Serebryakov là
    ''cô''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Serebryakov đáp lễ phép ''Không
    đâu ạ'', giữ ''tiền tuyến và hậu phương'', tự xưng ''Tôi'' và gọi Tanya là ''Trung
    tá ạ''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & phủ định: giữ ''viên sĩ quan phụ tá của
    Tanya'', đại từ ''cô nàng'' chỉ Serebryakov và vế đối lập phủ định ''nhưng không
    phải ai cũng được như vậy''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & sắc thái từ vựng: giữ ''Thuộc cấp của Tanya'',
    cụm khẩu ngữ ''đám cuồng chiến tranh'' và câu bỏ lửng với tình thái ''Có lẽ chính
    vì thế mà…''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, xưng hô, quân hàm & thuật ngữ: quy chiếu Tanya
    bằng ''cô'' ở phần dẫn; trong thoại, Tanya xưng ''tôi'', gọi Serebryakov là ''cô''
    và ''Trung úy ạ'', giữ giả định ''Nếu ai cũng... thì...'' và chỉ thị ''quán triệt
    kỹ lưỡng cho tất cả mọi người trong Kampfgruppe trước khi họ đi nghỉ phép''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & giọng thoại cấp dưới: giữ câu đáp mệnh lệnh chuẩn mực
    ''“Rõ, thưa Trung tá.”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, tình thái & thuật ngữ: giữ tên riêng ''Tanya'',
    đại từ ''cô'', câu đáp ngắn ''—“Tốt”—'', tình thái suy đoán ''Hẳn'' và thuật ngữ
    ''bản quốc''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ đại từ tự quy chiếu ''Mình'' theo DEC-P01-001."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đại từ trong thoại: giữ tình thái suy đoán ''Nghe
    chừng'' và đại từ ''Chúng ta'' trong lời thúc giục xuất phát của Tanya."]'
