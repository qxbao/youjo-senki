- segment_id: YS-LN09/Text/chapter020.xhtml/p000240
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc điều kiện giả định ('Nếu đằng nào họ cũng bị bắt...,
    thì thà... còn hơn') và đại từ 'họ' chỉ binh lính.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000241
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'hố cá nhân' (foxhole), 'củng cố trận địa' (building up
    their position); chủ thể 'đám lính', 'Meybert' ('anh').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000242
  kind: terminology_and_voice
  value: locked=Meybert gọi 'Trung úy Tospan', xưng 'tôi - chúng ta'; giữ thuật ngữ
    'Kampfgruppe', nhấn mạnh Markdown '*béton*', và phủ định tình thái ('Chắc chúng
    ta không thể...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000243
  kind: terminology_and_voice
  value: 'locked=Tospan đáp lễ phép với cấp trên: ''Chúng tôi luôn sẵn sàng phục vụ
    anh.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000244
  kind: terminology_and_voice
  value: locked=Meybert xưng 'Tôi', gọi Tospan là 'cậu'; thuật ngữ 'đại đội bộ binh'
    (infantry company), 'các bao cát' (sandbags).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000245
  kind: terminology_and_voice
  value: 'locked=Tospan hỏi lại cấp trên với tiểu từ kính ngữ: ''Thế là đủ rồi sao
    ạ?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000246
  kind: terminology_and_voice
  value: locked=Meybert dùng 'chúng ta', giữ nguyên hàm ý so sánh hơn với hiện trạng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000247
  kind: terminology_and_voice
  value: locked=Đại từ 'cả hai người họ', 'họ'; giữ đúng phạm vi nhấn mạnh Markdown
    câu suy nghĩ nội tâm '*Thay vì cứ để mặc binh lính rảnh rỗi suốt cả ngày, sao
    không giao việc cho họ làm nhỉ?*'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000248
  kind: terminology_and_voice
  value: locked=Trần thuật gọi 'Tanya' là 'cô'; giữ giả định trái thực tế ở quá khứ
    ('Nếu Tanya có mặt..., hẳn cô đã...') và cụm 'đậm chất Keynes' (Keynesian).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000249
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'Đơn vị đồn trú tại cảng' (port garrison), 'bộ máy quan
    liêu Đế quốc' (imperial bureaucracy); giữ giọng mỉa mai của lời kể.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000250
  kind: terminology_and_voice
  value: locked=Chủ thể 'Meybert và Tospan' ('họ'), đối lập giữa 'vị chỉ huy cấp trên
    nằm ngoài khuôn mẫu thông thường' và 'bộ máy quan liêu có cơ cấu phân cấp theo
    chiều dọc'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000251
  kind: terminology_and_voice
  value: locked=Đại từ 'họ', giữ quan hệ thời gian khi triển khai kế hoạch của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000252
  kind: terminology_and_voice
  value: locked=Đại từ 'họ', giữ khẳng định bằng cấu trúc phủ định ('Chẳng còn cách
    nào khác để hiểu lầm chuyện đang diễn ra được').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000253
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'viên chức hành chính hải quân' (navy administrative official),
    gọi 'Đại úy Meybert', xưng hô 'tôi - các anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000254
  kind: terminology_and_voice
  value: 'locked=Câu hỏi ngắn xác nhận đối tượng: ''Cái này ấy hả?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000255
  kind: terminology_and_voice
  value: 'locked=Câu đáp xác nhận: ''Đúng, cái đó đấy.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000256
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown câu độc thoại nội tâm '*Ai nhìn vào mà chẳng
    biết ngay, sao ông ta lại phải mất công hỏi làm gì nhỉ?*'; trần thuật gọi Meybert
    là 'Anh', gọi viên chức là 'ông ta' / 'người đàn ông nọ', thuật ngữ 'củng cố trận
    địa'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000257
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'vị quan quản hạt mặc quân phục' (uniformed prefect), 'viên
    sĩ quan hành chính hải quân' (navy administrative officer); giữ phủ định ('Meybert
    chẳng hiểu vấn đề nằm ở đâu').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000258
  kind: terminology_and_voice
  value: 'locked=Meybert nói lịch sự với viên sĩ quan hành chính: ''thưa ngài ...
    sao ạ?''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000259
  kind: terminology_and_voice
  value: locked=Viên sĩ quan hành chính gọi Meybert là 'Đại úy, anh', khẳng định mức
    độ nghiêm trọng của vấn đề.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000260
  kind: terminology_and_voice
  value: locked=Meybert xưng 'tôi', gọi 'thưa ngài / Ngài ... ạ', giữ phủ định ('thực
    sự không hiểu đó là chuyện gì').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000261
  kind: terminology_and_voice
  value: locked=Viên sĩ quan hành chính gọi Meybert là 'Anh', lẩm bẩm 'Cái tay này',
    trần thuật gọi viên sĩ quan là 'ông ta'; thuật ngữ 'cuốn sổ nhỏ' (booklet), 'sổ
    quy chế' (rule book), 'công trình phòng thủ' (defensive facilities), 'nộp đơn
    xin phép bằng văn bản'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000262
  kind: terminology_and_voice
  value: locked=Meybert xưng 'Tôi - mình', giữ phủ định dè dặt ('Tôi không nhớ là
    mình đã từng nhận được cuốn sổ nhỏ đó').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000263
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'Bộ Tổng tham mưu' (General Staff), 'sai sót hành chính'
    (administrative error), 'viên sĩ quan hành chính'; xưng hô 'chúng tôi - các anh'
    và giữ nguyên cấu trúc phủ định kép về việc phớt lờ quy định.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000264
  kind: terminology_and_voice
  value: locked=Meybert gọi 'ngài', xưng 'chúng tôi ... ạ', giữ hai câu hỏi liên tiếp
    về việc xin phép và báo cáo bổ sung sau.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000265
  kind: terminology_and_voice
  value: locked=Giữ hai câu phủ định đầu ('Đây không phải là chiến trường. Chúng ta
    không ở trong hoàn cảnh đòi hỏi phải làm trái quy định.'); xưng hô 'Đại úy, tôi
    - anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000266
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'cuốn sổ quy chế' (rule book), 'viên sĩ quan hành chính
    hải quân', đại từ 'ông ta' và chủ thể 'Meybert'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000267
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown '*Phải rồi, đây là đơn vị đồn trú của hải quân
    mà.*'; giữ song song sự hợp lý của phía hải quân và thực tế phủ định rằng Meybert
    chưa từng được phổ biến về cuốn sổ quy chế.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000268
  kind: terminology_and_voice
  value: locked=Giữ tình thái 'có lẽ' (maybe) và góc nhìn 'xét về mặt hệ thống' (systematically).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000269
  kind: terminology_and_voice
  value: locked=Đại từ 'anh' (Meybert), giữ sắc thái bất an/không thỏa đáng ('khiến
    anh thấy cấn cấn trong lòng').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000270
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown toàn bộ câu hỏi nội tâm đầu đoạn; thuật ngữ
    'mặt trận phía đông' (eastern front), 'đám Cộng sản' (Communists); giữ giả định
    quá khứ ('đã bị đám Cộng sản tràn ngập mất rồi').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000271
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'bộ máy quan liêu', 'nhu yếu phẩm', 'mạng lưới tiếp vận'
    (supply network); giữ tình thái phỏng đoán ('có khi lại thực sự chọn vế sau').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000272
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown toàn câu '*Hóa ra tiền tuyến và hậu phương
    lại khác biệt đến mức này sao?*', thuật ngữ 'tiền tuyến và hậu phương'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000273
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'viên sĩ quan cấp dưới', mệnh lệnh trực tiếp 'Trung úy Tospan!
    Lại đây!'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000274
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'viên trung úy' (first lieutenant), đại từ 'anh ta' / 'mình',
    giữ phủ định tuyệt đối ('Đời nào Tospan đoán trước được...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000275
  kind: terminology_and_voice
  value: 'locked=Mệnh lệnh của Meybert: ''việc gia cố công sự'' (fortification work),
    ''bên bộ binh'' (the infantry), ''trạng thái chờ lệnh'' (on standby).'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000276
  kind: terminology_and_voice
  value: 'locked=Câu hỏi lễ phép của Tospan với cấp trên: ''Có chuyện gì xảy ra sao
    ạ?''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000277
  kind: terminology_and_voice
  value: locked=Câu đáp khẩu ngữ xác nhận 'Còn phải nói.' và đại từ trần thuật 'Anh'
    (Meybert).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000278
  kind: terminology_and_voice
  value: locked=Xưng 'chúng ta', giữ phủ định ('không được phép dựng bất kỳ công sự
    dã chiến nào nếu chưa có giấy tờ thủ tục').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000279
  kind: terminology_and_voice
  value: locked=Thán từ nghi vấn 'Hả?'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000280
  kind: terminology_and_voice
  value: locked=Meybert xưng 'Tôi - chúng ta', giữ phủ định và điều kiện ('không được
    phép thay đổi trận địa nếu không có giấy phép bằng văn bản').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000281
  kind: terminology_and_voice
  value: locked=Tospan dùng 'Chúng ta ... sao ạ?', giữ nét nghĩa ngạc nhiên trước
    quy định vô lý.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000282
  kind: terminology_and_voice
  value: 'locked=Meybert gọi cấp bậc ''Trung úy'': ''Đúng thế đấy, Trung úy ạ.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000283
  kind: terminology_and_voice
  value: locked=Tospan xưng 'chúng ta - Tôi', giữ câu hỏi có kính ngữ 'sao ạ?' và
    câu phủ định cảm thán 'Tôi không thể tin nổi chuyện đó.'
