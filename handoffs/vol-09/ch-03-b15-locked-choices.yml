unit_count: 45
segment_id_start: YS-LN09/Text/chapter010.xhtml/p000572
segment_id_end: YS-LN09/Text/chapter010.xhtml/p000616
choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000572
  kind: terminology_and_voice
  value: 'choices=["Trần thuật cơ chế hoạt động: giữ ''Khi tiếp cận mục tiêu, nó sẽ
    gài một quả thủy lôi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000573
  kind: terminology_and_voice
  value: 'choices=["Chi tiết lịch sử & số liệu: giữ ''quân cảng Alexandria'', ''một
    nhóm sáu người chia làm vẻn vẹn ba tổ'' và kết quả ''đã loại khỏi vòng chiến hai
    thiết giáp hạm''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000574
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tàu chiến: giữ ''tàu chở dầu lẫn tàu khu trục'' và sắc
    thái đánh giá ''Đáng ngạc nhiên là cũng có những lúc...''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000575
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kinh tế & nhấn mạnh Markdown: giữ ''hiệu quả chi phí''
    (P04-cost-performance) và chỉ bọc ''*maiali*'', ''*kaiten*'' bằng dấu sao theo
    DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000576
  kind: terminology_and_voice
  value: 'choices=["Đại từ độc thoại nội tâm & nhấn mạnh Markdown: giữ đại từ tự xưng
    ''mình'' theo DEC-P01-001, chỉ bọc ''*maiali*'' bằng dấu sao theo DEC-P01-002,
    và giữ phần chú thích trong ngoặc đơn ''(bởi chúng vừa an toàn thực sự lại vừa
    mang lại cảm giác an tâm)''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000577
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tương phản: chỉ bọc ''*kaiten*'' bằng dấu
    sao theo DEC-P01-002 và giữ nhận định ''sức công phá hủy diệt của *kaiten* rất
    hấp dẫn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000578
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn trong thoại: giữ ''“Bằng cách nào?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000579
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phương án kỹ thuật & dấu câu: giữ ''lắp thêm một ghế
    ngồi dạng cưỡi lên thân ngư lôi'', đối lập giữa ''phóng đi từ ống phóng ngư lôi''
    với ''loại tách rời'', và dấu chấm lửng trong ''nhưng… tôi chỉ là kẻ ngoại đạo
    mà thôi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000580
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi làm rõ trong thoại: giữ đại từ ''cô'' trong
    ''“Ý cô là sao?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000581
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nội dung thoái thác trách nhiệm chuyên môn: giữ đại
    từ ''Tôi'' – ''các vị'' và cụm ''các yếu tố tối quan trọng là tính khả thi và
    chi phí''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000582
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Nói cách khác, đó chỉ là một ý nghĩ thoáng qua.
    Về cơ bản, Tanya chỉ đang nêu bừa ý tưởng mà thôi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000583
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ đại từ ''nó'', thuật ngữ ''mìn nam
    châm'' và chi tiết ''bám chặt vào mục tiêu giữa lúc hỗn loạn khi va chạm''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000584
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & chức danh trần thuật: giữ đại từ ''Nó'', cụm ''sĩ
    quan cấp tá ngoài thực địa'' và ý ''công cụ hỗ trợ cho kiểu chiến thuật phi truyền
    thống đó như một phương án lựa chọn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000585
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & không thêm nhấn mạnh: giữ ''“Về ý tưởng của cô.”'' và
    không thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-147."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000586
  kind: terminology_and_voice
  value: 'choices=["Đáp lời cấp trên trong thoại: giữ ''“Vâng, thưa ngài.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000587
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ câu hỏi: giữ đại từ ''cô'' và thuật ngữ ''ngư
    lôi do người dẫn đường''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000588
  kind: terminology_and_voice
  value: 'choices=["So sánh khí tài & cơ chế thoát hiểm trong thoại: giữ so sánh ''không
    khác mẫu V-1 là mấy'' và cơ chế ''Một khi quả ngư lôi đã được chỉnh đúng hướng
    lao tới mục tiêu, tổ lái chỉ việc thoát ra ngoài.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000589
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trần thuật nhận thức: chỉ bọc ''*Ồồồ.*'',
    ''*maiali*'' và ''*kaiten*'' bằng dấu sao theo DEC-P01-002; giữ phần trần thuật
    còn lại ngoài dấu sao."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000590
  kind: terminology_and_voice
  value: 'choices=["Thoại mở rộng ứng dụng: giữ đại từ ''Chúng ta'' – ''tôi'', ý dùng
    vào việc khác ngoài tấn công tàu chiến và đề xuất dùng ''các ngư lôi cỡ nhỏ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000591
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi lặp lại đầy thắc mắc trong thoại: giữ cấu trúc câu hỏi
    nghi vấn về việc dùng ''ngư lôi cỡ nhỏ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000592
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Giọng nói đầy bối rối kia nêu lên một thắc mắc
    hết sức tự nhiên.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000593
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & câu bỏ lửng: giữ đại từ ''nó'', hình ảnh ''vẻ mặt
    đầy dấu chấm hỏi'' và dấu gạch ngang mở rộng trong ''nhưng chuyện này đâu phải
    là—thì đấy.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000594
  kind: terminology_and_voice
  value: 'choices=["Phủ định trần thuật: giữ ''Nó không nghĩ mình đang nói điều gì
    kỳ lạ đến thế.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000595
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tác chiến đặc nhiệm trong thoại: giữ ''các nhiệm vụ
    xâm nhập và phá hủy cơ sở hạ tầng cảng'', ''dùng mìn nam châm để tàn phá tàu địch
    khi chúng đang neo đậu'' và hai lựa chọn rút quân (''để tổ lái bị bắt làm tù binh
    hay bố trí tàu ngầm đón họ về'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000596
  kind: terminology_and_voice
  value: 'choices=["Phản ứng bác bỏ trong thoại: giữ câu hỏi ''“Ngay trước mũi quân
    địch ư?”'' và nhận định ''Thế thì chẳng khác nào tự sát. Mấy thứ vũ khí tự sát
    này sẽ gây ra quá nhiều tổn thất.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000597
  kind: terminology_and_voice
  value: 'choices=["Phủ định & nhượng bộ trong trần thuật: giữ ''Tanya đâu có bảo
    toàn quân đều phải sử dụng chúng'' và ''khác rất xa so với những phương thức tấn
    công chính thống''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000598
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trong thoại: giữ ''sử dụng chúng làm tàu lặn trong các
    chiến dịch đặc biệt thuần túy'' và lập luận ''hiệu quả chi phí''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000599
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trong thoại: giữ ''“Cô có ước tính cụ thể nào
    không?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000600
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, phủ định & so sánh quy mô trong thoại: giữ dấu chấm lửng
    mở đầu, ý ''chưa được thử nghiệm trong thực chiến nên tôi chưa thể nói chắc''
    và so sánh giữa ''tàu ngầm mẹ'' với ''tổ lái ngư lôi cỡ nhỏ sẽ chỉ do một đơn
    vị cực kỳ tinh gọn vận hành''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000601
  kind: terminology_and_voice
  value: 'choices=["Trần thuật dẫn chứng lịch sử: giữ ''Quân đội Ý yếu kém hơn mà
    còn loại khỏi vòng chiến hai thiết giáp hạm chỉ với sáu người.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000602
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ nhượng bộ: giữ ''hiệu quả chi phí cao hơn
    thế'' và mệnh đề sau dấu gạch ngang ''dù cả sáu người đều bị bắt làm tù binh,
    nhưng không một ai thiệt mạng''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000603
  kind: terminology_and_voice
  value: 'choices=["Thoại đánh giá & không thêm nhấn mạnh: giữ ''tấn công tàu thuyền
    đang neo đậu. Thương vong sẽ ở mức tối thiểu.'' và không thêm nhấn mạnh Markdown
    tại vị trí thẻ neo trang page-148."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000604
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ ''kỳ vọng mức thương vong bằng không'',
    thuật ngữ ''các pháp sư hải quân đánh bộ'', đại từ khái quát ''bạn'' và ý ''tự
    mình cao chạy xa bay khỏi đó thay vì trở thành tù binh chiến tranh''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000605
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép khẳng định tính khả thi: giữ ''Chuyện đó chẳng phải
    là không tưởng.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000606
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trong thoại: giữ ''“Cô nói nghiêm túc đấy à?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000607
  kind: terminology_and_voice
  value: 'choices=["Bình luận trần thuật: giữ ''vũ khí tự sát vốn là sản phẩm của
    sự điên rồ'' và hình ảnh ''trong cơn giãy chết của một quốc gia đã bị sự điên
    cuồng của chiến tranh dồn vào chân tường''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000608
  kind: terminology_and_voice
  value: 'choices=["Phân biệt khái niệm & đối lập quan điểm: giữ ''một quốc gia nọ
    tại Viễn Đông'', sự phân biệt giữa ''mang quyết tâm sẵn sàng hy sinh'' với ''biết
    chắc chắn không chút nghi ngờ rằng mình sẽ phải chết'', và độ vênh giữa chuẩn
    mực tại Đế quốc với nhận thức của Tanya."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000609
  kind: terminology_and_voice
  value: 'choices=["Thoại khẳng định có điều kiện: giữ ''“Nếu chúng ta có thể sử dụng
    chúng thì dĩ nhiên rồi. Đó chỉ là một ý tưởng thôi, nhưng tôi nghĩ nó rất khả
    quan.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000610
  kind: terminology_and_voice
  value: 'choices=["Đoạn chuyển có dấu gạch ngang: giữ ''Nhưng—''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000611
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ định nghĩa về tình huống cực đoan
    của chiến tranh và thuật ngữ ''chiến tranh tổng lực''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000612
  kind: terminology_and_voice
  value: 'choices=["Liên hệ lịch sử & ẩn dụ trần thuật: giữ ''quy mạng sống con người
    thành những con số thuần túy'', dẫn chứng ''trước Thế chiến thứ nhất, từng có
    một vị tướng người Anh... qua những bài học từ cuộc Chiến tranh Nga – Nhật'' và
    ẩn dụ ''người thầy mang tên kinh nghiệm—người luôn đòi một cái giá quá đắt''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000613
  kind: terminology_and_voice
  value: 'choices=["Quan hệ tương phản tỷ lệ thuận: giữ ''Ngược lại, một người càng
    biết suy xét hợp lý thì lại càng có xu hướng suy nghĩ về tương lai dưới góc nhìn
    của những quan niệm cố hữu và lẽ thường.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000614
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn ngoại quan về Tanya: giữ ''Nói cách khác, Tanya trông
    chẳng khác nào một con quái vật hành động theo một hệ logic và những nguyên tắc
    hành xử hoàn toàn không thể lý giải nổi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000615
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & sự thực khách quan: giữ dấu chấm lửng mở đầu và ý ''thực
    chất Tanya chỉ đơn thuần là nắm được một lượng kiến thức lịch sử tàm tạm mà thôi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000616
  kind: terminology_and_voice
  value: 'choices=["Thoại đính chính câu hỏi cuối lô: giữ ''“Không, ý tôi là, liệu
    một trong hai phương án cải tiến ngư lôi đó có thực sự khả thi để triển khai hay
    không?”''."]'
