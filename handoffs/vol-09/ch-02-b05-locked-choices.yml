choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: bọc chính xác câu độc thoại
    chung đầu đoạn ''*Chúng ta không tài nào điều thêm ai đi được nữa.*'' bằng dấu
    sao theo DEC-P01-002; giữ hình ảnh ''dường như đang dâng lên tới tận cổ họng của
    tất cả mọi người có mặt''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & chức danh: giữ ''trước mắt Lergen'', ''người chủ trì
    cuộc họp'' và nét biểu cảm ''mặt tỉnh bơ khơi mào chủ đề đó''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Đại từ, địa danh & tình thái nhấn mạnh: giữ xưng hô ''tôi'' –
    ''chúng ta'' của Rudersdorf, ''miền tây'' và sắc thái khẳng định ''thực sự cần
    cử người sang miền tây''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc tăng tiến: giữ ''Vị tướng'', ''trọng tâm
    cuộc thảo luận của họ'' và cấu trúc ''ngay cả những sĩ quan tham mưu dè dặt nhất
    cũng cảm thấy buộc phải lên tiếng phản đối''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Chuỗi hành động: giữ nhịp miêu tả ''Viên sĩ quan ngồi cạnh Lergen
    tái mặt đi rồi nhanh chóng giơ thẳng tay lên xin phép phát biểu.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, địa danh & phủ định trong thoại: giữ ''Thưa Tướng quân,
    với tất cả sự kính trọng'', đại từ ''tôi'' và phủ định dè dặt ''tôi không nghĩ
    nhân sự ở miền tây đang có bất kỳ vấn đề lớn nào…''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại áp đặt: giữ nhịp câu ngắn dứt khoát ''“Tình hình đó
    cần phải được cải thiện hơn nữa. Chúng ta sẽ cử người đi. Câu hỏi duy nhất còn
    lại là cử ai.”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & ẩn dụ: bọc chính xác ý định ngầm
    ''*Chúng tôi không muốn cử bất kỳ ai đi cả*'' bằng dấu sao theo DEC-P01-002 (dùng
    ''Chúng tôi'' phân biệt nhóm tham mưu với Rudersdorf); giữ ''lời đáp thẳng thừng
    của Rudersdorf đánh bạt hoàn toàn''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc chính xác câu hỏi nội
    tâm ''*Vậy là chúng ta không còn lựa chọn nào khác sao?*'' bằng dấu sao theo DEC-P01-002;
    giữ ''Lergen chuẩn bị tinh thần''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown hai nhịp & thuật ngữ: giữ đúng phạm vi hai
    cụm in nghiêng tách rời bởi chữ thường ''*Chúng ta* buộc *phải cử người đi. Đó
    là điều cấp trên muốn.*'' khớp sát cấu trúc nhấn mạnh của nguồn; giữ ''cấp trên''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ ''ý chí của Bộ Tổng tham mưu'', ẩn
    dụ ''bãi lầy ngoài miền tây là một cuộc chiến tiêu hao'' và nhận định ''Chỉ một
    sự cải thiện nhỏ thôi cũng có thể mang tính quyết định về lâu về dài''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: giữ đại từ ''ông'' cho Rudersdorf và phản ứng
    ''tất cả bọn họ đều rùng mình''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại mệnh lệnh: giữ ''mặt trận phía tây'',
    ''sự quan tâm thỏa đáng'' và câu hỏi chốt ''Rõ cả chứ?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điểm nhìn & cấu trúc nhượng bộ: giữ phân biệt đại từ ''ông''
    (Rudersdorf) và ''anh'' (Lergen), ''các sĩ quan tham mưu'', cùng cấu trúc ''Dù
    Lergen vừa vặn đủ sức đón nhận ánh nhìn dữ dội của vị tướng, anh vẫn muốn tránh
    phải trả lời hơn''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhịp chuyển ý: giữ ''Nhưng dù muốn hay không, Lergen
    cũng là một sĩ quan tham mưu.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Đại từ & hành động: giữ đại từ ''Anh'' cho Lergen và ''nhanh chóng
    đề xuất một ứng viên''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, chức danh & đại từ: giữ ''Tướng Rosenberg'', đại từ
    ''ông ấy'', ''nghị sĩ quốc hội'', ''mối quan hệ giữa chính phủ với quân đội''
    và tước vị ''nam tước''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc tăng tiến: giữ ''quan chức quân chính tại
    Dacia'', ''Vị tướng cấp cao này'' (''Ông ta''), cấu trúc ''không chỉ có quan hệ
    tương đối tốt với hoàng gia mà còn hòa hợp khá ổn với cả chính phủ dân sự'' và
    ''bề dày kinh nghiệm chính trị vô cùng phong phú''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & giả định: giữ ''Cơ quan hành chính quân sự
    ở Dacia là mạch máu dầu mỏ của chúng ta'' và phủ định đi kèm điều kiện giả định
    ''Tôi chẳng muốn nghĩ đến chuyện gì sẽ xảy ra nếu chúng ta điều ông ấy đi đâu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ ''Lựa chọn đầu tiên đã bị bác bỏ, Lergen
    liền nêu tiếp ứng viên thứ hai của mình.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & thuật ngữ: giữ ''Trung tá Schulz'', đại từ
    ngang hàng ''anh ấy'', đối lập giữa ''nhiệm vụ chiến đấu ở tuyến đầu'' (''vẫn
    còn bỏ ngỏ'') với ''xử lý các công việc trọng yếu ở hậu phương lại vô cùng xuất
    sắc'', và ''mảng công tác quân dân''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Đại từ, giọng thoại & địa danh: giữ tình thái cầu khiến nuối tiếc
    ''Giá mà chúng ta có được cậu ta'', đại từ ''cậu ta'' khi Rudersdorf gọi sĩ quan
    cấp tá, cách gọi thân mật pha cằn nhằn ''lão ngốc Zettour kia'' và địa danh ''miền
    đông''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi ngắn: giữ ''“Anh ấy đã bị rút đi rồi sao, thưa
    Tướng quân?”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Sắc thái biểu cảm: giữ ''Rudersdorf cất tiếng ừ trong cổ họng
    cùng một cái gật đầu chua chát.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: giữ đại từ ''cậu ta'', ''phiên họp chung tiếp
    theo về phân công nhân sự'', ''cố vấn cho Hội đồng Tự trị'', ''kỹ năng điều phối'',
    ''góc độ hoạch định sư đoàn'' và ''một sĩ quan tham mưu vừa biết điều lại vừa
    giỏi giang''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ phủ định ''lựa chọn thứ hai của Lergen
    cũng không khả thi'' và tình thái ''lẽ ra Bộ Tổng tham mưu phải có khả năng đơn
    phương điều động các nhân sự cấp trung chứ''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & cách diễn đạt khẩu ngữ: giữ ''Nếu cần thiết, họ vẫn
    có lựa chọn nẫng tay trên người đó.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi đề xuất: giữ sắc thái dò hỏi lễ phép ''“Hay là chúng ta
    chuyển hướng điều động Schulz khỏi chỗ đó nhé ạ?”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ lời bác bỏ dứt khoát ''“Không. Chúng
    ta không thể để kế hoạch tổ chức sư đoàn tình nguyện thất bại được.”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Địa danh, thuật ngữ & cấu trúc tương phản: giữ đối chiếu ưu tiên
    giữa ''miền đông'' và ''miền tây'', cùng sự tương phản giữa ''rất nhiều sĩ quan
    tham mưu có năng lực'' với ''hầu như chẳng có mấy ai có thể cậy nhờ vào những
    công việc nằm ngoài mảng tác chiến''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phân biệt khái niệm: bọc chính xác thán từ
    ''*Ồ.*'' bằng dấu sao theo DEC-P01-002; giữ ''một chuyên gia đường sắt xuất chúng
    nọ'', ''Kỹ năng điều phối tuyệt vời'' và cặp phạm trù ''về cả tính cách lẫn tư
    cách''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & đại từ: giữ ''Trung tá Uger'', đại từ ''anh ấy'' và
    đánh giá ''Tôi nghĩ anh ấy đáp ứng được yêu cầu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & giả định trái thực tế: giữ đại từ ''cậu ta'',
    nhận xét ''chưa đủ quyết liệt'' và giả định quá khứ ''Giá mà cậu ta là chuẩn tướng
    hoặc có kinh nghiệm chỉ huy một trung đoàn ngoài tiền tuyến thì có lẽ chuyện đã
    khác…''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc chính xác câu độc thoại
    ''*Lý lịch binh nghiệp cũng quan trọng cơ đấy, hửm?*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc rào đón: giữ sắc thái ''nếu chưa bàn đến những mặt khác
    thì lại sở hữu kinh nghiệm hoàn hảo cho công việc này''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & câu bỏ lửng: giữ xưng hô ''tôi'' – ''thưa
    Tướng quân'' (''ngài''), chi tiết tự trào ''Tôi có kinh nghiệm thực chiến, dù
    chỉ là trên giấy tờ'', phủ định ''Tôi cũng không phải là tướng'' và dấu gạch ngang
    ngắt lời cuối câu."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & phủ định: giữ ''phong thái đĩnh đạc phù hợp
    toát ra từ mình'', ''chiến tranh tổng lực'' và phép ẩn dụ tăng cấp của Rudersdorf
    ''Dỡ nhà mình ra làm củi đốt... đã là đủ ngu xuẩn rồi, nhưng chúng ta vẫn chưa
    túng quẫn đến mức phải đem đốt luôn cả tay chân của mình đâu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: giữ câu đáp ngắn gọn ''“Cảm ơn Tướng quân.”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: giữ xưng hô ''Tôi'' – ''anh'', gọi cấp bậc
    ''Đại tá ạ'' và câu hỏi thúc giục ''Anh còn nghĩ ra được ai khác nữa không?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quan hệ thời gian: giữ ''Trước cả khi kịp nửa đùa
    nửa thật xin tha, anh đã bị ra lệnh phải nêu tên đề xuất tiếp theo của mình.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ nội tâm & thuật ngữ: bọc chính xác
    câu nội tâm ''*Tới nước này thì chắc mình cứ thuần túy xét theo lý lịch binh nghiệp
    vậy.*'' bằng dấu sao theo DEC-P01-002 (dùng đại từ tự quy chiếu ''mình''); giữ
    ''đủ năng lực quán triệt đến cùng ý đồ của Bộ Tổng tham mưu…''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: bọc chính xác câu hỏi nội tâm ''*Ông
    ấy thì sao nhỉ?*'' bằng dấu sao theo DEC-P01-002 (dùng đại từ ''Ông ấy'' quy chiếu
    tới Tướng Romel ở đoạn kế tiếp)."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, phiên hiệu & cấu trúc điều kiện: giữ ''Tướng quân'',
    ''Tướng Romel'', đại từ ''ông ấy'', ''miền tây'', ''Bộ Tổng tham mưu'', phiên
    hiệu ''Quân đoàn Viễn chinh Lục địa Phía nam'' và mệnh đề điều kiện giả định ''Nếu
    chúng ta điều ông ấy sang miền tây... tôi nghĩ chúng ta có thể phổ biến cho ông
    ấy nắm rõ tình hình''."]'
