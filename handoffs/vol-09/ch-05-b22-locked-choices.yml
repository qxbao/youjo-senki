choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000775
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya dùng đại từ 'chúng
    ta' và câu giả định tương lai chính xác, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000776
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại xã giao của Calandro ('các vị', 'Chúng
    tôi') và thuật ngữ 'công tác phí' ('travel expenses') chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000777
  kind: terminology_and_voice
  value: Touch=polish_optional; rationale=Đại từ 'Tôi - ngài', thuật ngữ 'đại đội
    tinh tuyển', 'Kampfgruppe' và câu hỏi đuôi lịch sự chuẩn; có thể cân nhắc chỉnh
    nhẹ cụm mô tả sức ăn uống nếu muốn sát nghĩa đen hơn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000778
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba giữ đúng cấu trúc phủ định
    nhấn mạnh ('vẫn không hề nao núng lấy một chút').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000779
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Cấu trúc phủ định kép ('không hề có nguy cơ...
    hay phải...') và nhịp văn mượt mà.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000780
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya dùng đại từ 'mình'
    đúng chuẩn DEC-P01-001, truyền tải tốt thái độ cảnh giác thực dụng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000781
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại ẩn ý của Calandro giữ nguyên thuật ngữ
    'xăng có chỉ số octan cao' và cấu trúc điều kiện phủ định.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000782
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi lắp bắp ngắn của Tanya ('X-xăng ư?') tự
    nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000783
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Xưng hô của Calandro với Tanya ('Tôi - Trung tá
    / Cô') và cách gọi 'Đại tá Lergen' chính xác; bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000784
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya ('Mình') bảo toàn đúng
    sắc thái suy đoán ('có lẽ') và câu hỏi tự vấn về nguồn cung xăng có chỉ số octan
    cao của Ildoa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000785
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại ngoại giao của Tanya giữ chuẩn tên đơn
    vị 'Quân đoàn Viễn chinh Lục địa Phía nam' và dấu nháy đơn mang sắc thái mỉa mai
    ở '‘lòng tốt’ của các ngài'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000786
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp của Calandro giữ đúng xưng hô ('Trung tá',
    'Tôi - cô', 'chúng tôi') và thuật ngữ 'quốc gia trung lập'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000787
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật phân biệt rõ 'quốc gia trung lập' và
    'quốc gia tham chiến', giữ đúng giọng văn châm biếm khách quan.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000788
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya bảo toàn cả đại từ
    ngôi thứ nhất ('Mình') lẫn lối tự xưng ngôi thứ ba đặc trưng ('Tanya sẽ hạ cố
    tỏ ra khó chịu ít nhất là trong chốc lát').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000789
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại ngắn mang tính thăm dò của Tanya chính
    xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000790
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu khẳng định ngắn của Calandro gọn và đúng sắc
    thái.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000791
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Thán từ nghi vấn ngắn ('Hả?') khớp ngữ cảnh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000792
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Calandro diễn đạt rõ phép ẩn dụ con
    tàu chuẩn bị chìm và sự đối lập giữa giao dịch thương mại với nghĩa vụ đồng minh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000793
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật mô tả cử chỉ nhún vai của Calandro và
    cái nhìn chằm chằm của Tanya tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000794
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Cách dịch 'Sự trung lập nghiêm ngặt' và 'lối nói
    ngoại giao' chuẩn xác, giữ trọn chất thực dụng của Calandro.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000795
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Tanya ('Thưa Đại tá', 'tôi') giữ
    đúng cấu trúc giả định lịch sự kiểu ngoại giao và cụm 'quy chế trung lập của Ildoa'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000796
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật kết hợp lời thoại của Calandro mượt
    mà, giữ đúng nhịp ngắt câu.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000797
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu tiếp lời của Tanya khớp mạch hội thoại với
    p000796 và nhất quán thuật ngữ 'xăng có chỉ số octan cao'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000798
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Calandro chuẩn thuật ngữ 'cuộc không
    chiến ở mặt trận phía tây' và 'nhiên liệu hàng không'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000799
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi của Tanya ('một giọt dầu sánh ngang một
    giọt máu sao?') giàu nhịp điệu và sát nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000800
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại của Tanya giữ chuẩn địa danh 'Viễn Đông',
    'khẩu hiệu thời chiến', 'chiến lược tổng thể' và cấu trúc phản thực quá khứ ('lẽ
    ra nó dứt khoát phải được... mới phải').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000801
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật pha độc thoại gián tiếp tự do giữ trọn
    sự tương phản mỉa mai và câu hỏi tu từ ('Nghe có nực cười không cơ chứ?'); bỏ
    qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000802
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời chất vấn lịch sự nhưng sắc bén của Tanya ('Thưa
    Đại tá, xin thứ lỗi cho tôi nói thẳng...') rất tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000803
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya dùng thành ngữ 'thái
    độ gió chiều nào xoay chiều ấy' ('weathercock attitude') rất đắt và hợp giọng
    nhân vật.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000804
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya dùng đúng đại từ 'mình'
    và thuật ngữ quân sự 'trinh sát chiến đấu' ('recon-in-force').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000805
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thăm dò của Tanya phân biệt rõ 'chúng tôi'
    (Đế quốc) và 'các ngài' (Ildoa), giữ đúng câu hỏi tu từ ở cuối đoạn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000806
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp thoái thác khéo léo của Calandro ('đất
    nước cô', 'chúng tôi', 'Tôi') giữ nguyên sắc thái khiêm nhường ngoại giao.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000807
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Nhận xét nội tâm của Tanya về lối trả lời công
    thức của Calandro chính xác, súc tích.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000808
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya ('Mình') truyền tải
    chuẩn xác quyết định thu lưới để tránh lún sâu vào chính trị.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000809
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Cấu trúc phủ định kép ('chẳng phải là nhà ngoại
    giao mà cũng chẳng phải là chính trị gia') và thuật ngữ 'sĩ quan cấp tá' ('field
    officer') chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000810
  kind: terminology_and_voice
  value: 'Touch=preserve; rationale=Đoạn thoại kết hợp trần thuật dài bảo toàn chính
    xác mọi thuật ngữ canon/pending: ''Huy hiệu Xung kích Cánh Bạc'', ''trung tá'',
    ''con chó điên'', ''sĩ quan tham mưu'', ''Thập Nhị Hiệp Sĩ'', ''trường đại học
    quân sự'', ''luận văn tốt nghiệp''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000811
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật ngắn chuyển nhịp trước lời đề nghị
    đi dạo của Calandro mượt mà.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000812
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Chuẩn hóa chính xác cấp bậc xưng hô của Tanya thành
    'Trung tá' (khắc phục lỗi in sót chữ của bản tiếng Anh) và giữ giọng mời mọc lịch
    thiệp của Calandro.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000813
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu kết batch giữ chuẩn thuật ngữ 'chỉ huy tiền
    tuyến' ('frontline commander') và mô tả ánh nhìn sắc lạnh của Calandro tự nhiên.
