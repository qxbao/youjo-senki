choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô và kính ngữ của Tanya với cấp tướng: tôi / sao ạ'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=[''Giọng thoại khẳng định dứt khoát của Rudersdorf: Có đấy. Tình
    hình đã thay đổi tận gốc rễ rồi.'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm số nhiều chỉ phía Đế quốc: chúng ta'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn và đại từ quy chiếu Rudersdorf / phía Đế quốc: ông
    / họ'', ''Thuật ngữ và địa danh: Quân đoàn Viễn chinh Lục địa Phía nam / Ildoa
    / mối liên minh giữa Đế quốc và Ildoa / lục địa phía nam'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: các sĩ quan tham mưu / những nhân viên tham mưu đã
    khuất'', ''Đại từ nội tâm số nhiều và tình thái cảm thán: chúng ta / Cứ như thể
    chúng ta chưa có đủ chuyện đau đầu vậy!'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi xác nhận lịch sự của cấp dưới: binh lính Đế quốc bị từ
    chối cho phép tiến vào lãnh thổ Ildoa sao ạ?'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và xưng hô trong thoại của Rudersdorf: Họ (Ildoa) / quân
    ta / chúng ta / Tôi / Trung tá (gọi Tanya)'', ''Điểm nhìn trần thuật ngôi thứ
    ba gọi Rudersdorf: ông / của chính mình'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba: Tanya / Rudersdorf / Ildoa
    / Đế quốc'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=[''Nhận định đánh giá khách quan trong mạch suy nghĩ: Việc nổi cơn
    thịnh nộ là hoàn toàn chính đáng.'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật và thoại phẫn nộ của Rudersdorf: Hành động của Ildoa
    chỉ có thể được xếp vào loại thù địch / Thật tình… chuyện này nực cười hết sức!'',
    ''Không thêm nhấn mạnh Markdown ở vị trí thẻ neo trang (page-114).'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=[''Cách gọi Rudersdorf trong trần thuật: ông / vị tướng'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=[''Cách Tanya thưa gửi Rudersdorf: thưa Tướng quân'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm tự quy chiếu của Tanya (DEC-P01-001) và quy chiếu
    Rudersdorf: Mình / chúng ta / ông ấy'', ''Phủ định suy đoán: Mình không nghĩ ông
    ấy sẽ nổi giận đến mức liều lĩnh làm điều ngu ngốc như mở thêm một mặt trận nữa'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu: mình, chỉ huy của một đơn vị tác chiến'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm và quy chiếu đơn vị: Mình / mình / đơn vị mình
    / ông ấy'', ''Thuật ngữ và tên riêng: mệnh lệnh trinh sát / Liên bang / Ildoa'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba gọi Tanya: Tanya / chính cô'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm ngắn giữ nguyên độ mở: Chuyện gì sắp sửa xảy
    ra đây?'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm và điểm nhìn trần thuật ngôi thứ ba: Mệnh lệnh
    từ cấp trên lần này sẽ là gì đây? / Tanya / cấp trên của mình'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=[''Nhịp câu nội tâm căng thẳng: Đến thở thôi cũng thấy khó khăn.
    Tiếp theo sẽ có chuyện gì xảy ra đây?'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trong lời Rudersdorf: Chúng ta / vấn đề Ildoa'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba: ông / Tanya'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=[''Thán từ biểu thị sự ngỡ ngàng: Hả?'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=[''Sự đan xen giữa nội tâm ngôi thứ nhất và tự nhắc tên ở ngôi thứ
    ba sát nguyên tác: Tự mình nói ra / miệng Tanya'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=[''Quân hàm và tên trong câu hỏi nội tâm: Tướng von Rudersdorf'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Rudersdorf với Tanya: Trung tá'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô trong thoại của Tanya với Rudersdorf: Tôi / ngài'', ''Điểm
    nhìn trần thuật ngôi thứ ba: Tanya'', ''Thuật ngữ: chiến dịch nhắm vào Ildoa /
    mệnh lệnh tấn công đặc biệt / ra lệnh nhảy dù tập kích ngay lập tức'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu ở thời quá khứ hoàn thành: Mình vốn đã chuẩn
    bị sẵn tinh thần để lên đường rồi.'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và tên gọi: Mình / V-1 / lão cuồng tín Schugel'',
    ''Không thêm nhấn mạnh Markdown ở vị trí thẻ neo trang (page-115).'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm số nhiều chỉ người Đế quốc: ở Đế quốc này, chúng
    ta'', ''Nhấn mạnh Markdown khớp chính xác thẻ in nghiêng của nguồn (DEC-P01-002):
    *cần thiết*'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và thuật ngữ trong lời Rudersdorf: Tôi / Kampfgruppe Lergen
    / giai đoạn tái thiết và tái tổ chức / Tướng Zettour'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô và kính ngữ xin lỗi của Tanya: Tôi / ạ'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Rudersdorf với Tanya và phủ định bộ phận: tôi / cô
    / cũng không hoàn toàn trật lất đâu'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=[''Cách gọi nghi vấn lễ phép của Tanya: Thưa Tướng quân?'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và quy chiếu Rudersdorf: Mình / mình / ông
    ấy'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và thuật ngữ trong lời Rudersdorf: Tôi / Kampfgruppe Lergen
    / họ / đơn vị pháp sư nòng cốt'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba: Tanya'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và đại từ khái quát: Kampfgruppe / được phối thuộc
    hoặc tách ra / bạn / đội hình thông thường'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật và thuật ngữ: chính bản thân Tanya / ý tưởng
    về Kampfgruppe'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và tên cơ quan: Mỗi nhánh của Kampfgruppe / năng lực
    tác chiến độc lập / phân đội tác chiến độc lập / Tanya / Văn phòng Bộ Tổng tham
    mưu'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trần thuật ngôi thứ ba gọi Tanya: Cô'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Tanya với Rudersdorf: Tôi / ngài / ạ'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô và cách diễn đạt hình tượng trong lời Rudersdorf: Trung
    tá / tôi / cô / uốn lưng chiều theo tôi một phen đấy'']'
