- segment_id: YS-LN09/Text/chapter014.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=[''Tiêu đề chuyển cảnh in hoa: NGOÀI KHƠI BỜ BIỂN DAKAR, HẠM ĐỘI
