segment_id_end: YS-LN09/Text/chapter012.xhtml/p000031
choices:
- segment_id: YS-LN09/Text/chapter012.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=[''Mệnh đề giới hạn duy nhất & không thêm nhấn mạnh: giữ ý chỉ các
    vị đô đốc đã thấu hiểu tường tận tình hình ngoài khơi xa mới có thể đứng trên
    đất liền nhìn ra biển mà hạ lệnh, và không thêm nhấn mạnh Markdown tại vị trí
    thẻ neo trang page-155.'']'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Phủ định, dấu câu, đại từ & thuật ngữ: giữ ''Tổng hành dinh Bộ
    Tổng tham mưu chẳng biết chút gì về biển cả'', dấu chấm lửng sau ''nhưng…'', đại
    từ tự quy chiếu ''mình'' theo DEC-P01-001 và phủ định ''chiến thuật hải quân thậm
    chí còn chẳng được giảng dạy ở học viện quân sự''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, tình thái & thuật ngữ: giữ tên riêng ''Tanya'', cụm
    ''học viện và trường đại học quân sự'', giới hạn ''chỉ tính riêng trong phạm vi
    Đế quốc'', tình thái ''có lẽ vẫn công bằng khi nói rằng'' và đại từ trần thuật
    ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tình thái quá khứ: chỉ bọc ''*lẽ ra phải*''
    bằng dấu sao theo DEC-P01-002 và giữ ý chương trình học cấp tốc đáng lẽ phải truyền
    đạt mọi thứ mà quân đội cho rằng một quân nhân chuyên nghiệp cần biết."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & thuật ngữ: giữ đại từ ''mình'' theo DEC-P01-001,
    hai nguồn kiến thức hải chiến hạn hẹp (''chút ký ức sót lại của kiếp trước từng
    sống ở nước Nhật hiện đại hòa bình'' và ''chút ít kiến thức lượm lặt được trong
    các chiến dịch tác chiến liên hợp với Hải quân Đế quốc'')."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ trong độc thoại: giữ đại từ ''Mình'', phủ
    định ''chưa từng được đào tạo bài bản có hệ thống'' và thuật ngữ ''học thuyết
    hải quân''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thoại độc bạch, dấu câu & thuật ngữ: giữ các dấu chấm lửng (''“…Ngay
    cả'', ''nhiều hơn…'', ''Cái quái gì thế này…?''), đại từ ''mình'', các thuật ngữ
    ''chuyến khảo sát thực địa của bộ tham mưu'', ''sĩ quan tham mưu hay sĩ quan ma
    pháp'' và phủ định ''chẳng mang lại niềm vui vẻ gì cho cam''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Nhận định khái quát: giữ sự tương phản giữa ''điểm mạnh đáng giá''
    và ''có những lúc sở trường của bạn lại biến thành một lời nguyền. Chẳng hạn như
    ngay lúc này đây.''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi thoại độc bạch – trần thuật – nội tâm: giữ đại từ ''Mình''
    – ''mình'' trong câu lầu bầu mở đầu, tên riêng ''Tanya'' cùng chi tiết ''hạ thấp
    giọng để đám thủy thủ xung quanh không nghe thấy rồi rên rỉ với vẻ mặt ủ dột'',
    và chuyển về ngôi thứ nhất ''tâm trí mình vẫn tràn ngập nỗi tuyệt vọng'' ở câu
    cuối."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ đúng đối tượng và độ mở của câu hỏi ''Tại
    sao chuyện này lại xảy ra chứ?''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ đúng câu hỏi ''Làm thế nào mà sự tình lại
    ra nông nỗi này?''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thoại thở dài & trần thuật: giữ tiếng thở dài ''“Haaa.”'', đại
    từ trần thuật ''nó'' và hình ảnh ''tan biến vào bầu trời xanh thẫm''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo & thuật ngữ: giữ câu hô ''“Điện báo!”'', tình thái
    ''Có vẻ'' và cụm ''một máy bay trinh sát thuộc Không hạm đội 16 đã phát hiện ra
    quân địch!''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & hai vế phân vân: giữ đại từ ''Nó'' – ''mình'' và
    sự giằng xé ''chẳng thể phân định nổi liệu mình đã luôn ngóng chờ tin tức này
    hay thầm cầu mong nó sẽ chẳng bao giờ tới''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đại từ ''họ'' trong ''tin tình báo về con mồi
    của họ'' và phản ứng ''Thủy thủ đoàn trên chiếc tàu ngầm bỗng trở nên phấn chấn
    hơn đôi chút.''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thoại lặp & không thêm nhấn mạnh: giữ nguyên hai câu hô lặp lại
    ''“Đã phát hiện hạm đội địch! Đã phát hiện hạm đội địch!”'' và không thêm nhấn
    mạnh Markdown tại vị trí thẻ neo trang page-156."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ đại từ ''mình'' và ý ''một khi đã bước
    vào công việc thì mình có thể chuyển đổi trạng thái dễ dàng thôi''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chức danh trong thoại: giữ ''“Thưa Trung tá, Thuyền
    trưởng Barchet đang cho gọi cô ạ.”''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại đáp: giữ đại từ ''ngài ấy'' (chỉ Thuyền trưởng
    Barchet) và ''tôi'' trong ''“Báo với ngài ấy là tôi sẽ tới ngay!”''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Tự thuật ngôi thứ nhất & phủ định: giữ đại từ ''mình'' và sự đối
    lập giữa ''những hành lang tàu ngầm chật hẹp vốn sẽ làm bước chân của một người
    đàn ông trưởng thành bị chậm lại'' với ''chẳng hề gây chút cản trở nào cho mình
    cả''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Tự thuật ngôi thứ nhất: giữ đại từ ''Mình'' và danh xưng ''vị
    thuyền trưởng''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: giữ ''“Thưa Thuyền trưởng, tôi đã nghe báo
    về bức điện tín.”''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Barchet: giữ đại từ ''cô'' và cách gọi
    ''Trung tá'' trong ''“Thứ lỗi vì đã triệu cô tới thế này, Trung tá.”''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Giải thích quân hàm & chức vụ: giữ đại từ ''ông ta'', sự phân
    biệt giữa quân hàm ''thiếu tá'' và chức vụ ''nắm quyền chỉ huy con tàu với tư
    cách thuyền trưởng'' thuộc ''bên hải quân'', cùng nhận định về sự phức tạp của
    thứ bậc quân hàm."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái lịch thiệp trong thoại: giữ danh xưng ''Thuyền
    trưởng Barchet'', cặp đại từ ''tôi'' – ''ngài'', hình ảnh ''người đi nhờ tàu''
    – ''chủ nhà'' và lời trấn an ''Xin ngài đừng bận tâm.''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & định danh trong thoại: giữ đại từ ''cô'' và danh xưng
    ''Trung tá Degurechaff''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đại từ ''ông ta'', đại từ ''nó'' và cụm ''bản
    chép lại nội dung bức điện''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi trần thuật – độc thoại nội tâm & dấu gạch ngang: giữ
    tên riêng ''Tanya'', thuật ngữ ''Một hải đội tàu địch'', đại từ ''bọn mình'' và
    câu khẳng định có dấu gạch ngang ''Chắc hẳn là chúng rồi—không nhầm đi đâu được.''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tàu chiến, số lượng & phủ định trong thoại: giữ dấu
    chấm lửng mở đầu, tình thái ''Ít nhất là'', ''có khả năng là'', các thuật ngữ
    ''tàu chủ lực hoặc tàu tuần dương'', ''Hai chiếc có khả năng là tàu tuần dương
    hạng nặng, bốn chiếc là tàu khu trục hoặc tàu tuần dương hạng nhẹ'' và câu phủ
    định ''Không có tàu sân bay.''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm, câu điều kiện & dấu câu: giữ đại từ ''mình'',
    cảm giác ''hơi sai sai'' và câu điều kiện bỏ lửng ''Nếu đây là đội hình của quân
    địch thì thật kỳ lạ…''."]'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Thoại nghi vấn, thuật ngữ & tình thái: giữ câu hỏi ''Không có
    tàu sân bay sao?'', tên riêng ''Khối Thịnh vượng chung'', đại từ ''tôi'', kỳ vọng
    ''phải có một chiếc tàu sân bay ở khu vực lân cận chứ'' và câu hỏi kết ''Liệu
    có sự nhầm lẫn nào chăng?''."]'
