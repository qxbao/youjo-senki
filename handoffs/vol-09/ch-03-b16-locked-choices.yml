choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000617
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, quan hệ nhượng bộ & không thêm nhấn mạnh: giữ ý định
    thực sự của người phát biểu (''tìm cách chặn đứng những kế hoạch nghe có vẻ điên
    rồ ấy bằng cái cớ là chúng xem chừng rất khó thực hiện''), mệnh đề nhượng bộ (''dù
    Tanya chẳng hề mảy may biết chuyện đó'') và không thêm nhấn mạnh Markdown tại
    vị trí thẻ neo trang page-149."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000618
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: giữ đại từ ''Tôi'' – ''ngài'',
    thuật ngữ ''công nghệ ngư lôi'' và ''góc nhìn của một pháp sư trên không''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000619
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: giữ ''“Xin cô hãy giải thích.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000620
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái trong thoại: giữ dấu chấm lửng sau ''trên
    khoang…'', các thuật ngữ ''ngư lôi chống hạm'', ''thuật thức dò tìm địch chủ động
    và cung cấp dưỡng khí'', ''hoạt động tác chiến tầm cao'', ''tính thực dụng và
    hiệu quả chi phí'', ''công nghệ ma pháp'' và tình thái ''tôi hình dung chúng ta
    sẽ có thể vượt qua hầu hết mọi trở ngại''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000621
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ câu hỏi trong thoại: giữ ''“Thế còn đối với ngư lôi
    cỡ nhỏ thì sao?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000622
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi thoại – độc thoại nội tâm & tình thái: giữ thuật ngữ
    ''U-boat'', câu độc thoại nội tâm xen giữa không in nghiêng với đại từ tự quy
    chiếu ''mình'' (''Không được quên tự chừa cho mình chút đường lui bảo hiểm.'')
    theo DEC-P01-001/DEC-P01-002, và phần thoại rào trước đón sau (''tôi không dám
    chắc chúng có thể được chế tạo đúng theo thông số kỹ thuật bằng công nghệ hiện
    có hay không'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000623
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi xác nhận trong thoại: giữ đại từ ''cô'' và cụm
    ''một cải tiến chủ yếu dựa trên việc kết hợp các công nghệ hiện có''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000624
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quan điểm trong thoại: giữ ''“Vâng, tôi nghĩ phát triển
    theo hướng ít rủi ro là tốt nhất.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000625
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thành ngữ: giữ đại từ ''nó'', cụm ''một quốc
    gia ở thế giới khác'' và hình ảnh ''bỏ hết trứng vào giỏ công nghệ rồi chuốc lấy
    thất bại''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000626
  kind: terminology_and_voice
  value: 'choices=["Liên hệ lịch sử & quan hệ nhân quả: giữ chủ thể ''Người Đức'',
    nguyên nhân ''quá ám ảnh với việc lật ngược cục diện chiến tranh bằng những thứ
    vũ khí mới kỳ dị'' và hệ quả gây ảnh hưởng nghiêm trọng lên ''các dây chuyền sản
    xuất sẵn có của họ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000627
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ ''ngành nhân sự'', tên riêng ''Tanya''
    và cụm ''khoảng cách giữa giá trị kỳ vọng và hiện thực''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000628
  kind: terminology_and_voice
  value: 'choices=["Tương phản phủ định – khẳng định trong trần thuật: giữ ''nó không
    hề nói chuyện lý thuyết suông mà đang bàn về những sự kiện đã thực sự diễn ra
    và những thứ đã thực sự tồn tại''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000629
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: giữ ''Về phần tính khả thi, nó luôn thận
    trọng để không hành động khinh suất.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000630
  kind: terminology_and_voice
  value: 'choices=["Tên cơ quan & câu hỏi trong thoại: giữ ''“Ý kiến chung của bên
    Xưởng Kỹ thuật thế nào ạ?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000631
  kind: terminology_and_voice
  value: 'choices=["Trần thuật động cơ kép: giữ đại từ ''nó'' và hai lý do ''vừa để
    giữ phép xã giao chung vừa vì muốn né tránh trách nhiệm''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000632
  kind: terminology_and_voice
  value: 'choices=["Tương phản nhận thức & dấu gạch ngang: giữ góc nhìn ngoại quan
    (''trông cứ như thể nó sẽ không để họ viện cớ thoái thác'') và mệnh đề sau dấu
    gạch ngang (''—nhưng nó lại chẳng hề biết điều đó'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000633
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & không thêm nhấn mạnh: giữ ''Đối với Tanya,
    nó chỉ đơn thuần là đang làm đúng quy trình mà thôi.'' và không thêm nhấn mạnh
    Markdown tại vị trí thẻ neo trang page-150."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000634
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đại từ ''nó'' và nhận định ''tôn trọng quan điểm
    của các chuyên gia trong một cuộc thảo luận mang tính kỹ thuật cao độ như thế
    là lẽ hết sức tự nhiên''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000635
  kind: terminology_and_voice
  value: 'choices=["So sánh kinh nghiệm quản trị: giữ ''Phớt lờ cánh kỹ sư trong lúc
    xây dựng một công cụ quản lý nội bộ chẳng khác nào tự chuốc lấy cảnh dự án diễn
    ra chẳng mấy suôn sẻ.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000636
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngắn: giữ ''Chuyện này cũng chẳng khác gì.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000637
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & dấu câu trong thoại: giữ ''Bên Xưởng Kỹ
    thuật—à thì, nếu đã là mệnh lệnh… có lẽ chúng tôi sẽ có thể chế tạo nhanh một
    nguyên mẫu tương đối dễ dàng'' và ý ''phóng to kích thước ngư lôi và tạo khoảng
    không gian bên trong cho các pháp sư''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000638
  kind: terminology_and_voice
  value: 'choices=["Trần thuật tâm lý chuyên gia: giữ nhận xét ''các chuyên gia phần
    lớn sẽ trả lời thật lòng'' và phủ định kép ''chẳng muốn bị nhớ đến như một đội
    ngũ không dám đương đầu với thử thách kỹ thuật''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000639
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ câu ''*Làm được là làm được.*''
    bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000640
  kind: terminology_and_voice
  value: 'choices=["Trần thuật bình luận: giữ đối lập ''điểm mạnh của một ngành nghề
    chuyên môn hóa, đồng thời cũng là điểm yếu của nó'' và ''Giới chuyên gia thường
    có xu hướng bắt tay làm bất cứ thứ gì chỉ vì họ có khả năng làm được.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000641
  kind: terminology_and_voice
  value: 'choices=["Tên cơ quan, dấu câu & phân biệt khái niệm trong thoại: giữ dấu
    chấm lửng mở đầu và kết thúc, tên ''Xưởng Kỹ thuật'', ý ''không thể tùy tiện quyết
    định đẩy binh lính vào chỗ chết chỉ vì một phút hứng chí'' và sự đối lập giữa
    ''nhiệm vụ đòi hỏi họ phải mang quyết tâm sẵn sàng hy sinh'' với ''những nhiệm
    vụ mà cái chết là kết cục duy nhất''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000642
  kind: terminology_and_voice
  value: 'choices=["Thoại khẳng định của Tanya: giữ ''“Dĩ nhiên, sinh mạng con người
    là ưu tiên cao nhất. Tôi hoàn toàn kiên định về điểm đó.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000643
  kind: terminology_and_voice
  value: 'choices=["Trần thuật tâm thế cuộc họp: giữ ''Những người tham dự cuộc họp
    đều đang nóng lòng tìm kiếm một giải pháp nhằm tạo ra bước đột phá.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000644
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: giữ ''Tất cả mọi người từ vị chủ tọa trở
    xuống đều miễn cưỡng kết luận rằng họ chẳng có lý do gì để từ chối.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000645
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & trích dẫn trong ngoặc kép: giữ ''Đó là lý do dự án
    này được phê duyệt phát triển với tinh thần “cứ làm thử xem sao”.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000646
  kind: terminology_and_voice
  value: 'choices=["Thoại kết luận: giữ ''“Tuyệt vời. Tôi muốn bên hải quân ít nhất
    cũng hãy cân nhắc ý tưởng này.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000647
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & chuyển điểm nhìn nội tâm – trần thuật: chỉ
    bọc câu độc thoại ''*Áááá, mình thốt ra câu đó từ lúc nào thế không biết…?*''
    bằng dấu sao theo DEC-P01-002 (dùng tự quy chiếu ''mình'' theo DEC-P01-001) và
    giữ câu trần thuật tiếp theo ở ngoài dấu sao."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000648
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: chỉ bọc câu thành ngữ ở vế sau dấu hai chấm
    bằng dấu sao theo DEC-P01-002.'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000649
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & ẩn dụ nhân quả: giữ đại từ tự quy chiếu ''mình''
    và hình ảnh ''những hạt giống mình gieo xuống quả thực đã dẫn thẳng tới tình cảnh
    này''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000650
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & đại từ trần thuật: chỉ bọc ''*maiali*''
    bằng dấu sao theo DEC-P01-002, giữ dấu chấm lửng, đại từ ''nó'' và thuật ngữ ''một
    quả ngư lôi sống''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000651
  kind: terminology_and_voice
  value: 'choices=["Nhận định kết cảnh: giữ ''Thật khó mà gọi bất cứ chuyện nào trong
    số này là vui vẻ được.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000652
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh: giữ chữ in hoa ''NGÀY 12 THÁNG 7 NĂM THỐNG
    NHẤT 1927, MẶT TRẬN NỘI HẢI''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000653
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ hải quân & bối cảnh: giữ ''Các đơn vị tàu ngầm tại Nội
    hải của Hải quân Đế quốc'' và ''trang bị theo cùng một tiêu chuẩn như phần còn
    lại của hạm đội''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000654
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & sắc thái mỉa mai: giữ ''số ngư lôi mà họ được cấp
    phát chẳng được tích sự gì cả'' và ''nhắc về chuyện đó ở thì quá khứ là một tin
    tốt lành cho cả họ lẫn người phát triển ra loại ngư lôi ấy''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000655
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kỹ thuật ngư lôi: giữ ''bước cải tiến vượt bậc ở ngòi
    nổ'' và ba lỗi điển hình ''bắn trúng đích trực diện bằng đạn lép, phát nổ ngay
    khi vừa phóng ra, và những ngòi nổ từ tính cứ thế lao vút qua thẳng hạm đội địch''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000656
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ lóng & phủ định: giữ ''Mấy con lươn ấy cuối cùng đã tiến
    hóa thành những quả ngư lôi mà lực lượng tàu ngầm hằng mong đợi'' và mệnh đề nhượng
    bộ ''cũng chẳng phải những quả ngư lôi trang bị tiêu chuẩn ấy đã biến thành một
    viên đạn bạc vạn năng''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000657
  kind: terminology_and_voice
  value: 'choices=["Trần thuật đánh giá: giữ ''Chúng chỉ là thứ vũ khí tầm trung bình,
    chẳng có gì đặc biệt.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000658
  kind: terminology_and_voice
  value: 'choices=["Đặc tính kỹ thuật & thuật ngữ tác chiến: giữ ''ưu tiên độ tin
    cậy về mặt cơ khí và chạy bằng điện—một lựa chọn thiết kế xuất sắc nhằm tối ưu
    hiệu suất chế tạo'' và mục đích ''tung vào chiến trường Nội hải đang sục sôi để
    phục vụ tác chiến đánh phá tàu buôn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000659
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & điểm nhìn kết lô: giữ ''săn lùng tàu buôn'', dấu
    chấm lửng trong ''Nhưng tình hình đang thay đổi… chỉ một chút thôi.'' và góc nhìn
    ''những thủy thủ đoàn dày dạn kinh nghiệm''."]'
