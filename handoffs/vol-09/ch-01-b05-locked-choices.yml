choices:
- segment_id: YS-LN09/Text/chapter004.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật/nội tâm & tình thái: quy chiếu Lergen bằng
    ''anh''; giữ tình thái suy đoán ''Hẳn'', ''nghe cứ như... mới là nguyên nhân thực
    sự khiến anh hạ thấp giọng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & cấu trúc điều kiện: giữ ''Bộ Tư lệnh Tối cao'',
    ''các nguyên lý về không gian và thời gian'', đại từ ''Họ'', ''chúng ta'', câu
    điều kiện ''nếu chúng ta muốn nhượng lại đất đai để đổi lấy khoảng thở, thì họ
    kỳ vọng phải nhìn thấy ‘thành quả’'' và cặp nháy đơn quanh ''‘thành quả’''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Tanya hỏi Lergen bằng ''“Ý ngài
    là sao, thưa Đại tá?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mục đích tác chiến: giữ ''đòn cánh cửa xoay'', ''mặt
    trận Rhine'', đại từ ''Họ'', ''chúng ta'' và mệnh đề giải thích ''thứ duy nhất
    có thể biện minh cho một cuộc rút lui là một trận đánh quy mô lớn nhằm nhử quân
    địch vào tròng rồi tiêu diệt hoàn toàn chúng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định: Tanya tự quy chiếu bằng ''mình''
    theo DEC-P01-001; giữ phủ định ''Lý do duy nhất khiến mình không hỏi...'' và ''nhưng
    cả hai không còn cùng chung sống trong thế giới ấy nữa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ câu hỏi mở ''Mọi chuyện đã chệch hướng từ
    đâu cơ chứ?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thoại nhận định rủi ro: giữ nguyên quan hệ nhân quả ''Bất cứ điều
    gì làm phức tạp hóa cuộc rút lui cũng sẽ biến nó thành một chiến dịch đầy rủi
    ro…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Đại từ & liên kết từ vựng trong thoại: giữ đại từ ''chúng ta'',
    từ ''những thành quả'' liên kết với p000002 và dấu gạch ngang dài giải thích."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: quy chiếu Lergen bằng ''Anh'' và giữ chi
    tiết ''lời tuyên bố siêu thực ấy bằng một giọng mệt mỏi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & phủ định khả năng: giữ ''Thưa Đại tá…'' và khẳng định
    bất khả thi ''Chuyện đó là bất khả thi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định trong thoại: Lergen xưng ''Tôi'', gọi Tanya
    là ''cô'' và giữ phủ định ''chưa từng nghĩ sẽ có lúc nghe cô nói ra câu đó''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & lập luận tham mưu: giữ ''sĩ quan tham mưu'', ''chiến
    dịch cánh cửa xoay'', ''vùng đất thấp'' và ''miền đông''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & trần thuật: Lergen xưng ''Tôi''/''tôi'', gọi
    Tanya là ''Trung tá ạ''; giữ tên ''Lergen'' ở phần dẫn và nhận định ''Miền đông
    quá bao la''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ câu tóm lược ''Vấn đề cốt lõi tóm gọn lại
    chính là ở đó.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: giữ ''Chiến trường phía đông'',
    ''Lục quân Đế quốc'', ''tác chiến cơ động'' và quan hệ nguyên nhân ''Đó là lý
    do...''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tình thái: giữ đại từ ''chúng ta'', cụm ''cơ động áp
    đảo và tiêu diệt kẻ địch'', ''nắm quyền chủ động'' và tình thái ''Nghe suýt nữa
    còn tưởng như''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái tuyên truyền: giữ ''Quân đội Liên bang'',
    đại từ ''chúng ta''/''ta'' và dấu chấm than cuối câu (không in nghiêng vì nguồn
    chỉ có thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ ''dòng tít tuyên truyền hoàn hảo'' và ''trang
    nhất của một tờ báo''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thế bị động bắt buộc: giữ đại từ ''chúng ta'', ''Lục
    quân Đế quốc'', ''các trận tác chiến cơ động'', phủ định ''không đánh... vì tự
    nguyện lựa chọn'', thế bị động ''bị ép phải đánh như thế'' và ''chẳng còn lựa
    chọn nào khác''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''mặt trận phía đông'', ''trận địa phòng
    ngự chuẩn sách giáo khoa'', ''nhân lực, vật tư và trang bị quân sự'', ''sư đoàn''
    và phủ định ''cũng chẳng khá khẩm hơn là bao''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Nhận định tổng quát: giữ câu ''Mọi khu vực cần phải phòng thủ
    đều thiếu hụt quân số.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & hệ quả: giữ ''phòng tuyến'', ''các cứ điểm'', đại
    từ ''chúng ta'' và ''các trận đánh cơ động''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & câu hỏi tranh luận: giữ ''thưa Đại tá'',
    ''Bộ Tổng tham mưu'', ''các phòng tuyến bị kéo căng quá mức ở miền đông'' và ''sự
    tiêu hao không thể bù đắp cho lực lượng của chúng ta''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái bắt buộc: giữ ''mặt trận'', ''lực lượng
    dự bị của Liên bang'', ''các phòng tuyến'', ''giải pháp tình thế'', ''Cụm tập
    đoàn quân phía Đông'' và ''các chiến dịch tiến công và phòng ngự chuẩn sách giáo
    khoa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi nghi vấn lễ phép: Tanya gọi Lergen là ''ngài'',
    xưng ''tôi'' và hỏi ''liệu một chuyện như thế có khả thi không ạ?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & địa danh: giữ đại từ ''chúng ta'', phủ định
    ''đã chẳng thể thiết lập và giữ vững những phòng tuyến đúng nghĩa'', ''miền đông''
    và ''hệ thống chiến hào ở sông Rhine''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, giả định trái thực tế & điểm nhìn: giữ chủ
    ngữ khái quát ''Người ta'', ''tiền tuyến'', ''nhà ga tại đế đô'', tên riêng ''Tanya'',
    cấu trúc giả định ''Nếu không phải hai người đang đứng..., hẳn chẳng có gì ngăn
    được...'' và bọc chính xác câu ''*Bất kỳ ai không phải một kẻ đần độn hoàn toàn
    đều có thể thấy chuyện đó là bất khả thi!*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái trong thoại: Lergen gọi Tanya là ''Cô'', dùng
    ''chúng ta'', giữ tình thái ''có lẽ'' và cụm ''thử bao vây với hy vọng tiêu diệt
    hoàn toàn quân địch''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định: Tanya dùng ''thưa Đại tá'', ''Ngài'',
    ''tôi'', ''chúng ta''; giữ ''Quân đội Liên bang'' và phủ định ''không có hy vọng
    nào nhử được Quân đội Liên bang vào tròng rồi tiêu diệt hoàn toàn chúng cả''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: giữ đại từ ''Chúng ta'', địa danh ''Soldim
    528'', ''miền đông'' và ''Trung tướng Zettour''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi cảm thán nội tâm: giữ dấu chấm lửng mở đầu, đại từ ''Chúng
    ta'' và hai câu hỏi liên tiếp."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc điều kiện & tình thái: giữ đại từ ''chúng ta'', hai câu
    điều kiện ''Nếu cần...'', ''Nếu chúng ta dốc hết sức...'' cùng mức độ tình thái
    ''có thể'', ''có lẽ vẫn khả thi'' và ''Ít nhất, chúng ta hẳn cũng làm trót lọt
    được một lần''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đại từ & phủ định: quy chiếu Lergen bằng ''anh
    ta'', tự quy chiếu Tanya bằng ''mình'' theo DEC-P01-001, giữ ''lý thuyết bàn giấy'',
    ''mặt trận phía đông'' và câu phủ định ''Đây đâu phải một trò chơi mà người ta
    có thể lưu rồi tải lại để thử lần nữa''."]'
