choices:
- segment_id: YS-LN09/Text/chapter016.xhtml/p000292
  kind: terminology_and_voice
  value: 'choices=[''Lời nhận xét của Thiếu tá Weiss về hậu phương: tâm lý ở hậu phương
    quá đỗi khó hiểu đối với những người lính'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn tự sự ngôi thứ nhất của Tanya và đại từ chỉ Weiss:
    Mình / của anh ta'', ''Phủ định kép giữ nguyên sắc thái đồng tình: chẳng khó hiểu
    chút nào'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=[''Tên riêng và tình thái suy đoán: Đế quốc và Ildoa / trên thực
    tế có khi lại mang đến lợi ích'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=[''Cấu trúc đối lập phủ định – khẳng định: không phải là vấn đề
    về đạo đức mà là về sức mạnh'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và giọng điệu mỉa mai trong lời thoại của Tanya: chính
    quốc / chúng ta / Biết đâu chúng ta còn được mời dùng bữa tối nữa đấy!'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=[''Đại từ tự sự nội tâm của Tanya: mình'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=[''Tình thái nhận thức: Bữa tối. Chuyện ăn tối rất có thể sẽ xảy
    ra thật.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=[''Lời cảm thán buột miệng ngắn gọn: “…Chết tiệt.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và phủ định: Mình chẳng có gì để mặc cả.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=[''Cách dịch câu hỏi ngắn của Weiss với Tanya: “Thưa Trung tá?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000302
  kind: terminology_and_voice
  value: 'choices=[''Quân hàm và xưng hô Tanya dùng với Weiss và Visha: Thiếu tá /
    anh / Trung úy Serebryakov'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=[''Lời tuân lệnh của Weiss: “Vâng, thưa Trung tá. Tôi rõ rồi ạ.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000304
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và thuật ngữ ngoại giao: Mình / mình / tùy
    viên tại đại sứ quán'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm tự vấn về quá khứ: Liệu có ai chuẩn bị sẵn lễ
    phục cho mình lúc chúng ta được điều động đi không nhỉ?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000306
  kind: terminology_and_voice
  value: 'choices=[''Giữ dấu ngoặc kép và nhấn mạnh Markdown khớp thẻ in nghiêng nguồn:
    “chạy trốn” / “trung lập nghiêm ngặt” / dứt khoát *không phải* là ấn tượng mà
    chúng ta muốn tạo ra'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000307
  kind: terminology_and_voice
  value: 'choices=[''Tình thái suy đoán phủ định và thuật ngữ: Có lẽ chẳng việc gì
    phải bận tâm / Mình không nghĩ chúng ta sẽ xuất hiện trên truyền thông đại chúng
    / lệnh phong tỏa truyền thông dưới danh nghĩa bảo vệ bí mật quốc gia'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000308
  kind: terminology_and_voice
  value: 'choices=[''Tên riêng và sự nhấn mạnh nghĩa vụ ngoại giao: Đế quốc quả thực
    phải giữ thể diện trước mắt đội ngũ tiếp đón phía Ildoa'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và phủ định: Chúng ta không thể xem nhẹ yếu tố thị giác
    được'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000310
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và phủ định: Mình không nghĩ chúng ta có
    thể kiếm được những bộ âu phục ba mảnh may đo theo yêu cầu / Mình chẳng muốn trở
    thành hạng người man rợ'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000311
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và đại từ chỉ Serebryakov: đài chỉ huy / viên sĩ quan
    phụ tá / cô ấy'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000312
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại lẩm bẩm của Tanya: mình / lễ phục và cách cư xử ở hậu
    phương / chuyến du lịch ngắm cảnh'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=[''Mệnh đề khái quát làm tiền đề cho sự sững sờ ở đoạn sau: Khi
    đối mặt với những điều xa lạ, việc chuẩn bị sẵn một kế hoạch luôn mang lại lợi
    ích.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000314
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn tự sự ngôi thứ nhất và thuật ngữ: mặt trận phía đông
    / Mình / hành lang tàu ngầm / mình'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000315
  kind: terminology_and_voice
  value: 'choices=[''Hai cụm nhấn mạnh Markdown tách biệt khớp chính xác hai thẻ in
    nghiêng trong nguồn: *Lễ phục và hậu phương* cùng với *Khi đối mặt với những điều
    xa lạ… hoàn toàn khác hẳn?*'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000316
  kind: terminology_and_voice
  value: 'choices=[''Tình thái đánh giá: sĩ quan tiền tuyến / có lẽ vẫn chấp nhận
    được'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000317
  kind: terminology_and_voice
  value: 'choices=[''Tình thái suy đoán về những người lính tiền tuyến: hẳn đôi lúc
    họ sẽ thốt ra những suy nghĩ kỳ quặc'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000318
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown đại từ tự quy chiếu khớp thẻ in nghiêng nguồn:
    Nhưng còn *mình* thì sao?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi tự vấn khẳng định bản ngã của Tanya: Một kẻ yêu chuộng
    thị trường, trân trọng hòa bình và văn minh như mình ư?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown trên đại từ tự quy chiếu khớp thẻ in nghiêng
    nguồn: Không ai khác mà chính *mình* lại cảm thấy việc ăn vận chỉnh tề trong môi
    trường hậu phương lý tưởng của một Ildoa hòa bình là điều đáng phải lo lắng sao?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=[''Nhận định khẳng định ngắn gọn: Chuyện này hết sức bất thường.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000322
  kind: terminology_and_voice
  value: 'choices=[''Giả định trái thực tế kèm phủ định ở mệnh đề điều kiện: Nếu đây
    không phải là một chiếc tàu ngầm chật chội và mình không ở vào cái cương vị đòi
    hỏi phải giữ gìn thanh danh cùng hình ảnh trước mặt binh lính, hẳn mình đã mặc
    kệ thể diện mà tức tốc chạy ngay đến phòng khám sức khỏe tâm thần gần nhất rồi.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000323
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown toàn câu khớp thẻ in nghiêng nguồn: *Chuyện
    này lẽ ra không nên xảy ra mới phải.*'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=[''Lời tự hỏi lẩm bẩm của Tanya: “…Mình đã lún sâu đến mức đó rồi
    sao?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=[''Liên tưởng tiền kiếp và câu hỏi giả định phủ định: nhân viên
    công sở làm công ăn lương / âu phục và cà vạt / nếu ngay cả một chiếc cà vạt mà
    mình còn không thắt nổi, liệu mình có thể đi làm hằng ngày được không…?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=[''Mệnh đề điều kiện bỏ lửng: Nếu việc khoác lên người bộ lễ phục
    thực sự là một nỗi nhọc nhằn đến thế, vậy thì điều đó có nghĩa là…'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=[''Câu cảm thán bàng hoàng: “…Cái quái gì thế này?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=[''Phủ định và câu hỏi tự vấn: Mình vốn chẳng hề có triệu chứng
    tự cảm nhận nào, nhưng chẳng lẽ chiến trường rốt cuộc đã đầu độc mình rồi sao?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=[''Điều kiện phủ định và tình thái khả năng: Nếu chúng ta không
    sớm giải quyết cho xong cuộc chiến này, có khi mình sẽ phát điên mất thật.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=[''Đối lập thể xác và tâm trí trong nội tâm: Nếu không cẩn thận,
    thể xác mình có thể sống sót qua cuộc chiến nhưng tâm trí thì không. Mình cần
    cả hai cùng khỏe mạnh.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=[''Định danh và thành ngữ tương đương: mất trí / Being X / đặt cái
    cày trước con trâu'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=[''Mệnh đề khẳng định ngắn gọn: Tự do đòi hỏi cả một tâm trí lẫn
    một cơ thể lành lặn.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=[''Mệnh đề quyết tâm ngắn: Mình phải sống sót.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=[''Cấu trúc phủ định thể hiện ý chí: Mình không thể chịu khuất phục
    trước cái thế giới điên rồ, mục nát và kỳ quái tột độ này được.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=[''Điệp cấu trúc khẳng định ý chí: Mình sẽ sống—mình sẽ sống và
    ăn mừng chiến thắng của lý trí.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=[''Lời thề nội tâm của Tanya: Mình thề sẽ bảo vệ ngày mai, bảo vệ
    tương lai, cũng như tự do và phẩm giá của bản thân cho đến khi tất cả những chuyện
    này kết thúc.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=[''Chuyển điểm nhìn sang trần thuật ngôi thứ ba khép lại chương:
    Trung tá Tanya von Degurechaff lặng lẽ tuyên bố quyết tâm từ tận đáy lòng của
    cô.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=[''Lời tuyên bố kết chương: “Chúng ta phải chiến thắng. Nhất định
    phải thắng. Bằng bất cứ giá nào.”'']'
