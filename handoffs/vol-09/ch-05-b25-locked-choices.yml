choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000901
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời lẩm bẩm mở đầu batch giữ đúng dấu chấm lửng
    và mạch nối tiếp từ cuối batch b24.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000902
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm ngôi thứ nhất ('mình') và đại
    từ 'cô ấy' (chỉ Serebryakov) chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000903
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng câu hỏi tự vấn, các thuật ngữ 'xã hội
    học', 'quá trình xã hội hóa' và sắc thái suy đoán ('Có lẽ', 'có khi').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000904
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu độc thoại ngắn tự nhiên, khớp mạch liên tưởng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000905
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('mình') giữ đúng nhịp
    câu danh ngữ và sự tương phản giữa chiến trường với 'hậu phương' ở Ildoa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000906
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu chuyển ý ngắn gọn, đối lập rõ trạng thái của
    Đế quốc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000907
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Bảo toàn chính xác phạm vi nhấn mạnh Markdown ('*không*')
    tương ứng thẻ em trong nguồn, cùng các thuật ngữ 'chiến tranh tổng lực', 'đế đô'
    và câu hỏi tu từ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000908
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Tiếng thở dài và câu trần thuật ngắn tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000909
  kind: terminology_and_voice
  value: Touch=polish_optional; rationale=Giữ đúng dấu chấm lửng và nghĩa; có thể
    giữ 'mô thức nhận thức' hoặc rút gọn thành 'mô thức' ở bước polish.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000910
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu danh ngữ ngắn gọn, đúng sắc thái.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000911
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời độc thoại giữ đúng đại từ ('Mình', 'chúng ta'),
    phép liệt kê ba vị thế và câu hỏi nghi vấn cuối đoạn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000912
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ chuẩn thuật ngữ 'giải cấu trúc', đại từ 'Chúng
    ta - mình' và cấu trúc câu hỏi mở đầu; bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000913
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Đoạn lập luận giữ chuẩn 'Mình, Tanya von Degurechaff',
    'Bộ Tổng tham mưu Lục quân Đế quốc', 'Bộ Tư lệnh Tối cao', các trạng từ tình thái
    ('có lẽ', 'chắc hẳn', 'chắc chắn') và mệnh đề so sánh về hòa bình – chiến tranh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000914
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu bổ sung giới hạn góc nhìn mượt mà, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000915
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu nhận định khái quát súc tích, chuẩn nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000916
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng điểm nhìn tự quy chiếu ngôi thứ ba ('Tanya',
    'cô') và phủ định ('không ủng hộ vô điều kiện').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000917
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng cấu trúc điều kiện – hệ quả, đại từ nội
    tâm 'mình' và sự đối lập giữa 'chiến tranh công khai' với 'phương pháp văn minh
    hơn'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000918
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ chuẩn thuật ngữ 'tỷ lệ hiệu quả chi phí' theo
    P04-cost-performance.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000919
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Bảo toàn chính xác điều kiện phủ định ('Chừng nào
    chúng ta chưa ở vào tình thế lý tưởng... vì ta có mà chúng không có, thì việc
    chuyển sang thế tiến công là chuyện không thể bàn tới') và giọng tự trào bên tách
    cà phê.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000920
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Hai câu ngắn chuyển mạch suy nghĩ tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000921
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng tên riêng 'Ildoa', 'Liên bang', 'Khối
    Thịnh vượng chung', 'Đế quốc' và phép so sánh phủ định ('chẳng khá khẩm hơn...
    là bao').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000922
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu nhận xét hài hước ngôi thứ nhất ('mình') chuẩn
    xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000923
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Mô tả các bữa ăn trên tàu rõ ràng, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000924
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng sự chuyển đổi điểm nhìn từ ngôi thứ ba
    ('Tanya', 'đơn vị của cô') sang ngôi thứ nhất ('mình'), cùng các từ khóa 'toa
    ăn', 'Weiss', 'vị phó chỉ huy'; bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000925
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng mệnh đề chêm giữa cặp gạch ngang dài và
    thuật ngữ 'toa giường nằm'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000926
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật ngôi thứ ba ('Tanya') mượt mà, chuẩn
    nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000927
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng sự đối lập thời gian trước và sau khi
    ngủ cùng đại từ ngôi thứ nhất ('mình').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000928
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('mình') diễn đạt tự nhiên
    sự nhận ra tuyến đường ray của Đế quốc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000929
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu cảm thán độc thoại xử lý tự nhiên chủ ngữ khái
    quát và giữ đúng dấu chấm lửng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000930
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu mô tả giàu tính nhạc và chuẩn nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000931
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng sự tương phản màu sắc ('xám xịt'), ẩn
    dụ 'vắt kiệt tối đa sức mạnh địa chính trị' và phủ định kép ('không tài nào làm
    ngơ nổi').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000932
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời độc thoại dịch đại từ khái quát thành 'người
    ta' tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000933
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng thuật ngữ 'liệt cường' và các hình ảnh
    ẩn dụ ('mặt trời đang lên', 'vương miện của thế giới').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000934
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu cảm thán ngắn gọn, đúng giọng chua chát.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000935
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng mốc thời gian tương lai của ngôi thứ ba
    ('Tanya') và quan hệ nhân quả về sự tự hủy diệt của Đế quốc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000936
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm ('chúng ta', 'mình') truyền tải
    chính xác sự bực bội trước viễn cảnh bại trận.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000937
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu thoại ngắn gọn, đúng cảm xúc và đại từ tự xưng
    'Mình'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000938
  kind: terminology_and_voice
  value: Touch=polish_optional; rationale=Giữ đúng mức độ tình thái ('có vẻ sẽ trở
    nên cần thiết vào một thời điểm nào đó trong tương lai gần'); có thể cân nhắc
    chỉnh 'việc đào thoát' thành 'việc sơ tán' hoặc 'việc di tản' ở bước polish.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000939
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu thoại giữ đúng dấu chấm lửng và giọng buông
    xuôi đi ngủ tiếp.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000940
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật ngắn gọn, chuẩn nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000941
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu độc thoại nội tâm ngắn gọn, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000942
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu kết chương giữ đúng sắc thái kỳ vọng nhẹ nhàng
    ('hẳn cũng sẽ') và đại từ 'mình'.
