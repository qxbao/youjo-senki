choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000448
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, giả định & nhấn mạnh Markdown: giữ trần thuật ngôi
    thứ ba ở đầu câu (''ông ta'', ''Tanya''), giả định ''Nếu tâm tư thật lòng của
    Tanya vào khoảnh khắc này được ghi chép lại cho hậu thế, hẳn nó sẽ viết là:''
    và chỉ bọc câu độc thoại ''*Mình cũng muốn khóc lắm đây.*'' bằng dấu sao theo
    DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000449
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ tự quy chiếu ''mình'', đại từ ''Ông ta''
    chỉ Schugel và lời cầu cứu nội tâm ''Ai đó làm ơn làm gì đi chứ.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000450
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: giữ ''cô'' – ''tôi'' và cách gọi
    ''Trung tá Degurechaff''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000451
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chức danh trong thoại: giữ dấu chấm lửng mở đầu, danh
    xưng ''Tiến sĩ'' và đại từ ''ông''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000452
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, giả định quá khứ & xưng hô tôn giáo: giữ ''Một kỹ thuật
    viên phải luôn giữ lòng khiêm nhường'', đối chiếu ''đám kỹ thuật viên hải quân'',
    câu điều kiện giả định trái thực tế ''Nếu không nhờ lời nhận xét của cô, hẳn tôi
    đã mắc kẹt trong vòng xoáy tăm tối không lối thoát mất rồi'' và cách gọi ''Người
    chị em đồng đạo của tôi ơi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000453
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm: giữ ý hai bên nói lệch pha, không hiểu nhau
    (''Hai bên hoàn toàn nói trớt quớt với nhau.'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000454
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & điển tích: giữ tự quy chiếu ''Mình'', cấu
    trúc lặp ba tầng ''cùng một thứ tiếng trên cùng một đất nước trong cùng một thời
    đại'' và câu hỏi tu từ ''Bộ Tháp Babel mới sập hay gì thế?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000455
  kind: terminology_and_voice
  value: 'choices=["Tên gọi, sắc thái nội tâm & không thêm nhấn mạnh: giữ sắc thái
    gay gắt ''lũ khốn tự xưng là thần thánh kia'', định danh ''Being X cùng đồng bọn
    của hắn''; không thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-139."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000456
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ tự quy chiếu ''mình'' trong ''Ai đó làm
    ơn cứu mình với. Khẩn cấp lắm rồi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000457
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & độc thoại nội tâm: giữ tự quy chiếu ''mình'',
    danh xưng ''vị tiến sĩ'', và bọc chính xác hai cụm ''*Chẳng có chút nghĩa lý nào
    cả*'' cùng ''*Cơ sự trớ trêu nào đã đẩy mình và vị tiến sĩ vào cuộc đối thoại
    không tài nào hiểu nổi thế này?*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000458
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại & trần thuật: giữ tiếng gọi ''“…Đại tá?”''
    dành cho Lergen, tên riêng ''Tanya'', ''Lergen'' và cụm ''vẫn giữ vẻ im lặng lịch
    thiệp''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000459
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: giữ câu hỏi nội tâm đầu đoạn (''Liệu anh ta
    có thể làm cho lão này ngậm miệng lại không?'') và câu trần thuật tiếp theo với
    ''anh ta'' (Lergen), ''nó'' (Tanya)."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000460
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại: giữ ''“Trung tá Degurechaff.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000461
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & lễ độ trong thoại: giữ ''“Vâng, thưa Đại tá, có chuyện
    gì ạ?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000462
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & lập luận trong thoại: Lergen xưng ''Tôi'' – gọi Tanya
    là ''cô'', dùng ''chúng ta'' cho phía Đế quốc và giữ quan hệ nhân quả ''xét đến
    hàng loạt khuyết điểm cứ liên tục phát sinh ở ngư lôi của chúng ta, việc cô có
    đôi chút dè dặt cũng là lẽ đương nhiên''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000463
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & bước ngoặt cảm xúc: giữ cảm thán ''Ồồồ!'',
    tự quy chiếu ''Mình'' và sự đảo chiều ''suýt nữa thì mừng rỡ khôn xiết, nhưng
    rồi gáo nước lạnh tiếp theo lại dội xuống''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000464
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái trong thoại: giữ ''các chuyên gia lục quân
    tại Xưởng Kỹ thuật'', ''thử nghiệm vận hành kỹ lưỡng'', đánh giá ''vượt qua tiêu
    chuẩn về độ tin cậy'' và ''thành quả của tình đoàn kết''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000465
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & tình thái phỏng đoán: giữ phỏng đoán ''Hẳn
    bên lục quân cũng có khối tâm tư bất mãn về bên hải quân nhỉ?'' và ''Dù mình không
    dám chắc, nhưng nghe giọng anh ta có vẻ hào hứng lắm.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000466
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm tự hiệu chỉnh: giữ ''Khoan đã nào. Xin rút lại
    nhận định vội vàng ban nãy.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000467
  kind: terminology_and_voice
  value: 'choices=["Điều kiện giả định & quan hệ logic: giữ nhận định về Lergen và
    câu điều kiện ''Nếu Tanya phải cạnh tranh ngân sách với anh ta, hẳn sẽ chẳng dễ
    gì hòa thuận nổi dù không phải chuyện quan hệ giữa lục quân và hải quân đi nữa.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000468
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & chi tiết hàm ẩn: giữ ''Lời nhận xét của anh ta cũng
    lặng lẽ lờ đi hành vi lập dị của vị tiến sĩ.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000469
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ trong thoại: giữ tình thái ''có lẽ chúng
    ta có thể bù đắp thế yếu của hạm đội chủ lực bằng chiến thuật và công nghệ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000470
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái mỉa mai trong thoại: Tanya xưng ''Tôi'', dùng
    ''chúng ta'', giữ cụm ''những quả ngư lôi đóng mác chuẩn duyệt của lục quân''
    và câu kết ''Tôi kỳ vọng chuyến này sẽ thú vị lắm cho mà xem.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000471
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & thuật ngữ hải quân: giữ tự quy chiếu ''Mình'',
    các thuật ngữ ''lục quân của Đế quốc'', ''tàu sân bay hộ tống'', ''tàu ngầm vận
    tải'' và nhận định châm biếm về ''sự ngờ vực lẫn nhau giữa lục quân và hải quân
    đã chạm đến đỉnh điểm''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000472
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh: giữ nguyên chữ in hoa ''MỘT NGÀY NỌ TRONG
    THỜI ĐẠI CHIẾN, Ở VÙNG LÂN CẬN ĐẾ ĐÔ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000473
  kind: terminology_and_voice
  value: 'choices=["Giọng người kể chuyện & địa danh: giữ địa danh ''Dakar'', đại
    từ dẫn chuyện ''chúng ta'' và dấu chấm lửng cuối câu."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000474
  kind: terminology_and_voice
  value: 'choices=["Liên kết câu, quân hàm & tên đơn vị: giữ dấu chấm lửng mở đầu
    nối với p000473, mốc thời gian ''trước khi hàng loạt sự kiện kỳ quặc đến khó tin...'',
    danh xưng ''người lính xui xẻo là Trung tá Tanya von Degurechaff'' và tên đơn
    vị ''Kampfgruppe Salamander''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000475
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & bối cảnh chiến lược: giữ ''Khối Thịnh vượng chung'',
    ''Đế quốc'' và ''năng lực tiến công tàu chiến''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000476
  kind: terminology_and_voice
  value: 'choices=["Tên khí tài & mật danh: giữ ''Khí cụ Gia tốc Dưới biển Đa dụng''
    và ''mật danh: V-2…''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000477
  kind: terminology_and_voice
  value: 'choices=["Tên tổ chức & bối cảnh phát triển: giữ ''Hải quân Khối Thịnh vượng
    chung'', tên họ ''Degurechaff'' và cơ quan ''Phòng Nghiên cứu Chiến lược thuộc
    Văn phòng Bộ Tổng tham mưu''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000478
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, phủ định & bình luận ngoại đề: giữ đối lập
    ''dù chính nó là người đệ trình ý tưởng đó, nó lại chẳng bao giờ dừng lại để nghĩ
    xem biết đâu có ngày chính mình sẽ là người phải sử dụng nó…'' và câu nhận xét
    chung về bản tính vô trách nhiệm của con người."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000479
  kind: terminology_and_voice
  value: 'choices=["Quan hệ tương phản & điểm khởi đầu: giữ tương phản giữa ''hoàn
    cảnh liều lĩnh như vậy'' với ''được giám sát và quản lý khá hợp lý'', cùng mốc
    ''khi Tanya được hỏi xin ý kiến tham vấn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000480
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & chi tiết biểu cảm: giữ ''cuộc họp dự án nghiên cứu
    kỹ thuật'', tư cách ''người dày dạn kinh nghiệm thực chiến'' và hình ảnh ''há
    hốc mồm kinh ngạc''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000481
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ lực lượng: giữ ''Hải quân Khối Thịnh vượng chung vượt
    trội hơn hẳn'' và ''tàn dư hạm đội Cộng hòa''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000482
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ quân sự: giữ ''người lính Tanya này'', chi
    tiết ''nắm rõ những bài học của Thế chiến thứ hai'' và hai phương thức ''không
    kích hoặc tác chiến tàu ngầm''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ hải quân: giữ chuỗi ''thiết giáp hạm, pháo
    chính rồi... tàu lớn pháo to'' và mệnh đề ''sự kiên nhẫn của nó đã chạm tới giới
    hạn và nó bèn lên tiếng''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ trong thoại & đánh giá trần thuật: giữ ''“Tác chiến
    chống hạm ư? Chẳng phải chúng ta có thể triển khai máy bay ném bom chống hạm hoặc
    tàu ngầm mang ngư lôi hay sao?”'' và nhận định ''Với Tanya, đây là một ý kiến
    vô cùng hợp lý.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & chơi chữ lóng: giữ câu hỏi tu từ trần thuật,
    bọc chính xác ''*Aal*'' bằng dấu sao theo DEC-P01-002, giữ ''Hải quân Đế quốc''
    và nghĩa đen ''gần như là lươn thật''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, lịch sử quân sự & không thêm nhấn mạnh: giữ
    ''Trân Châu Cảng'', chỉ bọc ''*Prince of Wales*'' và ''*Repulse*'' bằng dấu sao
    theo DEC-P01-002 (bỏ qua thẻ neo page-141), giữ phủ định kép về việc phóng ngư
    lôi đánh chìm tàu chủ lực/chiến hạm và sự đối lập giữa ''chiến lược chống tiếp
    cận khu vực bài bản'' với quy luật chung ''tàu thuyền trên biển hễ trúng thuốc
    nổ là sẽ chìm''."]'
