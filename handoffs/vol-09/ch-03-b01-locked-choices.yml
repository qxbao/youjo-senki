- segment_id: YS-LN09/Text/chapter010.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=[''Quân hàm và tên đầy đủ: Trung tá Tanya von Degurechaff'', ''Điểm
    nhìn trần thuật ngôi thứ ba gọi Tanya: cô'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=[''Đại từ quy chiếu chung: bạn / chính nó'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=[''Tình thái giả định trái thực tế quá khứ: Hoặc ít nhất, lẽ ra
    phải là như thế'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=[''Chức trách và quân hàm: sĩ quan trực ban, Trung úy Serebryakov'',
    ''Tên cơ quan: Văn phòng Bộ Tổng tham mưu'', ''Đại từ phân biệt Serebryakov và
    Tanya: cô ấy (Serebryakov) / cô (Tanya)'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba: Tanya / Serebryakov'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=[''Chuyển đổi linh hoạt giữa nội tâm tự quy chiếu và tự gọi tên
    ở ngôi thứ ba theo sát nguồn: mình / Tanya / cô'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu: mình'', ''Giả định trái thực tế ở quá khứ:
    Giá mà mình có một chiếc bi đông… Ở mặt trận phía đông, chắc chắn mình đã mang
    theo nước rồi'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và tình thái: Mình đoán cảm giác an toàn
    chính là kẻ thù lớn nhất'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu: Mình'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm kết hợp tự sự ngôi thứ nhất số nhiều (Tanya và
    Serebryakov): mình / cô ấy / chúng tôi'', ''Thuật ngữ: lệnh tắt đèn nghiêm ngặt'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba: Tanya'', ''Tên cơ quan: Văn
    phòng Bộ Tổng tham mưu'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu: mình'', ''Tên cơ quan: Văn phòng Bộ Tổng
    tham mưu'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: Các sĩ quan tham mưu'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=[''Đại từ: mình / chúng tôi'', ''Quân hàm và tên: Trung tướng Rudersdorf'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô quân sự khi trình diện cấp tướng: Trung tá Degurechaff
    có mặt trình diện, thưa Tướng quân'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=[''Cách Rudersdorf gọi Tanya trong thoại: cô / Trung tá'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu: mình'', ''Cách gọi Rudersdorf trong trần
    thuật: vị tướng'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=[''Đại từ ngôi thứ nhất số nhiều chỉ phía Đế quốc trong lời Rudersdorf:
