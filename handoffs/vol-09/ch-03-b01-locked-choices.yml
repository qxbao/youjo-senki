- segment_id: YS-LN09/Text/chapter010.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn trần thuật ngôi thứ ba: ông (Rudersdorf) / Tanya'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm giữ nguyên cấu trúc: Một đồng minh lại yêu cầu
