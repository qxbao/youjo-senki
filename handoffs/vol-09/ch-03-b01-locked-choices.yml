- segment_id: YS-LN09/Text/chapter010.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=[''Sắc thái kính ngữ lịch sự của cấp dưới trong thoại: đâu ạ'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown khớp thẻ in nghiêng nguồn: *Đúng thế đấy*'',
