choices:
- segment_id: YS-LN09/Text/chapter008.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Phủ định & câu hỏi lễ phép: giữ dấu ba chấm mở đầu, cấu trúc phủ
    định ''ngay cả những người đã tử trận cũng không còn tác động được đến dư luận
    nữa sao ạ?'' và kính ngữ ''ạ'' khi Tanya hỏi Rudersdorf."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & tình thái giả định: giữ tên ''Zettour'' và tình thái
    suy đoán ''Hẳn Zettour sẽ có đôi lời nhận xét về việc cái chết trở nên hiện diện
    ở khắp mọi nơi thế này đấy.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ tương phản: giữ thuật ngữ ''chiến tranh tổng
    lực'', ''chuyển đổi mô thức'' (P03-paradigm-shift) và thế đối lập với hệ quả ''đẩy
    xã hội đến chỗ tự làm tê liệt cảm giác của mình''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Chuỗi liệt kê danh ngữ & thuật ngữ: giữ ''chế độ phân phối theo
    định lượng'', ''tiền tuyến'' và nhịp liệt kê bốn biểu hiện của chiến tranh tổng
    lực."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Đại từ hội thoại & nhấn mạnh khẳng định: giữ đại từ tự xưng ''Tôi''
    và sắc thái nhấn mạnh ''thực sự nghĩ rằng vẫn có thể tìm thấy chút hy vọng''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Thán từ hỏi ngắn: giữ câu hỏi ngắn ''Hử?'' của Rudersdorf."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Điều kiện phủ định & câu hỏi tu từ lễ phép: giữ mệnh đề điều kiện
    phủ định ''Nếu họ không bị cảm xúc chi phối'', cụm ''lấy logic và lý trí làm trọng
    tâm'' và đuôi câu hỏi ''sao ạ?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép theo DEC-P01-001: giữ đại từ tự quy chiếu nội tâm
    ''mình'' ở câu đầu và tên riêng ngôi thứ ba ''Tanya'' ở câu sau."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Nhận định độc thoại ngắn: giữ ''Đáng buồn thay, trò chuyện vốn
    là một việc đầy lắt léo.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô hội thoại: giữ cách gọi ''Trung tá'' và đại
    từ ngôi thứ hai ''cô'' trong câu mắng trực diện của Rudersdorf."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ đại từ tự quy chiếu ''mình'' (DEC-P01-001)
    và nhận định ''Đó là một lời bác bỏ cay nghiệt.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Xưng hô cấp dưới – cấp trên & nét lắp bắp: giữ nhịp ngập ngừng
    ''T—Thứ lỗi cho tôi'', danh xưng ''thưa Tướng quân'', đại từ ''ngài'' và kính
    ngữ ''ạ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại: giữ đại từ ''cô'' và giọng khẳng định thẳng
    thừng của Rudersdorf."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép theo DEC-P01-001: giữ đại từ nội tâm ''mình'' ở
    câu đầu và tên riêng ''Tanya'' ở câu trần thuật mô tả biểu cảm gương mặt."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & tương phản: giữ đại từ ''Cô'', thuật ngữ
    ''chiến tranh tâm lý'' và thế đối lập ''có thể tiến hành chiến tranh tâm lý nhưng
    vẫn chẳng thể thấu hiểu được lòng người''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Danh xưng nghi vấn: giữ ''Thưa Tướng quân?'' khi Tanya hỏi lại
    cấp trên."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & cảm thán nội tâm: giữ tên riêng ''Tanya'', ''Rudersdorf''
    và câu cảm thán ngắn có dấu ba chấm ''Thật… bẽ mặt làm sao.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: giữ tên ''Tanya'' và mức độ nhấn mạnh
    kép ''vô cùng, đến tột độ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, mệnh lệnh & ẩn dụ đồ thị cảm xúc: giữ đại từ ''Cô'',
    khái niệm ''lẽ thường'' và nhận định ''Một khi đã vượt qua ngưỡng nhất định, cơn
    phẫn nộ sẽ chững lại ở đỉnh điểm.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["So sánh giả định & trần thuật: giữ cụm ''hai người'', tên ''Rudersdorf'',
    đại từ ''ông'' và vẻ mặt ''bình thản một cách khác thường''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Định nghĩa khái quát trong thoại: giữ đối sánh giữa ''Cơn thịnh
    nộ thực sự'' và ''sự tĩnh lặng kỳ lạ bao trùm lấy một người sau khi họ đã vượt
    quá giới hạn chịu đựng của mình''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & tương phản chi tiết: giữ đại từ ''ông'', danh xưng
    ''vị tướng'', dấu ba chấm và chi tiết đối lập ''trông vẫn điềm tĩnh như mọi khi…
    nhưng đôi bàn tay ông lại đang run rẩy''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & giả định phản thực tế: giữ đại từ ''mình''
    (DEC-P01-001) và cấu trúc giả định ''Giá mà mình có thể tin rằng đó đơn thuần
    là do tuổi tác thì lại là chuyện khác.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Điệp cấu trúc, dấu ba chấm & đại từ tự xưng: giữ phép lặp ''Chừng
    nào... còn gào thét được'', mốc chuyển biến ''chạm đáy tuyệt vọng và ngừng kêu
    khóc…'' và đại từ tự xưng ''Tôi'' của Rudersdorf."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, câu hỏi nội tâm & phủ định: giữ đại từ ''ông'', câu
    hỏi ''Đó là… nỗi sợ ư?'', đại từ tự quy chiếu ''Mình'' và khẳng định bằng phủ
    định ''chẳng còn lời giải thích nào khác cả''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép (DEC-P01-001), nhấn mạnh Markdown (DEC-P01-002)
    & thuật ngữ: giữ ''Cấp trên của cô'', các thuật ngữ ''sĩ quan tác chiến'', ''Bộ
    Tổng tham mưu'', ''sĩ quan cấp tá'', tên ''Tanya'', đại từ nội tâm ''Mình'' và
    dấu nhấn mạnh ''*hoảng sợ*''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Giả định phản thực tế quá khứ & điểm nhìn nội tâm: giữ đại từ
    ''mình'' (DEC-P01-001), cụm ''ý chí tự do cùng cái tôi hiện đại kiên định'' và
    cấu trúc điều kiện ''Nếu không nhờ có... hẳn cũng đã đẩy mình rơi vào...''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Định danh ám chỉ Being X: giữ cụm ''mánh khóe của kẻ lừa đảo đó
    đã bị vạch trần''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Trần thuật hành động: giữ tên ''Tanya'', đại từ ''cô'' và chuỗi
    cử chỉ hít sâu, lắc đầu lấy lại bình tĩnh."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại & câu hỏi: giữ danh xưng ''Thưa Tướng quân'',
    đại từ ''chúng ta'' và đuôi câu hỏi ''không ạ?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Đại từ hội thoại, ẩn dụ & song hành cảm xúc: giữ đại từ ''tôi'',
    ''chúng ta'', ''ông'', phép ví von ''như dung nham chịu áp suất cực đại'' và cặp
    trạng thái song hành ''vừa khiến người ta phải kính sợ, vừa làm người ta phải
    khiếp hãi''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép theo DEC-P01-001 & phủ định: giữ đại từ ''ông'',
    tên ''Tanya'' ở câu trần thuật đầu và đại từ tự quy chiếu ''mình'' ở câu nhận
    định nội tâm thứ hai."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & câu bỏ lửng: giữ ''Bản thân Tanya'', đại từ ''cô'',
    mệnh đề giả định mong ước và dấu ba chấm bỏ lửng ''nhưng…''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn: giữ ''Đáng buồn thay, ngoài kia lại có những kẻ
    ngốc.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Tình thái & tự quy chiếu ngôi thứ ba: giữ cụm ''Đám ngu xuẩn đó
    đã hết thuốc chữa rồi'' và phép so sánh ''đáng gờm hơn những gì một cá nhân có
    lương tri như Tanya có thể hình dung''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Danh xưng, tình thái khả năng & câu hỏi xác nhận: giữ danh xưng
    ''Tướng quân'', tình thái ''thực chất có thể đang che giấu một thứ sắp sửa phát
    nổ'' và kính ngữ ''sao ạ?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Ví von khẳng định: giữ ''Ngay cả thuốc súng cũng rất ổn định cho
    đến trước khi nó phát nổ.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện: giữ ''sĩ quan pháo binh'', ''kỹ sư công
    binh'' và điều kiện ''chừng nào chúng chưa phát nổ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & câu hỏi lễ phép: giữ đúng phạm
    vi in nghiêng ''*Ta sẽ giết ngươi*'' theo thẻ em của nguồn và đuôi câu hỏi ''không
    ạ?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tương phản phạm vi & kết luận phê bình: giữ dấu ba chấm
    mở đầu, thế đối lập giữa ''Trên chiến trường'' với ''những cuộc thảo luận về đại
    sự quốc gia'', cụm ''lối tư duy cứng nhắc'' và câu kết ''Tôi thất vọng về cô đấy.''."]'
