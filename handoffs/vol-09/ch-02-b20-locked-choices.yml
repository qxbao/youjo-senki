source_sha256: 6e752589ca5a3bd4200a77b72f89a3f7a99ab03d9c14717b32151e8e5f6cb549
source_package_sha256: 00ea2283b7bdf845d27a5b9b1723b6c0e023c8894e0bb5bfdf5ddbdea00f20ab
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 33
segment_id_start: YS-LN09/Text/chapter008.xhtml/p000069
segment_id_end: YS-LN09/Text/chapter008.xhtml/p000101
choices:
- segment_id: YS-LN09/Text/chapter008.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Trần thuật chuyển ý: giữ tên ''Tanya'' và nhận định ''nhận ra
    một điều khác nữa''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Phạm vi giới hạn: giữ cấu trúc chỉ định giới hạn ''chỉ phát ra
    từ những người trong đoàn đưa tang''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Tương phản biểu hiện – bản chất & đại từ khái quát: giữ sự đối
    lập giữa cử chỉ bề ngoài (''chỉ nhường đường lấy lệ cho có hình thức và cúi đầu
    tỏ vẻ lịch sự'') với thái độ thực chất bên dưới (''một sự thờ ơ nào đó'', ''vẻ
    quen thuộc đến mức chai sạn trong từng cử chỉ'') cùng đại từ khái quát ''người
    ta''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & giả định phản thực tế quá khứ: giữ chi tiết nhóm
    binh lính đang trong giờ nghỉ chào kiểu nhà binh thuần thục, tên ''Tanya'', đại
    từ ''cô'' và cấu trúc giả định phản thực tế ''Nếu bản thân Tanya đang đi ngang
    qua vì công chuyện khác, hẳn cô cũng sẽ giơ tay chào kèm một lời cầu nguyện thầm
    như thế.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Phủ định giới hạn: giữ cấu trúc ''chẳng còn là gì ngoài những
    phép xã giao đã được rèn giũa thành thói quen''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thoại lẩm bẩm: giữ dấu ba chấm và câu nhận thức ''…À, giờ thì
    tôi hiểu rồi.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["So sánh giả định: giữ nhận định ''nỗi đau thương đã trở thành
    chuyện thường ngày'' và mệnh đề ''cứ như thể đó chỉ là một phần tất yếu nữa của
    phép lịch sự nơi chốn văn minh''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Điều kiện phủ định & thuật ngữ: giữ đại từ ''chúng ta'', thuật
    ngữ ''tử sĩ'' và điều kiện loại trừ ''—miễn là chúng ta không phải liên tục tổ
    chức tang lễ cho các tử sĩ.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Tương phản không gian – thời gian: giữ phép đối lập giữa ''Ở đất
    nước Nhật Bản thanh bình'' (''số người chết lên tới hàng chục trong một ngày đều
    sẽ được đưa tin dồn dập không ngừng'') và ''tại đế đô ngày hôm nay'' (''những
    con số thương vong đã mất hết mọi ý nghĩa'')."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["So sánh mức độ & thuật ngữ: giữ so sánh ''gợi lên mức độ quan
    tâm ngang với chuyện thời tiết'' và thuật ngữ ''thực phẩm thay thế''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & so sánh: giữ ''những cỗ quan tài tử sĩ'',
    tên ''Tanya'', thuật ngữ ''tiền tuyến'', mệnh đề phủ định ''nơi người ta còn chẳng
    có thời gian để chôn cất tử tế từng thi thể một'' và phép so sánh ''thấy buổi
    lễ này khác thường hơn cả những người dân thường''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn: giữ ''Đây là một cảm thức bình thường đã bị bóp
    méo.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối sánh không gian: giữ sự phân biệt giữa ''tính
    hợp lý'' (''rationality'') và ''Lý trí'' (''reason''), thế tương phản giữa ''Tuyến
    đầu xa xôi nhất'' với ''hậu phương'', cùng nhận định ''sự hỗn loạn chỉ ngày một
    lớn dần''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán trầm ngâm: giữ ''…Cảnh này có gì đó thật bi thảm.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, tình thái suy đoán & mệnh lệnh ngắn: giữ tên ''Tanya'',
    ''Rudersdorf'', đại từ ''ông'' – ''cô'', tình thái ''hẳn Rudersdorf đã quyết định
    rằng ông cho cô xem thế là đủ rồi'' và câu thoại ''Đi thôi.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp lễ phép với cấp trên: giữ ''…Vâng ạ.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Phủ định & mô tả không gian: giữ phủ định ''Không cần phải chen
    ngược qua đám đông'', chi tiết ''vài cái cúi đầu nhẹ với nhóm người thưa thớt
    xung quanh'' và câu kết ''Bất kể ngoài tiền tuyến ra sao, những khu vực khác vẫn
    khá thông thoáng.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''nơi cử hành tang lễ'', tên ''Rudersdorf'' và
    trạng thái ''vẫn giữ vẻ im lặng''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Chuỗi hành động trần thuật: giữ đại từ ''Ông'', chi tiết ''lấy
    một điếu xì gà, đưa lên miệng rồi vừa phì phèo khói vừa sải bước đi''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, phủ định & đại từ: giữ dấu ba chấm ''có vẻ… bực dọc'',
    phủ định ''dường như cũng chẳng nhận ra sải chân của mình dài hơn Tanya'' và kết
    quả ''cô đành phải chạy bộ lúp xúp để theo kịp''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nhận xét & phủ định: giữ ''những vị cấp trên'', phủ
    định ''chẳng mấy để tâm đến những chi tiết nhỏ nhặt thế này…''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Tình thái phỏng đoán & phủ định: giữ ''Hoặc có lẽ đơn giản là
    họ không còn tâm trí đâu mà bận tâm nữa…''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc đối chiếu hai khả năng & điều kiện: giữ sự phân biệt
    giữa ''Vế đầu thì dở tệ vì những lý do hiển nhiên rồi'' với giả định điều kiện
    ''nhưng nếu một người bình thường vốn chu đáo trong những chuyện thế này lại buộc
    phải phớt lờ nó vì hoàn cảnh không cho phép… thì đó mới là một vấn đề nghiêm trọng
    hơn nhiều.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Địa danh & danh xưng trần thuật: giữ ''Phố Chính'' và ''vị tướng
    cuối cùng cũng dừng chân''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại: giữ đại từ ''Cô'' trong câu hỏi ngắn ''Cô thấy
    thế nào?'' của Rudersdorf với Tanya."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Cụm danh từ trần thuật: giữ ''Một câu hỏi đột ngột hoàn toàn không
    chút rào đón hoa mỹ.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Đại từ hội thoại, thuật ngữ & câu hỏi tu từ: giữ đại từ ''tôi''
    / ''mình'', ''chúng ta'', thuật ngữ ''hậu phương'', ''đế đô'', ''luyện ngục''
    và câu hỏi cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & quan hệ nhân quả: giữ đại từ ngôi thứ hai
    ''cô'', quân hàm ''Trung tá Uger'', đại từ tự xưng của Rudersdorf (ưu tiên đổi
    ''ta'' thành ''tôi'' theo khuyến nghị minor để đồng bộ với lô ch-02-b18) và cấu
    trúc nhấn mạnh thời điểm nhận thức ''Phải đến lúc ấy... mới thực sự nhận ra''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Đại từ hội thoại & thành ngữ: giữ đại từ ''Tôi'' và câu ''Xem
    ra đúng là trăm nghe không bằng một thấy.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: giữ đại từ tự quy chiếu ''mình''
    (DEC-P01-001), tên ''Uger'' và thuật ngữ ''kỹ năng tạo dựng đồng thuận xuất sắc''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Phủ định đối lập & đánh giá nội tâm: giữ cấu trúc đối lập ''không
    dùng lối vượt cấp để lay chuyển người khác mà buộc họ phải tự thấu hiểu bằng trực
    giác'', đánh giá ''Tài thu phục lòng người... thực sự là một báu vật'' và dự đoán
    ''Chắc chắn... sẽ còn tiến xa''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & lập luận thực dụng: giữ đại từ ''mình'' (DEC-P01-001),
    sự chuyển hướng ý định từ ''từng định gạt... khỏi cuộc đua thăng tiến'' sang ''giữ
    quan hệ tốt đẹp'', cùng chuỗi liệt kê ''lãng phí sức lực, vốn liếng và thời gian''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép theo DEC-P01-001 & điều kiện: giữ sự song hành giữa
    đại từ nội tâm ''mình'' (''mình cũng muộn màng nhận ra rằng'') và tên riêng ngôi
    thứ ba ''Tanya'' (''đưa ra lời cảnh báo cho Tanya này''), cùng kết luận ''xứng
    đáng được xem xét kỹ lưỡng hơn là chỉ nhìn nhận qua loa''."]'
