segment_id_start: YS-LN09/Text/chapter008.xhtml/p000001
segment_id_end: YS-LN09/Text/chapter008.xhtml/p000037
choices:
- segment_id: YS-LN09/Text/chapter008.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tương phản không gian: giữ đại từ tự quy chiếu ''mình'',
    thuật ngữ ''tiền tuyến'' và thế đối lập giữa việc cúi người nơi chiến trường với
    khi đứng thẳng giữa đám đông."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & lập luận nhân quả: giữ đại từ ''mình'' và
    cách tự trấn an ''được tối ưu hóa cho chiến trường''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Phủ định & cấu trúc song hành: giữ cụm ''không được tối ưu hóa
    cho một cảnh quan đô thị văn minh''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại: giữ đại từ ''Cô'' khi Trung tướng Rudersdorf
    hỏi Tanya."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giọng thoại lễ phép: giữ nét ngập ngừng và kính ngữ
    ''tiếc là từ chỗ này thì không ạ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái trêu chọc: giữ cặp đại từ ''tôi'' – ''cô''
    và hình ảnh ''nhấc bổng cô lên ngồi trên vai''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép & thuật ngữ: giữ sự chuyển dịch điểm nhìn từ ''cấp
    trên của cô'' sang ''đang lấy mình ra làm trò cười'' theo đúng nguyên bản, cùng
    thuật ngữ ''sĩ quan tham mưu''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn tách biệt theo DEC-P01-001: giữ đại từ ''Mình'' ở vế
    đầu và tên riêng ''Tanya'' ở vế thừa nhận ngoại hình."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Xưng hô cấp dưới – cấp trên: giữ cặp đại từ ''tôi'' – ''ngài''
    trong câu hỏi vặn lại của Tanya."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại: giữ cặp đại từ ''Cô'' – ''tôi'' và giọng đáp
    tỉnh bơ của Rudersdorf."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ quân sự & đại từ: giữ đại từ ''mình'', ''ông'', danh xưng
    ''vị tướng'' và hình ảnh ''hàng phòng ngự của vị tướng vẫn bất khả xâm phạm''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ triết học & mức độ ưu tiên: giữ cặp khái niệm ''động
    vật chính trị'' – ''động vật xã hội'', đại từ ''mình'' và cấu trúc ''thà làm bất
    cứ việc gì khác còn hơn là phải ngồi lên vai ông''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng: giữ ''…Không, ờ…''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Xưng hô hội thoại: giữ cặp đại từ ''cô'' – ''tôi'' và câu khẳng
    định ''Tôi đủ sức mà.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phản ứng cơ thể: giữ đại từ ''Ông'', ''mình'' và chi
    tiết ''sống lưng mình gần như đông cứng lại''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Chuỗi giả định & tình thái: giữ hai câu điều kiện liên tiếp, đại
    từ ''ông'' – ''mình'' và kết luận ''chắc chắn lựa chọn duy nhất của mình là kính
    cẩn từ chối''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại ngoại giao: giữ cặp đại từ ''Tôi'' – ''ngài''
    và lời từ chối khéo ''hoàn cảnh hiện tại đòi hỏi sự chừng mực nhất định. Có lẽ
    xin hẹn dịp khác vậy.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & câu hỏi nội tâm: giữ tên ''Rudersdorf'', đại từ ''mình''
    – ''ông'' và câu hỏi nghi vấn về thái độ của ông tại đám tang."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn tách biệt theo DEC-P01-001: giữ đại từ ''mình'', ''ông''
    và cách tự quy chiếu ngôi thứ ba ''những người đến đây vì công việc như Tanya''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ đại từ ''ông'' và câu hỏi ''Bộ ông vụng về
    trong giao tiếp xã hội hay gì sao?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ không gian & giả định: giữ ''Ở hậu phương'', ''các phép
    tắc xã giao'', đại từ ''mình'' và dự đoán ''các quý ông và quý bà xung quanh sẽ
    tự khắc nhường đường thôi''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Liên văn bản & lời kêu gọi: giữ phép so sánh ''Rudersdorf hẳn
    thấy bản thân hơi giống Moses'' và câu thoại trích dẫn ''Làm ơn, cô bé này đang
    cố nhìn xem…''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ sân khấu & hành động: giữ hình ảnh ''vở kịch gượng gạo này''
    và đại từ ''mình''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Nội tâm hành động: giữ đại từ ''mình'' và chi tiết ''tầm nhìn
    liền mở rộng ra''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán & thuật ngữ: giữ nhận định ''hẳn là một đòn
    khích tướng'' và cụm ''Đám sĩ quan tham mưu''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Nhận định khẳng định: giữ ''Đúng vậy, vấn đề của giới sĩ quan
    tham mưu chính là ở chỗ đó.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Quan hệ kết quả: giữ đại từ ''mình'' và câu ''Dẫu sao thì kết
    quả là giờ mình đã nhìn thấy được rồi.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn kép theo DEC-P01-001: giữ tên ''Tanya'' và đại từ ''cô''
    ở hai câu trần thuật đầu, rồi chuyển sang đại từ ''mình'' ở câu bộc lộ nội tâm
    cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ công nghiệp & thuật ngữ: giữ ''miền đông'', ''trung tâm
    gia công chính'' và ''tử sĩ''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kinh tế & không gian: giữ sự phân biệt ''Mặt trận phía
    đông'', ''đế đô'', ''Thủ đô'', cặp ''xuất khẩu nguyên liệu thô và nhập khẩu tử
    sĩ'' cùng thuật ngữ ''thương mại gia công''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ đại từ ''mình'', các danh từ ''thủ đô'',
    ''tiền tuyến'' và cụm ''những bộ tang phục dân sự màu đen''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Câu ngắn chuyển ý: giữ ''Nhưng chỉ có thế mà thôi.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Phủ định mục đích: giữ ''Chẳng có lý do thực sự nào để phải đứng
    đây nghiên cứu cảnh tượng này cả.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ dẫn ngắn: giữ ''…Nhìn họ kìa.''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Trần thuật quan sát & thuật ngữ: giữ tên ''Tanya'', thế đối sánh
    giữa ''mặt trận phía đông'' và ''đội tiêu binh danh dự'' tại thủ đô."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Thán từ nghi vấn: giữ ''Hửm?''."]'
- segment_id: YS-LN09/Text/chapter008.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & tình thái suy đoán: giữ tên ''Tanya'', nhịp ngắt
    ''—biết nói sao nhỉ—'', phỏng đoán ''Có lẽ họ không đến mức thở dốc'' và quan
    sát ''rõ là họ đang phải gồng mình hết sức''."]'
