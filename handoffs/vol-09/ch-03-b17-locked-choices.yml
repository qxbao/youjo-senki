segment_id_end: YS-LN09/Text/chapter010.xhtml/p000688
choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000660
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & ngoặc kép: giữ đại từ ''họ'', cụm ''những mệnh lệnh
    kỳ lạ từ cấp trên'' và dấu ngoặc kép quanh từ ''“sửa chữa”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000661
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ kỹ thuật tàu ngầm: giữ ''thiết bị phụ trợ
    khổng lồ, đầy bí ẩn'', lý do phản đối ''làm ảnh hưởng đến tốc độ lặn dưới nước'',
    chủ thể ''các đội thợ ụ khô'' và cụm trong ngoặc kép ''“cải hoán đặc biệt”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000662
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & ngoặc kép: giữ sự đối lập giữa thái độ phản
    đối kịch liệt của các chỉ huy tàu với việc ''các đơn vị tàu ngầm, trong một động
    thái hiếm hoi, đã bị buộc phải răm rắp tuân theo mà không nhận được bất kỳ lời
    giải thích nào ngoài lý do duy nhất rằng đó là “mệnh lệnh”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000663
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc câu cảm thán ''*Cái quái gì thế này?*''
    bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000664
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhấn mạnh Markdown: giữ ''những hành khách đi nhờ
    và thủy thủ đoàn trên chiếc tàu ngầm mẹ'', mục đích ''phục vụ cho thứ vũ khí mới'',
    ''mang theo V-2'', chỉ bọc ''*Mấy gã này mất trí cả rồi*'' bằng dấu sao theo DEC-P01-002
    và không thêm nhấn mạnh tại vị trí thẻ neo trang page-152."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000665
  kind: terminology_and_voice
  value: 'choices=["Trần thuật tăng tiến & thuật ngữ: giữ ''Các pháp sư trên không
    sắp bị nhét vào trong những thứ đó cũng hoàn toàn tán đồng'' và ''ngay cả các
    kỹ sư của Xưởng Kỹ thuật cũng phải bán tín bán nghi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000666
  kind: terminology_and_voice
  value: 'choices=["Trần thuật khẳng định duy nhất: giữ ''Người duy nhất tràn trề
    tự tin chính là nhà phát minh ra nó.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000667
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, chức danh & sắc thái mỉa mai: chỉ bọc ''*Các
    người định làm trò này thật đấy à?*'' bằng dấu sao theo DEC-P01-002, giữ ''Kỹ
    sư trưởng Schugel vẫn dẫn đầu Xưởng Kỹ thuật'' và chi tiết tiễn đưa ''với ba tiếng
    hô vạn tuế, đinh ninh rằng chúng sẽ hoạt động y hệt như thiết kế''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000668
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: chỉ bọc ''*thực sự*'' bằng dấu
    sao theo DEC-P01-002 và giữ ý ''khiến người ta muốn bỏ quách công việc cho xong''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000669
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế quá khứ, đại từ & nhấn mạnh Markdown: giữ
    cấu trúc điều kiện quá khứ (''Nếu ngay khoảnh khắc ấy… chắc mình đã… rồi''), thuật
    ngữ ''những chiếc Jabo của Khối Thịnh vượng chung'', đại từ tự quy chiếu ''mình''
    theo DEC-P01-001 và chỉ bọc ''*chúng nó*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000670
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ nhân quả: giữ nhận xét ''Giấc mộng tưởng
    ấy có phần hơi thiên vị quân địch quá mức đối với một người đang đứng trên tàu
    chiến'' và hệ quả cho thấy ''Tanya phải chịu áp lực tinh thần lớn đến nhường nào
    vào thời điểm xuất phát''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000671
  kind: terminology_and_voice
  value: 'choices=["Chuyển đổi điểm nhìn ngôi thứ ba – ngôi thứ nhất theo DEC-P01-001:
    giữ đại từ trần thuật ''Nó'' ở vế đầu (''Nó đã bị phân tâm, cứ nhìn đăm đăm đầy
    ủ dột về phía cầu cảng'') và đại từ tự quy chiếu ''mình'' ở vế sau (''đến chính
    mình cũng phải ngạc nhiên không hiểu sao lúc ấy mình lại đãng trí đến thế'')."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000672
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm: giữ đại từ ''mình'' trong ''Ý mình là, tàu
    ngầm đi chậm thật đấy.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000673
  kind: terminology_and_voice
  value: 'choices=["So sánh vận tốc & thuật ngữ: giữ ''chẳng nhanh hơn mười hải lý
    mỗi giờ là bao'', sự tương phản với ''một pháp sư trên không thường xuyên di chuyển
    ở vận tốc nhiều hơn thế cả một chữ số'' và hệ quả ''Phải mất một lúc khá lâu mới
    ra xa bờ đủ để cảnh vật xung quanh thay đổi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000674
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: giữ đại từ ''nó'' và câu ''Nhưng đó không
    phải là điều duy nhất làm nó bận tâm.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000675
  kind: terminology_and_voice
  value: 'choices=["Trần thuật tình huống: giữ sự đối lập ''dù chiến dịch mới chỉ
    vừa bắt đầu, mọi thứ lại đang diễn ra đúng theo lịch trình'' và chi tiết ''Binh
    lính hòa vào cùng các nhân sự trực ban để hỗ trợ việc cảnh giới''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000676
  kind: terminology_and_voice
  value: 'choices=["Thoại độc bạch & dấu câu: giữ dấu chấm lửng mở đầu, đại từ ''Mình''
    – ''chúng ta'' và phủ định ''không nghĩ là chúng ta từng có lần nào đi đúng lịch
    trình đến mức này đâu''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000677
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn ngôi thứ nhất: giữ đại từ ''mình'', hành động ''Nở một
    nụ cười chua chát, mình phóng tầm mắt ra vùng biển rộng'' và chi tiết ''ngắm nhìn
    bọt nước tung trắng xóa trên vệt sóng rẻ quạt phía sau đuôi tàu ngầm''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000678
  kind: terminology_and_voice
  value: 'choices=["Liên hệ chiến trường cũ & không thêm nhấn mạnh: giữ sắc thái mỉa
    mai ''những buổi hẹn chơi bất thường với lũ Cộng sản trên vùng đồng bằng mênh
    mông ở miền đông'' và không thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-153."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000679
  kind: terminology_and_voice
  value: 'choices=["Thoại độc bạch & ẩn dụ: giữ đại từ ''Chúng ta'' – ''mình'', phép
    so sánh ''một hạt cát giữa đại dương xanh thẳm bao la'' chuyển sang ''một nhúm
    cát'' vì đi theo đội tàu ngầm, và câu kết ''Biển cả đúng là quá đỗi mênh mông.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000680
  kind: terminology_and_voice
  value: 'choices=["So sánh địa bàn & thuật ngữ tác chiến: giữ đối sánh ''Mặt trận
    phía đông'' với ''Nội hải'', thuật ngữ ''Các nhiệm vụ tàu ngầm tìm và diệt'' và
    nhận định của Tanya rằng ''ý tưởng đi lùng kiếm kẻ địch bằng tàu ngầm nghe có
    phần hơi khôi hài''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000681
  kind: terminology_and_voice
  value: 'choices=["Phủ định, nhấn mạnh Markdown & thuật ngữ: giữ câu phủ định mở
    đầu ''Không phải là có ai đang chê bai tàu ngầm đâu.'', đại từ ''Mình'', chỉ bọc
    ''*Aal*'' bằng dấu sao theo DEC-P01-002 và giữ nhận định tàu ngầm Đế quốc là ''một
    mối đe dọa thực thụ đối với hạm đội của Khối Thịnh vượng chung''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000682
  kind: terminology_and_voice
  value: 'choices=["Liên hệ lịch sử hải quân & quan hệ thời gian: giữ ''gánh vác phần
    lớn trọng trách tiêu diệt tàu địch'', chủ thể ''Hải quân Đế quốc Nhật Bản, vốn
    bị ám ảnh bởi tàu ngầm hạm đội'' và mệnh đề giới hạn thời gian ''không cố ép buộc
    những kỳ vọng kiểu đó lên đầu các lính tàu ngầm của họ cho đến khi chính họ phải
    chịu áp lực nặng nề đến mức đầu óc có nổ tung ra cũng chẳng có gì lạ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000683
  kind: terminology_and_voice
  value: 'choices=["Phủ định, dấu câu & thuật ngữ: giữ phủ định ''Tàu ngầm không thể
    được sử dụng giống như các sư đoàn không quân và thiết giáp'', dấu chấm lửng sau
    ''thế nhưng…'', cụm ''Văn phòng Bộ Tổng tham mưu vốn mang nặng tư duy bộ binh''
    và ''lực lượng xung kích cơ động''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000684
  kind: terminology_and_voice
  value: 'choices=["Phân biệt mục tiêu chiến lược & phủ định: giữ ''Chiến lược đánh
    chặn của Hải quân Đế quốc Nhật Bản, dù thường bị chỉ trích là giáo điều'', sự
    đối lập ''nhằm làm suy yếu lực lượng hải quân của đối phương chứ không phải tiêu
    diệt hoàn toàn bất cứ thứ gì'' và phủ định ''Họ chưa bao giờ tuyên bố rằng mình
    sẽ giành lấy quyền kiểm soát tuyệt đối trên mặt biển.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000685
  kind: terminology_and_voice
  value: 'choices=["Câu điều kiện & tình thái: giữ ''Bộ Tổng tham mưu'', đại từ ''bọn
    mình'', thuật ngữ ''tìm và diệt lực lượng hải quân địch'' và câu lửng ''Hoặc có
    lẽ là không.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000686
  kind: terminology_and_voice
  value: 'choices=["Nhận định chuyên môn & câu điều kiện: giữ ''Các sĩ quan tham mưu
    vốn chuyên môn hóa quá mức vào tác chiến trên bộ'', ''những gã lục quân cực kỳ
    thông minh'' và hệ quả khi ''đánh đồng sức mạnh hải quân với sức mạnh lục quân''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000687
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & quan hệ nhượng bộ: chỉ bọc ''*Các
    người bị ngu à?*'' bằng dấu sao theo DEC-P01-002, giữ đại từ ''nó'' và ý ''dù
    nói ra điều đó thì thật xấc xược, nhưng nó vẫn không sao tránh khỏi cảm giác bất
    mãn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000688
  kind: terminology_and_voice
  value: 'choices=["Nhận định kết lô: giữ ''Đất liền và biển cả tuy nối liền với nhau,
    nhưng lại là hai thế giới hoàn toàn khác biệt.''."]'
