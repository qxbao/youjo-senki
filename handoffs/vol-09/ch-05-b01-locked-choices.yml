- segment_id: YS-LN09/Text/chapter018.xhtml/p000002
  kind: terminology_and_voice
  value: choices=["Khóa định danh 'U-091', quân hàm và tên 'Thiếu tá Otto von Elm',
    thuật ngữ 'tàu ngầm hạm đội tiêu chuẩn'.", "Giữ quan hệ đối lập 'Mặc dù... nhưng
    hiện tại nó lại đang công khai di chuyển nổi trên mặt biển'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000003
  kind: terminology_and_voice
  value: choices=['Giữ cấu trúc danh ngữ ngắn nhấn mạnh nghịch lý của một chiếc tàu
    ngầm tự nguyện phơi lộ bản thân.']
- segment_id: YS-LN09/Text/chapter018.xhtml/p000004
  kind: terminology_and_voice
  value: choices=["Giữ sắc thái tình thái 'có lẽ' (probably) và mục đích tạo ấn tượng
    chỉ vô hại đi ngang qua khi tiến vào vùng biển của Ildoa."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000005
  kind: terminology_and_voice
  value: choices=["Giữ giả định quá khứ 'Bất kể chuyện sẽ ra sao nếu là vào ban đêm'
    và tính bắt buộc 'Ildoa buộc phải có động thái phản hồi dù muốn hay không'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000006
  kind: terminology_and_voice
  value: choices=["Khóa tên gọi 'Bộ Tư lệnh Hải quân Ildoa' (Ildoan Navy HQ)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Khóa đúng 3 cụm nhấn mạnh Markdown theo nguồn: ''*dẫn đường*'',
    ''*những vị khách thiện chí*'', ''*quốc gia hữu hảo*''.", ''Giữ giọng mỉa mai
    về việc phát điện không mã hóa lặp đi lặp lại trên mọi kênh.'']'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000008
  kind: terminology_and_voice
  value: choices=["Khóa nhấn mạnh Markdown tại thuật ngữ '*hải đội phóng lôi*' (sau
    khi lược bỏ phần giải thích thêm 'khu trục –').", "Khóa đại từ trần thuật ngôi
    thứ ba của Tanya là 'cô' ('Tanya cùng đơn vị của cô')."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Khóa đúng 2 cụm nhấn mạnh Markdown theo nguồn: ''*sự tiếp đón
    nồng hậu*'' và ''*quốc gia trung lập hữu hảo*''.", "Khóa địa danh ''Nội hải''
    (Inner Sea) và ''Đế quốc'' (the Empire)."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Khóa đúng 2 cụm nhấn mạnh Markdown theo nguồn: ''*hộ tống*'' và
    ''*Hải quân Khối Thịnh vượng chung*''.", "Khóa thuật ngữ ''đội hình vòng tròn''
    (ring formation) và ''tàu chủ lực'' (capital ship).", "Khóa đại từ nội tâm ngôi
    thứ nhất số nhiều là ''chúng ta''."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Khóa đại từ nội tâm của Tanya: ''Mình'' (ngôi thứ nhất số ít)
    và ''chúng ta'' (ngôi thứ nhất số nhiều).", ''Giữ câu hỏi phỏng đoán pha mỉa mai
    ở cuối đoạn.'']'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000012
  kind: terminology_and_voice
  value: choices=["Khóa thuật ngữ 'hải đội phóng lôi' (đồng nhất với p000008) và cụm
    nhấn mạnh Markdown '*tình hữu nghị tươi đẹp*'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000013
  kind: terminology_and_voice
  value: choices=["Giữ nhịp điệp câu mỉa mai của độc thoại nội tâm về 'người bạn tuyệt
    vời'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000014
  kind: terminology_and_voice
  value: choices=["Khóa nhấn mạnh Markdown '*Nếu cần thiết*' (If necessary).", "Khóa
    các thuật ngữ 'trang phục lễ nghi' (ceremonial dress), 'tàu khu trục' (destroyer),
    'thuật thức phát nổ' (explosion formulas), 'những vụ nổ thứ cấp' (secondary explosions).",
    "Khóa đại từ nội tâm 'mình'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000015
  kind: terminology_and_voice
  value: choices=["Khóa cụm nhấn mạnh Markdown '*Chiếc máy bay tiêm kích này được
    chế tạo tại Khối Thịnh vượng chung*'.", "Khóa sự phân biệt giữa 'phù hiệu tròn'
    (cockade) và 'phù hiệu của Ildoa' (Ildoan insignia) cùng mạch chuyển cảm xúc từ
    kinh hãi sang nhận ra máy bay Ildoa."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000016
  kind: terminology_and_voice
  value: choices=["Khóa định danh 'Elm' và đại từ nội tâm 'mình' / 'chúng ta'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000017
  kind: terminology_and_voice
  value: choices=['Giữ nhận định khái quát về tình huống tồi tệ nhất đối với một chiếc
    tàu ngầm khi có máy bay địch ở ngay trên đầu.']
- segment_id: YS-LN09/Text/chapter018.xhtml/p000018
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc giả định trái thực tế 'Mình sẽ thấy dễ chịu hơn biết
    bao nếu chúng ta có thể bắn rụng...' và sắc thái thô ráp của 'wing-waving shitbirds'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000019
  kind: terminology_and_voice
  value: choices=["Khóa cách gọi chức danh 'Thuyền trưởng' (Captain) dành cho Thiếu
    tá Elm trong thoại của Tanya; tránh dùng đại từ 'Ông' hàm ý suy đoán tuổi tác."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Khóa cách xưng hô của Thiếu tá Elm với Trung tá Tanya: xưng ''Tôi'',
    gọi ''thưa Trung tá'' (Colonel).", "Khóa thuật ngữ ''chuông lặn khẩn cấp'' (emergency
    dive bell)."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000021
  kind: terminology_and_voice
  value: choices=["Khóa cách xưng hô trong thoại của Tanya ('Tôi' / 'chúng ta') và
    tên cơ quan 'Bộ Tổng tham mưu' (General Staff)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Giữ sự phân tách đại từ: ''Mình'' trong câu dẫn trần thuật ngôi
    thứ nhất (''Mình khẽ nhăn mặt'') và ''Tôi'' trong lời thoại trực tiếp với Elm.",
    "Khóa cách dịch ''lũ Cộng sản ở ngoài miền đông'' (the Commies out east)."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000023
  kind: terminology_and_voice
  value: choices=["Giữ câu hỏi ngắn lặp lại từ khóa 'Một cái xẻng ư?'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000024
  kind: terminology_and_voice
  value: choices=["Khóa thuật ngữ 'mặt trận phía đông' (eastern front) và 'lũ Cộng
    sản' (Commies), giữ giọng hài đen về màn giao lưu bằng xẻng."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000025
  kind: terminology_and_voice
  value: choices=["Khóa cách dịch 'theo kiểu mặt trận Rhine' (Rhine-style)."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000026
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'Mình' / 'mình' trong phần độc thoại sau câu
    thoại."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000027
  kind: terminology_and_voice
  value: choices=["Giữ nguyên cấu trúc phủ định kép 'chẳng có gì đảm bảo rằng bản
