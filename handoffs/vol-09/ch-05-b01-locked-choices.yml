    well) và đại từ nội tâm 'Mình' / 'mình'."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Giữ điểm nhìn trần thuật khách quan ngôi thứ ba: ''Tanya nhăn
    mặt.''"]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Khóa đại từ tự nhủ của Tanya: ''Mình'' và ''chúng ta'' trong câu
    độc thoại về cách hành xử thời bình."]'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000030
  kind: terminology_and_voice
  value: choices=["Khóa đại từ trần thuật ngôi thứ ba của Tanya là 'cô', tên tổ chức
    'Lục quân Đế quốc' (Imperial Army) và đại từ phiếm chỉ 'bạn' trong câu hỏi tu
    từ cuối đoạn."]
- segment_id: YS-LN09/Text/chapter018.xhtml/p000031
  kind: terminology_and_voice
  value: choices=['Giữ cấu trúc đối chiếu giữa tình trạng một quốc gia đang có chiến
    tranh và việc tiến vào cảng nước ngoài trong hòa bình.']
- segment_id: YS-LN09/Text/chapter018.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=[''Giữ đầy đủ các chi tiết nghi lễ đón tiếp tại cảng: đoàn quân
    nhạc Ildoa cử hành quốc ca hai nước, cờ Đế quốc và cờ Ildoa tung bay, trẻ em ôm
    sẵn bó hoa.'']'
- segment_id: YS-LN09/Text/chapter018.xhtml/p000033
  kind: terminology_and_voice
  value: choices=["Giữ phủ định 'Không hề có cánh phóng viên lăm lăm máy ảnh' và quan
    hệ tương phản 'Dẫu vậy, bầu không khí vẫn thật thư thái'."]
