choices:
- segment_id: YS-LN09/Text/chapter016.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=[''Bảo toàn ba lớp dấu ngoặc kép biểu thị tiếng đồng thanh đáp lệnh:
    “““Rõ!”””'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=[''Câu trần thuật mô tả phản hồi đồng loạt của toàn đơn vị: Tất
    cả mọi người đều đồng thanh đáp nhận.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=[''Cấu trúc giả định nhượng bộ về giọng điệu mệt mỏi của binh sĩ:
    Nếu có điểm gì để phàn nàn thì đó là giọng ai nấy nghe đều có chút mệt mỏi.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm tập thể (chúng mình), đại từ chỉ thuộc cấp (bọn
    họ) và thuật ngữ: bay theo đội hình ở tốc độ hành trình / cuộc hẹn hội quân với
    mấy chiếc tàu ngầm / mặt trận phía đông, nơi bất kỳ ai cũng có thể tùy ý hạ cánh'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm (mình) theo DEC-P01-001 và thuật ngữ kinh tế học:
    đầu tư vào vốn con người / Những khoản đầu tư khôn ngoan mang lại lợi tức khổng
    lồ đến khó tin.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm (mình), ẩn dụ công cụ/nhạc cụ và sắc thái tự trào:
    một bức tường thịt kha khá / Tiểu đoàn của mình đã trở thành một phần không thể
    thiếu trong bộ công cụ của mình / một cây đàn dương cầm được căn chỉnh hoàn hảo'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=[''Phủ định tuyệt đối trong nội tâm (mình) và ẩn dụ bảo hiểm: hoàn
    toàn chẳng có ý định làm kẻ ngốc / tính khoản đầu tư này như tiền mua bảo hiểm
    không hoàn lại trong lúc cẩn thận duy trì đội hình'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=[''Ẩn dụ về việc khoản phòng bị không phải dùng đến: Kết quả là
    một cú vung gậy hụt vô cùng ngoạn mục.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ quản trị/quân sự và quan hệ nhân quả: biên độ an toàn
    / cắt giảm chi phí vô điều kiện / đám nhân sự chỉ biết ngồi không ăn lương / cối
    xay thịt / Đế quốc đang trong tình trạng chiến tranh tổng lực'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=[''Giữ đúng nhấn mạnh Markdown *Hừ.* theo DEC-P01-002 và không thêm
    nhấn mạnh tại thẻ neo trang (page-179): *Hừ.* Tanya khịt mũi rồi chuyển hướng
    suy nghĩ.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=[''Phủ định dấu hiệu truy kích và đại từ nội tâm tập thể (chúng
    mình): Không có dấu hiệu nào cho thấy có kẻ bám theo chúng mình đến tận đây. Chúng
    mình đã tới điểm hẹn mà không gặp bất kỳ trục trặc nào.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=[''Câu trần thuật gắn với tên riêng Tanya: Đối với Tanya, đó chính
    đáng là một thành tựu vĩ đại.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=[''Đối lập giữa kẻ ngốc xử lý sự cố và bậc trí giả phòng ngừa sự
    cố: Kẻ ngốc đơn thuần tưởng rằng giải quyết được rắc rối là chứng tỏ mình có năng
    lực vẫn thường hay dè bỉu bậc trí giả biết ngăn chặn rắc rối xảy ra ngay từ đầu.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=[''Khẳng định so sánh bậc nhất về chiến thắng bất chiến: Nhưng ai
    mới là người thực sự thông minh thì đã quá rõ ràng. Không có chiến thắng nào tuyệt
    vời hơn việc không cần phải giao chiến.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=[''Giữ đúng phạm vi nhấn mạnh Markdown theo DEC-P01-002 và đại từ
    khái quát (bạn): bắn lên ba phát pháo hiệu / khoảnh khắc khiến tim bạn như ngừng
    đập / *Nếu quân đồng minh ở gần đây thì tốt, nhưng nhỡ có kẻ địch thì…*'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=[''Miêu tả tàu ngầm trồi lên mặt nước: May mắn thay, một con tàu
    đơn độc nhô lên khỏi mặt nước.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm (Mình) và thuật ngữ cảnh giới/tàu ngầm: Người
    lính cảnh giới nhảy vọt lên boong tàu rồi bắn phát pháo hiệu theo đúng mật hiệu
    đã giao ước / Mình ra lệnh cho binh sĩ dưới quyền đáp lại / một chiếc tàu ngầm
    của quân bạn'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=[''Nhận định giải tỏa nguy cơ trên biển: Có thể coi như nguy cơ
    bị lạc giữa biển khơi đã qua đi.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi ngập ngừng của Weiss khi quan sát tàu ngầm: “…Hử? Đó
    là…?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi của Tanya gọi cấp bậc Thiếu tá Weiss: “Có chuyện gì thế,
    Thiếu tá?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=[''Lời báo cáo lễ phép của Weiss với Tanya: “Trông nó có vẻ là một
    con tàu khác với chiếc đã chở chúng ta tới đây ạ.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật ngôi thứ ba về cảm xúc phân vân của Tanya: Trong một
    thoáng, Tanya chẳng biết nên thấy ấn tượng hay thất vọng nữa.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trần thuật về Tanya (cô) và Weiss (anh ta) cùng nhận xét
    hai mặt: phân biệt được đó là loại tàu gì dưới ánh chiều tà / Năng lực làm hoa
    tiêu cảnh giới của anh ta rất đáng khen ngợi / bị trừ điểm nặng vì thiếu kiến
    thức cơ bản về tốc độ di chuyển của tàu ngầm'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Tanya với Thiếu tá Weiss (Anh - chúng ta, Thiếu tá)
    và câu hỏi phản vấn: “…Anh nghĩ một chiếc tàu ngầm với tốc độ của nó mà lại có
    thể quay lại hội quân kịp với chúng ta sao? Thôi nào, Thiếu tá.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=[''Miêu tả phản ứng đỏ mặt của Weiss (anh ta) dưới ánh nhìn của
    Tanya: Dưới ánh nhìn thất vọng của Tanya, mặt Weiss thoáng đỏ bừng lên rõ rệt
    / chứng tỏ anh ta vẫn còn biết tự lượng sức mình'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=[''Lời khen công tâm của Tanya dành cho Thiếu tá Weiss: “Nhưng cái
    gì đáng khen thì vẫn phải khen. Mắt anh tinh đấy, Thiếu tá.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=[''Cách xưng hô của Weiss với cấp trên (Tôi - ạ) và nét tự trào:
    “…Tôi sẽ cố rèn cho cái đầu của mình theo kịp đôi mắt ạ.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=[''Nhận định nội tâm về nguyên nhân thiếu kinh nghiệm thay vì lỗi
    lầm: Một câu trả lời hết sức ngoan ngoãn. Chuyện này thực ra chỉ đơn thuần là
    thiếu kinh nghiệm chứ chẳng đến mức gọi là sai sót.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh tại thẻ neo trang (page-180); giữ đại từ
    (Chúng ta - anh) và phủ định một phần: “Chúng ta còn nhiều vấn đề về kiến thức
    cũng như kinh nghiệm. Trách nhiệm không hoàn toàn thuộc về cá nhân anh. Chỉ cần
    anh hiểu rõ sự nguy hiểm của lối tư duy hạn hẹp là được.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=[''Lập luận bác bỏ khả năng tàu ngầm vượt trước pháp sư trên không:
    …Xét đến tốc độ bay của các pháp sư trên không, đời nào một chiếc tàu ngầm xuất
    phát từ cùng một vị trí lại có thể bằng cách nào đó vượt lên trước rồi đón họ
    quay về được.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=[''Lời dặn của Tanya với Thiếu tá Weiss: “Thiếu tá Weiss, nhân cơ
    hội này hãy chịu khó làm phiền mấy cậu thủy thủ để học hỏi thêm đi. Xét theo tình
    hình chiến sự hiện nay, tìm hiểu đôi điều về biển cả cũng chẳng phải ý tồi đâu.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=[''Lời đáp nhận lệnh của Weiss với Trung tá Tanya: “Vâng, thưa Trung
    tá.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=[''Lời khen ngắn và câu trần thuật ngôi thứ ba (Cô - các thuộc cấp
    - họ): “Tốt lắm.” Cô kết thúc cuộc trò chuyện rồi bảo các thuộc cấp tháo mũ ra
    nếu họ đang đội mũ.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=[''Khẩu lệnh vẫy mũ chào tàu ngầm: “Vẫy mũ đi! Vẫy mũ lên!”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi của Trung úy Serebryakov gửi Trung tá Tanya: “Trung tá
    có nghĩ là họ nhìn thấy chúng ta không ạ?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ chức danh (viên sĩ quan phụ tá dưới quyền cô) và phán
    đoán khả năng: Câu nói xen vào của viên sĩ quan phụ tá dưới quyền cô cũng có lý.
    Xét tới lượng ánh sáng ít ỏi vào thời điểm này trong ngày, có khả năng là họ không
    nhìn thấy thật.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Tanya với Visha trong thoại (tôi - cô) và câu hỏi
    trêu chọc: “Ý cô là nếu không có ai nhìn thì cô không thể cư xử cho đúng mực được
    sao? Có cần tôi phải giáo dục lại cô không hả?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=[''Giữ nét nói lắp và xưng hô lễ phép của Visha với Tanya: “X-xin
    Trung tá tha cho tôi ạ.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=[''Cách gọi cấp bậc Trung úy Serebryakov và lời nhắc nhở trong thoại:
    “Tôi chỉ đùa thôi, Trung úy Serebryakov. Nhưng hãy thể hiện sự tôn trọng đúng
    mực đối với những người đồng đội của mình đi.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=[''Lời đáp ngắn gọn của Trung úy Serebryakov: “Rõ ạ.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm (mình) khi nói về viên sĩ quan phụ tá (Cô nàng)
    và nhận xét về sự gắn bó của cả hai: Thật khó mà biết được viên sĩ quan phụ tá
    của mình đang nói thật hay đùa nữa. Cô nàng có chút gì đó hơi bí ẩn. Đáng ngại
    thay, điều đó vẫn đúng dù cả hai đã gắn bó với nhau lâu đến thế rồi. Con người
    quả thực rất khó hiểu.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=[''Phân biệt đại từ nội tâm/trần thuật ngôi thứ nhất (mình) và đại
    từ trong thoại (Tôi - chúng ta): Đá văng những suy nghĩ vẩn vơ ngoài lề ra khỏi
    đầu, mình lại lên tiếng / “Mông của chúng ta có an toàn không đấy? Nếu chúng ta
    mà dẫn mấy kẻ biến thái lên tàu ngầm thì chỉ một bản kiểm điểm thôi sẽ chẳng đủ
    để chuộc lỗi đâu.” / Mình mỉm cười buông một câu pha trò / “Tôi không muốn bị
    mắng xối xả vì tội ép các đồng đội của chúng ta phải chia sẻ không gian chật hẹp
    với một lũ biến thái đâu nhé.”'']'
