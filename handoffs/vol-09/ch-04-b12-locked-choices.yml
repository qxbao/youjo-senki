choices:
- segment_id: YS-LN09/Text/chapter016.xhtml/p000250
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Thiếu tá Weiss khi hỏi Tanya: chúng ta / tôi'', ''Tên
    quốc gia: Ildoa'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000251
  kind: terminology_and_voice
  value: 'choices=[''Quân hàm và xưng hô Tanya gọi Weiss: Thiếu tá Weiss / anh'',
    ''Thuật ngữ chiến trường: mặt trận phía đông'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000252
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn nội tâm tự quy chiếu của Tanya và đại từ chỉ Weiss:
    mình / anh ta'', ''Tình thái suy đoán: hẳn là đã bỏ quên não ở ngoài chiến trường
    rồi'', ''Thuật ngữ kinh tế: hiệu quả chi phí'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000253
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô và mệnh lệnh trong thoại của Tanya với Weiss: Thiếu tá
    / của anh'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000254
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn tự sự ngôi thứ nhất của Tanya: Mình'', ''Chức vụ của
    Weiss: phó chỉ huy'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000255
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown khớp chính xác thẻ in nghiêng nguồn: *những
    người lính đồng minh*'', ''Phủ định kép giữ nguyên sắc thái: Đế quốc chẳng còn
    lựa chọn nào khác, nhưng cũng đâu phải là Ildoa có nhiều sự lựa chọn lắm đâu'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000256
  kind: terminology_and_voice
  value: 'choices=[''Mạch lập luận nội tâm ngắn gọn: Trò chơi vốn vận hành theo cách
    đó. Đều có luật chơi cả.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000257
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô và thuật ngữ nguyên tắc trả đũa: tương xứng / Thiếu tá'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000258
  kind: terminology_and_voice
  value: 'choices=[''Cách dịch lời đáp kính cẩn của Weiss với Tanya: Thưa Trung tá?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: lý thuyết trò chơi'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=[''Đại từ giả định chung trong câu hỏi tu từ nội tâm: bạn'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=[''Tên riêng và cấu trúc phủ định: Đế quốc / Ildoa / chẳng có lựa
    chọn nào khác ngoài việc lặng lẽ hùa theo'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000262
  kind: terminology_and_voice
  value: 'choices=[''Quân hàm và tên: Đại tá Lergen'', ''Điều kiện giả định và phủ
    định: chừng nào phỏng đoán của Đại tá Lergen không trật hoàn toàn'', ''Danh xưng
    mỉa mai: Đoàn Du lịch Thiện chí của Lục quân Đế quốc'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown toàn câu khớp thẻ in nghiêng nguồn: *Nói cách
    khác…*'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000264
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trong lời Tanya nói với Weiss: Chúng ta / họ'', ''Tình
    thái và điều kiện: biết đâu lại chính là chìa khóa / Chí ít là chừng nào cả hai
    bên còn giữ được tính hợp lý'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000265
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: Tính hợp lý / kinh tế học hành vi'', ''Đại từ nội
    tâm tự quy chiếu: chúng ta / mình'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000266
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và phủ định kép: mình / sẽ là nói dối nếu
    bảo rằng mình không cảm thấy ghen tị'', ''Quan hệ nhân quả và tình thái: vì tự
    nhiên vận hành theo các quy luật vật lý, biết đâu nó lại khá hợp lý'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000267
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ y học: phẫu thuật cắt thùy não'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000268
  kind: terminology_and_voice
  value: 'choices=[''Đại từ tự xưng của Weiss trong thoại: tôi'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000269
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh ngắn của Tanya với Weiss: Dẹp ý nghĩ đó đi, Thiếu tá.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000270
  kind: terminology_and_voice
  value: 'choices=[''Cách Weiss gọi Tanya trong câu hỏi ngắn: Thưa Trung tá?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000271
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm Tanya hướng tới Weiss với cấu trúc phủ định kép: Không
    phải là mình không hiểu cảm giác của anh / chúng ta'', ''Tên tổ chức: Lục quân
    Đế quốc'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000272
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn tự sự ngôi thứ nhất của Tanya: Mình'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=[''Tình thái suy đoán nội tâm: Hẳn đây chính là cảm giác'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000274
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu: Mình / mình'', ''Thuật ngữ cấp bậc chỉ
    Weiss: sĩ quan cấp tá'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=[''Nội tâm tự quy chiếu và câu hỏi nội tâm: Mình / liệu chính quốc
    có giữ được sự thận trọng trong các chính sách đối với Ildoa hay không?'', ''Thuật
    ngữ: Bộ Tổng tham mưu / chính quốc'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô trong thoại của Tanya với Weiss: Thiếu tá Weiss / chúng
    ta'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi lễ phép của Weiss với cấp trên: Ý Trung tá là sao ạ?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=[''Đại từ ngôi thứ hai Tanya dùng khi giải thích cho Weiss: Anh
    / anh'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=[''Mệnh đề nhận định chiến lược ngắn gọn: Giảm thiểu số lượng kẻ
    thù. Đó là chiến lược cơ bản.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000280
  kind: terminology_and_voice
  value: 'choices=[''Đại từ giả định chung trong độc thoại nội tâm: bạn'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000281
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn tự quy chiếu ngôi thứ ba bằng quân hàm và tên đầy đủ:
    Trung tá Tanya von Degurechaff'', ''Thuật ngữ quân sự: tiền tuyến / chỉ huy ngoài
    thực địa / tầng chiến thuật của chiến tranh'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000282
  kind: terminology_and_voice
  value: 'choices=[''Giữ dấu ngoặc kép biểu thị cụm từ mang sắc thái ngoại giao trong
    nguồn: “có biện pháp xử lý thích hợp”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000283
  kind: terminology_and_voice
  value: 'choices=[''Tính từ khóa trong lập luận trả đũa: tương xứng'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000284
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi tu từ phủ định của Weiss: Nhưng chẳng phải chúng ta nên
    dạy cho họ một bài học để họ không bao giờ phản bội chúng ta nữa sao?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000285
  kind: terminology_and_voice
  value: 'choices=[''Cách gọi cấp dưới trong thoại: Thiếu tá'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000286
  kind: terminology_and_voice
  value: 'choices=[''Đại từ nội tâm số nhiều và cấu trúc điều kiện phủ định: chúng
    ta / họ sẽ chẳng bao giờ muốn đàm phán hay hợp tác thêm bất cứ lần nào nữa'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000287
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trong thoại của Tanya với Weiss: Tôi / chúng ta'', ''Tên
    tổ chức và phe phái: Bộ Tổng tham mưu / Liên minh Hiệp ước'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000288
  kind: terminology_and_voice
  value: 'choices=[''Đại từ và phủ định trong nội tâm: chúng ta / Đây chẳng phải chuyện
    đáng cười đâu'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000289
  kind: terminology_and_voice
  value: 'choices=[''Phân biệt rõ đại từ tự sự nội tâm và đại từ tự xưng trong lời
    thoại của Tanya: Mình (trần thuật) / chúng ta, tôi (thoại)'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000290
  kind: terminology_and_voice
  value: 'choices=[''Lời xin lỗi của cấp dưới: …Xin thứ lỗi cho tôi.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000291
  kind: terminology_and_voice
  value: 'choices=[''Phân biệt đại từ trong thoại và trần thuật của Tanya: anh, bản
    thân tôi, Tôi (thoại) / Mình (trần thuật)'', ''Thuật ngữ: Quân đội, Bộ Tổng tham
    mưu, rồi chiến trường / hậu phương hay thời bình'']'
