segment_id_end: YS-LN09/Text/chapter010.xhtml/p000571
choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000535
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả trần thuật: giữ ''Việc không quân không đủ khả
    năng tấn công tàu chiến một cách đáng tin cậy là một vấn đề chí mạng, nên kế hoạch
    này rõ ràng cần được cải thiện.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000536
  kind: terminology_and_voice
  value: 'choices=["Lập luận trần thuật & dấu câu: giữ lý giải về ''đặc quyền riêng
    của không quân'', việc ''lực lượng tàu ngầm cũng đã được triển khai sẵn'' và dấu
    chấm lửng trong ''Tận dụng những gì sẵn có trong tay… sẽ là hướng tiếp cận trực
    tiếp nhất.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000537
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ hải quân & không thêm nhấn mạnh: giữ ''Tàu ngầm của
    Đế quốc'', ''các tuyến hàng hải của Khối Thịnh vượng chung'', tương phản giữa
    vị trí thuận lợi với độ phức tạp khi phóng ngư lôi, và không thêm nhấn mạnh Markdown
    tại vị trí thẻ neo trang page-144."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000538
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự trong thoại: giữ ''Một cuộc tiến công bằng tàu
    ngầm'', ''đơn vị thuốc nổ dưới nước'' và ''các tàu phóng lôi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000539
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái trong thoại: giữ nhận định ''Hiện tại thì
    việc đó sẽ rất khó khăn'' và ''không thể kỳ vọng nhiều trước những giới hạn kỹ
    thuật lớn đang gặp phải''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000540
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc hai phần độc thoại nội
    tâm ''*Cái gì!*'' và ''*Câu trả lời đó tiêu cực một cách đáng kinh ngạc—hơi bị
    bi quan thái quá rồi đấy chứ?*'' bằng dấu sao theo DEC-P01-002; giữ câu trần thuật
    ''Tanya khẽ nhíu mày.'' ở ngoài dấu sao."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ tương phản: giữ đại từ ''nó'' và sự đối lập
    giữa lời nói lý thuyết với thực tế ''đòi hỏi một quy trình phức tạp đến mức khó
    tin''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Trần thuật kỹ thuật: giữ chuỗi điều kiện ''tính toán các vị trí
    lý tưởng, chiếm lĩnh vùng nước phía trước mũi tàu mục tiêu'' và kết luận ''về
    cơ bản vẫn phụ thuộc vào vận may''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tính toán phần tử bắn ngư lôi: giữ đầy đủ ''hướng đi
    của mục tiêu'', ''đường chạy của ngư lôi'', ''tốc độ mục tiêu, cự ly tới mục tiêu
    và góc mạn của tàu địch'', ''ngòi nổ lẫn độ sâu'' và nhận định ''yêu cầu tấn công
    áp sát của Tanya lại là chuyện không thể đem ra bàn… Điều đó rất hợp lý.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phản thân: giữ tự nhận thức ''Tanya tự biết mình
    chẳng phải chuyên gia hải quân'' và mệnh đề tương phản về khả năng xoay chuyển
    ý tưởng, chọn hướng tiếp cận ngược lại."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện – hệ quả: giữ ''nếu họ gặp khó khăn trong việc
    bắn trúng đích, thì khiếm khuyết đó chỉ đơn giản là phải được bù đắp bằng số lượng.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Giả định toán học đơn giản hóa: giữ ''Nếu bắn một trăm phát mới
    trúng một, thì chỉ cần phóng đủ một trăm phát là mục tiêu chắc chắn sẽ trúng đạn.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Thoại đề xuất của Tanya: giữ ''“Hãy lật ngược vấn đề lại xem.
    Chúng ta có ngư lôi, đúng chứ?”'' và ý giải quyết bài toán bằng số lượng."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định trong thoại: giữ ''các phương tiện mang phóng
    tiềm năng dành cho chúng lại có hạn'' và phủ định ''không có đủ phương tiện cho
    phép tiêu diệt toàn bộ tàu chiến địch một cách chắc chắn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Nhưng hóa ra họ đã cân nhắc hết mọi phương án
    mà nó nghĩ tới rồi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Tương phản bộ phận & không thêm nhấn mạnh: giữ đối lập giữa ''Giới
    kỹ thuật'' và ''bên tác chiến''; không thêm nhấn mạnh Markdown tại vị trí thẻ
    neo trang page-145."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Họ đã vận dụng mọi biện pháp có thể nhằm cải
    thiện tỷ lệ bắn trúng thấp kém trong cả huấn luyện lẫn thực chiến.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả trần thuật: giữ ''đối với những người tham dự
    đang bị dồn vào chân tường nên mới phải tìm kiếm một ý tưởng hay và trưng cầu
    ý kiến từ thực địa, đây lại chỉ là cuộc tranh luận cũ rích.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Điều kiện giả định & tình thái: giữ ''Nếu chỉ toàn là việc nhai
    lại những đề xuất mà họ đã từng nghe qua, thì xem chừng họ sẽ chẳng thu hoạch
    được gì nhiều từ cuộc họp này.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Trần thuật chuyển nhịp: giữ ''Đúng lúc họ bắt đầu nghĩ vậy, Tanya
    khẽ lẩm bẩm điều gì đó.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phương án kỹ thuật trong thoại: giữ đề xuất ''đưa
    các pháp sư vào trong ngư lôi'', ''phóng các ngư lôi có người lái từ ống phóng'',
    ''tách rời được khỏi thân tàu ngầm'' và câu hỏi kết ''như thế thì sao?''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Nhận định trần thuật: giữ ''Trí tưởng tượng của một con người
    khi chịu áp lực quả thực không thể xem thường.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000557
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & bình luận: giữ chi tiết Tanya ''buột miệng nói ra
    điều đó một cách tự nhiên theo mạch trò chuyện'' và quy luật về những ý tưởng
    điên rồ bắt nguồn từ trạng thái tinh thần bình thường."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000558
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Người ta có thể viết cả một cuốn sách về lịch
    sử những thứ vũ khí điên rồ trên thế giới.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000559
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ lịch sử Chiến tranh Lạnh: giữ cấu trúc lặp ''Thời đại...''
    và cụm ''vũ khí hạt nhân, chiếc ô hạt nhân và sự hủy diệt lẫn nhau chắc chắn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000560
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn tiền kiếp & thuật ngữ: giữ ''Là một người về mặt kỹ
    thuật từng sống trong thời kỳ đó'' và ''Tanya thấy ngư lôi sống cũng là một kết
    luận khả thi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000561
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & liên hệ lịch sử: giữ tên nước ''Ý'', ''Nhật''
    và chỉ bọc ''*kaiten*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000562
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản ứng trong thoại: giữ ''“Cái gì cơ?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000563
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện an toàn trong thoại: giữ ''một phi công
    cùng cơ cấu điều khiển hướng lái'', so sánh ''giống như mẫu V-1 vậy'' và điều
    kiện tiên quyết ''Chỉ cần nhân sự thoát ra trước khi va chạm thì sẽ chẳng có vấn
    đề gì cả.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000564
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ đại từ ''nó'' và cụm ''ý tưởng điên
    rồ về ngư lôi sống''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000565
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & sự tự hiệu chỉnh phương châm: giữ đối lập giữa hai
    câu châm ngôn trong ngoặc kép ''“Hãy nâng niu mạng sống”'' và ''“Hãy nâng niu
    mạng sống của chính mình”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000566
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kinh tế – quân sự & không thêm nhấn mạnh: giữ ''vốn
    con người'', ''ngư lôi sống của Ý là một thứ vũ khí khôn ngoan hơn'' và không
    thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-146."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000567
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tổng hợp ưu điểm: chỉ bọc ''*kaiten*'' bằng
    dấu sao theo DEC-P01-002 và giữ thế song hành ''sức công phá hủy diệt của *kaiten*
    và tư duy bảo toàn sinh mạng của loại ngư lôi Ý''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000568
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi xác nhận trong thoại: giữ đại từ ''Cô'' và cụm
    ''thiết kế lại chúng thành loại có người lái''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000569
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ kỹ thuật trong thoại: giữ ''Việc cải hoán
    thực tế'', đại từ ''các vị'', cụm ''biến ngư lôi của hải quân thành loại có người
    điều khiển được'' và gợi ý bổ sung ''Làm cho chúng lớn hơn cũng là một ý tưởng
    khác.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000570
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & liên hệ lịch sử: chỉ bọc ''*maiali*'' bằng
    dấu sao theo DEC-P01-002 trong câu ''Những chiếc *maiali* của Ý được thiết kế
    vô cùng thực dụng.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000571
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ kết đoạn: giữ tình thái ''có lẽ chúng là
    tàu lặn mini hơn là ngư lôi…'' cùng dấu chấm lửng cuối câu."]'
