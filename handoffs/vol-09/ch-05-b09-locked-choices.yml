- segment_id: YS-LN09/Text/chapter020.xhtml/p000199
  kind: terminology_and_voice
  value: locked=Xưng hô 'tôi - chúng ta', thuật ngữ 'hậu phương' (the rear), giữ sắc
    thái giả định so sánh 'chẳng khác nào hậu phương'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000200
  kind: terminology_and_voice
  value: locked=Xưng 'tôi', giữ giọng thoại thân mật giữa hai sĩ quan tiền tuyến ('chỗ
    béo bở ngon lành').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000201
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown '*Nhưng không phải vậy.*' khớp với thẻ em trong
    nguồn; chủ ngữ 'Cả hai'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000202
  kind: terminology_and_voice
  value: locked=Meybert (Đại úy) xưng 'tôi', gọi Tospan là 'cậu' và cấp bậc 'Trung
    úy' (Lieutenant).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000203
  kind: terminology_and_voice
  value: locked=Tospan (Trung úy) gọi Meybert là 'anh' kèm tiểu từ kính ngữ 'ạ', giữ
    đúng câu hỏi xác nhận sự đồng cảm.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000204
  kind: terminology_and_voice
  value: locked=Giữ phủ định bộ phận ('chẳng phải tệ hại gì', 'không sao thấy thoải
    mái nổi'), xưng 'tôi/mình' trong lời thoại của Meybert và ngôi thứ ba 'Meybert'
    trong trần thuật.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000205
  kind: terminology_and_voice
  value: locked=Tospan gọi Meybert là 'thưa Đại úy', 'anh ... ạ'; giữ nguyên thuật
    ngữ 'Kampfgruppe' và câu hỏi tu từ phủ định ngầm.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000206
  kind: terminology_and_voice
  value: locked=Meybert gọi Tospan là 'cậu', giữ sắc thái tán đồng dè dặt ('cũng có
    lý đấy').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000207
  kind: terminology_and_voice
  value: locked=Trần thuật gọi Tanya là 'cô', gọi đối phương là 'anh ta'; giữ giả
    định trái thực tế ở quá khứ ('Nếu Tanya trông thấy... hẳn cô đã bảo...') và nhấn
    mạnh Markdown '*Ra là anh cũng nghĩ vậy sao?*'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000208
  kind: terminology_and_voice
  value: locked=Điểm nhìn trần thuật ngôi thứ ba ('Tospan và Meybert', 'họ', 'Tanya',
    'cô'), giữ quan hệ tương phản giữa vẻ ngoài thả lỏng và ánh mắt cảnh giác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000209
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'độ vênh thực địa' (field gap), 'đạo quân dã chiến' (field
    army), 'mức độ tự quyết' (some measure of discretion).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000210
  kind: terminology_and_voice
  value: locked=Tospan thưa 'Thưa Đại úy', thuật ngữ 'hậu phương' (the rear), giữ
    nhịp ngập ngừng của câu hỏi tìm từ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000211
  kind: terminology_and_voice
  value: locked=Meybert xưng 'tôi', gọi 'cậu', 'Trung úy', 'chúng ta'; trần thuật
    giữ đúng quan hệ nhân quả ('sau khi đoán ra điều Tospan đang định nói').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000212
  kind: terminology_and_voice
  value: locked=Xưng 'chúng ta', đối lập giữa 'nơi chúng ta thuộc về' và 'những người
    trở về' (returnees) biến thành 'những kẻ ngoại quốc' (foreigners).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000213
  kind: terminology_and_voice
  value: locked=Trần thuật khách quan, giữ quan hệ nhân quả việc trải qua thực chiến
    nhào nặn con người cho hợp với chiến trường.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000214
  kind: terminology_and_voice
  value: locked=Giữ chủ thể 'Meybert và Tospan' và nhận thức nhân quả về 'cảm giác
    lệch pha' (what felt off).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000215
  kind: terminology_and_voice
  value: locked=Câu hỏi lặp lại từ khóa 'Những kẻ ngoại quốc sao ạ?' với sắc thái
    lễ phép của Tospan.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000216
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc phủ định tuyệt đối của Meybert ('Chẳng còn từ nào khác
    để diễn tả nữa đâu').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000217
  kind: terminology_and_voice
  value: locked=Tospan xưng 'tôi', gọi 'anh, thưa Đại úy', giữ phủ định mức độ ('không
    hiểu rõ lắm', 'không thể dễ dàng diễn tả...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000218
  kind: terminology_and_voice
  value: locked=Meybert gọi 'cậu', 'Trung úy Tospan' (Lieutenant Tospan), giữ câu
    hỏi thăm dò mức độ hòa nhập.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000219
  kind: terminology_and_voice
  value: locked=Tospan xưng 'tôi ... ạ', giữ từ khóa trong ngoặc đơn '‘ngoại quốc’'
    liên kết với p000212/p000215 và sự nhượng bộ ('Dù nói thế, quả thật...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000220
  kind: terminology_and_voice
  value: locked=Trần thuật ngôi thứ ba ('Tospan', 'Meybert', 'Họ'), thuật ngữ 'mặt
    trận phía đông' (eastern front), giữ tình thái khả năng ở câu cuối ('có thể không
    giống nhau').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000221
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc danh ngữ liệt kê và tình thái phỏng đoán ('có lẽ').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000222
  kind: terminology_and_voice
  value: locked=Meybert hỏi Tospan ('cậu - tôi'), giữ câu hỏi xác nhận cảm giác lạc
    lõng/lệch pha.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000223
  kind: terminology_and_voice
  value: locked=Tospan đáp lễ phép ('À, vâng, có chứ ạ'), xưng 'tôi', giữ mệnh đề
    chêm '—Tospan gật đầu—' và phủ định ('chẳng tài nào thả lỏng được').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000224
  kind: terminology_and_voice
  value: 'locked=Trần thuật ngắn gọn: ''Có một khoảng cách.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000225
  kind: terminology_and_voice
  value: locked=Giữ tính từ phủ định khả năng 'không thể dung hòa' (irreconcilable).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000226
  kind: terminology_and_voice
  value: locked=Chủ thể 'Meybert và Tospan', đại từ 'họ', giữ sự đối lập giữa việc
    hoàn toàn nhất trí và việc 'không sao ổn định tâm lý nổi'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000227
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'mặt trận phía đông' (eastern front), 'thành phố cảng' (port
    city), 'đồn trú' (garrison), 'đợt luân chuyển rời tiền tuyến' (rotation off the
    front).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000228
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'tiền tuyến mặt trận phía đông' (eastern front lines), 'vùng
    hậu phương' (rear area), 'chính quốc' (home country).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000229
  kind: terminology_and_voice
  value: locked=Đại từ 'họ', giữ ẩn dụ 'một chuỗi nối tiếp những bất ngờ mới mẻ cùng
    những phen lúng túng ngượng ngùng'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000230
  kind: terminology_and_voice
  value: locked=Giữ tình thái 'đáng lẽ họ phải thuộc về' (should have belonged) và
    khẳng định thực tế ('quả thực cũng xuất thân từ...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000231
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'lãnh thổ chiếm đóng' (occupied territory), 'Cộng hòa cũ'
    (former Republic), 'chính quốc' (home country), giữ dấu ngoặc kép quanh từ '“hòa
    bình”'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000232
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'nhiệm vụ cảnh giới' (security missions), 'mặt trận phía
    đông' (eastern front), 'quân du kích' (partisans), 'lãnh thổ chiếm đóng' (occupied
    territory), giữ ngoặc kép '“ngăn ngừa rắc rối”'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000233
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'khu vực cấm' (restricted zone), 'Kampfgruppe Lergen' (Lergen
    Kampfgruppe), 'bãi lầy miền đông' (quagmire of the east), 'nhiệm vụ bộ binh' (infantry
    missions).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000234
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'sổ tay an ninh' (security manual) và tên chương trong ngoặc
    kép '“Quy tắc Xử lý Dân thường Khả nghi”'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000235
  kind: terminology_and_voice
  value: 'locked=Thuật ngữ sinh hoạt quân ngũ: ''tiếng kèn báo thức'' (bugle call),
    ''doanh trại'' (barracks), ''giờ tắt đèn'' (lights out).'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000236
  kind: terminology_and_voice
  value: locked=Thuật ngữ 'cuộc sống doanh trại' (barracks life) vận hành theo đồng
    hồ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000237
  kind: terminology_and_voice
  value: locked=Giữ phủ định tuyệt đối ('sẽ chẳng bao giờ có') và nhấn mạnh Markdown
    '*Tranh thủ chợp mắt đi!*' khớp thẻ em trong nguồn; chủ thể 'Meybert và Tospan'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000238
  kind: terminology_and_voice
  value: locked=Giữ nhận định khái quát phủ định ('có quá nhiều thời gian rảnh rỗi
    cũng chẳng làm nên một người sĩ quan giỏi giang được').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000239
  kind: terminology_and_voice
  value: locked=Đại từ 'Họ', giữ chuỗi suy luận điều kiện - hệ quả ('một khi đã quan
    sát, họ sẽ nảy ra đủ cách...') và câu phủ định cuối ('để mặc binh lính ngồi không
    nhàn rỗi cũng chẳng có ích lợi gì').
