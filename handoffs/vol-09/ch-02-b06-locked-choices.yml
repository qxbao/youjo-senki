unit_count: 42
segment_id_start: YS-LN09/Text/chapter006.xhtml/p000198
segment_id_end: YS-LN09/Text/chapter006.xhtml/p000239
choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000198
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Ông ấy' chỉ ứng viên chỉ huy đang được bàn tới và nhấn
    mạnh Markdown '*sẽ*' theo đúng DEC-P01-002."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000199
  kind: terminology_and_voice
  value: locked=["Giữ lời thưa 'Vâng, thưa Tướng quân', đại từ 'ông ấy', địa danh
    'miền tây' và ý 'Xét về mặt nhân sự, ông ấy là một lựa chọn rất thuận tiện'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000200
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'chỉ huy chiến thuật', 'những vấn đề giao thoa giữa
    dân sự và quân sự', cùng câu hỏi tình thái về nguy cơ làm mai một tài năng."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000201
  kind: terminology_and_voice
  value: locked=["Giữ tên riêng 'Lergen', cấp bậc 'Trung tá Uger', logic 'Nếu một
    người là chưa đủ tốt, vậy thì hai người sẽ ổn' và câu đề xuất hỗ trợ."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000202
  kind: terminology_and_voice
  value: locked=["Giữ tên 'Rudersdorf', đại từ 'Tôi', phủ định 'không cử quá một người'
    và thuật ngữ 'Các sĩ quan tham mưu dùng được'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000203
  kind: terminology_and_voice
  value: locked=["Giữ quan hệ thời gian - nhận thức ('Vào thời điểm phương án của
    mình bị bác bỏ, Lergen không hề biết rằng...') và việc Uger được trọng dụng nhờ
    năng lực đàm phán."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000204
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'vật tư cần thiết', 'các sĩ quan tham mưu' và phủ
    định quá khứ 'xưa nay chưa từng được coi trọng'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000205
  kind: terminology_and_voice
  value: locked=['Giữ quan hệ hệ quả và ý nhu cầu dành cho người biết dàn xếp thỏa
    hiệp cao không có giới hạn.']
- segment_id: YS-LN09/Text/chapter006.xhtml/p000206
  kind: terminology_and_voice
  value: locked=["Giữ cụm trong ngoặc kép chỉ biệt danh của Uger bên ngành đường sắt,
    thuật ngữ 'giới dân sự ở hậu phương' và hệ quả vấp phải phản đối bất chấp thể
    diện."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000207
  kind: terminology_and_voice
  value: locked=["Giữ các thuật ngữ 'sư đoàn', 'Bộ Tổng tham mưu', 'hành chính quân
    sự', 'Zettour', 'Bộ Tư lệnh Tối cao', 'miền đông' và sự đối lập giữa đáp ứng nhân
    sự trên giấy tờ với tìm người thực sự làm được việc."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000208
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'các sĩ quan tham mưu', tình thái 'Có lẽ' và hành
    động ôm đầu trước nhận xét của Rudersdorf."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000209
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Chúng ta' và thế đối lập giữa việc không đủ người với
    việc vẫn buộc phải cử người đi."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000210
  kind: terminology_and_voice
  value: locked=["Giữ đại từ tự xưng 'Tôi' và ý nhận thức về mức độ khó khăn của việc
    chọn nhân sự (lưu ý khuyến nghị minor về đại từ ngôi thứ hai 'ngài')."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000211
  kind: terminology_and_voice
  value: locked=["Giữ mệnh lệnh chọn người, địa danh 'miền tây', 'hậu phương', điều
    kiện phủ định 'Nếu không giữ lại...' và rủi ro 'không tiếp thu đồng đều được các
    bài học từ hai mặt trận phía tây và phía đông'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000212
  kind: terminology_and_voice
  value: locked=["Giữ nguyên dòng tiêu đề chuyển cảnh viết hoa 'CÙNG NGÀY HÔM ĐÓ,
    MẶT TRẬN PHÍA ĐÔNG'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000213
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'chính quốc', đối lập với 'ngoài chiến trường', và
    giữ nguyên phạm vi nhấn mạnh Markdown '*Tại sao các người không thể cấp thêm binh
    lính cho chúng tôi?*' theo DEC-P01-002."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000214
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'Lục quân Đế quốc'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000215
  kind: terminology_and_voice
  value: locked=["Giữ cấp bậc 'Trung tướng Zettour', vai trò cố vấn tại 'mặt trận
    phía đông', đại từ 'ông' và chi tiết rít một trong vài điếu thuốc lá quý giá cuối
    cùng còn sót lại."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000216
  kind: terminology_and_voice
  value: locked=["Giữ câu hỏi về 'đơn vị đa quốc gia'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000217
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Chúng' (chỉ quân địch), địa danh 'mấu lồi Hofen', phiên
    hiệu 'Sư đoàn 301', đại từ 'họ' (chỉ quân bạn) và dự báo không cầm cự được lâu."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000218
  kind: terminology_and_voice
  value: locked=["Giữ nhịp câu ngắn mô tả thực trạng 'Lực lượng bị kéo căng mỏng.
    Quân dự bị hạn chế.'"]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000219
  kind: terminology_and_voice
  value: locked=["Giữ sự đối lập giữa lý thuyết với thực tế, tên đơn vị 'Cụm tập đoàn
    quân phía Đông' và thuật ngữ 'tỷ lệ tiêu hao'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000220
  kind: terminology_and_voice
  value: locked=["Giữ chính xác các thuật ngữ 'Lực lượng dự bị chiến lược', 'một sư
    đoàn thiết giáp', 'một sư đoàn cơ giới', 'một tiểu đoàn pháp sư trên không' và
    'vài sư đoàn bộ binh đã hao hụt nặng nề'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000221
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'lực lượng dự bị chiến lược' và 'cụm tập đoàn quân'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000222
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'tổng rút lui', 'trường đại học quân sự', giả định
    quá khứ về việc Zettour hướng dẫn rút quân, và cấu trúc tăng tiến phủ định 'chẳng
    có lính bổ sung nào đang chờ sẵn, huống hồ là quân tiếp viện'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000223
  kind: terminology_and_voice
  value: locked=["Giữ đề xuất điều động 'tiểu đoàn pháp sư trên không' từ 'lực lượng
    dự bị chiến lược', địa danh 'mấu lồi Hofen' và mục tiêu 'tiêu diệt hoàn toàn quân
    địch'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000224
  kind: terminology_and_voice
  value: locked=["Giữ câu bác bỏ ngắn gọn 'Đừng làm thế.'"]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000225
  kind: terminology_and_voice
  value: locked=["Giữ lời gọi 'Thưa Tướng quân?'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000226
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Các anh' khi Zettour nói với các sĩ quan, cùng hai vế
    đối lập 'địa hình trọng yếu' và 'tính linh hoạt của lực lượng dự bị chiến lược'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000227
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Ông' và thuật ngữ 'trường đại học quân sự'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000228
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'hoàng gia', 'Tổ quốc', đại từ 'ông' và câu hỏi nội
    tâm gián tiếp tự do 'Phải chăng ông đã già rồi?'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000229
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Các anh', 'chúng ta' và lập luận chất vấn về việc có
    đủ nhân lực để khai thác vị trí đó ngay cả khi nó có ích về lý thuyết hay không."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000230
  kind: terminology_and_voice
  value: locked=["Giữ ba yếu tố 'Thời gian, không gian, và lực lượng dự bị chiến lược.'"]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000231
  kind: terminology_and_voice
  value: locked=["Giữ nhận định 'Một sĩ quan phải luôn biết tính toán.'"]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000232
  kind: terminology_and_voice
  value: locked=["Giữ cách xưng hô 'Xin phép ngài, thưa Tướng quân.'"]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000233
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'Tôi' của Zettour."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000234
  kind: terminology_and_voice
  value: locked=["Giữ đại từ 'ngài' và nội dung hỏi xác nhận về phương án rút quân."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000235
  kind: terminology_and_voice
  value: locked=["Giữ câu trần thuật mở đầu không in nghiêng và giữ đúng phạm vi nhấn
    mạnh Markdown '*Ra vậy—... hoàn toàn hợp lý.*' ở câu nội tâm theo DEC-P01-002,
    cùng thuật ngữ 'mấu lồi' và 'bàn đạp tiến công trọng yếu'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000236
  kind: terminology_and_voice
  value: locked=["Giữ câu 'Nhưng Zettour chỉ mỉm cười.'"]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000237
  kind: terminology_and_voice
  value: locked=["Giữ thuật ngữ 'sĩ quan tham mưu tác chiến', dấu nháy đơn quanh từ
    'nghe' và tên đơn vị 'Cụm tập đoàn quân phía Đông'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000238
  kind: terminology_and_voice
  value: locked=["Giữ câu cảm thán ngập ngừng 'Ơ kìa, chuyện đó…!'."]
- segment_id: YS-LN09/Text/chapter006.xhtml/p000239
  kind: terminology_and_voice
  value: locked=["Giữ cấu trúc phủ định kép khẳng định năng lực 'Mấy gã này hoàn toàn
    không phải hạng bất tài.'"]
