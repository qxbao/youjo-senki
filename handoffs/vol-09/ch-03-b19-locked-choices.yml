choices:
- segment_id: YS-LN09/Text/chapter012.xhtml/p000032
  kind: terminology_and_voice
  value: 'locked=Thoại của Barchet, câu điều kiện giả định & thuật ngữ: giữ đại từ
    ''tôi'', giả định ''Nếu trong báo cáo có nhắc tới vài chiếc tàu chở dầu thì họa
    may tôi còn bảo là họ nhìn nhầm'', phủ định ''chứ tôi chẳng nghĩ có ai lại đi
    nhầm lẫn giữa một tàu chiến lớn với tàu sân bay cả'', và câu kết có dấu chấm lửng
    ''Mà nếu không có chiếc nào thật thì với tôi đó quả là tin tuyệt vời…''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000033
  kind: terminology_and_voice
  value: 'locked=Trần thuật, phủ định & thuật ngữ: giữ tên riêng ''Tanya'', ''Barchet'',
    chi tiết ''nhưng vẫn chưa lấy làm thỏa mãn mà khẽ nghiêng đầu'' và nhận định phủ
    định ''Không thể xem nhẹ tầm quan trọng của tàu sân bay được.''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000034
  kind: terminology_and_voice
  value: 'locked=Nhận định ngắn & không thêm nhấn mạnh: giữ đại từ ''Chúng'' (quy
    chiếu tàu sân bay) trong ''Chúng chính là chúa tể của biển khơi.'' và không thêm
    nhấn mạnh Markdown tại vị trí thẻ neo trang page-157.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000035
  kind: terminology_and_voice
  value: 'locked=Thoại của Tanya, tình thái & phủ định: giữ cặp đại từ ''chúng ta''
    – ''mình'', tình thái ''có thể tạm cho là'' và phủ định ''mình vẫn chưa tìm ra
    nó mà thôi''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000036
  kind: terminology_and_voice
  value: 'locked=Thoại của Barchet, dấu câu, câu hỏi tu từ phủ định & thuật ngữ: giữ
    dấu chấm phẩy, dấu gạch ngang dài, dấu chấm lửng, vế tự rào đón ''có lẽ tôi diễn
    đạt thế này chưa thật chuẩn xác, nhưng…'', các thuật ngữ ''máy bay trinh sát'',
    ''tiêm kích yểm trợ trực tiếp'' và câu hỏi ''chẳng phải đó là bằng chứng gián
    tiếp cho thấy chúng không có mặt ở đây sao?''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000037
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm của Tanya, ẩn dụ & thuật ngữ: giữ ẩn dụ ''lũ chim
    hoàng yến vẫn đang hót vang bình yên vô sự'', thuật ngữ ''các phi cơ trinh sát'',
    ''tàu sân bay'', phủ định ''mà không bị quấy rối'' và đại từ tự quy chiếu ''mình''
    theo DEC-P01-001.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000038
  kind: terminology_and_voice
  value: 'locked=Trần thuật & thuật ngữ: giữ các thuật ngữ ''Máy bay trên tàu sân
    bay'', ''tàu sân bay'', ''đơn vị pháp sư hải quân đánh bộ'' và đại từ trần thuật
    ''nó'' theo DEC-P01-001.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000039
  kind: terminology_and_voice
  value: 'locked=Thoại nghi vấn của Tanya & dấu câu: giữ dấu chấm lửng mở đầu, đại
    từ ''chúng ta'' và câu hỏi ''“…Vậy là chúng ta thực sự có thể khẳng định không
    có tàu sân bay địch sao?”''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000040
  kind: terminology_and_voice
  value: 'locked=Thoại của Barchet, phủ định & tình thái: giữ đại từ ''Chúng ta''
    – ''tôi'', phủ định ''không nên mất cảnh giác'' và tình thái ''tôi nghĩ hoàn toàn
    có cơ sở để hy vọng''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000041
  kind: terminology_and_voice
  value: 'locked=Trần thuật ngắn: giữ tên riêng ''Tanya'' và hành động ''mỉm cười
    tán đồng''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000042
  kind: terminology_and_voice
  value: 'locked=Thoại của Tanya: giữ đại từ ''Tôi'' – ''chúng ta'', tình thái ''Tôi
    đoán là'' và cụm ''một khi tiếp địch, chúng ta sẽ rõ ngay thôi''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000043
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm, giả định trái thực tế & thuật ngữ: giữ thuật ngữ
    ''tin tức tình báo tiền trạm'', phủ định ''chưa được xác thực'', đại từ ''chúng
    ta'' và câu điều kiện giả định gắn với ''khoa học quân sự kể từ thời Clausewitz''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000044
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm & ẩn dụ: giữ thán từ ''Than ôi'', đại từ ''chúng
    ta'' và hình ảnh ẩn dụ làm bạn với màn sương mù phiền toái.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000045
  kind: terminology_and_voice
  value: 'locked=Thoại của Tanya & phủ định: giữ phủ định ''Chẳng ích gì khi cứ chồng
    chất suy đoán lên trên suy đoán cả.'' và lời đề nghị ''Cứ chờ xem mọi chuyện diễn
    biến thế nào đã.''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000046
  kind: terminology_and_voice
  value: 'locked=Thoại đáp của Barchet & quân hàm: giữ cách gọi ''thưa Trung tá''
    (ứng với quân hàm Trung tá của Tanya).'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000047
  kind: terminology_and_voice
  value: 'locked=Thoại chỉ thị của Tanya: giữ đại từ ''chúng tôi'' và ''chỗ chúng''
    trong ''“Được rồi, xin hãy đưa chúng tôi đến chỗ chúng.”''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000048
  kind: terminology_and_voice
  value: 'locked=Thoại của Barchet, xưng hô & thuật ngữ kỹ thuật: giữ đại từ ''chúng
    tôi'' – ''các vị'', cách tự nhận khiêm nhường ''người vận chuyển'' và câu hỏi
    đề xuất phóng ngư lôi ''loại động cơ đốt trong đời cũ hoặc loại chạy điện đời
    mới làm mồi nhử'' sau khi đơn vị pháp sư xuất kích.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000049
  kind: terminology_and_voice
  value: 'locked=Tự thuật ngôi thứ nhất: giữ tên riêng ''Barchet'' và đại từ ''mình''
    theo DEC-P01-001.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000050
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm, câu hỏi tu từ & thuật ngữ: giữ đại từ ''ông ấy''
    (chỉ Barchet), ''mình'', thuật ngữ ''ngư lôi'', ''loại chạy bằng ắc quy'' và câu
    hỏi nghi vấn khả năng quân địch bỏ sót loạt ngư lôi.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000051
  kind: terminology_and_voice
  value: 'locked=Câu hỏi nội tâm & thuật ngữ: giữ đúng đối tượng câu hỏi về cách ''bên
    hải quân'' quan niệm về ''tính ẩn mình của tàu ngầm'' trong một chiến dịch như
    thế này.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000052
  kind: terminology_and_voice
  value: 'locked=Thoại của Tanya: giữ đại từ ''Tôi'', tình thái ''Tôi cho là'', mối
    quan hệ ''điều kiện trên biển còn tùy thuộc vào bầu trời'' và câu hỏi về dự báo
    thời tiết.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000053
  kind: terminology_and_voice
  value: 'locked=Thoại của Barchet & không thêm nhấn mạnh: giữ dự báo ''Trời quang
    hoặc có mây nhẹ.'', khẳng định ''Tôi chắc là biển sẽ không động đâu.'' và không
    thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-158.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000054
  kind: terminology_and_voice
  value: 'locked=Thoại bỏ lửng & trần thuật: giữ câu thoại ''“Nếu vậy thì…”'', tên
    riêng ''Tanya'', danh xưng ''vị thuyền trưởng'' và hành động lắc đầu khước từ
    thiện ý.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000055
  kind: terminology_and_voice
  value: 'locked=Thoại hỏi lại của Barchet: giữ đại từ ''Cô'' trong ''“Cô chắc chứ?”''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000056
  kind: terminology_and_voice
  value: 'locked=Thoại giải thích của Tanya & phủ định: giữ các đại từ ''chúng ta''
    – ''chúng tôi'' – ''mình'', phủ định ''không thể mạo hiểm con tàu có nhiệm vụ
    ghi nhận chiến công của chúng tôi được'' và ''Nếu quay về mà chẳng nắm được mình
    đã đạt được kết quả gì thì trông sẽ chẳng hay ho chút nào đâu.''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000057
  kind: terminology_and_voice
  value: 'locked=Nhận định nội tâm ngắn: giữ câu ''Chiến công được dùng để hợp thức
    hóa mọi thứ.''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000058
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm, dấu câu & tên riêng: giữ đại từ ''bọn mình'',
    dấu chấm lửng sau ''nhưng…'', tên riêng ''Ildoa'', ''Đế quốc'' và mối liên hệ
    nhân quả giữa việc lập chiến quả với cách quốc gia đối đãi cũng như uy tín của
    Đế quốc.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000059
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm: giữ đại từ ''mình'', tên riêng ''Ildoa'', thuật
    ngữ ''cuộc tập kích'' và sự phân biệt ''một lý do khác với chuyện nội bộ trong
    nước''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000060
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm & nghịch lý đồng minh: giữ tên riêng ''Ildoa'',
    cụm ''đồng minh Ildoa của chúng ta'' và sắc thái mỉa mai ''trung lập đến phát
    sợ so với một nước đồng minh''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000061
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm, giả định & dấu ngoặc kép: giữ thuật ngữ ''quốc
    gia tham chiến'', đại từ ''mình'', cụm trong ngoặc kép ''“cường quốc trung lập
    nghiêm ngặt”'' và điều kiện bảo toàn mạng sống trong phần còn lại của cuộc chiến.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000062
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm & tình thái: giữ tên riêng ''Ildoa'', ''Đế quốc'',
    cặp đại từ ''mình'' – ''bọn mình'', tình thái ''mình chẳng dám chắc'', ''Rất có
    thể'' và hình ảnh ''quân bài mặc cả''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000063
  kind: terminology_and_voice
  value: 'locked=Nhận định phủ định ngắn: giữ phủ định ''Chuyện đó thì chẳng có gì
    là an toàn cả.''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000064
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm & thời hạn: giữ sự đối lập giữa ''về lâu về dài''
    với ''trong ngắn hạn và trung hạn'', tình thái ''nhiều khả năng'', đại từ ''mình''
    và tên riêng ''Đế quốc''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000065
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm tự quy chiếu ngôi thứ ba & dấu câu: giữ dấu chấm
    lửng sau ''Xét tình hình hiện tại…'', tên riêng ''Tanya'', ''Ildoa'' và giới hạn
    điều kiện ''chỉ nên chạy sang Ildoa một khi mọi phương án khác đều đã cạn kiệt''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000066
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm: giữ đại từ ''Bọn mình'' – ''bọn mình'', tên riêng
    ''Ildoa'' và mệnh lệnh ''cho Ildoa thấy là bọn mình làm thật''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000067
  kind: terminology_and_voice
  value: 'locked=Độc thoại nội tâm & triết lý chính trị: giữ sự đối lập giữa nhận
    định thường tình về bạo lực với ''tùy thuộc vào thời điểm và hoàn cảnh'', so sánh
    ''Đối với một cường quốc tham chiến, thà khiến kẻ khác khiếp sợ còn hơn là bị
    xem thường.'' và thuật ngữ ''chủ nghĩa Machiavelli''.'
- segment_id: YS-LN09/Text/chapter012.xhtml/p000068
  kind: terminology_and_voice
  value: 'locked=Thoại độc bạch kết chương & dấu câu: giữ dấu chấm lửng mở đầu và
    câu cảm thán ''“…Một sợi dây xích quả là thứ chẳng vừa đâu.”''.'
