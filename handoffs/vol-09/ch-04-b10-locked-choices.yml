    sẵn từ trước khi mình tới, thì nguyên nhân hẳn là chuyện khác / Tất nhiên chưa
    chắc đã là tin xấu.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=[''Giữ độ mở của câu hỏi nội tâm: Vậy rốt cuộc là chuyện gì đây?'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=[''Nhận định nội tâm về thái độ giao tiếp: Dù có rất nhiều thắc
    mắc, việc đầu tiên cần làm vẫn là tỏ ra lịch thiệp và hòa nhã.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=[''Chuyển đổi tự nhiên giữa đại từ nội tâm (Mình) và tự quy chiếu
    ngôi thứ ba bằng tên riêng (Tanya), cùng chức danh: quân hàm của anh ta / thuyền
    trưởng / việc Tanya chủ động chào hỏi trước là lẽ đương nhiên'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô xã giao (Tôi - chúng tôi) và hệ thống phiên hiệu/chức
    vụ/cấp bậc: chỉ huy Tiểu đoàn Pháp sư Trên không số 203 trực thuộc Kampfgruppe
    Lergen, Trung tá Tanya von Degurechaff / tác chiến với tư cách một phân đội biệt
    phái nên tôi là sĩ quan cao cấp nhất'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=[''Lời tự giới thiệu của thuyền trưởng: “Tôi là thuyền trưởng tàu
    U-091, Thiếu tá Otto von Elm.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô lịch sự của Trung tá Tanya với Thiếu tá Elm (anh, Thuyền
    trưởng - các anh - chúng tôi): “Rất hân hạnh được gặp anh, Thuyền trưởng. Cảm
    ơn các anh đã cho đi nhờ. Xin đừng bận tâm về chúng tôi.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật ngôi thứ ba gắn với tên riêng (Elm - anh ta / Tanya)
    và thuật ngữ: lính tàu ngầm / Tất nhiên, anh ta vẫn cao lớn hơn Tanya.'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=[''Cách gọi cấp bậc Trung tá (thưa Trung tá) của Elm: “Vào thẳng
    vấn đề luôn thì… Màn vừa rồi thật sự rất ngoạn mục, thưa Trung tá.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô trong thoại của Tanya với Elm (Thuyền trưởng - anh -
    bên phe ta): “Ý Thuyền trưởng là trận đánh vừa rồi sao? Nghe cách anh nói thì
    có vẻ một số người bên phe ta đã quan sát từ xa nhỉ?”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô trong thoại của Elm với Tanya (tôi / chúng tôi - Trung
    tá) và đại từ chỉ bạn đồng khóa Barchet (cậu ấy): Vị thuyền trưởng / Barchet /
    chúng tôi nhập ngũ cùng một khóa / chiến quả đáng kinh ngạc của đơn vị Trung tá'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh tại thẻ neo trang (page-184); giữ chuyển
    đổi điểm nhìn trần thuật (Tanya) sang nội tâm (Mình - chúng mình) và thoại (Chúng
    tôi), cùng thuật ngữ: chiếc tàu ngầm / hải đội tàu ngầm / Thiếu tá Barchet'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=[''Giữ giả định trái thực tế ở quá khứ, đại từ nội tâm tập thể (chúng
    mình) và thuật ngữ: tàu mẹ / cụm tác chiến tàu sân bay / một chiếc tàu sân bay
    đàng hoàng lẫn máy bay trên tàu sân bay'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô trong thoại (chúng tôi): “Tuy nói vậy… đúng là chúng
    tôi đã buộc phải xoay xở khá sáng tạo.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=[''Cách dịch tạo nhịp bắt lời với đoạn sau: “Tôi nghe nói thứ vũ
    khí mới đó thực sự rất ghê gớm.”'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=[''Giữ đúng phạm vi nhấn mạnh Markdown (*ghê gớm*) theo DEC-P01-002,
    phân biệt đại từ nội tâm (Mình) với thoại (tôi - chúng ta - chúng tôi) và thuật
    ngữ: tùng thiết trên xe tăng ở mặt trận phía đông'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ và so sánh: Tùng thiết trên xe tăng / sức khỏe tinh
    thần / chui vào ngồi trong một quả ngư lôi'']'
- segment_id: YS-LN09/Text/chapter016.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô trong thoại (Tôi) và thành ngữ tương đương tự nhiên:
