- segment_id: YS-LN09/Text/chapter016.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=[''Giữ đúng phạm vi nhấn mạnh Markdown (*Tất nhiên rồi*) theo DEC-P01-002
