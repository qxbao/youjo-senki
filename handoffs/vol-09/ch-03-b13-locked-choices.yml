segment_id_end: YS-LN09/Text/chapter010.xhtml/p000534
choices:
- segment_id: YS-LN09/Text/chapter010.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ đại từ ''nó'', cụm ''triển khai hàng
    loạt đội tập kích'' và đánh giá ''Phối hợp triển khai thêm tàu ngầm cũng chẳng
    phải ý tồi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Liên hệ lịch sử quân sự: giữ ''Thế chiến thứ nhất'', ''một chiếc
    tàu ngầm đơn độc'' và ''đánh chìm ba tàu tuần dương hạng nặng chỉ trong một lần
    chạm trán''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Để rút ngắn thời gian, điều nó muốn nói rất
    đơn giản.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tương phản nội tâm – phát ngôn: chỉ bọc câu
    độc thoại ''*Dẹp cái trò lãng phí thời gian lố bịch này đi, bàn về ngư lôi luôn
    cho rồi!*'' bằng dấu sao theo DEC-P01-002 và giữ câu trần thuật về ''lối tu từ
    quan liêu''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Văn phong quan phương trong thoại: giữ ''lực lượng hải quân vượt
    trội của địch'', ''quân đội Đế quốc'' và ''xóa sổ lực lượng đó bằng một đòn tấn
    công ngư lôi''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Thế nhưng câu trả lời nó nhận lại là điều nó
    chưa từng tưởng tượng tới.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & phủ định trong thoại: giữ cách gọi ''“…Trung tá'' và
    mệnh đề ''chúng ta không thể chặn đứng chúng bằng tàu ngầm của mình đâu.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn bộ câu ''*Thật
    tình, sao lại chỉ có tàu ngầm chứ?*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ quan hệ nhân quả ''Câu trả lời khó hiểu đến mức
    khiến nó đứng hình.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Phủ định & liệt kê phương tiện tác chiến: giữ phủ định ''Tanya
    chưa từng có mảy may ý định đề xuất rằng các đơn vị tàu ngầm của Hải quân Đế quốc
    nên một mình giao chiến quyết định với tàu chủ lực địch'' và chuỗi liệt kê ''không
    đoàn tàu sân bay, thuốc nổ dưới nước, đơn vị tập kích đặt căn cứ trên bộ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Đối lập phạm vi khái niệm: giữ ''Nó nói là tấn công bằng ngư lôi.
    Chứ có ai bảo là nhất định phải do tàu chiến thực hiện đâu.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & cấu trúc nhượng bộ trong thoại: giữ đại từ ''tôi'',
    trọng tâm ''chủ yếu là dùng lực lượng không quân'' và đề xuất bổ sung ''cho tàu
    ngầm hoạt động trong vai trò hỗ trợ''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế & quân hàm trong thoại: giữ thức giả định
    ''“Giá mà chúng ta có những thứ như thế, thưa Trung tá.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng: giữ ''“Hả? Tôi, ờm…”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Phủ định trong thoại: giữ ''“Quân đội chúng ta không có loại ngư
    lôi nào có thể phóng đi săn tàu chiến cả.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả trần thuật: giữ ''Đó là một sự hiểu lầm bất cẩn
    do là một pháp sư nên nó không nắm rõ tình hình chi tiết của bên không quân.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Quân hàm đầy đủ, thuật ngữ & không thêm nhấn mạnh: giữ ''Trung
    tá Pháp sư Tanya von Degurechaff'', ''máy bay ném ngư lôi'' và không thêm nhấn
    mạnh Markdown tại vị trí thẻ neo trang page-142."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & liên hệ lịch sử: giữ ''chiến trường Thái
    Bình Dương'', ''những cuộc không kích bằng ngư lôi'', chỉ bọc ''*Bismarck*'' bằng
    dấu sao theo DEC-P01-002 và giữ nguyên ''Fairey Swordfish''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Đối với một người như thế, sự tồn tại của máy
    bay ném ngư lôi là điều hiển nhiên.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Quan hệ hệ quả trần thuật: giữ ''Bởi vậy, Tanya hết sức ngỡ ngàng.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi ngắn trong thoại: giữ câu hỏi phản xạ khi sững sờ của
    Tanya.'']'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Trần thuật dẫn nhập nội tâm: giữ dấu hai chấm kết câu ''Vào khoảnh
    khắc ấy, từng thớ thịt trong người nó đều chung một suy nghĩ:''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn bộ ''*Cái gì, không
    tồn tại ư?*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn bộ ''*Tại sao?*''
    bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn bộ ''*Tại sao chúng
    lại không tồn tại chứ?*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & điểm nhìn quan sát: giữ chi tiết biểu cảm ''lộ rõ
    trên gương mặt nó trong tích tắc'', ''vẻ mặt vẫn thường làm dấy lên những lời
    xì xào bàn tán kia cũng theo đó mà sụp đổ'' và nhận xét của những người dự họp
    ''một khi trút bỏ tác phong nhà binh, trông nó thực sự đúng với lứa tuổi của mình''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trong thoại: giữ ''“Cô không biết sao?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & lý giải trong thoại: giữ ''“Không, tôi… Tại vì chúng
    ta đã lập được rất nhiều chiến công.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & liệt kê nguồn tin: giữ ''Toát mồ hôi lạnh, nó lục
    tìm lại trong ký ức'' và ba nguồn ''trên mặt báo, qua lời đồn nội bộ lẫn trong
    các thông cáo chính thức''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ trong thoại: giữ ''“Chẳng phải lực lượng không quân
    của chúng ta đã đánh chìm biết bao nhiêu tàu thuyền rồi sao?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ – nhân quả trong trần thuật: giữ cấu trúc ''Ngay
    cả khi không có thời gian..., nó vẫn luôn nắm bắt...'' và ''Vì từng có thông tin...,
    nó đã đinh ninh rằng kho vũ khí của họ có máy bay ném ngư lôi.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha nội tâm tự nhiên: giữ ''nhiệm vụ phối hợp cùng
    không quân…'' và câu cảm thán ''Cứ ngỡ việc có máy bay ném ngư lôi là chuyện bình
    thường hiển nhiên chứ.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Giải thích tâm lý & thuật ngữ quân sự: giữ ý về thiên kiến nhận
    thức (''Chừng nào chưa được bảo rằng một thứ không tồn tại, kiến thức của nó sẽ
    áp đặt một kiểu thiên kiến nhất định'') và các thuật ngữ ''chương trình đào tạo
    cấp tốc'', ''tác chiến liên hợp với hải quân'', ''hỏa lực yểm trợ cơ hữu''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phạm vi nhấn mạnh: giữ ''máy bay cường kích''
    và chỉ bọc đúng cụm ''*đâu đó*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: giữ ''“Tôi đã hiểu nhầm. Tôi
    cứ tưởng các đơn vị cường kích làm việc đó.”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ hải quân – không quân & không thêm nhấn mạnh: giữ ''máy
    bay ném bom bổ nhào'', ''tàu khu trục hay tàu chở quân'', ''chưa chủ trương đưa
    máy bay ra đối đầu trực tiếp với tàu chủ lực'' và không thêm nhấn mạnh Markdown
    tại vị trí thẻ neo trang page-143."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ chiến lược: giữ ''Câu trả lời thật cộc
    lốc'', hình ảnh ''phía sau bức màn…'' và nhận định về ''Đế quốc'' như một ''quốc
    gia lục địa điển hình đến đáng buồn, với hình ảnh tiêu biểu là Đại Quân của mình''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ quan hệ kết quả ''Nhờ chính sách mở rộng quyết
    liệt, hải quân trong những năm gần đây đã ngày càng lớn mạnh cho đến khi sở hữu
    một đội hình đáng gờm.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Tương phản chiến lược & thuật ngữ không quân: giữ tương phản ''Thế
    nhưng không quân lại chủ yếu tập trung vào việc giành quyền làm chủ bầu trời và
    thực hiện các nhiệm vụ yểm trợ đường không tầm gần'' gắn với ''một quốc gia lục
    địa''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Lễ độ & câu hỏi xác minh trong thoại: giữ ''“Xin thứ lỗi cho sự
    thiếu hiểu biết của tôi, nhưng liệu chúng ta có đang phát triển máy bay cường
    kích và chiến thuật tấn công tàu chiến chút nào không?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Tình thái dự báo & xưng hô trong thoại: giữ khẳng định kèm giới
    hạn ''Chúng ta có đang làm, nhưng không thể hoàn thành trong một sớm một chiều
    được'', ước lượng ''Có lẽ phải mất một hoặc hai năm nữa'' và đại từ ''cô'' khi
    nói với Tanya về mốc đưa vào thực chiến."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ sắc thái ''Câu hỏi chẳng khác nào lời van nài
    của Tanya'' và kết cục ''niềm lạc quan mong manh trong nó vỡ vụn''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Hy vọng duy nhất của nó vốn đặt cả vào thế mạnh
    công nghệ của Đế quốc.''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái chắc chắn: giữ ''tài sản vô hình to lớn
    là bí quyết công nghệ'' và nhận định ''chắc chắn sẽ mất rất nhiều thời gian''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000531
  kind: terminology_and_voice
  value: 'choices=["Mệnh đề nhượng bộ mở đầu: giữ dấu chấm lửng cuối câu ''Ngay cả
    khi chẳng có gì dễ chuốc lấy kết cục phi lý bằng việc hành xử theo cảm tính…''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000532
  kind: terminology_and_voice
  value: 'choices=["Liên kết câu & thuật ngữ kinh tế: giữ dấu chấm lửng mở đầu nối
    với p000531, cụm ''con người vốn đề cao tính hợp lý kinh tế này'' và ''nỗi căm
    ghét trớ trêu của mình đối với sự phi lý''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000533
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi đề xuất trong thoại: giữ ''“Vậy còn phương án cho tàu
    ngầm hoặc tàu phóng lôi tiến hành tấn công tầm gần thì sao?”''."]'
- segment_id: YS-LN09/Text/chapter010.xhtml/p000534
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & tự đánh giá: giữ ''trên cương vị một người
    trưởng thành biết điều và một người lính được thực tế rèn giũa kỹ lưỡng, chỉ là
    đưa ra một phương án thay thế.''."]'
