segment_id_end: YS-LN09/Text/chapter006.xhtml/p000154
choices:
- segment_id: YS-LN09/Text/chapter006.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: giữ ''miền đông'', ''Đế quốc'' và hình ảnh
    ẩn dụ ''đang chảy máu không ngừng trên mặt trận đó''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Đại từ, địa danh & phủ định trong thoại: giữ đại từ ''Chúng ta'',
    ''mặt trận phía tây vẫn bình yên vô sự'', ''Người dân ở hậu phương'' và phủ định
    nhấn mạnh ''rõ ràng chẳng hề có chút khái niệm nào về tình cảnh ngoài này''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Chức danh & sắc thái biểu cảm: giữ ''cơn bão phàn nàn ấy'' và
    ''tiếng hắng giọng đầy ngán ngẩm của vị sĩ quan cấp trên''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại chấn chỉnh: giữ câu nhắc nhở dứt khoát ''“Một ngày
    càu nhàu chừng đó là đủ rồi đấy.”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''ánh nhìn cảnh cáo ra chiều họ đã đi
    quá giới hạn'', ''các bước sóng tinh vi trên màn hình CRT'' và phủ định tu từ
    ''đời nào lại đọc sai tín hiệu đó''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái cấm đoán: giữ ''đều sẽ không được dung thứ''
    và ''một lằn ranh mà họ không được phép bước qua''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & mức độ: giữ ''vội vã tranh nhau quay lại làm
    việc trước nhất'' và ''bầu không khí gần như nổi loạn kia tan biến không còn một
    dấu vết''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Chức danh, thuật ngữ & cấu trúc nhượng bộ: giữ ''vị chỉ huy'',
    ''phòng không'' và cấu trúc ''Dù chỉ là suy nghĩ thầm kín trong lòng, bất kỳ ai
    phụ trách phòng không cũng không khỏi cảm nhận điều đó một cách sâu sắc''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Giọng độc thoại thở dài: giữ dấu ba chấm và câu hỏi tu từ ''“…Tình
    hình đang ngày một xuống dốc nhỉ?”''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ cụm danh từ ngắn ''Lực lượng nòng cốt bị
    rút đi.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ cụm danh từ ngắn ''Áp lực ngày càng chồng
    chất của những trận chiến bất tận.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhịp trần thuật: giữ cụm danh từ kết chuỗi ''Và nguồn
    quân bổ sung đáng thất vọng cả về chất lượng lẫn số lượng.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái phản thực tế: giữ đại từ ''ông''
    cho vị chỉ huy, ''một đợt quân bổ sung quy mô lớn'', ''chương trình đào tạo cấp
    tốc'' và tình thái phê phán quá khứ ''một giải pháp tuyệt vọng mà lẽ ra Đế quốc
    không bao giờ nên dùng tới''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tương phản biểu hiện – nội tâm: giữ sự đối lập giữa
    vẻ ngoài điềm tĩnh của ''vị chỉ huy'' trước mặt cấp dưới và tâm trạng ''trong
    thâm tâm, ông chỉ muốn rên rỉ thành tiếng''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái suy đoán: giữ ''các biên đội máy bay ném
    bom của Khối Thịnh vượng chung'', ''bầu trời may mắn quang mây'' và tình thái
    ''có lẽ họ có thể kỳ vọng một chiến quả khá khả quan từ đêm qua''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ chắc chắn: giữ ''Tỷ lệ tổn thất chắc chắn nằm
    trong phạm vi chấp nhận được'' và cách diễn đạt ''Chiến công xuất sắc đầu tiên
    của họ sau một khoảng thời gian dài''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc giới hạn: giữ sắc thái thu hẹp ''Nhưng điều đó chỉ có
    nghĩa là họ đã thành công trong việc đẩy lùi kẻ địch mà thôi.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cảm thán: giữ câu cảm thán ngắn ''“Đúng là khổ ải
    mà.”'' tạo thế hô ứng với p000133."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi nội tâm & phủ định kép: giữ khẳng định qua
    phủ định ''Hầu như chẳng còn nghi ngờ gì việc ngày mai họ sẽ lại phải tiếp tục
    chiến đấu'', tên riêng ''Trận chiến Miền Tây'' và cấu trúc phủ định kép ''Chẳng
    có lý do gì để cho rằng Đế quốc không thể giành chiến thắng vào ngày hôm đó cả''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Chuỗi câu hỏi tăng tiến: giữ nhịp câu hỏi dồn dập theo mốc thời
    gian mở rộng từ ''tháng sau'', ''tháng sau nữa'', ''Nửa năm tới'' đến ''cả một
    năm tiếp theo''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & thuật ngữ: giữ ''tốc độ tiêu hao'' và câu hỏi
    nghi vấn ''Liệu họ có thực sự tiếp tục chịu đựng nổi tốc độ tiêu hao này hay không?''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Điệp thoại tăng cấp: giữ dấu ba chấm và câu cảm thán tăng tiến
    ''“…Đúng là tột cùng khổ ải.”'' hô ứng với p000129."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & địa danh: giữ nguyên định dạng in hoa ''CÙNG NGÀY
    HÔM ĐÓ, ĐẾ ĐÔ, VĂN PHÒNG BỘ TỔNG THAM MƯU''; không thêm nhấn mạnh Markdown."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc chính xác mệnh đề đầu đoạn
    ''*Củng cố nhân sự chỉ huy ở miền tây.*'' bằng dấu sao theo DEC-P01-002; giữ ''Lục
    quân Đế quốc'' và ''một trong vô vàn vấn đề thứ yếu khác vốn đã bị bỏ ngỏ suốt
    một thời gian dài''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Nhịp câu dẫn: giữ câu đơn ngắn ''Lý do rất đơn giản.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Phủ định trực tiếp: giữ câu phủ định ngắn gọn ''Không có đủ người
    để phân bổ.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: giữ ''những kỳ vọng thiếu thực tế
    đã dẫn đến tình cảnh khốn đốn hiện tại'', ''Các ước tính trước chiến tranh'' và
    ''sĩ quan tham mưu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự: giữ ''trận chiến quyết định'', ''tập đoàn quân
    dã chiến'', ''nguồn nhân lực'', ''đội ngũ sĩ quan tham mưu'' và ''quy trình tuyển
    chọn khắt khe và đầu tư có trọng điểm''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ đào tạo & cấu trúc giới hạn: giữ ''Chỉ những sĩ quan
    triển vọng nhất vượt qua vòng sàng lọc ban đầu'', ''trường đại học quân sự'',
    ''khóa đào tạo tham mưu'' và nhận định ''khắt khe quá mức''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Tương phản thời bình – thời chiến: giữ sự đối lập giữa ''hoàn
    toàn là lời giải đúng đắn trong thời bình'' và ''hết sức thiếu hụt trong thời
    chiến''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc sóng đôi hai mặt trận: giữ sự đối chiếu giữa
    ''mặt trận Rhine'' (''chiến tranh chiến hào khốc liệt'', ''trường đại học quân
    sự'') với ''miền đông'' (''các mặt trận cơ động và những phòng tuyến biến đổi
    liên tục'', ''chiến trường tác chiến'')."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: giữ ''đẩy nhanh tiến độ đào tạo
    sĩ quan tham mưu cũng có giới hạn'' và hệ quả ''các sĩ quan tham mưu hiện có đều
    phải làm việc quá tải một cách khủng khiếp''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: giữ ''những sĩ quan bị thương đóng ở hậu
    phương phụ giúp một tay''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & thành ngữ so sánh: giữ ''những sĩ quan tham
    mưu có thể đi lại tự do'', phủ định tuyệt đối ''khái niệm thời gian nghỉ ngơi
    hoàn toàn không tồn tại'' và phép so sánh ''bị vắt kiệt sức như những con la đi
    thuê''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Tương phản thứ bậc ưu tiên: giữ cấu trúc ''trước hết là sĩ quan
    tham mưu rồi sau đó mới là con người, nhưng suy cho cùng họ vẫn chỉ là con người
    bằng xương bằng thịt''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''tình trạng thiếu hụt nhân lực kinh niên''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''một đòi hỏi lạnh người'', ''bộ tham
    mưu mang phong cách Đế quốc'' và phủ định ''chẳng còn đủ tinh thần để nhiệt tình
    đáp ứng yêu cầu đó''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Nhịp chuyển ý: giữ câu ngắn ''Nhưng sự do dự của họ cũng chỉ dừng
    lại ở đó.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Chức danh, quân hàm & thành ngữ: giữ ''người đứng đầu Bộ Tổng
    tham mưu là Trung tướng Rudersdorf'', ''các sĩ quan tham mưu'' và cách diễn đạt
    khẩu ngữ ''than trời trách đất rồi miễn cưỡng xắn tay vào việc''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Nhịp trần thuật: giữ ''Tất cả bọn họ đều được triệu tập trong
    một phòng họp.''"]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Số lượng & tâm thế nhân vật: giữ ''Với quân số chưa đầy mười người'',
    ''người chủ trì cuộc họp—chính là Rudersdorf—'' và ''ánh mắt phập phồng lo sợ''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quân hàm: giữ ''Đại tá Lergen'' và nhận định ''chuyện
    đó hoàn toàn dễ hiểu''."]'
- segment_id: YS-LN09/Text/chapter006.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu cảm thán kết đoạn: giữ ''các sĩ quan tham mưu
    đều đã kiệt sức'', ''sức bền vượt trội'', ''quá trình đào tạo quân sự khắc nghiệt''
    và dấu chấm than kết câu."]'
