choices:
- segment_id: YS-LN09/Text/chapter004.xhtml/p000341
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm mở đầu: giữ câu cảm thán ngắn gọn ''Thật kinh khủng.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000342
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf với Tanya: xưng ''Ta'', gọi ''cô'', ''our'' -> ''của
    chúng ta''; khóa ''the east'' -> ''miền đông'', ''front lines'' -> ''tiền tuyến''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000343
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya với Rudersdorf: xưng ''Tôi'' / ''chúng tôi'' (we - phía
    đơn vị tiền tuyến), gộp ''chúng ta'' (our strategy), gọi ''thưa ngài'' / ''ngài'';
    khóa ''Operation Andromeda'' -> ''Chiến dịch Andromeda''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000344
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: xưng ''Ta'', gọi Tanya là ''Trung tá'' (Colonel)
    và ''cô''; khóa ''major offensive'' -> ''cuộc tiến công quy mô lớn''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000345
  kind: terminology_and_voice
  value: 'choice=Trần thuật ngôi thứ ba: giữ tên ''Tanya'' và quan hệ nhượng bộ nhấn
    mạnh (''ngay cả Tanya cũng buộc phải nói toạc ra'').'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000346
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: gọi Rudersdorf là ''ngài'', đại từ gộp ''chúng ta'';
    khóa ''Council for Self-Government'' -> ''Hội đồng Tự trị''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000347
  kind: terminology_and_voice
  value: 'choice=Thoại ngắt lời của Rudersdorf: ''Khoan đã.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000348
  kind: terminology_and_voice
  value: 'choice=Trần thuật: giữ câu danh ngữ ''Một tiếng ngắt lời ngắn gọn nhưng
    đanh thép.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000349
  kind: terminology_and_voice
  value: 'choice=Trần thuật: ''The man speaking'' -> ''Người đàn ông đang lên tiếng'',
    ''in dismay'' -> ''vẻ ngao ngán''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000350
  kind: terminology_and_voice
  value: 'choice=Thoại và trần thuật: giữ tên ''Zettour'', ''Rudersdorf'', ''Tanya'';
    Rudersdorf xưng ''ta'', gọi ''cô''; giữ phủ định giảm nhẹ ''không ưa những màn
    tranh luận dài dòng''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000351
  kind: terminology_and_voice
  value: 'choice=Trần thuật: ''He'' -> ''Ông'', ''her'' -> ''cô''; giữ phủ định ''chẳng
    phải là một cái nhìn dễ chịu'' và ''không có chỗ cho việc bàn cãi''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000352
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf và trần thuật: xưng ''Ta'', gộp ''Chúng ta'', gọi
    ''cô'', trần thuật dùng ''Ông''; giữ cấu trúc phủ định kép ''không cần phải gắng
    sức quá mức, nhưng cũng chẳng nên lãng phí thời gian''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000353
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: gọi ''Thưa Tướng quân'' (General), xưng ''tôi''; khóa
    ''magic lieutenant colonel'' -> ''trung tá pháp sư'', ''staff training'' -> ''đào
    tạo tham mưu'', ''General Staff'' -> ''Bộ Tổng tham mưu''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000354
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: gọi ''cô'', giữ cấu trúc lựa chọn dứt khoát (''Một
    là cô đưa ra kết luận, hai là cô có thể lui ra. Tùy cô chọn.'').'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000355
  kind: terminology_and_voice
  value: 'choice=Trần thuật: giữ câu ngắn ''Một câu trả lời thẳng thừng.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000356
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm Tanya: tự xưng ''mình'' (I) theo DEC-P01-001.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000357
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm kết hợp tự quy chiếu ngôi thứ ba: ''I'' -> ''Mình'',
    giữ tên ''Tanya'' ở câu sau; khóa ''plausible deniability'' -> ''chừa một đường
    lui để phủi bỏ trách nhiệm một cách hợp lý''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000358
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: xưng ''tôi'', gọi ''ngài''; dịch thoát ý lịch sự ''đón
    nhận thiện ý của ngài ạ''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000359
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: ''Nói đi.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000360
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: đại từ ''chúng ta'', ''the Empire'' -> ''Đế quốc'';
    phân biệt ''objective'' / ''strategic objective'' (''mục tiêu'' / ''mục tiêu chiến
    lược'') với ''goal of security'' (''đích đến an ninh'').'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000361
  kind: terminology_and_voice
  value: 'choice=Trần thuật: ''The general'' -> ''Vị tướng''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000362
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: ''Chiến thắng.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000363
  kind: terminology_and_voice
  value: 'choice=Nội tâm Tanya: đại từ gộp ''chúng ta''; khóa nhấn mạnh Markdown ''*Chiến
    thắng ư?*'' và ''*kết quả*'' khớp chính xác với hai thẻ em trong nguồn.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000364
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: ''Thưa Tướng quân?''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000365
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: xưng ''Ta'', gọi ''cô'' và ''Trung tá'' (Colonel).'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000366
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm Tanya: ''I'' -> ''mình'', ''he'' -> ''ông''; giữ
    phủ định nhấn mạnh ''hoàn toàn chẳng hiểu''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000367
  kind: terminology_and_voice
  value: 'choice=Nội tâm tự quy chiếu ngôi thứ ba: giữ tên ''Tanya'', phủ định kép
    ''chẳng có lý do gì để không yêu thích chiến thắng''; khóa nhấn mạnh Markdown
    ''*kết cục*'' (outcome) và ''*thành tựu*'' (achievement) khớp với nguồn.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000368
  kind: terminology_and_voice
  value: 'choice=Nội tâm Tanya: khóa nhấn mạnh Markdown ''*để hướng tới*'' khớp với
    thẻ em (''in pursuit'') trong nguồn.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000369
  kind: terminology_and_voice
  value: 'choice=Nội tâm phân tích: ''profit margin'' -> ''biên lợi nhuận'', ''goals
    and standards'' -> ''những đích đến và tiêu chuẩn''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000370
  kind: terminology_and_voice
  value: 'choice=Nội tâm phân tích: ''The Empire'' -> ''Đế quốc'', đại từ khái quát
    ''You'' -> ''Người ta''; khóa nhấn mạnh Markdown ''*mục tiêu*'' (objective) và
    phân biệt với ''đích đến'' (goal).'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000371
  kind: terminology_and_voice
  value: 'choice=Câu hỏi tu từ nội tâm: giữ phân biệt ''mục tiêu hay đích đến'' (objectives
    or goals).'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000372
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: đại từ ''chúng ta''; giữ giọng khiêm nhường xã giao
    (''Thật hổ thẹn khi phải hỏi điều này'').'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000373
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: xưng ''Ta'', gọi ''Trung tá'', gộp ''chúng ta'';
    khóa nhấn mạnh Markdown ''*chiến thắng*'' khớp với thẻ em trong nguồn.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000374
  kind: terminology_and_voice
  value: 'choice=Trần thuật/nội tâm: ''The general'' -> ''Vị tướng'', ''I'' -> ''mình'',
    ''doublespeak'' -> ''lối nói nước đôi''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000375
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm: giữ giọng bức xúc tự nhiên (''Thế nghĩa là sao
    chứ? Thật sự thì rốt cuộc chuyện quái gì đang diễn ra vậy?'').'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000376
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm: ''I'' -> ''mình'' ở cả hai mệnh đề.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000377
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: gọi ''Thưa Tướng quân'', ''ngài''; giữ đúng phạm vi
    từ giới hạn ''chỉ đang được lệnh phải giành chiến thắng thôi sao…?''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000378
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: ''Đúng vậy.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000379
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: giữ dấu chấm lửng ngập ngừng ''…Tôi……hiểu rồi ạ.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000380
  kind: terminology_and_voice
  value: 'choice=Độc thoại nội tâm: ''I'' -> ''mình''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000381
  kind: terminology_and_voice
  value: 'choice=Nội tâm phân tích: giữ cấu trúc giả định ''Giá như... thì ngay cả
    khi... cũng vẫn ổn thôi''; phân biệt ''đích đến'' (goal) và ''các mục tiêu bao
    trùm'' (overarching objectives); khóa ''the Federation'' -> ''Liên bang''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000382
  kind: terminology_and_voice
  value: 'choice=Nội tâm: ''we'' -> ''chúng ta''; khóa ''Supreme Command'' -> ''Bộ
    Tư lệnh Tối cao'', ''General Rudersdorf'' -> ''Tướng Rudersdorf''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000383
  kind: terminology_and_voice
  value: 'choice=Nội tâm: giữ cụm ''Không hơn, không kém.'' đồng nhất với p000373.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000384
  kind: terminology_and_voice
  value: 'choice=Nội tâm và trần thuật: ''His'' -> ''của ông'', giữ tên ''Tanya''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000385
  kind: terminology_and_voice
  value: 'choice=Thoại Tanya: ''Nhưng như thế thật phi lý.''.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000386
  kind: terminology_and_voice
  value: 'choice=Thoại Rudersdorf: ''Đúng vậy.'' đồng nhất với p000378.'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000387
  kind: terminology_and_voice
  value: 'choice=Nội tâm: khóa hình ảnh ẩn dụ ''liều thuốc tiên tối thượng'' (ultimate
    panacea).'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000388
  kind: terminology_and_voice
  value: 'choice=Nội tâm kết đoạn: khóa ẩn dụ ''những viên đạn bạc'' (silver bullets)
    và câu hỏi tu từ phủ định ''thì làm sao có thể chẳng có lấy một mục tiêu xứng
    đáng nào?''.'
