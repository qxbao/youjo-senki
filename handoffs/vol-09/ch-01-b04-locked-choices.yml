choices:
- segment_id: YS-LN09/Text/chapter002.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chỉ thị trong thoại: Tanya xưng ''Tôi'' khi nói với
    Serebryakov; giữ điều kiện ''nếu cần thiết thì hãy bắt đầu thu xếp việc giải quyết
    nghỉ phép cho binh lính luôn đi'' và phần bổ sung ''Bao gồm cả việc cấp phát các
    giấy tờ liên quan nữa''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định: giữ câu nhận định phủ định ''Không
    nên lãng phí thời gian'' và phương châm hành động ''Việc gì làm được lúc nào là
    phải tranh thủ làm ngay lúc đó''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & cấu trúc tương phản: giữ ''Bộ Tổng tham mưu'',
    ''Reichsbahn'', đại từ ''chúng ta'' và cấu trúc đối chiếu ''Nói rằng... là một
    chuyện, nhưng thực sự biết chắc liệu... hay không lại là chuyện khác''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại cấp dưới: Serebryakov tự xưng ''tôi'', dùng
    kính ngữ ''ạ'' và giữ chi tiết ''các chuyến tàu đường dài trước''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Tình thái & điều kiện trong thoại: giữ tình thái ''có lẽ'', ''chắc
    cũng sẽ'' và cấu trúc điều kiện ''Hễ là chuyện nghỉ phép thì ngay cả những kẻ
    chúa ghét giấy tờ chắc cũng sẽ điền biểu mẫu đàng hoàng thôi''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: Tanya tự quy chiếu bằng ''Mình'' theo DEC-P01-001
    trong cả hai câu độc thoại."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, điểm nhìn trần thuật & giả định: giữ ''Trung tá Degurechaff'',
    ''Đại tá Lergen'', đại từ ''anh'' chỉ Lergen, ''cô'' chỉ Tanya, và cấu trúc giả
    định ''Nếu... thì ngay cả cô hẳn cũng sẽ...''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Độc thoại lẩm bẩm: giữ đại từ tự quy chiếu ''Mình'' trong câu
    tự nhủ thành tiếng của Tanya."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & phủ định: giữ tên riêng ''Tanya'', đại
    từ ''cô'', chi tiết ''bị tập kích bất ngờ'' và câu nhận định phủ định ''Hiện thực
    chẳng bao giờ biết nương tay''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Lergen gọi Tanya là ''cô'' và
    ''Trung tá''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & quân hàm: giữ đại từ ''cô'' chỉ Tanya,
    ''anh'' chỉ Lergen và cụm giải thích cấp bậc ''cao hơn cô một bậc quân hàm—anh
    là một đại tá chính thức''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái thoại: Lergen dùng ''chúng ta'', tự xưng ''tôi'';
    giữ sự phân biệt giữa lần gặp trực tiếp với việc chạm mặt chính thức trên hồ sơ
    giấy tờ và dấu chấm lửng bỏ lửng cuối câu."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & dấu câu cảm thán nghi vấn: giữ ''“Đại tá Lergen?!”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ tên riêng ''Tanya'' và chuỗi hành động
    phản xạ nhà binh tức khắc."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ trần thuật & tình thái: giữ ''Vị đại tá'', địa
    danh ''Ildoa'', ''công cán ngoại giao'', đại từ ''cô'' chỉ Tanya và nhận định
    ''Chuyện này chỉ có thể là điềm báo rắc rối mà thôi''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & địa danh trong thoại: Tanya gọi Lergen là
    ''Ngài'' và ''thưa Đại tá''; giữ tên gọi ''Đế quốc''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & phủ định: giữ ''Kampfgruppe Lergen'', ''thủ
    đô'', đại từ ''tôi'' của Lergen và câu phủ định ''Việc tôi ở đây đâu có gì lạ''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & quan hệ đối lập: giữ đại từ ''Anh'' chỉ
    Lergen, tên riêng ''Tanya'' và vế đối lập miêu tả sắc mặt ''nhưng sắc mặt anh
    lại tái nhợt hơn bất cứ lúc nào Tanya từng thấy''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ câu nhận xét bỏ lửng ''Quan trọng hơn cả
    là giọng điệu của anh ta…''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & mức độ tăng tiến: giữ sự đối chiếu tính cách
    trước đây (''nghiêm túc hơn nhiều'', ''Thậm chí còn cứng nhắc nữa là đằng khác…'')
    với nhận định ''Sự thay đổi này thật đáng kinh ngạc''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ câu hỏi suy đoán nguyên nhân ''Phải chăng
    áp lực của chiến tranh đã gây ra thái độ châm biếm, cay độc này?''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: bọc chính xác từ ''*quả thực*''
    bằng dấu sao theo DEC-P01-002; giữ cấu trúc phủ định ''mà không bị khuất phục''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định: giữ đại từ tự quy chiếu ''mình''
    theo DEC-P01-001 và phủ định ''không nên suy đoán lung tung''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & tình thái bắt buộc: Lergen gọi Tanya là ''Cô'',
    dùng ''Chúng ta''; giữ ''sở chỉ huy'', ''hồ sơ chính thức hoàn toàn khớp nhau''
    và tình thái ''sẽ cần phải'', ''phải đảm bảo''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: giữ câu đáp lễ phép ''“Tất nhiên
    rồi, thưa Đại tá.”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trước toàn quân, điểm nhìn trần thuật & thuật ngữ: Lergen
    tự xưng ''tôi''/''chúng tôi'', gọi binh lính là ''các bạn''; phần dẫn dùng đại
    từ ''anh''; giữ ''Kampfgruppe'', ''khu nghỉ dưỡng'', ''Bộ Tổng tham mưu'', ''vé
    tàu hạng nhất'' và ''thủ đô''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Miêu tả trần thuật: giữ câu ngắn ''Một làn sóng reo hò và vỗ tay
    vang lên.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & tên riêng: giữ ''Lergen'', ''Tanya'' và
    chi tiết ''một cái bắt tay trang trọng''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Lergen gọi Tanya là ''Cô'' và
    ''Trung tá''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại: giữ lời đáp ngắn gọn ''“Cảm ơn Đại tá.”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, xưng hô & thuật ngữ: phần dẫn quy chiếu
    Lergen bằng ''anh''; trong thoại, Lergen xưng ''tôi'', gọi Tanya là ''cô''; giữ
    ước lượng thời gian ''khoảng hai mươi phút nữa thôi'' và thuật ngữ ''phiếu khẩu
    phần''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & thuật ngữ: giữ tên riêng ''Tanya'', đại
    từ ''cô'' (cùng đại từ phản thân ''mình'' tự nhiên) và chức danh ''vị phó chỉ
    huy''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tên riêng & xưng hô trong thoại: Tanya gọi ''Thiếu tá
    Weiss'', xưng ''tôi'' và gọi Weiss là ''anh''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại cấp dưới: giữ câu đáp điều lệnh ''“Rõ, thưa
    Trung tá!”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & tên riêng: giữ ''Weiss'', ''Tanya'', ''Lergen''
    và trạng thái ''gần như hoàn toàn riêng tư''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Miêu tả không gian: giữ câu ''Một khoảng trống nhỏ tách biệt mở
    ra ngay giữa nhà ga.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tên riêng & xưng hô trong thoại: Lergen gọi ''Trung
    úy Serebryakov'', xưng ''chúng tôi'' và gọi Serebryakov là ''cô'' trong lời đề
    nghị lánh mặt và gọi xe hơi."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái: giữ tên riêng ''Lergen'', tình thái ''có
    vẻ như'' và cấu trúc phủ định ''sẽ không hài lòng với bất kỳ điều gì kém hơn sự
    riêng tư tuyệt đối''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại: Tanya nhắc tới Lergen là ''Đại tá'' và gọi
    Serebryakov là ''Trung úy''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại cấp dưới: giữ câu đáp điều lệnh ''“Rõ, thưa
    Trung tá!”'' của Serebryakov."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: giữ ''Viên sĩ quan phụ tá của mình''
    với đại từ tự quy chiếu ''mình'' theo DEC-P01-001, đại từ ''cô ấy'' chỉ Serebryakov
    và tình thái chắc chắn ''Chắc chắn''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & cấu trúc điều kiện: giữ đại từ ''anh ta''
    chỉ Lergen, ''cô ấy'' chỉ Serebryakov, cấu trúc nhượng bộ ''ngay cả khi...'' và
    câu điều kiện bỏ lửng ''Nếu anh ta đã kiên quyết cẩn trọng đến mức đó…''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô trong thoại: giữ ''Sĩ quan phụ tá của tôi''
    trong lời nói của Tanya với Lergen."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ câu đáp ngắn gọn mang tính tất yếu ''“Tình thế
    bắt buộc phải vậy thôi.”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ câu cảm thán đánh giá sắc thái ''Thật là
    một câu nói nghe chẳng lành chút nào.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: Lergen xưng ''Tôi'', gọi Tanya
    là ''cô''; giữ tên cơ quan ''Văn phòng Bộ Tổng tham mưu'' và chi tiết ''Chỉ có
    ba việc ngắn gọn thôi''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại: giữ câu đáp ''“Vâng, thưa Đại tá.”''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, thuật ngữ & tình thái: giữ đại từ ''Anh''
    ở phần dẫn; trong thoại giữ ''Bộ Tổng tham mưu'', ''Bộ Tư lệnh Tối cao'', ''một
    chiến dịch lớn ở phía đông'', đại từ ''chúng ta'', định danh ''Vị tướng của chúng
    ta'' và mức độ tình thái ''đã suýt thua'', ''chỉ đang cố cầm cự trong gang tấc
    mà thôi''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn trong thoại: giữ câu hỏi xác nhận lễ phép ''“Một
    chiến dịch lớn sao ạ?”'' của Tanya."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & quan hệ nhân quả: bọc chính xác
    cụm ''*Đúng vậy*'' bằng dấu sao theo DEC-P01-002; giữ ''Chiến dịch Andromeda'',
    ''Quân đội Liên bang'', ''Bộ Tổng tham mưu'', đại từ ''chúng ta'' và quan hệ hệ
    quả ''Vì thế khi đợt phản công tất yếu nổ ra, chúng ta sẽ vừa đối phó với nó vừa
    cố gắng thu hẹp và củng cố phòng tuyến''."]'
