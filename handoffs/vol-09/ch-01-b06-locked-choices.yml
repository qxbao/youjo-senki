choices:
- segment_id: YS-LN09/Text/chapter004.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định: Tanya tự quy chiếu bằng ''Mình''
    theo DEC-P01-001; giữ phủ định ''không thể tin nổi'' và đại từ ''họ'' chỉ giới
    chỉ huy cấp cao."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & liên kết thuật ngữ trong thoại: giữ đại từ
    ''chúng ta'', cấu trúc phủ định ngoại trừ ''không còn lựa chọn nào khác ngoài
    việc nhử chúng vào tròng'' và tiểu từ nghi vấn lễ phép ''sao ạ?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & quan hệ đối lập: quy chiếu Lergen bằng
    ''anh'', giữ tên riêng ''Lergen'', ''Tanya'' và mệnh đề đối lập ''nhưng Tanya
    buộc phải chỉ ra một điều''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện & tình thái: giữ ''hướng tiến công chủ lực
    của địch'', ''phản ứng dây chuyền'', đại từ ''chúng ta''/''toàn quân ta'' và cấu
    trúc điều kiện ''Nếu chúng ta phán đoán sai..., việc đó có thể...''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định kép trong thoại: Lergen xưng ''Tôi''/''tôi'',
    dùng đại từ phản thân ''mình'', giữ ''chúng ta'' và phủ định kép ''tôi không thể
    nói rằng chúng ta không có cơ hội thành công nào''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Tình thái giả định trong thoại: giữ ''Giả sử bằng cách nào đó
    chúng ta xoay xở thực hiện được việc ấy'' và câu bỏ lửng ''Ngay cả khi đó…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & xưng hô: bọc chính xác cụm ''*cũng có*''
    bằng dấu sao theo DEC-P01-002; giữ tên ''Lergen'' ở phần dẫn và đại từ ''cô''
    khi Lergen gọi Tanya."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & câu hỏi nội tâm gián tiếp: giữ câu hỏi
    phân vân mở đầu, đại từ ''anh'' chỉ Lergen, tên riêng ''Tanya'' và chi tiết phản
    ứng ''bất giác cứng người lại''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & sắc thái mỉa mai: Tanya tự quy chiếu bằng
    ''Mình'' theo DEC-P01-001, gọi Lergen là ''anh ta''; giữ ''thắng lợi giả định'',
    ''lối nói hai lời trơ trẽn'' và ''lập trường chính thức''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ tên riêng ''Tanya'' và quyết tâm ''phải
    ép mạnh thêm một chút nữa rồi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & giả định xác suất thấp: Tanya xưng ''tôi'',
    dùng ''chúng ta''; giữ phủ định ''Ngay cả tôi cũng không cho rằng chúng ta sẽ
    thua'', giả định ''vạn nhất chúng ta có thành công đi chăng nữa'' và cụm ''đòn
    quyết định đặt dấu chấm hết cho cuộc chiến''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ ''Lục quân Đế quốc'', tên chiến dịch
    ''Búa Sắt'', đại từ ''chúng ta'' và tình thái ''có lẽ là chiến thắng vĩ đại nhất
    mà chúng ta có thể hy vọng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhịp câu & đối lập: giữ ''Đế quốc'', ''tiêu diệt hoàn
    toàn đạo quân dã chiến của địch'', ''Chiến dịch Búa Sắt'', nhịp các câu ngắn liệt
    kê chiến quả và câu cảm thán đối lập cuối đoạn (không thêm nhấn mạnh cho thẻ neo
    trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & tình thái: giữ ''Quân đội Liên bang'', ''Đế
    quốc'', ''Liên bang'', hình ảnh ẩn dụ ''Những cột trụ nơi nền móng của họ có thể
    đang kẽo kẹt đôi chút, nhưng xem chừng chúng vẫn chưa gãy đổ'' và cụm ''sự chênh
    lệch lớn về khả năng bù đắp tổn thất''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi nội tâm: giữ ''cỗ máy chiến tranh chuẩn xác
    của Lục quân Đế quốc'', ''khoảng cách thực lực quốc gia'', ''chiến tranh tổng
    lực'' và câu hỏi cảm thán với đại từ ''Chúng ta''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Đại từ & bổ sung hạn định trong thoại: giữ ''chúng ta'', ''một
    đòn giáng mạnh mẽ'' và phần rào đón sau dấu gạch ngang dài ''—ít nhất là theo
    lời cấp trên''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trong thoại: giữ dấu chấm lửng mở đầu, đại từ ''chúng
    ta'' và thuật ngữ ''sức mạnh không quân''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phản biện nội tâm: giữ đại từ ''Chúng ta''/''quân
    mình'', ''ưu thế trên không tạm thời ở miền đông'', câu hỏi ''nhưng bầu trời lúc
    này trông ra sao cơ chứ?'' và ý ''Chỉ riêng việc duy trì thế giằng co ngay trên
    đầu quân mình thôi cũng đã vắt kiệt sức lực lượng của chúng ta rồi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu điều kiện bỏ lửng: giữ ''giới chóp bu'' và cấu
    trúc điều kiện bỏ lửng ''Nếu... thì còn là một nhẽ, đằng này…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định điều kiện trong thoại: Tanya xưng
    ''Tôi'', dùng kính ngữ ''ạ''; giữ ''lực lượng không quân'', ''các mặt trận khác'',
    ''Tôi không có ý bất kính'', ''nếu không nắm được quyền kiểm soát bầu trời'' và
    ''một chiến dịch lớn ở miền đông là…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giả định hệ quả trong thoại: giữ ''Chúng ta không thể
    tập trung thêm lực lượng vào đó nữa'', ''Vùng công nghiệp ở miền tây sẽ chìm trong
    biển lửa mất'' và khẳng định bác bỏ ''Chuyện đó là không thể bàn tới''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn trần thuật: bọc chính xác cảm thán
    ''*Khoan, khoan đã nào.*'' bằng dấu sao theo DEC-P01-002; giữ tên riêng ''Tanya'',
    bối cảnh ''trên sân ga'' và quan hệ đối lập ''nhưng rõ ràng là không thể làm ngơ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & xác nhận lễ phép: giữ ''trái tim của nền công
    nghiệp Đế quốc'', đại từ ''chúng ta'' và câu hỏi xác nhận có kính ngữ ''rồi chứ
    ạ?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Lergen gọi Tanya là ''cô'', dùng
    ''Chúng ta''; giữ ''mặt trận phía tây'', ''Tân binh non nớt'', ''cựu binh'', ''các
    đội hình hỗn hợp'', ''các chiến dịch chủ động'' và hai câu phủ định về thực trạng
    lực lượng (không thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & câu hỏi tu từ: quy chiếu Lergen bằng ''anh'',
    giữ chi tiết đối lập ''tin tức lạnh sống lưng ấy với một nụ cười trên môi'' và
    câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ chiến lược: Lergen xưng ''tôi'', gọi Tanya
    là ''cô'', dùng ''Chúng ta''; giữ ''Cuộc không chiến ở miền tây'', ''quân đoàn
    viễn chinh'', ''mặt trận phía nam'', ''lực lượng yểm trợ đường không'' và địa
    danh ''Ildoa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Phủ định mở đầu lập luận nội tâm: giữ cấu trúc phủ định ''Không
    phải là chúng ta đang thiếu hụt phần sức mạnh dư ra.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Phủ định tuyệt đối & liên kết đoạn: giữ ''Mà thứ đó đơn giản là
    không hề tồn tại'', ''Chúng ta đã cạn kiệt rồi'' và mệnh đề bỏ lửng cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & đối lập mức độ: Tanya tự quy chiếu bằng ''Mình''
    theo DEC-P01-001; giữ tên riêng ''Lergen'' và hình ảnh ''chẳng khác nào một đòn
    làm tê liệt cả người''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & phủ định trong thoại: Lergen gọi Tanya là
    ''cô'', giữ tình thái ''có lẽ'' và thông báo ''cũng sẽ không còn nhận được quân
    bổ sung đâu''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn lễ phép: giữ dấu chấm lửng mở đầu và câu hỏi ''“…Chuyện
    đó là chắc chắn sao ạ?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ phủ định: giữ ''nhân sự chất lượng cao'', mức
    độ tăng tiến ''ngày càng trở nên vô cùng khó khăn'' và ''hầu như chẳng có hy vọng
    nhận được ai đâu''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ nội tâm: giữ câu khẳng định ''Cựu binh là nòng cốt của
    bất kỳ tổ chức nào.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Liên kết từ vựng & phủ định: giữ từ ''nòng cốt'' liên kết trực
    tiếp với p000066 và phủ định ''sẽ không còn nòng cốt nữa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định trong câu hỏi: Tanya gọi Lergen
    là ''ngài'', kết câu bằng ''sao ạ?''; giữ ''các đơn vị tiền tuyến'' và ''nguồn
    quân bổ sung đáng tin cậy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép trong thoại: giữ ''Không có đủ nhân sự đã qua huấn
    luyện…'' và ''Chẳng nơi nào còn dư người để san sẻ cả.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & quan hệ nhượng bộ: giữ ''lực lượng nòng
    cốt'', đại từ ''Chúng ta''/''chúng ta'', phủ định ''chẳng còn nơi nào'' và mệnh
    đề nhượng bộ cảm thán với ''lệnh tổng động viên dân số cả nước''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Sắc thái nội tâm & câu hỏi tu từ: giữ cụm ''Đám người cục mịch
    đang hậu thuẫn cho đạo quân khổng lồ này'', phủ định ''không thể vét thêm được
    chút nhân sự nào nữa'' và ''bộ máy quan liêu hiện đại tinh vi của Đế quốc''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc chính xác toàn bộ câu ngắn ''*Sự khởi
    đầu của hồi kết.*'' bằng dấu sao theo DEC-P01-002."]'
