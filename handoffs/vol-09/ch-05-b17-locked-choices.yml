choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000557
  kind: terminology_and_voice
  value: choice=Đại từ trần thuật 'anh' cho Meybert; giữ rõ độ chính xác của loạt
    đạn bắn nhanh và một phát trúng đích hoàn hảo.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000558
  kind: terminology_and_voice
  value: choice=Meybert gọi các pháo thủ thuộc cấp là 'các cậu', dịch 'eastern front'
    là 'mặt trận phía đông'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000559
  kind: terminology_and_voice
  value: choice=Dịch 'artilleryman' là 'người lính pháo binh' và 'gunners' là 'các
    pháo thủ'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000560
  kind: terminology_and_voice
  value: choice=Giữ tình thái phỏng đoán ('có vẻ như', 'dường như') và dịch 'heavy
    armor-piercing rounds' là 'đạn xuyên giáp hạng nặng'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000561
  kind: terminology_and_voice
  value: 'choice=Đại từ ''anh'' cho Meybert; dịch chuẩn các loại phương tiện: ''tàu
    vận tải'', ''xuồng máy cao tốc'', ''tàu khu trục'' và ''tàu tuần dương hạng nhẹ''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000562
  kind: terminology_and_voice
  value: choice=Giữ khẳng định dứt khoát rằng đám tàu xuồng này chắc chắn cùng một
    quốc tịch.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000563
  kind: terminology_and_voice
  value: choice=Giữ tình thái 'có lẽ' ('perhaps') về việc sự do dự của những người
    khác sẽ tan biến khi máy vô tuyến bắt đầu gào lên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000564
  kind: terminology_and_voice
  value: choice=Dịch 'HQ' là 'Bộ chỉ huy', giữ nhịp cầu cứu và mệnh lệnh huy động
    bộ binh khẩn cấp qua vô tuyến.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000565
  kind: terminology_and_voice
  value: choice=Giữ tật nói lắp 'B-bắn trả! Bắn trả đi!' thể hiện sự hoảng loạn trên
    sóng vô tuyến.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000566
  kind: terminology_and_voice
  value: choice=Dịch 'battle stations' là 'vị trí chiến đấu', giữ câu thông báo bên
    pháo binh đã giao chiến.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000567
  kind: terminology_and_voice
  value: choice=Giữ câu hỏi bức thiết về việc xác minh danh tính quân địch.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000568
  kind: terminology_and_voice
  value: choice=Dịch 'duty officer' là 'sĩ quan trực ban' và giữ dấu chấm lửng ở cuối
    câu bị ngắt quãng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000569
  kind: terminology_and_voice
  value: choice=Dịch 'submarine pen' là 'boong-ke tàu ngầm', giữ lời cảnh báo đó chính
    là mục tiêu địch nhắm tới.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000570
  kind: terminology_and_voice
  value: 'choice=Khẩu lệnh ngắn gọn: ''Bảo vệ Bộ chỉ huy!''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000571
  kind: terminology_and_voice
  value: choice=Dịch 'Scramble the mages!' là 'Cho các pháp sư xuất kích khẩn cấp!'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000572
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Aaaa, chết tiệt. Xem
    chừng hỗn loạn toàn diện rồi.*' và mức độ 'suýt nữa', 'miễn cưỡng' trong trần
    thuật.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000573
  kind: terminology_and_voice
  value: choice=Đại từ 'Anh' cho Meybert; giữ quan hệ điều kiện phủ định về việc ưu
    thế quân số sẽ vô tác dụng nếu quân đồn trú rối loạn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000574
  kind: terminology_and_voice
  value: choice=Dịch 'artillery in their fixed locations' là 'lực lượng pháo binh
    tại các trận địa cố định' và 'a small detachment of infantry' là 'một phân đội
    bộ binh nhỏ'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000575
  kind: terminology_and_voice
  value: choice=Bảo toàn nhấn mạnh Markdown cho toàn bộ câu hỏi nội tâm và dùng đại
    từ tự quy chiếu 'Mình'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000576
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác phạm vi nhấn mạnh Markdown ở câu đầu '*Có lẽ cách
    hiệu quả nhất là để họ yểm trợ những đơn vị khác.*'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000577
  kind: terminology_and_voice
  value: choice=Meybert gọi 'Trung úy Tospan', xưng 'tôi - cậu' nhất quán với các
    batch trước.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000578
  kind: terminology_and_voice
  value: choice=Tospan gọi Meybert là 'anh' kèm kính ngữ 'ạ' ở cuối câu hỏi.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000579
  kind: terminology_and_voice
  value: choice=Giữ nhịp đáp ngắn gọn, thẳng thắn của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000580
  kind: terminology_and_voice
  value: choice=Giữ nhận định của Meybert rằng họ đang đánh mất thế chủ động ngay
    trong lúc đang trao đổi.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000581
  kind: terminology_and_voice
  value: choice=Meybert dùng 'chúng ta' và gọi quân địch là 'một lũ anh hùng điên
    rồ', khẳng định quyết tâm nhấn chìm chúng xuống đáy biển.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000582
  kind: terminology_and_voice
  value: choice=Tospan đáp 'Đúng vậy ạ' và tự xưng 'tôi' khi hỏi xin chỉ thị cho đơn
    vị mình.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000583
  kind: terminology_and_voice
  value: choice=Meybert xưng 'Tôi - cậu', dùng 'chúng ta' / 'ta' và dịch 'garrison'
    là 'Đơn vị đồn trú'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000584
  kind: terminology_and_voice
  value: choice=Tospan gọi Meybert là 'anh' kèm 'ạ', xưng 'tôi', nêu băn khoăn về
    quân số khi chỉ có một đại đội.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000585
  kind: terminology_and_voice
  value: choice=Dịch 'commando unit' là 'đơn vị biệt kích', 'special ops unit' là
    'đơn vị đặc nhiệm', giữ giọng đánh giá thẳng thừng của Meybert về việc không thua
    về số lượng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000586
  kind: terminology_and_voice
  value: 'choice=Tospan nhận lệnh: ''Rõ, thưa Đại úy.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000587
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Cảm ơn, tôi trông
    cậy vào cậu đấy*' (lời Meybert định nói với Tospan) và dịch 'observation post'
    là 'đài quan sát'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000588
  kind: terminology_and_voice
  value: 'choice=Tiếng hô cảnh báo ngắn gọn: ''Phát hiện pháp sư!''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000589
  kind: terminology_and_voice
  value: 'choice=Giữ phản ứng quay phắt lại và câu hỏi dồn dập của Meybert: ''Từ đâu?
    Trên bầu trời ư?!''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000590
  kind: terminology_and_voice
  value: choice=Cấp dưới báo cáo có 'ạ' ('Từ con tàu ạ') và thông báo phát hiện nhiều
    tín hiệu bên trong tàu.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000591
  kind: terminology_and_voice
  value: choice=Meybert dùng 'chúng' (địch), 'họ' (pháp sư địch) và 'chúng ta' (quân
    mình).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000592
  kind: terminology_and_voice
  value: choice=Dịch 'aerial mages' là 'các pháp sư trên không' và 'Lergen Kampfgruppe'
    là 'Kampfgruppe Lergen'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000593
  kind: terminology_and_voice
  value: choice=Dịch '203rd Aerial Mage Battalion' là 'Tiểu đoàn Pháp sư Trên không
    số 203', giữ cấu trúc giả định trái thực tế ở quá khứ ('Nếu Meybert không tận
    mắt chứng kiến... hẳn anh sẽ khó mà tin nổi').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000594
  kind: terminology_and_voice
  value: choice=Dịch 'heavy hitters' là 'những mũi chủ lực hạng nặng' và 'shock and
    awe' là 'nỗi kinh hoàng và choáng ngợp'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000595
  kind: terminology_and_voice
  value: choice=Giữ phủ định tuyệt đối 'Không đời nào' khi khẳng định pháp sư đi yểm
    trợ biệt kích địch không thể là kẻ nghiệp dư.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000596
  kind: terminology_and_voice
  value: choice=Meybert báo tin cho 'Trung úy Tospan' về đơn vị pháp sư địch bên trong
    tàu.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000597
  kind: terminology_and_voice
  value: 'choice=Tospan hỏi lại có kính ngữ: ''Pháp sư hải quân đánh bộ sao ạ?''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000598
  kind: terminology_and_voice
  value: choice=Dịch 'the garrison’s mage unit' là 'đơn vị pháp sư của quân đồn trú'
    và 'The scramblers' là 'Lực lượng xuất kích khẩn cấp'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000599
  kind: terminology_and_voice
  value: choice=Dịch 'rapid response mages' là 'Các pháp sư phản ứng nhanh', giữ sự
    đối sánh tốc độ xoay xở với các pháp sư trên không mà Meybert quen thấy và kết
    luận nhiệm vụ của pháo binh không đổi.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000600
  kind: terminology_and_voice
  value: choice=Meybert gọi 'Trung úy Tospan', giữ giọng cảm thán nhẹ nhõm khi có
    pháp sư quân mình trên không.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000601
  kind: terminology_and_voice
  value: choice=Tospan xưng 'Tôi' kèm 'ạ', giữ câu hỏi đuôi mong muốn xoay xở thêm
    chi viện của pháp sư.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000602
  kind: terminology_and_voice
  value: choice=Meybert xưng 'tôi và cậu', dịch tự nhiên ý 'had it too easy' là 'đều
    từng được chiều chuộng đến hư cả rồi'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000603
  kind: terminology_and_voice
  value: choice=Dịch 'Colonel Degurechaff' là 'Trung tá Degurechaff', giữ lời khen
    xen lẫn tiếng chửi thề tiếc nuối của Tospan.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000604
  kind: terminology_and_voice
  value: 'choice=Giữ câu trần thuật ngắn gọn: ''Tospan càu nhàu qua đường dây.''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000605
  kind: terminology_and_voice
  value: choice=Phân biệt rõ đại từ 'anh' (Meybert) và 'anh ta' / 'viên trung úy'
    (Tospan); giữ chi tiết cả hai từng trải qua lễ rửa tội ở mặt trận phía đông.
