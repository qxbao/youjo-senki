choices:
- segment_id: YS-LN09/Text/chapter004.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ trong thoại: Tanya xưng ''Tôi''/''tôi'',
    gọi Lergen là ''Ngài'' kèm kính ngữ ''ạ''; giữ phủ định ''chẳng có hứng thú gì
    với việc bị quân mình bắn vào người'', cụm cảm thán ''—kinh hoàng lắm'' và các
    thuật ngữ ''gã trinh sát viên pháo binh ngu xuẩn'', ''Kampfgruppe'', ''mặt trận
    phía đông''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & tình thái gợi ý trong thoại: Lergen dùng ''chúng
    ta'' cho hoàn cảnh chung, gọi Tanya là ''cô'' và ''Trung tá''; giữ câu điều kiện
    giả định ''nếu có mấy kẻ ngu xuẩn bắn vào cô, thì biết đâu cô cứ để mặc cho họ
    bắn lại hay đấy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn lễ phép: giữ dấu chấm lửng và từ hỏi lễ phép ''“…Dạ?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định thuận lợi trong thoại: giữ ''Các đơn vị phòng
    không'', ''Liên lạc nội bộ trong quân đội ta vốn không chê vào đâu được'' và nhận
    định ''Thật ra nếu có ai đó nổ súng thì lại càng tiện''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & phủ định: quy chiếu Lergen bằng ''anh ta'',
    giữ đúng đối tượng câu hỏi và phủ định ''Điều gì đang ẩn sau những lời anh ta
    chưa nói ra?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Nhận định mức độ nội tâm: giữ câu ngắn ''Chuyện này đã vượt xa
    mức nguy hiểm rồi.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi tu từ & thuật ngữ trong thoại: Tanya xưng ''tôi'',
    dùng ''Chúng ta'' cho phía Đế quốc; giữ câu hỏi phản biện ''chẳng phải chẳng khác
    nào công khai rêu rao rằng lưới phòng không của thủ đô có lỗ hổng sao ạ?'' và
    các thuật ngữ ''Khối Thịnh vượng chung'', ''ném bom chiến lược''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện giả định & sắc thái thái độ trong thoại:
    giữ ''đế đô'', đại từ ''tôi'' của Lergen, mệnh đề giả định ''nếu nơi mà họ cảm
    thấy an toàn suýt bị ném bom'' và sắc thái khinh miệt ''ngay cả đám chính khách
    cũng sẽ buộc phải sáng mắt ra thôi'' (không thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn pha trộn nội tâm – trần thuật: giữ tên riêng ''Lergen'',
    ''Tanya'', đại từ ''anh'', ''cô'' ở câu cuối, cụm ''tràn ngập vẻ ghê tởm và thù
    địch'', ''ghét đám chính khách'' và ''bộc lộ chút cảm xúc thật trước mặt Tanya
    cũng phần nào khiến cô thấy nhẹ nhõm''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Đối lập thái độ & thuật ngữ: quy chiếu Lergen bằng ''anh'', giữ
    đối lập giữa ''thái độ thẳng thừng hơn hẳn khi nói về giới chính khách'' với ''những
    băn khoăn của anh đối với Bộ Tư lệnh Tối cao lại vòng vo hơn nhiều'' và nhận định
    ''một sự khác biệt nhỏ nhưng mang tính sống còn''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & câu hỏi xác nhận trong thoại: giữ ''Thưa Đại tá… Ngài
    nói thật về tất cả những chuyện này sao ạ?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Câu điều kiện lập luận trong thoại: giữ mệnh đề ''Nếu mục đích
    biện minh cho phương tiện, thì đó rõ ràng là phương án nhanh nhất.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi suy luận nội tâm: giữ câu hỏi giả định ''Nghĩa là nếu
    có một giải pháp thay thế khả thi thì vẫn hơn ư?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & điều kiện suy luận: giữ tên riêng ''Lergen'',
    đại từ ''anh ta'', nhận định ''có vẻ là một người biết điều'' và hệ quả ''lời
    nhận xét vừa rồi của anh ta ẩn chứa những hàm ý vô cùng sâu xa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi giả định phủ định & quân hàm trong thoại: giữ dấu chấm
    lửng, phủ định ''nếu mục đích không biện minh cho phương tiện thì sao'' và cách
    gọi ''thưa Đại tá''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & tự rút lời trong thoại: Lergen gọi Tanya là
    ''cô''; giữ gợi ý ''tự mình liệu chừng mà bắn trượt vài thuật thức theo cách nào
    đó không gây chết người'' và câu tự gạt đi ''Ừm, thôi, đòi hỏi thế thì quá đáng
    thật''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & chi tiết biểu cảm: quy chiếu Lergen bằng
    ''Anh''/''anh'', Tanya bằng ''cô''; giữ ''sắc mặt trông rất tệ khi phải gắng gượng
    ép cổ họng mình phát ra tiếng'' và ''vất vả lắm mới thốt ra nổi những lời đó''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu thoại bỏ lửng: giữ ''“Xin thứ lỗi, thưa Đại tá Lergen,
    nhưng mà…”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & phủ định tự đánh giá: giữ tên riêng ''Lergen'',
    đại từ tự quy chiếu ''Mình''/''mình'' theo DEC-P01-001, đại từ ''anh ta'' chỉ
    Lergen, phủ định ''không phải mẫu người sẽ nói ra những lời như thế này'', ''sẽ
    không đi xa đến mức vỗ ngực tự nhận là mình hiểu rõ tường tận tính cách của anh
    ta'' và đánh giá ''một công dân đàng hoàng có đủ cả lương tri lẫn đạo đức''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ cụm quy chiếu ''người đàn ông này'' và câu
    hỏi về nguyên nhân thay đổi đột ngột của Lergen."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & câu hỏi trong thoại: giữ tên riêng ''Tanya''
    ở phần dẫn và câu hỏi lễ phép ''“…Đã có chuyện gì xảy ra vậy ạ?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: bọc chính xác toàn bộ câu
    hỏi nội tâm ''*Anh ta đang do dự sao?*'' bằng dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: quy chiếu Lergen bằng ''anh'', giữ chi tiết
    ''Đôi vai anh khẽ run lên khi anh mò tìm hộp đựng xì gà của mình''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: Lergen xưng ''tôi'', gọi Tanya
    là ''cô'', dùng ''chúng ta'' cho phái đoàn và Tổ quốc; giữ ''Chiến dịch Búa Sắt'',
    ''Ildoa'', ''phái đoàn ngoại giao'' và ''mở ra một con đường cho tương lai của
    Tổ quốc chúng ta''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & mệnh đề nhượng bộ trong thoại: Tanya xưng
    ''tôi'', gọi ''thưa Đại tá'', dùng ''chúng ta'' cho phía Đế quốc; giữ ''sức kháng
    cự đáng gờm của lũ Cộng sản đã dồn chúng ta vào chân tường'' và ''niềm vui ấy
    thật ngắn ngủi, nhưng…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định tự ngắt lời trong thoại: Lergen gọi Tanya là
    ''Cô''/''cô'', xưng ''Tôi''; giữ lời mời thuốc rồi sực nhớ ''…À, khoan đã. Tôi
    không thể mời cô được.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn lễ phép: giữ ''“Thưa Đại tá?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Phủ định, nhấn mạnh Markdown & điểm nhìn trần thuật: giữ ''cấp
    trên'', phủ định ''lệnh ngừng bắn tạm thời đã không bao giờ thành hiện thực'',
    giới hạn ''Tôi chỉ có thể nói đến thế thôi''; bọc chính xác cụm ''*Thôi bỏ đi*''
    bằng dấu sao theo DEC-P01-002 (không thêm nhấn mạnh cho thẻ neo trang); quy chiếu
    Lergen bằng ''anh'' và giữ chi tiết ''từng cử chỉ của anh lại mang vẻ thô bạo
    đến lạ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Tình thái tiếc nuối quá khứ trong thoại: giữ ''“Đáng lẽ việc đó
    đã phải nắm chắc trong tay rồi.”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi lại lễ phép trong thoại: giữ ''“Ngài nói sao ạ?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh phủ định & giới hạn thẩm quyền trong thoại: Lergen xưng
    ''tôi''/''mình'', giữ ''Đừng để ý đến lời tôi. Ngay cả với thẩm quyền của mình…
    tôi cũng không thể tiết lộ thêm gì nữa.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Câu xin lỗi lễ phép trong thoại: giữ ''“Tôi xin lỗi ạ.”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn trần thuật & xưng hô trong thoại:
    bọc chính xác thán từ ''*Phù*'' bằng dấu sao theo DEC-P01-002; giữ tên riêng ''Lergen''
    ở phần dẫn, đại từ ''Chúng ta'' chỉ giới quân nhân và ''tôi'' ở câu cuối."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Đan xen thoại – nội tâm, nhấn mạnh Markdown & câu hỏi tu từ: giữ
    lời rào đón ''Xin thứ lỗi nếu tôi có phần mạo phạm, thưa Đại tá, nhưng tôi cũng
    đồng tình''; giữ tên riêng ''Tanya'' và bọc chính xác ''*cần thiết*'' bằng dấu
    sao theo DEC-P01-002; giữ nhịp mỉa mai nội tâm ''Phải, chúng ta vẫn còn sống.
    Tuyệt vời làm sao.'', nhận định ''việc vứt bỏ mạng người cũng khó lòng gọi là
    hợp lý được'' và câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Liên kết ẩn dụ & tâm trạng bất định trong thoại: Lergen xưng ''tôi''/''mình'',
    giữ liên kết ẩn dụ ''đã đang chìm nghỉm vào đó rồi'' (nối với ''đắm chìm trong
    sự ủy mị'' ở p000153), cảm giác ''chỗ đứng của mình đang hết sức chênh vênh nguy
    hiểm'' và ''khó mà phân biệt nổi liệu mình có thực sự đang sống hay không nữa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn lễ phép: giữ ''“Thưa Đại tá?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Tình thái dự đoán & câu hỏi đối lập trong thoại: Lergen xưng ''tôi'',
    giữ ''Lịch sử nhiều khả năng sẽ quả quyết rằng tôi từng ở ngoài miền đông'' và
    câu hỏi ''Đâu là sự thật và đâu là dối trá?''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn suy đoán nội tâm & đối lập hoàn cảnh: giữ địa danh ''Ildoa'',
    đối lập giữa ''quãng thời gian thong thả ở Ildoa, vùng đất được ưu ái ban tặng
    ánh nắng ngập tràn'' với ''được hậu thế ghi nhớ như một người từng đứng nơi mặt
    trận phía đông'', tên riêng ''Lergen'' và ''trong một thoáng tự giễu''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & quan hệ điều kiện: Tanya tự quy chiếu bằng
    ''Mình'' theo DEC-P01-001; giữ phủ định mức độ ''chẳng mấy tán thành chuyện chỉ
    thiên vị những người trực tiếp xông pha nơi lằn ranh sinh tử'' và nhận định về
    vai trò của ''những công việc thầm lặng diễn ra ở hậu trường''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi cảm thán trong thoại: giữ hai câu hỏi đau xót ''“Thực
    lòng mà nói, những cái chết này là vì điều gì cơ chứ? Tại sao lại phải hy sinh
    nhiều đến thế này?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn lễ phép: giữ ''“Thưa Đại tá?”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & hành động trần thuật: Lergen gọi Tanya là
    ''cô'', xưng ''tôi'', dùng ''chúng ta''; giữ phủ định ''cô không cần bận tâm đến
    lời tôi đâu—tôi chỉ đang than vãn chút thôi'', ''Rên rỉ ở nơi công cộng chẳng
