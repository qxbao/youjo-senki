  value: 'choices=["Điểm nhìn trần thuật, phủ định & liên kết từ vựng: giữ tên riêng
    ''Tanya'', đại từ ''cô''/''Cô'', ''anh'' (chỉ Lergen), chức danh ''viên sĩ quan
    phụ tá của mình'', phủ định ''đây chẳng phải lúc để Tanya tự giác thú nhận'' và
    từ ''than vãn'' lặp lại tương ứng với lời Lergen ở p000161."]'
