choices:
- segment_id: YS-LN09/Text/chapter004.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý & điểm nhìn: giữ quan hệ đối lập ''Thế nhưng''
    và nét nghĩa bị thu hút (''ý tưởng đó lại đầy sức quyến rũ'') trong dòng suy nghĩ
    của Rudersdorf; không thêm nhấn mạnh Markdown."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=["Xưng hô độc thoại, tên riêng & tình thái giả định: Rudersdorf
    tự xưng ''ta'', quy chiếu Zettour bằng ''Zettour'' / ''Ông ấy''; giữ ''mặt trận
    phía đông'', ''các đơn vị tác chiến'', ''mặt trận phía tây'' và câu giả định bỏ
    lửng ''Giá mà ta có thể bố trí một người đáng tin cậy ở đằng đó…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, câu hỏi nội tâm & thuật ngữ: chỉ bọc ''*Liệu
    chúng ta có thể thành công không?*'' bằng dấu sao theo DEC-P01-002; giữ đại từ
    ''chúng ta'', ''sĩ quan tham mưu'', tự quy chiếu ''mình'' và cụm ''trong phạm
    vi khả thể thuần túy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000262
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, ẩn dụ & thuật ngữ: quy chiếu Rudersdorf bằng
    ''ông''; giữ ẩn dụ ''cứng nhắc và rỉ sét'' / ''Tra dầu cho nó bằng chuyên môn
    tác chiến khiến các bánh răng quay nhanh hơn hẳn'' và ''cách bố trí binh lực''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & mức độ khẳng định: giữ ''ông'', mức độ khẳng
    định tuyệt đối ''với độ chính xác vô song'' và ''triển khai các đơn vị và sử dụng
    chúng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000264
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tự đính chính trong độc thoại: giữ ''Kampfgruppe
    Lergen'', ''ngoại ô thủ đô'', đại từ ''Chúng ta'' và nhịp tự đính chính phủ định
    (''Không, thế thì sít sao quá... mới chỉ là mức tối thiểu chứ còn xa mới đạt yêu
    cầu…''); xử lý dấu câu ở cụm ''vừa đủ'' cho tự nhiên."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000265
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ quân cờ & tên riêng: giữ ''những quân cờ cần thiết'', ''nguyên
    lý cơ bản và là nền tảng cấu thành nên bất kỳ chiến lược nào'', ''cân đối các
    lực lượng'' và tên riêng ''Rudersdorf''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000266
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''lĩnh vực tác chiến'' và ''lối tập trung lực lượng
    truyền thống''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000267
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ đại từ ''Chúng ta'', ''đạo quân viễn chinh''
    và ''lục địa phía nam''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000268
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: giữ ''các sĩ quan tham mưu'', ''tính
    khí của từng người chỉ huy'', ''Bộ Tổng tham mưu'' và ba tính từ ''khắt khe, khép
    kín và đầy đặc quyền''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000269
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & tình thái giả định: giữ ''Romel'' và tình thái suy
    tính bỏ lửng ''hẳn sẽ có thể…''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000270
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định khẳng định: bọc toàn bộ đoạn bằng
    dấu sao ''*Có lẽ vậy. Thực ra thì chẳng còn gì phải nghi ngờ.*'' theo DEC-P01-002;
    giữ nhịp tăng tiến từ phỏng đoán sang khẳng định chắc chắn."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000271
  kind: terminology_and_voice
  value: 'choices=["Đại từ quy chiếu & mức độ: quy chiếu Romel bằng ''Ông ta'' / ''con
    người ấy''; giữ ''thành tích và sự nghiệp tạo dựng được lòng tin'' và ''có thừa
    động lực''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000272
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tên riêng & điểm nhìn: chỉ bọc ''*Đúng rồi…*''
    bằng dấu sao theo DEC-P01-002; giữ ''lập luận đạo đức'', ''Rudersdorf'', đại từ
    ''ông'' và hình ảnh ''đang gào thét phản đối''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, câu hỏi nội tâm & phủ định: bọc toàn bộ đoạn
    bằng dấu sao ''*Một biện pháp phẫu thuật ư? Chuyện đó không thể chấp nhận được.*''
    theo DEC-P01-002; giữ thuật ngữ ''biện pháp phẫu thuật''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000274
  kind: terminology_and_voice
  value: 'choices=["Đại từ độc thoại & tình thái: Rudersdorf tự xưng ''ta'', giữ tình
    thái tự nhận định ''Xem chừng cuối cùng ta cũng đã mệt mỏi đến mức bắt đầu đâm
    ra hoang tưởng rồi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''Bộ Tổng tham mưu'' và ''các định chế của Tổ quốc''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế, phủ định & thuật ngữ: giữ cấu trúc giả
    định ''Nếu các sĩ quan tham mưu có mặt vào thời buổi lập quốc mà thấy được...
    chắc chắn họ sẽ...'', phủ định ''mà chẳng cần chờ lời giải thích nào'', ''thanh
    kiếm kỵ binh'', ''lời thề trung thành cùng danh dự'' và khẳng định ''Đây rõ ràng
    là hành vi phản quốc, không hơn không kém''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ quan hệ nhượng bộ ''Ngay cả khi chỉ
    là một giấc mơ giữa ban ngày'' và ''hành vi kháng lệnh không thể chấp nhận được''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Xưng hô độc thoại & sắc thái: giữ tiếng hừ giọng ''Hừ'', tự xưng
    ''ta'' và nhận định ''đúng là lệch lạc ngay cả với một kẻ như ta''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ câu phủ định ''Đây không phải là con
    đường của một người sĩ quan'', đại từ ''ông'', ''hạng chính khách'' và ''lũ Cộng
    sản đáng nguyền rủa kia''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000280
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc giới hạn: giữ cấu trúc ''chẳng qua chỉ là...
    mà thôi'' và thuật ngữ ''phương án dự phòng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000281
  kind: terminology_and_voice
  value: 'choices=["Phủ định, ẩn dụ & dấu ngoặc kép: giữ cấu trúc ''Ông không hề xem
    xét nó một cách nghiêm túc mà chỉ đơn thuần vờn nghịch ý tưởng ấy như một bài
    tập trí tuệ'' và cụm trong ngoặc kép ''“phương kế cuối cùng thực sự”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000282
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ đoạn bằng dấu sao ''*Phải, tất
    cả chỉ có vậy thôi.*'' theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000283
  kind: terminology_and_voice
  value: 'choices=["Tình thái tần suất: giữ nhận định khái quát ''Một tâm trí mỏi
    mệt đôi khi lại nảy ra những ý tưởng phi lý''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000284
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & đối lập: chỉ bọc ''*giải pháp
    căn cơ*'' bằng dấu sao theo DEC-P01-002; giữ đại từ ''ông'' và thế đối lập giữa
    ''Lý trí gào thét với ông rằng đó là hành động tự sát'' với ''bộ não kiệt quệ
    của ông dẫu sao vẫn bị ý tưởng ấy mê hoặc''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000285
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ẩn dụ cờ tướng/chiến thuật: giữ ''ông'', tự quy chiếu
    ''mình'', ẩn dụ ''đã hết nước đi'' và câu kết ''Thiếu ngủ thật nguy hiểm cho đầu
    óc''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000286
  kind: terminology_and_voice
  value: 'choices=["Tình thái ước muốn & đại từ: giữ cấu trúc giả định ước muốn ''Giá
    mà ta có thể cười xòa cho qua những điều đang làm mình phiền lòng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000287
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thời gian & dấu gạch ngang dài: giữ đại từ ''ông''
    và phần chêm xen bằng gạch ngang dài ''—dù có hơi muộn hơn dự kiến một chút—đã
    đến giờ rồi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000288
  kind: terminology_and_voice
  value: 'choices=["Xưng hô cấp dưới & quân hàm: người thông báo gọi Rudersdorf là
    ''thưa Tướng quân'', gọi Tanya là ''Trung tá Degurechaff'' và dùng kính ngữ ''ạ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000289
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & hành động: giữ ''Rudersdorf'' và chi tiết ''hít nhanh
    một hơi thật sâu để lấy giọng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000290
  kind: terminology_and_voice
  value: 'choices=["Đại từ & mệnh lệnh: giữ đại từ ''ông'' cho Rudersdorf và quy chiếu
    Tanya là ''cô ấy'' trong câu mệnh lệnh ''“Cho cô ấy vào!”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000291
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh quân ngũ: giữ câu đáp ngắn gọn, dứt khoát ''“Tuân lệnh!”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000292
  kind: terminology_and_voice
  value: 'choices=["Phủ định thời gian & chi tiết: giữ cấu trúc ''chẳng bao lâu sau''
    và chi tiết ''tiếng bước chân của hai người tiến lại gần''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn quan sát & thuật ngữ: giữ điểm nhìn của Rudersdorf (''ông''),
    các chi tiết ''đôi mắt rệu rã'', ''sĩ quan cấp tá trở về từ mặt trận phía đông'',
    ''Một đứa trẻ mang gương mặt của một vị chỉ huy dày dạn phong sương'' và ''chiến
    tranh tổng lực''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Rudersdorf gọi Tanya là ''Trung
    tá'' và ''cô'' trong lời chào hỏi thân tình của cấp trên."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trong thoại: Tanya gọi Rudersdorf là ''Tướng
    quân'' / ''Ngài'', giữ dấu chấm lửng ngập ngừng và kính ngữ ''ạ'' trong câu hỏi
    về việc sụt cân."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn Tanya & tình thái suy đoán: giữ ''vị cấp trên của Tanya'',
    đại từ ''ông'' và tình thái suy đoán ''Hẳn ông đang phải chịu đựng sự kiệt sức
    và căng thẳng vô cùng lớn''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tên riêng & nhận định: giữ ''Trung tướng Rudersdorf'',
    ''Tanya'' và nhận định đánh giá tính bất cẩn của câu hỏi về việc sụt cân đối với
    một người đang kiệt quệ."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Đại từ & mức độ đánh giá: giữ đại từ ''ông'' quy chiếu Rudersdorf
    và nhận định ''Chỉ riêng việc hàm ý rằng ông đang ốm yếu hay không khỏe thôi cũng
    đã là đi quá giới hạn rồi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định trong thoại: Rudersdorf tự xưng ''Ta'' và giữ
    phủ định ''không sao nuốt nổi đồ ăn ở đó''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại cấp dưới: giữ ''nhà ăn của Văn phòng Bộ
    Tổng tham mưu'' và câu hỏi lễ phép có ''ạ'' của Tanya."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại & quan hệ nhượng bộ: Rudersdorf gọi Tanya
    là ''Trung tá'' / ''cô'', tự xưng ''ta''; giữ quan hệ nhượng bộ ''dù biết làm
    vậy là phí thời gian''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000302
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái mỉa mai: giữ ''mặt trận phía đông'' và giọng
    bông đùa lễ phép (''đấy ạ'') của Tanya."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi đáp lời: Rudersdorf gọi Tanya là ''cô'' và giữ
    câu hỏi vặn lại hóm hỉnh ''“Ngon đến mức nhận được lời khen tấm tắc từ cô cơ à?”''."]'
