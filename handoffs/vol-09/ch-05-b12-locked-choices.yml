choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000322
  kind: terminology_and_voice
  value: choice=Đại từ trần thuật 'anh' cho Đại úy Meybert và 'người lính cần vụ'
    cho 'orderly'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000323
  kind: terminology_and_voice
  value: 'choice=Xưng hô của lính cần vụ với Meybert: ''Thưa Đại úy'' - ''tôi'', giữ
    nhịp câu báo cáo khẩn.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000324
  kind: terminology_and_voice
  value: 'choice=Giọng đáp ngắn gọn của cấp chỉ huy: ''Được rồi, báo cáo đi.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000325
  kind: terminology_and_voice
  value: 'choice=Phân biệt đại từ trần thuật: ''anh ta'' cho người lính cần vụ, tránh
    nhập nhằng với ''anh'' (Meybert).'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000326
  kind: terminology_and_voice
  value: choice=Cụm 'một nhóm tàu thuyền chưa rõ nhận dạng' và 'một đoàn tàu có hộ
    tống thông thường' ('a regular convoy').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000327
  kind: terminology_and_voice
  value: 'choice=Câu hỏi xác nhận ngắn gọn của Meybert: ''Không có thông báo trước
    sao?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000328
  kind: terminology_and_voice
  value: 'choice=Đáp lễ của cấp dưới: ''Thưa không, thưa Đại úy. Không hề có chút
    tin tức nào ạ.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000329
  kind: terminology_and_voice
  value: choice=Giữ 'Kampfgruppe Lergen', 'Kampfgruppe', 'khu vực hậu phương' và đại
    từ trần thuật 'anh' cho Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000330
  kind: terminology_and_voice
  value: choice=Giữ nhịp suy luận chiến thuật của Meybert về việc lực lượng hải quân
    chủ lực của địch đã bị vô hiệu hóa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000331
  kind: terminology_and_voice
  value: choice=Dịch 'port command' là 'bộ chỉ huy cảng' và 'friendly fleet' là 'hạm
    đội quân mình'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000332
  kind: terminology_and_voice
  value: choice=Dịch sát sắc thái kinh nghiệm trực giác chiến trường của Meybert và
    việc anh lấy ống nhòm bước ra ngoài.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000333
  kind: terminology_and_voice
  value: 'choice=Xưng hô của Meybert với cấp phó: gọi ''Trung úy Tospan'', xưng ''tôi
    - cậu''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000334
  kind: terminology_and_voice
  value: 'choice=Tospan đáp lễ cấp trên: ''tôi'' + kính ngữ ''ạ''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000335
  kind: terminology_and_voice
  value: 'choice=Câu hỏi kiểm tra thông tin: ''Đã có liên lạc nào từ phía họ chưa?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000336
  kind: terminology_and_voice
  value: choice=Dịch 'visual signals' là 'tín hiệu thị giác' và 'wireless' là 'vô
    tuyến', kèm kính ngữ 'ạ'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000337
  kind: terminology_and_voice
  value: choice=Dịch 'command' là 'bộ chỉ huy', giữ mạch câu chất vấn của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000338
  kind: terminology_and_voice
  value: choice=Tospan gọi 'thưa Đại úy', xưng 'tôi' và 'chúng tôi' (chỉ phía đơn
    vị tại chỗ).
- segment_id: YS-LN09/Text/chapter020.xhtml/p000339
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác nhấn mạnh Markdown '*có thể*' ứng với từ được in
    nghiêng trong nguyên tác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000340
  kind: terminology_and_voice
  value: choice=Giữ đại từ 'anh' cho Đại úy Meybert và miêu tả động tác nâng ống nhòm
    quan sát chân trời.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000341
  kind: terminology_and_voice
  value: choice=Dịch 'battle stations' là 'vị trí chiến đấu', giữ nguyên lối nói tỉnh
    lược chủ ngữ khi vừa quan sát vừa ra lệnh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000342
  kind: terminology_and_voice
  value: 'choice=Tospan hỏi lại đầy ngỡ ngàng: ''Thưa ngài, thật sự cần đến mức đó
    sao ạ?'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000343
  kind: terminology_and_voice
  value: choice=Dịch 'running a victory lap' là 'diễu hành mừng chiến thắng'; lưu
    ý minor về việc đồng bộ 'HQ' thành 'bộ chỉ huy'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000344
  kind: terminology_and_voice
  value: choice=Dịch sát chi tiết luồng khói đen kịt bốc lên từ các ống khói tàu chạy
    hết tốc lực.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000345
  kind: terminology_and_voice
  value: choice=Dịch 'convoy' là 'đoàn tàu có hộ tống' và giữ mạch phản bác hợp lý
    của Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000346
  kind: terminology_and_voice
  value: choice=Lời lẩm bẩm thành tiếng trong ngoặc kép của Meybert dùng đại từ tự
    xưng 'mình', không thêm in nghiêng ngoài nguyên tác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000347
  kind: terminology_and_voice
  value: choice=Cần sửa 'vị đại tá' thành 'vị trung tá' / 'Trung tá' (chỉ Trung tá
    Tanya von Degurechaff) và 'đang được cử tới' thành 'đã được cử tới' theo finding
    mức moderate.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000348
  kind: terminology_and_voice
  value: choice=Giữ tên 'Degurechaff' và miêu tả phản ứng tâm lý của Đại úy Meybert.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000349
  kind: terminology_and_voice
  value: choice=Dịch 'flying their battle flags' là 'treo cờ chiến đấu' và 'charge
    right in' là 'xông thẳng vào'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000350
  kind: terminology_and_voice
  value: 'choice=Giữ lối nhận định pha chút hài hước khô khan của Meybert: ''Nhưng
    tôi không nghĩ trường hợp này là vậy đâu.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000351
  kind: terminology_and_voice
  value: choice=Meybert gọi 'Trung úy Tospan', xưng 'tôi - cậu', chỉ thị kiểm tra
    thông tin với 'bên hải quân'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000352
  kind: terminology_and_voice
  value: choice=Tospan gọi 'Đại úy Meybert', xưng 'cậu - tôi' từ phía Meybert và 'Đại
    úy - tôi' từ phía Tospan.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000353
  kind: terminology_and_voice
  value: 'choice=Phân tích chiến thuật của Meybert: dùng ''chúng ta'' và giữ nhịp
    câu hỏi tu từ.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000354
  kind: terminology_and_voice
  value: choice=Bảo toàn chính xác nhấn mạnh Markdown '*Hừm.*' ở đầu đoạn và thuật
    ngữ 'chiến dịch đổ bộ' ('landing operation').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000355
  kind: terminology_and_voice
  value: choice=Giữ hình ảnh ẩn dụ quân sự về lưỡi lê rỉ sét và sự lơi lỏng cảnh giác
    trên chiến trường.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000356
  kind: terminology_and_voice
  value: 'choice=Mệnh lệnh của Meybert cho ''Trung úy'': huy động bộ binh vào vị trí
    và sẵn sàng xuất kích.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000357
  kind: terminology_and_voice
  value: 'choice=Câu tuân lệnh dứt khoát của Tospan: ''Rõ, thưa Đại úy Meybert.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000358
  kind: terminology_and_voice
  value: choice=Meybert giao việc cho cấp phó với cặp đại từ 'tôi - cậu'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000359
  kind: terminology_and_voice
  value: 'choice=Phân biệt rõ chủ thể trong trần thuật: ''anh ta'' chỉ Tospan (người
    vừa gạt bỏ thắc mắc để nhận lệnh), còn câu sau nêu đích danh ''Meybert''.'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000360
  kind: terminology_and_voice
  value: choice=Dịch 'noncommissioned officers' là 'các hạ sĩ quan' và giữ nhịp miêu
    tả tác phong veterans.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000361
  kind: terminology_and_voice
  value: choice=Câu hỏi ngắn của Meybert khi bước vào kiểm tra; lưu ý minor đồng bộ
    'HQ' thành 'bộ chỉ huy'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000362
  kind: terminology_and_voice
  value: 'choice=Lời báo cáo của các hạ sĩ quan với Meybert: ''Thưa không, thưa Đại
    úy... ạ.'''
- segment_id: YS-LN09/Text/chapter020.xhtml/p000363
  kind: terminology_and_voice
  value: choice=Meybert trấn an và ra lệnh cho thuộc cấp giữ nguyên trạng thái chờ
    lệnh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000364
  kind: terminology_and_voice
  value: choice=Giữ nguyên địa danh 'Soldim 528' và 'mặt trận phía đông'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000365
  kind: terminology_and_voice
  value: choice=Dịch sát tâm lý của những người lính từng sống sót qua mặt trận phía
    đông.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000366
  kind: terminology_and_voice
  value: choice=Khắc họa rõ phẩm chất sĩ quan thực chiến của Đại úy Meybert, đại từ
    trần thuật 'anh'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000367
  kind: terminology_and_voice
  value: 'choice=Kết đoạn bằng câu hỏi của thuộc cấp: ''Có chuyện gì xảy ra vậy, thưa
    ngài?'''
