segment_id_end: YS-LN09/Text/chapter014.xhtml/p000195
choices:
- segment_id: YS-LN09/Text/chapter014.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi cảm thán bàng hoàng trong thoại: “…Sao chuyện này lại
    có thể xảy ra được chứ?!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=[''Tình thái giả định quá khứ và định danh quốc gia: Sẽ chẳng một
    ai trách các sĩ quan nếu họ ngửa mặt nhìn trời / Khối Thịnh vượng chung / một
    cơn ác mộng'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown toàn bộ câu độc thoại nội tâm khớp nguồn (DEC-P01-002)
    và đại từ ngôi thứ nhất: *Nếu đây là một giấc mơ, tôi chỉ muốn tỉnh dậy ngay lập
    tức.*'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh Markdown tại thẻ neo trang (page-170); giữ
    thuật ngữ và quan hệ đối lập: những sĩ quan hải quân mang trong mình tinh thần
    John Bull / các thủy thủ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh khẩn cấp trên tàu và thuật ngữ vũ khí: “Vứt hết số
    ngư lôi dự phòng và bom chìm xuống biển trước khi chúng ta cũng bị nổ tung theo!
    Nhanh lên!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ hải quân và quan hệ nhượng bộ: Phần còn lại của hạm
    đội / các tàu khu trục / những thứ dễ cháy nổ, bao gồm cả bom chìm của mình, qua
    mạn tàu xuống biển'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=[''Mệnh lệnh khích lệ tinh thần trong thoại: “Cứ bắn tiếp đi! Quân
    địch chỉ có vài tên thôi!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ binh chủng và nghiệp vụ hải quân trong thoại: các pháp
    sư hải quân đánh bộ / Chiếc tàu sân bay / kiểm soát hư hại'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=[''Đại từ trần thuật ngôi thứ ba: Bằng cách nào đó, họ vẫn xoay
    xở cầm cự tiếp được.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ quy mô đơn vị và tình thái trái thực tế: chưa tới một
    đại đội / Xét theo lẽ thường, lẽ ra họ phải thừa sức đối phó được với chúng.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=[''Ước lượng số lượng quân địch: Có lẽ chỉ khoảng một tá quân địch.
    Tất cả chỉ có bấy nhiêu.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi tu từ và định danh biên chế hải quân: Một nhúm quân Đế
    quốc / cả một hải đội hoàn chỉnh của Hải quân Hoàng gia / một trò đùa tồi tệ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=[''Giả định trái thực tế ở quá khứ và thuật ngữ: Giá như chúng không
    áp sát đến thế, lưới phòng thủ của hạm đội đã có thể đẩy lùi / đơn vị pháp sư
    hải quân đánh bộ / chiếc tàu sân bay'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhượng bộ và thuật ngữ hỏa lực: lưu lượng hỏa lực / mật
    độ lưới đạn của từng con tàu riêng lẻ vẫn còn quá thưa thớt'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown đúng câu châm ngôn nội tâm theo nguồn (DEC-P01-002)
    và thuật ngữ: *Có còn hơn không.* / các thủy thủ / giăng màn khói để ẩn mình'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=[''Hình ảnh ẩn dụ chiến cuộc: Nhưng cán cân chiến trường vốn dĩ
    vô cùng tàn nhẫn.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=[''Đại từ quy chiếu về cán cân chiến trường và phủ định: Một khi
    đã nghiêng đi thì nó sẽ chẳng bao giờ quay trở lại'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu kèm nét nói lắp và dấu gạch ngang
    ngắt câu theo nguồn (DEC-P01-002): “Tàu *Vi-Vincent* đang—!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu (DEC-P01-002), chuyển đại từ nhân
    hóa tàu (She) sang danh ngữ/đại từ tiếng Việt tự nhiên: một đại đội / tàu *Vincent*
    / làn hỏa lực tập trung / Con tàu / nó đã vĩnh viễn bị loại khỏi vòng chiến'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=[''Không thêm nhấn mạnh tại thẻ neo trang (page-171), bảo toàn nhấn
    mạnh Markdown tên tàu (DEC-P01-002) và thuật ngữ: một vụ nổ thứ cấp / đám pháp
    sư Đế quốc / ngư lôi hoặc bom chìm / tàu *Vincent*'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=[''Sắc thái cảm thán ngậm ngùi: Đáng buồn thay, nỗ lực của họ chỉ
    đạt được có bấy nhiêu.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi phỏng đoán và nhấn mạnh Markdown tên tàu theo nguồn (DEC-P01-002):
    một con tàu không thể phản kích / Tương lai của tàu *Vincent* chẳng mấy sáng sủa.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ cấu trúc tàu và hư hại thủy lực: đám pháp sư địch /
    đường mớn nước / thân tàu / nước biển tràn vào không sao kiểm soát nổi'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=[''Giữ sắc thái định danh kẻ địch theo điểm nhìn phía Khối Thịnh
    vượng chung: Lũ ác nhân đã hoàn tất hành vi tàn độc của chúng chỉ trong chớp mắt.'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=[''Định danh lực lượng và thuật ngữ: những chiến hạm còn lại của
    Khối Thịnh vượng chung'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=[''Câu báo cáo khẩn cấp trong thoại: “…Pháp sư địch đang áp sát
    rất nhanh!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown cả câu độc thoại nội tâm lẫn tên tàu theo
    nguồn (DEC-P01-002), đại từ tự xưng của thuyền trưởng: *Ừ, ta cá là vậy rồi.*
    / Vị thuyền trưởng / tàu *Vincent* / các vụ nổ thứ cấp / đám pháp sư Đế quốc'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown tên tàu sân bay theo nguồn (DEC-P01-002) và
    thuật ngữ: pháp sư hải quân đánh bộ / chiếc tàu *Ark Royale* đang nghiêng hẳn
    đi'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ ma pháp và hỏa lực: Những thuật thức họ triển khai
    / làn hỏa lực hủy diệt'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ binh chủng tinh nhuệ: những pháp sư hải quân đánh bộ
    tinh nhuệ / vượt quá khả năng của họ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ đối lập và ẩn dụ: sự trợ giúp của thần linh / chút yểm
    trợ ít ỏi / bị bắn hạ một cách dễ dàng đến không ngờ'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ tàu chiến và vũ khí phòng không: chiếc tàu khu trục
    cuối cùng / các khẩu pháo phòng không'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=[''Tiếng hô cảnh báo ngắn trong thoại: “Chúng tới kìa!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=[''Giữ sắc thái chửi thề hoảng loạn trong thoại: “Chết tiệt, chết
    tiệt! Lũ khốn đó nhanh quá!”'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ đội hình và giả định trái thực tế: vẻ đẹp tàn khốc
    / các pháp sư địch / một đội hình tập kích hoàn mỹ / nếu hoàn cảnh lúc này khác
    đi'']'
- segment_id: YS-LN09/Text/chapter014.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=[''Hình ảnh ẩn dụ kết đoạn: thần chết sắp sửa vung lưỡi hái của
    mình'']'
