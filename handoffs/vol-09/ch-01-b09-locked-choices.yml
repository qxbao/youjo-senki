choices:
- segment_id: YS-LN09/Text/chapter004.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ ''Có Chúa mới biết'' và đại từ ''chúng ta''
    trong lời Lergen."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & hành động trần thuật: Tanya xưng ''tôi''
    kèm kính ngữ ''ạ'', giữ tên riêng ''Tanya'', thuật ngữ ''quả cầu tính toán của
    mình'' và chi tiết ''búng nhẹ ngón tay làm quả cầu tính toán của mình vang lên
    một tiếng leng keng''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đối lập & phủ định: giữ ''Quả cầu Tính toán Xung kích
    Type 97 của Elinium Arms'', đối lập với ''thứ Type 95 bị nguyền rủa kia'', chi
    tiết ''sắc xanh lục dịu mắt, tốt cho cả thể chất lẫn tinh thần'', tên riêng ''Lergen'',
    ''Tanya'' và phủ định ''đừng trông mong sẽ có thêm bất kỳ pháp sư nào đủ khả năng
    sử dụng mẫu thiết bị này nữa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & tình thái giả định: giữ dấu chấm
    lửng mở đầu, ''những người lính bổ sung đã qua huấn luyện tối thiểu'', ''vừa dùng
    vừa mò mẫm thử sai với mẫu Type 97'', đại từ ''chúng ta'' và giả định ''Hoàn toàn
    có khả năng đám tân binh mà chúng ta tiếp nhận từ giờ trở đi sẽ có cơ hội sống
    sót cao hơn nếu chúng ta trang bị cho họ quả cầu của Liên bang thay vì thứ này''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Cảm thán nội tâm: giữ câu ngắn ''Đúng là một thực tại kinh hoàng.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận & nhận xét trong thoại: giữ ''“Đặt niềm tin vào
    chính mình ư? Đó là một đức tin tốt đấy.”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: quy chiếu Lergen bằng ''anh'', giữ chi tiết
    ''khoác lên vẻ mặt đúng mực trước mặt người ngoài'' và ''phong thái bên ngoài
    của anh hoàn toàn nghiêm túc và điềm đạm''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Cảm thán nội tâm: giữ ''Thật là một chiếc mặt nạ đáng nể.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & quan hệ nhượng bộ trong thoại: Lergen dùng
    ''Chúng ta'' ở câu rủ, xưng ''Tôi''/''tôi'', giữ ''Tướng von Rudersdorf'', ''Ildoa''
    và quan hệ nhượng bộ ''chỉ có mặt ở đó cho đúng hình thức thôi, nhưng chí ít tôi
    cũng có thể truyền đạt lại tình hình ở Ildoa''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Câu đáp điều lệnh trong thoại: giữ ''“Rõ, thưa Đại tá!”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Nhận định chuyển cảnh: giữ ''Thời gian chia sẻ những chuyện bí
    mật đã khép lại.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn pha trộn nội tâm – trần thuật: giữ cảm thán ''Không
    thể tin nổi.'', tên riêng ''Tanya'', đại từ ''cô'', chi tiết ''cả dạ dày lẫn khả
    năng tự kiềm chế của Tanya đã bị đem ra thử thách'' và nhận định ''đấu đá chính
    trị nơi công sở chỉ toàn mang lại rắc rối''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Phủ định nội tâm: giữ ''Đáng tiếc là chẳng có cách nào thoát khỏi
    nó cả.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Cảm thán nội tâm: giữ ''Phiền phức thật đấy.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & cấu trúc điệp trong độc thoại nội tâm: giữ hai
    câu hỏi tu từ, so sánh ''hiệu quả hơn gấp bội so với việc ngáng đường lẫn nhau''
    và điệp cấu trúc ''chỉ có thể tồn tại là nhờ có xã hội'' ở ba câu cuối (không
    thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Thoại thán từ & trần thuật: giữ ''“Haizzz.”'', tên riêng ''Tanya''
    và chi tiết ''buông một tiếng thở dài khẽ nhưng trông thấy rõ rồi lắc đầu''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm ngắn: giữ ''Đến lúc phải di chuyển rồi.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Nhận định hệ quả nội tâm: giữ ''Cứ nán lại đây thì sẽ chỉ tổ vướng
    chân người khác mà thôi.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & câu hỏi xin ý kiến trong thoại: Tanya dùng
    ''Chúng ta''/''chúng ta'', xưng ''tôi'' kèm kính ngữ ''ạ'', giữ ''Trung úy Serebryakov''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Lergen gọi Tanya là ''cô'' và
    ''Trung tá''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Xưng hô lễ phép & phủ định lịch sự trong thoại: Tanya đáp ''Không
    có gì đâu, thưa Đại tá'', xưng ''Tôi'', dùng ''chúng ta'', gọi Lergen là ''ngài''
    kèm ''ạ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & lời gián tiếp: tự quy chiếu ''mình'' trong
    mệnh đề gián tiếp, giữ tên riêng ''Tanya'', ''một người cấp dưới'' và đại từ ''anh
    ta''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô trong thoại: Tanya gọi ''Thiếu tá Weiss'',
    xưng ''tôi'' và gọi Weiss là ''anh''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Weiss đáp ''“Vâng, thưa Trung
    tá.”''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: quy chiếu Weiss bằng ''Anh ta''/''anh ta''
    (tự quy chiếu ''mình'' trong câu hỏi gián tiếp), quy chiếu Tanya bằng ''cô'' và
    ''Tanya''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ trong thoại: Tanya xưng ''Tôi''/''tôi'',
    gọi Weiss là ''anh''; giữ ''Trung úy Serebryakov'', ''Đại tá Lergen'', ''Văn phòng
    Bộ Tổng tham mưu'' và chỉ thị ''tập hợp binh lính lại và chờ xe tải tới đón''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Weiss xưng ''tôi'', dịch ''yours,
    ma’am'' là ''của Trung tá … ạ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định kép trong thoại: giữ tên riêng ''Tanya''
    ở phần dẫn, ''Đại tá Lergen'', đại từ ''Tôi''/''tôi'' – ''các anh'', phủ định
    ''sẽ không đòi hỏi binh lính phải gò bó bản thân'' và lời răn ''nhưng cũng đừng
    để đến tai tôi chuyện có bất kỳ ai trong các anh quậy phá quá trớn''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại ngắn & nhận định nội tâm: giữ tên riêng ''Weiss'',
    câu hô ''“Rõ, thưa Trung tá.”'' và nhận định ''Tuy có hơi quá mức một chút, nhưng
    điểm này rất đáng để nhấn mạnh.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: Tanya gọi Weiss là ''anh'', dùng
    ''tiểu đoàn ta''; giữ ''hậu phương'', ''lệnh cấm tiết lộ thông tin liên quan đến
    mặt trận phía đông'', ''kín miệng tuyệt đối trước bất kỳ thông tin nhạy cảm nào'',
    đối lập ''những cựu binh trong tiểu đoàn ta'' với ''một số lượng kha khá những
    người gia nhập giữa chừng là quân bổ sung đấy''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Phủ định nội tâm & hệ quả: giữ đại từ ''Chúng ta'', phủ định ''không
    thể để bất kỳ ai vô tình làm rò rỉ thông tin tình báo được'' và tên riêng ''Lergen''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Phủ định so sánh & điều kiện trong độc thoại nội tâm: giữ phủ
    định ''Tuy không phải thủ đô đang nhan nhản điệp viên Nga giống như Tokyo thời
    Chiến tranh Nga–Nhật…'', điều kiện phủ định ''chừng nào chưa đến mức hoang tưởng''
    và đại từ ''chúng ta''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & từ lóng chỉ phe địch: giữ đại từ ''Chúng ta''
    và cụm ''lũ Cộng sản và đám John Bull'' (không thêm nhấn mạnh cho thẻ neo trang)."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, trần thuật & thuật ngữ: bọc chính xác thán
    từ ''*Haizzz.*'' bằng dấu sao theo DEC-P01-002; giữ tên riêng ''Tanya'', ''Đế
    quốc'', ''ngăn chặn gián điệp xâm nhập'' và ''chiến tranh thông tin chỉ toàn đem
    lại đau đớn''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Weiss xưng ''Tôi''/''tôi'' kèm
    ''ạ'', giữ chuẩn xác ''Đại úy Meybert và Đại úy Ahrens cũng như Trung úy Tospan''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya xưng ''tôi'', gọi Weiss là ''anh''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & thuật ngữ: giữ tên riêng ''Tanya'', chuỗi
    hành động và các cụm ''giấy nghỉ phép'', ''khoản tiền phụ cấp'', ''thủ đô'', ''đợt
    luân chuyển về hậu phương đã quá hạn từ lâu này''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Nhận định trần thuật: giữ ''Binh lính cuối cùng cũng sắp được
    tận hưởng một kỳ nghỉ mong chờ bấy lâu.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, tự quy chiếu & thuật ngữ: giữ phủ định ''không
    phải là ý tồi'', đại từ tự quy chiếu ''Mình'' theo DEC-P01-001, ''Bộ Tổng tham
    mưu'', ''phiếu đổi hàng'', ''Trung tá Uger'', ''khoang hạng nhất'' và ''dốc hết
    khả năng để chiêu đãi''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấp bậc: giữ ''quân quy'', ''phiếu khẩu phần bột mì'',
    ''Kampfgruppe'' và ''Trung tướng Zettour''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Câu chuyển ý ngắn: giữ tên riêng ''Tanya'' và nhận định ''Do đó,
    công việc của Tanya rất đơn giản.''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, đối lập thưởng – phạt & quân hàm: giữ đối
    lập ''có công thì thưởng, có tội thì phạt'', đại từ ''cô'' quy chiếu Tanya, cụm
    ''làm đơn đề nghị khen thưởng và thăng hàm'' và ''mượn được danh nghĩa của Đại
    tá Lergen''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ cấp bậc: giữ ''hàng ngũ hạ sĩ quan và binh sĩ'' và ''kỳ
    nghỉ phép thực sự của họ''."]'
- segment_id: YS-LN09/Text/chapter004.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đánh giá nội tâm: giữ ''Bộ Tổng tham mưu'',
    ''Zettour'', phủ định ''bất kỳ ai không phải là sĩ quan'' và ''hệ thống của Đế
    quốc''."]'
