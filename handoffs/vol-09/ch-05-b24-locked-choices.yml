- segment_id: YS-LN09/Text/chapter020.xhtml/p000849
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật mở đầu batch giữ đúng sắc thái mỉa
    mai về sự hiếu khách mang tính hình thức của phía Ildoa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000850
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Bảo toàn chính xác phạm vi nhấn mạnh Markdown (*...*)
    tương ứng thẻ em trong nguồn và giọng đuổi khéo.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000851
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm của Tanya giữ đúng đại từ ('Chúng
    ta', 'mình'), câu hỏi tu từ và nét tự trào của một 'thành viên trưởng thành của
    xã hội'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000852
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('mình', 'chúng ta') mượt
    mà, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000853
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng sự chuyển đổi điểm nhìn từ ngôi thứ nhất
    số nhiều ('chúng ta') sang ngôi thứ ba ('Tanya', 'vị sĩ quan phụ tá'); bỏ qua
    thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000854
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Nhịp câu liệt kê ngắn gọn và cảm thán cuối đoạn
    tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000855
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Tanya giữ chuẩn thuật ngữ 'Tiêu dùng
    phô trương', 'toa ăn', đại từ 'chúng ta' và câu hỏi nghi vấn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000856
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp lễ phép của Serebryakov ('mà ạ', 'chúng
    ta') giữ đúng phủ định bộ phận ('không chỉ có mỗi').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000857
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Tanya giữ đúng cấu trúc phủ định
    ('chưa đến mức bị cách ly') và cách gọi 'Trung úy'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000858
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('mình', 'chúng ta') chính
    xác về nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000859
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu mời cà phê của Serebryakov ('Thưa Trung tá',
    'ngài - ạ') chuẩn mực.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000860
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời cảm ơn của Tanya ('Tôi', 'Trung úy Serebryakov')
    tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000861
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật giữ đúng dấu chấm lửng và cấu trúc
    phủ định khẳng định ('Không thể nào nhầm lẫn đi đâu được').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000862
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời cảm thán về cà phê thật ('hàng thật đúng nghĩa')
    chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000863
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời hưởng ứng của Serebryakov ('tôi... ạ') tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000864
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng nhịp hai câu danh ngữ ngắn giàu hình ảnh.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000865
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Bảo toàn chính xác từ nhấn mạnh Markdown '*Đây*'
    tương ứng thẻ em trong nguồn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000866
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi phỏng đoán phủ định của Tanya ('Tôi đoán
    là cô chưa có dịp...') chính xác, tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000867
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp của Serebryakov ('Không đâu ạ, tôi...')
    khớp mạch hội thoại và giữ đúng ý tính vào hóa đơn của Ildoa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000868
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('Vị sĩ quan phụ tá của
    mình', 'cô ấy', 'Mình') và danh xưng 'Đại tá Calandro' nhất quán.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000869
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng các thuật ngữ 'nhà quản lý quân chính',
    'Tướng Igor Gassman', 'quỹ mật' và câu giả định trái thực tế ('Nếu Tanya không
    đích thân dính líu... thì có lẽ chúng ta thậm chí còn chẳng bao giờ...').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000870
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại và trần thuật ngôi thứ ba ('Tanya') giữ
    chuẩn thuật ngữ 'Bộ Tổng tham mưu' và 'phòng ăn của Bộ Tổng tham mưu'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000871
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu danh ngữ ngắn súc tích, đối lập rõ 'Đồ ăn dở
    tệ' và 'những chiếc đĩa lộng lẫy'; bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000872
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ chuẩn đại từ khái quát 'bạn', cấu trúc nhượng
    bộ – điều kiện và sự đối lập giữa 'hình thức' với 'công năng thực chất'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000873
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời khen của Serebryakov ('ạ') tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000874
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp ngập ngừng của Tanya giữ đúng dấu gạch
    ngang và câu hỏi tự vấn ngắn.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000875
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba ('Serebryakov', 'Tanya')
    và lời thoại ngắn tự nhiên, chuẩn nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000876
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đồng tình của Serebryakov ngắn gọn, đúng giọng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000877
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Giữ đúng lời cảm thán buột miệng của Tanya và câu
    trần thuật ngôi thứ ba ('cô').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000878
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi quan tâm của Serebryakov ('Ngài', 'sao
    ạ') tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000879
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ ba ('vị sĩ quan phụ tá', 'Tanya')
    và lời thoại tự giễu ('Có lẽ tôi cũng bị trúng độc mất rồi') chuẩn sắc thái.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000880
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi ngắn của Serebryakov ('Thưa Trung tá?')
    chuẩn cấp bậc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000881
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Độc thoại nội tâm ngôi thứ nhất ('mình') giữ đúng
    mức độ so sánh ('đi hơi xa hơn những gì một người lính yêu nước như mình vẫn thường
    nói').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000882
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu suy đoán nội tâm ('Có lẽ...', 'mình') tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000883
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời giải thích chữa cháy của Tanya ('Tôi - Ildoa')
    giữ đúng dấu chấm lửng và phủ định ('chẳng thể nào thư giãn nổi').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000884
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp trầm ngâm của Serebryakov chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000885
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đáp ngắn của Tanya giữ đúng dấu chấm lửng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000886
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Thế
    này thì không ổn rồi.*' tương ứng thẻ em trong nguồn và đại từ nội tâm 'mình'.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000887
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi chuyển chủ đề của Tanya ('Trung úy này,
    cô...') tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000888
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi lại ngạc nhiên của Serebryakov ('thưa Trung
    tá') chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000889
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu trần thuật ngôi thứ ba ('Tanya', 'vị sĩ quan
    phụ tá') ngắn gọn, chuẩn nghĩa.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000890
  kind: terminology_and_voice
  value: Touch=polish_optional; rationale=Trần thuật ngôi thứ ba ('cô', 'Calandro',
    'Tanya') đúng nghĩa; có thể cân nhắc rút gọn từ 'ngoại giao' ở bước polish.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000891
  kind: terminology_and_voice
  value: Touch=polish_optional; rationale=Giữ đúng sự pha trộn điểm nhìn giữa 'Tanya'
    và 'mình'; nên chỉnh 'cô bé' thành 'cô' ở câu cuối để đồng nhất đại từ ngôi thứ
    ba chỉ Tanya.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000892
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời đề nghị của Tanya ('tôi - cô', 'Weiss và mọi
    người') tự nhiên; bỏ qua thẻ neo trang hợp lệ.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000893
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu hỏi mừng rỡ của Serebryakov ('Ngài... ạ?!')
    giữ đúng dấu chấm hỏi cảm thán.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000894
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời thoại của Tanya ('tôi - các vị') giữ đúng lý
    do không uống được rượu và sự hào phóng với cấp dưới.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000895
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('Mình') kết hợp nhắc
    tên 'Serebryakov' ('cô ấy') mạch lạc.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000896
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời cảm ơn của Serebryakov ('Xin cảm ơn Trung tá
    ạ!') chuẩn xác.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000897
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời dặn của Tanya ('Thiếu tá Weiss', 'tôi', 'anh
    ấy') chuẩn cấp bậc và tự nhiên.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000898
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Lời chào lui ra của Serebryakov ('Vâng ạ! Vậy tôi...')
    hào hứng, đúng giọng.
- segment_id: YS-LN09/Text/chapter020.xhtml/p000899
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Trần thuật ngôi thứ nhất ('Vị sĩ quan phụ tá của
    mình', 'cô ấy') giữ đúng suy đoán tình thái ('hẳn là').
- segment_id: YS-LN09/Text/chapter020.xhtml/p000900
  kind: terminology_and_voice
  value: Touch=preserve; rationale=Câu kết batch ngắn gọn, khẳng định rõ sự đánh giá
    cao của Tanya dành cho vị sĩ quan phụ tá.
