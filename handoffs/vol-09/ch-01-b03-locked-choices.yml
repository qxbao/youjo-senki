unit_count: 35
segment_id_start: YS-LN09/Text/chapter002.xhtml/p000062
segment_id_end: YS-LN09/Text/chapter002.xhtml/p000096
choices:
- segment_id: YS-LN09/Text/chapter002.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật, đại từ & thuật ngữ: giữ tên riêng ''Tanya'',
    đại từ ''cô'' trong trần thuật; giữ ''tiền tuyến'', ''vật dụng cá nhân'', ''hành
    lý sĩ quan'', ''chiến lợi phẩm'', ''mặt trận phía đông'' và ''Kampfgruppe''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ đại từ ''cô'' chỉ Tanya và cấu trúc
    hệ quả ''Nghĩa là việc duy nhất còn lại chỉ là...''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & từ vựng: giữ tên riêng ''Tanya'', đại từ
    phản thân ''của mình'' tự nhiên theo ngữ pháp tiếng Việt, ''sân ga'' và ''mảnh
    đất quê nhà''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ cụm danh từ ngắn ''Tổ quốc thân yêu.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ cụm danh từ ngắn ''Hậu phương an toàn.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Sắc thái biểu đạt: giữ câu khẳng định ''Đó là điều mà ai nấy đều
    khắc khoải mong chờ.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & phủ định: giữ phủ định ''không phải ngoại
    lệ'', tên riêng ''Tanya'' và đại từ ''cô''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại & thuật ngữ: nhân viên đường sắt gọi nhóm
    của Tanya là ''các vị'', gọi Tanya là ''cô'' và tự xưng ''tôi''; giữ tên đơn vị
    ''Kampfgruppe Lergen'' và hai câu hỏi lịch sự."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi đuôi phủ định & thuật ngữ: Tanya gọi nhân viên
    đường sắt là ''Anh''; giữ ''Bộ Tổng tham mưu'' và cấu trúc câu hỏi xác nhận phủ
    định ''không phải..., đúng không?''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: nhân viên đường sắt tự xưng ''Tôi'', giữ
    tên cơ quan ''Reichsbahn'' và câu hỏi xin phép lịch sự."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm trong thoại: Tanya xưng ''Tôi'', gọi Serebryakov
    là ''cô'' và ''Trung úy''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: Tanya tự quy chiếu bằng ''mình''
    theo DEC-P01-001; giữ ''viên sĩ quan phụ tá của mình'', ''ba bữa ăn nóng sốt'',
    ''mặt trận phía đông'' và quan hệ đối lập giữa các vế."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & chủ thể khái quát: giữ cặp khái niệm ''Sự sẵn sàng'',
    ''độ dự phòng'', ''tính hiệu quả'' và đại từ khái quát ''người ta''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, nhân quả & phủ định: giữ cấu trúc nhấn mạnh
    nguyên nhân ''Chính nhờ không phải... nên mình mới có thể...'' và đại từ tự quy
    chiếu ''mình''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, phủ định & thuật ngữ: giữ tự quy chiếu ''mình'',
    cấu trúc phủ định liệt kê ''chẳng phải đang..., hay..., hay thậm chí là...—không
    hề, mình đang...'' cùng các thuật ngữ ''hoạch định nguồn nhân lực'', ''chiến lược
    xây dựng thương hiệu doanh nghiệp'' và ''cuộc chiến tranh hoàn toàn phi sản xuất''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: giữ ''lao động trí óc'' và nhận định ''không
    thể tránh khỏi lại càng khiến người ta chán ghét hơn''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Tình thái & sắc thái: giữ giọng nhận định mỉa mai ''bất kỳ tên
    ngốc nào cũng có thể làm điều đó chỉ bằng cách bắn một viên đạn duy nhất''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Tên riêng: giữ câu ngắn ''Cứ nhìn Sarajevo mà xem.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Tình thái & quan hệ nhân quả: giữ tương phản ''bậc trí giả'' –
    ''kẻ ngốc'', tình thái ''có thể'', ''hiếm khi'' và cấu trúc nhấn mạnh nhân quả
    ''Chính vì... nên ngay từ đầu chúng mới có thể...''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ ''cuộc chiến tranh chính nghĩa'', ''thứ
    công lý riêng'' và tình thái khẳng định ''chắc chắn sẽ gây ra''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ nội tâm: giữ hình ảnh ''cuộc rượt đuổi luẩn quẩn giữa lũ
    đần độn cư xử như những gã hề và những người dọn dẹp phải lao vào thu dọn bãi
    chiến trường mà chúng để lại''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & nhấn mạnh Markdown: giữ ''Trung tá Tanya
    von Degurechaff'', ''sân ga quân sự'', ''đế đô''; bọc chính xác câu hỏi nội tâm
    sau dấu hai chấm bằng ''*...*'' theo DEC-P01-002."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, phủ định & thuật ngữ: giữ phủ định ''Đây đâu
    phải là chỗ trông trẻ hay nhà trẻ'', câu hỏi tu từ với đại từ ''mình'', và chi
    tiết ''chuyện bít tất ngoài mặt trận phía đông''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Độc thoại lẩm bẩm: giữ đại từ tự quy chiếu ''mình'' trong câu
    lẩm bẩm của Tanya."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, tình thái, phủ định & thuật ngữ: giữ tự quy
    chiếu ''Mình''/''mình'', tình thái ''gần như tin chắc'', phủ định ''chẳng phải
    lo'' và hai thuật ngữ ''hiện tượng nóng lên toàn cầu'', ''thuế carbon''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & thuật ngữ: giữ tên riêng ''Tanya'', ''viên
    sĩ quan phụ tá của mình'' và phủ định ''chẳng dễ gì tìm được''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: giữ ''cô nàng'' để quy chiếu Serebryakov
    tách biệt với Tanya và phủ định ''chẳng phải tin tốt lành gì''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & tình thái trong thoại: giữ cách gọi ''Thưa
    Trung tá'', ''Bộ Tổng tham mưu'', đại từ ''chúng ta'' và tình thái ''hình như...
    ạ''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật & xưng hô trong thoại: giữ ''Tanya'' ở phần
    dẫn; trong thoại, giữ lời gọi ''cô, Trung úy'' và đại từ ''chúng ta''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: giữ ''không thể bào chữa'', tình
    thái ''gần như'', ''Chắc hẳn phải có lý do nào đó'' và tên cơ quan ''Bộ Tổng tham
    mưu''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ cấu trúc phủ định ''cũng chẳng thay đổi được gì''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc liệt kê lựa chọn: giữ ''hoặc là ngu xuẩn, hoặc là bất
    tài, hoặc là vô trách nhiệm'' và cụm ''những tên ngốc đáng bị đem ra xử bắn''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Chuyển ý nội tâm: giữ câu ngắn ''Gác chuyện đó sang một bên, đã
    đến lúc bắt tay vào công việc chính rồi.''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô, thuật ngữ & điều kiện: Tanya gọi Serebryakov
    là ''Trung úy, cô...'', xưng ''chúng ta''; giữ ''Reichsbahn'', ''sân ga'' và câu
    điều kiện ''Nếu cứ đứng nguyên... thì sẽ...''."]'
- segment_id: YS-LN09/Text/chapter002.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & câu hỏi xin ý kiến: Serebryakov đáp ''Rõ,
    thưa Trung tá'', tự xưng ''Tôi'', dùng ''chúng ta'' và giữ câu hỏi xin chỉ thị
    ''Tôi có nên... không ạ?''."]'
