choices:
- segment_id: YS-LN09/Text/chapter020.xhtml/p000001
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'mình', định danh 'Calandro', cấu trúc phủ
    định 'chẳng có ác cảm gì với Calandro cả' và sắc thái suy đoán 'chắc cũng thế'
    (probably)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000002
  kind: terminology_and_voice
  value: choices=["Khóa các quốc danh 'Ildoa', 'Đế quốc', cụm 'các quốc gia tham chiến
    khác' (other warring states), chủ ngữ 'cả hai' trong nội tâm và cách diễn đạt
    'đối đáp qua lại đúng theo kịch bản' (hoặc 'lời qua tiếng lại đúng theo kịch bản')
    cùng sắc thái mỉa mai về mức lương."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000003
  kind: terminology_and_voice
  value: choices=["Khóa cấu trúc phủ định 'chẳng có thù oán cá nhân nào hết' và sắc
    thái chắc chắn trong nội tâm về việc cả hai sẽ buông tha/nương tay cho nhau sau
    khi nói xong phần việc."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000004
  kind: terminology_and_voice
  value: choices=["Khóa cặp đại từ thoại của Calandro ('tôi' / 'chúng tôi' – 'cô'),
    sự tương phản giữa 'chiến trường' với 'thời bình' và sắc thái lịch sự khiêm nhường."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Khóa cách xưng hô của Tanya với Calandro: ''thưa Đại tá'' (Colonel)
    và đại từ ''tôi''."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000006
  kind: terminology_and_voice
  value: choices=["Khóa lời khuyên 'Đừng vội kết luận sớm thế' và cụm 'Bữa tiệc chào
    mừng' (welcome banquet) trong thoại của Calandro."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000007
  kind: terminology_and_voice
  value: choices=["Khóa điểm nhìn trần thuật ngôi thứ ba với định danh 'Tanya' và
    hành động lẳng lặng nhìn đi chỗ khác."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000008
  kind: terminology_and_voice
  value: choices=["Khóa điểm nhìn trần thuật ngôi thứ ba pha nội tâm ('cô' tự quy
    chiếu là 'mình'), cấu trúc phản vấn phủ định 'Đời nào cô có thể thú nhận...' và
    cụm 'hương thơm của bánh mì'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000009
  kind: terminology_and_voice
  value: choices=["Khóa câu hỏi lịch sự xin xem thực đơn của Tanya với đại từ 'Tôi'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000010
  kind: terminology_and_voice
  value: choices=["Khóa lời đáp của Calandro với đại từ ngôi thứ hai 'Cô'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Khóa sự phân tách đại từ: ''Tôi'' trong lời thoại xã giao với
    ''Đại tá'' (Colonel) và ''Mình'' trong câu trần thuật ngôi thứ nhất ở giữa."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000012
  kind: terminology_and_voice
  value: choices=["Khóa đại từ 'Tôi' và thái độ sẵn lòng gợi ý món ăn của Calandro."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000013
  kind: terminology_and_voice
  value: choices=["Khóa lời cảm ơn lịch sự '“Cảm ơn ngài.”' của Tanya."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000014
  kind: terminology_and_voice
  value: choices=["Khóa cấu trúc phủ định giảm nhẹ 'Mà cũng không phải là các món
    thịt bị dở đâu…', đại từ trần thuật 'ông ta' và cặp đại từ thoại 'tôi' – 'cô'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000015
  kind: terminology_and_voice
  value: choices=["Khóa đại từ tôn xưng 'Ngài' và câu hỏi thăm dò lịch sự của Tanya
    về món cá."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000016
  kind: terminology_and_voice
  value: choices=["Khóa định danh 'Calandro', đại từ 'cô' và các chi tiết 'quân cảng'
    (navy port), 'thu mua hải sản' (procuring seafood)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000017
  kind: terminology_and_voice
  value: choices=['Khóa câu hỏi ngắn của Tanya về việc quân đội hỗ trợ thu mua.']
- segment_id: YS-LN09/Text/chapter020.xhtml/p000018
  kind: terminology_and_voice
  value: choices=["Khóa đại từ trần thuật 'Ông ta', cụm 'một người lính ngoài chiến
    trường' (a soldier in the field) và cách gọi đúng quân hàm 'Trung tá Degurechaff'
    (Colonel Degurechaff)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000019
  kind: terminology_and_voice
  value: choices=["Khóa câu hỏi thẳng thừng '“Ý ngài là ăn cắp ư?”' của Tanya."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000020
  kind: terminology_and_voice
  value: choices=["Khóa đại từ trần thuật 'ông ta', chi tiết tiếng vỗ tay kêu bộp
    cùng nụ cười ẩn ý và cụm 'Mấy gã tham ăn phụ trách nhà bếp' (Those gluttons who
    run the kitchen)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000021
  kind: terminology_and_voice
  value: choices=['Khóa cấu trúc suy luận điều kiện của Tanya về mức độ thân thiết
    để có cá cho bữa tối.']
- segment_id: YS-LN09/Text/chapter020.xhtml/p000022
  kind: terminology_and_voice
  value: choices=["Khóa ẩn dụ 'bậc thầy của ván cờ lớn' (masters of the great game),
    phép so sánh 'ngon ngang ngửa, thậm chí là hơn' và đại từ 'cô'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Khóa nhịp câu danh ngữ ngắn trong độc thoại nội tâm: ''Cá tươi
    bất cứ lúc nào.''."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000024
  kind: terminology_and_voice
  value: choices=["Khóa câu danh ngữ nội tâm tiếp nối về nguồn cung hàng hóa ổn định
    và 'một mối quen biết tốt' (a good connect)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Khóa câu cảm thán mang tính bề ngoài xã giao của Tanya: ''“Thật
    đáng trách quá đi mất.”''."]'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000026
  kind: terminology_and_voice
  value: choices=["Khóa câu hỏi vặn lại của Calandro nhắc tới 'Đế quốc' (the Empire)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000027
  kind: terminology_and_voice
  value: choices=["Khóa đại từ nội tâm 'Mình', tên gọi 'Đế quốc' và đại từ phiếm chỉ
    'bạn' trong mệnh đề điều kiện khái quát."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000028
  kind: terminology_and_voice
  value: choices=["Khóa tổ chức 'Bộ Tổng tham mưu' (General Staff), quân hàm 'Trung
    tá Uger' (Lieutenant Colonel Uger), 'Đại tá Lergen' (Colonel Lergen) và đại từ
    nội tâm 'mình'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000029
  kind: terminology_and_voice
  value: choices=["Khóa cách xưng hô 'Thưa Đại tá' (Colonel) và đại từ 'cả hai chúng
    ta' trong lời đồng cảm giữa những người lính của Tanya."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000030
  kind: terminology_and_voice
  value: choices=["Khóa sự chuyển đổi giữa lời thoại của Tanya ('tôi') và phần dẫn
    thoại ngôi thứ ba ('Tanya mỉm cười nhạt với Calandro'), cùng sự đối lập giữa 'ba
    bữa ăn đàng hoàng' (three square meals) và 'sự lãng mạn' (romance)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=[''Khóa câu cảm thán nội tâm của Tanya nêu chuỗi ba khâu hậu cần:
    chuẩn bị nguyên liệu dinh dưỡng, kiếm chất đốt hâm nóng và cung cấp cho binh lính
    không trục trặc.'']'
- segment_id: YS-LN09/Text/chapter020.xhtml/p000032
  kind: terminology_and_voice
  value: choices=["Khóa các thuật ngữ 'tiền tuyến' (front lines), 'chính quốc' (home
    country), 'K-Brot', đại từ 'chúng ta' và hình ảnh so sánh 'phóng tàu thăm dò lên
    mặt trăng'."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000033
  kind: terminology_and_voice
  value: choices=["Khóa đại từ thoại 'Tôi' (tự quy chiếu 'mình') và cụm 'món ngâm
    xốt này' (this marinade)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000034
  kind: terminology_and_voice
  value: choices=["Khóa cặp đại từ 'Cô' – 'Tôi', cụm 'một thực khách thích khám phá'
    (an adventurous eater) và 'người Đế quốc' (people from the Empire)."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000035
  kind: terminology_and_voice
  value: choices=["Khóa cụm 'một người lính ngoài chiến trường' (a soldier in the
    field) đồng nhất với p000018."]
- segment_id: YS-LN09/Text/chapter020.xhtml/p000036
  kind: terminology_and_voice
  value: choices=["Khóa cặp đại từ thoại 'tôi' – 'cô' và cụm 'khẩu vị sành sỏi' (discerning
    palate) trong lời khen xã giao của Calandro."]
