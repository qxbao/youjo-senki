choices:
- segment_id: YS-LN05/Text/part0010.html/p000794
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó' theo DEC-P01-001.", "Giữ nguyên thuật
    ngữ 'chỉ huy Kampfgruppe' và cấp bậc 'Đại tá Uger'.", 'Không dùng nhấn mạnh Markdown
    vì nguồn không có thẻ nhấn mạnh.']
- segment_id: YS-LN05/Text/part0010.html/p000795
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó' và tên riêng 'Tanya'.", "Giữ đúng cấp bậc
    'hai Trung úy Serebryakov và Grantz' theo pending-terms-index.yml.", "Giữ thì
    quá khứ hoàn thành của phỏng đoán ('đã đoán trước được kết luận của bản báo cáo
    ở một mức độ nhất định ngay từ lúc ra lệnh tiến hành cuộc khảo sát')."]
- segment_id: YS-LN05/Text/part0010.html/p000796
  kind: terminology_and_voice
  value: choices=["Câu đầu là trần thuật ('nó'); từ câu thứ hai chuyển sang độc thoại
    nội tâm của Tanya, khóa đại từ ngôi thứ nhất số nhiều là 'chúng ta'.", "Giữ từ
    'những người Cộng sản' (Communists)."]
- segment_id: YS-LN05/Text/part0010.html/p000797
  kind: terminology_and_voice
  value: choices=["Khóa 'binh lính Liên bang' và thuật ngữ 'chủ nghĩa dân tộc sắc
    tộc' (ethnic nationalism)."]
- segment_id: YS-LN05/Text/part0010.html/p000798
  kind: terminology_and_voice
  value: choices=["Thoại độc thoại của Tanya dùng đại từ 'Mình' theo DEC-P01-001."]
- segment_id: YS-LN05/Text/part0010.html/p000799
  kind: terminology_and_voice
  value: choices=["Hai câu đầu là trần thuật ('Tanya', 'Nó'); ba câu sau chuyển sang
    nội tâm tự quy chiếu, khóa đại từ là 'mình' ('Ai cơ? Chính là mình. Là mình đây.')."]
- segment_id: YS-LN05/Text/part0010.html/p000800
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tự quy chiếu của Tanya: khóa ''chúng ta'' cho ngôi thứ
    nhất số nhiều và ''mình'' cho ngôi thứ nhất số ít.", "Giữ cấu trúc phủ định kép
    ''chẳng hiểu địch mà cũng chẳng hiểu nổi chính mình''."]'
- segment_id: YS-LN05/Text/part0010.html/p000801
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng tên đầy đủ 'Tanya von Degurechaff' và đại từ phản
    thân 'mình'."]
- segment_id: YS-LN05/Text/part0010.html/p000802
  kind: terminology_and_voice
  value: choices=["Thoại cảm thán dùng 'chúng ta'."]
- segment_id: YS-LN05/Text/part0010.html/p000803
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tiếp nối p000802: khóa đại từ ''Chúng ta'' (''Chúng ta
    đã bị lừa.'')."]'
- segment_id: YS-LN05/Text/part0010.html/p000804
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*muôn vàn*' ứng với thẻ em
    trong nguồn (DEC-P01-002).", "Giữ đại từ 'các người' (gọi đám Cộng sản) và 'chúng
    ta'."]
- segment_id: YS-LN05/Text/part0010.html/p000805
  kind: terminology_and_voice
  value: choices=["Phân biệt rõ 'chủ nghĩa dân tộc' (nationalism) và 'chủ nghĩa dân
    tộc sắc tộc' (ethnic nationalism).", "Giữ thuật ngữ 'cuộc đấu tranh giai cấp'
    và 'lịch sử khoa học'.", "Độc thoại nội tâm của Tanya khóa đại từ 'mình'."]
- segment_id: YS-LN05/Text/part0010.html/p000806
  kind: terminology_and_voice
  value: choices=["Thoại tự trách dùng đại từ 'mình' theo DEC-P01-001."]
- segment_id: YS-LN05/Text/part0010.html/p000807
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm của Tanya khóa đại từ 'Mình' (kết hợp 'bản thân'
    để tránh lặp từ)."]
- segment_id: YS-LN05/Text/part0010.html/p000808
  kind: terminology_and_voice
  value: choices=["Ngôi 'you' khái quát dịch là 'người ta'; ngôi 'I' nội tâm của Tanya
    khóa là 'Mình'."]
- segment_id: YS-LN05/Text/part0010.html/p000809
  kind: terminology_and_voice
  value: choices=["Toàn bộ câu được bọc nhấn mạnh Markdown '*...*' đúng theo thẻ em
    của nguồn (DEC-P01-002)."]
- segment_id: YS-LN05/Text/part0010.html/p000810
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm của Tanya khóa đại từ 'mình'; giữ cấu trúc giả
    định quá khứ tiếc nuối 'Lẽ ra mình phải biết...'."]
- segment_id: YS-LN05/Text/part0010.html/p000811
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng đại từ 'nó'; giữ dấu chấm lửng cuối câu nối sang
    phần sau trang minh họa."]
- segment_id: YS-LN05/Text/part0010.html/p000812
  kind: terminology_and_voice
  value: choices=["Thoại ngắn không chủ ngữ '“Tệ hại hết mức.”', không thêm nhấn mạnh
    Markdown."]
- segment_id: YS-LN05/Text/part0012.html/p000001
  kind: terminology_and_voice
  value: choices=["Giữ dấu chấm lửng mở đầu nối từ p000811 và định danh 'Tanya von
    Degurechaff'."]
- segment_id: YS-LN05/Text/part0012.html/p000002
  kind: terminology_and_voice
  value: choices=["Toàn bộ câu bọc nhấn mạnh Markdown '*Họ chơi xỏ mình rồi.*' theo
    DEC-P01-002 và dùng đại từ 'mình' theo DEC-P01-001."]
- segment_id: YS-LN05/Text/part0012.html/p000003
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm của Tanya khóa đại từ 'mình'; giữ sắc thái khẩu
    ngữ miệt thị 'trò tuyên truyền của đám Cộng sản' (Commie propaganda)."]
- segment_id: YS-LN05/Text/part0012.html/p000004
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm của Tanya khóa đại từ 'mình'; giữ tên tổ chức
    'Đảng Cộng sản'."]
- segment_id: YS-LN05/Text/part0012.html/p000005
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm khóa đại từ 'mình'; giữ cấu trúc giả định quá
    khứ 'Lẽ ra mình không nên...'."]
- segment_id: YS-LN05/Text/part0012.html/p000006
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm khóa đại từ 'Mình' và thuật ngữ 'cuộc tiến công
    cơ động' (mobile offensive)."]
- segment_id: YS-LN05/Text/part0012.html/p000007
  kind: terminology_and_voice
  value: choices=["Giữ phủ định nhấn mạnh 'thậm chí còn chẳng phải là vấn đề mùa đông
    nữa'."]
- segment_id: YS-LN05/Text/part0012.html/p000008
  kind: terminology_and_voice
  value: choices=["Giữ quan hệ nhân quả tất yếu 'sẽ chỉ càng khiến kẻ địch đoàn kết
    chặt chẽ hơn'."]
- segment_id: YS-LN05/Text/part0012.html/p000009
  kind: terminology_and_voice
  value: choices=["Khóa thuật ngữ 'đạo quân dã chiến' (hoặc 'lực lượng dã chiến')
    cho 'field army', không dùng 'quân đoàn'."]
- segment_id: YS-LN05/Text/part0012.html/p000010
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm khóa đại từ 'Mình'."]
- segment_id: YS-LN05/Text/part0012.html/p000011
  kind: terminology_and_voice
  value: choices=["Giữ đại từ 'chúng ta', thuật ngữ 'đội quân chính quy' (regular
    army), 'lực lượng du kích' (guerrillas), và nhấn mạnh Markdown '*có giới hạn*'
    đúng vị trí thẻ em."]
- segment_id: YS-LN05/Text/part0012.html/p000012
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'vật tư và trang bị quân sự' (matériel) theo pending-terms-index.yml,
    cùng các tên riêng 'Việt Nam', 'đế quốc Mỹ', 'Afghanistan', 'Liên Xô', 'người
    Mông Cổ' và 'luật chiến tranh' (law of war)."]
- segment_id: YS-LN05/Text/part0012.html/p000013
  kind: terminology_and_voice
  value: choices=["Giữ đại từ nội tâm 'chúng ta'."]
- segment_id: YS-LN05/Text/part0012.html/p000014
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'hoạt động chống nổi dậy' (counterinsurgency), 'Quân
    đội Anh', 'thuộc địa', 'Malaya', đại từ khái quát 'ta', và nhấn mạnh Markdown
    '*hửm*' ở cuối câu."]
- segment_id: YS-LN05/Text/part0012.html/p000015
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'thuộc địa' và 'mẫu quốc' (suzerain state), cùng
    đại từ khái quát 'Người ta'."]
- segment_id: YS-LN05/Text/part0012.html/p000016
  kind: terminology_and_voice
  value: choices=["Giữ nhấn mạnh Markdown '*Ồ*' ở đầu câu đúng theo thẻ em (DEC-P01-002)
    và câu dẫn trần thuật 'Tanya thầm nghĩ'."]
- segment_id: YS-LN05/Text/part0012.html/p000017
  kind: terminology_and_voice
  value: choices=["Toàn bộ câu hỏi nội tâm bọc nhấn mạnh Markdown '*Đơn giản quá còn
    gì nữa?*' theo DEC-P01-002."]
- segment_id: YS-LN05/Text/part0012.html/p000018
  kind: terminology_and_voice
  value: choices=["Giữ nghĩa phủ định sự cần thiết phải đối đầu với toàn bộ kẻ địch,
    không thêm trạng ngữ thời gian 'cùng một lúc'."]
- segment_id: YS-LN05/Text/part0012.html/p000019
  kind: terminology_and_voice
  value: choices=["Giữ đại từ 'Chúng ta' và thành ngữ chiến lược 'chia để trị' (divide
    and conquer)."]
- segment_id: YS-LN05/Text/part0012.html/p000020
  kind: terminology_and_voice
  value: choices=["Câu dẫn trần thuật dùng 'Tanya'; câu cuối là nội tâm của Tanya
    khóa đại từ 'chúng ta' và làm rõ chủ thể giao chiến ('số lượng kẻ địch mà ta phải
    giao chiến')."]
- segment_id: YS-LN05/Text/part0012.html/p000021
  kind: terminology_and_voice
  value: choices=["Khóa thành ngữ 'dù tốt hay xấu' (for better or worse) và thuật
    ngữ 'quốc gia đa sắc tộc' (multiethnic state)."]
- segment_id: YS-LN05/Text/part0012.html/p000022
  kind: terminology_and_voice
  value: choices=["Giữ nhấn mạnh Markdown '*Chủ nghĩa Cộng sản lý tưởng*' đúng phạm
    vi thẻ em (DEC-P01-002).", "Giữ mức độ giả định/khả năng ('Nếu... thì biết đâu
    lại có thể...', 'Nếu chỉ xét thuần túy về mặt khả năng... có tiềm năng...')."]
- segment_id: YS-LN05/Text/part0012.html/p000023
  kind: terminology_and_voice
  value: choices=["Giữ đại từ 'chúng ta', từ nguyên gốc 'hikikomori', và định danh
    'Đế quốc', 'Liên bang'."]
- segment_id: YS-LN05/Text/part0012.html/p000024
  kind: terminology_and_voice
  value: choices=["Giữ đại từ 'chúng ta'."]
- segment_id: YS-LN05/Text/part0012.html/p000025
  kind: terminology_and_voice
  value: choices=["Thoại độc thoại của Tanya giữ đại từ 'Mình' theo DEC-P01-001."]
- segment_id: YS-LN05/Text/part0012.html/p000026
  kind: terminology_and_voice
  value: choices=["Độc thoại nội tâm kết chương của Tanya khóa đại từ 'mình' theo
    DEC-P01-001."]
