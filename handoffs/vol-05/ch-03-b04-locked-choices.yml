- segment_id: YS-LN05/Text/part0018.html/p000094
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: Rudersdorf gọi Tanya là ''Trung tá'' (Colonel),
    xưng ''tôi - Cô''.", "Thuật ngữ: giữ nguyên ''Kampfgruppe''."]'
- segment_id: YS-LN05/Text/part0018.html/p000095
  kind: terminology_and_voice
  value: 'locked=["Tên nhân vật: ''Tanya''; giữ nhịp câu ngắn thể hiện sự đột ngột."]'
- segment_id: YS-LN05/Text/part0018.html/p000096
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: Tanya gọi Rudersdorf là ''thưa Tướng quân''
    (General) và ''ngài''."]'
- segment_id: YS-LN05/Text/part0018.html/p000097
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: ''Tôi'', ''Trung tá'' (Colonel)."]'
- segment_id: YS-LN05/Text/part0018.html/p000098
  kind: terminology_and_voice
  value: 'locked=["Tên & quân hàm: ''Tướng von Rudersdorf'' (General von Rudersdorf).",
    "Nhấn mạnh Markdown & đại từ: chỉ bọc ''*...*'' ở câu hỏi nội tâm thứ hai theo
    DEC-P01-002; dùng ''chính mình'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000099
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Kampfgruppe Salamander'' (Salamander Kampfgruppe),
    ''nơi đóng quân ban đầu'' (original stations).", "Đại từ thoại: ''chúng tôi''
    (we) đại diện phía Bộ Tổng tham mưu."]'
- segment_id: YS-LN05/Text/part0018.html/p000100
  kind: terminology_and_voice
  value: locked=['Giữ câu hỏi thảng thốt lễ phép của Tanya.']
- segment_id: YS-LN05/Text/part0018.html/p000101
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown: bọc toàn bộ câu hỏi nội tâm trong ''*...*''
    theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0018.html/p000102
  kind: terminology_and_voice
  value: 'locked=["Đại từ: trần thuật chỉ Tanya bằng ''nó'' (DEC-P01-001), trong thoại
    Tanya xưng ''tôi''.", "Thuật ngữ: phân biệt ''Kampfgruppe'' và ''cụm tác chiến''
    (combat group)."]'
- segment_id: YS-LN05/Text/part0018.html/p000103
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & quân hàm: ''Kampfgruppe của Đế quốc'', ''Trung tá''."]'
- segment_id: YS-LN05/Text/part0018.html/p000104
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya xưng ''tôi'' khi xin lỗi cấp trên."]'
- segment_id: YS-LN05/Text/part0018.html/p000105
  kind: terminology_and_voice
  value: 'locked=["Tên & danh xưng trần thuật: ''Vị tướng'', ''Tanya''."]'
- segment_id: YS-LN05/Text/part0018.html/p000106
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & đại từ: Tanya xưng ''Tôi'', dùng ''mình'' phản thân cho
    ''người chỉ huy''."]'
- segment_id: YS-LN05/Text/part0018.html/p000107
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & đại từ: bọc toàn bộ câu nội tâm trong ''*...*''
    (DEC-P01-002); Tanya tự xưng ''mình'' (DEC-P01-001)."]'
- segment_id: YS-LN05/Text/part0018.html/p000108
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''Nó'' và ''mình'' theo DEC-P01-001; giữ phủ
    định nhấn mạnh ''chẳng muốn dù là sĩ quan cấp trên''."]'
- segment_id: YS-LN05/Text/part0018.html/p000109
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''hệ thống chỉ huy'' (chain of command)."]'
- segment_id: YS-LN05/Text/part0018.html/p000110
  kind: terminology_and_voice
  value: 'locked=["Logic phủ định: ''Chẳng có kết quả tốt đẹp gì khi cấp trên của
    người chỉ huy lại gạt bỏ quyết định của họ cả!''."]'
- segment_id: YS-LN05/Text/part0018.html/p000111
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & đại từ: ''Bộ Tổng tham mưu'' (General Staff), nội tâm
    tự xưng ''mình'' (DEC-P01-001), không bọc ''*...*'' vì nguồn không in nghiêng
    (DEC-P01-002)."]'
- segment_id: YS-LN05/Text/part0018.html/p000112
  kind: terminology_and_voice
  value: locked=['Giữ khẳng định nhấn mạnh trong thoại về tính chưa từng có tiền lệ
    của việc giải thể đơn vị sẵn sàng xuất kích.']
- segment_id: YS-LN05/Text/part0018.html/p000113
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Rudersdorf gọi Tanya là ''cô''."]'
- segment_id: YS-LN05/Text/part0018.html/p000114
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''Nó'' (Tanya) và ''ông ta'' (Rudersdorf) theo
    DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000115
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: ''Trung tá von Degurechaff'', ''tôi - cô''.",
    "Thuật ngữ: ''Kampfgruppe'', ''lực lượng đặc nhiệm lâm thời'' (ad hoc task force),
    ''đơn vị chính quy'' (regular unit)."]'
- segment_id: YS-LN05/Text/part0018.html/p000116
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & tình thái quá khứ: ''ngài'', ''tôi''; giữ cấu trúc giả
    định quá khứ ''lẽ ra tôi không nên đầu tư công sức vào đó sao?''."]'
- segment_id: YS-LN05/Text/part0018.html/p000117
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & đại từ: ''cô'', ''Tôi'', ''chúng ta'', trần thuật ''ông
    ta''.", "Thuật ngữ & đối lập logic: ''đội hình lâm thời'' (ad hoc formation),
    ''Kampfgruppe'' / ''Các Kampfgruppe'' (Kampfgruppen), ''tri thức học thuyết''
    (doctrinal knowledge) đối lập với ''sức mạnh hay tài năng của một người chỉ huy
    đơn lẻ''."]'
- segment_id: YS-LN05/Text/part0018.html/p000118
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Lục quân Đế quốc'' (Imperial Army), ''tiêu chuẩn phổ
    quát'' (universal standards)."]'
- segment_id: YS-LN05/Text/part0018.html/p000119
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & đại từ: ''các Kampfgruppe'' (Kampfgruppen), nội tâm
    tự xưng ''mình'' (DEC-P01-001)."]'
- segment_id: YS-LN05/Text/part0018.html/p000120
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & thuật ngữ: ''Tôi'', ''cô'', ''chúng ta''; ''Bộ Tổng tham
    mưu'' (General Staff), ''các Kampfgruppe'' (Kampfgruppen), ''bí quyết thực tiễn''
    (know-how)."]'
- segment_id: YS-LN05/Text/part0018.html/p000121
  kind: terminology_and_voice
  value: 'locked=["Đại từ: ''Chúng ta'', ''Ông ta''; giữ ẩn dụ ''bánh răng không thể
    thay thế'' (irreplaceable cog)."]'
- segment_id: YS-LN05/Text/part0018.html/p000122
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''sự tiêu hao'' (attrition), ''phương án dự phòng''
    (backups)."]'
- segment_id: YS-LN05/Text/part0018.html/p000123
  kind: terminology_and_voice
  value: 'locked=["Tên & xưng hô: ''Tanya'', ''ngài''; địa danh ''phía Đông'' (the
    east)."]'
- segment_id: YS-LN05/Text/part0018.html/p000124
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật chỉ Tanya: ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000125
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & thuật ngữ: ''Nó'' (DEC-P01-001), ''phòng tuyến
    tiền tiêu xa nhất'' (forward-most line), ''mặt trận phía Đông'' (eastern front)."]'
- segment_id: YS-LN05/Text/part0018.html/p000126
  kind: terminology_and_voice
  value: 'locked=["Phủ định bộ phận: ''chưa chắc đã vững vàng'' (isn''t necessarily
    sound)."]'
- segment_id: YS-LN05/Text/part0018.html/p000127
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & đại từ: ''chúng ta'', ''Kampfgruppe'', ''lực lượng
    dự bị chiến lược'' (strategic reserve)."]'
- segment_id: YS-LN05/Text/part0018.html/p000128
  kind: terminology_and_voice
  value: 'locked=["Đại từ & thuật ngữ: ''chúng tôi'', ''lực lượng dự bị chiến lược''
    (strategic reserve), ''nhìn về phía trước'' (look ahead)."]'
- segment_id: YS-LN05/Text/part0018.html/p000129
  kind: terminology_and_voice
  value: locked=["Giữ từ hỏi lặp lại 'Phía trước ư?' khớp với 'nhìn về phía trước'
    ở đoạn p000128."]
- segment_id: YS-LN05/Text/part0018.html/p000130
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Tốc độ tiêu hao'' (rate of attrition), ''mặt trận
    phía Đông'' (eastern front), ''năng lực tác chiến'' (combat capability)."]'
- segment_id: YS-LN05/Text/part0018.html/p000131
  kind: terminology_and_voice
  value: 'locked=["Tên nhân vật: ''Tanya''; giữ sắc thái ''bất giác nghẹn lời''."]'
- segment_id: YS-LN05/Text/part0018.html/p000132
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & thuật ngữ: ''Nó'' (DEC-P01-001), ''Đế quốc''
    (The Empire), ẩn dụ ''máu và sắt'' (blood and iron)."]'
- segment_id: YS-LN05/Text/part0018.html/p000133
  kind: terminology_and_voice
  value: locked=["Giữ cấu trúc phủ định giả định về mốc thời gian 'ngày mai' (sau
    khi bổ sung từ bị động theo finding)."]
- segment_id: YS-LN05/Text/part0018.html/p000134
  kind: terminology_and_voice
  value: locked=["Giữ phủ định nối tiếp ở mốc thời gian 'Tuần sau'."]
- segment_id: YS-LN05/Text/part0018.html/p000135
  kind: terminology_and_voice
  value: 'locked=["Tình thái & thuật ngữ: ''hẳn vẫn có thể'' (should be able to),
    ''năng lực tác chiến'' (combat capability)."]'
- segment_id: YS-LN05/Text/part0018.html/p000136
  kind: terminology_and_voice
  value: 'locked=["Tình thái giả định: ''nếu may mắn, họ có thể cầm cự qua hết năm
    sau mà không sụp đổ''."]'
- segment_id: YS-LN05/Text/part0018.html/p000137
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''nguồn nhân lực hữu hạn của Đế quốc'' (the Empire''s
    finite human resources); giữ hình ảnh so sánh với ''đồng hồ cát''."]'
- segment_id: YS-LN05/Text/part0018.html/p000138
  kind: terminology_and_voice
  value: locked=["Giữ phép đối lập 'không giống như đồng hồ cát, chẳng có cách nào
    để lật ngược lại và bắt đầu từ đầu cả'."]
- segment_id: YS-LN05/Text/part0018.html/p000139
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & đại từ: ''chúng ta'', ''những đơn vị đã vụn vỡ'' (crumbled
    units), ''học thuyết Kampfgruppe'' (Kampfgruppen doctrine), ''ngay tức thì tùy
    theo tình hình'' (on the fly), ''phi quy chuẩn'' (atypical)."]'
