- segment_id: YS-LN05/Text/part0016.html/p000500
  kind: terminology_and_voice
  value: choices=["Giữ câu dẫn ngắn 'Vậy nên vấn đề nằm ở chỗ này.'."]
- segment_id: YS-LN05/Text/part0016.html/p000501
  kind: terminology_and_voice
  value: choices=["Khóa đại từ 'chúng ta' và câu hỏi xin chỉ thị 'Chúng ta nên xử
