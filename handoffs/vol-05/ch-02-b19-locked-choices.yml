- segment_id: YS-LN05/Text/part0016.html/p000468
  kind: terminology_and_voice
  value: choices=["Khóa 'người đứng đầu cơ quan tình báo' ('the top of the intelligence
    agency') và ẩn dụ mùa đông - mùa xuân cùng câu hỏi tu từ cuối đoạn."]
- segment_id: YS-LN05/Text/part0016.html/p000469
  kind: terminology_and_voice
  value: choices=["Khóa đại từ bao gộp 'chúng ta', 'chỗ ở hạng nhất' ('first-class
    accommodations') và 'những người trở về' ('the returnees')."]
- segment_id: YS-LN05/Text/part0016.html/p000470
  kind: terminology_and_voice
  value: choices=["Khóa 'các điệp viên tình báo bị bắt' ('captured intelligence agents')
