- segment_id: YS-LN05/Text/part0016.html/p000476
  kind: terminology_and_voice
  value: choices=["Khóa giọng thoại lịch sự của Habergram ('sao ạ', 'Xin thứ lỗi cho
    lời nói đùa vừa rồi'), đại từ 'tôi' và nhận định 'phòng hạng nhất là điều bất
    khả thi'."]
- segment_id: YS-LN05/Text/part0016.html/p000477
  kind: terminology_and_voice
  value: choices=["Khóa tên riêng 'Habergram', đại từ 'Ông', chức danh 'vị thủ tướng'
