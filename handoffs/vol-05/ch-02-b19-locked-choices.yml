    ứng của Thủ tướng Churbull."]
- segment_id: YS-LN05/Text/part0016.html/p000475
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc câu danh ngữ mở đầu và sự đối lập giữa 'nở một nụ
