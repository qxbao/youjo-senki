    lặng lẽ cạn ly'."]
- segment_id: YS-LN05/Text/part0016.html/p000482
  kind: terminology_and_voice
  value: choices=["Khóa tên riêng 'Habergram', đại từ 'ông' và bước chuyển tâm lý
    từ dễ mủi lòng sang 'tự nghiêm khắc chấn chỉnh bản thân'."]
- segment_id: YS-LN05/Text/part0016.html/p000483
  kind: terminology_and_voice
  value: choices=["Khóa cặp đại từ 'tôi - ngài', đại từ bao gộp 'chúng ta' và thuật
    ngữ 'đơn vị phản gián của tôi' ('my anti-espionage unit') trong phần tự hiệu chỉnh
