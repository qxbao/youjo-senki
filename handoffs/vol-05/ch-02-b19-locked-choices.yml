    tưởng tượng.*' theo DEC-P01-002."]
- segment_id: YS-LN05/Text/part0016.html/p000471
  kind: terminology_and_voice
  value: choices=["Khóa 'tin tức tình báo tuyệt mật' ('top secret intel'), phủ định
    'không thể được công bố' và giả định trái thực tế 'giả sử chúng có thể được công
    khai'."]
- segment_id: YS-LN05/Text/part0016.html/p000472
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*Vô hạn.*' cho câu trả lời
    ngắn theo DEC-P01-002."]
- segment_id: YS-LN05/Text/part0016.html/p000473
  kind: terminology_and_voice
  value: choices=["Giữ câu hỏi tu từ cảm thán và chi tiết xúc động 'đủ làm ông ứa
