choices:
- segment_id: YS-LN05/Text/part0025.html/p000574
  kind: terminology_and_voice
  value: 'choices=[''Nhịp mệnh lệnh chiến thuật ngắn gọn: "Chặn bước chúng, trụ vững,
    rồi đánh bật chúng lùi lại."'']'
- segment_id: YS-LN05/Text/part0025.html/p000575
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: số nhiều "Bọn mình",
    không thêm dấu sao khi nguồn không in nghiêng.'', ''Thuật ngữ: "mô thức công thành
    chiến kinh điển" (classic siege battle pattern), "phía đông" (the east).'']'
- segment_id: YS-LN05/Text/part0025.html/p000576
  kind: terminology_and_voice
  value: 'choices=[''Phân tách điểm nhìn theo DEC-P01-001: hai câu đầu trần thuật
    dùng "Tanya" và "nó"; hai câu sau độc thoại nội tâm dùng "Bọn mình".'', ''Thuật
    ngữ & phủ định: "chẳng có khoảng dư nào để mà kén cá chọn canh", "Thế chiến thứ
    Tư" (World War IV).'']'
- segment_id: YS-LN05/Text/part0025.html/p000577
  kind: terminology_and_voice
  value: 'choices=[''Thoại ngắn của Tanya: "Có câu hỏi nào không?".'']'
- segment_id: YS-LN05/Text/part0025.html/p000578
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Trung úy Tospan với Tanya: gọi "thưa Trung tá" (Colonel),
    giữ câu hỏi tu từ lễ phép "sao ạ?".'', ''Cấp bậc & đơn vị: "Tiểu đoàn Pháp sư
    Trên không số 203 của Thiếu tá Weiss" (Major Weiss’s 203rd Aerial Mage Battalion),
    "đợt phản kích" (the counterattack).'']'
- segment_id: YS-LN05/Text/part0025.html/p000579
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya hỏi lại Tospan: gọi "anh".'']'
- segment_id: YS-LN05/Text/part0025.html/p000580
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & đại từ trần thuật: "Trung úy Tospan" (Lieutenant Tospan)
    — gọi là "hắn"; "Đại úy Ahrens" (Captain Ahrens) — phản thân "mình".'']'
- segment_id: YS-LN05/Text/part0025.html/p000581
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Đại úy Ahrens với Tanya: số nhiều "chúng tôi".'', ''Thuật
    ngữ: "lệnh yểm trợ phòng ngự" (defense support orders), "đơn vị thiết giáp" (armored
    unit), "bộ binh" (infantry).'']'
- segment_id: YS-LN05/Text/part0025.html/p000582
  kind: terminology_and_voice
  value: 'choices=[''Thoại bác bỏ của Tanya: "Không được.", thuật ngữ "Đơn vị thiết
    giáp" (The armored unit), "thời khắc quyết định" (a decisive juncture).'']'
- segment_id: YS-LN05/Text/part0025.html/p000583
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ tên "Tanya", thuật ngữ "tư tưởng tập trung lực
    lượng thiết giáp" (the idea of concentrated armored forces).'']'
- segment_id: YS-LN05/Text/part0025.html/p000584
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ & phủ định: "không thể phân tán sức đột kích của họ
    ra được", "lực lượng thiết giáp" (armored forces), "một đòn giáng quyết định duy
    nhất" (a single decisive strike).'']'
- segment_id: YS-LN05/Text/part0025.html/p000585
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Đại úy Ahrens: "Lý thuyết tập trung lực lượng thiết
    giáp" (The theory of concentrated armored forces), "các tuyến phòng ngự" (the
    defensive lines), "đơn vị thiết giáp" (the armored unit).'']'
- segment_id: YS-LN05/Text/part0025.html/p000586
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Quả là một sự trớ trêu
    thú vị.*"'']'
- segment_id: YS-LN05/Text/part0025.html/p000587
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng "Mình",
    đồng thời giữ lối tự nhắc tên ở ngôi thứ ba "như Tanya" (like Tanya) đúng như
    nguyên tác.'', ''Cấp bậc & thuật ngữ: "chỉ huy đơn vị thiết giáp" (commander of
    an armored unit), "Đại úy Ahrens" (Captain Ahrens), "các lực lượng phi thiết giáp"
    (not-armored forces).'']'
- segment_id: YS-LN05/Text/part0025.html/p000588
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Đại úy Ahrens với Tanya: số nhiều "chúng ta", gọi "ngài",
    "thưa Trung tá" (Colonel).'', ''Thuật ngữ: "các đơn vị thiết giáp" (armored units),
    "yểm trợ phòng ngự" (supporting defense).'']'
- segment_id: YS-LN05/Text/part0025.html/p000589
  kind: terminology_and_voice
  value: 'choices=[''Tên riêng & thuật ngữ: "Ahrens", "lực lượng thiết giáp" (armored
    forces), "phòng tuyến" (lines), "phản kích" (counterattack), "những tuyến bộ binh
    không có chi viện" (lines of infantry ... without reinforcement).'']'
- segment_id: YS-LN05/Text/part0025.html/p000590
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya: số nhiều "chúng ta".'']'
- segment_id: YS-LN05/Text/part0025.html/p000591
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Ahrens với Tanya: dịch "ma’am" là "thưa Trung tá".'']'
- segment_id: YS-LN05/Text/part0025.html/p000592
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Đại úy Ahrens: gọi "Đại úy Ahrens", "anh",
    tự xưng "Tôi", số nhiều "chúng ta" / "Chúng ta".'', ''Thuật ngữ: "Kampfgruppe",
    "pháo binh, bộ binh và pháp sư" (artillery, infantry, and mages), "các tuyến phòng
    ngự" (defensive lines), "tổ hợp vàng" (golden combo), "mặt trận Rhine" (on the
    Rhine).'']'
- segment_id: YS-LN05/Text/part0025.html/p000593
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: "Kampfgruppe Salamander" (Salamander Kampfgruppe),
    "mặt trận Rhine" (on the Rhine), "các trận phòng ngự chiến hào" (trench defense
    battles), "vành đai phòng ngự" (defense perimeter).'']'
- segment_id: YS-LN05/Text/part0025.html/p000594
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya: số nhiều "chúng ta", giữ phủ định và tình thái
    "phòng tuyến của chúng ta sẽ không bị chọc thủng đâu. Có lẽ chúng ta không cần
    phải lo lắng."'', ''Trần thuật theo DEC-P01-001: gọi Tanya là "Nó", phản thân
    "mình".'']'
- segment_id: YS-LN05/Text/part0025.html/p000595
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & đại từ trần thuật: "Trung úy Grantz" (Lieutenant Grantz),
    gọi là "Anh ta" / "anh ta".'', ''Thoại của Grantz với Tanya: gọi "Trung tá" (Colonel),
    tự xưng số nhiều "chúng tôi".'', ''Thuật ngữ: "mặt trận Rhine" (the Rhine front),
    "những vị khách Liên bang" (our Federation guests).'']'
- segment_id: YS-LN05/Text/part0025.html/p000596
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ tên "Grantz", "một cựu binh dày dạn trận mạc"
    (a seasoned veteran).'']'
- segment_id: YS-LN05/Text/part0025.html/p000597
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Đại úy Ahrens: tự xưng "Tôi", gọi Ahrens
    là "anh", gọi Grantz ở ngôi thứ ba là "cậu ta".'', ''Cấp bậc & thuật ngữ: "Trung
    úy Grantz" (Lieutenant Grantz), "Thập tự Sắt" (Iron Cross), "mặt trận Rhine" (on
    the Rhine), "Đại úy Ahrens" (Captain Ahrens), "Tiểu đoàn Pháp sư Trên không số
    203" (203rd Aerial Mage Battalion), "Hai Trung úy Wüstemann và Grantz" (Lieutenants
    Wüstemann and Grantz), "Thiếu tá Weiss" (Major Weiss), "hai đại đội" (two companies).'']'
- segment_id: YS-LN05/Text/part0025.html/p000598
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Đại úy Ahrens: tự xưng số nhiều "Chúng tôi", thuật
    ngữ "đại đội thiết giáp" (armored company).'']'
- segment_id: YS-LN05/Text/part0025.html/p000599
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Ahrens: gọi "anh".'', ''Thuật ngữ & quân
    số: "binh chủng" (branches), "đại đội pháp sư" (mage company), "mười hai người"
    (twelve people), "hai mươi tư người" (twenty-four in total), "vị trí tiền tiêu"
    (forward position).'']'
- segment_id: YS-LN05/Text/part0025.html/p000600
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: "tiểu đoàn pháp sư trên không" (aerial mage battalion),
    "đơn vị bộ binh" (infantry unit), "không quân" (air force), "máy bay tiêm kích
    và trực thăng vũ trang" (fighter planes and attack helicopters), "lực lượng mặt
    đất của địch" (enemy ground forces).'']'
- segment_id: YS-LN05/Text/part0025.html/p000601
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: "bộ binh với sự yểm trợ của lực lượng thiết giáp"
    (infantry supported by the armored forces).'']'
- segment_id: YS-LN05/Text/part0025.html/p000602
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Đại úy Ahrens với Tanya: gọi "ngài", thuật ngữ "phản
    kích" (counterattack), "trấn giữ vị trí" (hold the position).'']'
- segment_id: YS-LN05/Text/part0025.html/p000603
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật theo DEC-P01-001: gọi Tanya là "nó".'', ''Thoại của
    Tanya: tự xưng "tôi", số nhiều "chúng ta".'', ''Thuật ngữ & đối xứng: "tiểu đoàn
    pháp sư" (mage battalion), "lực lượng thiết giáp" (armored forces), "củng cố bàn
    đạp" (fortify our foothold), "trận chiến trận địa" (positional battle), "lấy bộ
    binh chọi bộ binh và lấy pháo binh chọi pháp sư" (fight infantry with infantry
    and mages with artillery), "lực lượng dự bị" (reserves), "đại đội thiết giáp"
    (armored company).'']'
- segment_id: YS-LN05/Text/part0025.html/p000604
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Đại úy Ahrens với Tanya: tự xưng "Tôi", số nhiều "chúng
    tôi", gọi "thưa Trung tá" (Colonel) và "ngài" (your).'']'
- segment_id: YS-LN05/Text/part0025.html/p000605
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya: tự xưng "Tôi", "những câu hỏi xác đáng" (a pertinent
    question).'']'
- segment_id: YS-LN05/Text/part0025.html/p000606
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng "mình",
    chủ ngữ giả định khái quát dùng "bạn".'', ''Thuật ngữ: "thái độ điềm đạm của một
    chuyên gia" (the moderate attitude of an expert).'']'
