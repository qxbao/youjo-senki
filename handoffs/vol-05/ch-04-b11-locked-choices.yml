    ĐỘI ĐẾ QUỐC'' theo finding)"]'
- segment_id: YS-LN05/Text/part0022.html/p000392
  kind: terminology_and_voice
  value: 'choices=["Cách gọi và xưng hô của Thuyền trưởng von Schraft với Tanya: ''Trung
    tá von Degurechaff'', ''tôi'' – ''cô''"]'
- segment_id: YS-LN05/Text/part0022.html/p000393
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và tên đầy đủ trong trần thuật: ''Trung tá Tanya von
    Degurechaff''"]'
- segment_id: YS-LN05/Text/part0022.html/p000394
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Tanya theo DEC-P01-001: ''Nó'' / ''nó'';
    thuật ngữ: ''chiếc U-152'', ''đơn vị pháp sư'', ''ba đại đội''"]'
- segment_id: YS-LN05/Text/part0022.html/p000395
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Tanya theo DEC-P01-001: ''Nó''; thuật ngữ:
    ''thủy thủ đoàn tàu ngầm''"]'
- segment_id: YS-LN05/Text/part0022.html/p000396
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Tanya trong thoại với von Schraft: ''Tôi'' – ''anh'',
    gọi chức danh ''Thuyền trưởng von Schraft''"]'
- segment_id: YS-LN05/Text/part0022.html/p000397
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya theo DEC-P01-001: tự quy chiếu bằng
    ''mình''; giữ cấu trúc so sánh nhất phủ định ''Chẳng có gì chướng tai gai mắt
    hơn...''"]'
- segment_id: YS-LN05/Text/part0022.html/p000398
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và đại từ trần thuật: ''Trung tá Tanya von Degurechaff'',
    ''nó''; giữ mệnh đề nhượng bộ giả định ''dù cho có là một vị thần khủng khiếp
    chắn ngang đường''"]'
- segment_id: YS-LN05/Text/part0022.html/p000399
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: bọc chính xác ''*Không.*''
    và câu cuối ''*Nếu một vị thần khủng khiếp chắn ngang đường mình, mình sẽ rất
    lấy làm hân hạnh được thổi bay hắn thành từng mảnh.*''", "Phân biệt đại từ theo
    DEC-P01-001: câu trần thuật ở giữa dùng ''nó'', câu nội tâm trực tiếp ở cuối dùng
    ''mình'', gọi thực thể thần thánh đối địch là ''hắn''"]'
- segment_id: YS-LN05/Text/part0022.html/p000400
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của von Schraft với Tanya: ''Cô''; thuật ngữ: ''căn cứ
    hải quân''"]'
- segment_id: YS-LN05/Text/part0022.html/p000401
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Tanya trong thoại: ''tôi''"]'
- segment_id: YS-LN05/Text/part0022.html/p000402
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng ''mình'',
    gọi ''Thuyền trưởng von Schraft'' và quy chiếu ngôi thứ ba là ''anh ta''"]'
- segment_id: YS-LN05/Text/part0022.html/p000403
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Tanya: ''nó'' kết hợp từ phản thân ''mình'',
    gọi von Schraft là ''anh ta''; giữ chi tiết xác định cấp bậc ''một sĩ quan hải
    quân ngang cấp với mình''"]'
- segment_id: YS-LN05/Text/part0022.html/p000404
  kind: terminology_and_voice
  value: 'choices=["Khái niệm: ''tinh thần tự do''"]'
- segment_id: YS-LN05/Text/part0022.html/p000405
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc ''*Nhưng.*'' ở đầu
