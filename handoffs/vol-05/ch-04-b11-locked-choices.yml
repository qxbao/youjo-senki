- segment_id: YS-LN05/Text/part0022.html/p000407
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của von Schraft: ''Cô'' – ''tôi''; đại từ
    trần thuật chỉ von Schraft: ''Anh ta''", "Nhấn mạnh Markdown theo DEC-P01-002:
    chỉ bọc câu cuối ''*Ôi, những thủy thủ tuyệt vời của tàu U-152, khi cuộc chiến
