    tôi'' (giới lính tàu ngầm)"]'
- segment_id: YS-LN05/Text/part0022.html/p000423
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya: ''anh'', ''chúng ta''; thuật ngữ
