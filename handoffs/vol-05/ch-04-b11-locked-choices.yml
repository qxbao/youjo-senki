- segment_id: YS-LN05/Text/part0022.html/p000387
  kind: terminology_and_voice
  value: 'choices=["Giữ câu chuyển đoạn ngắn: ''Và thế là.''"]'
- segment_id: YS-LN05/Text/part0022.html/p000388
  kind: terminology_and_voice
  value: 'choices=["Giữ câu chuyển cảnh ngắn: ''Vào ngày hôm đó.''"]'
- segment_id: YS-LN05/Text/part0022.html/p000389
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và xưng hô trước tiểu đoàn: ''Đại tá Mikel'', hô ngữ
    ''Các đồng chí'', đại từ ''các đồng chí'' – ''chúng ta''", "Hình ảnh ẩn dụ và
    mệnh lệnh: ''chó canh gác'', ''Hãy bám sát con tàu cho đến khi nó về nhà an toàn!''"]'
- segment_id: YS-LN05/Text/part0022.html/p000390
  kind: terminology_and_voice
  value: 'choices=["Giữ nguyên ba lớp dấu ngoặc kép biểu thị tiếng đồng thanh đáp
