- segment_id: YS-LN05/Text/part0022.html/p000391
  kind: terminology_and_voice
  value: 'choices=["Dòng tiêu đề chuyển cảnh viết hoa toàn bộ: ''LÃNH THỔ LIÊN BANG'',
