- segment_id: YS-LN05/Text/part0018.html/p000292
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & trích dẫn: ''nhật ký trực của quân cảnh'' (MP log),
    ''“Không có gì để báo cáo.”'' (“Nothing to report.”)."]'
- segment_id: YS-LN05/Text/part0018.html/p000293
  kind: terminology_and_voice
  value: 'locked=["Tiêu đề thời gian - địa điểm: giữ định dạng in hoa toàn bộ ''NGÀY
