- segment_id: YS-LN05/Text/part0018.html/p000298
  kind: terminology_and_voice
  value: 'locked=["Phủ định, tình thái & thuật ngữ: ''công cuộc tái thiết xem chừng
    không mấy suôn sẻ'' (the recovery effort wasn’t proceeding very smoothly), ''có
    vẻ là'' (apparently), ''bàn đạp trên không'' (aerial foothold)."]'
- segment_id: YS-LN05/Text/part0018.html/p000299
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''quân nhân'' (personnel), ''các sĩ quan điều khiển''
    (control officers), ''căng tin'' (canteen)."]'
