- segment_id: YS-LN05/Text/part0018.html/p000286
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: Tanya gọi ''Hạ sĩ'' (Corporal) và ''cậu'',
    xưng ''Tôi'' / ''tôi''."]'
- segment_id: YS-LN05/Text/part0018.html/p000287
  kind: terminology_and_voice
  value: 'locked=["Xưng hô quân hàm: viên hạ sĩ đáp ''“Rõ, thưa Trung tá. Tôi cần
    gọi ai ạ?”'' (ma’am -> thưa Trung tá)."]'
- segment_id: YS-LN05/Text/part0018.html/p000288
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, đơn vị & xưng hô: ''Trung úy Serebryakov'' (First Lieutenant
