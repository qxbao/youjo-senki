- segment_id: YS-LN05/Text/part0018.html/p000284
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, đại từ & cấu trúc điều kiện đối lập: giữ hai mệnh đề
    điều kiện đối lập nhau (''Nếu nguyên nhân của vấn đề nằm ở một kẻ tép riu... Nhưng
    nếu vấn đề cốt lõi nằm ở tầng lớp cao hơn...''); dùng ''hắn'' cho ''kẻ tép riu'',
    giữ ''Tanya'', ''mình'' và ''viên sĩ quan cấp trên'' (superior officer)."]'
- segment_id: YS-LN05/Text/part0018.html/p000285
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & thuật ngữ: viên hạ sĩ xưng ''Tôi'' kèm ''ạ''; ''cấp trên
