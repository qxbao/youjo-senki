    (commander), ''Bộ Tư lệnh Lục quân'' (Army Command); giữ tình thái suy đoán ''ắt
    hẳn đã được chỉ thị'' và ''trông có vẻ''."]'
- segment_id: YS-LN05/Text/part0018.html/p000296
  kind: terminology_and_voice
  value: 'locked=["Tên riêng & tình thái rào đón: giữ dấu chấm lửng sau ''Tuy nhiên…'',
    ''có lẽ cũng nên nói thêm rằng'' và tên ''Tanya''."]'
- segment_id: YS-LN05/Text/part0018.html/p000297
  kind: terminology_and_voice
  value: 'locked=["Tên đơn vị, địa danh & tổ chức: ''Tiểu đoàn Pháp sư Trên không
    số 203'' (203rd Aerial Mage Battalion), ''Norden'', ''căn cứ lâm thời'' (provisional
