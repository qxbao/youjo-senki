- segment_id: YS-LN05/Text/part0018.html/p000260
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: viên hạ sĩ hỏi lại Tanya bằng ''“Hả? Thưa Trung
    tá?”'' (Colonel)."]'
- segment_id: YS-LN05/Text/part0018.html/p000261
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & câu hỏi đuôi: ''công vụ quân sự'' (military business),
    ''quân luật của Lục quân Đế quốc'' (military laws of the Imperial Army), ''cơ
    sở quân sự'' (military facility), ''quân luật'' (military law); giữ câu hỏi đuôi
    ''phải áp dụng quân luật chứ, không phải sao?''."]'
- segment_id: YS-LN05/Text/part0018.html/p000262
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, phủ định & thuật ngữ: viên hạ sĩ gọi ''thưa Trung tá''
    (ma’am) và quy chiếu ngôi thứ hai bằng ''Trung tá'', kèm tiểu từ lễ phép ''ạ'';
    giữ phủ định ''đây không phải là cơ sở quân sự ạ!''; ''nguồn vốn tư nhân'' (private
    capital), ''trẻ vị thành niên'' (minors)."]'
- segment_id: YS-LN05/Text/part0018.html/p000263
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, cấp bậc & đại từ phản thân: ''Tanya'', ''viên hạ sĩ''
    (the corporal), ''mình''."]'
- segment_id: YS-LN05/Text/part0018.html/p000264
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown, đại từ & xưng hô: chỉ bọc ''*à há!*'' trong
    ''*...*'' đúng theo thẻ em của nguồn (DEC-P01-002); trần thuật chỉ Tanya bằng
    ''nó'' (DEC-P01-001), chỉ viên hạ sĩ bằng ''anh ta''; lời dẫn trực tiếp của viên
    hạ sĩ dùng ''Trung tá không được vào''; giữ mệnh đề nhượng bộ phủ định ''dù bản
    thân nó chẳng hề chấp nhận lý lẽ ấy''."]'
- segment_id: YS-LN05/Text/part0018.html/p000265
  kind: terminology_and_voice
  value: 'locked=["Giữ câu nhận định ngắn gọn: ''Đây là vấn đề về cách diễn giải.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000266
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown, tình thái & thuật ngữ: giữ tình thái suy đoán
    ''Xem ra'' (Apparently); ''dân thường'' (civilians), ''viên hạ sĩ này'' (this
    corporal), ''cơ sở quân sự'' (military facility); chỉ bọc ''*Thế nhưng*'' trong
    ''*...*'' theo DEC-P01-002; giữ tên ''Tanya''."]'
- segment_id: YS-LN05/Text/part0018.html/p000267
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & thuật ngữ: ''Nó'' / ''mình'' (DEC-P01-001);
    ''khả năng diễn giải pháp luật'' (legal interpretations)."]'
- segment_id: YS-LN05/Text/part0018.html/p000268
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Câu lạc bộ sĩ quan'' (The officers’ club), ''nguồn
    vốn tư nhân'' (private capital), ''hội phí câu lạc bộ sĩ quan hằng tháng'' (monthly
    officers’ club dues)."]'
- segment_id: YS-LN05/Text/part0018.html/p000269
  kind: terminology_and_voice
  value: 'locked=["Điểm nhìn kép, đại từ & nhấn mạnh Markdown: câu một và câu ba là
    trần thuật dùng ''nó'', ''Tanya'', ''mình'' (DEC-P01-001); câu hai là độc thoại
    nội tâm bọc ''*Người ta ép mình đóng hội phí câu lạc bộ cơ mà!*'' trong ''*...*''
    và tự xưng ''mình'' đúng theo DEC-P01-001, DEC-P01-002.", "Thuật ngữ: ''bảo hiểm
    bắt buộc'' (mandatory insurance), ''hội phí'' (dues), ''tiền lương'' (wages)."]'
- segment_id: YS-LN05/Text/part0018.html/p000270
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & thuật ngữ: ''nó'' / ''bản thân'' (DEC-P01-001);
    ''cá nhân tự do'' (free individual), ''quyền lợi'' (rights)."]'
- segment_id: YS-LN05/Text/part0018.html/p000271
  kind: terminology_and_voice
  value: 'locked=["Đại từ nội tâm, nhấn mạnh & thuật ngữ: độc thoại nội tâm ngôi thứ
    nhất tự xưng ''Mình'' / ''mình'' (DEC-P01-001), không bọc ''*...*'' vì nguồn không
    in nghiêng (DEC-P01-002); ''cá nhân tự do'' (free individual), ''Being X'', ''những
    quyền thiêng liêng, bất khả xâm phạm'' (sacred, inviolable rights)."]'
- segment_id: YS-LN05/Text/part0018.html/p000272
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, tên riêng & phủ định: Tanya xưng ''Tôi'' / ''tôi'', gọi
    viên hạ sĩ là ''cậu''; trần thuật giữ phủ định ''Vì thế Tanya không chịu lùi bước.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000273
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, phủ định & thuật ngữ: viên hạ sĩ xưng ''Tôi'' / ''tôi'',
    quy chiếu Tanya bằng ''Trung tá'' kèm ''ạ''; giữ phủ định ở cả hai câu; ''câu
    lạc bộ sĩ quan'' (officers’ club)."]'
- segment_id: YS-LN05/Text/part0018.html/p000274
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc câu độc thoại nội tâm hướng
    tới viên hạ sĩ ''*Vậy là cậu định chống đối đến cùng chứ gì?*'' trong ''*...*''
    theo DEC-P01-002; câu hai trần thuật ''Cả hai đứng đối đầu, cau mày nhìn nhau.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000275
  kind: terminology_and_voice
  value: 'locked=["Tên riêng & đại từ trần thuật: ''Tanya'', ''Nó'' (DEC-P01-001)."]'
- segment_id: YS-LN05/Text/part0018.html/p000276
  kind: terminology_and_voice
  value: 'locked=["Giữ câu nhận xét khái quát: ''Tất nhiên, các sĩ quan luôn đến sớm
    năm phút.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000277
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & đại từ nội tâm: bọc phần suy nghĩ ''*Mọi người
    đang đợi mình…*'' trong ''*...*'' với đại từ ''mình'' (DEC-P01-001, DEC-P01-002);
    phần dẫn trần thuật phía sau để chữ thường."]'
- segment_id: YS-LN05/Text/part0018.html/p000278
  kind: terminology_and_voice
  value: 'locked=["Tên riêng & đại từ trần thuật: ''Weiss, Visha và Grantz'', ''tiểu
    đoàn của nó'' (DEC-P01-001)."]'
- segment_id: YS-LN05/Text/part0018.html/p000279
  kind: terminology_and_voice
  value: 'locked=["Tên riêng & phủ định: ''Tâm tính nhạy cảm của Tanya không thể chịu
    đựng thêm sự lãng phí thời gian nào nữa.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000280
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, xưng hô & thuật ngữ: Tanya gọi ''Hạ sĩ'' (Corporal) và
    ''Cậu'' / ''cậu'', xưng ''tôi''; ''lời cảnh cáo chính thức'' (official warning),
    ''cấp trên trực tiếp'' (direct superior), ''trẻ vị thành niên'' (minors)."]'
- segment_id: YS-LN05/Text/part0018.html/p000281
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''Nó'' (Tanya, DEC-P01-001) và ''anh ta'' (viên
    hạ sĩ)."]'
- segment_id: YS-LN05/Text/part0018.html/p000282
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & cấu trúc điều kiện: ''anh ta'', ''nó'' (DEC-P01-001);
    giữ mệnh đề điều kiện ''Nếu là do anh ta tự ý quyết định...''."]'
- segment_id: YS-LN05/Text/part0018.html/p000283
  kind: terminology_and_voice
  value: 'locked=["Tên riêng & cấu trúc đối lập: ''Tanya'', phản thân ''mình''; lược
    đại từ khái quát ngôi thứ hai tự nhiên (''cần phải xử lý những kẻ ngu ngốc khác
