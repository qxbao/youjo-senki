  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & thuật ngữ: ''nó'' (DEC-P01-001); ''mật lệnh
    niêm phong'' (sealed orders), ''két sắt của tiểu đoàn'' (battalion safe), ''các
    buổi diễn tập không chiến'' (air battle exercises)."]'
- segment_id: YS-LN05/Text/part0018.html/p000301
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & thuật ngữ: ''Nó'' (DEC-P01-001), ''họ''; ''bài
    diễn tập xuất kích khẩn cấp'' (scramble exercise)."]'
