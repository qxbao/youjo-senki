- segment_id: YS-LN05/Text/part0027.html/p000175
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & thuật ngữ: trong thoại dùng ''tôi''/''mình'',
    trần thuật dùng ''ông''; ''the Empire'' -> ''Đế quốc''; giữ sắc thái tự trách
    và ghét phải đánh cược định đoạt kết cục biến cố trọng đại."]'
- segment_id: YS-LN05/Text/part0027.html/p000176
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & giả định trái thực tế ở quá khứ: trần thuật
    dùng ''ông''; bọc chính xác câu độc thoại nội tâm ''*Nếu đã định đáp lại tôi bằng
    giọng điệu run rẩy như thế, lẽ ra ngay từ đầu ông nên bàn bạc với tôi mới phải…*''
    khớp với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0027.html/p000177
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: dùng ''tôi'' và ''chúng ta''; ''General Winter''
    -> ''Tướng Mùa Đông''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000178
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & thuật ngữ: ''General Winter'' -> ''Tướng Mùa Đông'';
    giữ sắc thái bực dọc thân mật ''Khỉ thật, cái lão Tướng Mùa Đông phiền phức đó''."]'
- segment_id: YS-LN05/Text/part0027.html/p000179
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa: giữ câu nhận định ngắn ''Thời điểm này hoàn
    toàn trật nhịp''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000180
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đối lập & phủ định: ''offensive'' -> ''cuộc tiến công'';
    ''the eastern front'' -> ''mặt trận phía đông''; ''a lull'' -> ''một khoảng lắng'';
    ''the Federation'' -> ''Liên bang''; giữ cặp đối lập ''nói giảm nói tránh / nói
    toạc ra'' và phủ định ''chẳng thể làm gì để chống lại sức mạnh của thiên nhiên''."]'
- segment_id: YS-LN05/Text/part0027.html/p000181
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: ''operation'' -> ''chiến dịch''; ''attrition''
    -> ''mức độ tiêu hao''; giữ hai ý phủ định không thể dự đoán chiến dịch sau mùa
    đông và không thể biết trước mức độ tiêu hao trong mùa đông."]'
- segment_id: YS-LN05/Text/part0027.html/p000182
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & câu hỏi phản vấn: giữ dấu chấm lửng trước ''hoàn toàn
    chưa từng có tiền lệ'' và câu hỏi tu từ ở câu thứ hai; đại từ ''họ'' / ''mình''."]'
- segment_id: YS-LN05/Text/part0027.html/p000183
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & quân hàm: bọc chính xác hai cụm chữ nghiêng
    ''*Dẫu vậy…*'' và ''*Có vô vàn biến số. Nhưng nếu chúng ta có thể xác định rõ
    dù chỉ một trong số đó, thì việc chốt chặt lấy nó cũng không phải là một ý tồi.*''
    theo DEC-P01-002; câu dẫn truyện ở giữa để chữ thường; ''General von Zettour''
    -> ''Tướng von Zettour''."]'
- segment_id: YS-LN05/Text/part0027.html/p000184
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: dùng ''tôi''; ''Supreme High Command'' ->
    ''Bộ Tư lệnh Tối cao''; giữ sắc thái quyết tâm ''bằng mọi giá''."]'
- segment_id: YS-LN05/Text/part0027.html/p000185
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & dấu ngoặc kép: ''Colonel von Degurechaff'' -> ''Trung
    tá von Degurechaff''; giữ ngoặc kép cho kế hoạch “tự trị”; đại từ trần thuật ''Ông''."]'
- segment_id: YS-LN05/Text/part0027.html/p000186
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & quan hệ nhân quả: ''Colonel von Lergen'' -> ''Trung
    tá von Lergen'', ''Lergen'' -> ''Lergen''; giữ mạch nhân quả vận động chính trị
    qua quan hệ của Lergen cộng với việc chấp nhận rủi ro lớn và vận may đi kèm nên
    bắt đầu thấy kết quả."]'
- segment_id: YS-LN05/Text/part0027.html/p000187
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & dấu câu: giữ dấu gạch ngang dài nối hai mệnh đề và
    tên riêng ''Zettour''."]'
- segment_id: YS-LN05/Text/part0027.html/p000188
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: dùng ''Tôi''; giữ câu hỏi ''Kế hoạch tự trị
    ư?'' và dấu gạch ngang dài ngắt lời ở cuối câu."]'
- segment_id: YS-LN05/Text/part0027.html/p000189
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tu từ & so sánh: ''Climax rhetoric'' -> ''Phép tu từ
    tiệm tiến''; giữ tên ''Rudersdorf'', đại từ ''Ông'' và ''chúng ta'', cùng cấu
