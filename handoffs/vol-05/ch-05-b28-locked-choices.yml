- segment_id: YS-LN05/Text/part0027.html/p000192
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại tán đồng: giữ nguyên ''Tất nhiên. Nghe rất hợp lý.''."]'
- segment_id: YS-LN05/Text/part0027.html/p000193
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấp cao nhất của phép tiệm tiến: ''the Reich'' ->
    ''Đế quốc''; giữ tên ''Zettour'', đại từ ''chúng ta'' và mức so sánh nhất ''tốt
