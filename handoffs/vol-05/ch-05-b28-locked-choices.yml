- segment_id: YS-LN05/Text/part0027.html/p000190
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại tán đồng: giữ câu xác nhận ngắn gọn ''Điều đó thì
    chắc chắn rồi.''."]'
- segment_id: YS-LN05/Text/part0027.html/p000191
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc tăng tiến: giữ mức độ tăng tiến ''Và một quốc gia trung
