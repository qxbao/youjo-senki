choices:
- segment_id: YS-LN05/Text/part0027.html/p000095
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: ''the front'' -> ''tiền tuyến''; ''fuel
    and shells'' -> ''nhiên liệu và đạn pháo''; ''offensive'' -> ''cuộc tiến công'';
    ''horses and fodder'' -> ''ngựa và cỏ khô''; ''Zettour'' -> ''Zettour''; ''Service
    Corps'' -> ''Cục Quân vụ''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000096
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ mục đích: ''domestic railroad network'' ->
    ''mạng lưới đường sắt nội địa''; ''major offensive'' -> ''cuộc tiến công quy mô
    lớn''; giữ chi tiết lịch trình đã được tính sát đến từng tuần bất chấp năng lực
    vận tải hạn chế; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000097
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tu từ: ''winter gear'' -> ''quân trang mùa
    đông''; ''front lines'' -> ''tiền tuyến''; ''essential consumables'' -> ''các
    vật tư tiêu hao thiết yếu''; giữ dạng câu hỏi tu từ kết bằng ''ư?''."]'
- segment_id: YS-LN05/Text/part0027.html/p000098
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cơ quan: ''point officers'' -> ''các sĩ quan đầu mối'';
    ''Railroad Department'' -> ''Cục Đường sắt''; ''Zettour'' -> ''Zettour''; ''Service
    Corps'' -> ''Cục Quân vụ''; ''timetable'' -> ''biểu đồ chạy tàu''."]'
- segment_id: YS-LN05/Text/part0027.html/p000099
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & mức độ: ''Railroad Department'' -> ''Cục Đường
    sắt''; giữ sắc thái đối lập giảm nhẹ ''vẫn còn tương đối dễ thở''."]'
- segment_id: YS-LN05/Text/part0027.html/p000100
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & phủ định: ''Operations'' -> ''Cục Tác chiến'';
    giữ dấu ngoặc kép quanh ''“vài tuần”''; giữ tương phản thời gian tụt xuống bằng
    không mà không có lời báo trước."]'
- segment_id: YS-LN05/Text/part0027.html/p000101
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ tăng tiến: ''Operations officers'' -> ''các
    sĩ quan Cục Tác chiến''; giữ sắc thái ''chỉ càng lúc càng thêm gay gắt''."]'
- segment_id: YS-LN05/Text/part0027.html/p000102
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: ''central observatory'' -> ''Đài quan sát
    trung ương''; ''mild autumn'' -> ''mùa thu năm nay sẽ ôn hòa''; các sĩ quan tham
    mưu xưng ''chúng ta''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN05/Text/part0027.html/p000103
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phủ định nghi vấn: giữ cấu trúc hỏi lại mang sắc thái
    hy vọng mong manh ''Không phải là nhầm lẫn hay hiện tượng nhất thời đấy chứ?!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000104
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''wishful thinking'' -> ''suy nghĩ viển
    vông''; giữ cụm ''bằng chứng không thể chối cãi rằng thực tại lúc nào cũng tàn
    nhẫn''."]'
- segment_id: YS-LN05/Text/part0027.html/p000105
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: ''the observatory'' -> ''đài quan sát'';
    giữ đại từ ''chúng ta'' và tình thái miễn cưỡng chấp nhận sự thật (''đành phải
    coi việc mùa đông ập tới là một sự thật hiển nhiên'')."]'
- segment_id: YS-LN05/Text/part0027.html/p000106
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & mô tả không khí: trần thuật ngôi thứ ba mô tả cảnh
    phòng họp; giữ đủ ba câu và sắc thái nặng nề đến ngạt thở.'']'
- segment_id: YS-LN05/Text/part0027.html/p000107
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & mệnh lệnh: giữ dấu chấm lửng mở đầu, đại từ ''Chúng
    ta'' và câu đề xuất rút quân dứt khoát ''Cho quân rút lui đi''."]'
- segment_id: YS-LN05/Text/part0027.html/p000108
  kind: terminology_and_voice
  value: 'choices=[''So sánh & nhân quả: giữ quan hệ nhân quả và hình ảnh so sánh
    bùng nổ như tạt xăng vào lửa.'']'
- segment_id: YS-LN05/Text/part0027.html/p000109
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái bắt buộc: ''the lines'' -> ''Các chiến tuyến'';
    ''offensive'' -> ''cuộc tiến công''; ''reorganize'' -> ''tái tổ chức''; giữ đại
    từ ''chúng ta'' và mức độ bắt buộc ''phải tái tổ chức ngay lập tức!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000110
  kind: terminology_and_voice
  value: 'choices=["Xưng hô tranh luận: dùng ''Các anh'' cho ngôi thứ hai chỉ phe
    chủ trương rút lui và ''chúng ta'' cho tập thể quân đội Đế quốc; giữ câu hỏi phản
    bác gay gắt."]'
- segment_id: YS-LN05/Text/part0027.html/p000111
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái khả năng: ''secure depth'' -> ''bảo đảm
    chiều sâu chiến tuyến / thế trận''; ''partial offensive and a partial reorganization''
    -> ''tiến công một phần và tái tổ chức một phần''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN05/Text/part0027.html/p000112
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''staff officers'' -> ''sĩ quan tham mưu''; ''the Empire''
    -> ''Đế quốc''."]'
- segment_id: YS-LN05/Text/part0027.html/p000113
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''military specialists'' -> ''các chuyên
    gia quân sự''; ''the Reich’s staffers'' -> ''đội ngũ sĩ quan tham mưu của Đế quốc'';
    giữ khẳng định tuyệt đối ''không còn nghi ngờ gì nữa, vốn chẳng ai sánh kịp''
    và thế nghịch lý ''buộc phải bất đồng quan điểm''."]'
- segment_id: YS-LN05/Text/part0027.html/p000114
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''operations and strategy'' -> ''chiến
    dịch và chiến lược''; giữ tình thái ''vốn dĩ nên được đem ra tranh luận giữa những
    người có góc nhìn đa dạng''."]'
- segment_id: YS-LN05/Text/part0027.html/p000115
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: giữ câu phủ định ''Đây không phải chuyện đùa
    đâu!'', xưng hô ''Các anh'', và ''frontline troops'' -> ''binh lính ngoài tiền
    tuyến''."]'
- segment_id: YS-LN05/Text/part0027.html/p000116
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi phản vấn: dùng ''các anh'' (ngôi thứ hai), ''họ''
    (binh lính tiền tuyến), và ''chúng ta'' (phe Đế quốc); giữ hai câu hỏi chất vấn
    liên tiếp."]'
- segment_id: YS-LN05/Text/part0027.html/p000117
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhân quả: giữ đối sánh hai luồng lập luận (tấn công và
    bảo toàn lực lượng) đều có cơ sở lý thuyết riêng nên cuộc tranh luận càng nặng
    cảm xúc và căng thẳng/bức bối.'']'
- segment_id: YS-LN05/Text/part0027.html/p000118
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: ''vulnerable supply lines'' -> ''các tuyến
    tiếp tế dễ tổn thương''; dùng ''Các anh'' và ''chúng ta'' nhất quán trong tranh
    luận."]'
- segment_id: YS-LN05/Text/part0027.html/p000119
  kind: terminology_and_voice
  value: 'choices=["Khẳng định trực tiếp: giữ câu đáp ngắn gọn ''Đó là một sự tính
    toán hợp lý!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000120
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản bác ngắn: giữ độ mở và sắc thái chất vấn gay gắt
    (''Như thế nào cơ chứ?!'' / ''Hợp lý ở chỗ nào cơ chứ?!'')."]'
- segment_id: YS-LN05/Text/part0027.html/p000121
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc tăng tiến: ''logistics'' -> ''Hệ thống hậu
    cần''; ''eastern front'' -> ''mặt trận phía đông''; ''Service Corps'' -> ''Cục
    Quân vụ''; ''Operations'' -> ''Cục Tác chiến''; giữ cấu trúc ''Không chỉ có Cục
    Quân vụ... mà tất cả mọi người ở Cục Tác chiến cũng vậy, cho dù họ không muốn
    thừa nhận đi chăng nữa''."]'
- segment_id: YS-LN05/Text/part0027.html/p000122
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''sporadic raids'' -> ''Những cuộc đột kích
    lẻ tẻ''; ''supply lines'' -> ''các tuyến tiếp tế''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN05/Text/part0027.html/p000123
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định: ''attrition of personnel'' -> ''Sự tiêu
    hao quân số''; ''supply network'' -> ''mạng lưới tiếp tế''; giữ hình ảnh so sánh
    xuất huyết không cầm được máu và hệ quả giả định khi kéo giãn thêm chiến tuyến."]'
- segment_id: YS-LN05/Text/part0027.html/p000124
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & tình thái: giữ dấu chấm lửng giữa câu, tình
    thái khả năng ''đã có thể gây ra hậu quả chí mạng'' và nhận định ''quyết định
    án binh bất động là hoàn toàn xác đáng''."]'
- segment_id: YS-LN05/Text/part0027.html/p000125
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & đại từ: dùng ''chúng ta / ta''; ''wintering''
    -> ''trú đông''; giữ hai câu điều kiện liên tiếp."]'
- segment_id: YS-LN05/Text/part0027.html/p000126
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*họ vẫn có thể tiến quân nếu hành
    động ngay bây giờ.*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002;
    phần ''Nhưng đồng thời…'' để chữ thường."]'
- segment_id: YS-LN05/Text/part0027.html/p000127
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: dùng ''Các anh'' và ''chúng ta'';
    ''winter gear'' -> ''quân trang mùa đông''; ''supply lines'' -> ''các tuyến tiếp
    tế''; giữ phủ định kép ''không có quân trang mùa đông tử tế trong khi chúng ta
    thậm chí còn chẳng chắc có thể đảm bảo duy trì được các tuyến tiếp tế hay không''."]'
- segment_id: YS-LN05/Text/part0027.html/p000128
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện phủ định & thành ngữ: ''Commonwealth'' ->
    ''Khối Thịnh vượng chung''; ''Unified States'' -> ''Hợp chúng quốc''; giữ câu
    điều kiện phủ định ở đầu đoạn và thành ngữ ''Phải rèn sắt khi còn nóng!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000129
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''the Empire, their Reich'' -> ''Đế quốc,
    tức tổ quốc của họ'' (tránh lặp từ ''Đế quốc'' khi hai danh xưng đi liền nhau);
    giữ phủ định ''Thời gian không đứng về phía...''."]'
- segment_id: YS-LN05/Text/part0027.html/p000130
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''national power'' -> ''Quốc lực''; ''working population''
    -> ''dân số trong độ tuổi lao động''; ''commodity shortage'' -> ''tình trạng thiếu
    hụt hàng hóa''; ''rationing system'' -> ''hệ thống phân phối theo định lượng'';
    ''the Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN05/Text/part0027.html/p000131
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện phủ định: dùng ''các anh'' và ''chúng ta'';
    giữ điều kiện phủ định ''Nếu không rút lui, quân đội của chúng ta sẽ tan rã mất!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000132
  kind: terminology_and_voice
  value: 'choices=["Phủ định & xưng hô: dùng ''Chúng ta'' và ''Các anh''; giữ khẳng
    định phủ định ''Chúng ta không thể rút quân lúc này được!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000133
  kind: terminology_and_voice
  value: 'choices=["Điệp cấu trúc & phủ định: giữ điệp ngữ ngắt bằng gạch ngang ''Nếu
    chúng ta hành động ngay bây giờ—nếu chúng ta hành động ngay bây giờ'', câu hỏi
    chất vấn về năm sau và câu cuối ''Chúng ta không thể bỏ lỡ cơ hội này được!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000134
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định kép: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    giữ cấu trúc phủ định kép ''không thể nói rằng cuộc xung đột kéo dài này không
    gây ra những tổn hại nặng nề''."]'
- segment_id: YS-LN05/Text/part0027.html/p000135
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhân quả: giữ liên từ chỉ hệ quả mở đầu câu và sắc thái
    bắt buộc của một vài sĩ quan khi phải chỉ rõ thực tại khắc nghiệt đó.'']'
