  kind: terminology_and_voice
  value: 'locked=["Tiêu đề thời gian - địa điểm: giữ định dạng in hoa toàn bộ ''NGÀY
    28 THÁNG 9, NĂM THỐNG NHẤT 1926, BUỔI TỐI, THỦ ĐÔ ĐẾ QUỐC BERUN, KHU VỰC LÂN CẬN
    CÂU LẠC BỘ SĨ QUAN''."]'
- segment_id: YS-LN05/Text/part0018.html/p000232
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, danh hiệu & thuật ngữ: ''Trung tá Tanya von Degurechaff''
    (Lieutenant Colonel Tanya von Degurechaff), ''sĩ quan ma pháp'' (magic officer),
    ''Huy hiệu Xung kích Cánh Bạc'' (Silver Wings Assault Badge), ''pháp sư trên không''
