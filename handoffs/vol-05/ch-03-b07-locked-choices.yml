    ''tước quân tịch'' (dishonorably discharged), ''tiếp tay và xúi giục vi phạm thuần
    phong mỹ tục'' (aiding and abetting public morality violations)."]'
- segment_id: YS-LN05/Text/part0018.html/p000259
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, phủ định & thuật ngữ: Tanya xưng ''tôi'', giữ mệnh đề
