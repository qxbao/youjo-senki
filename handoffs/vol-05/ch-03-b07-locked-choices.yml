    and duty), ''quyền tự quyết'' (discretion).", "Đại từ trần thuật theo DEC-P01-001:
    ''Nó'' / ''nó''."]'
- segment_id: YS-LN05/Text/part0018.html/p000233
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & thuật ngữ: ''Trung tá Tanya von Degurechaff'' (Colonel
