- segment_id: YS-LN05/Text/part0018.html/p000221
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, xưng hô & nhấn mạnh Markdown: Uger gọi Tanya là ''cô'';
    trần thuật gọi ''Trung tá Uger'' (Colonel Uger); chỉ bọc câu độc thoại nội tâm
