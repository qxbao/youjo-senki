    network)."]'
- segment_id: YS-LN05/Text/part0018.html/p000218
  kind: terminology_and_voice
  value: 'locked=["Đại từ & tình thái suy đoán: ''chúng tôi'', ''Ắt hẳn ... cực kỳ
    tiện dụng''."]'
- segment_id: YS-LN05/Text/part0018.html/p000219
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & tình thái suy đoán: ''Cơ quan tình báo'' (The intelligence
    agency), ''hẳn phải thèm muốn lắm''."]'
- segment_id: YS-LN05/Text/part0018.html/p000220
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, phủ định & thuật ngữ: Tanya xưng ''Tôi'' / ''tôi''; giữ
