- segment_id: YS-LN05/Text/part0018.html/p000222
  kind: terminology_and_voice
  value: locked=["Giữ dấu chấm lửng đầu câu thoại và câu hỏi đuôi mỉa mai về 'cái
    nhà ăn này' (this dining hall)."]
- segment_id: YS-LN05/Text/part0018.html/p000223
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, quân hàm & thuật ngữ: Uger xưng ''Tôi'', gọi ''Trung tá
    von Degurechaff'' (Colonel von Degurechaff); ''Bộ Tổng tham mưu'' (General Staff),
    ''sĩ quan tình báo ưu tú'' (superior intelligence officers)."]'
- segment_id: YS-LN05/Text/part0018.html/p000224
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật theo DEC-P01-001: chỉ Tanya bằng ''Nó'' / ''nó'',
