- segment_id: YS-LN05/Text/part0018.html/p000227
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & quân hàm: Uger xưng ''Tôi''; ''Tướng von Zettour'' (General
    von Zettour), quy chiếu bằng ''ông ấy''."]'
- segment_id: YS-LN05/Text/part0018.html/p000228
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & thuật ngữ: ''mấy vị sĩ quan Cục Quân vụ các anh'' (you
