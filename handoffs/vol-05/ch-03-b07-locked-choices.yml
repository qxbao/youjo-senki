- segment_id: YS-LN05/Text/part0018.html/p000225
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, quân hàm & xưng hô: ''Tanya'', ''Uger'', ''Trung tá
    von Lergen'' (Colonel von Lergen, sau khi sửa theo finding); Uger xưng ''tôi'',
    gọi Tanya và đơn vị của cô là ''cô'' / ''các cô''.", "Thuật ngữ: ''Kampfgruppe'',
