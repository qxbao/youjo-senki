    thế hàng nhái'' (pseudo–ersatz coffee)."]'
- segment_id: YS-LN05/Text/part0018.html/p000202
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, xưng hô & thuật ngữ: ''Trung tá Uger'' (Colonel Uger),
    ''tôi - cô''; ''Biển Bắc'' (Northern Sea), ''cơ quan tình báo liên hợp thuộc Bộ
