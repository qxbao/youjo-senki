    tiệc của Văn phòng Bộ Tổng tham mưu'' (General Staff Office’s banquet hall)."]'
- segment_id: YS-LN05/Text/part0018.html/p000179
  kind: terminology_and_voice
  value: 'locked=["Xưng hô thoại: Uger xưng ''tôi'', gọi Tanya là ''cô''."]'
- segment_id: YS-LN05/Text/part0018.html/p000180
  kind: terminology_and_voice
  value: 'locked=["Đại từ & xưng hô: trần thuật chỉ Tanya bằng ''Nó'' (DEC-P01-001);
    trong thoại Tanya xưng ''Tôi''.", "Quân hàm & tên riêng: ''Trung tá von Lergen''
    (Colonel von Lergen) sau khi sửa theo finding."]'
- segment_id: YS-LN05/Text/part0018.html/p000181
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''Họ'' / ''họ''; giữ dấu ngoặc kép mỉa mai quanh
    từ ''“đồ ăn”''.", "Thuật ngữ: ''nhà ăn'' (mess hall), ''Bộ Tổng tham mưu'' (General
    Staff)."]'
- segment_id: YS-LN05/Text/part0018.html/p000182
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: chỉ Tanya bằng ''nó'' và đại từ phản thân ''mình''
    theo DEC-P01-001.", "Thuật ngữ: ''phòng tuyến tiền tiêu xa nhất'' (forward-most
    line), ''sĩ quan ma pháp'' (magic officer), ''chế độ ăn giàu calo'' (high-calorie
    diet)."]'
- segment_id: YS-LN05/Text/part0018.html/p000183
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & giả định trái thực tế: ''sảnh yến tiệc'' (banquet hall);
    giữ cấu trúc điều kiện giả định ''Nếu chúng cũng có chất lượng tương tự như đồ
    ăn ở sảnh yến tiệc, hẳn sẽ rất khó tránh khỏi việc đánh mất ý chí chiến đấu''."]'
- segment_id: YS-LN05/Text/part0018.html/p000184
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & đại từ thoại: ''chúng ta'', ''cô''.", "Thuật ngữ: ''nhiệm
    vụ tìm và diệt'' (search-and-destroy mission)."]'
- segment_id: YS-LN05/Text/part0018.html/p000185
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật & phủ định: chỉ Uger bằng ''anh ta'', giữ đối
    lập ''nhưng thực chất anh ta chẳng hề cười''."]'
- segment_id: YS-LN05/Text/part0018.html/p000186
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown: bọc toàn bộ câu độc thoại nội tâm ''*Ồ, ra
    vậy.*'' trong ''*...*'' theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0018.html/p000187
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & đại từ: giữ cấu trúc tách chữ thường cho từ
    ''thế'' giữa hai cụm bọc ''*...*'' khớp với thẻ em trong nguồn (DEC-P01-002);
    đại từ nội tâm ''mình'' (DEC-P01-001) và ''anh ta'' (Uger).", "Quân hàm & tên
    riêng: ''Trung tá von Lergen'' (Colonel von Lergen) sau khi sửa theo finding."]'
- segment_id: YS-LN05/Text/part0018.html/p000188
  kind: terminology_and_voice
  value: 'locked=["Đại từ thoại & thuật ngữ: Tanya dùng ''chúng tôi'' (đơn vị của
    mình); ''đơn vị rảnh rỗi'' (free unit), ''thị sát tại chỗ'' (on-the-spot inspection),
    ''tàu dân sự'' (civilian ships)."]'
- segment_id: YS-LN05/Text/part0018.html/p000189
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & thuật ngữ: Uger gọi đơn vị/cá nhân Tanya là ''các cô''
    / ''cô'', xưng ''chúng tôi''; ''Cục Quân vụ'' (Service Corps), ''tiền án'' (record),
    ''các đồng nghiệp bên pháp chế'' (colleagues in legal)."]'
- segment_id: YS-LN05/Text/part0018.html/p000190
  kind: terminology_and_voice
  value: 'locked=["Điểm nhìn kép & đại từ: phân biệt ngôi thứ nhất nội tâm ''Mình''
    / ''mình'' với tên riêng trần thuật ''Tanya'' trong cùng đoạn theo DEC-P01-001;
    giữ dấu ngoặc kép quanh ''“tiền án”''."]'
- segment_id: YS-LN05/Text/part0018.html/p000191
  kind: terminology_and_voice
  value: 'locked=["Địa danh & thuật ngữ: ''Biển Bắc'' (Northern Sea), ''Tập kích tuyến
    thương mại'' (Commerce raiding)."]'
- segment_id: YS-LN05/Text/part0018.html/p000192
  kind: terminology_and_voice
  value: 'locked=["Đại từ thoại: ''chúng ta'' (phía Đế quốc); giữ câu hỏi phỏng đoán
    pha sắc thái mỉa mai."]'
- segment_id: YS-LN05/Text/part0018.html/p000193
  kind: terminology_and_voice
  value: 'locked=["Địa danh & thuật ngữ: ''Biển Bắc'' (Northern Sea), ''thị sát tại
    chỗ'' (on-the-spot inspection), ''Hợp chúng quốc'' (Unified States)."]'
- segment_id: YS-LN05/Text/part0018.html/p000194
  kind: terminology_and_voice
  value: 'locked=["Phủ định & thuật ngữ: ''chẳng có lý do gì'', ''con tàu dân sự''
    (civilian ship)."]'
- segment_id: YS-LN05/Text/part0018.html/p000195
  kind: terminology_and_voice
  value: 'locked=["Phủ định, tình thái & thuật ngữ: ''Không, lẽ ra chẳng có lý do
