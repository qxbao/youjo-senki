- segment_id: YS-LN05/Text/part0018.html/p000196
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, quân hàm & phủ định kép: Uger xưng ''tôi'', dùng ''chúng
    ta'', gọi ''Trung tá von Degurechaff'' (Colonel von Degurechaff); giữ phủ định
    kép ''tôi cũng chẳng thể bảo rằng chúng ta không nên thực hiện việc này tới cùng''."]'
- segment_id: YS-LN05/Text/part0018.html/p000197
  kind: terminology_and_voice
  value: 'locked=["Tên nhân vật trần thuật: ''Tanya''; giữ cụm ''nụ cười gượng gạo''
    (wry smile)."]'
- segment_id: YS-LN05/Text/part0018.html/p000198
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya đáp lời Uger bằng ''tôi - anh'', giữ từ ''Không''
    ở đầu câu để phủ định câu hỏi ''Tôi nói có sai không?'' của Uger."]'
- segment_id: YS-LN05/Text/part0018.html/p000199
  kind: terminology_and_voice
  value: 'locked=["Tên cơ quan & thuật ngữ: ''Bộ Tổng tham mưu'' (General Staff),
    ''Bộ Tư lệnh Lục quân'' (Army Command), ''Quân đội Liên bang'' (Federation Army),
    ''Bộ Tư lệnh Hải quân'' (Navy Command), ''Bộ Ngoại giao'' (Foreign Office), ''những
    người trực tiếp làm việc ngoài thực địa'' (the ones in the field).", "Tình thái
    suy đoán: ''hẳn Bộ Ngoại giao đã can thiệp'' (the Foreign Office must have stepped
    in)."]'
- segment_id: YS-LN05/Text/part0018.html/p000200
  kind: terminology_and_voice
  value: 'locked=["Đại từ ngôi thứ hai khái quát: ''bạn''; giữ nhịp câu danh từ ngắn
    thể hiện sự ngán ngẩm."]'
- segment_id: YS-LN05/Text/part0018.html/p000201
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown, tên riêng & thuật ngữ: chỉ bọc ''*Thiệt tình.*''
