    phương'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000196
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Tướng von Zettour'', ''pronouns'': ''mình
    (độc thoại nội tâm của Tanya theo DEC-P01-001)'', ''terminology'': ''Cục Quân
    vụ / huy động nguồn lực trong nước cho chiến tranh'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000197
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''nhu cầu dân sự / Đế quốc / nguồn lực hữu hạn
    / mặt trận phía đông / các khu vực dân sự'', ''modality'': ''có lẽ khó lòng hình
    dung nổi / ắt hẳn là khủng khiếp lắm'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000198
  kind: terminology_and_voice
  value: 'locked={''negation'': ''Không, thậm chí còn chẳng thể nào tưởng tượng nổi.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000199
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''Chỉ cần đọc một bài báo lố bịch trong số này thôi
    là đã thấy rõ mồn một rồi.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000200
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (độc thoại nội tâm ngôi thứ nhất số nhiều
    của Tanya)'', ''terminology_and_logic'': ''bảo vệ bí mật quân sự / các thông lệ
    tốt nhất về truyền thông và truyền đạt tin tức tình báo'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000201
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Chúng ta (độc thoại nội tâm ngôi thứ nhất số nhiều
    của Tanya)'', ''terminology'': ''một tập đoàn làm ăn yếu kém / vòng luẩn quẩn
    kinh điển của sự tàn bạo và những sai lầm cảm tính'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000202
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''Tôi (Tanya
    xưng với Trung tá Uger) / Chúng tôi (đơn vị của Tanya)'', ''terminology'': ''chấp
    hành / thực hiện các nhiệm vụ tác chiến'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000203
  kind: terminology_and_voice
  value: 'locked={''ranks'': ''Trung tá (Uger gọi Tanya)'', ''pronouns'': ''tôi -
    cô (Uger nói với Tanya)'', ''terminology'': ''khoản tiếp tế bổ sung / bạn đồng
    môn cũ / duy trì tuyến tiếp tế'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000204
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''anh ta (quy chiếu Uger)'',
    ''terminology'': ''sĩ quan Bộ Tổng tham mưu cấp trung phụ trách mảng tiếp vận
    / nỗ lực chiến tranh'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000205
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''anh ta (quy chiếu Uger)'', ''question_and_meaning'':
    ''Vậy mà điều tối đa anh ta có thể hứa hẹn chỉ là giữ cho các tuyến tiếp tế thông
    suốt thôi ư?!'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000206
  kind: terminology_and_voice
  value: 'locked={''question'': ''“Tình hình thực sự đã tồi tệ đến mức đó rồi sao?”'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000207
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Tôi (Uger xưng với Tanya)'', ''meaning'': ''“Thực
    sự đến mức đó rồi đấy. Tôi xin lỗi.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000208
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình (độc thoại nội tâm của Tanya theo DEC-P01-001)'',
    ''meaning'': ''Mình chỉ muốn ngước nhìn trần khoang tàu mà rên rỉ. Tình hình đã
    đến mức nguy ngập rồi.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000209
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''một trung tá thuộc Bộ Tổng tham mưu / Kampfgruppe
    Salamander / Bộ Tổng tham mưu'', ''question_and_terminology'': ''mảng đường sắt
    và hậu cần / vật tư tiếp tế bổ sung / một đơn vị đơn lẻ đang triển khai theo mệnh
    lệnh trực tiếp từ Bộ Tổng tham mưu sao?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000210
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Anh ta (quy chiếu Uger)'', ''question'': ''Anh ta
    chỉ có thể hứa hẹn là sẽ có chút ít đồ tiếp tế thôi ư?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000211
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya / Kampfgruppe'', ''terminology'': ''lữ đoàn /
    tập đoàn quân / Kampfgruppe'', ''negation'': ''Lời phản kháng dâng lên tới cổ
    họng Tanya không hề sai chút nào.'', ''emphasis'': ''*Đây đâu phải một lữ đoàn
    hay một tập đoàn quân, mà là một Kampfgruppe được chắp vá từ đủ thứ lực lượng
    thập cẩm!* (bọc đúng câu cảm thán in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000212
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''terminology_and_negation'':
    ''Chẳng điều gì khác có thể truyền tải chính xác hơn thế nỗi lòng thực sự của
    những người đang đóng ở hậu phương.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000213
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Tướng von Zettour / Tanya'', ''pronouns'':
    ''ông ấy (quy chiếu Tướng von Zettour)'', ''terminology_and_negation'': ''phản
    đối việc mở rộng mặt trận bằng mọi giá / không tài nào chuyển hướng thêm bất kỳ
    nguồn lực quốc gia nào cho mục đích quân sự được nữa'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000214
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Tướng von Rudersdorf'', ''pronouns'': ''cô
    (trần thuật ngôi thứ ba về Tanya) / ông ấy (quy chiếu Tướng von Rudersdorf)'',
    ''terminology_and_negation'': ''một giải pháp dứt điểm nhanh chóng / Các vị chỉ
    huy không hề sai khi nói rằng chiến dịch ở mặt trận phía đông—nơi vô số nguồn
    lực đang bị vắt kiệt—cần phải được khép lại càng sớm càng tốt.'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000215
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình - bạn (chủ thể khái quát trong lập luận nội
    tâm) / họ (Bộ Tư lệnh Tối cao) / chúng ta'', ''terminology'': ''Bộ Tư lệnh Tối
    cao / Cục Tác chiến'', ''emphasis'': ''*Nguồn lực là hữu hạn.* / *chúng ta phải
    ngừng sử dụng chúng* / *những nguồn lực cần thiết đã cạn kiệt rồi* (bọc đúng ba
    phần chữ nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000216
  kind: terminology_and_voice
  value: 'locked={''ranks'': ''Cả hai vị tướng'', ''meaning'': ''Cả hai vị tướng đều
    có lý, và chính vì thế mà vấn đề này mới gây bức bối đến vậy.'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000217
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (tự thuật ngôi thứ nhất của Tanya theo DEC-P01-001)'',
    ''meaning'': ''“…Đúng là một bãi lầy,” mình bất giác lẩm bẩm. Cơn thôi thúc muốn
    ôm đầu gào thét bỗng chốc xâm chiếm lấy mình.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000218
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''mình (Tanya)'',
    ''emphasis'': ''*Sao cơ sự lại ra nông nỗi này?* (bọc đúng câu hỏi nội tâm in
    nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000219
  kind: terminology_and_voice
  value: 'locked={''header'': ''NGÀY 30 THÁNG 8, NĂM THỐNG NHẤT 1926, MŨI LỒI TRÊN
    MẶT TRẬN PHÍA ĐÔNG'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000220
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''Và thế là…'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000221
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''meaning'': ''Nếu chúng ta định kể
    lại câu chuyện này theo một trình tự ít nhiều có tính logic…'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000222
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Kampfgruppe Salamander / Trung tá Tanya von
    Degurechaff'', ''terminology_and_negation'': ''triển khai an toàn tới một mũi
    lồi nhỏ bé mà ngoài các sử gia ra thì sẽ chẳng bao giờ có ai thèm đoái hoài tới.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000223
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''năng lực tác chiến vượt quy chuẩn / xe thiết
    giáp / pháo tự hành / đơn vị pháp sư trên không / Kampfgruppe'', ''emphasis'':
    ''none''}'
