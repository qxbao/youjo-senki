- segment_id: YS-LN05/Text/part0010.html/p000191
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''mình - anh ta (quy chiếu Uger
    trong trần thuật ngôi thứ ba)'', ''meaning'': ''Lẩm bẩm rằng mình đã nói quá nhiều,
    anh ta quay mặt ra phía cửa sổ rồi ngậm chặt miệng. Tất nhiên, Tanya hiểu cảm
    giác của anh ta.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000192
  kind: terminology_and_voice
  value: 'locked={''meaning_and_emphasis'': ''*Ra vậy, dư luận sao.* (bọc đúng toàn
    bộ câu nội tâm in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000193
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình (độc thoại nội tâm của Tanya theo DEC-P01-001)'',
    ''terminology'': ''tờ báo thời chiến / Tâm lý quốc dân'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000194
  kind: terminology_and_voice
  value: 'locked={''negation_and_logic'': ''Chẳng biết kẻ nào đã gieo những hạt mầm
    ấy, nhưng vì chúng không được thu hoạch nên kết cục hiển nhiên là thế này đây.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000195
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''Mình (độc
