    giả-NOE / tầm cực xa / bắn hạ chúng từ một cự ly đáng kể'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000302
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''“Tuyệt vời. Xác nhận toàn bộ mối đe dọa đã bị bắn
    hạ.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000303
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm tự thuật của Tanya theo DEC-P01-001)
    / họ'', ''negation_and_meaning'': ''Những tân binh mà ban đầu mình thấy chẳng
    mấy được việc lại nhanh chóng tích lũy kinh nghiệm trên chiến trường, và năng
    lực của họ đơm hoa kết trái.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000304
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001) / họ'',
    ''terminology_and_meaning'': ''“có tính sản xuất” / ngả mũ trước thái độ nghiêm
    túc của họ trong việc trau dồi chuyên môn'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000305
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi - chúng ta (Tanya nói với Weiss)'', ''terminology_and_negation'':
    ''bốn chiến công phối hợp / mặt trận phía đông / hệ thống Pháp sư Định danh hiện
    tại sẽ chẳng còn lại gì mất / sản xuất hàng loạt Pháp sư Định danh'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000306
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi (Weiss đáp lời Tanya)'', ''terminology_and_negation'':
    ''tôi chẳng nghĩ biệt danh Bạch Ngân sẽ có ngày bị lu mờ đâu!'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000307
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''“Hừm, không biết nữa.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000308
  kind: terminology_and_voice
  value: 'locked={''names'': ''Weiss'', ''pronouns'': ''Mình (nội tâm của Tanya theo
    DEC-P01-001) / anh ta'', ''negation_and_modality'': ''Mình không thể nói điều
    này với Weiss được, nhưng những lời nhận xét của anh ta đều mặc định rằng Đế quốc
    sẽ thắng cuộc chiến này. Nhìn từ góc độ của anh ta thì có lẽ điều đó cũng đúng.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000309
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''của chính mình (phản thân)
    / cô (trần thuật ngôi thứ ba về Tanya)'', ''modality_and_meaning'': ''Có thể những
    người khác vẫn tin vào chiến thắng của Đế quốc, ôm ấp niềm tin ấy như một thiếu
    nữ ngây thơ đang yêu, nhưng cô thì khác.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000310
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''modality_and_time'': ''Một trăm hay một
    ngàn năm trước, hoặc một trăm hay một ngàn năm sau kể từ bây giờ, bầu trời có
    lẽ đã và sẽ luôn như thế.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000311
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Một hằng số phổ quát của tự nhiên. Cứ mãi giữ
    nguyên như vậy.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000312
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình (nội tâm của Tanya theo DEC-P01-001)'', ''meaning'':
    ''Mình ghen tị với bầu trời biết bao.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000313
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''cô (trần thuật ngôi thứ ba
    về Tanya)'', ''terminology'': ''Đế quốc / mặt trận phía đông'', ''question_and_emphasis'':
    ''*Liệu Đế quốc có còn tồn tại sau khi giao tranh ở mặt trận phía đông kết thúc
    hay không?* (bọc đúng câu hỏi nội tâm in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000314
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình - mình (nội tâm của Tanya theo DEC-P01-001)'',
    ''negation_and_meaning'': ''Mình không muốn tự thương hại bản thân đâu, nhưng
    hoàn cảnh của mình mới bi đát làm sao.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000315
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001)'', ''terminology'':
    ''những nỗi sầu muộn hiện sinh'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000316
  kind: terminology_and_voice
  value: 'locked={''terminology_and_directives'': ''Salamander 01 gọi toàn bộ các
    đơn vị / Hãy bắt đầu thu hồi thương binh của ta và truy tìm quân địch để bắt làm
    tù binh.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000317
  kind: terminology_and_voice
  value: 'locked={''negation_and_meaning'': ''Công việc của quân đội đâu có kết thúc
    chỉ vì đã đẩy lùi được đợt tấn công của địch. Nó giống một bữa tiệc hơn, ở chỗ
    khâu dọn dẹp hậu trường mới là phần vất vả nhất.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000318
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''bạn (ngôi thứ hai giả định khái quát)'', ''condition_and_negation'':
    ''Nếu không thể cảm thấy may mắn vì vẫn còn phải lo chuyện dọn dẹp, bạn sẽ chẳng
    thể bước tiếp được. Hối tiếc và chiêm nghiệm là đặc quyền của người sống. Nếu
    chết đi, sẽ chẳng còn bất cứ thứ gì nữa.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000319
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Tôi (Tanya phát lệnh qua vô tuyến)'', ''terminology_and_directives'':
    ''Đại đội 2, trực chiến chờ phản ứng nhanh. Đại đội 3 và Đại đội 4, tiếp tục tuần
    tra tuyến cảnh giới. Tôi giao quyền chỉ huy tuyến cảnh giới cho 02.'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000320
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi (02 / Thiếu tá Weiss nhận lệnh)'', ''terminology'':
    ''“02, nghe rõ. Cứ giao cho tôi.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000321
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''“Tốt lắm.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000322
  kind: terminology_and_voice
  value: 'locked={''names'': ''Weiss'', ''meaning'': ''Nào, ngay cả sau khi đã ủy
    thác một số công việc cần thiết cho Weiss, vẫn còn quá nhiều giấy tờ cần phê duyệt
    và đủ thứ quyết định phải đưa ra.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000323
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình - chúng ta (nội tâm của Tanya theo DEC-P01-001)
    / Họ (bên Nhân sự)'', ''terminology_and_negation'': ''gửi thư chia buồn về hậu
    phương / gia quyến người đã khuất / bên Nhân sự / đánh giá thành tích / không
    thể làm qua quýt cho xong chuyện được / thư thông báo về các trường hợp bị thương'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000324
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''bạn (ngôi thứ hai khái quát) / họ (cấp dưới)'',
    ''terminology'': ''vốn con người / khối lượng công việc / tử trận hay chết vì
    bệnh tật'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000325
  kind: terminology_and_voice
  value: 'locked={''terminology_and_negation'': ''nguyên lý thị trường / chắc chẳng
    có mấy nghề nghiệp nào yêu chuộng hòa bình hơn nghề làm lính'', ''emphasis'':
