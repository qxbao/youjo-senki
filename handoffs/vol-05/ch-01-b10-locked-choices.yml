    ''emphasis'': ''*Aaaa, chết tiệt thật* (bọc đúng cụm chửi thề nội tâm in nghiêng
    đầu đoạn theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000327
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình - mình (nội tâm của Tanya theo DEC-P01-001)'',
    ''terminology'': ''đạo đức nghề nghiệp / hạt cà phê'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000328
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình - chúng ta (nội tâm của Tanya theo DEC-P01-001)'',
    ''terminology'': ''tăng theo cấp số nhân / nguồn cung hạt cà phê / tình hình tiếp
    tế tổng thể'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000329
  kind: terminology_and_voice
  value: 'locked={''terminology_and_modality'': ''Bị cắt đứt nguồn tiếp tế sẽ là chuyện
    vô cùng kinh khủng.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000330
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''Cô (trần thuật ngôi thứ ba
    về Tanya) / họ (đơn vị của Tanya)'', ''terminology'': ''tuyến kết nối của họ với
