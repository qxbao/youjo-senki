    tiếp tế hiện có / những đợt giao hạt cà phê định kỳ'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000332
  kind: terminology_and_voice
  value: 'locked={''terminology_and_question'': ''caffeine / mặt hàng xa xỉ / tiền
    tuyến / nếu Đế quốc vẫn có thể cung cấp những mặt hàng xa xỉ như thế ra tiền tuyến,
    thì nó vẫn còn chút sức chiến đấu đấy chứ?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000333
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''lịch sử của cà phê / mặt hàng xa xỉ'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000334
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''cây trồng thương mại / vùng nguyên sản / mạng
    lưới hậu cần phi thường cho phép phân phối ổn định'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000335
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình (nội tâm của Tanya theo DEC-P01-001)'', ''meaning'':
    ''Mình cho là điều đó rất có ý nghĩa…'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000336
  kind: terminology_and_voice
  value: 'locked={''names'': ''Uger'', ''pronouns'': ''anh ta (Uger)'', ''condition_and_meaning'':
    ''Việc Uger nói anh ta có thể duy trì khâu phân phối chứng tỏ sự ưu việt của hệ
    thống này. Nếu bộ máy tổ chức vẫn còn trụ vững, thì Đế quốc vẫn có cơ hội giành
    chiến thắng.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000337
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''cô (trần thuật ngôi thứ ba về Tanya)'', ''meaning'':
    ''Trong lúc cô miệt mài làm việc và suy ngẫm những điều đó, mặt trời đã lặn.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000338
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (Tanya lầm bầm một mình theo DEC-P01-001)'',
    ''terminology_and_negation'': ''công việc quản lý / lao động theo quyền tự quyết,
    nhưng mình thực sự chẳng…'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000339
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''cô (trần thuật ngôi thứ ba
    về Tanya)'', ''emphasis'': ''*có được mấy quyền tự quyết* (bọc đúng cụm từ in
    nghiêng theo DEC-P01-002, khớp với câu bỏ lửng ở p000338)''}'
- segment_id: YS-LN05/Text/part0010.html/p000340
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001)'', ''meaning'':
    ''…Thành thật mà nói, chuyện này chỉ khiến mình muốn phàn nàn.'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000341
  kind: terminology_and_voice
  value: 'locked={''terminology_and_meaning'': ''Quân đội Liên bang thực sự quá đỗi
