    ''gần như là điều không thể tránh khỏi / đánh mất phần lớn sức chiến đấu thực
    tế của mình'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000129
  kind: terminology_and_voice
  value: 'locked={''negation'': ''một lực lượng đang tái tổ chức thì không thể tiến
