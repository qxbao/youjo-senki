    dịch quân sự vào cuối tháng Mười là cực kỳ thấp'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000135
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta / quân ta (trong lời thoại của Uger)'',
