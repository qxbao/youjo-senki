    trong hai lựa chọn tồi tệ / Có lẽ nếu chúng ta nắm được thông tin hoàn hảo thì
    mọi chuyện đã khác, nhưng chúng ta không thể biết hết mọi thứ'', ''emphasis'':
    ''*Đó chính là căn nguyên của vấn đề* (chỉ bọc mệnh đề suy nghĩ trực tiếp trước
    dấu phẩy theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000150
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (trong lời thoại)'', ''modality_and_logic'':
    ''Xét việc kẻ địch của chúng ta xoay xở chậm chạp đến mức nào, kế hoạch mang tính
    tấn công quyết liệt có lẽ sẽ có cơ hội thành công cao hơn.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000151
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''condition_and_logic'':
