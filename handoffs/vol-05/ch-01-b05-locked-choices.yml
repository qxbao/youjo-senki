    gian ân hạn'', ''condition_and_logic'': ''nếu chúng ta dừng lại để tái tổ chức
    chiến tuyến của mình, Quân đội Liên bang cũng sẽ có được một khoảng thời gian
    ân hạn / dẫu không có gì khác thì thời gian vẫn sẽ được ban phát đồng đều cho
    tất cả các bên'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000131
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''condition_and_modality'': ''Nếu chuyện
    đó xảy ra, chắc chắn kẻ địch của chúng ta cũng sẽ tái tổ chức lực lượng / bài
    toán tiến thoái lưỡng nan không có hồi kết'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000132
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Tướng von Rudersdorf / Tanya'', ''pronouns'':
    ''anh ta (quy chiếu Uger) / cô (quy chiếu Tanya trong trần thuật ngôi thứ ba)
    / Họ (quy chiếu cấp trên và Cục Tác chiến)'', ''terminology'': ''Cục Tác chiến
    / bao vây và tiêu diệt hoàn toàn / đạo quân dã chiến của Liên bang / đợt tiến
    công / cấp trên'', ''negation_and_concession'': ''ngay cả khi đợt tiến công này
    có vẻ bất khả thi / dù cô chẳng hề muốn hiểu'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000133
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''anh (Tanya gọi Trung tá Uger)'', ''question'': ''“…Ý
    anh là vì mùa đông sắp đến sao?” (giữ dấu chấm lửng mở đầu)'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000134
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (độc thoại nội tâm ngôi thứ nhất số nhiều
    của Tanya)'', ''time_and_modality'': ''tháng Tám / cuối tháng Tám / tháng Chín
