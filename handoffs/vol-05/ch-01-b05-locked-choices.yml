- segment_id: YS-LN05/Text/part0010.html/p000136
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''negation'': ''Việc Tanya không cau mày ngay
    khoảnh khắc nghe thấy câu này, chỉ riêng điều đó thôi đã là một kỳ tích về khả
    năng tự chủ rồi'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000137
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''cô (trần thuật gián tiếp tự do ngôi thứ ba về Tanya)'',
    ''negation_and_condition'': "Một tháng thì có thể đảm bảo, chứ hai tháng thì không
    / Giá mà cô có thể chỉ trích bằng một lời phê phán như thế; hẳn sẽ nhẹ nhõm như
    vừa trút được cả một gánh nặng ngàn cân (sửa từ ''buông lời chỉ trích một quyết
    định đáng bị chỉ trích như thế'')", ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000138
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''nền kinh tế thị trường / chiến trường'', ''negation_and_condition'':
