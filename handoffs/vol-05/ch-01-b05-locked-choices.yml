- segment_id: YS-LN05/Text/part0010.html/p000143
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (trong lời thoại của Uger) / Anh ta (quy
    chiếu Uger trong phần dẫn thoại) / Các người - chúng ta (trong câu trích dẫn thái
    độ của Cục Quân vụ)'', ''terminology'': ''Cục Tác chiến / trận đánh bao vây và
