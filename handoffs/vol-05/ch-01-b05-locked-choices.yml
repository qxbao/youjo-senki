    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000139
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (trong lời thoại của Tanya)'', ''terminology'':
    ''Bộ Tổng tham mưu'', ''question'': ''“Vậy Bộ Tổng tham mưu cho rằng chúng ta
    nên làm gì?”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000140
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''“Các ý kiến đang bị chia rẽ.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000141
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (độc thoại nội tâm của Tanya theo DEC-P01-001)'',
    ''modality_and_condition'': ''Chắc sẽ bất lịch sự lắm nếu mình gật đầu rồi bảo
    chuyện đó là đương nhiên thôi'', ''emphasis'': ''*Chắc sẽ bất lịch sự lắm nếu
    mình gật đầu rồi bảo chuyện đó là đương nhiên thôi.* (bọc chữ nghiêng toàn câu
    theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000142
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''cô (quy chiếu Tanya trong
    trần thuật ngôi thứ ba)'', ''terminology'': ''Bộ Tổng tham mưu'', ''negation_and_metaphor'':
