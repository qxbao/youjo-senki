    ''điều mà chúng ta không dám chắc / Chừng nào chưa có gì đảm bảo rằng chúng ta
    sẽ có hai tháng để tiến hành chiến dịch, Cục Quân vụ dường như muốn dùng khoảng
    thời gian còn lại để chuẩn bị cho mùa đông trước khi tuyết rơi khiến công việc
    đó trở nên khó khăn'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000144
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''anh (Tanya
    gọi Trung tá Uger)'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000145
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Uger / Tanya'', ''pronouns'': ''anh ta (quy
    chiếu Uger trong trần thuật ngôi thứ ba)'', ''modality'': ''có lẽ vì chính anh
    ta cũng ý thức được điều đó'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000146
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (trong lời thoại của Tanya)'', ''terminology'':
    ''tái tổ chức lực lượng / chi viện cho tiền tuyến / cuộc chiến kéo dài / các tuyến
    tiếp vận / Cục Quân vụ'', ''condition_and_modality'': ''nếu chúng ta cho kẻ địch
    thời gian tái tổ chức lực lượng, rốt cuộc chúng ta có thể sẽ phải chi viện cho
    tiền tuyến trong một cuộc chiến kéo dài với các tuyến tiếp vận đã suy yếu'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000147
  kind: terminology_and_voice
  value: 'locked={''logic_and_concession'': ''Về mặt lý thuyết thì đúng là vậy. Nhưng
    dù có đau đầu đến mấy thì lập luận của cả hai phía trong cuộc tranh cãi này đều
    có cơ sở vững chắc.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000148
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Anh ta (quy chiếu Uger)'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000149
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''người ta (chủ ngữ khái quát)
