choices:
- segment_id: YS-LN05/Text/part0016.html/p000388
  kind: terminology_and_voice
  value: choices=["Khóa đại từ trần thuật 'ông' cho Tướng Habergram và địa danh 'Nội
    hải' ('Inner Sea').", "Giữ phủ định 'chẳng thể phàn nàn gì được' và mệnh đề tương
    phản với hoàn cảnh thời chiến."]
- segment_id: YS-LN05/Text/part0016.html/p000389
  kind: terminology_and_voice
  value: choices=["Khóa 'đồ quân nhu tẻ nhạt' ('dull military-issue items') và hình
    ảnh 'thế giới nhuốm sắc màu be'."]
- segment_id: YS-LN05/Text/part0016.html/p000390
  kind: terminology_and_voice
  value: choices=["Khóa 'thông lệ trà chiều lúc ba giờ', 'dinh thự thủ tướng', 'các
    trận địa pháo phòng không' và 'hầm trú ẩn'.", "Giữ đúng phạm vi nhấn mạnh Markdown
    '*ngay tại vị trí trực chiến*' theo DEC-P01-002."]
- segment_id: YS-LN05/Text/part0016.html/p000391
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc so sánh với tôn chỉ vốn có của việc thưởng trà và
    phủ định tuyệt đối 'chẳng còn gì đáng buồn hơn thế'."]
- segment_id: YS-LN05/Text/part0016.html/p000392
  kind: terminology_and_voice
  value: choices=["Khóa lời dẫn đường 'Xin mời đi lối này', địa điểm 'dinh thủ tướng'
    và chi tiết những chiếc xô phòng hỏa hoạn."]
- segment_id: YS-LN05/Text/part0016.html/p000393
  kind: terminology_and_voice
  value: choices=["Khóa đại từ 'Ông' trong lời chào của Thủ tướng Churbull dành cho
    Habergram."]
- segment_id: YS-LN05/Text/part0016.html/p000394
  kind: terminology_and_voice
  value: choices=["Khóa 'Vị thủ tướng', 'người quản gia', 'Habergram' và 'Thủ tướng
    Churbull'.", "Giữ tình thái giả định quá khứ phủ định 'Trước chiến tranh, Habergram
    chưa bao giờ dám mơ rằng mình sẽ có dịp ngồi chung bàn với Thủ tướng Churbull'."]
- segment_id: YS-LN05/Text/part0016.html/p000395
  kind: terminology_and_voice
  value: choices=["Giữ quan hệ nhượng bộ - đối lập ('Dẫu rất vinh dự... lại chẳng
    mang đến cho ông chút niềm vui nào') và nguyên nhân tổ quốc đang lâm vào cảnh
    khốn đốn."]
- segment_id: YS-LN05/Text/part0016.html/p000396
  kind: terminology_and_voice
  value: choices=["Khóa 'Đội ngũ nhân viên phục vụ' và tình thái ước đoán độ tuổi
    'Ngay cả người trẻ nhất chắc cũng phải ngoài năm mươi'."]
- segment_id: YS-LN05/Text/part0016.html/p000397
  kind: terminology_and_voice
  value: choices=['Giữ quan hệ nhân quả về việc quân đội đã vét gần hết thanh niên
    trai tráng và tâm trạng chạnh lòng u uẩn của Habergram trước bước đi của thời
    gian.']
- segment_id: YS-LN05/Text/part0016.html/p000398
  kind: terminology_and_voice
  value: choices=['Giữ sự tương phản giữa bộ đồng phục chỉnh tề hoàn hảo như xưa của
    những người mang bộ đồ trà với cảm giác trĩu nặng thực tại.']
- segment_id: YS-LN05/Text/part0016.html/p000399
  kind: terminology_and_voice
  value: choices=["Giữ lời rào đón lấy lý do thời chiến và đại từ 'chúng ta'."]
- segment_id: YS-LN05/Text/part0016.html/p000400
  kind: terminology_and_voice
  value: choices=['Giữ bước ngoặt nhận thức từ chỗ suýt tin theo nghĩa đen sang sự
    kinh ngạc không tin vào mắt mình của Habergram.']
- segment_id: YS-LN05/Text/part0016.html/p000401
  kind: terminology_and_voice
  value: choices=['Giữ miêu tả ánh bạc được đánh bóng đẹp khác thường.']
- segment_id: YS-LN05/Text/part0016.html/p000402
  kind: terminology_and_voice
  value: choices=["Giữ câu hỏi tu từ về việc đánh bóng đồ bạc và tâm thế phân vân
    'chẳng biết mình nên thán phục hay ngán ngẩm nữa' trong bối cảnh khan hiếm nhân
    công."]
- segment_id: YS-LN05/Text/part0016.html/p000403
  kind: terminology_and_voice
  value: choices=['Giữ đúng phạm vi nhấn mạnh Markdown cho toàn bộ hai câu hỏi độc
    thoại nội tâm của Habergram theo DEC-P01-002.', "Khóa đại từ 'ông ta' quy chiếu
    Thủ tướng Churbull trong suy nghĩ của Habergram."]
- segment_id: YS-LN05/Text/part0016.html/p000404
  kind: terminology_and_voice
  value: choices=["Khóa đại từ tự xưng 'tôi' của Churbull và cách gọi 'Quản gia của
    tôi'."]
- segment_id: YS-LN05/Text/part0016.html/p000405
  kind: terminology_and_voice
  value: choices=["Khóa 'hoàn cảnh phân phối thời chiến' và sắc thái lịch sự 'tôi
    xin nói rằng... đấy ạ' của Habergram với Thủ tướng."]
- segment_id: YS-LN05/Text/part0016.html/p000406
  kind: terminology_and_voice
  value: choices=["Khóa 'trà Assam' ('Assam tea') và 'những cuộc tập kích tuyến thương
    mại' ('commerce raids')."]
- segment_id: YS-LN05/Text/part0016.html/p000407
  kind: terminology_and_voice
  value: choices=["Giữ nét nghĩa 'những thứ đang vào đúng mùa ngon nhất' ('what is
    in its quality season') và phủ định 'chẳng lấy làm vui vẻ gì' khi buộc phải dùng
    đồ thay thế."]
- segment_id: YS-LN05/Text/part0016.html/p000408
  kind: terminology_and_voice
  value: choices=["Khóa 'Khối Thịnh vượng chung' và đại từ 'ông ta' chỉ Thủ tướng
    Churbull dưới điểm nhìn đánh giá của Habergram."]
- segment_id: YS-LN05/Text/part0016.html/p000409
  kind: terminology_and_voice
  value: choices=["Khóa 'các sản phẩm thay thế' ('ersatz products'), 'Vị thủ tướng'
    và 'Tướng Habergram'.", "Giữ cấu trúc phủ định kép 'không thể phủ nhận' và câu
    nói đùa 'Không có trà thì chẳng thể đánh đấm gì được'."]
- segment_id: YS-LN05/Text/part0016.html/p000410
  kind: terminology_and_voice
  value: choices=["Khóa 'các sĩ quan tình báo' ('intelligence officers') và 'lục địa
    phía nam' ('the southern continent').", "Giữ tình thái nghe truyền lại 'nghe đâu'
    ('apparently') về việc vẫn xoay xở kiếm được trà giữa sa mạc."]
- segment_id: YS-LN05/Text/part0016.html/p000411
  kind: terminology_and_voice
  value: choices=["Giữ tình thái phỏng đoán hài hước của cấp trên ('Biết đâu họ vẫn
    đủ tài cán để hoàn thành nhiệm vụ ngay cả khi ông bắt họ làm việc vất vả thêm
    một chút')."]
- segment_id: YS-LN05/Text/part0016.html/p000412
  kind: terminology_and_voice
  value: choices=["Khóa cặp đại từ đối thoại 'tôi - ông' (và 'chúng ta' bao gộp),
    cùng tên cơ quan 'Ủy ban Quốc phòng Khối Thịnh vượng chung' ('Committee of Commonwealth
    Defense')."]
- segment_id: YS-LN05/Text/part0016.html/p000413
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*À phải rồi.*' cho cảm thán
    đầu đoạn theo DEC-P01-002."]
- segment_id: YS-LN05/Text/part0016.html/p000414
  kind: terminology_and_voice
  value: choices=["Khóa 'người phụ trách ngành Tình báo' ('the one responsible for
    Intelligence') và đại từ tự quy chiếu 'mình' trong câu hỏi gián tiếp của Habergram."]
- segment_id: YS-LN05/Text/part0016.html/p000415
  kind: terminology_and_voice
  value: choices=["Khóa 'khu trục hạm' ('destroyers') và liệt kê tăng tiến từ nhu
    yếu phẩm, tàu chiến tới các quốc gia đồng minh văn minh, đáng tin cậy."]
- segment_id: YS-LN05/Text/part0016.html/p000416
  kind: terminology_and_voice
  value: 'choices=["Khóa ''Khối Thịnh vượng chung'' (''the Commonwealth''), ''Cộng
    hòa'' (''the Republic''), ''lục địa'' (''the continent'') và ''Đế quốc'' (''the
    Empire'').", ''Giữ đúng quan hệ nhân quả: không ngăn chặn được thất bại của Cộng
    hòa và can thiệp quá muộn nên giờ phải trả giá bằng cảnh đơn độc đối đầu với Đế
    quốc.'']'
- segment_id: YS-LN05/Text/part0016.html/p000417
  kind: terminology_and_voice
  value: choices=["Khóa 'Khối Thịnh vượng chung', 'nghị viện' ('parliament') và phép
    đối lập 'thời khắc huy hoàng nhất của bọn họ và là thời khắc tồi tệ nhất của chúng
    ta'."]
- segment_id: YS-LN05/Text/part0016.html/p000418
  kind: terminology_and_voice
  value: choices=["Khóa cách xưng hô kính trọng của Habergram với Thủ tướng Churbull
    ('ngài... thưa ngài')."]
- segment_id: YS-LN05/Text/part0016.html/p000419
  kind: terminology_and_voice
  value: choices=["Khóa lời xác nhận ngắn gọn 'Chính xác.'"]
- segment_id: YS-LN05/Text/part0016.html/p000420
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*Xem ra ông ta vẫn mê hút
    thuốc như vậy.*' cho suy nghĩ nội tâm của Habergram theo DEC-P01-002.", "Giữ phủ
    định cuối câu 'nhưng bản thân ông cũng chẳng phản đối gì chuyện đó'."]
