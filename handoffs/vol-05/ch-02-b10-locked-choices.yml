    "Giữ đúng tình thái giả định có thể xảy ra: ''nếu... thì phụ nữ thực chất có thể
    sẽ ít bị chú ý hơn''"]'
- segment_id: YS-LN05/Text/part0016.html/p000111
  kind: terminology_and_voice
  value: choices=['Giữ nhận định đánh giá tích cực về điểm lưu ý trên']
- segment_id: YS-LN05/Text/part0016.html/p000112
  kind: terminology_and_voice
  value: 'choices=["Lời thoại bỏ lửng của Habergram: ''cho phụ nữ nhảy dù xuống lãnh
