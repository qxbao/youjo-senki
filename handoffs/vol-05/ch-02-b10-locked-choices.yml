- segment_id: YS-LN05/Text/part0016.html/p000114
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm gián tiếp không bọc nghiêng Markdown (nguồn không
    có thẻ em); thuật ngữ: ''cuộc chiến tuyên truyền''"]'
- segment_id: YS-LN05/Text/part0016.html/p000115
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''ông'', ''họ''; giữ cấu trúc giả định về rủi
