    VƯỢNG CHUNG, TẠI KHU VỰC WHITEHALL''"]'
- segment_id: YS-LN05/Text/part0016.html/p000133
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ mở cảnh nhất quán với p000130: ''Tại cuộc họp quốc phòng
