    đầu đúng phạm vi thẻ em trong nguồn", "Đại từ và chức danh: ''ngành Tình báo'',
    ''Ông'', ''thủ tướng''"]'
- segment_id: YS-LN05/Text/part0016.html/p000129
  kind: terminology_and_voice
  value: 'choices=["Đại từ và phủ định: ''ông cũng chẳng có lý do hay cách thức nào
    để khước từ một chỉ thị...''"]'
- segment_id: YS-LN05/Text/part0016.html/p000130
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và chức danh: ''cuộc họp quốc phòng của Khối Thịnh vượng
    chung'', ''văn phòng thủ tướng''", "Đại từ ngôi thứ nhất của Habergram khi giao
