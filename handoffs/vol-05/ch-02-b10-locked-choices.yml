- segment_id: YS-LN05/Text/part0016.html/p000113
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: bọc ''*...*'' toàn bộ đoạn
    độc thoại nội tâm đúng phạm vi thẻ em trong nguồn", "Tên riêng và đại từ nội tâm
    trực tiếp: ''Bộ Tổng tham mưu'', ''Whitehall'', ''chiến dịch bí mật'', ''mình'';
