- segment_id: YS-LN05/Text/part0016.html/p000125
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ hành chính trong lời hỏi lại của Habergram: ''ủy ban
    quốc phòng'', ''thông tư triệu tập''"]'
- segment_id: YS-LN05/Text/part0016.html/p000126
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''ông'' / ''mình''; thuật ngữ: ''lệnh triệu
    tập''"]'
- segment_id: YS-LN05/Text/part0016.html/p000127
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Habergram: ''tôi''; giữ phủ định ''không
