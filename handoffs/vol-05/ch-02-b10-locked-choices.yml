- segment_id: YS-LN05/Text/part0016.html/p000106
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''sĩ quan thương binh'', ''vùng chiến sự''"]'
- segment_id: YS-LN05/Text/part0016.html/p000107
  kind: terminology_and_voice
  value: 'choices=["Tên riêng và thuật ngữ: ''nhân sự Tình báo'', ''Tướng Habergram''"]'
- segment_id: YS-LN05/Text/part0016.html/p000108
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Habergram: ''ông''; thuật ngữ: ''ra thực
