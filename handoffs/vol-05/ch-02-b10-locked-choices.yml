- segment_id: YS-LN05/Text/part0016.html/p000121
  kind: terminology_and_voice
  value: 'choices=["Danh từ chỉ nhân vật phụ: ''một viên chức cấp dưới''"]'
- segment_id: YS-LN05/Text/part0016.html/p000122
  kind: terminology_and_voice
  value: 'choices=["Đại từ chỉ viên chức cấp dưới: ''Anh ta''"]'
- segment_id: YS-LN05/Text/part0016.html/p000123
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc ''*Trời đất ơi.*''
