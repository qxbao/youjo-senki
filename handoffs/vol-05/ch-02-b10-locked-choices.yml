- segment_id: YS-LN05/Text/part0016.html/p000117
  kind: terminology_and_voice
  value: 'choices=["Lời than thở của Habergram: giữ phủ định ''chẳng bao giờ diễn
    ra theo ý muốn cả''"]'
- segment_id: YS-LN05/Text/part0016.html/p000118
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và tên riêng: ''Tướng Habergram''"]'
- segment_id: YS-LN05/Text/part0016.html/p000119
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và đại từ: ''Nguồn nhân lực'', ''ngành Tình báo'', ''quý
