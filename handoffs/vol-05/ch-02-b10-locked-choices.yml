- segment_id: YS-LN05/Text/part0016.html/p000134
  kind: terminology_and_voice
  value: 'choices=["Tên riêng và chức danh: ''các quan chức cấp cao'', ''Khối Thịnh
    vượng chung''"]'
- segment_id: YS-LN05/Text/part0016.html/p000135
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và cấu trúc câu danh ngữ: ''Những nhân vật đầu mối từ
