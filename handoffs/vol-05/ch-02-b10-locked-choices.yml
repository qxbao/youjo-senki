- segment_id: YS-LN05/Text/part0016.html/p000131
  kind: terminology_and_voice
  value: 'choices=["Đại từ và chức danh: ''ông'', ''thủ tướng'', ''mình''"]'
- segment_id: YS-LN05/Text/part0016.html/p000132
  kind: terminology_and_voice
  value: 'choices=["Giữ định dạng in hoa toàn bộ dòng tiêu đề thời gian và địa điểm:
