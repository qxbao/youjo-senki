  kind: terminology_and_voice
  value: 'locked={''modality'': ''Tuy có thể không mấy liên quan… / tương đối ngon'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000026
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''negation'': ''bánh mì không bị ỉu cứng'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000027
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''date_and_logic'': ''đừng giật mình nhé /
    ngày 28 tháng 8 / tờ báo của ngày hôm nay'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000028
  kind: terminology_and_voice
  value: 'locked={''modality'': ''Tuy bây giờ đã là buổi chiều, nhưng báo buổi sáng
    vẫn có thể được chuyển tới'', ''terminology'': ''những vị trí tiền tiêu xa nhất'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000029
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Cục Quân vụ Đế quốc / cuộc chiến hậu cần'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000030
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''viewpoint'': "trần thuật ngôi thứ ba, lược
    đại từ tự nhiên (''khi lầm bầm một mình'')", ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000031
  kind: terminology_and_voice
  value: 'locked={''viewpoint'': ''thoại lầm bầm một mình của Tanya, lược chủ ngữ
    tự nhiên'', ''terminology'': ''tin tức thời chiến'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000032
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''terminology'': ''bí mật quân sự / báo chí
    ở hậu phương / “Đời sống của những người lính quả cảm nơi tiền tuyến”'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000033
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình (tự quy chiếu của Tanya theo DEC-P01-001)'',
    ''terminology'': ''kiểm duyệt / tuyên truyền / hậu phương / tiền tuyến'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000034
  kind: terminology_and_voice
  value: 'locked={''modality_and_negation'': ''có lẽ đó cũng không phải là một cách
    tồi để khích lệ tinh thần chiến đấu'', ''terminology'': ''từ viết tắt lẫn tiếng
    lóng / tiền tuyến'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000035
  kind: terminology_and_voice
  value: 'locked={''pronouns'': "mình (độc thoại nội tâm của Tanya theo DEC-P01-001,
    sửa từ ''tôi'')", ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000036
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Các người (Tanya hướng lời mỉa mai tới phía làm
    báo/tuyên truyền)'', ''terminology'': ''tin giả'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000037
  kind: terminology_and_voice
  value: 'locked={''negation'': ''thậm chí còn chẳng buồn che giấu sự thật rằng tất
    cả những lá thư đó đều do một người viết ra'', ''terminology'': ''chiến tranh
    thông tin'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000038
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Liên bang / Khối Thịnh vượng chung'', ''modality'':
    ''có lẽ giỏi mấy trò kiểu này hơn'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000039
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''terminology'': ''Lục quân Đế quốc / chiến
    tranh thông tin / chiếc cốc quân dụng chẳng ra hình chiếc cốc'', ''negation'':
    ''chẳng có cách nào hay ho để thắng được bọn lừa đảo trong chính trò chơi sở trường
    của chúng'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000040
  kind: terminology_and_voice
  value: 'locked={''condition_and_logic'': ''nếu phương pháp mà họ lựa chọn lại thiếu
    đi sự tinh vi, thì nó sẽ chỉ phản tác dụng mà thôi'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000041
  kind: terminology_and_voice
  value: 'locked={''viewpoint'': "thoại cảm thán của Tanya, dùng danh ngữ khái quát
    ''một kẻ sống để làm việc''", ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000042
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''negation'': ''chẳng có gì lạ'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000043
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''nó (trần thuật ngôi thứ ba về Tanya theo DEC-P01-001)'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000044
  kind: terminology_and_voice
  value: 'locked={''date_and_logic'': ''những ngày cuối tháng Tám / tiết trời dễ chịu
    đến mức chẳng thể nào liên tưởng miền đông với bùn lầy được'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000045
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''negation'': ''chẳng buồn che giấu vẻ bực
    dọc'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000046
  kind: terminology_and_voice
  value: 'locked={''pronouns'': "chúng ta (độc thoại nội tâm ngôi thứ nhất số nhiều
    của Tanya, sửa từ ''chúng tôi'')", ''condition_and_negation'': ''Nếu cố đánh chiếm
    dải đất rộng lớn này thì cả đội quân sẽ kiệt sức mất / không đủ nhân lực để bao
    quát hết toàn bộ'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000047
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Tanya von Degurechaff'', ''pronouns'':
    ''nó (trần thuật ngôi thứ ba về Tanya theo DEC-P01-001)'', ''emphasis'': ''*Thế
    này chẳng khác nào lao đầu vào một đường hầm mà chẳng biết có lối ra hay không…*
    (theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000048
  kind: terminology_and_voice
  value: 'locked={''viewpoint'': "độc thoại nội tâm lược đại từ chủ ngữ (''Đoán là...'')",
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000049
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000050
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''nó (trần thuật ngôi thứ ba về Tanya theo DEC-P01-001)'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000051
  kind: terminology_and_voice
  value: 'locked={''pronouns'': "mình (độc thoại nội tâm của Tanya theo DEC-P01-001,
    sửa từ ''tôi'')", ''terminology'': ''Trái Đất / quân đội Đức / mặt trận phía đông
    / những phòng tuyến bị kéo căng quá mức'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000052
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Cuộc chiến tiêu hao / Đế quốc / nguồn nhân lực'',
    ''negation_and_time'': ''vẫn chưa cạn kiệt / chỉ đúng với hiện tại mà thôi / không
    phải là sự bảo đảm cho tương lai'', ''emphasis'': ''*vẫn chưa cạn kiệt* (theo
    DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000053
  kind: terminology_and_voice
  value: 'locked={''pronouns'': "mình (độc thoại nội tâm của Tanya theo DEC-P01-001,
    sửa từ ''tôi'')", ''terminology_and_logic'': ''giả định rằng các sự kiện ở đây
    diễn ra trùng khớp với những gì đã xảy ra trong Thế chiến thứ hai / Thế chiến
    thứ nhất / Đức'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000054
  kind: terminology_and_voice
  value: 'locked={''pronouns'': "chúng ta (độc thoại nội tâm ngôi thứ nhất số nhiều
    của Tanya, sửa từ ''chúng tôi'')", ''negation_and_modality'': ''hiện tại Đế quốc
    đang thắng thế ở phía tây / không có nghĩa là chúng ta buộc phải thua ở phía đông
    / vẫn chưa thể biết rõ cuộc chiến này sẽ ngả theo chiều hướng nào'', ''emphasis'':
    ''none''}'
