- segment_id: YS-LN05/Text/part0016.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Đại từ trong thoại của Zettour với Tanya: ''chúng ta''", "Giữ
    đúng mệnh đề điều kiện và tình thái trách nhiệm quá khứ: ''Nếu chuyện đó là thật
    thì chúng ta quả là những kẻ ngu xuẩn. Chúng ta lại vừa phạm thêm một sai lầm
    chiến lược nữa mà lẽ ra phải tránh được.''"]'
- segment_id: YS-LN05/Text/part0016.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''Tôi'' / ''tôi'',
    ''ngài''", "Giữ đúng cấu trúc nhường quyền quyết định: ''Việc tôi có nên từ chức
    hay không, tôi xin giao cả cho ngài định đoạt.''"]'
- segment_id: YS-LN05/Text/part0016.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: ''cô'', ''Chúng ta''
    / ''chúng ta''", "Giữ phủ định và đánh giá ngược lại: ''Không, không cần đến mức
    đó đâu. Trái lại, cô đã làm rất tốt khi nhận ra tất cả những chuyện này.''"]'
- segment_id: YS-LN05/Text/part0016.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm tự quy chiếu của Tanya theo DEC-P01-001: ''Mình''
