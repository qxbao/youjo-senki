    cho Liên bang hay sao?*' theo DEC-P01-002.", 'Giữ phủ định bộ phận và câu hỏi
    phản vấn nghi ngờ mức độ có lợi cho Liên bang.']
- segment_id: YS-LN05/Text/part0016.html/p000349
  kind: terminology_and_voice
  value: choices=["Giữ sắc thái bề mặt 'Thoạt nhìn, kết luận ấy có vẻ nhằm theo đuổi
    lợi ích của Khối Thịnh vượng chung'."]
- segment_id: YS-LN05/Text/part0016.html/p000350
  kind: terminology_and_voice
  value: choices=["Khóa hô ngữ 'Thưa các quý ông' ('Gentlemen') và đại từ 'chúng ta'
    trong lời điều phối cuộc họp."]
- segment_id: YS-LN05/Text/part0016.html/p000351
  kind: terminology_and_voice
  value: choices=["Giữ tình thái phỏng đoán 'có lẽ' ('probably') và mệnh đề khái quát
    'Sự đồng thuận tuyệt đối chính là điềm báo của tinh thần đoàn kết'."]
- segment_id: YS-LN05/Text/part0016.html/p000352
  kind: terminology_and_voice
  value: 'choices=["Khóa đại từ trần thuật ''ông'' cho Tướng Habergram và chức vụ
    ''người đứng đầu cơ quan tình báo'' (''the head of the intelligence agency'').",
    ''Giữ quan hệ nhân quả nghịch lý: chính vì muốn tin mọi chuyện đang tốt đẹp nên
    người đứng đầu cơ quan tình báo từng trải qua nhiều gian truân lại không thể hoàn
    toàn chấp nhận điều đó.'']'
- segment_id: YS-LN05/Text/part0016.html/p000353
  kind: terminology_and_voice
  value: choices=["Khóa 'đơn vị pháp sư hải quân đánh bộ' ('marine mage unit'), 'tuyến
    đường phía bắc' ('northern route'), 'quân tình nguyện của Hợp chúng quốc' ('Unified
    States voluntary troops') và 'Thủ tướng Churbull' ('Prime Minister Churbull').",
    "Giữ đúng phạm vi nhấn mạnh Markdown '*một chiếc tàu*' ('*one boat*') theo DEC-P01-002."]
- segment_id: YS-LN05/Text/part0016.html/p000355
  kind: terminology_and_voice
  value: choices=["Giữ tình thái giả định quá khứ ('thì còn dễ hiểu', 'hẳn đã nói
    chuyện trước') và câu hỏi nghi vấn nội tâm gián tiếp 'Nhưng… chỉ một chiếc tàu
    ư?' mà không tự thêm chữ nghiêng."]
- segment_id: YS-LN05/Text/part0016.html/p000356
  kind: terminology_and_voice
  value: choices=["Giữ đúng phạm vi nhấn mạnh Markdown '*Ồồồ.*' cho cảm thán nội tâm
    của Tướng Habergram trước khi ông điều chỉnh nhận định."]
- segment_id: YS-LN05/Text/part0016.html/p000357
  kind: terminology_and_voice
  value: choices=["Khóa 'Các đại diện hải quân' ('The navy representatives') và đại
    từ 'ông ta' quy chiếu Thủ tướng Churbull dưới góc nhìn của Habergram."]
- segment_id: YS-LN05/Text/part0016.html/p000358
  kind: terminology_and_voice
  value: choices=["Giữ phủ định nhấn mạnh 'thậm chí sẽ chẳng cần đến lực lượng hộ
