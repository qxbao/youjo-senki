- segment_id: YS-LN05/Text/part0025.html/p000607
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: "những yêu cầu tối thiểu để làm một chuyên gia" (the
    minimal requirements to be an expert), nối mạch trực tiếp với p000606.'']'
- segment_id: YS-LN05/Text/part0025.html/p000608
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ tên "Tanya", giữ phủ định kép "hoàn toàn không
    có ý định coi trọng" và "chẳng hiểu nổi được mấy phần" (barely understand).'']'
- segment_id: YS-LN05/Text/part0025.html/p000609
  kind: terminology_and_voice
  value: 'choices=[''Câu khẳng định ngắn: "Thời gian là hữu hạn."'']'
- segment_id: YS-LN05/Text/part0025.html/p000610
  kind: terminology_and_voice
  value: 'choices=[''Thoại mệnh lệnh của Tanya với các sĩ quan: dịch "gentlemen" là
    "thưa các vị" (phù hợp bối cảnh có cả Trung úy Serebryakov), thuật ngữ "khẩn trương
    về vị trí của mình" (to your positions on the double), "các mệnh lệnh tác chiến
    phòng ngự" (defensive battle orders).'']'
- segment_id: YS-LN05/Text/part0025.html/p000611
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & tên riêng: "Đại úy Ahrens" (Captain Ahrens), "Trung
    úy Grantz" (Lieutenant Grantz), "hai Trung úy Wüstemann và Tospan" (Lieutenants
    Wüstemann and Tospan).'']'
- segment_id: YS-LN05/Text/part0025.html/p000612
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & đại từ trần thuật: "Trung úy Serebryakov" (Lieutenant
    Serebryakov) — gọi là "cô"; "Tanya".'']'
- segment_id: YS-LN05/Text/part0025.html/p000613
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Nào, giờ thì đến lúc làm
    việc rồi.*"'']'
- segment_id: YS-LN05/Text/part0025.html/p000614
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: số nhiều "của bọn
    mình" (our).'', ''Thuật ngữ & hình ảnh đối xứng: "cuộc chiến văn hóa" (culture
    war), "những vị khách không mời trong đêm" (uninvited nighttime guests), "đạn
    pháo và đạn súng hay lưỡi lê và xẻng" (shells and bullets or bayonets and shovels).'']'
- segment_id: YS-LN05/Text/part0025.html/p000615
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm giữ nguyên độ mở: "Và có phải bên pháo binh đang
    mở màn cho mọi chuyện đấy không?"'']'
- segment_id: YS-LN05/Text/part0025.html/p000616
  kind: terminology_and_voice
  value: 'choices=[''Tên riêng & thuật ngữ: "Tanya", "hiện thân của chủ nghĩa vô thần"
    (personification of atheism), "pháo binh chính là Thượng đế" (artillery is God).'']'
- segment_id: YS-LN05/Text/part0025.html/p000617
  kind: terminology_and_voice
  value: 'choices=[''Thoại báo cáo của Serebryakov với Tanya: gọi "Thưa Trung tá"
    (Colonel), gọi "Thiếu tá Weiss" (Major Weiss) ở ngôi thứ ba là "Anh ấy", thuật
    ngữ "bắn có quan sát" (observed fire).'']'
- segment_id: YS-LN05/Text/part0025.html/p000618
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & thuật ngữ: "Trung úy Serebryakov" (Lieutenant Serebryakov),
    "Thiếu tá Weiss" (Major Weiss), "qua vô tuyến" (via the wireless).'']'
- segment_id: YS-LN05/Text/part0025.html/p000619
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002 và đại từ trần thuật theo
    DEC-P01-001: "*Tuyệt vời*", gọi Tanya là "nó".'']'
- segment_id: YS-LN05/Text/part0025.html/p000620
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật theo DEC-P01-001: gọi "Tanya" là "nó", gọi "Đại úy
