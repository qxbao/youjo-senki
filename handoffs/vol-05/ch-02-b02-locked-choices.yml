- segment_id: YS-LN05/Text/part0014.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour: ''Tôi''; thuật ngữ: ''chiến tranh
    tổng lực''"]'
- segment_id: YS-LN05/Text/part0014.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Đại từ quy chiếu Zettour trong độc thoại/trần thuật của Tanya:
    ''Ông ấy''"]'
- segment_id: YS-LN05/Text/part0014.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Danh xưng: ''Tướng von Zettour''; thuật ngữ: ''chiến tranh tổng
    lực''", "Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc ''*hoàn toàn chính xác*''
    đúng phạm vi thẻ em trong nguồn"]'
- segment_id: YS-LN05/Text/part0014.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật của Tanya: ''nó'' kết hợp với đại từ phản thân
    ''mình'' trong mệnh đề phụ"]'
- segment_id: YS-LN05/Text/part0014.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''tôi'' – ''ngài ...
    ạ''; đại từ số nhiều: ''chúng ta''"]'
- segment_id: YS-LN05/Text/part0014.html/p000027
  kind: terminology_and_voice
  value: choices=["Giữ đúng điều kiện giới hạn ở câu thứ hai ('chỉ khi chúng thực
    sự là kẻ thù')"]
- segment_id: YS-LN05/Text/part0014.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Tên nhân vật: ''Tanya''; khái niệm quản trị: ''việc tinh giản
    tối ưu''"]'
- segment_id: YS-LN05/Text/part0014.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Đại từ số nhiều trong thoại: ''Chúng ta''; thuật ngữ: ''quê nhà''"]'
- segment_id: YS-LN05/Text/part0014.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''ngành hậu cần''"]'
- segment_id: YS-LN05/Text/part0014.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Chia để trị''", "Nhấn mạnh Markdown theo DEC-P01-002:
    bọc toàn bộ câu ''*Chia để trị.*''"]'
- segment_id: YS-LN05/Text/part0014.html/p000033
  kind: terminology_and_voice
  value: choices=["Giữ nguyên câu hỏi tu từ cuối câu và cụm định ngữ mỉa mai chỉ Khối
    Thịnh vượng chung ('đám cuồng trà chỉ biết chuộng mỗi thể thao với chiến tranh
    kia')"]
- segment_id: YS-LN05/Text/part0014.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''quê nhà''; giữ nguyên quan hệ điều kiện - hệ quả
    về chi phí"]'
- segment_id: YS-LN05/Text/part0014.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và tên đầy đủ: ''Trung tướng Hans von Zettour'', ''Tanya''"]'
- segment_id: YS-LN05/Text/part0014.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Cách Zettour gọi Tanya trong thoại: ''Trung tá'' (cho cấp bậc
    Lieutenant Colonel)", "Cấu trúc tương quan: ''không chỉ nằm ở chi phí mà còn là
    tính hữu dụng''"]'
- segment_id: YS-LN05/Text/part0014.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Xưng hô và thuật ngữ lặp lại trong câu hỏi của Tanya: ''Tính hữu
    dụng sao, thưa Tướng quân?''"]'
- segment_id: YS-LN05/Text/part0014.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Cơ quan chỉ huy: ''Bộ Tổng tham mưu'' và ''Bộ Tư lệnh Tối cao''"]'
- segment_id: YS-LN05/Text/part0014.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Tên quốc gia đối địch: ''Liên bang''"]'
- segment_id: YS-LN05/Text/part0014.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Tổ chức quân sự: ''Lục quân Đế quốc''"]'
- segment_id: YS-LN05/Text/part0014.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và danh xưng: ''Đế quốc'', ''Bộ Tổng tham mưu'', ''các
    hoạt động bình định'', ''Tướng von Zettour'', ''chiến tranh tâm lý''"]'
- segment_id: YS-LN05/Text/part0014.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Đại từ: ''Chúng ta'' (nhận định chung của phía Đế quốc), ''ông''
    (Zettour), ''nó'' (Tanya trong lời dẫn trần thuật)", "Thuật ngữ trong thoại: ''Logos''"]'
- segment_id: YS-LN05/Text/part0014.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: ''Thưa Tướng quân, ngài ... ạ''; giữ đối lập giữa ''luật
    pháp'' và ''Logos''", "Nhấn mạnh Markdown theo DEC-P01-002: bọc đúng động từ tình
    thái ''*vẫn có thể*''"]'
- segment_id: YS-LN05/Text/part0014.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Tanya: ''cô'', ''chúng ta'';
    đại từ trần thuật chỉ Zettour: ''ông''", "Thuật ngữ: ''chương trình bình định
    chống Cộng'', ''quê nhà''"]'
- segment_id: YS-LN05/Text/part0014.html/p000047
  kind: terminology_and_voice
  value: 'choices=["Chuỗi thuật ngữ giải nghĩa: ''Logos, ngôn từ, lý tính, logic''"]'
- segment_id: YS-LN05/Text/part0014.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ trong câu hỏi xác nhận của Tanya: ''Các hoạt động bình
    định chống Cộng sao ạ?''"]'
- segment_id: YS-LN05/Text/part0014.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc thán từ ''*Ààà.*''
    trong dấu sao"]'
- segment_id: YS-LN05/Text/part0014.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: bọc toàn bộ câu ''*Đó là
    một sự hiểu lầm tai hại.*''"]'
- segment_id: YS-LN05/Text/part0014.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật của Tanya: ''nó''; cụm từ quân sự: ''được kiểm
    chứng qua thực chiến''"]'
- segment_id: YS-LN05/Text/part0014.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Tổ chức: ''Lục quân Đế quốc'', ''Bộ Tổng tham mưu''", "Đại từ
    ngôi thứ hai khái quát: ''bạn''; thuật ngữ: ''có lý tính''"]'
- segment_id: YS-LN05/Text/part0014.html/p000053
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn độc thoại nội tâm trực tiếp của Tanya theo DEC-P01-001:
    ''Mình''", "Giữ nhất quán thuật ngữ ''có lý tính'' / ''sự lý tính'' nối tiếp từ
    p000052"]'
- segment_id: YS-LN05/Text/part0014.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ tổ chức: ''Lực lượng Feldgendarmerie''", "Xưng hô trong
    thoại của Zettour với Tanya: ''tôi'' – ''cô''"]'
- segment_id: YS-LN05/Text/part0014.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Zettour: ''Thưa Tướng von Zettour'',
    ''tôi'', ''chúng ta'', ''Xin ngài ... ạ''", "Đại từ trần thuật của Tanya ở vế
    dẫn truyện sau thoại: ''nó''", "Thuật ngữ: ''những hoạt động bình định chống Cộng'',
    ''quan điểm chống Cộng''"]'
- segment_id: YS-LN05/Text/part0014.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật của Tanya: ''nó''; đại từ chỉ phía Đế quốc:
    ''họ''", "Giữ đúng tình thái giả định trái thực tế trong quá khứ: ''lẽ ra nó phải
    hoài nghi sâu sắc và đòi hỏi bằng chứng cho mọi thứ mới phải''"]'
