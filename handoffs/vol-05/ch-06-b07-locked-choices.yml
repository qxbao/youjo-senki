- segment_id: YS-LN05/Text/part0029.html/p000259
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'Tanya' và 'Nó / nó'; thoại dùng 'đài vô tuyến',
    'Tướng von Zettour', 'đúng mười hai giờ trưa nay', xưng hô thân mật hơn ở câu
