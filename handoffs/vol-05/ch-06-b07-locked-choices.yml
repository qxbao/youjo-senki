- segment_id: YS-LN05/Text/part0029.html/p000260
  kind: terminology_and_voice
  value: choices=["Khóa dòng tiêu đề chuyển cảnh in hoa 'CÙNG NGÀY HÔM ĐÓ, LÃNH THỔ
