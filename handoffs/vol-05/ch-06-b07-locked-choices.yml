- segment_id: YS-LN05/Text/part0029.html/p000216
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Thiếu tá Weiss: xưng ''tôi'', gọi ''Thiếu
    tá''; giữ sắc thái cam đoan chắc chắn."]'
- segment_id: YS-LN05/Text/part0029.html/p000217
  kind: terminology_and_voice
  value: 'choices=["Độc thoại phân tích chiến lược: dùng đại từ giả định khái quát
    ''bạn'', khóa các cụm ''người giải phóng'', ''cấp trên'' và ''suy nghĩ viển vông''."]'
- segment_id: YS-LN05/Text/part0029.html/p000218
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya đặt trong tập thể quân đội Đế quốc: dùng ''chúng
    ta'', khóa ''Trung tướng von Zettour'', ''Bộ Tổng tham mưu'' và ''những người
    giải phóng''."]'
- segment_id: YS-LN05/Text/part0029.html/p000219
  kind: terminology_and_voice
  value: choices=["Khóa thành ngữ chiến lược 'chia để trị' và hình ảnh ẩn dụ 'những
    bánh răng trong cỗ máy' với chủ thể 'chúng ta'."]
- segment_id: YS-LN05/Text/part0029.html/p000220
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng tên riêng 'Tanya'; trong thông báo nghiêm nghị
    trước toàn thể sĩ quan, xưng hô 'các vị - chúng ta', giữ dấu nháy đơn quanh từ
    '‘tai nạn’'."]
- segment_id: YS-LN05/Text/part0029.html/p000221
  kind: terminology_and_voice
  value: choices=["Giữ quan hệ nhân quả giữa 'hành vi sai trái của các đơn vị chiếm
    đóng' và việc đẩy người dân về phía 'quân du kích', làm lợi cho kẻ địch."]
- segment_id: YS-LN05/Text/part0029.html/p000222
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Weiss: xưng ''tôi'', gọi ''Thiếu tá Weiss
    / anh''."]'
- segment_id: YS-LN05/Text/part0029.html/p000223
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss với Tanya: gọi ''Trung tá'', dùng ''chúng ta''
    và ''quê nhà'', có tiểu từ kính ngữ ''ạ''."]'
- segment_id: YS-LN05/Text/part0029.html/p000224
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-001 và DEC-P01-002: bọc chữ nghiêng đúng hai phần
    ''*Chà.*'' và ''*Mình không cần phải lo lắng về Weiss nữa rồi.*'', không nghiêng
    câu trần thuật ''Tanya mỉm cười.'' ở giữa; nội tâm tự quy chiếu dùng ''mình''."]'
- segment_id: YS-LN05/Text/part0029.html/p000225
  kind: terminology_and_voice
  value: choices=['Giữ cấu trúc câu hỏi phủ định thể hiện sự ngỡ ngàng của Tospan
    trước mệnh lệnh của cấp trên.']
- segment_id: YS-LN05/Text/part0029.html/p000226
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-001: trần thuật quy chiếu Tanya bằng đại từ ''nó''."]'
- segment_id: YS-LN05/Text/part0029.html/p000227
  kind: terminology_and_voice
  value: choices=["Khóa cấp bậc 'Trung úy Tospan'; trần thuật gọi Tanya là 'nó'."]
- segment_id: YS-LN05/Text/part0029.html/p000228
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: tự xưng ''mình'', gọi Tospan là ''gã''
    thể hiện thái độ ngán ngẩm."]'
- segment_id: YS-LN05/Text/part0029.html/p000229
  kind: terminology_and_voice
  value: 'choices=["Thoại chấn chỉnh của Tanya: khóa ''Trung úy Tospan'', ''Thiếu
    tá Weiss'', ''lãnh thổ bị chiếm đóng'' và ''những người giải phóng''."]'
- segment_id: YS-LN05/Text/part0029.html/p000230
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản biện của Tospan: dùng ''chúng ta'', khóa ''hoạt động
    gián điệp'' và giữ sắc thái lễ phép với cấp trên (''ạ'')."]'
- segment_id: YS-LN05/Text/part0029.html/p000231
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: dùng ''Mình'', giữ đúng cấu trúc
    tăng tiến cùng chủ thể ''không những bất tài mà còn chẳng hề tự nhận thức được
    điều đó''."]'
- segment_id: YS-LN05/Text/part0029.html/p000232
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn của Tanya với các sĩ quan cấp dưới: dùng ''các anh''."]'
- segment_id: YS-LN05/Text/part0029.html/p000233
  kind: terminology_and_voice
  value: choices=["Giữ thán từ nghi vấn sửng sốt '“Hả?!”'."]
- segment_id: YS-LN05/Text/part0029.html/p000234
  kind: terminology_and_voice
  value: choices=["Khóa chuỗi 'Đánh lừa, ngụy trang, chiến tranh thông tin' và địa
    danh chiến thuật 'vùng đất không người'; xưng hô với nhóm sĩ quan là 'mấy anh
    / các anh'."]
- segment_id: YS-LN05/Text/part0029.html/p000235
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó' cho Tanya, đại từ phản thân sở hữu dùng 'mình',
    gọi Tospan là 'một gã bất tài'."]
- segment_id: YS-LN05/Text/part0029.html/p000236
  kind: terminology_and_voice
  value: choices=["Khóa 'tay đại úy đầu đất ... Thon', trạng thái 'mất tích trong
    chiến đấu', đại từ trần thuật 'nó' cho Tanya và 'gã' cho Tospan."]
- segment_id: YS-LN05/Text/part0029.html/p000237
  kind: terminology_and_voice
  value: 'choices=["Giữ quan hệ giả định trong quá khứ: trần thuật gọi Tanya là ''nó'',
    mệnh đề phụ tự quy chiếu dùng ''mình'', gọi Tospan là ''gã''."]'
- segment_id: YS-LN05/Text/part0029.html/p000238
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-001 và DEC-P01-002: bọc chữ nghiêng đúng câu nội
    tâm ''*Mình cứ tưởng đương nhiên gã sẽ làm đúng những gì được bảo…*'', giữ câu
    trần thuật phía sau ở dạng chữ thường."]'
- segment_id: YS-LN05/Text/part0029.html/p000239
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng đúng câu hỏi nội tâm đầu đoạn
    và cụm ''*đáng sợ*'' ở cuối đoạn; trần thuật gọi Tanya là ''Nó''."]'
- segment_id: YS-LN05/Text/part0029.html/p000240
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó' cho Tanya và 'gã' cho Tospan."]
- segment_id: YS-LN05/Text/part0029.html/p000241
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: tự quy chiếu bằng ''mình'', gọi Tospan
    là ''gã'', khóa thuật ngữ ''nguồn nhân lực'' và ''chi phí cơ hội''."]'
- segment_id: YS-LN05/Text/part0029.html/p000242
  kind: terminology_and_voice
  value: 'choices=["Thoại của Đại úy Meybert với Tanya: xưng ''tôi'', gọi ''Thưa Trung
    tá / Trung tá''."]'
- segment_id: YS-LN05/Text/part0029.html/p000243
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Meybert: gọi ''anh'', dùng ''chúng ta'' cho
    phía quân Đế quốc."]'
- segment_id: YS-LN05/Text/part0029.html/p000244
  kind: terminology_and_voice
  value: 'choices=["Thoại của Meybert với Tanya: gọi ''Trung tá'', dùng ''chúng ta'',
    giữ nguyên câu hỏi tu từ về áp lực tâm lý của binh lính."]'
- segment_id: YS-LN05/Text/part0029.html/p000245
  kind: terminology_and_voice
  value: choices=["Trần thuật quy chiếu Tanya bằng 'nó'."]
- segment_id: YS-LN05/Text/part0029.html/p000246
  kind: terminology_and_voice
  value: choices=["Khóa 'Đại úy Meybert', xưng hô 'anh', trần thuật dùng 'Nó' cho
    Tanya, và giữ nhấn mạnh Markdown '*làm sáng tỏ trong chốc lát nữa thôi*' theo
