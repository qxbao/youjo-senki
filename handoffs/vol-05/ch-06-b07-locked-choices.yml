- segment_id: YS-LN05/Text/part0029.html/p000247
  kind: terminology_and_voice
  value: 'choices=["Thoại của Meybert: xưng ''tôi'', gọi ''thưa Trung tá''."]'
- segment_id: YS-LN05/Text/part0029.html/p000248
  kind: terminology_and_voice
  value: 'choices=["Câu đáp ngắn gọn của Tanya: ''“Sao thế?”''."]'
- segment_id: YS-LN05/Text/part0029.html/p000249
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: giữ nhấn mạnh Markdown ''*trong chốc lát nữa*''
    khớp với cụm được nhấn mạnh ở p000246; xưng hô ''Trung tá - tôi''."]'
- segment_id: YS-LN05/Text/part0029.html/p000250
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: dùng ''Mình'', khóa cách diễn đạt
    ''bản năng của dân pháo binh''."]'
- segment_id: YS-LN05/Text/part0029.html/p000251
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: dùng ''mình'' ở mệnh đề đánh giá
    cuối câu."]'
- segment_id: YS-LN05/Text/part0029.html/p000252
  kind: terminology_and_voice
  value: choices=["Thoại khen ngợi của Tanya dành cho 'Đại úy Meybert'."]
- segment_id: YS-LN05/Text/part0029.html/p000253
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó' và 'Tanya', quy chiếu Meybert bằng 'anh ta'
    để phân biệt thái độ tôn trọng hơn hẳn cách gọi 'gã' dành cho Tospan."]
- segment_id: YS-LN05/Text/part0029.html/p000254
  kind: terminology_and_voice
  value: choices=["Giữ dấu nháy đơn quanh cụm '‘ngay lập tức’'."]
- segment_id: YS-LN05/Text/part0029.html/p000255
  kind: terminology_and_voice
  value: choices=["Giữ thán từ nghi vấn '“Hả?”'."]
- segment_id: YS-LN05/Text/part0029.html/p000256
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: xưng ''tôi'', giữ dấu nháy đơn ở từ đính chính
