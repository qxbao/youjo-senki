choices:
- segment_id: YS-LN05/Text/part0031.html/p000001
  kind: terminology_and_voice
  value: choices=["Trần thuật quy chiếu Zettour bằng đại từ 'ông' và đại từ phản thân
    'mình'; giữ cấu trúc tương phản 'Dù thắng hay bại'."]
- segment_id: YS-LN05/Text/part0031.html/p000002
  kind: terminology_and_voice
  value: choices=["Thoại diễn thuyết của Zettour dùng đại từ bao gộp 'chúng ta'; khóa
    chuỗi tam đoạn 'Tổ quốc ... mảnh đất ... quê hương bản quán' nối kết với phần
    cuối batch trước."]
- segment_id: YS-LN05/Text/part0031.html/p000003
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'ông'; khóa cặp đồng vị 'Đế quốc, bảo vệ Reich—đất
    nước mà ông hằng yêu quý' và thuật ngữ 'cuộc chiến tiêu hao'."]
- segment_id: YS-LN05/Text/part0031.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu độc thoại nội tâm
    ''*Đúng là một công việc khốn nạn.*''."]'
- segment_id: YS-LN05/Text/part0031.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu độc thoại nội tâm;
    dùng ''mình / chúng ta'' và giữ hình ảnh ẩn dụ ''cối xay thịt''."]'
- segment_id: YS-LN05/Text/part0031.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ đoạn độc thoại nội tâm;
    dùng ''chúng ta'', khóa ''luyện ngục'' và ẩn dụ ''đặt sẵn chỗ trên chuyến tàu
    tốc hành xuống thẳng địa ngục''."]'
- segment_id: YS-LN05/Text/part0031.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Thoại công khai của Zettour: lặp lại đại từ bao gộp ''chúng ta'',
    giữ số nhiều ''các quốc gia chúng ta''."]'
- segment_id: YS-LN05/Text/part0031.html/p000008
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng tên riêng 'Zettour' và đại từ phản thân 'mình'."]
- segment_id: YS-LN05/Text/part0031.html/p000009
  kind: terminology_and_voice
  value: choices=["Giữ câu trần thuật ngắn tạo nhịp lắng 'Ai nấy đều ước nguyện.'."]
- segment_id: YS-LN05/Text/part0031.html/p000010
  kind: terminology_and_voice
  value: choices=["Giữ phép điệp cấu trúc ở cả ba câu ('Họ ước nguyện...') với quy
    chiếu số nhiều 'Họ ... của mình'."]
- segment_id: YS-LN05/Text/part0031.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: dùng ''chúng ta / mình'', khóa điển tích ''Horatius
    đứng trên cầu'' và thuật ngữ ''hiểm họa đỏ''."]'
- segment_id: YS-LN05/Text/part0031.html/p000012
  kind: terminology_and_voice
  value: choices=["Giữ câu trần thuật ngắn khép nhịp điệp 'Họ đã ước nguyện như thế.'."]
- segment_id: YS-LN05/Text/part0031.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Thoại tuyên bố chính thức của Zettour: xưng ''tôi'' (cá nhân đại
    diện) và ''chúng tôi'' (phía Đế quốc trong quan hệ với các nước láng giềng); khóa
    ''Lục quân Đế quốc'', ''quân khu'', ''quyền quản lý dân sự'' và ''Đế quốc''."]'
- segment_id: YS-LN05/Text/part0031.html/p000014
  kind: terminology_and_voice
  value: choices=["Khóa tên riêng 'Horatius', quy chiếu bằng 'Ông ấy' để phân biệt
    với Zettour ('ông'), giữ sắc thái suy đoán chắc chắn 'Hẳn họ đều biết số phận
    của mình sẽ ra sao.'."]
- segment_id: YS-LN05/Text/part0031.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Phân biệt rõ hệ đại từ trong thoại và trần thuật: xưng ''tôi'',
    gọi người nghe là ''các vị'', dùng ''cả hai phía chúng ta'' và ''chúng ta cùng
    nhau chiến đấu'' (bao gộp), ''sát cánh cùng chúng tôi'' (phía Đế quốc); trần thuật
    ở giữa dùng ''ông'' và ''họ''."]'
- segment_id: YS-LN05/Text/part0031.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: chỉ bọc chữ nghiêng câu độc thoại nội tâm đầu
    đoạn (tự xưng ''Mình''); câu trần thuật thứ hai để chữ thường với tên riêng ''Zettour''."]'
- segment_id: YS-LN05/Text/part0031.html/p000017
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'ông'; giữ sự chuyển biến từ trạng thái im lặng
    sang 'một tiếng thổn thức không thể diễn tả thành lời'."]
- segment_id: YS-LN05/Text/part0031.html/p000018
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'Ông' và 'mình' cho Zettour, 'họ' cho đám đông
    thính giả."]
- segment_id: YS-LN05/Text/part0031.html/p000019
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'ông' và 'mình'; khóa thuật ngữ 'Logos' và hình
    ảnh 'đánh đổi lấy tấm vé xuống địa ngục kia'."]
- segment_id: YS-LN05/Text/part0031.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ đoạn độc thoại nội tâm;
    tự quy chiếu bằng ''Mình ... chính bản thân mình'' ở câu đầu và chuyển sang tự
    gọi tên ''Hans von Zettour ... mày'' đầy tự trào ở câu thứ hai; khóa nghịch ngữ
    ''một kẻ dối trá chân thành''."]'
- segment_id: YS-LN05/Text/part0031.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: xưng ''tôi / mình'', gọi thính giả là ''các
    vị''; giữ đúng hai tầng phủ định (''không thể ra lệnh'' và ''chẳng thể thực sự
    đưa ra một lời yêu cầu mà vẫn thấy thanh thản'')."]'
- segment_id: YS-LN05/Text/part0031.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu nội tâm ''*Nhưng
    chính vì vậy mà mình mới cầu xin.*''."]'
- segment_id: YS-LN05/Text/part0031.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu nội tâm ''*Vì tương
    lai của tổ quốc.*''."]'
- segment_id: YS-LN05/Text/part0031.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: xưng ''Tôi / chúng tôi'', gọi người nghe là
    ''các vị''; giữ hình ảnh ẩn dụ ''chiến binh đồng đội kề vai sát cánh trên cây
    cầu ấy'' và ''sẻ chia bánh mì hòa bình vào một ngày định mệnh nào đó''."]'
- segment_id: YS-LN05/Text/part0031.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu hỏi nội tâm của
    Zettour; tự xưng ''mình'', quy chiếu đám đông là ''những con người đang bị mình
    xúi giục này / họ''."]'
- segment_id: YS-LN05/Text/part0031.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ đoạn độc thoại nội tâm;
    giữ đúng mức độ tình thái suy đoán ''Có lẽ ... có lẽ họ thậm chí còn chẳng tài
    nào thấu hiểu nổi''."]'
- segment_id: YS-LN05/Text/part0031.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu độc thoại nội tâm;
    tự xưng ''mình'', giữ cấu trúc đối xứng với p000028 (''Trên phương diện một cá
    nhân lương thiện...'')."]'
- segment_id: YS-LN05/Text/part0031.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu độc thoại nội tâm;
    tự xưng ''mình'', giữ cấu trúc đối xứng với p000027 (''Trên phương diện một thành
    viên tà ác của tổ chức, mình chấp nhận nó: có.'')."]'
- segment_id: YS-LN05/Text/part0031.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ đoạn độc thoại nội tâm;
    dùng ''Chúng ta'' cho quân đội Đế quốc và ''mình'' cho cá nhân Zettour; khóa ''các
    tuyến phòng ngự'' và ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN05/Text/part0031.html/p000030
  kind: terminology_and_voice
  value: choices=["Giữ giọng trần thuật khái quát nguyên tắc tổ chức bằng chủ ngữ
    phiếm chỉ 'Người ta', dấu ba chấm lửng 'nhưng…' và kết luận dứt khoát 'dốc toàn
    lực thực thi nó'."]
- segment_id: YS-LN05/Text/part0031.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: chỉ bọc chữ nghiêng mệnh đề suy nghĩ ''*Mình
    phải thi hành thôi*'', để chữ thường phần dẫn trần thuật '', Zettour tự giễu nghĩ
    thầm.''."]'
- segment_id: YS-LN05/Text/part0031.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: chỉ bọc chữ nghiêng câu nội tâm đầu đoạn ''*Với
    sự bất tài này, mình đã chẳng thể tìm ra con đường nào khác.*''; câu trần thuật
    thứ hai để chữ thường, khóa ''Trung tướng Hans von Zettour''."]'
- segment_id: YS-LN05/Text/part0031.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ hai câu độc thoại kết
    cảnh ''*Thế là địa ngục lại sinh ra địa ngục. Khốn kiếp thật.*''."]'
- segment_id: YS-LN05/Text/part0031.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ dòng kết tập trong ngoặc
    đơn ''*(Tanya Chiến Ký, Tập 5: Abyssus Abyssum Invocat, Hết)*''."]'
