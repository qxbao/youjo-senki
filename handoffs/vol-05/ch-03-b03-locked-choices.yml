choices:
- segment_id: YS-LN05/Text/part0018.html/p000053
  kind: terminology_and_voice
  value: locked=["Trần thuật quy chiếu Uger bằng 'anh ta', giữ đúng giọng điệu mệt
    mỏi nói lên tất cả."]
- segment_id: YS-LN05/Text/part0018.html/p000054
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''hệ thống phân phối theo định lượng'' (ration system),
    ''củ cải Thụy Điển'' (rutabagas), ''củ cải'' (turnip).", "Logic giới hạn: ''chỉ
    dừng lại ở mức đảm bảo lượng dinh dưỡng nạp vào'' và phủ định ''chẳng có tiếng
    tăm gì về mặt hương vị''."]'
- segment_id: YS-LN05/Text/part0018.html/p000055
  kind: terminology_and_voice
  value: 'locked=["Điểm nhìn & đại từ: nội tâm Tanya tự xưng ''Mình'' theo DEC-P01-001;
    giữ giả định điều kiện ''Nếu một thứ như vậy mà cũng lọt vào danh mục phân phối
    theo định lượng…''."]'
- segment_id: YS-LN05/Text/part0018.html/p000056
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''các mặt hàng xa xỉ'' (luxury items); giữ đúng câu
    hỏi trực diện của Tanya."]'
- segment_id: YS-LN05/Text/part0018.html/p000057
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Khối Thịnh vượng chung'' (Commonwealth), ''cuộc phong
    tỏa đường biển'' (naval blockade).", "Đại từ & tình thái: ngôi thứ nhất số nhiều
    ''chúng ta''; mức phỏng đoán ''Chắc chúng ta chẳng thể trông mong có nhiều''."]'
- segment_id: YS-LN05/Text/part0018.html/p000058
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật chỉ Tanya: ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000059
  kind: terminology_and_voice
  value: 'locked=["Đại từ nội tâm: ''Mình'' theo DEC-P01-001.", "Nhấn mạnh Markdown
    & phủ định: ''không đến mức *ghét*'' khớp với nhấn mạnh một phần trong nguồn theo
    DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0018.html/p000060
  kind: terminology_and_voice
  value: locked=['Giữ nhận định nội tâm về khía cạnh tàn nhẫn khác của chiến tranh,
    không gắn dấu nghiêng khi nguồn không in nghiêng.']
- segment_id: YS-LN05/Text/part0018.html/p000061
  kind: terminology_and_voice
  value: 'locked=["Đại từ thoại: ''chúng ta''; giữ kỳ vọng trả đũa từ ''lực lượng
    tàu ngầm'' (submarines)."]'
- segment_id: YS-LN05/Text/part0018.html/p000062
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: Uger gọi Tanya là ''Trung tá von Degurechaff''
    (Colonel von Degurechaff), xưng ''tôi - cô''.", "Thuật ngữ: ''bàn làm việc của
    Cục Quân vụ'' (Service Corps desk)."]'
- segment_id: YS-LN05/Text/part0018.html/p000063
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya xưng ''Tôi'' với Uger; giữ câu hỏi xác nhận thời
    gian ở cuối lời thoại."]'
- segment_id: YS-LN05/Text/part0018.html/p000064
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật chỉ Tanya: ''nó'' và sở hữu phản thân ''mình''
    theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000065
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya gọi Uger là ''anh'' (ngang cấp Trung tá, đồng nghiệp
    thân quen), giữ điều kiện ''nếu mọi chuyện suôn sẻ''."]'
- segment_id: YS-LN05/Text/part0018.html/p000066
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật chỉ Tanya: ''nó'' theo DEC-P01-001.", "Thuật
    ngữ: ''hậu phương'' (home front), ''Văn phòng Bộ Tổng tham mưu'' (General Staff
    Office), ''Cục Tác chiến'' (Operations Division)."]'
- segment_id: YS-LN05/Text/part0018.html/p000067
  kind: terminology_and_voice
  value: 'locked=["Tên & quân hàm: ''Tanya'', ''Tướng von Rudersdorf'' (General von
    Rudersdorf).", "Đại từ trần thuật: ''mình'' (phản thân) và ''nó'' (sở hữu của
    Tanya) theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000068
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''nhà hoạch định chiến tranh'' (war planner).", "Đại
    từ: ''ông ta'' chỉ Rudersdorf; ''bạn'' cho ngôi thứ hai khái quát giả định."]'
- segment_id: YS-LN05/Text/part0018.html/p000069
  kind: terminology_and_voice
  value: 'locked=["Quân hàm trong thoại: Rudersdorf gọi Tanya là ''Trung tá von Degurechaff''
    (Colonel von Degurechaff)."]'
- segment_id: YS-LN05/Text/part0018.html/p000070
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & thuật ngữ: Tanya đáp ''thưa Tướng quân'' (sir), xưng
    ''tôi / chúng tôi''; giữ nguyên ''Kampfgruppe''."]'
- segment_id: YS-LN05/Text/part0018.html/p000071
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Rudersdorf xưng ''tôi'', gọi Tanya là ''cô'', dùng ''chúng
    ta'' khi nói về chủ trương chung đối với binh lính."]'
- segment_id: YS-LN05/Text/part0018.html/p000072
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya xưng ''Tôi'', gọi Rudersdorf là ''ngài, thưa Tướng
    quân''."]'
- segment_id: YS-LN05/Text/part0018.html/p000073
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''họ'' chỉ hai người; giữ sắc thái tình thái
    ''dường như cho thấy'' (seems to indicate)."]'
- segment_id: YS-LN05/Text/part0018.html/p000074
  kind: terminology_and_voice
  value: locked=['Giữ câu nhận xét ngắn không in nghiêng theo đúng nguồn.']
- segment_id: YS-LN05/Text/part0018.html/p000075
  kind: terminology_and_voice
  value: 'locked=["Tên & quân hàm: ''Tanya'', ''Tướng von Rudersdorf''.", "Nhấn mạnh
    Markdown: chỉ bọc ''*...*'' ở câu thứ hai theo đúng nguồn (DEC-P01-002)."]'
- segment_id: YS-LN05/Text/part0018.html/p000076
  kind: terminology_and_voice
  value: locked=["Giữ câu hỏi nội tâm hòa giọng trần thuật không bọc '*...*' theo
    nguồn."]
- segment_id: YS-LN05/Text/part0018.html/p000077
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: ''Trung tá von Degurechaff'', ''cô''.", "Thuật
    ngữ: ''đạo quân chủ lực'' (main army), ''mặt trận phía Đông'' (eastern front),
    ''Kampfgruppe thử nghiệm'' (experimental Kampfgruppe)."]'
- segment_id: YS-LN05/Text/part0018.html/p000078
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown: bọc toàn bộ câu cảm thán nội tâm trong ''*...*''
    theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0018.html/p000079
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''nó'' (Tanya), ''ông ta'' (Rudersdorf).", "Giả
    định trái thực tế & tình thái: ''Nếu không biết tính cách thường ngày của ông
    ta ra sao, có lẽ nó đã cảm động rồi''."]'
- segment_id: YS-LN05/Text/part0018.html/p000080
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & đại từ: bọc toàn bộ đoạn nội tâm trong ''*...*''
    (DEC-P01-002); dùng ''Ông ta'' và tự xưng ''mình'' (DEC-P01-001)."]'
- segment_id: YS-LN05/Text/part0018.html/p000081
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya xưng ''Tôi'', ''thưa Tướng quân''."]'
- segment_id: YS-LN05/Text/part0018.html/p000082
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & xưng hô: ''cô'' (Tanya), ''Tướng von Zettour'' (General
    von Zettour)."]'
- segment_id: YS-LN05/Text/part0018.html/p000083
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật chỉ Tanya: ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0018.html/p000084
  kind: terminology_and_voice
  value: locked=['Giữ lời dặn của Rudersdorf yêu cầu Tanya nhận lấy chiếc hộp mà không
    từ chối/phản đối.']
- segment_id: YS-LN05/Text/part0018.html/p000085
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: ''Cảm ơn ngài, thưa Tướng quân''."]'
- segment_id: YS-LN05/Text/part0018.html/p000086
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''Ông ta'' và ''nó''."]'
- segment_id: YS-LN05/Text/part0018.html/p000087
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''mình'' (trong mệnh đề tự hỏi) và ''nó'' (chủ
    ngữ trần thuật) theo DEC-P01-001; giữ câu hỏi bất ngờ ở cuối câu."]'
- segment_id: YS-LN05/Text/part0018.html/p000088
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Đại Thập tự Sắt Cánh Trắng'' (White Wings Grand Iron
    Cross), ''Kampfgruppe'', ''Cục Tình báo Quân sự thuộc Bộ Tổng tham mưu'' (General
    Staff Military Intelligence Division).", "Xưng hô: ''của cô''."]'
- segment_id: YS-LN05/Text/part0018.html/p000089
  kind: terminology_and_voice
  value: 'locked=["Xưng hô: Tanya tự xưng ''tôi'', giữ nhịp ngập ngừng và cảm thán
    lễ phép."]'
- segment_id: YS-LN05/Text/part0018.html/p000090
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & thuật ngữ: giữ đúng cấu trúc tách chữ thường
    (reverse-italic emphasis) cho ''Cục Tình báo Quân sự thuộc Bộ Tổng tham mưu''
    và từ ''Đại'' giữa các cụm bọc ''*...*'' theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0018.html/p000091
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật: ''nó''; giữ cấu trúc giả định so sánh ''thà
    được tặng một quả lựu đạn cầm tay còn khiến nó cảm thấy yên tâm hơn''."]'
- segment_id: YS-LN05/Text/part0018.html/p000092
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ: ''Cục Tác chiến'' (Operations Division), ''Văn phòng
    Bộ Tổng tham mưu'' (General Staff Office)."]'
- segment_id: YS-LN05/Text/part0018.html/p000093
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown: chỉ bọc ''*Nhưng mà.*'' ở câu đầu theo DEC-P01-002.",
    "Đại từ & thuật ngữ: ''Tanya'' / ''Nó''; ''tiền tuyến'' (front lines), ''vùng
    đất không người'' (no-man’s-land), ''mặt trận Rhine'' (Rhine front)."]'
