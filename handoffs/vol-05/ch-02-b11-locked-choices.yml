    tướng Churbull''."]'
- segment_id: YS-LN05/Text/part0016.html/p000139
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''the prime minister'' -> ''Thủ tướng'', ''eastern
    front'' -> ''mặt trận phía Đông''."]'
- segment_id: YS-LN05/Text/part0016.html/p000140
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*Giá mà được thế! Vậy thì chúng tôi
    đã chẳng phải chịu khổ thế này.*'' đúng phạm vi thẻ em trong nguồn (DEC-P01-002).",
    ''Giữ đúng điểm nhìn tập thể của những người dự họp đang hướng về ghế chủ tọa.'']'
- segment_id: YS-LN05/Text/part0016.html/p000141
  kind: terminology_and_voice
  value: 'choices=["Tên riêng và cấp bậc: ''General Habergram'' -> ''Tướng Habergram''."]'
- segment_id: YS-LN05/Text/part0016.html/p000142
  kind: terminology_and_voice
  value: 'choices=["Ngôi xưng trong thoại của Thủ tướng Churbull: ''I'' -> ''tôi'';
    giữ nguyên hình ảnh ẩn dụ ''the devil'' -> ''quỷ dữ'' và ''the two devils'' ->
    ''hai con quỷ ấy'' (ám chỉ Đế quốc và Liên bang)."]'
- segment_id: YS-LN05/Text/part0016.html/p000143
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Churbull: ''his'' -> ''của ông ta''."]'
- segment_id: YS-LN05/Text/part0016.html/p000144
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ chính trị: ''anti-Empire'' -> ''chống Đế quốc'', ''expansionist
    warmonger'' -> ''kẻ hiếu chiến theo chủ nghĩa bành trướng'', ''Commonwealth’s
    stubborn imperialist principles'' -> ''những nguyên tắc đế quốc ngoan cố của Khối
    Thịnh vượng chung''."]'
- segment_id: YS-LN05/Text/part0016.html/p000145
  kind: terminology_and_voice
  value: choices=["Giữ tính liên kết biệt danh 'bulldog' -> 'chó mặt xệ' với đoạn
    p000137."]
- segment_id: YS-LN05/Text/part0016.html/p000146
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong lời châm chọc hướng tới Thủ tướng: ''you'' -> ''ngài'';
    giữ giọng mỉa mai tự nhiên."]'
- segment_id: YS-LN05/Text/part0016.html/p000147
  kind: terminology_and_voice
  value: choices=["Giữ ẩn dụ 'tucked in' -> 'lên giường đắp chăn chung' để nối mạch
    chơi chữ sang câu sau."]
- segment_id: YS-LN05/Text/part0016.html/p000148
  kind: terminology_and_voice
  value: choices=["Giữ thế đối lập trong câu hỏi tu từ giữa 'strange bedfellows' và
    'a pious man yet tolerant of heresy' cùng nhận xét về sự dày mặt của Churbull."]
- segment_id: YS-LN05/Text/part0016.html/p000149
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong lời đáp của Churbull: ''You... gentlemen'' -> ''Các
    vị... thưa các quý ông'', ''I/me'' -> ''tôi'', ''we/our'' -> ''chúng ta''."]'
- segment_id: YS-LN05/Text/part0016.html/p000150
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc ''*...*'' toàn bộ đoạn suy nghĩ nội tâm
