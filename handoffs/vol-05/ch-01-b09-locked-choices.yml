choices:
- segment_id: YS-LN05/Text/part0010.html/p000261
  kind: terminology_and_voice
  value: 'locked={''terminology_and_negation'': ''Không có đủ bộ binh. Thất bại gần
    như là điều không thể tránh khỏi.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000262
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Chúng ta'', ''meaning'': ''“Chúng ta phải tránh
    cái đầm lầy này bằng mọi giá…”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000263
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Bộ Tổng tham mưu'', ''emphasis_and_meaning'':
    ''*Nhưng bằng cách nào? Đến cả Bộ Tổng tham mưu vẫn còn đang đi tìm câu trả lời
    kia mà!* Thế này đúng là tự hỏi tự trả lời. (bọc đúng hai câu đầu in nghiêng theo
    DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000264
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''terminology'': ''các sĩ quan tham mưu'',
    ''meaning'': ''Ai nấy đều hiểu khúc mắc nằm ở đâu, nhưng việc tìm ra phương thuốc
    đặc trị cho nó lại đang tỏ ra vô cùng nan giải.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000265
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''họ'', ''modality'': ''Dành thời gian để sắp xếp
    lại suy nghĩ của họ sẽ là một sự xa xỉ hoang phí.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000266
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Bạn - bạn (ngôi thứ hai giả định chung)'', ''terminology_and_negation'':
    ''không thể cứ thế thong thả trong một cuộc chiến du kích được / ập đến bất thình
    lình'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000267
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''negation'': ''Những bức điện truyền
    tới chỗ chúng ta chẳng bao giờ chịu để tâm đến lịch trình của chúng ta cả.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000268
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Salamander 05 gọi 01. Có kẻ địch mới xuất hiện!'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000269
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung úy Grantz'', ''pronouns'': ''mình (nội
    tâm tự thuật của Tanya theo DEC-P01-001)'', ''emphasis'': ''*kẻ địch* (bọc đúng
    từ in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000270
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001)'', ''meaning'':
    ''Năm chữ cái nhỏ bé ấy buộc não bộ mình phải sang số. Để bảo vệ sự an toàn cá
    nhân cho bản thân vốn yêu chuộng hòa bình này, mình phải chuẩn bị kỹ lưỡng để
    đối mặt với kẻ địch đang đe dọa nó.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000271
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi (Grantz báo cáo qua vô tuyến) / chúng (pháp
    sư địch)'', ''terminology_and_question'': ''Đơn vị pháp sư địch chưa xác minh
    đang tiếp cận từ hướng đông bắc. Có… bốn tên. Và tôi đoán… chúng đang bay NOE?'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000272
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Tôi - anh (Tanya đáp lại Grantz qua vô tuyến)'',
    ''terminology'': ''Salamander 01, nghe rõ. 05, làm tốt lắm.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000273
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001)'', ''terminology'':
    ''Kampfgruppe của mình / càn quét những kẻ địch còn sót lại'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000274
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001) / chúng'',
    ''terminology_and_modality'': ''Ắt hẳn chúng đã nhắm tới thời cơ này / trận đánh
    dưới mặt đất / các pháp sư trên không / đòn tập kích đánh nhanh rút gọn từ trên
    trời'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000275
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001) / chúng'',
    ''meaning'': ''Đó là cách tiếp cận chuẩn sách giáo khoa, tuân thủ lý thuyết một
    cách cứng nhắc. Nhờ vậy mà mình biết đây là mục tiêu chính của chúng. Dù tốt hay
    xấu thì điều đó cũng rất dễ hiểu.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000276
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya / 05'', ''pronouns'': ''cô (trần thuật ngôi thứ
    ba về Tanya) / Tôi - anh (Tanya nói với 05)'', ''question_and_terminology'': ''Rốt
    cuộc chúng có đang bay NOE hay không?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000277
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Tôi (05 báo cáo 01) / chúng'', ''meaning'': ''“05
    gọi 01. Tôi xin lỗi. Nhưng trông chúng chẳng giống đang bay cho lắm mà giống như
    đang cố bắt chước lũ vịt giữa không trung hơn…”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000278
  kind: terminology_and_voice
  value: 'locked={''question_and_meaning'': ''“01 gọi 05. Nói thế nghe còn được. Vịt
    ư?”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000279
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung úy Grantz'', ''pronouns'': ''mình (nội
    tâm của Tanya theo DEC-P01-001) / anh ta (Grantz)'', ''emphasis'': ''*Hửm.* (bọc
    đúng thán từ in nghiêng đầu đoạn theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000280
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Ngài - Chúng tôi (Grantz báo cáo Tanya) / chúng'',
    ''terminology_and_negation'': ''không giống bay bám địa hình cho lắm mà giống
    bay bằng hơn / quên khuấy mất chuyện phải dè chừng mối đe dọa từ phía trên'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000281
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi (Tanya trên vô tuyến) / chúng'', ''directives'':
    ''“À, tôi thấy chúng rồi… Được đấy, triển khai đi.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000282
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung úy Grantz'', ''pronouns'': ''mình (nội
    tâm của Tanya theo DEC-P01-001)'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000283
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001) / họ'',
    ''terminology_and_negation'': ''các pháp sư Liên bang / pháp sư trên không / chẳng
    giống đang bay lượn trên bầu trời mà giống đang chết đuối giữa không trung hơn'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000284
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''negation'': ''“…Chẳng ngờ chúng ta
    lại chạm trán một kẻ địch ngay cả việc trụ lại trên không thôi cũng đã chật vật
    thế này.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000285
  kind: terminology_and_voice
  value: 'locked={''names'': ''Grantz'', ''pronouns'': ''mình (nội tâm của Tanya theo
    DEC-P01-001)'', ''terminology_and_modality'': ''mặt trận Rhine / hẳn mình sẽ nghĩ...
    đều là mồi nhử / Có lẽ mình đã quát lại Grantz / chẳng bao giờ tưởng tượng nổi
    bốn tên pháp sư này lại chính là lực lượng tấn công chủ lực của địch'', ''emphasis'':
    ''*Nhìn kỹ hơn xem!* (bọc đúng câu quát giả định in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000286
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình (nội tâm của Tanya theo DEC-P01-001) / quân
    ta'', ''terminology_and_modality'': ''Mình sẽ nghĩ đó là một đòn tấn công quấy
    rối / cuộc tiến công lớn / đòn nghi binh đơn thuần / mặt trận Rhine / mặt trận
    phía đông / sương mù chiến tranh'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000287
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''mặt trận phía đông'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000288
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Lục quân Đế quốc'', ''meaning'': ''Quân địch
    đang chờ Lục quân Đế quốc tự vắt kiệt sức mình rồi sụp đổ.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000289
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''mình (trong suy nghĩ trực
    tiếp của Tanya) / cô (trần thuật ngôi thứ ba về Tanya)'', ''terminology'': ''đại
    đội / lực lượng quy mô cấp đại đội trên không để yểm trợ'', ''emphasis'': ''*Ý
    mình là, thôi nào* (bọc đúng cụm suy nghĩ in nghiêng đầu câu theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000290
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''meaning'': ''Và sau bao nhiêu công
    sức đó, đối thủ của chúng ta lại là… bốn tên pháp sư địch ngay cả chuyện bay lượn
    cũng còn chật vật.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000291
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''negation_and_meaning'': ''“Phe phòng
    thủ không thể biết khi nào hay từ đâu quân địch sẽ xuất hiện, nhưng chúng ta cũng
    chẳng làm gì khác được… Chuyện này sẽ gay go đây.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000292
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi (Thiếu tá Weiss) / chúng ta'', ''terminology'':
    ''tỷ lệ tiêu hao'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000293
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Tanya / Thiếu tá Weiss'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000294
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''hỏa lực có kiểm soát với quy mô cấp đại đội'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000295
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung úy Grantz'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000296
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''họ'', ''meaning'': ''“Nào, để xem tay nghề của họ
    ra sao.”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000297
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''cô (trần thuật ngôi thứ ba
    về Tanya) / họ'', ''terminology_and_negation'': ''cô không cho rằng đó là nỗi
    lo cần thiết / mặt trận Rhine'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000298
  kind: terminology_and_voice
  value: 'locked={''names'': ''Grantz'', ''pronouns'': ''Mình - mình (nội tâm của
    Tanya theo DEC-P01-001)'', ''negation'': ''Mình đâu có chậm hiểu đến mức không
    nhận ra sự tiến bộ của cấp dưới.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000299
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001)'', ''terminology'':
    ''thực chiến / Những binh sĩ và sĩ quan dưới quyền mình / những tài sản thực thụ'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000300
  kind: terminology_and_voice
  value: 'locked={''names'': ''Grantz'', ''pronouns'': ''Mình (nội tâm của Tanya theo
    DEC-P01-001) / anh ta'', ''terminology'': ''vốn con người'', ''emphasis'': ''none''}'
