    regret that heavy loss enough'' -> ''dù ông có nuối tiếc tổn thất nặng nề ấy đến
    mấy cũng không xuể''."]'
- segment_id: YS-LN05/Text/part0016.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và tên riêng: ''Imperial Army'' -> ''Lục quân Đế quốc'',
    ''General Habergram'' -> ''Tướng Habergram'', ''mole'' -> ''tên nội gián''."]'
- segment_id: YS-LN05/Text/part0016.html/p000062
  kind: terminology_and_voice
  value: 'choices=["Tên riêng: ''The Empire'' -> ''Đế quốc''; giữ đúng logic phản
    bác sự trùng hợp ngẫu nhiên."]'
- segment_id: YS-LN05/Text/part0016.html/p000063
  kind: terminology_and_voice
  value: 'choices=["Đại từ: ''he'' -> ''ông''; giữ sắc thái quyết liệt trong ý định
    trừ khử nội gián."]'
- segment_id: YS-LN05/Text/part0016.html/p000064
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''army and navy'' -> ''lục quân và hải quân'', ''human
