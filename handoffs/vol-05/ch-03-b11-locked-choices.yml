    rằng')"]
- segment_id: YS-LN05/Text/part0020.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''các tàu ngầm của Đế quốc'', ''không quân mà Đế quốc
    hằng tự hào''"]'
- segment_id: YS-LN05/Text/part0020.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Giữ câu chuyển đoạn ngắn: ''Nhưng đáng buồn thay…''"]'
- segment_id: YS-LN05/Text/part0020.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''tấn công chống hạm''; giữ mức độ ''bị hạn chế nghiêm
