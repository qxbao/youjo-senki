- segment_id: YS-LN05/Text/part0020.html/p000002
  kind: terminology_and_voice
  value: choices=["Giữ nguyên giả định trái thực tế và sự đối lập với thực tại ('Nếu
    nó đơn thuần chỉ là một chiếc tàu vận tải cao tốc thì vẫn còn dễ đối phó... Vấn
    đề là nó lại quá khổng lồ')"]
- segment_id: YS-LN05/Text/part0020.html/p000003
  kind: terminology_and_voice
  value: choices=["Giữ mốc thời gian quá khứ trước chiến tranh ('Nó vốn được đóng
    trước chiến tranh làm tàu chở khách…') và thuật ngữ 'vùng biển khơi'"]
- segment_id: YS-LN05/Text/part0020.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát ngôi thứ hai: ''bạn''; giữ phép loại trừ (''phương
    thức di chuyển nhanh nhất ngoài máy bay'')"]'
- segment_id: YS-LN05/Text/part0020.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Đại từ độc thoại nội tâm của Tanya theo DEC-P01-001: ''mình'';
    đại từ khái quát: ''bạn''", "Thuật ngữ: ''sư đoàn'', ''ba mươi hải lý một giờ''"]'
- segment_id: YS-LN05/Text/part0020.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''căn cứ hậu cần hàng hải di động''", "Nhấn mạnh Markdown
    theo DEC-P01-002: bọc ''*cung điện*'' đúng phạm vi thẻ em trong nguồn (liên kết
    với p000362 của lô trước)"]'
- segment_id: YS-LN05/Text/part0020.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Hô lệnh cho đơn vị: ''toàn tiểu đoàn''; đại từ ngôi thứ nhất số
    nhiều: ''chúng ta''; giữ phủ định ''không thể cứ để yên cho thứ đó được''"]'
- segment_id: YS-LN05/Text/part0020.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Giữ câu đáp lời phủ định dứt khoát của cấp dưới: ''Chắc chắn là
    không thể rồi!''"]'
- segment_id: YS-LN05/Text/part0020.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ và tên riêng: ''Lục quân Đế quốc'', ''cơn ác mộng chiến
    lược'', ''các hoạt động tập kích tuyến thương mại'', ''RMS *Queen of Anjou*''",
    "Nhấn mạnh Markdown theo DEC-P01-002: bọc ''*Queen of Anjou*'' đúng theo thẻ em
    trong nguồn"]'
- segment_id: YS-LN05/Text/part0020.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Đại từ tập thể trong nội tâm của Tanya: ''chúng ta''; giữ câu
    hỏi tu từ (''thì chúng ta còn biết đặt mặt mũi vào đâu?'') và tình thái bắt buộc
    (''buộc phải đánh chìm'')", "Thuật ngữ và nhấn mạnh theo DEC-P01-002: ''nhiệm
    vụ phong tỏa'', ''các đơn vị tàu ngầm'', ''RMS *Queen of Anjou*''"]'
- segment_id: YS-LN05/Text/part0020.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ trong thoại chỉ huy: ''chúng ta''; mệnh lệnh: ''Toàn tiểu
    đoàn, chuẩn bị tấn công.''"]'
- segment_id: YS-LN05/Text/part0020.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Đáp lệnh và truyền lệnh quân sự: ''Rõ! Toàn tiểu đoàn, chuẩn bị
    tấn công!''"]'
- segment_id: YS-LN05/Text/part0020.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Giữ nguyên chi tiết lỡ lời rồi tự sửa trong thoại (''chiếc chiến
