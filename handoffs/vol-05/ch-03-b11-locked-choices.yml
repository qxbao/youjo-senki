- segment_id: YS-LN05/Text/part0020.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: tự xưng ''tôi''; giữ quan hệ nguyên nhân
    – hệ quả (''Đó là trong khi đang chở lượng hàng của một chiếc tàu vận tải thông
