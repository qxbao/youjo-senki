    cơ'', ''bánh lái''"]'
- segment_id: YS-LN05/Text/part0020.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Tanya theo DEC-P01-001: ''nó''", "Giữ lối
    nhân hóa con tàu theo tên gọi (''chặn bước Nữ hoàng khi bà ta đang ung dung băng
    qua đại dương mênh mông'')"]'
- segment_id: YS-LN05/Text/part0020.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm của Tanya theo DEC-P01-001: ''Mình / mình'', ''bọn
    mình'' (đơn vị), ''chúng ta'' (phe Đế quốc)", "Thuật ngữ cơ quan: ''cơ quan tình
    báo liên hợp'', ''Cục Tác chiến''; giữ giả định nhượng bộ (''Ngay cả khi phục
    kích được đi nữa, cũng sẽ rất khó để bắt giữ được nó...'')"]'
- segment_id: YS-LN05/Text/part0020.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Đại từ trong thoại: ''chúng ta''; thuật ngữ: ''mô thức tư duy
    và công nghệ hiện có''"]'
- segment_id: YS-LN05/Text/part0020.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm của Tanya theo DEC-P01-001: ''Mình'' kết hợp phản
