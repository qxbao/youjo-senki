- segment_id: YS-LN05/Text/part0010.html/p000176
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''anh - tôi (Tanya hỏi Uger)'', ''question_and_logic'':
    ''có phải anh đang nói rằng đơn vị của tôi được lệnh đi chịu chết để xác định
    xem ai trong hai vị tướng là người đúng không?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000177
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (Uger gộp cả mình và Tanya trong tư cách
