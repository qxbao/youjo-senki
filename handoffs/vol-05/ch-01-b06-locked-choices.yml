    Tanya được biết* (bọc đúng cụm từ nhấn mạnh theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000179
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''terminology'': ''Các sĩ
