    theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000182
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger / Uger'', ''negation_and_logic'':
