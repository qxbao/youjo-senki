- segment_id: YS-LN05/Text/part0010.html/p000180
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''*noblesse oblige*'', ''emphasis'': ''*noblesse
    oblige* (bọc đúng cụm từ in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000181
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''nghe có vẻ ngạo mạn hơn nhưng cũng thực chất hơn.'',
