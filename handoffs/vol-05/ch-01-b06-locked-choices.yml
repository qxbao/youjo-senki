- segment_id: YS-LN05/Text/part0010.html/p000187
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''Chỉ mới một phút trước thôi, trong giọng nói ấy chí
    ít vẫn còn chút sinh khí, vậy mà giờ đây nó bỗng trở nên mệt mỏi rã rời.'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000188
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Bộ Tư lệnh Tối cao / Chính phủ / Văn phòng Bộ
