- segment_id: YS-LN05/Text/part0010.html/p000184
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''anh (Tanya
    gọi Trung tá Uger)'', ''question_and_modality'': ''“Xin thứ lỗi, Trung tá Uger,
    nhưng qua cách anh nói thì nghe như thể có chuyện gì đó đã xảy ra phải không?”'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000185
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi - cô (Uger nói với Tanya)'', ''terminology'':
    ''chuyện tuyệt mật / trách nhiệm đạo đức'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000186
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Anh ta (quy chiếu Uger) / mình (điểm nhìn quan sát
    nội tâm của Tanya theo DEC-P01-001)'', ''negation_and_modality'': ''thậm chí chẳng
    buồn che giấu tiếng thở dài; hẳn anh ta đang ở trong một tình trạng vô cùng tệ
