choices:
- segment_id: YS-LN05/Text/part0010.html/p000152
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng (kẻ địch) / phe ta - mình / chúng ta'', ''condition_and_logic'':
    ''Nếu kẻ địch không thể tận dụng hiệu quả thời gian của chúng… và nếu phe ta có
    thể tận dụng hiệu quả thời gian của mình… thì việc chúng ta tái tổ chức và xây
    dựng một nền tảng vững chắc hơn sẽ mang lại lợi ích'', ''emphasis'': ''*Nếu* /
    *không thể* / *nếu* / *có thể* (bọc đúng bốn vị trí nhấn mạnh theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000153
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''đúng là cả một tràng giả định nối đuôi nhau. Thật
    tình, có quá nhiều ẩn số.'', ''emphasis'': ''*Nếu, nếu* (bọc đúng cụm từ nhấn
    mạnh đầu câu theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000154
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''tôi (Tanya
    xưng với Trung tá Uger)'', ''question'': ''“Trung tá Uger, tôi có thể nói đôi
    lời được không?”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000155
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Anh ta (quy chiếu Uger) / cô - mình (quy chiếu Tanya
    trong trần thuật ngôi thứ ba)'', ''negation'': ''Cũng chẳng phải cô lấy làm vui
    vẻ gì khi thấy cái gật đầu đó trước lúc tung ra điều vẫn làm mình bận tâm bấy
    lâu nay'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000156
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''tôi - anh (Tanya nói với Uger) / chúng tôi (đơn
    vị của Tanya, ngôi thứ nhất số nhiều loại trừ)'', ''terminology'': ''hộ tống đại
    quân chủ lực / Bộ Tổng tham mưu'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000157
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''điều chuyển khỏi tiền tuyến / người bạn đồng
    môn cũ'', ''negation'': ''Không tài nào xem chuyện bị điều chuyển khỏi tiền tuyến
    rồi lại đón một chuyến viếng thăm từ người bạn đồng môn cũ chỉ là sự trùng hợp
    đơn thuần được'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000158
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (độc thoại nội tâm của Tanya theo DEC-P01-001)'',
    ''negation_and_logic'': ''Suy diễn quá mức về các sự việc sẽ chỉ dụ mình thêu
    dệt nên một thuyết âm mưu lố bịch mà thôi. Nhưng nếu bảo ở đây chẳng có sự sắp
    đặt có chủ đích nào thì lại là nói dối.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000159
  kind: terminology_and_voice
  value: 'locked={''ranks_and_pronouns'': ''các vị tướng / Cả hai ông ấy'', ''terminology'':
    ''những người thực dụng / lý thuyết suông'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000160
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Tôi (Tanya)'', ''terminology'': ''quân nhân / chiến
    trường thực tế'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000161
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá von Degurechaff'', ''pronouns'':
    ''tôi - cô (Uger nói với Tanya) / Họ - mình (hai vị tướng)'', ''negation_and_logic'':
    ''Họ không muốn một cuộc va chạm giữa các lý thuyết mà muốn kiểm chứng ý tưởng
    của mình ngay trên chiến trường'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000162
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Tanya / Trung tá Uger'', ''emphasis'': ''*kiểm
    chứng* / *Không, khoan đã. Kiểm chứng mọi thứ trên chiến trường có nghĩa là…*
    (bọc đúng hai phần chữ nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000163
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''họ (hai vị tướng)'', ''terminology'': ''trinh sát
    quân địch'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000164
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (trong lời thoại của Tanya) / họ (cấp trên)'',
    ''terminology_and_question'': ''đệ trình một kháng nghị chính thức / Chúng ta
    đào đâu ra thời gian cho việc đó chứ?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000165
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''cô (Uger gọi Tanya) / chúng ta'', ''terminology_and_logic'':
    ''dù chúng ta tiến công hay phòng ngự thì việc chuẩn bị binh lực cũng đều tốn
    thời gian… nghĩa là vẫn có thời gian cho một cuộc khảo sát'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000166
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''cô (trần thuật ngôi thứ ba về Tanya)'', ''meaning'':
    ''Linh cảm chẳng lành của cô về chuyện này bắt đầu gióng lên hồi chuông cảnh báo,
    nhưng đã quá muộn rồi.'', ''emphasis'': "*Hự.* hoặc *Khốn thật.* (sửa từ ''*Ái
    chà.*'' để đúng sắc thái tiếng rên bực dọc và giữ chữ nghiêng theo DEC-P01-002)"}'
- segment_id: YS-LN05/Text/part0010.html/p000167
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''họ (hai vị tướng) / của cô (Uger nói với Tanya)'',
    ''terminology'': ''vật tư tiếp tế đang được tích trữ / Kampfgruppe / thăm dò kẻ
    địch'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000168
  kind: terminology_and_voice
  value: 'locked={''terminology_and_question'': ''“Trinh sát chiến đấu sao?”'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000169
  kind: terminology_and_voice
  value: 'locked={''negation_and_terminology'': ''Không hẳn. Đó là một nhiệm vụ phòng
    ngự tại một mũi lồi.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000170
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''meaning'': ''Tanya biết nhìn trừng trừng
    vào người khác là thiếu lịch sự.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000171
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''Dù vậy…'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000172
  kind: terminology_and_voice
  value: 'locked={''ranks_and_names'': ''Trung tá Uger'', ''pronouns'': ''cô - mình
