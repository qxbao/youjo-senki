    thể nào biết được...''; ''các đánh giá tình báo con người'' (human intelligence
    assessments), ''những biện pháp thu thập tình báo hợp pháp'' (legal means of intelligence
    collection), ''SIGINT''."]'
- segment_id: YS-LN05/Text/part0018.html/p000329
  kind: terminology_and_voice
  value: 'locked=["Giữ câu kết luận nội tâm ngắn gọn: ''Thế nên cố bận tâm về chuyện
    đó chỉ tổ phí chất xám.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000330
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, xưng hô & cấu trúc điều kiện nghi vấn: gọi ''thưa Trung
    tá'' (Colonel), dùng ''chúng ta'', kết câu bằng ''không ạ?''; giữ mệnh đề điều
