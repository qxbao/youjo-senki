  kind: terminology_and_voice
  value: 'locked=["Tên riêng, đại từ thoại & sắc thái khẩu ngữ: ''Tanya'', tự xưng
    ''tôi''; ''cái cơ quan tình báo lục quân và hải quân gì đó'' (the army and navy
    intelligence agency or whatever), ''một lũ ăn bám'' (freeloaders)."]'
- segment_id: YS-LN05/Text/part0018.html/p000318
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, quân hàm, tình thái & tổ chức: Serebryakov gọi Tanya bằng
    ''Trung tá'' (you / Colonel), tự xưng ''tôi'', kèm tiểu từ lễ phép ''ạ''; giữ
    tình thái ''có lẽ'' (might be); ''bên Tình báo'' (Intelligence)."]'
- segment_id: YS-LN05/Text/part0018.html/p000319
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, đại từ trần thuật & địa danh/tổ chức: ''Serebryakov'',
    ''nó'' (Tanya, DEC-P01-001), ''mặt trận Rhine'' (Rhine front), ''bộ chỉ huy cùng
    Bộ Tổng tham mưu'' (command and the General Staff)."]'
- segment_id: YS-LN05/Text/part0018.html/p000320
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn bộ câu trong ''*...*''
