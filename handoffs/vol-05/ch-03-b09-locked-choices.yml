    chúng''."]'
- segment_id: YS-LN05/Text/part0018.html/p000331
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, đại từ & cấu trúc điều kiện: Tanya gọi ''Visha'', dùng
    ''chúng ta'', ''cấp trên'' (the top); giữ mệnh đề điều kiện ''Nếu cấp trên đưa
    cho chúng ta một số tin tức tình báo rồi ra lệnh xuất kích, thì việc bận tâm xem
    tin tức đó lấy từ đâu là hoàn toàn vô nghĩa.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000332
  kind: terminology_and_voice
  value: 'locked=["Giữ câu trần thuật ngắn: ''Một tiếng thở dài nặng nề vang lên.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000333
  kind: terminology_and_voice
  value: 'locked=["Điểm nhìn kép, quân hàm & đại từ: câu đầu trần thuật dùng ''họ''
    và ''Trung úy Grantz'' (Lieutenant Grantz); câu hai chuyển sang nội tâm ngôi thứ
    nhất của Tanya dùng ''Mình'' (DEC-P01-001) và quy chiếu Grantz bằng ''anh ta''."]'
- segment_id: YS-LN05/Text/part0018.html/p000334
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & quân hàm trong lời nhắc nhở của Weiss với Grantz: tự
    xưng ''tôi'', gọi ''anh'' và ''Trung úy Grantz'' (Lieutenant Grantz)."]'
- segment_id: YS-LN05/Text/part0018.html/p000335
  kind: terminology_and_voice
  value: 'locked=["Quân hàm & nét ngập ngừng trong lời đáp của Grantz: ''“Th-Thiếu
    tá Weiss, nói thế thì hơi…”'' (M-Major Weiss)."]'
- segment_id: YS-LN05/Text/part0018.html/p000336
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, tình thái & phủ định: ''Weiss''; giữ tình thái ''hẳn''
    (probably), phủ định ''không thể chịu nổi'' và ''Lạc quan thì chẳng có gì sai,
    nhưng còn tùy vào hoàn cảnh nữa.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000337
  kind: terminology_and_voice
  value: 'locked=["Nhấn mạnh Markdown & tên riêng: chỉ bọc ''*Không.*'' trong ''*...*''
    đúng theo thẻ em của nguồn (DEC-P01-002); phần dẫn trần thuật ''Tanya chợt nghĩ
    lại.'' để chữ thường."]'
- segment_id: YS-LN05/Text/part0018.html/p000338
  kind: terminology_and_voice
  value: 'locked=["Điểm nhìn kép, đại từ & nhấn mạnh Markdown: câu một là trần thuật
    dùng ''họ'' và phủ định ''vẫn chưa chạm trán kẻ địch'' (chữ thường); câu hai là
    độc thoại nội tâm bọc toàn bộ ''*Nếu Weiss đang đùa vui, thì mình cũng sẽ nhập
    cuộc luôn.*'' trong ''*...*'' và tự xưng ''mình'' đúng theo DEC-P01-001, DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0018.html/p000339
  kind: terminology_and_voice
  value: 'locked=["Quân hàm, xưng hô & cấu trúc điều kiện/câu hỏi: Tanya xưng ''Tôi'',
    gọi ''Thiếu tá Weiss'' (Major Weiss), gọi ''Trung úy Grantz'' (Lieutenant Grantz)
    và ''anh''; giữ mệnh đề điều kiện phủ định ''nếu anh không dùng đến cái đầu của
    mình, vậy nghĩa là anh chẳng mệt mỏi chút nào đâu nhỉ?'' và câu gợi ý tiếp theo."]'
- segment_id: YS-LN05/Text/part0018.html/p000340
  kind: terminology_and_voice
  value: 'locked=["Xưng hô & nét lắp bắp trong câu nói của Grantz với Tanya: ''“T-tôi
    xin tha có được không ạ?”''."]'
- segment_id: YS-LN05/Text/part0018.html/p000341
  kind: terminology_and_voice
  value: 'locked=["Tên riêng & tình thái suy đoán: ''Hẳn Grantz đã đủ quen với chiến
    trường để nhận ra sự thay đổi trong giọng điệu.''."]'
