    dịch.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000327
  kind: terminology_and_voice
  value: 'locked=["Đại từ khái quát ngôi thứ hai & quan hệ đối lập: ''Bạn có thể phỏng
    đoán đôi điều, nhưng thế giới gián điệp vốn dĩ xoay quanh sự lừa gạt.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000328
  kind: terminology_and_voice
  value: 'locked=["Giả định, phủ định, đại từ tập thể & thuật ngữ: giữ cấu trúc giả
