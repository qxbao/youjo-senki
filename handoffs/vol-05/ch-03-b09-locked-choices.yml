    subs), ''một tàu địch'' (an enemy ship); giữ tình thái ''có vẻ đáng tin cậy hơn
    nhiều''."]'
- segment_id: YS-LN05/Text/part0018.html/p000324
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & sắc thái lễ phép trong câu hỏi của Serebryakov: ''Khối
