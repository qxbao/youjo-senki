- segment_id: YS-LN05/Text/part0018.html/p000303
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật, phủ định & điều kiện: ''nó'' (DEC-P01-001),
    ''họ''; giữ phủ định ''Nói vậy không có nghĩa là nó bảo họ được phép uống thỏa
    thích'' và mệnh đề điều kiện ''miễn là họ giữ được chừng mực''; thuật ngữ: ''căng
    tin'' (canteen), ''giá niêm yết chính thức'' (official price)."]'
- segment_id: YS-LN05/Text/part0018.html/p000304
  kind: terminology_and_voice
  value: 'locked=["Điểm nhìn kép, đại từ & thuật ngữ: câu đầu trần thuật ngôi thứ
    ba dùng ''nó'' (DEC-P01-001), câu hai chuyển sang bình luận nội tâm ngôi thứ nhất
    dùng ''của mình'' (DEC-P01-001); giữ dấu ngoặc kép quanh ''“Quỹ Mật phí Bộ Tổng
    tham mưu”'' (General Staff Confidential Funds); ''Bộ Tư lệnh Lục quân'' (Army
    Command), ''Cục Thanh tra'' (Inspection Division)."]'
- segment_id: YS-LN05/Text/part0018.html/p000305
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, tình thái phủ định & thuật ngữ: ''Tanya''; giữ phủ định
    mỉa mai ''đời nào lại có thể uống rượu được cơ chứ'' và ''chỉ đơn thuần là chi
    phí vận hành nhằm vực dậy sĩ khí mà thôi'' (operation costs to boost morale)."]'
- segment_id: YS-LN05/Text/part0018.html/p000306
  kind: terminology_and_voice
  value: 'locked=["Độc thoại nội tâm, giả định & câu hỏi tu từ: tự xưng ''mình'' (DEC-P01-001),
    không bọc ''*...*'' vì nguồn không in nghiêng (DEC-P01-002); giữ cấu trúc giả
    định ''nếu mình có cách biển thủ tiền bạc, mình sẽ biển thủ nhiều hết mức có thể
    rồi tính sau'' và hai câu hỏi tu từ."]'
- segment_id: YS-LN05/Text/part0018.html/p000307
  kind: terminology_and_voice
  value: 'locked=["Tổ chức, cấp bậc, tình thái & phủ định: ''Bộ Tư lệnh Lục quân''
    (Army Command), ''Viên đại úy'' (The captain), ''Tanya''; giữ tình thái ''xem
    ra'' (apparently) và phủ định ''đã không phạm sai lầm nào''."]'
- segment_id: YS-LN05/Text/part0018.html/p000308
  kind: terminology_and_voice
  value: 'locked=["Đại từ trần thuật, tên riêng & thuật ngữ: ''nó'' (DEC-P01-001),
    ''Weiss'', ''mật lệnh niêm phong'' (sealed orders)."]'
