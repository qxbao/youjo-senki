  kind: terminology_and_voice
  value: 'locked=["Cấp bậc, tên riêng & đại từ: ''Viên đại úy'' (The captain), ''anh
    ta'', ''Weiss và Tanya'', ''hai Trung úy Serebryakov và Grantz'' (First Lieutenants
    Serebryakov and Grantz)."]'
- segment_id: YS-LN05/Text/part0018.html/p000310
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ, tổ chức & phủ định: ''bên Tình báo'' (Intelligence),
    ''Bộ Tổng tham mưu'' (General Staff), ''cơ quan tình báo liên hợp'' (joint intelligence
    agency), ''họ''; giữ cấu trúc phủ định nhượng bộ ''Mà sau khi đã nhận lệnh...
    thì họ cũng chẳng thể từ chối được, nhưng dẫu sao đi nữa.''."]'
- segment_id: YS-LN05/Text/part0018.html/p000311
  kind: terminology_and_voice
  value: 'locked=["Đơn vị, số lượng & địa danh: ''bốn mươi tám thành viên của Tiểu
    đoàn Pháp sư Trên không số 203'' (the forty-eight members of the 203rd Aerial
    Mage Battalion), ''Biển Bắc'' (Northern Sea)."]'
- segment_id: YS-LN05/Text/part0018.html/p000312
  kind: terminology_and_voice
  value: 'locked=["Phủ định, thuật ngữ & đại từ tập thể: giữ phủ định ''Không hề có
    tạp âm vô tuyến hay trở ngại nào đối với tín hiệu tầm xa''; ''Đài Kiểm soát Norden''
    (Norden Control), ''hỗ trợ dẫn đường'' (navigation support), đại từ tập thể đơn
    vị ''chúng tôi''."]'
- segment_id: YS-LN05/Text/part0018.html/p000313
  kind: terminology_and_voice
  value: 'locked=["Xưng hô, quân hàm & thuật ngữ: Serebryakov gọi Tanya là ''Thưa
    Trung tá'' (Colonel), dùng đại từ gộp ''chúng ta''; ''tin phát sóng diện rộng''
    (wide-area broadcast), ''Đài Kiểm soát Norden'' (Norden Control), ''Phương án
    C43'' (Case C43)."]'
- segment_id: YS-LN05/Text/part0018.html/p000314
  kind: terminology_and_voice
  value: 'locked=["Thuật ngữ & đại từ: ''Phương án C43'' (Case C43), ''chúng ta''."]'
- segment_id: YS-LN05/Text/part0018.html/p000315
  kind: terminology_and_voice
  value: 'locked=["Tên riêng, chức danh, quân hàm, tổ chức & tình thái: ''Tanya'',
    phản thân ''mình'', ''sĩ quan phụ tá'' (adjutant), ''Trung úy Serebryakov'' (Lieutenant
    Serebryakov), ''Phương án C43'' (Case C43), ''đơn vị tàu ngầm'' (sub unit), ''cơ
    quan tình báo liên hợp của Bộ Tư lệnh Lục quân và Hải quân'' (Army and Navy Commands’
    joint intelligence agency); giữ tình thái ''Xem ra'' (Apparently) và cặp đối lập
    ''cơ cấu tổ chức theo chiều dọc'' / ''hỗ trợ lẫn nhau theo chiều ngang''."]'
- segment_id: YS-LN05/Text/part0018.html/p000316
  kind: terminology_and_voice
  value: 'locked=["Giữ sắc thái cảm thán mỉa mai: ''…Phải, họ quả thực có năng lực
