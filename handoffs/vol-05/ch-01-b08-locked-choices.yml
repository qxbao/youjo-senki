choices:
- segment_id: YS-LN05/Text/part0010.html/p000224
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''khu vực lồi ra / Kampfgruppe / quân số bộ binh
    hạn chế'', ''meaning'': ''Khi bàn đến chuyện giữ vững một khu vực lồi ra vô thời
    hạn, Kampfgruppe này với quân số bộ binh hạn chế của nó đã nắm chắc phần thất
    bại.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000225
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''“…Vẫn là tình thế tiến thoái lưỡng nan y hệt.”'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000226
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''terminology_and_negation'': ''phòng thủ
    một căn cứ / lối đánh cơ động chủ động tấn công / Họ không có đủ quân để chỉ co
    cụm phòng ngự.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000227
  kind: terminology_and_voice
  value: 'locked={''negation_and_terminology'': ''Mà họ cũng chẳng dư dả nhân lực
    để tiến công và chốt giữ các vị trí chiến lược.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000228
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''quân ta / Chúng ta - mình (Tanya nói với đơn vị)'',
    ''negation_and_logic'': ''chia nhỏ lực lượng là điều không thể bàn tới / Chúng
    ta không thể để lực lượng vốn đã mỏng của mình bị tỉa dần từng đơn vị một được.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000229
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Lục quân Đế quốc / mặt trận phía đông / dưới
    dạng thu nhỏ'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000230
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''terminology'': ''Chiến dịch Chim Hoàng
    Yến / Nghiên cứu về việc Sử dụng các Kampfgruppe cho Chiến thuật Phòng thủ Căn
    cứ trong Thực chiến'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000231
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Bộ Tổng tham mưu / mặt trận rộng lớn / số lượng
    binh lực hạn chế'', ''negation_and_modality'': ''chẳng mang lại hiệu quả gì /
    xem ra Bộ Tổng tham mưu cứ phải tiến hành một cuộc thử nghiệm'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000232
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta (độc thoại nội tâm ngôi thứ nhất số nhiều)'',
    ''terminology_and_negation'': ''các chiến tuyến chính / giai đoạn tĩnh tại / Đế
    quốc / Liên bang / các chiến dịch quy mô cấp quân đoàn / mặt trận phía đông hoàn
    toàn yên tĩnh'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000233
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''cô (trần thuật ngôi thứ ba về Tanya)'', ''emphasis_and_negation'':
    ''*Nhưng nói vậy cũng không hẳn là đúng*, cô thở dài nghĩ bụng. (bọc đúng vế nội
    tâm in nghiêng theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000234
  kind: terminology_and_voice
  value: 'locked={''negation_and_logic'': ''Chỉ vì một trận đánh không đáng để đưa
    vào sách giáo khoa không có nghĩa là nó diễn ra êm đẹp và gọn ghẽ.'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000235
  kind: terminology_and_voice
  value: 'locked={''terminology_and_directives'': ''“Bắt đầu càn quét đi và nhớ xử
    lý cho hết số còn lại! Cẩn thận đấy!”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000236
  kind: terminology_and_voice
  value: 'locked={''terminology'': ''Các vị chỉ huy / cảnh giác lục soát'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000237
  kind: terminology_and_voice
  value: 'locked={''negation_and_question'': ''không phải để tận hưởng tiết trời mùa
    thu, mà là đang dùng lưỡi lê đâm xuyên qua những kiện cỏ khô vừa mới thu hoạch
    và lục soát từng căn nhà để tìm lính địch đang ẩn nấp. Liệu khoảnh khắc này có
    được ghi vào sử sách không?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000238
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''hắn (chỉ lính địch ẩn nấp)'', ''directives'': ''“Ở
    đây có một tên! Đừng để hắn chạy thoát!”'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000239
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Chúng ta - hắn'', ''directives'': ''“Tóm lấy hắn!
    Chúng ta sẽ bắt hắn phải khai ra tên của tất cả những kẻ cùng hội cùng thuyền!”'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000240
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (tự thuật nội tâm của Tanya theo DEC-P01-001)
    / họ (binh lính Đế quốc) / hắn (tên địch)'', ''negation_and_modality'': ''Nghe
    chừng họ đã không bắt sống được hắn.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000241
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Mình - mình / chúng ta / họ'', ''terminology'':
    ''thu thập tin tức tình báo / Kampfgruppe của mình / cuộc chiến sinh tử'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000242
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta - ta'', ''question_and_negation'': ''…Hay
    có lẽ vấn đề đầu tiên đáng phải phàn nàn là chuyện kẻ địch của chúng ta vốn chẳng
    phải những kẻ mà ta có thể bắt làm tù binh?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000243
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta / mình (nội tâm của Tanya theo DEC-P01-001)
    / họ'', ''terminology_and_negation'': ''dân quân không chính quy / không có quyền
    được bắt làm tù binh / luật điều chỉnh chiến tranh / những toán ô hợp / không
    có quyền tham chiến hợp pháp'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000244
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình (nội tâm của Tanya theo DEC-P01-001)'', ''terminology_and_modality'':
    ''luật chiến tranh / có khả năng cao bị giết và chắc chắn bị giết vẫn là hai chuyện
    khác nhau'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000245
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''logic_and_negation'': ''Nếu đối phương
    biết cái chết là điều cầm chắc, các đợt phản kích của họ sẽ lại càng liều mạng
    hơn. Có điều gì đó bất ổn với hiện trạng không giết thì bị giết này… nhưng việc
    chúng ta chẳng thể làm gì để thay đổi nó lại càng khiến mọi chuyện tồi tệ hơn.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000246
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''terminology'': ''cuộc chiến tiêu hao / người
    chỉ huy cảnh giác'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000247
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''cô (trần thuật ngôi thứ ba về Tanya) / hắn (tên
    lính địch)'', ''meaning'': ''Và ở đằng trước, cô chứng kiến cảnh lính của mình
    đang vung xẻng bổ xuống thi thể một tên lính địch để chắc chắn rằng hắn đã chết.'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000248
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''terminology'': ''mặt trận phía đông / chiến
    tranh phi chính quy'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000249
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta'', ''terminology'': ''mũi lồi'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000250
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''chúng ta / họ'', ''terminology_and_question'': ''các
    lực lượng quân sự chính quy / chiến tranh phi quy ước / Hay có lẽ chúng ta nên
    nói theo kiểu triết lý rằng họ đã buộc phải thay đổi?'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000251
  kind: terminology_and_voice
  value: 'locked={''emphasis_and_meaning'': ''*Vì chúng ta buộc phải làm thế* là một
    cụm từ gây ra những biến đổi đột ngột ở con người. (bọc đúng cụm từ in nghiêng
    theo DEC-P01-002)''}'
- segment_id: YS-LN05/Text/part0010.html/p000252
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''mình - chúng ta (nội tâm của Tanya theo DEC-P01-001)'',
    ''terminology_and_negation'': ''chẳng có ngày nào trôi qua mà chúng ta không bị
    tấn công / Các đơn vị biệt kích của Liên bang / chiến dịch càn quét'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000253
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Chúng ta'', ''terminology_and_negation'': ''Kampfgruppe
    Salamander / các trận cơ động / hoàn toàn không phù hợp với kiểu nhiệm vụ chống
    nổi dậy này'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000254
  kind: terminology_and_voice
  value: 'locked={''meaning'': ''Nói một cách cực đoan thì chuyện này chẳng khác nào
    cử kỵ binh đi công hạ một pháo đài.'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000255
  kind: terminology_and_voice
  value: 'locked={''ranks'': ''Thưa Trung tá (cấp dưới báo cáo với Tanya)'', ''pronouns'':
    ''chúng tôi - bọn chúng'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000256
  kind: terminology_and_voice
  value: 'locked={''question_and_terminology'': ''“Có pháp sư địch nào không?”'',
    ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000257
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''Chúng tôi - Tôi (cấp dưới trả lời Tanya)'', ''terminology_and_negation'':
    ''Chúng tôi không thấy ai cả / lực lượng du kích gồm toàn dân quân'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000258
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''cô (trần thuật ngôi thứ ba
    về Tanya)'', ''negation'': ''mọi chuyện đang diễn biến chẳng mấy suôn sẻ'', ''emphasis'':
    ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000259
  kind: terminology_and_voice
  value: 'locked={''pronouns'': ''họ / cô (Tanya)'', ''terminology_and_modality'':
    ''quân chính quy đối đầu với quân chính quy / Kampfgruppe Salamander / đơn vị
    Liên bang có quy mô tương đương'', ''emphasis'': ''none''}'
- segment_id: YS-LN05/Text/part0010.html/p000260
  kind: terminology_and_voice
  value: 'locked={''names'': ''Tanya'', ''pronouns'': ''cô / Họ'', ''terminology_and_negation'':
    ''Họ không có đủ nhân lực để đảm bảo an ninh cho cả một khu vực bằng cách rà soát
    từng ngóc ngách nhằm lùng bắt quân kháng chiến và nhổ cỏ từng tên du kích một.'',
    ''emphasis'': ''none''}'
