- segment_id: YS-LN05/Text/part0025.html/p000536
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô mệnh lệnh của Tanya với Trung úy Grantz: tự xưng "Tôi",
    gọi "anh", số nhiều "chúng ta".'', ''Tên riêng & cấp bậc: "đại đội của Wüstemann"
    (Wüstemann’s company), "Trung úy Tospan" (Lieutenant Tospan), "cái gã Thon ngu
    xuẩn hết chỗ nói kia" (that bottomless idiot Thon).'', ''Thuật ngữ & mệnh lệnh:
    "tiếp quản quyền chỉ huy" (take over ... command), "mặt trận Rhine" (the Rhine),
    "Phòng thủ, không được lùi bước, đánh bật chúng ra!".'']'
- segment_id: YS-LN05/Text/part0025.html/p000537
  kind: terminology_and_voice
  value: 'choices=[''Hô đáp của Trung úy Grantz với Tanya: "Rõ, thưa Trung tá!" (Yes,
    ma’am!).'']'
- segment_id: YS-LN05/Text/part0025.html/p000538
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ tên "Grantz", "chào đáp lễ" (salute), "Nhận lệnh,
    xác nhận, rồi kiên quyết hành động không một lời phàn nàn."'']'
- segment_id: YS-LN05/Text/part0025.html/p000539
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Trong khi đó…*", giữ phần
    trần thuật ngoài dấu sao.'', ''Cấp bậc & tên riêng: "Tanya", "Trung úy Tospan"
    (Lieutenant Tospan).'']'
- segment_id: YS-LN05/Text/part0025.html/p000540
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tospan với Tanya: "Đại úy Thon" (Captain Thon), "đình
    chỉ chức vụ" (suspended), giữ sắc thái lễ phép "sao ạ?!".'']'
- segment_id: YS-LN05/Text/part0025.html/p000541
  kind: terminology_and_voice
  value: 'choices=[''Thoại khẳng định dứt khoát của Tanya: "Tất nhiên là thế rồi!".'']'
- segment_id: YS-LN05/Text/part0025.html/p000542
  kind: terminology_and_voice
  value: 'choices=[''Xưng hô của Trung úy Tospan với Tanya: gọi "ngài", "trung tá"
    (lieutenant colonel), nhắc "Đại úy Thon" (Captain Thon).'']'
- segment_id: YS-LN05/Text/part0025.html/p000543
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: số nhiều "bọn mình",
    gọi Tospan khi đang tức giận là "Tên đầu đất này" / "hắn", không thêm dấu sao
    khi nguồn không in nghiêng.'']'
- segment_id: YS-LN05/Text/part0025.html/p000544
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Tospan: gọi "Trung úy Tospan!", tự xưng "Tôi",
    gọi "Đại úy Thon" là "anh ta".'', ''Thuật ngữ & phủ định: "không hề cho phép ...
    rời bỏ vị trí của mình", "vành đai phòng ngự" (perimeter), "tước quyền chỉ huy"
    (stripped of his command).'']'
- segment_id: YS-LN05/Text/part0025.html/p000545
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tospan: gọi "Đại úy Thon" là "Anh ấy", thuật ngữ "hành
    động theo quyền tự quyết" (acting on his own discretion), "thẩm quyền" (authority).'']'
- segment_id: YS-LN05/Text/part0025.html/p000546
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Tên ngốc này.*"'']'
- segment_id: YS-LN05/Text/part0025.html/p000547
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya: tự xưng "Tôi", gọi Thon là "anh ta".'', ''Thuật
    ngữ & phủ định: "bảo vệ trận địa này" (defend this position), "không đi đúng với
    ý đồ của người ra lệnh thì không được tính là hành động theo quyền tự quyết",
    "bất tuân thượng lệnh" (defying orders).'']'
- segment_id: YS-LN05/Text/part0025.html/p000548
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tospan: gọi Tanya là "ngài", gọi Thon là "anh ấy".'',
    ''Cấp bậc & thuật ngữ: "Thiếu tá Weiss" (Major Weiss), "tuyến tuần tra tiền tiêu"
    (forward patrol line).'']'
- segment_id: YS-LN05/Text/part0025.html/p000549
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Tospan: "Trung úy Tospan", gọi "anh".'']'
- segment_id: YS-LN05/Text/part0025.html/p000550
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tospan với Tanya: tự xưng "tôi", gọi "ngài, thưa Trung
    tá!" (you, Colonel!), giữ đúng điều kiện giả định "Nếu không nghiêm túc thì tôi
    đã chẳng nói...".'']'
- segment_id: YS-LN05/Text/part0025.html/p000551
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Tên khốn này.*"'']'
- segment_id: YS-LN05/Text/part0025.html/p000552
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Tospan: gọi "Anh", tự xưng "tôi".'', ''Thuật
    ngữ: "tuyến tuần tra tiền tiêu" (forward patrol line), "trận địa" (position),
    "tòa án quân sự" (court-martial).'']'
- segment_id: YS-LN05/Text/part0025.html/p000553
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tospan với Tanya: gọi "ngài".'']'
- segment_id: YS-LN05/Text/part0025.html/p000554
  kind: terminology_and_voice
  value: 'choices=[''Phân tách điểm nhìn theo DEC-P01-001: câu đầu độc thoại nội tâm
    dùng "Mình"; câu thứ hai trần thuật nêu tên "Tanya", gọi Tospan là "hắn"; trong
    thoại Tanya tự xưng "Tôi", gọi Tospan là "anh".'']'
- segment_id: YS-LN05/Text/part0025.html/p000555
  kind: terminology_and_voice
  value: 'choices=[''Đại từ theo DEC-P01-001: trần thuật gọi Tanya là "Nó".'', ''Nhấn
    mạnh Markdown theo DEC-P01-002: "*Anh liệu hồn mà chuẩn bị tinh thần đón nhận
    những gì sắp xảy đến đi*", giữ phần dẫn trần thuật và dấu chấm câu cuối ngoài
    dấu sao.'']'
- segment_id: YS-LN05/Text/part0025.html/p000556
  kind: terminology_and_voice
  value: 'choices=[''Đại từ theo DEC-P01-001: trần thuật gọi Tanya là "nó", gọi Tospan
    là "hắn" / "tên đầu đất đó".'', ''Thoại chỉ huy của Tanya: số nhiều "Chúng ta",
    gọi "Đại úy Thon" là "anh ta".'', ''Thuật ngữ: "mất tích trong chiến đấu" (missing
    in action / MIA), "ban chỉ huy Kampfgruppe" (Kampfgruppe command).'']'
- segment_id: YS-LN05/Text/part0025.html/p000557
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng "mình",
    số nhiều "bọn mình", gọi Thon là "hắn".'']'
- segment_id: YS-LN05/Text/part0025.html/p000558
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ tên "Tanya" và phản thân "mình".'']'
- segment_id: YS-LN05/Text/part0025.html/p000559
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & thuật ngữ: "Đại úy Ahrens" (Captain Ahrens), "tân binh"
    (newbies).'']'
- segment_id: YS-LN05/Text/part0025.html/p000560
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya trước các sĩ quan: tự xưng "tôi".'']'
- segment_id: YS-LN05/Text/part0025.html/p000561
  kind: terminology_and_voice
  value: 'choices=[''Thoại ngắn: "Hả?" (Huh?).'']'
- segment_id: YS-LN05/Text/part0025.html/p000562
  kind: terminology_and_voice
  value: 'choices=[''Thoại phổ biến tình hình của Tanya: gọi "Hỡi các sĩ quan" (Officers),
    số nhiều "Chúng ta" / "chúng ta".'']'
- segment_id: YS-LN05/Text/part0025.html/p000563
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: "vành đai phòng ngự" (defensive perimeter), "các sĩ
    quan cùng hạ sĩ quan" (officers and noncommissioned officers).'']'
- segment_id: YS-LN05/Text/part0025.html/p000564
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: "tân binh" (newbies), "trận đánh đêm" (night battle).'']'
- segment_id: YS-LN05/Text/part0025.html/p000565
