- segment_id: YS-LN05/Text/part0025.html/p000568
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: số nhiều "bọn mình".'']'
- segment_id: YS-LN05/Text/part0025.html/p000569
  kind: terminology_and_voice
  value: 'choices=[''Đại từ giả định khái quát: dùng "bạn" cho chủ ngữ giả định chung
