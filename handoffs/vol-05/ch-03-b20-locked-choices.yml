  value: 'choices=["Điểm nhìn & cấu trúc: câu khẳng định ngắn trong độc thoại nội
    tâm ''Là kết quả.''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0020.html/p000417
  kind: terminology_and_voice
  value: 'choices=["Phủ định & dấu câu: giữ dấu hai chấm và dấu chấm lửng ''Kết quả:
    Không có nó… thì tất cả chỉ là công cốc.''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0020.html/p000418
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phân biệt khái niệm: phân biệt ''good sense'' (''lương
    tri'') với ''conscience'' (''lương tâm''); ''rational'' -> ''hợp lý''; ''goodwill''
    -> ''thiện chí''; ''ego'' -> ''cái tôi''.", "Điểm nhìn & đại từ: độc thoại nội
    tâm của Tanya dùng đại từ tự quy chiếu ''mình'' theo DEC-P01-001; không có chữ
    nghiêng."]'
- segment_id: YS-LN05/Text/part0020.html/p000419
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái: giữ đánh giá gay gắt ''Đúng là rác rưởi.'' và
    ẩn dụ ''Đắm chìm trong sự tự mãn rồi tự liếm láp vết thương chỉ là bằng chứng
    cho sự bất tài mà thôi.''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0020.html/p000420
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & đối tượng câu hỏi: giữ dấu chấm lửng mở đầu và câu
    hỏi truy vấn của Tanya về báo cáo tàu ngầm quân ta chặn con tàu địch; dùng ''quân
    ta''."]'
- segment_id: YS-LN05/Text/part0020.html/p000421
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: tự thuật nội tâm dùng ''mình'' theo DEC-P01-001;
    không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0020.html/p000422
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''vice commander'' -> ''phó chỉ huy''; tự
    thuật nội tâm dùng ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0020.html/p000423
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & tên riêng: ''Major Weiss'' -> ''Thiếu tá Weiss''."]'
- segment_id: YS-LN05/Text/part0020.html/p000424
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nghĩa: giữ câu thoại bỏ lửng ''“Chuyện là…”'',
    quy chiếu Weiss bằng ''Anh ta'', tự thuật của Tanya dùng ''Mình''; diễn đạt chính
    xác trạng thái Weiss lúng túng gặp khó khăn khi trả lời."]'
- segment_id: YS-LN05/Text/part0020.html/p000425
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''wishful thinking'' -> ''suy nghĩ viển
    vông''; giữ cấu trúc nhượng bộ khẳng định kết quả sẽ rất tệ."]'
- segment_id: YS-LN05/Text/part0020.html/p000426
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & xưng hô: ''Lieutenant Serebryakov, Lieutenant Grantz''
    -> ''Trung úy Serebryakov, Trung úy Grantz''; trong thoại Tanya xưng ''tôi'',
    gọi hai trung úy là ''hai người'', dùng ''quân ta'' cho phía Đế quốc."]'
- segment_id: YS-LN05/Text/part0020.html/p000427
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: tự thuật nội tâm dùng ''Mình / mình'' và ''họ'';
    giữ quan hệ đối lập ''nhưng đáp lại mình vẫn là sự im lặng thẳng thừng của họ''."]'
- segment_id: YS-LN05/Text/part0020.html/p000428
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & phủ định: giữ chi tiết hai sĩ quan lịch sự giả vờ nghễnh
    ngãng ngoảnh mặt đi để né câu trả lời và câu phủ định tuyệt đối ''Đời nào đó lại
    là tin tốt cho được.''"]'
- segment_id: YS-LN05/Text/part0020.html/p000429
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định: dùng ''chúng ta'' trong lời kết luận của
    Tanya trước cấp dưới; giữ phủ định ''Hành động của chúng ta đã không mang lại
    kết quả.''"]'
- segment_id: YS-LN05/Text/part0020.html/p000430
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: giữ phủ định ''Một lời an ủi nửa vời chẳng
    giải quyết được gì cả.''; chuyển sang tên riêng ''Tanya'' và đại từ phản thân
    ''mình'' ở câu hai."]'
- segment_id: YS-LN05/Text/part0020.html/p000431
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái bắt buộc: độc thoại nội tâm dùng ''Mình''
    theo DEC-P01-001; giữ mức độ bắt buộc ''buộc phải chấp nhận nó''."]'
- segment_id: YS-LN05/Text/part0020.html/p000432
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trong thoại dùng ''Tôi'' và ''Đơn
    vị chúng ta''; phần dẫn trần thuật ngôi thứ ba quy chiếu Tanya bằng ''Nó'' theo
    DEC-P01-001; giữ đủ ba mệnh đề phủ định trong lời thoại."]'
- segment_id: YS-LN05/Text/part0020.html/p000433
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & mục đích: giữ quan hệ mục đích ''Những lời này là cần
    thiết để có thể chấp nhận sự thật.''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0020.html/p000434
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''veterans'' -> ''những cựu binh''; ''203rd
    Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên không số 203''; ''the Empire’s
    main lines'' -> ''các chiến tuyến chính của Đế quốc''; độc thoại nội tâm dùng
    ''Mình / mình'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0020.html/p000435
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & từ vựng: lời thoại thành tiếng dùng ''Tôi / của
    tôi''; ''brothers-in-arms'' -> ''những người chiến hữu''; giữ điệp ý mất mát ở
    câu cuối."]'
- segment_id: YS-LN05/Text/part0020.html/p000436
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh bậc nhất: ''veterans'' -> ''những cựu binh'';
    giữ so sánh bậc nhất ''kiểu người hiếm hoi bậc nhất trong thời chiến''."]'
- segment_id: YS-LN05/Text/part0020.html/p000437
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc & dấu câu: giữ câu cảm thán bỏ lửng ''Ấy vậy mà trong
    tất cả mọi người, chính họ lại…''."]'
- segment_id: YS-LN05/Text/part0020.html/p000438
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''a company'' -> ''một đại đội''; tự thuật
    nội tâm dùng ''mình'' cho ngôi thứ nhất số ít và dùng ''quân ta'' / ''chúng tôi''
    cho tập thể đơn vị."]'
- segment_id: YS-LN05/Text/part0020.html/p000439
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & giọng thoại: chỉ bọc dấu sao cho hai cụm
    ''*Nếu có ai đó để cùng sát cánh thực hiện, thì chính là họ, nên…*'' và ''*Nếu
    có họ đảm nhận công việc, thì…*'' khớp chính xác với hai thẻ em trong XHTML (DEC-P01-002);
    từ nối ''hoặc'' ở giữa để chữ thường; thoại dùng đại từ ''Tôi''."]'
- segment_id: YS-LN05/Text/part0020.html/p000440
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: độc thoại nội tâm dùng ''mình''
    theo DEC-P01-001; giữ phủ định khả năng ''mình không tài nào giữ nổi sự điềm tĩnh''."]'
- segment_id: YS-LN05/Text/part0020.html/p000441
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & phủ định: dùng đại từ khái quát ''bạn'' cho
    chủ thể giả định chung; giữ dấu chấm lửng và phủ định nghiêm cấm ''chuyện đó tuyệt
    đối không thể bỏ qua''."]'
- segment_id: YS-LN05/Text/part0020.html/p000442
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*chết*'' ở câu thoại cuối khớp chính
    xác với thẻ em trong XHTML (DEC-P01-002).", "Thuật ngữ, cấp bậc & đại từ: ''Intelligence''
    -> ''bên Tình báo''; ''Lieutenant Colonel Tanya von Degurechaff'' -> ''Trung tá
    Tanya von Degurechaff''; trong thoại dùng ''Tôi / của tôi'', phần dẫn trần thuật
    dùng ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0020.html/p000443
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''battlefield cross'' -> ''cây thập tự chiến
    trường''; trần thuật quy chiếu Tanya bằng ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0020.html/p000444
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật dùng ''nó / Nó'' cho
    Tanya và thống nhất dùng ''họ'' (hoặc ''những người đã ngã xuống / đồng đội'',
    tránh gán giới tính ''các anh'' theo DEC-P01-001) cho các binh sĩ tử trận; giữ
    phủ định ''chẳng một ai đành lòng ruồng bỏ những người đã ngã xuống''."]'
- segment_id: YS-LN05/Text/part0020.html/p000445
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & dấu câu: giữ dấu chấm lửng kết hợp chấm than ''…!''
    và thống nhất đại từ tự xưng trong lời thoại có dấu ngoặc kép."]'
- segment_id: YS-LN05/Text/part0020.html/p000446
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''battlefield cross'' -> ''cây thập
    tự chiến trường''; trần thuật dùng ''Nó / nó'' theo DEC-P01-001; giữ phủ định
    tuyệt đối ở câu cuối ''Một vết đạn bắn xuyên đầu thì không cách nào cứu chữa được.''"]'
- segment_id: YS-LN05/Text/part0020.html/p000447
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Tanya gọi binh sĩ là ''toàn quân'', xưng
    ''tôi'' và ''Chúng ta''."]'
- segment_id: YS-LN05/Text/part0020.html/p000448
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc trong thoại: ''Colonel?'' -> ''“Thưa Trung tá?”'' (giữ
    đúng quân hàm Trung tá của Tanya)."]'
- segment_id: YS-LN05/Text/part0020.html/p000449
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, đại từ & giới hạn thời gian: trong lời phát biểu
    trước đơn vị, Tanya dùng ''chúng ta'' và ''Hỡi những người đồng đội của tôi'',
    giữ điều kiện hạn định mỉa mai ''—nhưng chỉ sau khi chúng ta đã khuất bóng mà
    thôi''; phần dẫn trần thuật dùng ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0020.html/p000450
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & phủ định: giữ nguyên tên đầy đủ ''Tanya von Degurechaff''
    và phủ định ''không tin vào thần thánh''."]'
- segment_id: YS-LN05/Text/part0020.html/p000451
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ nguyên định danh ''Being X'' (theo P05-being-x);
    giữ cấu trúc điều kiện ''Chừng nào... còn...'' và phủ định khả năng ''một đấng
    thiêng liêng tuyệt đối không thể nào tồn tại trên thế gian này''."]'
- segment_id: YS-LN05/Text/part0020.html/p000452
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: dùng tên riêng ''Tanya''; giữ mức độ hạn
    định ''gần như là một tiên đề hiển nhiên''."]'
- segment_id: YS-LN05/Text/part0020.html/p000453
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''God'' -> ''Thượng đế''; dùng đại từ khái
    quát ''bạn'' ở vế điều kiện giả định."]'
- segment_id: YS-LN05/Text/part0020.html/p000454
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & phủ định: giữ hai vế điều kiện đối lập (''Nếu
    được cứu... Còn nếu không...''), đại từ khái quát ''bạn'', và phủ định kết câu
    ''Đằng nào thì bạn cũng chẳng mất gì cả.''"]'
- segment_id: YS-LN05/Text/part0020.html/p000455
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''God'' -> ''Thượng đế''; giữ phủ định trong
    lời hưởng ứng ''vốn chẳng phải phong cách của chúng ta!''."]'
- segment_id: YS-LN05/Text/part0020.html/p000456
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & giọng thoại: giữ lời tán đồng ngắn gọn của Tanya với
    ''Weiss''."]'
- segment_id: YS-LN05/Text/part0020.html/p000457
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu rủ/đề nghị của Weiss dùng đại từ ''chúng
    ta''."]'
- segment_id: YS-LN05/Text/part0020.html/p000458
  kind: terminology_and_voice
  value: 'choices=["Tên bài hát & xưng hô: giữ dấu nháy đơn quanh tên bài hát (''Chúng
    Ta Đã Có Một Người Đồng Chí''), gọi đơn vị là ''toàn quân'' và ''mọi người'',
    dùng ''chúng ta'' ở vế rủ hát tiễn biệt."]'
- segment_id: YS-LN05/Text/part0020.html/p000459
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & sắc thái: giữ mô tả trần thuật ngôi thứ ba về giọng
    hát khàn đặc, run rẩy của những người lính; không có chữ nghiêng.'']'
- segment_id: YS-LN05/Text/part0020.html/p000460
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & lời ca tiễn biệt: trần thuật dùng tên riêng ''Tanya'';
    lời hát tưởng niệm dùng ''chúng tôi'' và gọi những người ngã xuống là ''những
    người đồng chí / các đồng chí'' (hoặc phương án trung tính không suy diễn giới
    tính theo DEC-P01-001)."]'
- segment_id: YS-LN05/Text/part0020.html/p000461
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ quân sự: ''Pistols'' -> ''Súng ngắn''; ''Blanks'' ->
    ''Đạn mã tử''; ''three-volley salute'' -> ''Ba loạt súng tiễn biệt''; ''live bullet''
    -> ''đạn thật''; ''White Wings Grand Iron Cross'' -> ''Đại Thập tự Sắt Cánh Trắng'';
    giữ nhịp câu ngắn dồn dập ở ba câu đầu."]'
- segment_id: YS-LN05/Text/part0020.html/p000462
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu bằng dấu sao ''*...*''
    khớp chính xác với thẻ em trong XHTML (DEC-P01-002); ''sectionalism'' -> ''thói
    cục bộ''."]'
- segment_id: YS-LN05/Text/part0020.html/p000463
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu bằng dấu sao ''*...*''
    khớp chính xác với thẻ em trong XHTML (DEC-P01-002); ''Intelligence'' -> ''bên
    Tình báo''."]'
