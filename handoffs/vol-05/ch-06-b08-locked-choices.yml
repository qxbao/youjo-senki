segment_id_start: YS-LN05/Text/part0029.html/p000261
segment_id_end: YS-LN05/Text/part0029.html/p000300
choices:
- segment_id: YS-LN05/Text/part0029.html/p000261
  kind: terminology_and_voice
  value: 'choices=["Lời mở đầu phát biểu công khai của Zettour: xưng ''Tôi'', khóa
    ''Trung tướng Hans von Zettour'' và ''Lục quân Đế quốc''."]'
- segment_id: YS-LN05/Text/part0029.html/p000262
  kind: terminology_and_voice
  value: 'choices=["Giữ cấu trúc câu hỏi danh ngữ ngắn gọn liệt kê bốn trạng thái
    tâm lý của đám đông: ''Sự bất tín, hoài nghi, tò mò, hay thờ ơ?''."]'
- segment_id: YS-LN05/Text/part0029.html/p000263
  kind: terminology_and_voice
  value: choices=["Giữ dấu ngoặc kép quanh cụm '“thông báo quan trọng”' và quan hệ
    tương phản 'Phần lớn người nghe ... Nhưng chỉ chừng đó thôi cũng đủ...'."]
- segment_id: YS-LN05/Text/part0029.html/p000264
  kind: terminology_and_voice
  value: choices=["Khóa 'trung tướng thuộc Lục quân Đế quốc', 'bộ lễ phục loại I'
    và 'các thủ lĩnh nhóm dân tộc chủ nghĩa'."]
- segment_id: YS-LN05/Text/part0029.html/p000265
  kind: terminology_and_voice
  value: 'choices=["Thoại diễn thuyết trước công chúng của Zettour: xưng ''tôi'',
    gọi thính giả là ''quý vị'', dùng ''Chúng ta'' bao gộp và khóa thuật ngữ ''hiểm
    họa đỏ''."]'
- segment_id: YS-LN05/Text/part0029.html/p000266
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: giữ chữ thường ở câu trần thuật đầu và bọc chữ
    nghiêng trọn câu thứ hai ''*Chúng ta, Đế quốc và những người theo chủ nghĩa dân
    tộc, không phải là kẻ thù.*''."]'
- segment_id: YS-LN05/Text/part0029.html/p000267
  kind: terminology_and_voice
  value: choices=["Trần thuật quy chiếu Zettour bằng đại từ 'ông'; giữ nghĩa 'Lời
    mở đầu' và 'lập trường'."]
- segment_id: YS-LN05/Text/part0029.html/p000268
  kind: terminology_and_voice
  value: choices=["Khóa 'lãnh thổ bị Đế quốc chiếm đóng' và 'các hoạt động bình định'."]
- segment_id: YS-LN05/Text/part0029.html/p000269
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'ông' cho Zettour và 'họ' cho người dân/nhóm dân
    tộc chủ nghĩa; giữ hình ảnh ẩn dụ 'gói ghém liều thuốc độc vào trong những ngôn
    từ hoa mỹ mà sáo rỗng'."]
- segment_id: YS-LN05/Text/part0029.html/p000270
  kind: terminology_and_voice
  value: 'choices=["Phân biệt chuẩn xác sắc thái đại từ trong thoại của Zettour: ''chúng
    tôi'' (quy chiếu Đế quốc ở mệnh đề nối kết với câu trước) và ''tổ quốc của chúng
    ta'' (tạo sự đồng cảm chung với người nghe)."]'
- segment_id: YS-LN05/Text/part0029.html/p000271
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc đối lập giữa chủ thể phát ngôn và nội dung phát ngôn;
    khóa 'các thủ lĩnh dân tộc chủ nghĩa'."]
- segment_id: YS-LN05/Text/part0029.html/p000272
  kind: terminology_and_voice
  value: choices=['Giữ cấu trúc câu mục đích bổ nghĩa cho hành động ở đoạn trước.']
- segment_id: YS-LN05/Text/part0029.html/p000273
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'Ông', 'mình' và tên riêng 'Zettour'."]
- segment_id: YS-LN05/Text/part0029.html/p000274
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng đúng ba vị trí nhấn mạnh ''*tôi*'',
    ''*chúng tôi*'' và ''*Cũng giống như các vị*''; trần thuật ở giữa dùng ''ông'',
    thoại gọi các thủ lĩnh đứng sau là ''các vị''."]'
- segment_id: YS-LN05/Text/part0029.html/p000275
  kind: terminology_and_voice
  value: choices=["Giữ dấu gạch ngang và sắc thái nhấn mạnh sự xác nhận 'nhưng họ
    quả thực đã gật đầu'."]
- segment_id: YS-LN05/Text/part0029.html/p000276
  kind: terminology_and_voice
  value: choices=["Giữ cách diễn đạt 'đủ để làm chất xúc tác'."]
- segment_id: YS-LN05/Text/part0029.html/p000277
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'Ông' và đại từ phản thân 'mình'."]
- segment_id: YS-LN05/Text/part0029.html/p000278
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: chỉ bọc chữ nghiêng câu độc thoại nội tâm ở
    giữa ''*Mình sẽ vươn tới họ như thể đang bàn luận sự thật với những người bạn.*''
    (tự xưng ''Mình''); hai phần thoại công khai hai bên để chữ thường, khóa ''hiểm
    họa đỏ'' và ''lực lượng biên phòng''."]'
- segment_id: YS-LN05/Text/part0029.html/p000279
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu độc thoại nội tâm
    của Zettour, tự quy chiếu bằng ''Mình ... chính bản thân mình''."]'
- segment_id: YS-LN05/Text/part0029.html/p000280
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: dùng ''Chúng ta'', khóa ''những bậc tiền nhân
    cao quý và đáng tự hào'' và ''hiểm họa đỏ''."]'
- segment_id: YS-LN05/Text/part0029.html/p000281
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'ông'; khóa hình ảnh 'việc làm của ác quỷ', 'ngọn
    lửa hy vọng' và 'ly khai khỏi Liên bang'."]
- segment_id: YS-LN05/Text/part0029.html/p000282
  kind: terminology_and_voice
  value: choices=["Khóa thuật ngữ 'chiều sâu', 'cầu nguyện Thượng đế', 'phản công',
    'đóng kịch vì lợi ích của Đế quốc'; trần thuật dùng 'họ' cho phía Đế quốc và 'ông'
    cho Zettour."]
- segment_id: YS-LN05/Text/part0029.html/p000283
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: dùng ''chúng ta'', giữ hình ảnh ẩn dụ ''cầm
    gươm lên để tự bảo vệ chính mình''."]'
- segment_id: YS-LN05/Text/part0029.html/p000284
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: chỉ bọc chữ nghiêng câu tự nhắc ngắn đầu đoạn
    ''*Từ tốn nào.*''; phần trần thuật còn lại để chữ thường, dùng đại từ ''ông /
    mình''."]'
- segment_id: YS-LN05/Text/part0029.html/p000285
  kind: terminology_and_voice
  value: 'choices=["Thoại của Zettour: dùng ''chúng ta'' và ''tôi'', khóa ''Đế quốc'',
    điển tích ''Cincinnatus'' và giữ nguyên từ in nghiêng ''*Heimat*'' theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0029.html/p000286
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu nội tâm ''*Mơ mộng
    thật vô nghĩa.*''."]'
- segment_id: YS-LN05/Text/part0029.html/p000287
  kind: terminology_and_voice
  value: 'choices=["Trần thuật khách quan hóa điểm nhìn của chính nhân vật: khóa cụm
    ''Người lính Hans von Zettour'', đại từ phản thân ''mình'', giữ mức độ tình thái
    ''có lẽ ... chẳng bao giờ''."]'
- segment_id: YS-LN05/Text/part0029.html/p000288
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ câu độc thoại nội tâm
    của Zettour; tự xưng ''mình'', giữ sắc thái tự trào ''kẻ đê tiện''."]'
- segment_id: YS-LN05/Text/part0029.html/p000289
  kind: terminology_and_voice
  value: 'choices=["Thoại tuyên bố chính thức của Zettour: khóa ''nhân danh Đế quốc'',
    xưng ''tôi'' (cá nhân người tuyên bố) và ''chúng tôi'' (đại diện Đế quốc), khóa
    ''đất đai và chủ quyền''."]'
- segment_id: YS-LN05/Text/part0029.html/p000290
  kind: terminology_and_voice
  value: choices=["Khóa 'Liên bang', 'quốc gia đa sắc tộc' và 'Chủ nghĩa Cộng sản';
    giữ câu hỏi tu từ cuối đoạn."]
- segment_id: YS-LN05/Text/part0029.html/p000291
  kind: terminology_and_voice
  value: choices=["Giữ câu hỏi tu từ nối tiếp đoạn trước với 'Liên bang'."]
- segment_id: YS-LN05/Text/part0029.html/p000292
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc chêm bằng dấu gạch ngang giải thích cho 'sự thật'
    dưới ách cai trị hà khắc và những lời tuyên truyền hào nhoáng."]
- segment_id: YS-LN05/Text/part0029.html/p000293
  kind: terminology_and_voice
  value: choices=["Khóa cụm 'cuộc thử nghiệm xã hội vĩ đại' và 'ách áp bức đã phai
    màu của Chủ nghĩa Cộng sản'."]
- segment_id: YS-LN05/Text/part0029.html/p000294
  kind: terminology_and_voice
  value: choices=["Khóa cách diễn đạt 'một niềm xác tín nhất định' gắn với 'Zettour'."]
- segment_id: YS-LN05/Text/part0029.html/p000295
  kind: terminology_and_voice
  value: 'choices=["Phân biệt rõ đại từ trong thoại của Zettour: ''Chúng tôi'' (Đế
    quốc không sáp nhập), ''Tôi'' (cá nhân Zettour thấu hiểu) và ''tất cả chúng ta''
    (tình yêu quê hương chung); khóa ''các vùng lãnh thổ bị chiếm đóng''."]'
- segment_id: YS-LN05/Text/part0029.html/p000296
  kind: terminology_and_voice
  value: choices=['Giữ câu khẳng định trần thuật ngắn gọn về tính chân thực của nguyên
    tắc trên.']
- segment_id: YS-LN05/Text/part0029.html/p000297
  kind: terminology_and_voice
  value: choices=["Giữ dấu ba chấm mở đầu thoại và câu hỏi tu từ '“…Ai mà chẳng nặng
    lòng với tổ quốc của mình?”'."]
- segment_id: YS-LN05/Text/part0029.html/p000298
  kind: terminology_and_voice
  value: 'choices=["Theo DEC-P01-002: bọc chữ nghiêng toàn bộ đoạn độc thoại nội tâm
    của Zettour; tự xưng ''mình / Mình'', khóa cụm ''nhận quyết định phong hàm sĩ
    quan''."]'
- segment_id: YS-LN05/Text/part0029.html/p000299
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc câu hỏi tu từ song hành với p000297, phân biệt 'quê
    hương bản quán' ở câu này với 'tổ quốc' ở p000297."]
- segment_id: YS-LN05/Text/part0029.html/p000300
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'Zettour', 'mình' và 'Ông'; giữ nguyên sức nặng
    bi kịch của hình ảnh 'những chồng xác người trẻ tuổi'."]
