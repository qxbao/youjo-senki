- segment_id: YS-LN05/Text/part0027.html/p000136
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thời thể: dùng ''chúng ta'' trong lời thoại tranh luận
    của sĩ quan tham mưu; giữ trạng thái quân đội ở phía đông đã bắt đầu/đang tan
    rã; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000137
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & mệnh lệnh phủ định: giữ đại từ ''Chúng ta'' và câu cảnh
    báo ''Đừng có đánh giá thấp cái giá phải trả cho việc trì hoãn hành động của chúng
    ta!''."]'
- segment_id: YS-LN05/Text/part0027.html/p000138
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi phản vấn & nhấn mạnh Markdown: dùng ''Các anh''
    và ''mình''; ''suicidal charge'' -> ''đợt xung phong tự sát''; chỉ bọc ''*đó*''
    trong ''Chuyện *đó* thì miễn bàn!'' khớp chính xác với thẻ em trong XHTML theo
    DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0027.html/p000139
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật ngôi thứ ba; ''mid-career officers''
    -> ''sĩ quan tầm trung''; ''the two generals'' -> ''hai vị tướng''; không có chữ
    nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000140
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & tên riêng: ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; ''Lieutenant General von Rudersdorf'' -> ''Trung tướng von
    Rudersdorf''; ''cigars'' -> ''điếu xì gà''."]'
- segment_id: YS-LN05/Text/part0027.html/p000141
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & phủ định: giữ tương phản giữa hai vị tướng (''một
    người thì đang cười khẩy... trong khi người kia lại thờ ơ đến mức thậm chí còn
    chẳng buồn nghe'')."]'
- segment_id: YS-LN05/Text/part0027.html/p000142
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*tuyết*'' khớp chính xác với thẻ
    em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN05/Text/part0027.html/p000143
  kind: terminology_and_voice
  value: 'choices=["Chức danh, quân hàm & quan hệ nhân quả: ''deputy chief of the
    Service Corps'' -> ''Phó Cục trưởng Cục Quân vụ''; ''General von Zettour'' ->
    ''Tướng von Zettour''; giữ quan hệ hệ quả ''Do đó, việc thúc giục cấp dưới tranh
    luận đơn thuần chỉ là một hình thức rèn luyện trí não khắc nghiệt mà thôi''."]'
- segment_id: YS-LN05/Text/part0027.html/p000144
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & cơ quan: ''General von Rudersdorf'' -> ''Tướng von
    Rudersdorf''; ''Operations'' -> ''Cục Tác chiến'' (''người phụ trách Cục Tác chiến'');
    đại từ trần thuật ''ông'' và ''họ''."]'
- segment_id: YS-LN05/Text/part0027.html/p000145
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ cấu trúc nhấn mạnh nguyên nhân ''Chính vì
    hiểu rõ yếu tố thời gian nên cả hai ông đều đã đưa ra kết luận ngay lập tức''."]'
- segment_id: YS-LN05/Text/part0027.html/p000146
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tâm lý nhân vật: ''mid-ranking officers'' -> ''sĩ
    quan cấp trung''; ''Zettour'' -> ''Zettour'' (đại từ ''ông''); giữ chi tiết biết
    rõ làm vậy chẳng ích gì và thừa nhận sự hối hận."]'
- segment_id: YS-LN05/Text/part0027.html/p000147
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ trong thoại: ''a hundred schools of thought'' -> ''bách
    gia tranh minh''; không có chữ nghiêng."]'
- segment_id: YS-LN05/Text/part0027.html/p000148
  kind: terminology_and_voice
  value: 'choices=["Phủ định & điểm nhìn: giữ nhận định lý lẽ đã biến tướng thành
    ý kiến chủ quan đơn thuần và phủ định ''những kẻ trong cuộc thậm chí còn chẳng
    hề nhận ra điều đó''."]'
- segment_id: YS-LN05/Text/part0027.html/p000149
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện nhượng bộ: giữa hai vị tướng dùng ''ông''
    và ''chúng ta''; giữ cấu trúc nhượng bộ ''cho dù câu trả lời của chúng ta có không
    phải là phương án đúng đắn đi nữa, thì việc tranh cãi cũng chỉ là lãng phí thời
    gian thôi?''."]'
- segment_id: YS-LN05/Text/part0027.html/p000150
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & khẳng định dứt khoát: ''Personnel'' -> ''bên Nhân
    sự''; ''staff officers'' -> ''sĩ quan tham mưu''; ''second-rate officer'' -> ''sĩ
    quan hạng hai''; giữ khẳng định ''Rút quân là lựa chọn duy nhất của chúng ta''."]'
- segment_id: YS-LN05/Text/part0027.html/p000151
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại đồng tình: giữ câu cảm thán xác nhận ''Đúng là một
    sự thật đáng bực mình''."]'
- segment_id: YS-LN05/Text/part0027.html/p000152
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc chính xác hai cụm chữ nghiêng
    ''*Thiệt tình.*'' và ''*Họ vốn là một nhóm tinh hoa được tuyển chọn kỹ lưỡng,
    ấy vậy mà Bộ Tổng tham mưu Lục quân Đế quốc lại đầy rẫy những gã cứ tưởng mình
    thông minh lắm. Thật không thể tin nổi…*'' theo DEC-P01-002; ''Imperial Army General
    Staff'' -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; phần dẫn truyện còn lại để chữ
    thường."]'
- segment_id: YS-LN05/Text/part0027.html/p000153
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Nhưng…*'' khớp với thẻ em trong
    XHTML theo DEC-P01-002; phần '', cũng phải nói thêm một điều.'' để chữ thường."]'
- segment_id: YS-LN05/Text/part0027.html/p000154
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & so sánh nhất: ''General von Zettour'' ->
    ''Tướng von Zettour''; ''General von Rudersdorf'' -> ''Tướng von Rudersdorf'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ cụm ''mức kỳ vọng tối thiểu cao
    nhất''."]'
- segment_id: YS-LN05/Text/part0027.html/p000155
  kind: terminology_and_voice
  value: 'choices=["Hình ảnh ẩn dụ & dấu câu: ''two ravens of the Imperial Army''
    -> ''Hai con quạ của Lục quân Đế quốc''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN05/Text/part0027.html/p000156
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & trạng thái: ''average staff officers'' -> ''những
    sĩ quan tham mưu bình thường / ở mức trung bình''; giữ ý cả hai đã sớm thấu hiểu
    ý nghĩa của việc mùa đông ập tới và bắt đầu nỗi sầu muộn."]'
- segment_id: YS-LN05/Text/part0027.html/p000157
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & đại từ: dùng ''chúng ta''; giữ quan hệ nguyên
    nhân – hệ quả do không dự đoán được mùa đông đến sớm nên phải chịu đựng lời buộc
    tội bất tài và tìm cách ứng phó."]'
- segment_id: YS-LN05/Text/part0027.html/p000158
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''reorganizing the lines'' -> ''tái tổ chức
    các chiến tuyến''; ''offensive'' -> ''cuộc tiến công''; dùng đại từ ''ông'' (trần
    thuật chỉ Zettour) và ''chúng ta'' (trong thoại)."]'
- segment_id: YS-LN05/Text/part0027.html/p000159
  kind: terminology_and_voice
  value: 'choices=["Câu chuyển ý ngắn: giữ nguyên ''Chỉ có duy nhất một vấn đề.''."]'
- segment_id: YS-LN05/Text/part0027.html/p000160
  kind: terminology_and_voice
  value: 'choices=["Phủ định bộ phận: ''Zettour'' -> ''Zettour''; ''Rudersdorf'' ->
    ''Rudersdorf''; giữ phủ định bộ phận ''không hoàn toàn đồng quan điểm'' về việc
    phải làm gì sau mùa đông."]'
- segment_id: YS-LN05/Text/part0027.html/p000161
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''the Empire'' -> ''Đế quốc''; ''the front''
    -> ''tiền tuyến''; giữ dấu chấm lửng mở đầu và nhận định cơ hội giải quyết qua
    đàm phán thong thả là rất mong manh."]'
- segment_id: YS-LN05/Text/part0027.html/p000162
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & tình thái: giữ điều kiện ''Nếu cần thiết''
    và khả năng ''chúng ta có thể vạch ra một kế hoạch để cầm cự chờ thời''."]'
- segment_id: YS-LN05/Text/part0027.html/p000163
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ chiến lược: ''total war theory'' -> ''lý thuyết chiến
    tranh tổng lực''; ''attritional containment theory'' -> ''lý thuyết kiềm chế tiêu
    hao''; ''his division'' -> ''cục của mình''; giữ tiền đề chấp nhận tổn thất lớn
    là không thể tránh khỏi nhưng về các mặt khác thì khá vững chắc."]'
- segment_id: YS-LN05/Text/part0027.html/p000164
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kinh tế quân sự: ''munitions manufacturing network''
    -> ''mạng lưới sản xuất quân nhu''; ''self-sufficient economic behavior'' -> ''phương
    thức vận hành kinh tế tự cung tự cấp''; ''the Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN05/Text/part0027.html/p000165
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ đại từ ''Chúng ta'', hai câu phủ định
    khẳng định quyền tự do hành động, và ''long war of attrition'' -> ''cuộc chiến
    tiêu hao dài hơi''."]'
- segment_id: YS-LN05/Text/part0027.html/p000166
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Zettour và Rudersdorf xưng ''tôi''
    – ''ông''; ''General von Rudersdorf'' -> ''Tướng von Rudersdorf''; ''total war
    doctrine'' -> ''học thuyết chiến tranh tổng lực''; giữ sắc thái Đế quốc chỉ đang
    gắng gượng cầm cự nhờ tính kỷ luật của học thuyết này."]'
- segment_id: YS-LN05/Text/part0027.html/p000167
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & giới hạn thời gian: dùng ''tôi'' – ''ông'',
    ''General von Rudersdorf'' -> ''Tướng von Rudersdorf''; giữ phủ định ''Không hề
    có trở ngại nào trong việc duy trì mức tối thiểu cả'' và giới hạn ''Ít nhất là
    ở thời điểm hiện tại''."]'
- segment_id: YS-LN05/Text/part0027.html/p000168
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi xác nhận: ''military supplies'' -> ''vật tư
    quân sự''; giữ câu hỏi xác nhận cuối câu ''phải không?''."]'
- segment_id: YS-LN05/Text/part0027.html/p000169
  kind: terminology_and_voice
  value: 'choices=["Phủ định, dấu câu & đối lập: giữ câu mở đầu ''Tôi không thể phủ
    nhận chuyện đó'', ý chạm giới hạn trong việc chống đỡ sản lượng lương thực đang
    sụt giảm, và tương phản ''Sản lượng đạn pháo tuy có tăng vọt, nhưng… chất lượng
    tồi tệ của chúng lại khiến tôi phát tuyệt vọng''."]'
- segment_id: YS-LN05/Text/part0027.html/p000170
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & hai nguyên nhân song hành: ''the Empire'' -> ''Đế
    quốc''; giữ đủ hai vấn đề của nông nghiệp là thiếu hụt mảng nhân lực khổng lồ
    và quân đội trưng dụng toàn bộ ngựa cày."]'
- segment_id: YS-LN05/Text/part0027.html/p000171
  kind: terminology_and_voice
  value: 'choices=["Cơ quan & nhân quả: ''Service Corps'' -> ''Cục Quân vụ''; giữ
    cấu trúc nhấn mạnh ''Chẳng phải ai khác ngoài Cục Quân vụ...'' và hệ quả Zettour
    nhận thức rõ đòn giáng nặng nề vào nền nông nghiệp trong nước."]'
- segment_id: YS-LN05/Text/part0027.html/p000172
  kind: terminology_and_voice
  value: 'choices=["So sánh & chi tiết hiện thực: giữ so sánh hậu quả tồi tệ hơn dự
    tính và chi tiết ''phải ăn củ cải triền miên hết bữa này đến bữa khác cũng là
    do lỗi của chính họ mà ra''."]'
- segment_id: YS-LN05/Text/part0027.html/p000173
  kind: terminology_and_voice
  value: 'choices=["Phân biệt khái niệm, đại từ & thuật ngữ: giữ phân biệt ''Dự tính
    một cuộc chiến dài hơi khác với việc hy vọng vào một cuộc chiến dài hơi''; phân
    biệt ''Chúng tôi'' (Cục Tác chiến) và ''ta'' (Đế quốc); ''operational level''
    -> ''cấp độ chiến dịch''."]'
