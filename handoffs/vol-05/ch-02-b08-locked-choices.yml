- segment_id: YS-LN05/Text/part0016.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Tên tổ chức và đại từ: ''Bộ Tổng tham mưu'', ''họ''"]'
- segment_id: YS-LN05/Text/part0016.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Zettour với Lergen: ''anh'', ''tôi'',
