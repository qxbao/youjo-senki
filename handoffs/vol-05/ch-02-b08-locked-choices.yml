  value: 'choices=["Thuật ngữ chuyên môn giữ nguyên viết tắt: ''SIGINT'', ''HUMINT''"]'
- segment_id: YS-LN05/Text/part0016.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ và quan hệ nhượng bộ: ''các cơ quan tình báo'', ''Họ'',
    ''mình''"]'
- segment_id: YS-LN05/Text/part0016.html/p000041
  kind: terminology_and_voice
