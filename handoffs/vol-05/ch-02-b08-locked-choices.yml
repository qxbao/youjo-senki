- segment_id: YS-LN05/Text/part0016.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Xưng hô lễ phép của Lergen với Zettour: ''Rõ, thưa ngài. Tôi đi
    ngay đây ạ.''"]'
- segment_id: YS-LN05/Text/part0016.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Giữ định dạng in hoa toàn bộ dòng tiêu đề thời gian và địa điểm:
    ''MỘT NGÀY NỌ TRONG THÁNG 9, NĂM THỐNG NHẤT 1926, Ở VÙNG NGOẠI Ô THỦ ĐÔ LONDINIUM
    CỦA KHỐI THỊNH VƯỢNG CHUNG''"]'
- segment_id: YS-LN05/Text/part0016.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''cơ quan tình báo'', ''các cơ quan quốc gia có liên
    quan'', ''dữ liệu thô''"]'
- segment_id: YS-LN05/Text/part0016.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Giữ cấu trúc liệt kê trong dấu gạch ngang dài và thành ngữ tương
    đương: ''gạn đục khơi trong''"]'
- segment_id: YS-LN05/Text/part0016.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Giữ nhịp lặp ba lần: ''Hỗn loạn, hỗn loạn, và lại càng hỗn loạn
