- segment_id: YS-LN05/Text/part0018.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật của Tanya theo DEC-P01-001: ''nó / Nó''", "Thuật
    ngữ: ''bàn trực của quân cảnh''"]'
- segment_id: YS-LN05/Text/part0018.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Câu mệnh lệnh theo điều lệnh của quân cảnh gác cổng, lược đại
    từ ngôi thứ hai: ''“Hãy khai báo tên và cấp bậc.”''"]'
- segment_id: YS-LN05/Text/part0018.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc cụm ''*vẫn như mọi
    khi*'' đúng phạm vi thẻ em trong nguồn", "Cơ quan: ''Văn phòng Bộ Tổng tham mưu'';
    giữ phủ định ''không bao giờ lơ là chức trách''"]'
- segment_id: YS-LN05/Text/part0018.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng
    ''Mình / mình''", "Cơ quan: ''Văn phòng Bộ Tổng tham mưu''; tình thái suy đoán
    chắc chắn: ''hẳn họ phải có trí nhớ siêu phàm lắm''"]'
- segment_id: YS-LN05/Text/part0018.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Lời khai báo quân hàm, họ tên và đơn vị của Tanya: ''“Trung tá
    Pháp sư Tanya von Degurechaff thuộc Kampfgruppe Salamander, hiện đang được phân
    công tại mặt trận phía Đông.”''"]'
- segment_id: YS-LN05/Text/part0018.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Cách gọi cấp bậc của lính gác với Tanya: ''Trung tá von Degurechaff'',
    kèm tiểu từ lễ phép ''ạ''"]'
- segment_id: YS-LN05/Text/part0018.html/p000024
  kind: terminology_and_voice
  value: choices=["Giữ nguyên lập luận khái quát về kỷ luật hành chính và điều lệnh
    ('trái với điều lệnh')"]
- segment_id: YS-LN05/Text/part0018.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng
    ''mình''", "Cơ quan: ''Văn phòng Bộ Tổng tham mưu''; giữ câu hỏi tu từ phủ định
    ở cuối đoạn (''Làm sao mình có thể phàn nàn...'')"]'
- segment_id: YS-LN05/Text/part0018.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của quân cảnh với Tanya: tự xưng ''Chúng tôi'', gọi ''Trung
    tá'', kèm tiểu từ lễ phép ''ạ''", "Cơ quan: ''Cục Tác chiến''"]'
- segment_id: YS-LN05/Text/part0018.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật của Tanya theo DEC-P01-001: ''Nó''", "Giữ phủ
    định toàn phần: ''hoàn toàn không có cảnh hối hả nhộn nhịp thường thấy trước một
    chiến dịch lớn''"]'
- segment_id: YS-LN05/Text/part0018.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc cụm ''*Vậy thì sao
    đây*'' đúng phạm vi thẻ em trong nguồn", "Đại từ trần thuật của Tanya: ''Tanya'',
    ''Nó'' kết hợp phản thân ''mình''; giữ phủ định ở câu đầu (''Chẳng một nhân viên
    tham mưu nào qua lại trông có vẻ quá căng thẳng cả'')"]'
- segment_id: YS-LN05/Text/part0018.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002 và nội tâm theo DEC-P01-001:
    ''*Mình đoán nhầm sao?*'' (đúng phạm vi thẻ em)", "Đại từ trần thuật của Tanya
    ở phần còn lại: ''Nó / nó''; giữ mệnh đề nhượng bộ (''dù vẫn giữ chừng mực để
    không thành khiếm nhã'')"]'
- segment_id: YS-LN05/Text/part0018.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Lời chào xã giao tự nhiên, không gán đại từ khi chưa nêu tên người
    nói: ''“Ồ, lâu rồi không gặp.”''"]'
- segment_id: YS-LN05/Text/part0018.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Quân hàm và tên trong lời đáp của Tanya: ''Trung tá Uger''"]'
- segment_id: YS-LN05/Text/part0018.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngôi thứ ba: ''Họ'', ''Tanya'' – ''mình''", "Quân hàm
    và tên: ''Tướng von Rudersdorf''"]'
- segment_id: YS-LN05/Text/part0018.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Uger với Tanya (đồng cấp Trung tá, bạn học cũ ở trường
    đại học quân sự): gọi Tanya là ''cô''"]'
- segment_id: YS-LN05/Text/part0018.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Tanya với Uger: tự xưng ''Tôi''"]'
- segment_id: YS-LN05/Text/part0018.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Uger với Tanya: tự xưng ''tôi''"]'
- segment_id: YS-LN05/Text/part0018.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Uger: ''Anh ta''; tên riêng: ''Tanya''",
    "Xưng hô trong thoại của Tanya với Uger: tự xưng ''Tôi'', gọi ''anh''"]'
- segment_id: YS-LN05/Text/part0018.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật của Tanya theo DEC-P01-001: ''Nó / nó''", "Quân
    hàm và tên: ''Trung úy Serebryakov''"]'
- segment_id: YS-LN05/Text/part0018.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Uger: tự xưng ''tôi'', gọi ''Anh''"]'
- segment_id: YS-LN05/Text/part0018.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Uger với Tanya: gọi ''cô''"]'
- segment_id: YS-LN05/Text/part0018.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ đúng 3 cụm bọc ''*...*''
    tương ứng với 3 thẻ em trong nguồn (''*Hửm?*'', ''*nhẹ nhõm*'', ''*Chỉ là mật
    ong thôi mà… Có thực sự đáng để mừng rỡ đến mức ấy không?*'')", "Trần thuật ngôi
    thứ ba: ''Tanya'', ''anh ta''"]'
- segment_id: YS-LN05/Text/part0018.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Tanya với Uger: tự xưng ''tôi'', gọi ''anh''"]'
- segment_id: YS-LN05/Text/part0018.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại của Uger với Tanya: tự xưng ''tôi'', đại từ
    gộp ''cả hai chúng ta''"]'
- segment_id: YS-LN05/Text/part0018.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Tên riêng và quân hàm: ''Tanya'', ''Trung tá Uger''", "Thuật ngữ:
    ''trường đại học quân sự''"]'
- segment_id: YS-LN05/Text/part0018.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Uger: ''Anh ta''; giữ nguyên cấu trúc giả
    định ''Nếu chỉ một món quà cảm ơn bằng mật ong thôi mà đã đủ để nhận lại cái bắt
    tay đầy cảm kích, thì chuyện này quả là khá kỳ lạ''"]'
- segment_id: YS-LN05/Text/part0018.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Giữ nguyên đối tượng và mức độ câu hỏi của Tanya: ''“…Tình hình
    lương thực ở hậu phương tệ đến mức ấy cơ à?”''"]'
- segment_id: YS-LN05/Text/part0018.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Giữ cấu trúc phủ định bộ phận có rào đón trong câu trả lời của
    Uger: ''“Chưa đến mức khủng hoảng đâu, nên xét theo nghĩa đó thì cũng không kinh
    khủng đến thế.”''"]'
- segment_id: YS-LN05/Text/part0018.html/p000047
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Uger: ''anh ta''; giữ phủ định kép ở cả
    hai câu (''không bị chết đói'', ''chẳng có ai như đang phải chịu cảnh đói khát
    cả'')"]'
- segment_id: YS-LN05/Text/part0018.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc ''*Mà cũng phải*''
    đúng phạm vi thẻ em trong nguồn; trần thuật ''Tanya nghĩ thêm''"]'
- segment_id: YS-LN05/Text/part0018.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Cơ quan và chức danh: ''Lục quân Đế quốc'', ''Văn phòng Bộ Tổng
    tham mưu'', ''các sĩ quan tham mưu''", "Nhấn mạnh Markdown theo DEC-P01-002 và
    giả định trái thực tế: chỉ bọc ''*đâu còn là lúc để mà đánh đấm nữa*'' đúng phạm
    vi thẻ em trong nguồn"]'
- segment_id: YS-LN05/Text/part0018.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''việc phân phối theo định lượng''; giữ cấu trúc so
    sánh hơn (''vận hành trôi chảy hơn so với hồi đầu cuộc chiến'')"]'
- segment_id: YS-LN05/Text/part0018.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''hậu phương''; giữ câu hỏi xác nhận của Tanya"]'
- segment_id: YS-LN05/Text/part0018.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc ''*trên phương diện
    calo và dinh dưỡng*'' đúng phạm vi thẻ em trong nguồn", "Đại từ ngôi thứ nhất
    số nhiều trong thoại của Uger: ''chúng ta''; thuật ngữ: ''củ cải Thụy Điển''"]'
