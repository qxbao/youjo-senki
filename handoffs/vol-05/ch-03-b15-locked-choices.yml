choices:
- segment_id: YS-LN05/Text/part0020.html/p000160
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & giọng điệu: thoại mệnh lệnh trực tiếp của Tanya trước
    khi xung phong; giữ sự đối lập ''bầu trời chật hẹp'' và ''bầu trời thực sự rộng
    lớn đến nhường nào''.", ''Nhấn mạnh Markdown: không dùng *...*.'']'
- segment_id: YS-LN05/Text/part0020.html/p000161
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ cấu trúc phủ định ''Mấu chốt không phải
    là...'' và thuật ngữ ''tiểu đoàn tăng cường'' (augmented battalion)."]'
- segment_id: YS-LN05/Text/part0020.html/p000162
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ đối lập ''một tiểu đoàn tăng cường''
    với ''bốn đại đội tăng cường'', giữ câu hỏi tu từ ''nhưng liệu chúng có chặn nổi...
    không?''."]'
- segment_id: YS-LN05/Text/part0020.html/p000163
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: dùng ''nó'' cho Tanya theo DEC-P01-001.", "Tình
    thái & logic: giữ quan hệ song hành ''vừa để... vừa để...'' và mức độ dự đoán
    ''nhiều khả năng'' (probably)."]'
- segment_id: YS-LN05/Text/part0020.html/p000164
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh: giữ ''Tất cả các đơn vị, xung phong!''."]'
- segment_id: YS-LN05/Text/part0020.html/p000165
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''tiểu đoàn tăng cường'', ''hai trung
    đoàn'', ''Lục quân Đế quốc'' (Imperial Army); giữ phủ định ''Chẳng có cách nào
    khỏa lấp nổi'' và giả định ''Thông thường... sẽ là một hành động kỳ quặc chẳng
    khác nào tự sát''."]'
- segment_id: YS-LN05/Text/part0020.html/p000166
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & đại từ: giữ ''Trung tá Drake'' (Lieutenant Colonel
    Drake) và đại từ trần thuật ''Ông''; giữ cấu trúc hệ quả ''tin chắc... đến mức
    nãy giờ chỉ mải tính xem...''."]'
- segment_id: YS-LN05/Text/part0020.html/p000167
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''Khối Thịnh vượng chung'' (Commonwealth)
    và phủ định nhấn mạnh ''Không, chẳng một ai... lường trước được''."]'
- segment_id: YS-LN05/Text/part0020.html/p000168
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: giữ dấu ''...?!'' mở đầu thoại của Drake
    và nội dung lệnh bắn có kiểm soát để chặn đối phương."]'
- segment_id: YS-LN05/Text/part0020.html/p000169
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: giữ ''hỏa lực ngăn chặn'' (interdiction fire),
    ''các pháp sư Khối Thịnh vượng chung'' và thành ngữ kèm nghĩa đen ''đúng nghĩa
    là tiếng sét giữa trời quang''."]'
- segment_id: YS-LN05/Text/part0020.html/p000170
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc: giữ nguyên đủ 11 cặp ngoặc kép chỉ các tiếng
    hô hỗn loạn từ cả hai phía; giữ khẩu lệnh ''Break!'' theo sổ pending."]'
- segment_id: YS-LN05/Text/part0020.html/p000171
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ nội tâm: câu cuối chuyển sang độc thoại nội
    tâm của Tanya, khóa đại từ tự xưng ''Mình'' theo DEC-P01-001."]'
- segment_id: YS-LN05/Text/part0020.html/p000172
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái: giữ phủ định ''Không có gì bất thường ở
    đây cả'' và câu hỏi phỏng đoán ''Xem ra chúng ta chọc thủng qua được rồi nhỉ?''."]'
- segment_id: YS-LN05/Text/part0020.html/p000173
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ ''Tanya'' và nét nghĩa không chủ đích
    ''ngoài ý muốn'' (in spite of herself)."]'
- segment_id: YS-LN05/Text/part0020.html/p000174
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: khóa đại từ ''nó'' cho Tanya theo
    DEC-P01-001; giữ cách nói giảm ''không hề nhỏ'' (no small satisfaction) và mệnh
    đề tổng quát sau dấu hai chấm."]'
- segment_id: YS-LN05/Text/part0020.html/p000175
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: giữ ''Nữ thần Chiến thắng'', ''Lục quân
    Đế quốc'', ''trận đánh đột phá'', ''lưỡi kiếm ma pháp'' (magic blades), ''Tiểu
    đoàn Pháp sư Trên không số 203'' (203rd Aerial Mage Battalion); giữ sắc thái ngoại
    quan ''trông có vẻ thuộc về các chỉ huy địch''."]'
- segment_id: YS-LN05/Text/part0020.html/p000176
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''đội tiên phong'' (vanguard)."]'
- segment_id: YS-LN05/Text/part0020.html/p000177
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ cấp đơn vị ''đại đội'' (Company), ''tiểu đội''
    (squads) và ''đòn tấn công quấy rối'' (harassment attack)."]'
- segment_id: YS-LN05/Text/part0020.html/p000178
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: giữ ''hai trung đoàn đang leo cao'' (two
    climbing regiments) và sắc thái đánh giá thấp khi địch bị đánh úp."]'
- segment_id: YS-LN05/Text/part0020.html/p000179
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ chủ ngữ ''Tanya'', đại từ phản thân
    ''của mình'' và đối lập với trạng thái hỗn loạn của pháp sư địch phía sau."]'
- segment_id: YS-LN05/Text/part0020.html/p000180
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: khóa ''*Nhưng…*'' đúng phạm vi thẻ <em> trong
    nguồn theo DEC-P01-002.", "Thuật ngữ & hình ảnh: giữ ''các đại đội của Khối Thịnh
    vượng chung'' và ẩn dụ ''đuổi bắt hai con thỏ''."]'
- segment_id: YS-LN05/Text/part0020.html/p000181
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ mức độ nhận định ''Có thể nói...'' và ''quyết định
    hợp lý trong tình huống bất ngờ''."]'
- segment_id: YS-LN05/Text/part0020.html/p000182
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tên riêng: khóa ''RMS *Queen of Anjou*''
    (chỉ in nghiêng phần tên tàu đúng theo thẻ <em> của nguồn và DEC-P01-002).", "Điểm
    nhìn & phủ định: giữ điểm nhìn nội tâm ngôi thứ nhất số nhiều (''bọn mình'' /
    ''chúng ta'') và phủ định kép ''Không để... là điều đúng đắn'', ''cũng chẳng hề
    sai''."]'
- segment_id: YS-LN05/Text/part0020.html/p000183
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định: giữ ''Tiểu đoàn Pháp sư Trên không số 203'',
    điểm nhìn nội tâm (''bọn mình'' / ''chúng ta'') và câu điều kiện giả định ''Nếu
    họ có thể chiếm giữ... thế cờ sẽ đảo ngược...''."]'
- segment_id: YS-LN05/Text/part0020.html/p000184
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc: giữ câu ngắn chuyển ý ''Chỉ có một vấn đề duy nhất.''."]'
- segment_id: YS-LN05/Text/part0020.html/p000185
  kind: terminology_and_voice
  value: 'choices=["Tình thái quá khứ & phủ định: khóa cấu trúc giả định quá khứ kèm
    phủ định ''lẽ ra họ không nên chọn bất kỳ phương án nào trong hai phương án đó''
    (shouldn’t have chosen either of those)."]'
- segment_id: YS-LN05/Text/part0020.html/p000186
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thoại: giữ ''các đơn vị pháp sư Khối Thịnh vượng chung''
    và mệnh lệnh dùng quân địch bám đuôi làm lá chắn để áp sát tàu."]'
- segment_id: YS-LN05/Text/part0020.html/p000187
  kind: terminology_and_voice
  value: 'choices=[''Logic nhân quả & điểm nhìn: giữ quan hệ quân địch truy kích vô
    tình chắn đường bắn của quân địch phía trên đối với quân mình.'']'
- segment_id: YS-LN05/Text/part0020.html/p000188
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giới hạn thời gian: giữ ''Thậm chí chẳng cần giao chiến''
    và giới hạn ''dù chỉ là tạm thời'' (if only momentarily)."]'
- segment_id: YS-LN05/Text/part0020.html/p000189
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ quan hệ nguyên nhân ''chính vì sự xuất sắc
    nửa vời/bề nổi ấy'' dẫn đến việc phạm sai lầm."]'
- segment_id: YS-LN05/Text/part0020.html/p000190
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & thuật ngữ: khóa cách xưng hô ''Thưa Trung tá!'' (Colonel!
    khi gọi Trung tá Tanya von Degurechaff) và thuật ngữ ''đường bắn'' (line of fire)."]'
- segment_id: YS-LN05/Text/part0020.html/p000191
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mệnh lệnh: giữ ''lý thuyết suông trên bàn giấy'' (armchair
    theorizing), ''cơ động tốc độ cao'' (high-speed maneuvers) và ''đường bắn'' (line
    of fire)."]'
- segment_id: YS-LN05/Text/part0020.html/p000192
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh đáp: giữ ''Rõ!'' cho ''Yes, ma’am!''."]'
- segment_id: YS-LN05/Text/part0020.html/p000193
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật: giữ ''Tanya'' và ''các sĩ quan dày dạn kinh
    nghiệm của tiểu đoàn''."]'
