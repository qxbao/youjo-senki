- segment_id: YS-LN05/Text/part0025.html/p000656
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Dù sao đi nữa…*", giữ
    tên "Tanya", thuật ngữ "màn pháo kích đầy khí thế" (vigorous barrage).'']'
- segment_id: YS-LN05/Text/part0025.html/p000657
  kind: terminology_and_voice
  value: 'choices=[''Cấp bậc & đại từ trần thuật theo DEC-P01-001: "Thiếu tá Weiss"
    (Major Weiss) — gọi là "anh ta"; gọi Tanya là "nó".'', ''Thuật ngữ: "làm trinh
    sát hiệu chỉnh pháo" (spotting), "quyền làm chủ bầu trời của Đế quốc" (imperial
    air supremacy).'']'
- segment_id: YS-LN05/Text/part0025.html/p000658
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ & tình thái: "Quân đội Liên bang" (Federation Army),
    "cuộc tập kích ban đêm" (night attack), "máy bay tiêm kích" (fighter planes),
    giữ tình thái suy đoán "có lẽ là vì" (probably because) và "Về lý thuyết" (Theoretically).'']'
- segment_id: YS-LN05/Text/part0025.html/p000659
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Vấn đề duy nhất là…*",
    giữ tên "Tanya" và "phía Liên bang" (the Federation).'']'
- segment_id: YS-LN05/Text/part0025.html/p000660
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng "mình".'',
    ''Đơn vị, cấp bậc & thuật ngữ: "Tiểu đoàn Pháp sư Trên không số 203" (203rd Aerial
    Mage Battalion), "tác chiến trong mọi điều kiện thời tiết" (all-weather combat),
    "Trung úy Wüstemann và đại đội của anh ta" (First Lieutenant Wüstemann and his
    company).'']'
- segment_id: YS-LN05/Text/part0025.html/p000661
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: "đứa con cưng của
    mình" (my baby), "Tiểu đoàn Pháp sư Trên không số 203" (203rd Aerial Mage Battalion),
    giữ tình thái "có lẽ không phải" (probably isn\''t).'']'
- segment_id: YS-LN05/Text/part0025.html/p000662
  kind: terminology_and_voice
  value: 'choices=[''Thoại báo cáo của Serebryakov với Tanya: gọi "Trung tá" (Colonel),
    thuật ngữ "đơn vị tiền tiêu của Quân đội Liên bang" (Federation Army\''s advance
    unit), giữ tình thái "Có vẻ như" (It seems like) và "Chắc hẳn" (must have been).'']'
- segment_id: YS-LN05/Text/part0025.html/p000663
  kind: terminology_and_voice
  value: 'choices=[''Thoại câu hỏi của Tanya: cấp bậc "Trung úy Grantz" (Lieutenant
    Grantz), thuật ngữ "lực lượng bộ binh" (the infantry), "đội tiên phong của địch"
    (the vanguard).'']'
- segment_id: YS-LN05/Text/part0025.html/p000664
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Ừ nhỉ.*", giữ tên "Tanya",
    cụm "những người lính Liên bang tội nghiệp" (the poor Federation soldiers).'']'
- segment_id: YS-LN05/Text/part0025.html/p000665
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng số nhiều
    "bọn mình" (we).'', ''Thuật ngữ & tình thái: "tác chiến ban đêm" (night combat),
    "Kampfgruppe Salamander" (Salamander Kampfgruppe), "Đơn vị tiền tiêu của Liên
    bang" (Federation advance unit), tình thái "hẳn đang" (must be), "doanh trại chính"
    (main camp), "bắn mù" (firing blind).'']'
- segment_id: YS-LN05/Text/part0025.html/p000666
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ: giữ cụm "suy nghĩ viển vông, phù phiếm và vô ích"
    (fleeting, futile, wishful thinking).'']'
- segment_id: YS-LN05/Text/part0025.html/p000667
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya theo DEC-P01-001: tự xưng "bọn mình"
    (our) và "mình" (I), thuật ngữ "các tuyến phòng ngự" (defensive lines).'']'
- segment_id: YS-LN05/Text/part0025.html/p000668
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Serebryakov với Tanya: gọi "Trung tá", tự xưng "tôi",
    giữ tiểu từ lễ phép "ạ".'']'
- segment_id: YS-LN05/Text/part0025.html/p000669
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya: tự xưng "Tôi", gọi "Trung úy Grantz" (Lieutenant
    Grantz) ở ngôi thứ ba là "anh ta", giữ phủ định kép "không nghĩ ... lại đần độn
    đến mức không chỉ huy nổi".'']'
- segment_id: YS-LN05/Text/part0025.html/p000670
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Serebryakov với Tanya: gọi "Thưa Trung tá" (Colonel),
    cấp bậc "Trung úy Grantz" (Lieutenant Grantz).'']'
- segment_id: YS-LN05/Text/part0025.html/p000671
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật theo DEC-P01-001: giữ tên "Serebryakov" và "Tanya",
    gọi Tanya là "Nó" / "nó".'']'
- segment_id: YS-LN05/Text/part0025.html/p000672
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật & thoại báo cáo qua điện thoại: gọi Grantz là "anh
    ta"; thoại xưng hô chuẩn quân đội "Thưa Trung tá von Degurechaff, tôi là Trung
    úy Grantz đây ạ."'']'
- segment_id: YS-LN05/Text/part0025.html/p000673
  kind: terminology_and_voice
  value: 'choices=[''Thoại câu hỏi ngắn của Tanya: "Có chuyện gì bất ổn sao?"'']'
- segment_id: YS-LN05/Text/part0025.html/p000674
  kind: terminology_and_voice
  value: 'choices=[''Thoại báo cáo của Grantz với Tanya: giữ sắc thái lễ phép "ạ",
    số nhiều "chúng ta" (us), gọi địch là "chúng", thuật ngữ "diễn ra lẻ tẻ" (sporadic),
    "ghim chân chúng ta tại tuyến này để đánh lạc hướng" (keep us pinned down on this
    line as a distraction).'']'
- segment_id: YS-LN05/Text/part0025.html/p000675
  kind: terminology_and_voice
  value: 'choices=[''Thoại câu hỏi của Tanya với Grantz: gọi "anh" / "chỗ các anh",
    thuật ngữ "hai lữ đoàn địch" (two brigades).'']'
- segment_id: YS-LN05/Text/part0025.html/p000676
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown theo DEC-P01-002: "*Đúng vậy.*", giữ tên "Tanya",
    thuật ngữ "tác chiến phòng ngự" (defensive combat).'']'
- segment_id: YS-LN05/Text/part0025.html/p000677
  kind: terminology_and_voice
  value: 'choices=[''Thuật ngữ & tên riêng: "trận địa phòng ngự" (defensive position),
    "Kampfgruppe", "hai lữ đoàn" (two brigades), "một trung đoàn" (a regiment), "kháng
