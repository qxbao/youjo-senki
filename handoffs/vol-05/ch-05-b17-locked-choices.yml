- segment_id: YS-LN05/Text/part0025.html/p000696
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ tên "Tanya".'']'
- segment_id: YS-LN05/Text/part0025.html/p000697
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật theo DEC-P01-001: gọi Tanya là "nó" và giữ tên "Tanya",
