- segment_id: YS-LN05/Text/part0025.html/p000678
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm giữ nguyên độ mở và phủ định: "…Vậy nên nếu họ
    không cảm thấy áp lực thì sao?"'']'
- segment_id: YS-LN05/Text/part0025.html/p000679
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Grantz với Tanya: dịch "ma\''am" là "thưa Trung tá",
    giữ phủ định "hầu như chẳng có vẻ gì là được phối hợp với nhau cả" (hardly seem
    coordinated at all).'']'
- segment_id: YS-LN05/Text/part0025.html/p000680
  kind: terminology_and_voice
  value: 'choices=[''Thoại chỉ thị của Tanya với Grantz: gọi "anh", tự xưng "Tôi".'']'
- segment_id: YS-LN05/Text/part0025.html/p000681
  kind: terminology_and_voice
  value: 'choices=[''Thoại nhận lệnh ngắn gọn của Grantz: "Rõ."'']'
- segment_id: YS-LN05/Text/part0025.html/p000682
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật theo DEC-P01-001: giữ tên "Tanya" và "Weiss", gọi
