choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000159
  kind: terminology_and_voice
  value: locks=['Giữ đại từ gộp “chúng ta”, đại từ “chúng” quy chiếu kẻ địch, dấu
    gạch ngang dài (—), mệnh đề phủ định “chúng ta không phân biệt đối xử”, cùng các
    thuật ngữ “đám ô hợp”, “Đế quốc”, “Liên minh Entente”, “Cộng hòa”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000160
  kind: terminology_and_voice
  value: locks=['Giữ đại từ độc thoại nội tâm “mình” theo DEC-P01-001 (từ “nó” ở câu
    3 quy chiếu việc tôn vinh Being X), cùng các thuật ngữ “Elinium Type 95”, “lời
    nguyền”, “kẻ tự xưng là Thượng đế”, “Being X”, “học thuyết thăng tiến của Đạo
    quân Quan Đông”, “lòng yêu nước”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000161
  kind: terminology_and_voice
  value: locks=['Lược đại từ ngôi thứ hai ở vế điều kiện và dùng chủ ngữ khái quát
    “người ta” ở vế chính tại câu 1 theo quy ước direct-address choice, giữ biệt danh
    “Tsugene” và suy luận nhân quả ở câu 2.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000162
  kind: terminology_and_voice
  value: locks=['Bảo toàn cấu trúc so sánh phủ định tuyệt đối (“không một ai nên...
    hơn những người lính mới phải”) và cụm “cuộc sống nhàn hạ”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000163
  kind: terminology_and_voice
  value: 'locks=[''Giữ câu thông báo trạng thái vận hành quả cầu đặt trong ngoặc kép
    không in nghiêng theo DEC-P01-002: ““Đã thu thập tọa độ không gian, đã tính toán
    các đường né tránh khả dĩ, buồng giãn nở đang nạp ma lực bình thường.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000164
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” / “Mình” cho Tanya theo DEC-P01-001 (ở
    câu 4, từ “mình” là đại từ phản thân quy chiếu “chúng”), đại từ “Bọn chúng” /
    “chúng” cho đối phương, câu nghi ngờ phủ định ở câu 2, điều kiện phỏng đoán ở
    câu 3, cùng các thuật ngữ “ưu thế về quân số”, “các pháp sư Cộng hòa”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000165
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” / “Mình” theo DEC-P01-001, phủ định khả
    năng ở câu 2, cùng các cụm “tỉa gọn từng tên”, “diệt khổng lồ”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000166
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “Mình” theo DEC-P01-001 và mệnh đề phủ định ở
    câu 1.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000167
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời yêu cầu qua vô tuyến của Tanya: ““CP, yêu cầu phát cảnh
    báo chiến trường về một vụ kích nổ không gian.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000168
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời xác nhận của sở chỉ huy: ““CP nghe rõ. Sẽ phát cảnh báo
    kích nổ không gian ngay.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000169
  kind: terminology_and_voice
  value: locks=['Giữ dấu gạch ngang dài (—) ở câu 3 (lưu ý từ “nó” ở câu 1 quy chiếu
    “Elinium Type 95”), cùng các thuật ngữ “Elinium Type 95”, “mana”, “hệ thống bốn
    lõi đồng bộ hóa”, “thuật thức nổ”, “vận hành hết công suất”, “chồng chất giao
    thoa”, “khu vực chiến sự”, “quả cầu khiếm khuyết”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000170
  kind: terminology_and_voice
  value: 'locks=[''Giữ khẩu lệnh cảnh báo của Tanya với cấp dưới: ““Trung sĩ Schones!
    Chuẩn bị đón chấn động!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000171
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” theo DEC-P01-001 (từ “Nó” đầu câu 2 chỉ
    quy chiếu chiêu thức nổ), tính giả định hệ quả và mệnh đề phủ định ở cuối câu
    2, cùng các thuật ngữ “nhiễu mana”, “tác chiến có tổ chức”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000172
  kind: terminology_and_voice
  value: locks=['Bảo toàn sắc thái mỉa mai ở câu 1 (“đã tử tế nhận xét rằng ngoài
    việc tự sát ra thì nó chẳng có tác dụng gì cả”), câu điều kiện ở câu 2, sự tương
    phản ở câu 3, cùng các thuật ngữ “đơn vị huấn luyện”, “thuật thức”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000173
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời tuyên bố của Tanya và nhịp điệp ba lần “của chúng ta”:
    ““Hãy biến đi, lũ quân thù xấc xược. Đây là Đế quốc của chúng ta, bầu trời của
    chúng ta, quê hương của chúng ta.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000174
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “Mình” / “mình” theo DEC-P01-001, tình thái “hẳn
    sẽ”, cùng các cụm “những đánh giá tích cực”, “tinh thần dân tộc”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000175
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” theo DEC-P01-001, mệnh đề nhượng bộ giả
    định ở câu 2, cùng các thuật ngữ “đức tin tôn giáo”, “lời nguyền của Being X”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000176
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời tuyên cáo mang âm hưởng kinh thánh cổ kính của Tanya với
    cặp đại từ “các ngươi – chúng ta” và các thuật ngữ “Tổ quốc”, “Thượng đế”: ““Nếu
    các ngươi đến để khinh nhờn Tổ quốc, chúng ta sẽ cầu nguyện lên Thượng đế.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000177
  kind: terminology_and_voice
  value: locks=['Giữ tên riêng “Tanya” và đại từ trần thuật ngôi thứ ba “nó” (“thay
    vì tập trung các phát bắn vào Tanya, họ định hành hạ nó đến chết giữa không trung”)
    theo đúng DEC-P01-001, đại từ “Họ” / “họ” cho pháp sư địch, cùng các thuật ngữ
    “Các pháp sư địch”, “vùng hỏa lực đan chéo”, “các thuật thức nổ thông thường”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000178
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời cầu nguyện bắt buộc khi kích hoạt Type 95 với cụm hô gọi
    “Hỡi Chúa”, tự xưng “con” và thuật ngữ “Tổ quốc”: ““Hỡi Chúa, xin hãy cứu lấy
    Tổ quốc. Hỡi Chúa, xin hãy ban cho con sức mạnh để đánh bại kẻ thù của đất nước
    con.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000179
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” theo DEC-P01-001, bảo toàn nguyên vẹn đối
    tượng và độ mở của câu hỏi nội tâm ở câu 1 theo canon/style-guide.md, dùng “Bọn
    chúng” / “Đám người này” ở câu 1–2 và chuyển sang “các người” khi cằn nhằn hướng
    tới đám người cuồng chiến ở câu 3.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000180
  kind: terminology_and_voice
  value: locks=['Bảo toàn nguyên vẹn hai câu hỏi nội tâm ở câu 1–2 (bao gồm câu hỏi
    phủ định ở câu 2), suy luận quá khứ “Hẳn là...” ở câu 3, dấu chấm phẩy ở câu 4,
    cùng cách dùng “bọn chúng” / “chúng” ở câu 1–3 và “họ” ở câu 4.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000181
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” theo DEC-P01-001, đại từ “họ” khi giả định
    đối phương cũng là những con người duy lý giống mình, bảo toàn khả thể phỏng đoán
    ở câu 1, câu hỏi điều kiện phủ định kèm dấu chấm lửng “...?” ở câu 3, và hai câu
    hỏi tự vấn ở câu 4–5 theo canon/style-guide.md.']
