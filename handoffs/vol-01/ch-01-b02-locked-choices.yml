choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000012: locks: [''Giữ hô hiệu
    “Goliath 07, rõ…” và các thuật ngữ pháo binh “Khẩu pháo chuẩn”, “bắn hiệu chỉnh”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000013: locks: [''Giữ các thuật
    ngữ “pháp sư không quân”, “Thiếu úy Tanya Degurechaff”, “quan sát viên pháo binh”,
    địa danh “vùng cực bắc Norden”, chi tiết máy vô tuyến “to gần bằng Tanya” (lặp
    tên Tanya, không dùng đại từ “cô”), và câu độc thoại nội tâm dùng đại từ “mình”
    cùng cấu trúc phủ định kép “không phải mình không tự hỏi hay nghi ngờ việc mình
    đang làm khi bay ra đây”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000014: locks: [''Giữ khẩu lệnh
    báo cáo “Đã xác nhận điểm rơi…”, tình thái ước lượng “Có vẻ trúng gần mục tiêu.
    Sai số có vẻ nằm trong giới hạn cho phép là mười mét.” và mệnh lệnh “Bắn hiệu
    lực.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000015: locks: [''Giữ hô hiệu
    “Goliath 07, rõ.” và khẩu lệnh “Bắt đầu nhiệm vụ bắn pháo ngay.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000016: locks: [''Giữ cấu trúc
    phủ định “không thể phủ nhận trong đó ánh lên vẻ bực bội”, đại từ nội tâm “mình”,
    thuật ngữ “tái sinh”, chi tiết “mang giới tính đối lập” và câu hỏi nội tâm không
    in nghiêng theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000017: locks: [''Giữ đại từ
    tự quy chiếu “mình”, quan hệ nhượng bộ–nhân quả “Ban đầu, dù con gái phát triển
    nhanh hơn con trai, chênh lệch kích thước quá lớn khiến mình không thể điều khiển
    cơ thể với khả năng giữ thăng bằng mà mình đã tin cậy suốt nhiều năm”, và nhận
    thức trở thành “một đứa trẻ bất lực” kể từ khi nhập ngũ.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000018: locks: [''Giữ đại từ
    “Mình / mình”, đại từ ngôi thứ ba “anh ta” cho bạn tập nam khi đấu tập, và các
    chi tiết khẩu súng quá to, ngắm bắn tệ hại, độ giật làm bầm tím vai cùng ánh mắt
    thoáng vẻ thương hại.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000019: locks: [''Giữ đại từ
    “mình”, các thuật ngữ “quả cầu tính toán”, “ba vectơ số”, “chồng miền con số lên
    các thuật thức gây nhiễu ma pháp”, “chồng thế giới lên các thuật thức của mình”,
    và sắc thái mức độ “dù chỉ vừa đủ”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000020: locks: [''Giữ tình thái
    suy đoán “Có lẽ mình đã vượt qua được mọi dè dặt về ma pháp nhờ tính hữu dụng
    của nó như một công cụ” và câu hỏi phản vấn “Nhưng tại sao cứ có công cụ trong
    tay là mình phải dùng nó?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000021: locks: [''Giữ lời cảm
    thán mở đầu “À, ra vậy.”, đại từ khái quát “chúng ta”, thuật ngữ kèm chỉ số chú
    thích “tên lửa đạn đạo liên lục địa⁴” ở lần xuất hiện đầu và không kèm chỉ số
    ở lần thứ hai, câu hỏi phản vấn và sự tương đồng với tin đồn về quan hệ căng thẳng
    với các nước láng giềng.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000022: locks: [''Giữ tên “Đế
    quốc”, “Liên minh Entente”, cụm “những vụ đụng độ biên giới không chính thức”
    và mệnh đề đối lập “Nhưng ít nhất trên chính trường quốc tế, trên danh nghĩa không
    có tranh chấp nào về vùng lãnh thổ này.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000023: locks: [''Giữ điểm nhìn
    “Với Tanya” (không dùng đại từ “cô”), tên “Đế quốc”, “Liên Xô”, và phép so sánh
    việc các nước xung quanh tự tránh tranh chấp biên giới vì sức mạnh áp đảo của
    Đế quốc.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000024: locks: [''Giữ nhịp tự
    đính chính thì quá khứ “…À không, đã từng mạnh.” và nhận định “Điều đáng tiếc
    duy nhất khi bàn về sức mạnh của Đế quốc là phải nhắc đến nó như chuyện đã qua.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000025: locks: [''Giữ dấu ngoặc
    kép quanh chữ “vô tình” trong “những phát súng “vô tình””, quan hệ nhân quả “dẫn
    đến giao tranh lẻ tẻ vì hiểu lầm”, việc xử lý ở “cấp chỉ huy địa phương” và cấu
    trúc “không thể phủ nhận căng thẳng vẫn không ngừng gia tăng”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000026: locks: [''Giữ giả định
    trái thực tế trong hoàn cảnh bình thường, cách lặp tên “Tanya” (không dùng “cô”),
    các thuật ngữ “tình trạng “bán chiến tranh””, “Chuẩn úy Tanya Degurechaff”, “học
    viện quân sự”, “Xưởng Vũ khí Kỹ thuật” và “Bộ Tư lệnh Hậu cần”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000027: locks: [''Giữ cách lặp
    tên “Tanya” hoặc tỉnh lược chủ ngữ xuyên suốt đoạn (không dùng đại từ “cô”), các
    thuật ngữ “ngoại giao bên miệng hố chiến tranh”, “lục quân”, “học viện quân sự”,
    “thiếu úy” (viết thường), “hô hiệu Fairy 08”, và dấu nhấn mạnh Markdown `*nhỏ
    tuổi*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000028: locks: [''Giữ cách lặp
    tên “Tanya”, các thuật ngữ “lục quân biên giới”, “Đơn vị biên chế”, “trường đào
    tạo sĩ quan ma pháp”, cùng hai mốc thời gian “trực chờ trong bốn mươi tám giờ”
    và “vào ca trực cách đây hai mươi tư giờ”.'']'
  non_canon: true
