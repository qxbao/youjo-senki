    câu 3.; emphasis=Không dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000069
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại của Tanya nói với Lergen.; terms_and_ranks=huấn luyện;
