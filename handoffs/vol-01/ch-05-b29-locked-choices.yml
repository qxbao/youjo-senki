- segment_id: YS-LN01/Text/chapter011b.xhtml/p000067
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya với Lergen: tự xưng ''tôi'', quy chiếu
    cấp trên bằng ''họ''.; terms_and_ranks=đơn vị.; modality_and_negation=Giữ câu
