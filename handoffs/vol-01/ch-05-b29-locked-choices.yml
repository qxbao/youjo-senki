    của Lergen ('Đó chẳng phải là một câu trả lời. Nghe còn chẳng có lý chút nào.').;
    emphasis=Không dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000072
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Kết hợp thoại và độc thoại nội tâm của Tanya: trong thoại
    nói với Lergen (câu 1, câu 4) tự xưng ''tôi''; trong độc thoại nội tâm xen giữa
    (câu 2, câu 3) tự quy chiếu bằng ''Mình'' / ''mình'' theo đúng DEC-P01-001; quy
    chiếu cấp trên bằng ''Họ'' / ''họ''.; terms_and_ranks=ra trận; điều chuyển; người
    chỉ huy; thành lập một đơn vị; tiểu đoàn; thực chiến.; modality_and_negation=Giữ
    lời thách thức nhượng bộ ở câu 1, chuỗi phủ định giải thích lý do dám nói cứng
    ở câu 2–3 (''biết họ sẽ không làm thế'', ''là chuyện không thể tưởng tượng nổi'',
    ''chẳng ngần ngại làm tới'') và câu điều kiện đối lập ở c'
