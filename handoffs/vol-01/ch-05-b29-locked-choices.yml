    nhân đang tại ngũ).; modality_and_negation=Giữ so sánh giả định ''cứ như thể...''
    ở câu 1–2, cấu trúc tăng tiến khác chủ ngữ ''không chỉ chúng ta không thể dành
    ra thời gian để huấn luyện đơn vị, mà còn chẳng có lấy một người lính kỳ cựu nào
    dùng được nữa'' theo đúng style-guide.md, và ẩn dụ '''
