    bị mất trí không vậy?'' và khẳng định đối lập hoàn toàn ở câu 2.; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000068
  kind: terminology_and_voice
  value: pov_and_pronouns=Độc thoại nội tâm phân tích nguyên lý quân sự của Tanya.;
    terms_and_ranks=đơn vị có đủ quân số; khóa huấn luyện cơ bản; kinh nghiệm thực
