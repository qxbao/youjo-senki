- segment_id: YS-LN01/Text/chapter011b.xhtml/p000054
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại trực tiếp của Tanya nói riêng với Trung tá von Lergen:
    gọi cấp trên bằng quân hàm ''thưa Trung tá'' kèm tiểu từ kính ngữ ''ạ''.; terms_and_ranks=Trung
    tá.; modality_and_negation=Giữ nguyên câu hỏi trực tiếp mở đầu cuộc trao đổi riêng.;
    emphasis=Không dùng dấu *...* (nguồn không có thẻ nhấn mạnh theo DEC-P01-002).'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000055
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu nhất quán bằng
    ''mình'' / ''Mình'' theo DEC-P01-001.; terms_and_ranks=thành lập bước đầu; đơn
    vị; Trung ương; triển khai; căn cứ ở phía đông nam; cục diện cuộc chiến; mệnh
    lệnh.; modality_and_negation=Giữ mức độ khả thể toán học ''khả năng phải đi về
    phía bắc hoặc phía tây là khác không'' và mệnh đề đối lập ''nhưng những mệnh lệnh
    này lại yêu cầu phải lập tức di chuyển về phía đông nam''.; emphasis=Không dùng
    dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000056
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''Mình'' / ''mình'';
    quy chiếu Bộ Tổng Tham mưu bằng ''họ''.; terms_and_ranks=Quy trình tác chiến tiêu
    chuẩn; thành lập một đơn vị.; modality_and_negation=Giữ định mức tối thiểu ''ít
    nhất sáu tháng'' ở câu 1 và phủ định hoàn toàn kèm câu hỏi gián tiếp giả định
    ''hoàn toàn không hiểu nổi tại sao họ lại cho rằng đơn vị của mình sẽ sẵn sàng
    sớm hơn nhiều đến thế'' ở câu 2.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000057
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Trung tá von Lergen với Tanya: gọi Tanya là ''Cô''
    kết hợp đại từ phản thân ''mình'' trong lời thoại.; terms_and_ranks=Giới chóp
    bu; đơn vị.; modality_and_negation=Giữ khẳng định hoàn tất về mặt quân số (''bốn
    mươi tám người'') và nhận định chủ quan của cấp trên (''coi như đơn vị đã được
    thành lập xong'').; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000058
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya đáp Lergen: dùng đại từ ''nó'' để quy chiếu
    tập thể đơn vị vừa gom đủ người.; terms_and_ranks=đơn vị.; modality_and_negation=Giữ
    dấu nháy đơn trích dẫn lại từ ‘thành lập xong’ của Lergen và mệnh đề phủ định
    đối lập ''nhưng nó vẫn chưa phải là một đơn vị''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000059
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: dịch đại từ ngôi thứ hai phiếm
    chỉ ở câu 2 thành ''người ta''; tự quy chiếu bằng ''mình'' ở câu 3 và gọi Bộ Tổng
    Tham mưu là ''họ''.; terms_and_ranks=Kẻ nghiệp dư; lực lượng chiến đấu hiệu quả;
    hệ thống chỉ huy; quân nhân chính khách; Bộ Tổng Tham mưu.; modality_and_negation=Giữ
    phủ định kép ở câu 1 (''thường không nhận ra rằng... không phải là một''), điều
    kiện phủ định ''bằng không, đó chỉ là một đơn vị về mặt con số mà thôi'' ở câu
    2, và kỳ vọng giả định ''nên mình kỳ vọng họ phải hiểu điều đó chứ'' ở câu 3.;
    emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000060
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''Mình''; quy
    chiếu Bộ Tổng Tham mưu bằng ''họ'' / ''chính họ''; đại từ ''nó'' quy chiếu việc
    cưỡng ép triển khai.; terms_and_ranks=Không có thuật ngữ mới.; modality_and_negation=Giữ
    cấp độ tăng tiến ''chỉ càng làm mọi chuyện trở nên đáng sợ hơn'' và câu tự vấn
    tương phản ''tự hỏi điều gì lại khiến họ cảm thấy phải cưỡng ép chuyện này, trong
    khi chính họ cũng hiểu rõ nó phi thực tế đến mức nào''.; emphasis=Không dùng dấu
    *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000061
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen với Tanya: gọi Tanya là ''cô''.; terms_and_ranks=Quân
    số; trang bị; Bộ Tổng Tham mưu.; modality_and_negation=Giữ câu liệt kê phủ định
    ngắn gọn ''Quân số, trang bị, không có vấn đề gì cả.'' và lời khen ngợi từ Bộ
    Tổng Tham mưu.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000062
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya với Lergen: hô ngữ ''thưa Trung tá'', dùng
    đại từ ngôi thứ nhất số nhiều ''Chúng tôi'' / ''chúng tôi'' đại diện cho tiểu
    đoàn của mình.; terms_and_ranks=Trung tá; tiểu đoàn huấn luyện; tính gắn kết của
    đơn vị; huấn luyện thực hành; sự đồng thuận cơ bản; các chỉ huy.; modality_and_negation=Giữ
    sắc thái mỉa mai lịch sự ở câu 1 và dấu gạch ngang dài nối mệnh đề giải thích
    thực trạng đang dang dở của đơn vị ở câu 2.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000063
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen hỏi Tanya: gọi Tanya là ''cô''.; terms_and_ranks=đơn
    vị; hạn chế về mặt tác chiến.; modality_and_negation=Giữ câu hỏi xác nhận lại
    ý của Tanya.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000064
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya với Lergen: tự xưng ''Tôi'' kèm ''ạ'',
    quy chiếu binh lính trong đơn vị bằng ''họ''.; terms_and_ranks=Không có thuật
    ngữ mới.; modality_and_negation=Giữ khẳng định dứt khoát ''Tất nhiên rồi ạ.''
    và tình thái giả định ''Tôi sẽ cần ít nhất nửa năm để gắn kết họ lại với nhau.''.;
    emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000065
  kind: terminology_and_voice
  value: pov_and_pronouns=Độc thoại nội tâm nêu nguyên lý chung của Tanya (không xuất
    hiện đại từ ngôi thứ nhất).; terms_and_ranks=tổ chức; cơ thể sống; đám binh lính;
    huấn luyện tác chiến bổ túc.; modality_and_negation=Giữ sự đối lập khái niệm 'biến
    một tổ chức thành một cơ thể sống' ở câu 1, định mức 'ít nhất sáu tháng' ở câu
    2 và điều kiện nhượng bộ giả định trái thực tế 'Mà ngay cả khi không phải bận
    tâm về chuyện đó đi nữa, đám binh lính này cũng tuyệt đối cần...' ở câu 3.; emphasis=Không
    dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000066
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen với Tanya: gọi Tanya là ''Cô'' / ''cô'',
    quy chiếu ''Cấp trên'' bằng ''họ''.; terms_and_ranks=khóa huấn luyện ban đầu;
    Cấp trên; đơn vị; tiền tuyến.; modality_and_negation=Giữ sự đối chiếu giữa tốc
