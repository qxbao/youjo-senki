  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: dùng ''chúng ta'' cho phía
    Đế quốc; quy chiếu cấp trên bằng ''họ'' (lưu ý tách rõ đại từ quy chiếu đám lính
