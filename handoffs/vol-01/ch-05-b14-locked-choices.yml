    lập khẳng định – phủ định: khóa ''hỏi một cách nghiêm túc thực sự chứ không hề
    mỉa mai''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000347
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại (Zettour -> Tanya): gọi Tanya là ''cô'' / ''Cô''.",
    "Thuật ngữ: khóa ''lực lượng phản ứng nhanh'', ''quyền chỉ huy trực tiếp của Bộ
