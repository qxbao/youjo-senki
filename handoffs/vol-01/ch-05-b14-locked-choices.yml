    tế: khóa ''Bộ Tư lệnh Sẵn sàng Chiến đấu'' và câu điều kiện giả đ'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000346
  kind: terminology_and_voice
  value: 'choices=["Đại từ điểm nhìn (DEC-P01-001): trần thuật ngôi thứ ba từ góc
