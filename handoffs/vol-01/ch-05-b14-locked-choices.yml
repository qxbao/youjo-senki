- segment_id: YS-LN01/Text/chapter011.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ & giọng thoại (Tanya -> Zettour): giữ cách dịch thành
    ngữ tự nhiên ''Mọi chuyện đang tiến triển thuận buồm xuôi gió cả ạ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=["Tình thái thoại (Zettour -> Tanya): giữ lời tán đồng và giả định
