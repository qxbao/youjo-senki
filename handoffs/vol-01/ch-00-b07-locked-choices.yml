choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000129: locks: [''Giữ nét lắp
    bắp mở đầu “L-lúc nào”, cặp đại từ “ta - các ngươi”, cụm “lũ hoài nghi..., chẳng
    có lấy một chút đức tin!” và ẩn dụ kinh doanh “làm ta lỗ vốn rồi!”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000130: locks: [''Giữ câu hỏi
    tu từ phủ định và cụm thuật ngữ “khiếm khuyết trong mô hình kinh doanh”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000131: locks: [''Giữ cặp đại
    từ “Ta - các ngươi”, thuật ngữ “hợp đồng” và “giác ngộ”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000132: locks: [''Giữ cặp đại
    từ đối đáp “Ông - tôi”, các thuật ngữ “thư bảo đảm”, “hợp đồng”, “trao tận tay”,
    “phương tiện lưu trữ lâu bền” và sắc thái giả định tiếc nuối ở quá khứ (“Giá mà
    ông còn để lại...”).'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000133: locks: [''Giữ đại từ
    “Ngươi / ngươi”, danh xưng “Thượng đế” và cụm “cúi đầu trước luật pháp của Thượng
    đế”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000134: locks: [''Giữ từ đệm
    mở đầu “Ừm”, đối lập “phép thuật” - “Khoa học tự nhiên”, cách dịch chủ thể tập
    thể “loài người / chúng tôi”, cấu trúc phủ định kép “nếu không có mối đe dọa cận
    kề thì cả cảm giác khủng hoảng lẫn lòng thành kính đều chẳng lan rộng” và câu
    kết điều kiện phủ định.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000135: locks: [''Giữ nhịp ngập
    ngừng nhiều dấu ba chấm của Being X và đuôi câu hỏi “ngươi biết chứ?” tạo tiền
    đề trực tiếp cho p000136.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000136: locks: [''Giữ cặp đại
    từ “Ông - tôi - mình” và cấu trúc bắt lời “Ông bảo tôi biết, nhưng tôi e là mình
    sẽ không biết cho đến khi ông nói cho tôi hay.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000137: locks: [''Giữ định danh
    “Being X”, đại từ “ông ta” và “tôi”, nét nghĩa tự nhận thức về thái độ “ngày càng
    cợt nhả” và câu giả định thuê “dịch vụ phiên dịch”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000138: locks: [''Giữ đại từ
    “Ngươi / ngươi”, sở hữu cách “Đấng Tạo Hóa của ngươi” và cụm “chẳng tìm đâu ra
    được một chút bản lĩnh đạo đức nào”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000139: locks: [''Giữ nhấn mạnh
    Markdown `*Phản đối!*` theo DEC-P01-002, cặp đại từ “Tôi - ông” và cụm “chuẩn
    mực đạo đức và xã hội”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000140: locks: [''Giữ cặp đại
    từ số nhiều “Các ngươi - bọn ta” và thuật ngữ “tái sinh”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000141: locks: [''Giữ từ đệm
    “Ừm”, cặp đại từ “tôi - ông” cùng “Loài người / chúng tôi”, thuật ngữ “tuổi thọ
    trung bình”, tên tác phẩm nguyên gốc “An Essay on the Principle of Population”
    của Malthus kèm ký hiệu chú thích `³`, cụm “sinh sôi nảy nở như chuột” và “mô
    hình kinh doanh của ông có khiếm khuyết”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000142: locks: [''Giữ cấu trúc
    điều kiện giả định trái thực tế “Nếu số tín đồ tăng cùng với dân số thì mọi chuyện
    đã ổn rồi!”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000143: locks: [''Giữ cặp đại
    từ “Tôi - ông”, cụm “khiếm khuyết trong mô hình kinh doanh của ông”, “phân tích
    tâm lý nhóm khách hàng” và “sai lầm mang tính cấu trúc ngay từ khâu lập kế hoạch”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000144: locks: [''Giữ đại từ
    “ngươi” và đủ bốn điều kiện trong câu hỏi tổng kết của Being X (“từng là đàn ông”,
    “sống trong một thế giới khoa học”, “chẳng biết gì về chiến tranh”, “không bị
    đe dọa”).'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000145: locks: [''Giữ nhịp sững
    sờ “…Hả? Gì cơ?” và câu tự nhận thức “Tôi… ừm, hình như mình vừa làm hỏng chuyện
    rồi.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000146: locks: [''Giữ định danh
    “Being X”, chức danh “giám đốc nhân sự”, cụm “lôi kéo hàng loạt kỹ sư kỳ cựu của
    chúng tôi” và đại từ “Tôi / tôi”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000147: locks: [''Giữ cặp đại
    từ “ta - ngươi”, sắc thái khinh miệt “ngay cả hạng như ngươi” và cụm “thức tỉnh
    đức tin”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000148: locks: [''Giữ từ đệm
    “Ừm”, hô ngữ “Thượng đế ơi”, cụm “ân sủng của Chúa”, bước chuyển xưng hô có chủ
    ý từ “ông” sang “ngài” ở nửa sau đoạn, lời khẩn khoản “xin ngài hạ tay xuống được
    không?” và câu rút lại ý “chẳng biết gì về chiến tranh” để khớp với p000144.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000149
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000149: locks: [''Giữ câu quát
    bác bỏ sự xu nịnh “Giờ thì có quỳ lạy cũng chẳng ích gì đâu!”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000150: locks: [''Giữ hô ngữ
    “thưa Chúa!”, đại từ “chúng tôi” và “ngài” khi quy chiếu về Being X (“Chuyện ngài
    tồn tại cũng vậy!”), so sánh “tanh hơn cả chợ cá”, và sau khi sửa lỗi ở câu áp
    chót thì giữ chủ thể khái quát (“dù là nam hay nữ thì cũng chẳng quan trọng”)
    gắn với kết luận “Rõ ràng cả hai giới đều có ham muốn tình dục!”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000151: locks: [''Giữ cặp đại
    từ “Ngươi - ta” và quyết định dứt khoát của Being X.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000152: locks: [''Giữ câu hỏi
    phản xạ ngắn gọn “Gì cơ?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000153
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000153: locks: [''Giữ cặp đại
    từ “Ta - ngươi” và đúng bốn dấu chấm than `!!!!` ở cuối câu.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000154
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000154: locks: [''Giữ đánh dấu
    chữ nghiêng `*...*` bao trọn toàn đoạn theo DEC-P01-002 và giọng tổng kết hồi
    ức ở ngôi thứ nhất (“tôi”).'']'
  non_canon: true
