segment_id_end: YS-LN01/Text/chapter011.xhtml/p000340
choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000312
  kind: terminology_and_voice
  value: 'locks=[''Giữ điểm nhìn của Zettour theo đúng giới hạn chủ thể của DEC-P01-001:
    dùng đại từ “cô” quy chiếu Tanya, “họ” quy chiếu Bộ Tổng Tham mưu, “Quân đội Đế
    quốc” và “tiểu đoàn” (từ “nó” ở cuối câu 2 chỉ quy chiếu danh từ bất động vật
    “tiểu đoàn”).'']'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000313
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “cô” và chức danh “sĩ quan lập đội” đồng bộ với p000315–p000317.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000314
  kind: terminology_and_voice
  value: locks=['Giữ thành ngữ “lấy độc trị độc”, đại từ “ông” quy chiếu Zettour,
    dấu gạch ngang dài, “tiểu đoàn pháp sư”, “đại úy”, “đại đội” và phủ định “chưa
    từng chỉ huy lấy một đại đội”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000315
  kind: terminology_and_voice
  value: locks=['Giữ “sĩ quan lập đội”, “thời Trung Cổ”, “lính đánh thuê”, “quân chính
    quy”, “sĩ quan”, “đại đội trưởng”, “đơn vị lính đánh thuê” và các cấu trúc phủ
    định ở câu 2, câu 4 (từ “nó” ở cuối câu 4 chỉ quy chiếu “cơ chế sót lại từ ba
    trăm năm trước”).']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000316
  kind: terminology_and_voice
  value: locks=['Giữ mệnh đề điều kiện kèm phủ định ở câu 1, khả thể kèm phủ định
    ở câu 2 và chức danh “sĩ quan lập đội”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000317
  kind: terminology_and_voice
  value: locks=['Giữ “‘Sĩ quan lập đội’ ạ? Chẳng phải đó là một chức danh khá cổ lỗ
    sao ạ?”']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000318
  kind: terminology_and_voice
  value: locks=['Giữ “Tanya” / “Cô” / “cô”, “ông” quy chiếu Zettour, “chức danh đó”
    và mức độ suy đoán chắc chắn “Chắc chắn chẳng mấy chốc cô sẽ hiểu ra...”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000319
  kind: terminology_and_voice
  value: locks=['Giữ chính xác phạm vi nhấn mạnh Markdown ở 2 câu đầu `*Mình có thể
    trông cậy vào cô bé này. Cô bé xuất sắc đến mức giá như là đàn ông thì mình rất
    sẵn lòng gả cháu gái cho.*` theo DEC-P01-002 (gồm đại từ nội tâm “Mình” / “mình”,
    “cô bé này” / “Cô bé” và giả định trái thực tế “giá như là đàn ông...”), đồng
    thời giữ câu thứ 3 không in nghiêng với đại từ trần thuật “cô” và “ông”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000320
  kind: terminology_and_voice
  value: locks=['Giữ cặp xưng hô “tôi – cô”, “tiểu đoàn”, “đại úy”, “đơn vị” và “thăng
    hàm thiếu tá”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000321
  kind: terminology_and_voice
  value: locks=['Giữ “ông” quy chiếu Zettour, “cô” – “mình” quy chiếu Tanya, “tiểu
    đoàn”, “Cục Quân vụ”, giả định dè dặt ở câu 1 và các cấu trúc điều kiện/phủ định
    ở câu 2, câu 4.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000322
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu, tự xưng “tôi” kèm “ạ” và chức danh “tiểu
    đoàn trưởng”: “…Vậy xét về mọi mặt thực chất, tôi là một tiểu đoàn trưởng sao
    ạ?”'']'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000323
  kind: terminology_and_voice
  value: locks=['Giữ cặp xưng hô “Tôi – Cô / cô” và cụm “bổ nhiệm và thăng quân hàm”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000324
  kind: terminology_and_voice
  value: locks=['Giữ “cô” / “Cô” – “mình” quy chiếu Tanya, “tiểu đoàn”, “trung úy”,
    “chuẩn tướng” và các cấu trúc phủ định/khẳng định chắc chắn ở câu 1, câu 3.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000325
  kind: terminology_and_voice
  value: locks=['Giữ “Cô” / “cô” quy chiếu Tanya, “Ông” quy chiếu Zettour, “pháp sư”,
    “sĩ quan chỉ huy”, “búa rìu chỉ trích” và “các phòng ban khác”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000326
  kind: terminology_and_voice
  value: 'locks=[''Giữ câu hỏi xin phép của Tanya: “Tôi có thể nói một điều dễ gây
    ác cảm không ạ?” đồng bộ cụm “một điều dễ gây ác cảm” với p000327.'']'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000327
  kind: terminology_and_voice
  value: locks=['Giữ “cô” / “Cô” quy chiếu Tanya, câu hỏi nội tâm “Một điều dễ gây
    ác cảm ư?” đồng bộ với p000326, “tiểu đoàn”, “giới chóp bu”, mệnh đề nhượng bộ
    phủ định ở câu 4 và câu điều kiện suy luận ở câu 5.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000328
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời đáp của Zettour với tự xưng “tôi”: “Giờ mới lo chuyện đó
    thì hơi muộn rồi đấy nhỉ? Chuyện gì nào? Cứ nói cho tôi nghe xem.”'']'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000329
  kind: terminology_and_voice
  value: locks=['Giữ “Tôi sẽ có toàn quyền đối với việc thành lập đơn vị chứ ạ?”']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000330
  kind: terminology_and_voice
  value: locks=['Giữ phân biệt “tôi”, “chúng tôi”, “cô” – “mình” và cụm “nhân sự và
    trang thiết bị”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000331
  kind: terminology_and_voice
  value: locks=['Giữ “cô” / “Cô” – “mình” quy chiếu Tanya, “Họ”, “Cục Quân vụ”, “Cục
    Nhân sự” và “Kordel”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000332
  kind: terminology_and_voice
  value: locks=['Giữ “cô” quy chiếu Tanya và cụm “nhân sự lẫn trang bị” đồng bộ với
    p000330.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000333
  kind: terminology_and_voice
  value: locks=['Giữ “Cô” – “mình” và mốc giới hạn trần quân số “từ bốn mươi tám người
    trở xuống” khớp với p000335.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000334
  kind: terminology_and_voice
  value: locks=['Giữ “Ông” quy chiếu Zettour, “cô” quy chiếu Tanya, “tiểu đoàn”, “tiểu
    đoàn tăng cường” và “đơn vị thử nghiệm”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000335
  kind: terminology_and_voice
  value: locks=['Giữ “Bốn mươi tám người ạ? Một tiểu đoàn tăng cường. Xin cảm ơn ngài.”']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000336
  kind: terminology_and_voice
  value: locks=['Giữ “tiểu đoàn phản ứng nhanh”, “chúng ta”, “tăng cường”, “Tôi” và
    “đơn vị hoàn toàn mới” (từ “nó” ở câu 2 chỉ quy chiếu “tiểu đoàn phản ứng nhanh”).']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000337
  kind: terminology_and_voice
  value: locks=['Giữ “ông” – “mình” quy chiếu Zettour, chính xác phạm vi nhấn mạnh
    Markdown `*Liệu các vị có dùng nổi một lực lượng phản ứng nhanh bị thiếu hụt ngân
    sách hay không?*` theo DEC-P01-002 (phần ngoài câu hỏi không in nghiêng), “lực
    lượng phản ứng nhanh”, “Cục Tác chiến” và “Rudersdorf”.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000338
  kind: terminology_and_voice
  value: locks=['Giữ “Rudersdorf”, phép so sánh giá trị chiến thuật ở câu 2 và giả
    định đồng thuận ở câu 3.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000339
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “cô”, hai cấu trúc phủ định dứt khoát và tên gọi đầy đủ
    “Cụm tập đoàn quân phương Tây hay Cụm tập đoàn quân phương Bắc” đồng bộ với ch-05-b03
    p000045.']
- segment_id: YS-LN01/Text/chapter011.xhtml/p000340
  kind: terminology_and_voice
  value: locks=['Giữ “cô” quy chiếu Tanya, “binh lính tinh nhuệ”, “tiền tuyến”, “các
    bộ tư lệnh khu vực”, “Cục Tác chiến”, “các thành viên nòng cốt”, “kinh nghiệm
    thực chiến” và hai cấu trúc phủ định ở câu 2, cuối câu 3.']
