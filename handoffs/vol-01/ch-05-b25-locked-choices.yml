    1, so sánh giả định ở câu 2 và phủ định giả định ''Có nằm mơ tôi cũng chẳng bao
    giờ ngờ rằng sẽ có ngày...'' ở câu 4.; emphasis=Không dùng dấu *...* (nguồn không
    nhấn mạnh).'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000611
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại mệnh lệnh của Tanya trước toàn đội: gọi học viên
    là ''mọi người'', tự xưng ''tôi'', quy chiếu cá nhân vi phạm bằng ''ai'' / ''người
    đó''.; terms_and_ranks=đánh chặn; lộ trình; oanh kích ma pháp.; modality_and_negation=Giữ
    nguyên hai câu điều kiện ''Nếu không muốn chết thì hãy đánh chặn đi'' và ''nếu
    ai đi chệch khỏi lộ trình, đích thân tôi sẽ...''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000612
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Điểm nhìn ngôi thứ nhất của Visha: ''tôi'' / ''mình'' và
    số nhiều ''chúng tôi''; quy chiếu ''Đại úy von Degurechaff'' bằng ''Cô ấy''.;
    terms_and_ranks=Đại úy von Degurechaff; đạn giảm liều phóng; đạn tập.; modality_and_negation=Giữ
    giả định phủ định hồi cố ''lẽ ra tôi không nên ngạc nhiên khi phát hiện...'',
    ngoặc kép ''“đánh thức chúng tôi dậy”'' và phủ định ''hoàn toàn không phải là
    lời dọa suông''.; emphasis=Khóa chính xác cụm nhấn mạnh Markdown ''*Nếu không
    muốn chết*'' khớp 1:1 với thẻ <html:em> trong nguồn theo DEC-P01-002.'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000613
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Điểm nhìn ngôi thứ nhất của Visha: ''Tôi'' / ''tôi'' /
    ''mình''.; terms_and_ranks=Pháo binh; khai hỏa.; modality_and_negation=Giữ đối
