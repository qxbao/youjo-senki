    rắc rối về trách nhiệm giải trình.; modality_and_negation=Giữ mức độ xác tín cao
    ''Mình tin chắc rằng chúng ta có thể trông đợi...''.; emphasis=Không dùng dấu
    *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000007
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: ''mình''.; terms_and_ranks=bị
    nguyền rủa; tiềm năng của con người; đức tin.; modality_and_negation=Giữ sự chuyển
    mạch thời gian từ hồi tưởng quá khứ (''Đúng thế, đã có thời mình từng nghĩ tất
    cả những điều đó'') sang chuỗi ba câu hỏi tự vấn nội tâm ở hiện tại và câu nhận
    định phỏng đoán pha lẫn mỉa mai ''Có lẽ điều quan trọng là phải có đức tin.''.;
    emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000008
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: dùng đại từ ngôi thứ nhất
    số nhiều ''chúng ta'' khi nêu bài học khái quát.; terms_and_ranks=suy nghĩ viển
    vông; cách tiếp cận dựa trên trải nghiệm thực tế.; modality_and_negation=Giữ lời
    nhắn nhủ kèm tính tất yếu ''Nhưng xin hãy nhớ kỹ, chúng ta phải rũ bỏ hoàn toàn
    mọi suy nghĩ viển vông'' và khẳng định tần suất ''lúc nào cũng mang lại nhiều
    bài học bổ ích''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000009
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: chuyển đại từ ngôi thứ hai
    phiếm chỉ sang đại từ khái quát ''ta'' kết hợp phản thân ''chính mình'' (và lược
    chủ ngữ ở câu 3) để vừa tạo câu đúc kết tự nhiên vừa ngầm tự ám chỉ bản thân Tanya.;
    terms_and_ranks=thất bại; lỗi của chính mình.; modality_and_negation=Giữ lời nhắn
    nhủ lặp lại ''Xin hãy nhớ kỹ'' và quy luật muộn màng ''Và thường thì đến khi nhận
    ra điều đó, mọi chuyện đã quá muộn rồi.''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000010
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Bảo toàn chính xác sự chuyển dịch điểm nhìn ngay trong
    cùng đoạn văn của nguyên tác theo DEC-P01-001: câu 1 và mệnh đề phụ câu 2 ở ngôi
    thứ nhất dùng ''mình'' / ''bản thân'', trong khi mệnh đề chính câu 2 và câu 3
    chuyển sang trần thuật ngôi thứ ba dùng tên riêng ''Tanya'' và đại từ ''nó''.;
    terms_and_ranks=bục cao; huyết áp thấp.; modality_and_negation=Giữ mức độ phỏng
    đoán ''Có lẽ mình đang nửa tỉnh nửa mê'' và ''có khi nên rủa xả...'', cùng sự
    đối lập chuyển tiếp ''Thế rồi đôi tai nó chợt bắt được...''.; emphasis=Không dùng
    dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000011
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Diễn văn tốt nghiệp của Tanya trước các học viên: dùng
    đại từ ngôi thứ hai số nhiều nghiêm khắc kiểu nhà binh ''các người'' và ngôi thứ
    nhất số nhiều bao gộp ''Chúng ta'' ở câu 7.; terms_and_ranks=những con giòi bọ
    vô giá trị; pháp sư đế quốc (viết thường tính từ ''đế quốc''); đồng đội; anh em
    ruột thịt; chiến hữu vào sinh ra tử; chiến trường; người lính đế quốc; Đế quốc
    (viết hoa danh từ riêng).; modality_and_negation=Giữ dấu gạch ngang dài ở câu
    3, phủ định tuyệt đối ''Một số người trong các người sẽ không bao giờ trở về''
    ở câu 5, mệnh đề khẳng định tất yếu ''Mọi người lính đế quốc '
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000012
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Câu hỏi độc thoại nội tâm của Tanya: tự quy chiếu ''mình''
    theo DEC-P01-001.; terms_and_ranks=Không có thuật ngữ mới.; modality_and_negation=Giữ
    nguyên câu hỏi tự vấn hoang mang về hành động đang diễn ra ngoài ý thức của bản
    thân.; emphasis=Giữ dấu chấm lửng ''…'' ở ngoài và bọc chính xác phần câu hỏi
    trong dấu nhấn mạnh Markdown ''*Tại sao mình lại phải nói tất cả những lời này
    cơ chứ?*'' khớp 1:1 với thẻ <html:em> trong xhtml nguồn theo DEC-P01-002.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000013
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Bảo toàn sự chuyển dịch ngôi tự sự ngay trong đoạn theo
    DEC-P01-001: câu 1 ở ngôi thứ nhất nội tâm dùng ''Mình'' / ''mình''; câu 3–4 chuyển
    sang trần thuật ngôi thứ ba dùng ''Tanya'' và đại từ ''nó'', đồng thời dịch đại
    từ chỉ vật ở cuối câu 4 thành ''thứ đó'' (quy chiếu Elinium Type 95) để tránh
    trùng với đại từ ''nó'' của Tanya.; terms_and_ranks=Elinium Type 95; huấn luyện.;
    modality_and_negation=Giữ phủ định kèm so sánh giả định ở câu 1 (''Mình chẳng
    nhớ là đã nói bất kỳ lời nào trong số đó, nhưng trong trí nhớ lại đọng lại cảm
    giác như thể mình vừa nói ra thật'') và mức độ phỏng đoán ''c'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000014
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya theo
    DEC-P01-001: dùng danh xưng ''Đại úy Tanya von Degurechaff'' và quy chiếu bằng
    ''kẻ'' / ''nó'' kết hợp phản thân ''mình''; quy chiếu các nữ pháp sư bằng ''họ''.;
    terms_and_ranks=Đại úy Tanya von Degurechaff; kích cỡ quân trang; nữ pháp sư dày
    dạn chiến trường.; modality_and_negation=Giữ hai cấu trúc phủ định (''chẳng hề
    cao thêm chút nào'', ''không sao tránh khỏi''), mệnh đề nhượng bộ (''dù đáng lẽ
    đang ở độ tuổi phát triển''), dấu gạch ngang dài và phần chú thích trong ngoặc
    đơn ''(dù họ vốn rất hiếm)''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000015
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''mình'' / ''Mình''
    theo DEC-P01-001.; terms_and_ranks=lao động trí óc; công việc cổ cồn trắng; lối
    sống lành mạnh; K-Brot.; modality_and_negation=Giữ nhượng bộ và mốc thời quá khứ
    ''cũng từng đòi hỏi...'' ở câu 2, đối lập phủ định ''nhưng dường như chẳng ăn
    thua gì cả'' ở câu 3 và phủ định giả định ''mà mình cũng chẳng trông mong cao
    lên nổi khi ăn thứ bánh K-Brot này'' ở câu 4.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000016
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: ''mình'' / ''bản thân''; quy
    chiếu người khám là ''bác sĩ quân y'' / ''vị bác sĩ''.; terms_and_ranks=bác sĩ
    quân y.; modality_and_negation=Giữ câu điều kiện ở câu 1, câu hỏi gián tiếp đi
    kèm phủ định và nhượng bộ (''tại sao mình lại không lớn lên dù đáng lẽ phải đang
    phát triển'') ở câu 2, cùng câu hỏi gián tiếp ở câu 3.; emphasis=Không dùng dấu
    *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000017
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: ''mình''; quy chiếu vị nữ
    bác sĩ quân y bằng ''Bà ấy'' / ''bà ấy''.; terms_and_ranks=Vị bác sĩ quân y; cường
    độ huấn luyện.; modality_and_negation=Giữ lời khuyên gián tiếp ở câu 1, câu điều
    kiện ''nếu mình khắc phục điều đó, ngủ đủ giấc và ăn uống đầy đủ, mình sẽ lớn
    lên'' ở câu 2 và hệ quả tâm lý ''khiến mình đâm ra hoài nghi'' ở câu 3.; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000018
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: ''mình''.; terms_and_ranks=súng
    trường.; modality_and_negation=Giữ nguyên sắc thái cường điệu về cơn bốc đồng
    muốn xóa sạch ký ức đáng xấu hổ ngay sau buổi khám.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000019
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''mình'' / ''Mình'';
    quy chiếu nữ bác sĩ quân y bằng ''Bà ấy'' / ''người phụ nữ này'' và Bộ Tổng Tham
    mưu bằng ''những kẻ''.; terms_and_ranks=Bộ Tổng Tham mưu; đức tin; tẩy não.; modality_and_negation=Giữ
    lời rủa xả ở câu 2, câu hỏi tự vấn nội tâm ở câu 3, quan hệ nhân quả ở câu 4 (''chỉ
    vì mình là đàn ông'') và mệnh đề phủ định đi kèm câu hỏi nghi vấn ở câu 5 (''Mình
    từng nghĩ chuyện đó là không thể, nhưng chẳng lẽ mình đã bị tẩy não để khao khát
    trưởng thành như một người phụ nữ rồi sao?'').; emphasis=Khóa chính xác dấu nhấn
    mạnh Markdown ''*mình*'''
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000020
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''mình''; đại
    từ ''nó'' ở cuối câu 2 chỉ quy chiếu khí tài ''Elinium Type 95''.; terms_and_ranks=bằng
    chứng gián tiếp; Elinium Type 95; kiểm soát tư tưởng.; modality_and_negation=Giữ
    phủ định mở đầu ''Không, sẽ rất nguy hiểm nếu...'' và mệnh đề nhượng bộ đi kèm
    mức độ chắc chắn ''Đúng là..., nhưng mình khá chắc việc kiểm soát tư tưởng chỉ
    giới hạn trong lúc nó được kích hoạt mà thôi.''.; emphasis=Không dùng dấu *...*.'
