glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 30
segment_id_start: YS-LN01/Text/chapter007b.xhtml/p000223
segment_id_end: YS-LN01/Text/chapter007b.xhtml/p000252
choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000223
  kind: terminology_and_voice
  value: locks=['Giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa sau ngắt cảnh,
    các thuật ngữ “Quân đội Cộng hòa”, “ưu thế quân số”, “các Named”, “lực lượng tinh
    nhuệ của Đế quốc”, “giá trị chiến lược”, cùng đại từ ngôi thứ ba số nhiều “họ”
    / “những người này”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000224
  kind: terminology_and_voice
  value: locks=['Giữ hệ thống phiên hiệu đơn vị Cộng hòa “Đại đội Pháp sư Trinh sát
    106 và 107”, “Lữ đoàn Ma đạo 42”, “Sư đoàn Pháp sư Không quân số 4”, và mệnh đề
    giới hạn thời gian ở câu 2 (“Ít nhất là cho đến gần đây.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000225
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời tuyên bố khai mạc cuộc họp trang trọng với các cụm “Hội
    đồng chiến thuật” và “Đại đội Pháp sư Trinh sát 106 và 107”: ““Hội đồng chiến
    thuật về vụ Đại đội Pháp sư Trinh sát 106 và 107 bị xóa sổ gần đây xin được bắt
    đầu.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000226
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “Cộng hòa”, “các đơn vị ma đạo”, “Quân đội Đế quốc”,
    “các Named”, “tiền tuyến”, “Liên minh Entente”, và bảo toàn quan hệ nhân quả kết
    hợp giả định trái thực tế trong quá khứ (“nên lẽ ra các Named của họ cùng những
    đội quân tinh nhuệ không kém không thể nào bị xóa sổ sạch như thế được”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000227
  kind: terminology_and_voice
  value: locks=['Giữ sự tương phản ở câu 1, dấu gạch ngang dài và cụm “lợi thế áp
    đảo về quân số” cùng “một pháp sư duy nhất” ở câu 2 (trong đó “Nó” chỉ quy chiếu
    sự việc “chuyện đó”), phủ định tuyệt đối ở câu 3 (“không một ai tin nổi vào tai
    mình”) và tình thái suy đoán ở câu 4 (“hẳn phải có sự nhầm lẫn nào đó”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000228
  kind: terminology_and_voice
  value: locks=['Giữ lời báo cáo diễn biến trận đánh với các thuật ngữ “Đại đội 106
    và 107”, “chế áp các quan sát viên của địch”, “một đơn vị pháp sư địch” và “đánh
    chặn” đồng bộ với ch-03-b23/b26.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000229
  kind: terminology_and_voice
  value: locks=['Giữ thuật ngữ “các đơn vị Named”, quan hệ nguyên nhân ở câu 1–2,
    cùng mệnh đề nhượng bộ kết hợp điều kiện và khả thể ở câu 3 (“Dù tin tức này khó
    tin đến đâu đi nữa, nếu một đơn vị kém hơn về quân số đã gây ra thiệt hại nặng
    nề cho họ, rất có khả năng việc đó sẽ kéo theo hệ lụy cho toàn bộ cuộc chiến.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000230
  kind: terminology_and_voice
  value: locks=['Giữ thuật ngữ “Bộ Tổng Tham mưu” và cấu trúc nhận định nguyên nhân
    – hệ quả (“Chẳng trách các thành viên cấp cao của Bộ Tổng Tham mưu, những người
    hiểu rõ sự thật đó, lại mang vẻ mặt tối sầm đến vậy.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000231
  kind: terminology_and_voice
  value: locks=['Giữ đại từ tự xưng “tôi” của sĩ quan báo cáo cùng các thuật ngữ “nhật
    ký dữ liệu”, “các quả cầu tính toán thu hồi được” và “lời kể của những người sống
    sót”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000232
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “các sĩ quan ma đạo”, “nhật ký dữ liệu của quả
    cầu tính toán” và “các thiết bị ghi hình”, cùng tình thái bắt buộc trong quá khứ
    (“đã phải xem lại”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000233
  kind: terminology_and_voice
  value: locks=['Giữ cụm “Việc thẩm vấn thu thập thông tin từ những người sống sót”
    và quan hệ nhân quả – tương phản trong câu.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000234
  kind: terminology_and_voice
  value: locks=['Bảo toàn cấu trúc giả định trái thực tế trong quá khứ ở cả hai câu,
    phủ định ở câu 2 và duy nhất một cụm nhấn mạnh Markdown `*muốn*` theo đúng DEC-P01-002
    (“Không, họ sẽ chẳng *muốn* tin vào điều đó.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000235
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu và lời mời trang trọng trong cuộc họp:
    ““…Dù sao thì, trước hết xin mời mọi người xem đoạn băng ghi lại trận chiến này.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000236
  kind: terminology_and_voice
  value: 'locks=[''Giữ nguyên tín hiệu cấp cứu vô tuyến đồng bộ với ch-03-b26 (p000087):
    ““Mayday, Mayday, Mayday!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000237
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “tín hiệu cấp cứu khẩn cấp”, “Sĩ quan điều phối
    tác chiến tiền phương”, “tân binh”, “cựu binh dày dạn”, “Đại đội 106”, “Đại đội
    106 và 107”, đại từ “anh ta” chỉ sĩ quan điều phối, cùng giả định trái thực tế
    ở câu 3 (“Nếu đó là một tân binh thì có lẽ chuyện này còn đáng buồn cười, đằng
    này anh ta lại là một cựu binh dày dạn.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000238
  kind: terminology_and_voice
  value: 'locks=[''Giữ nguyên khẩu lệnh phát lại đồng bộ hoàn toàn với ch-03-b26 (p000089):
    ““Tản ra! Tản ra!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000239
  kind: terminology_and_voice
  value: locks=['Giữ mệnh đề nhượng bộ “dù nhoè đặc nhiễu sóng”, cùng các cụm “Màn
    hình”, “mệnh lệnh của chỉ huy” và “Các sĩ quan pháp sư không quân”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000240
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “nhật ký dữ liệu”, “người sử dụng”, “bắn tỉa”,
    và cấu trúc so sánh vượt ngưỡng khả thi (“từ một khoảng cách xa hơn rất nhiều
    so với mức được cho là khả thi”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000241
  kind: terminology_and_voice
  value: locks=['Giữ phiên hiệu “Đại đội 106” và thuật ngữ “các động tác cơ động né
    tránh bất quy tắc” đồng bộ với ch-03-b28 (p000142).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000242
  kind: terminology_and_voice
  value: 'locks=[''Giữ nguyên tiếng gọi đồng đội phát lại đồng bộ với ch-03-b26 (p000091):
    ““Sean?!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000243
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “Màn hình liên tục giật lắc dữ dội”, “những cú ngoặt
    gấp đổi hướng bay” và “bị bắn rụng khỏi bầu trời”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000244
  kind: terminology_and_voice
  value: 'locks=[''Giữ khẩu lệnh cảnh báo phát lại đồng bộ với ch-03-b26 (p000092)
    và giữ nguyên mã độ cao “Angels 12”: ““Mục tiêu địch! Angels 12!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000245
  kind: terminology_and_voice
  value: 'locks=[''Giữ câu hỏi bàng hoàng phát lại đồng bộ với p000244 và ch-03-b26
    (p000093): ““Angels 12 ư?!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000246
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “mười hai nghìn feet”, “bản báo cáo khẩn cấp”, “một pháp
    sư Đế quốc”, “độ cao gấp đôi mức tiêu chuẩn hiện hành”, “các pháp sư không quân”,
    cùng câu điều kiện hệ quả ở câu 4 (“Nếu điều đó là sự thật, toàn bộ các pháp sư
    không quân của họ coi như sẽ trở nên bất lực.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000247
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời cảm thán bỏ lửng với dấu chấm lửng và câu phủ định: ““Cái
    quái gì… Không thể nào.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000248
  kind: terminology_and_voice
  value: locks=['Giữ cấu trúc phủ định – tương phản ở câu 1, cụm “Con số mười hai
    nghìn” (lược đơn vị như nguồn) ở câu 2 và đại từ “Nó” quy chiếu con số/sự việc
    ở câu 3.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000249
  kind: terminology_and_voice
  value: locks=['Giữ câu hỏi gián tiếp (“liệu đối thủ của họ có phải là một chiếc
    máy bay tiêm kích hay không”) và khẳng định chắc chắn (“nhưng chắc chắn đó là
    một pháp sư”) đồng bộ với ch-03-b26 (p000096–p000098).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000250
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “kỹ thuật xử lý quang học”, “khẩu súng trường trang
    bị tiêu chuẩn của Quân đội Đế quốc” và “quả cầu tính toán chưa từng được biết
    tới”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000251
  kind: terminology_and_voice
  value: 'locks=[''Tuân thủ nghiêm ngặt giới hạn của DEC-P01-001: giữ quy chiếu trung
    tính “người lính địch” và “pháp sư đó” (không dùng “nó” hay “cô” từ góc nhìn Cộng
    hòa chưa biết danh tính đối phương), hình ảnh “ung dung bay lượn, tựa như kẻ thống
    trị bầu trời” và phủ định tuyệt đối “không một ai có thể can thiệp vào”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000252
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “Đại đội 106”, “Pháp sư Định danh” (đồng bộ ch-03-b27
    p000125, p000128), “Named”, cùng cấu trúc phủ định tăng tiến ở câu cuối (“Họ thậm
    chí còn chẳng biết mối đe dọa khôn lường này sẽ sử dụng những loại chiến thuật
    nào, huống hồ là làm sao để khắc chế chúng.”).']
