choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000055: locks: [''Giữ tên riêng
    “Tanya”, hành động “bất giác cong đôi môi hồng thành một nụ cười khi đánh giá
    lại tình hình”, và câu nội tâm nhấn mạnh bằng chữ nghiêng Markdown `*Xét cho cùng,
    chuyện này có khi cũng không tệ đến thế.*` theo đúng DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000056: locks: [''Giữ phân biệt
    đại từ “mình” trong lời thì thầm tự nhủ và “nó” trong câu trần thuật theo DEC-P01-001,
    giả định phản thực tại “Cho dù có ai đang bay gần đó, tiếng pháo binh Đế quốc
    gầm rít bên dưới cũng đã át đi giọng nó”, cùng cụm “buổi trình diễn hỏa lực Fuji⁵
    với tư cách khách VIP” kèm đúng dấu chú thích `⁵`.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000057: locks: [''Giữ nguyên
    hai hô hiệu “Fairy 08”, “Goliath 07” và câu yêu cầu công vụ ngắn gọn “Yêu cầu
    báo cáo kết quả bắn.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000058: locks: [''Giữ nguyên
    hai hô hiệu “Goliath 07”, “Fairy 08”, đại từ xưng hô “Tôi” và thuật ngữ đánh giá
    kết quả pháo kích “Hiệu lực tốt trên mục tiêu. Tôi nhắc lại, hiệu lực tốt.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000059: locks: [''Giữ đại từ
    trần thuật “nó” song hành cùng tên “Tanya”, và đầy đủ các thuật ngữ “các pháo
    đội”, “bộ vô tuyến”, “thuật thức bay”, “quả cầu tính toán của Quân đội Đế quốc”,
    “Lãnh thổ Norden đang có tranh chấp”, “Bộ Tư lệnh Central”, “được Central biệt
    phái”, “chương trình huấn luyện thực địa”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000060: locks: [''Giữ đại từ
    trần thuật “nó” và tên “Tanya”, cấu trúc khẳng định–phủ định “không chỉ là giấc
    mơ viển vông”, cùng các cụm “nơi đồn trú ở Central”, “hậu phương”, “sĩ quan ma
    pháp ở hậu phương”, “trong trạng thái chờ lệnh, với nhiệm vụ bảo vệ thủ đô”, “bộ
    phận nhân sự”, “một tấm vé vàng”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000061: locks: [''Giữ sự chuyển
    điểm nhìn từ trần thuật dùng “Tanya” / “nó” ở câu đầu sang độc thoại nội tâm dùng
    “mình” ở hai câu sau theo DEC-P01-001 (không thêm chữ nghiêng Markdown theo DEC-P01-002),
    cùng các cụm “miền bắc buồn tẻ mà nguy hiểm”, “gửi thư cảm ơn các giáo quan, kèm
    tình hình mới nhất của mình”, “xây dựng các mối quan hệ”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000062: locks: [''Giữ đại từ
    nội tâm “Mình” ở câu đầu (không in nghiêng) và câu trần thuật “Tanya vẫn phấn
    chấn ra mặt khi làm nhiệm vụ quan sát cho pháo binh trên chiến trường” ở câu thứ
    hai.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000063: locks: [''Giữ nguyên
    hô hiệu và lời gọi vô tuyến “Fairy 08 gọi Norden Control. Xin trả lời.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000064: locks: [''Giữ nguyên
    tên đài và câu đáp vô tuyến “Đây là Norden Control. Nghe to và rõ.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000065: locks: [''Giữ các thuật
    ngữ “bộ binh Liên minh Entente”, “biên giới quốc gia”, “Địa hình núi non Norden”,
    “pháo binh đã triển khai đầy đủ”, sắc thái “những binh sĩ thản nhiên tiến quân
    ở biên giới” và đại từ “chúng” ở câu cuối “Càng đúng như vậy nếu địa thế khiến
    chúng phơi mình ra.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000066: locks: [''Giữ khẩu lệnh
    “Fairy 08, rõ.”, thuật ngữ “hỏa lực áp chế”, mức tình thái nhận định của người
    báo cáo “Tôi cho rằng chúng ta đã vô hiệu hóa địch.” và câu “Bộ binh địch đang
    tan đội hình.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000067: locks: [''Giữ các thuật
    ngữ “Các pháo đội xuất sắc”, “những mục tiêu không bọc giáp”, “quan sát viên”,
    “khu vực đã được tính sẵn dữ liệu đạn đạo”, “lựu pháo”, “ống nhòm”, cùng cấu trúc
    phủ định kép khẳng định chắc chắn “Loạt pháo kích ấy không thể nào không quét
    sạch chúng.” và kết luận “rõ ràng bắn thêm nữa chỉ phí đạn.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000068: locks: [''Giữ khẩu lệnh
    “Norden Control, rõ.” và mệnh lệnh tác chiến “Tiến đến tuyến tuần tra thứ hai
    và dẫn bắn áp chế lực lượng bộ binh chủ lực của địch.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000069: locks: [''Giữ khẩu lệnh
    “Fairy 08, rõ.” và câu xác nhận “Sẽ tiến lên và tiếp tục nhiệm vụ quan sát.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000070: locks: [''Giữ đại từ
    trần thuật “nó” và đại từ nội tâm “Mình”, đúng phạm vi nhấn mạnh chữ nghiêng Markdown
    `*Mình không ngờ vô tuyến lại hoạt động tốt đến vậy trong điều kiện chiến đấu
    thực tế.*`, cấu trúc phủ định “nên đâu phải thời tiết sẽ cản trở địch gây nhiễu
    tín hiệu”, từ trong ngoặc kép “rõ”, cùng các cụm “Norden Control”, “bộ vô tuyến
    hàng không đồ sộ”, “những bất thường từ trường mà các mỏ khoáng sản ở Norden gây
    ra”, “Liên minh Entente”, “những tàn quân địch vẫn kiên trì cầm cự”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000071
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000071: locks: [''Giữ độc thoại
    nội tâm ngôi thứ nhất “mình” (không thêm chữ nghiêng Markdown), tên “Liên minh
    Entente”, các câu giả định phản thực tại ở quá khứ “Nếu muốn làm mục tiêu cho
    diễn tập bắn đạn thật thì lẽ ra phải nói trước chứ. Nếu biết sẽ đi săn chim dodo
    thay vì gà tây, mình đã xung phong bắn quét thay vì quan sát rồi.”, và các cụm
    “Những người làm nhiệm vụ ném bom”, “có hộ tống, vừa làm chủ bầu trời”, “quyền
    chọn trước những mục tiêu ngon ăn nhất”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000072
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000072: locks: [''Giữ nguyên
    hô hiệu, tên đài và báo cáo vị trí “Fairy 08 gọi Norden Control. Tôi đã tiến đến
    vị trí chỉ định.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000073: locks: [''Giữ khẩu lệnh
    “Norden Control, rõ.”, đại từ “Chúng tôi thấy rồi.”, và chỉ thị “Đang chuyển tình
    hình cho pháo binh. Tiếp tục quan sát các điểm đạn rơi.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000074
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000074: locks: [''Giữ khẩu lệnh
    “Fairy 08, rõ.”, nội dung “Tiếp tục quan sát cho pháo binh cho đến khi có lệnh
    khác.” và từ kết thúc lượt phát sóng “Hết.”'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000075: locks: [''Giữ nguyên
    câu xác nhận ngắn gọn “Norden Control, rõ.”'']'
  non_canon: true
