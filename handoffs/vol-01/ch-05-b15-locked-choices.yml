choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000379
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002): khóa ''*V600.*'' tương ứng 1:1
    với thẻ <html:em> trong nguồn, khớp hoàn toàn với câu kết phân cảnh phóng viên
    trước đó tại p000103 (ch-05-b05)."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000380
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: khóa ''mã phiên hiệu'', ''tài liệu mật'',
    ''dãy V600''; bảo toàn hai mệnh đề phủ định tuyệt đối ở câu đầu và câu cuối cùng
    mệnh đề ngoại trừ ở câu hai."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000381
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: tự sự ngôi thứ nhất số nhiều của nhóm phóng
    viên Andrew (''chúng tôi'').", "Thuật ngữ & giới hạn phạm vi: khóa ''Quân đội
    Đế quốc'', ''Lực lượng Trung ương'', ''các đạo quân khu vực'', ''Ban Công nghệ
    Trung ương'', và các mốc mã số ''dãy V000'', ''dãy V400'', ''dãy V500''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000382
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: khóa ''đơn vị thử nghiệm đặc biệt'', ''Cuộc chạy đua
    công nghệ'', ''cuộc Đại chiến''.", "Tình thái & phủ định: bảo toàn mức độ phỏng
    đoán (''khả năng'', ''Biết đâu'') và mệnh đề mục đích phủ định ở câu cuối (''để
    không một ai hay biết về nó'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000383
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: phân biệt rõ ''Nhóm của Ender'' với ''nhóm
    của tôi'' (cá nhân Andrew) và ''Chúng tôi''.", "Thuật ngữ: khóa ''Cục Công nghệ
    thuộc Quân đội Đế quốc'' và ''một kỹ sư biệt phái về Trung ương''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000384
  kind: terminology_and_voice
  value: 'choices=["Danh xưng, chức danh & thuật ngữ: giữ nguyên tên riêng ''Adelheid
    von Schugel'', chức danh ''kỹ sư trưởng'' và tên khí tài ''Quả cầu Tính toán Xung
    kích Type 97 của Elinium Arms''; quy chiếu Schugel bằng đại từ lịch sự ''ông ấy''
    / ''ông'' / ''Ông''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000385
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhượng bộ: giữ ''Chúng tôi'' / ''chúng tôi''
    cho nhóm phóng viên và ''ông Schugel'' / ''ông'' cho vị kỹ sư; bảo toàn mệnh đề
    nhượng bộ cuối câu (''dù chúng tôi sẽ bị giám sát chặt chẽ'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000386
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ tôn giáo: trong thoại, Schugel tự xưng ''tôi'';
    khóa ''Thượng đế'', ''Chúa'', ''ngày Sa-bát'' và giữ mệnh đề đối chiếu ngữ cảnh
    (''dù chúng tôi đang làm phiền ông vào ngày Sa-bát'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: Andrew tự xưng ''tôi'' / ''Tôi'' kết hợp phản
    thân ''mình'', gọi ''ông Schugel'' / ''ông''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & quy chiếu tôn giáo (Schugel -> Andrew): gọi Andrew
    là ''Anh'' kết hợp phản thân ''mình''; quy chiếu Thượng đế bằng đại từ ''ngài''
    viết thường theo đúng chuẩn pending."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: phân biệt rõ ''tôi'' (lời xin lỗi cá nhân
    của Andrew) và ''chúng tôi'' / ''Chúng tôi'' (cả nhóm phỏng vấn); khóa ''đơn vị
    V600'' và ''viên sĩ quan quân cảnh''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái biểu cảm: giữ ''nụ cười gượng gạo'' và cách
    quy chiếu nối mạch ''viên quân cảnh''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô thoại (Schugel -> nhóm phóng viên): khóa ''Mã
    đơn vị V600 không hề tồn tại'' (phân biệt với ''mã phiên hiệu'') và hô ngữ lịch
    thiệp ''thưa các vị''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Logic suy luận & phủ định: giữ nguyên cấu trúc kết luận phủ định
    – đối lập (''V600 ắt hẳn không chỉ một đơn vị mà là thứ gì khác'') và gợi ý về
    việc ''tìm hiểu lịch sử''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tự vấn: giữ ''mã đơn vị'', bảo toàn câu hỏi
    tu từ kèm phủ định (''Một mã đơn vị tưởng chừng không tồn tại ư? Không. Nó thực
    sự không tồn tại.'') và cụm ''chuyên gia về tổ chức quân đội''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: khóa ''ban quốc tế'', quy chiếu vị chuyên
    gia bằng ''ông ấy'' / ''ông'' và nhóm điều tra bằng ''chúng tôi''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ then chốt: khóa câu giải đáp ''“Mã số V ư?” ông nói.
    “Đó là mã phiên hiệu thành lập đơn vị.”'' để làm cầu nối giải thích cơ chế ở p000396–p000397."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối chiếu chức năng: khóa ''Quân đội Đế quốc'', ''việc
    thành lập đơn vị'', ''Cục Quân vụ'', ''Cục Tác chiến''; làm rõ sự phân tách giữa
    ''bên tổ chức'' và ''bên điều động''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & logic giả định: khóa ''Cục Quân vụ'', ''đơn vị V101'',
    ''lực lượng trung ương'', ''Cục Tác chiến'', ''Lực lượng Đặc nhiệm 101'', ''mã
    phiên hiệu V600''; bảo toàn kết luận nhượng bộ phủ định ở câu cuối (''hoàn toàn
    có thể tồn tại ngay cả khi chẳng có bất kỳ đơn vị nào mang đầu số sáu trăm'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tương tác người đọc: giữ ''chúng tôi'' / ''Chúng tôi''
    kết hợp phản thân ''mình'' cho nhóm điều tra, ''Tôi'' cho Andrew, và dịch đại
    từ ngôi thứ hai hướng tới người đọc bản tường thuật là ''độc giả''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000399
  kind: terminology_and_voice
  value: 'choices=["Giọng điệu & dấu câu: giữ sự phân biệt giữa ''Chúng tôi'' / ''chúng
    tôi'' và ''tôi'', bảo toàn câu chú thích hài hước trong ngoặc đơn kèm phủ định
    (''(Đáng buồn là chúng tôi không thể kê khai thanh toán công tác phí cho chuyến
    đi đó.)'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tương phản nhận thức: phân biệt rõ ''tôi'' (Andrew) và
    ''chúng tôi'' (cả nhóm), quy chiếu Schugel bằng ''Ông Schugel thông thái'' / ''ông''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: khóa ''đống giấy tờ thành lập đơn vị do
    bộ phận Cục Quân vụ thuộc Văn phòng Bộ Tổng Tham mưu Quân đội Đế quốc để lại'';
    giữ nét hài hước (''Chẳng hiểu sao cả bọn đều đau đầu như búa bổ'') và cách diễn
    đạt phủ định ở câu cuối (''chẳng mấy khó khăn'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Chi tiết & dấu câu kết đoạn: giữ ''con số sáu trăm'', so sánh
    giả định (''cứ như thể nó đang van nài người ta tìm ra mình vậy''), ''gần như
    trống rỗng'', và dấu hai chấm cuối đoạn (''Chỉ vỏn vẹn một tờ ghi chú ngắn gọn:'')."]'
