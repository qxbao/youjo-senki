choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & thuật ngữ: khóa ''*Kính gửi:
    Cục Quân vụ, Văn phòng Bộ Tổng Tham mưu Quân đội Đế quốc*'' bao trọn toàn đoạn
    tương ứng 1:1 với thẻ <html:em> trong nguồn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000404
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002): khóa dấu ''*...*'' bao trọn
    toàn đoạn văn bản thông báo tuyển mộ tương ứng với thẻ <html:em> trong nguồn.",
    "Đại từ, phủ định & giọng điệu: phân biệt ''Chúng ta'' (khẩu hiệu tuyên ngôn ở
    hai câu đầu) và ''Chúng tôi'' (chủ thể đăng thông báo tuyển mộ ở câu ba); dịch
    đại từ khái quát chỉ quân hữu được dẫn đường/bảo vệ là ''đồng đội''; bảo toàn
    đầy đủ bốn cấu trúc phủ định (''quyết chẳng bao giờ bỏ rơi'', ''nơi không có lối
    mòn'', ''không bao giờ khuất phục'', ''không có gì bảo đảm mạng sống trở về'')
    và thành ngữ ''rừng gươm mưa đạn''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & thuật ngữ: khóa ''*Ủy ban Thành
    lập Đơn vị 601 trực thuộc Văn phòng Bộ Tổng Tham mưu*'' tương ứng 1:1 với thẻ
    <html:em> trong nguồn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi mở: giữ đối lập giữa ''mã đơn vị'' và ''mã
    phiên hiệu 601''; khóa ''Quân đội Đế quốc'' và bảo toàn nhận xét về ''lối hành
    văn sục sôi nhiệt huyết'' đối lập với ''tu từ văn chương''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000407
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: giữ ''chúng tôi'' cho nhóm điều tra của Andrew
    và quy chiếu người cựu pháp sư đầu tiên được phỏng vấn bằng đại từ lịch sự ''ông
    ấy''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại: khóa ''đơn vị tuyên truyền'', giữ câu
    hỏi xác nhận ở câu hai và sắc thái khẩu ngữ ''đều tức tối ra mặt đấy''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi lặp lại: khóa ''“Một đơn vị tuyên truyền ư?”''
    đồng bộ với p000408."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: khóa ''Bộ phận quan hệ công chúng'' và phần
    trích dẫn trong ngoặc đơn ‘truyền tải chính nghĩa và sự cao quý của Đế quốc’."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: giữ ''chúng tôi'' (nhóm phóng viên) và mệnh
    đề phủ định ''chưa từng thấy bất kỳ tài liệu nào nhắc tới chuyện tuyên truyền
    cả''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & giả định quá khứ: người cựu pháp sư gọi nhóm
    Andrew là ''các anh''; khóa ''đơn vị pháp sư trên không quy mô lớn''; bảo toàn
    cấu trúc điều kiện giả định trái thực tế ở quá khứ (''Nếu người ta mà biết...,
    ắt đã có rắc rối to rồi'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại (Andrew -> cựu pháp sư): hỏi lại lịch sự bằng ''“Xin
    thứ lỗi, ý ông là sao ạ?”'' đồng bộ với đại từ ''ông ấy'' ở p000407."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000414
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: người cựu pháp sư tự xưng ''Tôi'' / ''tôi'';
    khóa ''Cục Quân vụ'' và ''ngoài tiền tuyến''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000415
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002): khóa ''*À vâng, tôi có nghe
    nói về vụ đó.*'' chỉ ở phần lời nói giả định cuối câu hai tương ứng 1:1 với thẻ
    <html:em> trong nguồn, giữ toàn bộ phần dẫn trước đó nằm ngoài dấu ''*...*''.",
    "Đại từ: giữ ''chúng tôi'' / ''Chúng tôi'' và quy chiếu các cựu pháp sư Đế quốc
    bằng ''họ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000416
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & dấu câu: phân biệt rõ ''tôi'' (nhận xét cá nhân của
    Andrew trong cặp dấu gạch ngang dài) và ''chúng tôi'' (cả nhóm điều tra ở câu
    hai)."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000417
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: người cựu quân nhân tự xưng ''tôi''; khóa
    ''Bộ Tư lệnh Sẵn sàng Chiến đấu'' và bảo toàn phủ định ''không đạt được sự đồng
    thuận''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000418
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi phủ định: khóa ''“Chẳng phải đó là một đơn
    vị tuyên truyền sao?”'' đồng bộ với p000408–p000409."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000419
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: bảo toàn lời bác bỏ mở đầu, giữ ''Tôi'',
    mã số ''V600'' và khóa ''lực lượng phản ứng nhanh''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000420
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi lặp lại: khóa ''“Lực lượng phản ứng nhanh
    ư?”'' đồng bộ với p000419."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000421
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & phủ định: khóa ''Đại Quân'', giữ đại từ
    ''tôi'' và mệnh đề phỏng đoán phủ định ở vế hai (''nhưng tôi đoán là kế hoạch
    đó đã không thành'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000422
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: khóa ''một cựu quân nhân từng phục vụ trong đạo quân
    trung ương'' (viết thường danh từ chung)."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000423
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: giữ ''Tôi'', mã ''V600'' và tách tường minh
    hai phiên hiệu viết hoa ''Cụm tập đoàn quân phương Tây và Cụm tập đoàn quân phía
    Đông''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000424
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Andrew gọi cựu thành viên Cụm tập đoàn quân
    phương Bắc là ''Ông''; khóa ''lực lượng phản ứng nhanh'' và ''đơn vị tuyên truyền''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000425
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: khóa ''đòn gió'' (đồng bộ với p000431) và
    cụm ''các anh biết đấy''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000426
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi trực tiếp: khóa ''“Vậy V600 là loại đơn vị gì?”''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000427
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phân biệt cấp độ: khóa ''một đợt tái tổ chức'' và
    viết thường ''đạo quân phía tây và đạo quân phía đông'' tương ứng với danh từ
    chung trong nguồn (phân biệt với tên phiên hiệu viết hoa ở p000423)."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000428
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi lặp lại: khóa ''“Một đợt tái tổ chức ư?”'' đồng bộ với
    p000427."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000429
  kind: terminology_and_voice
  value: 'choices=["Quy chiếu tân ngữ: làm rõ đại từ số nhiều thành ''giải thể các
    đạo quân đó'' (quy chiếu đạo quân phía tây và đạo quân phía đông ở p000427)."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000430
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi chuyển ý: khóa ''“Thế còn những lời đồn khác thì sao?”''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000431
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: giữ ''tôi'', khóa ''những đòn gió do bên Tình
    báo tung ra'' và ''một đơn vị tinh nhuệ hoàn toàn mới''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000432
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ phiên hiệu: khóa ''Cụm tập đoàn quân phương Bắc''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000433
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: phân biệt rõ ''chúng tôi'' / ''Chúng
    tôi'' (kèm phản thân ''mình'') của cả nhóm điều tra với ''Tôi'' (cá nhân Andrew
    ở câu bốn); bảo toàn mệnh đề phủ định ''không có một sự thật duy nhất nào cả''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000434
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002): khóa ''*Đâu mới là điều đúng
    đắn?*'' chỉ ở câu hỏi đầu tiên tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ
    toàn bộ phần còn lại nằm ngoài dấu ''*...*''.", "Đại từ, thuật ngữ & tình thái:
    phân biệt ''Tôi'' / ''tôi'' và ''Chúng tôi'' / ''chúng tôi''; khóa ''phép phân
    tích thống kê''; bảo toàn mức độ suy luận chắc chắn (''ắt hẳn phải có một hạt
    mầm sự thật nào đó'') kết hợp khả thể phủ định (''giờ đây có khả năng chúng tôi
    sẽ chẳng bao giờ biết được chuyện gì đã thực sự xảy ra'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000435
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ & quy chiếu bất động vật: giữ ''hình ảnh thu nhỏ của chính
    cuộc chiến'', ''một bi kịch khủng khiếp'', và đại từ ''nó'' quy chiếu về ''cuộc
    xung đột ấy''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000436
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: khóa ''V600'', ''Nữ thần Thứ Mười Một'' và
    đại từ sở hữu ''của chúng tôi''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000437
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi giả định quá khứ: bảo toàn đồng thời tính nghi vấn và
    thời gian quá khứ của giả định bằng ''Nhưng phải chăng chúng cũng từng chính là
    trung tâm của cả cuộc chiến?''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000438
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & chức danh: khóa ''(Andrew,
    phóng viên đặc biệt của *WTN*)'' với dấu ''*...*'' chỉ bao quanh tên đài ''*WTN*''
    tương ứng 1:1 với thẻ <html:em> trong nguồn."]'
