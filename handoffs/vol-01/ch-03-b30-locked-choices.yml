choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000182
  kind: terminology_and_voice
  value: locks=['Giữ dấu chấm phẩy ở câu 1, lược đại từ ngôi thứ hai phiếm chỉ ở mệnh
    đề điều kiện câu 3 theo quy ước direct-address choice, bảo toàn phủ định kết quả
    (“thì sẽ chẳng còn cuộc đàm phán nào hết”), cùng các cụm “Lợi nhuận là trên hết”,
    “đàm phán chính là chìa khóa”, “đối thoại”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000183
  kind: terminology_and_voice
  value: locks=['Giữ tên riêng “Tanya”, từ phản thân “mình” và đại từ ngôi thứ ba
    “nó” trong câu trần thuật ở câu 1 theo đúng DEC-P01-001, dùng “của người ta” cho
    sở hữu cách ngôi thứ hai phiếm chỉ ở câu 2, bảo toàn điều kiện loại trừ (“Trừ
    phi... còn không thì...”) và phủ định ở câu 2–3, cùng các thuật ngữ “nhân tính”,
    “trò chơi có tổng bằng không”, “xây dựng quan hệ hợp tác”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000184
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “Chúng ta” ở câu 2, dấu ngoặc kép quanh cụm ““đôi bên
    cùng thắng”” ở câu 3, cùng các cụm “dàn xếp cuộc chơi”, “thế giới của lý tính”,
    “giải pháp “đôi bên cùng thắng””.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000185
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “Chúng ta” / “chúng ta”, phủ định ở câu 1, mệnh đề tương
    lai hoàn thành ở câu 2 (“thì cuộc giao tranh đã kết thúc từ lâu rồi”), cùng các
    cụm “các nhà kinh tế học”, “số liệu thống kê”, “môn thể thao quốc gia của Nhật
    Bản”, “những trận đấu dàn xếp tỷ số”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000186
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời cầu nguyện bắt buộc khi sử dụng Type 95 với cụm hô gọi
    “Hỡi Thượng đế”, tự xưng “con” / “chúng con” và cụm “cuộc xâm lược của lũ ngoại
    đạo”: ““Xin hãy cứu chúng con khỏi cuộc xâm lược của lũ ngoại đạo. Hỡi Thượng
    đế, xin hãy ban cho con sức mạnh để tiêu diệt kẻ thù của chúng con.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000187
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “Mình” / “mình” theo DEC-P01-001, đại từ “họ”
    ở câu 3, điều kiện và phủ định ở câu 3, cùng các thuật ngữ “thuật thức”, “CP”,
    “nhiễu mana”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000188
  kind: terminology_and_voice
  value: locks=['Giữ tên riêng “Tanya”, từ phản thân “mình” theo DEC-P01-001 và tình
    thái phỏng đoán “có lẽ đã tới”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000189
  kind: terminology_and_voice
  value: locks=['Giữ đại từ trần thuật ngôi thứ ba “nó” cho Tanya ở câu 3 theo đúng
    DEC-P01-001, đại từ “họ” ở câu 1, tình thái phỏng đoán ở câu 1 và câu 3, phủ định
    điều kiện ở câu 2, cùng các cụm “những định kiến”, “những người lính Cộng hòa”,
    “các khuôn mẫu rập khuôn”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000190
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “chúng ta” ở câu 2, cùng các cụm “bản chất nội tâm thật
    sự”, “cá tính riêng biệt”, “độc nhất vô nhị”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000191
  kind: terminology_and_voice
  value: locks=['Xử lý đại từ ngôi thứ hai phiếm chỉ trong cả ba câu bằng chủ ngữ
    khái quát “người ta” hoặc cấu trúc bị động không đại từ theo quy ước direct-address
    choice, giữ dấu chấm phẩy và phủ định ở câu 3, cùng các thuật ngữ “tòa án binh”,
    “Từ bỏ giao chiến”, “đào ngũ trước mặt quân địch”, “án tử hình bằng xử bắn”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000192
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” / “Mình” theo DEC-P01-001, bảo toàn hai
    mệnh đề điều kiện ở câu 1–2, cùng các cụm “một cá nhân chính trực”, “những kẻ
    điên cuồng vì chiến tranh”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000193
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” / “Mình” theo DEC-P01-001, phủ định nghĩa
    vụ ở câu 2, cùng cụm “vượt quá bậc lương của mình”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000194
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” / “Mình” theo DEC-P01-001, đại từ “họ”
    / “bọn họ” cho đối phương, điều kiện phủ định ở câu 1 và phủ định ở câu 2, cùng
    các cụm “hậu phương”, “rượu vang”, “cá áp chảo”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000195
  kind: terminology_and_voice
  value: locks=['Giữ cặp đại từ “Các người – Chúng tôi” trong lời phát thông điệp
    mở đầu đàm phán ôn hòa của Tanya xen kẽ câu độc thoại nội tâm ở câu 2, cùng các
    thuật ngữ “Đế quốc”, “Tổ quốc”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000196
  kind: terminology_and_voice
  value: locks=['Giữ thán từ mở đầu câu 3 “Chà”, điển tích lịch sử về “nước Phổ” (“nơi
    quân đội sở hữu nhà nước thay vì nhà nước sở hữu quân đội”), và mệnh đề phủ định
    “không phải là một quy tắc bất di bất dịch”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000197
  kind: terminology_and_voice
  value: 'locks=[''Giữ cặp xưng hô “tôi / chúng tôi – các người”, câu hỏi trực tiếp
    ở câu 2, cùng các cụm “Đế quốc”, “quê hương của chúng tôi”: ““Hãy trả lời tôi
    điều này. Tại sao các người lại muốn xâm lược Đế quốc, quê hương của chúng tôi?””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000198
  kind: terminology_and_voice
  value: 'locks=[''Bảo toàn sự chuyển đổi điểm nhìn ngay trong đoạn theo đúng DEC-P01-001:
    dùng đại từ trần thuật ngôi thứ ba “Nó” cho câu 1 và chuyển sang đại từ tự quy
    chiếu nội tâm “Mình” / “mình” ở câu 2–3.'']'
