choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000024: locks: [''Giữ mốc thời
    gian–địa điểm “14 tháng Tám, năm 1971 Công nguyên, Hợp chúng quốc Hoa Kỳ”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000025: locks: [''Giữ danh xưng
    “Tiến sĩ Philip Zimbardo”, các tên tổ chức “Bộ Hải quân Hoa Kỳ”, “Văn phòng Nghiên
    cứu Hải quân (ONR)”, “Thủy quân lục chiến”, thời lượng dự kiến “chỉ kéo dài hai
    tuần” và mục tiêu thu thập dữ liệu sơ bộ.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000026: locks: [''Giữ mô tả sinh
    viên đại học bình thường khỏe mạnh cả về thể chất lẫn tinh thần và bước ngoặt
    sang ngày thứ hai vấp phải vấn đề nghiêm trọng về đạo đức.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000027: locks: [''Giữ quan hệ
    nhượng bộ “Bất chấp lệnh cấm”, sự tách bạch chủ thể hai vế (những người được giao
    vai cai ngục chửi bới, hạ nhục người đóng vai tù nhân; ngoài ra các hành vi bạo
    lực thể xác ngày càng phổ biến) theo style-guide, và kết quả buộc phải dừng cuộc
    thử nghiệm chỉ sáu ngày sau khi bắt đầu.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000028: locks: [''Giữ tên gọi
    “Thí nghiệm Nhà tù Stanford”, “Thí nghiệm Milgram”, và quan hệ tương phản giữa
    những bất cập đạo đức của dự án với kết quả giàu hàm ý cho ngành tâm lý học về
    bản chất con người.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000029: locks: [''Giữ cặp thuật
    ngữ “quyền lực và quyền uy”, tên hiện tượng trong ngoặc kép “sự phục tùng quyền
    uy”, cấu trúc phủ định “chẳng liên quan gì đến lý trí, khả năng cảm nhận hay tính
    cách của một người” và nguyên nhân “sự phi cá nhân hóa rõ rệt do việc phân vai
    khơi lên”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000030: locks: [''Giữ khả thể
    quá khứ “bất kỳ ai cũng có thể đã làm lính gác ở Auschwitz” theo đúng quy tắc
    bảo toàn thời gian của giả định trong style-guide, cùng hai thuật ngữ “khuynh
    hướng cá nhân” và “phẩm chất đạo đức”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000031: locks: [''Giữ so sánh
    vai trò của môi trường lớn hơn “những đặc điểm cá nhân”, đại từ ngôi thứ ba “anh”
    và nhận định “hợp lý chứ không hề sai” (không áp bình diện phán xét đạo đức).'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000032: locks: [''Giữ tình thái
    “Chắc hẳn”, bối cảnh “chương trình giáo dục bắt buộc ở tiểu học”, và sự đối lập
    giữa những lời khẳng định quen thuộc về bình đẳng/độc đáo với những chênh lệch
    thực tế.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000033: locks: [''Giữ toàn bộ
    câu hỏi nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002 và đại từ tự quy chiếu
    “mình” theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000034: locks: [''Giữ toàn bộ
    câu hỏi nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002 và trò chơi “bóng né”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000035: locks: [''Giữ toàn bộ
    câu hỏi nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002 và đại từ tự quy chiếu
    “mình”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000036: locks: [''Giữ toàn bộ
    câu hỏi nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002 và câu hỏi phủ định
    về mấy đứa ngồi phía sau không thể im lặng khi giáo viên đang nói.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000037: locks: [''Giữ cặp đối
    lập trong ngoặc kép “ngoan” / “hư”, “những đứa trẻ “ngoan”” phù hợp môi trường
    tiểu học và tâm lý sợ bị coi là “hư” nếu không tuân theo phép tắc.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000038: locks: [''Giữ sự nhất
    quán “những đứa trẻ ngoan” / “những đứa trẻ hư”, chuỗi cấp học “lớp luyện thi”
    -> “trường trung học cơ sở tốt” -> “trường trung học phổ thông có tiếng” -> “trường
    đại học danh giá”, và hình ảnh đi trên lộ trình nhanh nhất trong khuôn khổ quy
    tắc.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000039: locks: [''Giữ chữ “ngoan”
    liên kết với đoạn trước, tâm lý xem người lười biếng là kẻ thất bại, học sinh
    thành tích cao coi thường học sinh học kém, và vế đối lập phần đông học sinh thành
    công không nghĩ mình đặc biệt thông minh vì những học sinh thực sự có năng khiếu
    trong khối sẽ khiến họ biết vị trí của mình.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000040: locks: [''Giữ tên “Kỳ
    thi Olympic Vật lý Quốc tế hoặc Kỳ thi Olympic Toán học Quốc tế” và quan hệ nhượng
    bộ giữa góc nhìn méo mó với việc đủ hiểu thực tế để chăm chỉ theo đuổi việc học.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000041: locks: [''Giữ điều kiện
    về mức thu nhập tương đương với cha mẹ, sự song hành giữa khát vọng thành công
    mạnh mẽ đầy sức trẻ với nỗi sợ thất bại chí mạng, và cấu trúc phủ định “chẳng
    còn lựa chọn nào khác ngoài tự xiềng mình vào bàn học”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000042: locks: [''Giữ tính từ
    trong ngoặc kép “danh giá” đồng nhất với p000038, bước ngoặt “Rồi cuộc chơi thay
    đổi”, và chỉ đánh dấu nghiêng đúng phạm vi câu hỏi cuối đoạn `*Bạn đã đạt được
    điều gì?*` theo DEC-P01-002.'']'
  non_canon: true
