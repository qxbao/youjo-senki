choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000101: locks: [''Giữ lời trích
    dẫn của “một phát ngôn viên Bộ Tổng Tham mưu Lục quân Đế quốc mà Sue đã đọc trên
    báo hai ngày trước”, các thuật ngữ “trạng thái sẵn sàng chiến tranh”, “chính phủ
    Liên minh Entente chỉ đang thực hiện chiến thuật ngoại giao bên miệng hố chiến
    tranh”, câu điều kiện phủ định “Ít nhất, Đế quốc sẽ không chơi trò nguy hiểm đến
    thế nếu chúng ta chưa sẵn sàng chấp nhận rủi ro chiến tranh.” và câu kết “Nhận
    xét ấy đã nói lên tất cả.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000102: locks: [''Giữ giả định
    quá khứ “Cùng lắm, hoạt động ngoại giao bên miệng hố chiến tranh của Liên minh
    Entente chỉ nên dừng ở việc để lộ dấu hiệu hoạt động quân sự gia tăng để thăm
    dò phản ứng của Đế quốc.”, hình ảnh so sánh “gương mặt nhăn nhó như vừa cắn phải
    thứ gì cực kỳ khó nuốt” và câu hỏi tu từ kết đoạn “Ai mà ngờ Liên minh Entente
    lại tiến hành những hoạt động quân sự có thể đem vận mệnh cả quốc gia ra đánh
    cược mà không chuẩn bị trước?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000103: locks: [''Giữ cách xưng
    hô chỉ huy “Tôi – các anh – Chúng ta” và mệnh lệnh “Tôi không quan tâm các anh
    có dùng liên lạc tầm ngắn hay không. Đến nước này thì cứ nối máy thẳng với lực
    lượng mặt đất. Chúng ta sẽ giúp những đơn vị còn lại rút lui.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000104: locks: [''Giữ khẩu lệnh
    đáp ngắn gọn “Rõ.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000105: locks: [''Giữ các cụm
    “tiểu đoàn của Sue đang đóng ở hậu tuyến”, “những cuộc đụng độ lẻ tẻ liên tiếp
    gần biên giới quốc gia”, “Các đơn vị từ cấp đại đội trở lên có thể trở về thủ
    đô để chỉnh đốn”, đại từ trần thuật “anh”, nguyên nhân “Sue đã đọc sai tình hình
    chính vì anh thường tham gia những chiến dịch không thể ghi vào hồ sơ chính thức…”
    và suy luận “Nếu anh và lính của mình có thể lui về, vậy hẳn đất nước không định
    gây chiến; chính phủ lại đang tung ra những lời tuyên truyền như mọi khi.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000106: locks: [''Giữ mệnh đề
    xen trong gạch ngang dài “—những người xứng đáng được gọi là tinh nhuệ nhất, ngay
    cả giữa hàng ngũ tiền tuyến của Liên minh Entente—”, cùng sắc thái phê phán gay
    gắt “sự ngu xuẩn tột độ của đám chính khách và tướng lĩnh”, “một ổ toàn lũ ngu
    xuẩn” và “giở một nước đi ngu xuẩn đến mức không thể cứu vãn”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000107: locks: [''Giữ tên riêng
    và cách xưng hô “Darton, xin lỗi, nhưng cậu liên lạc với các đơn vị khác được
    không? Tôi muốn nắm chắc tình hình của ta.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000108: locks: [''Giữ cụm “giúp
    các đơn vị rút lui trước lực lượng địch áp đảo đến tuyệt vọng trong tình trạng
    gần như mù thông tin”, cấu trúc tăng tiến “không những không liên lạc được với
    người điều phối tiền phương được chỉ định, mà tình hình còn hỗn loạn đến mức chẳng
    nhận được hỗ trợ từ Trung tâm Điều hành Tác chiến” (không tự thêm cấp bậc sĩ quan),
    và chức năng “bảo đảm mức phối hợp tối thiểu cần thiết giữa các đơn vị pháp sư,
    không quân và lục quân”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000109: locks: [''Giữ chỉ thị
    của Sue “Nếu cần, ta sẽ hội quân với lực lượng tiếp viện. Các trung đội, nếu bị
    tách khỏi nhau và không thể tập hợp lại, các anh có thể gom thành nhóm dưới quyền
    bất kỳ người nào có thẩm quyền mà các anh tìm được.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000110: locks: [''Giữ câu báo
    cáo “Chỉ huy, tôi liên lạc được rồi!”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000111: locks: [{''Giữ thuật
    ngữ “chiếc máy thu phát”, đại từ “anh”, và quan hệ nhân quả “Liên minh Entente
    đang phải trả giá cho sai lầm lao vào thời chiến mà vẫn dùng nguyên hệ thống chỉ
    huy thời bình'': ''mọi dấu hiệu kiểm soát đều đã biến mất. Ai nhìn cũng thấy rõ.”.''}]'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000112: locks: [''Giữ lời đáp
    và câu hỏi xác nhận “Rõ. Dù sao đi nữa, không thể đánh trận mà chẳng có ai chỉ
    huy. Chúng ta phải xử lý đợt pháo kích đang gây ra cảnh hỗn loạn này. Đồng ý chứ?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000113: locks: [''Giữ sự tương
    phản “thay vì kháng cự thống nhất, mỗi đơn vị chỉ còn biết tự lo lấy mình” và
    nhận định “chẳng tìm đâu ra một đơn vị nào nắm được toàn cục và có đủ năng lực
    chỉ huy để thực hiện những biện pháp cần thiết.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000114: locks: [''Giữ câu đồng
    tình và gợi ý mục tiêu “Tôi hoàn toàn đồng ý. Các trận địa pháo chắc chắn được
    củng cố… nhưng còn những người quan sát thì sao?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000115: locks: [''Giữ đại từ
    “anh” và cụm “sự hỗ trợ thiết thực và khả thi nhất anh có thể cung cấp là cản
    trở hỏa lực gián tiếp của địch bằng cách loại bỏ những quan sát viên của chúng.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000116: locks: [''Giữ danh xưng
    “Chỉ huy Sue!”, tên đơn vị “Sư đoàn 6 lục quân” và nội dung báo cáo “Chúng ta
    vẫn có thể quan sát và phát tín hiệu!”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000117: locks: [''Giữ sắc thái
    yêu cầu thăm dò “Tốt! Hỏi xem họ có tìm ra các quan sát viên pháo binh của địch
    không.” và đại từ “họ” quy chiếu Sư đoàn 6 lục quân.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000118: locks: [''Giữ mệnh đề
    quan hệ trong gạch ngang dài “—đang cố giữ kỷ luật trong gang tấc khi rút lui—”
    và cụm “đã đem đến đúng cơ hội họ cần”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000119: locks: [''Giữ câu reo
    và nội dung bắt sóng “…Trúng rồi! Chúng đang phát các dãy số!” (dùng “Chúng” cho
    địch và “các dãy số”, tránh dịch nhầm thành tín hiệu kỹ thuật số).'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000120: locks: [''Giữ phân biệt
    hai thuật ngữ trong cùng đoạn “Một số pháp sư quan sát đang bay đơn độc” và “những
    bước sóng mã hóa riêng của các quan sát viên pháo binh đang truyền tin tình báo”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000121: locks: [''Giữ đại từ
    “chúng – ta” trong câu thoại “Đúng như dự đoán, chúng đi một mình nhỉ? Chúng coi
    thường ta quá rồi.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000122: locks: [''Giữ câu hỏi
    phản biện “Có thể, nhưng chẳng phải chúng đang ở sau một tuyến cảnh giới đồ sộ
    sao?”⁷ kèm đúng dấu chú thích `⁷`.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000123: locks: [''Giữ đại từ
    “Anh” và các thuật ngữ “không quân và các đơn vị pháp sư Đế quốc”, “giành ưu thế
    trên không bằng một mạng lưới đánh chặn phối hợp”, “một tuyến phòng không đủ vững
    chắc để các đơn vị yểm trợ có thể bay riêng lẻ”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000124: locks: [''Giữ lời than
    và giả định quá khứ tiếc nuối “Thề có trời, chúng ta đúng là điên mới gây chiến
    với một cường quốc quân sự. Lẽ ra tôi nên đưa gia đình bỏ trốn.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000125: locks: [''Giữ cách gọi
    “Chỉ huy Sue”, cụm miệt thị “đám chó Đế quốc bên kia” và đúng sắc thái “tự hỏi
    chiến tranh vốn dĩ dễ thế này sao”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000126: locks: [''Giữ lời đáp
    “Cũng có lý. Mong là chúng đã mất cảnh giác.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000127: locks: [''Giữ câu trần
    thuật “Nghĩ đến mọi chuyện đã trở nên tồi tệ đến mức nào, Sue chỉ còn biết hướng
    về Chúa.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000128: locks: [''Giữ đúng phạm
    vi nhấn mạnh chữ nghiêng Markdown bao trọn đoạn `*…Thật tình, Chúa ơi, rốt cuộc
    chúng ta đã sai từ đâu?*` theo DEC-P01-002.'']'
  non_canon: true
