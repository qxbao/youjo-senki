choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000199
  kind: terminology_and_voice
  value: locks=['Giữ đại từ độc thoại nội tâm ngôi thứ nhất “Mình” / “mình” theo DEC-P01-001,
    đại từ “họ” / “Đám người này” cho phía đối phương, câu hỏi tu từ ở câu 2 và mệnh
    đề phủ định “không khỏi nghi ngờ sự tỉnh táo của họ” ở câu 3.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000200
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” theo DEC-P01-001, câu hỏi phủ định ở câu
    1, câu hỏi phỏng đoán ở câu 2, dấu gạch ngang dài ở câu 4, cùng các cụm “doanh
    nhân hiện đại”, “kết quả hợp lý”, “nhân tính”, “đám ngốc hiếu chiến này”, “kịch
    bản tồi tệ nhất có thể xảy ra”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000201
  kind: terminology_and_voice
  value: 'locks=[''Bảo toàn sự chuyển dịch điểm nhìn ngay trong đoạn theo đúng DEC-P01-001:
    dùng đại từ trần thuật ngôi thứ ba “Nó” ở câu 1 và chuyển sang đại từ tự quy chiếu
    nội tâm “Mình” / “mình” ở câu 2; giữ dấu chấm lửng cuối câu 1, cùng các cụm “tiền
    lương làm thêm giờ”, “khoản phụ cấp độc hại”, “môi trường làm việc nguy hiểm”,
    “gửi hóa đơn”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000202
  kind: terminology_and_voice
  value: 'locks=[''Giữ thông báo vô tuyến từ sở chỉ huy với các thuật ngữ “CP”, “cảnh
    báo cho toàn chiến trường” và “nhiễu mana”: ““Đây là CP phát cảnh báo cho toàn
    chiến trường. Hãy coi chừng nhiễu mana.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000203
  kind: terminology_and_voice
  value: locks=['Giữ tên riêng “Tanya” ở câu 1 và đại từ trần thuật ngôi thứ ba “nó”
    ở câu 2 theo DEC-P01-001, bảo toàn mệnh đề điều kiện ở câu 3, cùng các cụm “CP”,
    “mana”, “biết suy tính logic và có đầu óc kinh tế”, “coi trọng con số một hơn
    con số không”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000204
  kind: terminology_and_voice
  value: locks=['Giữ câu hỏi tu từ ở câu 1, tình thái phỏng đoán (“Biết đâu...”) và
    phủ định (“không chịu mạo hiểm”) ở câu 2, mệnh đề nhượng bộ (“Kể cả có bị ăn bom
    trước đi nữa”) và điều kiện (“nếu còn sống sót”) ở câu 3, cùng các cụm “tín hiệu
    vô tuyến”, “những kẻ có lý trí”, “giải pháp hợp lý”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000205
  kind: terminology_and_voice
  value: locks=['Giữ đại từ tự quy chiếu nội tâm “mình” theo DEC-P01-001, bảo toàn
    duy nhất một cụm nhấn mạnh Markdown `*mình*` ở câu 1 theo đúng DEC-P01-002 (“Ít
    nhất thì *mình* sẽ chọn một giải pháp hợp lý.”), cùng các cụm “giải pháp hợp lý”,
    “mana”, “tạp âm trong suy nghĩ”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000206
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời hô gọi tôn giáo khi vận hành Elinium Type 95 với “Hỡi các
    thánh đồ”, “phước lành của Chúa chúng ta” và đại từ gộp “chúng ta”: ““Hỡi các
    thánh đồ, hãy tin vào phước lành của Chúa chúng ta. Hãy để chúng ta không biết
    đến sợ hãi.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000207
  kind: terminology_and_voice
  value: locks=['Giữ tên riêng “Tanya” và đại từ trần thuật ngôi thứ ba “Nó” / “nó”
    theo đúng DEC-P01-001, bảo toàn phủ định ở câu 3 (“vẫn không sao quen nổi”), cùng
    các thuật ngữ “mana”, “lời nguyền của Elinium Type 95”, “sự hưng phấn tôn giáo”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000208
  kind: terminology_and_voice
  value: locks=['Xử lý sở hữu cách ngôi thứ hai phiếm chỉ bằng “tâm trí người ta”
    theo quy ước direct-address choice, cùng các cụm “niềm hoan lạc và sự đau đớn
    tột cùng”, “nỗi kinh hoàng không sao tả xiết”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000209
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời hô gọi tôn giáo khi vận hành Elinium Type 95 với mệnh lệnh
    phủ định ở câu 1 và khẳng định phủ định ở câu 2: ““Đừng than khóc cho số phận
    của mình. Ôi, Chúa đã không ruồng bỏ chúng ta!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000210
  kind: terminology_and_voice
  value: locks=['Bảo toàn sự đan xen giữa độc thoại nội tâm ở câu 1 & 3 và câu trần
    thuật ngôi thứ ba theo điểm nhìn của Tanya ở câu 2 (“nó” chỉ Tanya theo DEC-P01-001,
    “hắn” chỉ Tồn tại X), giữ điều kiện giả định trái thực tế (“Nếu có thể, hẳn nó
    đã nguyền rủa hắn rồi”) và tình thái phỏng đoán (“có lẽ chỉ thốt ra được”), cùng
    các cụm “đám cộng sản”, “gọi tôn giáo là thuốc phiện”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000211
  kind: terminology_and_voice
  value: 'locks=[''Giữ thuật ngữ “Trường phái kinh tế Chicago” (P03-Chicago-school)
    và “ma túy”: “Trường phái kinh tế Chicago cho rằng ma túy nên được điều tiết bởi
    nền kinh tế.”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000212
  kind: terminology_and_voice
  value: locks=['Giữ đại từ nội tâm “mình” ở câu 1 theo DEC-P01-001, cấu trúc đối
    lập phủ định – khẳng định và điều kiện ở câu 1 (“không phải là muốn dừng mà không
    dừng được, mà là nếu dừng lại thì nhiều khả năng mình sẽ chết”), xử lý đại từ
    ngôi thứ hai phiếm chỉ ở câu 3 bằng “người ta”, cùng các cụm “Trường phái Chicago”,
    “ma túy”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000213
  kind: terminology_and_voice
  value: 'locks=[''Giữ câu kết của chuỗi lời cầu nguyện/hô gọi tôn giáo khi kích hoạt
    thuật thức qua Elinium Type 95: ““Ở điểm tận cùng xa xôi của cuộc hành trình,
    hãy để chúng ta vươn tới miền đất hứa.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000214
  kind: terminology_and_voice
  value: 'locks=[''Giữ tình thái khả năng ở câu 4 (“có thể làm xẹp phổi và gây xung
    huyết phổi”), cùng các thuật ngữ vật lý và y sinh học: “vụ nổ nhiệt áp”, “giới
    hạn nén áp suất”, “vụ nổ ma thuật không giới hạn”, “áp suất khí quyển”, “xẹp phổi”,
    “xung huyết phổi”, “quá trình đốt cháy”, “nồng độ oxy”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000215
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “Tình trạng thiếu oxy”, “ngộ độc khí carbon monoxide”,
    “tám nghìn feet”, “pháp sư không quân”, “Xẹp phổi”, cùng các mức độ tình thái
    giả định hệ quả (“sẽ khiến ngay cả... cũng phải bất tỉnh mà rơi xuống”, “sẽ phải
    hứng chịu nỗi đau đớn tột cùng”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000216
  kind: terminology_and_voice
  value: 'locks=[''Giữ nguyên chuỗi âm thanh nghẹt thở và ho sặc của pháp sư Cộng
    hòa: ““Ư… khặc… khụ…””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000217
  kind: terminology_and_voice
  value: locks=['Giữ họ “Degurechaff” ở câu 1, mệnh đề điều kiện và phủ định ở câu
    2 (“Nếu các pháp sư trong phạm vi nổ vẫn còn bay được, thì điều đó cũng chẳng
    kéo dài bao lâu”), cùng các thuật ngữ “nồng độ oxy”, “Vụ nổ ma thuật lan tỏa tự
    do”, “nhiễu mana”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000218
  kind: terminology_and_voice
  value: locks=['Giữ cùng chủ ngữ “Nó” (nhiễu mana) cho cả hai vế của cấu trúc “Nó
    không chỉ cắt đứt liên lạc mà còn khiến việc duy trì các thuật thức bay trở nên
    khó khăn” ở câu 1 theo đúng quy tắc trong style-guide.md; dùng đại từ ngôi thứ
    ba “nó” chỉ Tanya ở câu 2 theo DEC-P01-001; giữ thuật ngữ “các thuật thức bay”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000219
  kind: terminology_and_voice
  value: 'locks=[''Giữ thông điệp phát loa kêu gọi đầu hàng mở đầu với dấu hai chấm
    và cụm “các chiến binh của Quân đội Cộng hòa”: ““Hỡi các chiến binh của Quân đội
    Cộng hòa, hãy nghe đây: Trận chiến này đã kết thúc.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000220
  kind: terminology_and_voice
  value: locks=['Giữ tên riêng “Tanya” ở câu 1 và đại từ trần thuật ngôi thứ ba “Nó”
    ở câu 2 theo đúng DEC-P01-001, câu hỏi gián tiếp (“liệu sau ngần ấy chuyện thì
    có còn ai sống sót hay không”) và phủ định (“nhưng thử một tiếng cũng chẳng mất
    gì”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000221
  kind: terminology_and_voice
  value: locks=['Giữ thán từ mở đầu “Chà”, đại từ tự quy chiếu nội tâm “mình” theo
    DEC-P01-001, mệnh đề điều kiện phủ định (“nếu không còn ai sống sót”), cùng các
    cụm “đại đội”, “hậu phương”, “giờ nghỉ uống trà”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000222
  kind: terminology_and_voice
  value: 'locks=[''Giữ cặp đại từ “các người – chúng tôi” đồng bộ với ch-03-b30 (p000195,
    p000197), mệnh đề điều kiện ở vế đầu, cùng các thuật ngữ “quyền lợi tù binh” và
    “Công ước Worms”: ““Nếu các người đầu hàng, chúng tôi sẽ bảo đảm quyền lợi tù
    binh của các người theo Công ước Worms.””.'']'
