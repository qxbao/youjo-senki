choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ (DEC-P01-001), thuật ngữ & câu hỏi: tiếp nối
    điểm nhìn của nhóm sĩ quan quan sát tại Phòng tiếp khách số 7 (p000539–p000540),
    quy chiếu Đại úy von Degurechaff bằng ''Cô'' / ''cô'' (kèm phản thân ''mình'');
    khóa ''ăn bám'', ''pháp sư'', ''Cụm tập đoàn quân phía Đông'', ''đào tạo lại''
    và câu hỏi cảm thán kết đoạn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: khóa ''các sĩ quan tham mưu'', ''đạo
    quân phía đông'', ''Văn phòng Bộ Tổng Tham mưu'', quy chiếu nhóm sĩ quan khiếu
    nại bằng ''họ'' và bảo toàn phủ định ''Đây chẳng phải chuyện đùa, ít nhất là theo...''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại, cấp bậc, thuật ngữ & điều kiện: trong lời Đại úy
    von Degurechaff nói với các sĩ quan quan sát, khóa cặp xưng hô ''tôi – các vị'';
    khóa ''Đại úy von Degurechaff'', ''phe khiếu nại'', ''giám thị'', ''Bài kiểm tra'',
    ''mánh lới quang học cơ bản'' và hai câu điều kiện đối lập ở cuối đoạn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: khóa ''các ứng viên'', ''hình thái vật lý'',
    ''bàn làm việc'', ''những người không phải pháp sư'' và ''hình ảnh 3-D''; bảo
    toàn phủ định ở câu 1 và câu 2."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc, điều kiện & phủ định: khóa ''Giọng nói tổng
    hợp'', ''Đại úy von Degurechaff'' và câu điều kiện kèm phủ định ''Nếu lắng nghe
    thật kỹ, người ta có thể nhận ra âm thanh không hề phát ra từ phía trước.''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ tương phản: khóa ''mánh lới'', ''các ứng viên'',
    ''căn cứ không quân'' và quan hệ tương phản ''nó đơn giản đến mức phát bực, thế
    nhưng hầu như tất cả mọi người đều mắc lừa''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc & phủ định kép: khóa ''đạo quân phía đông'',
    ''Các sĩ quan cấp cao'', ''các đạo quân dã chiến khu vực'', ''Bộ Tổng Tham mưu''
    và cấu trúc phủ định kép ''khó lòng thoát khỏi một lời khiển trách''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại (Zettour/nhóm quan sát -> Tanya): khóa cặp xưng
    hô ''Chúng tôi / chúng tôi – cô'' đồng bộ với ngữ cảnh cấp trên nói với Đại úy
    von Degurechaff."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002), cấp bậc, chức vụ & đại từ: khóa
    ''Chuẩn tướng von Zettour, phó cục trưởng Cục Quân vụ'', ''đạo quân phía đông'',
    quy chiếu Zettour bằng ''ông''; chỉ bọc ''*Rốt cuộc các người đã làm cái quái
    gì ở bên đó thế hả?*'' tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ phần còn
    lại nằm ngoài dấu ''*...*''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhân quả & phủ định: khóa ''Trò đánh lừa bằng các thuật
    thức quang học'', ''sách giáo khoa pháp sư'', ''hỏa lực có kỷ luật'', ''Quân đội
    Cộng hòa'', ''các thuật thức quang học'', ''các ứng viên'', ''bài kiểm tra'' và
    bảo toàn đầy đủ các cấu trúc phủ định/tăng tiến trong đoạn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, câu hỏi phủ định & nhượng bộ: khóa ''Trung ương'',
    ''kinh nghiệm thực chiến'' và cấu trúc câu hỏi phủ định kèm nhượng bộ ''Chẳng
    phải ngay cả binh lính từ Trung ương cũng chỉ có khoảng một nửa là nhận ra thôi
    sao, dù họ đã có kinh nghiệm thực chiến?''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & phủ định: khóa ''*chẳng có
    ai*'' chỉ ở cụm từ phủ định tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ phần
    còn lại nằm ngoài dấu ''*...*''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: khóa ''giới chóp bu'', ''phái đoàn phía đông''
    và phản thân ''đạo quân của mình''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & câu hỏi dè dặt: giữ tự xưng ''tôi'' và cấu trúc
    câu hỏi lịch sự ''Xin thứ lỗi cho tôi, nhưng liệu đây có phải là vấn đề về kỹ
    năng hơn là kinh nghiệm chăng?''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ, đại từ & đối lập phủ định: quy chiếu sĩ quan
    phía đông bằng ''anh ta'', khóa ''Đại úy von Degurechaff'', ''đạo quân phía đông'',
    ''pháp sư'', ''Huy hiệu Xung kích Cánh Bạc'', ''bản lĩnh cá nhân'', ''kinh nghiệm
    thực chiến'' và cấu trúc câu hỏi gián tiếp đối lập ''liệu khoảng cách ở đây có
    phải là về bản lĩnh cá nhân chứ không phải kinh nghiệm thực chiến hay không''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: khóa ''ảo ảnh'', ''thuật thức quang học'' và ''mồi
    nhử''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000557
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ & phủ định: khóa ''Đại úy von Degurechaff'',
    ''kỷ luật hỏa lực'', ''đại đội'', ''trò đánh lừa quang học'', ''Trung ương'',
    ''mặt trận phía tây'' và hai cấu trúc phủ định ở câu cuối."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000558
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & phủ định (Tanya -> các sĩ quan quan sát): giữ
    cặp ''tôi – các vị'' (kèm phản thân ''mình'') đồng bộ với p000543 và bảo toàn
    hai mệnh đề phủ định."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000559
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: khóa ''đạo quân phía đông'' và câu hỏi trực
    tiếp về kết quả tổng thể."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000560
  kind: terminology_and_voice
  value: 'choices=["Số liệu thống kê & thuật ngữ: khóa chính xác tỷ lệ ''Hai mươi
    bảy trên tổng số hai mươi chín cặp'', ''ảo ảnh'' và ''đơn vị''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000561
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mệnh đề nhượng bộ: khóa ''Một trợ lý'', ''vở hài kịch
    đầy rẫy sai lầm'', ''những người quan sát'' và mệnh đề nhượng bộ ''mặc dù đã dành
    cả ngày trời...''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000562
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & điều kiện: khóa ''Các sĩ quan tham mưu
    thuộc Cục Quân vụ'', ''đào tạo lại'', ''các đạo quân khu vực'', tình thái ''có
    lẽ họ thực sự cần phải...'' và câu hỏi gián tiếp kèm điều kiện ở cuối đoạn."]'
