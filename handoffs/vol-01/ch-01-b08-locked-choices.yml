choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000129: locks: [''Giữ tên riêng
    “Tanya”, sự phân công nhiệm vụ rõ ràng giữa việc “dùng radio và bộ thiết bị quan
    sát để theo dõi các quả đạn rơi xuống”, “Kíp pháo binh tiếp nhận thông tin sẽ
    xử lý dữ liệu theo thời gian thực” và “Một nhân viên ở Norden Control đưa ra các
    mệnh lệnh chiến thuật”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000130: locks: [''Giữ đại từ
    tập thể “ta” và tự quy chiếu nội tâm “mình” theo DEC-P01-001, các thuật ngữ “pháo
    binh Đế quốc dùng đạn nổ trên không và bắn cho đạn cùng rơi trúng mục tiêu một
    lúc với trình độ đáng khen”, “cường quốc quân sự”, và cấu trúc tăng tiến ở câu
    kết “đến mức họ đã vượt qua niềm tin vào ưu thế hỏa lực để xem việc tuân theo
    ưu thế ấy như học thuyết được thừa nhận”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000131: locks: [''Giữ câu châm
    ngôn trong ngoặc kép “lưỡi lê không bao giờ nói dối, mà nguồn lực cũng vậy.”,
    danh hiệu “thần chiến tranh” của “Lục quân Đế quốc”, tên riêng “Tanya”, và phép
    so sánh mỉa mai “những vị thần tuyệt đối hơn hẳn một thực thể mờ ám nào đó tự
    tiện xưng mình là Thượng đế tối cao”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000132: locks: [''Giữ các đại
    từ “phe ta”, “chúng ta” và đại từ nội tâm “mình” theo DEC-P01-001, cụm “duy trì
    ưu thế trên không, với mạng lưới giám sát chống pháp sư không quân của đối phương
    được bố trí sẵn”, và câu điều kiện “Nếu mình báo cho các vị thần chiến tranh rằng
    có kháng cự lẻ tẻ hay chỉ một tia hỏa lực phòng không, họ sẽ san phẳng cả khu
    vực chỉ bằng một cuộc gọi.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000133: locks: [''Giữ đại từ
    nội tâm “mình”, nhận xét “Công việc này vừa an toàn, ổn định lại vẫn được coi
    trọng. Mong là cứ thế này mãi.”, và hình ảnh so sánh liên tưởng “giữ vai trò chủ
    chốt trong màn trút xuống nhiều sắt thép đến mức khiến buổi trình diễn hỏa lực
    Fuji trông thật nhỏ bé”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000134: locks: [''Giữ phủ định
    kép mở đầu “Ngắm quân ta dễ dàng nghiền nát kẻ địch từ độ cao an toàn trên trời
    chẳng có gì khó chịu cả.”, trình tự hiệp đồng tác chiến “Pháo binh cày nát trận
    địa, rồi bộ binh và xe bọc thép tiến lên theo sau.”, các thuật ngữ “Bọn pháp sư
    chúng ta phụ trách yểm trợ không đối đất và tuần tra chiến đấu trên không.”, “phi
    đội hỗn hợp tiêm kích-ném bom tiến lên làm mũi nhọn cho đợt đột kích sâu”, cùng
    lời tán thưởng “Bộ Tổng Tham mưu” và đại từ nội tâm “Mình – mình” ở câu kết.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000135: locks: [{''Giữ đại từ
    nội tâm “Mình – mình”, lời trích dẫn của “Đại tướng Lee”'': ''“May thay chiến
    tranh khủng khiếp đến thế, nếu không, chúng ta sẽ ngày càng mê đắm nó.”, và sự
    tương phản trong suy nghĩ của Tanya “Với mình, chiến tranh vui đến mức chẳng biết
    phải làm sao nữa.”.''}]'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000136: locks: [''Giữ nguyên
    khẩu lệnh vô tuyến “Norden Control gọi Fairy 08. Pháo binh bắt đầu bắn có quan
    sát. Báo số liệu.” (phân biệt rõ “bắn có quan sát” với “bắn hiệu chỉnh”).'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000137: locks: [''Giữ nguyên
    báo cáo vô tuyến của Tanya “Đây là Fairy 08. Đã xác nhận các điểm đạn rơi ban
    đầu. Đang gửi. Không cần chỉnh làn bắn. Xin nhắc lại, không cần chỉnh làn bắn.
    Bắt đầu bắn hiệu lực.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000138: locks: [''Giữ đại từ
    “ta” và “mình”, các thuật ngữ “từ loạt bắn đầu tiên đến những phát đạn liên tiếp
    rơi sát mục tiêu, với pháo binh được tích hợp ở cấp quân đoàn dã chiến”, phủ định
    kép “Đế quốc được xem là cường quốc quân sự chẳng phải vô cớ”, và câu kết “Nhờ
    thế, khối lượng công việc của mình nhẹ tênh. Tuyệt quá.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000139: locks: [''Giữ khẩu lệnh
    vô tuyến “Norden Control, đã rõ. Cẩn thận đạn lạc. Dự kiến bắt đầu bắn tập trung
    sau hai trăm. Hết.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000140: locks: [''Giữ khẩu lệnh
    đáp ngắn gọn “Fairy 08, đã rõ. Hết.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000141: locks: [''Giữ đại từ
    nội tâm “Mình – mình” và tập thể “chúng ta”, hướng di chuyển “bay về phía tây
    để tách khỏi chiến trường một chút, đồng thời lên cao hơn đôi chút”, giả định
    “nhưng nếu đồng đội vô tình bắn mảnh đạn trúng mình thì đúng là thảm họa”, thuật
    ngữ “loạt bắn tập trung”, và tâm thế ghen tị với “Mấy tay pháo binh chắc sẽ tha
    hồ bắn hết sức”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000142: locks: [''Giữ đại từ
    nội tâm “mình”, hình ảnh “trút xuống một trận mưa sắt dữ dội đến mức xóa sạch
    mọi cảnh phim chiến tranh trong ký ức mình”, và trình tự thời gian “những chấm
    đen rơi kín mặt đất; ngay khi những quầng lửa nổ tan đi, các mảnh thân thể từng
    là con người bay tứ tung rồi biến mất”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000143: locks: [''Giữ khẩu lệnh
    báo cáo kết quả vô tuyến “Fairy 08 gọi Norden Control. Đã xác nhận đạn của nhiệm
    vụ hỏa lực trúng mục tiêu. Xin nhắc lại.”.'']'
  non_canon: true
