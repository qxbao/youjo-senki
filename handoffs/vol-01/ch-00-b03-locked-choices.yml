choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000043: locks: [''Giữ thuật ngữ
    “chuyển đổi mô thức”, đúng phạm vi chữ nghiêng `*Tuân thủ các quy tắc. Tìm kẽ
    hở trong chúng. Coi thường những chỉ dẫn dù vẫn bị chúng ràng buộc.*` theo DEC-P01-002,
    và kết luận về sự cần thiết của quy tắc để hệ thống vận hành trơn tru.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000044: locks: [''Giữ cấu trúc
    đối xứng “Tự do không có luật pháp sẽ thành vô chính phủ; luật pháp không có tự
    do sẽ thành chuyên chế” và quan hệ nhượng bộ giữa việc ghét những hạn chế với
    nỗi sợ sự tự do vô hạn.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000045: locks: [''Giữ đại từ
    ngôi thứ ba “Anh” và ba mệnh đề phủ định liên tiếp về những kiểu người mà nhân
    vật không thể hiểu hay coi trọng.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000046
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000046: locks: [''Giữ thuật ngữ
    kèm ký hiệu chú thích “trường phái kinh tế Chicago¹”, thuật ngữ “tính hợp lý”
    trong mối quan hệ giữa quy tắc và tự do, đại từ ngôi thứ ba “anh”, đại từ phản
    thân “mình” và định nghĩa “được tự do trong khuôn khổ quy tắc”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000047
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000047: locks: [''Giữ đại từ
    “anh”, các thuật ngữ “quãng tạm hoãn”, “vốn con người”, “lý thuyết tín hiệu”,
    và cụm trong ngoặc kép “sinh viên đại học tốt”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000048
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000048: locks: [''Giữ cấu trúc
    phủ định–khẳng định về việc không cần tài năng mà quan trọng nhất là hồ sơ đẹp,
    ba tiêu chí nhà tuyển dụng ưa thích (thi đỗ xuất sắc, tốt nghiệp trường danh giá,
    gương mặt quen thuộc với người phỏng vấn), và hệ quả suy thoái kinh tế không ảnh
    hưởng đáng kể đến “anh”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000049: locks: [''Giữ đại từ
    “anh”, hình ảnh đứng ở vạch xuất phát khác, nhận định cuộc cạnh tranh đã bị dàn
    xếp có lợi cho anh, việc gặp gỡ cựu sinh viên cùng trường cũ và đi uống với nhân
    viên tuyển dụng thuộc “bộ phận nhân sự”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000050: locks: [''Giữ giả định
    về người bên phía tuyển dụng học cùng “trường trung học cơ sở và trung học phổ
    thông” hoặc tốt nghiệp cùng trường đại học với “anh” và sự hướng dẫn về phẩm chất
    nhà tuyển dụng tìm kiếm.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000051: locks: [''Giữ các mệnh
    đề điều kiện của “anh”, hình ảnh “bánh răng xã hội” hoạt động ổn định và việc
    tự xem “mình” là người trưởng thành trong môi trường công sở.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000052: locks: [''Giữ ba câu
    hỏi tu từ mở đầu, hình ảnh “bánh răng trong xã hội”, điều kiện “miễn là được trả
    công xứng đáng”, các tiêu chuẩn về “nhân viên lý tưởng” dưới góc nhìn công ty,
    và cụm “nô lệ cho logic doanh nghiệp”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000053: locks: [''Giữ bốn câu
    hỏi tu từ mở đầu, sự ghê sợ đối với những người gào thét mất mặt hoặc dùng bạo
    lực, và sự thích nghi theo thời gian giống như ở trường học.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000054: locks: [''Giữ cặp vai
    trò “lính gác thì hành xử như lính gác, tù nhân thì hành xử như tù nhân” liên
    kết với thí nghiệm tâm lý học ở batch trước, và mục đích tuân theo chỉ thị công
    ty, tránh sai sót để công việc không lấn vào thời gian rảnh quý giá.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000055: locks: [''Giữ cấu trúc
    tăng tiến “không những… mà còn…” cùng chủ thể “anh” theo style-guide, tên đơn
    vị “bộ phận nhân sự”, chức danh “trưởng phòng” và tên giải thưởng “giải Touchstone”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000056: locks: [''Giữ toàn bộ
    đoạn độc thoại nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002, đại từ tự quy
    chiếu “mình” theo DEC-P01-001, danh từ “nữ tu”, cấu trúc nhấn mạnh phủ định “Chẳng
    có lý do gì — tuyệt đối chẳng có lý do gì —”, cách tỉnh lược đại từ ngôi thứ hai
    khi chất vấn quyền gọi tên và cụm trong ngoặc kép “Tanya, thân mến”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000057: locks: [''Giữ sự chuyển
    đổi đại từ trần thuật về “nó” cho Tanya ở thực tại trại trẻ mồ côi theo DEC-P01-001,
    đại từ tự quy chiếu “mình” trong cụm “tại sao lại là mình”, và diễn biến cơn đau
    đầu khi những ký ức khó chịu ùa về.'']'
  non_canon: true
