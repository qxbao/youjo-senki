segment_id_end: YS-LN01/Text/chapter007b.xhtml/p000277
choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000253
  kind: terminology_and_voice
  value: locks=['Giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa, dấu gạch
    ngang dài và các thuật ngữ “bên Tình báo”, “tiền tuyến”, “một người lính địch
    đơn độc”, “đại đội”, “độ cao bất khả thi”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000254
  kind: terminology_and_voice
  value: locks=['Giữ cụm “vùng chiến sự”, “tin tức tình báo gửi về bị nhiễu loạn”
    và sự tương phản nhượng bộ (“nhưng thật đáng tiếc là bản chất khác thường của
    đối thủ lại đang làm chậm trễ những nỗ lực nhận diện của họ”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000255
  kind: terminology_and_voice
  value: 'locks=[''Giữ tiếng chửi giận dữ và biệt danh đồng bộ với ch-03-b27/b28:
    ““Tên Ác quỷ sông Rhine khốn kiếp!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000256
  kind: terminology_and_voice
  value: 'locks=[''Giữ lời chấn chỉnh và câu hỏi trực tiếp kèm cấp bậc, tên riêng
    và biệt danh: ““Thôi ngay đi. Đại úy Cagire, Ác quỷ sông Rhine là kẻ nào?””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000257
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “Named”, “tín hiệu ma lực”, đại từ tự xưng “chúng
    tôi” và cách quy chiếu trung tính “đối tượng” theo đúng giới hạn của DEC-P01-001.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000258
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “Viên sĩ quan tình báo”, “tín hiệu ma lực”, “các sĩ quan
    cấp cao khác”, “bên Tình báo”, cùng câu điều kiện suy luận ở câu 2 (“Nếu họ chỉ
    có thể nhận diện kẻ địch này độc qua tín hiệu ma lực, điều đó có nghĩa là họ chẳng
    biết gì cả.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000259
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “nhật ký dữ liệu của những quả cầu tính toán”,
    “các sĩ quan tình báo” và cấu trúc hai khả năng loại trừ ở câu 2 (“hoặc là các
    sĩ quan tình báo đã tắc trách trong nhiệm vụ của mình, hoặc là chẳng có gì được
    ghi lại cả”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000260
  kind: terminology_and_voice
  value: 'locks=[''Giữ chức danh “Tham mưu trưởng”, thuật ngữ “nhật ký dữ liệu”, đại
    từ “Các anh”, và theo DEC-P01-002 chỉ đánh dấu nhấn mạnh Markdown cho đúng câu
    tương ứng với `<html:em>`: `*Lũ khốn các người bất tài vô dụng đến mức ngay cả
    chừng đó việc cũng không làm nổi sao?!*`.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000261
  kind: terminology_and_voice
  value: locks=['Giữ đại từ tự xưng “Chúng tôi”, các thuật ngữ “những quả cầu thu
    hồi được”, “thẩm vấn thu thập thông tin” (đồng bộ ch-03-b32 p000233), “bên Tình
    báo” và “một pháp sư chưa được xác nhận”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000262
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “một đội đặc nhiệm”, “chiến dịch”, “những pháp
    sư tử trận”, “quả cầu tính toán”, “đống mảnh vỡ” và câu hỏi gián tiếp “xem có
    dữ liệu nào cứu vãn được hay không”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000263
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu và mệnh đề phủ định tuyệt đối: “…Nhưng
    họ chẳng tìm thấy bất cứ thứ gì hữu ích.”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000264
  kind: terminology_and_voice
  value: locks=['Giữ sự tương phản giữa “cả một núi bằng chứng cho thấy sự tồn tại
    của pháp sư bí ẩn kia” với mệnh đề phủ định, và bảo toàn đại từ ngôi thứ ba nam
    giới “hắn” theo đúng suy đoán mặc định của phía Cộng hòa trong nguồn.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000265
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu, thuật ngữ “tín hiệu ma lực” và hai câu
    hỏi trực tiếp: ““…Vậy là chỉ có mỗi tín hiệu ma lực thôi sao? Thế nghĩa là thế
    nào?””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000266
  kind: terminology_and_voice
  value: locks=['Giữ phủ định gần như tuyệt đối “Hầu như không một ai sống sót”, đại
    từ “hắn” (đồng bộ p000264) và cụm “ngoài tầm bắn”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000267
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “Ác quỷ”, “bỏng toàn thân”, “những quả cầu tính toán”,
    “lớp vỏ ngoài cứng cáp đã tan chảy”, “các lõi bên trong”, chủ ngữ khái quát “người
    ta” và cấu trúc giả định lựa chọn ở câu 3 (“Để gây ra mức độ tàn phá cỡ đó bằng
    vũ khí thông thường, người ta sẽ phải lôi ra hoặc là đại bác hạng nặng, hoặc là
    cả tấn thuốc nổ.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000268
  kind: terminology_and_voice
  value: 'locks=[''Giữ cấu trúc song hành “vừa có thể... vừa có thể...” cùng chuỗi
    thuật ngữ đồng bộ với ch-03-b27/b28: “hỏa lực áp đảo”, “bắn tỉa chính xác”, “Named”,
    “mối đe dọa cấp chiến lược”, “Ác quỷ sông Rhine”, “thư viện dữ liệu” và “tín hiệu
    ma lực”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000269
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “Biệt danh “Ác quỷ””, “chiến trường này”, “Quân đội Cộng
    hòa”, “hơn sáu mươi điểm hạ gục” (đồng bộ ch-03-b27 p000128) và mệnh đề điều kiện
    “nếu các hồ sơ ghi chép là chính xác”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000270
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “Binh lính ngoài tiền tuyến”, “một đội tiễu trừ
    Named” và “những thành viên tinh nhuệ của chính họ”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000271
  kind: terminology_and_voice
  value: locks=['Giữ các thuật ngữ “đoạn hình ảnh”, “một quả cầu tính toán” (từ “nó”
    chỉ quy chiếu quả cầu tính toán) và “Đại đội 106” (đồng bộ ch-03-b32).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000272
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “Đoạn video”, “loạt đạn bắn đồng loạt của cả một đại
    đội”, câu hỏi gián tiếp ở câu 2, mệnh đề nhượng bộ “bất chấp làn đạn đan chéo”
    và hình ảnh “bay điềm tĩnh đến mức trông gần như thanh thoát”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000273
  kind: terminology_and_voice
  value: 'locks=[''Giữ hai dấu chấm lửng ngập ngừng trong câu hỏi trực tiếp và vế
    trần thuật kết quả: ““…Đó là… đang khiêu vũ sao?” Những chuyển động cuốn hút đến
    mức có người bất giác lẩm bẩm.”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000274
  kind: terminology_and_voice
  value: locks=['Giữ thuật ngữ “ánh sáng ma lực” (đồng bộ ch-03-b22, b26, b28), sự
    tương phản ở câu 1 và phủ định kèm tình thái ước đoán ở câu 2 (“Đáng cáu tiết
    thay, dường như chẳng có lấy một phát đạn nào bắn trúng.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000275
  kind: terminology_and_voice
  value: locks=['Giữ biệt danh “Ác quỷ sông Rhine” và câu phủ định tuyệt đối ở câu
    2 (“Không một người bình thường nào có thể luồn lách qua một thế trận như vậy
    rồi bắn trả mà trông chẳng có vẻ gì là đang gặp nguy hiểm cả.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000276
  kind: terminology_and_voice
  value: locks=['Giữ câu hỏi trực tiếp với thuật ngữ “hỏa lực bắn có kỷ luật” (đồng
    bộ B15-T11 và ch-03-b28 p000146) và đại từ “chúng ta”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000277
  kind: terminology_and_voice
  value: locks=['Giữ câu hỏi trực tiếp với thuật ngữ “Khả năng cơ động”, cách quy
    chiếu trung tính “đối phương” và đại từ “chúng ta”.']
