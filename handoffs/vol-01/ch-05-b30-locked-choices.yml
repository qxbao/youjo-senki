- segment_id: YS-LN01/Text/chapter011b.xhtml/p000082
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya với cấp trên là Trung tá von Lergen: tự
    xưng ''Tôi'' kèm tiểu từ kính ngữ ''ạ''.; terms_and_ranks=Không có thuật ngữ mới.;
    modality_and_negation=Giữ câu hỏi xin phép lịch sự ''Tôi có thể hỏi tại sao không
    ạ?''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000083
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen với Tanya: gọi Tanya là ''Cô'' kết hợp
    ''đơn vị mình''.; terms_and_ranks=bí mật quân sự; năng lực tác chiến; phía đông
    nam; mệnh lệnh.; modality_and_negation=Giữ câu khẳng định lý do bảo mật ở câu
