    terms_and_ranks=Bộ Tổng Tham mưu.; modality_and_negation=Giữ câu khẳng định ngắn
    gọn nêu quyết định của Bộ Tổng Tham mưu.; emphasis=Không dùng dấu *...* (nguồn
