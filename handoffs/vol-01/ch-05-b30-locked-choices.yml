    mới'' ở câu 2.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000084
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''mình'' / ''Mình''
    theo DEC-P01-001; quy chiếu Lergen bằng ''ông ấy''.; terms_and_ranks=toan tính
    chính trị; đơn vị; Bộ Tổng Tham mưu; phía đông nam.; modality_and_negation=Giữ
    phủ định ''sẽ không giải thích'' ở câu 1, mức độ phỏng đoán ''nhưng có lẽ chỉ
    tổ phí thời gian mà thôi'' ở câu 2, và tính bắt buộc ''lại buộc phải được điều
    tới phía đông nam'' ở câu 3.; emphasis=Bảo toàn chính xác hai cụm nhấn mạnh Markdown
    ''*Vậy là ông ấy sẽ không giải thích những toan tính chính trị đằng sau quyết
    định này.*'' và ''*Trong trường hợp đó, tất cả những gì mì'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000085
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya với Lergen: hô ngữ ''Thưa ngài'', tự xưng
    ''tôi'', dùng ''các ngài'' quy chiếu Lergen và Bộ Tổng Tham mưu.; terms_and_ranks=năng
    lực tác chiến; đơn vị.; modality_and_negation=Giữ cấu trúc câu điều kiện kèm lời
    đề nghị (''nếu thứ các ngài cần là năng lực tác chiến, tôi đề nghị các ngài hãy
    sử dụng một đơn vị đã được huấn luyện đầy đủ'').; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000086
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen với Tanya: tự xưng ''Tôi'', quy chiếu
    đơn vị của Tanya bằng ''đơn vị của cô''.; terms_and_ranks=đơn vị.; modality_and_negation=Giữ
    sắc thái phỏng đoán lịch sự ''Tôi cho rằng đơn vị của cô vốn đã ở trên mức trung
    bình rồi.''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000087
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại công vụ của Tanya với Lergen: gọi ''Thưa Trung tá
    von Lergen'' và ''ngài'', tự xưng ''tôi'' kết hợp phản thân ''mình'', quy chiếu
    binh lính trong đơn vị bằng ''họ''.; terms_and_ranks=Trung tá von Lergen; triển
    khai; đơn vị.; modality_and_negation=Giữ sắc thái nghĩa vụ bắt buộc (''tôi buộc
    phải báo để ngài rõ rằng...'') và mức độ khả thể (''làm như vậy có thể cản trở
    quá trình chuẩn bị để họ có thể chiến đấu một cách hữu hiệu'').; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000088
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''mình'' ở câu
    1 theo DEC-P01-001; quy chiếu ''Bất kỳ tiểu đoàn trưởng nào'' ở câu 2 bằng ''họ''
    (lưu ý gợi ý tại findings về từ ''mình'' phản thân ở câu 2).; terms_and_ranks=tiểu
    đoàn trưởng; đơn vị.; modality_and_negation=Giữ khẳng định tất nhiên ''lẽ tự nhiên
    đều sẽ phàn nàn khi bị tước đi khoảng thời gian cần thiết để giúp đơn vị của họ
    sẵn sàng''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000089
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen với Tanya: gọi Tanya là ''cô''.; terms_and_ranks=Không
    có thuật ngữ mới.; modality_and_negation=Giữ sự đối lập giữa ghi nhận công vụ
    ở vế đầu và mệnh lệnh phủ định dứt khoát ''nhưng đừng trông mong quyết định này
    sẽ bị đảo ngược'' ở vế sau.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000090
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: tự quy chiếu ''mình'' theo
    DEC-P01-001; quy chiếu Lergen bằng ''ông ấy''.; terms_and_ranks=cấp trên.; modality_and_negation=Giữ
    câu điều kiện dẫn tới kết luận chắc chắn tuyệt đối ở câu 2 (''Nếu âm sắc đanh
    cứng trong giọng nói của ông ấy phản ánh quyết tâm của cấp trên, thì không còn
    nghi ngờ gì nữa, điều đó cho thấy quyết định này đã như đinh đóng cột rồi.'').;
    emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000091
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại nhận lệnh của Tanya với Lergen: hô ngữ ''thưa ngài''.;
    terms_and_ranks=Không có thuật ngữ mới.; modality_and_negation=Giữ câu đáp điều
    lệnh ngắn gọn ''Đã rõ, thưa ngài.''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000092
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm và trần thuật ngôi thứ nhất của Tanya:
    tự quy chiếu ''mình'' / ''Mình'' theo DEC-P01-001; quy chiếu cấp trên bằng ''họ'';
    quy chiếu Trung tá von Lergen bằng ''ông ấy'' / ''chính ông ấy''.; terms_and_ranks=mệnh
    lệnh bằng văn bản; Trung tá von Lergen; phái viên.; modality_and_negation=Giữ
    giả định quá khứ ''Nhưng lẽ ra họ đã có thể giải quyết chuyện này...'' ở câu 2,
    câu hỏi nội tâm ở câu 3, phủ định ''Mình không sao gạt bỏ được câu hỏi đó.'' ở
    câu 4, và sắc thái ngoại hiện ''xem chừng đã hoàn tất'' ở câu 5.; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000093
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen khuyên Tanya: gọi Tanya là ''cô''.; terms_and_ranks=phía
    đông nam; tiếng Dacia.; modality_and_negation=Giữ dấu hai chấm nối lời mở đầu
    với câu hỏi gợi ý mang hình thức phủ định ''sao không nhân dịp này dành thời gian
    học tiếng Dacia đi?''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000094
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại hỏi lại của Tanya với Lergen: hô ngữ ''thưa ngài''.;
    terms_and_ranks=Tiếng Dacia.; modality_and_negation=Giữ nguyên hai câu hỏi ngắn
    thể hiện sự ngạc nhiên của Tanya.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000095
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen với Tanya: dùng đại từ ngôi thứ nhất số
    nhiều bao gộp ''những người lính chúng ta''.; terms_and_ranks=người lính.; modality_and_negation=Giữ
    khẳng định phủ định tuyệt đối ''Học thêm một ngôn ngữ mới thì chẳng bao giờ thiệt
    đi đâu cả''.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000096
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Độc thoại nội tâm của Tanya: dùng ''chúng ta'' chỉ phía
    Đế quốc; quy chiếu ''người Dacia'' bằng ''họ''.; terms_and_ranks=tiếng Dacia;
    Dacia; đồng minh; kẻ địch; người Dacia; thu thập tin tức tình báo.; modality_and_negation=Giữ
    sự tán đồng có giới hạn ở câu 1, câu hỏi nội tâm ở câu 2, hai khả năng đối lập
    ở câu 3 và hai câu điều kiện đối xứng ở câu 4–5.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000097
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya với Lergen: tự xưng ''tôi'', gọi Lergen
    là ''ngài'' / ''thưa ngài''.; terms_and_ranks=Không có thuật ngữ mới.; modality_and_negation=Giữ
    câu điều kiện mở ''Nếu thu xếp được thời gian, tôi sẽ thử học xem sao.'' và lời
    cảm ơn lịch sự ở câu 2.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000098
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Lergen chào tạm biệt Tanya: gọi Tanya là ''cô''
    và chức danh ''Tiểu đoàn trưởng von Degurechaff''.; terms_and_ranks=thăng hàm;
    Tiểu đoàn trưởng von Degurechaff.; modality_and_negation=Giữ lời đáp lịch sự ''Không
    có gì đâu.'' và lời chúc mừng thăng hàm lần nữa.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000099
  kind: terminology_and_voice
  value: pov_and_pronouns=Dòng tiêu đề thời gian – địa điểm mở đầu phân cảnh mới.;
    terms_and_ranks=NĂM THỐNG NHẤT 1924; VÙNG RANSYLVANIA; HẠT TURAO; KHU DIỄN TẬP
    DÃ NGOẠI CỦA QUÂN ĐỘI ĐẾ QUỐC.; modality_and_negation=Giữ nguyên định dạng in
    hoa toàn bộ của dòng tiêu đề chuyển cảnh.; emphasis=Không dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000100
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngôi thứ ba khách quan mở đầu phân cảnh thanh
    tra.; terms_and_ranks=căn cứ mới; tiểu đoàn; đợt thanh tra; giai đoạn tuyển chọn
    ban đầu.; modality_and_negation=Giữ mốc thời gian ngắn 'Chỉ vài ngày sau khi...'
    và mục đích của đợt thanh tra.; emphasis=Không dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000101
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Trần thuật ngôi thứ ba từ góc nhìn của các sĩ quan cấp
    cao thuộc Bộ Tổng Tham mưu: quy chiếu bằng ''họ''.; terms_and_ranks=tình hình
    chiến sự; kế hoạch triển khai; đợt thanh tra; Các sĩ quan cấp cao của Bộ Tổng
    Tham mưu; kỷ luật của đơn vị.; modality_and_negation=Giữ quan hệ nhân quả ở câu
    1, sự đối lập tích cực ''nhưng những dự tính của họ đã bị phản bội theo cách tuyệt
    vời nhất có thể'' ở câu 2, và định ngữ phủ định khả thể ''một cảnh tượng mà họ
    chẳng bao giờ có thể tưởng tượng nổi'' ở câu 3.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000102
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại quát tháo qua vô tuyến của Tanya với các pháp sư
    trong tiểu đoàn: gọi ''Lũ đầu đất các người''.; terms_and_ranks=Không có thuật
    ngữ mới.; modality_and_negation=Giữ khẩu khí gay gắt và mệnh lệnh trực tiếp bắt
    bay cao hơn.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000103
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya qua vô tuyến: gọi cấp dưới là ''Các người'',
    tự xưng ''tôi''.; terms_and_ranks=tám nghìn feet.; modality_and_negation=Giữ câu
    cảm thán chê độ cao mới có tám nghìn feet, lời mắng ''Đồ yếu đuối.'' và câu hỏi
    trách mắng phủ định ''Các người không nghe thấy tôi nói gì hả?''.; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000104
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Trần thuật ngôi thứ ba từ điểm nhìn quan sát bên ngoài
    của đoàn thanh tra: theo đúng giới hạn của DEC-P01-001, quy chiếu Tanya là ''một
    đứa trẻ—một cô bé'' / ''cô bé'' / ''cô'' (không dùng ''nó'').; terms_and_ranks=máy
    vô tuyến; mana.; modality_and_negation=Giữ sự tương phản ở câu 2 (''Thật khó tin,
    nhưng đó lại là giọng của một đứa trẻ—một cô bé.'') và sự đe dọa không khoan nhượng
    (''sẵn sàng thẳng tay bắn rụng bất kỳ kẻ nào dám bay thấp hơn'') ở câu 3.; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000105
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Thoại của Tanya qua vô tuyến: gọi các pháp sư là ''các
    người'', dùng ''chúng ta'' chỉ phía Quân đội Đế quốc.; terms_and_ranks=tài nguyên;
    đồng đội.; modality_and_negation=Giữ câu hỏi ngắn phủ định ''Không làm được hả?'',
    chuỗi câu mệnh lệnh ngắn dồn dập và câu điều kiện thực dụng ở câu 4.; emphasis=Không
    dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000106
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Trần thuật ngôi thứ ba từ điểm nhìn bên ngoài: quy chiếu
    Tanya bằng ''cô'', quy chiếu các pháp sư bằng ''họ''.; terms_and_ranks=thuật thức
    oanh kích; độ cao; mana; pháp sư.; modality_and_negation=Giữ câu điều kiện giả
    định ở câu 1, cấu trúc điều kiện loại trừ kép ''mà chưa ngất đi hoặc chưa cạn
    sạch mana trước đó thì chắc chắn sẽ bị bắn rụng khỏi bầu trời'' ở câu 2, và mệnh
    đề phủ định ''các pháp sư cũng chẳng ngờ cô lại làm thật'' đối lập với thực tế
    ở câu 3.; emphasis=Không dùng dấu *...*.'
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000107
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại mệnh lệnh của Tanya qua vô tuyến.; terms_and_ranks=Không
    có thuật ngữ mới.; modality_and_negation=Giữ cấu trúc lựa chọn mệnh lệnh đặc trưng
    'hoặc là chết đi, hoặc là bay cao hơn nữa'.; emphasis=Không dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000108
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngôi thứ ba nhận định chung.; terms_and_ranks=tiền
    lệ.; modality_and_negation=Giữ câu khẳng định ngắn gọn 'Hôm nay lại là một ngày
    nữa phá vỡ mọi tiền lệ.'.; emphasis=Không dùng dấu *...*.
- segment_id: YS-LN01/Text/chapter011b.xhtml/p000109
  kind: terminology_and_voice
  value: 'pov_and_pronouns=Lời lẩm bẩm của Thiếu tá von Degurechaff: dùng đại từ ngôi
    thứ nhất số nhiều ''chúng ta''.; terms_and_ranks=pháp sư; Quân đội Cộng hòa; tám
    nghìn; mười nghìn.; modality_and_negation=Giữ quan hệ kéo theo giữa khả năng của
    đối phương (''có thể vươn tới độ cao tám nghìn'') và mục tiêu đặt ra cho đơn vị
    (''nên chúng ta phải nhắm tới mức mười nghìn'').; emphasis=Bảo toàn chính xác
    dấu *...* bao trọn toàn bộ câu tương ứng 1:1 với thẻ <html:em> trong xhtml nguồn
    theo DEC-P01-002.'
