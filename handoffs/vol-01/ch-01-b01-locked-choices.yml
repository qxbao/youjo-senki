choices:
- segment_id: YS-LN01/Text/chapter003.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000001: locks: [''Giữ toàn bộ
    dòng tiêu đề in hoa “THÁNG SÁU, NĂM THỐNG NHẤT 1923, TUYẾN TUẦN TRA THỨ BA, MẶT
    TRẬN NORDEN, QUÂN KHU PHÍA BẮC”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000002: locks: [''Giữ câu hỏi
    nội tâm in nghiêng `*Vì sao mình lại ở nơi này chiến đấu trong một cuộc chiến?*`
    theo DEC-P01-002, đại từ nội tâm tự quy chiếu “mình” theo DEC-P01-001, cách tách
    biệt “Ý thức của mình, được gán danh tính Tanya Degurechaff, thiếu úy ma pháp”,
    và hình ảnh để khẩu súng trường đang làm vương trượng nằm lại trên mặt đất rồi
    bay vút lên trời.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000003: locks: [''Giữ đại từ
    tự quy chiếu “Mình”, không in nghiêng theo DEC-P01-002, và giữ nguyên độ mở của
    câu hỏi về tình trạng “Mình đã thành ra thế này bằng cách nào?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000004: locks: [''Giữ nguyên
    hô hiệu “Fairy 08”, định danh “Norden Control” và khẩu lệnh kết câu “Xác nhận.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000005: locks: [''Giữ điểm nhìn
    từ xa thu vào tự quan sát, đại từ tự quy chiếu “mình”, các thuật ngữ “sĩ quan
    ma pháp không quân”, “Đế quốc”, “quả cầu tính toán”, “thuật thức” (trong ngoặc
    kép), “pháp sư”, “kỹ thuật ma pháp”, và cụm “giải mã các trị số của thế giới”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000006: locks: [''Giữ đại từ
    “mình”, thuật ngữ “quan sát viên pháo binh”, “vùng trời đã định trước”, “tốc độ
    mặt đất vừa phải” và độ cao “sáu nghìn feet”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000007: locks: [''Giữ hô hiệu
    “Fairy 08”, định danh “Norden Control”, và cách trả lời vô tuyến tỉnh lược đại
    từ nhân xưng “Nghe rõ tín hiệu; theo dõi không gặp vấn đề gì.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003.xhtml/p000008: locks: [''Giữ các thuật
    ngữ “nhiệm vụ yểm trợ đường không”, “Đế quốc”, “Liên minh Entente”, “pháp sư quan
    sát cảnh giác”, “thuật thức bay”, “quả cầu tính toán”, tình thái suy đoán “hẳn
    trông nhỏ bé đến bất ngờ” và không chèn đại từ “cô”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000001: locks: [''Giữ sự phân
    biệt giữa đại từ nội tâm “mình” và tên gọi khách quan “Tanya”, dấu nhấn mạnh `*đúng
    là*` theo DEC-P01-002, chi tiết tuổi tác “đủ mười tuổi chưa”, thuật ngữ “đời trước”
    và “bộ tai nghe kèm micro thanh quản dùng trong hàng không”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000002: locks: [''Giữ sự phân
    tách giữa đại từ “Tôi” trong thoại vô tuyến (“Fairy 08, rõ. Tôi đã đến vùng trời
    làm nhiệm vụ. Nghe rõ tín hiệu,”) và đại từ “mình” trong độc thoại nội tâm; giữ
    chi tiết giọng âm cao như bị thứ gì đó ám và sự nhục nhã khi lưỡi không theo kịp
    suy nghĩ.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000003: locks: [''Giữ khẩu lệnh
    vô tuyến ngắn gọn, tỉnh lược đại từ “Norden Control, rõ. Tiến hành nhiệm vụ được
    giao.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000004: locks: [''Giữ chi tiết
    “giọng ngọng nghịu lơ lớ của một bé gái”, lập luận “năng khiếu ma pháp của một
    người có thể là điều kiện đủ để nhập ngũ”, các thuật ngữ “pháp sư không quân”,
    “Đế quốc”, “người giám hộ”, “quan sát viên pháo binh” và cấu trúc nhượng bộ “dù
    chỉ làm quan sát viên pháo binh”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000005: locks: [''Giữ hô hiệu
    “Fairy 08” và khẩu lệnh báo cáo lặp lại “Khu vực không phát hiện địch. Xin nhắc
    lại, khu vực không phát hiện địch.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000006: locks: [''Giữ nguyên
    cụm “tiểu đoàn bộ binh” (không tự ý sửa theo p000008), “Hô hiệu Goliath 07”, “bộ
    phận kiểm soát không phận”, “được bình định” và khẩu lệnh kết thúc “Hết.”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000007: locks: [''Giữ quan hệ
    nhân quả về vị thế địa chính trị của “Đế quốc” bị các cường quốc bao vây, nhu
    cầu bảo đảm sức mạnh quân sự phòng vệ lãnh thổ và nỗ lực đến mức điên cuồng của
    “Bộ Tổng Tham mưu” sẵn sàng khai thác bất kỳ ai trong tầm tay.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000008: locks: [''Giữ nguyên
    định danh tự giới thiệu “Tiểu đoàn Pháo binh Quân đoàn Lâm thời, hô hiệu Goliath
    07” (không hòa giải với p000006) và câu hỏi vô tuyến “Nghe rõ không?”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000009: locks: [''Giữ cách lặp
    danh từ “bé gái ấy” (tránh dùng đại từ “cô”), đại từ nội tâm “mình” và thuật ngữ
    “binh sĩ trẻ em” trong câu khẳng định theo nghĩa đen.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000010: locks: [''Giữ đại từ
    “Tôi” trong thoại liên lạc của Fairy 08 với Goliath 07, đại từ “Mình” trong câu
    độc thoại kế tiếp, thuật ngữ “giọng điệu công vụ”, tình thái suy đoán “Mình đoán...
    hẳn trông kỳ quái đến khó tin”, và nhận định lẽ thường về một quân đội đúng nghĩa
    gồm những người lính trưởng thành đúng nghĩa.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter003b.xhtml/p000011: locks: [''Giữ cấu trúc
    “Nhưng tín hiệu không chỉ có tiếng rè—nghe thấy giọng phụ nữ và trẻ em qua micro
    đã trở nên thường tình trong giới pháp sư”, chi tiết “ngoại lệ thực tế cho hầu
    như mọi chuyện”, và quan hệ nhân quả những ngày tháng khắc nghiệt trong quân ngũ
    bào mòn những người tử tế khiến cảm giác khó chịu ban đầu phai nhạt.'']'
  non_canon: true
