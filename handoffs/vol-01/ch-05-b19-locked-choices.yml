choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000477
  kind: terminology_and_voice
  value: 'choices=["Đại từ (DEC-P01-001): quy chiếu Tanya trong trần thuật ngôi thứ
    ba bằng ''Nó'' / ''nó''.", "Thuật ngữ, phủ định & tình thái: khóa ''đạo quân phía
    tây và đạo quân phía bắc'', ''đơn ứng tuyển'', ''sai sót hành chính'', ''thông
    báo tuyển người tình nguyện''; bảo toàn mệnh đề nhượng bộ có phủ định (''mặc dù
    nó đã được chỉ thị chỉ chọn những ứng viên từ các lực lượng hiện không tham chiến'')
    và mức độ phỏng đoán (''có lẽ'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000478
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ ''nó'' cho Tanya; khóa ''đơn ứng tuyển'',
    ''vô hiệu vì lý do thủ tục hành chính'' và ''phát một thông báo mới''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000479
  kind: terminology_and_voice
  value: 'choices=["Độc thoại thành tiếng & quân hàm: tự xưng ''mình'' khi Tanya lẩm
    bẩm một mình trong văn phòng; khóa danh từ chung viết thường ''chuẩn tướng'' (chỉ
    Chuẩn tướng von Zettour)."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000480
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thành ngữ & thuật ngữ: quy chiếu Tanya bằng ''Nó'' / ''nó''
    kết hợp phản thân ''mình''; khóa thành ngữ ''đếm cua trong lỗ'' và cụm ''sai sót
    hành chính'' đồng bộ với p000477."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000481
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & đại từ nội tâm (DEC-P01-001):
    bảo toàn ''*...*'' bao trọn toàn đoạn tương ứng 1:1 với thẻ <html:em> trong nguồn;
    chuyển đại từ tự vấn sang ''Mình'' và giữ phủ định ''chưa suy tính thấu đáo chuyện
    này''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000482
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giả định thời gian: giữ ''nó'' cho Tanya;
    khóa ''tiềm lực tác chiến'', ''đơn ứng tuyển'', ''câu giờ'', ''núi giấy tờ'',
    ''kén cá chọn canh''; bảo toàn giả định phủ định (''giả định rằng sẽ chẳng có
    ai hưởng ứng''), mục đích dự kiến trong quá khứ (''đáng lẽ sẽ giúp nó câu giờ'')
    và điều kiện (''nếu cứ quá kén cá chọn canh'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Phân biệt điểm nhìn đại từ (DEC-P01-001) & không tự thêm nhấn
    mạnh (DEC-P01-002): bảo toàn sự đan xen ngôi tự sự ngay trong đoạn—câu 1 và câu
    3 ở ngôi thứ ba dùng ''Tanya'' và ''nó'' kèm phản thân ''mình'', còn câu 2 và
    các câu 4–5 ở ngôi thứ nhất độc thoại nội tâm dùng ''mình'' / ''Mình'' mà không
    thêm dấu ''*...*''; quy chiếu các ứng viên bằng ''họ''.", "Thuật ngữ, dấu câu
    & phủ định: khóa ''tấm lá chắn thịt vững chắc'', ''cấp dưới'', ''đơn ứng tuyển'',
    dấu ngoặc kép ''“sàng lọc khắt khe”'', dấu gạch ngang dài và ''những việc thiện
    âm thầm''; bảo toàn đầy đủ các cấu trúc phủ định (''vờ như không nhìn thấy'''
- segment_id: YS-LN01/Text/chapter011.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=["Phân biệt điểm nhìn đại từ (DEC-P01-001) & tình thái: câu 1 ở
    ngôi thứ nhất độc thoại nội tâm dùng ''mình'', các câu 2, 4, 5 ở ngôi thứ ba dùng
    ''Nó'' / ''nó''; bảo toàn điều kiện ''Nếu gặp may'', giả định ''Tệ nhất thì''
    và câu phủ định giảm nhẹ cuối đoạn ''Cách này cũng chẳng tệ chút nào''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm (DEC-P01-001) & thuật ngữ: giữ ''mình'' / ''Mình''
    xuyên suốt đoạn độc thoại nội tâm không đánh dấu nghiêng; khóa ''kiểm soát thiệt
    hại'' và ''quyết định ngu xuẩn nào mang hơi hướng Concorde''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Phân biệt điểm nhìn đại từ (DEC-P01-001), thuật ngữ & phủ định:
    giữ ''nó'' ở câu 2 (trần thuật ngôi thứ ba) và ''Mình'' ở câu 3 (độc thoại nội
    tâm ngôi thứ nhất); khóa ''Kiểm soát thiệt hại'', dấu gạch ngang dài, ''không
    gây sóng gió'', ''sẽ chẳng có vấn đề gì cả'' và ''tà thần''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái kết cảnh: khóa câu nhận xét ''Đó là kiểu ý tưởng
    thường nảy ra trong đầu một kẻ đang hơi hoảng loạn.''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề địa điểm chuyển cảnh: khóa ''CƠ QUAN TRỰC THUỘC BỘ TỔNG
    THAM MƯU QUÂN ĐỘI ĐẾ QUỐC, PHÒNG TIẾP KHÁCH SỐ 7''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tên riêng & điều lệnh trình diện: khóa ''“Trung úy Aisha
    Schulbertz, báo cáo trình diện nhận nhiệm vụ!”''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tên riêng & điều lệnh trình diện: khóa ''“Trung úy Crane
    Barhalm, báo cáo trình diện nhận nhiệm vụ!”''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: khóa ''thủ đô'', ''đạo quân phía đông'', ''Ủy
    ban Thành lập Đơn vị 601'', ''đơn vị pháp sư tinh nhuệ'', ''quân hàm''; quy chiếu
    hai sĩ quan ứng viên bằng ''họ'' kèm phản thân ''mình''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại, tên riêng & chức vụ (Turner -> hai trung úy): giữ
    cặp xưng hô ''Tôi – hai anh''; khóa ''Đại tá Gregorio von Turner, người đứng đầu
    Ủy ban Thành lập Đơn vị 601''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=["Đại từ, cấp bậc danh từ chung & so sánh giả định: quy chiếu Đại
    tá von Turner bằng ''Ông'' / ''ông'', quy chiếu hai ứng viên bằng ''họ'' và ''hai
    viên trung úy'' (viết thường); bảo toàn mệnh đề so sánh giả định ''như thể có
    thể nhìn thấu tận tâm can họ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Đại từ, cấp bậc danh từ chung & so sánh giả định: giữ ''vị đại
    tá'' (viết thường), ''ông'' và ''họ''; bảo toàn mệnh đề ''như thể đã chấp thuận''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & nghĩa (Turner -> hai trung úy): giữ ''Tôi'' và
    ''cả hai anh'' đồng bộ với p000492; khóa ''lịch trình hôm nay'' và ''sự thay đổi
    kế hoạch vào phút chót''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: khóa ''học viện'' và ''việc thay đổi lịch trình và
    mục tiêu'' đồng bộ với p000495."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002), cấp bậc & phủ định mục đích:
    khóa ''*Chắc chắn họ đang tìm kiếm sự linh hoạt.*'' chỉ ở câu thứ nhất tương ứng
    1:1 với thẻ <html:em> trong nguồn, giữ câu thứ hai nằm ngoài dấu ''*...*''; giữ
    ''hai viên trung úy'', ''vị đại tá'' và mệnh đề mục đích phủ định ''để không bỏ
    sót một lời nào''."]'
