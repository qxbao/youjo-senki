choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & thuật ngữ (Turner -> hai trung úy): khóa cách
    gọi trung tính trang trọng ''hai người'' / ''Cả hai người'' (phù hợp với ngữ cảnh
    trong cặp ứng viên có nữ sĩ quan Aisha Schulbertz được xác nhận ở p000507, p000510);
    khóa ''Bãi tập số 7'', ''1400 giờ'', ''sở chỉ huy của Đơn vị Không chiến số 6''
    và cụm kết câu ''ngay tức khắc''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002), đại từ & tình thái: khóa ''*Ngay
    tức khắc.*'' chỉ ở cụm đầu đoạn tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ
    hai câu sau nằm ngoài dấu ''*...*''; quy chiếu hai trung úy bằng ''Họ'' / ''họ''
    và bảo toàn suy luận ''Chắc hẳn đây là một bài kiểm tra...''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & thuật ngữ (Turner -> hai trung úy): giữ ''cả hai
    người'' đồng bộ với p000498; khóa ''giữ bí mật về quá trình tuyển chọn''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002), thuật ngữ & tình thái: khóa
    ''*Nghĩa vụ giữ bí mật ư, hợp lý đấy*'' tương ứng 1:1 với thẻ <html:em> trong
    nguồn, đặt dấu phẩy và phần trần thuật nằm ngoài dấu ''*...*''; khóa ''giữ bí
    mật'', ''vùng cấm bay'', ''xe quân sự'', dấu gạch ngang dài, ''Bộ Tư lệnh'' và
    ''quân cảnh''; bảo toàn tình thái ''có lẽ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & điều kiện (Turner -> hai trung úy): giữ cặp ''Tôi
    – hai người'' đồng bộ với p000498, p000500; bảo toàn mệnh đề điều kiện ''nếu có
    bất kỳ nghi vấn nào về khả năng giữ bí mật của hai người, hai người sẽ lập tức
    bị trả về đơn vị cũ kèm theo một lời ghi chú trong hồ sơ đấy''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Thoại điều lệnh & đại từ: khóa ''“Rõ!” cả hai đồng thanh đáp.''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định giảm nhẹ: quy chiếu Đại tá von Turner bằng ''Ông''
    và hai trung úy bằng ''họ'' / ''Cả hai''; bảo toàn cấu trúc ''hầu như chẳng cần
    phải cảnh báo họ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại đồng cấp & thuật ngữ (Barhalm -> Schulbertz): gọi
    đồng cấp nữ là ''cô''; khóa ''Sở chỉ huy của Đơn vị Không chiến số 6'' đồng bộ
    với p000498."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại đồng cấp, thuật ngữ & tình thái (Schulbertz -> Barhalm):
    tự xưng ''Tôi''; bảo toàn mức độ chắc chắn ''khá chắc'' và khóa ''căn cứ không
    quân Auksburg''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Đại từ (DEC-P01-001), tên riêng, thuật ngữ & phủ định: giữ ''Barhalm'',
    ''Schulbertz'' và quy chiếu nữ Trung úy Schulbertz bằng ''cô''; khóa ''Căn cứ
    không quân Auksburg'', ''thủ đô đế quốc'', ''đơn vị vận tải'', ''đơn vị tinh nhuệ'',
    ''không quân'' và ''giữ bí mật''; bảo toàn phủ định ''chưa từng nghe nói tới''
    cùng tình thái ''Chắc chắn''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại, câu hỏi & thuật ngữ: giữ đại từ bao gộp ''Chúng
    ta'' / ''chúng ta'', khóa ''trưng dụng một chiếc xe quân sự'' và bảo toàn đủ hai
    câu hỏi trực tiếp cùng câu băn khoăn cuối đoạn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc danh từ chung, thuật ngữ, phủ định & điều kiện: khóa ''hai
    viên trung úy'' (viết thường), ''xe quân sự'', ''đạo quân phía đông'', ''điều
    khoản giữ bí mật'' và ''taxi dân sự''; bảo toàn phủ định tuyệt đối ''hoàn toàn
    không có thẩm quyền ra lệnh cho các đơn vị khác'' và câu điều kiện giả định ''nếu
    họ xuất hiện tại căn cứ..., chắc chắn họ sẽ bị đuổi về ngay''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: giữ ''chúng ta'' trong thoại và
    ''Schulbertz'' / ''Cô'' trong trần thuật; khóa ''Đơn vị quân cảnh trực thuộc Bộ
    Tổng Tham mưu'', ''một quân cảnh'', ''viên quân cảnh'' và ''Bộ Tổng Tham mưu'';
    bảo toàn phủ định ''cũng sẽ chẳng có vấn đề gì về chuyện giữ bí mật cả''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & cấp bậc (Trung úy Schulbertz -> Trung sĩ quân
    cảnh): gọi cấp bậc ''Trung sĩ'' và dùng cặp xưng hô lịch sự ''tôi – anh''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại, cấp bậc & phủ định (Trung sĩ quân cảnh -> Trung
    úy Schulbertz): khóa ''thưa Trung úy'' kèm kính ngữ ''ạ'' và câu phủ định ''Không
    phiền chút nào đâu ạ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Phân biệt chủ thể đại từ: quy chiếu Schulbertz bằng ''cô'', hai
    trung úy ứng viên bằng ''hai người'' / ''họ'', và nhóm quân cảnh bằng ''Các quân
    cảnh'' / ''tất cả bọn họ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Nghĩa, thời gian & dấu câu: bảo toàn quan hệ giữa ''những người
    đã bị mắc lừa và sắp bị chở bằng máy bay trả về căn cứ của mình'', dấu gạch ngang
    dài và mệnh đề tương phản ở vế sau."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & đại từ: khóa ''*Chà, nhiều
    thật đấy.*'' chỉ ở câu nội tâm cuối đoạn tương ứng 1:1 với thẻ <html:em> trong
    nguồn, giữ phần thoại và dẫn thoại nằm ngoài dấu ''*...*''; quy chiếu viên trung
    sĩ quân cảnh bằng ''anh ta''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại, câu hỏi & tình thái: giữ tự xưng ''tôi'', câu hỏi
    về số cặp còn lại trong ngày và mức độ không chắc chắn ''Hình như tôi nghe nói
    là còn năm cặp''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & giả định quá khứ: khóa dấu gạch ngang dài,
    ''Cấp trên'' và ''người chấm thi''; bảo toàn cấu trúc giả định trái thực tế ''Nếu
    chỉ có một hay hai trường hợp thì họ còn có thể quy cho là do vận rủi, nhưng với
    số lượng nhiều đến mức này, ý đồ của người chấm thi đã lộ rõ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & nghĩa: giữ tự xưng ''Tôi'' và sắc thái tiếc nuối
    ''Tôi cứ tưởng ít nhất cũng phải có bốn cặp vượt qua chứ''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ phủ định, tình thái & thuật ngữ: bảo toàn câu hỏi
    phủ định ''Bộ họ thực sự không nhận ra là mình đang bị lừa và bị trả về đơn vị
    hay sao?'', mức độ chắc chắn ''chắc chắn'', ''máy bay vận tải'', địa danh ''Auksburg''
    và hướng ''quay về phương đông''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ phiên hiệu: khóa ''Trung đội 3'' đồng bộ với p000521."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002), thuật ngữ phiên hiệu & phủ định:
    khóa ''*Làm ơn đi, ai đó vượt qua giùm cái…*'' chỉ ở câu cầu khẩn nội tâm cuối
    đoạn tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ ba câu trần thuật đầu nằm
    ngoài dấu ''*...*''; khóa ''Trung đội 3'', ''Trung đội 1'', ''Trung đội 2'' và
    bảo toàn phủ định ''sẽ chẳng có ai vượt qua được''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc phủ định: khóa ''đám quân cảnh'' và ''Thượng
    đế''; bảo toàn phủ định ''Họ vốn chẳng phải những kẻ sùng đạo gì cho cam'' và
    cấu trúc so sánh phủ định kết đoạn ''Chẳng có con chiên nào ngoan đạo bằng một
    con bạc''."]'
