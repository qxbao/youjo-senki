source_sha256: 7698e1b80fc5d560020b8934f6243b3b7be1be9c911668455a069f857f3da528
source_package_sha256: ccec5b106788c0f9f4a4bf487d897d9749927159f0c6d39b9dc8f667b0d84087
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 38
segment_id_start: YS-LN01/Text/chapter007b.xhtml/p000278
segment_id_end: YS-LN01/Text/chapter007b.xhtml/p000315
choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000278
  kind: terminology_and_voice
  value: locks=['Giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa cùng các thuật
    ngữ “Quân đội Cộng hòa”, “kỷ luật hỏa lực”, “sự vượt trội đã biết của các pháp
    sư Đế quốc” và “những pháp sư địch quá tự tin vốn có xu hướng tách lẻ ra”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000279
  kind: terminology_and_voice
  value: locks=['Giữ mệnh đề nhượng bộ với thuật ngữ “học thuyết lấy ưu thế về quân
    số làm tiền đề”, “Quân đội Cộng hòa” và mệnh đề phủ định tuyệt đối ở câu 2 (“trên
    đời này chẳng có pháp sư nào có thể trụ lại trên không một khi lưới đạn màn đã
    khai màn”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000280
  kind: terminology_and_voice
  value: 'locks=[''Giữ các thuật ngữ đồng bộ với ch-03-b27/b28/b29: “Ác quỷ”, “các
    đòn kích nổ không gian”, “giai đoạn ngắm bắn ban đầu” và tình thái suy đoán “Nhiều
    khả năng là sau khi phát hiện đòn tấn công ngay trong giai đoạn ngắm bắn ban đầu
    và thoát khỏi đó chỉ trong tích tắc.”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000281
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “anh”, các thuật ngữ “các động tác cơ động né tránh”,
    “pháp sư này”, “mọi đòn tấn công ma thuật dẫn đường” và bảo toàn trọn vẹn hai
    câu hỏi trực tiếp (gồm câu hỏi phủ định suy luận ở câu 2).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000282
  kind: terminology_and_voice
  value: 'locks=[''Giữ chuỗi thuật ngữ đồng bộ với ch-03-b28/b29/b33: “Nguyên lý cơ
    bản của hỏa lực bắn có kỷ luật”, “một loạt đạn dẫn đường quy mô lớn”, “bắn trúng
    trực diện”, “ước tính vận tốc của đối thủ”, “các thuật thức nổ” và “dọc theo đường
    bay để đón lõng”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000283
  kind: terminology_and_voice
  value: locks=['Giữ câu điều kiện phủ định với thuật ngữ “khóa mục tiêu hay đo đạc
    thông số của đối thủ”, dấu gạch ngang dài ở câu 2 và sắc thái dè dặt mức độ ở
    cuối câu 3 (“lợi ích của việc chiến đấu theo nhóm sẽ giảm đi rất nhiều, dù chưa
    phải là bằng không”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000284
  kind: terminology_and_voice
  value: 'locks=[''Giữ cấu trúc tăng tiến “Không chỉ giá trị mana quan sát được từ
    quả cầu tính toán của địch đã vượt quá xa giới hạn, mà lượng mana đó còn đang
    thu hẹp lại—hội tụ—và khuếch đại.” và câu hỏi cảm thán với thuật ngữ đồng bộ ch-02-b15:
    “Những vụ va chạm mana do giao thoa phức hợp chồng chập kích hoạt đang tạo ra…
    nhiều quầng sáng ư?!”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000285
  kind: terminology_and_voice
  value: 'locks=[''Giữ cấu trúc nhấn mạnh số lượng: “Chỉ một pháp sư Đế quốc duy nhất
    mà đã huy động được lượng mana ngang ngửa vài người thi triển cộng lại.”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000286
  kind: terminology_and_voice
  value: 'locks=[''Giữ câu báo cáo với thuật ngữ đồng bộ ch-02-b15/b19: ““Thiết bị
    quan sát cũng trả về một giá trị vượt ngoài thang đo.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000287
  kind: terminology_and_voice
  value: 'locks=[''Giữ nguyên tiếng thốt lên và câu điều kiện bỏ lửng bằng dấu gạch
    ngang dài: ““Phi lý! Nếu đúng là như vậy—””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000288
  kind: terminology_and_voice
  value: locks=['Giữ đại từ “anh ta”, thuật ngữ “một phản ứng cố định mana” (đồng
    bộ ch-02-b15 và ch-03-b08/b09) và mệnh đề tương phản ở câu 3 (“một hiện tượng
    mà các pháp sư và các quốc gia từng nỗ lực đạt tới nhưng rốt cuộc đã phải từ bỏ”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000289
  kind: terminology_and_voice
  value: 'locks=[''Giữ các thuật ngữ đồng bộ ch-02-b11/b15: “một hiện tượng mana được
    thi triển”, “các tọa độ không gian”, “sự cố định” cùng hai mệnh đề phủ định tuyệt
    đối ở câu 1 và câu 3.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000290
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu và hai câu phủ định cảm thán: ““…Không
    thể thế được! Bất khả thi!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000291
  kind: terminology_and_voice
  value: locks=['Giữ chức danh “Sĩ quan công nghệ”, đại từ “anh ta”, thuật ngữ “công
    nghệ pháp sư” và cấu trúc “Đây không còn là công nghệ pháp sư nữa mà là thứ gì
    đó bước ra từ cõi thần thoại.”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000292
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu dịch lời tuyên cáo của Tanya đã khóa ở ch-03-b29
    p000176: ““Nếu các ngươi đến để khinh nhờn Tổ quốc, chúng ta sẽ cầu nguyện lên
    Thượng đế.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000293
  kind: terminology_and_voice
  value: locks=['Giữ các cụm “Bóng hình được phóng cận cảnh”, “mờ nhòe và đầy nhiễu
    hạt” và lưu ý từ “nó” ở câu 2 chỉ quy chiếu danh từ vô tri “Hình ảnh”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000294
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu và câu cảm thán làm bước ngoặt nhận diện
    diện mạo mục tiêu trên màn hình: ““…Đó là một đứa trẻ!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000295
  kind: terminology_and_voice
  value: locks=['Giữ cách quy chiếu “Vị pháp sư ấy” / “cô bé” theo đúng điểm nhìn
    của các sĩ quan Cộng hòa sau khi thấy đứa trẻ trên màn hình (tuân thủ giới hạn
    chủ thể của DEC-P01-001), cùng các cụm “tuyên cáo sự hủy diệt và tận diệt”, “chỉ
    số đo mana” và “điềm báo của sự hủy diệt”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000296
  kind: terminology_and_voice
  value: locks=['Theo DEC-P01-002, chỉ đánh dấu nhấn mạnh Markdown cho đúng câu hỏi
    nội tâm giả định hai lựa chọn ở câu 1 (`*Giả sử vị thần mà ngươi cầu nguyện có
    tồn tại—thì đó là ác quỷ hay là vị thần hủy diệt đây?*`), giữ câu 2 với danh xưng
    “Chúa” nằm ngoài dấu `*`.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000297
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu dịch lời cầu nguyện của Tanya đã khóa ở ch-03-b29
    p000178: ““Hỡi Chúa, xin hãy cứu lấy Tổ quốc. Hỡi Chúa, xin hãy ban cho con sức
    mạnh để đánh bại kẻ thù của đất nước con.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000298
  kind: terminology_and_voice
  value: locks=['Giữ cách quy chiếu “cô bé” (đồng bộ p000295), câu hỏi nghi vấn “Lẽ
    nào cô bé thực sự là một pháp sư địch ư?” và danh xưng “Thượng đế”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000299
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu dịch lời cầu nguyện của Tanya đã khóa ở ch-03-b30
    p000186: ““Xin hãy cứu chúng con khỏi cuộc xâm lược của lũ ngoại đạo. Hỡi Thượng
    đế, xin hãy ban cho con sức mạnh để tiêu diệt kẻ thù của chúng con.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000300
  kind: terminology_and_voice
  value: locks=['Theo DEC-P01-002, chỉ đánh dấu nhấn mạnh Markdown cho đúng câu hỏi
    phủ định với đại từ “chúng tôi” ở vế đầu (`*Chẳng lẽ chúng tôi thực sự không được
    phép tồn tại sao?*`), giữ phần trần thuật còn lại và cách quy chiếu “cô bé” nằm
    ngoài dấu `*`.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000301
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu đầu thông điệp cảnh báo của Tanya đã khóa
    ở ch-03-b30 p000195: ““Chú ý! Các người đang xâm phạm lãnh thổ của Đế quốc.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000302
  kind: terminology_and_voice
  value: locks=['Giữ cách quy chiếu “Cô bé” và các thuật ngữ “một vu nữ đang truyền
    đạt thông điệp thần thánh”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000303
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu thứ hai trong thông điệp của Tanya đã khóa
    ở ch-03-b30 p000195: ““Chúng tôi sẽ dốc toàn lực để bảo vệ Tổ quốc của mình, bởi
    phía sau chúng tôi là những người dân mà chúng tôi phải bảo vệ.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000304
  kind: terminology_and_voice
  value: locks=['Giữ cách quy chiếu “cô bé” xuyên suốt ba câu (từ “mình” ở câu 3 chỉ
    là đại từ phản thân phụ thuộc vào “cô bé”) cùng các cụm “tinh thần trách nhiệm”,
    “phòng vệ là bổn phận duy nhất của cô bé” và “khát khao cháy bỏng muốn bảo vệ
    những người ở phía sau mình của cô bé”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000305
  kind: terminology_and_voice
  value: 'locks=[''Giữ cấu trúc nhấn mạnh mục đích và cách quy chiếu “cô bé”: “Chính
    để hoàn thành bổn phận ấy mà cô bé đã đứng chắn trước mặt họ.”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000306
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu hỏi chất vấn của Tanya đã khóa ở ch-03-b30
    p000197: ““Hãy trả lời tôi điều này. Tại sao các người lại muốn xâm lược Đế quốc,
    quê hương của chúng tôi?””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000307
  kind: terminology_and_voice
  value: locks=['Giữ tình thái phỏng đoán “Có lẽ Đại đội 106 đã đánh hơi thấy tai
    họa;”, cách quy chiếu “cô bé” và cụm “cố ngăn không cho cô bé tiếp tục thi triển
    thuật thức dù chỉ thêm một chút thời gian”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000308
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu dịch lời cầu nguyện của Tanya đã khóa ở ch-03-b31
    p000206: ““Hỡi các thánh đồ, hãy tin vào phước lành của Chúa chúng ta. Hãy để
    chúng ta không biết đến sợ hãi.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000309
  kind: terminology_and_voice
  value: locks=['Giữ mệnh đề phủ định “Số phận đã không đứng về phía họ.” và câu giả
    định ở câu 3 với danh xưng “Thượng đế”, đại từ quy chiếu “ngài” và “cô bé” (“Giả
    sử Thượng đế có tồn tại, thì ngài đang mỉm cười với cô bé.”).']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000310
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu dịch lời hô gọi của Tanya đã khóa ở ch-03-b31
    p000209: ““Đừng than khóc cho số phận của mình. Ôi, Chúa đã không ruồng bỏ chúng
    ta!””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000311
  kind: terminology_and_voice
  value: 'locks=[''Giữ các thuật ngữ đồng bộ với p000284, p000286 và ch-03-b32 p000239:
    “Lượng mana đang hội tụ”, “thiết bị quan sát”, “nhiễu sóng” và “lượng mana tích
    tụ đã đủ lớn để làm chấn động cả không gian”.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000312
  kind: terminology_and_voice
  value: 'locks=[''Giữ đồng bộ 100% câu kết lời cầu nguyện của Tanya đã khóa ở ch-03-b31
    p000213: ““Ở điểm tận cùng xa xôi của cuộc hành trình, hãy để chúng ta vươn tới
    miền đất hứa.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000313
  kind: terminology_and_voice
  value: locks=['Giữ cấu trúc song hành “vừa là chiếc chìa khóa, vừa là chiếc hộp
    Pandora đã mở tung”, cách quy chiếu “cô bé”, cùng các cụm “màn hình phát ra một
    chớp sáng kinh hoàng”, “quả cầu tính toán bị hư hại” và “đoạn video phụt tắt”.']
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000314
  kind: terminology_and_voice
  value: 'locks=[''Giữ dấu chấm lửng mở đầu, danh xưng “Thượng đế nhân từ” và đại
    từ “chúng con” trong lời cầu xin: ““…Lạy Thượng đế nhân từ, xin hãy thương xót
    linh hồn chúng con.””.'']'
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000315
  kind: terminology_and_voice
  value: 'locks=[''Theo DEC-P01-002, bảo toàn nhấn mạnh Markdown bao trọn câu hỏi
    nội tâm khép lại Chương 3, giữ dấu chấm lửng ngập ngừng, danh xưng “Thượng đế”
    và đại từ “ngài”: `*Hỡi Thượng đế, đây… có phải là điều ngài mong muốn không?*`.'']'
