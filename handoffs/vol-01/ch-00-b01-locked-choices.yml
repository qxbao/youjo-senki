choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000001: locks: [''Giữ mốc thời
    gian “18 tháng Bảy, năm Thống nhất 1914” và địa điểm “đâu đó tại Berun, kinh đô
    Đế quốc”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000002: locks: [''Giữ đại từ
    nội tâm tự quy chiếu “mình” theo DEC-P01-001, dấu nhấn mạnh chữ nghiêng `*...*`
    cho toàn bộ chuỗi câu hỏi nội tâm cuối đoạn theo DEC-P01-002, và giữ nguyên độ
    mở của câu hỏi về điều bị quên.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000003: locks: [''Giữ đại từ
    trần thuật “nó” kèm dấu nhấn mạnh `*nó*` ở hai vị trí tương ứng với nguồn theo
    DEC-P01-001 và DEC-P01-002, cùng câu phủ định cuối đoạn về việc không có thời
    gian để nhận ra.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000004: locks: [''Giữ đại từ
    trần thuật `*nó*` ở hai vị trí nhấn mạnh, sự đối lập “xa lạ mà một thời quen thuộc”
    và quan hệ nhân quả không đủ bình tĩnh để suy nghĩ thấu đáo nên chỉ có thể vùng
    vẫy.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000005: locks: [''Giữ cấu trúc
    phủ định “chẳng còn cách nào khác ngoài...”, đại từ nhấn mạnh `*nó*` khi mất ý
    thức, và sự tách biệt giữa cơ thể nức nở theo bản năng với cảm xúc của một con
    người đã lâu không khóc.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000006: locks: [''Giữ đại từ
    nhấn mạnh `*nó*` khi tỉnh lại nhìn bầu trời xám xịt, câu hỏi tình thái suy đoán
    “Hay có lẽ do mắt nó nhìn mờ?” và phép so sánh nhìn qua cặp kính sai độ.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000007: locks: [''Giữ cấu trúc
    nhượng bộ, đại từ nhấn mạnh “ngay cả *nó*” và câu phủ định khả năng nhận diện
    cả những hình dạng đại khái.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000008: locks: [''Giữ mốc “Sau
    gần ba năm theo thời gian khách quan” và đại từ trần thuật nhấn mạnh `*nó*` theo
    DEC-P01-001 và DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000009: locks: [''Giữ câu hỏi
    nội tâm in nghiêng `*Cái gì đây? Chuyện gì đã xảy ra với mình?*` (dùng “mình”,
    giữ nguyên độ mở của câu hỏi về tình trạng), thuật ngữ “Vật chứa này”, và hai
    đại từ trần thuật nhấn mạnh `*nó*` ở câu sau theo DEC-P01-001 và DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000010: locks: [''Giữ tình thái
    “Có lẽ... nhưng... chắc chắn có”, chuẩn mực bảo vệ và trao cơ hội bình đẳng thay
    vì khinh rẻ trẻ nhỏ, cùng đại từ nhấn mạnh `*nó*` và `*mình*` (quy chiếu phản
    thân cho chủ ngữ `*nó*`) đúng vị trí nhấn mạnh của nguồn.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000011: locks: [''Giữ đại từ
    trần thuật `*nó*` / “nó”, giả định quá khứ “đáng lẽ lúc đó nó phải ở sân ga tuyến
    Yamanote”, các danh từ “nữ tu”, “bảo mẫu”, và giả định điều kiện “Nếu đây là bệnh
    viện, có thể suy đoán hợp lý rằng đã xảy ra một tai nạn nào đó”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000012: locks: [''Giữ hai đại
    từ nhấn mạnh `*nó*`, danh từ “nữ tu”, chi tiết “những ngọn đèn khí đã lỗi thời”
    và mệnh đề rào đón “trừ phi sự thật khác với vẻ bề ngoài”.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000013: locks: [''Giữ cách gọi
    “Tanya cưng ơi” (không suy diễn quan hệ thân thuộc theo DEC-P01-001) và giữ nguyên
    chỉ dẫn phát âm cụ thể “nói ‘a’ nào” theo style-guide.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000014: locks: [''Giữ đại từ
    trần thuật nhấn mạnh `*nó*`, mốc “năm 2013”, và chuỗi câu hỏi nội tâm in nghiêng
    `*Họ là người Mennonite hay Amish? Nhưng… tại sao? Mình đang làm gì ở đây với
    họ?*` dùng đại từ “Mình” theo DEC-P01-001 và DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000015: locks: [''Giữ lời gọi
    trực tiếp “Tanya cưng ơi. Tanya!” nhất quán với p000013.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000016: locks: [''Giữ nguyên
    hai câu trần thuật ngắn gọn về tình cảnh khó nắm bắt và nỗi bối rối ngày càng
    tăng.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000017: locks: [''Giữ cách gọi
    “cưng”, đại từ tự xưng trung tính “tôi” của nữ tu và tên “Tanya” trong câu hỏi
    dỗ dành.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000018: locks: [''Giữ câu nội
    tâm in nghiêng `*Mình không hiểu.*` (dùng “Mình”), đại từ trần thuật nhấn mạnh
    `*nó*` ở hai câu tiếp theo, giả định quá khứ phủ định tuyệt đối “Dù có để ý đi
    nữa, *nó* cũng chẳng đời nào nghĩ đến chuyện ăn thứ thức ăn được đưa ra”, và suy
    đoán chiếc thìa dành cho Tanya kia.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000019: locks: [''Giữ danh từ
    “nữ tu” (không tự gán đại từ chỉ tuổi/cấp bậc tu viện), chi tiết nụ cười ngọt
    ngào nhưng nghiêm khắc không cho phép cãi lời, và đại từ nhấn mạnh `*nó*` ở cuối
    câu.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000020: locks: [''Giữ cách gọi
    “Cưng” nhất quán với p000013/p000015/p000017 và lời nhắc không được kén ăn, yêu
    cầu há miệng.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000021: locks: [''Giữ chi tiết
    thìa rau củ hầm nhừ thành dạng sệt và quan hệ nhân quả một thìa ấy khiến sự thật
    ập thẳng đến Tanya vốn cho đến lúc đó vẫn chưa hiểu gì.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000022: locks: [''Giữ danh từ
    “nữ tu”, đại từ nhấn mạnh `*nó*` ở câu thứ hai, và cấu trúc chuyển đổi điểm nhìn
    kèm ranh giới chữ nghiêng chính xác ở câu kết `*Nói cách khác,* nó *—mình—là Tanya.*`
    theo DEC-P01-001 và DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN01/Text/chapter001.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN01/Text/chapter001.xhtml/p000023: locks: [''Giữ đại từ
    trần thuật nhấn mạnh `*nó*` và tiếng kêu nội tâm in nghiêng `*Tại sao?*` ở cuối
    đoạn theo DEC-P01-002.'']'
  non_canon: true
