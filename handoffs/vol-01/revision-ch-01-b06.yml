instructions:
- 'Resolve four moderate findings. M1 p000076: use Nordland as it appears in the source
  heading; do not substitute Norden or assert equivalence. M2 p000084: replace “đường
  ranh giả” with “một dạng biên giới không chính thức” or another low-assumption wording
  retaining “biên giới”; remove the added “thực chất”. M3 p000089: use “quyền cai
  trị” for dominion, retaining “chủ quyền” for sovereignty at p000091. M4 p000094:
  remove added military “hành quân”; render the hiking euphemism as “cuộc đi bộ đường
  dài có tổ chức chặt chẽ” (or equivalent), consistent with p000090/p000092.'
- 'Apply clear minor corrections supported by Claude: p000077 “hỏi trời cao”, “sạm
  nắng vì tuyết”, “bộ binh không giáp”; p000078 restore distinction from being misinformed
  rather than not informed; p000084 “cứ thản nhiên bước qua”, “vốn luôn cần mẫn”,
  “lẽ ra phải lường trước”; p000086 “khoảng cách giữa các tầng lớp”; p000088 include
  “sai lầm” and use “chửi rủa”; p000089 “vì nể/chiếu cố” and keep actor ambiguity;
  p000091 retain “thua cay cú” and strengthen “dreamers” as suggested; p000094 render
  “salary thief” as “kẻ ăn hại lương” and “appallingly thoughtless” without overstatement;
  p000097 use “vượt qua biên giới”; p000098 provisionally use “Quân đội Đế quốc”,
  lowercase “bộ phận kiểm soát không phận”, and “Trung tâm Điều hành Tác chiến”; p000099
  prefer “kênh liên lạc”; p000100 avoid “cựu binh” for an active veteran. Keep other
  uncertain items provisional.'
