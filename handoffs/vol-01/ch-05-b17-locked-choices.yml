choices:
- segment_id: YS-LN01/Text/chapter011.xhtml/p000439
  kind: terminology_and_voice
  value: 'choices=["Định dạng & thuật ngữ: viết hoa toàn bộ tiêu đề địa điểm mở cảnh
    mới ''TỔNG HÀNH DINH BỘ TỔNG THAM MƯU, BAN THÀNH LẬP ĐƠN VỊ''; không dùng ''*...*''
    theo DEC-P01-002."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000440
  kind: terminology_and_voice
  value: 'choices=["Định dạng biển hiệu (DEC-P01-002): biểu diễn cụm chữ in hoa nhỏ
    (small-caps) bằng chữ in hoa trong ngoặc kép “VĂN PHÒNG BỘ TỔNG THAM MƯU, CỤC
    QUÂN VỤ, BAN THÀNH LẬP ĐƠN VỊ, ỦY BAN THÀNH LẬP ĐƠN VỊ 601”, không dùng ''*...*''
    vì nguồn không có thẻ <html:em> hay <html:i>.", "Cấp bậc & tên riêng: khóa ''Đại
    úy Tanya von Degurechaff''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000441
  kind: terminology_and_voice
  value: 'choices=["Đại từ (DEC-P01-001): quy chiếu Tanya trong trần thuật bằng ''nó''
    kết hợp phản thân ''mình''.", "Giả định & thời gian: bảo toàn cả hai cấu trúc
    điều kiện giả định trái thực tế ở câu hai, gồm giả định hiện tại (''có lẽ còn
    nghe có lý đôi chút nếu nó đang tuyển mộ sinh viên mới tốt nghiệp'') và giả định
    quá khứ (''nên nếu có đợt tuyển dụng rộng rãi dành cho cựu học viên mới ra trường
    thì ngay cả nó cũng đã cân nhắc nộp đơn'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000442
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: giữ ''nó'' / ''mình'', khóa ''các
    đạo quân khu vực'', bảo toàn mức độ suy luận chắc chắn (''Đinh ninh rằng ắt hẳn
    đã có nhầm lẫn gì đó'') và các cấu trúc phủ định (''đâu phải là chuyện đó'', ''không
    hoàn toàn ăn khớp'', ''chẳng hề có sai sót nào ở bất cứ đâu'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000443
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & tính đồng bộ: khóa dấu ''*...*''
    bao trọn toàn đoạn văn bản thông báo tuyển mộ và giữ nguyên văn 100% bản dịch
    đã duyệt ở ch-05-b16 p000404 (phân biệt ''Chúng ta'' ở khẩu hiệu đầu và ''Chúng
    tôi'' ở câu tuyển dụng, giữ ''đồng đội'' và ''rừng gươm mưa đạn'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000444
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: phân biệt ''Họ'' / ''họ'' (các ứng
    viên) và ''nó'' (Tanya); khóa ''tiền tuyến'', ''phòng tuyến địch'', ''nghĩa vụ
    giải trình'', ''rừng gươm mưa đạn''; bảo toàn dấu gạch ngang dài và các mệnh đề
    phủ định (''mà không hề có lựa chọn đầu hàng hay rút lui'', ''chẳng khác nào bảo
    rằng họ sẽ chẳng nhận được gì cả'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000445
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & đại từ: khóa ''*Xin mời tham
    gia cùng tôi trong chuyến du lịch một chiều xuống Địa ngục, xin chân thành cảm
    ơn*'' tương ứng 1:1 với thẻ <html:em> trong nguồn (dấu chấm câu nằm ngoài dấu
    ''*''); dùng ''tôi'' trong lời mời công khai giả định và ''nó'' trong trần thuật;
    khóa ''Lương tri thông thường'' và phủ định dự đoán (''sẽ chẳng có ai hưởng ứng'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000446
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giả định quá khứ: giữ ''nó'', khóa ''Cục Quân
    vụ'', bảo toàn chính xác các giả định trái thực tế ở quá khứ (''Bản thân nó chắc
    chắn sẽ không đời nào đáp lại..., và nó tin chắc hầu hết binh lính cũng sẽ không.
    Có như vậy, nó mới có thể lấy cớ không có đủ người tình nguyện để câu giờ'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000447
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc trích dẫn: khóa ''Các pháp sư'', ''tầng lớp
    tinh hoa'', ''Phố Wall'', ''bồi thường tai nạn lao động'', ''bảo hiểm y tế'',
    ''nhà kinh tế học'', ''nhà giao dịch''; giữ nguyên nội dung mẩu tin tuyển dụng
    giả định trong ngoặc kép và câu chú thích trong ngoặc đơn."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000448
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: giữ ''Tanya'' / ''nó'', khóa ''bản
    mô tả công việc'' và ''đạo quân khu vực'', bảo toàn phủ định thời gian (''Thậm
    chí còn chưa đầy một tuần lễ trôi qua'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000449
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi thoại, đại từ & thuật ngữ: khóa câu than thở mở đầu ''“Sao
    lại ra nông nỗi này cơ chứ…?”'', giữ ''nó'', khóa ''Cục Quân vụ'' và bảo toàn
    dấu gạch ngang dài ở câu hai."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000450
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: giữ ''Nó'' / ''nó'' kết hợp phản thân ''mình'',
    đồng bộ ''núi đơn ứng tuyển'' với p000441 và bảo toàn đầy đủ ba cấu trúc phủ định
    (''Kế hoạch không thành'', ''chẳng một ai có thể tự mình giải quyết xuể'', ''sẽ
    chẳng phải là chuyện đơn giản'')."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000451
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & chức danh: giữ ''nó'' / ''mình''; đồng bộ ''lương
    tri thông thường'' với p000445; khóa ''Đại úy Pháp sư Tanya von Degurechaff, sĩ
    quan lập đội của Đơn vị Thành lập 601 thuộc Văn phòng Bộ Tổng Tham mưu''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000452
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ ''Tanya'' / ''nó'' / ''mình''; khóa ''Văn
    phòng Bộ Tổng Tham mưu'', ''tiểu đoàn pháp sư phản ứng nhanh'', ''Chuẩn tướng
    von Zettour'' và ''giới chóp bu''."]'
- segment_id: YS-LN01/Text/chapter011.xhtml/p000453
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown (DEC-P01-002) & phân biệt điểm nhìn đại từ
    (DEC-P01-001): khóa chính xác hai cụm ''*Mình không hiểu nổi!*'' (tiếng hét nội
    tâm tự quy chiếu dùng ''Mình'') và ''*Là một người lính, không có điều gì làm
    tôi hạnh phúc hơn là được góp một phần vào công việc này*'' (lời nói xã giao ngoài
    miệng với cấp trên dùng ''tôi'', dấu phẩy đặt ngoài dấu ''*''), kết hợp đại từ
    trần thuật ''nó'' và mệnh đề phủ định kết cảnh."]'
