    tuyến.: modality_and_logic: Bảo toàn đủ cấu trúc 3 phần cùng dấu gạch ngang dài
    `—`: Dacia, nơi những kẻ tung cánh trên trời chi phối mọi thứ, được lấy làm trường
    hợp điển hình; hai câu hỏi tu từ nối tiếp đặt nghi vấn về nguyên nhân; và hệ quả
