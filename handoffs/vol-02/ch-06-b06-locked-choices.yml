choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000168
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000168: terms: []: pronouns_and_address:
    Câu hỏi ngắn của Tanya với viên đại úy Tình báo không dùng đại từ nhân xưng.:
    pov_and_voice: Giọng hỏi đi thẳng vào trọng tâm của người chỉ huy chiến trường.:
    modality_and_logic: Bảo toàn câu hỏi mở yêu cầu báo cáo tình hình cụ thể.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000169
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000169: terms: [''Quân cảnh'',
    ''đơn vị đồn trú'']: pronouns_and_address: Lời báo cáo của viên đại úy Tình báo
    không dùng đại từ nhân xưng.: pov_and_voice: Giọng báo cáo tình báo khẩn trương,
    khách quan.: modality_and_logic: Bảo toàn quan hệ đối lập và mức độ tình thái
    (`có vẻ đang nhanh chóng xấu đi`): quân cảnh cùng một số đơn vị đồn trú tại chỗ
    đang cố hết sức kiểm soát khu vực nhưng tình hình xấu đi rất nhanh.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000170
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000170: terms: []: pronouns_and_address:
    Tanya quy chiếu lực lượng quân cảnh và đơn vị đồn trú bằng `Họ`.: pov_and_voice:
    Giọng đánh giá gọn, thực tế của Tanya.: modality_and_logic: Bảo toàn nhận định
    (`Thế thì không ổn`) và câu hỏi nghi vấn về khả năng dẹp yên cuộc nổi dậy (`Họ
    có dẹp yên được không?`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000171
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000171: terms: [''Feldgendarmerie'',
    ''hậu phương'', ''tiền tuyến'', ''chiến tranh chiến hào'']: pronouns_and_address:
    Tuân thủ `DEC-P01-001`: độc thoại nội tâm của Tanya tự quy chiếu bằng `mình`,
    quy chiếu phía quân Đế quốc bằng đại từ gộp `ta` (`tiền tuyến của ta`, `ta sẽ
    sa vào`), và quy chiếu lực lượng `Feldgendarmerie` bằng `Đám Feldgendarmerie`
    / `họ`.: pov_and_voice: Giọng độc thoại nội tâm cay nghiệt, sắc lạnh của Tanya
    khi phân tích thế tiến thoái lưỡng nan chiến lược.: modality_and_logic: Bảo toàn
    đủ 5 câu và thế kẹt hai đầu: tệ đúng như dự đoán -> đám `Feldgendarmerie` bất
    tài làm hỏng việc nên bị cuốn vào rắc rối khi chuyện bùng phát -> nếu mặc kệ họ
    thì hậu phương bị thiêu rụi -> nhưng nếu dập đám cháy thì tiền tuyến bị giẫm nát
    -> chỉ cần đi sai một nước là sa vào chiến tranh chiến hào không đạn dược hay
    lương thực.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000172
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000172: terms: [''phòng tuyến'']:
    pronouns_and_address: Lược đại từ ngôi thứ hai phiếm chỉ ở mệnh đề nhượng bộ đầu
    câu theo `direct-address choice`; dùng đại từ gộp `Ta` ở câu thứ hai.: pov_and_voice:
    Giọng nhận định tàn nhẫn, nhìn thẳng vào kịch bản xấu nhất.: modality_and_logic:
    Bảo toàn cả hai câu: dù nhìn lạc quan đến đâu thì đây hẳn sẽ là thảm họa hoàn
    toàn với xác chết chất đống; thậm chí phải chuẩn bị tinh thần cho khả năng phòng
    tuyến bị chọc thủng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000173: terms: []: pronouns_and_address:
    Viên đại úy Tình báo tự xưng `Tôi` / `tôi` và dùng đại từ gộp `ta`.: pov_and_voice:
    Giọng trả lời thận trọng của sĩ quan tham mưu tình báo.: modality_and_logic: Bảo
    toàn sự dè dặt ở vế đầu (`Tôi không rõ`) và đề xuất chuẩn bị ở vế sau (`nhưng
    tôi nghĩ ta cần sẵn sàng ứng phó`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000174
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000174: terms: [''cơ động'']: pronouns_and_address:
    Tanya dùng câu mệnh lệnh trực tiếp và đại từ ngôi thứ nhất số nhiều gộp `chúng
    ta`.: pov_and_voice: Giọng ra lệnh dứt khoát của chỉ huy tiểu đoàn.: modality_and_logic:
    Bảo toàn đủ 3 câu mệnh lệnh: xác nhận (`Được`) -> ra lệnh sẵn sàng chờ lệnh ->
    bảo đảm có thể cơ động ngay khi có lệnh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000175
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000175: terms: [''đám cháy'']:
    pronouns_and_address: Nội tâm của Tanya tự quy chiếu bằng `mình` theo `DEC-P01-001`.:
    pov_and_voice: Giọng tự thú thực dụng xen lẫn tiếc nuối khi hy vọng tình hình
    tự êm xuôi bị thực tế bác bỏ.: modality_and_logic: Bảo toàn đủ 3 câu cùng hình
    ảnh ẩn dụ `đám cháy`: điều hy vọng và mong muốn là tình hình tự lắng xuống; chuyện
    đó vốn có thể xảy ra; nhưng suy đoán lạc quan rằng đám cháy có thể tự tắt ngấm
    đã trật lất.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000176: terms: [''Quân đội Cộng
    hòa'', ''Bộ chỉ huy'']: pronouns_and_address: Nội tâm của Tanya tự quy chiếu bằng
    `mình` (`mong muốn của mình`).: pov_and_voice: Giọng trần thuật nội tâm chuyển
    nhanh sang diễn biến chiến cục.: modality_and_logic: Bảo toàn 2 câu và đúng mức
    độ thông tin: mong muốn cá nhân không có ý nghĩa gì trước tình hình xấu đi nhanh
    chóng; dấu hiệu về một cuộc tiến công của phía Cộng hòa được xác nhận (giữ đúng
    mức xác nhận *dấu hiệu*), buộc Bộ chỉ huy phải ra quyết định.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000177: terms: [''logic quân sự
    thuần túy'']: pronouns_and_address: Dùng đại từ ngôi thứ nhất số nhiều gộp `chúng
    ta`.: pov_and_voice: Giọng đúc kết lạnh lùng về hệ quả tất yếu của chiến tranh.:
    modality_and_logic: Bảo toàn quan hệ hệ quả và phạm vi loại trừ tuyệt đối (`theo
    đuổi logic quân sự thuần túy, không gì khác`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000178
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000178: terms: [''lực lượng tăng
    viện'', ''Quân đội Cộng hòa'', ''lực lượng du kích'', ''quân đội'', ''phòng tuyến'']:
    pronouns_and_address: Trần thuật khách quan; từ `nó` ở cuối câu 3 chỉ quy chiếu
    danh từ bất động vật `phòng tuyến`.: pov_and_voice: Giọng phân tích chiến lược
    rành mạch.: modality_and_logic: Bảo toàn đủ 3 câu: yếu tố quyết định là tin báo
    lực lượng tăng viện của Quân đội Cộng hòa đã hội quân với lực lượng du kích ->
    quân đội đi đến kết luận đơn giản -> chừng nào còn một phòng tuyến không thể để
    vượt qua thì phải ưu tiên giữ vững nó.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000179
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000179: terms: [''Đưa quân xuống
    bằng đường không'', ''pháp sư'', ''Quân đội Cộng hòa'', ''chiến dịch đột kích
    đường không'', ''quân nổi dậy'']: pronouns_and_address: Quy chiếu lực lượng địch
    mới xuất hiện bằng `Họ` / `họ`.: pov_and_voice: Giọng báo cáo hoảng hốt, dồn dập
    từ bộ phận kiểm soát.: modality_and_logic: Bảo toàn đủ 5 câu cảm thán/thông báo
    và sắc thái phỏng đoán ở câu cuối: hỏi thảng thốt về việc đưa quân xuống bằng
    đường không -> chửi thề -> xác định họ là pháp sư -> thông báo Quân đội Cộng hòa
    đang tiến hành chiến dịch đột kích đường không -> nhận định có vẻ họ đang hội
    quân với quân nổi dậy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000180
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000180: terms: [''Control'']: pronouns_and_address:
    Câu trần thuật ngắn không dùng đại từ.: pov_and_voice: Nhịp câu tỉnh lược, khắc
    họa sự hỗn loạn trên kênh liên lạc.: modality_and_logic: Bảo toàn danh ngữ mô
    tả tiếng hét thất thanh vang lên từ `Control`.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000181
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000181: terms: [''những kẻ nổi
    dậy có vũ trang'', ''pháp sư'', ''lực lượng cảnh sát'', ''sư đoàn bộ binh'']:
    pronouns_and_address: Quy chiếu phe nổi dậy bằng `họ`.: pov_and_voice: Giọng phân
    tích tương quan binh lực điềm tĩnh của Tanya.: modality_and_logic: Bảo toàn chính
    xác cấu trúc giả định trái thực tế và khả thể trong quá khứ: nếu họ chỉ là những
    kẻ nổi dậy có vũ trang không có pháp sư, thì dù khó dẹp yên, lực lượng cảnh sát
    vẫn có thể đã đủ sức xử lý; hoặc có lẽ một sư đoàn bộ binh cũng đã có thể giải
    quyết.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000182: terms: [''giao chiến trong
    đô thị'', ''pháp sư'', ''bộ binh hạng nặng'', ''chiến trường ba chiều'', ''các
    trận đánh ở đô thị'']: pronouns_and_address: Dùng chủ ngữ khái quát `người ta`
    cho nhận định gián tiếp ở câu 3.: pov_and_voice: Giọng phân tích chiến thuật chuyên
    môn.: modality_and_logic: Bảo toàn đủ 4 câu: đối đầu pháp sư trong đô thị khiến
    ngay cả bộ binh hạng nặng cũng phải chuẩn bị chịu tổn thất khủng khiếp -> giải
    thích thành phố là chiến trường ba chiều đầy chỗ ẩn nấp và chướng ngại vật ->
    dẫn nhận định ít được nói công khai rằng người ta cho là pháp sư phát huy tốt
    nhất trong tác chiến đô thị -> kết luận đây sẽ là một trận chiến cam go.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000183
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000183: terms: [''đánh chặn'']:
    pronouns_and_address: Câu hỏi dùng đại từ nghi vấn `ai` và quy chiếu pháp sư địch
    bằng `họ`.: pov_and_voice: Giọng hỏi khẩn trương nhằm kiểm tra phản ứng phòng
    không.: modality_and_logic: Bảo toàn câu hỏi trực tiếp xem có lực lượng nào đang
    đánh chặn toán pháp sư địch hay không.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000184
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000184: terms: [''pháp sư'', ''sư
    đoàn bộ binh'', ''lực lượng dự bị đã tập kết'', ''đám đông có vũ trang'', ''cảnh
    sát'', ''Bộ Nội vụ'']: pronouns_and_address: Quy chiếu lực lượng cảnh sát và Bộ
    Nội vụ bằng `họ`.: pov_and_voice: Giọng lập luận giải thích tầm quan trọng chiến
    thuật của việc pháp sư địch vào được thành phố.: modality_and_logic: Bảo toàn
    đủ 3 câu và giữ nguyên tính khả thể giả định ở câu 2–3: đó là lý do việc pháp
    sư tham gia phòng thủ thành phố có ý nghĩa lớn đến vậy; chỉ một sư đoàn bộ binh
    rút từ lực lượng dự bị đã tập kết có lẽ cũng đủ trấn áp đám đông có vũ trang dù
    mất chút thời gian; với nhân lực của cảnh sát và Bộ Nội vụ, họ có thể đã đủ sức
    trấn áp đám đông dù phải đổ máu (không dịch thành sự việc đã hoàn tất).: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000185
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000185: terms: [''pháp sư'', ''đánh
    chặn'', ''vị trí phòng thủ'', ''sự can thiệp quân sự'', ''khí tài'', ''khu phố'']:
    pronouns_and_address: Quy chiếu các pháp sư phòng thủ thành phố bằng `họ`; lược
    đại từ ngôi thứ hai phiếm chỉ ở câu cuối theo `direct-address choice`.: pov_and_voice:
    Giọng mổ xẻ bài toán công kiên đô thị tàn khốc.: modality_and_logic: Bảo toàn
    đủ 3 câu: một khi pháp sư là lực lượng phòng thủ thành phố thì khác hẳn đánh chặn
    trên địa hình phẳng hay từ vị trí phòng thủ, đòi hỏi can thiệp quân sự -> dẫu
    vậy chỉ ném thật nhiều khí tài vào họ cũng không hiệu quả lắm -> cần thực sự bất
    chấp mọi thiệt hại để chiếm từng khu phố một.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000186
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000186: terms: [''pháp sư'', ''không
    chiến'', ''mạng lưới phòng không'']: pronouns_and_address: Quy chiếu các pháp
    sư địch bằng đại từ sở hữu `của họ`.: pov_and_voice: Giọng đối chiếu kế hoạch
    lý thuyết với thực tại thất bại.: modality_and_logic: Bảo toàn sắc thái lẽ ra
    phải có nhưng không đạt được ở cả hai câu (`lẽ ra phải ngăn chặn... đồng thời
    thiết lập một mạng lưới phòng không bao quát 360 độ`, `Đáng lẽ mọi chuyện phải
    là như thế`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000187
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000187: terms: []: pronouns_and_address:
    Quy chiếu lực lượng đánh chặn bằng `Họ`.: pov_and_voice: Giọng báo cáo ngắn gọn
    xác nhận việc đánh chặn bất thành.: modality_and_logic: Bảo toàn hai thông tin
    trả lời câu hỏi ở `p000183`: lực lượng đánh chặn đã không đến kịp và bị điều/cuốn
    đi hướng khác.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000188
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000188: terms: [''lực lượng không
    quân'', ''Hạm đội Không quân Đế quốc'', ''Trận không chiến Rhine'']: pronouns_and_address:
    Trần thuật phân tích tình hình chung của phía Đế quốc.: pov_and_voice: Giọng phân
    tích thực trạng quá tải của lực lượng không quân Đế quốc.: modality_and_logic:
    Bảo toàn đủ 3 câu: khoảng cách rõ rệt giữa kế hoạch và tình hình hiện tại; cơ
    chế luân phiên lực lượng không quân lẽ ra phải có độ linh hoạt nhất định nhưng
    đã ngưng trệ từ lâu; Hạm đội Không quân Đế quốc gần như phải tung toàn lực mỗi
    ngày và chật vật bù đắp tổn thất sau Trận không chiến Rhine.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000189
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000189: terms: [''Các đơn vị không
    quân'', ''ưu thế trên trời'', ''quân đội'', ''Lục quân'', ''kiểm soát bầu trời'']:
    pronouns_and_address: Quy chiếu các đơn vị không quân bằng `họ`.: pov_and_voice:
    Giọng bình luận chiến lược về sự thay đổi nhận thức của quân đội trước và sau
    khi chiến tranh nổ ra.: modality_and_logic: Bảo toàn đủ 3 câu: các đơn vị không
    quân có nhiều loại nhiệm vụ hơn dự kiến chứ không chỉ giành ưu thế trên trời ->
    kế hoạch lập trước chiến tranh trở nên vô nghĩa trước thực tế các đơn vị không
    quân gần như kiệt sức vẫn bị động viên cho những nhiệm vụ ngoài dự kiến -> chỉ
    sau khi điều động các đơn vị ấy, quân đội mới hiểu sự cần thiết của các nhiệm
    vụ họ đảm nhận, và Lục quân nhận thức rõ hơn nhiều tầm quan trọng của việc kiểm
    soát bầu trời so với trước chiến tranh.: emphasis: none'
