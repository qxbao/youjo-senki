choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000253: terms: [''Trung úy'']:
    pronouns_and_address: Tanya gọi Serebryakov là `Trung úy` và `cô`; dịch `your
    friend` là `người bạn của cô` (trung tính, không suy diễn giới tính của người
    bạn cùng khóa ở Trường Thiếu sinh quân).: pov_and_voice: Lời thoại của Tanya,
    giọng điềm tĩnh, thực dụng.: modality_and_logic: Giữ đúng nhận xét rằng người
    bạn của Serebryakov rất thính tin và việc đó không có gì đáng trách.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000254
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000254: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `chúng tôi` cho đơn vị mình và `họ` cho cấp trên.:
    pov_and_voice: Độc thoại nội tâm của Tanya, giọng mỉa mai pha lẫn khó hiểu.: modality_and_logic:
    Bảo toàn suy đoán về lý do cấp trên lập chương trình huấn luyện (nhận ra tốc độ
    hao hụt tân binh) và câu hỏi chất vấn vì sao lại chọn đơn vị của Tanya làm người
    huấn luyện.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000255
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000255: terms: [''Đơn vị huấn luyện'',
    ''hậu phương'', ''tiền tuyến'']: pronouns_and_address: Lời thoại của một binh
    sĩ thuộc cấp xưng `tôi`, gọi đơn vị là `chúng ta` và cấp trên là `họ`.: pov_and_voice:
    Giọng binh sĩ chiến đấu bất ngờ và hoài nghi trước tin đồn.: modality_and_logic:
    Giữ đúng lập luận loại trừ: chiến sự đang căng thẳng nên khó có chuyện được rút
    về hậu phương, suy ra phải huấn luyện tân binh ngay tại tiền tuyến.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000256
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000256: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `tôi`, quy chiếu tân binh là `họ`.: pov_and_voice:
    Giọng đánh giá chiến trường lạnh lùng, thực dụng của Tanya.: modality_and_logic:
    Bảo toàn sự tán đồng của Tanya với cấp dưới: tân binh trên chiến trường chỉ là
    gánh nặng, thậm chí không dùng làm bia đỡ đạn được, nên cần đẩy đi nơi khác.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000257
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000257: terms: [''tiền tuyến'']:
    pronouns_and_address: Độc thoại nội tâm của Tanya dùng `Tôi` / `tôi`, gọi cấp
    trên là `họ`.: pov_and_voice: Giọng bực bội trực diện trong nội tâm Tanya.: modality_and_logic:
    Giữ đúng câu hỏi bất bình khi bị giao tân binh vướng chân và mong muốn hét bảo
    cấp trên tự ra tiền tuyến mà xem có khả thi không.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000258
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000258: terms: [''Trung úy Weiss'']:
    pronouns_and_address: Trần thuật ngôi thứ nhất dùng `tôi` và `Trung úy Weiss`;
    trong lời thoại Weiss dùng `chúng ta` và `họ`.: pov_and_voice: Giọng Weiss bức
    xúc nói to đúng điều Tanya đang nghĩ trong đầu.: modality_and_logic: Bảo toàn
    hình ảnh ẩn dụ `vừa đánh trận vừa trông trẻ` (`babysit while fighting a war`).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000259
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000259: terms: [''chiến hào'']:
    pronouns_and_address: Độc thoại nội tâm của Tanya dùng `tôi`, gọi các thuộc cấp
    là `Họ` / `họ`.: pov_and_voice: Giọng Tanya thông cảm với phản ứng bộc trực của
    lính dưới quyền.: modality_and_logic: Giữ đúng lý do đồng cảm: bản thân Tanya
    cũng từng trải qua cảnh co ro trong chiến hào.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000260
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000260: terms: []: pronouns_and_address:
    Lời thoại của thuộc cấp dùng `chúng ta` và `họ` (tân binh).: pov_and_voice: Giọng
    phàn nàn gay gắt của lính chiến.: modality_and_logic: Bảo toàn hai câu hỏi tu
    từ bày tỏ sự phẫn nộ trước việc phải che đạn pháo cho lính mới.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000261
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000261: terms: []: pronouns_and_address:
    Lời thoại của Serebryakov dùng đại từ phiếm chỉ `ai cũng`.: pov_and_voice: Giọng
    Serebryakov ngập ngừng, ôn hòa (`Thì, ừm...`).: modality_and_logic: Giữ đúng nhận
    xét khách quan rằng ai cũng từng là tân binh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000262
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000262: terms: [''Trung úy Serebryakov'',
    ''Tanya'', ''Rhine'']: pronouns_and_address: Trần thuật hạn tri gọi `Trung úy
    Serebryakov` và chuyển sang ngôi thứ ba `Tanya` ở câu cuối theo đúng nguyên văn.:
    pov_and_voice: Giọng nhìn nhận thực tế, công tâm của Tanya.: modality_and_logic:
    Bảo toàn sự thừa nhận lời Serebryakov là đúng và dẫn chứng việc Tanya từng vừa
    tác chiến ở Rhine vừa kèm cặp lính mới.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000263
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000263: terms: []: pronouns_and_address:
    Trần thuật hạn tri ngôi thứ ba quy chiếu Tanya bằng `cô`.: pov_and_voice: Giọng
    suy đoán nguyên nhân từ góc nhìn của Tanya.: modality_and_logic: Giữ đúng tình
    thái phỏng đoán (`Có lẽ vì...`) về việc cấp trên lại giao nhiệm vụ này cho Tanya
    do cô đã có kinh nghiệm trước đó.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000264
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000264: terms: [''Rhine'', ''Trung
    úy'']: pronouns_and_address: Tanya xưng `Tôi`, gọi Serebryakov là `cô` và `Trung
    úy`.: pov_and_voice: Giọng chỉ huy xác nhận kỷ niệm chiến trường với phó quan.:
    modality_and_logic: Giữ đúng nội dung nhắc lại việc Tanya đã huấn luyện Serebryakov
    tại chiến trường Rhine.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000265
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000265: terms: [''Thiếu tá'']:
    pronouns_and_address: Serebryakov thưa `Vâng, thưa Thiếu tá`, gọi Tanya là `ngài`.:
    pov_and_voice: Giọng cấp dưới lễ phép, biết ơn.: modality_and_logic: Giữ đúng
    lời cảm ơn khẳng định bản thân tiến bộ được đến hôm nay là nhờ Tanya.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000266
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000266: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `tôi` và `chúng ta`.: pov_and_voice: Giọng suy
    tính thực dụng của người chỉ huy.: modality_and_logic: Bảo toàn mạch nhân quả:
    vì từng tìm được một cấp dưới hữu dụng ngoài mong đợi (Serebryakov), nên có lẽ
    cứ cố hết sức xem có đãi cát tìm vàng thêm được ai không.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000267
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000267: terms: [''Thiếu tá'']:
    pronouns_and_address: Weiss gọi Tanya là `Thiếu tá` / `ngài`.: pov_and_voice:
    Giọng Weiss rào đón dè dặt rồi buột miệng nhận xét thật lòng.: modality_and_logic:
    Giữ đúng nhận xét rằng cách huấn luyện của Thiếu tá rất khắc nghiệt và câu cảm
    thán bỏ lửng ở cuối đoạn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000268
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000268: terms: [''Trung úy Weiss'']:
    pronouns_and_address: Tanya gọi `Trung úy Weiss`, lược đại từ ngôi thứ hai trong
    câu mệnh lệnh để tăng sức ép.: pov_and_voice: Giọng cấp trên sắc lạnh, uy quyền.:
    modality_and_logic: Giữ đúng lời chất vấn buộc Weiss có gì muốn nói thì nói thẳng
    ra.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000269
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000269: terms: []: pronouns_and_address:
    Lời đáp ngắn gọn của Weiss, lược đại từ.: pov_and_voice: Giọng cấp dưới vội vàng
    rút lui và xin lỗi.: modality_and_logic: Giữ đúng phản ứng chối ngay và xin lỗi
    của Weiss.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000270
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000270: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri dùng `Tanya` / `cô`, phản thân `mình`, quy chiếu thuộc cấp
    là `họ`.: pov_and_voice: Giọng trần thuật hạn tri thể hiện sự cam chịu miễn cưỡng
    của Tanya.: modality_and_logic: Bảo toàn nhận định rằng đám thuộc cấp sẽ lo liệu
    chuyện tân binh và thái độ miễn cưỡng chuẩn bị tinh thần chấp hành nhiệm vụ của
    Tanya.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000271
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000271: terms: []: pronouns_and_address:
    Trần thuật hạn tri ngôi thứ ba dùng `cô`.: pov_and_voice: Giọng phân tích tỉnh
    táo, bi quan thực tế.: modality_and_logic: Giữ đúng quan hệ nguyên nhân: Tanya
    không thể nghĩ tích cực vì cô hiểu rõ thực tế tàn khốc của chiến trường.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000272
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000272: terms: [''pháo kích áp
    chế'', ''chiến hào'', ''đội ngũ quân y'', ''hậu phương'', ''tiền tuyến'']: pronouns_and_address:
    Chuyển ngôi từ `cô` (trần thuật hạn tri ở câu 2–3) sang `Tôi` (độc thoại nội tâm
    trực tiếp ở câu kết), khớp với sự chuyển ngôi của nguyên văn; dùng `người ta`
    cho đại từ ngôi thứ hai phiếm chỉ ở câu 1.: pov_and_voice: Giọng lo âu thực tế
    của người chỉ huy tiền tuyến.: modality_and_logic: Bảo toàn phép đối lập giữa
    tình huống lính mới phát điên ở căn cứ (có thể đẩy cho quân y hậu phương) với
    tình huống hoảng loạn ngay tại tiền tuyến (không có thời gian xử lý).: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000273
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000273: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `tôi`.: pov_and_voice: Giọng thực dụng lạnh lùng
    pha hài đen đặc trưng của Tanya.: modality_and_logic: Bảo toàn chuỗi giả định
    dây chuyền (hoảng loạn và nôn mửa lây lan làm mất kiểm soát đơn vị), giải pháp
    cực đoan trong tình huống tệ nhất là dùng xẻng bắt im lặng, và giữ nguyên ký hiệu
    chú thích `18`.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000274
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000274: terms: [''chiến hào'']:
    pronouns_and_address: Độc thoại nội tâm khái quát hóa của Tanya, quy chiếu tân
    binh là `họ` và chiếc xẻng là `nó`.: pov_and_voice: Giọng hài đen châm biếm về
    công dụng của chiếc xẻng quân dụng.: modality_and_logic: Bảo toàn đầy đủ ba công
    dụng của xẻng trong việc dạy dỗ lính mới (chôn chất thải, bắt im miệng, và nếu
    cần thì chôn luôn cả họ) tương ứng với ba địa điểm (chiến hào, căn cứ, nghĩa địa).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000275
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000275: terms: [''Bộ chỉ huy'']:
    pronouns_and_address: Trong lời thoại, Tanya gọi các sĩ quan dưới quyền là `Các
    anh`, xưng `chúng ta`; phần độc thoại xen giữa ẩn chủ ngữ.: pov_and_voice: Đan
    xen giữa lời hiệu triệu dứt khoát của chỉ huy và suy tính thủ tục hành chính thận
    trọng.: modality_and_logic: Bảo toàn sự phân biệt then chốt: mệnh lệnh là mệnh
    lệnh nhưng lệnh này thực tế chưa được ban xuống chính thức, nên bước đầu tiên
    là phải liên hệ Bộ chỉ huy để xác nhận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000276
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000276: terms: [''Tanya'']: pronouns_and_address:
    Độc thoại nội tâm dùng `tôi` / `mình` và `chúng ta`, xen câu trần thuật ngôi thứ
    ba `Tanya tự trấn tĩnh` theo đúng nguyên văn.: pov_and_voice: Giọng toan tính
    giới hạn trách nhiệm để bảo toàn sức lực.: modality_and_logic: Giữ đúng mạch suy
    nghĩ: hỏi xác nhận tin đồn, nếu đúng là phải kèm lính mới thì phải làm sao cho
    khỏi kiệt sức chứ không thể cầm tay chỉ việc từng bước.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000277
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000277: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `tôi` / `mình`.: pov_and_voice: Giọng suy luận
    kiểu quản trị nhân sự của Tanya.: modality_and_logic: Bảo toàn hai mặt của lập
    luận: hiểu rằng lãng phí nhân lực quý giá là điều dại dột cần tránh, nhưng chỉ
    muốn thực hiện trong giới hạn không tạo gánh nặng quá lớn cho bản thân.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000278
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000278: terms: [''Thiếu tá von
    Degurechaff'', ''pháp sư'']: pronouns_and_address: Tanya tự giới thiệu qua điện
    thoại `Tôi là Thiếu tá von Degurechaff`.: pov_and_voice: Giọng liên lạc quân vụ
    chuẩn mực, đi thẳng vào vấn đề.: modality_and_logic: Giữ đúng câu mở lời hỏi Bộ
    chỉ huy về các pháp sư mới.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000279
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000279: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật ngôi thứ ba dùng `Tanya`.: pov_and_voice: Giọng trần thuật ngắn gọn,
    dứt khoát.: modality_and_logic: Bảo toàn hành động Tanya nêu một phỏng đoán đơn
    giản để dò hỏi và lập tức nhận được xác nhận từ đầu dây bên kia.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000280
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000280: terms: [''giúp đám lính
    mới làm quen với công việc'', ''Tanya'']: pronouns_and_address: Câu 1 dùng `chúng
    tôi`; câu 2 dùng `Tanya` và `đơn vị của cô`, khớp với sự chuyển ngôi trong nguyên
    văn.: pov_and_voice: Giọng tóm lược kết quả cuộc gọi của Tanya.: modality_and_logic:
