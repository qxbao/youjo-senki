- segment_id: YS-LN02/Text/part0022.xhtml/p000217
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000217: names_and_ranks: []: pronouns_and_address:
    [''Độc thoại nội tâm của Tanya tự quy chiếu bằng "mình" (DEC-P01-001); câu nhận
