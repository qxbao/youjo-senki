  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000244: names_and_ranks: [''Tanya
    -> Tanya'', ''bayonet -> lưỡi lê'', ''Entente Alliance mage -> pháp sư Liên minh
    Entente'', ''defensive shell -> lớp khiên phòng thủ'', ''four hundred knots ->
    bốn trăm hải lý/giờ'', ''medieval heavy cavalry -> kỵ binh hạng nặng thời trung
    cổ'']: pronouns_and_address: [''Quy chiếu Tanya bằng tên riêng "Tanya", quy chiếu
    pháp sư Liên minh Entente bằng "hắn"'']: pov_and_logic: [''Giữ bản sửa M2 "pháp
    sư Liên minh Entente", hành động lưỡi lê xuyên qua lớp khiên phòng thủ cắm vào
    người hắn, và phép so sánh cú đâm lưỡi lê ở tốc độ hơn bốn trăm hải lý/giờ gây
    sát thương lớn hơn cú xung phong bằng thương của kỵ binh hạng nặng thời trung
    cổ'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000245
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000245: names_and_ranks: [''Tanya
    -> Tanya'', ''bayonet -> lưỡi lê'', ''barrel -> nòng súng'']: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "Nó" / "nó" và tên riêng "Tanya"
    (DEC-P01-001); quy chiếu đối phương bằng "tên lính địch", "hắn" và đại từ phản
    thân "mình" ("bụng mình")'']: pov_and_logic: [{''Giữ trọn diễn biến'': ''Tanya
    đâm lưỡi lê vào và hài lòng nhìn vẻ mặt sững sờ của tên lính địch không tin nổi
    bụng mình bị đâm xuyên, nhưng khi rút ra thì hơi cau mày vì cả lưỡi lê lẫn nòng
    súng đã cắm quá sâu và bị kẹt, khiến Tanya phải chật vật một chút mới rút ra được''}]:
    emphasis: none'
  non_canon: true
