    đầu.")'']: pov_and_logic: [{''Giữ lý do bổ sung nối tiếp cuối b09'': ''khi rút
    đi sau đợt tấn công, đương nhiên muốn có chiếc khiên che phía sau vì mắt người
    nằm ở phía trước đầu''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000218: names_and_ranks: []: pronouns_and_address:
    [''Câu nhận định khái quát lược đại từ ngôi thứ hai phiếm chỉ tự nhiên'']: pov_and_logic:
    [''Giữ cấu trúc tăng tiến ("Càng nghĩ kỹ, phía sau càng nghe có vẻ nguy hiểm.")'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000219
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000219: names_and_ranks: [''commander
    -> vị chỉ huy'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya tự quy
    chiếu bằng "Mình" / "mình" (DEC-P01-001); câu dẫn ngạn ngữ chiến trường dùng "Người
    ta" và "của anh"'']: pov_and_logic: [{''Giữ trọn lập luận nghịch lý của Tanya'':
    ''làm vị chỉ huy gan dạ xông lên phía trước mới là chính sách an toàn hơn; sống
    sót trong chiến tranh tùy thuộc vào mức độ hèn nhát, và vì tự nhận mình là kẻ
    hèn nhát nên muốn bình tĩnh điều quân đưa mình vào vị trí an toàn''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000220
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000220: names_and_ranks: []: pronouns_and_address:
    [''Khẩu lệnh trực tiếp của Tanya với Đại đội Một tự xưng "tôi" / "Tôi"'']: pov_and_logic:
    [''Giữ nguyên nhịp mệnh lệnh lặp lại trên sóng liên lạc ("“Theo tôi. Tôi nhắc
    lại, theo tôi.”")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000221
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000221: names_and_ranks: []: pronouns_and_address:
    [''Tự thuật nội tâm của Tanya dùng "mình" (DEC-P01-001, bản sửa M1)'']: pov_and_logic:
    [''Giữ hành động trước mắt tìm một con tàu không bắn quá dữ dội'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000222
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000222: names_and_ranks: [''cruisers
    -> tàu tuần dương'', ''battle cruisers -> tàu tuần dương chiến đấu'', ''American
    ships -> tàu Mỹ'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya dùng
    "mình" ở câu cuối (DEC-P01-001, bản sửa M1)'']: pov_and_logic: [''Giữ bản sửa
    M3 phân biệt đúng "tàu tuần dương hay tàu tuần dương chiến đấu", liên tưởng tới
    phim chiến tranh/phóng sự đặc biệt về mật độ hỏa lực phòng không của tàu Mỹ ("chín
    phần đạn, một phần bầu trời") và cảm giác gần như tuyệt vọng chỉ khi đứng xem'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000223
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000223: names_and_ranks: [''defensive
    shells -> Khiên phòng thủ'', ''127 mm high-angle gunshot -> tầm bắn của pháo phòng
    không góc cao 127 mm'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya
    tự quy chiếu bằng "mình" ở cả hai mệnh đề (DEC-P01-001, bản sửa M1)'']: pov_and_logic:
    [''Giữ mệnh đề nhượng bộ ("Khiên phòng thủ của pháp sư có mạnh đến đâu mình cũng
    mặc kệ") và phủ định tuyệt đối ("mình tuyệt đối không bay vào tầm bắn của pháo
    phòng không góc cao 127 mm")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000224
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000224: names_and_ranks: [''night
    battle -> trận đánh ban đêm'', ''big ships -> những chiến hạm lớn'', ''anti–air
    fire -> hỏa lực phòng không'']: pronouns_and_address: []: pov_and_logic: [{''Giữ
    quan hệ nhượng bộ'': ''dù là trận đánh ban đêm và có thể trông cậy đôi chút vào
    màn đêm che chở, việc nhắm vào một trong những chiến hạm lớn nổi tiếng với hỏa
    lực phòng không vẫn quá nguy hiểm''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000225
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000225: names_and_ranks: [''destroyer
    -> tàu khu trục'']: pronouns_and_address: []: pov_and_logic: [''Giữ kết luận thực
    dụng của Tanya (cách khôn ngoan là tấn công tàu khu trục) và câu châm biếm ("Trong
    chiến tranh, bắt nạt kẻ yếu chính là công lý. Hoan hô công lý.")'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000226: names_and_ranks: [''destroyer
    -> tàu khu trục'']: pronouns_and_address: []: pov_and_logic: [''Giữ lời thoại
    trực tiếp khi phát hiện mục tiêu ("“…À. Đó là tàu khu trục à? Thôi, là gì cũng
    được, tấn công nó nào!”")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000227: names_and_ranks: [''turret
    -> tháp pháo'']: pronouns_and_address: [''Tự thuật nội tâm của Tanya dùng "mình"
    ở cả hai vế (DEC-P01-001, bản sửa M1)'']: pov_and_logic: [{''Giữ quan hệ tương
    phản – nhân quả'': ''trời tối nên không nhìn rõ lắm, nhưng nhờ có một tháp pháo
    đang bắn loạn xạ nên nhận ra được hình dáng con tàu''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000228
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000228: names_and_ranks: [''isolated
    destroyer -> chiếc khu trục hạm đơn độc'']: pronouns_and_address: []: pov_and_logic:
    [''Giữ suy luận có dấu hỏi từ việc không có tàu nào hộ tống bên cạnh để đoán đó
    là một chiếc khu trục hạm đơn độc'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000229
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000229: names_and_ranks: [''enemy
    fleet -> hạm đội địch'']: pronouns_and_address: [''Nội tâm Tanya dùng đại từ tập
    thể "ta" cho đơn vị'']: pov_and_logic: [''Giữ hệ quả suy luận và phủ định ("Nếu
    vậy, ta không cần lo các tàu khác trong hạm đội địch chi viện.")'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000230
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000230: names_and_ranks: [''assault
    formation -> đội hình xung kích'']: pronouns_and_address: [''Tự sự hành động tập
    thể của đơn vị dùng "chúng tôi"'']: pov_and_logic: [''Giữ hành động chuyển sang
    đội hình xung kích dựa trên nhận định đó'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000231
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000231: names_and_ranks: [''forty-five
    hundred feet -> 4.500 feet'', ''spindle shape -> đội hình con thoi'']: pronouns_and_address:
    [''Tự sự hành động tập thể của đơn vị dùng "chúng tôi"'']: pov_and_logic: [''Giữ
    đúng độ cao bổ nhào ("4.500 feet"), thuật ngữ tạm "đội hình con thoi" (`vol02-ch04-b10-spindle-shape`)
    và động tác tinh chỉnh từng chút một góc tấn công'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000232
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000232: names_and_ranks: []: pronouns_and_address:
    [''Thoại báo cáo của pháp sư thuộc cấp trúng đạn tự xưng "Tôi"'']: pov_and_logic:
    [''Giữ tiếng kêu trúng đạn, thông báo đang quay về căn cứ và khẳng định không
    cần hộ tống'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000233
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000233: names_and_ranks: [''destroyer
    -> tàu khu trục'']: pronouns_and_address: [''Độc thoại nội tâm dùng "chúng tôi"
    cho cả đội và "mình" cho cá nhân Tanya ("một người của mình") theo DEC-P01-001
    (bản sửa M1)'']: pov_and_logic: [''Giữ nhận định không thể xem thường tàu khu
    trục khi một thuộc cấp trúng đạn ngay trước lúc chuẩn bị tấn công'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000234
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000234: names_and_ranks: [''main
    gun -> Pháo chính'', ''destroyer -> tàu khu trục'', ''127 mm -> cỡ 127 mm'', ''anti–air
    fire -> bắn phòng không'']: pronouns_and_address: [''Độc thoại nội tâm tự quy
    chiếu bằng "mình" (DEC-P01-001, bản sửa M1) và quy chiếu pháp sư thuộc cấp trúng
    đạn bằng "anh ta"'']: pov_and_logic: [''Giữ thông số pháo chính 127 mm bắn phòng
    không hiệu quả khiến Tanya đánh giá lại tình hình, cùng nhận xét người pháp sư
    trúng đạn vẫn bay được nhưng trông không ổn lắm nên có lẽ phải rút khỏi trận'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000235
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000235: names_and_ranks: []: pronouns_and_address:
    [''Quy chiếu pháp sư trúng đạn bằng "Anh ta" / "anh ta", và tập thể đơn vị bằng
    "Chúng tôi"'']: pov_and_logic: [{''Giữ suy nghĩ lạnh lùng thực dụng của Tanya'':
    ''anh ta còn nói được thì sẽ tự bay về căn cứ, đơn vị không thể làm gì khác ngoài
    hy vọng anh ta làm mồi nhử tốt''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000236: names_and_ranks: [''explosion
    formulas -> thuật thức nổ'', ''destroyer -> tàu khu trục'', ''depth charges ->
    mìn sâu'', ''torpedo tubes -> ống phóng ngư lôi'']: pronouns_and_address: [''Khẩu
    lệnh trực tiếp của Tanya gọi đơn vị là "mọi người" và "ta"'']: pov_and_logic:
    [''Giữ lời giục người bị thương rời đi, lệnh chuẩn bị "thuật thức nổ" (`vol02-ch04-b10-explosion-formulas`)
    và chỉ thị nhắm vào các "mìn sâu" (`vol02-ch04-b10-depth-charge`) lộ ra ngoài
    hoặc các ống phóng ngư lôi'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000237
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000237: names_and_ranks: [''Tanya
    -> Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng
    tên riêng "Tanya", đại từ "nó" và đại từ sở hữu phản thân "mình" ("đơn vị mình")
    theo DEC-P01-001; câu lẩm bẩm tự nhủ dùng "Mình"'']: pov_and_logic: [''Giữ hành
    động vặn người né đạn nhờ rèn luyện, lời lẩm bẩm tự đắc khi né được và suy nghĩ
    ghi nhận đơn vị mình cần huấn luyện thêm trong lúc bắn trả'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000238
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000238: names_and_ranks: [''interceptor
    formulas -> thuật thức đánh chặn'', ''Entente Alliance -> Liên minh Entente'',
    ''direct support -> lực lượng yểm trợ trực tiếp'', ''destroyer -> tàu khu trục'']:
    pronouns_and_address: [''Quy chiếu toán pháp sư địch bằng "Đám đang bắn..." và
    "họ"'']: pov_and_logic: [''Giữ thuật ngữ "thuật thức đánh chặn" (`vol02-ch04-b10-interceptor-formulas`),
    bản sửa M2 "Liên minh Entente", và suy luận rằng vì hộ tống tàu khu trục nên chắc
    chỉ có vài người nhưng đã dám lên tận đây thì không thể xem thường'']: emphasis:
    [''Giữ đúng phạm vi nhấn mạnh Markdown `*Vì họ hộ tống một tàu khu trục nên chắc
    chỉ có vài người, nhưng nếu đã đủ gan lên tận đây thì không thể xem thường.*`
    ở câu thứ hai theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000239
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000239: names_and_ranks: [''fjord
    -> vịnh hẹp'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya
    bằng "nó" (DEC-P01-001); quy chiếu pháp sư địch bằng "một tên địch—một pháp sư",
    "Hắn" và "con quái vật cuồng yêu nước đó"'']: pov_and_logic: [''Giữ chi tiết nhận
    ra tên pháp sư từng gây nhiều rắc rối cho Tanya ở vịnh hẹp và câu nhận xét nội
    tâm về ngoại hình giống con quái vật cuồng yêu nước đó'']: emphasis: [''Giữ đúng
    phạm vi nhấn mạnh Markdown `*Hắn trông rất giống con quái vật cuồng yêu nước đó.*`
    ở câu thứ hai theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000240
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000240: names_and_ranks: []: pronouns_and_address:
    [''Quy chiếu pháp sư địch bằng "gã này" và "hắn"'']: pov_and_logic: [''Giữ lập
    luận rằng giết một kẻ địch tồi tệ thì ít áy náy hơn giết một kẻ tốt, nên việc
    gã này trông giống kẻ tồi tệ là điểm cộng và bắn hắn sẽ thật hả hê'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000241
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000241: names_and_ranks: [''heavy
    explosion type -> Loại thuật thức nổ hạng nặng (cần sửa từ "Loại thuật thức đánh
    chặn mạnh" theo F01)'', ''rifle -> súng trường'']: pronouns_and_address: [''Trần
    thuật ngôi thứ ba quy chiếu Tanya bằng "Nó" / "nó" theo DEC-P01-001'']: pov_and_logic:
    [{''Sau khi sửa F01, giữ đúng chuỗi cân nhắc phương án tấn công của Tanya'': ''loại
    thuật thức nổ hạng nặng có thể phá hủy một khu vực rộng nhưng sẽ biến nó thành
    mục tiêu bất động khi thi triển ("Loại ngay."), còn bắn bằng súng trường thì chẳng
    đủ để quấy rối ("Bác bỏ.")''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000242
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000242: names_and_ranks: [''kinetic
    energy -> động năng'', ''rifle -> khẩu súng trường'']: pronouns_and_address: [''Câu
    dẫn ngôi thứ ba dùng "nó"; câu quyết định nội tâm ngôi thứ nhất dùng "Mình" (DEC-P01-001)
    và quy chiếu tên pháp sư địch bằng "hắn"'']: pov_and_logic: [''Giữ khoảnh khắc
    nảy ra ý tưởng tận dụng động năng khổng lồ của cú bổ nhào để lao thẳng vào đâm
    hắn bằng đầu nhọn của khẩu súng trường'']: emphasis: [''Giữ đúng phạm vi nhấn
    mạnh Markdown `*Bổ nhào ở tốc độ này hẳn sẽ tạo ra động năng khổng lồ.*` theo
    DEC-P01-002'']'
  non_canon: true
