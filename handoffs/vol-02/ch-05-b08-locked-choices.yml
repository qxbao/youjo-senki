    bộ và góc nhìn bên ngoài.: modality_and_logic: Giữ phép nhượng bộ – đối lập: có
    thể ai đó trong tổ chức đã phản đối, nhưng với người ngoài thì kết quả cuối cùng
    trông vẫn chẳng khác gì.: emphasis: Không dùng `*...*`.'
