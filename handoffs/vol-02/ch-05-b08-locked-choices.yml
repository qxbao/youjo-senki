    Commonwealth)'', ''tai nạn đáng tiếc (an unfortunate accident)'']: pronouns_and_address:
    [''Quy chiếu phía Khối Thịnh vượng chung bằng `họ`.'']: pov_and_voice: Độc thoại
    nội tâm tổng kết cách dàn xếp ngoại giao chính thức giữa hai quốc gia.: modality_and_logic:
    Giữ đầy đủ ba vế của thỏa thuận ngoại giao: Đế quốc bày tỏ sự lấy làm tiếc, Khối
    Thịnh vượng chung tuyên bố mong chuyện không tái diễn, rồi hai bên đổ lỗi qua
    lại và quy phần lớn trách nhiệm cho bên kia.: emphasis: Không dùng `*...*`.'
  non_canon: true
