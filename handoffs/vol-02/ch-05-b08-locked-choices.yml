  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000203: terms: [''các nhà ngoại
    giao (diplomats)'', ''Dân chúng Khối Thịnh vượng chung (The Commonwealth’s public)'',
    ''chiến hạm (warships)'']: pronouns_and_address: [''Độc thoại nội tâm ngôi thứ
    nhất của Tanya tự quy chiếu bằng `Mình` (`Mình rất nghi ngờ`) theo đúng DEC-P01-001;
    quy chiếu dân chúng Khối Thịnh vượng chung bằng `họ`.'']: pov_and_voice: Độc thoại
    nội tâm dự báo phản ứng phẫn nộ của công chúng Khối Thịnh vượng chung.: modality_and_logic:
    Khóa bản sửa đại từ theo B08-P09 (`Mình rất nghi ngờ`), giữ nguyên nhân khiến
    dân chúng Khối Thịnh vượng chung không dễ dàng bỏ qua (một chiến hạm bị đánh chìm
    và có người thiệt mạng).: emphasis: Không dùng `*...*`.'
  non_canon: true
