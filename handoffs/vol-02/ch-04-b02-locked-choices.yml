task_id: vol-02-ch-04-b02
baseline_sha256: 536137bcf87c216672d2960254a3429e78c3c56bff892cf70deaa5758cbbaf43
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 73b6cb5c31e1809229bdd617a2ffa96373e05a6aacc3a0a0d14cb48c3418395b
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 37
segment_id_start: YS-LN02/Text/part0022.xhtml/p000001
segment_id_end: YS-LN02/Text/part0022.xhtml/p000037
choices:
- segment_id: YS-LN02/Text/part0022.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000001: locks: [''Giữ lời gọi tên
    riêng `“Anson…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000002: locks: [''Giữ cặp xưng
    hô `cha` – `con`, mệnh đề nhượng bộ phủ định `Có lẽ cha đã không phải là một người
    cha tốt`, và lời nhắn nhủ `nhưng cha mong một ngày nào đó con sẽ nghĩ về cha như
    một người cha đáng để con tự hào.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000003: locks: [''Giữ cặp xưng
    hô `cha` – `con`, phủ định `Không sao đâu.`, và câu nhắc dí dỏm của con gái `Cha
    là cha của con mà! À, nhưng cha nên cạo râu đi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000004: locks: [''Giữ khung câu
    trần thuật đã sửa theo M1 và được nghiệm thu (`Con bé thật ngoan. Ông bất giác
    ôm con bé vào lòng; thấy dáng con bé nhột, ông chỉ muốn bật cười.`), đại từ trần
    thuật `Ông` / `ông`, `Con bé` / `con bé`, và logic hành động không tự chủ `bất
    giác ôm con bé vào lòng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000005: locks: [''Giữ cặp xưng
    hô `Con` – `Cha` và câu đáp đùa `“Con nói đúng. Cha nên ngoan ngoãn cạo râu mới
    được.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000006: locks: [''Giữ lời thúc
    giục của con gái `“Chấn chỉnh lại đi, cha!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000007: locks: [''Giữ cặp xưng
    hô `con` – `Cha` và câu hưởng ứng `“Ừ, con nói đúng. Cha phải chấn chỉnh lại mới
    được.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000008: locks: [''Giữ tên riêng
    `Sue`, đại từ trần thuật `ông`, danh từ thân tộc `người cha`, `con gái`, phủ định
    `không chịu cạo râu thường xuyên`, và hai câu kết `Khoảnh khắc con gái trách ông
    vì không chịu cạo râu thường xuyên — đó mới là cuộc sống bình thường. Là tinh
    túy của thế giới thường nhật quý giá đối với ông.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000009: locks: [''Giữ câu thoại
    của Sue đã khôi phục đúng ngữ cảnh gia đình và được nghiệm thu (`“Thế này không
    được rồi… Đừng lo cho tôi. Tôi muốn nhớ mọi người bằng nụ cười hơn.”`), phủ định
    `Thế này không được rồi… Đừng lo cho tôi.`, và cách xưng hô trung tính `tôi` –
    `mọi người`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000010: locks: [''Giữ câu chúc
    trung tính không đại từ của người vợ đã sửa theo M2 và được nghiệm thu (`“Xin
    hãy giữ gìn an toàn.”`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000011: locks: [''Giữ các đại từ
    trần thuật `ông` / `Ông`, `họ`, danh từ `Vợ ông`, `người lính`, `bổn phận`, và
    cấu trúc đối lập `Ông muốn lên tàu cùng họ, sống trọn đời bên nhau. Nhưng ông
    là một người lính bị ràng buộc bởi bổn phận.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000012: locks: [''Giữ toàn bộ đoạn
    độc thoại nội tâm cầu nguyện in nghiêng `*...*` theo `DEC-P01-002`, các danh xưng
    `Tổ quốc`, `Chúa`, cặp xưng hô trang trọng `con` – `Người`, và cụm tương phản
    `cái bổn phận cao cả đáng ghét`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000013: locks: [''Giữ lời chào
    tạm biệt của con gái `“Cha à, còn hơi sớm, nhưng… Giáng sinh vui vẻ!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000014: locks: [''Giữ tên riêng
    `Sue`, đại từ `ông`, danh từ `con gái ông`, `mẹ`, `chiếc hòm lớn`, và lời dặn
    `dặn ông nhớ giữ gìn nó cẩn thận`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000015: locks: [''Giữ các đại từ
    `họ`, `ông` / `Ông`, `mình`, khả thể `cuộc chia tay này rất có thể là lần cuối`,
    phủ định `có một điều ông nhất quyết không muốn làm: hối tiếc khoảnh khắc này`,
    và chi tiết `thấy một người quen cũ đang chìa nó về phía mình, vẻ mặt thản nhiên`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000016: locks: [''Giữ tên riêng
    `Sue`, đại từ thân mật `cậu` trong lời Nghị viên Cazor nói với Sue theo mục `vol02-ch04-b02-cazor-sue-address`,
    và câu `“Sue, quà Giáng sinh của con gái cậu đấy. Mang theo đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000017: locks: [''Giữ chức danh
    – tên riêng `Nghị viên Cazor` / `nghị viên`, tên riêng `Sue`, đại từ phản thân
    `mình`, cụm `những người sơ tán`, và chi tiết `ngạc nhiên vì nó nặng bất thường`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000018: locks: [''Giữ phủ định
    `Bên trong không phải bánh quy hay áo len.` và câu tiếp `Mà là một thứ nặng hơn
    nhiều.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000019: locks: [''Giữ chức danh
    – tên riêng `Nghị viên Cazor` và câu hỏi `“Nghị viên Cazor, đây là thứ gì vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000020: locks: [''Giữ các chữ viết
    tắt vũ khí `SMG`, `LMG` theo mục `vol02-ch04-b02-machine-gun-acronyms`, tên hãng
    `hãng A.S. Weapons`, và định danh chính thể `Liên minh Waldstätte` đã sửa theo
    M3 và được nghiệm thu theo mục `vol02-ch04-b02-confederacy-waldstatte`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000021: locks: [''Giữ chức danh
    `nghị viên`, tên riêng `Sue`, đại từ `ông`, và các thuật ngữ khí tài `khẩu tiểu
    liên mới tinh`, `quả cầu`, `Băng đạn`, `đạn phép thuật`, `bộ dụng cụ bảo dưỡng`
    theo mục `vol02-ch04-b02-orb-magic-ammunition`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000022: locks: [''Giữ câu hỏi mở
    đầu `“Sao con bé kiếm được thứ như thế này…?”`, đại từ `Ông` / `ông`, các thuật
    ngữ `kết cấu vừa chắc chắn vừa nhẹ`, `cỡ đạn`, `súng trường`, `tầm bắn ngắn hơn`,
    `cận chiến`, và nhận định `tầm bắn hạn chế cũng đồng nghĩa nguy cơ vô tình bắn
    trúng đồng đội thấp hơn tương đối — quả là một ưu điểm lớn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000023: locks: [''Giữ đại từ `ông`
    và câu chuyển `Bởi thế ông mới phải thắc mắc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000024: locks: [''Giữ câu hỏi độc
    thoại nội tâm in nghiêng `*Rốt cuộc con gái mình kiếm đâu ra thứ này vậy?*` và
    đại từ nội tâm `mình` theo `DEC-P01-001` và `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000025: locks: [''Giữ định danh
    `Khối Thịnh vượng chung`, các đại từ `họ`, `ta`, `cậu`, và câu nhận xét của Cazor
    `“Quà riêng của một gã Khối Thịnh vượng chung khó ưa. Đồ ăn nước họ thì tệ hại,
    vậy mà lại gửi cho ta một người tốt bụng, cậu nói có phải không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000026: locks: [''Giữ câu hỏi ngắn
    `“Sao cơ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000027: locks: [''Giữ tình thái
    gián tiếp `Nghe nói`, các đại từ `ông ta` (chỉ viên tình báo Khối Thịnh vượng
    chung), `cậu` (chỉ Sue), và chi tiết `Ông ta khắc tên viết tắt của cậu lên đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000028: locks: [''Giữ chữ viết
    tắt `A.S.`, đại từ tự xưng `tôi`, và câu hỏi `“Ồ, A.S. là tên viết tắt của tôi
    à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000029: locks: [''Giữ đại từ trần
    thuật `Ông` / `ông`, giả định trước đó `Ông cứ tưởng mấy chữ khắc kia là logo
    nhà máy`, và vế kết `thấy người ta đã bỏ công đến vậy, ông mỉm cười`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000030: locks: [''Giữ toàn bộ đoạn
    độc thoại nội tâm in nghiêng `*...*` theo `DEC-P01-002`, đại từ nội tâm `mình`
    (`con gái mình`), `con bé`, cụm `tay tình báo đó`, và tên riêng `Albion` theo
    mục `vol02-ch04-b02-albion`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000031: locks: [''Giữ tên hãng
    `Arnold & Smith Weapons` và câu phỏng đoán `“Chắc là chữ viết tắt của Arnold &
    Smith Weapons chứ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000032: locks: [''Giữ phủ định
    và tình thái `“Không, hình như tên đó được đóng ở mặt dưới.”` cùng chức danh –
    tên riêng `Nghị viên Cazor`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000033: locks: [''Giữ định danh
    `Khối Thịnh vượng chung`, đại từ `cậu`, đơn vị tiền tệ `một trăm pount` theo mục
    `vol02-ch04-b02-pounts`, và cấp bậc xưng hô `Đại tá`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000034: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng chỉ ở câu đầu `*Cảm ơn con đã tặng cha món quà tuyệt vời
    thế này, con yêu.*` theo `DEC-P01-002`, cặp xưng hô `con` / `con yêu` – `cha`,
    và câu trần thuật không in nghiêng tiếp theo `Ông muốn hôn con bé nếu có thể.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000035: locks: [''Giữ câu độc thoại
    nội tâm in nghiêng `*…Thì ra sức mạnh của một trăm người là như thế này.*` theo
    `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000036: locks: [''Giữ đại từ tự
    xưng `Tôi` và câu nói của Sue `“Tôi tự hào vì có một gia đình hạnh phúc như vậy.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000037: locks: [''Giữ câu thoại
    đã sửa theo M4 và được nghiệm thu (`“Xin lỗi, Đại tá. E rằng chúng ta sắp phải
    đòi hỏi ở cậu quá nhiều.”`), cấp bậc `Đại tá`, đại từ `chúng ta`, và đại từ ngôi
    thứ hai `cậu` đồng bộ xuyên suốt cả cảnh theo mục `vol02-ch04-b02-cazor-sue-address`.'']'
  non_canon: true
