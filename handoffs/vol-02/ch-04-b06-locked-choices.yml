- segment_id: YS-LN02/Text/part0022.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000114: names_and_ranks: [''Tanya
    -> Tanya'', ''Lieutenant Serebryakov -> Thiếu úy Serebryakov'', ''Lieutenant Weiss
    -> Trung úy Weiss'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu
    Tanya bằng "nó" (theo DEC-P01-001)'']: pov_and_logic: [''Điểm nhìn ngôi thứ ba
    bám sát Tanya; giữ nguyên quan hệ thời gian và tư thế cầm ống nghe một tay, tay
    kia cầm sẵn bút chực ghi chú lên tấm bản đồ đã bảo Trung úy Weiss trải trên bàn'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000115: names_and_ranks: [''Major
    von Degurechaff -> Thiếu tá von Degurechaff'', ''203rd Aerial Mage Battalion ->
    Tiểu đoàn Pháp sư Không quân 203'', ''General Staff -> Bộ Tổng tham mưu'']: pronouns_and_address:
    [{''Thoại điện thoại công vụ'': ''Tanya xưng "Chúng tôi" đại diện tiểu đoàn, gọi
    phía hải quân là "các anh" ("các tàu của các anh")''}]: pov_and_logic: [''Lời
    thoại trực tiếp xác nhận nhiệm vụ hỗ trợ tàu hải quân do Bộ Tổng tham mưu giao
    và hỏi tình hình hiện tại'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000116: names_and_ranks: [''second
    fleet of battle cruisers -> Hạm đội tuần dương chiến đấu thứ hai'', ''Kiël naval
    base -> căn cứ hải quân Kiël'', ''Submarine Task Force 13 -> Lực lượng đặc nhiệm
    Tàu ngầm 13'']: pronouns_and_address: [''Lời thoại báo cáo khách quan từ đầu dây
    hải quân, không thêm đại từ xưng hô suy diễn'']: pov_and_logic: [{''Giữ đúng trình
    tự tác chiến'': ''Hạm đội tuần dương chiến đấu thứ hai đã rời căn cứ hải quân
    Kiël, và Lực lượng đặc nhiệm Tàu ngầm 13 đã xuất phát trước để thiết lập mạng
    lưới tuần tra''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000117: names_and_ranks: [''navy
    -> hải quân'', ''battle cruisers -> các tàu tuần dương chiến đấu'']: pronouns_and_address:
    [''Trần thuật quy chiếu Tanya bằng "nó", quy chiếu đầu mối bên hải quân bằng "ông
    ta"'']: pov_and_logic: [''Trần thuật ngôi thứ ba; giữ trạng thái các tàu tuần
    dương chiến đấu được điều động khẩn cấp đã bắt đầu tìm kiếm địch'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000118: names_and_ranks: [''vanguard
    -> đội tiên phong'', ''battleships -> các thiết giáp hạm'']: pronouns_and_address:
    [''Thoại của Trung úy Weiss dùng đại từ bao gộp "chúng ta"'']: pov_and_logic:
    [''Giữ câu hỏi xác nhận vai trò làm đội tiên phong cho các thiết giáp hạm và thái
    độ hào hứng nhẹ nhàng của Weiss'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000119: names_and_ranks: [''Lieutenant
    Weiss -> Trung úy Weiss'', ''Tanya -> Tanya'', ''vice commander -> phó chỉ huy'',
    ''vanguard -> đội tiên phong'']: pronouns_and_address: [''Trần thuật giữ tên riêng
    "Tanya", quy chiếu Weiss bằng "anh ta", quy chiếu tập thể tiểu đoàn bằng "đơn
    vị"'']: pov_and_logic: [''Giữ đánh giá tích cực của Tanya về một phó chỉ huy biết
    để ý đến tinh thần binh sĩ và nhận định thực tế rằng chỉ riêng việc làm đội tiên
    phong cũng đủ tạo ấn tượng tốt cho đơn vị'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000120: names_and_ranks: [''rapid-response
    mage battalion -> tiểu đoàn pháp sư phản ứng nhanh'']: pronouns_and_address: [{''Tanya
    nói với Trung úy Weiss'': ''gọi "Anh", tự quy chiếu đơn vị bằng "Chúng ta" / "chúng
    ta"''}]: pov_and_logic: [''Lời nhắc điềm tĩnh mang tính công vụ rằng nhiệm vụ
    tiên phong khẩn cấp vốn là chức trách đương nhiên của một tiểu đoàn pháp sư phản
    ứng nhanh'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000121: names_and_ranks: [''unit
    -> đơn vị'', ''sortie -> xuất kích'']: pronouns_and_address: [''Trần thuật quy
    chiếu Tanya bằng "nó", quy chiếu binh sĩ trong đơn vị bằng "họ"'']: pov_and_logic:
    [''Trần thuật ngôi thứ ba nối kết cảnh nhận báo cáo sẵn sàng xuất kích và đi ra
    gặp toàn đơn vị'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000122: names_and_ranks: [''commander
    -> Chỉ huy'']: pronouns_and_address: [{''Khẩu lệnh thông báo chỉ huy tới của binh
    sĩ'': ''Chỉ huy!''}]: pov_and_logic: [''Giữ sự ngắn gọn, trang nghiêm của khẩu
    lệnh quân sự khi chỉ huy bước vào'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000123: names_and_ranks: [''Battalion
    Commander Tanya von Degurechaff -> Tiểu đoàn trưởng Tanya von Degurechaff'', ''Weiss
    -> Weiss'']: pronouns_and_address: [''Các câu trần thuật ngôi thứ ba (câu 1, 3,
    4) quy chiếu Tanya bằng "nó"; câu độc thoại nội tâm ngôi thứ nhất (câu 2) tự quy
    chiếu bằng "Mình" / "mình"; quy chiếu Weiss và binh sĩ bằng "họ"'']: pov_and_logic:
    [''Bảo toàn sự chuyển đổi ngôi giữa trần thuật ngôi thứ ba và độc thoại nội tâm
    ngôi thứ nhất (DEC-P01-001), cũng như sự tương phản giữa vẻ ngoài điềm tĩnh và
    tâm trạng chán ngán bên trong của Tanya'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000124: names_and_ranks: [''Lieutenant
    Weiss -> Trung úy Weiss'']: pronouns_and_address: [''Khẩu lệnh ngắn của Tanya
    với đơn vị ("Cảm ơn. Nghỉ.") và gọi tên cấp bậc "Trung úy Weiss?" để chuyển quyền
    phổ biến tình hình'']: pov_and_logic: [''Giữ nhịp thoại điều lệnh ngắn gọn của
    chỉ huy tiểu đoàn'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000125: names_and_ranks: [''Ma’am
    -> Thưa chỉ huy'', ''briefing -> phổ biến tình hình'']: pronouns_and_address:
    [''Trung úy Weiss đáp lễ Tanya bằng "Thưa chỉ huy" và tự xưng "tôi"'']: pov_and_logic:
    [''Xác nhận tiếp nhận phần phổ biến tình hình trước toàn tiểu đoàn'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000126: names_and_ranks: [''subordinates
    / reports -> cấp dưới'', ''officers -> sĩ quan'', ''superior -> Cấp trên'']: pronouns_and_address:
    [''Phát biểu khái quát vô nhân xưng trong nội tâm của Tanya về nguyên tắc tổ chức
    và phân cấp chỉ huy'']: pov_and_logic: [{''Giữ trọn lập luận quản trị'': ''giao
    việc phiền phức cho cấp dưới vừa là đặc quyền vừa là bổn phận của sĩ quan; cấp
    trên giành việc của cấp dưới sẽ làm đảo lộn trật tự tổ chức''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000127: names_and_ranks: [''scout
    plane -> máy bay trinh sát'', ''224th Night Reconnaissance Team -> Đội Trinh sát
    Đêm 224'']: pronouns_and_address: [''Lời phổ biến tình hình khách quan của Trung
    úy Weiss'']: pov_and_logic: [''Giữ chính xác mốc thời gian ("Trước rạng đông hôm
    qua"), đơn vị trinh sát ("Đội Trinh sát Đêm 224") và đối tượng phát hiện ("một
    đoàn tàu tập hợp")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000128: names_and_ranks: [''Entente
    Alliance -> Liên minh Entente'', ''battleships -> thiết giáp hạm'', ''coastal
    defense ship -> tàu phòng thủ bờ biển'', ''Empire -> Đế quốc'']: pronouns_and_address:
    [''Nhận định chiến thuật khách quan trong dòng quan sát của Tanya (lược đại từ
    ngôi thứ hai khái quát bằng cấu trúc tiếng Việt tự nhiên "ngang tầm một thế lực
    trên trường quốc tế")'']: pov_and_logic: [{''Giữ quan hệ nhượng bộ và phủ định
    bộ phận'': ''Liên minh Entente vốn chẳng phải cường quốc hải quân, nhưng đội hình
    vũ khí này vẫn là mối đe dọa đáng gờm mà ngay cả Đế quốc cũng không thể xem nhẹ''}]:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000129: names_and_ranks: [''Tanya
    -> Tanya'', ''combat vessels -> chiến hạm'', ''battleship’s naval gun -> pháo
    hạm của một thiết giáp hạm'', ''division of infantry -> sư đoàn bộ binh'', ''marine
    mage -> pháp sư thủy quân lục chiến'']: pronouns_and_address: [''Trần thuật ngôi
    thứ ba giữ tên riêng "Tanya" và đại từ "nó" (DEC-P01-001)'']: pov_and_logic: [''Giữ
    nguyên phép so sánh lượng hỏa lực (pháo hạm của một thiết giáp hạm bắn ra lượng
    sắt nhiều hơn hẳn cả một sư đoàn bộ binh) và hai tầng phòng thủ kết hợp (hỏa lực
    phòng không dày đặc như lông nhím cùng các pháp sư thủy quân lục chiến đánh chặn)'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000130: names_and_ranks: [''U.S.
    ships -> các tàu của Hợp chúng quốc'', ''Marianas -> quần đảo Mariana'']: pronouns_and_address:
    [''Quy chiếu các chiến hạm Liên minh Entente bằng "chúng"'']: pov_and_logic: [''Giữ
    sắc thái phỏng đoán ("có lẽ dễ tiếp cận hơn...") và câu kết mở về mức độ chênh
    lệch ("Chỉ là dễ hơn đến mức nào thôi.")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000131: names_and_ranks: [''General
    Staff -> Bộ Tổng tham mưu'', ''Entente Alliance fleet -> hạm đội Liên minh Entente'']:
    pronouns_and_address: [''Lời thuyết trình của Trung úy Weiss kèm câu hỏi tu từ
    tương tác với cử tọa ("Rõ như ban ngày, phải không?")'']: pov_and_logic: [''Giữ
    kết luận phân tích của Bộ Tổng tham mưu rằng đây là những lực lượng chủ lực còn
    lại của hạm đội Liên minh Entente đang tìm cách tháo chạy'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000132: names_and_ranks: [''Republic
    -> Cộng hòa'', ''Commonwealth -> Khối Thịnh vượng chung'', ''imperial pursuit
    -> quân Đế quốc truy kích'']: pronouns_and_address: [''Nội tâm Tanya dùng "Chúng
    ta" cho phía Đế quốc và "chúng" cho hạm đội Liên minh Entente đang tháo chạy'']:
    pov_and_logic: [''Giữ hai khả năng lộ trình đối lập (đường thẳng tới Cộng hòa
    hoặc đường vòng vèo tới Khối Thịnh vượng chung) và mục đích của hai phía (cắt
    đuôi truy kích tẩu thoát đối lập với xác định vị trí và tiêu diệt)'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000133: names_and_ranks: [''Commonwealth
    Navy -> Hải quân Khối Thịnh vượng chung'', ''territorial waters / imperial waters
    -> lãnh hải của ta / lãnh hải Đế quốc'']: pronouns_and_address: [''Nội tâm Tanya
    dùng "Chúng ta" / "Ta" / "ta" cho phía Đế quốc và "họ" cho phía Hải quân Khối
    Thịnh vượng chung'']: pov_and_logic: [{''Bảo toàn thế giằng co ngoại giao – quân
    sự hai chiều'': ''một mặt đơn vị được thông báo phải tránh bắn lạc, mặt khác Đế
    quốc cũng đã cảnh báo bất kể chuyện gì xảy ra ngoài khơi, hễ xâm phạm lãnh hải
    Đế quốc thì sẽ bị bắn''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000134: names_and_ranks: [''Fleet
    Command -> Bộ Tư lệnh Hạm đội'', ''Entente Alliance vessels -> các tàu của Liên
    minh Entente'', ''General Staff -> Bộ Tổng tham mưu'']: pronouns_and_address:
    [''Lời phổ biến của Trung úy Weiss dùng "đơn vị chúng ta" cho Tiểu đoàn 203 và
    "họ" cho các chiến hạm của Bộ Tư lệnh Hạm đội'']: pov_and_logic: [''Phân biệt
    rõ mệnh lệnh của Bộ Tư lệnh Hạm đội cho các chiến hạm (tìm diệt tàu Liên minh
    Entente) và mệnh lệnh của Bộ Tổng tham mưu cho tiểu đoàn (hỗ trợ họ)'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000135: names_and_ranks: [''Lieutenant
    Weiss -> Trung úy Weiss'']: pronouns_and_address: [{''Độc thoại nội tâm ngôi thứ
    nhất của Tanya'': ''quy chiếu Weiss bằng "anh ta", tự quy chiếu bằng "mình" (DEC-P01-001)''}]:
    pov_and_logic: [''Giữ nguyên lý do mang màu sắc công sở của Tanya khi tiếp lời
    Weiss (không muốn trông như nhận lương mà không làm gì)'']: emphasis: [''Giữ nguyên
    dấu nhấn mạnh Markdown `*hỗ trợ*` đúng vị trí từ in nghiêng trong nguồn theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000136: names_and_ranks: [''Battalion
    -> Tiểu đoàn'', ''Reconnaissance Mage Task Force 2 -> Lực lượng đặc nhiệm Pháp
    sư Trinh sát 2'', ''Northern Sea Fleet Command -> Bộ tư lệnh Hạm đội Biển Bắc'']:
    pronouns_and_address: [{''Tanya phát biểu trước toàn đơn vị'': ''gọi "Tiểu đoàn",
    quy chiếu Trung úy Weiss bằng "anh ấy", dùng "chúng ta" cho tiểu đoàn và "họ"
    cho tàu của quốc gia trung lập''}]: pov_and_logic: [''Giữ dấu nháy đơn mang sắc
    thái mỉa mai quanh cụm `‘quốc gia trung lập’` và chỉ thị không được bắn trúng
    họ'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000137: names_and_ranks: [''scouts
    -> các trinh sát'', ''Commonwealth -> Khối Thịnh vượng chung'', ''Entente Alliance
    -> Liên minh Entente'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya
    dùng "ta" cho phía Đế quốc và "họ" cho phía Khối Thịnh vượng chung đang tập trận'']:
    pov_and_logic: [{''Giữ trọn mạch suy nghĩ ba vế'': ''thông cảm với sự vất vả của
    lực lượng trinh sát dưới trời mưa, nhận xét sự trái khoáy khi phải cử đơn vị canh
    chừng cuộc tập trận của Khối Thịnh vượng chung trong lúc đang tìm Liên minh Entente,
    và quyết định giữ kín nhận xét đó để không làm giảm sĩ khí''}]: emphasis: none'
  non_canon: true
