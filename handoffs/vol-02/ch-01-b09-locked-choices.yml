segment_id_end: YS-LN02/Text/part0010.xhtml/p000243
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000219
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000219: locks: [''Giữ lời quát
    lắp bắp `“C-câm miệng!”`, đúng phạm vi nhấn mạnh câu nội tâm theo DEC-P01-002
    `*Con bé này đang đùa giỡn với chúng ta…*`, tên riêng `Tanya`, danh xưng cấp bậc
    đã sửa theo M4 `Trung úy Weiss`, đại từ `hắn` chỉ viên sĩ quan cấp cao nhất có
    mặt, và phủ định cuối câu `điều đầu tiên không diễn ra theo kế hoạch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000220
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000220: locks: [''Giữ cách gọi
    lịch sự mỉa mai `Các vị` và các thuật ngữ `Đế quốc`, `tù binh` trong hai câu hỏi
    của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000221
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000221: locks: [''Giữ cấu trúc
    điều kiện `Nếu họ đầu hàng, Tanya sẽ buộc phải…`, các thuật ngữ `tù binh chiến
    tranh thông thường`, `ba sư đoàn`, `bộ phận Hậu cần`, cùng sự phân bổ đại từ trần
    thuật `Tanya` / `nó` đã sửa theo M1 và DEC-P01-001 (`khiến nó choáng váng`, `giết
    chóc không phải sở thích của nó`, `theo cách nhìn của chính Tanya, nó đang làm
    vậy`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000222
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000222: locks: [''Giữ danh xưng
    `Quân đội Dacia` và câu phủ định bác bỏ `đời nào chịu đầu hàng!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000223
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000223: locks: [''Giữ mệnh lệnh
    lạnh lùng của Tanya và ngoại lệ quan trọng `“Mất thời gian quá. Bắn hết mọi người,
    trừ vị tướng kia.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000224
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000224: locks: [''Giữ phủ định
    `họ không hiểu` và tên riêng `Tanya` đã thay cho `cô` theo M1 ở vế sau.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000225
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000225: locks: [''Giữ cụm sở hữu
    đã khử mơ hồ theo M1 `Đại đội pháp sư của Tanya`, các thuật ngữ `giao chiến ở
    cự ly gần`, `nhân viên sở chỉ huy`, `đại đội`, `sách giáo khoa Dacia`, và cụm
    giới hạn loại vũ khí đã sửa theo M2 `Chỉ với súng ngắn mà đối đầu với pháp sư
    ở cự ly gần chẳng khác nào tự sát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000226: locks: [''Giữ đại từ `Họ`,
    cụm `Đại đội của Tanya`, các thuật ngữ `tù binh cấp cao`, `Bộ Tổng Tham mưu` và
    hình ảnh so sánh `như một băng trộm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000227: locks: [''Giữ thuật ngữ
    tạm `Đặt bẫy đi` và chỉ dẫn vị trí `đặt cạnh cái đầu kia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000228
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000228: locks: [''Giữ các danh
    xưng `đám lính Dacia hỗn loạn`, `sở chỉ huy của chúng`, tên riêng `Tanya` và cụm
    ẩn dụ mỉa mai `một món quà chia tay nho nhỏ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000229
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000229: locks: [''Giữ đại từ `chúng
    ta`, chi tiết `Cái đầu của viên sĩ quan mà chúng ta dựng lên sắp nổ tung rồi`
    và nhận định `Chắc chắn sẽ rất hiệu quả với đám kia.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000230
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000230: locks: [''Giữ thuật ngữ
    đã signoff `gài bẫy nổ vào một cái xác`, các cụm `giáng đòn mạnh vào tinh thần`,
    `nhân viên sở chỉ huy` và nhận xét hiệu quả chi phí ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000231
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000231: locks: [''Giữ câu nói đùa
    nối mạch ẩn dụ du lịch `“Giá mà có tờ rơi về các chuyến tham quan theo đoàn…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000232
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000232: locks: [''Giữ cấp bậc `Trung
    úy`, cặp đại từ `anh` – `Tôi` và thuật ngữ tạm `con dấu nhập cảnh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000233
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000233: locks: [''Giữ câu quát
    chấn chỉnh của Tanya `“Này, đừng có đùa với xác chết! Nghiêm túc với cuộc chiến
    này đi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000234
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000234: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` (`Quân của nó phải luôn cảnh giác`), tham chiếu
    lịch sử giữ nguyên không chú thích `nước Ý vô dụng bị Ethiopia đánh bật`, và đại
    từ tự quy chiếu nội tâm ngôi thứ nhất `mình` đã sửa theo M1 và DEC-P01-001 ở vế
    cuối `; mình sẽ chẳng thể ngẩng mặt lên được.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000235
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000235: locks: [''Giữ tên riêng
    `Tanya` kết hợp đại từ trần thuật `nó` theo DEC-P01-001, cùng các danh xưng và
    thuật ngữ `Quân đội Công quốc`, `Tiểu đoàn Pháp sư Không quân 203`, `không có
    yểm trợ trên không lẫn ma pháp`, `công nghệ quân sự hiện đại và cổ đại`, `Quân
    đội Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000236: locks: [''Giữ danh xưng
    `Đội hình Quân đội Dacia` và mô tả cảnh tượng chiến trường ở vế sau.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000237
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000237: locks: [''Giữ đại từ `chúng
    ta`, các thuật ngữ `nhân viên chỉ huy`, `người kế nhiệm`, và câu khẳng định phủ
    định ở cuối đoạn `Không đời nào giành lại được quyền kiểm soát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000238
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000238: locks: [''Giữ các thuật
    ngữ `quân đội Dacia`, `tập kích bất ngờ`, `chiến thuật chiến tranh chớp nhoáng`,
    `bộ binh không được yểm trợ`, `Đế quốc`, `sĩ quan Dacia`, `huân chương`, và biệt
    danh chơi chữ đã sửa theo M3 và signoff `gã Khốn-guchi ở Imphal`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000239
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000239: locks: [''Giữ cách gọi
    `Trung úy Weiss!` và câu hỏi `Đơn vị của anh đã tập hợp đủ chưa?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000240
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000240: locks: [''Giữ lời đáp quân
    sự `“Rõ, Thiếu tá. Còn những người khác thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000241
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000241: locks: [''Giữ đúng phạm
    vi nhấn mạnh câu hỏi giả định theo DEC-P01-002 `*Chúng ta có nên quét sạch bọn
    chúng không?*`, tên riêng `Tanya`, các đại từ `anh ta` / `Gã này` quy chiếu Weiss,
    và nhận xét cuối đoạn `quả là một nhân tố xuất sắc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000242
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000242: locks: [''Giữ thuật ngữ
    tạm đã signoff `Đội bay của chúng ta` trong câu hỏi xác nhận của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000243
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000243: locks: [''Giữ hai lần lặp
    tên `Tanya` đã sửa theo M1 (thay cho `cô`), đại từ `anh ta` quy chiếu Weiss, cấu
    trúc đối lập thời gian `Trước đó… nhưng giờ thì không nữa.` và cụm `mẹo quản lý
    nhân sự trong quân đội`.'']'
  non_canon: true
