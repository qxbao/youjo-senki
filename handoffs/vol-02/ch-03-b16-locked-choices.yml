task_id: vol-02-ch-03-b16
baseline_sha256: 785d8e69e6b7365a2802ac74f2e94fc9e8074315c50fea79e2f86ff60dacc86d
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 200b552f0ab47e8d36ba42bc294c2168cd5ff35cbe4b8cba4074a8021b44cd10
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 42
segment_id_start: YS-LN02/Text/part0018.xhtml/p000215
segment_id_end: YS-LN02/Text/part0018.xhtml/p000256
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000215
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000215: locks: [''Giữ cách gọi
    cấp bậc `Trung úy` theo mục `vol02-ch03-b16-lieutenant`, `vol02-ch03-b16-address-pronouns`
    và bản sửa M2 đã nghiệm thu, đại từ `Tôi`, cùng các mục tiêu `chiếm khẩu đội Albert`,
    `đảm nhiệm khẩu đội Narva như kế hoạch` theo mục `vol02-ch03-b16-battery`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000216
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000216: locks: [''Giữ câu đáp `Đã
    rõ.`, đại từ `chúng ta`, thuật ngữ `im lặng vô tuyến` theo mục `vol02-ch03-b16-radio-silence`,
    và chức danh `Phó chỉ huy Weiss` theo mục `vol02-ch03-b16-vice-commander`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000217
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000217: locks: [''Giữ cấu trúc
    điều kiện hai chiều `Nếu không chiếm được vị trí, hãy liên lạc với tôi ngay. Còn
    nếu thành công...`, đại từ `tôi`, `ta`, và các thuật ngữ `giữ im lặng vô tuyến`,
    `quân tiếp viện của ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000218: locks: [''Giữ câu hỏi `“Còn
    quân tiếp viện của địch thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000219
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000219: locks: [''Giữ đại từ `tôi`,
    `chúng`, và hai vế đối lập `Nếu không xử lý nổi thì cứ khóc lóc chạy đến tìm tôi.
    Còn không thì nghiền nát chúng đi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000220
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000220: locks: [''Giữ lời đáp trung
    lập về giới theo chức vụ `“Vâng, thưa chỉ huy.”` theo mục `vol02-ch03-b16-maam`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000221
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000221: locks: [''Giữ đại từ nội
    tâm số nhiều `chúng ta`, `ta`, và các cụm `cập nhật cho binh lính những thông
    tin cần thiết—chúng ta đúng là những người truyền đạt mẫu mực`, `những lý do rõ
    rành rành khiến ta có thể thất bại, nên chuẩn bị tốt nhất là loại bỏ chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000222
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000222: locks: [''Giữ bản đồ cấp
    bậc và cách gọi theo cấp bậc đã khóa tại mục `vol02-ch03-b16-lieutenant`, `vol02-ch03-b16-address-pronouns`
    cùng bản sửa M1, M2 đã nghiệm thu: `thiếu úy Serebryakov, thiếu úy sẽ là chỉ huy
    dự bị của chúng ta`, `Nếu trung úy Weiss và tôi mất liên lạc, hãy ra lệnh rút
    lui.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000223
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000223: locks: [''Giữ câu hỏi lại
    trung lập theo chức vụ `“Rút lui ạ, thưa chỉ huy?”` theo mục `vol02-ch03-b16-maam`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000224
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000224: locks: [''Giữ cách gọi
    theo cấp bậc `thiếu úy` ở cả hai câu theo mục `vol02-ch03-b16-address-pronouns`
    và bản sửa M2 đã nghiệm thu, đại từ `chúng ta` / `Chúng ta`, cùng các cụm `mất
    tín hiệu của chúng ta`, `địch được trang bị đầy đủ`, `chim hoàng yến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000225
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000225: locks: [''Giữ hình ảnh
    ẩn dụ `Chim hoàng yến trong mỏ than cảnh báo nguy hiểm bằng cái chết của mình`,
    đại từ `ta`, và câu `quân đội coi trọng mạng sống của ta ngang với chim hoàng
    yến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000226: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` ở cả ba vị trí theo `DEC-P01-001`, và các cụm
    `hoàn toàn không có ý định cao thượng hy sinh bản thân`, `thoát thân bằng đường
    không`, `lòng trung thành của nó với Đế chế chỉ đến thế thôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000227: locks: [''Giữ đại từ `tôi`
    và câu thoại hưởng ứng ẩn dụ chim hoàng yến `“Vậy tôi sẽ cố cất tiếng hót thật
    ngọt ngào.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000228
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000228: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `Mình` theo `DEC-P01-001` và đúng phạm vi lời khen nhắm vào câu
    đùa vừa nói `Mình cũng đành phải chịu thua câu đùa đó của Weiss.` theo mục `vol02-ch03-b16-tanya-thought`
    và bản sửa M3 đã nghiệm thu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000229
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000229: locks: [''Giữ đại từ `Tôi`,
    cách gọi theo cấp bậc `trung úy` theo mục `vol02-ch03-b16-address-pronouns` và
    bản sửa M2 đã nghiệm thu, cùng mệnh lệnh `Chuẩn bị xuất phát!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000230
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000230: locks: [''Giữ lời đáp `“Rõ,
    thưa chỉ huy!”` đồng bộ với p000220 và p000223.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000231
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000231: locks: [''Giữ tên riêng
    `Tanya` và chuỗi hành động `lấy dù, kiểm tra lần cuối trước khi nhảy và hài lòng
    gật đầu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000232
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000232: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `mình` theo `DEC-P01-001` và câu `Nếu đã không còn lựa chọn nào
    khác ngoài việc đi, ít nhất mình cũng nên làm cho tử tế.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000233
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000233: locks: [''Giữ khẩu lệnh
    nhảy dù `“Được rồi! Nhảy!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000234
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000234: locks: [''Giữ danh xưng
    `đại tá Anson Sue thuộc Quân đội Liên minh Entente`, tên riêng `Tanya`, và cụm
    `chuẩn bị kỹ lưỡng cho trận chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000235
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000235: locks: [''Giữ câu báo động
    `“Địch tấn công!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000236: locks: [''Giữ các đại từ
    `Chúng ta`, `chúng`, thuật ngữ `tín hiệu mana` theo mục `vol02-ch03-b16-mana`,
    và tên đơn vị `Đội áp chế` theo mục `vol02-ch03-b16-suppression-squad`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000237
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000237: locks: [''Giữ cụm `Đơn
    vị của đại tá Sue`, các đại từ `họ`, `ông`, và các cụm `bảo vệ vùng biển`, `tình
    trạng sẵn sàng chiến đấu hoàn hảo`, `nỗi kinh hoàng khi hoàn toàn mất thế chủ
    động trong chiến trận`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000238
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000238: locks: [''Giữ đại từ `họ`
    trung tính không tự gán chủ thể hẹp và câu `Kể từ khi họ bất cẩn khơi mào cuộc
    chiến, áp lực cứ ngày một tăng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000239
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000239: locks: [''Giữ hai câu hỏi
    trách móc `“Bị tấn công lúc đang ngủ ư? Quân đội còn huấn luyện binh sĩ cho đàng
    hoàng nữa không vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000240
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000240: locks: [''Giữ tên riêng
    `Sue`, đại từ `họ`, thuật ngữ `các khẩu pháo bờ biển` theo mục `vol02-ch03-b16-coastal-guns`,
    và cụm `gọi quân dự bị từ hậu phương lên`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000241
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000241: locks: [''Giữ câu hỏi ngắn
    `“…Tình hình địch?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000242
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000242: locks: [''Giữ đại từ `ông`
    ở cả hai vị trí, các thuật ngữ `đòn quấy nhiễu`, `phân tán lực lượng`, `một thành
    phố ở tuyến sau như Os`, và cụm `đủ bình tĩnh để than phiền về những chuyện như
    vậy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000243
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000243: locks: [''Giữ đại từ `ông`,
    danh xưng `đại tá Sue`, đại từ phản thân `mình`, và cụm `không hiểu cốt lõi cảm
    xúc của mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000244
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000244: locks: [''Giữ đại từ `ông`
    và câu `Nhưng ít nhất cho đến lúc đó… ông vẫn chưa hiểu tình hình nghiêm trọng
    đến mức nào.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000245
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000245: locks: [''Giữ đại từ `Tôi`
    và các thuật ngữ `các đơn vị ven biển đang giao chiến`, `các tàu tuần tra hình
    như đã không liên lạc định kỳ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000246
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000246: locks: [''Giữ thuật ngữ
    `tuyến tuần tra` tách biệt với `tuyến cảnh giới` ở p000248/p000252 theo mục `vol02-ch03-b16-picket-lines`,
    cùng câu `Có thể là một cuộc tập kích bất ngờ của pháp sư bay ra từ tàu ngầm.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000247
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000247: locks: [''Giữ tên riêng
    `Sue`, đại từ `Họ` / `họ`, tên tổ chức `Hải quân Liên minh Entente`, và các thuật
    ngữ quân sự – hải quân `một đơn vị biệt kích`, `tàu ngầm`, `lực lượng tuần duyên`,
    `các chiến dịch ma pháp` (mục `vol02-ch03-b16-magic-operations`), `tập trận biển
    sâu định kỳ`, `bị tước vũ khí như tàu chiến tại một quốc gia trung lập`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000248
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000248: locks: [''Giữ tên riêng
    `Sue`, các đại từ `họ`, `Ông`, phản thân `mình`, cụm `chuẩn bị xuất kích`, `nhân
    viên vô tuyến`, và thuật ngữ đã khóa `tuyến cảnh giới` theo mục `vol02-ch03-b16-picket-lines`
    và bản sửa M4 đã nghiệm thu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000249
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000249: locks: [''Giữ các đại từ
    `Tôi`, `họ`, và câu báo cáo `“Tôi đã gọi họ, nhưng không tàu nào trả lời…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000250
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000250: locks: [''Giữ các đại từ
    `Anh`, `họ`, và câu hỏi `“Anh nghĩ có sự cố gì đó khiến họ không liên lạc được
    không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000251
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000251: locks: [''Giữ đại từ `ông`
    và câu chuyển ngoặt nhận thức `Đó là lúc ông hiểu ra tình hình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000252
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000252: locks: [''Giữ cặp thuật
    ngữ đồng gốc `Tàu trên tuyến cảnh giới đã mất liên lạc` và `cả tuyến cảnh giới
    trên mặt biển đều im bặt` theo mục `vol02-ch03-b16-picket-lines` cùng bản sửa
    M4 đã nghiệm thu, và câu kết `Không, điều đó có nghĩa là nguồn cơn rắc rối nằm
    trên mặt biển!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000253: locks: [''Giữ đại từ `Chúng`
    và chuỗi mệnh lệnh khẩn cấp `“…Chết tiệt! Chúng nhắm vào các khẩu pháo sao? Xuất
    kích! Mau lên!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000254
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000254: locks: [''Giữ thuật ngữ
    `Pháp sư địch đang bất ngờ tập kích các khẩu đội` theo mục `vol02-ch03-b16-battery`,
    đại từ `họ`, và cụm `mất liên lạc với những con tàu ngoài biển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000255
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000255: locks: [''Giữ thán từ nghi
    vấn `“Hả?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000256
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000256: locks: [''Giữ câu cảnh
    báo `“Các khẩu pháo đều chĩa thẳng ra phía trước!”`.'']'
  non_canon: true
