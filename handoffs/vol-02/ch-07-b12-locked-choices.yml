choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000297
  kind: locked_constraint
  value: Giữ nguyên dấu ngoặc kép hội thoại, đại từ “cậu” (Weiss gọi Grantz) và câu
    hỏi phủ định “không biết hả?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000298
  kind: locked_constraint
  value: Giữ sự phân biệt đại từ “Anh” / “mình” (Weiss) và “cậu” / “cậu lính trẻ”
    (Grantz), chi tiết các “tân binh” mới chỉ trình diện nhận nhiệm vụ gần đây, cùng
    phủ định “Cậu không phải một trong những lính kỳ cựu từ thuở ban đầu của tiểu
    đoàn”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000299
  kind: locked_constraint
  value: Giữ quan hệ hệ quả việc được sáp nhập vội vã đến mức “chưa ai kịp dành thời
    gian cho những điều cơ bản ấy”, thuật ngữ “các thành viên đàn anh”, “lễ rửa tội
    bằng máu trên chiến trường” và “làn hỏa lực pháo binh thảm khốc”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000300
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở mệnh đề độc thoại đầu câu `*Thực ra,
    đây đại khái cũng chính là những gì bọn mình từng được nghe trong đợt tuyển chọn*`
    theo DEC-P01-002, đại từ nội tâm “bọn mình” và chủ thể “Weiss” ở vế trần thuật.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000301
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ gộp “Ta” và lời rủ ôn lại chuyện ngày
    xưa của Weiss.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000302
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Chúng ta đang có thời
    gian. Đây là cơ hội tuyệt vời để đôi bên tìm hiểu cách suy nghĩ của nhau.*` theo
    DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000303
  kind: locked_constraint
  value: Giữ thuật ngữ “lính phục vụ”, hành động Weiss ngồi lên bàn ngước mắt hồi
    tưởng, và bọc dấu nhấn mạnh `*...*` đúng ở mệnh đề nội tâm câu thứ hai `*Mình
    không ngờ trung úy cũng có thể lộ ra vẻ mặt như vậy*` theo DEC-P01-002 với đại
    từ “Mình” (Grantz) và danh từ cấp bậc viết thường “trung úy”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000304
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*…Weiss mà mình biết lúc
    nào cũng đeo chiếc mặt nạ trung úy.*` theo DEC-P01-002, dấu ba chấm mở đầu, đại
    từ “mình” (Grantz) và cụm ẩn dụ “chiếc mặt nạ trung úy”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000305
  kind: locked_constraint
  value: Giữ chủ thể “Anh” / “mình” (Grantz), quan hệ nhượng bộ giữa việc đã quen
    với cuộc sống trong tiểu đoàn và phủ định “thời gian anh ở đây thực chất vẫn chẳng
    dài chút nào”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000306
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp đại từ “Cậu – tôi” và định danh “đạo quân
    phía Đông” trong câu hỏi của Weiss.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000307
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “tôi” (Grantz) và câu trả lời phủ định
    “Không, tôi chưa nghe chuyện đó bao giờ.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000308
  kind: locked_constraint
  value: Giữ thuật ngữ “khóa đào tạo cấp tốc”, chi tiết tốt nghiệp sớm và bị ném thẳng
    ra “tiền tuyến” ngay khoảnh khắc ấy, cùng chủ thể “Anh” (Grantz) ở câu kết.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000309
  kind: locked_constraint
  value: Giữ tình thái giả định trái thực tế “Trong hoàn cảnh bình thường, hẳn anh
    đã được nghe kể về quá trình phục vụ của các đàn anh... nhưng đây lại là lần đầu
    tiên” và cấu trúc phủ định kép “cả Grantz lẫn bất kỳ ai trong lớp lính cũ đều
    chẳng hề nhận ra”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000310
  kind: locked_constraint
  value: Giữ dấu ngoặc kép ở hai phần lời thoại của Weiss, các phủ định “chẳng bao
    giờ bỏ rơi người”, “nơi không có lối mòn”, “không bao giờ khuất phục”, “không
    có gì bảo đảm mạng sống trở về”, cấp so sánh bậc nhất “những chiến trường tồi
    tệ nhất, phần thưởng ít ỏi nhất” và thuật ngữ “pháp sư”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000311
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở câu đầu `*Nghe quen không?*` theo DEC-P01-002,
    chủ thể “Weiss” / “anh” và các phủ định “chẳng cần câu trả lời, anh cũng biết
    Grantz không hiểu”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000312
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở mệnh đề đầu `*Mình thậm chí còn chẳng
    cần phải hỏi*` theo DEC-P01-002, định danh “Tiểu đoàn 203”, câu trích dẫn trong
    ngoặc đơn lồng trong ngoặc kép “‘Đừng mong toàn mạng trở về!’” và tình thái “có
    lẽ mọi thành viên đàn anh trong tiểu đoàn đều chia sẻ”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000313
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “tôi” / “mình”, cấp so sánh hơn “trẻ
    hơn bây giờ” và nhận định khái quát về việc các “pháp sư” lúc nào cũng tự đánh
    giá quá cao bản thân.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000314
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, danh xưng “thưa Trung úy”, cặp đại từ “Tôi –
    anh”, phủ định “Không đâu... Tôi không nghĩ anh—” và dấu gạch ngang dài ngắt lời
    ở cuối câu.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000315
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “Tôi / tôi / bọn tôi”, danh từ cấp bậc
    viết thường “thiếu tá” và phép so sánh phủ định “chẳng khác nào được sinh ra lần
    nữa”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000316
  kind: locked_constraint
  value: Giữ chuỗi phân từ bị động mô tả cảnh huấn luyện trên núi tuyết nơi “mọi lời
    phàn nàn đều vô ích”, bị “pháo binh” lấy làm mục tiêu và bị ép bay cao đến mức
    “suýt không thở nổi”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000317
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, phủ định “Tôi thực sự không thể tin nổi mình
    đã vượt qua được chuyện đó” và chủ thể trần thuật “anh” (Weiss).
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000318
  kind: locked_constraint
  value: Giữ cấu trúc điều kiện lặp ở hai câu đầu, danh xưng “chỉ huy” theo DEC-P01-001,
    hai từ đặt trong ngoặc kép “huấn luyện” và “luyện tập”, chi tiết “suýt làm anh
    lên cơn đau tim hai lần”, “có xen lẫn cả đạn thật” và tình thái “rất có thể còn
    đáng sợ hơn cả thực chiến”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000319
  kind: locked_constraint
  value: Giữ chức danh “phó chỉ huy”, định danh “Thiếu tá von Degurechaff”, danh xưng
    quy chiếu “thiếu tá” theo DEC-P01-001, chi tiết ngốn sạch ngân sách diễn tập hằng
    năm của cả một “trung đoàn hạng xoàng” và phần giải thích trong cặp dấu gạch ngang
    dài.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000320
  kind: locked_constraint
  value: Giữ phủ định tuyệt đối “chưa từng một lần tự hỏi”, danh xưng “chỉ huy” theo
    DEC-P01-001, hai địa danh “Dacia” và “Norden”, phần chêm trong cặp dấu gạch ngang
    dài và cụm định danh “vị phó chỉ huy của Thiếu tá von Degurechaff”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000321
  kind: locked_constraint
  value: Giữ chủ thể “Thiếu tá von Degurechaff”, đại từ “họ” (binh sĩ trong tiểu đoàn)
    và mạch ý trui rèn tiểu đoàn từng bước thành đơn vị dày dạn sức chiến đấu ngay
    trong lúc thực hiện nhiệm vụ và gặt hái chiến công.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000322
  kind: locked_constraint
  value: Giữ tình thái rào đón “Theo một nghĩa nào đó, có thể nói”, danh xưng “chỉ
    huy” theo DEC-P01-001 và ý gò ép tiểu đoàn thành lập vội vã vào khuôn khổ một
    đơn vị tinh nhuệ.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000323
  kind: locked_constraint
  value: Giữ danh xưng “chỉ huy” theo DEC-P01-001, phần chú thích trong ngoặc đơn
    “(và vào lúc ấy còn tự hỏi liệu mình có nghe nhầm không)” và thái độ kịch liệt
    phản đối việc hạ thấp tiêu chuẩn kỷ luật vì có thêm tân binh.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000324
  kind: locked_constraint
  value: Giữ tình thái quá khứ “lẽ ra anh phải ngạc nhiên”, danh xưng “chỉ huy” /
    “người chỉ huy” theo DEC-P01-001, tên riêng “Grantz” và sự chuyển dịch triết lý
    từ “đích thân tuyển chọn tinh nhuệ” sang “cưỡng bức bồi dưỡng”.
  non_canon: true
