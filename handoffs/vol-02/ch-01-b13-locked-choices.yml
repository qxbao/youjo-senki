task_id: vol-02-ch-01-b13
baseline_sha256: beab879875564004c9e522384ef9a7fcc80902f9cf56d843d5d84a749ad6808d
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: cca46a9e22d698eca6544e65f15e881ca6a5a155723cacbe46ddbe9405d1df7e
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 43
segment_id_start: YS-LN02/Text/part0010.xhtml/p000327
segment_id_end: YS-LN02/Text/part0010.xhtml/p000369
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000327
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000327: locks: [''Giữ lời thông
    báo mở đầu `“Ba mươi phút nữa chúng ta sẽ bắt đầu diễn tập.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000328
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000328: locks: [''Giữ câu hỏi tu
    từ và câu trả lời phủ định `Chắc là không.`, tên riêng `Rudersdorf`, `Zettour`,
    `Tanya`, cấu trúc giả định `Nếu người đưa ra cảnh báo có giọng điệu, giọng nói
    và cách ăn nói cứng rắn đến mức gần như hét lên rằng mình là quân nhân… thì lại
    là chuyện khác.`, và nhận xét mỉa mai `gạt nội dung sang một bên, lời thông báo
    nghe thật ấm lòng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000329
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000329: locks: [''Giữ nhận định
    dự đoán `Nhiều người sẽ cho rằng cùng lắm đó chỉ là trò đùa công phu, chẳng bận
    tâm mấy rồi cau có quay về ngủ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000330
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000330: locks: [''Giữ đại từ `Chúng
    tôi`, hai điểm biến âm trẻ con đã sửa theo signoff `chân chọng` và `mọi nười`,
    cùng cụm `chiến đấu công bằng, đúng theo luật pháp quốc tế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000331
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000331: locks: [''Giữ sự phân biệt
    giữa đại từ trần thuật `nó` / `Tanya` với đại từ độc thoại nội tâm `mình` ở câu
    cuối theo DEC-P01-001, các thuật ngữ `Type 95`, `Chúa`, `Being X`, và cấu trúc
    nhượng bộ `Ca ngợi Chúa và khẳng định Being X đã đủ tệ rồi, nhưng mình vẫn sẽ
    làm tròn nhiệm vụ đến cùng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000332
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000332: locks: [''Giữ đại từ trần
    thuật `nó` quy chiếu Tanya theo DEC-P01-001, tên riêng `Visha`, và cụm kết `cảm
    xúc chung của cả tiểu đoàn—một sự đoàn kết không lay chuyển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000333
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000333: locks: [''Giữ đại từ `cô`
    quy chiếu Visha và đúng phạm vi chữ nghiêng `*Thấp kém quá đấy, Thiếu tá.*` theo
    DEC-P01-002 và M1/M2 đã sửa trong signoff.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000334
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000334: locks: [''Giữ tên riêng
    `Tanya`, mệnh đề `lời giải thích hợp lý duy nhất cũng là trò đùa của đứa nhóc
    nào đó`, và đại từ `chúng tôi` ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000335: locks: [''Giữ câu hỏi gọi
    theo cấp bậc đã sửa theo signoff `“Thiếu tá, Thiếu tá đã từng diễn xuất chưa?”`,
    không dùng đại từ giới tính `chị`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000336
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000336: locks: [''Giữ cặp xưng
    hô `Tôi` – `cậu`, đại từ `họ` chỉ kẻ địch, và câu trả lời `“Diễn xuất ư? Tôi không
    rõ cậu muốn nói gì. Tôi chỉ mong họ mất cảnh giác thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000337
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000337: locks: [''Giữ đại từ trần
    thuật `nó` quy chiếu Tanya ở cả bốn vị trí theo DEC-P01-001, tên riêng `Tanya`,
    `Weiss`, đại từ `anh` quy chiếu Weiss, danh từ `cấp trên`, và hình ảnh so sánh
    `Tâm trạng nó nguy hiểm chẳng khác nào nitroglycerin.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000338
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000338: locks: [''Giữ tên riêng
    `Weiss`, danh xưng `thiếu tá von Degurechaff`, và đại từ trần thuật `nó` theo
    DEC-P01-001 (`lúc nó đang cáu kỉnh`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000339
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000339: locks: [''Giữ cách gọi
    `các binh sĩ`, đại từ phản thân `mình`, và câu nói của Tanya `“…Được rồi, các
    binh sĩ. Có vẻ màn tự làm bẽ mặt mình cũng đáng công.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000340: locks: [''Giữ đại từ `họ`
    và mệnh đề `trong quá trình huấn luyện, có một điều đã được khắc sâu vào họ với
    tư cách quân nhân`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000341
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000341: locks: [''Giữ quan hệ nhân
    quả `Vì thế, khi chuẩn bị tấn công, họ hiểu cấp trên sẽ trút cảm xúc lên kẻ địch`,
    cùng các thuật ngữ trang bị `quả cầu` và `súng trường`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000342
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000342: locks: [''Giữ các cụm thuật
    ngữ `Nhà máy sản xuất đạn dược`, `phe Cộng hòa`, `vật liệu dễ cháy`, tên đơn vị
    `Tiểu đoàn Pháp sư Không quân 203`, tên riêng `Tanya`, và đại từ trần thuật `nó`
    theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000343
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000343: locks: [''Giữ đại từ trần
    thuật `Nó` theo DEC-P01-001 trong câu ngắn `Nó đang rất có động lực.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000344
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000344: locks: [''Giữ sự phân biệt
    giữa `Tôi` (`Tôi đã đưa ra cảnh báo.`) và `chúng ta` (`Bổn phận của chúng ta đã
    hoàn thành.`), cùng câu kết `Giờ thì cùng xem pháo hoa nào.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000345
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000345: locks: [''Giữ đại từ độc
    thoại nội tâm `Mình` theo DEC-P01-001 và đại từ `chúng` chỉ kẻ địch (`Mình đang
    công khai phẫn nộ—xả bực dọc, hay có lẽ là trút giận lên chúng.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000346
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000346: locks: [''Giữ danh xưng
    `thiếu tá von Degurechaff`, các thuật ngữ `thuật thức cực lớn nhưng vẫn chính
    xác` và `thuật thức phóng chiếu tầm xa`, đúng phạm vi chữ nghiêng `*Chớ khơi chuyện
    đã yên.*` theo DEC-P01-002, và đại từ trần thuật `nó` theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000347
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000347: locks: [''Giữ câu thoại
    của Tanya `“Hãy khai sáng cho chúng nhân danh Chúa.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000348: locks: [''Giữ đại từ trần
    thuật `nó` theo DEC-P01-001 trong câu `Câu nói khẽ ấy cho đơn vị biết nó nghiêm
    túc đến mức nào.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000349
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000349: locks: [''Giữ đại từ tự
    xưng `Ta` và danh xưng `Chúa` trong lời tuyên bố `“Ta sẽ khiến quyền năng của
    Chúa hiển hiện trên mặt đất này!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000350
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000350: locks: [''Giữ cụm chủ ngữ
    `Chỉ huy của họ` và hình ảnh `tiếp tục tạo ra một thảm họa khổng lồ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000351
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000351: locks: [''Giữ cả hai mệnh
    lệnh và đối tượng hô gọi đã sửa theo signoff `“Triển khai thuật thức! Các quan
    sát viên, nhìn cho kỹ!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000352
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000352: locks: [''Giữ mệnh lệnh
    `“Triển khai thuật thức! Mục tiêu: Nhà máy Vũ khí Carberius!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000353
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000353: locks: [''Giữ mệnh lệnh
    phối hợp cấp đại đội `“Tất cả đại đội, căn thời điểm theo thiếu tá von Degurechaff!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000354
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000354: locks: [''Giữ cụm `chỉ
    huy từng đơn vị hô lớn` và thuật ngữ `thuật thức tấn công tầm xa`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000355
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000355: locks: [''Giữ giả định
    chiến thuật thông thường và các thuật ngữ `thuật thức chậm chạp`, `pháo chống
    ma pháp`, `pháp sư địch tuần tra`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000356
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000356: locks: [''Giữ câu điều
    kiện tương phản `Nhưng nếu đối phương còn chậm hơn nữa thì lại là chuyện khác.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000357
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000357: locks: [''Giữ khẩu lệnh
    `“Triển khai thuật thức!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000358
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000358: locks: [''Giữ khẩu lệnh
    `“Khai hỏa!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000359
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000359: locks: [''Giữ đại từ `Chúng
    tôi`, các thuật ngữ `thuật thức nổ tầm xa`, `tiểu đoàn pháp sư tăng cường gồm
    bốn mươi tám người`, `ma lực`, và nhận định `ít nhất lần này, đó là giải pháp
    tối ưu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000360
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000360: locks: [''Giữ cấu trúc
    phủ định tăng tiến `Không ai ngăn cản—thậm chí chẳng ai nhận ra.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000361
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000361: locks: [''Giữ các thuật
    ngữ `Các thuật thức`, `các pháp sư`, `những phép thuật`, và cụm `nhà máy vốn đầy
    ắp đạn dược`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000362
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000362: locks: [''Giữ báo cáo kết
    quả xạ kích `“Trúng đích mười sáu phát! Số còn lại cũng sát mục tiêu!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000363
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000363: locks: [''Giữ thuật ngữ
    `thuật thức tầm xa`, đại từ `tôi`, và tên riêng trần thuật `Tanya` (`Tanya hài
    lòng gật đầu.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000364
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000364: locks: [''Giữ tên riêng
    `Weiss`, đại từ trần thuật `nó` quy chiếu Tanya theo DEC-P01-001, và danh từ `nhà
    máy` (`nhà máy nổ tung`) để tránh lặp đại từ `nó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000365
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000365: locks: [''Giữ các mệnh
    đề miêu tả `Ánh chớp chói lòa đến mức ngay cả các pháp sư cũng bị lóa mắt, dù
    họ đã lường trước vụ nổ.` và `Ánh sáng tràn ngập màn đêm tĩnh lặng, phơi bày vẻ
    thù địch trần trụi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000366
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000366: locks: [''Giữ hình ảnh
    `Mái nhà máy bị hất tung lên trời, dường như rơi xuống trong chuyển động chậm`,
    địa danh `thủ đô Dacia`, và cụm `soi sáng mọi thứ trong phạm vi hàng dặm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000367
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000367: locks: [''Giữ câu thoại
    quan sát `“Kìa, những vụ nổ thứ cấp.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000368
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000368: locks: [''Giữ câu dẫn `Rồi
    một lời nhận xét khẽ khàng, mãn nguyện tóm gọn tất cả.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000369
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000369: locks: [''Giữ nguyên tiếng
    hô pháo hoa phiên âm `“Tamayaaa!”`.'']'
  non_canon: true
