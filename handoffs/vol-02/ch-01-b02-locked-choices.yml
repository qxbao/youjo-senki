choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000001: locks: [''Giữ địa danh
    `Khu thao trường Turao ở phía đông nam—hướng hoàn toàn ngược với chiến sự`, tên
    riêng `Tanya` trong câu trần thuật, đại từ nội tâm `mình` ở câu cuối theo DEC-P01-001
    và sắc thái giới hạn `duy trì đôi chút căng thẳng—chỉ đến thế thôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000002: locks: [''Giữ danh xưng
    `Đế quốc`, `Dacia` và đại từ nội tâm `mình` theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000003: locks: [''Giữ đại từ nội
    tâm `mình` ở câu đầu, câu hỏi nội tâm `Quân Dacia định gây chiến, liều để quê
    hương bị chiếm đóng, nhân danh hợp tác quốc tế ư?`, và tên riêng `Tanya` cùng
    mức độ bán tín bán nghi `gần như chờ sẵn một mệnh lệnh nghiêm khắc yêu cầu hủy
    cuộc diễn tập vì cảnh báo chỉ là nhầm lẫn` ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000004: locks: [''Giữ tên riêng
    `Tanya` và sắc thái phủ định `chẳng bận tâm nếu thật sự làm bùng nổ chiến tranh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000005: locks: [''Giữ các danh
    xưng `Tiểu đoàn 203`, `vị trí chiến đấu` và `Bộ chỉ huy Biên phòng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000006: locks: [''Giữ cụm `Nhân
    sự của Bộ chỉ huy` và quan hệ giới từ chính xác theo F1: `yêu cầu nối máy đến
    đồn này, vừa hỏi tình hình về đồn khác`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000007: locks: [''Giữ danh xưng
    `Trung úy Weiss` và câu mệnh lệnh `Tập hợp lại đội ngũ, rồi cử người phát đạn
    dược!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000008: locks: [''Giữ cách thưa
    gửi `Thưa Thiếu tá`, đại từ `chúng tôi`, cùng các thuật ngữ `báo cáo chiến trường`,
    `Hạm đội Không quân 7` và `tần số của Sở chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000009: locks: [''Giữ danh xưng
    `Trung úy Serebryakov` và đại từ `tôi` trong câu lệnh của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000010: locks: [''Giữ việc lặp
    tên riêng `Tanya` và `Lergen` trong trần thuật theo F3, giữ danh xưng `Đại tá
    von Lergen`, các chức danh `tùy viên quân sự hoặc sĩ quan liên lạc`, và cấu trúc
    giả định quá khứ `Tanya hẳn đã muốn có cơ hội khảo sát khu vực... Như vậy, Tanya
    sẽ nắm rõ địa hình hơn và hình dung rõ hơn những gì cần cho nổ tung`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000011: locks: [''Giữ danh xưng
    `Đại tá von Lergen` và giọng hỏi mỉa mai `“…Chà, đúng là cuộc tấn công bất ngờ
    thật, Đại tá von Lergen nhỉ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000012: locks: [''Giữ cách Lergen
    gọi Tanya là `Thiếu tá` ở cả hai câu và đại từ `chúng tôi` theo F3: `“Thiếu tá
    đừng mỉa mai nữa. Thiếu tá sẽ cầm chân chúng cho chúng tôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000013: locks: [''Giữ đại từ nội
    tâm `mình` ở cả ba câu theo DEC-P01-001, cùng các danh xưng `Bộ Tổng tham mưu`,
    `Đại tá von Lergen`, `mệnh lệnh niêm phong` và `Văn phòng Bộ Tổng tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000014: locks: [''Giữ cách gọi
    `thưa ngài` / `ngài`, cụm `tiểu đoàn tôi` và `quân đội Dacia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000015: locks: [''Giữ đại từ `Tôi`
    – `chúng ta` trong lời của Lergen và cụm `đưa quân tiếp viện từ khu vực trung
    tâm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000016: locks: [''Giữ việc lặp
    tên riêng `Tanya` trong trần thuật theo F3, con số `chỉ có sáu trăm nghìn quân
    Dacia đang vượt biên giới` và hình ảnh so sánh `còn non nớt hơn cả đám Hướng đạo
    sinh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000017: locks: [''Giữ danh xưng
    `quân Công quốc` và cụm `chiến tranh hiện đại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000018: locks: [''Giữ tên riêng
    `Tanya` và `Lergen` trong trần thuật theo F3, cùng các danh xưng `Dacia`, `Công
    quốc` và `toán Hướng đạo sinh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000019: locks: [''Giữ các thuật
    ngữ `Cụm tập đoàn quân khu vực`, `bốn sư đoàn`, `mũi tiên phong`, đại từ `Tôi`
    / `tiểu đoàn tôi` và quan hệ đối lập `đủ sức đánh lui mũi tiên phong, chứ đâu
    chỉ cầm chân`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000020: locks: [''Giữ cách gọi
    `Thiếu tá` và đại từ phản thân `mình` trong câu hỏi của Lergen.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000021: locks: [''Giữ cách xưng
    hô `Tôi` – `thưa ngài` và hình ảnh `một đạo quân trang bị đầy đủ đuổi một toán
    Hướng đạo sinh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000022: locks: [''Giữ các cụm `lực
    lượng vệ binh quốc gia dự bị hay lính bán thời gian`, `Quân đội Nhân dân Triều
    Tiên`, `Quân đội Đế quốc` và định nghĩa `một khối bạo lực được quản lý chính xác,
    kết hợp chặt chẽ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000023: locks: [''Giữ cặp đối lập
    `lực lượng hiện đại và tiền hiện đại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000024: locks: [''Giữ cụm `mệnh
    lệnh niêm phong¹` kèm ký hiệu chú thích `¹` và nội dung mệnh lệnh `có hành động
    thích hợp nhất để bảo vệ biên giới`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000025: locks: [''Giữ việc lặp
    tên riêng `Tanya` trong trần thuật theo F3, và giữ chính xác đối tượng quy chiếu
    `tiêu chuẩn áp dụng cho mọi lần đánh giá` theo F2.'']'
  non_canon: true
