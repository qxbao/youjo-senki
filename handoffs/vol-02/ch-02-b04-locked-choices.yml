choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000072
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000072: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `mình` theo DEC-P01-001, đại từ `họ` và các cụm `một đơn vị kỷ
    luật, tràn đầy tự tin`, `Quân trang được đánh bóng hoàn hảo, chân đứng thẳng hàng
    như đang áp sát mép thước kẻ, quả thật trông họ rất tinh nhuệ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000073: locks: [''Giữ các danh
    xưng `Tiểu đoàn Pháp sư Không quân 203`, `Bộ Tổng tham mưu`, `Trung úy Weiss`,
    `Dacia`, việc giữ tên riêng `Tanya` ở ngôi thứ ba cùng chức danh `chỉ huy`, đại
    từ `Họ` / `họ`, tình thái `chưa sẵn sàng như Bộ Tổng tham mưu có thể muốn tin`,
    và các ẩn dụ đã khóa tạm `cuộc cách mạng tầm Copernicus`, `sự hoán cải của Thánh
    Paul`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000074
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000074: locks: [''Giữ các danh
    xưng `Bộ Tổng tham mưu`, `Norden`, `Dacia`, tên riêng `Tanya`, đại từ `chúng ta`
    trong lời thoại, và các cụm ẩn dụ `những con chó chọi vừa nếm vị ngọt chiến thắng
    đã biến thành bầy chó lai hèn nhát chỉ sau một lần thất bại`, `Không ai đối mặt
    nghịch cảnh yếu đuối hơn những kẻ tinh hoa thuần chủng, và Tanya cũng vậy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000075: locks: [''Giữ danh xưng
    hô gọi `Các vị` và câu `“Các vị, hãy tự hào vì cuối cùng cũng được trao cơ hội
    vượt qua thử thách của lửa và thép.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000076
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000076: locks: [''Giữ phủ định
    `Không quân đội nào có thể chiến thắng mãi mãi`, các danh xưng `Mỹ`, `thời kỳ
    Đồ đá`, `chiến tranh du kích`, `vùng Vịnh`, `Iraq` và quan hệ nhân quả `nhưng
    khi quá tự tin, kết cục là Iraq`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000077
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000077: locks: [''Giữ đại từ nội
    tâm `Mình` theo DEC-P01-001, các danh xưng `Đế quốc`, `cường quốc hàng đầu thế
    giới`, `Mỹ`, và các cụm `chưa đạt được sức mạnh quân sự ngang tầm với vị thế thống
    trị của Mỹ`, `rèn luyện cấp dưới để họ có thể chịu đựng gian khổ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000078
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000078: locks: [''Giữ đại từ nội
    tâm `mình`, cấu trúc tăng tiến `không chỉ bị gắn mác bất tài mà còn có thể mất
    mạng thật`, thuật ngữ `công nghệ ma pháp`, và vế nhượng bộ `dẫu đâu đó trong lòng,
    mình chắc một nhà khoa học điên nào đó cùng đám cộng sự đang cố làm điều ấy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000079
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000079: locks: [''Giữ đại từ nội
    tâm `mình` và các cụm `xoay xở hết sức với những quân bài được chia`, `mình phải
    làm ít nhất tương xứng với số tiền được trả`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000080
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000080: locks: [''Giữ danh xưng
    hô gọi `Các vị`, địa danh `Dacia`, thuật ngữ `cuộc diễn tập bắn đạn thật` và câu
    `“Các vị, Dacia chẳng qua chỉ là một cuộc diễn tập bắn đạn thật. Giờ là lúc bước
    vào cuộc chiến thực sự mà tất cả vẫn hằng khao khát.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000081
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000081: locks: [''Giữ việc lặp
    tên riêng `Tanya` trong trần thuật (tránh dùng `cô` theo DEC-P01-001), thuật ngữ
    `cơn sốt chiến tranh` và sự tương phản giữa hoàn cảnh bình thường với lúc đơn
    vị sắp ra trận.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000082
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000082: locks: [''Giữ các danh
    xưng `Hoàng đế Bệ hạ`, `Tổ quốc` và câu mệnh lệnh `“Hãy dốc toàn lực vì Hoàng
    đế Bệ hạ và Tổ quốc. Đừng bao giờ quên bổn phận của mình.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000083
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000083: locks: [''Giữ nguyên bốn
    lớp ngoặc kép và câu đáp đồng thanh `““““Rõ, thưa chỉ huy!””””`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000084
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000084: locks: [''Giữ việc lặp
    tên riêng `Tanya` trong câu trần thuật `Tiếng đáp vang dội khiến Tanya tạm hài
    lòng.` (tránh dùng `cô` theo DEC-P01-001).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000085
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000085: locks: [''Giữ thuật ngữ
    `quản lý nhân sự`, đại từ `họ`, đại từ nội tâm `mình` và câu `Dĩ nhiên, mình không
    thể lơ là cảnh giác.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000086
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000086: locks: [''Giữ các danh
    xưng `Đế quốc`, `vị hoàng đế`, `Tổ quốc`, đại từ nội tâm `mình` và cụm `trong
    tình huống xấu nhất, họ cũng có thể làm lá chắn cho mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000087
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000087: locks: [''Giữ đại từ `họ`,
    đại từ nội tâm `mình`, thuật ngữ `pháp sư` và cụm `những pháp sư tài năng đến
    mức mình muốn làm việc cùng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000088
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000088: locks: [''Giữ đại từ `chúng
    ta`, các danh xưng `Bộ Tổng tham mưu`, `Trung úy Weiss` và câu `“Tốt. Giờ chúng
    ta sẽ nghe thông báo từ Bộ Tổng tham mưu. Trung úy Weiss.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000089
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000089: locks: [''Giữ đại từ nội
    tâm `mình`, danh xưng `Đế quốc`, và các chức danh `phó chỉ huy`, `sĩ quan phụ
    tá`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000090
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000090: locks: [''Giữ lời thưa
    `Thưa chỉ huy`, đại từ ngôi thứ hai `các vị` (nói với toàn đơn vị), cụm `từ chỉ
    huy của chúng ta` và thuật ngữ `tiểu đoàn cơ động`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000091
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000091: locks: [''Giữ các danh
    xưng `Bộ Tổng tham mưu`, `Tiểu đoàn Pháp sư Không quân 203`, `cụm tập đoàn quân`,
    `tiểu đoàn cơ động` và đại từ `Chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000092
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000092: locks: [''Giữ các danh
    xưng `Bộ Tổng tham mưu`, `cụm tập đoàn quân`, `đơn vị độc lập`, đại từ `chúng
    ta` và các cụm `không cần phối hợp nhiều trước với một cụm tập đoàn quân`, `trên
    thực tế chúng ta đã được trao quyền tự chủ`.'']'
  non_canon: true
