unit_count: 25
segment_id_start: YS-LN02/Text/part0022.xhtml/p000038
segment_id_end: YS-LN02/Text/part0022.xhtml/p000062
choices:
- segment_id: YS-LN02/Text/part0022.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000038: locks: [''Giữ câu thoại
    đã sửa theo M1 và được nghiệm thu (`“Ngài đã sắp xếp con tàu cho tôi. Về phần
    mình, tôi sẵn sàng tự tay bảo vệ mái nhà của gia đình.”`), cặp đại từ trung tính
    – trang trọng `Ngài` – `tôi` / `mình`, và cam kết `sẵn sàng tự tay bảo vệ mái
    nhà của gia đình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000039: locks: [''Giữ câu đáp đã
    sửa theo M1 và được nghiệm thu (`“Chúng tôi trông cậy vào ngài.”`), đại từ ngôi
    thứ nhất số nhiều `Chúng tôi` và đại từ ngôi thứ hai trung tính `ngài`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000040: locks: [''Giữ cấu trúc
    đối xứng `Một người cúi chào, người kia mỉm cười đáp lại cử chỉ ấy.`, đại từ `Họ`,
    và phủ định `Họ không cần nói thêm gì nữa.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000041: locks: [''Giữ tên riêng
    `Tanya`, các thuật ngữ ẩm thực `pa-tê cá theo mùa`, `món nhuyễn`, so sánh `cá
    tươi đến mức đem nghiền thành món nhuyễn dường như thật phí`, phủ định `Khen ngợi
    thế nào cũng không đủ.`, và câu kết đánh giá tuyệt đối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000042: locks: [''Giữ các cụm `Món
    súp khoai tây`, `khẩu phần chiến trường`, đại từ `Cô`, phủ định `cảm giác ấy chẳng
    có gì tệ` và `khẩu phần chiến trường khó lòng sánh được`, cùng nhận định `món
    ăn là hiện thân cho sức sáng tạo đầy thú vị của nhân loại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000043: locks: [''Giữ các danh
    từ `cá thịt trắng`, `Người phục vụ` / `người phục vụ`, `đầu bếp`, đại từ `Cô`
    / `cô`, phủ định `vẫn chưa được dọn lên`, và cấu trúc điều kiện – tăng tiến `Nếu
    người phục vụ của khách sạn đã nói ngon đến vậy, thì không chỉ nguyên liệu hẳn
    phải có chất lượng cao, cô còn chắc rằng món ăn sẽ thể hiện tài nghệ của đầu bếp.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000044: locks: [''Giữ cụm tổ chức
    đã sửa theo M2 và được nghiệm thu `hội quân nhân dự bị` theo mục `vol02-ch04-b03-reservists-association`
    (tuyệt đối không thêm `cựu`), cụm `những nhân vật có tiếng trong vùng`, các đại
    từ `cô` / `Cô`, `họ`, `mình`, và câu cảm thán `Không ngờ cô lại có dịp kết giao
    với họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000045: locks: [''Giữ tên riêng
    `Koskenkorva` kèm dấu chú thích số mũ `¹⁰` theo mục `vol02-ch04-b03-koskenkorva`
    (ở bước chuốt văn có thể bỏ dấu phẩy thừa đứng liền trước `¹⁰`), cụm `món quà
    từ toán quân phía bắc`, đại từ `họ`, và câu độc thoại nội tâm dùng đại từ `mình`
    đã sửa theo M6 (`Giờ thì mình hiểu vì sao thứ này nổi tiếng là làm tăng nguy cơ
    thành kẻ nghiện rượu.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000046
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000046: locks: [''Giữ sự chuyển
    đổi điểm nhìn mượt mà từ độc thoại nội tâm dùng `mình` đã sửa theo M6 (`nhận món
    quà như thế từ một đứa trẻ ở tuổi mình`) sang câu trần thuật ngôi thứ ba dùng
    `cô` và tên riêng `Tanya` (`Mưu tính của cô đang đi đúng hướng, cuộc trò chuyện
    diễn ra tự nhiên, và Tanya có thể tận hưởng buổi gặp mặt khá nhiều.`), cùng tình
    thái phỏng đoán `Có lẽ họ chỉ ngạc nhiên trước hương vị lạ của rượu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000047
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000047: locks: [''Giữ mệnh đề nhượng
    bộ phủ định `Dù cô không thể uống cùng họ`, chi tiết `công sức tịch thu cả một
    thùng rượu để dùng riêng trong các buổi tiệc cũng đáng`, và câu kết `Cô mãn nguyện
    vô cùng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000048
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000048: locks: [''Giữ đại từ phản
    thân `mình` và đại từ trần thuật `cô`, cụm món ăn `món cá thịt trắng xào áp chảo`,
    danh từ `người phục vụ`, và cấu trúc đối lập phủ định `không phải món chính được
    chờ đợi, mà là ống nghe của một chiếc điện thoại đen trông chẳng lành`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000049: locks: [''Giữ lời gọi `“Cô
    von Degurechaff?”`, đại từ `Anh ta` (chỉ người phục vụ) và `cô` / `Cô` (chỉ Tanya),
    định danh `Trung ương`, quan hệ viện cớ đã sửa theo M3 và được nghiệm thu (`lấy
    cớ dùng bữa trưa với các quân nhân dự bị và nhân vật nổi tiếng địa phương để ghé
    qua thị trấn nghỉ dưỡng`), cùng câu hỏi tu từ `Ai lại nhận được điện thoại thời
    chiến trong hoàn cảnh này chứ?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000050: locks: [''Giữ đại từ độc
    thoại nội tâm `mình` theo `DEC-P01-001` và sự đối lập `Ngày nghỉ tuyệt vời nhất
    của mình thoắt cái đã biến thành tồi tệ nhất.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000051: locks: [''Giữ câu độc thoại
    nội tâm ngôi thứ nhất dùng đại từ `mình` đã sửa theo M6 và được nghiệm thu (`Giờ
    mình cũng bắt đầu nghi ngờ liệu mình có thật sự được nghỉ phép dịp Giáng sinh
    như đã hứa không.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000052: locks: [''Giữ các đại từ
    `Cô` / `cô`, điều kiện giả định trái thực tế `Nếu không phải bổn phận, cô chỉ
    muốn bỏ chạy.`, tên riêng `Churchill`, và thuật ngữ hải quân đã sửa theo M4 và
    được nghiệm thu `các tàu chiến chủ lực` theo mục `vol02-ch04-b05-capital-ships`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000053: locks: [''Giữ câu hỏi độc
    thoại nội tâm dùng đại từ `mình` đã sửa theo M6 và được nghiệm thu (`Ai đó pha
    cho mình một tách cà phê đen đắng chát được không?`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000054: locks: [''Giữ đại từ tự
    xưng `Tôi`, cấp bậc – tên riêng `Thiếu tướng von Rudersdorf`, tên cơ quan `Bộ
    Tổng Tham mưu Quân đội Đế quốc`, và câu hỏi xác nhận danh tính `Thiếu tá Tanya
    von Degurechaff phải không?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000055: locks: [''Giữ câu đáp lễ
    quân sự của Tanya `“Vâng, thưa ngài, tôi đây.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000056: locks: [''Giữ các đại từ
    `Cô` / `cô` và `ông` (chỉ Rudersdorf), phủ định `Không lời thông báo mục đích
    hay lời chúc mừng theo mùa.`, danh xưng `tướng von Rudersdorf`, định danh chính
    thể `Liên minh Entente` theo mục `vol02-ch04-b03-entente-alliance`, cụm `tiền
    tuyến xa nhất`, và sự tương phản giữa `bữa trưa tuyệt đẹp này` với `lời triệu
    tập cô trở lại tiền tuyến khốn khổ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000057: locks: [''Giữ đại từ độc
    thoại nội tâm `Mình` / `mình` theo `DEC-P01-001` và câu hỏi tự trách `Sao mình
    lại ngốc đến mức đến buổi họp này, nơi mọi người đều biết chính xác mình đang
    ở đâu chứ?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000058: locks: [''Giữ danh từ `Điện
    văn`, tên cơ quan `Bộ Tổng Tham mưu Quân đội Đế quốc`, cấp bậc – tên riêng `Thiếu
    tá von Degurechaff`, và phần trích dẫn mệnh lệnh trực tiếp trong dấu nháy đơn
    `‘Tập hợp Thiếu tá von Degurechaff cùng đơn vị ngay lập tức. Hoàn tất rồi thì
    báo cáo về ngay.’`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000059: locks: [''Giữ lời nhận
    lệnh `“Rõ, thưa ngài.”`, sự phân biệt giữa `Chúng tôi` (toàn đơn vị di chuyển
    đến `đồn trú gần nhất`) và `tôi` (Tanya báo cáo khi `mọi người đã tập hợp đủ`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000060: locks: [''Giữ dấu chấm
    lửng mở đầu `…`, cụm `mệnh lệnh điều động`, và phủ định `không thể hiểu lầm được`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000061: locks: [''Giữ danh xưng
    `tướng von Rudersdorf`, các đại từ `Cô` / `cô` và `ông`, cùng câu giả định tiếc
    nuối trong quá khứ đã sửa theo M5 và được nghiệm thu (`Đằng nào cũng ra nông nỗi
    này thì lẽ ra cô nên chặn liên lạc vô tuyến rồi thong thả trở về dưới danh nghĩa
    huấn luyện.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000062: locks: [''Giữ phủ định
    `chuyện đã rồi thì chẳng ích gì mà than vãn`, đại từ `Cô`, và hành động kết cảnh
    `Cô đặt ống nghe xuống rồi kín đáo dúi cho người phục vụ một khoản tiền boa hậu
    hĩnh.`.'']'
  non_canon: true
