task_id: vol-02-ch-03-b17
baseline_sha256: 406dfbde941642e74b337887a2d8b45cd069bc3845c71ff828ed1c3de5406bf1
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: f3d9045bebe76db6edb5e24e1feb9b6f8e47e469af2cdb3600cb625e05661bd1
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 45
segment_id_start: YS-LN02/Text/part0018.xhtml/p000257
segment_id_end: YS-LN02/Text/part0018.xhtml/p000301
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000257
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000257: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `mình` ở cả hai vị trí và chuỗi cảm thán `Đó là kẻ địch. Một
    cuộc tấn công của địch. Một cuộc tấn công lớn, có bài bản! Tổ quốc, đất nước của
    mình… quê hương mà mình phải bảo vệ…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000258
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000258: locks: [''Giữ chuỗi mệnh
    lệnh khẩn cấp `“Trên không ngay! Báo động xuất kích! Khởi động động cơ!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000259
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000259: locks: [''Giữ cụm `Đơn
    vị của Sue` theo mục `vol02-ch03-b17-anson-sue-reference`, các tên tổ chức `Quân
    đội Đế quốc`, `Bộ Tổng tham mưu Quân đội Đế quốc`, `Bộ Tổng tham mưu`, đại từ
    `Họ`, các thuật ngữ `hỗ trợ hậu cần`, `tin tình báo`, `viên sĩ quan tham mưu phân
    tích số liệu`, `một lực lượng đồn trú tĩnh tại`, và địa danh `thành phố Os` theo
    mục `vol02-ch03-b17-os`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000260
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000260: locks: [''Giữ đại từ `ông
    ta` quy chiếu viên sĩ quan tham mưu, phản thân `mình`, và cụm `lực lượng chủ lực
    của mình đủ sức quét sạch quân địch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000261
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000261: locks: [''Giữ đại từ `Ông
    ta`, quan hệ thời gian giả định trong quá khứ `đến lúc đơn vị đó tập hợp xong
    để phản công thì lực lượng chủ lực của Đế quốc hẳn đã đổ bộ rồi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000262
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000262: locks: [''Giữ đại từ `ông
    ta`, phủ định bộ phận và câu đối lập `Và ông ta không hoàn toàn sai. Chỉ có kết
    luận là sai mà thôi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000263
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000263: locks: [''Giữ danh xưng
    `Đại tá Anson` theo mục `vol02-ch03-b17-anson-sue-reference` (giữ riêng từng dạng
    theo nguồn, không tự gộp), thuật ngữ `một tiểu đoàn pháp sư yếu ớt`, và cụm `một
    mớ lẫn lộn giữa vàng thau, huấn luyện chưa tới và thiếu tính thống nhất`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000264
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000264: locks: [''Giữ tên `Đế quốc`,
    đại từ `họ`, và hai câu `Nhưng Đế quốc không biết vì sao những binh sĩ ấy chiến
    đấu. Bởi lúc này họ chưa cần phải biết.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000265
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000265: locks: [''Giữ cụm `Tanya,
    chỉ huy Quân đội Đế quốc`, cặp `Chúa hoặc ác quỷ`, và ý `vẫn phải nghĩ cách xử
    lý tình hình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000266
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000266: locks: [''Giữ câu báo cáo
    khẩn `“Thiếu tá! Có địch mới!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000267
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000267: locks: [''Giữ đại từ `họ`,
    các thuật ngữ `một toán pháp sư đông cỡ tiểu đoàn`, `một đơn vị đánh chặn hạng
    nhất`, và tên đơn vị đã khóa `Tiểu đoàn Pháp sư Không quân 203` theo mục `vol02-ch03-b17-aerial-battalion`
    cùng bản sửa M5 đã nghiệm thu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000268
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000268: locks: [''Giữ câu đáp nhận
    biết `Tôi thấy rồi!` theo bản sửa M1 đã nghiệm thu, cấp bậc – tên riêng `Thiếu
    úy Serebryakov` theo mục `vol02-ch03-b17-lieutenant-serebryakov` và bản sửa M2
    đã nghiệm thu, cùng mệnh lệnh `chỉ huy Đại đội Một và chặn chúng lại!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000269
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000269: locks: [''Giữ danh xưng
    `Thiếu tá`, các đại từ `Tôi`, `nhóm mình`, và câu thoại `“Thiếu tá, chỉ một đại
    đội thì nguy hiểm quá! Tôi sẽ điều một phần quân của nhóm mình sang hỗ trợ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000270
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000270: locks: [''Giữ cách gọi
    theo cấp bậc không kèm đại từ thân mật/giới tính `Trung úy Weiss, cứ chiếm khẩu
    đội pháo đó đi!` theo mục `vol02-ch03-b17-weiss-address` và bản sửa M3 đã nghiệm
    thu, cùng câu `Bên này sẽ tìm cách xử lý.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000271
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000271: locks: [''Giữ tên riêng
    `Tanya`, đại từ `chúng`, và câu `Tanya quyết định đi gặp chúng ngay, chẳng chút
    do dự.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000272
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000272: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `Mình` / `mình` ở cả ba vị trí theo `DEC-P01-001`, các đại từ
    `họ`, `tự mình`, `chúng`, tên riêng `Tanya`, và chuỗi lập luận nội tâm chuyển
    sang trần thuật ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000273
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000273: locks: [''Giữ đại từ trần
    thuật `nó` ở cả hai câu theo `DEC-P01-001` và bản sửa M4 đã nghiệm thu, đại từ
    `chúng`, cùng các cụm đã khóa theo bản sửa N6 `không mấy hào hứng khi phải đối
    đầu với một tiểu đoàn địch trông có vẻ tinh nhuệ bằng lực lượng chỉ cỡ một đại
    đội`, `nỗi sợ bị chúng chiếm vị trí trên đầu`, `nó phải lên cao hơn chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000274
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000274: locks: [''Giữ lời đáp ngập
    ngừng `“R-rõ!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000275
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000275: locks: [''Giữ tên đơn vị
    `Đại đội Một`, các đại từ `tôi`, `Chúng ta`, `chúng`, và khẩu lệnh `“Đại đội Một,
    theo tôi! Chúng ta sẽ chặn chúng!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000276
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000276: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` theo `DEC-P01-001`, và các cụm `tăng tốc, dốc
    sức leo cao`, `nhắm chiếm độ cao tác chiến ngang bằng hoặc cao hơn đối phương`,
    `những chấm nhỏ đang tiến lại gần từng giây một`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000277
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000277: locks: [''Giữ câu chuyển
    điểm nhìn đối xứng `Và khi một bên xác nhận được bằng mắt, bên kia cũng vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000278
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000278: locks: [''Giữ câu báo cáo
    mất liên lạc `“Không thể liên lạc được với lực lượng dưới mặt đất!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000279
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000279: locks: [''Giữ các đại từ
    `Tôi`, `Chúng`, `chúng ta`, và câu báo cáo `“Tôi nhìn thấy địch! Chúng đang bay
    lên phía chúng ta!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000280
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000280: locks: [''Giữ cụm `tiểu
    đoàn của Đại tá Sue` theo mục `vol02-ch03-b17-anson-sue-reference`, địa danh nguyên
    dạng `Osfjord` theo mục `vol02-ch03-b17-osfjord`, đại từ `ông`, và thuật ngữ `Các
    khẩu đội đã rơi vào hỗn loạn vì bị tập kích`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000281
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000281: locks: [''Giữ các thuật
    ngữ `các pháp sư địch`, `cơ động vào đội hình chiến đấu`, đại từ `họ`, và cụm
    `như thể họ đã khéo léo mai phục sẵn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000282
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000282: locks: [''Giữ các đại từ
    `họ`, `ông`, và các cụm `năng lực đáng nể và đội hình chỉnh tề của họ`, `những
    đối thủ đáng gờm — nói cách khác, đúng kiểu ông ghét`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000283
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000283: locks: [''Giữ câu cảm thán
    `“Chúng nhanh quá!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000284
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000284: locks: [''Giữ các đại từ
    `chúng`, `bọn mình`, và câu thoại `“Một đại đội à? Chắc chúng nghĩ bọn mình yếu
    xìu!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000285: locks: [''Giữ cụm `Đám
    này nhảy dù xuống`, đại từ `chúng`, và chuỗi mệnh lệnh `Đừng coi thường trình
    độ huấn luyện của chúng! Tận dụng lợi thế quân số đi! Xông lên!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000286
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000286: locks: [''Giữ các đại từ
    `họ`, `ông`, đúng phạm vi câu nhấn mạnh in nghiêng `*Ưu thế quân số thì thực sự
    có ích được bao nhiêu chứ?*` theo `DEC-P01-002`, và cụm `khích lệ đơn vị đẩy lui
    quân tập kích khỏi các khẩu đội`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000287
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000287: locks: [''Giữ khẩu lệnh
    `“Đánh bật chúng lại!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000288
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000288: locks: [''Giữ đại từ `Ông`
    và câu hỏi tu từ `Ông còn biết nói gì nữa đây?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000289: locks: [''Giữ khẩu lệnh
    `“Xông lên! Hạ chúng đi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000290
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000290: locks: [''Giữ đại từ `Ông`
    và câu `Ông chỉ còn cách gào lên và dẫn quân xông vào trận.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000291
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000291: locks: [''Giữ đại từ `Ông`
    / `ông` và đúng phạm vi từ nhấn mạnh in nghiêng `*Nhưng*` theo `DEC-P01-002` trong
    câu `*Nhưng* có lẽ cần phải nói thêm…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000292
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000292: locks: [''Giữ tên riêng
    `Sue`, đại từ nội tâm `mình`, và đúng phạm vi câu nhấn mạnh in nghiêng `*Chắc
    Chúa chẳng phù hộ mình rồi.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000293
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000293: locks: [''Giữ tiếng kêu
    sững sờ `“Khự?! Đó là—”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000294
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000294: locks: [''Giữ câu hỏi gọi
    tên cấp bậc `“Đại tá Sue?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000295
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000295: locks: [''Giữ đúng phạm
    vi câu nội tâm in nghiêng `*Lạy Chúa, tại sao chứ…? Sao cô ta lại ở đây?*` theo
    `DEC-P01-002` và đại từ `cô ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000296
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000296: locks: [''Giữ hình ảnh
    so sánh `Đối thủ này bám dai như gỉ`, thuật ngữ `bắn áp chế`, đại từ `cô ta`,
    và đúng phạm vi từ nhấn mạnh in nghiêng `*Đừng*` trong câu `*Đừng* để cô ta áp
    sát!` theo `DEC-P01-002` và bản sửa M6 đã nghiệm thu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000297
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000297: locks: [''Giữ biệt danh
    đã khóa `Bạch Ngân` ở cả hai vị trí theo mục `vol02-ch03-b17-silver-nicknames`
    và bản sửa M7 đã nghiệm thu, các đại từ `cô ta`, `mình`, `ông`, tên `Đế quốc`,
    cụm `chiến đấu dữ dội chống lại chính đơn vị của mình rồi còn được khen thưởng`,
    và đúng phạm vi hai phần in nghiêng `*Cái biệt danh Bạch Ngân gì đó khó ưa của
    cô ta.*` cùng `*Tay vấy máu đến thế mà biệt danh lại là Bạch Ngân sao? Ha, Đế
    quốc chẳng có khiếu đặt tên gì cả.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000298
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000298: locks: [''Giữ biệt danh
    biến thể đã khóa `Ngân Gỉ` đồng bộ với `Bạch Ngân` ở p000297 theo mục `vol02-ch03-b17-silver-nicknames`
    và bản sửa M7 đã nghiệm thu, cùng đúng phạm vi in nghiêng toàn câu `*Trông thế
    kia thì gọi là Ngân Gỉ còn hơn.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000299
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000299: locks: [''Giữ mạch hình
    ảnh nối tiếp `Một con quỷ lấm lem, hoen gỉ trong máu của đồng đội`, đại từ `Ông`,
    phản thân `mình`, và cụm `cô gái đáng ghét ấy — kẻ thù không đội trời chung của
    mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000300
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000300: locks: [''Giữ cặp xưng
    hô cầu nguyện `con` – `Người`, danh xưng `Lạy Chúa`, `con quỷ đó`, và đúng phạm
    vi in nghiêng toàn đoạn `*Lạy Chúa, con cầu xin Người. Xin ban cho con sức mạnh
    để tiêu diệt con quỷ đó.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000301
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000301: locks: [''Giữ tên riêng
    `Sue`, thuật ngữ đã khóa `phóng thuật thức` theo mục `vol02-ch03-b17-formula`,
    và đầy đủ sắc thái nhấn mạnh – tình thái `Sue thậm chí còn cầu nguyện lúc phóng
    thuật thức; đúng như một đòn tấn công chất đầy hy vọng mãnh liệt, nó lao thẳng
    vào đội hình địch.` theo bản sửa M8 đã nghiệm thu.'']'
  non_canon: true
