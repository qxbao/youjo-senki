segment_id_end: YS-LN02/Text/part0010.xhtml/p000118
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000088
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000088: locks: [''Giữ chức danh
    `sĩ quan phụ tá` theo M4, cách quy chiếu trung tính `sĩ quan ấy`, đại từ nội tâm
    `mình` / `Mình` theo DEC-P01-001 và M6, cùng các thuật ngữ `thuật ngữ chuyên môn`,
    `người theo chủ nghĩa hậu cấu trúc`, `giải cấu trúc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000089
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000089: locks: [''Giữ danh xưng
    `Thiếu úy Serebryakov` và cách gọi ngôi thứ hai `Thiếu úy` theo M1.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000090
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000090: locks: [''Giữ lời hỏi ngập
    ngừng của Serebryakov `“Ơ… thưa Thiếu tá?”` theo L14.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000091
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000091: locks: [''Giữ đại từ `tôi`
    trong lời thoại của Tanya, cụm `một đám ô hợp năm vạn người đang liều mạng làm
    loạn` theo L2, điều kiện phủ định `Không định nghĩa thuật ngữ cho đúng thì đương
    nhiên sẽ gây hiểu lầm` và câu tự trách cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000092
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000092: locks: [''Giữ danh xưng
    `Thiếu úy Serebryakov` theo M1, giữ đúng phạm vi nhấn mạnh `*Họ có thể chuẩn bị
    tinh thần cho một trận ác chiến với kẻ địch hùng mạnh, quả là đáng khen; nhưng
    tôi đã sai khi gọi quân địch là “sư đoàn”.*` theo M2 và DEC-P01-002, cùng tên
    riêng `Tanya` và cụm `quân đội Dacia là một thế lực quân sự đáng gờm` ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000093
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000093: locks: [''Giữ các cụm `đại
    chiến thế giới đầu tiên của thế giới này`, `mối đe dọa từ sức mạnh không chiến`
    và sự đối lập `kiểu chiến tranh hai chiều` – `không gian ba chiều`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000094: locks: [''Giữ các đại từ
    `Chúng ta` – `tôi` – `Ta`, tên đơn vị `Đại đội chỉ huy` và cách nói mỉa mai `đi
    thăm hỏi đám chỉ huy bên kia nào`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000095: locks: [''Giữ việc lặp
    tên riêng `Tanya` ở hai câu đầu theo M3, danh xưng `Thiếu úy Serebryakov` theo
    M1, cùng trình tự hai bước `cứ chặt đầu binh lính địch` rồi `chuyển sang thổi
    bay mọi tàn quân thành bụi luôn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000096: locks: [''Giữ khẩu lệnh
    ngắn gọn `“Theo tôi! Theo tôi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000097: locks: [''Giữ đại từ `Chúng
    tôi` / `chúng tôi`, lựa chọn thuật ngữ tạm `lựu đạn chống mục tiêu mặt đất đã
    cố định thuật thức` theo T2/T3, các chi tiết `rải mảnh đạn`, `chẳng đội mũ sắt`,
    so sánh `như cái gối cắm kim` theo L3 và chuỗi hành động `đại đội chuẩn bị thuật
    thức, chọn vị trí thích hợp rồi khai hỏa hết công suất`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000098: locks: [''Giữ đại từ `Chúng
    tôi` / `chúng tôi`, động từ `đánh tan` theo L6, và điều kiện kỹ thuật `súng trường
    bộ binh muốn xuyên thủng lớp vỏ phòng ngự của chúng tôi thì phải bào mòn chúng
    bằng một loạt đạn dày đặc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000099: locks: [''Giữ phủ định
    `chẳng có tiếng súng máy hạng nặng đinh tai`, thuật ngữ `phòng không` theo L7
    và sự đối lập giữa `bộ binh bị buộc phải dùng vũ khí cơ bản để phòng không theo
    những chiến thuật sơ sài` với `những người biết bay như chúng tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000100: locks: [''Giữ danh xưng
    `Quân đội Dacia` và khẩu lệnh `Tất cả các đại đội, báo cáo tình hình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000101: locks: [''Giữ câu báo cáo
    `“Mọi việc đều ổn, Thiếu tá.”` với cấp bậc viết hoa theo L14.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000102: locks: [''Giữ câu báo cáo
    ngắn `“Bên này không có vấn đề gì.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000103: locks: [''Giữ thuật ngữ
    `cuộc diễn tập bắn đạn thật` trong câu cảm thán của thuộc cấp.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000104: locks: [''Giữ cặp đại từ
    `Tôi` – `bên mình` và nhịp bỏ lửng cuối câu `“Lạ thật. Tôi cứ tưởng bên mình mới
    là bên bị tấn công, nhưng…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000105: locks: [''Giữ đại từ nội
    tâm `mình` theo DEC-P01-001 và M6, cụm `nhầm vai tấn công với phòng thủ`, danh
    xưng `Liên minh Entente` và đối lập `vượt biên mà chẳng định đánh nhau, vậy mà
    khi giao chiến rồi, họ lại nghiêm túc và hăng máu đến mức gần như quá đà`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000106: locks: [''Giữ danh xưng
    `Công quốc` và quan hệ đối lập `có thừa động cơ, chính họ là bên tuyên chiến,
    vậy mà chẳng hiểu chiến tranh là gì` theo L9.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000107: locks: [''Giữ đại từ `chúng
    ta` và câu hỏi phản vấn `Họ nghĩ đánh chúng ta mà chúng ta sẽ không đánh trả sao?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000108: locks: [''Giữ lời bình
    phẩm `“Đúng là một lũ đáng thương đầu óc có vấn đề.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000109: locks: [''Giữ cấu trúc
    vô nhân xưng chỉ đúng chủ thể ra đòn `Đánh nhau tay không thì ra đòn cũng phải
    lường trước sẽ bị đánh trả` theo M5, các cụm `công cụ bạo lực của hai quốc gia`,
    `giữ chút phẩm cách tối thiểu mà dùng pháo binh` theo L10 và tên riêng `Friedrich
    Đại đế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000110: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` xuyên suốt theo DEC-P01-001 và M6, danh xưng `tên Being X
    độc ác`, cụm `cuộc sống công sở cực kỳ bình thường` và phủ định `chưa một lần
    lạc quan về số phận mình…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000111: locks: [''Giữ câu hỏi chuyển
    cảnh `“Mà này, cái kia là gì vậy? Họ đang làm gì thế?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000112: locks: [''Giữ tên riêng
    `Tanya` cùng phép tỉnh lược chủ ngữ ở các mệnh đề tiếp theo trong trần thuật,
    danh xưng `Lục quân Đế quốc` và các cụm `cuộc di chuyển có tổ chức`, `cho binh
    lính tản ra và bắn phòng không tại những khu vực được chỉ huy chỉ định`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000113: locks: [''Giữ sự tương
    phản `thay vì giãn cách nhau, họ lại bắt đầu xếp thành những đội hình vuông ken
    chặt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000114: locks: [''Giữ câu hỏi ngắn
    `“Họ đang hoảng loạn à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000115: locks: [''Giữ chức danh
    `sĩ quan phụ tá` theo M4, đại từ nội tâm `mình` theo DEC-P01-001 và M6, cùng vế
    đối lập `mấy người trông giống sĩ quan kia thực ra đang ra lệnh cho họ dàn thành
    hàng ngũ` theo L12.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000116: locks: [''Giữ đại từ `Tôi`
    trong lời thoại và lựa chọn thuật ngữ tạm `đội hình vuông bộ binh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000117: locks: [''Giữ câu cảm thán
    của Serebryakov `“Nhưng như thế ngu ngốc quá…! Thời đại kỵ binh qua rồi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000118: locks: [''Giữ danh xưng
    `Thiếu úy Serebryakov` theo M1, đại từ `chúng tôi`, sự đối lập `các đợt tấn công
    mặt đất bằng ma pháp chứ đâu phải xung phong kỵ binh` theo L13 và lựa chọn thuật
    ngữ tạm `đội hình vuông bộ binh` theo T4.'']'
  non_canon: true
