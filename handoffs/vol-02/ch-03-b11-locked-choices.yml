segment_id_end: YS-LN02/Text/part0018.xhtml/p000115
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000088
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000088: locks: [''Giữ tên riêng
    `Tanya`, đại từ nội tâm `mình` theo `DEC-P01-001`, các định danh `quân phương
    Bắc`, `Bộ Tổng tham mưu`, `Norden`, và các cụm `cuộc phiêu lưu nho nhỏ`, `cuộc
    thăm dò ấy`, `chiến dịch quy mô lớn`, `giành được quyền chủ động dẫn dắt cuộc
    chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000089
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000089: locks: [''Giữ các định
    danh `Liên minh Entente`, `Đế quốc`, `Norden`, `giới tinh hoa trong Lục quân Đế
    quốc`, đại từ `họ`, và các cụm `những đòn đánh chặn kiểu du kích`, `không đủ lực
    lượng để phản công`, `vấn đề chính trị`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000090
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000090: locks: [''Giữ thuật ngữ
    đã khóa trong ledger `Vitamin P` và toàn văn câu `Nói cách khác, đây là vấn đề
    Vitamin P.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000091
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000091: locks: [''Giữ đại từ `Tôi`
    và câu thoại `“Tôi không muốn bị lôi vào chuyện này…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000092
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000092: locks: [''Giữ việc lặp
    tên `Tanya` ở cả hai câu cuối (`Dù sao Tanya cũng có nhiều kinh nghiệm. Tanya
    sẽ không mắc đi mắc lại cùng một sai lầm đâu.`) theo mục `vol02-ch03-b11-tanya-third-person-reference`
    và bản sửa `post_signoff_final_fix`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000093
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000093: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001` và câu hỏi tu từ `Chẳng lẽ không có tôn giáo nào
    dạy người ta yêu chiến tranh và khuyến khích tự sát sao?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000094: locks: [''Giữ danh xưng
    `Trung úy Weiss`, đại từ `anh`, và câu hỏi `“Trung úy Weiss, anh muốn tự sát à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000095: locks: [''Giữ đại từ `cô`
    trong lời thoại của Weiss, đại từ trần thuật `Anh` (chỉ Weiss) và `nó` (chỉ Tanya)
    theo `DEC-P01-001` và bản sửa M1, cùng các đại từ nội tâm `anh ấy`, `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000096: locks: [''Giữ tên riêng
    `Tanya`, cấp bậc – tên riêng `Thiếu úy Serebryakov` theo mục `vol02-ch03-b12-serebryakov-rank-variation`,
    các định danh `Miền Bắc`, `Bộ chỉ huy phương Bắc`, và đại từ nội tâm `mình` theo
    `DEC-P01-001`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000097: locks: [''Giữ thuật ngữ
    `cuộc tổng tấn công` và câu cảm thán `Đúng là phí mạng lính.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000098: locks: [''Giữ tên riêng
    `Tanya`, chức danh và quân hàm `phó chỉ huy đáng tin cậy của mình, Trung úy Weiss`,
    đại từ trần thuật `nó` / `Nó` theo `DEC-P01-001` và bản sửa M1, cùng cụm `mở phong
    thư lệnh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000099: locks: [''Giữ đại từ trần
    thuật `nó` theo `DEC-P01-001` và bản sửa M1, định danh `Cụm tập đoàn quân phương
    Bắc`, tên riêng `Dacia`, và cụm `một cuộc tổng tấn công lớn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000100: locks: [''Giữ thuật ngữ
    đã khóa trong ledger `trường phái Chicago`, đại từ `họ`, và các cụm `sinh mạng
    binh sĩ`, `túi tiền của các sĩ quan cấp cao`, `cơ chế khuyến khích đang thiếu
    trầm trọng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000101: locks: [''Giữ câu thoại
    của Weiss `“…Có ngân sách cho hậu cần không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000102: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` theo `DEC-P01-001` và bản sửa M2, các định danh `Trung úy
    Weiss`, `các chỉ huy Cụm tập đoàn quân phương Bắc`, đại từ `họ`, và các cụm `tuyến
    tiếp tế`, `kho tiền bí mật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000103: locks: [''Giữ các thuật
    ngữ `nguồn tiền ngoài sổ sách`, `các thanh tra`, `nền kinh tế bong bóng`, `Kiểm
    toán đúng quy củ`, và `thị trường vận hành bình thường`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000104: locks: [''Giữ các đại từ
    `Tôi`, `họ`, và các cụm `Mùa đông đến là tàu hỏa cũng ngừng chạy`, `đưa tiếp tế
    từ đâu tới`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000105: locks: [''Giữ các cụm `các
    quan chức đi thu thuế`, `kinh tế thị trường tự do`, và `tư nhân hóa việc thu thuế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000106: locks: [''Giữ các cụm `chi
    tiêu` và `vô số lời phê bình và kế hoạch đủ kiểu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000107: locks: [''Giữ thuật ngữ
    `trường phái Chicago` và cụm `phản đối tư nhân hóa việc thu thuế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000108: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001` và bản sửa M2 trong câu `Thế nhưng nghĩ đến đó,
    mình bỗng cảm thấy có gì không ổn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000109: locks: [''Giữ đại từ `chúng
    ta` và câu hỏi `“Thế còn chúng ta thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000110: locks: [''Giữ cấu trúc
    và cụm từ đã khóa theo bản sửa M3 `Khi tôi nêu rủi ro của cuộc tấn công, chúng
    ta bị điều đi căn cứ hải quân`, đại từ `tôi`, và cụm `tiền tổ chức tiệc mừng chiến
    thắng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000111: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001` và bản sửa M2, đại từ `chúng ta`, các định danh
    đã khóa trong ledger `Quân Trung ương`, `Cụm tập đoàn quân phương Bắc`, `Ban Ngân
    sách`, và cụm `không thuộc thẩm quyền của họ` theo bản sửa `post_signoff_final_fix`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000112: locks: [''Giữ đại từ nội
    tâm `Mình` và `chúng ta` theo `DEC-P01-001` và bản sửa M2, định danh `Cụm tập
    đoàn quân phương Bắc`, cụm `bồi thường tương xứng`, và đúng phạm vi nhấn mạnh
    in nghiêng ở hai câu cuối `*Hừm…? Xoay xở tiền à?*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000113: locks: [''Giữ danh xưng
    `Trung úy Serebryakov` theo mục `vol02-ch03-b12-serebryakov-rank-variation`, các
    đại từ `chúng ta`, `Cô`, và các cụm `rút tiền từ quỹ tiểu đoàn`, `lập dự toán`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000114: locks: [''Giữ đại từ `tôi`
    và câu đáp lễ phép của Serebryakov `“Rõ. À, tôi nên dùng bao nhiêu ạ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000115: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu độc thoại đầu đoạn `*Mình có thể lấy tiền từ quỹ
    tiểu đoàn để tổ chức một bữa tiệc nhỏ, nhưng trong tình hình chiến sự thế này,
    có lẽ nên tránh mở tiệc linh đình…?*` theo `DEC-P01-002`, tên riêng `Tanya`, đại
    từ trần thuật `Nó` / `nó` theo `DEC-P01-001`, đại từ phản thân `mình`, và đại
    từ `họ`.'']'
  non_canon: true
