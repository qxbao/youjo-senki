task_id: vol-02-ch-02-b05
baseline_sha256: a8316f71589078d0efbf14cf77e2dfb0f2a309e16c24b11aa7a5d20e16d96ffc
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 1c6b416ed35e03eb432a03468403209ad95f0b9c32580c1afcd9dcc3b12cf392
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 25
segment_id_start: YS-LN02/Text/part0014.xhtml/p000093
segment_id_end: YS-LN02/Text/part0014.xhtml/p000117
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000093
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000093: locks: [''Giữ đại từ `chúng
    ta`, thuật ngữ đã khóa tạm `nội tuyến` và câu `“Nói cách khác, chúng ta sẽ liên
    tục cơ động qua lại theo nội tuyến.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000094: locks: [''Giữ các cụm `quyền
    hạn và trách nhiệm được trao tương xứng với nhau`, `Nếu mặt trận xảy ra sự cố,
    chúng ta sẽ được điều đến và phải xử lý ngay lập tức`, và việc giữ tên riêng `Tanya`
    ở câu trần thuật cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000095: locks: [''Giữ danh xưng
    `Bộ Tổng tham mưu`, đại từ `chúng ta` / `họ`, phép so sánh `như một đội ngựa kéo
    bị đóng ách` và hình ảnh ẩn dụ `cà rốt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000096: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `Mình` / `mình` theo DEC-P01-001, danh xưng `Bộ Tổng tham mưu`,
    và cụm `binh lính dưới quyền mình` (không dùng đại từ ngôi thứ ba giới tính hóa).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000097: locks: [''Giữ nguyên ba
    lớp ngoặc kép và tiếng cười đồng thanh `“““Oa ha ha ha ha!”””`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000098: locks: [''Giữ câu hỏi tu
    từ `Ai lại vui vẻ ra trận chỉ vì được thêm một hai món đãi ngộ chứ?`, sự tương
    phản giữa `Sĩ quan và tướng lĩnh` với `binh sĩ cấp thấp`, và giả định `nếu có
    một hệ thống thị trường tự do, mỗi người sẽ tự quyết định xem có đáng hay không`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000099: locks: [''Giữ thuật ngữ
    `chế độ nghĩa vụ quân sự`, các danh xưng `Đế quốc`, `Serebryakov`, `Tanya`, quan
    hệ nhân quả `vì quốc gia không đủ nguồn lực để bảo đảm đầy đủ các quyền của công
    dân…` và cụm `Bản thân Tanya cũng chẳng còn lựa chọn nào khác ngoài việc tình
    nguyện nhập ngũ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000100: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình`, thuật ngữ `chế độ quân nhân tình nguyện`, và cụm đã khóa
    tạm `lương hưu công chức lẫn lương hưu sĩ quan`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000101: locks: [''Giữ việc lặp
    tên riêng `Tanya` và `Weiss` trong trần thuật (tránh dùng `cô` theo DEC-P01-001),
    đại từ `anh` cho Weiss, và mạch hành động `Tanya cho Weiss biết không có gì đáng
    lo và bảo anh nói tiếp.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000102: locks: [''Giữ khẩu lệnh
    quân sự `“Tiểu đoàn! Nghiêm!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000103: locks: [''Giữ đại từ `anh`
    (quy chiếu Weiss), đại từ nội tâm `mình` (Tanya), đại từ `họ` (binh lính) và câu
    kết `Mà nghĩ lại, đương nhiên binh lính phải làm được đến thế chứ…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000104: locks: [''Giữ phủ định
    và ẩn dụ trong câu thoại của Weiss: `“Có cà rốt hay không, ngựa cũng đâu may mắn
    đến mức được ăn miễn phí.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000105: locks: [''Giữ danh xưng
    `Trung úy Weiss`, chức danh `phó chỉ huy`, đại từ `anh`, đại từ nội tâm `mình`
    / `Mình` và cụm `nâng điểm đánh giá anh trong cuốn sổ chấm điểm tưởng tượng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000106: locks: [''Giữ phủ định
    `Không ai thích khoản chi vô ích.`, chuỗi phép ẩn dụ `Ngựa đua thì phải thắng;
    ngựa kéo cày thì phải cày; ngựa giống thì phải truyền nòi; còn ngựa thồ phải kiếm
    cơm bằng sức lao động thuần túy.`, và chức danh `phó chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000107: locks: [''Giữ đại từ `chúng
    ta` / `mình` và câu `“Dĩ nhiên, chúng ta phải chứng minh mình có thể đảm đương
    một chút công việc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000108: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình`, cụm `phẩm giá con người`, từ trong ngoặc kép `“thuần hóa”`,
    và đúng phạm vi in nghiêng theo DEC-P01-002 `*Thấy chưa? Chúng tôi đang hỗ trợ
    rồi đấy, vậy bắt tay vào làm đi!*` (lược đại từ ngôi thứ hai để không gán giới
    tính).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000109: locks: [''Giữ đại từ `Chúng
    ta` / `chúng ta`, các danh xưng đã khóa tạm `cụm hỗn hợp`, `Cụm Tập đoàn quân
    phía Đông`, `Cụm Tập đoàn quân phía Nam`, `Trung ương`, và `Bộ Chỉ huy phương
    Bắc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000110: locks: [''Giữ thuật ngữ
    đã khóa tạm `phẩm giá chính trị`, tình thái `Có lẽ`, các cụm `chế độ độc tài của
    hoàng đế hay quý tộc`, `các hình thức chính quyền dân chủ rơi vào tay đám đông
    cai trị`, `những khiếm khuyết tiềm ẩn trong hệ thống`, và `loài vật chính trị`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000111: locks: [''Giữ tình thái
    `Có thể` / `có thể chỉ là một hiểu lầm`, các khái niệm `danh dự`, `lý trí`, và
    đại từ `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000112: locks: [''Giữ danh xưng
    `Bộ Tổng tham mưu`, đại từ `chúng ta`, và câu `“Bộ Tổng tham mưu muốn chúng ta
    thử nghiệm chiến thuật chiến đấu mới ở phía Bắc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000113: locks: [''Giữ danh xưng
    `Trung úy Weiss`, tên riêng `Tanya` và câu `Khi nghe Trung úy Weiss giải thích,
    ý chính của thông điệp vang vọng trong tâm trí Tanya.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000114: locks: [''Giữ các danh
    xưng `Bộ Tổng tham mưu`, `cụm tập đoàn quân`, `các đạo quân khu vực`, đại từ `chúng
    ta`, phủ định `không cụm tập đoàn quân nào ở tiền tuyến có thể trực tiếp ra lệnh
    cho chúng ta`, và cụm `chấp nhận bổn phận của mình và tuân lệnh, diễn cho thật
    đạt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000115: locks: [''Giữ đại từ nội
    tâm `Mình`, hình ảnh so sánh `như một con khỉ xiếc bị ép biểu diễn cho những con
    khỉ khác xem` và cụm `một dạng ngược đãi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000116: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình`, đại từ `chúng ta`, các cụm đã khóa tạm `hội bảo vệ động vật`,
    `binh lính Đế quốc`, `loài vật chính trị`, ký hiệu chú thích `⁵`, và đúng hai
    cụm in nghiêng theo DEC-P01-002: `*Đó là ngược đãi!*` và `*Động vật không phải
    thức ăn của các người!*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000117: locks: [''Giữ cụm đã khóa
    tạm `sự thương hại của những người theo chủ nghĩa gia trưởng…` và câu `Dù sao
    thì, chắc thế này vẫn hơn sự thương hại của những người theo chủ nghĩa gia trưởng…`.'']'
  non_canon: true
