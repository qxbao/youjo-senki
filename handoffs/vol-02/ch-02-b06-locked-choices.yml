segment_id_end: YS-LN02/Text/part0014.xhtml/p000140
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000118: locks: [''Giữ các đại từ
    `chúng ta`, `họ`, `mình` và câu thoại `“Vậy nên chúng ta phải cho họ thấy mình
    có thể phối hợp đủ tốt để cùng đi dã ngoại.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000119: locks: [''Giữ đại từ `Chúng
    ta` và đại từ nội tâm tự quy chiếu `mình` theo DEC-P01-001, danh xưng `Cục Tác
    chiến thuộc Bộ Tổng tham mưu`, cụm `chiến thuật mới`, và phép so sánh `như bị
    sai đi công tác vô bổ chỉ vì thứ bậc trong công ty`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000120: locks: [''Giữ đại từ `chúng
    ta`, đại từ nội tâm `mình`, việc lặp tên riêng `Tanya` trong trần thuật theo `vol02-ch02-b06-tanya-narration`
    (không dùng `nó` hay `cô`), và các danh xưng `Cục Công nghệ`, `đơn vị huấn luyện`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000121: locks: [''Giữ việc lược
    chủ ngữ ở câu đầu và định danh `Tanya` ở câu hai (tránh đại từ giới tính hóa theo
    DEC-P01-001), danh xưng `Trung úy Weiss`, và câu `Tanya gật đầu với vẻ nhân từ
    với Trung úy Weiss, người đang chờ cái gật đầu cho phép.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000122: locks: [''Giữ mốc thời
    gian kèm ký hiệu chú thích `18 giờ⁶`, các thuật ngữ đã khóa tạm `cuộc cơ động
    đường dài`, `kho tiếp tế`, `Các đại đội trưởng`, `kế hoạch bay`, và đại từ `chúng
    ta` / `mọi người`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000123: locks: [''Giữ đại từ `họ`,
    đại từ nội tâm `mình`, cụm `chắc gọi là chỉ thị thì đúng hơn`, và câu `Lính tráng
    thích những buổi tương tác được nghi thức hóa kiểu này.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000124: locks: [''Giữ đại từ nội
    tâm `mình`, cấu trúc tăng tiến `không chỉ phản đối việc lãng phí thời gian này,
    mà còn chẳng thể thật lòng tán thành việc đề cao sự say sưa tinh thần ấy`, và
    phủ định kép `chẳng có lý do chính đáng nào để không tham gia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000125: locks: [''Giữ tên riêng
    `Tanya` trong trần thuật và câu `Rồi Tanya cố gắng sắp xếp vài lời khuyên cho
    ra hồn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000126: locks: [''Giữ cách gọi
    `mọi người`, đại từ ngôi thứ nhất `tôi` khi Tanya phát biểu, và câu `“Xin lỗi
    vì ngắt lời khi mọi người đang chuyện trò vui vẻ, nhưng tôi có tin nhanh đây.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000127: locks: [''Giữ cụm `Những
    người ở cấp đại đội trưởng`, giả định quá khứ `lẽ ra đã phải nhận ra sự thật này`,
    điều kiện `nếu họ biết thì cách nhìn nhận của đơn vị họ sẽ khác đi`, và phủ định
    `Đây cũng chẳng phải chuyện gì quá bí mật.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000128: locks: [''Giữ danh xưng
    `Đại quân`, tình thái `có thể đã rút đi`, và câu `“Đại quân có thể đã rút đi,
    nhưng thật lạ là giao tranh ở phía bắc vẫn chưa lắng xuống.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000129: locks: [''Giữ các danh
    xưng `Liên minh Entente`, `Đế quốc`, đại từ `họ`, phủ định `không được xem là
    một cường quốc lớn trên thế giới`, và quan hệ suy luận `Việc họ có thể cạnh tranh
    với Đế quốc về chất lượng, dù ở bất kỳ cấp độ nào, cho thấy họ đang nhận viện
    trợ từ đâu đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000130: locks: [''Giữ danh xưng
    `Cộng hòa`, đại từ `họ`, và quan hệ nhân quả `đồng minh của họ là Cộng hòa đã
    chìa tay giúp đỡ đáng kể, nên chẳng nghi ngờ gì phần lớn viện trợ cũng đến từ
    đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000131: locks: [''Giữ câu hỏi gián
    tiếp `liệu những nước tuyên bố trung lập có đang can thiệp hay không`, cụm `các
    đội quân tình nguyện`, đại từ `họ`, và các danh xưng `Liên bang`, `Khối Thịnh
    vượng chung`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000132: locks: [''Giữ thuật ngữ
    đã khóa tạm `chiến tranh tổng lực`, các danh xưng `Liên minh Entente`, `Đế quốc`,
    `pháp sư`, `Đại quân`, `cụm tập đoàn quân Đế quốc trong khu vực`, `tiểu đoàn của
    Tanya`, `Dacia`, và cụm đã sửa theo signoff `Khả năng quân đội họ chặn đứng Đại
    quân, đồng thời đứng vững trước áp lực từ cụm tập đoàn quân Đế quốc trong khu
    vực`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000133: locks: [''Giữ câu thoại
    của Tanya: `“Vậy hẳn phải có chuyện gì đó — nói cách khác, có kẻ đang xía mũi
    vào việc không phải của mình.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000134: locks: [''Giữ câu thốt
    gọi `“Chỉ huy?!”` của Trung úy Weiss.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000135: locks: [''Giữ danh xưng
    `Trung úy Weiss`, đại từ `anh` cho Weiss, đại từ nội tâm `Mình` của Tanya, và
    việc lặp tên riêng `Tanya` ở cả hai vị trí trần thuật (`ý Tanya định nói`, `cấp
    dưới của Tanya`) theo đúng mục `vol02-ch02-b06-tanya-narration`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000136: locks: [''Giữ danh xưng
    `Trung úy Weiss`, đại từ `tôi`, và câu `“Trung úy Weiss, đây chỉ là suy đoán của
    tôi thôi. Ý kiến cá nhân ấy mà.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000137: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình`, các danh xưng `Liên bang`, `Dacia`, tên riêng `Tanya` trong
    mệnh đề trần thuật cuối, và đại từ `họ` quy chiếu `quân lính`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000138: locks: [''Giữ lời hô gọi
    `Thưa các vị`, đại từ `tôi`, các danh xưng `Cộng hòa`, `Khối Thịnh vượng chung`,
    và khẳng định `nhưng chắc chắn có bên đang can thiệp`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000139: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình`, thuật ngữ giữ nguyên `raison d’état` theo `vol02-ch02-b06-raison-detat`,
    tính từ `hợp lý`, cụm `lợi ích quốc gia`, các danh xưng `Khối Thịnh vượng chung`,
    `Cộng hòa`, `Liên minh Entente`, `Đế quốc`, và thuật ngữ đã khóa tạm `những động
    vật chính trị đúng nghĩa` theo `vol02-ch02-b06-political-animals`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000140: locks: [''Giữ đại từ `họ`,
    các danh xưng `Cộng hòa`, `Đế quốc`, hình ảnh ẩn dụ `con chó chọi của mình`, và
    câu hỏi mở đầu `Hay là giới lãnh đạo của họ nghiện chiến tranh, yêu thích nó đến
    mức không sao kiềm lại được?`.'']'
  non_canon: true
