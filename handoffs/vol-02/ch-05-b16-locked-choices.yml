choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000383
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000383: terms: [''kinh nghiệm chiến
    đấu'', ''đơn vị được huấn luyện bài bản'', ''tỷ lệ tổn thất'']: pronouns_and_address:
    Nhận định nội tâm tiếp nối của vị đại tá từ cuối `b15` không dùng đại từ nhân
    xưng.: pov_and_voice: Giọng suy ngẫm điềm đạm của vị đại tá Ban Tác chiến về giá
    trị của thực chiến bên cạnh một đơn vị thiện chiến.: modality_and_logic: Bảo toàn
    tình thái khuyến nghị (`nên được tích lũy`) và mệnh đề so sánh khẳng định kinh
    nghiệm thực tế vượt trội hơn trường lớp.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000384
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000384: terms: []: pronouns_and_address:
    Tanya đáp lời vị đại tá bằng `Rõ, thưa ngài!`.: pov_and_voice: Giọng đáp lễ dứt
    khoát, chuẩn mực quân ngũ của Tanya.: modality_and_logic: Bảo toàn tiếng đápรับ
    mệnh lệnh và sự lặp lại từ khóa `Kinh nghiệm` thể hiện sự đồng tình bề mặt giữa
    hai người.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000385
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000385: terms: [''trận cơ động
    quy mô lớn'', ''đột phá'', ''tập kích luồn sâu'', ''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri dùng tên riêng `Tanya` kèm phản thân `mình`, quy chiếu binh
    lính bằng `họ` (tuân thủ `DEC-P01-001`, không dùng `cô`).: pov_and_voice: Trần
    thuật hạn tri bám sát dòng tự kiểm điểm khắt khe của Tanya.: modality_and_logic:
    Bảo toàn trọn vẹn chuỗi lập luận: huấn luyện xác chết là vô nghĩa; ngoài chiến
    trường không biết lúc nào sẽ có cơ hội đánh cơ động quy mô lớn, đột phá hay tập
    kích luồn sâu; vì vậy phải luôn duy trì huấn luyện để binh lính sẵn sàng đáp ứng
    mệnh lệnh bất cứ lúc nào, khiến Tanya tự trách sự lơ là của bản thân.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000386
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000386: terms: [''đám lính mới'',
    ''những người lính lão luyện'']: pronouns_and_address: Độc thoại nội tâm ngôi
    thứ nhất của Tanya dùng `Mình` / `mình` theo đúng `DEC-P01-001`, quy chiếu đám
    lính mới bằng `họ`.: pov_and_voice: Độc thoại nội tâm thẳng thắn nhìn nhận sai
    lầm trong cách quản lý tân binh trước đó.: modality_and_logic: Bảo toàn quan hệ
    nhân quả và sự tự phủ định ở vế kết (`nhưng mình đã làm sai cách`): vì không muốn
    đơn vị chịu tổn thất nên từng nghĩ cứ để mặc đám lính mới tự xoay xở ngoài chiến
    trường thì chiến trường sẽ rèn họ thành lính lão luyện, song đó là cách làm sai
    lầm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000387
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000387: terms: [''chiến hào'']:
    pronouns_and_address: Vị đại tá tự xưng `tôi`, gọi Thiếu tá Tanya là `cô` và quy
    chiếu đám tân binh bằng `họ` (đồng bộ với `ch-05-b15`).: pov_and_voice: Giọng
    giao việc ôn tồn nhưng rõ mục đích của vị đại tá.: modality_and_logic: Bảo toàn
    câu điều kiện giả định: nếu có dịp huấn luyện tân binh một thời gian trong chiến
    hào thì vị đại tá muốn họ sát cánh chiến đấu cùng quân của Tanya.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000388
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000388: terms: [''tiểu đoàn'',
    ''Tanya'', ''chiến hào'', ''tân binh'', ''đơn vị huấn luyện'', ''Đế quốc'', ''nhân
    tính và lý trí'']: pronouns_and_address: Trần thuật hạn tri dùng tên riêng `Tanya`
    (có thể kết hợp `nó` / `mình` theo finding `m1`, tuyệt đối không dùng `cô` theo
    `DEC-P01-001`); câu độc thoại cuối dùng đại từ phiếm chỉ `người ta`.: pov_and_voice:
    Trần thuật hạn tri đan xen ba câu suy nghĩ nội tâm trực tiếp lên án sự tha hóa
    tư duy mà chiến tranh gây ra.: modality_and_logic: Bảo toàn sự nhìn nhận thực
    tế rằng việc đưa tiểu đoàn ra chiến hào kèm tân binh với tư cách đơn vị huấn luyện
    sẽ củng cố mặt trận, nối sang sự bàng hoàng của Tanya khi nhận ra bản thân đã
    rơi vào sự phi lý và lười biếng trong môi trường chiến tranh.: emphasis: Bảo toàn
    chính xác 3 cụm `*...*` tương ứng 3 thẻ `<html:em>` (`*Đế quốc đúng là tận dụng
    con người đến cùng.*`, `*Bởi vậy chiến tranh mới tệ hại*`, và `*Chiến tranh làm
    tê liệt nhân tính và lý trí, rồi khiến người ta phát điên vì những ảo tưởng mục
    nát.*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000389
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000389: terms: [''Tanya'', ''hậu
    phương'', ''chiến hào'']: pronouns_and_address: Phần trần thuật dùng tên riêng
    `Tanya` và phản thân `chính mình`; trong câu phản kháng suýt thốt ra thành lời
    (đặt trong dấu nhấn mạnh), Tanya dùng `ngài` – `tôi` hướng tới vị đại tá và `họ`
    cho đám tân binh; câu độc thoại nội tâm cuối đoạn dùng `Mình` / `mình` (`DEC-P01-001`)
    kết hợp đại từ khái quát `người ta`.: pov_and_voice: Trần thuật hạn tri kết hợp
    lời thoại giả định trong đầu và câu tự răn mình của Tanya.: modality_and_logic:
    Bảo toàn hai câu hỏi tu từ tăng tiến mà Tanya suýt buột miệng phản đối (rời hậu
    phương lao ra chiến hào, lại còn phải dẫn theo đám vô tích sự để huấn luyện),
    nỗi kinh hãi trước suy nghĩ bị vấy bẩn của bản thân, và kết luận nhượng bộ (`Mình
    biết... vậy mà một khi đã trải qua, mình mới thấm thía...`).: emphasis: Bảo toàn
    chính xác 1 cụm `*...*` bao trọn 2 câu hỏi tu từ tương ứng `<html:em>` (`*Ý ngài
    là bảo tôi rời hậu phương, lao ra chiến hào ư? Chưa hết, còn phải dẫn theo cả
    đám vô tích sự ấy và huấn luyện họ nữa sao?*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000390: terms: []: pronouns_and_address:
    Tanya đáp lệnh `Rõ!` và tự xưng `Tôi`.: pov_and_voice: Giọng nhận lệnh dứt khoát,
    nghiêm chỉnh của Tanya.: modality_and_logic: Bảo toàn cam kết cố gắng hết sức
    để huấn luyện đơn vị.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000391
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000391: terms: [''mệnh lệnh bằng
    văn bản'']: pronouns_and_address: Vị đại tá tự xưng `Tôi` (cá nhân người soạn
    lệnh) và `chúng tôi` (đại diện Bộ chỉ huy/Ban Tác chiến), gọi Tanya là `cô`.:
    pov_and_voice: Giọng cấp trên phấn khởi, lịch sự khích lệ thuộc cấp khi giao nhiệm
    vụ nặng nề.: modality_and_logic: Bảo toàn lời hứa chuẩn bị ngay mệnh lệnh bằng
    văn bản cùng lời xin lỗi vì gây áp lực và gửi gắm sự kỳ vọng vào Tanya.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000392
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000392: terms: []: pronouns_and_address:
    Tanya gọi vị đại tá là `thưa ngài` và tự xưng `tôi`.: pov_and_voice: Giọng cấp
    dưới tự tin, tháo vát cam kết mang lại kết quả sớm.: modality_and_logic: Bảo toàn
    lời nhận việc đầy tự tin và hứa sớm có thành quả báo cáo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000393
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000393: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật dùng `cả hai`, `họ` và tên riêng `Tanya`.: pov_and_voice: Trần thuật
    tổng kết khép lại phân cảnh giao nhiệm vụ với góc nhìn châm biếm nhẹ về sự lệch
    pha nhận thức.: modality_and_logic: Bảo toàn cấu trúc phủ định kép (`cả hai đều
    không nhận ra`) về sự mâu thuẫn rõ rệt trong quan điểm của họ khi Tanya bắt tay
    thực hiện mệnh lệnh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000394
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000394: terms: [''Tanya'', ''đại
    đội trưởng'', ''trận đánh đêm'', ''người chỉ huy nhóm tân binh'', ''lính hầu'',
    ''đơn vị tiếp tế'', ''đồ hộp'', ''cấp trên'', ''mạng lưới hậu cần'']: pronouns_and_address:
    Trần thuật hạn tri sau dấu ngắt cảnh dùng tên riêng `Tanya` (không dùng `cô` theo
    `DEC-P01-001`), quy chiếu người lính hầu bằng `anh ta`.: pov_and_voice: Trần thuật
    hạn tri mở đầu phân cảnh bữa tối kiêm hội ý tác chiến của Tanya.: modality_and_logic:
    Bảo toàn đầy đủ các hành động: Tanya vừa thong thả ăn tối vừa giao các đại đội
    trưởng chuẩn bị đánh đêm và trao đổi với chỉ huy nhóm tân binh; phàn nàn với lính
    hầu về khoai tây quá cũ; nhưng khi nghe báo đơn vị tiếp tế đang ưu tiên đồ hộp
    thì đành miễn cưỡng nhượng bộ vì nhận thấy cấp trên đang tập trung duy trì và
    tối ưu hóa mạng lưới hậu cần.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000395
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000395: terms: [''Đường sắt nhẹ'',
    ''đồ hộp'', ''ca-lo'', ''Tanya'']: pronouns_and_address: Độc thoại nội tâm dùng
    `họ` cho bên hậu cần và `mình` cho Tanya (`DEC-P01-001`); câu trần thuật cuối
    đoạn dùng tên riêng `Tanya`.: pov_and_voice: Độc thoại nội tâm phân tích hậu cần
    chuyển sang nỗi ngán ngẩm đời thường trước bữa ăn chiến trường.: modality_and_logic:
    Bảo toàn chuỗi suy luận: đường sắt nhẹ đã chạy gần hết công suất nên họ ưu tiên
    đồ hộp vì để được lâu và dễ vận chuyển theo kế hoạch; do đó khó lòng mong có rau
    củ, thịt hay cá tươi trong thời gian tới; lượng ca-lo vẫn đạt chuẩn nhưng bữa
    ăn vốn đã đạm bạc sẽ càng tẻ nhạt hơn.: emphasis: Bảo toàn chính xác 1 cụm `*...*`
    tương ứng `<html:em>` (`*Nhưng mà…*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000396
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000396: terms: [''hải quân'', ''các
    đơn vị tàu ngầm'']: pronouns_and_address: Độc thoại nội tâm của Tanya quy chiếu
    lính tàu ngầm bằng `họ`.: pov_and_voice: Độc thoại nội tâm liên tưởng lan man
    xen chút hài đen về đãi ngộ của lính tàu ngầm.: modality_and_logic: Bảo toàn sự
    thu hẹp phạm vi (`chỉ hải quân... Hay chỉ các đơn vị tàu ngầm thôi`) và mệnh đề
    đối lập bỏ lửng cuối đoạn rằng ngoài chuyện ăn uống được chăm lo tốt thì mọi mặt
    khác trong hoàn cảnh của lính tàu ngầm đều tệ nhất.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000397
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000397: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri quy chiếu bên hậu cần bằng `họ` và dùng tên riêng `Tanya` (không
    dùng `cô` theo `DEC-P01-001`).: pov_and_voice: Trần thuật hạn tri khép lại mạch
    suy nghĩ về khẩu phần để quay về cuộc họp tác chiến.: modality_and_logic: Bảo
    toàn quan hệ nhân quả: vì hiểu việc ưu tiên sự thuận tiện trong vận chuyển là
    hợp lý và không thể phản bác, Tanya đành bỏ qua chuyện ăn uống để tiếp tục cuộc
    họp.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000398
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000398: terms: [''trận đánh đêm'',
    ''tiểu đoàn pháp sư'', ''ma thuật'', ''thuật thức gây nhiễu'', ''vùng đất giữa
    hai chiến tuyến'', ''máy vô tuyến cá nhân'', ''đám tân binh'']: pronouns_and_address:
    Trần thuật hạn tri / nội tâm quy chiếu các pháp sư bằng `họ`.: pov_and_voice:
    Giọng phân tích chiến thuật nghiêm túc, chỉ rõ sự khắc nghiệt và rủi ro của bài
    toán đánh đêm không dùng ma thuật.: modality_and_logic: Bảo toàn trọn vẹn lập
    luận: phối hợp chặt chẽ và duy trì chỉ huy là yếu tố sống còn trong chiến dịch
    sắp tới; thông thường tiểu đoàn pháp sư đánh đêm sẽ duy trì kỷ luật bằng ma thuật,
    nhưng nếu thi triển thuật thức gây nhiễu giữa vùng đất giữa hai chiến tuyến thì
    sẽ bị phát hiện, lại không được phát máy vô tuyến cá nhân; do đó đánh đêm trong
    điều kiện này với tân binh là vô cùng liều lĩnh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000399
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000399: terms: [''Chiến dịch Eagle
    Claw'', ''Iran'']: pronouns_and_address: Nhận định nội tâm của Tanya không dùng
    đại từ nhân xưng.: pov_and_voice: Giọng mỉa mai sắc lạnh đặc trưng của Tanya khi
    dẫn chiến dịch thất bại nổi tiếng trong lịch sử hiện đại ra làm mốc so sánh.:
    modality_and_logic: Bảo toàn phép so sánh quá khứ mang tính phỏng đoán mỉa mai
    rằng ngay cả Chiến dịch Eagle Claw hướng tới Iran có lẽ còn có xác suất thành
    công cao hơn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000400
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000400: terms: [''các trung đội
    tự chủ'', ''tập kích'', ''trung đội pháp sư của Đế quốc'', ''đại đội bộ binh thường'',
    ''đại đội bộ binh'', ''trung đội pháp sư'']: pronouns_and_address: Độc thoại nội
    tâm của Tanya lược chủ ngữ hoặc ngầm hiểu `ta` / `chúng ta` trong câu hỏi mở đầu.:
    pov_and_voice: Độc thoại nội tâm cân nhắc phương án chia nhỏ đội hình thành các
    trung đội tự chủ.: modality_and_logic: Bảo toàn câu hỏi tự vấn mở đầu và phép
    đối chiếu thực tế rằng một trung đội pháp sư Đế quốc có hỏa lực và khả năng gây
    thiệt hại tương đương một đại đội bộ binh thường.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000401
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000401: terms: [''trận đánh đêm'',
    ''ma thuật'', ''thuật thức gây nhiễu'']: pronouns_and_address: Độc thoại nội tâm
    dùng `ta` / `chúng ta` cho phía đơn vị mình, và quy chiếu phía địch bằng `họ`
    / `đối phương` (có thể chỉnh `họ` thành `quân địch` / `chúng` theo finding `m4`).:
    pov_and_voice: Độc thoại nội tâm phân tích ưu thế ban đầu và rủi ro tiếp nối khi
    đánh đêm.: modality_and_logic: Bảo toàn hai vế đối lập: nếu bất ngờ giáng hỏa
    lực mạnh dưới màn đêm thì có thể gây hỗn loạn diện rộng, nhưng để tiếp tục chiến
    đấu sau đó sẽ phải dựa vào ma thuật, và ngay khoảnh khắc thi triển thuật thức
    gây nhiễu thì rất có thể địch sẽ rút lui rồi bắn phá bừa bãi cả khu vực.: emphasis:
    none'
  non_canon: true
