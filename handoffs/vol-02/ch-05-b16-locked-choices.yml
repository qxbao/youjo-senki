- segment_id: YS-LN02/Text/part0026.xhtml/p000403
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000403: terms: [''luồn sâu'', ''đại
    đội'', ''nghi binh'', ''tiểu đoàn tăng cường'', ''lực lượng dự bị'', ''hậu phương'']:
    pronouns_and_address: Độc thoại nội tâm dùng `ta` khi tính toán biên chế toàn
    tiểu đoàn ở câu 4, và chuyển sang `Mình` (`DEC-P01-001`) ở câu 5 khi nói rõ ý
    đồ giữ an toàn cá nhân của Tanya.: pov_and_voice: Độc thoại nội tâm chuyển mượt
    từ phân tích chiến thuật khách quan sang động cơ ích kỷ muốn ở lại tuyến sau của
    Tanya.: modality_and_logic: Bảo toàn trọn vẹn mạch lập luận 5 câu: đặt câu hỏi
    có nên luồn sâu theo cấp đại đội không; đánh giá phương án này thực tế nhưng độ
    khó tăng vọt; nhận xét việc cho từng nhóm nghi binh rồi tấn công từ bốn hướng
    khác nhau không phải ý tồi; chỉ ra điểm yếu là nếu tung cả bốn đại đội vào thì
    dù là tiểu đoàn tăng cường cũng hết sạch lực lượng dự bị; và chốt lại lý do bác
    bỏ phương án vì bản thân Tanya muốn lấy cớ chỉ huy đội dự bị để ở lại hậu phương.:
    emphasis: none'
  non_canon: true
