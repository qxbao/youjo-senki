source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 89f1bdf937ae3db1260ba2ffacb7117ad4fb8ecd2ba4eda8cc1330138aaebc87
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 33
segment_id_start: YS-LN02/Text/part0018.xhtml/p000302
segment_id_end: YS-LN02/Text/part0018.xhtml/p000334
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000302: locks: [''Giữ đại từ trần
    thuật `ông` quy chiếu Đại tá Sue theo bản sửa M5 đã nghiệm thu và câu `Hay nói
    đúng hơn, mọi việc diễn ra như ông dự liệu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000303
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000303: locks: [''Giữ các đại từ
    `Bọn chúng`, `ông` / `Ông` theo bản sửa M5 đã nghiệm thu, cùng đầy đủ các phủ
    định `gần như không bị tổn thất gì`, `không chút do dự`, `không có nghĩa ông có
    thể chùn bước`, `Ông không đời nào rút lui được`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000304
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000304: locks: [''Giữ các đại từ
    `Ông`, `cô ta`, tên riêng `Sue` theo bản sửa M5 đã nghiệm thu, thuật ngữ `một
    khẩu tiểu liên`, `nữ pháp sư kia`, và hình ảnh `biến cô ta thành tổ ong`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000305
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000305: locks: [''Giữ cụm `đơn
    vị của Thiếu tá von Degurechaff`, tên riêng `Tanya`, đại từ tự quy chiếu `mình`
    theo `DEC-P01-001`, cụm `bị bắt làm việc quá sức so với đồng lương nhận được`
    theo bản sửa M6 đã nghiệm thu (không tự thêm sắc thái phán xét đạo đức/chính trị
    ngoài nguồn), đúng phạm vi nhấn mạnh in nghiêng `*“Việc này đâu có trong hợp đồng
    của tôi”*` theo `DEC-P01-002`, và mệnh đề `quân đội cũng không vận hành như thế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000306
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000306: locks: [''Giữ câu khẳng
    định ngắn gọn `Phải tuân thủ quy tắc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000307
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000307: locks: [''Giữ đại từ trần
    thuật `nó` ở cả ba vị trí theo `DEC-P01-001` và bản sửa M1 đã nghiệm thu, các
    thuật ngữ `một trung đoàn pháp sư`, `pháp sư địch`, `cấp tiểu đoàn`, cấu trúc
    giả định quá khứ `Nếu một trung đoàn pháp sư kéo đến tấn công, có lẽ nó đã có
    thể vin vào quân số để kiếm cớ bỏ chạy`, và câu kết `Trong tình cảnh này, quân
    đội bảo phải chiến đấu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000308
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000308: locks: [''Giữ thuật ngữ
    `đội hình trung đội` và khẩu lệnh `“Chậc! Bọn này dai thật. Tấn công theo đội
    hình trung đội!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000309
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000309: locks: [''Giữ sự phân biệt
    giữa đại từ tự quy chiếu `mình` trong suy nghĩ gián tiếp (`Vừa nghĩ mình muốn
    bỏ chạy đến mức nào`) với tên riêng `Tanya` và đại từ trần thuật `nó` ở hai vị
    trí sau theo `DEC-P01-001` cùng bản sửa M1 đã nghiệm thu, và cụm `Miễn cưỡng,
    thậm chí bất đắc dĩ, nó đành chấp nhận mạo hiểm phần nào và chiến đấu.` theo bản
    sửa N9.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000310: locks: [''Giữ các thuật
    ngữ `chênh lệch về hỏa lực và quân số`, `áp sát đánh giáp lá cà`, `nguy cơ bắn
    nhầm`, `cấp độ cá nhân thay vì tổ chức`, và `các pháp sư Đế quốc chắc chắn sẽ
    chiếm ưu thế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000311
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000311: locks: [''Giữ khẩu lệnh
    `“Lên cao hơn chúng!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000312
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000312: locks: [''Giữ khẩu lệnh
    đối đáp `“Đừng để chúng chiếm vị trí cao hơn!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000313
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000313: locks: [''Giữ các thuật
    ngữ đã khóa `thuật thức` và `công nghệ khoa học mana` theo mục `vol02-ch03-b18-mana-science-technology`
    cùng bản sửa M4 đã nghiệm thu, và hình ảnh kết đoạn `Đáng buồn thay, bức tranh
    ấy chỉ được tô bằng máu và sắt thép.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000314
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000314: locks: [''Giữ các thuật
    ngữ `ưu thế quân số`, `cuộc chiến tiêu hao`, `trang bị và nhân lực`, và quan hệ
    điều kiện `Nếu trận chiến biến thành cuộc chiến tiêu hao, bên có nhiều trang bị
    và nhân lực hơn sẽ được tuyên bố là bên chiến thắng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000315
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000315: locks: [''Giữ thuật ngữ
    `quân tiếp viện` và câu thoại `“Ồ, quân tiếp viện đến rồi à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000316
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000316: locks: [''Giữ thuật ngữ
    `quân tiếp viện` và câu thoại `“Chết tiệt! Lại nữa à? Còn thêm quân tiếp viện
    sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000317
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000317: locks: [''Giữ thuật ngữ
    `Một trung đoàn`, tên riêng – cấp bậc `Tanya`, `Đại tá Sue` / `Sue`, đại từ phản
    thân `mình`, và sự đối lập rõ rệt giữa `giọng Tanya vô cùng phấn chấn, còn giọng
    Sue nghe bất lực và cay đắng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000318
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000318: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff`, thuật ngữ đã khóa `chiến dịch chiếm lĩnh`, và câu
    hỏi `“Thiếu tá von Degurechaff, tình hình chiến dịch chiếm lĩnh thế nào rồi?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000319
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000319: locks: [''Giữ các đại từ
    `họ`, `tôi`, thuật ngữ `một đơn vị địch`, `Yêu cầu chi viện`, và câu báo cáo `“Bên
    dưới họ đang quét dọn, nhưng hiện tôi đang giao chiến với một đơn vị địch. Yêu
    cầu chi viện.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000320
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000320: locks: [''Giữ các cụm `Hai
    tiểu đoàn các anh, chi viện cho thiếu tá!` (viết thường `thiếu tá` khi đứng một
    mình làm danh từ chung chỉ chức danh) và `Những người còn lại, tiến vào bên trong.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000321
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000321: locks: [''Giữ tên riêng
    `Tanya` theo bản sửa M1 đã nghiệm thu (không dùng `cô`), cụm `chỉ huy lực lượng
    tiếp viện`, `nói năng dứt khoát, đúng việc để chiến dịch diễn ra suôn sẻ` theo
    bản sửa N4, và các đại từ `Cả hai`, `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000322
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000322: locks: [''Giữ các thuật
    ngữ `Các khẩu pháo bờ biển đang bị chiếm`, `đơn vị địch có thể bị tiêu diệt`,
    `những tàu vận tải của Đế quốc`, `binh sĩ Lục quân Đế quốc`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000323
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000323: locks: [''Giữ tên tổ chức
    `Lục quân Đế quốc` và câu `Chiến thắng… Chẳng bao lâu nữa, đó sẽ là sự thật hiển
    nhiên trong tương lai gần của Lục quân Đế quốc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000324
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000324: locks: [''Giữ danh xưng
    `Đại tá Sue` và câu `Quê hương thân yêu của Đại tá Sue không còn đủ sức phản kháng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000325
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000325: locks: [''Giữ câu báo cáo
    `“Cảnh báo từ tuyến cảnh giới sớm!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000326
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000326: locks: [''Giữ các thuật
    ngữ `Các đơn vị quan sát dọc tuyến cảnh giới`, `phát tín hiệu báo động`, và `hạm
    đội Đế quốc đã xuất phát`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000327
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000327: locks: [''Giữ các thuật
    ngữ `cơ hội giao chiến trên biển`, `Bộ chỉ huy`, đại từ `họ`, và câu `Căng thẳng
    tại Bộ chỉ huy lập tức dâng lên đỉnh điểm.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000328
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000328: locks: [''Giữ thuật ngữ
    đã khóa `DEFCON 1`, đại từ `chúng`, và câu thoại `“Ra lệnh nâng mức báo động lên
    DEFCON 1. Cuối cùng chúng cũng chịu xuất hiện.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000329
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000329: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn câu `*Chúng ta đã chờ đợi.*` theo `DEC-P01-002` và
    đại từ `Chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000330
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000330: locks: [''Giữ các thuật
    ngữ `vị chỉ huy`, `Hải quân Cộng hòa`, `lục quân`, `phòng tuyến Rhine`, `hải quân`,
    đại từ `họ`, và ý `Đây là cơ hội để lấy lại danh dự; họ đã mong chờ dịp được hỗ
    trợ lục quân.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000331
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000331: locks: [''Giữ thuật ngữ
    `tàu vận tải`, đại từ `họ`, và câu hỏi sững sờ `“Ờ, họ có… tàu vận tải đi cùng
    à? Sao lại thế?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000332
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000332: locks: [''Giữ các thuật
    ngữ `hạm đội Đế quốc`, `giao chiến trên biển`, `Cuộc điều động hạm đội mà họ dự
    đoán quả thật đang diễn ra` theo bản sửa M3 đã nghiệm thu, `các chiến hạm`, `tàu
    vận tải`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000333
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000333: locks: [''Giữ các thuật
    ngữ `một biên đội thiết giáp hạm`, `những tàu vận tải chậm chạp, dễ bị tấn công`,
    cấu trúc điều kiện `Trừ phi hạm đội di chuyển đường dài`, và ý `những người tinh
    ý lập tức tự hỏi bên trong chở gì và bắt đầu cảm thấy điềm chẳng lành`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000334
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000334: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng chỉ cho câu hỏi mở đầu `*…Bên trong có thể là gì?*` theo
    `DEC-P01-002` và bản sửa M2 đã nghiệm thu, các thuật ngữ `than, dầu, lương thực
    cho binh sĩ, đạn dược, phụ tùng thay thế`, `một chiến dịch dài ngày`, `Hải quân
    Đế quốc`, và suy luận kết đoạn `Vậy thì những con tàu ấy hẳn đang chở thứ gì đó
    quan trọng đến nơi cần đến.`.'']'
  non_canon: true
