choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000208
  kind: locked_constraint
  value: Giữ “Ác quỷ sông Rhine”, đại từ sở hữu “của nó” (DEC-P01-001) và tỷ lệ thiệt
    hại “mất ít nhất một nửa quân số”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000209
  kind: locked_constraint
  value: Giữ chủ thể “Các sĩ quan chỉ huy và tham mưu”, thuật ngữ “trinh sát chiến
    đấu” và quan hệ nhượng bộ “bất chấp tiền đề đó, vẫn có nhu cầu quân sự cấp bách”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000210
  kind: locked_constraint
  value: Giữ “tiểu đoàn tăng cường”, “trinh sát chiến đấu” và thế lưỡng nan hai vế
    (quá nhiều thương vong vs. ít binh sĩ hơn thì không đạt được mục tiêu).
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000211
  kind: locked_constraint
  value: Giữ “Lục quân Đế quốc”, “Xưởng Vũ khí Kỹ thuật”, “Xưởng Vũ khí Kỹ thuật Hàng
    không”, đề xuất thiết bị trinh sát tầm cao bay ngoài tầm hỏa lực phòng không,
    và nhận định các đơn vị không quân có đội trinh sát đặc biệt vốn vượt trội ngay
    từ đầu.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000212
  kind: locked_constraint
  value: Giữ câu hỏi hoài nghi về tính khả thi với trình độ công nghệ hiện tại và
    sự đối lập giữa lời nói nâng độ cao dễ dàng với rào cản kỹ thuật thực tế của máy
    bay tầm cao.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000213
  kind: locked_constraint
  value: Giữ chức danh và tên “Kỹ sư trưởng Adelheid von Schugel” cùng cụm “phương
    pháp luận và hướng tiếp cận dưới góc nhìn ma pháp”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000214
  kind: locked_constraint
  value: Giữ nguyên câu thoại trong ngoặc kép có dấu ba chấm mở đầu, câu hỏi đề xuất
    “khí cụ đặc biệt để gia tốc bổ sung trong khi trinh sát chiến đấu”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000215
  kind: locked_constraint
  value: Giữ nguyên định dạng in nghiêng `*...*` bao quanh toàn câu hỏi ngắn (DEC-P01-002).
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000216
  kind: locked_constraint
  value: Giữ sắc thái rào đón “xét theo một nghĩa nào đó, lại rất đơn giản” cho câu
    trả lời trước thắc mắc của mọi người.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000217
  kind: locked_constraint
  value: Giữ “Trinh sát chiến đấu”, yêu cầu “xuyên thủng các tuyến đánh chặn của địch”,
    giả định đột kích đánh nhanh rút gọn và kết luận cần đơn vị tốc độ cao, vũ trang
    hạng nặng.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000218
  kind: locked_constraint
  value: Giữ mục tiêu gia tốc vượt qua vị trí địch trước khi bị đánh chặn, tên “Schugel”
    và cụm “đặt các pháp sư vào những khí cụ gia tốc bổ sung”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000219
  kind: locked_constraint
  value: Giữ mục đích “đo lường hệ thống phòng thủ và năng lực đánh chặn của địch”
    và thuật ngữ “nhiệm vụ trinh sát chiến đấu”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000220
  kind: locked_constraint
  value: Giữ mức độ “ở một mức độ nhất định”, thuật ngữ “trinh sát chiến đấu” và quan
    hệ nhân quả giải thích vì sao bộ binh hoặc pháp sư được dùng thường xuyên hơn
    máy bay.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000221
  kind: locked_constraint
  value: Giữ nguyên nhân “thương vong đã vượt quá giới hạn cho phép”, cơ quan “Xưởng
    Vũ khí Kỹ thuật” và câu chốt dẫn sang đoạn sau.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000222
  kind: locked_constraint
  value: Giữ câu thoại trong ngoặc kép truyền đạt kết luận cho các pháp sư xung phong
    ở tốc độ cao.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000223
  kind: locked_constraint
  value: Giữ thán từ mở đầu, logic tăng tỷ lệ đột phá thành công của pháp sư ở tốc
    độ cao, và phủ định ở câu cuối (không có pháp sư nào hoạt động nổi ở tốc độ và
    độ cao như vậy).
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000224
  kind: locked_constraint
  value: Giữ danh xưng “một thiên tài, Adelheid von Schugel” và hai hành động (đưa
    ra giải pháp + trăn trở cách hiện thực hóa).
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000225
  kind: locked_constraint
  value: Giữ đại từ “ông ta”, cấu trúc câu hỏi–đáp ngắn và giải pháp “Bổ sung tốc
    độ và độ cao bằng một khí cụ gắn ngoài”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000226
  kind: locked_constraint
  value: 'Giữ “Xưởng Vũ khí Kỹ thuật Hàng không”, đại từ “ông ta”, và sự phân biệt
    cốt lõi: độ cao chỉ là sản phẩm phụ, trọng tâm thực chất chỉ đặt vào tốc độ.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000227
  kind: locked_constraint
  value: Giữ thuật ngữ trong ngoặc kép “khí cụ gia tốc bổ sung”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000228
  kind: locked_constraint
  value: Giữ đại từ “ông ta” và ý chuyển mạch từ chuyện thiên tài sang xem xét trực
    tiếp kế hoạch.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000229
  kind: locked_constraint
  value: Giữ “tầng đẩy nhiên liệu hydrazine cỡ cực lớn”, “tầng đẩy dùng một lần”,
    đại từ “ông ta”, cơ chế tách rời cùng thùng nhiên liệu gắn ngoài khi cạn và hệ
    quả tăng tốc cao hơn vào gần cuối hành trình.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000230
  kind: locked_constraint
  value: Giữ đại từ “ông ta”, việc từ bỏ điều tiết các tầng đẩy, quyết định để khí
    cụ tiếp tục gia tốc trên đường thẳng, và phủ định tuyệt đối “pháp sư sẽ hoàn toàn
    không thể điều chỉnh tốc độ” khi đang vận hành.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000231
  kind: locked_constraint
  value: Giữ “bình phụ gia boron”, tỷ lệ “độc gấp mười lần kali xyanua” và công dụng
    “cơ động tránh né khẩn cấp” trên bầu trời quân địch.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000232
  kind: locked_constraint
  value: 'Giữ đầy đủ 5 thuật ngữ kỹ thuật/ma pháp: “sóng xung kích”, “lực cản sóng”,
    “khí đàn hồi”, “màn chắn bảo hộ” và “lớp vỏ phòng thủ” của pháp sư.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000233
  kind: locked_constraint
  value: Giữ dấu ngoặc đơn bao quanh toàn đoạn, điều kiện “chỉ khả thi khi tiêu thụ
    các tầng đẩy một cách không kiềm chế” và phủ định “máy bay chắc chắn sẽ không
    thể làm được”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000234
  kind: locked_constraint
  value: Giữ thông số “tốc độ mục tiêu siêu thanh khó tin là Mach 1.5” và hệ quả bỏ
    xa mọi thứ phía sau.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000235
  kind: locked_constraint
  value: Giữ so sánh dễ hiện thực hóa hơn mẫu máy bay trinh sát mới dưới góc độ kỹ
    thuật thuần túy và kỳ vọng sớm sẵn sàng cho thực chiến.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000236
  kind: locked_constraint
  value: Giữ “tầng đẩy” dùng một lần, “khí cụ gia tốc bổ sung” và giới hạn “chỉ có
    thể bay theo đường thẳng”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000237
  kind: locked_constraint
  value: Giữ yêu cầu pháp sư phải tự lực quay về căn cứ sau khi đột phá, ẩn dụ “tấm
    vé một chiều xuống địa ngục” và câu kết phủ định ý nghĩa của trinh sát nếu đi
    quan sát mà không thể quay về.
  non_canon: true
