task_id: vol-02-ch-02-b09
baseline_sha256: f8e4e4d9fe1eb6e66fa5f686a35856fdfd5655e6ef25ca1f66013c7d02dc4853
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 1903dddc6a7e5298f45b469ec0fe71d98af7fea98457c3a93a7a8af0cb74ebca
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 31
segment_id_start: YS-LN02/Text/part0014.xhtml/p000190
segment_id_end: YS-LN02/Text/part0014.xhtml/p000220
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000190
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000190: locks: [''Giữ các cụm `tiểu
    đoàn`, `số pháp sư còn lại`, `họ sẽ bị hạ từng người một`, `hợp quân với tàn quân
    của những đơn vị vẫn còn khả năng chiến đấu và nhận yểm trợ`, và tình thái đối
    chiếu `Có thể họ sẽ bị tổn thất, nhưng ít ra như vậy còn kháng cự tốt hơn là để
    xương cốt gãy nát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000191
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000191: locks: [''Giữ các danh
    xưng `Sở chỉ huy, rõ.`, `cấp chỉ huy`, các đại từ `Tôi` – `các anh`, và mệnh lệnh
    `Chờ năm phút.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000192
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000192: locks: [''Giữ cụm `sở chỉ
    huy vốn quan liêu`, `tiền tuyến`, đại từ `anh`, và đúng phạm vi nhấn mạnh in nghiêng
    của câu hỏi nội tâm theo `DEC-P01-002`: `*Tận năm phút cơ à?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000193
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000193: locks: [''Giữ số đếm `Ba
    trăm giây.`, đại từ `họ`, và câu hỏi `Trong lúc chờ đợi, họ sẽ phải né tránh rồi
    phản công bao nhiêu lần nữa?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000194
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000194: locks: [''Giữ danh xưng
    `Tiền quân` và lời thúc giục khẩn thiết `“Xin trả lời nhanh hết sức có thể. Tiền
    quân đã bị đánh tơi tả rồi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000195
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000195: locks: [''Giữ thuật ngữ
    đã sửa theo signoff `MOD-1` `thuật thức` (`né thuật thức`, theo `vol02-ch02-b09-formulas`),
    các cụm `trận hỗn chiến`, `tiền quân`, `thế phòng thủ kéo dài`, `được phép rút
    lui`, đại từ `Họ` / `họ` – `mình`, và phủ định tăng tiến `khó tự bảo vệ mình,
    nói gì đến phối hợp thành một đơn vị`, `họ cũng chẳng trụ được lâu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000196
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000196: locks: [''Giữ dấu ba chấm
    mở đầu và câu chuyển ý `…Đó là cách nghĩ đúng đắn, nhưng mọi chuyện đâu dễ dàng
    như vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000197
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000197: locks: [''Giữ cấp bậc `Trung
    úy`, các cụm `nhiều máy bay ở hướng hai giờ—máy bay ném bom`, `cấp dưới đang canh
    gác báo cáo, giọng gần như hét lên`, đúng phạm vi nhấn mạnh in nghiêng theo `DEC-P01-002`
    `*Khỉ thật, đúng là lúc tệ nhất thì đám phiền phức nhất lại xuất hiện.*`, `Những
    cỗ máy như chim`, `mặt trận phía bắc: máy bay ném bom`, các đại từ `Họ`, `chúng`,
    và các phủ định `con người không thể nào vác nổi`, `gần như chưa từng phát hiện`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000198
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000198: locks: [''Giữ nguyên hiệu
    ứng lắp bắp và dấu câu `“C-cao bao nhiêu?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000199: locks: [''Giữ con số trần
    không kèm đơn vị đo đúng như nguồn `“Độ cao 9.500.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000200
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000200: locks: [''Giữ đại từ `anh`
    và hai câu trần thuật `Trong câu hỏi của anh vẫn le lói chút hy vọng, nhưng câu
    trả lời thật tàn nhẫn. Một cơn ớn lạnh chạy dọc sống lưng anh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000201
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000201: locks: [''Giữ độ cao kèm
    đơn vị `Chín nghìn năm trăm foot.`, các danh xưng `pháp sư`, `máy bay ném bom`,
    đại từ `chúng`, và tình thái mức độ `Ở độ cao đó, chúng vẫn có thể ném bom mục
    tiêu phần nào.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000202
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000202: locks: [''Giữ các cụm `Một
    phi đội máy bay ném bom bị pháp sư truy đuổi`, `nhiệm vụ đánh chặn máy bay ném
    bom`, `các đơn vị không quân chuyên đánh chặn`, và cụm thuật ngữ `luôn giao chiến
    để giành ưu thế trên không` (theo `vol02-ch02-b09-air-supremacy-battles`), cùng
    các đại từ `chúng`, `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000203
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000203: locks: [''Giữ các cụm `một
    tiểu đoàn pháp sư ít ỏi`, `Vừa đánh hai tiểu đoàn, vừa chặn máy bay ném bom ư?`,
    `một mệnh lệnh bất khả thi`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000204
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000204: locks: [''Giữ hô hiệu và
    lời gọi khẩn `“Viper 02 gọi sở chỉ huy! Khẩn cấp!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000205: locks: [''Giữ câu đáp bị
    ngắt ngang bằng dấu gạch ngang dài `“Đây là sở chỉ huy. Tiểu đoàn Viper, chuyện
    gì—?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000206
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000206: locks: [''Giữ các đại từ
    `Chúng tôi`, `chúng`, các cụm `nhiều máy bay ném bom`, `Độ cao chỉ ước lượng bằng
    mắt, nhưng chúng ở khoảng 9.500 foot!`, phủ định `Không thể đánh chặn.`, và kiến
    nghị `Lập tức triển khai toàn bộ quân đã tập kết!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000207
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000207: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng theo `DEC-P01-002` `*Cái quái gì vậy?*`, danh xưng `Sở
    chỉ huy`, đại từ `anh`, và câu `Sở chỉ huy hỏi han quá lâu, anh tức giận ngắt
    lời.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000208
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000208: locks: [''Giữ các danh
    xưng `Máy bay ném bom`, `Tiêm kích`, `Pháp sư`, các đại từ `chúng`, `họ`, các
    thông số tốc độ không kèm đơn vị `250`, `200 đến 210`, `230`, `250`, và điều kiện
    giới hạn `Nếu cố hết sức, họ có thể chịu được tốc độ 250, nhưng lúc đó gần như
    chỉ bay thẳng được thôi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000209
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000209: locks: [''Giữ hình ảnh
    `Địch định tung cú đấm kép bằng bom và pháp sư.`, nhận định giới hạn `Cách đối
    phó quả thực chẳng có bao nhiêu.`, và đánh giá `Kẻ địch này quá mưu mẹo và tài
    giỏi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000210
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000210: locks: [''Giữ câu hỏi đã
    sửa theo signoff `MOD-2` (bảo toàn đối tượng câu hỏi về phương vị/hướng xuất hiện
    thay vì hướng bay): `“Máy bay ném bom ư? Cho biết số lượng và chúng ở hướng nào.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000211
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000211: locks: [''Giữ câu trả lời
    phương vị và số lượng `“Theo hướng nhìn của chúng tôi thì ở hướng hai giờ. Khoảng
    hai mươi chiếc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000212
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000212: locks: [''Giữ số lượng
    `Chỉ có hai mươi máy bay`, các cụm `kho nhiên liệu dự trữ cho mùa đông`, `Quân
    ở tiền tuyến sẽ rét cóng.`, và giả định thiệt hại `nếu bị ném bom trong tình trạng
    này, thiệt hại sẽ không hề nhỏ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000213
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000213: locks: [''Giữ tình thái
    `Chắc chắn đối phương biết điều đó.`, cấu trúc tương quan `đưa cả pháp sư lẫn
    máy bay ném bom đến`, đại từ `chúng`, và thành ngữ `Đúng là họa vô đơn chí.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000214
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000214: locks: [''Giữ câu hỏi qua
    vô tuyến `“Sở chỉ huy, rõ. Các anh có thể đánh chặn chúng không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000215
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000215: locks: [''Giữ đại từ `Anh`,
    đúng phạm vi nhấn mạnh in nghiêng của tiếng kêu nội tâm theo `DEC-P01-002` `*Bằng
    cách nào?!*`, các đại từ `Chúng`, `chúng tôi`, phủ định `pháp sư địch vẫn chưa
    bị tiêu diệt`, và thuật ngữ đã sửa theo signoff `MOD-1` `thuật thức bắn tỉa tầm
    xa` (`Hiện giờ chúng tôi khó lòng dùng thuật thức bắn tỉa tầm xa.`, theo `vol02-ch02-b09-formulas`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000216
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000216: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng theo `DEC-P01-002` chỉ ở cụm `*rõ ràng là bất khả thi*`,
    thông số `chênh lệch độ cao 3.500 foot`, điều kiện giả định `Nếu đủ quân số và
    khai hỏa có kỷ luật thì có lẽ còn được, nhưng cơ hội của họ cũng chỉ đến thế.`,
    và câu kết `Đánh chặn chúng trong khi không chiến với pháp sư địch là chuyện không
    thể thực hiện.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000217
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000217: locks: [''Giữ đại từ `Chúng
    ta`, tên địa danh cơ sở hậu cần đã sửa theo signoff `Kho Kraggana` (theo `vol02-ch02-b09-kraggana-depot`),
    và câu `“…Chúng ta nhất định phải tránh để Kho Kraggana bị ném bom.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000218: locks: [''Giữ câu đáp điều
    kiện phủ định `“Nếu tất cả đều chết thì còn đánh đấm gì được nữa.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000219
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000219: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng của hai câu độc thoại nội tâm đầu đoạn theo `DEC-P01-002`:
    `*Sở chỉ huy có vẻ muốn trông cậy vào chúng ta, nhưng việc bất khả thi thì vẫn
    là bất khả thi. Có những việc làm được và không làm được, còn chúng ta đã cố hết
    sức rồi.*`, danh xưng ngoài vùng in nghiêng `người chỉ huy Tiểu đoàn Viper`, các
    đại từ `anh`, `họ`, và nhận định `Dường như dù họ có làm gì thì cuối cùng cũng
    sẽ bị tiêu diệt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000220
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000220: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các đại từ `họ`, `chúng
    ta`, sự chuyển nhịp tự quy chiếu từ `Tôi` / `tôi` sang `mình`, và toàn văn `*Vậy
    họ định bảo chúng ta chuẩn bị tinh thần bị tiêu diệt sạch rồi kháng cự sao? Tôi
    chỉ mỉa mai cho vui thôi, vậy mà ngay cả tôi cũng bắt đầu triết lý hóa rồi. Có
    lẽ mình nên chuẩn bị chết.*`.'']'
  non_canon: true
