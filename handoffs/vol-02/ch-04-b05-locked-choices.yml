segment_id_end: YS-LN02/Text/part0022.xhtml/p000113
choices:
- segment_id: YS-LN02/Text/part0022.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000096: locks: [''Giữ hai câu hỏi
    nội tâm mở đầu (`Việc họ không thông qua quân đội địa phương hẳn có nghĩa đây
    là điều Bộ Tổng tham mưu muốn sao? Hay họ đang trực tiếp can thiệp?`), đại từ
    tự quy chiếu nội tâm `mình` (`Dù thế nào, mình cũng có linh cảm chẳng lành.`),
    câu trần thuật ngôi thứ ba dùng tên riêng `Tanya` và đại từ `nó` theo `DEC-P01-001`,
    cùng các thuật ngữ `quân đội địa phương`, `Bộ Tổng tham mưu`, `nhân viên điện
    đài`, `bức điện tín`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000097: locks: [''Giữ bản sửa M1
    đã được nghiệm thu (`Đáp lại yêu cầu của nó, anh ta đọc mệnh lệnh nhiệm vụ`),
    phân biệt rõ đại từ `nó` (Tanya) với `anh ta` (nhân viên điện đài) và `Các sĩ
    quan`, cùng nguyên văn bức điện mệnh lệnh (`“Đây là mệnh lệnh tác chiến tìm diệt
    dành cho Tiểu đoàn 203. Lập tức đình chỉ mọi cuộc diễn tập trước đó. Yêu cầu tiến
    thẳng đến vùng biển đã chỉ định, xác định vị trí địch và phong tỏa khu vực. Hết!”`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000098: locks: [''Giữ giọng độc
    thoại nội tâm bức xúc của Tanya, thuật ngữ `“tìm diệt”` / `tìm diệt` theo mục
    `vol02-ch04-b05-search-destroy`, các phủ định (`cứ như chẳng có gì to tát`, `thời
    nay còn ai dùng kiểu tìm diệt nữa đâu!`, `Pháp sư cũng chẳng có cách nào định
    hướng trên biển`), đại từ số nhiều `bọn mình` trong câu hỏi (`vậy bọn mình phải
    tìm địch rồi phong tỏa khu vực bằng cách nào?`), và câu kết `Đúng là nhiệm vụ
    bất khả thi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000099: locks: [''Giữ danh xưng
    cấp bậc đã sửa theo M3 `Thiếu úy Serebryakov` theo mục `vol02-ch04-b05-serebryakov-rank`,
    tên riêng `Tanya`, các thuật ngữ `tấm hải đồ` và `vùng duyên hải Norden` theo
    mục `vol02-ch04-b05-norden`, đại từ trần thuật `nó` xuyên suốt đoạn kết hợp đại
    từ phản thân nội tâm `mình` trong mệnh đề bổ ngữ (`khiến nó phải đối mặt với thực
    tế rằng mình sẽ phải bay trong vùng trời mà chẳng biết phương hướng, và điều đó
    làm nó chán nản khủng khiếp`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000100: locks: [''Giữ danh xưng
    cấp bậc đã sửa theo M3 `Thiếu úy` / `Thiếu úy Serebryakov`, đại từ tự xưng `tôi`
    trong lời lệnh của Tanya (`“Thiếu úy, lấy cho tôi bản đồ kiểm soát tác chiến khu
    vực Biển Bắc. Gọi Norden Control.”`), câu độc thoại nội tâm dùng `mình` (`Chuyện
    này làm mình đau đầu quá.`), tên riêng `Tanya` trong câu trần thuật, cùng các
    thuật ngữ `bản đồ kiểm soát tác chiến` (`vol02-ch04-b05-combat-control-map`),
    `khu vực Biển Bắc`, `Norden Control`, `bên kiểm soát địa phương`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000101: locks: [''Giữ câu đáp nhận
    lệnh của Thiếu úy Serebryakov `“Vâng, thưa thiếu tá. Tôi làm ngay.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000102: locks: [''Giữ bản sửa M2
    và L2 đã được nghiệm thu: đại từ `Cô` ở đầu câu chỉ Thiếu úy Serebryakov, danh
    từ `ống nghe`, định danh `Norden Control`, thuật ngữ `nhân viên điện đài` và `phối
    hợp ngang cấp`, cùng hệ đại từ nội tâm ngôi thứ nhất `mình` / `Bọn mình` xuyên
    suốt cả đoạn (`Cô đưa bản đồ và ống nghe cho mình... Bọn mình chỉ trao đổi đôi
    ba câu, rồi nhân viên điện đài nối máy cho mình với một người bên hải quân. Tệ
    nhất là khi họ không chuyển việc cho mình một cách vô trách nhiệm, mà lại phối
    hợp ngang cấp rất tốt.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000103: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình`, phủ định `chẳng thể lười biếng rồi đổ lỗi cho phối hợp kém
    được`, dấu nhấn mạnh chữ nghiêng `*quá*` theo `DEC-P01-002` (`Có lẽ *quá* hiệu
    quả cũng chẳng hay.`), và các cụm `tinh thần trách nhiệm trong công việc của họ`,
    `công dân tốt`, `khen đồng bào làm tròn bổn phận cũng là phải lẽ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000104: locks: [''Giữ tình thái
    phỏng đoán `có lẽ`, đại từ nội tâm `mình`, và cụm `cố chịu đựng vì lợi ích chung.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000105: locks: [''Giữ đại từ nội
    tâm `mình`, các phủ định (`Không còn lựa chọn nào khác`, `mà chẳng để phí một
    phút nào`, `chẳng có ngày nào được phép nuông chiều bản thân bằng cách lãng phí
    thời gian`), thuật ngữ ẩn dụ `chiến binh công sở` theo mục `vol02-ch04-b05-corporate-warrior`,
    và mệnh đề mục đích – điều kiện `Muốn được tự do làm điều mình thích vào ngày
    nghỉ thì phải đạt hiệu suất công việc cao nhất.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000106: locks: [''Giữ câu nhận
    định ngắn gọn và phủ định `Với một người lính, chẳng có gì thay đổi cả.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000107: locks: [''Giữ cấp bậc gọi
    đã sửa theo M3 `Thiếu úy!`, tên riêng `Hạm đội Biển Bắc` theo mục `vol02-ch04-b05-northern-sea-fleet`,
    và câu hỏi `“Thiếu úy! Hạm đội Biển Bắc hiện ở đâu?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000108: locks: [''Giữ câu đáp khẩn
    trương của Serebryakov `“Tôi sẽ hỏi ngay ạ!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000109: locks: [''Giữ dấu nhấn
    mạnh chữ nghiêng `*...*` bao quanh đúng mệnh đề suy nghĩ trực tiếp và đại từ `mình`
    theo `DEC-P01-001` & `DEC-P01-002` (`*Cỗ máy quân sự bắt đầu vận hành, còn mình
    là một bánh răng trong đó*, Tanya tự động nghĩ.`), tên riêng `Tanya` và đại từ
    trần thuật `nó` ở phần sau, cùng các thuật ngữ `bánh răng`, `chiến hạm`, `Liên
    minh Entente` (`vol02-ch04-b05-entente-alliance`), `hạm đội phe mình`, `bản ghi
    nhớ tổng quan`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000110: locks: [''Giữ quan hệ nhượng
    bộ và đối chiếu giữa `Hạm đội Biển Bắc` (`vol02-ch04-b05-northern-sea-fleet`)
    với lực lượng mạnh nhất của `Đế quốc` là `Hạm đội Viễn dương` (`vol02-ch04-b05-high-seas-fleet`),
    các thuật ngữ `chiến hạm`, `tàu chiến chủ lực` (`vol02-ch04-b05-capital-ships`),
    `chiến dịch đổ bộ`, và câu chuyển ý cuối đoạn `Nhưng một trận chiến bất ngờ lại
    là chuyện khác.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000111: locks: [''Giữ danh xưng
    đã sửa theo M3 `Thiếu úy Serebryakov`, tên riêng `Tanya`, đại từ trần thuật `Nó`
    / `nó` xuyên suốt đoạn, các phủ định (`lĩnh vực nó chưa có kinh nghiệm`, `nó không
    thể bình tĩnh`), cụm `nhiệm vụ cần phản ứng nhanh`, và chi tiết `chỉ gắng gượng
    kìm lại thôi thúc muốn đưa ra cả nghìn chỉ thị khác nhau.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000112: locks: [''Giữ đại từ trần
    thuật `Nó`, phủ định mục đích `để người xung quanh không nhận ra`, và nhận xét
    `Đôi khi thấp bé cũng có ích. Nhờ vậy ít bị chú ý hơn, mà những lúc như thế này
    thì thật tiện.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000113: locks: [''Giữ đại từ nội
    tâm `bọn mình` và `mình`, câu hỏi cảm thán đầu đoạn (`Dẫu vậy, bọn mình còn chưa
    từng diễn tập trên mặt biển, giờ đã bị ném thẳng vào một trận hải chiến thực sự
    sao?`), các thuật ngữ `chiến hạm Liên minh Entente`, `Nhiệm vụ hỗ trợ truy đuổi`,
    so sánh ẩn dụ `Cứ như phải thương lượng để thâu tóm một công ty mà chẳng biết
    gì về phía bên kia.`, và câu điều kiện giả định kết đoạn (`Nếu mình có ưu thế
    áp đảo đến mức cuộc thương lượng này sẽ thành công, thì phải đặt câu hỏi liệu
    ngay từ đầu có cần đàm phán hay không.`).'']'
  non_canon: true
