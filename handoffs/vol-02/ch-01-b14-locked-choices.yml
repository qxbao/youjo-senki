choices:
- segment_id: YS-LN02/Text/part0012.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000001: locks: [''Giữ thán từ nghi
    vấn ngắn `“Hả?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000002: locks: [''Giữ lời gạt đi
    và phủ định mệnh lệnh `“Chỉ là tiếng cảm thán thôi. Đừng bận tâm.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000003: locks: [''Giữ tên riêng
    `Tanya` theo DEC-P01-001 và M1 đã sửa trong signoff (tuyệt đối không dùng `cô`),
    cùng cụm `buông một câu lảng sang cảnh tượng kỳ vĩ ấy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000004: locks: [''Giữ địa danh
    `Dacia`, đại từ `Họ` và `chúng ta`, cấu trúc tăng tiến `không chỉ… mà còn…`, và
    các cụm thuật ngữ `diễn tập bắn đạn thật`, `màn pháo hoa sau buổi huấn luyện`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000005: locks: [''Giữ tên riêng
    `Tanya` và đại từ trần thuật `nó` theo DEC-P01-001, câu điều kiện `Nếu phải tóm
    lại`, và hình ảnh so sánh `vụ nổ khổng lồ tựa mặt trời phía dưới chẳng khác nào
    màn pháo hoa mừng công lao phục vụ của nó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000006: locks: [''Giữ đại từ `chúng
    ta`, danh từ `căn cứ`, và cách gọi thuộc cấp `các binh sĩ` (`“Dù sao thì chúng
    ta cũng đã hoàn thành mục tiêu. Quay về căn cứ thôi, các binh sĩ.”`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000007: locks: [''Giữ danh xưng
    cấp bậc `vị đại úy ấy` và thuật ngữ `khẩu phần thời chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000008: locks: [''Giữ các thuật
    ngữ `bộ phận Nhân sự`, `Nhà ăn Bộ Tổng tham mưu`, `“quán cà phê chiến trường thường
    trực”`, `binh sĩ`, `hậu phương`, và cấu trúc phủ định `khiến binh sĩ không thể
    quên những trải nghiệm chiến đấu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000009: locks: [''Giữ danh xưng
    `Thiếu tướng von Rudersdorf`, đại từ trần thuật `ông`, các cụm `các đồng nghiệp
    cấp dưới`, `nhà ăn`, `những món ăn “độc đáo”`, `Khối Thịnh vượng chung`, và hai
    cấu trúc phủ định `chẳng thể phủ nhận điều đó`, `theo cách mà chẳng người bình
    thường nào hiểu nổi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000010: locks: [''Giữ danh xưng
    `Thiếu tướng von Zettour`, cơ quan `Bộ Tổng tham mưu`, danh từ thống nhất `nhà
    ăn`, phủ định `chẳng có sĩ quan nào ở Bộ Tổng tham mưu thực sự thích thức ăn ấy`,
    và cấu trúc nhượng bộ – điều kiện `dù việc bàn chuyện cơ mật trong nhà ăn thường
    được xem là ý tưởng tồi, nơi này lại là địa điểm lý tưởng để họp bàn chiến lược
    nếu cần giữ bí mật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000011: locks: [''Giữ tên riêng
    `Zettour`, `Rudersdorf`, danh từ `nhà ăn`, đại từ `họ`, và cụm `đành miễn cưỡng
    bắt đầu dùng ít nhất một trong ba bữa mỗi ngày tại đó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000012: locks: [''Giữ cấu trúc
    phủ định kép một phần `“…Thời gian không hẳn đứng về phía Đế quốc, nhưng cũng
    chẳng hẳn đứng về phía kẻ địch của ta,”`, tên riêng `Rudersdorf`, đại từ `ông`,
    các thuật ngữ đã sửa theo signoff `cà phê giả`, `thực phẩm giống bánh mì`, `đồ
    thay thế`, `chiếc tách Meissen`, và phạm vi nhấn mạnh `ông nhận ra qua cảm giác
    khi chạm và độ bóng rằng chỉ có chiếc tách Meissen trong tay mới đáng gọi là hàng
    thật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000013: locks: [''Giữ danh xưng
    `Đế quốc`, cụm `cùng lúc đối phó với hai mặt trận quá lâu thì không ổn`, và câu
    hỏi phản vấn của Zettour với Rudersdorf `Thế mà ông vẫn nghĩ thời gian có thể
    đứng về phía chúng ta sao, Rudersdorf?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000014: locks: [''Giữ tên riêng
    `Zettour`, `Rudersdorf`, đại từ `Ông` / `ông`, và các thuật ngữ đã sửa theo final
    signoff `hậu cần`, `sĩ quan Bộ Tổng tham mưu`, `chiến lược hay tác chiến`, `lý
    thuyết tác chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000015: locks: [''Giữ tên cơ quan
    `Bộ Tổng tham mưu`, tên riêng `Rudersdorf`, `Zettour`, và cụm thuật ngữ đã sửa
    theo signoff `phụ trách tác chiến, chủ yếu là tác chiến cơ động`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000016: locks: [''Giữ địa danh
    `Dacia`, tên riêng `Rudersdorf`, `Zettour`, `Bộ Tổng tham mưu`, và các thuật ngữ
    `chiến tranh cơ động`, `triển khai binh lực hiệu quả`, `đơn vị tiên phong`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000017: locks: [''Giữ quan hệ nhân
    quả và tình thái phủ định trong lời đáp của Rudersdorf `“Dĩ nhiên, càng kéo dài
    thì càng lãng phí. Nhưng chính vì thế mà chiến lược căn bản của chúng ta, tiêu
    diệt kẻ địch yếu nhất trước như đã làm ở Dacia, không nên thay đổi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000018: locks: [''Giữ cặp đại từ
    đối thoại `tôi` – `ông`, câu trích dẫn trực tiếp đã sửa theo signoff `‘Tôi cho
    ông thời gian, nên hậu cần ông lo đi?’`, tên riêng giữ nguyên `Anluk E. Kahteijanen`,
    địa danh `Norden`, và các thuật ngữ `các cơ sở cảng`, `vật tư quân sự`, `cuộc
    tấn công mùa đông`.'']'
  non_canon: true
