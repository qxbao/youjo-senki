  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000174: names_and_ranks: []: pronouns_and_address:
    [''Thoại phía Liên minh Entente quy chiếu quân Đế quốc bằng "chúng" và "Lũ khốn
    kiếp!"'']: pov_and_logic: [''Giữ câu hỏi hoảng hốt về việc lộ tin tình báo, câu
    nói bị ngắt ngang bởi tình thế cấp bách và tiếng chửi thề cuối câu'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000175
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000175: names_and_ranks: [''Entente
    Alliance fleet -> hạm đội Liên minh Entente'', ''counter-sub combat -> tác chiến
    chống tàu ngầm'', ''destroyer -> khu trục hạm'', ''flagship -> soái hạm'', ''marine
    mages -> các pháp sư thủy quân lục chiến'', ''lookouts -> những người quan sát'',
    ''torpedo wakes -> vệt sóng ngư lôi'']: pronouns_and_address: []: pov_and_logic:
    [{''Giữ trọn ba yếu tố khiến thời điểm bị tập kích trở nên tồi tệ nhất với hạm
    đội Liên minh Entente'': ''khu trục hạm hộ tống soái hạm đã tách ra để chống ngầm,
    các pháp sư thủy quân lục chiến đã lao đi chế áp tàu ngầm, và những người quan
    sát đều đang rà mặt biển tối đen tìm vệt sóng ngư lôi''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000176: names_and_ranks: [''enemy
    mage battalion -> Tiểu đoàn pháp sư địch'', ''flagship -> soái hạm'']: pronouns_and_address:
    []: pov_and_logic: [''Giữ hành động tiểu đoàn pháp sư địch ẩn nấp trên bầu trời
    lao hết tốc lực thẳng vào soái hạm'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000177: names_and_ranks: [''Colonel
    Sue -> Đại tá Sue'']: pronouns_and_address: []: pov_and_logic: [''Giữ số lượng
    ít ỏi pháp sư kịp cất cánh nghênh chiến, trong đó có Đại tá Sue'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000178
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000178: names_and_ranks: [''imperial
    mages -> các pháp sư Đế quốc'']: pronouns_and_address: [''Trần thuật ngôi thứ
    ba quy chiếu Đại tá Sue bằng "ông", nhóm của Sue bằng "họ", và các pháp sư Đế
    quốc bằng "đối phương"'']: pov_and_logic: [''Giữ hai lợi thế tuyệt đối của pháp
    sư Đế quốc (bổ nhào đổi độ cao lấy gia tốc nên nhanh hơn hẳn, lại nắm quyền kiểm
    soát bầu trời) và phủ định nhấn mạnh mức độ tuyệt vọng không thể tệ hơn trong
    suy nghĩ của Sue'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000179
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000179: names_and_ranks: [''Sue
    -> Sue'', ''fatherland -> quê hương'']: pronouns_and_address: [''Trần thuật ngôi
    thứ ba quy chiếu Sue bằng tên riêng "Sue" và đại từ sở hữu "ông" ("quê hương ông")'']:
    pov_and_logic: [''Giữ quyết tâm của Sue chỉ còn cách lấy độ cao và giả định nếu
    không làm vậy thì con tàu ấy cùng mầm non tương lai của quê hương ông sẽ bị đánh
    chìm'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000180
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000180: names_and_ranks: [''Major
    von Degurechaff -> Thiếu tá von Degurechaff'', ''203rd Aerial Mage Battalion ->
    Tiểu đoàn Pháp sư Không quân 203'', ''Tanya -> Tanya'']: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu tập thể Tiểu đoàn 203 bằng "họ"'']: pov_and_logic:
    [''Giữ sự đối lập giữa cái nhìn hậu chiến (cảm xúc của Thiếu tá von Degurechaff
    cùng thời gian, địa điểm lúc đó về sau trở thành chủ đề của nhiều cuộc điều tra)
    và thực tế tại hiện trường (Tiểu đoàn 203 gồm cả Tanya phần nào rối loạn vì chạm
    trán bất ngờ nhưng vẫn lao vào theo phản xạ huấn luyện)'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000181
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000181: names_and_ranks: [''Battalion
    -> Tiểu đoàn'']: pronouns_and_address: [''Khẩu lệnh chỉ huy trực tiếp của Tanya
    với toàn đơn vị'']: pov_and_logic: [{''Giữ nhịp khẩu lệnh dồn dập'': ''gọi tiểu
    đoàn, lặp hai lần lệnh "Tản ra!" và lệnh chuẩn bị tấn công''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000182: names_and_ranks: [''Tanya
    -> Tanya'', ''balance of power -> thế cân bằng quyền lực'', ''leading nations
    -> các cường quốc'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu
    Tanya bằng tên riêng "Tanya" và đại từ "nó" theo DEC-P01-001'']: pov_and_logic:
    [{''Giữ chuỗi giải thích nguyên nhân – hệ quả'': ''Tanya quyết định giao chiến
    trong tích tắc và chúi đầu lao xuống dù chưa từng có kinh nghiệm đánh tàu, vì
    nhờ thế cân bằng quyền lực và nỗ lực ngoại giao mà các cường quốc đã tránh được
    xung đột vũ trang nghiêm trọng trước cuộc chiến này, khiến đây gần như là cuộc
    tấn công tàu đầu tiên trong lịch sử do pháp sư thực hiện''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000183
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000183: names_and_ranks: [''203rd
    Aerial Mage Battalion -> Tiểu đoàn Pháp sư Không quân 203'']: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "Nó" (DEC-P01-001) ở câu thứ hai,
    quy chiếu tập thể đơn vị bằng "họ" / "tất cả" và đại từ phản thân "mình" ("xương
    máu mình")'']: pov_and_logic: [''Giữ chi tiết đơn vị làm theo bài tập đã luyện
    (tản ra, né hỏa lực phòng không và đồng loạt bổ nhào xuống) cùng nhận định đây
    là chiến thuật thuộc học thuyết mới chỉ kiểm chứng trên lý thuyết, chưa ai biết
    có hiệu quả hay không cho tới khi Tiểu đoàn 203 lấy chính xương máu mình ra thử
    nghiệm'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000184
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000184: names_and_ranks: []: pronouns_and_address:
    [''Quy chiếu phía hạm đội Liên minh Entente hứng đòn tấn công bằng "họ"'']: pov_and_logic:
    [{''Giữ sự tương đồng tình cảnh của phía bị tấn công'': ''khả năng máy bay đánh
