    đó, cuộc đấu súng của cả hai bên đều hết sức vụng về'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000186
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000186: names_and_ranks: [''Pixie
    01 -> Pixie 01'', ''CP -> CP'']: pronouns_and_address: [''Liên lạc vô tuyến khẩn
    cấp giữ nguyên hô hiệu "Pixie 01" và định danh "CP"'']: pov_and_logic: [''Giữ
    hai lần hô báo động liên tiếp "Phát hiện địch! Phát hiện địch!"'']: emphasis:
