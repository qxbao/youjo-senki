    nhào từ trên cao xuống kết liễu''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000172
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000172: names_and_ranks: [''Colonel
