  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000187
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000187: names_and_ranks: [''CP
    -> CP'', ''Pixie 01 -> Pixie 01'']: pronouns_and_address: [''Đáp lời vô tuyến
    từ CP gọi Pixie 01'']: pov_and_logic: [''Giữ câu hỏi bình thản của đầu dây CP
    ("Có chuyện gì?") làm cơ sở cho sự bực tức của Tanya ở đoạn kế tiếp'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000188
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000188: names_and_ranks: [''Tanya
    -> Tanya'', ''CP radio operator -> người báo vụ viên ở CP'', ''anti-air fire ->
    hỏa lực phòng không'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu
    Tanya bằng tên riêng "Tanya" và đại từ "nó" (DEC-P01-001), đại từ khái quát/nội
    tâm ở câu đầu dùng "mình"; câu càu nhàu nội tâm trực tiếp gọi báo vụ viên CP là
    "anh"'']: pov_and_logic: [''Giữ sự đối lập giữa cơn bực dọc trong bụng đối với
    người báo vụ viên ở CP và phần tỉnh táo hơn trong đầu cảm thấy nhẹ nhõm vì hỏa
    lực phòng không của địch không mấy ấn tượng'']: emphasis: [''Giữ đúng phạm vi
    nhấn mạnh Markdown `*Rốt cuộc ý anh là gì khi bảo sẽ không có địch?*` tương ứng
    với câu nội tâm in nghiêng duy nhất trong nguồn theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000189
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000189: names_and_ranks: [''American
    empire -> Đế quốc Mỹ'', ''Tanya -> Tanya'', ''search units -> các đơn vị trinh
    sát'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng tên
    riêng "Tanya" và đại từ "nó" theo DEC-P01-001'']: pov_and_logic: [''Giữ phép so
    sánh hỏa lực phòng vệ của địch kém xa hỏa lực phòng không của Đế quốc Mỹ mà Tanya
    đang nghĩ tới, mức độ thưa thớt chỉ cần bay lạng quạng cũng né được, và nỗi bực
    tức tự hỏi các đơn vị trinh sát khác đã làm gì'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000190
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000190: names_and_ranks: [''battle
    cruiser gun -> pháo tuần dương hạm'', ''Wiengenberg -> Wiengenberg'']: pronouns_and_address:
    [''Báo cáo vô tuyến của Tanya tự xưng "Tôi"'']: pov_and_logic: [{''Giữ đủ ba thông
    tin báo cáo tác chiến'': ''đang bị bắn, xác định chớp lửa từ pháo tuần dương hạm,
    và vị trí "Cách bờ biển Wiengenberg hai trăm." (giữ nguyên con số không kèm đơn
    vị đo của nguồn)''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000191
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000191: names_and_ranks: [''naval
    guns -> pháo hạm'', ''small arms -> súng bộ binh'', ''field artillery -> pháo
    dã chiến'', ''autocannon -> pháo tự động'', ''heavy machine gun -> súng máy hạng
    nặng'', ''high-angle cannons -> pháo góc cao'', ''anti-air guns -> pháo phòng
    không'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng
    "nó" (DEC-P01-001); câu nhận định chiến thuật cuối đoạn dùng đại từ tập thể "chúng
    ta" cho toàn đơn vị'']: pov_and_logic: [''Giữ hành động lập tức phá vỡ đội hình
    sau khi báo cáo cùng toàn bộ chuỗi phân tích thông số vũ khí (pháo tự động 20
    mm ngang cỡ súng máy hạng nặng trên bộ, pháo góc cao 127 mm, trúng trực diện vào
    cơ thể người là không thể sống sót, và nguy cơ bị pháo phòng không địch bắn phá
    tha hồ nếu giữ đội hình chặt)'']: emphasis: none'
  non_canon: true
