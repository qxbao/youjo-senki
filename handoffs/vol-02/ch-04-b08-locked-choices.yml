  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000173: names_and_ranks: []: pronouns_and_address:
    [''Thoại cảm thán phía Liên minh Entente dùng "Bọn khốn đó" và "chúng ta"'']:
