    đội Liên minh Entente ở câu thứ hai bằng "mình" (phản thân) và "họ"'']: pov_and_logic:
    [''Giữ sự đối lập giữa việc lúc ấy thủy thủ tàu ngầm không hề biết và kết quả
    thực tế là họ đã tạo ra một pha phối hợp hỗ trợ tuyệt vời khiến toàn bộ hạm đội
    Liên minh Entente đều nhìn xuống dưới'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000171
