choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000465
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000465: terms: [''trung đội'',
    ''phòng hội ý'', ''Trung đội Bảy'', ''Trung đội Bốn'']: pronouns_and_address:
    Tự sự ngôi thứ nhất của Warren Grantz dùng `Tôi` và `bọn tôi`, quy chiếu Trung
    đội Bảy bằng `họ`.: pov_and_voice: Tự sự ngôi thứ nhất tiếp nối trực tiếp lệnh
    tập hợp khẩn cấp ở cuối `ch-05-b18` (`p000463`–`p000464`).: modality_and_logic:
    Bảo toàn chuỗi hành động gấp gáp: giục trung đội đang ăn tối dở, chạy tới phòng
    hội ý vừa kịp ở mốc 2 phút 51 giây; ban đầu tưởng chưa có trung đội nào khác nhưng
    Trung đội Bảy đang đua với Trung đội Bốn cũng ùa tới ngay trước khi hết 3 phút.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000466
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000466: terms: [''sĩ quan cấp trên'',
    ''trung đội'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz quy chiếu
    các trung đội đến muộn bằng `họ`.: pov_and_voice: Tự sự ngôi thứ nhất pha lẫn
    câu tự vấn nửa lo lắng nửa mỉa mai về thái độ của những kẻ trễ giờ.: modality_and_logic:
    Bảo toàn hình ảnh các sĩ quan cấp trên lập tức nở nụ cười toe toét đi lùa các
    trung đội đến muộn ngay giây tiếp theo, cùng câu hỏi nội tâm của Grantz xem những
    người đến trễ có thấy áy náy không.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000467
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000467: terms: [''tập hợp'', ''vị
    chỉ huy tiểu đoàn'', ''kế hoạch dã ngoại ban đêm'']: pronouns_and_address: Tự
    sự ngôi thứ nhất số nhiều dùng `chúng tôi`.: pov_and_voice: Tự sự ngôi thứ nhất
    đối lập nụ cười tươi của tiểu đoàn trưởng với bản chất tàn khốc của nhiệm vụ.:
    modality_and_logic: Bảo toàn 3 câu: cả đơn vị nhanh chóng tập hợp; vị chỉ huy
    tiểu đoàn tươi cười thông báo kế hoạch dã ngoại đêm; và lời bình phủ định rằng
    thực chất chẳng có gì giống một buổi dã ngoại cả.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000468
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000468: terms: [''Trung đội Bốn'',
    ''Trung đội Bảy'']: pronouns_and_address: Tanya gọi các pháp sư trong tiểu đoàn
    là `các anh` và tự xưng `Tôi`.: pov_and_voice: Giọng chỉ huy lịch sự kiểu bề trên
    nhưng lạnh lùng tuyên bố hình phạt.: modality_and_logic: Bảo toàn lời tuyên bố:
    ngoại trừ Trung đội Bốn và Trung đội Bảy đến đúng giờ, toàn bộ các trung đội còn
    lại đều đáng chịu phạt.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000469
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000469: terms: [''Thiếu tá'', ''học
    viện'', ''lũ vô dụng'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz
    dùng `Tôi`, quy chiếu các nhóm đến muộn bằng `họ`.: pov_and_voice: Tự sự ngôi
    thứ nhất nhớ lại tai tiếng của Tanya ở học viện và lật ngược dự đoán ban đầu.:
    modality_and_logic: Bảo toàn cả hai ý: nhắc lại đây chính là vị Thiếu tá từng
    tuyên bố ở học viện rằng phải giết lũ vô dụng; và bước ngoặt nhận thức khi Grantz
    thương hại các nhóm trễ hạn vì tưởng họ sẽ bị ném xuống địa ngục, nhưng hóa ra
    thực tế còn tệ hơn thế.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000470
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000470: terms: [''chiến hào'']:
    pronouns_and_address: Tanya tự xưng `tôi` và gọi các trung đội đến muộn là `các
    anh`.: pov_and_voice: Giọng chỉ huy nghiêm khắc giải thích mục đích hình phạt
    thực địa.: modality_and_logic: Bảo toàn quan hệ mục đích và nhân quả: điều ra
    chiến hào để dạy tầm quan trọng của sự khẩn trương; vì nói bằng lời không hiểu
    nên phải tự thân trải nghiệm kết cục dành cho kẻ chậm chạp.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000471
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000471: terms: [''pháp sư'', ''chiến
    hào cảnh giới'', ''tuyến đầu'', ''những “con chim hoàng yến”'', ''tuyến tiền phương'',
    ''tỷ lệ tử vong'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz quy chiếu
    các pháp sư bị phạt bằng `họ` / `Họ`; câu cuối lược đại từ ngôi thứ hai phiếm
    chỉ theo quy ước `direct-address choice`.: pov_and_voice: Tự sự ngôi thứ nhất
    tô đậm mức độ khốc liệt của vị trí chiến hào cảnh giới.: modality_and_logic: Bảo
    toàn sự tăng tiến từ `p000469`: họ thực chất bị chôn vùi dưới đáy địa ngục khi
    lập tức bị điều ra chiến hào cảnh giới ở phân khu giao tranh ác liệt nhất, làm
    “chim hoàng yến” hứng đòn đầu tiên ở tuyến tiền phương với tỷ lệ tử vong cao nhất
    và không một khắc ngơi nghỉ.: emphasis: Nguồn có `<html:em>` tại hai từ chỉ hành
    động chôn vùi và đáy sâu địa ngục (xem finding `m1`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000472
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000472: terms: [''chim hoàng yến'',
    ''lý do tồn tại'']: pronouns_and_address: Trần thuật giải thích dùng `họ` cho
    những người lính ở vị trí này.: pov_and_voice: Lời giải thích chua chát về nguồn
    gốc biệt danh lính gác tiền tiêu.: modality_and_logic: Bảo toàn phép so sánh với
    những con chim nhốt trong lồng mang xuống hầm mỏ: sở dĩ ví như vậy là vì lời châm
    biếm rằng lý do tồn tại của người giữ vị trí này chính là khoảnh khắc họ ngừng
    phản hồi (báo hiệu địch đã tấn công).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000473
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000473: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Câu đơn chuyển mạch
    báo hiệu tai họa sắp giáng xuống nhóm đến đúng giờ.: modality_and_logic: Bảo toàn
    nhận định hối tiếc ở quá khứ rằng bản thân đã quá vội khi thấy nhẹ nhõm.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000474
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000474: terms: []: pronouns_and_address:
    Tanya gọi hai trung đội đến đúng giờ là `các anh chàng đúng giờ xuất sắc` và tự
    xưng `tôi`.: pov_and_voice: Giọng chỉ huy ngọt ngào đầy vẻ ban ơn trước khi giao
    nhiệm vụ cảm tử.: modality_and_logic: Bảo toàn lời khen ngợi đúng giờ và thông
    báo trao phần thưởng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000475
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000475: terms: [''đồng đội cùng
    trung đội'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`
    / `chúng tôi`, quy chiếu Tanya bằng `Cô`.: pov_and_voice: Sự đối lập giữa vẻ háo
    hức ngây thơ của đồng đội và trực giác cảnh giác của Grantz.: modality_and_logic:
    Bảo toàn ánh mắt Tanya nhìn từng người như sắp báo tin vui, cùng sự tương phản
    giữa các đồng đội đang mong chờ phần thưởng và bản thân Grantz thì không.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000476
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000476: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `Tôi`.: pov_and_voice: Câu ngắn dồn nén dự
    cảm bất an.: modality_and_logic: Bảo toàn khẳng định có linh cảm rất xấu.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000477
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000477: terms: [''hoạt động giải
    trí thắt chặt tình thân'', ''dã ngoại'']: pronouns_and_address: Tanya gọi cấp
    dưới là `Các anh`, dùng đại từ gộp `Chúng ta` và lược chủ ngữ ngôi thứ nhất ở
    câu cuối.: pov_and_voice: Giọng nói giảm nói tránh đầy hài đen của Tanya khi gọi
    cuộc tập kích bắt tù binh là buổi dã ngoại giao lưu.: modality_and_logic: Bảo
    toàn trọn vẹn 3 câu: ban cho một hoạt động giải trí thắt chặt tình thân; cùng
    đi dã ngoại, nâng ly và mời vài người bạn mới về cùng; có thể gọi đó là một bữa
    tiệc.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000478
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000478: terms: [''Hướng dẫn dã
    ngoại'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `chúng tôi`
    và quy chiếu Tanya bằng `Cô`.: pov_and_voice: Tự sự ngôi thứ nhất kèm câu hỏi
    ngơ ngác khi nhận cuốn cẩm nang kỳ quặc.: modality_and_logic: Bảo toàn chi tiết
    ngay khi Tanya dứt lời thì có người phát tập tài liệu mỏng mang tên Hướng dẫn
    dã ngoại, kèm câu hỏi tự vấn về quy trình dã ngoại.: emphasis: Nguồn có `<html:em>`
    tại tên cuốn sổ tay (xem finding `m1`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000479
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000479: terms: [''lựu đạn'', ''xẻng'',
    ''súng trường'', ''quả cầu tính toán'', ''đồ ngụy trang ban đêm'', ''tác chiến
    cự ly gần'', ''Binh lính Cộng hòa'']: pronouns_and_address: Nội dung cẩm nang
    gọi người đọc là `các anh` và quy chiếu lính Cộng hòa bằng `họ`.: pov_and_voice:
    Giọng văn cẩm nang pha trộn mệnh lệnh trang bị vũ khí sát thương, lời đe dọa kỷ
    luật chiến trường và lý lẽ kết bạn đầy phi lý.: modality_and_logic: Bảo toàn đầy
    đủ nội dung trích đọc kèm dấu hỏi hoài nghi của Grantz ở cuối: trang bị lựu đạn
    và xẻng, chuẩn bị súng trường và quả cầu tính toán; mặc đồ ngụy trang đêm cho
    tác chiến cự ly gần; tự ý dùng quả cầu tính toán hay súng trường khi chưa được
    phép sẽ bị bắn hoặc đánh chết; lính Cộng hòa cũng là con người nên có thể kết
    bạn.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` cho toàn bộ đoạn trích từ cuốn
    hướng dẫn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000480
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000480: terms: [''xẻng'']: pronouns_and_address:
    Tự sự ngôi thứ nhất số nhiều dùng `chúng tôi`, quy chiếu lính địch bằng `chúng`.:
    pov_and_voice: Câu hỏi phản bác thẳng vào sự mâu thuẫn nực cười trong cuốn cẩm
    nang.: modality_and_logic: Bảo toàn câu hỏi chất vấn: nếu là kết bạn thì tại sao
    lại phải dùng xẻng đập họ bất tỉnh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000481
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000481: terms: []: pronouns_and_address:
    Câu trích dẫn dùng chủ ngữ khái quát `người ta`.: pov_and_voice: Giọng ngụy biện
    hài hước trong cẩm nang được Grantz đọc lên với giọng nghi vấn.: modality_and_logic:
    Bảo toàn lập luận dẫn dắt trong cẩm nang rằng thời cổ đại người ta kết bạn bằng
    cách nói chuyện bằng nắm đấm.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` tương
    ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000482
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000482: terms: [''cái xẻng'']:
    pronouns_and_address: Câu trích dẫn dùng danh ngữ khái quát `Người văn minh ngày
    nay`.: pov_and_voice: Câu tiếp theo trong cẩm nang đẩy lập luận ngụy biện lên
    đỉnh điểm, nối tiếp dấu hỏi ngỡ ngàng của người đọc.: modality_and_logic: Bảo
    toàn mệnh đề đối xứng với `p000481`: người văn minh hiện đại thì dùng công cụ
    do nền văn minh sinh ra là chiếc xẻng.: emphasis: Bảo toàn dấu nhấn mạnh `*...*`
    tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000483: terms: [''nhiệm vụ đêm'',
    ''lính địch'', ''nhiệm vụ thu thập tình báo'', ''tù binh'', ''chiến hào địch'']:
    pronouns_and_address: Tự sự ngôi thứ nhất số nhiều của Grantz dùng `chúng tôi`.:
    pov_and_voice: Độc thoại và tự sự ngôi thứ nhất bóc tách bản chất thực sự của
    nhiệm vụ ẩn sau lớp từ ngữ hoa mỹ.: modality_and_logic: Bảo toàn đầy đủ 4 câu:
    lời cảm thán đây là chuyện điên rồ; không ai nói ra nhưng hiện rõ trên mặt mọi
    người; đây là nhiệm vụ đêm bắt cóc lính địch—một nhiệm vụ thu thập tình báo cực
    kỳ nguy hiểm; và điều kiện tất yếu là muốn kéo địch về thì phải áp sát chiến hào
    địch.: emphasis: Câu mở đầu có thẻ `<html:em>` trong nguồn (xem finding `m1`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000484
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000484: terms: [''vị trí địch'',
    ''súng máy'', ''pháo hạng nặng'', ''pháo bộ binh'', ''lính bắn tỉa'', ''chiến
    hào cảnh giới'']: pronouns_and_address: Tự sự ngôi thứ nhất số nhiều dùng `chúng
    tôi`.: pov_and_voice: Tự sự ngôi thứ nhất liệt kê hàng loạt mối đe dọa chết người
    để làm nổi bật độ bất khả thi của nhiệm vụ.: modality_and_logic: Bảo toàn cấu
    trúc tóm lược: phải lẻn vào vị trí địch—nơi có súng máy, đủ loại pháo hạng nặng,
    pháo bộ binh, lính bắn tỉa và vô số binh lính chờ sẵn—để bắt cóc địch ngay từ
    chiến hào cảnh giới đang ở mức báo động cao nhất.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000485
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000485: terms: []: pronouns_and_address:
    Lời lẩm bẩm dùng đại từ gộp `Chúng ta`.: pov_and_voice: Tiếng thở dài tuyệt vọng
    của người lính khi nhận ra mức độ nguy hiểm.: modality_and_logic: Bảo toàn câu
    nhận định chắc chắn sẽ bỏ mạng.: emphasis: Nguồn không có thẻ `<html:em>` (xem
    finding `m1`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000486
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000486: terms: [''xẻng'', ''Chuyến
    dã ngoại'']: pronouns_and_address: Đoạn trích cẩm nang đan xen đại từ gộp `chúng
    ta`, ngôi thứ nhất `tôi` của người viết cẩm nang và ngôi thứ hai `các anh`.: pov_and_voice:
    Lời dẫn của Grantz nối với đoạn trích cẩm nang mô tả giai đoạn rút lui ác liệt
    nhất bằng ngôn từ đi chơi dã ngoại.: modality_and_logic: Bảo toàn câu dẫn (từ
    đoạn đó trở đi mọi chuyện mới thực sự khốc liệt) và 3 câu trích dẫn kèm dấu hỏi:
    sau khi dùng xẻng giao lưu với nhiều bạn mới thì mời vài người về nhà; các bạn
    ấy sẽ tìm đủ cách giữ chân không cho về; chuyến dã ngoại chỉ kết thúc khi cắt
    đuôi được họ và về tới nhà.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` cho toàn
    bộ phần trích dẫn từ cuốn hướng dẫn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000487
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000487: terms: [''thăng hai cấp'']:
    pronouns_and_address: Trong lời thoại, Tanya tự xưng `tôi` / `chúng tôi` / `Chúng
    tôi` và gọi cấp dưới là `các anh chàng đúng giờ này` / `các anh`; câu cầu nguyện
    nội tâm xen giữa của Grantz dùng `chúng con`; câu dẫn dùng `Cô`.: pov_and_voice:
    Sự đan xen sắc lạnh giữa nụ cười rạng rỡ, lời đe dọa bỏ rơi người chậm chạp dưới
    vỏ bọc “thăng vượt hai cấp” của Tanya và tiếng kêu cứu tuyệt vọng trong tâm trí
    Grantz.: modality_and_logic: Bảo toàn trọn vẹn 6 câu: lời rào đón của Tanya với
    nhóm đúng giờ; nụ cười rạng rỡ của cô; câu cầu xin Chúa cứu mạng của Grantz; cảnh
    báo ai quá chậm sẽ bị bỏ lại; lời mỉa mai ai muốn thăng hai cấp nhanh (tử trận)
    thì cứ ở lại đó; và câu chốt không muốn cản trở con đường thành đạt của họ.: emphasis:
    Bảo toàn chính xác 1 câu `*...*` tương ứng thẻ `<html:em>` (`*Lạy Chúa, xin cứu
    chúng con.*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000488
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000488: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi` / `Tôi`, quy chiếu Tanya bằng `cô`.:
    pov_and_voice: Tự sự ngôi thứ nhất bàng hoàng khi nhận ra lời đe dọa lúc mới gặp
    Tanya hoàn toàn là nghĩa đen.: modality_and_logic: Bảo toàn sự liên hệ với buổi
    gặp đầu tiên và nỗi kinh ngạc khi nhận ra từng chữ cô nói đều là sự thật.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000489
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000489: terms: [''Thiếu úy ma pháp
    Warren Grantz'']: pronouns_and_address: Trần thuật ngôi thứ ba định danh đầy đủ
    `Thiếu úy ma pháp Warren Grantz` kết hợp đại từ phản thân `mình`.: pov_and_voice:
    Nhịp lùi điểm nhìn ra ngôi thứ ba trong một câu đơn để khắc họa phản ứng sinh
    lý không tự chủ của nhân vật.: modality_and_logic: Bảo toàn nhận thức của Grantz
    rằng cơ thể mình đang run rẩy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000490
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000490: terms: [''Bản năng sinh
    tồn'', ''chiến tranh'', ''giao tranh'', ''giết chóc'']: pronouns_and_address:
    Quay lại tự sự ngôi thứ nhất của Grantz dùng `tôi` / `Tôi`.: pov_and_voice: Tự
    sự ngôi thứ nhất dồn dập diễn tả sự kháng cự của bản năng sinh tồn.: modality_and_logic:
    Bảo toàn cả 3 câu: bản năng sinh tồn gào thét; mong muốn tránh xa chiến tranh,
    giao tranh, giết chóc; và trạng thái chần chừ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000491
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000491: terms: [''Thiếu tá von
    Degurechaff'', ''xuất quân'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz
    dùng `Chúng tôi`, quy chiếu Tanya bằng `Thiếu tá von Degurechaff` và `Cô`.: pov_and_voice:
    Tự sự ngôi thứ nhất khắc họa uy áp tuyệt đối của Tanya đè bẹp nỗi sợ chiến trường.:
    modality_and_logic: Bảo toàn 5 câu: chỉ một ánh mắt của Thiếu tá von Degurechaff
    đã đủ khuất phục bản năng sinh tồn ấy; cô còn đáng sợ hơn nhiều; cả bọn xuất quân
    như đàn cừu bị chó chăn cừu lùa đi; không ai dám hé răng rên một tiếng; tất cả
    bò đi trong im lặng dưới màn đêm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000492
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000492: terms: [''Chỉ huy'', ''xẻng'',
    ''lính địch'']: pronouns_and_address: Tự sự ngôi thứ nhất số nhiều dùng `Chúng
    tôi` và phản thân `mình`, quy chiếu Tanya bằng `Chỉ huy`.: pov_and_voice: Tự sự
    ngôi thứ nhất tả thực màn tập kích cận chiến bằng xẻng trong đêm.: modality_and_logic:
    Bảo toàn trình tự: Chỉ huy ra tay đầu tiên; cả đội nghe tiếng xẻng nện thùm thụp
    tiếp nối bằng tiếng rên của vài người; và cả đội cũng liều mạng vung xẻng đập
    những tên lính địch mất cảnh giác như thể mạng sống của mình phụ thuộc vào đó.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000493
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000493: terms: []: pronouns_and_address:
    Câu hỏi tự sự không dùng đại từ nhân xưng.: pov_and_voice: Câu hỏi ngắn tạo nhịp
    ngắt cảm nhận thời gian sau cuộc đột kích chớp nhoáng.: modality_and_logic: Bảo
    toàn câu hỏi tự vấn xem bao nhiêu thời gian đã trôi qua sau đó.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000494
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000494: terms: []: pronouns_and_address:
    Câu trần thuật cảm nhận thời gian không dùng đại từ nhân xưng.: pov_and_voice:
    Sự đối lập giữa thời gian tâm lý kéo dài vô tận và thời gian thực tế ngắn ngủi
    trên chiến trường.: modality_and_logic: Bảo toàn hai vế đối lập: cảm giác kéo
    dài như cả một đời người, nhưng thực tế chỉ vỏn vẹn vài chục giây.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000495
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000495: terms: [''lính địch'',
    ''chiến hào cảnh giới'']: pronouns_and_address: Trần thuật khép lại phân cảnh
    đột kích không dùng đại từ nhân xưng.: pov_and_voice: Giọng trần thuật lạnh lùng
    khép lại kết cục của toán lính gác địch trong chiến hào cảnh giới.: modality_and_logic:
    Bảo toàn 2 câu: đó chỉ là một khoảnh khắc ngắn ngủi; và chỉ trong quãng thời gian
    ngắn ngủi ấy, toàn bộ lính địch tại khu vực chỉ định trong chiến hào cảnh giới
    đều đã bị đánh gục bất tỉnh hoặc chìm vào giấc ngủ vĩnh viễn không bao giờ tỉnh
    lại.: emphasis: none'
  non_canon: true
