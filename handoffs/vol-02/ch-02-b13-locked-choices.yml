segment_id_end: YS-LN02/Text/part0014.xhtml/p000353
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000329
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000329: locks: [''Giữ bản sửa theo
    signoff `MOD-4` với cụm `những người lão luyện trong công tác thu thập tình báo`
    (theo `vol02-ch02-b13-intelligence-gathering-veterans`), danh xưng `Đế quốc`,
    và đại từ `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000330
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000330: locks: [''Giữ bản sửa theo
    signoff `MOD-2` bảo toàn cấu trúc nhân quả `Vì Khối Thịnh vượng chung mong họ
    tích lũy đủ loại kinh nghiệm và học hỏi được nhiều trong chiến đấu, nên xét từ
    góc độ quốc phòng, nước này rất chu đáo với nhân sự của mình và đã trang bị cho
    họ đầy đủ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000331
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000331: locks: [''Giữ đại từ `tôi`,
    cấp đơn vị `một tiểu đoàn`, tốc độ `ba trăm kilômét một giờ`, và câu hỏi thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000332
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000332: locks: [''Giữ đại từ khái
    quát `người ta` và câu hỏi nghi vấn `Xem ra rốt cuộc thiết bị vẫn cần được hiệu
    chỉnh chăng?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000333
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000333: locks: [''Giữ các danh
    xưng `các quân đội của Khối Thịnh vượng chung`, `Quân đội Đế quốc`, thuật ngữ
    `học thuyết trước chiến tranh`, các đại từ `họ`, và chi tiết `chưa có nhiều kinh
    nghiệm chiến đấu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000334
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000334: locks: [''Giữ cấu trúc
    điều kiện nhân quả `Bởi vậy, nếu họ không học được đôi điều trước khi đất nước
    bị cuốn vào chiến tranh, họ sẽ phải trả giá bằng xương máu của chính mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000335: locks: [''Giữ bản sửa theo
    signoff `MOD-1` với danh xưng `sĩ quan tham mưu`, cách quy chiếu `Named này` và
    đại từ `cô ấy` (theo `vol02-ch02-b13-named-reference`), cùng đối lập `không phải
    ảo ảnh trên chiến trường mà là một cơn ác mộng có thật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000336
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000336: locks: [''Giữ danh xưng
    `Khối Thịnh vượng chung`, các cụm `thắng lợi ngoại giao`, `thiếu hụt kinh nghiệm
    chiến đấu`, `chuyên gia`, `cục diện chiến tranh`, và các đại từ `họ`, `người ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000337
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000337: locks: [''Giữ cụm `công
    tác tình báo`, đại từ khái quát `người ta` kết hợp `chính mình`, và mệnh đề giả
    định phủ định `Dĩ nhiên, chẳng có sách giáo khoa chuyên ngành nào; mà dù có thì
    chúng cũng chẳng ích gì mấy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000338
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000338: locks: [''Giữ bản sửa theo
    signoff `MOD-3` bảo toàn độ mở của nguyên bản (theo `vol02-ch02-b13-half-heard-ambiguity`):
    `“…Có lẽ chúng ta nên chuẩn bị tinh thần cho khoảng một nửa những gì đã nghe.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000339
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000339: locks: [''Giữ danh xưng
    `sĩ quan`, các đại từ `họ`, `những ai`, `những người còn lại`, và cụm `tiến hành
    phân tích khách quan, có trọng tâm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000340: locks: [''Giữ các đại từ
    `họ`, `mình`, các thuật ngữ đồng bộ với B12 `một Named của Đế quốc`, `Lực lượng
    viện binh là một tiểu đoàn — rất có thể là tiểu đoàn tăng cường`, `cuộc tấn công
    quy mô cấp tiểu đoàn`, và câu kết `Không có lý do gì để lạc quan.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000341
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000341: locks: [''Giữ bản sửa theo
    signoff `MOD-1` với cách quy chiếu `Named đó`, `cô ấy` (theo `vol02-ch02-b13-named-reference`),
    các cấp đơn vị `một đại đội`, `hai tiểu đoàn`, và cấu trúc câu hỏi nhượng bộ bác
    bỏ.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000342
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000342: locks: [''Giữ bản sửa theo
    signoff `MOD-1` với các đại từ `họ`, `cô ấy`, thuật ngữ `Named`, cấp đơn vị `một
    đại đội`, và câu giả định phản thực tế `Nếu cô ấy chỉ có một mình, có lẽ đã chẳng
    đáng ngại đến thế.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000343
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000343: locks: [''Giữ cấp đơn vị
    `tiểu đoàn đó`, đại từ `Họ`, và suy luận `Họ hẳn phải được huấn luyện rất bài
    bản mới có thể tiến đến nhanh như vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000344
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000344: locks: [''Giữ đại từ `chúng
    ta`, thuật ngữ đã khóa `một đơn vị hỗn hợp` (theo `vol02-ch02-b13-composite-unit`),
    và câu `“Còn chúng ta tuy đông người, nhưng lại là một đơn vị hỗn hợp… Có thể
    sẽ khó đây.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000345
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000345: locks: [''Giữ các cụm `tiểu
    đoàn địch mới đến`, `một tiểu đoàn sung sức`, `hai tiểu đoàn mệt mỏi`, đúng phạm
    vi nhấn mạnh in nghiêng theo `DEC-P01-002` `*một trận đánh cam go*`, và đại từ
    `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000346
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000346: locks: [''Giữ ba danh xưng
    `Cộng hòa, Khối Thịnh vượng chung và Liên minh Entente`, thuật ngữ `học thuyết
    tác chiến`, và câu hỏi thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000347
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000347: locks: [''Giữ các danh
    xưng `những người Khối Thịnh vượng chung`, `Cộng hòa và Khối Thịnh vượng chung`,
    đại từ `họ`, và quan hệ điều kiện `nhưng chừng nào vẫn còn tình báo họ không thể
    chia sẻ, tổn thất sẽ rất lớn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000348: locks: [''Giữ các danh
    xưng `Cộng hòa`, `Liên minh Entente`, `Khối Thịnh vượng chung`, `Đế quốc`, đại
    từ `họ`, và ý `đã trở nên lệch nhịp đáng kể`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000349
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000349: locks: [''Giữ đại từ `chúng
    ta` và câu điều kiện `“Nếu việc phối hợp bị gián đoạn, có lẽ chúng ta sẽ phải
    tách ra.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000350
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000350: locks: [''Giữ các danh
    xưng `Cộng hòa và Liên minh Entente`, `Khối Thịnh vượng chung`, cụm `vị thế trung
    lập`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000351
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000351: locks: [''Giữ các danh
    xưng `Cộng hòa và Liên minh Entente`, `Khối Thịnh vượng chung`, `Các sĩ quan`,
    `Nhà nước`, đại từ `họ`, và câu kết `Nhà nước muốn giảm thương vong xuống mức
    thấp nhất.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000352
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000352: locks: [''Giữ cụm `một
    tiểu đoàn được tổ chức lại` và câu thoại `“Sẽ mất một thời gian, nhưng có thể
    một tiểu đoàn được tổ chức lại sẽ đến chi viện.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000353
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000353: locks: [''Giữ các cụm `lực
    lượng tình nguyện của Khối Thịnh vượng chung`, `chế độ thời chiến`, `ưu thế về
    quân số`, `một Named`, và các đại từ `họ`.'']'
  non_canon: true
