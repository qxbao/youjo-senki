    ''company of recon mages -> đại đội pháp sư trinh sát'', ''effective firing range
    -> tầm bắn hiệu quả'']: pronouns_and_address: [''Câu nội tâm in nghiêng mở đầu
    dùng "mình"; phần trần thuật ngôi thứ ba tiếp theo quy chiếu Tanya bằng "nó" và
    tên riêng "Tanya" theo DEC-P01-001'']: pov_and_logic: [''Giữ sự tương phản giữa
    kế hoạch ban đầu (nhiệm vụ tìm địch lẽ ra rất dễ dàng, nếu tàu ngầm, máy bay trinh
    sát đi trước hay đại đội pháp sư trinh sát phát hiện địch thì đơn vị của Tanya
    có thể chỉ tiếp quản việc theo dõi tùy tình hình) và thực tế ngoài dự kiến (tiến
    vào tầm bắn hiệu quả của tàu địch rồi giao chiến chưa bao giờ nằm trong kế hoạch)'']:
    emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown `*Xung quanh mình tối đen, nhưng
    mình biết chắc là mình đang lộ diện.*` ở câu mở đầu theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000194
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000194: names_and_ranks: [''muzzle
    flash -> chớp lửa đầu nòng'', ''submarines -> tàu ngầm'', ''investigative commission
