    [''Đan xen giữa đại từ trần thuật ngôi thứ ba "nó" và đại từ nội tâm ngôi thứ
    nhất "mình" ("phe ta", "mình") theo DEC-P01-001'']: pov_and_logic: [{''Giữ trọn
    mạch tâm lý của Tanya'': ''nhìn thấy ánh sáng dưới biển như chớp lửa đầu nòng
    do tàu ngầm phe ta phóng ngư lôi, nhận ra nếu không nhờ tiếng nổ thì đã bỏ sót
    và bị ủy ban điều tra chất vấn, vừa mừng vì kịp thấy vệt sóng ngư lôi vừa tiếc
    vì nếu ở xa hơn một chút thì đã phát hiện được mà vẫn bình an vô sự''}]: emphasis:
    [''Giữ đúng phạm vi nhấn mạnh Markdown `*Nếu không có tiếng nổ, có lẽ mình đã
    chẳng nhận ra.*` theo DEC-P01-002'']'
  non_canon: true
