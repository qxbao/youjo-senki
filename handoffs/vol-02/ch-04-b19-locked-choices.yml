    ta" quy chiếu phía phe mình đang phân tích dữ liệu trận đánh'']: pov_and_logic:
    [''Giữ bản sửa N8 ("một dạng truyền tín hiệu nào đó ở phía trên hạm đội") phản
    ánh đúng dữ kiện ghi nhận phát tín hiệu'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000227: names_and_ranks: [''mages
    -> Các pháp sư'', ''assault formation -> đội hình xung kích'']: pronouns_and_address:
    [''Đại từ "họ" quy chiếu các pháp sư Đế quốc'']: pov_and_logic: [''Giữ câu hỏi
    phân tích động cơ phát tín hiệu ngay trước khi vào đội hình xung kích, cấu trúc
    phủ định kép có nhấn mạnh ("Không phải là *không* có khả năng..."), và hai giả
    định quá khứ trái thực tế ("đáng lẽ họ phải báo sớm hơn", "họ đâu cần phải áp
    sát đến thế")'']: emphasis: *không*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000228
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000228: names_and_ranks: [''attacking
    unit -> một đơn vị tấn công'', ''combat control team -> tổ kiểm soát tác chiến'']:
    pronouns_and_address: [''Đại từ "họ" quy chiếu các pháp sư Đế quốc'']: pov_and_logic:
    [{''Giữ suy luận điều kiện – hệ quả'': ''nếu là đơn vị tấn công thì lẽ ra phải
    có tổ kiểm soát tác chiến (`vol02-ch04-b19-combat-control-team`)''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000229
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000229: names_and_ranks: [''unguided
    battalion of mages -> một tiểu đoàn pháp sư không có người dẫn đường'', ''submarine
    attack -> cuộc tấn công của tàu ngầm'', ''God -> Chúa'']: pronouns_and_address:
    []: pov_and_logic: [{''Giữ sự bác bỏ gay gắt đối với khả năng tình cờ chạm trán
    một tiểu đoàn pháp sư không người dẫn đường ngay sau đòn tấn công của tàu ngầm'':
    ''nếu không phải kế hoạch và không phải sự trùng hợp chỉ Chúa mới nghĩ ra được
    thì điều đó bất khả thi''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000230
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000230: names_and_ranks: [''escorts
    -> các tàu hộ tống'', ''company -> một đại đội'', ''battle cruiser -> tuần dương
    hạm chiến đấu'']: pronouns_and_address: [''Đại từ "Chúng" quy chiếu các pháp sư
    Đế quốc trong lời nhận xét trực tiếp'']: pov_and_logic: [''Giữ diễn biến phối
    hợp táo bạo (lập tức dụ các tàu hộ tống đi chỗ khác trong khi một đại đội lao
    thẳng vào tuần dương hạm chiến đấu) và phản ứng bất lực ("Đúng là chỉ biết cười")'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000231
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000231: names_and_ranks: [''Anti-air
    fire -> Hỏa lực phòng không'', ''navy -> Hải quân'', ''army -> lục quân'', ''battle
    cruiser -> tuần dương hạm chiến đấu'', ''autocannons -> pháo tự động'']: pronouns_and_address:
    [''Chủ ngữ phiếm chỉ "Người ta" cho câu hỏi tu từ khái quát (theo N4)'']: pov_and_logic:
    [''Giữ sự đối lập giữa lý thuyết mà cả hải quân lẫn lục quân đều biết (hỏa lực
    phòng không ít khi bắn trúng trực tiếp) với trải nghiệm thực tế, dẫn tới câu hỏi
    tu từ về việc liệu người ta có lao vào một tuần dương hạm chiến đấu trang bị đầy
    pháo tự động chỉ vì đạn thường không trúng đích hay không'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000232
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000232: names_and_ranks: [''barrage
    formulas -> thuật thức bắn loạt'', ''extra-long range barrage formula -> Thuật
    thức bắn loạt tầm cực xa'', ''mage -> pháp sư'', ''anti-air fire -> hỏa lực phòng
    không'']: pronouns_and_address: [''Chủ ngữ khái quát "người ta" ở câu đầu'']:
    pov_and_logic: [{''Giữ lập luận chiến thuật'': ''thông thường sẽ có chút do dự
    hoặc chọn nhiều cách tiếp cận khác như triển khai thuật thức bắn loạt từ xa, vì
    thuật thức bắn loạt tầm cực xa của pháp sư có thể vượt qua phần lớn hỏa lực phòng
    không''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000233
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000233: names_and_ranks: [''marine
    mages -> các pháp sư thủy quân lục chiến'', ''direct support mages -> pháp sư
    yểm trợ trực tiếp'', ''enemy mages -> Các pháp sư địch'', ''tranquil signals ->
    tín hiệu ma lực yên ắng'']: pronouns_and_address: [''Đại từ "họ" lần 1 quy chiếu
    pháp sư địch, lần 2 và 3 quy chiếu pháp sư thủy quân lục chiến / yểm trợ trực
    tiếp phe mình; "chúng ta" quy chiếu phe mình và "chúng" quy chiếu các pháp sư
    địch'']: pov_and_logic: [''Giữ nguyên nhân thất thủ của lực lượng bảo vệ (bị đánh
    úp bất ngờ khiến số ít pháp sư yểm trợ trực tiếp dù chống trả hết sức vẫn bị đánh
    tan tác) và suy luận từ việc địch phát ra tín hiệu ma lực yên ắng đến mức tới
    sát bên mới bị phát hiện (`vol02-ch04-b19-tranquil-signals`)'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000234
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000234: names_and_ranks: [''mana
    signatures -> các dấu hiệu ma lực'', ''Named -> Named'']: pronouns_and_address:
    []: pov_and_logic: [''Giữ bản sửa M1 dùng danh xưng cá nhân "Named" (`vol02-ch04-b19-named-individual`)
    đang dẫn đầu đội hình dựa theo các dấu hiệu ma lực'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000235
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000235: names_and_ranks: [''Entente
    Alliance -> Liên minh Entente'', ''Named -> Named'', ''mana isotope -> đồng vị
    ma lực'', ''flight leader¹⁷ -> người dẫn đầu đội bay¹⁷'', ''mage -> pháp sư'']:
    pronouns_and_address: []: pov_and_logic: [''Giữ bản sửa M1 ("dấu hiệu của Named"),
    ký hiệu chú thích `¹⁷`, và lập luận kỹ thuật rằng quan sát đồng vị ma lực của
    người dẫn đầu đội bay là bước cơ bản nhất, rất dễ phát hiện chừng nào pháp sư
    không hạn chế công suất để ẩn mình'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000236: names_and_ranks: [''battalion
    -> tiểu đoàn'']: pronouns_and_address: []: pov_and_logic: [''Giữ sự tương phản
    giữa một đơn vị làm nhiệm vụ kiềm chân địch (có thể hạn chế công suất theo cách
    tiêu chuẩn để kéo dài thời gian bay và giảm nguy cơ bị phát hiện) với câu hỏi
    nghi vấn liệu một tiểu đoàn đang bay tốc độ cao có làm được điều đó không'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000237
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000237: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "họ" quy chiếu tiểu đoàn pháp sư địch'']: pov_and_logic: [''Giữ hệ quả
    thể lực của việc hạn chế công suất (tạm thời tăng sức bền nhưng cuối cùng độ mệt
    mỏi tăng vọt khiến không thể bước vào chiến đấu) và suy đoán bỏ lửng rằng có lẽ
    họ hạn chế công suất vì lý do khác chứ không phải để tập kích'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000238
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000238: names_and_ranks: [''auxiliary
    ship -> tàu phụ trợ'', ''submarine -> tàu ngầm'', ''intelligence -> tin tình báo'']:
    pronouns_and_address: [''Đại từ "họ" quy chiếu phía Liên minh/phe có tàu phụ trợ
    và tàu ngầm; "người ta" phiếm chỉ; "chúng" và "mình" quy chiếu phía địch'']: pov_and_logic:
    [{''Giữ bước ngoặt bác bỏ cách hiểu lạc quan'': ''ngay sau đó chính đơn vị ấy
    lại đột kích vùng biển nơi tàu phụ trợ và tàu ngầm hẹn gặp, khiến việc nghi ngờ
    có vụ rò rỉ nghiêm trọng là điều tất yếu, thậm chí địch hành động táo bạo đến
    mức chẳng buồn giấu việc đang nắm được tin tình báo''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000239
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000239: names_and_ranks: [''information
    war -> cuộc chiến thông tin'']: pronouns_and_address: [''Đại từ "Họ" / "họ" và
    "mình" quy chiếu các sĩ quan tình báo'']: pov_and_logic: [{''Giữ mạch giằng xé
    nghề nghiệp của ngành tình báo'': ''dù muốn coi sự việc lộ liễu đến mức bất thường
    và nghĩ rằng đã rà soát kỹ mọi tình tiết, họ vẫn không thể gạt bỏ khả năng ấy
    vì trong chiến tranh thông tin sự thật không bao giờ được bảo đảm, buộc phải nghi
    ngờ mọi khả năng kể cả giả thuyết rò rỉ''}]: emphasis: none'
  non_canon: true
