source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 3cab7e43a84b1714c3c988b4636ae5baeabb9652db343a26de7d30f1371ba2aa
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 22
segment_id_start: YS-LN02/Text/part0018.xhtml/p000358
segment_id_end: YS-LN02/Text/part0018.xhtml/p000379
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000358
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000358: locks: [''Giữ thuật ngữ
    `Người điện báo`, ẩn dụ `chẳng khác nào bị đẩy vào bãi mìn`, và mệnh đề đối lập
    `nhưng lần này thì khác`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000359
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000359: locks: [''Giữ các cụm đã
    sửa theo N1 và được nghiệm thu (`Đã bao nhiêu ngày kể từ lần anh phải gần như
    chạy đi báo tin cho cấp trên thế này? Kể từ khi Dacia thất thủ ư?` và `chuyện
    thích hay ghét cá nhân`), địa danh `Dacia`, đại từ `anh`, và các phủ định `Nói
    thẳng ra thì đây chẳng phải tin xấu!`, `chẳng có gì anh ghét hơn việc báo tin
    xấu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000360
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000360: locks: [''Giữ thuật ngữ
    `tàu phụ trợ`, đúng phạm vi in nghiêng chỉ cho tên tàu `*Lytol*` theo `DEC-P01-002`,
    và câu báo cáo `“Điện khẩn từ tàu phụ trợ *Lytol*.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000361
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000361: locks: [''Giữ câu lệnh
    ngắn gọn của cấp trên `“Báo cáo đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000362
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000362: locks: [''Giữ các thuật
    ngữ `những con tàu thu thập tin tình báo cải trang thành tàu dân sự`, `các tàu
    buôn vũ trang`, `mức ưu tiên khẩn cấp cao nhất`, `mật mã dùng một lần` theo mục
    `vol02-ch03-b20-one-time-pad`, và các đại từ `anh ta`, `Họ`, `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000363
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000363: locks: [''Giữ câu đã sửa
    theo N4 và được nghiệm thu (`Dù vậy, anh không chắc đó có phải điều đáng mừng
    lắm hay không, nhưng thôi.`), phủ định `ít ra nó cũng không phải tin xấu`, và
    đại từ `Anh` / `anh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000364
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000364: locks: [''Giữ danh xưng
    `Liên minh Entente`, cụm đã sửa theo N5 (`vận chuyển một nhân vật quan trọng`),
    và câu báo cáo `“Liên minh Entente đề nghị vận chuyển một nhân vật quan trọng.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000365
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000365: locks: [''Giữ các cụm đã
    sửa theo N5 và N6 (`vận chuyển một nhân vật quan trọng`, `một trong mười nghị
    viên nhà nước` theo mục `vol02-ch03-b20-councilor-state`), các danh xưng và thuật
    ngữ `Liên minh Entente`, `chính phủ lưu vong`, `Đế quốc`, `lợi ích quốc gia của
    Khối Thịnh vượng chung`, cùng phủ định một phần `đây cũng chưa hẳn là một diễn
    biến hoàn toàn xấu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000366
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000366: locks: [''Giữ dấu chấm
    lửng mở đầu `…`, thuật ngữ `Bộ Ngoại giao` theo mục `vol02-ch03-b20-foreign-office`,
    và câu hỏi phản vấn `“…Chuyện này chẳng phải thuộc thẩm quyền Bộ Ngoại giao sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000367
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000367: locks: [''Giữ chủ thể đã
    làm rõ theo bản sửa V1 đã nghiệm thu (`người nghe báo cáo`), tên cơ quan `Ban
    Chiến lược Đối ngoại` theo mục `vol02-ch03-b20-foreign-strategy-division`, các
    cụm `nhiệm vụ hoạch định và phân tích`, `Họ tuyệt nhiên không phải đầu mối liên
    lạc`, `công tác thu thập tin tình báo`, và đại từ `họ` / `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000368
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000368: locks: [''Giữ cụm đã sửa
    theo N8 và được nghiệm thu (`một phòng thuộc ban chiến lược của cơ quan tình báo`),
    các danh xưng và thuật ngữ `Bộ Ngoại giao`, `Liên minh Entente`, `kênh chính thức`,
    `đại sứ quán tại nước sở tại`, `xin tị nạn`, và câu kết `Cũng hoàn toàn có thể
    cho rằng họ chỉ liên lạc nhầm chỗ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000369
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000369: locks: [''Giữ danh xưng
    đã sửa theo V2 và được nghiệm thu (`Tướng Habergram` theo mục `vol02-ch03-b20-habergram-rank`,
    không tự suy diễn thành `Thiếu tướng`), thuật ngữ `Người điện báo`, `vị sĩ quan
    cấp trên`, và đại từ thống nhất `Anh ta` / `anh ta` theo N12.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000370
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000370: locks: [''Giữ danh xưng
    `Hải quân Liên minh Entente` và câu giải thích `“Một người của Hải quân Liên minh
    Entente đã đích thân liên lạc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000371: locks: [''Giữ đúng mức
    độ suy đoán có giới hạn và thì hiện tại theo bản sửa V3 đã nghiệm thu (`“Họ phát
    hiện ra chúng ta rồi sao? Nếu vậy thì tôi chỉ nghĩ được rằng ở đâu đó đang có
    một lỗ hổng an ninh nghiêm trọng.”`), thuật ngữ `lỗ hổng an ninh nghiêm trọng`,
    và các đại từ `Họ`, `chúng ta`, `tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000372
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000372: locks: [''Giữ quán tính
    tình thái `có vẻ`, các đại từ `họ`, `chúng ta`, và câu đáp `“Không, có vẻ họ đã
    liên lạc với tất cả tàu của chúng ta.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000373
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000373: locks: [''Giữ các danh
    xưng và thuật ngữ `cơ quan tình báo Khối Thịnh vượng chung`, `tàu phụ trợ`, đúng
    phạm vi in nghiêng chỉ cho tên tàu `*Lytol*` theo `DEC-P01-002`, `Liên minh Entente`,
    phủ định mở đầu `Họ không gọi cho tàu của cơ quan tình báo Khối Thịnh vượng chung.`,
    và đại từ `Họ` / `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000374
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000374: locks: [''Giữ các cụm `khả
    năng rò rỉ tin tình báo`, `Hẳn người gọi chỉ đang thử vận may.`, `một tay nghiệp
    dư phiền phức`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000375
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000375: locks: [''Giữ câu thoại
    của Tướng Habergram `“Chẳng màng đến thể diện sao? Đúng là nước cờ tệ hại. Có
    danh sách không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000376
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000376: locks: [''Giữ lời đáp lễ
    phép của cấp dưới `“Đây ạ. Có vẻ những tàu khác chỉ là phà chở khách thông thường.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000377
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000377: locks: [''Giữ các danh
    xưng và thuật ngữ `Đế quốc`, `một cường quốc đang thực sự tiến hành chiến tranh`,
    `tình báo Đế quốc`, `bí mật xin tị nạn`, `chính phủ Liên minh Entente, lúc này
    đang hoảng loạn và rối ren`, cấu trúc điều kiện khái quát lược chủ ngữ `Nếu tìm
    kiếm sự giúp đỡ một cách bừa bãi`, và các đại từ `họ`, `Anh`, `những người này`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000378
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000378: locks: [''Giữ dấu chấm
    lửng giữa câu `…`, các cụm `những người đứng đầu chính phủ`, `mất tinh thần…`,
    `kháng cự với tinh thần dân tộc chủ nghĩa`, `một kết cục đáng hy vọng`, và đại
    từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000379
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000379: locks: [''Giữ các câu đã
    sửa theo N11 và được nghiệm thu (`Thời điểm này rất nhạy cảm, vì họ dự đoán Đế
    quốc có thể mở một cuộc tấn công quy mô lớn trên các tuyến phía bắc bất cứ lúc
    nào.` và `Nhưng nếu họ kiên cường chống cự và chính phủ kêu gọi kháng chiến… thì
    có lẽ vẫn còn cơ hội.`), các danh xưng và thuật ngữ `Đế quốc`, `một cuộc tấn công
    quy mô lớn`, `các tuyến phía bắc`, `Liên minh Entente`, và đại từ `họ`.'']'
  non_canon: true
