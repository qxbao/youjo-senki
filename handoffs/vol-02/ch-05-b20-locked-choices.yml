choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000496
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000496: terms: [''xẻng'', ''độ
    giật'', ''học viện'']: pronouns_and_address: Tự sự ngôi thứ nhất của Warren Grantz
    dùng `tôi` và `chúng tôi`.: pov_and_voice: Tự sự ngôi thứ nhất của Grantz tiếp
    nối trực tiếp cảnh cận chiến bằng xẻng ở cuối `ch-05-b19` (`p000492`–`p000495`).:
    modality_and_logic: Bảo toàn sự đối lập cảm giác xúc giác: dư chấn cú xẻng nện
    xuống bàn tay khác hẳn độ giật khi bắn súng được dạy ở học viện, và cảm giác nghiền
    nát thứ gì đó vẫn hằn sâu trong cơ thể.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000497
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000497: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Câu tự vấn giả định
    quá khứ thể hiện trạng thái bàng hoàng sau khi ra tay.: modality_and_logic: Bảo
    toàn đúng thời gian của giả định trái thực tế trong quá khứ và độ mở của câu hỏi
    nội tâm: nếu lúc ấy cứ bị bỏ mặc như thế thì không biết chuyện gì đã có thể xảy
    ra.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000498
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000498: terms: [''Đại đội'', ''tù
    binh'', ''Lính mới'', ''yểm trợ'', ''lệnh cấm dùng ma pháp'']: pronouns_and_address:
    Tanya gọi các bộ phận trong đơn vị là `Đại đội`, `Lính mới` và dùng đại từ gộp
    `Chúng ta`.: pov_and_voice: Khẩu lệnh rút quân ngắn gọn, dứt khoát trên chiến
    trường.: modality_and_logic: Bảo toàn đầy đủ chuỗi mệnh lệnh: báo đã đến giờ;
    đại đội khiêng tù binh; lính mới làm nhiệm vụ yểm trợ; sau 30 giây lệnh cấm dùng
    ma pháp được dỡ bỏ để bay rút khỏi đó; đồng bộ đồng hồ và đếm ngược ba, hai, một,
    bắt đầu.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000499
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000499: terms: [''mệnh lệnh'',
    ''huấn luyện'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`,
    quy chiếu các mệnh lệnh bằng `chúng`.: pov_and_voice: Tự sự ngôi thứ nhất ghi
    nhận tác dụng cứu mạng của kỷ luật và huấn luyện quân sự.: modality_and_logic:
    Bảo toàn 4 câu: mệnh lệnh phát ra bằng giọng thì thầm bình tĩnh không chút nao
    núng kéo Grantz về thực tại; kết hợp với những gì được huấn luyện, chúng dần khiến
    cơ thể cử động; đó chính là điều anh đã được rèn luyện; và khóa huấn luyện đã
    cứu mạng anh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000500
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000500: terms: [''quả cầu tính
    toán'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice:
    Tự sự ngôi thứ nhất thuật lại thao tác cất cánh đúng hiệp đồng thời gian.: modality_and_logic:
    Bảo toàn trình tự: làm đúng theo lệnh, 30 giây sau khởi động quả cầu tính toán
    hết công suất và cất cánh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000501
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000501: terms: [''phòng tuyến'']:
    pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `Chúng tôi` / `mình`
    cho đơn vị và `tôi` / `Tôi` cho trải nghiệm cá nhân.: pov_and_voice: Câu ngắn
    dồn dập khắc họa nỗi khiếp đảm tột cùng giữa màn đạn pháo khi bay rút lui.: modality_and_logic:
    Bảo toàn trọn vẹn 6 câu: vội vã bay về phòng tuyến quân mình; chỉ mất vài phút;
    việc duy nhất phải làm chỉ là bay—đơn giản; nhưng thực tế thật khủng khiếp; tim
    đập thình thịch theo mỗi tiếng pháo nổ; đến thở cũng thấy đau.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000502
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000502: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `Tôi` kết hợp phản thân `mình` / `chính mình`.:
    pov_and_voice: Tự sự ngôi thứ nhất diễn tả trạng thái tê liệt cảm thức bản thân
    vì quá sợ hãi.: modality_and_logic: Bảo toàn quan hệ mức độ – hệ quả: sợ đến mức
    gần như không còn cảm thấy mình là chính mình nữa.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000503
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000503: terms: [''căn cứ hậu phương'']:
    pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `chúng tôi` và `tôi`.:
    pov_and_voice: Tự sự ngôi thứ nhất mô tả khoảnh khắc xả hết căng thẳng khi thoát
    khỏi vùng nguy hiểm.: modality_and_logic: Bảo toàn quan hệ thời gian và mục đích:
    khi bay lên cao để tránh bị bắn nhầm và lập lộ trình an toàn về căn cứ hậu phương,
    mọi căng thẳng lập tức tan biến và cơn mệt mỏi ập tới.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000504
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000504: terms: [''Thiếu tá'', ''thánh
    ca'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz quy chiếu Tanya bằng
    quân hàm `Thiếu tá`.: pov_and_voice: Câu hỏi cảm thán khép lại phân cảnh của Grantz,
    khắc họa sự tương phản kỳ dị giữa đám lính kiệt sức vì sợ hãi và vị chỉ huy.:
    modality_and_logic: Bảo toàn câu hỏi tự vấn đầy khó hiểu: làm sao Thiếu tá lại
    có thể bình thản hát thánh ca được.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000505
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000505: terms: [''Thiếu tá von
    Degurechaff'']: pronouns_and_address: Trần thuật ngôi thứ ba sau dấu ngắt cảnh
    (`space-break1`) định danh `Thiếu tá von Degurechaff`, không dùng đại từ `cô`.:
    pov_and_voice: Chuyển sang trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya
    vào buổi sáng tại căn cứ hậu phương.: modality_and_logic: Bảo toàn trình tự thời
    gian và sắc thái: hôm nay, sau khi tập thể dục buổi sáng và ăn sáng xong, Thiếu
    tá von Degurechaff với vẻ như đã hạ quyết tâm liền với tay lấy bút.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000506: terms: [''căn cứ hậu phương'']:
    pronouns_and_address: Trần thuật khách quan không dùng đại từ nhân xưng.: pov_and_voice:
    Trần thuật giải thích điều kiện liên lạc thư tín tại hậu phương.: modality_and_logic:
    Bảo toàn 2 câu: ở căn cứ hậu phương thư từ vẫn chuyển đến được; dĩ nhiên khi cần
    thì có thể gửi thư.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000507
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000507: terms: [''thư quân đội'']:
    pronouns_and_address: Trần thuật khách quan không dùng đại từ nhân xưng.: pov_and_voice:
    Trần thuật bổ sung đặc thù của đường thư quân sự.: modality_and_logic: Bảo toàn
    quan hệ nhân quả – nhượng bộ: vì là thư quân đội nên đôi khi bị chậm trễ, nhưng
    nhìn chung vẫn có thể gửi và nhận như thư thông thường.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000508
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000508: terms: [''Tanya'', ''thân
    nhân'']: pronouns_and_address: Trần thuật ngôi thứ ba dùng tên riêng `Tanya`,
    tránh dùng `cô` theo `DEC-P01-001` và `P01-tanya-narration-ch01`.: pov_and_voice:
    Trần thuật điểm nhìn Tanya nêu hoàn cảnh cá nhân không có người thân.: modality_and_logic:
    Bảo toàn nhận định hiển nhiên: một người không có thân nhân như Tanya thì chẳng
    có thư từ cá nhân nào để viết.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000509
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000509: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật ngôi thứ ba dùng tên riêng `Tanya`.: pov_and_voice: Trần thuật làm
    rõ phạm vi viết thư của Tanya.: modality_and_logic: Bảo toàn giới hạn: chỉ viết
    thư vì công việc chính thức hoặc không chính thức mà thôi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000510
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000510: terms: [''thư công vụ'',
    ''Tanya'']: pronouns_and_address: Trần thuật ngôi thứ ba dùng tên riêng `Tanya`.:
    pov_and_voice: Trần thuật khắc họa sự ngập ngừng hiếm thấy của Tanya trước một
    bức thư công vụ đặc biệt.: modality_and_logic: Bảo toàn sự đối lập: lần này viết
    vì việc công, thế nhưng trong một trường hợp hiếm hoi, Tanya lại rụt rè lấy giấy
    viết thư ra và ngòi bút lướt đi đầy lúng túng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000511
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000511: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật ngôi thứ ba lược chủ ngữ câu đầu và dùng tên riêng `Tanya` ở câu hai.:
    pov_and_voice: Trần thuật đối chiếu thái độ làm việc thường ngày với sự nặng nề
    trong ngày hôm nay.: modality_and_logic: Bảo toàn 3 câu: đã từng viết cả đống
    văn bản kiểu này; thường chỉ coi là công việc rồi giải quyết cho xong; nhưng hôm
    nay đầu ngòi bút lại nặng trĩu.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000512
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000512: terms: []: pronouns_and_address:
    Câu bình luận nội tâm dùng chủ ngữ khái quát `một người`.: pov_and_voice: Giọng
    tự nhủ mở đầu cho nội dung bức thư kỳ quặc bên dưới.: modality_and_logic: Bảo
    toàn cấu trúc giả định: một người mà có thể viết lá thư này không chút khó khăn
    nào thì mới là chuyện lạ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000513
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000513: terms: [''Chuẩn úy Anluk
    E. Kahteijanen'']: pronouns_and_address: Dòng mở đầu thư trang trọng gửi gia đình
    của Chuẩn úy Anluk E. Kahteijanen.: pov_and_voice: Văn phong thư công vụ gửi thân
    nhân quân nhân.: modality_and_logic: Bảo toàn đầy đủ lời chào đầu thư và danh
    xưng cấp bậc Chuẩn úy Anluk E. Kahteijanen.: emphasis: Bảo toàn dấu nhấn mạnh
    `*...*` tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000514
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000514: terms: [''Thiếu tá Pháp
    sư Tanya von Degurechaff'', ''cấp trên'']: pronouns_and_address: Trong thư, Tanya
    tự xưng `Tôi` và quy chiếu Chuẩn úy Kahteijanen bằng `anh ấy`.: pov_and_voice:
    Văn phong thư công vụ trang trọng, chuẩn mực.: modality_and_logic: Bảo toàn câu
    tự giới thiệu cấp bậc, họ tên và tư cách là sĩ quan cấp trên của Kahteijanen.:
    emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo
    `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000515
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000515: terms: [''Anluk E. Kahteijanen'',
    ''giải ngũ vì thương tật'']: pronouns_and_address: Tanya tự xưng `Tôi` và gọi
    gia đình người lính một cách kính trọng là `quý vị`.: pov_and_voice: Văn phong
    thông báo tin buồn trang trọng của cấp chỉ huy.: modality_and_logic: Bảo toàn
    thông báo lấy làm tiếc rằng người con duy nhất của gia đình là Anluk E. Kahteijanen
    sẽ được giải ngũ vì thương tật.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn
    câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000516
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000516: terms: [''nhiệm vụ tác
    chiến'', ''bác sĩ phẫu thuật'']: pronouns_and_address: Quy chiếu Kahteijanen trong
    thư bằng `anh`.: pov_and_voice: Giọng văn hành chính quân y trình bày nguyên nhân
    giải ngũ một cách lịch sự, giữ thể diện cho quân nhân.: modality_and_logic: Bảo
    toàn hai vế: anh đột ngột đổ bệnh trong một nhiệm vụ tác chiến, và bác sĩ phẫu
    thuật nhận định anh khó có thể chịu đựng thời gian phục vụ quân ngũ kéo dài.:
    emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo
    `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000517
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000517: terms: [''dưỡng bệnh'',
    ''bệnh viện quân y'']: pronouns_and_address: Quy chiếu Kahteijanen trong thư bằng
    `anh`.: pov_and_voice: Văn phong thông báo hướng điều trị phục hồi.: modality_and_logic:
    Bảo toàn mức độ khả năng (`Nhiều khả năng`) và hai lựa chọn nơi tịnh dưỡng: cần
    một thời gian dưỡng bệnh dài ở nhà hoặc tại bệnh viện quân y để hồi phục.: emphasis:
    Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000518
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000518: terms: [''Cục Nhân sự'',
    ''phương án điều trị'']: pronouns_and_address: Câu trần thuật hành chính trong
    thư không dùng đại từ.: pov_and_voice: Văn phong xác nhận quyết định phê duyệt
    của cơ quan nhân sự quân đội.: modality_and_logic: Bảo toàn thông tin Cục Nhân
    sự đã đồng ý tiến hành phương án điều trị này.: emphasis: Bảo toàn dấu nhấn mạnh
    `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000519
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000519: terms: [''dưỡng bệnh'']:
    pronouns_and_address: Quy chiếu Kahteijanen bằng `anh ấy`.: pov_and_voice: Lời
    nhắn nhủ ân cần của chỉ huy gửi tới gia đình quân nhân.: modality_and_logic: Bảo
    toàn lời đề nghị gia đình trò chuyện với anh ấy và đảm bảo anh ấy có kỳ dưỡng
    bệnh yên tĩnh.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ
    `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000520
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000520: terms: []: pronouns_and_address:
    Tanya đại diện đơn vị tự xưng `chúng tôi` và gọi gia đình là `quý vị`.: pov_and_voice:
    Lời xin lỗi trang trọng của người chỉ huy khi trả người lính về gia đình trong
    tình trạng bệnh tật.: modality_and_logic: Bảo toàn lời xin gia đình thứ lỗi vì
    đã đưa con của họ trở về trong tình trạng như vậy.: emphasis: Bảo toàn dấu nhấn
    mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000521
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000521: terms: [''pháp sư'', ''người
    đồng đội'']: pronouns_and_address: Quy chiếu Kahteijanen bằng `Anh ấy` và đơn
    vị bằng `chúng tôi`.: pov_and_voice: Lời ca ngợi phẩm chất quân nhân trang trọng
    trong thư gửi gia đình.: modality_and_logic: Bảo toàn đầy đủ các phẩm chất: là
    một pháp sư xuất sắc, người đồng đội không thể thay thế, dũng cảm và được mọi
    người tin cậy.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ
    `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000522
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000522: terms: [''Anluk E. Kahteijanen'',
    ''hàng ngũ'']: pronouns_and_address: Tanya đại diện đơn vị dùng `Chúng tôi`.:
    pov_and_voice: Lời bày tỏ niềm tiếc nuối chính thức của đơn vị.: modality_and_logic:
    Bảo toàn thông điệp đau buồn khi từ nay không còn Anluk E. Kahteijanen trong hàng
    ngũ.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>`
    theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000523
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000523: terms: [''Huy hiệu Phục
    vụ Chiến trường Hạng Nhất'', ''Huân chương Thương tật'']: pronouns_and_address:
    Tanya tự xưng `tôi` và quy chiếu Kahteijanen bằng `anh ấy`.: pov_and_voice: Giọng
    văn chuẩn mực thông báo chế độ khen thưởng để an ủi gia đình.: modality_and_logic:
    Bảo toàn mệnh đề nhượng bộ và kết quả: dẫu biết chỉ là chút an ủi nhỏ nhoi, Tanya
    đã đề cử anh nhận Huy hiệu Phục vụ Chiến trường Hạng Nhất cùng Huân chương Thương
    tật và cả hai đều đã được phê chuẩn.: emphasis: Bảo toàn dấu nhấn mạnh `*...*`
    toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000524
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000524: terms: []: pronouns_and_address:
    Tanya tự xưng `Tôi` và quy chiếu Kahteijanen bằng `anh ấy`.: pov_and_voice: Lời
    chúc bình phục cuối thư.: modality_and_logic: Bảo toàn lời chúc mong anh ấy hồi
    phục hoàn toàn.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ
    `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000525
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000525: terms: []: pronouns_and_address:
    Công thức kết thư trang trọng (`Trân trọng,`).: pov_and_voice: Văn phong thư tín
    chính thức.: modality_and_logic: Bảo toàn lời chào kết thư.: emphasis: Bảo toàn
    dấu nhấn mạnh `*...*` tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000526
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000526: terms: [''Chỉ huy đơn vị'',
    ''Lục quân Đế quốc'', ''Thiếu tá Pháp sư Tanya von Degurechaff'']: pronouns_and_address:
    Chữ ký chức danh và quân hàm đầy đủ kèm ký hiệu che tên đơn vị `[xxx]`.: pov_and_voice:
    Văn phong ký tên công văn/thư tín quân đội thời chiến.: modality_and_logic: Bảo
    toàn nguyên vẹn ký hiệu kiểm duyệt `[xxx]`, chức danh chỉ huy đơn vị, quân chủng
    Lục quân Đế quốc và quân hàm Thiếu tá Pháp sư Tanya von Degurechaff.: emphasis:
    Bảo toàn dấu nhấn mạnh `*...*` toàn dòng tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000527
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000527: terms: [''phi công Thunderbolt
    Mỹ'', ''cựu binh'', ''ngộ độc thực phẩm'']: pronouns_and_address: Độc thoại nội
    tâm của Tanya sau dấu ngắt cảnh (`space-break1`) tự xưng `mình` theo đúng `DEC-P01-001`.:
    pov_and_voice: Cú lật giọng hài hước đen tối: từ bức thư bi tráng chuyển thẳng
    sang sự thật trớ trêu là ngộ độc khoai tây hỏng.: modality_and_logic: Bảo toàn
    cả hai câu: nỗi ngỡ ngàng khi có ngày mất một người lính vì mấy củ khoai tây hỏng;
    và sự kiểm chứng giai thoại của một phi công Thunderbolt Mỹ rằng ngay cả lính
    kỳ cựu/cựu binh cũng không thắng nổi ngộ độc thực phẩm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000528
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000528: terms: [''Tanya'', ''hậu
    cần'']: pronouns_and_address: Trần thuật ngôi thứ ba dùng tên riêng `Tanya`, không
    dùng `cô` theo `DEC-P01-001`.: pov_and_voice: Độc thoại nội tâm in nghiêng kết
    hợp trần thuật ngôi thứ ba thể hiện sự bực bội với khâu hậu cần.: modality_and_logic:
    Bảo toàn câu kết luận nội tâm rằng đám khoai tây đó đúng là đã hỏng thật (nối
    lại chi tiết khoai tây ở `ch-05-b18` `p000443`), cùng hành động Tanya cất bút
    và nỗi bực dọc trước tình hình hậu cần ngày một tệ.: emphasis: Bảo toàn chính
    xác 1 câu đầu trong `*...*` tương ứng thẻ `<html:em>` (`*Vậy là khoai tây đúng
    là bị hỏng thật.*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000529
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000529: terms: [''cấp dưới'', ''cấp
    trên'', ''Tanya'']: pronouns_and_address: Độc thoại nội tâm in nghiêng dùng `mình`;
    câu trần thuật ngôi thứ ba lặp lại tên `Tanya` (không dùng `cô`), từ `nó` quy
    chiếu `sự việc`.: pov_and_voice: Độc thoại nội tâm đan xen trần thuật khắc họa
    tâm trạng dở khóc dở cười của Tanya.: modality_and_logic: Bảo toàn sự tương phản:
    viết thư cho gia đình khi cấp dưới gặp chuyện là trách nhiệm của cấp trên và Tanya
    không hề phản đối việc viết thư, nhưng lý do lại là ngộ độc khoai tây khiến Tanya
    rối bời không sao gạt khỏi tâm trí được.: emphasis: Bảo toàn chính xác 1 câu đầu
    trong `*...*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000530
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000530: terms: [''cuộc đột kích
    ban đêm'', ''cựu binh'', ''vũ khí NBC'', ''pháp sư'', ''thuật thức trị liệu'',
    ''Màn bảo hộ'']: pronouns_and_address: Hồi tưởng ngôi thứ nhất của Tanya quy chiếu
    Kahteijanen bằng `Anh ấy` / `anh ta` và tập thể đơn vị bằng `chúng tôi` (xem thêm
    finding `m1` về đại từ số ít).: pov_and_voice: Tự sự hồi tưởng sinh động cảnh
    náo loạn đêm qua khi tưởng thuộc cấp trúng vũ khí hóa-sinh-hạt nhân mới.: modality_and_logic:
    Bảo toàn đầy đủ 6 câu: ăn xong đi đột kích đêm, lúc về nôn thốc tháo và kêu đau
    bụng dữ dội làm Tanya choáng váng; Tanya sững người; thấy một lính kỳ cựu quằn
    quại như vậy nên đinh ninh đã trúng vũ khí NBC vốn có tác dụng cả với pháp sư;
    vội thi triển thuật thức trị liệu nhưng chỉ làm dịu cơn đau; vì màn bảo hộ vốn
    che chắn toàn diện trước NBC nên cả đơn vị suýt hoảng loạn tưởng địch vừa phát
    triển vũ khí mới chưa có trong danh mục.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000531
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000531: terms: [''bác sĩ phẫu thuật'',
    ''ngộ độc thực phẩm cấp tính'', ''Anluk E. Kahteijanen'']: pronouns_and_address:
    Hồi tưởng ngôi thứ nhất số nhiều dùng `chúng tôi`, quy chiếu Kahteijanen bằng
    `anh` và họ tên đầy đủ.: pov_and_voice: Nhịp thở phào nhẹ nhõm pha lẫn sự trớ
    trêu khi biết chẩn đoán thực sự.: modality_and_logic: Bảo toàn 3 câu: bác sĩ phẫu
    thuật vội chạy tới khám thì cả bọn mới thở phào được; hóa ra chỉ là ngộ độc thực
    phẩm cấp tính đột ngột; và chỉ một mình anh chàng xui xẻo Anluk E. Kahteijanen
    mắc phải (chơi chữ `unlucky Anluk`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000532
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000532: terms: [''pháp sư'', ''tiền
    tuyến'']: pronouns_and_address: Độc thoại của Tanya quy chiếu Kahteijanen bằng
    `anh ấy`, tự quy chiếu bằng `Tôi` / `mình`.: pov_and_voice: Lời chửi thề tiếc
    của khi mất đi một thuộc cấp giỏi vì lý do lãng xẹt.: modality_and_logic: Bảo
    toàn tiếng chửi thề tiếc nuối một pháp sư giỏi và suy nghĩ chưa từng ngờ sẽ phải
    tiễn người rời tiền tuyến theo cách này.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000533
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000533: terms: [''Cục Nhân sự'',
    ''thương tật'', ''lương hưu'', ''danh dự'', ''sĩ quan'', ''cấp dưới'']: pronouns_and_address:
    Độc thoại của Tanya quy chiếu Kahteijanen bằng `anh ấy`.: pov_and_voice: Tư duy
    thực dụng đặc trưng của Tanya: vừa bảo toàn quyền lợi và danh dự cho thuộc cấp,
    vừa giữ sạch hồ sơ cá nhân của bản thân.: modality_and_logic: Bảo toàn trọn vẹn
    3 câu: may mắn là Cục Nhân sự xử lý tình trạng của anh như một ca thương tật;
    nhờ vậy anh được nhận lương hưu và giữ nguyên danh dự người lính; đồng thời bản
    thân Tanya với tư cách sĩ quan cũng không bị vết nhơ có cấp dưới mất danh dự làm
    hoen ố hồ sơ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000534
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000534: terms: [''sĩ quan'', ''đơn
    vị'']: pronouns_and_address: Câu đầu dùng chủ ngữ khái quát `người ta` cho đại
    từ ngôi thứ hai phiếm chỉ theo `direct-address choice`; câu hai dùng `mình` cho
    Tanya.: pov_and_voice: Giọng tự giễu chua chát khép lại toàn bộ sự cố ngộ độc
    khoai tây.: modality_and_logic: Bảo toàn cả 3 câu: một sĩ quan để mất lính vì
    khoai tây hỏng thì người ta chỉ có nước cười nhạo; câu hỏi tu từ ai mà ngờ trong
    đơn vị mình lại có người bị chính cái dạ dày quật ngã; và câu tự phủ định khép
    đoạn rằng thực ra chẳng buồn cười chút nào.: emphasis: none'
  non_canon: true
