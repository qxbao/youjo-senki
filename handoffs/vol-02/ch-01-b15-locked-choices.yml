choices:
- segment_id: YS-LN02/Text/part0012.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000019: locks: [''Giữ cặp đại từ
    đối thoại `tôi` – `ông`, cấu trúc điều kiện phủ định `Nếu ông nói không làm được,
    vậy chắc là không làm được rồi`, và cấu trúc phủ định kép `nhưng đừng hòng thuyết
    phục tôi rằng ông không có kế hoạch thay thế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000020: locks: [''Giữ cặp thuật
    ngữ `tiền tuyến và hậu phương`, cụm `hai người đàn ông`, đại từ `họ`, và cụm `hoàn
    toàn tin tưởng vào năng lực xuất chúng của nhau`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000021: locks: [''Giữ danh xưng
    `Tướng von Rudersdorf`, đại từ `tôi`, các thuật ngữ đã sửa theo signoff `những
    người phụ trách đầu máy toa xe`, `Cục Hậu cần`, `tình hình hậu cần ở Norden`,
    và phủ định `sẽ chẳng sớm được cải thiện đâu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000022: locks: [''Giữ danh xưng
    `Tướng von Zettour`, cặp đại từ `tôi` – `ông`, và thuật ngữ `khả năng mở tuyến
    tiếp tế đường biển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000023: locks: [''Giữ tên riêng
    `Zettour`, đại từ trần thuật `ông`, cặp đại từ đối thoại `ông` – `tôi` (đặc biệt
    là `Nếu cần, tôi có thể điều một con tàu gần ba trăm nghìn tấn tới một cơ sở cảng
    nào đó ở phía bắc để tiến hành đổ bộ` đã sửa theo signoff), đại từ gộp `ta`, và
    các thuật ngữ `các tuyến hàng hải`, `cảng`, `tàu buôn`, `trưng dụng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000024: locks: [''Giữ đại từ `ông`
    và giọng đối đáp của Rudersdorf `“Vậy là quyết định thế nhé? Giá mà ông nói thế
    ngay từ đầu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000025: locks: [''Giữ đại từ `Tôi`
    và `ta`, điều kiện giả định `chỉ có giá trị với giả định rằng ta kiểm soát được
    biển`, cấu trúc tương phản – phủ định `Tôi có thể chấp nhận một hai cuộc giao
    tranh nhỏ, nhưng không muốn đánh cược vào một chiến dịch đổ bộ sâu sau phòng tuyến
    địch, có nguy cơ mất cả một đơn vị lẫn một con tàu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000026: locks: [''Giữ tên riêng
    `Zettour`, đại từ `Ông`, và phép so sánh mức độ quan ngại `Ông lo về những tổn
    thất có thể xảy ra hơn là khả năng chiến dịch thành công`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000027: locks: [''Giữ danh xưng
    `Đế quốc`, `Hải quân Đế quốc`, đại từ `họ`, các thuật ngữ `các tuyến hàng hải`,
    `tiếp tế và tác chiến`, `các tuyến tiếp tế`, và câu hỏi phản vấn `liệu họ có thực
    sự bảo vệ nổi các tuyến tiếp tế không?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000028: locks: [''Giữ danh xưng
    `Đế quốc`, đại từ `họ`, các thuật ngữ `những eo biển hẹp`, `tuyến tiếp tế quy
    mô lớn`, và cấu trúc phủ định giới hạn `không còn lựa chọn nào ngoài việc bi quan
    về khả năng thiết lập một tuyến tiếp tế quy mô lớn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000029: locks: [''Giữ đại từ `Ông`
    và `họ`, cụm `những tổn thất trên giấy`, và các thuật ngữ `phòng tuyến Liên minh
    Entente`, `cắt đứt liên lạc của họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000030: locks: [''Giữ tên riêng
    `Rudersdorf`, `Zettour`, và cụm đối chiếu `lạc quan gần như đến mức bất cẩn nếu
    so với những mối bận tâm chiến lược của Zettour`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000031: locks: [''Giữ các danh
    xưng `Liên minh Entente`, `Dacia`, `Rudersdorf`, `Lục quân Đế quốc`, các thuật
    ngữ `tiền tuyến giằng co`, `sức mạnh quốc gia`, `vùng hậu phương`, `binh sĩ`,
    và điều kiện giả định `nhưng nếu Lục quân Đế quốc chiếm được một vùng hậu phương
    như cách binh sĩ của họ từng giày xéo Dacia, thì ngay cả Liên minh Entente cũng
    sẽ tự sụp đổ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000032: locks: [''Giữ đại từ `Tôi`,
    `họ`, `ta`, danh xưng `nước Cộng hòa`, hai cấu trúc phủ định `Tôi không thể phủ
    nhận`, `tôi không nghĩ họ còn là mối đe dọa lớn`, và câu hỏi đề xuất `Hay ta bỏ
    qua họ và kết liễu nước Cộng hòa đi?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000033: locks: [''Giữ câu bỏ lửng
    có cấu trúc so sánh phủ định `“Không gì tốt hơn việc giảm số mặt trận, nhưng…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000034: locks: [''Giữ danh xưng
    `Liên minh Entente`, tên riêng `Zettour`, hai cơ quan đối xứng đã đồng bộ ở cả
    câu đầu và câu cuối theo final signoff `Cục Tác chiến` và `Cục Hậu cần`, phủ định
    `Zettour không nghĩ tiến quân lên phía bắc sẽ giúp giảm bớt gánh nặng hậu cần`,
    và các thuật ngữ `gánh nặng hậu cần`, `mặt trận`, `tình hình chiến lược`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000035: locks: [''Giữ danh xưng
    `Liên minh Entente`, đại từ đối thoại `ông`, các thuật ngữ `góc độ hậu cần`, `binh
    sĩ`, và hai cấu trúc phủ định `chẳng hề nhẹ`, `Dù không bắn một viên đạn nào,
    binh sĩ vẫn chết đói nếu không được ăn, ông biết đấy`.'']'
  non_canon: true
