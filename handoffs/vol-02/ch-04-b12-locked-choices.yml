- segment_id: YS-LN02/Text/part0024.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000040: names_and_ranks: [''secondary
    explosion -> vụ nổ thứ cấp'', ''depth charges -> mìn sâu'']: pronouns_and_address:
    [''Nội tâm dùng "chúng ta" cho đơn vị và "chúng" cho tàu địch; mệnh đề dẫn trần
    thuật ngôi thứ ba dùng "nó" cho Tanya theo DEC-P01-001 (bản sửa M3)'']: pov_and_logic:
    [''Giữ nguyên nhân khiến bầu không khí nặng nề (không gây được bao nhiêu thiệt
    hại), suy đoán việc không có vụ nổ thứ cấp có thể do địch đã dùng hết "mìn sâu"
    (`vol02-ch04-b12-depth-charges`), và lời tự nhận đó có lẽ chỉ là mong ước hão
    huyền'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown `*Có lẽ chỉ là mong
    ước hão huyền thôi*` cho câu nghĩ trực tiếp và đặt phần dẫn "nó than thở" ở ngoài
    dấu sao theo DEC-P01-002 (bản sửa M1)'']'
  non_canon: true
