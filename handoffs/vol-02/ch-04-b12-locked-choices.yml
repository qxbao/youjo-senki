    `¹⁴` đúng vị trí, và tâm trạng mừng thầm vì ngòi nổ VT vẫn chưa tung hết uy lực'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000039
