- segment_id: YS-LN02/Text/part0030.xhtml/p000279
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000279: terms: [''lính trẻ em'',
    ''cỗ máy chiến đấu'', ''Tanya'', ''Huy hiệu Đột kích Cánh bạc'', ''nàng tiên'',
    ''ma cà rồng'']: pronouns_and_address: Trần thuật quy chiếu vị tư lệnh bằng `ông`
    (kèm phản thân `mình`) và quy chiếu Tanya bằng `nó` / tên riêng `Tanya`.: pov_and_voice:
    Giọng trần thuật tái hiện sự chuyển biến nhận thức của vị tư lệnh từ lúc nghe
    đồn đến khi tận mắt gặp Tanya.: modality_and_logic: Bảo toàn đủ 5 câu: phản ứng
    bật cười ban đầu khi nghe tin -> ấn tượng đầu tiên khi gặp trực tiếp là một cỗ
    máy chiến đấu -> lập tức sửa lại cách nhìn ấy nhưng không hề nghĩ mình đã hiểu
    nó -> xác nhận lời đồn đi trước Tanya về người nhận Huy hiệu Đột kích Cánh bạc
    trông như nàng tiên sinh ra để chiến đấu hẳn đúng từng chữ -> suy đoán có lẽ vì
    đường nét cân đối mà Tanya giống kiểu người có thể bị gọi sau lưng là ma cà rồng.:
    emphasis: Bảo toàn chính xác 3 vùng nhấn mạnh theo `DEC-P01-002` tương ứng 3 thẻ
    `<html:em>` trong nguồn: câu hỏi `*Vậy là một lính trẻ em như trong truyền thuyết
    à?*`, cụm ấn tượng `*một cỗ máy chiến đấu*`, và mệnh đề lời đồn chêm giữa cặp
    gạch ngang dài `*người nhận Huy hiệu Đột kích Cánh bạc trông như một nàng tiên,
    dù sinh ra để chiến đấu*`.'
  non_canon: true
