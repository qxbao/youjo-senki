- segment_id: YS-LN02/Text/part0030.xhtml/p000281
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000281: terms: [''huấn luyện dã
    chiến'', ''lính mới'', ''tập kích ban đêm'', ''chiến hào tiền đồn của địch'',
    ''tỷ lệ tổn thất'', ''quân nhân'']: pronouns_and_address: Trần thuật quy chiếu
    Tanya bằng `nó` và đơn vị của Tanya bằng `Họ`.: pov_and_voice: Giọng trần thuật
    điểm lại thành tích huấn luyện thực chiến đáng kinh ngạc của Tanya trước khi chuyển
    sang lời nhận xét thầm của vị tư lệnh.: modality_and_logic: Bảo toàn đủ 4 câu:
    được lệnh tổ chức huấn luyện dã chiến đơn giản nhưng lại dẫn lính mới tập kích
    ban đêm vào chiến hào tiền đồn của địch -> tỷ lệ tổn thất của đơn vị lại thấp
    đến bất ngờ -> dù chiến đấu quyết liệt, gan dạ không nao núng và lập được chiến
    công, tỷ lệ tổn thất vẫn thấp hơn mọi đơn vị khác -> câu kết nhận định giả định
    rằng nếu chỉ xét điều đó thì quả là một quân nhân xuất sắc.: emphasis: Bảo toàn
    chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ
    câu cuối `*Nói thật, nếu chỉ xét điều đó thì nó đúng là một quân nhân xuất sắc.*`
    tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000282
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000282: terms: [''Trung tá von
    Lergen'', ''các chuyên gia pháp lý'', ''Bộ Ngoại giao'']: pronouns_and_address:
    Trong độc thoại nội tâm trực tiếp của vị tư lệnh quân đoàn, Tanya được quy chiếu
    bằng `Cô` / `cô`.: pov_and_voice: Giọng độc thoại nội tâm trầm ngâm, e ngại trước
    sự hoàn hảo không kẽ hở của Tanya và sự bất lực của các cơ quan từng muốn kìm
    hãm cô.: modality_and_logic: Bảo toàn đủ 5 câu cùng dấu chấm lửng cuối đoạn: nhận
    xét cô quá hoàn hảo -> không có gì để chê vì quá lý trí và đạt quá nhiều thành
    tựu -> hệ quả không ai ngăn nổi -> lý giải việc Trung tá von Lergen thất bại khi
    tìm cách loại bỏ cô là dễ hiểu -> phỏng đoán `có lẽ` việc các chuyên gia pháp
    lý để cô thoát và Bộ Ngoại giao bỏ cuộc còn là những yếu tố lớn hơn.: emphasis:
    Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh
    toàn bộ đoạn văn tương ứng thẻ `<html:em>` trong nguồn.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000283
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000283: terms: [''đơn vị pháp sư
    địch'', ''thành phố Arene'', ''lực lượng tiếp viện'', ''dẹp yên thành phố'']:
    pronouns_and_address: Câu mệnh lệnh quân sự trực tiếp lược chủ ngữ ngôi thứ hai.:
    pov_and_voice: Giọng giao nhiệm vụ tác chiến dứt khoát của tư lệnh quân đoàn.:
    modality_and_logic: Bảo toàn đúng trình tự hai bước nhiệm vụ và khẩu lệnh kết
    thúc: nhanh chóng tiêu diệt đơn vị pháp sư địch đã đột nhập vào thành phố Arene
    phía sau chiến tuyến -> sau đó hội quân với lực lượng tiếp viện và dẹp yên thành
    phố -> `Hết.`: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000284
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000284: terms: [''Các pháp sư Cộng
    hòa'', ''thành phố Arene'', ''hậu phương'', ''các đơn vị cảnh giới của Đế quốc'',
    ''những cuộc bạo loạn của du kích'', ''dẹp yên'', ''đường sắt'', ''tuyến hậu cần'']:
    pronouns_and_address: Trần thuật dùng đại từ gộp `ta` cho phía Đế quốc ở câu điều
    kiện.: pov_and_voice: Giọng trần thuật phân tích tình hình chiến lược khẩn cấp
    tại mắt xích giao thông Arene.: modality_and_logic: Bảo toàn đủ 4 câu: pháp sư
    Cộng hòa đổ bộ xuống thành phố Arene ở hậu phương, theo một nghĩa nào đó hoàn
    toàn qua mặt các đơn vị cảnh giới Đế quốc -> các cuộc bạo loạn của du kích đang
    lan rộng -> chuỗi hai điều kiện nhân quả liên hoàn: nếu không dẹp yên được Arene
    thì không thể sử dụng đường sắt, và nếu không dùng được đường sắt thì tuyến hậu
    cần sẽ bị cắt đứt.: emphasis: none'
  non_canon: true
