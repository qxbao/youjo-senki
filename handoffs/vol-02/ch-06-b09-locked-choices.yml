choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000257
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000257: terms: []: pronouns_and_address:
    Lời thoại ngắn của giảng viên không dùng đại từ nhân xưng.: pov_and_voice: Giọng
    giảng viên tiếp nhận lập luận của Tanya ở cuối `b08` và gợi mở để học viên trình
    bày tiếp.: modality_and_logic: Bảo toàn dấu chấm lửng mở đầu `…`, lời xác nhận
    đã hiểu ý và câu hỏi ngắn thúc giục nói tiếp (`“…À, ra vậy. Rồi sao nữa?”`).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000258
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000258: terms: []: pronouns_and_address:
    Tuân thủ `DEC-P01-001` và `chapter6_b11_active_choices`: độc thoại nội tâm của
    Tanya tự quy chiếu bằng `mình`.: pov_and_voice: Giọng nội tâm điềm nhiên, sẵn
    sàng trình bày tiếp chuỗi lý lẽ lách luật.: modality_and_logic: Bảo toàn mệnh
    đề điều kiện (`Nếu được phép nói tiếp`) và quyết định chủ động (`thì mình sẽ tiếp
    tục`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000259
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000259: terms: [''tranh luận pháp
    lý'', ''ngụy biện'', ''đổ lỗi cho nhau'', ''Tòa án'', ''các vụ việc pháp lý quốc
    tế'']: pronouns_and_address: Độc thoại nội tâm nhận định khái quát không dùng
    đại từ nhân xưng.: pov_and_voice: Giọng bình luận thực dụng, châm biếm về bản
    chất của tranh tụng và luật pháp quốc tế.: modality_and_logic: Bảo toàn từ mở
    đầu `Ừm`, phép chia đôi mỉa mai (`một nửa là ngụy biện, một nửa là đổ lỗi cho
    nhau`) và quan hệ nhượng bộ – đối lập giữa phán quyết cuối cùng của tòa án với
    ảnh hưởng lớn từ cách mỗi quốc gia diễn giải luật.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000260
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000260: terms: [''luật chiến tranh'',
    ''nghĩa vụ bảo vệ'', ''những người không tham chiến'']: pronouns_and_address:
    Trong lời phát biểu trước lớp, Tanya dùng `cả hai ta` (hoặc `cả hai bên chúng
    ta`) và `chúng ta` / `ta` cho chủ thể các bên/phía mình, tự xưng `tôi` khi nêu
    quan điểm cá nhân (`nhưng tôi nghĩ`), và chuyển đại từ ngôi thứ hai phiếm chỉ
    sang cấu trúc danh động từ (`Còn tùy cách vận dụng`) theo `direct-address choice`.:
    pov_and_voice: Giọng thuyết trình pháp lý điềm tĩnh nhưng hướng tới việc lợi dụng
    quy định nhân đạo làm công cụ tác chiến.: modality_and_logic: Bảo toàn đủ 3 câu:
    nghĩa vụ chung của cả hai bên theo luật chiến tranh trong việc bảo vệ người không
    tham chiến -> kỳ vọng nỗ lực tối đa để thực hiện nghĩa vụ ấy -> nhận định tùy
    cách vận dụng mà phía mình có thể tận dụng quy định đó.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000261
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000261: terms: [''một toán nhỏ'',
    ''thường dân'', ''viên đạn lạc'', ''cái cớ'']: pronouns_and_address: Độc thoại
    nội tâm của Tanya dùng đại từ gộp `ta` cho phía quân mình.: pov_and_voice: Giọng
    toan tính chiến thuật lạnh lùng, cân nhắc giữa thủ đoạn khiêu khích tạo cớ và
    phương án hợp thức hóa kín kẽ hơn.: modality_and_logic: Bảo toàn đủ 4 câu: câu
    hỏi giả định về việc cho một toán nhỏ xâm nhập khu dân cư rồi bị tấn công -> điều
    kiện giả định chỉ cần một viên đạn lạc bắn về phía mình là đủ biến thành cái cớ
    -> lời tự nhận xét đó là cách làm cực đoan -> khẳng định vẫn có cách chính đáng
    hơn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000262
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000262: terms: [''người không tham
    chiến'']: pronouns_and_address: Tanya dùng đại từ gộp `ta` cho phía mình và `họ`
    cho đối phương.: pov_and_voice: Giọng đề xuất lạnh lùng, sắc bén.: modality_and_logic:
    Bảo toàn liên từ phương án thay thế (`Hoặc`), mệnh đề điều kiện ép đối phương
    tự tuyên bố không có người không tham chiến, và hệ quả tức thì là những hạn chế
    được dỡ bỏ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000263
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000263: terms: []: pronouns_and_address:
    Câu hỏi phản ứng ngắn không dùng đại từ.: pov_and_voice: Giọng sững sờ, ngạc nhiên
    của giảng viên trước lối lập luận bất ngờ.: modality_and_logic: Bảo toàn câu hỏi
    ngắn (`“Gì cơ?”`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000264
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000264: terms: [''thường dân'',
    ''dân quân'', ''quyền nào của tù binh'']: pronouns_and_address: Tanya dùng `họ`
    cho đối phương và `chúng ta` / `ta` cho phía mình.: pov_and_voice: Giọng lập luận
    lách luật sắc lạnh, đẩy tuyên bố kháng cự toàn dân của địch thành căn cứ tước
    quyền được bảo hộ.: modality_and_logic: Bảo toàn chính xác hai tầng điều kiện
    giả định liên tiếp (`Nếu họ tuyên bố rằng tất cả mọi người, đến thường dân cuối
    cùng, đều sẽ kháng cự chúng ta. Nếu ta diễn giải điều đó thành mọi thường dân
    đều là dân quân`) và kết luận phủ định nghĩa vụ pháp lý (`thì ta không cần công
    nhận bất kỳ quyền nào của tù binh`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000265
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000265: terms: [''Nam Tư cũ'',
    ''công dân'', ''binh lính'', ''tội ác chiến tranh'', ''lý trí'']: pronouns_and_address:
    Quy chiếu `Nam Tư cũ` và công dân của họ bằng `họ` / `bọn họ`, dùng `ta` trong
    mệnh đề suy luận giả định, và chuyển đại từ ngôi thứ hai phiếm chỉ ở câu cuối
    sang `người ta` theo `direct-address choice`.: pov_and_voice: Giọng liên tưởng
    lịch sử kiếp trước kết hợp tự nhận thức tỉnh táo về việc lối diễn giải cực đoan
    này bóp méo cả lý trí.: modality_and_logic: Bảo toàn dấu chấm lửng mở đầu `…`,
    dẫn chứng tiền lệ Nam Tư cũ tuyên bố mọi công dân đều là binh lính, mệnh đề kết
    luận hợp lý của cách diễn giải đó (rằng có thể cho nổ tung tất cả mà không phạm
    tội ác chiến tranh, không tự thêm phương tiện ném bom), và câu nhận xét nhượng
    bộ ở cuối rằng đẩy kiểu diễn giải này đến cực đoan có thể bóp méo cả lý trí.:
    emphasis: Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu
    `*...*` quanh mệnh đề suy luận giả định `*Nếu ai cũng là binh lính, ta có thể
    cho nổ tung tất cả bọn họ mà không bị xem là phạm tội ác chiến tranh*` tương ứng
    thẻ `<html:em>`, giữ nguyên phần lời kể còn lại ở chữ thường.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000266
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000266: terms: [''công lý'', ''sự
    công bằng'']: pronouns_and_address: Nhận định nội tâm khái quát không dùng đại
    từ nhân xưng.: pov_and_voice: Giọng kết luận dửng dưng, thực tế.: modality_and_logic:
    Bảo toàn quan hệ hệ quả tất nhiên: công lý và sự công bằng tất nhiên cũng bị bóp
    méo theo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000267
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000267: terms: [''một vị thần hay
    ác quỷ'', ''Being X'', ''công lý'']: pronouns_and_address: Quy chiếu `Being X`
    bằng cụm định danh bất kính `gã Being X này` và đại từ phản thân `mình`; lược
    đại từ ngôi thứ hai phiếm chỉ ở câu cuối theo `direct-address choice`.: pov_and_voice:
    Giọng độc thoại nội tâm bất cần, thách thức và đổ lỗi ngược cho Being X để tự
    hợp thức hóa bản thân.: modality_and_logic: Bảo toàn đủ 6 câu cùng cặp dấu gạch
    ngang dài chêm ý: lời xác nhận bất cần (`Đúng thế. Rồi sao? Thì sao nào?`) ->
    định đề thực chứng pháp lý (`Khái niệm vẫn chỉ là khái niệm, luật tồi vẫn là luật`)
    -> tiền đề về thế giới nơi `gã Being X này` tùy ý làm theo ý mình -> giả định
    suy ngẫm nghiêm túc về công lý kèm mức phỏng đoán `có lẽ` rằng kẻ quy định thế
    giới phải chìm trong chiến tranh mới là kẻ ác.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000268
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000268: terms: []: pronouns_and_address:
    Tuân thủ `DEC-P01-001`: nội tâm tự quy chiếu của Tanya dùng `mình`.: pov_and_voice:
    Giọng tự bào chữa trơ trẽn mà hoàn toàn tự tin của Tanya.: modality_and_logic:
    Bảo toàn kết luận đánh đồng việc tuân thủ quy tắc/lách luật với sự lương thiện
    (`Nói cách khác, mình chỉ là một người tốt đang làm tròn bổn phận`).: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000269
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000269: terms: [''Q.E.D.¹⁹'']:
    pronouns_and_address: Cụm kết luận viết tắt không dùng đại từ.: pov_and_voice:
    Giọng đóng lại chuỗi ngụy biện nội tâm như một bài toán đã chứng minh xong.: modality_and_logic:
    Bảo toàn chữ viết tắt `Q.E.D.` và ký hiệu gọi chú thích số mũ `¹⁹`.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000270
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000270: terms: [''tư lệnh quân
    đoàn'', ''thiếu tá'', ''con quái vật này'']: pronouns_and_address: Mở đầu phân
    cảnh mới từ góc nhìn vị tư lệnh quân đoàn: quy chiếu tư lệnh quân đoàn bằng `ông`,
    và quy chiếu Tanya bằng cách gọi đánh giá `một sĩ quan chỉ mang hàm thiếu tá`
    / `con quái vật này`.: pov_and_voice: Giọng trần thuật ngôi thứ ba bám sát tâm
    trạng ngán ngẩm, bất đắc dĩ của vị tư lệnh quân đoàn.: modality_and_logic: Bảo
    toàn đủ 3 câu: sự hiếm hoi của việc một tư lệnh quân đoàn triệu một sĩ quan chỉ
    mang hàm thiếu tá -> phỏng đoán `có lẽ` vị tư lệnh chẳng vui vẻ gì với sự hiếm
    hoi ấy -> mệnh đề nhượng bộ (`Dù là chuyện ngoại lệ`) dẫn tới khả năng đáng ngại
    rằng một ngày nào đó ông có thể lại phải triệu con quái vật này đến.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000271
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000271: terms: []: pronouns_and_address:
    Trần thuật quy chiếu vị tư lệnh quân đoàn bằng `ông`.: pov_and_voice: Giọng trần
    thuật hài hước khô khan.: modality_and_logic: Bảo toàn giả định truyền đạt và
    giới hạn mức độ (`Dù có bảo ông rằng đó mới chỉ là một khả năng, ông cũng chẳng
    thấy khá hơn`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000272
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000272: terms: [''Thiếu tá von
    Degurechaff'']: pronouns_and_address: Tư lệnh quân đoàn gọi trực tiếp cấp dưới
    bằng cấp bậc và họ `Thiếu tá von Degurechaff`.: pov_and_voice: Giọng bề trên trang
    trọng khi mở lời giao nhiệm vụ.: modality_and_logic: Bảo toàn câu mở lời của vị
    tư lệnh với Thiếu tá von Degurechaff.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000273
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000273: terms: []: pronouns_and_address:
    Tanya đáp lễ cấp trên bằng `“Thưa ngài.”`: pov_and_voice: Giọng đáp điều lệnh
    ngắn gọn, chuẩn mực.: modality_and_logic: Bảo toàn lời thưa ngắn gọn của cấp dưới.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000274
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000274: terms: [''con quái vật'',
    ''tư lệnh quân đoàn'', ''pháp sư'']: pronouns_and_address: Tuân thủ `DEC-P01-001`
    và `chapter6_b09_coordinator_choices`: trần thuật quy chiếu vị tư lệnh quân đoàn
    bằng `ông` và quy chiếu Tanya bằng `nó`.: pov_and_voice: Giọng trần thuật từ điểm
    nhìn của vị tư lệnh quân đoàn—một quân nhân bình thường cảm thấy xa lạ trước các
    pháp sư.: modality_and_logic: Bảo toàn nỗ lực tránh nhìn thẳng vào con quái vật
    đang đứng nghiêm trước mặt, sự chấp nhận tiếp chuyện vì công việc, và mức độ đánh
    giá mạnh rằng dưới góc nhìn người bình thường thì pháp sư quả thực rất xa lạ.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000275
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000275: terms: [''ma pháp'', ''lý
    trí'']: pronouns_and_address: Quy chiếu các pháp sư nói chung bằng `Họ`, và vị
    tư lệnh quân đoàn bằng `ông`.: pov_and_voice: Giọng phân tích tâm lý của một người
    bình thường khi đối diện trực tiếp với năng lực siêu nhiên của pháp sư.: modality_and_logic:
    Bảo toàn định nghĩa về pháp sư (những con người có thể tự bay và dùng ma pháp
    can thiệp vào thế giới) và sự lệch pha giữa nhận thức lý trí với cảm xúc khi giáp
    mặt ngoài đời.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000276
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000276: terms: [''thiếu tá'']:
    pronouns_and_address: Trần thuật quy chiếu vị tư lệnh bằng `ông`, quy chiếu Tanya
    bằng `vị thiếu tá trước mặt` và đại từ `nó` (`DEC-P01-001`), và chuyển đại từ
    ngôi thứ hai phiếm chỉ sang `người ta` (`direct-address choice`).: pov_and_voice:
    Giọng trần thuật sắc lạnh, khắc họa sự rợn ngợp của vị tư lệnh trước ánh mắt phi
    nhân tính đối lập với gương mặt xinh xắn của Tanya.: modality_and_logic: Bảo toàn
    đủ 3 câu: khẳng định chắc chắn rằng không thể dùng lý trí hay cảm xúc của bất
    kỳ ai để hiểu nguyên tắc hành động của vị thiếu tá trước mặt -> đôi mắt lạnh như
    vật vô tri khiến người ta buộc phải kết luận suy nghĩ, khuôn khổ tư duy và cách
    tồn tại của nó đều méo mó -> sự đối lập giữa đôi mắt xanh, gương mặt xinh xắn
    có lẽ tạo ấn tượng dịu dàng với cảm xúc trong đôi mắt ấy nói lên tất cả và khiến
    nó trông khác hẳn.: emphasis: Bảo toàn chính xác hai từ nhấn mạnh theo `DEC-P01-002`
    tương ứng hai thẻ `<html:em>` trong nguồn: `*hay*` và `*bất kỳ ai*`, không nhấn
    mạnh lan sang phần khác.'
  non_canon: true
