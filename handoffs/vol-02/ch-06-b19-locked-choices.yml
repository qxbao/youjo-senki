    trong lộ ra thì thả bom cháy vào -> để lửa không tắt, tiếp tục dùng thuốc nổ mạnh/đạn
    nổ mạnh phá vỡ các tòa nhà nhằm tạo luồng gió giúp đám cháy lan rộng.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000591
