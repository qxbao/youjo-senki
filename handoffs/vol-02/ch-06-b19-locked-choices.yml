- segment_id: YS-LN02/Text/part0030.xhtml/p000584
  kind: terminology_and_voice
  value: 'terms=[''binh lính'', ''lá chắn'', ''tiêu diệt kẻ địch'', ''giải cứu''];
    pronouns_and_address=Trần thuật gián tiếp tự do nối tiếp suy luận của Grantz ở
    `p000583`, không dùng đại từ nhân xưng.; pov_and_voice=Giọng suy diễn hợp lý hóa
    quyết định ưu tiên nhiệm vụ giải cứu của cấp trên.; modality_and_logic=Bảo toàn
    quan hệ điều kiện - kết luận: binh lính là lá chắn của người dân trong nước ->
    vì vậy nếu câu hỏi đặt ra là ưu tiên tiêu diệt kẻ địch hay thực hiện giải cứu,
    thì ưu tiên phải là giải cứu.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000585
  kind: terminology_and_voice
  value: 'terms=[''chuẩn mực giá trị'', ''cuộc oanh kích'']; pronouns_and_address=Trần
    thuật theo góc nhìn của Grantz quy chiếu Tanya (`Tanya` / `cô`) và toàn đội giải
    cứu là `họ`.; pov_and_voice=Giọng nhận định nhẹ nhõm của Grantz về kết quả giải
    cứu trước giờ pháo kích.; modality_and_logic=Bảo toàn đủ 3 câu: xem ra đây là
    vấn đề về chuẩn mực giá trị -> nói cách khác, cô/Tanya thật sự không ngại đánh
    đổi việc lấy mạng một kẻ địch để cứu mạng một người đồng bào -> nhờ thế, dù chỉ
    trong khoảng thời gian ngắn ngủi trước khi cuộc oanh kích bắt đầu, họ vẫn cứu
    được một số người bị giam giữ trong thành phố.; emp'
- segment_id: YS-LN02/Text/part0030.xhtml/p000586
