choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000049: terms: [''quân tiếp viện
    (backup)'']: pronouns_and_address: [''Tự sự hồi tưởng ngôi thứ nhất số nhiều `chúng
    tôi` nối tiếp trực tiếp từ p000048.'']: pov_and_voice: Tự sự hồi tưởng ngôi thứ
    nhất của người cựu binh thuộc tổ súng máy.: modality_and_logic: Giữ quan hệ hệ
    quả `Vì vậy` và mức độ mong mỏi khẩn cấp `càng sớm càng tốt`.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000050: terms: [''quân tiếp viện
    (reinforcements)'']: pronouns_and_address: [''Lời lẩm bẩm dùng `Tôi` và `chúng
    ta`; lời kể hồi tưởng dùng `tôi` và `anh chàng bên cạnh`.'']: pov_and_voice: Lời
    thoại lẩm bẩm xen lẫn câu hỏi tự vấn trong hồi ức của người cựu binh.: modality_and_logic:
    Giữ nguyên độ bất định về người nói câu lẩm bẩm (`Không biết người lẩm bẩm câu
    đó là tôi hay anh chàng bên cạnh? Đến giờ tôi vẫn không rõ`) đối lập với sự chắc
    chắn về sự việc (`nhưng chắc chắn có người đã nói`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000051: terms: [''người lính điện
    đài (radio operator / operators)'', ''liên lạc của địch (enemy transmissions)'']:
    pronouns_and_address: [''Dùng `tôi` và `chúng tôi`; quy chiếu những người lính
    điện đài bằng `họ` và quân địch bằng `chúng`.'']: pov_and_voice: Tự sự hồi tưởng
    ngôi thứ nhất.: modality_and_logic: Giữ chức năng kép của lính điện đài (theo
    dõi liên lạc địch và bảo đảm địch không định vị được đơn vị), cùng sự đối lập
    giữa thông lệ (`Thường thì họ chỉ toàn báo tin xấu`) và chiêm nghiệm về sau (`nhưng
    về sau, tôi đã nghĩ đi nghĩ lại rằng đôi khi họ cũng mang đến cho chúng tôi tin
    tốt`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000052: terms: [''Quân tiếp viện
    (Reinforcements)'']: pronouns_and_address: []: pov_and_voice: Tiếng hét báo tin
    mừng của người lính điện đài.: modality_and_logic: Giữ nguyên tiếng hô lặp `“Quân
    tiếp viện! Quân tiếp viện đến rồi!”`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000053: terms: [''người lính điện
    đài (the operator)'', ''bị sốc vì pháo kích (shell-shocked)'']: pronouns_and_address:
    [''Dùng `Tôi` và `chúng tôi`; quy chiếu người lính điện đài bằng `anh ta`.'']:
    pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic: Khóa cụm `bị
    sốc vì pháo kích` theo B03-F08 (phản ánh suy đoán của mọi người về sự hoảng loạn
    tinh thần của lính điện đài chứ không khẳng định chấn thương thể chất) và bước
    ngoặt bất ngờ ngay sau đó.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000054: pronouns_and_address: [''Dùng
    `chúng tôi`; tân ngữ `nó` quy chiếu hiện tượng ở câu trước.'']: pov_and_voice:
    Tự sự hồi tưởng ngôi thứ nhất tự đính chính giác quan tiếp nhận.: modality_and_logic:
    Giữ nguyên câu đính chính ngắn gọn `Hay đúng hơn là chúng tôi nghe thấy nó.`.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000055: terms: [''Tổ quốc (Fatherland)'']:
    pronouns_and_address: []: pov_and_voice: Thông điệp mật khẩu phát qua vô tuyến
    trên toàn vùng.: modality_and_logic: Khóa câu mật khẩu `“Ôi Tổ quốc thân yêu,
    hãy bình yên.”` đồng bộ hoàn toàn với p000060.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000056: terms: [''mọi kênh (every
    channel)'', ''binh sĩ bình thường (regular soldier)'', ''năng lực ma pháp (magic
    ability)'']: pronouns_and_address: []: pov_and_voice: Tự sự hồi tưởng ngôi thứ
    nhất.: modality_and_logic: Giữ cấu trúc mức độ tăng tiến (`mạnh đến mức ngay cả
    một binh sĩ bình thường không có năng lực ma pháp cũng nghe thấy`).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000057: terms: [''chiến trường
    (battlefield)'']: pronouns_and_address: []: pov_and_voice: Tự sự hồi tưởng ngôi
    thứ nhất.: modality_and_logic: Giữ sự tương phản mạnh giữa khung cảnh chiến trường
    hỗn loạn mù mịt bụi bùn với giọng nói `bình thản đến lạ`.: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000058: pronouns_and_address: [''Dùng
    `chúng tôi` kết hợp đại từ phản thân `mình`.'']: pov_and_voice: Tự sự hồi tưởng
    ngôi thứ nhất.: modality_and_logic: Giữ câu hỏi nội tâm gián tiếp (`tự hỏi liệu
    mình cũng phát điên rồi chăng`) nối với nghi vấn về người lính điện đài ở p000053.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000059: terms: [''mật mã (code)'',
    ''đơn vị quân tiếp viện (unit of reinforcements)'', ''quân chi viện (backup)'',
    ''ảo giác thính giác (auditory hallucination)'']: pronouns_and_address: [''Dùng
    `Chúng tôi`.'']: pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic:
    Giữ sự hoài nghi ban đầu (`nghĩ rằng quân chi viện không thể nào có thật, hẳn
    chỉ là ảo giác thính giác`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000060: terms: [''Tổ quốc (Fatherland)'']:
    pronouns_and_address: []: pov_and_voice: Thông điệp mật khẩu phát lặp lại qua
    vô tuyến.: modality_and_logic: Khóa câu mật khẩu lặp lại nguyên văn từ p000055:
    `“Ôi Tổ quốc thân yêu, hãy bình yên.”`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000061: terms: [''ngôn ngữ chính
    thức của Đế quốc (official language of the Empire)'', ''mật khẩu dùng một lần
    (single-use password)'']: pronouns_and_address: [''Dùng `chúng tôi`; quy chiếu
    đơn vị phát tín hiệu bằng `họ`.'']: pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất
    chuyển từ hoài nghi sang vỡ òa xác nhận.: modality_and_logic: Giữ cấu trúc phủ
    định kép đầu câu (`không nghe nhầm, cũng chẳng phát điên`) và thông tin then chốt
    `mật khẩu dùng một lần để chứng minh họ là bạn chứ không phải địch!`.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000062: terms: [''Những người bảo
    vệ Rhine (Guardians of the Rhine)'']: pronouns_and_address: [''Dùng đại từ ngôi
    thứ hai số nhiều `Các anh` cho các vế xướng đáp.'']: pov_and_voice: Lời đáp mật
    khẩu vang dội từ hầm vô tuyến dưới mặt đất.: modality_and_logic: Khóa cụm `Những
    người bảo vệ Rhine` (giữ nguyên địa danh `Rhine` không tự thêm `sông`) theo `vol02-ch05-b03-guardians-of-rhine`
    (B03-F05) và giữ nguyên bốn vế lặp nhịp nhàng.: emphasis: Khóa nhấn mạnh toàn
    bộ câu thoại `*“Những người bảo vệ Rhine! Các anh trung thành! Các anh là đá tảng!
    Các anh trung thành! Các anh là đá tảng!”*` theo đúng thẻ `<em>` duy nhất trong
    nguồn của batch (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000063: terms: [''Người lính điện
    đài (The operator)'', ''hầm vô tuyến (radio dugout)'', ''máy vô tuyến (radio)'',
    ''đội súng máy (machine-gun squad)'']: pronouns_and_address: [''Dùng `tôi`.'']:
    pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic: Giữ mức cực
    cấp của cảm xúc (`âm thanh vui sướng nhất tôi từng nghe`) và dấu ấn ký ức vĩnh
    viễn (`sẽ mãi khắc sâu vào tai tôi`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000064: terms: [''mật mã (codes)'',
    ''những người lính điện đài (The radio operators)'', ''Màn nhiễu sóng trên diện
    rộng (The widespread interference)'', ''pháp sư (mages)'', ''những pháp sư tinh
    nhuệ của Lục quân Đế quốc (the elite mages of the Imperial Army)'']: pronouns_and_address:
    [''Dùng `Chúng tôi`, `tôi`, `tất cả chúng tôi`; quy chiếu người đặt mật mã và
    các lính điện đài bằng `họ`, quy chiếu các mật mã bằng `chúng`.'']: pov_and_voice:
    Tự sự hồi tưởng ngôi thứ nhất khép lại góc nhìn của người lính dưới chiến hào.:
    modality_and_logic: Giữ sự đối lập giữa thái độ chế giễu thường ngày với niềm
    an ủi thực sự ở thời khắc sinh tử (`nhưng lần này, chỉ lần này thôi, tôi nghĩ
    tất cả chúng tôi đều thật sự được an ủi bởi chúng`), cùng ba câu khẳng định dồn
    dập xác nhận lực lượng pháp sư tinh nhuệ của Lục quân Đế quốc.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000065: terms: [''những vị cứu
    tinh (their saviors)'', ''quân tiếp viện (their reinforcements)'', ''đồng minh
    (allies)'']: pronouns_and_address: [''Bước chuyển từ ngôi thứ nhất của người cựu
    binh sang lời kể khách quan quy chiếu những người lính dưới hào bằng `họ` kết
    hợp sở hữu phản thân `của mình`.'']: pov_and_voice: Trần thuật ngôi thứ ba toàn
    tri tạo nghịch lý kịch tính trước khi chuyển sang góc nhìn của Tanya.: modality_and_logic:
    Giữ nguyên nghịch lý trớ trêu (`Thật may là họ không biết những vị cứu tinh, quân
    tiếp viện của mình lại nguy hiểm đến thế, có thể giáng sự hủy diệt hoàn toàn lên
    chính đồng minh.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000066: terms: [''giới chỉ huy
    cấp cao của Lục quân Đế quốc (the Imperial Army brass)'', ''thần chết (a god of
    death)'', ''tiểu đoàn (battalion)'', ''những kẻ cuồng chiến tranh (war nuts)'']:
    pronouns_and_address: [''Khóa đại từ trần thuật ngôi thứ ba `Nó` / `nó` cho Tanya
    theo DEC-P01-001 và B03-F01; quy chiếu những người lính dưới mặt đất và tiểu đoàn
    pháp sư bằng `họ`.'']: pov_and_voice: Trần thuật ngôi thứ ba giới thiệu Tanya
    và tiểu đoàn pháp sư của nó.: modality_and_logic: Khóa hai lựa chọn đã nghiệm
    thu: (1) `giới chỉ huy cấp cao của Lục quân Đế quốc` theo `vol02-ch05-b03-brass`
    (B03-F07); (2) cấu trúc song song `Đó là một tiểu đoàn dành cho những kẻ cuồng
    chiến tranh, do chính những kẻ cuồng chiến tranh lập nên; họ đã có mặt trên chiến
    trường.` theo B03-F09.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000067: terms: [''Thiếu tá Tanya
    von Degurechaff (Major Tanya von Degurechaff)'', ''đơn vị phản ứng nhanh (response
    unit)'', ''Vùng nhận dạng phòng không Rhine, phân khu D-5 (Rhine Air Defense Identification
    Zone Sector D-5)'']: pronouns_and_address: [''Trần thuật ngôi thứ ba dùng `nó`
    và danh xưng đầy đủ `Thiếu tá Tanya von Degurechaff` kết hợp phản thân `của mình`.'']:
    pov_and_voice: Trần thuật ngôi thứ ba mở đầu phân cảnh điểm nhìn của Tanya (sau
    `space-break1`).: modality_and_logic: Khóa địa chỉ tác chiến hai cấp `Vùng nhận
    dạng phòng không Rhine, phân khu D-5` theo `vol02-ch05-b03-air-defense-identification-zone`
    (B03-F02, B03-F05) và sự đối lập giữa nội tâm với vẻ mặt (`trong lòng chán ngấy
    mọi chuyện nhưng ngoài mặt vẫn trơ như không`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000068: terms: [''Mật mã (Code)'',
    ''Tiểu đoàn Pháp sư Trên không số 203 (203rd Aerial Mage Battalion)'', ''hô hiệu
    Pixie (call sign Pixie)'']: pronouns_and_address: [''Tanya đại diện đơn vị báo
    danh qua vô tuyến bằng `Chúng tôi`.'']: pov_and_voice: Thông báo vô tuyến tác
    chiến ngắn gọn, chuẩn xác của Tanya.: modality_and_logic: Khóa tên đơn vị `Tiểu
    đoàn Pháp sư Trên không số 203` theo `vol02-ch05-b03-203rd-aerial-mage-battalion`
    (B03-F03), định danh `hô hiệu Pixie` theo `vol02-ch05-b03-pixie-call-sign` (B03-F06),
    và thời gian tiếp cận `160 giây`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000069: terms: [''chiến tranh chiến
    hào (trench warfare)'', ''tuyên truyền (propaganda)'']: pronouns_and_address:
    [''Câu 1 trần thuật ngôi thứ ba dùng tên riêng `Tanya`; câu 2 chuyển sang độc
    thoại nội tâm ngôi thứ nhất tự quy chiếu bằng `mình` theo đúng DEC-P01-001 và
    B03-F01.'']: pov_and_voice: Trần thuật ngôi thứ ba chuyển mượt sang độc thoại
    nội tâm ngôi thứ nhất của Tanya.: modality_and_logic: Khóa cấu trúc so sánh bậc
    nhất loại trừ ở câu 2 (`Công việc duy nhất mình ghét hơn là phải tỏ ra duyên dáng
    để phục vụ tuyên truyền.`) theo B03-F01.: emphasis: Không dùng `*...*` (tuân thủ
    DEC-P01-002, không tự đánh dấu nghiêng cho câu nội tâm).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000070: terms: [''rào cản vô hình
    (invisible glass ceiling)'', ''tuyên truyền (propaganda)'', ''chiến tranh chiến
    hào (Trench warfare)'']: pronouns_and_address: [''Độc thoại nội tâm ngôi thứ nhất
    của Tanya dùng nhất quán đại từ `mình`.'']: pov_and_voice: Độc thoại nội tâm ngôi
    thứ nhất thực dụng của Tanya.: modality_and_logic: Giữ nguyên hai lý do khiến
    Tanya chán ghét hai công việc: sự bất lợi về thăng tiến trong cơ chế trọng nam
