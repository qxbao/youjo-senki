choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000566
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000566: terms: [''cụm tập đoàn
    quân tại chỗ'', ''Lục quân Đế quốc'', ''tuyến chiến sự chính'', ''Rhine'', ''tuyến
    tiếp tế'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu Lục quân Đế
    quốc / cụm tập đoàn quân phía bắc bằng đại từ `họ` / `Họ`.: pov_and_voice: Trần
    thuật phân tích chiến lược tiếp nối trực tiếp cuối `ch-05-b21` (`p000565`) về
    tình hình mặt trận phía bắc và gánh nặng hậu cần.: modality_and_logic: Bảo toàn
    đầy đủ 4 câu: chỉ riêng cụm tập đoàn quân tại chỗ đã đủ giúp Lục quân Đế quốc
    chiếm ưu thế áp đảo ở phía bắc nhưng bị thời tiết mùa đông khắc nghiệt cản bước;
    họ không thể rút quân tăng viện cho tuyến chiến sự chính ở Rhine; các tuyến này
    có lẽ sẽ đóng băng đến mùa xuân năm sau; nói cách khác, còn lâu gánh nặng trên
    tuyến tiếp tế từ phía bắc mới nhẹ đi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000567
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000567: terms: [''hải quân'', ''eo
    biển'', ''Cộng hòa'', ''lục quân'', ''Không quân'', ''lực lượng ma thuật'']: pronouns_and_address:
    Trần thuật khách quan dùng danh từ chỉ các quân chủng/lực lượng, không dùng đại
    từ nhân xưng.: pov_and_voice: Trần thuật khách quan nêu sự lệch pha về ưu tiên
    chiến lược giữa hải quân và lục quân Đế quốc.: modality_and_logic: Bảo toàn cả
    2 câu: hải quân đang dần giành ưu thế trên eo biển trước Cộng hòa nhưng hải quân
    và lục quân bất đồng liệu đó có phải điều tốt hay không; không quân và lực lượng
    ma thuật/ma pháp sẵn sàng hỗ trợ bên nào yêu cầu, nhưng mối bận tâm của lục quân
    và hải quân quá khác biệt (xem thêm finding `m1`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000568
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000568: terms: [''hải quân'', ''eo
    biển'', ''hạm đội Cộng hòa'', ''trận hải chiến'', ''chiến dịch đổ bộ đường biển'',
    ''Liên minh Entente'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu
    hải quân Đế quốc bằng đại từ `họ`.: pov_and_voice: Trần thuật phản ánh tham vọng
    tiến công quyết chiến của phía hải quân.: modality_and_logic: Bảo toàn tình thái
    (`Có vẻ`) và chuỗi 3 câu: hải quân nóng lòng muốn đột phá qua eo biển; tham vọng
    của họ là tiêu diệt hạm đội Cộng hòa trong một trận hải chiến; thậm chí họ còn
    đề xuất mở chiến dịch đổ bộ đường biển sau đó, giống như với Liên minh Entente,
    để tiêu diệt hoàn toàn đất nước ấy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000569
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000569: terms: [''Zettour'', ''quyền
    kiểm soát mặt biển'', ''đổ bộ'', ''chiến hào'', ''eo biển'', ''Cộng hòa'', ''Khối
    Thịnh vượng chung'']: pronouns_and_address: Trần thuật ngôi thứ ba bám sát điểm
    nhìn của Zettour, quy chiếu phía Đế quốc bằng `họ`.: pov_and_voice: Phân tích
    chiến lược từ điểm nhìn của Thiếu tướng von Zettour kèm câu hỏi tự vấn cuối đoạn.:
    modality_and_logic: Bảo toàn 4 câu: theo nhận định của Zettour, giành quyền kiểm
    soát mặt biển để đổ bộ có vẻ sẽ giảm thương vong hiệu quả hơn nhiều so với phá
    vỡ chiến hào; vấn đề là độ an toàn của tuyến đường biển; nếu tiến vào eo biển
    giữa Cộng hòa và Khối Thịnh vượng chung, họ phải lo ngại phản ứng của Khối Thịnh
    vượng chung vốn chỉ trung lập trên danh nghĩa; và câu hỏi liệu quốc gia ấy có
    chỉ đứng yên quan sát không.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000570
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000570: terms: [''Thiếu tướng von
    Rudersdorf'', ''eo biển'', ''Khối Thịnh vượng chung'', ''cán cân quyền lực'',
    ''“Dự đoán về hình thái và chiều hướng của cuộc chiến hiện tại”'', ''“Lý thuyết
    chiến tranh tổng lực”'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu
    Zettour bằng `Ông` (tuân thủ giới hạn của `DEC-P01-001`), định danh `Thiếu tướng
    von Rudersdorf`, và quy chiếu hai vị tướng bằng `Cả hai`.: pov_and_voice: Trần
    thuật ngôi thứ ba điểm nhìn Zettour nhắc lại cuộc thảo luận với Rudersdorf và
    hai bài nghiên cứu chiến lược từng gây chấn động ở Bộ Tổng Tham mưu (Tập 1 Chương
    4).: modality_and_logic: Bảo toàn cả 3 câu: Zettour đã bàn những câu hỏi này với
    Thiếu tướng von Rudersdorf; cả hai buộc phải kết luận nếu tiến vào eo biển thì
    Khối Thịnh vượng chung có lẽ sẽ can thiệp để duy trì cán cân quyền lực; nếu chuyện
    đó xảy ra, những nỗi sợ từng lan truyền trong văn phòng qua hai chuyên luận trên
    sẽ trở thành sự thật (xem thêm finding `m2`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000571
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000571: terms: [''*chiến tranh
    thế giới*'', ''phản ứng dây chuyền'', ''mặt trận'', ''Rhine'']: pronouns_and_address:
    Trần thuật ngôi thứ ba quy chiếu phía Đế quốc bằng `họ`.: pov_and_voice: Nhận
    định chiến lược đầy ám ảnh trong tâm trí Zettour và Rudersdorf.: modality_and_logic:
    Bảo toàn 3 câu: khẳng định khái niệm *chiến tranh thế giới*; sự mở rộng chiến
    tranh sẽ như phản ứng dây chuyền bất tận không thể tránh khỏi; nếu xảy ra, mọi
    mặt trận đều có thể biến thành một kịch bản kiểu Rhine.: emphasis: Bảo toàn chính
    xác cụm `*chiến tranh thế giới*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000572
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000572: terms: [''Quân đội Cộng
    hòa'', ''các tuyến phòng thủ Rhine'', ''Cộng hòa'']: pronouns_and_address: Trần
    thuật ngôi thứ ba quy chiếu phía Đế quốc bằng `họ`.: pov_and_voice: Đánh giá thực
    lực đối phương trên chiến trường Rhine.: modality_and_logic: Bảo toàn thế đối
    lập hai câu: Quân đội Cộng hòa trên các tuyến Rhine là đối thủ rất khó nhằn; tuy
    nhiên, nếu chỉ có mình Cộng hòa thì Đế quốc vẫn còn cơ hội chiến thắng.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000573
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000573: terms: [''đơn vị'', ''Khối
    Thịnh vượng chung'']: pronouns_and_address: Trần thuật ngôi thứ ba dùng đại từ
    sở hữu `của họ` cho phía Đế quốc.: pov_and_voice: Câu hỏi giả định nối tiếp câu
    trả lời mang tính cảnh báo.: modality_and_logic: Bảo toàn câu hỏi giả định (nhưng
    điều gì sẽ xảy ra nếu một số đơn vị của Khối Thịnh vượng chung xuất hiện?) và
    khả năng đảo ngược vị thế ưu thế hiện tại.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000574
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000574: terms: [''Hải quân Đế quốc'',
    ''Hải quân Khối Thịnh vượng chung'', ''tàn quân Hải quân Cộng hòa'', ''hạm đội
    Đế quốc'']: pronouns_and_address: Trần thuật phân tích tương quan lực lượng hải
    quân bằng danh từ riêng chỉ từng hạm đội.: pov_and_voice: Phân tích cán cân hải
    quân giữa ba cường quốc.: modality_and_logic: Bảo toàn quan hệ điều kiện kép:
    khi việc Hải quân Đế quốc có chặn nổi Hải quân Khối Thịnh vượng chung hay không
    còn đáng ngờ, nếu tàn quân Hải quân Cộng hòa tham gia thêm, hạm đội Đế quốc chỉ
    riêng việc tự vệ thôi đã là quá sức (xem thêm finding `m2`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000575
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000575: terms: [''Đế quốc'', ''Dacia'',
    ''Liên minh Entente'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu
    phía Đế quốc bằng `họ`.: pov_and_voice: Phân tích áp lực thời gian đối với sức
    chịu đựng của Đế quốc.: modality_and_logic: Bảo toàn cả 3 câu: dĩ nhiên họ không
    thể khoanh tay ngồi yên quá lâu; nếu chần chừ hành động thì ngay cả Đế quốc cũng
    sẽ hụt hơi; khi ấy họ sẽ đánh mất những hiệu quả/lợi thế chiến lược đạt được từ
    việc hạ gục Dacia và Liên minh Entente.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000576
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000576: terms: [''Khối Thịnh vượng
    chung'', ''cường quốc'', ''tình thế tiến thoái lưỡng nan'']: pronouns_and_address:
    Trần thuật câu đầu dùng `Họ`; câu hỏi nội tâm in nghiêng lược chủ ngữ (`chúng
    ta`) tự nhiên trong tiếng Việt.: pov_and_voice: Trần thuật chuyển thẳng vào câu
    hỏi độc thoại nội tâm thể hiện sự bế tắc chiến lược.: modality_and_logic: Bảo
    toàn câu trần thuật (không thể chịu nổi ý nghĩ bị Khối Thịnh vượng chung hay một
    cường quốc xen ngang nào khác đánh tạt sườn) và câu hỏi nội tâm in nghiêng về
    thế tiến thoái lưỡng nan.: emphasis: Bảo toàn chính xác câu hỏi thứ hai trong
    `*...*` (`*Phải làm sao với tình thế tiến thoái lưỡng nan này đây?*`) tương ứng
    thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000577
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000577: terms: [''các tuyến tiếp
    tế'', ''tình thế nan giải'']: pronouns_and_address: Trần thuật ngôi thứ ba quy
    chiếu phía Đế quốc / các tướng lĩnh bằng `họ`.: pov_and_voice: Trần thuật chỉ
    rõ tử huyệt hậu cần trong thế giằng co hiện tại.: modality_and_logic: Bảo toàn
    cả 2 câu: ngày càng rõ là nếu cứ cam chịu tình hình hiện tại, bất kỳ sự cố nào
    ảnh hưởng đến các tuyến tiếp tế cũng có thể dẫn tới thảm họa; đó chính là tình
    thế nan giải gây bức bối cho họ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000578
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000578: terms: [''Đại Đế quốc'',
    ''những vùng đất lịch sử'', ''các tranh chấp lãnh thổ'']: pronouns_and_address:
    Trần thuật lịch sử địa chính trị dùng danh xưng `Đại Đế quốc` và phản thân `của
    mình`.: pov_and_voice: Trần thuật khái quát định mệnh địa chính trị của Đế quốc
    từ buổi lập quốc.: modality_and_logic: Bảo toàn quan hệ nhượng bộ – nhân quả:
    từ khi lập quốc, Đại Đế quốc đã giành được những vùng đất lịch sử của mình nhưng
    cũng luôn bị các tranh chấp lãnh thổ bủa vây, nên chẳng bao giờ thiếu mồi lửa
    cho cuộc chiến tiếp theo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000579
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000579: terms: []: pronouns_and_address:
    Trần thuật ngôi thứ ba quy chiếu các sĩ quan trong phòng họp bằng `họ` và `những
    người có mặt ở đó`.: pov_and_voice: Trần thuật chuyển mạch từ nỗi khổ tâm chung
    sang những cá nhân có sẵn lời giải trong phòng họp.: modality_and_logic: Bảo toàn
    3 câu: bởi vậy họ mới khổ tâm; người có lời giải đơn giản cho vấn đề thì đâu phải
    chịu khổ; may hay rủi, trong số những người có mặt tại đó lại có người nắm được
    kế hoạch.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000580
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000580: terms: [''Zettour'', ''quân
    nhân'', ''hiện trạng'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu
    Zettour bằng `Zettour` và `Ông`, quy chiếu phía Đế quốc bằng `họ`.: pov_and_voice:
    Trần thuật khắc họa tư duy phòng ngự thực dụng khác thường của Zettour.: modality_and_logic:
    Bảo toàn đầy đủ 4 câu và các cấu trúc phủ định: Zettour biết; ông biết điều duy
    nhất họ cần làm là đừng để thua; đáng ngạc nhiên đối với một quân nhân, Zettour
    tin rằng họ không cần tấn công; nói đơn giản, cứ giữ nguyên hiện trạng là ổn.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000581
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000581: terms: [''Rudersdorf'',
    ''Zettour'', ''chiến hào'', ''cuộc chiến tiêu hao'']: pronouns_and_address: Trần
    thuật ngôi thứ ba quy chiếu Rudersdorf bằng `Rudersdorf` và `Ông` / `ông`, quy
    chiếu phía Đế quốc bằng `họ`.: pov_and_voice: Trần thuật đối chiếu lập trường
    tác chiến chủ động của Rudersdorf với tư duy giữ nguyên hiện trạng của Zettour.:
    modality_and_logic: Bảo toàn trọn vẹn 4 câu: Rudersdorf cũng nhận thức được điều
    đó; ông biết không cần mở những cuộc tiến công lớn vào chiến hào; tuy nhiên khác
    với Zettour, ông không chấp nhận quan niệm cứ duy trì cuộc chiến tiêu hao này
    là ổn; ông mang quyết tâm sáng suốt của một người lính: nếu kiểm soát được tổn
    thất mà vẫn giành chiến thắng thì sao lại không làm?: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000582
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000582: terms: []: pronouns_and_address:
    Trần thuật ngôi thứ ba quy chiếu Zettour và Rudersdorf bằng `cả hai`.: pov_and_voice:
    Câu bản lề mở màn cho phần phát biểu tại cuộc họp.: modality_and_logic: Bảo toàn
    hai hành động nối tiếp: cuối cùng cả hai đều hạ quyết tâm và được phép phát biểu.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000583
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000583: terms: []: pronouns_and_address:
    Trong lời thoại trước hội nghị Bộ Tổng Tham mưu, Zettour tự xưng `Tôi` và dùng
    đại từ gộp `chúng ta`.: pov_and_voice: Lời mở đầu điềm đạm nhưng mang tính bước
    ngoặt của Zettour tại cuộc họp.: modality_and_logic: Bảo toàn lời đề xuất thay
    đổi cách nhìn nhận vấn đề.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000584
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000584: terms: [''Zettour'']: pronouns_and_address:
    Trần thuật ngôi thứ ba dùng `Zettour`, đại từ `ông` và phản thân `mình`.: pov_and_voice:
    Trần thuật miêu tả tâm lý căng thẳng kín đáo của Zettour trước khi nêu kế hoạch
    táo bạo.: modality_and_logic: Bảo toàn cả 2 câu: Zettour không tự coi mình là
    kẻ nhút nhát, nhưng trước tầm quan trọng của điều sắp nói, ngay cả ông cũng thấy
    hồi hộp; giọng ông thoáng chút cứng nhắc nhỏ đến mức hầu như không ai nhận ra,
    nhưng ông vẫn cố nói bình tĩnh hết mức có thể.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000585
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000585: terms: [''Nút thắt Gordian'']:
    pronouns_and_address: Trần thuật ngôi thứ ba dùng đại từ sở hữu `của ông` cho
    Zettour.: pov_and_voice: Trần thuật bình luận sắc lạnh về bản chất đẫm máu của
    kế hoạch mà Zettour sắp đề xuất.: modality_and_logic: Bảo toàn trọn vẹn 3 câu:
    kế hoạch bí mật của ông nhằm tháo gỡ mớ chỉ rối này chỉ bằng một nhát chém sẽ
    vô cùng đẫm máu; nút thắt Gordian suy cho cùng chỉ là chuyện kể; thanh gươm sắc
    thì chém ai cũng sắc như nhau.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000586
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000586: terms: [''học thuyết'',
    ''chuyển đổi mô thức'']: pronouns_and_address: Lời thoại của Zettour dùng đại
    từ gộp `chúng ta` / `Chúng ta`.: pov_and_voice: Lời tuyên bố cốt lõi của Zettour
    đòi hỏi thay đổi tận gốc tư duy quân sự.: modality_and_logic: Bảo toàn cả 2 câu
    và mức độ tình thái (`có lẽ`): với học thuyết và các giá trị hiện có, có lẽ chúng
    ta sẽ không trụ nổi; chúng ta cần một sự chuyển đổi mô thức (`P03-paradigm-shift`).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000587
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000587: terms: [''văn kiện đầu
    hàng'', ''Đế quốc'', ''Dacia'', ''Liên minh Entente'', ''sức mạnh quốc gia'',
    ''đầu hàng hoàn toàn'']: pronouns_and_address: Trần thuật phân tích chiến lược
    quy chiếu kẻ địch bằng `họ` / `đối phương`.: pov_and_voice: Trần thuật diễn giải
    luận điểm chiến tranh tiêu hao hiện đại của Zettour.: modality_and_logic: Bảo
    toàn đầy đủ 3 câu: giành chiến thắng bằng cách công phá thành trì địch rồi buộc
    ký văn kiện đầu hàng nay đã bất khả thi; trừ những trường hợp chênh lệch quốc
    lực áp đảo như Đế quốc với Dacia hay Liên minh Entente, sẽ rất khó đòi hỏi đầu
    hàng hoàn toàn; nhìn vào cuộc chiến khủng khiếp hiện tại, cảnh đổ máu có vẻ sẽ
    phải tiếp diễn cho đến khi một trong hai cường quốc/một bên không thể chịu đựng
    thêm nữa (xem thêm finding `m3`).: emphasis: none'
  non_canon: true
