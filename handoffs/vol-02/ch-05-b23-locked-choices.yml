choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000588
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000588: terms: []: pronouns_and_address:
    Lời thoại của Zettour trước cuộc họp dùng câu mệnh lệnh và lược chủ ngữ đại từ
    gộp tự nhiên trong tiếng Việt.: pov_and_voice: Lời phát biểu điềm tĩnh, sắc lạnh
    của Thiếu tướng von Zettour tiếp nối trực tiếp `ch-05-b22` (`p000586`–`p000587`).:
    modality_and_logic: Bảo toàn cấu trúc mệnh lệnh đối lập (`Đừng nhắm tới chiến
    thắng, hãy tránh thất bại`) và điều kiện phủ định (`Nếu không làm được vậy, sẽ
    rất khó để trở thành kẻ trụ lại sau cùng`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000589
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000589: terms: [''Tướng von Zettour'',
    ''bộ phận Tác chiến'', ''cuộc tấn công'']: pronouns_and_address: Thành viên bộ
    phận Tác chiến gọi `Tướng von Zettour` và xưng hô kính trọng `ngài`; trần thuật
    quy chiếu Zettour bằng `ông` và các sĩ quan trong phòng bằng `Họ`.: pov_and_voice:
    Đối thoại tại cuộc họp kết hợp trần thuật ngôi thứ ba điểm nhìn Zettour.: modality_and_logic:
    Bảo toàn câu hỏi xác nhận đầy bối rối của sĩ quan Tác chiến về việc Zettour có
    phản đối cuộc tấn công hay không, cùng nhận định rằng tư duy của họ chỉ dừng lại
    ở mức đó (xem thêm finding `m1`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000590
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000590: terms: [''lẽ thường'',
    ''kẻ địch'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu các sĩ quan
    tham mưu bằng `họ`.: pov_and_voice: Trần thuật phân tích điểm nhìn Zettour đối
    với tư duy quân sự thông thường của bộ tham mưu.: modality_and_logic: Bảo toàn
    trọn vẹn 3 câu và tình thái (`có lẽ`): không, có lẽ đó là lẽ thường; với họ, tấn
    công là cách đánh bại và giày xéo kẻ địch để kết thúc chiến tranh; nhưng họ đã
    nhầm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000591
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000591: terms: [''cuộc tấn công'',
    ''các mục tiêu tác chiến'']: pronouns_and_address: Zettour tự xưng `tôi` và dùng
    đại từ gộp `ta`.: pov_and_voice: Lời đính chính điềm đạm nhưng định hướng lại
    toàn bộ mục tiêu chiến dịch của Zettour.: modality_and_logic: Bảo toàn quan hệ
    nhượng bộ – đối lập: không phản đối mà ủng hộ cuộc tấn công nói chung, nhưng cho
    rằng cần điều chỉnh các mục tiêu tác chiến.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000592
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000592: terms: [''mục tiêu'']:
    pronouns_and_address: Câu hỏi ngắn không dùng đại từ nhân xưng.: pov_and_voice:
    Câu hỏi phản ứng tức thì của cử tọa trong phòng họp.: modality_and_logic: Bảo
    toàn câu hỏi ngắn gọn xác nhận lại ý thay đổi mục tiêu.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000593
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000593: terms: [''Zettour'']: pronouns_and_address:
    Trần thuật ngôi thứ ba định danh `Zettour`.: pov_and_voice: Nhận xét nội tâm ngắn
    gọn tiếp nối trần thuật về phát ngôn gây sốc của Zettour.: modality_and_logic:
    Bảo toàn câu cảm nhận hai chiều (`*Nói tiếp đi—không, thôi.*`), nhận định rằng
    câu hỏi vừa rồi có thể mang cả hai hàm ý đó, và cách Zettour đáp trả thẳng thừng
    gây chấn động như thả một quả bom.: emphasis: Bảo toàn chính xác `*Nói tiếp đi—không,
    thôi.*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000594
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000594: terms: [''chiến dịch'',
    ''chọc thủng phòng tuyến'', ''kế hoạch tấn công'', ''binh sĩ địch'']: pronouns_and_address:
    Lời thoại của Zettour dùng đại từ sở hữu gộp `của ta`.: pov_and_voice: Lời tuyên
    bố cốt lõi của Zettour chuyển mục tiêu từ đột phá tuyến phòng ngự sang tiêu hao
    sinh lực địch.: modality_and_logic: Bảo toàn đầy đủ 3 câu: mục tiêu của chiến
    dịch không nên là chọc thủng phòng tuyến; mà phải là khiến địch đổ máu; nói cách
    khác, kế hoạch tấn công của ta phải nhằm bào mòn càng nhiều binh sĩ địch càng
    tốt.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000595
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000595: terms: [''quân địch'']:
    pronouns_and_address: Câu kết luận khái quát không dùng đại từ.: pov_and_voice:
    Mệnh đề tóm tắt sắc gọn trong mạch suy nghĩ của Zettour.: modality_and_logic:
    Bảo toàn cấu trúc `Kết luận: Làm kiệt quệ quân địch.`: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000596
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000596: terms: [''khiến địch đổ
    máu đến kiệt quệ'']: pronouns_and_address: Lời thoại hồi tưởng dùng đại từ gộp
    `Chúng ta` và quy chiếu quân địch bằng `chúng`.: pov_and_voice: Câu nói của Tanya
    Degurechaff trong ký ức của Zettour.: modality_and_logic: Bảo toàn trọn vẹn hai
    vế hành động: tiến hành rút máu/khiến địch đổ máu triệt để và nghiền nát khả năng
    tiếp tục chiến đấu của chúng.: emphasis: Bảo toàn chính xác toàn bộ câu thoại
    hồi tưởng trong `*“...”*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000597
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000597: terms: [''Degurechaff'']:
    pronouns_and_address: Danh ngữ ngắn định danh `Degurechaff`.: pov_and_voice: Nhịp
    ngắt xác nhận nguồn gốc câu nói vừa trích dẫn trong tâm trí Zettour.: modality_and_logic:
    Bảo toàn cụm danh ngữ ngắn `Lời Degurechaff.`: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000598
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000598: terms: [''thư viện trường
    quân sự'', ''Degurechaff'']: pronouns_and_address: Trần thuật ngôi thứ ba bám
    sát điểm nhìn của Zettour: quy chiếu Zettour bằng `Ông` / `ông` và phản thân `mình`
    (tuân thủ giới hạn của `DEC-P01-001`), quy chiếu Tanya từ góc nhìn khách quan
    của Zettour bằng `cô lính trẻ`, `cô` và `Cô bé Degurechaff ấy`.: pov_and_voice:
    Hồi tưởng của Zettour về cuộc trò chuyện tại thư viện kết thúc bằng câu hỏi nội
    tâm kinh ngạc.: modality_and_logic: Bảo toàn đầy đủ 4 câu: ông vẫn nhớ từng lời
    cô lính trẻ nói với mình trong thư viện trường quân sự; cú sốc khi nghe cô nói
    thản nhiên về một thế giới khủng khiếp như thế thật khó quên; giờ mọi việc diễn
    ra đúng như cô đã nói khiến ông càng kinh ngạc; và câu hỏi nội tâm cuối đoạn (xem
    thêm finding `m1`).: emphasis: Bảo toàn chính xác `*Cô bé Degurechaff ấy đã dự
    đoán được đến đâu?*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000599
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000599: terms: []: pronouns_and_address:
    Câu nhận định khái quát không dùng đại từ.: pov_and_voice: Nhận định lý luận quân
    sự từ điểm nhìn Zettour.: modality_and_logic: Bảo toàn mệnh đề khẳng định rằng
    dự đoán tương lai của một cuộc chiến là việc vô cùng khó khăn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000600
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000600: terms: [''lẽ thường'',
    ''nguyên tắc chiến tranh'', ''chiến trường'']: pronouns_and_address: Trần thuật
    và độc thoại nội tâm dùng danh từ chung `binh sĩ`, `người` và đại từ `chúng` (quy
    chiếu những thay đổi).: pov_and_voice: Nhận định quy luật chiến tranh chuyển sang
    cảm thán nội tâm của Zettour.: modality_and_logic: Bảo toàn cả 2 câu: quy luật
    bất biến duy nhất là lẽ thường có thể đổi khác trong chớp mắt và một nguyên tắc
    chiến tranh mới có thể làm chủ chiến trường; rất ít binh sĩ thích ứng nổi với
    những thay đổi ấy, nên nghĩ tới việc có người dự đoán được chúng thì thật đáng
    kinh ngạc.: emphasis: Bảo toàn chính xác cấu trúc nhấn mạnh đảo ngược của nguồn
    (hai cụm in nghiêng kẹp chữ `dự đoán` để thường ở giữa: `*Rất ít binh sĩ có thể
    thích ứng với những thay đổi ấy, nên nghĩ rằng lại có người* dự đoán *được chúng
    thì…!*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000601
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000601: terms: []: pronouns_and_address:
    Zettour dùng đại từ gộp `chúng ta` và quy chiếu quân địch bằng `chúng`.: pov_and_voice:
    Lời chốt luận điểm đanh thép của Zettour trước cuộc họp.: modality_and_logic:
    Bảo toàn cả 2 câu: nói cách khác, chúng ta sẽ khiến địch đổ máu cho đến khi chúng
    gục ngã; đó là cách duy nhất để giải quyết chuyện này.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000602
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000602: terms: []: pronouns_and_address:
    Trần thuật khách quan dùng đại từ bất định `Có người`.: pov_and_voice: Trần thuật
    khắc họa sự im lặng nặng nề trong phòng họp Bộ Tổng Tham mưu.: modality_and_logic:
    Bảo toàn cả 2 câu: có người vô thức xê dịch khiến tiếng ghế kẽo kẹt vang lên to
    khác thường trong căn phòng yên tĩnh; mọi thứ lặng như tờ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000603
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000603: terms: [''Zettour'', ''Degurechaff'']:
    pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu Zettour bằng `Zettour`
    / `ông`, và quy chiếu Degurechaff bằng `Degurechaff` / `cô`.: pov_and_voice: Trần
    thuật nội tâm điềm tĩnh của Zettour khi thấu hiểu thái độ của Tanya.: modality_and_logic:
    Bảo toàn trọn vẹn 3 câu: đối diện sự im lặng đó, Zettour thực ra vẫn bình tĩnh;
    nói chính xác hơn, ông đang đồng cảm với Degurechaff; giờ đây ông cảm nhận được
    rằng cô có thể nói bình thản như vậy ở thư viện ngày ấy là vì cô đã hiểu rõ.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000604
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000604: terms: [''chọc thủng phòng
    tuyến'', ''Khối Thịnh vượng chung'', ''Đế quốc'']: pronouns_and_address: Trần
    thuật ngôi thứ ba quy chiếu Tanya bằng `Cô` và phía Đế quốc bằng `họ`.: pov_and_voice:
    Trần thuật diễn giải nhận thức chiến lược mà Zettour và Tanya cùng nhìn thấy.:
    modality_and_logic: Bảo toàn đầy đủ 4 câu và các mệnh đề điều kiện/nhượng bộ:
    cô hiểu cái giá để chọc thủng phòng tuyến sẽ quá đắt; dù có làm được thì tổn thất
    cũng rất nặng nề; và nếu Khối Thịnh vượng chung lo ngại chiến sự xấu đi mà quyết
    định can thiệp, Đế quốc sẽ bị đẩy bật trở lại; đó sẽ là kết cục tồi tệ nhất có
    thể xảy ra với Đế quốc.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000605
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000605: terms: [''ý chí chiến đấu'',
    ''binh sĩ'']: pronouns_and_address: Trần thuật ngôi thứ ba lược chủ ngữ `họ` ở
    mệnh đề điều kiện và giữ chủ ngữ `ý chí chiến đấu của binh sĩ` ở mệnh đề chính.:
    pov_and_voice: Phân tích hệ quả tâm lý chiến trường nếu cố cưỡng bức đột phá.:
    modality_and_logic: Bảo toàn câu điều kiện giả định: nếu đổ ngần ấy máu không
    những vô ích mà còn đẩy tình thế theo hướng sai lầm/bất lợi, ý chí chiến đấu của
    binh sĩ sẽ sụp đổ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000606
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000606: terms: [''phá vỡ phòng
    tuyến'', ''kẻ địch'']: pronouns_and_address: Độc thoại nội tâm của Zettour dùng
    đại từ ngôi thứ nhất (`tôi`); câu hỏi tu từ cuối đoạn lược chủ ngữ.: pov_and_voice:
    Độc thoại nội tâm của Zettour chuyển từ nguyên tắc chỉ huy sang ý tưởng bẫy quân
    địch tự tiêu hao.: modality_and_logic: Bảo toàn đầy đủ 3 câu: hai câu đầu in nghiêng
    khẳng định không thể đẩy những người lính trong tình trạng ấy quay lại đột phá
    phòng tuyến lần nữa vì ra lệnh như vậy chỉ dẫn đến thêm tổn thất vô ích; câu thứ
    ba để thường đặt câu hỏi vậy sao không để kẻ địch mắc sai lầm đó (xem thêm finding
    `m2`).: emphasis: Bảo toàn chính xác hai câu đầu trong `*...*` và câu hỏi cuối
    để thường tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000607
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000607: terms: [''Cộng hòa'']:
    pronouns_and_address: Câu độc thoại nội tâm lược chủ ngữ gộp (`Chúng ta`) và quy
    chiếu Cộng hòa bằng `họ`.: pov_and_voice: Ý nghĩ lạnh lùng chốt lại chiến lược
    làm kiệt quệ Cộng hòa của Zettour.: modality_and_logic: Bảo toàn trọn vẹn câu
    nội tâm chờ Cộng hòa tự chết chìm trong chính biển máu của họ.: emphasis: Bảo
    toàn chính xác toàn bộ câu trong `*...*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000608
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000608: terms: [''Zettour'', ''Lục
    quân Đế quốc'', ''tinh thần hiệp sĩ'']: pronouns_and_address: Trần thuật ngôi
    thứ ba định danh `Zettour`; câu nhận định khái quát có đại từ ngôi thứ hai phiếm
    chỉ trong nguồn được dịch bằng đại từ chung `ta` theo quy ước `direct-address
    choice`.: pov_and_voice: Trần thuật đúc kết quan điểm chiến tranh thực dụng triệt
    để của Zettour.: modality_and_logic: Bảo toàn cả 2 câu và cấu trúc đối lập `không
    nằm ở... mà ở...`: Zettour tin đây là lựa chọn khả thi duy nhất cho Lục quân Đế
    quốc; nói cách khác, rốt cuộc chiến tranh không nằm ở những anh hùng hay biểu
    hiện tinh thần hiệp sĩ, mà ở việc ta có thể giết kẻ thù hiệu quả đến đâu.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000609
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000609: terms: [''chiến tranh tổng
    lực'']: pronouns_and_address: Câu nhận định khách quan không dùng đại từ nhân
    xưng.: pov_and_voice: Kết luận tất yếu về hình thái chiến tranh.: modality_and_logic:
    Bảo toàn tính tất yếu: nói cách khác, cuộc xung đột này tất yếu sẽ trở thành chiến
    tranh tổng lực.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000610
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000610: terms: [''binh sĩ và vật
    tư của địch'', ''kế hoạch tấn công'']: pronouns_and_address: Trong lời thoại kết
    thúc phần trình bày, Zettour dùng đại từ gộp `chúng ta` và tự xưng `Tôi` / `tôi`.:
    pov_and_voice: Lời kết phần đề xuất tác chiến trang trọng, dứt khoát của Zettour
    tại hội nghị.: modality_and_logic: Bảo toàn đầy đủ các ý: chúng ta sẽ giáng đòn
    toàn diện vào binh sĩ và vật tư của địch; đề nghị lập kế hoạch tấn công với những
    mục tiêu ấy; và đó là tất cả những gì muốn trình bày lúc này.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000611
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000611: terms: []: pronouns_and_address:
    Câu nội tâm in nghiêng dùng đại từ gộp `chúng ta`; câu trần thuật tiếp theo quy
    chiếu các đồng nghiệp và cấp dưới của Zettour.: pov_and_voice: Độc thoại nội tâm
    của Zettour kết hợp quan sát phản ứng sững sờ trong phòng họp.: modality_and_logic:
    Bảo toàn sắc thái khẳng định tăng tiến (`*Chắc chắn rồi, gần như không còn nghi
    ngờ gì nữa, tương lai của chúng ta đã được định đoạt.*`) và câu trần thuật về
    vẻ mặt đông cứng của các đồng nghiệp cùng cấp dưới.: emphasis: Bảo toàn chính
    xác câu đầu trong `*...*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000612
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000612: terms: []: pronouns_and_address:
    Câu phản ứng không lời dùng ngôi thứ hai `Ông` quy chiếu Zettour và chủ ngữ số
    nhiều `họ`.: pov_and_voice: Trần thuật ngắn khắc họa thông điệp hiện rõ trên gương
    mặt cử tọa.: modality_and_logic: Bảo toàn câu nhận xét ngắn `*Ông điên rồi*, họ
    nói.` (xem thêm finding `m2`).: emphasis: Bảo toàn chính xác `*Ông điên rồi*`
    tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000613
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000613: terms: [''lẽ thường'',
    ''đạo quân dã chiến của địch'', ''cánh cửa xoay'', ''Tổ quốc'']: pronouns_and_address:
    Trần thuật ngôi thứ ba quy chiếu Zettour bằng `ông`; chuỗi câu hỏi nội tâm chung
    của cử tọa lược chủ ngữ và quy chiếu quân địch bằng `chúng`.: pov_and_voice: Trần
    thuật kết hợp tiếng lòng chung đầy choáng váng của các sĩ quan tham mưu trước
    kế hoạch của Zettour.: modality_and_logic: Bảo toàn đầy đủ 5 câu: chiến dịch ông
    đề xuất trái ngược với lẽ thường của hầu hết mọi người; ba câu in nghiêng nêu
    sự sửng sốt (bỏ ngỏ một phần lãnh thổ và ưu tiên tiêu diệt đạo quân dã chiến của
    địch; rồi kết liễu chúng bằng một cánh cửa xoay?; bắt đội quân tồn tại để bảo
    vệ Tổ quốc thực hiện chiến dịch này ư?); và câu kết khẳng định không ai tránh
    khỏi nghĩ đến những điều ấy.: emphasis: Bảo toàn chính xác cả 3 câu ở giữa trong
    một cặp `*...*` duy nhất tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000614
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000614: terms: [''những sĩ quan
    tham mưu'', ''giá trị quân sự'']: pronouns_and_address: Trần thuật ngôi thứ ba
    quy chiếu Zettour bằng `Ông` và các sĩ quan tham mưu bằng `họ`.: pov_and_voice:
    Trần thuật thể hiện niềm tin duy lý của Zettour rằng bộ tham mưu rồi sẽ phải chấp
    nhận kế hoạch.: modality_and_logic: Bảo toàn cả 2 câu và thế loại trừ: sớm muộn
    gì các sĩ quan tham mưu ngồi đó cũng sẽ hiểu không còn con đường nào khác; ông
    không biết là khi nào, nhưng biết họ rồi sẽ chấp nhận kế hoạch vì giá trị quân
    sự của nó, trên mọi phương diện ngoại trừ mặt tình cảm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000615
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000615: terms: [''đạo quân dã chiến
    của địch'', ''Rudersdorf'', ''Zettour'']: pronouns_and_address: Trong thoại, Rudersdorf
    tự xưng `Tôi` và dùng đại từ gộp `chúng ta`; trong trần thuật, quy chiếu Rudersdorf
    bằng `Rudersdorf` / `Ông` và hai vị tướng bằng `họ`.: pov_and_voice: Lời tuyên
    bố ủng hộ dứt khoát của Thiếu tướng von Rudersdorf và trần thuật về quyết tâm
    của ông.: modality_and_logic: Bảo toàn đầy đủ 4 câu: lời đồng tình rằng rõ ràng
    nên tập trung tiêu diệt hoàn toàn đạo quân dã chiến của địch; bất chấp sự do dự
    của những người khác, Rudersdorf dứt khoát tuyên bố ủng hộ mạnh mẽ ý tưởng của
    Zettour; ông biết hậu thế sẽ phán xét họ nghiêm khắc nhưng đã hạ quyết tâm và
    tự tin nêu rõ lập trường.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000616
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000616: terms: [''những kẻ cầm
    đầu'']: pronouns_and_address: Độc thoại nội tâm của Rudersdorf dùng đại từ sở
    hữu/chủ ngữ gộp `chúng ta`.: pov_and_voice: Độc thoại nội tâm bi tráng nhưng thực
    tế của Rudersdorf về trách nhiệm lịch sử của thế hệ chỉ huy.: modality_and_logic:
    Bảo toàn đầy đủ 3 câu: nhận định đây là một thế giới điên rồ nơi những thanh niên
    triển vọng bị đẩy vào các trận tử chiến xem ai rút được nhiều máu đối phương hơn;
    khả năng cao (`rất có thể`) tên họ sẽ bị khắc vào lịch sử như những kẻ cầm đầu;
    và mệnh đề điều kiện (`Nếu đã vậy`) kêu gọi ít nhất hãy cải thiện tình hình đôi
    chút bằng cách tự tay chấm dứt cuộc chiến.: emphasis: Bảo toàn chính xác toàn
    bộ đoạn độc thoại nội tâm trong `*...*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000617
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000617: terms: [''tìm đường thoát
    bằng cách tiến lên'']: pronouns_and_address: Lời thoại của Rudersdorf tự xưng
    `Tôi` / `tôi` và dùng đại từ gộp `Ta`.: pov_and_voice: Giọng điệu hào sảng, quyết
    đoán đặc trưng của Rudersdorf.: modality_and_logic: Bảo toàn trọn vẹn 3 câu: nêu
    ý kiến mở đường tiến lên, nói cách khác kế hoạch tốt nhất chính là tìm đường thoát
    bằng cách tiến lên (`escape forward`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000618
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000618: terms: [''phi lý'', ''quân
    đội'', ''lãnh thổ'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu Rudersdorf
    bằng `ông`.: pov_and_voice: Câu kết lô cô đọng nghịch lý chiến lược của Rudersdorf
    và Zettour.: modality_and_logic: Bảo toàn quan hệ nhân quả (`Vì thế`) và cấu trúc
    đối lập (`nhắm vào quân đội chứ không phải lãnh thổ`) trong lời đề xuất của ông
    (xem thêm finding `m3`).: emphasis: none'
  non_canon: true
