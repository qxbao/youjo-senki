  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000026
  kind: terms
  value: quả cầu; tác nhân gây nhiễu mật độ cao; ma pháp; ECM24
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000026
  kind: modality_and_logic
  value: 'Giữ chuỗi nhân quả: quả cầu chặn phát bắn -> tác nhân gây nhiễu mật độ cao
    tản ra -> cản trở sử dụng ma pháp diện rộng -> giúp bản thân gần như không thể
    bị phát hiện (giữ mức ''gần như'', không biến thành vô hình tuyệt đối); giữ phép
    so sánh bật ECM24 hết công suất kèm số tham chiếu chú thích 24.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000027
  kind: pov
  value: Nhận định của người kể
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000027
  kind: terms
  value: thiết bị quang học
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000027
  kind: modality_and_logic
  value: Giữ tình thái phỏng đoán dè dặt ('Có lẽ') và mức độ ('cực kỳ khó khăn') khi
    dùng thiết bị quang học phát hiện vật thể bay ban đêm.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000028
  kind: pov
  value: Nhận định của người kể
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000028
  kind: terms
  value: ECM
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000028
  kind: modality_and_logic
  value: 'Giữ quan hệ nhân quả và nghịch lý: vì giống ECM nên chính sự nhiễu loạn
    là dấu hiệu rõ rành rành báo hiệu sự hiện diện.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000029
  kind: pov
  value: Ví dụ khái quát ngôi gộp ('ta')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000029
  kind: terms
  value: radar
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000029
  kind: modality_and_logic
  value: 'Giữ câu điều kiện: nếu radar trắng xóa thì hiển nhiên có thứ gì đó ở đó.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000030
  kind: pov
  value: Kết luận chiến thuật của người kể
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000030
  kind: terms
  value: cơ động bí mật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000030
  kind: modality_and_logic
  value: 'Giữ phủ định: tình hình không thích hợp để cơ động bí mật.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000031
  kind: pov
  value: Nhận định chiến thuật của người kể
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000031
  kind: terms
  value: khóa được mục tiêu; tên lửa dẫn đường; hỏa lực được tổ chức bài bản; tấm
    màn tàng hình
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000031
  kind: modality_and_logic
  value: Giữ điều kiện kép (bị phát hiện nhưng đối phương không khóa được mục tiêu),
    phủ định mối đe dọa, hành động xuyên phá tốc độ cao kết hợp quấy rối nhẹ, và ẩn
    dụ tấm màn tàng hình.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000032
  kind: pov
  value: Ngôi thứ nhất tự thuật của Tanya ('tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000032
  kind: modality_and_logic
  value: Giữ tương phản giữa tác dụng phụ nghiêm trọng là nỗi khổ tâm của người kể
    và sự bất lực ('nhưng chẳng thể làm gì được').
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000033
  kind: pov
  value: Thoại mệnh lệnh qua vô tuyến
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000033
  kind: terms
  value: Giai đoạn hai; giai đoạn ba; cơ động theo phương án đã định
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000033
  kind: modality_and_logic
  value: Giữ mốc thời gian ('kết thúc trong chốc lát', 'Cho đến khi có lệnh bước sang
    giai đoạn ba') và chủ thể nhận lệnh ('từng đơn vị').
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000034
  kind: pov
  value: Câu danh ngữ trần thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000034
  kind: terms
  value: thông điệp vô tuyến
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000034
  kind: modality_and_logic
  value: Giữ hình thức câu trần thuật mô tả thông điệp vô tuyến lẫn đầy tạp âm; không
    biến thành lời thoại.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000035
  kind: pov
  value: Trần thuật giải thích kỹ thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000035
  kind: terms
  value: pháp sư; sóng định hướng truyền qua các quả cầu
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000035
  kind: modality_and_logic
  value: Giữ cấu trúc tăng tiến ('Không chỉ được mã hóa, đây còn là...') và hệ quả
    hạn chế thực tế ('chỉ vừa đủ để trao đổi vài lời, nên trên thực tế chỉ phù hợp
    cho liên lạc cần thiết').
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000036
  kind: pov
  value: Trần thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000036
  kind: terms
  value: mật độ ma pháp
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000036
  kind: modality_and_logic
  value: 'Giữ quan hệ nguyên nhân - kết quả: mật độ ma pháp tồn dư cao trong không
    khí gây ra tiếng ồn chói tai.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000037
  kind: pov
  value: Ngôi thứ nhất ('Tôi', 'chúng tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000037
  kind: terms
  value: quan sát viên Quân đội Cộng hòa; lực lượng đoạn hậu
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000037
  kind: modality_and_logic
  value: Giữ thái độ bất mãn, phủ định việc biết vị trí đồng đội, vai trò lực lượng
    đoạn hậu và nhịp tự sửa ('đang nhô ra—hay đúng hơn là xông thẳng—vào lãnh thổ
    địch').
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000038
  kind: pov
  value: Ngôi thứ nhất số nhiều ('Chúng tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000038
  kind: terms
  value: sư đoàn; cụm tập đoàn quân
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000038
  kind: modality_and_logic
  value: Giữ điều kiện mở rộng toàn chiến trường và cơ động quy mô lớn; giữ tương
    phản quy mô khi rút lui dưới màn đêm giữa một sư đoàn và một cụm tập đoàn quân.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000039
  kind: pov
  value: Ngôi thứ nhất ('tôi', 'chúng tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000039
  kind: terms
  value: pháp sư; khu vực Rhine
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000039
  kind: modality_and_logic
  value: Giữ mệnh đề nhượng bộ (nhóm pháp sư xuất sắc cơ động và ứng biến linh hoạt)
    và phủ định khả năng bao quát toàn bộ khu vực Rhine.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000040
  kind: pov
  value: Trần thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000040
  kind: terms
  value: tiểu đoàn tăng cường
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000040
  kind: modality_and_logic
  value: Giữ tách biệt hai thuộc tính ('một tiểu đoàn tăng cường' và 'quân số còn
    thiếu hụt đôi chút') cùng kết luận các phương pháp thông thường là bất khả thi.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000041
  kind: pov
  value: Ngôi thứ nhất số nhiều ('chúng tôi', 'mình') và trần thuật về Bộ Tổng tham
    mưu
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000041
  kind: terms
  value: trinh sát bằng vũ lực; Bộ Tổng tham mưu; Đế quốc
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000041
  kind: emphasis
  value: Giữ đánh dấu nghiêng Markdown *“Đế quốc đang điều chuyển quân nhu và binh
    lính để chuẩn bị cho một cuộc tổng tiến công.”* đúng phạm vi nguồn theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000041
  kind: modality_and_logic
  value: Giữ mục đích kế hoạch nghi binh, kết luận không thể giấu việc kích hoạt mạng
    lưới đường sắt, và hành động cố ý tung tin giả.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000042
  kind: pov
  value: Ngôi thứ nhất ('tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000042
  kind: terms
  value: Tướng von Zettour
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000042
  kind: modality_and_logic
  value: Giữ giả định phản thực quá khứ và mức xác quyết ở mệnh đề kết quả ('Nếu không
    nghe chuyện ấy khi gặp Tướng von Zettour ở thủ đô, chính tôi cũng đã tin mất').
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000043
  kind: pov
  value: Trần thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000043
  kind: terms
  value: viên chức phụ trách quan hệ công chúng; “chiến dịch quy mô lớn”
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000043
  kind: modality_and_logic
  value: Giữ chi tiết phát ngôn tại thủ đô và mệnh đề nhượng bộ 'dù chỉ trong những
    dịp không chính thức'.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000044
  kind: pov
  value: Trần thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000044
  kind: terms
  value: phòng tuyến Rhine
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000044
  kind: modality_and_logic
  value: Giữ nguyên phạm vi cụm trích dẫn tin đồn '“một chiến dịch lớn trên phòng
    tuyến Rhine”'.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000045
  kind: pov
  value: Ngôi thứ nhất số nhiều ('Chúng tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000045
  kind: terms
  value: vật tư tiếp tế; vật tư và trang bị quân sự; Arene
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000045
  kind: modality_and_logic
  value: 'Giữ đủ 4 ý: tàu chở vật tư tiếp tế chạy ngược xuôi; cuộc rút lui quy mô
    lớn nhằm dụ địch ra tiêu diệt; nhu cầu lớn về vật tư và trang bị quân sự; báo
    cáo về Arene bị kiểm duyệt gắt gao.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000046
  kind: pov
  value: Trần thuật
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000046
  kind: terms
  value: Đế quốc; Arene
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000046
  kind: modality_and_logic
  value: 'Giữ hai lớp thông tin nghi binh: (1) thuyết phục cả giới nắm thông tin rằng
    việc điều quân là tiếp viện trấn áp nổi dậy ở Arene và Đế quốc đỏ mặt thừa nhận
    không khống chế được tình hình; (2) những phần không thể ém bằng lệnh cấm tiết
    lộ nghiêm ngặt được biến thành tin đồn rằng tình hình đã kiểm soát chỉ để giữ
    thể diện, qua đó lừa người ta tin điều ngược với sự thật.'
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000047
  kind: pov
  value: Ngôi thứ nhất ('Chúng tôi', 'tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000047
  kind: terms
  value: Cộng hòa
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000047
  kind: modality_and_logic
  value: Giữ phủ định về dữ liệu ('không có đủ dữ liệu để đoán'), nhận xét tâm lý
    ('xu hướng tin điều mình muốn tin') và kỳ vọng dè dặt ('tôi nghĩ có thể trông
    đợi thu được kết quả nhất định').
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000048
  kind: pov
  value: Ngôi thứ nhất ('tôi', 'chúng tôi')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000048
  kind: terms
  value: Đế quốc
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000048
  kind: modality_and_logic
  value: Giữ tình thái phỏng đoán sự nghi ngờ của địch ('hẳn họ vẫn nghi ngờ'), chi
    tiết giả định ('vốn được cho là đang gặp vấn đề về tuyến tiếp tế') và sự ngạc
    nhiên của người kể khi thực sự lừa được họ bất chấp nghi ngờ.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000049
  kind: pov
  value: Ngôi thứ nhất số nhiều ('chúng tôi') và trần thuật khách quan
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000049
  kind: terms
  value: Cộng hòa; Quân đội Đế quốc; pháp sư; trinh sát bằng vũ lực; Quân đội Cộng
    hòa; Đế quốc
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000049
  kind: modality_and_logic
  value: Giữ tình thái 'có vẻ' ở vế đề phòng của Cộng hòa, mức độ thâm nhập sâu chưa
    từng có của các pháp sư tinh nhuệ nhất, và việc chạm trán lực lượng đánh chặn
    mạnh đúng như Đế quốc mong muốn.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000050
  kind: pov
  value: Trần thuật ngôi thứ ba về Tanya ('Tanya', 'cô')
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000050
  kind: terms
  value: Tanya; tiểu đoàn; Quân đội Đế quốc; trinh sát bằng vũ lực
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000050
  kind: modality_and_logic
  value: Giữ đại từ 'cô' quy chiếu Tanya trong câu trần thuật, vai trò thể hiện sự
    nóng vội của Quân đội Đế quốc đang tuyệt vọng, mục đích nghi binh của nhiệm vụ
    trinh sát bằng vũ lực, và điều kiện 'bất chấp thương vong'.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000051
  kind: pov
  value: Trần thuật và độc thoại tập thể của các sĩ quan Bộ Tổng tham mưu
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000051
  kind: terms
  value: Quân đội Cộng hòa; trinh sát bằng vũ lực; Bộ Tổng tham mưu Quân đội Đế quốc
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000051
  kind: emphasis
  value: Giữ đúng hai phạm vi chữ nghiêng Markdown *Họ mắc câu rồi* và *Giờ thì các
    đơn vị đang rút lui không còn phải lo bị đánh cho tơi bời nữa.* theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000051
  kind: modality_and_logic
  value: Giữ phản ứng mừng rỡ, nhẹ nhõm của các sĩ quan Bộ Tổng tham mưu trước báo
    cáo địch đề phòng mũi đột nhập sâu, và sắc thái khẩu ngữ vừa phải ở câu kết.
  non_canon: true
choice_groups:
- segment_id: YS-LN02/Text/part0032.xhtml/p000026
  pov: Ngôi thứ nhất tự thuật của Tanya ('tôi', 'bản thân')
  terms:
  - quả cầu
  - tác nhân gây nhiễu mật độ cao
  - ma pháp
  - ECM24
  modality_and_logic: 'Giữ chuỗi nhân quả: quả cầu chặn phát bắn -> tác nhân gây nhiễu
    mật độ cao tản ra -> cản trở sử dụng ma pháp diện rộng -> giúp bản thân gần như
    không thể bị phát hiện (giữ mức ''gần như'', không biến thành vô hình tuyệt đối);
    giữ phép so sánh bật ECM24 hết công suất kèm số tham chiếu chú thích 24.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000027
  pov: Nhận định của người kể
  terms:
  - thiết bị quang học
  modality_and_logic: Giữ tình thái phỏng đoán dè dặt ('Có lẽ') và mức độ ('cực kỳ
    khó khăn') khi dùng thiết bị quang học phát hiện vật thể bay ban đêm.
- segment_id: YS-LN02/Text/part0032.xhtml/p000028
  pov: Nhận định của người kể
  terms:
  - ECM
  modality_and_logic: 'Giữ quan hệ nhân quả và nghịch lý: vì giống ECM nên chính sự
    nhiễu loạn là dấu hiệu rõ rành rành báo hiệu sự hiện diện.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000029
  pov: Ví dụ khái quát ngôi gộp ('ta')
  terms:
  - radar
  modality_and_logic: 'Giữ câu điều kiện: nếu radar trắng xóa thì hiển nhiên có thứ
    gì đó ở đó.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000030
  pov: Kết luận chiến thuật của người kể
  terms:
  - cơ động bí mật
  modality_and_logic: 'Giữ phủ định: tình hình không thích hợp để cơ động bí mật.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000031
  pov: Nhận định chiến thuật của người kể
  terms:
  - khóa được mục tiêu
  - tên lửa dẫn đường
  - hỏa lực được tổ chức bài bản
  - tấm màn tàng hình
  modality_and_logic: Giữ điều kiện kép (bị phát hiện nhưng đối phương không khóa
    được mục tiêu), phủ định mối đe dọa, hành động xuyên phá tốc độ cao kết hợp quấy
    rối nhẹ, và ẩn dụ tấm màn tàng hình.
- segment_id: YS-LN02/Text/part0032.xhtml/p000032
  pov: Ngôi thứ nhất tự thuật của Tanya ('tôi')
  terms: []
  modality_and_logic: Giữ tương phản giữa tác dụng phụ nghiêm trọng là nỗi khổ tâm
    của người kể và sự bất lực ('nhưng chẳng thể làm gì được').
- segment_id: YS-LN02/Text/part0032.xhtml/p000033
  pov: Thoại mệnh lệnh qua vô tuyến
  terms:
  - Giai đoạn hai
  - giai đoạn ba
  - cơ động theo phương án đã định
  modality_and_logic: Giữ mốc thời gian ('kết thúc trong chốc lát', 'Cho đến khi có
    lệnh bước sang giai đoạn ba') và chủ thể nhận lệnh ('từng đơn vị').
- segment_id: YS-LN02/Text/part0032.xhtml/p000034
  pov: Câu danh ngữ trần thuật
  terms:
  - thông điệp vô tuyến
  modality_and_logic: Giữ hình thức câu trần thuật mô tả thông điệp vô tuyến lẫn đầy
    tạp âm; không biến thành lời thoại.
- segment_id: YS-LN02/Text/part0032.xhtml/p000035
  pov: Trần thuật giải thích kỹ thuật
  terms:
  - pháp sư
  - sóng định hướng truyền qua các quả cầu
  modality_and_logic: Giữ cấu trúc tăng tiến ('Không chỉ được mã hóa, đây còn là...')
    và hệ quả hạn chế thực tế ('chỉ vừa đủ để trao đổi vài lời, nên trên thực tế chỉ
    phù hợp cho liên lạc cần thiết').
- segment_id: YS-LN02/Text/part0032.xhtml/p000036
  pov: Trần thuật
  terms:
  - mật độ ma pháp
  modality_and_logic: 'Giữ quan hệ nguyên nhân - kết quả: mật độ ma pháp tồn dư cao
    trong không khí gây ra tiếng ồn chói tai.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000037
  pov: Ngôi thứ nhất ('Tôi', 'chúng tôi')
  terms:
  - quan sát viên Quân đội Cộng hòa
  - lực lượng đoạn hậu
  modality_and_logic: Giữ thái độ bất mãn, phủ định việc biết vị trí đồng đội, vai
    trò lực lượng đoạn hậu và nhịp tự sửa ('đang nhô ra—hay đúng hơn là xông thẳng—vào
    lãnh thổ địch').
- segment_id: YS-LN02/Text/part0032.xhtml/p000038
  pov: Ngôi thứ nhất số nhiều ('Chúng tôi')
  terms:
  - sư đoàn
  - cụm tập đoàn quân
  modality_and_logic: Giữ điều kiện mở rộng toàn chiến trường và cơ động quy mô lớn;
    giữ tương phản quy mô khi rút lui dưới màn đêm giữa một sư đoàn và một cụm tập
    đoàn quân.
- segment_id: YS-LN02/Text/part0032.xhtml/p000039
  pov: Ngôi thứ nhất ('tôi', 'chúng tôi')
  terms:
  - pháp sư
  - khu vực Rhine
  modality_and_logic: Giữ mệnh đề nhượng bộ (nhóm pháp sư xuất sắc cơ động và ứng
    biến linh hoạt) và phủ định khả năng bao quát toàn bộ khu vực Rhine.
- segment_id: YS-LN02/Text/part0032.xhtml/p000040
  pov: Trần thuật
  terms:
  - tiểu đoàn tăng cường
  modality_and_logic: Giữ tách biệt hai thuộc tính ('một tiểu đoàn tăng cường' và
    'quân số còn thiếu hụt đôi chút') cùng kết luận các phương pháp thông thường là
    bất khả thi.
- segment_id: YS-LN02/Text/part0032.xhtml/p000041
  pov: Ngôi thứ nhất số nhiều ('chúng tôi', 'mình') và trần thuật về Bộ Tổng tham
    mưu
  terms:
  - trinh sát bằng vũ lực
  - Bộ Tổng tham mưu
  - Đế quốc
  emphasis: Giữ đánh dấu nghiêng Markdown *“Đế quốc đang điều chuyển quân nhu và binh
    lính để chuẩn bị cho một cuộc tổng tiến công.”* đúng phạm vi nguồn theo DEC-P01-002.
  modality_and_logic: Giữ mục đích kế hoạch nghi binh, kết luận không thể giấu việc
    kích hoạt mạng lưới đường sắt, và hành động cố ý tung tin giả.
- segment_id: YS-LN02/Text/part0032.xhtml/p000042
  pov: Ngôi thứ nhất ('tôi')
  terms:
  - Tướng von Zettour
  modality_and_logic: Giữ giả định phản thực quá khứ và mức xác quyết ở mệnh đề kết
    quả ('Nếu không nghe chuyện ấy khi gặp Tướng von Zettour ở thủ đô, chính tôi cũng
    đã tin mất').
- segment_id: YS-LN02/Text/part0032.xhtml/p000043
  pov: Trần thuật
  terms:
  - viên chức phụ trách quan hệ công chúng
  - “chiến dịch quy mô lớn”
  modality_and_logic: Giữ chi tiết phát ngôn tại thủ đô và mệnh đề nhượng bộ 'dù chỉ
    trong những dịp không chính thức'.
- segment_id: YS-LN02/Text/part0032.xhtml/p000044
  pov: Trần thuật
  terms:
  - phòng tuyến Rhine
  modality_and_logic: Giữ nguyên phạm vi cụm trích dẫn tin đồn '“một chiến dịch lớn
    trên phòng tuyến Rhine”'.
- segment_id: YS-LN02/Text/part0032.xhtml/p000045
  pov: Ngôi thứ nhất số nhiều ('Chúng tôi')
  terms:
  - vật tư tiếp tế
  - vật tư và trang bị quân sự
  - Arene
  modality_and_logic: 'Giữ đủ 4 ý: tàu chở vật tư tiếp tế chạy ngược xuôi; cuộc rút
    lui quy mô lớn nhằm dụ địch ra tiêu diệt; nhu cầu lớn về vật tư và trang bị quân
    sự; báo cáo về Arene bị kiểm duyệt gắt gao.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000046
  pov: Trần thuật
  terms:
  - Đế quốc
  - Arene
  modality_and_logic: 'Giữ hai lớp thông tin nghi binh: (1) thuyết phục cả giới nắm
    thông tin rằng việc điều quân là tiếp viện trấn áp nổi dậy ở Arene và Đế quốc
    đỏ mặt thừa nhận không khống chế được tình hình; (2) những phần không thể ém bằng
    lệnh cấm tiết lộ nghiêm ngặt được biến thành tin đồn rằng tình hình đã kiểm soát
    chỉ để giữ thể diện, qua đó lừa người ta tin điều ngược với sự thật.'
- segment_id: YS-LN02/Text/part0032.xhtml/p000047
  pov: Ngôi thứ nhất ('Chúng tôi', 'tôi')
  terms:
  - Cộng hòa
  modality_and_logic: Giữ phủ định về dữ liệu ('không có đủ dữ liệu để đoán'), nhận
    xét tâm lý ('xu hướng tin điều mình muốn tin') và kỳ vọng dè dặt ('tôi nghĩ có
    thể trông đợi thu được kết quả nhất định').
- segment_id: YS-LN02/Text/part0032.xhtml/p000048
  pov: Ngôi thứ nhất ('tôi', 'chúng tôi')
  terms:
  - Đế quốc
  modality_and_logic: Giữ tình thái phỏng đoán sự nghi ngờ của địch ('hẳn họ vẫn nghi
    ngờ'), chi tiết giả định ('vốn được cho là đang gặp vấn đề về tuyến tiếp tế')
    và sự ngạc nhiên của người kể khi thực sự lừa được họ bất chấp nghi ngờ.
- segment_id: YS-LN02/Text/part0032.xhtml/p000049
  pov: Ngôi thứ nhất số nhiều ('chúng tôi') và trần thuật khách quan
  terms:
  - Cộng hòa
  - Quân đội Đế quốc
  - pháp sư
  - trinh sát bằng vũ lực
  - Quân đội Cộng hòa
  - Đế quốc
  modality_and_logic: Giữ tình thái 'có vẻ' ở vế đề phòng của Cộng hòa, mức độ thâm
    nhập sâu chưa từng có của các pháp sư tinh nhuệ nhất, và việc chạm trán lực lượng
    đánh chặn mạnh đúng như Đế quốc mong muốn.
- segment_id: YS-LN02/Text/part0032.xhtml/p000050
  pov: Trần thuật ngôi thứ ba về Tanya ('Tanya', 'cô')
  terms:
  - Tanya
  - tiểu đoàn
  - Quân đội Đế quốc
  - trinh sát bằng vũ lực
  modality_and_logic: Giữ đại từ 'cô' quy chiếu Tanya trong câu trần thuật, vai trò
    thể hiện sự nóng vội của Quân đội Đế quốc đang tuyệt vọng, mục đích nghi binh
    của nhiệm vụ trinh sát bằng vũ lực, và điều kiện 'bất chấp thương vong'.
- segment_id: YS-LN02/Text/part0032.xhtml/p000051
  pov: Trần thuật và độc thoại tập thể của các sĩ quan Bộ Tổng tham mưu
  terms:
  - Quân đội Cộng hòa
  - trinh sát bằng vũ lực
  - Bộ Tổng tham mưu Quân đội Đế quốc
  emphasis: Giữ đúng hai phạm vi chữ nghiêng Markdown *Họ mắc câu rồi* và *Giờ thì
    các đơn vị đang rút lui không còn phải lo bị đánh cho tơi bời nữa.* theo DEC-P01-002.
  modality_and_logic: Giữ phản ứng mừng rỡ, nhẹ nhõm của các sĩ quan Bộ Tổng tham
    mưu trước báo cáo địch đề phòng mũi đột nhập sâu, và sắc thái khẩu ngữ vừa phải
    ở câu kết.
