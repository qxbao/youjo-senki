- segment_id: YS-LN02/Text/part0024.xhtml/p000279
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000279: names_and_ranks: [''navy
    -> hải quân'', ''Imperial Navy -> Hải quân Đế quốc'', ''“hardware” -> “phần cứng”'']:
    pronouns_and_address: [''Lược chủ ngữ ngôi thứ hai khái quát ở hai câu đầu; đại
    từ "họ" quy chiếu Hải quân Đế quốc; "chúng" quy chiếu “phần cứng” (các tàu chiến/trang
    bị)'']: pov_and_logic: [''Giữ quan hệ điều kiện phủ định ("Nếu không kiểm soát
    được mọi phía... thì không thể tuần tra... một cách hoàn hảo"), lý do hải quân
    ưu tiên suy luận dựa trên kinh nghiệm, và sự tương phản giữa việc mở rộng “phần
    cứng” đúng tiến độ với việc nhân sự vận hành vẫn cần cải thiện'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000280
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000280: names_and_ranks: []: pronouns_and_address:
    [''Đại từ ngôi thứ hai số nhiều "các anh" hướng tới phía sĩ quan hải quân'']:
    pov_and_logic: [''Giữ lời phản bác ngắn gọn từ phía lục quân rằng đó chính là
    nhiệm vụ của hải quân'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000281
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000281: names_and_ranks: [''military
    men -> quân nhân'', ''navy -> hải quân'', ''hardware -> phần cứng'', ''“software”
    -> “phần mềm”'', ''quality manpower -> nhân lực chất lượng cao'']: pronouns_and_address:
    [''Đại từ "họ" và "mình" quy chiếu phía hải quân; "nó" quy chiếu phần cứng'']:
    pov_and_logic: [''Giữ ẩn dụ “phần mềm” (`vol02-ch04-b21-software-personnel-metaphor`)
    bổ sung cho phần cứng vốn đã đầy đủ dưới dạng nhân lực chất lượng cao'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000282
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000282: names_and_ranks: [''Major
    General von Zettour -> Thiếu tướng von Zettour'']: pronouns_and_address: [''Lược
    đại từ ngôi thứ nhất trong câu thoại của Zettour'']: pov_and_logic: [''Giữ lời
    can thiệp của Thiếu tướng von Zettour nhằm chấm dứt màn đổ lỗi và than vãn vô
    ích'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000283
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000283: names_and_ranks: [''army
    -> lục quân'', ''navy -> Hải quân'', ''witch hunt -> cuộc săn phù thủy'']: pronouns_and_address:
    [''Đại từ "ông" quy chiếu Thiếu tướng von Zettour; "họ" quy chiếu các bên tham
    dự cuộc họp'']: pov_and_logic: [''Giữ đánh giá của Zettour (lục quân đã trút gần
    hết bất mãn, hải quân sắp cạn kiên nhẫn, kéo dài chỉ phí thời gian) và quyết định
    chấm dứt "cuộc săn phù thủy" (`vol02-ch04-b21-witch-hunt`) để hướng tới giải pháp
    thực tế'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000284
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000284: names_and_ranks: [''navy
    -> Hải quân / hải quân'', ''army officers -> những sĩ quan lục quân'', ''Zettour
    -> Zettour'']: pronouns_and_address: [''Đại từ "chúng ta" trong lời Zettour quy
    chiếu cuộc họp; "ông" quy chiếu Zettour'']: pov_and_logic: [''Giữ câu hỏi chuyển
    hướng sang bước tiếp theo dành cho hải quân, ánh nhìn nghiêm nghị ngăn các sĩ
    quan lục quân nói thêm, và ý nghĩ nội tâm in nghiêng của Zettour khi một sĩ quan
    hải quân trẻ đứng dậy'']: emphasis: *Cậu nhóc trẻ thật*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000285
