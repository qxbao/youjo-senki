choices:
- segment_id: YS-LN02/Text/part0016.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000041: locks: [''Giữ các danh
    xưng `Khối Thịnh vượng chung`, `Nữ thần Thứ Mười Một` (đã đồng bộ viết hoa theo
    `vol-02-ch-03-b02-term-followup` và `vol02-ch03-b02-eleventh-goddess`), đại từ
    `cô ấy`, và cấu trúc câu hỏi đối lập hướng `ở phía bắc, trong khi đáng lẽ cô ấy
    phải ở phía tây?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000042: locks: [''Giữ tên riêng
    `Jeffrey` (theo `vol02-ch03-b01-jeffrey-reference`) và câu `Theo Jeffrey, câu
    trả lời rất đơn giản.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000043: locks: [''Giữ các danh
    xưng `Khối Thịnh vượng chung`, `Liên minh Hiệp ước Regadonia`, cụm `bí mật tuyệt
    đối phái một đơn vị viễn chinh`, và mốc thời gian `Trước khi chính thức tham chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000044: locks: [''Giữ danh xưng
    `Khối Thịnh vượng chung` và toàn văn `Đúng vậy, Khối Thịnh vượng chung đã tham
    chiến trước khi chính thức tuyên chiến.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000045: locks: [''Giữ bản sửa theo
    `vol-02-ch-03-b02-review-fixes` với tên cơ quan viết hoa `Cục Lưu trữ Quốc gia`
    (theo `vol02-ch03-b02-organization-capitalization`), các đại từ `Người ta`, `Chúng
    tôi`, `họ`, và toàn văn ba câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000046
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000046: locks: [''Giữ đại từ `Chúng
    tôi`, các danh xưng `Khối Thịnh vượng chung`, `Cộng hòa`, `Đế quốc`, `Ủy ban Quốc
    phòng` (theo `vol02-ch03-b02-organization-capitalization`), và mục đích `thu thập
    tin tình báo ngay trên chiến trường để hiểu rõ hơn về kẻ thù trong tương lai.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000047
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000047: locks: [''Giữ các cụm trong
    ngoặc kép `“đội quân tình nguyện”`, `“tự nguyện”`, `“độc lập”`, `“theo thẩm quyền
    của chính mình”`, địa danh `Regadonia`, các cụm `đơn vị pháp sư`, `luật pháp quốc
    tế`, `các sĩ quan và binh sĩ đã giải ngũ`, `Cục lưu trữ`, đại từ `chúng tôi`,
    và quy mô `một lực lượng pháp sư quy mô cấp trung đoàn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000048
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000048: locks: [''Giữ danh xưng
    `Khối Thịnh vượng chung`, các cụm `quốc gia trung lập`, `tình trạng thiếu pháp
    sư ngày càng trầm trọng`, `“đội quân tình nguyện”`, và nhận định kết đoạn `Dù
    xét theo tiêu chuẩn nào, “đội quân tình nguyện” này cũng rất đông.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000049: locks: [''Giữ các cụm `tranh
    chấp chính trị`, `các tình nguyện viên đã bị tiêu diệt tan tác`, `những pháp sư
    chiến đấu quý giá`, đại từ `họ`, và cụm `chôn vùi vụ can thiệp bí mật ấy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000050: locks: [''Giữ danh xưng
    `Nữ thần Thứ Mười Một` ở cả hai vị trí (theo `vol-02-ch-03-b02-term-followup`
    và `vol02-ch03-b02-eleventh-goddess`), cụm `chỉ huy đội quân tình nguyện`, các
    đại từ `chính thứ đó`, `họ`, `chúng tôi`, `đó`, và hai câu hỏi đối lập `Nữ thần
    Thứ Mười Một là một người ư? Hay đó là một thuật ngữ chuyên môn nào đó?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000051: locks: [''Giữ tên riêng
    `Jeffrey` (theo `vol02-ch03-b01-jeffrey-reference`) và câu `Jeffrey có cách lý
    giải rất đơn giản về điểm này.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000052: locks: [''Giữ nguyên cụm
    tiếng Anh trong ngoặc kép `“Supply hell”` (theo `vol02-ch03-b02-supply-hell`)
    để bảo toàn tính xác thực của manh mối `có đúng mười một ký tự nếu tính cả dấu
    cách`, cùng các cụm `cách nói giảm để phàn nàn về cách cấp lãnh đạo điều hành`,
    `Quân đội hẳn phải xấu hổ về chuyện đó, phải không?`, `“binh biến trên diện rộng”`,
    và `che giấu một thất bại nào đó trong tổ chức.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000053: locks: [''Giữ tên riêng
    `Jeffrey`, danh xưng `Nữ thần Thứ Mười Một` (theo `vol-02-ch-03-b02-term-followup`
    và `vol02-ch03-b02-eleventh-goddess`), và cấu trúc phủ định đối lập `không phải
    là một người mà là một hiện tượng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000054: locks: [''Giữ đại từ ngôi
    thứ nhất `tôi` / `Tôi` cùng phản thân `mình`, các cụm `mặt trận phía tây`, `nguồn
    tiếp tế vẫn đến tốt nhất có thể`, `Kỷ luật`, `phóng viên`, và toàn văn bốn câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000055: locks: [''Giữ các cụm `số
    thương vong ở mặt trận phía tây cao bất thường`, `điều bất thường đã trở thành
    bình thường; nơi đó cứ như một chiều không gian khác`, `một con quỷ đang hoành
    hành`, đại từ `chúng tôi`, và câu kết `Và thế là cuộc tranh luận của chúng tôi
    chẳng đi đến đâu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000056: locks: [''Giữ đúng hai
    phạm vi nhấn mạnh in nghiêng tên cơ quan báo chí `*Londinium Times*` và `*WTN*`
    theo `DEC-P01-002`, cụm `cơ quan giám sát, theo dõi chính phủ`, và đại từ `chúng
    tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000057: locks: [''Giữ các đại từ
    `tôi`, `chúng ta`, `mình`, và câu kết `Cuối cùng, tôi cũng muốn nói rằng mình
    thật may mắn khi có một người vợ thấu hiểu đến vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000058: locks: [''Giữ nguyên câu
    chào kết bài `Vậy nhé, hẹn gặp lại tuần sau.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000059: locks: [''Giữ ký tự thực
    thể `&#42;` biểu diễn dấu hoa thị đầu dòng chú thích cùng dòng chữ ký `&#42;Andrew,
    phóng viên đặc biệt của WTN`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000060: locks: [''Giữ các đại từ
    `Tôi`, `ông ấy`, `chúng ta` (không tự quy chiếu bằng `mình` khi chưa xác lập chủ
    thể Tanya theo `DEC-P01-001`), và câu trích dẫn `“Chiến thắng cũng như một thứ
    ma túy.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000061: locks: [''Giữ các cụm `Chiến
    thắng quân sự`, `cảm giác say sưa tuyệt vời nhất cho một quốc gia`, chủ ngữ khái
    quát `người ta`, phủ định `không ai còn được phép hỏi chiến thắng ấy nhằm mục
    đích gì`, và câu kết `Chủ nghĩa lãng mạn quân sự tác động dữ dội đến các quốc
    gia.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000062: locks: [''Giữ các cụm `những
    người lính thực dụng`, đại từ `Họ`, và câu `Họ còn may mới chỉ bị gọi là kẻ hèn
    nhát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000063: locks: [''Giữ đại từ `tôi`
    và toàn văn câu thoại `“Vì vậy, tôi cho rằng tránh tổn thất và giảm thương vong
    xuống mức thấp nhất là điều đáng mong muốn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000064: locks: [''Giữ định danh
    `Quân đội Đế quốc`, các cụm `mở cuộc truy kích có thể đoán trước`, `đề xuất rút
    lui để tuyến tiếp tế không phải chịu áp lực quá lớn`, cụm quy chiếu trung tính
    `người đó`, và nhấn mạnh in nghiêng `*kẻ hèn nhát*` theo `DEC-P01-002`.'']'
  non_canon: true
