task_id: vol-02-ch-03-b07
baseline_sha256: 4b59f66eb2ff2ccfd4f84a27ffa984e6cb70dd82bc2126fd10e14a4797a019f9
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: a32efadbc99a44d2954f00c804957e8d1ff5d702c129b92f0734094c14c7a8ac
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 36
segment_id_start: YS-LN02/Text/part0016.xhtml/p000143
segment_id_end: YS-LN02/Text/part0016.xhtml/p000178
choices:
- segment_id: YS-LN02/Text/part0016.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000143: locks: [''Giữ thuật ngữ
    `một pháp sư`, `khói súng và máu me trên chiến trường`, chủ ngữ khái quát `người
    ta` và toàn văn câu trần thuật mở đầu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000144: locks: [''Giữ các thuật
    ngữ `Vài sĩ quan pháp sư nóng nảy`, `những quả cầu tính toán` (theo `computation
    orb` trong sổ pending) và mệnh đề xen `—hẳn là vô thức—`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000145: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở cụm suy nghĩ đã sửa ở V4 `*thêm nữa thì quá đáng*` theo
    `DEC-P01-002`, tên riêng `Schreise`, đại từ `Ông`, `cấp dưới`, danh xưng `Thiếu
    tá von Degurechaff`, đại từ `cô ấy` và `chúng ta` trong lời thoại hòa giải.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000146: locks: [''Giữ định danh
    `Quân Trung ương` (theo `vol02-ch03-b05-central-army` và `vol02-ch03-b06-central-army-group`),
    các đại từ `Họ`, `cô ta`, `ông`, các cụm `Một thiếu tá`, `sĩ quan cấp trên`, tên
    riêng `Schreise`, và cấu trúc bị động trung tính không đại từ ngôi thứ ba đã sửa
    ở V3 `Schreise chưa từng thấy thiếu tá nào vênh váo đến thế mà lại không bị xem
    thường.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000147: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu độc thoại nội tâm đầu đoạn đã sửa ở V4 `*Vậy nên
    con bé đưa tin kia cần im đi.*` theo `DEC-P01-002` (không in nghiêng câu trần
    thuật sau), cùng câu `Ông nhìn cô bằng ánh mắt cương quyết.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000148: locks: [''Giữ đại từ ngôi
    thứ nhất `Tôi`, thuật ngữ `từng cụm tập đoàn quân khu vực` (theo `vol02-ch03-b06-central-army-group`)
    và toàn văn hai câu thoại của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000149
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000149: locks: [''Giữ cụm chỉ vật
    đã sửa ở V1 `ánh nhìn ấy` (quy chiếu chính xác về `ánh mắt cương quyết` ở p000147),
    các đại từ `cô`, `họ`, và các danh xưng `chỉ huy tiểu đoàn`, `các sĩ quan tham
    mưu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000150: locks: [''Giữ định danh
    `Bộ Tổng Tham mưu thiêng liêng, bất khả xâm phạm`, đại từ `cô ta` và cụm `thách
    thức quyền uy không thể tha thứ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000151: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu thứ hai và thuật ngữ huân huy chương đã sửa ở V4
    `*Ngay cả người nhận Huy hiệu Xung kích Cánh bạc cũng không thể được dung thứ
    đến mức ấy!*` theo `DEC-P01-002` và mục `vol02-ch03-b07-silver-wings-assault-badge`,
    cùng các đại từ `cô ta`, `ông`, `chúng tôi`, và lời thoại `“Ý định của chúng tôi
    là giảm gánh nặng cho binh sĩ. Thiếu tá, xin đừng phát ngôn hấp tấp.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000152: locks: [''Giữ các thuật
    ngữ `vị thiếu tá`, `học viện chiến tranh` (theo `vol02-ch03-b06-war-college`),
    `vùng chiến sự`, các đại từ `Cô ta`, `họ`, và cấu trúc giả định phản thực `Nếu
    họ không ở trong vùng chiến sự, chuyện đó chắc chắn sẽ không được bỏ qua.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000153
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000153: locks: [''Giữ cụm `trên
    chiến trường`, câu hỏi tu từ `Gần như là một sự xúc phạm, phải không?`, danh xưng
    `Các sĩ quan` và đại từ `cô`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000154
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000154: locks: [''Giữ tên họ `Degurechaff`,
    đại từ `Cô`, cụm `buổi họp tham mưu`, và lời lẩm bẩm mỉa mai `“…Ở phía tây, binh
    sĩ chúng ta đang uống nước bẩn, đói lả và chịu khổ trong bùn. Phía bắc thật sung
    sướng…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000155
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000155: locks: [''Giữ các đại từ
    `cô`, `họ`, cụm `Với các sĩ quan đang dõi theo từng lời cô nói`, và câu kết `Gương
    mặt cô đã nói thay tất cả.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000156: locks: [''Giữ đại từ ngôi
    thứ nhất `tôi`, cách gọi số nhiều lịch sự `các vị`, thuật ngữ `binh sĩ`, và cấu
    trúc phủ định `“Dĩ nhiên, tôi không nghĩ điều đó ảnh hưởng đến mức độ các vị quan
    tâm đến binh sĩ…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000157
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000157: locks: [''Giữ thành ngữ
    `giọt nước tràn ly` và tên riêng `Schreise`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000158
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000158: locks: [''Giữ các định
    danh `Quân Trung ương`, `các cụm tập đoàn quân khu vực` (theo `vol02-ch03-b06-central-army-group`),
    và đại từ `Ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000159
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000159: locks: [''Giữ các đại từ
    `mình`, `ông` / `Ông`, `cô ta`, và toàn văn hai câu miêu tả cơn giận của Schreise.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000160
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000160: locks: [''Giữ danh xưng
    `Thiếu tá`, đại từ `cô`, các cụm `phía tây`, `Phía bắc`, và toàn văn lời quát
    của Schreise.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000161
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000161: locks: [''Giữ định danh
    `Cụm tập đoàn quân phương Bắc` (theo `vol02-ch03-b06-northern-army-group`) và
    câu hỏi `“Đó là ý chí của Cụm tập đoàn quân phương Bắc sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000162
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000162: locks: [''Giữ câu quát
    ngắn `“Đủ rồi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000163
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000163: locks: [''Giữ các đại từ
    `Ông`, `mình`, `cô`, `họ`, và cụm `một sĩ quan`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000164
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000164: locks: [''Giữ tên họ `Degurechaff`
    và câu `Rồi, với vẻ bình thản đáng khinh, Degurechaff giơ tay chào thật chuẩn
    mực.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000165
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000165: locks: [''Giữ cách chào
    rút lui trang trọng `“Vậy xin phép các vị.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000166
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000166: locks: [''Giữ các đại từ
    `cô`, `Họ`, và câu phủ định `Không ai tìm cách ngăn cô lại.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000167
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000167: locks: [''Giữ các danh
    xưng `Thiếu tá von Degurechaff`, `Thiếu tướng von Rudersdorf`, đúng phạm vi nhấn
    mạnh in nghiêng ở câu độc thoại nội tâm `*Quả nhiên là vậy.*` theo `DEC-P01-002`,
    cùng các đại từ `cô` / `Cô`, `mình`, `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000168
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000168: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn đã sửa ở V4 `*Đó là điều cô buộc phải làm.*`
    theo `DEC-P01-002` và đại từ `cô`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000169
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000169: locks: [''Giữ cặp đại từ
    đã sửa ở V2 `Tôi` – `cô` (theo `vol02-ch03-b07-rudersdorf-address`) và câu thoại
    `“Tôi biết cô định nói gì.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000170
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000170: locks: [''Giữ các đại từ
    `ông`, `họ` ở câu đầu, và đúng phạm vi nhấn mạnh in nghiêng ở câu thứ hai đã sửa
    ở V4 `*Bỏ mấy lời khách sáo sáo rỗng đi, nói thẳng ra.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000171
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000171: locks: [''Giữ kính ngữ
    `Thưa ngài` / `ngài`, cụm `mở cuộc tấn công là liều lĩnh`, và câu hỏi `Sao ngài
    không dừng lại?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000172
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000172: locks: [''Giữ danh xưng
    `Thiếu tá`, cặp đại từ `tôi` – `cô` (theo `vol02-ch03-b07-rudersdorf-address`),
    phản thân `mình`, và câu thoại `“Thiếu tá, tôi muốn cô nói điều mình thật sự nghĩ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000173: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn đã sửa ở V4 `*Cô đưa ra những lời phản đối vòng
    vo như thế.*` theo `DEC-P01-002` và đại từ `Cô`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000174
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000174: locks: [''Giữ các đại từ
    `cô`, `ông`, và cấu trúc phủ định `Nhưng ông không muốn nghe những suy nghĩ khéo
    léo, rập khuôn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000175
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000175: locks: [''Giữ kính ngữ
    `Thưa ngài`, thuật ngữ `sĩ quan tham mưu`, các đại từ `tôi` / `Tôi`, `mình`, và
    câu phủ định `Tôi không nghĩ mình có thể nói thêm điều gì.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000176: locks: [''Giữ cặp đại từ
    đã sửa ở V2 `Tôi` – `Cô` (theo `vol02-ch03-b07-rudersdorf-address`) và toàn văn
    ba câu thoại `“Tôi hiểu. Cô dễ đoán thật đấy. Cứ nói thẳng đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000177: locks: [''Giữ câu đáp lễ
    `“Cảm ơn ngài.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000178
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000178: locks: [''Giữ các đại từ
    `Ông`, `cô`, và câu kết `Ông đã thúc giục cô nói thật lòng, nhưng vẫn chấp nhận
    câu trả lời lịch sự mà sắc bén ấy.`.'']'
  non_canon: true
