choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000153
  kind: argon_narrator_viewpoint
  value: '"ngôi thứ nhất số nhiều (`chúng tôi`) của pháp sư đánh chặn Cộng hòa"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000153
  kind: argon_terms
  value: '{"get enemy engagements done quietly":"giải quyết êm thấm các cuộc giao
    chiến với địch","our interceptors":"lực lượng đánh chặn của chúng tôi (hoặc các
    đơn vị đánh chặn của chúng tôi)","recon-in-force units":"các đơn vị trinh sát
    chiến đấu"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000153
  kind: argon_modality_and_logic
  value: '"giữ quan hệ mức độ–hệ quả của các cuộc đụng độ nhỏ ban đêm diễn ra thường
    xuyên đến mức được ví đùa như một phần cảnh đêm"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000154
  kind: argon_pronouns
  value: '{"defensive_line_personnel":"mấy người ở tuyến phòng thủ","enemy":"chúng"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000154
  kind: argon_modality_and_logic
  value: '"giữ nguyên câu hỏi phàn nàn về tốc độ tiếp cận của địch và phản ứng của
    các tuyến phòng thủ"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000155
  kind: argon_pronouns
  value: '{"enemy_unit":"chúng","narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000155
  kind: argon_terms
  value: '{"frontline command":"sở chỉ huy tiền phương","shelters":"nơi trú ẩn (hoặc
    hầm trú ẩn)","third defensive line":"tuyến phòng thủ thứ ba"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000155
  kind: argon_modality_and_logic
  value: '"giữ suy luận từ việc địch đã vượt qua tuyến phòng thủ thứ ba và khả năng
    cao chúng đã phát hiện nơi trú ẩn cùng sở chỉ huy tiền phương"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000156
  kind: argon_terms
  value: '{"desperate imperial offensive":"cuộc tiến công liều lĩnh của Đế quốc","imperial":"Đế
    quốc"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000156
  kind: argon_modality_and_logic
  value: '"giữ thông tin ở mức tin đồn, không khẳng định sự kiện đã xác thực"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000157
  kind: argon_pronouns
  value: '{"enemy":"chúng","narrator_group":"chúng tôi","narrator_singular":"tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000157
  kind: argon_terms
  value: '{"second line":"tuyến thứ hai","sortie orders":"lệnh xuất kích","standby
    unit is scrambled":"đơn vị dự bị (hoặc đơn vị trực chiến) được lệnh xuất kích","third
    defensive lines / third line":"tuyến phòng thủ thứ ba / tuyến thứ ba"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000157
  kind: argon_negation_and_modality
  value: '"giữ điều kiện phủ định `trừ phi... thường không thể...`, quy trình thông
    thường khi tuyến hai bị vượt qua, và nhận định đánh giá của người kể ở cuối câu
    về phản ứng quá chậm"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000158
  kind: argon_pronouns
  value: '{"controller_inclusive_we":"chúng ta"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000158
  kind: argon_terms
  value: '{"scouting network":"mạng lưới trinh sát","widespread magic jamming":"nhiễu
    ma thuật trên diện rộng"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000158
  kind: argon_modality_and_logic
  value: '"giữ quan hệ nguyên nhân–kết quả giữa nhiễu ma thuật diện rộng làm tê liệt
    mạng lưới trinh sát và việc phản ứng bị chậm trễ"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000159
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000159
  kind: argon_terms
  value: '{"controller":"sĩ quan điều khiển","intercept":"đánh chặn","stand by":"chờ
    lệnh (hoặc trực chờ)"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000159
  kind: argon_modality_and_logic
  value: '"giữ câu hỏi tu từ phủ định (`sao có thể khác được?`) và tâm lý bực bội
    vì bị điều đi đánh chặn gấp sau khi liên tục phải chờ lệnh"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000160
  kind: argon_pronouns
  value: '{"enemy":"chúng","narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000160
  kind: argon_terms
  value: '{"harassing attacks":"các đòn quấy rối (hoặc các đợt tấn công quấy rối)","intelligence":"tin
    tình báo","last defensive line":"tuyến phòng thủ cuối cùng"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000160
  kind: argon_emphasis
  value: '"bọc chính xác hai câu đầu trong `*...*` theo `DEC-P01-002`; không đánh
    dấu câu thứ ba"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000160
  kind: argon_modality_and_logic
  value: '"giữ tình thế bị đẩy vào cảnh phải chặn địch trước tuyến cuối, hai rủi ro
    song hành (thiệt hại do quấy rối và lộ tin tình báo), cùng sắc thái tất yếu ở
    câu kết"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000161
  kind: argon_pronouns
  value: '{"enemy_battalion":"chúng (giữ nhất quán, không đổi sang `họ`)"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000161
  kind: argon_terms
  value: '{"battalion of mages":"tiểu đoàn pháp sư","the Rhine general headquarters":"Tổng
    hành dinh Rhine (hoặc Bộ tổng chỉ huy Rhine; không thêm `Tập đoàn quân`)"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000161
  kind: argon_modality_and_logic
  value: '"giữ tương phản giữa khả năng nghiền nát địch theo lý thuyết (`lẽ ra phải...`)
    và nguy cơ dẫn tới thảm họa khi xét những tin tình báo mà địch đã nắm được"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000162
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi","narrator_singular":"tôi","radio_operators_ref":"họ"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000162
  kind: argon_terms
  value: '{"heads would roll":"bị cách chức (hoặc mất chức)","high-ranking officers":"sĩ
    quan cấp cao","radio operators":"nhân viên thông tin vô tuyến (hoặc lính thông
    tin vô tuyến)","widespread magic jamming":"nhiễu ma thuật trên diện rộng"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000162
  kind: argon_modality_and_logic
  value: '"giữ ba mức phỏng đoán tương lai của người kể (`Tôi chắc...`, `Hẳn...`,
    `Và tôi cá rằng...`)"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000163
  kind: argon_terms
  value: '{"anti-air fire":"hỏa lực phòng không","optical instruments":"thiết bị quang
    học"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000163
  kind: argon_modality_and_logic
  value: '"giữ tình thái nghe truyền đạt (`Nghe nói...`) và cảnh báo rằng do phòng
    không chỉ dựa vào thiết bị quang học nên quân địch có thể vẫn còn sung sức"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000164
  kind: argon_pronouns
  value: '{"enemy":"chúng"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000164
  kind: argon_terms
  value: '{"Roger":"Rõ","injured beast":"con thú bị thương"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000164
  kind: argon_modality_and_logic
  value: '"giữ lời đáp nhận lệnh, ẩn dụ cảnh giác không xem thường con thú bị thương
    và các câu hỏi ngắn xin thêm thông tin"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000165
  kind: argon_chronology_and_modality
  value: '"giữ sự chuyển mạch từ chuyện tương lai về nhiệm vụ hôm nay, dự báo mức
    độ căng thẳng cao hơn thường lệ và mốc nhận thức lần đầu của cả đơn vị"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000166
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000166
  kind: argon_terms
  value: '{"enemy mages":"pháp sư địch"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000166
  kind: argon_modality_and_logic
  value: '"giữ đối lập giữa các lần đẩy lui pháp sư địch đã kiệt sức với khả năng
    lần này phải chạm trán lực lượng còn bảo toàn được sức lực ở mức tương đối trong
    đêm tối"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000167
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi","our_side":"của ta"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000167
  kind: argon_terms
  value: '{"anti-air gunners":"pháo thủ phòng không","friendly fire":"bị quân mình
    bắn nhầm (hoặc hỏa lực phe ta bắn nhầm)","optical instruments":"thiết bị quang
    học"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000167
  kind: argon_negation_and_modality
  value: '"giữ phủ định kép ở cuối câu (`hoàn toàn có thể xảy ra` / `không phải chuyện
    không tưởng`) và làm rõ nguy cơ bị phòng không phe mình bắn nhầm"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000168
  kind: argon_pronouns
  value: '{"controller_inclusive_we":"chúng ta","enemy":"chúng"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000168
  kind: argon_terms
  value: '{"elites":"tinh nhuệ (hoặc quân tinh nhuệ)","jamming":"nhiễu","large-scale
    imperial offensive":"cuộc tiến công quy mô lớn của Đế quốc","superior":"cấp trên
    (giữ chung, không suy diễn quân hàm)"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000168
  kind: argon_negation_and_modality
  value: '"giữ phủ định hoàn thành (`vẫn chưa nhận diện được chúng`), nhận định dè
    dặt từ cấp trên (`có vẻ là tinh nhuệ`) và mệnh lệnh cảnh giác"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000169
  kind: argon_terms
  value: '{"Troops":"Mọi người (hoặc Toàn đội)","game faces on":"nghiêm túc lên (giữ
    liên kết từ vựng với p000172)"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000169
  kind: argon_modality_and_logic
  value: '"giữ lời cảm ơn của chỉ huy với đài điều khiển và khẩu lệnh đốc thúc đơn
    vị xuất phát"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000170
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000170
  kind: argon_terms
  value: '{"commander":"người chỉ huy","vigilant warrior":"chiến binh cảnh giác"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000170
  kind: argon_modality_and_logic
  value: '"giữ tình thái mô tả phẩm chất nghe được trong giọng người chỉ huy (thể
    hiện mức độ căng thẳng vừa đủ của một chiến binh cảnh giác), không biến thành
    câu quy phạm `cần có`"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000171
  kind: argon_chronology_and_modality
  value: '"giữ bước ngoặt hồi cố (`Nhưng đó chỉ là khi nhìn lại.`) nối giữa ấn tượng
    lúc xuất kích và nhận thức sau trận đánh"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000172
  kind: argon_pronouns
  value: '{"commander_and_superiors":"Họ","narrator_group":"Chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000172
  kind: argon_negation_and_modality
  value: '"giữ câu phủ định bác bỏ (`Họ đã sai. Chúng tôi không cần phải nghiêm túc
    lên.`) và nghịch lý sống chết ở câu thứ ba"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000173
  kind: argon_pronouns
  value: '{"inclusive_unit":"Chúng ta"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000173
  kind: argon_terms
  value: '{"All hands":"Toàn thể đơn vị","Prepare to engage":"Chuẩn bị giao chiến","battalion
    commander":"tiểu đoàn trưởng (chức vụ, không thêm quân hàm)"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000173
  kind: argon_modality_and_logic
  value: '"giữ đúng mệnh lệnh thông báo phát hiện địch và chuẩn bị giao chiến qua
    vô tuyến"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000174
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000174
  kind: argon_modality_and_logic
  value: '"giữ quan hệ nguyên nhân bóng tối làm thu hẹp tầm nhìn của cả hai bên và
    gây bất lợi cho đơn vị người kể"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000175
  kind: argon_pronouns
  value: '{"both_units_or_narrator_unit":"Chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000175
  kind: argon_terms
  value: '{"Republican mage doctrine":"học thuyết tác chiến của pháp sư Cộng hòa","battalion
    commanders":"các tiểu đoàn trưởng","disciplined fire":"hỏa lực kỷ luật","imperial
    mages":"pháp sư Đế quốc","organized combat":"tác chiến có tổ chức"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000175
  kind: argon_chronology_and_modality
  value: '"giữ tính đồng thời (`gần như đồng thời`, `gần như cùng lúc`) và nội dung
    học thuyết tác chiến nhóm áp đảo sức mạnh cá nhân"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000176
  kind: argon_terms
  value: '{"encounter battle":"trận chạm trán (hoặc trận tao ngộ chiến)","jamming":"nhiễu","mana
    density":"mật độ mana"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000176
  kind: argon_modality_and_logic
  value: '"giữ hai yếu tố định hình tình huống là trận chạm trán bất ngờ tại khu vực
    địch tiến vào và nhiễu mạnh do mật độ mana cao"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000177
  kind: argon_pronouns
  value: '{"narrator_group":"chúng tôi"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000177
  kind: argon_terms
  value: '{"close-quarters fighting":"cận chiến","veteran mages":"các pháp sư kỳ cựu"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000177
  kind: argon_negation_and_modality
  value: '"giữ ước tính dè dặt rằng trận đánh khác hẳn những gì đơn vị quen đối phó
    và mô tả năng lực cận chiến của đối phương"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000178
  kind: argon_terms
  value: '{"Dacia":"Dacia","Norden":"Norden"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000178
  kind: argon_negation_and_modality
  value: '"giữ phủ định tuyệt đối (`Không đơn vị bình thường nào có thể hứng trọn...`)
    và giữ nguyên hai địa danh `Dacia`, `Norden`"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000179
  kind: argon_terms
  value: '{"rear guard":"đội hậu vệ","vanguard":"đội tiên phong"}'
- segment_id: YS-LN02/Text/part0032.xhtml/p000179
  kind: argon_chronology_and_modality
  value: '"giữ nguyên hai giả định trái thực tế trong quá khứ (`Nếu... có lẽ... đã
    có thể... Hoặc nếu... có thể đã...`) phản ánh cái nhìn hồi cố sau khi cả hai bộ
    phận đều không kịp thoát"'
