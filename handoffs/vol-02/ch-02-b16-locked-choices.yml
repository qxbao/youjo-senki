task_id: vol-02-ch-02-b16
baseline_sha256: 53ebb917e7941f9d6f698bee736e378f9d38d77c6db7d9a21f08304c2c90c500
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 7175e710ff8e9998858ff3a4f60f633d1401e3e49ecfd0e69a5de2f6b1c1952a
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 28
segment_id_start: YS-LN02/Text/part0014.xhtml/p000417
segment_id_end: YS-LN02/Text/part0014.xhtml/p000444
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000417
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000417: locks: [''Giữ đại từ ngôi
    thứ nhất số nhiều `chúng ta` và toàn văn câu nội tâm `Thế này sẽ khiến chúng ta
    trông giống một đội quân.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000418: locks: [''Giữ các cụm `Một
    chỉ huy cương quyết`, `giọng nói sang sảng và tư duy thiên về tấn công`, và `khiến
    mọi lời chỉ trích vô nghĩa phải im bặt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000419
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000419: locks: [''Giữ định danh
    `tên Tsuji to mồm kia`, đại từ `Hắn`, và các cụm `vùi dập nhân tài một cách bừa
    bãi, gây ra thảm họa, vậy mà vẫn được thăng chức.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000420
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000420: locks: [''Giữ các đại từ
    `các anh` / `Các anh`, `chúng`, ngôi tự xưng `tôi`, và cấu trúc phủ định – nhượng
    bộ trong câu thoại `“Nhiệm vụ của các anh là chặn chúng lại, nhưng dù thế nào
    cũng không cần chờ tôi. Các anh đánh bại được chúng thì tôi chẳng bận tâm chút
    nào.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000421
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000421: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001`, thuật ngữ `học thuyết Tsuji` (theo `vol02-ch02-b16-tsuji-doctrine`),
    định danh lịch sử `Thế chiến thứ Hai`, các đại từ `gã đó`, `hắn`, và cụm `tránh
    được việc bị truy tố tội ác chiến tranh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000422
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000422: locks: [''Giữ bản sửa theo
    signoff `F01` khôi phục giả định phản thực tế ở quá khứ (`Lẽ ra hắn đã có thể
    trở thành một chiến binh công sở, rồi sẽ mãi gây chiến nội bộ trong công ty bằng
    tham vọng thăng tiến điên cuồng.`), cùng đại từ nội tâm `mình` và cụm `những công
    dân tốt như mình—mình biết xấu hổ và có lương tâm.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000423
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000423: locks: [''Giữ các đại từ
    `chúng ta`, `Tôi`, các cụm `đại đội nào có thành tích tệ nhất thì chỉ huy đại
    đội đó sẽ đãi những người còn lại một bữa tiệc`, `một chai vang hai mươi lăm năm
    tuổi`, và `chiến đấu cho tốt nếu không muốn phá sản!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000424
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000424: locks: [''Giữ đại từ nội
    tâm `mình`, các đại từ `gã kia`, `Hắn`, tên riêng `Tsuji`, và các cụm `lách khoản
    chi tiếp khách`, `Giao thiệp với cấp dưới là một phần công việc của sếp`, `kiểm
    toán chi tiêu vô cớ`, `kiểm tra các khoản chi sai quy định.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000425
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000425: locks: [''Giữ bản sửa theo
    signoff `F02` với đại từ nội tâm `mình`, quan hệ nguyên nhân – hệ quả `Vậy nên
    mình sẽ dùng tiền của cấp dưới—sát dưới ngưỡng lạm quyền chèn ép.`, và thuật ngữ
    `lạm quyền chèn ép` (theo `vol02-ch02-b16-power-harassment`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000426
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000426: locks: [''Giữ đại từ nội
    tâm `mình`, danh xưng `chiến hữu`, và các cụm `trẻ con không được uống rượu vang`,
    `quân đội sẽ nhắm mắt cho qua`, `nước mắt mình cứ trào ra.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000427
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000427: locks: [''Giữ đúng bốn
    lớp dấu ngoặc kép đồng thanh và hiệu lệnh `““““Rõ!””””`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000428
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000428: locks: [''Giữ cách gọi
    `các quý ông` (nối mạch trực tiếp với `p000415` của `ch-02-b15`), các danh xưng
    `Hoàng đế`, `Tổ quốc`, và câu thoại `“Tốt. Nào, các quý ông. Hãy làm tròn bổn
    phận vì Hoàng đế và Tổ quốc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000429
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000429: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình`, các định danh `Hoàng đế`, `Tổ quốc`, `lương hưu quân nhân
    và đủ loại phụ cấp`, cùng vế so sánh lịch sử `vị trí chiến lược giống nước Đức
    trong Thế chiến thứ nhất…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000430
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000430: locks: [''Giữ đại từ nội
    tâm `Mình`, các ẩn dụ công sở `một công ty chắc chắn sẽ phá sản`, `một nhân viên
    sắp bị vắt kiệt ở nơi làm việc có điều kiện tồi tệ không thể chịu nổi`, và câu
    kết `Ở đây chẳng có cách nào thắng cả.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000431
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000431: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` và các cụm `nộp đơn xin tự nguyện thôi việc rồi chuyển sang
    một công ty tốt hơn`, `sẵn sàng kiện lao động.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000432: locks: [''Giữ các cụm `phản
    bội quân đội giữa thời chiến`, `một kẻ tố giác`, `tự do tín ngưỡng` (theo `vol02-ch02-b16-freedom-of-belief`),
    đại từ `họ`, và `một nhà hoạt động cánh tả cực đoan.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000433
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000433: locks: [''Giữ đại từ nội
    tâm `mình` và các mệnh đề `Xét cho hợp lý, chỉ có kẻ ngốc mới mạo hiểm phản bội
    khi chưa chắc thu về được lợi ích tương xứng. Hơn nữa, sau khi đã giết nhiều người
    trong cuộc chiến này, mình sẽ khó mà tự bảo vệ được.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000434
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000434: locks: [''Giữ bản sửa theo
    signoff `F03` với đại từ nội tâm `mình`, các cụm `một tay bắn tỉa`, `giải ngũ
    an toàn`, `đầu hàng`, `bị bắn ngay tại chỗ`, và ẩn dụ tài chính `Nói ngắn gọn,
    mình đang mua mối thù của kẻ địch ở mức giá trần.` (theo `vol02-ch02-b16-limit-up`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000435
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000435: locks: [''Giữ định danh
    `Liên minh Entente`, đại từ `chúng`, và câu thoại `“Hãy dạy cho đám ngốc Liên
    minh Entente và những kẻ còn lại một bài học. Chỉ nói suông thì chúng chẳng hiểu
    đâu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000436
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000436: locks: [''Giữ đại từ nội
    tâm `mình`, đại từ `chúng`, và các cụm `thuyết phục chúng đầu hàng một lần`, `chẳng
    có chút đầu óc kinh tế nào`, `chia đôi đất nước rồi tự đánh nhau đi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000437
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000437: locks: [''Giữ các định
    danh `Cộng hòa và Liên minh Entente`, đại từ `họ`, đại từ nội tâm `Mình`, và các
    cụm `cân bằng giữa việc công và tự do cá nhân`, `gây phiền toái đến mức nào cho
    người bình thường.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000438
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000438: locks: [''Giữ sự chuyển
    đổi giữa lời thoại (`“Chúng ta sẽ giáng một cây búa sắt từ trên trời xuống đầu
    chúng. Chúng sắp biết mình bất lực đến mức nào.”`) và câu nội tâm (`Nếu không
    thể thong thả tấn công chúng từ trên cao, mình chịu không nổi mất.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000439
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000439: locks: [''Giữ các đại từ
    `chúng ta`, `mình`, và toàn văn `Hiện giờ chúng ta còn dư sức xoay xở, nhưng chuyện
    này thật sự không tốt cho tim mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000440
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000440: locks: [''Giữ đại từ nội
    tâm `mình`, câu trích dẫn `“Đạn được gọi là viên chì vì nó nện đau điếng.”`, và
    câu kết `Nhưng mình không muốn bị bắn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000441
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000441: locks: [''Giữ định danh
    `Đại đội Một, Hai và Ba`, đại từ ngôi thứ nhất số nhiều loại trừ `Chúng tôi` (chỉ
    Tanya và Đại đội Bốn), và câu lệnh `“Đại đội Một, Hai và Ba, cứ tiến lên trước.
    Chúng tôi sẽ vòng qua đánh từ phía sau.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000442
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000442: locks: [''Giữ đại từ nội
    tâm `mình` và toàn văn `Đó là lý do mình đưa những người tình nguyện vào các tình
    huống nguy hiểm nhất—nơi có tiềm năng lập công lớn nhất.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000443
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000443: locks: [''Giữ đúng ba lớp
    dấu ngoặc kép đồng thanh, các danh xưng `Tổ quốc`, `chỉ huy của chúng ta`, và
    lời đáp `“““Rõ! Vì vinh quang của Tổ quốc và chỉ huy của chúng ta!”””`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000444: locks: [''Giữ câu thoại
    ngắn `“Chúc tất cả may mắn.”`.'']'
  non_canon: true
