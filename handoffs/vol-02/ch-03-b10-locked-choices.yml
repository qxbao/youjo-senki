segment_id_end: YS-LN02/Text/part0018.xhtml/p000087
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000064: locks: [''Giữ các cụm `vô
    nghĩa hết sức`, `phí thời gian và ngân sách`, và toàn văn câu thoại mở đầu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000065: locks: [''Giữ thuật ngữ
    đã khóa trong ledger `cuộc chiến giả` kèm ký hiệu chú thích `⁹`, đại từ `ta`,
    và các cụm `đám cuồng này`, `đánh thật`, `chuyên gia tư vấn`, `nguồn lực quản
    lý ít ỏi, kém cỏi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000066: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` theo `DEC-P01-001`, các thuật ngữ `cặp sĩ quan
    tham mưu`, `phương Bắc`, `tiền tuyến`, `đơn vị phòng thủ cơ động`, và cụm đã khóa
    trong ledger `lùi các tuyến tiếp tế về phía sau`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000067: locks: [''Giữ các định
    danh và thuật ngữ đã khóa trong ledger `Cụm tập đoàn quân phương Bắc`, `cuộc tiến
    công`, `cuộc hành quân tử thần`, `Bộ Tổng tham mưu`, và `chiến dịch đổ bộ tuyệt
    mật ở hậu phương`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000068: locks: [''Giữ câu thoại
    cảm thán `“Mấy người này mê chiến tranh quá rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000069: locks: [''Giữ các đại từ
    `tôi` / `Tôi`, `ngài`, `mình`, `họ`, và thuật ngữ đã khóa trong ledger `vật tư
    trang bị`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000070: locks: [''Giữ các đại từ
    `Tôi`, `họ`, và các cụm `xây dựng công sự trong lúc chờ tiếp tế`, `để người khác
    gánh những trận đánh ác liệt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000071
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000071: locks: [''Giữ các đại từ
    `Tôi` / `tôi`, `họ`, định danh `Bộ Tổng tham mưu`, và các cụm `hào quang của chiến
    công và chủ nghĩa quân phiệt`, `chiến dịch đổ bộ quy mô lớn ở hậu phương`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000072
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000072: locks: [''Giữ đại từ `Tôi`
    và câu thoại `“Tôi chẳng hiểu nổi thế giới này.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000073: locks: [''Giữ các đại từ
    `Tôi`, `mình`, và cụm `thú nhận sự bất tài của mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000074
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000074: locks: [''Giữ đại từ gộp
    `ta`, đại từ trần thuật `nó` theo `DEC-P01-001`, và các thuật ngữ `nhảy dù`, `các
    pháp sư không quân`, `cuộc tập kích vào hậu phương`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000075: locks: [''Giữ các tên riêng
    và định danh `MacArthur`, `Bộ Tổng tham mưu Đế quốc`, `Tướng von Rudersdorf`,
    `Tanya`, các đại từ `gã đó`, `họ`, `chúng ta`, `mình`, `ông` cùng thì tương lai
    `Đây sẽ là lần đầu mình chiến đấu theo kế hoạch tác chiến của Tướng von Rudersdorf`
    theo bản sửa followup M1, và đúng phạm vi nhấn mạnh in nghiêng `*Chuyện này có
    khi lại xuôi chèo mát mái*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000076
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000076: locks: [''Giữ đại từ `tôi`
    và câu mệnh lệnh `“Lấy cho tôi thêm một tấm bản đồ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000077
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000077: locks: [''Giữ câu đáp lễ
    phép của cấp dưới `“Đây ạ, thưa ngài.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000078
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000078: locks: [''Giữ cấu trúc
    phủ định kép `Nhưng không có nghĩa là chẳng có vấn đề gì.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000079
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000079: locks: [''Giữ đại từ trần
    thuật `Nó` theo `DEC-P01-001`, và các cụm `tấm bản đồ toàn bộ chiến trường phía
    bắc`, `cấp dưới`, `bản đồ tình hình đã ghi chú`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000080
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000080: locks: [''Giữ đại từ trần
    thuật `Nó` và đại từ `mình` theo `DEC-P01-001`, cùng các thuật ngữ `các vịnh hẹp`,
    `phòng thủ bờ biển`, `nã pháo`, `khẩu đội pháo`, `bất khả xâm phạm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000081
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000081: locks: [''Giữ các tên riêng
    `Tanya`, `Singapore`, đại từ phản thân `mình`, và các cụm `pháo đài dựng để chống
    địch từ phía biển`, `cuộc xâm lăng đường bộ`, `di chuyển các quân cờ theo kịch
    bản mình hình dung`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000082
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000082: locks: [''Giữ các đại từ
    `ta`, `chúng` / `Chúng`, và các thuật ngữ `Các khẩu đội pháo`, `những vịnh hẹp`,
    `hạm đội chiến hạm`, `chiến hạm`, `thuốc nổ`, `Pháo bờ biển`, `cửa vịnh`, `pháo
    kích từ phía sau`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000083
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000083: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu hỏi đầu đoạn `*Ta có thắng được không?*` theo `DEC-P01-002`,
    các tên riêng `Tanya`, `Thung lũng Moomin`, đại từ `chúng`, và cụm `lớp vỏ phòng
    thủ của chúng có thể bị phá vỡ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000084
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000084: locks: [''Giữ đại từ `Tôi`
    và câu thoại `“Tấn công từ phía sau… Tôi nghĩ cơ hội thành công cũng khá ổn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000085
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000085: locks: [''Giữ đại từ `ta`,
    tên riêng `Tanya`, định danh `Bộ Tổng tham mưu`, và các cụm `Rời con tàu đang
    chìm`, `trận đánh có thể thắng`, `tấm bản đồ dự báo chiến sự`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000086
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000086: locks: [''Giữ các định
    danh và thuật ngữ đã khóa trong ledger `Bộ Tổng tham mưu`, `phương án dự phòng`,
    `Cục Tác chiến`, `những sĩ quan cấp trưởng phòng`, `lực lượng phía bắc`, `“lời
    khuyên”`, `các tập đoàn quân khu vực`, cùng các đại từ `họ`, `mình`, `tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000087
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000087: locks: [''Giữ các tên riêng
    và định danh `Đại quân`, `Norden`, `Ludwig`, `Bộ Tổng tham mưu`, `hội đồng cố
    vấn của Hoàng đế Bệ hạ`, `quyền lực tối cao`, `cụm tập đoàn quân khu vực`, cùng
    đại từ `họ`.'']'
  non_canon: true
