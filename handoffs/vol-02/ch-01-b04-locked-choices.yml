segment_id_end: YS-LN02/Text/part0010.xhtml/p000087
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000060: locks: [''Giữ cấp bậc `Thiếu
    úy` theo M1, cách gọi đơn vị `mọi người` và nhịp tự đính chính `đây là chiến tranh.
    À, một thứ gì đó giống chiến tranh… và nó sắp bắt đầu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000061: locks: [''Giữ tên riêng
    `Tanya` trong trần thuật và các cụm `vẻ phấn khích vô thức`, `nụ cười rạng rỡ
    niềm vui thuần khiết`, `gần như hát lên cho mọi người nghe Tanya vui đến thế nào`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000062: locks: [''Giữ cách xưng
    hô `tôi` – `mọi người` – `chúng ta`, danh xưng `Công quốc Dacia` và cụm `những
    mục tiêu bất ngờ cho buổi diễn tập bắn đạn thật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000063: locks: [''Giữ đại từ nội
    tâm `Mình` theo DEC-P01-001 và giọng mỉa mai `Mấy anh lính Dacia thật tốt bụng
    khi tự nguyện đem mình ra làm bia.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000064: locks: [''Giữ cách gọi
    `Mọi người` và hai vế tùy chọn `bắn họ bằng đạn hoặc nổ tung họ bằng phép thuật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000065: locks: [''Giữ phủ định
    `Họ thậm chí chẳng có cơ hội nào`, đại từ `chúng ta` và lựa chọn thuật ngữ tạm
    `cuộc bắn gà tây lớn hơn cả ở quần đảo Mariana`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000066: locks: [''Giữ cách gọi
    `Mọi người`, đại từ `chúng ta` và ẩn dụ `dạy cho bọn xâm lược này một bài học
    bằng chiếc búa sắt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000067: locks: [''Giữ tên riêng
    `Tanya` ở cả hai câu trần thuật theo M4, cụm `đội quân Dacia tưởng tượng` và giữ
    nhấn mạnh `*Đánh chúng nhừ tử!*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000068: locks: [''Giữ các cụm `lực
    lượng tiên phong của Quân đội Đế quốc`, `đội tiên phong của quân Dacia` và tên
    riêng `Tanya` ở vế sau theo M4.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000069: locks: [''Giữ cách xưng
    hô `Tôi` – `chúng ta` – `mọi người` (theo M5) – `ta` – `Các quý ông`, sắc thái
    tình thái `trên lý thuyết`, phủ định `Tôi không nghĩ ai trong số mọi người ngu
    đến mức để bị bắn hạ` và cụm `diễn tập bắn đạn thật`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000070: locks: [''Giữ lựa chọn
    thuật ngữ tạm `cuộc săn người` và câu ngắn `Một môn thể thao.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000071
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000071: locks: [''Giữ điển cố `hiệp
    sĩ huyền thoại Don Quixote`, đại từ `chúng ta` và đối lập `một đám anh hùng lỗi
    thời từ thời đại đã qua, đang thách thức một con quái vật hiện đại đáng sợ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000072
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000072: locks: [''Giữ các cụm `nhân
    viên hậu phương`, `Bộ Tổng tham mưu`, `trấn giữ cứ điểm`, `Quân đội Đế quốc`,
    `đội tiên phong quân Dacia`, `chừng ba sư đoàn`, `đội hình công kích hoàn hảo`
    và lặp tên riêng `Tanya` theo M4.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000073: locks: [''Giữ tên riêng
    `Tanya` ở cả hai câu theo M4 và cụm `các đơn vị tuần tra biên giới của Quân đội
    Đế quốc đang sơ tán`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000074
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000074: locks: [''Giữ nhận xét
    `bất kể quân Dacia đang tính toán chiến lược nào thì đó cũng chỉ là thứ đồ cổ
    thời trung cổ` và các cụm `chuẩn bị lượt công kích`, `một khối người lúc nhúc
    nơi đường chân trời`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000075: locks: [''Giữ các cụm `Học
    thuyết quân sự lỗi thời`, `đòn phép thuật hay oanh tạc từ trên không`, và cặp
    thuật ngữ đã phân biệt theo M6: `nhân lực` (`một núi nhân lực bị lãng phí`) và
    `vốn con người` (`Có vốn con người dồi dào đến thế mà hoàn toàn không biết tận
    dụng`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000076
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000076: locks: [''Giữ các danh
    xưng `Quân đội Đế quốc`, `Công quốc Dacia` và giọng mỉa mai về `những góa phụ
    và người cao tuổi đau khổ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000077
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000077: locks: [''Giữ nguyên hô
    hiệu `Aconitum 01`, khẩu lệnh `gọi tất cả các đơn vị. Chiến dịch bắt đầu!` và
    giữ nhấn mạnh `*chiến tranh*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000078
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000078: locks: [''Giữ thuật ngữ
    `pháp sư không quân` theo M7, tỷ lệ đội hình `ba trong bốn đại đội tấn công từ
    ba hướng khác nhau`, đại từ nội tâm `mình` theo DEC-P01-001, cụm `tranh quyền
    kiểm soát bầu trời` và hình ảnh `diễn viên quần chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000079
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000079: locks: [''Giữ lời gọi `Các
    đại đội trưởng` và cặp đại từ `tôi` – `mọi người`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000080
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000080: locks: [''Giữ ba cặp dấu
    ngoặc kép đồng thanh và khẩu lệnh đáp `“““Rõ!”””`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000081
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000081: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` xuyên suốt theo DEC-P01-001, các thuật ngữ `lực lượng dự bị`,
    `Các đại đội tấn công`, `phòng không`, `các pháp sư của mình` và câu điều kiện
    cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000082
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000082: locks: [''Giữ cách xưng
    hô `Tôi` – `Thiếu úy` (theo M1) – `Chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000083
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000083: locks: [''Giữ đại từ nội
    tâm `mình` ở câu đầu theo DEC-P01-001, mốc thời gian `Tiểu đoàn được thành lập
    đã hai tháng`, tên riêng `Tanya` cùng danh xưng `Bộ Tổng tham mưu` ở câu trần
    thuật tiếp theo.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000084
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000084: locks: [''Giữ đại từ ngôi
    thứ nhất `Tôi` cho lời thoại của sĩ quan phụ tá Serebryakov theo M2.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000085
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000085: locks: [''Giữ cách gọi
    bằng cấp bậc `Thiếu úy` theo m12/vol02-ch01-b04-serebryakov-address, quy mô `ba
    sư đoàn còm cõi` và danh xưng `cựu binh mặt trận Rhine`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000086
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000086: locks: [''Giữ cách xưng
    hô `tôi` – `Thiếu tá` / `ngài`, giữ đúng phạm vi nhấn mạnh `*ba sư đoàn*` theo
    M3 và DEC-P01-002, cùng nhịp ngập ngừng cuối câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000087
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000087: locks: [''Giữ đại từ nội
    tâm `Mình` theo DEC-P01-001, danh xưng đầy đủ `Thiếu úy Serebryakov` theo M1,
    cụm `Đơn vị Dacia` và quy mô `ba sư đoàn`.'']'
  non_canon: true
