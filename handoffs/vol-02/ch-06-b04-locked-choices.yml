segment_id_start: YS-LN02/Text/part0030.xhtml/p000094
segment_id_end: YS-LN02/Text/part0030.xhtml/p000131
choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000094: terms: [''Arene'', ''đầu
    mối trung chuyển chính'', ''bãi dồn tàu'', ''tuyến nhánh'', ''mặt trận'', ''Bộ
    phận Đường sắt'', ''Lục quân Đế quốc'', ''hậu cần'', ''gót chân Achilles'']: pronouns_and_address:
    Trần thuật ngôi thứ ba khách quan; quy chiếu các tuyến nhánh bằng `chúng`.: pov_and_voice:
    Giọng trần thuật phân tích tình thế bế tắc về đường sắt và hậu cần của Lục quân
    Đế quốc.: modality_and_logic: Bảo toàn đủ 4 câu: không có tuyến đường sắt thay
    thế; vị trí đầu mối trung chuyển có bãi dồn tàu của Arene; vẻ mặt tái mét tuyệt
    vọng của nhân viên Bộ phận Đường sắt trả lời cho câu hỏi liệu các tuyến nhánh
    có phục vụ nổi mặt trận không; và việc Lục quân Đế quốc một lần nữa nhận ra trục
    trặc hậu cần là gót chân Achilles khi tiến quân, nhất là sau khi đã cô lập kẻ
    địch ở phía bắc.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000095: terms: [''chỉ huy'', ''Feldgendarmerie'',
    ''nổi loạn'']: pronouns_and_address: Quy chiếu các chỉ huy bằng đại từ `họ`.:
    pov_and_voice: Giọng trần thuật bám sát suy nghĩ tức giận của các chỉ huy.: modality_and_logic:
    Bảo toàn quan hệ nhân quả: điều thoáng qua tâm trí các chỉ huy trong khoảnh khắc
    là trận mắng xối xả họ sẽ trút lên Feldgendarmerie vì đã không dập tắt được những
    tia lửa nổi loạn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000096: terms: [''Vị tư lệnh quân
    đoàn'']: pronouns_and_address: Lời mỉa mai trực tiếp dùng danh ngữ miệt thị `Lũ
    ăn bám vô dụng`.: pov_and_voice: Giọng cười khẩy cay độc hướng về lực lượng quân
    cảnh dã chiến.: modality_and_logic: Bảo toàn cấu trúc phủ định mở rộng chủ thể
    (`không phải người duy nhất khẽ cười khẩy`) và câu thoại ngắn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000097: terms: [''Feldgendarmerie'',
    ''quân cảnh'']: pronouns_and_address: Quy chiếu vị tư lệnh quân đoàn bằng `Ông
    ta`; câu rủa thầm lược đại từ chủ ngữ để giữ giọng quát tháo tự nhiên; quy chiếu
    các sĩ quan hiện diện bằng `ai` / `tất cả`.: pov_and_voice: Đan xen giữa trần
    thuật ngôi thứ ba, câu rủa thầm gay gắt trong nội tâm và hành động bất mãn tập
    thể.: modality_and_logic: Bảo toàn đủ 3 câu: sự bất mãn trước thái độ lười biếng
    của đám Feldgendarmerie thuộc quân cảnh; câu rủa thầm đuổi về quê ngủ trưa; và
    mệnh đề nhượng bộ (`Dù chẳng ai nói thành lời, tất cả đều rên rỉ rồi nhổ xuống
    đất`).: emphasis: Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`:
    chỉ bọc dấu `*...*` quanh câu độc thoại nội tâm ở giữa đoạn (`*Nếu có thói quen
    ngủ trưa thì xéo về quê mà ngủ.*`) tương ứng thẻ `<html:em>`, giữ nguyên hai câu
    trần thuật ở dạng chữ thường.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000098: terms: [''đại đội pháp
    sư'']: pronouns_and_address: Người lẩm bẩm dùng đại từ gộp `ta` cho phía quân
    đội Đế quốc.: pov_and_voice: Giọng tiếc nuối, ngao ngán trong lời lẩm bẩm của
    một sĩ quan.: modality_and_logic: Bảo toàn quan hệ mức độ – hệ quả (`Tình cảnh
    thảm hại đến mức có người lẩm bẩm`) và giả định trái thực tế trong quá khứ (`Giá
    mà có một đại đội pháp sư trung thành, dũng cảm của ta thì đã tránh được chuyện
    này`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000099: terms: []: pronouns_and_address:
    Quy chiếu các chỉ huy và sĩ quan tại sở chỉ huy bằng `Họ`.: pov_and_voice: Giọng
    trần thuật ngắn gọn, dồn dập.: modality_and_logic: Bảo toàn hai câu: tình hình
    đang xấu đi nhanh chóng và họ không khỏi lo điều tồi tệ nhất sẽ xảy ra.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000100: terms: [''Bạo loạn'', ''hậu
    phương'', ''đơn vị'']: pronouns_and_address: Trần thuật khách quan không dùng
    đại từ nhân xưng.: pov_and_voice: Nhịp câu ngắn, đanh gọn tóm tắt thế kẹt chiến
    dịch.: modality_and_logic: Bảo toàn nguyên nhân (`Bạo loạn ở hậu phương`) và hệ
    quả (`Vì thế mà các đơn vị bị mắc kẹt`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000101: terms: [''mặt trận'', ''Cộng
    hòa'', ''nguồn tiếp tế'']: pronouns_and_address: Câu hỏi nội tâm dùng đại từ gộp
    `ta`; phần trần thuật quy chiếu phía quân đoàn Đế quốc bằng `họ`.: pov_and_voice:
    Câu hỏi nội tâm căng thẳng mở đầu đoạn, tiếp nối bằng phân tích thế tiến thoái
    lưỡng nan.: modality_and_logic: Bảo toàn câu hỏi giả định ở đầu đoạn (`*Nếu ta
    dịch chuyển mặt trận, Cộng hòa sẽ phản ứng chứ?*`), hệ quả kiềm chế điều quân
    khi nỗi lo ấy còn đó, và mệnh đề điều kiện đối lập về nguy cơ mất khả năng chiến
    đấu nếu nguồn tiếp tế bị gián đoạn dù chỉ vài ngày.: emphasis: Bảo toàn chính
    xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh
    câu hỏi nội tâm đầu đoạn tương ứng thẻ `<html:em>`, giữ hai câu trần thuật sau
    ở dạng chữ thường.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000102: terms: [''Arene'', ''pháp
    sư Cộng hòa'', ''quân nổi dậy'']: pronouns_and_address: Quy chiếu quân nổi dậy
    và pháp sư Cộng hòa bằng `chúng`.: pov_and_voice: Giọng trần thuật xen nhận định
    thực tế đầy khó khăn.: modality_and_logic: Bảo toàn chuỗi 3 câu: yêu cầu bắt buộc
    phải loại bỏ mối đe dọa ở Arene -> nhận xét nói thì dễ -> lý do thực tế là việc
    nhanh chóng tiêu diệt quân nổi dậy sẽ vô cùng khó khăn khi pháp sư Cộng hòa đã
    hội quân với chúng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000103: terms: [''Bộ phận Tác chiến'']:
    pronouns_and_address: Tham mưu trưởng thưa vị tư lệnh quân đoàn là `thưa ngài`.:
    pov_and_voice: Giọng báo cáo quân sự chuẩn mực của tham mưu trưởng và lời mời
    Bộ phận Tác chiến trình bày.: modality_and_logic: Bảo toàn lời xác nhận đã có
    phương án và yêu cầu Bộ phận Tác chiến giải thích.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000104: terms: [''bộ tham mưu'']:
    pronouns_and_address: Dùng đại từ khái quát ngôi thứ nhất gộp `ta` cho đại từ
    ngôi thứ hai phiếm chỉ trong câu nhận định chung.: pov_and_voice: Giọng bình luận
    khách quan ghi nhận năng lực chuẩn bị tình huống của bộ tham mưu.: modality_and_logic:
    Bảo toàn cả hai câu cùng đúng mức độ tình thái (`có thể không giải quyết được
    mọi việc, nhưng có thể giúp ta xử lý vấn đề`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000105: terms: [''nghiên cứu chiến
    lược'']: pronouns_and_address: Sĩ quan Bộ phận Tác chiến thưa `Thưa ngài` và tự
    xưng `Chúng tôi`.: pov_and_voice: Giọng báo cáo trang trọng, mang tính kỹ thuật
    tham mưu.: modality_and_logic: Bảo toàn đầy đủ các thuộc tính của kế hoạch: được
    xây dựng từ góc nhìn thuần túy quân sự, nhằm đạt một mục tiêu rất hạn chế, và
    được đặt ra trong khuôn khổ nghiên cứu chiến lược.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000106: terms: []: pronouns_and_address:
    Câu hỏi ngắn của vị tư lệnh quân đoàn không dùng đại từ nhân xưng.: pov_and_voice:
    Giọng hỏi gấp gáp, đi thẳng vào tính thực tiễn.: modality_and_logic: Bảo toàn
    hai câu hỏi liên tiếp (`Sao? Thực sự có thể dùng được à?`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000107: terms: []: pronouns_and_address:
    Quy chiếu bộ tham mưu / những người lập kế hoạch bằng `họ`.: pov_and_voice: Giọng
    trần thuật làm rõ mối quan tâm duy nhất của vị tư lệnh.: modality_and_logic: Bảo
    toàn mệnh đề nghi vấn gián tiếp (`có dùng được hay không`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000108: terms: []: pronouns_and_address:
    Quy chiếu vị tư lệnh quân đoàn bằng `Ông ta`.: pov_and_voice: Giọng trần thuật
    phản ánh tâm thế sẵn sàng chấp nhận biện pháp quyết liệt của vị tư lệnh.: modality_and_logic:
    Bảo toàn đủ 3 câu: tình hình rất tệ; một kế hoạch nửa vời sẽ chẳng ích gì; và
    điều kiện duy nhất để ông ta chấp nhận bất cứ phương án nào là nó giải quyết dứt
    điểm vấn đề chỉ trong một lần.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000109: terms: []: pronouns_and_address:
    Quy chiếu vị tư lệnh quân đoàn bằng `ông ta`.: pov_and_voice: Nhịp câu chùng xuống
    với dấu ba chấm mở đầu thể hiện sự dè dặt.: modality_and_logic: Bảo toàn dấu `…`
    đầu câu và nhận định dự cảm rằng nghe giọng điệu báo cáo kia thì ông ta chẳng
    thể kỳ vọng nhiều.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000110: terms: []: pronouns_and_address:
    Câu trả lời của viên sĩ quan tham mưu lược chủ ngữ.: pov_and_voice: Giọng báo
    cáo vừa khẳng định hiệu quả kỹ thuật vừa ngập ngừng trước sức nặng của quyết định.:
    modality_and_logic: Bảo toàn sự tương phản giữa vế khẳng định chắc chắn (`chắc
    chắn sẽ đạt được một số kết quả`) và vế ngập ngừng có từ cảm thán chen giữa (`Nhưng
    sẽ cần đưa ra một quyết định, ừm, rất quan trọng…`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000111: terms: []: pronouns_and_address:
    Quy chiếu vị tư lệnh quân đoàn bằng `ông ta` kết hợp phản thân `mình`.: pov_and_voice:
    Câu mệnh lệnh nội tâm sốt ruột đặt cạnh hành động tự kiềm chế bên ngoài.: modality_and_logic:
    Bảo toàn ý tự kìm mình để không quát thành tiếng câu thúc giục.: emphasis: Bảo
    toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*`
    quanh cụm độc thoại nội tâm `*Nói thẳng ra đi*` tương ứng thẻ `<html:em>`, giữ
    phần dẫn trần thuật ngoài dấu nhấn mạnh.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000112: terms: []: pronouns_and_address:
    Vị tư lệnh quân đoàn dùng đại từ gộp `Chúng ta` ở câu đầu và tự xưng `tôi` ở câu
    mệnh lệnh thứ hai.: pov_and_voice: Giọng chỉ huy nghiêm khắc, hối thúc cấp dưới
    báo cáo thẳng.: modality_and_logic: Bảo toàn câu phủ định về thời gian và câu
    mệnh lệnh yêu cầu nói rõ kế hoạch là gì.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000113: terms: [''ủy ban nghiên
    cứu chiến lược'', ''Học viện Quân sự'', ''đơn vị địch'', ''pháp sư'', ''tuyến
    phòng thủ'']: pronouns_and_address: Viên sĩ quan tham mưu thưa `Vâng, thưa ngài`.:
    pov_and_voice: Giọng thuyết trình tham mưu súc tích.: modality_and_logic: Bảo
    toàn đầy đủ nguồn gốc kế hoạch (do ủy ban nghiên cứu chiến lược của Học viện Quân
    sự đệ trình) và mục tiêu tác chiến (tiêu diệt trong thời gian cực ngắn các đơn
    vị địch, kể cả pháp sư, đang dựng tuyến phòng thủ trong đô thị).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000114: terms: [''vị tư lệnh quân
    đoàn'', ''ủy ban nghiên cứu chiến lược'', ''Học viện Quân sự'', ''pháp sư'']:
    pronouns_and_address: Quy chiếu ủy ban nghiên cứu chiến lược bằng `họ` ở câu hai,
    và quy chiếu phía quân đoàn bằng `họ` ở câu ba.: pov_and_voice: Giọng trần thuật
    bám sát quá trình đánh giá của vị tư lệnh quân đoàn vốn đang hoài nghi.: modality_and_logic:
    Bảo toàn chuỗi suy luận 3 câu: nghe qua có vẻ hiệu quả -> nếu ủy ban nghiên cứu
    chiến lược của Học viện Quân sự đệ trình thì hẳn họ đã công nhận tính khả thi
    -> nếu thực sự dùng nó để nhanh chóng loại bỏ pháp sư và các hệ thống phòng thủ
    trong đô thị thì kế hoạch sẽ vô giá trong tình cảnh hiện tại.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000115: terms: [''quân đội'']:
    pronouns_and_address: Quy chiếu kế hoạch bằng `nó`.: pov_and_voice: Giọng ngạc
    nhiên xen lẫn thắc mắc hợp lý của vị tư lệnh quân đoàn.: modality_and_logic: Bảo
    toàn dấu `…` mở đầu, câu hỏi đuôi xác nhận tính đột phá (`phải không?`) và câu
    hỏi vì sao kế hoạch không được phổ biến rộng rãi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000116: terms: []: pronouns_and_address:
    Câu hỏi nội tâm ngắn gọn lược đại từ.: pov_and_voice: Giọng tự vấn trực diện trong
    suy nghĩ của vị tư lệnh.: modality_and_logic: Bảo toàn câu hỏi điều kiện (`*Nếu
    hữu dụng đến thế thì sao không chia sẻ?*`).: emphasis: Bảo toàn dấu nhấn mạnh
    `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000117: terms: [''Công ước Worms'',
    ''tham mưu trưởng'', ''hiệp ước quốc tế'']: pronouns_and_address: Quy chiếu kế
    hoạch bằng `Nó` trong câu hỏi của tham mưu trưởng.: pov_and_voice: Câu hỏi trực
    tiếp của tham mưu trưởng nối kết với lời dẫn giải thích mối lo pháp lý quốc tế.:
    modality_and_logic: Bảo toàn câu hỏi nghi vấn về việc vi phạm Công ước Worms và
    sắc thái suy đoán (`Có lẽ cũng đang nghĩ đến điều tương tự`) khi tham mưu trưởng
    nêu lên mối lo về một hiệp ước quốc tế.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000118: terms: [''khí độc'', ''pháo
    hạng nặng'', ''Bộ Tổng tham mưu'']: pronouns_and_address: Quy chiếu các chỉ huy
    tại cuộc họp bằng `Họ`.: pov_and_voice: Giọng trần thuật phân tích các giả định
    thông thường về vũ khí công thành.: modality_and_logic: Bảo toàn đủ 3 câu: họ
    hình dung sẽ khó chiếm nhanh thành phố và dập tắt kháng cự nếu không dùng khí
    độc hoặc pháo hạng nặng; dĩ nhiên không được phép dùng khí độc trong thành phố;
    và ngay cả Bộ Tổng tham mưu có lẽ cũng chẳng có kế hoạch phòng thủ trước khí độc.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000119: terms: [''chuyên gia pháp
    lý'', ''hiệp ước hiện hành'']: pronouns_and_address: Quy chiếu kế hoạch bằng `nó`.:
    pov_and_voice: Giọng báo cáo trấn an về mặt pháp lý của viên sĩ quan tham mưu.:
    modality_and_logic: Bảo toàn lời phủ định mở đầu (`Không`) và thông tin dẫn nguồn
    từ các chuyên gia pháp lý rằng kế hoạch không xung đột với bất kỳ hiệp ước hiện
    hành nào.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000120: terms: []: pronouns_and_address:
    Lời thoại ngắn không dùng đại từ nhân xưng.: pov_and_voice: Giọng truy vấn dứt
    khoát của vị tư lệnh quân đoàn.: modality_and_logic: Bảo toàn nhận định (`Càng
    tốt.`) và câu hỏi trực diện (`Vậy vấn đề là gì?`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000121: terms: []: pronouns_and_address:
    Độc thoại nội tâm dùng đại từ ngôi thứ nhất số nhiều `chúng ta`.: pov_and_voice:
    Giọng độc thoại nội tâm thúc bách của vị tư lệnh quân đoàn.: modality_and_logic:
    Bảo toàn hai câu nội tâm: nếu hợp pháp thì chẳng có lý do gì phải chần chừ, và
    thực sự họ không thể phí thêm dù chỉ một giây.: emphasis: Bảo toàn dấu nhấn mạnh
    `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000122: terms: [''chuyên gia pháp
    lý'', ''Vị tư lệnh quân đoàn'', ''viên tham mưu'']: pronouns_and_address: Quy
    chiếu phía bộ chỉ huy quân đoàn bằng `Họ`.: pov_and_voice: Giọng trần thuật miêu
    tả cử chỉ mất kiên nhẫn của vị tư lệnh quân đoàn.: modality_and_logic: Bảo toàn
    hai câu: không có thời gian tranh luận với các chuyên gia pháp lý; vị tư lệnh
    quân đoàn bực tức đập bàn và dùng ánh mắt thúc giục viên tham mưu đang do dự tiếp
    tục nói.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000123: terms: [''người không tham
    chiến'', ''lực lượng địch'']: pronouns_and_address: Câu báo cáo khách quan không
    dùng đại từ nhân xưng.: pov_and_voice: Giọng trình bày tiền đề lý thuyết lạnh
    lùng của viên tham mưu.: modality_and_logic: Bảo toàn chính xác giả định cốt lõi
    của kế hoạch: xét từ góc độ thuần túy quân sự, trong thành phố không có người
    không tham chiến mà chỉ có lực lượng địch.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000124: terms: []: pronouns_and_address:
    Dùng đại từ gộp `ta` trong câu hỏi của vị tư lệnh quân đoàn.: pov_and_voice: Giọng
    phản ứng gay gắt trước một giả định phi thực tế.: modality_and_logic: Bảo toàn
    hai câu hỏi liên tiếp chất vấn ý nghĩa của câu nói và làm sao có thể dùng một
    kế hoạch dựa trên giả định khó tin đến vậy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000125: terms: [''lính địch'']:
    pronouns_and_address: Quy chiếu vị tư lệnh quân đoàn bằng `Ông ta`.: pov_and_voice:
    Giọng trần thuật kết hợp nhận định lẽ thường hiển nhiên.: modality_and_logic:
    Bảo toàn mức độ tự kìm nén (`Ông ta suýt hét lên rằng thật ngu xuẩn`) và câu phủ
    định tuyệt đối (`Chẳng có thành phố nào chỉ toàn lính địch sinh sống`).: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000126: terms: [''thường dân'',
    ''dân quân'', ''Arene'']: pronouns_and_address: Quy chiếu quân đội Đế quốc bằng
    `họ`.: pov_and_voice: Giọng trần thuật nêu thực tế nhân khẩu đô thị và dữ kiện
    đã xác nhận tại Arene.: modality_and_logic: Bảo toàn đủ 3 câu: cư dân thành phố
    phần lớn là thường dân; cùng lắm chỉ có dân quân lẫn trong đó; và khi chiếm Arene
    họ đã xác nhận có rất nhiều thường dân sinh sống tại đấy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000127: terms: [''thủ tục hợp pháp'']:
    pronouns_and_address: Viên tham mưu dùng đại từ gộp `ta`.: pov_and_voice: Giọng
    giải thích bình thản nhưng rợn người về việc dùng thủ tục pháp lý để hợp thức
    hóa điều kiện tác chiến.: modality_and_logic: Bảo toàn từ mở đầu (`À`) và phương
    thức tạo ra điều kiện giả định bằng cách tuân theo một thủ tục hợp pháp.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000128: terms: []: pronouns_and_address:
    Quy chiếu hai người đối thoại bằng `Cả người trả lời lẫn người đặt câu hỏi`.:
    pov_and_voice: Giọng trần thuật khắc họa bầu không khí căng thẳng bị nén chặt
    dưới vẻ ngoài vô cảm.: modality_and_logic: Bảo toàn mục đích của việc cả hai đều
    nói bằng giọng đều đều là để che giấu cảm xúc.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000129: terms: [''chuyên gia pháp
    lý'', ''người không tham chiến'']: pronouns_and_address: Viên tham mưu dùng đại
    từ gộp `ta`.: pov_and_voice: Giọng nói thẳng bản chất lừa dối pháp lý của phương
    án.: modality_and_logic: Bảo toàn đầy đủ 2 câu và đúng đối tượng bị loại trừ ở
    cuối câu: thừa nhận ngắn gọn đó là một kiểu lừa dối; theo các chuyên gia pháp
    lý, kế hoạch chỉ hợp lệ khi đã loại trừ sự hiện diện của người không tham chiến,
    nên họ chỉ cần đảm bảo không còn người không tham chiến.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000130: terms: []: pronouns_and_address:
    Câu hỏi xác nhận dùng đại từ gộp `ta`.: pov_and_voice: Giọng hỏi trầm đục khi
    lột trần hệ quả thực tế của thủ thuật pháp lý.: modality_and_logic: Bảo toàn dấu
    `…` mở đầu và câu hỏi suy luận trực diện: vậy là cứ giết hết mọi người bất kể
    giới tính hay tuổi tác?: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000131: terms: [''chiến đấu trong
    đô thị'', ''trận chiến đô thị'', ''tính hợp pháp trên thực tế'']: pronouns_and_address:
    Quy chiếu các sĩ quan trong phòng họp bằng `mọi người` / `Ai` / `họ`.: pov_and_voice:
    Giọng trần thuật khép lại lô với nhận thức chung lạnh người của toàn bộ phòng
    họp.: modality_and_logic: Bảo toàn đủ 4 câu: điều đó rõ rành rành; hình ảnh chiến
    đấu trong đô thị hiện lên trong đầu mọi người; thực chất là một cuộc thảm sát
    đẫm máu đội lốt trận chiến đô thị; và ai cũng hiểu nếu bị yêu cầu nghiêm túc tiến
    hành cuộc chiến bẩn thỉu này thì họ chẳng thể bận tâm đến tính hợp pháp trên thực
    tế.: emphasis: none'
  non_canon: true
