task_id: vol-02-ch-02-b11
baseline_sha256: 74c4217baba5636079d8e7f652419bd961aa04348db88a7a776fd64c4a15a5ef
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 474d499afed7491bbf260f099b4e3b1502227afb8961f3026cc40f3c45ca056c
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 42
segment_id_start: YS-LN02/Text/part0014.xhtml/p000258
segment_id_end: YS-LN02/Text/part0014.xhtml/p000299
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000258
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000258: locks: [''Giữ câu thoại
    đã sửa theo signoff `M1` và `M2` với các danh xưng `Tiểu đoàn Pháp sư Không quân
    203`, `Tiểu đoàn Pixie`, đại từ `Chúng ta`, và cặp ngoặc đơn/kép đóng cân bằng:
    `“Chúng ta vừa nhận được điện báo từ Tiểu đoàn Pháp sư Không quân 203. ‘Đây là
    Tiểu đoàn Pixie.’ Ờ…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000259
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000259: locks: [''Giữ thuật ngữ
    đã đồng bộ theo signoff `hiệu gọi` (theo `vol02-ch02-b11-call-sign`), danh xưng
    `nhân viên điện đài`, đại từ `họ`, và toàn văn `Một điện báo từ tiểu đoàn tiếp
    viện đang trên đường đến ư? Bình thường họ sẽ đọc hiệu gọi, thế là xong, nhưng
    chẳng hiểu sao nhân viên điện đài lại ngập ngừng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000260
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000260: locks: [''Giữ lời thúc
    giục `“Không sao, cứ đọc đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000261
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000261: locks: [''Giữ cụm `Một
    sĩ quan tham mưu đầy nghi hoặc`, đại từ `anh ta`, và câu `Một sĩ quan tham mưu
    đầy nghi hoặc giục anh ta nói tiếp, cuối cùng anh ta cũng đọc tiếp.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000262
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000262: locks: [''Giữ nguyên văn
    thông điệp trích dẫn lồng trong ngoặc đơn với đại từ `Chúng tôi` và danh xưng
    `Tiểu đoàn Viper`: `“Thông điệp ghi: ‘Chúng tôi không cần chi viện. Yêu cầu Tiểu
    đoàn Viper lập tức rút lui.’”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000263
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000263: locks: [''Giữ bản sửa theo
    signoff `M3` (và `m3`) bảo toàn đúng ba vùng nhấn mạnh in nghiêng theo `DEC-P01-002`,
    danh xưng `Tiểu đoàn Viper`, đại từ `họ`, và cụm đối lập `*đáng nể*` – `*quá*
    tự tin`: `*“Không cần chi viện” ư? Tiểu đoàn Viper đã đánh chặn từ nãy đến giờ,
    vậy mà họ muốn đơn vị ấy rút lui?* Mức độ tự tin này đã vượt xa mức *đáng nể*
    để thành *quá* tự tin rồi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000264
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000264: locks: [''Giữ bản sửa theo
    signoff `M7` với các cụm `hai tiểu đoàn pháp sư và máy bay ném bom đang tiếp viện`,
    tình thái `Có vẻ`, và cụm tương thích không quân `một tiểu đoàn tấn công vừa tới
    sau chặng cơ động cấp tốc, nên khó lòng tự mình xử lý nổi chuyện đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000265
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000265: locks: [''Giữ bản sửa theo
    signoff `M5` bảo toàn nghĩa bị buộc/được mong đợi phải giao quyền chỉ huy và phủ
    định dứt khoát ở câu sau: `Chẳng lẽ các đơn vị phải bị đặt dưới quyền một chỉ
    huy không hiểu điều đó sao? Chuyện ấy tuyệt đối không thể chấp nhận.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000266
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000266: locks: [''Giữ dấu ba chấm
    mở đầu, đại từ `Ta`, các thuật ngữ `tiêm kích`, `đánh chặn`, và câu hỏi `“…Ta
    có thể điều động tiêm kích lên đánh chặn bất cứ lúc nào, đúng không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000267
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000267: locks: [''Giữ cụm `Mọi
    nhà chứa máy bay đều đã sẵn sàng.`, đại từ `chúng tôi`, và câu `Chỉ cần ra lệnh
    là chúng tôi có thể cho máy bay cất cánh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000268
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000268: locks: [''Giữ các cụm `Vài
    sĩ quan tham mưu`, `kế hoạch đánh chặn của riêng mình`, và `Dù thời gian leo cao
    có hạn, tiêm kích cất cánh từ mặt đất hẳn vẫn có thể khống chế máy bay ném bom.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000269
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000269: locks: [''Giữ đại từ `họ`,
    các cụm `bị áp đảo về quân số và cần cách đối phó với các pháp sư`, và câu hỏi
    suy tính `nhưng… có lẽ tự mình ngăn máy bay ném bom sẽ khôn ngoan hơn chăng?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000270
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000270: locks: [''Giữ đại từ `họ`
    và hai câu thoại `“Chẳng phải nên sử dụng họ sao? Tình hình này rõ ràng rất tệ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000271
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000271: locks: [''Giữ bản sửa theo
    signoff `M4` bảo toàn đúng phạm vi nhấn mạnh in nghiêng theo `DEC-P01-002` ở cụm
    `*tự ý hành động*`, đại từ `Anh ta`, và danh xưng `viên sĩ quan tham mưu đang
    bất an`: `“Nhưng đây vẫn là mệnh lệnh. Làm gì hơn nữa thì…” Anh ta nuốt xuống
    những lời *tự ý hành động*, nhưng chúng phản ánh nỗi lo của viên sĩ quan tham
    mưu đang bất an.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000272
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000272: locks: [''Giữ các cụm `Thẩm
    quyền của sĩ quan tham mưu không bao gồm việc hành động khi chưa có lệnh.`, `Nhiệm
    vụ của họ là lập kế hoạch tác chiến, chứ không phải ra quyết định.`, đại từ `họ`,
    và danh xưng cuối đoạn `các Pixie`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000273
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000273: locks: [''Giữ thuật ngữ
    `Đơn vị điều khiển` (theo `vol02-ch02-b11-control-unit`), các danh xưng `các Pixie`,
    `Tiểu đoàn Pixie`, và các số liệu nguyên bản không tự thêm đơn vị `Bốn mươi tám
    tín hiệu. Tốc độ 250, độ cao…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000274
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000274: locks: [''Giữ số liệu kèm
    đơn vị `250 kilômét một giờ`, đại từ `họ`, và nhận định điều kiện `Nếu họ có thể
    bay nhanh đến vậy mà vẫn giữ đội hình, điều đó cho thấy họ được huấn luyện rất
    bài bản.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000275
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000275: locks: [''Giữ câu thoại
    `“Nhanh ghê. Hửm? Còn độ cao thì sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000276
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000276: locks: [''Giữ danh xưng
    `Các sĩ quan tham mưu`, đại từ `họ`, cụm `lực lượng chi viện này`, và `bèn hỏi
    dữ liệu độ cao.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000277
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000277: locks: [''Giữ đại từ `Họ`
    / `họ`, con số trần không tự thêm đơn vị `7.500` (theo `vol02-ch02-b11-height-unit`),
    và câu `“Họ đang ở… 7.500 ư? Không… họ vẫn đang lên cao.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000278
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000278: locks: [''Giữ tiếng thốt
    `“Cái gì?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000279
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000279: locks: [''Giữ các đại từ
    `Anh`, `Họ`, cụm `máy bay tiêm kích`, và câu `“Anh chắc chứ? Họ đâu phải máy bay
    tiêm kích.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000280
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000280: locks: [''Giữ các mốc độ
    cao đã đồng bộ đơn vị `sáu nghìn feet` và `tám nghìn feet` (theo signoff và `vol02-ch02-b11-height-unit`),
    chủ ngữ khái quát `người ta`, và toàn văn `Kinh nghiệm chiến đấu khiến người ta
    xem sáu nghìn feet là giới hạn hợp lý. Có thể dữ liệu ghi kỷ lục là tám nghìn
    feet, nhưng trước khi tận mắt thấy điều đó trong một trận chiến thực sự, thật
    khó tin nổi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000281
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000281: locks: [''Giữ sự đối lập
    giữa `Các giá trị lý thuyết mà kỹ sư nói đến` và `những gì một đơn vị tiền tuyến
    có thể đạt được`, cụm `Những người thuộc tầng lớp được gọi là binh sĩ luôn nghi
    ngờ các khuôn khổ, vũ khí và công nghệ mới.`, và câu kết `Đó là sự hoài nghi lành
    mạnh, bởi mạng sống của họ phụ thuộc vào việc những thứ ấy có dùng được hay không.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000282
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000282: locks: [''Giữ các đại từ
    `họ`, `mình`, và hai câu `Vì thế, xét theo một khía cạnh, họ chẳng còn cách nào
    khác ngoài việc khiêm nhường trước điều mình đang chứng kiến. Đó là sức nặng của
    bằng chứng trên chiến trường.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000283
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000283: locks: [''Giữ danh xưng
    `Tiểu đoàn Pixie`, mốc độ cao đã sửa theo signoff `tám nghìn feet` (theo `vol02-ch02-b11-height-unit`),
    và câu `“Không nhầm đâu. Tiểu đoàn Pixie hiện đang ở độ cao tám nghìn feet!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000284
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000284: locks: [''Giữ đại từ `Họ`,
    con số trần `Ba trăm`, và câu `“Họ đang tăng tốc! Ba trăm ư?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000285: locks: [''Giữ câu trần
    thuật `Cú tăng tốc ấy cũng khó tin không kém.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000286
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000286: locks: [''Giữ các cụm `Một
    đơn vị đang bay theo đội hình hướng ra chiến tuyến để tham chiến`, `đạt gần như
    cùng tốc độ và độ cao với kết quả thử nghiệm công nghệ`, và câu điều kiện `Nếu
    số liệu là thật, trình độ của họ hẳn đã ở một đẳng cấp hoàn toàn mới.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000287
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000287: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng chỉ ở câu hỏi đầu đoạn theo `DEC-P01-002` `*Có thật không?*`,
    và câu sau `Nếu đúng vậy, thành tích của tiểu đoàn này vượt trội đến mức khiến
    mọi đơn vị hiện có trở nên lỗi thời.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000288
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000288: locks: [''Giữ thuật ngữ
    `đơn vị điều khiển` (theo `vol02-ch02-b11-control-unit`) và câu hỏi `“Số liệu
    của đơn vị điều khiển có chính xác không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000289: locks: [''Giữ đại từ `Tôi`,
    từ `bất thường` (phân biệt với `dị thường` ở p000291–p000292), và câu `“Tôi không
    thấy bất thường nào khác… Mọi thứ vẫn hoạt động bình thường.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000290
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000290: locks: [''Giữ danh xưng
    `sĩ quan tham mưu` và câu `Vẻ mặt không tin nổi ấy cũng hiện lên trên gương mặt
    tất cả sĩ quan tham mưu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000291
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000291: locks: [''Giữ danh xưng
    `Bộ Tổng tham mưu Trung ương`, thuật ngữ `dị thường` (theo `vol02-ch02-b11-deviation`),
    và câu `“Xem ra Bộ Tổng tham mưu Trung ương có một dị thường làm quân bài chủ
    lực.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000292
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000292: locks: [''Giữ thuật ngữ
    `dị thường` (theo `vol02-ch02-b11-deviation`) và câu đáp `“Thật đấy. Gọi là dị
    thường thì đúng quá rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000293
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000293: locks: [''Giữ các đại từ
    `họ`, `mình`, và câu `Điều duy nhất họ có thể nói là mừng vì tiểu đoàn này đứng
    về phía mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000294
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000294: locks: [''Giữ thuật ngữ
    giữ nguyên `Named` (theo `vol02-ch02-b10-named`), biệt danh `Ác quỷ sông Rhine`
    (theo `vol02-ch02-b11-devil-of-rhine`), các danh xưng `Người quan sát`, `sở chỉ
    huy`, các đại từ `anh ta`, `họ`, và câu kết `Named mà họ còn chẳng chắc có thật
    hay không đã xuất hiện.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000295
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000295: locks: [''Giữ câu đã sửa
    theo signoff với danh từ mở đầu `Kẻ` và thuật ngữ `vùng chết` (theo `vol02-ch02-b11-death-zone`):
    `Kẻ ung dung bay xuyên qua vùng chết.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000296
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000296: locks: [''Giữ cấu trúc
    điệp đầu câu `Kẻ` và cấp đơn vị `đại đội`: `Kẻ một mình tàn sát cả một đại đội.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000297
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000297: locks: [''Giữ câu đã sửa
