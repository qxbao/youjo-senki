source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: b0e1af62ec2de06f9129736eb219d6494e221780520c1703a84810ff09e47ae1
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 27
segment_id_start: YS-LN02/Text/part0014.xhtml/p000141
segment_id_end: YS-LN02/Text/part0014.xhtml/p000167
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000141: locks: [''Giữ các cụm `những
    nhân vật tầm cỡ thế giới`, `một quốc gia xa xôi`, `những vùng đất thiếu tài nguyên
    và những nhượng địa tiềm năng`, và phủ định `thậm chí chẳng lọt vào tầm ngắm của
    các nhà lãnh đạo quyền lực`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000142: locks: [''Giữ đại từ `chúng
    ta`, hình ảnh mỉa mai `một chuyến leo núi thú vị`, và câu thoại `“Nói cách khác,
    chúng ta sẽ có một chuyến leo núi thú vị, trong khi cả thế giới dõi theo.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000143: locks: [''Giữ đại từ `chúng
    ta` / `Ta`, đại từ `họ`, tình thái suy đoán `hẳn họ rất muốn thắng`, và các danh
    xưng `Bộ Tổng tham mưu`, `Bộ Tư lệnh Tối cao` (theo `vol02-ch02-b07-supreme-command`),
    `Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000144: locks: [''Giữ phủ định
    tuyệt đối `thất bại sẽ tuyệt đối không được dung thứ`, tình thái `có lẽ`, đại
    từ `chúng ta`, và cụm `những pháp sư Đế quốc mẫu mực`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000145: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `mình` ở cả hai câu theo `DEC-P01-001` và `vol02-ch02-b07-tanya-interior-self-reference`,
    sự tương phản `dù vô cùng miễn cưỡng, mình vẫn phải vui vẻ ra chiến trường`, và
    phủ định `Thực ra mình chẳng yêu thích chiến tranh chút nào, nên phải làm mọi
    thứ trong khả năng để không bị nghi ngờ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000146: locks: [''Giữ câu hỏi thoại
    của Tanya: `“Thế nào? Tin tuyệt vời, phải không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000147: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng theo `DEC-P01-002` `*Các anh cũng hiểu mà, phải không?*`,
    đại từ `Họ`, và đại từ nội tâm `mình` trong câu `Họ dường như nhận ra vẻ mặt của
    mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000148: locks: [''Giữ danh xưng
    `Bộ Tổng tham mưu`, đại từ `chúng ta` và câu thoại `“Tuyệt quá. Không ngờ Bộ Tổng
    tham mưu lại cho chúng ta cơ hội tỏa sáng sớm đến vậy.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000149
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000149: locks: [''Giữ đại từ `Tôi`
    và câu thoại hưởng ứng `“Tôi vừa định đi trượt tuyết đây. Mệnh lệnh chu đáo thật!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000150: locks: [''Giữ đại từ `Tôi`,
    danh xưng `Bộ Tổng tham mưu`, đại từ `họ` và câu hỏi `“Tôi cứ tưởng Bộ Tổng tham
    mưu chỉ toàn giao việc bất khả thi. Mệnh lệnh này thật sự là từ họ à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000151: locks: [''Giữ các đại từ
    `mọi người`, `Họ`, `tôi` và câu `May là mọi người đều hùa theo. Họ tinh tế hơn
    tôi tưởng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000152: locks: [''Giữ đại từ `Họ`,
    đại từ nội tâm `mình` theo `vol02-ch02-b07-tanya-interior-self-reference`, tình
    thái `Có lẽ`, và câu `Họ hiểu cả sự kính trọng dành cho cấp trên lẫn điều đang
    được yêu cầu ở mình. Có lẽ mình không cần lo lắng quá.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000153
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000153: locks: [''Giữ cách gọi
    `các chiến hữu`, đại từ `Chúng ta`, địa danh `phương Bắc` và câu thoại `“Tốt.
    Vậy tình hình là thế, các chiến hữu. Chúng ta đã được trao cơ hội, nên sẽ lên
    đường đến phương Bắc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000154
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000154: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình` theo `DEC-P01-001` và `vol02-ch02-b07-tanya-interior-self-reference`,
    và đúng phạm vi nhấn mạnh in nghiêng theo `DEC-P01-002` `*nóng lòng muốn lâm trận*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000155
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000155: locks: [''Giữ đại từ `Các
    anh` và câu lệnh giải tán `“Các anh được phép giải tán.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000156: locks: [''Giữ danh xưng
    đơn vị đã khóa tạm `Tiểu đoàn Viper của Đế quốc` theo `vol02-ch02-b07-viper-battalion`,
    đúng phạm vi in nghiêng theo `DEC-P01-002` `*tồi tệ nhất*`, thuật ngữ `xuất kích`,
    và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000157
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000157: locks: [''Giữ các danh
    xưng đã khóa tạm `Đại Quân` (theo `vol02-ch02-b07-great-army`), `Đế quốc`, `Bộ
    Chỉ huy phương Bắc của Lục quân Đế quốc`, `Liên minh Entente`, `Cụm tập đoàn quân
    phương Bắc` (theo `vol02-ch02-b07-northern-army-group`), và chuỗi quan hệ nhân
    quả về việc điều động lại chủ lực khiến mạng lưới hậu cần bị kéo căng quá mức.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000158
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000158: locks: [''Giữ các danh
    xưng `Lục quân Liên minh Entente`, `Đế quốc`, `Cụm tập đoàn quân phương Bắc` (viết
    thường `tập đoàn quân` theo signoff `MOD-1`), `biệt kích Liên minh Entente`, và
    các thuật ngữ `kho tiếp tế`, `pháp sư không quân địch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000159
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000159: locks: [''Giữ các danh
    xưng `Cụm tập đoàn quân phương Bắc` (viết thường `tập đoàn quân` theo signoff
    `MOD-1`), `Tiểu đoàn Viper`, đại từ `Họ`, phủ định `không thể chịu thêm một đợt
    gián đoạn lớn nào`, và nhiệm vụ `bảo vệ các tuyến tiếp tế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000160
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000160: locks: [''Giữ các danh
    xưng `Cấp chỉ huy`, `Liên minh Entente`, `Tiểu đoàn Viper`, đại từ `họ`, cụm đã
    sửa theo signoff `M3` `Dù tổng quân số pháp sư của Liên minh Entente ít hơn xét
    theo tổng số tuyệt đối`, và sự tương phản giữa tự do chọn điểm đánh của bên công
    với việc bên thủ phải chia quân giữ nhiều vị trí và `tuyến liên lạc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000161
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000161: locks: [''Giữ cụm đã sửa
    theo signoff `M2` và mục `vol02-ch02-b07-unmarked-origin` `tuy chính thức không
    đánh dấu nguồn gốc`, đúng thứ tự bốn cường quốc `Cộng hòa, Khối Thịnh vượng chung,
    Hợp chúng quốc và Liên bang` (theo `vol02-ch02-b07-unified-states`), các danh
    xưng `pháp sư Liên minh Entente`, `Đơn vị biệt kích pháp sư Liên minh Entente`,
    `pháp sư Đế quốc`, và phủ định `ngay cả pháp sư Đế quốc cũng không thể xem nhẹ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000162
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000162: locks: [''Giữ các danh
    xưng `lực lượng Đế quốc`, `các chỉ huy Đế quốc`, `Liên minh Entente`, phủ định
    `không thể lơ là cảnh giác ngay cả với những đơn vị mới ở tiền tuyến`, và cụm
    giữ nguyên dấu ngoặc kép theo `vol02-ch02-b07-voluntary-mages` `những “pháp sư
    tình nguyện” không rõ quốc tịch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000163
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000163: locks: [''Giữ danh xưng
    `pháp sư Liên minh Entente` và câu thốt `“Khốn kiếp. Lại là pháp sư Liên minh
    Entente à?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000164
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000164: locks: [''Giữ cụm `các
    đơn vị pháp sư Đế quốc đang phòng thủ` và sự đối lập `dù trên giấy tờ đông quân
    hơn đối phương, các đơn vị pháp sư Đế quốc đang phòng thủ vẫn phải chịu cảnh thua
    kém quân số tại từng điểm giao chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000165
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000165: locks: [''Giữ các danh
    xưng `Tiểu đoàn Viper`, `Lục quân Đế quốc`, đại từ `họ`, và các nhận định `họ
    là những cựu binh có nhiều kinh nghiệm chiến đấu`, `Hoàn toàn có thể xếp họ vào
    hàng đơn vị chiến đấu hạng nhất.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000166
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000166: locks: [''Giữ đại từ `họ`
    và quan hệ suy luận `việc họ bị một đơn vị địch mạnh đến đáng sợ áp đảo về quân
    số chỉ có thể có nghĩa là tình hình hết sức tồi tệ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000167
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000167: locks: [''Giữ danh xưng
    `bên Tình báo`, phủ định `chẳng có gì đáng lo`, và câu thoại `“Chúng đến sớm hơn
    dự tính! Tại sao bên Tình báo lại bảo chẳng có gì đáng lo?!”`.'']'
  non_canon: true
