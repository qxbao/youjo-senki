choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000284
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000284: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `mình` theo đúng `DEC-P01-001`.: pov_and_voice:
    Độc thoại nội tâm của Tanya nối tiếp trực tiếp câu kết của `p000283` (`ch-05-b11`),
    giọng tự giễu pha chút ngán ngẩm.: modality_and_logic: Bảo toàn chính xác sắc
    thái giả định trái thực tế trong quá khứ (`lẽ ra mình nên nghĩ đến điều đó`).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000285
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000285: terms: [''mặt trận Rhine'']:
    pronouns_and_address: Tanya mở lời chào đám tân binh bằng `Thưa các ngài`.: pov_and_voice:
    Lời thoại huấn thị trước hàng quân của Tanya, giọng chào mừng mang màu sắc nghi
    thức xen lẫn châm biếm.: modality_and_logic: Giữ đúng lời chào mừng đám tân binh
    đến với mặt trận Rhine.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000286
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000286: terms: [''Tanya'', ''Bộ
    chỉ huy'']: pronouns_and_address: Độc thoại nội tâm dùng `mình`; câu trần thuật
    ngôi thứ ba dùng tên riêng `Tanya` và gọi tân binh là `họ`; lược đại từ ngôi thứ
    hai phiếm chỉ ở câu cuối theo quy ước.: pov_and_voice: Đan xen giữa độc thoại
    nội tâm cảnh giác của Tanya và trần thuật hạn tri theo sát điểm nhìn của nhân
    vật.: modality_and_logic: Bảo toàn mạch suy luận kinh nghiệm nhà binh: tân binh
    được điều tới quá nhanh khiến Tanya lúng túng, vì Bộ chỉ huy mà làm việc mau lẹ
    thì chắc chắn là điềm bất thường cần chuẩn bị cho tình huống xấu nhất.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000287
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000287: terms: [''Bộ chỉ huy'']:
    pronouns_and_address: Bình luận nội tâm khái quát hóa của Tanya, dùng `người ta`
    cho đại từ ngôi thứ hai phiếm chỉ.: pov_and_voice: Giọng châm biếm bộ máy hành
    chính quan liêu trong quân đội.: modality_and_logic: Bảo toàn phép tương phản:
    tiếp tế và viện binh thì luôn chậm trễ, nhưng rắc rối lại được gửi tới ngay lập
    tức, nên việc Bộ chỉ huy đột nhiên làm việc hiệu quả chính là tin xấu.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000288
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000288: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri lặp tên `Tanya` kết hợp phản thân `mình`, không dùng đại từ
    `cô` theo đúng quy ước `DEC-P01-001` và `P01-tanya-narration-ch01`.: pov_and_voice:
    Trần thuật hạn tri khắc họa sự bức bối không giấu nổi trên nét mặt Tanya.: modality_and_logic:
    Giữ đúng quan hệ hệ quả (`Thế nên...`) và mệnh đề nhượng bộ (`Dù biết... vẫn...`)
    khi Tanya nhăn mặt cau có trước đám lính mới bị đẩy sang cho mình.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000289
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000289: terms: [''Tanya'', ''quân
    bổ sung'', ''Trung úy Weiss'']: pronouns_and_address: Trần thuật hạn tri dùng
    `Tanya`, `Trung úy Weiss` và `họ` (các sĩ quan thuộc cấp).: pov_and_voice: Trần
    thuật hạn tri kết hợp câu hỏi nội tâm tự do trực tiếp thể hiện sự sững sờ của
    cả chỉ huy lẫn thuộc cấp.: modality_and_logic: Bảo toàn sự tương phản giữa việc
    đã chuẩn bị tinh thần từ trước với thực tế quá đỗi non nớt của đám quân bổ sung
    khi Weiss và các sĩ quan xem hồ sơ binh nghiệp của họ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000290
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000290: terms: [''đổi binh chủng'']:
    pronouns_and_address: Độc thoại nội tâm dùng `Họ` / `họ` cho đám tân binh và `Chúng
    tôi` cho đơn vị của Tanya.: pov_and_voice: Độc thoại nội tâm giàu hình ảnh ẩn
    dụ hài đen của Tanya.: modality_and_logic: Bảo toàn phép phủ định kép (`không
    đến đây để huấn luyện lại hay đổi binh chủng`) và chuỗi ẩn dụ xuyên suốt (`khối
    thịt tươi rói` -> `cối xay thịt` -> `Đừng băm họ ra! Hãy nhào nặn họ thành những
    miếng bít tết biết chiến đấu!`).: emphasis: Bảo toàn chính xác 1 cụm `*...*` tương
    ứng `<html:em>` (`*Đừng băm họ ra! Hãy nhào nặn họ thành những miếng bít tết biết
    chiến đấu!*`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000291
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000291: terms: [''Thiếu tá Pháp
    sư von Degurechaff'']: pronouns_and_address: Tanya tự giới thiệu trước đám tân
    binh bằng `Tôi` – `các anh`.: pov_and_voice: Lời tự giới thiệu ngắn gọn, nghiêm
    nghị của người chỉ huy kiêm huấn luyện.: modality_and_logic: Giữ đúng nội dung
    giới thiệu vai trò người hướng dẫn và cấp bậc, danh tính của Tanya.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000292
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000292: terms: [''đơn vị huấn luyện'',
    ''Central'', ''Bộ phận nghiên cứu kỹ thuật'', ''Elinium Type 95'', ''Tanya'']:
    pronouns_and_address: Độc thoại nội tâm ở 4 câu đầu dùng `mình`; câu thứ 5 chuyển
    sang trần thuật ngôi thứ ba dùng `Tanya` và phản thân `mình`, khớp hoàn toàn với
    sự chuyển ngôi của nguyên văn và `DEC-P01-001`.: pov_and_voice: Độc thoại nội
    tâm tiếc nuối các bước đi sự nghiệp trong quá khứ, khép lại bằng câu trần thuật
    tổng kết.: modality_and_logic: Bảo toàn giả định trái thực tế trong quá khứ (`Nếu
    biết sẽ thành ra thế này, lẽ ra mình đừng...`), sự liệt kê các rắc rối từ đơn
    vị huấn luyện ở Central đến Bộ phận nghiên cứu kỹ thuật cùng Elinium Type 95,
    và nhận định chua chát rằng mình chưa tận dụng tốt cơ hội thăng tiến mà chỉ chuốc
    thêm nghiệt duyên.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000293
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000293: terms: [''Rhine'']: pronouns_and_address:
    Tanya gọi đám tân binh là `các anh`, quy chiếu chiến trường Rhine là `nó`.: pov_and_voice:
    Lời thoại cảnh báo lạnh lùng, trực diện của Tanya.: modality_and_logic: Giữ đúng
    hai hình ảnh ẩn dụ cảnh tỉnh tân binh: Rhine là địa ngục và có thể ví như một
    nghĩa địa.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000294
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000294: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri dùng `Tanya`, quy chiếu đám tân binh là `họ`.: pov_and_voice:
    Trần thuật hạn tri đan cài suy tính thực tế của Tanya.: modality_and_logic: Bảo
    toàn đầy đủ ba nhịp lập luận: Tanya cảnh báo thẳng thắn để tân binh không chết
    như ngả rạ; tiếc rằng họ chưa được huấn luyện kỹ hơn vì lính không hiểu chuyện
    chỉ là gánh nặng; rồi chợt nhận ra chính vì họ còn quá non nên cấp trên mới bày
    ra nhiệm vụ huấn luyện này.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000295
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000295: terms: [''mặt trận Rhine'',
    ''Quân đội Cộng hòa'']: pronouns_and_address: Tanya gọi đám tân binh là `các anh`.:
    pov_and_voice: Giọng thuyết giảng mỉa mai sâu cay của Tanya.: modality_and_logic:
    Bảo toàn cách nói ngược đầy châm biếm về `mặt trận Rhine tuyệt vời`, nơi Quân
    đội Cộng hòa mở tiệc chào đón những kẻ vô dụng và người lính có thể được thăng
    liền hai cấp trong chớp mắt (nhờ tử trận).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000296
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000296: terms: [''các tuyến Rhine'',
    ''Thiếu tá'', ''truy thăng hai cấp sau khi chết'', ''hậu phương'']: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `Mình` / `mình`.: pov_and_voice: Độc thoại nội
    tâm phân tích thực trạng hao hụt nhân sự ở mặt trận Rhine.: modality_and_logic:
    Bảo toàn mối liên hệ giải thích cho câu nói mỉa mai ở `p000295`: tỷ lệ tổn thất
    ở Rhine quá cao đến mức các sĩ quan cấp trên có mặt khi Tanya mới tới đều đã tử
    trận và nhận truy thăng hai cấp, hoặc nếu may mắn thì được chuyển đi hay đưa về
    hậu phương.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000297
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000297: terms: [''Thiếu tá'']:
    pronouns_and_address: Độc thoại nội tâm của Tanya dùng `mình`.: pov_and_voice:
    Giọng nhận xét tỉnh táo pha chút ngỡ ngàng trước tốc độ đào thải cấp chỉ huy.:
    modality_and_logic: Giữ đúng phép so sánh vị trí: dù mới chỉ mang quân hàm Thiếu
    tá nhưng Tanya đã đứng gần đỉnh của cơ cấu chỉ huy tại mặt trận hơn là ở đáy.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000298
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000298: terms: [''các tuyến Rhine'',
    ''Darwin'']: pronouns_and_address: Độc thoại nội tâm khái quát hóa của Tanya,
    ẩn đại từ ngôi thứ hai phiếm chỉ.: pov_and_voice: Giọng liên tưởng học thuật châm
    biếm (kinh tế học thị trường lao động kết hợp thuyết tiến hóa của Darwin).: modality_and_logic:
    Bảo toàn trọn vẹn câu giả định về Darwin và cặp câu hỏi đối lập về thuyết tiến
    hóa (đỉnh cao tiến hóa hay nơi thuyết tiến hóa sụp đổ).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000299
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000299: terms: []: pronouns_and_address:
    Lời thoại của Tanya dùng đại từ phiếm chỉ `ai`.: pov_and_voice: Giọng huấn thị
    lạnh lùng, khiêu khích những kẻ thích thể hiện anh hùng cá nhân.: modality_and_logic:
    Giữ đúng lời khuyên mỉa mai: ai muốn làm anh hùng thì cứ ra đùa với lính bắn tỉa.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000300
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000300: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya lược đại từ ngôi thứ hai phiếm chỉ, gọi đám lính ngu
    ngốc không biết nghe lời là `chúng`.: pov_and_voice: Giọng tính toán chi phí -
    lợi ích tàn nhẫn của Tanya.: modality_and_logic: Bảo toàn hai vế nhận định: nói
    chuyện với lũ ngốc không chịu nghe là vô ích, và để chúng lảng vảng tiêu xài quân
    nhu là sự lãng phí.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000301
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000301: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya ẩn chủ ngữ ngôi thứ nhất, gọi đám lính ngốc là `chúng`.:
    pov_and_voice: Giọng thực dụng lạnh băng, coi việc loại bỏ lính vô dụng như một
    giao dịch có lời.: modality_and_logic: Bảo toàn điều kiện tính toán lợi ích: nếu
    vừa tống khứ được lũ ngốc vừa làm tiêu hao đạn và sức lực của xạ thủ bắn tỉa địch
    thì đó là một món hời không tệ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000302: terms: []: pronouns_and_address:
    Tanya xưng `tôi`, hướng lời dặn tới số tân binh còn lại.: pov_and_voice: Giọng
    mệnh lệnh ngắn gọn, dứt khoát.: modality_and_logic: Giữ đúng yêu cầu tối thiểu
    đối với những tân binh còn lại: cố hết sức đừng làm vướng chân.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000303
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000303: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya gọi đám tân binh là `chúng`.: pov_and_voice: Giọng
    đánh giá thực dụng, phũ phàng.: modality_and_logic: Giữ đúng điều kiện: nếu chịu
    nghe theo chỉ dẫn thì ít nhất chúng cũng dùng làm bia đỡ đạn được.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000304
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000304: terms: []: pronouns_and_address:
    Tanya gọi các tân binh là `các anh` và dùng `chúng ta`.: pov_and_voice: Giọng
    kết thúc bài phát biểu lịch sự kiểu xã giao nhưng ẩn chứa hàm ý u ám về tỷ lệ
    sống sót.: modality_and_logic: Bảo toàn sự tương phản giữa dự báo chỉ gắn bó với
    nhau một thời gian ngắn và lời kêu gọi sống hòa thuận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000305
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000305: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `mình`.: pov_and_voice: Giọng người làm công
    ăn lương khép lại phần thủ tục chào hỏi để bắt tay vào việc chính.: modality_and_logic:
    Giữ đúng hai câu kết thúc cảnh huấn thị và chuyển sang phần việc tiếp theo theo
    mức lương được trả.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000306
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000306: terms: []: pronouns_and_address:
    Độc thoại nội tâm mở đầu đoạn ngợi ca chiếc xẻng sau ngắt cảnh (`space-break1`),
    không dùng đại từ cá nhân.: pov_and_voice: Giọng tụng ca hào hứng, nghiêm túc
    một cách hài hước của Tanya về chiếc xẻng công binh.: modality_and_logic: Giữ
    đúng cấu trúc hai câu ngắn dồn dập tôn vinh xẻng là tinh hoa của nền văn minh.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000307
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000307: terms: [''chiến hào'']:
    pronouns_and_address: Dùng đại từ khái quát `ta` cho `you` phiếm chỉ, tạo nhịp
    điệu tự nhiên cho bài thuyết trình nội tâm về công năng của xẻng.: pov_and_voice:
    Giọng phân tích công năng thực địa của công cụ quân sự.: modality_and_logic: Bảo
    toàn sự phát triển theo quy mô nhân lực: một người cầm xẻng thì đào được hố cá
    nhân đủ ẩn mình, tập hợp nhiều người cầm xẻng thì đào được một chiến hào tốt.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000308
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000308: terms: [''chiến hào'',
    ''chiến thuật đào hầm'']: pronouns_and_address: Tiếp tục dùng đại từ khái quát
    `ta` cho `you` phiếm chỉ.: pov_and_voice: Giọng giảng giải chiến thuật công binh
    kèm lời chú giải thực tế.: modality_and_logic: Bảo toàn bước phát triển từ đào
    hào sang đào đường hầm để đánh sập chiến hào kiên cố của địch bằng chiến thuật
    đào hầm, cùng nhận xét phụ chú rằng chiến thuật này không mấy khi được dùng.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000309
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000309: terms: [''chiến hào'']:
    pronouns_and_address: Nhận định khái quát không dùng đại từ nhân xưng.: pov_and_voice:
    Giọng khẳng định chắc nịch, chuyển mượt từ công năng đào đất sang công năng vũ
    khí cận chiến.: modality_and_logic: Giữ đúng hai mệnh đề song hành: xẻng là bạn
    tốt của mọi người lính và là trang bị tốt nhất khi đánh giáp lá cà trong chiến
    hào.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000310: terms: [''lưỡi lê'', ''súng
    trường'']: pronouns_and_address: Độc thoại nội tâm của Tanya chuyển về tự xưng
    `mình` ở câu cuối theo đúng nguyên văn.: pov_and_voice: Giọng đánh giá kỹ-chiến
    thuật và kinh tế sản xuất, kết thúc bằng liên hệ cá nhân về tác dụng phụ lên tâm
    trí.: modality_and_logic: Bảo toàn đầy đủ 3 phép so sánh ưu thế vật lý (dài hơn
    lưỡi lê, dễ dùng hơn súng trường, bền hơn mọi công cụ khác), ưu thế chi phí sản
    xuất hàng loạt, và ưu thế cá nhân đối với Tanya là không lo bị tổn hại đầu óc
    (như khi dùng Elinium Type 95).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000311
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000311: terms: []: pronouns_and_address:
    Độc thoại nội tâm khái quát, dùng phản thân `mình` cho chủ thể `Nền văn minh`.:
    pov_and_voice: Giọng tán dương cao trào mang màu sắc triết lý lịch sử công cụ.:
    modality_and_logic: Giữ đúng ba câu khẳng định dồn dập: món trang bị lý tưởng,
    đích đến tất yếu của nhân loại, và thành tựu công cụ của nền văn minh.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000312
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000312: terms: [''dò quét ma thuật'']:
    pronouns_and_address: Dùng `ta` cho cấu trúc khái quát và `nó` quy chiếu chiếc
    xẻng.: pov_and_voice: Giọng thực chiến tàn nhẫn pha nét hài đen sống động với
    từ tượng thanh mô phỏng tiếng xẻng bổ xuống.: modality_and_logic: Bảo toàn quan
    hệ nhân quả then chốt: vì xẻng không dùng ma thuật/ma pháp nên cực kỳ tối ưu để
    hạ sát lặng lẽ, giúp ''giáo dục'' những kẻ chỉ biết ỷ lại vào dò quét ma thuật
    trong các cuộc đột kích ban đêm cũng như làm công cụ đa năng suốt cả ngày.: emphasis:
    Bảo toàn chính xác 1 cụm `*...*` tương ứng `<html:em>` (`*Keng!*`).'
  non_canon: true
