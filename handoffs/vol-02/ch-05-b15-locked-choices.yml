choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000358
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000358: terms: [''Chiến hào'',
    ''quân thay thế'', ''Tân binh'', ''cựu binh'', ''pháp sư'']: pronouns_and_address:
    Trần thuật hạn tri không dùng đại từ nhân xưng cá nhân; dùng `Chúng` quy chiếu
    chiến hào.: pov_and_voice: Trần thuật hạn tri phân tích những thay đổi về tác
    chiến ban đêm và canh gác trong môi trường chiến hào.: modality_and_logic: Bảo
    toàn chuỗi nhận định nhân quả: chiến hào làm thay đổi cách đánh đêm và canh gác
    khiến quân thay thế bỡ ngỡ; cả tân binh lẫn cựu binh đều phải đối phó với việc
    báo động liên tục vì chuyện nhỏ nhặt; và tình hình có lẽ thêm trầm trọng do pháp
    sư ít có dịp ở trong chiến hào vào ban ngày.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000359
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000359: terms: [''Tanya'']: pronouns_and_address:
    Tanya gọi vị đại tá là `ngài`, tự xưng `tôi` và dùng `ta` cho phía quân mình;
    phần dẫn thoại dùng tên riêng `Tanya`.: pov_and_voice: Giọng đối thoại công vụ
    điềm tĩnh, biết lắng nghe của Tanya sau khi suy ngẫm.: modality_and_logic: Bảo
    toàn sự chuyển ý (`Dù vậy`), lời tán đồng với nhận xét của vị đại tá và đánh giá
    rằng vẫn có thể cải thiện thêm đôi chút.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000360
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000360: terms: [''tân binh'', ''chiến
    hào'']: pronouns_and_address: Trần thuật hạn tri quy chiếu Tanya bằng `nó` theo
    đúng `DEC-P01-001`, quy chiếu tân binh bằng `họ`.: pov_and_voice: Trần thuật hạn
    tri đúc kết yêu cầu huấn luyện theo tư duy hệ thống của Tanya.: modality_and_logic:
    Bảo toàn kết luận: phải huấn luyện tân binh dựa trên giả định rằng họ chưa quen
    với chiến hào, vì môi trường và tiền đề/điều kiện tác chiến thay đổi đòi hỏi phải
    đào tạo lại.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000361
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000361: terms: [''phép thuật'']:
    pronouns_and_address: Vị đại tá quy chiếu đám tân binh pháp sư bằng `họ`.: pov_and_voice:
    Giọng tán đồng pha sự ngán ngẩm của vị đại tá khi nhắc đến khả năng tác chiến
    của tân binh.: modality_and_logic: Bảo toàn sự nhấn mạnh rằng cảnh tân binh chiến
    đấu trong môi trường không thể dựa vào phép thuật đặc biệt khó mà nhìn nổi.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000362
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000362: terms: [''Tanya'', ''ngài
    đại tá'', ''pháp sư'', ''màn bảo hộ'', ''lớp vỏ phòng ngự'', ''tác chiến bí mật'',
    ''tân binh'']: pronouns_and_address: Trần thuật hạn tri dùng `Tanya` và `nó` (`DEC-P01-001`),
    quy chiếu vị đại tá bằng `ngài đại tá` và các pháp sư/tân binh bằng `họ` kèm phản
    thân `mình`.: pov_and_voice: Trần thuật hạn tri bám sát góc nhìn chuyên môn và
    sự bực dọc của Tanya.: modality_and_logic: Bảo toàn quan hệ nguyên nhân – hệ quả:
    pháp sư vốn được huấn luyện với giả định luôn triển khai màn bảo hộ và lớp vỏ
    phòng ngự nên rất kém tác chiến bí mật; cảnh tân binh theo phản xạ vô thức dựng
    phòng vệ rồi bị địch nhắm bắn khiến Tanya chướng mắt và bực bội.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000363
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000363: terms: [''phép thuật'',
    ''chiến hào'']: pronouns_and_address: Lời thoại của Tanya quy chiếu đám tân binh
    bằng `họ`.: pov_and_voice: Giọng xác nhận thực trạng vi phạm kỷ luật che giấu
    tín hiệu ngoài chiến trường.: modality_and_logic: Bảo toàn quan hệ nhượng bộ –
    đối lập: dù đã có lệnh nghiêm cấm dùng phép thuật trong chiến hào nhưng vẫn có
    quá nhiều trường hợp vô tình làm rò rỉ tín hiệu và bị địch bắt sóng phát hiện.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000364
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000364: terms: []: pronouns_and_address:
    Câu 1 trần thuật hạn tri quy chiếu Tanya bằng `nó` (`DEC-P01-001`); câu 2 độc
    thoại nội tâm quy chiếu đơn vị gặp nạn bằng `họ`.: pov_and_voice: Trần thuật hạn
    tri chuyển sang câu hồi tưởng nội tâm bất chợt của Tanya.: modality_and_logic:
    Bảo toàn mạch liên tưởng: ngay khi vừa nói ra điều đó, Tanya chợt thấm thía và
    nhớ lại sự cố cả một đơn vị bị thổi bay chỉ vì một kẻ ngốc làm lộ vị trí lúc đang
    chuẩn bị.: emphasis: Bảo toàn chính xác 1 câu `*...*` tương ứng `<html:em>` (`*À
    phải, còn có vụ cả một đơn vị bị thổi bay vì một tên ngốc để lộ vị trí trong lúc
    họ đang chuẩn bị…*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000365
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000365: terms: [''quân thay thế'',
    ''cấp trên'']: pronouns_and_address: Trần thuật hạn tri quy chiếu Tanya bằng `nó`
    (`DEC-P01-001`).: pov_and_voice: Đan xen giữa câu hỏi nội tâm, câu cảm thán ngộ
    ra vấn đề và lời kể bình luận về lối suy diễn khác người của Tanya.: modality_and_logic:
    Bảo toàn đầy đủ ba nhịp: câu hỏi tu từ về việc sau cuộc điều tra liệu có ai đánh
    giá lại việc huấn luyện quân thay thế không; nhận thức nội tâm rằng sai lầm của
    một người làm nhân bội thiệt hại; và việc Tanya nhảy vọt tới kết luận theo lối
    logic chẳng giống ai rồi cảm động vì tưởng cấp trên quan tâm cải thiện tình hình.:
    emphasis: Bảo toàn chính xác 1 câu `*...*` tương ứng `<html:em>` (`*À, đúng là
    sai lầm của một người có thể làm thiệt hại tăng lên gấp bội.*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000366
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000366: terms: [''tân binh'']:
    pronouns_and_address: Tanya gọi vị đại tá là `Ngài` (hoặc `ngài` nếu đảo vế trạng
    ngữ lên đầu câu theo finding `m2`).: pov_and_voice: Giọng hỏi lại đầy tâm đắc
    của Tanya khi tưởng mình đã hiểu thấu tầm nhìn của cấp trên.: modality_and_logic:
    Bảo toàn câu hỏi xác nhận rằng vị đại tá lo ngại cả những trận đánh quy mô nhỏ
    khi tân binh mới chỉ được huấn luyện sơ sài đến mức này.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000367
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000367: terms: [''Định luật Heinrich'',
    ''Định luật Murphy'']: pronouns_and_address: Độc thoại nội tâm của Tanya dùng
    đại từ bao gộp khái quát `ta`.: pov_and_voice: Độc thoại nội tâm vận dụng các
    nguyên lý quản trị rủi ro và an toàn hệ thống đi kèm thái độ hoài nghi bản tính
    con người.: modality_and_logic: Bảo toàn trọn vẹn hai dẫn chứng: Định luật Heinrich
    cảnh báo việc bỏ qua các lỗi nhỏ luôn tiềm ẩn nguy cơ dẫn tới hậu quả nghiêm trọng,
    và Định luật Murphy dạy về mối nguy khi phớt lờ khả năng thất bại vì con người
    vốn ngốc nghếch nên hễ có cách thất bại thì sớm muộn cũng có kẻ làm hỏng.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000368
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000368: terms: [''Tanya'', ''cấp
    trên'', ''tân binh'']: pronouns_and_address: Câu trần thuật ở giữa dùng tên riêng
    `Tanya` và phản thân `mình`; câu độc thoại nội tâm cuối đoạn quy chiếu cấp trên
    bằng `họ`.: pov_and_voice: Độc thoại nội tâm xen trần thuật hạn tri khắc họa khoảnh
    khắc Tanya giật mình tự kiểm điểm sự kiêu ngạo của bản thân.: modality_and_logic:
    Bảo toàn cấu trúc `không phải... mà vì...`: cấp trên lo lắng về đám tân binh non
    nớt không phải vô cớ mà vì họ đã phát hiện ra một rủi ro mà các sĩ quan khắp mặt
    trận đang sơ suất bỏ qua.: emphasis: Bảo toàn chính xác 2 cụm `*...*` tương ứng
    2 thẻ `<html:em>` (`*Nếu vậy thì…*` và `*Hẳn cấp trên lo lắng về đám tân binh
    non nớt không phải vô cớ, mà vì họ đã phát hiện một nguy cơ mà các sĩ quan khắp
    mặt trận sơ ý bỏ qua.*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000369
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000369: terms: [''góc độ nhân sự'']:
    pronouns_and_address: Độc thoại nội tâm của Tanya dùng `họ` cho cấp trên và `ta`
    cho phía quân mình (có thể bổ sung `mình` ở câu 2 theo finding `m3`).: pov_and_voice:
    Độc thoại nội tâm tán thưởng cấp trên dưới lăng kính quản trị nhân sự.: modality_and_logic:
    Bảo toàn lời khen ngợi sự sắc sảo của cấp trên và lập luận phòng ngừa rủi ro:
    nếu tình hình phát triển thành một trận đánh lớn thì không có gì đảm bảo các vấn
    đề này sẽ không trầm trọng hơn, nên dù chỉ có cách cải thiện nhỏ cũng phải bắt
    tay thực hiện.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000370
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000370: terms: [''giao tranh quy
    mô lớn'', ''những cuộc đụng độ nhỏ'']: pronouns_and_address: Lời thoại của vị
    đại tá không dùng đại từ nhân xưng.: pov_and_voice: Giọng đồng tình sốt sắng của
    vị đại tá nhưng hướng về nỗi lo thương vong trước mắt.: modality_and_logic: Bảo
    toàn sự khẳng định (`Đúng là vấn đề nằm ở đó`) và cấu trúc gác lại chuyện giao
    tranh quy mô lớn để tập trung vào những cuộc đụng độ nhỏ kèm dấu chấm lửng cuối
    câu.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000371: terms: [''Sĩ quan ban tác
    chiến'', ''thương vong'']: pronouns_and_address: Trần thuật hạn tri quy chiếu
    vị sĩ quan Ban Tác chiến bằng `ông`.: pov_and_voice: Câu suy nghĩ in nghiêng mở
    đầu nối vào trần thuật hạn tri mô tả lương tri nhân bản của vị sĩ quan tham mưu.:
    modality_and_logic: Bảo toàn mệnh đề nhượng bộ đầu đoạn, phần chú giải trong ngoặc
    đơn `(như một người tử tế hẳn sẽ cảm thấy)` và cảm giác bất an của vị sĩ quan
    trước cảnh sản xuất xác người hàng loạt.: emphasis: Bảo toàn chính xác 1 câu `*...*`
    tương ứng `<html:em>` (`*Dù giả định hiện giờ là sẽ không nổ ra một trận đánh
    quy mô lớn…*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000372
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000372: terms: [''Tanya'', ''ngài
    đại tá'', ''thương vong'', ''lính thay thế'']: pronouns_and_address: Trần thuật
    hạn tri dùng `Tanya` và `nó` (`DEC-P01-001`), quy chiếu vị đại tá là `ngài đại
    tá`.: pov_and_voice: Trần thuật hạn tri làm nổi bật sự lệch pha giữa cử chỉ gật
    đầu tán đồng bên ngoài và mối bận tâm thực sự bên trong của Tanya.: modality_and_logic:
    Bảo toàn sự đối lập (`nhưng... Thay vào đó...`): Tanya gật đầu trước mọi điều
    vị đại tá nói nhưng thực chất không mấy bận tâm đến bản thân con số thương vong,
    mà chỉ coi việc nhiều đơn vị bị suy giảm chất lượng do cấu thành chủ yếu từ lính
    thay thế mới là vấn đề lớn nhất.: emphasis: Bảo toàn chính xác 1 cụm `*...*` tương
    ứng `<html:em>` (`*đúng là thế*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000373
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000373: terms: []: pronouns_and_address:
    Trần thuật hạn tri / nội tâm quy chiếu phía Đế quốc bằng `họ`.: pov_and_voice:
    Giọng phân tích rủi ro hệ thống nhất quán với Định luật Heinrich và Định luật
    Murphy vừa nêu.: modality_and_logic: Bảo toàn mệnh đề nhượng bộ: dù khả năng xảy
    ra một trận đánh quy mô lớn là không đáng kể, hiện tại họ vẫn đang để ngỏ khả
    năng thất bại và tích tụ những sai sót nhỏ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000374
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000374: terms: [''tân binh'', ''phép
    thuật'']: pronouns_and_address: Trần thuật hạn tri quy chiếu Tanya bằng `nó` /
    `Nó` theo đúng `DEC-P01-001`.: pov_and_voice: Trần thuật hạn tri đi sâu vào nỗi
    lo thực dụng nhất của Tanya khi nghĩ tới các nhiệm vụ rủi ro cao.: modality_and_logic:
    Bảo toàn cả hai ý: mối lo nghiêm trọng nhất của Tanya là những trường hợp rất
    thực tế (dù không thường xuyên) khi lỗi của một cá nhân gây ra thiệt hại thảm
    khốc; và nỗi sợ rằng đám tân binh không thể hoạt động nếu không dựa vào phép thuật
    sẽ trở thành nhân tố chính dẫn đến thất bại trong một nhiệm vụ rủi ro cao.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000375
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000375: terms: [''Norden'', ''phép
    thuật'']: pronouns_and_address: Vị đại tá tự xưng `Tôi`, gọi Tanya là `Cô` / `cô`
    theo khuyến nghị tại finding `m4` (hoặc giữ `Ngài` / `ngài` của bản nháp nếu chưa
    chỉnh ở bước polish).: pov_and_voice: Lời thoại của vị đại tá gợi nhắc kinh nghiệm
    thực chiến của Tanya tại Norden để chuẩn bị giao việc.: modality_and_logic: Bảo
    toàn câu hỏi đuôi nhắc lại chiến dịch không thể dựa vào phép thuật ở Norden và
    phán đoán rằng Tanya đã nắm được cốt lõi vấn đề.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000376
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000376: terms: []: pronouns_and_address:
    Tanya gọi vị đại tá là `ngài`, tự xưng `Tôi` / `tôi` kèm phản thân `mình`, và
    bổ sung tân ngữ `họ` (đám tân binh) ở cuối câu.: pov_and_voice: Giọng cấp dưới
    khiêm tốn nhận khuyết điểm và cam kết rút kinh nghiệm của Tanya.: modality_and_logic:
    Bảo toàn lời tán đồng lễ phép, sự thừa nhận đáng xấu hổ là trước đó chưa nghĩ
    tới khía cạnh này, và lời hứa sẽ ghi nhớ khi huấn luyện.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000377
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000377: terms: [''Một người vì
    mọi người. Mọi người vì một người.'']: pronouns_and_address: Độc thoại nội tâm
    khái quát của Tanya không dùng đại từ nhân xưng.: pov_and_voice: Giọng suy ngẫm
    quản trị tổ chức kết hợp cách diễn giải châm biếm lạnh lùng về tình đồng đội trong
    quân ngũ.: modality_and_logic: Bảo toàn trọn vẹn phép đối chiếu: yêu cầu biện
    pháp phòng ngừa sai sót là dấu hiệu tổ chức vận hành lành mạnh; ở đời dân sự có
    thể giải quyết bằng cách sa thải người phạm lỗi, nhưng trong quân đội sai lầm
    của một người khiến tất cả cùng chết; từ đó diễn giải câu châm ngôn theo hai chiều
    bi quan (một người hỏng việc thì cả đội chết, còn cả đội hỏng việc thì một cá
    nhân chiến đấu dữ dội đến mấy cuối cùng cũng không đủ để thắng).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000378
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000378: terms: []: pronouns_and_address:
    Lời thoại mở lời ngập ngừng không dùng đại từ nhân xưng.: pov_and_voice: Giọng
    vị đại tá ngập ngừng chuyển sang lời đề nghị trực tiếp.: modality_and_logic: Bảo
    toàn câu lửng ngắn gọn kèm dấu chấm lửng mở đường cho yêu cầu ở `p000381`.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000379
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000379: terms: [''Ngài đại tá'',
    ''Tanya'']: pronouns_and_address: Hai câu đầu là suy nghĩ nội tâm trực tiếp của
    vị đại tá nên tự xưng `Tôi` (tuân thủ giới hạn của `DEC-P01-001`, không dùng `mình`
    của Tanya cho nhân vật khác) và gọi phía phụ trách đào tạo là `họ`; phần trần
    thuật ngôi thứ ba dùng `Ngài đại tá` / `ông`, `Tanya` / `nó`, và `họ` / `cả hai`.:
    pov_and_voice: Độc thoại nội tâm của vị đại tá chuyển sang trần thuật toàn tri/hạn
    tri chỉ rõ sự lệch pha nhận thức giữa hai người.: modality_and_logic: Bảo toàn
    hai câu nội tâm in nghiêng của vị đại tá (ghi nhận việc giảng dạy đang diễn ra
    nhưng cho rằng vấn đề thực sự là thiếu kinh nghiệm thực chiến) và lời bình của
    người kể chuyện về sự hiểu lầm kỳ lạ khi cả hai chỉ thấy điểm chung là cần phải
    làm gì đó mà không nhận ra sự bất đồng trong quan điểm.: emphasis: Bảo toàn chính
    xác 1 cụm `*...*` bao quanh hai câu đầu tương ứng `<html:em>` (`*Tôi mừng vì họ
    đã bắt đầu huấn luyện, nhưng như thế vẫn còn xa mới đủ. Vấn đề thực sự là thiếu
    kinh nghiệm chiến đấu thực tế.*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000380
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000380: terms: []: pronouns_and_address:
    Tanya gọi vị đại tá là `ngài` kèm tiểu từ kính ngữ `ạ`.: pov_and_voice: Giọng
    đáp lời lễ phép, sẵn sàng nhận chỉ thị của Tanya.: modality_and_logic: Bảo toàn
    câu hỏi lịch sự mời cấp trên nói tiếp sau câu bỏ lửng ở `p000378`.: emphasis:
