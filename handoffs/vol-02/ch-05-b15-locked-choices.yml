  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000381
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000381: terms: []: pronouns_and_address:
    Vị đại tá gọi Tanya là `Cô`, quy chiếu đám tân binh là `họ`.: pov_and_voice: Giọng
    đề nghị ngắn gọn, đi thẳng vào mong muốn cho tân binh tích lũy kinh nghiệm của
    vị đại tá.: modality_and_logic: Bảo toàn câu hỏi yêu cầu Tanya cho đám tân binh
    chút kinh nghiệm thực tế.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000382
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000382: terms: [''Tanya'', ''cuộc
    đột kích không dùng phép thuật'']: pronouns_and_address: Trần thuật hạn tri dùng
    `Tanya` và `nó` (`DEC-P01-001`), quy chiếu đám tân binh bằng `họ`.: pov_and_voice:
    Trần thuật hạn tri khép lại batch bằng quyết định thực chiến trái với mong muốn
    cá nhân của Tanya.: modality_and_logic: Bảo toàn phép so sánh hơn và quan hệ nhân
    quả – nhượng bộ: Tanya tin rằng điều tân binh cần hơn việc tích lũy kinh nghiệm
    dưới sự bảo bọc trong một chiến dịch lớn là sự rèn luyện lặp đi lặp lại và rút
    kinh nghiệm/ôn tập kỹ lưỡng qua các trận đánh nhỏ; vì thế dù không muốn, nó vẫn
    quyết định thực hiện một cuộc đột kích không dùng phép thuật.: emphasis: none'
  non_canon: true
