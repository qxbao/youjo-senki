unit_count: 25
segment_id_start: YS-LN02/Text/part0014.xhtml/p000392
segment_id_end: YS-LN02/Text/part0014.xhtml/p000416
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000392
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000392: locks: [''Giữ tên riêng
    `Tanya`, các thuật ngữ `học thuyết tác chiến của Quân đội Đế quốc`, `Tư tưởng
    lấy nhiệm vụ làm trọng`, `sĩ quan`, `cấp dưới`, đại từ phản thân `mình`, đại từ
    số nhiều `họ`, và câu kết `nếu sĩ quan có cấp dưới giỏi, họ không cần phải cầm
    tay chỉ việc, dạy cấp dưới cách bắn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000393
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000393: locks: [''Giữ bản sửa theo
    signoff `F01` với danh xưng `Tiểu đoàn Pháp sư Không quân 203`, `hỗ trợ dẫn đường`,
    tên riêng `Norden Control` cùng dạng rút gọn `Control` (theo `vol02-ch02-b15-norden-control`
    và `vol02-ch02-b15-control-short-form`), và câu kết `Một cuộc chiến không có Control
    chẳng khác nào màn quần thảo thô bạo giữa những pháp sư đơn độc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000394
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000394: locks: [''Giữ bản sửa theo
    signoff `F01` với dạng rút gọn `Control` (`Bởi nếu không có Control duy trì trật
    tự cần thiết, mỗi pháp sư sẽ chỉ bay lượn riêng lẻ.`) và câu kết `Sức mạnh không
    thể kiểm soát thì chẳng đáng là mối đe dọa.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000395
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000395: locks: [''Giữ bản sửa theo
    signoff `F01` với hô hiệu `Pixie 01`, cụm `toàn đội`, và thuật ngữ `Control địch`
    trong câu thoại `“Pixie 01 gọi toàn đội. Control địch đã bị loại bỏ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000396
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000396: locks: [''Giữ bản sửa theo
    signoff `F02` với cụm `mắt xích then chốt trong hệ thống chỉ huy của địch`, cách
    quy chiếu trung tính `người đó` (theo `vol02-ch02-b15-uncertain-she-reference`),
    đại từ `chúng`, và hậu tố tình thái `… xem ra là vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000397
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000397: locks: [''Giữ chữ viết
    tắt `CP`, hình ảnh so sánh `một bầy Don Quixote`, và toàn văn `Giờ đây, kẻ địch
    không còn là các đơn vị mà chỉ là một đám người ô hợp. Đám pháp sư mất CP chẳng
    khác nào một bầy Don Quixote, mỗi kẻ tự đánh trận của mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000398
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000398: locks: [''Giữ hô hiệu `Pixie
    01`, chữ viết tắt `CP`, đại từ `các anh`, và câu lệnh vô tuyến `“Pixie 01 gọi
    CP. Báo cáo tình hình những kẻ địch các anh đã phát hiện.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000399
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000399: locks: [''Giữ chữ viết
    tắt `CP`, độ cao nguyên gốc `6.500 feet` (theo `vol02-ch02-b11-height-unit`),
    các thuật ngữ `lực lượng tiên phong`, `một trung đoàn dự bị`, `Hai đại đội`, `máy
    bay ném bom`, `viện binh`, và các đại từ `họ`, `Chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000400
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000400: locks: [''Giữ các đại từ
    ngôi thứ nhất số nhiều `ta`, `chúng ta`, cụm danh từ thường `bộ chỉ huy địch`
    (phân biệt với `Control` viết hoa theo `F01`), và các thuật ngữ `lực lượng hộ
    tống`, `đội tiên phong đang rối loạn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000401
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000401: locks: [''Giữ bản sửa theo
    signoff `F02` với đại từ nội tâm tự quy chiếu `mình` theo `DEC-P01-001` (`Theo
    mình thấy`), đại từ `chúng`, và các danh xưng `pháp sư của Liên minh Entente và
    phe Cộng hòa`, `tác chiến tập thể`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000402
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000402: locks: [''Giữ các danh
    xưng `Quân đội Đế quốc chúng ta`, `Tiểu đoàn Pháp sư Không quân 203`, cụm `khóa
    huấn luyện địa ngục ấy`, đại từ nội tâm `mình`, và sự phân biệt đại từ `chúng`
    (địch) với `họ` (các pháp sư Tiểu đoàn 203).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000403
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000403: locks: [''Giữ cụm `máy
    bay ném bom của địch`, đại từ nội tâm `mình`, đại từ `chúng`, và các cụm `theo
    quy định không quân`, `được tăng lương cùng vài khoản phụ cấp.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000404
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000404: locks: [''Giữ tên riêng
    `Tanya` và câu trần thuật `Ồ, đúng là tuyệt thật. Tanya vô thức liếm môi một cách
    thô tục.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000405: locks: [''Giữ sự chuyển
    tiếp điểm nhìn chuẩn `DEC-P01-001` giữa đại từ trần thuật `nó` ở hai câu đầu và
    đại từ nội tâm `mình` / `Mình` ở hai câu sau, cùng các định danh `Dacia`, `luật
    nhân quả`, `Being X`, và `một đấng nhân từ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000406
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000406: locks: [''Giữ các định
    danh đơn vị `Các Đại đội Một, Hai và Ba`, `hai tiểu đoàn tiên phong của địch`,
    `Đại đội Bốn`, và ngôi tự xưng `tôi` trong câu mệnh lệnh `“Các Đại đội Một, Hai
    và Ba, truy kích hai tiểu đoàn tiên phong của địch. Đại đội Bốn, theo tôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000407
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000407: locks: [''Giữ các đại từ
    `Chúng ta`, `Mình`, và chức danh `chỉ huy tiểu đoàn, là người dẫn đầu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000408
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000408: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình` theo `DEC-P01-001`, đúng phạm vi nhấn mạnh in nghiêng `*Có
    khi đến lúc nào đó mình sẽ phải tự thân chiến đấu*` theo `DEC-P01-002`, và cụm
    `đối phó với các đơn vị địch cho đám cấp dưới.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000409
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000409: locks: [''Giữ các đại từ
    `họ`, `Mình` / `mình`, cụm `cấp dưới`, và toàn văn câu nội tâm.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000410
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000410: locks: [''Giữ danh xưng
    `Bộ Tổng tham mưu Lục quân Đế quốc`, cụm `đám người này`, đại từ nội tâm `mình`
    / `Mình`, và vế `thuế má tuy cũng là một thứ tội ác, nhưng mình muốn chuộc lỗi
    bằng cách dùng khoản tiền ấy cho có ý nghĩa.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000411
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000411: locks: [''Giữ đại từ nội
    tâm `mình`, các cụm `bị phạt điều ra tiền tuyến`, `tận dụng chức vụ, bắt cấp dưới
    làm những việc nặng nhọc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000412
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000412: locks: [''Giữ các đại từ
    `Bọn họ`, `Mình`, các cụm `thành tích phát hiện và đề bạt nhân tài để tìm đường
    ra hậu phương`, và `kịch bản đôi bên cùng có lợi lý tưởng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000413
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000413: locks: [''Giữ các định
    danh `Đại đội Bốn`, `lực lượng hộ tống và máy bay ném bom`, `hai tiểu đoàn đó`,
    cùng ngôi thứ nhất số nhiều `chúng ta` / `ta` trong câu mệnh lệnh.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000414
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000414: locks: [''Giữ bản sửa theo
    signoff `F02` với đại từ nội tâm `mình` / `Mình` xuyên suốt theo `DEC-P01-001`,
    các định danh `Đại đội Bốn`, `đội hộ tống`, `cấp dưới của mình`, `cuộc tập kích
    vòng sau`, và câu kết `Phương án dự phòng đã sẵn sàng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000415
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000415: locks: [''Giữ cụm `Kế hoạch
    tác chiến` và lời mở đầu `“Kế hoạch tác chiến đến đây là hết. Dù vậy, thưa các
    quý ông…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000416
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000416: locks: [''Giữ bản sửa theo
    signoff `F11` với định danh `Cụm tập đoàn quân phương Bắc` (theo `vol02-ch02-b15-northern-army-group`),
    các đại từ `mình`, `họ`, và cụm `tinh thần chiến đấu của một chỉ huy tiền tuyến.`.'']'
  non_canon: true
