  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000555
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000555: terms: [''chuyên gia (experts)'']:
    pronouns_and_address: []: pov_and_voice: Độc thoại nội tâm mang tính châm ngôn
    sinh tồn của Tanya.: modality_and_logic: Giữ cấu trúc khái quát vô nhân xưng (`Muốn
    sống sót thì không thể ngần ngại học hỏi kinh nghiệm từ chuyên gia`) và thứ tự
    ưu tiên sống sót trước rồi mới tính kế hoạch tiếp theo.: emphasis: Khóa chính
    xác vùng chữ nghiêng `*sau khi*` ở câu 2 theo DEC-P01-002.: locks: [''Khóa vùng
    nhấn mạnh `*sau khi*` theo DEC-P01-002 và mệnh đề ưu tiên sự sống sót.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000556
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000556: terms: [''hải quân (the
    navy)'', ''sĩ quan hải quân (navy officers)'', ''Lịch diễn tập (the exercise schedule)'']:
    pronouns_and_address: [''Độc thoại nội tâm dùng `chúng ta` cho phía Tanya và các
    sĩ quan tham dự được mời ăn tối.'']: pov_and_voice: Độc thoại nội tâm hài hước,
    thực dụng của Tanya về bữa tối của sĩ quan hải quân.: modality_and_logic: Giữ
    điều kiện thời gian (`Nếu cuộc họp kéo dài đủ lâu`), phần giải thích rõ bữa tối
    là món ngon dành cho sĩ quan hải quân, và thái độ thoải mái nếu lịch diễn tập
    kéo dài hơn dự kiến.: emphasis: Không dùng `*...*`.: locks: [''Khóa `hải quân`,
    `chúng ta`, `sĩ quan hải quân` và `Lịch diễn tập`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000557
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000557: terms: [''hải quân (the
    navy)'', ''chiến trường tiếp theo (her next battlefield)'']: names_and_ranks:
    [''Tanya'']: pronouns_and_address: [''Trần thuật dùng tên riêng `Tanya` và đại
    từ `chính nó`.'']: pov_and_voice: Lời kể tổng kết khép lại Chương 4 với sự lệch
    pha trớ trêu đặc trưng giữa mong muốn chủ quan của Tanya và bước tiến tới chiến
    thắng.: modality_and_logic: Giữ đầy đủ các vế: tiếp tục tận tụy làm việc, vun
    đắp tình hữu nghị đáng mừng với hải quân, hướng mắt về chiến trường tiếp theo,
    mệnh đề nhượng bộ xen giữa (`—dù điều đó trái với suy nghĩ của chính nó—`), và
    kết quả từng bước tiến tới chiến thắng.: emphasis: Không dùng `*...*`.: locks:
    [''Khóa `Tanya`, `hải quân`, `chiến trường tiếp theo`, mệnh đề `—dù điều đó trái
    với suy nghĩ của chính nó—` và đại từ trần thuật `nó`.'']'
  non_canon: true
