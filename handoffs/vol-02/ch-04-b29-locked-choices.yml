  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000553: terms: [''Tiểu đoàn Pháp
    sư Trên không 203 (the 203rd Aerial Mage Battalion)'', ''đơn vị tinh nhuệ (elite)'',
    ''pháp sư (mages)'']: pronouns_and_address: [''Trần thuật dùng đại từ `Nó` cho
    Tanya.'']: pov_and_voice: Trần thuật giải thích lý do thực tế đằng sau lời nói
    của Tanya.: modality_and_logic: Khóa bản sửa `B29-F10`: tên đơn vị `Tiểu đoàn
    Pháp sư Trên không 203` và mức độ đánh giá `việc thiếu hiểu biết về các lĩnh vực
    khác thực sự là một vấn đề`; giữ ý Tanya một nửa lấy việc huấn luyện chưa đầy
    đủ làm cái cớ.: emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ `Nó`, `Tiểu
    đoàn Pháp sư Trên không 203` và `thực sự là một vấn đề` (B29-F10).'']'
