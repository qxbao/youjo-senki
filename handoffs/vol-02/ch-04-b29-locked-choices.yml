    đại diện thủy quân lục chiến.: modality_and_logic: Giữ thái độ ngại ngùng thừa
    nhận chưa huấn luyện nhiều theo hướng tác chiến trên tàu và sự đồng thuận về nhu
    cầu `huấn luyện lại`.: emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ `Tôi`
