- segment_id: YS-LN02/Text/part0024.xhtml/p000554
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000554: terms: [''huấn luyện chung
    (joint training)'', ''thủy quân lục chiến (the marines)'']: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Trần thuật dùng tên riêng `Tanya`.'']: pov_and_voice:
    Trần thuật nêu mong muốn huấn luyện chung của Tanya.: modality_and_logic: Khóa
    bản sửa `B29-F11`: dùng cụm khái quát `huấn luyện chung` (không thu hẹp thành
    tập trận) và giữ sắc thái mong muốn (`Tanya hy vọng có thể huấn luyện chung với
    thủy quân lục chiến, lực lượng giàu kinh nghiệm nhất trong lĩnh vực này`).: emphasis:
    Không dùng `*...*`.: locks: [''Khóa `Tanya`, `huấn luyện chung` (B29-F11) và `thủy
