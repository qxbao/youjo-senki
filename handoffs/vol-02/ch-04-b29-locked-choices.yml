choices:
- segment_id: YS-LN02/Text/part0024.xhtml/p000529
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000529: terms: [''hạm đội (the
    fleet)'', ''chống hạm (counter-ship combat)'', ''pháp sư (mages)'', ''chống pháp
    sư và chống máy bay (anti-mage and anti–air combat)'']: pronouns_and_address:
    [''Tạm giữ `Tôi` ở câu 2 tại ranh giới đầu batch (cho phép chỉnh nhẹ thành `Mình`
    ở bước chuốt văn nếu đồng bộ nội tâm).'']: pov_and_voice: Nhận xét bối cảnh từ
    góc nhìn của Tanya về nhiệm vụ ban đầu của hạm đội và định kiến xem pháp sư chỉ
    tác chiến trên bộ.: modality_and_logic: Khóa thuật ngữ `chống hạm` (`vol02-ch04-b29-counter-ship-doctrine`);
    giữ mức độ phủ định (`vẫn chưa phổ biến đến vậy`), thông tin nghe nói về làn sóng
    yêu cầu nâng cấp tàu trong năm nay như biện pháp đối phó, và nhận định thực tế
    rằng mọi người vẫn nghĩ pháp sư chiến đấu trên bộ.: emphasis: Không dùng `*...*`.:
    locks: [''Khóa `hạm đội`, `chống hạm`, `pháp sư`, `trên bộ` và thông tin nghe
    nói trong năm nay.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000530
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000530: terms: [''quả cầu tính
    toán / quả cầu (Computation orb / orbs)'', ''thông số máy bay / máy bay (aircraft
    specs / planes)'']: pronouns_and_address: []: pov_and_voice: Phân tích nội tâm
    nối tiếp về sự tiến bộ kỹ thuật của quả cầu tính toán và máy bay.: modality_and_logic:
    Giữ quan hệ nhân quả (`Vì thế`) và sắc thái phỏng đoán dè dặt kết hợp thời điểm
    mới chớm (`ý nghĩ rằng có lẽ quả cầu và máy bay là mối đe dọa chỉ mới bắt đầu
    lan rộng`).: emphasis: Không dùng `*...*`.: locks: [''Khóa `quả cầu tính toán`,
    `thông số máy bay`, tình thái `có lẽ` và mức độ `chỉ mới bắt đầu lan rộng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000531
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000531: terms: [''ngành hàng không
    (aviation)'', ''Thế chiến thứ hai (the Second World War)'', ''khoa học và công
    nghệ (scientific and technological advances)'']: pronouns_and_address: []: pov_and_voice:
    Độc thoại nội tâm của Tanya liên hệ tới lịch sử Thế chiến thứ hai từ ký ức kiếp
    trước.: modality_and_logic: Giữ điều kiện giới hạn duy nhất (`Chỉ những ai hiểu
    lịch sử phát triển vượt bậc của ngành hàng không trong Thế chiến thứ hai mới hiểu
    được`) và phủ định tuyệt đối trước mốc thời gian đó (`Trước đó, chẳng ai hình
    dung...`).: emphasis: Không dùng `*...*`.: locks: [''Khóa `ngành hàng không`,
    `Thế chiến thứ hai`, `khoa học và công nghệ` và cấu trúc `Chỉ những ai ... mới
    hiểu được`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000532
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000532: terms: [''phòng không (air
    defense)'']: pronouns_and_address: [''Sĩ quan hải quân phát biểu dùng `chúng ta`.'']:
    pov_and_voice: Lời thoại ngập ngừng của phía hải quân trong buổi tổng kết.: modality_and_logic:
    Giữ cấu trúc phủ định rào đón bỏ lửng (`Không phải chúng ta xem nhẹ việc phòng
    không, nhưng…`).: emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ `chúng
    ta`, `phòng không` và cấu trúc rào đón `Không phải ..., nhưng…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000533
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000533: terms: [''các tàu khác
    (other ships)'']: pronouns_and_address: [''Sĩ quan hải quân dùng `chúng ta`.'']:
    pov_and_voice: Lời thoại của sĩ quan hải quân nêu điều kiện cân nhắc dựa trên
    nhiệm vụ đối phó tàu chiến.: modality_and_logic: Giữ câu điều kiện gắn với việc
    phát sinh trở ngại khi giao chiến với tàu khác (`Nếu nảy sinh vấn đề khi đối phó
    với các tàu khác thì chúng ta sẽ phải xem xét`).: emphasis: Không dùng `*...*`.:
    locks: [''Khóa điều kiện `Nếu nảy sinh vấn đề khi đối phó với các tàu khác` và
    đại từ `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000534
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000534: terms: [''sĩ quan (officers)'',
    ''hải quân (the navy)'', ''nhiệm vụ chống hạm ban đầu (original counter-ship combat
    mission)'']: pronouns_and_address: [''Dùng đại từ phản thân `mình` cho `hải quân`.'']:
    pov_and_voice: Trần thuật nhận xét tư duy ăn sâu bén rễ của các sĩ quan hải quân.:
    modality_and_logic: Khóa cụm `nhiệm vụ chống hạm ban đầu` (`vol02-ch04-b29-counter-ship-doctrine`);
    giữ phủ định kép đánh giá năng lực (`chẳng hề kém cỏi`) và quan hệ nguyên nhân–kết
    quả giải thích vì sao tàu được trang bị để đối phó tàu.: emphasis: Không dùng
    `*...*`.: locks: [''Khóa `chẳng hề kém cỏi`, `hải quân` và `nhiệm vụ chống hạm
    ban đầu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000535
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000535: terms: [''học thuyết chống
    hạm (counter-ship doctrine)'', ''pháo phụ (secondary guns)'', ''cận chiến (close-quarters
    fighting)'', ''xuồng phóng ngư lôi (torpedo boats)'', ''tàu khu trục (destroyers)'']:
    pronouns_and_address: [''Quy chiếu phía hải quân bằng `họ`.'']: pov_and_voice:
    Trần thuật giải thích lý do chiến thuật khiến hải quân muốn giữ pháo phụ.: modality_and_logic:
    Khóa bản sửa `B29-F02` (`pháo phụ`) và `học thuyết chống hạm`; giữ thế nhượng
    bộ rằng dù tầm quan trọng của trang bị cận chiến đã giảm, nhu cầu chống lại xuồng
    phóng ngư lôi và tàu khu trục lao vào tấn công vẫn là yếu tố họ không thể bỏ qua.:
    emphasis: Không dùng `*...*`.: locks: [''Khóa `học thuyết chống hạm`, `pháo phụ`
    (B29-F02), `cận chiến`, `xuồng phóng ngư lôi`, `tàu khu trục` và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000536
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000536: terms: [''bộ phận Công
    nghệ (Technology / the Technology Department)'', ''bộ chỉ huy hải quân (navy command)'']:
    pronouns_and_address: [''Người phát biểu dùng `Chúng ta`.'']: pov_and_voice: Lời
    kết luận hành chính khép lại chủ đề nâng cấp phòng không trong cuộc họp.: modality_and_logic:
    Khóa bản sửa `B29-F03` (`bộ phận Công nghệ` ở cả hai câu) và `bộ chỉ huy hải quân`;
    giữ ý chuyển giao vấn đề cho hai đầu mối này bàn bạc xử lý.: emphasis: Không dùng
    `*...*`.: locks: [''Khóa `bộ phận Công nghệ` (B29-F03), `bộ chỉ huy hải quân`
    và đại từ `Chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000537
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000537: terms: [''hỏa lực phòng
    không (the anti–air fire)'']: names_and_ranks: [''Tanya'']: pronouns_and_address:
    [''Trần thuật dùng tên riêng `Tanya`, phản thân `mình` và đại từ `nó` (lưu ý `xếp
    nó lại` ở câu 1 quy chiếu `ý tưởng`).'']: pov_and_voice: Trần thuật đúc kết kết
    cục kiến nghị bị xếp lại và thái độ thực dụng của Tanya.: modality_and_logic:
    Giữ cấu trúc đối lập `không bác bỏ ý tưởng mà sẽ xem xét thêm—về cơ bản có nghĩa
    là xếp nó lại`, nhận định Tanya đã làm tròn bổn phận khi nêu ý kiến, và ý phủ
    định rằng việc tăng cường hay không tăng cường hỏa lực phòng không chẳng ảnh hưởng
    gì đến Tanya.: emphasis: Không dùng `*...*`.: locks: [''Khóa `Tanya`, đại từ trần
    thuật `nó`, `hỏa lực phòng không` và nghĩa thực chất của việc ghi nhận để xem
    xét là `xếp nó lại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000538
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000538: terms: [''Đế quốc (the
    Empire)'', ''quốc gia lục địa (a continental state)'', ''quốc gia hàng hải (a
    maritime state)'']: pronouns_and_address: [''Nội tâm tự quy chiếu của Tanya dùng
    `mình`; đại từ `nó` ở câu 1 quy chiếu `con tàu`.'']: pov_and_voice: Độc thoại
    nội tâm thẳng thắn của Tanya.: modality_and_logic: Giữ điều kiện loại trừ (`Miễn
    không phải con tàu mình đang ở trên đó, nó chìm ở đâu cũng chẳng liên quan đến
    mình`) và đối lập địa chính trị (`Đế quốc là một quốc gia lục địa, không phải
    quốc gia hàng hải`).: emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ nội
    tâm `mình`, `Đế quốc`, `quốc gia lục địa` và `quốc gia hàng hải`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000539
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000539: terms: [''huấn luyện binh
    sĩ (training my troops)'']: pronouns_and_address: [''Câu 1 trần thuật dùng `nó`;
    câu 2 độc thoại nội tâm dùng `mình`.'']: pov_and_voice: Chuyển tiếp từ trần thuật
    ngôi thứ ba ở câu 1 sang độc thoại nội tâm ngôi thứ nhất của Tanya ở câu 2.: modality_and_logic:
    Giữ sự đối lập giữa vẻ ngoài điềm đạm giấu kín suy nghĩ thật với sự nghiêm túc
    tuyệt đối bên trong, cùng kết luận rằng cách tốt nhất để đảm bảo sống sót là huấn
    luyện binh sĩ của mình.: emphasis: Không dùng `*...*`.: locks: [''Khóa sự phân
    tách đại từ trần thuật `nó` (câu 1) và nội tâm `mình` (câu 2) theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000540
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000540: terms: [''buổi tổng kết
    (this postmortem)'']: pronouns_and_address: [''Trần thuật dùng `nó` / `Nó` cho
    Tanya.'']: pov_and_voice: Trần thuật giải thích sự hăng hái của Tanya trong buổi
    họp tổng kết sau diễn tập.: modality_and_logic: Giữ mạch lý giải rằng Tanya hăng
    hái vạch ra các vấn đề vì tin rằng ngăn ngừa sai lầm là cách tốt nhất.: emphasis:
    Không dùng `*...*`.: locks: [''Khóa `buổi tổng kết`, đại từ trần thuật `nó` /
    `Nó` và mệnh đề `ngăn ngừa sai lầm là tốt nhất`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000541
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000541: terms: [''Phía tấn công
    (the attacking side)'']: pronouns_and_address: []: pov_and_voice: Lời người chủ
    trì cuộc họp hỏi thêm ý kiến từ phía tấn công.: modality_and_logic: Giữ câu hỏi
    mở dành cho phía tấn công.: emphasis: Không dùng `*...*`.: locks: [''Khóa `Phía
    tấn công`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000542
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000542: terms: [''vấn đề trong
    phối hợp (cooperation problems)'']: pronouns_and_address: [''Tanya phát biểu tự
    xưng `tôi`.'']: pov_and_voice: Lời phát biểu của Tanya nêu vấn đề phối hợp.: modality_and_logic:
    Giữ cách nêu ý kiến chừng mực (`Theo tôi, có vấn đề trong phối hợp`).: emphasis:
    Không dùng `*...*`.: locks: [''Khóa đại từ `tôi` và `vấn đề trong phối hợp`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000543
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000543: terms: []: pronouns_and_address:
    []: pov_and_voice: Câu hỏi ngắn yêu cầu làm rõ loại vấn đề.: modality_and_logic:
    Giữ câu hỏi ngắn gọn.: emphasis: Không dùng `*...*`.: locks: [''Khóa câu hỏi `“Vấn
    đề kiểu gì?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000544
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000544: terms: [''Thủy quân lục
    chiến / thủy quân lục chiến (The marines / the marines)'', ''thủy thủ / các thủy
    thủ (sailors / the sailors)'']: pronouns_and_address: [''Tanya tự xưng `Tôi`.'']:
    pov_and_voice: Lời nhận xét của Tanya chỉ ra sự thiếu ăn ý giữa thủy quân lục
    chiến và thủy thủ.: modality_and_logic: Khóa thuật ngữ `thủy quân lục chiến` (`vol02-ch04-b29-marines`)
    và `thủy thủ`; giữ sắc thái nhận xét cảm quan lịch sự (`dường như phối hợp không
    ăn ý lắm`, `Tôi có cảm giác`) và hướng tác động là sự lộn xộn của các thủy thủ
    làm cản trở thủy quân lục chiến.: emphasis: Không dùng `*...*`.: locks: [''Khóa
    `Thủy quân lục chiến`, `thủy thủ`, đại từ `Tôi` và quan hệ nhân quả `sự lộn xộn
    của các thủy thủ đang cản trở thủy quân lục chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000545
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000545: terms: [''trên boong (the
    deck)'', ''hai lực lượng (the two different corps)'']: pronouns_and_address: [''Trần
    thuật dùng `Nó` cho Tanya.'']: pov_and_voice: Trần thuật hồi tưởng quan sát của
    Tanya khi tiếp cận tàu.: modality_and_logic: Khóa bản sửa `B29-F04`: thời điểm
    quan sát là `lúc tiến lại gần tàu`, tình trạng trên boong tàu là `thật hỗn loạn`,
    và cách gọi trung tính `hai lực lượng` (không tự suy diễn thành hai quân chủng).:
    emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ `Nó`, `lúc tiến lại gần tàu`,
    `trên boong thật hỗn loạn` và `hai lực lượng` (B29-F04).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000546
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000546: terms: [''những đơn vị
    cùng phục vụ trên một con tàu (units that are shipmates)'', ''thủy quân lục chiến
    (the marines)'', ''tác chiến trên bộ và đổ bộ (ground and landing battles)'']:
    pronouns_and_address: [''Câu 2 độc thoại nội tâm của Tanya dùng `mình`; quy chiếu
    các đơn vị / thủy quân lục chiến bằng `họ`.'']: pov_and_voice: Độc thoại nội tâm
    của Tanya đánh giá nguyên nhân phối hợp kém.: modality_and_logic: Khóa bản sửa
    `B29-F05`: giữ giả định trái thực tế (`Nếu họ chỉ mới được bố trí đến đó hôm nay
    thì phối hợp kém còn có thể hiểu được`) đối lập với thực tế họ là `những đơn vị
    cùng phục vụ trên một con tàu`, đồng thời dùng đại từ nội tâm `mình` ở câu 2 khi
    nhận xét thủy quân lục chiến dường như coi nhiệm vụ của mình chỉ gồm `tác chiến
    trên bộ và đổ bộ`.: emphasis: Không dùng `*...*`.: locks: [''Khóa điều kiện giả
    định `Nếu họ chỉ mới được bố trí đến đó hôm nay`, cụm đối lập `những đơn vị cùng
    phục vụ trên một con tàu`, đại từ nội tâm `mình` (B29-F05), `thủy quân lục chiến`
    và `tác chiến trên bộ và đổ bộ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000547
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000547: terms: [''tác chiến trên
    tàu (fighting on board a ship)'', ''thủy thủ (sailors)'', ''bộ phận bán hàng (sales)'',
    ''bộ phận kỹ thuật hệ thống (systems engineering)'', ''những đợt làm việc đến
    chết / *làm việc đến chết* (a death march / *death march*)'']: pronouns_and_address:
    [''Độc thoại nội tâm của Tanya dùng `mình` ở câu 1, cấu trúc khái quát `đâu ai
    muốn` ở vế thứ hai, và `họ` cho thủy quân lục chiến.'']: pov_and_voice: Độc thoại
    nội tâm của Tanya liên hệ sự rạn nứt phối hợp giữa thủy thủ và thủy quân lục chiến
    với kinh nghiệm quản trị doanh nghiệp.: modality_and_logic: Khóa bản sửa `B29-F06`
    (`mình không thể phủ nhận`, `đâu ai muốn họ tác chiến trên tàu kém cỏi`) và `B29-F07`
    (`bộ phận bán hàng và bộ phận kỹ thuật hệ thống`, lặp hình ảnh `những đợt làm
    việc đến chết` -> `chữ *chết* trong *làm việc đến chết* mang nghĩa đen`).: emphasis:
    Khóa chính xác hai vùng chữ nghiêng tách biệt `*chết*` và `*làm việc đến chết*`
    ở câu cuối theo DEC-P01-002 (B29-F07); không in nghiêng lần xuất hiện đầu ở câu
    3.: locks: [''Khóa đại từ `mình` (B29-F06), `bộ phận bán hàng và bộ phận kỹ thuật
    hệ thống`, `những đợt làm việc đến chết` và hai vùng chữ nghiêng `*chết*`, `*làm
    việc đến chết*` (B29-F07).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000548
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000548: terms: [''tự bảo toàn (self-preservation)'',
    ''vị tha (altruistic)'', ''số đông (the majority)'']: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Câu 1 độc thoại nội tâm dùng `chính mình` và `quân ta`;
    câu 2–3 trần thuật dùng tên riêng `Tanya` và đại từ `nó`.'']: pov_and_voice: Chuyển
    từ câu kết nội tâm của Tanya ở câu 1 sang trần thuật bình luận tính hai mặt tự
    bảo toàn / vị tha trong lập luận của Tanya.: modality_and_logic: Giữ tính khả
    thể của rủi ro thương vong ở câu 1, sự đối lập giữa động cơ gốc là `tự bảo toàn`
    với hiệu quả `vị tha`, và cấu trúc phủ định kép ở cuối đoạn (`không thể nói rằng
    nó không hành động nhằm đem lại lợi ích cho số đông`).: emphasis: Không dùng `*...*`.:
    locks: [''Khóa phân tách đại từ nội tâm `chính mình` (câu 1) với trần thuật `Tanya`
    / `nó` (câu 2–3), cặp khái niệm `tự bảo toàn` – `vị tha` và phủ định kép `không
    thể nói rằng nó không hành động nhằm đem lại lợi ích cho số đông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000549
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000549: terms: [''lợi ích số đông
    (the good of the majority)'']: pronouns_and_address: []: pov_and_voice: Trần thuật
    nhận xét tính khả thi của đề xuất do Tanya đưa ra.: modality_and_logic: Khóa bản
    sửa `B29-F09`: giữ đúng sắc thái khả năng (`một đề xuất mà tất cả đều có thể chấp
    nhận`), không biến thành kết quả đã được phê duyệt.: emphasis: Không dùng `*...*`.:
    locks: [''Khóa cụm `một đề xuất mà tất cả đều có thể chấp nhận` (B29-F09).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000550
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000550: terms: [''Trưởng ban trọng
    tài (The head referee)'', ''bên có liên quan (the concerned party)'', ''thủy quân
    lục chiến (the marines)'']: pronouns_and_address: [''Trần thuật quy chiếu Trưởng
    ban trọng tài bằng `ông` và bên liên quan bằng `họ`; trong lời thoại, Trưởng ban
    trọng tài tự xưng `Tôi`.'']: pov_and_voice: Trần thuật mô tả cách Trưởng ban trọng
    tài khéo léo giữ thể diện khi hỏi ý kiến phía thủy quân lục chiến.: modality_and_logic:
    Giữ tình thái phỏng đoán ở câu 1 (`Có lẽ ai cũng lờ mờ nhận ra...`), sự tinh tế
    giữ danh dự/thể diện cho bên liên quan, và câu hỏi trực tiếp dành cho thủy quân
    lục chiến.: emphasis: Không dùng `*...*`.: locks: [''Khóa `Trưởng ban trọng tài`,
    đại từ `ông` / `họ` / `Tôi` và `Phía thủy quân lục chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000551
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000551: terms: [''tác chiến trên
