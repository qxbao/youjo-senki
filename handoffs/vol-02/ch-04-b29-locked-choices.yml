    bố đơn vị mình cũng thiếu kinh nghiệm chiến đấu bên trong tàu và cần huấn luyện
    thêm.: emphasis: Không dùng `*...*`.: locks: [''Khóa `thủy quân lục chiến`, `Tanya`,
