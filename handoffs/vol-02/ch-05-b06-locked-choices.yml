choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000126: terms: [''radio (the radio)'',
    ''đạn nổ trên không (an air burst)'', ''mảnh đạn (shrapnel)'']: pronouns_and_address:
    [''Người kể (cựu binh) tự xưng `tôi`, quy chiếu Pixie 01 bằng `cô ấy` / `cô`;
    dùng `người ta` ở vị trí tân ngữ cảm giác (`khiến người ta rợn lòng`).'']: pov_and_voice:
    Hồi ức ngôi thứ nhất của người cựu binh, bàng hoàng trước sự phấn khởi kỳ dị phát
    ra từ máy vô tuyến.: modality_and_logic: Khóa thuật ngữ `đạn nổ trên không` (`vol02-ch05-b06-air-burst`),
    sự tương phản giữa giọng điệu nhẹ tênh/vui vẻ với nội dung rợn lòng, và câu hỏi
    tu từ cuối đoạn (`Cô ấy không lo mảnh đạn rơi xuống như mưa sao?`).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000127: terms: [''hạ sĩ quan (the
    NCO)'', ''pháo binh (artillerymen)'', ''pháp sư phe mình (our own mages)'']: pronouns_and_address:
    [''Người kể tự xưng `tôi`, gọi người lính hậu cần là `anh hạ sĩ quan`, gộp hai
    người bằng `Chúng tôi`, và quy chiếu pháo binh bằng `họ`.'']: pov_and_voice: Hồi
    ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Giữ phản ứng nhìn nhau
    không cần nghĩ ngợi, câu hỏi tu từ bàng hoàng (`Chúng tôi phải bắt pháo binh nã
    pháo vào các pháp sư phe mình ư?`) và hai tầng hệ quả giả định (nếu bắn trúng
    thì hậu quả khôn lường; dù có được tha thứ thì cũng đã giết chính người của mình).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000128: pronouns_and_address: [''Quy
    chiếu Pixie 01 bằng `Cô ấy`.'']: pov_and_voice: Lời thoại ngắn thốt lên giữa người
    kể và anh hạ sĩ quan trong hầm vô tuyến.: modality_and_logic: Giữ dấu ba chấm
    mở đầu và câu hỏi nghi ngờ độ nghiêm túc của mệnh lệnh (`…Cô ấy nghiêm túc đấy
    à?`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000129: terms: [''pháp sư (the
    mages)'']: pronouns_and_address: [''Quy chiếu Pixie 01 bằng `cô ta` thể hiện sự
    hoài nghi, khó hiểu của người lính nghe lỏm.'']: pov_and_voice: Lời thoại đáp
    lại trong hầm vô tuyến.: modality_and_logic: Giữ lời phủ định ngắn (`Không thể
    nào.`) và câu hỏi chất vấn vì sao các pháp sư lại nghe lời cô ta.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000130: terms: [''Chúa (God)'',
    ''lũ chiên (lambs)'']: pronouns_and_address: [''Quy chiếu Chúa bằng `Ngài`, tự
    nhận là `lũ chiên như chúng ta`, và quy chiếu Pixie 01 bằng `Cô ấy`.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất pha chất châm biếm chua chát của người cựu binh.: modality_and_logic:
    Giữ cấu trúc lựa chọn mỉa mai (`hoặc là Chúa đúng là đồ khốn, hoặc Ngài có một
    toan tính sâu xa nào đó mà lũ chiên như chúng ta còn chẳng thể tưởng tượng nổi`)
    dẫn tới kết luận khẳng định `Cô ấy nghiêm túc thật.`: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000131: terms: [''bắn nhầm quân
    mình (friendly fire)'', ''trận địa pháo (emplacement)'', ''mục tiêu (target)'']:
    pronouns_and_address: []: pov_and_voice: Hồi ức ngôi thứ nhất giải thích quy tắc
    ngầm trên chiến trường.: modality_and_logic: Giữ quan hệ nhân quả: trong trường
    hợp bắn nhầm quân mình, vì không thể xác định trận địa pháo nào đã bắn nhầm mục
    tiêu nên sự việc được xử lý bằng sự im lặng, coi như tai nạn đáng tiếc và không
    ai hé răng.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000132: terms: [''pháo binh (the
    artillery)'', ''nhiệm vụ bắn có quan sát (an observed fire mission)'', ''quân
    ta / quân mình (our troops / our own troops)'', ''mệnh lệnh (an order)'']: pronouns_and_address:
    [''Dùng `quân ta` / `quân mình` cho lực lượng phe mình và `họ` cho pháo binh.'']:
    pov_and_voice: Hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Khóa
    thuật ngữ đã sửa theo B06-02 `nhiệm vụ bắn có quan sát` (`vol02-ch05-b06-observed-fire-mission`),
    giữ thế đối lập trực diện với p000131: nếu pháo binh thực hiện nhiệm vụ bắn có
    quan sát vào khu vực có quân ta thì danh tiếng của họ sẽ tan tành và không ai
    tha thứ kể cả khi đó là mệnh lệnh.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000133: terms: [''Thiếu tá (Major)'']:
    pronouns_and_address: [''Gọi Pixie 01 bằng cấp bậc và đại từ `Thiếu tá, cô…?`.'']:
    pov_and_voice: Lời thoại ngập ngừng, dè dặt qua vô tuyến.: modality_and_logic:
    Giữ nguyên câu hỏi bỏ lửng với hai cụm dấu ba chấm (`…Thiếu tá, cô…?`).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000134: terms: [''nã pháo (the
    bombardment)'']: pronouns_and_address: [''Pixie 01 đại diện đơn vị tự xưng `chúng
    tôi`.'']: pov_and_voice: Lời thoại mệnh lệnh dứt khoát qua vô tuyến của Pixie
    01.: modality_and_logic: Giữ lệnh trấn an phủ định (`Đừng lo cho chúng tôi.`)
    và mệnh lệnh tiếp tục nã pháo.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000135: terms: [''radio (the radio)'']:
    pronouns_and_address: [''Quy chiếu Pixie 01 bằng `Cô ấy`; người kể tự xưng `tôi`
    (kèm `mình` ở mệnh đề phụ `mình đã sợ điều gì`).'']: pov_and_voice: Hồi ức ngôi
    thứ nhất đan xen giữa cảm xúc lúc đó và suy ngẫm ở hiện tại hậu chiến.: modality_and_logic:
    Giữ sự tăng tiến (`Cô ấy càng thêm hăng hái`), nỗi sợ trước sự phấn khởi phát
    ra từ radio, và lời tự đính chính kéo về thời điểm hiện tại (`Không, đến tận bây
    giờ tôi vẫn không rõ chính xác mình đã sợ điều gì`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000136: terms: [''pháo kích (being
    shelled / a bombardment)'', ''chiến hào (a trench)'']: pronouns_and_address: [''Trong
    câu tiếng hét nội tâm tuyệt vọng của người lính chịu pháo kích, dùng đại từ `tôi`
    (`*Kết liễu tôi đi cho rồi!*`).'']: pov_and_voice: Hồi ức ngôi thứ nhất mô tả
    chấn thương tâm lý nơi chiến hào.: modality_and_logic: Khóa cụm từ đã sửa theo
    B06-03 (`cười xòa trước nỗi sợ bị pháo kích`), giữ đúng sắc thái thản nhiên coi
    nhẹ hiểm nguy thay vì chế giễu, cùng nỗi kinh hoàng chỉ người từng trải qua mới
    hiểu được.: emphasis: Khóa chính xác cụm nhấn mạnh `*Kết liễu tôi đi cho rồi!*`
    khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000137: terms: [''tay bắn tỉa (the
    sniper)'']: pronouns_and_address: [''Người kể tự xưng `tôi`, dùng `chúng tôi`
    khi nhắc lúc bị bắn tỉa nhắm bắn.'']: pov_and_voice: Hồi ức ngôi thứ nhất chuyển
    thẳng sang câu hỏi nội tâm trực tiếp ở cuối đoạn.: modality_and_logic: Giữ phép
    so sánh mức độ sợ hãi (ngay cả khi tay bắn tỉa nhắm vào cũng không sợ đến mức
    này), cảm giác lạnh buốt tận xương tủy và câu hỏi nội tâm ở thì hiện tại.: emphasis:
    Khóa chính xác câu hỏi nội tâm in nghiêng `*Cơn lạnh quái quỷ này là sao?*` khớp
    với thẻ `<html:em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000138: terms: [''Pixie 03 (Pixie
    03)'', ''Pixie 01 (Pixie 01)'', ''tín hiệu ma lực (mana signals)'', ''hai nhóm
    pháp sư địch, mỗi nhóm cỡ một đại đội (Two company-sized groups of enemy mages)'']:
    pronouns_and_address: []: pov_and_voice: Lời cảnh báo tác chiến khẩn cấp qua vô
    tuyến từ Pixie 03 gọi Pixie 01.: modality_and_logic: Khóa câu cảnh báo đã sửa
    theo B06-04 (`Hai nhóm pháp sư địch, mỗi nhóm cỡ một đại đội, đang lên cao! Thời
    gian đến lúc tiếp xúc: 600!`), bảo toàn rõ quy mô của từng nhóm, hướng bay lên
    cao và con số `600` nguyên gốc không tự thêm đơn vị thời gian.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000139: terms: [''nhân viên vô
    tuyến (the radio operator)'', ''đài khác (other stations)'']: pronouns_and_address:
    [''Người kể tự xưng `Tôi` và dùng phản thân `mình`.'']: pov_and_voice: Hồi ức
    ngôi thứ nhất của người cựu binh.: modality_and_logic: Giữ hai hành động nối tiếp
    khi có báo động: lời cảnh báo kéo người kể thoát khỏi cơn tê liệt vì sợ, và nhân
    viên vô tuyến cuống cuồng chuyển tiếp thông tin địch sang các đài khác.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000140: terms: [''đơn vị địch mới
    (a new enemy unit)'', ''đơn vị đánh chặn (an intercepting unit)'', ''tuyến Rhine
    (the Rhine lines)'']: pronouns_and_address: [''Người kể tự xưng `tôi`.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Giữ hai khả năng
    phán đoán về đơn vị địch và tâm lý nghịch lý: giao tranh với địch vốn là chuyện
    thường ngày trên tuyến Rhine, nên người kể lại thấy vui lạ thường khi được thoát
    khỏi sự bất thường rợn người vừa rồi để trở về nhịp sống bình thường.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000141: terms: [''phụ tùng thay
    thế và đạn dược (the replacement parts and ammunition)'', ''tuyến hỏa lực (the
    firing line)'', ''giao thông hào (the communication trench)'', ''hạ sĩ quan (the
    NCO)'']: pronouns_and_address: [''Người kể tự xưng `Tôi` / `tôi` (kèm `mình` trong
    `Tôi nhớ mình phải`), gọi người lính hậu cần là `anh hạ sĩ quan`.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Giữ mục đích tranh
    thủ quay về tuyến hỏa lực khi giao thông hào còn tương đối yên ắng, và sắc thái
    ước đoán thời điểm ở dạng câu hỏi nhớ lại (`Vậy hẳn là lúc tôi cảm ơn anh hạ sĩ
    quan, chộp lấy đồ đạc rồi định chạy đi?`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000142: terms: [''radio (the radio)'']:
    pronouns_and_address: [''Người kể tự xưng `Tôi`.'']: pov_and_voice: Hồi ức ngôi
    thứ nhất của người cựu binh.: modality_and_logic: Giữ mức khẳng định chắc chắn
    (`Tôi chắc chắn đã nghe tiếng tặc lưỡi và tiếng thở dài qua radio`) đối lập trực
    tiếp với giọng nói vui vẻ phát ra từ chính chiếc radio ấy chỉ một thoáng trước.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000143: terms: [''Đại đội Một (First
    Company)'', ''giao chiến với pháp sư địch (counter-mage combat)'', ''pháo binh
    (the artillery)'', ''hội quân (join up)'']: pronouns_and_address: [''Pixie 01
    tự xưng `tôi` (`Theo tôi`), dùng `chúng ta` khi nói về việc đánh bật pháp sư địch,
    và dùng `chúng tôi` ở mệnh lệnh cuối (`hội quân với chúng tôi`).'']: pov_and_voice:
    Lời thoại mệnh lệnh sắc lạnh, dứt khoát của Pixie 01 qua vô tuyến.: modality_and_logic:
    Khóa câu mệnh lệnh đã sửa theo phát hiện serious B06-01 (`Những người còn lại,
    đánh vào pháo binh. Xử lý nhanh rồi hội quân với chúng tôi.`), xác định rõ pháo
    binh địch là mục tiêu cần tiêu diệt nhanh của lực lượng còn lại trong khi Đại
    đội Một đi đánh chặn pháp sư địch không hẹn mà tới.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000144: terms: [''cái thần trong
    lời cô ấy / lời nói cũng có thể có thần ngụ trong đó (The spirit in her words
    / spirits can dwell in words)'', ''chiến trường (the battlefield)'', ''ác quỷ
    (the devil)'', ''những lời tiên tri (prophetic writings)'']: pronouns_and_address:
    [''Quy chiếu Pixie 01 bằng `cô ấy`; câu hỏi hướng tới người nghe lược chủ ngữ
    (`Không biết... sao?`); người kể tự xưng `tôi` ở câu cuối.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất trò chuyện trực tiếp với người nghe hậu chiến.: modality_and_logic:
    Khóa toàn bộ sửa chữa theo B06-05 và B06-09 (`reviewer_guidance.provisional_choices.p000144_wordplay`
    và `p000144_uncertainty`): giữ sự kết nối từ vựng giữa `Cái thần trong lời cô
    ấy như một trận bão tuyết` với câu hỏi không đại từ `Không biết lời nói cũng có
    thể có thần ngụ trong đó sao?`, bảo toàn sắc thái dè dặt `nhưng thôi, có lẽ không
    biết thì tốt hơn`, và phép ví von `giống như ác quỷ đọc ngẫu nhiên những lời tiên
    tri` mà không tự suy diễn thành cơ chế phép thuật.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000145: pronouns_and_address: []:
    pov_and_voice: Câu kết ngắn gọn trong lời kể của người cựu binh.: modality_and_logic:
    Giữ câu đúc kết một dòng (`Nói cách khác, hỗn loạn.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000146: terms: [''Pixie 01 (Pixie
    01)'', ''CP (CP)'', ''pháp sư địch (enemy mages)'', ''kế hoạch ban đầu (the original
    plan)'', ''không chiến (air combat)'']: pronouns_and_address: [''Pixie 01 đại
    diện đơn vị xưng `Chúng tôi`, lược đại từ ngôi thứ hai trong câu báo cho CP (`Không
    cần đề phòng không chiến`).'']: pov_and_voice: Lời thoại báo cáo pha mệnh lệnh
    tự tin của Pixie 01 gửi CP qua vô tuyến.: modality_and_logic: Khóa định danh `CP`
    (`vol02-ch05-b06-cp`), thông báo sẽ đón đánh các pháp sư địch đang tiến đến nhưng
    giữ nguyên kế hoạch ban đầu và khẳng định CP không cần đề phòng không chiến.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000147: terms: [''chỉ huy (commander)'']:
    pronouns_and_address: [''Người kể tự xưng `tôi` (kèm `mình` trong `ngăn được mình`).'']:
    pov_and_voice: Hồi ức ngôi thứ nhất đối chiếu nhận xét thông thường với ấn tượng
    kinh hoàng còn in sâu trong ký ức.: modality_and_logic: Giữ cấu trúc giả định
    ở hai câu đầu (bình thường nói thế sẽ là trịch thượng và tự tin thái quá; người
    dưới quyền hẳn là không may mắn) đối lập với thực tế mỗi khi hồi tưởng lại ở thì
    hiện tại (`tôi không sao ngăn được mình hét lên: *Đồ quái vật!*`).: emphasis:
    Khóa chính xác cụm cảm thán in nghiêng `*Đồ quái vật!*` khớp với thẻ `<html:em>`
    trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000148: terms: [''anh hùng (A hero)'',
    ''ngôi sao (a star)'', ''sĩ quan pháp sư xuất chúng (an outstanding magic officer)'',
    ''binh sĩ Đế quốc (imperial soldiers)'', ''tuyến Rhine (the Rhine lines)'', ''một
    vị thần (a god)'']: pronouns_and_address: [''Người kể gọi trực tiếp vị chỉ huy
    từ khoảng cách hồi tưởng bằng `Thưa bà, bà...`, và tự xưng số nhiều `tất cả chúng
    tôi, những binh sĩ Đế quốc`.'']: pov_and_voice: Lời tôn vinh trực tiếp đầy kính
    sợ trong hồi ức của người cựu binh.: modality_and_logic: Giữ chuỗi danh ngữ ca
    ngợi ở câu đầu và sự tôn sùng của toàn bộ binh sĩ Đế quốc trên tuyến Rhine coi
    vị chỉ huy ấy là một vị thần.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000149
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000149: terms: [''chỉ huy mới (A
    new commander)'', ''ma lực (mana)'']: pronouns_and_address: [''Trong câu bình
    phẩm coi thường của kẻ xấu số, quy chiếu vị chỉ huy bằng `Cô ta`.'']: pov_and_voice:
    Trích dẫn lời giễu cợt trong quá khứ kèm lời bình lạnh lùng của người cựu binh.:
    modality_and_logic: Giữ sự tương phản mỉa mai giữa lời chê bai vị chỉ huy mới
    (`nhiều ma lực mà chẳng có gì khác? Cô ta chán sống rồi chắc.`) và kết cục của
    chính kẻ nói câu đó (`Đáng tiếc, kẻ buông lời bình phẩm đó giờ đã không còn sống
    nữa.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000150: terms: [''Pixies (Pixies)'',
    ''Đại quân (Great Army)'', ''thần chết (a god of death)'']: pronouns_and_address:
    [''Người nói tự xưng `Tôi`, quy chiếu đơn vị bằng `họ`, những người bên Đại quân
    bằng `Họ`, và vị chỉ huy bằng `cô ta`.'']: pov_and_voice: Lời thoại truyền tai
    nhau về lời đồn từ phía Đại quân.: modality_and_logic: Khóa tên gọi `Pixies`,
    `Đại quân` và lời đồn rằng cô ta là `thần chết`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000151: terms: [''Thiếu tá von
    Degurechaff (Major von Degurechaff)'', ''một vị thần (a god)'', ''sinh tử (life
    and death)'']: pronouns_and_address: [''Quy chiếu Thiếu tá von Degurechaff bằng
    `cô ấy`.'']: pov_and_voice: Hồi ức ngôi thứ nhất xác nhận lời đồn của người cựu
    binh.: modality_and_logic: Khóa cụm từ đã sửa theo B06-06 (`một vị thần có quyền
    năng vô cùng lớn, cai quản sinh tử`), giữ đúng mức độ sức mạnh cực lớn mà không
    tự nâng thành độc nhất vô song.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000152: terms: [''các chiến sĩ
    (troops)'']: pronouns_and_address: [''Pixie 01 gọi thuộc cấp là `các chiến sĩ`
    và `Mọi người`.'']: pov_and_voice: Lời thoại của Thiếu tá von Degurechaff với
    quân lính trước lúc xung trận.: modality_and_logic: Giữ sự tương phản rợn người
    giữa câu chữ nói về niềm vui (`Giờ mọi chuyện bắt đầu vui rồi đấy, các chiến sĩ.
    Mọi người cũng đang vui chứ?`) với cơn giận dữ được mô tả ngay ở đoạn sau.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000153
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000153: pronouns_and_address: [''Quy
    chiếu Thiếu tá von Degurechaff bằng `cô ấy` / `cô` và phản thân `mình`.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Giữ mô tả lời nói
    tràn ngập cơn giận lạnh sống lưng lan khắp khu vực và cấu trúc giả định (`như
    thể cô đang định dụ toàn bộ sự thù địch của quân địch về phía mình, tựa bướm đêm
    lao vào lửa`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000154
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000154: terms: [''Thiếu tá von
    Degurechaff (Major von Degurechaff)'']: pronouns_and_address: []: pov_and_voice:
    Hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Giữ hình ảnh ẩn
    dụ `Thiếu tá von Degurechaff đã nhe nanh` và hệ quả trực tiếp `Hành động ấy khơi
    mào một phản ứng dữ dội.`: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000155
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000155: terms: [''Cộng hòa (The
    Republic)'', ''ác quỷ (the devil)'', ''vị thần chết (the god of death)'', ''Thần
    linh (Gods)'']: pronouns_and_address: [''Quy chiếu Cộng hòa bằng `họ`, các vị
    thần bằng `họ`, và nhóm người lính Đế quốc gồm cả người kể bằng `chúng tôi, những
    người ở bên cạnh họ`.'']: pov_and_voice: Hồi ức ngôi thứ nhất đúc kết bi kịch
    của những người lính thường đứng cạnh vị thần chiến tranh.: modality_and_logic:
    Khóa câu hỏi tu từ đã sửa theo B06-07 (`Thần linh không chết, nhưng chúng tôi,
    những người ở bên cạnh họ, thì sao?`), bảo toàn sự hiện diện của người kể và đồng
    đội trong nhóm chịu thương vong bên cạnh vị thần bất tử.: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000156: terms: [''thần chết (a
    god of death)'']: pronouns_and_address: [''Quy chiếu những người đặt biệt danh
    bằng `Họ` và Thiếu tá von Degurechaff bằng `cô ấy`.'']: pov_and_voice: Lời cảm
    thán trầm ngâm trong hồi ức của người cựu binh.: modality_and_logic: Giữ dấu ba
    chấm mở đầu và lời thừa nhận chua chát (`…Họ gọi cô ấy là thần chết quả chẳng
    sai.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000157
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000157: terms: [''quân địch (the
    enemy)'', ''người của chúng tôi (our men)'', ''vị thiếu tá cao quý (the noble
    major)'']: pronouns_and_address: [''Quy chiếu Thiếu tá von Degurechaff bằng `Cô
    ấy` và danh ngữ `vị thiếu tá cao quý`; dùng `người của chúng tôi` cho binh sĩ
    phe mình.'']: pov_and_voice: Hồi ức ngôi thứ nhất khép lại cảnh chiến trường bằng
    giọng điệu lạnh lẽo, bi tráng.: modality_and_logic: Giữ cấu trúc đối xứng nghiệt
    ngã ở câu 1 (`Cô ấy giết quân địch, còn quân địch giết người của chúng tôi.`)
    và hình ảnh vị thiếu tá cao quý liếc nhìn những xác chết trong bùn rồi rời đi.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
