task_id: vol-02-ch-04-b01
baseline_sha256: 2b4fad3f52cb6ce710e378c48249c6a2ae7044104a53329b3bb0bc8cdc52e278
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 8c4ef83cd0b9d5f7ab26beb7f1275240f5de3ba3f4033d37375d55ff352389fa
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 24
segment_id_start: YS-LN02/Text/part0020.xhtml/p000001
segment_id_end: YS-LN02/Text/part0020.xhtml/p000024
choices:
- segment_id: YS-LN02/Text/part0020.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000001: locks: [''Giữ các danh
    xưng địa danh và tổ chức `thành phố Os`, `Quân đội Đế quốc`, `ban lãnh đạo Liên
    minh Entente`, `Liên minh Entente` theo mục `vol02-ch04-b01-entente-alliance`,
    cùng sự đối lập giữa hai nhóm phản ứng `Có người nâng ly chúc mừng chiến thắng
    của Quân đội Đế quốc. Có người uống cạn thứ rượu đắng ngắt, đón chờ chiến thắng
    ấy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000002: locks: [''Giữ danh xưng
    `Đế quốc`, các cụm `những người trực tiếp tham chiến`, `vận mệnh cận kề của tổ
    quốc`, và chuỗi mệnh đề phủ định – giới hạn `mọi chuyện vẫn chưa kết thúc. Chiến
    thắng của Đế quốc chưa chắc chắn. Chỉ có chính phủ là đã bỏ cuộc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000003: locks: [''Giữ câu khẳng
    định phủ định `Dân thường, nhân dân, vẫn chưa bị đánh bại.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000004: locks: [''Giữ khung dấu
    ngoặc kép lời thoại đã sửa theo M1 và được nghiệm thu (`“...Vậy là chúng ta sẵn
    sàng gieo mầm rồi chứ?”`), đại từ `chúng ta`, và cụm ẩn dụ `gieo mầm` theo mục
    `vol02-ch04-b01-seed-metaphor`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000005: locks: [''Giữ các danh
    xưng chính thể `Cộng hòa`, `Khối Thịnh vượng chung` theo mục `vol02-ch04-b01-commonwealth`,
    và cụm `đồng ý tiếp nhận một người làm nhà ngoại giao`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000006: locks: [''Giữ câu `Kháng
    chiến có thể tiếp tục bên ngoài tổ quốc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000007: locks: [''Giữ danh xưng
    `Đế quốc`, đại từ `họ`, và câu `Đúng vậy, cuộc chiến chống Đế quốc sẽ tiếp diễn
    bên ngoài biên giới của họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000008: locks: [''Giữ đại từ `chúng
    ta` và câu hỏi đề nghị `“Vậy thì, chúng ta cùng ký văn bản chuyển giao quyền hạn
    nhé?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000009: locks: [''Giữ câu thoại
    đã sửa theo M2 và được nghiệm thu (`“Nếu vậy, tôi nghĩ người sẽ tiếp nhận quyền
    hạn ấy nên là Nghị viên Ngoại giao Abensoll.”`), đại từ `tôi`, cụm quy chiếu `người
    sẽ tiếp nhận quyền hạn ấy`, và chức danh – tên riêng `Nghị viên Ngoại giao Abensoll`
    theo mục `vol02-ch04-b01-councilor-portfolio`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000010: locks: [''Giữ phủ định
    mở đầu `Không`, các đại từ `tôi`, `chúng ta`, chức danh – tên riêng `Nghị viên
    Văn hóa Korsor` theo mục `vol02-ch04-b01-councilor-portfolio`, và danh từ `đại
    sứ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000011: locks: [''Giữ câu bác bỏ
    `Tôi không đồng ý.`, chức danh – tên riêng `Nghị viên Abensoll`, đại từ ngôi thứ
    hai `ông`, và cụm `thích hợp với nhiệm vụ này hơn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000012: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở vế tuyên bố `*Chúng ta vẫn còn ở đây.*` theo `DEC-P01-002`
    và cấu trúc `Phải có người sống sót để tiếp tục chiến đấu, để tuyên bố: *Chúng
    ta vẫn còn ở đây.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000013: locks: [''Giữ các danh
    xưng và thuật ngữ `các nghị viên`, `quân đội`, `chính phủ`, `quốc gia thống nhất`,
    `các chính trị gia`, `nhân danh tổ quốc`, `các pháp sư của Liên minh Entente`
    theo mục `vol02-ch04-b01-entente-alliance` và `vol02-ch04-b01-mages`, cùng cấu
    trúc câu điều kiện – nhận định về gia đình của những người lính.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000014: locks: [''Giữ câu thoại
    ngắn `“Chúc may mắn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000015: locks: [''Giữ lời thoại
    tự xưng `Anh` của Sue với vợ (`“…Anh xin lỗi,”`), cấp bậc – tên riêng `Đại tá
    Sue` / `Sue`, các đại từ trần thuật `Bà` (vợ Sue), `họ`, `anh`, danh từ `chủ gia
    đình`, và định danh chính thể `Hợp chúng quốc` theo mục `vol02-ch04-b01-unified-states`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000016: locks: [''Giữ đại từ trần
    thuật `anh`, `họ`, cụm `không còn lựa chọn nào khác ngoài việc đưa họ đi`, và
    đúng phạm vi nhấn mạnh in nghiêng ở hai câu độc thoại nội tâm `*Có lẽ điều duy
    nhất tôi—không, mọi người lính của Liên minh Entente—có thể làm là ôm gia đình
    mình và cùng gửi gắm hy vọng được bình an. Tổ quốc chúng ta không còn an toàn
    nữa.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000017: locks: [''Giữ câu gọi của
    con gái `“Bố ơi?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000018: locks: [''Giữ tên riêng
    `Mary`, cách gọi `mẹ`, `con`, và lời dặn `“Mary, hãy chăm sóc mẹ. Cả con nữa,
    nhớ giữ gìn sức khỏe.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000019: locks: [''Giữ câu hỏi phủ
    định của Mary `“…Bố không thể đi cùng mẹ con con sao?”` và cách xưng hô `Bố` –
    `mẹ con con`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000020: locks: [''Giữ đại từ tự
    xưng `Bố` và câu đáp `“Bố xin lỗi. Bố lại phải làm việc rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000021: locks: [''Giữ các đại từ
    `Anh` / `anh`, `mình`, các thuật ngữ `giao thông đường biển đang ùn tắc`, `kiểm
    soát các tuyến hàng hải`, phủ định `đó là lựa chọn không dành cho nhiều người`,
    và câu kết `Anh quả có hơi áy náy, nhưng nếu bảo vệ được gia đình thì anh không
    hối tiếc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000022: locks: [''Giữ tên riêng
    `Sue`, đại từ trần thuật `Anh` / `anh`, giả định quá khứ ngược thực tế `Giá mà
    anh biết chuyện này sẽ xảy ra, anh đã về nhà thường xuyên hơn.`, và câu hỏi nội
    tâm in nghiêng `*Sao mình lại không biết trân trọng phúc lành được ở gần nhà đến
    thế?*` (dùng đại từ nội tâm `mình`) theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000023: locks: [''Giữ toàn bộ đoạn
    độc thoại nội tâm in nghiêng `*...*` theo `DEC-P01-002`, các đại từ nội tâm `mình`
    / `Mình`, `chúng ta`, danh từ thân tộc `con gái`, `vợ`, và chuỗi hối tiếc quá
    khứ `Lẽ ra mình nên trò chuyện với con gái nhiều hơn... Mình thật ngu ngốc khi
    tin rằng cuộc sống của chúng ta sẽ mãi mãi không đổi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0020.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0020.xhtml/p000024: locks: [''Giữ đại từ trần
    thuật `anh`, phủ định `ngay cả anh cũng không thể giải thích`, và các cụm miêu
    tả cử chỉ `nới lỏng vòng tay vô thức ôm quanh vợ, như thể muốn xua đi chút ngượng
    ngùng, anh vẫn cố nở nụ cười rồi khom người xuống ngang tầm mắt con gái`.'']'
  non_canon: true
