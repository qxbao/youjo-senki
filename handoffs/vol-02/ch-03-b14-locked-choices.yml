segment_id_end: YS-LN02/Text/part0018.xhtml/p000190
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000162
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000162: locks: [''Giữ tên riêng
    `Tanya`, danh xưng `Tướng von Rudersdorf`, đại từ trần thuật `nó` theo `DEC-P01-001`
    và bản sửa N1, thuật ngữ đã khóa `chiến dịch đột kích đường không` theo bản sửa
    V3, đúng phạm vi hai cụm nhấn mạnh in nghiêng `*Vô hiệu hóa pháo bờ biển bằng
    một cuộc tập kích bất ngờ của Pháp sư Không quân*` và `*yểm trợ hạm đội khi họ
    tiến dọc vịnh hẹp*` theo `DEC-P01-002` và bản sửa N2, cùng cụm `một cứ điểm ven
    biển ở tuyến sau` theo bản sửa N3.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000163
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000163: locks: [''Giữ đại từ trần
    thuật `Nó` theo `DEC-P01-001`, đại từ nội tâm `chúng ta`, và các thuật ngữ đã
    khóa theo bản sửa V3, N4, N5: `chiếm cửa vịnh`, `chiến dịch đột kích đường không`,
    `cầu thang tàu`, `nhảy dù`, `quả cầu tính toán`, `súng trường`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000164
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000164: locks: [''Giữ đại từ `chúng
    ta` và các cụm `vô hiệu hóa các khẩu pháo địch trong thời gian ngắn`, `hạm đội
    có thể tiến vào`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000165
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000165: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng `*xông vào*` theo `DEC-P01-002` và bản sửa V4, cùng câu
    `nhưng với người được lệnh phải đi thì chuyện đó nghe thật quá đáng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000166
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000166: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` theo `DEC-P01-001`, đại từ `chúng ta`, `họ`, và các thuật
    ngữ đã khóa theo bản sửa V3, N6: `chiến dịch đột kích đường không`, `nhu cầu quân
    sự của chiến dịch`, `yểm trợ hải quân`, `các pháp sư hải quân`, `trải thảm cho
    hạm đội ung dung tiến vào`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000167
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000167: locks: [''Giữ các đại từ
    `Quân ta`, `họ`, `tôi`, `chúng ta`, và cụm `giáng một đòn quyết định`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000168
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000168: locks: [''Giữ đại từ `chúng
    ta`, thuật ngữ địa hình `vịnh hẹp` theo mục `vol02-ch03-b14-fjord`, và các cụm
    `địa hình phủ tuyết trơn trượt`, `trấn áp lực lượng địch`, `trách nhiệm chiếm
    toàn bộ pháo địch thì quá nặng nề`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000169
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000169: locks: [''Giữ toàn văn
    câu cảm thán nội tâm `Đúng là nhiệm vụ bất khả thi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000170
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000170: locks: [''Giữ các thuật
    ngữ `pháp sư`, `trực tiếp yểm trợ hạm đội`, `tàu chiến`, cụm mở đầu câu cuối `Đáng
    bực thay` theo bản sửa N7, và tên đơn vị đã khóa `Tiểu đoàn Pháp sư Không quân
    203` theo mục `vol02-ch03-b06-aerial-mage-battalion` và bản sửa V6.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000171
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000171: locks: [''Giữ thuật ngữ
    `đội tiên phong`, các đại từ `Chúng tôi`, `cô`, và danh xưng `Thiếu tá von Degurechaff`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000172
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000172: locks: [''Giữ đại từ `Tôi`
    và câu thoại xin phép lịch sự của Tanya `“Tôi xin phép nói đôi lời được không?”`
    theo bản sửa N8.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000173: locks: [''Giữ danh xưng
    `Thiếu tá` và câu hỏi `“Có chuyện gì, Thiếu tá?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000174
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000174: locks: [''Giữ đại từ `tôi`
    và các thuật ngữ quân sự `một tiểu đoàn tăng cường`, `hỏa lực`, `quân số`, `chiếm
    toàn bộ pháo`, `chặn quân tiếp viện của địch chắc chắn sẽ tấn công`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000175
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000175: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` ở cả ba câu theo `DEC-P01-001` và cấu trúc nhấn mạnh `Không
    có gì mình muốn làm ít hơn việc đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000176: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình` theo `DEC-P01-001`, các từ vựng đã khóa theo bản sửa N9 `đè
    bẹp mình`, `lời bào chữa`, thành ngữ `con lừa khoác da sư tử`, và câu cuối `Dù
    thất bại, việc này cũng chưa đến mức chống lệnh khiến mình gặp rắc rối.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000177: locks: [''Giữ đại từ `Chúng
    tôi`, cụm `tăng viện cho đơn vị của cô` theo bản sửa V2, và các thuật ngữ đã khóa
    `hai trung đoàn lính thủy đánh bộ`, `ba mươi phút sau khi nhảy dù` theo mục `vol02-ch03-b14-marines`,
    `vol02-ch03-b14-airborne-action` và bản sửa V3.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000178
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000178: locks: [''Giữ từ đáp `Rõ.`,
    đại từ `tôi`, và câu hỏi thăm dò `“Vậy trong tình huống xấu nhất, tôi có quyền
    đề nghị hủy chiến dịch không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000179
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000179: locks: [''Giữ đại từ trần
    thuật `nó` và phản thân `mình` theo `DEC-P01-001`, cùng các cụm đã khóa theo bản
    sửa N10 `khéo léo gói yêu cầu của mình`, `nhiều khả năng yêu cầu ấy sẽ có sức
    thuyết phục nhất định`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000180
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000180: locks: [''Giữ toàn văn
    câu nhận định nội tâm `Không phải ai đúng ai sai; điều quan trọng là ai đưa ra
    lập luận với giọng lớn và đầy tự tin.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000181
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000181: locks: [''Giữ đại từ `cô`
    trong câu hỏi lại `“…Ý cô là sao?”` theo bản sửa V1 để đồng bộ với p000171, p000177,
    p000186.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000182: locks: [''Giữ đại từ `tôi`
    và câu trả lời `“Chỉ là nếu đơn vị của tôi thất bại, hạm đội có thể gặp nguy hiểm
    không đáng có.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000183
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000183: locks: [''Giữ tính giả
    định và đại từ `chúng ta` trong câu hỏi nội tâm `Giả sử chúng ta thất bại thì
    sao?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000184
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000184: locks: [''Giữ đại từ nội
    tâm `chúng ta` ở cả hai câu đầu theo bản sửa N11, và các cụm `buộc phải rút lui`,
    `những mệnh lệnh bất khả thi kiểu “cứ làm gì đó đi” để hạm đội có thể tiến vào`,
    `lui quân`, `các pháp sư cần làm là bay đi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000185
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000185: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001` và cụm đã khóa theo bản sửa N12 `việc đề nghị ấy
    được ghi nhận cũng sẽ giúp mình lập luận rằng mình đã làm mọi cách để tránh rủi
    ro`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000186
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000186: locks: [''Giữ các đại từ
    `cô`, `chúng ta`, và các cụm `vô hiệu hóa các khẩu pháo`, `ưu tiên bảo đảm an
    toàn cho hạm đội`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000187
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000187: locks: [''Giữ cách quy
    chiếu trung tính đã khóa trong ledger `người đó` theo mục `vol02-ch03-b14-unknown-male-reference`
    và câu `Vượt qua cấp một rồi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000188
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000188: locks: [''Giữ cấu trúc
    đối xứng `Một sĩ quan tốt...` / `Một sĩ quan lo giữ thân...`, các đại từ `chúng
    ta`, `chúng`, và cụm đã khóa theo bản sửa N13 `hậu quả của cuộc xung phong bất
    chấp trong hoàn cảnh ấy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000189
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000189: locks: [''Giữ đại từ `ông
    ấy` và cụm khử mơ hồ chủ thể `phân tích kỹ những lời Tanya đã nói` theo bản sửa
    V5 đã nghiệm thu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000190
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000190: locks: [''Giữ đại từ `chúng
    ta` theo bản sửa N11, các định danh phe phái `phe Cộng hòa` (mục `vol02-ch03-b14-republican-force`),
    `Khối Thịnh vượng chung`, và thuật ngữ `cuộc phong tỏa`.'']'
  non_canon: true
