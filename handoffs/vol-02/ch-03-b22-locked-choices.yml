task_id: vol-02-ch-03-b22
baseline_sha256: 1a177f3fb82ce883ab51204264533836f531d20e3fe4ea7c0ebc5849a3639035
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 8622c3721aa1ea5f7e9a36295664b56f0e3c5efd9a7e020947fcde4ca176312c
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 28
segment_id_start: YS-LN02/Text/part0018.xhtml/p000411
segment_id_end: YS-LN02/Text/part0018.xhtml/p000438
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000411
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000411: locks: [''Giữ các cụm `Vừa
    chạy vào trong, ông đã yêu cầu mọi người ra ngoài.`, `Sau khi cho tất cả tùy tùng
    lui hết, ông kiểm tra xem còn ai quanh đó không rồi mới báo cáo.`, và đại từ `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000412
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000412: locks: [''Giữ câu thoại
    đã sửa theo V1 và được nghiệm thu (`“Tướng, tôi tin ông có thể nói ngắn gọn.”`)
    theo mục `vol02-ch03-b22-general`, bảo toàn đúng chiều thứ bậc từ Đệ nhất Lãnh
    chúa Hải quân nói với Tướng Habergram.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000413
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000413: locks: [''Giữ cách xưng
    hô của Tướng Habergram với cấp trên (`Thưa ngài`, `tôi`, `mình`) và câu báo cáo
    `“Thưa ngài, đã xảy ra một việc tôi không thể tự mình quyết định.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000414
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000414: locks: [''Giữ danh xưng
    `Đệ nhất Lãnh chúa Hải quân` theo mục `vol02-ch03-b22-admiralty-titles`, danh
    từ `cấp trên`, các cụm `đưa bản tóm tắt đã chuẩn bị`, `trình bày khái quát bằng
    lời`, `bổ sung giải thích chi tiết khi cần để cấp trên hiểu rõ`, và đại từ `Ông`
    / `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000415
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000415: locks: [''Giữ danh xưng
    `Liên minh Entente`, các phủ định `Không thể chần chừ, nhưng đồng thời cũng không
    thể hành động thiếu suy nghĩ.`, ẩn dụ `Sinh mệnh của đất nước, như cát trong đồng
    hồ cát, đã bắt đầu cạn dần.`, và mệnh đề điều kiện `Nếu muốn cứu vãn những thành
    quả chính trị vô giá ấy, họ phải hành động gần như ngay lúc này.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000416
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000416: locks: [''Giữ các danh
    xưng và thuật ngữ `nghị viên` theo mục `vol02-ch03-b22-councilor`, `Liên minh
    Entente`, `tàu phụ trợ` theo mục `vol02-ch03-b20-auxiliary-ship`, đại từ `chúng
    ta`, và câu thoại `“Có một nghị viên của Liên minh Entente yêu cầu được đi nhờ
    tàu phụ trợ của chúng ta.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000417
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000417: locks: [''Giữ nhận xét
    `“Tình thế thật nan giải.`, cụm `tàu dân sự mang quốc tịch Khối Thịnh vượng chung`,
    và câu hỏi phủ định `Trong khu vực không có tàu dân sự mang quốc tịch Khối Thịnh
    vượng chung nào neo đậu sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000418: locks: [''Giữ các danh
    xưng và thuật ngữ `chính phủ lưu vong` theo mục `vol02-ch03-b21-government-in-exile`,
    `Đế quốc`, đại từ `ông`, và quan hệ nhân quả `Nhưng ông đang cân nhắc độ khó của
    nhiệm vụ, nên mới hỏi như vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000419
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000419: locks: [''Giữ các danh
    xưng và thuật ngữ `Chính phủ lưu vong`, `Đế quốc`, `các thành viên cốt cán`, `một
    quốc gia được cho là trung lập`, mệnh đề phủ định `Mọi thành tựu chính trị lớn
    mà không phải mạo hiểm đều chỉ là ảo tưởng.`, và chữ `“nan giải”` trong ngoặc
    kép khớp với p000417.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000420
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000420: locks: [''Giữ cụm `lãnh
    thổ Khối Thịnh vượng chung`, chữ nghiêng `*Lytol*` theo `DEC-P01-002`, các đại
    từ `họ`, `nó`, và câu `Dù tàu *Lytol* có cải trang, nó vẫn nổi bật không thể chối
    cãi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000421
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000421: locks: [''Giữ cấu trúc
    đối lập `được đăng ký không phải là phà, mà thuần túy là tàu chở hàng kiêm chở
    khách`, cụm `theo dõi cửa vịnh`, và đại từ `nó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000422
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000422: locks: [''Giữ câu nhận
    định `Mang một nhân vật quan trọng đến thế trên con tàu như vậy là quá mạo hiểm.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000423
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000423: locks: [''Giữ các cụm `“Bốn,
    năm chiếc. Nhưng đều là tàu khách chạy tuyến thường lệ. Tôi chắc Đế quốc đang
    theo dõi chúng.”`, danh xưng `Đế quốc`, và các đại từ `Tôi`, `chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000424
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000424: locks: [''Giữ các danh
    xưng và thuật ngữ `tàu mang quốc tịch Khối Thịnh vượng chung`, `Liên minh Entente`,
    `các cơ sở cảng vịnh`, `vấn đề trung lập`, và mệnh đề `Không hẳn vì vấn đề trung
    lập; Khối Thịnh vượng chung chỉ lo bị cuốn vào cuộc chiến.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000425
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000425: locks: [''Giữ các thuật
    ngữ `các chuyến phà thường lệ`, `sơ tán và xin tị nạn` theo mục `vol02-ch03-b22-asylum-refugee`,
    `tàu thuê chuyến`, `tàu phụ trợ`, và câu điều kiện giả định `Nếu tàu phụ trợ không
    gây chú ý thì mới là chuyện lạ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000426
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000426: locks: [''Giữ các danh
    xưng `Đế quốc`, `Khối Thịnh vượng chung`, các đại từ `Ông`, `họ`, `nó`, và câu
    `Ông không thể tưởng tượng Đế quốc lại bỏ qua chuyện đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000427
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000427: locks: [''Giữ danh xưng
    `Văn phòng Bộ Hải quân` theo mục `vol02-ch03-b22-admiralty-titles`, cụm `cử một
    nhà ngoại giao đến lấy tin tình báo`, và cấu trúc hệ quả `Con tàu nổi bật đến
    mức...`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000428
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000428: locks: [''Giữ chữ nghiêng
    `*Lytol*` theo `DEC-P01-002`, đơn vị tốc độ đã sửa theo V2 và được nghiệm thu
    (`29,5 hải lý/giờ`), các thuật ngữ `tàu chở hàng kiêm chở khách`, `thủy phi cơ`,
    `vòi nước và thiết bị giải trí`, và các đại từ `nó`, `chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000429
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000429: locks: [''Giữ các danh
    xưng và thuật ngữ `tài liệu mật`, `bị khám xét`, `luật quốc tế`, `Thủy thủ đoàn`,
    `các pháp sư`, `Khối Thịnh vượng chung`, và mệnh đề giả định `Nếu không có tài
    liệu mật, ngay cả khi con tàu bị khám xét thì cũng chẳng có vấn đề gì theo luật
    quốc tế.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000430
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000430: locks: [''Giữ toàn bộ đoạn
    đã sửa theo V3 và được nghiệm thu (`bị phát hiện đang giúp người từ một quốc gia
    đang có chiến tranh xin tị nạn`, `giao người tị nạn đi mà không kháng cự` theo
    mục `vol02-ch03-b22-asylum-refugee`, `Liên minh Entente hẳn sẽ muốn người đó được
    canh giữ cẩn thận; họ sẽ nổi giận nếu phía tàu cứ thế giao người đi.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000431
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000431: locks: [''Giữ câu hỏi đã
    sửa theo V4 và được nghiệm thu (`Vậy nếu ông ra lệnh cho thủy thủ đoàn giao chiến
    với đội lên tàu khám xét của Đế quốc thì sao?`), cùng hai câu kết `Câu trả lời
    quá rõ. Việc đó rồi sẽ quay lại hại chính họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000432: locks: [''Giữ chữ nghiêng
    `*Lytol*` theo `DEC-P01-002`, cụm `các tàu tuần tra của Đế quốc`, và câu hỏi `“*Lytol*
    chạy khá nhanh, nhưng có thể vượt được các tàu tuần tra của Đế quốc không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000433
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000433: locks: [''Giữ chữ nghiêng
    `*Lytol*` theo `DEC-P01-002`, thuật ngữ `pháp sư hải quân`, phủ định `không thể
    nói chắc nó sẽ thoát thân an toàn`, và câu hỏi chuyển hướng `Nghĩ xa hơn, liệu
    dùng tàu có thật sự là cách vận chuyển tốt nhất trong trường hợp này không?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000434
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000434: locks: [''Giữ câu thoại
    đã sửa theo V5 và được nghiệm thu (`“Được rồi. Chúng ta sẽ chuyển họ sang một
    chiếc tàu ngầm ngay trên mặt nước.”`), cùng các đại từ `Chúng ta`, `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000435
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000435: locks: [''Giữ danh xưng
    `Đệ nhất Lãnh chúa Hải quân` theo mục `vol02-ch03-b22-admiralty-titles`, cụm `một
    quyết định táo bạo`, và hai khả năng rủi ro `Con tàu hoàn toàn có thể bị đánh
    chìm. Hoặc khu sinh hoạt trên tàu có thể bị tấn công.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000436
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000436: locks: [''Giữ mệnh đề điều
    kiện `Nhưng nếu dùng một phương tiện có thể hoạt động dưới nước, họ có thể ẩn
    mình.` và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000437
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000437: locks: [''Giữ câu hỏi `“Một
    chiếc tàu ngầm ư? Chúng ta có chiếc nào dùng được sao?”` và đại từ `Chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000438
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000438: locks: [''Giữ danh xưng
    `Đô đốc Meyer`, thuật ngữ `hải đội tàu ngầm`, đại từ `chúng ta`, và câu kết chương
    `“Đô đốc Meyer bảo đảm chuyện đó. Dù sao chúng ta cũng cần bàn bạc với hải đội
    tàu ngầm.”`.'']'
  non_canon: true
