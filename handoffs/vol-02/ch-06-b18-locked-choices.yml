- segment_id: YS-LN02/Text/part0030.xhtml/p000580
  kind: terminology_and_voice
  value: 'terms=[''protein'']; pronouns_and_address=Trần thuật ngôi thứ ba quy chiếu
    Grantz bằng đại từ `Anh`.; pov_and_voice=Giọng tả thực ám ảnh về mùi tử khí và
    thịt người cháy trên chiến trường.; modality_and_logic=Bảo toàn đủ 5 câu: anh
    nhận ra cảm giác kích ứng/nhột lạ trong mũi đã bắt đầu từ lúc nào đó -> dù đã
    quen với mùi chiến trường, một mùi hôi đang kích ứng nơi ấy -> đó là mùi thịt
    người cháy -> một xác chết vừa bị thiêu cháy thành than, mùi khét chưa bị mùi
    thối rữa che lấp -> không khí quánh dính vì protein, hôi thối khủng khiếp.; emphasis=none'
