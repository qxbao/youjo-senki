task_id: vol-02-ch-01-b06
baseline_sha256: 2fcc9c7993f9773ad369d595f80f66d11f65103ca3fb18d2a2aa80853d44a6f5
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 5814b5cde912e2c28ada4bf27f8445c39f911a6d0946d556f2a73408979533aa
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 34
segment_id_start: YS-LN02/Text/part0010.xhtml/p000119
segment_id_end: YS-LN02/Text/part0010.xhtml/p000152
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000119: locks: [''Giữ nguyên hai
    câu hỏi liên tiếp `“Họ đang sống lùi về quá khứ bao xa vậy? Có nhầm lẫn gì chăng?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000120: locks: [''Giữ đúng phạm
    vi nhấn mạnh câu hỏi nội tâm mở đầu `*Hay là một thế lực khác đã ban cho họ một
    học thuyết hay công nghệ mới nào đó?*` theo DEC-P01-002, tên riêng `Tanya` và
    hướng xử lý `giải pháp đơn giản nhất là thôi lo nghĩ và tấn công để quan sát phản
    ứng của họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000121: locks: [''Giữ tên riêng
    `Tanya` trong trần thuật theo M2, cụm `bùng nổ theo bản năng` và tiếng quát `“Weiss!!
    Sao anh lại bỏ chạy?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000122: locks: [''Giữ tên riêng
    `Tanya` cùng đại từ phản thân `mình` theo M2, cụm `đội hình vuông của bộ binh
    địch` và `đại đội của Trung úy Weiss đã vội đổi hướng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000123: locks: [''Giữ danh xưng
    `Quân Dacia`, sự mỉa mai `chẳng làm gì ngoài giữ nguyên vị trí, dũng cảm chờ đến
    lúc bị nổ tung, khốn khổ thật` và giả định quá khứ `Nỗi đau vì nguồn nhân lực
    bị sử dụng tệ hại đến thế hẳn sẽ tan biến chỉ trong chốc lát`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000124: locks: [''Giữ đại từ phản
    thân `mình`, tên riêng `Tanya` và hai câu hỏi dồn dập `“Này! Sao lại quay đầu?!
    Sao lại phá vỡ đội hình tấn công?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000125: locks: [''Giữ tiếng gọi
    `“Thiếu tá!!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000126: locks: [''Giữ tên riêng
    `Tanya`, danh xưng `Thiếu úy Serebryakov` theo M1 và phủ định `chẳng có tác dụng
    gì`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000127: locks: [''Giữ sự đối lập
    `Đại đội của Weiss đã vào vị trí chuẩn bị xung phong, vậy mà rồi họ vội quay lưng
    về phía quân địch như thể đang sợ hãi`, tên riêng `Tanya` và phủ định `chẳng có
    dấu hiệu nào về một cuộc phản công đủ để biện minh cho động thái đó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000128: locks: [''Giữ cấu trúc
    chêm `—cách giải thích tệ hại nhất—`, đại từ nội tâm `Lính của mình` trong câu
    hỏi gián tiếp tự do `Lính của mình lại tản ra rồi rút lui trước hàng phòng thủ
    yếu ớt đến thế sao?` và tên riêng `Tanya` ở câu cuối theo M2.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000129: locks: [''Giữ tên riêng
    `Tanya` theo M2, cách gọi cấp bậc `Thiếu úy` theo M1, lựa chọn chức danh tạm `phó
    chỉ huy` và mệnh lệnh `Nếu hắn chống cự, cứ bắn hắn!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000130: locks: [''Giữ câu đáp lắp
    bắp `“V-Vâng, thưa thiếu tá.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000131: locks: [''Giữ sự phân tách
    đại từ theo M4: `Tôi` ở câu trần thuật hành động đầu tiên (`Tôi ra lệnh cho Serebryakov
    túm gáy Trung úy Weiss rồi lôi anh ta đến đây thật nhanh`), chuyển sang `Mình`
    / `mình` ở toàn bộ chuỗi suy nghĩ nội tâm phía sau (`Mình cứ tưởng…`, `sự nghiệp,
    ám ảnh mình suốt đời`), giữ chữ in hoa nhấn mạnh `—TẠI SAO?!—`, lựa chọn chức
    danh tạm `phó chỉ huy` và tên đơn vị `Tiểu đoàn Pháp sư Không quân 203`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000132: locks: [''Giữ đại từ `tôi`
    / `Tôi` cho chuỗi hành động ngôi thứ nhất, các cụm `phong ấn công thức nổ liên
    hợp vào một viên đạn ma thuật`, `quân đội Dacia chật vật duy trì đội hình`, và
    giữ câu đã tách rõ chủ thể nổ súng `Rồi tôi nổ súng.` theo M3.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000133: locks: [''Giữ phủ định
    `Thậm chí còn chẳng thể tính là một thử thách của Chúa; thật nực cười.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000134: locks: [''Giữ sự phân biệt
    cấp bậc rõ ràng trong cùng một đoạn theo M1: `“Thiếu tá, Trung úy Weiss đây ạ.”`
    và `Thiếu úy Serebryakov báo cáo gọn nhất có thể, như thể muốn tránh xung đột.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000135: locks: [''Giữ tên riêng
    `Tanya` và việc tỉnh lược chủ ngữ ở vế sau theo M2 (`không phải vì Tanya hiểu
    cử chỉ ấy theo hướng tích cực, mà chủ yếu vì chẳng để tâm đến nó`), cùng mệnh
    lệnh trực tiếp `“Cảm ơn. Nhận quyền chỉ huy đại đội của tôi. Tiếp tục tấn công.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000136: locks: [''Giữ câu đáp `“Vâng,
    thưa thiếu tá!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000137: locks: [''Giữ tên riêng
    `Tanya` theo M2, danh xưng `Thiếu úy Serebryakov` theo M1, đại từ `anh ta` / `Anh
    ta` quy chiếu `Weiss`, và phủ định `Anh ta chẳng hiểu vì sao chỉ huy đột nhiên
    gọi mình đến.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000138: locks: [''Giữ cách xưng
    hô `Trung úy` – `anh` – `tôi` và lời đe dọa `nếu anh có lý do gì thì mau nói ra
    trước khi tôi bắn anh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000139: locks: [''Giữ lời hỏi lắp
    bắp của Weiss `“T-Thiếu tá von Degurechaff, chính xác thì tôi cần lý do cho chuyện
    gì ạ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000140: locks: [''Giữ cách gọi
    `Trung úy`, đại từ `anh` – `ta` và thuật ngữ `tòa án quân sự`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000141: locks: [''Giữ đại từ `anh`
    / `mình` cho điểm nhìn của `Weiss`, phủ định `không nhớ mình đã phạm sai lầm nào`,
    cụm literal `sĩ quan phụ tá của chỉ huy tiểu đoàn` và từ trong ngoặc kép `“ngay
    lập tức”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000142: locks: [''Giữ tiếng gọi
    `Thiếu tá!` và lời khẳng định phủ định `Người của tôi và tôi tuyệt đối sẽ không
    bỏ bê nhiệm vụ…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000143: locks: [''Giữ đại từ `anh`
    / `mình` cho Weiss, giữ đúng phạm vi nhấn mạnh câu hỏi nội tâm `*Mình đã làm gì?*`
    theo DEC-P01-002, và câu khẳng định `Lương tâm anh trước Chúa và Tổ quốc hoàn
    toàn trong sạch.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000144: locks: [''Giữ đại từ `anh`
    và hình ảnh so sánh `cấp trên, người trông đáng sợ đến mức chẳng khác nào một
    ma cà rồng đang nổi giận`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000145: locks: [''Giữ cách xưng
    hô `tôi` – `Trung úy` – `anh` và hai câu hỏi chất vấn về hành động `lùi lại rồi
    tản đội hình` và `quay đầu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000146: locks: [''Giữ câu hỏi sửng
    sốt ngắn `“Gì cơ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000147: locks: [''Giữ câu quát
    mệnh lệnh `“Giải thích xem tại sao anh quay đuôi bỏ chạy rồi tản ra trước mặt
    quân địch!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000148: locks: [''Giữ quan hệ đối
    lập `chẳng hề màng đến lời biện bạch của anh; trái lại, cơn giận và sát khí chỉ
    càng tăng lên`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000149
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000149: locks: [''Giữ lời thưa
    `Thưa thiếu tá.`, cách xưng `tôi`, cùng chuỗi giải thích chiến thuật `Bộ binh
    địch đã triển khai đội hình phòng không, nên tôi làm theo đúng sách, đưa đơn vị
    lùi về sát rìa tầm bắn của chúng và ra lệnh bắn chế áp đơn vị địch.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000150: locks: [''Giữ câu hỏi lặp
    từ `“Sách? Sách nào?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000151: locks: [''Giữ đúng phạm
    vi nhấn mạnh tên tài liệu nằm trong dấu ngoặc kép `“*Sổ tay tác chiến ma pháp
    không quân dã chiến, bản thứ hai mươi hai.*”` theo DEC-P01-002 và M5.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000152: locks: [''Giữ đại từ `anh`
    khi trần thuật từ góc nhìn của `Weiss`, danh xưng `Cụm Tập đoàn quân phía Đông`,
    sự chuyển sang đại từ nội tâm `mình` (đi với `anh ta` cho Weiss) ở câu suy nghĩ
    của Tanya theo M4 và DEC-P01-001, cùng thuật ngữ rút gọn `sổ tay` (hai lần) theo
    M5.'']'
  non_canon: true
