  rationale: “Trinh sát chiến đấu” là thuật ngữ quân sự tiếng Việt chuẩn xác và tự
    nhiên nhất để chỉ hoạt động vừa giao chiến thật sự (chấp nhận thương vong cao
    như nêu ở p000053, p000058) vừa thăm dò bố trí phòng ngự/vị trí quân địch (p000056).
- group: unit_designation_203rd
