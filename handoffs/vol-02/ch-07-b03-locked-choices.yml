  status: pending
  canon: false
  rationale: Giữ đúng cấp đơn vị (tiểu đoàn), số hiệu (203) và tính chất hoạt động
    trên không một cách trung tính, khớp với tiền lệ tạm dùng trong chương mà không
    tự thu hẹp thành “không chiến”.
- group: radar_and_visual_combat
  category: military_terminology
  source_term: radar observers / visual combat
  proposed_vi: trắc thủ radar / tác chiến bằng quan sát trực tiếp
  alternatives_vi:
  - quan sát viên radar / tác chiến bằng mắt thường
  - trắc thủ radar / không chiến bằng mắt thường
  segment_ids:
  - YS-LN02/Text/part0032.xhtml/p000061
  - YS-LN02/Text/part0032.xhtml/p000062
  contextual_segment_ids:
  - YS-LN02/Text/part0032.xhtml/p000060
  confidence: medium
  status: pending
  canon: false
  rationale: Ở p000061–p000062, nhân sự radar dẫn hướng hỏa lực đánh chặn nên “trắc
    thủ radar” phản ánh đúng chức năng chuyên môn hơn “quan sát viên radar”; “tác
    chiến bằng quan sát trực tiếp” bao quát cả phòng không mặt đất lẫn pháp sư trên
    không và tránh hàm ý tuyệt đối không dùng khí cụ quang học.
