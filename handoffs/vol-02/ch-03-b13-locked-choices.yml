segment_id_end: YS-LN02/Text/part0018.xhtml/p000161
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000141: locks: [''Giữ đại từ `tôi`
    trong lời mở đầu của tư lệnh hạm đội và cần bổ sung cặp dấu ngoặc kép mở/đóng
    `“...”` theo F04.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000142: locks: [''Giữ tên riêng
    `Tanya`; cần đổi hai chỗ đại từ trần thuật `cô` sang `nó` và cấu trúc lại bổ ngữ
    câu đầu theo `DEC-P01-001` (F01), đồng thời đổi `đội đổ bộ` sang `đội nhảy dù`
    (hoặc `đội đột kích đường không`) theo F02.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000143: locks: [''Giữ đại từ `Chúng
    ta` trong lời tư lệnh hạm đội; cần chuẩn hóa viết hoa `Cụm tập đoàn quân phương
    Bắc` (chữ `tập` viết thường) theo F03.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000144: locks: [''Cần khôi phục
    dấu ba chấm mở đầu và phạm vi in nghiêng `*…Hỗ trợ Cụm tập đoàn quân phương Bắc
    ư?*` theo `DEC-P01-002` (F04), chuẩn hóa `Quân Trung ương`, `Cụm tập đoàn quân
    phương Bắc` và `Đại Quân` theo `canon/glossary.yml` và ledger (F03), giữ `Bộ Tổng
    tham mưu` và đại từ `nó` (F01).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000145: locks: [''Giữ các cụm `một
    chiến dịch quân sự chất đầy toan tính của cấp trên`, `thỏa hiệp chính trị`, và
    `bắt tay nhau thật đẹp`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000146: locks: [''Giữ `Bộ Tổng
    tham mưu`, `kế hoạch tác chiến`, `tình hình chiến tranh`; cần chuẩn hóa `Cụm tập
    đoàn quân phương Bắc` ở cả hai câu theo F03.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000147: locks: [''Giữ danh xưng
    `Thiếu tướng von Rudersdorf` và đại từ `ông ta`; cần đổi hai chỗ đại từ nội tâm
    `tôi` sang `mình` theo `DEC-P01-001` (F01) và đổi `Trung tâm` sang `Trung ương`
    theo F03.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000148: locks: [''Cần chuẩn hóa
    tên hai hạm đội thành `Hạm đội Bắc Hải` (đồng bộ trực tiếp với p000134 của `ch-03-b12`,
    hoặc `Hạm đội Biển Bắc` nếu đồng bộ ngược từ `b19`) và `Hạm đội Biển khơi` (viết
    thường chữ `khơi`) theo F03, cùng cụm `nhiệm vụ hỗ trợ ở phía bắc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000149
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000149: locks: [''Cần đổi cả hai
    chỗ `Cơ chế Hiệp ước` thành `Liên minh Entente` và đồng bộ tên `Hạm đội Bắc Hải`
    theo F03; giữ các định danh `Cộng hòa`, `lục quân`, và cụm `các cuộc cơ động trên
    bộ của lục quân`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000150: locks: [''Giữ các thuật
    ngữ hải quân – đổ bộ `chiến dịch đổ bộ`, `một cuộc tập kích chiến lược`, `mật
    lệnh`, `đánh chặn hạm đội`; cần đổi `hạm đội Cơ chế Hiệp ước` thành `hạm đội Liên
    minh Entente` theo F03.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000151: locks: [''Cần đổi `các
    chiến hạm Cơ chế Hiệp ước` thành `các chiến hạm Liên minh Entente` và chuẩn hóa
    tên `Hạm đội Bắc Hải`, `Hạm đội Biển khơi` theo F03; giữ các cụm `xuất kích`,
    `lực lượng tăng viện khổng lồ`, `tiến hành đổ bộ`, `cục diện chiến tranh sẽ đảo
    ngược theo đúng nghĩa đen`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000152: locks: [''Giữ thuật ngữ
    `cuộc tập kích chiến lược` và đại từ bao gộp `chúng ta`; cần đổi đại từ nội tâm
    `chỉ mình tôi` sang `chỉ riêng mình` theo `DEC-P01-001` (F01).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000153
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000153: locks: [''Giữ các cụm `chẳng
    có hy vọng xuất kích`, `tìm cớ để được đi`, và `tham gia tấn công`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000154
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000154: locks: [''Cần đổi `chiến
    dịch đổ bộ đường không` thành `chiến dịch đột kích đường không` theo F02 để phân
    biệt với đổ bộ đường biển và khớp trực tiếp với `ch-03-b14` (p000162–p000166);
    giữ đại từ `chúng ta` và tên tàu in nghiêng `*Titanic*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000155
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000155: locks: [''Giữ định danh
    canon `Quân đội Đế quốc`, đại từ `chúng ta`, và cụm ẩn dụ `những gói thịt đông
    lạnh`; cần bổ sung tính từ màu sắc `đỏ rực` (`Quân đội Liên Xô đỏ rực` hoặc `Hồng
    quân Liên Xô đỏ rực`) theo F04.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000156
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000156: locks: [''Giữ chức danh
    `Tư lệnh hạm đội`, địa danh mục tiêu `Osfjord` theo mục `vol02-ch03-b14-osfjord`,
    đại từ `chúng ta` / `Chúng ta`, và thuật ngữ `các tuyến liên lạc hậu phương của
    địch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000157
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000157: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng `*Osfjord…*` theo `DEC-P01-002` và câu trần thuật `Khi
    mọi người hiểu ra ý nghĩa của lời vừa nghe, một khoảng lặng thoáng qua bao trùm
    căn phòng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000158
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000158: locks: [''Giữ thuật ngữ
    địa hình `Vịnh hẹp` theo mục `vol02-ch03-b14-fjord`, cùng các thuật ngữ hải chiến
    `tàu chiến`, `vách đá dựng đứng hiểm trở`, `thủy lôi`, `pháo thủ`, `chật vật xoay
    trở giữa làn nước hẹp`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000159
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000159: locks: [''Giữ các đại từ
    `chúng`, `chúng ta`, và các thuật ngữ hải quân `khu trục hạm`, `ngư lôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000160
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000160: locks: [''Giữ cặp địa danh
    và địa hình `Os`, `Osfjord`, `vịnh hẹp` theo các mục `vol02-ch03-b14-osfjord`
    và `vol02-ch03-b14-fjord` trong `work/run-state/pending-terms.yml`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000161
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000161: locks: [''Giữ toàn văn
    câu kết của tư lệnh hạm đội `“Trong tình thế này, chúng ta cần tiến vào trước
    khi hạm đội tiến công và chiếm các khẩu pháo của địch.”` nối mạch trực tiếp sang
    `ch-03-b14` (p000162).'']'
  non_canon: true
