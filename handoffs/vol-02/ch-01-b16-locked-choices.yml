source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: d8059c1538fb18a156424af7d813581d099ad776970eb760e3120c81b3a77a23
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 29
segment_id_start: YS-LN02/Text/part0012.xhtml/p000036
segment_id_end: YS-LN02/Text/part0012.xhtml/p000064
choices:
- segment_id: YS-LN02/Text/part0012.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000036: locks: [''Giữ đại từ `Tôi`,
    danh xưng `nước Cộng hòa`, và phép so sánh `Nhưng quả thật, so với nước Cộng hòa,
    đánh chiếm nơi đó sẽ dễ hơn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000037: locks: [''Giữ lời đáp ngắn
    gọn `“Được.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000038: locks: [''Giữ cụm `cả hai`,
    các thuật ngữ `công cụ bạo lực mang tên chiến tranh giữa các quốc gia`, `mục tiêu
    lớn hơn`, `chiến dịch`, `hậu cần`, `các mặt trận đang hoạt động`, phủ định `mà
    vẫn không quên mục tiêu lớn hơn`, và điều kiện kép `nếu nó không gây quá nhiều
    áp lực lên hậu cần và mở ra cơ hội thu hẹp các mặt trận đang hoạt động`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000039: locks: [''Giữ tên riêng
    `Zettour`, các thuật ngữ `về tác chiến`, `vùng hậu phương phía bắc`, `kế hoạch
    tấn công`, và phủ định `không có trở ngại nào về tác chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000040: locks: [''Giữ cặp đại từ
    `tôi` – `ta`, địa danh `Osfjord`, và cấu trúc điều kiện `“Nếu đã tấn công, tôi
    muốn ta cân nhắc Osfjord.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000041: locks: [''Giữ địa danh
    `Osfjord`, đại từ `tôi` và `họ`, cùng các thuật ngữ `phòng thủ quá chặt`, `vịnh
    hẹp`, `pháo bờ biển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000042: locks: [''Giữ các danh
    xưng `Thành phố Os`, `Liên minh Entente`, đại từ `ta`, `họ`, `quân mình`, các
    thuật ngữ `đầu mối đường sắt chính`, `tàu hỏa`, `đường ray`, `tiếp tế`, và điều
    kiện `Nếu chiếm được nơi đó, toàn bộ tàu hỏa của Liên minh Entente hẳn sẽ phải
    ngừng hoạt động`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000043: locks: [''Giữ tên riêng
    `Zettour`, `Rudersdorf`, đại từ `họ` và `ông`, các thuật ngữ `trung tâm giao thông`,
    `hậu cần của địch`, `các tuyến tiếp tế của địch`, câu điều kiện bỏ lửng `nhưng
    nếu họ cắt đứt được các tuyến tiếp tế của địch…`, và phủ định `ông đã không kìm
    được nụ cười dữ tợn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000044: locks: [''Giữ đại từ `Ông`
    và `ta`, địa danh `Os`, và câu kết bỏ lửng `Vậy ông muốn ta chiếm Os…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000045: locks: [''Giữ danh xưng
    `Liên minh Entente`, `Bộ chỉ huy phương Bắc`, đại từ `họ`, các thuật ngữ `lực
    lượng tiền tuyến`, `cuộc tấn công chính diện ngắn`, cấu trúc ẩn dụ `Một đội quân
    không đầu không tay chỉ là đám đông từng được gọi là quân đội`, và hai điều kiện
    giả định `Nếu Liên minh Entente bị tê liệt như thế...`, `Nếu mọi việc diễn ra
    như Bộ chỉ huy phương Bắc mong muốn...`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000046
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000046: locks: [''Giữ cặp đại từ
    `tôi` – `ông`, địa danh `Norden`, thuật ngữ `đơn vị`, và hai cấu trúc điều kiện
    `Cứ nói làm được, tôi sẽ giao cho ông một đơn vị`, `Nếu không thành, tôi sẽ xử
    lý Norden theo cách bớt lén lút hơn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000047
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000047: locks: [''Giữ tên riêng
    `Rudersdorf`, `Zettour`, đại từ `Ông` / `ông` và `họ`, các thuật ngữ `cấp tác
    chiến`, `trận đánh quy mô lớn`, `sĩ quan Bộ Tổng tham mưu`, cùng chi tiết so sánh
    giả định `như muốn nói rằng ngay cả tách cà phê dở tệ này ông cũng sẵn lòng uống
    cạn với nụ cười`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000048
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000048: locks: [''Giữ đại từ `tôi`
    và câu thoại `“Tốt lắm. Cần gì thì cứ nói với tôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000049: locks: [''Giữ đại từ `tôi`
    và thuật ngữ `một đơn vị pháp sư`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000050: locks: [''Giữ tên riêng
    `Rudersdorf`, đại từ phản thân `mình`, và câu `Rudersdorf thẳng thừng đòi thứ
    mình muốn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000051: locks: [''Giữ thuật ngữ
    `Một đơn vị pháp sư` và câu hỏi `nhưng đơn vị nào?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000052: locks: [''Giữ cặp đại từ
    `ông` – `tôi`, các danh xưng `đơn vị 203`, `Dacia`, và ẩn dụ `Con thú cưng ông
    giấu trong túi ấy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000053: locks: [''Giữ thuật ngữ
    `Tiểu đoàn`, đại từ `Ông`, và câu hỏi xác nhận mức độ sẵn lòng đã sửa theo signoff
    `“Tiểu đoàn đó khó trị lắm. Ông chịu được chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000054: locks: [''Giữ các danh
    xưng `Zettour`, `Dacia`, `Xưởng Vũ khí Kỹ thuật` (đã đồng bộ theo M1 signoff),
    `Trung tá von Lergen`, `Đế quốc`, đại từ `họ` và `ông`, các thuật ngữ `đơn vị
    chiến đấu gan lì`, `chiến tranh cơ động hoàn hảo`, `nhà máy vũ khí`, `đơn vị tăng
    cường`, `khí tài tối tân`, `tiến độ huấn luyện`, và hai phủ định `vẻ kinh ngạc
    không giấu nổi`, `trong Đế quốc chẳng có đơn vị nào sánh bằng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000055: locks: [''Giữ đại từ `tôi`
    và `ta`, địa danh `Norden`, các cụm `chỉ huy đơn vị ấy`, `kinh nghiệm chiến đấu
    ở Norden`, `quen địa hình ở đó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000056: locks: [''Giữ cụm `chỉ
    huy đơn vị 203`, đại từ `cô` (cho chỉ huy đơn vị 203 qua điểm nhìn Rudersdorf)
    và `ông` (cho Rudersdorf), cặp phân loại `“hữu dụng” hay “không”`, và ẩn dụ `như
    một quân cờ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000057: locks: [''Giữ đại từ `Tôi`
    và lời đáp `“Được. Tôi sẽ thu xếp ngay.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000058: locks: [''Giữ đại từ `chúng
    ta` và lời chúc `“Cảm ơn. Mong là chúng ta sẽ thắng.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000059: locks: [''Giữ câu bị động
    ngắn `Một chiếc ly được nâng lên.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000060: locks: [''Giữ lời chúc
    đáp lại `“Vậy thì mong là đồ ăn ở đây sẽ khá hơn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000061: locks: [''Giữ cụm `Lời
    chúc thứ hai` và `cả hai cùng nhăn mặt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000062: locks: [''Giữ đại từ `Tôi`
    và câu đùa chua chát `“Tôi nghĩ chiến tranh sẽ kết thúc trước mất.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000063: locks: [''Giữ đại từ `ông`
    và câu tán đồng `“Có lẽ ông nói đúng.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0012.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0012.xhtml/p000064: locks: [''Giữ đại từ `họ`,
    `cả hai`, `mình`, cụm `nguyên tắc cơ bản của người lính: hễ có dịp là phải ăn`,
    và phủ định `cả hai đều chẳng giấu chuyện mình muốn dùng bữa ở nơi khác hơn`.'']'
  non_canon: true
