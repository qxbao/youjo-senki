task_id: vol-02-ch-03-b09
baseline_sha256: e149b1bbdefad6af4a19989b6165b6cbb049787b50358075b3ffbbc355bbbc5c
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 02f9f5caa010e788314b745355e0cb0592fe515cbf7ec5e7e0c4edc2700e0b63
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 32
segment_id_start: YS-LN02/Text/part0018.xhtml/p000032
segment_id_end: YS-LN02/Text/part0018.xhtml/p000063
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000032: locks: [''Giữ các tên riêng
    `Rudersdorf`, `Degurechaff`, `Tanya`, cấu trúc phủ định ở câu thứ hai `Nhưng Tanya
    hoàn toàn không nhận ra điều đó.`, và toàn văn đoạn mở đầu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000033: locks: [''Giữ tên riêng
    `Rudersdorf`, các thuật ngữ `cuộc đổ bộ đường biển`, `kế hoạch bí mật`, `sĩ quan
    tham mưu cấp trung thấp`, danh xưng đã khóa trong handoff `Tướng von Zettour`,
    các đại từ `ông`, `cô`, và câu hỏi cuối đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000034: locks: [''Giữ đại từ `Tôi`,
    kính ngữ `ngài`, và câu trả lời `“Hửm? Tôi không hiểu ý ngài lắm.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000035: locks: [''Giữ các tên riêng
    `Degurechaff`, `Rudersdorf`, `Zettour`, các đại từ `ông`, `mình`, và câu phủ định
    cuối đoạn `Sĩ quan trước mặt ông không nghe chuyện đó từ Zettour.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000036: locks: [''Giữ câu hỏi nội
    tâm ngắn `Vậy thì, lẽ nào…?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000037: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở hai cụm `*Không*` và `*Tự cô ấy nghĩ ra kế hoạch đổ
    bộ quy mô lớn vào hậu phương sao?*` theo `DEC-P01-002` và bản sửa followup M2,
    cùng các đại từ `ông`, `cô ấy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000038: locks: [''Giữ đại từ `Cô`
    và câu hỏi trực tiếp `“Cô tự nghĩ ra chuyện đó à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000039: locks: [''Giữ kính ngữ
    `thưa ngài`, các đại từ `chúng ta`, `tôi`, và toàn văn câu đáp của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000040: locks: [''Giữ các đại từ
    `Tôi`, `mình` và câu thoại `“…Tôi nghĩ mình nên nói rằng đó là một ý tưởng rất
    thú vị.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000041: locks: [''Giữ tên riêng
    `Rudersdorf`, các đại từ `Cô` / `cô`, `ông`, và các thuật ngữ `học viện`, `lập
    luận chiến lược thuyết phục về vấn đề vận tải`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000042: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở hai cụm `*Ra là vậy*` và `*Cô ấy nhìn thấu đến mức đó
    sao?*` theo `DEC-P01-002` và bản sửa followup M2, các đại từ `ông` / `Ông`, `Cô
    ấy` / `cô`, và cụm `một sĩ quan cực kỳ triển vọng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000043: locks: [''Giữ các đại từ
    `chúng ta`, `cô`, danh xưng `Thiếu tá`, và các thuật ngữ `đơn vị`, `lệnh điều
    động`, `Tiểu đoàn`, `căn cứ hải quân`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000044: locks: [''Giữ câu nhận
    lệnh ngắn gọn `“Rõ, thưa ngài.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000045: locks: [''Giữ tên riêng
    `Degurechaff`, các đại từ `Ông`, `cô` ở câu đầu, và đúng phạm vi nhấn mạnh in
    nghiêng ở câu độc thoại nội tâm thứ hai `*Vậy mà mình đã giao lệnh cho đứa trẻ
    này dễ dàng như thể bảo nó đi làm đúng việc đó…*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000046
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000046: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002` và câu độc thoại nội tâm
    `*…À, chiến tranh đúng là chẳng ai biết điều gì sẽ xảy ra.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000047
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000047: locks: [''Giữ các đại từ
    `Các cô`, `tôi`, `cô`, danh xưng `Thiếu tá`, và các thuật ngữ `nhảy dù`, `lực
    lượng đổ bộ`, `mũi tiên phong cho quân đội`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000048
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000048: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002` và các cụm `mũi tiên phong`,
    `mũi nhọn này`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000049: locks: [''Giữ đại từ `tôi`,
    kính ngữ `thưa ngài`, và câu hỏi xin phép `“Nhưng tôi xin phép hỏi một điều, thưa
    ngài?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000050: locks: [''Giữ danh xưng
    `Thiếu tá` và câu hỏi `“Chuyện gì vậy, Thiếu tá?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000051: locks: [''Giữ kính ngữ
    `ngài`, đại từ `tôi`, định danh đơn vị đã khóa trong ledger `Cụm tập đoàn quân
    phương Bắc`, thuật ngữ `cuộc tiến công`, và câu hỏi đuôi lễ phép `đúng không ạ?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000052: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu đầu `*Ừm, cô ấy nói đúng.*` theo `DEC-P01-002`,
    đại từ `ông` / `Ông`, định danh đơn vị `Cụm tập đoàn quân phương Bắc`, và các
    cấp bậc/tên riêng đã khóa trong ledger `Trung tướng von Schreise`, `Thượng tướng
    von Wragell`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000053: locks: [''Giữ tên riêng
    `Zettour`, đại từ `ông`, và các thuật ngữ đã khóa trong ledger `phía Tác chiến`,
    `mặt trận`, `Cục Hậu cần`, `tiếp tế cho binh sĩ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000054: locks: [''Giữ danh xưng
    đã khóa trong handoff `Tướng von Zettour` và câu thoại `“Thật ra, đó là điều kiện
    của Tướng von Zettour.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000055: locks: [''Giữ câu hỏi ngắn
    `“Sao cơ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000056: locks: [''Giữ các đại từ
    `Ông` / `ông`, `mình`, `cô`, và định danh `đồng nghiệp trong Bộ Tổng tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000057: locks: [''Giữ các định
    danh đã khóa trong handoff và ledger `Tướng von Zettour`, `Liên minh Entente`,
    `phòng thủ trong nước`, `Cụm tập đoàn quân phương Bắc`, `Rhine`, các đại từ `tôi`,
    `cô`, và cấu trúc điều kiện giả định quá khứ `nếu Cụm tập đoàn quân phương Bắc
    đồng ý, tôi đã điều cô đến Rhine và chuẩn bị cầm cự qua mùa đông.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000058: locks: [''Giữ đại từ `tôi`
    và lời cáo lui `“Đã rõ. Nếu không còn gì nữa, tôi xin phép.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000059: locks: [''Giữ câu gọi ngắn
    `“Thiếu tá?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000060: locks: [''Giữ các định
    danh và thuật ngữ đã khóa trong ledger `Thiếu tá von Degurechaff`, `doanh trại`,
    `binh sĩ`, `sĩ quan trực ban tuần`, `phó chỉ huy`, `Trung úy Weiss`, `lính phục
    vụ`, `một chiếc áo khoác dự phòng và cà phê`, cùng các đại từ `cô`, `họ`, `Anh`
    / `Anh ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000061: locks: [''Giữ tên riêng
    `Tanya`, đại từ `anh ta`, `họ`, đại từ nội tâm tự quy chiếu `mình` / `Mình` theo
    `DEC-P01-001` và bản sửa followup M4, đúng phạm vi nhấn mạnh in nghiêng ở câu
    lời nói tưởng tượng `*Đừng phả khói vào mặt tôi.*` theo `DEC-P01-002`, cùng các
    cụm `buổi họp tham mưu`, `khu vực hút thuốc và khu vực không hút thuốc riêng`,
    `tuyến lệ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000062: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `mình` theo `DEC-P01-001` và bản sửa followup M4, các cụm `hạn
    chế quyền cá nhân là áp bức`, `mấy sĩ quan cấp cao`, và câu hỏi châm biếm cuối
    đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000063: locks: [''Giữ tên riêng
    `Tanya`, các đại từ `Họ` / `họ`, đại từ nội tâm tự quy chiếu `mình` theo `DEC-P01-001`
    và bản sửa followup M4, cùng các cụm `xì gà họ châm lên lại là hàng xa xỉ`, `bày
    tỏ nỗi lo không hề có cho binh sĩ`, `mình vẫn giữ vẻ ngoài tốt hơn họ`.'']'
  non_canon: true
