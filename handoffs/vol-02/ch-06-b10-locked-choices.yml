- segment_id: YS-LN02/Text/part0030.xhtml/p000329
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000329: terms: [''thường dân'']:
    pronouns_and_address: Tanya dùng `họ` cho thường dân và `chúng ta` cho phía Đế
    quốc.: pov_and_voice: Giọng giải thích rành mạch, lạnh lùng theo đúng logic lách
    luật.: modality_and_logic: Bảo toàn sự đối lập giữa hai mệnh đề điều kiện: giả
    định trái thực tế nếu có thường dân ở đó thì sẽ hạn chế chúng ta, nhưng nếu thành
    phố đã bị chiếm thì chẳng còn gì phải lo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000330
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000330: terms: []: pronouns_and_address:
    Trần thuật quy chiếu vị tư lệnh bằng `Ông`, và dùng `cô ta` trong mệnh đề phụ
    thuộc chỉ câu hỏi ông muốn đặt cho Tanya.: pov_and_voice: Giọng kết cảnh nửa rùng
    mình nửa cố nhắm mắt làm ngơ của vị tư lệnh quân đoàn.: modality_and_logic: Bảo
    toàn đủ 3 câu: câu hỏi nội tâm bật lại đúng đối tượng của sự không lo lắng (`*Không
    phải lo chuyện gì cơ?*`) -> ý muốn hỏi cô ta định làm gì nhưng đã kìm lại -> lời
    tự nhủ rằng chắc chắn tốt hơn hết là không nên biết.: emphasis: Bảo toàn chính
    xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu hỏi đầu
    đoạn `*Không phải lo chuyện gì cơ?*` tương ứng thẻ `<html:em>`, giữ 2 câu trần
    thuật tiếp theo ở chữ thường.'
  non_canon: true
