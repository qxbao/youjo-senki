choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000359
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000359: terms: [''luật pháp'',
    ''nhân đạo'', ''thành tích'']: pronouns_and_address: Tuân thủ `DEC-P01-001`: tiếp
    nối độc thoại nội tâm cuối `b11`, Tanya tự quy chiếu nhất quán bằng `mình` / `Mình`.:
    pov_and_voice: Giọng độc thoại nội tâm bức bối, thực dụng của Tanya khi cân nhắc
    giữa rủi ro hậu chiến và áp lực thành tích trước mắt.: modality_and_logic: Bảo
    toàn đủ 4 câu: kết luận chỉ tuân thủ luật pháp hết sức vẫn chưa đủ -> câu hỏi
    cảm thán bất bình -> câu hỏi suy đoán việc tính mạng gặp nguy hiểm nếu không hành
    xử nhân đạo -> thế kẹt muốn nương tay với dân chúng nhưng làm vậy không có lý
    do dẫn tới thành tích thấp thì sẽ rắc rối kèm dấu chấm lửng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000360
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000360: terms: [''lính mới'', ''pháp
    sư địch'', ''thương vong'']: pronouns_and_address: Tuân thủ `DEC-P01-001`: nội
    tâm Tanya tự quy chiếu bằng `Mình` / `mình`, gọi đám lính mới là `họ` và dùng
    `ta` cho toàn đơn vị.: pov_and_voice: Giọng lóe lên kế hoạch hợp thức hóa việc
    rút lui sớm nhờ đám lính mới.: modality_and_logic: Bảo toàn đủ 5 câu: tự ngắt
    lời (`Không, khoan đã`) -> khẳng định có lý do -> câu hỏi đuôi nhắc tới đám lính
    mới phiền phức đi cùng -> phỏng đoán có họ làm chậm chân thì lúc diệt xong pháp
    sư địch các đơn vị khác sẽ tới -> kế hoạch báo có thương vong để rút lui.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000361
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000361: terms: [''lính mới'']:
    pronouns_and_address: Tuân thủ `DEC-P01-001`: nội tâm Tanya tự quy chiếu nhất
    quán bằng `mình`.: pov_and_voice: Giọng tính toán giữ danh tiếng cá nhân và chút
    tiếc rẻ thực dụng đối với đám lính mới.: modality_and_logic: Bảo toàn đủ 3 câu:
    hệ quả không cần tự tay nhúng chàm -> điều kiện nếu trận chiến kéo dài thì có
    lẽ có thể nương tay mà không ai đánh giá thấp năng lực -> giả định tiếc nuối nếu
    biết chuyện này xảy ra thì có lẽ đã nên thông cảm với đám lính mới hơn.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000362
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000362: terms: [''người chỉ huy'',
    ''lính mới'', ''dân thường'', ''thủ lĩnh'', ''tòa án quân sự'', ''phiên tòa giả
    hiệu'', ''Đế quốc'']: pronouns_and_address: Tuân thủ `DEC-P01-001`: nội tâm Tanya
    tự quy chiếu bằng `mình`.: pov_and_voice: Giọng khựng lại khi sực nhớ tới nguyên
    tắc trách nhiệm chỉ huy và phân hóa rủi ro theo kết cục thắng/thua của Đế quốc.:
    modality_and_logic: Bảo toàn đủ 5 câu: tiếng nghi vấn (`Ừm?`) -> thực tế người
    chỉ huy phải chịu trách nhiệm -> câu hỏi giả định nếu một lính mới lỡ bắn trúng
    dân thường -> hệ quả tất yếu người đứng đầu như mình phải ra tòa án quân sự hoặc
    phiên tòa giả hiệu -> suy đoán nếu Đế quốc thắng thì phiên tòa quân sự cũng không
    tệ lắm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000363
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000363: terms: [''tuyên trắng án'',
    ''lính mới'']: pronouns_and_address: Tuân thủ `DEC-P01-001`: nội tâm Tanya tự
    quy chiếu bằng `mình` / `Mình` và dùng `người ta` cho chủ thể quy trách nhiệm.:
    pov_and_voice: Giọng tự trấn an rồi lập tức sụp đổ kế hoạch khi tính đến kịch
    bản bại trận.: modality_and_logic: Bảo toàn đủ 6 câu: điều kiện nếu may mắn có
    thể trông mong được tuyên trắng án -> tự khẳng định chắc chắn -> bản chất vấn
    đề là mức trách nhiệm có thể buộc mình gánh cho đám lính mới -> đối lập nếu thua
    thì có lẽ thành nạn nhân của cuộc trả thù -> nhận xét cảm thán (`Thế thì tệ thật`)
    -> kết luận ý tưởng tưởng hay nhưng giờ xem ra không ổn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000364
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000364: terms: [''nhân chứng'',
    ''vụ thảm sát'', ''lời khai của người sống sót'']: pronouns_and_address: Tuân
    thủ `DEC-P01-001`: câu trần thuật thứ nhất và thứ ba quy chiếu Tanya bằng `nó`;
    câu hỏi nội tâm xen giữa lược chủ ngữ (`Hay là cứ thủ tiêu hết nhân chứng?`).:
    pov_and_voice: Giọng trần thuật đan xen câu hỏi nội tâm tàn nhẫn thoáng qua trước
    khi lý trí thực dụng của Tanya lập tức dập tắt.: modality_and_logic: Bảo toàn
    đủ 3 câu: thoáng nghĩ cách giữ kín chuyện -> câu hỏi tự vấn thủ tiêu toàn bộ nhân
    chứng -> lập tức kìm lại ý nghĩ bất cẩn vì ngay cả các vụ thảm sát vẫn có lời
    khai của người sống sót.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000365
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000365: terms: [''nhân chứng'']:
    pronouns_and_address: Tuân thủ `direct-address choice`: lược đại từ ngôi thứ hai
    phiếm chỉ trong câu nhận định lịch sử (`Nhìn vào lịch sử sẽ thấy...`).: pov_and_voice:
    Giọng suy luận lạnh lùng về xác suất và thực tế ngụy tạo nhân chứng trong lịch
    sử chính trị.: modality_and_logic: Bảo toàn đủ 3 câu: mệnh đề logic `Gần như bằng
    không vẫn không phải là bằng không` -> bài học lịch sử rằng có thể tạo ra bao
    nhiêu nhân chứng tùy ý -> câu hỏi tu từ về việc có mấy quốc gia ngần ngại dựng
    lên nhân chứng vốn không tồn tại.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000366
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000366: terms: [''Tanya'', ''xuất
    kích'', ''những kẻ cuồng chiến trận'']: pronouns_and_address: Tuân thủ `DEC-P01-001`:
    lời lẩm bẩm tự nhủ của Tanya dùng `Mình`, phần trần thuật dùng `Tanya` / `nó`,
    và quy chiếu các thành viên trong đơn vị bằng `họ`.: pov_and_voice: Giọng trần
    thuật khắc họa sự bất lực của Tanya đối lập với sự hăng hái thái quá của đám thuộc
    cấp.: modality_and_logic: Bảo toàn đủ 3 câu: lời lẩm bẩm không mấy hào hứng kèm
    dấu chấm lửng mở đầu và lý do đó là tất cả những gì nó làm được lúc này -> thời
    gian đến lúc xuất kích không còn nhiều -> đơn vị tài năng của nó toàn những kẻ
    cuồng chiến trận nên vừa nghe tin xuất kích đã tập hợp ngay.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000367
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000367: terms: [''trạng thái sẵn
    sàng xuất kích'']: pronouns_and_address: Tuân thủ `DEC-P01-001`: nội tâm Tanya
    tự quy chiếu bằng `mình` và gọi thuộc cấp là `họ`.: pov_and_voice: Giọng tự trách
    đầy ngán ngẩm vì trót rèn kỷ luật sẵn sàng chiến đấu quá tốt cho cấp dưới.: modality_and_logic:
    Bảo toàn đủ 2 câu: suy đoán có lẽ giờ đã chuyển sang trạng thái sẵn sàng xuất
    kích được rồi -> giả định trái thực tế quá khứ rằng nếu biết thành ra thế này
    thì đã chẳng bảo họ chuẩn bị trước.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000368
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000368: terms: [''Tanya'', ''thuộc
    cấp'']: pronouns_and_address: Tuân thủ `DEC-P01-001`: trần thuật dùng tên riêng
    `Tanya` ở câu đầu và đại từ `Nó` kèm phản thân `mình` ở câu thứ hai.: pov_and_voice:
    Giọng trần thuật giàu hình ảnh về biểu cảm bất mãn của Tanya trước sự nhanh nhẹn
    đáng ghét của thuộc cấp.: modality_and_logic: Bảo toàn đủ 2 câu: hình ảnh đôi
    mắt đờ đẫn như cá chết, gương mặt thanh tú méo mó và tâm trạng ngổn ngang khi
    nhìn thuộc cấp chuẩn bị nhanh nhẹn đến phát bực -> câu hỏi gián tiếp tự hỏi mình
    nên làm gì.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000369
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000369: terms: [''kẻ đế quốc chủ
    nghĩa cực đoan'', ''tấm huân chương chỉ mang tính hình thức'', ''nước Đức'', ''Đức
    Quốc xã'', ''SS'', ''phi công át chủ bài'', ''cộng sản'', ''Hartmann'']: pronouns_and_address:
    Tuân thủ `DEC-P01-001`: độc thoại nội tâm của Tanya tự quy chiếu bằng `mình` /
    `Mình`, dùng `Người ta` / `họ` cho dư luận và các phi công át chủ bài.: pov_and_voice:
    Giọng độc thoại nội tâm căng thẳng của Tanya khi đối chiếu tình cảnh bản thân
    với số phận các quân nhân Đức sau Thế chiến II.: modality_and_logic: Bảo toàn
    đủ 10 câu: phỏng đoán người ta có thể nghĩ mình là kẻ đế quốc chủ nghĩa cực đoan
    vì phần thưởng mang tính hình thức ấy -> tự đính chính mức độ chắc chắn (`Không,
    chắc chắn họ sẽ nghĩ vậy`) -> hệ quả cuộc đời chờ đợi sẽ chẳng dễ chịu -> dẫn
    chứng nước Đức -> kết cục của những kẻ cuồng nhiệt theo Đức Quốc xã -> thái độ
    đối với SS -> ngoại lệ các phi công át chủ bài -> thực tế nhiều người vẫn bị cộng
    sản bắt giam một thời gian sau chiến tranh -> câu hỏi tìm kẽ hở -> quyết tâm không
    thể bị bắt giam như Hartmann.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000370
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000370: terms: [''Rudel'', ''bê
    tông cốt thép'', ''chống cộng'', ''ủng hộ Đức Quốc xã'']: pronouns_and_address:
    Tuân thủ `DEC-P01-001`: nội tâm Tanya tự quy chiếu bằng `Mình` và quy chiếu `Rudel`
    bằng `ông ta`.: pov_and_voice: Giọng phấn chấn đột ngột đầy châm biếm khi Tanya
    tìm ra hình mẫu sinh tồn hậu chiến.: modality_and_logic: Bảo toàn dấu chấm lửng
    mở đầu `…`, đủ 7 câu từ lúc sực nhớ ra một quân nhân tên Rudel có lập trường chống
    cộng và ủng hộ Đức Quốc xã cứng như bê tông cốt thép nhưng vẫn sống tốt sau chiến
    tranh, đến quyết định chọn ông ta làm hình mẫu noi theo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000371: terms: [''Thiếu úy Grantz'']:
    pronouns_and_address: Sau ngắt cảnh `space-break1`, mở điểm nhìn trần thuật của
    `Thiếu úy Grantz`.: pov_and_voice: Giọng trần thuật chuyển cảnh gọn, đối lập suy
    tính hỗn loạn trong đầu Tanya với ấn tượng quen thuộc bên ngoài mà Grantz nghe
    thấy.: modality_and_logic: Bảo toàn nhận định của Thiếu úy Grantz rằng lời nói
    ấy nghe vẫn như mọi khi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000372
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000372: terms: [''tiểu đoàn'']:
    pronouns_and_address: Lời thoại chỉ huy của Tanya gọi đơn vị là `cả tiểu đoàn`
    và dùng đại từ gộp `chúng ta`.: pov_and_voice: Giọng hô hào quen thuộc của Tanya
    dùng ẩn dụ đi dã ngoại để mở đầu lệnh xuất kích.: modality_and_logic: Bảo toàn
    câu thoại cảm thán (`“Được rồi, cả tiểu đoàn, chúng ta đi dã ngoại nào!”`).: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000373
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000373: terms: [''mức sẵn sàng
    hai'', ''chỉ huy'']: pronouns_and_address: Trần thuật quy chiếu Grantz bằng `anh`,
    đơn vị bằng `cả đơn vị`, và Tanya bằng chức danh `chỉ huy` cùng đại từ `nó` (`DEC-P01-001`).:
    pov_and_voice: Giọng trần thuật bám điểm nhìn của Grantz khi vội vã chạy tới điểm
    tập kết và chạm mặt vẻ giận dữ ra mặt của chỉ huy.: modality_and_logic: Bảo toàn
    đủ 3 câu: tập hợp từ mức sẵn sàng hai và anh chạy đến để khỏi muộn -> bắt gặp
    vẻ mặt cau có khó chịu của chỉ huy -> cấu trúc tăng tiến (`không chỉ bực bội mà
    còn giận dữ`, kèm tình thái `Có vẻ`) mà không có chỗ trút giận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000374
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000374: terms: []: pronouns_and_address:
    Câu độc thoại nội tâm ngắn của Grantz dùng cấu trúc nhận định tình huống không
    đại từ.: pov_and_voice: Giọng linh cảm bất an của Grantz trước nét mặt của chỉ
    huy.: modality_and_logic: Bảo toàn phán đoán phủ định lành ít dữ nhiều (`*Có điềm
    chẳng lành rồi.*`).: emphasis: Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`:
    bọc dấu `*...*` quanh toàn bộ câu tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000375
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000375: terms: [''đơn vị pháp sư
    địch'', ''phòng tuyến địch'', ''truy kích song song'']: pronouns_and_address:
    Quy chiếu tiểu đoàn của Grantz bằng `họ`.: pov_and_voice: Giọng trần thuật hồi
    tưởng nhiệm vụ khắc nghiệt vừa trải qua mấy hôm trước.: modality_and_logic: Bảo
    toàn mốc thời gian (`Hôm trước`), thế bị động (`bị buộc phải bám theo một đơn
    vị pháp sư địch`), cự ly (`sâu năm mươi kilômét sau phòng tuyến địch`) và thuật
    ngữ chiến thuật (`truy kích song song`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000376
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000376: terms: [''chiến hào địch'']:
    pronouns_and_address: Quy chiếu Grantz bằng `anh`.: pov_and_voice: Giọng tự chuẩn
    bị tinh thần của Grantz cho một nhiệm vụ tiền tuyến thông thường.: modality_and_logic:
    Bảo toàn mức độ tối thiểu (`Ít nhất anh phải sẵn sàng...`) và hành động tiến ra
    chiến hào địch vào ban đêm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000377
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000377: terms: [''pháp sư địch'',
    ''Arene'']: pronouns_and_address: Lời thoại của Tanya gọi lực lượng phòng không/trên
    không bạn là `Đám ngốc trên không` và gọi pháp sư địch là `chúng`.: pov_and_voice:
    Giọng thông báo gay gắt, tức giận của Tanya trước toàn tiểu đoàn.: modality_and_logic:
    Bảo toàn cả hai vế thông tin: đám ngốc trên không để pháp sư địch lọt qua -> chúng
    đã tràn vào Arene.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000378
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000378: terms: [''sĩ quan cấp trên'']:
    pronouns_and_address: Quy chiếu Grantz bằng `anh` / `Anh`, quy chiếu Tanya bằng
    `nó` ở câu đầu (`DEC-P01-001`) và `một sĩ quan cấp trên` ở câu thứ hai.: pov_and_voice:
    Giọng trần thuật diễn tả cú sốc tinh thần của Grantz khi tin đồn trở thành sự
    thật được cấp trên xác nhận.: modality_and_logic: Bảo toàn đủ 2 câu: giả định
    nhượng bộ rằng ngay cả nếu đã lường trước thì lời nói ấy vẫn giáng mạnh vào anh
    -> sự tương phản giữa lời đồn rỉ tai từng nghe với tác động gây nản lòng khi được
    sĩ quan cấp trên xác nhận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000379
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000379: terms: [''điểm trung chuyển
    tiếp tế lớn'']: pronouns_and_address: Không dùng đại từ nhân xưng.: pov_and_voice:
    Giọng trần thuật tóm lược thực tế chiến lược nghiệt ngã.: modality_and_logic:
    Bảo toàn sắc thái đánh giá (`Sự thật đau lòng là...`) và sự kiện một điểm trung
    chuyển tiếp tế lớn đã thất thủ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000380
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000380: terms: [''hậu cần'', ''binh
    nhì'', ''tiếp tế'', ''chiến lược'']: pronouns_and_address: Dùng đại từ bất định
    `Ai` và `họ` cho binh lính ngoài mặt trận.: pov_and_voice: Giọng trần thuật phân
    tích tầm quan trọng sống còn của đường sắt vận chuyển lương thực đối với toàn
    quân.: modality_and_logic: Bảo toàn đủ 2 câu: bất kỳ ai biết tàu chở lương thực
    sẽ ngừng hoạt động sau ngày mai đều hiểu tác động khổng lồ đến hậu cần -> phép
    nhấn mạnh ngay cả một binh nhì cũng hiểu chiến tranh không có tiếp tế là cơn ác
    mộng về chiến lược.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000381
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000381: terms: [''Thiếu tá von
    Degurechaff'', ''Grantz'', ''pháp sư địch'', ''đổ bộ đường không'', ''hậu phương'',
    ''máy bay vận tải'', ''không phận'']: pronouns_and_address: Trần thuật dùng danh
    xưng `Thiếu tá von Degurechaff` và tên riêng `Grantz`; câu hỏi nội tâm cuối đoạn
    của Grantz dùng đại từ gộp `chúng ta`.: pov_and_voice: Giọng trần thuật khép lại
    batch bằng sự căng thẳng bao trùm và câu hỏi bàng hoàng trong nội tâm Grantz.:
    modality_and_logic: Bảo toàn đủ 3 câu: mức độ căng thẳng khiến ngay cả Thiếu tá
    von Degurechaff vốn luôn thờ ơ cũng không giấu nổi vẻ bất mãn -> lý do chính Grantz
    cũng bàng hoàng khi nghe tin đồn pháp sư địch đổ bộ đường không xuống hậu phương
    -> câu hỏi nội tâm kinh ngạc về việc để lọt máy bay vận tải lướt vào không phận.:
    emphasis: Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ 2 câu đầu
    ở chữ thường, chỉ bọc dấu `*...*` quanh câu hỏi nội tâm cuối đoạn tương ứng thẻ
    `<html:em>`.'
  non_canon: true
