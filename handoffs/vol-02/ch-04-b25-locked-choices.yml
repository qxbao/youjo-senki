  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000435: pronouns_and_address: [''Quy
    chiếu đối phương đột nhập bằng `chúng`.'']: pov_and_voice: Lời hô hào bỗ bã của
    lính thủy đánh bộ khi phản kích.: modality_and_logic: Giữ hai câu mệnh lệnh liên
    tiếp (`Ném chúng xuống biển! Tống khứ chúng đi.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000436
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000436: terms: [''Tiểu đoàn 203
    (203rd Battalion)'']: pronouns_and_address: []: pov_and_voice: Trần thuật đối
    lập hiệu quả tiến công thực tế của Tiểu đoàn 203 với đợt phản kích.: modality_and_logic:
    Giữ liên từ đối lập `Nhưng` ở đầu câu và mức độ hiệu quả (`lần lượt chiếm hết
    vị trí này đến vị trí khác với hiệu quả đáng kinh ngạc`).: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000437
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000437: terms: [''pháp sư (mages)'',
    ''chiến đấu cơ động (mobile battles)'', ''các động tác cơ động trên không (aerial
    maneuvers)'', ''đánh giáp lá cà (close-quarters fighting)'', ''bộ phận tiên phong
    (vanguard)'', ''các thành viên ở phía sau (members in the rear)'', ''huấn luyện
    (training)'']: pronouns_and_address: []: pov_and_voice: Nhận định tổng quát về
    đặc thù tác chiến và mục đích huấn luyện của pháp sư.: modality_and_logic: Khóa
    sửa chữa B25-F08: giữ đúng bình diện `chiến đấu cơ động và các động tác cơ động
    trên không`, phân biệt `Những người thuộc bộ phận tiên phong` với `các thành viên
    ở phía sau` trong đội hình mà không biến thành tiền tuyến – hậu phương, và giữ
    kết luận về mục đích của huấn luyện (`Nhưng huấn luyện là để khắc phục điểm yếu`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000438
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000438: terms: [''lính thủy đánh
    bộ (marines)'', ''đám lính đất liền (landlubbers)'']: pronouns_and_address: [''Dùng
    `lính thủy đánh bộ chúng ta` cho phe mình và `chúng` / `đám lính đất liền ấy`
    cho đối phương.'']: pov_and_voice: Lời khích lệ tinh thần tự tôn quân chủng của
    phía lính thủy đánh bộ.: modality_and_logic: Giữ hai câu mệnh lệnh khích lệ và
    miệt thị đối phương là lính đất liền.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000439
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000439: pronouns_and_address: [''Người
    nói tự xưng `Tôi` và quy chiếu nhóm tiếp theo vừa đến bằng `họ`.'']: pov_and_voice:
    Báo cáo và điều động lực lượng tiếp ứng trong trận đánh.: modality_and_logic:
    Giữ thông báo nhóm tiếp theo đã tới và hành động tung vào ngay lập tức.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000440
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000440: terms: [''Tiểu đoàn 203
    (203rd Battalion)'', ''lính thủy đánh bộ (marines)'', ''đánh giáp lá cà (close-quarters
    combat)'']: pronouns_and_address: []: pov_and_voice: Trần thuật khái quát thế
    giằng co giữa hai lực lượng.: modality_and_logic: Giữ sự đối đầu không khoan nhượng
    giữa hai phong cách cận chiến và thế cân bằng động (`Lính thủy đánh bộ có vị trí
    nhỉnh hơn đôi chút, nhưng tình hình vẫn biến động khó lường`).: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000441
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000441: terms: [''đại đội tiếp
    viện (follow-up company)'']: pronouns_and_address: []: pov_and_voice: Trần thuật
    bước ngoặt chiến thuật khi đại đội tiếp theo hạ cánh.: modality_and_logic: Giữ
    quan hệ đồng thời giữa lúc hai bên đang giằng co tìm nước đi tiếp theo và sự kiện
    đại đội tiếp viện đổ bộ.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000442
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000442: terms: [''các đại đội trưởng
    (company commanders)'', ''lính thủy đánh bộ (marines)'', ''quân tiếp viện (reinforcements)'',
    ''nguồn lực chiến đấu (fighting resources)'', ''Thủy thủ (Sailors)'', ''các khẩu
    pháo (cannons)'']: names_and_ranks: [''Thiếu tá von Degurechaff (Major von Degurechaff)'']:
    pronouns_and_address: [''Câu 1 độc thoại nội tâm in nghiêng dùng `Chúng ta`; câu
    2 trần thuật ngôi thứ ba dùng `Thiếu tá von Degurechaff và các đại đội trưởng`;
    câu 3–6 quy chiếu phía lính thủy đánh bộ và thủy thủ trên tàu bằng `họ` / `Họ`.'']:
    pov_and_voice: Câu nội tâm khẳng định chiến thắng của Tanya chuyển sang trần thuật
    quan sát hai phía.: modality_and_logic: Giữ sự tương phản giữa nụ cười của Thiếu
    tá von Degurechaff cùng các đại đội trưởng với vẻ nhục nhã của lính thủy đánh
    bộ, tình trạng cạn dần nguồn lực chiến đấu, thế kẹt không thể rút thủy thủ khỏi
    các khẩu pháo và hệ quả do dự làm chậm hành động.: emphasis: Khóa chính xác phạm
    vi nhấn mạnh `*Chúng ta sẽ chiến thắng.*` khớp với thẻ `<em>` ở câu đầu (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000443
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000443: terms: [''quân nhân chưa
    có nhiệm vụ (unoccupied personnel)'', ''đánh giáp lá cà (hand-to-hand combat)'']:
    pronouns_and_address: [''Trong khẩu lệnh trên tàu: dùng `Chúng ta` và quy chiếu
    đối phương bằng `chúng`.'']: pov_and_voice: Khẩu lệnh tổng động viên nhân lực
    rảnh tay trên tàu.: modality_and_logic: Giữ mệnh lệnh chuẩn bị đánh giáp lá cà
    và quyết tâm đẩy bật đối phương khỏi tàu.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000444: terms: [''các đài chỉ huy
    (bridges)'', ''khoang động cơ (engine block)'', ''kho đạn (magazine)'']: pronouns_and_address:
    [''Lược đại từ ngôi thứ hai khái quát trong câu điều kiện (`con tàu coi như xong,
    bất kể còn bao nhiêu lực lượng...`).'']: pov_and_voice: Nhận định nguyên tắc tác
    chiến hải quân từ điểm nhìn của Tanya.: modality_and_logic: Giữ điều kiện quyết
    định số phận con tàu nếu ba khu vực trọng yếu (`các đài chỉ huy, khoang động cơ
    và kho đạn`) bị chiếm, bất chấp số nhân lực còn lại. Khóa lựa chọn tạm `kho đạn`
    (`vol02-ch04-b25-magazine`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000445
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000445: terms: [''tình thế nguy
    cấp (crisis)'', ''phản công (counterattack)'']: pronouns_and_address: [''Quy chiếu
    phía phòng thủ trên tàu bằng `họ`.'']: pov_and_voice: Trần thuật giải thích nguyên
    nhân sự chần chừ của phía tàu.: modality_and_logic: Giữ cấu trúc nhấn mạnh nguyên
    nhân (`Chính tình thế nguy cấp ấy khiến họ hơi chần chừ trước khi gom góp số quân
    còn có thể huy động để phản công`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000446
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000446: terms: [''Thuyền trưởng
    (The captain)'', ''thủy thủ (sailors)'', ''sĩ quan và hạ sĩ quan (officers and
    petty officers)'', ''những lữ đoàn hải quân lâm thời (provisional naval brigades)'',
    ''lính thủy đánh bộ (marines)'']: pronouns_and_address: []: pov_and_voice: Trần
    thuật mô tả quyết định huy động nhân lực tàu của thuyền trưởng.: modality_and_logic:
    Khóa sửa chữa B25-F09: giữ nguyên trình tự thuyền trưởng ra lệnh gom lực lượng
    dư -> nhận định số lượng nhân sự trên tàu và khả năng bắn súng của thủy thủ ->
    các sĩ quan và hạ sĩ quan được huy động lập thành `những lữ đoàn hải quân lâm
    thời` để tăng viện cho lính thủy đánh bộ.: emphasis: Không dùng `*...*`.'
  non_canon: true
