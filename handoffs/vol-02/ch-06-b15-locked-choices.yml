    đội địch` ở câu 1 và đại từ `Chúng` ở câu 2.; pov_and_voice=Giọng báo động khẩn
    cấp của sỹ quan/trắc thủ cảnh giới Cộng hòa cắt ngang dòng suy tư của Vianto.;
    modality_and_logic=Bảo toàn đủ 2 câu cảm thán: tiền đội địch đã tiến vào vùng
    nhận dạng phòng không -> chúng đang nhanh chóng áp sát thành phố.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000468
  kind: terminology_and_voice
  value: 'terms=[''người lính'']; pronouns_and_address=Trần thuật ngôi thứ ba quy
    chiếu Vianto nhất quán bằng đại từ `anh`.; pov_and_voice=Giọng trần thuật rắn
