    của họ thậm chí không thể trụ nổi đến hai tuần.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000455
  kind: terminology_and_voice
  value: 'terms=[''kẻ địch'']; pronouns_and_address=Trần thuật ngôi thứ ba quy chiếu
