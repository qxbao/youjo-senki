segment_id_start: YS-LN02/Text/part0030.xhtml/p000224
segment_id_end: YS-LN02/Text/part0030.xhtml/p000256
choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000224
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000224: terms: []: pronouns_and_address:
    Trong lời phát biểu mở đầu lô, Tanya tự xưng `Tôi` và dùng tiểu từ kính ngữ `ạ`
    khi đặt câu hỏi trước giảng viên và lớp học.: pov_and_voice: Giọng rào đón lịch
    sự theo đúng lễ tiết học viên nhưng đi thẳng vào câu hỏi chất vấn sự cần thiết
    của cuộc thảo luận.: modality_and_logic: Bảo toàn dấu chấm lửng mở đầu `…`, mệnh
    đề rào đón phủ định ý định thất lễ (`Tôi không có ý bất kính`) và câu hỏi nghi
    vấn trực tiếp về tính cần thiết của cuộc thảo luận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000225
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000225: terms: []: pronouns_and_address:
    Trần thuật ngôi thứ ba quy chiếu Tanya bằng `cô` (hoặc đồng bộ `nó` / `Tanya`
    ở bước polish) kết hợp đại từ phản thân `mình`.: pov_and_voice: Giọng trần thuật
    bám sát điểm nhìn tự nhận thức của Tanya.: modality_and_logic: Bảo toàn quan hệ
    nguyên nhân nối từ cuối `b07` (`Đó là lý do cô lên tiếng ngắt lời`) và sự tự ý
    thức về thái độ không mấy dễ thương đi kèm lựa chọn nói bình thản bằng giọng cố
    ý đều đều.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000226: terms: [''Tanya'']: pronouns_and_address:
    Chuyển đại từ ngôi thứ hai phiếm chỉ ở câu 1 sang câu bị động khách quan theo
    `direct-address choice`; câu 2 dùng tên riêng `Tanya` và đại từ phản thân `mình`.:
    pov_and_voice: Giọng trần thuật đối lập giữa quy chuẩn thông thường và sự tự tin
    của Tanya.: modality_and_logic: Bảo toàn giả định thông thường (`Thông thường,
    một lời như thế hẳn sẽ bị khiển trách`) và mệnh đề phủ định suy nghĩ (`Nhưng Tanya
    không nghĩ mình sẽ gặp rắc rối`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000227: terms: [''học viên'', ''Degurechaff'']:
    pronouns_and_address: Giảng viên gọi Tanya bằng tư cách `học viên`, họ `Degurechaff`
    và đại từ ngôi thứ hai `cô`; lược đại từ ngôi thứ nhất số nhiều trong câu mệnh
    lệnh (`Hãy nói rõ ý cô`).: pov_and_voice: Giọng bề trên điềm đạm của người giảng
    bài khi cho phép học viên trình bày quan điểm táo bạo.: modality_and_logic: Bảo
    toàn nhận xét đánh giá mức độ táo bạo của lời phát biểu và yêu cầu giải thích
    rõ ý.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000228
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000228: terms: [''Bao vây rồi bỏ
    đói địch'', ''chiến thuật'', ''thời Trung cổ'']: pronouns_and_address: Tanya đáp
    lễ giảng viên bằng `Vâng, thưa ngài.`: pov_and_voice: Giọng thuyết trình học thuật
    sắc sảo, thẳng thắn phê phán sự lỗi thời của chiến thuật vây hãm.: modality_and_logic:
    Bảo toàn lời thưa mở đầu và nhận định đánh giá việc bao vây bỏ đói địch là chiến
    thuật nhàn nhã từ thời Trung cổ hoặc cùng lắm là thời đại trước.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000229
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000229: terms: [''cuộc vây hãm
    Vienna của Ottoman'', ''chiến dịch ở Ý của Napoleon'', ''cuộc chiến hiện đại'',
    ''chiến thuật'', ''đường sắt'']: pronouns_and_address: Độc thoại / lập luận khách
    quan không dùng đại từ nhân xưng.: pov_and_voice: Giọng phân tích lịch sử quân
    sự dựa trên kiến thức thế giới thực của Tanya.: modality_and_logic: Bảo toàn hai
    dẫn chứng lịch sử cụ thể (cuộc vây hãm Vienna của Ottoman, chiến dịch ở Ý của
    Napoleon) và phủ định khả thể: quân đội đánh một cuộc chiến hiện đại không thể
    dùng chiến thuật từ thời chưa có cả đường sắt.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000230
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000230: terms: [''chiến lược'']:
    pronouns_and_address: Lược đại từ ngôi thứ hai phiếm chỉ ở cả hai vế theo `direct-address
    choice`.: pov_and_voice: Giọng kết luận dứt khoát, thực dụng.: modality_and_logic:
    Bảo toàn cấu trúc điều kiện – khuyến nghị phủ định: nếu rốt cuộc vẫn phải dùng
    chiến lược ấy thì thà đừng giao chiến còn hơn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000231
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000231: terms: []: pronouns_and_address:
    Lời gợi mở ngắn gọn không dùng đại từ.: pov_and_voice: Giọng giảng viên gặng hỏi
    hướng giải quyết tiếp theo.: modality_and_logic: Bảo toàn từ nối bỏ lửng kèm dấu
    chấm lửng (`“Vậy…”`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000232
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000232: terms: [''bỏ đói họ đến
    khi khuất phục'', ''phương án thực tế'']: pronouns_and_address: Quy chiếu đối
    phương bị vây bằng `họ`; quy chiếu Tanya trong lời kể bằng `Cô`.: pov_and_voice:
    Giọng trần thuật bám sát suy nghĩ của Tanya: thừa nhận thực tế chiến thuật nhưng
    bác bỏ việc dừng lại ở điều hiển nhiên.: modality_and_logic: Bảo toàn đủ 3 câu:
    thừa nhận không có mấy phương án thực tế ngoài việc bỏ đói địch đến khi khuất
    phục; khẳng định Tanya hiểu điều đó; và đối lập rằng đó là vấn đề mà tất cả mọi
    người đều đã biết.: emphasis: Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo
    `DEC-P01-002`: chỉ bọc dấu `*...*` quanh lượng từ `*ai cũng*` tương ứng thẻ `<html:em>`
    trong nguồn, giữ nguyên các phần còn lại ở chữ thường.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000233
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000233: terms: []: pronouns_and_address:
    Nội tâm của Tanya dùng đại từ ngôi thứ nhất số nhiều gộp `Chúng ta` cho tập thể
    lớp học.: pov_and_voice: Giọng chất vấn nội tâm nghiêm túc về mục đích buổi thảo
    luận.: modality_and_logic: Bảo toàn câu phủ định mục đích: họ không tập trung
    ở đây để tranh luận một chuyện ai cũng đã hiểu rõ như vậy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000234
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000234: terms: [''kẽ hở pháp lý'']:
    pronouns_and_address: Lược đại từ ngôi thứ hai phiếm chỉ theo `direct-address
    choice`.: pov_and_voice: Giọng tư duy lách luật điển hình của Tanya.: modality_and_logic:
    Bảo toàn quan hệ điều kiện phủ định – giải pháp thay thế: nếu không động não nghĩ
    ra được cách nào thì tốt hơn là tìm một kẽ hở pháp lý.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000235
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000235: terms: [''tính khả thi'']:
    pronouns_and_address: Nhận định nội tâm khái quát không dùng đại từ nhân xưng.:
    pov_and_voice: Giọng lập luận phương pháp luận chặt chẽ.: modality_and_logic:
    Bảo toàn việc tách bạch `tính khả thi` với trách nhiệm tư duy: gác tính khả thi
    sang một bên, việc không xem xét mọi khả năng sẽ là một sai lầm lớn.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000236: terms: [''trí thức'']:
    pronouns_and_address: Dùng danh ngữ khái quát `một người` tự quy chiếu gián tiếp.:
    pov_and_voice: Giọng tự hào ngầm pha chút tự trào nhẹ về nền tảng giáo dục trí
    thức của bản thân.: modality_and_logic: Bảo toàn sắc thái dè dặt (`đã được đào
    tạo ít nhiều theo kiểu trí thức`) và mức độ đánh giá giả định (`đó sẽ là sai lầm
    không thể tha thứ`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000237
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000237: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật gọi tên riêng `Tanya` và quy chiếu tập thể lớp học bằng `họ`.: pov_and_voice:
    Giọng trần thuật đúc kết lập trường của Tanya.: modality_and_logic: Bảo toàn liên
    từ hệ quả (`Vì vậy`), mức độ xác tín (`Tanya tin chắc rằng`), mệnh đề nhượng bộ
    (`dù chỉ là tranh luận để tranh luận`) và khuyến nghị đổi hướng tiếp cận.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000238
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000238: terms: [''chiến tranh đô
    thị'', ''trực tế lịch sử'', ''trận chiến đô thị'']: pronouns_and_address: Trần
    thuật ngôi thứ ba quy chiếu Tanya bằng `cô`.: pov_and_voice: Giọng phân tích chuyển
    từ tiền đề sang trọng tâm phương thức tác chiến.: modality_and_logic: Bảo toàn
    sắc thái rào đón (`phần nào quen thuộc với chiến tranh đô thị như một thực tế
    lịch sử`) và đặt đúng trọng tâm câu hỏi vào phương thức tiến hành một trận chiến
    đô thị.: emphasis: Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`:
    chỉ bọc dấu `*...*` quanh cụm từ nghi vấn chỉ phương thức `*như thế nào*` tương
    ứng thẻ `<html:em>`, không nghiêng cả câu hỏi.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000239
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000239: terms: []: pronouns_and_address:
    Tanya dùng đại từ ngôi thứ nhất số nhiều gộp `chúng ta` khi phát biểu trước lớp.:
    pov_and_voice: Giọng đề xuất điềm nhiên nhưng lật ngược hoàn toàn bài toán pháp
    lý.: modality_and_logic: Bảo toàn dấu chấm lửng mở đầu `…` nối từ `p000231` và
    cấu trúc câu hỏi đề nghị (`Chẳng phải chúng ta nên tìm cách để chiến đấu trong
    thành phố mà vẫn hợp pháp sao?`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000240
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000240: terms: [''Chiến tranh đô
    thị'', ''luật pháp quốc tế'']: pronouns_and_address: Quy chiếu đối phương bằng
    `họ` / `đối phương`.: pov_and_voice: Giọng độc thoại nội tâm sắc bén, liên hệ
    bài toán quân sự với kinh nghiệm đàm phán thương trường.: modality_and_logic:
    Bảo toàn đủ 3 câu: câu hỏi tu từ mở đầu về việc chiến tranh đô thị bị luật pháp
    quốc tế hạn chế; nhận định việc mò mẫm tìm cách đánh thắng mà tránh chiến tranh
    đô thị là chơi theo luật của địch; và phép so sánh với việc thương lượng thỏa
    thuận quan trọng ngay tại văn phòng đối phương.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000241
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000241: terms: []: pronouns_and_address:
    Lược đại từ ngôi thứ hai phiếm chỉ ở đầu câu theo `direct-address choice`, dùng
    đại từ gộp `ta` ở cuối câu 2 và quy chiếu đối phương bằng `họ`.: pov_and_voice:
    Giọng đúc kết nguyên tắc giành thế chủ động trong đàm phán và chiến tranh.: modality_and_logic:
    Bảo toàn phủ định tuyệt đối ở câu 1 (`Làm thế thì chẳng bao giờ thắng được`) và
    yêu cầu đảo ngược tình thế ở câu 2 (`xoay chuyển tình thế để họ phải đến thương
    lượng với ta`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000242
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000242: terms: [''chiến tranh đô
    thị'', ''Iraq'', ''Afghanistan'', ''Tanya'', ''Warsaw'', ''cuộc chiến tổng lực'']:
    pronouns_and_address: Tuân thủ `DEC-P01-001` và `chapter6_b08_coordinator_choices`:
    dùng `ta` cho chủ thể tập thể ở câu 1, dùng `mình` cho tự quy chiếu nội tâm ngôi
    thứ nhất ở câu 2, và dùng tên riêng `Tanya` / `Cô` ở hai mệnh đề dẫn trần thuật
    ngôi thứ ba.: pov_and_voice: Sự chuyển dịch mượt mà giữa lập luận chung, ký ức
    kiếp trước, ý nghĩ trực tiếp lóe lên trong đầu và sự tính toán lạnh lùng.: modality_and_logic:
    Bảo toàn đủ 5 câu cùng sự chuyển hướng lập luận: câu hỏi đổi góc nhìn làm sao
    để hợp pháp hóa chiến tranh đô thị -> lời tự thú từ chối thực hiện vì đã thấy
    Iraq và Afghanistan -> nhận ra giả định trái thực tế rằng nếu có thể san phẳng
    cả dãy phố như ở Warsaw thì chiến tranh đô thị sẽ dễ như trở bàn tay -> bắt đầu
    tính toán -> đánh giá việc bước vào cuộc chiến tổng lực rất phiền phức nhưng chắc
    chắn là một khả năng.: emphasis: Bảo toàn chính xác hai vùng nhấn mạnh độc lập
    theo `DEC-P01-002` tương ứng hai thẻ `<html:em>`: `*Nhưng nếu có thể san phẳng
    cả dãy phố như họ đã làm ở Warsaw, thì chiến tranh đô thị này sẽ dễ như trở bàn
    tay.*` và `*Bước vào một cuộc chiến tổng lực sẽ rất phiền phức, nhưng chắc chắn
    vẫn là một khả năng.*`, giữ nguyên các câu dẫn trần thuật ở chữ thường.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000243
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000243: terms: [''Degurechaff'',
    ''luật chiến tranh'']: pronouns_and_address: Giảng viên gọi họ `Degurechaff` và
    dùng đại từ ngôi thứ hai `cô`.: pov_and_voice: Giọng hỏi kiểm tra kiến thức cơ
    bản của giảng viên trước đề xuất táo bạo của học viên.: modality_and_logic: Bảo
    toàn dấu chấm lửng mở đầu `…` và câu hỏi nghi vấn phủ định xem trong giờ học cô
    chưa học về luật chiến tranh hay sao.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000244
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000244: terms: []: pronouns_and_address:
    Tanya tự xưng `tôi` trong hội thoại.: pov_and_voice: Giọng đáp tự tin, hào hứng
    của Tanya.: modality_and_logic: Bảo toàn lời xác nhận đã hoàn thành môn học và
    đánh giá môn đó vô cùng thú vị.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000245
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000245: terms: [''Luật học'', ''lý
    luận hiến pháp'', ''Luật Dân sự A, B'', ''lý thuyết quan hệ quốc tế'', ''quản
    trị quốc tế'', ''luật quốc tế'', ''thứ chi phối nền văn minh'']: pronouns_and_address:
    Tuân thủ `DEC-P01-001` và `chapter6_b08_coordinator_choices`: độc thoại nội tâm
    hồi tưởng thời sinh viên kiếp trước tự quy chiếu nhất quán bằng `mình`.: pov_and_voice:
    Giọng hồi tưởng tri thức kiếp trước đầy hứng thú của một trí thức tôn sùng quy
    tắc và luật pháp.: modality_and_logic: Bảo toàn đủ 3 câu: chưa học lại luật từ
    thời sinh viên học Luật học (gồm lý luận hiến pháp) và Luật Dân sự A, B; có học
    đôi chút về lý thuyết quan hệ quốc tế, quản trị quốc tế và luật quốc tế; và niềm
    vui thực sự khi có cơ hội học luật—thứ chi phối nền văn minh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000246
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000246: terms: [''cơ sở pháp lý'',
    ''nguyên tắc pháp lý'']: pronouns_and_address: Trần thuật ngôi thứ ba quy chiếu
    Tanya bằng `cô`.: pov_and_voice: Giọng trần thuật khẳng định sự vững chắc về mặt
    lý thuyết pháp lý trong đề xuất của Tanya.: modality_and_logic: Bảo toàn quan
    hệ nhân quả (`Chính vì thế`) và hai vế phủ định khẳng định tính hợp lệ ở câu 2
    (`Ý tưởng của cô không sai và cũng chẳng mâu thuẫn với nguyên tắc pháp lý nào`).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000247
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000247: terms: []: pronouns_and_address:
    Giảng viên gọi Tanya bằng `cô`.: pov_and_voice: Giọng hỏi xác nhận của giảng viên.:
    modality_and_logic: Bảo toàn dấu chấm lửng mở đầu `…` và câu hỏi xác nhận xem
    có phải cô nói vậy dựa trên trải nghiệm học tập đó không.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000248
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000248: terms: [''giảng viên'']:
    pronouns_and_address: Tanya đáp ngắn gọn, lễ phép `Vâng, thưa giảng viên.`: pov_and_voice:
    Giọng đáp điều lệnh chuẩn mực trong lớp học quân sự.: modality_and_logic: Bảo
    toàn lời xác nhận trực tiếp.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000249
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000249: terms: [''thị trường vận
    hành hợp lý'', ''Những kẻ lợi dụng luật pháp để kiếm lợi'', ''những vụ kiện bằng
    sáng chế'', ''những xã hội kiện tụng'', ''Hoa Kỳ'', ''luật sư'', ''quốc đảo'',
    ''quân đội'']: pronouns_and_address: Độc thoại nội tâm phân tích khách quan, chuyển
    cấu trúc ngôi thứ hai phiếm chỉ sang bị động (`những gì được phép hay không được
    phép theo luật`) theo `direct-address choice`.: pov_and_voice: Giọng bình luận
    châm biếm, thực dụng của Tanya về bản chất co giãn của việc diễn giải pháp luật.:
    modality_and_logic: Bảo toàn trọn vẹn 6 câu cùng dấu chấm lửng và dấu gạch ngang
    dài `—`: luật nào cũng đương nhiên có chỗ để diễn giải -> tạo cơ hội cho đám đáng
    ghét bẻ cong luật và quấy nhiễu thị trường vận hành hợp lý -> những kẻ lợi dụng
    luật pháp để kiếm lợi có thể kiếm lời từ các vụ kiện bằng sáng chế tốn thời gian
    -> ở các xã hội kiện tụng như Hoa Kỳ có vô số luật sư tham gia các cuộc chiến
    pháp lý -> những gì được hay không được làm thay đổi tùy cách diễn giải và thực
    thi, đến mức một quốc đảo yên bình nào đó nói không có quân đội nhưng vẫn trang
    bị cho chính quân đội ấy đủ loại vũ khí tuyệt vời -> nhận xét việc đó vẫn hơn
    từ bỏ hẳn quân đội và chứng minh độ rộng của việc diễn giải luật.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000250
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000250: terms: [''Đế quốc'', ''Tanya'']:
    pronouns_and_address: Trần thuật gắn với điểm nhìn của `Tanya`.: pov_and_voice:
    Giọng tự vấn đầy vẻ đương nhiên của Tanya.: modality_and_logic: Bảo toàn câu hỏi
    tu từ có phép điệp ý `nghiêm túc` ở câu 1 và nhận định khẳng định ở câu 2 (`Với
    Tanya, đó là diễn biến hoàn toàn tự nhiên`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000251
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000251: terms: [''luật trong nước'',
    ''chủ quyền'', ''Hoàng đế Bệ hạ'', ''quân đội'', ''luật quốc tế'', ''Tanya'']:
    pronouns_and_address: Quy chiếu `Hoàng đế Bệ hạ` bằng đại từ tôn kính `ngài`;
    dùng tên riêng `Tanya` ở câu kết.: pov_and_voice: Giọng phân tích ranh giới thẩm
    quyền chính trị nội bộ và sự tự tin tuyệt đối vào nghệ thuật lách luật quốc tế.:
    modality_and_logic: Bảo toàn sự tương phản quanh dấu chấm lửng `…`: luật trong
    nước do người nắm chủ quyền là Hoàng đế Bệ hạ diễn giải và cấm xâm phạm thẩm quyền
    của ngài, nhưng quân đội nghiên cứu luật quốc tế nên hoàn toàn an toàn; cùng câu
    kết khẳng định Tanya tin chắc không chút nghi ngờ rằng màu xám chính là màu trắng.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000252
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000252: terms: [''luật pháp quốc
    tế'']: pronouns_and_address: Dùng đại từ khái quát `người ta` cho chủ thể diễn
    giải luật trong lời thoại của Tanya.: pov_and_voice: Giọng thuyết trình pháp lý
    đĩnh đạc, sắc gọn.: modality_and_logic: Bảo toàn định đề pháp lý của Tanya: đây
    là vấn đề diễn giải; bất cứ điều gì luật pháp quốc tế không cấm rõ ràng thì chỉ
    bị hạn chế tùy theo cách người ta diễn giải.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000253: terms: []: pronouns_and_address:
    Câu hỏi ngắn không dùng đại từ nhân xưng.: pov_and_voice: Giọng giảng viên yêu
    cầu nêu ví dụ minh họa cụ thể.: modality_and_logic: Bảo toàn câu hỏi ngắn (`“Cụ
    thể là thế nào?”`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000254
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000254: terms: [''điều khoản'',
    ''Quân đội'', ''tấn công bừa bãi'', ''người không tham chiến'']: pronouns_and_address:
    Lời thoại trích dẫn điều khoản pháp lý khách quan không dùng đại từ nhân xưng.:
    pov_and_voice: Giọng dẫn chứng điều khoản luật chiến tranh chuẩn xác.: modality_and_logic:
    Bảo toàn mệnh đề rào đón (`Đây chỉ là một ví dụ`) và nguyên văn nội dung điều
    khoản trong dấu nháy đơn (`‘Quân đội bị cấm tấn công bừa bãi những khu vực có
    người không tham chiến.’`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000255
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000255: terms: [''người không tham
    chiến'', ''Kẻ địch'', ''quân đội'', ''nghĩa vụ bảo vệ'']: pronouns_and_address:
    Lược đại từ ngôi thứ hai phiếm chỉ theo `direct-address choice`.: pov_and_voice:
    Giọng lập luận nội tâm lật ngược chiều tác động của điều khoản pháp lý.: modality_and_logic:
    Bảo toàn đủ 5 câu: thoạt nhìn dường như không thể giao chiến trong thành phố ->
    có vô số người không tham chiến sống ở đó -> nhưng hãy đảo ngược vấn đề -> kẻ
    địch cũng bị ràng buộc y như vậy -> vì quân đội có nghĩa vụ bảo vệ.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000256
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000256: terms: [''điều khoản'',
    ''bên tấn công'', ''bên phòng thủ'', ''các nơi trú ẩn'', ''người sơ tán'', ''thường
    dân'']: pronouns_and_address: Tanya dùng đại từ gộp `Ta` cho phía mình và `họ`
    cho bên phòng thủ.: pov_and_voice: Giọng trình bày kết luận lách luật lạnh lùng,
    chặt chẽ.: modality_and_logic: Bảo toàn đủ 3 câu cùng dấu chấm lửng `…` và đúng
    mức độ khả thể pháp lý: thoạt nhìn điều khoản có vẻ hạn chế bên tấn công nhưng
    đương nhiên cũng hạn chế bên phòng thủ -> ta có thể yêu cầu họ bảo vệ những người
    trong các nơi trú ẩn theo đúng luật -> nói cách khác, nếu họ không đưa người sơ
    tán đi rồi rút lui… thì có thể diễn giải rằng ở đó không có thường dân.: emphasis:
    none'
  non_canon: true
