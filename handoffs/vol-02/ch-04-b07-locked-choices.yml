    hệ nhân quả và giả định'': ''tin vào khả năng bay đội hình nên sẽ rất bực nếu
    bị lạc nhau và không thể dốc toàn lực chiến đấu; niềm an ủi là trong đơn vị hẳn
    không có ai mù phương hướng đến mức đó''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000148
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000148: names_and_ranks: [''Control
