  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000150
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000150: names_and_ranks: [''rear
    -> phía sau'']: pronouns_and_address: [''Tự sự ngôi thứ nhất dùng "tôi" (số ít)
