    -> lệnh cấm bay'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu
    Tanya bằng tên riêng "Tanya" và đại từ "nó" theo DEC-P01-001 (bản sửa M1); quy
    chiếu cả đơn vị bằng "họ"'']: pov_and_logic: [''Giữ trọn lời thoại điểm tin thời
    tiết và hỏi tình hình các đơn vị khác, phản ứng ngán ngẩm của Tanya khi thời tiết
    xấu thêm, và điều kiện nếu nâng lên lệnh cấm bay thì có thể trở về căn cứ'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000154
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000154: names_and_ranks: [''First
