    "Tôi", quy chiếu lính mặt đất bằng "họ"'']: pov_and_logic: [''Giữ nguyên định
    danh "Urban Control" (bản sửa M6) và chủ thể/phủ định về thời tiết của câu tỉnh
    lược ("Có vẻ trời sẽ chưa khá lên trong một lúc nữa" — bản sửa M3) cùng sự cảm
    thông với lính mặt đất trong giá lạnh'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000153
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000153: names_and_ranks: [''Tanya
    -> Tanya'', ''combat zone -> vùng chiến sự'', ''level-two flood warning -> cảnh
