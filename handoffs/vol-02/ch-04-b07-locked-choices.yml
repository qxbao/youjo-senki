  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000165
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000165: names_and_ranks: [''aals
    -> *aal*¹¹'', ''torpedo development team -> đội phát triển ngư lôi'']: pronouns_and_address:
