    từ b06) bằng "họ"'']: pov_and_logic: [''Giữ đúng kế hoạch di chuyển về phía bắc
    để hội quân ngay khi có tin tức và dặn dò tùy cơ ứng biến'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000139: names_and_ranks: []: pronouns_and_address:
    [{''Khẩu lệnh đáp nhận đồng thanh của đơn vị'': ''Đã rõ.''}]: pov_and_logic: [''Giữ
