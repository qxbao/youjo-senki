    sự ngôi thứ nhất số nhiều "phe ta" / "chúng tôi"'']: pov_and_logic: [''Giữ phủ
    định ("Ngoài vài tin báo sai gây bực mình... chẳng có tin tức gì") và chi tiết
    thời tiết xấu đi làm giảm tầm nhìn nhanh chóng'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000146
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000146: names_and_ranks: [''battalion
    -> tiểu đoàn'']: pronouns_and_address: [''Tự sự ngôi thứ nhất dùng "Tôi" và đại
    từ phản thân sở hữu "mình" ("tiểu đoàn của mình")'']: pov_and_logic: [''Giữ mức
    độ tầm nhìn kém đến mức nhìn quanh cũng chẳng thấy tiểu đoàn của mình'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000147
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000147: names_and_ranks: [''unit
    -> đơn vị'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya dùng "Mình"
