    cáo từ hậu phương và hệ quả logic của việc không có báo cáo tiếp xúc là phải tiếp
    tục bay tìm kiếm'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000151
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000151: names_and_ranks: [''defensive
    shells -> lớp vỏ phòng ngự'']: pronouns_and_address: [''Tự sự ngôi thứ nhất số
    nhiều "chúng tôi"'']: pov_and_logic: [''Giữ giả định trái thực tế ("Nếu muốn bay
    lên trên tầng mây mưa, chúng tôi sẽ phải lên cao khủng khiếp"), thuật ngữ đã sửa
    theo M7 ("lớp vỏ phòng ngự") và nhận xét bị mưa tạt không làm tâm trạng khá hơn
    dù ngăn được nước'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000152
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000152: names_and_ranks: [''Urban
