    dữ của thủy thủ đòi nhét đội phát triển ngư lôi vào ống phóng rồi bắn đi'']: emphasis:
    [''Giữ đủ hai vị trí nhấn mạnh Markdown `*aal*¹¹` và `*họ*` theo DEC-P01-002 (bản
    sửa M2)'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000166
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000166: names_and_ranks: [''devs
    -> đội phát triển'']: pronouns_and_address: [''Quy chiếu thủy thủ tàu ngầm bằng
