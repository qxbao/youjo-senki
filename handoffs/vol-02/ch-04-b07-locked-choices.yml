    nhiệm'']: pronouns_and_address: [''Thoại thông báo từ đài kiểm soát, quy chiếu
    các đơn vị bạn bằng "họ"'']: pov_and_logic: [''Giữ bản sửa M4 "Hải đội Một" xuất
    phát từ căn cứ hải quân Kiël đi làm nhiệm vụ tìm diệt, tách biệt với "đại đội
    trinh sát đặc nhiệm" do Không quân phái lên, và lời dặn không bắn nhầm'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000155
