- segment_id: YS-LN02/Text/part0022.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000140: names_and_ranks: [''Intelligence
    -> Tình báo'', ''marine mages -> pháp sư thủy quân lục chiến'', ''reconnaissance
    -> trinh sát'']: pronouns_and_address: [''Thoại của Tanya dùng "chúng ta" cho
    tiểu đoàn, "địch" / "chúng" / "họ" cho phía đối phương và lực lượng pháp sư thủy
    quân lục chiến'']: pov_and_logic: [''Giữ hai thông tin tình báo (địch cơ động
    nhanh, có pháp sư thủy quân lục chiến) và thứ tự ưu tiên nhiệm vụ (bao gồm tiêu
    diệt nhưng ưu tiên hàng đầu là trinh sát)'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000141: names_and_ranks: [''search
    and destroy -> “tìm diệt”'', ''search -> “tìm”'']: pronouns_and_address: [''Nội
    tâm Tanya dùng "chúng ta" cho tiểu đoàn và "họ" cho cấp trên'']: pov_and_logic:
    [''Giữ nhận xét về bản chất nhiệm vụ "tìm diệt" phổ biến nhưng được chỉ thị ưu
    tiên phần "tìm"'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000142: names_and_ranks: [''exercise
    ground runway -> đường băng ở bãi tập'']: pronouns_and_address: [''Mệnh lệnh trực
    tiếp của Tanya trước toàn đơn vị, lược chủ ngữ tự nhiên'']: pov_and_logic: [''Giữ
    chính xác thời hạn ("Sau sáu mươi phút"), địa điểm ("đường băng ở bãi tập"), yêu
    cầu ("trang bị đầy đủ") và câu hỏi chốt ("Có câu hỏi gì không?")'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000143
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000143: names_and_ranks: [''underlings
    -> đám thuộc hạ'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya tự quy
    chiếu bằng "mình" (DEC-P01-001), quy chiếu binh sĩ dưới quyền bằng "đám thuộc
    hạ mê chiến tranh" / "Ai nấy"'']: pov_and_logic: [''Giữ giọng nội tâm nửa ngán
    ngẩm nửa thừa nhận tinh thần hiếu chiến của thuộc cấp'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000144
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000144: names_and_ranks: [''unit
    -> đơn vị'', ''cruising speed -> tốc độ hành trình'']: pronouns_and_address: [''Tự
    sự ngôi thứ nhất số nhiều "Chúng tôi"'']: pov_and_logic: [''Giữ phủ định ("chẳng
    ai hỏi gì"), mốc thời gian ("sau đó một giờ") và hướng bay ("vừa tăng độ cao vừa
    bay về phía tây với tốc độ hành trình")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000145
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000145: names_and_ranks: [''friendly
