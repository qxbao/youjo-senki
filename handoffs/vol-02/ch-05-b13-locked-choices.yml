choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000313
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000313: terms: [''Tanya'', ''chương
    trình huấn luyện tân binh'']: pronouns_and_address: Trần thuật ngôi thứ ba dùng
    tên riêng `Tanya` và đại từ `nó` theo đúng `DEC-P01-001`; quy chiếu đơn vị đi
    cùng là `họ`.: pov_and_voice: Lời lẩm bẩm mở màn đầy mỉa mai của Tanya kết hợp
    trần thuật hạn tri mô tả cuộc xuất kích ban đêm.: modality_and_logic: Bảo toàn
    sự tương phản giữa lời ngợi ca chiếc xẻng là công cụ của nền văn minh với cảnh
    cả đơn vị bò sấp lấm lem bùn đất đi tập kích địch bằng xẻng trong khuôn khổ chương
    trình huấn luyện tân binh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000314
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000314: terms: [''Tanya'', ''Rhine'',
    ''hậu phương'']: pronouns_and_address: Trần thuật hạn tri dùng `Tanya` và `nó`
    (`DEC-P01-001`), quy chiếu đám tân binh là `họ`.: pov_and_voice: Trần thuật hạn
    tri khắc họa sự miễn cưỡng pha lẫn nguyên tắc chấp hành mệnh lệnh của Tanya.:
    modality_and_logic: Bảo toàn mệnh đề điều kiện (ép tân binh bò qua bùn lầy để
    khắc sâu vào đầu họ thực tế ở Rhine rằng chỉ lũ ngốc hoặc xác những anh hùng được
    đưa về hậu phương mới giữ được quần áo sạch sẽ) và sự đối lập giữa ý muốn cá nhân
    (`Nó không muốn làm thế`) với nghĩa vụ tuân lệnh (`đã là mệnh lệnh thì chẳng còn
    cách nào khác`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000315
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000315: terms: [''vùng đất giữa
    hai chiến tuyến'', ''giải chuyên cần hoàn hảo'', ''quy định trang phục trong chiến
    hào'']: pronouns_and_address: Trần thuật hạn tri tiếp tục quy chiếu Tanya bằng
    `nó` (`DEC-P01-001`).: pov_and_voice: Trần thuật hạn tri mang đậm giọng châm biếm
    kiểu văn phòng của Tanya.: modality_and_logic: Bảo toàn giả định trái thực tế
    ở hiện tại (`Nếu có thể, ngay lúc này nó chỉ muốn quay về`) và quan hệ nhân quả
    hài đen: vì lính bắn tỉa địch bỏ ngày nghỉ để săn giải chuyên cần hoàn hảo nên
    đơn vị của Tanya phải mặc ngụy trang màu xám và trườn từng chút một về phía trại
    địch.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000316
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000316: terms: [''mũ sắt'', ''lao
    động 3D (bẩn thỉu, nguy hiểm và hạ thấp phẩm giá)'']: pronouns_and_address: Độc
    thoại nội tâm trực tiếp của Tanya dùng `mình` theo đúng `DEC-P01-001`; lược đại
    từ ngôi thứ hai phiếm chỉ và chủ ngữ số nhiều ở hai câu đầu để tạo nhịp cảm thán
    tự nhiên.: pov_and_voice: Độc thoại nội tâm gắt gỏng, ghê tởm thực tại dơ bẩn
    của chiến trường nhưng vẫn giữ kỷ luật của người làm công ăn lương.: modality_and_logic:
    Bảo toàn trọn vẹn chuỗi cảm xúc từ nỗi nhục nhã khi phải bò lén lút như chuột,
    sự ghê tởm trước mùi tử khí làm tê liệt khứu giác, đến thái độ cam chịu (`công
    việc vẫn là công việc`) và lời nguyền rủa thứ lao động 3D vô ích.: emphasis: Bảo
    toàn chính xác 1 câu `*...*` tương ứng `<html:em>` (`*A, ghê tởm đến mức nào chứ!*`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000317
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000317: terms: [''cấp trên'']:
    pronouns_and_address: Câu hỏi độc thoại nội tâm của Tanya không dùng đại từ tự
    xưng.: pov_and_voice: Giọng than thở bất mãn quen thuộc của người cấp dưới trước
    những đòi hỏi phi lý từ thượng cấp.: modality_and_logic: Bảo toàn dấu chấm lửng
    mở đầu và câu hỏi tu từ trách cứ cấp trên luôn đòi hỏi điều bất khả thi.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000318
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000318: terms: []: pronouns_and_address:
    Lời dẫn chuyển cảnh dùng đại từ bao gộp `ta`.: pov_and_voice: Giọng người kể chuyện
    mở đầu đoạn hồi cố giải thích nguồn cơn sự việc.: modality_and_logic: Giữ đúng
    mốc chuyển thời gian lùi lại vài giờ trước về điểm khởi đầu của sự cố.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000319
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000319: terms: [''hệ thống chỉ
    huy'', ''các kênh liên lạc'', ''Quân đội Đế quốc'']: pronouns_and_address: Dùng
    `bạn` trong câu nhận định khái quát mở đầu đoạn bình luận lịch sử quân sự.: pov_and_voice:
    Giọng bình luận khách quan pha chút châm biếm về hậu quả ngoài dự kiến của sự
    cố.: modality_and_logic: Bảo toàn hai mặt đánh giá: sự việc có thể là hài kịch
    hoặc bi kịch tùy góc nhìn, nhưng chính nó đã tạo đà cải thiện đáng kể hệ thống
    chỉ huy và kênh liên lạc của Quân đội Đế quốc.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000320
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000320: terms: [''năng lực tác
    chiến dã chiến'', ''Ban Tác chiến'', ''Bộ chỉ huy'', ''Tanya'', ''thông báo lưu
    hành'', ''tỷ lệ thương vong'', ''Rhine'', ''binh chủng'', ''Đế quốc'']: pronouns_and_address:
    Trong lời thoại mở đầu sau ngắt cảnh (`space-break1`), vị đại tá Ban Tác chiến
    xưng `Tôi` – gọi Thiếu tá Tanya là `cô`; phần trần thuật ngôi thứ ba dùng `Tanya`
    và `nó` (`DEC-P01-001`), lược đại từ ngôi thứ hai phiếm chỉ ở câu kết.: pov_and_voice:
    Lời thoại công vụ trang trọng của sĩ quan tham mưu kết hợp trần thuật hạn tri
    theo điểm nhìn của Tanya.: modality_and_logic: Bảo toàn đầy đủ bối cảnh cuộc gặp:
    sĩ quan Ban Tác chiến thuộc Bộ chỉ huy đến xin ý kiến Tanya và đưa tờ thông báo
    lưu hành thống kê tỷ lệ thương vong cao khủng khiếp của tân binh bổ sung tại Rhine
    theo từng binh chủng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000321
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000321: terms: [''tiền tuyến'',
    ''thông báo'', ''tân binh'']: pronouns_and_address: Câu 1 trần thuật ngôi thứ
    ba quy chiếu Tanya bằng `nó` (`DEC-P01-001`); câu 2 lược đại từ ngôi thứ hai phiếm
    chỉ và quy chiếu tân binh bằng `họ`.: pov_and_voice: Trần thuật hạn tri chuyển
    sang câu nhận định nội tâm ngán ngẩm của một sĩ quan tiền tuyến.: modality_and_logic:
    Bảo toàn quan hệ điều kiện – hệ quả tất yếu: tỷ lệ thương vong đương nhiên sẽ
    cao như vậy nếu đưa tân binh chưa đủ huấn luyện và kinh nghiệm ra trận.: emphasis:
    Ghi nhận tại finding `m3`: câu 2 tương ứng `<html:em>` trong nguồn, có thể bổ
    sung `*...*` ở bước polish.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000322
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000322: terms: [''hành quân đội
    hình'', ''chiến hào'', ''chiến tranh chiến hào'']: pronouns_and_address: Tanya
    xưng `tôi`, quy chiếu đám tân binh là `họ`.: pov_and_voice: Giọng góp ý thẳng
    thắn, sắc sảo của sĩ quan chỉ huy thực chiến trước cấp trên.: modality_and_logic:
    Bảo toàn đầy đủ 3 ý kiến đề xuất của Tanya: chỉ ra nguyên nhân là huấn luyện chưa
    đủ và đào tạo bị rút ngắn; đề nghị dạy cách nằm trong chiến hào thay vì duyệt
    đội ngũ; và gợi ý cho tân binh nếm trải phần khắc nghiệt nhất của chiến tranh
    chiến hào trong điều kiện giảm thiểu thương vong.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000323
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000323: terms: [''súng máy'']:
    pronouns_and_address: Vị đại tá dùng `ta` (phía Quân đội Đế quốc) và gọi tân binh
    là `Họ` / `họ`.: pov_and_voice: Giọng suy tư, băn khoăn của sĩ quan tham mưu khi
    nghĩ tới ranh giới giữa huấn luyện thực tế và an toàn sinh mạng.: modality_and_logic:
    Bảo toàn sự ngập ngừng qua dấu chấm lửng và thế lưỡng nan: thừa nhận tân binh
    còn lâu mới dùng được việc, nhưng cũng không thể đem họ ra dựng trước họng súng
    máy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000324
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000324: terms: [''đại tá'', ''Tanya'',
    ''tuyến đầu xa nhất'', ''Trung úy Serebryakov'']: pronouns_and_address: Trần thuật
    hạn tri dùng `Tanya` / `Nó` / `nó` (`DEC-P01-001`), `vị đại tá có vai vế ấy` /
    `Đại tá` và `Trung úy Serebryakov`.: pov_and_voice: Trần thuật hạn tri bám sát
    sự lúng túng và suy luận thực tế của Tanya.: modality_and_logic: Bảo toàn mạch
    nguyên nhân – kết quả giải thích vị cà phê tệ hại: ở tuyến đầu xa nhất không thể
    tiếp đãi chu đáo; dù Tanya đã nghiêm lệnh cho Trung úy Serebryakov pha tách cà
    phê ngon nhất có thể, nhưng hẳn do thiếu nhiên liệu để đun sôi khử cặn vôi nên
    cà phê có vị tạp chất rất khó chịu.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000325
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000325: terms: []: pronouns_and_address:
    Tanya gọi vị đại tá là `Ngài` kèm kính ngữ `ạ`.: pov_and_voice: Giọng hỏi thăm
    dè dặt, lễ phép của sĩ quan cấp dưới với khách cấp trên.: modality_and_logic:
    Bảo toàn dấu chấm lửng mở đầu và câu hỏi nghi vấn phủ định lịch sự về tách cà
    phê.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000326
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000326: terms: [''tiền tuyến'']:
    pronouns_and_address: Trần thuật hạn tri quy chiếu Tanya bằng `nó` (`DEC-P01-001`)
    và vị đại tá bằng `ông`.: pov_and_voice: Trần thuật hạn tri làm rõ dụng ý tinh
    tế của Tanya đằng sau câu hỏi xã giao.: modality_and_logic: Giữ đúng liên từ chuyển
    ý (`Dẫu vậy`) và hàm ý của Tanya: nhân tách cà phê dở để ngầm cho vị đại tá thấy
    thực tế khắc nghiệt ở tiền tuyến.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000327
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000327: terms: [''tiền tuyến'',
    ''phòng ăn'', ''Bộ Tổng tham mưu trung ương'']: pronouns_and_address: Vị đại tá
    xưng `Tôi` / `tôi`, quy chiếu tách cà phê bằng `thứ này` / `Nó`.: pov_and_voice:
    Giọng than thở thẳng thắn pha chút hài hước khô khan của vị sĩ quan tham mưu.:
    modality_and_logic: Bảo toàn mệnh đề rào đón (`Tôi không có ý phàn nàn về điều
    kiện ngoài tiền tuyến, nhưng…`), lời chê trực diện và phép liên tưởng hài hước
    với phòng ăn ở Bộ Tổng tham mưu trung ương.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000328
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000328: terms: [''tuyến đầu'',
    ''Tanya'', ''tiền tuyến'', ''huấn luyện cấp tốc'', ''tân binh'']: pronouns_and_address:
    Trong lời thoại Tanya quy chiếu những người ở Bộ Tổng tham mưu bằng `họ`; phần
    trần thuật dùng tên riêng `Tanya` và quy chiếu tân binh bằng `họ`.: pov_and_voice:
    Lời lẩm bẩm pha nét bất lực của Tanya nối tiếp bằng suy ngẫm về khoảng cách giữa
    đời sống dân sự và tiền tuyến.: modality_and_logic: Bảo toàn chuỗi liên tưởng
    từ hương vị cà phê biến chất ở tuyến đầu sang sự cách biệt hoàn toàn với đời sống
    dân thường, dẫn tới kết luận rằng không dễ để tân binh chỉ qua huấn luyện cấp
    tốc thích nghi ngay được.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000329
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000329: terms: [''hậu phương'']:
    pronouns_and_address: Vị đại tá gọi Tanya là `cô` (`Ý cô là...`) và quy chiếu
    tân binh là `họ`.: pov_and_voice: Giọng hỏi lại để xác nhận ý tưởng của vị đại
    tá.: modality_and_logic: Bảo toàn câu hỏi xác nhận việc cho tân binh nếm trải
    trải nghiệm này ở hậu phương (mắt xích dẫn tới sự hiểu lầm giao việc ở các đoạn
    sau).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000330
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000330: terms: [''chiến hào'',
    ''đồng đội'']: pronouns_and_address: Lời thoại của Tanya quy chiếu đám tân binh
    bằng `họ` và những kẻ thích làm anh hùng bằng `Lũ ngốc`.: pov_and_voice: Giọng
    phân tích thực tế, gay gắt của người chỉ huy chiến trường.: modality_and_logic:
    Bảo toàn mục đích đập tan ảo tưởng về chiến tranh và cấu trúc tương quan `không
    chỉ giết chính mình mà còn giết cả đồng đội` theo đúng quy tắc trong `canon/style-guide.md`.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000331
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000331: terms: [''Tân binh'', ''chiến
    hào'', ''adrenaline'', ''xung phong vô ích'']: pronouns_and_address: Độc thoại
    nội tâm của Tanya gọi đám tân binh thích thể hiện là `lũ ngốc` / `chúng`, và gọi
    cá nhân một tên liều lĩnh là `một đứa` / `nó`.: pov_and_voice: Độc thoại nội tâm
    bực dọc, khinh miệt những hành động anh hùng rơm gây họa cho tập thể.: modality_and_logic:
    Bảo toàn phép đối lập giữa mức thiệt hại tối thiểu (nếu một đứa bị adrenaline
    cuốn đi mà liều lĩnh xung phong một mình thì chỉ hại mình nó) với thực tế đáng
    giận là chúng thường lôi kéo cả người khác chết theo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000332
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000332: terms: [''hiện tượng sinh
    lý'', ''chiến hào'', ''són tiểu, són phân'', ''ổ dịch'']: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `mình` theo đúng `DEC-P01-001`, lược đại từ ngôi
    thứ hai phiếm chỉ và quy chiếu đám tân binh bằng `họ`.: pov_and_voice: Độc thoại
    nội tâm thực tế, chán ngán trước điều kiện vệ sinh tồi tệ nơi chiến hào.: modality_and_logic:
