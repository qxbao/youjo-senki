    nội tâm của Tanya tự quy chiếu bằng "mình" (DEC-P01-001, nối tiếp cuối b13); đại
    từ "nó" quy chiếu chiếc tàu ngầm'']: pov_and_logic: [{''Giữ nguyên mối lo chiến
    thuật'': ''chiếc tàu ngầm có thể lặn hai ngày dưới nước để thoát đi, và khi không
    có sonar thì nếu thả nó đi bây giờ sẽ gần như không thể tìm lại được''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000080
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000080: names_and_ranks: []: pronouns_and_address:
    [''Độc thoại nội tâm của Tanya tự quy chiếu bằng "mình" (DEC-P01-001)'']: pov_and_logic:
    [''Giữ nguyên hai câu hỏi cảm thán bức bối vì bị dồn vào chân tường'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000081
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000081: names_and_ranks: [''Tanya
    -> Tanya'', ''radio message -> bức điện vô tuyến'', ''Entente Alliance ship ->
    tàu của Liên minh Entente'', ''base -> căn cứ'']: pronouns_and_address: [''Giữ
    sự kết hợp nguyên bản giữa tên riêng "Tanya" và đại từ tập thể ngôi thứ nhất "chúng
    tôi" khi hồi tưởng chặng bay về căn cứ'']: pov_and_logic: [{''Giữ việc mở đoạn
    hồi tưởng giải thích căn nguyên đẩy Tanya vào tình thế tiến thoái lưỡng nan hiện
    tại'': ''bức điện vô tuyến nhận được trên đường về căn cứ sau trận giao chiến
    với tàu của Liên minh Entente (`vol02-ch04-b14-entente-alliance`)''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000082
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000082: names_and_ranks: [''Commander
    -> Chỉ huy'', ''suspicious boat -> chiếc thuyền khả nghi'', ''territorial waters
    -> lãnh hải'', ''two o’clock -> hướng hai giờ'']: pronouns_and_address: [''Báo
    cáo của thuộc cấp gọi Tanya là "Chỉ huy" và dùng "chúng ta" cho phía Đế quốc'']:
    pov_and_logic: [{''Giữ đầy đủ nội dung báo cáo khẩn'': ''phát hiện một chiếc thuyền
    khả nghi đang tắt đèn chạy trong lãnh hải ở hướng hai giờ''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000083
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000083: names_and_ranks: [''base
    -> căn cứ'', ''Entente Alliance -> Liên minh Entente'']: pronouns_and_address:
    [''Tự thuật hồi tưởng dùng "Tôi" cho cá nhân và "chúng tôi" cho đơn vị'']: pov_and_logic:
    [{''Giữ mạch hồi tưởng'': ''vốn không mong tìm thấy gì nhưng vì hễ bay là được
    trả lương nên đã bay xa khỏi căn cứ và rốt cuộc vướng vào trận giao chiến với
    Liên minh Entente''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000084
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000084: names_and_ranks: [''Tanya
    -> Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng
    tên riêng "Tanya" và đại từ "nó" theo DEC-P01-001 và `vol02-ch04-b14-tanya-pronoun`'']:
    pov_and_logic: [''Giữ thời điểm nhận tin báo đúng lúc Tanya vừa bắt đầu càu nhàu
    rằng nếu không được sưởi ấm bên lò sưởi cùng một tách cà phê nóng thì nó sẽ không
    thể trụ tiếp nổi'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000085
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000085: names_and_ranks: [''suspicious
    boat -> chiếc thuyền khả nghi'']: pronouns_and_address: [''Quy chiếu những người
    phát hiện mục tiêu bằng "mấy anh chàng cần mẫn nào đó" và chiếc thuyền bằng "nó"'']:
    pov_and_logic: [''Giữ thông tin báo cáo về chiếc thuyền khả nghi vừa gửi tới và
    nhận xét pha chút mỉa mai rằng mấy người cần mẫn nào đó đã tìm ra nó'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000086
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000086: names_and_ranks: []: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "Nó" theo DEC-P01-001 và `vol02-ch04-b14-tanya-pronoun`'']:
    pov_and_logic: [''Giữ câu hỏi nội tâm mỉa mai về chuyện làm nhiều hơn mức lương
    được trả, thái độ vừa khâm phục vừa khó chịu khi nghiêng đầu, và tiếng thở dài
    bực bội vì phải làm thêm giờ không có tiền phụ cấp để xử lý vụ này'']: emphasis:
    [''Giữ đúng phạm vi nhấn mạnh Markdown `*Ai lại làm nhiều hơn mức được trả công
    chứ?*` ở câu mở đầu theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000087
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000087: names_and_ranks: [''battalion
    -> Tiểu đoàn'']: pronouns_and_address: [''Tự thuật hồi tưởng dùng "tôi" / "Tôi"
    và "chúng tôi"'']: pov_and_logic: [{''Giữ ba vế cân nhắc'': ''tiểu đoàn đã khá
    mệt sau trận đánh bất ngờ vừa rồi, bản thân không thể tưởng tượng nổi việc muốn
    chủ động tham chiến, nhưng đơn vị cũng chưa tổn thất nặng đến mức phải tránh giao
    chiến hoàn toàn''}]: emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown `*chủ động*`
    theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000088
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000088: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "nó" quy chiếu chiếc thuyền khả nghi số ít'']: pov_and_logic: [''Giữ
    bản sửa M1 đã nghiệm thu ("“Dù sao cũng không thể làm ngơ. Hô gọi nó đi.”"), dịch
    đúng hành động hô gọi/yêu cầu nhận dạng ("challenge") và dùng đại từ số ít cho
    một con tàu'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000089
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000089: names_and_ranks: [''battalion
    -> tiểu đoàn'', ''base -> căn cứ'', ''Tanya -> Tanya'', ''suspicious boat -> chiếc
    thuyền khả nghi'']: pronouns_and_address: [''Câu đầu tự thuật ngôi thứ nhất dùng
    "tôi" và "chúng tôi"; câu thứ hai chuyển sang trần thuật ngôi thứ ba dùng "Tanya"
    và đại từ sở hữu "của nó" theo DEC-P01-001 (`vol02-ch04-b14-tanya-pronoun`)'']:
    pov_and_logic: [''Bảo toàn sự chuyển ngôi giữa hai câu trong cùng đoạn, lý do
    thuận theo vì là lực lượng gần nhất dù đang trên đường về căn cứ, cấu trúc lặp
    chữ có chủ ý của nguồn ("khu vực được báo cáo—đúng là khu vực đã được báo cáo")
    và việc phát hiện chiếc thuyền khả nghi'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000090
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000090: names_and_ranks: [''transport
    ships -> tàu vận tải'', ''nationality -> quốc tịch'']: pronouns_and_address: [''Khẩu
    lệnh của Tanya dùng "ta" cho phía Đế quốc'']: pov_and_logic: [''Giữ câu hỏi phỏng
    đoán có phải tàu vận tải phe mình không và lệnh kiểm tra quốc tịch'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000091
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000091: names_and_ranks: [''cargo-passenger
    ship -> tàu chở hàng kiêm chở khách'', ''Commonwealth -> Khối Thịnh vượng chung'',
    ''Lytol -> *Lytol*'']: pronouns_and_address: []: pov_and_logic: [''Giữ thuật ngữ
    tạm "tàu chở hàng kiêm chở khách" (`vol02-ch04-b14-cargo-passenger-ship`), chính
    thể "Khối Thịnh vượng chung" (`vol02-ch04-b14-commonwealth`) và tên riêng con
    tàu'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown `*Lytol*` cho tên tàu
    theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000092
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000092: names_and_ranks: []: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "nó" theo DEC-P01-001 (`vol02-ch04-b14-tanya-pronoun`)'']:
    pov_and_logic: [''Giữ nhận định khi gọi và nhận được phản hồi thì tình hình lại
    càng đáng lo ngại hơn'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000093
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000093: names_and_ranks: [''Commonwealth
    -> Khối Thịnh vượng chung'', ''cargo-passenger ship -> tàu chở hàng kiêm chở khách'']:
    pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "nó" theo
    DEC-P01-001 (`vol02-ch04-b14-tanya-pronoun`)'']: pov_and_logic: [{''Giữ hai vế
    đối lập'': ''việc một tàu chở hàng kiêm chở khách của Khối Thịnh vượng chung có
    mặt ở đó không có gì lạ, nhưng không vì thế mà Tanya có thể cứ thế cho qua''}]:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000094: names_and_ranks: []: pronouns_and_address:
    [''Khẩu lệnh của Tanya quy chiếu thủy thủ đoàn tàu *Lytol* bằng "họ" và đơn vị
    mình bằng "chúng ta"'']: pov_and_logic: [''Giữ mệnh lệnh thông báo cho phía tàu
    kia biết đơn vị sẽ lên tàu kiểm tra'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000095: names_and_ranks: [''Commander
    (inferred neutral role address) -> Chỉ huy'']: pronouns_and_address: [''Thuộc
    cấp hỏi lại Tanya bằng danh xưng trung tính "Chỉ huy" (theo `coordinator_proposals.neutral_address`)
    và dùng "chúng ta" cho đơn vị'']: pov_and_logic: [''Giữ câu hỏi xác nhận lại quyết
    định và mối lo ngại nếu tốn quá nhiều thời gian sẽ ảnh hưởng tới giờ quay về của
    đơn vị'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000096: names_and_ranks: [''countries
    at war -> các quốc gia có chiến tranh'']: pronouns_and_address: []: pov_and_logic:
    [''Giữ bản sửa M1 đã nghiệm thu ("“Đã hô gọi rồi thì giờ không thể làm ngơ được.
    Con tàu đang ở vùng biển giữa các quốc gia có chiến tranh.”"), bảo toàn đúng nghĩa
    "challenged" mà không tự thêm chi tiết lệnh dừng tàu ở bước này'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000097: names_and_ranks: [''nationality
    -> Quốc tịch'']: pronouns_and_address: []: pov_and_logic: [''Giữ nhận định quốc
    tịch của con tàu quá rắc rối để làm ngơ và sự phiền phức kéo theo'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000098: names_and_ranks: [''neutral
    countries -> các nước trung lập'', ''territorial waters -> lãnh hải'', ''country
    at war -> một quốc gia đang có chiến tranh'']: pronouns_and_address: [''Tự thuật
    dùng "chúng tôi" cho phía Đế quốc/đơn vị và "tôi" cho cá nhân chỉ huy'']: pov_and_logic:
    [{''Giữ trọn lập luận pháp lý hàng hải thời chiến'': ''tàu nước trung lập có quyền
    tự do đi lại, nhưng phía tham chiến có quyền lên tàu khám xét trong lãnh hải của
    quốc gia đang có chiến tranh; nếu không kiểm tra con tàu này thì Tanya sẽ phải
    giải trình một lý do chính đáng''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000099: names_and_ranks: []: pronouns_and_address:
    [''Độc thoại nội tâm của Tanya tự quy chiếu bằng "Mình" / "mình" theo DEC-P01-001'']:
    pov_and_logic: [''Giữ sự phân biệt hài hước đặc trưng trong tính cách Tanya giữa
    việc "muốn làm việc cho hiệu quả" và thực tâm "đâu phải mình muốn làm việc", cùng
    dự cảm bi quan rằng chuyện này chẳng đời nào kết thúc êm đẹp'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000100: names_and_ranks: [''Lytol
    -> *Lytol*'', ''Imperial Army General Staff’s 203rd Aerial Mage Battalion -> Tiểu
    đoàn Pháp sư Không quân 203 thuộc Bộ Tổng tham mưu Lục quân Đế quốc'']: pronouns_and_address:
    [''Thông điệp vô tuyến chính thức tự xưng "Chúng tôi" (đơn vị) và "Tôi" (khi nhắc
    lại mệnh lệnh), gọi phía tàu *Lytol* trung tính là "các vị" (theo `coordinator_proposals.neutral_address`)'']:
    pov_and_logic: [''Giữ đầy đủ phiên hiệu đơn vị (`vol02-ch04-b14-aerial-mage-battalion`),
    yêu cầu chấp hành kiểm tra và mệnh lệnh lặp lại hai lần buộc tắt động cơ ngay
    lập tức'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown `*Lytol*` theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000101: names_and_ranks: [''Lytol
    -> *Lytol*'', ''neutral country -> một quốc gia trung lập'', ''Commonwealth ->
    Khối Thịnh vượng chung'']: pronouns_and_address: [''Phía tàu *Lytol* tự xưng "Chúng
    tôi" / "chúng tôi" và đại từ phản thân "mình"'']: pov_and_logic: [{''Giữ phản
    hồi từ chối của *Lytol*'': ''viện dẫn tư cách tàu của một quốc gia trung lập thuộc
    Khối Thịnh vượng chung để cho rằng không có nghĩa vụ phải chấp hành''}]: emphasis:
    [''Giữ đúng phạm vi nhấn mạnh Markdown `*Lytol*` theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000102: names_and_ranks: [''Lytol
    -> *Lytol*'', ''Imperial Army -> Lục quân Đế quốc'', ''military personnel -> quân
    nhân'']: pronouns_and_address: [''Liên lạc vô tuyến xưng danh "Lục quân Đế quốc"
    và lặp danh từ "tàu" ở câu hỏi'']: pov_and_logic: [{''Giữ hai câu hỏi chất vấn
    pháp lý liên tiếp'': ''trên tàu có chở quân nhân nào không, hoặc có đang hoạt
    động theo mệnh lệnh của quân nhân nào không''}]: emphasis: [''Giữ đúng phạm vi
    nhấn mạnh Markdown `*Lytol*` theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000103: names_and_ranks: [''Lytol
    -> *Lytol*'', ''Imperial Army -> Lục quân Đế quốc'']: pronouns_and_address: [''Phía
    *Lytol* tự xưng "Chúng tôi"'']: pov_and_logic: [''Giữ câu trả lời từ chối nghĩa
    vụ trả lời các câu hỏi đó của *Lytol*'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh
    Markdown `*Lytol*` theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000104: names_and_ranks: [''Imperial
    Army -> Lục quân Đế quốc'', ''roger -> đã rõ'', ''Lytol -> *Lytol*'', ''neutral
    country’s warship -> một tàu chiến thuộc quốc gia trung lập'', ''hostile action
    -> hành động thù địch'', ''hostile nation’s vessel -> tàu của một quốc gia thù
    địch'']: pronouns_and_address: [''Phía Lục quân Đế quốc tự xưng "chúng tôi" /
    "Chúng tôi" và "Tôi" (khi nhắc lại cảnh báo), gọi phía *Lytol* trung tính là "các
    vị" (theo `coordinator_proposals.neutral_address`)'']: pov_and_logic: [{''Giữ
    nguyên lập luận pháp lý và tối hậu thư cảnh báo hai lần theo đúng văn bản nguồn'':
    ''từ chối trả lời đồng nghĩa không được công nhận quyền miễn bị khám xét của tàu
    chiến thuộc quốc gia trung lập (bảo toàn nguyên trạng cách diễn đạt "warship"
