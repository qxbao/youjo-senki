choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000418
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000418: terms: [''chiến trường'',
    ''Thiếu tá von Degurechaff'']: pronouns_and_address: Dùng đại từ số nhiều `họ`
    cho Tiểu đoàn 203 tiếp nối cuối lô `b13`, và gọi Tanya bằng cấp bậc – họ `Thiếu
    tá von Degurechaff`.: pov_and_voice: Giọng trần thuật khép lại phân cảnh xuất
    kích của Tiểu đoàn 203 trước khi chuyển cảnh.: modality_and_logic: Bảo toàn sự
    chuyển tiếp thời gian nhanh (`Chẳng mấy chốc`) và kết quả đơn vị đã có mặt trên
    chiến trường mà Thiếu tá von Degurechaff dẫn tới theo đúng kế hoạch.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000419
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000419: terms: [''Đội trưởng Bravo'',
    ''Trung tâm Điều phối Tác chiến'', ''Named'']: pronouns_and_address: Trong báo
    cáo vô tuyến sau ngắt cảnh `space-break1`, người gọi xưng `Đội trưởng Bravo`,
    gọi đài chỉ huy là `Trung tâm Điều phối Tác chiến`, và tự xưng `Tôi`.: pov_and_voice:
    Giọng báo cáo tác chiến khẩn trương qua vô tuyến của trinh sát/đội trưởng Cộng
    hòa khi phát hiện mục tiêu đặc biệt.: modality_and_logic: Bảo toàn đủ 4 câu: gọi
    đầu mối chỉ huy -> thông báo phát hiện `một Named` -> báo đang gửi dữ liệu ngay
    -> yêu cầu xác nhận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000420
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000420: terms: [''Đế quốc'', ''tiểu
    đoàn pháp sư'']: pronouns_and_address: Quy chiếu phía Đế quốc bằng danh từ `Đế
    quốc` ở câu 1 và đại từ `họ` ở câu 2.: pov_and_voice: Giọng trần thuật bám điểm
    nhìn của chỉ huy Cộng hòa, vừa ghi nhận tính chính xác của dự đoán vừa kinh ngạc
    trước tốc độ điều quân của địch.: modality_and_logic: Bảo toàn đủ 2 câu: phản
    ứng của Đế quốc nhanh theo đúng nghĩa đen như dự đoán -> cảm thán việc điều cả
    một tiểu đoàn pháp sư tới chỉ trong vài giờ.: emphasis: Bảo toàn chính xác phạm
    vi nhấn mạnh theo `DEC-P01-002`: giữ câu đầu ở chữ thường, bọc dấu `*...*` quanh
    toàn bộ câu cảm thán thứ hai (`*Chỉ trong vài giờ, họ đã điều đến một tiểu đoàn
    pháp sư!*`) tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000421
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000421: terms: [''đổ bộ đường không'']:
    pronouns_and_address: Độc thoại nội tâm của Vianto quy chiếu phía Đế quốc bằng
    `họ` và lược tự nhiên đại từ ngôi thứ nhất ở câu tự hỏi.: pov_and_voice: Giọng
    độc thoại nội tâm pha chút tự giễu và nhẹ nhõm của Vianto sau cuộc nhảy dù/đổ
    bộ đường không đầy vất vả.: modality_and_logic: Bảo toàn đủ 2 câu: nhận định có
    vẻ đối phương đang xem chuyện này rất nghiêm túc -> câu hỏi phỏng đoán vậy ra
    nỗi khổ khi đổ bộ đường không cũng đáng công.: emphasis: Bảo toàn chính xác phạm
    vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ 2 câu của đoạn
    tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000422
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000422: terms: [''Trung tá Vianto'',
    ''chỉ huy'', ''Đại đội Pháp sư số Hai'', ''lực lượng đặc nhiệm'', ''Cộng hòa'']:
    pronouns_and_address: Giới thiệu đầy đủ chức vụ – quân hàm `Trung tá Vianto, chỉ
    huy Đại đội Pháp sư số Hai thuộc lực lượng đặc nhiệm Cộng hòa`, sau đó quy chiếu
    Vianto trong trần thuật bằng `anh` kết hợp phản thân `mình`.: pov_and_voice: Giọng
    trần thuật ngôi thứ ba bám sát trạng thái tâm lý và thể chất của Trung tá Vianto
    sau khi hoàn thành bước đầu của chiến dịch.: modality_and_logic: Bảo toàn đủ 3
    câu: sự nhẹ nhõm phần nào khi thấy chiến dịch mà anh vốn chẳng mấy hào hứng cũng
    có ý nghĩa -> nhượng bộ dù đã lo lắng nhưng anh vẫn làm được -> cuối cùng cũng
    đủ bình tĩnh để liếc nhìn đôi tay cứng đờ đến phát bực của mình.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000423
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000423: terms: [''Cộng hòa'', ''Dacia'',
    ''Người Cộng hòa'', ''Liên minh Entente'', ''hạm đội'', ''cuộc đổ bộ'']: pronouns_and_address:
    Quy chiếu quốc gia và người dân/quân sự Cộng hòa bằng `Cộng hòa`, `Họ` / `họ`
    và `Người Cộng hòa`.: pov_and_voice: Giọng trần thuật khái quát bức tranh chiến
    lược bi đát của Cộng hòa qua lăng kính của Vianto.: modality_and_logic: Bảo toàn
    đủ 4 câu: tình thế khá ngặt nghèo của Cộng hòa -> kỳ vọng Dacia tham chiến nhưng
    lại phản tác dụng -> cảnh phải nghiến răng nhìn Liên minh Entente sụp đổ sau khi
    hạm đội cố ngăn cuộc đổ bộ nhưng không kịp -> cơn ác mộng đang dần bào mòn họ.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000424
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000424: terms: [''Cộng hòa'', ''Khối
    Thịnh vượng chung'', ''lợi ích quốc gia'', ''quyền lợi ở hải ngoại'']: pronouns_and_address:
    Lặp rõ danh xưng `Cộng hòa` và `Khối Thịnh vượng chung` kèm phản thân `chính mình`
    để tránh mơ hồ chủ thể giữa hai quốc gia.: pov_and_voice: Giọng phân tích chính
    trị – ngoại giao thực dụng và tỉnh táo.: modality_and_logic: Bảo toàn đủ 2 câu:
    liên lạc ngầm với Khối Thịnh vượng chung là bí mật ai cũng biết nhưng Khối Thịnh
    vượng chung hành động vì lợi ích quốc gia của chính mình -> điều kiện đổi lấy
    sự trợ giúp là Cộng hòa có nguy cơ mất toàn bộ quyền lợi ở hải ngoại.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000425
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000425: terms: [''cường quốc'',
    ''Cộng hòa'']: pronouns_and_address: Quy chiếu `Cộng hòa` kết hợp phản thân `mình`.:
    pov_and_voice: Giọng trần thuật giải thích động cơ chiến lược buộc Cộng hòa phải
    tự lực hành động.: modality_and_logic: Bảo toàn quan hệ nhân quả: từ nhận thức
    về mức độ nghiêm trọng của nguy cơ mất tiếng nói với tư cách cường quốc -> Cộng
    hòa thấy cần tự giải quyết tình hình hết mức có thể.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000426
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000426: terms: [''Khối Thịnh vượng
    chung'', ''Vianto'', ''cuộc đột kích hậu phương'']: pronouns_and_address: Câu
    mệnh lệnh/chỉ đạo nội tâm ở đầu đoạn dùng `Chúng ta` cho phía Cộng hòa và `chúng`
    cho Đế quốc; câu trần thuật dùng tên `Vianto` và đại từ `anh`.: pov_and_voice:
    Giọng trần thuật đan xen mục tiêu chính trị của thượng tầng với đánh giá chủ quan
    của Vianto coi chiến dịch này là điên rồ.: modality_and_logic: Bảo toàn đủ 2 câu:
    yêu cầu đẩy lùi địch xa hết mức có thể trước khi Khối Thịnh vượng chung tham chiến
    -> chính vì lý do chính trị ấy mà Vianto đang thực hiện cuộc đột kích hậu phương
    điên rồ theo cách nhìn của anh.: emphasis: Bảo toàn chính xác phạm vi nhấn mạnh
    theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu đầu (`*Chúng ta phải đẩy lùi
    chúng xa hết mức có thể trước khi Khối Thịnh vượng chung tham chiến.*`) tương
    ứng thẻ `<html:em>`, giữ câu thứ hai ở chữ thường.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000427
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000427: terms: [''raison d’état'']:
    pronouns_and_address: Độc thoại nội tâm của Vianto lược đại từ ngôi thứ nhất ở
    đầu câu và dùng `họ` để chỉ giới lãnh đạo đã phát động chiến dịch.: pov_and_voice:
    Giọng độc thoại nội tâm bất mãn, châm biếm của Vianto trước lý lẽ chính trị của
    cấp trên.: modality_and_logic: Bảo toàn sự ngán ngẩm không thể tin nổi khi cấp
    trên lôi cái gọi là `raison d’état` ra làm con bài.: emphasis: Bảo toàn chính
    xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ câu độc
    thoại nội tâm tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000428
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000428: terms: [''Ác quỷ sông Rhine'']:
    pronouns_and_address: Lời thoại dùng `Họ` để chỉ phía Đế quốc.: pov_and_voice:
    Giọng sững sờ pha lẫn nghiêm trọng khi xác nhận danh tính mục tiêu từ dữ liệu
    truyền về.: modality_and_logic: Bảo toàn đủ 3 nhịp trong câu thoại: xác nhận dữ
    liệu -> câu hỏi ngạc nhiên `Ác quỷ sông Rhine ư?` -> nhận định đối phương đã tung
    quân bài chủ lực ra.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000429
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000429: terms: [''raison d’état'',
    ''Named'', ''mặt trận Rhine'', ''các tuyến chính'']: pronouns_and_address: Chuyển
    thành ngữ có đại từ ngôi thứ hai phiếm chỉ ở câu 1 sang kết cấu động ngữ khái
    quát không đại từ (`tính chuyện hưởng thành quả từ khi chưa đạt được`); câu 2
    dùng `Họ` cho phía Cộng hòa.: pov_and_voice: Giọng trần thuật nhìn nhận hiệu quả
    thực tế bất ngờ của canh bạc chiến lược.: modality_and_logic: Bảo toàn đủ 2 câu:
    nhượng bộ rằng khi nói đến `raison d’état` thì việc tính hưởng thành quả từ khi
    chưa đạt được xem ra lại có tác dụng -> kết quả họ đã dụ được `Named` chưa rõ
    danh tính mà mọi binh sĩ trên mặt trận Rhine đều biết đến rời khỏi các tuyến chính.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000430
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000430: terms: [''Named'', ''đơn
    vị tinh nhuệ'', ''tác chiến có tính cơ động cao'', ''bắn tầm xa'', ''đơn vị cơ
    động'', ''Lục quân Đế quốc'']: pronouns_and_address: Theo đúng `chapter6_b14_review_recommendations`,
    dùng danh ngữ `Named ấy cùng đơn vị tinh nhuệ dưới quyền` (tránh phát sinh đại
    từ nhân xưng nữ trong trần thuật) và quy chiếu toàn đơn vị bằng `họ`.: pov_and_voice:
    Giọng đánh giá chiến thuật của Vianto về năng lực đáng gờm và giá trị mục tiêu
    của đơn vị Tanya.: modality_and_logic: Bảo toàn đủ 2 câu: cả Named ấy lẫn đơn
    vị tinh nhuệ dưới quyền đều giỏi tác chiến có tính cơ động cao và bắn tầm xa ->
    bản chất là một toán quân phiền toái giữ vai trò đơn vị cơ động của Lục quân Đế
    quốc phòng thủ vùng lãnh thổ rộng lớn, nên loại họ khỏi cuộc chiến là ưu tiên
    hàng đầu.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000431
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000431: terms: [''phòng thủ cơ
    động'', ''tiền tuyến'', ''tiểu đoàn pháp sư'']: pronouns_and_address: Quy chiếu
    đơn vị của Tanya bằng `Đơn vị này` và `họ`.: pov_and_voice: Giọng phân tích giá
    trị chiến dịch của việc kéo đơn vị cơ động tinh nhuệ này khỏi mặt trận chính.:
    modality_and_logic: Bảo toàn đủ 2 câu: năng lực thậm chí còn có thể phòng thủ
    cơ động -> so sánh việc dụ họ rời tiền tuyến có ý nghĩa lớn hơn kéo bất kỳ tiểu
    đoàn pháp sư nào khác đi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000432
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000432: terms: [''Named lão luyện'',
    ''tiền tuyến'', ''chiến trường'']: pronouns_and_address: Tường minh hóa đối tượng
    bị đánh vào điểm yếu thành `của phía Cộng hòa` để tránh nhập nhằng với đại từ
    chỉ đơn vị Đế quốc ở đầu câu.: pov_and_voice: Giọng tổng kết tầm quan trọng chiến
    lược của đòn nghi binh/thu hút.: modality_and_logic: Bảo toàn quan hệ nhân quả
    và định lượng: việc kéo đơn vị này cùng một Named lão luyện có khả năng đánh vào
    điểm yếu của phía Cộng hòa ra khỏi tiền tuyến tạo ra tác động quan trọng trên
    chiến trường không thể đo đếm bằng con số.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000433
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000433: terms: []: pronouns_and_address:
    Lời thoại của Vianto dùng `họ` cho đơn vị địch và tự xưng `Tôi`.: pov_and_voice:
    Giọng thở dài thực tế của người chỉ huy trực tiếp phải đối đầu với con quái vật
    vừa dụ tới.: modality_and_logic: Bảo toàn sự chuyển ý (`Dù vậy…`), nhận định họ
    sẽ không dễ đối phó và tâm trạng chẳng mong chờ trận đánh này chút nào.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000434
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000434: terms: [''Arene'', ''sư
    đoàn'', ''quân mặt đất'', ''tiền tuyến'', ''lực lượng dự bị'', ''Bộ Tổng tham
    mưu Đế quốc'']: pronouns_and_address: Trần thuật dùng `họ` cho Bộ Tổng tham mưu
    / phía Đế quốc; câu ước muốn nội tâm cuối đoạn dùng `họ` và `chúng ta`.: pov_and_voice:
    Giọng tính toán quy mô binh lực cần thiết để tái chiếm đô thị và sự tiếc nuối
    trong thâm tâm Vianto khi địch không mắc sai lầm đưa quân nhỏ giọt.: modality_and_logic:
    Bảo toàn đủ 3 câu: điều kiện muốn chiếm thành phố cỡ Arene cần vài sư đoàn quân
    mặt đất -> quyền lựa chọn điều quân từ tiền tuyến hay huy động dự bị thuộc Bộ
    Tổng tham mưu Đế quốc nhưng xem ra họ đã dốc toàn lực -> câu ước giả định trái
    thực tế giá mà họ đánh giá thấp chúng ta rồi đưa quân đến từng đợt nhỏ.: emphasis:
    Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ 2 câu đầu ở chữ thường,
    chỉ bọc dấu `*...*` quanh câu ước giả định thứ ba (`*Giá mà họ đánh giá thấp chúng
    ta rồi đưa quân đến từng đợt nhỏ.*`) tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000435
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000435: terms: [''đầu mối giao
    thông'', ''các tuyến tiếp tế'', ''Đế quốc'', ''viện binh địch'', ''tiền tuyến'',
    ''cuộc phản công'']: pronouns_and_address: Quy chiếu lực lượng của Vianto tại
    Arene bằng `Họ` (và lược chủ ngữ ở các mệnh đề điều kiện cùng chủ thể).: pov_and_voice:
    Giọng xác định mục tiêu cốt lõi của chiến dịch: cầm chân địch tại nút giao thông
    huyết mạch để tạo thời cơ cho tiền tuyến phản công.: modality_and_logic: Bảo toàn
    chuỗi điều kiện – hệ quả: nếu giữ được đầu mối giao thông này thì tuyến tiếp tế
    của Đế quốc sẽ cạn trong chưa đầy một tuần -> chỉ cần cản viện binh địch vài ngày
    là chắc chắn đạt kết quả -> hy vọng quân tiền tuyến mở được cuộc phản công lớn
    trong thời gian đó.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000436
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000436: terms: [''Đội trưởng Charlie'',
    ''Trung tâm Điều phối Tác chiến'', ''tiểu đoàn'']: pronouns_and_address: Trong
    thoại vô tuyến, `Đội trưởng Charlie` gọi `Trung tâm Điều phối Tác chiến` và dùng
    đại từ số nhiều không gộp `chúng tôi`.: pov_and_voice: Giọng hỏi lại đầy dè dặt
    của chỉ huy phân đội trước lệnh đấu súng tầm xa với tiểu đoàn của Ác quỷ sông
    Rhine.: modality_and_logic: Bảo toàn cuộc gọi vô tuyến và câu hỏi xác nhận mệnh
    lệnh giao chiến tầm xa với tiểu đoàn đó.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000437
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000437: terms: [''lực lượng đặc
    nhiệm tinh nhuệ'', ''Ác quỷ sông Rhine'']: pronouns_and_address: Không dùng đại
    từ nhân xưng.: pov_and_voice: Giọng trần thuật khách quan xác nhận sự chênh lệch
    về sở trường tác chiến tầm xa.: modality_and_logic: Bảo toàn mệnh đề nhượng bộ
    (`Ngay cả với một lực lượng đặc nhiệm tinh nhuệ`) và kết luận giao chiến từ xa
    với Ác quỷ sông Rhine cũng sẽ rất khó khăn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000438
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000438: terms: [''quân địch'']:
    pronouns_and_address: Quy chiếu phía Cộng hòa bằng `Họ`.: pov_and_voice: Giọng
    trần thuật làm rõ giới hạn mục tiêu ban đầu của đòn đánh tầm xa.: modality_and_logic:
    Bảo toàn mức độ hạn chế của dự tính ban đầu (`vốn chỉ dự tính có thể bào mòn quân
    địch đôi chút mà thôi`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000439
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000439: terms: [''Chiến dịch'',
    ''Giao chiến tầm xa'']: pronouns_and_address: Lời thoại chỉ huy từ Trung tâm Điều
    phối Tác chiến / Vianto quy chiếu quân địch bằng `chúng`.: pov_and_voice: Giọng
    ra lệnh điềm tĩnh, xác định rõ mục đích đánh lạc hướng và trì hoãn.: modality_and_logic:
    Bảo toàn đủ 3 câu: khẳng định chiến dịch giữ nguyên -> giải thích giao chiến tầm
    xa vốn chỉ nhằm đánh lạc hướng chúng -> mệnh lệnh tìm cách trì hoãn chúng.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000440
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000440: terms: [''giao chiến tầm
    xa'']: pronouns_and_address: Quy chiếu phía Cộng hòa bằng `Họ`.: pov_and_voice:
    Giọng trần thuật tiếp nối tâm thế sẵn sàng chấp nhận hiệu quả thấp ở giai đoạn
    bắn tầm xa.: modality_and_logic: Bảo toàn đủ 2 câu: điều kiện nếu không thành
    công cũng chẳng sao -> lý do vốn không đặt kỳ vọng cao vào giao chiến tầm xa nên
    không có gì phải lo.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000441
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000441: terms: [''loạt đạn bắn
    quấy nhiễu'', ''đội hình'']: pronouns_and_address: Độc thoại nội tâm của Vianto
    dùng `chúng` cho quân địch và `chúng ta` cho phe mình.: pov_and_voice: Giọng suy
    tính chiến thuật trong nội tâm Vianto: lấy việc tiêu hao thể lực, phá đội hình
    và câu giờ làm trọng tâm.: modality_and_logic: Bảo toàn đủ 4 câu: câu hỏi gợi
    ý một loạt đạn bắn quấy nhiễu -> 3 mục đích nối tiếp (buộc chúng né tránh, làm
    chúng mệt mỏi, phá vỡ đội hình) -> khẳng định điều cốt yếu là làm chậm chúng lại
    -> kết luận thời gian đứng về phía chúng ta.: emphasis: Bảo toàn chính xác phạm
    vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ 4 câu của đoạn
    tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000442
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000442: terms: []: pronouns_and_address:
    Khẩu lệnh đáp nhận đồng thanh không dùng đại từ.: pov_and_voice: Giọng đáp nhận
    mệnh lệnh dứt khoát từ các đội trưởng trên kênh vô tuyến.: modality_and_logic:
    Bảo toàn cặp dấu ngoặc kép lồng `““Rõ.””` biểu thị lời đáp đồng thanh của nhiều
    người.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000443
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000443: terms: [''cơ động'', ''kế
    hoạch'']: pronouns_and_address: Quy chiếu các phân đội pháp sư Cộng hòa bằng `Họ`.:
    pov_and_voice: Giọng trần thuật chuyển sang hành động tác chiến thực tế.: modality_and_logic:
    Bảo toàn hành động lập tức bắt đầu cơ động theo kế hoạch.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000444
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000444: terms: [''pháp sư'', ''nổ
    súng quấy nhiễu'']: pronouns_and_address: Dùng danh ngữ `Một số pháp sư`.: pov_and_voice:
    Giọng trần thuật mô tả đòn khai hỏa từ các vị trí phục kích trong đô thị.: modality_and_logic:
    Bảo toàn vị trí ẩn nấp trong các tòa nhà và hành động nổ súng quấy nhiễu.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000445
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000445: terms: [''Named'', ''bắn
    quấy nhiễu'']: pronouns_and_address: Quy chiếu pháp sư Cộng hòa bằng `họ` và phía
    địch bằng `đối phương`.: pov_and_voice: Giọng trần thuật phân tích thế lưỡng nan
    chiến thuật khi đối đầu với một Named.: modality_and_logic: Bảo toàn hai vế đối
    lập: những loạt đạn ấy khó có khả năng gây thiệt hại đáng kể -> nhưng mặt khác
    vì đối phương là một Named nên họ không thể đơn giản bỏ qua việc bắn quấy nhiễu.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000446
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000446: terms: [''bắn có kỷ luật'',
    ''Quân đội Cộng hòa'']: pronouns_and_address: Quy chiếu các pháp sư Cộng hòa bằng
    `họ` và đối phương bằng `địch`.: pov_and_voice: Giọng trần thuật nêu niềm tự hào
    về kỷ luật hỏa lực của Quân đội Cộng hòa.: modality_and_logic: Bảo toàn đủ 2 câu:
    bắn có kỷ luật vốn là sở trường của Quân đội Cộng hòa -> điều kiện nếu địch bay
    chậm thì họ có thể bắn trúng trực tiếp.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000447
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000447: terms: [''Pháp sư địch'',
    ''tản ra'', ''bắn tỉa'']: pronouns_and_address: Báo cáo tác chiến dùng `Pháp sư
    địch` / `Họ` cho đối phương và `của ta` cho phe mình.: pov_and_voice: Giọng báo
    cáo tình hình nhanh trên chiến trường.: modality_and_logic: Bảo toàn đủ 2 câu
    theo đúng `chapter6_b14_review_recommendations`: pháp sư địch đang tản ra (tách
    đội hình cơ động, không dịch thành tan vỡ) -> họ đang né đòn bắn tỉa của ta.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000448
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000448: terms: [''Vianto'']: pronouns_and_address:
    Trần thuật dùng `họ` cho pháp sư địch và tên riêng `Vianto`; câu nội tâm cuối
    đoạn dùng `chúng ta`.: pov_and_voice: Giọng trần thuật chuyển sang nỗi thất vọng
    thực tế trong nội tâm Vianto khi hỏa lực đón đầu bị đối phương hóa giải dễ dàng.:
    modality_and_logic: Bảo toàn đủ 3 câu: nhận định xem ra họ đang né các đòn tấn
    công -> thừa nhận đó là phản ứng tự nhiên nhưng Vianto đã hy vọng gây được ít
    nhiều thiệt hại -> câu nội tâm đánh giá thế này thì chúng ta chỉ gây được chút
    ít hoặc gần như chẳng gây được gì.: emphasis: Bảo toàn chính xác phạm vi nhấn
    mạnh theo `DEC-P01-002`: giữ 2 câu đầu ở chữ thường, chỉ bọc dấu `*...*` quanh
    câu nội tâm thứ ba (`*Thế này thì… chúng ta chỉ gây được chút ít, hoặc gần như
    chẳng gây được gì.*`) tương ứng thẻ `<html:em>`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000449
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000449: terms: [''tiểu đoàn'',
    ''tiền tuyến'']: pronouns_and_address: Lời thoại của Vianto dùng `họ` cho phía
    Đế quốc và tự xưng `tôi`.: pov_and_voice: Giọng lẩm bẩm kinh ngạc của Vianto trước
    sự quyết đoán lạnh lùng của Bộ Tổng tham mưu Đế quốc.: modality_and_logic: Bảo
    toàn đủ 2 câu: cảm thán việc họ tung cả một tiểu đoàn vào ngay lập tức -> nhận
    xét họ đưa ra quyết định chớp nhoáng bất chấp ảnh hưởng lên tiền tuyến sớm hơn
    tôi tưởng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000450
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000450: terms: [''Vianto'', ''đợt
    tấn công trực diện'', ''Đế quốc'', ''tiểu đoàn pháp sư tinh nhuệ'', ''lực lượng
    mặt đất'']: pronouns_and_address: Câu nội tâm đầu đoạn dùng `Họ` cho Đế quốc và
    `chúng ta` cho phía Cộng hòa; trần thuật dùng tên riêng `Vianto`, `họ` (cho lực
    lượng Cộng hòa ở câu 2), và `anh và thuộc hạ` kết hợp phản thân `mình`.: pov_and_voice:
    Giọng độc thoại nội tâm nối sang trần thuật khép lại lô `b14` bằng dự cảm nặng
    nề của Vianto về quy mô và tốc độ phản kích của quân mặt đất Đế quốc.: modality_and_logic:
    Bảo toàn đủ 3 câu và tuân thủ nghiêm ngặt `chapter6_b14_signoff_followup`: câu
    nội tâm về việc địch phản ứng còn nhanh hơn cả tin từng nghe nói -> kế hoạch bị
    đảo lộn khiến Vianto muốn giật tóc mình dù việc làm suy yếu đợt tấn công trực
    diện của địch là điều tốt -> điều kiện nếu Đế quốc không chút do dự điều một tiểu
    đoàn pháp sư tinh nhuệ đến thì anh và thuộc hạ phải sẵn sàng đón lực lượng mặt
    đất `đông hơn nhiều so với dự kiến` và `đến sớm hơn hẳn dự tính`.: emphasis: Bảo
    toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh
    câu độc thoại nội tâm đầu đoạn (`*Họ còn phản ứng nhanh hơn cả tin chúng ta nhận
    được, thật phiền phức.*`) tương ứng thẻ `<html:em>`, giữ 2 câu trần thuật tiếp
    theo ở chữ thường.'
  non_canon: true
