accepted_resolutions:
- {"id": "B18-F01", "severity": "moderate", "segment_id": "YS-LN02/Text/part0030.xhtml/p000582", "resolution": "Use “Xét về mặt thủ tục, có lẽ đó là một bước để có thể coi thường dân là dân quân.” Then “Dù sao, ngay khi không còn cần phân loại thường dân là người không tham chiến, Đế quốc đã bắt đầu tấn công thành phố không chút khoan nhượng.” Preserve “có lẽ”; add no legal basis, official decision or legality claim."}
- {"id": "B18-F02", "severity": "moderate", "segment_id": "YS-LN02/Text/part0030.xhtml/p000580", "resolution": "Use “Một xác chết vừa bị thiêu cháy thành than, mùi khét chưa bị mùi thối rữa che lấp. Không khí quánh dính vì protein, hôi thối khủng khiếp.” “Dính bết” is an alternative; do not explain biology."}
- {"id": "B18-F03", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000573", "resolution": "Italicize only “Điều tốt mình làm cho người khác rồi sẽ quay lại với mình”; keep lead-in and comment outside italics."}
- {"id": "B18-F04", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000582", "resolution": "Italicize only the middle speculative sentence from F01; leave the other two sentences unitalicized."}
- {"id": "B18-F05", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000567", "resolution": "Use “Ngay trước mắt mình là một lý do chính đáng tuyệt vời: bảo vệ đồng bào.” Alternative preserves “chính nghĩa” as the reviewer gives."}
- {"id": "B18-F06", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000570", "resolution": "Use “Ít nhất thì đó cũng hẳn là một lý do để biện minh.” Preserve self-reassurance; do not imply actual acquittal."}
- {"id": "B18-F07", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000574", "resolution": "Use “vì cô đã có kinh nghiệm” or “vì cô đã thạo việc”; preserve “khá hơn một chút” and risk of hesitation without adding biography."}
- {"id": "B18-F08", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000583", "resolution": "Use “Anh thấy lạ khi Thiếu tá von Degurechaff quan tâm đến người phía mình hơn kẻ địch...” Keep this as Grantz’s impression, let it fade, and retain “Có lẽ”; do not state Tanya’s motive as fact."}
- {"id": "B18-F09", "severity": "minor", "segment_id": "YS-LN02/Text/part0030.xhtml/p000556", "resolution": "Use “Có lẽ họ đã bị giết hoặc bị đám đông hành hình ngay khi cuộc nổi dậy bắt đầu.” Specify no method, perpetrator or extra certainty."}

