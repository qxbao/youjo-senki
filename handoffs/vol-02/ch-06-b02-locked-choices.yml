  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000060: terms: [''cuộc nổi dậy'',
    ''khu vực hậu phương'', ''Lục quân Đế quốc'', ''tiền tuyến'']: pronouns_and_address:
    Lược đại từ ngôi thứ hai phiếm chỉ trong mệnh đề điều kiện (`nếu xét rằng`).:
    pov_and_voice: Giọng phân tích nối mạch nhân quả địa chiến lược.: modality_and_logic:
    Bảo toàn quan hệ điều kiện – hệ quả: nếu xét thêm việc cuộc nổi dậy đã chia cắt
    các khu vực hậu phương của Lục quân Đế quốc ở phía tây khỏi tiền tuyến, thì phần
    còn lại rất dễ hiểu.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn
    bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000061: terms: [''Bộ Tổng tham
    mưu Lục quân Đế quốc'', ''đơn vị trấn áp'', ''Đế quốc'', ''phòng tuyến sông Rhine'',
    ''dân quân'', ''Quân đội Cộng hòa'', ''khu công nghiệp phía tây'']: pronouns_and_address:
    Quy chiếu phía Đế quốc / Bộ Tổng tham mưu bằng `họ`.: pov_and_voice: Giọng phân
    tích sâu sắc mối lo ngại chiến lược hàng đầu của Bộ Tổng tham mưu Đế quốc.: modality_and_logic:
    Bảo toàn đầy đủ hai câu: nỗi sợ lớn nhất của Bộ Tổng tham mưu Lục quân Đế quốc
    khi ấy là quân đội phía tây bị ghìm chân trước khi kịp gom đủ quân lập đơn vị
    trấn áp; và vì đại bộ phận lực lượng Đế quốc đang dồn ở các phòng tuyến sông Rhine,
    một cuộc tấn công của dân quân trong lúc quân chủ lực bị Quân đội Cộng hòa ghìm
    chân có thể khiến Đế quốc mất khu công nghiệp phía tây.: emphasis: Bảo toàn dấu
    nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>`
    theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000062: terms: [''vùng Arene-Roygen'',
    ''khu công nghiệp'', ''Arene'', ''tuyến đường sắt tiếp tế'']: pronouns_and_address:
    Quy chiếu phía Đế quốc bằng `họ`, Giáo sư Halbom tự xưng `Tôi`.: pov_and_voice:
    Giọng phân tích kịch bản thứ hai với nhịp ngập ngừng (`nhưng…`) làm nổi bật vị
    trí yết hầu giao thông của Arene.: modality_and_logic: Bảo toàn kịch bản thứ hai:
    ngay cả khi cuộc nổi dậy chỉ giới hạn trong vùng Arene-Roygen và khu công nghiệp
    được bảo vệ, việc Arene là thành phố lớn nằm ngay trên tuyến đường sắt tiếp tế
    vẫn đóng vai trò trọng yếu.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao quanh
    toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000063: terms: [''tuyến tiếp tế'']:
    pronouns_and_address: Giáo sư Halbom hướng tới người nghe bằng cụm chuyển tiếp
    `quý vị biết đấy`.: pov_and_voice: Giọng giải thích nguyên lý hậu cần cơ bản bằng
    ngôn từ gần gũi.: modality_and_logic: Bảo toàn câu điều kiện kết hợp nhượng bộ:
    nếu các tuyến tiếp tế bị gây sức ép thì quân đội dù thiện chiến đến đâu cũng không
    thể chiến đấu lâu dài.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn
    bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000064: terms: [''Đế quốc'', ''kịch
    bản tồi tệ nhất'']: pronouns_and_address: Không dùng đại từ nhân xưng.: pov_and_voice:
    Giọng đánh giá khách quan về tính hợp lý nội tại trong lối suy luận của phía Đế
    quốc.: modality_and_logic: Bảo toàn cả hai vế: nguy cơ kịch bản tồi tệ nhất xảy
    ra với Đế quốc là có thật, và ít nhất việc phía Đế quốc suy luận theo hướng đó
    cũng không phải điều bất ngờ.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao quanh
    toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000065: terms: [''phong trào chống
    Đế quốc'', ''Đế quốc'', ''chiến lược'']: pronouns_and_address: Lược đại từ gộp
    `We` bằng cấu trúc khách quan `Có thể thấy`.: pov_and_voice: Giọng tóm lược tác
