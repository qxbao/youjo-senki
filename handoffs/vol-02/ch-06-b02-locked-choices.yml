  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000059: terms: []: pronouns_and_address:
    Giáo sư Halbom tự xưng `tôi`.: pov_and_voice: Giọng nhận định cá nhân của chuyên
    gia lịch sử quân sự.: modality_and_logic: Bảo toàn cấu trúc phủ định kép / tình
    thái khả thể: vấn đề thực sự nằm ở chỗ không thể hoàn toàn bác bỏ khả năng ấy.:
    emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn
