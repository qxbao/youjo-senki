    pronouns_and_address: Dùng đại từ gộp `Ta` trong lời mời phân tích từng bước (`Ta
    hãy xét từng bước`).: pov_and_voice: Giọng giảng giải có hệ thống, bóc tách từng
    tiền đề chiến lược.: modality_and_logic: Bảo toàn bước phân tích thứ nhất: vùng
