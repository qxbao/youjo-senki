    định: cuộc nổi dậy của phong trào chống Đế quốc đã giáng một cú sốc lớn về mặt
    chiến lược cho Đế quốc.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn
    bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000066: terms: [''tuyến liên lạc'',
    ''hậu phương'']: pronouns_and_address: Giáo sư Halbom tự xưng nhấn mạnh `chính
    tôi` khi dẫn kinh nghiệm quân ngũ của bản thân.: pov_and_voice: Giọng khẳng định
    đanh thép dựa trên trải nghiệm thực tế từng phục vụ trong quân đội.: modality_and_logic:
    Bảo toàn sự nhấn mạnh mức độ: từ kinh nghiệm phục vụ trong quân ngũ, chính ông
    có thể khẳng định chỉ riêng ý nghĩ các tuyến liên lạc với hậu phương bị tê liệt
    thôi cũng đủ khiến bất cứ ai kinh hãi.: emphasis: Bảo toàn dấu nhấn mạnh `*...*`
    bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000067: terms: [''Lục quân Đế quốc'',
    ''Bộ chỉ huy Quân đội Cộng hòa'', ''lực lượng kháng chiến'', ''pháp sư Cộng hòa'']:
    pronouns_and_address: Giáo sư Halbom tự xưng `tôi`, quy chiếu các lực lượng Đế
    quốc bằng `họ`.: pov_and_voice: Giọng phân tích khép lại lô với dự phóng về sự
    can thiệp của pháp sư Cộng hòa.: modality_and_logic: Bảo toàn chuỗi suy luận giả
    định 2 câu: Lục quân Đế quốc hình dung Bộ chỉ huy Quân đội Cộng hòa sẽ gây sức
    ép; nếu chuyện đó xảy ra, lực lượng Đế quốc sẽ được yêu cầu khẩn trương dẹp tan
    kháng chiến nhưng đồng thời phải lo ngại các pháp sư Cộng hòa tham gia và tăng
    cường cho lực lượng kháng chiến ấy.: emphasis: Bảo toàn dấu nhấn mạnh `*...*`
