    thoại: dùng `chúng ta`.'']: pov_and_voice: Lời thông báo pha giọng trêu đùa của
    Tanya trước đơn vị.: modality_and_logic: Giữ trình tự thời gian (`nhưng trước
    đó chúng ta sẽ tham gia một trò chơi nhỏ của các pháp sư hải quân`), câu mệnh
    lệnh khích lệ (`Vui lên nào`) và câu hỏi đuôi về chất lượng đồ ăn của hải quân.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000407
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000407: terms: [''suất ăn của hải
    quân (Navy meals)'', ''hải quân (the navy)'', ''lục quân (the army)'', ''“phần
    cứng” (“hardware”)'', ''“phần mềm” (“software”)'', ''phúc lợi (welfare)'']: pronouns_and_address:
    [''Độc thoại nội tâm dùng `mình`; quy chiếu binh sĩ bằng `họ`.'']: pov_and_voice:
    Độc thoại nội tâm so sánh chế độ đãi ngộ giữa hai quân chủng dưới góc nhìn môi
    trường làm việc.: modality_and_logic: Khóa việc dùng `lục quân` đối lập với `hải
    quân` ở cả bốn vị trí so sánh trực tiếp trong đoạn (theo B24-R04), bảo toàn cặp
    ẩn dụ trong ngoặc kép `“phần cứng”` – `“phần mềm”` và kết luận về góc độ phúc
    lợi.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000408
