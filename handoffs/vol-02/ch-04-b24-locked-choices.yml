choices:
- segment_id: YS-LN02/Text/part0024.xhtml/p000381
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000381: terms: [''Bộ Tổng tham
    mưu (General Staff Office)'', ''tiểu đoàn hình phạt (penal battalion)'', ''chiến
    công (achievements)'']: pronouns_and_address: [''Dùng đại từ số nhiều bao gộp
    `chúng ta` cho Tanya và tiểu đoàn.'']: pov_and_voice: Độc thoại nội tâm đánh giá
    tình thế của Tanya.: modality_and_logic: Giữ quan hệ suy luận nhân quả (`còn đích
    thân cử người đến` -> `chúng ta chưa bị bỏ rơi`) và thế đối lập nhượng bộ (`Vẫn
    có nguy cơ bị điều đến phục vụ trong một tiểu đoàn hình phạt, nhưng chúng ta chỉ
    còn cách vượt qua bằng cách lập thật nhiều chiến công`).: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000382
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000382: terms: [''luyện ngục (purgatory)'',
    ''người lính (soldiers)'']: pronouns_and_address: [''Trong lời tuyên bố trước
    tiểu đoàn: dùng đại từ tập thể `chúng ta`.'']: pov_and_voice: Lời hiệu triệu cứng
    rắn của Tanya trước thuộc cấp.: modality_and_logic: Giữ cấu trúc bất chấp điều
    kiện khắc nghiệt (`Dù nơi đó có là luyện ngục, chúng ta cũng sẽ đến đó và chinh
    phục nó`) và mệnh đề giải thích bổn phận (`bởi đó là điều người lính phải làm`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000383
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000383: terms: [''nguyên tắc căn
    bản (fundamental principle)'', ''những điều cơ bản (the basics)'', ''Định luật
    Heinrich (Heinrich’s Law)'']: pronouns_and_address: [''Dùng `Chúng ta` ở câu nguyên
    tắc mở đầu.'']: pov_and_voice: Độc thoại nội tâm mang tư duy quản trị rủi ro và
    an toàn lao động của Tanya.: modality_and_logic: Giữ mệnh đề chấp hành mệnh lệnh
    (`được lệnh đi đâu thì sẽ đến đó`), quan hệ đối lập (`vốn chẳng cần phải nói,
    nhưng những điều cơ bản vẫn cần được thường xuyên ôn lại`) và nội dung cảnh báo
    của Định luật Heinrich về việc tích tụ các sai sót nhỏ.: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000384
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000384: terms: [''ngăn ngừa tai
    nạn (prevent accidents)'']: pronouns_and_address: []: pov_and_voice: Nhận định
    nguyên tắc trong nội tâm của Tanya.: modality_and_logic: Giữ khẳng định về việc
    dùng biện pháp mạnh tay hơn để phòng ngừa tai nạn là điều cơ bản.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000385
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000385: terms: [''nhiệm vụ (mission)'']:
    pronouns_and_address: [''Trong lời thoại: dùng `chúng ta` và `Tự mình`.'']: pov_and_voice:
    Lời đề xuất hành động dứt khoát của Tanya trước đơn vị.: modality_and_logic: Giữ
    tính thúc giục tức thời (`bây giờ... làm một nhiệm vụ đi. Tự mình thực hiện luôn`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000386
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000386: terms: [''chỉ huy (Commander)'']:
    pronouns_and_address: [''Weiss gọi Tanya là `Thưa chỉ huy?`.'']: pov_and_voice:
    Câu hỏi ngắn thể hiện sự ngạc nhiên/băn khoăn của Phó chỉ huy Weiss.: modality_and_logic:
    Giữ ngữ điệu nghi vấn.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000387
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000387: terms: [''học viện quân
    sự (military academy)'', ''cấp dưới (subordinates)'']: names_and_ranks: [''Phó
    chỉ huy Weiss (Vice Commander Weiss)'']: pronouns_and_address: [''Độc thoại nội
    tâm của Tanya dùng nhất quán đại từ `mình` / `Mình` theo DEC-P01-001.'']: pov_and_voice:
    Độc thoại nội tâm phản ánh thoáng ngập ngừng rồi lập tức lấy lại sự quyết đoán
    của Tanya.: modality_and_logic: Giữ hai câu tự vấn liên tiếp, lời răn từ học viện
    quân sự và cấu trúc so sánh lựa chọn ở câu cuối (`thà hối hận vì đã làm gì đó
    còn hơn chẳng làm gì, cứ thế mà để mặc mọi chuyện`).: emphasis: Khóa nhấn mạnh
    `*Đừng bao giờ nao núng trước cấp dưới.*` khớp chính xác với thẻ `<em>` trong
    nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000388
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000388: terms: [''nhân sự trong
    tiểu đoàn (battalion personnel)'', ''điều căn bản (the basics)'', ''nhân tài (talent)'']:
    pronouns_and_address: [''Câu 1 trần thuật ngôi thứ ba dùng `nó` (theo DEC-P01-001
    / B24-R01); câu 2 và câu 3 chuyển sang độc thoại nội tâm ngôi thứ nhất dùng `mình`.'']:
    pov_and_voice: Trần thuật ngôi thứ ba chuyển sang độc thoại nội tâm ngay trong
    cùng đoạn.: modality_and_logic: Giữ mức độ kiểm soát biểu cảm ở câu 1 (`chỉ vừa
    đủ giữ được vẻ mặt thản nhiên rồi liếc nhìn quanh`), phủ định giảm nhẹ ở câu 2
    (`có vẻ... vẫn chưa chán những lần mình liên tục xác nhận`) và ước muốn thu nạp
    nhân tài ở câu 3.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000389
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000389: terms: [''Đế quốc (Empire)'',
    ''người canh giữ (watchdog)'']: pronouns_and_address: [''Quy chiếu Đế quốc bằng
    `họ`.'']: pov_and_voice: Lời tuyên bố khích lệ lòng trung thành của Tanya trước
    tiểu đoàn.: modality_and_logic: Giữ cấu trúc mệnh lệnh khích lệ (`Hãy cho Đế quốc
    thấy... tài giỏi đến mức nào`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000390: terms: [''quân đội (the
    army)'', ''công cụ bạo lực (instrument of violence)'', ''người canh giữ (watchdog)'',
    ''nhà nước (the state)'']: pronouns_and_address: [''Câu 1 dùng `Mình` và quy chiếu
    binh sĩ bằng `họ`; câu 3–4 dùng `Chúng ta` / `mình` / `chúng ta`.'']: pov_and_voice:
    Độc thoại nội tâm thực dụng, cảnh giác chính trị của Tanya.: modality_and_logic:
    Giữ định nghĩa bản chất quân đội ở câu 2, mục đích chứng minh sự phục tùng không
    chống lại sự kiểm soát của nhà nước ở câu 3, và sự cảnh giác trước những ánh mắt
    giám sát ở câu 4.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000391
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000391: terms: [''lòng trung thành
    (loyalty)'']: pronouns_and_address: [''Độc thoại nội tâm dùng `mình`; quy chiếu
    cấp dưới/người quan sát bằng `họ`.'']: pov_and_voice: Độc thoại nội tâm toan tính
    xen lẫn giọng độc đoán của chỉ huy.: modality_and_logic: Giữ so sánh hơn tuyệt
    đối ở câu 2 (`Để họ cười mình còn tốt hơn gấp triệu lần việc khiến họ cảnh giác
    rồi tự đẩy mình vào thế bí`) và cách xử lý thẳng tay ở câu 3 (`ai cười thì mình
    cứ đánh cho một trận là được`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000392
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000392: terms: [''lũ chuột (those
    rats)'']: pronouns_and_address: [''Trong lời thoại: dùng `chúng ta` đối lập với
    `lũ chuột ấy` / `chúng`.'']: pov_and_voice: Lời tuyên bố truy kích kẻ địch của
    Tanya trước tiểu đoàn.: modality_and_logic: Giữ quan hệ nhượng bộ toàn phần (`chúng
    có chạy đi đâu thì chúng ta cũng sẽ bám sát gót`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000393
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000393: terms: [''Người có lý trí
    (anyone with common sense)'']: names_and_ranks: [''Tsuji'']: pronouns_and_address:
    [''Độc thoại nội tâm dùng `mình` / `Mình`; quy chiếu Tsuji bằng `ông ta`; quy
    chiếu người đời bằng `họ`.'']: pov_and_voice: Độc thoại tự chất vấn khi Tanya
    chợt nhận ra hành vi của mình giống Tsuji.: modality_and_logic: Giữ chuỗi câu
    hỏi – tự đáp phủ định (`Người có lý trí nào lại thích ông ta chứ? Còn lâu.`) và
    câu hỏi truy nguyên nhân ở cuối đoạn (`Vì sao? Vì ông ta cứ hành động mà chẳng
    bàn bạc với ai sao?`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000394
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000394: terms: [''người biết điều
    (sensible person)'', ''cấp dưới (subordinate)'', ''đội hành quyết (firing squad)'']:
    names_and_ranks: [''Tsuji'']: pronouns_and_address: [''Độc thoại nội tâm dùng
    `mình`; quy chiếu Tsuji bằng `hắn`.'']: pov_and_voice: Độc thoại nội tâm gay gắt
    của Tanya đối với mẫu sĩ quan tự tiện kiểu Tsuji.: modality_and_logic: Giữ câu
    điều kiện giả định trái thực tế (`Nếu một người biết điều như mình có cấp dưới
    kiểu Tsuji, hẳn mình sẽ đưa hắn ra trước đội hành quyết`), lý do giải thích và
    câu cảm thán phê phán sự vô dụng ở cuối đoạn.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000395
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000395: terms: [''phó chỉ huy (vice
    commander)'', ''biết điều (have common sense)'', ''nổi cơn làm loạn (go on a rampage)'']:
    names_and_ranks: [''Tsuji'']: pronouns_and_address: [''Độc thoại nội tâm dùng
    `mình`; quy chiếu phó chỉ huy Weiss bằng `anh ta`.'']: pov_and_voice: Độc thoại
    nội tâm suy diễn lo âu của Tanya về cách Weiss nhìn nhận mình.: modality_and_logic:
    Giữ liên kết suy luận giữa hai câu hỏi (`Thế phó chỉ huy của mình có biết điều
    không? Nói cách khác, anh ta kết luận rằng mình là một Tsuji có thể nổi cơn làm
    loạn à?`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000396
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000396: terms: [''người biết điều
    (sensible person)'', ''tuân thủ quy tắc (following rules)'', ''lẽ tồn tại (meaning
    of my existence)'', ''kẽ hở (loopholes)'']: pronouns_and_address: [''Độc thoại
    nội tâm dùng nhất quán `mình` / `Mình`.'']: pov_and_voice: Độc thoại tự biện hộ
    đầy đặc trưng của Tanya về việc thượng tôn quy tắc và lách luật.: modality_and_logic:
    Giữ phủ định hành vi tự ý quyết định rồi đổ trách nhiệm, khẳng định việc tuân
    thủ quy tắc là lẽ tồn tại, và thế đối lập sắc sảo ở câu kết (`Mình không phá luật;
    mình tìm kẽ hở!`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000397
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000397: terms: [''Rhine'', ''thưa
    các quý ông (gentlemen)'']: names_and_ranks: [''Trung úy (Lieutenant)'']: pronouns_and_address:
    [''Tanya gọi Weiss là `Trung úy`, dùng `chúng ta` cho cả đơn vị, và gọi toàn thể
    sĩ quan/binh sĩ là `thưa các quý ông`.'']: pov_and_voice: Lời thông báo điểm điều
    chuyển mới của Tanya trước tiểu đoàn.: modality_and_logic: Khóa việc giữ nguyên
    tên địa danh `Rhine` không thêm từ `sông` ở cả hai vị trí (theo B24-R03).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000398
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000398: names_and_ranks: [''Tanya'',
    ''Tsuji'', ''tướng Brute-Guchi (General Brute-Guchi)'', ''Trung úy Weiss (Lieutenant
    Weiss)'']: pronouns_and_address: [''Câu 1 trần thuật ngôi thứ ba dùng `Tanya`;
    câu 2–3 chuyển sang độc thoại nội tâm ngôi thứ nhất dùng `mình`; quy chiếu Tsuji
    và Brute-Guchi bằng `họ`; quy chiếu Trung úy Weiss bằng `anh ta`.'']: pov_and_voice:
    Trần thuật ngôi thứ ba chuyển sang độc thoại nội tâm lo lắng của Tanya.: modality_and_logic:
    Giữ nguyên nhân gây căng thẳng (`toát mồ hôi lạnh vì hiểu lầm này`), mong muốn
    tránh bị đánh đồng với nhóm Tsuji / tướng Brute-Guchi và câu điều kiện dự định
    nói chuyện với Weiss.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000399
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000399: pronouns_and_address: [''Trần
    thuật ngôi thứ ba dùng `nó` theo DEC-P01-001 (B24-R01).'']: pov_and_voice: Trần
    thuật ngôi thứ ba bám sát trạng thái của Tanya.: modality_and_logic: Giữ quan
    hệ nhượng bộ giữa tâm trạng bên trong và hành động bên ngoài (`Dù trong lòng còn
    rối bời, nó vẫn tập trung vượt qua tình thế trước mắt`).: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000400
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000400: terms: [''Rhine'']: pronouns_and_address:
    []: pov_and_voice: Câu hỏi lặp lại địa danh đầy ngạc nhiên của thuộc cấp.: modality_and_logic:
    Khóa việc giữ nguyên `Rhine ư?` không thêm từ `sông` (theo B24-R03).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000401
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000401: terms: [''quét chiến trường
    theo chiều ngược kim đồng hồ (counterclockwise sweep of the battlefield)'']: pronouns_and_address:
    [''Trong lời thoại: dùng `chúng ta` / `Chúng ta`; quy chiếu cấp trên bằng `họ`.'']:
    pov_and_voice: Lời giải thích kế hoạch tác chiến của Tanya.: modality_and_logic:
    Giữ thế đối lập (`sẽ phải gấp rút, nhưng họ kỳ vọng rất nhiều ở chúng ta`) và
    hướng cơ động (`quét chiến trường theo chiều ngược kim đồng hồ`).: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000402
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000402: pronouns_and_address: [''Dùng
    `Chúng ta`.'']: pov_and_voice: Nhận định ngắn gọn, khẩu ngữ trong nội tâm của
    Tanya về nhiệm vụ.: modality_and_logic: Giữ giới hạn phạm vi công việc tối giản
    (`chỉ cần nện cho mấy kẻ cả gan xuất hiện một trận. Chỉ thế thôi.`).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000403
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000403: terms: [''thăng chức (promotions
    / getting promoted)'', ''quân đội (the army)'', ''cấp lương (pay grade)'', ''Being
    X'']: names_and_ranks: [''Tanya'', ''Tsuji'']: pronouns_and_address: [''Câu 1
    dùng `Chúng ta`; câu 3–5 và câu 6 dùng `mình` / `Mình` cho độc thoại nội tâm của
    Tanya; mệnh đề dẫn lời kể dùng tên riêng `Tanya`.'']: pov_and_voice: Độc thoại
    nội tâm thực dụng của Tanya xen mệnh đề dẫn lời kể ngôi thứ ba.: modality_and_logic:
    Giữ lập luận giới hạn nỗ lực theo đúng cấp lương vì thăng chức trong quân đội
    không hẳn mang lại hạnh phúc, lời than thở quy căn nguyên cho Being X và kết luận
    tự răn không hành xử quá giống Tsuji.: emphasis: Khóa phạm vi nhấn mạnh `*Tại
    sao chuyện này lại xảy ra cơ chứ? Không, mình biết gốc rễ mọi chuyện là Being
    X*` theo đúng thẻ `<em>` trong nguồn, để mệnh đề `, Tanya than thở.` và câu cuối
    ở ngoài dấu `*...*` (DEC-P01-002 / B24-R02).'
