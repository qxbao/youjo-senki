  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000408: pronouns_and_address: []:
    pov_and_voice: Tiếng thốt ngạc nhiên ngắn gọn của thuộc cấp.: modality_and_logic:
    Giữ câu cảm thán nghi vấn `“Hả?”`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000409
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000409: terms: [''hạm đội (the
    fleet)'']: names_and_ranks: [''Đại tá von Lergen (Colonel von Lergen)'']: pronouns_and_address:
    [''Trong lời thoại: dùng `Chúng ta`.'']: pov_and_voice: Lời giải thích ngắn gọn
    của Tanya về nhiệm vụ phối hợp với hạm đội.: modality_and_logic: Giữ nguyên nhân/người
    thu xếp (`Nhờ Đại tá von Lergen đấy`) và nhiệm vụ sắp tới (`đến hỗ trợ hạm đội`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000410
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000410: terms: [''một trăm feet
    (one hundred feet)'']: pronouns_and_address: []: pov_and_voice: Câu trần thuật
    ngắn mở đầu cảnh bay diễn tập trên biển.: modality_and_logic: Giữ thông số độ
    cao `Ở độ cao một trăm feet.`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000411
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000411: terms: [''đội hình đột
    kích lên tàu (boarding assault formation)'', ''mục tiêu (target)'', ''các đại
    đội (the companies)'']: names_and_ranks: [''Thiếu tá von Degurechaff (Major von
    Degurechaff)'']: pronouns_and_address: [''Trần thuật ngôi thứ ba dùng chức danh
    `Thiếu tá von Degurechaff` ở câu 1 và đại từ `nó` ở câu 3 theo DEC-P01-001 (B24-R01).'']:
    pov_and_voice: Trần thuật ngôi thứ ba mô tả mệnh lệnh và triển khai đội hình bay
    sát mặt biển.: modality_and_logic: Khóa thuật ngữ `đội hình đột kích lên tàu`
    (theo B24-R05), giữ nguyên mô tả kỹ thuật bay (`lướt sát mặt nước mà không giảm
    tốc độ rồi lao vào mục tiêu`) và sự phối hợp đội hình giữa các đại đội.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000412
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000412: terms: [''làn đạn phòng
    không (anti–air fire)'', ''cuộc diễn tập / diễn tập (exercise)'', ''màn đánh chặn
    (interception)'', ''hỏa lực đánh chặn (intercepting fire)'']: names_and_ranks:
    [''Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba dùng tên riêng `Tanya`
    và đại từ `nó` / `Nó` (theo DEC-P01-001 / B24-R01); quy chiếu đơn vị trong lời
    kể bằng `Họ` và trong câu độc thoại nội tâm cuối bằng `chúng ta`; quy chiếu phía
    hạm đội phòng không bằng `Họ` / `họ`.'']: pov_and_voice: Trần thuật ngôi thứ ba
    đan xen hai câu độc thoại nội tâm trực tiếp in nghiêng của Tanya.: modality_and_logic:
    Giữ sự tương phản giữa vẻ mặt nghiêm nghị bên ngoài với sự kinh ngạc bên trong,
    kỳ vọng về màn đánh chặn tương xứng so với thực tế hỏa lực đánh chặn quá yếu,
    câu hỏi nghi vấn việc khai hỏa `*Họ có đang bắn không vậy?*` (không hàm ý hỏi
    về đạn thật theo B24-R06), và sự tin chắc ở câu cuối (`*Chắc chắn họ sẽ bắn vào
    chúng ta, dù đây chỉ là diễn tập.*`).: emphasis: Khóa chính xác hai phạm vi nhấn
    mạnh `*Họ có đang bắn không vậy?*` và `*Chắc chắn họ sẽ bắn vào chúng ta, dù đây
    chỉ là diễn tập.*` theo đúng hai thẻ `<em>` trong nguồn (DEC-P01-002).'
  non_canon: true
