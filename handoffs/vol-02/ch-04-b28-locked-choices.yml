  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000525: terms: [''pháo phụ (secondary
    guns)'', ''phòng không (air defense)'', ''hải quân (the navy)'', ''thời đại chiến
    tranh trên không (the era of aerial warfare)'', ''chiến hạm (warships)'', ''tàu
    sân bay (aircraft carriers)'', ''hỗ trợ trực tiếp (direct support)'']: names_and_ranks:
    [''Tanya'']: pronouns_and_address: [''Trong lời thoại: Tanya tự xưng `tôi` và
    dùng `Chúng ta`; trong lời kể: dùng tên riêng `Tanya`, phản thân `mình` và đại
    từ `cô`.'']: pov_and_voice: Lời phát biểu quyết liệt của Tanya tiếp nối bằng trần
    thuật giải thích tầm nhìn chiến lược của nhân vật.: modality_and_logic: Khóa thuật
    ngữ `hỗ trợ trực tiếp` (T05); giữ nhận định mạnh trong lời thoại (`pháo phụ còn
    tệ hơn vô dụng`), sự nhận thức của Tanya rằng lời mình thiếu tôn trọng nhưng muốn
    nắm lấy cơ hội để hải quân tiến một bước quyết định, và niềm tin chắc chắn về
    thời điểm chiến hạm được phân công hỗ trợ trực tiếp cho tàu sân bay.: emphasis:
    Không dùng `*...*`.: locks: [''Khóa `pháo phụ`, `phòng không`, `thời đại chiến
    tranh trên không`, `chiến hạm`, `tàu sân bay`, `hỗ trợ trực tiếp` (T05), đại từ
    `tôi` / `Chúng ta` trong thoại và `Tanya` trong lời kể.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000526
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000526: terms: [''học thuyết (the
    doctrine)'', ''những chiến hạm lớn mang pháo lớn (big ships with big guns)'',
    ''lực lượng tác chiến trên không (air forces)'', ''sức mạnh chủ lực (main power)'',
    ''tác chiến bằng hỏa lực (fire action)'', ''pháo trên chiến hạm (warship cannons)'',
    ''yểm trợ bằng hỏa lực (supporting fire)'']: pronouns_and_address: [''Trần thuật
    dùng đại từ `cô` cho Tanya và `họ` cho phía hải quân.'']: pov_and_voice: Trần
    thuật phân tích mong muốn thực sự của Tanya về việc đổi học thuyết hải quân cùng
    quan điểm về hỏa lực yểm trợ.: modality_and_logic: Khóa sửa chữa F03/T03 (`tác
    chiến bằng hỏa lực`) và F04 (`lực lượng tác chiến trên không` như `sức mạnh chủ
    lực`); giữ trọn vẹn hai vế: mong muốn thúc giục hải quân từ bỏ nỗi ám ảnh tàu
    lớn pháo lớn để lấy lực lượng tác chiến trên không làm chủ lực, đồng thời bổ sung
    rằng bản thân vẫn tin vào tác chiến bằng hỏa lực và coi trọng pháo chiến hạm ở
    vai trò yểm trợ hỏa lực.: emphasis: Không dùng `*...*`.: locks: [''Khóa `học thuyết`,
    `những chiến hạm lớn mang pháo lớn`, `lực lượng tác chiến trên không` (F04), `sức
    mạnh chủ lực`, `tác chiến bằng hỏa lực` (F03/T03) và `yểm trợ bằng hỏa lực`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000527
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000527: terms: [''những chiếc máy
    bay bị ví như bật lửa một phát (one-shot lighters)'', ''*Prince of Wales*'', ''*Repulse*'',
    ''pháo phụ (secondary guns)'', ''pháo cao xạ (high-angle guns)'', ''các ụ pháo
    tự động (autocannon emplacements)'']: pronouns_and_address: [''Quy chiếu hai chiến
    hạm bằng `chúng`.'']: pov_and_voice: Độc thoại nội tâm của Tanya dẫn chứng tiền
    lệ lịch sử Thế chiến II để củng cố bước đi trước mắt.: modality_and_logic: Khóa
    sửa chữa F01 (`những chiếc máy bay bị ví như bật lửa một phát`), F08 (`tối tân
    thời bấy giờ`, `đã được cải tạo cho phù hợp với thời hiện đại`, `xuống làm bạn
    với rong biển`), T02 (`các ụ pháo tự động`) và T04 (`pháo cao xạ`); giữ quan hệ
    nhượng bộ chuyển ý từ việc trân trọng pháo chiến hạm sang thực tế phũ phàng khi
    hai chiến hạm danh tiếng bị máy bay đánh chìm, từ đó khẳng định ưu tiên trước
    mắt là tháo bỏ pháo phụ để tăng pháo cao xạ và các ụ pháo tự động.: emphasis:
    Khóa chính xác hai vùng chữ nghiêng tên tàu `*Prince of Wales*` và `*Repulse*`
    theo DEC-P01-002 (F07).: locks: [''Khóa `những chiếc máy bay bị ví như bật lửa
    một phát` (F01), tên tàu in nghiêng `*Prince of Wales*` và `*Repulse*` (F07),
    bản sửa F08 (`tối tân thời bấy giờ`, `đã được cải tạo cho phù hợp với thời hiện
    đại`, `xuống làm bạn với rong biển`), `pháo phụ`, `pháo cao xạ` (T04) và `các
    ụ pháo tự động` (T02).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000528
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000528: terms: [''hải quân vốn
    đặt trọng tâm vào tác chiến bằng chiến hạm (the ship warfare–oriented navy)'',
    ''học thuyết lấy sức mạnh trên không làm trung tâm (an air force–centric doctrine)'']:
    pronouns_and_address: [''Trần thuật dùng đại từ `Cô` cho Tanya.'']: pov_and_voice:
    Trần thuật kết lại nhận thức thực tế của Tanya về sức ỳ học thuyết của hải quân.:
    modality_and_logic: Khóa sửa chữa F04 (`học thuyết lấy sức mạnh trên không làm
    trung tâm`) và F05 (`hải quân vốn đặt trọng tâm vào tác chiến bằng chiến hạm`);
    giữ điều kiện thời gian rằng cho đến khi xảy ra một sự kiện tương tự vụ *Prince
    of Wales* và *Repulse*, sẽ rất khó thuyết phục hải quân chấp nhận học thuyết mới.:
    emphasis: Không dùng `*...*`.: locks: [''Khóa điều kiện `cho đến khi xảy ra một
    sự kiện tương tự`, cụm `hải quân vốn đặt trọng tâm vào tác chiến bằng chiến hạm`
    (F05) và `học thuyết lấy sức mạnh trên không làm trung tâm` (F04).'']'
  non_canon: true
