choices:
- segment_id: YS-LN02/Text/part0024.xhtml/p000502
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000502: terms: [''tàu sân bay Mỹ
    (aircraft carriers the Americans used)'', ''Thế chiến thứ hai (World War II)'',
    ''hỏa lực phòng không (anti-aircraft fire)'', ''kiểu tấn công liều chết (all-in
    approach)'']: names_and_ranks: [''Tanya'']: pronouns_and_address: [''Lời dẫn trần
    thuật dùng tên riêng `Tanya` (`Tanya thầm nghĩ`).'']: pov_and_voice: Độc thoại
    nội tâm của Tanya được lồng qua cụm dẫn trần thuật ngắn.: modality_and_logic:
    Giữ sắc thái thông tin nghe nói (`vốn được cho là có hỏa lực phòng không mạnh`),
    phủ định mức độ (`không thể hoàn toàn ngăn chặn`) và tiền đề của phương thức tấn
    công (`với giả định rằng sẽ không trở về`); không tự chèn thuật ngữ lịch sử ngoài
    văn bản nguồn.: emphasis: Khóa chính xác hai vùng chữ nghiêng tách biệt `*Hơn
    nữa*` và `*ngay cả ... sẽ không trở về.*`, để cụm dẫn `Tanya thầm nghĩ` nằm ngoài
    dấu `*...*` theo DEC-P01-002 (F06).: locks: [''Khóa hai vùng nhấn mạnh `*Hơn nữa*`
    và `*ngay cả ... không trở về.*` (F06), tên riêng `Tanya`, `tàu sân bay Mỹ`, `Thế
    chiến thứ hai` và `hỏa lực phòng không`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000503
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000503: terms: [''chiến hạm chủ
    lực (capital ships)'', ''*Basel*'', ''pháo phòng không (anti–air cannons)'']:
    pronouns_and_address: [''Trong lời thoại của sĩ quan hải quân: dùng `chúng ta`.'']:
    pov_and_voice: Lời phát biểu của một sĩ quan hải quân trong cuộc họp rút kinh
    nghiệm.: modality_and_logic: Giữ ý so sánh thuộc nhóm mạnh nhất trong số các chiến
    hạm chủ lực hiện có.: emphasis: Khóa chữ nghiêng tên tàu `*Basel*` theo DEC-P01-002
    (F07).: locks: [''Khóa tên tàu in nghiêng `*Basel*` (F07), `chiến hạm chủ lực`,
    `pháo phòng không` và đại từ `chúng ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000504
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000504: terms: [''pháo tự động
    (autocannons)'']: pronouns_and_address: []: pov_and_voice: Trần thuật phân tích
    góc nhìn thông thường đối với hỏa lực của tàu.: modality_and_logic: Khóa thuật
    ngữ `pháo tự động` (T02); giữ điều kiện hạn định đối tượng (`Với người *chưa biết
    chuyện đó*`) và nhận định bề ngoài (`nghe chẳng khác nào tự sát`).: emphasis:
    Khóa chính xác vùng chữ nghiêng `*chưa biết chuyện đó*` theo DEC-P01-002 (F06).:
    locks: [''Khóa vùng nhấn mạnh `*chưa biết chuyện đó*` (F06) và thuật ngữ `pháo
    tự động` (T02).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000505
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000505: terms: [''sĩ quan hải quân
    (navy officer)'', ''hỏa lực (firepower)'']: pronouns_and_address: [''Quy chiếu
    viên sĩ quan hải quân vừa nêu ý kiến bằng đại từ `ông`.'']: pov_and_voice: Trần
    thuật quan sát thái độ của viên sĩ quan hải quân.: modality_and_logic: Giữ sắc
    thái phỏng đoán nguyên nhân (`dường như làm vậy vì ông nghĩ con tàu có đủ hỏa
    lực`) và biểu cảm bối rối của nhân vật.: emphasis: Không dùng `*...*`.: locks:
    [''Khóa `Viên sĩ quan hải quân`, `hỏa lực`, đại từ `ông` và tình thái phỏng đoán
    `dường như`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000506: terms: []: pronouns_and_address:
    []: pov_and_voice: Trần thuật bình luận nối tiếp nhận định ở đoạn trước.: modality_and_logic:
    Giữ cấu trúc phủ định giảm nhẹ (`chẳng phải điều quá phi lý`).: emphasis: Không
    dùng `*...*`.: locks: [''Khóa cấu trúc phủ định `chẳng phải điều quá phi lý`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000507
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000507: terms: [''khách quan (objectively)'',
    ''chủ quan (subjectively)'', ''“khuôn mẫu nhận thức” của Lippmann (Lippmann’s
    “stereotype”)'', ''trí tuệ con người (the human intellect)'']: pronouns_and_address:
    []: pov_and_voice: Trần thuật bình luận triết lý nhận thức từ góc nhìn của Tanya.:
    modality_and_logic: Khóa thuật ngữ tạm `“khuôn mẫu nhận thức”` (T01 / F02); giữ
    thế đối lập giữa ý định tiếp nhận `khách quan` với giới hạn chỉ chấp nhận những
    gì hiểu được theo `chủ quan`, cùng tính nghịch lý ở câu 2 (`lại nghịch lý thay
    mô tả được trí tuệ con người có thể mở rộng đến mức nào`).: emphasis: Không dùng
    `*...*`; giữ dấu ngoặc kép quanh `“khuôn mẫu nhận thức”`.: locks: [''Khóa cụm
    `“khuôn mẫu nhận thức” của Lippmann` (T01 / F02) và thế đối lập `khách quan` –
    `chủ quan`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000508
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000508: terms: [''chiến hạm (warship)'',
    ''pháo tự động (autocannons)'', ''pháo đài nổi (floating fortress)'', ''*Basel*'',
    ''hỏa lực phòng thủ (defensive firepower)'', ''các sĩ quan (the officers)'']:
    pronouns_and_address: [''Quy chiếu các sĩ quan có mặt bằng `họ`.'']: pov_and_voice:
    Trần thuật giải thích mạch suy nghĩ tự nhiên của các sĩ quan dự họp.: modality_and_logic:
    Khóa thuật ngữ `pháo tự động` (T02) và `hỏa lực phòng thủ`; giữ quan hệ nhân quả
    dẫn tới câu hỏi nội tâm và sự rào đón ở câu cuối (`Ít nhất thì với họ, câu hỏi
    ấy không có gì lạ`).: emphasis: Khóa chính xác hai vùng chữ nghiêng `*Basel*`
    và `*Như thế vẫn chưa đủ sao?*` theo DEC-P01-002 (F07).: locks: [''Khóa `pháo
    tự động` (T02), `pháo đài nổi`, `hỏa lực phòng thủ` và hai vùng chữ nghiêng `*Basel*`,
    `*Như thế vẫn chưa đủ sao?*` (F07).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000509
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000509: terms: [''kẻ tấn công (the
    attacker)'', ''hỏa lực phòng không (anti–air fire)'', ''Bộ Tư lệnh Hạm đội Biển
    Bắc (Northern Sea Fleet Command)'', ''tác chiến và diễn tập chống pháp sư (anti-mage
    combat and exercise)'', ''pháp sư (mages)'']: names_and_ranks: [''Tanya'']: pronouns_and_address:
    [''Trong lời thoại của Tanya: dùng `nó` để quy chiếu hỏa lực phòng không của tàu;
    trong lời kể: dùng tên riêng `Tanya` và đại từ `Cô`.'']: pov_and_voice: Lời phát
    biểu thẳng thừng của Tanya đan xen trần thuật ghi nhận tác động lên Bộ Tư lệnh
    Hạm đội Biển Bắc.: modality_and_logic: Giữ cấp độ phủ định tăng tiến trong lời
    Tanya (`chẳng phải mối đe dọa gì lớn` -> `thậm chí còn chẳng phải chướng ngại`),
    hàm ý rằng `hỏa lực phòng không` không phải biện pháp phòng thủ hiệu quả trước
    các đòn tấn công từ trên trời, và kết quả nhận thức lại mối đe dọa từ pháp sư
    của `Bộ Tư lệnh Hạm đội Biển Bắc`.: emphasis: Không dùng `*...*`.: locks: [''Khóa
    tên riêng `Tanya`, `hỏa lực phòng không`, `Bộ Tư lệnh Hạm đội Biển Bắc`, `tác
    chiến và diễn tập chống pháp sư` và hai câu phủ định trong lời thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000510
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000510: terms: [''thiếu tá (major)'',
    ''bên thứ ba (third party)'', ''cuộc tấn công (the assault)'', ''Trưởng ban trọng
    tài (The head referee)'', ''trọng tài phụ trách phía tấn công (the referee in
    charge of the attacking side)'']: pronouns_and_address: [''Quy chiếu các sĩ quan
    hải quân bằng `họ`.'']: pov_and_voice: Trần thuật diễn biến tâm lý cử tọa và hành
    động điều phối của Trưởng ban trọng tài.: modality_and_logic: Giữ thế nhượng bộ
    (`đó cũng chỉ là ý kiến của một thiếu tá`) và mong muốn nghe thêm đánh giá khách
    quan từ trọng tài đi theo phía tấn công.: emphasis: Không dùng `*...*`.: locks:
    [''Khóa `thiếu tá`, `Trưởng ban trọng tài`, `trọng tài phụ trách phía tấn công`
    và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000511
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000511: terms: [''Vị trọng tài
    (The referee)'', ''đợt xung phong (the charge)'', ''tuyến hỏa lực (the firing
    line)'', ''hỏa lực phòng không (anti–air fire)'', ''pháo tép (firecrackers)'']:
    names_and_ranks: [''Thiếu tá von Degurechaff (Major von Degurechaff)'', ''Tanya'']:
    pronouns_and_address: [''Trong lời thoại: vị trọng tài tự xưng `Tôi` / `tôi`,
    dùng `chúng ta` cho phía quân nhà, gọi Tanya là `Thiếu tá von Degurechaff` và
    `cô ấy`; trong lời kể: quy chiếu trọng tài bằng `ông` và dùng tên riêng `Tanya`.'']:
    pov_and_voice: Lời nhận xét của vị trọng tài phụ trách phía tấn công đan xen trần
    thuật.: modality_and_logic: Giữ sự đồng tình của trọng tài với Tanya dựa trên
    trải nghiệm trực tiếp đi cùng đợt xung phong, sự đối lập với hy vọng của phần
    lớn sĩ quan, và phép so sánh ví von (`hỏa lực phòng không hiện tại của chúng ta
    hữu dụng chẳng khác gì một đống pháo tép`).: emphasis: Không dùng `*...*`.: locks:
    [''Khóa `Vị trọng tài`, `Thiếu tá von Degurechaff`, `đợt xung phong`, `tuyến hỏa
    lực`, `hỏa lực phòng không`, hình ảnh `một đống pháo tép` và hệ đại từ `Tôi` /
    `chúng ta` – `cô ấy` / `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000512
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000512: terms: [''Hỏa lực phòng
    thủ (defensive firepower)'', ''khả năng phòng thủ (defense)'', ''các sĩ quan (the
    officers)'']: pronouns_and_address: [''Trong lời thoại: dùng `chúng ta`; trong
    lời kể: dùng `Họ` và phản thân `mình` cho các sĩ quan.'']: pov_and_voice: Câu
    hỏi phản ứng của các sĩ quan và lời kể mô tả sự bàng hoàng của cử tọa.: modality_and_logic:
    Giữ nội dung nhận định rằng họ đã đánh giá quá cao khả năng phòng thủ và câu hỏi
    biểu lộ sự sững sờ.: emphasis: Khóa chính xác vùng chữ nghiêng ở câu hỏi cuối
    đoạn `*Thật sự yếu đến thế ư?*` theo DEC-P01-002.: locks: [''Khóa `Hỏa lực phòng
    thủ`, đại từ `chúng ta` / `Họ` và vùng chữ nghiêng `*Thật sự yếu đến thế ư?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000513
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000513: terms: [''các đợt áp sát
    (approaches)'', ''pháo (guns)'', ''như lưng nhím (like porcupines)'']: pronouns_and_address:
    [''Vị trọng tài thứ hai tự xưng `tôi` và dùng `chúng ta`.'']: pov_and_voice: Lời
    khẳng định của vị trọng tài thứ hai.: modality_and_logic: Giữ mức độ thiếu hụt
    vượt dự kiến (`còn thiếu nhiều hơn tôi tưởng`) và mục đích tăng số lượng pháo
    để chặn các đợt áp sát cho đến khi tàu chi chít như lưng nhím (đồng bộ ẩn dụ với
    b27 p000501).: emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ `tôi` / `chúng
    ta`, `chặn các đợt áp sát` và ẩn dụ `cho đến khi tàu chi chít như lưng nhím`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000514
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000514: terms: [''vị trọng tài
    thứ hai (the second referee)'']: pronouns_and_address: []: pov_and_voice: Trần
    thuật nhận xét tính chất dứt khoát trong câu trả lời của trọng tài thứ hai.: modality_and_logic:
    Giữ khẳng định câu trả lời đơn giản và không để lại chỗ cho sự hiểu lầm.: emphasis:
    Không dùng `*...*`.: locks: [''Khóa `vị trọng tài thứ hai` và phủ định `không
    để ai hiểu lầm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000515
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000515: terms: [''pháo tự động
    20 mm (20 mm autocannons)'', ''loại 40 mm (40 mm)'']: pronouns_and_address: [''Tanya
    tự xưng `Tôi` và dùng `chúng ta`.'']: pov_and_voice: Lời phát biểu đề xuất cỡ
    nòng của Tanya.: modality_and_logic: Khóa thuật ngữ `pháo tự động 20 mm` (T02)
    và cấu trúc tăng tiến cùng chủ thể `không chỉ pháo tự động 20 mm mà cả loại 40
    mm nữa`.: emphasis: Không dùng `*...*`.: locks: [''Khóa đại từ `Tôi` / `chúng
    ta` và cấu trúc `không chỉ pháo tự động 20 mm mà cả loại 40 mm nữa` (T02).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000516
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000516: terms: [''quân đội Mỹ (the
    American military)'', ''hỏa lực phòng không lý tưởng (ideal anti–air fire)'']:
    names_and_ranks: [''Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba
    dùng tên riêng `Tanya` và đại từ `Cô`.'']: pov_and_voice: Trần thuật nêu cơ sở
    tham chiếu từ tri thức kiếp trước của Tanya.: modality_and_logic: Giữ mức độ đồng
    tình cao nhất của Tanya và niềm tin rằng quân đội Mỹ đã cung cấp hình mẫu tốt
    nhất về hỏa lực phòng không lý tưởng.: emphasis: Không dùng `*...*`.: locks: [''Khóa
    `Tanya`, `quân đội Mỹ` và `hỏa lực phòng không lý tưởng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000517
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000517: terms: [''đổi mới (the
    innovation)'']: pronouns_and_address: [''Trần thuật dùng đại từ `Cô` và phản thân
    `chính mình`.'']: pov_and_voice: Trần thuật mô tả cách Tanya đưa kiến thức thực
    chiến từ thế giới cũ vào cuộc họp.: modality_and_logic: Giữ thế đối lập giữa việc
    chưa từng có tiền lệ ở thế giới này nhưng đã được chứng minh trong thực chiến,
    cùng cách đề xuất gián tiếp với thái độ thản nhiên.: emphasis: Không dùng `*...*`.:
    locks: [''Khóa thế đối lập `hoàn toàn chưa từng có tiền lệ, nhưng đã được chứng
    minh trong chiến đấu` và hành động đề xuất gián tiếp của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000518
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000518: terms: []: pronouns_and_address:
    [''Câu hỏi trực tiếp gửi tới Tanya dùng đại từ ngôi thứ hai `cô`.'']: pov_and_voice:
    Câu hỏi ngắn của sĩ quan dự họp yêu cầu Tanya giải thích rõ hơn.: modality_and_logic:
    Giữ câu hỏi trực tiếp yêu cầu làm rõ ý.: emphasis: Không dùng `*...*`.: locks:
    [''Khóa đại từ ngôi thứ hai `cô` (`“Ý cô là sao?”`).'']'
