segment_id_end: YS-LN02/Text/part0014.xhtml/p000024
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000001: locks: [''Giữ các cụm thuật
    ngữ `lễ phục kiểu II của Lục quân Liên minh Entente`, `phù hiệu quân hàm mới`,
    `cấp trên thuộc Cục Nhân sự Lục quân`, đại từ `ông ta` quy chiếu viên sĩ quan
    cấp trên và hình ảnh so sánh `nở nụ cười gượng gạo như đeo mặt nạ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000002: locks: [''Giữ đại từ xưng
    hô `Ông` và danh xưng quân hàm `Đại tá Anson Sue` trong câu thoại `“Ông được thăng
    cấp rồi. Chúc mừng, Đại tá Anson Sue.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000003: locks: [''Giữ ngôi xưng
    `tôi`, `đất nước chúng ta` cùng suy luận tình thái `hẳn đã đến hồi kết` trong
    lời thoại của Sue; giữ đại từ trần thuật `Ông`, phản thân `mình` và cấu trúc phủ
    định sóng đôi `không nổi giận trước tình cảnh ấy, nhưng cũng chẳng buồn giấu lời
    lẩm bẩm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000004: locks: [''Giữ đại từ `ông`,
    tên riêng `Sue`, danh xưng `Liên minh Entente` và sắc thái tình thái `không nên
    ăn nói như vậy` / `những lời cay đắng của Sue có thể được bỏ qua`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000005: locks: [''Giữ ba câu ngắn
    mạch lạc `Thất bại đã quá rõ ràng. Sự sụp đổ ấy chắc chắn sẽ đến. Dĩ nhiên, vẫn
    còn đôi chút hy vọng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000006: locks: [''Giữ đại từ phản
    thân `mình` và cụm `sự lạc quan lại hiếm hoi đến mức nực cười`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000007: locks: [''Giữ thuật ngữ
    `phù hiệu mới`, cách xưng hô `Chúng tôi` – `ông` và danh xưng `Đại tá`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000008: locks: [''Giữ quan hệ nhân
    quả `Vì thế`, đại từ `họ` và cụm `Trái tim họ đã cạn khô từ lâu vì cơn phẫn nộ
    dữ dội.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000009: locks: [''Giữ danh xưng
    `Tổ quốc`, cặp xưng hô `Tôi` – `ông`, phản thân `mình` và câu kết ngắn `Chỉ vậy
    thôi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000010: locks: [''Giữ câu đáp nghi
    thức khuôn mẫu `“Không có niềm hạnh phúc nào lớn hơn việc được giao phó Tổ quốc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000011: locks: [''Giữ câu đáp ngắn
    `“Tốt lắm.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000012: locks: [''Giữ đại từ `Họ`,
    tên riêng `Sue`, hình ảnh so sánh `đều đều đọc những câu hùng hồn như tụng kinh`,
    `sự khinh miệt đơn thuần dành cho các nghi thức`, và câu hỏi nội tâm in nghiêng
    `*Lãnh đạo đã lựa chọn tồi tệ đến thế, vậy bổn phận mà những người lính chúng
    ta thực sự có thể hoàn thành chẳng phải cũng hạn hẹp lắm sao?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000013: locks: [''Giữ tên riêng
    `Sue`, đại từ `ông` và các cụm `những đám đông dân chúng cuống cuồng tìm cách
    cứu đất nước`, `vẻ mệt mỏi tột độ trên gương mặt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000014: locks: [''Giữ đại từ `Ông`,
    cụm `những tình nguyện viên trẻ tuổi đầy phấn khởi, tràn ngập tình yêu quê hương,
    đang tập hợp trước lúc lên đường` và phần độc thoại nội tâm in nghiêng `*Họ thật
    ngây thơ… Háo hức ra trận, nhưng đến nơi rồi thì họ làm được gì chứ?*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000015: locks: [''Giữ câu thoại
    cảm thán `“Thật đáng thất vọng. Sinh ra ở một đất nước chỉ biết đòi hỏi thanh
    niên phải chết vì nó, đúng là vận rủi khủng khiếp.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000016: locks: [''Giữ các cụm `Một
    người yêu nước hẳn sẽ bật khóc.`, `bảo vệ Tổ quốc`, `lẽ ra họ phải tự hào về đất
    nước mình`, `đẩy những người trẻ tuổi vào con đường chỉ dẫn đến cái chết`, cùng
    đại từ `Họ` / `họ`, `mình` và `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000017: locks: [''Giữ câu hỏi `“Đại
    tá Sue?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000018: locks: [''Giữ đại từ trần
    thuật `ông`, câu thề nội tâm in nghiêng dùng đại từ tự quy chiếu `mình` và phó
    từ `cũng` (`*Nếu mình sẽ đưa họ đến chỗ chết, thì ít nhất mình cũng phải làm tròn
    bổn phận hết sức có thể.*`) theo DEC-P01-002, cùng câu kết `Quyết tâm hy sinh
    bản thân bắt nguồn từ tinh thần trách nhiệm và ý thức về số phận của một người
    lãnh đạo.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000019: locks: [''Giữ đúng hai
    câu độc thoại nội tâm in nghiêng theo DEC-P01-002 (`*Nếu thanh niên sẽ hy sinh
    vì Tổ quốc, thì ít nhất cũng phải có người đồng hành cùng họ trên con đường ấy,
    một người trưởng thành sẽ ngã xuống bên cạnh họ.*` và `*Sao mình có thể để họ
    chết một mình?*`) tách biệt bởi câu trần thuật `Ông quyết tâm một cách nghiêm
    nghị.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000020: locks: [''Giữ đại từ `ông`,
    `họ`, các cụm `những phụ nữ vẻ mặt lo âu, bế theo con nhỏ, đứng giữa đám đông
    đến tiễn họ`, `Nghĩ đến những người ở lại, ông cầu xin được cứu rỗi, suýt nữa
    bật thành tiếng.` và lời cầu nguyện nội tâm in nghiêng `*Bất kỳ ai, xin bất kỳ
    ai hãy chấm dứt cơn ác mộng này…*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000021: locks: [''Giữ các danh
    xưng `Cộng hòa hoặc một cường quốc nào khác`, `Liên minh Entente`, sắc thái may
    rủi `có lẽ, chỉ có lẽ thôi, ... sẽ xuất hiện đúng lúc để cứu họ`, câu hỏi tự vấn
    in nghiêng `*Nhưng liệu thật sự có thể thoát được không?*` theo DEC-P01-002, cùng
    tên riêng `Sue` và đại từ `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000022: locks: [''Giữ đại từ `Ông`,
    `họ` và câu `Ông biết họ đã thực sự bị dồn vào đường cùng, không còn lối thoát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000023: locks: [''Giữ đại từ `Họ`,
    danh xưng `Tổ quốc`, hình ảnh so sánh `những ngày cuối cùng của đất nước đang
    cạn dần từng chút một như cát trong đồng hồ cát` và câu kết `Phía trước chỉ là
    cảnh diệt vong không thể tránh khỏi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000024: locks: [''Giữ đại từ `ông`,
    sự phân biệt từ vựng `Tổ quốc` – `quê hương` trong hai câu liên tiếp, và các cụm
    `dằn vặt bởi cảm giác bất lực`, `Quyết tâm cùng chung số phận với Tổ quốc của
    ông không hề lay chuyển.`, `ông chỉ có thể rơi nước mắt đau buồn`.'']'
  non_canon: true
