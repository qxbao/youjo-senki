choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000333
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000333: terms: [''Tanya'']: pronouns_and_address:
    Tanya xưng `tôi`, gọi vị đại tá là `Ngài` kèm kính ngữ `ạ`; gọi đám tân binh là
    `đám nhóc này`; phần dẫn thoại dùng tên riêng `Tanya`.: pov_and_voice: Giọng than
    vãn bất lực của Tanya trước mặt cấp trên, lập tức chuyển sang hỏi lại lễ phép
    khi nghe vị đại tá lẩm bẩm.: modality_and_logic: Bảo toàn câu bỏ lửng đầu đoạn,
    cử chỉ vùi mặt vào hai bàn tay và câu hỏi xác nhận lời vị đại tá vừa nói.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000334
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000334: terms: [''Thiếu tá'']:
    pronouns_and_address: Vị đại tá xưng `tôi`, gọi Tanya là `cô` và `Thiếu tá`.:
    pov_and_voice: Giọng nhận xét buột miệng pha chút ngạc nhiên của vị đại tá.: modality_and_logic:
    Bảo toàn nét hài hước tình huống khi vị đại tá thấy kỳ lạ vì chính Thiếu tá Tanya
    vẫn còn quá trẻ mà lại than phiền về đám trẻ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000335: terms: [''Rhine'']: pronouns_and_address:
    Tanya xưng `tôi`, quy chiếu đám tân binh là `Mấy người` / `họ`.: pov_and_voice:
    Giọng đánh giá thực dụng, sắc lạnh của một cựu binh tiền tuyến.: modality_and_logic:
    Bảo toàn cách hiểu chữ `trẻ` theo nghĩa tuổi quân (`mới chập chững vào đời binh
    nghiệp thì vô dụng`) và điều kiện ngoại lệ (`nếu họ sống sót được hai tháng ở
    Rhine thì lại là chuyện khác`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000336
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000336: terms: []: pronouns_and_address:
    Vị đại tá xưng `tôi` và dùng đại từ bao gộp `Ta`.: pov_and_voice: Giọng lúng túng
    rút lại lời nhận xét cá nhân để quay về công việc chính.: modality_and_logic:
    Bảo toàn các từ cảm thán ngập ngừng (`À, không… ừm`), lời đề nghị bỏ qua câu vừa
    nói và chuyển lại chủ đề chính.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000337
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000337: terms: [''ngài đại tá'',
    ''cấp trên'', ''Tanya'']: pronouns_and_address: Câu 1 độc thoại nội tâm dùng `Mình`
    (`DEC-P01-001`) và `ngài đại tá`; câu 3 trần thuật ngôi thứ ba dùng `Tanya` và
    quy chiếu vị đại tá bằng `ông`.: pov_and_voice: Độc thoại nội tâm thắc mắc ngắn
    gọn của Tanya chuyển mượt sang trần thuật hạn tri mô tả tác phong phục tùng mẫu
    mực.: modality_and_logic: Bảo toàn sự chuyển dịch từ thắc mắc về thái độ lựa lời
    của vị đại tá, nhận xét khái quát về tính thất thường của cấp trên, sang hành
    động lễ phép quay lại chủ đề chính mà không hỏi vặn thêm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000338
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000338: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri dùng `Tanya` và `nó` theo đúng `DEC-P01-001`; vế so sánh khái
    quát dùng `người ta` — `mình` (phản thân).: pov_and_voice: Trần thuật hạn tri
    phân tích độ lệch nhận thức giữa góc nhìn bên ngoài và góc nhìn công sở của Tanya.:
    modality_and_logic: Bảo toàn sự đối lập giữa góc nhìn khách quan (tuổi thật của
    Tanya rất kỳ lạ) và góc nhìn chủ quan của Tanya (chỉ tính theo thâm niên phục
    vụ như số năm làm việc ở công ty).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000339
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000339: terms: [''những trận cơ
    động quy mô lớn'', ''chiến hào'']: pronouns_and_address: Tanya thưa `ngài`, dùng
    `chúng ta` cho quân mình và `họ` cho đám lính mới.: pov_and_voice: Giọng báo cáo
    tình hình chiến thuật thẳng thắn, thực tế.: modality_and_logic: Bảo toàn nhận
    định phủ định khả năng xảy ra các trận đánh cơ động quy mô lớn hiện tại và giới
    hạn nhiệm vụ của tân binh ở mức cố thủ giữ hào và bắn súng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000340: terms: [''Tanya'', ''tỷ
    lệ tổn thất'', ''chiến tranh tổng lực'', ''nguồn nhân lực'', ''các tuyến phòng
    thủ'']: pronouns_and_address: Trần thuật hạn tri quy chiếu Tanya bằng `Tanya`
    và `nó` (`DEC-P01-001`), quy chiếu phía thượng cấp bằng `họ`, và lược đại từ ngôi
    thứ hai phiếm chỉ.: pov_and_voice: Trần thuật hạn tri trình bày thế giới quan
    duy lý tàn nhẫn của Tanya về chiến tranh tiêu hao.: modality_and_logic: Bảo toàn
    toàn bộ lập luận: tỷ lệ tổn thất sẽ giảm khi lính quen dần; bản chất chiến tranh
    tổng lực là cuộc đua nghiền nát nguồn nhân lực; cấp trên đang quá lo về tác động
    lên chiến tuyến; và chừng nào tổn thất chưa làm suy giảm năng lực tiếp tục chiến
    đấu của tổ chức thì đều có thể bỏ qua.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000341
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000341: terms: [''Phía Tây không
    có gì lạ'']: pronouns_and_address: Trần thuật hạn tri không dùng đại từ nhân xưng.:
    pov_and_voice: Giọng bình luận hài đen mượn điển cố điện ảnh.: modality_and_logic:
    Bảo toàn giả định trái thực tế: nếu quân số gục ngã nhanh như trong bộ phim về
    Thế chiến thứ nhất thì chiến trường cũng sẽ rơi vào cảnh im ắng đúng như tên phim.:
    emphasis: Bảo toàn chính xác 1 cụm `*...*` tương ứng `<html:em>` cho tên tác phẩm
    `*Phía Tây không có gì lạ*` (`DEC-P01-002`).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000342
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000342: terms: [''sư đoàn'', ''Chiến
    tranh Nga–Nhật'', ''súng máy'', ''pháp sư'', ''thương vong'', ''lính mới'']: pronouns_and_address:
    Độc thoại nội tâm lược đại từ `we` để giữ giọng nhận định chiến thuật khách quan,
    quy chiếu quân địch là `họ`.: pov_and_voice: Giọng phân tích chiến thuật tự tin
    pha sự thực dụng của người chỉ huy.: modality_and_logic: Bảo toàn mệnh đề nhượng
    bộ giả định (dù địch dùng cả sư đoàn đánh đêm như Chiến tranh Nga–Nhật thì súng
    máy và pháp sư yểm trợ vẫn dễ dàng đẩy lùi) và kết luận thực tế (vẫn phải chấp
    nhận một mức thương vong trong giới hạn cho phép khi lính mới còn đang học việc).:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000343
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000343: terms: []: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `mình` theo đúng `DEC-P01-001`, quy chiếu binh
    sĩ là `họ`.: pov_and_voice: Độc thoại nội tâm vị kỷ nhưng lý tính của Tanya.:
    modality_and_logic: Bảo toàn cả hai vế phủ định bổ sung cho nhau: lý do sâu xa
    là bản thân Tanya không phải người sẽ bỏ mạng, nhưng cũng không có nghĩa là muốn
    họ chết nếu có thể tránh được.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000344
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000344: terms: [''trận cơ động
    quy mô lớn'', ''huấn luyện'']: pronouns_and_address: Vị đại tá gọi Tanya là `cô`
    và dùng `ta` cho phía quân đội Đế quốc.: pov_and_voice: Giọng tán đồng về mặt
    lý trí nhưng còn day dứt của vị đại tá.: modality_and_logic: Bảo toàn sự đồng
    tình với nhận định chiến thuật của Tanya và liên từ bỏ lửng `nhưng…` mở đường
    cho nỗi trăn trở ở các đoạn sau.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000345
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000345: terms: [''ngài đại tá'',
    ''Tanya'']: pronouns_and_address: Trần thuật hạn tri dùng `ngài đại tá` và `Tanya`.:
    pov_and_voice: Trần thuật hạn tri ghi nhận việc lập luận của Tanya không bị bác
    bỏ.: modality_and_logic: Bảo toàn mệnh đề phủ định: rốt cuộc vị đại tá không đưa
    ra ý kiến nào bác bỏ lời Tanya.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000346
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000346: terms: []: pronouns_and_address:
    Trần thuật hạn tri quy chiếu vị đại tá bằng `ông`.: pov_and_voice: Trần thuật
    mô tả sự giằng xé nội tâm của vị sĩ quan tham mưu có lương tâm.: modality_and_logic:
    Bảo toàn nội dung cảm xúc toát ra từ lời đáp đau đớn của vị đại tá: cảm giác sai
    trái không sao rũ bỏ được và sự căm ghét lối đánh nướng quá nhiều sinh mạng trẻ.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000347
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000347: terms: [''giao tranh nhỏ'',
    ''tổn thất'', ''tinh thần binh sĩ'']: pronouns_and_address: Vị đại tá dùng `chúng
    ta`.: pov_and_voice: Giọng trăn trở, lo âu của người làm công tác tham mưu chiến
    dịch.: modality_and_logic: Bảo toàn cấu trúc nối tiếp từ `p000344` (`…chúng ta
    cũng không thể làm ngơ...`), sự tích tụ của những tổn thất nhỏ và hệ quả đáng
    ngại nhất là sự suy sụp tinh thần binh sĩ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000348: terms: [''giao tranh nhỏ'',
    ''tổn thất'']: pronouns_and_address: Câu thoại của Tanya không dùng đại từ nhân
    xưng.: pov_and_voice: Giọng phản biện khô khan, thuần túy dựa trên quy mô con
    số.: modality_and_logic: Bảo toàn lập luận điều kiện của Tanya: nếu chỉ là giao
    tranh nhỏ thì không lý nào lại gây ra quá nhiều tổn thất.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000349
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000349: terms: [''Tanya'', ''tổn
    thất'', ''tỷ lệ thương vong'', ''Thế chiến thứ nhất'']: pronouns_and_address:
    Trần thuật hạn tri dùng tên riêng `Tanya`, quy chiếu người bình thường ở thế giới
    này bằng `người bình thường` / `họ`.: pov_and_voice: Độc thoại nội tâm chuyển
    sang trần thuật hạn tri tự nhận thức về sự lệch chuẩn trong thước đo thương vong
    của Tanya.: modality_and_logic: Bảo toàn bước ngoặt nhận thức (`Khoan đã`), phép
    so sánh với Thế chiến thứ nhất khiến các vụ đụng độ hiện tại trông thật nhỏ bé,
    và sự đối조 với người bình thường (dù có biết cũng không lấy Thế chiến thứ nhất
    làm thước đo, còn nếu không biết thì ắt sẽ rùng mình trước những con số không
    tưởng đó).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000350
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000350: terms: [''cuộc tập kích
    quấy rối'']: pronouns_and_address: Tanya xưng `tôi` trong lời thoại với vị đại
    tá.: pov_and_voice: Giọng bình thản đến vô cảm khi nói về sinh mạng binh lính.:
    modality_and_logic: Bảo toàn lập luận khắc nghiệt của Tanya rằng các cuộc tập
    kích quấy rối cùng lắm chỉ giết những kẻ đằng nào cũng chết nên không có gì to
    tát.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000351
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000351: terms: [''đại đội bộ binh'',
    ''tập kích bất ngờ'', ''pháp sư'', ''đợt tập kích quấy rối quy mô tiểu đoàn'',
    ''thương vong'', ''Đế quốc'']: pronouns_and_address: Trần thuật hạn tri / độc
    thoại phân tích chiến thuật không dùng đại từ nhân xưng.: pov_and_voice: Giọng
    ước tính rủi ro – chi phí quân sự chuẩn xác.: modality_and_logic: Bảo toàn chuỗi
    suy luận: đột kích lớn quá mạo hiểm nên địch tối đa chỉ dùng một đại đội bộ binh
    đánh lén hoặc một tiểu đoàn pháp sư tập kích quấy rối; với quy mô đó thì thương
    vong của phía Đế quốc không thể cao bất thường.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000352
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000352: terms: [''Tanya'']: pronouns_and_address:
    Trần thuật hạn tri dùng tên riêng `Tanya`.: pov_and_voice: Trần thuật hạn tri
    nối kết suy nghĩ nội tâm với hành động đời thường trong phòng họp.: modality_and_logic:
    Bảo toàn lời tự rào đón cho nhận định vừa nêu và chi tiết Tanya uống cạn tách
    cà phê dở tệ rồi ăn kẹo bạc hà để khử vị.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000353
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000353: terms: [''cựu binh'', ''lính
    mới'', ''Tỷ lệ tổn thất'', ''binh sĩ bổ sung'', ''cuộc chiến Dacia'']: pronouns_and_address:
    Độc thoại nội tâm của Tanya dùng `mình` (`đơn vị mình`) theo đúng `DEC-P01-001`,
    quy chiếu cựu binh/lính mới bằng `họ`, và lược đại từ ngôi thứ hai phiếm chỉ ở
    câu cuối.: pov_and_voice: Độc thoại nội tâm tổng kết kinh nghiệm chỉ huy thực
    chiến.: modality_and_logic: Bảo toàn đầy đủ các ý: khoảng cách giữa cựu binh và
    tân binh nằm ở trải nghiệm thực chiến; đơn vị của Tanya có tỷ lệ tổn thất thấp
    nhất nhưng lính bổ sung từ đơn vị khác cũng đang dần bị thương; và sự đối lập
    giữa những người may mắn được làm quen chiến trường ở cuộc chiến Dacia dễ dàng
    với những tân binh phải nếm trải mặt trận Rhine khốc liệt ngay lần đầu.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000354
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000354: terms: [''Thiếu tá von
    Degurechaff'', ''tỷ lệ tổn thất'']: pronouns_and_address: Vị đại tá gọi `Thiếu
    tá von Degurechaff` và `cô`.: pov_and_voice: Giọng đặt vấn đề lịch sự, chuẩn bị
    giao nhiệm vụ huấn luyện thực địa cho Tanya.: modality_and_logic: Bảo toàn câu
    hỏi gợi ý rằng sự hướng dẫn và chỉ đạo của Tanya có thể giúp kéo giảm tỷ lệ tổn
    thất.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000355
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000355: terms: []: pronouns_and_address:
    Tanya gọi vị đại tá là `ngài`, tự xưng `tôi`, và quy chiếu đám tân binh là `những
    người lần đầu ra trận này` / `họ`.: pov_and_voice: Giọng nhận lệnh chuẩn mực của
    một sĩ quan cấp dưới đi kèm quan điểm huấn luyện thực tế.: modality_and_logic:
    Bảo toàn cam kết sẵn sàng dốc hết sức nếu có lệnh, kèm khẳng định rằng giải pháp
    duy nhất cho số lính mới lần đầu ra trận là phải kèm cặp từng bước một.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000356
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000356: terms: [''lính bắn tỉa'',
    ''chiến hào'', ''pháo dã chiến'', ''hỏa lực tập trung'', ''pháo hạng nặng cỡ lớn'',
    ''bê tông cốt thép'', ''nhân viên vô tuyến'', ''lô cốt'']: pronouns_and_address:
    Độc thoại nội tâm của Tanya lược đại từ ngôi thứ hai phiếm chỉ và quy chiếu đám
    tân binh bằng `họ`.: pov_and_voice: Độc thoại nội tâm sắc lạnh, thực tế về phương
    pháp huấn luyện trực quan trên chiến trường.: modality_and_logic: Bảo toàn hai
    ví dụ đối chiếu sinh động: chỉ vào một kẻ ngốc bị bắn tỉa hiệu quả hơn lời nhắc
    suông không được thò đầu ra; và bắt tân binh đi đào xác những nhân viên vô tuyến
    bị chôn sống chết ngạt trong lô cốt bị trọng pháo bắn sập sẽ giúp họ khắc cốt
    ghi tâm việc không được tụ tập hết vào một chỗ.: emphasis: Bảo toàn chính xác
    2 cụm `*...*` tương ứng `<html:em>` (`*Đừng thò đầu ra!*` và `*nên đừng có chui
    hết vào cùng một chỗ!*`) theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000357
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000357: terms: [''Tanya'', ''tiểu
    đoàn'', ''Rhine'']: pronouns_and_address: Hai câu đầu lược đại từ ngôi thứ hai
    phiếm chỉ; câu cuối trần thuật ngôi thứ ba dùng tên riêng `Tanya`.: pov_and_voice:
    Độc thoại nội tâm chuyển sang trần thuật hạn tri khép lại đoạn hồi tưởng và nối
    lại với quyết định huấn luyện thực địa ở đầu chương.: modality_and_logic: Bảo
    toàn phép loại suy với việc dạy viết bảng chữ cái từng bước A-B-C và kết luận
    bất ngờ của Tanya rằng ngay cả tiểu đoàn của mình cũng còn một số bài học thực
    tế ở Rhine chưa từng trải qua.: emphasis: none'
