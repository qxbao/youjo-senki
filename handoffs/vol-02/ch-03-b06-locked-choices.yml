choices:
- segment_id: YS-LN02/Text/part0016.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000120: locks: [''Giữ định danh
    đã chuẩn hóa ở F7 `phía Tình báo` (theo `vol02-ch03-b06-intelligence-commando-company`
    và `vol02-ch03-b05-staff-departments`), đại từ `họ`, và toàn văn câu `Lời nài
    nỉ từ phía Tình báo chỉ đổi lại được một câu trả lời phá hỏng tính toán của họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000121: locks: [''Giữ đại từ nhất
    quán đã sửa ở F2 `cô ta` xuyên suốt cả hai câu (theo `vol02-ch03-b06-schreise-tanya-reference`),
    đại từ `họ`, cấu trúc giả định phản thực quá khứ `Nếu cô ta chẳng lập được công
    trạng gì, họ đã có thể đuổi cô ta đi vì rõ ràng chỉ là một con nhóc chẳng biết
    gì về chiến trường.`, tên riêng `Schreise`, và câu kết `Thành tích của cô ta thật
    phi thường.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000122: locks: [''Giữ các định
    danh đã chuẩn hóa ở F8 `Cụm tập đoàn quân Trung ương`, `các cụm tập đoàn quân
    khu vực`, `Trung ương` (theo `vol02-ch03-b06-central-army-group`), `Rudersdorf`,
    `Schreise`, `học viện chiến tranh` (theo `vol02-ch03-b06-war-college`), `Thượng
    tướng von Wragell` (theo `vol02-ch03-b06-colonel-general`), `tư lệnh Cụm tập đoàn
    quân phương Bắc` (theo `vol02-ch03-b06-northern-army-group`), cùng các đại từ
    `họ` và `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000123: locks: [''Giữ các định
    danh `vị cựu binh lâu năm bảo vệ miền Bắc`, `Liên minh Entente`, `quê hương, tổ
    quốc ông`, `Bộ Tổng tham mưu`, `Schreise`, và đại từ `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000124: locks: [''Giữ đại từ ngôi
    thứ hai `cô` / `Cô`, đại từ phản thân `mình`, và toàn văn hai câu thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000125: locks: [''Giữ cấu trúc
    lược chủ ngữ đã sửa ở F3 (không dùng `ta`), các cụm `Số địch bị xác nhận tiêu
    diệt còn chưa bằng quân số một đại đội` (theo `vol02-ch03-b06-intelligence-commando-company`),
    và `Nói đúng hơn, chỉ vừa đủ đẩy lui chúng hơn là đánh bại.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000126: locks: [''Giữ các định
    danh đã chuẩn hóa ở F10 `Các sĩ quan tham mưu pháp sư` (theo `vol02-ch03-b06-mage-staff`),
    `Degurechaff`, `Cụm tập đoàn quân phương Bắc` (theo `vol02-ch03-b06-northern-army-group`),
    `Quân Trung ương` (theo `vol02-ch03-b06-central-army-group`), cụm trung tính `gián
    tiếp nhấn mạnh rằng tiểu đoàn của cô đã đẩy lui quân địch`, và đại từ `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000127: locks: [''Giữ nguyên độ
    mở quy chiếu của đại từ `Họ` / `họ` kết hợp phản thân `mình`, đại từ `Ông` (chỉ
    Schreise), định danh `binh sĩ Quân Trung ương` (theo `vol02-ch03-b06-central-army-group`),
    và cụm `đánh bại một tiểu đoàn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000128: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng câu cuối `*Các anh mắc nợ họ, mau bảo cô ta im đi!*` theo
    `DEC-P01-002`, tên riêng `Schreise`, thuật ngữ `các sĩ quan tham mưu pháp sư`
    (theo `vol02-ch03-b06-mage-staff`), và các đại từ `Các anh`, `họ`, `cô ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000129: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng duy nhất ở câu nội tâm `*Xin cô hiểu ý cấp trên và bớt
    cứng rắn đi!*` theo `DEC-P01-002` (không thêm chữ nghiêng cho các câu hỏi tu từ
    xen kẽ hay lời thoại trong ngoặc kép), các định danh đã chuẩn hóa ở F6/F12 `sĩ
    quan tham mưu` (theo `vol02-ch03-b06-mage-staff`), `Degurechaff` / `Thiếu tá von
    Degurechaff`, `một đại đội` / `đại đội ấy`, `đơn vị pháp sư biệt kích duy nhất
    của địch` (theo `vol02-ch03-b06-intelligence-commando-company`), `trung đoàn`,
    `các tuyến tiếp tế`, `Tiểu đoàn Pháp sư Không quân 203` (theo `vol02-ch03-b06-aerial-mage-battalion`),
    cùng các đại từ `anh ta`, `cô` / `Cô`, `chúng ta`, `tôi`, `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000130: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu nội tâm giữa đoạn `*Dù tôi không nghe theo những
    lời cảnh báo của cô, tôi vẫn trân trọng Tiểu đoàn Pháp sư Không quân 203.*` theo
    `DEC-P01-002`, cùng toàn bộ các thuật ngữ đã sửa ở F4/F6 `Tiểu đoàn Pháp sư Không
    quân 203` (theo `vol02-ch03-b06-aerial-mage-battalion`), `Một sĩ quan cấp tá cấp
    cao` (theo `vol02-ch03-b06-field-officer`), `dây tham mưu`, `thiếu tá`, `phù hiệu
    tham mưu` (theo `vol02-ch03-b06-staff-braid-badge`), và các đại từ `Anh ta`, `cô`,
    `tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000131: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn `*Xin hãy hợp tác với tôi lần này.*` theo `DEC-P01-002`
    và đại từ ngôi thứ nhất `tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000132: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff`, các đại từ `Anh ta`, `anh`, `cô` / `Cô`, và toàn văn
    hai câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000133: locks: [''Giữ đại từ ngôi
    thứ nhất `Tôi` và toàn văn câu thoại `“Tôi thật chẳng biết phải đáp lại lời khen
    quá lời này thế nào.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000134: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn `*Cô ta hiểu ý chưa vậy?*` theo `DEC-P01-002`
    và đại từ `Cô ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000135: locks: [''Giữ nguyên câu
    trần thuật bỏ lửng `Phải, đúng lúc mọi người đang thở phào nhẹ nhõm và bầu không
    khí căng thẳng bắt đầu dịu xuống thì…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000136: locks: [''Giữ đại từ `tôi`,
    `họ`, các thuật ngữ `các đơn vị chỉ huy của quân đội Liên minh Entente`, `gồm
    cả bộ binh lẫn pháp sư`, `việc hạ một đại đội`, và cấu trúc phủ định `nên tôi
    không nghĩ việc hạ một đại đội sẽ cản trở hoạt động của họ được bao nhiêu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000137: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff`, đại từ `cô`, và câu hỏi `“…Thiếu tá von Degurechaff,
    ý cô là sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000138: locks: [''Giữ kính ngữ
    mở đầu `Thưa ngài`, sự đối lập phạm vi đã sửa ở F5 giữa `quân ta đã vất vả bào
    mòn và cô lập` (lực lượng chung) với `tiểu đoàn tôi` / `Tiểu đoàn tôi` (lực lượng
    riêng của Tanya), cùng các cụm `các cuộc giao tranh cục bộ`, `kẻ địch đã suy yếu
    sau nhiều trận liên tiếp`, và `hứng chịu mũi tấn công chính của chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000139: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu hỏi đầu và hướng đối tượng trung tính đã sửa ở F1
    `*Đến cả kẻ địch đã suy yếu mà cũng không đẩy lui nổi sao?*` theo `DEC-P01-002`
    và quy tắc pilot-01 (tuyệt đối không thêm chủ ngữ `cô` tự chỉ Tanya), kết hợp
    phần trần thuật để thường `Cô dường như muốn nói vậy, với chút ác ý. Có lẽ cô
    không cố ý.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000140: locks: [''Giữ câu thoại
    `“…Cô khiêm tốn quá nhỉ?”`, thuật ngữ `một sĩ quan tham mưu` (theo `vol02-ch03-b06-mage-staff`),
    và vế miêu tả đã sửa ở F14 `khóe miệng nhếch thành nụ cười chế giễu hơn là cười
    thật.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000141
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000141: locks: [''Giữ các đại từ
    `họ`, `cô`, và các cụm `làm mất hòa khí trong nhóm sĩ quan`, `truyền thống sĩ
    quan tham mưu mà Đế quốc, Đế chế, vẫn luôn tự hào` (theo `vol02-ch03-b06-mage-staff`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000142
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000142: locks: [''Giữ câu thoại
    `“Không, thưa Đại tá. Tôi chỉ trả lời dựa trên sự thật.”`, danh xưng `Thiếu tá
    von Degurechaff`, động từ đã sửa ở F15 `trừng mắt nhìn các sĩ quan tham mưu cấp
    cao` (theo `vol02-ch03-b06-mage-staff`), và câu kết mỉa mai `Dù sao, nhìn cấp
    trên vào mắt khi thưa chuyện cũng là phép tắc đúng mực.`.'']'
  non_canon: true
