segment_id_end: YS-LN02/Text/part0030.xhtml/p000035
choices:
- segment_id: YS-LN02/Text/part0030.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000001: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của phóng viên Andrew mở đầu chương trình dùng `tôi`.: pov_and_voice:
    Giọng tâm sự trầm lắng mở đầu buổi phát sóng tưởng niệm hàng năm.: modality_and_logic:
    Bảo toàn trạng thái lặp lại theo chu kỳ hàng năm: cứ vào khoảng thời gian này
    trong năm là lại cảm thấy buồn bã.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000002: terms: []: pronouns_and_address:
    Andrew chào khán giả truyền hình bằng danh xưng trang trọng `quý vị`.: pov_and_voice:
    Lời chào mở đầu chuẩn mực của người dẫn chương trình truyền hình buổi tối.: modality_and_logic:
    Bảo toàn lời chào buổi tối gửi tới toàn thể khán giả.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000003: terms: [''Andrew'', ''phóng
    viên đặc biệt'', ''WTN'']: pronouns_and_address: Andrew tự giới thiệu bằng đại
    từ ngôi thứ nhất `Tôi`.: pov_and_voice: Giọng tự giới thiệu danh tính và chức
    danh báo chí chuyên nghiệp.: modality_and_logic: Bảo toàn định danh Andrew là
    phóng viên đặc biệt của đài WTN.: emphasis: Bảo toàn dấu nhấn mạnh `*WTN*` tương
    ứng thẻ `<html:em>` trong nguồn theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000004: terms: [''bộ phim tài liệu'']:
    pronouns_and_address: Andrew đại diện cho ê-kíp chương trình / nhà đài dùng đại
    từ ngôi thứ nhất số nhiều `chúng tôi`.: pov_and_voice: Nhịp ngập ngừng bằng dấu
    chấm lửng ở đầu câu trước khi thông báo thay đổi nội dung phát sóng thường kỳ.:
    modality_and_logic: Bảo toàn phủ định ở tương lai gần: hôm nay không phát sóng
    bộ phim tài liệu thường lệ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000005: terms: [''chiến tranh'',
    ''chương trình phát sóng tưởng niệm'']: pronouns_and_address: Dùng đại từ gộp
    ngôi thứ nhất số nhiều `Chúng ta` bao hàm cả người dẫn và khán giả.: pov_and_voice:
    Giọng dẫn trang nghiêm xác lập tính chất tưởng niệm của chương trình.: modality_and_logic:
    Bảo toàn sự đối chiếu: vẫn nhìn lại những gì xảy ra trong chiến tranh nhưng hôm
    nay thực hiện điều đó cùng lời cầu nguyện như một chương trình phát sóng tưởng
    niệm.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000006: terms: [''biến động'',
    ''vùng Arene-Roygen'', ''tư liệu lưu trữ'', ''vùng bị chiếm đóng'', ''Quân đội
    Đế quốc'', ''quy tắc đạo đức'']: pronouns_and_address: Gọi khán giả là `quý vị`,
    tự xưng đại diện nhà đài là `chúng tôi`.: pov_and_voice: Giọng thuyết minh truyền
    hình vừa giới thiệu tư liệu lịch sử vừa đưa ra cảnh báo nội dung nhạy cảm theo
    chuẩn mực phát sóng.: modality_and_logic: Bảo toàn đầy đủ 5 câu: dẫn vào biến
    động vùng Arene-Roygen; giới thiệu đoạn phim lưu trữ quý giá cảnh cư dân vùng
    chiếm đóng nổi dậy chống Quân đội Đế quốc; cảnh báo có nhiều cảnh bạo lực; câu
    hỏi tu từ chuyện gì đã xảy ra thời kỳ ấy; và lý do được cấp phép phát sóng theo
    quy tắc đạo đức (nhằm đối diện sự thật) kèm khuyến cáo khán giả cân nhắc trước
    khi xem.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000007: terms: [''Nhà thờ chính
    tòa Karelian'', ''thảm kịch'']: pronouns_and_address: Gọi khán giả là `quý vị`
    và dùng đại từ gộp `chúng ta`.: pov_and_voice: Giọng tương tác trực tiếp với người
    xem truyền hình và chỉ dẫn chi tiết trên khung hình.: modality_and_logic: Bảo
    toàn câu hỏi duy trì kết nối với khán giả, chỉ dẫn hình ảnh Nhà thờ chính tòa
    Karelian ở góc trên bên phải màn hình, và báo trước đây là hiện trường thảm kịch
    sẽ bàn tới ở phần sau.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000008: terms: [''lễ tưởng niệm'',
    ''cuộc đàn áp'', ''đại sứ'']: pronouns_and_address: Dùng đại từ gộp `chúng ta`
    xuyên suốt.: pov_and_voice: Giọng dẫn chuyển cảnh trực tiếp sang điểm cầu tổ chức
    lễ tưởng niệm.: modality_and_logic: Bảo toàn 3 câu: rút ngắn lời dẫn nhập vì đã
    kết nối tới địa điểm lễ tưởng niệm; giới thiệu hình ảnh lễ tưởng niệm các nạn
    nhân cuộc đàn áp; và nhấn mạnh điểm mới của năm nay là sự hiện diện của đại sứ
    các nước.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000009: terms: [''tiến trình hòa
    giải'', ''lễ tưởng niệm'']: pronouns_and_address: Dùng đại từ gộp `chúng ta`.:
    pov_and_voice: Giọng bình luận chính trị – ngoại giao ôn hòa, ghi nhận bước tiến
    hậu chiến.: modality_and_logic: Bảo toàn quan hệ nhượng bộ – đối lập: tranh cãi
    vẫn tiếp diễn, nhưng đáng mừng là tiến trình hòa giải đã đạt tới mức hai quốc
    gia cùng tổ chức lễ tưởng niệm chung.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000010: terms: [''Nhà thờ chính
    tòa Karelian'']: pronouns_and_address: Quy chiếu ban tổ chức / phía thành phố
    bằng `họ`.: pov_and_voice: Giọng thuyết minh giàu cảm xúc tôn vinh nỗ lực tái
    thiết của người dân.: modality_and_logic: Bảo toàn ý nghĩa cột mốc đáng nhớ: lễ
    khánh thành Nhà thờ chính tòa Karelian mới do chính tay người dân dựng lại từ
    đống đổ nát.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000011: terms: [''Thành phố Arene'',
    ''tái thiết'']: pronouns_and_address: Không dùng đại từ nhân xưng; quy chiếu cư
    dân bằng `người dân nơi đây`.: pov_and_voice: Giọng tóm lược chủ đề giàu chất
    tự sự của phim tài liệu.: modality_and_logic: Bảo toàn sự đối lập giữa quá khứ
    (Arene chìm trong biển lửa) và hành trình vượt qua đau thương để tái thiết của
    người dân.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000012: terms: [''thảm kịch thời
    chiến'']: pronouns_and_address: Dùng đại từ gộp `chúng ta`.: pov_and_voice: Lời
    chốt phần mở đầu định hướng góc nhìn nhân văn hướng tới tương lai.: modality_and_logic:
    Bảo toàn mục đích của buổi thảo luận tối nay: bàn về thảm kịch thời chiến đồng
    thời hướng tới những người đang suy nghĩ về tương lai.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000013: terms: [''Arene'']: pronouns_and_address:
    Câu thuyết minh hình ảnh không dùng đại từ nhân xưng.: pov_and_voice: Câu ngắn,
    cô đọng giới thiệu cảnh quay hiện trường ngay sau sự kiện.: modality_and_logic:
    Bảo toàn thời điểm (`ngay sau thảm họa`) và trạng thái đổ nát (`tan hoang`) của
    Arene.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000014: terms: [''phát thanh viên'',
    ''Liên hiệp Waldstätte'', ''quốc gia trung lập'']: pronouns_and_address: Không
    dùng đại từ nhân xưng.: pov_and_voice: Giọng thuyết minh cung cấp nguồn gốc xuất
    xứ của tư liệu lịch sử.: modality_and_logic: Bảo toàn thông tin đoạn phim được
    một phát thanh viên từ Liên hiệp Waldstätte—một trong số ít quốc gia trung lập—bí
    mật ghi lại.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000015: terms: [''tiền cảnh'',
    ''Nhà thờ chính tòa Karelian'']: pronouns_and_address: Andrew hỏi trực tiếp khán
    giả bằng danh xưng `Quý vị`.: pov_and_voice: Câu hỏi hướng dẫn người xem nhận
    diện công trình biểu tượng đã bị phá hủy trong khung hình.: modality_and_logic:
    Bảo toàn câu hỏi trực tiếp: liệu khán giả có nhận ra tòa nhà sập một phần ở tiền
    cảnh chính là Nhà thờ chính tòa Karelian màu trắng nổi tiếng hay không.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000016: terms: [''du kích'', ''đụng
    độ quân sự'', ''Arene'', ''Đế quốc'', ''cuộc nổi dậy toàn diện'', ''Quân đội Đế
    quốc'', ''bạo loạn chống Đế quốc'']: pronouns_and_address: Trần thuật lịch sử
    khách quan, quy chiếu Quân đội Đế quốc bằng `họ` ở mệnh đề cuối.: pov_and_voice:
    Giọng thuyết minh tái hiện tiến trình leo thang nhanh chóng từ truy quét du kích
    thành nổi dậy toàn thành phố.: modality_and_logic: Bảo toàn trọn vẹn 4 câu: khởi
    nguồn từ cuộc truy quét du kích biến thành đụng độ quân sự; truyền thống kiên
    quyết chống Đế quốc của Arene; chưa đầy một ngày từ đụng độ lẻ tẻ đã bùng phát
    thành nổi dậy toàn diện; và thông tin được kể lại (`Theo lời kể`) rằng Quân đội
    Đế quốc bàng hoàng trước báo cáo bạo loạn lan rộng và mất quyền kiểm soát thành
    phố.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000017: terms: [''tuyến tiếp tế'',
    ''Đại quân'', ''mặt trận'']: pronouns_and_address: Câu trích dẫn nhận định chiến
    lược không dùng đại từ nhân xưng.: pov_and_voice: Trích dẫn nhận định quân sự
    nghiêm trọng của phía Đế quốc.: modality_and_logic: Bảo toàn tình thái cảnh báo
    nguy cơ (`có thể khiến... sụp đổ`) đối với các tuyến tiếp tế nuôi Đại quân ngoài
    mặt trận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000018: terms: [''quân đội'', ''mặt
    trận'']: pronouns_and_address: Quy chiếu tập thể quân đội bằng `họ`.: pov_and_voice:
    Giọng thuyết minh giải thích động cơ dẫn tới phản ứng tàn nhẫn của quân đội Đế
    quốc.: modality_and_logic: Bảo toàn chuỗi nhân quả: từ nhận định ở `p000017`,
    quân đội sợ mặt trận nơi họ đã dốc cả thể xác lẫn tinh thần bị sụp đổ, nên đã
    đáp trả không chút khoan dung.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000019: terms: [''bạo loạn chống
    Đế quốc'', ''Arene'', ''Thiếu tướng von Zettour'', ''Thiếu tướng von Rudersdorf'',
    ''Cục Tác chiến'', ''Bộ Tổng tham mưu Lục quân Đế quốc'', ''bộ phận Hậu cần'',
    ''Tác chiến'']: pronouns_and_address: Trần thuật biên niên sử định danh đầy đủ
    cấp bậc (kèm chú thích thời điểm `khi ấy`) và họ tên các tướng lĩnh tham mưu.:
    pov_and_voice: Giọng thuyết minh lịch sử tái hiện quy trình ra quyết định khẩn
    cấp tại Bộ Tổng tham mưu Đế quốc.: modality_and_logic: Bảo toàn chính xác vai
    trò từng bên trong 3 câu: Thiếu tướng von Zettour (khi ấy) đề xuất biện pháp “đối
    phó” nhanh chóng và tàn khốc; Thiếu tướng von Rudersdorf thuộc Cục Tác chiến lập
    tức triệu tập họp khẩn Bộ Tổng tham mưu Lục quân Đế quốc và thông qua chiến dịch
    như đề xuất chung của Hậu cần và Tác chiến; qua đó quân đội được phép đưa binh
    lực vào thành phố.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000020: terms: [''Lục quân Đế quốc'',
    ''quân đội'', ''lực lượng cảnh sát'']: pronouns_and_address: Trần thuật khách
    quan không dùng đại từ nhân xưng.: pov_and_voice: Giọng phân tích nhấn mạnh tâm
    điểm tranh cãi pháp lý – lịch sử kéo dài đến hiện tại.: modality_and_logic: Bảo
    toàn cấu trúc tương phản cốt lõi: Lục quân Đế quốc không chút do dự chọn giành
    quyền kiểm soát thành phố bằng quân đội chứ không phải lực lượng cảnh sát.: emphasis:
    Bảo toàn dấu nhấn mạnh `*quân đội chứ không phải lực lượng cảnh sát*` tương ứng
    thẻ `<html:em>` trong nguồn theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000021: terms: [''Đế quốc'', ''cuộc
    nổi dậy'', ''chiến tranh phi chính quy'', ''Lục quân Đế quốc'', ''du kích'']:
    pronouns_and_address: Dùng chủ ngữ khái quát `người ta` và quy chiếu lực lượng
    du kích bằng `họ`.: pov_and_voice: Giọng thuyết minh phân biệt rõ mức độ nhận
    định chung của dư luận/giới quan sát với sự suy đoán về mệnh lệnh tác chiến.:
    modality_and_logic: Bảo toàn hai tầng tình thái (`người ta thường cho rằng` và
    `cũng có suy đoán rằng`) cùng cặp đối lập mục tiêu (`tiêu diệt du kích chứ không
    phải trấn áp họ`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000022: terms: [''Đế quốc'', ''hoạt
    động du kích'', ''luật chiến tranh'']: pronouns_and_address: Dùng danh ngữ khái
    quát `người ta` cho chủ thể chịu hệ quả pháp lý.: pov_and_voice: Giọng thuật lại
    lập luận pháp lý của phía Đế quốc vào thời điểm xảy ra sự việc.: modality_and_logic:
    Bảo toàn lập luận của Đế quốc khi ấy: tham gia hoạt động du kích hoặc hỗ trợ các
    hoạt động đó đồng nghĩa với việc đánh mất quyền được luật chiến tranh bảo vệ.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000023: terms: [''Arene'']: pronouns_and_address:
    Câu trần thuật chuyển cảnh không dùng đại từ nhân xưng.: pov_and_voice: Câu đơn
    ngắn gọn khép lại phần nguyên nhân để chuyển sang thảm cảnh thực tế tại Arene.:
    modality_and_logic: Bảo toàn hệ quả tức thì: ngọn lửa nhanh chóng bao trùm Arene.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000024: terms: [''lời chứng'',
    ''Arene'', ''biểu tình'']: pronouns_and_address: Dùng đại từ gộp `chúng ta`, quy
    chiếu những người dân thoát nạn bằng `Họ` và phản thân `mình`.: pov_and_voice:
    Giọng dẫn chương trình giới thiệu lời nhân chứng sống sót từ phía người dân Arene.:
    modality_and_logic: Bảo toàn lời kể gián tiếp mang cấu trúc phủ định – đối lập
    của nhân chứng: họ khẳng định mình không nổi loạn mà chỉ là các cuộc biểu tình
    đã trở nên căng thẳng hơn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000025: terms: [''Đế quốc'']: pronouns_and_address:
    Lược đại từ tân ngữ sau động từ `cho thấy` một cách tự nhiên trong tiếng Việt.:
    pov_and_voice: Nhịp trầm ngâm sau dấu chấm lửng để đối chiếu lời nhân chứng với
    thực tế lịch sử tàn khốc.: modality_and_logic: Bảo toàn mệnh đề nhượng bộ: bất
    kể mọi chuyện khởi đầu như thế nào, lịch sử cho thấy phản ứng của Đế quốc là vô
    cùng dữ dội.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000026: terms: [''pháp sư'', ''cấp
    tiểu đoàn'']: pronouns_and_address: Dùng đại từ gộp `chúng ta`.: pov_and_voice:
    Giọng thuyết minh thận trọng nêu rõ giới hạn tư liệu trước khi đưa ra ước tính
    quy mô binh lực.: modality_and_logic: Bảo toàn nguyên nhân thiếu chi tiết (một
    số tài liệu thất lạc, số khác vẫn bị mật hóa) và mức độ bất định về quy mô lực
    lượng pháp sư tấn công đầu tiên (cấp tiểu đoàn, thậm chí có thể lớn hơn).: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000027: terms: [''cơn bão pháp
    sư'']: pronouns_and_address: Không dùng đại từ nhân xưng.: pov_and_voice: Giọng
    thuyết minh giàu hình ảnh khắc họa sự chênh lệch áp đảo của đòn tấn công mở màn.:
    modality_and_logic: Bảo toàn trình tự và đánh giá: sau lời cảnh báo gần như chẳng
    đáng gọi là cảnh báo, người dân lập tức phải hứng chịu một cơn bão pháp sư.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000028: terms: []: pronouns_and_address:
    Lời nhân chứng quy chiếu các pháp sư Đế quốc bằng `Họ`.: pov_and_voice: Trích
    dẫn trực tiếp lời chứng đầy ám ảnh của người sống sót.: modality_and_logic: Bảo
    toàn phép so sánh trong lời nhân chứng: bắn gục người dân như thể họ chỉ là các
    mục tiêu trong một buổi tập bắn.: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao
    quanh toàn bộ câu trích dẫn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000029: terms: []: pronouns_and_address:
    Câu trích dẫn lược chủ ngữ tự nhiên, giữ tâm điểm vào hành vi bắn người tính điểm.:
    pov_and_voice: Trích dẫn trực tiếp lời nhân chứng tố cáo sự máu lạnh của bên tấn
    công.: modality_and_logic: Bảo toàn chi tiết bắn người còn được cộng ‘điểm’ (giữ
    dấu nháy đơn quanh từ `‘điểm’`).: emphasis: Bảo toàn dấu nhấn mạnh `*...*` bao
    quanh toàn bộ câu trích dẫn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000030: terms: [''công thức nổ
    mạnh'']: pronouns_and_address: Lời nhân chứng phân biệt rõ `Người dân` và các
    pháp sư Đế quốc (`họ`).: pov_and_voice: Trích dẫn trực tiếp lời nhân chứng mô
    tả cách quân Đế quốc phá hủy các khu phố cố thủ.: modality_and_logic: Bảo toàn
    quan hệ nhân quả: vì người dân dựng vật cản cố thủ bên trong nên phía pháp sư
    dùng công thức nổ mạnh oanh kích cả các khu phố.: emphasis: Bảo toàn dấu nhấn
    mạnh `*...*` bao quanh toàn bộ câu trích dẫn tương ứng thẻ `<html:em>` theo `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000031: terms: [''thảm kịch'']:
    pronouns_and_address: Không dùng đại từ nhân xưng.: pov_and_voice: Lời dẫn khép
    lại chùm trích dẫn nhân chứng.: modality_and_logic: Bảo toàn nhận định tổng kết:
    tất cả những điều trên đều là ký ức đau đớn về thảm kịch đang được chia sẻ trong
    ngày hôm nay.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000032: terms: [''Arene'', ''Nhà
    thờ chính tòa Karelian'']: pronouns_and_address: Andrew tự xưng `tôi` ở mệnh đề
    định ngữ cuối câu.: pov_and_voice: Giọng thuyết minh nêu số liệu thương vong xác
    nhận và dẫn dắt về lại tâm điểm Nhà thờ chính tòa Karelian.: modality_and_logic:
    Bảo toàn mức độ tổn thất (ngay cả khi chỉ tính số người chết đã được xác nhận,
    Arene cũng mất một nửa dân số trong ngày hôm đó) và xác nhận vụ việc tồi tệ nhất
    xảy ra tại Nhà thờ chính tòa Karelian đã nhắc tới ở đầu chương trình.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000033: terms: [''pháp sư'', ''mũi
    tiên phong'', ''đơn vị dự bị'']: pronouns_and_address: Quy chiếu người dân chứng
    kiến bằng `họ`.: pov_and_voice: Giọng thuyết minh tái hiện bước triển khai binh
    lực thứ hai bằng đường sắt khóa chặt thành phố.: modality_and_logic: Bảo toàn
    tiến trình tác chiến: đợt tấn công chớp nhoáng, mất cân xứng của các pháp sư mới
    chỉ là mũi tiên phong; khi đoàn tàu chở hàng loạt đơn vị dự bị tới càn quét và
    kiểm soát hoàn toàn thành phố, cư dân hầu như không còn nơi ẩn náu.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000034: terms: []: pronouns_and_address:
    Dùng đại từ phản thân `bản thân` cho những người đàn ông và phụ nữ cầm vũ khí.:
    pov_and_voice: Giọng thuyết minh khắc họa tình thế tiến thoái lưỡng nan tuyệt
    vọng của những người cầm vũ khí.: modality_and_logic: Bảo toàn mục đích (`Để bảo
    vệ bản thân và gia đình`) và hai lựa chọn duy nhất còn lại của những người cầm
    vũ khí: kháng cự vô vọng trong thành phố hoặc liều mình tìm đường tháo chạy xuyên
    qua quân địch.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0030.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0030.xhtml/p000035: terms: [''Nhà thờ chính
    tòa Karelian'']: pronouns_and_address: Quy chiếu người dân bằng `họ` ở câu thứ
    hai.: pov_and_voice: Giọng thuyết minh khép lại lô đầu bằng hình ảnh người dân
    dồn về cố thủ quanh Nhà thờ chính tòa Karelian.: modality_and_logic: Bảo toàn
    quan hệ đối lập và hệ quả: vì không còn cách nào khác để chiến đấu, thực tế đau
    lòng là người dân buộc phải dựng vật cản cố thủ, và đại đa số đã lánh nạn trong
    cùng xung quanh Nhà thờ chính tòa Karelian.: emphasis: none'
  non_canon: true
