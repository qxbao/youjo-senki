source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: b8fbf7ae1c46d2603221b4eb9ec654542abcb5c0a4eaf573a7ce4edc4638f4aa
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 29
segment_id_start: YS-LN02/Text/part0014.xhtml/p000300
segment_id_end: YS-LN02/Text/part0014.xhtml/p000328
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000300
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000300: locks: [''Giữ danh xưng
    `quan sát viên`, cụm `theo thời gian thực`, các đại từ `họ`, `cô ta`, và toàn
    văn `Nhưng giờ đây, nếu quan sát viên của chính họ đang phát hiện ra cô ta theo
    thời gian thực, họ cần đánh giá lại những dữ liệu mà họ từng cố quên đi như một
    trò đùa dở trong lúc nhâm nhi tách trà.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000301
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000301: locks: [''Giữ bản sửa theo
    signoff `M1` với cụm trung tính `phía Cộng hòa` (theo `vol02-ch02-b12-republicans-casual-reference`),
    các đại từ `Cô ta`, `Tôi`, và toàn văn `“Cô ta có thật sao? Tôi cứ tưởng phía
    Cộng hòa chỉ đang mơ mộng thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000302: locks: [''Giữ danh xưng
    `các sĩ quan Khối Thịnh vượng chung`, các cụm `tin báo sai`, `một kiểu ảo giác
    tập thể`, `máy liên lạc`, đại từ giả định khái quát `anh`, và đại từ quy chiếu
    `cô ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000303
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000303: locks: [''Giữ bản sửa đã
    căn chỉnh ledger với các cụm `ống nghe`, `tổ phân tích`, và `bộ chỉ huy cấp cao`
    (theo `vol02-ch02-b12-high-command`): `Vài người chộp lấy ống nghe để đánh thức
    tổ phân tích. Những người khác lập tức báo cho bộ chỉ huy cấp cao.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000304
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000304: locks: [''Giữ các đại từ
    `Chúng tôi`, `Cô ta`, thuật ngữ `tín hiệu đặc trưng`, và câu `“Chúng tôi đã nhận
    diện được tín hiệu đặc trưng. Không thể nhầm được. Cô ta đang tiến về phía này.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000305
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000305: locks: [''Giữ danh xưng
    `nhiều quan sát viên`, cụm `mẫu tín hiệu`, các đại từ `cô ta`, `Họ` / `họ`, và
    câu kết `Đến lúc này, họ buộc phải thừa nhận cô ta có thật.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000306
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000306: locks: [''Giữ các cụm `Lực
    lượng viện binh địch có quy mô cấp tiểu đoàn.`, đại từ `Chúng ta`, và `Chúng ta
    không có hồ sơ về đơn vị này.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000307
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000307: locks: [''Giữ các thuật
    ngữ `một tiểu đoàn—thậm chí có thể là một tiểu đoàn tăng cường` (theo `vol02-ch02-b12-augmented-battalion`),
    `khuynh hướng mana` (theo `vol02-ch02-b12-mana-inclination`), và `vậy nghĩa là
    Đế quốc đã triển khai pháp sư mới.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000308
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000308: locks: [''Giữ bản sửa đã
    căn chỉnh ledger với các cụm `thư viện dữ liệu của phe Cộng hòa ở mặt trận Rhine`
    (theo `vol02-ch02-b12-record-library`), `Đế quốc vẫn còn lực lượng dự bị dồi dào
    như trước`, đại từ `họ`, và thuật ngữ `một đơn vị mới do một Named chỉ huy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000309
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000309: locks: [''Giữ dấu ba chấm
    mở đầu, các đại từ `Tôi`, `họ`, danh xưng `Liên minh Entente`, và câu `“…Tôi ngạc
    nhiên là họ lại điều một đơn vị mới ra, trong khi Liên minh Entente đã chịu quá
    nhiều sức ép.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000310: locks: [''Giữ bản sửa theo
    signoff `M2` bảo toàn quan hệ nhân quả hợp lý về chiến sự tại `Dacia` cùng các
    đại từ `Anh`, `họ`: `“Anh nghĩ đó là đơn vị từ Dacia à? Phần lớn giao tranh bên
    đó đã kết thúc rồi, nên có lẽ họ có thể điều quân đi nơi khác.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000311
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000311: locks: [''Giữ bản sửa theo
    signoff `M3` với đúng phạm vi nhấn mạnh in nghiêng đầu đoạn theo `DEC-P01-002`
    `*À ra vậy.*`, đại từ `Anh ta` (theo `vol02-ch02-b12-intelligence-officer-pronoun`),
    và các danh xưng `quân Dacia`, `Hướng đạo sinh`, `một Named của Quân đội Đế quốc`,
    `bộ chỉ huy Liên minh Entente`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000312
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000312: locks: [''Giữ đại từ `Ta`
    và hai câu thoại `“Ta sẽ thu thập dữ liệu. Máy ghi đang chạy chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000313
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000313: locks: [''Giữ đại từ nam
    `hắn` theo đúng góc nhìn của người nói trong nguyên bản, cấp đơn vị `đại đội`,
    và câu `“Nếu đúng vậy, hắn là quái vật có thể một mình hạ cả đại đội. Đừng bỏ
    sót chi tiết nào.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000314
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000314: locks: [''Giữ bản sửa theo
    signoff `M3` với chức danh `Viên sĩ quan tình báo`, đại từ nhất quán `anh ta`
    (theo `vol02-ch02-b12-intelligence-officer-pronoun`), thuật ngữ `khuynh hướng
    mana` (theo `vol02-ch02-b12-mana-inclination`), `Named`, và `hoạt động tình báo
    của họ tại Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000315
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000315: locks: [''Giữ câu hỏi `“Có
    bắt được liên lạc vô tuyến nào không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000316
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000316: locks: [''Giữ bản sửa đã
    căn chỉnh ledger và xử lý `m11` với đại từ `Chúng` chỉ đối phương, cụm lặp rõ
    nghĩa `mật mã và giao thức ấy`, và thuật ngữ `thư viện dữ liệu` (theo `vol02-ch02-b12-record-library`):
    `“Không được. Chúng dùng mật mã và giao thức chưa biết. Ít nhất thì mật mã và
    giao thức ấy không có trong thư viện dữ liệu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000317
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000317: locks: [''Giữ bản sửa theo
    signoff `M3` với các đại từ `anh ta`, `họ`, và các cụm `chặn thu và ghi lại các
    bước sóng`, `nắm được hệ thống chỉ huy và sự di chuyển của đơn vị địch.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000318
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000318: locks: [''Giữ bản sửa theo
    signoff `M3` với đại từ `Anh ta` / `anh ta` (theo `vol02-ch02-b12-intelligence-officer-pronoun`),
    đại từ `họ`, địa danh `Dacia`, và cụm `mật mã hay giao thức này`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000319
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000319: locks: [''Giữ bản sửa đã
    căn chỉnh ledger với lời hô gọi `Thưa chỉ huy`, danh xưng `Đế quốc`, và cặp phiên
    hiệu đồng bộ `Cụm tập đoàn quân phương Bắc và Cụm tập đoàn quân phương Tây` (theo
    `vol02-ch02-b12-western-army-group`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000320
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000320: locks: [''Giữ đại từ `tôi`,
    thuật ngữ `đơn vị điều khiển` (theo `vol02-ch02-b11-control-unit`), và câu `“Được
    rồi. Chà, tôi thật sự muốn điều một đơn vị điều khiển lên đó.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000321
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000321: locks: [''Giữ các danh
    xưng `Khối Thịnh vượng chung`, `Chúa trời và ác quỷ`, `các sĩ quan tại chỗ`, các
    đại từ `họ`, `mình`, và cụm `óc hài hước đen tối thiêng liêng của mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000322
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000322: locks: [''Giữ đại từ `ta`
    và câu thoại `“Ừ, ta không thể đưa máy bay vào.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000323
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000323: locks: [''Giữ các đại từ
    `chúng ta`, `mình`, và câu `“Phải… Có lẽ chúng ta nên lo hơn chuyện liệu mình
    có rút lui được cùng trang bị còn nguyên vẹn hay không.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000324
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000324: locks: [''Giữ danh xưng
    `Quân đội Liên minh Entente`, đại từ `Họ`, và đúng phạm vi nhấn mạnh in nghiêng
    cuối câu theo `DEC-P01-002` `*vẫn chưa tan rã*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000325
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000325: locks: [''Giữ các cụm `Người
    quan sát bình tĩnh từ bên thứ ba`, `Đế quốc`, `Liên minh Entente`, hình ảnh so
    sánh `một bệnh nhân mắc bệnh nặng nằm liệt giường, chỉ còn thoi thóp cầm cự`,
    và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000326
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000326: locks: [''Giữ câu mệnh
    lệnh `“Khừ… Trước mắt, hãy báo động cho các tuyến đầu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000327
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000327: locks: [''Giữ câu đáp `“Rõ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000328
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000328: locks: [''Giữ danh xưng
    `các sĩ quan sở chỉ huy`, từ `ống nghe`, và câu kết `Nhưng các sĩ quan sở chỉ
    huy gạt những ý nghĩ ấy khỏi tâm trí, tập trung vào nhiệm vụ trước mắt và hét
    chỉ thị vào ống nghe.`.'']'
  non_canon: true
