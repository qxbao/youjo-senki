- segment_id: YS-LN02/Text/part0024.xhtml/p000157
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000157: names_and_ranks: [''captain
    -> thuyền trưởng'', ''Commonwealth -> Khối Thịnh vượng chung'', ''S-class submarine
