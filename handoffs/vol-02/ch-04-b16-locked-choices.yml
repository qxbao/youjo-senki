- segment_id: YS-LN02/Text/part0024.xhtml/p000162
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000162: names_and_ranks: [''rendezvous
    point -> điểm hẹn'', ''Imperial Army -> Lục quân Đế quốc'']: pronouns_and_address:
    [''Tách minh bạch hai chủ thể "Phía Đế quốc" (ở câu đầu) và "Phía Khối Thịnh vượng
    chung" (ở câu thứ hai) theo bản sửa V1'']: pov_and_logic: [''Giữ bản sửa V1 và
    V1-residual ("Phía Đế quốc đã có mặt tại điểm hẹn vốn chỉ một số ít người biết
    đến. Phía Khối Thịnh vượng chung vừa kịp chuyển giao hàng thì nhận được tin Lục
    quân Đế quốc đang tiến đến, và tình hình nhanh chóng xấu đi."), bảo toàn chính
    xác nghĩa rằng điểm hẹn vốn chỉ một số ít người được biết và diễn biến xấu đi
    nhanh chóng ngay khi vừa chuyển giao xong'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000163
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000163: names_and_ranks: [''Imperial
    Army patrol line -> tuyến tuần tra của Lục quân Đế quốc'', ''imperial mage battalion
    -> một tiểu đoàn pháp sư Đế quốc'']: pronouns_and_address: [''Quy chiếu phía tàu
    ngầm Khối Thịnh vượng chung bằng "họ"'']: pov_and_logic: [''Giữ giả định quá khứ
    trái thực tế (nếu chuyện đó không xảy ra thì chỉ cần giả vờ không biết gì rồi
    vượt qua tuyến tuần tra của Lục quân Đế quốc) và câu hỏi bàng hoàng về ý nghĩa
    của việc một tiểu đoàn pháp sư Đế quốc đột ngột xuất hiện đúng lúc ấy'']: emphasis:
    none'
  non_canon: true
