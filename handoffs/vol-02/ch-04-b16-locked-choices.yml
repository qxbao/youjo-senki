- segment_id: YS-LN02/Text/part0024.xhtml/p000158
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000158: names_and_ranks: [''mole
    -> một gián điệp'', ''intelligence agency -> cơ quan tình báo'', ''submarine crew
    -> thủy thủ đoàn tàu ngầm'', ''the subterranean -> những người hoạt động ngầm'']:
    pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu thuyền trưởng tàu *Syrtis*
    bằng "Ông" (bản sửa V2) và quy chiếu tập thể thuyền trưởng cùng thủy thủ đoàn/phía
    mình bằng "Họ" kèm đại từ phản thân "mình"'']: pov_and_logic: [{''Giữ bản sửa
    V2 ("Ông"), V3 ("những người hoạt động ngầm" — `vol02-ch04-b16-subterranean`)
    và V4'': ''thuyền trưởng vốn đã nghe tin đồn có gián điệp cài trong cơ quan tình
    báo, sự đối sánh giữa việc không chịu thua những người hoạt động ngầm với thực
    tế thâm nhập tình báo khác hẳn chuyện lặn xuống biển, cùng niềm tin rằng họ đã
    áp dụng các biện pháp bảo mật tối đa''}]: emphasis: [''Giữ đúng phạm vi nhấn mạnh
    Markdown `*Có một gián điệp cài trong cơ quan tình báo.*` ở câu đầu theo DEC-P01-002
    (bản sửa V4)'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000159
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000159: names_and_ranks: [''captain
