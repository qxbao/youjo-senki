segment_id_end: YS-LN02/Text/part0010.xhtml/p000326
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000299
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000299: locks: [''Giữ cách gọi
    cấp bậc và tên riêng `Thiếu úy Serebryakov`, đại từ `chúng ta`, cấu trúc phủ định
    `đâu có tàn bạo đến mức phớt lờ`, và thuật ngữ `luật chiến tranh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000300
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000300: locks: [''Giữ các cụm danh
    từ `những điều luật này`, `các nhà nhân đạo`, `những người có kinh nghiệm lập
    pháp`, và mệnh đề `quy định cách thức được phép tiến hành chiến tranh tại các
    thành phố`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000301
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000301: locks: [''Giữ giọng độc
    thoại mỉa mai của Tanya về luật chiến tranh, các mệnh đề liệt kê `Không được tấn
    công những cơ sở gây ảnh hưởng đến đời sống thường nhật của người dân`, `cấm tấn
    công thường dân`, `ném bom bừa bãi là vô nhân đạo`, lời cảm thán châm biếm `Con
    người muôn năm.`, và câu kết `Nhưng luật tồi thì vẫn là luật.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000302
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000302: locks: [''Giữ đại từ `chúng
    ta`, các phủ định `không gặp vấn đề gì khi hoạt động trong khuôn khổ ấy`, `Ít
    nhất lần này chúng ta không có vấn đề gì.`, và nhận định `Phạm vi áp dụng mơ hồ,
    việc diễn giải lại khó khăn, nên có thể xử lý phần lớn luật lệ khá đơn giản.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000303
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000303: locks: [''Giữ lời xin lỗi
    lễ phép của cấp dưới `“Xin thứ lỗi cho sai sót của tôi, thưa Thiếu tá.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000304
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000304: locks: [''Giữ mệnh lệnh
    của Tanya với đại từ `chúng ta`, thuật ngữ `nhà máy vũ khí`, và chỉ thị đã sửa
    theo signoff `Này, ra thông báo sơ tán đi—phát trên kênh báo nguy quốc tế theo
    đúng quy định.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000305
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000305: locks: [''Giữ các thuật
    ngữ `Nhà máy của địch`, `cơ sở quân sự`, `đạn dược`, `nhà máy vũ khí`, dấu chú
    thích số 4 trong cụm châm biếm `nhà nhân đạo giàu lòng trắc ẩn ngài Molotov⁴`,
    hình ảnh `giỏ bánh mì`, và lập luận đổ lỗi `Lỗi là ở họ vì đặt xưởng làm giỏ bánh
    mì tại một cơ sở dễ bị nhầm là nhà máy vũ khí đến thế.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000306
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000306: locks: [''Giữ cách gọi
    cấp bậc `Thiếu tá`, đại từ `ta`, và cụm thuật ngữ `mất yếu tố bất ngờ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000307
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000307: locks: [''Giữ cấp bậc và
    tên riêng đã sửa theo signoff `Trung úy Weiss`, mệnh đề `lẽ thường mách bảo rằng
    nỗi sợ là có lý`, và cấu trúc lược đại từ ngôi thứ hai ở vế sau `nhưng đang nghĩ
    mọi chuyện hơi quá thẳng tuột đấy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000308
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000308: locks: [''Giữ tên riêng
    `Tanya`, đại từ `họ`, thuật ngữ `luật pháp quốc tế`, và cụm `hoàn toàn chẳng lọt
    vào tai các sĩ quan cấp dưới`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000309
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000309: locks: [''Giữ đại từ `Chúng
    ta` và câu hỏi hoài nghi `bí mật đi xa đến tận đây chỉ để lộ diện… sao?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000310
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000310: locks: [''Giữ câu miêu
    tả `Trên mặt ai nấy đều hiện cùng một vẻ băn khoăn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000311
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000311: locks: [''Giữ đại từ `họ`
    / `Họ` chỉ các sĩ quan cấp dưới, cụm `mục tiêu quân sự`, chức vụ và cấp bậc `chỉ
    huy tiểu đoàn, Thiếu tá Tanya von Degurechaff`, và đại từ tự quy chiếu nội tâm
    `mình` theo DEC-P01-001 (`nói cách khác, là mình`, `cuối cùng người chịu trách
    nhiệm vẫn là mình`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000312
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000312: locks: [''Giữ đại từ nội
    tâm `mình` theo DEC-P01-001, cụm `những người lính Đế quốc xuất sắc, dù miễn cưỡng
    vẫn tuân lệnh`, và tên riêng trần thuật `Tanya` ở câu cuối.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000313
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000313: locks: [''Giữ mệnh lệnh
    trực tiếp `“Thiếu úy Serebryakov! Ra thông báo cảnh báo. Ra lệnh sơ tán theo đúng
    quy định.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000314
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000314: locks: [''Giữ đúng phạm
    vi nhấn mạnh đại từ ngôi thứ nhất `*Tôi*` theo DEC-P01-002 trong câu hỏi lại `“*Tôi*
    phải làm việc đó sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000315
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000315: locks: [''Giữ tên riêng
    `Serebryakov`, danh xưng `Thiếu tá von Degurechaff`, cụm `với tư cách một chuyên
    gia`, và đại từ trần thuật `nó` quy chiếu Tanya ở câu cuối theo DEC-P01-001 (`Thế
    là đủ khiến nó buồn nôn.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000316
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000316: locks: [''Giữ mệnh đề `cảnh
    báo chỉ là thủ tục, nên càng kém đáng tin thì càng tốt`, tên riêng `Tanya`, và
    sự đối lập giữa `giọng Serebryakov hơi non nớt` với `giọng điệu cứng rắn, đậm
    chất lính của Weiss`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000317
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000317: locks: [''Giữ tên riêng
    `Tanya` và đại từ trần thuật `chính nó` theo DEC-P01-001 trong cụm `thành viên
    trẻ nhất đơn vị—chính nó—ra khỏi phép tính`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000318
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000318: locks: [''Giữ sự phân biệt
    giữa đại từ độc thoại nội tâm `mình` theo DEC-P01-001 với đại từ `Tôi` trong lời
    giải thích giả định đối ngoại (`“Tôi cho rằng nếu để một cô gái đưa ra cảnh báo
    thì họ sẽ mất cảnh giác,”`), tên riêng `Tanya`, `Serebryakov` / `Thiếu úy Serebryakov`,
    và câu hỏi phản vấn giả định `“Chẳng phải chỉ huy mới là người nên ra thông báo
    sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000319
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000319: locks: [''Giữ đại từ độc
    thoại nội tâm `Mình` theo DEC-P01-001 ở cả hai câu (`Mình phải làm thôi. Mình
    chẳng muốn, nhưng…`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000320
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000320: locks: [''Giữ cách gọi
    cấp bậc trung lập đã sửa theo signoff `Thiếu úy` (`Thiếu úy nói đúng, tôi nên
    làm vậy.`), đại từ `tôi` / `Tôi`, và câu `Tôi sẽ cố nói sao cho nghe thật giống
    một đứa nhóc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000321
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000321: locks: [''Giữ đại từ nội
    tâm `mình` theo DEC-P01-001, các cụm thuật ngữ `luật quốc tế`, `đi đến hồi chết
    trên thực tế`, `luật chiến tranh`, và giọng bực dọc châm biếm của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000322
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000322: locks: [''Giữ đại từ trần
    thuật `nó` kết hợp phản thân `mình` theo DEC-P01-001, từ `ống nghe`, và câu phát
    thanh có biến âm ngọng nhẹ ở từ chính đã sửa theo signoff `“Đây là lời cánh báo.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000323
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000323: locks: [''Giữ địa danh
    `thủ đô Dacia` và cú ngoặt phủ định mỉa mai `Ngoại trừ việc nó chẳng vang vọng
    gì cả.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000324
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000324: locks: [''Giữ đại từ trần
    thuật `nó` theo DEC-P01-001, cụm `tuân thủ luật đến từng chữ`, và thuật ngữ `kênh
    báo nguy quốc tế` nhất quán với p000304.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000325
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000325: locks: [''Giữ lời phát
    thanh chính thức với đại từ `Chúng tôi`, tên tổ chức `Quân đội Đế quốc`, từ kéo
    giọng trẻ con đã sửa theo signoff `bắt đầuuu`, và thuật ngữ `cơ sở cung ứng quân
    sự`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000326
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000326: locks: [''Giữ đúng phạm
    vi nhấn mạnh `*Tuy nhiên*` ở đầu câu theo DEC-P01-002, cụm `mức độ phổ cập radio
    ở Dacia`, và nhận định kết đoạn `những hộ gia đình để radio bật giữa đêm hẳn chỉ
    là thiểu số cực nhỏ`.'']'
  non_canon: true
