choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000335: locks: [''Giữ thuật ngữ
    `Toàn thể nhân viên Bộ chỉ huy`, đại từ `họ`, và hình ảnh `Bầu không khí căng
    thẳng đến mức nỗi bất an như thiêu đốt trong lòng họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000336
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000336: locks: [''Giữ hô hiệu `Spike
    04`, `Bộ chỉ huy`, `Hạm đội Đế quốc`, khẩu lệnh vô tuyến `Xin nhắc lại`, và câu
    báo cáo `“Spike 04 gọi Bộ chỉ huy. Hạm đội Đế quốc đang chuyển hướng lên phía
    bắc. Xin nhắc lại, hướng lên phía bắc!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000337
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000337: locks: [''Giữ thuật ngữ
    `chiến dịch đổ bộ` và câu hỏi sững sờ `“Ư...! Một chiến dịch đổ bộ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000338
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000338: locks: [''Giữ câu `Dĩ nhiên,
    khi hiểu ra, ai nấy đều có cảm giác như bị giáng một cú vào sau đầu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000339
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000339: locks: [''Giữ các tên riêng
    và thuật ngữ `Cộng hòa`, `Dacia`, `Liên minh Entente`, `Cụm tập đoàn quân phương
    Bắc của Đế quốc`, `lực lượng chủ lực của Liên minh Entente`, `mặt trận`, và đại
    từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000340
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000340: locks: [''Giữ dấu chấm
    lửng mở đầu `…`, các thuật ngữ `căn cứ hậu cần phía sau`, `một chiến dịch đổ bộ`,
    `một Dacia thứ hai`, `ưu thế lục quân`, `các tuyến tiếp tế phía sau`, `quân đội`,
    đại từ `họ`, và các mệnh đề điều kiện – phủ định `không tránh khỏi`, `Chiến tranh
    không thể tiếp tục chỉ dựa vào ưu thế lục quân; nếu các tuyến tiếp tế phía sau
    bị cắt đứt, số phận quân đội sẽ là một thảm kịch.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000341
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000341: locks: [''Giữ các thuật
    ngữ `vài sĩ quan cấp cao`, `kế hoạch chiến dịch đổ bộ của Lục quân Đế quốc`, `Khối
    Thịnh Vượng Chung`, `trong vòng bí mật tuyệt đối`, `Liên minh Entente`, `Dacia`,
    `Tổ quốc thân yêu của họ`, và câu hỏi giả định `Nếu Liên minh Entente sụp đổ như
    Dacia, gánh nặng đè lên Tổ quốc thân yêu của họ sẽ tăng thêm bao nhiêu?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000342
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000342: locks: [''Giữ các thuật
    ngữ đã khóa `hạm đội`, `các pháp sư thủy quân lục chiến` theo mục `vol02-ch03-b19-marine-mages`
    và bản sửa V1 đã nghiệm thu, `xuất kích`, `khu vực hậu phương của Liên minh Entente`,
    `Bộ chỉ huy`, cùng các đại từ `Chúng`, `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000343
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000343: locks: [''Giữ dấu chấm
    lửng mở đầu và câu hỏi ngắn gọn `“…Có chắc không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000344
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000344: locks: [''Giữ các thuật
    ngữ `Tàu ngầm`, `pháp sư địch`, `tuyến ngăn chặn`, và câu khẳng định `“Không thể
    nhầm được! Tàu ngầm và pháp sư địch đang lập tuyến ngăn chặn!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000345
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000345: locks: [''Giữ các danh
    xưng và thuật ngữ đã khóa `Hạm đội Eo biển Cộng hòa`, `Hạm đội Biển khơi Đế quốc`
    / `Hạm đội Biển khơi`, `Cộng hòa`, `lực lượng chủ lực`, `Đế quốc`, `sức mạnh hải
    quân`, `Hạm đội Biển Bắc` theo mục `vol02-ch03-b19-fleet-names` và `vol02-ch03-b19-northern-sea-fleet`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000346
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000346: locks: [''Giữ đầy đủ các
    con số và tương quan lực lượng `bảy chọi bảy`, `ba viện binh của địch`, `mười
    chọi bảy`, phủ định kép `không phải là bất khả thi`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000347
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000347: locks: [''Giữ các danh
    xưng `Liên minh Entente`, `Hạm đội Biển Bắc`, `Soái hạm`, đúng phạm vi in nghiêng
    chỉ cho tên tàu `*Helgoland*` và giữ chữ thường cho tên lớp tàu `lớp Helgoland`
    theo `DEC-P01-002` cùng bản sửa N1 đã nghiệm thu, thuật ngữ đã khóa `tàu chiến
    chủ lực`, và `Hạm đội Eo biển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000348
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000348: locks: [''Giữ đúng thì
    và tính phản thực tế của giả định quá khứ theo bản sửa V2 đã nghiệm thu: `Nếu
    Đế quốc đã chọn họ làm đối thủ trong tình thế ấy, thì dù cuối cùng họ có bị đánh
    tan, có lẽ họ cũng đã làm hỏng được mục tiêu của Đế quốc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000349
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000349: locks: [''Giữ các cụm đã
    khóa theo bản sửa N2 đã nghiệm thu (`giáp lá cà`, `hy vọng ấy trở nên vô ích`),
    các thuật ngữ `hạm đội Đế quốc`, `tàu địch`, `các tàu vận tải`, `Liên minh Entente`,
    nhấn mạnh lặp `Chắc chắn—chắc chắn tuyệt đối—nếu đổ bộ thành công, Liên minh Entente
    sẽ sụp đổ`, và các đại từ `họ` / `Họ`, `Chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000350
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000350: locks: [''Giữ cấu trúc
    giả định quá khứ phản thực tế `Nếu họ cứ ngây thơ ra khơi nghênh chiến mà không
    hay biết gì, có lẽ họ đã bị tập kích bất ngờ và buộc phải tháo chạy trong hoảng
    loạn.`, đại từ `họ`, và câu kết `Giờ vấn đề là phải xử trí tình thế này thế nào.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000351
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000351: locks: [''Giữ các thuật
    ngữ `Lục quân`, `pháp sư`, `các tàu tuần tra`, `tàu chiến chủ lực`, và khẩu lệnh
    `“Xin Lục quân chi viện pháp sư! Điều các tàu tuần tra vào và làm mọi cách để
    mở đường đến tàu chiến chủ lực!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000352
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000352: locks: [''Giữ đúng hai
    phạm vi nhấn mạnh in nghiêng `*Chúng ta có kịp không?*` và `*Nhất định phải kịp.*`
    theo `DEC-P01-002` cùng bản sửa N3 đã nghiệm thu, các danh xưng `Bộ chỉ huy Hạm
    đội Eo biển`, `Cộng hòa`, `Liên minh Entente`, và các đại từ `Chúng ta`, `họ`
    / `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000353
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000353: locks: [''Giữ thuật ngữ
    `xuất kích` và khẩu lệnh `“Tất cả tàu nào sẵn sàng đều xuất kích! Dốc toàn lực!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000354
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000354: locks: [''Giữ câu trần
    thuật ngắn `Đáng tiếc, vận may đã không đứng về phía họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000355
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000355: locks: [''Giữ các cụm đã
    khóa theo bản sửa N5 đã nghiệm thu (`giơ nắm đấm`, `đánh bại chúng`), thuật ngữ
    `tùy viên quân sự tại Liên minh Entente`, đúng phạm vi nhấn mạnh in nghiêng `*Lần
    tới… Lần tới, chúng ta sẽ đánh bại chúng.*` theo `DEC-P01-002`, và các đại từ
    `họ` / `Họ`, `chúng ta`, `chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000356
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000356: locks: [''Giữ các thuật
    ngữ `Hải quân Đế quốc`, `một lực lượng đổ bộ`, địa danh `Osfjord` theo bản sửa
    N4 đã nghiệm thu, và `chiến dịch đổ bộ mang tính quyết định`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000357
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000357: locks: [''Giữ các câu đã
    sửa theo V3 và được nghiệm thu (`Tình thế ngày càng xấu đi, nỗi khổ sở trước tình
    thế ấy lớn đến mức dập tắt cả hy vọng được nghỉ Giáng sinh sắp tới.` và `Thế nhưng
    bản thân văn phòng không có gì bất ổn.`), các danh xưng `Khối Thịnh Vượng Chung`,
    `Đế quốc`, `Cộng hòa`, `Liên minh Entente`, `cơ quan tình báo của Khối Thịnh Vượng
    Chung`, `người đứng đầu văn phòng, Thiếu tướng Donald Habergram`, và đại từ trần
    thuật `ông`.'']'
  non_canon: true
