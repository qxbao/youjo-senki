segment_id_end: YS-LN02/Text/part0026.xhtml/p000226
choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000206
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000206: terms: [''địa chính trị
    (geopolitics)'', ''Đế quốc (the Empire)'', ''lục địa (the continent)'', ''nhà
    chức trách (the authorities)'']: pronouns_and_address: [''Quy chiếu phía Khối
    Thịnh vượng chung / nhà chức trách bằng `họ`, người dân bằng `người dân` / `họ`.'']:
    pov_and_voice: Độc thoại phân tích địa chính trị sắc lạnh của Tanya.: modality_and_logic:
    Giữ đầy đủ chuỗi suy luận điều kiện – hệ quả: nếu Đế quốc đánh bại mọi đối thủ
    trên lục địa thì việc phải đối mặt với một quốc gia khổng lồ hẳn sẽ là cơn ác
    mộng, nên khi người dân chưa ủng hộ cuộc chiến thì việc nhà chức trách khuấy động
    họ là hoàn toàn tự nhiên.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000207
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000207: terms: [''sự cố đáng tiếc
    (unfortunate accident)'', ''tuyên truyền (propaganda)'', ''những luận điệu chống
    Đế quốc (anti-Empire views)'', ''những chi tiết pháp lý phức tạp (the complicated
    legal details)'']: pronouns_and_address: [''Quy chiếu phía tuyên truyền chống
    Đế quốc bằng `họ`.'']: pov_and_voice: Nhận định châm biếm về hiệu quả tuyên truyền
    so với các lập luận pháp lý phức tạp trên báo chí.: modality_and_logic: Giữ quan
    hệ nhượng bộ (`Dù có bẩn thỉu đến đâu, họ vẫn sẽ không ngừng hô vang...`) và tâm
    lý ngại đọc chi tiết pháp lý phức tạp của công chúng.: emphasis: Khóa bản sửa
    theo B09-P01: nhấn trọn cụm `*sự cố đáng tiếc*` khớp với thẻ `<html:em>` trong
    nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000208
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000208: terms: [''tai nạn (an accident)'',
    ''sự hiểu lầm đáng tiếc (an unfortunate misunderstanding)'']: pronouns_and_address:
    []: pov_and_voice: Trần thuật/phân tích đối chiếu lập trường ngoại giao chính
    thức của hai quốc gia.: modality_and_logic: Giữ trạng ngữ `Dĩ nhiên, về mặt chính
    thức` và cách định danh giảm nhẹ của cả hai nước (`một tai nạn`, `một sự hiểu
    lầm đáng tiếc`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000209
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000209: terms: [''tàu ngầm Khối
    Thịnh vượng chung (the Commonwealth submarine)'', ''thiết bị liên lạc và định
    vị (communications and navigation equipment)'', ''vùng biển của Đế quốc (imperial
    waters)'', ''liên lạc vô tuyến (the radio contact)'', ''đơn vị pháp sư Đế quốc
    (the imperial mage unit)'', ''lặn tập theo chương trình huấn luyện định kỳ (a
    training dive as part of its scheduled exercise)'', ''những phát súng cảnh cáo
    (warning shots)'', ''luật chiến tranh (the law of war)'', ''áp lực nước (water
    pressure)'', ''thân tàu ngầm (the hull of the submarine)'', ''thổi dằn khẩn cấp
    để nổi lên (performed an emergency blow)'']: pronouns_and_address: [''Quy chiếu
    chiếc tàu ngầm ở câu cuối bằng `nó`.'']: pov_and_voice: Tóm tắt kịch bản giải
    trình chính thức được cả hai bên thống nhất đưa ra.: modality_and_logic: Khóa
    bản sửa theo B09-P02 (`thổi dằn khẩn cấp để nổi lên`); bảo toàn đầy đủ chuỗi nguyên
    nhân – hệ quả trong lời giải trình chính thức (thiết bị trục trặc rồi hỏng hẳn
    → lạc vào vùng biển Đế quốc → không nhận được liên lạc vô tuyến → bắt đầu lặn
    tập → chịu áp lực nước lớn từ các phát súng cảnh cáo bắn theo luật chiến tranh
    → sắp bị ép bẹp nên thổi dằn khẩn cấp để nổi lên).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000210
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000210: terms: [''các pháp sư Đế
    quốc (the imperial mages)'', ''tiến hành cứu hộ (lifesaving operations)'', ''bệnh
    viện Đế quốc (an imperial hospital)'', ''các cơ cấu khẩn cấp (the emergency mechanisms)'',
    ''chìm do nước tràn vào (sank due to flooding)'']: pronouns_and_address: [''Quy
    chiếu những thủy thủ bị thương nặng bằng `họ`.'']: pov_and_voice: Tiếp tục thuật
    lại kết luận ngoại giao mập mờ vừa giữ thể diện vừa ngầm đổ lỗi cho nhau của hai
    nước.: modality_and_logic: Giữ đầy đủ ba nội dung trong thông cáo chung: (1) kết
    quả cứu hộ của pháp sư Đế quốc (nhiều người được điều trị nhưng những người bị
    thương nặng đã thiệt mạng), (2) nguyên nhân tàu chìm (cơ cấu khẩn cấp không hoạt
    động kịp thời và nước tràn vào), và (3) cam kết thảo luận ngăn ngừa tai nạn tương
    tự.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000211
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000211: terms: [''vụ đắm tàu (a
    shipwreck)'', ''bị tấn công đánh chìm (a sinking by attack)'']: pronouns_and_address:
    [''Dùng phản thân `mình` cho `cả hai bên` (`thừa nhận mình đã mắc sai lầm`).'']:
    pov_and_voice: Đánh giá ý nghĩa chính trị thực sự đằng sau câu chuyện chính thức.:
    modality_and_logic: Khóa phép đối lập `giống một vụ đắm tàu hơn là bị tấn công
    đánh chìm` và hệ quả chính trị (cả hai bên đều nhận có sai sót nhưng thống nhất
    tìm cách ngăn ngừa về sau).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000212
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000212: terms: [''Khối Thịnh vượng
    chung (the Commonwealth)'']: pronouns_and_address: [''Quy chiếu Khối Thịnh vượng
    chung bằng `họ`.'']: pov_and_voice: Câu chuyển ý giả định mở đường cho khẩu hiệu
    tuyên truyền.: modality_and_logic: Giữ cấu trúc điều kiện giả định (`Nhưng nếu
    Khối Thịnh vượng chung muốn, họ có thể...`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000213
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000213: terms: [''Đế quốc (Empire)'',
    ''tàu Khối Thịnh vượng chung (Commonwealth Vessel)'']: pronouns_and_address: []:
    pov_and_voice: Dòng tít báo/khẩu hiệu tuyên truyền giả định ngắn gọn, trực diện.:
    modality_and_logic: Giữ hình thức mệnh đề tiêu đề ngắn gọn kết thúc không dấu
    chấm.: emphasis: Khóa chính xác toàn bộ dòng in nghiêng `*Đế quốc đánh chìm tàu
    Khối Thịnh vượng chung*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000214
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000214: terms: [''công chúng (public)'',
    ''Bộ Ngoại giao Đế quốc (the Empire’s Foreign Office)'']: pronouns_and_address:
    [''Quy chiếu Khối Thịnh vượng chung bằng `họ` (`công chúng của họ`).'']: pov_and_voice:
    Phân tích tác động kích động dư luận và nỗi lo của Bộ Ngoại giao Đế quốc.: modality_and_logic:
    Giữ hình ảnh so sánh `Chẳng khác nào đổ xăng vào đám cháy âm ỉ` và quan hệ nguyên
    nhân – hệ quả giải thích lý do Bộ Ngoại giao Đế quốc lo ngại tình hình xấu đi
    thêm.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000215
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000215: terms: [''các cường quốc
    khác (the other powers)'', ''Đế quốc (the Empire)'', ''bá quyền (a hegemonic state)'',
    ''duy trì thế cân bằng quyền lực (balancing the powers)'']: pronouns_and_address:
    []: pov_and_voice: Phân tích bản chất cuộc khủng hoảng dưới góc độ thế cân bằng
    quyền lực quốc tế.: modality_and_logic: Giữ nhịp tự hiệu chỉnh ở đầu đoạn (`Không,
    nói chính xác hơn thì ai cũng biết.`) và câu hỏi lựa chọn hai vế của thế giới
    (để Đế quốc toàn thắng dẫn tới sự ra đời của một bá quyền hay can thiệp để duy
    trì thế cân bằng quyền lực).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000216
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000216: terms: [''cái cớ (an excuse)'',
    ''óc phán đoán thông thường (commonsense powers of judgment)'']: pronouns_and_address:
    [''Lược đại từ ngôi thứ hai phiếm chỉ ở câu cuối (`Chỉ cần có óc phán đoán thông
    thường là thấy rõ.`).'']: pov_and_voice: Nhận định dứt khoát, thực dụng về bản
    chất vụ việc.: modality_and_logic: Giữ nhịp câu ngắn, khẳng định vụ tàu ngầm chỉ
    là cái cớ và thực tế mọi bên đều đã chuẩn bị tinh thần.: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000217
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000217: terms: [''Các nhà hoạch
    định chính sách (The policy makers)'', ''Đế quốc (the Empire)'', ''Khối Thịnh
    vượng chung (the Commonwealth)'']: pronouns_and_address: []: pov_and_voice: Nhận
    định tổng kết về tầm nhìn chiến lược của giới hoạch định chính sách hai nước.:
    modality_and_logic: Giữ khẳng định rằng cuộc đụng độ giữa hai quốc gia chỉ còn
    là vấn đề thời gian.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000218: terms: [''Thiếu tá von
    Degurechaff (Major von Degurechaff)'', ''sĩ quan pháp sư (magic officer)'', ''ưu
    tiên hàng đầu (top priority)'']: pronouns_and_address: []: pov_and_voice: Đánh
    giá vị thế cá nhân của Tanya trong bức tranh đại cục.: modality_and_logic: Khóa
    danh xưng `Thiếu tá von Degurechaff`, giữ sắc thái tự giễu/thu nhỏ tầm vóc cá
    nhân (`một sĩ quan pháp sư nhỏ bé`) trước đại cục chiến lược.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000219
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000219: terms: [''sông Rhine (the
    Rhine)'', ''các Thiếu tướng von Zettour và von Rudersdorf (Major Generals von
    Zettour and von Rudersdorf)'']: pronouns_and_address: [''Khóa bản sửa theo B09-P03:
    trần thuật ngôi thứ ba quy chiếu Tanya nhất quán bằng `nó` ở cả 3 vị trí (`sự
    hiện diện của nó`, `điều động nó`, `đưa nó đến đó`) theo đúng DEC-P01-001.'']:
    pov_and_voice: Trần thuật phân tích lý do chính trị và nhân sự khiến Tanya được
    điều tới mặt trận sông Rhine.: modality_and_logic: Khóa cụm chức danh số nhiều
    `các Thiếu tướng von Zettour và von Rudersdorf`, giữ sự kết hợp giữa lý do chính
    trị trước mắt và ý định sẵn có từ trước của hai vị tướng giúp việc điều động diễn
    ra suôn sẻ.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000220
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000220: terms: [''Bộ Tổng tham
    mưu (The General Staff)'', ''Các nhà ngoại giao (The diplomats)'', ''các chuyên
    gia pháp lý (the legal specialists)'']: pronouns_and_address: [''Độc thoại nội
    tâm ngôi thứ nhất của Tanya tự quy chiếu bằng `mình` (4 lần) theo đúng DEC-P01-001;
    quy chiếu các nhà ngoại giao bằng `họ`.'']: pov_and_voice: Độc thoại nội tâm sắc
    lạnh, nhìn thấu tâm tư của từng bộ phận trong bộ máy Đế quốc đối với bản thân.:
    modality_and_logic: Giữ cấu trúc liệt kê tăng tiến 3 nhóm chủ thể: Bộ Tổng tham
    mưu mong đạt kết quả, các nhà ngoại giao mong đừng gây thêm rắc rối (thậm chí
    muốn Tanya chết ngoài mặt trận), và các chuyên gia pháp lý muốn thoát khỏi mối
    phiền toái.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000221
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000221: terms: [''phía tây (west)'',
    ''Ác quỷ sông Rhine (the Devil of the Rhine)'']: pronouns_and_address: [''Khóa
    bản sửa theo B09-P04: trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` (`đưa nó
    cùng binh lính của nó`) và biệt danh `Ác quỷ sông Rhine` (DEC-P01-001).'']: pov_and_voice:
    Trần thuật ngôi thứ ba khắc họa nụ cười nhếch mép đầy mỉa mai của Tanya.: modality_and_logic:
    Khóa biệt danh tạm `Ác quỷ sông Rhine`, giữ thành ngữ chỉ số đông (`ai nấy đều
    muốn`) và hành động `nhếch mép cười`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000222
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000222: terms: [''chiến tuyến (lines)'',
    ''địa ngục (hellish)'']: pronouns_and_address: []: pov_and_voice: Câu trần thuật
    ngắn chuyển cảnh trực tiếp sang thực tại khốc liệt ở chiến tuyến phía tây.: modality_and_logic:
    Khóa bản sửa theo B09-P05 (`Và tình hình ở những chiến tuyến ấy càng giống địa
    ngục hơn.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000223
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000223: terms: [''đạn pháo (shells)'',
    ''từ bữa sáng đến tận bữa sáng muộn (from breakfast through brunch)'', ''tuyến
    đầu (the forward-most line)'', ''chiến hào (the trenches)'']: pronouns_and_address:
    [''Lược đại từ ngôi thứ hai phiếm chỉ trong toàn đoạn (`tỉnh dậy và thấy người
    bạn vừa ngủ ngay bên cạnh... Thả lỏng trong chiến hào... Vì thế phải mỉm cười...`).'']:
    pov_and_voice: Độc thoại/chiêm nghiệm đậm chất hài đen về sự khắc nghiệt thường
    nhật nơi chiến hào tiền tuyến.: modality_and_logic: Khóa bản sửa theo B09-P06
    (`từ bữa sáng đến tận bữa sáng muộn`), giữ nghịch ngữ châm biếm `là điều hiếm
    hoi mà xảy ra như cơm bữa` và mệnh đề đối lập cuối đoạn (`Người ta bảo không thể
    đánh trận với nụ cười trên môi, nhưng chiến tranh thiếu nụ cười thì nguy hiểm
    lắm.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000224
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000224: terms: [''binh lính (the
    troops)'', ''bị bắn tỉa (get sniped at)'', ''thuốc lá (cigarettes)'']: pronouns_and_address:
    [''Quy chiếu binh lính bằng `họ`; lược đại từ ngôi thứ hai phiếm chỉ (`phải đảm
    bảo... Nếu không muốn bị bắn tỉa, phải bỏ thuốc lá.`).'']: pov_and_voice: Nguyên
    tắc chỉ huy thực chiến của Tanya về việc quản lý tinh thần, rượu và thuốc lá nơi
    chiến hào.: modality_and_logic: Giữ trọn 3 câu điều kiện/chỉ dẫn thực tế về dấu
    hiệu suy sụp tinh thần, kiểm soát uống rượu và cấm hút thuốc để tránh bị bắn tỉa.:
    emphasis: Khóa chính xác toàn bộ đoạn 3 câu in nghiêng `*Nếu binh lính mất khả
    năng mỉm cười thì đó là dấu hiệu chẳng lành. Những lúc như thế, phải đảm bảo họ
    không uống quá nhiều. Nếu không muốn bị bắn tỉa, phải bỏ thuốc lá.*` khớp với
    thẻ `<html:em>` trong nguồn (DEC-P01-002).'
