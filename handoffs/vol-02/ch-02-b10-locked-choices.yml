task_id: vol-02-ch-02-b10
baseline_sha256: 5c7d7f213bef9c9a5a89052a155ed69557573b52b1183e37d5b7ad0fa75697db
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: c6624394583dbd40c7d45b98772b5b9b103acc64db0e967f184f485b5f10b51e
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 37
segment_id_start: YS-LN02/Text/part0014.xhtml/p000221
segment_id_end: YS-LN02/Text/part0014.xhtml/p000257
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000221
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000221: locks: [''Giữ câu trần
    thuật đã sửa theo signoff `M1` (bảo toàn quan hệ đồng thời và dùng đại từ `anh`
    theo `vol02-ch02-b10-viper-commander-narration` cùng `DEC-P01-001`): `Đúng lúc
    anh vừa nghĩ vậy thì chuyện đó xảy ra.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000222
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000222: locks: [''Giữ lời đáp và
    câu hỏi ngạc nhiên qua vô tuyến `“Rõ… Gì cơ? Thật à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000223
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000223: locks: [''Giữ nhịp liệt
    kê âm thanh và danh xưng `sở chỉ huy`: `Một tiếng thì thầm, rồi tiếng la. Tiếp
    đó là một loạt giọng nói dồn dập. Có chuyện gì đó đang xảy ra ở sở chỉ huy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000224
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000224: locks: [''Giữ danh xưng
    `Sở chỉ huy` và câu hỏi `“Sở chỉ huy? Có chuyện gì vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000225
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000225: locks: [''Giữ các danh
    xưng `Sở chỉ huy`, `Tiểu đoàn Viper`, và mệnh lệnh `“Sở chỉ huy gọi Tiểu đoàn
    Viper. Lập tức rút lui.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000226
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000226: locks: [''Giữ cụm `Lệnh
    rút lui mong đợi đã được truyền xuống bằng giọng điệu không cho phép tranh cãi`,
    các đại từ `anh`, `họ`, phủ định `nhưng anh chưa từng nghĩ họ sẽ nhận lệnh theo
    cách này`, và đúng phạm vi nhấn mạnh in nghiêng của câu hỏi nội tâm cuối đoạn
    theo `DEC-P01-002`: `*Chuyện quái gì đã xảy ra?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000227
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000227: locks: [''Giữ các đại từ
    `Chúng tôi`, `Tôi`, và hai câu hỏi xác nhận `“Chúng tôi được phép rút lui sao?
    Tôi rất cảm kích, nhưng mọi chuyện vẫn ổn chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000228
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000228: locks: [''Giữ các đại từ
    `các anh`, `họ`, các cụm `Mừng đi—các anh có viện binh.`, `Một tiểu đoàn đang
    khẩn trương đến từ Khu vực B-3.` (theo `vol02-ch02-b10-sector-b3`), và `Sau khi
    hội quân với họ, các anh sẽ chịu quyền chỉ huy của họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000229
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000229: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các đại từ `Họ`, `chúng
    ta`, cụm `lực lượng dự bị`, và toàn văn `*Viện binh ư? Họ từ xó xỉnh nào đột nhiên
    xuất hiện vào giờ này vậy? Nếu có lực lượng dự bị, sao chúng ta lại phải chật
    vật đến thế?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000230
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000230: locks: [''Giữ đại từ `Tôi`,
    cụm `quân tăng viện`, và lời chất vấn `“Viện binh ư? Tôi chưa nghe chuyện đó.
    Nếu còn quân tăng viện thì sao giờ mới điều đến?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000231
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000231: locks: [''Giữ đại từ `Họ`,
    danh xưng `Trung ương`, cụm `Hiệu gọi Pixie` (theo `vol02-ch02-b10-pixie-callsign`),
    và câu `“Họ được điều từ Trung ương. Hiệu gọi Pixie.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000232
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000232: locks: [''Giữ các danh
    xưng `Trực ban viên`, `lực lượng Trung ương`, `Bộ chỉ huy`, các đại từ `anh`,
    `họ`, tình thái suy đoán `họ hẳn sẽ bị cuốn ngay vào giao tranh vừa đến nơi`,
    `Có lẽ họ đã xuất hiện sớm hơn dự kiến`, và đúng phạm vi nhấn mạnh in nghiêng
    theo `DEC-P01-002` chỉ ở từ cảm thán `*Tuyệt!*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000233
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000233: locks: [''Giữ câu thoại
    đã sửa theo signoff `M2` với đại từ `anh` (theo `vol02-ch02-b10-cp-address-to-viper02`)
    và thuật ngữ giữ nguyên `Named` (theo `vol02-ch02-b10-named`): `“Và anh nên mừng.
    Chỉ huy của họ là một Named.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000234
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000234: locks: [''Giữ đại từ `anh`
    và câu trần thuật `Bất giác quên mất nỗi bực dọc, anh suýt huýt sáo vì kinh ngạc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000235
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000235: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, thuật ngữ `Named` (theo
    `vol02-ch02-b10-named`), đại từ nội tâm tự quy chiếu đã sửa theo signoff `M3`
    `mình` (theo `vol02-ch02-b08-viper-interior-self-reference`), đại từ `họ`, và
    toàn văn `*Tuyệt vời. Quá tuyệt vời. Một tiểu đoàn viện binh và một Named. Cứ
    như lễ hội mùa gặt với Giáng sinh cùng đến một lúc, mang theo món quà tuyệt vời
    này vậy. Giá mà được, mình sẽ khui một chai sâm panh và nâng cốc chào đón họ.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000236
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000236: locks: [''Giữ hô hiệu `Viper
    02 nghe rõ.` và câu cảm thán `“Viper 02 nghe rõ. Viện binh xịn sò thật đấy.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000237
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000237: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm tự quy chiếu
    đã sửa theo signoff `M3` `mình` / `Mình` (theo `vol02-ch02-b08-viper-interior-self-reference`),
    các đại từ `chúng ta`, `họ`, và toàn văn `*Nếu viện binh chất lượng đến thế thì…
    phải, mình hiểu vì sao chúng ta được phép rút lui rồi. Mình muốn hô hoan hô, nhưng
    ước gì họ đến sớm hơn một chút.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000238
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000238: locks: [''Giữ đại từ `anh`
    / `Anh`, cụm `tiểu đoàn của anh`, và giả định trái thực tế ở quá khứ `nếu viện
    binh đến sớm hơn thì tiểu đoàn của anh đã không phải chịu khổ nhiều đến vậy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000239
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000239: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng của câu đầu đoạn theo `DEC-P01-002` `*Thêm vài chiếc tiêm
    kích nữa thì hoàn hảo.*`, các đại từ `anh`, `họ`, cụm `cất cánh đánh chặn`, và
    câu kết ngoài vùng in nghiêng `Thật nhẹ nhõm khi biết địch thế nào cũng bị nghiền
    nát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000240
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000240: locks: [''Giữ câu hỏi `“Tiêm
    kích sẽ cất cánh lúc nào?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000241
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000241: locks: [''Giữ dấu ba chấm
    mở đầu, phủ định `không cần thiết`, và câu đáp `“…Họ nhận định là không cần thiết.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000242
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000242: locks: [''Giữ đại từ `anh`
    và câu `Câu trả lời bất ngờ khiến anh sững sờ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000243
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000243: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`: `*Tiêm kích? Không cần thiết
    ư?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000244
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000244: locks: [''Giữ tiếng thốt
    `“Hả?”`, đại từ `Anh`, danh xưng `nhân viên điện đài`, và câu `“Hả?” Anh muốn
    hỏi nhân viên điện đài đang nói gì vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000245
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000245: locks: [''Giữ phủ định
    và mệnh lệnh `“Đừng bận tâm. Cứ mau chóng hội quân với viện binh đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000246
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000246: locks: [''Giữ dấu ba chấm
    và lời đáp `“…Rõ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000247
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000247: locks: [''Giữ các danh
    xưng `Các sĩ quan tại Sở chỉ huy Cụm tập đoàn quân phương Bắc`, `Phó cục trưởng
    Tác chiến thuộc Bộ Tổng tham mưu Trung ương`, `Trung ương`, các đại từ `họ`, `Chúng
    tôi`, và nguyên văn thông điệp trích dẫn `“Chúng tôi đã điều viện binh đến. Đừng
    động vào họ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000248
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000248: locks: [''Giữ danh xưng
    `Bộ Tổng tham mưu`, đại từ `chúng`, cụm `tùy tiện nhúng tay vào chuyện ở tiền
    tuyến`, và câu thoại `“Cái Bộ Tổng tham mưu chết tiệt. Sao chúng nghĩ chúng có
    thể tùy tiện nhúng tay vào chuyện ở tiền tuyến?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000249
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000249: locks: [''Giữ các danh
    xưng `Các sĩ quan cấp cao của lực lượng phương Bắc`, `Trung ương`, `Đại Quân`,
    `mặt trận phía tây`, đại từ `họ`, và mạch nhân quả về việc phần lớn Đại Quân đột
    ngột bị điều sang mặt trận phía tây bỏ mặc lực lượng phương Bắc trong cảnh rối
    ren.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000250
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000250: locks: [''Giữ các cụm `Theo
    báo cáo từ đài quan sát`, `một đội pháp sư không quân quy mô cấp tiểu đoàn`, và
    `quả thật đang nhanh chóng áp sát`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000251
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000251: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các cụm `một đợt viện binh
    khá ra trò`, `lực lượng phản ứng`, `Trung ương`, các đại từ `chúng ta`, `họ`,
    và câu kết `*Nhưng Trung ương điều viện binh đến rồi lại bảo chúng ta đừng động
    vào họ thì quá đáng lắm.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000252
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000252: locks: [''Giữ các đại từ
    `họ`, `ta`, cụm `đội tinh nhuệ`, và câu hỏi `“Chà, có khi họ gửi cho ta đội tinh
    nhuệ thật?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000253: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng chỉ ở ba câu đầu theo `DEC-P01-002`, danh xưng đã sửa
    theo signoff `Quân Trung ương` (theo `vol02-ch02-b10-central-army`), các danh
    xưng `Đại Quân`, `Bộ chỉ huy phương Bắc`, các đại từ `chúng ta`, `Họ` / `họ`,
    `Đám người đó`, và câu kết ngoài vùng in nghiêng `Dù không muốn buộc tội họ lợi
    dụng tình cảnh hiện tại của Bộ chỉ huy phương Bắc, có lẽ họ đang tính xóa món
    nợ ấy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000254
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000254: locks: [''Giữ các đại từ
    `Họ` / `họ`, `chúng ta`, và câu hỏi `“Họ định khiến chúng ta mang ơn họ… sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000255
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000255: locks: [''Giữ cụm trích
    dẫn trong ngoặc đơn `‘Đừng động vào họ’` và câu `“Nhưng bảo ‘Đừng động vào họ’
    à? Đúng là gan thật.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000256
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000256: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các cụm `các kho tiếp tế
    miền Bắc`, `mạng lưới hậu cần vốn đã tồi tệ của Cụm tập đoàn quân phương Bắc`,
    các đại từ `họ` / `Họ`, `chúng ta`, và câu hỏi kết đoạn `*Họ có biết mạng lưới
    hậu cần vốn đã tồi tệ của Cụm tập đoàn quân phương Bắc có thể sụp đổ hoàn toàn
    không?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000257
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000257: locks: [''Giữ câu thoại
    mở đầu `“Đường tiếp tế miền Bắc đang khủng hoảng mà họ còn lớn tiếng thế. Ước
    gì tôi cũng tự tin được như vậy.”`, đúng phạm vi nhấn mạnh in nghiêng chỉ ở câu
    thứ hai theo `DEC-P01-002` `*Có thể gọi lời cảnh báo đó là ngạo mạn cũng chẳng
    sai.*`, đại từ `Anh` trong câu trần thuật tiếp theo, và câu kết `Rồi lại có thêm
    tin khiến mọi người kinh ngạc hơn nữa.`.'']'
  non_canon: true
