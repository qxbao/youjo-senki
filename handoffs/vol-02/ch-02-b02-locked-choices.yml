choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000025: locks: [''Giữ câu mở đầu
    in nghiêng `*Khoan đã.*` theo DEC-P01-002; giữ đại từ `ông`, `họ`, sự phân biệt
    từ vựng `quê hương` – `nhà nước` – `mái nhà` – `Tổ quốc`, cùng các cụm `một đất
    nước bị hủy diệt không có nghĩa là người dân nước đó cũng phải diệt vong`, `cánh
    đồng Tổ quốc lại nở hoa`, `Vẫn còn hy vọng được tái sinh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000026: locks: [''Giữ sự phân biệt
    từ vựng `Quê hương` và `quê nhà` trong câu `Quê hương không chỉ là lãnh thổ; chừng
    nào quê nhà còn tồn tại trong trái tim người dân, chừng đó vẫn chưa phải hồi kết.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000027: locks: [''Giữ đại từ `Ông`,
    các cụm `đồng bào`, `đại nghĩa đáng để một người lính của quốc gia đang lụi tàn
    dốc lòng phụng sự`, và `một người lính đã thề bảo vệ Tổ quốc có thể tự hào`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000028: locks: [''Giữ câu thoại
    cảm thán ngắn `“Đây rồi. Phải, tìm thấy rồi!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000029: locks: [''Giữ danh xưng
    `Đại tá Sue` và câu thề nội tâm in nghiêng theo DEC-P01-002 với cặp đại từ cổ
    kính trang trọng `*Ta sẽ không bao giờ để bất kỳ ai hủy diệt ngươi, hỡi Tổ quốc.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000030: locks: [''Giữ đại từ `Ông`
    / `ông`, cụm `quê nhà của gia đình ông`, `để lại tương lai cho vợ con`, và `những
    mối quan hệ trong quân đội mà trước đó ông chẳng mấy để tâm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000031: locks: [''Giữ danh xưng
    `các nghị viên mới của Liên minh Entente`, cụm `gương mặt u ám phảng phất vẻ cam
    chịu và ăn năn khó lòng che giấu`, và hình ảnh `cuống cuồng tìm cách lật ngược
    chiếc đồng hồ cát khi thời gian cứ trôi đi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000032: locks: [''Giữ các danh
    xưng `Đế quốc`, `Tổ quốc`, câu hỏi `“Tại sao Tổ quốc lại làm chuyện liều lĩnh
    đến thế?”`, đại từ `họ`, `mình` và cụm `nghiền nát kẻ thách thức nhỏ bé láo xược
    đang chực cắn xé mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000033: locks: [''Giữ các danh
    xưng `Cộng hòa`, `Liên minh Entente`, `Công quốc Dacia`, `các nghị viên`, cùng
    các cụm `guồng máy hủy diệt đã tạm khựng lại vì cuộc tấn công bất ngờ của Cộng
    hòa` và `sau màn phô trương binh đao của họ—thứ nghe chẳng khác nào khúc nhạc
    vui đối với các nghị viên`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000034: locks: [''Giữ các danh
    xưng `Đế quốc`, `Liên minh Entente` và các cụm `những ngày cuối thảm hại của kẻ
    thách thức mới nổi…`, `cơn ác mộng thành hiện thực đối với Liên minh Entente`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000035: locks: [''Giữ danh xưng
    `các nghị viên mới`, đại từ `họ` và cụm `giữ vững chiến tuyến và tiếp tục kháng
    cự`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000036: locks: [''Giữ cách xưng
    hô `thưa quý vị`, `tôi`, `chúng ta` và cụm `Đây chỉ là giải pháp tình thế, nhưng
    chúng ta đã bắt đầu phối hợp với các đồng minh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000037: locks: [''Giữ cụm `chín
    nghị viên còn lại trong phòng họp` và chức danh `Nghị viên Ngoại giao Abensoll`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000038: locks: [''Giữ các danh
    xưng `Cộng hòa`, `Đế quốc`, `Liên minh Entente`, `Dacia`, đại từ `ông` quy chiếu
    Abensoll, đại từ `họ` và các cụm `lo vòng vây Đế quốc sụp đổ sau nước cờ liều
    lĩnh của Liên minh Entente`, `công khai đối đãi với họ bằng thái độ khinh miệt
    lạnh lùng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000039: locks: [''Giữ câu nói `“Thảm
    họa này là do các vị khinh suất.”` cùng các danh xưng `Một nhà ngoại giao của
    Cộng hòa`, `Abensoll`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000040: locks: [''Giữ các danh
    xưng `Cộng hòa`, `mặt trận Rhine` và câu hỏi đuôi `phải không?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000041: locks: [''Giữ các danh
    xưng `Cộng hòa`, `mười nghị viên`, đại từ `họ` và câu suy nghĩ tập thể in nghiêng
    theo DEC-P01-002 `*Cùng lắm, Cộng hòa chỉ muốn trút bớt gánh nặng cho mình bằng
    cách để chúng ta tiếp tục chiến đấu ở mặt trận thứ hai.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000042: locks: [''Giữ danh xưng
    `Nghị viên Cazor`, đại từ trọng thị `ngài`, cùng các danh xưng `Cộng hòa`, `Dacia`
    trong câu `“Nghị viên Cazor, mối lo của ngài là có lý, nhưng Cộng hòa đang lo
    chuyện Dacia tái diễn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000043: locks: [''Giữ đại từ `ngài`,
    `chúng ta`, `họ`, `Đế quốc` trong lời thoại của Cazor; giữ chức danh `Nghị viên
    Lục quân Cazor`, đại từ `ông`, cụm `bị đối xử như Dacia thứ hai`, danh xưng `Đại
    công quốc` (viết hoa âm tiết đầu, không tự thêm `Dacia`) và `Liên minh Entente`.'']'
  non_canon: true
