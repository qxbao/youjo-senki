segment_id_end: YS-LN02/Text/part0016.xhtml/p000119
choices:
- segment_id: YS-LN02/Text/part0016.xhtml/p000100
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000100: locks: [''Giữ câu thoại
    mở đầu `“Địch cũng phải đối mặt với những điều kiện tương tự.”`, định danh `Phía
    Tác chiến` (theo `vol02-ch03-b05-staff-departments`), tên riêng `Degurechaff`,
    đại từ trần thuật điểm nhìn bên ngoài `cô` (theo `vol02-ch03-b05-tanya-external-pov`),
    và đại từ phản thân `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000101
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000101: locks: [''Giữ đại từ ngôi
    thứ nhất số nhiều `chúng ta`, các cụm `phí phạm nguồn lực ở lãnh thổ địch`, `giải
    quyết mọi việc bằng một đòn quyết định`, và toàn văn câu thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000102
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000102: locks: [''Giữ câu thoại
    `“Phía Hậu cần không kham nổi đâu.”`, các định danh `Phía Hậu cần`, `các sĩ quan
    phía Tác chiến` (theo `vol02-ch03-b05-staff-departments`), cụm trung tính đã sửa
    ở F01 `đề nghị thu hẹp tuyến`, đại từ điểm nhìn bên ngoài `cô` / `Cô` (chỉ Tanya),
    đại từ `họ` (chỉ phía Cụm tập đoàn quân phương Bắc / Tác chiến), và câu kết `Không,
    vẻ mặt thanh tú ấy cho thấy cô cho rằng kế hoạch của họ thật ngu ngốc.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000103: locks: [''Giữ đại từ ngôi
    thứ hai số nhiều `các anh` và toàn văn câu thoại `“Ngay khi các anh xuất quân,
    các anh đã tiến xa hết mức có thể rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000104: locks: [''Giữ tên riêng
    `Schreise`, cụm `các nhân viên phía Hậu cần` (theo `vol02-ch03-b05-staff-departments`),
    và toàn văn câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000105: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng `*có sẵn*` theo `DEC-P01-002`, đại từ `Họ` / `họ` (chỉ
    phía Hậu cần), đại từ `ông` (chỉ Schreise), và các thuật ngữ `lượng hàng tiếp
    tế`, `một chiến dịch tiến công ngắn ngày`, `rìa tiền tuyến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000106: locks: [''Giữ đại từ `chúng
    ta` / `Chúng ta`, cụm `Một chiến dịch tiến công ngắn ngày`, và toàn văn hai câu
    thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000107: locks: [''Giữ đại từ `ông`
    (chỉ Schreise), `họ` (chỉ phía Hậu cần / quân Đế quốc), và các thuật ngữ `các
    sĩ quan phía Hậu cần`, `đạn dược tiêu chuẩn cho hai trận đánh`, `khẩu phần ăn
    cho ba tuần`, `Nhiên liệu hàng không`, `nhiên liệu thông dụng` (theo `vol02-ch03-b05-military-terms`),
    `cụm tập đoàn quân` (theo `vol02-ch03-b05-northern-army-group`), `mặt trận phía
    bắc`, `Lực lượng dự bị của địch`, `một cuộc tiến công quy mô lớn…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000108: locks: [''Giữ tên riêng
    `Degurechaff`, đại từ trần thuật điểm nhìn bên ngoài `Cô` (theo `vol02-ch03-b05-tanya-external-pov`),
    đại từ trong thoại `Tôi`, `chúng ta`, `quân ta`, và các thuật ngữ `chọc thủng
    phòng tuyến`, `hai mươi kilômét khỏi tuyến đường sắt nhẹ` (theo `vol02-ch03-b05-light-rail`),
    `các tuyến tiếp tế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000109: locks: [''Giữ tên riêng
    `Schreise`, đại từ `cô`, và toàn văn câu `Một vài sĩ quan nhăn mặt, nhưng Schreise
    vẫn giữ vững lập trường ngay cả khi bị cô chỉ trích gay gắt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000110: locks: [''Giữ đại từ trần
    thuật `Ông` / `ông` (chỉ Schreise), các thuật ngữ `quét sạch tàn quân địch`, `một
    cuộc đại tiến công suốt ba tuần`, `các toán pháp sư biệt kích của địch` (theo
    `vol02-ch03-b05-military-terms`), và danh xưng kết đoạn `Thiếu tá von Degurechaff`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000111: locks: [''Giữ các thuật
    ngữ đã chuẩn hóa ở F02 `công binh dã chiến`, `đặt thêm đường sắt nhẹ` (theo `vol02-ch03-b05-light-rail`),
    `các sĩ quan Trung ương` (theo `vol02-ch03-b05-central-army`), cùng các đại từ
    `họ` và `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000112: locks: [''Giữ đại từ ngôi
    thứ hai nhất quán đã sửa ở F03 `Cô` / `cô`, đại từ phản thân `mình`, cụm `quân
    ta chỉ đông bằng một nửa đối phương`, và định danh `Liên minh Entente`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000113: locks: [''Giữ các thuật
    ngữ `tổn thất pháp sư`, `các cường quốc khác`, `một tiểu đoàn pháp sư của Đế quốc
    mới thành lập`, `một trung đoàn của Liên minh Entente`, và toàn văn câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000114: locks: [''Giữ các cụm `Tuyến
    phòng thủ chủ lực của địch`, `lãnh thổ Liên minh Entente`, `nhân viên tình báo`,
    và tên riêng `Tanya`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000115: locks: [''Giữ đại từ `Chúng
    ta` / `ta`, các cụm `sức mạnh và chất lượng của binh sĩ`, `nguồn tiếp tế vốn đã
    hạn chế`, và toàn văn hai câu thoại.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000116: locks: [''Giữ cấu trúc
    tăng tiến `thiếu thốn không chỉ vũ khí, đạn dược mà cả lương thực`, các thuật
    ngữ `tù binh địch`, `Phía Tình báo` (theo `vol02-ch03-b05-staff-departments`),
    và cụm `tác chiến như một lực lượng thống nhất`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000117: locks: [''Giữ định danh
    đã chuẩn hóa ở F12 `Cụm tập đoàn quân phương Bắc` (theo `vol02-ch03-b05-northern-army-group`),
    cụm `một viên thiếu tá ngoan cố`, và câu cảm thán kết đoạn `Thật lãng phí thời
    gian biết bao.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000118: locks: [''Giữ tên riêng
    `Schreise`, cấu trúc giả định phản thực cùng đại từ và định danh đã sửa ở F02/F04
    `rằng ông hẳn đã đuổi cô ra ngoài ngay lập tức, nếu cô không phải là đại diện
    cho quan điểm của Quân Trung ương.` (theo `vol02-ch03-b05-central-army`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000119: locks: [''Giữ đại từ `tôi`,
    mệnh đề bị động trung tính đã sửa ở F05 `hai tiểu đoàn bị bào mòn bởi nỗ lực của
    các đồng đội chúng ta`, và thuật ngữ `một nhóm quân không được chi viện, quy mô
    cỡ một đại đội tăng cường` (theo `vol02-ch03-b05-military-terms`).'']'
  non_canon: true
