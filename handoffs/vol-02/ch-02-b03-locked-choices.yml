segment_id_end: YS-LN02/Text/part0014.xhtml/p000071
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000044: locks: [''Giữ danh xưng
    `Nghị viên Abensoll` và câu hỏi `chắc không chỉ có vậy chứ?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000045: locks: [''Giữ các danh
    xưng `Cộng hòa`, `Khối Thịnh vượng chung`, `các cường quốc`, đại từ `họ`, `chúng
    ta` và các cụm `gửi một hình thức viện trợ nào đó`, `ngăn chúng ta bị tiêu diệt
    hoàn toàn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000046
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000046: locks: [''Giữ chức danh
    `Nghị viên Ngoại giao Abensoll`, cụm `một nghị viên lớn tuổi hơn`, đại từ `ông`,
    `họ` và cụm `chính sách đối ngoại của một cường quốc trung lập có thiện cảm với
    họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000047
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000047: locks: [''Giữ các danh
    xưng `Liên minh Entente`, `Cộng hòa`, `Đế quốc`, `Khối Thịnh vượng chung`, đại
    từ `họ` cùng các cụm `nổi tiếng với lực lượng hải quân xuất sắc`, `quyết định
    đi bước đầu tiên để tiến tới việc tham chiến`, `duy trì thế cân bằng quyền lực`
    và `xét theo góc độ realpolitik, có thể tin tưởng họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000048
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000048: locks: [''Giữ tên riêng
    `Hiệp ước Londinium`, đại từ `chúng ta` và câu `“Ồ, lại là Hiệp ước Londinium
    thân thiện ấy à? Dù chính chúng ta mới là bên phá vỡ nó…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000049
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000049: locks: [''Giữ các danh
    xưng `ban lãnh đạo Liên minh Entente`, `các cường quốc khác`, `Khối Thịnh vượng
    chung`, đại từ `họ` và mệnh đề `Khối Thịnh vượng chung đưa ra lời đề nghị này,
    một nửa là để sỉ nhục họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000050
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000050: locks: [''Giữ câu hỏi `“Vậy
    chúng ta có những lựa chọn nào?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000051
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000051: locks: [''Giữ các danh
    xưng `Chiến tranh Dacia`, `Cộng hòa`, đại từ `họ`, `chúng ta` và cụm `lo ngại
    các vùng hậu phương của chúng ta không được bảo vệ đầy đủ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000052
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000052: locks: [''Giữ các danh
    xưng `Cộng hòa`, `Đế quốc`, `Liên minh Entente`, đại từ `họ` và các cụm `dựa vào
    địa hình và khí hậu để giữ vững mặt trận`, `không xem họ là mối đe dọa nghiêm
    trọng và chỉ coi đây như một mặt trận phụ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000053
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000053: locks: [''Giữ đại từ `Tôi`,
    `Chúng ta` trong lời thoại, chức danh `Nghị viên Nội vụ` và cụm `khoảng cách sức
    mạnh giữa các quốc gia, quả thật là vô cùng lớn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000054
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000054: locks: [''Giữ các danh
    xưng `Đế quốc`, `Liên minh Entente` và các cụm `giao chiến với một tập đoàn quân
    của Đế quốc`, `dành phần lớn nguồn lực để duy trì quân đội trên tiền tuyến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000055
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000055: locks: [''Giữ đại từ `chúng
    ta`, `họ`, thuật ngữ `các đơn vị pháp sư`, `hậu phương` và cụm `xử lý phần lớn
    tình huống trước khi chúng trở thành vấn đề nghiêm trọng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000056
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000056: locks: [''Giữ các danh
    xưng `Liên minh Entente`, `giới lãnh đạo`, `lữ đoàn kỵ binh Đế quốc`, `chiến dịch
    đổ bộ đường không`, `pháp sư không quân`, `Sư đoàn phản ứng nhanh của Liên minh
    Entente`, `các pháp sư`, cùng đại từ `Họ` / `họ` và phản thân `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000057: locks: [''Giữ các danh
    xưng `Khối Thịnh vượng chung`, `Đế quốc`, đại từ `họ` và cụm `một cuộc tấn công
    hải quân của Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000058: locks: [''Giữ câu hỏi `“Đổ
    bộ từ biển ư? Tôi không muốn nói điều hiển nhiên, nhưng chẳng phải cứ đợi chúng
    đổ bộ rồi tấn công là được sao?”` với đại từ `Tôi` và `chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000059: locks: [''Giữ chức danh
    `Nghị viên Ngoại giao Abensoll`, các danh xưng `Khối Thịnh vượng chung`, `Đế quốc`,
    cụm `một cuộc đổ bộ đường biển`, `các sĩ quan của họ`, cùng cặp đại từ `Tôi` –
    `các vị` trong câu cảnh báo trực tiếp.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000060: locks: [''Giữ đại từ `chúng
    ta` và các cụm `toàn bộ chủ lực của chúng ta đều bị ghìm chân`, `một lực lượng
    đổ bộ đường biển nhỏ cũng có thể gây ra thảm họa`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000061: locks: [''Giữ tên riêng
    `Abensoll`, `Liên minh Entente` và các cụm `quân xâm lược đặt chân lên bờ mà không
    gặp kháng cự`, `để lộ sườn cho một đòn đánh từ phía sau, khiến cả đất nước sụp
    đổ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000062: locks: [''Giữ danh xưng
    `Nghị viên Abensoll`, `Hải quân Cộng hòa`, đại từ `ông`, `chúng ta` và cụm `chính
    chúng ta cũng chỉ có hai thiết giáp hạm thôi đấy?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000063: locks: [''Giữ đại từ `ông`
    quy chiếu Abensoll trong câu `Thế nhưng ông vẫn cố tìm được chút hy vọng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000064: locks: [''Giữ các danh
    xưng `Khối Thịnh vượng chung`, `hải quân Đế quốc`, `hạm đội Cộng hòa` và cụm `đã
    sẵn sàng triển khai nếu cần`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000065: locks: [''Giữ câu ngắn
    in nghiêng toàn bộ `*Nghĩa là…*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000066: locks: [''Giữ lời hô gọi
    `Thưa các vị`, đại từ `Chúng ta` và câu `“Thưa các vị, thời gian là then chốt.
    Chúng ta phải tranh thủ thời gian.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000067: locks: [''Giữ đại từ `Chúng
    ta`, cụm `nhờ các cường quốc khác can thiệp` và câu kết `Trong lúc đó, hãy cố
    hết sức.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000068: locks: [''Giữ tiếng hô
    chào `“Tiểu đoàn trưởng!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000069: locks: [''Giữ các danh
    xưng `chỉ huy Đại đội Hai`, `Trung úy Weiss`, `tiểu đoàn trưởng`, `Các binh sĩ`,
    việc lặp tên riêng `Tanya` ở cả hai câu sau theo DEC-P01-001 (tránh dùng `cô`),
    và đại từ phản thân `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000070: locks: [''Giữ các danh
    xưng `Tiểu đoàn Pháp sư Không quân số 203`, `Norden`, cách gọi `mọi người`, đại
    từ `Chúng ta` và cụm `đã nhận lệnh điều chuyển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000071
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000071: locks: [''Giữ đại từ nội
    tâm tự quy chiếu `mình` kết hợp lối tự nhắc tên `Tanya` ở ngôi thứ ba (`gương
    mặt Tanya`, `bắt Tanya làm việc quá sức`) theo DEC-P01-001; giữ các danh xưng
    `Trung tá von Lergen`, `Dacia` cùng các cụm `huấn luyện phối hợp`, `huấn luyện
    cơ bản để nâng cao kỹ năng cho tân binh`, `được hoãn triển khai sáu tháng` và
    `cuộc diễn tập tác chiến ở Dacia`.'']'
  non_canon: true
