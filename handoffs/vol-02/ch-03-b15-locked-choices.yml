choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000191
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000191: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình` theo `DEC-P01-001`, các đại từ `ông ấy`, `chúng ta`, và các
    thuật ngữ `lực lượng tuần tra trong vùng biển của chúng ta`, `một sĩ quan hải
    quân`, `chiến dịch đổ bộ`, `quyền kiểm soát mặt biển`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000192
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000192: locks: [''Giữ đại từ `ta`,
    danh xưng `Thiếu tá`, và các cụm `một đơn vị tiên phong duy nhất`, `rút về hội
    quân với lực lượng tiếp viện rồi thử lại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000193
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000193: locks: [''Giữ câu đáp `Rõ,
    thưa ngài.`, các đại từ thoại `tôi`, `họ`, các đại từ nội tâm `mình` / `Mình`,
    `ông ấy`, các thuật ngữ `cơ cấu chỉ huy`, `hải quân`, `hộ tống đến cửa vịnh`,
    `cơ cấu chỉ huy pháp sư`, `đề nghị hủy chiến dịch`, và cặp thuật ngữ đã khóa theo
    mục `vol02-ch03-b15-marine-regiment` cùng bản sửa đã nghiệm thu: `các pháp sư
    thủy quân lục chiến`, `các chỉ huy trung đoàn thủy quân lục chiến`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000194
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000194: locks: [''Giữ toàn văn
    câu nhận định `Đó là một bước điều chỉnh để giữ thể diện cho mọi người và tránh
    những tranh cãi phiền phức.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000195
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000195: locks: [''Giữ đại từ `Ông
    ấy` và câu `Ông ấy đồng ý ngay lập tức.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000196
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000196: locks: [''Giữ cặp đại từ
    `Ta` – `cô` và câu thoại `“…Được. Ta giao quyền đó cho cô.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000197
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000197: locks: [''Giữ tên riêng
    `Tanya`, tên đơn vị đã khóa `Tiểu đoàn Pháp sư Không quân 203` theo mục `vol02-ch03-b06-aerial-mage-battalion`,
    và các thuật ngữ `máy bay vận tải`, `bãi nhảy dù`, `vai trò tiên phong`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000198
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000198: locks: [''Giữ các thuật
    ngữ `nhảy dù lúc rạng đông`, `chiếm các khẩu pháo`, `công sự ven biển cực kỳ dễ
    bị tấn công từ phía sau`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000199
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000199: locks: [''Giữ đại từ `chúng
    ta`, tên riêng `Tanya`, và cụm `thầm tìm chút an ủi nơi lý trí`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000200
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000200: locks: [''Giữ đại từ trần
    thuật `nó` theo `DEC-P01-001`, các đại từ `họ`, `chúng`, và các thuật ngữ `Công
    sự ven biển`, `các tuyến liên lạc với tuyến sau`, `một cuộc tập kích bất ngờ`,
    `trang bị của chúng hẳn cũng khá nhẹ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000201
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000201: locks: [''Giữ các thuật
    ngữ `công sự ven biển`, `quân đội phải bảo vệ hậu phương`, `ngăn chặn các cuộc
    tấn công từ biển`, `cách đây một thế kỷ`, và đại từ `chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000202
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000202: locks: [''Giữ đại từ `Tôi`
    và câu thông báo `“Tôi đã tắt động cơ! Máy bay đang lượn!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000203
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000203: locks: [''Giữ thuật ngữ
    `buồng lái`, đại từ `họ`, và cụm `bước vào giai đoạn chuẩn bị cuối cùng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000204
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000204: locks: [''Giữ đại từ `chúng
    tôi`, tên riêng `Tanya`, và các thuật ngữ đã khóa theo mục `vol02-ch03-b15-airborne-gear`
    cùng bản sửa đã nghiệm thu: `nhảy dù bằng trang bị nhảy dù`, `phép thuật`, `hạ
    xuống mà không bị phát hiện`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000205
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000205: locks: [''Giữ câu mệnh
    lệnh `“Được rồi. Tất cả chuẩn bị nhảy dù!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000206
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000206: locks: [''Giữ đại từ trần
    thuật `Nó` / `nó` và đại từ phản thân `mình` theo `DEC-P01-001`, cùng các cụm
    `những người lính mình huấn luyện`, `tăng xác suất thành công và loại bỏ mọi trở
    ngại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000207
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000207: locks: [''Giữ đại từ trần
    thuật `nó` theo `DEC-P01-001` và các cụm `không thể để lộ vẻ lo âu ngay trước
    giờ hành động`, `ra lệnh chuẩn bị bằng giọng thản nhiên như thể đang thông báo
    kế hoạch đi dã ngoại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000208
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000208: locks: [''Giữ các cụm `các
    pháp sư mặc đầy đủ trang bị chen lấn trong khoang máy bay chật hẹp`, `ít ra họ
    cũng đang chuẩn bị`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000209
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000209: locks: [''Giữ cách xưng
    hô trong thoại `Tôi` – `Các anh chị` / `các anh chị`, đại từ `chúng ta`, `chúng`,
    đại từ trần thuật `Nó`, phản thân `mình`, `họ` theo `DEC-P01-001`, và các thuật
    ngữ `pháo và thủy lôi bảo vệ vịnh hẹp`, `vô hiệu hóa hoặc phá hỏng`, `lực lượng
    đổ bộ sẽ mắc kẹt trong vịnh hẹp`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000210
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000210: locks: [''Giữ các đại từ
    `Chúng`, `chúng ta`, và các thuật ngữ đã khóa theo bản sửa đã nghiệm thu: `Pháo
    không phải pháo đài`, `nòng pháo đang chĩa ra biển`, `các pháp sư nhảy dù xuống
    từ phía sau`, `ghìm chân hạm đội`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000211
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000211: locks: [''Giữ các đại từ
    `chúng ta`, `họ`, số liệu `Ba mươi phút`, và các thuật ngữ đã khóa theo mục `vol02-ch03-b15-marine-regiment`:
    `nhảy dù`, `các pháp sư thủy quân lục chiến sẽ đến trước hạm đội để chi viện`,
    `lực lượng tiếp viện của địch trên mặt đất`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000212
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000212: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình` theo `DEC-P01-001`, các cụm `cùng các chỉ huy của lực lượng
    đến sau đề nghị hủy chiến dịch`, `thân bại danh liệt`, và bản sửa nghĩa đã nghiệm
    thu `Mình chẳng muốn một mình rơi vào cảnh đó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000213
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000213: locks: [''Giữ đại từ `Tôi`,
    `tất cả`, số liệu `Trong ba mươi phút`, và thuật ngữ đã khóa `pháp sư không quân`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000214
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000214: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` theo `DEC-P01-001`, chuyển ý `Không, không hẳn
    là kỳ vọng—nó chỉ có thể hy vọng.`, và đúng phạm vi câu nhấn mạnh in nghiêng `*Đừng
    có làm hỏng chuyện này, chết tiệt. Làm ơn cho tôi thấy các anh chị còn dư sức
    làm tốt hơn yêu cầu.*` theo `DEC-P01-002`.'']'
  non_canon: true
