unit_count: 32
segment_id_start: YS-LN02/Text/part0010.xhtml/p000244
segment_id_end: YS-LN02/Text/part0010.xhtml/p000275
choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000244
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000244: locks: [''Giữ lời đáp xác
    nhận `Vâng.`, danh xưng đơn vị đã sửa theo signoff `Đội bay số 7` và tình thái
    dự kiến `đang trên đường tới và sẽ đến ngay thôi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000245
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000245: locks: [''Giữ đại từ `họ`
    quy chiếu Đội bay số 7, cụm `lo phần dọn dẹp` và mệnh lệnh hành quân `Chúng ta
    tiếp tục tiến quân.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000246
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000246: locks: [''Giữ cách gọi
    cấp bậc `Thiếu tá!` và câu hỏi đích đến `Chúng ta sẽ đi đâu ạ?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000247
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000247: locks: [''Giữ tên riêng
    `Weiss`, đại từ `anh ta`, cụm `tố chất quân nhân`, và đại từ tự quy chiếu nội
    tâm ngôi thứ nhất `mình` theo DEC-P01-001 (`nghiêm túc hơn mình tưởng`, `mình
    phải biết cách trọng dụng`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000248
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000248: locks: [''Giữ câu đáp ngắn
    gọn chỉ mục tiêu `Thủ đô.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000249
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000249: locks: [''Giữ câu hỏi xác
    nhận lễ phép của Weiss `Thủ đô ạ, thưa Thiếu tá?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000250
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000250: locks: [''Giữ câu đáp `“Ừ.”`,
    tên riêng `Tanya`, đại từ phản thân `mình` trong mệnh đề phụ thuộc, các thuật
    ngữ `đội hộ tống`, `thương binh và tù binh`, và đại từ `Anh` khi Tanya giao quyền
    chọn người cho Weiss.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000251
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000251: locks: [''Giữ lời thưa
    `Rõ, thưa Thiếu tá.`, phủ định toàn phần `không ai bị thương dù chỉ nhẹ`, và cặp
    xưng hô `Thiếu tá` – `tôi` trong câu xin chỉ thị.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000252
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000252: locks: [''Giữ câu sực nhớ
    tự nhiên `À, phải rồi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000253
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000253: locks: [''Giữ đại từ `anh
    ta` chỉ Weiss, đại từ nội tâm `mình` xuyên suốt theo DEC-P01-001, thuật ngữ `thương
    vong`, câu phủ định bác bỏ `Mà mình đâu có cho rằng sẽ có thương vong.` và tự
    nhận xét `hơi lười suy nghĩ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000254
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000254: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001, các thuật ngữ `khẩu súng trường`,
    `tiểu đoàn`, thành ngữ `chuyện bé xé ra to` và câu hỏi nghi vấn `chăng?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000255
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000255: locks: [''Giữ đại từ nội
    tâm `mình` theo DEC-P01-001, danh xưng khái quát `Người chỉ huy` và mệnh đề phủ
    định `không nên vô cớ làm mất khí thế của mọi người`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000256
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000256: locks: [''Giữ đại từ `Chúng
    ta`, chỉ thị điều chỉnh của Tanya `cho những người kiệt sức nhất về` và `đưa một
    số sĩ quan mới, vừa trải qua trận đầu, về căn cứ đi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000257
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000257: locks: [''Giữ đại từ `Tôi`,
    các đơn vị `một trung đội`, `Đại đội Bốn` và câu hỏi xin phép `về không ạ?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000258
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000258: locks: [''Giữ câu tán thành
    `Nghe hợp lý đấy.` và cặp đại từ `Tôi` – `anh` trong câu ủy quyền `Tôi giao việc
    đó cho anh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000259
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000259: locks: [''Giữ tên riêng
    `Weiss`, `Tanya`, đại từ `anh ta` quy chiếu Weiss, các thuật ngữ `quản lý đơn
    vị`, `đóng quân`, `Chỉ huy đại đội thời bình`, `chỉ huy đại đội thời chiến`, và
    sự chuyển sang đại từ nội tâm `Mình` ở câu cuối theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000260
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000260: locks: [''Giữ cụm `những
    kẻ cuồng chiến do mình đích thân tuyển chọn`, đại từ nội tâm `mình` theo DEC-P01-001,
    tên riêng `Weiss` cùng đại từ `anh ta`, và cụm `cánh tay phải`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000261
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000261: locks: [''Giữ đại từ `chúng
    ta`, động từ `tiến xa hơn` và cách gọi cấp bậc `Trung úy!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000262
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000262: locks: [''Giữ lời đáp quân
    sự chuẩn mực `Rõ, thưa Thiếu tá.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000263
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000263: locks: [''Giữ nhịp hô thúc
    giục `Tiến xa hơn! Xa hơn nữa!`, đại từ `chúng ta` và câu khích lệ cuối đoạn `Phải
    thử mới biết chứ!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000264
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000264: locks: [''Giữ đúng cả hai
    vùng nhấn mạnh `*...*` theo DEC-P01-002 đã sửa V1 và signoff (`*Nhưng trước mắt,
    chúng ta cứ tận hưởng màn chơi thưởng thêm này đã.*` và `*Tiến lên nào! Cứ tiến
    lên mãi!*`), thuật ngữ tạm `màn chơi thưởng thêm`, tên riêng `Tanya`, `Đại tá
    von Lergen`, cùng đại từ trần thuật `Nó` theo DEC-P01-001.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000265
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000265: locks: [''Giữ cụm `mục
    đích tồn tại duy nhất`, danh xưng đơn vị đã khóa tạm `Tiểu đoàn Pháp sư Không
    quân 203`, cấp bậc `Trung úy Weiss` và chi tiết phủ định `mà không hề hay biết`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000266
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000266: locks: [''Giữ cụm `Người
    lính nào cũng tiếp nhận mệnh lệnh không chút thắc mắc` và đại từ `họ` ở cuối câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000267
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000267: locks: [''Giữ các danh
    xưng và thuật ngữ đã signoff `lực lượng dự bị chiến lược`, `Cụm tập đoàn quân
    phía Đông`, `Tập đoàn quân số 17`, `đội bay`, `phòng tuyến Quân đội Dacia`, `Tiểu
    đoàn Pháp sư Không quân 203`, `khu vực giao chiến`, `Chỉ huy Tiểu đoàn von Degurechaff`,
    các con số `Hai nghìn người chết`, `sáu trăm nghìn` đối đầu với `bảy mươi nghìn`,
    và đúng phạm vi nhấn mạnh theo DEC-P01-002 trong câu hỏi tu từ `“Ai mà *chẳng*
    nghiền nát được chúng?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000268
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000268: locks: [''Giữ danh xưng
    `thủ đô Công quốc Dacia` và hình ảnh so sánh `bình yên như mọi buổi tối kể từ
    thuở khai thiên lập địa`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000269
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000269: locks: [''Giữ tương phản
    giữa cảnh người dân Dacia say sưa bàn tán khi chiến tranh mới nổ ra (`với lòng
    nhiệt thành lớn lao mà vô nghĩa`) và trạng thái tĩnh lặng lúc đêm muộn (`khắp
    nơi đã lắng xuống và phần lớn mọi người đều đi ngủ`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000270
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000270: locks: [''Giữ các chi tiết
    điều kiện thời tiết tác chiến (`Mây che phủ ít; tầm nhìn tốt. Gió đông nam thổi
    nhẹ`) và cấu trúc phủ định kép giữ nguyên nghĩa nguồn `nhưng không yếu đến mức
    khói súng không tan đi được`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000271
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000271: locks: [''Giữ hình ảnh
    ẩn dụ `Vết lem nhỏ duy nhất ẩn trong đêm` và danh xưng đơn vị `Tiểu đoàn Pháp
    sư Không quân 203`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000272
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000272: locks: [''Giữ thuật ngữ
    `cuộc tập kích ban đêm đầu tiên nhằm vào một thành phố trên thế giới này` và nhận
    định phủ định giảm nhẹ `nhiệm vụ thực ra không khó lắm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000273
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000273: locks: [''Giữ chức danh
    và cấp bậc đầy đủ `chỉ huy tiểu đoàn, Thiếu tá Tanya von Degurechaff` cùng vị
    trí `đang dẫn đầu đội hình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000274
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000274: locks: [''Giữ cấu trúc
    giả định `Nếu có bức ảnh ghi lại khoảnh khắc… bức ảnh ấy hẳn sẽ chứng minh…`,
    biệt hiệu đã khóa tạm `“Bạch Ngân”`, tên riêng `Tanya` kết hợp đại từ trần thuật
    `Nó` / `nó` đã sửa theo V2 và DEC-P01-001 (tách biệt với `bức ảnh ấy`), cùng sự
    tương phản giữa bầu trời đêm yên bình và ý nghĩ về `cuộc tập kích dữ dội sắp tới.
    Đốt trụi mục tiêu của chúng sẽ vui lắm đây.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0010.xhtml/p000275
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0010.xhtml/p000275: locks: [''Giữ các thuật
    ngữ tác chiến `Tập kích ban đêm vào thủ đô địch`, `chế độ tắt đèn`, `bay duyệt
    binh`, chuỗi phủ định `không hề áp dụng chế độ tắt đèn`, `không có máy bay hay
    pháp sư nào đánh chặn—thậm chí chẳng có hỏa lực phòng không`, `không nhìn thấy
    nổi một khẩu đội pháo nào`, cùng tên riêng `Tanya` và đại từ trần thuật `nó` theo
    DEC-P01-001.'']'
  non_canon: true
