task_id: vol-02-ch-02-b18
baseline_sha256: 700c3af068c84688a8e929b9b649aa7d3c5e12e1f78d8d9f2f3e1795e558ed5a
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: 8e0a34a652b8ae9a51f7def41334b9f410d8722eeeb858729799e2bdc415576f
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 33
segment_id_start: YS-LN02/Text/part0014.xhtml/p000480
segment_id_end: YS-LN02/Text/part0014.xhtml/p000512
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000480
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000480: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001`, định danh `Đại đội Bốn`, đại từ `họ` / `Họ`, và
    các mệnh đề `trực tiếp yểm trợ`, `giữ khoảng cách với họ sẽ an toàn hơn`, `quá
    hiếu chiến để làm lá chắn cho mình; biết đâu còn khiến địch bị thu hút về phía
    họ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000481
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000481: locks: [''Giữ đại từ tự
    nhủ `mình`, thuật ngữ `oanh tạc cơ`, và toàn văn câu thoại `“Chậc, vậy là mình
    phải đối đầu với đám oanh tạc cơ chậm chạp à? Xem ra chẳng thể nào khiêu vũ được
    rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000482
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000482: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001`, các cụm `Trận đánh chặn đơn độc của riêng mình`,
    `oanh tạc cơ`, `biến thành một khẩu đội cố định rồi bắn hạ chúng khỏi bầu trời`,
    và câu kết `Nếu bắn trượt thì mình chỉ tổ thành trò cười, nên dù nhiệm vụ này
    an toàn, mình cũng không thể lơ là.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000483
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000483: locks: [''Giữ đại từ tự
    nhủ `Mình` và câu thoại `“Mình chẳng có tâm trạng lắm, nhưng đây là công việc.
    Cứ từng bước một mà hoàn thành thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000484
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000484: locks: [''Giữ đại từ nội
    tâm `mình` / `Mình`, chủ ngữ phiếm chỉ `người ta`, thuật ngữ `oanh tạc cơ`, đại
    từ `chúng`, và câu kết `Mình phải ngắm thật chính xác mới hạ được chúng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000485
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000485: locks: [''Giữ đại từ nội
    tâm `mình`, các thuật ngữ `cảm nhận ma pháp để dẫn đường`, `thiết bị dò nhiệt
    hoặc radar`, `pháp sư`, `cài thuật thức dò nhiệt`, và `một cuộc tấn công bắn tỉa`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000486
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000486: locks: [''Giữ đại từ nội
    tâm `mình`, đại từ `chúng`, và toàn văn `Nói thật, chẳng trách chuyện đó khiến
    mình bực bội. Ít ra nếu hạ được chúng thì điểm số của mình sẽ tăng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000487
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000487: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff` và câu gọi vô tuyến `“Thiếu tá von Degurechaff, nghe
    rõ không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000488
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000488: locks: [''Giữ hô hiệu `Pixie
    01`, đại từ ngôi thứ hai `anh`, đại từ `chúng ta`, thuật ngữ `hiệu gọi`, và câu
    thoại `“Đây là Pixie 01, nghe rõ. Từ khi nào anh quên mất chúng ta dùng hiệu gọi
    vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000489
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000489: locks: [''Giữ đại từ nội
    tâm `mình` và toàn văn `Vì thế mình mới đáp lại tin nhắn bất ngờ gửi đến bằng
    giọng cáu kỉnh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000490
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000490: locks: [''Giữ đại từ nội
    tâm `mình`, các cụm `thành viên trưởng thành của xã hội`, `một sự vi phạm quy
    định trắng trợn`, `nội quy, quy định`, và `Trên đời có quá nhiều kẻ cẩu thả.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000491
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000491: locks: [''Giữ nguyên câu
    thoại lắp bắp `“T-tôi xin lỗi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000492
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000492: locks: [''Giữ đại từ `Anh`,
    cụm `kỷ luật và điều lệnh quân đội`, và câu hỏi `“Anh nghĩ kỷ luật và điều lệnh
    quân đội được đặt ra để làm gì?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000493
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000493: locks: [''Giữ đại từ `Anh`,
    thuật ngữ `Định luật Heinrich` (theo `vol02-ch02-b18-heinrichs-law`), cụm giải
    thích `quy tắc kinh nghiệm mà một nhân viên bảo hiểm đúc kết sau khi thống kê`,
    và câu kết `Những sai sót nhỏ tích tụ lại là bước đầu dẫn đến tai nạn nghiêm trọng.
    Phải loại bỏ mọi sai sót.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000494
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000494: locks: [''Giữ hô hiệu `Hotel
    03` và câu thoại vô tuyến `“Xin dừng ở đó. Đây là Hotel 03, nhắc lại Hotel 03.
    Nghe rõ không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000495
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000495: locks: [''Giữ đại từ nội
    tâm `mình`, các cụm `nhân vật quan trọng lên sóng`, `nuốt tự ái`, và câu thành
    ngữ kết `đừng cắn vào bàn tay đang nuôi mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000496
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000496: locks: [''Giữ hô hiệu `Pixie
    01`, ngôi tự xưng `Tôi`, và câu đáp lịch sự `“Đây là Pixie 01. Nghe rõ mồn một.
    Tôi có thể giúp gì?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000497
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000497: locks: [''Giữ bản sửa theo
    signoff `L1` với định danh `Tiểu đoàn Viper`, thuật ngữ `đơn vị hậu vệ` (theo
    `vol02-ch02-b18-rear-guard`), đại từ `Ta`, `họ`, và câu thoại `“Việc tái tổ chức
    Tiểu đoàn Viper cùng các đơn vị đã rút lui hoàn tất. Ta điều họ làm đơn vị hậu
    vệ nhé?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000498
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000498: locks: [''Giữ bản sửa theo
    signoff `M2` và `M3` với cách lặp tên `Tanya` ở trần thuật ngôi thứ ba (tránh
    `cô` theo `DEC-P01-001`), cụm `lời trình bày chỉn chu ấy` (theo `vol02-ch02-b18-well-made-address`),
    định danh `Tiểu đoàn Viper`, `quân tiếp viện` (theo `vol02-ch02-b18-reinforcements`),
    và `Cụm tập đoàn quân phương Bắc` (theo `vol02-ch02-b15-northern-army-group`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000499
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000499: locks: [''Giữ nguyên câu
    thoại `“Ồ, tái tổ chức nhanh thật đấy! Được, cứ làm vậy đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000500
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000500: locks: [''Giữ bản sửa theo
    signoff `M3` lặp tên `Tanya` ở trần thuật ngôi thứ ba và toàn văn `Có gì hữu ích
    thì đều đáng hoan nghênh. Gánh nặng đến mức chẳng làm nổi lá chắn thì thật phiền,
    nhưng Tanya luôn sẵn lòng nhận thêm những quân tốt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000501
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000501: locks: [''Giữ bản sửa theo
    signoff `M3` với câu trần thuật trung tính `Lần này Tanya may mắn hơn dự tính.`
    và câu nhận định `Không nên trông cậy vào vận may, nhưng cũng không nên quá thiển
    cận đến mức bỏ lỡ cơ hội tốt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000502
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000502: locks: [''Giữ ngôi tự xưng
    `Tôi`, đại từ `họ`, và câu thoại `“Sao cơ? À, rõ rồi. Tôi sẽ cho họ xuất phát.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000503
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000503: locks: [''Giữ đại từ `chúng
    tôi`, hiệu lệnh kết thúc liên lạc `Hết.` (theo `b05-radio-over`), và toàn văn
    `“Cảm ơn. Giờ hãy xem chúng tôi hành động. Hết.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000504
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000504: locks: [''Giữ bản sửa theo
    signoff `L8` với sự phân biệt giữa đại từ nội tâm `mình` ở câu đầu và tên riêng
    `Tanya` ở câu trần thuật cuối theo `DEC-P01-001`, cùng các cụm `một đám mê chiến
    tranh`, `có thêm đồng đội`, và `quân tiếp viện` (theo `vol02-ch02-b18-reinforcements`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000505
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000505: locks: [''Giữ bản sửa theo
    signoff `M3` và `L10` với đại từ `họ`, tên riêng `Tanya`, và toàn văn `Sự thật
    là họ bị áp đảo về quân số, nên Tanya nóng lòng chờ tiểu đoàn đã tái tổ chức đến.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000506
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000506: locks: [''Giữ bản sửa theo
    signoff `L7` với cách gọi tập thể đơn vị `mọi người` (theo `vol02-ch02-b18-address-to-unit`)
    trong câu `“Tiểu đoàn, chỉ huy của mọi người đây.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000507
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000507: locks: [''Giữ đại từ `họ`
    / `Họ`, đại từ nội tâm `Mình` / `mình`, phương châm `“an toàn là trên hết”`, và
    cụm `lập được vài chiến công trong trận này.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000508
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000508: locks: [''Giữ bản sửa theo
    signoff `L8` với đại từ `Chúng ta` / `chúng ta`, thuật ngữ thống nhất `quân tiếp
    viện` (theo `vol02-ch02-b18-reinforcements`), và toàn văn `“Vui lên nào. Chúng
    ta có quân tiếp viện. Một số quân tiếp viện sẽ lặn lội đến tận đây giúp chúng
    ta.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000509
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000509: locks: [''Giữ bản sửa theo
    signoff `M1` và `L9` với đại từ nội tâm `Mình` / `mình`, đúng phạm vi nhấn mạnh
    in nghiêng `*Tuyệt vời.*` theo `DEC-P01-002`, thuật ngữ `báo vụ viên` (theo `vol02-ch02-b18-radio-operator`),
    và cụm `cấp trên của anh ta rất sắc bén.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000510
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000510: locks: [''Giữ thuật ngữ
    `Quân tiếp viện` (theo `vol02-ch02-b18-reinforcements`) và toàn văn `Quân tiếp
    viện chắc sắp đến nơi rồi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000511
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000511: locks: [''Giữ bản sửa theo
    signoff `L7` với cặp đại từ `Mọi người` – `tôi` (theo `vol02-ch02-b18-address-to-unit`)
    trong câu hỏi `“Mọi người hiểu tôi nói gì chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000512
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000512: locks: [''Giữ đúng hai
    phạm vi nhấn mạnh in nghiêng `*Sao mình không cứ thong thả chờ quân tiếp viện
    đến?*` và `*Dragon Quest*` theo `DEC-P01-002`, đại từ nội tâm `mình` / `Mình`
    ở hai câu đầu cùng tên riêng `Tanya` ở câu trần thuật cuối theo `DEC-P01-001`,
    thuật ngữ `quân tiếp viện` (theo `vol02-ch02-b18-reinforcements`), và cụm `chuyển
    từ đội hình chiến thuật tấn công sang phòng thủ`.'']'
  non_canon: true
