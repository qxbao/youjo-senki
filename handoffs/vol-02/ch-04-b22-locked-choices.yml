- segment_id: YS-LN02/Text/part0024.xhtml/p000314
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000314: names_and_ranks: [''court-martial
    -> phiên tòa quân sự'', ''Central -> Trung ương'', ''neutral country’s boat ->
    tàu của một nước trung lập'', ''Commonwealth submarine -> tàu ngầm của Khối Thịnh
    vượng chung'', ''suspicious vessel -> tàu khả nghi'']: pronouns_and_address: [''Đại
    từ "cô" quy chiếu Tanya dưới góc nhìn ngôi thứ ba của Lergen; "nó" quy chiếu chiếc
    tàu ngầm của Khối Thịnh vượng chung'']: pov_and_logic: [''Giữ bản sửa L2 dùng
    "Trung ương" (`vol02-ch04-b22-central`), lý do mở phiên tòa quân sự (đánh chìm
    tàu ngầm của Khối Thịnh vượng chung như một tàu khả nghi trong một tai nạn đáng
    tiếc khi không biết đó là tàu của nước trung lập) và sự khẳng định lặp lại ở cả
    đầu lẫn cuối đoạn rằng phiên tòa này chỉ mang tính hình thức'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000315
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000315: names_and_ranks: []: pronouns_and_address:
    [''Lergen tự xưng "tôi" / "Tôi" và gọi Tanya là "cô"'']: pov_and_logic: [''Giữ
    cấu trúc phủ định kép ("không thể nói việc này sẽ không phiền phức"), lời trấn
    an rằng phần lớn chỉ là hình thức, và kỳ vọng cô sẽ thể hiện tốt nhất'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000316
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000316: names_and_ranks: []: pronouns_and_address:
    [''Tanya tự xưng "tôi"'']: pov_and_logic: [''Giữ câu hỏi của Tanya xem liệu đây
    có phải là cơ hội để khôi phục danh tiếng hay không'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000317
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000317: names_and_ranks: [''little
    major -> cô thiếu tá nhỏ bé'', ''unofficial transfer orders -> lệnh điều chuyển
    không chính thức'', ''trial -> phiên tòa'']: pronouns_and_address: [''Đại từ "anh"
    quy chiếu Lergen; "cô" quy chiếu Tanya'']: pov_and_logic: [{''Giữ nhận định từ
    điểm nhìn của Lergen'': ''cô thiếu tá nhỏ bé trước mặt anh không buồn tìm hiểu
    những điều đó, coi lệnh điều chuyển không chính thức anh đưa là tin xấu và có
    lẽ cũng hơi lo về phiên tòa''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000318
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000318: names_and_ranks: [''mere
    major -> một thiếu tá'']: pronouns_and_address: [''Đại từ "Cô" / "cô" quy chiếu
    Tanya; "Anh" / "anh" quy chiếu Lergen'']: pov_and_logic: [''Giữ bản sửa L3 ("Chỉ
    là một thiếu tá mà phải chịu trách nhiệm về mọi thứ" — không thêm từ miệt thị),
    sự tương phản giữa ý thức trách nhiệm méo mó với nỗi sợ bị quy trách nhiệm làm
    cô run lên, và cảm giác rợn ngợp của Lergen như có luồng khí đáng sợ hơn hơi lạnh
    thổi qua phòng hoặc như bị ném vào khe nứt ngăn cách bình thường và bất thường'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000319
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000319: names_and_ranks: [''enemy
    unit -> đơn vị địch'']: pronouns_and_address: [''Lergen gọi Tanya là "Cô" / "cô"'']:
    pov_and_logic: [{''Giữ lời khẳng định của Lergen'': ''cô đã tìm ra đơn vị địch,
    đó không phải lỗi của cô và không ai đòi hỏi cô làm gì hơn thế''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000320
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000320: names_and_ranks: [''sworn
    enemy -> Kẻ thù không đội trời chung'']: pronouns_and_address: [''Tanya tự xưng
    "tôi"; "chúng" quy chiếu quân địch'']: pov_and_logic: [''Giữ lời tự trách của
    Tanya vì đã để kẻ thù không đội trời chung ngay trước mắt chạy thoát và lời thề
    lặp lại ("Lần sau, lần sau") nhất định sẽ tóm được chúng'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000321
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000321: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "anh" quy chiếu Lergen'']: pov_and_logic: [{''Giữ sự đối lập'': ''lời
    bênh vực/can thiệp của anh không mang lại tác dụng gì đối với Tanya, nhưng những
    lời đó của anh không phải chỉ nói cho có''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000322
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000322: names_and_ranks: [''enemy
    marine mages -> các pháp sư hải quân của địch'']: pronouns_and_address: [''Đại
    từ "cô" quy chiếu Tanya; "Họ" quy chiếu đơn vị của Tanya'']: pov_and_logic: [{''Giữ
    đánh giá khách quan của Lergen'': ''riêng việc đơn vị cô tìm ra địch trong điều
    kiện thời tiết khủng khiếp đã rất đáng nể, lại còn gây thiệt hại cho các pháp
    sư hải quân của địch (`vol02-ch04-b22-marine-mages`)''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000323
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000323: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "chúng" quy chiếu kết quả đạt được'']: pov_and_logic: [{''Giữ nhận định'':
    ''dù kết quả chưa hoàn hảo, có lẽ chỉ có duy nhất một người không công nhận chúng
    là chấp nhận được''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000324
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000324: names_and_ranks: [''Major
    -> Thiếu tá'']: pronouns_and_address: []: pov_and_logic: [''Giữ câu gọi dò hỏi
    ngắn gọn của Lergen'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000325
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000325: names_and_ranks: []: pronouns_and_address:
    [''Tanya tự xưng "Tôi" và gọi Lergen là "ngài"'']: pov_and_logic: [''Giữ lời cam
    đoan và lời thề của Tanya rằng sẽ không lặp lại sai lầm này nữa'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000326
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000326: names_and_ranks: []: pronouns_and_address:
    [''Cụm "người đó" và đại từ "cô" / "Cô" quy chiếu Tanya'']: pov_and_logic: [{''Giữ
    nhận định tiếp nối p000323'': ''người đó không chấp nhận bất cứ điều gì chưa hoàn
    hảo; tâm trí cô là sự kết hợp đáng sợ giữa khát máu và lòng yêu nước được nhào
    nặn thành tâm lý người lính, giống một con búp bê mang hình dáng người lính hơn
    là một người lính thực thụ''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000327
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000327: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "cô" quy chiếu Tanya'']: pov_and_logic: [''Giữ chi tiết những lời cô
    lặp đi lặp lại gần như mê sảng toát lên vẻ khẩn thiết kỳ lạ'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000328
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000328: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "cô" / "Cô" quy chiếu Tanya'']: pov_and_logic: [''Giữ phép nhấn mạnh
    lặp từ ("Chỉ một lần—duy nhất một lần—") về việc cô chỉ mới một lần đạt kết quả
    ở mức vừa đủ/đạt yêu cầu mà đã thành ra thế này, cùng câu hỏi nội tâm in nghiêng
    ở cuối đoạn theo bản sửa M1'']: emphasis: *Cô cầu toàn đến mức nào nữa đây?*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000329
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000329: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "Cô" quy chiếu Tanya; "nó" quy chiếu "một đứa trẻ" trong câu hỏi khái
    quát'']: pov_and_logic: [''Giữ nhận xét rằng cô chẳng quan tâm gì ngoài việc tuân
    lệnh đến từng chữ và câu hỏi nội tâm in nghiêng ở cuối đoạn theo bản sửa M1'']:
    emphasis: *Phải dạy một đứa trẻ thế nào mới khiến nó méo mó đến vậy?*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000330
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000330: names_and_ranks: [''Major
    -> Thiếu tá'']: pronouns_and_address: [''Lergen dùng "Chúng tôi" (đại diện cấp
    trên/Bộ Tổng tham mưu), gọi Tanya là "Thiếu tá" và "cô" / "Cô" kết hợp từ phản
    thân "mình"'']: pov_and_logic: [{''Giữ lời trấn an của Lergen'': ''khuyên Thiếu
    tá đừng bận tâm, khẳng định cấp trên hài lòng với những gì cô đã làm được và cô
    chỉ cần hoàn thành nhiệm vụ của mình''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000331
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000331: names_and_ranks: []: pronouns_and_address:
    [''Tanya tự xưng "Tôi"'']: pov_and_logic: [{''Giữ lời đáp lệch mạch của Tanya'':
    ''cam đoan sẽ không để sót một con tàu nào''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000332
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000332: names_and_ranks: []: pronouns_and_address:
    [''Trong độc thoại nội tâm in nghiêng của Lergen, dùng "Tôi" cho Lergen, "cô ấy"
    cho Tanya, và "hai người" cho cả hai (theo bản sửa L6, không dùng "mình" của Tanya
    cho nội tâm Lergen)'']: pov_and_logic: [{''Giữ bản sửa M1 in nghiêng toàn đoạn
    độc thoại nội tâm của Lergen'': ''cảm giác nói gì cô ấy cũng không hiểu, hai người
    nói chuyện chẳng ăn nhập với nhau, và nỗi kinh ngạc khi lời khích lệ hoàn thành
    nhiệm vụ lại khiến "quả cầu điên loạn" này bùng lên ý chí chiến đấu và tuyên bố
    tiêu diệt sạch đối phương''}]: emphasis: *Tôi nói gì cô ấy cũng chẳng hiểu. Trông
    thì như đang trò chuyện, nhưng bằng cách nào đó hai người cứ nói mà chẳng ăn nhập
    với nhau. Tôi chỉ bảo cô ấy hoàn thành nhiệm vụ thôi; sao quả cầu điên loạn này
    lại bùng lên ý chí chiến đấu và tuyên bố sẽ tiêu diệt sạch đối phương cơ chứ?
    Cuồng chiến đến mức nào nữa đây?*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000333
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000333: names_and_ranks: [''Empire
    -> Đế quốc'']: pronouns_and_address: [''Đại từ "cô ấy" quy chiếu Tanya trong độc
    thoại nội tâm của Lergen'']: pov_and_logic: [{''Giữ bản sửa M1 in nghiêng toàn
    đoạn độc thoại nội tâm của Lergen'': ''sự đối lập giữa người xuất sắc nhất Đế
    quốc từng tạo ra với kẻ cuồng chiến tồi tệ nhất từng thấy, cùng hai câu hỏi tu
    từ chất vấn việc một con người có thể vui sướng khi giết đồng loại và trung thành
    thực hiện mọi nhiệm vụ quân sự không chút do dự''}]: emphasis: *Dù là người xuất
    sắc nhất Đế quốc từng tạo ra, cô ấy cũng là kẻ cuồng chiến tồi tệ nhất từng thấy.
    Một con người bình thường có thể vui sướng đến thế khi giết đồng loại sao? Một
    con người bình thường có thể không chút do dự mà trung thành thực hiện bất cứ
    nhiệm vụ quân sự nào sao?*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000334
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000334: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "cô" quy chiếu Tanya'']: pov_and_logic: [{''Giữ quan hệ điều kiện phủ
    định'': ''nếu nền tảng con người không lệch lạc thì không thể có mức độ bất tương
    xứng này''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000335
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000335: names_and_ranks: [''General
    Staff Office -> Bộ Tổng tham mưu'', ''Major -> Thiếu tá'']: pronouns_and_address:
    [''Lergen gọi Tanya là "cô" và "Thiếu tá"'']: pov_and_logic: [''Giữ bản sửa L9
    ("Không ai ở Bộ Tổng tham mưu phàn nàn về hành động của cô, Thiếu tá") truyền
    đạt đúng nghĩa không ai phản đối hay bắt lỗi'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000336
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000336: names_and_ranks: [''unit
    commanders -> các chỉ huy đơn vị'', ''enemy units -> đơn vị địch'']: pronouns_and_address:
    [''Đại từ "anh" quy chiếu Lergen; "cô" quy chiếu Tanya; "họ" quy chiếu các chỉ
    huy đơn vị; "Chúng" quy chiếu những thông báo thông thường'']: pov_and_logic:
    [''Giữ sự đối lập giữa thông lệ (thông báo gửi chỉ huy đơn vị thường nêu kỳ vọng
    tiêu diệt địch như lời chúc theo lệ) với nhiệm vụ truyền đạt lần này của Lergen
    (không phải lời an ủi hời hợt mà là sự tha thứ rõ ràng)'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000337
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000337: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "anh" quy chiếu Lergen'']: pov_and_logic: [''Giữ bản sửa M1 bảo toàn
    chính xác hai vùng in nghiêng tách biệt ("*Nhưng, nhưng…*" và "*Con quái vật trước
    mặt anh có khi thật sự sẽ làm thế.*") kẹp giữa câu trần thuật không in nghiêng
    về việc lý trí đang cảnh báo anh ở một góc tâm trí'']: emphasis: *Nhưng, nhưng…*
    ... *Con quái vật trước mặt anh có khi thật sự sẽ làm thế.*'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000338
  kind: voice_marker
