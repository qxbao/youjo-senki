  - YS-LN02/Text/part0032.xhtml/p000002
  rationale: Giữ nguyên tên riêng, cấp bậc thiếu tá và phân biệt chức danh pháp sư
    ở p000001 với vai trò chỉ huy tác chiến ngoài mặt trận ở p000002 mà không suy
    diễn bảng hệ thống quân hàm.
