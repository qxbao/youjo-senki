- segment_id: YS-LN02/Text/part0032.xhtml/p000001
  kind: tactical_logic_negation_modality
  value: 'Giữ nguyên các quan hệ phủ định, điều kiện và trình tự: không muốn chết
    (p000001); một mục tiêu duy nhất (p000010); chỉ pháp sư khó gây sát thương ở độ
    cao tám nghìn feet trong khi máy bay tiêm kích khá dễ chịu (p000015); đạn nổ mạnh
    và màn đạn phòng không dày đặc (p000016); tấn công bão hòa làm suy yếu rồi xuyên
    thủng màn chắn (p000020); chấn động nội tạng do đạn 120 mm -> mất khả năng chiến
    đấu -> may mắn chỉ bất tỉnh vẫn rơi xuống -> có lẽ phần lớn bị xé nát ngay nơi
    họ nằm (p000023); chẳng muốn thử nghiệm và người phải mặc áo chống đạn chẳng đời
    nào làm vậy (p000024–p000025).'
  non_canon: true
