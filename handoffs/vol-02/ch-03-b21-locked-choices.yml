task_id: vol-02-ch-03-b21
baseline_sha256: 2a5baa5b3d5f6d5385da3b1557cd9ac695f647b3fffbe97067e59aa3388ccc86
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: b39e4e522b3780baae485e44cb1e2b4f9f535067afa1be3d54e19638927791eb
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 31
segment_id_start: YS-LN02/Text/part0018.xhtml/p000380
segment_id_end: YS-LN02/Text/part0018.xhtml/p000410
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000380
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000380: locks: [''Giữ các danh
    xưng `Đế quốc`, `Liên minh Entente`, `Dacia`, cụm đã sửa theo N1 và được nghiệm
    thu (`buộc phải giữ chân một lực lượng quân đội trên lãnh thổ Liên minh Entente`),
    và mệnh đề đối chiếu `khác với Dacia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000381
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000381: locks: [''Giữ cách xưng
    hô của cấp dưới với Tướng Habergram (`Thưa ngài`, `chúng ta`), câu hỏi `chúng
    ta nên làm gì?`, và mệnh đề điều kiện khẩn trương `Nếu định chấp nhận thì phải
    nhanh lên.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000382
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000382: locks: [''Giữ địa danh
    `Dacia`, các thuật ngữ `chính phủ lưu vong` theo mục `vol02-ch03-b21-government-in-exile`,
    `Một sĩ quan bên Tác chiến`, các ẩn dụ đánh bài `tung ra một quân bài`, `bỏ qua
    lượt này`, phủ định `đã không thành`, `có lẽ không khôn ngoan`, đại từ `họ` /
    `Họ`, và câu hỏi phản vấn `“Chẳng phải chúng ta nên hành động sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000383
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000383: locks: [''Giữ thuật ngữ
    `các tàu tuần dương thương mại vũ trang` theo mục `vol02-ch03-b20-armed-merchant-cruiser`,
    các đại từ `Tôi`, `chúng ta`, và lời phản đối `“Tôi phản đối. Tôi không nghĩ việc
    khiến người ta chú ý đến các tàu tuần dương thương mại vũ trang của chúng ta sẽ
    đem lại điều gì tốt đẹp.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000384
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000384: locks: [''Giữ sự phân biệt
    giữa `các tàu tuần dương thương mại vũ trang`, `tàu có vũ trang` và `tàu buôn`,
    các thuật ngữ `luật quốc tế`, `luật pháp của nhiều nước`, `mệnh lệnh thu thập
    tình báo và phá hoại hoạt động thương mại`, `vấn đề pháp lý`, `toàn bộ thủy thủ
    đoàn có thể bị tuyên bố là cướp biển và bắt giữ`, cùng các đại từ `họ`, `chúng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000385
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000385: locks: [''Giữ cụm đã sửa
    theo N4 và được nghiệm thu (`tổ chức xấu xa nào cũng cần biết tính toán thiệt
    hơn mà ngần ngại`), thuật ngữ `luật quốc tế`, phủ định nhượng bộ `Ngay cả khi
    việc vi phạm luật quốc tế không khiến lương tâm họ day dứt`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000386
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000386: locks: [''Giữ cấu trúc
    vô nhân xưng cô đọng và thế đối lập `Không nên phá vỡ hiệp ước; phải ép đối phương
    phá vỡ chúng.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000387
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000387: locks: [''Giữ câu đã sửa
    theo V1 và được nghiệm thu (`Ít nhất thì Tướng Habergram định chỉ đi đến sát ranh
    giới của những gì có thể lách được trong khuôn khổ luật quốc tế.`), cùng danh
    xưng `Tướng Habergram` và thuật ngữ `luật quốc tế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000388
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000388: locks: [''Giữ cụm đã sửa
    theo N5 và được nghiệm thu (`tránh bị lên tàu kiểm tra`), đại từ `tôi`, và câu
    hỏi `Việc bốc hàng đến đâu rồi?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000389
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000389: locks: [''Giữ các danh
    xưng và thuật ngữ `người đứng đầu`, `Tình báo`, `Dacia`, cụm `chủ động tìm cách
    gột bỏ tiếng xấu sau Dacia và đã phát hiện được vài điều thú vị`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000390
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000390: locks: [''Giữ dấu chấm
    lửng cuối câu `…`, đại từ `Tôi`, và câu đáp `“Tôi nghĩ sắp xong rồi…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000391
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000391: locks: [''Giữ dấu chấm
    lửng mở đầu `…`, cụm đã sửa theo N6 và được nghiệm thu (`thêm một ít hàng hóa
    cũng chẳng khác biệt là bao`), thuật ngữ `Nhân vật quan trọng`, và câu hỏi `Nhân
    vật quan trọng đó là ai?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000392
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000392: locks: [''Giữ câu đã sửa
    theo V2 và N8 và được nghiệm thu (`Dù sao thì các nhân viên Tình báo đã tính toán
    trước khi có kết quả: họ cho rằng chính vì Dacia sụp đổ dễ dàng đến vậy nên Cộng
    hòa và Liên minh Entente mới có thêm thời gian xây dựng các tuyến thứ ba.`), các
    danh xưng và thuật ngữ `các nhân viên Tình báo`, `Dacia`, `Cộng hòa`, `Liên minh
    Entente`, `các tuyến thứ ba` theo mục `vol02-ch03-b21-third-lines`, `Công tác
    thu thập và phân tích tình báo`, `các tuyến phía bắc`, và đại từ `họ` / `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000393
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000393: locks: [''Giữ các danh
    xưng và thuật ngữ `Tin tình báo`, `tàu phụ trợ`, `thiết bị họ sử dụng`, `Hải quân
    Đế quốc`, `kế hoạch đổ bộ`, và đại từ `họ` / `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000394
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000394: locks: [''Giữ các cụm `việc
    con tàu ấy bị kiểm tra sẽ rất tai hại`, `họ đã có quá nhiều hàng hóa nguy hiểm
    rồi, thêm thứ gì đó cũng chẳng thay đổi được gì`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000395
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000395: locks: [''Giữ đại từ đã
    sửa theo V3 và được nghiệm thu (`Ông` theo mục `vol02-ch03-b21-habergram-referent`),
    phủ định `Ông không nghĩ rằng chất thêm một ít hàng hóa rắc rối sẽ khiến tình
    thế của họ thay đổi đáng kể.`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000396
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000396: locks: [''Giữ thuật ngữ
    `Một nghị viên nhà nước` đồng bộ với mục `vol02-ch03-b20-councilor-state`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000397
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000397: locks: [''Giữ các danh
    xưng và thuật ngữ `Một trong mười nghị viên nhà nước`, `chính phủ lưu vong`, `Khối
    Thịnh vượng chung`, `những hệ lụy chính trị không nhỏ`, `cơ quan Tình báo` (đã
    đồng bộ theo N9), `sĩ quan tham mưu xuất sắc`, cấu trúc điều kiện phủ định `Các
    sĩ quan không thể làm việc trong cơ quan Tình báo nếu không nhạy bén nắm bắt chính
    trị`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000398
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000398: locks: [''Giữ các cụm `một
    chính trị gia ở cấp bộ trưởng`, `chính phủ tiền nhiệm có đủ thẩm quyền bổ nhiệm
    vào chính phủ lưu vong`, và phủ định `không phải chuyện nhỏ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000399
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000399: locks: [''Giữ danh xưng
    `Tướng Habergram`, đại từ `ông`, phủ định kép khẳng định năng lực `chẳng hề bất
    tài`, và quan hệ nhân quả `—chính vì thế ông mới do dự.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000400
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000400: locks: [''Giữ dấu chấm
    lửng mở đầu `…` và câu lệnh ngắn gọn của Tướng Habergram `“…Chờ một chút.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000401
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000401: locks: [''Giữ các danh
    xưng và thuật ngữ `xin được quy chế tị nạn`, `Đế quốc`, `các cơ quan chính phủ`,
    `Liên minh Entente`, `Dacia`, `Người phụ trách ở đây`, cùng đại từ `họ` / `Họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000402
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000402: locks: [''Giữ hai mệnh
    đề điều kiện đối lập `nếu việc xin tị nạn thành công` và `Nếu thất bại, rủi ro
    chính trị và ngoại giao sẽ rất lớn`, cùng cụm `vượt xa thẩm quyền tự quyết của
    Tướng Habergram`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000403
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000403: locks: [''Giữ các cụm `hiểu
    rõ giới hạn quyền hạn của mình`, `những việc nào không thuộc quyền quyết định
    của mình`, `nắm quyền điều hành`, `Khả năng đưa ra phán đoán bình tĩnh, không
    đi chệch hướng của ông được đánh giá cao`, và các đại từ `ông` / `Ông`, `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000404
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000404: locks: [''Giữ các cụm đã
    sửa theo V4, V5, N11 và được nghiệm thu (`một người độc đến thế` theo mục `vol02-ch03-b21-toxic-description`,
    `kiểm soát bộ phận ấy`, `Văn phòng Bộ Hải quân` theo mục `vol02-ch03-b21-admiralty-titles`),
    các cụm `chuẩn bị một văn kiện`, `đặc biệt chú ý đến tính bảo mật`, `dẫn theo
    vài người hộ tống`, và các đại từ `họ`, `Ông` / `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000405
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000405: locks: [''Giữ câu thoại
    đã sửa theo V5 và được nghiệm thu (`“Habergram đây. Đệ nhất Lãnh chúa Hải quân
    có ở trong không?”`) theo mục `vol02-ch03-b21-admiralty-titles`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000406
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000406: locks: [''Giữ các danh
    xưng và thuật ngữ `Một quân cảnh`, `Habergram`, `ánh mắt dò xét của sĩ quan trực
    ban`, và đại từ `anh ta`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000407
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000407: locks: [''Giữ các cụm `chặn
    các sĩ quan cấp trên`, `ông thầm ghi nhận rằng viên sĩ quan trẻ này hẳn là người
    rất nghiêm túc`, và đại từ `chính ông` / `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000408
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000408: locks: [''Giữ lời đáp lễ
    phép của sĩ quan trực ban với Tướng Habergram `“Có ạ. Ngài đã hẹn trước chưa?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000409
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000409: locks: [''Giữ câu trả lời
    của Tướng Habergram `“Chưa. Tôi có việc khẩn cấp muốn hỏi ngài ấy.”` cùng các
    đại từ `Tôi`, `ngài ấy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000410
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000410: locks: [''Giữ các thuật
    ngữ `sĩ quan trực ban`, `vị tướng`, và câu kết lô `Sau khi sĩ quan trực ban xác
    nhận vài thông tin, vị tướng được dẫn vào văn phòng.`.'']'
  non_canon: true
