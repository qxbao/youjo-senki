task_id: vol-02-ch-03-b01
baseline_sha256: 1e62a97cbd6492b6347beaa2a8495eae4154f81b2c0e496f17ef97e6e6694641
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: eaaff62dbc6a9fa36f82b2a2f6e79a595e06a7c3f0e983488be80d30806b5c1a
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 40
segment_id_start: YS-LN02/Text/part0016.xhtml/p000001
segment_id_end: YS-LN02/Text/part0016.xhtml/p000040
choices:
- segment_id: YS-LN02/Text/part0016.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000001: locks: [''Giữ địa danh
    `Norden`, chủ ngữ khái quát `người ta`, cụm `một nỗi ám ảnh dễ chịu`, và hình
    ảnh `Lò sưởi cháy bập bùng, hơi ấm lan khắp căn phòng là thứ không thể thiếu trong
    một mùa đông yên ả ở Norden.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000002: locks: [''Giữ địa danh
    `Norden`, các đại từ `tôi`, `cô`, cụm trích dẫn trong ngoặc đơn `‘Chào mừng cô
    trở lại’`, và danh xưng `Thiếu tá von Degurechaff`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000003: locks: [''Giữ câu thoại
    đã sửa theo signoff `F-03` với các đại từ `Tôi`, `ngài`, và danh xưng `Tướng von
    Rudersdorf` (theo `vol02-ch03-b01-general-address`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000004: locks: [''Giữ bản sửa theo
    signoff `F-04` với các danh xưng `các sĩ quan Bộ Tổng tham mưu`, `Thiếu tướng
    von Rudersdorf` (theo `vol02-ch01-b14-major-general`), `Thiếu tá von Degurechaff`,
    đại từ `họ`, và không tự thêm động từ nghe/nhìn bó hẹp chủ thể cuộc đối đáp.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000005: locks: [''Giữ dấu ba chấm
    mở đầu, các đại từ `tôi` / `Tôi`, `cô`, và danh xưng `Đại tá von Lergen`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000006: locks: [''Giữ nguyên câu
    đáp lễ phép `“Tôi rất vinh dự, thưa ngài.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000007: locks: [''Giữ các đại từ
    `tôi` / `Tôi`, `cô`, tên riêng `Zettour`, và ý khẳng định `Tôi biết để Zettour
    điều cô đến đây là quyết định đúng đắn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000008: locks: [''Giữ bản sửa theo
    signoff `F-06` với các danh xưng `Bộ Tổng tham mưu`, `Phó cục trưởng Hậu cần`
    (theo `vol02-ch03-b01-service-corps`), `Phó cục trưởng Tác chiến` (theo `vol02-ch01-b15-operations`),
    tên riêng `Zettour`, cụm `đồng khóa hoặc cấp trên của ông ta`, và các đại từ `cô`,
    `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000009: locks: [''Giữ các đại từ
    `Chúng tôi`, `cô`, và câu thoại `“Chúng tôi cũng muốn cô bung hết sức ở đây.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000010: locks: [''Giữ đại từ `Tôi`
    và câu đáp khiêm nhường `“Tôi sẽ cố gắng hết sức, dù có lẽ chẳng giúp được bao
    nhiêu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000011: locks: [''Giữ đại từ `ta`
    và câu thoại `“Được. Vậy ta bàn vào việc chính.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000012: locks: [''Giữ nguyên câu
    đáp `“Vâng, thưa ngài.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000013: locks: [''Giữ cụm `Đơn
    vị của cô`, `nhiệm vụ tấn công vị trí địch`, và câu hỏi `“Đơn vị của cô có kinh
    nghiệm thực hiện nhiệm vụ tấn công vị trí địch không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000014: locks: [''Giữ đại từ `chúng
    tôi`, các danh xưng `mặt trận Rhine`, `Dacia`, thuật ngữ `không kích`, và mức
    độ giới hạn `nhưng chỉ có vậy`, `mà cũng không nhiều`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000015: locks: [''Giữ các đại từ
    `tôi`, `cô`, dấu ba chấm giữa đoạn, và câu hỏi xác nhận `Nhưng ít ra trên lý thuyết
    cô hiểu cách tiến hành, đúng không?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000016: locks: [''Giữ cụm `Vâng,
    thưa ngài.`, đại từ `Tôi`, và các danh xưng `Đại đội 205`, `mặt trận Rhine`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000017: locks: [''Giữ các đại từ
    `tôi`, `chúng tôi`, `cô`, quân hàm `Thiếu tá`, và các thuật ngữ `chiến dịch đổ
    bộ đường không`, `chiếm tuyến phòng thủ của địch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000018: locks: [''Giữ các đại từ
    `ngài`, `chúng`, `tôi`, và toàn văn `“Ý ngài là đẩy lùi chúng sao? Dù mệnh lệnh
    thế nào, tôi cũng muốn bắt tay vào việc ngay.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000019: locks: [''Giữ các đại từ
    `Cô` / `cô`, `tôi` / `Tôi`, và toàn văn `“Cô chu đáo quá, nhưng tôi nghĩ cô sẽ
    cần chuẩn bị cẩn thận. Tôi muốn cô tập trung huấn luyện một thời gian.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000020: locks: [''Giữ nguyên câu
    thoại `“Cảm ơn ngài! Nhưng như vậy có ổn không ạ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000021: locks: [''Giữ dấu gạch
    ngang dài, các đại từ `tôi`, `cô`, và câu thoại `“Không sao—đến lúc thích hợp
    tôi sẽ giao cho cô thật nhiều việc.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000022: locks: [''Giữ cụm `Vâng,
    thưa ngài.`, các đại từ `Tôi`, `đơn vị chúng tôi`, và toàn văn `“Vâng, thưa ngài.
    Tôi hứa đơn vị chúng tôi sẽ sẵn sàng về mọi mặt.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000023: locks: [''Giữ bản sửa theo
    signoff `F-08` với chức danh `Đặc phái viên`, đúng phạm vi nhấn mạnh in nghiêng
    tên tờ báo `*Londinium Times*` theo `DEC-P01-002`, cách lặp tên riêng `Jeffrey`
    (theo `vol02-ch03-b01-jeffrey-reference`), đại từ `chúng tôi`, và danh xưng `Nữ
    thần Thứ Mười Một` (theo `vol02-ch03-b01-eleventh-goddess`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000024: locks: [''Giữ bản sửa theo
    signoff `F-08` với cách lặp tên riêng `Jeffrey` ở cả hai mệnh đề (theo `vol02-ch03-b01-jeffrey-reference`),
    đại từ vô nhân xưng `nó` quy chiếu `Nữ thần Thứ Mười Một`, phủ định `chẳng phải
    viễn cảnh dễ chịu gì`, và mức độ `khá cao`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000025: locks: [''Giữ đại từ ngôi
    thứ nhất `tôi`, đại từ `đó`, và hai vế đối lập `xem đó chỉ là lời đồn ngoài chiến
    trường hay có căn cứ trong thực tế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000026: locks: [''Giữ bản sửa theo
    signoff `F-09` với cụm `Tất cả những người liên quan đến Nữ thần Thứ Mười Một
    mà chúng tôi hỏi` (theo `vol02-ch03-b01-eleventh-goddess`), động từ `từ chối bình
    luận`, và đại từ `nó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000027: locks: [''Giữ chủ ngữ `người
    ta`, cặp động từ `phủ nhận hoặc xác nhận`, và phủ định nhấn mạnh `nhưng chẳng
    ai muốn nói về chuyện đó dù chỉ một lời`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000028: locks: [''Giữ đại từ `Họ`
    và câu `Họ kiên quyết từ chối đến thế.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000029: locks: [''Giữ nguyên câu
    hỏi phỏng vấn `“Có phải chuyện đó là điều quân đội lấy làm hổ thẹn không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000030: locks: [''Giữ đại từ `chúng
    tôi`, cụm `một vị tướng đã nghỉ hưu vốn im lặng từ nãy`, và hành động `nện tay
    xuống bàn mạnh đến mức suýt làm vỡ nó`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000031: locks: [''Giữ đại từ `Ông`
    / `ông` và câu trần thuật `Ông bật dậy, vẻ mặt nhăn nhó khiến ông trông chẳng
    khác nào một con quỷ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000032: locks: [''Giữ đại từ `Chúng
    tôi`, cụm `cơn thịnh nộ của vị tướng đã nghỉ hưu ấy`, và toàn văn đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000033: locks: [''Giữ các đại từ
    `các người` / `Các người`, `ông`, `chúng tôi`, hai câu quát tháo trong ngoặc kép,
    và hành động `đá văng chiếc ghế như thể chỉ nói chuyện với chúng tôi thôi cũng
    đủ khiến ông phẫn nộ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000034: locks: [''Giữ cụm `những
    sĩ quan đã nghỉ hưu khác có mặt ở đó` và hành động `cũng đồng loạt đứng dậy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000035: locks: [''Giữ cụm `im lặng
    để thể hiện sự đồng tình nhất trí`, đại từ `Tôi`, và câu `Tôi phải thú nhận rằng
    lúc ấy tình cảnh khá khó xử.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000036: locks: [''Giữ câu trần
    thuật đã sửa theo signoff `F-12`: `Ít nhất điều này là thật.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000037: locks: [''Giữ các đại từ
    `chúng ta`, `tôi`, tên riêng `Jeffrey`, và toàn văn hai câu chuyển mạch lập luận.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000038: locks: [''Giữ bản sửa theo
    signoff với tên riêng `Jeffrey`, các danh xưng `Khối Thịnh vượng chung`, `Nữ thần
    Thứ Mười Một` (theo `vol02-ch03-b01-eleventh-goddess`), và cấu trúc đối lập `không
    phải ở phía tây mà là ở phía bắc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000039: locks: [''Giữ bản sửa theo
    signoff `F-01` không dùng dấu ngoặc kép cho câu hỏi tu từ của người dẫn chuyện:
    `Bằng cách nào?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000040: locks: [''Giữ bản sửa theo
    signoff `F-12` với cụm `chiến dịch phản công quy mô lớn ở phía bắc vào cuối cuộc
    chiến`, danh xưng `Khối Thịnh vượng chung`, và cụm `các tuyến phía tây` (không
    tự thêm từ `phòng thủ`).'']'
  non_canon: true
