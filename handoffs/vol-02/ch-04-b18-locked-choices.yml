    [''Sĩ quan tình báo tự xưng "tôi" và quy chiếu phía Đế quốc bằng "họ"'']: pov_and_logic:
    [{''Giữ mệnh đề nhượng bộ – phủ định trong lời bào chữa'': ''dù Đế quốc có thể
    có đội ngũ tình báo giỏi nhưng người nói thực sự không nghĩ họ biết được chuyện
    này''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000206
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000206: names_and_ranks: []: pronouns_and_address:
    []: pov_and_logic: [''Giữ mệnh lệnh yêu cầu giải thích đoạn phim ngay trước mắt'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000207
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000207: names_and_ranks: [''officers
    -> các sĩ quan'', ''combat mana -> ma lực chiến đấu'']: pronouns_and_address:
    [''Giữ lựa chọn tạm dùng "tôi" (`vol02-ch04-b18-observer-narrator-pronoun`); đại
    từ "nó" quy chiếu danh từ bất động vật "Đoạn phim trận chiến"'']: pov_and_logic:
    [''Giữ tác động của đoạn phim khiến các sĩ quan định phản đối phải im bặt, và
    quan hệ nhượng bộ giữa hình ảnh nhiễu hạt khó thấy chi tiết do mật độ ma lực chiến
    đấu dày đặc với nội dung quá rõ ràng mà đoạn phim cho thấy'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000208
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000208: names_and_ranks: [''imperial
    mages -> Các pháp sư Đế quốc'', ''enemy unit -> đơn vị địch'']: pronouns_and_address:
    [''Đại từ "họ" / "Họ" quy chiếu các pháp sư Đế quốc'']: pov_and_logic: [{''Giữ
    diễn biến chiến thuật trên đoạn phim và cấu trúc tăng tiến "không chỉ… mà còn…"'':
    ''các pháp sư Đế quốc tiến về một mục tiêu duy nhất theo đội hình hoàn hảo, phớt
    lờ các tàu khác cố tấn công thu hút hỏa lực, không chỉ chẳng sợ bị bắn trúng mà
    còn cơ động như thể hoàn toàn không tính đến khả năng bị thương tổn''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000209
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000209: names_and_ranks: [''marine
    mages -> các pháp sư hải quân'', ''assault formation -> đội hình xung kích'']:
    pronouns_and_address: [''Đại từ "họ" quy chiếu các pháp sư Đế quốc'']: pov_and_logic:
    [{''Giữ trình tự hai hành động của đơn vị Đế quốc'': ''chặn các pháp sư bay lên
    đánh chặn rồi bổ nhào xuống theo đội hình xung kích''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000210
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000210: names_and_ranks: [''Entente
    Alliance mage -> một pháp sư Liên minh Hiệp ước'', ''enemy mages -> các pháp sư
    địch'', ''battle cruiser -> tuần dương hạm'']: pronouns_and_address: []: pov_and_logic:
    [''Giữ cảnh bản ghi đột ngột tối đen khi pháp sư đi đánh chặn bị đâm lưỡi lê không
    thương tiếc rồi đá văng xuống biển như một cái xác, cùng hình ảnh cuối cùng là
    các pháp sư địch lao thẳng về phía tuần dương hạm'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000211
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000211: names_and_ranks: []: pronouns_and_address:
    [''Đại từ "Họ" quy chiếu các pháp sư Đế quốc'']: pov_and_logic: [{''Giữ kết luận
    hiển nhiên chỉ qua một cái liếc nhìn'': ''đối phương rõ ràng nhắm vào một con
    tàu cụ thể và chẳng để tâm đến những chiếc còn lại''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000212
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000212: names_and_ranks: [''Named
    -> đơn vị Named'', ''northern zone -> khu vực phía bắc'']: pronouns_and_address:
    [''Người chất vấn tự xưng "Tôi", gọi các sĩ quan tình báo là "các vị" và dùng
    "chúng ta" cho phía mình'']: pov_and_logic: [{''Giữ bản sửa M1 ("được cho là đã
    triển khai") và thuật ngữ "đơn vị Named" (`vol02-ch04-b18-named`)'': ''câu hỏi
    của một người đàn ông sắp bùng nổ bất cứ lúc nào về việc vì sao đơn vị Named được
    cho là đã triển khai ở khu vực phía bắc lại mai phục họ ở đây''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000213
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000213: names_and_ranks: [''intelligence
    officers -> Các sĩ quan tình báo'', ''imperial Named -> đơn vị Named của Đế quốc'',
    ''northern lines -> các phòng tuyến phía bắc'']: pronouns_and_address: [''Quy
    chiếu vị tướng đang nổi giận bằng "ông" và các sĩ quan tình báo bằng "họ"'']:
    pov_and_logic: [''Giữ hình ảnh cơn thịnh nộ bùng lên như sấm khiến các sĩ quan
    tình báo chỉ biết cầu mong cơn bão mau qua, cùng nhận định trước đó theo phân
    tích cẩn trọng của họ rằng đơn vị Named của Đế quốc dường như đang yểm trợ các
    phòng tuyến phía bắc'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000214
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000214: names_and_ranks: [''Central
    -> Trung ương'', ''Named unit -> đơn vị Named'', ''intelligence officers -> các
    sĩ quan tình báo'']: pronouns_and_address: [''Đại từ "họ" quy chiếu đơn vị Named'']:
    pov_and_logic: [{''Giữ hai dữ kiện'': ''Trung ương đã cất công điều động đơn vị
    Named này, còn các sĩ quan tình báo đã đưa ra cảnh báo sai một phần rằng đơn vị
    đó sẽ hỗ trợ một cuộc tấn công''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000215
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000215: names_and_ranks: [''Named
    unit -> đơn vị Named'', ''unknown elite unit -> một đơn vị tinh nhuệ chưa rõ danh
    tính'', ''mana signatures -> các dấu vết ma lực'']: pronouns_and_address: [''Đại
    từ "họ" ở câu 1 (lần 1) và câu 2 quy chiếu các sĩ quan tình báo; "họ" ở câu 1
    (lần 2) quy chiếu đơn vị Named'']: pov_and_logic: [''Giữ sự bất ngờ khi đơn vị
    Named xuất hiện cách xa khu vực đóng quân và chi tiết các dấu vết ma lực được
    ghi lại lập tức giải đáp nghi vấn liệu đó có phải một đơn vị tinh nhuệ chưa rõ
    danh tính hay không'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000216
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000216: names_and_ranks: [''Named
    unit -> đơn vị Named'', ''Entente Alliance -> Liên minh Hiệp ước'']: pronouns_and_address:
    [''Đại từ "Chúng" quy chiếu các dấu vết ma lực ở cuối đoạn p000215'']: pov_and_logic:
    [''Giữ kết quả đối khớp tín hiệu trùng với đơn vị Named vừa mới bị phát hiện ở
    Liên minh Hiệp ước'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000217
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000217: names_and_ranks: [''combat
    logs -> nhật ký chiến đấu'', ''Named -> đơn vị Named'', ''voluntary army -> đội
    quân tình nguyện'', ''Imperial Army -> Lục quân Đế quốc'']: pronouns_and_address:
    [''Đại từ "họ" quy chiếu đơn vị Named'']: pov_and_logic: [''Giữ sắc thái mỉa mai
    ("đã tử tế san phẳng đội quân tình nguyện ở đó") và lý do thời gian bất ngờ xét
    theo chu kỳ luân phiên chiến đấu và nghỉ ngơi của Lục quân Đế quốc'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000218
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000218: names_and_ranks: [''Entente
    Alliance -> Liên minh Hiệp ước'', ''powerful mage unit -> một đơn vị pháp sư hùng
    mạnh'']: pronouns_and_address: [''Đại từ "Họ" quy chiếu phía Đế quốc'']: pov_and_logic:
    [{''Giữ câu hỏi chất vấn về nghịch lý chiến lược'': ''giao tranh ở phía bắc đang
    leo thang và Đế quốc đang lên kế hoạch tấn công quét sạch Liên minh Hiệp ước,
    sao lại điều một đơn vị pháp sư hùng mạnh đến tận đây''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000219
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000219: names_and_ranks: [''Imperial
    Army -> Lục quân Đế quốc'', ''landing operation -> chiến dịch đổ bộ'', ''communication
    lines -> các tuyến liên lạc'', ''Commonwealth’s Navy -> Hải quân Khối Thịnh vượng
    chung'', ''Entente Alliance -> Liên minh Hiệp ước'', ''elite unit -> một đơn vị
    tinh nhuệ'', ''Northern Army Group -> Cụm tập đoàn quân phía Bắc'']: pronouns_and_address:
    [''Đại từ "họ" ở câu 1 quy chiếu phía phân tích tình báo; "họ" ở câu 2 quy chiếu
    Lục quân Đế quốc'']: pov_and_logic: [{''Giữ lập luận phân tích'': ''Lục quân Đế
    quốc sau chiến dịch đổ bộ bất chấp các tuyến liên lạc và sức mạnh Hải quân Khối
    Thịnh vượng chung đang chuẩn bị chiến dịch kết liễu Liên minh Hiệp ước, nên việc
    tình cờ điều một đơn vị tinh nhuệ tới khu vực này đúng lúc Cụm tập đoàn quân phía
    Bắc có lẽ đang cần mọi sự chi viện là điều bất thường''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000220
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000220: names_and_ranks: [''northern
    lines -> các phòng tuyến phía bắc'']: pronouns_and_address: []: pov_and_logic:
    [{''Giữ suy luận nhân quả'': ''vì đối phương đang dồn toàn bộ vũ khí, đạn dược
    và nhân lực sẵn có về các phòng tuyến phía bắc nên cuộc điều quân này rõ ràng
    phải là kết quả của một kế hoạch chứ không phải sự trùng hợp''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000221
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000221: names_and_ranks: [''Named
    unit -> đơn vị Named'', ''landing operation -> chiến dịch đổ bộ'', ''Rhine lines
    -> phòng tuyến sông Rhine'', ''Empire -> Đế quốc'', ''Rhine front -> mặt trận
    Rhine'', ''northern lines -> các phòng tuyến phía bắc'', ''Entente Alliance ->
    Liên minh Hiệp ước'', ''submarine -> chiếc tàu ngầm'', ''Northern Sea -> Biển
    Bắc'']: pronouns_and_address: [''Đại từ "nó" quy chiếu "đơn vị ấy" (đơn vị Named);
    "họ" lần 1 quy chiếu phía quan sát tình báo, "họ" lần 2 quy chiếu phía tàu đi
    cùng'']: pov_and_logic: [''Giữ đúng tình thái giả định quá khứ trái thực tế theo
    đề xuất của coordinator ("Nếu đơn vị ấy đã được rút đi rồi xuất hiện ở phòng tuyến
    sông Rhine, có thể xem đó là bằng chứng Đế quốc đang ưu tiên mặt trận Rhine.")
    và sự tương phản thực tế rằng ngay khi họ nhận ra không còn thấy đơn vị ấy ở các
    phòng tuyến phía bắc thì nó lại đang mai phục những con tàu Liên minh Hiệp ước
    rời đi cùng chiếc tàu ngầm ở Biển Bắc'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000222
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000222: names_and_ranks: [''fleet
    -> hạm đội'', ''vanguard -> đội tiên phong'']: pronouns_and_address: [''Đại từ
    "Họ" quy chiếu các pháp sư Đế quốc'']: pov_and_logic: [{''Giữ lời chỉ dẫn xem
    xét chi tiết quan trọng nhất trên đoạn phim'': ''đối phương lao thẳng đến giữa
    hạm đội mà thậm chí chẳng thèm nhìn đội tiên phong''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000223
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000223: names_and_ranks: [''mages
