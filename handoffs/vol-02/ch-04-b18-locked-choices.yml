- segment_id: YS-LN02/Text/part0024.xhtml/p000201
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000201: names_and_ranks: [''voluntary
    army -> đội quân tình nguyện'', ''mages -> các pháp sư'']: pronouns_and_address:
    [''Giữ lựa chọn tạm dùng "tôi" cho người quan sát (`vol02-ch04-b18-observer-narrator-pronoun`)'']:
    pov_and_logic: [{''Giữ sự kiện tiền lệ thứ nhất'': ''khi đội quân tình nguyện
    được cử đi thu thập tin tức và quan sát bị các pháp sư định vị rồi oanh kích,
    vẫn còn có thể nghi là trùng hợp''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000202
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000202: names_and_ranks: [''surveillance
    waves -> các đợt sóng giám sát'', ''reverse detection -> bị dò ngược'', ''apparatuses
    -> thiết bị'']: pronouns_and_address: [''Đại từ "họ" quy chiếu phía phụ trách
    kỹ thuật/tình báo'']: pov_and_logic: [''Giữ nguyên nhân kỹ thuật được suy đoán
    (sóng giám sát bị dò ngược dẫn tới việc cải tiến thiết bị) và mức độ khả thể kép
    (không thể loại trừ khả năng chỉ là tai nạn đáng tiếc hay sự trùng hợp)'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000203
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000203: names_and_ranks: []: pronouns_and_address:
    [''Giữ lựa chọn tạm dùng "tôi" (`vol02-ch04-b18-observer-narrator-pronoun`); đại
    từ "Họ" quy chiếu lực lượng bị tấn công'']: pov_and_logic: [''Giữ sự phủ định
    dứt khoát đối với giả thuyết trùng hợp trong lần này vì mục tiêu bị nhắm tới quá
    chính xác'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000204
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000204: names_and_ranks: []: pronouns_and_address:
    [''Sĩ quan tình báo tự xưng "Chúng tôi"'']: pov_and_logic: [''Giữ lời biện bạch
