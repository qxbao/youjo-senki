choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000104
  kind: unit_name_provisional
  value: Tiểu đoàn Pháp sư Trên không số 203
- segment_id: YS-LN02/Text/part0032.xhtml/p000104
  kind: viewpoint_and_logic
  value: Độc thoại nội tâm dùng "mình" và "chúng ta"; giữ câu hỏi tự giễu gắn vụ nổ
    nhà máy ở Dacia với suy luận điều kiện "nếu có đơn vị nào phá hủy được kho đạn
    của địch, thì đó chính là Tiểu đoàn Pháp sư Trên không số 203".
- segment_id: YS-LN02/Text/part0032.xhtml/p000105
  kind: callsign_and_address
  value: Giữ nguyên callsign "CP" và "01"; lược đại từ người nghe ("có tin không vui
    đây") để không suy diễn giới tính hay cấp bậc.
- segment_id: YS-LN02/Text/part0032.xhtml/p000106
  kind: name_and_footnote_marker
  value: Matsusheeta²⁵
- segment_id: YS-LN02/Text/part0032.xhtml/p000106
  kind: negation_and_timeframe
  value: Độc thoại nội tâm dùng "mình"; giữ phủ định "Không phải mình tin vào may
    mắn", tính chất nghe kể ("Nghe nói") và mốc thời gian trước khi bị tống đến thế
    giới này ("mình chẳng hiểu điều đó").
- segment_id: YS-LN02/Text/part0032.xhtml/p000107
  kind: modality_and_viewpoint
  value: Nội tâm "mình"; giữ khả thể "Có thể đó chỉ là vấn đề của lý thuyết xác suất"
    và kết luận "may mắn đáng để nghiên cứu".
- segment_id: YS-LN02/Text/part0032.xhtml/p000108
  kind: dialogue_question
  value: Câu hỏi mở ngắn gọn "Có chuyện gì vậy?", không thêm đại từ xưng hô.
- segment_id: YS-LN02/Text/part0032.xhtml/p000109
  kind: military_terms_and_order
  value: Giữ "quy mô cấp tiểu đoàn", địa danh "phòng tuyến Rhine", "rìa tầm radar
    của ta" và mốc thời gian mệnh lệnh "đến hết giai đoạn ba".
- segment_id: YS-LN02/Text/part0032.xhtml/p000110
  kind: callsign_and_term
  value: Giữ callsign "Fairy 01" và thuật ngữ tạm "tác chiến ngăn chặn"; nội tâm "mình"
    nén giận, "chật vật giữ giọng chuyên nghiệp" và nhận xét "Họ nói nhẹ tênh như
    vậy đấy".
- segment_id: YS-LN02/Text/part0032.xhtml/p000111
  kind: military_contrast_and_viewpoint
  value: Nội tâm "mình"/"chúng ta"; đối lập "tác chiến ngăn chặn" với thực tế tương
    đương "hai đại đội đang tiến hành trinh sát chiến đấu", phủ định "không bay đội
    hình chặt chẽ" và hao tổn sức lực khi bay qua "các vị trí phòng thủ".
- segment_id: YS-LN02/Text/part0032.xhtml/p000112
  kind: military_term_and_conditional_negation
  value: Giữ "phía đánh chặn", "các vị trí khai hỏa" (trung tính, không gán pháo binh)
    và điều kiện phủ định "miễn là họ không vô tình bị bắn trúng thì chẳng phải lo
    điều đó".
- segment_id: YS-LN02/Text/part0032.xhtml/p000113
  kind: modality
  value: Giữ suy đoán có căn cứ "Hẳn tinh thần họ thoải mái hơn nhiều."
- segment_id: YS-LN02/Text/part0032.xhtml/p000114
  kind: negation_and_military_reply
  value: Nội tâm "mình"/"chúng ta"; giữ phủ định đánh giá thấp địch ("mình không nghĩ
    đối phương thuộc kiểu người sẽ chẳng cần suy nghĩ đã đáp “rõ, thưa ngài” khi được
    lệnh đi đánh chặn chúng ta").
- segment_id: YS-LN02/Text/part0032.xhtml/p000115
  kind: action_urgency_and_term
  value: Giữ "một tiểu đoàn được lệnh khẩn trương xuất kích từ mặt đất để cản trở
    nhiệm vụ trinh sát của chúng ta".
- segment_id: YS-LN02/Text/part0032.xhtml/p000116
  kind: negation_and_attitude
  value: Nội tâm "mình"; giữ đánh giá "đội tuyển chọn", phủ định "Mình không muốn
    tự sát bằng cách ngây thơ mong rằng kẻ địch chỉ là một lũ ngốc" và nguyên tắc
    "chuẩn bị như một kẻ bi quan".
- segment_id: YS-LN02/Text/part0032.xhtml/p000117
  kind: modality_and_term
  value: 'Thoại cho phép (không phải mệnh lệnh bắt buộc): "Được phép lập tức hủy nhiệm
    vụ trinh sát chiến đấu." (lược đại từ người nghe).'
- segment_id: YS-LN02/Text/part0032.xhtml/p000118
  kind: tone_and_modality
  value: 'Nội tâm ngập ngừng và nhận xét về sự cho phép: "Rồi thì… ừm, được cho phép
    làm chuyện đó cũng thú vị thật." (không in nghiêng).'
- segment_id: YS-LN02/Text/part0032.xhtml/p000119
  kind: conditional_and_terms
  value: Giữ nhận định hiếm khi cho phép hủy nhiệm vụ, thuật ngữ "lệnh tác chiến ngăn
    chặn", và điều kiện "nếu cuộc rút lui diễn ra đúng kế hoạch thì hủy nhiệm vụ này
    cũng là một cách hạn chế tổn thất thêm".
- segment_id: YS-LN02/Text/part0032.xhtml/p000120
  kind: negation_and_term
  value: Nội tâm "mình"; dùng "cấp trên" cho the brass, giữ phủ định dứt khoát "Mình
    chắc chắn sẽ không rút lui" và nhận định "tính thực dụng quân sự chính là cái
    bẫy".
- segment_id: YS-LN02/Text/part0032.xhtml/p000121
  kind: general_pronoun_and_comparison
  value: Giữ đại từ khái quát "bạn" trong câu giả định chung ("Nếu có người đưa cho
    bạn một con đường trải nhựa chạy thẳng xuống địa ngục, dù với ý tốt...") và chiều
    so sánh "rẽ khỏi đường ấy và lái xe băng qua vùng hoang địa vẫn an toàn hơn nhiều".
- segment_id: YS-LN02/Text/part0032.xhtml/p000122
  kind: dialogue_omission
  value: 'Thoại lược chủ ngữ/đại từ xưng hô: "…Mong là không cần đến mức đó."'
- segment_id: YS-LN02/Text/part0032.xhtml/p000123
  kind: negation_proper_noun_and_emphasis
  value: Nội tâm "mình"; giữ phủ định "Mình không phải tay mơ", "mình trải qua huấn
    luyện đâu phải không có lý do", "Mình đâu được tạo ra theo khuôn mẫu của một thực
    thể thiếu thực tế như Being X", giữ nguyên "Being X" và chỉ in nghiêng "*Homo
    sapiens*" theo đúng DEC-P01-002.
- segment_id: YS-LN02/Text/part0032.xhtml/p000124
  kind: dialogue_questions
  value: 'Hai câu hỏi ngắn liên tiếp không gán đại từ xưng hô: "Sao cơ? Ý là sao?"'
- segment_id: YS-LN02/Text/part0032.xhtml/p000125
  kind: military_terms_and_conditional_risk
  value: Thoại dùng "ta"/"chúng ta"; giữ "trinh sát chiến đấu", "khảo sát năng lực
    đánh chặn của địch" và điều kiện rủi ro "Nếu giờ ta hủy nhiệm vụ, chúng ta có
    nguy cơ để lộ mục đích đánh lừa của nó".
- segment_id: YS-LN02/Text/part0032.xhtml/p000126
  kind: conditional_and_military_terms
  value: Giữ điều kiện "Nếu màn ngụy trang cuộc rút lui bằng nhiệm vụ trinh sát chiến
    đấu thất bại", thuật ngữ "lực lượng đoạn hậu", hành động "cầm cự và câu giờ đến
    phút cuối cùng", "lực lượng trên mặt đất" và bị động "họ có thể bị giẫm đạp".
- segment_id: YS-LN02/Text/part0032.xhtml/p000127
  kind: concession_and_caution
  value: Giữ "chúng ta" và mệnh đề nhượng bộ "ngay cả khi đã mã hóa, chúng ta cũng
    nên cân nhắc thật kỹ trước khi truyền đi cuộc trao đổi kiểu này".
- segment_id: YS-LN02/Text/part0032.xhtml/p000128
  kind: viewpoint_shift_and_conditionals
  value: Giữ tên "Tanya" ở câu mở đầu rồi chuyển về nội tâm "mình"; giữ tình thái
    "có lẽ", cụm "lực lượng đoạn hậu" và "dù lực lượng ấy có phải bị tiêu diệt sạch
    theo đúng nghĩa đen", giả định "Nếu mình là phía ra lệnh, mình cũng sẽ không ngần
    ngại làm vậy", điều kiện "Nếu kế hoạch này có vấn đề gì, thì đó là mình đang ở
    phía nhận lệnh" và câu chửi "Khốn kiếp".
- segment_id: YS-LN02/Text/part0032.xhtml/p000129
  kind: proper_nouns_and_comparison
  value: Giữ "mọi đơn vị Cộng hòa trên mặt trận Rhine" và so sánh "né được tiểu đoàn
    này rồi lại bị mọi đơn vị Cộng hòa trên mặt trận Rhine truy đuổi thì còn ngu ngốc
    hơn nhiều".
- segment_id: YS-LN02/Text/part0032.xhtml/p000130
  kind: economic_metaphor_and_viewpoint
  value: Nội tâm "mình"; giữ kết luận "xét đến rủi ro thì ở lại đây là lựa chọn duy
    nhất", lập luận "Mình hiểu rõ việc không đầu tư chỉ vì sợ một rủi ro nhỏ là dại
    dột" và "lợi nhuận".
- segment_id: YS-LN02/Text/part0032.xhtml/p000131
  kind: negative_constraint_and_sequence
  value: Thoại dùng "chúng ta"; giữ điều kiện phủ định về thời điểm "Vì không thể
    để họ phát hiện ra trước khi giai đoạn ba kết thúc" và trình tự hành động "loại
    bỏ đơn vị đánh chặn này rồi tiếp tục nhiệm vụ".
