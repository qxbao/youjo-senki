task_id: vol-02-ch-02-b19
baseline_sha256: 111af123e5f4a2415a2c52bd2793940cc27a4a189d2442d96f973b766b6c63b9
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: bfadc00a8641404f1b669181dc5e6f362364e6738ad80c08b0003f99f9166fc6
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 84
segment_id_start: YS-LN02/Text/part0014.xhtml/p000513
segment_id_end: YS-LN02/Text/part0014.xhtml/p000596
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000513
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000513: locks: [''Giữ nguyên câu
    đáp đồng thanh `“Rõ, thưa bà!”` (theo biến thể tại chỗ đã được signoff chấp nhận).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000514
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000514: locks: [''Giữ đại từ trần
    thuật `nó` cho Tanya theo `DEC-P01-001`, tên riêng `Tanya`, đại từ `họ`, và toàn
    văn `Câu đáp gọn lỏn hẳn có nghĩa là họ đã hiểu ý định của nó. Tanya hài lòng
    gật đầu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000515
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000515: locks: [''Giữ đại từ `chúng
    ta` và câu thoại `“Nào, làm việc cho xứng với số tiền chúng ta được trả!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000516
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000516: locks: [''Giữ các cụm `Đội
    ném bom`, `chi viện`, và câu thoại `“Đội ném bom tiêu rồi! Vẫn chưa có chi viện
    à?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000517
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000517: locks: [''Giữ nguyên câu
    thét `“Ánh sáng—ánh sáng!! Áaaa!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000518
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000518: locks: [''Giữ cụm `đội
    trưởng đội hình` và câu thoại `“Mất tín hiệu của đội trưởng đội hình rồi à?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000519
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000519: locks: [''Giữ đại từ `Chúng`
    / `chúng`, cụm `màn đạn`, và toàn văn `“Tản ra! Chúng nhanh quá! Dựng màn đạn
    lên! Đừng để chúng áp sát!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000520
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000520: locks: [''Giữ hô hiệu `Pixie
    02`, cụm `tất cả các đại đội`, và hiệu lệnh `“Pixie 02 gọi tất cả các đại đội.
    Xung phong!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000521
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000521: locks: [''Giữ thuật ngữ
    `đội tiên phong` (theo `vol02-ch02-b19-vanguard`), đại từ `Chúng`, thuật ngữ `cận
    chiến`, và toàn văn `“Khự! Chúng vượt qua đội tiên phong rồi à?! Ngừng bắn, chuẩn
    bị cận chiến!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000522
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000522: locks: [''Giữ bản sửa theo
    signoff `m3` với tín hiệu cầu cứu `Mayday! Mayday!` (theo `vol02-ch02-b19-mayday`),
    thuật ngữ `cứu viện`, và câu thoại `“Mayday! Mayday! Vẫn chưa có cứu viện à?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000523
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000523: locks: [''Giữ bản sửa theo
    signoff `m4` với định danh `Trung tâm Norland`, cụm lặp lệnh trực tiếp không thêm
    từ thừa `Hủy chiến dịch! Hủy chiến dịch! Kể từ lúc này, hủy chiến dịch!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000524
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000524: locks: [''Giữ cụm `“Đơn
    vị ném bom—!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000525
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000525: locks: [''Giữ thuật ngữ
    `Đội tiên phong` (theo `vol02-ch02-b19-vanguard`), cụm `bị xé nát`, đại từ `Bọn
    kia`, và toàn văn `“Chết tiệt! Đội tiên phong bị xé nát rồi! Bọn kia là ai vậy?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000526
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000526: locks: [''Giữ định danh
    `Đại đội trinh sát`, cụm `bị quét sạch`, đại từ `chúng ta`, và câu thoại `“Đại
    đội trinh sát bị quét sạch rồi! Cứ thế này chúng ta sẽ bị bao vây mất!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000527
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000527: locks: [''Giữ thuật ngữ
    `lực lượng yểm trợ gần` (theo `vol02-ch02-b19-close-support`), đại từ `Chúng`
    – `ta`, và câu hỏi `“Chúng vượt qua lực lượng yểm trợ gần của ta rồi à?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000528
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000528: locks: [''Giữ các hô hiệu
    `Viper 02`, `Pixie 01`, đại từ `Chúng tôi`, và toàn văn `“Viper 02 gọi Pixie 01.
    Chúng tôi đang đến.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000529
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000529: locks: [''Giữ hiệu lệnh
    `Rõ`, thuật ngữ `quân tiếp viện địch`, cụm `truy kích ráo riết`, và toàn văn `“Rõ.
    Chưa thấy quân tiếp viện địch. Dự kiến sẽ bị truy kích ráo riết.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000530
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000530: locks: [''Giữ hô hiệu `Viper
    02` và câu đáp `“Viper 02, rõ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000531
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000531: locks: [''Giữ các thuật
    ngữ `quân tiếp viện địch`, `tiểu đoàn`, và câu thoại `“Phát hiện quân tiếp viện
    địch! Quy mô cỡ một tiểu đoàn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000532
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000532: locks: [''Giữ thuật ngữ
    `Quân tiếp viện`, cụm `quân ta`, và câu hỏi `“Quân tiếp viện à? Còn quân ta thì
    sao?!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000533
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000533: locks: [''Giữ định danh
    `Trung tâm Norland`, thuật ngữ `điểm tập kết số hai` (theo `vol02-ch02-b19-marshaling-point`),
    và toàn văn `“Trung tâm Norland gọi tất cả đơn vị. Lập tức rút về điểm tập kết
    số hai. Nhắc lại, lập tức rút về điểm tập kết số hai.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000534
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000534: locks: [''Giữ bản sửa theo
    signoff `M2` với động từ `cắt đuôi` và đại từ `chúng` trong câu `“Không được rồi!
    Không cắt đuôi được chúng!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000535
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000535: locks: [''Giữ nguyên câu
    chửi lặp `“Khốn kiếp, khốn kiếp, khốn kiếp!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000536
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000536: locks: [''Giữ hô hiệu `Pixie
    01`, thuật ngữ `dọn dẹp` (theo `vol02-ch02-b19-cleanup`), và câu lệnh `“Pixie
    01 gọi toàn thể. Chuyển sang dọn dẹp.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000537
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000537: locks: [''Giữ hô hiệu `Viper
    02`, định danh `Tiểu đoàn Pixie`, đại từ `các anh`, và toàn văn `“Viper 02 gọi
    Tiểu đoàn Pixie. Đã nhìn thấy các anh.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000538
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000538: locks: [''Giữ các đại từ
    `Chúng tôi`, `các anh`, `Tôi`, thuật ngữ `truy kích`, cụm `đội mình xử lý đám
    tụt lại`, và toàn văn `“Chúng tôi cũng thấy các anh. Có thể giao việc truy kích
    cho các anh không? Tôi muốn đội mình xử lý đám tụt lại.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000539
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000539: locks: [''Giữ thuật ngữ
    `Quân tiếp viện địch` và câu thoại `“Quân tiếp viện địch đã đến!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000540
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000540: locks: [''Giữ nguyên câu
    thoại `“Chết tiệt! Đừng dừng lại! Chạy đi! Mau lên!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000541
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000541: locks: [''Giữ nguyên câu
    đáp `“Rõ. Cảm ơn.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000542
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000542: locks: [''Giữ nguyên câu
    cảm thán `“Khốn kiếp, đúng là địa ngục!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000543
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000543: locks: [''Giữ đại từ `tôi`
    và câu kêu cứu `“Ruột của tôi… Ai nhặt ruột tôi lên với!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000544
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000544: locks: [''Giữ các đại từ
    `Chúng`, `các anh`, cụm `kẻ thù không đội trời chung`, hiệu lệnh kết thúc liên
    lạc `Hết.` (theo `b05-radio-over`), và toàn văn `“Chúng là kẻ thù không đội trời
    chung của các anh. Không cần nương tay. Hết.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000545
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000545: locks: [''Giữ bản sửa theo
    signoff `M3` với đánh dấu nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, đại
    từ nội tâm `mình`, và câu hỏi `*Tối qua mình đã uống cái quái gì vậy?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000546
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000546: locks: [''Giữ đại từ trần
    thuật `anh ta` và toàn văn `Câu hỏi đầu tiên nảy ra trong đầu anh ta thật ngớ
    ngẩn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000547
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000547: locks: [''Giữ đại từ trần
    thuật `Anh ta` / `anh ta`, đại từ phản thân `mình`, và toàn văn `Anh ta cảm nhận
    được có người đang lay mình, nhưng phải mất một lúc lâu đầu óc anh ta mới bắt
    đầu hoạt động.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000548
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000548: locks: [''Giữ bản sửa theo
    signoff `M1` với cấp bậc và tên `Trung úy Gunning` (theo `vol02-ch02-b19-first-lieutenant`),
    đại từ phản thân `mình`, và toàn văn `Trung úy Gunning không hiểu sao cả người
    mình lại nặng trĩu.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000549
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000549: locks: [''Giữ bản sửa theo
    signoff `M3` với đánh dấu in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội
    tâm `mình`, và câu hỏi `*Có người đang… gọi mình à?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000550
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000550: locks: [''Giữ nguyên tiếng
    rên `“Ừm…!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000551
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000551: locks: [''Giữ đại từ trần
    thuật `anh ta` và toàn văn `Ý thức anh ta đã trở lại, dù vẫn còn mơ hồ, và những
    đường nét bắt đầu hiện ra.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000552
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000552: locks: [''Giữ cấp bậc `Trung
    úy` và câu gọi `“Trung úy! Trung úy!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000553
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000553: locks: [''Giữ bản sửa theo
    signoff `M3` với đánh dấu in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ `họ`,
    `mình`, các từ `sếp`, `quân cảnh`, và toàn văn `*…Chà, thế này không ổn. Nếu họ
    không gọi tên mình thì chắc là sếp hoặc quân cảnh.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000554
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000554: locks: [''Giữ bản sửa theo
    signoff `M3` với đánh dấu in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội
    tâm `mình`, và toàn văn `*Nhưng mình vẫn còn choáng. Chóng mặt đến mức không chịu
    nổi.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000555
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000555: locks: [''Giữ bản sửa theo
    signoff `M3` với đánh dấu in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội
    tâm `mình`, tên đồ uống `Scotch`, `vodka`, và toàn văn `*Thật tình, mình đã uống
    cái gì vậy? Uống cả chai Scotch mình vẫn khỏe re, sao lần này…? Có ai pha vodka
    cho mình à?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000556
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000556: locks: [''Giữ đại từ trần
    thuật `Anh ta` và câu `Anh ta chỉ hé mắt, như thói quen.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000557
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000557: locks: [''Giữ bản sửa theo
    signoff `M3` chỉ đánh dấu in nghiêng đúng câu tự hỏi cuối đoạn `*Không, có lẽ
    là một loại máy móc?*` theo `DEC-P01-002`, tách biệt với hai câu trần thuật đầu
    đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000558
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000558: locks: [''Giữ đại từ trần
    thuật `anh ta` / `Anh ta`, đại từ phản thân `mình`, và toàn văn `Ánh sáng vẫn
    làm anh ta khó chịu, nhưng cảm giác kỳ lạ rằng cơ thể này không phải của mình
    khiến anh ta bối rối. Anh ta mệt rã rời, cố thế nào cũng không nhúc nhích nổi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000559
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000559: locks: [''Giữ bản sửa theo
    signoff `M3` với đại từ trần thuật `anh ta`, đại từ phản thân `mình`, và chỉ đánh
    dấu in nghiêng đúng câu hỏi nội tâm cuối đoạn `*Vậy chuyện gì đang xảy ra?*` theo
    `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000560
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000560: locks: [''Giữ bản sửa theo
    signoff `M3` với đại từ trần thuật `Anh ta` ở câu đầu không in nghiêng, và đánh
    dấu in nghiêng đúng phạm vi độc thoại nội tâm dùng đại từ `Mình` / `mình` từ `*Hửm?
    Một căn phòng? Mình nghĩ mình biết nơi này. Hình như mình có chút ký ức về nó.
    Vậy mình đang ở đâu?*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000561
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000561: locks: [''Giữ nguyên câu
    thều thào `“…Ư… Ở đâu…?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000562
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000562: locks: [''Giữ đại từ trần
    thuật `Anh ta` / `anh ta`, đại từ phản thân `mình`, và toàn bộ diễn biến cảnh
    mọi người xung quanh đỡ Gunning dậy.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000563
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000563: locks: [''Giữ cấp bậc `Trung
    úy`, đại từ `anh`, các danh xưng `Quân y`, `bác sĩ phẫu thuật`, và toàn văn `“Trung
    úy! Được rồi, anh tỉnh rồi phải không? Quân y! Mau gọi bác sĩ phẫu thuật!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000564
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000564: locks: [''Giữ nguyên câu
    hỏi `“Cái gì…?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000565
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000565: locks: [''Giữ đúng hai
    phạm vi nhấn mạnh in nghiêng `*Có gì đó rất kỳ lạ.*` và `*Rốt cuộc chuyện quái
    gì xảy ra với mình vậy?*` theo `DEC-P01-002`, cùng đại từ trần thuật `anh ta`
    / `Anh ta` và đại từ nội tâm `mình`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000566
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000566: locks: [''Giữ đại từ trần
    thuật `Anh ta` / `anh ta`, cấu trúc tăng tiến phủ định `không những không lấy
    nét được mà còn không giữ yên nổi`, và toàn văn đoạn.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000567
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000567: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng câu giả định trái thực tế ở câu đầu `*Nếu là say rượu
    thì mình phải buồn nôn và đau đầu… nhưng không.*` theo `DEC-P01-002`, cùng đại
    từ trần thuật `anh ta` và phản thân `mình` ở câu sau.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000568
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000568: locks: [''Giữ đại từ `Anh`
    và câu thoại `“Bình tĩnh. Anh nhớ được đến đâu?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000569
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000569: locks: [''Giữ đại từ `Anh`
    và câu hỏi `“…Gì cơ? Anh đang nói gì vậy?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000570
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000570: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm `Mình`, và toàn văn `*Không.
    Mình không muốn nhớ thêm chút nào nữa.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000571
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000571: locks: [''Giữ bản sửa theo
    signoff `m5` bảo toàn đúng hai cụm nhấn mạnh tách rời `*Mình* không được *nhớ
    lại.*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000572
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000572: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm `Mình`, và toàn văn `*Mình
    không thể… Gì cơ?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000573
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000573: locks: [''Giữ cấp bậc `Đại
    úy`, đại từ `Anh ấy`, từ tượng hình `nát bét` (theo `vol02-ch02-b19-minced`),
    và toàn văn `“Đại úy, không ổn rồi. Anh ấy nát bét cả rồi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000574
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000574: locks: [''Giữ các từ `Nhật
    ký`, `bị phá hủy`, đại từ `Chúng tôi`, `tôi`, và toàn văn `“Ở đây cũng vậy. Nhật
    ký bị phá hủy. Chúng tôi đã thu hồi được, nhưng tôi không nghĩ mấy thứ này còn
    hữu ích.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000575
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000575: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002` và từ lặp lại `*Nát bét?*` (theo `vol02-ch02-b19-minced`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000576
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000576: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002` và cụm lặp lại `*Bị phá hủy?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000577
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000577: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm `mình`, và cụm bỏ lửng
    `*Đồng đội của mình…*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000578
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000578: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm `mình`, và câu hỏi `*Còn
    anh em của mình thì sao…?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000579
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000579: locks: [''Giữ định danh
    `Đế quốc`, đại từ `Anh`, thuật ngữ `hộ chiếu`, và câu thoại mỉa mai `“Chào mừng
    đến Đế quốc. Anh có hộ chiếu không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000580
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000580: locks: [''Giữ danh xưng
    `Chỉ huy`, đại từ `Chúng tôi`, cụm `bó hoa chào mừng`, và toàn văn `“Ha ha ha,
    Chỉ huy. Chúng tôi đâu có mang bó hoa chào mừng. Giờ tính sao đây?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000581
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000581: locks: [''Giữ cặp đại từ
    `tôi` – `mấy cậu`, từ `pháo hoa`, và toàn văn `“Ôi trời, tôi phải làm gì với mấy
    cậu đây? Nhưng có mang pháo hoa đến chứ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000582
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000582: locks: [''Giữ nguyên câu
    thoại `“À phải rồi. Mấy thứ đó trông cũng giống hoa nhỉ?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000583
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000583: locks: [''Giữ ngôi tự xưng
    `tôi` và câu thoại `“Tuyệt. Vậy có lẽ tôi sẽ hát một bài chào mừng.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000584
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000584: locks: [''Giữ đại từ `Anh`
    và câu hỏi `“Hửm? Anh biết hát à?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000585
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000585: locks: [''Giữ nguyên câu
    đáp `“Ừ, một bài hay lắm.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000586
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000586: locks: [''Giữ cặp đại từ
    `tôi` – `các cậu`, danh xưng `đại úy`, và toàn văn `“Có cần tôi khâu miệng các
    cậu lại không?” đại úy quát.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000587
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000587: locks: [''Giữ nguyên câu
    trần thuật `Ở đâu đó, có người vội vàng ngậm miệng lại, nhưng đã quá muộn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000588
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000588: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm `mình`, và chuỗi hình
    ảnh `*Hoa đỏ, đỏ thắm. Anh em của mình. Cấp trên của mình. Người của mình.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000589
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000589: locks: [''Giữ nguyên tiếng
    hét thất thanh `“…Áááááááááááá!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000590
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000590: locks: [''Giữ các thuật
    ngữ `Quân y`, `Thuốc an thần`, và câu lệnh `“Quân y! Thuốc an thần! Mau!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000591
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000591: locks: [''Giữ đại từ `Các
    cậu`, cụm `bị kỷ luật`, và toàn văn `“Lũ ngốc! Các cậu sẽ bị kỷ luật vì chuyện
    này!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000592
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000592: locks: [''Giữ bản sửa theo
    signoff `M4` với đánh dấu in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ trung
    tính `họ` (tránh `chúng`), và câu `*Giờ họ chỉ còn là thịt.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000593
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000593: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002` và cụm `*Những đóa hoa đỏ thắm, đẫm máu.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000594
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000594: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002` và từ `*Bùng nở.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000595
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000595: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002` và từ `*Nở rộ.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000596
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000596: locks: [''Giữ đánh dấu
    in nghiêng toàn đoạn theo `DEC-P01-002` và cụm kết chương `*Khắp nơi.*`.'']'
  non_canon: true
