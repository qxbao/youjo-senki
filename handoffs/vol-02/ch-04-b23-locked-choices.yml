choices:
- segment_id: YS-LN02/Text/part0024.xhtml/p000352
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000352: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Trần thuật ngôi thứ ba dùng `Tanya`, mệnh đề phụ tự quy
    chiếu dùng `mình`.'']: pov_and_voice: Trần thuật ngôi thứ ba bám sát điểm nhìn
    của Tanya, giọng nhẹ nhõm pha tự giễu.: modality_and_logic: Giữ quan hệ trạng
    thái – hành động (`Nhẹ nhõm, Tanya uống cạn tách cà phê nguội, khẽ thở dài ngoài
    ý muốn rồi nở nụ cười gượng`) và nhận thức về sự căng thẳng khác thường gần đây
    của bản thân.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000353
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000353: terms: [''phiên tòa quân
    sự (court-martial)'', ''buổi thảo luận mang tính thủ tục (discussion held as a
    formality)'', ''tha bổng (pardon)'', ''sĩ quan tham mưu (staff officer)'']: names_and_ranks:
    [''Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba dùng `Tanya`, đại
    từ phản thân `mình` và đại từ chủ ngữ `Nó` (theo DEC-P01-001).'']: pov_and_voice:
    Trần thuật ngôi thứ ba gián tiếp tự do phản ánh suy luận của Tanya.: modality_and_logic:
    Giữ tình thái nghe nói/dự kiến (`nghe nói đó chỉ là...`), hệ quả suy ra (`nghĩa
    là Tanya đã được ngầm báo trước rằng mình sẽ được tha bổng, dù điều đó khá ngoài
    dự đoán`), thế nhượng bộ (`chỉ được thông báo bằng lời`) và suy luận chắc chắn
    (`đã là lời của một sĩ quan tham mưu thì hẳn phải đáng tin`).: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000354
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000354: terms: [''cấp trên (higher-ups)'',
    ''giới chỉ huy cấp cao (the brass)'']: names_and_ranks: [''Lergen'']: pronouns_and_address:
    [''Tự sự ngôi thứ nhất dùng `tôi` (kế thừa b22; câu 1 có thể chuốt thành `mình`);
    thông điệp giả định của cấp trên gửi Tanya dùng `Chúng tôi – cô`.'']: pov_and_voice:
    Độc thoại/tự sự nội tâm của Tanya kèm câu thông điệp ngầm của cấp trên.: modality_and_logic:
    Giữ tình thái suy đoán hợp lý (`hẳn là`, `chắc là`), phủ định tiếp diễn (`vẫn
    chưa bỏ rơi tôi`) và quan hệ điều kiện – yêu cầu trong thông điệp ngầm (`giữ cô
    lại, vậy hãy cho chúng tôi thấy cô vẫn làm nên chuyện`).: emphasis: Khóa nhấn
    mạnh `*Chúng tôi sẽ giữ cô lại, vậy hãy cho chúng tôi thấy cô vẫn làm nên chuyện.*`
    theo đúng thẻ `<em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000355
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000355: terms: [''Bộ Tổng tham
    mưu (General Staff)'', ''đơn vị (unit)'', ''được tuyên vô tội (found not guilty)'']:
    pronouns_and_address: [''Tự sự ngôi thứ nhất dùng `tôi`; quy chiếu Bộ Tổng tham
    mưu bằng `họ`.'']: pov_and_voice: Độc thoại/tự sự ngôi thứ nhất của Tanya.: modality_and_logic:
    Giữ quan hệ điều kiện – suy luận (`Nếu tôi được đối đãi như vậy, hẳn Bộ Tổng tham
    mưu vẫn đặt kỳ vọng lớn vào đơn vị và tôi`) và mệnh đề nhượng bộ chêm xen (`dù
    chỉ bằng lời`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000356
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000356: terms: [''cấp dưới (subordinate)'',
    ''sức khỏe tinh thần (mental health)'', ''từ chức (resign)'', ''quân đội (army)'',
    ''sa thải (lay someone off)'', ''hình thức kỷ luật (disciplinary action)'']: pronouns_and_address:
    [''Tự sự ngôi thứ nhất dùng `tôi`; quy chiếu cấp dưới giả định bằng `họ`; lược
    đại từ ngôi thứ hai phiếm chỉ ở mệnh đề `nơi không thể sa thải ai`.'']: pov_and_voice:
    Độc thoại ngôi thứ nhất sắc lạnh, thực dụng của Tanya.: modality_and_logic: Giữ
    cấu trúc giả định trái thực tế (`Nếu là tôi mà cấp dưới *của tôi* làm việc kém
    cỏi, tôi chẳng quan tâm...—tôi sẽ khuyên họ từ chức`), câu hỏi tu từ (`Ai mà chẳng
    vậy?`) và câu nhượng bộ tăng tiến (`Ngay cả trong quân đội, nơi không thể sa thải
    ai, họ cũng phải chuẩn bị tinh thần chịu một hình thức kỷ luật nào đó`).: emphasis:
    Khóa nhấn mạnh `*của tôi*` ứng với `<em>my</em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000357
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000357: terms: [''cấp trên (higher-ups)'',
    ''cho tôi qua chuyện (letting me off the hook)'', ''cơ hội thứ hai (second chance)'']:
    pronouns_and_address: [''Tự sự ngôi thứ nhất dùng `tôi`; quy chiếu cấp trên bằng
    `họ`.'']: pov_and_voice: Độc thoại ngôi thứ nhất tỉnh táo của Tanya.: modality_and_logic:
    Giữ tình thái nhận định (`xem ra`) ở câu 1 và phủ định khả năng lặp lại sự khoan
    dung ở câu 2 (`tôi không thể mong họ sẽ lại khoan dung như vậy`).: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000358
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000358: terms: [''cuộc diễn tập
    chiến tranh (war game)'', ''Bộ Tổng tham mưu (General Staff)'', ''giới chỉ huy
    cấp cao (the brass)'']: pronouns_and_address: [''Tự sự ngôi thứ nhất dùng `tôi`;
    quy chiếu cấp trên bằng `Họ`.'']: pov_and_voice: Độc thoại ngôi thứ nhất thể hiện
    quyết tâm lập công của Tanya.: modality_and_logic: Giữ sắc thái tăng tiến (`thậm
    chí còn cho tôi cơ hội...`) và mức độ cam kết chắc chắn (`nhất định phải đáp lại
    kỳ vọng...`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000359
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000359: pronouns_and_address: [''Lời
    tự nhủ thành tiếng trong ngoặc kép dùng `tôi` (hoặc đồng bộ với `mình` ở p000361
    khi chuốt văn).'']: pov_and_voice: Độc thoại thành tiếng khi Tanya suy ngẫm một
    mình.: modality_and_logic: Giữ đúng câu hỏi mở truy tìm chủ thể đang nâng đỡ mình
    (`Ai là người đang nương tay với tôi nhỉ?`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000360
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000360: terms: [''giật dây (pulling
    the strings)'', ''phe của Tướng von Zettour (General von Zettour’s camp)'']: names_and_ranks:
    [''Tướng von Zettour (General von Zettour)'']: pronouns_and_address: [''Tự sự
    ngôi thứ nhất dùng `tôi`.'']: pov_and_voice: Độc thoại phân tích quan hệ quyền
    lực trong quân đội của Tanya.: modality_and_logic: Giữ mạch suy luận loại trừ
    từ điều kiện (`Nếu tôi thoát nạn dễ dàng đến vậy, hẳn có người ở cấp cao hơn đang
    giật dây`), giới hạn phạm vi (`chỉ có vài người`) đến kết luận tất yếu (`chắc
    chắn là người thuộc phe của Tướng von Zettour`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000361
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000361: terms: [''cấp trên (superior)'',
    ''quân đội (army)'', ''binh lính (soldiers)'']: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Câu thoại tự lẩm bẩm dùng `mình`; câu trần thuật ngôi
    thứ ba dùng `Tanya` và `nó` (theo DEC-P01-001); câu kết tự sự ngôi thứ nhất dùng
    `Tôi`; quy chiếu Tướng von Zettour bằng `ông ấy`.'']: pov_and_voice: Kết hợp lời
    tự lẩm bẩm, trần thuật ngôi thứ ba và độc thoại ngôi thứ nhất của Tanya.: modality_and_logic:
    Bảo toàn sự chuyển ngôi giữa ba phần trong đoạn và mệnh đề quan hệ giải thích
    (`nơi binh lính chẳng có quyền chọn sếp`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000362
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000362: terms: [''tiểu đoàn (battalion)'',
    ''bị giải tán (broken up)'']: pronouns_and_address: [''Tự sự ngôi thứ nhất dùng
    `tôi`; quy chiếu binh sĩ tiểu đoàn bằng `họ`.'']: pov_and_voice: Tự sự ngôi thứ
    nhất của Tanya khi bước sang phòng bên cạnh.: modality_and_logic: Giữ đúng trình
    tự thời gian của giả định quá khứ và hành động tiền khởi (`Trong tình huống xấu
    nhất, tôi nghĩ tiểu đoàn thậm chí có thể bị giải tán, nên đã triệu tập tất cả
    phòng khi cần giải thích; họ đã chờ sẵn ở đó`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000363
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000363: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Quy chiếu binh sĩ bằng `Mọi người` / `họ`; câu 2 dùng
    ngôi thứ nhất `Tôi`; câu 3 chuyển sang ngôi thứ ba `Tanya`.'']: pov_and_voice:
    Tự sự ngôi thứ nhất chuyển sang trần thuật ngôi thứ ba ngay trước lời thoại.:
    modality_and_logic: Giữ đúng sự chuyển ngôi ở câu cuối (`Tôi sẽ báo tin tốt cho
    họ. Tanya chậm rãi cất lời.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000364
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000364: terms: [''Tiểu đoàn (Battalion)'',
    ''Chúa (God)'']: pronouns_and_address: [''Tanya gọi đơn vị là `Tiểu đoàn` và tự
    xưng `tôi`.'']: pov_and_voice: Lời tuyên bố mở đầu dứt khoát trước toàn tiểu đoàn.:
    modality_and_logic: Giữ phủ định tuyệt đối ở cả hai câu (`tôi không tin vào Chúa.
    Một chút cũng không.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000365
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000365: terms: [''Being X'', ''máy
    nghiền (shredder)'']: pronouns_and_address: [''Lời thách thức thầm trong đầu hướng
    tới Chúa dùng cặp đại từ `ta – ngươi`.'']: pov_and_voice: Độc thoại nội tâm cay
    độc của Tanya.: modality_and_logic: Giữ câu điều kiện thách thức (`Nếu ngươi thật
    sự tồn tại, hãy ban cho ta sức mạnh...`) và trình tự hành động (`nhét Being X
    qua máy nghiền rồi cho lợn ăn`).: emphasis: Khóa nhấn mạnh toàn câu `*Nếu ngươi
    thật sự tồn tại, hãy ban cho ta sức mạnh để nhét Being X qua máy nghiền rồi cho
    lợn ăn.*` theo đúng thẻ `<em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000366
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000366: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Vế đầu dùng ngôi thứ ba `Tanya`, vế sau chuyển sang ngôi
    thứ nhất `tôi`.'']: pov_and_voice: Thủ pháp tự tách góc nhìn giữa hành vi bên
    ngoài của Tanya và ý nghĩ bên trong.: modality_and_logic: Bảo toàn chính xác cấu
    trúc đối lập hai vế đổi ngôi (`Tanya không nói phần đó thành lời, nhưng tôi nghĩ
    vậy.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000367
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000367: pronouns_and_address: []:
    pov_and_voice: Câu trần thuật ngắn gọn.: modality_and_logic: Giữ phủ định sự kiện
    (`Không có chuyện gì xảy ra.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000368
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000368: terms: [''một vị thần không
    tồn tại nào đó (some nonexistent god)'', ''vị danh tướng thời xưa (great commander
    of ancient times)'']: pronouns_and_address: [''Tự sự ngôi thứ nhất dùng `Tôi`;
    quy chiếu vị danh tướng cổ đại bằng `ông ấy`; lược đại từ ngôi thứ hai khái quát
    trong câu danh ngôn quân sự.'']: pov_and_voice: Độc thoại ngôi thứ nhất của Tanya.:
    modality_and_logic: Giữ so sánh hơn về mức độ hữu dụng và lòng trung thành, cùng
    đối sánh số lượng trong câu danh ngôn (`có trăm quân trong tay còn hơn mười nghìn
    quân không có`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000369
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000369: terms: [''chiến trường
    (battlefield)'', ''bục (dais)'', ''binh sĩ (troops)'']: names_and_ranks: [''Tanya'']:
    pronouns_and_address: [''Hai câu đầu dùng ngôi thứ nhất `tôi` và quy chiếu binh
    sĩ bằng `họ`; câu thứ ba chuyển sang ngôi thứ ba `Tanya`.'']: pov_and_voice: Độc
    thoại ngôi thứ nhất chuyển sang trần thuật ngôi thứ ba khi Tanya bước lên bục.:
    modality_and_logic: Giữ câu điều kiện hiện tại về tính hiếu chiến của binh sĩ
    (`nếu tôi nới dây cương, họ sẽ lao thẳng ra chiến trường`) và mục đích lấy lại
    thanh danh ở câu cuối.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000370
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000370: terms: [''Bộ Tổng tham
    mưu (General Staff)'', ''thành trì của lý trí và trí tuệ (bastion of logic and
    wisdom)'', ''Chúa ơi (Dear God)'', ''sống có đạo đức (being ethical)'']: pronouns_and_address:
    [''Khi nói với binh sĩ: gọi `Các anh`, xưng `tôi`. Khi chuyển sang gọi trực tiếp
    `Chúa ơi`: xưng `ta`, gọi `ngươi` (đồng bộ p000365).'']: pov_and_voice: Lời diễn
    thuyết hùng hồn kết hợp lời thách thức Chúa trước toàn tiểu đoàn.: modality_and_logic:
    Giữ sự chuyển đổi đối tượng người nghe ngay trong lời thoại và quan hệ điều kiện
    – hệ quả (`nếu ngươi vĩ đại đến thế thì hãy thử sống có đạo đức xem. Rồi ta sẽ
    cho ngươi thấy trí tuệ của Bộ Tổng tham mưu còn cao hơn ngươi`).: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000371
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000371: terms: [''Bộ Tổng tham
    mưu Lục quân Đế quốc (Imperial Army General Staff)'', ''Chúa (God)'', ''ý niệm
    (idea)'', ''chuyện tưởng tượng (fantasy)'']: pronouns_and_address: [''Quy chiếu
    Chúa/kẻ tự xưng thần thánh ở câu thứ hai bằng đại từ ngôi thứ ba `hắn`.'']: pov_and_voice:
    Lập luận duy vật – thực chứng trong nội tâm của Tanya.: modality_and_logic: Giữ
    đối lập giữa thực tại (`là có thật`) và ý niệm hư cấu (`chỉ tồn tại trong ý niệm`,
    `chỉ là chuyện tưởng tượng`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000372
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000372: terms: [''đạo đức (ethics)'',
    ''pháp quyền (rule of law)'', ''những nguyên tắc phổ quát được mọi người thừa
    nhận (generally accepted universal principles)'']: pronouns_and_address: [''Dùng
    `chúng tôi` cho tân ngữ `us` (đại diện phía con người / những người tuân thủ pháp
    quyền đối lập với Chúa).'']: pov_and_voice: Lập luận triết học – pháp lý trong
    nội tâm của Tanya.: modality_and_logic: Giữ cấu trúc điều kiện cần (`Nếu muốn
    chống lại pháp quyền..., vậy thì phải cho chúng tôi thấy điều gì đó cao cả hơn`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000373
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000373: terms: [''đơn phương (unilaterally)'',
    ''khế ước chỉ có lợi cho một bên (one-sided contract)'']: pronouns_and_address:
    [''Dùng đại từ phản thân `mình` cho chủ thể tự tuyên bố tồn tại và đặt ra luật
    lệ; dùng `chúng tôi` cho tân ngữ `us` (đồng bộ p000372).'']: pov_and_voice: Lập
    luận phê phán khế ước áp đặt của thần linh.: modality_and_logic: Giữ chuỗi ba
    hành vi làm chủ ngữ (`Phớt lờ những điều ấy, đơn phương tuyên bố mình tồn tại
    rồi đặt ra luật lệ của riêng mình`) và định danh bản chất (`chẳng khác nào yêu
    cầu chúng tôi thực hiện một khế ước chỉ có lợi cho một bên`).: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000374
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000374: terms: [''Bộ Tổng tham
    mưu (General Staff)'', ''khoan thứ (shows mercy)'', ''chuộc lại (redeem ourselves)'']:
    names_and_ranks: [''Tanya'', ''Đại tá von Lergen (Colonel von Lergen)'']: pronouns_and_address:
    [''Câu 1 dùng `chúng tôi`; câu 2 chuyển sang ngôi thứ ba `Tanya` và phản thân
    `mình`; câu 4 tự hiệu chỉnh từ số nhiều `của chúng ta` sang ngôi thứ nhất số ít
    `của tôi`.'']: pov_and_voice: Độc thoại nội tâm kết hợp tự tách góc nhìn của Tanya
    về trách nhiệm chỉ huy.: modality_and_logic: Giữ sự tương phản giữa lòng khoan
    dung kín đáo của cấp trên và cảm giác giày vò về trách nhiệm cá nhân (`Đó là thất
    bại của chúng ta—nói đúng hơn, của tôi`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000375
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000375: terms: [''binh sĩ đang
    nản chí (disheartened troops)'', ''cấp quản lý trung gian (middle management)'',
    ''cấp dưới (subordinates)'']: pronouns_and_address: [''Tự sự ngôi thứ nhất dùng
    `Tôi`.'']: pov_and_voice: Độc thoại ngôi thứ nhất mang lăng kính quản lý trung
    gian của Tanya.: modality_and_logic: Giữ quan hệ mục đích – hành động (`Tôi muốn
    khắc sâu những điều ấy vào lòng đám binh sĩ đang nản chí, nên dõng dạc tuyên bố`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000376
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000376: terms: [''Các đồng đội
    của tôi (My brothers-in-arms)'', ''Bộ Tổng tham mưu (General Staff)'', ''Đế quốc
    (Empire)'', ''Bổn phận và sự tận tụy (duty and dedication)'', ''niềm vinh dự (honor)'']:
    pronouns_and_address: [''Trong lời diễn thuyết: dùng chủ ngữ phiếm chỉ `Người
    ta`, gọi binh sĩ là `Các đồng đội của tôi`, và dùng đại từ bao gộp `chúng ta`.'']:
    pov_and_voice: Lời hiệu triệu trang trọng trước toàn tiểu đoàn.: modality_and_logic:
    Giữ mệnh đề rào đón chêm giữa hai dấu gạch ngang (`—có lẽ cả Đế quốc nữa—`) và
    câu khẳng định giá trị danh dự ở cuối đoạn.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000377
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000377: terms: [''cấp trên (higher-ups)'',
    ''vô dụng (useless)'']: names_and_ranks: [''Tanya'']: pronouns_and_address: [''Trần
    thuật ngôi thứ ba lặp tên `Tanya` ở cả hai câu (tránh dùng `cô` theo DEC-P01-001);
    quy chiếu tiểu đoàn bằng `họ`.'']: pov_and_voice: Trần thuật ngôi thứ ba phản
    ánh nhận định thực tế của Tanya.: modality_and_logic: Giữ sự đối lập giữa lời
    khích lệ bên ngoài (p000376) với nhận thức thực tế (`Dĩ nhiên, Tanya vốn tin chắc
    cấp trên đã thất vọng về họ`) và giả định quá khứ trái thực tế (`Nếu họ đã bị
    coi là vô dụng, Tanya cũng chẳng thể làm gì`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000378
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000378: terms: [''ngành sản xuất
    (manufacturing)'', ''lỗi kiểm kê hàng tồn (inventory management error)'', ''đi
    gặp khách hàng (going out on a business call)'', ''cuộc họp (meeting)'']: pronouns_and_address:
    [''Chủ thể giả định là `một người làm trong ngành sản xuất`.'']: pov_and_voice:
    Liên tưởng ẩn dụ công sở trong nội tâm của Tanya.: modality_and_logic: Giữ cấu
    trúc câu hỏi giả định ở câu 1 và phủ định giá trị bù đắp ở câu 2 (`Cuộc họp có
    diễn ra tốt đẹp đến đâu cũng chẳng quan trọng`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000379
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000379: terms: [''lời quở trách
    (castigation)'', ''sự bất tài (incompetence)'']: pronouns_and_address: [''Quy
    chiếu nhân vật giả định từ p000378 bằng `Anh ta` và đại từ phản thân `mình`.'']:
    pov_and_voice: Tiếp nối liên tưởng công sở trong nội tâm của Tanya.: modality_and_logic:
    Giữ hệ quả tất yếu trong tình huống giả định (`Anh ta sẽ phải chịu lời quở trách
    vì sự bất tài của mình`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000380
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000380: terms: [''Quân đội (the
    army)'', ''chuộc lại sai lầm (atone for our mistake)'']: pronouns_and_address:
    [''Trong lời diễn thuyết trước tiểu đoàn: dùng đại từ bao gộp `chúng ta` / `Chúng
    ta`.'']: pov_and_voice: Lời kết đoạn diễn thuyết khích lệ tiểu đoàn của Tanya.:
    modality_and_logic: Giữ khẳng định về ý chí của quân đội và cơ hội chuộc lỗi đã
    được trao.: emphasis: Không dùng `*...*`.'
  non_canon: true
