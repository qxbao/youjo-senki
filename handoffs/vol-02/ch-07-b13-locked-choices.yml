choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000325
  kind: locked_constraint
  value: Giữ danh xưng “chỉ huy” theo DEC-P01-001 (nối mạch điểm nhìn của Weiss từ
    cuối b12), hình ảnh ẩn dụ “cái mũi đánh hơi của cấp trên mình” và nhận định “Đã
    có chuyện gì đó dẫn đến sự thay đổi này”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000326
  kind: locked_constraint
  value: Giữ danh xưng “chỉ huy”, thuật ngữ “pháp sư” và cụm trích dẫn trong ngoặc
    kép “dù chỉ để cho đủ quân số”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000327
  kind: locked_constraint
  value: Giữ chủ thể “Weiss” (quy chiếu bằng “anh”), chi tiết luôn để mắt trông chừng
    nhóm lính mới của đơn vị và ấn tượng tích cực rằng “Thiếu úy Grantz sẽ trở thành
    một sĩ quan cừ khôi”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000328
  kind: locked_constraint
  value: Giữ quan hệ nhượng bộ phủ định “ngay cả khi Thiếu tá von Degurechaff không
    hề ca thán lời nào”, chủ thể “anh” (Weiss), đối tượng “đám tân binh” và kết luận
    “Đó là cách anh thể hiện sự tử tế của mình”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000329
  kind: locked_constraint
  value: Giữ định danh “Thiếu tướng von Rudersdorf”, cơ quan “Bộ Tổng tham mưu”, đối
    sánh cùng mức ngân sách và nguyên liệu như ngoài “tiền tuyến”, cùng lý do phủ
    định “sẽ chẳng hay ho gì nếu binh lính từ chiến trường trở về lại đâm ra ghen
    tị với đồ ăn ở hậu phương”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000330
  kind: locked_constraint
  value: Giữ đại từ trần thuật “Ông”, chi tiết uống chút nước để nuốt trôi miếng “bánh
    mì K-Brot khô khốc”, câu hỏi tự vấn liệu đồ ăn ngoài tiền tuyến có khá hơn không,
    và bọc dấu nhấn mạnh `*...*` đúng ở mệnh đề nội tâm `*Mình nghi là cái ủy ban
    lương thực nghĩ ra món này thậm chí còn chẳng tự ăn thử lấy một miếng*` theo DEC-P01-002
    với đại từ “Mình” và thuật ngữ “ủy ban lương thực”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000331
  kind: locked_constraint
  value: Giữ đúng hai phạm vi nhấn mạnh chữ nghiêng ở đầu và cuối đoạn theo DEC-P01-002
    (`*Hiểu tính bọn họ... Chắc chắn là vậy rồi.*` và `*Ai lại nghĩ đến chuyện sản
    xuất hàng loạt cái thứ này chứ?*`), phủ định tuyệt đối “chẳng có lấy một người
    mảy may để tâm đến yếu tố then chốt là mùi vị”, và câu trần thuật không in nghiêng
    ở giữa đoạn với chủ thể “Ông”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000332
  kind: locked_constraint
  value: Giữ sự tương phản với “Zettour” ngồi đối diện cam chịu ăn ổ bánh mì với gương
    mặt tỉnh bơ, và bọc dấu nhấn mạnh `*...*` đúng ở mệnh đề nội tâm `*Có lẽ sự cam
    chịu là thứ gia vị tuyệt nhất cho món này*` theo DEC-P01-002 cùng chủ thể “Rudersdorf”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000333
  kind: locked_constraint
  value: Giữ mức độ “gần như đúng hệt lịch trình”, đại từ “Họ” và thuật ngữ chiến
    lược “mở đường thoát về phía trước”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000334
  kind: locked_constraint
  value: Giữ định danh “Chiến dịch *Schrecken und Ehrfurcht* (“Kinh hoàng và Khiếp
    sợ”)” với dấu nhấn mạnh `*...*` chỉ bọc cụm tiếng Đức theo DEC-P01-002, phần dịch
    nghĩa trong ngoặc đơn kèm ngoặc kép và mốc thời gian “chỉ còn cách thời điểm mở
    màn vài giây ngắn ngủi”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000335
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Không ngừng tiến bước.
    Chúng ta không còn lựa chọn nào khác ngoài việc tiến lên.*` theo DEC-P01-002 và
    cấu trúc phủ định ngoại trừ “không còn lựa chọn nào khác ngoài việc tiến lên”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000336
  kind: locked_constraint
  value: Giữ nguyên dấu ngoặc kép hội thoại, đại từ “Chúng ta” / “tôi” / “mình” và
    so sánh hơn “đang hồi hộp hơn mình tưởng”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000337
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp đại từ “Tôi – ông”, tên riêng “Zettour”
    và các phủ định “Không ngờ ông lại nói câu đó”, “chẳng bao giờ biết đến chuyện
    căng thẳng thần kinh”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000338
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp đại từ “Tôi – ông” và dấu nhấn mạnh chữ
    nghiêng chỉ đặt ở đại từ `*ông*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000339
  kind: locked_constraint
  value: Giữ chủ thể “Hai người” và mốc thời gian gắn bó “từ thời còn học ở trường
    quân sự”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000340
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở từ mở đầu `*Nhưng…*` theo DEC-P01-002,
    chủ thể “Rudersdorf” và cấu trúc phủ định kép “không ngại thừa nhận rằng mình
    đang lo âu”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000341
  kind: locked_constraint
  value: Giữ danh từ “Tổ quốc”, thuật ngữ “cánh cửa xoay”, hai mệnh đề điều kiện phủ
    định “Nếu cánh cửa xoay không vận hành như kế hoạch, nếu họ không chặt đứt được
    đầu não của quân địch…” và hệ quả “họ sẽ bị đẩy ngược về vạch xuất phát”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000342
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở cụm từ mở đầu `*Dẫu vậy*` theo DEC-P01-002
    và vế trần thuật “ông nghĩ”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000343
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Lối thoát duy nhất khỏi
    tình cảnh này cho Đế quốc là tiếp tục tiến về phía trước.*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000344
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Chúng ta buộc phải tiến
    lên.*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000345
  kind: locked_constraint
  value: Giữ câu trần thuật không in nghiêng, đại từ “họ” và thuật ngữ “mở đường thoát
    về phía trước”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000346
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Tiến lên. Tiến xa hơn
    nữa.*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000347
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Chúng ta sẽ mở đường cho
    Tổ quốc. Chúng ta sẽ đập tan mọi thứ ngáng đường. Ôi, chúng ta thề sẽ kiến tạo
    tương lai cho Tổ quốc mình.*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000348
  kind: locked_constraint
  value: Giữ cặp dấu ngoặc kép kép `““...””` biểu thị lời hô đồng thanh của hai vị
    tướng và danh từ “Đế quốc”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000349
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, định danh “Thiếu tá von Degurechaff” và mốc
    giờ quân sự “1700 giờ”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000350
  kind: locked_constraint
  value: Giữ thuật ngữ “mật lệnh niêm phong”, “sĩ quan phụ tá”, hành động đồng bộ
    đồng hồ và chủ thể “Tanya” trang nghiêm thông báo giờ giấc.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000351
  kind: locked_constraint
  value: Giữ câu thoại xác nhận trong ngoặc kép, định danh “Trung úy Weiss” và chức
    danh “vị phó chỉ huy của Tanya” làm chứng.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000352
  kind: locked_constraint
  value: Giữ điều kiện “chắc chắn toàn bộ sĩ quan có mặt đã sẵn sàng ghi nhận nội
    dung”, phủ định “mà không có chỗ cho bất kỳ sự hiểu lầm nào” và hành động “Tanya
    gật đầu và rút con dao bên hông ra”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000353
  kind: locked_constraint
  value: Giữ nguyên dấu ngoặc kép hội thoại và mệnh lệnh ngắn “Được rồi. Mở ra thôi.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000354
  kind: locked_constraint
  value: Giữ sự chuyển đổi đại từ theo DEC-P01-001 từ câu trần thuật mở đầu (“Nó”)
    sang nhận xét nội tâm ngôi thứ nhất (“mình”), tình thái suy đoán “có lẽ”, cùng
    các thuật ngữ “giấy dầu siêu dễ cháy”, “hình mờ của Bộ Tổng tham mưu” và “mực
    gốc nước”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000355
  kind: locked_constraint
  value: Giữ đại từ nội tâm “mình” theo DEC-P01-001 và ý lật xem lướt qua xấp văn
    kiện bằng con mắt thành thạo để nắm đại ý.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000356
  kind: locked_constraint
  value: Giữ dấu ba chấm mở đầu đoạn, đại từ “chúng ta”, điều kiện phủ định “nếu không
    thể cưỡng ép mở ra một con đường” và lựa chọn thay thế duy nhất là tập hợp thêm
    sức mạnh để tìm cách đột phá.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000357
  kind: locked_constraint
  value: Giữ tình thái suy luận “Hẳn đó là lý do vì sao”, định danh “bộ phận Hậu cần
    và Cục Tác chiến thuộc Bộ Tổng tham mưu Lục quân Đế quốc” và nhận xét “một giải
    pháp khá khác thường”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000358
  kind: locked_constraint
  value: Giữ cấu trúc nhấn mạnh chủ thể “Ngay cả mình”, đại từ “chúng ta” và thuật
    ngữ “mở đường thoát về phía trước”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000359
  kind: locked_constraint
  value: Giữ cụm chuyển ý ngắn kèm dấu ba chấm “Vậy nên…”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000360
  kind: locked_constraint
  value: Giữ điều kiện phủ định ngoại trừ “Nếu không còn việc gì khác để làm ngoài
    tiến lên”, đại từ “chúng ta” và phủ định “mà không mảy may nghĩ đến chuyện dừng
    lại”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000361
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại và hai mệnh lệnh phân công trực tiếp cho “Trung
    úy Serebryakov” (tập hợp quân) và “Trung úy Weiss” (xem qua tài liệu).
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000362
  kind: locked_constraint
  value: Giữ chủ thể “Tanya”, thuật ngữ “sĩ quan phụ tá”, “tiểu đoàn”, “vị phó chỉ
    huy” và trình tự ba hành động chuẩn bị cho cuộc tấn công.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000363
  kind: locked_constraint
  value: Giữ đại từ trần thuật “nó” theo DEC-P01-001 và nhận định lời dặn dò ngắn
    gọn dành cho các sĩ quan vẫn giống như mọi khi.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000364
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, hiệu lệnh “Các sĩ quan, chú ý” và mệnh lệnh
    “Chỉ có tiến bước không nao núng. Hãy tiến về phía trước, rồi tiếp tục tiến sâu
    hơn nữa.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000365
  kind: locked_constraint
  value: Giữ câu phủ định “Không, việc dừng lại sẽ không được phép.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000366
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cụm “một cuộc tiến quân bất khuất” và lời cảnh
    báo phủ định “Bất kỳ kẻ nào chùn bước sẽ không được phép sống.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000367
  kind: locked_constraint
  value: Giữ đại từ “chúng ta”, cụm “cơ hội đầu tiên và cũng là cuối cùng” và tình
    thái bắt buộc “buộc phải xuyên thủng qua”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000368
  kind: locked_constraint
  value: Giữ câu ngắn “Chỉ có tiến lên phía trước.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000369
  kind: locked_constraint
  value: Giữ câu ngắn kết mạch “Tiến xa hơn nữa.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0032.xhtml/p000370
  kind: locked_constraint
  value: 'Giữ nguyên dấu ngoặc đơn bao quanh dòng kết tập “(Ấu Nữ Chiến Ký, Tập 2:
    Plus Ultra, Hết)”.'
  non_canon: true
