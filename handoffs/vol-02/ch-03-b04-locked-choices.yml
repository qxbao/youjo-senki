unit_count: 20
segment_id_start: YS-LN02/Text/part0016.xhtml/p000080
segment_id_end: YS-LN02/Text/part0016.xhtml/p000099
choices:
- segment_id: YS-LN02/Text/part0016.xhtml/p000080
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000080: locks: [''Giữ đại từ nội
    tâm `mình` theo `DEC-P01-001`, định danh `Quân đội Đế quốc`, các thuật ngữ `bất
    lợi về chiến thuật`, `các chỉ huy`, `vật tư`, `kho bị thiêu rụi`, cấu trúc giả
    định ở hai câu đầu, và hai câu kết `Kết luận mình rút ra rất đơn giản: chưa rõ
    Quân đội Đế quốc có đủ vật tư để cầm cự qua mùa đông hay không. Vật tư thì có,
    nhưng phải được quản lý thật cẩn thận.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000081
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000081: locks: [''Giữ đại từ `ông
    ấy` (chỉ Rudersdorf), đại từ nội tâm `mình` theo `DEC-P01-001`, và các thuật ngữ
    `tổ chức lại phòng tuyến`, `cuộc đổ bộ đường không vào địch`, `những đợt tập kích
    quấy phá`, `tác chiến đường không`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000082
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000082: locks: [''Giữ cụm tự chú
    giải nội tâm `Tanya (tức là mình)` và đại từ trần thuật ngôi thứ ba `nó` cùng
    phản thân `đơn vị mình` theo `DEC-P01-001`, kết hợp các thuật ngữ `tâm lý con
    người bình thường`, `cuộc đổ bộ đường không`, và `chiến dịch tấn công mùa xuân`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000083
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000083: locks: [''Giữ đại từ nội
    tâm `mình` ở cả hai vế theo `DEC-P01-001`, cụm `cảnh báo về nguy cơ trong khâu
    chuẩn bị vật tư cho mùa đông`, và mệnh đề `nhắm đến việc kết thúc chiến tranh
    nhanh chóng là một canh bạc quá lớn.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000084
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000084: locks: [''Giữ định danh
    `Tướng Jekof von Schreise`, chức vụ `tham mưu trưởng Cụm tập đoàn quân phương
    Bắc` (theo `vol02-ch02-b07-northern-army-group`), đại từ trần thuật `ông`, và
    toàn văn hai câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000085
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000085: locks: [''Giữ các danh
    xưng `Tướng von Schreise`, `Quân đội Đế quốc`, `Đại Quân` (theo `vol02-ch02-b07-great-army`),
    `Đế quốc`, `Liên minh Entente`, đại từ `Ông`, cùng các cụm `cựu binh đã từng bước
    thăng tiến trong hệ thống trọng dụng nhân tài`, `lực lượng chủ lực`, và `pháp
    sư của Đế quốc ít hơn đối phương tại khu vực này`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000086
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000086: locks: [''Giữ đại từ trần
    thuật `ông` / `Ông`, đại từ phản thân `mình`, các cụm `các căn cứ tiếp tế cho
    tiền tuyến, kể cả những kho nhỏ, bị đốt phá là cái gai trong mắt mình`, `khiến
    một số pháp sư địch đổ máu, các cuộc tập kích hẳn sẽ chấm dứt`, và câu phủ định
    kép cuối đoạn `Không, không phải ông chưa nhận ra những vấn đề đó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000087
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000087: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff`, `Trung ương` (theo `vol02-ch02-b05-northern-central-command`),
    và toàn văn `Nhưng bị Thiếu tá von Degurechaff từ Trung ương phái đến chỉ ra điều
    đó với vẻ đắc ý lại là chuyện khác.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000088
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000088: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff`, cụm `Một sĩ quan Hậu cần`, các đại từ `tôi`, `Cô`,
    và câu hỏi `“Cô đang tính cố thủ rồi chờ qua mùa đông sao?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000089
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000089: locks: [''Giữ đại từ trần
    thuật điểm nhìn bên ngoài `cô` (đồng bộ với `vol02-ch03-b05-tanya-external-pov`),
    đại từ ngôi thứ nhất số nhiều `chúng ta` / `Chúng ta`, và các thuật ngữ `các tuyến
    tiếp tế`, `vật tư quân sự và binh sĩ`, `một cuộc tấn công vô ích`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000090
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000090: locks: [''Giữ tên riêng
    `Schreise`, các cụm `các nhân viên Hậu cần và Tác chiến`, `phía Hậu cần` (theo
    `vol02-ch03-b04-logistics-operations-staff`), đại từ `cô` (chỉ Tanya từ điểm nhìn
    Schreise), và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000091
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000091: locks: [''Giữ các cụm `ngay
    cả binh nhì thấp kém nhất cũng biết vật tư không đủ`, `quyền tiếp cận tài liệu
    mật`, và toàn văn câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000092
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000092: locks: [''Giữ các danh
    xưng `ban Hậu cần`, `Trung ương`, `Degurechaff`, `Rudersdorf`, `Tanya`, các đại
    từ `họ` / `Họ`, phản thân `mình`, `ông ta` (chỉ Rudersdorf), thuật ngữ `vật tư
    quân sự`, và câu kết `Nếu Rudersdorf biết điều đó và để Tanya lên tiếng vì lý
    do ấy thì ông ta quả là một kẻ cáo già.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000093
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000093: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng một từ `*vẫn*` theo `DEC-P01-002`, các định danh `các
    nhân viên Tác chiến`, `phía Hậu cần`, `các cụm tập đoàn quân khác`, `Dacia`, `Cụm
    tập đoàn quân phương Bắc`, và đại từ `họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000094: locks: [''Giữ danh xưng
    `Thiếu tá von Degurechaff`, đại từ `chúng ta`, và toàn văn câu thoại `“Thiếu tá
    von Degurechaff, nếu làm vậy thì chúng ta sẽ mất thời gian.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000095: locks: [''Giữ nguyên câu
    cảm thán nghi vấn `“Hả?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000096
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000096: locks: [''Giữ nguyên câu
    trần thuật `Quanh bàn có đủ kiểu biểu cảm, nhưng nhìn chung mọi người đều chờ
    xem chuyện gì sẽ xảy ra.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000097
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000097: locks: [''Giữ các cụm `các
    nhân viên Tác chiến`, `Schreise`, `ý định của cấp trên`, và toàn văn câu.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000098
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000098: locks: [''Giữ tên riêng
    `Schreise`, đại từ phản thân `mình`, đại từ `Chúng ta` trong thoại, và ba mệnh
    đề phủ định liên tiếp `“Sắp sang năm mới rồi. Chúng ta không muốn một cuộc chiến
    kéo dài. Chúng ta cũng không muốn làm cạn kiệt vật tư, mà cũng không thể tiếp
    tục giữ quân ở đây.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0016.xhtml/p000099
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0016.xhtml/p000099: locks: [''Giữ các định
    danh `Phía Tác chiến`, `lực lượng phương Bắc`, `Chỉ huy Ragheno thuộc Cụm tập
    đoàn quân phương Bắc` (theo `vol02-ch03-b04-commander-ragheno`), `Schreise`, `Cục
    Tác chiến` (theo `vol02-ch03-b04-logistics-operations-staff`), `Bộ chỉ huy tối
    cao` (ghi nhận phương án ledger `bộ chỉ huy cấp cao` tại `vol02-ch03-b04-high-command`),
    `Rudersdorf`, cùng các đại từ `ông`, `kẻ ...`, `người này`.'']'
  non_canon: true
