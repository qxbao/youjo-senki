choices:
- segment_id: YS-LN02/Text/part0008.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000001: locks: [''Giữ danh xưng
    `Thiếu tá chỉ huy tiểu đoàn von Degurechaff` và cụm `tình hình trên không`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000002: locks: [''Giữ các cụm `điện
    báo viên ở Bộ chỉ huy`, `không có thông tin về lực lượng không quân địch, cũng
    chẳng phát hiện máy bay nào`, tên riêng `Tanya` trong trần thuật và câu hỏi gián
    tiếp về liên lạc.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000003: locks: [''Giữ tên riêng
    `Tanya`, cặp thuật ngữ `cả liên lạc hữu tuyến lẫn vô tuyến` và cụm `kênh liên
    lạc của FAC Dacia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000004: locks: [''Giữ các danh
    xưng `Bộ chỉ huy`, `Thiếu tá von Degurechaff` và câu hỏi tu từ `một nụ cười ngây
    ngất ư?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000005: locks: [''Giữ cấu trúc
    giả định phản thực tế ở quá khứ `nếu Lergen đã trông thấy vẻ mặt đó, có lẽ anh
    cũng đã mỉm cười y hệt`, đại từ `anh` quy chiếu Lergen và hình ảnh ẩn dụ `thợ
    săn hung tợn` / `con sói đói đang nhìn con mồi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000006: locks: [''Giữ tên riêng
    `Tanya` trong trần thuật, đại từ phản thân `mình`, và phạm vi nhấn mạnh Markdown
    `*xúc động dâng trào*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000007: locks: [''Giữ câu hỏi nội
    tâm `Một chiến trường hoàn toàn không có lực lượng yểm trợ trên không của địch
    ư?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000008: locks: [''Giữ câu cảm thán
    và đúng phạm vi nhấn mạnh Markdown `*hoàn toàn không có lực lượng yểm trợ trên
    không của địch*` theo DEC-P01-002.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000009: locks: [''Giữ cụm `ưu thế
    tương đối trên không cho Đế quốc ở Norden và Rhine`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000010: locks: [''Giữ các cụm `Dacia
    hoàn toàn không có lực lượng không quân địch`, `chiến tranh hiện đại` và `ưu thế
    tuyệt đối được bảo đảm`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000011: locks: [''Giữ đại từ nội
    tâm `mình` theo DEC-P01-001 và danh xưng `quân đội Công quốc Dacia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000012: locks: [''Giữ đại từ nội
    tâm `mình` ở cả hai câu và cặp đối lập `đánh giá thấp địch` – `đánh giá chúng
    quá cao`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000013: locks: [''Giữ hình ảnh
    `trời cao` và đại từ ngôi thứ nhất số nhiều `chúng ta` trong độc thoại nội tâm.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000014: locks: [''Giữ nguyên sắc
    thái giới hạn `Ngày 24 tháng Chín chỉ là sinh nhật của Tanya trên giấy tờ.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000015: locks: [''Giữ tên riêng
    `Tanya` ở các câu trần thuật, giữ điểm nhìn độc thoại nội tâm ngôi thứ nhất `mình`
    kèm sắc thái khả năng `dường như sẽ ... có thể nhảy chân sáo` ở câu thứ hai, và
    giữ lời thì thầm trung tính `“Thượng đế ơi, cảm ơn vì cơ hội một phần triệu này.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000016: locks: [''Giữ tên riêng
    `Tanya` trong trần thuật, sắc thái giả định phủ định `còn chẳng nghĩ đến chuyện
    hé môi thốt ra lời như vậy` và danh xưng `Bộ chỉ huy này`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000017: locks: [''Giữ cụm `Thiết
    lập ưu thế tuyệt đối trên không…` và tên riêng `Tanya`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000018: locks: [''Giữ danh xưng
    `Trung tá von Lergen`, đại từ `anh` và con số `sáu trăm nghìn quân Dacia đã vượt
    biên giới`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000019: locks: [''Giữ đại từ `anh`
    quy chiếu Lergen, tên riêng `Tanya`, các cụm `lệnh triển khai của đơn vị`, `buổi
    báo cáo` và `Bộ chỉ huy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0008.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0008.xhtml/p000020: locks: [''Giữ các danh
    xưng và thuật ngữ `Tiểu đoàn Pháp sư Không quân 203`, `dãy Alpen`, `Tanya`, `“Kinh
    nghiệm chiến đấu.”`, `tinh thần đồng đội`, `phép thử bằng lửa đạn` và `thao trường`.'']'
  non_canon: true
