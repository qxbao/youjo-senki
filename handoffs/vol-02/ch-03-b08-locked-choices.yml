segment_id_end: YS-LN02/Text/part0018.xhtml/p000031
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000001: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, thuật ngữ `sĩ quan tham
    mưu`, đại từ `cô` ở cả hai câu theo bản sửa followup đã signoff, và toàn văn câu
    độc thoại nội tâm của Rudersdorf.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000002: locks: [''Giữ các đại từ
    `cô`, `mình` theo bản sửa followup đã signoff và cụm `một lời ám chỉ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000003: locks: [''Giữ tên riêng
    `Zettour`, danh xưng `Thiếu tá`, các đại từ `cô`, `ta`, và lời thoại `“Vậy ra
    đây là lý do Zettour đánh giá cô cao đến thế, Thiếu tá. Tuyệt lắm. Giờ ta vào
    việc thôi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000004: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, tên riêng `Zettour`, và
    các thuật ngữ `một pháp sư vừa để tâm đến chiến lược, vừa là một tiểu đoàn trưởng
    xuất sắc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000005: locks: [''Giữ danh xưng
    `Thiếu tá`, đại từ `cô`, các thuật ngữ `cuộc tấn công`, `đòn nghi binh`, và câu
    hỏi giả định của Rudersdorf.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000006: locks: [''Giữ kính ngữ
    `ngài`, các thuật ngữ `đòn hỗ trợ`, `mồi nhử`, `đòn chủ lực`, và câu hỏi ngược
    lại của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000007: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các đại từ `Cô` / `cô`,
    `tôi` theo bản sửa followup đã signoff, và các danh xưng `sĩ quan tham mưu`, `chỉ
    huy`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000008: locks: [''Giữ thuật ngữ
    `các mặt trận` và câu mệnh lệnh `“Hãy đánh giá ảnh hưởng của nó trên các mặt trận
    khác nhau.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000009: locks: [''Giữ các định
    danh `Cộng hòa`, `các nước hậu thuẫn họ`, `Norden`, đại từ `họ`, các thuật ngữ
    `cuộc giao tranh`, `chiến dịch thực sự`, `tuyến tiếp tế`, và câu bỏ lửng `Không,
    tuyến tiếp tế không thể nào…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000010: locks: [''Giữ đại từ `cô`,
    các cụm đã khóa trong handoff `sự điềm tĩnh nhạy bén` (`calm_sensibility`) và
    `luôn được chào đón` (`welcome`), cùng các định danh `sĩ quan tham mưu`, `Quân
    đội Đế quốc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000011: locks: [''Giữ đại từ `ta`,
    cụm `ghìm chân quân tiếp viện của địch` và toàn văn câu gợi mở của Rudersdorf.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000012: locks: [''Giữ cách mở đầu
    lễ phép đã khóa trong handoff `“Xin phép nói thẳng, thưa ngài…` (`polite_disagreement`),
    đại từ `Tôi`, và các thuật ngữ/địa danh `cuộc tấn công`, `ghìm chân quân tiếp
    viện của địch`, `các mặt trận khác`, `mặt trận Rhine`, `đòn nghi binh`, `mục tiêu
    chiến lược`, `Norden`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000013: locks: [''Giữ các định
    danh `Cụm tập đoàn quân phương Bắc`, `Norden`, `Rudersdorf`, thuật ngữ `đòn nghi
    binh`, các đại từ `họ`, `cô`, và đúng phạm vi nhấn mạnh in nghiêng ở từ `*Ấn tượng
    đấy*` theo `DEC-P01-002`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000014: locks: [''Giữ câu thoại
    ngắn `“Ừm, nói tiếp đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000015: locks: [''Giữ kính ngữ
    `ngài`, các đại từ `Tôi`, `ta`, và các thuật ngữ đã khóa trong handoff `phòng
    tuyến địch`, `đột kích đường không` (`airborne_vs_amphibious`), `đòn nghi binh`,
    `Phía sau? Là hậu phương ư?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000016: locks: [''Giữ tên riêng
    `Rudersdorf`, `Tanya`, các đại từ `Cô`, `mình`, và toàn văn đoạn trần thuật.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000017: locks: [''Giữ danh xưng
    `Thiếu tá` và câu hỏi `“Có chuyện gì vậy, Thiếu tá?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000018: locks: [''Giữ tên riêng
    `Rudersdorf`, `Tanya` và câu trần thuật `Để câu hỏi của Rudersdorf trôi tuột khỏi
    rìa ý thức, Tanya chắp nối những mảnh ký ức vừa tóm được.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000019: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm tự quy chiếu
    `Mình` / `mình` theo `DEC-P01-001`, câu tự nhắc đã khóa trong handoff `Nhớ lại
    đi.` (`memory`), và các thuật ngữ `Ghìm chân quân địch ở tiền tuyến. Nghi binh.
    Đánh vào hậu phương.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000020: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm tự quy chiếu
    `Mình` / `mình` theo `DEC-P01-001`, và tình thái giả định quá khứ `Không, có thể
    mình đã nghe hoặc đọc nó.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000021: locks: [''Giữ lời lẩm bẩm
    `“Phía sau, đằng sau… Tiếp tế ư? Phải rồi, tiếp tế của chúng. Cắt đứt nó sao?”`,
    tên riêng `Rudersdorf`, và đại từ `cô` / `Cô`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000022: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002` và cụm đã khóa trong handoff
    `một cú đá từ phía sau thật sảng khoái` (`rear_kick`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000023: locks: [''Giữ đại từ `cô`
    và câu `Đột nhiên, một từ hiện lên trong tâm trí cô.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000024: locks: [''Giữ địa danh
    lịch sử `Inchon`, đúng phạm vi nhấn mạnh in nghiêng ở cụm `*Phải rồi*` theo `DEC-P01-002`,
    và toàn văn `Inchon ư? *Phải rồi*, Inchon.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000025: locks: [''Giữ tên riêng
    `MacArthur`, địa danh `Inchon`, đại từ `Họ`, `mình`, và các cụm đã khóa trong
    handoff `Cú đá đít bọn cộng sản khoái trá đến tột độ ấy`, `cuộc bao vây quy mô
    lớn`, `cắt đứt quân địch từ phía sau` (`supply_line`), `đòn quyết định`, `quân
    đội Bắc Triều Tiên` (`North_Korean_army`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000026: locks: [''Giữ các thuật
    ngữ `chủ nghĩa tư bản`, `chủ nghĩa cộng sản tà ác` và toàn văn câu cảm thán.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000027: locks: [''Giữ kính ngữ
    `Thưa ngài`, các thuật ngữ `lực lượng chủ lực của địch`, `tiền tuyến`, `chiến
    dịch trên bộ`, `hậu phương`, và cụm đã khóa trong handoff `kết thúc chuyện này`
    (`finish_this`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000028: locks: [''Giữ tên riêng
    `Rudersdorf`, đại từ `cô`, và toàn văn câu miêu tả thần thái của Tanya.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000029: locks: [''Giữ định danh
    `trận Inchon`, đại từ `cô`, `mình`, cụm đã khóa trong handoff `chiến lược đầy
    phấn khích, đáng ngưỡng mộ—đá đít lũ cộng sản ngu ngốc từ phía sau—` (`strategy`),
    và các thuật ngữ `kẻ thù không phải cộng sản`, `bao vây hoàn toàn quân địch`,
    `hậu cần`, `kiểm soát tuyệt đối mặt biển`, `lực lượng chủ lực của địch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000030: locks: [''Giữ các thuật
    ngữ đã khóa trong handoff `chiến dịch đổ bộ quy mô lớn` / `chiến dịch đổ bộ` (`airborne_vs_amphibious`),
    `hậu phương`, `bao vây`, `tuyến tiếp tế của chúng`, `cuộc tấn công`, `đòn nghi
    binh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000031: locks: [''Giữ tên riêng
    `Tanya`, đại từ `cô`, và câu kết `Với Tanya, tất cả những gì cô làm chỉ là nhớ
    lại một sự kiện lịch sử, nên cô quên mất rằng ở thế giới này, nó mới chỉ là một
    ý tưởng, chưa trở thành lịch sử.`.'']'
  non_canon: true
