task_id: vol-02-ch-04-b04
baseline_sha256: 3a940bbfceecb988252e515a087d6d4360d8b568c9188bdcbb3bec3a5b459b2b
source_sha256: 3ac53161b6e093ba07203f284a400049cf902a3b0f51c0d3e40200867c13ae0a
source_package_sha256: a247d7ac0e287720dee7460e89a4f36e6f403d79c83632574de89c8979310240
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 33
segment_id_start: YS-LN02/Text/part0022.xhtml/p000063
segment_id_end: YS-LN02/Text/part0022.xhtml/p000095
choices:
- segment_id: YS-LN02/Text/part0022.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000063: locks: [''Giữ đại từ `ông
    ấy` (chỉ người phục vụ), tên riêng `Tanya`, các phủ định `Không phải lỗi của ông
    ấy khi tin xấu đến thế.` và `Tanya không thích điều đó`, cùng mệnh đề nguyên tắc
    `nhưng dịch vụ thì phải được trả công.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000064: locks: [''Giữ câu hỏi xã
    giao `“Ồ. Tin tốt chứ, Thiếu tá von Degurechaff?”` và danh xưng cấp bậc – họ `Thiếu
    tá von Degurechaff`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000065: locks: [''Giữ đại từ độc
    thoại nội tâm `Mình` / `mình` theo `DEC-P01-001`, các phủ định `Mình không khỏi
    nghĩ đó là hành vi cảm tính, phi lý nên mình không làm vậy…` và `vốn chưa nghe
    được tin`, cùng cụm đã sửa theo N1 `những người địa phương này` và `tưởng rằng
    đó là tin tốt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000066: locks: [''Giữ tình thái
    phỏng đoán `Có lẽ mình nên mỉm cười rồi lịch sự đáp lời mấy quý ông này`, đại
    từ nội tâm `mình`, và mệnh đề phủ định `nhưng mình không chắc mình làm nổi.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000067: locks: [''Giữ đại từ trần
    thuật `nó` theo `DEC-P01-001`, hành động `nó cau mày vụng về rồi lắc đầu.`, và
    câu đáp phủ định lịch sự `“Không, thưa ông. Tiếc là có vẻ không phải tin tốt.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000068: locks: [''Giữ câu cảm thán
    bỏ lửng `“Ôi! Vậy thì…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000069: locks: [''Giữ nhận xét
    `Người đàn ông với vẻ mặt hết sức cảm thông ấy quả là người tốt.`, đại từ `họ`,
    và cụm phủ định `thiện ý của những người không phải ra chiến trường.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000070: locks: [''Giữ cụm `Với
    người sắp bị đưa vào trận tập kích`, nhận xét `chuyện này thật khó xử`, và thái
    độ chấp nhận thực tế `nhưng đành chịu vậy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000071
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000071: locks: [''Giữ đại từ nội
    tâm `mình`, nhận định `Phép lịch sự là một trong những công cụ căn bản nhất để
    hạn chế sai sót.`, và cặp thuật ngữ triết học – xã hội học `động vật chính trị`
    / `động vật xã hội`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000072
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000072: locks: [''Giữ lời cáo từ
    lịch sự của Tanya `“Xin thứ lỗi, nhưng tôi có lệnh. Tôi phải rời đi sớm.”` và
    đại từ tự xưng `tôi` / `Tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000073: locks: [''Giữ dấu chấm
    lửng mở đầu và lời chúc chia tay `“…Chúc cô thượng lộ bình an, Thiếu tá.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000074
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000074: locks: [''Giữ câu hỏi nội
    tâm đã sửa theo M1 và được nghiệm thu (`Liệu mình có thể chắc rằng không ai trong
    số họ đang thầm mừng vì người gặp chuyện không phải là họ không?`), phân biệt
    tuyệt đối đại từ tự quy chiếu `mình` (Tanya) với đại từ `họ` (những người ở lại),
    cùng câu trần thuật ngôi thứ ba dùng tên riêng `Tanya` (`Tanya cho rằng đó chỉ
    là nghi ngờ vô căn cứ, bèn nở nụ cười lịch sự, nuốt những ý nghĩ cay đắng rồi
    đứng dậy.`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000075: locks: [''Giữ lời chào
    từ biệt lịch sự `“Cảm ơn ông. Mong ông bỏ qua cho sự thất lễ của tôi. Xin phép.”`
    và cặp đại từ `tôi` – `ông`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000076
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000076: locks: [''Giữ sự chuyển
    đổi điểm nhìn từ trần thuật ngôi thứ ba dùng `nó` (`nó nhận áo khoác ngoài từ
    người phục vụ và thanh toán. Bộ quân phục khiến nó trông rất chỉnh tề. Chiếc áo
    khoác ngoài được thiết kế để tiện dụng nên khá dày dặn.`) sang độc thoại nội tâm
    ngôi thứ nhất dùng `mình` (`Không hiểu sao chuyện đó khiến mình bận tâm, nhưng
    quân đội đôi khi lại phi lý theo những cách kỳ quặc nhất.`) theo `DEC-P01-001`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000077
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000077: locks: [''Giữ đại từ nội
    tâm `mình`, danh từ `áo măng tô`, và dấu chấm lửng kết câu `Dĩ nhiên, mình cũng
    tự hỏi về những người mặc áo măng tô chỉ để làm thời trang…`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000078
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000078: locks: [''Giữ thuật ngữ
    đã sửa theo M2 và được nghiệm thu `lính phục vụ` theo mục `vol02-ch04-b04-orderly`,
    chi tiết xe chờ và người cầm lái đã khôi phục (`Chiếc xe có cấp dưới của nó ngồi
    sau tay lái đã chờ sẵn.`), đại từ trần thuật `nó` xuyên suốt đoạn, và câu kết
    `Con người phải sống với tinh thần lạc quan.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000079
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000079: locks: [''Giữ đại từ trần
    thuật ngôi thứ ba `nó` / `Nó` ở cả hai câu đã sửa theo M6 và được nghiệm thu (`Và
    thế là nó thấy tình cảnh này thật tuyệt vời. Nó đã đúng khi không keo kiệt tiền
    boa cho những người phục vụ.`), cùng phủ định `không keo kiệt tiền boa`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000080
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000080: locks: [''Giữ các đại từ
    `họ` (nhân viên mở cửa) và `Nó` (Tanya), cùng hành động `Nó nhanh chóng lên xe,
    rồi xe lăn bánh.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000081
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000081: locks: [''Giữ cấp bậc `Hạ
    sĩ`, danh từ `doanh trại`, đại từ ngôi thứ hai `cậu`, và mệnh đề bỏ lửng `“Hạ
    sĩ, về doanh trại. Xin lỗi, nhưng nếu cậu có thể chạy nhanh lên…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000082
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000082: locks: [''Giữ câu đáp lễ
    của Hạ sĩ lái xe `“Vâng, thưa Thiếu tá.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000083
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000083: locks: [''Giữ sự phân tách
    chuẩn xác giữa đại từ trần thuật `nó` / `Nó` và hai câu độc thoại nội tâm ngôi
    thứ nhất dùng `Mình` / `mình` (`Mình không thích phải chịu khổ một mình. Nhưng
    bắt người khác chịu khổ một mình thì mình chẳng ngại.`), các thuật ngữ `quả cầu
    tính toán`, `đồn trú`, `sĩ quan trực ban tuần` theo mục `vol02-ch04-b04-officer-of-week`,
    đại từ `Anh ta`, và chi tiết `bắt máy ngay hồi chuông thứ hai, vậy là đạt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000084
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000084: locks: [''Giữ câu hỏi nhận
    lệnh `“Thiếu tá cần tôi làm gì ạ?”` và cặp xưng hô `Thiếu tá` – `tôi`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000085
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000085: locks: [''Giữ đại từ nội
    tâm `mình` và câu tự nhủ `Chà, đây là tin xấu. Thay vì vòng vo, mình nên nói thẳng
    vào vấn đề.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000086
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000086: locks: [''Giữ khẩu lệnh
    khẩn cấp của Tanya `“Thời gian nghỉ phép bị rút ngắn! Lập tức phát lệnh động viên!
    Tất cả tập hợp ngay bây giờ.”` và thuật ngữ `lệnh động viên`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000087
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000087: locks: [''Giữ câu đáp nhận
    lệnh đã sửa theo M3 và được nghiệm thu (`“…Vâng, đã rõ, lệnh động viên. Tôi sẽ
    gọi mọi người đang nghỉ phép nửa ngày quay về.”`), bảo toàn đúng phạm vi toàn
    bộ quân nhân đang nghỉ phép nửa ngày.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000088
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000088: locks: [''Giữ đại từ nội
    tâm `mình` ở câu đầu, tên riêng `Tanya` và đại từ trần thuật `nó` ở các câu sau,
    danh xưng `Tướng von Rudersdorf`, chữ `“tốt bụng”` trong ngoặc kép mỉa mai, cùng
    các thuật ngữ `thị trấn nghỉ dưỡng`, `căn cứ hải quân`, `tuyến phía Bắc`, `hoạt
    động gián điệp`, `Bộ Tổng Tham mưu`, và phiên hiệu `Tiểu đoàn Pháp sư Không quân
    203` theo mục `vol02-ch04-b04-aerial-mage`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000089
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000089: locks: [''Giữ câu nhận
    xét ngắn gọn `Thực ra, làm vậy khá thiết thực.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000090
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000090: locks: [''Giữ dấu nhấn
    mạnh chữ nghiêng `*...*` bao trọn câu thoại theo `DEC-P01-002` (`*“Mau lên. Đây
    là lệnh của Bộ Tổng Tham mưu.”*`) và tên cơ quan `Bộ Tổng Tham mưu`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000091
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000091: locks: [''Giữ dấu nhấn
    mạnh chữ nghiêng `*...*` bao trọn câu đáp theo `DEC-P01-002` (`*“Rõ.”*`).'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000092
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000092: locks: [''Giữ bản sửa M4
    và N15 đã được nghiệm thu: đại từ trần thuật `nó`, cụm `chỉ định riêng nó để truyền
    đạt mệnh lệnh`, tên cơ quan `Bộ Tổng Tham mưu` và `Cục Tác chiến` theo mục `vol02-ch04-b04-operations-division`,
    danh xưng `Tướng von Rudersdorf`, địa danh `Norden` theo mục `vol02-ch04-b04-norden`,
    và trọng tâm nhấn mạnh `đích thân có mặt ở Norden với cớ thanh tra?`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000093
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000093: locks: [''Giữ câu báo cáo
    đã sửa theo M5 và được nghiệm thu (`“Điện tín từ Bộ chỉ huy Hạm đội Biển Bắc của
    Hải quân Đế quốc!”`) theo mục `vol02-ch04-b04-northern-sea-fleet`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000094
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000094: locks: [''Giữ dấu chấm
    lửng mở đầu và mệnh lệnh ngắn gọn `“…Đọc đi.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0022.xhtml/p000095
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0022.xhtml/p000095: locks: [''Giữ câu hỏi nội
    tâm mở đầu `Từ hạm đội ư? Mình đang băn khoăn chính điều đó.`, tên riêng `Tanya`,
    phiên hiệu `Tiểu đoàn Pháp sư Không quân 203` theo mục `vol02-ch04-b04-aerial-mage`,
    cụm `bộ chỉ huy hạm đội`, và đại từ số nhiều `chúng ta` ở cuối câu hỏi.'']'
  non_canon: true
