choices:
- segment_id: YS-LN02/Text/part0024.xhtml/p000447
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000447: terms: [''kế hoạch tấn
    công (attack plan)'', ''Tiểu đoàn Pháp sư Không quân số 203 (203rd Aerial Mage
    Battalion)'', ''màn khói (smoke screen)'', ''phe tấn công (attacking side)'',
    ''quân phòng thủ (defenders)'']: pronouns_and_address: [''Quy chiếu phía phòng
    thủ trên tàu bằng `chúng`; quy chiếu đơn vị của Tanya bằng `chúng ta`; câu cuối
    dùng ngôi thứ nhất số ít `Tôi` cho hành động giăng màn khói của Tanya.'']: pov_and_voice:
    Nhận định chiến thuật ngôi thứ nhất của Tanya kết hợp mô tả hành động trực tiếp
    trên chiến trường.: modality_and_logic: Giữ nhận định mở đầu (`Ngay từ đầu đã
    chẳng có hy vọng gì`), mục đích đẩy bật đối phương khỏi tàu của phe phòng thủ,
    quan hệ nhượng bộ về tính hợp lý của kế hoạch trong không gian hẹp bên trong tàu,
    khả năng phản kích ngay của Tiểu đoàn 203 nếu đối phương chỉ có vậy, và thời điểm
    tung màn khói đúng lúc hỏa lực phe tấn công làm quân phòng thủ phân tâm.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000448
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000448: terms: [''Tất cả nghe đây
    (All hands)'', ''lính thủy đánh bộ (marines)'', ''tấn công trực diện (frontal
    attack)'', ''tiểu đoàn (battalion)'', ''địa ngục (hell)'']: pronouns_and_address:
    [''Trong tiếng hô ra lệnh toàn đơn vị, Tanya gọi `Tất cả nghe đây`, tự xưng `ta`
    (`tiểu đoàn của ta`) và quy chiếu phía lính thủy đánh bộ đối phương bằng `chúng`.'']:
    pov_and_voice: Khẩu lệnh khích lệ xen lẫn đe dọa đanh thép của Tanya.: modality_and_logic:
    Giữ thái độ bất chấp đối thủ là lính thủy đánh bộ, mệnh lệnh dạy cho đối phương
    biết hậu quả khi tấn công trực diện vào tiểu đoàn và lời răn đe những kẻ vô dụng
    chết trận sẽ bị đày xuống địa ngục.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000449
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000449: terms: [''cự ly gần (close
    quarters)'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya
    bằng `cô`.'']: pov_and_voice: Trần thuật ngôi thứ ba mô tả động tác xung phong
    chớp nhoáng của Tanya.: modality_and_logic: Giữ sự nối tiếp tức thì sau tiếng
    hô (`Vừa hô xong`) và mục đích xông lên áp sát để đưa cuộc giao chiến vào cự ly
    gần.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000450
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000450: terms: [''hai đại đội (two
    companies)'', ''lực lượng kháng cự (the resistance)'']: pronouns_and_address:
    []: pov_and_voice: Trần thuật khái quát áp lực tiến công của hai đại đội.: modality_and_logic:
    Giữ tác động trực diện của sức ép từ hai đại đội đang giáng mạnh lên lực lượng
    kháng cự.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000451
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000451: terms: [''thủy thủ (sailors)'',
    ''pháp sư (mages)'', ''một toán nhỏ (a small unit)'', ''đường vòng (detour)'']:
    names_and_ranks: [''Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba
    dùng tên riêng `Tanya`.'']: pov_and_voice: Trần thuật mô tả pha cơ động tách đội
    đi vòng của Tanya.: modality_and_logic: Giữ quan hệ đồng thời: đúng lúc các thủy
    thủ bắt đầu rút lui trước các pháp sư có bộ mặt dữ tợn như quỷ sứ, Tanya dẫn một
    toán nhỏ đi đường vòng.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000452
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000452: terms: [''bên trong tàu
    (inside the ship)'', ''đợt tập kích bất ngờ (sneak attack)'', ''mạn trái (port
    side)'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng
    `cô`.'']: pov_and_voice: Trần thuật mô tả đòn đánh úp mạn trái của Tanya.: modality_and_logic:
    Giữ bối cảnh mọi sự chú ý đang dồn vào cuộc giao chiến ác liệt bên trong tàu làm
    điều kiện để Tanya chớp sơ hở và mở đợt tập kích bất ngờ ở mạn trái.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000453
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000453: terms: [''bị kẹp gọng kìm
    (pincered)'', ''thủy thủ (crew)'', ''mạn trái (port side)'']: pronouns_and_address:
    [''Khẩu lệnh của phía phòng thủ trên tàu dùng `Chúng ta`.'']: pov_and_voice: Tiếng
    hô hoảng hốt và mệnh lệnh điều quân khẩn cấp của chỉ huy phía tàu.: modality_and_logic:
    Giữ câu hỏi bàng hoàng nhận ra thế bị kẹp gọng kìm, tiếng chửi thề và mệnh lệnh
    điều một phần thủy thủ sang mạn trái.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000454
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000454: names_and_ranks: [''Thiếu
    tá von Degurechaff (Major von Degurechaff)'']: pronouns_and_address: [''Quy chiếu
    phe phòng thủ bằng `Chúng` / `chúng`; gọi chỉ huy bằng quân hàm và họ `Thiếu tá
    von Degurechaff`.'']: pov_and_voice: Tiếng reo mừng và hô xung phong của quân
    Tiểu đoàn 203.: modality_and_logic: Giữ nhận định đối phương đã rối loạn, tiếng
    reo thành công khi Thiếu tá von Degurechaff vòng ra sau lưng địch và lời hô tiêu
    diệt đối phương.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000455
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000455: terms: [''Đối phương (Our
    opponents)'', ''bị kẹp gọng kìm (pincered)'', ''đại đội trưởng (company commander)'',
    ''Quy luật sắt đá của chiến tranh (The iron law of war)'', ''sức ép và hỗn loạn
    (impact and confusion)'']: pronouns_and_address: [''Dùng `chúng ta` cho phía Tiểu
    đoàn 203, `chúng` cho đối phương và đại từ phản thân `mình` cho mỗi đại đội trưởng.'']:
    pov_and_voice: Phân tích chiến thuật ngôi thứ nhất số nhiều từ góc nhìn của Tanya.:
    modality_and_logic: Giữ vẻ sắp tháo chạy của đối phương khi bị kẹp gọng kìm đối
    lập với việc phe Tanya không để chúng thoát, nỗ lực nâng cao thành quả của từng
    đại đội trưởng, và mệnh đề đúc kết quy luật sắt đá của chiến tranh là sự phối
    hợp giữa sức ép và hỗn loạn.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000456
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000456: terms: [''kỷ luật (discipline)'']:
    pronouns_and_address: [''Quy chiếu đối phương bằng `chúng`.'']: pov_and_voice:
    Châm ngôn chiến thuật sắc lạnh nối tiếp p000455.: modality_and_logic: Giữ đúng
    trình tự ba bước tăng tiến: phá vỡ sự bình tĩnh -> làm rối loạn kỷ luật -> nghiền
    nát đối phương.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000457
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000457: terms: [''phe phòng thủ
    (the defensive side)'', ''đợt đánh úp từ phía sau (rear attack)'', ''các nguyên
    tắc chiến tranh (principles of war)'', ''mũi tấn công trực diện (frontal attack)'']:
    pronouns_and_address: [''Câu kết rút gọn tự nhiên `Đúng như dự tính.`.'']: pov_and_voice:
    Trần thuật đánh giá cục diện chiến thuật từ điểm nhìn của Tanya.: modality_and_logic:
    Khóa sửa chữa B26-F01: bảo toàn phạm vi sự hỗn loạn đang lan khắp `phe phòng thủ`
    do bị kẹp giữa hai gọng kìm là `đợt đánh úp từ phía sau` (được thực hiện hiệu
    quả, đúng theo các nguyên tắc chiến tranh) và `mũi tấn công trực diện ngày càng
    dồn dập`, đúng như mong muốn của phe tấn công.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000458
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000458: terms: [''lính thủy đánh
    bộ (marines)'', ''tuyến chặn đánh (interception line)'']: pronouns_and_address:
    [''Quy chiếu lính thủy đánh bộ bằng `họ`.'']: pov_and_voice: Trần thuật mô tả
    sự sụp đổ của tuyến phòng ngự lính thủy đánh bộ.: modality_and_logic: Giữ so sánh
    tốc độ: đòn giáng dữ dội nghiền nát lính thủy đánh bộ nhanh hơn tốc độ họ có thể
    lấp các khoảng trống và dựng lại tuyến chặn đánh.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000459
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000459: pronouns_and_address: []:
    pov_and_voice: Báo cáo hoàn tất quét sạch mục tiêu của một mũi tiến công.: modality_and_logic:
    Giữ câu báo cáo ngắn gọn (`Đã thông đường.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000460
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000460: pronouns_and_address: [''Dùng
    `Bên tôi` cho đơn vị báo cáo tiếp theo.'']: pov_and_voice: Báo cáo xác nhận đồng
    thời của mũi tiến công thứ hai.: modality_and_logic: Giữ câu đáp ngắn gọn (`Bên
    tôi cũng vậy.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000461
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000461: terms: [''đại đội (company)'',
    ''quân phòng thủ (defenders)'', ''Đại đội Một (First Company)'', ''đài chỉ huy
    (bridge)'', ''Đại đội Hai và Ba (Second and Third Companies)'', ''phòng máy (engines)'',
    ''Đại đội Bốn (Fourth Company)'', ''kho đạn (magazine)'', ''lực lượng kháng cự
    chủ yếu (main enemy resistance force)'', ''những khu vực trọng yếu trên tàu (key
    parts of the ship)'']: names_and_ranks: [''Tanya'']: pronouns_and_address: [''Câu
    1 trần thuật ngôi thứ ba dùng `Tanya`; trong mệnh lệnh trực tiếp Tanya tự xưng
    `tôi` (`Theo tôi.`); câu cuối chuyển sang ngôi thứ nhất số nhiều `chúng ta`.'']:
    pov_and_voice: Trần thuật ngôi thứ ba kết hợp mệnh lệnh trực tiếp của Tanya và
    lời bình chiến thuật ngôi thứ nhất số nhiều.: modality_and_logic: Giữ sự phân
    công chính xác cho cả bốn đại đội (`Đại đội Một` -> `đài chỉ huy` cùng Tanya;
    `Đại đội Hai và Ba` -> `phòng máy`; `Đại đội Bốn` -> `kho đạn`) trong lúc quét
    sạch quân phòng thủ đã mất khả năng tác chiến có tổ chức, và yêu cầu kiểm soát
    các khu vực trọng yếu của tàu sau khi đã loại bỏ lực lượng kháng cự chính. Khóa
    lựa chọn tạm `kho đạn` (`vol02-ch04-b26-magazine`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000462
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000462: terms: [''các ổ kháng cự
    của địch (pockets of enemy resistance)'', ''tiểu đoàn (battalion)'']: pronouns_and_address:
    [''Dùng đại từ ngôi thứ nhất số nhiều `Chúng ta`.'']: pov_and_voice: Trần thuật
    chiến thuật ngôi thứ nhất số nhiều từ góc nhìn của Tanya.: modality_and_logic:
    Giữ phương thức tiếp cận tuần tự bằng cách quét rộng dần từ các vị trí đã chiếm,
    cách duy trì tốc độ nhờ vòng tránh các ổ kháng cự của địch (không tự biến thành
    tiêu diệt toàn bộ), và đánh giá tích cực về việc phân chia nhiệm vụ trong toàn
    tiểu đoàn.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000463
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000463: terms: [''các khu vực trọng
    yếu (critical areas)'', ''thủy thủ (sailors)'', ''lực lượng đóng vai địch (pretend
    enemy)'', ''quân tiếp viện (reinforcements)'', ''phe phòng thủ (the defense)'',
    ''trọng tài (referees)'']: pronouns_and_address: [''Dùng `chúng ta` cho đơn vị
    của Tanya và `họ` / `Họ` cho phía phòng thủ trên tàu.'']: pov_and_voice: Trần
    thuật tổng hợp sự sụp đổ sức kháng cự trên tàu.: modality_and_logic: Giữ chuỗi
    diễn biến: phía tàu nhận ra các khu vực trọng yếu đã bị đánh chiếm nên từ bỏ chống
    cự -> kỷ luật bên trong sụp đổ, thủy thủ chực chờ tháo chạy -> lực lượng đóng
    vai địch hội quân với tiếp viện và sẵn sàng đánh tiếp -> lực lượng chiến đấu của
    phe phòng thủ gần như không còn và biện pháp chống trả hạn chế -> buộc phải đàng
    hoàng thừa nhận thất bại trước trọng tài.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000464
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000464: terms: [''tổ hai người
    (two-man cells)'', ''Quân tiên phong (Vanguard troops)'']: pronouns_and_address:
    []: pov_and_voice: Khẩu lệnh thúc quân đột kích của Tanya ngay trước khi bước
    vào đài chỉ huy.: modality_and_logic: Giữ mệnh lệnh xông vào theo từng tổ hai
    người và nhắc quân tiên phong chuẩn bị sẵn sàng.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000465
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000465: names_and_ranks: [''Thiếu
    tá von Degurechaff (Major von Degurechaff)'']: pronouns_and_address: [''Gọi trực
    tiếp bằng quân hàm và họ `Thiếu tá von Degurechaff`.'']: pov_and_voice: Lời can
    ngăn khẩn trương của trọng tài.: modality_and_logic: Giữ nhịp lặp can ngăn (`đủ
    rồi, đủ rồi`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000466
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000466: terms: [''đài chỉ huy (bridge)'']:
    pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng `cô`.'']:
    pov_and_voice: Trần thuật mô tả thời điểm thông điệp dừng diễn tập vang lên.:
    modality_and_logic: Giữ thời điểm vừa khít: lời nhắn vang lên đúng lúc Tanya sắp
    bước vào đài chỉ huy.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000467
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000467: terms: [''các trọng tài
    (the referees)'', ''những màn điều động điên rồ (insane maneuvers)'', ''đài chỉ
    huy thứ hai (second bridge)'']: pronouns_and_address: [''Quy chiếu các trọng tài
    bằng `họ` và quy chiếu Tanya bằng `cô`.'']: pov_and_voice: Trần thuật ngôi thứ
    ba phản ánh tâm trạng ngán ngẩm, nhẹ nhõm của các trọng tài.: modality_and_logic:
    Khóa sửa chữa B26-F02 (`đài chỉ huy thứ hai` / `vol02-ch04-b26-ship-bridge`):
    bảo toàn nỗi mong mỏi trận đấu kết thúc càng sớm càng tốt của các trọng tài bị
    buộc phải bám theo những pha cơ động điên rồ, cùng tâm trạng ngổn ngang của họ
    khi Tanya bảo họ đi theo vì định chiếm đài chỉ huy thứ hai.: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000468
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000468: terms: [''Cuộc diễn tập
    / cuộc diễn tập (The exercise / the exercise)'']: pronouns_and_address: [''Lược
    chủ ngữ ngôi thứ nhất trong cụm thông báo chuẩn nhà binh (`Nhắc lại, ...`).'']:
    pov_and_voice: Thông báo chính thức kết thúc diễn tập qua loa truyền thanh.: modality_and_logic:
    Giữ cấu trúc lặp lại thông báo chấm dứt cuộc diễn tập.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000469
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000469: terms: [''trò chơi (the
    game)'', ''hệ thống loa phóng thanh (loudspeakers)'']: pronouns_and_address: []:
    pov_and_voice: Trần thuật mô tả âm thanh thông báo kết thúc vang khắp tàu.: modality_and_logic:
    Giữ đầy đủ thông tin thông báo kết thúc cuộc đấu vang vọng khắp con tàu qua hệ
    thống loa phóng thanh.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000470
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000470: terms: [''cuộc diễn tập
    chiến đấu phối hợp (joint combat simulation)'', ''tai nạn (accidents)'']: pronouns_and_address:
    [''Dùng `mọi người` cho toàn bộ nhân sự tham gia.'']: pov_and_voice: Trần thuật
    mô tả bầu không khí nhẹ nhõm sau khi kết thúc diễn tập.: modality_and_logic: Giữ
    quan hệ nhượng bộ ở cả câu 1 (`dù lo lắng về những thứ trên tàu đã bị hư hại,
    cuối cùng mọi người cũng có thể thở phào`) và câu 3 (`Nhiều thứ bị hỏng, nhưng
    không có tai nạn nào xảy ra`), không tự ý sửa đổi để làm mất sự đối chiếu với
    các ca thương tích nhẹ ở p000474–p000476.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000471
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000471: pronouns_and_address: [''Gọi
    đám binh lính giả chết bằng `mấy cái xác ngu ngốc` và đại từ ngôi thứ hai số nhiều
    `các người`.'']: pov_and_voice: Lời gọi bỗ bã đánh thức những người đã bị xử loại
    khỏi vòng chiến.: modality_and_logic: Giữ sắc thái trêu chọc gay gắt và sự cho
    phép cử động trở lại.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000472
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000472: terms: [''thủy thủ và lính
    thủy đánh bộ (sailors and marines)'']: pronouns_and_address: []: pov_and_voice:
    Trần thuật mô tả cảnh những người bị xử tử trận đứng dậy.: modality_and_logic:
    Giữ đầy đủ trạng thái của các thủy thủ và lính thủy đánh bộ: bị phán định là đã
    chết, được lệnh nằm im úp mặt xuống đất, rồi uể oải đứng dậy.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000473
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000473: terms: [''đạn cao su dành
    cho diễn tập (exercise-grade rubber bullets)'', ''công thức gây nổ công suất thấp
    (low-power explosion formulas)'']: pronouns_and_address: [''Dùng `chúng ta` cho
    phía sử dụng vũ khí diễn tập và `chúng` cho đạn cao su cùng công thức gây nổ công
    suất thấp.'']: pov_and_voice: Nhận xét thực tế ngôi thứ nhất số nhiều từ góc nhìn
    của Tanya.: modality_and_logic: Khóa sửa chữa B26-F03 (`công thức gây nổ công
    suất thấp` / `vol02-ch04-b26-explosive-formula`): giữ cấu trúc nhượng bộ khẳng
    định việc thực tế đã dùng đạn cao su diễn tập và công thức gây nổ công suất thấp
    (`Dù chúng ta đã dùng...`), đồng thời giữ hệ quả phủ định rằng trúng phải chúng
    vẫn chẳng dễ chịu gì.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000474
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000474: terms: [''người bị thương
    (the injured)'', ''bệnh xá (infirmary)'', ''bác sĩ phẫu thuật (surgeon)'']: pronouns_and_address:
    []: pov_and_voice: Trần thuật nêu mức độ thương tích thực tế sau diễn tập.: modality_and_logic:
    Giữ sắc thái nhấn mạnh mức độ (`Thậm chí một số người bị thương còn phải đến bệnh
    xá để bác sĩ phẫu thuật điều trị`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000475
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000475: terms: [''thủy thủ (sailors)'',
    ''màn đấu súng (firefight)'', ''Tiểu đoàn số 203 (203rd Battalion)'', ''lính thủy
    đánh bộ (marines)'', ''đạn lạc (stray bullets)'']: pronouns_and_address: [''Quy
    chiếu những thủy thủ không may bằng `Họ`.'']: pov_and_voice: Trần thuật dẫn ví
    dụ cụ thể về thương tích do đạn lạc.: modality_and_logic: Giữ tình huống các thủy
    thủ vô tình bị cuốn vào màn đấu súng giữa Tiểu đoàn 203 và lính thủy đánh bộ,
    cùng lời kể lại rằng dù đã cúi rạp xuống nhưng vẫn chịu thương tích vì liên tục
    trúng đạn lạc.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000476
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000476: terms: [''cuộc hỗn chiến
    bên trong tàu (melee on the interior of the ship)'', ''quân y và bác sĩ phẫu thuật
    (medics and surgeons)'', ''bệnh xá (infirmary)'']: pronouns_and_address: [''Mệnh
    đề cuối câu 2 dùng đại từ ngôi thứ nhất số ít `tôi` (`nhưng tôi đoán...`).'']:
    pov_and_voice: Trần thuật kết hợp phỏng đoán ngôi thứ nhất của Tanya.: modality_and_logic:
    Giữ hai cặp quan hệ nhượng bộ: dù vận rủi như vậy hiếm gặp nhưng vẫn có không
    ít người bị thương trong cuộc hỗn chiến bên trong tàu; và dù đội quân y cùng bác
    sĩ phẫu thuật đã túc trực sẵn sàng tiếp nhận nhanh chóng, người kể vẫn đoán bệnh
    xá sẽ còn đông đúc một thời gian.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000477
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000477: terms: [''phòng sĩ quan
    (wardroom)'', ''sĩ quan (officers)'', ''lục quân (army)'', ''hải quân (navy)'',
    ''khẩu phần riêng (their own rations)'', ''bánh quy (cookies)'']: names_and_ranks:
    [''Thiếu tá Pháp sư Tanya von Degurechaff (Magic Major Tanya von Degurechaff)'']:
    pronouns_and_address: [''Trần thuật ngôi thứ ba dùng danh xưng đầy đủ `Thiếu tá
    Pháp sư Tanya von Degurechaff` và đại từ `cô`; quy chiếu nhân sự hải quân bằng
    `họ`; dịch đại từ ngôi thứ hai khái quát ở cuối đoạn bằng `người ta`.'']: pov_and_voice:
    Trần thuật ngôi thứ ba chuyển cảnh sang phòng sĩ quan trên tàu kết hợp nhận xét
    mang điểm nhìn của Tanya.: modality_and_logic: Khóa sửa chữa B26-F04 (`bên lục
    quân` đối lập `hải quân` / `vol02-ch04-b26-army-navy-contrast`): giữ chi tiết
    phòng sĩ quan đã được dọn dẹp, không gian nhỏ nhưng thiết kế chu đáo tạo cảm giác
    thư thái, hiện chật kín sĩ quan, tách cà phê trên tay Tanya được truyền lời là
    ngon hơn cà phê bên lục quân phục vụ (`nghe nói`), mùi bánh nướng thoang thoảng
    và suy đoán chỉ ở hải quân nơi được phép mang khẩu phần riêng cùng bánh quy mới
    có được thú vui ấy.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000478
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000478: terms: [''tụ tập uống trà
    (having a tea party)'', ''Cuộc diễn tập (the exercise)'', ''sự kiện chính (the
    main event)'']: pronouns_and_address: [''Dùng đại từ ngôi thứ nhất số nhiều `chúng
    ta` cho các sĩ quan có mặt trong phòng.'']: pov_and_voice: Lời dẫn ngôi thứ nhất
    số nhiều khép lại cảnh chiến đấu để mở sang buổi họp rút kinh nghiệm hậu diễn
    tập.: modality_and_logic: Giữ phủ định về mục đích tụ tập (`không tụ tập uống
    trà vô cớ`) và trình tự chuyển sang sự kiện chính sau khi cuộc diễn tập kết thúc.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
