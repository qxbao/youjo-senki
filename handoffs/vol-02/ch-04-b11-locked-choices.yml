- segment_id: YS-LN02/Text/part0024.xhtml/p000001
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000001: names_and_ranks: []: pronouns_and_address:
    []: pov_and_logic: [''Giữ nguyên âm tiết thều thào đứt quãng “M…Mar…” của người
    lính địch sắp chết mà không tự suy diễn thành tên đầy đủ'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000002
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000002: names_and_ranks: [''enemy
    soldier -> Tên lính địch'', ''submachine gun -> khẩu tiểu liên'']: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "nó" (DEC-P01-001); quy chiếu người
    lính địch bằng "Tên lính địch" và "hắn" (đồng bộ cuối b10)'']: pov_and_logic:
    [''Giữ tình trạng bị thương chí mạng lẩm bẩm không thành lời của tên lính địch,
    việc Tanya nhận ra hắn cố đưa cánh tay phải quằn quại ra sau lưng tìm khẩu tiểu
    liên, và quyết định "đổi chác" của nó'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh
    Markdown `*Trời đất, chuyện gì vậy?*` cho câu suy nghĩ in nghiêng trong nguồn
    theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000003
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000003: names_and_ranks: [''submachine
    gun -> khẩu tiểu liên'']: pronouns_and_address: [''Câu trần thuật ngôi thứ ba
    dùng "Nó" / "nó" cho Tanya; câu độc thoại nội tâm ở giữa đoạn chuyển sang ngôi
    thứ nhất "Mình" / "mình" theo DEC-P01-001; quy chiếu tên lính địch bằng "hắn"
    và xác chết bằng "cái xác" / "nó"'']: pov_and_logic: [''Giữ nguyên câu chào từ
    biệt tiếng Đức "“Auf Wiedersehen.”", sự đan xen giữa lời kể ngôi thứ ba và nội
    tâm ("Mình khâm phục sự ngoan cường bất ngờ của hắn, nhưng mình không có thời
    gian chiều theo sự kháng cự vô ích ấy—mình phải nhanh chóng tiến lên phía trước."),
    cùng chuỗi hành động gạt tay hắn, cướp khẩu tiểu liên, đá cái xác ra xa và xem
    xét khẩu súng vừa lấy được'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000004
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000004: names_and_ranks: [''standard
    submachine gun -> khẩu tiểu liên tiêu chuẩn'', ''imperial magic bullets -> đạn
    phép của Đế quốc'', ''Tanya -> Tanya'']: pronouns_and_address: [''Nội tâm dùng
    đại từ phản thân "chính mình" (DEC-P01-001); từ "nó" ở câu thứ hai quy chiếu khẩu
    tiểu liên; câu trần thuật cuối đoạn dùng tên riêng "Tanya", và lời lẩm bẩm đắc
    thắng một mình dùng "ta"'']: pov_and_logic: [''Giữ chi tiết khẩu tiểu liên tiêu
    chuẩn nạp được "đạn phép của Đế quốc" (`vol02-ch04-b11-imperial-magic-bullets`),
    niềm vui coi chiến lợi phẩm này là quà Giáng sinh cho chính mình, và lời lẩm bẩm
    khi đường tiến đã thông thoáng'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown
    `*Dù sao thì.*` tương ứng với từ chuyển ý in nghiêng trong nguồn theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000005
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000005: names_and_ranks: [''anti–air
    fire -> hỏa lực phòng không'']: pronouns_and_address: [''Trần thuật ngôi thứ ba
    quy chiếu Tanya bằng "nó" theo DEC-P01-001'']: pov_and_logic: [{''Giữ nét hài
    hước đen tối ("đá văng chướng ngại vật theo đúng nghĩa đen") và ba bước tiếp theo'':
    ''né hỏa lực phòng không yếu ớt của con tàu, tung đòn rồi biến mất dưới màn đêm''}]:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000006
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000006: names_and_ranks: [''Tanya
    -> Tanya'']: pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng
    tên riêng "Tanya", đại từ phản thân "mình" ("đôi tay xinh đẹp của mình") và đại
    từ "nó" theo DEC-P01-001'']: pov_and_logic: [''Giữ định nghĩa mỉa mai về chiến
    tranh (phải ra tay trước bằng điều đối phương ghét nhất), sự tương phản giữa việc
    không dùng đôi tay xinh đẹp cho trò cricket tinh tế với nhu cầu thẳng tay đá đít
    kẻ địch, và bảo toàn ký hiệu chú thích `¹²` đúng vị trí sau dấu chấm phẩy'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000007
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000007: names_and_ranks: []: pronouns_and_address:
    []: pov_and_logic: [''Giữ nhận định ngắn gọn rằng tình thế này đòi hỏi phải phá
    hỏng ý đồ của địch'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000008
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000008: names_and_ranks: []: pronouns_and_address:
    [''Quy chiếu phía địch bằng "chúng"'']: pov_and_logic: [''Giữ câu hỏi tu từ dẫn
    dắt chiến thuật ("Vậy cách tốt nhất để bắt nạt chúng là gì?")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000009
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000009: names_and_ranks: [''enemy
    fleet -> Hạm đội địch'', ''submarines -> tàu ngầm'', ''counter-sub measures ->
    biện pháp chống tàu ngầm'', ''explosion formula -> thuật thức nổ'', ''depth charges
    -> bom chìm'', ''torpedoes -> ngư lôi'']: pronouns_and_address: [''Độc thoại nội
    tâm của Tanya tự quy chiếu bằng "mình" (DEC-P01-001) và quy chiếu hạm đội địch
    bằng "chúng"'']: pov_and_logic: [{''Giữ bản sửa M1 "thuật thức nổ" (`vol02-ch04-b11-formulas`)
    và chuỗi nhân quả chiến thuật'': ''hạm đội địch đang bị tàu ngầm quấy nhiễu nên
    phải chống ngầm; nếu dùng thuật thức nổ có thời gian kích hoạt ngắn làm bom chìm
    hoặc ngư lôi của tàu phát nổ dây chuyền thì con tàu sẽ chìm dễ dàng''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000010
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000010: names_and_ranks: [''torpedoes
    -> ngư lôi'', ''battleship -> thiết giáp hạm'', ''destroyer -> khu trục hạm'',
    ''stern -> đuôi tàu'', ''rudder -> bánh lái'', ''submarines -> tàu ngầm'']: pronouns_and_address:
    [''Độc thoại nội tâm tự quy chiếu bằng "mình" (DEC-P01-001); từ "nó" ở câu cuối
    quy chiếu khu trục hạm'']: pov_and_logic: [{''Giữ đầy đủ ba kịch bản có lợi cho
    Tanya khi nhắm vào đuôi tàu'': ''(1) nếu kích nổ được số ngư lôi vốn đủ sức đánh
    cả thiết giáp hạm thì khu trục hạm không có cơ may sống sót; (2) dù không kỳ vọng
    nhiều thì đánh tập trung vào đuôi tàu vẫn có khả năng làm giảm tốc độ và hỏng
    bánh lái; (3) nếu tàu vứt bỏ ngư lôi để tránh nổ dây chuyền thì khả năng chống
    tàu ngầm chắc chắn suy giảm''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000011
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000011: names_and_ranks: []: pronouns_and_address:
    [''Độc thoại nội tâm tự quy chiếu bằng "mình" (DEC-P01-001)'']: pov_and_logic:
    [''Giữ kết luận đánh giá rủi ro thấp về phía mình và sự hài lòng tuyệt đối ("Hoàn
    hảo.")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000012
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000012: names_and_ranks: [''mage
    -> pháp sư'']: pronouns_and_address: [''Lời tự khích lệ thành tiếng của Tanya
    dùng "Mình"'']: pov_and_logic: [''Giữ câu phủ định mỉa mai ("Có luật nào cấm pháp
    sư đánh chìm tàu đâu.") và khí thế chuẩn bị tấn công'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000013
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000013: names_and_ranks: [''mages
    -> các pháp sư'']: pronouns_and_address: [''Báo cáo vô tuyến từ các đại đội làm
    nhiệm vụ nghi binh (Đại đội Hai và Ba từ b09 p000202) lược chủ ngữ tự nhiên, quy
    chiếu pháp sư địch bằng "các pháp sư" / "họ"'']: pov_and_logic: [''Giữ thông báo
    đã dụ được các pháp sư địch rời đi và đang cầm chân ở khoảng cách xa'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000014
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000014: names_and_ranks: [''marine
    mages -> các pháp sư thủy quân lục chiến'', ''subs -> đám tàu ngầm'']: pronouns_and_address:
    [''Độc thoại nội tâm tự quy chiếu bằng "mình" (DEC-P01-001), quy chiếu pháp sư
    thủy quân lục chiến địch bằng "Họ" và các tàu địch bằng "chúng"'']: pov_and_logic:
    [''Giữ bản sửa M2 "các pháp sư thủy quân lục chiến" (`vol02-ch04-b11-marine-mages`),
    chi tiết đối phương hạ độ cao để xử lý tàu ngầm giúp Tanya rảnh tay bổ nhào mà
    không sợ bị đánh úp từ trên cao, và nhận định trên danh nghĩa chỉ đến để quấy
    nhiễu nên tình thế quá hoàn hảo'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000015
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000015: names_and_ranks: []: pronouns_and_address:
    [''Khẩu lệnh vô tuyến của Tanya quy chiếu toán pháp sư địch bằng "họ"'']: pov_and_logic:
    [''Giữ chỉ thị duy trì khoảng cách đủ xa để pháp sư địch không thể yểm trợ các
    tàu'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000016
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000016: names_and_ranks: []: pronouns_and_address:
    []: pov_and_logic: [''Giữ nguyên ba lớp dấu ngoặc kép `“““Rõ!”””` biểu thị tiếng
    đáp lời đồng thanh của các thuộc cấp'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000017
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000017: names_and_ranks: [''fleet
    -> hạm đội'', ''enemy fleet -> hạm đội địch'', ''submarines -> tàu ngầm'', ''the
    brass -> cấp trên'']: pronouns_and_address: [''Độc thoại nội tâm của Tanya tự
    quy chiếu cá nhân bằng "Mình" (DEC-P01-001), quy chiếu tập thể đơn vị/phe Đế quốc
    bằng "ta" / "chúng ta", quy chiếu các thuộc cấp đang cầm chân pháp sư địch bằng
    "họ", và quy chiếu pháp sư địch bằng "chúng"'']: pov_and_logic: [{''Giữ trọn lập
    luận tính công trạng của Tanya'': ''dù khó cầm chân địch đến khi hạm đội ta tới
    nhưng thuộc cấp chắc chắn sẽ được thưởng vì đẩy nhanh việc tiêu hao địch; đơn
    vị đã lập công lớn khi định vị được hạm đội địch và phối hợp với tàu ngầm phe
    ta, nên chỉ cần báo cáo với cấp trên rằng đã làm hết sức bằng quyết định chớp
    nhoáng''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000018
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000018: names_and_ranks: [''RTB
    -> quay về căn cứ'']: pronouns_and_address: []: pov_and_logic: [''Giữ thuật ngữ
    "quay về căn cứ" (`vol02-ch04-b11-rtb`) kèm ký hiệu chú thích `¹³` đúng vị trí
    và sự phân định ưu tiên ("Giao chiến với các tàu chỉ là mục tiêu phụ.")'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000019
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000019: names_and_ranks: [''search
    and destroy mission -> phần việc tìm kiếm và tiêu diệt'', ''Entente Alliance ->
    Liên minh Entente'', ''Northern Sea Fleet -> Hạm đội Biển Bắc'']: pronouns_and_address:
    [''Độc thoại nội tâm dùng "mình" cho cá nhân Tanya (DEC-P01-001) và "chúng ta"
    / "ta" cho đơn vị'']: pov_and_logic: [''Giữ điều kiện hoàn thành nhiệm vụ theo
    cách tính của Tanya (chỉ cần bắn trả là coi như xong phần việc tìm kiếm và tiêu
    diệt) và việc đẩy trách nhiệm tiêu diệt tàu Liên minh Entente sang cho Hạm đội
    Biển Bắc'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000020
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000020: names_and_ranks: [''First
    Company -> Đại đội Một'']: pronouns_and_address: [''Khẩu lệnh trực tiếp của Tanya
    gọi "Đại đội Một"'']: pov_and_logic: [''Giữ giọng khích tướng của Tanya thúc giục
    Đại đội Một bắt tay vào việc nếu không muốn bị gọi là lũ vô tích sự'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000021
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000021: names_and_ranks: [''air-to-ground
    attacks -> những đợt tấn công từ trên không xuống mặt đất'', ''intercepting shots
    -> những phát đạn đánh chặn'']: pronouns_and_address: [''Độc thoại nội tâm dùng
    "Bọn mình" / "bọn mình" cho tập thể đại đội và "mình" cho cá nhân Tanya theo đúng
    DEC-P01-001 và bản sửa M3'']: pov_and_logic: [''Giữ chi tiết tăng tốc bổ nhào,
    sự khó chịu do hơi ẩm từ mặt nước kết hợp với trời mưa khác hẳn các đợt tấn công
    từ trên không xuống mặt đất, và việc đạn đánh chặn bay sượt qua không trúng Tanya
    đúng như dự đoán'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000022
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000022: names_and_ranks: [''company
    -> đại đội'']: pronouns_and_address: [''Độc thoại nội tâm dùng "mình" (DEC-P01-001)'']:
    pov_and_logic: [{''Giữ sự kết nối logic với nguyên lý bắn đón ở b09'': ''trừ phi
    địch kém cỏi hết thuốc chữa thì những người bay phía sau Tanya trong đại đội đang
    gặp nguy hiểm, kèm nhận xét thực dụng rằng dùng cấp dưới làm mồi nhử để sống sót
    và thăng tiến là hằng số trong cả doanh nghiệp lẫn quân đội''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000023
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000023: names_and_ranks: [''formulas
    -> thuật thức'']: pronouns_and_address: [''Khẩu lệnh trực tiếp của Tanya gọi "Tất
    cả"'']: pov_and_logic: [''Giữ bản sửa M1 "thuật thức" (`vol02-ch04-b11-formulas`)
    trong mệnh lệnh triển khai thuật thức'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000024
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000024: names_and_ranks: [''destroyer
    -> khu trục hạm'']: pronouns_and_address: [''Độc thoại nội tâm dùng "mình" (DEC-P01-001)
    và quy chiếu pháp sư thuộc cấp trúng đạn ở b10 p000232 bằng "gã vừa bị bắn trúng
