choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000619
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000619: terms: [''Thượng đế'']:
    pronouns_and_address: Câu cầu khẩn nội tâm gọi `Thượng đế` (`review-God`) và dùng
    đại từ tôn kính `Người`.: pov_and_voice: Chuyển cảnh (`space-break1`) từ cuộc
    họp Bộ Tổng Tham mưu ở `ch-05-b23` trở lại căn cứ hậu phương mặt trận Rhine với
    lời than khóc nội tâm của Warren Grantz.: modality_and_logic: Bảo toàn câu hỏi
    cảm thán mở đầu phân cảnh: trách hỏi vì sao Thượng đế lại để những chuyện này
    xảy ra.: emphasis: Bảo toàn chính xác toàn bộ câu trong `*...*` tương ứng thẻ
    `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000620
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000620: terms: [''Thiếu úy Pháp
    sư Warren Grantz'']: pronouns_and_address: Trần thuật ngôi thứ ba định danh `Thiếu
    úy Pháp sư Warren Grantz`, quy chiếu bằng đại từ `anh` và phản thân `mình` (tuân
    thủ giới hạn của `DEC-P01-001`).: pov_and_voice: Câu dẫn ngôi thứ ba giới thiệu
    tình cảnh của Grantz trước khi chuyển hẳn sang tự sự ngôi thứ nhất từ `p000621`.:
    modality_and_logic: Bảo toàn đầy đủ 2 câu: sau khi nôn sạch mọi thứ trong dạ dày
    kể cả toàn bộ bữa tối hôm trước, Grantz than trời trách đất ở một góc chỗ ở của
    mình; chỉ nghĩ lại những gì vừa trải qua thôi cũng khiến anh kinh hãi (xem thêm
    finding `m1`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000621
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000621: terms: [''người lính Cộng
    hòa'', ''xẻng'', ''mệnh lệnh'']: pronouns_and_address: Tự sự ngôi thứ nhất của
    Grantz dùng `Tôi` / `tôi` và `chúng tôi`.: pov_and_voice: Tự sự ngôi thứ nhất
    hồi tưởng lại khoảnh khắc cận chiến đẫm máu bằng xẻng trong chiến hào đêm trước.:
    modality_and_logic: Bảo toàn trình tự nhân quả – thời gian qua 2 câu: đã nện xẻng
    vào đầu một người lính Cộng hòa không rõ tên rồi cứ thế vung xẻng như kẻ điên;
    sau đó mệnh lệnh kéo anh về thực tại và chẳng bao lâu sau cả đội được lệnh rút
    đi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000622
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000622: terms: [''ma lực'', ''quả
    cầu tính toán'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `Tôi`
    và phản thân `mình`, từ `nó` quy chiếu `quả cầu tính toán`.: pov_and_voice: Tự
    sự ngôi thứ nhất khắc họa sự hoảng loạn dồn toàn lực tháo chạy.: modality_and_logic:
    Bảo toàn phép so sánh và quan hệ mục đích: dồn ma lực vào quả cầu tính toán như
    thể tính mạng phụ thuộc vào đó để cố hết sức lao vun vút trên bầu trời.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000623
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000623: terms: [''súng máy'']:
    pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice:
    Tự sự ngôi thứ nhất tái hiện làn đạn phòng không đuổi theo ngay khi vừa rời mặt
    đất.: modality_and_logic: Bảo toàn quan hệ thời gian tức thì: ngay khi vừa cất
    cánh, vài khẩu súng máy bắt đầu nhả đạn về phía anh.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000624
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000624: terms: [''lớp vỏ phòng
    ngự'', ''màn bảo hộ'', ''yểm trợ'']: pronouns_and_address: Tự sự ngôi thứ nhất
    của Grantz dùng `Tôi` / `tôi`.: pov_and_voice: Tự sự ngôi thứ nhất thú nhận việc
    quên sạch nhiệm vụ yểm trợ vì chỉ nghĩ tới chuyện sống sót thoát thân.: modality_and_logic:
    Bảo toàn trọn vẹn 3 câu: cuống cuồng dựng lớp vỏ phòng ngự và màn bảo hộ; ý nghĩ
    bằng mọi giá phải thoát khỏi đó choán hết tâm trí; vì chỉ nghĩ đến chuyện đó nên
    quên bẵng việc yểm trợ (nhiệm vụ của lính mới được giao ở `p000498`) và chỉ biết
    tháo chạy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000625
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000625: terms: [''quỷ dữ'', ''tiểu
    đoàn trưởng'', ''thánh ca'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz
    dùng `tôi` / `Tôi` kết hợp phản thân `mình`, quy chiếu Tanya từ góc nhìn ngôi
    thứ nhất của Grantz bằng `tiểu đoàn trưởng` và `cô ấy` (không thuộc phạm vi cấm
    của `DEC-P01-001`).: pov_and_voice: Tự sự ngôi thứ nhất miêu tả cảnh tượng siêu
    thực khi thấy Tanya vừa bay vọt lên giữa đêm đen vừa hát thánh ca.: modality_and_logic:
    Bảo toàn đầy đủ 4 câu: chuyện xảy ra đúng lúc ấy; chẳng biết do số phận trêu ngươi
    hay quỷ dữ nhúng tay, anh trông thấy tiểu đoàn trưởng đang vọt lên với tốc độ
    chóng mặt; bất chấp màn đêm dày đặc, cô ấy cất giọng đầy phấn chấn hát thánh ca;
    không thể tin vào mắt mình nhưng lại sợ cô ấy bỏ trốn một mình rồi bỏ mặc mình
    nên anh cố đuổi theo (xem thêm finding `m2`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000626
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000626: terms: [''Trung úy Weiss'',
    ''căn cứ'', ''chỉ huy'', ''mồi nhử'', ''mặt trận'']: pronouns_and_address: Tự
    sự ngôi thứ nhất của Grantz dùng `tôi`; quy chiếu Trung úy Weiss bằng `Trung úy
    Weiss` / `anh ấy`; trong lời mắng trích dẫn trực tiếp, Weiss gọi Grantz là `cậu`
    / `Cậu`, dùng đại từ gộp `chúng ta` và quy chiếu Tanya bằng `chỉ huy` / `cô ấy`.:
    pov_and_voice: Tự sự ngôi thứ nhất lồng ghép câu suy nghĩ lúc bay lên và lời quát
    mắng của Trung úy Weiss khi về căn cứ, làm sáng tỏ hành động làm mồi nhử thu hút
    hỏa lực của Tanya.: modality_and_logic: Bảo toàn cả 2 câu cùng giả định trái thực
    tế quá khứ ở cuối đoạn: lúc bắt đầu bay lên chỉ nghĩ không muốn bị bỏ lại, nhưng
    đúng lúc ấy Trung úy Weiss từ đâu xuất hiện túm tay kéo xuống; khi về căn cứ anh
    ấy mắng vì sao lại bay lại gần chỉ huy trong lúc cô ấy đang làm mồi nhử cho cả
    đơn vị, nhưng nếu anh ấy không cứu thì Grantz đã bị nghiền nát như hai người kia
    đến mặt trận cùng đợt với mình (xem thêm finding `m2`).: emphasis: Bảo toàn chính
    xác 2 cụm `*...*` (`*Không muốn bị bỏ lại*` và `*Sao cậu lại đến gần chỉ huy khi
    cô ấy đang làm mồi nhử cho chúng ta? Cậu điên à?*`) tương ứng hai thẻ `<html:em>`
    trong nguồn theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000627
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000627: terms: [''đường bay an
    toàn'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice:
    Tự sự ngôi thứ nhất giải thích trạng thái tâm trí hoảng loạn làm nhòe đi ký ức
    lúc rút lui.: modality_and_logic: Bảo toàn quan hệ nhân quả: khi ấy chỉ nghĩ đến
    chuyện quay về, nên ký ức trước khi vào được đường bay an toàn rất mơ hồ.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000628
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000628: terms: [''quả cầu tính
    toán'', ''Thượng đế'', ''làn mưa lửa'']: pronouns_and_address: Tự sự ngôi thứ
    nhất của Grantz dùng `tôi` kết hợp phản thân `mình`.: pov_and_voice: Tự sự ngôi
    thứ nhất bày tỏ nỗi rùng mình và lòng biết ơn khi xem lại dữ liệu ghi hình trận
    đánh.: modality_and_logic: Bảo toàn mối liên hệ giữa việc xem lại cảnh tượng ghi
    trong quả cầu tính toán với mong muốn cảm tạ Thượng đế vì đã sống sót trở về từ
    làn mưa lửa dày đặc đến thế.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000629
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000629: terms: [''Trung đội Bảy'']:
    pronouns_and_address: Tự sự ngôi thứ nhất quy chiếu hai tân binh tử trận bằng
    `Hai người thuộc Trung đội Bảy`.: pov_and_voice: Giọng tự sự trầm nặng đối chiếu
    ranh giới sinh tử tính bằng từng giây trên chiến trường (khớp với báo cáo tổn
    thất ở `ch-05-b21` `p000541`–`p000542`).: modality_and_logic: Bảo toàn cả 2 câu:
    chỉ vài giây thôi; hai người thuộc Trung đội Bảy chỉ phản ứng chậm hơn một thoáng
    mà phải trả giá bằng mạng sống.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000630
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000630: terms: []: pronouns_and_address:
    Câu cảm thán ngắn không dùng đại từ nhân xưng.: pov_and_voice: Nhịp ngắt suy ngẫm
    về cái giá của một thoáng sơ sẩy.: modality_and_logic: Bảo toàn hai câu ngắn đối
    lập: chỉ một khoảnh khắc bất cẩn, nhưng hậu quả/ý nghĩa lại quá lớn.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000631
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000631: terms: [''căn cứ hậu phương'',
    ''tân binh'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.:
    pov_and_voice: Tự sự ngôi thứ nhất mô tả phản ứng tâm sinh lý chấn thương của
    toàn bộ lính mới sau lần đầu giáp lá cà.: modality_and_logic: Bảo toàn đầy đủ
    3 câu: vừa đặt chân đến căn cứ hậu phương, cảm giác nện vào đầu ai đó lại ùa về
    trong đôi tay khiến anh buồn nôn; phủ định không chỉ riêng mình anh; tất cả tân
    binh đều cảm thấy như vậy.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000632
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000632: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Tự sự ngôi thứ nhất
    tô đậm mặc cảm tội lỗi sau khi giết người.: modality_and_logic: Bảo toàn phép
    so sánh giả định: cảm giác tội lỗi khiến anh thấy như thể mình đột nhiên trở thành
    một tên tội phạm không thể tha thứ.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000633
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000633: terms: [''các sĩ quan cấp
    cao'', ''tù binh'']: pronouns_and_address: Tự sự ngôi thứ nhất số nhiều của Grantz
    dùng `chúng tôi`.: pov_and_voice: Sự tương phản gay gắt giữa đám tân binh đang
    dằn vặt đau khổ và thái độ lạnh lùng chuyên nghiệp của các sĩ quan đàn anh.: modality_and_logic:
    Bảo toàn quan hệ không gian và sự đối lập: ngay bên cạnh đám tân binh cùng những
    nỗi lo đang giày vò họ, các sĩ quan kỳ cựu/cấp trên lạnh lùng bắt đầu thẩm vấn
    tù binh (xem thêm finding `m3`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000634
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000634: terms: []: pronouns_and_address:
    Lời thoại thẩm vấn dùng câu mệnh lệnh, tự xưng `tôi`.: pov_and_voice: Giọng đe
    dọa lạnh lùng của sĩ quan thẩm vấn đối với tù binh Cộng hòa.: modality_and_logic:
    Bảo toàn mệnh lệnh yêu cầu khai thật kèm điều kiện đe dọa ngầm rằng nếu không
    thì tay có thể trượt.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000635
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000635: terms: [''luật chiến tranh'',
    ''tuyên thệ tù binh'']: pronouns_and_address: Lời thoại thẩm vấn dùng `Chúng tôi`
    và gọi đám tù binh là `Các anh`.: pov_and_voice: Giọng trấn an đúng quy trình
    pháp lý quân sự (đóng vai người tốt/xấu trong thẩm vấn).: modality_and_logic:
    Bảo toàn đầy đủ 3 câu: bảo tù binh bình tĩnh; khẳng định tuân theo luật chiến
    tranh; và nêu điều kiện nếu chịu tuyên thệ tù binh thì sẽ được hưởng quyền của
    mình.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000636
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000636: terms: []: pronouns_and_address:
    Lời thoại thẩm vấn tự xưng `Chúng tôi`.: pov_and_voice: Lời tự nhận là những con
    người tử tế, biết lý lẽ ngay trong cuộc thẩm vấn chiến trường.: modality_and_logic:
    Bảo toàn trọn vẹn 3 câu: đừng lo; chúng tôi không phải bọn tra tấn; chúng tôi
    là những con người tử tế, biết suy xét.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000637
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000637: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `Tôi`.: pov_and_voice: Câu cảm thán bàng hoàng
    trước cảnh thẩm vấn tỉnh bơ ngay sau trận chém giết.: modality_and_logic: Bảo
    toàn câu phủ định ngắn: không thể tin nổi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000638
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000638: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `Tôi`.: pov_and_voice: Tự sự ngôi thứ nhất
    nối tiếp nhịp bàng hoàng ở `p000637`.: modality_and_logic: Bảo toàn ý: không thể
    tin con người lại có thể làm ra chuyện này.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000639
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000639: terms: [''Chiến trường'']:
    pronouns_and_address: Danh ngữ cảm thán không dùng đại từ nhân xưng.: pov_and_voice:
    Nhịp ngắt cô đọng chỉ thẳng vào thực tại chiến trường.: modality_and_logic: Bảo
    toàn cụm danh ngữ ngắn `Chiến trường này.`: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000640
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000640: terms: [''quân ngũ'', ''bổn
    phận'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `Tôi` / `Bản
    thân tôi` kết hợp `mình`.: pov_and_voice: Tự sự ngôi thứ nhất nhìn lại những suy
    nghĩ ngây thơ của bản thân trước khi nếm trải thực chiến.: modality_and_logic:
    Bảo toàn đầy đủ 3 câu và thời gian quá khứ hoàn thành ở câu đầu: từng nghĩ mình
    hiểu rằng đủ mọi chuyện tàn bạo, vô nhân tính sẽ xảy ra; bản thân cũng là một
    người lính; từng nghĩ chỉ cần còn trong quân ngũ thì sẽ không ngần ngại làm tròn
    bổn phận.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000641
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000641: terms: []: pronouns_and_address:
    Câu nhận xét tự giễu ngắn gọn không dùng đại từ.: pov_and_voice: Giọng tự giễu
    chua chát chỉ ra khoảng cách giữa hình dung trong đầu và thực tế.: modality_and_logic:
    Bảo toàn điểm nhấn tự phản tỉnh vào động từ `nghĩ` ở đoạn trước.: emphasis: Bảo
    toàn chính xác `*nghĩ*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000642
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000642: terms: []: pronouns_and_address:
    Câu hỏi tự vấn không dùng đại từ nhân xưng.: pov_and_voice: Câu hỏi nội tâm hoang
    mang trước thực tại vừa trải qua.: modality_and_logic: Bảo toàn câu hỏi ngắn `Nhưng
    đây là gì?`: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000643
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000643: terms: [''bổn phận'', ''tổ
    quốc'']: pronouns_and_address: Câu hỏi tự vấn dùng danh từ chung `người lính`.:
    pov_and_voice: Câu hỏi chất vấn sự mâu thuẫn giữa lý tưởng bảo vệ tổ quốc và hành
    động tàn khốc vừa làm.: modality_and_logic: Bảo toàn nguyên vẹn câu hỏi nghi vấn
    về bổn phận của người lính và việc phải làm để bảo vệ tổ quốc.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000644
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000644: terms: [''Bổn phận'']:
    pronouns_and_address: Câu hỏi tự vấn ngôi thứ nhất dùng `*của tôi*`.: pov_and_voice:
    Câu hỏi ngắn xoáy sâu từ khái niệm bổn phận chung của người lính ở `p000643` vào
    chính bản thân Grantz.: modality_and_logic: Bảo toàn câu hỏi ngắn `Bổn phận *của
    tôi* ư?`: emphasis: Bảo toàn chính xác `*của tôi*` tương ứng thẻ `<html:em>` theo
    đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000645
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000645: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `Tôi` / `tôi` và phản thân `chính mình`.:
    pov_and_voice: Tự sự ngôi thứ nhất diễn tả nỗi sợ đánh mất nhân tính và bản ngã.:
    modality_and_logic: Bảo toàn cả 2 câu: không chịu nổi cảm giác ấy; đó là một cảm
    giác lạ lùng như thể đang đánh mất chính mình mãi mãi.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000646
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000646: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `Tôi` và phản thân `mình`.: pov_and_voice:
    Nhịp ngập ngừng qua dấu chấm lửng khi thừa nhận vừa tự tay sát hại một con người.:
    modality_and_logic: Bảo toàn nhịp lặp ngập ngừng (`lần đầu tiên… lần đầu tiên`)
    và ý không muốn nhớ lại lần đầu tiên chính tay mình giết người.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000647
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000647: terms: [''chiến trường'']:
    pronouns_and_address: Câu nhận định dùng `người ta` và chuyển đại từ ngôi thứ
    hai phiếm chỉ trong nguồn thành `mình` tự nhiên trong mạch độc thoại của Grantz.:
    pov_and_voice: Chiêm nghiệm bi thương về sự mong manh của mạng người nơi tiền
    tuyến.: modality_and_logic: Bảo toàn cả 2 câu: trên chiến trường người ta chết
    quá dễ dàng; những người tối hôm trước còn ăn tối cùng mình, đến bữa sáng hôm
    sau đã biến mất.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000648
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000648: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Câu tóm lược bi kịch
    kép của người lính trên chiến trường.: modality_and_logic: Bảo toàn hai vế song
    hành trong thời gian ngắn ngủi: bản thân giết người, còn bạn bè mình thì bị giết.:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000649
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000649: terms: [''Mặt trận Rhine'']:
    pronouns_and_address: Câu khẳng định không dùng đại từ nhân xưng.: pov_and_voice:
    Lời kết luận đắng cay của Grantz về mặt trận Rhine.: modality_and_logic: Bảo toàn
    mức độ nhấn mạnh kép (`đúng là địa ngục, thật sự là địa ngục`).: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000650
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000650: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Khoảnh khắc yếu lòng
    thoáng qua khi nghĩ đến chuyện đào ngũ/bỏ chạy.: modality_and_logic: Bảo toàn
    sắc thái thoáng qua (`thoáng vụt qua tâm trí tôi`) của ý muốn bỏ chạy.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000651
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000651: terms: []: pronouns_and_address:
    Liên từ chuyển ý ngắt dòng kèm dấu gạch ngang dài.: pov_and_voice: Nhịp ngắt chuẩn
    bị cho sự xuất hiện của người cần vụ kéo Grantz về nếp sinh hoạt quân đội.: modality_and_logic:
    Bảo toàn nguyên vẹn `Nhưng rồi—`.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000652
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000652: terms: [''cần vụ'', ''căn
    cứ hậu phương'', ''sĩ quan'', ''nhà ăn sĩ quan tạm thời'']: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `chúng tôi` và `tôi`.: pov_and_voice: Tự sự
    ngôi thứ nhất chuyển từ dằn vặt nội tâm sang quy chế sinh hoạt của sĩ quan tại
    căn cứ hậu phương.: modality_and_logic: Bảo toàn đầy đủ 2 câu: các cần vụ đến
    báo bữa sáng đã sẵn sàng; vì đang ở căn cứ hậu phương nên với tư cách sĩ quan,
    anh có quyền dùng nhà ăn sĩ quan tạm thời.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000653
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000653: terms: [''nhà ăn sĩ quan'']:
    pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice:
    Giọng tự sự chỉ ra tính bắt buộc ẩn dưới danh nghĩa đặc quyền của sĩ quan.: modality_and_logic:
    Bảo toàn sự chuyển đổi từ `có quyền` ở `p000652` sang nghĩa vụ bắt buộc `*phải*`
    ăn ở nhà ăn sĩ quan.: emphasis: Bảo toàn chính xác `*phải*` tương ứng thẻ `<html:em>`
    theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000654
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000654: terms: [''quân phục'']:
    pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi` / `Tôi` kết hợp
    phản thân `mình`.: pov_and_voice: Tự sự ngôi thứ nhất khắc họa sự xa lạ với chính
    hình ảnh bản thân trong gương sau đêm sát sinh đầu tiên.: modality_and_logic:
    Bảo toàn trọn vẹn 3 câu: trong lúc súc miệng và chỉnh lại quân phục, gương phản
    chiếu khuôn mặt tiều tụy; chỉ trong một ngày đã biến thành quái vật; không thể
    tin đó là mình.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000655
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000655: terms: []: pronouns_and_address:
    Lời lẩm bẩm thành tiếng của Grantz tự xưng `tôi`.: pov_and_voice: Lời thú nhận
    khẽ khàng trước gương rằng giờ mới thực sự biết chiến tranh là gì.: modality_and_logic:
    Bảo toàn nguyên vẹn câu thoại độc백 `“…Giờ thì tôi đã thấy chiến tranh.”`: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000656
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000656: terms: []: pronouns_and_address:
    Trạng ngữ đơn lập không dùng đại từ.: pov_and_voice: Nhịp ngắt miêu tả âm lượng
    câu nói vừa thốt ra.: modality_and_logic: Bảo toàn từ đơn `Khẽ khàng.`: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000657
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000657: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Tự sự ngôi thứ nhất
    nối tiếp `p000655`–`p000656`.: modality_and_logic: Bảo toàn ý những suy nghĩ trong
    lòng tự tuột khỏi miệng.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000658
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000658: terms: []: pronouns_and_address:
    Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice: Tự sự ngôi thứ nhất
    miêu tả nỗ lực kìm nén cơn buồn nôn trước khi ra nhà ăn.: modality_and_logic:
    Bảo toàn chuỗi hành động: tựa vào bồn rửa, chật vật ghìm cơn buồn nôn đang dâng
    lên rồi ngước nhìn trời.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000659
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000659: terms: []: pronouns_and_address:
    Câu hỏi nội tâm dùng đại từ bất định `mọi người`.: pov_and_voice: Tiếng thở dài
    nội tâm không sao hiểu nổi sự bình thản của những người xung quanh.: modality_and_logic:
    Bảo toàn câu hỏi cảm thán: sao mọi người có thể cư xử bình thường trong cái thế
    giới chiến tranh điên rồ này.: emphasis: Bảo toàn chính xác toàn bộ câu trong
    `*...*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000660
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000660: terms: [''nhà ăn sĩ quan'']:
    pronouns_and_address: Tự sự ngôi thứ nhất lược chủ ngữ ở mệnh đề phụ thời gian.:
    pov_and_voice: Tự sự ngôi thứ nhất đẩy cảm giác lạc lõng, ghê sợ lên cao trào
    khi bước vào phòng ăn.: modality_and_logic: Bảo toàn quan hệ thời gian – mức độ:
    ngay khi bước vào nhà ăn sĩ quan, cảm giác ấy càng mãnh liệt hơn.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000661
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000661: terms: [''sĩ quan'', ''tiểu
    đoàn'', ''chỉ huy'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng
    `tôi` / `Tôi`, quy chiếu Tanya bằng `chỉ huy`.: pov_and_voice: Tự sự ngôi thứ
    nhất quan sát khung cảnh đông đúc, nhàn nhã tại nhà ăn sĩ quan và nhịp làm việc
    không ngừng nghỉ của Tanya.: modality_and_logic: Bảo toàn đầy đủ 3 câu: nơi đó
    đông nghịt sĩ quan trong tiểu đoàn; nghe nói chỉ huy đã ăn xong và bắt tay vào
    làm việc (khớp với cảnh Tanya ăn sáng xong và viết thư ở `ch-05-b20` `p000505`);
    còn các sĩ quan thì thong thả ngồi chuyện trò.: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000662
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000662: terms: [''chiến trường'']:
    pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.: pov_and_voice:
    Tự sự ngôi thứ nhất khắc họa sự ghê tởm trước độ vênh giữa địa ngục chiến hào
    đêm qua và bầu không khí vui vẻ sáng nay.: modality_and_logic: Bảo toàn trọn vẹn
    3 câu: bất chấp những chuyện vừa xảy ra, vẫn nghe thấy cả tiếng cười; ai nấy đều
    mỉm cười trò chuyện thư thái; điều gì đó trong khoảng cách/sự tương phản giữa
    cơn điên loạn bao trùm chiến trường với cảnh tượng này khiến anh ghê tởm.: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000663
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000663: terms: [''Người cần vụ'',
    ''đời quân ngũ'']: pronouns_and_address: Tự sự ngôi thứ nhất của Grantz dùng `tôi`.:
    pov_and_voice: Câu kết chương khép lại bằng phản xạ kỷ luật quân đội bắt cơ thể
    nuốt thức ăn dù tâm trí rã rời.: modality_and_logic: Bảo toàn cả 2 câu cùng câu
    hỏi tu từ và mệnh đề nhượng bộ – điều kiện: người cần vụ phục vụ và thức ăn được
    mang ra, nhưng làm sao có thể thấy ngon miệng; dù vậy vẫn giữ thói quen học được
    trong đời quân ngũ là nếu cần thì cứ ép thức ăn xuống cổ họng.: emphasis: none'
  non_canon: true
