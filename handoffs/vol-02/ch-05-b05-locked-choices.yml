  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000124: terms: [''Pixie 01 (Pixie
    01)'']: pronouns_and_address: []: pov_and_voice: Lời đáp vô tuyến ngắn gọn, thản
    nhiên của Pixie 01.: modality_and_logic: Khóa định danh `Pixie 01` và lời xác
    nhận chấp thuận ngắn gọn (`“Pixie 01, rõ. Không sao.”`).: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000125: pronouns_and_address: [''Người
    cựu binh tự xưng `tôi` (kèm `mình` ở `thính lực của mình`, `tai mình`) và quy
    chiếu người chỉ huy mang giọng nữ trên sóng vô tuyến (Pixie 01) bằng `cô ấy`.'']:
    pov_and_voice: Hồi ức ngôi thứ nhất khép lại batch từ góc nhìn hiện tại ở tuổi
    xế chiều của người cựu binh.: modality_and_logic: Khóa câu mở đầu đã sửa theo
    PR-B05-05 (`Dù có tiếng rè nhiễu, tôi vẫn nhận ra giọng cô ấy vui tươi.`) và sự
    đối lập giữa niềm tự tin vào thính lực ở tuổi hiện tại với lần duy nhất trong
    đời không dám tin vào tai mình.: emphasis: Không dùng `*...*`.'
  non_canon: true
