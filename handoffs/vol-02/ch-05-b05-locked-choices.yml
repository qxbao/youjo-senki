  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000123: terms: [''CP (CP)'', ''Pixie
    01 (Pixie 01)'', ''đạn nổ mạnh (high-explosive shells)'', ''ngòi hẹn giờ để nổ
    trên không (fuses timed for air bursts)'']: pronouns_and_address: []: pov_and_voice:
    Lời thoại cảnh báo khẩn thiết từ CP gọi Pixie 01 qua vô tuyến.: modality_and_logic:
    Khóa cặp định danh vô tuyến `CP` và `Pixie 01` (`vol02-ch05-b05-cp-pixie-01`)
    cùng thuật ngữ `đạn nổ mạnh lắp ngòi hẹn giờ để nổ trên không` (`vol02-ch05-b05-airburst-timed-fuse`).:
    emphasis: Không dùng `*...*`.'
  non_canon: true
