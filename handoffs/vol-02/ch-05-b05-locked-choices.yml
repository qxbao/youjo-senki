choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000103
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000103: terms: [''người cựu binh
    (the former soldier)'', ''chiến tranh (the war)'']: pronouns_and_address: [''Trần
    thuật ngôi thứ ba quy chiếu người lính năm xưa bằng danh ngữ `người cựu binh`
    và đại từ `ông`.'']: pov_and_voice: Trần thuật ngôi thứ ba mở khung hồi tưởng
    hậu chiến sau dấu ngắt cảnh (`space-break`).: modality_and_logic: Giữ câu hỏi
    tu từ về khoảng thời gian đã trôi qua kể từ sau chiến tranh và mệnh đề tương phản
    khẳng định ký ức của ông về thời kỳ đó vẫn rõ mồn một.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000104
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000104: terms: [''viện binh (reinforcements)'',
    ''mức độ nguy hiểm (the threat level)'']: pronouns_and_address: [''Hồi ức ngôi
    thứ nhất số nhiều của người cựu binh dùng `chúng tôi` cho đơn vị dưới chiến hào.'']:
    pov_and_voice: Hồi ức ngôi thứ nhất của người cựu binh, chuyển cảnh bằng `space-break`
    vào thời điểm giữa trận đánh.: modality_and_logic: Giữ trọn vẹn sắc thái khả thể
    (`mức độ nguy hiểm mà chúng tôi phải đối mặt có thể đã giảm đi đôi chút`) và hệ
    quả tất yếu nếu mất cảnh giác (`nhưng nếu chúng tôi cũng buông lỏng cảnh giác
    thì sẽ biến thành những cái xác câm lặng`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000105
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000105: terms: [''đại đội (company)'',
    ''thương binh (the wounded)'', ''súng máy (machine guns)'', ''nòng mới (replacement
    barrels)'', ''bộ phận Hậu cần (Logistics)'', ''tuyến hỏa lực (the firing line)'']:
    pronouns_and_address: [''Dùng `đại đội chúng tôi` và `chúng tôi`; quy chiếu những
    chiếc nòng súng thay thế bằng `chúng`.'']: pov_and_voice: Hồi ức ngôi thứ nhất
    của người cựu binh.: modality_and_logic: Giữ chuỗi công việc tranh thủ lúc ngớt
    giao tranh (dọn người chết, chuẩn bị cáng cho thương binh, chuẩn bị thay nòng
    súng máy bị mòn) và nghịch lý gây thất vọng: bộ phận Hậu cần có thừa nòng súng
    nhưng thiếu nhân lực để mang ra tuyến hỏa lực giữa trận đánh lớn.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000106
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000106: terms: [''đội (team)'',
    ''đồng đội cùng đại đội (company mates)'']: pronouns_and_address: [''Người kể
    tự xưng `tôi` (kèm `mình` ở mệnh đề phụ `bài bạc cứ như ghét mình vậy`); lời đồng
    đội đòi nợ bài dùng cặp xưng hô `Cậu – bọn này`.'']: pov_and_voice: Hồi ức ngôi
    thứ nhất pha chất hài hước tự trào và chút ngậm ngùi hậu chiến của người cựu binh.:
    modality_and_logic: Giữ nguyên cách ví von hài hước về trò đánh bài (`nghi thức
    vừa truyền thống vừa thiêng liêng mang tên đánh bài`), hai khả năng suy đoán về
    vận đen hoặc trò gian lận của đồng đội, và nỗi tiếc nuối ở hiện tại (`giờ tôi
    chẳng còn cách nào biết được`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000107
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000107: terms: [''hầm ở căn cứ
    (the base dugout)'', ''hạ sĩ quan Hậu cần (the Logistics NCO)'', ''phụ tùng (the
    parts)'']: pronouns_and_address: [''Người kể tự xưng `tôi`.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Khóa danh ngữ trung
    tính `hầm ở căn cứ` theo PR-B05-02 và `vol02-ch05-b05-dugout` (không tự gán chức
    năng chỉ huy hay cấp đại đội), cùng kết cục sau màn thương lượng với hạ sĩ quan
    Hậu cần là phải tự vác đống phụ tùng.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000108
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000108: terms: [''hậu phương (the
    rear)'', ''mặt trận Rhine (the Rhine front)'']: pronouns_and_address: [''Dùng
    chủ ngữ khái quát `Người ta`.'']: pov_and_voice: Nhận định tổng kết từ trải nghiệm
    thực chiến của người cựu binh.: modality_and_logic: Khóa thuật ngữ `mặt trận Rhine`
    theo `vol02-ch05-b05-rhine` (không tự thêm danh từ phân loại `sông`) và sự đối
    lập giữa lầm tưởng phổ biến rằng hậu phương an toàn với thực tế trên mặt trận
    Rhine lúc bấy giờ.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000109
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000109: terms: [''tuyến hỏa lực
    (firing lines)'', ''chiến hào (the trenches)'', ''quân mình (friendlies)'', ''pháo
    kích (bombardments)'']: pronouns_and_address: [''Người kể tự xưng `tôi`; dùng
    `quân mình` cho phe ta và `họ` cho pháo binh.'']: pov_and_voice: Hồi ức ngôi thứ
    nhất của người cựu binh.: modality_and_logic: Giữ nguyên câu ước giả định trái
    thực tế trong quá khứ (`Giá mà tôi được đối mặt với quân địch ở một nơi như thế`)
    và quan hệ nhân quả: khoảng cách giữa các chiến hào quá gần làm tăng nguy cơ bắn
    nhầm quân mình nên thường không thể pháo kích.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000110
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000110: terms: [''lính pháo binh
    (artillerymen)'', ''Đế quốc (Empire)'', ''Cộng hòa (Republic)'']: pronouns_and_address:
    [''Quy chiếu lính pháo binh bằng `họ`; dùng `tất cả chúng tôi` và `đồng đội` khi
    nói về tâm lý chung của binh lính hai phe.'']: pov_and_voice: Hồi ức ngôi thứ
    nhất của người cựu binh.: modality_and_logic: Giữ sắc thái thông tin nghe lại
    (`nghe nói lính pháo binh cũng ghét bắn vào những khu vực nguy hiểm...`) và điểm
    chung giữa cả Đế quốc lẫn Cộng hòa là không ai muốn làm nổ tung đồng đội mình.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000111
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000111: terms: [''đạn nổ mạnh (high
    explosives)'', ''lính bắn tỉa (snipers)'', ''mìn (land mines)'', ''súng trường
    (rifles)'', ''tuyến đầu (the forward-most line)'']: pronouns_and_address: [''Dùng
    `quân mình` và cấu trúc điều kiện khái quát.'']: pov_and_voice: Hồi ức ngôi thứ
    nhất phân tích tâm lý chiến hào của người cựu binh.: modality_and_logic: Giữ nguyên
    phương châm tác chiến của cả hai quân đội (thà bắn về phía địch dù trượt còn hơn
    trút đạn nổ mạnh xuống vị trí quân mình) và hệ quả thực tế: ở tuyến đầu chỉ cần
    dè chừng lính bắn tỉa, mìn và súng trường thì ít có nguy cơ mất mạng ngay lập
    tức.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000112
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000112: terms: [''tiền tuyến (the
    front line)'', ''Quân đội Cộng hòa (the Republican Army)'', ''đạn pháo (shells)'',
    ''Huy hiệu Pháo binh Dã chiến (the Field Artillery Badge)'', ''công báo (the official
    gazette)'', ''pháo binh Cộng hòa (the Republican artillery)'', ''sự nghiệp chiến
    tranh của Đế quốc (the imperial war cause)'']: pronouns_and_address: [''Người
    kể tự xưng `tôi`, dùng `chúng tôi` cho đơn vị mình trong lời đề cử và câu trích
    dẫn trên công báo.'']: pov_and_voice: Hồi ức ngôi thứ nhất pha chất hài đen châm
    biếm của người cựu binh.: modality_and_logic: Khóa tên phần thưởng `Huy hiệu Pháo
    binh Dã chiến` theo `vol02-ch05-b05-field-artillery-badge`, giai thoại đạn pháo
    của Quân đội Cộng hòa quét sạch chính quân Cộng hòa đang tràn vào vị trí, và lời
    đề cử mỉa mai được đăng lên công báo như một trò đùa.: emphasis: Khóa chính xác
    câu trích dẫn in nghiêng `*Chúng tôi hoan nghênh màn thể hiện xuất sắc về trình
    độ huấn luyện và đóng góp cho sự nghiệp chiến tranh của Đế quốc từ pháo binh Cộng
    hòa.*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000113
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000113: terms: [''chiến trường
    (battlefield)'', ''hậu phương (the rear)'']: pronouns_and_address: [''Dùng `chúng
    tôi`.'']: pov_and_voice: Hồi ức ngôi thứ nhất dẫn dắt lập luận của người cựu binh.:
    modality_and_logic: Giữ vai trò bản lề chuyển ý: trên một chiến trường như thế,
    chỉ có duy nhất một lý do khiến hậu phương bị coi là nơi nguy hiểm nhất.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000114
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000114: terms: [''máy vô tuyến
    (radios)'', ''sở chỉ huy địch (enemy command)'', ''hầm ở căn cứ (a base dugout)'',
    ''lính mới (a newbie)'', ''công sự ngầm (underground fortifications)'']: pronouns_and_address:
    [''Dùng `phe ta`, `chúng` (chỉ địch) và đại từ phản thân `mình` (quy chiếu `lính
    mới`).'']: pov_and_voice: Hồi ức ngôi thứ nhất giải thích thực tế chiến trường
    của người cựu binh.: modality_and_logic: Khóa đồng thời hai sửa chữa đã nghiệm
    thu: (1) danh ngữ trung tính `hầm ở căn cứ` và quan hệ nguồn phát `từ sở chỉ huy
    địch hoặc một hầm ở căn cứ của chúng` theo PR-B05-02 (`vol02-ch05-b05-dugout`);
    (2) cấu trúc nhân quả chuẩn xác tại câu 3 theo PR-B05-01 (`Chẳng cần đến hai ngày,
    ảo tưởng của lính mới rằng những công sự ngầm kiên cố sẽ bảo đảm an toàn cho mình
    đã tan tành`), đặt sự kiên cố của công sự ngầm vào đúng nội dung niềm tin sai
    lầm của lính mới chứ không biến công sự thành tác nhân phá hủy niềm tin.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000115
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000115: terms: [''tiền tuyến (the
    front line)'', ''thiết bị liên lạc (the communications apparatus)'', ''đạn xuyên
    giáp hạng nặng (heavy armor-piercing rounds)'', ''hầm (dugouts)'']: pronouns_and_address:
    [''Dùng chủ ngữ khái quát `Người ta`.'']: pov_and_voice: Hồi ức ngôi thứ nhất
    của người cựu binh.: modality_and_logic: Khóa danh từ trung tính `hầm` theo `vol02-ch05-b05-dugout`
    và giữ đúng mạch suy luận chiến thuật: khi pháo kích tiền tuyến ít hiệu quả thì
    người ta trút mưa thép vào thiết bị liên lạc, và trước đạn xuyên giáp hạng nặng
    thì hầm gần như vô tác dụng.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000116: terms: [''hầm (a cellar)'',
    ''đạn pháo (artillery shells)'', ''chiến hào (trench)'', ''hầm vô tuyến (a radio
    dugout)'']: pronouns_and_address: []: pov_and_voice: Hồi ức ngôi thứ nhất của
    người cựu binh.: modality_and_logic: Khóa thuật ngữ `hầm vô tuyến` theo `vol02-ch05-b05-dugout`
    (nơi duy nhất nguồn xác định rõ công dụng vô tuyến của hầm), cùng sự tương phản
    tột cùng về mặt thời gian (`Vừa lúc trước... ngay sau đó...—thế là hết`) và nỗi
    sợ chết ngạt dưới chiến hào sập.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000117: terms: [''trạm liên lạc
    (the communications base)'', ''hầm (dugout)'']: pronouns_and_address: [''Dùng
    `người ta`, `Không ai` và `ai nấy`.'']: pov_and_voice: Hồi ức ngôi thứ nhất của
    người cựu binh.: modality_and_logic: Khóa hai lựa chọn thuật ngữ theo PR-B05-02:
    `trạm liên lạc` (`vol02-ch05-b05-communications-base`) và `hầm` (`vol02-ch05-b05-dugout`,
    không thêm định ngữ chỉ huy), cùng điều kiêng kỵ bất thành văn là không giữ trạm
    liên lạc ở cùng một hầm quá bốn mươi tám giờ.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000118: terms: [''máy vô tuyến
    (radios)'', ''tiền tuyến (the front)'', ''cờ hiệu và kèn (semaphores and trumpets)'',
    ''Công nghệ vô tuyến (Wireless technology)'', ''màn sương chiến tranh (the fog
    of war)'']: pronouns_and_address: [''Dùng `người ta` và `chúng tôi`; quy chiếu
    máy vô tuyến bằng `chúng` và công nghệ vô tuyến bằng `nó`.'']: pov_and_voice:
    Hồi ức ngôi thứ nhất kết hợp nhận xét từ thời điểm hiện tại hậu chiến của người
    cựu binh.: modality_and_logic: Giữ lý do bắt buộc phải đưa máy vô tuyến ra tiền
    tuyến (không thể duy trì một đội quân lớn chỉ bằng cờ hiệu và kèn) và mốc thời
    gian nối tới hiện tại (`đến tận ngày nay vẫn tiếp tục dựa vào nó`).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000119: terms: [''dòng thông tin
    liên lạc (the flood of messages)'', ''nhân viên vô tuyến (the radio operators)'',
    ''chiến hào (the trenches)'']: pronouns_and_address: []: pov_and_voice: Hồi ức
    ngôi thứ nhất của người cựu binh.: modality_and_logic: Khóa câu văn đã sửa theo
    PR-B05-04 (`Việc nghe lỏm dòng thông tin liên lạc đã thành thói quen không chỉ
    của nhân viên vô tuyến mà cả những người lính trong chiến hào luôn háo hức chờ
    tin đồn`), giữ chuẩn xác cấu trúc tăng tiến `không chỉ... mà cả...` và từ vựng
    phù hợp bối cảnh vô tuyến quân sự.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000120: pronouns_and_address: [''Người
    kể tự xưng `tôi`, dùng `mình` cho bộ phận cơ thể (`tai mình`) và `nó` cho cuộc
    hội thoại vô tuyến vừa nghe được.'']: pov_and_voice: Hồi ức ngôi thứ nhất của
    người cựu binh.: modality_and_logic: Giữ mối liên hệ nhân quả từ thói quen vểnh
    tai nghe lỏm đến việc nghe thấy một điều khó tin tới mức nghi ngờ trận đánh ác
    liệt đã làm hỏng tai mình.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000121: terms: [''Đơn vị (unit)'',
    ''đạn pháo quân mình (a friendly shell)'']: pronouns_and_address: [''Trong thoại
    vô tuyến, người chỉ huy (Pixie 01) dùng `Đơn vị tôi` và `chúng ta`.'']: pov_and_voice:
    Lời thoại vô tuyến cứng rắn, tự tin của chỉ huy đơn vị (Pixie 01).: modality_and_logic:
    Giữ lời khẳng định phủ định tuyệt đối (`Đơn vị tôi chẳng có tên ngốc nào để bị
    đạn pháo quân mình bắn trúng đâu`) và mệnh lệnh ưu tiên cao nhất cho việc khống
    chế, chặn đứng quân địch.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000122: terms: [''chỉ huy (commander)'',
    ''pháo kích (a bombardment)'']: pronouns_and_address: [''Người kể tự xưng `Tôi`;
    dùng `quân mình` cho đơn vị của vị chỉ huy kia.'']: pov_and_voice: Phản ứng sững
    sờ trong hồi ức ngôi thứ nhất của người cựu binh.: modality_and_logic: Khóa câu
    hỏi đã sửa theo PR-B05-03 (`Một chỉ huy lại yêu cầu pháo kích ngay trên đầu quân
    mình ư?`), bảo toàn rõ nguy cơ pháo nổ ngay phía trên đầu quân mình cùng dấu gạch
    ngang bỏ lửng (`thì—`) khi câu thoại tiếp theo vang lên.: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000123
