segment_id_end: YS-LN02/Text/part0018.xhtml/p000140
choices:
- segment_id: YS-LN02/Text/part0018.xhtml/p000116
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000116: locks: [''Giữ thán từ mở
    đầu `Ừm` theo quy ước filler của người kể chuyện và cụm phủ định `vui chơi thả
    cửa, không đặt mức trần cho khoản chi rượu bia nhé`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000117
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000117: locks: [''Giữ đại từ trần
    thuật `nó` (Tanya), tân ngữ `cô ấy` (Serebryakov) và cấu trúc câu ngắt lửng `Đúng
    lúc nó định bảo cô ấy làm đi thì—` theo `DEC-P01-001` và bản sửa M2.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000118
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000118: locks: [''Giữ danh xưng
    `Thiếu tá`, đại từ `chúng ta`, tiểu từ kính ngữ `ạ`, và cụm `có đủ rượu bia miễn
    phí để bơi trong đó đấy ạ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000119
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000119: locks: [''Giữ cấp bậc –
    tên riêng `Trung úy Weiss` và cụm `Người ngắt lời với vẻ mặt đắc thắng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000120
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000120: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` theo `DEC-P01-001`, đại từ `hắn` chỉ Weiss trong
    ý nghĩ nghi ngờ hài hước của Tanya, và các cụm `cố ngậm miệng lại`, `vẻ mặt không
    tin nổi của nó đã thay lời muốn nói`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000121
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000121: locks: [''Giữ đại từ `chúng
    tôi`, danh từ `căng tin`, và cụm `nhờ một đơn vị địa phương rất tử tế`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000122
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000122: locks: [''Giữ cấp bậc –
    tên riêng `Trung úy Serebryakov` theo mục `vol02-ch03-b12-serebryakov-rank-variation`,
    đại từ `mình` và `cô ấy`, cùng cụm mở đầu câu hai `Một phần cũng vì đã ở bên nhau
    một thời gian` theo bản sửa followup đã signoff.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000123
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000123: locks: [''Giữ định danh
    đã khóa trong ledger `Tiểu đoàn Viper` và cụm `đã bỏ tiền túi mua số rượu này
    như một cử chỉ thiện chí, có thể nói vậy` theo bản sửa M1.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000124
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000124: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng ở câu đầu `*Tốt lắm.*` theo `DEC-P01-002`, tên riêng `Tanya`,
    các đại từ `chúng ta`, `họ`, đại từ nội tâm `mình` theo `DEC-P01-001`, và cụm
    phủ định `do quy định quân đội và tuổi tác của mình, dù muốn đến đâu thì mình
    cũng không thể uống một giọt`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000125
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000125: locks: [''Giữ danh xưng
    `Trung úy`, định danh `Tiểu đoàn Viper`, đại từ nội tâm `mình` ở câu xen giữa
    (`Ít nhất mình cũng muốn được cắn một miếng gà quay.`), và các câu thoại `Chúng
    ta phải nâng ly cảm ơn Tiểu đoàn Viper. Nhờ họ mà tôi có thể đãi tiểu đoàn mình.`
    theo mục `vol02-ch03-b12-tanya-dialogue-self-reference` và bản sửa followup đã
    signoff.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000126
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000126: locks: [''Giữ từ đáp lễ
    phép trung tính `Vâng` theo mục `vol02-ch03-b12-neutral-acknowledgment` và câu
    `“Vâng, đúng là cảm ơn họ bao nhiêu cũng không đủ.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000127
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000127: locks: [''Giữ danh từ `pháp
    sư`, đại từ `họ`, chuỗi thuật ngữ đãi ngộ `phụ cấp triển khai, phụ cấp điều động,
    phụ cấp nguy hiểm` theo mục `vol02-ch03-b12-danger-pay` và bản sửa followup đã
    signoff, cùng cụm `gom quỹ của cả tiểu đoàn lại`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000128
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000128: locks: [''Giữ toàn văn
    lời thoại `“Đúng vậy. Đây cũng là dịp tốt. Gửi tin mời họ đến dự tiệc đi.”` theo
    bản sửa followup đã signoff.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000129
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000129: locks: [''Giữ các đại từ
    nội tâm `chúng ta`, `ta`, `mình` theo `DEC-P01-001`, và các cụm `những đồng minh
    tốt bụng đã làm suy yếu con mồi giúp chúng ta trước khi ta đến`, `làm sáng tỏ
    hiểu lầm hẳn đã nảy sinh từ lời tuyên xưng đức tin ghê tởm kia`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000130
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000130: locks: [''Giữ đại từ nội
    tâm `Mình` theo `DEC-P01-001` và toàn văn câu `Mình bình thường.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000131
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000131: locks: [''Giữ đại từ nội
    tâm `Mình` / `mình` theo `DEC-P01-001` và câu `Mình phải ngăn những lời đồn kỳ
    quặc làm tổn hại danh tiếng của mình.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000132
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000132: locks: [''Giữ định danh
    `căn cứ Lục quân Đế quốc` và các cụm `Dọc eo biển, giờ khắc quyết chiến đã gần
    kề`, `Sĩ quan và binh lính chạy ngược chạy xuôi, ai nấy đều căng thẳng thấy rõ—không
    một ai thư thái`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000133
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000133: locks: [''Giữ cụm `đủ khôn
    ngoan để sợ giao tranh` theo bản sửa followup đã signoff, cùng các cụm `một chiến
    dịch quy mô lớn`, `sự lãng mạn của quân đội`, `nếm trải chiến thắng ngọt ngào`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000134
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000134: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` theo `DEC-P01-001`, định danh đã khóa trong ledger
    `Hạm đội Bắc Hải` theo mục `vol02-ch03-b12-northern-sea-fleet`, và các cụm `phòng
    họp chỉ huy trên kỳ hạm đã được chỉ định`, `tràn đầy khí thế chiến đấu`, `nóng
    lòng xuất kích`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000135
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000135: locks: [''Giữ đại từ trần
    thuật `nó` theo `DEC-P01-001`, định danh `Đế quốc`, và các thuật ngữ hải quân
    – đổ bộ `các yếu tố tác chiến`, `tàu vận tải`, `tàu đổ bộ`, `cuộc tấn công đổ
    bộ`, `tàu vận tải cao tốc`, `khâu điều phối mang hiệu suất thường thấy của Đế
    quốc`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000136
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000136: locks: [''Giữ tên riêng
    `Tanya`, đại từ trần thuật `nó` và phản thân `mình` theo `DEC-P01-001`, cùng cụm
    `đơn vị của nó được kỳ vọng rất nhiều với vai trò tiên phong`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000137
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000137: locks: [''Giữ đại từ trần
    thuật `nó` / `Nó` và phản thân `mình` theo `DEC-P01-001`, cụm `che giấu quyết
    tâm đáp lại những kỳ vọng ấy` theo bản sửa followup đã signoff, và các cụm `tài
    liệu phát trước cuộc họp`, `tránh những rắc rối có thể ngăn ngừa trong chiến dịch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000138
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000138: locks: [''Giữ đại từ trần
    thuật `nó` theo `DEC-P01-001`, câu `Đáp xuống, chiếm các khẩu pháo bờ biển.` theo
    bản sửa followup đã signoff, và câu điều kiện cuối `Nếu thất bại, cả quân đội
    sẽ mắc kẹt trong các vịnh hẹp.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000139
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000139: locks: [''Giữ đại từ `tôi`
    và câu thông báo `“Đã đến giờ, tôi xin phép bắt đầu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0018.xhtml/p000140
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0018.xhtml/p000140: locks: [''Giữ cụm `một
    nhân viên tham mưu Hải quân Đế quốc` theo bản sửa followup đã signoff và cụm `người
    chỉ huy chiến dịch—tư lệnh hạm đội`.'']'
  non_canon: true
