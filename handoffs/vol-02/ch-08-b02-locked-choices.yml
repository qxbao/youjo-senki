choices:
- segment_id: YS-LN02/Text/part0034.xhtml/p000037
  kind: locked_constraint
  value: Giữ mệnh đề mở đầu “Mọi sự kháng cự đều vô ích”, đại từ trần thuật “nó” theo
    DEC-P01-001, cấu trúc bị động “bị ép mặc vào một bộ trang phục nhục nhã” và mức
    độ phủ định “đến mức gần như không thể chịu đựng nổi”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000038
  kind: locked_constraint
  value: Giữ cấu trúc danh ngữ mô tả hai món đồ (“Một chiếc chân váy diêm dúa dài
    chạm sàn” và “một đôi giày nữ quai mảnh”) cùng hai vế phủ định “có thiết kế không
    tài nào hiểu nổi” và “không đời nào hành quân được”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000039
  kind: locked_constraint
  value: Giữ quan hệ đối sánh “vẫn còn chịu được nếu so với những lời thì thầm kèm
    theo nụ cười”, mốc thời gian “Trước lúc ấy”, đại từ “nó” theo DEC-P01-001 và ý
    “vẫn còn chỗ để tranh luận”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000040
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp đại từ “Bọn chị - em”, dấu ba chấm lửng
    trước mệnh đề đối lập về bác sĩ phẫu thuật, lời khen da mịn màng cùng đôi chân
    thon gọn và câu đề nghị “Thử bộ này một chút nhé.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000041
  kind: locked_constraint
  value: Giữ đại từ “nó” theo DEC-P01-001, chi tiết chiếc váy diêm dúa khác để lộ
    chân khi ngồi xuống, thuật ngữ “áo corset” và mức độ phủ định “bị siết chặt đến
    mức không tưởng khiến nó gần như chẳng thở nổi”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000042
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng hai câu độc thoại nội tâm `*Nhanh
    lên, nhanh lên, làm ơn kết thúc đi mà.*` và `*Cuối cùng cũng xong rồi.*` theo
    DEC-P01-002, chủ thể “Tanya”, đại từ trần thuật “nó” / “mình” theo DEC-P01-001,
    khoảng thời gian “suốt nửa ngày trời”, chủ thể “đôi tay của người phụ nữ phụ trách”
    và bước ngoặt “suýt nữa đã thở phào thành tiếng thì chợt nghe thấy một câu khiến
    tim mình chết lặng”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000043
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, nhận xét “bộ đồ đơn giản này là đủ cho ngày
    đầu tiên rồi” và lời rủ “Giờ thử trang điểm chút nhé!”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000044
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Ngày đầu tiên? …Ngày đầu
    tiên ư?!*` kèm dấu ba chấm và dấu chấm hỏi chấm than theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000045
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “em” và câu hỏi xen cảm thán “Em có chăm
    sóc tóc tử tế không đấy?!”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000046
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, thuật ngữ “quy định vệ sinh” và dấu gạch ngang
    dài ngắt lời ở cuối câu `—`.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000047
  kind: locked_constraint
  value: Giữ đại từ “nó” theo DEC-P01-001, định danh “Lục quân Đế quốc”, cụm trích
    dẫn trong ngoặc kép “để phân biệt giới tính của các quân nhân trẻ tuổi”, đối tượng
    “những thiếu nữ theo học tại học viện trước khi đến tuổi nghĩa vụ quân sự phải
    để tóc dài ngang vai” và nguyên nhân “chủ yếu là vì các tiểu thư quý tộc”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000048
  kind: locked_constraint
  value: Giữ định danh “Lục quân Đế quốc”, chủ thể “Tanya”, đại từ “nó” / “mình” theo
    DEC-P01-001, ý tự hào đã làm tròn nghĩa vụ và câu khẳng định có dấu gạch ngang
    dài “Tóc nó có độ dài hoàn hảo—nó đã đo đạc hẳn hoi.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000049
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, mệnh lệnh “Dừng ngay ở đó.” và câu hỏi “Em có
    chải tóc không đấy?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000050
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại và lời ấp úng kèm dấu ba chấm “Xin lỗi, ờ…”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000051
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “em” và câu hỏi cảm thán “Bình thường
    em dùng loại lược nào?!”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000052
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cụm “Loại cấp phát tiêu chuẩn ạ…” kèm tiểu từ
    lễ phép và dấu ba chấm.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000053
  kind: locked_constraint
  value: Giữ đại từ “Nó” / “nó” theo DEC-P01-001, chủ thể “quý cô kia” và hai vế phủ
    định “Nó chẳng thể làm gì được.” cùng “và nó không tài nào cứu vãn nổi.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000054
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “em”, dấu ba chấm ngập ngừng và các thuật
    ngữ “Loại cấp phát tiêu chuẩn”, “nhựa xenlulo”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000055
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại và câu đáp lễ phép kèm dấu ba chấm “Vâng, đúng
    rồi ạ…”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000056
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp đại từ “Bọn chị - em” và ý “phải dạy lại
    em từ con số không mới được!”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000057
  kind: locked_constraint
  value: Giữ sự phân biệt chủ thể giữa “cô ấy” (nữ nhân viên lấy ra mấy chiếc lược
    và thao thao bất tuyệt về từng chiếc) với “Tanya” / “mình” và hình ảnh so sánh
    “cảm thấy như tâm trí mình đang bị bào mòn từng mảng theo đúng nghĩa đen”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000058
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*…Hỡi Being X, lần này
    tôi chẳng thèm bận tâm dù đó có là nhà ngươi đi chăng nữa…*` theo DEC-P01-002,
    dấu ba chấm ở đầu và cuối đoạn, định danh “Being X”, cặp đại từ “tôi - nhà ngươi”
    và phủ định nhượng bộ.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000059
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Nếu ông tự xưng là Thượng
    đế, thì ít nhất ông cũng phải giải quyết được cái rắc rối với mái tóc của tôi
    chứ. Không, mình biết là bất khả thi. Mình biết là bất khả thi, nhưng mà…*` theo
    DEC-P01-002, định danh “Thượng đế”, sự chuyển đổi đại từ từ “ông - tôi” sang tự
    quy chiếu “mình” / “Mình” theo DEC-P01-001 và điệp cấu trúc phủ định “biết là
    bất khả thi”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000060
  kind: locked_constraint
  value: Giữ đại từ “nó” / “mình” theo DEC-P01-001, chi tiết quẩn quanh với những
    điều phi lý có thể ảnh hưởng đến sứ mệnh cả đời và hình ảnh “một thứ trông giống
    như thanh sắt nung đóng dấu” kéo nó giật bắn người tỉnh lại.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000061
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại và câu hỏi dè dặt kèm dấu ba chấm “Ờm, xin lỗi,
    thứ đó là gì vậy ạ…?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000062
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, dấu nhấn mạnh chữ nghiêng chỉ ở từ `*có*` theo
    DEC-P01-002, cặp đại từ “Chị - em”, thuật ngữ “uốn tóc” và câu rủ “Hừm, muốn thử
    không?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000063
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, từ phủ định mở đầu “Không, ờ, à” và câu hỏi
    “bằng cái thanh sắt đó ạ?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000064
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “em” và cụm “uốn lượn sóng”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000065
  kind: locked_constraint
  value: Giữ sự phân biệt chủ thể giữa “Cô ấy” (tự tin vào kỹ thuật uốn lượn sóng)
    và “Tanya” / “nó” theo DEC-P01-001 với ý nghĩ duy nhất là vạch ra kế hoạch đào
    thoát khi nghe tin thanh sắt sẽ được sử dụng.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000066
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, lời từ chối khéo “Ờm, thôi khỏi ạ, à, em nghĩ
    làm thế sẽ cản trở nhiệm vụ của mình…” và đại từ “em” / “mình”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000067
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, cặp đại từ “chị - em”, ý tạm gác việc uốn tóc
    lại và câu chốt “Thế thì ít nhất chị sẽ trang điểm cho em thật xinh.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000068
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, dấu ba chấm mở đầu, đại từ “Em” và câu hỏi phủ
    định “Em không thể cứ giữ nguyên vẻ ngoài như mọi khi được sao ạ?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000069
  kind: locked_constraint
  value: Giữ đại từ “Nó” / “nó” / “mình” theo DEC-P01-001, giả định phủ định “nhưng
    nếu không thể lên tiếng, thì điều đó sẽ trở thành sự thật không thể chối cãi”,
    thuật ngữ “lễ phục kiểu I” và câu hỏi gián tiếp cuối đoạn không in nghiêng “Bộ
    lễ phục kiểu I của nó thực sự không dùng được sao?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000070
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “em”, lời khuyên nói chuyện dịu dàng
    nữ tính hơn và câu phủ định “Đâu phải cứ ở trong quân đội là phải cư xử như đàn
    ông đâu.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000071
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ “em” và câu đáp kèm dấu ba chấm “Ồ, thế
    này dễ cho em hơn ạ…”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000072
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ gộp “Chúng ta”, mốc thời gian “còn bốn
    ngày nữa là đến sự kiện rồi” và lời khích lệ cuối câu.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000073
  kind: locked_constraint
  value: Giữ đại từ “nó” theo DEC-P01-001 và câu trần thuật ngắn gọn “Thế là, ý kiến
    của nó đã bị bác bỏ thẳng thừng.”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000074
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Nếu mọi chuyện cứ diễn
    ra thế này, mình thà chọn chiến trường còn hơn. Mình muốn quay lại đó…*` theo
    DEC-P01-002 và đại từ nội tâm “mình” / “Mình” theo DEC-P01-001.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000075
  kind: locked_constraint
  value: Giữ đại từ “Nó” theo DEC-P01-001 và câu hỏi tu từ “Nó đã thầm thì câu đó
    tận sâu trong lòng bao nhiêu lần rồi không biết?”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000076
  kind: locked_constraint
  value: Giữ mốc thời gian “Chuyện đó tiếp diễn suốt ba ngày.”, đại từ “Nó” theo DEC-P01-001
    và chuỗi chi tiết “cảm giác kỳ quặc của lớp phấn nền quệt lên mặt, sự bết dính
    của son môi, chiếc áo corset bó nghẹt, tất cả mọi thứ”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000077
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*…Nếu bộ phận tuyên truyền
    muốn có một cô bé yêu nước đáng mến và nếu điều đó được quân đội công nhận là
    mệnh lệnh… thì mình đành chịu thôi…*` theo DEC-P01-002, ba dấu ba chấm, các cụm
    “bộ phận tuyên truyền”, “cô bé yêu nước đáng mến” và đại từ nội tâm “mình” theo
    DEC-P01-001.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000078
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Kìm nén bản thân lại.*`
    theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000079
  kind: locked_constraint
  value: Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Đây là công việc. Cười
    lên, cố nào, cười lên.*` theo DEC-P01-002.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000080
  kind: locked_constraint
  value: Giữ dấu ngoặc kép hội thoại, đại từ tự xưng trước công chúng “Tôi”, biệt
    danh “Bạch Ngân” và tên đầy đủ “Tanya Degurechaff”.
  non_canon: true
- segment_id: YS-LN02/Text/part0034.xhtml/p000081
  kind: locked_constraint
  value: Giữ ký hiệu kết thúc chương trong ngoặc đơn “(Hết)”, không thêm dấu nhấn
    mạnh.
  non_canon: true
