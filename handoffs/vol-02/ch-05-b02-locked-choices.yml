segment_id_end: YS-LN02/Text/part0026.xhtml/p000048
choices:
- segment_id: YS-LN02/Text/part0026.xhtml/p000025
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000025: terms: [''gà tây Lễ Phục
    Sinh (Easter turkey)'', ''lời hứa suông (empty promise)'']: pronouns_and_address:
    [''Lời thoại trực tiếp giữa đồng đội trong chiến hào dùng cặp đại từ `Tôi – Cậu`.'']:
    pov_and_voice: Lời thoại khẩu ngữ mỉa mai của người lính mở đầu batch, có đầy
    đủ cặp dấu ngoặc kép bao quanh theo sửa chữa B02-F02.: modality_and_logic: Khóa
    hình ảnh đặt cược để khẳng định độ chắc chắn (`Cậu có thể đem cả con gà tây Lễ
    Phục Sinh ra cá: đó chỉ là lời hứa suông`) theo sửa chữa B02-F01, không biến thành
    lời yêu cầu tuyên thệ.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000026
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000026: terms: [''Đạn pháo nổ mạnh
    (High explosives)'', ''yểm trợ sát sao và đầy đủ (close, full support)'', ''tân
    binh (new recruits)'', ''lính cũ (old hands)'', ''đám chỉ huy cấp cao (the brass)'']:
    pronouns_and_address: [''Người kể tự xưng `tôi` (khi nêu nhận định cá nhân nhìn
    lại) và `chúng tôi` (tập thể đơn vị).'']: pov_and_voice: Tự sự hồi tưởng ngôi
    thứ nhất của người cựu binh.: modality_and_logic: Khóa ba lựa chọn đã nghiệm thu:
    (1) nhận định hồi tưởng dè dặt ở câu 4 (`Vì vậy, tôi nghĩ ngay từ đầu chúng tôi
    cũng chẳng kỳ vọng gì nhiều`) theo B02-F03; (2) cụm `những tân binh được huấn
    luyện gấp rút` theo B02-F04 (chỉ quá trình huấn luyện cấp tốc, không gán sự cưỡng
    ép); (3) danh ngữ `đám chỉ huy cấp cao` theo `vol02-ch05-b02-brass` cùng so sánh
    bậc nhất phủ định (`chẳng có lời hứa nào kém đáng tin hơn lời hứa của đám chỉ
    huy cấp cao`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000027
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000027: terms: [''pháo kích dữ
    dội (heavy shelling)'', ''những người lính (The soldiers)'']: pronouns_and_address:
    [''Quy chiếu khái quát `ai cũng...` và `những người lính`.'']: pov_and_voice:
    Tự sự hồi tưởng ngôi thứ nhất chiêm nghiệm về tâm lý binh sĩ dưới làn pháo kích.:
    modality_and_logic: Giữ cấu trúc phủ định kép tạo nghĩa tất yếu (`chẳng thể không
    hoài nghi dai dẳng`) trước nỗi đau và áp lực tinh thần kéo dài nhiều giờ dưới
    hỏa lực.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000028
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000028: terms: [''tuyên truyền
    (propaganda)'']: pronouns_and_address: [''Câu 2 lược chủ ngữ cho đại từ phiếm
    chỉ (`Muốn sống sót qua cuộc chiến kinh hoàng này, không thể đặt quá nhiều hy
    vọng`).'']: pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic:
    Giữ câu điều kiện giả định trái thực tế (`Nếu không, hiện thực khủng khiếp sẽ
    giáng một đòn nghiền nát thứ tuyên truyền đẹp đẽ ấy, khiến binh lính phát điên`)
    và kết luận sinh tồn phủ định (`không thể đặt quá nhiều hy vọng`).: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000029
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000029: pronouns_and_address: [''Người
    lính bị bắn trúng tự xưng `Tôi`.'']: pov_and_voice: Tiếng kêu đau đớn và chửi
    thề khi trúng đạn.: modality_and_logic: Giữ nguyên câu thoại ngắn `“Ư… Tôi trúng
    đạn! Chết tiệt!”`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000030
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000030: terms: [''Quân y (Medic)'']:
    pronouns_and_address: []: pov_and_voice: Tiếng gọi cấp cứu khẩn cấp của đồng đội.:
    modality_and_logic: Giữ nguyên tiếng hô lặp `“Quân y! Quân y!”`.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000031
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000031: terms: [''hầm trú (dugout)'',
    ''chiến trường (battlefield)'', ''đạn lạc (stray shot)'', ''tay bắn tỉa (sniper)'',
    ''chiến hào (trench)'']: pronouns_and_address: [''Người kể tự xưng `Tôi` kết hợp
    đại từ phản thân `mình`; quy chiếu người trúng đạn và đồng đội ở hầm bên bằng
    `ai đó`, `họ`, `một gã xấu số`.'']: pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.:
    modality_and_logic: Khóa cách diễn đạt đã sửa theo B02-F05 (`ngay giữa tiếng ầm
    vang của chiến trường` — phản ánh việc nghe thấy âm thanh đó giữa tiếng gầm chiến
    trường chứ không phải âm thanh đó to át cả chiến trường) và giữ nguyên chuỗi suy
    luận loại trừ dẫn đến kết luận `vậy thì hẳn là tay bắn tỉa`.: emphasis: Không
    dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000032
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000032: terms: [''bắn rải để quấy
    rối (sprayed harassing fire)'']: pronouns_and_address: [''Dùng `Chúng tôi` cho
    tổ súng máy của người kể; quy chiếu tay bắn tỉa bằng `hắn`.'']: pov_and_voice:
    Tự sự hồi tưởng ngôi thứ nhất kết thúc bằng câu tâm niệm sinh tồn ở thì hiện tại.:
    modality_and_logic: Khóa cụm `bắn rải để quấy rối mọi chỗ nghi hắn đang ẩn nấp`
    theo `vol02-ch05-b02-harassing-fire` và B02-F06.: emphasis: Khóa chính xác phạm
    vi nhấn mạnh ở câu cuối `*Chúng tôi không muốn chết.*` theo đúng thẻ `<em>` trong
    nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000033
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000033: terms: [''cáng (stretcher)'',
    ''Yểm trợ (Cover)'']: pronouns_and_address: [''Quy chiếu nhóm tải thương bằng
    `họ`.'']: pov_and_voice: Mệnh lệnh tác chiến tại chiến hào.: modality_and_logic:
    Giữ nguyên hai câu mệnh lệnh ngắn gọn `“Đưa cáng ra! Yểm trợ họ!”`.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000034
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000034: pronouns_and_address: []:
    pov_and_voice: Từ nối chuyển cảnh tạo nhịp lắng trong hồi ức.: modality_and_logic:
    Giữ nguyên `Rồi…`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000035
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000035: terms: [''người khiêng
    cáng (stretcher-bearers)'', ''yểm trợ tận lực (diligent cover)'', ''người anh
    em bị thương (injured brother)'', ''quân y (medics)'', ''*Sanis*'']: pronouns_and_address:
    [''Người kể tự xưng `Tôi` và `chúng tôi`.'']: pov_and_voice: Tự sự hồi tưởng ngôi
    thứ nhất tràn đầy lòng biết ơn và kính phục đối với quân y.: modality_and_logic:
    Khóa ba lựa chọn đã nghiệm thu: (1) `dưới sự yểm trợ tận lực của đồng đội` theo
    B02-F07; (2) biệt danh `*Sanis*` gắn với `những người quân y` theo `vol02-ch05-b02-sanis`;
    (3) `chúng tôi ít ra vẫn được hưởng chút tình người trong thế giới địa ngục ấy`
    theo B02-F08 (bảo toàn người lính là bên thụ hưởng sự chăm sóc nhân đạo từ quân
    y).: emphasis: Khóa chính xác phạm vi nhấn mạnh `*Sanis*` theo đúng thẻ `<em>`
    trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000036
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000036: terms: [''hậu phương (the
    rear)'', ''đồng đội (fellow soldier / fallen teammates)'']: pronouns_and_address:
    [''Dùng `chúng tôi` cho lính chiến đấu và `họ` cho đội ngũ quân y.'']: pov_and_voice:
    Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic: Giữ cấu trúc đối lập với những
    người làm việc nhẹ nhàng ở hậu phương, mức độ nguy hiểm (`làn mưa đạn mà ngay
    cả chúng tôi cũng phải chùn bước`) và tinh thần kế tiếp nhau lao ra cứu đồng đội
    ngã xuống.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000037
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000037: pronouns_and_address: [''Phân
    biệt rõ `tôi` ở câu 1 và câu 3 (lòng kính trọng cá nhân kéo dài đến hiện tại)
    với `chúng tôi` ở câu 2 (sự tin cậy của cả tập thể); quy chiếu quân y bằng `Họ`.'']:
    pov_and_voice: Tự sự hồi tưởng đan xen khẳng định ở thời điểm hiện tại.: modality_and_logic:
    Khóa câu 1 đã sửa theo B02-F09 (`Họ là những người duy nhất tôi thật lòng kính
    trọng sâu sắc.`), giữ đồng thời tính duy nhất, sự chân thành và chiều sâu kính
    trọng mà không thêm so sánh cực cấp; giữ sự tiếp nối đến hiện tại ở câu 3 (`Đến
    giờ tôi vẫn nghĩ vậy.`).: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000038
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000038: terms: [''màn khói (smoke
    screen)'']: pronouns_and_address: []: pov_and_voice: Khẩu lệnh chiến trường ngắn
    gọn.: modality_and_logic: Khóa khẩu lệnh `“Tạo màn khói!”` theo B02-F10.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000039
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000039: terms: [''Lựu đạn (Hand
    grenades)'']: pronouns_and_address: [''Dùng đại từ ngôi thứ hai số nhiều `các
    cậu`.'']: pov_and_voice: Khẩu lệnh thúc giục đồng đội ném toàn bộ lựu đạn.: modality_and_logic:
    Giữ nguyên `“Lựu đạn! Ném hết những gì các cậu có!”`.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000040
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000040: terms: [''Tổ súng cối (mortar
    squad)'', ''đạn khói (smoke shells)'', ''các tay súng được chỉ định (designated
    riflemen)'', ''lựu đạn (grenades)'', ''bức màn hỏa lực (curtain of fire)'', ''chiếc
    cáng (The stretcher)'', ''*Sanis*'']: pronouns_and_address: [''Dùng `chúng tôi`
    cho tổ súng máy và tập thể lính chiến hào; quy chiếu `*Sanis*` bằng `họ`.'']:
    pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic: Khóa hai lựa
    chọn đã nghiệm thu: (1) cảm giác nhẹ nhõm khi thấy chiếc cáng xuất hiện an toàn
    (`Thấy chiếc cáng xuất hiện an toàn, chúng tôi nhẹ cả người.`) theo B02-F12; (2)
    mệnh đề khẳng định nghĩa vụ bảo vệ tuyệt đối (`Dù không bảo vệ được ai khác, vẫn
    phải bảo vệ *Sanis*; chỉ có họ mới cứu chúng tôi.`) theo B02-F11.: emphasis: Khóa
    chính xác phạm vi nhấn mạnh `*Sanis*` theo đúng thẻ `<em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000041
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000041: terms: [''hỏa lực yểm trợ
    (covering fire)'', ''quân Cộng hòa (the Republicans)'', ''chiếc cáng (stretcher)'',
    ''lưới hỏa lực súng máy (machine-gun nets)'', ''hỏa lực tập trung (concentrated
    fire)'', ''chiến hào (trench)'', ''pháo thủ Cộng hòa (Republican artillerymen)'',
    ''đạn pháo (shells)'']: pronouns_and_address: [''Dùng `tôi` (hành động cúi đầu
    vô thức của cá nhân) và `chúng tôi` / `mình` (tập thể tổ súng máy); quy chiếu
    quân Cộng hòa bằng `quân Cộng hòa` / `Chúng`.'']: pov_and_voice: Tự sự hồi tưởng
    ngôi thứ nhất pha giọng tự giễu chua chát dưới làn đạn.: modality_and_logic: Khóa
    thuật ngữ `lưới hỏa lực súng máy láo xược` theo `vol02-ch05-b02-machine-gun-nets`,
    cấu trúc đối lập mục tiêu (`chứ không phải chiếc cáng đang nhanh chóng rút đi`),
    và hình ảnh tự giễu ở câu cuối (`nghĩ không biết bao nhiêu pháo thủ Cộng hòa hẳn
    đang chiêu đãi mình bằng đạn pháo`) theo B02-F13.: emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000042
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000042: pronouns_and_address: [''Dùng
    `chúng tôi`.'']: pov_and_voice: Tự sự hồi tưởng ngôi thứ nhất.: modality_and_logic:
    Khóa cách dịch đã sửa theo B02-F14: giữ `sự bình thản kỳ lạ` (trạng thái tâm lý
    gượng cười trong hào ở p000041 chứ không phải chiến trường im tiếng súng) và `mà
    chúng tôi không quen nghe` (không tuyệt đối hóa thành chưa từng nghe trong đời).:
    emphasis: Khóa chính xác hai phạm vi nhấn mạnh từ tượng thanh `*vút*` và `*ầm*`
    theo đúng hai thẻ `<em>` trong nguồn (DEC-P01-002).'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000043
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000043: terms: [''đạn pháo 128
    mm (128 mm shells)'', ''pháo dã chiến 180 mm (180 mm field guns)'']: pronouns_and_address:
    [''Quy chiếu quân Cộng hòa bằng `chúng`.'']: pov_and_voice: Tự sự hồi tưởng ngôi
    thứ nhất nhận diện cỡ pháo hạng nặng của địch.: modality_and_logic: Giữ đúng cấu
    trúc phủ định cỡ đạn (`Đó không phải đạn pháo 128 mm`) và sự xuất hiện của vũ
    khí hạng nặng (`những khẩu pháo dã chiến 180 mm quý giá`).: emphasis: Không dùng
    `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000044
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000044: terms: [''Quân tiếp viện
    phe ta (Friendly reinforcements)'']: pronouns_and_address: [''Gọi binh lính bằng
    danh xưng tập thể `anh em`.'']: pov_and_voice: Thông báo động viên qua vô tuyến
    từ tiểu đoàn trưởng.: modality_and_logic: Giữ nguyên thông điệp khích lệ tinh
    thần `“Nghe đây, anh em! Quân tiếp viện phe ta đang trên đường tới! Cố cầm cự!”`.:
    emphasis: Không dùng `*...*`.'
  non_canon: true
- segment_id: YS-LN02/Text/part0026.xhtml/p000045
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0026.xhtml/p000045: terms: [''vô tuyến (radio)'',
    ''tiểu đoàn trưởng (battalion commander)'', ''Tiểu đoàn (battalion)'', ''quân
    bổ sung (replacement troops)'']: pronouns_and_address: [''Dùng `tôi` và `chúng
    tôi`; quy chiếu phía tiểu đoàn trưởng/chỉ huy bằng `họ`.'']: pov_and_voice: Tự
    sự hồi tưởng ngôi thứ nhất.: modality_and_logic: Khóa sự phân biệt giữa `quân
    bổ sung` (`replacement troops`) với `quân tiếp viện` (`reinforcements`), giữ quan
    hệ đối lập (`mừng vì nhận được chỉ thị... nhưng cảm giác vô vọng còn lớn hơn`)
    và suy đoán `tôi đoán họ đang ném cho chúng tôi một sợi dây để bám víu`.: emphasis:
    Không dùng `*...*`.'
  non_canon: true
