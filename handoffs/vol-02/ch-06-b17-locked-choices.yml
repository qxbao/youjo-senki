    chấm mở đầu và câu hỏi xác nhận ngắn.; emphasis=none
- segment_id: YS-LN02/Text/part0030.xhtml/p000533
  kind: terminology_and_voice
  value: 'terms=[''đại đội'', ''giai đoạn truy quét'']; pronouns_and_address=Trần
    thuật pha điểm nhìn của Tanya quy chiếu thuộc cấp trong đại đội là `họ`.; pov_and_voice=Giọng
