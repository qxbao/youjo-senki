    tính toán mức độ giao chiến vừa đủ để hoàn thành trách nhiệm.; modality_and_logic=Bảo
    toàn cấu trúc điều kiện: nếu ngoài kia còn pháp sư địch sung sức/nguyên vẹn sức
    chiến đấu thì ít nhiều gì chúng ta cũng phải dần cho chúng một trận (hoặc giáng
    cho chúng vài đòn / đánh với họ).; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000523
  kind: terminology_and_voice
  value: 'terms=[''giao chiến tầm gần'', ''phục kích'']; pronouns_and_address=Tanya
