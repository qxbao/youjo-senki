    Tanya đã có thái độ thực tế -> vì nó chỉ tập trung nghĩ cách giữ cho tay mình
    ít vấy bẩn nhất có thể, nên không gì được ưu tiên hơn việc rời khỏi đó sau khi
    phát lời kêu gọi đầu hàng.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000536
  kind: terminology_and_voice
  value: 'pronouns_and_address=Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`.;
    pov_and_voice=Giọng tự trấn an lạnh lùng của Tanya trước thương vong sắp xảy ra.;
    modality_and_logic=Bảo toàn đủ 2 câu và mệnh đề nhượng bộ: đây là nhiệm vụ dễ
    dàng -> dù kết quả có khiến ai đó thiệt mạng thì cũng không phải do chính tay
    mình.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000537
  kind: terminology_and_voice
  value: pronouns_and_address=Mệnh đề chuyển ý bỏ lửng không chứa đại từ.; pov_and_voice=Nhịp
    ngắt chuyển tiếp giữa suy nghĩ của Tanya và phản ứng tuân lệnh của thuộc cấp.;
    modality_and_logic=Bảo toàn dấu ba chấm lửng (`Trong trường hợp đó…`).; emphasis=none
- segment_id: YS-LN02/Text/part0030.xhtml/p000538
  kind: terminology_and_voice
  value: pronouns_and_address=Thuộc cấp đáp nhận lệnh ngắn gọn (`“…Đã rõ.”`).; pov_and_voice=Giọng
    nén lại sự lưỡng lự để phục tùng mệnh lệnh.; modality_and_logic=Bảo toàn dấu ba
    chấm mở đầu và lời xác nhận tuân lệnh.; emphasis=none
- segment_id: YS-LN02/Text/part0030.xhtml/p000539
  kind: terminology_and_voice
  value: 'pronouns_and_address=Trần thuật quy chiếu các thành viên đại đội là `họ`
    / `tất cả`.; pov_and_voice=Giọng ghi nhận sự trưởng thành và kỷ luật quân ngũ
    của thuộc cấp.; modality_and_logic=Bảo toàn đủ 2 câu: dù còn do dự, không ai tiếp
    tục phản đối, dù điều đó tốt hay xấu -> nói cách khác, bất kể họ có thể đã muốn
    nói gì, tất cả đều đủ chín chắn để nuốt/giữ những lời ấy trong lòng.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000540
  kind: terminology_and_voice
  value: 'terms=[''chủ nghĩa khắc kỷ'', ''sa thải'']; pronouns_and_address=Độc thoại
    nội tâm khái quát của Tanya dùng `mình` / `ta` cho chủ thể chung.; pov_and_voice=Giọng
    liên hệ trải nghiệm công sở khắc nghiệt với tâm lý người lính trên chiến trường.;
    modality_and_logic=Bảo toàn đủ 4 câu: làm ăn về cơ bản là sống theo chủ nghĩa
    khắc kỷ -> tiếp khách, sa thải hay một ông sếp không thể chịu nổi—có bao nhiêu
    chuyện buộc ta phải nhẫn nhịn -> vì vậy nếu tránh được những chuyện đó thì chẳng
    có mấy lý do để chùn bước -> còn nếu là người lính, mệnh lệnh chính là cái cớ
    tuyệt vời.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000541
  kind: terminology_and_voice
  value: 'terms=[''pháo binh'', ''đơn vị máy bay ném bom'', ''cảnh báo đầu hàng''];
    pronouns_and_address=Tanya ra lệnh liên lạc, dùng `họ` cho pháo binh và đơn vị
    máy bay ném bom, `chúng ta` cho đơn vị mình.; pov_and_voice=Giọng chỉ huy bàn
    giao bước tiếp theo của quy trình tác chiến.; modality_and_logic=Bảo toàn đủ 2
    câu mệnh lệnh: liên lạc với pháo binh và đơn vị máy bay ném bom -> báo họ rằng
    chúng ta chuẩn bị/sẽ phát cảnh báo đầu hàng.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000542
  kind: terminology_and_voice
  value: 'terms=[''đợt oanh kích'']; pronouns_and_address=Độc thoại nội tâm của Tanya
    quy chiếu pháo binh và máy bay ném bom là `họ`.; pov_and_voice=Giọng phủi tay
    gọn ghẽ khi chuyển giao phần việc nặng nề sang đơn vị bạn.; modality_and_logic=Bảo
    toàn đủ 4 câu: việc còn lại chỉ là để họ tiếp quản -> nếu địch đầu hàng thì tốt
    -> nếu không, đợt oanh kích sẽ kết thúc mọi chuyện -> chỉ vậy thôi.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000543
  kind: terminology_and_voice
  value: 'pronouns_and_address=Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`.;
    pov_and_voice=Giọng nhìn nhận thực tế rằng đối phương gần như chắc chắn sẽ không
    đầu hàng.; modality_and_logic=Bảo toàn quan hệ nhân quả và mệnh đề bỏ lửng cuối
    câu: à thì, mình biết loại địch này chẳng đời nào ngoan ngoãn đầu hàng, nên gần
    như đã có thể đoán trước kết cục, nhưng dù sao…; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000544
  kind: terminology_and_voice
  value: 'pronouns_and_address=Độc thoại nội tâm của Tanya dùng `chúng ta` / `mình`
    cho phe mình và `họ` cho quân địch.; pov_and_voice=Giọng tính toán sắc lạnh, biến
    sự ngoan cố của đối phương thành căn cứ hợp thức hóa.; modality_and_logic=Bảo
    toàn câu kết luận: nói cách khác, chúng ta sẽ biến họ thành cái cớ biện minh cho
    mình.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000545
  kind: terminology_and_voice
  value: 'pronouns_and_address=Câu hỏi ngắn trong trao đổi chiến thuật với Tanya,
    cần dịch đúng sắc thái hỏi nhu cầu bảo vệ/hộ tống theo `B17-F01`.; pov_and_voice=Giọng
    hỏi xác nhận phương án bảo vệ/yểm trợ trước khi phát thông điệp cảnh báo.; modality_and_logic=Bảo
    toàn câu hỏi ngắn và sửa theo `B17-F01`: `“Có cần bảo vệ không ạ?”` (hoặc `“Cần
    yểm trợ bảo vệ không?”` / `“Có cần lực lượng bảo vệ không?”`), không dùng cấu
    trúc bị động `được bảo vệ`.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000546
  kind: terminology_and_voice
  value: terms=['Đại đội 2', 'yểm trợ trực tiếp']; pronouns_and_address=Tanya gọi
    trực tiếp `Đại đội 2` khi phân công nhiệm vụ.; pov_and_voice=Giọng mệnh lệnh ngắn
    gọn, phân công lực lượng yểm trợ trực tiếp.; modality_and_logic=Bảo toàn mệnh
    lệnh điều động (`“Đại đội 2, đảm nhiệm yểm trợ trực tiếp.”`).; emphasis=none
- segment_id: YS-LN02/Text/part0030.xhtml/p000547
  kind: terminology_and_voice
  value: 'terms=[''phát cảnh báo'', ''phiên tòa'', ''bằng chứng'']; pronouns_and_address=Độc
    thoại nội tâm của Tanya tự xưng `mình` và quy chiếu đối phương là `họ`.; pov_and_voice=Giọng
    cân nhắc đa chiều—từ xác suất hợp lý, tâm lý binh sĩ cho tới bằng chứng tự bào
    chữa trước tòa.; modality_and_logic=Bảo toàn đủ 3 câu: dù vậy tốt nhất vẫn là
    phát cảnh báo -> nếu họ hành xử hợp lý thì vẫn có một khả năng khác không (hoặc
    chút khả năng) là họ sẽ chọn đầu hàng -> phát cảnh báo trước cũng giúp tâm lý
    nhẹ nhõm hơn nhiều, và quan trọng nhất là nếu có phiên tòa thì việc đó có thể
    được dùng làm bằng chứng để biện hộ c'
- segment_id: YS-LN02/Text/part0030.xhtml/p000548
  kind: terminology_and_voice
  value: 'pronouns_and_address=Tanya hô bắt đầu gọi cảnh báo cho đối phương (`họ`),
    dùng hình thức bao gồm người nói theo `B17-F02`.; pov_and_voice=Giọng quyết định
    bắt đầu thực hiện cuộc gọi cảnh báo đầu hàng.; modality_and_logic=Bảo toàn câu
    thoại ngắn và sửa theo `B17-F02`: `“Được rồi, gọi cho họ thôi.”` (hoặc `“Được,
    ta gọi cho họ thôi.”`), không dịch thành lệnh sai khiến người khác (`gọi cho họ
    đi`).; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000549
  kind: terminology_and_voice
  value: 'terms=[''chủ nghĩa tư bản'']; pronouns_and_address=Độc thoại nội tâm của
    Tanya dùng `chúng ta` cho phe mình và `họ` cho đối phương.; pov_and_voice=Giọng
    hài hước đen kiểu con người kinh tế khi quy việc phát cảnh báo không tốn chi phí
    về đạo lý của chủ nghĩa tư bản.; modality_and_logic=Bảo toàn đủ 2 câu: cảnh báo
    cho họ chẳng khiến chúng ta mất gì cả -> trong trường hợp đó, không làm vậy thì
    gần như là phản bội chủ nghĩa tư bản.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000550
  kind: terminology_and_voice
  value: 'terms=[''đạn dược'']; pronouns_and_address=Độc thoại nội tâm của Tanya dùng
    `chúng ta` cho đơn vị/phe mình, `mình` cho bản thân theo `DEC-P01-001`, và `họ`
    cho đối phương.; pov_and_voice=Giọng thành thật một cách thực dụng khi mong địch
    đầu hàng để tiết kiệm thời gian và đạn dược.; modality_and_logic=Bảo toàn đủ 4
    câu: chúng ta gần như biết chắc họ sẽ từ chối đề nghị của chúng ta, nhưng vì lý
    do riêng mình vẫn muốn chân thành đưa ra lời đề nghị ấy -> làm vậy chắc chắn đáng
    công -> thật ra đến nước này mình rất mong họ chịu đầu hàng -> thời gian và đạn
    dược đều quý giá.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000551
  kind: terminology_and_voice
  value: 'terms=[''hậu cần'', ''cấp trên'', ''cắt giảm chi phí'']; pronouns_and_address=Độc
    thoại nội tâm của Tanya tự xưng `Mình` / `mình`, quy chiếu đối phương là `họ`
    và giới chỉ huy cấp trên là `cấp trên` / `giới chỉ huy cấp cao`.; pov_and_voice=Giọng
    phân tích bài toán chi phí hậu cần và thông cảm với quyết định tiêu diệt của cấp
    trên.; modality_and_logic=Bảo toàn đủ 3 câu: thực tế thì nếu rất đông người trong
    số họ đầu hàng, gánh nặng hậu cần sẽ còn lớn hơn -> cấp trên (hoặc giới chỉ huy
    cấp cao) cũng không nghĩ họ sẽ tự nộp mình nên đã mặc định sẽ phải đánh một trận
    để quét sạch họ -> mình nghĩ vẫn nên'
- segment_id: YS-LN02/Text/part0030.xhtml/p000552
  kind: terminology_and_voice
  value: 'pronouns_and_address=Độc thoại nội tâm của Tanya dùng `chúng ta` cho những
    người đang trực tiếp ở ngoài thực địa.; pov_and_voice=Giọng tự ngắt dòng suy nghĩ
    vĩ mô để quay về thực tại chiến trường.; modality_and_logic=Bảo toàn đủ 2 câu:
    tiếng thở dài/chậc lưỡi (`Chậc.`) -> thôi thì những người đang ở ngay giữa cuộc
    chiến như chúng ta đâu có lý do gì phải nghĩ xa đến thế.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000553
  kind: terminology_and_voice
  value: pronouns_and_address=Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`.;
    pov_and_voice=Giọng kết đoạn gọn gàng khi Tanya chuẩn bị phát đi thông điệp cảnh
    báo.; modality_and_logic=Bảo toàn câu tự nhủ bắt đầu hành động (`Chắc mình nên
    bắt tay vào việc thôi.`).; emphasis=none
