    hạn đó (`chỉ đến đó thôi`).; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000528
  kind: terminology_and_voice
  value: 'terms=[''pháp sư'', ''Tanya'']; pronouns_and_address=Trần thuật ngôi thứ
