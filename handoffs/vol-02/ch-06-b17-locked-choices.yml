    tấn công ở ven thành phố, nhiệm vụ của Tanya coi như phần lớn đã hoàn thành.;
    emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000529
  kind: terminology_and_voice
  value: 'terms=[''máy bay ném bom'', ''pháo binh'']; pronouns_and_address=Trần thuật
