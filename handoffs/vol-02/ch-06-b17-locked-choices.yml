- segment_id: YS-LN02/Text/part0030.xhtml/p000527
  kind: terminology_and_voice
  value: 'terms=[''ổ phục kích'', ''pháp sư'']; pronouns_and_address=Độc thoại nội
    tâm của Tanya dùng `chúng ta` cho đơn vị mình.; pov_and_voice=Giọng vạch ranh
    giới trách nhiệm công việc rõ ràng, không làm thừa ngoài phạm vi được giao.; modality_and_logic=Bảo
    toàn giới hạn phủ định ở cuối câu: nói cách khác, nhiệm vụ của chúng ta là đối
