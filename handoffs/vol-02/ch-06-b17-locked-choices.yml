    `chúng`.; pov_and_voice=Giọng mệnh lệnh chiến thuật đanh thép, cảnh báo thuộc
    cấp không được chủ quan sau khi Weiss bị bắn trúng.; modality_and_logic=Bảo toàn
    đủ 4 câu: tất cả chuẩn bị lao xuống áp sát để giao chiến tầm gần -> coi chừng
    phục kích -> bọn chúng có năng lực đấy -> coi thường chúng thì rất dễ nhận trái
    đắng/lĩnh đủ.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000524
  kind: terminology_and_voice
  value: 'terms=[''Chỉ huy'', ''Pháp sư địch'']; pronouns_and_address=Thuộc cấp gọi
    Tanya là `Chỉ huy` và quy chiếu pháp sư địch là `Chúng`.; pov_and_voice=Giọng
    báo cáo khẩn cấp khi phát hiện biến động đội hình của địch.; modality_and_logic=Bảo
    toàn đủ 3 câu cảm thán: gọi Chỉ huy -> báo pháp sư địch đang rút lui -> báo chúng
    định cố thủ trong thành phố.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000525
  kind: terminology_and_voice
  value: 'terms=[''xuất kích'', ''chặn đánh'']; pronouns_and_address=Độc thoại nội
    tâm của Tanya dùng `chúng ta` cho đơn vị mình.; pov_and_voice=Giọng khựng lại
