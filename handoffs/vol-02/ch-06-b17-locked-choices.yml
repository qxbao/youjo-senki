    chúng ta là đối phó với pháp sư -> không bao gồm tác chiến đô thị.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000535
  kind: terminology_and_voice
  value: 'terms=[''Tanya'', ''lời kêu gọi đầu hàng'']; pronouns_and_address=Trần thuật
