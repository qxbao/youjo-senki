- segment_id: YS-LN02/Text/part0030.xhtml/p000515
  kind: terminology_and_voice
  value: 'pronouns_and_address=Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`.;
    pov_and_voice=Giọng miễn cưỡng, thực tế của Tanya sau khi tự trấn an về mặt pháp
    lý.; modality_and_logic=Bảo toàn quan hệ nhượng bộ và điều kiện: dù vậy, chừng
