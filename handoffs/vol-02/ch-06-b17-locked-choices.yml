    giải thích ngắn gọn, dứt khoát về trình tự hành động tiếp theo.; modality_and_logic=Bảo
    toàn đủ 2 câu: việc chúng ta cần làm chỉ là đẩy chúng lui lại -> một khi đã đẩy
    được chúng ra xa, ta sẽ phát lệnh cảnh báo yêu cầu đầu hàng.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000532
  kind: terminology_and_voice
  value: pronouns_and_address=Thuộc cấp hỏi lại Tanya với tiểu từ lễ phép `ạ` (`“…Chắc
    chứ ạ?”`).; pov_and_voice=Giọng ngập ngừng, bất an của thuộc cấp khi hiểu hệ quả
