    đủ 3 câu: trấn an Weiss rằng không sao -> nhận xét bản tính anh vốn như vậy thì
    cũng khó làm khác được -> ra lệnh cho Trung úy König tiếp nhận quyền chỉ huy của
    Trung úy Weiss.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000520
  kind: terminology_and_voice
  value: pronouns_and_address=Lời đáp nhận lệnh ngắn gọn của Trung úy König qua vô
