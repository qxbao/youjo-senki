- segment_id: YS-LN02/Text/part0030.xhtml/p000510
  kind: terminology_and_voice
  value: 'terms=[''pháp luật hiện đại'', ''hành vi không hành động'', ''chủ thể trực
    tiếp của hành vi'', ''nghĩa vụ báo cáo'']; pronouns_and_address=Độc thoại nội
    tâm của Tanya tự xưng `mình` nhất quán theo `DEC-P01-001`.; pov_and_voice=Giọng
    phân tích pháp lý lạnh lùng nhằm tự gỡ trách nhiệm cá nhân của Tanya.; modality_and_logic=Bảo
    toàn đủ 3 câu: theo pháp luật hiện đại thì đó là hành vi không hành động -> nhưng
    mình không phải chủ thể trực tiếp của hành vi ấy -> nói cách khác, vấn đề nằm
    ở chỗ mình có nghĩa vụ báo cáo việc đó hay không.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000511
  kind: terminology_and_voice
  value: 'terms=[''Rudel'', ''xe tăng'', ''tàu chiến'', ''máy bay tiêm kích'', ''đoàn
    tàu bọc thép'', ''Liên Xô'', ''xuất kích'']; pronouns_and_address=Độc thoại nội
    tâm của Tanya quy chiếu nhân vật lịch sử `Rudel` bằng `ông ta`.; pov_and_voice=Giọng
    viện dẫn tiền lệ chiến sử thế giới cũ của Tanya để củng cố lập luận miễn trừ trách
    nhiệm.; modality_and_logic=Bảo toàn đủ 2 câu: ngay cả Rudel cũng ném bom vô số
    xe tăng, tàu chiến, máy bay tiêm kích và đoàn tàu bọc thép của Liên Xô mà không
    phải vào tù -> về cơ bản, tất cả những gì ông ta làm chỉ là xuất kích, và bản
    thân việc đó không thành vấn đề.; emphasis=none'
