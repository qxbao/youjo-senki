- segment_id: YS-LN02/Text/part0030.xhtml/p000521
  kind: terminology_and_voice
  value: 'terms=[''hệ thống chỉ huy'', ''tác chiến chống pháp sư'', ''kiềm chế đối
    phương'']; pronouns_and_address=Độc thoại nội tâm của Tanya tự xưng `mình` (câu
    1) và `chúng ta` cho toàn đơn vị (câu 2) theo `DEC-P01-001`.; pov_and_voice=Giọng
    xác định phạm vi nhiệm vụ tối thiểu của người chỉ huy thực dụng.; modality_and_logic=Bảo
    toàn đủ 2 câu: không còn cách nào khác nên mình tự quyết định sắp xếp lại hệ thống
    chỉ huy -> dù sao đi nữa, nhiệm vụ của chúng ta là tác chiến chống pháp sư, nhiều
    lắm thì có thêm việc kiềm chế đối phương.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000522
  kind: terminology_and_voice
  value: 'terms=[''pháp sư địch'']; pronouns_and_address=Độc thoại nội tâm của Tanya
