- segment_id: YS-LN02/Text/part0030.xhtml/p000516
  kind: terminology_and_voice
  value: 'terms=[''chiến dịch quân sự'', ''yee-haw'']; pronouns_and_address=Độc thoại
    nội tâm của Tanya tự xưng `mình` và dùng `ta` cho chủ thể khái quát.; pov_and_voice=Giọng
    châm biếm pha chút mệt mỏi triết học của Tanya về sự tồn tại của chiến tranh.;
    modality_and_logic=Bảo toàn đủ 2 câu: dĩ nhiên mình khá chắc chẳng có chiến dịch
    quân sự nào mà ta có thể vừa hô *yee-haw* vừa hăng hái tham chiến -> rốt cuộc
    mình lại tự hỏi chiến tranh tồn tại để làm gì (hoặc vì sao con người lại có chiến
    tranh).; emphasis=Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ
    bọc dấu `*...*` quanh cụm `*yee-haw*` t'
- segment_id: YS-LN02/Text/part0030.xhtml/p000517
  kind: terminology_and_voice
  value: 'terms=[''chiến dịch phi lý'']; pronouns_and_address=Câu hỏi nội tâm của
    Tanya tự xưng `mình` theo `DEC-P01-001`.; pov_and_voice=Giọng tự vấn đầy bức bối
    ngay giữa trận đánh.; modality_and_logic=Bảo toàn dấu gạch ngang dài (`—`) và
    câu hỏi nội tâm: ngay cả lúc này (hoặc ngay cả hôm nay)—tại sao mình lại đang
    tiến hành chiến dịch phi lý này?; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000518
  kind: terminology_and_voice
  value: 'terms=[''Tanya'']; pronouns_and_address=Trần thuật ngôi thứ ba dùng tên
    riêng `Tanya` và đại từ `nó` theo đúng `DEC-P01-001`.; pov_and_voice=Giọng trần
    thuật khách quan mô tả khả năng tự kiểm soát và chuyển trạng thái tức thì của
    Tanya.; modality_and_logic=Bảo toàn đủ 2 câu: Tanya thật sự đã hết cách, nhưng
    nó chưa khao khát cái chết đến mức chìm đắm trong suy nghĩ ngay giữa chiến trường
    -> nó chuyển hướng, tập trung xử lý nhiệm vụ trước mắt.; emphasis=none'
- segment_id: YS-LN02/Text/part0030.xhtml/p000519
  kind: terminology_and_voice
  value: 'terms=[''Trung úy König'', ''Trung úy Weiss'']; pronouns_and_address=Tanya
