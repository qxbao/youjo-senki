- segment_id: YS-LN02/Text/part0030.xhtml/p000534
  kind: terminology_and_voice
  value: 'terms=[''pháp sư'', ''tác chiến đô thị'']; pronouns_and_address=Tanya dùng
    `chúng ta` khi chấn chỉnh thuộc cấp về phạm vi nhiệm vụ.; pov_and_voice=Giọng
