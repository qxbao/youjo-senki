    cho chiếc tàu ngầm'']: pov_and_logic: [{''Giữ tình huống cấp bách trước mắt'':
    ''tàu ngầm không rõ quốc tịch đang lặn nhanh để trốn chạy khỏi Lục quân Đế quốc
    đúng lúc Tanya chỉ huy; nó sẽ lặn hoàn toàn trong chưa đầy một phút, nhưng hiện
    tại đơn vị vẫn còn một phút ngắn ngủi đó''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000071
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000071: names_and_ranks: []: pronouns_and_address:
    [''Độc thoại nội tâm dùng "chúng ta" cho đơn vị'']: pov_and_logic: [''Giữ nhận
    định rằng ngay lúc này đơn vị vẫn còn kịp hành động'']: emphasis: none'
  non_canon: true
