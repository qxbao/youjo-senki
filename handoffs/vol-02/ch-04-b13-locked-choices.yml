  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000073
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000073: names_and_ranks: [''Tanya
    -> Tanya'']: pronouns_and_address: [''Hai câu đầu là độc thoại nội tâm dùng "Mình"
    / "mình" (DEC-P01-001); câu cuối chuyển sang trần thuật ngôi thứ ba dùng tên riêng
    "Tanya"'']: pov_and_logic: [''Giữ hình ảnh so sánh ánh mắt binh lính chờ lệnh
    tấn công như chó săn nhìn chủ xin phép, cùng sự đối lập giữa vẻ ngoài bình thản
    và cơn thịnh nộ bên trong của Tanya'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000074
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000074: names_and_ranks: []: pronouns_and_address:
    [''Độc thoại nội tâm dùng "Mình" / "mình" (DEC-P01-001)'']: pov_and_logic: [''Giữ
    sự ý thức rõ ràng rằng người chỉ huy chính là người phải gánh trách nhiệm'']:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000075
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000075: names_and_ranks: [''Tanya
    -> Tanya'']: pronouns_and_address: [''Mệnh đề dẫn trần thuật dùng tên riêng "Tanya"'']:
    pov_and_logic: [''Giữ sự bác bỏ dứt khoát của Tanya trước ý nghĩ đánh chìm một
    con tàu không rõ quốc tịch'']: emphasis: [''Giữ đúng phạm vi nhấn mạnh Markdown
    `*Đánh chìm một con tàu không rõ quốc tịch ư? Thật ngu ngốc!*` cho câu nghĩ trực
    tiếp và đặt phần dẫn trần thuật ở ngoài dấu sao theo DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000076
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000076: names_and_ranks: [''law
    of war (war laws) -> Luật chiến tranh (luật chiến tranh)'', ''Commonwealth ->
    Khối Thịnh vượng chung'', ''neutral country -> nước trung lập'']: pronouns_and_address:
    [''Độc thoại nội tâm dùng "Mình" (DEC-P01-001)'']: pov_and_logic: [''Giữ nguyên
    tắc luật chiến tranh chỉ cho phép giao chiến giữa các nước đang có xung đột, chi
    tiết tàu thuyền của "Khối Thịnh vượng chung" (`vol02-ch04-b13-commonwealth`, bản
    sửa F2) đang hoạt động gần đó, và câu hỏi tu từ về việc vi phạm luật chiến tranh
    ngay trước mặt một nước trung lập'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000077
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000077: names_and_ranks: [''compliance
    -> việc tuân thủ quy định'', ''political scapegoat -> vật tế thần chính trị'']:
    pronouns_and_address: [''Độc thoại nội tâm dùng "mình" (DEC-P01-001)'']: pov_and_logic:
    [''Giữ đánh giá mức độ hậu quả (vấn đề còn lớn hơn nhiều so với chuyện tuân thủ
    quy định và sẽ khiến mình tiêu đời) cùng điều kiện phải giữ ít nhất vẻ ngoài hợp
    lý nếu không muốn trở thành vật tế thần chính trị'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000078
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000078: names_and_ranks: [''Imperial
    Army -> Lục quân Đế quốc'', ''military org -> quân đội'', ''sub of unknown nationality
    -> chiếc tàu ngầm không rõ quốc tịch'']: pronouns_and_address: [''Độc thoại nội
    tâm dùng "mình" / "Mình" cho Tanya (DEC-P01-001), "chúng ta" cho đơn vị, "nó"
    cho chiếc tàu ngầm và "họ" cho cấp trên trong quân đội'']: pov_and_logic: [''Giữ
    chuỗi ba câu hỏi tự vấn về việc để mặc tàu ngầm đi mà không kiểm tra dù đang ở
    ngay phía trên, nguy cơ gây ra mớ rắc rối lớn trong Lục quân Đế quốc (bởi Tanya
    vốn đã bị nhìn nhận như kẻ hay ép quân đội giải quyết đủ chuyện dù bản thân không
    có lựa chọn), suy luận từ việc tàu lạ hoạt động ở vùng biển này rằng nó hẳn chở
    hàng hóa cực kỳ quan trọng, và kết luận không thể làm ngơ'']: emphasis: [''Giữ
    đúng 2 phạm vi nhấn mạnh Markdown `*Chuyện đó*` và `*này*` ("vùng biển *này*",
    bản sửa F3) khớp chính xác với hai thẻ `<em>` trong nguồn theo DEC-P01-002'']'
  non_canon: true
