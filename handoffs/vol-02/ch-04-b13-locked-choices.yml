- segment_id: YS-LN02/Text/part0024.xhtml/p000057
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000057: names_and_ranks: [''anti-ship
    combat -> các trận chống hạm'', ''wounded men -> thương binh'']: pronouns_and_address:
    [''Tanya báo cáo qua vô tuyến tự xưng "tôi" và gọi đơn vị là "chúng tôi"'']: pov_and_logic:
    [''Giữ lời mở đầu lịch sự mang tính công vụ, lý do đã bay tuần tra nhiều giờ không
    chịu thêm được mệt mỏi và câu hỏi xin miễn tiếp tục giao chiến chống hạm khi đang
    mang theo thương binh'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000058
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000058: names_and_ranks: [''nearest
    base -> căn cứ gần nhất'']: pronouns_and_address: [''Sĩ quan điều phối tự xưng
    "Tôi" và gọi đơn vị của Tanya là "các anh" (đồng bộ b12 p000055)'']: pov_and_logic:
    [''Giữ xác nhận đã thu xếp cho đơn vị hạ cánh xuống căn cứ gần nhất và lời chúc
    trở về an toàn'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000059
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000059: names_and_ranks: []: pronouns_and_address:
    []: pov_and_logic: [''Giữ lời cảm ơn ngắn gọn và khẩu lệnh kết thúc phiên liên
    lạc vô tuyến ("Hết.")'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000060
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000060: names_and_ranks: [''Tanya
    -> Tanya'', ''controller -> sĩ quan điều phối'', ''base -> căn cứ'']: pronouns_and_address:
    [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng tên riêng "Tanya", đại từ "nó"
    và đại từ phản thân "mình" theo DEC-P01-001'']: pov_and_logic: [''Giữ hàm ý rằng
    thực chất Tanya chỉ nói vòng vo là mình muốn về nhà, suy đoán sĩ quan điều phối
    cũng không kỳ vọng nhiều khi hỏi, và kết quả xin phép về căn cứ suôn sẻ'']: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000061
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000061: names_and_ranks: [''Tanya
    -> Tanya'', ''nearby base -> căn cứ gần đó'', ''controller -> sĩ quan điều phối'']:
    pronouns_and_address: [''Trần thuật ngôi thứ ba quy chiếu Tanya bằng "Tanya" và
    "nó" (DEC-P01-001), quy chiếu đơn vị bằng "họ"'']: pov_and_logic: [{''Giữ sự tương
    phản báo trước của người kể chuyện'': ''trên đường tới căn cứ gần đó mà sĩ quan
    điều phối đã chu đáo thu xếp chỗ nghỉ, Tanya không hề biết nó sắp gặp một cuộc
    chạm trán "khá thú vị" (sắc thái mỉa mai)''}]: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000062
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000062: names_and_ranks: [''Magic
    Major Tanya von Degurechaff -> Thiếu tá ma thuật Tanya von Degurechaff'', ''senior
    officer -> sĩ quan cấp cao nhất'']: pronouns_and_address: [''Quy chiếu danh từ
    chung "sĩ quan cấp cao nhất" ở các câu sau bằng đại từ khái quát "họ"'']: pov_and_logic:
    [''Giữ thuật ngữ tạm "Thiếu tá ma thuật" (`vol02-ch04-b13-magic-major`) và chuỗi
    lập luận về quyền hạn, trách nhiệm phải ra quyết định của sĩ quan cấp cao nhất
    trên không phận theo điều họ tin là tốt nhất'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000063
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000063: names_and_ranks: []: pronouns_and_address:
    [''Dùng "người ta" cho đại từ khái quát "you"'']: pov_and_logic: [{''Giữ bài học
    rút ra từ sách phát triển bản thân'': ''quyết định không kịp thời hay phán đoán
    quá muộn đều vô nghĩa, nhưng quyết định cẩu thả cũng là điều cấm kỵ''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000064
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000064: names_and_ranks: []: pronouns_and_address:
    []: pov_and_logic: [''Giữ kết luận rằng điều quan trọng nhất là sự cân bằng —
    kỹ năng thiết yếu của mọi công việc quản lý'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000065
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000065: names_and_ranks: [''Northern
    Sea -> Biển Bắc'', ''submarine of unknown nationality -> chiếc tàu ngầm không
    rõ quốc tịch'']: pronouns_and_address: [''Độc thoại nội tâm dùng "chúng tôi" cho
    đơn vị và "mình" cho Tanya theo DEC-P01-001'']: pov_and_logic: [''Giữ địa danh
    tạm "Biển Bắc" (`vol02-ch04-b13-northern-sea`, bản sửa F1), cấu trúc tăng tiến
    "không chỉ… mà việc… còn là…" (thời tiết bay tệ nhất cộng thêm việc chạm trán
    tàu ngầm không rõ quốc tịch trên đường về) và lời than phiền xui xẻo đến mức nghi
    ngờ lý thuyết xác suất'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000066
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000066: names_and_ranks: [''Tanya
    -> Tanya'', ''most senior officer -> sĩ quan cấp cao nhất'']: pronouns_and_address:
    [''Đại từ "nó" quy chiếu chiếc tàu ngầm vừa phát hiện; chủ thể Tanya nêu rõ bằng
    tên riêng'']: pov_and_logic: [{''Giữ quan hệ nhân quả'': ''vì đã phát hiện ra
    chiếc tàu ngầm nên Tanya, với tư cách sĩ quan cấp cao nhất, buộc phải xử lý''}]:
    emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000067
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000067: names_and_ranks: [''troops
    -> quân lính'', ''soldiers -> những người lính'']: pronouns_and_address: [''Câu
    đầu là trần thuật ngôi thứ ba dùng "Nó" cho Tanya và "họ" cho binh lính; các câu
    sau chuyển sang độc thoại nội tâm dùng "chúng ta" cho loài người ("đồng loại của
    chúng ta"), "họ" cho binh lính và "Mình" cho Tanya theo DEC-P01-001'']: pov_and_logic:
    [{''Bảo toàn sự chuyển điểm nhìn từ hành động cho quân tản ra và cảm giác phát
    ớn trước ánh mắt nghiêm nghị của thuộc cấp sang suy nghĩ nội tâm'': ''một phát
    bắn có thể giết gần trăm đồng loại, binh lính quyết tâm không bắn trượt, và lời
    nguyền rủa thế giới nơi con người không thể hành xử như con người''}]: emphasis:
    none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000068
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000068: names_and_ranks: [''war
    laws -> luật chiến tranh'', ''Tanya -> Tanya'']: pronouns_and_address: [''Mệnh
    đề dẫn trần thuật dùng tên riêng "Tanya"'']: pov_and_logic: [''Giữ lời rủa xả
    nội tâm hướng vào "luật chiến tranh" (`vol02-ch04-b13-law-of-war`)'']: emphasis:
    [''Giữ đúng phạm vi nhấn mạnh Markdown `*Với cả luật chiến tranh nữa, cứ chết
    tiệt đi*` cho phần độc thoại trực tiếp và đặt mệnh đề dẫn ở ngoài dấu sao theo
    DEC-P01-002'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000069
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000069: names_and_ranks: [''right
    to innocent passage -> quyền qua lại vô hại'', ''submarines -> tàu ngầm'', ''principle
    of legality -> nguyên tắc pháp chế'', ''maritime court -> tòa án hàng hải'']:
    pronouns_and_address: [''Độc thoại nội tâm dùng "Các người" cho đại từ ngôi thứ
    hai mang sắc thái trách cứ/mỉa mai'']: pov_and_logic: [''Giữ lời chê trách lỗ
    hổng pháp lý khi không có điều khoản về "quyền qua lại vô hại" (`vol02-ch04-b13-innocent-passage`)
    cho tàu ngầm, hai câu hỏi tu từ mỉa mai về việc viện dẫn "nguyên tắc pháp chế"
    (`vol02-ch04-b13-principle-of-legality`) hay chờ phán quyết từ "tòa án hàng hải"
    (`vol02-ch04-b13-maritime-court`), và câu kết khẳng định đây không phải chuyện
    đùa'']: emphasis: none'
  non_canon: true
- segment_id: YS-LN02/Text/part0024.xhtml/p000070
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0024.xhtml/p000070: names_and_ranks: [''submarine
    of unknown nationality -> chiếc tàu ngầm không rõ quốc tịch'', ''Imperial Army
