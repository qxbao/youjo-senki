segment_id_end: YS-LN02/Text/part0014.xhtml/p000189
choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000168
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000168: locks: [''Giữ các danh
    xưng `pháp sư Liên minh Entente trung bình`, `Tiểu đoàn Viper`, `pháp sư Đế quốc`,
    đại từ `họ`, các cụm `những cải tiến về chất lượng`, `hỏa lực có kỷ luật`, và
    tình thái `xét trên năng lực cá nhân thì pháp sư Đế quốc vẫn phải vượt trội`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000169
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000169: locks: [''Giữ đại từ `họ`
    – `mình` / `Họ`, danh xưng chức năng `bộ phận kiểm soát không phận` (theo `chapter1_b01_pending_terms`),
    và phủ định `chênh lệch quân số đôi chút không thể đánh bại họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000170
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000170: locks: [''Giữ danh xưng
    `Tình báo`, các cụm `bản báo cáo qua loa ấy`, `sương mù chiến tranh`, `binh sĩ
    ở tuyến đầu`, đại từ `họ`, và câu kết `Mọi chuyện đều dựa trên thông tin sai lệch
    như thế, bảo sao họ không muốn buông lời cay nghiệt.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000171
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000171: locks: [''Giữ tiếng hô
    cảnh báo `“—Chỉ huy!”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000172
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000172: locks: [''Giữ hình ảnh
    đã sửa theo signoff `MOD-1` `Máu anh bung đỏ`, đại từ `anh`, và cụm `khi che chắn
    cho một cấp dưới đã bất cẩn cơ động vào làn đạn của địch`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000173
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000173: locks: [''Giữ đại từ `anh`,
    cụm `động tác né tránh`, tình thái suy đoán kết hợp phủ định `hẳn anh đã không
    bất tỉnh`, phủ định `Tính mạng anh trước mắt không gặp nguy hiểm`, và nhận định
    `nhưng theo những gì người lính kia nhận thấy, vết thương khá nghiêm trọng`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000174
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000174: locks: [''Giữ các đại từ
    `anh`, `họ`, các danh xưng `pháp sư Đế quốc`, `Liên minh Entente`, `các pháp sư
    của Tiểu đoàn Viper`, phủ định `hỏa lực đủ sức xuyên thủng lớp vỏ phòng ngự của
    pháp sư Đế quốc không thể đến từ trang bị tiêu chuẩn của Liên minh Entente`, và
    cụm `biến trận đánh thành thế ba bên`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000175
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000175: locks: [''Giữ đại từ `Tôi`,
    hô hiệu `02`, đại từ ngôi thứ hai `cậu` (theo `vol02-ch02-b08-tanya-address-to-viper02`),
    và câu thoại bàn giao `“…Tôi sơ suất rồi. Xin lỗi, 02. Phần còn lại giao cho cậu.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000176
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000176: locks: [''Giữ cách đáp
    `Rõ, Chỉ huy!`, các hô hiệu `07 và 13`, đại từ `hai người`, đại từ ngôi thứ ba
    `anh ấy` quy chiếu chỉ huy bị thương, và mệnh lệnh `Rút lui cùng anh ấy đi!`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000177
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000177: locks: [''Giữ hô hiệu `02`,
    các đại từ `họ`, `anh`, `chúng`, đúng phạm vi nhấn mạnh in nghiêng theo `DEC-P01-002`
    `*Chỉ cần phòng thủ thôi*`, và tương quan tổn thất `quân số tiểu đoàn chỉ còn
    một nửa ban đầu`, `Số pháp sư tương đương một đại đội đã rút lui`, `Một nửa đại
    đội nữa bị bắn hạ, vẫn nằm dưới mặt đất`, `tập kích các kho tiếp tế của họ`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000178
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000178: locks: [''Giữ danh xưng
    kèm ký hiệu chú thích chữ số mũ `Sở chỉ huy⁷` (theo `vol02-ch02-b08-footnote-marker`
    và `handoffs/vol-02/ch-02-b08.yml`), hô hiệu `01`, danh xưng `Tiểu đoàn Viper`,
    và câu thông báo `“Sở chỉ huy⁷, nghe rõ không? Đây là 01. Quyền chỉ huy Tiểu đoàn
    Viper đã được chuyển giao.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000179
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000179: locks: [''Giữ câu đáp vô
    tuyến `“Sở chỉ huy nghe rõ. Viper 02, nghe rõ không?”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000180
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000180: locks: [''Giữ thuật ngữ
    đã sửa theo signoff `mất sức chiến đấu` (theo `vol02-ch02-b08-combat-ineffective`),
    các cụm `người điện đài ở sở chỉ huy`, `Đại đội được điều đi trước`, `pháo thủ
    phòng không`, `kho tiếp tế`, `các trận địa pháo phòng không tạm thời được thiết
    lập để bắn chi viện trực tiếp`, tình thái `Có lẽ chúng có thể đánh chặn đôi chút`,
    và phủ định `nhưng không đời nào chống nổi một cuộc tấn công quy mô lớn`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000181
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000181: locks: [''Giữ hô hiệu `Viper
    02`, danh xưng `Chỉ huy`, đại từ `tôi`, và câu thoại `“Không vấn đề gì. Đây là
    Viper 02. Chỉ huy bị thương nặng, nên tôi tiếp quản quyền chỉ huy.”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000182
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000182: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, đại từ nội tâm tự quy chiếu
    `Mình` của Viper 02 (theo `vol02-ch02-b08-viper-interior-self-reference`), danh
    xưng `Chúa`, và câu `*Khốn thật, phải làm sao đây? Mình muốn có thời gian bình
    tĩnh nghĩ cách xử lý. Nếu Chúa tồn tại thì đúng là một tên khốn nạn.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000183
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000183: locks: [''Giữ các cụm `Sở
    chỉ huy nghe rõ`, `Đội quan sát mặt đất` (theo `vol02-ch02-b08-surface-observer-squad`),
    `hai cụm quân cấp đại đội đang tiến đến từ phía đông bắc`, và các đại từ `chúng`,
    `các anh`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000184
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000184: locks: [''Giữ thuật ngữ
    `Quân tiếp viện`, hô hiệu `Viper 02`, các danh xưng `Liên minh Entente`, `một
    trung đoàn pháp sư`, `một kho tiếp tế duy nhất`, đại từ nội tâm `mình` / `ta`
    và đúng hai phạm vi nhấn mạnh in nghiêng theo `DEC-P01-002`: `*Trong trận đánh
    đẫm máu này, chúng đang bào mòn đồng đội mình, vậy mà ta đã hạ hơn cả một đại
    đội quân khốn kiếp ấy rồi.*` và `*Tại sao?*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000185
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000185: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các danh xưng `cơ quan tình
    báo`, `Liên minh Entente`, đại từ `chúng ta`, và câu `*Đây còn là vấn đề lớn hơn
    cả sự bất tài của cơ quan tình báo. Rõ ràng Liên minh Entente có nhiều quân hơn
    hẳn những gì chúng ta tưởng.*`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000186
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000186: locks: [''Giữ hô hiệu `Viper
    02`, danh xưng `sở chỉ huy`, đại từ `tôi`, và câu mở đầu xin ý kiến `“Viper 02
    gọi sở chỉ huy. Nếu được phép, tôi xin nêu nhận định về tình hình…”`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000187
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000187: locks: [''Giữ đúng phạm
    vi nhấn mạnh in nghiêng của ba câu độc thoại nội tâm đầu đoạn theo `DEC-P01-002`,
    đại từ `Chúng ta` / `đơn vị chúng ta`, phủ định `Chúng ta không thể tiếp tục những
    nhiệm vụ đánh chặn như thế này`, các cụm `kho tiếp tế`, `chuyển sang cố thủ`,
    `tiêu diệt sạch`, `tràn ngập`, và câu trần thuật ngoài vùng in nghiêng `Sau khi
    quyết định, 02 phải báo cho sở chỉ huy.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000188
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000188: locks: [''Giữ các danh
    xưng `Tiểu đoàn`, `kho tiếp tế`, các đại từ `Tôi`, `chúng tôi`, phủ định `Tôi
    không nghĩ chúng tôi còn trụ được lâu`, và lời xin rút lui `Đề nghị lập tức cho
    phép rút lui. Tôi muốn đưa quân về kho tiếp tế.`.'']'
  non_canon: true
- segment_id: YS-LN02/Text/part0014.xhtml/p000189
  kind: voice_marker
  value: 'segment_id: YS-LN02/Text/part0014.xhtml/p000189: locks: [''Giữ các danh
    xưng `Tiểu đoàn Viper`, `lực lượng phòng thủ của kho tiếp tế`, `các pháp sư đã
    rút lui`, tình thái `Kho có thể sẽ bị hư hại nhiều hơn`, và phủ định `nhưng lúc
    này chẳng còn cách nào khác để đánh chặn`.'']'
  non_canon: true
