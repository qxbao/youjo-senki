choices:
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000272
  kind: terminology_and_voice
  value: choices=["Khóa tên đơn vị 'Tiểu đoàn Pháp sư Trên không số 203', các thuật
    ngữ 'nghiên cứu kỹ năng tác chiến', 'các đợt tấn công mặt đất', 'tập kích', 'học
    thuyết tấn công mặt đất', cách gọi 'Cấp trên', đại từ gộp 'chúng ta' và tình thái
    suy đoán 'hẳn muốn'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: giữ đại từ gộp ''Chúng ta'' và cấu trúc phủ định
    kèm điều kiện ''không thể cứ thế quay về lấy thêm đạn nếu chẳng may mang không
    đủ đâu''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000274
  kind: terminology_and_voice
  value: choices=["Giữ sự chuyển dịch từ câu suy nghĩ chung ('Chúng ta') sang trần
    thuật ngôi thứ ba về Tanya dùng tên 'Tanya', đại từ phản thân 'mình' và đại từ
    'nó' (DEC-P01-001); bảo toàn tương phản 'trái ngược với tông giọng của mình, vẻ
    mặt nó lại thoáng chút mệt mỏi'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss hỏi Tanya: giữ lối nói ngập ngừng ''Th-Thiếu tá…'',
    kính ngữ ''sao ạ?'' và thuật ngữ ''súng bắn tỉa chống tăng''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Weiss: xưng ''Tôi'', giữ sắc thái nghe truyền
    đạt lại ''Nghe đâu... Tôi nghe nói có thể kỳ vọng...'', khóa ''súng trường bắn
    tỉa xuyên giáp'' và ''lớp vỏ phòng thủ''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Trần thuật bám điểm nhìn Tanya: giữ tên ''Weiss'', ''Tanya'',
    đại từ ''nó'' và phản thân ''mình'' (DEC-P01-001), cùng tình thái giả định ''có
    lẽ cũng sẽ cảm thấy y như vậy thôi''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss: giữ cấu trúc giả định bỏ lửng ''…Nếu là tác chiến
    trận địa có chiến hào hay đại loại thế thì có lẽ nó sẽ khá hữu dụng, nhưng…''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Weiss: xưng ''Tôi'' - gọi ''anh'' và khóa cấp
    bậc ''Đại úy Weiss''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000280
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss: khóa cụm ''mấy người ở hậu phương'', ''giao chiến
    của pháp sư'' và ''công thành chiến''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000281
  kind: terminology_and_voice
  value: choices=["Trần thuật ngắn giữ tên riêng 'Bản thân Tanya'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000282
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: xưng ''Tôi'' / ''tôi'' và phản thân ''mình'', khóa
    ''hàng tồn kho'', ''14,5 milimét'', ''súng bắn phát một'', ''lớp vỏ phòng thủ'',
    ''trận chiến cơ động cao độ'' và câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000283
  kind: terminology_and_voice
  value: choices=["Bảo toàn nhấn mạnh Markdown cho câu nội tâm trực tiếp '*Chà, tìm
    ra câu trả lời cho chuyện đó là công việc của mình mà*' (DEC-P01-002), tự xưng
    'mình' trong nội tâm và giữ tên 'Tanya' ở phần dẫn (DEC-P01-001)."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000284
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: khóa ''nghiên cứu kỹ năng tác chiến'', ''nhiệm vụ
    thử nghiệm'', ''pháp sư trên không'', đại từ ''họ'' (đơn vị) và ''Nó'' (Tanya,
    DEC-P01-001), cùng mệnh đề phủ định ''mà pháp sư thường không dùng tới''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000285
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đại từ ''họ'' (đơn vị), ''nó'' và phản thân ''mình''
    (Tanya, DEC-P01-001), phủ định tuyệt đối ''chẳng bao giờ có dịp dùng đến'' và
    cụm ''dưới cái cớ đánh giá lại''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000286
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' (DEC-P01-001) và khóa cụm 'Dây băng
    đạn cùng đủ thứ phụ kiện lỉnh kỉnh'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000287
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' và phản thân 'mình' (DEC-P01-001),
    khóa hình ảnh so sánh 'nhân vật hoạt hình trong truyện tranh Mỹ'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000288
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' (DEC-P01-001) và giữ cấu trúc so
    sánh giả định 'xấp xỉ như thể nó đang khoác một bộ giáp toàn thân'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000289
  kind: terminology_and_voice
  value: choices=["Giữ câu chuyển ý nhấn mạnh mức độ tăng tiến 'Thế nhưng hiện thực
    thậm chí còn nực cười hơn nữa.'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000290
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' (DEC-P01-001), giữ lối nói phóng
    đại khẩu ngữ 'tốt hơn gấp tỉ lần' và quan hệ nhân quả 'nên nó buộc phải thúc giục
    mọi người đeo thêm dù chỉ một dây băng đạn dự phòng'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000291
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ tên 'Tanya', phủ định nhấn mạnh 'hoàn toàn chẳng
    có chút hứng thú nào' và sắc thái bất định 'một thứ vũ khí chưa biết có hữu dụng
    hay không'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000292
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' (DEC-P01-001), khóa tên khí tài 'Elinium
    Type 95', 'nhân sự thử nghiệm' và 'các loại vũ khí hiện có'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000293
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'Nó' và phản thân 'mình' (DEC-P01-001),
    giữ quan hệ nhượng bộ và phỏng đoán tương lai 'ngay cả khi không thể dùng tới
    trong lần này, biết đâu sẽ có cơ hội trong tương lai…'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=["Thoại lẩm bẩm một mình của Tanya: tự xưng ''Mình'', khóa cụm ''tiền
    thuế và quốc lực'' và ''chính phủ''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000295
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'Nó' / 'nó' (DEC-P01-001), khóa 'báo cáo
    nghiên cứu kỹ năng tác chiến' và 'các đợt tập kích mặt đất'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của Serebryakov với Tanya: mở đầu bằng ''Thưa Thiếu
    tá'' và lặp lại danh xưng ''Thiếu tá'' ở cuối câu."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Serebryakov: gọi ''cô'', khóa cấp bậc ''Trung
    úy Serebryakov'' và định danh ''Đài Kiểm soát''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000298
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó' / 'mình' (Tanya, DEC-P01-001) và 'Họ' (đơn
    vị); khóa 'súng trường bắn tỉa xuyên giáp', 'lựu đạn cầm tay', 'các cơ sở dưới
    mặt đất', 'bộc phá lõm'; bảo toàn nhấn mạnh Markdown cho câu độc thoại nội tâm
    '*Chúng ta sắp đánh một trận chiến xa hoa thật đấy.*' (DEC-P01-002)."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000299
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' / 'Nó' (DEC-P01-001); bảo toàn nhấn
    mạnh Markdown cho câu nội tâm '*Xét về tổng thể thì chẳng hiệu quả chút nào, nhưng
    tình thế tiến thoái lưỡng nan ở đây là như vậy lại khá tiện lợi cho những người
    ngoài thực địa.*' (DEC-P01-002)."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000300
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó' (Tanya, DEC-P01-001) và 'họ' (đơn vị); khóa
    'Tiểu đoàn Pháp sư Trên không số 203', 'vùng lục địa chính của Khối Thịnh vượng
    chung' và 'nhiệm vụ thử nghiệm tấn công mặt đất'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000301
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ tên riêng 'Tanya'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000302
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'Nó' / 'nó' (DEC-P01-001), giữ tình thái
    suy đoán 'Có lẽ vì không có đủ dữ liệu khí tượng' và khóa địa danh 'Eo biển Chim
    Dodo'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến của Tanya: khóa mã gọi ''Fairy 01'', ''Đài Kiểm
    soát Galba'' và khẩu lệnh liên lạc ''Nghe rõ trả lời!''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000304
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'Nó' (DEC-P01-001) và giữ mệnh đề phủ
    định 'nhưng chẳng có tiếng trả lời'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: giữ câu nhận định phủ định ''Không ăn thua rồi…'',
    thuật ngữ ''Nhiễu khí quyển sao?'' và đánh giá cảm thán cuối câu."]'
