choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''interference in supreme command'' -> ''xâm phạm quyền
    thống soái''.", "Điểm nhìn & đại từ: trần thuật theo góc nhìn Zettour (''Ông''),
    gọi Degurechaff là ''cô''.", "Tình thái & phủ định: giữ suy đoán ''Chắc hẳn''
    và phủ định ''chẳng có vấn đề gì cả'', ''không thấy muốn phàn nàn''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị & thuật ngữ: ''Second Guard Division'' -> ''Sư đoàn
    Cận vệ số 2''; ''the First'' -> ''Sư đoàn Cận vệ số 1''; ''the court'' -> ''triều
    đình''.", "Xưng hô & phủ định: Zettour dùng ''chúng ta'', gọi Degurechaff là ''cô
    ấy''; giữ phủ định giả định ''sẽ chẳng bao giờ được điều ra thực chiến''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị & xưng hô: ''Second Guard Division'' -> ''Sư đoàn Cận
    vệ số 2''; Lergen gọi Degurechaff là ''cô ta'' và dùng tiểu từ lễ phép ''ạ'' khi
    nói với cấp trên.", "Dấu câu & đối lập: giữ dấu chấm lửng mở đầu và quan hệ nhượng
    bộ – đối lập ''Đúng là hiện tại..., nhưng rõ ràng...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & xưng hô: Zettour gọi Trung tá Lergen bằng cách gọi tắt
    ''Colonel'' -> ''Trung tá'', xưng hô ''anh''.", "Tình thái & phủ định: giữ sắc
    thái rào đón giảm nhẹ mệnh lệnh ''Có lẽ anh không nên nói thêm nữa đâu''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: ''He'' (Zettour) -> ''Ông''; giữ phủ định ''không
    có hứng nghe thêm bất cứ điều gì nữa''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & dấu câu: ''General'' -> ''Thưa Tướng quân'' (nhất quán
    với ch-06-b15); giữ dấu chấm hỏi kết hợp chấm than ''?!''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''Colonel von Degurechaff'' -> ''Trung tá
    von Degurechaff''; ''field officer'' -> ''sĩ quan tác chiến''; ''Guard Divisions''
    -> ''các Sư đoàn Cận vệ''; ''the court'' -> ''triều đình''.", "Xưng hô & câu hỏi:
    Zettour gọi Lergen là ''Anh''; giữ câu hỏi tu từ phủ định cuối đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000531
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & đại từ: giữ dấu gạch ngang ngắt lời ''“Nhưng—”''; trần
    thuật gọi Lergen là ''ông''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000532
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: ''We'' -> ''Chúng ta''; ''them'' -> ''họ'';
    giữ phủ định ''không có điều kiện để mặc họ ngồi không ăn rỗi đâu''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000533
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''front lines'' -> ''tiền tuyến''; ''Kampfgruppe''
    -> ''Kampfgruppe''; ''Imperial Army'' -> ''Lục quân Đế quốc''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000534
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ phủ định kép ''không thể phủ nhận'';
    ''armchair theory'' -> ''lý thuyết suông trên bàn giấy''; ''doctrine'' -> ''học
    thuyết''; giữ câu hỏi tu từ kết đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000535
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc: ''front lines'' -> ''tiền tuyến''; giữ quan
    hệ mục đích ''Để thực sự kiểm chứng... và giảm bớt...'' cùng nhận định ''rất khó
    tránh khỏi...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000536
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Anh hiểu điều đó mà, phải không?*''
    khớp thẻ em trong XHTML (DEC-P01-002).", "Thuật ngữ & phủ định: ''magic officers''
    -> ''sĩ quan ma pháp''; giữ phủ định bộ phận ''hầu như chẳng có''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000537
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ phủ định nhấn mạnh ở đầu câu và cuối câu; khuyến
    nghị đổi ''hạng người đó'' thành ''kiểu người như vậy'' hoặc ''những người như
    vậy''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000538
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị & thuật ngữ: ''General Staff’s firefighting team''
    -> ''đội cứu hỏa của Bộ Tổng tham mưu''; ''203rd Aerial Mage Battalion'' -> ''Tiểu
    đoàn Pháp sư Trên không số 203''; ''Kampfgruppe'' -> ''Kampfgruppe''.", "Quan
    hệ điều kiện: giữ cấu trúc câu điều kiện ''Nếu tiểu đoàn... sẽ trở thành hạt nhân...,
    thì suy cho cùng, chỉ huy của nó buộc phải là Degurechaff''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000539
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''front lines'' -> ''tiền tuyến''; ''Colonel
    von Lergen'' -> ''Trung tá von Lergen''; ''staff officer'' -> ''sĩ quan tham mưu''.",
    "Xưng hô: Zettour xưng ''tôi'', gọi Lergen là ''anh''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000540
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Lergen xưng ''Tôi / tôi'', gọi Zettour
    là ''ngài'' kèm ''ạ'', gọi Degurechaff là ''cô ta''.", "Cấp bậc & địa danh: ''Colonel
    von Degurechaff'' -> ''Trung tá von Degurechaff''; ''Kampfgruppe'' -> ''Kampfgruppe'';
    ''southern continent'' -> ''lục địa phía nam''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''General von Romel'' -> ''Tướng von Romel'';
    ''matériel war'' -> ''cuộc chiến tiêu hao vật chất''.", "Đại từ & phủ định: ''We''
    -> ''Chúng ta''; giữ hai mệnh đề phủ định ''không thể cầm cự ở dưới đó thêm nữa
    đâu'' và ''không thể để bị kéo vào...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị: ''Southern Continent Expeditionary Army Corps'' ->
    ''Quân đoàn Viễn chinh Lục địa Phía nam''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''tactical victories'' -> ''thắng lợi chiến
    thuật''; ''matériel strength'' -> ''ưu thế vật chất''; giữ trạng thái miễn cưỡng
    vì mục đích chính trị của Zettour."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & thuật ngữ: ''Commonwealth'' -> ''Khối Thịnh vượng
    chung''; ''Republicans'' -> ''phe Cộng hòa''; ''Empire'' -> ''Đế quốc''; ''Kingdom
    of Ildoa'' -> ''Vương quốc Ildoa''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Commonwealth Navy'' -> ''Hải quân Khối Thịnh vượng
    chung''; ''marine mages'' -> ''lực lượng pháp sư hải quân đánh bộ''; ''transport
    fleet'' -> ''hạm đội vận tải''; ''expeditionary forces'' -> ''lực lượng viễn chinh''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''General von Romel'' -> ''Tướng von Romel'';
    ''maneuver warfare'' -> ''tác chiến cơ động''; ''strategic inferiority'' -> ''thế
    yếu về chiến lược''; ''tactical victories'' -> ''thắng lợi chiến thuật''.", "Đại
    từ & tình thái: ''he'' (Romel) -> ''ông''; giữ mức độ hy vọng thấp ''chẳng có
    mấy hy vọng rằng...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: giữ quan hệ nguyên nhân – hệ quả ''Vì họ đã
    đạt được mục tiêu ban đầu..., nên ý tưởng dốc thêm quân vào thời điểm này chỉ
    có thể...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Lergen dùng ''chúng ta'', gọi Zettour là
    ''ngài'' kèm ''ạ'', gọi Degurechaff là ''cô ta''; ''matériel disparity'' -> ''sự
    chênh lệch về vật tư và trang bị''; ''Commonwealth marine mages'' -> ''đám pháp
    sư hải quân đánh bộ của Khối Thịnh vượng chung''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thành ngữ: Zettour xưng ''tôi'', gọi Degurechaff là
    ''cô ấy''; giữ giới hạn thời gian ''Trong một thời gian'' và thành ngữ ''muối
    bỏ bể''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''matériel'' -> ''vật tư và trang bị quân sự''; ''Imperial
    Army'' -> ''Lục quân Đế quốc''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: ''matériel'' -> ''vật tư và trang bị quân
    sự''; ''Commonwealth Army'' -> ''Lục quân Khối Thịnh vượng chung''; ''remnants
    of the Republican Army'' -> ''tàn dư của Quân đội Cộng hòa''; ''Free Republic''
    -> ''Cộng hòa Tự do''.", "Giọng thoại: giữ câu chêm ngập ngừng tự sửa lời ''—à,
    Cộng hòa Tự do thì phải?—''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Đại từ: ''they'' -> ''họ''; giữ mức độ nhấn mạnh ''Đúng hệt như
    những gì họ hằng lo sợ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Degurechaff là ác quỷ hay sao?!*''
    khớp thẻ em trong XHTML (DEC-P01-002).", "Đại từ & thuật ngữ: ''He'' (Zettour)
    -> ''Ông''; ''her'' -> ''cô''; ''Unified States'' -> ''Hợp chúng quốc''; ''southern
    continent'' -> ''lục địa phía nam''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Tình thái & tên riêng: ''apparently'' -> ''xem chừng''; ''Unified
    States'' -> ''Hợp chúng quốc''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quy chiếu: ''private enterprises'' -> ''doanh nghiệp
    tư nhân''; ''Empire'' -> ''Đế quốc''; ''third country'' -> ''một nước thứ ba'';
    giữ câu ngắn cuối đoạn quy chiếu ẩn ý về Hợp chúng quốc (''Hoặc chính là cái nước
    kia.'')."]'
