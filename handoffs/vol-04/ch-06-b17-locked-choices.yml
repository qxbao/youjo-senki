- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000586
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''attract and annihilate strategy'' -> ''chiến lược
    nhử địch và tiêu diệt hoàn toàn''; ''interior lines'' -> ''tuyến trong''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000587
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên riêng: ''Republican Army'' -> ''Quân đội Cộng
    hòa''; ''the Rhine'' -> ''mặt trận Rhine''; ''eastern faction'' -> ''Phái miền
    Đông''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000588
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Attritional Containment Doctrine'' -> ''Học thuyết
    Kiềm chế Tiêu hao''; ''Decisive Battle Doctrine'' -> ''Học thuyết Quyết chiến'';
    ''eastern faction'' -> ''Phái miền Đông''; ''General Staff'' -> ''Bộ Tổng tham
