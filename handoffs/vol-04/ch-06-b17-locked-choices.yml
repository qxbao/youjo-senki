choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & thuật ngữ: ''Unified States'' -> ''Hợp chúng quốc'';
    ''Degurechaff’s paper'' -> ''bài tiểu luận ... của Degurechaff''.", "Tình thái:
    giữ mức độ khả năng ''có thể kéo... vào cuộc chiến'' và rào đón ''Chí ít thì đó
    là...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000557
  kind: terminology_and_voice
  value: 'choices=["Đại từ & tên riêng: ''Her'' (Degurechaff) -> ''cô''; ''executives
    of the Unified States'' -> ''giới lãnh đạo hành pháp của Hợp chúng quốc''; ''Imperial
    Army'' -> ''Lục quân Đế quốc''.", "Tình thái: giữ mức độ đánh giá xác suất ''thực
    ra có khả năng rất cao là sự thật''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000558
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & xưng hô: ''Colonel von Lergen'' -> ''Trung tá von Lergen'';
    Zettour dùng đại từ ''chúng ta''.", "Thuật ngữ & địa danh: ''matériel'' -> ''vật
    tư và trang bị quân sự''; ''southern continent'' -> ''lục địa phía nam''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000559
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu cảm thán ngắn biểu thị sự ngạc nhiên của
    Lergen ''“Hả?”''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000560
  kind: terminology_and_voice
  value: 'choices=["Bị động & ý đồ: giữ cấu trúc bị động nhấn mạnh chủ đích ''Tin
    đó đã được cố tình làm rò rỉ.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000561
  kind: terminology_and_voice
  value: 'choices=["Tên riêng: ''Commonwealth'' -> ''Khối Thịnh vượng chung''; ''Unified
    States'' -> ''Hợp chúng quốc''; ''imperial'' -> ''Đế quốc''.", "Sắc thái: giữ
    giọng mỉa mai trong nhận định nội tâm của Zettour (''vì có sở thích quái đản...'',
    ''đã có lòng tốt mật báo cho họ'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000562
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định: ''port of discharge'' -> ''cảng bốc dỡ'';
    giữ giới hạn ''Cách duy nhất để tránh nổ ra xung đột là...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000563
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & địa danh: ''southern continent'' -> ''lục địa phía
    nam''; ''raid from high altitude'' -> ''cuộc không kích từ tầm cao''; ''carpet-bomb''
    -> ''ném bom rải thảm''.", "Quan hệ nhân quả: giữ lập luận ''Xét cơ hội đánh trúng
    mục tiêu quá đỗi mong manh, cách duy nhất để thực hiện là...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000564
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''imperial air fleet'' -> ''Không hạm đội của Đế quốc'';
    ''western and eastern fronts'' -> ''cả hai mặt trận phía tây và phía đông''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000565
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''bombers'' -> ''máy bay ném bom''; ''southern
    continent'' -> ''lục địa phía nam''; giữ nhận định phủ định ''là điều bất khả
    thi''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000566
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: ''they'' -> ''họ''; ''mages'' -> ''pháp sư'';
    ''main lines'' -> ''các tuyến chính''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000567
  kind: terminology_and_voice
  value: 'choices=["Phủ định & kết luận: giữ quan hệ hệ quả ''Do đó, hiện tại họ chẳng
    có nước đi nào để thực hiện cả.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000568
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Zettour dùng ''chúng ta''; giữ phủ định kép
    ''lớn đến mức không thể phủ nhận'' và phủ định ''chẳng có cách nào ngăn chặn được''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000569
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & thuật ngữ: ''Unified States'' -> ''Hợp chúng quốc'';
    ''southern continent'' -> ''lục địa phía nam''; ''Commonwealth forces'' -> ''lực
    lượng của Khối Thịnh vượng chung''; ''Congress'' -> ''Quốc hội''; ''neutral third
    party'' -> ''bên thứ ba trung lập''.", "Giọng thoại & dấu câu: giữ tiểu từ lễ
    phép ''ạ'' của Lergen khi hỏi Zettour, giữ các dấu chấm lửng ngập ngừng và câu
    hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000570
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''The president'' -> ''vị tổng thống'';
    giữ sắc thái suy đoán ''Xem ra... đã chọn một lập trường khác''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000571
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & sắc thái: ''Unified States'' -> ''Hợp chúng quốc'';
    ''Empire'' -> ''Đế quốc''; giữ giọng mỉa mai ''các quý ông và quý bà lương thiện''
    và ''phiền phức hết chỗ nói''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000572
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Giá mà chỉ dừng lại ở đó…*'' khớp
    thẻ em trong XHTML (DEC-P01-002)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000573
  kind: terminology_and_voice
  value: 'choices=["Giả định & đối lập: giữ giả định trái thực tế ''Giá mà chỉ có
    vậy, hẳn họ sẽ là...'' và vế đối lập giữa ''tổng thống của Hợp chúng quốc'' với
    ''các cử tri''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000574
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: Lergen gọi Zettour là ''Ngài'' kèm ''ạ''; giữ
    dấu chấm lửng đầu câu."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000575
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & xưng hô: ''Empire'' -> ''Đế quốc''; ''Federation''
    -> ''Liên bang''; ''Commonwealth'' -> ''Khối Thịnh vượng chung''; Zettour dùng
    ''chúng ta'' và ''Tôi''.", ''Khuyến nghị chỉnh cụm từ thành ngữ ở vế hai theo
    finding để hợp giọng tướng lĩnh hơn.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000576
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: ''He'' (Zettour) -> ''Ông''; ''Unified States’
    pro-war faction'' -> ''phe chủ chiến của Hợp chúng quốc''; ''Empire'' -> ''Đế
    quốc''.", "Phủ định & ẩn dụ: giữ phủ định ở mệnh đề điều kiện và câu cuối cùng
    ẩn dụ ''trái táo độc''; khuyến nghị đổi ''tự dưng'' thành ''tự mình / chủ động''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000577
  kind: terminology_and_voice
  value: 'choices=[''Sắc thái: giữ sự bực bội khi phải bất lực nhìn kẻ địch hưởng
    lợi trong lời thoại của Zettour.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000578
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & phủ định: ''Empire'' -> ''Đế quốc''; giữ phủ định
    ''chẳng có gì là vùng cấm cả'' và khuyến nghị làm rõ quan hệ điều kiện hướng đích
    theo finding."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000579
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & xưng hô: ''Colonel'' (gọi Trung tá Lergen) -> ''Trung
    tá''; Zettour dùng ''chúng ta'' và ''tôi'', gọi thẳng họ ''Degurechaff''.", "Thuật
    ngữ: ''eastern lines'' -> ''chiến tuyến phía đông''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000580
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: giữ dấu chấm lửng và câu đáp lễ phép của cấp
    dưới ''“…Rõ, thưa ngài.”''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000581
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấp bậc: ''Great War'' -> ''Đại chiến''; ''Imperial
    Army General Staff'' -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; ''General von Zettour''
    -> ''Tướng von Zettour''; ''Rhine front'' -> ''mặt trận Rhine''; ''western faction''
    -> ''phái miền Tây''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000582
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''bloodletting strategy'' -> ''chiến lược rỉ máu''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000583
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''eastern faction'' -> ''phái miền Đông''; ''eastern
    army'' -> ''đạo quân phía đông''; ''eastern front'' -> ''mặt trận phía đông'';
    ''decisive strategy'' -> ''chiến lược quyết chiến''; ''encirclement and annihilation''
    -> ''bao vây và tiêu diệt hoàn toàn''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000584
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''western faction'' -> ''Phái miền Tây''; ''decisive
