    bao vây''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000585
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''eastern faction'' -> ''phái miền Đông''; ''Federation''
    -> ''Liên bang''; ''numerical superiority'' -> ''ưu thế về quân số''; ''western
