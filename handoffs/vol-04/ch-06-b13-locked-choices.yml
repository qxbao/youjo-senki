choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: giữ trạng thái suy ngẫm đầu đoạn với tình
    thái ''Có lẽ'' và đối lập thời gian ''sau khi chiến tranh kết thúc''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''direct support'' -> ''yểm trợ trực tiếp''.", "Xưng
    hô: sĩ quan cấp cao Bộ Tổng tham mưu xưng ''tôi'', gọi Degurechaff là ''cô''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Degurechaff đáp lời cấp trên bằng giọng lễ phép (''ạ'',
    ''ngài'' – ''tôi'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & logic: giữ quan hệ tăng tiến phủ định ''chưa hoàn
    tất khóa huấn luyện pháp sư, huống chi là đủ năng lực tham gia vào các trận đánh
    cơ động'' và giới hạn ''những trận đánh phòng ngự giới hạn''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''acceptable attrition rate'' -> ''tỷ lệ tiêu hao có
    thể chấp nhận được''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''instructors'' -> ''các sĩ quan huấn luyện''; ''formulas''
    -> ''các thuật thức''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''firing squad experience'' -> ''kinh nghiệm
    tham gia đội xử bắn''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Ngữ nghĩa: giữ sự liên kết trực tiếp giữa câu hỏi về đội xử bắn
    (p000397) và nhận định của người quan sát rằng Degurechaff đang hỏi về ''kinh
    nghiệm giết người của họ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & ẩn dụ: giữ ẩn dụ xem con người như ''những món hàng''
    (''products'') đã qua ''kiểm định'' (''tested'') và câu hỏi tu từ về ''cái nhìn
    thực dụng triệt để''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''substitutability and cost consciousness'' -> ''khả
    năng thay thế và ý thức về chi phí''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị & xưng hô: ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; xưng ''tôi/mình'' – ''ngài''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''he'' -> ''ông'' (chỉ vị sĩ quan cấp cao đang
    đối thoại với Degurechaff)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: giữ ''*Chẳng lẽ…*'' theo đúng thẻ em trong
    nguồn (DEC-P01-002)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi phủ định: giữ ''*Chẳng lẽ không một
    ai thấy chuyện này kỳ lạ sao?*'' theo đúng thẻ em trong nguồn (DEC-P01-002)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''inspection'' -> ''đợt thanh tra''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Tên đơn vị & cấp bậc: ''203rd Aerial Mage Battalion'' -> ''Tiểu
    đoàn Pháp sư Trên không số 203''; ''First Lieutenant Serebryakov'' -> ''Trung
    úy Serebryakov''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*...*'' cho câu cảm thán đầu đoạn
    ''*Kẻ ngu xuẩn nào lại đi đùa với lửa ngay trên kho thuốc súng thế không biết?*'',
    giữ phần trần thuật còn lại không in nghiêng (DEC-P01-002)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & đại từ: ''Lieutenant Colonel von Degurechaff'' -> ''Trung
    tá von Degurechaff''; trần thuật gọi Tanya là ''cô''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000414
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc: ''Colonel von Degurechaff'' -> ''Trung tá von Degurechaff''
    (nhất quán với cấp bậc thực tế của Tanya ở tập 4)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000416
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''First Lieutenant Grantz'' -> ''Trung úy
    Grantz''; ''long-range, low-altitude, decentralized raid exercise'' -> ''buổi
    diễn tập đột kích phân tán tầm xa ở độ cao thấp''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000417
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên đơn vị: ''mana signals'' -> ''tín hiệu ma lực'';
    ''203rd Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên không số 203''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000419
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''duty personnel'' -> ''nhân sự trực ban'';
    ''Captain Weiss'' -> ''Đại úy Weiss''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000420
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Ôi trời ơi.*'' ở câu cảm thán cuối
    đoạn theo đúng nguồn (DEC-P01-002)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000421
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ giọng thịnh nộ gay gắt của Degurechaff (''Đám
    đó vô dụng hết sức! ... bắn chết sạch cả lũ cho xong!'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000422
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc trần thuật: ''The colonel'' -> ''Vị trung tá''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000423
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế: giữ cấu trúc giả định ''Nếu cô là một bé
    gái... thì hẳn sẽ..., nhưng khi...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000424
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: ''ma’am'' -> ''thưa Trung tá''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000425
  kind: terminology_and_voice
  value: 'choices=["Chức danh & đại từ: ''the Kampfgruppe commander’s adjutant'' ->
    ''sĩ quan phụ tá cho chỉ huy Kampfgruppe''; trần thuật gọi Weiss là ''anh''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000426
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Disobedience and insubordination'' -> ''Bất tuân
    thượng lệnh và vô kỷ luật''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000427
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & cấp bậc: giữ nhấn mạnh vào đại từ chỉ người
    nghe theo đúng thẻ em trong nguồn và cách gọi ''thưa Trung tá''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000429
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Bất tuân thượng lệnh
    và… vô kỷ luật ư?*'' ở câu đầu đoạn theo đúng thẻ em trong nguồn (DEC-P01-002);
    giữ điểm nhìn nội tâm của Weiss."]'
