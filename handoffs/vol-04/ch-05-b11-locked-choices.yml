choices:
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000001
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ tên 'Tanya', đại từ 'họ' (đơn vị), thuật ngữ 'đài
    kiểm soát mặt đất' và mệnh đề điều kiện phủ định 'nếu đến cả việc liên lạc với
    đài kiểm soát mặt đất cũng không thực hiện được'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến của Weiss: khóa mã gọi ''Fairy 02'', ''Fairy 01''
    và câu hỏi liên lạc ''Nghe rõ trả lời?''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000003
  kind: terminology_and_voice
  value: choices=["Thoại ngắn của Tanya 'Chỉ vừa đủ nghe thôi'; phần trần thuật giữ
    tên 'Tanya', 'Weiss', đại từ 'họ' và cấu trúc so sánh nguyên nhân 'Vấn đề nằm
    ở sự cản trở của khí quyển nhiều hơn là do thiết bị vô tuyến của họ'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thoại trao đổi trực tiếp: giữ đại từ gộp ''chúng ta'', tự xưng
    ''tôi'', khóa các cụm ''liên lạc nội bộ cự ly gần trong đơn vị'', ''Tiếng nhiễu''
    và ''liên lạc tầm xa''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss hỏi Tanya: giữ đại từ ''Chúng ta'', tự xưng ''tôi'',
    kính ngữ ''không ạ?'', khóa ''cảnh báo cấm bay'' và cấu trúc nhượng bộ giả định
    ''Ngay cả khi thời tiết thế này chưa tệ đến mức... tôi cũng sẽ chẳng ngạc nhiên
    nếu chiến dịch bị hủy bỏ đâu''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Weiss: gọi ''Anh'', dùng đại từ gộp ''chúng ta'',
    khóa ''lệnh hủy chiến dịch'', ''trạng thái im lặng vô tuyến'', ''đài kiểm soát
    mặt đất'' và tình thái suy đoán ''Khả năng cao là... Nếu rút về lúc này, có thể
    chúng ta sẽ làm các đơn vị khác rối loạn mất''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000007
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng đại từ 'nó' (DEC-P01-001) và tên 'Tanya';
    giữ cấu trúc phủ định mở đầu 'Không phải nó phủ nhận kết luận của các sĩ quan
    ngoài hiện trường' và cụm 'người ở hiện trường tự ý quyết định'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: giữ đại từ gộp ''chúng ta'' và phản thân ''mình'',
    khóa thuật ngữ ''tập kích mặt đất'' và hướng xử lý ''cứ triển khai chiến dịch
    này theo nhịp độ của riêng mình thôi''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss đáp Tanya: mở đầu ''Đã rõ'', giữ đại từ gộp ''chúng
    ta'' và câu đề xuất ''hay là chúng ta thu hẹp đội hình lại và giữ liên lạc chặt
    chẽ hơn nhé?''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000010
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ tên 'Tanya', bảo toàn nhấn mạnh Markdown cho ý nghĩ
    chớp nhoáng '*Khoan đã!*' (DEC-P01-002); thoại Tanya bác bỏ bằng phủ định '…Không,
    chúng ta không thể làm thế được' và cảnh báo 'nguy cơ bị tập kích bất ngờ tăng
    vọt mất'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000011
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ đại từ 'họ' (đơn vị), khóa 'căn cứ quan sát', 'hệ
    thống cơ sở mặt đất' và cấu trúc giả định tương phản giữa hai câu."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000012
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'Nó' / 'nó' (DEC-P01-001), khóa tên 'Khối
    Thịnh vượng chung', thuật ngữ 'công nghệ chặn thu vô tuyến' và phủ định 'không
    thể chấp nhận rủi ro'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh của Tanya: dùng đại từ gộp ''chúng ta'' / ''Chúng
    ta'', khóa ''hạm đội của Liên minh Hiệp ước'', ''đợt tập kích'', ''đội hình chiến
    đấu'' và phủ định ''không thể lặp lại cùng một sai lầm đến hai lần''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss nhận lệnh: khóa câu đáp ''Đã rõ, thưa Thiếu tá.''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: tự xưng ''tôi'', khóa ''im lặng vô tuyến'', ''radar'',
    ''nhiễu'' và lối nói giảm nhẹ ''tôi vẫn muốn mọi chuyện nhẹ nhàng hơn''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss: dùng đại từ gộp ''chúng ta'', giữ sự đối ứng từ ngữ
    ''chịu vất vả để mọi chuyện được nhẹ nhàng hơn sao?'' và câu đáp ''Rõ, thưa Thiếu
    tá!''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Trần thuật tổng kết: giữ đại từ ''họ'', cấu trúc đối lập hai lựa
    chọn về rủi ro và khóa tên đơn vị ''Tiểu đoàn Pháp sư Trên không số 203''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian - địa điểm: khóa ''NGÀY 29 THÁNG 4, NĂM THỐNG
    NHẤT 1926, KHỐI THỊNH VƯỢNG CHUNG''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Trần thuật mở cảnh phía Khối Thịnh vượng chung: giữ tên ''Mary'',
    khóa ''các học viên đồng khóa'', ''khóa huấn luyện cơ bản'', đại từ ''họ'' / ''bọn
    họ'' và phản thân ''mình''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000020
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ tên 'Mary' và sắc thái nhấn mạnh mức độ 'quá đỗi
    đột ngột'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thoại người chỉ huy đơn vị của Mary: tự xưng ''Tôi'', dùng đại
    từ gộp ''chúng ta'', khóa ''trạm radar phía nam'', ''tuyến cảnh giới'', ''đơn
    vị pháp sư trên không của Đế quốc'', ''lực lượng không quân quy mô lớn'' và ''tuyến
    phòng không cực nam''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Trần thuật bám điểm nhìn Mary: giữ tên ''Mary'', đại từ ngôi thứ
    ba ''cô'' (phân biệt với quy ước riêng cho Tanya theo DEC-P01-001), đại từ ''họ''
    (đơn vị), khóa ''tấm bản đồ không phận'' và bảo toàn nhấn mạnh Markdown cho hai
    cụm ''*hai phút trước*'', ''*tuyến phòng không cực nam*'' (DEC-P01-002)."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Trần thuật suy tính của Mary: dùng đại từ ''cô'', khóa ''đánh
    chặn'', ''trực chiến ở hậu phương'' và ''các đơn vị phòng không trên lục địa chính''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thoại người chỉ huy: khóa ''tín hiệu ma thuật của pháp sư địch'',
    ''đơn vị tinh nhuệ nhất của Lục quân Đế quốc'' và tình thái suy đoán ''khả năng
    cao''."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000025
  kind: terminology_and_voice
  value: choices=["Trần thuật giữ các cụm 'các sĩ quan', 'buổi phổ biến nhiệm vụ'
    và đại từ 'họ'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000026
  kind: terminology_and_voice
  value: choices=["Bảo toàn nhấn mạnh Markdown cho từ cảm thán nội tâm '*Trời ạ…*'
    (DEC-P01-002); phần trần thuật giữ tên 'Mary', đại từ 'cô' (Mary), 'bọn họ' (đơn
    vị Mary), 'ông ta' (viên sĩ quan lạ), khóa cấp bậc 'trung tá' và định danh 'pháp
    sư hải quân đánh bộ của Khối Thịnh vượng chung'."]
