choices:
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000290
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gọi Tanya là ''nó'' theo DEC-P01-001; giữ tên riêng
    ''Tanya'' ở vị trí nguồn nêu tên.", "Thuật ngữ: ''sĩ quan ma pháp'' (magic officer),
    ''lớp vỏ phòng thủ'' (defensive shell), ''thuật thức'' (formulas)."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000291
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ nguyên quan hệ phủ định kép ('bắn
    bừa mà chẳng thực sự nhắm', 'không cần phải chủ động đối phó') và mệnh đề tương
    phản ('nhưng việc bắn trượt mục tiêu ban đầu vẫn là một sai lầm')."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000293
  kind: terminology_and_voice
  value: choices=["Giữ cách gọi trung tính về giới tính ('Mục tiêu', 'kẻ đó') cho
    đối thủ ở thời điểm Tanya chưa nhận ra đó là một cô gái.", "Nhấn mạnh Markdown
    '*ám ảnh*' đúng phạm vi thẻ em của nguồn theo DEC-P01-002."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000294
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ thuật ngữ 'khẩu tiểu liên' (submachine
    gun) và 'lưỡi kiếm ma pháp' (magic blade)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000295
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'Nó' (sau khi tách rõ đại từ chỉ pha lao
    lên ở câu trước); giữ tên 'Serebryakov'."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000296
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ thuật ngữ 'đánh giáp lá cà' (hand-to-hand
    fight) và 'lưỡi kiếm ma pháp' (magic blade)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000297
  kind: terminology_and_voice
  value: choices=["Thoại tự nhủ của Tanya tự xưng 'mình' theo DEC-P01-001."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown câu hỏi nội tâm ''*Là hồi nào nhỉ?*'' đúng
    phạm vi thẻ em của nguồn theo DEC-P01-002.", "Thuật ngữ: ''pháp sư hải quân đánh
    bộ'' (marine mages), ''nhiệm vụ yểm trợ trực tiếp'' (direct support duty), ''Liên
    minh Hiệp ước'' (Entente Alliance), ''đấu lưỡi lê'' (bayonet fight)."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000299
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ phủ định ('chẳng gắn lưỡi lê',
    'chẳng hào hứng gì') và lược đại từ ngôi thứ hai khái quát ('you') một cách tự
    nhiên."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000300
  kind: terminology_and_voice
  value: choices=["Nhấn mạnh Markdown '*Trong trường hợp đó…*' và '*Ngươi tiêu rồi.*'
    đúng hai cụm in nghiêng trong nguồn theo DEC-P01-002.", "Trần thuật gọi Tanya
    là 'nó'; giữ thuật ngữ 'băng đạn rỗng' (empty magazine) và 'tư thế phòng thủ bị
    động' (passive defensive position)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000301
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'báng súng bằng gỗ' (wooden butt of her gun) và 'bài
    tập đâm lê' (bayonet drill)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000302
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'Nó'; giữ lối diễn đạt ẩn dụ mỉa mai về
    cú thúc báng súng vào vùng bụng đối thủ."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000304
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ giả định trái thực tế ('Người
    bình thường thì hẳn đã mất mạng ngay tại chỗ…') và thuật ngữ 'lớp vỏ phòng thủ'
    (defensive shell)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000305
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ chi tiết so sánh âm vực tiếng
    thở dốc cao hơn dự tính."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000306
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; chuyển cách quy chiếu đối thủ sang
    'một cô gái trẻ, còn chưa đến tuổi trưởng thành' / 'cô gái ấy' từ thời điểm Tanya
    nhìn rõ mặt."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000308
  kind: terminology_and_voice
  value: choices=["Nhấn mạnh Markdown '*Lẽ ra cô không nên đến nơi này.*' đúng phạm
    vi thẻ em của nguồn theo DEC-P01-002; dùng đại từ 'cô' cho câu thoại giả định
    hướng tới nữ pháp sư trẻ."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000310
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó', tự quy chiếu phản thân 'chính mình';
    giữ nguyên cấu trúc điều kiện giả định ('nếu có điều khoản ưu tiên nào dành cho
    phụ nữ và trẻ em')."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000311
  kind: terminology_and_voice
  value: choices=["Nhấn mạnh Markdown toàn bộ câu độc thoại nội tâm đầu đoạn đúng
    phạm vi thẻ em của nguồn theo DEC-P01-002; nội tâm tự xưng 'mình' theo DEC-P01-001."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000312
  kind: terminology_and_voice
  value: choices=["Quy chiếu đối thủ bằng 'Người lính địch' và đại từ 'cô ta' (her)
    để phân biệt rõ với Tanya."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=["Phân biệt nhất quán đại từ trong trần thuật: ''cô ta'' / ''cô
    gái kia'' chỉ nữ pháp sư địch, ''nó'' chỉ Tanya."]'
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000314
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ thuật ngữ 'băng đạn mới' (fresh
    magazine) và 'buồng đạn' (chamber)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000315
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'nhược điểm tản mát đạn' (bloom problems) và sắc
    thái phán đoán chắc chắn ('chắc chắn vẫn sẽ trúng đích' cho 'should connect')."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000316
  kind: terminology_and_voice
  value: choices=["Giữ sắc thái lửng lơ nghi vấn trong câu thoại kết liễu của Tanya
    ('“Tạm biệt nhé, chắc vậy nhỉ?”')."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000317
  kind: terminology_and_voice
  value: choices=["Giữ tật nói lắp vì sốc/căm phẫn và dấu gạch ngang ngắt câu ('“M-m-mày
    là—!”')."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000318
  kind: terminology_and_voice
  value: choices=["Phân biệt rõ 'màn chắn bảo hộ' (protective film - bị xuyên thủng)
    và 'lớp vỏ phòng thủ' (defensive shell - cản đạn tiếp theo), đồng thời giữ phân
    biệt đại từ 'nó' (Tanya) và 'cô ta' (pháp sư địch)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000319
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ phủ định 'chưa chí mạng' (not
    fatal)."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000321
  kind: terminology_and_voice
  value: choices=["Nhấn mạnh Markdown toàn bộ ba câu độc thoại nội tâm đúng phạm vi
    thẻ em của nguồn theo DEC-P01-002; nội tâm tự xưng 'Mình'/'mình' và gọi đối thủ
    là 'cô ta'.", 'Giữ nguyên độ mở của hai câu hỏi tự vấn song song về nguyên nhân
    đòn bắn không gây thương tích chí mạng (do đánh giá thấp lớp vỏ phòng thủ hay
    do súng tiểu liên thiếu uy lực).']
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000322
  kind: terminology_and_voice
  value: choices=["Giữ mã gọi '01' và cách xưng hô 'của chỉ huy' trong lời cảnh báo
    của cấp dưới."]
- segment_id: YS-LN04/Text/chapter001_t.xhtml/p000323
  kind: terminology_and_voice
  value: choices=["Trần thuật gọi Tanya là 'nó'; giữ thuật ngữ 'thuật thức bắn tỉa
    quang học' (optical sniping formula) và 'cơ động né tránh' (evasive maneuvers)."]
