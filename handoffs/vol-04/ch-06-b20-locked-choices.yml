choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000653
  kind: terminology_and_voice
  value: choices=["Giữ cấu trúc phủ định so sánh 'chưa bao giờ khá hơn mức một đổi
    năm'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000654
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Lục quân Liên bang'' (Federation Army), ''Lục quân
    Đế quốc'' (Imperial Army), ''tác chiến có tổ chức'' (organized combat), ''những
    trận đánh cơ động'' (mobile battles)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000655
  kind: terminology_and_voice
  value: choices=["Giữ tên riêng 'Loria' và hình ảnh 'ánh mắt thuần khiết của một
    nhà toán học'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000656
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: dùng ''chúng ta'', ''tỷ lệ tiêu hao'' (attrition
    ratios), ''Đế quốc''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000657
  kind: terminology_and_voice
  value: choices=['Giữ thế đối sánh giảm tổn thất của Liên bang và tăng tổn thất của
    đối phương.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000658
  kind: terminology_and_voice
  value: choices=["Giữ sắc thái 'nhếch mép cười khẩy' của Loria."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000659
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: bọc toàn bộ câu độc thoại nội tâm trong dấu
    `*...*` khớp với thẻ `<em>` của nguồn; giữ giọng khinh miệt giới quân nhân.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000660
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: gọi quân Đế quốc là ''chúng'', giữ quan hệ điều
    kiện tăng tầm quan trọng của vùng đất khi liên tiếp chiến thắng."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000661
  kind: terminology_and_voice
  value: choices=["Giữ điển tích 'Pyrrhus' và 'chiến thắng kiểu Pyrrhus', cùng giả
    định quá khứ về việc các tướng lĩnh bị thành công làm mờ mắt và mở rộng chiến
    tuyến."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000662
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Lục quân Đế quốc'', ''lãnh thổ Liên bang'', ''những
    trận chiến giành giật các thành phố''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000663
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: giữ phủ định ''dù có muốn chúng cũng chẳng thể
    nào rút lui được nữa''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000664
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''chiến thuật bao vây'' (encirclement tactics), ''cứ
    điểm cố định'' (fixed position)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000665
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: dùng ''chúng ta'', giữ ý phản kích giành lại
    lãnh thổ đã mất."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000666
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: chỉ bọc từ `*chúng*` ở cuối câu trong dấu
    `*...*` đúng phạm vi thẻ `<em>` của nguồn.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000667
  kind: terminology_and_voice
  value: choices=['Giữ tình thái cân nhắc khả năng cài điệp viên qua nước thứ ba để
    kích động dư luận tại Đế quốc.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000668
  kind: terminology_and_voice
  value: choices=['Giữ phủ định nhấn mạnh hệ quả đối phương không thể rút chân ra
    được.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000669
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Bộ Nội vụ'' (Internal Affairs), ''các đội đốc chiến''
    (blocking units)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000670
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật Loria: dùng ''Ông ta'', giữ các nhóm đối
    tượng ''những kẻ từng có phát ngôn chống Liên bang'', ''đám theo chủ nghĩa dân
    tộc sắc tộc'', ''phần tử phản động''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000671
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000672
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: bọc đúng phần lời mỉa mai trong tâm tưởng
    bằng dấu `*...*`, để cụm trần thuật `, ông ta chỉ muốn buông lời chế giễu như
    vậy.` bên ngoài dấu `*...*` đúng với thẻ `<em>` của nguồn.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000673
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: tự xưng ''Tôi'', gọi chung ''chúng ta'', giữ
    cách nói ''bức tường thường dân bị ép tình nguyện tòng quân'' và ''lũ ô hợp từ
    các trại tập trung''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000674
  kind: terminology_and_voice
  value: 'choices=[''Giữ quan hệ song hành: vừa bảo toàn binh sĩ trung thành với chế
    độ vừa xử lý các phần tử tiềm ẩn nguy cơ.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000675
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: giữ sắc thái mỹ từ tuyên truyền ''toàn thể nhân
    dân Liên bang sẽ anh dũng kháng cự quân xâm lược''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000676
  kind: terminology_and_voice
  value: 'choices=["Giữ cấu trúc đối lập phủ định ''không phải... mà là...'': không
    phải cuộc thanh trừng mà là hy sinh vì Tổ quốc; kẻ thực hiện không phải người
    của chế độ mà là Lục quân Đế quốc."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000677
  kind: terminology_and_voice
  value: choices=["Giữ tên 'Loria' và nét tự đắc trước sự sắc sảo của bản thân."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000678
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: bọc toàn bộ câu độc thoại nội tâm trong dấu
    `*...*` khớp với thẻ `<em>` của nguồn.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000679
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: ''Đồng chí Tổng Bí thư'', ''du kích'' (partisans),
    câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000680
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tổng Bí thư: giọng điềm tĩnh tán thành đề xuất.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000681
  kind: terminology_and_voice
  value: choices=['Giữ phủ định về việc không ai chất vấn giá trị đạo đức hay chuyện
    đúng sai.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000682
  kind: terminology_and_voice
  value: choices=['Giữ quan hệ hệ quả ý tưởng được thông qua dễ dàng.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000683
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: ''Xin cảm ơn đồng chí.'' nhất quán với b19."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000684
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tổng Bí thư với Loria: xưng ''tôi'', gọi ''đồng chí''
    / ''Đồng chí Loria'', nhấn mạnh lời răn đe ''thất bại là điều không thể chấp nhận
    được''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000685
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp của Loria: lễ phép (''Tất nhiên rồi ạ. Xin đồng chí
    cứ giao mọi việc cho tôi.'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000686
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc cụm `*Thất bại là điều không thể chấp
    nhận được*` trong dấu `*...*` đúng phạm vi thẻ `<em>` của nguồn; đại từ trần thuật
    chỉ Loria dùng ''ông ta''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000687
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000688
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: ''Thưa Đồng chí Tổng Bí thư'', tự xưng ''tôi''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000689
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tổng Bí thư: xưng ''tôi'', gọi Loria là ''đồng chí''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000690
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: giữ địa danh ''Moskva'', tự xưng ''Tôi'', gọi
    kẻ ném bom trên bình diện tội phạm chiến tranh là ''ả''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000691
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: bọc toàn bộ trong dấu `*...*`
    khớp thẻ `<em>`; Loria tự xưng ''Mình'', gọi Tanya là ''nàng tiên đó'' và ''con
    bé''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000692
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: bọc toàn bộ trong dấu `*...*`
    khớp thẻ `<em>`; Loria tự xưng ''mình''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000693
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: bọc toàn bộ trong dấu `*...*`
    khớp thẻ `<em>`; Loria tự xưng ''Mình'', gọi Tanya là ''con bé''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000694
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tổng Bí thư: dùng ''Chúng ta'', ''Tôi'', ''đồng chí'',
    ''Đồng chí Loria'', giữ điệp ngữ nhấn mạnh sự thận trọng."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000695
  kind: terminology_and_voice
  value: choices=["Giữ thành ngữ tương đương 'vuốt râu hùm' (stepping on the tiger's
    tail) và chi tiết bàn tay cầm bút run lên vì thịnh nộ lẫn nhục nhã."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000696
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: ''Thưa Đồng chí Tổng Bí thư'', tự xưng ''tôi'',
    gọi Tanya là ''con bé đó''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000697
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'Ông ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000698
  kind: terminology_and_voice
  value: choices=['Giữ nhịp ngắt câu ngắn và nhận định tự biện hộ của Loria.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000699
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tổng Bí thư: ''Đồng chí Loria'', gọi Tanya là ''con
    bé'', gọi Loria là ''đồng chí''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000700
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Loria: giữ sự ngập ngừng đính chính sau khi buột miệng
    xác nhận.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000701
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000702
  kind: terminology_and_voice
  value: choices=["Giữ câu chiêm nghiệm khái quát dùng chủ ngữ chung 'người ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000703
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại ngắn gọn của Tổng Bí thư: ''Sao cơ?''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000704
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: tự xưng ''tôi'' / ''mình'', gọi Tanya là ''Con
    bé'', giữ cấu trúc nhấn mạnh điệp cụm từ giữa hai dấu gạch ngang dài."]'
