segment_id_end: YS-LN04/Text/chapter001_r.xhtml/p000204
choices:
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Thoại sĩ quan trong cuộc họp: dùng đại từ ''chúng ta'', ''các
    chỉ huy ngoài thực địa'', ''Bộ Tổng tham mưu'', giữ câu hỏi tu từ."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Thoại sĩ quan: dịch chủ thể giả định khái quát là ''người ta'',
    giữ quân hàm ''Thiếu tá von Degurechaff'' và cụm ''ra đòn phủ đầu quyết liệt''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Lời sĩ quan cấp cao điều phối cuộc họp: đại từ ''chúng ta'', giữ
    đối lập ''vấn đề nguyên tắc pháp lý chứ không phải chiến tranh''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000182
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó', mệnh đề phản ánh góc nhìn tự quy
    chiếu ở cuối câu dùng 'mình' ('đá mình sang vùng đen'), giữ ẩn dụ 'vùng xám' và
    'vùng đen'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Sĩ quan cấp cao nói với Tanya: xưng ''tôi'' - gọi ''Thiếu tá von
    Degurechaff'' / ''cô'' và ''chúng ta'' cho tập thể; khóa cụm ''trận không chiến
    tiêu diệt hoàn toàn một cách lặng lẽ''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Tanya đáp lời cấp trên và hội nghị: xưng ''tôi'', gọi tập thể
    là ''các vị'', dùng ''chúng ta''; giữ ''kỹ năng tác chiến và trận không chiến
    tiêu diệt hoàn toàn''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000185
  kind: terminology_and_voice
  value: choices=["Giữ nhấn mạnh Markdown '*Đành chịu vậy chứ biết làm sao được.*'
    theo đúng thẻ in nghiêng của nguồn (DEC-P01-002); trần thuật về Tanya dùng 'nó'
    (DEC-P01-001)."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian - địa điểm viết hoa toàn bộ: ''NGÀY 29 THÁNG
    4, NĂM THỐNG NHẤT 1926, PHÒNG CỦA TANYA VON DEGURECHAFF''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000187
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó', tự quy chiếu sở hữu dùng 'mình'
    ('phòng mình')."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Độc thoại của Tanya trong phòng riêng: tự xưng ''mình'', gọi cấp
    trên/bộ chỉ huy là ''họ'', giữ tương quan ''Rủi ro so với lợi ích thu lại''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000189
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' kết hợp đại từ phản thân 'mình',
    khóa cụm 'đội quân tình nguyện tự xưng mà Khối Thịnh vượng chung đang phái tới'
    bám sát nguyên văn."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Độc thoại của Tanya: dùng ''mình'' và ''chúng ta'', khóa thuật
    ngữ ''trận tao ngộ chiến''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm gián tiếp tự do: giữ tên riêng ''Hợp chúng quốc'',
    phủ định dứt khoát '': không.'', và đại từ ''chúng ta''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000192
  kind: terminology_and_voice
  value: choices=["Độc thoại của Tanya dùng 'chúng ta' và 'mình'; câu trần thuật bên
    ngoài thoại dùng 'Nó'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000193
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó' và 'mình' phản thân; giữ 'vị sĩ quan
    cấp cao' và 'Hợp chúng quốc'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000194
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó', cấp bậc 'thiếu tá', cơ quan 'Bộ
    Tổng tham mưu trung ương', ẩn dụ 'bánh răng tiện dụng trong guồng máy'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000195
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'nó', giữ ẩn dụ 'kẻ làm công, một linh
    kiện có thể thay thế bất cứ lúc nào'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000196
  kind: terminology_and_voice
  value: choices=["Trần thuật dùng 'nó'; khóa các thuật ngữ 'Đế quốc', 'Liên bang',
    'mặt trận phía đông', 'đòn cơ động bao vây', 'nghệ thuật quân sự', 'tác chiến
    trên tuyến trong', 'Quân đội Đế quốc'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000197
  kind: terminology_and_voice
  value: choices=["Khóa 'các phòng tuyến phía nam' và 'tàn quân Cộng hòa'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000198
  kind: terminology_and_voice
  value: choices=["Khóa 'Khối Thịnh vượng chung', 'trận không chiến tiêu diệt hoàn
    toàn', 'đổ bộ', và 'các điều khoản hòa bình'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000199
  kind: terminology_and_voice
  value: choices=["Giữ sắc thái nhượng bộ - giả định 'Nếu nghĩ theo hướng lạc quan
    một chút' và phủ định 'chưa đến mức phải tuyệt vọng và bỏ cuộc'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Độc thoại của Tanya: tự xưng ''Mình'', giữ cụm ''suy nghĩ viển
    vông''."]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Câu chuyển đoạn ngắn: ''Chỉ có duy nhất một vấn đề.''"]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000202
  kind: terminology_and_voice
  value: choices=["Khóa 'Quốc lực của Đế quốc', 'điểm cực hạn', 'tổng động viên',
    'Quân đội Đế quốc' và hình ảnh so sánh 'con ếch đang cố phình to bụng'."]
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Độc thoại của Tanya đánh giá chiến cục: giữ quan hệ điều kiện
    ''Chừng nào... vẫn không thể dốc toàn lực sang phía đông.''"]'
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000204
  kind: terminology_and_voice
  value: choices=["Trần thuật về Tanya dùng 'Nó', khóa 'các trận chiến ở sông Rhine',
    'Cộng hòa', 'quyền làm chủ bầu trời'."]
