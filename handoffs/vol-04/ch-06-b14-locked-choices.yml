  value: 'choices=["Tên đơn vị: ''332nd Infantry Battalion'' -> ''Tiểu đoàn Bộ binh
    số 332''; giữ giọng gắt gỏng dứt khoát (''Tất cả bọn chúng!'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000443
