- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000430
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & đại từ: ''the colonel'' -> ''vị trung tá''; ''her''
    -> ''cô''; ''Weiss'' -> ''Weiss''.", "Thuật ngữ: ''insubordination'' -> ''hành
    vi bất tuân thượng lệnh''; ''execution by firing squad'' -> ''án xử bắn''; ''Imperial
    Army'' -> ''Quân đội Đế quốc''.", "Phủ định & nhân quả: giữ quan hệ tiền đề ''Xét
    tới việc vị trung tá chẳng hề ngần ngại...'' dẫn tới sự kinh ngạc của Weiss."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000431
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba theo điểm nhìn Weiss
    (''anh''), gọi nhóm sĩ quan bộ binh là ''lũ đần độn kia'' / ''bọn họ''.", "Quan
    hệ đối lập: giữ cấu trúc ''bị vạ lây vào giữa làn đạn thế này quả là phiền phức...,
    nhưng anh chỉ muốn...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000432
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*...*'' cho hai câu đầu ''*Tôi không
    hiểu nổi. Giải thích xem có chuyện gì đang xảy ra đi.*'' khớp thẻ em trong XHTML
    (DEC-P01-002).", "Điểm nhìn & xưng hô: thông điệp bằng ánh mắt của Weiss gửi tới
    Serebryakov xưng ''Tôi''; câu sau là trần thuật ngôi thứ ba (''Anh'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000433
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & thuật ngữ: ''infantry commanders'' -> ''Các chỉ
    huy bộ binh''; Serebryakov báo cáo kèm tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000434
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''she/her'' (Serebryakov) -> ''cô''; giữ quan
    hệ nhân quả ''Degurechaff giục nói tiếp, nên cô đành miễn cưỡng kể nốt''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000435
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái: ''She'' -> ''Cô''; giữ sắc thái đối lập nhẹ
    giữa ''dè dặt bắt đầu giải thích'' và ''bằng giọng điệu thuần túy thuật lại sự
    thật''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000436
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấp bậc: ''new infantry battalion commanders'' ->
    ''các tiểu đoàn trưởng bộ binh mới''; ''the colonel'' -> ''vị trung tá''.", "Cấu
    trúc liệt kê: giữ cấu trúc mệnh đề danh từ mở đầu bằng ''Rằng... ra sao'' xuyên
    suốt p000436–p000438."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000437
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & ngữ nghĩa: ''the colonel’s orders'' -> ''mệnh lệnh của
    vị trung tá''; giữ sắc thái mỉa mai ''lễ phép phớt lờ'' và lý do ''viện dẫn sự
    tự tin của những người làm nghề chuyên nghiệp''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000438
  kind: terminology_and_voice
  value: 'choices=["Ngữ nghĩa: giữ cấu trúc ''Rằng họ muốn có quyền tự quyết hành
    động theo ý mình ra sao''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000439
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Degurechaff xưng ''Tôi'', gọi đám sĩ quan
    bộ binh là ''bọn họ'', gọi ''officers in the rear'' là ''Đám sĩ quan ở hậu phương''.",
    "Phủ định & tình thái: giữ phủ định ''Tôi không thể tin nổi'', câu phản vấn phủ
    định ''Có phải cứ vào thời chiến là quy tắc đột nhiên thay đổi đâu!'', câu hỏi
    tu từ và suy đoán khẳng định ''hẳn là điên hết cả rồi''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000440
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Tôi muốn bắn chết bọn chúng.*''
    ở câu đầu khớp thẻ em trong XHTML (DEC-P01-002).", "Điểm nhìn & tình thái: trần
    thuật theo góc quan sát của Weiss; giữ tình thái suy đoán quá khứ ở câu cuối (''Chắc
    hẳn chuyện đó đã suýt làm Serebryakov đứng tim'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000441
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: câu hỏi của Weiss với cấp trên có tiểu từ lễ phép
    ''ạ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000442
