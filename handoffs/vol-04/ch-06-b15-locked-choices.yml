choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000479
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''The higher-ups'' -> ''Cấp trên''; ''High-ranking
    officers'' -> ''Các sĩ quan cao cấp''; giữ tình thái ''xem chừng rất hào hứng''.",
    ''Nhấn mạnh Markdown: không dùng chữ nghiêng (DEC-P01-002).'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000480
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tên đơn vị: ngôi thứ nhất số nhiều ''chúng tôi'' (nhóm
    lính nhảy dù thuộc Sư đoàn Cận vệ số 2); ''Guard Division'' -> ''Sư đoàn Cận vệ''.",
    "Quan hệ nhân quả: giữ quan hệ nguyên nhân – hệ quả ''từng đảm nhận rất nhiều
    nhiệm vụ..., nên chúng tôi đã quen...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000481
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Tanya phát biểu trước đơn vị mới xưng ''Tôi'',
    gọi thuộc cấp là ''các thành viên của tiểu đoàn'' / ''các vị''; giữ dấu chấm lửng
    mở đầu."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000482
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Nhưng cái gì kia?*'' ở câu hỏi
    đầu đoạn khớp thẻ em trong XHTML (DEC-P01-002).", "Chức danh & ngữ nghĩa: ''The
    commander'' -> ''Vị chỉ huy''; giữ chi tiết phải bước lên bục đặt làm riêng mới
    bao quát được căn phòng hoặc nhìn qua hàng đầu tiên."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & sắc thái: giữ cách gọi ''Sinh vật vô cảm, kỳ quặc
    và trông như búp bê ấy'' từ góc nhìn bàng hoàng của người quan sát đối lập với
    ''đám pháp sư khát máu vừa mới trở về từ vùng chiến sự''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: ''She/her'' -> ''Cô/cô''; ''they/them'' ->
    ''họ''; giữ mục đích phủ định ''để không bỏ sót dù chỉ một chi tiết'' và nhận
    định ''có điều gì đó hết sức sai trái ở đây''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & chức danh: ''Colonel! Commander!'' -> ''Thưa Trung tá!
    Thưa Chỉ huy!'' (nhất quán với quân hàm Trung tá của Tanya ở tập 4)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: ''us'' -> ''chúng tôi''; ''they'' -> ''họ'';
    ''her'' -> ''cô''; giữ dấu gạch ngang giải thích mức độ tin tưởng tuyệt đối."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tên đơn vị: giữ nguyên ''Fallschirmjäger''; ''Second
    Guard Division'' -> ''Sư đoàn Cận vệ số 2''; giữ ngoặc kép quanh từ ''tinh nhuệ''
    và dấu chấm lửng cuối đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Địa danh & liên kết câu: ''the Rhine'' -> ''mặt trận Rhine'';
    giữ dấu chấm lửng cuối đoạn nối trực tiếp sang p000489."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & sắc thái: giữ dấu chấm lửng đầu đoạn nối với p000488
    và cách gọi ''đứa nhóc con này'' phản ánh sự sững sờ của người kể."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Tanya xưng ''tôi'' / ''chúng ta'', gọi
    các pháp sư cũ là ''những người anh em'' và lính mới là ''những người bạn mới''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: ''our'' -> ''chúng tôi''; giữ cấu trúc chêm
    bằng dấu gạch ngang và nhận định vượt ngoài khả năng lĩnh hội."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=[''Giọng thoại: lời chào mừng tân binh của Tanya tới nơi tuyến đầu.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: ''Her'' -> ''cô''; ''drill sergeant'' -> ''trung
    sĩ huấn luyện''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn bộ câu hỏi ''*Chẳng
    lẽ… Chẳng lẽ một đứa trẻ lại thực sự có thể nở một nụ cười như thế sao?*'' khớp
    thẻ em trong XHTML (DEC-P01-002); giữ phép điệp và dấu chấm lửng."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tự sửa lời: giữ nhịp tự sửa đại từ sở hữu ''của tôi—của
    chúng ta'' và cặp đại từ ''Chúng tôi'' – ''các vị''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Giả định & đối lập: giữ giả định trái thực tế ''lẽ ra sẽ tự nhiên
    hơn nhiều nếu ôm một con búp bê'' đối lập với hành động thực tế của ''sinh vật
    mang hình người kỳ quặc này''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu ngắn phủ định tuyệt đối ''Không một ai.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*thứ*'' trong cụm ''*thứ* này''
    khớp thẻ em trong XHTML (DEC-P01-002).", "Phủ định & thuật ngữ: giữ phủ định ''Không
    một sĩ quan cao cấp nào... có thể lên tiếng phản đối''; ''veteran mages'' -> ''Các
    pháp sư kỳ cựu''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Phủ định & chức danh: giữ cấu trúc rào đón phủ định ''Cũng chẳng
    phải chúng tôi nên thắc mắc tại sao...''; ''battalion commander'' -> ''tiểu đoàn
    trưởng''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Tình thái quá khứ: giữ điệp cấu trúc tình thái nuối tiếc ở quá
    khứ ''Lẽ ra chúng tôi phải... Lẽ ra chúng tôi phải...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Tanya xưng ''Tôi'', gọi đơn vị là ''các vị''; giữ lượng
    từ giới hạn ''chỉ... hai điều mà thôi''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: ngôi thứ nhất số nhiều ''chúng tôi''; giữ
    tình thái mang máng ''Nghe gần như thể... đã từng bắt gặp câu này ở đâu đó''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh & phủ định: giữ câu mệnh lệnh phủ định ngắn gọn ''Đừng
    ngáng đường tiểu đoàn của tôi. Hãy bám theo cho kịp. Chỉ có vậy thôi.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & tình thái: ''the colonel'' -> ''vị trung tá''; ''she''
    -> ''cô''; ''we'' -> ''chúng tôi''; giữ tình thái rào đón suy đoán ''Hoặc chí
    ít, chúng tôi đoán hẳn đó là...''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Trích dẫn: giữ câu châm ngôn trong ngoặc kép ''“Về bản chất, nụ
    cười là một hành vi thù địch”''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Phủ định & khẳng định: giữ cụm khẳng định chắc chắn ''Không còn
    nghi ngờ gì nữa'' và ''không thể nhầm lẫn vào đâu được''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & thuật ngữ: ''UNIFIED YEAR 1926'' -> ''NĂM THỐNG
    NHẤT 1926''; ''GENERAL STAFF OFFICE'' -> ''BỘ TỔNG THAM MƯU''; ''SERVICE CORPS
    DEPUTY DIRECTOR’S OFFICE'' -> ''VĂN PHÒNG PHÓ CỤC TRƯỞNG CỤC QUÂN VỤ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & đại từ: ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; trần thuật gọi Zettour là ''ông''; ''front lines'' -> ''tiền
    tuyến''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: ''he/his'' (Zettour) -> ''ông/mình''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & cơ quan: ''Colonel von Lergen'' -> ''Trung tá von Lergen''
    (nhất quán với pending-terms-index.yml và ch-06-b14); ''Service Corps'' -> ''Cục
    Quân vụ''; ''Operations'' -> ''Cục Tác chiến''; ''General Staff'' -> ''Bộ Tổng
    tham mưu''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & làm rõ chủ thể: làm rõ chủ từ vế đầu là ''Lergen''
    để tránh nhầm với ''Zettour'' ở vế chính; giữ câu hỏi ngắn ''“Có chuyện gì thế?”''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ & xưng hô: ''General von Zettour'' -> ''Thưa
    Tướng von Zettour''; ''Colonel von Degurechaff'' -> ''Trung tá von Degurechaff'';
    giữ nguyên ''Kampfgruppe''; Lergen gọi Zettour là ''Ngài'' kèm ''ạ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập & nhân quả: giữ quan hệ nhượng bộ ''Trong cuộc
    điều tra, ông từng đứng ra bảo vệ..., nhưng suy cho cùng ông vẫn cho rằng cô ắt
    sẽ đẩy họ vào chỗ diệt vong; vì vậy, ông không tin tưởng cô''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''General Staff'' -> ''Bộ Tổng tham mưu'';
    giữ so sánh ''ngay cả Zettour—người vốn trọng dụng cô đến thế—ban đầu cũng từng
    mang cùng nỗi lo giống như Lergen''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ & quyết tâm: giữ ẩn dụ ''nuốt trôi bất kỳ viên thuốc nào,
    dù nó có đắng tới đâu đi chăng nữa''; khuyến nghị làm rõ đại từ quy chiếu về Zettour
    ở đầu đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giả định nhượng bộ: giữ phủ định ''Họ không thể kén
    chọn phương thức được'' và mệnh đề nhượng bộ ''cho dù tác dụng phụ có đau đớn
    tột cùng, họ vẫn có thể tha hồ hối hận sau khi đã thắng cuộc chiến này''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & cơ quan: Zettour xưng ''tôi'', gọi Lergen là
    ''anh'' và ''Trung tá von Lergen''; ''Operations'' -> ''Cục Tác chiến''; ''Service
    Corps'' -> ''Cục Quân vụ''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, đơn vị & thuật ngữ: ''General'' -> ''Thưa Tướng quân'';
    ''Colonel von Degurechaff'' -> ''Trung tá von Degurechaff''; ''Second Guard Division''
    -> ''Sư đoàn Cận vệ số 2''; ''investigative research'' -> ''nghiên cứu khảo sát'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''.", "Xưng hô: Lergen xưng ''tôi'' kèm
    ''ạ'' với Zettour, gọi Degurechaff là ''cô ta'' phù hợp với thái độ phẫn nộ."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tình thái ''Xem chừng''; giữ nguyên
    ''Kampfgruppe''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ bọc ''*Chà, xem ra anh ta vẫn
    xuất sắc như mọi khi*'' khớp thẻ em trong XHTML (DEC-P01-002); Zettour nghĩ về
    Lergen là ''anh ta''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & dấu câu: ''Colonel von Degurechaff'' -> ''Trung tá von
    Degurechaff''; giữ dấu nháy đơn quanh từ ''‘thỏa đáng’'' để đồng bộ với từ được
    nhắc lại ở p000522."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''In the army'' -> ''Trong lục quân''; giữ
    từ ''“thỏa đáng”'' trong ngoặc kép đồng bộ với p000521."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nhượng bộ & phủ định: ''he'' -> ''ông'' (Zettour), ''she/her''
    -> ''cô'' (Degurechaff), ''they'' -> ''họ''; giữ quan hệ nhượng bộ ''Dù ông từng
    nói là trao cho cô quyền tự quyết “nhất định”, nhưng...'' và phủ định ''may chán
    vì cô chưa trưng dụng luôn cả vũ khí''."]'
