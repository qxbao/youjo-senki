segment_id_end: YS-LN04/Text/chapter001_v.xhtml/p000652
choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000620
  kind: terminology_and_voice
  value: 'choices=["Xưng hô của Loria với Tổng Bí thư: ''Thưa Đồng chí Tổng Bí thư'',
    tự xưng ''tôi'', gọi chung phe Liên bang là ''chúng ta'', gọi quân Đế quốc là
    ''quân địch / chúng''.", ''Giữ ẩn dụ không để địch rút chân ra sau khi đã nhử
    vào sâu.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000621
  kind: terminology_and_voice
  value: 'choices=["Lời hỏi lại của Tổng Bí thư: gọi Loria là ''đồng chí''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000622
  kind: terminology_and_voice
  value: choices=["Giữ ẩn dụ mồi câu ('móc mồi vào lưỡi câu rồi để chúng cắn câu')
    và đề xuất giả định nhượng lại khu vực gần biên giới."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000623
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Liên bang'' (Federation), ''cơ sở hạ tầng'' (infrastructure),
    ''đạo quân đang tiến công'' (advancing army)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000624
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Đế quốc'' (Empire), ''trận chiến tiêu hao'' (attritional
    battle), ''phòng ngự có chiều sâu'' (defend in depth)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000625
  kind: terminology_and_voice
  value: choices=['Giữ đúng phép so sánh tỷ lệ 10 người mạnh (mỗi người địch 10 người),
    100 đấu 10 so với 100 chọi 1.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000626
  kind: terminology_and_voice
  value: 'choices=[''Giữ cấu trúc phủ định kép khẳng định tuyệt đối: không có kẻ địch
    nào không thể bị nghiền nát và giết chết bằng quân số dù mạnh đến đâu.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000627
  kind: terminology_and_voice
  value: choices=['Giữ logic dụ lực lượng địch bị dàn mỏng vào trận chiến tiêu hao
    vô nghĩa tại một thành phố có hiệu ứng chính trị lớn khiến địch chiếm rồi không
    thể bỏ.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000628
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & thuật ngữ: ''Josefgrad'', ''Lục quân Liên bang'' (Federation
    Army), ''trận chiến tiêu hao trong đô thị'' (urban battle of attrition), ''tử
    thủ'' (guard ... with their lives)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000629
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Lục quân Đế quốc'' (Imperial Army).", "Nhấn mạnh
    Markdown: giữ nguyên `*Đặc biệt là nếu bộ máy tuyên truyền của chúng ta cứ liên
    tục rêu rao rằng chúng ta sẽ giành lại nơi đó.*` khớp với thẻ `<em>` trong nguồn;
    đại từ nội tâm phe mình dùng ''chúng ta''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000630
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''đội quân cơ động'' (mobile army), ''trận dã chiến''
    (field battle), ''cuộc chiến tiêu hao'' (battle of attrition), ''ưu thế quân số''
    (numerical advantage)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000631
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Lục quân Liên bang'' (Federation Army), ''chiều sâu
    chiến lược'' (strategic depth)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000632
  kind: terminology_and_voice
  value: choices=["Giữ thế đối lập 'không gian' (space) của Lục quân Đế quốc và 'thời
    gian để tái tổ chức' (time to reorganize) của Lục quân Liên bang."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000633
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại phản đối: ''Đồng chí Loria'', gọi ngôi thứ
    hai là ''Đồng chí''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000634
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chức danh: ''Đồng chí'', ''chúng ta'', ''vị tư lệnh
    vĩ đại của chúng ta, Đồng chí Tổng Bí thư''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000635
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật bám sát Loria: đại từ ngôi thứ ba chỉ Loria
    là ''ông ta'', giữ giọng điệu khinh miệt (''lũ ngu đần'', ''đám đần độn'', ''nhắm
    mắt phục tùng'')."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000636
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: quát đám phản đối ''Câm miệng'', quay sang lễ
    phép với Tổng Bí thư ''Thưa Đồng chí Tổng Bí thư, xin phép cho tôi được tiếp tục?''.",
    "Nhấn mạnh Markdown & nội tâm: giữ `*Mình sẽ đưa bọn đó lên đầu danh sách những
    kẻ cần tống vào*` trong dấu `*...*` và để `lageri` ngoài dấu `*...*` đúng phạm
    vi thẻ `<em>` của nguồn; đại từ nội tâm tự quy chiếu của Loria dùng ''mình'',
    trần thuật dùng ''ông ta''; giữ ''Đồng chí Josef''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000637
  kind: terminology_and_voice
  value: 'choices=["Làm rõ chủ thể hai đại từ ngôi thứ ba: ''ông ta'' (Loria) và ''vị
    lãnh tụ'' (Josef) để tránh mơ hồ đại từ."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000638
  kind: terminology_and_voice
  value: 'choices=["Thoại của Josef với Loria: gọi thẳng tên ''Loria'', giọng bề trên
    ngắn gọn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000639
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: giữ `*Mà những kẻ độc tài lại thường rất
    nhạy cảm với những chuyện kiểu đó.*` khớp với thẻ `<em>` câu đầu trong nguồn.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000640
  kind: terminology_and_voice
  value: choices=["Giữ cách gọi 'nhân vật nắm quyền lực cao nhất có mặt tại đó' và
    tên 'Loria'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000641
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: ''Xin cảm ơn đồng chí''; trần thuật dùng ''Loria''
    và ''ông ta''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000642
  kind: terminology_and_voice
  value: 'choices=["Địa danh & sự kiện: ''Trouncenberg'', ''quân Liên bang'' (Federation
    forces), ''cuộc tấn công quy mô lớn'' (major offensive)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000643
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng điệu: ''Lục quân Đế quốc'' (Imperial Army),
    ''lũ đầu đất'' (numbskulls)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000644
  kind: terminology_and_voice
  value: choices=['Không dùng `*...*` cho câu nhận định đầu đoạn vì nguồn không có
    thẻ `<em>`.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000645
  kind: terminology_and_voice
  value: choices=['Giữ phủ định về việc giới quân nhân không hiểu bản chất của việc
    xâm lược lãnh thổ đối phương.']
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000646
  kind: terminology_and_voice
  value: 'choices=["Thoại thuyết trình của Loria: dùng ''chúng ta'', ''Lục quân Đế
    quốc'', ''cuộc chiến tiêu hao'', ''tác chiến đô thị'', ''cứ điểm trọng yếu về
    mặt chiến lược''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000647
  kind: terminology_and_voice
  value: 'choices=[''Giữ quan hệ nhượng bộ – đối lập: cân nhắc nhà máy và mạng lưới
    giao thông vận tải, nhưng sự hỗn loạn của trận đánh đô thị là tối ưu cho Liên
    bang lúc này.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000648
  kind: terminology_and_voice
  value: choices=["Giữ mức độ tình thái 'quy mô khá lớn' (fairly large scale)."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000649
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Lục quân Liên bang'' thua kém ''Lục quân Đế quốc''
    về mặt chất lượng (qualitatively inferior)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000650
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: tự xưng ''tôi'', gọi chung ''chúng ta'', giữ
    ẩn dụ ''võ đài sở trường của đối phương'' (the ring our opponents feel at home
    in) và ''không gian chật hẹp của tác chiến đô thị'' (tight quarters of urban combat)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000651
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''tân binh vừa mới nhập ngũ'' (freshly conscripted
    troops), ''chiến đấu ra hồn ở mức tàm tạm'' (fight halfway decently), giữ câu
    tự nhìn nhận Loria không còn ý tưởng nào khác để tiến hành cuộc chiến thực sự
    với Đế quốc."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000652
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''sĩ quan chính trị'' (political officers), báo cáo
    tổn thất của cả phía Đế quốc lẫn Liên bang."]'
