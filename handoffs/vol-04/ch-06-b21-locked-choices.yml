choices:
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000705
  kind: terminology_and_voice
  value: choices=["Giữ tên riêng 'Loria' và nhịp câu ngắn nhấn mạnh sự khẩn cầu."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000706
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'; giữ hai câu hỏi tu từ
    nối tiếp và cách dịch 'Chúa' (God)."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000707
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'Ông ta'; giữ thái độ bất chấp
    lời giễu cợt của người đời."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000708
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tổng Bí thư với Loria: xưng ''tôi'', gọi ''đồng chí'',
    giữ sắc thái nhượng bộ cho phép."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000709
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria với Tổng Bí thư: xưng ''tôi'', gọi ''đồng chí'',
    giữ lời cam đoan chắc chắn ở cuối đoạn."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000710
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'; giữ chi tiết 'tổng hành
    dinh đang trong quá trình tái thiết'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000711
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại của Loria: tự xưng ''mình'', nhắc tới ''Đồng chí
    Tổng Bí thư'' và gọi Tanya là ''con bé''; giữ nhịp lặp từ sau dấu gạch ngang dài."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000712
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'; giữ diễn biến tâm lý
    lâng lâng quên cả tuổi tác."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000713
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'Ông ta', tự quy chiếu 'mình'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000714
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại của Loria: tự xưng ''mình'' / ''chúng ta'', thuật
    ngữ ''Lục quân Đế quốc'' (Imperial Army) và ''Kampfgruppe Salamander'' (Salamander
    Kampfgruppe), gọi đối phương là ''chúng''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000715
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'; giữ cấu trúc phủ định
    kép 'không có nghĩa là ông ta không mong ngóng niềm vui ở đoạn kết'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000716
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: dùng ''chúng ta'', giữ câu tự hỏi về sĩ khí của
    quân đội."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000717
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'; giữ quan niệm làm hết
    sức người trước khi chờ số mệnh để không hối tiếc."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000718
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của sĩ quan cấp dưới với Loria: tự xưng ''Chúng
    tôi'', giọng lễ phép (''ạ''), giữ thông tin tình trạng đào ngũ gia tăng."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000719
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ thị của Loria: dùng ''chúng ta'', thuật ngữ ''đội đốc
    chiến'' (blocking units) và ''Bộ Nội vụ'' (Internal Affairs)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000720
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000721
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'; giữ mức độ cực đoan
    sẵn sàng đối địch với cả thế giới vì lý tưởng."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000722
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp nhận lệnh ngắn gọn của cấp dưới: ''Rõ.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000723
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: thuật ngữ ''các trại tập trung'' (concentration
    camps)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000724
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'ông ta'."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000725
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'Ông ta'; giữ cấu trúc điều kiện
    phủ định về việc con người không thể sống đúng nghĩa là người nếu thiếu hy vọng
    và ước mơ."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000726
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng của cấp dưới: ''Nhưng chuyện đó…''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000727
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria: dùng ''chúng ta'', thuật ngữ ''Lục quân Đế quốc'',
    giữ sự tương phản giữa giam giữ mười năm và đãi ngộ tốt một tháng rồi tung ra
    chiến trường."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000728
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: chỉ bọc câu độc thoại nội tâm `*Có chừng
    ấy thôi mà cậu cũng không hiểu sao?*` trong dấu `*...*` đúng phạm vi thẻ `<em>`
    của nguồn; phần trần thuật về Loria để ngoài dấu `*...*`.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000729
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'Ông ta' / 'chính ông ta'; giữ
    hình ảnh ẩn dụ nhà truyền giáo rao giảng hy vọng và ước mơ."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000730
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria với cấp dưới: gọi ''cậu'', giữ mệnh lệnh tận dụng
    hiệu quả cả tù nhân."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000731
  kind: terminology_and_voice
  value: 'choices=["Thoại của cấp dưới: giữ nét lắp bắp đầu câu (''X-xin thứ lỗi cho
    tôi'') và tự xưng ''Tôi''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000732
  kind: terminology_and_voice
  value: 'choices=["Thoại răn đe của Loria với cấp dưới: gọi ''cậu'', giữ hai vế điều
    kiện trừng phạt lính canh trại và xử lý chính người phụ trách nếu chậm trễ."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000733
  kind: terminology_and_voice
  value: choices=["Đại từ trần thuật chỉ Loria dùng 'Ông ta'; giữ giả định về giấc
    mơ được sống sót của tù nhân."]
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000734
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp của cấp dưới với Loria: ''Rõ, thưa đồng chí.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000735
  kind: terminology_and_voice
  value: 'choices=["Thoại của Loria với cấp dưới: gọi ''cậu'', giữ giọng nhắc nhở
    dứt khoát."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000736
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown: chỉ bọc phần lời cầu nguyện thầm gửi tới
    binh sĩ trong dấu `*...*` đúng phạm vi thẻ `<em>` của nguồn; cụm trần thuật phía
    sau để ngoài dấu `*...*`.'']'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000737
  kind: terminology_and_voice
  value: 'choices=["Thoại cho lui của Loria: ''Được rồi. Đi đi.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000738
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ câu độc thoại nội tâm trong dấu
    `*...*` khớp với thẻ `<em>` của nguồn; giữ cách gọi Tanya là ''nàng tiên đó''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000739
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian - địa điểm: ''NGÀY 18 THÁNG 7, NĂM THỐNG NHẤT
    1926, CHIẾN TUYẾN PHÍA ĐÔNG''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000740
  kind: terminology_and_voice
  value: 'choices=["Giọng mở đầu kiểu dẫn chương trình của Tanya: ''Xin chào mọi người.''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000741
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn dẫn chuyện của Tanya hướng tới người nghe giả định:
    gọi ''Các bạn'' / ''các bạn'', giữ hai câu hỏi gợi mở liên tiếp."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000742
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn dẫn chuyện của Tanya: tự xưng ''Tôi'', gộp chung ''chúng
    ta'' / ''mình'', giữ sự đối lập giữa đô thị cơ giới hóa rập khuôn và thiên nhiên
    bên ngoài."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000743
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn dẫn chuyện của Tanya: dùng ''chúng ta'' và ''các bạn'',
    giữ tình thái giả định ''có thể khiến các bạn nghĩ rằng''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000744
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn dẫn chuyện của Tanya: dùng ''chúng ta'', giữ câu hỏi
    rủ rê ''sao không học hỏi các bậc tiền nhân và ra ngoài tản bộ một chuyến nhỉ?''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000745
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn dẫn chuyện của Tanya: tự xưng ''tôi'', giữ giọng tự
    trào lịch sự."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000746
  kind: terminology_and_voice
  value: 'choices=["Tự giới thiệu chức danh và cấp bậc: tự xưng ''Tôi'', ''sĩ quan
    chỉ huy Kampfgruppe Salamander trực thuộc Bộ Tổng tham mưu, Trung tá Tanya von
    Degurechaff''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000747
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn Tanya: tự xưng ''tôi'', giữ cách nói châm biếm ''dã
    ngoại có vũ trang'' (armed hiking)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000748
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn Tanya: tự xưng ''tôi'', giữ chi tiết di chuyển bằng
    mô tô hoặc xe bọc thép băng qua mặt đất lầy lội."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000749
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn Tanya: dùng ''chúng tôi'', thuật ngữ ''Cụm phương Bắc
    thuộc Cụm tập đoàn quân phía Đông của Đế quốc'', ''Kampfgruppe Salamander'', ''nhiệm
    vụ tuần tra cảnh giới sườn''."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000750
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn Tanya: tự xưng ''tôi'', giữ địa danh ''Trouncenberg'',
    thuật ngữ ''Bộ Tổng tham mưu'', phủ định về khả năng quân địch xuất hiện lại ngay."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000751
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn Tanya: tự xưng ''Tôi'', gộp đơn vị là ''chúng ta'',
    giữ hình ảnh ví von ''trò bấm chuông cửa rồi bỏ chạy'' (Ding-Dong Ditch)."]'
- segment_id: YS-LN04/Text/chapter001_v.xhtml/p000752
  kind: terminology_and_voice
  value: 'choices=["Dòng kết tập trong ngoặc đơn: giữ nguyên phụ đề Latinh ''Dabit
    Deus His Quoque Finem'' và nhãn kết thúc ''Hết''."]'
