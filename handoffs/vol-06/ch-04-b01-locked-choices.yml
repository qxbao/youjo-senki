choices:
- segment_id: YS-LN06/Text/part0019.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian - địa điểm: giữ định dạng in hoa toàn bộ ''ĐẦU
    THÁNG 2, NĂM THỐNG NHẤT 1927, MIỀN BẮC ILDOA''."]'
- segment_id: YS-LN06/Text/part0019.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & thuật ngữ: ''Kingdom of Ildoa'' -> ''Vương quốc Ildoa'';
    ''Colonel von Lergen'' -> ''Đại tá von Lergen''; ''General Staff'' -> ''Bộ Tổng
    tham mưu''."]'
- segment_id: YS-LN06/Text/part0019.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Ildoan Army'' -> ''Quân đội Ildoa''; giữ đúng nội
    dung nhiệm vụ thứ nhất là đánh giá mức độ huấn luyện."]'
- segment_id: YS-LN06/Text/part0019.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: quy chiếu phía Ildoa bằng ''họ'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''; ''staff officer'' -> ''sĩ quan tham
    mưu''; giữ phủ định nhấn mạnh ''thậm chí chẳng cần phải bàn tới''."]'
- segment_id: YS-LN06/Text/part0019.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ & đại từ: ''military geography'' -> ''địa lý
    quân sự''; ''mountain battles'' -> ''các trận đánh miền núi''; ''Lieutenant General
    von Rudersdorf'' -> ''Trung tướng von Rudersdorf''; ''Operations'' -> ''Cục Tác
    chiến''; quy chiếu Lergen trong trần thuật bằng ''anh''; giữ mức độ suy đoán của
    Lergen (''Theo như Lergen có thể phỏng đoán…'')."]'
- segment_id: YS-LN06/Text/part0019.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: giữ phủ định ''không mặc nhiên
    đẩy họ bước lên con đường chiến tranh''; ''potential plan'' -> ''phương án dự
    phòng''; ''the commander'' -> ''vị chỉ huy''; giữ tình thái dè dặt ''xem chừng
    đây có thể là một dấu hiệu quan trọng''."]'
- segment_id: YS-LN06/Text/part0019.html/p000007
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa & so sánh: giữ nhận định so sánh nhiệm vụ cuối cùng là
    mệnh lệnh vô cùng khác thường so với hai nhiệm vụ đầu.'']'
- segment_id: YS-LN06/Text/part0019.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, thuật ngữ & đại từ: quy chiếu Lergen bằng ''anh''; ''Lieutenant
    General von Zettour'' -> ''Trung tướng von Zettour''; ''Service Corps'' -> ''Cục
    Quân vụ''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''General Gassman'' -> ''Tướng
    Gassman''."]'
- segment_id: YS-LN06/Text/part0019.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Đại từ phản thân, phủ định & cấp bậc: dùng ''mình'' cho phản thân
    của Lergen; giữ câu phủ định ''Đó không phải là kiểu nhiệm vụ mà một đại tá thường
    được yêu cầu thực hiện.''."]'
- segment_id: YS-LN06/Text/part0019.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ cấp bậc: ''lower-ranking officer'' -> ''sĩ quan cấp
    dưới''."]'
- segment_id: YS-LN06/Text/part0019.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Phủ định, cấp bậc & thuật ngữ: giữ phủ định ''chẳng có kinh nghiệm
    gián điệp''; ''colonel in the Imperial Army General Staff'' -> ''đại tá trong
    Bộ Tổng tham mưu Lục quân Đế quốc''; quy chiếu Lergen bằng ''anh''; ''operations
    man'' -> ''sĩ quan tác chiến''; ''the rear'' -> ''hậu phương''."]'
- segment_id: YS-LN06/Text/part0019.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Phủ định, đại từ & thuật ngữ: quy chiếu Lergen bằng ''anh'' /
    ''mình''; giữ phủ định ''cũng không tự tin rằng mình sẽ thành công''; ''Intelligence
    agent'' -> ''điệp viên Tình báo''."]'
- segment_id: YS-LN06/Text/part0019.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, phủ định kép & câu hỏi nội tâm: quy chiếu Lergen
    bằng ''anh'' / ''mình'', quy chiếu Zettour bằng ''ông ấy''; ''Personnel'' -> ''bên
    Nhân sự'' / ''công tác Nhân sự''; ''the Empire'' -> ''Đế quốc''; ''senior officers''
    -> ''các sĩ quan cấp cao''; giữ phủ định kép ''không thể phủ nhận'' và câu hỏi
    nội tâm ở cuối đoạn."]'
- segment_id: YS-LN06/Text/part0019.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Điều kiện giả định & thuật ngữ: giữ mệnh đề điều kiện ''nếu...
    anh sẽ không còn tư cách...''; ''high-ranking soldier'' -> ''quân nhân cấp cao''."]'
- segment_id: YS-LN06/Text/part0019.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Lergen bằng ''anh''; ''Kingdom of
    Ildoa'' -> ''Vương quốc Ildoa''; ''his reception'' -> ''phái đoàn đón tiếp''."]'
- segment_id: YS-LN06/Text/part0019.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại ngoại giao & cấp bậc: Calandro xưng ''Tôi'', gọi
    đoàn của Lergen là ''các vị'' (''you all''); ''Colonel Virginio Calandro'' ->
    ''Đại tá Virginio Calandro''; ''General Igor Gassman'' -> ''Tướng Igor Gassman''."]'
- segment_id: YS-LN06/Text/part0019.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''the Empire'' -> ''Đế quốc''; ''Royal Ildoan
    Army'' -> ''Lục quân Hoàng gia Ildoa''; quy chiếu Lergen bằng ''anh'' và Calandro
    bằng ''người kia'' trong câu trần thuật cảnh đón tiếp."]'
- segment_id: YS-LN06/Text/part0019.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: quy chiếu Calandro bằng ''Hắn'' trong nhận
    định cảnh giác của Lergen."]'
- segment_id: YS-LN06/Text/part0019.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & cấp bậc: Calandro gọi Lergen lịch sự là ''ngài''
    và ''Đại tá von Lergen''."]'
- segment_id: YS-LN06/Text/part0019.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại & cấp bậc: Lergen đáp lễ lịch sự ''Thật vinh hạnh,
    thưa Đại tá Calandro.''."]'
- segment_id: YS-LN06/Text/part0019.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ tương phản: giữ từ nối tương phản ''Dẫu vậy'',
    quy chiếu Lergen bằng ''anh''; ''a soldier'' -> ''một quân nhân''."]'
- segment_id: YS-LN06/Text/part0019.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: quy chiếu Calandro bằng ''hắn''
    / ''Hắn'', chuyển đại từ khái quát gắn với góc nhìn của Lergen (''monitoring you'')
    thành ''giám sát mình''; ''soldier-politician'' -> ''quân nhân chính khách''."]'
- segment_id: YS-LN06/Text/part0019.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: ''the home country'' -> ''quê nhà'';
    ''this guy'' -> ''gã này''; giữ tình thái phỏng đoán ''hẳn sẽ là một kẻ gây phiền
    toái''."]'
- segment_id: YS-LN06/Text/part0019.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Đại từ & châm ngôn quân ngũ: quy chiếu Lergen bằng ''anh''; giữ
    câu châm ngôn ''Không ai có thể chọn kẻ thù cho mình''."]'
- segment_id: YS-LN06/Text/part0019.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & xưng hô: chỉ bọc ''*Chẳng đáng
    là bao*'' khớp chính xác với thẻ em đầu câu thứ hai trong XHTML theo DEC-P01-002;
    Calandro xưng ''chúng tôi'' đại diện phía chủ nhà."]'
- segment_id: YS-LN06/Text/part0019.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn nội tâm & thuật ngữ: bọc toàn bộ
    câu nghĩ thầm ''*Ra đòn phủ đầu để ghi điểm trước chính là thế này đây.*'' khớp
    chính xác với thẻ em trong XHTML theo DEC-P01-002; ''the Empire'' -> ''Đế quốc'';
    ''Commonwealth’s naval blockade'' -> ''cuộc phong tỏa đường biển của Khối Thịnh
    vượng chung''."]'
- segment_id: YS-LN06/Text/part0019.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & xưng hô: chỉ bọc ''*cà phê thứ thiệt*'' khớp
    chính xác với thẻ em ''real coffee'' trong XHTML theo DEC-P01-002; giữ xưng hô
    lịch thiệp ''chúng tôi'' - ''các vị''."]'
- segment_id: YS-LN06/Text/part0019.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi mỉa mai: bọc tách biệt hai cụm ''*lòng
    hiếu khách*'' và ''*quốc gia trung lập*'' khớp chính xác với hai thẻ em ''kindness''
    và ''neutral nation'' trong XHTML theo DEC-P01-002; giữ câu hỏi đuôi ''hửm?''."]'
- segment_id: YS-LN06/Text/part0019.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''the exercises'' -> ''cuộc diễn tập'';
    ''southern seas'' -> ''vùng biển phía nam''; ''imperial mainland'' -> ''bản thổ
    Đế quốc''; ''embargo'' -> ''lệnh cấm vận''; giữ nghĩa phủ định ''vốn đã vắng bóng...
    suốt một thời gian''."]'
