    trì hoãn''."]'
- segment_id: YS-LN06/Text/part0011.html/p000147
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: câu nhận định khái quát đầu đoạn
