- segment_id: YS-LN06/Text/part0011.html/p000136
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật nội tâm gọi ''Weiss'' và quy chiếu
    bằng ''anh''."]'
- segment_id: YS-LN06/Text/part0011.html/p000137
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Chính vì thế…*'' khớp
