- segment_id: YS-LN06/Text/part0011.html/p000166
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: nội tâm tự quy chiếu dùng ''mình'' theo
    DEC-P01-001; ''strategic objective'' -> ''mục tiêu chiến lược''; ''Recon-in-force''
    -> ''Trinh sát chiến đấu''."]'
- segment_id: YS-LN06/Text/part0011.html/p000167
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''Federation'' -> ''Liên bang''; ''large-scale
