- segment_id: YS-LN06/Text/part0011.html/p000139
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Weiss gọi Tanya là ''Trung tá'' kèm
    ''sao ạ''; ''evil Federation'' -> ''Liên bang tà ác''."]'
- segment_id: YS-LN06/Text/part0011.html/p000140
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: câu trần thuật ''Tanya gật đầu.''
