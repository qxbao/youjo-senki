    tên riêng ''Tanya''."]'
- segment_id: YS-LN06/Text/part0011.html/p000138
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thoại vô tuyến: giữ hô hiệu ''02''; bọc ''*cuộc
