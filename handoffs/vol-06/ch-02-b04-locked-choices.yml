- segment_id: YS-LN06/Text/part0011.html/p000132
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến: Weiss xưng ''chúng tôi'', có kính ngữ ''ạ''; giữ
    câu hỏi xin chỉ thị ''đốt sạch mọi thứ''."]'
- segment_id: YS-LN06/Text/part0011.html/p000133
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thoại: giữ tên ''Tanya'' và câu đáp phủ định dứt
    khoát ''Không.''"]'
- segment_id: YS-LN06/Text/part0011.html/p000134
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Weiss gọi Tanya là ''Trung tá'' kèm ''ạ''; giữ
