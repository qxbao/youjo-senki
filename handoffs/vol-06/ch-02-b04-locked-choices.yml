- segment_id: YS-LN06/Text/part0011.html/p000145
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến, phủ định & thuật ngữ: Tanya xưng ''Tôi'', gọi
    đơn vị của Weiss là ''các anh''; giữ phủ định ''không muốn thấy các anh bảo vệ
