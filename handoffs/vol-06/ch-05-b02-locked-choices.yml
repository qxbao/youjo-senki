- segment_id: YS-LN06/Text/part0023.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Tình thái, nguyên nhân – hệ quả & thuật ngữ: giữ tình thái ''Xem
    chừng''; ''second-rate reservists'' -> ''lính dự bị hạng hai''; giữ quan hệ nhân
    quả từ tin đồn về bộ binh dẫn đến việc ''xem nhẹ toàn bộ lực lượng phòng ngự tại
    đó''."]'
- segment_id: YS-LN06/Text/part0023.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Phủ định trích dẫn, tình thái & thuật ngữ: ''Partisan'' -> ''quân
    du kích''; giữ chính xác cặp trích dẫn phủ định đối chiếu ''“không có đơn vị mặt
    đất tinh nhuệ nào”'' với ''“không có đơn vị tinh nhuệ nào”''; giữ tình thái suy
    đoán ''nhưng hẳn ai đó đã đọc nhầm'' và nhận định ''tuy hiếm nhưng vẫn có lúc
