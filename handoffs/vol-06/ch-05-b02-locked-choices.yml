- segment_id: YS-LN06/Text/part0023.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, tình thái & thuật ngữ: Drake dùng ''Chúng ta''
    khi nhận định chung, quy chiếu quân Đế quốc bằng ''họ''; ''Imperial Army'' ->
