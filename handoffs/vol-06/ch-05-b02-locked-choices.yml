- segment_id: YS-LN06/Text/part0023.html/p000053
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, nhân quả & thuật ngữ: giữ câu điều kiện ''Nếu không
    lực của địch thuộc hàng tinh nhuệ bậc nhất thì đó quả là tin xấu.''; ''imperial
    armada'' -> ''hạm đội không quân của Đế quốc''; ''former Entente Alliance territory''
    -> ''lãnh thổ cựu Liên minh Hiệp ước''."]'
- segment_id: YS-LN06/Text/part0023.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điều kiện & thuật ngữ: chỉ bọc ''*Queen of
    Anjou*'' khớp chính xác với thẻ em trong XHTML (để ''RMS'' ngoài dấu sao) theo
    DEC-P01-002; giữ cấu trúc điều kiện muộn màng ''Nếu mãi đến giờ người ta mới chịu
    để tâm... thì mọi sự đã quá muộn màng.'' và chi tiết ''hộ tống một chiều''."]'
- segment_id: YS-LN06/Text/part0023.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Thoại, câu hỏi tu từ & thuật ngữ: ''convoy'' -> ''đoàn tàu vận
    tải''; ''air superiority'' -> ''ưu thế trên không''; ''the mainland'' -> ''bản
    thổ''; giữ câu hỏi chất vấn ''Các vị ở bản thổ đang nghĩ cái quái gì vậy không
    biết?'' và sắc thái trần thuật ''khẽ gióng lên hồi chuông cảnh báo với cảm giác
    khủng hoảng sâu sắc''."]'
