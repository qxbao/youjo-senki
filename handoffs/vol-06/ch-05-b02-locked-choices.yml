choices:
- segment_id: YS-LN06/Text/part0023.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, phủ định & thuật ngữ: câu thoại mở đầu ''“Thôi
    được rồi.”''; quy chiếu Drake bằng ''Ông / mình'' và Mikel bằng tên riêng ''Mikel'';
    giữ hai cấu trúc phủ định (''không muốn đào sâu vào chuyện đó'', ''cũng không
    muốn Mikel nghĩ rằng...''); ''Federation administration'' -> ''công việc nội chính
    của Liên bang''."]'
- segment_id: YS-LN06/Text/part0023.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: ''Federation Navy'' -> ''Hải quân Liên bang'';
    giữ cặp ẩn dụ ''phần cứng cũ kỹ đi kèm với phần mềm hoàn toàn mới''."]'
- segment_id: YS-LN06/Text/part0023.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái, phủ định & thuật ngữ: chỉ bọc ''*mới*''
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ tình thái nhượng bộ
    ''thoạt nghe có vẻ tinh khôi, nhưng về cơ bản lại đồng nghĩa với trống rỗng'';
    ''predreadnought battleships'' -> ''những thiết giáp hạm tiền-dreadnought''; giữ
    phủ định giảm nhẹ ''chỉ miễn cưỡng phô bày được chút dáng vẻ mà khó lòng gọi là
    uy nghiêm''."]'
- segment_id: YS-LN06/Text/part0023.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ đánh giá: ''aerial mages'' -> ''pháp sư trên
    không''; ''Federation Navy'' -> ''Hải quân Liên bang''; giữ đúng mức độ ''tỏ ra
    khá hụt hơi trước các trận hải chiến đương đại''."]'
- segment_id: YS-LN06/Text/part0023.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, giả định & thuật ngữ: Drake xưng ''tôi'', gọi
    phía Mikel là ''các anh'' (nhất quán với ch-05-b01); ''control of the sky'' ->
    ''quyền làm chủ bầu trời''; giữ nhận định giả định ''Lao đầu vào một khu vực...
    như thế chẳng khác nào tự sát.''."]'
- segment_id: YS-LN06/Text/part0023.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, đại từ trần thuật, phủ định, tình thái & thuật
    ngữ: Mikel xưng ''chúng tôi'', trần thuật quy chiếu Mikel bằng ''anh'' (nhất quán
    với ch-05-b01); ''air superiority'' -> ''ưu thế trên không''; ''Operation Tea
    Party'' -> ''Chiến dịch Tiệc Trà''; giữ phủ định ''chúng tôi không có ưu thế trên
    không'', tình thái suy đoán ''hẳn anh cũng đã tự hiểu rõ điều đó'' và câu khẳng
    định khái quát ở cuối đoạn."]'
- segment_id: YS-LN06/Text/part0023.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, câu hỏi tu từ phủ định & thuật ngữ: Drake gọi
    phía Mikel là ''các anh''; ''carrier strike group'' -> ''cụm tàu sân bay xung
    kích''; ''air cover'' -> ''lực lượng yểm trợ đường không''; ''carrier'' -> ''tàu
    sân bay''; giữ tương quan đối lập ở câu đầu và câu hỏi tu từ phủ định ''Không
    có tàu sân bay thì các anh lấy đâu ra ngần ấy lực lượng yểm trợ đường không cơ
    chứ?''."]'
- segment_id: YS-LN06/Text/part0023.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, phủ định & thuật ngữ: Mikel xưng ''chúng tôi'';
    ''aircraft carriers'' -> ''tàu sân bay''; giữ phủ định cảm thán ''làm gì có tàu
    sân bay…''."]'
- segment_id: YS-LN06/Text/part0023.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & tình thái giới hạn: Drake xưng ''Tôi''; giữ cấu
    trúc giới hạn ''…Tôi chỉ có thể nói rằng làm vậy là quá liều lĩnh.''."]'
- segment_id: YS-LN06/Text/part0023.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, dấu câu & thuật ngữ: quy chiếu Drake và Mikel bằng
    ''họ''; giữ dấu ngoặc kép quanh cụm ''“kiểm tra sức chịu đựng”''; ''Commonwealth
    Navy'' -> ''Hải quân Khối Thịnh vượng chung''."]'
- segment_id: YS-LN06/Text/part0023.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối lập: ''Commonwealth'' -> ''Khối Thịnh vượng chung'';
    ''carrier task forces'' -> ''Các lực lượng đặc nhiệm tàu sân bay''; ''recon-in-force''
    -> ''trinh sát chiến đấu''; ''former Entente Alliance and former Republic territory''
    -> ''lãnh thổ cựu Liên minh Hiệp ước và cựu Cộng hòa''; giữ mệnh đề đối lập ''nhưng
    kết quả thu về lại vô cùng thảm hại''."]'
- segment_id: YS-LN06/Text/part0023.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: ''imperial forces'' -> ''quân Đế quốc''; ''capital
    ships'' -> ''các tàu chủ lực''; ''anti–air combat'' -> ''tác chiến phòng không'';
    quy chiếu phía Khối Thịnh vượng chung bằng ''họ''."]'
- segment_id: YS-LN06/Text/part0023.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & phủ định: dùng đại từ gộp ''Chúng ta''; giữ phủ
    định tình thái ''không thể trông mong lực lượng phòng thủ của Đế quốc là hạng
    xoàng được'' và câu cảm thán ''Đau đầu thật đấy.''."]'
- segment_id: YS-LN06/Text/part0023.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*Chúng hoàn
    toàn bị đánh bất ngờ và rơi vào tình cảnh thảm hại đến mức phải tung cả các đơn
    vị huấn luyện lên đánh chặn*'' khớp chính xác với thẻ em trong XHTML (để dấu ba
    chấm ngoài dấu sao) theo DEC-P01-002; phân biệt đại từ ''Chúng'' (quân Đế quốc
    trong thông cáo) với ''họ'' (quân Khối Thịnh vượng chung); ''training units''
    -> ''các đơn vị huấn luyện''; ''intercept'' -> ''đánh chặn''; ''Commonwealth Navy''
    -> ''Hải quân Khối Thịnh vượng chung''."]'
- segment_id: YS-LN06/Text/part0023.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ, dấu câu & thuật ngữ: giữ câu hỏi tu từ hoài nghi
    ở đầu đoạn và dấu ngoặc kép quanh cụm ''“đã hết thời gian”''; ''encounter battle''
    -> ''trận tao ngộ chiến''; ''Commonwealth marine mages'' -> ''các pháp sư hải
    quân đánh bộ của Khối Thịnh vượng chung''; ''Imperial Army'' -> ''Lục quân Đế
    quốc''."]'
- segment_id: YS-LN06/Text/part0023.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đại từ: giữ trạng từ ''Dĩ nhiên'', quy chiếu phía
    Khối Thịnh vượng chung bằng ''họ''."]'
- segment_id: YS-LN06/Text/part0023.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả, phủ định & thuật ngữ: ''the Empire'' -> ''Đế
    quốc''; ''Commonwealth mainland'' -> ''bản thổ Khối Thịnh vượng chung''; ''western
    air fleet'' -> ''không hạm đội phía tây''; giữ phủ định ''họ chẳng mấy ngạc nhiên''."]'
- segment_id: YS-LN06/Text/part0023.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Đối lập nhượng bộ & tình thái: giữ cấu trúc chuyển ý ''Thế nhưng
    dù vậy'' và tình thái suy đoán ''xem chừng vẫn diễn biến tồi tệ hơn dự tính''."]'
- segment_id: YS-LN06/Text/part0023.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, nhượng bộ, tình thái & thuật ngữ: ''gag order'' ->
    ''lệnh bịt miệng''; ''secrecy classification'' -> ''quy chế bảo mật''; giữ cấu
    trúc điều kiện kèm nhượng bộ ''Nếu bất chấp... mà thông tin vẫn lọt đến tai Drake
    nhiều đến mức này'' và suy luận ''hẳn tình hình thực tế phải rất bi đát''."]'
- segment_id: YS-LN06/Text/part0023.html/p000047
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế, đối lập & thuật ngữ: giữ giả định quá khứ
    ''Sẽ còn chút an ủi nếu họ giành được thắng lợi áp đảo ở những nơi khác ngoài
    hướng tây'' và vế đối lập; ''stress test'' -> ''đợt kiểm tra sức chịu đựng'';
