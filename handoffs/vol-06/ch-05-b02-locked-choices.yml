- segment_id: YS-LN06/Text/part0023.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: ''air fleet'' -> ''không hạm đội''; ''carrier
    task force'' -> ''lực lượng đặc nhiệm tàu sân bay''; giữ phủ định ''mà họ chưa
