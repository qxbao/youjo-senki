    ''phải thừa nhận'' và suy đoán ''Hẳn... đang ưu tiên''."]'
- segment_id: YS-LN06/Text/part0023.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, tình thái & thuật ngữ: quy chiếu Drake bằng
    ''ông''; ''former Entente Alliance territory'' -> ''lãnh thổ cựu Liên minh Hiệp
    ước''; ''the Empire'' -> ''Đế quốc''; giữ mệnh đề nhượng bộ ''Bất chấp lời cảnh
    báo từ Drake và những người khác'' và tình thái ''có vẻ như cấp trên đã đánh giá
