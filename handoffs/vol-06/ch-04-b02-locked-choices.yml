    XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0019.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & xưng hô: Calandro xưng ''Tôi''
