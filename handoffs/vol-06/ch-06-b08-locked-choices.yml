choices:
- segment_id: YS-LN06/Text/part0027.html/p000259
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & liên kết đoạn: giữ liên kết nối tiếp từ đoạn trước ''Hoặc
    một ví dụ điển hình khác là các quốc gia từng chùn bước trước cải cách vào giai
    đoạn suy tàn của họ.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000260
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & câu hỏi tu từ: dùng ''chúng ta''; ''opportunity
    cost'' -> ''chi phí cơ hội''; ''maintaining the status quo'' -> ''duy trì nguyên
    trạng''; giữ câu hỏi cảm thán về việc hy sinh sinh mạng binh sĩ và ngân sách quốc
    gia."]'
- segment_id: YS-LN06/Text/part0027.html/p000261
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & ẩn dụ y khoa: dùng ''bạn'' cho ngôi thứ hai
    khái quát; ''system fatigue'' -> ''sự rệu rã của hệ thống''; giữ so sánh ''Chuyện
    đó cũng giống hệt như phẫu thuật vậy.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000262
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ y khoa, điều kiện & nhân quả: ''noninvasive procedure''
    -> ''biện pháp không xâm lấn''; dùng ''bạn'' khái quát; giữ quan hệ nhượng bộ
    – điều kiện ''Dùng thuốc gây mê để làm dịu cơn đau là điều hợp lý, nhưng nếu bệnh
    nhân khiếp sợ chính ca phẫu thuật đó, rốt cuộc họ sẽ chết.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000263
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh: giữ in hoa toàn bộ ''VÀO KHOẢNG CÙNG THỜI
    ĐIỂM ĐÓ, THỦ ĐÔ ĐẾ QUỐC BERUN, PHÒNG TÁC CHIẾN THUỘC VĂN PHÒNG BỘ TỔNG THAM MƯU''."]'
- segment_id: YS-LN06/Text/part0027.html/p000264
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''Federation Army'' -> ''Quân đội Liên
    bang''; giữ sắc thái phỏng đoán ''dường như đang lên kế hoạch cho một cuộc phản
    công lớn dọc khắp các tuyến chính''."]'
- segment_id: YS-LN06/Text/part0027.html/p000265
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & điểm nhìn: ''Federation troops'' -> ''quân
    Liên bang''; ''Lieutenant General von Rudersdorf'' -> ''Trung tướng von Rudersdorf'';
    giữ mệnh đề bổ nghĩa và trạng thái ''cũng phải phát ngán''."]'
- segment_id: YS-LN06/Text/part0027.html/p000266
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thời gian: dùng ''Chúng ta'' và ''chúng'' (quân Liên
    bang); giữ trạng thái vừa mới xảy ra ''“…Chúng ta đúng nghĩa là vừa mới đẩy lùi
    cuộc tiến công mùa đông giới hạn của chúng xong.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000267
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thuật ngữ: dùng ''ông'' chỉ Rudersdorf; ''General
    Staff'' -> ''Bộ Tổng tham mưu''; ''first-string units of the Federation Army''
    -> ''các đơn vị chủ lực hạng nhất của Quân đội Liên bang''."]'
- segment_id: YS-LN06/Text/part0027.html/p000268
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi & đại từ: dùng ''Chúng'' chỉ phía Liên bang (''“Chúng
    lấy đâu ra ngần ấy nhân lực chứ?”'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000269
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi mỉa mai: giữ nguyên thành ngữ ẩn dụ ''“Chẳng phải chúng
    mọc trên cây sao?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000270
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nối tiếp ẩn dụ: giữ câu hỏi ngắn ''“Kể cả khi không có
    phân bón ư?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000271
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & giả định trái thực tế: ''nationalism'' ->
    ''chủ nghĩa dân tộc''; ''Communism'' -> ''Chủ nghĩa Cộng sản''; dùng ''chúng''
    và ''chúng ta''; giữ vế giả định ''dù chúng ta hẳn đã thích chúng dùng thứ Chủ
    nghĩa Cộng sản kém cỏi hơn''."]'
- segment_id: YS-LN06/Text/part0027.html/p000272
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thuật ngữ: dùng ''ông'' chỉ Zettour; ''Federation
    Army'' -> ''Quân đội Liên bang''; giữ cấu trúc chuyển đổi từ ''Chủ nghĩa Cộng
    sản'' sang ''chủ nghĩa dân tộc''."]'
- segment_id: YS-LN06/Text/part0027.html/p000273
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, điểm nhìn & thuật ngữ: ''Lieutenant General von Zettour''
    -> ''Trung tướng von Zettour''; ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ các đánh giá ''không thể đảo ngược được nữa'', ''công cụ bạo lực'', ''tin
    tình báo trước chiến tranh'' và ''tinh thần đoàn kết''."]'
- segment_id: YS-LN06/Text/part0027.html/p000274
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''the Communists'' -> ''đám Cộng sản''; giữ
    câu hỏi ''“Vậy là đám Cộng sản thậm chí còn đang khắc phục được cả những thất
    bại trong nông nghiệp của chúng sao?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000275
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại, tình thái & thuật ngữ: dùng ''Tôi'' (Zettour/Rudersdorf)
    và ''chúng ta''; ''submarine warfare'' -> ''tác chiến tàu ngầm''; giữ tình thái
    dè dặt ''có lẽ chúng ta nên dỡ bỏ các hạn chế đối với tác chiến tàu ngầm''."]'
- segment_id: YS-LN06/Text/part0027.html/p000276
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu trần thuật ''Ngay cả chính người đưa ra đề xuất
    ấy cũng chẳng thực sự muốn tính đến phương án đó.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000277
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & điều kiện: ''Unified States'' -> ''Hợp chúng
    quốc''; Rudersdorf gọi Zettour là ''Ông'', trần thuật gọi Rudersdorf là ''ông'';
    giữ mệnh đề điều kiện phủ định và hình ảnh so sánh ''nét mặt ông đắng ngắt như
    thể vừa bị ép uống giấm''."]'
- segment_id: YS-LN06/Text/part0027.html/p000278
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái pháp lý: xử lý chuẩn lỗi in ''joining the
    way'' của bản nguồn tiếng Anh thành ''tham chiến'' theo đúng văn cảnh; ''commercial
    raiding'' -> ''đánh phá tàu buôn''; giữ tình thái ''Về mặt pháp lý, dường như
    hoàn toàn có thể xem họ là kẻ thù...''."]'
- segment_id: YS-LN06/Text/part0027.html/p000279
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tên riêng: giữ phủ định ''Nhưng Zettour không thể tán
    thành một kế hoạch hung hăng như phương án mà Rudersdorf đang gợi ý.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000280
  kind: terminology_and_voice
  value: 'choices=["So sánh ẩn dụ: giữ câu thoại của Zettour ''“…Làm vậy chẳng khác
    nào bật công tắc kích hoạt một quả bom hẹn giờ cả.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000281
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''General Staff Office'' -> ''Văn phòng Bộ Tổng tham
    mưu''; giữ nghĩa ''Bài toán nan giải đang đè nặng lên tâm trí mọi người trong
    Văn phòng Bộ Tổng tham mưu vốn rất dễ định nghĩa.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000282
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''isolationists'' -> ''những kẻ theo chủ
    nghĩa biệt lập''; ''principles of nonintervention'' -> ''nguyên tắc không can
    thiệp''; giữ câu hỏi định nghĩa bài toán."]'
- segment_id: YS-LN06/Text/part0027.html/p000283
  kind: terminology_and_voice
  value: 'choices=["Giả định & thuật ngữ: giữ giả định ''Nếu có, câu trả lời rất đơn
    giản. Tất cả những kẻ theo chủ nghĩa biệt lập sẽ hợp lực lại để can thiệp vào
    tình hình lục địa.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000284
  kind: terminology_and_voice
  value: 'choices=["Giả định phủ định, nghịch lý & thuật ngữ: ''isolationism'' ->
    ''chủ nghĩa biệt lập''; giữ mệnh đề điều kiện phủ định và sắc thái mỉa mai ''tiếp
    tục màn trình diễn đầy ấn tượng là vừa duy trì chủ nghĩa biệt lập vừa can thiệp,
    nhưng khi ấy vấn đề chỉ còn là chuyện đó sẽ kéo dài được bao lâu''."]'
- segment_id: YS-LN06/Text/part0027.html/p000285
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''Unified States'' -> ''Hợp chúng
    quốc''; ''Federation'' -> ''Liên bang''; ''Commonwealth'' -> ''Khối Thịnh vượng
    chung''; ''supply lines'' -> ''các tuyến tiếp vận''; ''operations planning'' ->
    ''hoạch định tác chiến''; giữ phủ định ''chúng ta cũng không thể cứ để mặc họ
    muốn làm gì thì làm được''."]'
- segment_id: YS-LN06/Text/part0027.html/p000286
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: chỉ bọc ''*Nghe này*'' khớp chính
    xác với thẻ em ''Listen'' trong XHTML theo DEC-P01-002; giữ phủ định ''thậm chí
    chẳng cần mở đầu bằng từ *Nghe này* để chen ngang'' và ''không thể đánh vào các
    tuyến tiếp vận của địch''."]'
- segment_id: YS-LN06/Text/part0027.html/p000287
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, chức trách & thoại phản bác: giữ ''vị trung tướng phụ
    trách chỉ đạo tác chiến''; giữ lời phản bác mang sắc thái mỉa mai nhẹ của Zettour
    ''“Nếu tất cả những gì họ đang làm chỉ là đảm nhận vai trò hậu cần, thì chúng
    ta cứ coi đó là một cử chỉ ủng hộ đáng mến và dừng lại ở đấy thôi.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000288
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: dùng ''ông'' chỉ Zettour; ''Commonwealth''
    -> ''Khối Thịnh vượng chung''; ''Unified States'' -> ''Hợp chúng quốc''; giữ cấu
    trúc phủ định ''Những con số đủ sức quẳng cả cảm xúc lẫn nguyên tắc qua cửa sổ
    cũng không làm cho việc trực tiếp gây hấn với kẻ hậu thuẫn của Khối Thịnh vượng
    chung—tức Hợp chúng quốc—trở nên chấp nhận được.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000289
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thoại: giữ hành động và câu càu nhàu của Zettour
    ''“Dù sao thì thế vẫn còn đỡ hơn kịch bản tồi tệ nhất.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000290
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Rudersdorf gọi ''Zettour, ông...''; giữ câu
    hỏi ''“Zettour, ông nghĩ họ có thể sẽ thực sự trực tiếp tham chiến ư?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000291
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & cấp bậc trong thoại: Zettour xưng ''Tôi'', gọi Rudersdorf
    là ''Người bạn đáng kính của tôi, Tướng von Rudersdorf, ông...''; giữ nhận định
    ''Họ đã đầu tư quá nhiều vào cuộc chiến này rồi.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000292
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái nghi ngờ: ''Unrestricted submarine warfare''
    -> ''Chiến tranh tàu ngầm không hạn chế''; ''Unified States'' -> ''Hợp chúng quốc'';
    giữ ẩn dụ ''con quái vật dư luận đang phẫn nộ'' và mối nghi ngờ của Zettour rằng
    chính họ có khả năng tự dàn dựng nên một sự cố."]'
- segment_id: YS-LN06/Text/part0027.html/p000293
  kind: terminology_and_voice
  value: 'choices=["Thoại bỏ lửng: giữ câu nói ngập ngừng của Rudersdorf ''“Nếu đó
    chỉ là một rủi ro thì…”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000294
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, thuật ngữ & đối lập góc nhìn: ''wishful thinking''
    -> ''suy nghĩ viển vông''; giữ câu đáp của Zettour và lời khuyên đối lập ''hãy
    nghĩ về chuyện đó từ góc độ hậu cần thay vì tác chiến đi''."]'
