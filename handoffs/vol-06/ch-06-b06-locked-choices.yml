- segment_id: YS-LN06/Text/part0027.html/p000199
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu khẳng định ''Giải pháp thì vô cùng đơn giản.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000200
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc lựa chọn tất yếu: giữ cấu trúc ''“Hoặc là cắt giảm khối
