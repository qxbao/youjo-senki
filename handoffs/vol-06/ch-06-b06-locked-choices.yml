    DEC-P01-001; ''partisans'' -> ''đám du kích''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''."]'
- segment_id: YS-LN06/Text/part0027.html/p000180
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & đại từ tập thể: quy chiếu đơn vị bằng ''chúng tôi'';
    giữ câu điều kiện ''Nếu giao chiến được thì chúng tôi có thể thắng.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000181
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điều kiện & đại từ: chỉ bọc ''*nếu*'' khớp
    chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ đại từ ''chúng tôi'' và
    điều kiện giả định ''Đó là *nếu* chúng tôi có được cơ hội giao chiến.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000182
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & chỉ thị phủ định: Tanya gọi Grantz là ''Anh'',
    ''Lieutenant'' -> ''Trung úy''; giữ mệnh lệnh cấm đoán ''“…Anh không được đuổi
    theo chúng đâu đấy, Trung úy.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000183
  kind: terminology_and_voice
  value: 'choices=["Phủ định & xưng hô: Grantz đáp cấp trên ''“Tất nhiên là không
    rồi ạ. Trung tá cứ yên tâm ở tôi.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000184
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Tanya xưng ''Tôi''; giữ phủ định răn đe ''“Tốt.
    Tôi không muốn thấy cảnh lao đầu xông bừa đâu.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000185
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chỉ dẫn hành động: ''Yes, ma’am!'' -> ''Rõ, thưa Trung
    tá!''; Grantz xưng ''tôi... ạ'' và xin phép xuất kích ứng phó ngay."]'
- segment_id: YS-LN06/Text/part0027.html/p000186
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & chỉ dẫn: trần thuật nêu tên ''Tanya'',
    ''adjutant'' -> ''viên sĩ quan phụ tá của mình'', ''Lieutenant Serebryakov'' ->
    ''Trung úy Serebryakov''; giữ yêu cầu ''cho tôi cà phê. Pha đặc nhé.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000187
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & quan hệ nhân quả: quy chiếu Tanya bằng ''nó''
    theo DEC-P01-001; chủ thể khái quát dùng ''người ta''; giữ chuỗi nhân quả dẫn
    tới ''một vòng luẩn quẩn''."]'
- segment_id: YS-LN06/Text/part0027.html/p000188
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, nhượng bộ & phủ định: nội tâm tự quy chiếu của
    Tanya dùng ''mình'' theo DEC-P01-001; giữ cấu trúc nhượng bộ – phủ định ''Ngay
    cả khi không dám chắc... mình vẫn cảm nhận được một sự thật không thể chối cãi
    là suy nghĩ của mình đang bị kìm hãm bởi chứng thiếu ngủ kinh niên.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000189
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & đại từ: câu đầu nội tâm dùng ''Mình''
    theo DEC-P01-001, câu sau chuyển điểm nhìn trần thuật nêu tên ''Tanya''; chỉ bọc
    ''*Thôi thì vẫn còn đỡ hơn là nốc quá nhiều rượu bia…*'' (đặt dấu phẩy ngoài dấu
    sao) khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0027.html/p000190
  kind: terminology_and_voice
  value: 'choices=["Phủ định & kết luận: giữ phủ định ''chẳng phải là cảm giác dễ
    chịu gì'' và nhận định ''Nói ngắn gọn… đó là một dấu hiệu xấu.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000191
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thoại độc thoại: ''human error'' -> ''sai sót do con
    người''; giữ câu nhận xét ''“Nơi này đúng là cái ổ phát sinh sai sót do con người.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000192
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm/khái quát, phủ định & điều kiện: tự quy chiếu dùng
