- segment_id: YS-LN06/Text/part0027.html/p000215
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đại từ: giữ phủ định ''cho đến nay vẫn chưa
    được khai thác''; ''voluntary troops'' -> ''quân tình nguyện''; ''law of war''
