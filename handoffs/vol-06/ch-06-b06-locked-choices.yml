- segment_id: YS-LN06/Text/part0027.html/p000196
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu nhận định ''Chỉ cần tóm lược lại tình hình là vấn
    đề đã lộ rõ.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000197
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: giữ câu nói ''“Căn nguyên của mọi rắc rối là
