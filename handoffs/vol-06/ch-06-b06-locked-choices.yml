  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & nhượng bộ: ''the Empire'' -> ''Đế quốc'';
    giữ phủ định ''vẫn chưa đến mức thảm khốc như thế'' và cấu trúc nhượng bộ ''Ngay
