    nào cũng không được phép'', ''chẳng khác nào một kẻ ngu xuẩn không còn lựa chọn
    nào khác ngoài việc phải làm bộ làm tịch'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000193
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & điều kiện giả định: nội tâm tự quy chiếu dùng
    ''mình / bản thân'' theo DEC-P01-001; giữ giả định ''Nếu mình mà trở nên yếu đuối
