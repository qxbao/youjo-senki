    tàn quân địch, thà mở một chiến dịch thuyết phục ôn hòa ở phía đông còn tốt hơn…''
    và câu bỏ lửng ở cuối."]'
- segment_id: YS-LN06/Text/part0027.html/p000217
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đại từ: ''the Empire'' -> ''Đế quốc''; ''opportunity
    costs'' -> ''chi phí cơ hội''; dùng ''chúng tôi'' và giữ phủ định nghi vấn ''Thậm
    chí còn chẳng rõ liệu chúng tôi có thể gượng dậy nổi sau sai lầm này hay không.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000218
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''former Entente Alliance territory'' -> ''lãnh
