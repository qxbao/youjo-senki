choices:
- segment_id: YS-LN06/Text/part0008.html/p000078
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc đối chiếu (cần sửa nhẹ theo finding): ''the
    Empire'' -> ''Đế quốc''; ''the Federation'' -> ''Liên bang''; ''General Winter''
    -> ''Tướng Mùa Đông''; giữ cấu trúc đối lập ''bên trước... bên sau...'' và sửa
    cụm chỉ mùa ở cuối câu thành ''bất chấp đang là mùa nào'' (tránh từ ''mùa màng'')."]'
- segment_id: YS-LN06/Text/part0008.html/p000079
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: trần thuật ngôi thứ ba dùng tên
    riêng ''Tanya''; chỉ bọc ''*Giỏi lắm, tất cả mọi người.*'' khớp chính xác với
    thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0008.html/p000080
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu cảm thán ngắn gọn mở đầu lời phàn nàn của Tanya
    (''Đánh trận giữa thời tiết thế này thật nực cười.'')."]'
- segment_id: YS-LN06/Text/part0008.html/p000081
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & thuật ngữ: giữ mệnh đề nhượng bộ ''Dẫu lý
    lẽ quân sự đòi hỏi điều đó'' đối lập với ''sự coi thường đối với nền kinh tế quốc
    dân''."]'
- segment_id: YS-LN06/Text/part0008.html/p000082
  kind: terminology_and_voice
  value: 'choices=["Đại từ, chủ thể đánh giá & cấu trúc so sánh (cần sửa theo finding):
    trần thuật quy chiếu Tanya bằng ''nó'' theo DEC-P01-001; diễn đạt rõ hành vi của
    các quốc gia tham chiến là đối tượng không có vẻ tỉnh táo trong mắt Tanya; giữ
    cấu trúc ''chẳng giống... mà giống như... thì đúng hơn—đúng là điên rồ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000083
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & điều kiện: dùng đại từ khái quát ''bạn'' trong
    mệnh đề giả định chung."]'
- segment_id: YS-LN06/Text/part0008.html/p000084
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ kinh tế: ''supply and demand'' -> ''quy luật cung cầu'';
    giữ không khí nhận định lý luận của Tanya."]'
- segment_id: YS-LN06/Text/part0008.html/p000085
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc liệt kê ba vế: ''failure of the market''
    -> ''thất bại của thị trường''; ''economic principles'' -> ''các nguyên lý kinh
    tế''; ''government intervention'' -> ''sự can thiệp của chính phủ''; giữ nguyên
    ba lựa chọn phân loại song hành."]'
- segment_id: YS-LN06/Text/part0008.html/p000086
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & điều kiện: độc thoại nội tâm tự quy chiếu
    của Tanya dùng ''mình'' theo DEC-P01-001; giữ tình thái ''có lẽ mình có thể nhắm
    tới tấm bằng tiến sĩ'' và điều kiện giả định ở câu sau (''Đấy là nếu mình có cơ
    hội viết luận án sau chiến tranh.'')."]'
- segment_id: YS-LN06/Text/part0008.html/p000087
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & giới hạn thời gian: độc thoại nội tâm dùng ''mình
    / Mình'' theo DEC-P01-001; giữ cấu trúc giới hạn điều kiện ''chỉ có thể... một
    khi cuộc chiến này kết thúc và mọi thứ trở lại bình thường''."]'
- segment_id: YS-LN06/Text/part0008.html/p000088
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: câu đầu dùng đại từ khái quát ''bạn'', câu
    hai chuyển sang trần thuật ngôi thứ ba với ''Tanya'' và phản thân ''mình / bản
    thân''; ''attrition'' -> ''mức tiêu hao''."]'
- segment_id: YS-LN06/Text/part0008.html/p000089
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''luxury item'' -> ''mặt hàng xa xỉ''; giữ mạch liên
    kết ''Theo nghĩa đó''."]'
- segment_id: YS-LN06/Text/part0008.html/p000090
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: lời của Serebryakov với Tanya dịch ''Colonel''
    -> ''Trung tá'' kèm tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000091
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*Có rồi sao?*''
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; trần thuật ngôi thứ ba
    dùng ''Tanya'' và ''nó'' theo DEC-P01-001; ''frontline headquarters of the Kampfgruppe''
    -> ''sở chỉ huy tiền tuyến của Kampfgruppe''."]'
- segment_id: YS-LN06/Text/part0008.html/p000092
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba dùng tên riêng ''Serebryakov'',
    ''Tanya'' và đại từ ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000093
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & câu hỏi bỏ lửng: Tanya xưng ''Tôi'', gọi Serebryakov
    là ''Trung úy''; giữ câu hỏi bỏ lửng ''Lẽ nào đây là…?''."]'
- segment_id: YS-LN06/Text/part0008.html/p000094
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Serebryakov xưng ''tôi'' kèm ''ạ''; giữ phủ
    định ''tôi không nghĩ người ta đã có thể tái tạo mùi hương này bằng phương pháp
    nhân tạo đâu ạ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000095
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật ngôi thứ ba dùng ''Tanya''
    và ''Nó'' theo DEC-P01-001; giữ câu lẩm bẩm phủ định ''Chắc chắn không có mùi
    giống cái thứ của quân đội rồi''."]'
- segment_id: YS-LN06/Text/part0008.html/p000096
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: trần thuật dùng ''nó''
    theo DEC-P01-001; giữ phủ định ''không đời nào nó nhầm lẫn được''; chỉ bọc ''*Ààà,
    thì ra đây chính là cảm giác xúc động dâng trào!*'' khớp với thẻ em trong XHTML
    theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0008.html/p000097
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''ersatz version'' -> ''phiên bản thay thế''."]'
- segment_id: YS-LN06/Text/part0008.html/p000098
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong câu hỏi: Tanya xưng ''Tôi''; giữ dấu
    chấm lửng ngập ngừng và dịch ''government ration'' -> ''khẩu phần chính phủ cấp
    phát''."]'
- segment_id: YS-LN06/Text/part0008.html/p000099
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Serebryakov xưng ''tôi'', dịch ''you'' ->
    ''Trung tá'', giữ dấu chấm lửng và thống nhất ''government ration'' -> ''khẩu
    phần chính phủ cấp phát''."]'
- segment_id: YS-LN06/Text/part0008.html/p000100
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: độc thoại nội tâm của Tanya quy chiếu Serebryakov
    bằng ''Serebryakov / cô ấy'' và tự quy chiếu bằng ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000101
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện phủ định: ''human capital'' -> ''vốn con
    người''; giữ điều kiện phủ định ''nếu không đầu tư vào vốn con người'' và câu
    chuyển ý ''Dù vậy, thông thường thì nút thắt lại nằm ở hạt cà phê''."]'
- segment_id: YS-LN06/Text/part0008.html/p000102
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & thuật ngữ: tự quy chiếu bằng ''Mình'' theo DEC-P01-001;
    ''coffee substitute'' -> ''cà phê thay thế''."]'
- segment_id: YS-LN06/Text/part0008.html/p000103
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & tình thái: Tanya xưng ''Tôi''; ''eastern front''
    -> ''mặt trận phía đông''; giữ câu hỏi nguồn gốc nhập khẩu, mệnh đề nhượng bộ
    ''ngay cả khi chỉ tính riêng...'' và nhận định suy đoán ''Hẳn đó phải là một thử
    thách không nhỏ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000104
  kind: terminology_and_voice
  value: 'choices=["Sắc thái đối lập: giữ cặp trạng thái tâm lý song hành ''vừa cảm
    kích vừa ngỡ ngàng''."]'
- segment_id: YS-LN06/Text/part0008.html/p000105
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật ngôi thứ ba quy chiếu
    Tanya bằng ''Tanya'' và ''nó'' theo DEC-P01-001; ''frostbite'' -> ''chứng bỏng
    lạnh''; ''Kampfgruppe'' -> ''Kampfgruppe''."]'
- segment_id: YS-LN06/Text/part0008.html/p000106
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & thuật ngữ: dùng đại từ khái quát ''bạn''; ''cold-weather
    gear'' -> ''quân trang chống rét''; ''cognitive dissonance'' -> ''bất hòa nhận
    thức''."]'
- segment_id: YS-LN06/Text/part0008.html/p000107
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: Tanya xưng ''tôi'', dùng ''chúng
    ta'' cho đơn vị; ''command'' -> ''cấp chỉ huy''; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN06/Text/part0008.html/p000108
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''luxury goods'' -> ''các mặt hàng xa xỉ'';
    ''frontline morale'' -> ''sĩ khí tiền tuyến''; giữ cấu trúc đối lập và vế phủ
    định ''việc không đáp ứng được những nhu cầu đó sẽ gây ra rắc rối''."]'
- segment_id: YS-LN06/Text/part0008.html/p000109
  kind: terminology_and_voice
  value: 'choices=["Phủ định mức độ: giữ sắc thái phủ định giảm nhẹ ''cũng chẳng lấy
    gì làm xa hoa''."]'
- segment_id: YS-LN06/Text/part0008.html/p000110
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & hệ quả: giữ rõ hai điều kiện giới hạn (''Mức điều kiện
    văn minh tối thiểu'' và ''lượng dinh dưỡng chỉ vừa đủ để làm việc nhẹ'') dẫn tới
    hệ quả ''khiến họ bị thiếu hụt calo''."]'
- segment_id: YS-LN06/Text/part0008.html/p000111
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn khái quát: dùng cách diễn đạt khái quát ''người ta phải
    ăn'', ''ở người lính'' cho các mệnh đề quy tắc quân ngũ."]'
- segment_id: YS-LN06/Text/part0008.html/p000112
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu chuyển ngắn gọn ''Lý do thì đã quá rõ ràng.''."]'
- segment_id: YS-LN06/Text/part0008.html/p000113
  kind: terminology_and_voice
  value: 'choices=[''Tình thái bắt buộc: giữ hai mệnh đề bị động chỉ yêu cầu thường
    trực về duy trì năng lượng và giữ sức chiến đấu ở mức cao nhất có thể.'']'
- segment_id: YS-LN06/Text/part0008.html/p000114
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: ''cold-weather gear'' -> ''quân trang chống
    rét''; giữ phủ định tuyệt đối ''đáng lẽ không bao giờ được phép xảy ra''."]'
- segment_id: YS-LN06/Text/part0008.html/p000115
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tự vấn & so sánh phủ định trong thoại: giữ câu hỏi tự
    vấn của Tanya về việc cho lính hạn chế vận động và ngủ bù, cùng câu so sánh phủ
    định bỏ lửng ''Đâu phải chúng ta đang ở dưới nước trong một chiếc tàu ngầm…''."]'
