choices:
- segment_id: YS-LN06/Text/part0015.html/p000114
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật ngôi thứ ba; ''staff officers''
    -> ''Các sĩ quan tham mưu''; giữ phủ định ''chẳng nề hà vất vả''; không có chữ
    nghiêng."]'
- segment_id: YS-LN06/Text/part0015.html/p000115
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*Đây là trái tim của
    Lục quân Đế quốc vĩ đại và đáng gờm thuộc về Đế quốc, vương miện của thế giới.
    Nơi đây kết tinh trí tuệ và tầm nhìn xa trông rộng*'' khớp chính xác với thẻ em
    trong XHTML theo DEC-P01-002; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''the
    Reich'' -> ''Đế quốc''."]'
- segment_id: YS-LN06/Text/part0015.html/p000116
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''staff officers'' -> ''các sĩ quan tham
    mưu''; giữ sự đối lập giữa vẻ ngoài lịch lãm dựng lên làm cảnh và bản chất khá
    thô lỗ."]'
- segment_id: YS-LN06/Text/part0015.html/p000117
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & hình ảnh ẩn dụ: ''fog of war'' -> ''màn sương mù chiến
    tranh''; giữ trọn chuỗi hình ảnh vắt kiệt óc, quằn quại đối mặt núi tài liệu và
    tuyệt vọng mò mẫm tìm giải pháp."]'
- segment_id: YS-LN06/Text/part0015.html/p000118
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tình thái: chỉ bọc ''*thông thường*'' khớp
    với thẻ em trong XHTML theo DEC-P01-002; giữ thành phần chêm xen ''—tức là mức
    tối thiểu—'' và tình thái giới hạn ''chỉ có thể là dấu hiệu của nguy cơ''."]'
- segment_id: YS-LN06/Text/part0015.html/p000119
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: câu hỏi cảm thán ''Ildoa đang động viên ư?!'';
    không có chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0015.html/p000120
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & hình ảnh so sánh: ''signal guns'' -> ''pháo hiệu'';
    ''General Staff Office'' -> ''Văn phòng Bộ Tổng tham mưu''; giữ ẩn dụ cơn bão
    và tâm bão."]'
- segment_id: YS-LN06/Text/part0015.html/p000121
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: giữ câu hỏi phủ định cảm thán ''Không hề có
    thông báo trước nào sao?!''."]'
- segment_id: YS-LN06/Text/part0015.html/p000122
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: giữ câu khẳng định phủ định ''Đợt này không
    nằm trong lịch trình diễn tập định kỳ của họ!''."]'
- segment_id: YS-LN06/Text/part0015.html/p000123
  kind: terminology_and_voice
  value: 'choices=["Thoại & đối tượng câu hỏi: giữ đúng câu hỏi xác định đơn vị ''Những
    đơn vị nào đang di chuyển?!''."]'
- segment_id: YS-LN06/Text/part0015.html/p000124
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: dùng đại từ ngang hàng ''Anh'' giữa các sĩ
    quan tham mưu; ''unannounced mobilization exercise'' -> ''một cuộc diễn tập động
    viên không báo trước''."]'
- segment_id: YS-LN06/Text/part0015.html/p000125
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mốc thời gian: ''Kingdom of Ildoa'' -> ''Vương quốc
    Ildoa''; ''large-scale mobilization exercise'' -> ''cuộc diễn tập động viên quy
    mô lớn''; ''by February 1'' -> ''trước ngày mùng 1 tháng 2''; ''Imperial Army
    General Staff'' -> ''Bộ Tổng tham mưu Lục quân Đế quốc''."]'
- segment_id: YS-LN06/Text/part0015.html/p000126
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''mobilization exercise'' -> ''cuộc diễn
    tập động viên''; ''field exercises'' -> ''diễn tập dã chiến''; ''supposedly''
    -> ''theo lời họ thì''; giữ quan hệ chuyển ý ''nhưng tất cả những chuyện này đều
    là thông tin hoàn toàn mới mẻ đối với các sĩ quan tham mưu''."]'
- segment_id: YS-LN06/Text/part0015.html/p000127
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Chuyện này thật phi lý!*'' khớp
    chính xác với thẻ em trong XHTML theo DEC-P01-002; phần còn lại giữ chữ thường."]'
- segment_id: YS-LN06/Text/part0015.html/p000128
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu & dấu câu: giữ dấu hai chấm và nhận định tóm lược
    ''Nói ngắn gọn: Họ đã bị sang chấn tâm lý.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000129
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: dùng đại từ ngôi thứ nhất số nhiều bao gộp ''Chúng
    ta''; giữ câu hỏi cảm thán về nguy cơ bị đánh thốc vào sườn lần nữa."]'
- segment_id: YS-LN06/Text/part0015.html/p000130
  kind: terminology_and_voice
  value: 'choices=["Thoại, dấu câu & thuật ngữ: giữ dấu gạch ngang bỏ lửng ''Thật
    không thể—!''; ''Intelligence'' -> ''Bên Tình báo''."]'
- segment_id: YS-LN06/Text/part0015.html/p000131
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Imperial Army General Staff'' -> ''Bộ
    Tổng tham mưu Lục quân Đế quốc''; ''François Republic'' -> ''Cộng hòa François'';
    giữ mệnh đề phủ định ''một đối thủ mà họ không ngờ sẽ tham chiến''."]'
- segment_id: YS-LN06/Text/part0015.html/p000132
  kind: terminology_and_voice
  value: 'choices=["Phủ định & quan hệ nhân quả: giữ cấu trúc so sánh phủ định ''không
    ai hiểu rõ... hơn các sĩ quan tham mưu'' và phủ định khả năng ''họ không tài nào
    giữ được bình tĩnh khi xem xét tình hình ở phía nam''."]'
- segment_id: YS-LN06/Text/part0015.html/p000133
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: bọc toàn bộ câu hỏi nội tâm tập thể
    ''*Chúng đã lừa chúng ta sao?*'' khớp với thẻ em trong XHTML theo DEC-P01-002;
    dùng ''Chúng'' cho đối phương và ''chúng ta'' cho phía Đế quốc."]'
- segment_id: YS-LN06/Text/part0015.html/p000134
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, dấu câu & quan hệ nhân quả: trần thuật ngôi thứ ba
    dùng đại từ phản thân ''mình'' và ''họ'' cho các sĩ quan tham mưu; giữ dấu chấm
    lửng ''…'' và chuỗi nhân quả dẫn tới ''một vòng luẩn quẩn''."]'
- segment_id: YS-LN06/Text/part0015.html/p000135
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Imperial Army staff officers'' -> ''các
    sĩ quan tham mưu Lục quân Đế quốc''; giữ nét nghĩa phủ định ''chẳng hề xứng với''."]'
- segment_id: YS-LN06/Text/part0015.html/p000136
  kind: terminology_and_voice
  value: 'choices=["Thoại & điểm nhìn: trong lời thoại Zettour xưng ''Tôi'', giữ phủ
    định ''không chịu nổi khi phải nhìn cảnh này nữa''; trần thuật gọi Zettour là
    ''người bạn đáng kính của một vị sĩ quan''."]'
- segment_id: YS-LN06/Text/part0015.html/p000137
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: cấp trên quát đám sĩ quan tham mưu bằng ''Cả
    lũ các anh''; ''war college'' -> ''trường đại học quân sự''."]'
- segment_id: YS-LN06/Text/part0015.html/p000138
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & điểm nhìn: ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; trần thuật ngôi thứ ba."]'
- segment_id: YS-LN06/Text/part0015.html/p000139
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Zettour gọi ''Các sĩ quan tham mưu các anh'';
    ''braid'' -> ''Sợi dây biểu chương''."]'
- segment_id: YS-LN06/Text/part0015.html/p000140
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Trung tướng von Zettour bằng ''ông'';
    ''staffers'' -> ''các sĩ quan tham mưu''."]'
- segment_id: YS-LN06/Text/part0015.html/p000141
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Rudersdorf xưng ''tôi'' và gọi
    đồng cấp Zettour là ''ông'', dùng ''chúng ta'' khi giao việc cho toàn phòng; ''Lieutenant
    General von Rudersdorf'' -> ''Trung tướng von Rudersdorf''; ''Ildoan Army'' ->
    ''Quân đội Ildoa''; giữ câu hỏi phủ định ở cuối đoạn."]'
- segment_id: YS-LN06/Text/part0015.html/p000142
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Operations staffers'' -> ''các sĩ quan tham mưu Cục
    Tác chiến''."]'
- segment_id: YS-LN06/Text/part0015.html/p000143
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện – kết quả: giữ cấu trúc ''Một khi đã được chỉ
    bảo phải làm gì... liền phát huy tác dụng, giúp họ hoàn thành chức trách của mình''."]'
- segment_id: YS-LN06/Text/part0015.html/p000144
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & quân hàm: sĩ quan báo cáo xưng ''Chúng tôi''
    và dùng ''sĩ quan của ta''; ''ASAP'' -> ''càng sớm càng tốt''; ''Ildoan army''
    -> ''đạo quân Ildoa''; ''General Igor Gassman'' -> ''Tướng Igor Gassman''."]'
- segment_id: YS-LN06/Text/part0015.html/p000145
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & câu hỏi: ''General Gassman?'' -> ''Tướng Gassman ư?''."]'
- segment_id: YS-LN06/Text/part0015.html/p000146
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & câu hỏi phủ định: ''General Calderoni'' -> ''Tướng
    Calderoni''; giữ câu hỏi phủ định ''Không phải Tướng Calderoni ở khu vực phía
    bắc sao?''."]'
- segment_id: YS-LN06/Text/part0015.html/p000147
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & điểm nhìn: giữ nguyên tên riêng ''Zettour'' và ''Rudersdorf''
    trong trần thuật ngôi thứ ba."]'
- segment_id: YS-LN06/Text/part0015.html/p000148
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái & phủ định: chỉ bọc ''*Hửm?*'' khớp
    chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ tình thái suy đoán phủ
    định ''có lẽ chưa từng nghe nói đến người đàn ông này bao giờ'' và quy chiếu Rudersdorf
    bằng ''ông''."]'
- segment_id: YS-LN06/Text/part0015.html/p000149
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đại từ: giữ khẳng định nhấn mạnh phủ định ''Mà tất
    nhiên là họ chưa từng nghe tên ông ta bao giờ rồi.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000150
  kind: terminology_and_voice
  value: 'choices=["Phủ định & cấu trúc so sánh: giữ phủ định ''không thể nhớ ra cái
    tên ấy ngay lập tức'', quy chiếu Zettour bằng ''ông'' và giữ cấu trúc so sánh
    ''không giống một quân nhân cho lắm, mà giống một chính khách chỉ đơn thuần khoác
    lên người bộ quân phục hơn''."]'
