- segment_id: YS-LN06/Text/part0008.html/p000117
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi suy luận trong thoại: Tanya gọi Serebryakov
    là ''cô'', quy chiếu binh lính bằng ''họ''; giữ câu hỏi xác nhận ''Vậy ý cô là
    sẽ tốt hơn nếu cho họ ra ngoài vận động rèn luyện?''."]'
- segment_id: YS-LN06/Text/part0008.html/p000118
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đối lập mùa: Serebryakov xưng ''tôi'', dùng ''chúng
