    Liên bang''; ''Service Corps'' -> ''Cục Quân vụ''; ''General von Zettour'' ->
    ''Tướng von Zettour''; ''cold-weather gear'' -> ''trang bị chống rét''."]'
- segment_id: YS-LN06/Text/part0008.html/p000125
