    hiện."]'
- segment_id: YS-LN06/Text/part0008.html/p000123
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái dự báo: Serebryakov xưng ''Tôi'' kèm ''ạ'';
