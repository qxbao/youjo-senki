choices:
- segment_id: YS-LN06/Text/part0027.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & thuật ngữ: giữ định dạng viết hoa toàn bộ ''THÁNG
    TƯ, NĂM THỐNG NHẤT 1927, LÃNH THỔ CỰU LIÊN MINH HIỆP ƯỚC, DOANH TRẠI ĐỒN TRÚ CỦA
    KAMPFGRUPPE SALAMANDER''."]'
- segment_id: YS-LN06/Text/part0027.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''the Empire'' -> ''Đế quốc''; ''combined
    Federation-Commonwealth forces'' -> ''lực lượng liên hợp Liên bang – Khối Thịnh
    vượng chung''; ''former Entente Alliance territory'' -> ''lãnh thổ cựu Liên minh
    Hiệp ước''; ''Norden'' -> ''Norden''; giữ tình thái phỏng đoán ''dường như tuyết
    cuối cùng cũng sắp sửa bắt đầu tan''."]'
- segment_id: YS-LN06/Text/part0027.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ, phủ định, nhân quả & thuật ngữ: ''Kampfgruppe'' ->
    ''Kampfgruppe''; ''Imperial Army authorities'' -> ''giới chức Lục quân Đế quốc'';
    ''cleanup operation'' -> ''chiến dịch truy quét''; ''partisans'' -> ''quân du
    kích''; giữ quan hệ nhượng bộ ở câu đầu, phủ định ''không đủ linh hoạt trong tình
    thế ngặt nghèo'' và quan hệ nhân quả ''Bởi vậy, bên cạnh việc... còn phải gánh
    thêm...''."]'
- segment_id: YS-LN06/Text/part0027.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & phủ định: ''Lieutenant Colonel Tanya von Degurechaff''
    -> ''Trung tá Tanya von Degurechaff''; quy chiếu Tanya trong trần thuật bằng ''nó''
    theo DEC-P01-001; giữ phủ định ''cũng không phải ngoại lệ'' và cụm điều kiện nhượng
    bộ ''dù muốn hay không''."]'
- segment_id: YS-LN06/Text/part0027.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: giữ dấu ba chấm mở đầu và đại từ gộp ''chúng ta''
    trong lời tự nhủ của Tanya về mệnh lệnh quá xa rời thực tế."]'
- segment_id: YS-LN06/Text/part0027.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    ''regular army'' -> ''quân đội chính quy''; ''partisans who don’t fight'' -> ''đám
    du kích không chịu giao chiến''; giữ dấu chấm phẩy giải thích."]'
- segment_id: YS-LN06/Text/part0027.html/p000007
  kind: terminology_and_voice
  value: 'choices=["So sánh ẩn dụ: giữ câu cảm thán ngắn ''Thật vô ích biết bao.''
    và hình ảnh so sánh ''dùng búa máy hơi nước để đập vỡ hạt óc chó''."]'
- segment_id: YS-LN06/Text/part0027.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Giả định, đối lập & thuật ngữ: ''cost performance'' -> ''hiệu
    quả chi phí'' (P04-cost-performance); ''civilian police'' -> ''cảnh sát dân sự'';
    ''occupied territory'' -> ''vùng lãnh thổ bị chiếm đóng''; giữ sắc thái giả định
    ''Giải pháp đúng ra phải...'' và vế đối lập ''Thế nhưng... khả năng điều đó thành
    hiện thực là rất thấp''."]'
- segment_id: YS-LN06/Text/part0027.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: giữ cấu trúc phủ định ''Đây không phải chuyện
    những người ngoài thực địa có thể tự mình khắc phục được.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: quy chiếu Tanya trong trần thuật
    bằng ''nó'' và phản thân ''mình'' theo DEC-P01-001; giữ đại từ giả định khái quát
    ''bạn''; chỉ bọc ''*Thế này thì không ổn*'' khớp chính xác với thẻ em trong XHTML
    theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0027.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nhượng bộ & phủ định kép: quy chiếu Tanya bằng ''Nó /
    nó''; giữ mệnh đề nhượng bộ ''Dù đã kìm được mình khỏi cảnh ôm đầu tuyệt vọng...''
    và phủ định kép ''vẫn không khỏi ngán ngẩm trước sự phi lý của cách bố trí này''."]'
- segment_id: YS-LN06/Text/part0027.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Tanya bằng ''Nó''; giữ câu ngắn ''Nó
    nén tiếng thở dài vào trong lòng.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Điều kiện phủ định & đại từ: quy chiếu Tanya bằng ''nó''; giữ
    cấu trúc điều kiện phủ định ''Nếu không thể trốn chạy, nó đành phải đối diện với
    thực tại.'' và câu kết ''Chi bằng cứ đón nhận nó luôn cho rồi.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo & thuật ngữ: ''1079th Aerial Mage Company'' -> ''Đại
    đội Pháp sư Trên không số 1079''; ''enemy partisan unit'' -> ''một toán quân du
    kích địch''; ''sector B-15'' -> ''khu vực B-15''; giữ văn phong báo cáo ngắn gọn."]'
- segment_id: YS-LN06/Text/part0027.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo & thuật ngữ: ''Sixteenth Division’s checkpoint''
    -> ''trạm kiểm soát của Sư đoàn 16''; ''our Kampfgruppe’s motorcycles'' -> ''xe
    mô tô của Kampfgruppe chúng ta''; ''military police'' -> ''quân cảnh''."]'
- segment_id: YS-LN06/Text/part0027.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Phủ định mức độ: giữ cấu trúc phủ định nhấn mạnh ''Bản thân các
    báo cáo hoàn toàn chẳng có gì căng thẳng.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000017
  kind: terminology_and_voice
  value: 'choices=["So sánh & thuật ngữ: ''encounter battles'' -> ''những trận tao
    ngộ chiến''; ''brigade- or regiment-size units'' -> ''các đơn vị quy mô cấp lữ
    đoàn hay trung đoàn''; giữ sự tương phản với chiến trường miền đông khắc nghiệt."]'
- segment_id: YS-LN06/Text/part0027.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: quy chiếu Tanya bằng ''nó''
    và phản thân ''mình''; chỉ bọc ''*Thật yên bình quá đỗi*'' giữa cặp dấu gạch ngang
    dài khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; ''pseudo-coffee''
    -> ''thứ cà phê giả''; ''garrison- and coastal-defense units'' -> ''đơn vị đồn
    trú và phòng thủ bờ biển''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe Salamander'';
    giữ bước ngoặt nhận thức sau dấu gạch ngang dài cuối đoạn."]'
- segment_id: YS-LN06/Text/part0027.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Phủ định & ẩn dụ: giữ hình ảnh ''một kiểu vũng lầy'' và câu nhận
    định phủ định ''Việc để tổ chức quân đội chạy đôn chạy đáo ngoài này chỉ nhằm
    bắt một nhúm người hoàn toàn chẳng bình thường chút nào.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đại từ & đối lập: giữ đại từ tự quy chiếu nội
    tâm của Tanya ''mình'' theo DEC-P01-001 (''Nói rằng mình đã lường trước chuyện
    này thì có lẽ hơi tàn nhẫn'') và vế đối lập ''nhưng phản ứng chung là nỗi khổ
    sở''."]'
- segment_id: YS-LN06/Text/part0027.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm: giữ câu chuyển ý ngắn gọn ''Cứ nói thẳng ra
    đi.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Thoại & ẩn dụ: giữ hình ảnh so sánh trong lời lẩm bẩm của Tanya
    ''“Chuyện này chẳng khác nào dùng dao phay để lọc xương gà.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Thoại & quân hàm: ''Colonel?'' (Serebryakov hỏi Tanya) -> ''“Thưa
    Trung tá?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô, quân hàm, phủ định & câu hỏi: trần thuật dùng
    tên ''Tanya'' và phản thân ''mình'', ''her considerate adjutant'' -> ''viên sĩ
    quan phụ tá chu đáo của mình''; trong thoại Tanya xưng ''Tôi'', gọi Serebryakov
    là ''Trung úy / cô''; giữ câu hỏi có phủ định ''việc đám du kích chưa lộ diện
    từ khu đô thị có ý nghĩa gì?''."]'
- segment_id: YS-LN06/Text/part0027.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ từ đáp ngơ ngác lễ phép của Serebryakov ''“Dạ?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Thoại, đối lập & thuật ngữ: giữ dấu ba chấm mở đầu, phép đối câu
    ngắn ''Trong thành phố thì yên bình. Ngoài thôn quê thì giao tranh.'', dấu gạch
    ngang dài và thuật ngữ ''urban war'' -> ''chiến tranh đô thị''; quy chiếu đám
    du kích bằng ''chúng''."]'
- segment_id: YS-LN06/Text/part0027.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Liệt kê lịch sử & thuật ngữ: ''French Revolution'' -> ''Cách mạng
    Pháp''; ''modern rebellions'' -> ''các cuộc nổi loạn thời cận đại''; ''violent
    proletariat revolution'' -> ''cuộc cách mạng vô sản bạo lực''; giữ điệp cấu trúc
    liệt kê dẫn chứng lịch sử."]'
- segment_id: YS-LN06/Text/part0027.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, quân hàm & phủ định: quy chiếu Tanya bằng ''nó'';
    ''Her adjutant'' -> ''Viên sĩ quan phụ tá... của nó''; ''First Lieutenant Serebryakov''
    -> ''Trung úy Serebryakov''; giữ câu hỏi phủ định ''không hiểu ra ư?'' và câu
    phủ định bỏ lửng ''đâu có ngốc, nhưng…''."]'
- segment_id: YS-LN06/Text/part0027.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm & xưng hô: Tanya xưng ''Tôi'', gọi Serebryakov
    là ''cô'' và ''Trung úy''; giữ giọng chỉ dạy của cấp trên."]'
- segment_id: YS-LN06/Text/part0027.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô quân đội: ''Yes, ma’am.'' -> ''“Rõ, thưa Trung
    tá.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ, phủ định & thuật ngữ: Tanya dùng đại từ ''Chúng
    ta / chúng ta''; ''partisans'' -> ''quân du kích''; ''cleaning up militia'' ->
    ''truy quét dân quân''; ''local gangs or mafia'' -> ''các băng nhóm địa phương
    hoặc mafia''; giữ đối lập phủ định ''Nhưng khó mà gọi việc chúng ta đang làm là
    truy quét dân quân được.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điểm nhìn nội tâm, phủ định & câu hỏi: giữ cách kéo dài
    chữ trong thoại ''“V…âng ạ,”''; trong trần thuật quy chiếu Tanya bằng ''nó'' và
    Serebryakov bằng ''Cô''; trong câu hỏi nội tâm cuối đoạn giữ đại từ gộp ''chúng
    ta'' và phủ định ''rằng chúng ta đang không phải đối mặt với một tổ chức quân
    sự cơ chứ?''."]'
- segment_id: YS-LN06/Text/part0027.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Thoại & tên nhân vật: giữ tên gọi thân mật ''Visha'' và mệnh lệnh
    nhắc nhở ''“Visha, động não một chút đi.”''."]'
