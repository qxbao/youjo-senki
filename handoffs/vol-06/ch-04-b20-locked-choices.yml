- segment_id: YS-LN06/Text/part0021.html/p000133
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng đại từ ''Nó'' cho Tanya."]'
- segment_id: YS-LN06/Text/part0021.html/p000134
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: giữ tên ''Serebryakov'', ''Weiss'',
