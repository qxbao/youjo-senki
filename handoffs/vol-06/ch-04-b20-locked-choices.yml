    cấp dưới)."]'
- segment_id: YS-LN06/Text/part0021.html/p000128
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán bất ngờ của Weiss: ''“Hả?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000129
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger hỏi Weiss: xưng ''Tôi - Cậu'', giữ cụm ''một sĩ quan
    ngoài thực địa''."]'
- segment_id: YS-LN06/Text/part0021.html/p000130
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: quy chiếu Uger bằng ''Anh ấy'' (phản thân ''mình''),
