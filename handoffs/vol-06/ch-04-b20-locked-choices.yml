    trẻ."]'
- segment_id: YS-LN06/Text/part0021.html/p000125
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Uger: tự xưng ''tôi'', dùng ngôi gộp ''chúng ta'',
