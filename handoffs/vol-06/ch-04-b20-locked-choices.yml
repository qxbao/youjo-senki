    không phải của Trung tá Tanya von Degurechaff''."]'
- segment_id: YS-LN06/Text/part0021.html/p000131
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng ''nó'' cho Tanya (''Người thuộc
