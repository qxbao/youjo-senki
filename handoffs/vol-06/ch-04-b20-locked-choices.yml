- segment_id: YS-LN06/Text/part0021.html/p000135
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss trình bày quan điểm: tự xưng ''tôi'', giữ cấu trúc
    giả định lựa chọn giữa hai vế (có phủ định ''không phải hy sinh thêm bất kỳ điều
