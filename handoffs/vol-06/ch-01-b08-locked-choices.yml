    sự hài lòng khi nghe thấy''."]'
- segment_id: YS-LN06/Text/part0008.html/p000281
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái trong thoại: Tanya xưng ''tôi'', quy chiếu
    binh lính bằng ''họ''; giữ tình thái quá khứ ''tôi đã lường trước là chuyện đó
