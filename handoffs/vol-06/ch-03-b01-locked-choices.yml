    dùng Markdown nhấn mạnh."]'
- segment_id: YS-LN06/Text/part0015.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đối lập & thuật ngữ: trần thuật khách quan mở đầu chương;
    ''Imperial Army'' -> ''Lục quân Đế quốc''; ''Federation Army'' -> ''Quân đội Liên
    bang''; ''offensive'' -> ''cuộc tiến công''; giữ tương phản ''tuy khiêm tốn nhưng
    đầy ý nghĩa trên khắp các mặt trận'' và mệnh đề nhượng bộ thời gian ở câu sau."]'
- segment_id: YS-LN06/Text/part0015.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Tình thái, đối lập & thuật ngữ: giữ tình thái mở đầu ''Có thể
    nói''; ''Council for Self-Government'' -> ''Hội đồng Tự trị''; ''Federation''
    -> ''Liên bang''; ''separatists'' -> ''phe ly khai''; ''invading Imperial Army''
    -> ''đạo Lục quân Đế quốc đang xâm lược''; giữ đối lập giữa định kiến ''vốn bị
    xem là một con rối'' và thực tế ''làm được nhiều hơn bất kỳ ai từng mong đợi''."]'
- segment_id: YS-LN06/Text/part0015.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ, nhân quả & thuật ngữ: ''Federation authorities'' ->
    ''nhà cầm quyền Liên bang''; ''a bolt from the blue'' -> ''tiếng sét giữa trời
    quang''; ''propaganda broadcasts'' -> ''Các chương trình phát thanh tuyên truyền'';
    giữ quan hệ nhân quả việc im bặt lộ liễu phơi bày mức độ gây chấn động của tin
    tức."]'
- segment_id: YS-LN06/Text/part0015.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, câu hỏi giả định & thuật ngữ: giữ dấu chấm lửng sau ''Lục
    quân Đế quốc…'' và cấu trúc phủ định bộ phận ''tác động không nhỏ''; ''Council
    for Self-Government'' -> ''Hội đồng Tự trị''; ''Imperial Army'' -> ''Lục quân
    Đế quốc''; ''the Empire'' -> ''Đế quốc''; ''dividing and conquering'' -> ''chia
    để trị''; giữ hai câu hỏi giả định đối lập về động cơ của Đế quốc và câu kết ''Có
    nhiều cách diễn giải khác nhau.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ phủ định: giữ mệnh đề nhượng bộ kèm phủ định ''dù chẳng
    có căn cứ nào cho điều đó''."]'
- segment_id: YS-LN06/Text/part0015.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quy chiếu logic: ''the principal belligerents'' ->
    ''các nước tham chiến chính''; giữ quy chiếu chính xác vào giả thuyết thứ hai
    (''trường hợp thứ hai'') và mức độ ''khá lo lắng''."]'
- segment_id: YS-LN06/Text/part0015.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ phiếm chỉ, tình thái & thuật ngữ: dùng đại từ
    phiếm chỉ ''Người ta'' cho ''You'' trong mạch bình luận chiến lược; ''attrition''
    -> ''sự tiêu hao''; giữ tính tất yếu ''không sao tránh khỏi'', mức độ ''lớn đến
    mức không thể đong đếm'' và tình thái giới hạn ''có lẽ thứ duy nhất còn sót lại...
    sẽ chỉ là mặt đất ngổn ngang gạch vụn''."]'
- segment_id: YS-LN06/Text/part0015.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''principal belligerent countries'' -> ''các
    quốc gia tham chiến chính''; ''zero-sum game'' -> ''trò chơi có tổng bằng không'';
    ''played out of pocket'' -> ''mà chính họ phải bỏ tiền túi ra chi trả''; giữ câu
    cảm thán phủ định ''Đã vậy, chiến thắng thậm chí còn chẳng được bảo đảm!'' và
    cấu trúc đảo ngữ phủ định hạn định ''Hiếm có điều gì khiến người ta lo âu nhiều
    như một kết cục bất định.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Phủ định, đại từ phiếm chỉ & thuật ngữ: ''the Empire'' -> ''Đế
    quốc''; ''utilitarian'' -> ''người theo thuyết vị lợi''; giữ đại từ phiếm chỉ
    ''người ta'' đồng bộ với p000008–p000009 và cấu trúc phủ định điều kiện ''chẳng
    cần phải là một người theo thuyết vị lợi, người ta cũng phải than khóc trước cái
    giá của cuộc chiến''."]'
