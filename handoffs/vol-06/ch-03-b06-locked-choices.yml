choices:
- segment_id: YS-LN06/Text/part0017.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Zettour xưng ''tôi'', gọi ''General
    Igor Gassman'' là ''Tướng Igor Gassman'' và quy chiếu bằng ''Ông ta''; ''part
    of the administration'' -> ''thuộc ngạch hành chính''; ''Ildoan central command''
    -> ''bộ tư lệnh trung ương của Ildoa''; giữ mức độ phủ định ''hầu như chẳng mấy
    khi ra thực địa tác chiến, phải không?''; không có chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0017.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: sĩ quan tham mưu đáp lời Trung tướng von Zettour bằng
    ''Đúng vậy, thưa Trung tướng.''; không có chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0017.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật ngôi thứ ba quy chiếu
    Gassman bằng ''Vị tướng này'' / ''ông ta''; giữ mệnh đề phủ định mức độ ''Zettour
    thậm chí còn chẳng chắc đó có phải là người thật hay không'' và cấu trúc so sánh
    ''hợp với công việc hành chính hơn là chiến trận''."]'
- segment_id: YS-LN06/Text/part0017.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & tăng tiến: giữ quan hệ nhượng bộ ''dù đó
    là một vị tướng trong quân đội của một nước đồng minh'' và cấu trúc giả định phủ
    định tăng tiến ''nếu ngay cả những chuyên gia ở hậu phương như Zettour cũng không
    thể nhớ ra ông ta ngay lập tức thì lại càng tệ hơn''."]'
- segment_id: YS-LN06/Text/part0017.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Rudersdorf xưng ''tôi''; ''General Gassman''
    -> ''Tướng Gassman''; ''Operations'' -> ''Cục Tác chiến''; ''chain of command''
    -> ''hệ thống chỉ huy''; ''mobilized Ildoan forces'' -> ''lực lượng Ildoa vừa
    được động viên''."]'
- segment_id: YS-LN06/Text/part0017.html/p000006
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & quan hệ chuyển ý: trần thuật ngôi thứ ba; giữ sự
    đối lập giữa trạng thái đang chìm vào suy tư và phản ứng sực tỉnh khi nghe giọng
    Rudersdorf.'']'
- segment_id: YS-LN06/Text/part0017.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & thuật ngữ: ''Zettour supposed'' -> ''Zettour
    thầm nghĩ''; ''Operations'' -> ''Cục Tác chiến''; giữ trọn nội dung đánh giá về
    truyền thống xử lý linh hoạt mọi tình huống."]'
- segment_id: YS-LN06/Text/part0017.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & câu hỏi lựa chọn: ''General Gassman'' -> ''Tướng Gassman'';
    ''General Calderoni'' -> ''Tướng Calderoni''; giữ dấu chấm lửng mở đầu và hai
    câu hỏi đối chiếu người trực tiếp chỉ đạo diễn tập."]'
- segment_id: YS-LN06/Text/part0017.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, quân hàm & sắc thái lễ phép: ''General Calderoni''
    -> ''Tướng Calderoni''; ''chief aide-de-camp'' -> ''sĩ quan phụ tá trưởng''; ''senator''
    -> ''thượng nghị sĩ''; ''Senate'' -> ''Thượng viện''; quy chiếu Calderoni bằng
    ''ông ta'' và dùng tiểu từ ''ạ'' cuối câu báo cáo."]'
- segment_id: YS-LN06/Text/part0017.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: mệnh lệnh ngắn ''Nói tiếp đi.''; ''officers
    from Operations'' -> ''các sĩ quan thuộc Cục Tác chiến''."]'
- segment_id: YS-LN06/Text/part0017.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tình thái dè dặt ''Có vẻ như'' và ''Nghe
    đâu''; ''General Gassman'' -> ''Tướng Gassman''; ''general director of the exercises''
    -> ''tổng đạo diễn cuộc diễn tập''; ''inspection'' -> ''đợt thị sát''; ''our attaché
    in Ildoa'' -> ''tùy viên quân sự của ta tại Ildoa''."]'
- segment_id: YS-LN06/Text/part0017.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi: dùng đại từ bao gộp ''Chúng ta''; giữ dấu chấm
    lửng đầu câu và câu hỏi xác minh số lượng đơn vị tham gia đợt động viên."]'
- segment_id: YS-LN06/Text/part0017.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: cấp dưới trao tài liệu cho cấp trên bằng
    ''Vâng, xin gửi ngài.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật ngôi thứ ba; ''printout'' ->
    ''bản in''."]'
- segment_id: YS-LN06/Text/part0017.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán & thuật ngữ: giữ tình thái suy đoán ''hẳn...
    đã phải gửi về'' và ''có lẽ đã bắt tay vào gõ''; ''attaché at the embassy'' ->
    ''viên tùy viên tại đại sứ quán''."]'
- segment_id: YS-LN06/Text/part0017.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Văn phong điện báo & thuật ngữ: giữ lối viết bản tin ngắn không
    dấu chấm kết câu ''Ildoa đã ban bố lệnh động viên''."]'
- segment_id: YS-LN06/Text/part0017.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Văn phong điện báo & dấu câu: giữ nguyên cấu trúc ngắt nhịp bằng
    dấu phẩy và số lượng ''Quy mô, bốn trăm, tiểu đoàn, đã nhận thông báo''."]'
- segment_id: YS-LN06/Text/part0017.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Văn phong điện báo & quân hàm: giữ lối ngắt dấu phẩy ''Chỉ huy,
    Tướng Igor Gassman''."]'
- segment_id: YS-LN06/Text/part0017.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Văn phong điện báo: giữ câu thông báo ngắn gọn không dấu chấm
    cuối ''Chi tiết sẽ gửi ngay khi duy trì được đường truyền''."]'
- segment_id: YS-LN06/Text/part0017.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhượng bộ: ''worst-case scenario'' -> ''kịch
    bản tồi tệ nhất''; ''the attaché'' -> ''viên tùy viên''; giữ mệnh đề nhượng bộ
    ''dù phải gửi về một cách nhỏ giọt'' và đại từ ''Họ'' chỉ phía tùy viên/đại sứ
    quán."]'
- segment_id: YS-LN06/Text/part0017.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & giả định: ''mobilization exercise'' ->
    ''cuộc diễn tập động viên''; giữ tình thái ''có lẽ họ cũng sẽ sớm nhận được thêm
    thông tin chi tiết'' và câu điều kiện ''Nếu có vấn đề gì, thì đó là việc giải
    đoán thông tin này rất khó khăn''."]'
- segment_id: YS-LN06/Text/part0017.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: câu hỏi quy đổi quy mô đơn vị ''Chừng đó tương
    đương bao nhiêu sư đoàn?''."]'
- segment_id: YS-LN06/Text/part0017.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & số lượng: sĩ quan xưng ''Tôi'', giữ tình
    thái ước lượng ''Tôi nghĩ là khoảng hai mươi lăm sư đoàn theo quy mô biên chế
    của ta.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000024
  kind: terminology_and_voice
  value: 'choices=[''Thoại & trần thuật: giữ câu hỏi xác nhận quy mô động viên tối
    đa thời bình của Ildoa và nhận định trần thuật về câu hỏi của Rudersdorf.'']'
- segment_id: YS-LN06/Text/part0017.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Imperial Army officers'' -> ''Các sĩ quan
    Lục quân Đế quốc''; ''Royal Ildoan Army'' -> ''Lục quân Hoàng gia Ildoa''; giữ
    phủ định ''không mấy am hiểu'' và ''chẳng còn cách nào khác ngoài việc phải''."]'
- segment_id: YS-LN06/Text/part0017.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & tình thái: dùng ''chúng ta''; giữ phủ định
    mức độ kết luận ''Chưa thể kết luận là Ildoa sẽ thực sự xâm lược'' và đề nghị
    ''nhưng hãy cân nhắc các biện pháp phòng ngự đi''."]'
- segment_id: YS-LN06/Text/part0017.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Thoại quân sự: đáp gọn ''Rõ.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ khái quát & phủ định: ''operations specialist''
    -> ''chuyên gia tác chiến''; dịch đại từ khái quát ''you'' là ''người ta''; giữ
    phủ định ''không việc gì phải tự giới hạn mình trong chuyện quản lý khủng hoảng
    cả''."]'
- segment_id: YS-LN06/Text/part0017.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & sắc thái: chỉ bọc ''*hơi*'' trong
    ''nở một nụ cười *hơi* khẩy'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002;
    Zettour xưng ''Tôi'' / ''chúng ta'' trong thoại và được quy chiếu bằng ''ông''
    ở phần trần thuật xen giữa hai dấu gạch ngang dài."]'
- segment_id: YS-LN06/Text/part0017.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & phủ định: ''Yes, sir.'' -> ''Vâng, thưa Trung
    tướng.''; ''The staffers'' -> ''Các sĩ quan tham mưu''; quy chiếu Zettour bằng
    ''ông'' và giữ phủ định ''sẽ chẳng có vấn đề gì nếu giao việc này cho họ''."]'
- segment_id: YS-LN06/Text/part0017.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & phủ định: giữ cấu trúc ''Ngay cả khi sự phản
    đối ấy không thay đổi được gì, nó vẫn sẽ được lưu vào hồ sơ là họ đã thực hiện.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''worst-case scenario'' -> ''kịch bản tồi tệ nhất'';
    giữ câu trần thuật ngắn gọn."]'
- segment_id: YS-LN06/Text/part0017.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ đơn vị: người nói xưng ''Tôi'' và dùng ''chúng
    ta''; ''Southern Army Group'' -> ''Cụm tập đoàn quân phía Nam''; ''Southern Continent
    Expeditionary Army Corps'' -> ''Quân đoàn Viễn chinh Lục địa Phía nam''."]'
