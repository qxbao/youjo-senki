- segment_id: YS-LN06/Text/part0015.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ sắc thái nhấn mạnh tiêu chuẩn vận
    hành khắt khe, nghiêm ngặt đến đáng sợ."]'
- segment_id: YS-LN06/Text/part0015.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Đại từ, so sánh & thuật ngữ: trần thuật quy chiếu Gassman bằng
    ''ông''; giữ cấu trúc tự hào bản thân giống chính khách hơn là quân nhân và thái
    độ kiêng nể, kính trọng đối với các đồng nghiệp nhà binh trong ''Lục quân Đế quốc''."]'
- segment_id: YS-LN06/Text/part0015.html/p000056
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, phủ định & thuật ngữ: Gassman gọi ''Đại tá Calandro'',
    xưng hô với cấp dưới là ''Anh'' và dùng đại từ ''chúng ta''; ''Imperial Army''
    -> ''Lục quân Đế quốc''; ''Council for Self-Government'' -> ''Hội đồng Tự trị'';
    ''Federation lines'' -> ''chiến tuyến Liên bang''; ''Imperial Army General Staff''
    -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; ''raison d’état'' -> ''lợi ích quốc
    gia tối thượng''; giữ câu hỏi dẫn chứng và phủ định mức độ ''không liều lĩnh đến
    mức tự đi chuốc lấy một mặt trận nữa''."]'
- segment_id: YS-LN06/Text/part0015.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ tính tất nhiên ''tất nhiên sẽ hành
    động sao cho tránh dẫn tới một vụ bùng nổ thô bạo'' và nhận định ''Với kỷ luật
    sắt trứ danh, hoàn toàn có thể tin tưởng rằng Lục quân Đế quốc sẽ hành xử đúng
    mực.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000058
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & thuật ngữ: giữ tình thái dự đoán ''hẳn sẽ tránh
    được mọi sự cố ngoài ý muốn'', nhận định ''nắm chắc phần thắng'', thuật ngữ ''chiến
    lược nội tuyến'', câu trần thuật chen giữa ''Đối với Gassman, điều đó là tất yếu.''
    và tình thái mở ''Biết đâu họ lại thực sự sẵn lòng lắng nghe phương án hòa giải
    của chúng ta đấy.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000059
  kind: terminology_and_voice
  value: 'choices=["Phủ định đối lập: giữ cấu trúc đối lập ngắn gọn ''Hành động dựa
    trên lý trí chứ không theo cảm xúc.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000060
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ, đại từ & thuật ngữ: giữ mệnh đề nhượng bộ ''Dẫu Đế
    quốc có miễn cưỡng ngồi vào bàn đàm phán đi chăng nữa'', đại từ ''ông'' quy chiếu
    Gassman; ''Kingdom of Ildoa'' -> ''Vương quốc Ildoa''; ''intermediary'' -> ''cầu
    nối trung gian''."]'
- segment_id: YS-LN06/Text/part0015.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Thoại đối lập: giữ phép đối lập giữa ''đổ máu trên chiến trường''
    và ''cùng nhau đổ mồ hôi trên bàn hòa đàm'' cùng đại từ ''tất cả chúng ta''."]'
- segment_id: YS-LN06/Text/part0015.html/p000062
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thoại & xưng hô: giữ hai dấu chấm lửng trong
    lời thoại ngập ngừng của Calandro và hô ngữ ''thưa Tướng quân''; chỉ bọc câu hỏi
    nội tâm ánh lên qua ánh mắt ''*Liệu mọi chuyện có thực sự suôn sẻ như vậy không?*''
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0015.html/p000063
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định khả năng: giữ cử chỉ khẽ mỉm cười phẩy tay gạt
    đi của Gassman, câu trấn an ''Đừng lo!'' và phủ định khả năng ''Thời buổi này
    làm sao còn có thể trông mong mở rộng lãnh thổ nhờ hôn nhân chính trị một cách
    hợp lý được nữa.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000064
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ nhận định ngắn gọn ''Xung đột vũ trang đẫm máu luôn
    đi kèm cái giá phải trả.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000065
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Kingdom of Ildoa'' -> ''Vương quốc Ildoa'';
    ''total war'' -> ''chiến tranh tổng lực''; giữ đánh giá phủ định dứt khoát ''chuyện
    đó là điều không thể tính tới'' và vị thế đặc thù của các quốc gia trung lập."]'
- segment_id: YS-LN06/Text/part0015.html/p000066
  kind: terminology_and_voice
  value: 'choices=["Giả định & thuật ngữ: ''normal sensibilities'' -> ''khả năng cảm
    nhận bình thường''; giữ tính tất yếu ''cũng sẽ tìm kiếm một lối thoát'' và khẳng
    định ''Chừng đó là điều hiển nhiên không cần bàn cãi.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000067
  kind: terminology_and_voice
  value: 'choices=[''Thoại & câu hỏi tu từ: giữ nhận định về lựa chọn tốt nhất của
    một quốc gia may mắn và câu hỏi tu từ bác bỏ việc tự đâm đầu vào chiến tranh ngu
    xuẩn.'']'
- segment_id: YS-LN06/Text/part0015.html/p000068
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: ''Ildoan ground forces'' -> ''lực lượng
    mặt đất Ildoa''; ''Imperial Army'' -> ''Lục quân Đế quốc''; giữ mức độ ''đồ sộ
    đến mức khó lòng tưởng tượng nổi''."]'
- segment_id: YS-LN06/Text/part0015.html/p000069
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & câu hỏi tu từ phủ định: bọc toàn
    bộ câu hỏi nội tâm bằng ''*...*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002;
    dùng đại từ ''chúng ta'' và giữ cấu trúc câu hỏi phủ định ''chẳng phải... đó sao?''."]'
- segment_id: YS-LN06/Text/part0015.html/p000070
  kind: terminology_and_voice
  value: 'choices=["Đại từ & ngữ cảnh: quy chiếu Gassman bằng ''ông'', giữ chi tiết
    từng tranh cãi với chính phủ về vấn đề ngân sách nên nhìn thoáng qua là hiểu rõ."]'
- segment_id: YS-LN06/Text/part0015.html/p000071
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ cấu trúc giới hạn ''Chiến tranh thế giới chỉ đồng nghĩa
    với những khoản chi tiêu ngất ngưởng và sự điên rồ.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000072
  kind: terminology_and_voice
  value: 'choices=[''Thời gian & câu hỏi nghi vấn: giữ mạch suy luận từ hậu quả sau
    vài năm chiến tranh, thời gian tái thiết dài không lường nổi đến câu hỏi nghi
    vấn về thời điểm những đứa trẻ sơ sinh hôm nay trưởng thành hàng chục năm sau.'']'
- segment_id: YS-LN06/Text/part0015.html/p000073
  kind: terminology_and_voice
  value: 'choices=["Thoại, điều kiện & nhượng bộ: giữ câu cảm thán mở đầu, câu điều
    kiện kèm nhượng bộ ''Nếu ai nấy đều khao khát một thứ đến thế, thì chúng ta cứ
    việc đem bán nó, cho dù thế là trục lợi đi chăng nữa!'' và lời kêu gọi tạo điểm
    chung."]'
- segment_id: YS-LN06/Text/part0015.html/p000074
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: Calandro gọi ''Thưa Tướng quân'' và đặt
    câu hỏi nghi vấn về mong muốn hòa bình thực sự của các quốc gia tham chiến."]'
- segment_id: YS-LN06/Text/part0015.html/p000075
  kind: terminology_and_voice
  value: 'choices=["Thoại, câu hỏi tu từ & nhượng bộ: giữ câu hỏi tu từ cảm thán mở
    đầu, đại từ ''Tôi'', dấu gạch ngang tự sửa lời ''hơi—không, khá là khó chào mời
    đi nữa'' và khẳng định hòa bình chắc chắn vẫn sẽ bán được."]'
- segment_id: YS-LN06/Text/part0015.html/p000076
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điệp từ: quy chiếu Gassman bằng ''Ông'', giữ lối diễn
    đạt lặp từ ''tự nhiên'' giữa câu trả lời và thái độ."]'
- segment_id: YS-LN06/Text/part0015.html/p000077
  kind: terminology_and_voice
  value: 'choices=["So sánh & thuật ngữ: giữ phép so sánh ''hiển nhiên chẳng khác
    nào một cộng một bằng hai'' và thuật ngữ logic ''tiên đề''."]'
- segment_id: YS-LN06/Text/part0015.html/p000078
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & đại từ: giữ câu hỏi của Calandro dùng đại từ ''chúng
    ta'' và cụm ''những sứ giả hòa bình''."]'
- segment_id: YS-LN06/Text/part0015.html/p000079
  kind: terminology_and_voice
  value: 'choices=[''Thoại & hình ảnh khẩu ngữ: giữ giọng hưởng ứng sôi nổi của Gassman
    và hình ảnh lấy pizza cùng mì Ý nóng hổi để cạy miệng phía Đế quốc nghe họ nói.'']'
- segment_id: YS-LN06/Text/part0015.html/p000080
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & câu hỏi trần thuật: giữ câu hỏi phản biện khéo
    của Calandro, quy chiếu Calandro bằng ''anh ta'', thuật ngữ ''sĩ quan tình báo''
    và câu hỏi kết đoạn về mức độ dè dặt của anh ta."]'
- segment_id: YS-LN06/Text/part0015.html/p000081
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & nhượng bộ: giữ nụ cười phóng khoáng của Gassman
    trước ''viên đại tá hay lo xa'', cách gọi ''Đại tá Calandro'', xưng hô ''anh''
    và mệnh đề nhượng bộ đối lập giữa cơn giận dữ bên trong với nụ cười ngoài mặt
    của người Đế quốc."]'
- segment_id: YS-LN06/Text/part0015.html/p000082
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: Calandro xưng ''tôi'', giữ dấu chấm lửng cuối
    câu than thở về việc chính mình sẽ phải đứng ra ứng phó một khi đối phương nổi
    giận."]'
- segment_id: YS-LN06/Text/part0015.html/p000083
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & điểm nhìn: Gassman xưng ''tôi'', gọi Calandro
    là ''anh'', giữ chi tiết định khép lại cuộc trò chuyện nhưng nhận ra ánh mắt lo
    âu của cấp dưới và câu hỏi chốt ''Anh thực sự phản đối chuyện này đến thế cơ à?''."]'
- segment_id: YS-LN06/Text/part0015.html/p000084
  kind: terminology_and_voice
  value: 'choices=["Thoại, dấu câu, xưng hô & thuật ngữ: giữ dấu chấm lửng mở đầu,
    thuật ngữ ''sĩ quan tình báo'', Calandro xưng ''tôi'' và gọi Gassman là ''ngài''."]'
- segment_id: YS-LN06/Text/part0015.html/p000085
  kind: terminology_and_voice
  value: 'choices=["Thoại & miêu tả: giữ câu đáp ngắn gọn ''“Tất nhiên rồi.”'' và
    hành động hào phóng gật đầu của Gassman."]'
