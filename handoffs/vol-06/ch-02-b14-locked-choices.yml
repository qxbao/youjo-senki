- segment_id: YS-LN06/Text/part0013.html/p000138
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán của Drake: ''…Chuyện này thật ngu xuẩn. Hết sức
    ngu xuẩn. Chết tiệt.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000139
  kind: terminology_and_voice
  value: 'choices=["Tình thái bắt buộc: ''in the name of humanity, it had to be done''
    -> ''nhân danh lòng nhân đạo, chuyện này buộc phải được thực hiện''."]'
- segment_id: YS-LN06/Text/part0013.html/p000140
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''on-duty guards'' -> ''đám lính gác đang làm nhiệm
