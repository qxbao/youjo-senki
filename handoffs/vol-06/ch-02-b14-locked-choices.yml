- segment_id: YS-LN06/Text/part0013.html/p000135
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế ở quá khứ: ''Normally, he would have had
    the self-control to hold off on marching into HQ until he had sobered up'' ->
    ''Bình thường, hẳn ông đã có đủ sự tự chủ để kiềm chế không xông vào sở chỉ huy
    cho đến khi tỉnh rượu''."]'
- segment_id: YS-LN06/Text/part0013.html/p000136
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tên riêng/cấp bậc: ''didn’t have the leisure of waiting''
