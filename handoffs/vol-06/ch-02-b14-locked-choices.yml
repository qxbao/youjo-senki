- segment_id: YS-LN06/Text/part0013.html/p000126
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Sailors and marine mages'' -> thống nhất
    ưu tiên ''Các thủy thủ và pháp sư hải quân đánh bộ'' (hoặc giữ nghĩa tương đương);
    ''no strangers to homesickness'' -> ''chẳng lạ lẫm gì với nỗi nhớ nhà''."]'
- segment_id: YS-LN06/Text/part0013.html/p000127
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả: ''And that was why...'' -> ''Và đó là lý do
    vì sao...''; ''sacred and inviolable'' -> ''thiêng liêng và bất khả xâm phạm''."]'
- segment_id: YS-LN06/Text/part0013.html/p000128
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''secular celebrations'' -> ''các hoạt
    động ăn mừng mang tính thế tục''; ''the Communists'' -> ''những người Cộng sản'';
    ''must have felt it was a day that shouldn’t be intruded upon'' -> ''hẳn cũng
    phải cảm thấy đây là một ngày không nên xâm phạm''."]'
- segment_id: YS-LN06/Text/part0013.html/p000129
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc trong thoại: ''Colonel'' (gọi Trung tá Drake) -> ''Thưa
