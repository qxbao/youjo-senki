- segment_id: YS-LN06/Text/part0013.html/p000105
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & xưng hô: Loria gọi người đối thoại là ''Đồng chí''
    (''Comrade''), giữ thái độ lịch sự kiểu Đảng mà không suy diễn thêm đại từ nhân
    xưng ngôi thứ hai."]'
- segment_id: YS-LN06/Text/part0013.html/p000106
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''multilayered concept'' -> ''khái niệm đa
    tầng''."]'
- segment_id: YS-LN06/Text/part0013.html/p000107
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''the party'' -> ''Đảng''; ''the Federation, their
    motherland'' -> ''Liên bang, mẫu quốc của họ''; ''the Empire'' -> ''Đế quốc'';
    ''human resource'' -> ''nguồn nhân lực''.", "Phủ định & logic: giữ đúng cấu trúc
    phủ định kép ''It wasn’t a contradiction for people disloyal...'' (''Việc những
    người bất trung với Đảng... chẳng hề mâu thuẫn chút nào'') và điều kiện ''wouldn’t
    rebel against party instructions'' (''không nổi loạn chống lại chỉ thị của Đảng'')."]'
- segment_id: YS-LN06/Text/part0013.html/p000108
  kind: terminology_and_voice
  value: 'choices=["Tình thái: ''would surely fight'' -> ''chắc chắn cũng sẽ chiến
    đấu''."]'
- segment_id: YS-LN06/Text/part0013.html/p000109
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại: ''We'' -> ''Chúng ta''; ''you'' -> ''Đồng chí''.",
    "Thuật ngữ & nhấn mạnh Markdown: ''enemy and our latent enemy'' -> ''kẻ thù của
    mình và kẻ thù tiềm tàng của mình''; giữ nguyên ''*lageri*'' có dấu nhấn mạnh
    Markdown ''*...*'' theo DEC-P01-002.", "Câu hỏi tu từ & phủ định: giữ đúng câu
    hỏi phủ định ''Don’t you think it’s more effective...?'' (''Đồng chí không nghĩ...
    sẽ hiệu quả hơn... sao?'')."]'
- segment_id: YS-LN06/Text/part0013.html/p000110
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: ''elementary logic'' -> ''logic sơ đẳng''."]'
- segment_id: YS-LN06/Text/part0013.html/p000111
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: ''cold, hard principle'' -> ''nguyên lý lạnh lùng, tàn
    nhẫn''."]'
- segment_id: YS-LN06/Text/part0013.html/p000112
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: ''eternal truth'' -> ''chân lý vĩnh cửu''."]'
- segment_id: YS-LN06/Text/part0013.html/p000113
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại & thuật ngữ: ''Our / we'' -> ''chúng ta''; ''guardians
    of nationalism'' -> ''những người bảo vệ chủ nghĩa dân tộc''; ''the party and
    the nation'' -> ''Đảng và quốc gia''."]'
- segment_id: YS-LN06/Text/part0013.html/p000114
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phủ định: ''Wasn’t that what it said in a cynic’s dictionary?''
    -> ''Chẳng phải cuốn từ điển của kẻ hoài nghi đã viết như thế hay sao?''."]'
- segment_id: YS-LN06/Text/part0013.html/p000115
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: ''Patriots'' -> ''Những người yêu nước''; ''conquerors
    and politicians'' -> ''những kẻ chinh phục và giới chính khách''."]'
- segment_id: YS-LN06/Text/part0013.html/p000116
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: ''Patriotism'' -> ''Lòng yêu nước''; ''first resort of
