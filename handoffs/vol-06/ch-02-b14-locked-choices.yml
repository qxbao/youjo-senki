  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian/địa điểm: ''NGÀY GIÁNG SINH, NĂM THỐNG NHẤT
    1926, LÃNH THỔ LIÊN BANG, DOANH TRẠI ĐỒN TRÚ CỦA LỰC LƯỢNG ĐA QUỐC GIA''."]'
- segment_id: YS-LN06/Text/part0013.html/p000118
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: ''The toast'' -> ''Lời chúc tụng''."]'
- segment_id: YS-LN06/Text/part0013.html/p000119
  kind: terminology_and_voice
  value: 'choices=["Thoại: ''Giáng sinh vui vẻ!''."]'
- segment_id: YS-LN06/Text/part0013.html/p000120
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện lặp lại: ''Hễ có ai hô vang câu đó là những
