  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & chi tiết: ''spiked eggnog'' -> ''món eggnog pha rượu'';
    ''carols'' -> ''những bài thánh ca Giáng sinh''."]'
- segment_id: YS-LN06/Text/part0013.html/p000122
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Commonwealth and Federation mages'' -> ''Các pháp
    sư Khối Thịnh vượng chung và Liên bang''; ''recon-in-force operation'' -> ''chiến
