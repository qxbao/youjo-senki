    Mikel''; tự quy chiếu ''mình''."]'
- segment_id: YS-LN06/Text/part0013.html/p000137
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: giữ nguyên dấu ''*...*''
