- segment_id: YS-LN06/Text/part0013.html/p000130
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn của Drake: ''Chuyện gì?''."]'
- segment_id: YS-LN06/Text/part0013.html/p000131
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & điểm nhìn: Drake được quy chiếu bằng ''ông''
    trong trần thuật và ''mình'' trong suy nghĩ gián tiếp; giữ đúng tương phản thời
    gian ''Trong một thoáng... nhưng ngay khoảnh khắc sau đó...''."]'
- segment_id: YS-LN06/Text/part0013.html/p000132
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: ''us'' -> ''chúng ta''; ''Federation Army''
