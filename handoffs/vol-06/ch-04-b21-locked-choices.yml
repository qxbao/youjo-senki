choices:
- segment_id: YS-LN06/Text/part0021.html/p000171
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi Uger: xưng ''tôi'', gọi Uger là ''anh'', giữ nguyên
    độ mở câu hỏi ''“Vậy là đến cả anh cũng sẽ phản bác tôi sao?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000172
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger đáp Tanya: xưng ''tôi - cô'', gọi ''Trung tá von Degurechaff'',
    giữ giả định trái thực tế ''Nếu không phải là cô, tôi đã hét toáng lên và đá văng
    ghế đi rồi'' và nhận định ''giảng hòa ngay lập tức thì quá sức phi lý''."]'
- segment_id: YS-LN06/Text/part0021.html/p000173
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Uger: xưng ''tôi - anh'', giữ khẳng định ''Cách
    duy nhất để giải quyết chuyện này mà tôi thấy chính là nền hòa bình mà anh vừa
    gọi là phi lý đấy''."]'
- segment_id: YS-LN06/Text/part0021.html/p000174
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại xen: giữ tên ''Uger'', ''Tanya'', quy chiếu
    Uger bằng ''anh ấy''; giữ câu thoại phủ định ''“Nhưng thế thì chẳng khác gì đầu
    hàng cả!”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000175
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đón đầu lập luận của Uger: dùng ngôi gộp ''chúng ta'',
    giữ thuật ngữ ''đầu hàng vô điều kiện'' và mệnh đề thời gian giả định ''một khi
    chúng ta bị xâm lược''."]'
- segment_id: YS-LN06/Text/part0021.html/p000176
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger bác bỏ: giữ mệnh lệnh phủ định ''“Đừng có nói chuyện
    nực cười thế.”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000177
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya lập luận với Uger: xưng ''tôi - anh'', dùng ngôi gộp
    ''chúng ta'', giữ ''Bộ Tổng tham mưu'', phủ định ''vẫn chưa tìm ra cách kết thúc
    cuộc chiến bằng chiến thắng trong ngắn hạn đến trung hạn'' và phủ định kép mặt
    logic ''anh không thể loại trừ khả năng kẻ địch sẽ ép buộc chúng ta phải giảng
    hòa''."]'
- segment_id: YS-LN06/Text/part0021.html/p000178
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: giữ tên ''Uger'', ''Tanya'', dùng
    đại từ ''nó'' cho Tanya và ''anh ấy'' cho Uger; giữ nhận định ''một viễn cảnh
    tương lai hoàn toàn có cơ sở''."]'
- segment_id: YS-LN06/Text/part0021.html/p000179
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng ''Nó - nó'' cho Tanya, giữ tên
    ''Uger'', quy chiếu Uger bằng ''Anh ấy - anh ấy'', giữ thuật ngữ ''trường đại
    học quân sự'' và chuỗi phủ định khẳng định năng lực của Uger (''Anh ấy tuyệt chẳng
    phải kẻ ngốc; không đời nào anh ấy lại không hiểu được điều đó'')."]'
- segment_id: YS-LN06/Text/part0021.html/p000180
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngắn: quy chiếu Uger bằng ''anh ấy'' và giữ sự tương
    phản ''Vậy mà anh ấy lại thiếu sáng suốt đến thế''."]'
- segment_id: YS-LN06/Text/part0021.html/p000181
  kind: terminology_and_voice
  value: choices=["Theo DEC-P01-002 giữ nhấn mạnh Markdown '*Vậy mà…*' đúng phạm vi
    cụm in nghiêng trong nguồn; theo DEC-P01-001 dùng 'nó' cho Tanya ở vế trần thuật;
    trong thoại gọi Uger là 'anh' và giữ nghịch lý 'ngay cả một quân nhân phản đối
    việc hy sinh cũng vẫn ngoan cố phản đối hòa bình sao'."]
- segment_id: YS-LN06/Text/part0021.html/p000182
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng ''Nó'' cho Tanya, giữ tên ''Uger''
    và đại từ ''anh ấy''; trong thoại Uger dùng ngôi gộp ''chúng ta'', gọi Tanya là
    ''Cô'', giữ ''Ở hậu phương'', ẩn dụ ''con quái vật đầy ảo tưởng và phiền phức
    kinh khủng mang tên ‘dư luận’'' và câu hỏi ''Cô biết được bao nhiêu rồi?''."]'
- segment_id: YS-LN06/Text/part0021.html/p000183
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đáp Uger: tự xưng ''Tôi'', giữ phủ định ''không nghe
    được nhiều về dư luận ở chính quốc''."]'
- segment_id: YS-LN06/Text/part0021.html/p000184
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger nói với Tanya: gọi ''Trung tá von Degurechaff'' và
    đại từ ''cô''."]'
- segment_id: YS-LN06/Text/part0021.html/p000185
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: quy chiếu Uger là ''anh ấy'', chiếc
    đồng hồ là ''Nó'' (câu 3) và Tanya là ''nó'' (câu 4); giữ phủ định ''không nhỏ
    gọn như đồng hồ đeo tay'' và chi tiết ''một chiếc đồng hồ bỏ túi chuẩn xác''."]'
- segment_id: YS-LN06/Text/part0021.html/p000186
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi: ''“Một chiếc đồng hồ bỏ túi sao?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000187
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger chỉ vào chi tiết trên đồng hồ: ''“Chỗ này cơ.”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000188
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi tiếp: giữ hai câu hỏi ngắn ''“Sợi dây xích ư?
    Nó làm sao cơ?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000189
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger giải thích: giữ đối lập thời gian ''Vốn dĩ chúng làm
    bằng bạc. Nhưng rồi lệnh thu gom toàn bộ đồ bạc được ban bố''."]'
- segment_id: YS-LN06/Text/part0021.html/p000190
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi lại Uger: gọi ''anh'' (''“Ra vậy… Thế ý anh là…?”'')."]'
- segment_id: YS-LN06/Text/part0021.html/p000191
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger kể chuyện hậu phương: giữ dấu nháy đơn quanh ''‘sự
    hy sinh lớn nhất’'' và lý do ''chịu đựng sự bất tiện như thế là vì chiến thắng''."]'
- segment_id: YS-LN06/Text/part0021.html/p000192
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng ''nó'' cho Tanya, giữ ''bạn
    nó, Uger'' và giả định quá khứ trái thực tế ''Nếu người nói điều đó không phải
    là bạn nó, Uger, thì hẳn nó đã gạt phăng những lời ấy đi vì cho là chuyện hoang
    đường rồi''."]'
- segment_id: YS-LN06/Text/part0021.html/p000193
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger nói tiếp: giữ ''đòi hỏi mức đền đáp thật cao'' và ''các
    chương trình phát thanh lẫn báo chí lại còn hùa theo nữa chứ''."]'
- segment_id: YS-LN06/Text/part0021.html/p000194
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi: giữ câu hỏi phủ định ''“Chẳng phải có kiểm duyệt
    sao?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000195
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger đáp Tanya: gọi ''Cô'', giữ câu hỏi phản vấn, cụm ''vừa
    làm vừa mò mẫm thử sai'' và quan hệ nhân quả phủ định ''Vì vốn chẳng có kế hoạch
    nào được chuẩn bị từ trước, nên giờ họ mới bắt đầu đem ra thử nghiệm''."]'
- segment_id: YS-LN06/Text/part0021.html/p000196
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya cảm thán: dùng ngôi gộp ''Chúng ta / của ta'', giữ
    ''đám nghiệp dư'' và ''công tác tuyên truyền của ta lại tệ hại đến thế''."]'
- segment_id: YS-LN06/Text/part0021.html/p000197
  kind: terminology_and_voice
  value: 'choices=["Độc thoại phân tích của Tanya: dùng đại từ khái quát ''bạn'' và
    ngôi gộp ''chúng ta'', giữ ''Lục quân Đế quốc'', ''các phóng viên nước ngoài đi
    theo đơn vị'', ''các phóng viên Đế quốc'' và trình tự thời gian ''trước cả khi
    bài của các phóng viên Đế quốc kịp lọt qua khâu kiểm duyệt''."]'
- segment_id: YS-LN06/Text/part0021.html/p000198
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên ''Tanya'', ''Lục quân Đế quốc'', cụm ''hiện
    thân của sự bất tài'' và phủ định ''thậm chí còn chẳng có nổi một kế hoạch''."]'
- segment_id: YS-LN06/Text/part0021.html/p000199
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya nói lắp với Uger: giữ nét lắp bắp ''“Ý-ý anh là không
    có cách nào làm dịu cơn cuồng nhiệt chiến tranh này xuống sao?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000200
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tự quy chiếu của Tanya theo DEC-P01-001: dùng đại từ ''mình''
    (''Khi tự mình nói ra câu đó, cuối cùng mình cũng vỡ lẽ'')."]'
- segment_id: YS-LN06/Text/part0021.html/p000201
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tự quy chiếu của Tanya theo DEC-P01-001 và DEC-P01-002:
    dùng ''Mình'', giữ ''biến cố phóng hỏa Hibiya'', các tên riêng ''Bismarck'', ''Alsace-Lorraine'',
    ''Napoleon'', ''Talleyrand'', và giữ nhấn mạnh Markdown ''*buộc phải*'' đúng phạm
    vi từ in nghiêng trong nguồn."]'
- segment_id: YS-LN06/Text/part0021.html/p000202
  kind: terminology_and_voice
  value: 'choices=["Nội tâm Tanya: giữ cấu trúc so sánh phủ định ''Ngoại trừ một thất
    bại lớn, chẳng có gì tồi tệ hơn một chiến thắng lớn'' và ''chạm đúng vào một chân
    lý vĩnh cửu''."]'
- segment_id: YS-LN06/Text/part0021.html/p000203
  kind: terminology_and_voice
  value: 'choices=["Nội tâm Tanya: giữ phép so sánh ''Nó chẳng khác nào bong bóng
    kinh tế cả''."]'
- segment_id: YS-LN06/Text/part0021.html/p000204
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ ẩn dụ ''sự cuồng tín đang ngự
    trị kia nổ tung, nó sẽ còn tiếp tục phình to không có điểm dừng'' và câu giả định
    với đại từ khái quát ''bạn''."]'
- segment_id: YS-LN06/Text/part0021.html/p000205
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya nói với Uger: dùng ngôi gộp ''chúng ta'', giữ giả
    định hệ quả ''Nếu chúng ta tìm cách dội gáo nước lạnh vào khao khát chiến đấu
    của họ, khéo chúng ta lại chuốc lấy những rắc rối còn lớn hơn cả cuộc chiến này''."]'
- segment_id: YS-LN06/Text/part0021.html/p000206
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger đáp Tanya: dùng ngôi gộp ''Chúng ta'' và giữ phủ định
    bất định ''chưa biết liệu chuyện đó có xảy ra hay không''."]'
- segment_id: YS-LN06/Text/part0021.html/p000207
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya nói với Uger: gọi ''Trung tá Uger'', xưng ''tôi -
    anh'' và ngôi gộp ''chúng ta'', giữ đối lập ''thay vì lạc quan, chúng ta cần phải
    chuẩn bị sẵn tinh thần như những người bi quan''."]'
- segment_id: YS-LN06/Text/part0021.html/p000208
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng đại từ ''nó'' cho Tanya (''một
    sự thật mà nó buộc phải truyền đạt'')."]'
- segment_id: YS-LN06/Text/part0021.html/p000209
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tự quy chiếu của Tanya theo DEC-P01-001: dùng đại từ ''mình''
    ở câu cuối (''Tự thổi bay cuống não của mình đi còn vui hơn là kết bạn với hạng
    người đó''), giữ tương phản ''miệng thì nói không muốn nhìn thấy thất bại nhưng
    lại lao đầu xuống đáy vực''."]'
