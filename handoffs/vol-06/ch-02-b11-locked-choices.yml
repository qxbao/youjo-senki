    chấm lửng."]'
- segment_id: YS-LN06/Text/part0013.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: quy chiếu Mary bằng ''Cô'' (''Cô cứ mãi thất bại.'')."]'
- segment_id: YS-LN06/Text/part0013.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: quy chiếu Mary bằng ''cô'', giữ phủ định ''Lần
    này cô cũng vẫn chưa sẵn sàng.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & nghĩa: giữ câu bỏ lửng ''Nhưng một ngày nào đó…''."]'
- segment_id: YS-LN06/Text/part0013.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & nghĩa: giữ câu bỏ lửng ''Rồi sẽ có ngày…''."]'
- segment_id: YS-LN06/Text/part0013.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại & đại từ: nối vế câu thề từ p000003 bằng dấu chấm
    lửng mở đầu, Mary tự xưng ''Mình'' (''“…Mình nhất định sẽ quay trở lại.”'')."]'
- segment_id: YS-LN06/Text/part0013.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & tình thái: chuyển sang trần thuật tổng
    kết khách quan; ''the Empire, Federation, and Commonwealth'' -> ''Đế quốc, Liên
    bang lẫn Khối Thịnh vượng chung''; giữ tình thái ''có thể nói rằng'' và nhận định
    ''bên nào cũng có thể tự hào tuyên bố rằng mình đã giành chiến thắng''."]'
- segment_id: YS-LN06/Text/part0013.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''The Imperial Army'' -> ''Lục quân Đế quốc''; ''crushing
    tactical victory'' -> ''một chiến thắng chiến thuật áp đảo''."]'
- segment_id: YS-LN06/Text/part0013.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định mức độ: ''frontline units'' -> ''Các đơn
    vị tiền tuyến''; ''limited offensive'' -> ''cuộc tiến công giới hạn''; ''Federation''
    -> ''Liên bang''; ''paramilitary forces'' -> ''lực lượng bán vũ trang''; ''Council
    for Self-Government'' -> ''Hội đồng Tự trị''; giữ ý giảm nhẹ tổn thất ''mà hầu
    như không chịu tổn thất nào đáng kể trong suốt quá trình đó''."]'
- segment_id: YS-LN06/Text/part0013.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''the Empire'' -> ''Đế quốc''; ''Council for
    Self-Government'' -> ''Hội đồng Tự trị''; ''alliance in both name and reality''
    -> ''liên minh cả trên danh nghĩa lẫn thực tế''."]'
- segment_id: YS-LN06/Text/part0013.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: ''Imperial Army'' -> ''Lục quân
    Đế quốc''; ''the Empire'' -> ''Đế quốc''; giữ mệnh đề bổ sung về việc tổ chức
    được một đơn vị hùng mạnh và đẩy lùi phòng tuyến địch ở một số nơi."]'
- segment_id: YS-LN06/Text/part0013.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối lập: ''Federation Army'' -> ''Quân đội Liên bang'';
    ''strategic intelligence'' -> ''những tin tình báo chiến lược''; giữ đối lập giữa
    tổn thất lớn nhưng vẫn trong phạm vi cho phép và kết quả thu được tin tình báo
    chiến lược."]'
- segment_id: YS-LN06/Text/part0013.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc hai mệnh đề sự thật: ''Military staff'' ->
    ''Các sĩ quan tham mưu quân sự''; ''party leadership'' -> ''giới lãnh đạo Đảng'';
    ''the Empire'' -> ''Đế quốc''; ''Council for Self-Government'' -> ''Hội đồng Tự
    trị''; ''separatists'' -> ''đám ly khai''."]'
- segment_id: YS-LN06/Text/part0013.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: ''Federation Army General Staff'' -> ''Bộ Tổng
    tham mưu Quân đội Liên bang''; ''politburo'' -> ''Bộ Chính trị''; giữ ẩn dụ ''bắt
    Bộ Chính trị phải nuốt liều thuốc đắng mang tên thực tại''."]'
- segment_id: YS-LN06/Text/part0013.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ: giữ câu nhận định ngắn gọn ''Thực tại chiến trường đã đập
    tan lăng kính ý thức hệ.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & dấu câu: ''party leadership'' -> ''giới
    lãnh đạo Đảng''; ''Federation Army'' -> ''Quân đội Liên bang''; ''Commissariat
    for Internal Affairs'' -> ''Bộ Dân ủy Nội vụ''; giữ phủ định ''mà không phải hứng
    chịu một thất bại chí mạng nào'' và cụm chêm giữa hai dấu gạch ngang ''—ít nhất
    là ở mặt trận đối nội—''."]'
- segment_id: YS-LN06/Text/part0013.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái giới hạn: ''expeditionary mages'' -> ''các
    pháp sư viễn chinh''; ''the Commonwealth'' -> ''Khối Thịnh vượng chung''; giữ
    giới hạn ''Thực chất chẳng có gì hơn ngoài vài tù binh và đôi chút chiến quả quân
    sự lẻ tẻ.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & thành ngữ (cân nhắc chỉnh nhẹ theo finding minor):
    giữ liên từ chuyển ý ''Dẫu vậy'' và diễn đạt tự nhiên mức độ thuận lợi về mặt
    chính trị của chiến thắng này lớn đến mức có nhấn mạnh bao nhiêu cũng không quá
    lời."]'
- segment_id: YS-LN06/Text/part0013.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & đại từ: ''Lieutenant Colonel Drake'' ->
    ''Trung tá Drake'' (quy chiếu bằng ''ông''); ''marine mages'' -> ''các pháp sư
    hải quân đánh bộ''."]'
- segment_id: YS-LN06/Text/part0013.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Quan hệ thời gian: giữ câu chuyển ''Nhưng tất nhiên, điều đó chỉ
    trở nên rõ ràng sau khi mọi chuyện đã ngã ngũ.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh: giữ in hoa toàn bộ ''MOSKVA CÙNG THỜI ĐIỂM
    ĐÓ'', không thêm nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0013.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, dấu ngoặc kép & thuật ngữ: ''Federation''
