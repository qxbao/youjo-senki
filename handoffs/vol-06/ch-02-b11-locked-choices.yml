- segment_id: YS-LN06/Text/part0013.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & tình thái bắt buộc: Loria dùng ''chúng ta'';
    ''recon-in-force'' -> ''cuộc trinh sát chiến đấu''; ''small-scale combat'' ->
