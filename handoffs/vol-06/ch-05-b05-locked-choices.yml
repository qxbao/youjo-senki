    giữ tình thái suy luận quá khứ ''Hẳn... cũng đã nhìn'' và câu hỏi kết đoạn với
    cụm ''“duyên phận kỳ lạ”''."]'
- segment_id: YS-LN06/Text/part0023.html/p000122
