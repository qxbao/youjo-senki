choices:
- segment_id: YS-LN06/Text/part0021.html/p000210
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng đại từ ''nó'' cho Tanya (''Vì
    thế, nó tuyên bố''); trong thoại với Uger xưng ''Tôi - anh'', giữ tên ''Đế quốc'',
    ''Tướng von Zettour'', ẩn dụ ''Cỗ máy bạo lực chính xác của Đế quốc đang mục ruỗng
    dần'' và mệnh đề Clausewitz ''Chuyện quân sự suy cho cùng chỉ là sự tiếp nối của
    chính trị. Chúng đòi hỏi một giải pháp chính trị''."]'
- segment_id: YS-LN06/Text/part0021.html/p000211
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger đáp Tanya: tự xưng ''Tôi'', quy chiếu Tướng von Zettour
    bằng ''ngài ấy'' (''“Được thôi. Tôi sẽ nói chuyện với ngài ấy.”'')."]'
- segment_id: YS-LN06/Text/part0021.html/p000212
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại ngắn: giữ tên ''Tanya'', ''Uger'' và sự chuyển
    giọng ''nhưng Uger lại tiếp lời bằng một giọng trầm xuống''."]'
- segment_id: YS-LN06/Text/part0021.html/p000213
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger dặn trước Tanya: tự xưng ''tôi'', giữ mệnh lệnh phủ
    định ''Đừng kỳ vọng nhiều''."]'
- segment_id: YS-LN06/Text/part0021.html/p000214
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi lại: tự xưng ''Tôi'', giữ câu hỏi ''“Tôi có thể
    hỏi tại sao không?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000215
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger giải thích: tự xưng ''tôi'', giữ phủ định khả năng
    ''Sẽ không thể nào hành động ngay lập tức được đâu'' và câu tự đính chính ''tôi
    không thể khiến họ hành động được''."]'
- segment_id: YS-LN06/Text/part0021.html/p000216
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng ''nó'' cho Tanya, ''anh ấy''
    cho Uger, giữ tên ''Zettour'' và quan hệ nhượng bộ phủ định ''Ngay cả khi Zettour
    ghi nhận lời đề xuất ấy, điều đó cũng không có nghĩa là nó sẽ đạt được màn chuyển
    hướng quyết liệt như mình mong muốn''."]'
- segment_id: YS-LN06/Text/part0021.html/p000217
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi thẳng Uger: gọi ''Trung tá Uger'', xưng ''tôi
    - anh'', giữ ba câu hỏi liên tiếp về việc trì hoãn, ''phá hoại ngầm'' và ''kẻ
    nổi loạn bên trong tổ chức''."]'
- segment_id: YS-LN06/Text/part0021.html/p000218
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss can ngăn Tanya: giữ nét lắp bắp và cấp bậc ''“Tr-Trung
    tá von Degurechaff!”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000219
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger trấn an: tự xưng ''tôi'', giữ ''“Không sao đâu… Thật
    ra, vừa rồi tôi mới chợt nhận ra…”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000220
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: giữ tên ''Weiss'', ''Tanya'', ''Uger'',
    dùng ''nó'' cho Tanya và ''anh ta'' cho Weiss."]'
- segment_id: YS-LN06/Text/part0021.html/p000221
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger và trần thuật xen: xưng ''tôi'' và ngôi gộp ''chúng
    ta'', quy chiếu Uger bằng ''Anh ấy'' ở câu trần thuật; giữ ''Bộ Tổng tham mưu'',
    ''Lục quân Đế quốc'', ''Đế quốc'', thuật ngữ ''phòng ngự cơ động'', các phủ định
    (''chưa bao giờ hình dung'', ''chỉ được thiết kế với mục tiêu phòng ngự cơ động
    ở gần biên giới mà thôi'', ''thậm chí còn chẳng có sẵn một kế hoạch nào'') và
    quan hệ nhân quả ''vì không thể khắc phục được chuyện đó, nên chúng ta chỉ đang
    đối phó một cách chắp vá mà thôi''."]'
- segment_id: YS-LN06/Text/part0021.html/p000222
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi lại Uger: gọi ''anh'', dùng ngôi gộp ''chúng ta'',
    giữ cấu trúc hạn định ''tránh được cảnh sụp đổ hoàn toàn nhờ vào sự nỗ lực hết
    sức của các cá nhân ngoài thực địa''."]'
- segment_id: YS-LN06/Text/part0021.html/p000223
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger và trần thuật tiếp nối: tự xưng ''tôi'', quy chiếu
    Uger bằng ''Anh ấy - anh ấy'', dùng đại từ khái quát ''người ta'' trong thoại
    và ''bạn'' ở câu trần thuật cuối; giữ ''Bộ Tổng tham mưu'' và phủ định so sánh
    ''Chẳng còn hình ảnh nào có thể giúp bạn hiểu rõ hơn mức độ trầm trọng của tình
    cảnh mà Bộ Tổng tham mưu đang phải đối mặt''."]'
- segment_id: YS-LN06/Text/part0021.html/p000224
  kind: terminology_and_voice
  value: 'choices=["Trần thuật góc nhìn Tanya: giữ tên ''Tanya'', ''Lục quân Đế quốc'',
    ''văn hóa tổ chức'' và nhận định ''nhiễm phải cái thói xấu là việc đến đâu mới
    xử lý đến đó''."]'
- segment_id: YS-LN06/Text/part0021.html/p000225
  kind: terminology_and_voice
  value: 'choices=["Phân tích chiến lược: giữ đối lập ''linh hoạt chiến thuật'' với
    ''chiến lược'', thành ngữ ''đặt cỗ xe trước con ngựa'' và phủ định ''Không đời
    nào có thể giành chiến thắng bằng lối phản ứng thụ động như thế''."]'
- segment_id: YS-LN06/Text/part0021.html/p000226
  kind: terminology_and_voice
  value: 'choices=["Phân tích chiến lược: giữ ''Trung tướng von Zettour'', ''Trung
    tướng von Rudersdorf'', ''Đế quốc'', ''chiến lược quốc gia'' và cấu trúc điều
    kiện dẫn tới hệ quả phủ định ''về cơ bản Đế quốc chẳng hề có chiến lược quốc gia
    nào cả''."]'
- segment_id: YS-LN06/Text/part0021.html/p000227
  kind: terminology_and_voice
  value: 'choices=["Phân tích chiến lược: giữ ''Bộ Tổng tham mưu'', tên riêng ''Hannibal''
    và câu điều kiện phủ định ''Nếu Bộ Tổng tham mưu không thể tận dụng thỏa đáng
    các chiến thắng quân sự của mình, họ sẽ có kết cục giống như Hannibal''."]'
- segment_id: YS-LN06/Text/part0021.html/p000228
  kind: terminology_and_voice
  value: choices=["Theo DEC-P01-002 giữ nhấn mạnh Markdown '*cho đến một trận chiến
    cuối cùng không thể nào cứu vãn nổi.*' đúng phạm vi phần in nghiêng ở nửa sau
    câu nguồn."]
- segment_id: YS-LN06/Text/part0021.html/p000229
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại Uger nói với Tanya: giữ tên ''Tanya'', ''Uger'',
    ''Bộ Tổng tham mưu''; trong thoại xưng ''tôi - cô'', giữ chi tiết ''công tác phân
    phối ở phía đông bằng mạng lưới đường sắt'' và câu hỏi cuối."]'
- segment_id: YS-LN06/Text/part0021.html/p000230
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya đoán thử: dùng ngôi gộp ''chúng ta'' và tự xưng ''tôi'',
    giữ phủ định ''tôi lại chưa từng nghe nói tới'' và câu hỏi phủ định ''Chắc không
    phải lấy từ bài tập về nhà của một học viên sĩ quan nào đó hay đại loại thế đấy
    chứ?''."]'
- segment_id: YS-LN06/Text/part0021.html/p000231
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger đáp Tanya: gọi ''cô'', giữ hai vế ''Gần trúng nhưng
    vẫn trật rồi'' và ''xét theo một khía cạnh nào đó thì cô nói đúng đấy''."]'
- segment_id: YS-LN06/Text/part0021.html/p000232
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya ngạc nhiên: giữ câu cảm thán nghi vấn ngắn ''“Hả?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000233
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: dùng ''anh ấy'' cho Uger, ''nó''
    cho Tanya và giữ phủ định ''một điều nó hoàn toàn không ngờ tới''."]'
- segment_id: YS-LN06/Text/part0021.html/p000234
  kind: terminology_and_voice
  value: choices=["Theo DEC-P01-002 giữ đúng hai vùng nhấn mạnh Markdown '*Cộng hòa*'
    và '*Khảo cứu về Công tác Hậu cần khi Xâm lược Đế quốc.*'; giữ 'Bộ Tổng tham mưu
    Quân đội *Cộng hòa*' và 'Ban Biên soạn Lịch sử Chiến tranh'."]
- segment_id: YS-LN06/Text/part0021.html/p000235
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: dùng ''anh ấy'' cho Uger, giữ tên ''Tanya'' và chi
    tiết ''với vẻ tự giễu khiến Tanya cứng họng không nói nên lời''."]'
- segment_id: YS-LN06/Text/part0021.html/p000236
  kind: terminology_and_voice
  value: 'choices=["Trần thuật theo DEC-P01-001: giữ phủ định ''thậm chí còn chẳng
    phải là tài liệu của chính nước họ'', tên ''Uger'', đại từ ''nó'' cho Tanya ở
    câu thứ hai và giả định trái thực tế trong quá khứ ''Nếu nguồn tin không phải
    là Uger, hẳn nó đã chẳng đời nào tin nổi''."]'
- segment_id: YS-LN06/Text/part0021.html/p000237
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi lại: giữ nét lắp bắp ''“Ch-chuyện đó là thật sao?”''."]'
- segment_id: YS-LN06/Text/part0021.html/p000238
  kind: terminology_and_voice
  value: choices=["Theo DEC-P01-002 bọc toàn bộ đoạn bằng nhấn mạnh Markdown '*...*';
    giữ 'Lục quân Đế quốc', 'trường đại học quân sự' và quan hệ nhân quả trong nhận
    định tiền giả định của Tanya."]
- segment_id: YS-LN06/Text/part0021.html/p000239
  kind: terminology_and_voice
  value: choices=["Theo DEC-P01-002 bọc toàn bộ đoạn bằng nhấn mạnh Markdown '*...*';
    giữ sắc thái tin chắc trước đó '*Chắc chắn phải có ai đó, ở một nơi nào đó đang
    nghiên cứu về các chiến dịch viễn chinh ở nước ngoài chứ.*'."]
- segment_id: YS-LN06/Text/part0021.html/p000240
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm tự quy chiếu của Tanya theo DEC-P01-001 và DEC-P01-002:
    dùng đại từ ''mình'', không bọc in nghiêng và giữ nhận định tự tỉnh ngộ ''…Từ
    lúc nào đó, mình đã mắc phải cái định kiến đánh giá họ quá cao mất rồi.''."]'
- segment_id: YS-LN06/Text/part0021.html/p000241
  kind: terminology_and_voice
  value: 'choices=["Thoại Uger và câu kết: dùng ngôi gộp ''Chúng ta'', giữ tên ''Uger'',
    thuật ngữ ''lý thuyết vận hành đường sắt'', ''chiến lược nội tuyến'', phủ định
    ''không thể đem... ra áp dụng ở nước ngoài được'' và chi tiết ''kèm theo một nụ
    cười gượng gạo thật sự gây chấn động''."]'
