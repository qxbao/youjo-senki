- segment_id: YS-LN06/Text/part0011.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: trần thuật nêu tên ''Mikel'',
    quy chiếu bằng ''mình / Ông''; chỉ bọc ''*Gần như toàn là cồn cả!*'' khớp chính
