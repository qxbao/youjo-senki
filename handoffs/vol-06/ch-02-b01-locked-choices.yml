- segment_id: YS-LN06/Text/part0011.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & trần thuật: Mikel dùng ''Chúng ta'' và gọi
    ''thưa Trung tá Drake'' (''Lieutenant Colonel Drake''); giữ tên riêng ''Mikel''
