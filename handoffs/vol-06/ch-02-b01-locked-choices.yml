- segment_id: YS-LN06/Text/part0011.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian & địa điểm: giữ định dạng in hoa toàn bộ ''VÀI
    NGÀY TRƯỚC LỄ GIÁNG SINH, NĂM THỐNG NHẤT 1926, LÃNH THỔ LIÊN BANG, KHU VỰC LÂN
    CẬN SỞ CHỈ HUY LỰC LƯỢNG ĐA QUỐC GIA''; không dùng Markdown nhấn mạnh."]'
- segment_id: YS-LN06/Text/part0011.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quan hệ nhân quả: trần thuật khách quan mở đầu cảnh,
    giữ mệnh đề đối lập ''Trái với suy nghĩ của đa số mọi người'' và tính tất yếu
    ''tự khắc sẽ thu hút sự chú ý''."]'
- segment_id: YS-LN06/Text/part0011.html/p000003
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi trực tiếp trong thoại: giữ đúng đối tượng câu hỏi về
    mục tiêu của chiến dịch lần này.'']'
- segment_id: YS-LN06/Text/part0011.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & thuật ngữ: Mikel xưng ''Tôi'', giữ tình thái
    nghe truyền đạt lại ''Tôi nghe nói là''; ''the Empire’s attrition'' -> ''sự tiêu
    hao của Đế quốc''; ''limited offensive'' -> ''cuộc tiến công giới hạn''."]'
- segment_id: YS-LN06/Text/part0011.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, nhân danh & thuật ngữ (cần sửa theo finding): ''joint
    forces headquarters'' -> ''sở chỉ huy lực lượng liên hợp''; ''Lieutenant Colonel
    Drake'' -> ''Trung tá Drake''; ''Colonel Mikel'' -> ''Trung tá Mikel'' (đổi từ
    ''Đại tá Mikel'' để đồng bộ với p000289 và chương 1); ''designated lodgings''
    -> ''nơi ở được phân công''."]'
- segment_id: YS-LN06/Text/part0011.html/p000006
  kind: terminology_and_voice
  value: 'choices=[''Thoại câu hỏi & trần thuật: giữ câu hỏi cảm thán về thời tiết
    tuyết rơi và chi tiết Drake thở dài nhấp ngụm trà nguội.'']'
- segment_id: YS-LN06/Text/part0011.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''Federation’s General Winter''
    -> ''Tướng Mùa Đông của Liên bang''; ''the Empire'' -> ''Đế quốc''; quy chiếu
    Tướng Mùa Đông bằng ''ông ta''; giữ hai phủ định (''vốn chẳng vị nể một ai'',
    ''không phân biệt nổi đâu là bạn đâu là thù'') và tình thái nhượng bộ ''Có thể
    ông ta đã lập công lớn..., nhưng...''."]'
- segment_id: YS-LN06/Text/part0011.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & phủ định: chỉ bọc ''*Nói lại cho
    đúng thì*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; phần dẫn ''Drake
    lẩm bẩm trong đầu.'' và hai câu sau để ngoài dấu sao; giữ hai cấu trúc phủ định
    (''Cũng đâu phải Tướng Mùa Đông là một người yêu nước của Liên bang.'', ''chẳng
    phải đồng minh của bất kỳ ai cả'')."]'
- segment_id: YS-LN06/Text/part0011.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái: giữ câu nhận định ngắn ''Những kẻ trung lập
    thường là một lũ ngạo mạn.''."]'
- segment_id: YS-LN06/Text/part0011.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thành ngữ trong thoại: ''General Winter'' -> ''Tướng
    Mùa Đông''; ''batten down the hatches'' -> ''đóng chặt cửa cố thủ''; giữ câu ví
    von về mùa của những buổi giao tế xã hội."]'
- segment_id: YS-LN06/Text/part0011.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, địa danh & chuỗi phủ định: Mikel xưng ''tôi / Chúng tôi'';
    trần thuật quy chiếu Mikel bằng ''Mikel / ông''; ''Moskva'' -> ''Moskva''; giữ
    bốn phủ định (''không còn nghi ngờ gì nữa'', ''chẳng hiểu nổi'', ''không có quyền
    lên tiếng'', ''Chẳng thể làm gì khác được'') cùng cặp dấu gạch ngang nhấn mạnh
    ''—những mệnh lệnh nghiêm ngặt—''."]'
- segment_id: YS-LN06/Text/part0011.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nhân danh: trần thuật nêu tên ''Drake'' và ''Mikel'',
    giữ mức độ tức thời ''hiểu ngay lập tức''."]'
- segment_id: YS-LN06/Text/part0011.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & phép so sánh: quy chiếu Mikel bằng ''ông''
    và phản thân ''mình''; giữ tình thái dự đoán ''có lẽ ông sẽ buộc phải'' và hai
    phép so sánh (''vốn chẳng khác nào gia đình của mình'', ''như những món đồ dùng
    một lần rồi bỏ'')."]'
- segment_id: YS-LN06/Text/part0011.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái suy luận tất yếu: giữ mệnh đề chủ ngữ phủ
    định ''Bất kỳ ai không cảm thấy giằng xé trong hoàn cảnh đó'' và tình thái ''hẳn
    phải khiếm khuyết một phần nhân tính căn bản nào đó''; ''dilemma'' -> ''tình thế
    tiến thoái lưỡng nan''."]'
- segment_id: YS-LN06/Text/part0011.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, điều kiện & thuật ngữ trong thoại: Mikel xưng ''tôi'',
    gọi Drake là ''ngài'', dùng ''chúng ta'' ở cụm cuối; ''the Commonwealth side''
    -> ''phía Khối Thịnh vượng chung''; giữ câu điều kiện ''Nếu ngài có nghe được...''."]'
- segment_id: YS-LN06/Text/part0011.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định trong thoại (cần sửa theo finding):
    Drake xưng ''Tôi''; ''Colonel Mikel'' -> ''thưa Trung tá Mikel'' (đổi từ ''thưa
    Đại tá Mikel''); giữ phủ định toàn phần ''Tôi không biết gì về chuyện đó cả.''."]'
- segment_id: YS-LN06/Text/part0011.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ câu hỏi ngạc nhiên ''“Sao cơ?”''."]'
- segment_id: YS-LN06/Text/part0011.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm, thuật ngữ, phủ định & tình thái (cần sửa theo
    finding): trong thoại Drake xưng ''tôi / chúng tôi'', gọi Mikel là ''thưa Trung
    tá'' (đổi từ ''thưa Đại tá''); ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ nhượng bộ phủ định ''Ngay cả khi..., chúng tôi cũng chẳng bao giờ được nghe...'';
    trần thuật quy chiếu Drake bằng ''Ông / ông'' và giữ tình thái suy đoán phủ định
    kép ''Có lẽ ông không tài nào truyền đạt nổi... nếu không làm ra vẻ nghiêm túc
    đến mức lố bịch.''."]'
- segment_id: YS-LN06/Text/part0011.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & đại từ: giữ dấu chấm lửng mở đầu, tình thái
    ''Xem ra'' và đại từ bao gộp ''cả hai chúng ta''."]'
- segment_id: YS-LN06/Text/part0011.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Nhân danh & ẩn dụ: giữ tên riêng ''Drake'' và phép đối lập giữa
    ''mứt'' hợp với trà và ''một người bạn già'' (rượu scotch) để giải khuây nỗi bức
    bối."]'
- segment_id: YS-LN06/Text/part0011.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Drake bằng ''Ông'' và phản thân ''mình''."]'
- segment_id: YS-LN06/Text/part0011.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trong thoại: Drake gọi Mikel là ''Ngài'' trong
    hai câu hỏi mời rượu ngắn gọn."]'
- segment_id: YS-LN06/Text/part0011.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: Mikel xưng ''tôi / Tôi'', dùng ''hai quốc
