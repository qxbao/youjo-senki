- segment_id: YS-LN06/Text/part0011.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi đuôi trong thoại: Drake gọi phía Liên bang là
    ''phía các ngài'' và giữ câu hỏi phủ định xác nhận ''chẳng phải... rồi sao?''."]'
- segment_id: YS-LN06/Text/part0011.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Thoại bỏ lửng: giữ nguyên câu đáp ngắn kèm dấu chấm lửng ''“Trên
    giấy tờ thôi…”''."]'
- segment_id: YS-LN06/Text/part0011.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Ý ngài là…?*'' khớp
    chính xác với thẻ em trong XHTML theo DEC-P01-002; vế trần thuật ''Drake hỏi bằng
    ánh mắt và Mikel nhún vai.'' để ngoài dấu sao."]'
- segment_id: YS-LN06/Text/part0011.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái, thời gian & thuật ngữ trong thoại: Mikel phân
    biệt ''chúng tôi'' (phía Liên bang) và ''chúng ta'' (hai người đang trò chuyện);
