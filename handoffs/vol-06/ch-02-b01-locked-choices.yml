- segment_id: YS-LN06/Text/part0011.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu nhận định ngắn gọn ''Chuyện này không cần phải
    nói nhiều.''."]'
- segment_id: YS-LN06/Text/part0011.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định nhượng bộ: trần thuật nêu tên ''Mikel''
    và quy chiếu bằng ''ông''; trong thoại Mikel xưng ''tôi / chúng tôi''; ''limited
    offensive'' -> ''cuộc tiến công giới hạn''; ''foothold'' -> ''bàn đạp''; ''major
    spring counteroffensive'' -> ''cuộc tổng phản công mùa xuân''; giữ cấu trúc phủ
    định nhượng bộ ''Tôi sẽ không gọi đó là liều mạng, nhưng ngay cả với tư cách một
