    giữ tình thái ''có lẽ'' và thời điểm hiện tại tiếp diễn ''mới chỉ đang làm thủ
    tục đăng ký ngay lúc chúng ta nói chuyện này''."]'
- segment_id: YS-LN06/Text/part0011.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Nhân danh & thành ngữ: giữ tên riêng ''Drake'' và thành ngữ chỉ
    sự bàng hoàng ''máu trong người Drake lạnh toát''."]'
- segment_id: YS-LN06/Text/part0011.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Thoại & câu hỏi: giữ trọn ý mức độ gây sốc làm mất cả thú vui
    thưởng thức ly đồ uống ấm và câu hỏi xác nhận ''Có thật không vậy?''."]'
- segment_id: YS-LN06/Text/part0011.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Điều kiện giả định, điểm nhìn & thuật ngữ: giữ câu điều kiện ''Nếu
    tin này là sự thật, họ đang rơi vào một tình thế vô cùng bấp bênh''; quy chiếu
    ''Drake / ông''; ''Commonwealth officers'' -> ''sĩ quan Khối Thịnh vượng chung'';
    ''Federation side'' -> ''phía Liên bang''."]'
- segment_id: YS-LN06/Text/part0011.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Phủ định, dấu ngoặc kép mỉa mai & thuật ngữ: giữ mệnh đề chủ ngữ
    phủ định ''Việc điều này chẳng làm ai ngạc nhiên'', dấu ngoặc kép mỉa mai quanh
    từ ''“nồng ấm”'', ''Commonwealth'' -> ''Khối Thịnh vượng chung'' và ''Federation''
    -> ''Liên bang''."]'
- segment_id: YS-LN06/Text/part0011.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Thoại bỏ lửng: giữ câu cảm thán kèm dấu chấm lửng ''“Đó là một
    tin rò rỉ động trời đấy…”''."]'
- segment_id: YS-LN06/Text/part0011.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & câu hỏi đuôi: Mikel gọi Drake là ''ngài'',
    giữ phủ định ''không hề biết'' và câu hỏi đuôi ''đúng chứ?''."]'
