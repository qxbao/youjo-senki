- segment_id: YS-LN06/Text/part0008.html/p000163
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tình thái: quy chiếu Serebryakov bằng ''cô''
    nối mạch trực tiếp từ p000162; giữ tình thái suy đoán ''Có khả năng'' và so sánh
    ''hơn hầu hết mọi người''."]'
- segment_id: YS-LN06/Text/part0008.html/p000164
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định: Serebryakov dùng ''chúng ta'', gọi
    Tanya là ''thưa Trung tá''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''mobility''
    -> ''tính cơ động''; giữ phủ định ''chúng ta cũng không phải ngoại lệ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000165
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''doctrine'' -> ''học thuyết''; ''interior
    lines strategy'' -> ''chiến lược nội tuyến''; giữ cấu trúc khẳng định qua phủ
    định ''Không quá lời khi nói rằng...''."]'
- segment_id: YS-LN06/Text/part0008.html/p000166
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quan hệ hệ quả phủ định: Serebryakov dùng ''chúng ta''
    kèm tiểu từ lễ phép ''ạ''; giữ hai lớp phủ định ''không tương thích với một chiến
    trường nơi không thể cơ động được''."]'
- segment_id: YS-LN06/Text/part0008.html/p000167
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & thuật ngữ: chỉ bọc ''*Hợp lý đấy…*''
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; trần thuật dùng tên riêng
    ''Tanya'', độc thoại nội tâm tự quy chiếu dùng ''Mình'' theo DEC-P01-001; ''Galápagos
    syndrome'' -> ''hội chứng Galápagos''; ''Imperial Army'' -> ''Lục quân Đế quốc''."]'
- segment_id: YS-LN06/Text/part0008.html/p000168
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ trong thoại: Tanya gọi Serebryakov là ''cô'',
    xưng ''Tôi''; ''General Winter'' -> ''Tướng Mùa Đông''; ''Federation Army'' ->
    ''Quân đội Liên bang''; giữ quan hệ đối lập ở câu cuối."]'
- segment_id: YS-LN06/Text/part0008.html/p000169
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, nhấn mạnh Markdown & thuật ngữ: trần thuật
    quy chiếu Tanya bằng ''nó'' theo DEC-P01-001; chỉ bọc ''*Hừm*'' khớp chính xác
    với thẻ em trong XHTML theo DEC-P01-002; ''human wave tactics'' -> ''chiến thuật
    biển người''; ''mobile battle'' -> ''trận đánh cơ động''; ''General Staff'' ->
    ''Bộ Tổng tham mưu''; giữ điều kiện bổ sung cuối đoạn ''Đó là nếu chúng ta vượt
    qua nổi mùa đông đã.''."]'
- segment_id: YS-LN06/Text/part0008.html/p000170
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ nội tâm & phủ định: độc thoại nội tâm tự quy
    chiếu của Tanya dùng ''mình'' và ''chúng ta'' theo DEC-P01-001; ''malevolent gods''
    -> ''quỷ thần''; ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ mệnh đề nhượng
    bộ phủ định ''ngay cả với một người không tin vào quỷ thần như mình''."]'
- segment_id: YS-LN06/Text/part0008.html/p000171
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & chỉ dẫn trong thoại: Tanya gọi ''Trung úy
    Serebryakov / cô'', xưng ''Tôi''; ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ
    chỉ dẫn yêu cầu lập báo cáo và ý định thử đệ trình."]'
- segment_id: YS-LN06/Text/part0008.html/p000172
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái ngập ngừng: giữ nét lắp bắp ngạc nhiên và lễ
    phép của Serebryakov ''T-Trung tá có chắc không ạ?''."]'
- segment_id: YS-LN06/Text/part0008.html/p000173
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & lập luận trong thoại: Tanya xưng ''Tôi / mình'',
    dùng ''chúng ta'', gọi Serebryakov là ''cô''; giữ phủ định kép ''chưa biến thành
    một chỉ huy hẹp hòi đến mức phớt lờ những lập luận xác đáng'' và mệnh đề nguyên
    nhân phủ định ''Vì không mang những định kiến kỳ quặc...''."]'
- segment_id: YS-LN06/Text/part0008.html/p000174
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''deconstructed view'' -> ''góc nhìn giải cấu trúc''."]'
- segment_id: YS-LN06/Text/part0008.html/p000175
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phạm vi toàn thể: ''Every last one'' -> ''Tất cả...
    không sót một ai''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''war college''
    -> ''trường đại học quân sự''."]'
- segment_id: YS-LN06/Text/part0008.html/p000176
  kind: terminology_and_voice
  value: 'choices=[''Phép so sánh & nhân quả: giữ trọn ẩn dụ hệ miễn dịch chuyên biệt
    hóa cho một mầm bệnh duy nhất sẽ bị xóa sổ bởi bất kỳ căn bệnh nào khác.'']'
- segment_id: YS-LN06/Text/part0008.html/p000177
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu đúc kết trong thoại ''Sự đa dạng là yếu tố thiết
    yếu để giành chiến thắng trong một cuộc chiến.''."]'
- segment_id: YS-LN06/Text/part0008.html/p000178
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & đại từ: chỉ bọc ''*Vấn đề là…*''
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002 và nối câu với p000179;
    trần thuật dùng ''Tanya / nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000179
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn câu ''*…Đế quốc đã trở
    nên quá đồng nhất.*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0008.html/p000180
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện & phủ định: ''home country'' -> ''quê nhà'';
    ''interior lines strategy'' -> ''chiến lược nội tuyến''; giữ câu điều kiện dự
    báo hệ quả phủ định (''sự xuất sắc ngoài chiến trường không còn có thể bù đắp
    nổi nữa'') và nghịch lý về độ chuẩn xác của tổ chức ở câu cuối."]'
- segment_id: YS-LN06/Text/part0008.html/p000181
  kind: terminology_and_voice
  value: 'choices=["Đại từ: dùng ''Chúng ta'' trong nhận định chung về hoàn cảnh của
    đơn vị/quân đội."]'
- segment_id: YS-LN06/Text/part0008.html/p000182
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc tăng tiến: ''home country'' -> ''quê nhà'';
    giữ cấu trúc ''Càng nghĩ về chuyện đó, những vấn đề ấy dường như càng chất chồng
    thêm.''."]'
- segment_id: YS-LN06/Text/part0008.html/p000183
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi trong thoại: ''saturation point'' -> ''điểm
    bão hòa''; giữ đại từ ''chúng ta''."]'
- segment_id: YS-LN06/Text/part0008.html/p000184
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ trần thuật: quy chiếu Tanya bằng ''Tanya /
    nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000185
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nghĩa trong thoại: Tanya xưng ''Tôi''; giữ câu cảm thán
