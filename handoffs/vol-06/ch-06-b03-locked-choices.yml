- segment_id: YS-LN06/Text/part0027.html/p000067
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & sắc thái: trong thoại Tanya dùng ''chúng
    ta'', giữ sắc thái mỉa mai ''Tại thế mà giờ đây chúng ta mới phải chịu khổ.'';
    ''adjutant'' -> ''viên sĩ quan phụ tá''; trần thuật nêu tên ''Tanya''."]'
- segment_id: YS-LN06/Text/part0027.html/p000068
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm Tanya gọi đối phương là
    ''Mấy kẻ ở Liên minh Hiệp ước này'', quy chiếu phía đơn vị Đế quốc bằng ''chúng
    tôi''; giữ chuẩn cụm ''kháng cự chúng tôi một cách thụ động''."]'
- segment_id: YS-LN06/Text/part0027.html/p000069
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, giả định, phủ định & thuật ngữ: nội tâm tự
    quy chiếu của Tanya dùng ''Mình'' theo DEC-P01-001, quy chiếu tập thể đơn vị bằng
    ''chúng tôi'' và đối phương bằng ''chúng''; ''Imperial Army'' -> ''Lục quân Đế
    quốc''; giữ hai câu giả định (''Nếu đó là sự chống trả về mặt quân sự...'', ''nếu
    có một cuộc nổi dậy tập trung...''), phủ định ''không chút nghi ngờ'' và điều
    kiện giới hạn ở câu cuối ''Nhưng đấy là chỉ khi chúng tôi có thể tìm ra chúng
    để mà giáng đòn.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000070
  kind: terminology_and_voice
  value: 'choices=["Tình thái & điều kiện khái quát: chuyển chủ thể giả định chung
    sang câu khái quát tự nhiên ''Có điều, cứ vung tay mãi thì rồi cũng mỏi nhừ.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000071
  kind: terminology_and_voice
  value: 'choices=["Phủ định, nhượng bộ & ẩn dụ: giữ hai cấu trúc phủ định (''chẳng
    thể tung những cú đấm thẳng liên hoàn vô tận'', ''dù bề ngoài trông không giống
    vậy'') cùng hai hình ảnh ẩn dụ ''đôi nắm đấm bằng thủy tinh'' và ''chẳng khác
    nào đang vác bom trên vai''."]'
- segment_id: YS-LN06/Text/part0027.html/p000072
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & nhân quả: giữ câu nhận định cô đọng ''Một đạo quân khổng
    lồ chỉ riêng việc di chuyển thôi cũng đã tự bào mòn chính mình.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000073
  kind: terminology_and_voice
  value: 'choices=["Đối lập & sắc thái kinh tế: giữ thế đối lập giữa ''doanh nghiệp
    vận hành'' (''tạo ra lợi nhuận, hoặc chí ít cũng đang nỗ lực hướng tới điều đó'')
    với ''một đạo quân di chuyển'' (''làm bốc hơi thêm một khoản tiền thuế khổng lồ
    của người dân'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000074
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*…Cứ đà này thì chẳng
    khác gì chủ nghĩa xã hội. Eo ôi.*'' khớp chính xác với thẻ em trong XHTML theo
    DEC-P01-002; trần thuật nêu tên ''Tanya''."]'
- segment_id: YS-LN06/Text/part0027.html/p000075
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, xưng hô, phủ định & điều kiện: trong thoại
    Tanya dùng ''Chúng ta''; giữ phủ định ''không còn một khắc nào để phung phí nữa'',
    câu điều kiện phủ định ''Nếu không sớm tìm ra lối thoát cho tình cảnh này, quân
    đội sẽ tự hủy diệt mất.'' và chỉ bọc ''*bền vững*'' khớp chính xác với thẻ em
    trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0027.html/p000076
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & thành ngữ: giữ nhận định ''Lời nhận xét trầm lặng ấy thật
    rợn người.'' và cụm ''có đầy đủ cả lương tri thường thức lẫn sự nhạy bén thực
    tế''."]'
- segment_id: YS-LN06/Text/part0027.html/p000077
  kind: terminology_and_voice
  value: 'choices=["Đại từ giả định, điều kiện & phủ định kép: dùng đại từ chung ''bạn
    / mình''; giữ điều kiện phủ định ''mà vẫn chưa thu xếp đường nhảy tàu sang bến
    đỗ khác'' và phủ định kép ''việc không rùng mình mới là chuyện bất khả thi''."]'
- segment_id: YS-LN06/Text/part0027.html/p000078
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & câu hỏi nội tâm/trần thuật: quy chiếu Tanya
    bằng ''nó'' theo DEC-P01-001; giữ nguyên độ mở của câu hỏi trạng thái ''Trong
    tâm tưởng, nó đang rơi nước mắt hay đổ mồ hôi hột đây?''."]'
- segment_id: YS-LN06/Text/part0027.html/p000079
  kind: terminology_and_voice
  value: 'choices=["Sắc thái mỉa mai: giữ cách tự nhận ''một công dân lương thiện
    nhỏ bé'' và thái độ ''đối diện với hiện thực bằng thái độ chân thành và khiêm
    nhường''."]'
- segment_id: YS-LN06/Text/part0027.html/p000080
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & cấu trúc thời gian: chỉ bọc ''*Hiện thực
    ư?*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ cấu trúc ''Đúng
    lúc Tanya sắp sửa... thì chuông điện thoại bỗng réo vang dữ dội.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000081
  kind: terminology_and_voice
  value: 'choices=["Đại từ & hành động: quy chiếu Serebryakov bằng ''Serebryakov /
    cô'' và Tanya bằng ''Tanya''; giữ cụm ''chuyển đổi trạng thái tư duy''."]'
- segment_id: YS-LN06/Text/part0027.html/p000082
  kind: terminology_and_voice
  value: 'choices=["Thoại, ngữ khí & thuật ngữ: Serebryakov báo cáo lễ phép có tiểu
    từ ''ạ''; ''maintenance and armored companies'' -> ''đại đội bảo dưỡng và đại
    đội thiết giáp''."]'
- segment_id: YS-LN06/Text/part0027.html/p000083
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh ngắn: giữ câu chỉ dẫn gọn của cấp trên ''“Nói
    tiếp đi.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000084
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định, quân hàm & ngữ khí: giữ điều kiện ''nếu tình
    trạng này cứ tiếp diễn thì chỉ trong vài ngày nữa'' và phủ định ''họ sẽ không
    còn đủ xe hoạt động tốt để sử dụng''; ''Captain Ahrens'' -> ''Đại úy Ahrens'';
    giữ ngữ khí báo cáo ''đấy ạ''."]'
- segment_id: YS-LN06/Text/part0027.html/p000085
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & câu hỏi tu từ phủ định: ''Colonel Uger''
    -> ''Trung tá Uger''; ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ câu hỏi tu
    từ phủ định của Tanya ''Sao thế, chẳng lẽ giờ đến cả giới phụ trách hậu cần trong
    Bộ Tổng tham mưu mà chúng ta cũng không thể tin tưởng được nữa ư?''."]'
- segment_id: YS-LN06/Text/part0027.html/p000086
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ trần thuật: chỉ bọc ''*Thiệt tình*''
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; trần thuật quy chiếu Tanya
    bằng ''Tanya / nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0027.html/p000087
  kind: terminology_and_voice
  value: 'choices=["Phủ định đính chính & ngữ khí: giữ lời đính chính lễ phép của
    Serebryakov ''“Dạ không, phụ tùng vẫn được chuyển đến đúng hạn ạ…”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000088
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi truy vấn: giữ câu hỏi thẳng của Tanya ''“Vậy thì vấn đề
    nằm ở đâu?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000089
  kind: terminology_and_voice
  value: 'choices=["So sánh, thuật ngữ & xưng hô: giữ cấu trúc so sánh ''nằm ở khâu
    nhân sự và cơ cấu tổ chức nhiều hơn là vấn đề phụ tùng ạ''; ''maintenance company''
