    nhớ là có bất kỳ trục trặc nào''."]'
- segment_id: YS-LN06/Text/part0027.html/p000100
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: ''air force or navy bases'' -> ''các căn cứ
    không quân hoặc hải quân''; giữ tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN06/Text/part0027.html/p000101
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''Tanya / nó'' theo DEC-P01-001;
    giữ chi tiết ''tặc lưỡi—một hành động hiếm thấy ở nó''."]'
- segment_id: YS-LN06/Text/part0027.html/p000102
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: ''garrisoned troops'' -> ''quân
    đồn trú''; ''maneuver warfare'' -> ''đánh cơ động''; ''air and navy fleets'' ->
    ''các hạm đội không quân và hải quân''; giữ phủ định ''Chẳng có dự kiến nào về
    việc đánh cơ động'' và tình thái suy đoán ''có lẽ là cách làm hiệu quả''."]'
- segment_id: YS-LN06/Text/part0027.html/p000103
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn, đại từ, chuỗi phủ định & tình thái:
    chỉ bọc ''*Oái oăm thay*'' (đặt dấu ba chấm ngoài dấu sao) khớp chính xác với
    thẻ em trong XHTML theo DEC-P01-002; nội tâm Tanya tự quy chiếu bằng ''mình''
    và quy chiếu đơn vị bằng ''chúng tôi''; giữ ba phủ định (''không thể truy kích'',
    ''chẳng có lực lượng hỗ trợ bảo dưỡng'', ''không cần thiết'') cùng tình thái ''chắc
    mình phải nói như vậy'' và ''Xem chừng''."]'
