  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & thuật ngữ: ''search or pursuit missions'' ->
    ''nhiệm vụ lùng sục hoặc truy kích''; giữ quan hệ nguyên nhân – hệ quả ''nên họ
    đang hoạt động rải rác ở khắp mọi khu vực khác nhau ạ''."]'
- segment_id: YS-LN06/Text/part0027.html/p000095
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: ''nearest depot'' -> ''kho hậu cần gần
    nhất''; giữ tình thái ''Thế nhưng họ vẫn phải tiếp cận được... chứ.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000096
  kind: terminology_and_voice
  value: 'choices=["Đối lập, phủ định & nhân quả: giữ sự đối chiếu với miền đông,
    phủ định ''nhưng ngặt nỗi quanh đây lại chẳng có căn cứ sửa chữa nào'', quan hệ
    nhân quả ''Ngay cả nơi gần nhất cũng cách khá xa, nên thủ tục chuyển phụ tùng
    đi trở nên rất phức tạp.'' và lý do bỏ lửng ở câu cuối."]'
- segment_id: YS-LN06/Text/part0027.html/p000097
  kind: terminology_and_voice
  value: 'choices=["Chỉ dẫn hành động & phủ định: giữ chỉ dẫn ''Tanya phẩy tay ra
    hiệu cho Serebryakov không cần nói thêm nữa'' và câu tóm lược có phủ định ''“Tức
    là chúng ta có phụ tùng, nhưng điều kiện thực tế lại không thuận lợi để tiến hành
    sửa chữa.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000098
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định & thuật ngữ: ''workshops'' -> ''xưởng sửa
    chữa''; ''Communists'' -> ''đám Cộng sản''; giữ hai phủ định (''không có đủ phương
    thức để chuyển phụ tùng tới xưởng'', ''lập kế hoạch mà không tính đến khâu này'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000099
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm, câu hỏi, phủ định & thuật ngữ: Tanya gọi Serebryakov
    là ''Trung úy'', xưng ''Tôi'' và dùng ''chúng ta'' khi nói về đơn vị; ''Northern
    Army Group’s maintenance companies'' -> ''Các đại đội bảo dưỡng của Cụm tập đoàn
