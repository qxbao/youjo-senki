    bảo dưỡng thuộc Cụm tập đoàn quân phía Đông''; ''tank repair base'' -> ''căn cứ
    sửa chữa xe tăng''; dùng ''chúng ta'' trong báo cáo nội bộ."]'
- segment_id: YS-LN06/Text/part0027.html/p000090
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & thuật ngữ: chỉ bọc ''*Tất nhiên
    là thế rồi*'' (đặt dấu chấm ngoài dấu sao) khớp chính xác với thẻ em trong XHTML
    theo DEC-P01-002; ''adjutant'' -> ''viên sĩ quan phụ tá của mình''."]'
- segment_id: YS-LN06/Text/part0027.html/p000091
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ, phủ định & thuật ngữ: giữ mệnh đề nhượng bộ ''Mặc dù
    mỗi lực lượng đều có khả năng tự cung tự cấp'' và phủ định ''Đơn vị thiết giáp
    đâu thể nào tự mình đại tu toàn bộ số xe tăng trong biên chế.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000092
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & tình thái: giữ cấu trúc nhượng bộ ''Mô tô tuy là một
    loại phương tiện khác'' và tình thái ''nhưng lẽ ra cũng phải vận hành theo cùng
    nguyên lý đó''."]'
- segment_id: YS-LN06/Text/part0027.html/p000093
  kind: terminology_and_voice
  value: 'choices=["Tình thái & xưng hô: giữ câu nhận định kỳ vọng của Tanya ''“Nhưng
    lẽ ra ở đây chúng ta cũng phải nhận được sự hỗ trợ chứ.”''."]'
