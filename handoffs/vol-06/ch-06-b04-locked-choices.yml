    thể phản ứng nhanh thì đúng là vô dụng hết chỗ nói'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000110
  kind: terminology_and_voice
  value: 'choices=["Phủ định đối lập & nhân quả: giữ cấu trúc ''vì đây không phải
