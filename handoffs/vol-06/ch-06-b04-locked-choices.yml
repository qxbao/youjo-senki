    thể dùng tàu hỏa''."]'
- segment_id: YS-LN06/Text/part0027.html/p000106
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định & thuật ngữ: giữ mệnh đề điều kiện phủ định
