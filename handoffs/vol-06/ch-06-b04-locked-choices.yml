    tiện hỏng hóc bị tụt lại'' và quan hệ nguyên nhân – hệ quả ''một phần là bởi chúng
    tôi đã chiếm được các tuyến đường sắt của địch trên vùng lãnh thổ bị chiếm đóng
    này—chúng tôi cứ việc dùng đường sắt là xong.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000105
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & đối lập phương thức: giữ đại từ ''chúng tôi''
