    đường dài'' và nhận định ''thì việc tập trung các đại đội bảo dưỡng ở thủ đô cũng
    là điều hợp lý''."]'
- segment_id: YS-LN06/Text/part0027.html/p000107
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, ngữ khí, phủ định & nhân quả: Serebryakov đáp lời cấp
