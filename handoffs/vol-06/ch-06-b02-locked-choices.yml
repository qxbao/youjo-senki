choices:
- segment_id: YS-LN06/Text/part0027.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & phủ định: Serebryakov xưng ''Tôi'' và thêm kính
    ngữ ''ạ'' khi thưa với cấp trên; giữ dấu ba chấm mở đầu và cấu trúc phủ định nhấn
    mạnh ''hoàn toàn không biết vấn đề ở đây là gì ạ''."]'
- segment_id: YS-LN06/Text/part0027.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn, đại từ & thuật ngữ: chỉ bọc ''*Thật
    thà là một đức tính tốt. Mình nên khen cô ấy mới phải. Nhưng mình lại chẳng mấy
    hài lòng trước việc cô ấy không biết*'' khớp chính xác với thẻ em trong XHTML
    theo DEC-P01-002; nội tâm Tanya tự xưng ''Mình / mình'' và gọi Serebryakov là
    ''cô ấy'' theo DEC-P01-001; trong thoại dùng đại từ gộp ''chúng ta'', quy chiếu
    địch bằng ''chúng'', giữ phủ định ''thậm chí còn chẳng phải là tiêu diệt chúng
    ta'' và thuật ngữ ''Sự kháng cự của quân du kích''."]'
- segment_id: YS-LN06/Text/part0027.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối sánh: quy chiếu mafia và các băng đảng bằng ''chúng'';
    giữ cấu trúc phủ định khái quát ''Đâu phải lúc nào chúng cũng nhăm nhe giết sạch
    toàn bộ cảnh sát.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & liên kết câu: ''The partisans in this region'' ->
    ''Quân du kích ở vùng này''; giữ câu ngắn gọn đối chiếu trực tiếp với đoạn trước."]'
- segment_id: YS-LN06/Text/part0027.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & đại từ: giữ dấu ngoặc kép quanh chữ ''“cảnh
    sát”'' đi kèm ''Lục quân Đế quốc''; quy chiếu quân du kích bằng ''Chúng'' và phe
    Đế quốc bằng ''chúng ta''."]'
- segment_id: YS-LN06/Text/part0027.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & thuật ngữ: giữ dấu ba chấm ngập ngừng sau tình
    thái từ ''Vậy có lẽ…''; ''Entente Alliance partisans'' -> ''quân du kích Liên
    minh Hiệp ước''; giữ cặp đối lập ''sự bền bỉ thay vì phô trương''."]'
- segment_id: YS-LN06/Text/part0027.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế: giữ cấu trúc điều kiện giả định ''Thật
    ra nếu chúng thực sự theo đuổi những thắng lợi quân sự lớn thì việc đối phó với
    chúng đã dễ dàng hơn nhiều.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & phủ định: chỉ bọc ''*Hay đúng
    hơn là…*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ câu khẳng
    định mức bất khả thi ''Không tài nào xóa sổ nổi những toán du kích biết ẩn nhẫn
    chờ thời.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: quy chiếu quân du kích bằng ''Chúng''; giữ nhận
    xét ngắn gọn ''“Chúng cẩn trọng và dai dẳng một cách đáng ngạc nhiên.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giới hạn: giữ mệnh đề quan hệ phủ định ''chưa qua huấn
    luyện'' và cấu trúc giới hạn ''chỉ được phát vũ khí chứ chẳng có gì khác''."]'
- segment_id: YS-LN06/Text/part0027.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''irregular soldiers'' -> ''quân không chính
    quy''; ''trained professionals'' -> ''những quân nhân chuyên nghiệp đã qua đào
    tạo''; giữ chuỗi ba động từ ''nhử mồi, chờ đợi và chịu đựng'' và phép so sánh
    ''khắc nghiệt hơn nhiều so với trên lý thuyết''."]'
- segment_id: YS-LN06/Text/part0027.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: ''militias'' -> ''lực lượng dân quân''; giữ
    câu nhận định khái quát ''“Thông thường, lực lượng dân quân có sức kiên trì rất
    kém.”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Phủ định, đối lập & thuật ngữ: ''rebels'' -> ''những kẻ nổi dậy'';
    giữ chuỗi phủ định và đối lập ''không hề nóng vội mà trái lại đang từng bước tiến
    lên, chẳng bao giờ nản lòng hay bỏ cuộc''."]'
- segment_id: YS-LN06/Text/part0027.html/p000047
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: ''public order'' -> ''trật tự công cộng'';
    giữ câu nhận định ngắn gọn ''Một kẻ địch biết chờ đợi là cơn ác mộng đối với trật
    tự công cộng.''."]'
- segment_id: YS-LN06/Text/part0027.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định: ''the former Entente Alliance'' -> ''cựu
    Liên minh Hiệp ước''; giữ cấu trúc đánh giá giả định ''sẽ thật kỳ lạ nếu cho rằng
    năng lực ấy đã được tích lũy qua nhiều năm''."]'
- segment_id: YS-LN06/Text/part0027.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Thoại, sắc thái khẩu ngữ & quân hàm: giữ cụm ''biết cách ẩn nhẫn
    chờ thời, mà lại được gây dựng lên từ con số không''; chuyển sắc thái nhấn mạnh
    mạnh mẽ của ''fucking skilled'' thành ''giỏi thật sự đấy''; giữ danh xưng ''Trung
    úy'' ở cuối câu."]'
- segment_id: YS-LN06/Text/part0027.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ khái quát & điều kiện phủ định: ''fleet in being''
    -> ''hạm đội hiện hữu''; ''passive resistance'' -> ''sự kháng cự thụ động''; ''psychological
    warfare'' -> ''chiến tranh tâm lý''; giữ đại từ giả định khái quát ''bạn'' và
    mệnh đề điều kiện phủ định ''Nếu sự kháng cự thụ động của bạn không được hậu thuẫn
    bởi một ý chí kiên cường''."]'
- segment_id: YS-LN06/Text/part0027.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc đối lập phủ định: giữ câu châm ngôn ngắn gọn với cấu
    trúc ''không... mà...'' (''Sự thận trọng không bắt nguồn từ nỗi hèn nhát mà từ
    lòng dũng cảm.'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Phủ định & lập luận: giữ mệnh đề danh ngữ có phủ định ''Việc những
    kẻ ngốc đánh đồng lòng dũng cảm với trò lớn tiếng rêu rao lập trường hiếu chiến
    không phải là phe chủ đạo trong hàng ngũ kẻ địch''."]'
- segment_id: YS-LN06/Text/part0027.html/p000053
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: quy chiếu Tanya trong trần thuật
    bằng ''nó'' theo DEC-P01-001; giữ dấu gạch ngang dài ở câu đầu và mệnh đề đối
    lập phủ định ''nhưng nó cũng chẳng có ý định mất công tìm hiểu những kẻ ngốc làm
    gì''."]'
- segment_id: YS-LN06/Text/part0027.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & đại từ: giữ đại từ tự quy chiếu nội tâm của
    Tanya ''mình'' theo DEC-P01-001 (''Nhưng một đối thủ xứng tầm biết chờ đợi thời
    cơ như thế này thì mình sẽ tôn trọng.'')."]'
- segment_id: YS-LN06/Text/part0027.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đại từ & dấu câu: giữ đại từ nội tâm ''mình''
    theo DEC-P01-001 và dấu hai chấm dẫn nhập lời rủa thầm ở đoạn tiếp theo."]'
- segment_id: YS-LN06/Text/part0027.html/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc nghiêng toàn bộ câu ''*Xuống địa ngục
    đi.*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0027.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn nội tâm & đại từ: chỉ bọc nghiêng
    hai câu đầu ''*Mình căm ghét các người từ tận đáy lòng. Bất cứ kẻ nào bày thêm
    việc cho mình đều đáng mục xương cả đi*.'' và giữ câu hỏi thứ ba ở dạng chữ thường
    khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ đại từ nội tâm ''Mình
    / mình'', gọi quân du kích là ''các người'' và lối tự xưng ngôi thứ ba ''Tanya
    tận tụy này''."]'
- segment_id: YS-LN06/Text/part0027.html/p000058
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: ''the former Entente Alliance government''
    -> ''chính phủ cựu Liên minh Hiệp ước''; giữ kính ngữ ''ạ'' ở cuối lời nhận xét
    của Serebryakov."]'
- segment_id: YS-LN06/Text/part0027.html/p000059
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & bước ngoặt nhận thức: Tanya xưng ''tôi'' trong
    thoại; giữ dấu ba chấm chuyển ý và sự nhận thức ''hay thực ra, tôi cho rằng chính
    đó mới là nguyên nhân''."]'
- segment_id: YS-LN06/Text/part0027.html/p000060
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & tên nhân vật: giữ tên ''Serebryakov'' và ''Tanya'',
    diễn đạt tự nhiên thành ngữ ''hits the nail on the head'' bằng ''đi trúng trọng
    tâm vấn đề''."]'
- segment_id: YS-LN06/Text/part0027.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Thoại & trích dẫn lồng: Tanya xưng ''Tôi''; giữ cặp dấu nháy đơn
    quanh cụm ''‘Ra vậy’''."]'
- segment_id: YS-LN06/Text/part0027.html/p000062
  kind: terminology_and_voice
  value: 'choices=["Thoại & quân hàm: ''Colonel?'' (Serebryakov hỏi Tanya) -> ''“Thưa
    Trung tá?”''."]'
- segment_id: YS-LN06/Text/part0027.html/p000063
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: ''the people of the Entente Alliance'' -> ''người
    dân của Liên minh Hiệp ước''."]'
- segment_id: YS-LN06/Text/part0027.html/p000064
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ bọc ''*Biết chuyện gì ạ?*'' khớp
    chính xác với thẻ em trong XHTML theo DEC-P01-002; quy chiếu Tanya trong trần
    thuật bằng ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0027.html/p000065
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc đan xen thoại – trần thuật, thuật ngữ & phủ định: giữ
    nguyên sự đan xen giữa lời thoại của Tanya và các câu bình luận nội tâm/trần thuật;
    ''the Entente Alliance army'' -> ''quân đội Liên minh Hiệp ước''; ''Norden'' ->
    ''Norden''; ''Entente Alliance soil'' -> ''mảnh đất Liên minh Hiệp ước''; ''The
    Entente Alliance government'' -> ''Chính phủ Liên minh Hiệp ước''; giữ dấu ba
    chấm và cụm phủ định ''những tấm gương về những điều không nên làm''."]'
- segment_id: YS-LN06/Text/part0027.html/p000066
  kind: terminology_and_voice
  value: 'choices=["Nghịch lý tu từ & thời gian: giữ sắc thái nghịch lý mỉa mai của
    ''the enlightening act of folly'' -> ''hành động ngu xuẩn có tác dụng khai sáng
    ấy'' và mối liên hệ nhân quả kéo dài từ quá khứ đến hiện tại (''Quá khứ u ám vẫn
    luôn ám ảnh họ... đang để lại những hệ quả dai dẳng.'')."]'
