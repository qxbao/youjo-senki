choices:
- segment_id: YS-LN06/Text/part0032.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & xưng hô: tác giả Carlo Zen tự xưng ''Tôi'' và gọi
    độc giả là ''các bạn''; ''Volume 6'' -> ''Tập 6''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & tên riêng: giữ phủ định ''không chờ đợi mà
    mua một lèo toàn bộ các tập tính đến Tập 6''; ''heroes among heroes at Kadokawa
    Enterbrain'' -> ''những anh hùng trong các bậc anh hùng tại Kadokawa Enterbrain'';
    tác giả xưng ''tôi''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & đại từ: ''probably'' -> ''chắc là''; ''mass
    hallucination'' -> ''cơn ảo giác tập thể'' (khớp P05-hallucination); đại từ gộp
    tác giả và độc giả dùng ''tất cả chúng ta''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc song hành & chức danh: giữ cấu trúc điệp ''yêu caffeine
    hơn tất thảy... yêu thịt hơn tất thảy... yêu gyoza hơn tất thảy''; ''my editor
    Fujita'' -> ''biên tập viên Fujita của tôi''; ''illustrator Shinotsuki'' -> ''họa
    sĩ minh họa Shinotsuki''; ''gyoza joint'' -> ''quán gyoza''; không có nhấn mạnh
    Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & phủ định: câu hỏi của Shinotsuki với biên tập
    viên dùng đại từ lịch sự ''Anh''; ''asked incisively'' -> ''hỏi xoáy vào trọng
    tâm''; câu đáp phủ định dứt khoát của Fujita dịch là ''Tiếc là không đâu!''; không
    có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập, tình thái & thuật ngữ: giữ quan hệ chuyển ý ''Ấy
    vậy mà giờ đây''; ''seems like a fait accompli'' -> ''xem chừng đã là chuyện ván
    đã đóng thuyền''; ''Tojo'' -> ''Tojo''; ''serializing a wonderful manga'' -> ''đăng
    dài kỳ một bộ manga tuyệt vời''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phỏng đoán & tên riêng: giữ sắc thái nghi vấn hài hước
    ''Phải chăng vị anh hùng Enterbrain đã trở nên mạnh mẽ hơn nữa rồi?''; không có
    nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Phủ định, đại từ & điển cố: tác giả xưng ''tôi'' và tự quy chiếu
    bằng ''mình'' ở mệnh đề phụ; giữ phủ định ''chưa bao giờ tưởng tượng nổi''; dịch
    chú thích trong ngoặc đơn là ''(Biết đâu đây chỉ là giấc mộng hồ điệp.)''; không
    có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & đại từ: ''fiction’s greatest rival'' ->
    ''kỳ phùng địch thủ lớn nhất của hư cấu''; giữ phủ định ''không còn bất ngờ trước
    bất cứ điều gì nữa'' và tình thái ''có lẽ'' cùng đại từ ''chúng ta''; không có
    nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Chức danh & tên riêng: ''designers at Tsubakiya Design'' -> ''các
    nhà thiết kế tại Tsubakiya Design''; ''proofreaders at Tokyo Publishing Service
    Center'' -> ''đội ngũ hiệu đính tại Tokyo Publishing Service Center''; ''my editor
    Fujita'' -> ''biên tập viên Fujita của tôi''; ''illustrator Shinotsuki'' -> ''họa
    sĩ minh họa Shinotsuki''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ & mức độ: tác giả xưng ''tôi'' và dùng ''chúng tôi'' cho
    tập thể thực hiện tác phẩm; giữ quan hệ mức độ ''đến mức tác phẩm có thể được
    chuyển thể thành anime!''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Xưng hô kết lời bạt: dịch thống nhất với các tập trước ''Hy vọng
    sẽ được gặp lại các bạn vào lần tới.''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN06/Text/part0032.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Định dạng ngày tháng & ký tên: dịch thống nhất với các tập trước
    ''Tháng 7 năm 2016 Carlo Zen''; không có nhấn mạnh Markdown."]'
