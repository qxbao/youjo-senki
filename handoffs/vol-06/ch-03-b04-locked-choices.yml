    chiếu Gassman."]'
- segment_id: YS-LN06/Text/part0015.html/p000096
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi phủ định & xưng hô: giữ câu hỏi nghi vấn phủ định
    của Calandro gọi Gassman là ''ngài'' về việc tâm lý con người thường đi chệch
    khỏi lý trí trong thực chiến."]'
- segment_id: YS-LN06/Text/part0015.html/p000097
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & thuật ngữ: giữ tình thái suy đoán ''Đó hẳn
    là một câu hỏi bắt nguồn từ kinh nghiệm chiến trận'', cụm ''những quân nhân Ildoa
    từng tham chiến trong các cuộc xung đột quy mô nhỏ ở thuộc địa'' và phủ định kép
    ''chẳng ngại thừa nhận rằng có rất nhiều điều cần học hỏi từ anh ta''."]'
- segment_id: YS-LN06/Text/part0015.html/p000098
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: quy chiếu Gassman bằng ''Ông / ông'', giữ
    sự đối chiếu giữa kinh nghiệm chiến đấu nơi thuộc địa thời trai trẻ, con đường
    hành chính về sau và tâm niệm trái tim luôn hướng về chiến trường."]'
- segment_id: YS-LN06/Text/part0015.html/p000099
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & đối lập: Gassman xưng ''Tôi / tôi'', gọi Calandro
    là ''anh''; giữ phép đối lập giữa ''một chính khách khoác quân phục'' và lời khẳng
    định ''đang mặc chung một bộ quân phục với anh đấy''."]'
- segment_id: YS-LN06/Text/part0015.html/p000100
  kind: terminology_and_voice
  value: 'choices=["Thoại, dấu câu, xưng hô & thuật ngữ: giữ dấu chấm lửng mở đầu
