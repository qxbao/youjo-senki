- segment_id: YS-LN06/Text/part0015.html/p000086
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô, tình thái & thuật ngữ: trần thuật quy chiếu Gassman
    bằng ''ông'' và Calandro bằng ''anh ta''; trong thoại Calandro xưng ''tôi'', gọi
    Gassman là ''ngài''; ''the Empire'' -> ''Đế quốc''; giữ tình thái suy đoán ''hẳn
    Calandro đã do dự'', nhịp ngập ngừng có dấu chấm lửng và lời thỉnh cầu tha thiết
    vì đang nắm sinh mạng binh sĩ trong tay."]'
- segment_id: YS-LN06/Text/part0015.html/p000087
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ, đại từ & thuật ngữ: ''intelligence officer'' -> ''sĩ
    quan tình báo''; quy chiếu Calandro bằng ''anh ta''; giữ quan hệ nhượng bộ giữa
    công việc bàn giấy ở hậu phương và việc là người hiểu rõ chiến trường."]'
- segment_id: YS-LN06/Text/part0015.html/p000088
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & phủ định: Gassman xưng ''tôi / mình'', gọi Calandro
    là ''anh''; giữ nụ cười gượng gạo, phủ định kép ''Tôi không phủ nhận rằng kế hoạch
    này của mình sẽ khuấy động tình hình…'' và khẳng định dứt khoát ''mọi chuyện sẽ
    không dẫn tới chiến tranh đâu.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000089
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Gassman bằng ''ông''; ''unscheduled
    field maneuvers'' -> ''các cuộc diễn tập dã chiến... không báo trước''; ''Ildoa
    Empire border'' -> ''biên giới giữa Ildoa và Đế quốc''; giữ đánh giá ''là một
    nước đi cực đoan''."]'
- segment_id: YS-LN06/Text/part0015.html/p000090
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: giữ câu hỏi gợi mở của Gassman xưng ''tôi''
    và gọi Calandro là ''anh''."]'
- segment_id: YS-LN06/Text/part0015.html/p000091
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đại từ: giữ cấu trúc phủ định mở rộng ''Calandro không
    phải là người duy nhất ném cho ông những ánh nhìn hoài nghi.''."]'
- segment_id: YS-LN06/Text/part0015.html/p000092
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & mức độ: ''the Empire'' -> ''Đế quốc''; ''battle
    of attrition'' -> ''trận chiến tiêu hao''; ''eastern front'' -> ''mặt trận phía
    Đông''; ''General Calderoni'' -> ''Tướng Calderoni''; giữ dấu ngoặc kép quanh
    chữ “khiêu khích” và dấu gạch ngang nối sang phản ứng xôn xao của các chỉ huy
    đồn trú lâu năm ở biên giới."]'
- segment_id: YS-LN06/Text/part0015.html/p000093
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định kép & giả định: giữ phủ định cả hai vế ''Cả chúng
    ta lẫn Đế quốc đều không muốn đánh nhau'', câu hỏi tu từ có dấu chấm lửng, định
    danh ''một màn phô trương thanh thế'' và câu giả định đối lập ''diễn ra vào lần
    sau, chứ không phải lần này''."]'
- segment_id: YS-LN06/Text/part0015.html/p000094
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Calandro xưng ''tôi'', gọi Gassman
    là ''thưa Tướng quân / ngài''; ''military politician'' -> ''quân nhân chính khách''."]'
- segment_id: YS-LN06/Text/part0015.html/p000095
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ bọc ''*Thì sao?*'' bằng dấu sao
