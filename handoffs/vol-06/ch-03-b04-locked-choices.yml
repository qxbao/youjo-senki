- segment_id: YS-LN06/Text/part0015.html/p000102
  kind: terminology_and_voice
  value: 'choices=[''So sánh nhượng bộ & điểm nhìn: giữ cấu trúc so sánh hơn giữa
    tướng địch tài ba và tướng phe mình chỉ vây quanh bằng những kẻ xu nịnh, cùng
    suy nghĩ tự hào của Gassman vì cho phép đưa ra ý kiến phản biện.'']'
