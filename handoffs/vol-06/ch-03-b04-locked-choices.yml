  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Gassman xưng ''Tôi'', gọi Calandro là ''anh'',
    công nhận phân tích xác đáng và chấp nhận lời xin lỗi để cho qua chuyện."]'
