    thuật'', hô ngữ ''thưa Tướng quân'' cùng miêu tả thái độ và góc cúi đầu hoàn hảo
    của Calandro."]'
- segment_id: YS-LN06/Text/part0015.html/p000101
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & thoại: chỉ bọc câu suy nghĩ nội
