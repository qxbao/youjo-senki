    -> ''vốn con người''."]'
- segment_id: YS-LN06/Text/part0008.html/p000072
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Serebryakov bằng ''cô ấy''; ''veteran''
    -> ''cựu binh''."]'
- segment_id: YS-LN06/Text/part0008.html/p000073
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định giảm nhẹ: ''NCOs'' -> ''các hạ sĩ quan'';
    giữ đại từ ''chúng ta'' và cách nói phủ định giảm nhẹ ''cũng chẳng phải chuyện
    gì tệ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000074
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc tương phản & thuật ngữ: giữ cấu trúc nhấn mạnh ''không
    phải các pháp sư tình nguyện mà chính những lính nghĩa vụ mới là những người đã
    trưởng thành thành cựu binh''."]'
- segment_id: YS-LN06/Text/part0008.html/p000075
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ bọc ''*Ààà*'' khớp với thẻ em
    trong XHTML theo DEC-P01-002; trần thuật ngôi thứ ba quy chiếu Tanya bằng ''Tanya''
    và ''nó'' theo DEC-P01-001; ''old-hand volunteers'' -> ''những người lính tình
    nguyện kỳ cựu''."]'
- segment_id: YS-LN06/Text/part0008.html/p000076
  kind: terminology_and_voice
  value: 'choices=["Độc thoại thành tiếng, phủ định & thuật ngữ: trong lời tự nhủ
    thành tiếng, Tanya dùng ''chúng ta'' và ''Tôi''; ''eastern front'' -> ''Mặt trận
    phía đông''; giữ các cấu trúc phủ định ''không có nghĩa là...'', ''Chẳng có lối
    thoát nào cả''."]'
- segment_id: YS-LN06/Text/part0008.html/p000077
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc song hành & tương phản: giữ hai mệnh đề song hành ''Họ
    có thể điều... và họ có thể gửi...'' đối lập với kết cục ''nhưng tất cả rồi sẽ
    chỉ bị kẻ địch và tuyết trắng nuốt chửng mà thôi''."]'
