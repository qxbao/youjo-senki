choices:
- segment_id: YS-LN06/Text/part0008.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Nhưng…*'' khớp với
    thẻ em trong XHTML theo DEC-P01-002; trần thuật ngôi thứ ba dùng tên riêng ''Tanya''."]'
- segment_id: YS-LN06/Text/part0008.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    không có chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0008.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, chức danh & đại từ: ''Lieutenant Serebryakov'' -> ''Trung
    úy Serebryakov''; ''adjutant'' -> ''sĩ quan phụ tá''; trần thuật quy chiếu Tanya
    bằng ''Tanya'' và ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: trần thuật quy chiếu Tanya bằng ''nó'', đơn
    vị bằng ''quân đội của họ''; ''headquarters building'' -> ''tòa nhà sở chỉ huy'';
    ''defensive positions'' -> ''Các công sự phòng ngự''; ''garrison village'' ->
    ''ngôi làng đồn trú''; ''settlement’s perimeter'' -> ''vành đai khu định cư''."]'
- segment_id: YS-LN06/Text/part0008.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & điều kiện: trần thuật dùng ''Tanya'' và ''nó''
    theo DEC-P01-001; giữ mệnh đề điều kiện ''nếu nó có thể công khai dạo bước xung
    quanh mà chẳng cần bận tâm...''; ''harassment attacks'' -> ''những đòn tấn công
    quấy rối''; ''partisans'' -> ''quân du kích''; ''snipers'' -> ''lính bắn tỉa''."]'
- segment_id: YS-LN06/Text/part0008.html/p000038
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & nghĩa: câu nhận định khái quát về việc hai sĩ quan
    thoải mái sóng bước bên nhau là một điều xa xỉ.'']'
- segment_id: YS-LN06/Text/part0008.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc giả định: ''eastern front'' -> ''mặt trận
    phía đông''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe Salamander''; giữ mệnh
    đề điều kiện ''Nếu... chỉ riêng những câu chuyện thôi cũng sẽ làm họ phải ghen
    tị''."]'
- segment_id: YS-LN06/Text/part0008.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & phủ định: giữ chi tiết ''mà không cần đội hộ tống'' và
    nhận xét về mức độ bất ổn ở phía đông."]'
- segment_id: YS-LN06/Text/part0008.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trong thoại: Tanya dùng ''chúng ta'' cho đơn
    vị, gọi ''Trung úy Serebryakov'' và ''Cô''; giữ đúng đối tượng và thời quá khứ
    của câu hỏi về cảm nghĩ khi nhìn thấy đống quân trang."]'
- segment_id: YS-LN06/Text/part0008.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu câu: Serebryakov gọi Tanya là ''Thưa Trung tá'',
    dùng ''chúng ta'' và giữ dấu chấm lửng bỏ lửng câu nói."]'
- segment_id: YS-LN06/Text/part0008.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Tanya xưng ''tôi'', gọi Serebryakov là ''Cô'';
    giữ phủ định ''Cô không cần nói thêm nữa''."]'
- segment_id: YS-LN06/Text/part0008.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả & so sánh: giữ cấu trúc so sánh hơn ''còn ảm
    đạm hơn cả dự tính'' và quan hệ hệ quả ''nên Tanya lập tức chấm dứt câu chuyện''."]'
- segment_id: YS-LN06/Text/part0008.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Phủ định giảm nhẹ: giữ sắc thái phủ định giảm nhẹ ''khó lòng gọi
    là tác phong đúng mực của một người chỉ huy''."]'
- segment_id: YS-LN06/Text/part0008.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & phủ định: dùng đại từ khái quát ''bạn'' và
    phủ định ''không được phép để lộ sự dao động ra ngoài''."]'
- segment_id: YS-LN06/Text/part0008.html/p000047
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: lời than của Tanya xưng ''tôi'', diễn đạt tự nhiên
    ý muốn uống một tách cà phê nóng cho trôi đi cảm giác nặng nề."]'
- segment_id: YS-LN06/Text/part0008.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & thuật ngữ: lời đáp lễ phép của Serebryakov có tiểu
    từ ''ạ''; ''supply shipment'' -> ''chuyến hàng tiếp tế''."]'
- segment_id: YS-LN06/Text/part0008.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nhấn mạnh Markdown: ''Lieutenant'' -> ''Trung úy'';
    chỉ bọc ''*Đúng là tin tốt lành.*'' khớp chính xác với thẻ em trong XHTML theo
    DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0008.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''logistics'' -> ''khâu hậu cần''; ''provisions''
    -> ''nhu yếu phẩm''; ''eastern front'' -> ''mặt trận phía đông''; ''luxury items''
    -> ''các mặt hàng xa xỉ''; giữ dấu chấm lửng chuyển ý và tình thái ''thường có
    xu hướng bị xếp ở mức ưu tiên thấp''."]'
- segment_id: YS-LN06/Text/part0008.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi tự vấn & nghĩa: Serebryakov xưng ''Tôi'' kèm
    ''ạ'' cuối lời thoại; giữ câu hỏi tự lựa lời ''Tôi nên nói thế nào nhỉ?'' và sự
    đối lập giữa tiêu chuẩn thấp nhất có thể với việc vẫn là hàng thật."]'
- segment_id: YS-LN06/Text/part0008.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: Tanya dùng ''chúng ta'' và ''tôi'';
    giữ điều kiện phủ định ''Miễn không phải thứ cà phê thay thế kinh hoàng được phục
    vụ trong nhà ăn Bộ Tổng tham mưu''."]'
- segment_id: YS-LN06/Text/part0008.html/p000053
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điểm nhìn: Serebryakov đáp ''Rõ. Xin cứ giao cho tôi
    ạ.''; tiếp nối bằng câu trần thuật và nhận định khen ngợi."]'
- segment_id: YS-LN06/Text/part0008.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya xưng ''Tôi'' (''Tôi rất mong chờ đấy.'')."]'
- segment_id: YS-LN06/Text/part0008.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Quan hệ so sánh & đối lập: giữ chi tiết ''Tự chuốc lấy việc phải
    nghe tin xấu suốt ngày'' và cấu trúc so sánh ngang bằng ''quá nhiều căng thẳng
    cũng làm suy kiệt sức lực chẳng kém gì việc thiếu hẳn nó''."]'
- segment_id: YS-LN06/Text/part0008.html/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*Đến giờ nghỉ ngơi rồi.*''
    khớp với thẻ em trong XHTML theo DEC-P01-002; ''provisional headquarters'' ->
    ''sở chỉ huy lâm thời''."]'
- segment_id: YS-LN06/Text/part0008.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ: giữ cấu trúc nhượng bộ ''dẫu nhỏ bé đến đâu''."]'
- segment_id: YS-LN06/Text/part0008.html/p000058
  kind: terminology_and_voice
  value: 'choices=["Điều kiện nhượng bộ (cần sửa theo finding): diễn đạt đúng nghĩa
    thành ngữ điều kiện tối thiểu (''Ít nhất thì cũng là chút hạnh phúc.'' hoặc ''Dẫu
    chẳng được gì khác, ít nhất cũng là niềm hạnh phúc.''), không dịch thành cấu trúc
    loại trừ ''Không gì khác ngoài...''."]'
- segment_id: YS-LN06/Text/part0008.html/p000059
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: câu hỏi lại của Serebryakov dịch ''Ma’am?''
    -> ''Thưa Trung tá?''."]'
- segment_id: YS-LN06/Text/part0008.html/p000060
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba quy chiếu Tanya bằng
    ''Tanya'' và ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ nội tâm: độc thoại nội tâm trực tiếp của Tanya
    dùng ''Mình'' theo DEC-P01-001; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0008.html/p000062
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: lời cảm thán thành tiếng của Tanya xưng ''tôi''."]'
- segment_id: YS-LN06/Text/part0008.html/p000063
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Serebryakov xưng ''Tôi'', gọi Tanya là ''Trung
    tá'' kèm tiểu từ ''ạ''."]'
- segment_id: YS-LN06/Text/part0008.html/p000064
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đối lập thời gian: Tanya xưng ''tôi / Tôi'', giữ rõ
    sự chuyển biến nhận thức từ quá khứ (''Trước đây tôi từng coi thường... Tôi đã
    lầm.'') sang đánh giá hiện tại."]'
- segment_id: YS-LN06/Text/part0008.html/p000065
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhân quả nhấn mạnh: giữ cấu trúc nhấn mạnh nguyên nhân
    ''Chính vì đang sống giữa những điều bất thường nên chúng ta mới có thể...''."]'
- segment_id: YS-LN06/Text/part0008.html/p000066
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya gọi Serebryakov là ''cô'' và xưng ''tôi''
    trong câu hỏi nhắc pha cà phê."]'
- segment_id: YS-LN06/Text/part0008.html/p000067
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tu từ: Serebryakov xưng ''Tôi'' kèm ''ạ'', giữ đủ bốn
    vế so sánh cổ điển về cà phê."]'
- segment_id: YS-LN06/Text/part0008.html/p000068
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: lời cảm ơn ngắn gọn của Tanya (''Cảm ơn nhé.'')."]'
- segment_id: YS-LN06/Text/part0008.html/p000069
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái: quy chiếu Serebryakov bằng ''cô ấy''; giữ quan
    hệ chuyển ý ''chỉ đang nói đùa thôi, nhưng...''."]'
- segment_id: YS-LN06/Text/part0008.html/p000070
  kind: terminology_and_voice
  value: 'choices=["Đại từ & chức danh: quy chiếu Serebryakov bằng ''Cô ấy''; ''adjutant''
    -> ''sĩ quan phụ tá''."]'
- segment_id: YS-LN06/Text/part0008.html/p000071
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: độc thoại nội tâm của Tanya dùng
    ''chúng tôi'' (cho hai người), ''mình'' (cho bản thân theo DEC-P01-001) và ''cô
