choices:
- segment_id: YS-LN06/Text/part0021.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya nói với nhóm thuộc cấp: tự xưng ''Tôi - tôi'', gọi
    thuộc cấp là ''các người'', giữ cấp bậc và tên ''Trung tá Uger''."]'
- segment_id: YS-LN06/Text/part0021.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Thoại thuộc cấp đáp lại Tanya: tự xưng ''Bọn tôi'', giữ sắc thái
    phân trần thân mật ''trên tinh thần đồng đội vào sinh ra tử thôi mà''."]'
- segment_id: YS-LN06/Text/part0021.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng đại từ ''nó''; giữ
    cấu trúc tăng tiến ''không chỉ ba trung úy mà ngay cả Weiss'' và sắc thái bực
    dọc trước ''những lời lẽ dẻo miệng''."]'
- segment_id: YS-LN06/Text/part0021.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ ''*Haiz…*'' đúng phạm
    vi từ cảm thán in nghiêng ở đầu câu; trần thuật giữ tên ''Tanya''."]'
- segment_id: YS-LN06/Text/part0021.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''nó''; thoại Tanya
    nói với người bồi bàn xưng ''tôi - anh'' và giữ cụm ''các sĩ quan của tôi''."]'
- segment_id: YS-LN06/Text/part0021.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và bình luận tự quy chiếu theo DEC-P01-001: phân biệt
    ''nó'' (trần thuật về vẻ mặt của Tanya) với ''mình'' (chủ thể tự xưng trong mệnh
    đề xen ''mình cũng phải nói thêm rằng''); thoại người bồi bàn giữ ''Tôi hiểu rồi
    ạ,''."]'
- segment_id: YS-LN06/Text/part0021.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên ''Tanya'', phản thân ''mình'', quy chiếu người
    bồi bàn là ''anh ta'' và phủ định ''mà chẳng nói một lời nào''."]'
- segment_id: YS-LN06/Text/part0021.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya nói với thuộc cấp: gọi ''các chiến hữu'', giữ lời
    rủ ''Hãy cùng nhau nhấm nháp khoảnh khắc nhỏ nhoi này bên tách cà phê nào''."]'
- segment_id: YS-LN06/Text/part0021.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ ''*Sẵn sàng chưa?*''
    đúng phạm vi câu hỏi in nghiêng trong nguồn; trần thuật về Tanya theo DEC-P01-001
    dùng ''Nó''."]'
- segment_id: YS-LN06/Text/part0021.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''nó''; giữ phủ định
    nhượng bộ ''dù đây chẳng phải rượu bia gì, thế mà cảm giác ấy lại chẳng lấy làm
    kỳ quặc cho lắm''."]'
- segment_id: YS-LN06/Text/part0021.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Nội tâm Tanya: giữ nghịch lý ''vừa thấy lạ lùng lại vừa chẳng
    có gì lạ cả…'' và giả định đánh giá ''Nếu chỉ nốc cạn một hơi thì phí phạm quá''."]'
- segment_id: YS-LN06/Text/part0021.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Thoại nâng cốc của Tanya: dùng ngôi gộp ''chúng ta'', giữ cặp
    khả năng đối lập ''Vì người đồng minh có thể sẽ quy thuận hoặc không quy thuận
    chúng ta! Cạn ly!''."]'
- segment_id: YS-LN06/Text/part0021.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''Nó''; giữ phủ định
    và quan hệ đối lập ''Nó vốn không định biến chuyện này thành một kiểu nghi thức
    tập thể, nhưng dù sao thì thế này cũng vui''."]'
- segment_id: YS-LN06/Text/part0021.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''Nó'' và chuỗi hành
    động ''thong thả nhấp một ngụm, nhắm mắt lại và nhấm nháp hương vị ấy''."]'
- segment_id: YS-LN06/Text/part0021.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: bọc toàn bộ câu cảm thán
    nội tâm ''*Aaaa, hương vị của nền văn minh.*'' khớp với nguồn."]'
- segment_id: YS-LN06/Text/part0021.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''nó'' ở cả hai mệnh
    đề."]'
- segment_id: YS-LN06/Text/part0021.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''nó''; nhấn mạnh Markdown
    theo DEC-P01-002: giữ ''*Trung tá Uger thật biết cách chọn quán*'' đúng phạm vi
    ý nghĩ in nghiêng."]'
- segment_id: YS-LN06/Text/part0021.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ hình ảnh ẩn dụ ''con dơi chao
    liệng hết bên này sang bên khác'' và điều kiện ''chừng nào con dơi ấy còn hữu
    dụng, nó sẽ vẫn được tất cả các bên hoan nghênh''."]'
- segment_id: YS-LN06/Text/part0021.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ tên ''Ildoa'', ''Đế quốc'', ''Khối
    Thịnh vượng chung'', ''Liên bang'' và thế đối lập giữa gây phiền toái cho Đế quốc
    với ban ân huệ cho hai nước kia."]'
- segment_id: YS-LN06/Text/part0021.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ cấu trúc điều kiện ''Nếu gọi
    đó là sự trung thành với lý tính quốc gia của nó, thì chuyện cũng chỉ có vậy mà
    thôi''."]'
- segment_id: YS-LN06/Text/part0021.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ ''*vững vàng*'' đúng
    phạm vi từ in nghiêng ở cuối câu."]'
- segment_id: YS-LN06/Text/part0021.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ giả định trái thực tế ''Nếu nó
    không trung thành với hợp đồng đã ký thì lại là chuyện khác'', các phủ định về
    điều khoản không thành văn và nhận định ''Những kiểu bội bạc không nằm trong hợp
    đồng cần phải được chấp nhận''."]'
- segment_id: YS-LN06/Text/part0021.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gián tiếp tự do: giữ tên ''Tanya'', đối lập ''ký kết
    hợp đồng chứ đâu phải trao đổi ý kiến'' và phủ định kép ''không dám thừa nhận
    sai lầm của chính mình khi đã không đọc kỹ hợp đồng''."]'
- segment_id: YS-LN06/Text/part0021.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ thành ngữ mở đầu ''Dù tốt hay
    xấu'' và nhận định ''Ildoa là một người chơi biết điều''."]'
- segment_id: YS-LN06/Text/part0021.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ tương phản ''Trên danh nghĩa,
    đó là một đồng minh, nhưng trên thực tế lại là một nước trung lập''."]'
- segment_id: YS-LN06/Text/part0021.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tự quy chiếu của Tanya: dùng ngôi gộp ''chúng ta'', giữ
    tên ''Ildoa'' và phủ định ''chẳng phải cái giá tệ''."]'
- segment_id: YS-LN06/Text/part0021.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại của Tanya: giữ câu hỏi tự vấn ''Dù nói vậy, không
    biết sắp tới nước này sẽ làm gì đây?''."]'
- segment_id: YS-LN06/Text/part0021.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngắn: ''Câu hỏi lầm bầm ấy chính là tất cả vấn đề''."]'
- segment_id: YS-LN06/Text/part0021.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: bọc toàn bộ câu hỏi nội tâm
    ''*Vương quốc Ildoa giờ sẽ làm gì đây?*'' khớp với nguồn."]'
- segment_id: YS-LN06/Text/part0021.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ sự chuyển đổi đại từ quy chiếu
    Ildoa từ ''Nó'' (quốc gia) sang ''họ'' (những người lãnh đạo/điều hành) sát theo
    bản gốc."]'
- segment_id: YS-LN06/Text/part0021.html/p000031
  kind: terminology_and_voice
  value: 'choices=[''Thoại độc thoại của Tanya: giữ chuỗi ba câu hỏi lựa chọn nối
    tiếp về hướng đi của Ildoa.'']'
- segment_id: YS-LN06/Text/part0021.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ tên ''Vương quốc Ildoa'', đại
    từ ''nó'' và cụm chỉ ngôi thứ ba số nhiều ''những kẻ này'' ở câu sau."]'
- segment_id: YS-LN06/Text/part0021.html/p000033
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ câu điều kiện và phủ định ''trò
    chơi mà Ildoa đang cố chơi không phải trò chơi một người''."]'
- segment_id: YS-LN06/Text/part0021.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ ''Đế quốc'' và nhận định ''Mấu
    chốt sẽ nằm ở cách Đế quốc xử lý chuyện này''."]'
- segment_id: YS-LN06/Text/part0021.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Nội tâm phân tích của Tanya: giữ đánh giá phủ định hàm ẩn ''Đáng
    buồn thay, thật khó mà nói rằng Đế quốc giỏi trò chơi này''."]'
- segment_id: YS-LN06/Text/part0021.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ ''*Biết địch biết ta*''
    đúng phạm vi cụm in nghiêng; theo DEC-P01-001: dùng ''nó'' trong câu trần thuật
    ở giữa, dùng ''chúng ta'' và ''mình'' trong lời lẩm bẩm tự quy chiếu của Tanya;
    giữ các phủ định về giới hạn của cấp chỉ huy thực địa trước sai lầm cấp chiến
    lược."]'
- segment_id: YS-LN06/Text/part0021.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gián tiếp tự do theo DEC-P01-001: dùng ''nó'', giữ
    giả định trái thực tế ở hiện tại ''Giá như nó đang phục vụ trong bộ phận nòng
    cốt của Bộ Tổng tham mưu thì chuyện đã khác''."]'
