choices:
- segment_id: YS-LN06/Text/part0013.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ (cân nhắc chỉnh nhẹ theo finding minor):
    Loria dùng ''chúng ta'', gọi cử tọa là ''Thưa các đồng chí''; ''the Empire'' ->
    ''Đế quốc''; ''the Federation'' -> ''Liên bang''; ''promise of independence''
    -> ''lời hứa trao độc lập / lời hứa về nền độc lập''."]'
- segment_id: YS-LN06/Text/part0013.html/p000037
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ đối lập: giữ đối lập giữa cách buông lời như thể tình
    cờ bỏ lửng giữa phòng họp và sức nặng vô cùng nghiêm trọng của chúng.'']'
- segment_id: YS-LN06/Text/part0013.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Tương phản hai nhóm người nghe: giữ đối lập giữa ''Những người
    khôn ngoan hiểu được vấn đề thì lặng lẽ gật đầu'' và ''đám khờ khạo đinh ninh
    rằng Loria chỉ đang cố đánh lạc hướng khỏi thất bại của mình lại khó lòng giấu
    nổi nụ cười nhếch mép''."]'
- segment_id: YS-LN06/Text/part0013.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Sắc thái trần thuật: giữ câu nhận xét ngắn gọn ''Thật dễ dàng
    nhận ra bầu không khí giễu cợt ấy.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & dấu câu: chỉ bọc ''*Ààà, trình độ
    trí tuệ của các người quả thực hiện rõ mồn một trên mặt đấy…*'' khớp chính xác
    với thẻ em trong XHTML theo DEC-P01-002; giữ dấu chấm lửng cuối câu."]'
- segment_id: YS-LN06/Text/part0013.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & tình thái bắt buộc: Loria dùng ''Chúng ta'';
    ''ethnic self-determination'' -> ''quyền tự quyết dân tộc''; ''the imperials''
    -> ''quân Đế quốc''; ''the separatists'' -> ''đám ly khai''; ''the Imperial Army''
    -> ''Lục quân Đế quốc''; giữ cấu trúc ''không còn lựa chọn nào khác ngoài việc
    kết luận rằng''."]'
- segment_id: YS-LN06/Text/part0013.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & đại từ: giữ dấu chấm lửng mở đầu ''…Nhưng Loria vẫn
    phải tiếp tục phần báo cáo của mình'', quy chiếu Loria bằng ''gã''."]'
- segment_id: YS-LN06/Text/part0013.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu ngoặc kép: ''Federation Army'' -> ''Quân đội Liên
    bang''; giữ dấu ngoặc kép quanh ''“người dân địa phương”'' và mức độ kháng cự
    quyết liệt vốn bình thường chỉ dành cho quân xâm lược."]'
- segment_id: YS-LN06/Text/part0013.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa (cân nhắc chỉnh nhẹ theo finding minor): ''embedded
    observers'' -> ''các quan sát viên đi cùng đơn vị / các quan sát viên phái cử
    tại chỗ''; ''Federation Army'' -> ''Quân đội Liên bang''."]'
- segment_id: YS-LN06/Text/part0013.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: ''As you all know already'' -> ''Như
    tất cả các đồng chí đều đã biết''; ''the Imperial Army'' -> ''Lục quân Đế quốc'';
    ''freedom of movement'' -> ''sự tự do cơ động''; dùng ''chúng tôi'' (đại diện
    cơ quan báo cáo) hoặc ''chúng ta''."]'
- segment_id: YS-LN06/Text/part0013.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ tăng tiến: ''separatist ethnic minority groups''
    -> ''các nhóm sắc tộc thiểu số ly khai''; ''occupied territories'' -> ''các vùng
    lãnh thổ bị chiếm đóng''; giữ đối lập tăng tiến ở câu sau."]'
- segment_id: YS-LN06/Text/part0013.html/p000047
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ mức độ: ''Federation’s Communist Party'' ->
    ''Đảng Cộng sản Liên bang''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''the
    separatists'' -> ''đám ly khai''; ''peacekeeping duties'' -> ''nhiệm vụ giữ gìn
    trật tự''."]'
- segment_id: YS-LN06/Text/part0013.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & câu hỏi tu từ: ''Federation'' -> ''Liên
    bang''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''mobile warfare'' -> ''lối
    tác chiến cơ động''; ''the Empire'' -> ''Đế quốc''; ''partisans'' -> ''quân du
    kích''; giữ nguyên hai câu hỏi tu từ chứa phủ định ở cuối đoạn."]'
- segment_id: YS-LN06/Text/part0013.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ & giả định phủ định: giữ cấu trúc ''Nếu đây chưa
    phải là một viễn cảnh kinh hoàng, thì còn cái gì mới phải nữa?''."]'
- segment_id: YS-LN06/Text/part0013.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Thoại, dấu câu, tình thái & thuật ngữ: giữ dấu chấm lửng ở hai
    vế thoại của Loria; ''political officers'' -> ''Các sĩ quan chính trị''; ''Imperial
    Army'' -> ''Lục quân Đế quốc''; ''regional separatists'' -> ''đám ly khai địa
    phương''; ''united front'' -> ''mặt trận thống nhất''; giữ tình thái ''dường như''."]'
- segment_id: YS-LN06/Text/part0013.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: giữ dấu gạch ngang dài giải thích ''Một mặt
    trận thống nhất—nói cách khác là kề vai sát cánh chiến đấu cùng nhau.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ câu chuyển ''Nhưng ý nghĩa của nó không
    hề đơn giản như những gì bề mặt câu chữ gợi ra.''."]'
- segment_id: YS-LN06/Text/part0013.html/p000053
  kind: terminology_and_voice
  value: 'choices=["Phủ định & sắc thái: giữ khẳng định nhấn mạnh ở câu đầu và phủ
    định tuyệt đối ''sẽ chẳng bao giờ nhìn nhận sai tầm quan trọng của chúng'' ở câu
    hai."]'
- segment_id: YS-LN06/Text/part0013.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & điều kiện: giữ cấu trúc điều kiện phủ định kép
    ''Một mặt trận thống nhất sẽ không thể tồn tại nếu những người lính trong cuộc
    không có niềm tin tuyệt đối...''."]'
- segment_id: YS-LN06/Text/part0013.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Thoại, dấu câu, tình thái & phủ định: giữ dấu chấm lửng mở đầu,
    đại từ ''chúng ta'', tình thái ''Có lẽ... nên'' và nhận định phủ định ''chắc chắn
    rằng không nên trông đợi nhiều vào sự hợp tác từ các đồng chí của mình tại những
    vùng lãnh thổ bị chiếm đóng nữa''."]'
- segment_id: YS-LN06/Text/part0013.html/p000056
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & câu hỏi tu từ phủ định: người chất vấn xưng ''tôi'',
    gọi Loria là ''thưa đồng chí / đồng chí''; ''the separatists'' -> ''đám ly khai'';
    ''the party'' -> ''Đảng''; giữ câu hỏi phủ định ''chẳng lẽ chúng ta không thể
    âm thầm nhổ tận gốc bọn chúng từ trong bóng tối sao?''."]'
- segment_id: YS-LN06/Text/part0013.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*Xét về mặt tuân thủ
    đường lối của Đảng thì đó là một đề xuất rất hay*'' khớp chính xác với thẻ em
    trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0013.html/p000058
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & đại từ: chỉ bọc ''*Khốn nỗi, kiểu
    câu trả lời rập khuôn theo sách vở đó chẳng có chút ý nghĩa nào khi đem đặt trước
    thực tại chiến trường.*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002;
    câu sau để thường, quy chiếu Loria bằng ''gã''."]'
- segment_id: YS-LN06/Text/part0013.html/p000059
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép, đại từ & xưng hô: giữ phủ định kép ở câu trần thuật
    đầu và trong lời thoại (''tôi không cho rằng điều đó là bất khả thi''); Loria
    quy chiếu bằng ''gã'' trong trần thuật, xưng ''tôi'' / ''chúng ta'' và gọi người
    chất vấn là ''thưa đồng chí / đồng chí''."]'
- segment_id: YS-LN06/Text/part0013.html/p000060
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng & xưng hô: giữ nét lắp bắp ''“T-tôi sao, thưa
    đồng chí?”''."]'
- segment_id: YS-LN06/Text/part0013.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & sắc thái trần thuật: Loria xưng ''Tôi'', gọi
    đối phương là ''đồng chí''; giữ sự tương phản lạnh lùng giữa đòn đe dọa ngầm điều
    người ra hiện trường và nụ cười hiền hậu của Loria."]'
