  value: 'choices=["Thoại, phủ định, tình thái quá khứ & thuật ngữ: dùng ''Chúng tôi''
    khi báo cáo kết quả thử nghiệm và ''chúng ta'' khi tiếc nuối về trang bị chung;
    giữ phủ định ''Ngay cả... cũng không ăn thua'' và giả định tiếc nuối quá khứ ''nhưng…
    lẽ ra chúng ta phải mang theo pháo hạng nặng''; ''penetration formulas'' -> ''thuật
    thức xuyên phá''; ''heavy artillery'' -> ''pháo hạng nặng''."]'
- segment_id: YS-LN06/Text/part0011.html/p000306
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: câu trần thuật đầu để chữ
    thường; bọc toàn bộ câu hỏi nội tâm thứ hai ''*Chúng ta chọn đại một ngôi làng
    ngẫu nhiên, thế mà tình cờ nơi đó lại có hệ thống phòng thủ kiên cố đến mức cần
    phải có pháo hạng nặng mới chiếm được ư?*'' khớp chính xác với thẻ em trong XHTML
    theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0011.html/p000307
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: giữ dấu chấm lửng mở đầu, đại từ ''Tôi'' và
    phủ định ''chưa bao giờ ngờ rằng họ lại chuẩn bị kỹ lưỡng đến mức này''."]'
- segment_id: YS-LN06/Text/part0011.html/p000308
  kind: terminology_and_voice
  value: 'choices=["Đại từ, giới hạn & thuật ngữ: quy chiếu Drake bằng ''Ông'', giữ
    từ giới hạn ''chỉ biết đến''; ''marine mage'' -> ''pháp sư hải quân đánh bộ'';
    ''counterinsurgency battles'' -> ''các trận đánh chống nổi dậy''."]'
- segment_id: YS-LN06/Text/part0011.html/p000309
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, phủ định & thuật ngữ: trần thuật quy chiếu
