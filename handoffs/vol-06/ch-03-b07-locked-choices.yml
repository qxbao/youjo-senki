choices:
- segment_id: YS-LN06/Text/part0017.html/p000034
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật ngôi thứ ba; ''An Operations
    officer'' -> ''Một sĩ quan thuộc Cục Tác chiến''; ''defensive proposal'' -> ''phương
    án phòng ngự''; không có chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0017.html/p000035
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*Vì lý do gì
    đó*'' khớp chính xác với cụm in nghiêng trong XHTML theo DEC-P01-002; quy chiếu
    Zettour bằng ''Ông''; ''Kingdom of Ildoa'' -> ''Vương quốc Ildoa''; ''principle
    geopolitical feature'' -> ''đặc điểm địa chính trị cốt yếu''; giữ phủ định ''không
    phải là một ý tồi'' và ''khiến Zettour không ưng''."]'
- segment_id: YS-LN06/Text/part0017.html/p000036
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giả định: ''army and navy'' -> ''lục quân
    và hải quân''; ''main forces'' -> ''lực lượng chủ lực''; ''naval fleet'' -> ''hạm
    đội hải quân''; giữ phủ định ''đây không phải là một quốc gia có thể tham chiến
    chỉ bằng lục quân'' và câu điều kiện giả định ''Nếu thực sự có ý định gây chiến,
    hẳn nước này đã phải đang tập kết...''."]'
- segment_id: YS-LN06/Text/part0017.html/p000037
  kind: terminology_and_voice
  value: 'choices=["Giả định: giữ nguyên quan hệ điều kiện – hệ quả ''Nếu họ thực
    lòng định đánh, đó sẽ là điều đương nhiên.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000038
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & thuật ngữ: Zettour xưng ''Tôi'' trong thoại
    và được quy chiếu bằng ''Ông'' trong trần thuật; ''Ildoa’s navy'' -> ''Hải quân
    Ildoa''; ''capital ships'' -> ''các tàu chủ lực''; giữ đúng câu hỏi về hoạt động
    hải quân và vị trí tàu chủ lực."]'
- segment_id: YS-LN06/Text/part0017.html/p000039
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đại từ: giữ câu báo cáo phủ định ngắn gọn ''Chưa thấy
    dấu hiệu nào cho thấy chúng đang tập kết cả.'', dùng ''chúng'' quy chiếu các tàu
    chủ lực của Ildoa."]'
- segment_id: YS-LN06/Text/part0017.html/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: sĩ quan báo cáo dùng ''của ta''
    (chỉ lực lượng hải quân Đế quốc) và ''chúng tôi'' (bộ phận báo cáo); ''regularly
    scheduled exercises'' -> ''Các cuộc diễn tập định kỳ theo lịch trình''; ''imminent
    combat maneuvers'' -> ''những cuộc cơ động tác chiến sắp sửa diễn ra''; giữ phủ
    định ở cả hai vế."]'
- segment_id: YS-LN06/Text/part0017.html/p000041
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật ngôi thứ ba; ''officers in charge
    of naval intelligence'' -> ''các sĩ quan phụ trách tình báo hải quân''; giữ mức
    độ ''gần như không sao tả xiết''."]'
- segment_id: YS-LN06/Text/part0017.html/p000042
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & thuật ngữ: quy chiếu Zettour bằng ''ông'';
    giữ tình thái dè dặt ''Ít nhất thì, theo những gì ông có thể nhận định, có vẻ
    như Ildoa không có ý định khơi mào giao tranh'' và ''dường như chúng vẫn đang
    phân tán''; ''territorial waters'' -> ''lãnh hải''; ''convoy duty'' -> ''nhiệm
    vụ hộ tống''; ''peacetime or neutral stance'' -> ''tư thế thời bình hoặc trung
    lập''."]'
- segment_id: YS-LN06/Text/part0017.html/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định mức độ: ''Kingdom of Ildoa'' -> ''Vương quốc
    Ildoa''; giữ mức độ phủ định xác suất ''gần như bằng không''."]'
- segment_id: YS-LN06/Text/part0017.html/p000044
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi & thuật ngữ kinh tế: phân biệt rõ nghĩa ''stocks'' tại
    đây là ''Cổ phiếu của các công ty dược phẩm''; giữ đúng mục đích hỏi thêm để chắc
    chắn hơn của Zettour."]'
- segment_id: YS-LN06/Text/part0017.html/p000045
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu báo cáo phủ định ''Chưa phát hiện thấy biến
    động lớn nào ở Ildoa cả.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000046
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Lạ thật*'' cho câu
    nội tâm trực tiếp khớp với thẻ em trong XHTML theo DEC-P01-002; câu sau giữ làm
    trần thuật phân tích của Zettour."]'
- segment_id: YS-LN06/Text/part0017.html/p000047
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & nghĩa: giữ nhận định khái quát về sự phung phí sinh
    mạng con người trong chiến tranh hiện đại.'']'
- segment_id: YS-LN06/Text/part0017.html/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định phủ định: dịch ''a stock of all sorts of
    medical products'' là ''một lượng dự trữ đủ loại sản phẩm y tế'' và ''medical
    supplies'' là ''vật tư y tế''; giữ cấu trúc so sánh và điều kiện phủ định ''Hệt
    như đạn dược, vật tư y tế mà không ra tới chiến trường kịp lúc thì cũng chẳng
    có tác dụng gì.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000049
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh, tình thái & địa danh: ''Unified States'' -> ''Hợp chúng
    quốc''; ''third-party countries'' -> ''các nước thứ ba''; giữ tình thái phỏng
    đoán ''Rất có thể họ đang nhập khẩu đấy.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000050
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: cấp dưới đáp lời Zettour bằng ''Làm ngay
    đây, thưa Trung tướng.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000051
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc nhượng bộ & nhấn mạnh ý: giữ nguyên phần chêm giữa hai
    dấu gạch ngang dài ''Ngay cả khi đó không phải là một cuộc xâm lược thực sự mà
    chỉ là đòn hù dọa — hoặc có lẽ chính vì đó là đòn hù dọa —''."]'
- segment_id: YS-LN06/Text/part0017.html/p000052
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Thật chẳng biết phải
    nghĩ sao nữa…*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; phần
    sau giữ làm lời dẫn trần thuật."]'
- segment_id: YS-LN06/Text/part0017.html/p000053
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi giả định & phủ định: ''Kingdom of Ildoa'' -> ''Vương quốc
    Ildoa''; giữ câu hỏi suy luận từ tiền đề phủ định ''Nếu các công ty dược phẩm
    lớn ở Vương quốc Ildoa không ghi nhận nhu cầu tăng cao, thì phải chăng quốc gia
    này đang bí mật thu mua vật tư?''."]'
- segment_id: YS-LN06/Text/part0017.html/p000054
  kind: terminology_and_voice
  value: 'choices=["Giả định & tình thái: giữ câu điều kiện giả định và mức độ khả
    năng trong tương lai ''thì về lâu dài, Ildoa có thể phát triển thành một mối đe
    dọa.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000055
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & mệnh lệnh: Zettour xưng ''Tôi'', giao mệnh lệnh cho
    cấp dưới báo cáo ngay bất kể giờ giấc."]'
- segment_id: YS-LN06/Text/part0017.html/p000056
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhượng bộ: quy chiếu Zettour bằng ''ông''; ''stock
    prices'' -> ''giá cổ phiếu''; giữ quan hệ nhượng bộ giữa thông tin bổ trợ và lượng
    tình báo hiện có."]'
- segment_id: YS-LN06/Text/part0017.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giả định: ''logistics'' / ''logistical issues''
    -> ''hậu cần'' / ''các vấn đề hậu cần''; ''supply team'' -> ''đội ngũ tiếp vận'';
    ''bite a gun barrel'' -> ''ngậm nòng súng tự sát''; giữ trọn lập luận phủ định
    và giả định của Zettour."]'
- segment_id: YS-LN06/Text/part0017.html/p000058
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & phủ định: người nói xưng ''tôi'', giữ dấu
    chấm lửng mở đầu, tình thái ''tôi đoán là'' và phủ định ''kết luận vẫn không thay
    đổi''."]'
- segment_id: YS-LN06/Text/part0017.html/p000059
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & phủ định: ''hard-boiled realist'' -> ''người
    theo chủ nghĩa hiện thực lạnh lùng''; ''demonstration'' -> ''màn biểu dương lực
    lượng''; ''Gassman'' -> ''Gassman''; ''the Empire'' -> ''phía Đế quốc''; giữ mệnh
    đề nhượng bộ phủ định ''Dù lúc bấy giờ không nhận ra, nhưng ông đã diễn giải...''."]'
- segment_id: YS-LN06/Text/part0017.html/p000060
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & phủ định: dùng ''chúng ta'' trong thoại của
    Zettour và ''ông'' ở phần dẫn thoại; giữ tình thái ''Rất có khả năng'' và phủ
    định ''không thể cứ thế khoanh tay đứng nhìn được''."]'
- segment_id: YS-LN06/Text/part0017.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Thoại: dịch tự nhiên nhận định của Rudersdorf ''Đúng là một tình
    thế tiến thoái lưỡng nan.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000062
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Đúng là vậy thật.*''
    khớp chính xác với câu in nghiêng đầu đoạn trong XHTML theo DEC-P01-002; giữ phần
    trần thuật về Zettour và Rudersdorf."]'
- segment_id: YS-LN06/Text/part0017.html/p000063
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: ''Kingdom of Ildoa'' -> ''Vương quốc Ildoa'';
    ''worst scenario'' -> ''kịch bản tồi tệ nhất''; giữ cấu trúc phủ định ''vấn đề
    không nằm ở chuyện Vương quốc Ildoa có ý định xâm lược hay không''."]'
- segment_id: YS-LN06/Text/part0017.html/p000064
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ câu ''*Ildoa là một mối đe dọa
    tiềm tàng.*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0017.html/p000065
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*những mối đe dọa tiềm tàng*'' trong
    câu ''Mà đã là *những mối đe dọa tiềm tàng* thì đều phải được chuẩn bị để đối
    phó.'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0017.html/p000066
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ đơn vị: ''Great Army'' -> ''Đại Quân'';
    giữ quan hệ nhượng bộ ''Dù vẫn hy vọng rằng... nhưng có lẽ vẫn cần phải rút bớt
    quân từ phần tàn quân rệu rã của Đại Quân đang triển khai ở phía đông.''."]'
