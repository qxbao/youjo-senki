segment_id_end: YS-LN06/Text/part0008.html/p000032
choices:
- segment_id: YS-LN06/Text/part0008.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & thuật ngữ: giữ định dạng viết hoa toàn bộ ''CUỐI
    THÁNG 11, NĂM THỐNG NHẤT 1926, KHU VỰC TIỀN TUYẾN CỦA LỤC QUÂN ĐẾ QUỐC Ở PHÍA
    ĐÔNG, DOANH TRẠI ĐỒN TRÚ CỦA KAMPFGRUPPE SALAMANDER''; không có chữ nghiêng."]'
- segment_id: YS-LN06/Text/part0008.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: mở đầu bằng lời tự thuật nội tâm của Tanya,
    dùng ''chúng tôi'' cho tập thể đơn vị đang mong chờ chuyến hàng tiếp tế; giữ dấu
    chấm lửng giữa hai câu."]'
- segment_id: YS-LN06/Text/part0008.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: độc thoại nội tâm tự quy chiếu của Tanya
    dùng ''Mình'' theo DEC-P01-001; ''supply unit'' -> ''đơn vị tiếp vận''; ''the
    guys in the rear'' -> ''Cánh nhân sự ở hậu phương''."]'
- segment_id: YS-LN06/Text/part0008.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc: ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; ''cold-weather gear'' -> ''quân trang chống rét''; ''matériel''
    -> ''vật tư và trang bị quân sự''; giữ đúng cấu trúc ''không chỉ... mà còn...''
    cùng chủ ngữ ''Chuyến hàng''."]'
- segment_id: YS-LN06/Text/part0008.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: độc thoại nội tâm của Tanya dùng ''mình''
    theo DEC-P01-001; giữ phạm vi nhấn mạnh giới hạn ''Chỉ riêng điều đó thôi''."]'
- segment_id: YS-LN06/Text/part0008.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý: giữ câu nhận định khái quát đối lập mở đầu bằng
    ''Nhưng con người lúc nào cũng đặt bản thân lên trước hết''."]'
- segment_id: YS-LN06/Text/part0008.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Chức danh, quân hàm & điểm nhìn: ''Commander of the Salamander
    Kampfgruppe Lieutenant Colonel Tanya von Degurechaff'' -> ''Chỉ huy Kampfgruppe
    Salamander, Trung tá Tanya von Degurechaff''; chuyển sang trần thuật ngôi thứ
    ba."]'
- segment_id: YS-LN06/Text/part0008.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: lời phàn nàn thành tiếng của Tanya; ''home
    country'' -> ''quê nhà''."]'
- segment_id: YS-LN06/Text/part0008.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: lời đáp của Serebryakov với Tanya dịch ''Colonel''
    -> ''thưa Trung tá''."]'
- segment_id: YS-LN06/Text/part0008.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Cotton-padded cold-weather gear'' -> ''Quân
    trang chống rét chần bông''; ''Federation'' -> ''Liên bang''; trần thuật ngôi
    thứ ba quy chiếu Tanya bằng ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Thế này thì gay rồi.*'' khớp chính
    xác với thẻ em trong XHTML theo DEC-P01-002; phần trần thuật còn lại để chữ thường.",
    "Chức danh, quân hàm & đại từ: ''adjutant'' -> ''sĩ quan phụ tá''; ''First Lieutenant
    Serebryakov'' -> ''Trung úy Serebryakov''; trần thuật quy chiếu Tanya bằng tên
    riêng ''Tanya'' và đại từ ''nó''."]'
- segment_id: YS-LN06/Text/part0008.html/p000012
  kind: terminology_and_voice
  value: 'choices=[''Phủ định & nghĩa thực chất: giữ nhận định mỉa mai rằng tờ biên
    nhận về bản chất vẫn chỉ là danh sách những thứ đơn vị đang thiếu/không có.'']'
- segment_id: YS-LN06/Text/part0008.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & sắc thái: ''the lieutenant colonel'' -> ''vị trung
    tá''; ''frostbite'' -> ''bỏng lạnh''; giữ cấu trúc nhượng bộ ''dẫu có là vì cốt
    tránh bị bỏng lạnh đi chăng nữa'' và câu cảm thán về việc toàn bộ các sĩ quan
    kỳ cựu từ trung tá trở xuống đều phải lo kiếm tất."]'
- segment_id: YS-LN06/Text/part0008.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định kép: ''General Winter'' -> ''Tướng Mùa Đông'';
    ''training flights'' -> ''các chuyến bay huấn luyện''; giữ phủ định kép ''cũng
    chẳng phải chuyện không thể tính tới''."]'
- segment_id: YS-LN06/Text/part0008.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quân hàm: ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''Lieutenant Colonel
    Uger'' -> ''Trung tá Uger''; giữ phủ định ''Chẳng còn mong đợi được gì hơn thế
    ở mặt trận phía đông nữa''."]'
- segment_id: YS-LN06/Text/part0008.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''aerial mage battalion'' -> ''tiểu đoàn pháp
    sư trên không''; ''replacement company of mages'' -> ''đại đội pháp sư bổ sung'';
    tự thuật ngôi thứ nhất số nhiều dùng ''Chúng tôi'' cho đơn vị."]'
- segment_id: YS-LN06/Text/part0008.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: lời than thở của Tanya dùng ''chúng ta''; giữ
    dấu chấm lửng cuối câu."]'
- segment_id: YS-LN06/Text/part0008.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Chức danh & điểm nhìn: ''the commander of the Salamander Kampfgruppe''
    -> ''vị chỉ huy Kampfgruppe Salamander''; trần thuật ngôi thứ ba."]'
- segment_id: YS-LN06/Text/part0008.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Thành ngữ & đại từ khái quát: dịch câu tục ngữ cổ là ''đủ cơm
    áo mới biết lễ nghĩa'' và dùng đại từ khái quát ''bạn'' ở vế đối lập sau."]'
- segment_id: YS-LN06/Text/part0008.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: trong lời nói thành tiếng, Tanya xưng ''Tôi''
    và dùng ''chúng ta'' cho đơn vị; giữ dấu chấm lửng bỏ lửng cuối câu."]'
- segment_id: YS-LN06/Text/part0008.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    trần thuật ngôi thứ ba dùng tên riêng ''Tanya'' và đại từ ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Đại từ, địa danh & giả định: ''Federation'' -> ''Liên bang'';
    trần thuật quy chiếu Tanya bằng ''nó'' và phản thân ''mình''; giữ sắc thái giả
    định ''Thậm chí chỉ một gợn mây trắng trên bầu trời Liên bang thôi cũng sẽ làm
    nó chướng mắt''."]'
- segment_id: YS-LN06/Text/part0008.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: câu hỏi thăm dò của nhân sự tiếp vận với Tanya
    dịch ''Colonel?'' -> ''Trung tá?''."]'
- segment_id: YS-LN06/Text/part0008.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định: giữ các thán từ ngập ngừng ''Ồ, ờ'' và
    câu phủ định trấn an ''không có gì đâu''."]'
- segment_id: YS-LN06/Text/part0008.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đại từ: giữ tình thái suy đoán ''Hẳn các nhân sự tiếp
    vận đã nhận ra...''; trần thuật quy chiếu Tanya bằng ''Tanya'' và ''nó'' theo
    DEC-P01-001."]'
- segment_id: YS-LN06/Text/part0008.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật ngôi thứ ba quy chiếu Tanya nhất
    quán bằng ''nó'' theo DEC-P01-001; ''standard gear'' -> ''trang bị tiêu chuẩn''."]'
- segment_id: YS-LN06/Text/part0008.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong thoại: Tanya xưng ''Tôi'' và gọi các binh lính tiếp
    vận là ''các anh'' với giọng điệu lịch sự của người chỉ huy."]'
- segment_id: YS-LN06/Text/part0008.html/p000028
  kind: terminology_and_voice
  value: 'choices=["Xưng hô quân lệnh: lời đáp đồng thanh của binh lính tiếp vận dịch
    ''Yes, ma’am!'' -> ''Rõ, thưa Trung tá!''."]'
- segment_id: YS-LN06/Text/part0008.html/p000029
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: chuyển từ câu quan sát sang độc
    thoại nội tâm tự quy chiếu của Tanya bằng ''Mình / mình'' theo DEC-P01-001; ''Imperial
    Army'' -> ''Lục quân Đế quốc''; giữ dấu chấm lửng và phủ định ''không vắt kiệt
    sức lực''."]'
- segment_id: YS-LN06/Text/part0008.html/p000030
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & câu hỏi giả định: nội tâm tự quy chiếu dùng
    ''mình'' và ''chúng tôi'' (cho toàn đơn vị); giữ phủ định ''không thể phủ nhận''
    và câu hỏi giả định ở cuối đoạn (''Chuyện gì sẽ xảy ra nếu chúng tôi bị cắt đứt
    nguồn tiếp tế vào thời điểm này?'')."]'
- segment_id: YS-LN06/Text/part0008.html/p000031
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''high-calorie rations'' -> ''khẩu phần
    giàu năng lượng''; ''standard meals'' -> ''các bữa ăn tiêu chuẩn''; ''logistics''
    -> ''ngành hậu cần''; ''winter gear'' -> ''quân trang mùa đông''; ''offensive''
    -> ''cuộc tiến công''; giữ phủ định mức độ ''Hầu như chẳng có chút tiến triển
    nào''."]'
- segment_id: YS-LN06/Text/part0008.html/p000032
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & đại từ: nội tâm tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; giữ đúng cấu trúc phủ định kép ''Không phải là mình không biết
    ơn...''."]'
