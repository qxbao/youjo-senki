choices:
- segment_id: YS-LN06/Text/part0023.html/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian & địa điểm: giữ định dạng in hoa toàn bộ ''CUỐI
    THÁNG BA, NĂM THỐNG NHẤT 1927, LÃNH THỔ LIÊN BANG''; không dùng Markdown nhấn
    mạnh."]'
- segment_id: YS-LN06/Text/part0023.html/p000002
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, điều kiện & phủ định: mở đầu bằng lời dẫn châm ngôn
    khách quan; giữ điều kiện ''chỉ cần có sự chuẩn bị, thời cơ ắt sẽ tới'' và cấu
    trúc phủ định kép ở vế đối lập ''trời chẳng có lý do gì để giúp những kẻ không
    tự cứu lấy mình''."]'
- segment_id: YS-LN06/Text/part0023.html/p000003
  kind: terminology_and_voice
  value: 'choices=["Tình thái & kết nối logic: giữ cụm chuyển ý ''Nói cách khác''
    và tình thái bắt buộc ''phải được thực hiện một cách táo bạo''."]'
- segment_id: YS-LN06/Text/part0023.html/p000004
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái: giữ câu nhận định cô đọng ''Nguyên tắc lúc nào
    cũng nói dễ hơn làm.''."]'
- segment_id: YS-LN06/Text/part0023.html/p000005
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định, nhượng bộ & thuật ngữ: trần thuật từ góc
    nhìn của Drake; ''Drake the marine magic officer'' -> ''sĩ quan ma pháp hải quân
    đánh bộ Drake''; ''amphibious exercises'' -> ''các cuộc diễn tập đổ bộ''; ''Federation
    Army General Staff'' -> ''Bộ Tổng tham mưu Quân đội Liên bang''; giữ phủ định
    giới hạn ''chỉ riêng lòng quyết tâm không thể khắc phục nổi'' và mệnh đề nhượng
    bộ sau dấu gạch ngang dài."]'
- segment_id: YS-LN06/Text/part0023.html/p000006
  kind: terminology_and_voice
  value: 'choices=["Tình thái quá khứ & đối lập nhượng bộ: làm rõ chủ thể cho phép
    là ''phía Liên bang'' và người quan sát là ''họ''; giữ tình thái ''đáng lẽ phải
    là bí mật quân sự'' và đối lập ''nhưng chỉ mất đúng một khoảnh khắc để họ vỡ mộng''."]'
- segment_id: YS-LN06/Text/part0023.html/p000007
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''air superiority'' -> ''ưu thế
    trên không''; ''Imperial Air Fleet'' -> ''Không hạm đội Đế quốc''; ''former Entente
    Alliance territory'' -> ''lãnh thổ cũ của Liên minh Hiệp ước''; quy chiếu không
    quân địch bằng ''chúng'' và giữ tình thái rào đón ''Có lẽ phải nói rằng''."]'
- segment_id: YS-LN06/Text/part0023.html/p000008
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thời gian nhận thức & thuật ngữ: ''Imperial
    Air Fleet'' -> ''Không hạm đội Đế quốc''; ''Commonwealth'' -> ''Khối Thịnh vượng
    chung''; ''Federation'' -> ''Liên bang''; quy chiếu Drake bằng ''ông''; chỉ bọc
    ''*Từng nghĩ*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002 để nhấn
    mạnh sự đối lập giữa nhận định cũ trong quá khứ và thông tin mới nhất ở hiện tại."]'
- segment_id: YS-LN06/Text/part0023.html/p000009
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, giả định, phủ định & thuật ngữ: quy chiếu Drake bằng
    ''ông''; ''Intelligence'' -> ''bên Tình báo''; giữ phủ định giảm nhẹ ''cũng chẳng
    hoàn hảo gì'', câu điều kiện giả định ''Nếu phải nêu cảm nhận sau khi thực sự
    giao chiến với chúng, ông sẽ nói rằng...'', dấu ngoặc kép trích dẫn cụm ''“cực
    kỳ tài năng”'' kèm phủ định ''thậm chí còn chẳng thấm vào đâu''."]'
- segment_id: YS-LN06/Text/part0023.html/p000010
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái & dấu câu: chỉ bọc ''*Hãy lường
    trước tình huống tồi tệ nhất—ha.*'' khớp chính xác với thẻ em trong XHTML theo
    DEC-P01-002; giữ tình thái bắt buộc ''Họ buộc phải chấp nhận'' và dấu ngoặc kép
    quanh cụm ''“cực kỳ nguy hiểm”''."]'
- segment_id: YS-LN06/Text/part0023.html/p000011
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc tên riêng tàu
    ''*Queen of Anjou*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002 (để
    ''RMS'' ngoài dấu sao); ''marine mages'' -> ''các pháp sư hải quân đánh bộ'';
    ''direct support'' -> ''lực lượng yểm trợ trực tiếp''; quy chiếu Drake bằng ''ông''
    và giữ cấu trúc nhượng bộ ''Ngay cả... mà vẫn bị giáng đòn tơi tả''."]'
- segment_id: YS-LN06/Text/part0023.html/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: ''imperial submarine fleet''
    -> ''hạm đội tàu ngầm của Đế quốc''; ''Federation Navy'' -> ''Hải quân Liên bang'';
    giữ đối lập ''tuy không mấy nổi bật, nhưng chúng lại là một mối đe dọa nghiêm
    trọng'' và phủ định kèm tình thái đánh giá năng lực ''những gã có vẻ còn chẳng
    hiểu rõ hoàn toàn cách thức tuần tra săn ngầm''."]'
- segment_id: YS-LN06/Text/part0023.html/p000013
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhân quả: quy chiếu Drake bằng ''ông'', giữ cấu
    trúc ''Chẳng trách sao ông lại lo rằng sẽ có chiếc lọt qua được.''."]'
- segment_id: YS-LN06/Text/part0023.html/p000014
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu tổng kết chuyển đoạn ''Tất cả những điều đó gộp
    lại đã làm vấn đề trở nên rõ ràng.''."]'
- segment_id: YS-LN06/Text/part0023.html/p000015
  kind: terminology_and_voice
  value: 'choices=["Tình thái, thuật ngữ & đối lập: giữ tình thái ''Nghe đâu''; ''former
    Entente Alliance territory'' -> ''lãnh thổ cũ của Liên minh Hiệp ước''; ''Imperial
    Army'' -> ''Lục quân Đế quốc''; ''opposed landing'' -> ''cuộc đổ bộ trước sự kháng
    cự của địch''; giữ nhận định bác bỏ ''nhưng ngay cả thế thì cũng đã là quá lạc
    quan rồi'' và sự phê phán ở câu sau."]'
- segment_id: YS-LN06/Text/part0023.html/p000016
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: giữ hai cấu trúc phủ định (''thậm
    chí không xét đến khả năng họ sẽ chẳng có nổi cơ hội mà đặt chân lên bờ'', ''thái
    độ không muốn nghĩ tới chuyện đó''); ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ tình thái suy đoán ''Có lẽ'' ở câu thứ hai."]'
- segment_id: YS-LN06/Text/part0023.html/p000017
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: tách đúng hai cụm nhấn mạnh ''*Tôi*
    muốn *mọi chuyện đều ổn thỏa.*'' khớp chính xác với hai thẻ em trong XHTML theo
    DEC-P01-002 (tái hiện lối tư duy chủ quan của phía Liên bang bằng đại từ ''Tôi'')."]'
- segment_id: YS-LN06/Text/part0023.html/p000018
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tình thái: giữ đúng hai cặp dấu sao ''*Thế
    nên chúng* chắc là ổn thỏa thôi*.*'' khớp chính xác với hai thẻ em trong XHTML
    (bao gồm cả dấu chấm câu nằm trong thẻ em thứ hai) theo DEC-P01-002 và tình thái
    suy đoán ''chắc là''."]'
- segment_id: YS-LN06/Text/part0023.html/p000019
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & khẳng định: giữ đúng hai cặp dấu sao ''*Nói
    cách khác,* mọi chuyện đều ổn thỏa*.*'' khớp chính xác với hai thẻ em trong XHTML
    (bao gồm cả dấu chấm câu nằm trong thẻ em thứ hai) theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0023.html/p000020
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & câu hỏi nội tâm: giữ sắc thái ''nỗi sợ hãi mơ hồ'',
    nhận định về sự nhẹ nhõm là kẻ thù tồi tệ nhất và câu hỏi nội tâm phủ định chất
    vấn ''Tại sao lại chẳng có ai chất vấn sự điên rồ của kế hoạch này cơ chứ?''."]'
- segment_id: YS-LN06/Text/part0023.html/p000021
  kind: terminology_and_voice
  value: 'choices=["Phủ định, điểm nhìn & đại từ: giữ hai phủ định định nghĩa kẻ hèn
    nhát (''không nói ra điều cần phải nói'', ''từ chối suy nghĩ về điều cần phải
    cân nhắc''); quy chiếu Drake bằng ''mình / ông'' và giữ trọn ý nỗi sợ khi nhìn
    lại toàn bộ sự nghiệp quân ngũ."]'
- segment_id: YS-LN06/Text/part0023.html/p000022
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & tình thái: quy chiếu Drake bằng ''ông / mình''
    và người chiến hữu Mikel bằng ''anh''; giữ phủ định ''không cần phải giữ kẽ''
    và tình thái ''cảm thấy mình nên nói với anh''."]'
- segment_id: YS-LN06/Text/part0023.html/p000023
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô, phủ định, câu hỏi tu từ & thuật ngữ: ''Colonel
    Mikel'' -> ''Trung tá Mikel'' (đồng bộ với cấp bậc Trung tá đã khóa ở chương 1–2);
    trong thoại Drake xưng ''Tôi / tôi'', giữ hai phủ định (''chẳng tài nào hiểu nổi
    mấy con rùa cạn'', ''thậm chí còn chẳng có lấy một chiếc xuồng đổ bộ nào!'') và
    câu hỏi châm biếm ở cuối đoạn; ''landing crafts'' -> ''xuồng đổ bộ''."]'
- segment_id: YS-LN06/Text/part0023.html/p000024
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & thuật ngữ: trần thuật nêu tên ''Mikel'';
    trong thoại Mikel xưng ''tôi / chúng tôi''; ''Federation Army'' -> ''Quân đội
    Liên bang''; ''amphibious operation'' -> ''chiến dịch đổ bộ''; giữ câu cảm thán
    mở đầu ''“Cho tôi xin đi,”'' và tình thái nghe nói lại ''Nghe đâu''."]'
- segment_id: YS-LN06/Text/part0023.html/p000025
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật theo góc nhìn của Drake,
    quy chiếu Mikel bằng ''anh'' (nhất quán với p000022); giữ phủ định ''không chút
    cảm xúc'' và cấu trúc ''không khỏi cảm thấy''."]'
- segment_id: YS-LN06/Text/part0023.html/p000026
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô, giả định quá khứ & câu hỏi phủ định: trần thuật
    quy chiếu Drake bằng ''mình / ông''; trong thoại Drake xưng ''Tôi / tôi'', gọi
    phía Mikel là ''các anh''; ''prerevolution navy'' -> ''hải quân thời tiền cách
    mạng''; giữ câu hỏi phủ định giả định kèm điều kiện giới hạn thời gian ''Chẳng
    phải hải quân thời tiền cách mạng của các anh sẽ có thể đưa ra một phương án khá
    khẩm hơn chỉ trong vòng một ngày hay sao?''."]'
- segment_id: YS-LN06/Text/part0023.html/p000027
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, chuỗi phủ định & giả định: Mikel xưng ''tôi'',
    giữ bốn cấu trúc phủ định (''Đó không phải là chuyện nên hỏi một pháp sư đâu.'',
    ''không thuộc thẩm quyền của tôi'', ''cũng chẳng biết gì về biển cả…'', ''giờ
    đều không còn nữa rồi…'') và mệnh đề giả định quá khứ ''những người lẽ ra biết
    rõ chuyện đó'' (ám chỉ các cuộc thanh trừng sau cách mạng)."]'
