choices:
- segment_id: YS-LN06/Text/part0017.html/p000067
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật ngôi thứ ba theo góc
    nhìn Zettour (''ông''); quy chiếu Rudersdorf bằng tên riêng và ''ông ta''; ''the
    Federation'' -> ''Liên bang''; ''the Operations man'' -> ''người của Cục Tác chiến'';
    giữ tình thái ''sẽ đòi hỏi phải sửa đổi đáng kể'' và ''Có vẻ như''; không có chữ
    nghiêng."]'
- segment_id: YS-LN06/Text/part0017.html/p000068
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, giả định & sắc thái: Rudersdorf xưng ''tôi''; ''macaroni
    bastards'' -> ''lũ khốn nui ống'', phân biệt với ''pasta'' -> ''mì Ý'' ở câu sau;
    giữ đúng giả định trái thực tế kèm mệnh đề nhượng bộ ''Giá mà họ đang ở bàn ăn
    tối, hẳn Rudersdorf đã đâm phập chiếc nĩa vào đĩa mì Ý của mình rồi, cho dù làm
    vậy là bất lịch sự.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000069
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điểm nhìn: Zettour xưng ''tôi''; giữ nét nghĩa ''in
    spite of himself'' -> ''bất giác đáp lời''."]'
- segment_id: YS-LN06/Text/part0017.html/p000070
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi ngắn: giữ câu hỏi đáp lời tự nhiên ''Chuyện gì vậy?''."]'
- segment_id: YS-LN06/Text/part0017.html/p000071
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, sắc thái mỉa mai & thuật ngữ: Zettour xưng ''tôi'' /
    ''chúng ta'' / ''ta'', gọi Rudersdorf là ''Ông'' trong câu hỏi ''Ông hiểu chứ?'';
    ''Those dear macaroni bastards'' -> ''Lũ khốn nui ống thân yêu đó''; ''Southern
    Continent Expeditionary Army Corps'' -> ''Quân đoàn Viễn chinh Lục địa Phía nam'';
    giữ trạng ngữ giới hạn ''Ít nhất là về mặt hình thức''."]'
- segment_id: YS-LN06/Text/part0017.html/p000072
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & xưng hô: giữ phủ định kép ở câu trần thuật
    đầu đoạn ''Chẳng khó khăn gì để học thuộc lòng những điều mà chính mình cũng không
    tin.''; Zettour xưng ''tôi'', giữ tình thái giới hạn thời gian ''Ít nhất là trong
    hiện tại…'' và đánh giá hợp lý về mặt quân sự."]'
- segment_id: YS-LN06/Text/part0017.html/p000073
  kind: terminology_and_voice
  value: 'choices=["Thán từ thoại: dịch tiếng gầm gừ miễn cưỡng ''Nrgh…'' thành ''Hừm…''."]'
- segment_id: YS-LN06/Text/part0017.html/p000074
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đại từ: giữ đại từ ''chúng ta'' và phủ định ''không
    còn lựa chọn nào khác'' trong bối cảnh chiến lược hiện tại."]'
- segment_id: YS-LN06/Text/part0017.html/p000075
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc câu: ''The Empire'' -> ''Đế quốc''; ''deadlock''
    -> ''bế tắc''; giữ nhịp chêm ''nói ngắn gọn bằng một từ''."]'
- segment_id: YS-LN06/Text/part0017.html/p000076
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: chỉ bọc ''*Đáng lẽ mọi chuyện không
    nên thành ra thế này*'' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002;
    giữ phần dẫn ''ai nấy đều rên rỉ'' và nhận định về chuỗi sự kiện ngoài dự tính."]'
- segment_id: YS-LN06/Text/part0017.html/p000077
  kind: terminology_and_voice
  value: 'choices=["Tình thái quá khứ, thuật ngữ & câu hỏi tu từ: giữ tình thái ''Về
    mặt lý thuyết, đáng lẽ phải có một lối thoát khỏi vòng vây.''; ''the Empire''
    -> ''Đế quốc''; ''Entente Alliance'' -> ''Liên minh Hiệp ước''; ''Dacia'' -> ''Dacia'';
    giữ nguyên câu hỏi tu từ và câu khẳng định tính hiển nhiên của đáp án."]'
- segment_id: YS-LN06/Text/part0017.html/p000078
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi, phủ định & thuật ngữ: ''all-out war'' -> ''một cuộc chiến
    toàn diện''; ''national security'' -> ''an ninh quốc gia''; giữ phủ định nhấn
    mạnh ''chẳng đóng góp được mảy may nào'' và kết luận phủ định ''không chuốc thêm
    kẻ thù nào nữa''."]'
- segment_id: YS-LN06/Text/part0017.html/p000079
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, ẩn dụ & thành ngữ: người nói xưng ''tôi'' / ''chúng ta'';
    giữ hình ảnh ẩn dụ ''đập bẹp lũ ruồi nhặng ở dưới phía nam'' và thành ngữ ''all
    pain and no gain'' -> ''tốn công vô ích, toàn rước họa vào thân mà chẳng được
    tích sự gì''."]'
- segment_id: YS-LN06/Text/part0017.html/p000080
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi tu từ phủ định & ẩn dụ: giữ câu hỏi ''chẳng phải cũng
    đáng công sức lắm sao?'' và ẩn dụ địa chính trị ''tender nether regions'' -> ''vùng
    bụng dưới nhạy cảm của chúng ta''."]'
- segment_id: YS-LN06/Text/part0017.html/p000081
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, giả định & thuật ngữ: Zettour xưng ''tôi'' / ''chúng
    ta'', quy chiếu phía Ildoa bằng ''họ''; ''staff officers'' -> ''các sĩ quan tham
    mưu''; ''occupation admin work'' -> ''công việc hành chính chiếm đóng''; giữ đủ
    các câu điều kiện giả định và phủ định."]'
- segment_id: YS-LN06/Text/part0017.html/p000082
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, quan hệ nhân quả & thuật ngữ: quy chiếu Zettour bằng
    ''ông''; ''Service Corps'' -> ''Cục Quân vụ''; ''a bunch of gofers'' -> ''một
    đám chân chạy vặt''; ''his counterpart in Operations'' -> ''người đồng cấp bên
    Cục Tác chiến''; ''Imperial Army’s administrative arm'' -> ''bộ phận hành chính
    của Lục quân Đế quốc''."]'
- segment_id: YS-LN06/Text/part0017.html/p000083
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ tương đương & nghĩa: giữ đúng lập luận về việc đồn trú
    binh lính tại lãnh thổ chiếm đóng chẳng khác nào loại họ khỏi vòng chiến đấu.'']'
- segment_id: YS-LN06/Text/part0017.html/p000084
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định & ẩn dụ: giữ đại từ ''chúng ta'', điều kiện
    đi kèm phủ định ''chiếm thêm lãnh thổ mà vẫn không đạt được hòa bình'' và hệ quả
    tất yếu ''biến thành một vũng lầy''."]'
- segment_id: YS-LN06/Text/part0017.html/p000085
  kind: terminology_and_voice
  value: 'choices=["Phủ định, điều kiện cần & thuật ngữ: ''Imperial Army'' -> ''Lục
    quân Đế quốc''; ''interior lines strategy'' -> ''chiến lược nội tuyến''; ''mobility''
    -> ''tính cơ động''; giữ câu phủ định ''không có binh lính vô hạn'' và cấu trúc
    ''Chỉ bằng cách... thì mới có thể...''."]'
- segment_id: YS-LN06/Text/part0017.html/p000086
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: ''total war scenario'' -> ''kịch bản chiến
    tranh tổng lực''; giữ cấu trúc phủ định về sự thất bại của quy trình hai bước
    cổ điển."]'
- segment_id: YS-LN06/Text/part0017.html/p000087
  kind: terminology_and_voice
  value: 'choices=["Quan hệ thời gian, nhân quả & giả định: phân biệt mốc ''Trước
    kia''; giữ quan hệ hệ quả ''chịu thương vong nặng nề đến mức không còn khả năng
    bảo vệ thủ đô, họ sẽ buộc phải cân nhắc chuyện giảng hòa'' và giả định nền tảng
    của chiến lược an ninh quốc gia cũ."]'
- segment_id: YS-LN06/Text/part0017.html/p000088
  kind: terminology_and_voice
  value: 'choices=["Tình thái mức độ: giữ cấu trúc nhấn mạnh ''Ngay cả Zettour cũng
    phải thừa nhận'' và mức độ ''gần như chỉ là một giấc mộng''."]'
- segment_id: YS-LN06/Text/part0017.html/p000089
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''the Republic'' -> ''Cộng hòa''; giữ nghĩa câu nêu
    ví dụ điển hình."]'
- segment_id: YS-LN06/Text/part0017.html/p000090
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: ''The Empire'' -> ''Đế
    quốc'' (quy chiếu câu sau bằng ''Nó''); ''field army'' -> ''đạo quân dã chiến'';
    chỉ bọc ''*Vừng ơi mở ra*'' khớp chính xác với thẻ em ''Open sesame'' trong XHTML
    theo DEC-P01-002; ''revolving door'' -> ''cánh cửa quay''."]'
- segment_id: YS-LN06/Text/part0017.html/p000091
  kind: terminology_and_voice
  value: 'choices=["Khẳng định: giữ câu khẳng định ngắn ''Đúng vậy, họ đã thực hiện
    điều đó một cách hoàn hảo.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000092
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: giữ phép điệp ''The instrument
    of violence'' -> ''Công cụ bạo lực''; ''Imperial Army'' -> ''Lục quân Đế quốc'';
    ''Republican Army'' -> ''Quân đội Cộng hòa''; chỉ bọc ''*Chúng ta là Đế quốc,
    vương miện của thế giới.*'' khớp chính xác với thẻ em ở cuối đoạn trong XHTML
    theo DEC-P01-002."]'
- segment_id: YS-LN06/Text/part0017.html/p000093
  kind: terminology_and_voice
  value: 'choices=["Tình thái khách quan: giữ tình thái bị động khách quan ''Xét trong
    bối cảnh đó, có thể lập luận rằng quân đội đã hoàn thành bổn phận của mình.''."]'
- segment_id: YS-LN06/Text/part0017.html/p000094
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập: giữ liên từ chuyển ý ''Thế nhưng'' và nét nghĩa
    bắt buộc ''ai nấy đều phải chấp nhận''."]'
- segment_id: YS-LN06/Text/part0017.html/p000095
  kind: terminology_and_voice
  value: 'choices=["Phủ định, chuỗi sự kiện & thuật ngữ: giữ phủ định ''Chiến thắng
    trên mặt trận phía Tây đã không chấm dứt được cuộc chiến.''; ''western front''
    -> ''mặt trận phía Tây''; ''southern continent'' -> ''lục địa phía nam''; ''the
