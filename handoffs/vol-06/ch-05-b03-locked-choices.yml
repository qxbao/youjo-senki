    theo DEC-P01-002; giữ phủ định kép ''chẳng hề phiền lòng'' và phủ định định danh
    ''những nơi không phải chiến tuyến chính''; ''air fleet'' -> ''không hạm đội'';
    ''Federation support route'' -> ''tuyến đường chi viện cho Liên bang''."]'
- segment_id: YS-LN06/Text/part0023.html/p000057
  kind: terminology_and_voice
  value: 'choices=["Phủ định mở rộng phạm vi: giữ cấu trúc ''sẽ không chỉ có mỗi cánh
    hải quân là phải mất ăn mất ngủ vì chuyện này''."]'
- segment_id: YS-LN06/Text/part0023.html/p000058
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & điểm nhìn: chỉ bọc ''*Dù sao thì
    chúng ta cũng biết trước chuyện này sẽ xảy ra rồi.*'' khớp chính xác với thẻ em
    trong XHTML theo DEC-P01-002; giữ tên riêng ''Drake'' và ''Mikel'' cùng sắc thái
    ngoại hình ''nom chẳng mấy khá khẩm''."]'
- segment_id: YS-LN06/Text/part0023.html/p000059
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, tình thái & thuật ngữ: Mikel xưng ''tôi''; ''the
    higher-ups'' -> ''cấp trên''; ''imperial air forces'' -> ''không lực Đế quốc'';
    ''front line'' -> ''tiền tuyến''; giữ tình thái giới hạn góc nhìn ''Theo những
    gì tôi thấy'' và nghe nói lại ''Nghe đâu''."]'
- segment_id: YS-LN06/Text/part0023.html/p000060
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, câu hỏi tu từ, đối lập, phủ định & thuật ngữ:
    Drake xưng ''tôi''; giữ câu hỏi tu từ chất vấn ''Mà họ nghĩ rốt cuộc ai sẽ phải
    lãnh đủ hậu quả từ chuyện đó chứ?''; ''the Empire'' -> ''Đế quốc''; ''front lines''
    -> ''tiền tuyến''; ''the Federation'' -> ''Liên bang''; ''strategic reserves''
    -> ''lực lượng dự bị chiến lược''; ''the rear'' -> ''hậu phương''; giữ phủ định
    giảm nhẹ ''nhưng tôi không nghĩ điều đó có nghĩa là họ sẽ lơ là khâu phòng thủ
    ở hậu phương đâu''."]'
- segment_id: YS-LN06/Text/part0023.html/p000061
  kind: terminology_and_voice
  value: 'choices=["Đối lập & thuật ngữ: ''Federation Army'' -> ''Quân đội Liên bang'';
    ''Imperial Army'' -> ''Lục quân Đế quốc''; ''maneuver warfare'' -> ''tác chiến
    cơ động''; ''interior lines strategy'' -> ''chiến lược nội tuyến''; giữ hai cặp
    đối lập giữa nhận thức phổ biến và thực tế kinh nghiệm của Drake."]'
- segment_id: YS-LN06/Text/part0023.html/p000062
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ & liên kết logic: giữ cụm chuyển ý ''Nói cách khác'' và
    ẩn dụ ''tận dụng những quân bài sẵn có trong tay để bảo vệ mình và sinh tồn''."]'
- segment_id: YS-LN06/Text/part0023.html/p000063
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, phủ định & câu hỏi: Mikel xưng ''tôi'', gọi Drake
