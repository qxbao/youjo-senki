choices:
- segment_id: YS-LN06/Text/part0019.html/p000064
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, quân hàm & nhấn mạnh: trần thuật từ điểm nhìn
    của Lergen (''anh''), quy chiếu Tanya ở ngôi thứ ba là ''cô''; ''magic officer''
    -> ''sĩ quan ma pháp''; ''Lieutenant Colonel Tanya von Degurechaff'' -> ''Trung
    tá Tanya von Degurechaff''; ''In the rear'' -> ''Ở hậu phương''; giữ nhấn mạnh
    Markdown ở đúng mệnh đề giả định cuối câu ''*nếu cô ở đây… cô sẽ làm gì?*''."]'
- segment_id: YS-LN06/Text/part0019.html/p000065
  kind: terminology_and_voice
  value: 'choices=["Xưng hô ngoại giao, nhấn mạnh & thuật ngữ: Calandro xưng ''tôi''
    / ''chúng tôi'' (đại diện Ildoa), gọi Lergen là ''ngài'' / ''phía các ngài'';
    giữ nhấn mạnh Markdown ''*một quốc gia đồng minh*''; ''the Empire’s economy''
    -> ''nền kinh tế Đế quốc''; ''peace talks'' -> ''đàm phán hòa bình''; ''stalemate''
    -> ''thế bế tắc''; ''volunteer to arbitrate'' -> ''tình nguyện đứng ra làm trung
    gian hòa giải''."]'
- segment_id: YS-LN06/Text/part0019.html/p000066
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc nhấn mạnh nhân quả & thuật ngữ: giữ cấu trúc ''Chính
    vì... nên anh mới phải...''; ''Imperial Army'' -> ''Lục quân Đế quốc''."]'
- segment_id: YS-LN06/Text/part0019.html/p000067
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu & thuật ngữ: giữ dấu gạch ngang dài giải thích mức
    độ ''vô cùng lớn—lớn đến mức khó tin''; ''the Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN06/Text/part0019.html/p000068
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ y học: ''The lines in the east'' -> ''Các chiến
    tuyến ở phía đông''; ''war of attrition'' -> ''Cuộc chiến tiêu hao''; ''the Commonwealth''
    -> ''Khối Thịnh vượng chung''; ''the Free Republic'' -> ''Cộng hòa Tự do''; ''General
    Staff'' -> ''Bộ Tổng tham mưu''; ''decisive victory'' -> ''chiến thắng quyết định'';
    ''Imperial Army'' -> ''Lục quân Đế quốc''; giữ ẩn dụ ''tình trạng xuất huyết không
    ngừng của một Lục quân Đế quốc vốn đã ngày càng suy kiệt vì thiếu máu''."]'
- segment_id: YS-LN06/Text/part0019.html/p000069
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & câu hỏi tu từ: giữ dấu chấm lửng mở đầu ''…Nhưng cớ
    gì'' và câu hỏi tu từ trong lời nửa trực tiếp của Lergen (''anh'', ''nỗi bất an
    của mình'')."]'
- segment_id: YS-LN06/Text/part0019.html/p000070
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm, phủ định & thuật ngữ: Lergen xưng ''tôi'',
    gọi Calandro là ''ngài''; ''Supreme Command'' -> ''Bộ Tư lệnh Tối cao''; ''A mere
    colonel'' -> ''Một đại tá quèn như tôi''; giữ phủ định ''không thể nào biết được''."]'
- segment_id: YS-LN06/Text/part0019.html/p000071
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Calandro xưng ''Tôi'', gọi Lergen
    là ''ngài''; ''Operations'' -> ''Cục Tác chiến''; ''Lieutenant General von Zettour''
    -> ''Trung tướng von Zettour''; ''Lieutenant General von Rudersdorf'' -> ''Trung
    tướng von Rudersdorf''."]'
- segment_id: YS-LN06/Text/part0019.html/p000072
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái: giữ đối lập giữa vẻ ngoài ''thản nhiên'' và
    ''hàm ý sâu nặng'', ''vượt xa những lời khách sáo đầu môi hay một câu nói đùa''."]'
- segment_id: YS-LN06/Text/part0019.html/p000073
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nội tâm: giữ in nghiêng toàn bộ câu cảm thán
    nội tâm của Lergen ''*…Khi người ta bảo dân Ildoa rất nồng nhiệt, đúng là họ hoàn
    toàn biết rõ mình đang nói về điều gì!*''."]'
- segment_id: YS-LN06/Text/part0019.html/p000074
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: giữ câu hỏi đuôi lịch sự nhưng sắc sảo của Calandro
    ''Khiêm tốn quá mức đôi khi lại thành ra thất lễ, ngài không nghĩ vậy sao?''."]'
- segment_id: YS-LN06/Text/part0019.html/p000075
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Calandro là ''ông ta'' từ điểm nhìn
    quan sát của Lergen."]'
- segment_id: YS-LN06/Text/part0019.html/p000076
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ, đại từ & nhấn mạnh: Lergen -> ''anh'', Calandro
    -> ''viên đại tá'' / ''ông ta''; ''alpine regiment'' -> ''trung đoàn sơn cước'';
    giữ nhấn mạnh Markdown ''*Chà, chà.*'' đúng phạm vi nguồn."]'
- segment_id: YS-LN06/Text/part0019.html/p000077
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''alpine regiments'' -> ''các trung đoàn sơn cước'';
    ''Royal Ildoan Army General Staff'' -> ''Bộ Tổng tham mưu Lục quân Hoàng gia Ildoa''."]'
- segment_id: YS-LN06/Text/part0019.html/p000078
  kind: terminology_and_voice
  value: 'choices=["Giả định & thuật ngữ: giữ cấu trúc giả định ''Nếu... thì... sẽ
    là...''; ''Intelligence officer'' -> ''sĩ quan Tình báo''; ''alpine unit'' ->
    ''đơn vị sơn cước''."]'
- segment_id: YS-LN06/Text/part0019.html/p000079
  kind: terminology_and_voice
  value: 'choices=["Tình thái, câu hỏi suy đoán & thuật ngữ: giữ tình thái suy đoán
    ''Vậy có lẽ... chăng?'' và khẳng định ''Dù theo cách nào đi nữa, ông ta chắc chắn
    cũng là...''; ''cross-border and other legally gray operations'' -> ''các chiến
    dịch vượt biên giới và những hoạt động nằm trong vùng xám pháp lý khác''."]'
- segment_id: YS-LN06/Text/part0019.html/p000080
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: giữ ''tôi'' – ''ngài'' trong lời thoại xã giao
    của Calandro."]'
- segment_id: YS-LN06/Text/part0019.html/p000081
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế: giữ sắc thái giả định tiếc nuối của Lergen
    ''Giá như chúng ta có thể vô điều kiện chúc mừng tình hữu nghị giữa hai nước thì
    đã tuyệt biết mấy…''."]'
- segment_id: YS-LN06/Text/part0019.html/p000082
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: giữ ''ngài'', ''tôi'' và ''chúng ta'' trong lời
    đáp của Calandro."]'
- segment_id: YS-LN06/Text/part0019.html/p000083
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ nội tâm & thuật ngữ: giữ dấu gạch ngang
    dài và nhấn mạnh toàn bộ phần độc thoại nội tâm ''*hẳn ông ta thực sự là một đặc
    phái viên. Và lý do ông ta chọn mình để tiếp xúc cũng đã quá rõ ràng.*''; Lergen
    tự quy chiếu là ''mình'' trong nội tâm; ''special envoy'' -> ''đặc phái viên''."]'
- segment_id: YS-LN06/Text/part0019.html/p000084
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy luận & thuật ngữ: giữ tình thái ''Hẳn Lergen đã
    được nhắm tới...'' và ''chắc chắn sẽ chuyển thông điệp này''; ''Operations'' ->
    ''Cục Tác chiến''; ''Service Corps'' -> ''Cục Quân vụ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000085
  kind: terminology_and_voice
  value: 'choices=["Quốc danh & phạm vi phủ định: ''the Kingdom of Ildoa'' -> ''Vương
    quốc Ildoa''; ''the Empire'' -> ''Đế quốc''; giữ đúng phạm vi phủ định vào trạng
    từ ''không hề chủ động mong muốn'' (''are not actively hoping'')."]'
- segment_id: YS-LN06/Text/part0019.html/p000086
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản vấn & đối xứng từ vựng: giữ ''các ngài'' (quy chiếu
    phía Vương quốc Ildoa) và cụm ''thụ động mong muốn'' đối xứng trực tiếp với ''chủ
    động mong muốn'' ở p000085."]'
- segment_id: YS-LN06/Text/part0019.html/p000087
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: giữ lời khen ngắn ''Sắc bén lắm.'' và thuật
    ngữ ''the issue of Unredeemed Ildoa'' -> ''vấn đề Ildoa Chưa Thu hồi''."]'
- segment_id: YS-LN06/Text/part0019.html/p000088
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái & phủ định: giữ đủ 5 cụm nhấn mạnh
    Markdown ''*À ra thế.*'', ''*lãnh thổ*'', ''*quê hương*'', ''*chủ quyền*'' và
    ''*trớ trêu thay*''; giữ tình thái ''có lẽ phải nói rằng…'' và phủ định tuyệt
    đối ''tuyệt đối không được phép công khai thừa nhận''."]'
- segment_id: YS-LN06/Text/part0019.html/p000089
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & lịch sử: ''Unredeemed Ildoa'' -> ''Ildoa Chưa Thu
    hồi''; ''Ildoan-speaking region'' -> ''vùng đất nói tiếng Ildoa''; ''taken by
    the Reich when the Empire was formed'' -> ''từng bị Đế quốc thôn tính khi lập
    quốc''."]'
- segment_id: YS-LN06/Text/part0019.html/p000090
  kind: terminology_and_voice
  value: 'choices=["Phủ định & lập luận: ''The Reich'' -> ''Đế quốc''; giữ phủ định
    mạnh ''đời nào chịu thông cảm'' và quan hệ nhân quả trong lập luận ''chỉ vì một
    số cư dân trong vùng nói tiếng Ildoa mà mảnh đất đó phải thuộc về Ildoa''."]'
- segment_id: YS-LN06/Text/part0019.html/p000091
  kind: terminology_and_voice
  value: 'choices=["Phủ định & dấu ngoặc kép: ''The Empire'' -> ''Đế quốc''; giữ phủ
    định nhấn mạnh ''thậm chí còn chẳng đáng để đem ra bàn cãi'', ''thẳng thừng từ
    chối việc “cân nhắc” từ bỏ'' (giữ dấu ngoặc kép quanh ''cân nhắc'')."]'
- segment_id: YS-LN06/Text/part0019.html/p000092
  kind: terminology_and_voice
  value: 'choices=["Tương phản & phủ định kép: giữ liên từ chuyển ý ''Mặt khác'' và
    phủ định ''không thể chấp nhận thứ lý lẽ ngăn cản việc thống nhất những vùng đất
    nói tiếng Ildoa''."]'
