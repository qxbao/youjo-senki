choices:
- segment_id: YS-LN06/Text/part0019.html/p000434
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya với cấp dưới: tự xưng hợp ngôi ''chúng ta''; trần
    thuật giữ nguyên tên ''Tanya''; ''the Empire'' -> ''Đế quốc''; ''in the west''
    -> ''ở phía tây''."]'
- segment_id: YS-LN06/Text/part0019.html/p000435
  kind: terminology_and_voice
  value: 'choices=["Giữ đúng cấu trúc giả định trái thực tế trong quá khứ (''Chuyện
    sẽ khác nếu đại bác trên bờ đã đấu pháo với hải pháo và đẩy lùi được chính các
    chiến hạm'') đối lập với thực tế đã xảy ra (''nhưng nếu chúng ta chỉ đánh chặn
    máy bay rồi xua đuổi chúng đi…'').", "Thuật ngữ: ''cannons on land'' -> ''đại
    bác trên bờ'', ''naval cannons'' -> ''hải pháo'', ''intercepted'' -> ''đánh chặn''."]'
- segment_id: YS-LN06/Text/part0019.html/p000436
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm mang tính chất vấn/mỉa mai của Tanya: giữ phủ
    định ''định không thừa nhận'' và thành ngữ ''chơi xỏ được chúng ta một vố''."]'
- segment_id: YS-LN06/Text/part0019.html/p000437
  kind: terminology_and_voice
  value: 'choices=["Thoại Serebryakov báo cáo/trò chuyện với Tanya: tự xưng ''Tôi''
    kèm tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000438
  kind: terminology_and_voice
  value: 'choices=["Tanya đáp lời Serebryakov: tự xưng ''Tôi''; cấp bậc ''First Lieutenant
    Serebryakov'' -> ''Trung úy Serebryakov''; ''sneak attack'' -> ''cuộc đánh úp'';
    tình thái suy đoán ''Có lẽ họ chẳng hề có chút chuẩn bị nào cả''."]'
- segment_id: YS-LN06/Text/part0019.html/p000439
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm tổng quát của Tanya: giữ ''Trong thời chiến,
    điều quan trọng là phải có những nguồn thông tin khác ngoài các bản tin chính
    thức đầy giật gân''."]'
- segment_id: YS-LN06/Text/part0019.html/p000440
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi Serebryakov: dùng ''Chúng ta'', giữ câu hỏi trực
    tiếp ''Vậy thực sự thì chuyện gì đã xảy ra?''."]'
- segment_id: YS-LN06/Text/part0019.html/p000441
  kind: terminology_and_voice
  value: 'choices=["Thoại Serebryakov với Tanya: tự xưng ''tôi'', kết câu bằng ''ạ'';
    ''training mage company'' -> ''Đại đội pháp sư huấn luyện''; ''got scrambled''
    -> ''đã nhận lệnh xuất kích khẩn cấp''; giữ tương quan so sánh ''thiên về phòng
    ngự hơn là tấn công''."]'
- segment_id: YS-LN06/Text/part0019.html/p000442
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya: giữ câu hỏi phản xạ và thuật ngữ ''đại đội huấn luyện'',
    ''nhiệm vụ thực chiến''."]'
- segment_id: YS-LN06/Text/part0019.html/p000443
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn trần thuật về Tanya theo DEC-P01-001: dùng đại từ ''nó'';
    giữ cấu trúc nhượng bộ - điều kiện (''Dẫu nó có thể đoán được… nhưng nếu họ đang
    đẩy… thì quả là quá sức tệ hại'')."]'
- segment_id: YS-LN06/Text/part0019.html/p000444
  kind: terminology_and_voice
  value: 'choices=["Thoại Serebryakov với Tanya: giữ ''Vâng ạ'' và ''ạ'' cuối câu;
    giữ phủ định ''Họ không bị điều đi nơi khác'' và thuật ngữ ''đánh chặn''."]'
- segment_id: YS-LN06/Text/part0019.html/p000445
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán của Tanya: ''Đúng là thiếu hụt nhân lực trầm trọng''."]'
- segment_id: YS-LN06/Text/part0019.html/p000446
  kind: terminology_and_voice
  value: 'choices=["Nội tâm khái quát của Tanya: ngôi thứ hai giả định chung dùng
    ''bạn''; giữ phủ định ''không thể kỳ vọng có đủ bất cứ thứ gì''."]'
- segment_id: YS-LN06/Text/part0019.html/p000447
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tự quy chiếu của Tanya theo DEC-P01-001: dùng đại từ ''mình''."]'
- segment_id: YS-LN06/Text/part0019.html/p000448
  kind: terminology_and_voice
  value: 'choices=["Thoại Trung úy Wüstemann góp lời với Tanya: tự xưng ''Tôi'' kèm
    ''ạ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000449
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi Wüstemann: gọi ''Trung úy Wüstemann'', xưng ''Tôi
    - anh'', ngôi gộp ''chúng ta''; giữ đúng đối tượng câu hỏi là ''số giờ bay trung
    bình của đám lính mới trước khi được phân về đồn trú ở đâu đó''."]'
- segment_id: YS-LN06/Text/part0019.html/p000450
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên ''Tanya'' và đại từ ''anh ta'' quy chiếu Wüstemann."]'
- segment_id: YS-LN06/Text/part0019.html/p000451
  kind: terminology_and_voice
  value: 'choices=["Thoại Wüstemann trả lời Tanya: kết câu bằng ''ạ''; giữ các mốc
    số liệu ''ba mươi giờ bay theo hình thức tác chiến'', ''bay dẫn đường và huấn
    luyện cơ bản'', và tình thái ước lượng ''có lẽ vẫn chỉ rơi vào khoảng một trăm
    giờ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000452
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ ''*gây sốc*'' khớp chính
    xác với thẻ nghiêng trong nguồn; không thêm nhấn mạnh ở phần còn lại."]'
- segment_id: YS-LN06/Text/part0019.html/p000453
  kind: terminology_and_voice
  value: 'choices=["Trần thuật suy đoán: giữ tình thái ''Có lẽ'' và phủ định ''không
    thấy có gì kỳ lạ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000454
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''veteran magic officers'' -> ''các sĩ quan ma pháp
    kỳ cựu''; đại từ ''bọn họ'' và ''anh ta'' rõ chủ thể."]'
- segment_id: YS-LN06/Text/part0019.html/p000455
  kind: terminology_and_voice
  value: 'choices=["Thoại Thiếu tá Weiss hỏi Trung úy Wüstemann: gọi ''Cậu'', giữ
    câu hỏi xác nhận ngắn gọn."]'
- segment_id: YS-LN06/Text/part0019.html/p000456
  kind: terminology_and_voice
  value: 'choices=["Thoại Wüstemann đáp Weiss: xưng ''tôi'' kèm ''ạ'', gọi cấp bậc
    ''Thiếu tá Weiss''."]'
- segment_id: YS-LN06/Text/part0019.html/p000457
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss: giữ nhận xét ngắn ''Thế thì quá sức tồi tệ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000458
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán ngắn của Wüstemann: ''Ồ…''."]'
- segment_id: YS-LN06/Text/part0019.html/p000459
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya theo DEC-P01-001: dùng ''mình'' (''mình đoán
    có thể nói là''); giữ hình ảnh so sánh ''như vừa mút cả tá quả chanh'' và đối
    lập ''thời tiền chiến và giữa cuộc chiến''."]'
- segment_id: YS-LN06/Text/part0019.html/p000460
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya theo DEC-P01-001: dùng ''Mình''; giữ tương quan
    đối chiếu giữa ''phần lớn chương trình huấn luyện sĩ quan ma pháp đã bị cắt bỏ''
    và ''hầu như chẳng phân bổ chút thời gian nào cho việc đào tạo pháp sư''."]'
- segment_id: YS-LN06/Text/part0019.html/p000461
  kind: terminology_and_voice
  value: 'choices=["Thoại sĩ quan kỳ cựu: tự xưng ''tôi''; giữ thuật ngữ ''các tiểu
    đoàn pháp sư trên không'' và ''tiểu đoàn chim dodo''."]'
- segment_id: YS-LN06/Text/part0019.html/p000462
  kind: terminology_and_voice
  value: 'choices=["Thoại pha trò tiếp lời: dùng ''chúng ta'', giữ ẩn dụ ''loài chim
    không biết bay'' và ''chim cánh cụt''."]'
- segment_id: YS-LN06/Text/part0019.html/p000463
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên ''Weiss và Grantz'' và phủ định ''chẳng mấy
    buồn cười''."]'
- segment_id: YS-LN06/Text/part0019.html/p000464
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên ''Tanya'', đại từ phản thân ''mình'', tên
    đơn vị ''Kampfgruppe Salamander'' và ''Tiểu đoàn 203''."]'
- segment_id: YS-LN06/Text/part0019.html/p000465
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ phủ định đối lập ''xét trên tổng thể thì toàn
    quân lại không được như vậy''."]'
- segment_id: YS-LN06/Text/part0019.html/p000466
  kind: terminology_and_voice
  value: 'choices=["Thoại giữa các sĩ quan: giữ tình thái ''có lẽ biết bơi vẫn tốt
    hơn khi bị bắn rơi đấy''."]'
- segment_id: YS-LN06/Text/part0019.html/p000467
  kind: terminology_and_voice
  value: 'choices=["Thoại Grantz trêu Weiss: giữ ''quen với chuyện bị bắn hạ'' để
    làm nền cho câu bắt bẻ ở p000468."]'
- segment_id: YS-LN06/Text/part0019.html/p000468
  kind: terminology_and_voice
  value: 'choices=["Thoại Weiss đáp Grantz: xưng ''Tôi - cậu'', giữ cặp nháy đơn trích
    dẫn ''‘quen với chuyện bị bắn trúng’'' phân biệt với ''bị bắn hạ''."]'
- segment_id: YS-LN06/Text/part0019.html/p000469
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ chi tiết quá khứ của Weiss (''từng một lần bị
    bắn xuyên qua vai''), hành động của Grantz (''đang trêu chọc anh về chuyện đó''),
    nét tính cách (''khuynh hướng cuồng chiến'') và phủ định (''chẳng phải vấn đề
    gì to tát đối với Tanya'')."]'
- segment_id: YS-LN06/Text/part0019.html/p000470
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''Nó''; nhấn mạnh Markdown
    theo DEC-P01-002: giữ ''*cá tính*'' đúng phạm vi từ được in nghiêng trong nguồn."]'
- segment_id: YS-LN06/Text/part0019.html/p000471
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya theo DEC-P01-001: dùng ''nó''; giữ sự phân
    biệt giữa ''Cá tính'' (Individuality) và ''tính cách riêng của từng người'' (individual
    personalities) cùng phủ định ''không phải là thứ mà nó cần phải bận tâm''."]'
- segment_id: YS-LN06/Text/part0019.html/p000472
  kind: terminology_and_voice
  value: 'choices=["Thoại Tanya hỏi Wüstemann: gọi ''Trung úy Wüstemann'', xưng ''anh
    - chúng ta'', giữ câu hỏi về việc ''đám tân binh sẽ thực sự mang lại cho chúng
    ta chút sức chiến đấu nào không''."]'
- segment_id: YS-LN06/Text/part0019.html/p000473
  kind: terminology_and_voice
  value: 'choices=["Thoại Wüstemann đáp Tanya: xưng ''tôi'' kèm ''ạ''; giữ giả định
    đối chiếu quá khứ ''với tốc độ mà trước đây sẽ không tài nào tưởng tượng nổi''."]'
- segment_id: YS-LN06/Text/part0019.html/p000474
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ nguyên phản ứng chung ''Mọi người đều buộc phải
    buông một tiếng thở dài trước tin đó''."]'
- segment_id: YS-LN06/Text/part0019.html/p000475
  kind: terminology_and_voice
  value: 'choices=["Thoại Wüstemann với Tanya: xưng ''Chúng tôi'' kèm ''ạ''; giữ chuẩn
    xác mệnh đề giả định quá khứ ''những vết thương vốn dĩ có thể cứu chữa được lại
    tử vong do rơi xuống đất''."]'
- segment_id: YS-LN06/Text/part0019.html/p000476
  kind: terminology_and_voice
  value: 'choices=["Nội tâm của Tanya: dùng ''Chúng ta'', giữ quan hệ nhân quả ''phung
    phí họ chỉ vì thiếu trau chuốt rèn giũa''."]'
- segment_id: YS-LN06/Text/part0019.html/p000477
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tình thái ''có lẽ sẽ khiến… cảm thấy hơi lệch
    pha đôi chút'' và từ khóa lặp lại ''cá tính''."]'
- segment_id: YS-LN06/Text/part0019.html/p000478
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: giữ ''*Chuyện này thật nan
    giải quá đi mất*'' đúng phạm vi mệnh đề nội tâm được in nghiêng trong nguồn."]'
- segment_id: YS-LN06/Text/part0019.html/p000479
  kind: terminology_and_voice
  value: 'choices=["Thoại và trần thuật về Serebryakov: câu hỏi với Tanya kết bằng
    ''ạ''; trần thuật gọi Serebryakov là ''Cô''; giữ các thuật ngữ ''không hạm đội
    phía tây'', ''mặt trận Rhine''."]'
- segment_id: YS-LN06/Text/part0019.html/p000480
  kind: terminology_and_voice
  value: 'choices=["Thoại nhận xét tình hình điều quân: giữ nguyên nhân - hệ quả ''Với
    cái đà họ rút bớt quân để điều sang phía đông như thế này thì cũng đành chịu thôi''."]'
- segment_id: YS-LN06/Text/part0019.html/p000481
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya và Weiss: Tanya dùng đại từ ''Nó'' (DEC-P01-001),
    Weiss dùng đại từ ''anh''; giữ nghĩa ngữ cảnh hội thoại ''Nhưng Tanya phải bênh
    vực cho phía tây. Nó liếc nhìn Weiss và anh hiểu ngay ý nó''."]'
