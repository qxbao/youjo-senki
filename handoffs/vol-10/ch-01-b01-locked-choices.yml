choices:
- segment_id: YS-LN10/Text/chapter004.xhtml/p000001
  kind: terminology_and_voice
  value: 'locked=Giữ nguyên dòng tiêu đề thời gian – địa điểm viết hoa: ''NGÀY 26
    THÁNG 7 NĂM THỐNG NHẤT 1927, VĂN PHÒNG BỘ TỔNG THAM MƯU ĐẾ QUỐC''.'
- segment_id: YS-LN10/Text/chapter004.xhtml/p000002
  kind: terminology_and_voice
  value: locked=Giữ phủ định toàn phần ('chẳng một ai có thể vượt thoát khỏi quy luật
    tự nhiên này') và đúng phạm vi nhấn mạnh Markdown '*tầng mây thấp*' theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000003
  kind: terminology_and_voice
  value: locked=Giữ phủ định ('Không thể nào nhìn nhận thế giới chỉ theo bề nổi của
    nó được') và cấu trúc giới hạn lựa chọn ('chẳng có lựa chọn nào khác ngoài việc
    nhắm mắt lại để đón nhận thực tại').
- segment_id: YS-LN10/Text/chapter004.xhtml/p000004
  kind: terminology_and_voice
  value: locked=Giữ phép so sánh hơn ('Điều này lại càng đúng hơn...') và cụm 'trở
    thành hiện thân cho văn hóa của tổ chức đó'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000005
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Đại tá Lergen' và phủ định 'không phải là ngoại lệ
    đối với quy luật này'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000006
  kind: terminology_and_voice
  value: locked=Khóa đại từ trần thuật 'Anh' cho Lergen, chức danh 'sĩ quan tham mưu
    cao cấp' và tên cơ quan 'Bộ Tổng tham mưu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000007
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'anh', 'mình' và ẩn dụ 'bên ngoài cái ốc đảo của mình'
    (outside his bubble).
- segment_id: YS-LN10/Text/chapter004.xhtml/p000008
  kind: terminology_and_voice
  value: locked=Khóa 'Văn phòng Bộ Tổng tham mưu', 'phòng họp' và chi tiết 'một nụ
    cười chua chát bất giác hiện lên'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000009
  kind: terminology_and_voice
  value: locked=Giữ câu nhận định ngắn 'Chuyện này quả thực kỳ lạ.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000010
  kind: terminology_and_voice
  value: locked=Khóa 'Văn phòng Bộ Tổng tham mưu'; giữ cấu trúc phủ định giả định
    ('Đâu phải Văn phòng Bộ Tổng tham mưu có cách nào để tự mình chấm dứt cuộc chiến
    một cách đơn độc').
- segment_id: YS-LN10/Text/chapter004.xhtml/p000011
  kind: terminology_and_voice
  value: locked=Khóa tên hai cơ quan 'Bộ Ngoại giao' và 'Văn phòng Bộ Tổng tham mưu',
    cùng chi tiết 'cuộc gặp gỡ đầu tiên'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000012
  kind: terminology_and_voice
  value: locked=Khóa 'bên quân đội' và 'Bộ Ngoại giao'; giữ quan hệ nhân quả giữa
    tiền đề 'nhánh nào nên tự lo việc của nhánh nấy' và hệ quả 'sự lãng phí khổng
    lồ biết bao thời gian quý báu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000013
  kind: terminology_and_voice
  value: locked=Giữ phép nối tiếp 'Thứ thời gian...' và nhận định mạnh 'chẳng khác
    nào một tội lỗi'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000014
  kind: terminology_and_voice
  value: locked=Khóa 'Bộ Ngoại giao', 'Đại tá Lergen' và chi tiết người đại diện đến
    trước cả một người vốn rất đúng giờ như Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000015
  kind: terminology_and_voice
  value: 'locked=Khóa cách xưng hô xã giao trang trọng trong thoại của Conrad với
    Lergen: xưng ''Tôi'', gọi ''ông, thưa Đại tá''.'
- segment_id: YS-LN10/Text/chapter004.xhtml/p000016
  kind: terminology_and_voice
  value: 'locked=Khóa cách xưng hô của Lergen với Conrad: xưng ''Tôi'', gọi ''ông''
    và chức danh ''Tham tán Conrad''.'
- segment_id: YS-LN10/Text/chapter004.xhtml/p000017
  kind: terminology_and_voice
  value: locked=Khóa 'Lergen', đại từ 'Anh' và chuỗi hành động đang giơ tay chào theo
    điều lệnh nửa chừng thì nhận ra cái bắt tay hơi muộn rồi hạ tay xuống đáp lễ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000018
  kind: terminology_and_voice
  value: locked=Giữ sự đối lập 'một cái bắt tay thay vì động tác chào quân sự'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000019
  kind: terminology_and_voice
  value: locked=Khóa 'Lergen', đại từ 'anh' và chi tiết cái nắm tay 'mềm oặt đến mức
    không tưởng, khiến anh phải có ý thức tự kiềm chế để khỏi rùng mình'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000020
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc phủ định tăng tiến ('không phải là bàn tay của một người
    đàn ông từng cầm đến công cụ lao động, huống hồ là vũ khí').
- segment_id: YS-LN10/Text/chapter004.xhtml/p000021
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc', 'Lergen' và sự tự ngắt dòng suy nghĩ nội tâm ('—không,
    đây không phải là lúc để vẩn vơ với những suy nghĩ nhàn rỗi như thế').
- segment_id: YS-LN10/Text/chapter004.xhtml/p000022
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh' (Lergen), chi tiết ngoại hình – tuổi tác ('nhỉnh
    hơn anh đôi chút về tuổi tác… quá đỗi trẻ trung') và chức danh 'tham tán của Bộ
    Ngoại giao Đế quốc'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000023
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi' và cụm 'tất cả những người tiền nhiệm của tôi đều
    đã bị miễn nhiệm cả rồi' (hoặc 'bị cho thôi chức cả rồi', không dùng 'giải ngũ').
- segment_id: YS-LN10/Text/chapter004.xhtml/p000024
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'tôi' và câu hỏi nghi vấn có–không 'Nét mặt tôi đã để
    lộ suy nghĩ trong lòng rồi sao?' (hoặc 'Vẻ mặt tôi đã để lộ suy nghĩ trong lòng
    rồi hay sao?').
- segment_id: YS-LN10/Text/chapter004.xhtml/p000025
  kind: terminology_and_voice
  value: locked=Khóa 'Tham tán Conrad', 'hàm đại tá', 'Văn phòng Bộ Tổng tham mưu',
    cặp xưng hô 'Tôi' – 'ông' và hai câu hỏi đuôi liên tiếp ở cuối đoạn.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000026
  kind: terminology_and_voice
  value: locked=Khóa 'Tham tán Conrad', 'học viện quân sự', cấp bậc 'trung úy rồi
    trung tá', cặp xưng hô 'Tôi' – 'Ông' và phủ định 'chẳng phải chuyện gì lạ lẫm
    đâu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000027
  kind: terminology_and_voice
  value: locked=Khóa 'Vị tham tán', đại từ 'Chúng ta' và hình ảnh bông đùa 'mặc kệ
    mấy lão già ở lại với mấy ván bài của họ đi'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000028
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh ta' (chỉ Conrad dưới góc nhìn của Lergen), 'những
    bậc tiền bối của mình' và 'Bộ Ngoại giao'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000029
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', đại từ 'anh ta' (Conrad) và nhận định tình thái
    'có lẽ anh ta đang xả bớt đôi chút bức xúc'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000030
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'thưa Đại tá', đại từ 'chúng ta', thành ngữ 'ngồi chung
    một con thuyền' và cụm 'dọn dẹp mớ hỗn độn mà những người tiền nhiệm đã trút lại
    trên vai mình'.
