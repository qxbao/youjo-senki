choices:
- segment_id: YS-LN10/Text/chapter024.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm của Drake về việc 'giới tình báo' đặt trọn niềm
    tin vào 'người bạn của họ ở Đế quốc—điệp viên của họ' để huy động mọi nguồn lực
    đánh chặn mục tiêu, nhận định 'nghe cứ như mơ vậy' và trạng thái phủ định 'Drake
    không tài nào thông suốt nổi toàn bộ ý tưởng này'; không có nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa các đơn vị 'lữ đoàn pháp sư', 'Hạm đội Bản thổ', cụm 'cái gọi
    là ngày tấn công kia' và cảm nhận 'nghe thật siêu thực'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'túc trực suốt ngày đêm nhằm duy trì mức độ sẵn sàng
    chiến đấu tối đa', hệ quả 'đủ khiến người ta phải nghi ngờ sự tỉnh táo của họ',
    đại từ 'anh' chỉ Drake và cảnh tượng giả định sau khi toàn bộ vụ việc thất bại
    ở một quán rượu."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa mốc thời gian 'vào khoảng ngày thứ ba' và sự chuyển biến tâm
    lý của Drake khi suy nghĩ đó trở nên nhàm chán."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa nhận định 'đôi khi sự thật quả thực còn kỳ lạ hơn cả tiểu thuyết',
    mốc thời gian 'Vào ngày cuối cùng của tháng Tám' và hình ảnh ẩn dụ 'vị khách mà
    mình đang mong đợi'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'sự nhộn nhịp trên các làn sóng vô tuyến', thuật ngữ
    'Đài điều phái' và nhận định 'rõ ràng là đang có chuyện gì đó diễn ra'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000127
  kind: terminology_and_voice
  value: locks=["Khóa cấp bậc kèm tên riêng 'Trung tá Drake', tình thái hoàn thành
    trong quá khứ 'thì trận chiến hẳn đã bắt đầu rồi', câu lầm bầm về 'ngày phán xét
    cũng lại rơi vào cuối tháng', hành động 'siết chặt vũ khí' và việc 'sở chỉ huy
    gửi tới một bức điện giải thích tình hình'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa hô hiệu 'Daniel 01', đối tượng nhận tin 'toàn thể các đơn vị',
    chi tiết 'Tàu ngầm của ta đã phát hiện kẻ địch' và thông báo 'Đó là lực lượng
    của Đế quốc. Hạm đội của chúng đang tiến tới!'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', chức danh 'Chỉ huy Ballmer', câu hỏi nội
    tâm 'Tin tình báo của người điệp viên đó thực sự chuẩn xác sao?' và cảm xúc 'thậm
    chí còn thấy kinh ngạc'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'chiến tranh thông tin', hệ quả 'bắt đầu nghi ngờ
    tất cả mọi người' và hai câu hỏi đối lập về sự tồn tại thực sự của điệp viên hay
    mưu kế mớm thông tin giả cho 'Khối Thịnh vượng chung'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' chỉ Drake và quyết định ngừng suy nghĩ việc đó
    'để bảo toàn sức khỏe tinh thần của mình'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', phương châm hành động 'hoàn thành nhiệm vụ của
    mình, và anh sẽ thực hiện nó theo cách riêng của bản thân', cùng khẳng định rằng
    'Tướng Habergram đã nhầm lẫn về một điều'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa biệt danh 'Ác quỷ sông Rhine', phương hướng 'ở miền đông', phủ
    định tuyệt đối 'Không gì có thể làm thay đổi suy nghĩ của anh về chuyện này',
    danh xưng 'Pháp sư đó' và cụm 'những người lính Liên bang tội nghiệp, hết sức
    tội nghiệp kia'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa tình thái dự đoán 'có lẽ mình sẽ lại phải chạm trán con ác quỷ
    đó một khi bản thân quay về miền đông' và bước ngoặt trần thuật 'Anh nào có ngờ
    rằng mọi suy nghĩ của mình về vấn đề này sắp sửa tan thành mây khói'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000135
  kind: terminology_and_voice
  value: 'locks=["Khóa thán từ nghi vấn ngắn của Drake: ''“Hửm?”''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'tín hiệu ma lực mờ nhạt' và chi tiết 'Một bầu không
    khí căng thẳng kỳ lạ bao trùm không gian'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa sự tương đồng với cảm giác mà Drake 'từng cảm nhận được ở miền
    đông'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'một tín hiệu mà anh sẽ không bao giờ quên' và biệt
    danh định danh 'Bạch Ngân Rỉ Sét'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại cảm thán của Drake với đại từ tự xưng 'tôi' -
    'mình' và hình ảnh 'thiên thần hộ mệnh đang dõi theo che chở'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000140
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm 'Phải chăng thiên thần của anh đang muốn hại
    anh?', nhận định về 'Mức độ tắc trách', danh xưng 'Trung tá Drake', tội danh quân
    pháp 'đào ngũ trước mặt quân thù' và chuỗi cử chỉ 'xoa gáy, lắc đầu rồi lên tiếng
    nói với binh lính của mình'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa hiệu lệnh 'Số mười', cách gọi thuộc cấp 'anh em' và mệnh lệnh
    'Chuẩn bị tinh thần cho một cuộc tắm máu đi'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa cảm thán về giới hạn đáng sợ của tín hiệu, phủ định 'Anh không
    đời nào nhầm lẫn nó với bất kỳ tín hiệu nào khác được' và chi tiết 'nhận diện
    tín hiệu của ả ngay cả trong giấc ngủ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ 'Dù không muốn tin đến mấy' và mệnh đề phủ
    định khái quát 'trên đời này chẳng có điều gì là chắc chắn tuyệt đối cả'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa mệnh lệnh báo động cho 'Chỉ huy Ballmer ngay tức khắc', đại
    từ 'ông ấy', 'chúng ta' và cụm 'cả một tiểu đoàn ác quỷ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa câu báo cáo của thuộc cấp với đại từ 'Ông ấy' (chỉ Ballmer)
    và kính ngữ 'thưa Trung tá' (chỉ Drake)."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm của Drake về các 'cựu binh' phải tận mắt nhìn
    thấy thì mới tin được."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đơn vị 'đại đội', chi tiết quan sát 'đôi
    vai họ rõ ràng vẫn thiếu đi vẻ căng thẳng', phủ định một phần 'Điều đó không hẳn
    là xấu' và giả định trái thực tế trong quá khứ 'nhưng chắc chắn chuyện sẽ chẳng
    như vậy nếu những người lính này từng tận mắt chứng kiến con ác quỷ kia'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh', 'họ' và tính tất yếu phải cảnh báo rằng thuộc
    cấp sắp phải chiến đấu giành giật mạng sống của chính mình."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'trận chiến một mất một còn đầy tàn khốc', chỉ dẫn 'Hãy
    coi kẻ địch như những con ác quỷ thực thụ' và lời răn 'Đừng để vẻ bề ngoài của
    chúng đánh lừa'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận của người lính thuộc cấp với đại từ 'Chúng
    ta' và đối tượng quy chiếu là 'con bé nhỏ nhắn đó'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa lời khẳng định của Drake với đại từ tự xưng 'tôi', đại từ quy
    chiếu 'ả', sự tương phản giữa ngoại hình 'giống một bé gái' và bản chất 'một con
    quái vật nhỏ xảo quyệt'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', cụm 'các chiến hữu của mình' và phản ứng
    trái ngược của họ khi tưởng anh nói đùa rồi cười xòa cho qua."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp mang tính hoài nghi bông đùa của người lính và câu hỏi
    trêu chọc về việc 'Trung tá ở miền đông lâu quá rồi'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'Nỗi lo âu đã hoàn toàn tan biến khỏi người lính đó',
    quan sát của Drake qua tư thế thuộc cấp và nhận thức rõ đối thủ sẽ vô cùng khó
    nhằn ngay cả với 'những cựu binh này'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'những người anh em pháp sư hải quân đánh bộ của tôi',
    cặp đại từ 'Tôi' - 'các anh', nhận thức của Drake về lời lẽ 'trái ngược với phong
    thái quý ông', mệnh lệnh không được do dự trước phụ nữ ('buộc phải giết chúng
    nếu không muốn mất mạng') và chỉ thị dứt khoát bắn hạ ngay lập tức nếu phát hiện
    một bé gái trên bầu trời."]
