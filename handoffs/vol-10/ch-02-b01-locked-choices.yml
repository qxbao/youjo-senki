choices:
- segment_id: YS-LN10/Text/chapter008.xhtml/p000001
  kind: terminology_and_voice
  value: 'locks=["Khóa mốc thời gian - địa điểm đầu chương: ''NGÀY 29 THÁNG 7 NĂM
    THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG''; không dùng nhấn mạnh Markdown."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa địa danh 'mặt trận phía đông' và điểm nhìn trần thuật ngôi thứ
    ba."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000003
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ thoại giữa các sĩ quan: ''chúng ta'' - ''Tôi''; giữ
    câu hỏi nghi vấn về việc bị điều chuyển và mệnh đề bỏ lửng."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000004
  kind: terminology_and_voice
  value: 'locks=["Khóa tên tổ chức và cấp bậc chung: ''Các sĩ quan Lục quân Đế quốc''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc nhượng bộ - nghịch lý ('Tuy vậy, hoặc có lẽ chính vì
    vậy') và đơn vị 'tiểu đoàn'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000006
  kind: terminology_and_voice
  value: 'locks=["Khóa hướng hành quân: băng qua mặt trận phía đông nhưng di chuyển
    về ''phía tây''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta' và hướng di chuyển lặp lại về 'phía
    tây' / 'hướng tây'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000008
  kind: terminology_and_voice
  value: locks=['Khóa mạch liên kết nhân quả giải thích lý do cho sự càu nhàu.']
- segment_id: YS-LN10/Text/chapter008.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Hội đồng Tự trị', 'quân du kích', và ý toàn quân
    đang chầm chậm quay lại nơi từng xuất phát."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000010
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'thu hẹp chiến tuyến', góc nhìn của 'người lính bình
    thường' và phép so sánh tự sát bằng cách để vết thương hở rỉ máu đến cạn kiệt."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000011
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'các sĩ quan' bắt đầu có chung suy nghĩ với binh lính
    sau nhiều lần nhận lệnh rút quân."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa tên tổ chức 'Lục quân Đế quốc', quân hàm 'Trung tướng Zettour',
    thuật ngữ 'tác chiến cơ động quy mô lớn', và sự tương phản giữa tháng 7 (rút lui
    có tính toán) với tháng 6."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000013
  kind: terminology_and_voice
  value: 'locks=["Khóa câu hỏi độc thoại nội tâm tập thể có nhấn mạnh Markdown theo
    DEC-P01-002: ''*Chúng ta vẫn còn nắm quyền chủ động chứ?*''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta' và quy chiếu 'Cấp trên' cho chủ thể
    ra lệnh lùi sâu hơn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000015
  kind: terminology_and_voice
  value: 'locks=["Khóa cấu trúc phủ định tăng tiến: ''Không chỉ một hai người lính''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết chỉ đóng quân một đêm trước khi nhận lệnh mới lùi về
    phương tây và phủ định 'chẳng phải hạng người chỉ biết cắm đầu xông lên mà không
    suy nghĩ'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'cuộc tổng rút lui' và nhận định tình thái 'về cơ
    bản là điều tất yếu' dưới góc độ quân sự."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000018
  kind: terminology_and_voice
  value: 'locks=["Khóa hai nhóm chủ thể: ''Những người tốt nghiệp học viện'' và ''số
    ít binh lính dày dạn trận mạc''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ giải thích nối tiếp p000018 (việc điều chuyển quân liên
    miên thường diễn ra trước trận đánh quy mô lớn) và giới hạn thời gian 'ít nhất
    là trong giai đoạn đầu'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000020
  kind: terminology_and_voice
  value: locks=['Khóa quan hệ tương phản giữa việc ngoan ngoãn vào vị trí mới chờ
    lệnh với kết quả thất vọng lặp đi lặp lại.']
- segment_id: YS-LN10/Text/chapter008.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'nhà chiến lược lừng danh—Trung tướng Zettour' và
    phẩm chất quyết liệt, dứt khoát trên chiến trường."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho mệnh lệnh '*rút lui,
    rút lui*'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'các sĩ quan ngoài tiền tuyến' và tâm lý tự trấn an
    rằng cấp trên có ý đồ bí mật chưa nắm bắt được."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn sang 'các sĩ quan cấp trên của họ'
    cùng phủ định việc không thể bấu víu vào nghi vấn đó."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000025
  kind: terminology_and_voice
  value: 'locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho câu hỏi nội tâm của
    cấp chỉ huy: ''*Tại sao chúng ta lại hành động thận trọng đến thế?*''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000026
  kind: terminology_and_voice
  value: 'locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho suy nghĩ nội tâm: ''*Có
    điều gì đó bất ổn trong những mệnh lệnh này*''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa giả định trái thực tế ở quá khứ ('Giá như... hẳn đã...'), nhấn
    mạnh Markdown '*rút lui và giữ vững phòng tuyến*', và chủ thể 'các sĩ quan chỉ
    huy'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'phòng tuyến mới', 'tính cơ động', quân hàm 'Trung
    tướng Zettour', và đối lập giữa cách bố trí thiên về cơ động với việc củng cố
    công sự."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000029
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tướng này', thuật ngữ 'tác chiến cơ động', giả
    định 'Sẽ là một chuyện khác nếu họ đang lùi chiến tuyến về sau nhằm bảo toàn lực
    lượng cho một chiến dịch lớn', và câu kết mở ra vấn đề lớn của kết luận đó."]
