choices:
- segment_id: YS-LN10/Text/chapter028.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' và nhận định ngắn gọn về nhu cầu cần thêm thời gian."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc' cùng hình ảnh ẩn dụ chiếc đồng hồ cát đã
    cạn sạch từ lâu và cách duy nhất để có thêm thời gian là lật ngược cả chiếc đồng
    hồ cát lại."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000035
  kind: terminology_and_voice
  value: 'locks=[''Khóa mệnh đề chuyển ý chỉ ra vấn đề cốt lõi: ngay từ đầu họ đã
    bị mắc kẹt bên trong một chiếc đồng hồ cát.'']'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với định danh 'Lục quân', thuật
    ngữ 'chiến tranh tổng lực' và điều kiện 'dưới quyền một người chỉ huy duy nhất'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', hướng địa lý 'miền đông' và hình ảnh ẩn
    dụ về thắng lợi làm vang vọng điệp khúc đó hơn bất cứ điều gì khác."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Lục quân Đế quốc' và hệ quả chứng minh rằng nhờ chiến
    lược được thực thi bài bản, họ vẫn có thể duy trì vị thế của một siêu cường bất
    khả xâm phạm."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Tướng Romel', hướng địa lý 'miền tây' và ý nghĩa
    bài học quan trọng rút ra từ thất bại đó."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Lục quân Đế quốc', phủ định 'không có khả năng giành
    lấy chiến thắng trên một chiến trường xa lạ' và điều kiện 'nếu thiếu đi sự phối
    hợp nhịp nhàng'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa nhận định về sự tương phản quá lớn giữa kết cục của hai trận
    đánh và tác động làm sáng tỏ vấn đề đối với 'nhà chiến lược bên trong con người
    Rudersdorf'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại với đại từ 'Chúng ta' và thuật ngữ 'hệ thống chỉ
    huy duy nhất'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000043
  kind: terminology_and_voice
  value: 'locks=["Khóa sự phân biệt giữa các định chế: ''Lục quân'', ''Văn phòng Bộ
    Tổng tham mưu'', ''Bộ Tư lệnh Lục quân Tối cao'', ''Bộ Tư lệnh Tối cao'', ''quốc
    hội'', ''hoàng gia'' và ''ý nguyện của người dân''."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ 'chúng ta' và nhận định
    chính những yếu tố đó đang trói buộc quân đội."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông', chi tiết chuyển từ thuốc lá điếu sang
    xì gà để đổi gió và sự bận tâm tới một ý tưởng mới nhen nhóm nơi góc tâm trí."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm giả định về khả năng chiến thắng với 'một hệ
    thống chỉ huy duy nhất', câu trả lời phủ định mức độ chắc chắn ('Điều đó chưa
    có gì chắc chắn') và mục đích chấm dứt cảnh đi trên dây để 'lục quân' vận dụng
    quỹ thời gian cùng nguồn lực hạn hẹp."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*tính tất yếu*', cấp
    bậc kèm tên riêng 'Trung tướng Rudersdorf' và phản ứng nhăn mặt kèm tiếng cười
    gượng gạo đầy bất an."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'Ta' và sắc thái phủ định tự răn mình không nên
    vội vã đi quá xa trong độc thoại của Rudersdorf."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000049
  kind: terminology_and_voice
  value: locks=['Khóa trạng thái suýt chút nữa đã bất cẩn đưa ra quyết định về một
    vấn đề đầy rắc rối.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Kế hoạch B' và bản chất 'vẫn chỉ là một kế hoạch
    dự phòng'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000051
  kind: terminology_and_voice
  value: 'locks=["Khóa định danh ''Tham tán Conrad'', địa danh ''Ildoa'', ''Kế hoạch
    B'', ''Đế quốc'' và quan hệ điều kiện: chừng nào còn cơ may rút chân ra khỏi cuộc
    chiến qua ngả hòa đàm thì Kế hoạch B vẫn phải xếp lại phía sau."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ tự xưng 'Ta' - 'mình',
    tên riêng 'Zettour', đại từ 'lão' quy chiếu Zettour và sự đối chiếu giữa trí tưởng
    tượng phục vụ mưu mẹo chiến trường của Zettour với ý tưởng mà Rudersdorf từng
    nghĩ mình sẽ không bao giờ phải tính đến."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa nỗ lực cười xòa để gạt bỏ ý nghĩ đó của 'Ông'
    với việc nó vẫn ngoan cố đeo bám."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000054
  kind: terminology_and_voice
  value: locks=['Khóa hình ảnh ẩn dụ về việc ý tưởng đó đã cắm rễ trong tâm trí ông.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000055
  kind: terminology_and_voice
  value: 'locks=["Khóa chuỗi định danh bản chất ý tưởng: dành cho ''kịch bản tồi tệ
    nhất'', định hình đất nước dưới ''tình trạng thiết quân luật'' nếu buộc phải đi
    đến bước đó, là ''giải pháp khẩn cấp'' có triển vọng thành công khả quan."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000056
  kind: terminology_and_voice
  value: 'locks=["Khóa mệnh đề phủ định và điều kiện: đó không phải là điều mà bất
    kỳ người lính tỉnh táo nào từng thề trung thành với ''hoàng gia'' và ''Tổ quốc''
    có thể thực hiện đến cùng nếu không đánh mất sự tự chủ của bản thân."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000057
  kind: terminology_and_voice
  value: locks=['Khóa mong muốn đọc một cuốn tiểu thuyết trinh thám hoặc bất cứ thứ
    gì giúp tâm trí ông tạm quên đi mọi chuyện.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000058
  kind: terminology_and_voice
  value: 'locks=["Khóa nhấn mạnh Markdown toàn câu theo DEC-P01-002 đối với nhịp chuyển
    ý ngập ngừng trong nội tâm: ''*Mặc dù vậy—nói đi thì cũng phải nói lại—dẫu sao
    chăng nữa…*''."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Trung tướng Rudersdorf', ẩn dụ 'quả bom' và hướng
    gửi tới từ 'miền tây'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại mở đầu bằng 'bản báo cáo khẩn cấp của Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết nhận lời cảnh báo từ 'vị tướng ấy' (Romel) qua bức
    thư niêm phong trao tận tay và phép so sánh vấn đề không chịu tan biến giống như
    làn khói xì gà quanh ông."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhượng bộ giữa tính chất giống một 'linh cảm' của lời
    cảnh báo với việc những căn cứ cho linh cảm của 'ông ta' (Romel) lại hết sức đáng
    ngại."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa nội dung cảnh báo rằng nhiều khả năng 'hệ thống mã hóa' của
    họ đã bị phá giải và mức độ chấn động khôn lường nếu điều đó có dù chỉ một phần
    là sự thật."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'vị tướng', nhu cầu phải rà soát lại 'các bộ mật mã'
    và việc kiểm tra xác nhận từng 'quân chủng' với thông lệ riêng dù đòi hỏi khối
    lượng công việc khổng lồ nhưng dứt khoát phải làm."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa tâm lý không muốn nghĩ tới khả năng có gián điệp trong lòng
    'Đế quốc' và nhận định rằng chỉ liệt kê các khả năng không giúp chỉ đích danh
    được vấn đề thực tế nào."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000066
  kind: terminology_and_voice
  value: 'locks=["Khóa câu độc thoại của Rudersdorf với đại từ ''Ta'' - ''chúng ta'',
    đặt song song hai nguy cơ: có ''kẻ phản bội'' nội bộ và việc kẻ địch thực sự đã
    giải mã được ''mật mã'' của họ."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa nhận định rằng mối nghi ngại/tranh cãi xoay quanh các 'thông
    tin tuyệt mật' của họ là một bước lùi nghiêm trọng."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Trung tướng Rudersdorf' và tình thế bế tắc khi ông
    không có cách nào biết được liệu 'các bộ mật mã' của mình có thực sự đáng tin
    cậy hay không."]
