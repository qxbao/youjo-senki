segment_id_end: YS-LN10/Text/chapter022.xhtml/p000221
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000197
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất với đại từ tự quy chiếu 'Mình'
    theo DEC-P01-001, giữ nguyên lập luận phân biệt giữa sự dại dột cá nhân (đi kèm
    với tự do/đa dạng) và sự kinh tởm trước tình trạng hiện tại."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000198
  kind: terminology_and_voice
  value: locks=["Khóa đoạn nội tâm phê phán 'sự ngu xuẩn ở cấp độ quốc gia', giữ phép
    đính chính tăng tiến ('Một quốc gia—không, một tổ chức—') và câu điều kiện ẩn
    dụ ('Nếu bộ não ở tầng lớp chóp bu đã mục ruỗng... thì chẳng còn hy vọng nào cứu
    vãn nổi phần thân xác bên dưới nữa')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000199
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại phản bác của Tanya với đại từ bao gộp 'Chúng ta' /
    'chúng ta', cách gọi 'các vị', mệnh đề điều kiện phủ định ('không thể thắng cuộc
    chiến này nếu thiếu ngoại giao') và thuật ngữ 'giảng hòa'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000200
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm giữ nguyên đối tượng và độ mở ('Những người
    ở ngoài thực địa mong muốn điều gì?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000201
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('Mình' / 'mình' theo DEC-P01-001),
    tên 'Đế quốc', giả định nhượng bộ ('có thể thắng chín mươi chín lần, nhưng tất
    cả sẽ bị cuốn phăng chỉ bởi một thất bại duy nhất ở trận đánh thứ một trăm'),
    điển tích 'Hạng Vũ' - 'Lưu Bang' và cấu trúc phủ định so sánh hơn ('không muốn...
    lại càng không muốn')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000202
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya với đại từ 'Chúng ta' / 'chúng ta', thuật
    ngữ 'tiền tuyến', 'Đế quốc', 'quân đội', cấu trúc phủ định tuyệt đối ('gần như
    đã bị phung phí sạch sành sanh', 'chẳng có lấy một dấu hiệu nào') và hai hình
    ảnh ẩn dụ ('củi đốt cho ngọn lửa ngày hôm nay', 'mặt trời đã sắp sửa lặn trên
    Đế quốc')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000203
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('mình' theo DEC-P01-001), thuật
    ngữ 'chuyên viên nhân sự', phủ định ('chẳng phải là vấn đề gì to tát') và quy
    luật chảy máu chất xám bắt đầu từ những nhân sự muốn giữ lại nhất."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000204
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi thứ tự rời đi của 'nhân viên hạng S', 'nhóm hạng A' để
    lại quyền kiểm soát cho 'đám nhân sự hạng B', cùng nhấn mạnh Markdown '*từng*'
    theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000205
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba quy chiếu tới 'Tanya' ('cô'),
    tên tổ chức 'Lục quân Đế quốc' và giới hạn phạm vi ('chỉ được ghi nhận ở phạm
    vi nội bộ')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000206
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba ('cô'), nhấn mạnh Markdown '*đối thủ
    cạnh tranh*' theo DEC-P01-002, cùng các mệnh đề phủ định về thất bại thị trường
    ('không thể tự do dịch chuyển', 'chẳng bao giờ có thứ gì tốt đẹp nảy sinh được
    từ các chế độ độc tài')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000207
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật gắn với góc nhìn của 'Tanya', định danh 'Being
    X' và phép đối lập giữa 'những bàn tay vô hình của một đấng tối cao' với 'cặp
    móng vuốt bẩn thỉu của Being X'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000208
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba mô tả 'Tanya' không kìm nén được
    cơn giận và lại bắt đầu lên tiếng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000209
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại chất vấn của Tanya với cụm 'lý do quốc gia của đất
    nước chúng ta' và câu cảm thán bị ngắt ngang ('Ắt hẳn đây phải là một trò đùa
    tồi tệ nào đó—!')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000210
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Tham tán Conrad' mang nét mặt
    vừa cảm thông vừa không tán thành cắt ngang lời than phiền của 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000211
  kind: terminology_and_voice
  value: locks=["Khóa lời nhắc nhở của Conrad gọi Tanya là 'thưa Trung tá' và đại
    từ 'Cô' trong câu hỏi chỉnh đốn phép tắc."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000212
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển điểm nhìn về ngôi thứ nhất nội tâm ('mình' / 'Mình'
    theo DEC-P01-001) đánh giá 'ông ta' (Conrad) và nụ cười tán thưởng nghiêm nghị."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000213
  kind: terminology_and_voice
  value: locks=["Khóa sự đan xen điểm nhìn đặc trưng trong nguyên tác giữa quy chiếu
    ngôi thứ ba ('Ông ta quở trách Tanya') và tự sự ngôi thứ nhất ('mình tìm kiếm
    ở một người đồng nghiệp', 'mình có thể làm việc cùng')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000214
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('Mình' / 'mình' theo DEC-P01-001),
    so sánh ngang bằng với 'Trung tướng Zettour' và hành động nhìn 'vị tham tán' rồi
    ngồi xuống."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000215
  kind: terminology_and_voice
  value: locks=["Khóa câu miêu tả đôi mắt lạnh lùng và toan tính của 'ông ta' (Conrad)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000216
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm ngôi thứ nhất ('Mình' / 'mình' theo DEC-P01-001)
    về trí tuệ điềm tĩnh đằng sau nghi thức xã giao của người có thể hợp tác làm ăn
    cùng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000217
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya gọi Conrad là 'Thưa Tham tán', xưng hô 'tôi'
    - 'ông' và liệt kê ba chủ thể đã trả giá ('lục quân, các thuộc cấp của tôi và
    bản thân tôi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000218
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của 'Tham tán Conrad' gọi 'Trung tá Degurechaff',
    cặp xưng hô 'Tôi' - 'cô' ('hai ta') và phần trần thuật xen giữa giữ nguyên phủ
    định ('không hề có ý định để Tanya lảng tránh câu hỏi của mình')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000219
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với phủ định ('Ông ta không ưa lối
    nói vòng vo bóng gió'), thành ngữ 'dẹp bỏ hết những màn khói mù che mắt' và tên
    'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000220
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba mô tả cơ hội để 'Tanya' ('cô') nắm
    thế chủ động hỏi 'ông ta' (Conrad) điều cô thực sự muốn biết."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000221
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại chốt đoạn của Tanya đại diện cho phía quân đội ('Chúng
    tôi' / 'chúng tôi') kết hợp ngôi thứ nhất cá nhân ('tôi') để đặt câu hỏi trực
    diện cho phía Conrad/Bộ Ngoại giao ('các ông muốn gì ở chúng tôi?')."]
