segment_id_start: YS-LN10/Text/chapter022.xhtml/p000026
segment_id_end: YS-LN10/Text/chapter022.xhtml/p000055
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn suy ngẫm nội tâm với đại từ tự quy chiếu 'mình', các
    phủ định ('bất khả thi', 'chẳng thể chuẩn bị chu toàn cho bất kỳ một việc nào
    cả', 'chẳng thể làm tốt được việc gì') và quan hệ tương đương giữa việc đòi chuẩn
    bị cho mọi khả năng với đòi sự hoàn hảo."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại với đại từ 'chúng ta', phủ định ('thiếu một kế hoạch
    cụ thể', 'không còn mang bất kỳ ý nghĩa chiến lược thực sự nào nữa') và mức độ
    tình thái ('gần như là bất khả thi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tham tán Conrad với xưng hô 'Tôi' - 'thưa Trung
    tá', đại từ bao gộp 'chúng ta', cùng cấu trúc câu hỏi giả định ('Nếu có chiến
    lược đúng đắn, chẳng phải một chuỗi những chiến thắng mang tính quyết định vẫn
    có khả năng dẫn tới thắng lợi chung cuộc trong cuộc chiến này hay sao?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000029
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn độc thoại nội tâm của Tanya ('mình' theo DEC-P01-001),
    cách gọi 'Vị tham tán', đại từ ngôi thứ ba 'ông ta', các thuật ngữ 'câu hỏi gài
    bẫy', 'tiền tuyến', 'công tác tuyên truyền' và phủ định ('chẳng biết gì về thực
    trạng hiện nay')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại của Tanya với đại từ 'tôi' - 'chúng ta' và nhận định
    đã cạn thời gian."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000031
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Ý cô là sao?*', danh
    xưng 'Vị tham tán' ('ông ta'), 'Đại tá Lergen' ('anh ấy'), tên gọi 'Đế quốc' và
    phủ định ('chẳng còn lấy một khắc dư dả nào')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô trong thoại của Tanya với Tham tán Conrad ('Ông' - 'tôi',
    'chúng ta'), ẩn dụ tài chính ('đứng bên bờ vực phá sản', 'mua thêm được chút thời
    gian gia hạn') và phủ định tuyệt đối trên chiến trường."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn tiếp lời của vị tham tán ('Rồi sao nữa?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa câu trả lời của Tanya với đại từ 'chúng ta', quan hệ nhân quả
    ('do thế bất lợi về mặt chiến lược') và ý nghĩa chiến thắng trận đánh chỉ kéo
    dài thất bại tất yếu."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Tham tán Conrad đối với Tanya ('tôi' - 'cô', 'thưa
    Trung tá') và trọng tâm câu hỏi truy vấn kết luận của người nói."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch từ câu hỏi nội tâm trực tiếp sang trần thuật
    ngôi thứ ba ('Tanya'), danh xưng 'vị tham tán' và nhận định ông ta rõ ràng là
    người thông minh."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm về lý do vị tham tán ('ông ta') lảng tránh việc
    đi đến kết luận hiển nhiên này."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya với xưng hô 'Thưa Tham tán', 'tôi' - 'ông',
    'chúng ta', cấu trúc phủ định kép ('không hiểu làm sao ông lại có thể chưa biết')
    và nhận định đã đang thua cuộc chiến trên phương diện chiến lược."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tham tán Conrad với đại từ 'tôi' - 'các vị' (chỉ
    phía quân đội/Bộ Tổng tham mưu mà Tanya và Lergen đại diện) và câu hỏi vì sao
    không thử tìm cách lật ngược thế bất lợi vừa nêu."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000040
  kind: terminology_and_voice
  value: locks=['Khóa nhận định về nguyên tắc dùng chiến lược để thắng chiến lược
    và tính hợp lý của việc tập trung vào chiến lược để thoát khỏi thế kẹt.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000041
  kind: terminology_and_voice
  value: locks=['Khóa hình ảnh so sánh tình cảnh hiện tại với việc cố hốt lại bát
    nước đã đổ đi.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi vặn lại của Tanya với đại từ 'Ông' - 'chúng ta' về việc
    liệu còn ở vào vị thế để thử hay không."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi phản bác của vị tham tán kèm danh xưng 'thưa Trung tá'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Tanya với đại từ 'Chúng tôi' - 'Ông', khẳng định
    đã thử nhưng không nghĩ ra cách nào và câu hỏi ngược cuối đoạn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi suy luận nội tâm của Tanya về vị tham tán ('ông ta'),
    phép đối lập giữa 'con tim' và 'khối óc', động cơ trốn chạy thực tại và sự kinh
    ngạc ở câu cảm thán cuối."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba ('Tanya') mô tả việc cô đẩy cuộc
    trò chuyện tiến thêm một bước sau khi nhận ra sự thật lạnh sống lưng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại của Tanya với danh xưng 'Thưa Tham tán', đại từ 'chúng
    ta', các thuật ngữ 'chiến thắng chiến lược', 'trên nhiều mặt trận' và lời cảnh
    báo phải chuẩn bị cho tình huống xấu nhất."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi gạn ý của vị tham tán với đại từ 'cô'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*cô*', xưng hô 'Ông'
    - 'tôi' - 'chúng ta' trong thoại, tên riêng 'Tanya' trong trần thuật, cùng các
    thuật ngữ 'cố vấn học thuật', 'đội xử bắn', 'chăm sóc khách hàng' và lập luận
    châm biếm của Tanya."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' - 'mình' theo DEC-P01-001, danh xưng 'Đại
    tá Lergen' và chi tiết hai cặp mắt mang vẻ hư vô chủ nghĩa đổ dồn về phía Tanya."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với danh xưng 'vị tham tán' và đại từ 'ông ta'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của vị tham tán với đại từ 'cô', danh xưng 'thưa Trung
    tá' và cụm 'những biện pháp hà khắc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Tanya với danh xưng 'thưa Tham tán', đại từ 'tôi'
    và ẩn dụ 'ngăn chặn một trận dịch bệnh'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận lại của vị tham tán với đại từ 'Cô' và cụm
    'một trận dịch bệnh'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000055
  kind: terminology_and_voice
  value: locks=['Khóa lời giải thích kết đoạn của Tanya về sự bất tài khi không dám
    đối diện thực tại chiến trường, mối nguy từ sĩ quan không xứng vị trí và nhận
    định nỗi sợ hãi là đồng minh của kẻ bất tài, đáng sợ hơn cả những kẻ địch đáng
    gờm nhất.']
