choices:
- segment_id: YS-LN10/Text/chapter020.xhtml/p000079
  kind: terminology_and_voice
  value: locked=Giữ đại từ nội tâm/nguyên tắc chung 'công ty mình', cấu trúc nhấn
    mạnh 'nói thẳng ngay từ đầu về những mặt hàng mà công ty mình không kinh doanh'
    và 'kiến thức cơ bản trong kinh doanh'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000080
  kind: terminology_and_voice
  value: locked=Giữ đại từ trần thuật 'Cô' chỉ Tanya, dấu ba chấm ngập ngừng 'có thể
    gây… thất vọng', cấu trúc phủ định kép 'cái gì đã không có thì vẫn là không có'
    và thuật ngữ 'suy nghĩ viển vông'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000081
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'cô', cụm 'giữ giọng điệu và thái độ điềm tĩnh' và nhận
    định 'Nụ cười là yếu tố đầu tiên và quan trọng nhất khi làm việc với khách hàng'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000082
  kind: terminology_and_voice
  value: locked=Giữ cụm 'Việc theo sát đến cùng', đại từ nội tâm 'mình' và 'nền tảng
    tốt nhất để xây dựng lòng tin'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000083
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Tanya', danh xưng 'vị tham tán' và hình ảnh 'hóa thân
    thành một chuyên gia nói năng thẳng thắn'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000084
  kind: terminology_and_voice
  value: locked=Giữ cặp xưng hô 'tôi' - 'ngài' cùng đại từ 'chúng ta', các cụm 'đám
    lừa đảo và cuồng tín', 'một người lính có tư duy logic', 'thắng lợi hoàn toàn'
    và 'đang nằm mơ giữa ban ngày đấy'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000085
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown theo DEC-P01-002 tại '*nhảy việc*', cấu trúc
    giả định trái thực tế kèm phủ định ('Nếu họ có thể thắng cuộc chiến này, ý định
    *nhảy việc* đã chẳng bao giờ thoáng qua tâm trí Tanya'), tên riêng 'Nhật Bản',
    'Thế chiến II', 'Đế quốc' và ẩn dụ 'một con tàu đắm'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000086
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc giới hạn 'Bất kỳ ai có chút năng lực phân tích tối thiểu
    cũng chỉ có thể...', cụm 'sự thật rành rành' và hình ảnh 'đất nước này đang hấp
    hối rồi'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000087
  kind: terminology_and_voice
  value: locked=Giữ câu hỏi phản ứng sững sờ có dấu ba chấm mở đầu '“…Cô mất trí rồi
    sao?”'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000088
  kind: terminology_and_voice
  value: locked=Giữ câu đáp phủ định lịch sự '“Không đâu, thưa Tham tán.”'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000089
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Tanya', đại từ 'ông ấy' chỉ Conrad và cụm 'vẫn giữ
    vẻ điềm tĩnh'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000090
  kind: terminology_and_voice
  value: locked=Giữ cặp xưng hô 'Tôi' - 'ngài' và cụm 'đưa ra lời khuyên đúng sự thật'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000091
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'cô' trong lời Conrad gọi Tanya, giọng chất vấn hoài nghi
    và thuật ngữ 'nhà môi giới trung thực'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000092
  kind: terminology_and_voice
  value: locked=Giữ câu đáp điều kiện ngắn gọn '“Nếu ngài cần tôi làm thế.”'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000093
  kind: terminology_and_voice
  value: locked=Giữ danh xưng 'Tham tán Conrad' và hành động 'lắc đầu'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000094
  kind: terminology_and_voice
  value: locked=Giữ cách gọi hạ thấp 'Một trung tá quèn', chi tiết 'một đứa trẻ',
    đại từ 'tôi' và lời cảnh cáo 'Nếu là tôi thì tôi sẽ suy nghĩ kỹ trước khi phát
    ngôn bạo miệng như vậy đấy'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000095
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc phủ định đối chiếu 'không phải là Tanya, mà là người
    đàn ông ngồi cạnh cô', cùng danh xưng 'Tham tán Conrad' và 'Đại tá Lergen'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000096
  kind: terminology_and_voice
  value: locked=Giữ cụm 'Là một đồng ngũ trong quân đội', đại từ 'ông ấy' chỉ Lergen
    và tình thái 'cảm thấy buộc phải lên tiếng can thiệp'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000097
  kind: terminology_and_voice
  value: locked=Giữ lời thưa 'Thưa Tham tán', danh xưng 'Trung tá Degurechaff', đại
    từ 'Tôi' / 'chúng ta' - 'cô ấy', các cụm 'một trong những quân nhân có nhiều huân
    chương nhất', 'một thế lực đáng gờm nơi tiền tuyến' và nhận xét bỏ lửng 'cách
    dùng từ của cô ấy đôi khi hơi cực đoan…'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000098
  kind: terminology_and_voice
  value: locked=Giữ câu hỏi phản bác mang tính hoài nghi của Conrad '“Nghe có vẻ hơi
    phóng đại quá đấy, phải không?”'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000099
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown theo DEC-P01-002 tại '*ai*', tên riêng 'Tanya',
    đại từ 'ông ta' chỉ Conrad và phủ định 'không biết *ai* đang đưa ra ý kiến thẳng
    thắn cho mình'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000100
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'cô' - 'ông ta', tên riêng 'Đế quốc', sự đối lập giữa việc
    hồ sơ thành tích không tự nói lên tất cả ở ngoài biên giới nước nhà với 'hàng
    huân chương gắn dọc cổ áo' trong phạm vi biên giới Đế quốc.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000101
  kind: terminology_and_voice
  value: 'locked=Giữ nguyên danh sách huân chương và huy hiệu quân sự: ''Huy hiệu
    Xung kích Cánh Bạc, Huy hiệu Xung kích Dã chiến, Huy hiệu Chiến thương, Huy hiệu
    Tác chiến Chiến hào Hạng Nhất, Cài ngực Cận chiến Hạng Đặc biệt, Thập tự Sắt Hạng
    Nhất…''.'
- segment_id: YS-LN10/Text/chapter020.xhtml/p000102
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown theo DEC-P01-002 tại từ tượng thanh '*Cạch,
    cạch, cạch…*', tên riêng 'Tanya' và hành động 'lần lượt chỉ vào từng tấm huân
    chương của mình'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000103
  kind: terminology_and_voice
  value: locked=Giữ phép so sánh cấp độ giữa 'ở một công ty' và 'Trong quân đội',
    cùng kết luận 'quá đủ để giành được sự tôn trọng của một người đồng hương'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000104
  kind: terminology_and_voice
  value: locked=Giữ cặp xưng hô 'Tôi' / 'mình' - 'ngài', thuật ngữ 'Pháp sư Định danh',
    câu hỏi phản vấn 'Trong mắt ngài thì những thứ này trông có phóng đại không?'
    và khẳng định tư cách bàn về 'thực trạng cuộc chiến'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000105
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Tanya', phủ định 'chẳng chút ngần ngại' và mục đích
    'dùng những huân chương vinh dự của mình để thuyết phục người đàn ông này'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000106
  kind: terminology_and_voice
  value: locked=Giữ đại từ nội tâm 'Mình' kết hợp tên riêng 'Tanya', cấu trúc đối
    lập phủ định—khẳng định 'không phải kiểu người để tổ chức chọn mình—mình mới là
    người đưa ra lựa chọn', cụm 'những thỏa hiệp khó chịu' và câu hỏi tu từ kết đoạn.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000107
  kind: terminology_and_voice
  value: locked=Giữ đại từ nội tâm 'mình' kết hợp tên riêng 'Tanya', cấu trúc phủ
    định mức độ 'Điều cuối cùng mình muốn' và cụm 'một kẻ vô danh tiểu tốt chẳng làm
    nên trò trống gì'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000108
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'tôi', chuỗi địa danh/mặt trận 'Norden', 'mặt trận Rhine',
    'Dacia', 'phương nam', 'mặt trận Liên bang', các chức vụ/đơn vị 'trung đội trưởng',
    'trường đại học quân sự', 'tiểu đoàn pháp sư trên không' (sau khi đồng bộ thuật
    ngữ) và tên chiến dịch 'Chiến dịch Cánh cửa xoay'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000109
  kind: terminology_and_voice
  value: locked=Giữ cụm danh từ kết đọng 'Sự mẫn cán, tính chính trực và một hồ sơ
    thành tích hoàn hảo không tì vết.'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000110
  kind: terminology_and_voice
  value: locked=Giữ tên đầy đủ 'Tanya von Degurechaff', đại từ 'cô' và khẳng định
    'đã làm quá đủ để chứng minh giá trị của mình trên chiến trường'.
- segment_id: YS-LN10/Text/chapter020.xhtml/p000111
  kind: terminology_and_voice
  value: locked=Giữ thuật ngữ 'mức định giá thị trường chuẩn xác' và câu kết độc thoại
    nội tâm 'Đây là điều đáng để tự hào.'.
