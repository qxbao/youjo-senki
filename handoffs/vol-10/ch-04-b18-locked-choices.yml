source_sha256: 227b8883d5a8e3130cfe2f54b05e0c3323cf2f3e1c41a6f4c12d99b6452c8f96
source_package_sha256: 702b1d030b81cb1f01da18563e2858776728ffe87e7be6ef9c323d471fb3d37f
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
