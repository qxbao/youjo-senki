segment_id_end: YS-LN10/Text/chapter022.xhtml/p000433
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000395
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô trong thoại của Tướng Romel với Tanya ('ta' - 'cô',
    danh xưng 'Trung tá') và ý khẳng định giao phó trọng trách."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000396
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn thể hiện sự bất ngờ nhưng giữ lễ tiết của Tanya
    ('…Dạ?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000397
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Degurechaff', đại từ thoại 'Ta' - 'cô'/'Các
    cô', thuật ngữ 'ưu thế trên không cục bộ', 'những trọng điểm' và giới hạn nhiệm
    vụ chỉ cần giữ vững các điểm này trong một đêm."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000398
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', đại từ 'ông ta' chỉ Romel và nhận định về
    thái độ nghiêm túc của vị tướng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000399
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', 'Tướng Romel', cụm 'Giới lãnh đạo
    Lục quân Đế quốc' và nhận xét châm biếm về việc vắt kiệt sức lực binh lính."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000400
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Thưa Tướng quân', đại từ 'tôi', tiểu từ 'ạ', các
    cấp đơn vị 'tiểu đoàn', 'trung đoàn', 'lữ đoàn' và phủ định đối lập quy mô đơn
    vị."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000401
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại của Romel ('ta', 'chúng ta', 'các cô'), đại từ
    chỉ địch ('chúng'), thuật ngữ 'Đội tuần tra đêm', 'ưu thế về quân số' và mục tiêu
    bảo đảm an toàn trong vài giờ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000402
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'ngài' - 'tiểu đoàn chúng tôi', tiểu từ 'ạ' và
    câu hỏi xác nhận việc tiểu đoàn phải một mình xoay xở nhiệm vụ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000403
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, đại từ 'họ' chỉ tiểu
    đoàn và mục đích chỉ ra nhiệm vụ quá sức cùng liên từ chuyển ý 'Tuy nhiên…'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000404
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá', đại từ 'Ta' - 'cô', tên gọi 'Đế quốc',
    'Tiểu đoàn Pháp sư Trên không số 203' và cấu trúc điều kiện phủ định nhấn mạnh
    sự tín nhiệm tuyệt đối."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000405
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Thôi xong, chết tiệt thật.*' trên toàn
    câu cảm thán nội tâm theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000406
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và sự đối lập giữa tiếng
    chửi thầm trong lòng với phản ứng chuẩn mực bên ngoài (nụ cười hoàn hảo, lời tán
    dương nhã nhặn, động tác chào chuẩn mực)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000407
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô trong thoại của Tanya với Romel ('ngài', 'thưa Tướng
    quân', 'tôi', tiểu từ 'ạ') và cam kết thi hành mệnh lệnh."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000408
  kind: terminology_and_voice
  value: locks=["Khóa toàn bộ mốc thời gian và địa điểm '0100 GIỜ NGÀY 17 THÁNG 8
    NĂM THỐNG NHẤT 1927, DOANH TRẠI TIỂU ĐOÀN PHÁP SƯ TRÊN KHÔNG SỐ 203'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000409
  kind: terminology_and_voice
  value: locks=["Khóa tên đơn vị 'Tiểu đoàn 203', thông tin nhận lệnh xuất quân và
    nhận định đây là việc quen thuộc với binh sĩ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000410
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, đại từ 'họ' và hành
    động phát biểu sau khi đơn vị đã tập hợp ngay ngắn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000411
  kind: terminology_and_voice
  value: locks=["Khóa khẩu lệnh quân sự 'Nghiêm!'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000412
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, đại từ 'họ', hình ảnh
    'cỗ máy chiến tranh' và niềm tự hào về lớp lính tinh hoa do chính tay Tanya đào
    tạo."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000413
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình'/'mình' theo DEC-P01-001, đại từ 'Họ'/'họ',
    phủ định 'chẳng có ai xuất sắc hơn tiểu đoàn của mình cả' và đánh giá nhiệm vụ
    vô lý nhưng đơn vị sẽ vượt qua."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000414
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô trong diễn văn của Tanya ('chúng ta', 'hỡi các
    chiến hữu của tôi'), các thuật ngữ 'mặt trận phía tây', 'Chiến dịch Cánh cửa xoay',
    'bản thổ của Khối Thịnh vượng chung' và hình ảnh cái gai trong mắt trên bầu trời."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000415
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Khối Thịnh vượng chung', các thuật ngữ 'pháp sư', 'bộ
    binh' và lập luận phủ định pháp sư không thể trấn giữ lãnh thổ vì không phải bộ
    binh."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000416
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', thuật ngữ 'lực lượng bộ binh' và kết luận
    cần đưa bộ binh đi cùng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000417
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình'/'mình' theo DEC-P01-001 và quyết tâm khích
    lệ tinh thần binh sĩ trước nhiệm vụ khó khăn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000418
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ ngắn mở đầu nhịp diễn văn ('Vì sao ư?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000419
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 và hành động nhìn khắp
    gương mặt các cấp dưới khi tiếp tục bài diễn văn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000420
  kind: terminology_and_voice
  value: locks=["Khóa cặp câu hỏi tu từ nối tiếp trong thoại ('Vì sao? Vì sao chúng
    ta lại có mặt ở đây?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000421
  kind: terminology_and_voice
  value: locks=["Khóa tên tổ chức 'Văn phòng Bộ Tổng tham mưu', 'Tiểu đoàn Pháp sư
    Trên không số 203', ẩn dụ 'con át chủ bài' và phép đối chiếu giữa nói quá ('một
    địch một ngàn') với năng lực thực tế ('xóa sổ cả một đại đội toàn bọn vô danh
    tiểu tốt')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000422
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ' và ba danh từ 'nhiệm vụ, vai trò và mục tiêu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000423
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Chúng ta' và điệp cấu trúc khẳng định mục tiêu
    chiến thắng, thống trị bầu trời bằng chính sức mạnh của đơn vị."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000424
  kind: terminology_and_voice
  value: locks=['Khóa phép tương phản giữa vị đắng của thất bại và sự ngọt ngào của
    chiến thắng.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000425
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Đế quốc', đại từ 'họ' chỉ binh sĩ, đại từ nội tâm 'mình'
    theo DEC-P01-001, nhấn mạnh Markdown '*thiếu hụt kinh phí*' theo DEC-P01-002 và
    phủ định việc Đế quốc không có đủ tiền đầu tư cho chiến thắng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000426
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và yêu cầu giữ cho binh
    lính dưới quyền bình tĩnh."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000427
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Các chiến hữu', đại từ 'chúng ta' - 'chúng', nhấn
    mạnh Markdown '*Nhìn xem quân số của bọn chúng ít ỏi đến mức nào kìa*' theo DEC-P01-002,
    thuật ngữ 'tiểu đoàn pháp sư', 'lực lượng tăng viện' và giọng điệu mỉa mai về
    khả năng làm toán cơ bản của địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000428
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, đại từ 'chúng ta' và
    mục đích trình bày khách quan hoàn cảnh để cấp dưới hiểu rõ tình hình."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000429
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, đại từ 'họ', phủ định
    'không giải quyết được cốt lõi của vấn đề' và lý do cần duy trì sĩ khí ở mức cao."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000430
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh so sánh sự cấp thiết với 'một nắm đấm sắt' định đoạt
    tất cả."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000431
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô trang trọng trong diễn văn ('Các vị' - 'tôi'/'Chúng
    ta'), hình ảnh ẩn dụ 'tôi luyện bằng máu và sắt', 'đám pháp sư còn đang đóng bỉm'
    và lý do đơn vị được triệu tập ra chiến trường."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000432
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, đại từ 'họ' và ý truyền
    ý thức mạnh mẽ về mục tiêu chiến đấu."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000433
  kind: terminology_and_voice
  value: locks=["Khóa các phủ định và lập luận nội tâm cuối đoạn về 'Ý chí', 'cảm
    giác tự chán ghét chính mình' và cảnh báo việc mất khả năng nhận biết điều sai
    trái sẽ dẫn tới sự bất tài thực sự."]
