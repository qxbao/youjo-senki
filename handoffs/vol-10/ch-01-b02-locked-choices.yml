- segment_id: YS-LN10/Text/chapter004.xhtml/p000031
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', danh xưng 'vị tham tán', đại từ 'anh ta' (chỉ Conrad
    dưới góc nhìn của Lergen), 'họ' và phủ định 'không nhai đi nhai lại những lời
    lẽ sáo rỗng cũ rích như một cái máy hát hỏng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000032
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô xã giao 'tôi' – 'ông' trong lời thoại của Lergen
    với Conrad và sắc thái giả định nghi vấn 'phải chăng đó chính là lý do hôm nay
    tôi có vinh dự được đón tiếp ông tại đây?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000033
  kind: terminology_and_voice
  value: locked=Giữ câu hỏi ngắn 'Thay đổi ư?' của Conrad.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000034
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'tôi', cụm 'người đại diện cho phía quân đội', tên cơ
    quan 'Bộ Ngoại giao' và cấu trúc so sánh tuyệt đối 'chẳng mong gì hơn là được
    kề vai sát cánh làm việc cùng Bộ Ngoại giao'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000035
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'vị đại tá', đại từ trần thuật 'anh' (chỉ Lergen) và
    quan hệ nhượng bộ 'Dù thực lòng vị đại tá chẳng mấy kỳ vọng sẽ sớm có nhiều chuyển
    biến, nhưng điều đón nhận anh lại là một sự bất ngờ'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000036
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'Vị tham tán' và chi tiết biểu cảm 'với vẻ mặt dửng
    dưng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000037
  kind: terminology_and_voice
  value: locked=Giữ lời đáp ngắn gọn 'Chuẩn xác.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000038
  kind: terminology_and_voice
  value: locked=Giữ câu hỏi ngắn 'Sao cơ?' của Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000039
  kind: terminology_and_voice
  value: 'locked=Khóa ''Đại tá Lergen'', cặp xưng hô ''tôi'' – ''ông'', đại từ ''chúng
    ta'', đại từ trần thuật ''anh ta'' (Conrad), thuật ngữ ''Đế quốc'', ''bộ ba thép:
    chính phủ, bộ máy quan chức hành chính và quân đội'' cùng câu hỏi cuối đoạn ''Tôi
    nói có sai không?''.'
- segment_id: YS-LN10/Text/chapter004.xhtml/p000040
  kind: terminology_and_voice
  value: locked=Giữ câu trả lời xác nhận câu hỏi phủ định 'Không, tôi đồng ý.' của
    Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000041
  kind: terminology_and_voice
  value: locked=Khóa 'Vị tham tán', đại từ 'anh' (Lergen) và chi tiết 'bắt đầu bộc
    lộ sự ác cảm của mình qua một nụ cười'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000042
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng ta', 'tôi', đại từ trần thuật 'Anh ta' / 'Người
    đàn ông ấy' (Conrad), 'Đế quốc', cụm ẩn dụ 'một bản song tấu của sự mù mờ và dốt
    nát', thuật ngữ 'thể chế tam trụ anh minh' và câu hỏi 'Tôi nói có sai không?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000043
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc' và nhận định 'Đây chính xác là căn bệnh đang giày vò
    Đế quốc lúc này.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000044
  kind: terminology_and_voice
  value: locked=Khóa 'Lergen' và cấu trúc phủ định kép 'không thể không tán thành
    với người đàn ông này'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000045
  kind: terminology_and_voice
  value: locked=Khóa 'Lục quân Đế quốc', cụm '“tư duy quân sự”', 'Hội đồng Đế quốc,
    hoàng gia và chính phủ', 'bộ máy quan chức hành chính', 'Đế quốc' và cụm 'bảo
    toàn nguyên trạng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000046
  kind: terminology_and_voice
  value: locked=Giữ hình ảnh ẩn dụ và phủ định 'Ba bánh răng không còn ăn khớp với
    nhau nữa.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000047
  kind: terminology_and_voice
  value: locked=Giữ ẩn dụ tiếp nối 'mỗi bánh răng lại tự cho rằng mình đang gánh vác
    sứ mệnh có mức ưu tiên cao nhất'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000048
  kind: terminology_and_voice
  value: locked=Khóa 'Bộ Tư lệnh Tối cao', 'Văn phòng Bộ Tổng tham mưu', đại từ 'tôi',
    'chúng ta' và phủ định 'chẳng một ai vô can trước cảnh ngộ hiện tại của chúng
    ta cả'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000049
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', đại từ 'anh', 'vị tham tán' và sự chuyển ý 'Thế
    nhưng, điều tiếp theo mà vị tham tán nêu ra lại khiến anh phải bàng hoàng.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000050
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Zettour' và cụm 'lối hành xử tự tung tự tác tràn
    lan của mình'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000051
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng', chức danh 'Ngài Cục phó' (chỉ Zettour), cặp xưng
    hô 'tôi' – 'Ông', phủ định 'không thể đồng tình với nhận định đó' và thành ngữ
    'làm mọi việc theo đúng nguyên tắc'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000052
  kind: terminology_and_voice
  value: locked=Khóa 'Cộng hòa François', danh xưng 'thưa Đại tá', cặp xưng hô 'tôi'
    / 'chúng tôi' – 'ông' và đại từ gộp 'chúng ta' trong lời đề nghị cuối đoạn.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000053
  kind: terminology_and_voice
  value: 'locked=Khóa câu trả lời phủ định dứt khoát của Lergen: ''Đó không phải là
    phần việc của chúng tôi.''.'
- segment_id: YS-LN10/Text/chapter004.xhtml/p000054
  kind: terminology_and_voice
  value: locked=Khóa 'vị sĩ quan Bộ Tổng tham mưu', 'Vị tham tán', 'Văn phòng Bộ Tổng
    tham mưu' và phủ định 'quân đội hoàn toàn chẳng hề keo kiệt thông tin chút nào'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000055
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng tôi', 'mình' và lập luận 'chúng tôi tin rằng mình
    đã và đang chia sẻ mọi thông tin cần được chia sẻ rồi'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000056
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'thưa Đại tá', 'Trung tướng Zettour', đại từ 'các ông',
    'ông' và cụm 'những sự thu xếp ở hậu phương'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000057
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ngài ấy' (chỉ Trung tướng Zettour), 'ông', 'chúng ta',
    danh hiệu 'Hoàng đế' và câu phủ định so sánh 'Đâu phải chúng ta đang tâu trình
    trước mặt Hoàng đế.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000058
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'Thưa Đại tá', đại từ 'tôi' và tên cơ quan 'Văn phòng
    Bộ Tổng tham mưu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000059
  kind: terminology_and_voice
  value: locked=Khóa câu hỏi ngắn 'Ông nói sao cơ?' của Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000060
  kind: terminology_and_voice
  value: locked=Khóa 'Tham tán Conrad', 'Lergen' và trạng thái 'người đang sững sờ
    vì lời nhận xét đó'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000061
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi', 'bên ông', tên cơ quan 'Văn phòng Bộ Tổng tham
    mưu', 'Đế quốc' và sắc thái mỉa mai khen ngợi môi trường làm việc trí tuệ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000062
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'tôi', cụm 'Một sĩ quan tham mưu cần phải—' với dấu gạch
    ngang bị cắt lời.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000063
  kind: terminology_and_voice
  value: locked=Khóa 'Tham tán Conrad', 'Lergen' và chi tiết 'cắt ngang lời Lergen
    ngay giữa chừng bằng những lời lẽ gièm pha hơn nữa'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000064
  kind: terminology_and_voice
  value: locked=Khóa cặp đối lập 'các ông' – 'cánh dân sự chúng tôi' và sắc thái mỉa
    mai 'Nhờ phúc của các ông'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000065
  kind: terminology_and_voice
  value: locked=Khóa 'Lergen', đại từ 'anh' (Lergen) và 'anh ta' (Conrad).
- segment_id: YS-LN10/Text/chapter004.xhtml/p000066
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'các ông' và sắc thái châm biếm gay gắt của Conrad về
    việc giải thích phải được mổ xẻ cặn kẽ để ngay cả một kẻ ngốc cũng hiểu được.
