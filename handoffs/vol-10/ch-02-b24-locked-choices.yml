choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000471
  kind: terminology_and_voice
  value: locked=Khóa đại từ nội tâm ngôi thứ nhất số nhiều 'chúng mình' (chỉ Tanya
    và Visha), cụm 'tên pháp sư này' và nhận định 'mọi suy luận logic đều đã bay biến
    khỏi đầu kẻ đang tấn công chúng mình rồi…'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000472
  kind: terminology_and_voice
  value: locked=Khóa đại từ trong thoại 'chúng ta', 'bọn chúng'/'chúng', thuật ngữ
    'Quân đội Liên bang' và phỏng đoán tình thái 'Chắc hẳn chúng đang cuống cuồng
    lắm rồi'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000473
  kind: terminology_and_voice
  value: locked=Khóa câu trần thuật ngôi thứ ba với tên riêng 'Tanya', thuật ngữ 'sĩ
    quan phụ tá của mình' và chi tiết 'nở một nụ cười tà ác'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000474
  kind: terminology_and_voice
  value: locked=Khóa định danh quân hàm 'Trung úy Serebryakov', xưng hô 'Cô' – 'chúng
    ta' và câu hỏi gợi ý mỉa mai 'chia sẻ màn pháo hoa này với những người bạn của
    chúng ta ở dưới mặt đất?'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000475
  kind: terminology_and_voice
  value: locked=Khóa xưng hô kính trọng 'Ngài... ạ' của Visha với Tanya, cụm 'dụ quân
    địch bắn nhầm vào quân mình' và câu cảm thán 'Lại thêm một ý tưởng rùng rợn nữa
    mà ngài nghĩ ra'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000476
  kind: terminology_and_voice
  value: locked=Khóa đúng phạm vi nhấn mạnh Markdown '*thân thiện với eco*' theo DEC-P01-002
    và câu khẳng định 'Ma pháp cần phải được sử dụng một cách khôn ngoan'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000477
  kind: terminology_and_voice
  value: 'locked=Khóa câu hỏi nối mạch chơi chữ của Visha: ''“Ý ngài là tốt cho kinh
    tế đó ạ?”''.'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000478
  kind: terminology_and_voice
  value: locked=Khóa đại từ nội tâm 'Mình'/'mình' theo DEC-P01-001, mạch giải thích
    chơi chữ 'vừa thuộc về sinh thái lại vừa có tính kinh tế. Thế nên nó thân thiện
    với eco gấp đôi', thuật ngữ 'lũ Cộng sản' và thái độ chấp nhận 'coi đó là một
    phần của công việc vậy. Dù sao đây cũng là chiến tranh mà'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000479
  kind: terminology_and_voice
  value: locked=Khóa tiêu đề chuyển cảnh 'CÙNG NGÀY HÔM ĐÓ, DOANH TRẠI QUÂN ĐỘI LIÊN
    BANG TRÊN MẶT TRẬN PHÍA ĐÔNG'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000480
  kind: terminology_and_voice
  value: locked=Khóa chủ thể 'Các tướng lĩnh Liên bang' và nhận định 'là những người
    theo chủ nghĩa thực dụng và đặt thực tế lên trên chính trị'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000481
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Họ', quan hệ đối lập 'thực tế có thể khắc nghiệt, nhưng
    chính trị mới là thứ hủy hoại con người', cấu trúc tương quan 'Càng bị thao túng
    nhiều... các sĩ quan chỉ huy cấp cao lại càng dễ hình thành một cái nhìn thực
    tế về thế giới' và hình ảnh 'lội qua một thế giới đẫm máu và bị nguyền rủa trên
    đôi ủng quân nhu của mình'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000482
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Họ' và mạch nhân quả 'Những hy sinh mà họ phải gánh chịu
    vào thời điểm đầu cuộc chiến đã trui rèn họ thành những người sĩ quan như ngày
    hôm nay'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000483
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'Quân đội Liên bang' và nhận định 'đã tiến hóa thành
    một trong những tổ chức thực dụng nhất thế giới'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000484
  kind: terminology_and_voice
  value: locked=Khóa cụm 'các tướng lĩnh Liên bang' và song hành thái độ 'vừa e sợ
    vừa tôn trọng kẻ địch của mình'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000485
  kind: terminology_and_voice
  value: locked=Khóa các thuật ngữ 'Lục quân Đế quốc', 'Đế quốc' và nội dung tình
    báo 'nghiên cứu ở cấp độ cá nhân về xuất thân và khuynh hướng của các quan chức
    quân sự cấp cao thuộc Lục quân Đế quốc'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000486
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'Bộ Dân ủy Nội vụ', ẩn dụ 'bắt tay với ác quỷ', cụm
    'giới thân tín cốt cán của quân đội' và kết cục 'buộc phải tuân phục nhân danh
    sự tất yếu đầy quyền năng'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000487
  kind: terminology_and_voice
  value: locked=Khóa cụm 'thỏa thuận với ác quỷ này' và hình ảnh 'Những tập hồ sơ
    của họ về các chỉ huy địch cứ thế dày thêm từng ngày'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000488
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Trung tướng Zettour' và nhận định 'là một ví dụ điển
    hình'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000489
  kind: terminology_and_voice
  value: locked=Khóa đại từ trần thuật 'ông' chỉ Zettour, cụm 'xuất thân và hồ sơ
    quân ngũ của ông' và cấu trúc tương quan 'Mục tiêu càng nguy hiểm, các chuyên
    viên phân tích lại càng nghiền ngẫm hồ sơ của người đó kỹ càng hơn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000490
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Tướng Zettour', 'Trung tướng Zettour', 'các chuyên
    viên phân tích của Quân đội Liên bang', đại từ 'ông' và hình ảnh 'một kẻ lừa đảo
    bậc thầy trên chiến trường'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000491
  kind: terminology_and_voice
  value: locked=Khóa các thuật ngữ 'tác chiến cơ động', 'sức cơ động chiến lược vượt
    trội', đại từ 'ông' và mệnh đề nhượng bộ 'ngay cả khi ai cũng thấy rõ đó là phương
    án hành động tốt nhất'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000492
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ông', các thuật ngữ 'tái tổ chức binh lực', 'tiêu diệt
    hoàn toàn đạo quân dã chiến của đối phương hơn là chiếm giữ lãnh thổ', phủ định
    'không hề vượt quá giới hạn lý thuyết của hậu cần' và hình ảnh 'trò ảo thuật đánh
    tráo'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000493
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'cảnh sát mật của Đảng Cộng sản' và cấu trúc tăng tiến
    'không chỉ trong mắt những người nghiên cứu kỹ lưỡng về ông mà cả trong mắt những
    người thân cận với ông nữa'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000494
  kind: terminology_and_voice
  value: locked=Khóa phủ định 'không có nhiều chuyên viên phân tích cho rằng có thể
    đánh bại ông theo bất kỳ cách thức trực diện nào', đại từ 'Ông' và các thuật ngữ
    'các đòn tấn công tạt sườn', 'tuyến tiếp vận'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000495
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'học viện quân sự' và mệnh đề điều kiện 'Nếu kẻ địch
    giăng bẫy, thì cứ việc nghiền nát chúng cùng với cái bẫy của chúng luôn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000496
  kind: terminology_and_voice
  value: locked=Khóa chủ thể 'Quân đội Liên bang' và nhận định 'đã bị mắc lừa quá
    nhiều lần rồi—cơ hội báo thù của họ đang đến gần'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000497
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Trung tướng Zettour', 'Quân đội Liên bang', đại từ
    'ông' và thuật ngữ 'lực lượng dự bị'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000498
  kind: terminology_and_voice
  value: locked=Khóa cụm 'những tân binh mới nhất', 'trận phục kích quy mô lớn', danh
    xưng 'bậc thầy mánh khóe' và mục tiêu 'hủy diệt phần cốt lõi trong sức mạnh quân
    sự của Đế quốc'.
