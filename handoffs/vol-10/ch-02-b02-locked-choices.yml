segment_id_end: YS-LN10/Text/chapter008.xhtml/p000067
choices:
- segment_id: YS-LN10/Text/chapter008.xhtml/p000030
  kind: terminology_and_voice
  value: 'locks=["Khóa cấu trúc giả định và chuỗi 3 bước chiến lược: ''rút lui, tập
    hợp lại đội ngũ, rồi chuẩn bị cho một đòn phản công về sau''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000031
  kind: terminology_and_voice
  value: 'locks=["Khóa giả định trái thực tế (''Giá như... sẽ chẳng có lấy một người
    lính nào...'') và phủ định trọng tâm: ''họ hoàn toàn không hề tập hợp lại đội
    ngũ''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn nhận thức của binh lính/sĩ quan tiền tuyến và hành
    động 'đều đặn nhường đất' trên toàn mặt trận."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'không sao rũ bỏ nổi cảm giác' và nhận định tình thái
    'Khả năng ấy có vẻ quá đỗi chân thực'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc điều kiện ('Nếu biết mục tiêu cuối cùng... họ sẵn sàng
    lặng lẽ nghe theo') và sự tương phản với việc lùi bước vượt quá sức hiểu biết."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa tên tổ chức 'Lục quân Đế quốc', phủ định 'không chấp nhận sự
    im lặng', và mệnh đề 'Mọi thứ đều bắt đầu từ sự phục tùng'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000036
  kind: terminology_and_voice
  value: 'locks=["Khóa cặp khái niệm pháp lý/tổ chức: ''đưa ra ý kiến bất đồng vừa
    là quyền lợi vừa là nghĩa vụ''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'các sĩ quan chỉ huy' và cơ quan tiếp nhận 'Văn phòng
    Bộ Tổng tham mưu'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000038
  kind: terminology_and_voice
  value: 'locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho câu trả lời: ''*Tất
    cả đều nằm trong kế hoạch*''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000039
  kind: terminology_and_voice
  value: 'locks=["Khóa nhịp tịnh tiến lần thứ nhất: ''chấp nhận lời giải thích ấy
    một lần''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000040
  kind: terminology_and_voice
  value: 'locks=["Khóa nhịp tịnh tiến lần thứ hai với sắc thái miễn cưỡng: ''miễn
    cưỡng xuôi theo vào lần thứ hai''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000041
  kind: terminology_and_voice
  value: locks=['Khóa nhịp tịnh tiến lần thứ ba chạm giới hạn chịu đựng của họ.']
- segment_id: YS-LN10/Text/chapter008.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa hai nhóm chủ thể 'các sĩ quan cấp tá' và 'đám binh lính thuộc
    quyền' cùng công khai hoài nghi chiến lược hiện tại."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Chẳng một ai biết', danh xưng 'Trung tướng Zettour',
    địa danh 'mặt trận phía đông', và chi tiết câu hỏi trở thành kiểu chào hỏi giữa
    những người lính."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại ngang hàng giữa binh lính ('Anh') và danh xưng
    'vị tướng ấy'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại tập thể ('chúng ta', 'mình'), giả định phỏng đoán
    ('Chắc...'), và chủ thể 'Nhóm những người lạc quan một cách dè dặt'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa cặp chủ thể đối lập 'cả những kẻ hoài nghi lẫn những người còn
    tin tưởng' đều giữ im lặng và chấp hành mệnh lệnh."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000047
  kind: terminology_and_voice
  value: 'locks=["Khóa dòng tiêu đề chuyển cảnh: ''CÙNG NGÀY HÔM ĐÓ, VĂN PHÒNG THANH
    TRA TẠI MẶT TRẬN PHÍA ĐÔNG''; không dùng nhấn mạnh Markdown."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa phép ẩn dụ 'đứng giữa tâm điểm của vũng lầy' và điểm nhìn tự
    nhận thức của 'Trung tướng Zettour'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa cặp đối lập 'Cả bạn lẫn thù', đại từ trần thuật 'ông' cho Zettour,
    và sắc thái cười chua chát."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại tự quy chiếu 'mình' của Zettour và câu hỏi
    tự vấn mang tính tự trào."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'không ngại thừa nhận' và tư cách tự nhìn nhận 'với
    tư cách một quân nhân'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa mức độ tình thái 'gần như có thể mô tả là đầy khoái cảm'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại 'Mình' của Zettour và lời cảm thán về việc
    ở ngoài chiến trường quá lâu."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tướng Zettour', địa điểm 'phòng chỉ huy' /
    'Trung tâm chỉ huy', và thuật ngữ 'các hoạt động tác chiến rút lui'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tướng', đại từ 'Ông', và hình ảnh hút xì gà đi
    lại quanh phòng nhìn tấm bản đồ lớn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000056
  kind: terminology_and_voice
  value: 'locks=["Khóa nhận định ngắn gọn: ''Đó là môi trường hoàn hảo để suy ngẫm''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa dấu chấm lửng mở đầu '…Ông', chi tiết 'văn phòng cục phó', và
    hành động phân tích các kịch bản chiến tranh."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa phủ định kép nhấn mạnh ('chưa bao giờ quên... —dù chỉ một lần'),
    nhấn mạnh Markdown theo DEC-P01-002 cho suy nghĩ '*Dẫu nói là vậy…*', và nhận
    định về bản chất con người của Trung tướng Zettour."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa dấu chấm lửng trong câu độc thoại, đại từ 'Mình', và phủ định
    'không thể cưỡng lại bản năng của một nhà chiến lược trong lòng'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa sự đối lập giữa vai trò làm tác chiến với trách nhiệm bao quát
    hầu như mọi khía cạnh của cuộc chiến, và kết câu tự phản tỉnh '… hay ít nhất ông
    từng nghĩ vậy'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000061
  kind: terminology_and_voice
  value: 'locks=["Khóa câu độc thoại ngắn của Zettour: ''“Nhìn mình bây giờ xem.”''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000062
  kind: terminology_and_voice
  value: 'locks=["Khóa tổ hợp ba sắc thái cảm xúc: ''tự giễu, kinh ngạc và hoài niệm''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại 'mình' và nhận định 'coi tác chiến là nhân
    tố quyết định của chiến tranh'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000064
  kind: terminology_and_voice
  value: 'locks=["Khóa toàn bộ câu hỏi nội tâm có nhấn mạnh Markdown theo DEC-P01-002:
    ''*Có lẽ chúng ta nên dồn toàn lực và đảm bảo giành thắng lợi ở miền đông chăng?*''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000065
  kind: terminology_and_voice
  value: 'locks=["Khóa sự chuyển biến cảm xúc sang ''bực dọc'' trước ba gánh nặng:
    ''chuyện chính trị, việc cố vấn và bài toán xoay xở hậu cần''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000066
  kind: terminology_and_voice
  value: 'locks=["Khóa nhận định tự phê phán khách quan: ''Lẽ dĩ nhiên, những cảm
    xúc ấy là hoàn toàn vô lý''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại 'mình', ẩn dụ 'giáo hội của sự tất yếu' cùng
    'những giáo điều của nó', và chi tiết khó quên đi nơi mình xuất thân."]
