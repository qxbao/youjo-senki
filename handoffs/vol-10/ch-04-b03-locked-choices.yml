choices:
- segment_id: YS-LN10/Text/chapter020.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Đế quốc', hình ảnh ẩn dụ 'Chiến thắng tựa như một
    ảo ảnh' và tình thái bắt buộc 'phải được giữ vững bằng mọi giá'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc so sánh phủ định tuyệt đối 'Chẳng có gì tàn nhẫn hơn
    một giấc mộng sẽ không bao giờ thành hiện thực'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Đế quốc', cụm 'tình hình chiến tuyến của Đế quốc'
    và phủ định mức độ 'ngay cả việc mảy may nghĩ tới khả năng thất bại thôi cũng
    đã là điều không thể tưởng tượng nổi'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Lục quân Đế quốc', 'quốc gia dân tộc', tên riêng
    'Đế quốc' và cụm 'Ký ức tập thể và văn hóa'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*chiến thắng vào phút
    cuối*', thuật ngữ 'Lục quân Đế quốc', tên riêng 'Đế quốc', tình thái nhượng bộ
    'đôi khi có thể hứng chịu vài trận thua lẻ tẻ' và cặp đối lập 'vừa là một phước
    lành, lại vừa là một lời nguyền'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa hai cụm nhấn mạnh Markdown theo DEC-P01-002 tại '*kết quả*'
    và '*luôn luôn*', cùng tên riêng 'Đế quốc'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ kèm điều kiện phủ định ('nếu họ không tin rằng
    mình sẽ chiến thắng?') và mệnh đề phủ định tuyệt đối ở câu cảm thán ('một đội
    quân chưa từng thua bất kỳ cuộc chiến nào!')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'thắng lợi chung cuộc' và quan hệ nhân quả ('vì điều đó
    biện minh cho tất cả những tổn thất mà họ đã phải gánh chịu cho đến nay')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tham tán Conrad', 'Đại tá Lergen' và cấu trúc nhấn
    mạnh 'Chính sự đơn giản... lại là điều khiến...'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*hoàn toàn công cốc*',
    đại từ 'ông ấy' chỉ Lergen, đại từ 'chúng ta' và phủ định tuyệt đối 'không đời
    nào có thể thừa nhận'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ y học ('chưa từng được tiêm chủng để miễn nhiễm trước
    thất bại'), tên riêng 'Đế quốc', phủ định ('không thể nào sụp đổ chỉ sau một đêm')
    và hai câu hỏi tu từ."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Có, chúng ta có thể*',
    danh xưng 'Đại tá Lergen', tên riêng 'Đế quốc', cụm 'lời nói dối vô hại' và tình
    thái suy đoán 'Hoặc có lẽ'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000063
  kind: terminology_and_voice
  value: 'locks=["Khóa cách xưng hô lịch sự của Conrad với Lergen: ''thưa Đại tá'',
    ''Tôi'' - ''ngài''."]'
- segment_id: YS-LN10/Text/chapter020.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tham tán', 'Lergen', 'vị đại tá' và điểm nhìn
    trần thuật ngôi thứ ba."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Thất bại*', đại từ
    'ông ấy' chỉ Lergen và chuỗi phủ định ('không giống với phong cách thường ngày',
    'không tài nào ghép nổi một câu trả lời mạch lạc', 'không phải là điều ông ấy
    có thể dễ dàng thốt ra')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000066
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba gọi 'Tanya' - 'cô', đại từ
    'Ông ấy' chỉ Lergen, các phủ định ('không sao nói ra được—thậm chí còn chẳng thể
    mở miệng', 'hoàn toàn không hề hay biết gì') và tình thái 'Có lẽ'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'cô' chỉ Tanya, phủ định giảm nhẹ 'Chẳng suy
    nghĩ gì quá nhiều' và cụm 'thiện chí'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa lời gọi 'Thưa Tham tán Conrad', đại từ 'ngài' và câu hỏi xác
    nhận nhu cầu biết sự thật."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa lời gọi cấp bậc '“Trung tá Degurechaff?”'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tham tán', tên riêng 'Tanya', đại từ 'cô' và nguyên
    tắc xác nhận khách hàng thực sự muốn nghe sự thật về mức độ bi đát của tình hình."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'tôi' / 'chúng tôi' - 'ngài' trong lời đề nghị hỏi
    lại của Tanya."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lặp lại nguyên văn từ b02 ('Chúng ta có thể thắng cuộc
    chiến này không?'), xưng hô của Conrad ('tôi' - 'hai vị'), thuật ngữ 'Văn phòng
    Bộ Tổng tham mưu' và cụm giới từ kép 'làm việc trực tiếp với và ngay bên trong'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tham tán Conrad', tên riêng 'Tanya' và cấu trúc phủ
    định nhấn mạnh 'không thể nào rõ ràng hơn được nữa'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cô', cấu trúc điều kiện phủ định ('sẽ không trả lời...
    cho đến khi...') và cụm 'những lời lẽ không thể chối cãi'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', chi tiết biểu cảm 'Nở một nụ cười méo mó'
    và cụm 'lời phân tích thẳng thừng không chút nể nang'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000076
  kind: terminology_and_voice
  value: 'locks=["Khóa câu khẳng định phủ định khả năng chiến thắng của Tanya: ''“Điều
    đó là bất khả thi. Tôi có thể khẳng định không chút nghi ngờ rằng chúng ta sẽ
    không thắng nổi đâu.”''"]'
- segment_id: YS-LN10/Text/chapter020.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lắp bắp bỏ lửng '“C-cô đang nói cái gì…?”'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô 'Tôi' - 'ngài', đại từ 'chúng ta', thành ngữ được dịch
    thoát ý tự nhiên ('Ngài tìm nhầm chỗ rồi nếu đang trông đợi một chiến thắng từ
    phía quân đội') và nhận định 'Cuộc chiến này đã vượt khỏi tầm kiểm soát của chúng
    ta rồi'."]
