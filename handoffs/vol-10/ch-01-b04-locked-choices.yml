- segment_id: YS-LN10/Text/chapter004.xhtml/p000117
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen' và nhịp ngừng suy nghĩ một lát trước khi cất lời.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000118
  kind: terminology_and_voice
  value: locked=Khóa tên 'Conrad', 'Lergen', đại từ 'Anh' (Lergen), 'họ' và cụm 'những
