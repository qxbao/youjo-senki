- segment_id: YS-LN10/Text/chapter004.xhtml/p000123
  kind: terminology_and_voice
  value: locked=Khóa 'Tham tán Conrad', cặp xưng hô 'Tôi' – 'ông', đại từ 'chúng tôi'
