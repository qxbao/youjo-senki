- segment_id: YS-LN10/Text/chapter004.xhtml/p000120
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Ông' và lời tán đồng '…Ông nói rất có lý.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000121
  kind: terminology_and_voice
  value: locked=Khóa câu đáp ngắn 'Tuyệt vời.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000122
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ông', danh xưng 'thưa Tham tán' và câu hỏi làm rõ lý
