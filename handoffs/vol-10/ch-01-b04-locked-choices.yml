- segment_id: YS-LN10/Text/chapter004.xhtml/p000124
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'ông' và cụm 'với tư cách một quan chức của
    Bộ Ngoại giao'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000125
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'tôi', 'mình', 'chúng ta' và đề xuất hợp tác chia sẻ thông
    tin giữa hai cơ quan.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000126
  kind: terminology_and_voice
  value: locked=Khóa toàn bộ câu độc thoại nội tâm của Lergen trong nhấn mạnh Markdown
    '*...*' và đại từ 'anh ta' (chỉ Conrad).
- segment_id: YS-LN10/Text/chapter004.xhtml/p000127
  kind: terminology_and_voice
  value: locked=Khóa 'Conrad', 'Lergen', đại từ 'Anh' (Lergen) và từ nhấn mạnh Markdown
    '*ghen tị*'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000128
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh' và câu khẳng định 'Anh ghen tị với người đàn ông
    này.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000129
  kind: terminology_and_voice
  value: locked=Khóa 'Lục quân Đế quốc', đại từ 'họ' và câu hỏi tu từ giả định về
    khả năng đạt được đồng thuận để đưa ra lời đề nghị như vậy với một nhánh khác
    của chính phủ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000130
  kind: terminology_and_voice
  value: locked=Khóa nhấn mạnh Markdown '*Kế hoạch B*', tên 'Lergen', đại từ 'anh'
    và hành động gạt ngay ý nghĩ đầy điềm gở đó đi.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000131
  kind: terminology_and_voice
  value: locked=Khóa cấu trúc giả định 'Nếu mọi chuyện diễn ra suôn sẻ—nếu quân đội
    có thể cùng chung nhịp bước với Bộ Ngoại giao—thì Đế quốc sẽ thoát khỏi những
    rắc rối hiện tại.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000132
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', 'Tham tán Conrad' và hành động mỉm cười thật
    tươi, chìa tay ra bắt.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000133
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi' và cụm 'đoàn kết làm một dưới ngọn cờ của Đế quốc'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000134
  kind: terminology_and_voice
  value: locked=Khóa câu hỏi bỏ lửng 'Vậy ý ông là…?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000135
  kind: terminology_and_voice
  value: locked=Khóa 'Lergen gật đầu đáp lại.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000136
  kind: terminology_and_voice
  value: locked=Khóa 'Phía quân đội', đại từ 'chúng ta', 'họ' và điều kiện 'Nếu có
    cách để chúng ta cùng nhau chấm dứt cuộc chiến này, họ sẽ sẵn lòng đón nhận thôi.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000137
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'tôi' – 'ông' và danh xưng 'thưa Đại tá'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000138
  kind: terminology_and_voice
  value: locked=Khóa câu hỏi lịch sự 'Tôi có thể hỏi lý do vì sao không?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000139
  kind: terminology_and_voice
  value: locked=Khóa 'Tham tán Conrad', đại từ 'Tôi', cơ quan 'Văn phòng Bộ Tổng tham
    mưu' và nỗi lo không còn ai ở đó có thể nói chuyện được trong thời buổi rối ren
    này.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000140
  kind: terminology_and_voice
  value: locked=Khóa 'vị tham tán', 'Lergen' và chức danh 'sĩ quan tham mưu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000141
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi', thuật ngữ 'chiến tranh tổng lực' và nhận định 'Chiến
    tranh chẳng qua chỉ là bạo lực đã được hợp lý hóa mà thôi.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000142
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tá Degurechaff chính là một ví dụ hoàn hảo.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000143
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Cô' (chỉ Tanya dưới góc nhìn của Lergen) và phủ định
    'không sử dụng bạo lực một cách bừa bãi để làm phương tiện đạt tới mục đích'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000144
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Cô', tên 'Lergen', cụm 'chiến tranh toàn diện', cấu trúc
    phủ định kép 'không thể phủ nhận rằng cô là một người tôi tớ biết suy xét hợp
    lý của quốc gia' và vế đối lập 'nhưng ở cô vẫn có điều gì đó bất ổn'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000145
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'cô', hình ảnh so sánh phủ định 'không giống như một đoàn
    tàu chở hàng mất phanh' và nhận định 'Cô biết tự kiềm chế bản thân khi tình hình
    đòi hỏi.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000146
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Cô', cấu trúc phủ định kép 'Không thể nào không đánh
    giá cao cô được', cụm 'sĩ quan cấp tá', tên 'Lergen' và cụm 'cô gái trẻ ấy'.
