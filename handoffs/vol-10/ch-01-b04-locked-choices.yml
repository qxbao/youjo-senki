  kind: terminology_and_voice
  value: locked=Khóa 'Vị tham tán này' và đại từ 'hai người họ'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000115
  kind: terminology_and_voice
  value: locked=Khóa chi tiết 'điềm tĩnh nhìn xoáy vào mắt nhau trong chốc lát' trước
