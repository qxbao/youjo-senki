- segment_id: YS-LN10/Text/chapter004.xhtml/p000151
  kind: terminology_and_voice
  value: locked=Khóa dòng tiêu đề chuyển cảnh 'CÙNG NGÀY HÔM ĐÓ, TẠI CỤC TÁC CHIẾN
    THUỘC VĂN PHÒNG BỘ TỔNG THAM MƯU—VĂN PHÒNG CỤC TRƯỞNG'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000152
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi', danh xưng 'Đại tá Lergen' và câu xin phép vào phòng.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000153
  kind: terminology_and_voice
  value: locked=Khóa cách gọi 'anh', 'Đại tá' (Rudersdorf gọi Lergen) và cụm 'Vị khách
    từ Bộ Ngoại giao'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000154
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'họ' (phía Bộ Ngoại giao), 'chúng ta', 'hai bên' và nhận
    định giả định về việc hợp tác để tìm lối thoát.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000155
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh' (Lergen), 'Trung tướng Rudersdorf' và chi tiết gương
    mặt trắng bệch như không còn chút máu.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000156
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng ta' và mệnh đề điều kiện 'cứ cho là chúng ta trụ
    được đến lúc đó'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000157
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Chúng ta' và câu hỏi lễ phép của cấp dưới 'Chúng ta bị
