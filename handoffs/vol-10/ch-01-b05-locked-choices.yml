  kind: terminology_and_voice
  value: locked=Khóa cụm 'sĩ quan cấp tá', tên 'Tham tán Conrad', 'Lergen', đại từ
    'ông ta' (chỉ Conrad) và cấu trúc giả định quá khứ về việc kỳ vọng một người cứng
    rắn hơn.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000148
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', 'Tham tán Conrad' và chi tiết đứng dậy với vẻ
    hài lòng sau một thoáng Lergen tự nhìn nhận lại bản thân.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000149
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'ông', danh xưng 'thưa Đại tá' và câu hỏi
    xin phép ngày mai lại ghé qua để xúc tiến công việc.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000150
  kind: terminology_and_voice
  value: locked=Khóa thành ngữ 'rèn sắt phải nhân lúc còn nóng' và lời hưởng ứng 'Chúng
