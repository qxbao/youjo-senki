- segment_id: YS-LN10/Text/chapter004.xhtml/p000158
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh', 'Họ', 'chúng ta', tên 'người Ildoa' và hình ảnh
    ẩn dụ chiếc đồng hồ cát vẫn còn sót lại chút cát.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000159
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', đại từ 'anh', 'Đế quốc' và cấu trúc phủ định 'Chẳng
    cần ai phải nói toẹt ra thì anh cũng hiểu Đế quốc đang lâm vào cảnh ngặt nghèo.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000160
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'ngài', danh xưng 'thưa Tướng quân' và phủ
    định 'Tôi không ngờ ngài cũng là người thích mỉa mai đấy'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000161
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'Đại tá', đại từ 'anh' và câu mắng thân mật 'anh đúng
    là một gã khờ vụng về'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000162
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', đại từ 'anh', 'Trung tướng Rudersdorf' và phỏng
    đoán ông chỉ đang cằn nhằn đôi câu để giải tỏa bớt căng thẳng.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000163
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen' và nhận định câu nói đó quả thực đã khiến anh bất
    ngờ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000164
  kind: terminology_and_voice
  value: locked=Khóa 'Vị tướng', đại từ 'ông' và cụm 'cơ chế tự vệ giúp ông tiếp tục
    gắng gượng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000165
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', đại từ 'ông' (Rudersdorf) và cấu trúc phủ định
    kép 'không thể không nhận ra sự thay đổi này'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000166
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Rudersdorf', giả định quá khứ 'của trước kia hẳn
    sẽ nói lớn hơn nhiều, với giọng điệu đanh thép hơn' và câu hỏi nội tâm nhấn mạnh
    Markdown '*Chẳng lẽ ông ấy đã kiệt sức đến mức sắp gục ngã rồi sao?*'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000167
  kind: terminology_and_voice
  value: locked=Khóa cụm 'thắng lợi toàn diện' và nhận định của Rudersdorf về sự hỗn
    loạn khắc nghiệt của chiến tranh.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000168
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Chúng ta', 'Tôi' và lập luận dùng con đường ngoại giao
    để tìm kiếm một thỏa hiệp chấp nhận được.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000169
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh' và câu hỏi 'Anh có coi đó là một chiến thắng không?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000170
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen' và hành động 'đáp lại câu hỏi bằng giọng kiên
    quyết'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000171
  kind: terminology_and_voice
  value: locked=Khóa câu khẳng định ngắn gọn 'Đó là một chiến thắng.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000172
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Rudersdorf', đại từ 'anh' và cụm nhấn mạnh Markdown
    '*Nói tiếp đi*'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000173
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi', 'chúng ta', 'mình' và câu hỏi tu từ 'Chẳng phải
    có thể xem đó là một phương tiện khác để hướng tới cùng một mục đích hay sao?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000174
  kind: terminology_and_voice
  value: locked=Khóa phủ định 'Đó không phải là một chiến thắng oanh liệt.' và cụm
    'hiệp định đình chiến'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000175
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', ẩn dụ 'thuốc tốt nhất lại là thứ thuốc đắng
    nhất' và chi tiết đề xuất 'được bọc đường bằng niềm hy vọng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000176
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'tôi', thuật ngữ 'quốc phòng' và nhận định 'đây sẽ là
    một chiến thắng rõ ràng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000177
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng ta', 'Anh', 'các anh' và phép ẩn dụ gieo hạt, đổ
    mồ hôi trên đồng ruộng trước khi nói về vụ thu hoạch.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000178
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Ngài', danh xưng 'thưa Tướng quân', đại từ 'chúng ta'
    và ẩn dụ 'cải tạo đất đai, dẫu việc đó có tiêu tốn của chúng ta thời gian quý
    báu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000179
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng von Rudersdorf', cách gọi 'Anh', 'Đại tá', đại từ
    'chúng ta' và phép ẩn dụ chuẩn bị đất từ mùa xuân, thu hoạch mùa màng theo tờ
    lịch.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000180
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Ông', 'ông' và chi tiết chỉ ra bây giờ đã là mùa hè nhưng
    trong lập luận lại có một kẽ hở.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000181
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng ta', 'ngài', tên 'Lergen', hình ảnh cây 'yến mạch'
    và ý nhấn mạnh 'mọi chuyện vẫn còn lâu mới là quá muộn'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000182
  kind: terminology_and_voice
  value: locked=Khóa câu hỏi ngắn 'Ý anh là gì?'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000183
  kind: terminology_and_voice
  value: locked=Khóa 'Lergen', 'Đại tá Lergen' và sự tương phản giữa ánh mắt vô cùng
    uy nghiêm của cấp trên với vẻ điềm tĩnh, giọng đáp lời thản nhiên của Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000184
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi', phủ định 'không muốn có bất kỳ sự xao nhãng nào'
    và cụm 'khi thời khắc gặt hái cho quê hương—Heimat—đến gần'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000185
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'anh', danh xưng 'Đại tá', đại từ 'chúng
    ta' và từ '‘thời gian’' trong dấu nháy đơn.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000186
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Ông' và từ nhấn mạnh Markdown '*thời gian*'.
