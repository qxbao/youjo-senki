choices:
- segment_id: YS-LN10/Text/chapter024.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá' của người lính thuộc cấp dành cho Drake
    và hai câu hỏi bông đùa về việc lây bệnh ngoài miền đông hay ngủ nhầm với cô ả
    nào."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp phủ định 'Không' của Drake, cặp xưng hô 'tôi' - 'anh',
    khẳng định thể trạng khỏe mạnh cùng đầu óc hoàn toàn tỉnh táo và mệnh đề nhượng
    bộ 'Dù tôi gần như ước gì anh nói đúng đấy'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000158
  kind: terminology_and_voice
  value: 'locks=["Khóa câu trần thuật ngắn khẳng định thực tại: ''Đây là chiến tranh.''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Họ' và tư cách chiến đấu 'trước nhất và trên
    hết với tư cách là những người lính hải quân đánh bộ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000160
  kind: terminology_and_voice
  value: locks=["Khóa lời hiệu triệu của Drake với cách gọi 'Thưa các quý ông', đại
    từ 'chúng ta' - 'các anh', mệnh lệnh 'Nếu cần thì hãy hóa thành quái vật ngoài
    kia đi', điều kiện sinh tồn 'Nếu không muốn chết, các anh phải nhắm bắn để giết'
    và tuyên bố tiễn kẻ địch xuống mồ dưới đáy 'eo biển'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000161
  kind: terminology_and_voice
  value: locks=["Khóa tên quốc gia 'Khối Thịnh vượng chung', đại từ 'Họ', các lợi
    thế về 'quân số', 'thông tin tình báo', 'lực lượng hải quân hùng hậu', nhận định
    'Cán cân sức mạnh hoàn toàn nghiêng về phía họ' và đánh giá hài hước về 'đám chính
    khách và giới chóp bu'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000162
  kind: terminology_and_voice
  value: locks=["Khóa lời hô xung trận của Drake với đại từ 'chúng ta' và quyết tâm
    giành chiến thắng."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000163
  kind: terminology_and_voice
  value: 'locks=["Khóa dòng tiêu đề thời gian - địa điểm viết hoa toàn bộ: ''NGÀY
    31 THÁNG 8 NĂM THỐNG NHẤT 1927, BẦU TRỜI PHÍA TRÊN EO BIỂN''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000164
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển đổi điểm nhìn sang độc thoại nội tâm của Tanya và
    tình thái trái kỳ vọng 'Đáng lẽ đây phải là một cuộc tập kích bất ngờ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000165
  kind: terminology_and_voice
  value: locks=['Khóa câu cảm thán bổ sung về nội dung ghi trong kế hoạch.']
- segment_id: YS-LN10/Text/chapter024.xhtml/p000166
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'Mình' theo DEC-P01-001 và chi tiết
    đã thực hiện mọi biện pháp có thể nghĩ ra để giữ bí mật."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000167
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*những thứ kia*', phủ
    định 'Không, mình thậm chí còn chẳng cần phải hỏi' và các thuật ngữ hải quân 'những
    thiết giáp hạm màu đen', 'hạm đội tàu chủ lực'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000168
  kind: terminology_and_voice
  value: locks=["Khóa cụm ẩn dụ 'Những kẻ thống trị vực thẳm, những vị vua của đại
    dương' và định danh 'Hạm đội Bản thổ của Khối Thịnh vượng chung'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000169
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*phần*', căn cứ nhận
    diện nhờ sự vắng mặt của 'những chiếc thiết giáp hạm dreadnought trứ danh' và
    cấu trúc hạm đội xoay quanh 'các mẫu thiết giáp hạm nhanh và tàu chiến-tuần dương
    đời cũ hơn'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000170
  kind: terminology_and_voice
  value: locks=["Khóa các định danh 'Hải quân Đế quốc', 'Biển Bắc', 'Hạm đội Biển
    khơi', đại từ 'chúng ta' và tình thái so sánh giới hạn 'may ra cũng chỉ ngang
    ngửa nhóm này về mặt số lượng là cùng'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000171
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh so sánh 'như một đàn kiến sắp bị voi giẫm bẹp' và sự
    tương phản giữa một trận giao chiến với 'một cuộc thảm sát đơn thuần'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000172
  kind: terminology_and_voice
  value: locks=['Khóa câu phủ định làm rõ nguyên nhân cốt lõi khiến quân Đế quốc cầm
    chắc thất bại.']
- segment_id: YS-LN10/Text/chapter024.xhtml/p000173
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' và mối lo ngại thực sự về cách thức hành động
    của kẻ địch."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000174
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ chỉ sự phi lý khi vừa chuẩn bị 'tập kích bất ngờ'
    lại tình cờ đụng độ 'một hạm đội lớn hơn đang trong tư thế sẵn sàng nghênh chiến'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000175
  kind: terminology_and_voice
  value: locks=['Khóa lời độc thoại phủ định tuyệt đối khả năng sự việc xảy ra do
    tình cờ.']
- segment_id: YS-LN10/Text/chapter024.xhtml/p000176
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình', cấu trúc so sánh cực đoan với 'Chủ nghĩa Cộng
    sản' hay 'Being X' và kết luận phủ định sự tồn tại của sự trùng hợp như vậy."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000177
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình', chi tiết 'kiến thức sẵn có từ thế giới cũ' và
    hình ảnh mỉa mai 'bữa tiệc chào mừng được lên kế hoạch từ trước' tràn ngập niềm
    vui cùng sự bất ngờ."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000178
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển biến mức độ nhận thức của Tanya từ 'mới chỉ hoài nghi'
    trước đây sang 'giờ thì mình đã dám chắc'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000179
  kind: terminology_and_voice
  value: 'locks=["Khóa câu nhận định ẩn dụ ngắn: ''Đó là một trò ảo thuật.''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000180
  kind: terminology_and_voice
  value: locks=["Khóa suy luận tất yếu 'Ắt hẳn họ đã giải mã hoàn toàn mật mã của
    Đế quốc', tên tổ chức 'Lục quân Đế quốc', phủ định 'không phải chuyện đơn giản
    như một vụ rò rỉ nhỏ lẻ' và hệ quả 'họ đang nghe lén toàn bộ những gì chúng ta
    nói'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000181
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', tên đơn vị 'Tiểu đoàn 203' và nỗi ngán ngẩm vì
    công sức che giấu hành tung đổ sông đổ biển."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000182
  kind: terminology_and_voice
  value: 'locks=["Khóa câu kết luận bi quan với đại từ ''chúng ta'': ''Chính vì thế
    này mà chúng ta không thể thắng nổi.''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000183
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', chi tiết 'khao khát chuyển việc trong lòng ngày
    một mãnh liệt hơn', cử chỉ 'nắm chặt tay và nghiến răng' và nhận thức 'đang chiến
    đấu cho phe thua cuộc'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000184
  kind: terminology_and_voice
  value: locks=["Khóa nhận định 'Thông tin là vấn đề sống còn' và tình thái đáng tiếc
    trong quá khứ 'đây vốn là chuyện hoàn toàn có thể tránh được'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000185
  kind: terminology_and_voice
  value: locks=["Khóa giả định trái thực tế trong quá khứ về việc kiêng dùng vô tuyến,
    các định danh 'Đế quốc', 'bộ chỉ huy Cụm tập đoàn quân phía Tây', 'bên hải quân'
    và sự phẫn nộ trước việc thiếu 'ý thức bảo mật tác chiến'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000186
  kind: terminology_and_voice
  value: locks=["Khóa câu lầm bầm tự nhủ của Tanya với đại từ 'mình', cấp bậc kèm
    tên riêng 'Tướng Romel' và ý định làm ầm chuyện này lên khi quay về."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000187
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nghịch đối 'Tuy nhiên', đại từ 'mình' và thế kẹt phủ
    định 'không thể chứng minh rằng mật mã của quân ta đã bị giải mã'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000188
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại thuật ngữ Latin '*probatio
    diabolica*', tình trạng thiếu bằng chứng, niềm tin mù quáng của 'Lục quân Đế quốc'
    và câu điều kiện giả định trái thực tế về việc các phòng ban phát sóng mọi mẩu
    thông tin chiến dịch."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000189
  kind: terminology_and_voice
  value: 'locks=["Khóa ba tính từ cảm thán đánh giá tình cảnh: ''Thật tàn nhẫn, liều
    lĩnh và phi lý biết bao.''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000190
  kind: terminology_and_voice
  value: locks=['Khóa câu hỏi cảm thán thành lời của Tanya về sự ngu xuẩn tột cùng
    đang diễn ra.']
- segment_id: YS-LN10/Text/chapter024.xhtml/p000191
  kind: terminology_and_voice
  value: 'locks=["Khóa câu hỏi ngắn gọn theo quân phong của Visha: ''“Thưa Trung tá?”''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000192
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình', chức danh 'sĩ quan phụ tá', trạng thái 'kích
    động dâng trào', danh xưng 'Trung úy Serebryakov', cụm 'bộ chỉ huy tối cao' và
    nhận định về kết cục bất định của cuộc chiến."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000193
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại tiếng hét giả định '*Lũ
    ngu xuẩn các người!*', câu điều kiện trái thực tế về việc bỏ việc ngay tại chỗ
    và ẩn dụ công sở 'khắc phục sai lầm của ban quản lý'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000194
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' và phép đối lập giữa 'yêu thích sự nỗ lực' với
    'căm ghét những nỗ lực vô nghĩa'."]
