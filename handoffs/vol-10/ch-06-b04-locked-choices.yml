choices:
- segment_id: YS-LN10/Text/chapter028.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf nối tiếp mạch p000098 với phủ định
    'không thể làm ngơ trước họ'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'người Ildoa', 'Đế quốc', nhận định người Ildoa trước
    hết và trên hết chỉ trung thành với chính mình và điều kiện họ chỉ duy trì lập
    trường trung lập chừng nào Đế quốc còn cơ hội chiến đấu."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000101
  kind: terminology_and_voice
  value: locks=['Khóa nhận định sự kiên định trong việc giữ vững lập trường trung
    lập của họ là vô song.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa thế đối lập giữa 'Đế quốc' (chỉ có thể hy vọng) và những kẻ
    thù của Đế quốc (hoàn toàn có khả năng lôi kéo 'người Ildoa' về phe mình), cùng
    giả định nhượng bộ rằng ngay cả khi giải quyết được vấn đề tranh chấp lãnh thổ
    dai dẳng của 'Ildoa' thì kết quả cuối cùng nhiều khả năng vẫn không đổi."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Ildoa', 'Đế quốc', 'người Ildoa', nhấn mạnh Markdown
    theo DEC-P01-002 tại '*hình ảnh bất khả chiến bại*' và quan hệ nhân quả buộc Đế
    quốc phải duy trì hình ảnh đó, củng cố biên giới và khiến người Ildoa tin rằng
    gây chiến với Đế quốc là quá mạo hiểm."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000104
  kind: terminology_and_voice
  value: locks=['Khóa câu độc thoại bi quan của Rudersdorf khẳng định chuyện đó là
    bất khả thi và mọi thứ rồi sẽ sụp đổ.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc' và nhận định vẫn còn trụ lại được trong
    cuộc chiến thêm vài tháng nữa."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000106
  kind: terminology_and_voice
  value: locks=['Khóa tình thái ước lượng khả năng cầm cự thêm nửa năm, thậm chí có
    lẽ là tròn một năm với điều kiện dốc toàn bộ mọi biện pháp trong khả năng.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000107
  kind: terminology_and_voice
  value: 'locks=[''Khóa mệnh đề phủ định tuyệt đối: họ không tài nào giành chiến thắng
    được.'']'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Tham tán Conrad', cấu trúc điều kiện nếu không có
    dấu hiệu đàm phán thành công và tình thái 'có lẽ sẽ phải thực hiện các biện pháp
    phòng ngừa'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf nhìn nhận tính nghịch lý ('Dù nghe
    có vẻ ngược đời') và khẳng định 'vẫn còn thời gian'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa phân biệt chủ thể ('Họ' = Đế quốc; 'nước này' = Ildoa), hướng
    địa lý 'miền đông', địa danh 'bán đảo Ildoa', thuật ngữ 'thế trận phòng ngự chiều
    sâu' và mục tiêu củng cố 'biên giới phía nam'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' (quy chiếu Rudersdorf), định danh 'Ildoa' và bước
    chuyển tâm lý từ chỗ biết việc kéo Ildoa vào cuộc chiến là ý tưởng tồi tệ chỉ
    nhằm trì hoãn sự sụp đổ tất yếu sang chỗ coi đó là phương án rất đáng cân nhắc
    và quá đỗi đáng giá nếu thực sự kéo dài được thời gian."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ tự xưng 'Ta' và quyết
    tâm bắt buộc phải thực hiện bổn phận."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', mục tiêu nhắm tới là 'thời gian', cái giá phải
    trả là 'tự làm vấy bẩn đôi tay mình' và giới hạn thời gian 'tối đa một năm để
    bắt đầu hành động'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa bước chuyển cảnh sang 'miền đông' và hình ảnh 'một người chiến
    thắng' đã lập nên vô số kỳ tích quân sự phi thường."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Trung tướng Zettour', đại từ 'ông', chi tiết nụ cười
    nhếch mép đầy giễu cợt khi nghĩ tới khả năng tấm huân chương cùng 'quân hàm đại
    tướng' sẽ được chuyển tới bất cứ lúc nào và hành động rà soát tấm bản đồ lớn trên
    mặt bàn."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết tấm bản đồ dày đặc ghi chú vươn xa hơn về 'phía đông',
    phản ứng bàng hoàng của các hãng tin nước ngoài trước việc họ coi là 'Đế quốc'
    chuyển sang phản công trở lại, và sự đối lập với thực tế kém kỳ diệu, kém phấn
    khởi hơn nhiều so với báo chí."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Zettour với đại từ 'Chúng ta' - 'ta', thuật
    ngữ 'tiền tuyến' và phép so sánh mỏng manh như 'một lâu đài bài'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Lục quân Đế quốc' và thực trạng chỉ đang cầm cự chật
    vật, mới vừa tạo dựng được một chỗ đứng mới."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Quân đội Liên bang', 'Liên bang' và hình ảnh ẩn dụ
    xuyên suốt đoạn về cái cây khổng lồ chỉ bị tỉa bớt cành nhưng vẫn bám trụ vững
    chắc và sẽ sớm vươn thân cây to khỏe càn lướt trở lại."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản với hình ảnh cái cây của 'Đế quốc' ngày càng lộ
    thêm dấu hiệu héo úa và suy tàn."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', 'Hội đồng Tự trị', tên riêng 'Zettour',
    nhận định sự tài trí không còn đủ để thắng cuộc chiến và lý do cấp bách phải tỉa
    bớt vùng đất xung quanh cũng như thành lập Hội đồng Tự trị."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', danh xưng 'Vị tướng', thuật ngữ 'sư đoàn tình
    nguyện', yêu cầu tạo ra thứ gì đó từ hai bàn tay trắng và ý nghĩ tự giễu bản thân
    đã trở thành một kẻ lừa đảo."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', thuật ngữ 'nhân lực', 'sư đoàn', giới hạn tuyệt
    đối chỉ nhận được hai hoặc ba sư đoàn và phủ định không dám mơ tới con số hai
    chữ số."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa thế đối lập với 'Liên bang' đang huy động hàng chục 'sư đoàn'
    mới tinh."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Zettour với đại từ 'ta' - 'chúng ta' về sự
    chênh lệch nhân lực làm ông phát bệnh và giới hạn của chiến lược trước chênh lệch
    quân số áp đảo."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Trung tướng Zettour', thuật ngữ 'thuốc lá quân đội',
    'thăng quân hàm đại tướng', 'các sĩ quan cao cấp', 'tiền tuyến', 'đại tướng',
    cùng suy ngẫm về việc phớt lờ quy tắc tiền tuyến khiến những ngôi sao trên cầu
    vai nhẹ đi rất nhiều."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000127
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', định danh 'Đế quốc', thuật ngữ 'sĩ quan cao cấp'
    và giai thoại rằng những đội quân bại trận thường sản sinh ra sĩ quan cao cấp
    hàng loạt."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' - 'mình' và hành động giữ giai thoại mỉa mai trong
    lòng, miễn cưỡng chuyển sự chú ý sang vấn đề ông ước sao có thể làm ngơ."]
