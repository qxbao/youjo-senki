segment_id_end: YS-LN10/Text/chapter022.xhtml/p000293
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000259
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm khái quát với đại từ tự quy chiếu 'mình' theo
    DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000260
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya tự xưng 'tôi', câu hỏi tu từ có cấu trúc
    phủ định ('vì đã không gói ghém nó thành một viên thuốc bọc đường dễ nuốt')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000261
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp phủ định ngắn 'Không.'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000262
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp phủ định ngắn 'Không.'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000263
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật về 'Tham tán Conrad' và 'Đại tá Lergen' cùng
    phủ nhận sự cần thiết của lời xin lỗi."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000264
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('mình' theo DEC-P01-001), quy
    chiếu 'Hai người họ' / 'hai người này' và sắc thái phỏng đoán ('hẳn sẽ phối hợp
    làm việc rất ăn ý với nhau')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000265
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('Mình' theo DEC-P01-001) quan
    sát biểu cảm của 'Tham tán Conrad' ('ông ta')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000266
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad tự xưng 'tôi', đại từ bao gộp 'chúng ta',
    tên 'Đế quốc', cách gọi 'bên quân đội' và mục tiêu 'nối lại quan hệ hòa hảo'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000267
  kind: terminology_and_voice
  value: locks=["Khóa câu nội tâm ngôi thứ nhất ('Mình' theo DEC-P01-001) và cách
    quy chiếu 'nhà ngoại giao ấy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000268
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại nhận xét trực diện của Tanya ('Đó là một sự mâu thuẫn
    khổng lồ.')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000269
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm quy chiếu tới Conrad ('Ông ta') và mệnh đề nhượng
    bộ chỉ sự phi lý thực sự của hoàn cảnh đất nước."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000270
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp gọi 'thưa Trung tá' và cấu trúc so sánh hơn ('tốt hơn
    là chỉ đơn thuần chạy theo chiến thắng')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000271
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya tự xưng 'Tôi' dẫn mệnh đề kinh điển 'chiến
    tranh cũng chỉ là sự nối dài của chính trị'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000272
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba quy chiếu tên 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000273
  kind: terminology_and_voice
  value: locks=["Khóa câu giả định trái thực tế ('Nếu không phải vì thực tại khắc
    nghiệt mà chúng ta đang phải đối mặt, cuộc trò chuyện này hẳn đã khá thú vị rồi!')
    và câu cảm thán phủ định ('Nhưng làm sao có thể bọc đường cho một căn bệnh nan
    y giai đoạn cuối cơ chứ!')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000274
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán nội tâm về 'Giới tinh hoa trí thức của Đế quốc'
    và 'sự mâu thuẫn tột cùng ấy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000275
  kind: terminology_and_voice
  value: locks=["Khóa phép so sánh ẩn dụ tài chính (vay thêm nợ cho phi vụ làm giàu
    nhanh khi đang ngập nợ) và câu hỏi tu từ với đại từ 'chúng ta'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000276
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm tự quy chiếu ngôi thứ nhất ('mình' theo DEC-P01-001)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000277
  kind: terminology_and_voice
  value: locks=["Khóa đoạn nội tâm ngôi thứ nhất ('mình' theo DEC-P01-001), danh xưng
    'Đại tá Lergen' và 'Tham tán Conrad', cùng đúng phạm vi nhấn mạnh chữ nghiêng
    '*Con tàu này đã đang chìm rồi*' theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000278
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn đặc trưng giữa ngôi thứ nhất nội tâm
    ('Mình') và quy chiếu ngôi thứ ba đối với 'Tanya' ('của cô', 'cô')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000279
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ phủ định ('Dù không phải tự nguyện mà ở đây')
    và quy chiếu ngôi thứ ba 'Tanya' kết hợp từ phản thân 'của mình'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000280
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán nội tâm ('mình' theo DEC-P01-001) và câu hỏi tu
    từ mang hàm ý phủ định."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000281
  kind: terminology_and_voice
  value: locks=["Khóa câu khẳng định phủ định ngắn 'Không đời nào.'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000282
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc pha trộn điểm nhìn giữa ngôi thứ nhất ('Mình') và ngôi
    thứ ba ('của cô') bám sát bản nguồn, cùng hình ảnh ẩn dụ 'con thuyền rò rỉ' và
    'chiếc xuồng cứu sinh'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000283
  kind: terminology_and_voice
  value: locks=["Khóa câu nội tâm ngôi thứ nhất ('Mình' theo DEC-P01-001)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000284
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm về 'Những nhà tuyển dụng của thế giới này'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000285
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('Mình' theo DEC-P01-001) và
    quyết định 'tìm cách đào tẩu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000286
  kind: terminology_and_voice
  value: locks=["Khóa đoạn tự sự ngôi thứ nhất ('mình') trên chuyến xe quay về và
    danh xưng 'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000287
  kind: terminology_and_voice
  value: locks=["Khóa tự sự ngôi thứ nhất ('Mình' / 'mình'), cụm 'mặt trận phía tây',
    'giới chóp bu' và kỳ vọng kế hoạch 'sẽ bị bác bỏ'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000288
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc tăng tiến ('không những được thông qua, mà còn nhận
    được sự hậu thuẫn toàn diện'), phủ định ('chẳng phải một vị cấp trên bình thường
    nào đó') và định danh 'Đại tá Lergen của chính Văn phòng Bộ Tổng tham mưu' ('Ông
    ấy')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000289
  kind: terminology_and_voice
  value: locks=["Khóa đoạn tự sự ngôi thứ nhất ('Mình') về kinh nghiệm làm việc với
    bộ máy hành chính quân sự cấp thấp, quản lý cấp trung và 'các sĩ quan quân nhu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000290
  kind: terminology_and_voice
  value: locks=["Khóa sự đối lập khi thuyết phục 'ban lãnh đạo cấp cao', vai trò của
    'Đại tá Lergen' ('ông ấy'), đại từ tự quy chiếu 'mình' và đại từ ngôi thứ nhất
    số nhiều 'chúng tôi' (chỉ Tanya và Đại tá Lergen, giữ khoảng cách cấp bậc theo
    DEC-P01-001)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000291
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định quá khứ ('lẽ ra sẽ là một nhiệm vụ đồ sộ nếu
    một mình Tanya tự xoay xở') và danh xưng 'Đại tá Lergen'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000292
  kind: terminology_and_voice
  value: locks=["Khóa đoạn đánh giá năng lực của 'Vị đại tá' ('Ông ấy'), sự phân biệt
    'cả lục quân lẫn hải quân' và cấu trúc nhấn mạnh ('chẳng khác gì một phép màu')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000293
  kind: terminology_and_voice
  value: locks=["Khóa câu kết lô với đại từ 'mình', đúng phạm vi nhấn mạnh chữ nghiêng
    '*Kế hoạch B*' theo DEC-P01-002 và danh xưng 'Tướng Romel'."]
