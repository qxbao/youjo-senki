segment_id_end: YS-LN10/Text/chapter018.xhtml/p000029
choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000001
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn tự quy chiếu ngôi thứ ba ('Tanya', 'cô') và nhận định
    kế hoạch điên rồ một cách triệt để và rành rành; không dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm ngôi thứ nhất 'mình' và chuỗi hành động khoanh
    tay ngước nhìn trần nhà."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000003
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi' kèm tiểu từ kính ngữ 'ạ' thể hiện sự ngập
    ngừng của cấp dưới."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000004
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', đại từ khái quát 'bạn' trong mệnh đề
    kinh nghiệm nghề nghiệp chung, và ẩn dụ nhảy việc/công ty cũ."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô 'Thưa Tướng quân', cặp đại từ 'tôi' - 'ngài' (kèm
    'ạ'), phủ định 'không thể tán thành việc này', và nhận định vượt ngoài phạm vi
    thẩm quyền."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000006
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'chiến lược phòng ngự tích cực tiến công' trong lời
    đáp của Romel."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa Tướng quân…', thuật ngữ 'cuộc tiến công quy mô
    lớn' và tiểu từ 'ạ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000008
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề châm ngôn quân sự ('cách phòng thủ tốt nhất là một đòn
    tấn công xuất sắc') và quan hệ so sánh hơn giữa 'tinh thần tiến công và khao khát
    giành thế áp đảo quân sự' với 'chính bản thân đòn tấn công'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*lẽ ra cô phải biết điều này rồi chứ*' theo
    DEC-P01-002, danh xưng 'Tướng Romel', và đại từ nội tâm 'mình'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000010
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ ''ông ta'' quy chiếu Romel và ba yếu tố chiến lược:
    nơi dồn sức mạnh, cách bố trí lực lượng dự bị hợp lý, đạt được mục tiêu chiến
    lược."]'
- segment_id: YS-LN10/Text/chapter018.xhtml/p000011
  kind: terminology_and_voice
  value: locks=["Khóa phép so sánh tương đồng với 'chuyện nhảy việc của một người'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*lúc nào*' trong cấu trúc phủ định bộ phận
    'không phải *lúc nào* cũng xấu' theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000013
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Degurechaff', cặp đại từ thoại của Romel
    'Ta' - 'cô' (và 'chúng ta' ở câu đầu), phủ định kép 'không định để cô không hiểu
    thấu', danh hiệu 'Bạch Ngân', và câu hỏi khích tướng 'Phải chăng lớp bạc của cô
    đã rỉ sét rồi?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và sắc thái ước muốn trái thực tế ('gần
    như ước gì chuyện đó là thật')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa lối tự quy chiếu đan xen giữa 'mình' và 'Tanya', cùng phủ định
    'không thể lớn tiếng khi phản đối' gắn với điều kiện giữ vững vị trí."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' và danh xưng 'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'thưa Tướng quân', đại từ 'Tôi', mệnh đề phân biệt 'Sự
    liều lĩnh không đồng nghĩa với lòng dũng cảm', và phủ định 'không muốn thiếu suy
    xét mà coi việc ẩn nhẫn chờ thời là nhu nhược về mặt tinh thần'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ta' trong câu hỏi tu từ cuối đoạn của Romel ('Ta nói
    có sai không?')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba 'Tanya không còn lựa chọn nào khác
    ngoài việc gật đầu tán thành.'"]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc phủ định kép 'ý tôi không phải là không cần một mức
    độ tiến công nhất định để tổ chức phòng ngự hiệu quả' và trọng tâm phản biện ở
    cái giá phải đánh cược."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', hình ảnh tập trung lực lượng chĩa vào một
    điểm duy nhất, và thuật ngữ 'Chiến thuật phòng ngự'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' (Romel) phân biệt với 'ông' (Oda Nobunaga),
    cùng nhận định về chiến thuật quân sự mang tính cách mạng và cách phòng thủ đi
    vào lịch sử Nhật Bản."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', tên riêng 'Oda Nobunaga', 'Trận Okehazama tại
    Dengakuhazama', và quan hệ nhân quả phủ định ở câu cuối."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*phòng ngự*' theo DEC-P01-002, đại từ khái
    quát 'bạn', và điều kiện loại trừ 'Trừ phi bạn đang cố câu giờ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*chờ*' theo DEC-P01-002, cùng các tên riêng
    'Gia tộc Oda', 'Imagawa Yoshimoto' và 'xứ Owari'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa chủ ngữ khái quát 'Người ta' và chi tiết 'sách giáo khoa lịch
    sử Nhật Bản'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*phòng ngự*' theo DEC-P01-002, cùng các
    chi tiết 'samurai', 'lấy đầu Imagawa Yoshimoto' và 'đánh chặn quân xâm lược'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'tướng quân Nobunaga', đại từ 'ông', và tính giả định
    quá khứ trái thực tế ('hẳn đã khép lại...', 'hẳn đã bị đẩy xuống thành một dòng
    chú thích trong lịch sử')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000029
  kind: terminology_and_voice
  value: 'locks=["Khóa hô ngữ ''Thưa Tướng quân'', đại từ ''tôi'', phủ định ''không
    phủ nhận rằng'', và hai minh chứng: ''Các đòn tập kích chặt đầu chỉ huy'' cùng
    ''lối tác chiến cơ động của Tướng Zettour ở miền đông''."]'
