segment_id_end: YS-LN10/Text/chapter010.xhtml/p000151
choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001 và nhấn
    mạnh Markdown đúng phạm vi theo DEC-P01-002 tại '*Không!*'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn tự tách ngôi ('Tanya von Degurechaff') kết hợp đại
    từ nội tâm 'Mình' / 'mình', cụm 'kiểu cổ xúy bóc lột nhằm tạo ra sự thỏa mãn giả
    tạo trong công việc này' và câu giả định trái thực tế ('Nếu có thể từ chối thì
    mình đã từ chối rồi')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa giả định trái thực tế ('Nếu đây là một công ty bình thường,
    hẳn trên tay mình đã cầm sẵn đơn xin thôi việc rồi'), thuật ngữ 'sĩ quan cấp tá',
    hai vị trí nhấn mạnh Markdown theo DEC-P01-002 ('*thuyên chuyển* hay *từ chức*'),
    nhận định 'Cách duy nhất để chuyển đi nơi khác là đào ngũ sang phe địch' và nỗi
    nhớ 'nước Nhật' gắn với quyền tự do lựa chọn công việc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000127
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn tự tách ngôi ('Tanya'), thuật ngữ 'nhân viên cổ cồn
    trắng', đại từ nội tâm 'Mình' / 'mình', phủ định khả năng thay đổi bộ máy từ bên
    trong và mệnh đề giả định phủ định kép ('Mà kể cả có làm được thì mình cũng chẳng
    làm—mình đâu có vị tha đến thế')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ hệ quả ('Do đó, vì sự thanh thản của lương tâm mình')
    và quyết định xác nhận một chi tiết quan trọng của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' - 'ngài' cùng đại từ gộp 'chúng ta', cách gọi
    'thưa Tướng quân', tiểu từ lễ phép 'ạ', ẩn dụ 'đồng phạm' - 'màn kịch lừa đảo
    của chúng ta' và câu hỏi 'Ngài đang giấu mánh bài gì trong tay áo thế ạ?'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Cô' - 'tôi', cách gọi 'Trung tá', tên 'Đế quốc'
    và lời dẫn vào câu trả lời duy nhất của Zettour."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', nhận định khái quát về nhà lãnh
    đạo tài năng và sự phân vân giữa việc nên vui mừng hay nên cẩn trọng hơn với lời
    ăn tiếng nói."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và danh xưng 'Trung tướng Zettour'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa nhận định phủ định thẳng thắn ('Chiến thắng là điều không thể
    đạt được nữa rồi'), cặp đại từ 'cô' - 'chúng ta' - 'Tôi' và mục tiêu duy nhất
    là tiếp tục cầm cự trong khi ngăn chặn sự sụp đổ hoàn toàn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ngài', tiểu từ 'ạ' và hai câu hỏi ẩn dụ sắc bén của
    Tanya ('thứ thuốc phiện mang tên hy vọng để giữ cho họ không gục ngã chịu thua',
    'một đội quân gồm toàn những con nghiện')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'cô' - 'Tôi', sự thừa nhận của Zettour ('nhưng cô
    nói không sai đâu'), ý định ban cho binh lính hy vọng và sự tự tin bằng một chiến
    thắng, cùng nỗi chua xót cuối đoạn; không dùng nhấn mạnh Markdown cho thẻ neo
    trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ ba 'Ông ấy' (chỉ Zettour) và đại từ nội tâm
    'Mình' trong sự đồng cảm chua chát của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' - 'ngài' và danh xưng 'thưa Tướng quân'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn so sánh ngôi thứ ba giữa 'Zettour' và 'Tanya' khi
    cả hai đều không thể tự chọn hướng đi cho sự nghiệp của mình."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa cụm chức vụ 'cục phó kiêm thanh tra viên', đại từ 'ông ấy' /
    'ông', đại từ nội tâm 'Mình' và cấu trúc phủ định nhấn mạnh ('Ngay cả từng ấy
    quyền hạn và kinh nghiệm… cũng chẳng đủ để giải thoát ông khỏi cái bộ máy vặn
    vẹo này')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000140
  kind: terminology_and_voice
  value: locks=['Khóa chiêm nghiệm nội tâm của Tanya về việc không thể thoát khỏi
    số phận và giá trị của sự tự do khi đã đánh mất nó.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' - 'ông ấy', danh xưng 'Tướng Zettour' và nét hài
    hước lệch pha khi Zettour lầm tưởng sự trầm ngâm của Tanya về quyền tự do chuyển
    việc là sự thấu hiểu nỗi lòng của ông."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá', cặp đại từ 'Tôi' - 'cô', tên 'Liên bang'
    và điệp cấu trúc mệnh lệnh ba vế của Zettour."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại tự giễu mở đầu ('thuyên chuyển sang rạp xiếc để làm
    chú hề'), phần độc thoại tự tách ngôi ở giữa ('Tanya', 'mình') và lời nhận lệnh
    khép lại bằng hình ảnh ẩn dụ ('Xin ngài hãy thưởng thức buổi diễn ạ')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp ngắn gọn của Zettour với đại từ 'Tôi' và danh xưng 'Trung
    tá'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa mốc thời gian 'NGÀY 31 THÁNG 7 NĂM THỐNG NHẤT 1927', thuật ngữ
    'ĐƠN VỊ TÌNH NGUYỆN ĐA QUỐC GIA' và tên 'LIÊN BANG'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa giọng trần thuật ngôi thứ ba mang màu sắc mỹ từ của báo cáo
    ('Những người lính tình nguyện lặn lội đường xa tới chi viện cho Liên bang') đối
    lập với thực cảnh ở các đoạn sau."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake', đại từ ngôi thứ ba 'anh' và chi
    tiết xin gửi tuyển tập thơ trào phúng nổi tiếng từ quê nhà; không dùng nhấn mạnh
    Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', cụm 'nơi đồn trú' và mục đích viết báo cáo bằng
    lời lẽ hoa mỹ để tâm trí tạm rời xa thực tại."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa câu thở dài cảm thán của Drake ('…Có quá nhiều điều phải suy
    nghĩ mà chẳng thấy hồi kết đâu cả')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000150
  kind: terminology_and_voice
  value: 'locks=["Khóa phép so sánh chiến tranh với ''một mối tình đơn phương'', đại
    từ giả định chung ''bạn'' và hai nét tương đồng: trăn trở đoán định ý đồ của đối
    phương cùng việc mò mẫm trong bóng tối tìm chút dấu vết bóng hình của họ."]'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'Anh', bối cảnh 'căn lều dã chiến'
    - 'doanh trại' và sự tương phản đời thường giữa việc nghĩ cách sửa ấm đun nước,
    nuốt cục tức vì đơn hàng mứt yêu thích thất lạc với việc suy tính về kẻ địch."]
