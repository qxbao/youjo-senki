- segment_id: YS-LN10/Text/chapter022.xhtml/p000570
  kind: terminology_and_voice
  value: locks=["Khóa câu báo cáo khẩn cấp bị ngắt quãng bằng dấu gạch ngang dài 'Chỉ
    huy bị bắn hạ rồi! Chỉ huy bị—'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000571
  kind: terminology_and_voice
  value: locks=['Khóa câu nhận định ngắn gọn tổng kết tình cảnh hỗn loạn.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000572
  kind: terminology_and_voice
  value: locks=["Khóa địa danh 'vùng eo biển', các thuật ngữ 'phòng kiểm soát', 'vị
