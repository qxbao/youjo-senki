    và nhận thức chung 'họ không tài nào đối phó nổi với thứ vừa ập tới'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000573
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Hai đại đội pháp sư trên không', đại từ 'Họ' và nhấn
