- segment_id: YS-LN10/Text/chapter022.xhtml/p000574
  kind: terminology_and_voice
  value: locks=["Khóa tên đơn vị 'hai phân đội Argyle và Carbene' và cụm 'chuyển sang
    trạng thái chiến đấu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000575
  kind: terminology_and_voice
  value: locks=["Khóa tên đơn vị 'Đội phản ứng nhanh số hai' và trạng thái đã hoàn
    tất việc cơ động tập kết dưới mặt đất."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000576
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa những ánh mắt hoài nghi xung quanh với thái
