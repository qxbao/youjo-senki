- segment_id: YS-LN10/Text/chapter022.xhtml/p000577
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' và mệnh lệnh huy động toàn bộ quân tiếp viện
    kể cả 'lực lượng dự bị'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000578
  kind: terminology_and_voice
  value: locks=["Khóa đại từ sở hữu 'của họ' và cụm 'phát động một cuộc phản công
    quy mô lớn'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000579
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Chúng ta phải chặn đứng chúng lại.*' theo
    đúng phạm vi thẻ <em> trong nguồn (DEC-P01-002), thuật ngữ 'trung tâm chỉ huy'
    và đại từ 'họ'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000580
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'các đơn vị không quân mới của Lục quân Đế quốc',
    'không vực mười hai', 'không vực mười sáu', 'Pháp sư Định danh' và đại từ 'bọn
    chúng'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000581
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Không thể nào.*' theo đúng thẻ <em> trong
    nguồn (DEC-P01-002), cấu trúc mở rộng phạm vi 'Đó không chỉ là tiểu đoàn do Ác
    quỷ sông Rhine dẫn đầu' và các thuật ngữ 'đơn vị Pháp sư Định danh', 'mặt trận
    Rhine'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000582
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ', sự tự hiệu chỉnh tăng cấp 'Cứ như thể... Không,
    địa ngục trần gian...' và các tên gọi 'Trận Không chiến sông Rhine', 'chiến dịch
    Rhine'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000583
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'trung tâm kiểm soát tích hợp', 'đơn vị không
    quân hùng mạnh của Đế quốc', đại từ 'chúng' và câu hỏi cảnh báo về một mặt trận
    Rhine thứ hai."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000584
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'Các sĩ quan trực ban', 'khu vực kiểm soát đánh
    chặn phía nam' và 'sở chỉ huy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000585
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'tác chiến điện tử', 'các tín hiệu dẫn đường',
    'Đế quốc', 'hỗ trợ dẫn đường bằng phương thức điện tử', đại từ 'chúng' - 'chúng
