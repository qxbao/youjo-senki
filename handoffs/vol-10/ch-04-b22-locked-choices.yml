- segment_id: YS-LN10/Text/chapter022.xhtml/p000597
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ'/'họ', cách gọi 'con quái vật đó' và quan hệ nguyên
    nhân - kết quả giải thích lý do họ chuẩn bị dốc toàn lực giáng vào quân xâm lược."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000598
  kind: terminology_and_voice
  value: locks=['Khóa hai câu hỏi nội tâm liên tiếp thể hiện sự bế tắc của sĩ quan
    chỉ huy.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000599
  kind: terminology_and_voice
  value: locks=["Khóa sự phân biệt rõ đại từ 'họ' (phía phòng không Khối Thịnh vượng
    chung) và 'chúng' (quân Đế quốc tấn công) trong các câu hỏi tu từ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000600
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'Các pháp sư địch', 'không vực mười hai', 'Tiểu
    đoàn Whiskey' và 'tuyến đánh chặn số hai'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000601
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'không vực mười hai' và động thái quay đầu của quân
    địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000602
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng', thuật ngữ 'không vực mười sáu' và phán đoán
    mục tiêu của địch là 'Whiskey'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000603
  kind: terminology_and_voice
  value: locks=['Khóa câu trần thuật về tốc độ phản ứng khẩn trương tối đa của các
    sĩ quan.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000604
  kind: terminology_and_voice
  value: locks=["Khóa tên đơn vị 'Tiểu đoàn Whiskey', đại từ ngôi thứ hai số nhiều
    'các anh' trong cảnh báo vô tuyến và hành động tập hợp lao thẳng tới của các pháp
    sư địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000605
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Người đàn ông' - 'họ' (Tiểu đoàn Whiskey) và tên gọi
    'Khối Thịnh vượng chung'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000606
  kind: terminology_and_voice
  value: locks=["Khóa các tên đơn vị 'Tiểu đoàn Scotch', 'Tiểu đoàn Whiskey', đại
    từ 'họ', cụm 'Thời gian dự kiến tới nơi' và các mốc thời gian 'bốn trăm giây',
    '360 giây'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000607
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' (Tiểu đoàn Scotch) - 'chúng ta' (phía chỉ huy phòng
    không) và nhận định tình thế sát nút nhưng viện binh sẽ tới kịp lúc."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000608
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh so sánh 'như đi trên dây' và trạng thái vắt kiệt sức
    lực."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000609
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Khối Thịnh vượng chung', quan hệ nhân quả giải thích
    vì sao đã lâu tình hình mới hỗn loạn đến vậy và nhận định ẩn dụ 'chiến tranh là
    một con quái vật không bao giờ có thể tin cậy được'."]
