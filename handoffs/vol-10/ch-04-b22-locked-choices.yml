- segment_id: YS-LN10/Text/chapter022.xhtml/p000590
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Lại thêm tin xấu nữa ư?*' theo đúng thẻ
    <em> trong nguồn (DEC-P01-002) và hành động các sĩ quan đồng loạt day thái dương."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000591
  kind: terminology_and_voice
  value: locks=["Khóa hiệu ứng nói lắp 'Q-quân địch', các tên đơn vị 'Argyle', 'Carbene'
