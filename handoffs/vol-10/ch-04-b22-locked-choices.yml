- segment_id: YS-LN10/Text/chapter022.xhtml/p000569
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'Một đại đội pháp sư trên không', 'các Pháp sư
    Định danh', sự đối lập đại từ 'chúng' (địch) - 'Chúng tôi' (ta) và phủ định khả
