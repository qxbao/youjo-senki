segment_id_end: YS-LN10/Text/chapter018.xhtml/p000063
choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', thuật ngữ 'sĩ quan thực địa', và nhận
    định nắm rõ cách tận dụng thế chủ động cùng thông tin để giành ưu thế trong phòng
    ngự; không dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000031
  kind: terminology_and_voice
  value: locks=['Khóa câu hỏi phản vấn của Romel và nhận định kế hoạch thiên hẳn về
    phòng ngự.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'tôi' (kèm 'ạ') và sự đối lập giữa 'Ở cấp độ quốc
    gia thì đúng là nó thiên hẳn về phòng ngự' với 'khó mà gọi đây là một kế hoạch
    mang tư duy phòng ngự'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', danh xưng 'Tướng Romel', và phủ định
    'không tài nào chấp nhận nổi định nghĩa hết sức phóng khoáng'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa thành ngữ tương đương 'chỉ hươu bảo ngựa', thuật ngữ 'phòng
    ngự chiến lược', và tiểu từ kính ngữ 'ạ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ thoại của Romel 'Chúng ta' / 'Ta' - 'cô', hô ngữ
    'Trung tá', và cụm 'sĩ quan thực địa'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa lối chuyển điểm nhìn từ ngôi thứ ba ('Tanya') sang nội tâm ngôi
    thứ nhất ('mình'), phép so sánh với thế giới trước kia, cụm 'môi trường làm việc
    bóc lột do thời chiến tạo ra', và ý định tìm đường rút lui."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và mục tiêu trước mắt là bảo vệ vị trí
    hiện tại."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh ẩn dụ 'một con chó săn… cần phải giữ bình tĩnh cho
    đến khi con mồi vừa vặn lọt vào tầm vồ' và tiểu từ 'ạ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình', danh xưng 'vị tướng', và hành động đứng thẳng
    người nhìn thẳng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh đối lập 'loài chó hoang' tự ý chạy loạn khi chưa có
    lệnh và chuẩn mực hành xử của 'một người lính Đế quốc' (kèm 'ạ')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô', hô ngữ 'Trung tá', và lời nhắc không sa đà vào
    ẩn dụ."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*diễn giải lại*' theo DEC-P01-002, đại từ
    'ngài' (kèm 'ạ'), và cụm 'mệnh lệnh của chính quốc'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Romel', đại từ 'mình' - 'ông ta', và sự tương
    phản giữa vẻ mặt vui vẻ không suy suyển với ánh mắt uy nghiêm thúc giục nói tiếp."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta' / 'tôi' (kèm 'ạ') và cấu trúc đối lập 'Không
    phải để đánh chặn mà là để xông thẳng vào lãnh thổ địch!'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'vùng biển của Khối Thịnh vượng chung', 'siêu cường hàng
    hải của thế giới', đại từ 'chúng ta', và câu hỏi tu từ bác bỏ tính chất phòng
    ngự."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000046
  kind: terminology_and_voice
  value: locks=['Khóa nhận định nội tâm coi kế hoạch vừa điên rồ vừa chỉ là một cuộc
    tấn công liều lĩnh.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ thoại của Romel 'Chúng ta' / 'ta' - 'cô' và quan
    điểm 'loại bỏ kẻ địch chính là cách phòng ngự tốt nhất'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ngài' (kèm 'sao ạ?'), cụm 'đòn tấn công vào sau chiến
    tuyến địch', và thuật ngữ 'chiến lược phòng ngự'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và chi tiết cấp trên lặng lẽ gật đầu."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' và cụm thuật ngữ 'Một đòn tập kích đường biển
    hiệp đồng sử dụng cả pháp sư lẫn hải quân đánh bộ…'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ta', cụm 'quyền tự quyết', và mục đích 'bảo vệ sự toàn
    vẹn của mặt trận phía tây'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*ngay trên sân nhà của chúng*' theo DEC-P01-002
    và câu hỏi chất vấn nội tâm hướng về 'ngài'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Shimazu', chi tiết 'một trong những lãnh chúa điên
    rồ khét tiếng nhất lịch sử Nhật Bản', và giới hạn hành động phòng ngự trong 'phạm
    vi thế lực'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' (kèm 'ạ'), phủ định 'không thể ủng hộ quyết định
    này', và lập luận 'xóa sổ luôn khái niệm tiến công ngay từ đầu'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', cặp đại từ 'ta' / 'chúng ta' - 'cô', và thuật
    ngữ 'thế bố trí phòng ngự của chúng ta ở miền tây'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' - 'ngài', hô ngữ 'thưa Tướng quân' (kèm 'ạ'),
    và bổn phận người lính nỗ lực vì thế phòng ngự tốt nhất tại miền tây."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa danh hiệu 'Bạch Ngân', đại từ 'cô', và phép ví von 'như một
    lão chính khách lụ khụ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Romel' và hành động lắc đầu không tin nổi."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Liên bang' và hình ảnh 'nồng nặc chướng khí'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' (Romel), đại từ nội tâm 'mình', cụm 'mặt trận
    phía đông', và nhận định tình hình thê thảm."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh 'bãi lầy chất đầy những thi thể chẳng bao giờ được
    chôn cất tử tế', ẩn dụ 'con quái thú hai đầu' của 'Liên bang' đại diện cho 'Chủ
    nghĩa Cộng sản' và 'chủ nghĩa dân tộc', cùng lời mời của 'tôi' với 'ngài' (kèm
    'ạ')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ta' và lời từ chối khéo của Romel rằng đã hơi có tuổi
    nên không còn hợp với trò nghịch bùn."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' - 'ngài' (kèm 'ạ'), danh xưng 'Tướng Zettour',
    và chi tiết từng lội qua bùn lầy ở miền đông cùng đơn vị của Tanya."]
