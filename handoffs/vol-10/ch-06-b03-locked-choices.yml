choices:
- segment_id: YS-LN10/Text/chapter028.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Khối Thịnh vượng chung', 'Đế quốc' và nhận định đối
    lập giữa năng lực thu thập tình báo đáng kinh ngạc của đối phương với sự tụt hậu
    của Đế quốc về mảng gián điệp."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'ông' (quy chiếu Rudersdorf), cách gọi 'đám
    người Albion kia' và phép so sánh 'Đế quốc' chẳng khác nào một đứa trẻ về mặt
    tình báo khi đặt cạnh các quốc gia cùng thời."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'toàn quân', 'Lục quân Đế quốc', hậu quả chí mạng
    nếu tâm lý ngờ vực len lỏi và thực tế Lục quân Đế quốc gần như không có kinh nghiệm
    giữ vững lập trường trước nghi kỵ hay điều tra làm rõ các mối nghi ngờ."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm về khả năng thực hiện trót lọt 'Kế hoạch B'
    trong tình cảnh hiện tại."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', định danh 'Kế hoạch B', 'Đế quốc' và lập luận
    về bổn phận của một nhà chiến lược phải trù tính phương án cho bất kỳ kịch bản
    tồi tệ nhất nào có thể xảy ra."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa cấp bậc kèm tên riêng 'Trung tướng Rudersdorf' và phẩm chất
    luôn thực hiện bổn phận một cách nghiêm túc."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ 'Chúng ta', phủ định
    'không thể nắm chắc được thực trạng của lục quân' và nguyên nhân 'vì cả những
    lý do nội bộ lẫn bên ngoài'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'Một tay ông cầm điếu xì gà' và nhận thức 'đã không
    còn đường lui nữa'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa cặp định danh 'Tổ quốc, tức Đế quốc', thực trạng đẩy quá nhiều
    lớp người trẻ tuổi vào chỗ chết và hình ảnh so sánh nỗi đau thương của thân nhân
    đè nặng lên vai ông 'như một lời nguyền'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Trung tướng Rudersdorf' và sự ý thức rõ ràng về món
    nợ trách nhiệm trước vô số người đã hiến dâng mạng sống với niềm tin vào thắng
    lợi cuối cùng của đất nước."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa cặp định danh 'Đế quốc—vào Đế chế' thể hiện niềm tin tuyệt đối
    của những người đã ngã xuống."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa quyết tâm của Rudersdorf cân nhắc mọi hướng đi khả dĩ, thực
    thi giải pháp tốt nhất bất kể kết cục và sẵn sàng làm những gì cần làm đúng thời
    điểm ngay cả khi phải khởi động 'Kế hoạch B'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại với đại từ 'Chúng ta' và tên riêng 'Ildoa'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', 'Ildoa', 'Người Ildoa' và nhận định vận
    mệnh Đế quốc cũng như kết cục cuộc chiến phụ thuộc vào bản hiệp ước lập lờ cùng
    sự định đoạt của Ildoa."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000083
  kind: terminology_and_voice
  value: 'locks=["Khóa nhấn mạnh Markdown toàn câu theo DEC-P01-002: ''*Đúng là một
    vị thế chẳng dễ chịu chút nào.*''"]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Người Ildoa', 'Đế quốc', nhấn mạnh Markdown theo
    DEC-P01-002 tại '*hạn chế*' và nội dung Ildoa giữ trung lập từ đầu cuộc chiến
    nhưng vẫn dành cho Đế quốc bị cấm vận sự hỗ trợ tuy hạn chế mà vô cùng cần thiết."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa vai trò của 'Ildoa' là lựa chọn hiển nhiên để làm trung gian
    dàn xếp hiệp ước hòa bình và cầm trịch các cuộc đàm phán."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000086
  kind: terminology_and_voice
  value: 'locks=["Khóa nhận định về vấn đề cốt lõi: ''Ildoa'' đang nắm giữ vị trí
    địa lý vô cùng thuận lợi."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000087
  kind: terminology_and_voice
  value: 'locks=["Khóa thuật ngữ ''bản thổ của Đế quốc'' và hai đặc điểm của Ildoa:
    tự thân là một thế lực tầm cỡ thế giới nhưng vẫn chưa hề giao chiến với ''Đế quốc''
    trong cuộc đại chiến này."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000088
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Lục quân Hoàng gia Ildoa', 'Lục quân Đế quốc', 'Ildoa',
    thuật ngữ 'các điều khoản công thủ đồng minh', nhấn mạnh Markdown theo DEC-P01-002
    tại '*con dơi*' và hình ảnh ẩn dụ về con dơi đậu ở khoảng giữa lập lờ cùng nỗi
    rùng rợn trước viễn cảnh chọc gậy vào con dơi ấy."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Ildoa', 'Đế quốc', thuật ngữ 'nguồn tiếp tế' và 'vùng
    đệm chiến lược', cùng việc cả hai phe đều nghiền ngẫm từng tuyên bố của Ildoa
    để nhìn thấu ý đồ thực sự."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000090
  kind: terminology_and_voice
  value: 'locks=["Khóa cấu trúc so sánh tương quan đối với ''Đế quốc'': cốt lõi của
    vấn đề ít nằm ở ý đồ mà nằm nhiều hơn ở năng lực thực thi hành động dứt khoát."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại nhận định 'Ildoa' là một quốc gia quá nguy hiểm
    đối với 'Đế quốc'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000092
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Cuộc chiến trên hai mặt trận', hướng địa lý 'miền
    đông', danh xưng 'vị đại tướng tương lai tài ba Zettour', đại từ 'lão' quy chiếu
    Zettour và ẩn dụ phép màu rút ra từ chiếc mũ ảo thuật."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', tên riêng 'Zettour', đại từ 'lão' và cảnh
    báo rằng nếu cuộc chiến kéo dài thêm, Đế quốc sẽ cạn sạch đạn dược, vật tư tiếp
    tế lẫn con người và phải bằng mọi giá tránh cảnh phá sản."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000094
  kind: terminology_and_voice
  value: 'locks=[''Khóa mệnh đề nghịch lý trong thời chiến: quyết định đúng đắn không
    phải lúc nào cũng là quyết định tối ưu.'']'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ 'Ta' - 'chúng ta' -
    'họ' và câu hỏi tu từ liệu Ildoa có khờ dại đến mức cùng chia sẻ vận mệnh trong
    cuộc chiến thảm khốc này không."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Người Ildoa' và nhận định họ quá khôn ngoan, không
    đời nào vứt bỏ lợi ích riêng để ra tiền tuyến nhân danh tình hữu nghị láng giềng."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa nhận định 'Quân đội của họ đang nắm quyền kiểm soát' và đặc
    tính hành xử dựa trên lý trí hơn nhiều so với tình cảm hữu hảo."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa ưu tiên cao nhất của 'Người Ildoa' là giữ lập trường trung lập
    để tránh bị cuốn vào chiến tranh, hệ quả lý thuyết là 'Đế quốc' không phải lo
    họ xé bỏ hiệp ước song phương để tiến quân lên phía bắc, và kết luận họ không
    vị tha đến mức tự lao đầu vào cuộc chiến vì bất kỳ phe nào."]
