segment_id_end: YS-LN10/Text/chapter010.xhtml/p000095
choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi mở đầu của Zettour với danh xưng 'Trung tá Degurechaff',
    cặp đại từ 'tôi' - 'cô' và cụm 'các huân huy chương của mình'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp lễ phép của Tanya ('thưa Tướng quân', 'ngài' - 'tôi',
    'ạ') và cách dịch 'các phần thưởng vinh danh' cho danh từ chỉ sự vinh danh/khen
    thưởng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba ('Vị trung tướng' / 'ông' - 'cô') và
    trạng thái 'dù vẫn còn bối rối' khi cô trả lời ông."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000062
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ ''tôi'' và chuỗi danh mục khen thưởng: ''Huy hiệu Xung
    kích Cánh Bạc'', ''Huy hiệu Xung kích Tổng hợp'', ''huân chương chiến công'',
    ''huy hiệu kỹ năng đặc biệt'', ''phần thưởng phục vụ xuất sắc'' và ''huân chương
    chiến dịch''."]'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận của Zettour ('Tôi'), tên hai đơn vị 'Tiểu đoàn
    203' và 'Kampfgruppe Lergen', cùng thuật ngữ 'bằng tuyên dương đơn vị'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa lời khẳng định của Tanya ('Vâng', 'các thuộc cấp của tôi') ca
    ngợi năng lực làm việc xuất sắc của cấp dưới."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị trung tá', đại từ 'cô' - 'mình', nhận xét về khoảnh
    khắc bộc lộ đúng lứa tuổi và câu phủ định so sánh với các 'nữ sinh' khoe chiến
    tích của bạn bè trên chiến trường."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000066
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán nội tâm gián tiếp tự do ('họ') về thời đại kỳ lạ
    đang sống."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của 'Zettour', hành động nén lại 'một nụ cười chua
    chát nữa' và suy nghĩ về sự vặn vẹo của thế giới."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc khẳng định tuyệt đối ('không có gì ngoài sự tán thưởng
    và lời khen ngợi') mà 'ông' dành cho 'người lính trẻ đang đứng trước mặt mình'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000069
  kind: terminology_and_voice
  value: 'locks=["Khóa lời khen của Zettour (''Trung tá ạ'', ''Cô và các thuộc cấp
    của mình''), cụm ''những tinh hoa ưu tú nhất'' và khẳng định ''đừng nghi ngờ gì
    cả: Đó là điều hoàn toàn đáng để tự hào''."]'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Tanya ('Tôi') quy công cho 'nền giáo dục và huấn
    luyện' cùng 'tinh thần chiến binh bất khuất trên chiến trường'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa tình thái phỏng đoán ('Có lẽ cô tự hào là vì cô thực sự có năng
    lực') và sự đối lập cảm xúc ('thật đáng buồn, dù cũng mang một nét hài hước kỳ
    lạ')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa lời đề nghị thảo luận để tham khảo cho tương lai của Zettour,
    cặp đại từ 'Cô' - 'mình' / 'của cô' và hai câu hỏi về cốt lõi thành công cùng
    yếu tố nâng tầm binh lính; không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa câu trả lời của Tanya ('Tôi', 'chúng tôi', 'Tiểu đoàn của tôi')
    nhấn mạnh yếu tố huấn luyện cùng 'máu và mồ hôi' đã đổ ra."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa cụm danh từ mở đầu 'Thành công và nỗ lực', đại từ 'Ông' - 'cô'
    và suy đoán những thuộc cấp dưới quyền cô có lẽ cũng sẽ nói y hệt."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' và nhận định việc trải qua những thành công vang
    dội đã trở thành một phần cốt lõi trong 'bản sắc của họ'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán ngắn gọn 'À… ra là vậy' của Zettour."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn 'Thưa Tướng quân?' của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng đầy đủ 'Trung tướng Zettour' cùng hành động thở dài
    và cất giọng dò hỏi."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa câu mệnh lệnh của Zettour yêu cầu quên đi 'cái ảo tưởng về thành
    công đó'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa phản ứng ngỡ ngàng lễ phép '…Dạ?' của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Cô' - 'tôi', cách gọi 'Trung tá ạ', phủ định 'không
    thể trách cô được' và yêu cầu phải hiểu cảm giác của 'những kẻ bại trận'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Vị sĩ quan trẻ tuổi' và chi tiết lộ rõ vẻ bối rối trước
    lời của 'ông'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000083
  kind: terminology_and_voice
  value: locks=["Khóa nhận định 'Hiếm khi nào cô lại không bắt kịp mạch suy nghĩ của
    cấp trên' và hai giả thuyết nối tiếp ('Phải chăng là vì cô vẫn còn là một đứa
    trẻ...' / 'Hay có lẽ vì cô quá đỗi xuất chúng nên đơn giản là không tài nào hiểu
    nổi những kẻ không được như mình')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa hồi tưởng của 'Ông' về lời dặn không được kén chọn thuộc cấp
    và hy vọng năng lực siêu phàm của 'cô' sẽ không dẫn đến việc dùng những tiêu chuẩn
    cao không tưởng để đo lường các đồng cấp."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa lời dặn 'Hãy nhớ lấy điều này, Trung tá', đại từ 'Chúng ta',
    phủ định 'chẳng có mấy người đủ khắc kỷ để rèn luyện gian khổ như lính của cô
    đâu'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000086
  kind: terminology_and_voice
  value: locks=["Khóa lập luận của Tanya về mức độ nguy hiểm của việc huấn luyện không
    đủ, nét bất bình trong giọng nói, nhận định thời gian chẳng còn nhiều và câu hỏi
    tu từ kết lại bằng 'thưa Tướng quân?'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000087
  kind: terminology_and_voice
  value: locks=["Khóa tiếng cười 'Ha-ha-ha', giả định quá khứ ('lẽ ra chính là thứ
    chúng ta cần'), nhấn mạnh Markdown đúng phạm vi theo DEC-P01-002 tại '*trước khi*',
    cách gọi 'Trung tá' và phủ định 'Đám tân binh hiện tại của chúng ta không nghĩ
    như vậy đâu'; không dùng nhấn mạnh cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000088
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Tanya về nguyên nhân do sự yếu kém năng lực và quan
    điểm của 'tôi' rằng những người lính thực thụ phải được trui rèn qua thời gian
    và huấn luyện, rồi sau đó là qua máu và lửa."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa luận điểm đanh thép của 'Zettour' ('Ý chí chiến đấu bắt nguồn
    trực tiếp từ chiến thắng trên chiến trường'), nhận định 'bất khả thi' đối với
    một người mà binh lính dưới quyền chưa từng biết thất bại như 'cô', và hệ quả
    biến cả những người lính ưu tú nhất thành 'những con chó vô dụng' khi phải đánh
    một cuộc chiến cầm chắc phần thua."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa lời thú nhận chưa theo kịp ý cấp trên của Tanya ('Tôi' - 'ngài')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa lời bảo 'Cô cứ tự mình nhìn xem' và nhận định 'Tâm lý bi quan
    về chiến thắng của chúng ta đang âm thầm ám ảnh mặt trận phía đông, ngay cả ở
    những cấp chỉ huy cao hơn'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000092
  kind: terminology_and_voice
  value: locks=["Khóa nhận xét thẳng thừng của Tanya ('Theo quan điểm của tôi, những
    kẻ có trí tuệ tầm thường tất yếu sẽ suy nghĩ như vậy')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá', cặp đại từ 'Tôi' - 'cô', lời khen nhãn
    quan về 'chiến tranh tổng lực' không ai sánh kịp, và phân tích việc cô lấy bản
    thân làm thước đo khách quan cũng như đặt trải nghiệm của chính mình lên trên
    người khác dù vẫn còn là một đứa trẻ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm mở đầu về trải nghiệm bên ngoài chiến trường,
    điểm nhìn của 'Zettour' ('ông' - 'cô'), sự tự liên hệ bản thân dành phần lớn cuộc
    đời trong quân ngũ và suy đoán sự từng trải khôn ngoan có được là nhờ tuổi tác."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa sự phân biệt đại từ rõ ràng giữa Zettour ('ông') và 'Rudersdorf'
    ('gã ngốc Rudersdorf', 'Ông ta'), phủ định 'sự khôn ngoan chẳng phải là vấn đề
    tuổi tác' và câu tự hỏi cuối đoạn về mức độ gian truân đã nếm trải."]
