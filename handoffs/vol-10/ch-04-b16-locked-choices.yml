source_sha256: 227b8883d5a8e3130cfe2f54b05e0c3323cf2f3e1c41a6f4c12d99b6452c8f96
source_package_sha256: 6bdca139ebc954cd2ef87f1ead386d7be1bbc1ca4c83f259c7df5722d9bc85fc
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 37
segment_id_start: YS-LN10/Text/chapter022.xhtml/p000324
segment_id_end: YS-LN10/Text/chapter022.xhtml/p000360
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000324
  kind: terminology_and_voice
  value: locks=["Khóa lời chào báo cáo của Tanya với đại từ tự xưng 'Tôi' và danh
    xưng kính trọng 'thưa Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000325
  kind: terminology_and_voice
  value: locks=["Khóa cách Tướng Romel gọi Tanya là 'cô' và quân hàm 'Trung tá' (dịch
    chuẩn theo cấp bậc Lieutenant Colonel của Tanya), cùng câu hỏi về 'Kế hoạch B'
    từ 'Văn phòng Bộ Tổng tham mưu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000326
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật từ góc nhìn của Tanya quy chiếu 'Tướng Romel' bằng
    'Ông ta', cấu trúc phủ định 'Chẳng buồn nói lấy một lời cảm ơn' và thuật ngữ 'chính
    quốc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000327
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'Tôi' - 'ngài', phủ định 'không thu được thông tin
    gì đáng để ngài bận tâm cả' và tình thái 'Có vẻ như'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000328
  kind: terminology_and_voice
  value: locks=["Khóa hai câu hỏi của Tướng Romel về 'Kế hoạch B' như 'phương án dự
    phòng' và các kế hoạch khác đang triển khai."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000329
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự sự ngôi thứ nhất 'Mình' (theo DEC-P01-001), chức danh
    'Tham tán Conrad bên Bộ Ngoại giao', đại từ bao gộp 'chúng ta' và cụm 'đoàn ngoại
    giao'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000330
  kind: terminology_and_voice
  value: locks=["Khóa giả định trái thực tế trong quá khứ ('Đáng lẽ họ phải bắt tay
    vào làm việc từ ba năm trước rồi'), quy chiếu 'ông ta' và cụm 'chính sách khoanh
    tay đứng nhìn'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000331
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm có mức độ ('Về cơ bản thì vị tướng nói rất
    đúng') và tên cơ quan 'Bộ Ngoại giao'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000332
  kind: terminology_and_voice
  value: locks=["Khóa tự sự ngôi thứ nhất 'Mình', địa danh 'Norden' và chuỗi giả định
    quá khứ trái thực tế ('ngay cả từ ba năm trước thì cũng vẫn chưa đủ sớm đâu ạ',
    'Lẽ ra chúng ta phải...', 'Giá như làm được vậy, chúng ta đã có thể cắt giảm được
    một hai chữ số...')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000333
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận định mang tính thăm dò của Tướng Romel với đại từ 'cô'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000334
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Tanya với đại từ 'Tôi', phủ định 'không thích việc
    chê trách các bậc tiền bối' và nhận định về 'Đế quốc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000335
  kind: terminology_and_voice
  value: locks=["Khóa lập luận nội tâm đối lập giữa buổi ban đầu của 'Đế quốc' với
    thực trạng tách rời giữa 'Lục quân Đế quốc' và 'các nhà ngoại giao của Đế quốc',
    cùng câu hỏi tu từ có phủ định ('khi không chính thức thể chế hóa sự hợp tác giữa
    hai bên?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000336
  kind: terminology_and_voice
  value: locks=["Khóa câu tự đáp phủ định dứt khoát trong nội tâm ('Tất nhiên là không
    rồi.')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000337
  kind: terminology_and_voice
  value: locks=["Khóa nhận định khái quát về nguyên nhân sai lầm tính toán ('do không
    thể lường trước được sự bất tài của kẻ khác')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000338
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya với đại từ 'Tôi', phủ định nhấn mạnh ('có
    nằm mơ cả triệu năm cũng không ngờ được') và giả định ('Chắc hẳn họ sẽ cười thẳng
    vào mặt nếu ai đó nói với họ rằng binh lính ngoài chiến trường không hề phối hợp
    với những người vạch kế hoạch ở chính quốc')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000339
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc phủ định kép 'Cô nói không sai đâu, Trung tá' trong
    lời Tướng Romel và độc thoại nội tâm ngôi thứ nhất 'Mình' ('Mình rất muốn yêu
    cầu ông ta dừng lại nhưng tất nhiên là không thể...')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000340
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất 'mình' (theo DEC-P01-001) chịu
    đựng 'khói thuốc thụ động'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000341
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật mô tả hành động của 'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000342
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tướng Romel với đại từ bao gộp 'chúng ta' và tên
    'Đế quốc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000343
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi mục đích có phủ định ('Để chúng ta không làm hổ danh
    các bậc tiền bối sao ạ?') và lời tự trào khiêm nhường của Tanya ('tôi chỉ hy vọng
    đôi vai mình có thể góp sức gánh vác gánh nặng này')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000344
  kind: terminology_and_voice
  value: locks=["Khóa lời khích lệ của Tướng Romel ('Đừng lo, Trung tá. Hơn ai hết,
    cô chắc chắn sẽ gánh vác được thôi.')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000345
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngắn với đại từ 'Ông ta' chỉ Tướng Romel."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000346
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi đọc tên chiến dịch 'Chiến dịch Gõ cửa?'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000347
  kind: terminology_and_voice
  value: locks=["Khóa tự sự ngôi thứ nhất 'Mình', đúng phạm vi nhấn mạnh chữ nghiêng
    '*tối mật*' theo DEC-P01-002, phủ định 'Đây không phải lần đầu tiên' và giả định
    tiếc nuối ở câu cuối ('Có điều sẽ tuyệt hơn nếu mình có cơ hội đọc qua nó trước
    khi mọi chuyện đã đâu vào đấy cả rồi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000348
  kind: terminology_and_voice
  value: locks=["Khóa danh mục lực lượng hải quân gồm 'Hai tàu chiến-tuần dương, ba
    tàu tuần dương hạng nhẹ và ba tàu khu trục xung kích chở đầy lính thủy đánh bộ'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000349
  kind: terminology_and_voice
  value: locks=["Khóa tự sự ngôi thứ nhất 'mình' và câu hỏi nội tâm trực tiếp ở cuối
    đoạn ('Tại sao chúng ta lại cần đến tàu mặt nước?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000350
  kind: terminology_and_voice
  value: locks=["Khóa lời đề xuất lịch sự của Tanya ('Thưa ngài', 'tôi') về phương
    án phái 'lực lượng biệt kích xâm nhập từ tàu ngầm'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000351
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi lập luận giả định trong nội tâm về phương án dùng tàu
    ngầm áp sát 'bản thổ Khối Thịnh vượng chung' mà 'không bị phát hiện'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000352
  kind: terminology_and_voice
  value: locks=["Khóa tự sự ngôi thứ nhất 'mình' / 'cá nhân mình' và phản ứng của
    'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000353
  kind: terminology_and_voice
  value: locks=["Khóa lời giải thích của Tướng Romel và danh xưng 'Trung tá'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000354
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán nội tâm ngắn ('Ồ, ra là vậy.')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000355
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Tanya về việc đặt toan tính chính trị lên trên nhu
    cầu chiến thuật tối ưu và nhận định trung tính bám sát nguồn ('tôi nghĩ việc tấn
    công từ hướng biển vẫn được ưu tiên hơn')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000356
  kind: terminology_and_voice
  value: locks=["Khóa đúng phạm vi nhấn mạnh chữ nghiêng '*Chính xác*' theo DEC-P01-002
    và sự chuyển dịch điểm nhìn trần thuật ngôi thứ ba ('cấp trên của cô gật đầu')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000357
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ 'những bức tường gỗ đó của bọn chúng' và sự đối lập giữa
    tấn công 'từ trên mặt nước' với 'Những cuộc tập kích dưới mặt nước của chúng ta
    không đủ sức gieo rắc nỗi kinh hoàng vào tim bọn chúng'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000358
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm phủ định kép ('Vị tướng nói không sai.')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000359
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất 'mình', thuật ngữ 'hải đội xung
    kích tốc độ cao', phủ định ('chẳng làm thay đổi sự thật rằng...') và phép so sánh
    tốc độ tàu chiến với phương tiện bay."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000360
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm về hạn chế tốc độ khi 'tác chiến đổ bộ' ('nhổ
    neo khi cho binh lính đổ bộ', 'các con tàu sẽ phải đứng yên một chỗ')."]
