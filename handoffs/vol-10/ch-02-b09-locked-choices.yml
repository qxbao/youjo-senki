segment_id_end: YS-LN10/Text/chapter008.xhtml/p000289
choices:
- segment_id: YS-LN10/Text/chapter008.xhtml/p000248
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn của Zettour dành cho Tanya với đại từ 'Cô'; không
    dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000249
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('Tanya', 'cấp trên') và sắc
    thái khen ngợi chân thành."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000250
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya ca ngợi kế hoạch là 'nghệ thuật' và cách
    xưng hô kính trọng 'thưa Tướng quân'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000251
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn độc thoại nội tâm của Tanya, phủ định tuyệt đối ('Chẳng
    một ai khác...'), thuật ngữ 'Lục quân Đế quốc' và danh xưng 'ngài cục phó'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000252
  kind: terminology_and_voice
  value: locks=['Khóa nhận định nội tâm của Tanya về nguyên tắc đãi ngộ tương xứng
    cho tài năng và công sức lao động.']
- segment_id: YS-LN10/Text/chapter008.xhtml/p000253
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ thoại của Zettour ('Tôi' - 'cô') và cách gọi cấp
    bậc 'Trung tá'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000254
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'Tôi' của Tanya trong thoại, phủ định về năng
    khiếu thẩm mỹ ('chẳng mấy tự tin'), phép đối lập giữa 'vận động tay chân' với
    'múa cọ vẽ', và sự tán thưởng bố cục được dàn dựng công phu."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000255
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'sĩ quan cao cấp', hình ảnh ẩn dụ hài hước ('dùng
    cái đầu... ngoài làm giá treo mũ'), tên gọi 'Tanya' và quân hàm 'Trung tướng Zettour'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000256
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001, đối lập
    hai cách định danh ('vấn đề ngữ nghĩa'), và mong muốn giữ quan hệ tốt với Zettour
    ngay cả khi chuyển nghề."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000257
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Tanya với đại từ 'Ngài', cách gọi 'thưa Tướng quân'
    và thuật ngữ 'mũi lồi'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000258
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi vặn lại của Zettour với đại từ 'cô' và cấp bậc 'Trung
    tá'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000259
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('ông', 'Tanya') và thái độ
    trả lời không do dự."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000260
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Mũi lồi' và nhấn mạnh Markdown theo DEC-P01-002 tại
    '*đắc địa*'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000261
  kind: terminology_and_voice
  value: locks=["Khóa chỉ dẫn nhìn vào bản đồ của Zettour, đại từ 'chúng ta'/'ta'
    và chi tiết lỗ hổng trên phòng tuyến nơi không đủ binh lực chống trả quân địch."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000262
  kind: terminology_and_voice
  value: locks=["Khóa lập luận của Tanya phân biệt vẻ hợp lý bề ngoài của 'mũi lồi'
    với tính chất 'được tạo dựng có chủ đích', đại từ 'Tôi'/'tôi' - 'ngài', cách gọi
    'thưa Tướng quân' và ẩn dụ 'đi săn' / 'cái bẫy'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000263
  kind: terminology_and_voice
  value: locks=["Khóa lời khen ngắn của Zettour và cách gọi 'Trung tá'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000264
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('Tanya', 'cô') và nhận xét
    về khoảnh khắc hiếm hoi Tanya cư xử đúng với lứa tuổi."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000265
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận lại của Tanya với đại từ 'tôi' và cách gọi
    'thưa Tướng quân'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000266
  kind: terminology_and_voice
  value: locks=["Khóa lời xác nhận của Zettour ('tôi') về việc nhử quân địch vào bẫy
    và công sức đã bỏ ra."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000267
  kind: terminology_and_voice
  value: locks=["Khóa lời tán dương của Tanya về việc vừa nhử địch vừa rút lui có
    tổ chức kỹ lưỡng và cách gọi 'thưa Tướng quân'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000268
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Zettour', thuật ngữ 'đạo quân dã chiến', mục
    tiêu nhường đất nhử địch để tiêu diệt hoàn toàn và giả định tương lai ('Nếu kế
    hoạch này thành công...')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000269
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' theo DEC-P01-001 và đại từ
    'ông ấy' chỉ Zettour."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000270
  kind: terminology_and_voice
  value: locks=["Khóa lời nhắc thận trọng của Zettour với cách gọi 'Trung tá' và ý
    kế hoạch chỉ là nét vẽ trên giấy cho đến khi thực hiện thành công."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000271
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi phản biện lịch sự của Tanya với 'thưa Tướng quân' và
    đại từ 'ngài'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000272
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'đế quốc Russy', ẩn dụ 'múa ba lê' / 'khiêu vũ' và cách
    Zettour tự ví mình là 'bộ xương già này'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000273
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm mở đầu và sự chuyển tiếp sang đại từ nội tâm
    'Mình' theo DEC-P01-001 cùng mức độ tình thái ('không thể bác bỏ hoàn toàn...
    nhưng xem chừng điều ấy rất khó xảy ra')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000274
  kind: terminology_and_voice
  value: locks=['Khóa ý bổ sung trong độc thoại nội tâm về việc luôn tồn tại một xác
    suất nhất định.']
- segment_id: YS-LN10/Text/chapter008.xhtml/p000275
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi kiểm tra của Zettour với đại từ 'cô', 'chúng' (quân
    địch) và cấp bậc 'Trung tá'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000276
  kind: terminology_and_voice
  value: locks=["Khóa lời xin thêm thời gian suy nghĩ của Tanya với đại từ 'tôi' và
    'thưa Tướng quân'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000277
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Các sĩ quan tham mưu' và chuỗi ba hành động đấu trí,
    tính kế, cơ động trên cơ kẻ địch."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000278
  kind: terminology_and_voice
  value: locks=['Khóa câu trần thuật ngắn mô tả cử chỉ lắc đầu của Tanya.']
- segment_id: YS-LN10/Text/chapter008.xhtml/p000279
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và phủ định tuyệt đối
    ('chẳng có lấy một manh mối nào về câu trả lời đúng')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000280
  kind: terminology_and_voice
  value: locks=["Khóa lời giục hết giờ của Zettour với cấp bậc 'Trung tá' và cặp đại
    từ 'Tôi' - 'cô'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000281
  kind: terminology_and_voice
  value: locks=["Khóa lựa chọn 'phương án quyết liệt' của Tanya, đại từ 'tôi' - 'chúng
    ta'/'ta' - 'chúng', thuật ngữ 'chiến dịch cánh cửa xoay', 'mặt trận Rhine' và
    mục tiêu 'bao vây chúng'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000282
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Zettour về cách thức thực hiện với đại từ 'Cô'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000283
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('Tanya', 'Trung tướng Zettour',
    'của ông')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000284
  kind: terminology_and_voice
  value: 'locks=["Khóa các thuật ngữ chiến thuật trong câu trả lời của Tanya: ''đòn
    hợp điểm gọng kìm'', ''phần gốc của mũi lồi'', ''cách tiếp cận chuẩn sách giáo
    khoa'', ''khép chặt vòng vây'' và ''ưu thế cục bộ''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000285
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn trần thuật sang góc nhìn của Zettour
    ('Zettour', 'cô') và phép so sánh niềm vui của người thợ săn khi ngắm bắn con
    hươu đực lớn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000286
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của Zettour ('Ông' - 'cô'), danh xưng 'vị trung tá
    pháp sư', 'sĩ quan cao cấp' và niềm đắc ý khi đánh lừa được người hiểu rõ lối
    hoạch định của mình."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000287
  kind: terminology_and_voice
  value: locks=["Khóa giả định quá khứ ('Tôi hẳn đã chấm...'), nhấn mạnh Markdown
    theo DEC-P01-002 tại '*đúng*', và thuật ngữ 'trường đại học quân sự'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000288
  kind: terminology_and_voice
  value: locks=["Khóa câu thốt ngắn ngỡ ngàng nhưng vẫn giữ lễ tiết cấp dưới của Tanya
    ('Sao cơ ạ?')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000289
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật từ phía Zettour ('ông' - 'cô'), thuật ngữ
    'Đòn phục kích chiến lược', tên 'Degurechaff', cụm 'một trong những trung tá pháp
    sư vĩ đại nhất lịch sử' và cảm giác thỏa mãn khép lại phân cảnh."]
