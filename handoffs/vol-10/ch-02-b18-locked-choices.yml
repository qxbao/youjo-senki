segment_id_end: YS-LN10/Text/chapter010.xhtml/p000297
choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000261
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'Mình' và số nhiều 'chúng ta' của
    Tanya theo DEC-P01-001, cách gọi trung tính 'tên pháp sư đi lẻ này' và lập luận
    bác bỏ lối đánh cá nhân kiểu Thời kỳ Đồ đá; không dùng nhấn mạnh Markdown cho
    thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000262
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi' / 'chúng ta', thuật ngữ 'tín hiệu ma lực',
    cách gọi trung tính 'kẻ đó' (không suy diễn giới tính mục tiêu từ xa theo DEC-P01-001)
    và bước chuyển ý suy tính rằng sự hiện diện của đối thủ khó nhằn này biết đâu
    lại có lợi."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000263
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Viên sĩ quan phụ tá của mình' và đại từ nội tâm 'mình'
    theo DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000264
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lặp lại 'Một đối thủ khó nhằn ư…?' và lời đáp hiểu ý
    có tiểu từ lễ phép 'ạ' của Serebryakov."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000265
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'Kẻ làm lá chắn', 'các mục tiêu mềm', 'lý thuyết
    vai trò', đại từ 'chúng' / 'chúng ta' và nhận định đối phương tự phá vỡ đội hình
    dù nắm ưu thế tuyệt đối về quân số."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000266
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cô' và hô hiệu '02' trong câu hỏi của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000267
  kind: terminology_and_voice
  value: locks=["Khóa mẫu báo cáo vô tuyến '02 gửi 01' và cách xưng hô 'Trung tá'
    — 'tôi ... ạ' của Serebryakov với Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000268
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi' — 'Cô' và hai câu hỏi liên tiếp mang sắc thái
    tự nhận mình là người đàng hoàng mẫu mực của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000269
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', các thuật ngữ 'thuật thức bắn tỉa quang học',
    'cuộc cận chiến quần vòng' và nhận định không có chỗ cho tâm lý tiêu cực nếu muốn
    chiến thắng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000270
  kind: terminology_and_voice
  value: locks=["Khóa nhận định giữ bình tĩnh, điềm đạm là phẩm chất cốt lõi của con
    người văn minh và mệnh đề phủ định khẳng định đối thủ của 'chúng ta' hiển nhiên
    không có phẩm chất đó."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000271
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' và lập luận về sự tự tin từ phong thái đĩnh
    đạc là cội nguồn sinh ra sự quyết đoán và lòng dũng cảm khi nghĩa vụ vẫy gọi."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000272
  kind: terminology_and_voice
  value: locks=["Khóa mệnh lệnh canh chuẩn thời điểm và đợi hiệu lệnh của 'tôi'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000273
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp xác nhận ngắn gọn 'Nghe rõ'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000274
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và hành động tận dụng
    tối đa ưu thế độ cao để chờ thời cơ hoàn hảo tập kích địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000275
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'đơn vị tình nguyện đa quốc gia', cụm in nghiêng bằng
    Markdown '*quân bài bất định*' theo DEC-P01-002 và định danh 'Hai pháp sư Đế quốc'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000276
  kind: terminology_and_voice
  value: locks=['Khóa lời cảnh báo khẩn cấp báo địch bắn loạt và có ba phát đạn đang
    bay tới.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000277
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Đồng đội cùng biên đội của Tanya', định danh 'Tanya',
    đại từ 'chúng ta' / 'chúng' và nhận định khen ngợi Visha nhận diện đòn tấn công
    trước khi thuật thức hoàn tất cũng như mỉa mai sai lầm của địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000278
  kind: terminology_and_voice
  value: locks=["Khóa lời quát 'Lũ ngu xuẩn!' và đại từ 'chúng ta' trong câu thoại
    của Tanya; không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000279
  kind: terminology_and_voice
  value: locks=['Khóa nhận định chiến thuật rằng đồng loạt khai hỏa khiến khả năng
    di chuyển bị hạn chế, nhất là với những pháp sư ít được huấn luyện.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000280
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng' và khẳng định kẻ địch sẽ phải trả giá cho sự
    ngu xuẩn của mình."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000281
  kind: terminology_and_voice
  value: locks=['Khóa mệnh lệnh phát động tấn công ngắn gọn của Tanya.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000282
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 và hành động nhếch mép
    cười bắt đầu bổ nhào."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000283
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta' / 'chúng', các thuật ngữ 'màn chắn bảo hộ',
    'hai viên đạn thịt', 'đơn vị đa quốc gia' và hành động chuyển hóa độ cao thành
    tốc độ bổ nhào xuống mục tiêu."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000284
  kind: terminology_and_voice
  value: locks=["Khóa thế tương phản giữa đám pháp sư bên dưới chỉ có thể tập trung
    duy trì độ cao với 'hai pháp sư' trút xuống đầu họ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000285
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ', cụm 'hai con quái vật của Đế quốc' và thuật ngữ
    'vận tốc cực hạn'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000286
  kind: terminology_and_voice
  value: locks=["Khóa bước chuyển điểm nhìn sang 'Trung tá Drake', đại từ 'anh', thuật
    ngữ 'sĩ quan pháp sư hải quân đánh bộ' và nhận định về khoảng cách chênh lệch
    công nghệ lẫn kỹ năng chuyên môn cùng những rắc rối chính trị kỳ quặc ở nước ngoài."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000287
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', thuật ngữ 'ưu thế quân số' và quy luật đi săn
    rằng bên nào nắm giữ ưu thế quân số và không phung phí nó thì gần như luôn thắng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000288
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'ưu thế về quân số' và sự đảo ngược vị thế từ kẻ đi
    săn thành con mồi bị săn đuổi."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000289
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'đơn vị tình nguyện đa quốc gia', đại từ 'anh' và
    nguyên nhân bất đồng ngôn ngữ khiến việc di chuyển đồng bộ ngay lập tức gần như
    bất khả thi."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000290
  kind: terminology_and_voice
  value: locks=["Khóa hai danh xưng 'Đại tá Mikel' và 'Trung tá Drake', thuật ngữ
    'hai hệ thống chỉ huy' và nhận định về nỗi bất an thường trực cố hữu khi tồn tại
    hai đầu mối chỉ huy có nguy cơ xung đột; không dùng nhấn mạnh Markdown cho thẻ
    neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000291
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake' và cảnh các đơn vị của anh đồng loạt khai
    hỏa với đường ngắm thảm hại."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000292
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ta' / 'chúng ta' và 'chúng' trong lời than chửi thề
    về độ cơ động vượt quá sức đối phó của quân địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000293
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' và hành động tự kìm lời nhận xét về khả năng phối
    hợp vượt trội của đối phương."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000294
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'đồng đội cùng biên đội', định danh 'Drake' và sự
    kinh ngạc trước trình độ kỹ thuật điêu luyện của hai pháp sư đối phương."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000295
  kind: terminology_and_voice
  value: locks=['Khóa nhận định cảm thán về khả năng nhận thức tình huống, không gian
    vô song và sự phối hợp gần như siêu phàm của đối phương.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000296
  kind: terminology_and_voice
  value: locks=['Khóa câu thoại bỏ lửng kinh ngạc trước độ cao và tốc độ của địch.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000297
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', thuật ngữ 'Pháp sư Định danh', danh xưng
    'Trung úy Sue', thuật ngữ 'hỏa lực yểm trợ' và nhận định loạt bắn hỗ trợ của đơn
    vị anh không đủ để bắn trúng kẻ địch."]
