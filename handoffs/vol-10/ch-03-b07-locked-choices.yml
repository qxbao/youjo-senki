choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000092
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Làm gì có viết*' theo đúng DEC-P01-002
    (đáp lại câu hỏi về sách giáo khoa ở p000091) và đại từ nội tâm 'mình'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Những công ty độc hại', 'đổi mới sáng tạo', mệnh đề phủ
    định 'không phải thứ được sinh ra từ việc bắt nhân viên hô hào những khẩu hiệu
    ngu xuẩn', và yêu cầu phát huy tối đa tự do cùng sức sáng tạo."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa nhận định phủ định 'môi trường làm việc tồi tệ nhìn chung chẳng
    mấy thuận lợi để nuôi dưỡng một bầu không khí giúp sức sáng tạo thăng hoa'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'pháo thủ phòng không', 'máy bay ném bom', đại từ
    'chúng ta', và phủ định 'không phải thứ chúng ta có thể tiếp cận ngay lúc này'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown ba chữ '*Điều này đúng*' theo DEC-P01-002
    (khớp với cụm 'ba chữ ấy' ngay sau đó) và đại từ tự quy chiếu ngôi thứ ba 'cô'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn từ ngôi thứ nhất ('Mình') sang tự quy
    chiếu ngôi thứ ba ('Tanya', 'cô') theo DEC-P01-001, danh xưng 'vị tướng' / 'Tướng
    Romel', đại từ 'ông ta', và cụm 'đơn vị tiên phong lĩnh trọng trách tấn công thủ
    đô địch'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và cụm 'đưa ra một đề xuất mới'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'tôi' / 'chúng tôi' / 'chúng ta' (kèm 'ạ'), thuật
    ngữ 'tiểu đoàn pháp sư trên không', và hình ảnh so sánh số giờ bay khiến quân
    địch 'chẳng khác nào lũ chim non mới nở'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', thuật ngữ 'Các pháp sư trên không', và
    'đánh chặn máy bay ném bom tầm cao'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', cụm 'kế hoạch chủ động tiến
    công đầy tính cạnh tranh', và chi tiết 'nét mặt cấp trên của mình chẳng hề suy
    suyển'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Degurechaff' và ẩn dụ 'một liều thuốc giảm
    đau, cùng lắm cũng chỉ là biện pháp giảm nhẹ tạm thời'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' (kèm 'ạ') và lập luận 'Làm dịu cơn đau sẽ
    giúp chúng ta câu thêm thời gian cần thiết'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô' / 'chúng ta', nhận xét về thói quen 'chần chừ trì
    hoãn' khi phòng ngự, và kết luận 'Đằng nào chúng ta cũng sẽ diệt vong' nếu không
    có con đường dẫn tới chiến thắng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình', danh xưng 'vị tướng', tên riêng 'Nobunaga',
    'Gia tộc Oda', và 'hai gia tộc Asai và Asakura'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000106
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'lối phòng ngự tích cực tiến công', 'học thuyết tác
    chiến trên tuyến trong', đại từ nội tâm 'mình', nhấn mạnh Markdown '*ban quản
    lý*' theo đúng DEC-P01-002, và cụm 'những nhân sự làm việc ngoài thực địa'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và ý 'nỗi hoài nghi trong lòng... vẫn
    cứ lớn dần lên'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' và câu hỏi xác nhận 'cần phải hành động thì
    mọi chuyện mới thay đổi được sao ạ?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', cặp đại từ 'Ta' - 'cô' / 'chúng ta', và mệnh
    đề điều kiện phủ định 'Nếu chúng ta không hành động ngay bây giờ, việc đó sẽ chỉ
    kéo dài cái chết tất yếu của chúng ta mà thôi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' và nhận định 'khả năng thành công vẫn rất đáng
    lo ngại'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Nobunaga', 'Tướng Romel', và câu tự đáp phủ định
    'Câu trả lời là chẳng có lấy một cái nào cả!'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Đế quốc', 'gia tộc Oda', 'nước Nhật', và luận điểm
    chỉ ra điểm tương đồng duy nhất là bị bao vây trong khi gia tộc Oda còn có mạng
    lưới quan hệ sẵn lòng giúp đỡ ở phía sau vòng vây."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' / 'Mình', tên riêng 'Đế quốc', và chuỗi phủ
    định dứt khoát 'Không hề. Chẳng có lấy một mống.'"]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và cụm 'kết luận của bản thân'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa so sánh 'Còn vô giá trị hơn cả làm thêm giờ không lương', tên
    riêng 'Đế quốc', đại từ nội tâm 'mình', và mục tiêu 'tự bảo toàn bản thân'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ 'chuyển nghề', 'đi săn việc làm', và kết câu 'Một bảng
    thành tích sáng chói.'"]
