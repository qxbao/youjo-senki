choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật mở đầu với đại từ 'ông ta' quy chiếu Tham tán
    Conrad và quan hệ nhân quả ('Chính những lời này cuối cùng đã châm ngòi cho cơn
    bùng phát của ông ta')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại tự giễu của Tham tán Conrad với đại từ bao gộp 'chúng
    ta' - 'mình' và giọng cảm thán cuồng loạn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba với tên riêng 'Lergen và Tanya', đại
    từ 'ông ta' chỉ vị tham tán và sự chuyển biến sắc thái tiếng cười từ khinh miệt
    sang cuồng loạn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000059
  kind: terminology_and_voice
  value: locks=['Khóa câu nhận xét ngắn về cảnh tượng kỳ lạ trước mắt.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*bên ngoài*', điểm
    nhìn độc thoại nội tâm với đại từ tự quy chiếu 'mình' theo DEC-P01-001, thuật
    ngữ 'tiền tuyến' và nhận định nguyên nhân suy sụp do quá tải căng thẳng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000061
  kind: terminology_and_voice
  value: locks=['Khóa nhận định nội tâm về việc chứng kiến một người đánh mất vẻ điềm
    tĩnh và bộc lộ những cảm xúc tăm tối dồn nén.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, danh xưng 'vị tham tán'
    / 'Tham tán Conrad' và nhận định sự phi lý của chiến tranh đã bào mòn lý trí của
    ông ta."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định trái thực tế ('May thay, đây không phải là
    chiến hào và vị tham tán cũng chẳng có vũ khí, bằng không thì Tanya đã bắn gục
    ông ta ngay tại chỗ rồi…'), điểm nhìn pha trộn với tên 'Tanya' và mong muốn không
    phải khống chế ông ta."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật gián tiếp tự do với tên 'Tanya' ('cô'),
    các thuật ngữ 'người lính Đế quốc', 'Bộ Ngoại giao', 'Trách nhiệm pháp lý', 'diễn
    tập tình huống', 'Đại tá Lergen', câu hỏi giả định lao ra cửa và phủ định kép
    ('Hoàn toàn không phải là chuyện không thể tính đến')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển đổi điểm nhìn từ trần thuật ngôi thứ ba ('Cô') sang
    độc thoại nội tâm trực tiếp ('mình' theo DEC-P01-001) rồi quay lại ngôi thứ ba
    ('Tanya' - 'cô'), cùng danh xưng 'Đại tá Lergen', 'vị tham tán' và thuật ngữ 'hình
    nhân quang học'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000066
  kind: terminology_and_voice
  value: locks=['Khóa câu kết luận rằng chuỗi tính toán vừa rồi rốt cuộc trở thành
    công cốc.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật mô tả hành động của 'Tham tán Conrad' buông tiếng
    chửi thề, ngả lưng vào ghế, bắt chéo chân và mệt mỏi nhìn lên trần nhà."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với đại từ 'ông ta' và tên riêng 'Tanya và Lergen'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*thứ này*', danh xưng
    'Đại tá Lergen', 'Trung tá Degurechaff', 'Vị tham tán', cùng cách xưng hô 'tôi'
    - 'ông' / 'các ông' trong lời thoại."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*thứ này*', tên riêng
    'Tanya' ('cô'), 'Đại tá Lergen' ('Anh') và 'vị tham tán'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với đại từ 'Cô ấy' (chỉ Tanya), 'chúng
    tôi' (phía quân đội/Đế quốc), cấu trúc giả định quá khứ ('Nếu chúng tôi có thể
    sản xuất hàng loạt những người như Degurechaff, thì Đế quốc đã thổi bay cả Moskva
    lẫn Londinium khỏi bản đồ chỉ bằng một tiểu đoàn pháp sư trên không duy nhất từ
    đời nào rồi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi và suy nghĩ nội tâm của Tanya với đại từ tự quy chiếu
    'Mình' theo DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tham tán Conrad với xưng hô 'Tôi' - 'ông', phủ
    định ('khiến tôi chẳng mấy dễ chịu') và cụm 'những người dân sự như tôi'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với danh xưng 'Vị tham tán' và 'Đại tá Lergen'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với danh xưng 'thưa Tham tán Conrad', xưng
    hô 'tôi' - 'ông', cấp bậc 'thiếu úy' và cấu trúc câu hỏi lịch sự ('liệu tôi có
    sai không khi cho rằng...')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa giải thích bối cảnh về một năm nghĩa vụ quân sự tại 'Đế quốc'
    và câu giả định trái thực tế trong quá khứ về 'Tanya' ('Giá như Tanya không sinh
    ra là một đứa trẻ mồ côi, thì đó chính là con đường sự nghiệp mà cô đã kỳ vọng
    và mong muốn')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với danh xưng 'Đại tá Lergen' và chi tiết tiếng
    cười chua chát đáp lại."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tham tán Conrad với đại từ 'Tôi', cấp bậc 'thiếu
    úy trên danh nghĩa', phủ định ('chưa từng đặt chân tới mặt trận Rhine hay mặt
    trận phía đông') và chi tiết học nghi thức quân đội trong doanh trại."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa câu bình luận về 'thiếu úy chỉ trên danh nghĩa', đại từ 'ông
    ta' và hình ảnh 'nghi thức trưởng thành'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' và thuật ngữ 'Junker điển hình'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật về đối tượng mà 'Tanya' hằng ghen tị—người đã
    giải ngũ khi vẫn còn hòa bình."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại kết lô của Tham tán Conrad với xưng hô 'tôi' - 'các
    vị' (và đại từ phản thân 'mình'), cùng phủ định kép ('đủ khiêm tốn để không giả
    vờ rằng mình hiểu rõ những gì mình đang nói')."]
