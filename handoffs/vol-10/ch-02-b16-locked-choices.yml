choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000180
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake', đại từ 'anh' và mốc chuyển sang
    ngày hôm sau khi Drake chạm trán kẻ địch đúng như dự đoán."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000181
  kind: terminology_and_voice
  value: 'locks=["Khóa tiêu đề thời gian - địa điểm viết hoa toàn bộ: ''NGÀY 1 THÁNG
    8 NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, KHÔNG PHẬN ĐƯỢC BẢO VỆ CỦA NƠI ĐỒN
    TRÚ ĐƠN VỊ ĐA QUỐC GIA''."]'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000182
  kind: terminology_and_voice
  value: locks=["Khóa lời báo cáo nhận diện mục tiêu lạ trên không, sắc thái kinh
    ngạc xác nhận đúng như báo cáo và biệt danh 'Ác quỷ sông Rhine'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000183
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake' và chi tiết một người lính được cắt cử giám
    sát không phận lên tiếng báo cáo đầy kinh ngạc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000184
  kind: terminology_and_voice
  value: locks=["Khóa tên 'Quân đội Liên bang', danh xưng 'Trung tướng Zettour' và
    nhận định Zettour có xu hướng tung cô học trò nhỏ ra vào thời khắc then chốt nhất;
    không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000185
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'đệ tử ruột của ông ta', biệt danh 'Ác quỷ sông Rhine' và
    tình thái nhận định 'Xem ra... cuối cùng đã chịu lộ diện'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000186
  kind: terminology_and_voice
  value: locks=["Khóa tình thái suy đoán 'hẳn là', các thuật ngữ 'tuyến tiếp vận ở
    vùng mũi lồi', 'Đế quốc', 'Trung tướng Zettour', 'đòn tập kích bất ngờ', đại từ
    'anh' (chỉ Drake) và thế lưỡng lự bỏ lửng ở cuối câu."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000187
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cậu' (Drake hỏi người lính cấp dưới) và hai câu hỏi
    dồn dập xác nhận độ chắc chắn cùng quân số địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000188
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Một tổ hai người', tiểu từ lễ phép 'ạ' của cấp dưới
    và câu hỏi phỏng đoán mục đích trinh sát."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000189
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ta' / 'chúng', điều kiện 'nếu tập tài liệu này chính
    xác', cặp khả năng 'hoặc tiến hành trinh sát chiến đấu, hoặc tìm cách hạ sát một
    sĩ quan chỉ huy' và quyết tâm không để địch dễ dàng đạt ý đồ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000190
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake' / 'Trung tá Drake', đại từ 'anh', nhận định
    đã nhìn thấu kế hoạch địch và sự tự tin hiếm hoi vào cơ hội chiến thắng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000191
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ta', tên 'Quân đội Liên bang' và lời ghi nhận bản phân
    tích sắc sảo của họ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000192
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'đòn nghi binh', 'toán trinh sát' và nhận định bình
    thường họ sẽ chẳng bao giờ bận tâm tới một cặp pháp sư như vậy."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000193
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'tổ trinh sát thông thường' và mệnh đề phủ định khẳng định
    lần này trò giả dạng của hai tên pháp sư sẽ không có tác dụng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000194
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Bọn ta - các người' trong lời độc thoại thách thức
    kẻ địch của Drake."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000195
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Vùng mũi lồi' và danh xưng 'Trung tướng Zettour'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000196
  kind: terminology_and_voice
  value: locks=["Khóa địa danh 'mặt trận Rhine', định danh 'Drake', tên cơ quan 'Văn
    phòng Bộ Tổng tham mưu Đế quốc' và nhận xét về cơn nghiện bao vây kẻ địch của
    Zettour cũng như giới sĩ quan tham mưu Đế quốc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000197
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' (chỉ Drake), thuật ngữ 'các tuyến tiếp vận' và
    quy luật mở màn tấn công nhắm vào điểm yếu và tuyến tiếp vận của địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000198
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake' và bước chuyển tương phản sang người lính
    dày dạn trận mạc đứng cạnh không có chung sự lạc quan ấy; không dùng nhấn mạnh
    Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000199
  kind: terminology_and_voice
  value: locks=['Khóa lời nhận xét dè dặt rằng có điều gì đó không ổn trong toàn bộ
    chuyện này.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000200
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' (Drake gọi Mikel) và danh xưng 'Đại tá Mikel'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000201
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Mikel', 'Drake' và cấu trúc phủ định kép ('sẽ không
    đời nào thẳng thắn nói ra nỗi băn khoăn... nếu không có lý do chính đáng')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000202
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'anh' và chi tiết đáp lại câu hỏi
    của Drake chỉ là ánh mắt đầy vẻ nghi hoặc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000203
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' (Mikel gọi Drake) và câu hỏi nghi vấn về điểm kỳ
    lạ ở hai kẻ địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000204
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm in nghiêng bằng Markdown '*Có điểm gì đó kỳ
    lạ ư?*' theo đúng DEC-P01-002 và câu trần thuật tiếp nối không in nghiêng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000205
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'biên đội hai người', 'quy trình tiêu chuẩn cho một
    nhiệm vụ trinh sát' và nhận định phủ định rằng việc khảo sát chiến trường vốn
    không có gì khác thường."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000206
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'anh' và sự tương phản giữa nỗi ngạc
    nhiên vì đoán trúng sự xuất hiện của địch với vẻ bình thường của mọi thứ còn lại."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000207
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' / 'chúng ta', thuật ngữ 'Pháp sư Định danh', phủ
    định kép ('không nhận thấy điểm gì bất thường... Nói vậy không có nghĩa là tôi
    xem nhẹ chúng đâu') và quyết tâm dốc toàn lực tấn công."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000208
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'tôi - anh' (Mikel nói với Drake) và linh cảm bất
    an không sao gạt bỏ được về sự xuất hiện của địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000209
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake' và tình huống cấp dưới lên tiếng kéo sự chú
    ý của Drake quay lại phía cặp đôi quân địch trước khi anh kịp hỏi rõ ý của Mikel."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000210
  kind: terminology_and_voice
  value: locks=["Khóa thông số độ cao 'tám nghìn' và lời cảnh báo tốc độ di chuyển
    nhanh của địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000211
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', tên 'Lục quân Đế quốc' và miêu tả tốc độ
    vọt lên cao kinh hoàng của hai mục tiêu cùng công nghệ tối tân khiến Drake quặn
    dạ dày."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000212
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'ưu thế trên không' và cảm xúc tức giận trước ý đồ
    tận dụng triệt để ưu thế độ cao của địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000213
  kind: terminology_and_voice
  value: locks=['Khóa lời thoại của Drake nhận định việc trinh sát chỉ là vỏ bọc không
    phải tin mới nhưng tốc độ ra tay của địch rất nhanh.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000214
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', hai mốc độ cao đối lập 'tám nghìn' và 'sáu nghìn',
    cùng cơn phẫn nộ của Drake trước ý đồ của địch; không dùng nhấn mạnh Markdown
    cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000215
  kind: terminology_and_voice
  value: locks=['Khóa câu phủ định khẳng định lần này kế hoạch của địch sẽ không thành
    công.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000216
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'đơn vị đa quốc gia', 'trần bay tám nghìn', 'thuật
    thức bay', 'các pháp sư Đế quốc', đại từ 'Anh' và chi tiết rèn luyện phổi ở độ
    cao đó kết hợp đánh giá lại thuật thức bay."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000217
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' / 'Chúng ta' trong lời Drake tuyên bố xuất kích
    trước."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000218
  kind: terminology_and_voice
  value: locks=['Khóa lời chúc may mắn ngắn gọn của Mikel.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000219
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake' và hành động cảm ơn người bạn rồi lao đi tập
    hợp đội quân tình nguyện."]
