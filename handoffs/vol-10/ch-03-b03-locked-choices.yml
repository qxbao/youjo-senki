source_sha256: 227b8883d5a8e3130cfe2f54b05e0c3323cf2f3e1c41a6f4c12d99b6452c8f96
source_package_sha256: c6c2b192675556dbec75083f38b5eaf320c6ed4640291b42ef748d4fef741d6f
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 33
segment_id_start: YS-LN10/Text/chapter016.xhtml/p000050
segment_id_end: YS-LN10/Text/chapter016.xhtml/p000082
choices:
- segment_id: YS-LN10/Text/chapter016.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa lối tự quy chiếu kết hợp ngôi thứ nhất 'Mình' và ngôi thứ ba
    'Tanya', các chức danh 'viên sĩ quan trực ban' — 'sĩ quan phụ tá của Tướng Romel',
    và cụm 'lệnh triệu tập từ vị tướng'; không dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'bức điện tín', 'sở chỉ huy cơ động', và cặp đại từ
    ngôi thứ ba 'ông ta' (Romel) — 'cô' (Tanya) nối tiếp câu cuối p000050."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn ngôi thứ nhất 'Mình', quy chiếu 'anh ta' cho viên
    sĩ quan phụ tá, và nội dung mệnh lệnh vẻn vẹn một từ '“Đến đây.”'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Chẳng có chỗ cho sự từ chối' và giọng độc thoại châm
    biếm ngắn gọn ('Lệnh của sếp mà. Thật ngạo mạn làm sao.')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' và thuật ngữ 'sở chỉ huy cơ động'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Mình' và sắc thái tự trào về việc đoán trúng những đòi
    hỏi vô lý."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn từ ngôi thứ ba ('Tanya', 'sếp cô')
    ở câu đầu sang ngôi thứ nhất ('Mình') ở câu ước muốn; không dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ tăng tiến mức độ đáng sợ khi 'ông ta' mở miệng nói."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000058
  kind: terminology_and_voice
  value: 'locks=["Khóa cặp xưng hô trong thoại của Romel với Tanya: xưng ''Ta'', gọi
    ''cô'' và ''Trung tá''."]'
- segment_id: YS-LN10/Text/chapter016.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Romel', đại từ 'Mình' và đánh giá mức độ kinh
    khủng của bản kế hoạch trải trước mắt."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'cuộc tiến công toàn diện', tên thế lực 'Khối Thịnh vượng
    chung', và hướng tiến công '—từ hướng biển'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' và tình thái phỏng đoán 'hẳn mình đang nhìn nhầm'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', phủ định tình thái 'không thể nào là thật được',
    giả định 'Hẳn đây phải là một trò đùa nào đó' và trạng thái hoài nghi."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'cô' và cấp bậc 'Trung tá' trong câu hỏi của Romel."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000064
  kind: terminology_and_voice
  value: 'locks=["Khóa lối tách ngôi trong độc thoại: dùng ''mình'' cho phản ứng tức
    thời và dùng tên riêng ''Tanya'' khi xét trên góc độ chuyên môn bác bỏ canh bạc
    này."]'
- segment_id: YS-LN10/Text/chapter016.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', thuật ngữ 'ưu thế trên không', và địa danh
    'khu công nghiệp ở Vùng Trũng François'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000066
  kind: terminology_and_voice
  value: locks=["Khóa đơn vị 'Cụm tập đoàn quân phía Tây', địa danh 'bản thổ Khối
    Thịnh vượng chung', 'căn cứ tác chiến', ba động từ phủ định cơ hội ('hủy diệt,
    chiếm đóng hay làm tê liệt Khối Thịnh vượng chung'), và danh xưng 'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa hai câu hỏi nội tâm liên tiếp của Tanya ('Ông ta muốn tiến lên
    hòn đảo của chúng sao? Từ chính diện ư?')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa hiệu ứng nói lắp 'K-Khối Thịnh vượng chung', cụm 'đòn tấn công
    toàn diện' và câu hỏi xác nhận lịch sự trong thoại của Tanya."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'căn cứ tác chiến' và từ khóa 'cơ bản' để liên kết
    trực tiếp với p000070."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*cơ bản*' theo DEC-P01-002, cách xưng hô
    'thưa Tướng quân', tên cơ quan 'Văn phòng Bộ Tổng tham mưu', địa danh 'mặt trận
    phía tây', và cấu trúc câu hỏi phủ định tu từ."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa lời xác nhận ngắn gọn của Romel ('“Đúng là vậy.”')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba 'Tanya lặng lẽ lắc đầu.'"]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*tái tổ chức lưới phòng không của nó*' theo
    DEC-P01-002, đại từ nội tâm 'Mình', danh xưng 'Tướng Romel', và thời gian của
    giả định trong quá khứ ('Mình đã đinh ninh rằng...')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm ngắn thể hiện sự bàng hoàng ('Vậy tất cả chuyện
    này là sao đây…?')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Being X' (theo P05-being-x), đại từ 'mình', và câu
    hỏi nghi vấn về 'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa lối tự quy chiếu song hành 'mình' và 'Tanya' ('Bất hạnh thay
    cho mình, Tướng Romel lại là cấp trên của Tanya...'), cùng đặc điểm chiến dịch
    luôn đặt nặng tính tiến công."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'cô' và 'Trung tá' trong lời khẳng định mệnh lệnh của
    Romel."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa sự phân tách giữa đại từ thoại ('tôi' - 'ngài', kèm 'ạ') và
    đại từ nội tâm ('Mình'), cùng thuật ngữ 'chiến lược phòng ngự' và lối nói mỉa
    mai xin gọi bác sĩ khám mắt."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'Ta' - 'cô' ('Trung tá'), phủ định 'Đôi mắt không
    đánh lừa cô đâu', và cụm 'chiến lược phòng ngự'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*phòng ngự*' theo DEC-P01-002 đặt cạnh cụm
    'cuộc tiến công toàn diện nhắm vào căn cứ địch'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình' và cụm 'ngôn ngữ Đế quốc'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', tên đơn vị 'Hạm đội Bản thổ', thuật ngữ 'bản
    thổ', và cấu trúc tăng tiến phủ định - khẳng định ở câu cuối ('Nó không những
    chẳng mang tính phòng ngự mà còn liều lĩnh hiếu chiến hết sức.')."]
