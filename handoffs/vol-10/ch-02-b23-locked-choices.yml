- segment_id: YS-LN10/Text/chapter010.xhtml/p000443
  kind: terminology_and_voice
  value: locked=Khóa câu hỏi tu từ phủ định mở đầu '“Chẳng phải lượng ma lực đó là
    quá nhiều để một người đơn lẻ sử dụng sao? Đồ quái vật khốn kiếp.”'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000444
  kind: terminology_and_voice
  value: locked=Khóa cấu trúc phủ định nguyên nhân kỹ thuật/công nghệ 'chẳng phải
    một kỹ thuật đặc biệt hay công nghệ tiên tiến nào đã làm nên điều này' và khẳng
    định 'Đơn giản chỉ là sức mạnh thuần túy của con lợn rừng kia mà thôi'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000445
  kind: terminology_and_voice
  value: locked=Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 song hành với lối tự quy
    chiếu ngôi thứ ba 'Tanya', thuật ngữ 'Type 95', cách gọi miệt thị 'con ngốc này'
    và câu hỏi tu từ cuối đoạn.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000446
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Con quái vật này', 'Being X', đại từ 'mình', thuật
    ngữ 'thuật thức' và cấu trúc tăng tiến 'vốn đã bất chấp mọi quy luật logic...
    thế mà lại còn thực sự đem thứ sức mạnh ấy trút vào một thuật thức cải biến cả
    thế giới theo đúng nghĩa đen'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000447
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Mình', thuật ngữ 'pháp sư trên không át chủ bài', 'chiến
    dịch Rhine', tên riêng 'Tanya' và định danh quân hàm 'Trung úy Serebryakov'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000448
  kind: terminology_and_voice
  value: locked=Khóa ẩn dụ 'người thầy vĩ đại nhất thế gian, dù học phí thường đắt
    đỏ vô cùng…' và đại từ khái quát 'bạn' trong mệnh đề điều kiện.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000449
  kind: terminology_and_voice
  value: locked=Khóa đại từ nội tâm 'mình'/'Mình' và khẳng định 'Mình có nhiều phương
    án lựa chọn.'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000450
  kind: terminology_and_voice
  value: locked=Khóa các thuật ngữ 'thuật thức tấn công tầm xa', 'chống tiếp cận khu
    vực', 'các đòn tấn công trực diện', 'đòn tập kích bất ngờ', 'bức xạ', đại từ 'mình'
    và giả định 'Nói thẳng ra, mình phải là một kẻ ngốc mới bị nó bắn trúng'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000451
  kind: terminology_and_voice
  value: locked=Khóa nhận định so sánh 'Có những lúc tốc độ cao lại là lớp phòng ngự
    tốt hơn cả giáp dày.'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000452
  kind: terminology_and_voice
  value: locked=Khóa mệnh đề điều kiện phủ định trong lời độc thoại '“Hừ, xem ra có
    bao nhiêu ma lực trên đời đi nữa mà không bắn trúng đích thì cũng vô giá trị thôi.”'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000453
  kind: terminology_and_voice
  value: locked=Khóa giả định quá khứ 'lẽ ra cũng đã có thể tung thêm một đòn tấn
    công nữa rồi', đại từ 'ả' chỉ pháp sư địch và 'chúng mình' chỉ Tanya cùng Visha.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000454
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng mình', 'mình', cụm 'đường rút lui' và câu chuyển
    mạch 'Nhưng rồi mình nhận ra một điều kỳ lạ.'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000455
  kind: terminology_and_voice
  value: locked=Khóa thán từ nghi vấn '“Hửm?”'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000456
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng mình', 'mình', 'chúng', thuật ngữ 'bức xạ tiền
    phát' và hai câu hỏi nội tâm liên tiếp ở cuối đoạn.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000457
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'mình' và các thuật ngữ 'đan dệt một thuật thức khổng
    lồ đến mức lố bịch', 'thuật thức phát nổ'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000458
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'bắn vào tọa độ định sẵn', đại từ tự xưng khẩu ngữ
    'bọn này' trong lời thoại cảm thán và quan hệ nhân quả 'Không bắn trúng được nên
    chúng định thổi tung bọn này thành từng mảnh luôn à?!'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000459
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'mình', thuật ngữ 'các pha cơ động né tránh', hành động
    'bổ nhào xuống với tốc độ cao' và định danh 'Trung úy Serebryakov'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000460
  kind: terminology_and_voice
  value: locked=Khóa hai câu ngắn chuyển cảnh 'Rất tốt. Và rồi chuyện đó xảy ra.'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000461
  kind: terminology_and_voice
  value: locked=Khóa đúng phạm vi nhấn mạnh Markdown '*vù*' theo DEC-P01-002, đại
    từ 'Mình'/'mình' và cụm 'những đợt sóng xung kích'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000462
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'tác chiến cơ động', 'thuật thức' và đại từ ngôi thứ
    hai 'Ngươi' khi Tanya lẩm bẩm chất vấn đối phương từ xa.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000463
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'mình', 'chúng mình', phủ định 'Tình hình chẳng thể nào
    tệ hơn được nữa' và hình ảnh 'nhấm nháp chiến thắng nho nhỏ của chúng mình'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000464
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Con quái vật này' và 'Being X'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000465
  kind: terminology_and_voice
  value: locked=Khóa mệnh đề suy luận điều kiện 'nếu con lợn rừng này giống hệt Being
    X, điều đó có nghĩa là ả cũng đần độn không kém'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000466
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Mình', 'chúng mình', 'ả', cấu trúc đối xứng phủ định
    'Mình sẽ không đánh giá thấp năng lực của ả, nhưng cũng sẽ chẳng đánh giá quá
    cao trí thông minh của ả đâu' và nhận định 'quá mức cuồng xả đạn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000467
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'mình', cụm 'kế hoạch tác chiến phối hợp' và định danh
    'tên pháp sư tình nguyện này'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000468
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ả', 'mình' và thuật ngữ 'các thuật thức phát nổ'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000469
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Mình'/'mình', 'chúng mình', các thuật ngữ 'tọa độ', 'đường
    bắn', 'sĩ quan phụ tá' và mục đích chiến thuật 'đưa đồng minh dưới mặt đất của
    tên pháp sư địch vào đúng đường bắn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000470
  kind: terminology_and_voice
  value: locked=Khóa đúng phạm vi nhấn mạnh Markdown '*ở phía sau*' theo DEC-P01-002,
    đại từ 'Mình'/'mình' và các thuật ngữ 'luồng bức xạ đặc trưng', 'pháp sư trên
    không'.
