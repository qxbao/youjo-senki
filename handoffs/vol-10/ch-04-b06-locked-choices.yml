choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000001
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'Tôi', 'chúng ta', thuật ngữ 'học thuyết tác chiến trên
    tuyến trong' và 'tiêu diệt từng bộ phận quân địch'; không có nhấn mạnh Markdown.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000002
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Tanya' và miêu tả hành động 'lắc đầu và buông một tiếng
    thở dài rõ rệt'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000003
  kind: terminology_and_voice
  value: locked=Giữ mục tiêu gốc 'tập hợp một đạo đại quân để giành thắng lợi nhanh
    chóng và hiệu quả trong một vài trận đánh quyết định được chọn lọc' và phủ định
    'chưa bao giờ được tạo ra để dùng cho việc chống lại cả thế giới'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000004
  kind: terminology_and_voice
  value: locked=Giữ hình ảnh ẩn dụ 'hợp đồng bảo hiểm phòng khi họ thất bại về mặt
    chiến lược', đại từ 'chúng ta', tên riêng 'Đế quốc' và nhấn mạnh Markdown '*bên
    ngoài*' theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000005
  kind: terminology_and_voice
  value: locked=Giữ thuật ngữ 'Chiến lược nội tuyến', đại từ 'chúng ta' và định nghĩa
    về bản chất của bảo hiểm ('bỏ tiền ra mua nhưng lại hy vọng sẽ không bao giờ phải
    dùng đến').
- segment_id: YS-LN10/Text/chapter022.xhtml/p000006
  kind: terminology_and_voice
  value: locked=Giữ hai câu hỏi tu từ liên tiếp, đại từ tự quy chiếu 'mình' theo DEC-P01-001
    và toàn bộ phạm vi nhấn mạnh Markdown '*Ồ, tốt hơn hết là mình nên bị ung thư
    để còn trục lợi từ bảo hiểm y tế của mình*' theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000007
  kind: terminology_and_voice
  value: locked=Giữ cấu trúc loại trừ ('Trừ phi là...') và nhận định phủ định tuyệt
    đối ('hoàn toàn vô lý').
- segment_id: YS-LN10/Text/chapter022.xhtml/p000008
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Đế quốc', đại từ 'Chúng ta', hình ảnh so sánh 'đánh
    mất nỗi sợ cái chết chính đáng chỉ vì có một gói bảo hiểm nhân thọ tuyệt vời'
    và cấu trúc tăng tiến 'Không những thế...'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000009
  kind: terminology_and_voice
  value: locked=Giữ lời thưa 'thưa Trung tá', danh xưng 'Tham tán Conrad', đại từ
    trần thuật 'ông ấy', đại từ đối thoại 'cô' - 'chúng ta' và hai câu chất vấn về
    việc sử dụng nguồn lực quốc gia.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000010
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'chúng ta', địa danh quân sự 'mặt trận Rhine' và sự đối
    lập giữa thắng các trận then chốt với việc không trận nào đủ mang tính quyết định
    để kết thúc chiến tranh.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000011
  kind: terminology_and_voice
  value: locked=Giữ tên 'Chiến dịch Cánh cửa xoay', 'Cộng hòa François', 'Đế quốc',
    đại từ độc thoại nội tâm 'Mình' theo DEC-P01-001 và dự báo về nguy cơ cạn tiền
    chi trả cho nhu cầu thiết yếu cơ bản.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000012
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'chúng ta' và các thuật ngữ quân sự 'thế áp đảo', 'sự tập
    trung binh lực', 'ưu thế cục bộ'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000013
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Tanya', đại từ trần thuật 'cô' và hành động 'đập mạnh
    bàn tay xuống chiếc bàn giữa họ khi cô tiếp tục vạch rõ sự thật khủng khiếp ấy'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000014
  kind: terminology_and_voice
  value: locked=Giữ nhấn mạnh Markdown '*nếu*' theo DEC-P01-002, tên riêng 'Ildoa',
    đại từ 'chúng ta' và nhận định 'vẫn có quá nhiều kẻ địch'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000015
  kind: terminology_and_voice
  value: locked=Giữ ẩn dụ 'sa lầy trong vũng bùn này quá lâu' và nhận định 'Việc cạn
    sạch thời gian chỉ còn là vấn đề sớm muộn mà thôi'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000016
  kind: terminology_and_voice
  value: locked=Giữ giả định trái thực tế ('Nếu Tanya là chủ nợ của Đế quốc, cô đã
    cắt nguồn vay của họ...'), sự chuyển dịch điểm nhìn từ trần thuật ngôi thứ ba
    ('Tanya', 'cô') sang nội tâm ngôi thứ nhất ('mình dám cá rằng...') và chi tiết
    'những kẻ đào tẩu trong những ngày sắp tới'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000017
  kind: terminology_and_voice
  value: locked=Giữ phép so sánh tương đồng giữa những yếu tố định đoạt số phận của
    một quốc gia và của một công ty.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000018
  kind: terminology_and_voice
  value: locked=Giữ câu nhận định cô đọng 'Thời gian và tiền bạc là tất cả.'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000019
  kind: terminology_and_voice
  value: locked=Giữ quan hệ điều kiện - hệ quả 'Nếu một trong hai thứ đó cạn kiệt,
    toàn bộ nỗ lực sẽ lập tức khựng lại hoàn toàn.'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000020
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'chúng ta', hình ảnh ẩn dụ 'lăn xuống dốc' và cảnh báo
    'sẽ chỉ tự chuốc thêm nhiều kẻ địch hơn cho mình'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000021
  kind: terminology_and_voice
  value: locked=Giữ nhận định về 'Những kẻ cơ hội' và điều kiện thời gian 'cho đến
    khi chúng chắc chắn thời cơ đã chín muồi'.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000022
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Ildoa', 'Đế quốc', thuật ngữ 'vật tư và trang bị quân
    sự' và danh mục hàng hóa ('nhiên liệu cùng các tài nguyên có nhu cầu cao khác...
    rượu vang hay hạt cà phê').
- segment_id: YS-LN10/Text/chapter022.xhtml/p000023
  kind: terminology_and_voice
  value: locked=Giữ tên riêng 'Đế quốc' và nhận định về sự mong manh của 'Mối quan
    hệ hữu hảo này' khi thất bại cận kề hiện rõ.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000024
  kind: terminology_and_voice
  value: locked=Giữ tên gọi 'người Ildoa', 'Đế quốc', nhấn mạnh Markdown '*do dự*'
    theo DEC-P01-002 và phép so sánh với việc công ty bị bán cho ban lãnh đạo mới.
- segment_id: YS-LN10/Text/chapter022.xhtml/p000025
  kind: terminology_and_voice
  value: locked=Giữ sự đối lập 'Thực tại mới sẽ hủy diệt thế giới cũ', tên riêng 'Đế
    quốc' và kết luận buộc phải chuẩn bị sẵn sàng cho mọi tình huống.
