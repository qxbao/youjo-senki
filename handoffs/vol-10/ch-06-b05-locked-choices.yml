choices:
- segment_id: YS-LN10/Text/chapter028.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Quân đội Liên bang', thuật ngữ 'quân tiếp viện',
    'hậu phương', 'tiền tuyến', 'phòng tuyến', đại từ 'ông' (Zettour) và thế tương
    phản giữa lượng lớn quân tiếp viện địch với tiền tuyến thiếu hụt binh lính trầm
    trọng của ông."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'phòng tuyến', đại từ 'ông' và chi tiết có bằng chứng
    cho thấy quân địch đang tăng cường lực lượng tại bất cứ nơi nào phòng tuyến của
    ông yếu nhất."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi độc thoại tự giễu của Zettour với định danh 'Đám Cộng
    sản', đại từ tự xưng 'ta' và cụm 'một lão già như ta'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000132
  kind: terminology_and_voice
  value: 'locks=["Khóa tên riêng ''Zettour'', đại từ ''ông'', ''họ'' (phía Đế quốc)
    và quan hệ nhượng bộ: dù thắng bao nhiêu trận đánh riêng lẻ cũng không có lấy
    một dấu hiệu nào cho thấy có thể thắng cả cuộc chiến."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm gián tiếp của Zettour với đại từ 'Ông' - 'mình'
    về việc còn phải tiêu diệt hoàn toàn và đánh đuổi quân địch thêm bao nhiêu lần
    nữa."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc', 'sư đoàn Liên bang', 'Vị tướng', con số
    'khoảng hai trăm sư đoàn' lúc đầu cuộc chiến và nhận định đã xóa sổ phần lớn,
    nếu không muốn nói là toàn bộ số đó."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'sư đoàn Liên bang', 'Lục quân Đế quốc', 'Đế quốc',
    chi tiết bức tường vững chắc gồm hai trăm sư đoàn Liên bang khác và phủ định không
    thể tiếp tục duy trì màn kịch rằng Đế quốc có đủ binh lực sánh ngang."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông', mục tiêu san bằng thế trận và chi tiết đánh bại
    các sư đoàn địch theo từng cụm mười, thậm chí hai mươi sư đoàn cùng lúc."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Liên bang', đại từ 'ông' và phủ định Liên bang không
    hề lộ dấu hiệu thiếu hụt quân số bất chấp mọi nỗ lực của ông."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Lục quân Đế quốc', thuật ngữ 'cuộc chiến tiêu hao',
    'tốc độ tổn thất', 'sư đoàn', 'phòng tuyến ở miền đông', con số 'một trăm năm
    mươi sư đoàn' và thực trạng phần lớn đã thiếu hụt quân số đến mức đáng báo động."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc' và ẩn dụ đang rạn nứt từ mọi đường khâu
    mối nối, sắp toạc ra vượt quá giới hạn có thể cứu vãn vì cuộc chiến kéo dài quá
    lâu."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000140
  kind: terminology_and_voice
  value: 'locks=["Khóa thuật ngữ ''Chiến tranh tổng lực'', ''sự tất yếu'', ''tính
    hợp lý về mặt quân sự'', ''lý tính nhà nước'', ''tiền tuyến'', định danh ''Trung
    tướng Zettour'' cùng hai hình ảnh ẩn dụ: lấy chính ngôi nhà của mình làm bùi nhùi
    giữ lửa và chiếc đồng hồ cát chứa tương lai tổ tiên để lại đang trôi tuột xuống
    đáy."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' và mệnh đề tình thái cần phải chấm dứt chuyện này."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại bỏ lửng của Zettour với đại từ 'Ta' - 'mình' ('Ta
    biết mình phải làm gì, nhưng…')."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' và hành động day thái dương, thầm đau khổ trong
    lòng."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 ở câu đầu, định danh 'Kế
    hoạch B của quân đội', đại từ 'ông' và quan hệ nhân quả giải thích vì sao ông
    giữ im lặng khi Kế hoạch B dần thành hình sau hậu trường."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' - 'mình', sự phân biệt 'có thể và nên làm gì' cùng
    tư thế sẵn sàng thực thi bổn phận nếu tình thế buộc phải làm tới cùng."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại ngắn của Zettour với đại từ 'Ta' khẳng định sự
    chắc chắn ('Ta biết chắc điều này.')."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', cụm 'nhân danh sự tất yếu' và cấu trúc tăng tiến
    'Không chỉ riêng ông biết điều này; mà tất cả mọi người trong quân đội đều biết'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' và chi tiết phải trả giá cho tương lai bằng máu
    của lớp người trẻ tuổi cùng nhận định đó là một gánh nặng khổng lồ."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'mặt trận phía đông', 'viên đạn bạc', 'vị tướng',
    'sĩ quan tham mưu cao cấp', phép so sánh khao khát lối thoát như kẻ nghiện thèm
    thuốc phiện và sự đối lập khi vị tướng bật cười trước cả đời rèn luyện của mình."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và nhận thức rằng quá trình rèn luyện buộc ông
    thấy rõ sự vô nghĩa của lối suy tính ngắn hạn."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' - 'ông', thuật ngữ 'sĩ quan tham mưu cao cấp', điều
    kiện giả định sẵn sàng chất chồng sinh mạng và dựng pháo đài bằng xác người miễn
    là câu thêm được thời gian, cùng nhận thức rằng đất nước mình đã đi quá giới hạn."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Zettour với đại từ 'Ta' - 'mình' đối lập giữa
    quá khứ từng nghĩ mình là người tốt và thực tại hiện nay."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' - 'mình' và mức phủ định khó lòng tự coi mình là
    người tốt theo bất kỳ nghĩa nào."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'sĩ quan tham mưu cao cấp', 'sĩ quan', định danh 'Đế
    quốc', hình ảnh 'con quái thú chimera', đại từ 'Ông' (trần thuật) và 'ta' / 'chúng
    ta' (trong lời nói của Zettour)."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Sự tất yếu.*'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'sĩ quan', đại từ 'Họ' và sự chuyển hóa từ con người
    thành 'những bánh răng trong cỗ máy chiến tranh' hành động không chút do dự chỉ
    vì từ 'Sự tất yếu'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Zettour với đại từ 'Ta' và phủ định không
    thể tự lừa dối bản thân thêm nữa."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông' - 'mình', thuật ngữ 'mặt trận phía đông', 'sĩ quan'
    và sự nhìn nhận lại cách ông luôn tự coi mình là người tốt, một sĩ quan biết rõ
    phải làm gì để hoàn thành nhiệm vụ."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', thuật ngữ 'mặt trận phía đông', định danh 'Trung
    tá Degurechaff' và chi tiết ông nhận ra bản thân đánh giá nhóm nhỏ các sĩ quan
    sẵn lòng làm vấy bẩn đôi tay cùng ông ở mặt trận phía đông là vượt trội hơn các
    đồng cấp."]
