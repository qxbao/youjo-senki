segment_id_end: YS-LN10/Text/chapter022.xhtml/p000258
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000222
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm với mệnh đề phủ định ('chẳng một ai chịu trả
    lời'), câu hỏi về 'Những kẻ cầm trịch' và 'những người nơi tiền tuyến', câu hỏi
    giả định phủ định ('Làm sao có thể làm nên trò trống gì nếu họ còn chẳng biết
    câu trả lời cho điều này?') và đại từ 'Chúng ta' ở câu kết."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000223
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad nêu điều kiện mở đầu đàm phán và mệnh đề
    giả định phủ định ('ngay cả nền ngoại giao xuất sắc nhất cũng có thể đổ bể nếu
    thời điểm không thật sự chín muồi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000224
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('Mình' / 'mình' theo DEC-P01-001)
    và phép so sánh tương đồng ('Điều hành một quốc gia cũng chẳng khác gì điều hành
    một công ty')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000225
  kind: terminology_and_voice
  value: locks=['Khóa nhận định nội tâm về yêu cầu diễn đạt mọi thứ bằng lời lẽ rõ
    ràng và đơn giản.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000226
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận của Tanya với cặp đại từ 'ông' (Conrad) - 'chúng
    tôi' (phía quân đội)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000227
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad tự xưng 'Tôi', hỏi về 'Lối tác chiến cơ
    động của Tướng Zettour ở miền đông' và 'đợt tấn công không ngừng nghỉ của Liên
    bang'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000228
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm về 'vị đại tướng tương lai này', danh xưng
    'Tướng Zettour, tay lừa đảo đại tài ấy' và tên 'Liên bang'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000229
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya tự xưng 'Tôi', đánh giá khả năng học hỏi
    của 'Liên bang' và hình ảnh ẩn dụ 'Tướng Zettour lại là một người thầy tàn nhẫn'
    khiến sách giáo khoa của họ nhòe đi vì nước mắt."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000230
  kind: terminology_and_voice
  value: locks=["Khóa đoạn bình luận nội tâm về vị thế 'một trung tá quèn' và chuẩn
    mực của 'sĩ quan Bộ Tổng tham mưu' / 'các sĩ quan Bộ Tổng tham mưu' coi sự tàn
    nhẫn là một lời khen."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000231
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya tự xưng 'tôi', ẩn dụ 'những khoản học phí
    chồng chất' của 'Liên bang' từ 'những bài học của Tướng Zettour', mệnh đề nhượng
    bộ phủ định ('Dù chừng đó có thể chưa đủ để cứu vãn nền kinh tế của Đế quốc')
    và đề xuất dùng làm 'vốn đầu tư cho một thương vụ mới'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000232
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Conrad gọi Tanya là 'Cô' - 'thưa Trung tá' và hình
    ảnh 'gắn thêm vài chữ số nữa vào đó'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000233
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba mô tả cử chỉ và nét mặt buồn bã của
    'Vị tham tán'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000234
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với đại từ bao gộp 'Chúng ta' / 'chúng
    ta' và chuỗi ba cấu trúc phủ định ('không cần một chiến thắng nhỏ lẻ ở miền đông',
    'Không phải để phủ nhận công sức... sẽ chẳng giúp chúng ta thoát khỏi tình cảnh
    này', 'Những chiến thắng không thể đem ra dùng trên bàn đàm phán...')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000235
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất ('Mình' / 'mình' theo DEC-P01-001)
    bày tỏ lòng biết ơn đối với 'người đàn ông này' / 'ông ta' trước khi nói thật
    cảm nghĩ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000236
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại mở đầu ('chúng ta') và phần trần thuật ngôi thứ ba
    quy chiếu tới 'Tanya' ('cô'), 'Đại tá Lergen', 'Tham tán Conrad' cùng phép so
    sánh với việc triển khai 'tiểu đoàn'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000237
  kind: terminology_and_voice
  value: locks=["Khóa câu nội tâm ngôi thứ nhất ('mình' theo DEC-P01-001) với hình
    ảnh 'tung phát đạn quyết định'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000238
  kind: terminology_and_voice
  value: locks=["Khóa hai câu hỏi tu từ trong lời thoại của Tanya ('mình' / 'chúng
    ta') và thuật ngữ 'hiệp định đình chiến'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000239
  kind: terminology_and_voice
  value: locks=["Khóa lời khẳng định bác bỏ của Conrad gọi 'thưa Trung tá', tự xưng
    'tôi' (với tư cách nhà ngoại giao) và phủ định tuyệt đối ('bất khả thi', 'chúng
    ta sẽ không bao giờ có thể làm được')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000240
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn 'Tại sao?' của Tanya."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000241
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Tanya' và 'Tham tán Conrad'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000242
  kind: terminology_and_voice
  value: locks=["Khóa câu trả lời phủ định giả định của Conrad ('Quốc gia này sẽ không
    sống sót nổi qua chuyện đó đâu')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000243
  kind: terminology_and_voice
  value: locks=["Khóa lời phản biện của Tanya ('chúng ta' / 'mình') đối lập giữa nguy
    cơ 'đất nước sụp đổ từ bên trong' / 'sự hủy diệt tất yếu' với lựa chọn an toàn
    hơn là 'một thỏa thuận đình chiến' dù phải chịu 'sự phá sản'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000244
  kind: terminology_and_voice
  value: locks=["Khóa lời giải thích của Conrad gọi 'thưa Trung tá', giữ nguyên thuật
    ngữ 'Reich' và hai mệnh đề phủ định ('không phải là vấn đề logic', 'Reich không
    hề biết đến thất bại')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000245
  kind: terminology_and_voice
  value: locks=["Khóa đoạn nội tâm ngôi thứ nhất ('Mình' theo DEC-P01-001), phủ định
    kép ('chẳng thể không đồng tình'), sự phân biệt giữa 'Reich' (được ví như căn
    bệnh chết người) với 'Đế quốc', cùng tên cơ quan 'Bộ Ngoại giao'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000246
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm về 'Đế quốc' và quan niệm ăn sâu bén rễ rằng
    'quốc gia của chúng ta luôn hành quân dưới ngọn cờ chiến thắng tung bay'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000247
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với chủ thể 'Reich' và khái niệm 'định
    chế chiến thắng'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000248
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba mô tả tiếng thở dài và nỗi dằn vặt
    tinh thần của 'Tham tán Conrad' ('ông ta')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000249
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại giả định của Conrad về hậu quả của thất bại xóa sổ
    'nền tảng chiến thắng vĩnh cửu' và 'đánh gục cả đất nước'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000250
  kind: terminology_and_voice
  value: locks=["Khóa đoạn nội tâm kết hợp tự quy chiếu ngôi thứ nhất ('mình' theo
    DEC-P01-001) và quy chiếu ngôi thứ ba ('một người lính như Tanya'), giữ nguyên
    cấu trúc phủ định ('không phải là thứ mình có thể cam chịu chấp nhận mà không
    phản kháng') và cấu trúc tăng tiến ('Không những thế...')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000251
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại châm biếm của Tanya ví 'Reich' như một đứa trẻ tự
    cho mình là bất khả chiến bại trạc tuổi 'tôi'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000252
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Conrad xưng hô 'tôi' - 'cô', thừa nhận cảm giác
    sợ hãi, ghê tởm và sự bài xích theo bản năng trước ý niệm phủ định tuyệt đối rằng
    'Đế quốc hoàn toàn không còn cách nào để giành chiến thắng bước ra khỏi cuộc chiến
    này'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000253
  kind: terminology_and_voice
  value: locks=["Khóa lời khen ngợi của Tanya gọi 'thưa Tham tán' và đại từ 'Ông'
    / 'ông'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000254
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Tanya' và 'Tham tán Conrad'
    ngước nhìn lên trần nhà."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000255
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad quay sang nói với 'Đại tá Lergen', tự xưng
    'tôi', bày tỏ sự kính phục đối với 'bên quân đội' và khen ngợi 'vị trung tá này'
    có cái nhìn sáng suốt về thực tại."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000256
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm tự quy chiếu ngôi thứ ba ('Sao tự dưng Tanya
    lại được khen thế này?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000257
  kind: terminology_and_voice
  value: locks=["Khóa nhận định nội tâm với mệnh đề phủ định tuyệt đối ('chẳng hề
    có bất kỳ tác động nào đến thực tại khách quan cả')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000258
  kind: terminology_and_voice
  value: locks=["Khóa câu kết đoạn so sánh việc dùng 'thuật thức ma pháp' để thao
    túng hiện tượng tự nhiên và tác động đến thực tại với giới hạn ('nhưng vẫn còn
    cách rất xa mới tới mức uốn nắn cả thế giới theo ý muốn của mình')."]
