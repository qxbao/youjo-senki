choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000001
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại mở đầu của Zettour, thuật ngữ 'mặt trận phía đông'
    và câu thành ngữ về thời buổi ngặt nghèo đòi hỏi biện pháp quyết liệt; không dùng
    nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba từ góc nhìn của Zettour ('Zettour',
    'Ông', 'ông') và chi tiết hút thuốc lá quân nhu rẻ tiền thay vì xì gà để tận hưởng
    chiến thắng nhỏ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000003
  kind: terminology_and_voice
  value: locks=["Khóa giả định quá khứ ('Ông từng nghĩ rằng...', 'Nếu đúng là vậy...'),
    phủ định bước ngoặt ('…Có điều cô đã không nhìn ra'), danh xưng 'Trung tá Degurechaff',
    đại từ 'Ông' - 'cô' và hình ảnh vượt qua 'phép thử bất chợt' một cách xuất sắc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000004
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'sĩ quan cấp tá', cặp đại từ thoại của Zettour ('tôi'
    - 'cô', 'chúng ta'), phủ định ('không phát hiện ra cái bẫy của tôi') và nhận định
    có thể trụ lại trong cuộc chơi lâu hơn dự kiến ban đầu."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô kính trọng của Tanya ('Thưa Tướng quân?', 'Tôi'
    - 'ngài') thể hiện sự bối rối chưa theo kịp ý của cấp trên."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000006
  kind: terminology_and_voice
  value: locks=["Khóa mệnh lệnh của Zettour với cách gọi 'Trung tá', cặp đại từ 'tôi'
    - 'cô' và thuật ngữ 'nhiệm vụ trinh sát chiến đấu'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa lời nhận lệnh kèm ý kiến phản biện dè dặt của 'Trung tá Degurechaff'
    ('Rõ, thưa Tướng quân', 'Tôi' - 'ngài'), thuật ngữ 'đòn tấn công thăm dò', nguy
    cơ làm lộ kế hoạch 'bao vây quân địch' và chi tiết cần bổ sung 'một điều khoản
    phụ'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000008
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn gọn của Zettour với đại từ 'cô'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa lời thỉnh cầu thẳng thắn nhưng lễ phép của Tanya ('Tôi' - 'ngài',
    'ạ') muốn nghe ý định của Zettour."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000010
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của Zettour ('Ông' - 'cô'), nhận định khái quát ('Bất
    kỳ ai cũng có thể đọc sai bản đồ'), danh xưng 'Trung tá Degurechaff' và ký ức
    hoài niệm thời còn là một học viên cố gắng học giỏi."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000011
  kind: terminology_and_voice
  value: locks=['Khóa sự đối lập giữa quá khứ đơn giản với thực tế phức tạp hiện tại,
    và bài học bất biến phải trả giá đắt mới học được trên chiến trường.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá', đại từ 'tôi' - 'cô' trong thoại, đại từ
    'ông' trong trần thuật và mệnh đề phủ định tuyệt đối 'Quy luật của chiến tranh
    không bao giờ thay đổi'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000013
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận của Tanya ('ngài', 'sao ạ') về quy luật phe
    thua kém quân số tất yếu phải nghĩ ra một chiến lược."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tướng', đại từ 'ông' - 'cô' và sự tán thưởng dành
    cho một sĩ quan hiểu rõ mình đang nói gì."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('cô', 'vị tướng') giải thích
    lý do câu trả lời tiếp theo được giữ ngắn gọn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa lời khẳng định của Zettour, đại từ 'chúng ta', thuật ngữ 'tính
    cơ động' và 'Một đòn bao vây'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi bỏ lửng của Tanya với đại từ 'ngài'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp của Zettour với đại từ 'cô' - 'tôi', cách gọi 'Trung
    tá' và ý giải quyết các điểm mâu thuẫn tùy theo góc nhìn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị trung tá', đại từ 'cô' - 'ông', và phần nhấn mạnh
    Markdown theo DEC-P01-002 tại '*Ông ấy đang muốn nói tới điều gì thế?*'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá' cho 'Colonel', quân hàm 'Trung tướng Zettour',
    thuật ngữ 'mặt trận Rhine', 'chính quốc', giới hạn rút lui phải bảo đảm khả năng
    phản công và suy luận không thể chỉ đơn thuần bao vây địch trong lúc rút lui."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa nhận định phê phán nội tâm của Zettour về mệnh lệnh phản công
    mang tính làm màu chính trị từ 'thủ đô' / 'Berun', giả định hậu quả thảm khốc
    nếu ban hành nguyên xi ngoài mặt trận và tiếng cười khan."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown toàn câu theo DEC-P01-002 ('*Nhưng đừng lo
    lắng, vì chúng ta là các sĩ quan cao cấp. Chẳng có gì phải sợ cả.*') và thuật
    ngữ 'các sĩ quan cao cấp'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ' - 'Ông', phủ định ('chẳng đủ để khuất phục họ'),
    cụm 'nghệ thuật chiến tranh' và hình ảnh ẩn dụ tóm lấy 'Nữ thần Vận mệnh' từ phía
    sau bằng cách chộp lấy mái tóc của nàng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại của Zettour với đại từ 'Chúng ta' và cấu trúc phủ
    định kép khẳng định sự bắt buộc phải tuân theo mệnh lệnh."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi phản biện của Tanya ('chúng ta'/'ta', 'sao ạ') cùng
    các thuật ngữ 'cuộc tấn công chính diện', 'những viên đạn thịt' và 'chiến tranh
    chiến hào'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa lời tán đồng có điều kiện của Zettour ('với giả định là chúng
    ta làm theo đúng sách vở'), phủ định kép ('không có thời gian mà cũng chẳng có
    nghĩa vụ phải mở một cuộc tấn công chính diện'), định hướng chọn 'cách tiếp cận
    mang tính đánh lừa hơn' và câu hỏi kết đoạn dành cho Tanya ('Cô')."]
