segment_id_end: YS-LN10/Text/chapter018.xhtml/p000091
choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ thoại của Romel 'ta' - 'cô', hô ngữ 'Trung tá', danh
    xưng 'vị tướng ấy' (chỉ Zettour), và thành ngữ 'tung hoành thỏa sức'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', địa danh phương hướng 'miền đông', và
    nhận định nơi hội tụ mọi điều tồi tệ nhất khi nói về các chiến trường."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000066
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'mặt trận phía nam' và sự tương phản giữa 'sự chênh lệch
    nhiệt độ gay gắt' với 'một chiến trường tương đối dễ thở'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000067
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Mặt trận phía nam', nhận định thắng thua ở miền nam không
    được xem là quá quan trọng để định đoạt kết cục cuộc chiến, và hệ quả tạo nên
    'một mức độ lịch thiệp qua lại giữa đôi bên'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'lợi ích quốc gia tối thượng' và mệnh đề nhượng bộ
    'bất kể phải trả giá đắt đến đâu'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Vậy thì…*' theo đúng DEC-P01-002 và danh
    xưng 'Tướng Romel'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', cặp đại từ 'ta' - 'cô', và tên riêng 'Liên
    bang'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa Tướng quân', cụm 'hai mặt trận phía đông và phía
    tây', và cụm rào đón 'Với tất cả sự kính trọng…'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa lời ngắt 'Khoan đã' và đại từ trần thuật 'ông ta'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình', đại từ 'ông ta', và chi tiết dừng phản
    đối khi nhận ra giọng điệu phật ý."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000074
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ta' - 'cô', cụm trích dẫn lại 'với tất cả sự kính
    trọng', và cách gọi 'đám quan chức hành chính'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'tôi' (kèm 'ạ'), từ 'thủ đô', và cụm 'thủ tục hành
    chính rườm rà'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000076
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô', thuật ngữ 'sĩ quan tác chiến', 'Văn phòng Bộ Tổng
    tham mưu', và 'giới quan chức hành chính'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa tiếng cười 'Ha-ha-ha.'"]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Romel', đại từ 'ông ta' - 'mình', và chi tiết
    nét mặt méo xệch đi."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', cụm 'Sự thái quá của tệ quan
    liêu', 'định luật cay đắng của Parkinson', và 'đám quan chức hành chính'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', cặp đại từ 'ta' - 'cô', và mục tiêu 'trực
    tiếp uy hiếp thủ đô của chúng'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000081
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Ngài' - 'tôi' (kèm 'sao ạ?') và cụm ẩn dụ 'thành
    phố sương mù'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Cô' - 'ta' / 'chúng ta' và mốc thời gian 'kể từ
    thời chúng ta còn ở miền nam'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000083
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'ngài' - 'tôi' (kèm 'ạ') và lối nói mỉa khéo xin
    mượn từ điển để trau dồi vốn từ vựng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa danh hiệu 'Bạch Ngân', cụm 'Đế quốc', 'người lính Đế quốc',
    đại từ 'cô' / 'chúng ta', và yêu cầu nói thẳng suy nghĩ bằng chính lời lẽ của
    mình."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ta' và nhận định nội tâm 'Chắc chắn đây là cố tình
    rồi. Ông ta đang giả ngơ đây mà.'"]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000086
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', danh xưng 'Tướng Romel', và cụm chức
    danh 'sĩ quan tham mưu của Lục quân Đế quốc'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000087
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và cụm 'đám sĩ quan Bộ Tổng tham mưu sau
    cùng lại leo lên làm tướng'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000088
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'ta' - 'cô', hô ngữ 'Trung tá', và hai câu hỏi gặng
    về cách 'củng cố miền tây' hay kế hoạch tốt hơn."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa lối tách điểm nhìn tự quy chiếu ngôi thứ ba ('Tanya', 'cô')
    song hành với đại từ nội tâm ngôi thứ nhất ('Mình', 'mình') theo DEC-P01-001,
    cùng hành động 'lịch sự bắt đầu bóc tách triệt để giả định của cấp trên'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi' / 'chúng ta', thuật ngữ 'không chiến', 'bài
    toán hiệu suất', và 'hệ thống phòng không'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa điều kiện giả định trái thực tế 'nếu chúng ta có đủ nguồn lực
    cho việc ấy', cặp đại từ 'ta' - 'cô', và câu hỏi chất vấn về việc ở 'phe thua
    cuộc'."]
