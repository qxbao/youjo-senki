choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa lối tự quy chiếu ngôi thứ ba ('Tanya', 'cô') kết hợp đại từ
    độc thoại nội tâm ngôi thứ nhất ('mình') theo DEC-P01-001, tên riêng 'Lục quân
    Đế quốc', và phủ định 'chẳng có mấy trọng lượng trong mắt bất kỳ nhà tuyển dụng
    tiềm năng nào mà mình đang nhắm tới'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'cựu chuyên viên nhân sự', đại từ nội tâm 'mình',
    thuật ngữ 'giá trị thị trường', và nhận định 'Ai cũng tin rằng bản thân là người
    có năng lực làm việc trên mức trung bình'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'hiệu ứng Hồ Wobegon', đại từ nội tâm 'mình', và đánh
    giá 'một sai lầm chí mạng không thể tin nổi nếu mắc phải'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', nhận thức tự đánh giá ở mức
    trung bình, phủ định 'không bao giờ quá lạc quan về triển vọng nghề nghiệp', và
    cụm 'kế hoạch chuyển việc của mình'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', cấp bậc 'trung tá quèn của Đế quốc',
    động từ 'đào tẩu sang phe khác', và câu hỏi tu từ 'ai lại thèm để tâm đến một
    sĩ quan cấp trung vô danh bất kỳ nào đó cơ chứ?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', tên gọi 'Huy hiệu Xung kích
    Cánh Bạc', tên riêng 'Đế quốc', và phủ định 'không được phép tự mãn'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' và thuật ngữ kinh tế 'sự bất cân xứng
    thông tin giữa bất kỳ hai công ty nào'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa đại từ giả định chung 'bạn', phủ định 'chắc chắn không phải
    là nước Nhật', 'Ở đây không có Internet', và lối tự quy chiếu ngôi thứ ba 'Tanya'
    / 'cô'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Mình tuyệt đối không muốn đặt cược tất cả vào mức
    độ nổi tiếng của Tanya ở các quốc gia khác' và nhận định 'một canh bạc liều lĩnh'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự nhủ 'Mình' trong câu lẩm bẩm bỏ lửng 'Mình cần một
    phần thưởng danh giá bậc nhất, hoặc là…'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000127
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', tên riêng 'Khối Thịnh vượng
    chung', và ẩn dụ thương trường 'thị trường hoàn hảo' / 'nâng cao giá trị cổ phiếu
    của mình trên trường quốc tế'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'nước đi PR' / 'PR', lối tự quy chiếu ngôi thứ ba
    'Tanya' / 'cô', đại từ ngôi thứ nhất 'mình', và chi tiết 'pha chút giọng tự trách
    mình, mình khẽ lên tiếng'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'tôi' (kèm 'ạ') khi Tanya cất lời trước mặt Tướng
    Romel và ý tự trách về việc để tình thế ngặt nghèo làm dao động."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', danh xưng 'Tướng Romel', và chi tiết
    'nở một nụ cười rạng rỡ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' / 'mình', đại từ ngôi thứ ba 'ông ta',
    chi tiết 'giả vờ đã xuôi theo lối suy nghĩ của ông ta', và phủ định 'không ngờ
    lại nhận được phản ứng này'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', đại từ 'cô' / 'chúng ta', và nhận định 'Những
    thành quả mạnh mẽ trên chiến trường là lối thoát duy nhất của chúng ta khỏi tình
    cảnh này'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề điều kiện phủ định 'Nếu đã không còn lối thoát nào khác
    khỏi thế kẹt này' và đại từ thoại 'tôi' (kèm 'ạ')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình', danh xưng 'vị tướng', và chi tiết 'bật
    cười như thể vừa có một sự hiểu lầm kỳ quặc nào đó'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ 'một con đường cô độc' và lời rủ 'Chúng ta hãy cùng sánh
    bước trên con đường ấy'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Cùng sánh bước ư?*' theo đúng DEC-P01-002,
    đại từ 'Mình' / 'ông ta', câu hỏi nội tâm về ý định đào tẩu, và phủ định 'Không,
    suy diễn thế thì quá đà thật'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa Tướng quân', cặp đại từ 'ngài' - 'tôi' (kèm 'ạ'),
    và câu hỏi xác nhận ý định đi cùng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ta', thuật ngữ 'lục quân', và nhận định phủ định 'Ta
    không nghĩ một người của lục quân lại có thể vượt biển được đâu'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' và cụm 'nhiệm vụ sắp tới'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000140
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'vị tướng', tên riêng 'Tanya', đại từ nội tâm 'mình',
    và đại từ 'ông ta'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa Tướng quân', cặp đại từ 'tôi' - 'ngài' / 'chúng
    ta' (kèm 'ạ'), cùng các thuật ngữ 'nhánh ma pháp của quân đội', 'trường đại học
    quân sự', và 'lục quân'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', cặp đại từ 'Cô' - 'ta', và cụm 'các bữa tiệc
    của lục quân'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch điểm nhìn từ ngôi thứ ba ('cô', 'ông ta') sang
    ngôi thứ nhất ('Mình') và đại từ giả định chung ('bạn') ở cuối đoạn."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Kẻ địch không phải là những kẻ duy nhất có thể đánh
    úp bạn khi bạn mất cảnh giác' và 'mình đã không lường trước được rằng có thể vẫn
    còn mối nguy hiểm đang rình rập quanh đây'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá' và đại từ 'Ta'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Khoan, cái gì cơ?*' theo đúng DEC-P01-002,
    đại từ nội tâm 'Mình' / 'mình', và nhận định 'hiếm khi nào để dành điều tốt đẹp
    nhất vào phút chót lắm'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', phản xạ cảnh giác cao độ, và nhận định
    'việc mình hoàn toàn mù tịt không biết thứ gì sắp ập tới cho thấy mọi sự đã quá
    muộn rồi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn 'Là chuyện gì vậy, thưa Tướng quân?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' và hành động 'cố hết sức che giấu nỗi
    sợ hãi trong lòng'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ta' và thuật ngữ 'chính quốc' trong câu kết của Tướng
    Romel."]
