- segment_id: YS-LN10/Text/chapter010.xhtml/p000529
  kind: terminology_and_voice
  value: locked=Khóa cách xưng hô 'Thưa Tướng quân' và câu hỏi dè dặt '“Thưa Tướng
    quân, chúng ta… thực sự sẽ thử làm việc này sao ạ…?”'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000530
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'vị tướng', 'Trung tướng Zettour' và thái độ 'vẫn giữ
