- segment_id: YS-LN10/Text/chapter010.xhtml/p000513
  kind: terminology_and_voice
  value: 'locked=Khóa câu thoại tự đắc của chỉ huy Liên bang: ''“Mọi thứ đang diễn
    ra đúng như chúng ta dự đoán… Hắn đã nằm gọn trong lòng bàn tay của chúng ta rồi.”''.'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000514
  kind: terminology_and_voice
  value: locked=Khóa chủ thể 'Các sĩ quan chỉ huy' và nhận định 'đây chính là cơ hội
