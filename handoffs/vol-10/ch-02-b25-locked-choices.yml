    phía đông' và mục đích thiết kế đội hình phục vụ 'tác chiến cơ động'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000522
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'bậc thầy về tác chiến cơ động, Trung tướng Zettour'
