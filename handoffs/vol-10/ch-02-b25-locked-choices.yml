- segment_id: YS-LN10/Text/chapter010.xhtml/p000505
  kind: terminology_and_voice
  value: 'locked=Khóa câu thoại ngắn báo hiệu giao tranh: ''“Sắp bắt đầu rồi.”''.'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000506
  kind: terminology_and_voice
  value: locked=Khóa các thuật ngữ 'bộ chỉ huy', 'Đế quốc', 'Quân đội Liên bang',
