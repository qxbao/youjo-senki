    kẻ địch đang tháo chạy có thể thực hiện được', chủ thể 'các chỉ huy Liên bang',
    'Quân đội Liên bang' và đại từ 'ông' chỉ Zettour.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000508
  kind: terminology_and_voice
  value: locked=Khóa lời thoại của chỉ huy Liên bang với các đại từ 'chúng ta', 'bọn
