    dược lại là một mánh khóe khác của hắn rồi'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000509
  kind: terminology_and_voice
  value: locked=Khóa câu trần thuật chuyển tiếp dẫn vào câu thoại kế tiếp của cùng
