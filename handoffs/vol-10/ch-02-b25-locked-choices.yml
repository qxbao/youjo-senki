- segment_id: YS-LN10/Text/chapter010.xhtml/p000516
  kind: terminology_and_voice
  value: locked=Khóa ẩn dụ ván bài 'kẻ lừa đảo ngồi phía bên kia bàn—người mà họ đinh
    ninh sẽ ngửa bài bất cứ lúc nào—đạp tung cả cái bàn ra khỏi trước mặt họ'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000517
  kind: terminology_and_voice
  value: locked=Khóa tiêu đề chuyển cảnh 'CÙNG NGÀY HÔM ĐÓ, TRUNG TÂM CHỈ HUY LÂM
