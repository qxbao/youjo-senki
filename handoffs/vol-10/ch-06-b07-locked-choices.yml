choices:
- segment_id: YS-LN10/Text/chapter028.xhtml/p000201
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', 'Rudersdorf', đại từ 'ông ấy' (quy chiếu
    Rudersdorf), cụm định danh 'vị đại tướng tương lai đang đồn trú ở miền đông' (quy
    chiếu Zettour) và nhận định mọi toan tính của Rudersdorf đều nằm ngoài sức tưởng
    tượng của Zettour."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000202
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Trung tá Tanya von Degurechaff', đại từ trần thuật
    'Cô' và mức tình thái 'có lẽ' đối với những mong muốn chung của hầu hết con người."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000203
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô' cùng hai khái niệm mục tiêu là 'tối đa hóa lợi ích'
    và 'quyền tự do mưu cầu hạnh phúc'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000204
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'cận chiến quần vòng', 'pháp sư hải quân đánh bộ ...
    của Khối Thịnh vượng chung', định danh 'Tướng Romel', các hướng địa lý 'miền đông'
    - 'miền tây', đại từ 'cô' và mạch sự kiện chạm trán chính gã pháp sư điên khùng
    đó ở cả hai mặt trận."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000205
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại tự hỏi của Tanya với đại từ 'Hắn' và hình ảnh 'tên
    bám đuôi biến thái'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000206
  kind: terminology_and_voice
  value: locks=['Khóa quan hệ nhượng bộ giữa tính chất rợn người của suy nghĩ đó với
    việc đằng sau nó có cơ sở nhất định.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000207
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'đơn vị tình nguyện đa quốc gia', tên riêng 'Tanya',
    đại từ 'họ' (đơn vị của Tanya) và chi tiết kẻ địch bám theo họ khắp lục địa khiến
    Tanya thấy xây xẩm chỉ khi nghĩ tới."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000208
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cô' - 'mình' và phép so sánh tâm trí minh mẫn, lành
    mạnh như đang bị tống qua 'cỗ máy nghiền công nghiệp'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000209
  kind: terminology_and_voice
  value: locks=["Khóa câu lầm bầm tự nhủ của Tanya với đại từ tự xưng 'Mình' theo
    DEC-P01-001 và nhu cầu cần một kỳ nghỉ."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000210
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', hành động buột miệng lầm bầm một mình và
    quan hệ chuyển ý khi chính câu nói ấy châm ngòi cho một nhận thức mới."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000211
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'vùng lãnh thổ phía tây', 'François', 'miền đông',
    đại từ 'họ' và phép so sánh nơi đồn trú hiện tại chẳng khác nào thiên đường so
    với miền đông ngoại trừ những đợt oanh tạc thỉnh thoảng vọng về từ phía xa."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000212
  kind: terminology_and_voice
  value: locks=["Khóa liệt kê các tiện nghi ('hệ thống ống nước, có điện, và thậm
    chí có cả giường ngủ' cùng đồ ăn ngon) và kết luận đây là nơi hoàn hảo để tận
    hưởng những tiện nghi tối thiểu của nền văn minh."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000213
  kind: terminology_and_voice
  value: 'locks=["Khóa định danh ''Khối Thịnh vượng chung'', ''Tướng Romel'', ''Tanya''
    và quan hệ nhân quả: kế hoạch tấn công Khối Thịnh vượng chung của Tướng Romel
    vấp phải chướng ngại khiến Tanya hoàn toàn không có việc gì để làm."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000214
  kind: terminology_and_voice
  value: locks=["Khóa câu lầm bầm mở ra khả năng giả định 'Biết đâu đấy, chỉ là biết
    đâu đấy thôi…'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000215
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 và đại từ 'Mình' theo DEC-P01-001
    tại '*Mình có thể dành chút thời gian cho riêng mình.*', cùng thuật ngữ 'sĩ quan
    ma pháp trên không', 'sĩ quan phụ tá', tên riêng 'Tanya' và chuỗi hành động tự
    soạn biểu mẫu, tự đóng dấu phê duyệt để chính thức nghỉ phép."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000216
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', thuật ngữ 'sĩ quan phụ tá', 'doanh trại tiểu
    đoàn', 'trung tâm chỉ huy', 'Kampfgruppe' và chi tiết chỉ còn việc lặng lẽ nộp
    giấy tờ đi."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000217
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung úy Serebryakov', đại từ tự xưng 'tôi' của Tanya
    trong thoại và tuyên bố hôm nay nghỉ phép một ngày."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000218
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Sĩ quan phụ tá', đại từ 'cô' và câu hỏi lại đầy ngơ
    ngác của Visha ('Nghỉ phép một ngày ạ?')."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000219
  kind: terminology_and_voice
  value: locks=["Khóa câu khẳng định của Tanya với đại từ 'tôi' và phủ định 'hôm nay
    tôi không làm việc đâu!'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000220
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Sĩ quan phụ tá', nhấn mạnh Markdown theo DEC-P01-002
    tại '*nghỉ phép*' và chi tiết vỗ hai bàn tay vào nhau mỉm cười như thể đã quên
    mất khái niệm nghỉ phép."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000221
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô 'Trung tá' kèm tiểu từ kính ngữ 'ạ' trong lời thoại
    của Visha nhận xét chuyện này thật khác thường."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000222
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn 'Chuyện gì cơ?' của Tanya."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000223
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', danh xưng 'Trung tá' trong lời đáp của Visha về
    việc đã rất lâu Tanya không dành ra một ngày nghỉ cho riêng mình."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000224
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', cụm 'người phụ tá của cô', 'con dấu nghỉ
    phép' và phủ định Tanya không nhớ nổi lần cuối lấy con dấu ra tự phê duyệt thời
    gian nghỉ cho bản thân."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000225
  kind: terminology_and_voice
  value: locks=['Khóa nhận định phủ định rằng trong hoàn cảnh như thế này vốn chẳng
    có mấy cơ hội để nghỉ phép ngay từ đầu.']
- segment_id: YS-LN10/Text/chapter028.xhtml/p000226
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cô', lộ trình điều động 'từ miền đông sang miền tây
    rồi lại về thủ đô', ngoại lệ chuyến đi ngắn ngày xuống 'phương nam ở Ildoa' và
    phủ định đã rất lâu cô chưa có một kỳ nghỉ đúng nghĩa."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000227
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'tiểu đoàn', 'ngày phép có lương', đại từ 'chúng ta'
    - 'tôi' và phủ định chuyện không dùng ngày phép có lương không chỉ giới hạn ở
    riêng Tanya."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000228
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ ''Chúng ta'' và sự tương phản trong lời Visha: vẫn xoay
    xở đủ thời gian để ngủ nhưng ngoài việc đó ra thì đã một thời gian không có lúc
    nào nghỉ ngơi."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000229
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya' và hành động gật đầu dứt khoát."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000230
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'lều chỉ huy', 'tiểu đoàn pháp sư', đại từ 'Cô' và
    chi tiết mọi gương mặt trong lều đều giống hệt cô vì tiểu đoàn pháp sư vốn chẳng
    mấy khi được cho đủ thời gian nghỉ ngơi đàng hoàng."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000231
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Kampfgruppe Lergen', 'Kampfgruppe', 'Tiểu đoàn Pháp
    sư Trên không số 203', đại từ 'họ' và sự đối lập giữa danh nghĩa Kampfgruppe Lergen
    với thực tế xoay quanh Tiểu đoàn 203 bị điều đi khắp các chiến trường, khiến người
    lính trung thành nhất cũng có lúc muốn nộp đơn xin nghỉ phép."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000232
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', đại từ 'cô', động cơ đặt nặng việc bảo toàn
    bản thân nên không bao giờ thừa nhận điều đó thành lời, và cấu trúc phủ định kép
    khẳng định cô vẫn sẽ gật đầu thật mạnh tán đồng nếu chủ đề đó được khơi ra."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000233
  kind: terminology_and_voice
  value: 'locks=["Khóa tên riêng ''Visha'', đại từ ''tôi'', chức danh ''sĩ quan chỉ
    huy'', ''tiểu đoàn'', ''cấp dưới'' và lập luận làm gương của Tanya: nếu chính
    cô không nghỉ phép thì cấp dưới sẽ không đời nào dám nghỉ."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000234
  kind: terminology_and_voice
  value: 'locks=["Khóa hình ảnh tự ví von ''nhà quản lý biết quan tâm'', ''một cô
    gái'', đại từ ''cô'' và quan hệ tương phản: dù việc giả bộ đó làm hao tổn sức
    lực nhưng cô vẫn cần diễn cho tròn vai."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000235
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô', cụm 'người phụ tá' và nhận định tuyên bố của cô
    được đón nhận khá tốt qua phản ứng của người phụ tá."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000236
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Visha với cụm 'Tiểu đoàn chúng ta' và nhận định
    tiểu đoàn có xu hướng bỏ qua 'thời gian nghỉ phép'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000237
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm lựa chọn của Tanya về 'cấp dưới của cô' (bản
    tính quá nghiêm túc hay đã từ bỏ ý định nghỉ phép sau thời gian dài chinh chiến)
    và sự tương phản giữa việc luôn chuẩn chỉnh trong ca trực luân phiên với sự lơ
    là đến khó tin khi đụng tới chuyện nghỉ phép của 'tiểu đoàn pháp sư'."]
