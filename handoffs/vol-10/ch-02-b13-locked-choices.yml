choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa câu tự hỏi lẩm bẩm của Zettour ('Hừm, không biết là do đâu nhỉ…?')
    nối tiếp mạch suy ngẫm ở p000094–p000095."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô lễ phép 'Thưa Tướng quân?' và câu hỏi thăm dò 'Có
    chuyện gì sao ạ?' của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' - 'cô', cách gọi 'Trung tá ạ', cụm 'bản báo
    cáo mật về sĩ khí của binh lính chúng ta ở tiền tuyến' và lời dẫn quay lại chủ
    đề chính."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000099
  kind: terminology_and_voice
  value: 'locks=["Khóa trần thuật ngôi thứ ba (''Zettour'', ''Tanya'') và hai hành
    động song song: đặt tập hồ sơ trước mặt Tanya trong khi tay kia xoay xoay điếu
    thuốc lá."]'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngạc nhiên của Tanya với đại từ 'ngài', tiểu từ lễ phép
    'ạ' và cụm 'cuộc điều tra ngầm về sĩ khí'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa số liệu 'bốn mươi phần trăm', tên 'Đế quốc' và câu hỏi tu từ
    phủ định cuối đoạn ('chẳng phải con số bốn mươi phần trăm đó là cao đến mức đáng
    kinh ngạc hay sao?'); không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'Mình' theo DEC-P01-001 và nhận
    định 'nội dung bên trong tệ hại không sao tả xiết'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn tự tách ngôi ('Tanya') trong trần thuật và câu phản
    đối thẳng thắn ('Thưa Tướng quân, không đời nào có thể diễn giải những con số
    này theo hướng tích cực được ạ')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' - 'chúng ta', phủ định chắc chắn ('Mình
    biết chắc chắn một thực tế rằng chúng ta không thể'), nhấn mạnh Markdown đúng
    phạm vi theo DEC-P01-002 tại '*hòa*', và sự đối lập giữa việc tô vẽ kết quả hòa
    thành chiến thắng với 'một thắng lợi toàn diện, dứt khoát thì hoàn toàn là chuyện
    viển vông'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi điều kiện phủ định về ý chí chiến đấu của binh lính
    ngoài 'tiền tuyến', tình thái 'Có thể' và cách tự quy chiếu ngôi thứ ba 'những
    sĩ quan giống như Tanya' chiến đấu thuần túy vì tinh thần trách nhiệm."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000106
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'cánh lính trơn', đại từ 'mình' ('thế giới cũ của mình')
    và dẫn chứng lịch sử về 'những người lính cố thủ trên đảo Saipan' vẫn tin viện
    binh sẽ đến cứu cho tới tận phút cuối cùng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc điều kiện phủ định ('Nếu hàng ngũ binh sĩ không còn
    tin vào chiến thắng cuối cùng nữa…') và thuật ngữ 'mặt trận chiến tranh tâm lý'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa lời xác nhận của Zettour ('Đúng vậy đấy, Trung tá'), tỷ lệ 'Sáu
    mươi phần trăm', nhận định 'cuộc chiến này đã cầm chắc phần thua' và mức độ trầm
    trọng hơn ở 'nhóm tân binh'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', sắc thái giả định ngược kỳ vọng ('…Tôi cứ ngỡ
    chỉ những ai đã bầm dập và kiệt quệ mới cảm thấy như vậy thôi chứ ạ')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa giả định quá khứ ('Cách đây không lâu thì đúng là như vậy'),
    hình ảnh 'những cựu binh bi quan đều đã lên đường tới Valhalla trước cả rồi' và
    ẩn dụ miễn dịch ('tạo cho họ sức đề kháng trước chủ nghĩa bại trận đang tràn lan
    và hoành hành')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', danh xưng 'vị tướng' và nhận định tình
    thái 'dường như vẫn có một vài điểm mâu thuẫn'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi ba thành tựu chiến lược ('Tạo ra một cuộc tranh giành
    bá quyền ở miền đông', 'chia rẽ kẻ địch bằng việc thành lập Hội đồng Tự trị',
    'giải mã được mật mã của phe dân tộc chủ nghĩa') và câu hỏi phản biện phủ định
    cuối đoạn; không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Đám tân binh', giả định trái thực tế ('nếu có nhiều kinh
    nghiệm đến mức ấy, họ cũng sẽ nhận ra được tình cảnh ngặt nghèo mà chúng ta đang
    tự đẩy mình vào') và yêu cầu 'nếm trải hương vị của một chiến thắng thực sự'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'chính quốc', đại từ 'Tôi' - 'họ' và hai câu hỏi liên
    tiếp của Tanya về tác dụng của tuyên truyền cùng sự sụt giảm nhuệ khí của đám
    tân binh."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa nhận định 'phản tác dụng' vì 'hiệu quả một cách thái quá', tên
    'Đế quốc' và nguyên nhân đám tân binh suy sụp khi bị sốc trước thực tế của 'mặt
    trận phía đông'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình', 'ông ấy' (chỉ Zettour), địa danh 'miền
    đông' và suy luận 'hẳn là một cú sốc nặng nề khi phải tận mắt chứng kiến những
    gì thực sự đang diễn ra ở vùng này'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', phép liên hệ với 'những tập đoàn bóc lột ở thế
    giới cũ của mình', giọng mỉa mai khi tự khen công ty cũ cho nghỉ việc đám lười
    biếng và kém hiệu quả đúng quy trình, cùng câu đối lập 'Tuy nhiên, Lục quân Đế
    quốc lại chẳng tử tế được như vậy'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'mình', chức danh kiếp trước 'quản lý nhân sự' và nỗi
    nhớ hòa bình cùng khao khát tìm kiếm một môi trường làm việc tốt hơn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ ('dù điều đó đồng nghĩa với việc phải yêu
    cầu họ làm một việc hơi quá sức') và nhận định 'tất cả những lời nhảm nhí về việc
    buộc phải giành chiến thắng thì riêng lần này lại thực sự đúng đấy'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', danh xưng 'vị tướng' / 'ông ấy' và phép
    so sánh với 'một công ty có văn hóa làm việc độc hại đang cố thuyết phục nhân
    viên rằng công việc của họ cực kỳ quan trọng'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba ('Ánh mắt Tanya vụt ngước lên khi mưu
    đồ thâm hiểm ấy lộ rõ'); không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng tôi', phủ định 'Họ không dạy chúng tôi điều này'
    và thuật ngữ 'trường đại học quân sự'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá', cặp đại từ 'Cô' - 'chúng ta', cụm 'vừa
    làm vừa học' và hình ảnh hồi đáp p000040 ('chúng ta sẽ cùng nhau bước đi trên
    con đường của một bậc thầy mánh khóe vĩ đại')."]
