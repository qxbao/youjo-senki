choices:
- segment_id: YS-LN10/Text/chapter008.xhtml/p000068
  kind: terminology_and_voice
  value: locks=["Khóa quân hàm 'Trung tướng Zettour', chức danh mô tả 'cục phó phụ
    trách khối bảo đảm chiến đấu của toàn bộ Lục quân Đế quốc', đại từ trần thuật
    'ông', và cấu trúc giả định 'Nếu kế hoạch của ông tự sụp đổ, ông sẽ vô cùng chật
    vật để biện minh cho điều không thể biện minh'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000069
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ chuyển ý ('Thế nhưng') và mức độ tình thái ('đôi khi
    cũng mang lại một góc nhìn mới'); không dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000070
  kind: terminology_and_voice
  value: locks=["Khóa góc nhìn của 'người hoạch định tác chiến', quân hàm 'Trung tướng
    Zettour', địa danh 'mặt trận phía đông', và cấu trúc tăng tiến cùng chủ thể 'không
    chỉ áp đặt những ràng buộc lên cách họ vạch chiến lược, mà còn gây khó khăn cho
    việc theo đuổi một kế hoạch hành động thuần túy quân sự'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000071
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Hội đồng Tự trị', 'công tác hậu cần của lục quân',
    và quan hệ nhân quả về nguy cơ kéo theo hệ lụy dây chuyền."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000072
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tướng', câu hỏi gián tiếp về việc quán xuyến đồng
    thời 'công tác hành chính dân sự và việc chỉ huy quân sự', cùng giả định ở câu
    thứ hai và câu kết chuyển ý 'Nhưng ông mới chỉ vừa bắt đầu'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000073
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'bản quốc', 'Đế quốc', 'trường đại học quân sự', dấu
    chấm lửng sau câu cảm thán về việc rút lui, và hai mệnh đề phủ định về thái độ
    của quần chúng cùng các phe phái cởi mở hơn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000074
  kind: terminology_and_voice
  value: 'locks=["Khóa câu chuyển đoạn tạo điểm nhấn: ''Nhưng nỗi sợ lớn nhất của
    Zettour lại hoàn toàn là một chuyện khác''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000075
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'tác chiến cơ động', 'mặt trận phía đông', 'quân bổ
    sung', 'cuộc Đại chiến', và câu hỏi tu từ nội tâm ở cuối đoạn; không dùng nhấn
    mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000076
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''Mình'', đại từ
    quy chiếu Tanya ''cô ấy'', tên ''Degurechaff'', và ẩn dụ ''đứng trên vai một người
    khổng lồ''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000077
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc nghi vấn nội tâm gián tiếp ('Ông tự hỏi phải chăng
    là vì...'), quan hệ nghịch đảo ('ngược lại, điều đó giúp chúng có khả năng suy
    nghĩ tự do hơn...'), và định danh đầy đủ 'Trung tá Pháp sư Tanya von Degurechaff'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000078
  kind: terminology_and_voice
  value: locks=["Khóa quân hàm 'Trung tướng Zettour' và chi tiết 'lại nở một nụ cười
    chua chát khi ngồi xuống'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000079
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi ba thói quen tác chiến ('đọc bản đồ, ghi nhớ vị trí các
    cánh quân của mình và nhẩm tính các kịch bản tiềm tàng trong đầu') và dấu gạch
    ngang giải thích '—một điều khiến ông tự hào'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000080
  kind: terminology_and_voice
  value: locks=["Khóa dấu chấm lửng, thuật ngữ 'Thế bố trí của các tiểu đoàn', 'biên
    chế tác chiến chính thức', phủ định 'chúng không nằm dưới quyền chỉ huy của ông',
    và phép so sánh làm nổi bật 'khuyết tật hệ thống lớn nhất đang bày ra trước mắt
    Zettour'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000081
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''Mình'', danh xưng
    ''Chúa'', dấu chấm lửng, và phủ định nghi vấn về khả năng đoán trước kết cục."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000082
  kind: terminology_and_voice
  value: locks=["Khóa chức vụ 'thanh tra viên trên mặt trận phía đông', tính chất
    'chỉ mang tính danh dự', phủ định 'không hề có thẩm quyền chỉ huy', và khái niệm
    'định hướng chiến lược'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000083
  kind: terminology_and_voice
  value: 'locks=["Khóa câu khẳng định nghịch lý ngắn gọn: ''Nói cách khác, mệnh lệnh
    của ông thực chất không phải là mệnh lệnh''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa cụm giới hạn 'chẳng qua chỉ là những lời khuyên mang tính chuyên
    môn', khái niệm 'đạo quân phía đông', và phủ định mức độ 'khó có thể coi là quy
    trình chuẩn mực'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi ba giả thuyết tình thái giải thích lý do giới hạn quyền
    hạn ('trên danh nghĩa vốn chỉ được xem như...', 'Hoặc có lẽ nó có thể...', 'Rốt
    cuộc, biết đâu đó chỉ là...') và chi tiết 'vụ lùm xùm từng nổ ra trước kỳ lễ hội
    mùa hè'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000086
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'Các sĩ quan Lục quân Đế quốc', cặp đối lập 'coi trọng
    thực chất hơn hình thức', và cấu trúc so sánh lựa chọn 'thà lách luật còn hơn
    làm ngơ trước thứ mà họ xem là thẩm quyền chỉ huy chính đáng'."]
