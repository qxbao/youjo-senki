segment_id_end: YS-LN10/Text/chapter016.xhtml/p000049
choices:
- segment_id: YS-LN10/Text/chapter016.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn ngôi thứ nhất của Tanya ('mình') và chức danh 'viên
    sĩ quan trực ban'; không dùng nhấn mạnh Markdown."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô quân sự của sĩ quan trực ban với Tanya là 'Trung
    tá' (sau khi sửa khỏi 'cô') và cách quy chiếu Romel là 'vị tướng ấy'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi' của Tanya, quy chiếu 'ngài ấy' cho Romel,
    chi tiết 'ở miền nam', và nghĩa đã biết rõ/thấm thía qua thực tế (không dịch là
    nghe kể lại)."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa quy chiếu 'Ngài ấy', thuật ngữ 'các quân chủng' và ba lực lượng
    'các đơn vị hải quân, lục quân và không quân'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa giọng xã giao lịch sự của Tanya trong thoại và đại từ 'Ngài
    ấy'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm/trần thuật ngôi thứ nhất 'Mình' và trình tự hành
    động cảm ơn viên sĩ quan trước khi lập tức quyết định bước tiếp theo."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Romel', đại từ độc thoại 'Mình' - 'chúng ta'
    - 'ông ta', và hình ảnh so sánh 'đoàn tàu chở hàng mất phanh'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000029
  kind: terminology_and_voice
  value: 'locks=["Khóa lối tự quy chiếu tách ngôi đặc trưng của nhân vật trong nội
    tâm: dùng đồng thời ''Mình'' và tên riêng ''Tanya'', cùng chi tiết bị Romel quần
    tơi tả ở miền nam."]'
- segment_id: YS-LN10/Text/chapter016.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'chiến dịch cơ động', đại từ 'Ông ta' - 'mình', và
    góc nhìn ví von bản thân là 'nhân viên tận tụy' đánh giá Romel là 'người lao động
    lý tưởng'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000031
  kind: terminology_and_voice
  value: locks=["Khóa sự phân tách rõ đại từ giữa chủ thể Romel ('ông ta ghét cay
    ghét đắng bất cứ thứ gì ông ta cho là lãng phí') và điểm nhìn phỏng đoán của Tanya
    ('Theo phỏng đoán của mình')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'các quân chủng', giả định trái thực tế 'dùng tử linh
    thuật để hồi sinh người chết rồi đưa họ ra trận nếu có thể', và phép so sánh với
    'bức xạ ngắm bắn của địch'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa hai đối tượng mà Romel tiếp cận gây nghi ngại là 'lục quân và
    hải quân'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000034
  kind: terminology_and_voice
  value: locks=['Khóa câu tự vấn ngắn trong ngoặc kép của Tanya; không dùng nhấn mạnh
    Markdown.']
- segment_id: YS-LN10/Text/chapter016.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa địa danh 'mặt trận phía tây' và nhấn mạnh Markdown theo DEC-P01-002
    cho thuật ngữ '*ưu thế trên không*'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'pháo phòng không', 'các quân chủng khác', danh xưng
    'Tướng Romel' và cấp bậc - tổ chức 'trung tướng của Lục quân Đế quốc'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm xoay quanh mục đích của Romel đối với 'hải quân'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc phủ định bộ phận ('Không phải là... đặc biệt tồi tệ—thực
    tế là khá tốt'), tên hai quân chủng 'Lục quân Đế quốc và Hải quân Đế quốc', và
    cụm 'hạm đội hải quân đồn trú ở phía tây'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ, nhấn mạnh Markdown theo DEC-P01-002 tại cụm '*cử
    người đi thay mình*' (hoặc '*cử người đi thay*'), và câu trả lời phủ định tuyệt
    đối ở cuối đoạn."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa lối tự quy chiếu 'Tanya', tên cơ quan 'Bộ Tư lệnh Hạm đội',
    và nhận định bản chất các cuộc gặp chỉ thuần túy mang tính xã giao."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa phủ định toàn phần ('chẳng thể nghĩ ra nổi lấy một lý do nào'),
    cụm 'sĩ quan lục quân cấp cao', và suy luận tình thái 'Ắt hẳn phải có… một nguyên
    do sâu xa hơn'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Kế hoạch B' (không in nghiêng ở đoạn này theo đúng
    nguồn) và câu hỏi nghi vấn."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa sự đối lập giữa việc giải thích được lý do gặp 'lục quân' với
    câu hỏi bỏ ngỏ về 'hải quân'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa năng lực trên biển và 'binh lực trên bộ'
    không mấy ấn tượng của hải quân."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'bộ binh', 'thủ đô', nhấn mạnh Markdown theo DEC-P01-002
    cho '*Kế hoạch B*', lối tự quy chiếu 'Tanya' đặt song hành với 'Tướng Romel' như
    những quân tốt chính trị, và câu hỏi cuối đoạn."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn nội tâm 'mình' tự điều chỉnh mạch suy nghĩ quay lại
    phương diện quân sự."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa giả định nhượng bộ ('cứ cho là ông ta đi vắng vì công vụ chính
    đáng') và câu hỏi trọng tâm lặp lại về 'hải quân'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'kế hoạch đánh phá tuyến giao thương của địch', 'tàu ngầm',
    tên thế lực 'Khối Thịnh vượng chung ở phía tây', và cách gọi Romel là 'vị chỉ
    huy của mình'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000049
  kind: terminology_and_voice
  value: 'locks=["Khóa quan hệ nhượng bộ - bác bỏ: thừa nhận khả năng đó có thể xảy
    ra nhưng chưa phải lý do đủ sức thuyết phục để ''Tướng Romel'' đích thân đi."]'
