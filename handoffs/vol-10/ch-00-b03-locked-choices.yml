choices:
- segment_id: YS-LN10/Text/chapter002.xhtml/p000078
  kind: terminology_and_voice
  value: locked=Giữ nhận định 'Một đội quân bị chia rẽ thì chẳng khác nào đám ô hợp'
    và quan hệ nhượng bộ 'Cho dù số lượng của chúng có đông đảo đến mấy'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000079
  kind: terminology_and_voice
  value: locked=Giữ đúng các con số tương phản (một trăm binh sĩ, đông gấp đôi quân
    số, hai mươi trận đánh riêng rẽ, mười tên địch mỗi lần) và kết luận 'nắm chắc
    phần thắng'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000080
  kind: terminology_and_voice
  value: locked=Giữ cụm 'Lẽ thường này được nhồi vào đầu mọi người chỉ huy quân sự
    ngay từ giai đoạn rất sớm' và 'trải nghiệm thực tế của chính mình'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000081
  kind: terminology_and_voice
  value: locked=Khóa chức danh 'Trung tá Pháp sư Trên không Tanya von Degurechaff';
    trần thuật ngôi thứ ba dùng đại từ 'cô'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000082
  kind: terminology_and_voice
  value: locked=Thoại độc thoại của Tanya dùng đại từ tự xưng 'Mình'; giữ đối chiếu
    giữa 'Quân đội thì đã thống nhất' và 'quốc gia này'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000083
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'chúng ta' và hình ảnh ẩn dụ 'ba cái đầu trên một thân
    xác duy nhất'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000084
  kind: terminology_and_voice
  value: locked=Giữ câu dẫn ngắn 'Giờ thì có một câu hỏi thế này:'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000085
  kind: terminology_and_voice
  value: locked=Khóa cụm 'tình thế hiểm nghèo kiểu quái thú chimera này' (this chimera
    predicament).
- segment_id: YS-LN10/Text/chapter002.xhtml/p000086
  kind: terminology_and_voice
  value: 'locked=Thoại độc thoại nghi vấn của Tanya: giữ đại từ ''họ'' và cụm ''biện
    minh cho hành động của mình trên cơ sở tính tất yếu''.'
- segment_id: YS-LN10/Text/chapter002.xhtml/p000087
  kind: terminology_and_voice
  value: locked=Khóa cụm 'giải pháp ngoại khoa' (surgical one) mở đầu chuỗi ẩn dụ
    phẫu thuật.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000088
  kind: terminology_and_voice
  value: locked=Giữ đại từ giả định khái quát 'Bạn' và hành động 'cắt phăng hai cái
    đầu thừa thãi đi'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000089
  kind: terminology_and_voice
  value: locked=Khóa 'Lục quân Đế quốc'; giữ giả định nhượng bộ ('Cho dù ca phẫu thuật
    có thể hoàn tất thành công đi chăng nữa... nếu bệnh nhân tắt thở ngay sau đó')
    và cấu trúc phủ định kép ('chẳng hề thiếu những kẻ ngu xuẩn...').
- segment_id: YS-LN10/Text/chapter002.xhtml/p000090
  kind: terminology_and_voice
  value: locked=Giữ giới hạn duy nhất 'từ trước đến nay chỉ được dạy mỗi cách tiến
    hành phẫu thuật mà thôi'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000091
  kind: terminology_and_voice
  value: locked=Giữ phủ định 'chưa từng học cách tìm kiếm bất kỳ loại giải pháp nào
    khác'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000092
  kind: terminology_and_voice
  value: locked=Giữ đúng phạm vi nhấn mạnh Markdown '*Cắt hay không cắt?*' theo DEC-P01-002;
    giữ hình ảnh 'với tay lấy lưỡi lê và tiến hành phẫu thuật' cùng đối lập 'vào lúc
    nào và ở đâu, chứ không phải là có mổ hay không'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000093
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'những ca phẫu thuật tự chọn' (elective surgeries)
    và sắc thái mỉa mai 'khéo léo đến mức gần như đáng khâm phục'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000094
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Rudersdorf', đại từ 'ông', và 'giới chóp bu' (the
    brass); giữ câu nhấn mạnh ngắn 'Quá đỗi giỏi giang là đằng khác.'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000095
  kind: terminology_and_voice
  value: locked=Giữ phủ định kép 'trí tuệ của họ chẳng hề thiếu hụt'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000096
  kind: terminology_and_voice
  value: locked=Khóa 'sĩ quan tham mưu', 'vị trung tướng' và 'phương án cắt bỏ bằng
    phẫu thuật' (surgical removal); giữ chuỗi ba tiêu chí sát hạch ('sự tàn nhẫn',
    'mức độ toan tính', 'hiểm độc đến mức nào').
- segment_id: YS-LN10/Text/chapter002.xhtml/p000097
  kind: terminology_and_voice
  value: locked=Giữ điều kiện phủ định 'sẽ chẳng nảy sinh trừ phi điều ấy là cần thiết'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000098
  kind: terminology_and_voice
  value: locked=Giữ đúng phạm vi nhấn mạnh Markdown '*Nhưng…*' theo DEC-P01-002; trần
    thuật gọi 'Tanya', đại từ 'cô'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000099
  kind: terminology_and_voice
  value: locked=Khóa 'vị trung tướng'; giữ tương phản giữa 'không hành động theo ham
    muốn cá nhân' và 'hành động để làm bất cứ điều gì cần phải làm'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000100
  kind: terminology_and_voice
  value: locked=Giữ ẩn dụ thương trường ('đóng chiếc đinh cuối cùng vào cỗ quan tài
    của một công ty đang lụi bại', 'những nhân viên gương mẫu trung thành nhất') và
    câu hỏi tu từ cuối đoạn.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000101
  kind: terminology_and_voice
  value: locked=Khóa tên đầy đủ 'Tanya von Degurechaff' và hình ảnh 'đem lòng yêu
    nước của mình mà quẳng thẳng vào cái thùng rác gần nhất'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000102
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'nó' quy chiếu về lòng yêu nước và nhận định 'đã hết giá
    trị sử dụng từ lâu'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000103
  kind: terminology_and_voice
  value: locked=Giữ câu thoại cảm thán ngắn '“Chuyện này thật lố bịch.”'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000104
  kind: terminology_and_voice
  value: locked=Giữ câu hỏi nội tâm gián tiếp tự do với đại từ 'cô' ('Liệu cô có được
    trả lương đủ hậu hĩnh cho việc này không?').
- segment_id: YS-LN10/Text/chapter002.xhtml/p000105
  kind: terminology_and_voice
  value: locked=Giữ câu trả lời phủ định dứt khoát 'Tuyệt đối không.'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000106
  kind: terminology_and_voice
  value: locked=Giữ câu hỏi nội tâm gián tiếp tự do với đại từ 'cô' và cụm 'số phận
    bi thảm cùng đất nước đã cầm chắc diệt vong của mình'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000107
  kind: terminology_and_voice
  value: locked=Giữ nhận định bác bỏ 'Chỉ riêng việc mảy may nghĩ đến ý định đó thôi
    cũng đã đủ phi lý rồi.'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000108
  kind: terminology_and_voice
  value: locked=Giữ đại từ 'cô', cụm 'vượt quá cấp bậc và bậc lương của mình' và lời
    bình mỉa mai 'Đúng là chuyện tiêu chuẩn lao động có khác.'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000109
  kind: terminology_and_voice
  value: locked=Giữ chuỗi danh ngữ liệt kê ba vấn đề ('Những khiếm khuyết trong hệ
    thống quân sự, những thất bại mang tính cấu trúc của các định chế nhà nước, và
    tệ hại nhất là việc đánh mất mọi cơ hội cứu vãn cục diện chiến lược').
- segment_id: YS-LN10/Text/chapter002.xhtml/p000110
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc', 'Tanya' và phép so sánh với 'một doanh nghiệp đang
    chật vật cầm cự qua ngày từ tháng này sang tháng khác'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000111
  kind: terminology_and_voice
  value: locked=Giữ lập luận về 'phần thưởng tương xứng', 'tiền bạc chính là biểu
    hiện chân thực nhất của niềm tin và lòng thành' và việc Tanya 'tôn trọng hợp đồng
    của mình'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000112
  kind: terminology_and_voice
  value: locked=Khóa thuật ngữ 'khế ước xã hội' (social contract), 'công ăn việc làm
    ổn định và mức thù lao tương xứng'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000113
  kind: terminology_and_voice
  value: locked=Khóa 'Lục quân Đế quốc', nhấn mạnh Markdown '*Titanic*' theo DEC-P01-002
    và điển tích 'tấm ván của Carneades'; giữ đại từ 'cô' ở câu đầu và đại từ khái
    quát 'bạn' ở câu điều kiện.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000114
  kind: terminology_and_voice
  value: locked=Giữ cụm chuyển đoạn 'Tóm lại là…'.
- segment_id: YS-LN10/Text/chapter002.xhtml/p000115
  kind: terminology_and_voice
  value: locked=Thoại độc thoại của Tanya dùng đại từ tự xưng 'Mình' và cụm 'chuyển
    nghề' (career change).
- segment_id: YS-LN10/Text/chapter002.xhtml/p000116
  kind: terminology_and_voice
  value: locked=Trần thuật gọi 'Tanya'; giữ thuật ngữ 'đào tẩu' (defection), hình
    ảnh 'Tháo chạy khỏi một con tàu đang đắm' và câu cảm thán kết chương về 'một con
    đường nghỉ hưu an toàn!'.
