    mục tiêu 'dốc toàn lực chỉ để duy trì các phòng tuyến ở nguyên vị trí vốn có'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000102
  kind: terminology_and_voice
  value: locked=Khóa 'Ildoa', điều kiện giả định 'Nếu phải giao chiến với Ildoa' và
    phủ định 'chẳng còn chút hy vọng nào để huy động nổi một cuộc tấn công'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000103
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng ta', cụm 'Về mặt lý thuyết' và câu hỏi trong thoại
    'liệu chúng ta có thể thực hiện một cuộc chiến tranh phòng ngự ở khu vực miền
    núi không?'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000104
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Romel', đại từ 'ông', thuật ngữ 'kịch bản binh cờ',
    lựa chọn duy nhất 'chuyển sang thế phòng ngự' và nhận định 'phản ánh đúng thực
    trạng bế tắc không còn lựa chọn nào khác của họ'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000105
  kind: terminology_and_voice
  value: locked=Khóa 'lục quân' và nhận định cốt lõi 'đang nhanh chóng cạn kiệt binh
    lực'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000106
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Ông', 'Cụm tập đoàn quân phía Tây', ẩn dụ 'chẳng còn
    lại gì ngoài cái vỏ rỗng', 'lính hạng nhất', hai khả năng 'hoặc đã gục ngã, hoặc
    đang được sử dụng cho mục đích giữ gìn an ninh tại các lãnh thổ chiếm đóng' và
    phủ định 'Ngay cả các sư đoàn có biên chế mỏng hơn cũng chẳng làm nên trò trống
    gì... quá ít ỏi để có thể tính đến'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000107
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ông', phủ định 'không thể thực hiện nổi một cuộc tấn
    công nào trong tương lai gần' và sự chuyển ý 'Tuy nhiên… con mắt chuyên gia trong
    ông cũng nhìn thấu mối nguy hiểm đang chĩa về một hướng khác.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000108
  kind: terminology_and_voice
  value: locked=Khóa 'Ildoa', 'Đế quốc', 'Khối Thịnh vượng chung', 'Liên bang', đại
