    chắn Đế quốc sẽ sụp đổ.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000100
  kind: terminology_and_voice
  value: locked=Khóa 'Lục quân Đế quốc' và phủ định toàn phần 'hoàn toàn không có
