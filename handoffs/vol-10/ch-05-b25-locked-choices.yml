    câu hỏi giả định 'Nhỡ đâu Khối Thịnh vượng chung hoặc Liên bang tiến quân vào
    Đế quốc thông qua ngả Ildoa thì sao?'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000109
  kind: terminology_and_voice
  value: locked=Khóa 'Lục quân Đế quốc', 'Quân đội Liên bang', 'Ildoa', đại từ 'Ông'/'mình',
    câu hỏi giả định về thời gian cầm cự và phủ định 'thậm chí chẳng cần thử mường
    tượng ra viễn cảnh đó cũng đủ thấy từng cơn ớn lạnh chạy dọc sống lưng vốn đã
    lạnh băng của mình'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000110
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc', 'mặt trận phía đông' và sắc thái 'chỉ đang chật vật
    lắm mới tự phòng vệ nổi'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000111
  kind: terminology_and_voice
  value: locked=Khóa 'Ildoa', 'tác chiến cơ động', điều kiện 'Nếu buộc phải đồng thời
    giao chiến với Ildoa ở phía nam', phủ định 'Đó không phải là môi trường thích
    hợp cho tác chiến cơ động' và hệ quả giả định 'nếu họ thiết lập được một căn cứ
    có khả năng phòng thủ tại đó, ít nhất cũng có thể kỳ vọng giữ vững được trong
    một thời gian'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000112
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc', phép so sánh hơn 'dễ xoay xở hơn nhiều so với việc
    lại phải đưa quân xuống miền nam', câu giới hạn 'Nhưng cũng chỉ được có vậy mà
    thôi.' và tính tất yếu 'không tránh khỏi việc phải rút các nguồn lực vốn được
    phân bổ cho phía đông để điều xuống phía nam'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000113
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc', ẩn dụ 'sẽ chảy cạn máu' và thế lựa chọn 'chuyện đó
    sẽ xảy ra ở phía đông hay phía nam mà thôi'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000114
  kind: terminology_and_voice
  value: locked=Khóa 'Đế quốc', 'Ildoa', 'Vị tướng', đại từ 'ông', 'mặt trận Rhine',
    'bản thổ' và câu điều kiện giả định 'Sẽ là đòn chí mạng đối với bản thổ nếu họ
    phải hứng chịu một cuộc tập kích đường không quy mô lớn.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000115
  kind: terminology_and_voice
  value: locked=Khóa 'Khối Thịnh vượng chung', đại từ 'chúng ta' và ý chống đỡ các
    đòn đánh thăm dò của địch trong tình cảnh chật vật hiện tại.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000116
  kind: terminology_and_voice
  value: locked=Khóa cấu trúc 'chẳng thể nào duy trì nổi hệ thống phòng không, chứ
    đừng nói đến phòng tuyến trên bộ, nếu các mặt trận của họ còn bị chia cắt thêm
    nữa' và lý do 'thiếu thốn trang thiết bị, nhân lực và mọi thứ khác cần thiết'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000117
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ông' và mức độ 'Chỉ riêng hai mặt trận thôi đã quá đủ
    để khiến ông phải khiếp sợ rồi.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000118
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ông' và quan hệ đồng thời 'Trong lúc ông đang lo sợ cho
    tương lai, một ý nghĩ chợt lướt qua tâm trí ông.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000119
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'ông' và phép so sánh giả định 'cứ như thể không phải
    do chính ông nghĩ ra vậy'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000120
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Romel', đại từ 'ông' và chi tiết 'nảy ra một khả
    năng mới'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000121
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'chúng ta', thuật ngữ 'đòn phủ đầu' và câu hỏi giả định
    trong thoại '“Nếu chúng ta giáng cho chúng một đòn phủ đầu thì sao…?”'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000122
  kind: terminology_and_voice
  value: locked=Khóa 'Ildoa' và quan hệ thời gian 'Vẫn còn thời gian để hạ gục Ildoa
    trước khi chúng tham chiến.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000123
  kind: terminology_and_voice
  value: locked=Khóa điều kiện 'Nếu hành động sớm' và thuật ngữ 'đòn tập kích quy
    mô lớn theo phong cách Zettour'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000124
  kind: terminology_and_voice
  value: locked=Khóa 'Ildoa', điều kiện thời gian 'trước khi Ildoa kịp tổng động viên…'
    và sắc thái tình thái 'có lẽ việc loại chúng khỏi cuộc chiến trước cả khi chúng
    cân nhắc chuyện tham gia là điều khả thi'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000125
  kind: terminology_and_voice
  value: locked=Khóa thế tương phản 'có khả năng thực hiện được, nhưng cũng chỉ thuần
    túy trên mặt lý thuyết mà thôi'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000126
  kind: terminology_and_voice
  value: locked=Khóa 'Tướng Romel', quan hệ nhượng bộ 'Dù tinh thần đã suy sụp, Tướng
    Romel vẫn giữ được cái đầu tỉnh táo và tự cười khẩy chính mình.'.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000127
  kind: terminology_and_voice
  value: locked=Khóa đúng phạm vi nhấn mạnh Markdown '*Bất khả thi.*' theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter026.xhtml/p000128
  kind: terminology_and_voice
  value: locked=Khóa đại từ tự nhủ 'Mình' và 'chúng ta', tên gọi 'Đế quốc', phủ định
    'không thể để nỗi sợ hãi xúi giục bản thân tự sát được', 'không thể chịu đựng
    nổi lúc này là tạo thêm kẻ thù' và 'chẳng biết có thể tin tưởng ai ngay trong
    nội bộ tổ chức của mình'.
