choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000298
  kind: terminology_and_voice
  value: locked=Khóa định danh 'Trung úy Sue', 'Trung tá Drake', đại từ trần thuật
    'Anh' cho Drake, 'cô ta' cho Sue, tự xưng nội tâm 'mình' và phạm vi nhấn mạnh
    Markdown '*Cứ lần lữa để sau giờ lại làm hại chính mình rồi*' theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000299
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'Trung úy Sue', thuật ngữ 'tiếp chiến' và câu mệnh
    lệnh tự ngắt lời 'Khoan đã.'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000300
  kind: terminology_and_voice
  value: locked=Khóa tên 'Drake', đại từ 'anh', chi tiết 'tiếng ù ù bên tai anh',
    nhận thức 'trận chiến này diễn ra trong không gian ba chiều' và nhận định 'vị
    trí hiện tại của họ dường như không ổn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000301
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh', thuật ngữ 'lớp vỏ phòng thủ' và quan hệ nhượng
    bộ 'dù lớp vỏ phòng thủ vẫn đang được bật'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000302
  kind: terminology_and_voice
  value: locked=Khóa đại từ độc thoại tự vấn 'Mình' và nhịp ngập ngừng 'Mình—mình
    đang…?'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000303
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh' và phạm vi nhấn mạnh Markdown '*bỏ sót điều gì*'
    khớp với từ in nghiêng trong nguồn theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000304
  kind: terminology_and_voice
  value: locked=Khóa 'Trung úy Sue', đại từ 'cô ta', 'quân địch'/'chúng' và hai câu
    hỏi nội tâm liên tiếp của Drake.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000305
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tá Drake', đại từ 'anh', phạm vi nhấn mạnh Markdown in
    hoa '*KHÔNG!*' theo DEC-P01-002 và phủ định 'Không thể nào như vậy được'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000306
  kind: terminology_and_voice
  value: locked=Khóa 'Trung úy Sue' và câu hỏi ngắn 'Nhưng tại sao chứ?'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000307
  kind: terminology_and_voice
  value: 'locked=Khóa các đại từ trong thoại của Drake: ''chúng'' (kẻ địch), ''cô
    ta'' (Sue), ''chúng ta'' (đơn vị của Drake).'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000308
  kind: terminology_and_voice
  value: locked=Khóa toàn bộ câu nội tâm in nghiêng bằng Markdown '*Mục tiêu thực
    sự của chúng là… chúng ta! Chết tiệt!*' theo DEC-P01-002.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000309
  kind: terminology_and_voice
  value: locked=Khóa tật nói lắp đầu câu 'T-tản ra!', ba mệnh lệnh liên tiếp và dấu
    chấm than ba lần '!!!' ở cuối câu.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000310
  kind: terminology_and_voice
  value: locked=Khóa giả định quá khứ 'Chỉ sớm hơn một khắc thôi là anh đã có thể
    kịp trở tay—nhưng quá muộn mất rồi', định danh 'Trung úy Sue' và đại từ 'cô ta'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000311
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Cô ta', 'anh', thuật ngữ 'những pha cơ động tấn công'
    và phủ định 'không có khả năng xoay chuyển tức thì'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000312
  kind: terminology_and_voice
  value: locked=Khóa 'Quân đội Liên bang', 'các pha cơ động né tránh' và sự đối lập
    giữa số ít lính dày dạn trận mạc với phần còn lại.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000313
  kind: terminology_and_voice
  value: locked=Khóa 'một hàng ngang vốn nhằm duy trì hỏa lực tập trung và có kiểm
    soát', 'đơn vị tình nguyện đa quốc gia' và phủ định toàn phần 'không hề có lấy
    một cơ hội nào'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000314
  kind: terminology_and_voice
  value: locked=Khóa quan hệ nhân quả 'Việc có đồng đội kề cận bên cạnh đã làm cùn
    mòn giác quan của họ'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000315
  kind: terminology_and_voice
  value: locked=Khóa cụm 'thời gian phản ứng của họ' và kết quả 'đã tỏ ra chí mạng'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000316
  kind: terminology_and_voice
  value: locked=Khóa 'Hai pháp sư Đế quốc', số lượng 'mỗi người tung ra ba thuật thức
    phát nổ' và mốc thời gian 'ngay trước khi tiếp cận'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000317
  kind: terminology_and_voice
  value: locked=Khóa cấu trúc so sánh phủ định tuyệt đối 'Không thể nào có một mục
    tiêu nào lý tưởng hơn...', định danh 'đơn vị đa quốc gia' và thuật ngữ 'thuật
    thức phát nổ' với 'phạm vi tác động rộng lớn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000318
  kind: terminology_and_voice
  value: locked=Khóa phủ định mức độ 'không đến mức phi thường', giả định trái thực
    tế 'lẽ ra vẫn có thể tự bảo vệ mình' và cặp thuật ngữ 'lớp vỏ phòng thủ' – 'màn
    chắn bảo hộ'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000319
  kind: terminology_and_voice
  value: locked=Khóa phủ định 'đây lại chẳng phải hoàn cảnh bình thường', tên 'Drake'
    và chi tiết độ cao 'tám nghìn'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000320
  kind: terminology_and_voice
  value: locked=Khóa 'pháp sư trên không', cụm 'trong phạm vi giới hạn của trang bị'
    và phủ định 'không thích nghi tốt với những môi trường khắc nghiệt'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000321
  kind: terminology_and_voice
  value: locked=Khóa giả định quá khứ 'lẽ ra họ có thể vượt qua một cách tương đối
    nguyên vẹn', nguyên nhân 'tình trạng thiếu oxy và nhiệt độ đóng băng', hành động
    'hạ độ cao' và nhận định 'Đây quả là một cái bẫy thâm độc'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000322
  kind: terminology_and_voice
  value: locked=Khóa 'Đội hình hàng ngang tan vỡ', thuật ngữ 'các thuật thức lọc không
    khí' và 'quân Đế quốc'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000323
  kind: terminology_and_voice
  value: 'locked=Khóa cấu trúc liệt kê ba đợt thuật thức: đợt đầu gây hoảng loạn,
    đợt hai phá vỡ đội hình hàng ngang, đợt ba tàn sát binh lính đang tháo chạy hỗn
    loạn.'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000324
  kind: terminology_and_voice
  value: locked=Khóa 'màn oanh kích ba đợt', mệnh đề loại trừ '—trừ những người lính
    dày dạn kinh nghiệm hơn—' và thiệt hại của 'hai đại đội đầu tiên'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000325
  kind: terminology_and_voice
  value: locked=Khóa hình ảnh 'Cơ thể người rơi như mưa từ trên trời xuống' và hai
    câu điều kiện liên tiếp về việc tỉnh lại trước khi chạm đất cùng luồng không khí
    siêu nhiệt tràn vào phổi.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000326
  kind: terminology_and_voice
  value: locked=Khóa phủ định 'giờ không phải lúc để lo lắng cho người khác' và tên
    'Drake'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000327
  kind: terminology_and_voice
  value: 'locked=Khóa hai câu khẩu lệnh của Drake: ''Quân địch đang tiếp cận cực nhanh!
    Chuẩn bị cận chiến!''.'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000328
  kind: terminology_and_voice
  value: locked=Khóa 'Quân Đế quốc', 'lợi dụng trọng lực để bổ nhào' và 'các thành
    viên đơn vị đa quốc gia'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000329
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh', ẩn dụ 'những tử thần ấy đã cầm sẵn lưỡi hái trong
    tay', 'Những lưỡi kiếm được cường hóa ma pháp' và 'hai ác quỷ'.
- segment_id: YS-LN10/Text/chapter010.xhtml/p000330
  kind: terminology_and_voice
  value: locked=Khóa tên 'Drake', đại từ 'mình'/'anh' và hình ảnh so sánh tình thái
    'Hoặc có lẽ chừng ấy thời gian chỉ đủ để anh biết được cảm giác của một tù nhân
    khi nhận ra mình chỉ còn cách máy chém vài khoảnh khắc mà thôi…'.
