choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000152
  kind: terminology_and_voice
  value: locks=['Khóa nhận định khái quát mở đầu về thôi thúc bản năng của các sĩ
    quan luôn suy tính động tĩnh kẻ địch dù lúc ngủ hay lúc thức.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự nhủ ngôi thứ nhất 'Mình', tên 'Liên bang' và sắc thái
    cảm thán trước tầm vươn của Liên bang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'sĩ quan chính trị', danh xưng 'Đại tá Mikel', đại
    từ 'anh' (chỉ Drake), tên 'Lục quân Đế quốc' và chi tiết tập hồ sơ tuyệt mật được
    dịch thuật tỉ mỉ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa tên cơ quan 'Bộ Dân ủy Nội vụ của Liên bang', đại từ 'anh' và
    sự đối lập giữa tiếng xấu của cơ quan này với giá trị không thể nghi ngờ của tập
    tài liệu."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tướng Zettour', đại từ 'ông ta' (chỉ Zettour
    từ góc nhìn của Drake), định danh 'Drake', tên 'Liên bang', chi tiết liệt kê nhãn
    hiệu xì gà và trà, cùng nét châm biếm Zettour thích cà phê đen giống như tâm địa
    của ông ta."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm mở đầu, định danh 'Drake' - 'Zettour', biệt
    danh 'Ác quỷ sông Rhine' và thông tin trong báo cáo rằng hai người có quan hệ
    thân thiết."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa tên 'Bộ Dân ủy Nội vụ của Liên bang', biệt danh 'Ác quỷ sông
    Rhine', định danh 'Drake', đại từ 'anh', vị trí nhấn mạnh Markdown duy nhất '*cũng*'
    theo DEC-P01-002 (không nhấn mạnh thẻ neo trang) và câu hỏi hài hước về sức mạnh
    gắn kết của thức uống."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', tên 'Liên bang' và tâm lý vừa thấy hơi tham lam
    vừa tự nhiên thắc mắc cách Liên bang thu thập được thông tin."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000160
  kind: terminology_and_voice
  value: locks=["Khóa lời tự nhủ ngôi thứ nhất với đại từ 'Mình' thể hiện sự tò mò
    muốn biết thêm."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000161
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'anh' và sự tương phản giữa lời thì
    thầm vang khắp căn lều với nhận thức rằng thông tin đó nằm ngoài tầm với rất xa."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000162
  kind: terminology_and_voice
  value: locks=["Khóa nhận định khẳng định cấp so sánh nhất ('Nguồn tin của họ là
    bí mật được canh giữ nghiêm ngặt nhất')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000163
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'cơ quan nội vụ', đại từ 'anh', cấu trúc tăng tiến phủ định
    ('ngay trong cơ quan nội vụ cũng chẳng mấy ai biết, huống hồ là các đồng minh
    nước ngoài của họ'), giả định phủ định ('kể cả khi anh có cơ hội hỏi tới') và
    hệ quả làm sứt mẻ mối quan hệ vốn đã mong manh."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000164
  kind: terminology_and_voice
  value: locks=["Khóa lời tự nhủ với đại từ 'mình', thành ngữ 'trong tình yêu và chiến
    tranh thì không từ thủ đoạn nào' và quyết định không chõ mũi vào chuyện này."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000165
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', hai vị trí nhấn mạnh Markdown theo DEC-P01-002
    ('*Liên bang*', '*Khối Thịnh vượng chung*') và chi tiết cung cấp thông tin trước
    cả khi anh kịp yêu cầu."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000166
  kind: terminology_and_voice
  value: locks=["Khóa lời tự nhủ của Drake với danh xưng 'Chúa', đại từ 'Mình' và
    câu chơi chữ 'chỉ có điều bất khả thi mới là bất khả thi mà thôi'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000167
  kind: terminology_and_voice
  value: locks=["Khóa tình thái phỏng đoán ('Có lẽ'), tên 'Liên bang' và sắc thái
    'về mặt danh nghĩa thì họ là đồng minh'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000168
  kind: terminology_and_voice
  value: locks=['Khóa nhận định tích cực về tín hiệu đáng mừng cho tương lai.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000169
  kind: terminology_and_voice
  value: locks=["Khóa tên 'Lục quân Đế quốc', 'Liên bang', đại từ 'anh' và tâm thế
    hiếm hoi lắm mới cảm thấy biết ơn Liên bang vì muốn tung đòn phản kích kẻ địch."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000170
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'Anh' và quan hệ nhân quả thúc đẩy
    Drake nuốt nỗi khổ vào lòng để bắt đầu huy động những người sẵn sàng chiến đấu."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000171
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', các thuật ngữ 'đơn vị đa quốc gia', 'đoàn phóng
    viên', 'Quân đội Liên bang' và hành động dựng màn trình diễn ca ngợi sự hợp tác
    trước báo giới quốc tế."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000172
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh', cụm 'những người Cộng sản' và thái độ miễn cưỡng
    nhưng chấp nhận việc ảnh bắt tay bị đăng tràn lan trên báo quốc tế như một phần
    công việc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000173
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' và hành động tự ép mình bắt tay và mỉm cười; không
    dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000174
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' và kết quả làm hài lòng đất nước mình."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000175
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', 'Trung úy Sue', 'Andrew', đại từ 'anh', vị
    trí nhấn mạnh Markdown '*háo hức chụp ảnh đến thế cơ mà*' theo DEC-P01-002, câu
    hỏi tu từ xem nhẹ lời càu nhàu của cô bé không hiểu chính trị và hành động trút
    bực dọc lên người bạn nhà báo."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000176
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake', đại từ 'anh', thuật ngữ 'Đơn vị
    tình nguyện đa quốc gia', tên 'Đế quốc' và mục tiêu đón đầu cuộc phản công nhằm
    làm nhụt bước tiến về phía tây."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000177
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Đại tá Mikel', 'Trung tá Drake', cụm 'liên minh Liên
    bang – Khối Thịnh vượng chung', 'Phía Khối Thịnh vượng chung' và 'đội ngũ sĩ quan
    chính trị'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000178
  kind: terminology_and_voice
  value: locks=["Khóa các định danh 'Quân đội Liên bang', 'Lục quân Đế quốc', 'Trung
    tướng Zettour', 'Liên bang', đại từ 'anh' và nội dung kế hoạch nhử địch ra trước
    khi bao vây tiêu diệt hoàn toàn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000179
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', hình ảnh so sánh thông tin gần như hoàn hảo 'giống
    hệt một trò ảo thuật đã bị vạch trần' và sự hào hứng chuẩn bị cho kẻ địch nếm
    mùi thất bại cay đắng."]
