segment_id_end: YS-LN10/Text/chapter022.xhtml/p000161
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000127
  kind: terminology_and_voice
  value: locks=['Khóa lời đáp lịch thiệp của Tanya cảm ơn lời đề nghị hào phóng từ
    Tham tán Conrad.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba với tên 'Tanya' cúi đầu cảm ơn chân thành
    và 'Đại tá Lergen' xen vào với vẻ mặt khó chịu ('như vừa nuốt phải một con bọ
    xít')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với cách gọi 'Thưa Tham tán', đại từ 'ông',
    hành động 'lôi kéo nhân sự' và tên tổ chức 'Văn phòng Bộ Tổng tham mưu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Conrad với câu hỏi tu từ ('Ông thấy việc cả hai
    chúng ta đều mong muốn cùng một thứ là lạ lắm sao?') và đại từ 'Ông' - 'cả hai
    chúng ta'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật mô tả sự nhượng bộ bằng nụ cười thoải mái của
    'Tham tán Conrad'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại chuyển hướng về chủ đề chính của Conrad, giữ thuật
    ngữ 'điều kiện giảng hòa', 'bên lục quân', 'Đế quốc' và đại từ 'Các ông'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000133
  kind: terminology_and_voice
  value: locks=["Khóa câu trả lời phủ định ngắn gọn của Lergen với đại từ ngôi thứ
    nhất số nhiều ('Chúng tôi không biết')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với 'Đại tá Lergen', 'Tham tán Conrad' và đại
    từ 'Ông ta' (Conrad) nhíu mày ngậm chặt điếu xì gà thể hiện sự bất mãn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa câu mệnh lệnh phủ định của Conrad ('Đừng đùa nữa, thưa Đại tá')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000136
  kind: terminology_and_voice
  value: locks=["Khóa lời khẳng định phủ định của Lergen ('Tin tôi đi, thưa Tham tán—đây
    không phải chuyện đùa đâu')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với cách gọi 'Đại tá Lergen', xưng hô 'tôi'
    - 'ông', chức danh 'tham tán', tổ chức 'Bộ Tư lệnh Tối cao' và thẩm quyền tiếp
    cận bí mật quân sự."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn nội tâm ngôi thứ nhất với đại từ tự quy chiếu 'mình'
    theo DEC-P01-001, đại từ 'Ông ta' / 'vị tham tán' (Conrad), 'bên quân đội' / 'quân
    đội' và thuật ngữ 'nguyên tắc chỉ-biết-khi-cần nghiêm ngặt'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000139
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật nội tâm với đại từ tự quy chiếu 'mình' theo DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000140
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm với đại từ 'mình' theo DEC-P01-001, cấu trúc
    phủ định đối lập ('không phải là vị tham tán—mà là *mình*') và hai vị trí nhấn
    mạnh Markdown '*đó*', '*mình*' theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000141
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm với đại từ 'mình', cụm 'thành viên của bộ
    tham mưu', cấp bậc 'trung tá pháp sư' và tình thái phỏng đoán ('Có lẽ')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ nhất với đại từ 'mình' theo DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000143
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại xin phép rời cuộc họp của Tanya với cách gọi 'Thưa
    Đại tá', đại từ 'tôi', phủ định thẩm quyền ('không đủ thẩm quyền') và câu hỏi
    xin phép ở cuối đoạn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm với đại từ 'Mình' / 'mình', cách gọi 'sếp'
    (Lergen), thuật ngữ 'tiền tuyến' và tình thái suy đoán ('ắt hẳn')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa câu tự nhận xét nội tâm với tình thái 'Có lẽ' và đại từ 'mình'
    theo DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000146
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ nhất ('Mình'), danh xưng 'vị đại tá'
    và câu thoại ngăn cản của Lergen ('Không, cô cứ ngồi nguyên tại chỗ đi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ nhất với tên 'Đại tá Lergen' và đại
    từ 'mình'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ nhất với đại từ 'mình' và 'ông ấy' (chỉ
    cấp trên Lergen)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa sự tách biệt điểm nhìn đặc trưng trong cùng một đoạn giữa chủ
    thể suy nghĩ ngôi thứ nhất ('Mình' theo DEC-P01-001) và nhân vật ngôi thứ ba ('Tanya',
    'cô'), cùng phủ định kép về việc 'Đại tá Lergen' ('ông ấy') không mạo hiểm chia
    sẻ thông tin."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm in nghiêng '*Chuyện gì đang diễn ra thế này?*'
    theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen gọi Tanya là 'Trung tá', đại từ 'cô', tình
    thái 'có lẽ' và phủ định ('sẽ không muốn biết đâu')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ nhất với đại từ 'Mình', 'ông ấy' (Lergen)
    và hai cấu trúc phủ định ('chẳng mảy may hiểu', 'hầu như không còn lựa chọn nào
    khác')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với cách gọi 'Thưa Tham tán', xưng hô 'tôi'
    - 'ông', phủ định nhấn mạnh ('hoàn toàn không phải là bí mật'), quan hệ nhân quả
    ('Do đó') và so sánh mức độ ('còn nghiêm trọng hơn thế rất nhiều')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận xét nội tâm ngắn mang sắc thái phủ định dự cảm ('chắc
    chắn là chẳng lành chút nào rồi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật nội tâm ngôi thứ nhất với đại từ 'Mình' / 'mình'
    và tình thái đối lập giữa ý muốn rời đi ('gần như muốn rời khỏi đây') với nhận
    thức trách nhiệm ('có lẽ đây là chuyện mà mình nên nghe')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000156
  kind: terminology_and_voice
  value: locks=['Khóa câu thoại ngắn nhắc nhở thận trọng lắng nghe của Lergen.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ nhất với tên 'Tham tán Conrad' và đại
    từ 'mình' chỉnh lại tư thế ngồi."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba mang tính báo trước về lời sắp nói
    của 'Đại tá Lergen' ('ông') so sánh với 'quả bom' mà 'Tanya' vừa thả xuống trước
    mặt 'vị tham tán'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với cấu trúc rào đón phủ định ('Sẽ chẳng
    phải là nói quá chút nào nếu bảo rằng, xét theo một nghĩa nhất định') và ba chủ
    thể 'Văn phòng Bộ Tổng tham mưu', 'Bộ Tư lệnh Tối cao', 'chính phủ' có chung một
    quan điểm."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000160
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Conrad với cụm 'Lời rào đón', điều kiện giả định
    ('Nếu chuyện đó đã là điều ai cũng biết như vậy') và thắc mắc phủ định của phía
    ngoại giao ('tại sao đến giờ chúng tôi vẫn chưa biết gì về nó')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000161
  kind: terminology_and_voice
  value: locks=["Khóa lời khẳng định đảo ngược của Lergen với cách gọi 'Thưa Tham
    tán' và nhịp nhấn mạnh lặp lại ('ngược lại mới đúng. Hoàn toàn và tuyệt đối ngược
    lại mới đúng')."]
