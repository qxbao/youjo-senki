choices:
- segment_id: YS-LN10/Text/chapter004.xhtml/p000187
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Chúng ta', cụm 'những người lính vì quê hương Heimat,
    vì Đế quốc' và cấu trúc phủ định 'không thể mong cầu gì hơn ngoài điều đó'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000188
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi' và câu đồng tình dứt khoát 'Tôi hoàn toàn đồng ý.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000189
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Chúng ta', 'mình' và kỳ vọng chọn đúng cách thức thực
    hiện phương án tốt nhất.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000190
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', đại từ 'họ', 'anh' và ý khẳng định làm ngơ trước
    tiếng gọi của bổn phận là điều cuối cùng trên đời anh có thể làm.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000191
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh', cụm 'quê hương Heimat' và mức độ so sánh 'nồng
    cháy hơn hầu hết mọi người'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000192
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'Đại tá', tên 'Tham tán Conrad', 'Bộ Ngoại giao', 'Đế
    quốc', đại từ 'chúng ta', 'mình' và chỉ thị xoay xở với những gì đang có.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000193
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'Ngài', tên 'Trung tá Uger' và câu hỏi xin
    phép mượn người.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000194
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh', cụm 'mặt trận phía đông', tên 'Zettour' và mệnh
    đề điều kiện phủ định về cơn thịnh nộ khi các đoàn tàu ngừng chạy đúng giờ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000195
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', 'Uger', đại từ 'anh', 'mình' và cấu trúc phủ định
    kép 'khó lòng đủ để làm lý do khiến anh từ bỏ việc tranh thủ sự trợ giúp của Uger'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000196
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi' và cụm 'Tất cả là vì quê hương Heimat.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000197
  kind: terminology_and_voice
  value: locked=Khóa câu đáp ngắn gọn 'Hoàn hảo.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000198
  kind: terminology_and_voice
  value: locked=Khóa 'Trung tướng Rudersdorf', đại từ 'Ông' và chi tiết bật cười sảng
    khoái như vừa trút được gánh nặng.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000199
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'anh', danh xưng 'Đại tá', đại từ 'chúng
    ta' và mệnh đề điều kiện về lối thoát trong quỹ thời gian hạn hẹp.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000200
  kind: terminology_and_voice
  value: locked=Khóa danh xưng 'thưa Tướng quân', đại từ 'Tôi' và lời cam kết 'Tôi
    xin lấy danh dự ra đảm bảo.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000201
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'tôi' – 'anh' và lời trao quyền 'Anh đang hành động
    theo thẩm quyền của tôi.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000202
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', 'vị tướng' và chuỗi hành động chào nghiêm trang
    theo điều lệnh rồi xin phép cáo lui.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000203
  kind: terminology_and_voice
  value: locked=Khóa 'Vị đại tá', đại từ 'anh' và nhận định vẫn còn một chút thời
    gian trước cuộc hẹn tiếp theo.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000204
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh', 'mình' và chi tiết luôn trong trạng thái căng thẳng
    cảnh giác từ lúc bước ra khỏi giường.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000205
  kind: terminology_and_voice
  value: locked=Khóa 'Vị đại tá', 'Tham tán Conrad' và 'Trung tướng Rudersdorf' theo
    đúng trình tự hai cuộc họp buổi sáng.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000206
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh', 'mình', cụm 'bánh mì K-Brot' và quan hệ nhân quả
    giữa hai cuộc họp hiệu quả với sự kiệt sức về tinh thần.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000207
  kind: terminology_and_voice
  value: locked=Khóa cấu trúc phủ định 'chẳng có cách nào trốn tránh được cơn đói'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000208
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', đại từ 'mình' và cụm 'nhà ăn của Văn phòng Bộ Tổng
    tham mưu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000209
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh', cụm 'nhà ăn tập thể' và sự đối lập giữa thói quen
    ra ngoài ăn trước kia với bối cảnh thời chiến.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000210
  kind: terminology_and_voice
  value: locked=Khóa đại từ độc thoại tự xưng 'mình' của Lergen và ý tự giễu về việc
    chấp nhận mùi vị kinh khủng chỉ vì sự tiện lợi.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000211
  kind: terminology_and_voice
  value: locked=Khóa giả định 'Nếu không có chiến tranh, chuyện này có lẽ sẽ chẳng
    bao giờ xảy ra.' và cụm 'phòng khánh tiết tại Văn phòng Bộ Tổng tham mưu'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000212
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', thuật ngữ 'chiến tranh tổng lực' và nhận định biến
    điều không thể thành có thể.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000213
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh', 'mình', cụm 'phòng khánh tiết xa hoa' và trình
    tự ăn nhanh rồi về văn phòng pha trà rẻ tiền trước cuộc họp kế tiếp.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000214
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'anh' và chi tiết nghe thấy âm thanh từ phía bên kia đúng
    lúc vừa chạm tới cánh cửa.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000215
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Tôi', định danh 'Trung tá Degurechaff' và danh xưng kính
    trọng 'thưa Đại tá' khi báo cáo với Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000216
  kind: terminology_and_voice
  value: locked=Khóa tên 'Degurechaff', đại từ 'cô', các cụm 'sĩ quan cấp tá', 'binh
    lính dưới quyền', 'học viện quân sự', 'Văn phòng Bộ Tổng tham mưu' và đánh giá
    tích cực từ góc nhìn của Lergen.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000217
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'họ', 'cô', tên 'Degurechaff' và nét hài hước đen tối
    về nguy cơ dẫn đến ngày tận thế nếu có quá nhiều người như cô trên chiến trường.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000218
  kind: terminology_and_voice
  value: locked=Khóa tên 'Lergen', đại từ 'cô' và câu khẳng định 'Lergen vẫn ngưỡng
    mộ cô.'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000219
  kind: terminology_and_voice
  value: locked=Khóa đại từ ngôi thứ hai 'Cô' (Lergen gọi Tanya) và lời khen đến đúng
    giờ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000220
  kind: terminology_and_voice
  value: locked=Khóa cụm 'Vị trung tá pháp sư trên không', tên 'Lergen', 'Đại tá Lergen',
    đại từ 'cô', 'mình' và lý giải của Lergen về sự coi trọng tính đúng giờ.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000221
  kind: terminology_and_voice
  value: locked=Khóa đại từ 'Anh', 'Đế quốc' và nhận định mọi rắc rối của Đế quốc
    đều liên quan đến vấn đề thời điểm.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000222
  kind: terminology_and_voice
  value: locked=Khóa 'Đại tá Lergen', 'Lergen', cụm 'Vị sĩ quan ma pháp trên không',
    tên 'Degurechaff', đại từ 'anh', 'cô' và đánh giá về sự quyết đoán của Tanya trong
    lúc thời gian khan hiếm.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000223
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Tôi' – 'ngài', danh xưng 'thưa Đại tá' và cụm 'mệnh
    lệnh vô lý thích đáng'.
- segment_id: YS-LN10/Text/chapter004.xhtml/p000224
  kind: terminology_and_voice
  value: locked=Khóa cặp xưng hô 'Chúng tôi' – 'cô' và thông báo cử Tanya sang hướng
    tây trong những ngày tới.
