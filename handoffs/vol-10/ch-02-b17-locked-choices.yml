choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000220
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' (chỉ Drake), thuật ngữ 'một tiểu đoàn duy nhất',
    biệt danh 'Ác quỷ sông Rhine' và nhận định kỳ vọng của phía Drake rằng với quân
    số này lẽ ra họ phải chiếm được thế thượng phong."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000221
  kind: terminology_and_voice
  value: locks=["Khóa bước ngoặt thực tế trái ngược kỳ vọng ('Ít nhất là họ đã nghĩ
    vậy'), định danh 'đơn vị của Drake', cụm 'hai pháp sư Đế quốc' và câu hỏi nội
    tâm thắc mắc vì sao đã đạt độ cao thích hợp mà vẫn không theo kịp tốc độ đối phương."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000222
  kind: terminology_and_voice
  value: locks=["Khóa nét lắp bắp 'Ch-chúng' và thông số 'độ cao mười nghìn' trong
    lời báo cáo."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000223
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'anh' và cấu trúc nhấn mạnh phủ định
    rằng Drake chẳng cần nghe báo cáo cũng thấy rõ bằng chính hai mắt mình."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000224
  kind: terminology_and_voice
  value: locks=['Khóa thế đối lập giữa việc kiềm chế được lời mỉa mai với việc không
    ngăn được bản thân chửi thề.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000225
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ta' / 'chúng', tên khí tài 'mẫu Type 97', mốc độ cao
    'tám nghìn' và câu chửi thề phẫn nộ của Drake."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000226
  kind: terminology_and_voice
  value: locks=["Khóa nhận định so sánh tuyệt đối ('Chẳng có gì ức chế hơn việc phải
    chịu bất lợi về độ cao chỉ vì khí tài thua kém') và hình ảnh ẩn dụ buộc phải đối
    đầu một thợ săn lão luyện bằng mớ vũ khí tồi tàn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000227
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ nội tâm không in nghiêng của Drake với đại từ
    'chúng ta' trách móc đám người ở quê nhà không gửi trang bị ra hồn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000228
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'các biên đội trong tiểu đoàn', 'đồng đội cùng
    biên đội', đại từ 'Anh' và tình thái dự đoán 'có lẽ họ sẽ vượt qua được trận này'
    nếu bám sát và phối hợp với nhau."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000229
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cô ta' (chỉ người lính tách đội hình là Sue) và nhận
    xét cô thiếu nhận thức rằng phối hợp đồng đội là cách duy nhất khỏa lấp khoảng
    cách công nghệ; không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000230
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' / 'chúng' trong lời hô của Sue yêu cầu yểm trợ
    để kéo địch xuống."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000231
  kind: terminology_and_voice
  value: locks=["Khóa câu gọi thốt lên đầy bất ngờ 'Trung úy Sue?!'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000232
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Drake', đại từ 'Anh' trong trần thuật và câu hỏi
    nội tâm in nghiêng bằng Markdown '*Mình có nên cản cô ta lại không?*' theo đúng
    DEC-P01-001 và DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000233
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán nội tâm in nghiêng toàn bộ bằng Markdown '*Chết
    tiệt thật.*' theo đúng DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000234
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' / 'cô ta' và quyết định bất đắc dĩ phải để Sue
    hành động."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000235
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung úy Sue', đại từ 'Anh' và lý do chênh lệch độ
    cao quá lớn buộc Drake phải trông cậy vào pha lao lên liều mạng của Sue để thu
    hẹp khoảng cách."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000236
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng đầy đủ 'Trung tá Drake' và sự thay đổi cách nhìn nhận
    tình thế trong tâm trạng ngán ngẩm."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000237
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' và thế đối lập giữa mong muốn tác chiến như một
    khối gắn kết với nhận thức đây không phải lúc cứng nhắc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000238
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Sue', đại từ 'anh' / 'cô ta', cụm ẩn dụ 'quân bài
    bất định' và cấu trúc điều kiện tận dụng cô đúng như vậy."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000239
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung úy Sue', thuật ngữ 'Thuật thức bắn tỉa quang
    học', thông số 'bốn nghìn' và chuỗi mệnh lệnh dồn dập lưu ý chênh lệch độ cao
    khi ngắm bắn quân Đế quốc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000240
  kind: terminology_and_voice
  value: locks=["Khóa bước chuyển điểm nhìn sang phía 'Tanya' nhìn xuống từ vị trí
    cao vợi trên bầu trời."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000241
  kind: terminology_and_voice
  value: locks=["Khóa lời khen ngợi 'Viên chỉ huy của địch đang làm rất xuất sắc'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000242
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc tăng tiến 'Không những... mà... còn' (cùng chủ thể
    'anh ta' chỉ chỉ huy địch), đại từ nội tâm 'chúng ta', các thông số 'tám nghìn
    bộ', 'sáu nghìn bộ' và các thuật ngữ 'ngưỡng trần bay mềm', 'các mẫu quả cầu đời
    cũ', 'các pháp sư trên không'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000243
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'quả cầu tính toán Type 97 lõi kép', 'những mẫu
    lõi đơn', đại từ 'chúng ta' và tình thái suy luận của Tanya ('hẳn việc đạt được
    điều này chẳng hề dễ dàng', 'Ắt hẳn phải có bí quyết gì đó')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000244
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'hỏa lực chế áp', 'thuật thức quang học', 'thuật
    thức dẫn đường', 'lớp vỏ phòng thủ', 'màn chắn bảo hộ', 'các pha cơ động né tránh',
    đại từ 'chúng ta' và thế lưỡng nan chiến thuật; không dùng nhấn mạnh Markdown
    cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000245
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm tự quy chiếu 'mình' của Tanya theo DEC-P01-001,
    cụm 'kẻ địch của chúng ta' và nhận định thế giới bị chi phối bởi các định luật
    vật lý."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000246
  kind: terminology_and_voice
  value: locks=["Khóa câu khẳng định phủ định ngắn gọn 'Có những chuyện đơn giản là
    không thể làm được'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000247
  kind: terminology_and_voice
  value: 'locks=[''Khóa lập luận về quy luật tự nhiên và giới hạn: đôi khi phải vượt
    qua giới hạn nhưng giới hạn vẫn là giới hạn và mánh khóe chỉ giúp đi xa tới một
    mức độ nhất định.'']'
- segment_id: YS-LN10/Text/chapter010.xhtml/p000248
  kind: terminology_and_voice
  value: locks=["Khóa cụm nội tâm in nghiêng bằng Markdown '*Đến lúc rồi*' theo DEC-P01-002,
    định danh 'Tanya', đại từ trần thuật 'cô' và danh xưng 'Trung úy Serebryakov'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000249
  kind: terminology_and_voice
  value: locks=["Khóa hô hiệu '02' và mệnh lệnh bắt đầu phản công của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000250
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp xác nhận qua vô tuyến '02 nghe rõ'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000251
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Viên sĩ quan phụ tá', đại từ 'cô', định danh 'Tanya'
    và chi tiết vẫy súng đáp lời khiến Tanya mỉm cười."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000252
  kind: terminology_and_voice
  value: locks=["Khóa giả định 'Giả sử như chúng ta bổ nhào thẳng xuống đội hình của
    họ', đại từ nội tâm 'Mình' / 'chúng ta' và mức độ chắc chắn 'Mình dám chắc' của
    Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000253
  kind: terminology_and_voice
  value: locks=['Khóa câu thoại bỏ lửng của Tanya xác định thời điểm quân địch không
    thể leo cao thêm được nữa.']
- segment_id: YS-LN10/Text/chapter010.xhtml/p000254
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại tiếp nối bị ngắt giữa chừng, đại từ 'cô' và cụm in
    nghiêng bằng Markdown '*chấm nhỏ*' theo đúng DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000255
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh ví von 'một con lợn rừng đang bay về phía chúng ta'
    trong lời thoại của Tanya."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000256
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô 'thưa Trung tá' — 'Tôi' của Serebryakov với Tanya,
    đại từ trung tính 'Kẻ đó' (không suy diễn giới tính mục tiêu từ xa theo DEC-P01-001)
    và hai câu hỏi ngạc nhiên liên tiếp."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000257
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa vẻ cảm phục của 'viên sĩ quan phụ tá' với
    thái độ khinh miệt kẻ địch của 'Tanya'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000258
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trung tính 'kẻ đó' và nhận định của Tanya rằng mục tiêu
    đã vứt bỏ mọi logic để hành động liều lĩnh."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000259
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', cách gọi trung tính 'kẻ đó', tiểu từ lễ phép 'ạ'
    và nhận xét của Serebryakov rằng việc còn thở được ở độ cao này chứng tỏ bản lĩnh
    hơn hẳn đồng đội."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000260
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Viên sĩ quan phụ tá của Tanya', thuật ngữ 'pháp sư trên
    không', từ in nghiêng '*chấm nhỏ*' theo DEC-P01-002, đại từ nội tâm 'chúng ta',
    cách gọi trung tính 'kẻ đó' / 'tên pháp sư kia' và cấu trúc giả định trái thực
    tế đối lập giữa chạm trán khi đi lẻ với tự ý bỏ lại toàn bộ đội hình phía sau."]
