choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000188
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp lễ phép 'Vâng, thưa ngài. Tôi nên bắt đầu từ đâu ạ?'
    của Trung tá Drake trước cấp trên."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000189
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'vụ nổ súng nhầm' và câu hỏi truy vấn trực tiếp 'Thực sự
    đã có chuyện gì xảy ra?' của Tướng Habergram."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000190
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ ba 'anh' (chỉ Drake) và 'cô ta' (chỉ Mary Sue),
    mệnh đề nhượng bộ 'Dù chỉ trên danh nghĩa', phủ định 'Tuy không nắm toàn quyền
    đối với cô ta', và nhận định 'anh vẫn phải gánh chịu một phần trách nhiệm'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000191
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'phụng sự Hoàng gia' và nhận định 'đây là điều không thể
    tránh khỏi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000192
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đại từ 'anh', cụm 'nhận định chuyên môn của
    anh trên cương vị là người phụ trách vào thời điểm xảy ra sự cố', và nỗ lực giữ
    giọng bình tĩnh khi lên tiếng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000193
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa báo cáo chính thức ('thiệt hại ngoài ý muốn
    phát sinh từ cảnh hỗn loạn trong trận chiến') và thực tế ('một pháp sư tình nguyện
    đã phớt lờ mệnh lệnh của tôi và tự ý hành động')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000194
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'thiệt hại ngoài ý muốn', tên riêng 'Liên bang', và
    câu hỏi có dấu chấm lửng 'Tình hình nghiêm trọng đến mức nào… mà phía Liên bang
    lại làm ầm ĩ lên như thế?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000195
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'thuật thức' và câu trả lời ngắn gọn 'Đáng tiếc là
    thuật thức đó quá mạnh'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000196
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc tăng tiến khác chủ thể 'Không những Drake phải đứng
    ra nhận lỗi trước các sĩ quan chính trị, mà Trung úy Sue—kẻ đã gây ra toàn bộ
    mớ hỗn độn này—sau đó lại còn trò chuyện vui vẻ với họ', danh xưng 'Đại tá Mikel',
    tên riêng 'Liên bang', và chi tiết hai bản báo cáo khớp nhau."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000197
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'sĩ quan cấp tá của Liên bang', chi tiết bị cuốn vào vụ
    nổ và thiệt mạng, cùng mệnh đề rào đón 'Tuy không chính thức, nhưng thông tin
    này đến từ một nguồn đáng tin cậy của tôi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000198
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh 'làm dòng máu đang sôi sục trong người anh lạnh toát
    ngay tức khắc', danh xưng 'Trung tướng Zettour', và nhận định 'việc Drake vẫn
    còn giữ được quyền chỉ huy quả là một phép màu'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000199
  kind: terminology_and_voice
  value: locks=["Khóa tên cơ quan 'Bộ Ngoại giao' và chi tiết cơ quan này phải hứng
    chịu phần lớn hệ lụy."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000200
  kind: terminology_and_voice
  value: locks=['Khóa câu hỏi nội tâm gián tiếp của Drake về việc liệu bản thân mình
    có phải chịu hậu quả gì không.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000201
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'chẳng thể đưa ra lời xin lỗi chính thức với họ được',
    phương án xử lý 'để thủ tướng của chúng ta xin lỗi riêng phía Cộng sản', và câu
    kết 'Chuyện đó coi như khép lại tại đây. Anh vất vả rồi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000202
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và phủ định hoàn toàn 'không hề có lấy một chút
    trách móc hay... nào' trong câu nói cuối cùng của cấp trên."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000203
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi thảng thốt ngắn 'Sao cơ ạ?' của Drake."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000204
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá', cặp đại từ xưng hô 'tôi' - 'chúng ta', phủ
    định về việc khiển trách cấp dưới vô nghĩa hay trút đòi hỏi vô lý của giới chính
    trị gia lên đầu các nam nữ quân nhân ngoài chiến trường, và ý nguyện già đi một
    cách đàng hoàng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000205
  kind: terminology_and_voice
  value: locks=["Khóa nhịp ngắt 'gần như cảm thấy mình được miễn trừ khỏi mọi trách
    nhiệm trong vụ việc này. Gần như thôi…' và phủ định kép 'không thể để bản thân
    mình thoát khỏi sự trừng phạt được'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000206
  kind: terminology_and_voice
  value: locks=['Khóa quan hệ nhân quả giải thích lý do Drake tự viết bản báo cáo
    riêng bất chấp việc biết rõ làm vậy là bất kính.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000207
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' - 'anh' trong lời Tướng Habergram, thuật ngữ
    'đơn vị tình nguyện đa quốc gia', và danh xưng 'Trung úy Sue'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000208
  kind: terminology_and_voice
  value: locks=['Khóa nhận thức của Drake về bản chất chính trị trong đơn thỉnh cầu
    của mình và chi tiết thoáng bực dọc rất khẽ trong ánh mắt cấp trên cũng đủ gây
    kinh hãi.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000209
  kind: terminology_and_voice
  value: locks=["Khóa liên từ chuyển ý 'Dẫu vậy' và quyết tâm buộc phải nói ra suy
    nghĩ trong lòng của Drake."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000210
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'giới chóp bu', nhấn mạnh Markdown '*đứa trẻ mồ côi
    của cựu quân đội Liên minh Hiệp ước*' theo đúng DEC-P01-002, và cụm 'bổn phận
    tuyên thệ của một sĩ quan'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000211
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa Tướng Habergram', đại từ 'tôi', và lý do đưa nội
    dung đó vào báo cáo là vì lo sợ chuyện tương tự sẽ tái diễn."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000212
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi miệt thị 'lũ Cộng sản', hô ngữ 'Trung tá', và lời gạt
    đi của Habergram rằng Drake không cần bận tâm đến tổn thất của họ."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000213
  kind: terminology_and_voice
  value: locks=["Khóa câu giả định trái thực tế ở hiện tại 'Tôi sẽ đồng tình với ngài
    nếu tôi không biết rõ sự thật' và lập trường của người có mặt tại hiện trường."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000214
  kind: terminology_and_voice
  value: 'locks=["Khóa cụm ''Người đứng đầu ngành Tình báo'' và sự chuyển biến trong
    ánh mắt nhìn Drake: từ chỗ đối đãi như ''một quý ông của hải quân'' sang nhìn
    anh như ''một người lính thực thụ''."]'
- segment_id: YS-LN10/Text/chapter018.xhtml/p000215
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá Drake', cặp đại từ 'tôi' - 'anh', và câu chất
    vấn sắc bén 'Tôi vẫn luôn đinh ninh anh là người căm ghét Liên bang chứ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000216
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'thưa ngài', sự phân biệt thái độ của Drake giữa việc
    căm ghét 'Chủ nghĩa Cộng sản' đến tận xương tủy và nhận định phủ định 'tôi không
    nghĩ sẽ có ngày mình có cảm tình nổi với Liên bang đâu'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000217
  kind: terminology_and_voice
  value: locks=["Khóa sự phân biệt rạch ròi của Drake giữa 'người dân Liên bang' và
    'hệ tư tưởng Cộng sản'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000218
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'không thể nào làm ngơ' và bối cảnh 'khi anh kề vai
    sát cánh cùng họ trên chiến trường'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000219
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ 'dù nhiều người dân Liên bang là những tín
    đồ Cộng sản chính hiệu từ trong máu' và nhận định phủ định kép phê phán việc đánh
    đồng mọi công dân Liên bang là 'một suy nghĩ hết sức thiển cận'."]
