segment_id_end: YS-LN10/Text/chapter024.xhtml/p000120
choices:
- segment_id: YS-LN10/Text/chapter024.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa mốc thời gian 'Chỉ một ngày sau buổi dùng trà với ông Johnson',
    tên riêng 'Drake', đại từ trần thuật 'anh' và các cụm 'sĩ quan chỉ huy', 'lữ đoàn
    đánh chặn'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa tình thái suy đoán 'Hiển nhiên là', đại từ 'họ', tên đơn vị
    'Hạm đội Bản thổ', tên quốc gia 'Đế quốc', nguy cơ 'làm lộ danh tính đầu mối liên
    lạc của họ trong lòng Đế quốc' và nhận định 'có đông quân vẫn luôn là một lợi
    thế trên chiến trường'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đại từ 'anh', cụm 'phối thuộc vào một đại
    đội gồm những pháp sư hải quân đánh bộ quen thuộc', chức danh 'Lữ đoàn trưởng
    Ballmer', đại từ 'ông' chỉ Ballmer và phủ định giảm nhẹ 'chẳng mấy lý tưởng'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa tình thái nghe thuật lại 'Nghe đâu', đại từ 'Họ' và chi tiết
    lữ đoàn phần lớn là 'tân binh mới toanh', còn 'non nớt khi nói đến tác chiến trên
    biển'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'Tôi' - 'anh' (Ballmer nói với Drake), danh xưng
    'Trung tá', đại từ 'cả hai chúng ta', thuật ngữ 'đơn vị tình nguyện đa quốc gia'
    và sự tương đồng cảnh ngộ giữa hai chỉ huy trước giới chính khách."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp lịch sự của Drake với tình thái suy đoán 'hẳn phải vất
    vả lắm', cụm 'Làm việc cho cung điện' và kính ngữ 'thưa ngài'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'Tôi' - 'anh', cấp bậc 'tướng quân', cụm 'quân ngũ'
    và cấu trúc điều kiện dự báo tương lai ('Nếu anh gắn bó với quân ngũ đủ lâu thì
    rồi cũng sẽ đến ngày...')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ', 'cả hai', cụm 'những quý ông cùng mang trong mình
    tinh thần John Bull' và nhận định về việc tìm hiểu tính cách trước khi cùng ra
    trận."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu suy nghĩ
    trực tiếp '*Chắc chắn vẫn còn những nơi đóng quân tồi tệ hơn thế này nhiều*' và
    mệnh đề dẫn 'Drake nghĩ thầm'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'những người làm chuyên môn', danh xưng 'vị chỉ huy', đại
    từ 'ông' và chi tiết bản tóm lược về thực lực lữ đoàn mang lại cho Drake 'một
    cảm giác nguy hiểm mới mẻ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của Drake với đại từ 'anh', đại từ 'họ' chỉ nhóm tân
    binh và quan hệ tương phản giữa số lượng đông đảo với sự nghi ngờ nghiêm trọng
    về chất lượng."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa tình thái khả thể ('biết đâu số lượng có thể bù đắp cho chất
    lượng'), điều kiện giả định với 'Hạm đội Bản thổ' kiềm chế 'lực lượng hải quân
    của địch' và kết quả kỳ vọng 'đánh tan lực lượng yểm trợ đường không của đối phương'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000106
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại từ để hỏi '*ai*', danh
    xưng 'Chỉ huy Ballmer', 'Drake' và đối tượng gây e sợ nhất là 'đơn vị Pháp sư
    Định danh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'Tôi' - 'anh' (Ballmer hỏi Drake), biệt danh 'Ác
    quỷ sông Rhine', cách quy chiếu trung tính 'Pháp sư đó' và câu hỏi xác nhận thực
    lực so với lời đồn."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'Tôi' - 'mình' của Drake, phủ định kép nhấn mạnh
    ('không phải ngẫu nhiên mà người ta gọi...'), biệt danh 'Bạch Ngân Rỉ Sét', các
    cách gọi 'con quái vật đó', 'con ác quỷ đó', cùng cặp đối lập 'tạ ơn thần linh'
    / 'nguyền rủa các ngài'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô 'tôi' - 'anh', đại từ 'chúng ta', cấu trúc điều
    kiện và tình thái ('Nếu những gì anh nói là thật, chuyện này có lẽ sẽ vượt quá
    sức xử lý của chúng ta mất'), phủ định 'Chưa bao giờ tôi nghĩ', nhấn mạnh Markdown
    theo DEC-P01-002 tại cụm chỉ đám tân binh trẻ tuổi và tên tổ chức 'Lục quân Đế
    quốc'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', 'chúng ta', cách gọi 'con ác quỷ đó', phương hướng
    'ở miền đông' và thái độ hoài nghi của Drake về khả năng đối phương xuất hiện
    tại đây."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị chỉ huy', đại từ 'Ông', tên riêng 'Drake', phủ
    định 'Ông không nói ra thành lời' và chi tiết vẻ mặt mệt mỏi bộc lộ niềm hy vọng
    Drake nói đúng."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'chào nhau theo điều lệnh', món quà 'một chai rượu
    thay vì thuốc lá như thường lệ', chức danh 'sĩ quan phụ tá của Chỉ huy Ballmer'
    và đơn vị 'đại đội sẽ bay cùng anh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*gặp gỡ*' (liên kết
    trực tiếp với động từ ở p000112), phủ định giảm nhẹ 'không chuẩn xác cho lắm',
    tình thái suy đoán quá khứ 'Rất có thể' và cụm 'những cựu binh từ tiểu đoàn pháp
    sư hải quân đánh bộ cũ của anh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000114
  kind: terminology_and_voice
  value: 'locks=["Khóa lời chào thân mật của chỉ huy dành cho các cựu binh thuộc cấp:
    ''“Chào anh em!”''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000115
  kind: terminology_and_voice
  value: 'locks=["Khóa lời đáp ngắn gọn theo quân phong của thuộc cấp: ''“Thưa Trung
    tá.”''."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ', 'bọn họ', tên riêng 'Drake', chi tiết được điều
    động đóng quân 'theo diện lâm thời' và tinh thần sẵn sàng nhận nhiệm vụ khi đất
    nước cần."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của Drake với đại từ 'anh', thuật ngữ 'quân tình nguyện
    đa quốc gia', phương hướng 'miền đông', câu hỏi nội tâm gián tiếp về việc đưa
    một số cựu binh đi cùng và cách gọi thân mật 'mấy bộ xương già này'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm của Drake suy đoán ý đồ của 'cấp trên' khi điều
    động 'những người lính tinh nhuệ nhường này' và khả năng 'Ác quỷ sông Rhine' xuất
    hiện."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa câu tự hỏi thành lời của Drake với cách gọi 'con quái vật đó'
    và nghi vấn về sự xuất hiện của đối phương."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh', phủ định 'không sao rũ bỏ được ý nghĩ', biệt danh
    'Ác quỷ sông Rhine', phương hướng 'ở miền đông' và cấp bậc kèm tên riêng 'Đại
    tá Mikel'."]
