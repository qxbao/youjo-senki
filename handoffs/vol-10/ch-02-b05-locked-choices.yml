choices:
- segment_id: YS-LN10/Text/chapter008.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ nông nghiệp nối từ b04 ('Vụ mùa', 'hoa màu'), phủ định
    nhấn mạnh 'tuyệt đối chưa có gì là chắc chắn', và dấu gạch ngang giới hạn điều
    kiện '—chừng nào hoa màu còn chưa nằm gọn trong tay một cách an toàn'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000123
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: dấu chấm lửng mở đầu, đại từ ''chúng
    ta'' / ''mình'', hình ảnh ẩn dụ ''đủ liềm hái'' / ''quá ít liềm'', và mức độ tình
    thái ''có thể sẽ rất đau đớn đấy''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000124
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'chẳng thể làm việc hiệu quả với nông cụ rỉ sét', đại
    từ 'họ' chỉ những người nông dân, và mệnh đề quan hệ giải thích về sự khan hiếm
    thời gian."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa mức độ tình thái phủ định 'có lẽ sẽ không làm đình trệ hoàn
    toàn vụ thu hoạch', quan hệ đối lập 'nhưng dù sao', ẩn dụ 'một cái gai nhọn đâm
    vào sườn ông', và đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ trần thuật 'ông', ẩn dụ 'số lúa
    mì mà ông có nguy cơ đánh mất', và hành động ngước nhìn trần nhà cũ kỹ ố vàng
    với hai bàn tay đan hờ."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000127
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: dấu chấm lửng mở đầu, đại từ tự
    xưng ''Mình'', và mức độ rào đón ''cảm giác như đã hiểu phần nào lý do vì sao...''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000128
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'ông', mức độ chắc chắn 'chắc hẳn cũng từng
    khổ tâm y hệt như ông lúc này', và thuật ngữ 'tri thức thực nghiệm' gắn với 'những
    bức bích họa trên trần nhà'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000129
  kind: terminology_and_voice
  value: locks=["Khóa lời độc thoại ngắn của Zettour với dấu chấm lửng và điệp ngữ
    'tính sao đây, tính sao đây'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000130
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'ông', mục tiêu mang lại 'một tia hy vọng
    thông qua chiến thắng', phủ định 'không có đủ kinh phí cho việc đó', và đối lập
    mức độ thu hoạch khi chọn con đường an toàn hơn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000131
  kind: terminology_and_voice
  value: locks=["Khóa nguyên lý quân sự 'tập trung lực lượng là một nguyên lý cốt
    lõi của chiến lược' và quan hệ nhân quả 'yếu ớt vì chia nhỏ nguồn lực của mình
    cho quá nhiều mục tiêu'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000132
  kind: terminology_and_voice
  value: locks=["Khóa nhận định khẳng định ngắn 'Việc giữ cho các lực lượng hội tụ
    làm một là điều tối quan trọng'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000133
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại ngắn của Zettour: ''Sẽ là một canh bạc đây''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000134
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ trần thuật 'ông', và hai câu hỏi
    tu từ nội tâm về hậu quả nếu thất bại."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000135
  kind: terminology_and_voice
  value: locks=["Khóa phép nhân hóa 'Sự bức thiết buộc ông phải đưa ra quyết định
    đang nằm ngay trên tấm bản đồ, nhìn thẳng vào ông' và đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000136
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''mình'', địa danh
    ''mặt trận Rhine'', dấu chấm lửng, thuật ngữ ''kế hoạch tác chiến'', và phủ định
    giới hạn ''không phải là thứ có thể vạch ra chỉ bằng một cái đầu lạnh''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000137
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', đại từ trần thuật 'ông', sự đối lập giữa
    lý thuyết và thực tế chiến trường khi tiếng súng nổ vang, cùng câu cảm thán về
    việc dốc toàn lực tập trung quân mà quân số vẫn thiếu hụt."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000138
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông' và chi tiết cử chỉ lướt tay qua tấm
    bản đồ cùng 'nụ cười đầy ẩn ý'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000139
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: câu hỏi giả định trái thực tế quá
    khứ, đại từ ''chúng ta'', và hình ảnh nhân hóa ''sự bức thiết đang lăm lăm cây
    roi trong tay''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000140
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề châm ngôn về 'sự bức thiết chính là cội nguồn của phát
    minh và đổi mới', tên riêng 'Zettour', đại từ 'ông', và hai giả định quá khứ trái
    thực tế ('nhiều khả năng Zettour đã chọn...', 'rất có thể ông thậm chí đã giao
    phó...')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000141
  kind: terminology_and_voice
  value: 'locks=["Khóa câu nhận định ngắn khép lại mạch suy ngẫm: ''Ông vốn là kiểu
    người như vậy đấy''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000142
  kind: terminology_and_voice
  value: locks=["Khóa phép so sánh đối lập giữa việc tự mình ra tiền tuyến (chỉ mất
    mạng sống của riêng ông) với việc chỉ huy một đạo quân ('Sinh mạng của hàng ngàn
    con người đều nằm cả trong tay ông'), cùng đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000143
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: hai dấu chấm lửng, cụm ẩn dụ ''câu
    hỏi trị giá hàng triệu Reichsmark'', và thán từ nghi vấn ''Hửm?'' khi nghe tiếng
    gõ cửa."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000144
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour', danh xưng 'Vị tướng', phủ định 'không nghe
    thấy tiếng bước chân khách tiến lại gần', và chi tiết 'viên sĩ quan chỉ huy trẻ
    tuổi' bước vào với vẻ mặt bồn chồn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000145
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh ta' chỉ viên sĩ quan trẻ, danh xưng 'vị tướng',
    và quan hệ mức độ – hệ quả 'thấp thỏm lo âu đến mức suýt làm vị tướng phải đâm
    lo cho tương lai của đất nước mình'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000146
  kind: terminology_and_voice
  value: 'locks=["Khóa câu hỏi ngắn của Zettour: ''Có vấn đề gì sao?''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000147
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'ông' và chi tiết giọng nói luôn đanh lại
    do thói quen chuẩn bị tinh thần cho tình huống tồi tệ nhất."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000148
  kind: terminology_and_voice
  value: locks=["Khóa nét lắp bắp mở đầu kèm dấu chấm lửng 'D-dạ…', cách xưng hô của
    cấp dưới đối với Zettour ('thưa Tướng quân', 'ngài'), và thông báo có người từ
    thủ đô tới gặp."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000149
  kind: terminology_and_voice
  value: locks=["Khóa quân hàm 'Trung tướng Zettour', đại từ trần thuật 'ông' / 'mình',
    và câu hỏi nội tâm gián tiếp về việc giọng điệu nghiêm nghị của mình làm viên
    sĩ quan trẻ luống cuống."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000150
  kind: terminology_and_voice
  value: locks=["Khóa lời xin lỗi lịch sự của Zettour, thành ngữ phủ định về việc
    không trút giận lên người đưa tin, và mệnh lệnh mời khách vào ('vị khách của chúng
    ta')."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định quá khứ trái thực tế ('Nếu không có người
    đưa tin đang đợi bên ngoài, có lẽ vị tướng đã khịt mũi chế giễu rồi…'), dấu chấm
    lửng, và phủ định 'không phải kiểu người hay bắt bẻ các sĩ quan trẻ tuổi'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông', nhận định 'thời điểm tồi tệ nhất có
    thể để một quan chức nào đó ghé thăm', và cụm 'người làm tác chiến'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông', cách quy chiếu trung tính 'người đó'
    trước khi lộ diện danh tính khách, dấu chấm lửng, và chi tiết 'hạ thấp tầm mắt
    xuống để nhìn người đó cho rõ hơn'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa phép so sánh độ tuổi làm nổi bật vẻ non trẻ của Tanya, dấu chấm
    lửng, tên tổ chức 'Lục quân Đế quốc', phủ định so sánh chiều cao, và chức danh
    'vị trung tá pháp sư đang đứng trước mặt ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ xưng hô 'tôi' – 'cô' của Zettour với Tanya, danh
    xưng 'Trung tá Degurechaff', và giả định quá khứ trái thực tế về việc chuẩn bị
    cà phê."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tướng' và câu hỏi tu từ ẩn dụ về 'một chú chó
    săn' khi bị lạc phương hướng giữa cuộc đi săn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000157
  kind: terminology_and_voice
  value: 'locks=["Khóa cách xưng hô chuẩn quân ngũ của Tanya với Zettour: ''Vâng,
    thưa Tướng quân'', tự xưng ''Tôi'' và gọi ''ngài''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa cách Zettour gọi Rudersdorf ('lão già cứng đầu đó'), địa danh
    'mặt trận phía đông', đại từ 'cô' chỉ Tanya, và thành ngữ tương đương 'tre già
    vẫn uốn được'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000159
  kind: terminology_and_voice
  value: 'locks=["Khóa lời đề nghị lịch sự của Tanya với Zettour: gọi ''ngài'', tiểu
    từ lễ phép ''ạ'', và nội dung yêu cầu xác nhận các bức thông điệp."]'
