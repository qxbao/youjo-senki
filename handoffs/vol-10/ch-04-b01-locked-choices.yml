choices:
- segment_id: YS-LN10/Text/chapter020.xhtml/p000001
  kind: terminology_and_voice
  value: 'locks=["Khóa dòng tiêu đề thời gian và địa điểm viết hoa toàn bộ: ''NGÀY
    14 THÁNG 8 NĂM THỐNG NHẤT 1927, ĐẾ ĐÔ''; không dùng nhấn mạnh Markdown."]'
- segment_id: YS-LN10/Text/chapter020.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' - 'mình' theo DEC-P01-001, lối tự khách
    quan hóa khi nhắc tới 'Tanya' ở ngôi thứ ba, cùng các cụm 'công dân hiện đại gương
    mẫu', 'sinh vật xã hội' và 'sự bấp bênh'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000003
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', tên riêng 'Tanya', thuật ngữ 'Văn phòng
    Bộ Tổng tham mưu', cấu trúc tương phản công sở - quân ngũ ('bộ âu phục' / 'bộ
    quân phục', 'bản đề xuất dự án' / 'kế hoạch tác chiến', 'chiếc cà vạt' / 'huân
    chương và huy hiệu') và phủ định ('không thuyết trình tại trụ sở công ty cũ',
    'không phải bằng chiếc cà vạt')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000004
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và phủ định giảm nhẹ ('chẳng khác mấy
    so với công việc cũ')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' - 'mình', cụm 'cán cân quyền lực', 'ở
    phía phải cúi đầu' và hai phủ định liên tiếp ('một kế hoạch mà bản thân thực sự
    chẳng muốn dính dáng tới', 'những cấp trên vốn cũng chẳng muốn nghe về nó')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000006
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Người ta' - 'mình' và lập luận kinh tế thị trường ('thị
    trường đã ngừng vận hành bình thường', 'những công việc vô nghĩa với mức lương
    bèo bọt')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và thái độ thực dụng hoàn thành phần việc."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000008
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' - 'mình', đại từ 'ông' chỉ Lergen, chức
    danh 'chỉ huy Kampfgruppe' và cấp bậc 'Đại tá Lergen'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại bỏ lửng với đại từ công vụ 'Tôi' và danh xưng 'Trung
    tá Degurechaff'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000010
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*đại tá*', đại từ nội
    tâm 'mình', danh xưng 'Đại tá Lergen' và cụm 'nhân viên văn thư'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000011
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ nhất số nhiều 'Chúng tôi' - 'chúng tôi' (gồm
    Tanya và Đại tá Lergen), thuật ngữ 'Văn phòng Bộ Tổng tham mưu', trạng thái bị
    động không rõ chuyện gì đang xảy ra và chi tiết được chở thẳng tới 'một tòa nhà
    chính phủ xa lạ'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định mở đầu ('Nếu hào phóng thì mình sẽ mô tả...'),
    thuật ngữ 'phong cách tiền phong' và sắc thái mỉa mai ở cụm 'một viên ngọc quý
    của kiến trúc hiện đại'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000013
  kind: terminology_and_voice
  value: locks=["Khóa địa danh 'thủ đô', tên cơ quan 'Bộ Ngoại giao' và chức năng
    'xử lý toàn bộ công tác đối ngoại'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa cụm ẩn dụ miệt thị 'một cái ổ êm ấm của lũ ăn không ngồi rồi'
    và phủ định ('Chẳng ai thực sự biết những kẻ bên trong đã làm gì suốt từ khi chiến
    tranh nổ ra')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', sự đối lập giữa 'binh lính' với 'đám
    ăn bám này' và câu hỏi nội tâm chất vấn."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Lo mà làm cái việc
    chết tiệt của các người đi!*', đại từ nội tâm 'Mình' - 'mình' và đại từ ngôi thứ
    hai số nhiều 'các người' trong tiếng gào tưởng tượng."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa tên cơ quan 'Bộ Ngoại giao', đại từ 'chúng ta' - 'họ', cấu trúc
    giả định trái thực tế trong quá khứ kéo tới hệ quả hiện tại cùng tình thái và
    phủ định ('Giá như họ tiến hành ngoại giao đúng như bổn phận của mình, đất nước
    chúng ta có lẽ đã chẳng đứng bên bờ vực sụp đổ...')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ' - 'mình', các cụm 'tội ác chiến tranh', 'bộ phận
    nhân sự', giả định không có thật ('Nếu mình mà phụ trách... cứ cho là họ sẽ phải
    lên thớt theo đúng nghĩa đen đi') và câu cảm thán kết đoạn."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận định ngắn gọn 'Ngoại giao cốt ở con người.'"]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa giả định trái thực tế ở hiện tại cùng tình thái ('Nếu Đế quốc
    ngày nay có lấy dù chỉ một Bismarck thôi, có lẽ lúc này mình đã đang ngồi ung
    dung...'), tên riêng 'Bismarck', 'Đế quốc' và đại từ nội tâm 'mình'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta', tình thái giả định và phủ định kép ('cũng
    sẽ không bị mắc kẹt trong một cuộc chiến không thể thắng')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và mạch chuyển ý từ phàn nàn sang chợt
    nhận ra sự thật."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Đế quốc', 'Bismarck', đại từ 'họ', các phủ định ('không
    có lấy một Bismarck', 'chẳng biết làm cách nào để tiến hành ngoại giao cho ra
    hồn', 'Ngay từ đầu họ đã chẳng có cơ hội nào thắng được cuộc chiến này rồi') và
    kết luận 'cầm chắc kết cục diệt vong'."]
