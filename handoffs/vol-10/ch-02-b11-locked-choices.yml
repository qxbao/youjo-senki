choices:
- segment_id: YS-LN10/Text/chapter010.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('Ông' - 'cô'), danh xưng 'Trung
    tá Degurechaff' và chi tiết chỉ một cú gõ ngón tay lên bản đồ đã đủ để cô nhìn
    thấu ý đồ thực sự của ông."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại bỏ lửng của Tanya với cách gọi 'Thưa Tướng quân'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000029
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Vị sĩ quan cao cấp nhỏ nhắn', phủ định 'không giấu nổi
    vẻ kinh ngạc trong giọng nói' và cặp đại từ 'cô' - 'ông'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya ('Tôi' - 'ngài', 'thưa Tướng quân'), phủ
    định 'không ngờ' và quân hàm 'thống chế'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000031
  kind: terminology_and_voice
  value: locks=["Khóa suy đoán nhượng bộ ('Dù hẳn là cô đang nói quá lên…'), đại từ
    'cô' - 'ông' và chi tiết Zettour giấu tiếng cười sau một làn khói thuốc lá mỏng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp của Zettour ('chúng ta', 'tôi'), mục tiêu 'chiếm lấy
    một căn cứ địch' và câu giả định điều kiện nếu địch phản ứng kém cỏi thì biết
    đâu ông sẽ trở thành 'thống chế'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa nhận định 'Rõ ràng là cả hai chỉ đang nói đùa', giả định điều
    kiện về 'tuyến tiếp vận' bị kéo căng không thể đáp ứng nếu tiến quá sâu, cấu trúc
    tăng tiến 'Không chỉ vậy, họ còn cần phải...' và phép so sánh với chiến dịch nhốt
    'quân đội François' vào 'cánh cửa xoay'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa giới hạn mức độ ('Cùng lắm thì... chỉ có thể...') và cụm 'chiến
    thắng mang tính chiến lược trên chiến trường'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' - 'cô', tên riêng 'Zettour', cùng hai danh xưng
    'vị trung tá trẻ tuổi' và 'Vị trung tá pháp sư'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận vai trò nghi binh/đánh lạc hướng của Tanya
    ('Tôi', 'chúng ta', 'thưa Tướng quân', 'ạ') và địa danh 'mặt trận Rhine'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa lời xác nhận của Zettour với cặp đại từ 'tôi' - 'cô' và đại
    từ chỉ quân địch 'chúng'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhân quả quá khứ hoàn thành ('Ông đã buộc quân địch
    phải đẩy đầu mối tiếp vận của chúng lên phía trước')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản thời gian ('Trước đó... năm ăn năm thua… nhưng
    giờ đây...'), hình ảnh 'miếng mồi hoàn hảo để nhử chúng chui vào bẫy', phủ định
    'Chẳng còn gì phải lo ngại nữa' và kết luận bắt đầu chiến dịch; không dùng nhấn
    mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa lời nhận xét hóm hỉnh nhưng giữ lễ của Tanya ('Xin thứ lỗi cho
    tôi nói thẳng', 'ngài', 'thưa Tướng quân') cùng hai hình ảnh 'tay lừa đảo siêu
    hạng' và 'bậc thầy mánh khóe'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Trung tá', cặp đại từ 'Tôi' - 'cô', cùng chuỗi danh
    xưng chơi chữ 'Tướng Mánh khóe', 'Thống chế Mánh khóe' và 'hội đồng mánh khóe'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour' và hành động mỉm cười thật tươi rồi rút
    thêm một điếu thuốc lá nữa."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa mốc thời gian ngay trước khi ra mệnh lệnh cuối cùng và chi tiết
    'ông' chợt nhận ra một thiếu sót đã bỏ quên."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của 'Zettour' ('ông' - 'cô'), cụm 'vị trung tá nhỏ
    nhắn chưa từng hút thuốc bao giờ' và phán đoán từ vẻ mặt cứng đờ rằng rất có khả
    năng bản thân cô cũng phản đối chuyện hút thuốc."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa giả định trái thực tế ('Nếu Trung tá Degurechaff mà hút thuốc
    ở độ tuổi của cô, ông sẽ có nghĩa vụ phải báo cho quân cảnh'), nhận xét về sự
    nghiêm khắc của 'quân cảnh' và hành động cười gượng trước khi quay lại hoạch định
    tác chiến."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa mệnh lệnh tác chiến của Zettour ('Tôi' - 'cô', 'Trung tá'),
    sự phối hợp giữa 'mồi nhử' thu hút địch với 'lực lượng chủ lực' giáng đòn, và
    đánh giá 'đơn giản nhưng cực kỳ hiệu quả'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa lời bày tỏ nỗi lo ngại của Tanya ('Nhưng thưa Tướng quân, tôi
    hơi lo ngại về cánh quân chủ lực ạ')."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn của Zettour với đại từ 'cô'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba ('Ông' - 'vị trung tá' / 'cô') yêu cầu
    giải thích rõ hơn."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa câu trả lời của Tanya ('họ', 'ạ') nêu vấn đề nằm ở vị trí triển
    khai hiện tại của cánh quân chủ lực."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết đôi bàn tay nhỏ xíu của 'cô' chỉ vào các con số biểu
    thị 'các sư đoàn của Đế quốc' trên bản đồ với vẻ mặt bối rối."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi', 'chúng ta', nhấn mạnh Markdown đúng phạm vi theo
    DEC-P01-002 tại '*chưa từng nghe tên bao giờ*' và câu hỏi về việc bố trí 'các
    sư đoàn mới thành lập' cho cuộc tiến công quan trọng."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa câu trả lời của Zettour ('họ', 'Trung tá') về mục đích 'trao
    cho họ hy vọng' và 'một khoản đầu tư cho tương lai'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'vị pháp sư át chủ bài', cặp đại từ 'Ông' - 'cô',
    phủ định 'chẳng hiểu ông đang nói về chuyện gì' và suy nghĩ thông cảm của Zettour
    vì cô vốn chỉ huy những binh lính tinh nhuệ."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ mở đầu ('Cô có biết không, Trung tá?') và luận
    điểm 'Hy vọng chính là thứ mang lại cho con người ta ý chí chiến đấu'."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa phép so sánh hai mặt của hy vọng ('kịch độc' nhưng tùy liều
    lượng có thể dùng làm 'thần dược') và nhận định chỉ 'những sĩ quan lớn tuổi hơn'
    mới thấu hiểu; không dùng nhấn mạnh Markdown cho thẻ neo trang."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp ngập ngừng của Tanya ('Thưa Tướng quân', 'tôi'/'mình'
    - 'ngài', 'không ạ'), phủ định 'không chắc là mình theo kịp ý ngài' và câu hỏi
    nghi vấn về từ khóa vượt quá thẩm quyền."]
- segment_id: YS-LN10/Text/chapter010.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn nội tâm của 'Zettour' về Tanya ('Cô', 'cô', 'đứa trẻ
    nhỏ nhắn này'), sự đối lập giữa năng lực sĩ quan/người lính xuất sắc với tuổi
    đời và trải nghiệm còn hạn chế chưa nhận ra những nét tinh tế trong tâm hồn con
    người."]
