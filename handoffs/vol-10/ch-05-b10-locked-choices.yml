    và nhấn mạnh cấp bậc phải cao hơn Tanya rất nhiều; emphasis=none
- segment_id: YS-LN10/Text/chapter024.xhtml/p000339
  kind: terminology_and_voice
  value: 'names_and_ranks=bậc lương (pay grade); pronouns_and_pov=Nội tâm Tanya (''mình'');
    modality_and_logic=Giới hạn bổn phận theo bậc lương: chỉ nên nghĩ cách tạo chiến
    quả lớn nhất với tổn thất thấp nhất trên chiến trường; tóm lại là mang lại kết
    quả trên cương vị người lính—không hơn, không kém; emphasis=none'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000340
  kind: terminology_and_voice
  value: 'names_and_ranks=Tổ quốc (fatherland); pronouns_and_pov=Thoại của Tanya;
    gọi địch là ''chúng''; modality_and_logic=Châm ngôn tác chiến mỉa mai: giết kẻ
