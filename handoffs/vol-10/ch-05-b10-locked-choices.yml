- segment_id: YS-LN10/Text/chapter024.xhtml/p000337
  kind: terminology_and_voice
  value: 'names_and_ranks=chính quốc (homeland); nguồn nhân lực (human resources);
    chỉ huy chiến trường (field commander); pronouns_and_pov=Trần thuật và nội tâm
    ngôi thứ nhất của Tanya (''Mình'', ''mình''); modality_and_logic=Hành động lắc
    đầu gạt tạp niệm và phủ định trách nhiệm: bận tâm tới tình hình nguồn nhân lực
    của chính quốc không phải phần việc của một chỉ huy chiến trường; emphasis=none'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000338
  kind: terminology_and_voice
  value: names_and_ranks=cấp trên (superiors / superior); pronouns_and_pov=Nội tâm
