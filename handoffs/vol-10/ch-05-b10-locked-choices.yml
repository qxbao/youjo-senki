    thể chấp nhận số sinh mạng bị tước đoạt với nhận thức bản thân chỉ là một bánh
    răng trong cỗ máy lớn hơn rất nhiều; emphasis=none
- segment_id: YS-LN10/Text/chapter024.xhtml/p000342
