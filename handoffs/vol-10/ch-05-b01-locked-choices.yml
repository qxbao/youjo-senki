choices:
- segment_id: YS-LN10/Text/chapter024.xhtml/p000001
  kind: terminology_and_voice
  value: 'locks=["Khóa dòng tiêu đề thời gian và địa điểm viết hoa toàn bộ: ''NGÀY
    15 THÁNG 8 NĂM THỐNG NHẤT 1927, SẢNH CHỜ CỦA MỘT KHÁCH SẠN BẤT KỲ TẠI THỦ ĐÔ KHỐI
    THỊNH VƯỢNG CHUNG''; không dùng nhấn mạnh Markdown."]'
- segment_id: YS-LN10/Text/chapter024.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định và khẳng định chắc chắn ('Nếu có một bí quyết
    nào để thống trị thế giới, thì đó chắc chắn nằm ở trà')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000003
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake', cụm 'chân lý bất di bất dịch', 'điều
    hiển nhiên' và 'quân đội Khối Thịnh vượng chung'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000004
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'anh' chỉ Drake và các cụm 'khởi điểm', 'nỗ
    lực xây dựng một đế chế toàn cầu của đất nước anh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Khối Thịnh vượng chung', nhận định 'thiếu hiểu biết
    về cách thế giới vận hành' và cơ chế thống trị 'thông qua quyền kiểm soát đối
    với việc phân phối hàng hóa'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000006
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' chỉ Khối Thịnh vượng chung và chuỗi hành động 'tạo
    dựng và kiểm soát thị trường trà, rồi cung ứng mặt hàng đó cho phần còn lại của
    thế giới'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ', quan hệ mục đích - điều kiện ('cần một lực lượng
    hải quân hùng mạnh nhằm bảo vệ các tuyến đường thủy phục vụ hoạt động vận tải
    biển') và mệnh đề quan hệ ('vốn là nền tảng cho ngành công nghiệp của họ')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000008
  kind: terminology_and_voice
  value: locks=["Khóa trình tự không gian - thời gian của lá trà từ 'một vùng đất
    xa xôi' đến khi 'cập bến các điểm đích bằng tàu biển'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển dịch từ 'những con tàu buồm tốc độ cao chở trà' sang
    'tàu hơi nước', ẩn dụ 'Mặt trời không bao giờ lặn trên các tuyến hàng hải thuộc
    sở hữu của cường quốc này', thế đối lập với 'các quốc gia lục địa bị giới hạn
    bởi sự phụ thuộc vào giao thông vận tải đường bộ' và tên gọi 'Người dân Khối Thịnh
    vượng chung'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000010
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'lực lượng hải quân hùng mạnh', 'vùng biển tự
    do và rộng mở', 'quốc gia hàng hải' và 'bá quyền trên toàn thế giới'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000011
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'bản thổ', danh xưng 'Trung tá Drake', đại từ 'anh',
    địa điểm 'phòng trà của khách sạn' và mức độ tác động 'rúng động tận tâm can'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Giờ thưởng trà ở Khối Thịnh vượng chung' và 'tinh hoa của
    cảm giác được trở về nhà'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000013
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Vị quý ông ấy' chỉ Drake, chi tiết 'một món đồ nội
    thất mang giá trị di sản trong khách sạn lịch sử tráng lệ này' và 'bộ đồ sứ thượng
    hạng nhất'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' - 'mình' và phủ định nhấn mạnh ('thậm chí còn chẳng
    cần nhấp lấy một ngụm trước khi kế hoạch của mình đổ bể')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'công dân Khối Thịnh vượng chung' và hình ảnh so sánh 'tựa
    như hương thơm của một đóa hoa đang bung nở'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa câu khẳng định ngắn 'Đó là mùi hương của văn hóa.'"]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', phủ định ('chẳng phải là mùi hương vốn thường
    khơi gợi niềm vui và sự hứng khởi ấy') và quan hệ nhượng bộ - tăng tiến ('Dù màu
    sắc của nó trông hơi giống màu trà, nhưng điều đó chỉ càng làm cho trải nghiệm
    này thêm phần thảm hại')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa nhịp tự đính chính ('Nó gần như ngang ngửa—không, xét một cách
    khách quan thì nó còn tệ hơn cả...') và cụm 'thứ trà rẻ tiền được phục vụ trong
    các doanh trại quân đội Liên bang'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa các cụm 'Hợp chúng quốc trung lập', 'sản xuất hàng loạt và bán
    trong hộp thiếc', tên riêng 'Drake', đại từ 'anh' và sự ngỡ ngàng trước việc trà
    đóng hộp lại ngon hơn trà ở 'một trong những phòng trà danh giá nhất trên quê
    hương anh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu độc thoại
    nội tâm '*Chuyện này thật không thể tin nổi.*'"]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa danh từ 'Một nữ phục vụ', tên riêng 'Drake', đại từ 'anh' và
    chi tiết 'bưng một khay bánh scone'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lịch sự kèm quân hàm '“Có vấn đề gì sao, thưa Trung
    tá?”', chủ thể 'người nữ phục vụ' và đại từ 'anh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa đại từ giao tiếp 'tôi' - 'cô', đại từ trần thuật 'Anh' - 'anh',
    hai cấu trúc giả định trái thực tế ở hiện tại và quá khứ ('Nếu đây là lần đầu
    tiên tôi ghé tới, hẳn tôi sẽ yêu cầu được gặp quản lý', 'nếu không biết trước,
    có lẽ ban đầu anh đã tưởng họ đang bày trò trêu chọc gì mình rồi'), phủ định ('không
    thể tin được', 'cũng không nhớ là từng gặp cô ở đây trước kia') và câu hỏi cuối
    đoạn về 'các nam phục vụ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô 'ngài' - 'chúng tôi' của nữ phục vụ với Trung tá
    Drake, ba khả năng về số phận các nam phục vụ ('ở dưới chiến hào', 'đang lênh
    đênh trên biển', 'hoặc là đồng đội của ngài') và tên gọi 'Hải quân Đế quốc'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' trong lời đáp của Drake và thái độ thở dài chấp
    nhận hoàn cảnh thời chiến."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' chỉ Drake, 'người nữ phục vụ' - 'cô' và danh từ
    'bánh scone'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa tính chất 'khô khốc' và phủ định nhấn mạnh ('hương vị thậm chí
    còn chẳng giống lúa mì chút nào')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' - 'anh', các chi tiết thực phẩm thời chiến ('bơ...
    hàng thay thế', 'mứt... đã để lâu mất ngon', 'thiếu đường', 'chất lượng trái cây
    cũng chẳng lấy gì làm khá khẩm')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000029
  kind: terminology_and_voice
  value: locks=["Khóa lời nhận xét về 'mứt và bơ', phủ định ('cũng chẳng khá hơn là
    bao') và cụm 'đồ nhái rẻ tiền'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 ở câu nội tâm đầu đoạn '*Đây
    là điều duy nhất mà mình đã mong mỏi.*' với đại từ tự quy chiếu 'mình', cùng phần
    trần thuật không in nghiêng về 'Drake', 'bánh scone' và 'thứ đồ uống âm ấm mà
    họ gọi là trà'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000031
  kind: terminology_and_voice
  value: locks=["Khóa câu kết 'Đó chỉ còn là giờ thưởng trà về mặt hình thức mà thôi.'"]
