choices:
- segment_id: YS-LN10/Text/chapter008.xhtml/p000087
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'hệ thống chỉ huy không chính thức' và quan hệ hệ
    quả 'cho phép các cá nhân có quyền tự do hành động lớn hơn'; không dùng nhấn mạnh
    Markdown."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000088
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: dấu chấm lửng mở đầu, đại từ ngôi
    thứ nhất số nhiều ''Chúng ta'', và thuật ngữ ''bè phái quân phiệt''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa liên từ chuyển ý 'Thế nhưng', tên riêng 'Zettour', và đại từ
    phản thân 'mình' trong trần thuật."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận định ngắn 'Thật thú vị', thuật ngữ 'sĩ quan tác chiến',
    và đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa dấu gạch ngang giải thích cảm thán '—và khao khát ấy mới mãnh
    liệt làm sao', cụm quy chiếu 'Ba sự gò bó kia', và đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000092
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''mình'', cấu trúc
    điều kiện phủ định khái quát ''Nếu muốn một người đàn ông trở thành quý ông lịch
    thiệp, đừng cử anh ta đi...'', và thuật ngữ ''đào tạo sĩ quan tham mưu''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa quân hàm 'Trung tướng Zettour', đại từ trần thuật 'ông' và 'họ',
    mệnh đề điều kiện 'miễn là họ giành chiến thắng trong trận đánh này', cùng chi
    tiết 'cuộc hành trình rút lui đằng đẵng'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ mức độ – hệ quả 'được triển khai xuất sắc đến mức ông
    cảm thấy phần nào được khẳng định' và đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000095
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''mình'', cấu trúc
    so sánh kép (''cuốn hút hơn một ván cờ vua, nhiều thử thách hơn một chuyến đi
    săn''), và sắc thái phỏng đoán tình thái ở câu kết."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'trường đại học quân sự', tên 'Zettour', đại từ trần
    thuật 'ông', dấu chấm lửng và cặp dấu gạch ngang giải thích '—nhất là người đang
    đứng ngay trên chiến trường như Zettour lúc này—'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000097
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''Mình'', dấu chấm
    lửng, và chủ thể khái quát ''người ta'' trong mệnh đề ẩn dụ về rượu vang."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi ba câu/cụm danh từ nối tiếp ca ngợi rượu vang ('Thứ rượu
    vang tuyệt hảo', 'Quỳnh tương của các vị thần', 'Một thức thần dược quyến rũ đến
    mức...') và đại từ khái quát 'người ta'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa khái niệm 'lính nghĩa vụ mới tòng quân vừa được điều tới miền
    đông' và phép so sánh 'nó sẽ chẳng khác nào thuốc độc'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa dấu gạch ngang chuyển ý, đại từ quy chiếu 'họ', giả định tương
    lai 'nếu nếm trải chiến thắng tại đây, chắc chắn họ sẽ khắc khoải thèm khát nó
    suốt phần đời còn lại', và cụm giới hạn 'bất chấp mọi giá phải trả'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Đế quốc', 'Hội đồng Tự trị', và ý nghĩa dập tắt những
    tiếng nói hoài nghi cơ hội chiến thắng."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa cụm chuyển ý 'Nói cách khác' và ẩn dụ 'tia lửa mà họ cần để
    thổi bùng ngọn lửa nhiệt huyết của toàn quân'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000103
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại tự giễu của Zettour: đại từ tự xưng ''Mình''
    và cấu trúc so sánh hơn ''còn tệ hại hơn cả chính ác quỷ nữa''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc điều kiện 'Nếu ông có thể thắng trận này, điều đó có
    nghĩa là vẫn còn một trận đánh khác đang chờ đợi ông' và đại từ trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ 'cơn nghiện thứ rượu độc do chính tay ông ủ nên', dấu
    chấm lửng, tính chất duy nhất ('con đường duy nhất ông có thể chọn'), và câu hỏi
    tu từ nội tâm ở cuối đoạn."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000106
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''mình'' và khẳng
    định quyết tâm ''Đó là lý do vì sao mình phải dám thử''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông' và nhận định 'đó là một thói quen hết
    thuốc chữa'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'không còn muốn thay đổi lề lối của mình nữa', khái
    niệm 'thế tiến thoái lưỡng nan', phủ định 'chẳng còn cách nào khác để làm', và
    quy chiếu 'vận mệnh của đất nước đang đặt cả vào năng lực cứu vãn cuộc chiến của
    mình'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhượng bộ ở câu đầu, dấu chấm lửng, điều kiện 'nếu muốn
    gồng gánh cuộc khủng hoảng quốc gia này suốt chừng ấy thời gian qua', và đại từ
    trần thuật 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000110
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: câu hỏi mở đầu ''Do dự ư?'', đại
    từ tự xưng ''mình'', giả định trái thực tế so sánh với ''tên ngốc Rudersdorf hơi
    một tí là đóng sầm cửa sổ và gào thét ầm ĩ kia'', và phủ định ở câu kết."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa quân hàm 'Trung tướng Zettour', nhận xét 'quá nặng tính học
    thuật trong những nhận định của mình', thuật ngữ 'kế hoạch tác chiến', và đại
    từ trần thuật 'Ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000112
  kind: terminology_and_voice
  value: 'locks=["Khóa ba mục tiêu tác chiến trong câu danh từ: ''Mũi lồi'', ''căn
    cứ của chúng'', và ''các tuyến giao thông liên lạc ở hậu phương của chúng'', cùng
    đại từ chỉ địch ''chúng''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa đại từ trần thuật 'Ông', quan hệ mức độ – hệ quả trong việc
    ngụy trang thế bố trí quân, và chi tiết binh lính dưới quyền phàn nàn về 'chuỗi
    những cuộc rút lui tưởng chừng như vô nghĩa của họ'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa tên 'Liên bang', dấu chấm lửng, mức độ chắc chắn 'không còn
    nghi ngờ gì nữa, vẫn đang hết sức thận trọng', mức phỏng đoán 'Nhiều khả năng
    là...', và đại từ 'ông' / 'chúng'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'chiến thuật tác chiến cơ động', dấu gạch ngang giải
    thích '—bởi đó vốn là lối đánh ưa thích của ông', và đại từ 'chúng' / 'ông'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Thế nhưng…*' đúng phạm vi thẻ em trong
    nguồn, quân hàm 'Trung tướng Zettour', và hành động rà soát các vị trí đóng quân
    của địch."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000117
  kind: terminology_and_voice
  value: 'locks=["Khóa lời độc thoại của Zettour: đại từ tự xưng ''mình'', dấu chấm
    lửng, và vế rào đón giảm độ chắc chắn ''hoặc ít nhất thì có vẻ là như vậy''."]'
- segment_id: YS-LN10/Text/chapter008.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa dấu gạch ngang giải thích '—dạy cho kẻ địch biết phải dè chừng
    những thói quen của ông', phủ định giả định 'như thể họ chẳng hề cố nhử quân địch
    vào tròng…', dấu chấm lửng, và từ khóa 'khả thi' nối sang p000119."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*Khả thi*' đúng phạm vi thẻ em trong nguồn
    và cấu trúc câu ngắn '*Khả thi* chính là từ khóa'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh so sánh 'con chim xanh hạnh phúc' và nghịch lý giữa
    'điều chắc chắn duy nhất' với 'một thế giới bất định đến khủng khiếp'."]
- segment_id: YS-LN10/Text/chapter008.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Zettour' và chuỗi ẩn dụ nông nghiệp khép lại đoạn
    ('gieo hạt giống', 'chăm bẵm cho cánh đồng', 'thu hoạch mùa màng')."]
