segment_id_end: YS-LN10/Text/chapter024.xhtml/p000065
choices:
- segment_id: YS-LN10/Text/chapter024.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhượng bộ ('chẳng có mấy thực khách dù đang là thời
    điểm lý tưởng nhất trong ngày để thưởng trà'), đại từ trần thuật 'anh' chỉ Drake,
    phủ định ('cố không chê bai tất cả mọi thứ') và bối cảnh 'thời chiến'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa phủ định toàn phần ('chẳng ai thích thú gì việc nhồi nhét đầy
    bụng bằng đồ giả cả')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đại từ 'anh' - 'mình', danh từ 'bánh scone'
    và sự xuất hiện của 'một ông lão'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nhận diện ngắn '“Ông Johnson?”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake', đại từ 'anh' và câu hỏi thăm về
    'Việc bình phục của anh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ giao tiếp 'tôi' - 'ông', câu hỏi tu từ giả định ('Nếu
    không cử động được cánh tay, làm sao tôi có thể tận hưởng hết mọi thứ quê nhà
    ban tặng cơ chứ?') và lời khen mỉa mai lịch sự cuối đoạn."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa danh từ 'Ông lão', tên riêng 'Drake', đại từ 'anh', danh xưng
    'ông Johnson', địa danh 'mặt trận phía đông' và phủ định ('chẳng bao giờ thực
    sự đoán được người đàn ông này đang nghĩ gì')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc so sánh giả định ('Cứ như thể lúc nào ông ta cũng đang
    gảy bàn tính trong đầu') và sự tương phản giữa 'nụ cười rạng rỡ' với 'những đòi
    hỏi vô lý'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi' - 'anh', danh xưng 'Trung tá' và lời đề nghị lịch
    sự ('Nếu anh có đôi phút thong thả, phiền anh tiếp chuyện tôi một lát được không?')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn '“Ý ông là sao?”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' và câu hỏi gợi mở '“Anh có phải tuýp người thích
    trừ tà bắt ma không?”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' và hồi ức tuổi thơ ('Hồi còn nhỏ tôi vẫn thường
    giả vờ làm chuyện đó suốt. Chà, chủ yếu chỉ là nô đùa thôi.')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' - 'anh' và chi tiết hoài niệm 'vung cành cây chiến
    đấu với các nàng tiên và yêu tinh'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa thế đối lập giữa 'chỉ là trò giả vờ' với cảm nhận 'vô cùng chân
    thật đối với anh' khi còn nhỏ."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đại từ trần thuật 'Anh', đại từ tự quy chiếu
    'mình' trong câu hỏi nội tâm gián tiếp ('liệu có phải mình đã lãng quên những
    ký ức này giữa bốn bức tường của khu ký túc xá quân đội hay không')."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' - 'anh' và hình ảnh 'đánh thức lại đứa trẻ bên
    trong mình một lần nữa'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', 'tôi' - 'ông', nhận định thực tế ('Chúng
    ta đang nói về một mệnh lệnh đấy thôi. Đằng nào thì tôi cũng phải thực hiện cả,
    chẳng phải sao?') và câu hỏi 'Ông cần tôi giết một bóng ma giúp ông à?'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa biệt danh 'Ác quỷ sông Rhine' trong câu đáp ngắn '“Đó là Ác
    quỷ sông Rhine.”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'ông lão', danh xưng 'Trung tá Drake', đại từ 'anh'
    và chi tiết 'sặc cả thứ chất lỏng hao hao giống trà mà anh đang uống dở'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000051
  kind: terminology_and_voice
  value: locks=["Khóa câu thốt ngắn '“Cái gì cơ?”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000052
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' - 'anh', chủ thể 'người đàn ông kia' và ẩn dụ 'giáng
    thêm cho anh một quả bom khác'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000053
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' - 'tôi' - 'chúng ta', các cụm 'Bóng ma nhỏ bé',
    'mặt trận phía đông', 'Đế quốc' và lời báo trước 'bóng ma đó sẽ sớm ghé thăm chúng
    ta thôi'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000054
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Ông Johnson', đại từ 'tôi' và câu hỏi xác nhận 'chuyện
    đó là thật sao?'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000055
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'tôi' - 'anh' và 'Chúng tôi', sự tương phản diện mạo
    ('Miệng mỉm cười nhưng đáy mắt chẳng hề có chút ý cười nào'), định danh 'viên
    điệp viên tình báo', địa danh 'vùng eo biển' và biệt danh 'Ác quỷ sông Rhine'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000056
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ và tên gọi 'Bên Tình báo', 'bọn Kraut', 'hàng
    rào phòng thủ của Khối Thịnh vượng chung' và mục đích 'vượt qua vùng biển rộng
    lớn để mở một cuộc tập kích bất ngờ'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000057
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi phản ứng '“Ông không nói đùa đấy chứ?”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000058
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'một cơn giận thực sự', tâm trạng tồi tệ của 'Ông lão'
    và thái độ của 'Trung tá Drake' trên cương vị 'một sĩ quan quân đội' trước người
    bàn chuyện cơ mật ở nơi công cộng."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000059
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' - 'tôi', cụm 'lũ Kraut khốn kiếp đó', 'đặt dù chỉ
    một chiếc ủng da lên đất của Khối Thịnh vượng chung' và địa điểm 'một sảnh chờ
    khách sạn như thế này'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000060
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 đúng phạm vi đại từ sở hữu
    '*chúng ta*' trong câu thoại '“Chà, đây là đất của *chúng ta* mà.”'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000061
  kind: terminology_and_voice
  value: locks=["Khóa chủ thể 'Ông lão' - 'Ông' và chi tiết 'đang ám chỉ điều gì đó
    khi nhắc tới đất đai'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000062
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' - 'Tôi', tên gọi 'Liên bang' và cách gọi 'đám Cộng
    sản ấy'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000063
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Ông Johnson', 'nụ cười ranh mãnh' và cụm 'sự thâm
    độc sâu cay của tinh thần John Bull'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000064
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng tôi', mệnh đề nhượng bộ ('Dù không hoàn hảo nhưng
    nó vẫn đang hoạt động') và lời nhắc 'tin tức tình báo do chúng tôi cung cấp bao
    giờ cũng đi kèm điều kiện ràng buộc'."]
- segment_id: YS-LN10/Text/chapter024.xhtml/p000065
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông', tên riêng 'Drake', đại từ 'anh' và cụm trong ngoặc
    kép '“dọn sạch”'."]
