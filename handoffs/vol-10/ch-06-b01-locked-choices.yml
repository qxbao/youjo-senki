choices:
- segment_id: YS-LN10/Text/chapter028.xhtml/p000001
  kind: terminology_and_voice
  value: 'locks=["Khóa dòng tiêu đề thời gian - địa điểm viết hoa toàn bộ: ''NGÀY
    2 THÁNG 9 NĂM THỐNG NHẤT 1927, ĐẾ ĐÔ, VĂN PHÒNG BỘ TỔNG THAM MƯU''."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa chức danh 'cục phó' trong cụm 'văn phòng cục phó', nhận định
    ban đầu về sự kỳ lạ khi nơi này chìm trong hỗn loạn và mệnh đề nhượng bộ bỏ lửng
    ở câu thứ hai."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000003
  kind: terminology_and_voice
  value: locks=["Khóa định danh 'Đế quốc' và cấu trúc phủ định kép khẳng định tình
    trạng hỗn loạn không hề thiếu dạo gần đây."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000004
  kind: terminology_and_voice
  value: locks=["Khóa phép đối lập giữa 'màn sương mù chiến tranh' trên chiến trường
    với 'một làn sương mù kiểu khác' bao phủ chính trường, cùng hệ quả khiến 'ngay
    cả những nhà chiến lược sắc sảo hơn' cũng cảm thấy mình trở nên 'đần độn và chậm
    lụt'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa trạng thái 'nỗi bứt rứt mơ hồ nhưng âm ỉ cứ lơ lửng trên đầu'
    và phủ định 'chẳng phải là chuyện gì khác thường đối với những con người này'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000006
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ chuyển ý 'Tuy nhiên' và nhận định 'bầu không khí chung
    vào ngày hôm đó lại có đôi chút khác biệt'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi độc thoại của Rudersdorf với đại từ 'Chúng ta' và thế
    lưỡng lự giữa 'tin tốt hay tin xấu'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000008
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng trần thuật 'Vị tướng', đại từ 'ông', chi tiết mang
    'cả hai luồng cảm xúc vừa nêu' khi nhìn bản đồ và hành động thở hắt ra giữa màn
    khói thuốc lá sẫm đặc."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng 'ta' trong câu cảm thán độc thoại của Rudersdorf
    về điếu thuốc ngon hiếm có sau một thời gian dài."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000010
  kind: terminology_and_voice
  value: locks=["Khóa hướng địa lý 'miền đông', cách gọi mang màu sắc điểm nhìn của
    Rudersdorf 'Con chó săn Zettour kia', địa danh 'mặt trận phía đông' và hệ quả
    kéo dài 'sinh mệnh đang héo mòn của Đế quốc tại chiến trường đó'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000011
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ta' quy chiếu Zettour và hai chiến công 'vực dậy
    mặt trận ấy từ cõi chết', 'tung ra một đòn phản công vô tiền khoáng hậu'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại tên chiến dịch '*cánh
    cửa xoay*', kết quả đẩy chiến tuyến trở lại đúng vị trí cần thiết và lời bông
    đùa của các sĩ quan về hàm ý kép trong cụm '“bước tiến lên phía trước”' của Zettour
    gắn với việc chắc chắn được thăng hàm."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000013
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại hoài niệm của Rudersdorf với cách gọi 'Tay lừa
    đảo đó', đại từ tự xưng 'ta' - 'chúng ta', đại từ 'Lão' chỉ Zettour và sự tương
    phản giữa vẻ ngoài 'học giả đạo mạo' với bản chất 'tàn nhẫn nhất'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'vị tướng', đại từ 'ông', suy luận rằng nhờ 'chiến
    lược đúng đắn' vẫn có thể 'lật ngược thế cờ trong cuộc chiến cho dù bị áp đảo
    quân số đến mức tuyệt vọng' và định danh 'Văn phòng Bộ Tổng tham mưu'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ ở đầu câu và thực tế phủ định 'vẫn không làm
    thay đổi được thực tế rằng cả đất nước đang sa lầy trong bế tắc'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ 'lão' (chỉ Zettour),
    'chúng ta' và nhận định giới hạn về tác dụng từ những mánh khóe của Zettour."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa chi tiết 'bàn tay run rẩy của ông vươn ra lấy chút thuốc lá'
    và đánh giá giới hạn 'chỉ dừng lại ở một thắng lợi chiến thuật trên chiến trường'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nghịch đối làm nổi bật 'thực trạng thảm hại trong nỗ
    lực chiến tranh của họ'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'chẳng ai khác có thể làm nổi', sự tin cậy khi 'phó
    thác mặt trận phía đông cho Zettour' và danh xưng 'vị tướng'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ 'Dẫu vậy… chừng đó vẫn chưa đủ để mang lại
    cho ông chút khoảng thở thực sự nào', việc phải 'xoay xở dàn xếp đủ đường tại
    thủ đô' và sự tăng tiến mức độ kiệt quệ từ thể xác sang tinh thần."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa nguyên nhân cộng hưởng khiến tình hình tệ hơn khi ông phải đối
    phó với 'các công việc chính trị, một lĩnh vực mà ông vốn chẳng mấy thông thạo'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000022
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại của Rudersdorf với đại từ 'Ta' và cách gọi trung
    tính 'hai người đó'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000023
  kind: terminology_and_voice
  value: locks=["Khóa sắc thái 'tự giễu' trong giọng nói của vị tướng."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000024
  kind: terminology_and_voice
  value: 'locks=["Khóa bản chất hoạt động của bốn nhóm chủ thể: ''Giới quan chức hành
    chính'' vì ''bộ máy quan liêu'', ''đám chính khách'' chỉ nghĩ cho bản thân, ''các
    nghị sĩ quốc hội'' đưa ra yêu sách và ''hoàng gia'' ôm ấp tham vọng cùng toan
    tính riêng."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa nguyên nhân bất đồng do mỗi bên tuân theo 'trường phái tư tưởng
    và ngôn ngữ riêng', nỗi khó khăn của 'một nhà chiến lược' khi làm việc với những
    kẻ vận hành theo 'một hệ logic khác biệt về căn bản' và hệ quả kéo theo 'quá nhiều
    cuộc tranh cãi vô nghĩa'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh ví von 'vị tướng lúc nào cũng đang phải đi trên dây'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa nhiệm vụ 'còn cả một cuộc chiến phải đánh'
    với 'những thủ tục quan liêu rườm rà vô bổ' đang 'thử thách sức chịu đựng của
    mạch máu trong người ông'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000028
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi than vãn độc thoại của Rudersdorf với đại từ 'Ta' về
    việc còn phải tiếp tục chống đỡ tình cảnh này thêm bao lâu."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000029
  kind: terminology_and_voice
  value: locks=["Khóa nhận định của người kể chuyện rằng lời than vãn vô tình 'chạm
    trúng cốt lõi của vấn đề trước mắt'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa phép đối chiếu giữa việc 'giành chiến thắng ở miền đông' và
    'bất chấp thất bại ở miền tây' vẫn buộc kẻ địch phải dè chừng, cùng thông điệp
    của 'Đế quốc' rằng họ sẽ không dễ dàng gục ngã hay chịu thua mà không chiến đấu
    kèm giới hạn thời gian '… ít nhất là ở thời điểm hiện tại'."]
- segment_id: YS-LN10/Text/chapter028.xhtml/p000031
  kind: terminology_and_voice
  value: 'locks=["Khóa nhận định đảo chiều góc nhìn: ''đó cũng là tất cả những gì
    họ đạt được''."]'
- segment_id: YS-LN10/Text/chapter028.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh ẩn dụ 'Cả quốc gia đang bước đi trên lớp băng mỏng
    đầy hiểm nguy', cấp bậc kèm tên riêng 'Trung tướng Rudersdorf' và hành động giấu
    tiếng thở dài vào làn khói thuốc lá đặc quánh khi trầm ngâm suy tính về cục diện."]
