choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000610
  kind: terminology_and_voice
  value: locks=['Khóa câu cảm thán ngắn gọn mở đầu cảnh.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000611
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc so sánh ngang bằng 'đúng với một sĩ quan cũng như với
    bất kỳ ai khác', thuật ngữ 'Các kiểm soát viên không lưu', đại từ 'họ' và tình
    thái dự đoán 'Có lẽ suốt phần đời còn lại, họ sẽ phải...'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000612
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' và cảm thán về việc đã rất lâu mới lại chứng
    kiến cảnh tượng như vậy."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000613
  kind: terminology_and_voice
  value: locks=['Khóa đầy đủ ba chi tiết thương vong trong các thông điệp truyền về
    (cánh tay bị xé đứt lìa, bạn bè tử trận, đồng đội bốc cháy) và cái kết bị cắt
    ngang bởi tiếng thét.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000614
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'các nhân viên thông tin vô tuyến', đại từ 'họ' -
    'mình', chi tiết 'ca trực canh vào đúng cái đêm định mệnh này chứ không phải đêm
    nào khác' và phủ định 'chẳng bao giờ muốn nghe'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000615
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'phòng kiểm soát', 'máy thu phát' và tình thái
    'các đồng đội nhiều khả năng sẽ không bao giờ trở về'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000616
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ'/'họ', nghi vấn gián tiếp 'liệu kết quả có xứng đáng
    với sự hy sinh đó hay không' và quan hệ nhân quả 'Chính vì thế mà họ lại càng
    không muốn bỏ sót bất kỳ một thông điệp nào'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000617
  kind: terminology_and_voice
  value: locks=["Khóa hiệu ứng nói lắp 'H-họ', tên đơn vị 'Tiểu đoàn Scotch', thuật
    ngữ 'các pháp sư trên không', đại từ 'chúng ta' và chi tiết đột nhập qua vành
    đai phòng thủ ở độ cao thấp."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000618
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'đài kiểm soát đánh chặn phía nam' và phủ định 'không
    thể đến kịp lúc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000619
  kind: terminology_and_voice
  value: locks=["Khóa lời hét cảnh báo khẩn cấp 'Cái gì?! Kẻ địch! Kẻ địch!'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000620
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi vặn lại 'Kẻ địch làm sao cơ?!'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000621
  kind: terminology_and_voice
  value: locks=['Khóa sự tương phản giữa lời yêu cầu báo cáo chi tiết và thực tế những
    người đồng đội ở đầu bên kia đã không còn thời gian.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000622
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng' và câu hét báo động kẻ địch đã ập tới nơi."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000623
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'Các nhân viên vận hành tại trung tâm chỉ huy',
    'đài kiểm soát đánh chặn phía nam' và cấu trúc nhấn mạnh thông điệp cuối cùng
    trong đêm cũng là thông điệp cuối cùng đài này nhận được."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000624
  kind: terminology_and_voice
  value: 'locks=[''Khóa trình tự âm thanh: tiếng nhiễu sóng -> tiếng nổ lớn -> sự
    im lặng hoàn toàn.'']'
- segment_id: YS-LN10/Text/chapter022.xhtml/p000625
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'các pháp sư Khối Thịnh vượng chung' và nhận định ý nghĩa
    sự việc đã quá rõ ràng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000626
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown toàn câu '*Chúng đã hạ gục đài kiểm soát
    đánh chặn phía nam rồi.*' khớp chính xác với thẻ <em> trong nguồn theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000627
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ' và tình huống chờ lệnh tiếp theo nhưng lại bắt được
    tín hiệu khác."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000628
  kind: terminology_and_voice
  value: locks=["Khóa nguyên văn câu tiếng Latinh kèm nhấn mạnh Markdown '“*Veni,
    vidi, vici.*”' theo đúng thẻ <em> trong nguồn (DEC-P01-002)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000629
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận định ngắn 'Đó là một thông điệp chiến thắng.'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000630
  kind: terminology_and_voice
  value: locks=["Khóa nhịp phủ định tự hiệu chỉnh 'Không, đúng hơn thì giống như chúng
    đang khoe khoang.', thuật ngữ 'Các pháp sư Đế quốc' và chi tiết phát thông điệp
    trên toàn bộ các tần số."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000631
  kind: terminology_and_voice
  value: locks=["Khóa bản dịch nghĩa câu danh ngôn 'Ta đến, ta thấy, ta chinh phục
    ư…?' và tiếng chửi cảm thán phía sau."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000632
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhượng bộ 'Dẫu phẫn nộ là thế' và nhận thức 'đêm nay
    vẫn chưa kết thúc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000633
  kind: terminology_and_voice
  value: locks=["Khóa hô hiệu 'Scotch Leader', các thuật ngữ 'trung tâm kiểm soát
    tích hợp', 'Đài kiểm soát đánh chặn phía nam', đại từ 'Tôi' và cấu trúc lặp lại
    thông báo khẩn cấp."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000634
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Người đàn ông đang hét lên những lời này' và địa danh 'mặt
    trận Rhine'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000635
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown toàn câu '*Tàn phá, gieo rắc hỗn loạn, rồi
    cuối cùng gây ra sự sụp đổ toàn diện.*' khớp chính xác với thẻ <em> trong nguồn
    theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000636
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Đế quốc', đại từ 'Anh' (chỉ Scotch Leader), 'chúng'
    (quân Đế quốc) và mục tiêu khổ luyện để kịch bản đó không bao giờ xảy ra trên
    địa bàn của mình."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000637
  kind: terminology_and_voice
  value: locks=['Khóa sự tương phản giữa nỗ lực hết mình và kết quả thảm hại cùng
    câu hỏi nội tâm bức bối.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000638
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng' - 'chúng ta', cụm 'Lũ khốn Đế quốc đó' và nhận
    định đối phương đã quay lại hoành hành sau một thời gian im ắng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000639
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô 'Thưa Chỉ huy! Chúng tôi...'"]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000640
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta' - 'chúng' và lời khẳng định quyết tâm ngăn
    chặn kẻ địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000641
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'tiểu đoàn của Scotch Leader', đại từ 'Anh' và niềm tự hào
    về năng lực của thuộc cấp."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000642
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh' - 'mình' và mối hoài nghi nội tâm liệu đạn của
    đơn vị có bắn trúng đích nổi không."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000643
  kind: terminology_and_voice
  value: locks=["Khóa ẩn dụ 'cối xay thịt của Lục quân Đế quốc', địa danh 'mặt trận
    Rhine', chức danh 'Vị tiểu đoàn trưởng', tên gọi 'Khối Thịnh vượng chung' và 'Thượng
    đế'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000644
  kind: terminology_and_voice
  value: locks=["Khóa đại từ sở hữu 'của anh' và phủ định 'đã không bao giờ bị đem
    ra thử thách trong đêm hôm đó'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000645
  kind: terminology_and_voice
  value: locks=["Khóa từ cảm thán bị ngắt 'Cái—?!' và câu hỏi kinh ngạc 'Chúng đang
    rút lui ư?!'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000646
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'trung tâm kiểm soát đánh chặn phía nam', chi tiết
    san phẳng mục tiêu rồi lập tức ngoặt hướng rút lui bằng những pha cơ động tuyệt
    mỹ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000647
  kind: terminology_and_voice
  value: locks=["Khóa hiệu ứng nói lắp 'K-kẻ địch đang rút lui sao?'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000648
  kind: terminology_and_voice
  value: locks=['Khóa tình thế tiểu đoàn chuẩn bị phản công nhưng lại bị những người
    lính Đế quốc bỏ lại phía sau.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000649
  kind: terminology_and_voice
  value: locks=["Khóa phạm vi nhấn mạnh Markdown '*Đến lúc đuổi theo chúng rồi*' khớp
    chính xác với thẻ <em> trong nguồn theo DEC-P01-002 và hình ảnh ẩn dụ 'trái cấm'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000650
  kind: terminology_and_voice
  value: locks=["Khóa mệnh lệnh '…Tập hợp quân lại! Đừng đuổi theo chúng!'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000651
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Con ác quỷ đó' và đại từ 'họ'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000652
  kind: terminology_and_voice
  value: locks=["Khóa hình ảnh 'địa ngục trần gian' đang chờ đợi ở hướng đó."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000653
  kind: terminology_and_voice
  value: locks=["Khóa sự đối lập giữa những người lính thận trọng / 'Scotch Leader—người
    duy nhất thoát nạn nhờ may mắn trong đêm hôm đó' với 'đài kiểm soát mặt đất' và
    câu hỏi thiếu suy nghĩ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000654
  kind: terminology_and_voice
  value: locks=["Khóa câu gọi lặp lại của 'Trung tâm kiểm soát tích hợp', đại từ 'Chúng
    tôi', hô hiệu 'Scotch Leader' và câu hỏi 'có thể truy kích không?'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000655
  kind: terminology_and_voice
  value: locks=["Khóa các đại từ 'Các người' - 'chúng tôi' - 'chúng' và giọng điệu
    phẫn nộ trong câu hỏi phản bác."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000656
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' và hành động bác bỏ ngay lập tức."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000657
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Không làm được! Không thể truy kích.', sự chuyển đổi
    hợp lý giữa 'chúng ta' (phe Khối Thịnh vượng chung bị chơi xỏ) và 'Chúng tôi'
    (đơn vị của Scotch Leader cần hạ cánh tái tổ chức) cùng điều kiện loại trừ 'trừ
    phi các người muốn cả bọn chúng tôi cũng bị tiêu diệt sạch!'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000658
  kind: terminology_and_voice
  value: locks=["Khóa hô hiệu 'Scotch Leader', đại từ 'Anh', thuật ngữ 'nhân viên
    mặt đất' và chi tiết hạ cánh xuống một căn cứ khác."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000659
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng' - 'chúng ta' và tình thái dự cảm 'chuyện này
    có lẽ mới chỉ là khởi đầu thôi!'."]
