choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000151
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp ngập ngừng 'Vâng ạ…' của Tanya trước lời đề nghị của
    Tướng Romel."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000152
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại nội tâm 'mình' / 'Mình' theo DEC-P01-001, hình
    ảnh 'gióng lên hồi chuông báo động trong đầu mình', và ý định lách khỏi chuyện
    này bằng giọng điệu cùng vẻ mặt mơ hồ."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000153
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'các pha cơ động né tránh khẩn cấp'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000154
  kind: terminology_and_voice
  value: locks=["Khóa chuỗi tự nhủ trong nội tâm của Tanya ('mình', 'ông ấy', 'chúng
    ta'), lối tự quy chiếu ngôi thứ ba 'Tanya' ở câu kết, và giới hạn 'cùng lắm cũng
    chỉ câu thêm cho Tanya được vài giây ngắn ngủi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000155
  kind: terminology_and_voice
  value: locks=["Khóa nhận định ngắn 'Kẻ địch quá đỗi hùng mạnh'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000156
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ xưng hô 'Ta' - 'cô' trong lời thoại của Tướng Romel
    giao việc xin phê chuẩn cho Tanya."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000157
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', giả định trái thực tế 'giá mà mình không
    hiểu những gì ông ấy đang ẩn ý', phủ định 'chẳng có cách nào trốn tránh', và các
    danh xưng 'Tướng Zettour', 'Tướng Romel', 'các sĩ quan cao cấp của Đế quốc'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000158
  kind: terminology_and_voice
  value: locks=["Khóa lối tự quy chiếu ngôi thứ ba 'Tanya', thuật ngữ 'pháp sư trên
    không', tên riêng 'Đế quốc', và phủ định 'tuyệt chẳng phải chuyện dễ dàng gì!'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000159
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa Tướng quân', đại từ 'ngài', và câu hỏi phản vấn
    lịch sự bỏ lửng của Tanya."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000160
  kind: terminology_and_voice
  value: locks=["Khóa nhận định phủ định của Tướng Romel 'Một người chỉ huy không
    thể dễ dàng rời khỏi vị trí của mình như thế được'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000161
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*bây giờ*' theo đúng DEC-P01-002, đại từ
    'ông ta', và nhận định về hậu quả nghiêm trọng đối với sự nghiệp của một người
    lính nếu phản đối nguyên tắc hiển nhiên này."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000162
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', cụm 'thành viên kỳ cựu của một tổ chức',
    và nhận định 'chẳng còn lựa chọn nào khác ngoài việc nuốt nước mắt vào trong'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000163
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'ta' - 'cô', tên cơ quan 'Văn phòng Bộ Tổng tham
    mưu', và lời khích lệ 'Hãy cùng nhau biến chuyện này thành hiện thực'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000164
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi', hô ngữ 'thưa Tướng quân', và cam kết tiến
    hành với sự bảo mật tối đa để đưa kế hoạch ra chiến trường."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000165
  kind: terminology_and_voice
  value: locks=["Khóa đại từ ngôi thứ ba 'Cô' và câu hỏi tu từ 'Cô còn có thể nói
    gì khác với người đàn ông này nữa đây?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000166
  kind: terminology_and_voice
  value: locks=["Khóa dòng tiêu đề thời gian – địa điểm 'NGÀY 14 THÁNG 8 NĂM THỐNG
    NHẤT 1927, VÙNG NGOẠI Ô KHỐI THỊNH VƯỢNG CHUNG'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000167
  kind: terminology_and_voice
  value: locks=["Khóa câu mô tả mở cảnh 'Đó là một ngôi nhà ngoại ô bình thường như
    bao ngôi nhà khác'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000168
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'dinh thự miền quê điển hình của giới quý tộc' và mệnh đề
    rào đón ở cuối đoạn 'hoặc ít nhất, vẻ bề ngoài của nó trông là như vậy'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000169
  kind: terminology_and_voice
  value: locks=["Khóa đại từ phiếm chỉ 'người ta' và sự chuyển biến ngay khoảnh khắc
    bước chân vào tòa nhà."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000170
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'các pháp sư hải quân', 'tiền tuyến', và chi tiết
    lính gác giả vờ mang dáng vẻ buồn chán, không quan trọng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000171
  kind: terminology_and_voice
  value: locks=['Khóa sự tương phản giữa giá trị thực của các pháp sư hải quân và
    việc họ đóng giả làm những người lính bộ binh thường.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000172
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Đội Cận vệ Hoàng gia' và địa danh 'thành phố sương
    mù'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000173
  kind: terminology_and_voice
  value: locks=["Khóa tên cơ quan 'tổng hành dinh của Cơ quan Tình báo Khối Thịnh
    vượng chung', đại từ phiếm chỉ 'người ta', và chi tiết 'một bộ quy trình an ninh
    lập dị mới lại vừa được thiết lập'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000174
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại thành tiếng 'Phải thừa nhận rằng những quy trình
    này rất thận trọng'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000175
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Các đòn tập kích chặt đầu chỉ huy', 'chiến dịch Rhine',
    và cụm 'Chủ nhân của cơ sở này'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000176
  kind: terminology_and_voice
  value: locks=['Khóa nhận định khái quát về sự cảnh giác và thận trọng của người
    đứng đầu bất kỳ cơ quan tình báo nào dù ở phương đông hay phương tây.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000177
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề giả định phủ định 'nếu ông ta không phải là người mà
    mình phải trực tiếp báo cáo'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000178
  kind: terminology_and_voice
  value: locks=["Khóa biệt danh 'con Ác quỷ sông Rhine', đại từ tự xưng 'mình' trong
    lời lẩm bẩm của Drake, và chi tiết vết thương cũ bắt đầu nhức nhối kèm linh cảm
    chẳng lành."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000179
  kind: terminology_and_voice
  value: locks=["Khóa phép so sánh vết sẹo với 'tấm huân chương' và 'những con chim
    hoàng yến', cùng đại từ giả định chung 'bạn'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000180
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake', đại từ ngôi thứ ba 'anh', cụm 'động
    vật xã hội', và phủ định 'Đầu óc lý trí của anh sẽ không cho phép bản năng lấn
    át mà quay đầu bỏ chạy'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000181
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Anh' và hành động rảo bước đi bên cạnh một người lính
    khác dọc theo các dãy hành lang."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000182
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', phủ định 'không hề có chút tự do đi lại nào, bất
    kể cấp bậc hay địa vị của họ ra sao', và cụm 'chế độ an ninh nghiêm ngặt của tòa
    nhà này'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000183
  kind: terminology_and_voice
  value: locks=["Khóa sự phân biệt đại từ ngôi thứ ba giữa Drake ('anh') và người
    lính dẫn đường ('anh ta'), ẩn dụ 'không phải là một bức tường cản lối mà là một
    pháp sư lái đò', tên riêng 'Charon', hình ảnh 'cánh cổng địa ngục đã định trước',
    và phủ định 'chẳng còn đường nào để chạy trốn hay ẩn nấp được nữa'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000184
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngắn 'Anh hít một hơi thật sâu'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000185
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'anh', hành động cúi chào người dẫn đường theo đúng nghi
    thức quân đội, và mô tả 'một người đàn ông với vẻ mặt đầy uy quyền đang chờ sẵn'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000186
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá' và đại từ 'anh' trong lời chào của cấp trên
    dành cho Drake."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000187
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đại từ 'anh', mô tả tuýp người lớn tuổi kiệm
    lời vừa nắm bắt được cốt lõi vấn đề vừa dễ nổi nóng trước mọi lời bào chữa, và
    chi tiết cơn đau đầu bắt đầu ập đến."]
