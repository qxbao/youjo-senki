    rơi vào tay địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000441
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình'/'mình' theo DEC-P01-001, chức vụ 'vị phó
