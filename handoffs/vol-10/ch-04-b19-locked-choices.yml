- segment_id: YS-LN10/Text/chapter022.xhtml/p000472
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', tiểu từ 'ạ' và phủ định 'chưa từng nghĩ chiến
    tranh lại có thể được tiến hành theo cách này'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000473
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình'/'mình' theo DEC-P01-001, tên riêng 'Thiếu
    tá Weiss', 'Visha', thuật ngữ 'chiến tranh tổng lực' và câu hỏi nội tâm hướng
    tới thuộc cấp."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000474
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng' - 'chúng ta', câu hỏi tu từ phủ định 'chẳng phải
    ... hay sao?' và giọng điệu châm biếm về 'việc làm nhân đạo'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000475
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại ngập ngừng bỏ lửng của Visha ('Ồ, tôi…')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000476
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung úy Serebryakov', đại từ 'Cô' và câu hỏi thăm
    dò của Tanya."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000477
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, chức danh 'viên sĩ quan
    phụ tá', đại từ 'cô ấy', 'bọn họ' và hai câu hỏi nội tâm giữ nguyên độ mở về phản
    ứng căng thẳng của các sĩ quan."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000478
  kind: terminology_and_voice
  value: locks=['Khóa nhận định nội tâm về tầm quan trọng của việc giao tiếp thông
    suốt.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000479
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'chiến tranh tổng lực', cách gọi 'hỡi các chiến hữu',
    đại từ 'Chúng ta' và phủ định 'không thể phân biệt đối xử được'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000480
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngược lại giữ liên kết từ vựng 'vấn đề phân biệt đối
    xử sao ạ?' ở câu kết batch."]
