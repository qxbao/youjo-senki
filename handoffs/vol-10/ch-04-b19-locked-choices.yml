- segment_id: YS-LN10/Text/chapter022.xhtml/p000459
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và hành động vừa cảnh
    giác quan sát xung quanh vừa đi thẳng vào trọng tâm."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000460
