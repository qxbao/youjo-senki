    '*nghĩ*' theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000447
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Đế quốc', 'Khối Thịnh vượng chung', thuật ngữ 'tiền
    tuyến' và nội dung đánh lừa địch về mục tiêu buộc rút quân."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000448
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng ta' - 'chúng', các thuật ngữ 'kịch bản', 'tác
    chiến hằng đêm', 'ưu thế trên không', 'tuyến phòng thủ', 'giai đoạn hai' và thời
