- segment_id: YS-LN10/Text/chapter022.xhtml/p000456
  kind: terminology_and_voice
  value: locks=["Khóa từ đáp lễ 'Vâng', danh từ 'Cấp trên', tiểu từ 'ạ' và câu hỏi
    về tính toán của cấp trên."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000457
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 và hành động gật đầu
    tán thành."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000458
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi' và phạm vi người nghe 'tất cả những ai đang
