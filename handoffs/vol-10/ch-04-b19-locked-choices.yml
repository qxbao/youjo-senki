- segment_id: YS-LN10/Text/chapter022.xhtml/p000437
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', các thuật ngữ 'trinh sát chiến đấu', 'đại
    đội', 'Khối Thịnh vượng chung', 'hệ thống phòng không ban đêm của địch' và mục
    tiêu thăm dò phòng không đêm."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000438
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'bài kiểm tra sức chịu đựng', 'nhiệm vụ trinh sát
    chiến đấu', 'những pháp sư dày dạn kinh nghiệm' và phủ định 'không phải là việc
    gì đặc biệt nguy hiểm'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000439
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, cụm 'các cấp dưới' và
    tâm trạng nhẹ nhõm khi thấy sự tự tin của thuộc cấp."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000440
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta' - 'các vị' - 'chúng', thuật ngữ 'công
