- segment_id: YS-LN10/Text/chapter022.xhtml/p000443
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Thiếu tá Weiss', đại từ 'chúng ta' - 'chúng', các
    thuật ngữ 'hoạt động tuần tra đêm', 'Trận Không chiến Phương Tây', 'tuyến phòng
    thủ ở hậu phương của chúng' và mục đích nghi binh rút quân địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000444
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng' chỉ địch và thuật ngữ 'các pháp sư trên không'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000445
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận định ngắn 'Đúng y như những gì kế hoạch đã nêu.'"]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000446
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'những quả trứng ung', tên gọi 'Đế quốc', đại từ 'Chúng
