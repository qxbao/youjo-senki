- segment_id: YS-LN10/Text/chapter022.xhtml/p000462
  kind: terminology_and_voice
  value: locks=["Khóa mệnh lệnh 'Nhỏ tiếng thôi.', đại từ nội tâm 'Mình'/'mình' theo
