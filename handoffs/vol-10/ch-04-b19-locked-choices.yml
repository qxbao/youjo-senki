- segment_id: YS-LN10/Text/chapter022.xhtml/p000463
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, cụm 'các cấp dưới' và
    nhận định kế hoạch sẽ phát huy tác dụng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000464
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Thiếu tá Weiss', 'Visha', đại từ nội tâm 'Mình' theo
