    đoàn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000442
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Thiếu tá Weiss với Tanya ('Tôi', 'thưa Trung tá',
