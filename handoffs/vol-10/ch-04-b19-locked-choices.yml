- segment_id: YS-LN10/Text/chapter022.xhtml/p000468
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Vị phó chỉ huy của mình' theo DEC-P01-001 và biểu cảm hoài
    nghi trước câu nói đùa."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000469
  kind: terminology_and_voice
  value: locks=["Khóa lời nhận xét dè dặt của Weiss ('một nước đi vô cùng táo bạo
    ạ')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000470
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi tu từ phủ định của Tanya ('Làm sao có thể thắng một
