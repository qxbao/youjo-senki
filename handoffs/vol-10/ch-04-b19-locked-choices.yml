- segment_id: YS-LN10/Text/chapter022.xhtml/p000449
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình'/'Mình' theo DEC-P01-001, đại từ 'họ' và
    phủ định 'sẽ không nhận thêm câu hỏi nào nữa'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000450
  kind: terminology_and_voice
  value: locks=["Khóa thông báo hoãn chi tiết cụ thể và lời khích lệ 'Hãy cho chúng
    thấy bản lĩnh của chúng ta.'"]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000451
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình'/'Mình' theo DEC-P01-001, các danh xưng
    'Thiếu tá Weiss', 'các trung úy', 'Trung úy Serebryakov' và suy đoán của Tanya
    về câu hỏi của Weiss."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000452
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Tanya với Weiss ('Anh', 'Thiếu tá') và giọng trêu
    đùa về việc làm tăng ca."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000453
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô lễ phép của Weiss với Tanya ('tôi'/'Tôi', 'Trung tá',
