    tính chính trị."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000466
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown '*bản thổ Khối Thịnh vượng chung*' theo DEC-P01-002,
