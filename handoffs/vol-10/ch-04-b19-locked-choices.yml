- segment_id: YS-LN10/Text/chapter022.xhtml/p000461
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', tiểu từ 'ạ', tên gọi 'Khối Thịnh vượng chung'
