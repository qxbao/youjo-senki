- segment_id: YS-LN10/Text/chapter022.xhtml/p000436
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'buổi phổ biến nhiệm vụ', 'tiểu đoàn', đại từ 'họ'
