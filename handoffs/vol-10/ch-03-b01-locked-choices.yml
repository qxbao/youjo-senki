choices:
- segment_id: YS-LN10/Text/chapter016.xhtml/p000001
  kind: terminology_and_voice
  value: 'locks=["Khóa dòng tiêu đề thời gian và địa điểm viết hoa toàn bộ: ''NGÀY
    11 THÁNG 8 NĂM THỐNG NHẤT 1927, TRUNG TÂM CHỈ HUY PHÍA TÂY CỦA LỤC QUÂN ĐẾ QUỐC'';
    không dùng nhấn mạnh Markdown."]'
- segment_id: YS-LN10/Text/chapter016.xhtml/p000002
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tướng Zettour', tên riêng 'Tanya', đại từ 'ông',
    cách gọi khẩu ngữ 'lũ Cộng sản', địa danh 'mặt trận phía đông' và sắc thái mỉa
    mai của câu kết."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000003
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'vị đại tướng tương lai này', phủ định ('hoàn toàn chẳng
    phải một người hiền lành gì', 'chẳng thấy bóng dáng đâu'), tên gọi 'Liên bang'
    và trạng thái Tanya không thể tham gia vào thời khắc then chốt."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000004
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật ngôi thứ ba ('Cô', 'cô'), các thuật ngữ
    'thủ đô', 'sĩ quan phụ tá', 'sĩ quan Bộ Tổng tham mưu' và phủ định ('không còn
    cần thiết ở phía đông nữa', 'không thể mượn cô quá lâu')."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000005
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô' - 'mình' và chi tiết ra về tay trắng, chỉ thu hoạch
    thêm vài mạng bắn hạ vào bảng thành tích."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000006
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'cô', phủ định ('chẳng giúp ích được gì nhiều') và ẩn
    dụ 'công cuộc săn tìm việc làm mới'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000007
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Tôi từng tham gia
    chiến dịch đó đấy! Cái chiến dịch lớn ấy, ông biết mà!*', sự chuyển dịch điểm
    nhìn từ tự khách quan hóa ngôi thứ ba ('Tanya', 'cô') sang độc thoại nội tâm ngôi
    thứ nhất ('Mình'), cùng các thuật ngữ 'tập đoàn quốc doanh' và 'Lục quân Đế quốc'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000008
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và ý nghĩa sự việc chỉ
    là một mắt xích trong chuỗi dài sự kiện cản trở kế hoạch rời khỏi đây."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000009
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', các địa danh 'đế đô', 'mặt trận phía
    đông', cặp ẩn dụ công sở 'chủ sử dụng lao động' - 'nhân viên' và sắc thái chán
    ngán bầu không khí lạc quan."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000010
  kind: terminology_and_voice
  value: locks=["Khóa câu độc thoại thành tiếng của Tanya với đại từ tự quy chiếu
    'mình' và giữ nguyên độ mở của câu hỏi tự vấn."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000011
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và thuật ngữ 'chính quốc'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000012
  kind: terminology_and_voice
  value: locks=["Khóa sự phân tách giữa cái tên 'Tanya' (cơ thể chưa đủ tuổi uống
    rượu) và chủ thể nội tâm 'mình' đang cảm nhận cơn mệt mỏi bủa vây."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000013
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', tình thái phỏng đoán nguyên nhân ('Có
    lẽ là do thiếu ngủ, hoặc cũng có thể vì mình đã làm việc quá sức') và ý nghĩ lệch
    lạc rằng thà ở ngoài chiến trường còn hơn."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000014
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và nhận định khái quát về tầm quan trọng
    của việc một con người được nghỉ ngơi đầy đủ."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000015
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Tanya', địa danh 'mặt trận phía tây', nhấn mạnh Markdown
    theo DEC-P01-002 tại '*Chết rồi tha hồ mà nghỉ*', danh xưng 'Tướng Romel', đại
    từ 'Chúng ta' và đánh giá ông ta là kiểu cấp trên tệ hại nhất để phục vụ."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000016
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn trần thuật hiện tại lịch sử ('Tanya', 'cô', 'ông ta'),
    thuật ngữ 'sở chỉ huy mặt trận phía tây' và 'trung tâm chỉ huy'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000017
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', thuật ngữ 'các sĩ quan tham mưu cao cấp'
    và 'đợt thị sát'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000018
  kind: terminology_and_voice
  value: locks=["Khóa các cấp bậc/chức danh 'đại úy', 'sĩ quan phụ tá của vị tướng',
    'Tướng Romel', 'ban tham mưu', đại từ 'anh ta' - 'ông ta' và chi tiết quan sát
    từ trên xe tăng, liên lạc qua điện đài."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000019
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông ta' - 'mình', phần bình luận dí dỏm đính chính từ
    bánh xe sang xích xe tăng, thuật ngữ 'tiền tuyến', 'đi thị sát' và 'vị tướng mới
    nhậm chức'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000020
  kind: terminology_and_voice
  value: locks=["Khóa nhận định khái quát về việc các sĩ quan trực tiếp ghé thăm 'tiền
    tuyến'."]
- segment_id: YS-LN10/Text/chapter016.xhtml/p000021
  kind: terminology_and_voice
  value: locks=["Khóa câu thoại của Tanya với đại từ 'họ' chỉ nhóm của Tướng Romel,
    thuật ngữ 'đi thị sát' và sự cảm thông xã giao dành cho các đơn vị cùng đội ngũ
    sĩ quan."]
