segment_id_end: YS-LN10/Text/chapter022.xhtml/p000520
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000481
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, chức danh 'viên sĩ quan
    phụ tá' và chi tiết biểu cảm méo xệch diễn ra ở trong lòng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000482
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Họ'/'họ', các phủ định 'đâu có biết gì', 'Không thể
    tin nổi', 'chưa từng được học bất cứ điều gì' và các thuật ngữ 'quyền con người',
    'phân biệt đối xử'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000483
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, sự đối lập giữa người
    đến từ thế giới khác với người chỉ sinh ra ở thế giới này và ý định chuyển chủ
    đề."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000484
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô trong lời phổ biến của Tanya ('chúng ta', 'tôi' - 'các
    vị'), các thuật ngữ 'nhiệm vụ biệt kích', 'lực lượng biệt kích' và nhiệm vụ kép
    vừa bảo vệ biệt kích vừa nghiên cứu kẻ địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000485
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình'/'mình' theo DEC-P01-001, đại từ 'họ',
    cụm 'các sĩ quan của mình' và mức độ 'gần như đã tan biến hết'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000486
  kind: terminology_and_voice
  value: locks=["Khóa chức vụ 'vị phó chỉ huy của mình' theo DEC-P01-001 và hành động
    chủ động đưa ra đề xuất mang tính xây dựng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000487
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', tiểu từ 'ạ', tên riêng 'Meybert', 'Tospan' và
    câu hỏi xin ý kiến thu thập thông tin."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000488
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, cách diễn đạt lược đại
    từ nhân xưng ở câu đầu để khớp tự nhiên với chủ thể phó chỉ huy Weiss bất chấp
    lỗi đại từ của bản nguồn tiếng Anh, tên gọi 'Đế quốc', phủ định 'không phải là
    một ý tồi' và tình thái 'biết đâu họ lại có vài góc nhìn hữu ích'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000489
  kind: terminology_and_voice
  value: locks=["Khóa lời tán thành ngắn gọn và mệnh lệnh nhắc nhở 'Nhưng hãy luôn
    cảnh giác.'"]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000490
  kind: terminology_and_voice
  value: locks=["Khóa cách xưng hô 'Thưa Trung tá', tiểu từ 'ạ' và câu hỏi xác nhận
    lại ý nghĩa của từ 'cảnh giác'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000491
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Tôi' - 'các vị', các phủ định tuyệt đối 'Đừng
    sử dụng máy bộ đàm vô tuyến', 'bất kỳ phương tiện nào khác ngoài vô tuyến', yêu
    cầu 'giữ tuyệt đối bí mật' và thuật ngữ 'Kampfgruppe'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000492
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và quan hệ nhượng bộ
    giữa việc đồng tình tham khảo chuyên gia với việc nhấn mạnh bảo mật."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000493
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Weiss', thuật ngữ 'Kampfgruppe', đại từ 'họ' và điều
    kiện ngụy trang cuộc trao đổi thành cuộc họp chung của toàn Kampfgruppe."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000494
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Tôi', tiểu từ 'ạ' và danh xưng 'Đại úy Ahrens'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000495
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi chức vụ 'Phó chỉ huy', đại từ 'tôi' và phép điệp nhấn
    mạnh 'tất cả mọi người'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000496
  kind: terminology_and_voice
  value: locks=["Khóa câu nói ngập ngừng bị bỏ lửng 'Nhưng anh ấy đang…' quy chiếu
    về Đại úy Ahrens."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000497
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, tên riêng 'Weiss', 'Ahrens',
    đại từ 'anh ta', thuật ngữ 'đơn vị xe tăng của Kampfgruppe' và 'chính quốc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000498
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, danh xưng 'vị đại úy',
    đại từ 'anh ta' và thuật ngữ 'thao trường'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000499
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Quân kháng chiến của địch', đại từ 'chúng ta' - 'Chúng',
    danh xưng 'Trung úy Serebryakov', xưng hô 'tôi' - 'cô', các thuật ngữ 'quỹ tiểu
    đoàn', 'Kampfgruppe' và chỉ thị mở tiệc nhỏ làm bình phong."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000500
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Chúng ta', tiểu từ 'ạ' và câu hỏi dè dặt của Visha."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000501
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 và đại từ 'cô ấy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000502
  kind: terminology_and_voice
  value: locks=["Khóa phủ định bảo mật 'không một lời nào lọt ra khỏi bữa tiệc' và
    đại từ 'chúng ta'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000503
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp nhận lệnh 'Rõ ạ.'"]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000504
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 và chức danh 'vị phó
    chỉ huy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000505
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Tanya với Weiss ('Anh', 'Chúng ta') và mệnh lệnh
    phủ định 'Đừng có làm hỏng chuyện đấy.'"]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000506
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Thiếu tá Weiss', đại từ 'anh ta', câu hỏi nội tâm
    của Tanya và hình ảnh 'một con chó săn chiến tranh khát máu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000507
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Thiếu tá Weiss', thuật ngữ 'mặt trận phía tây', đại
    từ 'anh', 'chúng ta' và nhận định thực chất nơi này đã là lãnh thổ phe mình."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000508
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Weiss với Tanya ('tôi', 'thưa Trung tá', tiểu từ
    'ạ') và phủ định 'không có cảm giác như vậy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000509
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định so sánh 'như thể đây là mặt trận phía đông'
    và câu hỏi chốt lệnh 'Rõ chưa?'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000510
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị thiếu tá', đại từ nội tâm 'mình' theo DEC-P01-001,
    cụm 'Tanya trong lòng mình', đại từ 'anh ta' và nhận định về những người lính
    đã chung sống với chiến tranh quá lâu."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000511
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, cụm 'các binh sĩ của
    mình' và mốc chuyển cảnh khi Tanya trở về phòng riêng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000512
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại 'mình' khi Tanya than thở một mình trong phòng
    và câu hỏi tự vấn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000513
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, hình ảnh so sánh 'chẳng
    khác nào một kẻ yêu nước nồng nhiệt' và nhận định 'hành động vô giá trị theo đúng
    nghĩa đen nhất'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000514
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Đế quốc', đại từ nội tâm 'mình' theo DEC-P01-001 và
    mong muốn duy nhất là thoát khỏi nơi này."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000515
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'Không hơn, không kém', đại từ nội tâm 'mình' theo DEC-P01-001
    và phủ định 'chẳng thể nào tự giải thoát cho bản thân'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000516
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và thuật ngữ 'quyền lực
    nhà nước'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000517
  kind: terminology_and_voice
  value: locks=["Khóa câu điều kiện giả định trái thực tế ở hiện tại ('Giá như thị
    trường không phải là ..., mình đã có thể ...'), đại từ nội tâm 'mình' theo DEC-P01-001,
    thuật ngữ 'vốn con người' và tên gọi 'Being X'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000518
  kind: terminology_and_voice
  value: locks=["Khóa câu điều kiện giả định trái thực tế ('Nếu không tại tên khốn
    đó, mình đã có thể ...'), đại từ nội tâm 'mình' theo DEC-P01-001 và cụm 'các quyền
    con người cơ bản'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000519
  kind: terminology_and_voice
  value: locks=["Khóa đại từ độc thoại 'Mình' và cụm 'mức tiêu chuẩn văn hóa tối thiểu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000520
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình'/'Mình' theo DEC-P01-001, chuỗi ẩn dụ 'con
    tàu đang đắm' - 'con tàu đắm' - 'lật úp' - 'con thuyền này', cấu trúc tăng tiến
    đổi chủ thể 'không những ... mà mình lại còn ...' và cụm 'nhà tuyển dụng tiềm
    năng'."]
