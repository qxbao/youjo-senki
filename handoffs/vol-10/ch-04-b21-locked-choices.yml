- segment_id: YS-LN10/Text/chapter022.xhtml/p000533
  kind: terminology_and_voice
  value: 'locks=["Khóa đại từ nội tâm ''mình'' theo DEC-P01-001 và cấu trúc liệt kê
    ba mục tiêu: ''Vì một chút bình yên, vì một tương lai khiêm nhường, và vì sự nghiệp
    của chính mình.''"]'
- segment_id: YS-LN10/Text/chapter022.xhtml/p000534
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và cụm 'với tư cách một
