    các tên gọi 'Trận Không chiến Phương Tây', 'Khối Thịnh vượng chung', 'Đế quốc',
    nhấn mạnh Markdown '*công việc thường nhật có độ căng thẳng cao*' theo DEC-P01-002
    và cụm 'một kiểu khái niệm tự mâu thuẫn'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000540
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'họ' và thế cân bằng giữa việc duy trì một mức độ cảnh
