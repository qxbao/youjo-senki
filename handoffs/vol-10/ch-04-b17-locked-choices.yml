choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000361
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'vị tướng', tình thái 'có vẻ như' và ý đã nghĩ ra
    cách giảm thiểu bất lợi đó."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000362
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' - 'chúng ta' theo DEC-P01-001, nhấn mạnh
    Markdown '*tàu khu trục xung kích*' theo DEC-P01-002, thông số 'ba mươi hải lý
    một giờ', thuật ngữ 'các toán đổ bộ', tên gọi 'Khối Thịnh vượng chung' và câu
    hỏi nghi vấn về phương thức lao tàu thẳng lên bờ biển địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000363
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại của Tướng Romel ('Chúng ta', 'Ta'), thuật ngữ 'tự
    đánh đắm', 'tàu khu trục', 'bên hải quân' và phủ định 'sẽ chẳng vui vẻ gì đâu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000364
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận của Tanya với đại từ 'Chúng ta', tiểu từ lễ
    phép 'ạ' và phủ định bộ phận 'sẽ không đưa được toàn bộ tàu thuyền trở về'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000365
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'vị tướng', đại từ 'ông ta', chủ thể 'Bên hải quân'
    và giả định về phản ứng dữ dội của hải quân nếu nghe thấy câu nói đó."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000366
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, danh xưng 'Tướng Romel'
    và nhận định về niềm tin vững chắc của ông đối với bản kế hoạch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000367
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ta' và phủ định 'không còn đường lui nữa'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000368
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Chúng ta', tên gọi 'Khối Thịnh vượng chung' và
    yêu cầu cấp thiết phải trực tiếp đưa binh lính đặt chân lên bờ biển địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000369
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi đề xuất giả định của Tanya với đại từ 'chúng ta', tiểu
    từ 'ạ', thuật ngữ 'các pháp sư trên không', 'yểm trợ đường không' và mục đích
    phân tán sự tập trung của địch để tăng cơ hội chiến thắng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000370
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta' - 'chúng', phủ định 'không nằm trong
    tính toán' và 'biển cả không phải của riêng mình chúng', cùng lập luận rằng việc
    dùng pháp sư sẽ làm giảm sức nặng của chiến thắng hải quân."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000371
  kind: terminology_and_voice
  value: locks=["Khóa hai câu hỏi liên tiếp của Tanya với đại từ 'chúng ta', tiểu
    từ 'ạ' và cấu trúc hỏi phản vấn 'Chẳng phải... cũng sẽ phục vụ cùng một mục đích
    đó hay sao?'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000372
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Romel' và hành động gật đầu thật sâu trong
    im lặng trước khi trả lời."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000373
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Chúng ta' - 'chúng', tên gọi 'Khối Thịnh vượng
    chung', thuật ngữ 'đàm phán ngoại giao' và cặp ý liên kết giữa niềm tin 'vô biên'
    trên biển của địch với việc chỉ rõ 'giới hạn thực sự nằm ở đâu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000374
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại của Tanya ('chúng ta', 'ngài', tiểu từ 'ạ'), đại
    từ chỉ địch ('chúng') và sắc thái nhận xét rằng mục tiêu hủy diệt sự tự tin trên
    biển của địch nghe khá hào hứng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000375
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, tên gọi 'Being X', phủ
    định so sánh đầu câu và nhận định về bản tính con người luôn cố tìm ý nghĩa trong
    những công việc vô nghĩa buộc phải làm."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000376
  kind: terminology_and_voice
  value: locks=["Khóa đại từ khái quát 'bạn', điều kiện giả định được trả lương xứng
    đáng, phủ định 'Chẳng ai muốn làm không công cả' và kết luận tư duy cầu tiến cùng
    thái độ tích cực tạo ra sự đổi mới."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000377
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 và hành động vỗ hai bàn
    tay vào nhau."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000378
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta' - 'chúng', thuật ngữ 'trọng pháo công
    thành', ẩn dụ 'những bức tường gỗ' chỉ hải quân Khối Thịnh vượng chung và câu
    hỏi phản vấn gợi ý thổi bay tất cả thành từng mảnh vụn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000379
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'Chúng ta' - 'chúng', phủ định 'không có đủ tiềm
    lực để đập toạc chúng ra' và mệnh đề điều kiện 'Nếu việc tối đa chúng ta làm được
    chỉ là gõ cửa, thì tốt nhất là hãy gõ cho thật đàng hoàng'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000380
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại của Tanya ('Tôi', 'chúng ta', tiểu từ 'ạ'), thuật
    ngữ 'pháo đường sắt tầm xa' và sắc thái tiếc nuối về mong muốn không thực hiện
    được."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000381
  kind: terminology_and_voice
  value: locks=["Khóa tình thái giả định trái thực tế ở quá khứ ('hẳn sẽ...'), các
    thuật ngữ 'Lực lượng biệt kích', 'sự yểm trợ của hải quân', 'đạn pháo cỡ nòng
    lớn', tên gọi 'Khối Thịnh vượng chung' và phủ định 'Sẽ chẳng có sự kiểm duyệt
    nào đủ sức ngăn...'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000382
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô trong thoại của Tanya với Romel ('chúng ta', 'Tôi',
    'ngài', 'thưa Tướng quân'), thuật ngữ 'tác chiến trên biển' và ý hy vọng cấp trên
    không định giữ sức vào đúng lúc này."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000383
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự xưng của Tướng Romel ('ta') và ẩn dụ chiếc ví rỗng
    tuếch khi dốc ngược lên chỉ rơi ra toàn biên lai."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000384
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta', thuật ngữ 'yểm trợ đường không' và
    cảnh báo tàu chiến sẽ thành bia sống nếu thiếu sự yểm trợ đường không dù chỉ ở
    mức hạn chế."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000385
  kind: terminology_and_voice
  value: locks=["Khóa các thuật ngữ 'không quân', 'Chiến tranh Thái Bình Dương', 'lực
    lượng yểm trợ đường không', 'các tàu chiến-tuần dương' và kết luận phủ định rằng
    nếu không có yểm trợ đường không thì tàu chiến-tuần dương chỉ có nước chìm xuống
    đáy đại dương."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000386
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và ý nghi ngờ đôi tai
    của chính mình."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000387
  kind: terminology_and_voice
  value: locks=['Khóa dấu gạch ngang mở lời thoại của Romel và phủ định việc yểm trợ
    đường không sẽ không diễn ra.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000388
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn thể hiện sự sững sờ của Tanya ('Sao cơ ạ?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000389
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại 'chúng ta', các thuật ngữ 'hệ thống phòng không',
    'Các lực lượng không quân', 'những phi đoàn' và lý do lực lượng không quân đã
    bị điều đi chi viện phương xa hoặc đang tái tổ chức."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000390
  kind: terminology_and_voice
  value: locks=["Khóa tên gọi 'Đế quốc', 'siêu cường quân sự', 'Cụm tập đoàn quân
    phía Tây' và câu hỏi nội tâm phản ánh sự nghịch lý khi không có nổi lực lượng
    cần thiết để tác chiến toàn lực."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000391
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và quyết tâm nói thẳng
    suy nghĩ trong lòng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000392
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'thưa Tướng quân', tiểu từ 'ạ' và phủ định 'tiền đề
    của kế hoạch không còn đứng vững nữa'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000393
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'chúng ta', số lượng và chủng loại tàu ('Hai
    chiếc tàu chiến-tuần dương và ba chiếc tàu tuần dương hạng nhẹ'), thuật ngữ 'sự
    yểm trợ đường không', 'các đội tuần tra đêm' và điều kiện tối thiểu phải xử lý
    đội tuần tra đêm của địch."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000394
  kind: terminology_and_voice
  value: locks=["Khóa đại từ thoại của Tanya ('tôi', 'chúng ta', tiểu từ 'ạ'), các
    thuật ngữ 'ưu thế trên không cục bộ', 'các điểm nghẽn', 'những chiến hạm' và cảnh
    báo bất kỳ phương án nào khác sẽ dẫn đến tổn thất toàn bộ các chiến hạm quan trọng."]
