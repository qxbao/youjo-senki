- segment_id: YS-LN10/Text/chapter026.xhtml/p000032
  kind: terminology_and_voice
  value: choices=["Giữ cấp bậc và tên gọi 'Trung tướng Romel'; thuật ngữ 'bản báo
    cáo sau trận đánh ban đầu' cho initial after-action report.", "Giữ đại từ ngôi
    thứ ba 'họ' chỉ phía đơn vị gửi báo cáo."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000033
  kind: terminology_and_voice
  value: choices=["Giữ điểm nhìn trần thuật ngôi thứ ba theo sát Romel ('ông'); 'lực
    lượng của họ bị đánh chặn' chỉ lực lượng Đế quốc."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000034
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'Khối Thịnh vượng chung', 'Hạm đội Bản thổ', 'Hải
    quân Đế quốc', 'vùng eo biển'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000035
  kind: terminology_and_voice
  value: choices=["Giữ câu độc thoại của Romel dùng đại từ 'Chúng' chỉ quân địch và
    cấu trúc phủ định nhấn mạnh 'thậm chí còn chẳng buồn che giấu điều đó nữa'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Giữ các thuật ngữ cấp đơn vị và biên chế: ''hạm đội địch'', ''chiến
    hạm cơ động nhanh'', ''hải đội'', ''lữ đoàn pháp sư'', ''trung đoàn'', ''Hạm đội
    Bản thổ''.", "Giữ cấu trúc tăng tiến ''Không chỉ vậy, chúng còn...'' và phủ định
    ''không bao giờ có đơn vị pháp sư nào lớn hơn cấp trung đoàn đi kèm''."]'
- segment_id: YS-LN10/Text/chapter026.xhtml/p000037
  kind: terminology_and_voice
  value: choices=["Giữ cấp bậc và họ 'Trung tá Degurechaff'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000038
  kind: terminology_and_voice
  value: choices=["Giữ đại từ 'ông' và sắc thái nhấn mạnh 'Chỉ riêng tiêu đề thôi
    cũng đủ khiến ông chết sững'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=[''Giữ nguyên tiêu đề báo cáo trong ngoặc kép (không in nghiêng
    theo nguồn): “Động thái của Pháp sư Địch—Việc Sử dụng Binh lính làm Bao cát/Những
    Điểm Tương đồng với Chiến thuật Tác chiến ở Miền Đông”.'', "Giữ cách gọi ''vị
    trung tá'' và ''Khối Thịnh vượng chung''."]'
- segment_id: YS-LN10/Text/chapter026.xhtml/p000040
  kind: terminology_and_voice
  value: choices=["Giữ mức độ so sánh 'tồi tệ hơn một vụ rò rỉ thông tin đơn thuần
    rất nhiều'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000041
  kind: terminology_and_voice
  value: choices=["Giữ tên đơn vị 'Tiểu đoàn Pháp sư Trên không số 203', 'Đế quốc'
    và quan hệ nhân quả trong phán đoán của Romel."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Giữ lời tự nhủ của Romel: ''lỗ hổng rò rỉ cần phải bịt lại''."]'
- segment_id: YS-LN10/Text/chapter026.xhtml/p000043
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'chiến trường phía nam' cho southern theater."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000044
  kind: terminology_and_voice
  value: choices=["Giữ tên riêng 'Cộng hòa François', tình thái quá khứ 'suýt mắc
    bẫy bản báo cáo giả' và phủ định 'không bao giờ quên'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000045
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'các điệp viên tình báo', cách gọi 'Vị tướng' và
    đối sánh với 'các đồng cấp của mình'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000046
  kind: terminology_and_voice
  value: choices=["Giữ đại từ tự xưng 'mình' trong lời độc thoại của Romel và phủ
    định 'chẳng phải đối thủ của dân chuyên nghiệp'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000047
  kind: terminology_and_voice
  value: choices=["Giữ trần thuật ngôi thứ ba 'Ông' và phủ định 'không nén nổi'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000048
  kind: terminology_and_voice
  value: choices=["Giữ đại từ tự xưng 'mình' trong độc thoại của Romel; giữ thuật
    ngữ 'vị tướng', 'sĩ quan tham mưu cao cấp', 'Tình báo' và phủ định 'tuyệt nhiên
    không phải sở trường của mình'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000049
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'trường đại học quân sự', 'hoạt động gián điệp',
    'được mã hóa' và cấu trúc đối lập 'học cách... chứ không học cách...'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000050
  kind: terminology_and_voice
  value: choices=["Giữ trần thuật 'ông' và phủ định 'chẳng có tư cách gì để bàn sâu
    về lĩnh vực đó'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000051
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'Đế quốc', 'cơ sở hạ tầng', 'chiến tranh thông tin
    một cách bài bản'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000052
  kind: terminology_and_voice
  value: choices=["Giữ cụm 'Lũ gián điệp Khối Thịnh vượng chung chết tiệt đó' và phủ
    định 'Chẳng có thứ gì nằm ngoài tầm với của chúng cả'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000053
  kind: terminology_and_voice
  value: choices=["Giữ danh xưng 'Trung tướng Romel'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000054
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'thanh tra toàn bộ lục quân' cho conduct an audit
    of the entire army; giữ điểm nhìn trần thuật 'ông' và 'họ' (phía Đế quốc)."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000055
  kind: terminology_and_voice
  value: choices=["Giữ chuỗi bốn câu hỏi giả định trong độc thoại của Romel và thuật
    ngữ 'các bộ mật mã của ta'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000056
  kind: terminology_and_voice
  value: choices=["Giữ nghĩa khái quát 'Mỗi câu hỏi đặt ra chỉ càng kéo theo thêm
    mối nghi ngờ'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000057
  kind: terminology_and_voice
  value: choices=["Giữ đánh dấu nhấn mạnh Markdown '*Chuyện gì thế này, một cuốn tiểu
    thuyết gián điệp nào đó chắc?*' đúng phạm vi thẻ <em> trong nguồn theo DEC-P01-002.",
    "Giữ đối lập giữa 'tiểu thuyết gián điệp' và 'đời thực' (nonfiction)."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000058
  kind: terminology_and_voice
  value: choices=["Giữ đại từ tự xưng 'mình', phủ định 'chẳng thể dám chắc về bất
    cứ điều gì nữa' và câu hỏi đuôi 'phải không?'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000059
  kind: terminology_and_voice
  value: choices=["Giữ cách gọi 'Tướng Romel', đại từ 'Ông' và chi tiết hành động
    vô thức với điếu thuốc."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000060
  kind: terminology_and_voice
  value: choices=["Giữ câu hỏi nội tâm gián tiếp tự do ở ngôi thứ ba ('Ông', 'họ')
    và thuật ngữ 'điệp viên tình báo'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000061
  kind: terminology_and_voice
  value: choices=["Giữ câu độc thoại phủ định ở tương lai 'Chừng đó vẫn sẽ không đủ'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000062
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'tái tổ chức toàn bộ mặt trận phía tây'."]
- segment_id: YS-LN10/Text/chapter026.xhtml/p000063
  kind: terminology_and_voice
  value: choices=["Giữ thuật ngữ 'Quân đội Liên bang', 'Đế quốc', 'ở miền đông' và
    phủ định 'vẫn chưa có dấu hiệu nào'."]
