source_sha256: 227b8883d5a8e3130cfe2f54b05e0c3323cf2f3e1c41a6f4c12d99b6452c8f96
source_package_sha256: 099f8e1f7a971a57258b811a23612c7434ea5e273664fea9abf10fc7444df2d4
glossary_version: sha256:d5f19d64d8d734e1a21400978b70a7c10daf776ba7f77eb58f01a39ac78f5a41
unit_count: 40
segment_id_start: YS-LN10/Text/chapter018.xhtml/p000220
segment_id_end: YS-LN10/Text/chapter018.xhtml/p000259
choices:
- segment_id: YS-LN10/Text/chapter018.xhtml/p000220
  kind: terminology_and_voice
  value: locks=["Khóa tương quan thứ tự ưu tiên 'là người của Liên bang trước khi
    là những người Cộng sản', cấu trúc đối lập 'Động lực thúc đẩy họ là chủ nghĩa
    dân tộc chứ không phải Chủ nghĩa Cộng sản', và đại từ 'Tôi' - 'chúng ta' - 'họ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000221
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake', đại từ 'mình' - 'Anh', và mức độ khả năng
    'hoàn toàn có thể đặt dấu chấm hết cho sự nghiệp của mình'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000222
  kind: terminology_and_voice
  value: locks=["Khóa tên cơ quan 'nhánh Tình báo của Lục quân Khối Thịnh vượng chung',
    thuật ngữ 'Chủ nghĩa Cộng sản', và lập luận về việc nhắc tới hệ tư tưởng này cũng
    đủ hủy hoại tương lai sĩ quan."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000223
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhượng bộ 'Bất chấp điều đó, Drake vẫn giữ vững lập
    trường'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000224
  kind: terminology_and_voice
  value: locks=["Khóa sự tương phản giữa thái độ khẳng định 'Tôi ghét chế độ của họ'
    và câu hỏi nội tâm gián tiếp mở 'tôi tự hỏi liệu chúng ta có nên ghét cả con người
    họ hay không'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000225
  kind: terminology_and_voice
  value: locks=["Khóa phủ định 'Không đáp lời', đại từ 'ông' (chỉ cấp trên) và danh
    xưng 'Trung tá Drake', cùng sự tương phản giữa nét hung bạo và lời tuyên bố muốn
    làm một ông già hiền hậu."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000226
  kind: terminology_and_voice
  value: locks=["Khóa tư thế 'Đứng nghiêm', tên riêng 'Drake', và nhận định về sự
    im lặng ngột ngạt."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000227
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn của Drake ('Anh'), trạng thái không còn bận tâm đến
    kết cục cuối cùng, và hình ảnh so sánh như một bị cáo sắp nghe tuyên án cuối cùng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000228
  kind: terminology_and_voice
  value: locks=["Khóa liên từ đối lập 'Ngược lại', đại từ sở hữu 'cấp trên của anh',
    và chuỗi hành động hút xì gà thong thả rồi đột ngột đặt lên gạt tàn và nói thẳng
    thừng."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000229
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'anh' - 'chúng ta', thuật ngữ 'người theo chủ nghĩa
    nhân đạo', hô ngữ 'Trung tá ạ', và lời cảnh báo 'Sự ủy mị kiểu đó sẽ khiến anh
    mất mạng đấy'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000230
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'thưa Tướng quân', phủ định 'tôi không biến thành một
    con quái vật nào đó khi bước lên chiến trường', và kiến nghị loại bỏ một vài thành
    viên bắt đầu từ 'Trung úy Sue'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000231
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc tăng tiến cùng chủ thể 'Anh không những chẳng biết
    cảm kích vì đã được miễn trừ trách nhiệm, mà giờ còn dám hạ cố đưa ra lời khuyên
    sao?', cặp đại từ 'Anh' - 'tôi', và hô ngữ 'Trung tá'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000232
  kind: terminology_and_voice
  value: locks=["Khóa mệnh đề nhượng bộ chỉ thái độ 'Dù cố tình không che giấu vẻ
    bất mãn' và thiện chí vẫn sẵn lòng lắng nghe của cấp trên."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000233
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Trung tá' và câu hỏi xác nhận có phủ định 'ý anh là
    chuyện này không phải một tai nạn sao?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000234
  kind: terminology_and_voice
  value: locks=["Khóa quan hệ nhân quả giải thích vì sao sự cố vị trí có vẻ như tai
    nạn nhưng thực chất là 'lỗi do con người' do kẻ địch cố tình nhử các thành viên
    non kinh nghiệm trong 'đơn vị đa quốc gia'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000235
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tướng Habergram', đại từ 'ông', và nhận định ông
    đã hiểu kẻ địch giăng bẫy nhử họ."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000236
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'ông' và nhận định đánh giá của ông về hình thái tuyến
    đầu rất đơn giản."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000237
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'chúng' - 'chúng ta' và câu kết luận ngắn gọn thừa nhận
    đã bị đối phương qua mặt."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000238
  kind: terminology_and_voice
  value: locks=["Khóa câu đáp 'Vâng, thưa ngài' và câu nhận xét mỉa mai về việc liệu
    các pháp sư kỳ cựu của 'Lục quân Đế quốc' có mọc đuôi hay không."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000239
  kind: terminology_and_voice
  value: locks=["Khóa sự liên hệ với hình ảnh 'lũ ác quỷ' và câu hỏi trực tiếp của
    Habergram về tính khả thi của việc ngăn chặn sự việc tương tự tái diễn."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000240
  kind: terminology_and_voice
  value: locks=["Khóa tên riêng 'Drake' và cử chỉ hổ thẹn lắc đầu đáp lại."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000241
  kind: terminology_and_voice
  value: locks=["Khóa căn cứ 'Xét đến xuất thân của những người lính bên chúng ta'
    và nhận định dứt khoát 'tôi phải nói là bất khả thi'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000242
  kind: terminology_and_voice
  value: locks=['Khóa hai câu hỏi liên tiếp của Habergram về việc dạy lính đừng mắc
    mưu khiêu khích và liệu đòi hỏi đó có quá đáng không.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000243
  kind: terminology_and_voice
  value: locks=["Khóa hô ngữ 'Thưa ngài', biệt danh 'Ác quỷ sông Rhine', cách gọi
    trung tính 'tên pháp sư đó', và mức độ khẳng định tuyệt đối 'không ai sánh kịp'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000244
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá Drake' và hành động thở dài kìm nén nỗi
    bực dọc."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000245
  kind: terminology_and_voice
  value: locks=["Khóa cách gọi 'Bóng ma chết tiệt đó' và lời nhận xét gay gắt 'là
    hạng người tồi tệ nhất'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000246
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Pháp sư Định danh', biệt danh mới 'Bạch Ngân Rỉ Sét',
    cách quy chiếu 'Con ác quỷ đó' / 'tên pháp sư ấy', và lý do biệt danh bắt nguồn
    từ máu của vô số nạn nhân."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000247
  kind: terminology_and_voice
  value: locks=["Khóa biệt danh 'Ác quỷ sông Rhine' và lời xác nhận 'Tôi từng nghe
    qua cái tên đó rồi' của Habergram."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000248
  kind: terminology_and_voice
  value: locks=["Khóa từ đáp 'Vâng' và dấu chấm lửng ở cuối câu thoại bị ngắt lời
    của Drake."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000249
  kind: terminology_and_voice
  value: locks=["Khóa hiệu lệnh ngắt lời 'Khoan đã', biệt danh 'Ác quỷ sông Rhine',
    thuật ngữ 'Pháp sư Định danh', cụm 'các đòn tập kích chặt đầu chỉ huy', và câu
    hỏi nhận diện 'Hai kẻ đó là một ư?'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000250
  kind: terminology_and_voice
  value: locks=['Khóa điểm nhìn của Drake nhận thấy sự hứng thú của vị tướng dù chưa
    rõ nguyên do.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000251
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'xác nhận bằng mắt thường', giả định nhượng bộ về việc chỉ
    số ma năng có thể làm giả, và khẳng định phủ định 'không thể nào nhầm lẫn con
    ác quỷ đó trên chiến trường được'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000252
  kind: terminology_and_voice
  value: locks=["Khóa câu khẳng định ngắn gọn 'Drake hoàn toàn chắc chắn về điều đó'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000253
  kind: terminology_and_voice
  value: locks=["Khóa lối nói mỉa mai 'màn âu yếm ngắn ngủi ở cự ly cực gần', cách
    gọi 'Con ác quỷ đó', và các thuật ngữ 'lưỡi kiếm ma pháp', 'thuật thức bắn tỉa
    quang học', 'thuật thức phát nổ'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000254
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận nguyên nhân vết thương từ trận giao chiến với
    'tên Pháp sư Định danh đó'."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000255
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định trái thực tế trong quá khứ dẫn tới hệ quả
    ở hiện tại ('Nếu không nhờ được cấp cứu kịp thời và trị liệu ma pháp, thì giờ
    này hẳn tôi hoặc là đã về hưu non, hoặc là đã nằm trong túi đựng xác rồi')."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000256
  kind: terminology_and_voice
  value: locks=["Khóa cụm 'kẻ chuyên tung đòn chặt đầu chỉ huy' và nhận định những
    lời lẽ đầy cảm xúc của Drake đã thu hút trọn vẹn sự chú ý của cấp trên."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000257
  kind: terminology_and_voice
  value: locks=['Khóa sự tương phản giữa vẻ ngoài điềm tĩnh của vị tướng tóc điểm
    bạc và nhận thức của Drake rằng ông đang suy tính điều gì đó.']
- segment_id: YS-LN10/Text/chapter018.xhtml/p000258
  kind: terminology_and_voice
  value: locks=["Khóa cặp đại từ 'Tôi' - 'anh' và lời đề nghị hỏi thêm về cuộc chạm
    trán của Tướng Habergram."]
- segment_id: YS-LN10/Text/chapter018.xhtml/p000259
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'tiền tuyến', 'bản thổ', danh xưng 'Trung tá Drake',
    và phủ định 'chẳng có gì là bất thường cả'."]
