choices:
- segment_id: YS-LN10/Text/chapter020.xhtml/p000024
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, tên cơ quan 'Bộ Ngoại
    giao', danh xưng 'Đại tá Lergen' và phủ định 'không thể làm ngơ'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000025
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại 'Bộ *Ngoại giao* của
    Đế quốc', đại từ nội tâm 'mình', tên riêng 'Đế quốc' và các chi tiết miêu tả tranh
    sơn dầu ('buổi lập quốc', 'cú xung phong của một hiệp sĩ', 'khoảng hai mươi người
    dân thường')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000026
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và dấu chấm lửng mở đầu '…Nỗi buồn dâng
    lên trong lồng ngực mình.'"]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000027
  kind: terminology_and_voice
  value: locks=["Khóa câu giả định trái thực tế ('Nếu đây là một tòa nhà của quân
    đội thì lại là chuyện khác'), phủ định ('chẳng bao giờ cần đến thứ như vậy'),
    thuật ngữ 'Văn phòng Bộ Tổng tham mưu' và cụm 'những người theo chủ nghĩa hiện
    thực triệt để'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000028
  kind: terminology_and_voice
  value: 'locks=["Khóa lời gọi cấp trên của Tanya với Lergen: ''“Thưa Đại tá.”''"]'
- segment_id: YS-LN10/Text/chapter020.xhtml/p000029
  kind: terminology_and_voice
  value: 'locks=["Khóa lời đáp của Lergen gọi đúng cấp bậc thực tế của Tanya: ''“Sao
    thế, Trung tá?”''"]'
- segment_id: YS-LN10/Text/chapter020.xhtml/p000030
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', cụm 'cấp trên' và phủ định giảm nhẹ 'Chẳng
    suy nghĩ gì nhiều'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000031
  kind: terminology_and_voice
  value: locks=["Khóa thuật ngữ 'Bộ Ngoại giao', đại từ 'nước ta' - 'chúng ta' (phía
    quân đội/Đế quốc) đối lập với 'họ' (Bộ Ngoại giao) trong lời thoại."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000032
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' - 'chúng ta', tên riêng 'Đế quốc' và chi
    tiết miêu tả bức tranh lập quốc."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000033
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc điều kiện mỉa mai sau dấu gạch ngang ('—nếu như họ
    đang dốc hết sức mình để dọa dẫm bất kỳ vị quan khách ngoại giao nước ngoài nào')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000034
  kind: terminology_and_voice
  value: locks=["Khóa câu giả định kèm tình thái giảm nhẹ ('Nếu điều đó là có chủ
    đích, thì có lẽ nó chỉ là...') và thuật ngữ 'chính sách ngoại giao pháo hạm'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000035
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình', tên cơ quan 'Bộ Ngoại giao', tên riêng
    'Đế quốc', thuật ngữ 'chủ nghĩa lãng mạn' và chuỗi phủ định ('mà chẳng mảy may
    suy nghĩ', 'chẳng hiểu nổi mục đích', 'Mình không biết', 'không tán đồng')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000036
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Trung tá' trong câu thoại ngập ngừng của Lergen."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000037
  kind: terminology_and_voice
  value: locks=["Khóa cặp xưng hô cấp dưới - cấp trên ('Tôi' - 'ngài', 'thưa Đại tá')
    và cụm 'các nhà ngoại giao'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000038
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'Mình' - 'mình', đại từ 'ông' chỉ Lergen và sự
    tương đồng biểu cảm giữa hai cấp trên - cấp dưới."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000039
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Lergen với Tanya ('Tôi' - 'cô', 'Trung tá'), đại
    từ 'chúng ta', 'ông ấy' và chức danh 'vị tham tán tên là Conrad'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000040
  kind: terminology_and_voice
  value: locks=["Khóa xưng hô của Tanya với Lergen ('tôi' - 'ngài'), đại từ 'ông ta'
    chỉ Conrad khi chưa gặp và cụm 'tư duy của bên quân đội'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000041
  kind: terminology_and_voice
  value: locks=["Khóa câu phủ định đảo hướng ('Ngược lại mới đúng'), đại từ 'Ông ấy'
    - 'chúng ta' - 'tôi' - 'cô' và cụm 'những người tiền nhiệm'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000042
  kind: terminology_and_voice
  value: locks=["Khóa câu cảm thán ngắn '“Chà, chà.”'"]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000043
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình', đại từ 'ông ta', các địa danh/vị trí
    'thủ đô', 'hậu phương' và tình thái suy đoán ('Hẳn ông ta phải...', 'hẳn phải
    vất vả lắm')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000044
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi nội tâm về tình thế chưa ngã ngũ ('một đất nước chưa
    biết sẽ thắng hay bại trong chiến tranh'), đại từ 'mình', danh xưng 'Đại tá Lergen'
    và 'Tham tán Conrad'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000045
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' và điểm nhấn 'văn hóa'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000046
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Vị tham tán', sự phân biệt đại từ 'chúng tôi' (Tanya
    và Lergen) với 'mình' (nội tâm Tanya) và 'họ' (Bộ Ngoại giao), cùng tình thái
    hoài nghi ('Hoặc có lẽ đó chỉ là cách...')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000047
  kind: terminology_and_voice
  value: locks=["Khóa danh xưng 'Tham tán Conrad', cụm 'cấp trên và mình' và hình
    ảnh so sánh 'sắc lẹm như một lưỡi dao găm'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000048
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi trực diện 'Chúng ta có thể thắng cuộc chiến này không?'
    và cách xưng hô lịch sự của Conrad với hai sĩ quan ('Tôi' - 'hai vị')."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000049
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển điểm nhìn tự khách quan hóa từ 'chúng tôi' sang ngôi
    thứ ba 'cả Tanya lẫn Đại tá Lergen', tên riêng 'Đế quốc' và thuật ngữ đơn vị 'Kampfgruppe
    của họ'."]
- segment_id: YS-LN10/Text/chapter020.xhtml/p000050
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*Chiến thắng.*', đại
    từ nội tâm 'Mình' và sự đối lập giữa 'biết ý nghĩa của nó' với 'trăn trở suy ngẫm
    về định nghĩa của nó'."]
