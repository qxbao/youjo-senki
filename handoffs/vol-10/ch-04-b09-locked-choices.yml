segment_id_start: YS-LN10/Text/chapter022.xhtml/p000083
segment_id_end: YS-LN10/Text/chapter022.xhtml/p000126
choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000083
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật về 'Cả hai quân nhân' (Tanya và Lergen) kìm nén
    mong mỏi rằng 'giới lãnh đạo' cũng có được sự khiêm tốn tương tự."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000084
  kind: terminology_and_voice
  value: locks=["Khóa cấu trúc giả định trái thực tế ở quá khứ ('Giá như họ có lấy
    một mảy may đức tính này thôi, thì cuộc chiến đã diễn ra khác đi nhiều rồi') với
    đại từ 'họ' liên kết trực tiếp về 'giới lãnh đạo' ở p000083 để tránh nhầm với
    Tham tán Conrad."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000085
  kind: terminology_and_voice
  value: locks=["Khóa nhận định từ góc nhìn chuyên gia và cấu trúc so sánh tuyệt đối
    ('chẳng còn gì tệ hại hơn một kẻ có trí tuệ làng nhàng nhưng lại tưởng mình thông
    tỏ mọi thứ về bất kỳ chủ đề nào được nhắc tới')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000086
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba với tên 'Tanya' và đại từ 'Cô' khi chọn
    thuật ngữ ngoại giao."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000087
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya với thuật ngữ 'Giảng hòa', đại từ bao gộp
    'chúng ta' và yêu cầu phải diễn ra nhanh chóng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000088
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Cô' (Tanya) và danh xưng 'Tham tán Conrad'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000089
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật đối chiếu ánh mắt giữa 'Tanya' ('cô') và 'ông
    ta' (Conrad), cùng tình thái có vẻ lời nói đã phát huy tác dụng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000090
  kind: terminology_and_voice
  value: locks=["Khóa đại từ 'Ông ta' (Conrad) thở dài và ngước nhìn lên trần nhà."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000091
  kind: terminology_and_voice
  value: locks=["Khóa tình thái khả năng và phủ định ('Có thể bản thân ông ta không
    nhận ra, nhưng nãy giờ ông ta vẫn cứ rung đùi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000092
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại lặp ba lần thuật ngữ 'Giảng hòa, giảng hòa, giảng
    hòa…' của Conrad."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000093
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với đại từ 'Ông ta' châm xì gà, gãi đầu và rít
    một hơi với ánh mắt trống rỗng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000094
  kind: terminology_and_voice
  value: locks=["Khóa câu miêu tả làn khói đặc quánh phả ra từ miệng 'ông ta'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000095
  kind: terminology_and_voice
  value: locks=["Khóa mốc thời gian và tên riêng 'Tanya', 'Tham tán Conrad'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000096
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với thuật ngữ 'sĩ quan cấp tá' và suy luận
    tất yếu ('thì ắt hẳn nó phải là sự thật')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000097
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi ngắn của Tanya với đại từ 'ông' ('Ý ông là…?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000098
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với đại từ 'Tôi' - 'chúng ta', thuật ngữ
    'giảng hòa' và 'bên lục quân'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000099
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận xét nội tâm về việc 'cánh nhà ngoại giao này' vốn khó
    hiểu ngay cả trong những lúc thuận lợi nhất."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000100
  kind: terminology_and_voice
  value: locks=["Khóa nhận xét nội tâm với đại từ 'họ' (cánh nhà ngoại giao), phủ
    định ('chẳng bao giờ nói ra điều gì thực chất') và mệnh đề điều kiện kép về phẩm
    chất người lính ('Sự rõ ràng và ngắn gọn—thiếu một trong hai thứ đó thì không
    thể làm một người lính được')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000101
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với danh xưng 'Đại tá Lergen' và tên riêng 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000102
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với cách gọi 'Thưa Tham tán', đại từ 'chúng
    ta' và câu hỏi về phản ứng của kẻ địch ('Họ')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000103
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi của Conrad với đại từ 'ông' (gọi Lergen)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000104
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với danh xưng 'Vị tham tán'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000105
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật và lời đáp ngập ngừng dạng câu hỏi phủ định của
    'Đại tá Lergen' ('Bởi vì chúng ta không ở vào vị thế có thể đưa ra yêu sách?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000106
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với cách gọi 'Thưa Đại tá', xưng hô 'tôi'
    - 'chúng ta', phủ định ('đang không hiểu') và câu hỏi tu từ phủ định ('Chẳng phải
    vì thế nên chúng ta mới cần giảng hòa sao?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000107
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen xác nhận và quy chiếu 'những người bên
    phía ông' (phía Bộ Ngoại giao)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000108
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với tên 'Tham tán Conrad' ('Ông ta') vỗ tay cắt
    ngang lời 'Đại tá Lergen'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000109
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad gọi 'Đại tá Lergen', xưng hô 'tôi' - 'các
    ông' (phía quân đội) và nhịp ngập ngừng chuyển hướng ('Không, khoan đã')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000110
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi lại của Lergen với đại từ 'ông'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000111
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với 'Tham tán Conrad', 'Đại tá Lergen' và 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000112
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với đại từ 'ông ta' (Conrad) và chi tiết nụ cười
    ranh mãnh."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000113
  kind: terminology_and_voice
  value: locks=["Khóa nhấn mạnh Markdown theo DEC-P01-002 tại '*giảng hòa có điều
    kiện*' và '*lá cờ trắng*', cùng sự đối lập giữa phương án của 'Đại tá Lergen'
    và 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000114
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Conrad với danh xưng 'Con tiểu quỷ' (chỉ Tanya),
    đại từ 'ông' (Lergen), 'chúng ta', 'Tôi', cụm 'cầu hòa' và câu hỏi đuôi ('Tôi
    nói có sai không?')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000115
  kind: terminology_and_voice
  value: locks=["Khóa sự pha trộn điểm nhìn giữa ngôi thứ ba ('cô', 'Tanya') và độc
    thoại nội tâm ngôi thứ nhất ('mình' theo DEC-P01-001), cấu trúc giả định trái
    thực tế ('Giá như Tanya không phải là một người lính, cô đã hét toáng lên') và
    nhấn mạnh Markdown theo DEC-P01-002 tại '*Ông nói chuẩn quá đi chứ!*'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000116
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất với đại từ tự quy chiếu 'mình'
    theo DEC-P01-001."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000117
  kind: terminology_and_voice
  value: locks=["Khóa đại từ tự quy chiếu 'Mình' theo DEC-P01-001, tên 'nhà ngoại
    giao Conrad' và câu hỏi cảm thán về việc 'Đế quốc' tự đẩy mình vào cảnh khốn cùng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000118
  kind: terminology_and_voice
  value: locks=["Khóa đại từ nội tâm 'mình' theo DEC-P01-001, đại từ 'ông ta' (Conrad)
    và hành động đề cập trực tiếp tới vấn đề nhạy cảm mà ai cũng né tránh."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000119
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya với đại từ 'Tôi', phủ định thẩm quyền bác
    bỏ ('không ở vào vị thế có thể bác bỏ') và danh xưng 'Bộ Ngoại giao'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000120
  kind: terminology_and_voice
  value: locks=["Khóa trần thuật ngôi thứ ba về 'Tanya' ('cô'), chuỗi phủ định thẩm
    quyền kéo theo không gánh trách nhiệm, cùng các thuật ngữ 'giới quan chức hành
    chính' và 'chế độ trọng dụng nhân tài tự xưng'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000121
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật liên kết nhận định giữa 'Tanya' ('cô') và 'ông
    ta' (Conrad)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000122
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại tán thưởng của Conrad dành cho 'Đại tá Lergen'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000123
  kind: terminology_and_voice
  value: locks=["Khóa câu bình luận nội tâm với thuật ngữ 'ngôn ngữ chung'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000124
  kind: terminology_and_voice
  value: locks=['Khóa câu cảm thán nội tâm về sự đồng điệu khi trân trọng cùng những
    giá trị như nhau.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000125
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật với tên 'Tham tán Conrad' ('ông ta'), 'Tanya'
    và thuật ngữ 'chuyên viên nhân sự'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000126
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại mời làm việc tại 'Bộ Ngoại giao' sau khi rời quân
    ngũ của 'Tham tán Conrad', xưng hô 'tôi' (và phản thân 'mình') - 'cô', danh xưng
    'Trung tá Degurechaff', cùng đoạn trần thuật xen giữa về sự phấn khích của 'Tanya'."]
