choices:
- segment_id: YS-LN10/Text/chapter022.xhtml/p000162
  kind: terminology_and_voice
  value: locks=["Khóa sự chuyển đổi/tách biệt điểm nhìn trong cùng đoạn giữa tự sự
    nội tâm ngôi thứ nhất ('mình' theo DEC-P01-001) và quy chiếu ngôi thứ ba ('Tanya'),
    cùng tên 'Đại tá Lergen' ('ông ấy'), 'Tham tán Conrad' ('ông ta'), cấu trúc phủ
    định kép ('không thể không nhận ra', 'hẳn không phải điều') và nhấn mạnh Markdown
    '*sao ông ta nhận ra được chứ?*' theo DEC-P01-002."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000163
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm với đại từ 'Ông ấy' (Lergen), ẩn dụ 'chiếc
    mặt nạ' và câu hỏi về 'bản lĩnh vững vàng' khi làm việc ở 'chính quốc'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000164
  kind: terminology_and_voice
  value: locks=["Khóa câu giả định trái thực tế trong nội tâm với đại từ 'mình' theo
    DEC-P01-001, thuật ngữ 'các sĩ quan Bộ Tổng tham mưu', tình thái 'có lẽ' và phủ
    định 'chẳng bao giờ nhận ra được' đối với 'bộ mặt lạnh tanh kín như bưng này của
    ông ấy'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000165
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại yêu cầu giải thích của Conrad gửi tới 'Đại tá Lergen'
    với cặp xưng hô 'tôi' - 'ông'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000166
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Tham tán Conrad' rút thêm điếu
    xì gà và 'vị đại tá' cuối cùng chịu nhượng bộ."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000167
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi xác nhận ngắn của Lergen gửi tới Conrad với đại từ 'Ông'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000168
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp khẳng định của Conrad với cách gọi 'thưa Đại tá' và
    đại từ 'ông'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000169
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp 'Được thôi' và câu trần thuật ngôi thứ ba mô tả 'Đại
    tá Lergen' ('ông') hút thuốc lá rồi đưa ra 'một tiết lộ phũ phàng' trước 'họ'
    (Tanya và Conrad)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000170
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với phủ định tuyệt đối ('Chẳng có sự đồng
    thuận nào cả', 'hoàn toàn không có chút đồng thuận nào') giữa ba chủ thể 'Bộ Tổng
    tham mưu', 'Bộ Tư lệnh Tối cao' và 'chính phủ'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000171
  kind: terminology_and_voice
  value: locks=["Khóa câu nhận xét nội tâm tóm lược nghịch lý ('Sự đồng thuận duy
    nhất chính là chẳng có sự đồng thuận nào cả')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000172
  kind: terminology_and_voice
  value: locks=['Khóa câu cảm thán nội tâm ngắn về sự mỉa mai.']
- segment_id: YS-LN10/Text/chapter022.xhtml/p000173
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Đại tá Lergen' tiếp tục nói
    ra sự thật nghiệt ngã như trò đùa tồi tệ trong khi 'Tanya' và 'vị tham tán' chết
    lặng vì bàng hoàng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000174
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen hướng tới Conrad ('Ông'), giữ thuật ngữ
    'giảng hòa', phủ định ('chẳng tìm nổi một người nào có thể trả lời') và giả định
    mỉa mai ở câu cuối."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000175
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với tên 'Tanya' cao giọng lên tiếng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000176
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại phản bác đầy sửng sốt của Tanya trước cấp trên (có
    tiểu từ kính ngữ 'ạ'), giữ thuật ngữ 'bên lục quân', 'những định hướng chỉ đạo'
    và hai câu hỏi phủ định liên tiếp."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000177
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Đại tá Lergen' ('ông') lắc đầu
    trang nghiêm và góc nhìn của 'Tanya' không sao hiểu nổi sự điềm tĩnh đó."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000178
  kind: terminology_and_voice
  value: locks=["Khóa câu hỏi chất vấn của Tanya về 'Văn phòng Bộ Tổng tham mưu' (giữ
    sắc thái kính ngữ 'ạ' khi nói trước mặt cấp trên)."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000179
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại bị bỏ lửng của Lergen gọi Tanya là 'Trung tá', xưng
    hô 'tôi' - 'cô' và đại từ bao gộp 'Chúng ta' / 'chúng ta' với tư cách là 'quân
    nhân'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000180
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba mô tả 'Tanya' ngắt lời 'ông' (Lergen)
    và thẳng thừng bác bỏ cấp trên."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000181
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Tanya với cụm mở đầu lịch sự trước khi phản bác
    ('Xin thứ lỗi cho sự mạo muội của tôi thưa Đại tá'), xưng 'tôi' và dùng 'chúng
    ta' trong câu hỏi phủ định cuối đoạn."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000182
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với phủ định ('không phải là cuộc
    trò chuyện cần phải lặp đi lặp lại nhiều lần') và tên 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000183
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật nối tiếp với đại từ 'cô' (Tanya) và cụm 'các
    sĩ quan Bộ Tổng tham mưu khác'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000184
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngắn nhấn mạnh sự bất lực khi 'cô' (Tanya) vẫn
    phải lặp lại điều đó."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000185
  kind: terminology_and_voice
  value: locks=["Khóa hai câu hỏi than thở trong lời thoại của Tanya với đại từ 'tôi'
    và cấu trúc phủ định ('chẳng đến được tai một ai cả', 'chẳng bao giờ có bất cứ
    thứ gì thay đổi')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000186
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Đại tá Lergen' ('Ông') phả làn
    khói thuốc chứa 'nicotine và hắc ín' trước nỗi lo âu của 'Tanya'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000187
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen gọi Tanya là 'Trung tá', xưng hô 'tôi'
    - 'cô' với tư cách người trong cùng tổ chức chỉ ra chỗ cô đang làm sai."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000188
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp ngắn lịch sự của Tanya mời Lergen nói tiếp ('Xin Đại
    tá cứ nói')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000189
  kind: terminology_and_voice
  value: locks=["Khóa lời khuyên ẩn dụ của Lergen với đại từ 'Cô', hình ảnh 'bọc đường
    cho những viên thuốc đắng nhất' và phủ định 'không được hà tiện đường đâu'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000190
  kind: terminology_and_voice
  value: locks=["Khóa lời đáp trả theo nghĩa đen thời chiến của Tanya với đại từ 'Chúng
    ta', 'Tôi' / 'mình', cùng chi tiết chuyển đổi 'các cánh đồng củ cải đường' thành
    'ruộng khoai tây'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000191
  kind: terminology_and_voice
  value: locks=["Khóa lời thoại của Lergen với đại từ 'cô' (Tanya), phủ định số lượng
    ('Chẳng có mấy người như cô'), ẩn dụ 'nuốt trôi viên thuốc đắng mang tên thực
    tại' và thành ngữ 'quẳng hết lẽ thường qua cửa sổ'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000192
  kind: terminology_and_voice
  value: locks=["Khóa câu trần thuật ngôi thứ ba với 'Tanya' ('cô') nhìn lên trần
    nhà lắng nghe lời khuyên mỏi mệt từ 'một vị đại tá mỏi mệt'."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000193
  kind: terminology_and_voice
  value: locks=["Khóa điểm nhìn nội tâm ngôi thứ nhất với đại từ tự quy chiếu 'mình'
    theo DEC-P01-001 và tâm trạng hối hận vì đã ở lại căn phòng."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000194
  kind: terminology_and_voice
  value: locks=["Khóa lời cảm thán mỉa mai ('Thật không thể tin nổi!') kết hợp trần
    thuật nội tâm ngôi thứ nhất ('Mình' / 'mình' theo DEC-P01-001) và phủ định ('vốn
    đã chẳng có ý nghĩa gì ngay từ đầu')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000195
  kind: terminology_and_voice
  value: locks=["Khóa độc thoại nội tâm ngôi thứ nhất với đại từ 'mình', tên 'Đế quốc'
    ('họ'), phủ định ('thậm chí còn chẳng vận hành bình thường được nữa') và các thuật
    ngữ tài chính ẩn dụ ('Séc của họ có thể bị từ chối thanh toán', 'tín dụng quay
    vòng', 'thiếu tiền mặt để thanh toán các khoản nợ')."]
- segment_id: YS-LN10/Text/chapter022.xhtml/p000196
  kind: terminology_and_voice
  value: locks=["Khóa đoạn kết nội tâm phê phán sự phi lý của việc đánh trận bằng
    'các khoản vay ứng trước', giữ nguyên mệnh đề nhượng bộ ('ngay cả khi đó là quyền
    được tắc trách') và sự sụp đổ nguyên tắc."]
