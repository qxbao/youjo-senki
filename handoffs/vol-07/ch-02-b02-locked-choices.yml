choices:
- segment_id: YS-LN07/Text/chapter006.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: lời chào đón Đại úy Ahrens dùng ''Chúng tôi''
    - ''anh'' và ''Đại úy''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quân hàm: ''aerial magic officers'' -> ''các sĩ quan
    ma pháp trên không''; ''First Lieutenant Grantz'' -> ''Trung úy Grantz''; ''on
    duty'' -> ''đang làm nhiệm vụ trực chiến''; giữ chi tiết loại trừ Grantz và hành
    động Weiss vỗ vai Ahrens cười lớn."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & giọng thoại: ''Major Weiss'' -> ''Thiếu tá Weiss'';
    giữ câu hỏi đuôi chia sẻ sự nhẹ nhõm của Tanya."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: Weiss đáp lời Tanya lịch sự (''Vâng, đúng
    thế thật ạ''); ''aerial mage battalion'' -> ''tiểu đoàn pháp sư trên không''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm của Tanya dùng ''chúng
    tôi'' cho đơn vị; ''armored troops'' -> ''lính thiết giáp''; ''anti-tank combat''
    -> ''tác chiến chống tăng''; giữ điển tích so sánh pháo binh và xe tăng."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Tanya hỏi Đại úy Ahrens dùng ''Anh'' và ''chúng
    ta'' (toàn cụm chiến đấu)."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, xưng hô & tình thái: ''The guns and infantry'' -> ''Pháo
    binh và bộ binh''; Ahrens xưng ''chúng tôi''/''tôi'' và thêm ''ạ'' với cấp trên;
    giữ dấu chấm lửng và sự dè dặt khi báo chưa nắm rõ chi tiết."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái: Tanya xưng ''tôi'' trong thoại và giữ sắc thái
    nhẹ lòng khi biết quân tiếp viện đang trên đường tới."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & xưng hô: ''Lieutenant Colonel Uger'' ->
    ''Trung tá Uger''; ''General Staff'' -> ''Bộ Tổng tham mưu''; phân biệt ''Chúng
    tôi'' (đơn vị của Ahrens gặp Uger trên đường) và ''chúng ta'' (toàn đơn vị từng
    gặp Uger trong đợt điều chuyển); Ahrens gọi Uger là ''ngài ấy'' và gọi Tanya là
    ''Trung tá''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm & điểm nhìn: bọc chính xác ''*Ồ?*''
    theo DEC-P01-002; ''Colonel Uger'' -> ''Trung tá Uger''; ''Captain Ahrens'' ->
    ''Đại úy Ahrens''; giữ câu hỏi nội tâm của Tanya."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu hỏi ngắn gọn của Tanya (''Nội dung là gì?'')."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại: giữ nguyên ''Kampfgruppe''; giữ chữ ''ạ''
    cuối câu báo cáo của Ahrens."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Tanya gọi đồng cấp Uger là ''anh ấy''; giữ
    hàm ý rào đón ''Miễn là anh ấy không chỉ nói suông cho có''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & tình thái: trần thuật ngôi thứ ba quy chiếu
    Tanya bằng ''nó'' theo DEC-P01-001; giữ nét áy náy, sự công nhận Uger là chuyên
    gia chính trực, cùng thế đối lập giữa ''không muốn kỳ vọng quá nhiều'' và ''cứ
    nuôi chút hy vọng thì cũng chẳng sao''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: câu hỏi của Ahrens với Tanya có ''ạ'' ở cuối
    câu."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya gọi ''anh'' và ''Đại úy Ahrens''; giữ
    cách đáp thực tế về tình trạng hiện tại."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Ahrens hỏi lại bằng ''Ý Trung tá là…?''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & chỉ dẫn: Tanya tự xưng ''Tôi'', gọi ''Thiếu
    tá Weiss'' (''anh ấy'') và giao cho Ahrens (''anh'') nắm chi tiết từ Weiss."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & phủ định: trần thuật quy chiếu Tanya bằng
    ''nó'' theo DEC-P01-001; giữ tương phản nhượng bộ giữa tính cách/sở thích ''có
    thể hiếu chiến'' và việc ''không có gì phải phàn nàn về năng lực của họ cả''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: dịch ''Colonel'' là ''Trung tá'' kèm ''ạ''
    khi cấp dưới hỏi Tanya."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & phủ định: ''Lieutenant Serebryakov'' ->
    ''Trung úy Serebryakov''; ''trench warfare'' -> ''tác chiến chiến hào''; ''chain
    of command'' -> ''hệ thống chỉ huy''; giữ phủ định giới hạn ''chẳng biết gì ngoài''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & điểm nhìn: chuyển điểm nhìn sang ''Đại úy
    Ahrens'' nhìn theo ''Trung tá von Degurechaff'' và ''viên sĩ quan phụ tá''; trong
    câu hỏi tu từ, dịch ''She'' là ''Trung tá'' đúng thái độ cấp dưới nói về chỉ huy."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: quy chiếu Ahrens bằng ''anh''; giữ
    phủ định ''không thể phủ nhận khả năng đó'' và hai dấu chấm lửng bỏ lửng câu;
    ''Imperial Army'' -> ''Lục quân Đế quốc''; ''decapitation tactics'' -> ''chiến
    thuật chặt đầu chỉ huy''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Quân hàm: ''The colonel'' -> ''Trung tá''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & tình thái: ''the colonel'' -> ''Trung tá'';
    ''Captain Ahrens'' -> ''Đại úy Ahrens''; dùng ''chúng ta'' và giữ tình thái phỏng
    đoán ''có lẽ... sẽ bị xếp vào hạng những gã ngốc mất cảnh giác quá mức''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Đại úy Ahrens hỏi cấp trên là Thiếu tá Weiss bằng ''Ý
    ngài là sao?''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quân hàm: ''His'' -> ''của anh'' (Ahrens); ''Major Weiss''
    -> ''Thiếu tá Weiss''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phân biệt đại từ: ''fighting retreat'' -> ''vừa đánh
    vừa rút lui''; ''strongpoint'' -> ''cứ điểm''; ''HQ'' -> ''sở chỉ huy''; phân
    biệt rõ ''chúng tôi'' (tiểu đoàn pháp sư), ''các anh'' (đơn vị thiết giáp của
    Ahrens) và ''ông ấy'' (sĩ quan chỉ huy cấp cao của đơn vị bạn)."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Đại từ & dấu câu: giữ dấu chấm lửng đầu câu; dịch ''they'' (quân
    địch) là ''chúng'' và ''us'' là ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Tình thái phủ định: giữ dấu chấm lửng và suy đoán phủ định về
    quá khứ ''Chắc hẳn đó chẳng phải là khoảng thời gian dễ chịu gì cho cam''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Phủ định & quân hàm: giữ phủ định ''Chúng ta không ở vào thế có
    thể kén cá chọn canh''; ''The colonel'' -> ''Trung tá''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Ahrens đáp lời Thiếu tá Weiss bằng ''Vâng'' và dùng ''chúng
    ta''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=[''Thoại: giữ câu tán đồng ngắn gọn của Weiss.'']'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ hành động cả hai vừa gật đầu vừa đồng loạt thở
    dài.'']'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế: giữ đúng cấu trúc giả định ''Giá mà chúng
    ta có lấy vài điếu thuốc lá thì đã khác''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Weiss gọi ''Đại úy Ahrens'' và xưng ''tôi''
    - ''anh''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Ahrens hỏi ''Sao lại thế ạ?'', trần thuật
    dùng ''anh'', và câu nhận ra gọi các sĩ quan pháp sư là ''các ngài'' kèm phủ định
    ''không được phép hút thuốc''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & phủ định: Weiss đáp ''Ừ'', gọi Tanya là
    ''Trung tá'', xưng ''chúng tôi'' cho các pháp sư trên không; ''orb'' -> ''quả
    cầu''; giữ các mệnh đề phủ định ''bị nghiêm cấm'', ''sẽ chẳng trụ nổi'' và ''Chẳng
    ai từng bay cao đến thế cả''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ, đại từ & phủ định: ''Major Weiss'' -> ''Thiếu
    tá Weiss''; ''aerial mage'' -> ''pháp sư trên không''; quy chiếu Weiss bằng ''anh'',
    ngôi thứ hai khái quát bằng ''bạn'', và giới pháp sư bằng ''họ''; giữ cấu trúc
    phủ định – điều kiện loại trừ ''Cũng chẳng phải... nhưng ngày nay, trừ phi...
    bằng không...''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc chính xác ''*đúng là*'' khớp
    thẻ em nguồn theo DEC-P01-002; ''armored units'' -> ''Các đơn vị thiết giáp'';
    ''main guns'' -> ''Pháo chính''; ''peashooters'' -> ''súng bắn đạn đậu''."]'
