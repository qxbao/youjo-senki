segment_id_end: YS-LN07/Text/chapter002.xhtml/p000062
choices:
- segment_id: YS-LN07/Text/chapter002.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điểm nhìn & phủ định: độc thoại nội tâm ngôi thứ nhất
    của Tanya dùng ''mình'' (số ít) và ''chúng tôi'' (số nhiều chỉ đơn vị) theo DEC-P01-001;
    giữ thuật ngữ ''hậu phương'', ''ngoài chiến trường'', ''tiền tuyến''; giữ phủ
    định mức độ ''vẫn chẳng nắm được lấy những nét cơ bản nhất''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & sắc thái: giữ dấu ngoặc kép quanh cụm ''“sai lầm chí
    mạng.”''; không dùng chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & tình thái: lời thoại trực tiếp của Tanya dùng
    ''tôi'' và ''chúng ta''; giữ câu hỏi tu từ và các phủ định ''chẳng chắc liệu chúng
    ta có thể tự quyết mà hành động hay không'', ''Không nhận được lấy một gợi ý nhỏ
    nào'', ''ngoài cười trừ ra thì tôi cũng chẳng làm được gì nhiều''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giả định nhượng bộ: ''Eastern Army Group'' -> ''Cụm
    tập đoàn quân phía Đông''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe Salamander'';
    ''encounter battles'' -> ''trận tao ngộ chiến''; ''aerial mage units'' -> ''các
    đơn vị pháp sư trên không''; giữ giả định nhượng bộ ''Cho dù... có thực sự sụp
    đổ đi chăng nữa'' và câu hỏi về ''phương án B''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, nhượng bộ & phủ định: giữ cấu trúc điều kiện kết hợp
    nhượng bộ ''Nếu quân ta vẫn còn trụ lại quanh đây… thì kể cả khi họ đã dốc toàn
    lực để không ai có thể nghi ngờ mình tự ý rút lui'' và mệnh đề phủ định ''rõ ràng
    cũng chẳng đem lại được kết quả gì nhiều''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & thuật ngữ: trần thuật ngôi thứ
    ba gọi ''Tanya''; bọc chính xác cụm ''“*toàn chịu thiệt mà chẳng được gì*”'' khớp
    thẻ em nguồn theo DEC-P01-002; ''anti-Communist'' -> ''có tư tưởng chống Cộng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại & đại từ: câu than vãn khẽ một mình trong ngoặc
    kép dùng đại từ tự quy chiếu ''mình'' tự nhiên theo ngữ cảnh tự thoại."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & điều kiện phủ định: chỉ bọc câu mệnh
    lệnh đầu đoạn ''*Các vị có thể tiếp tế sau khi tới được mục tiêu.*'' theo DEC-P01-002;
    nội tâm số nhiều dùng ''chúng tôi''; giữ cấu trúc điều kiện phủ định ''Trừ phi
    được một đơn vị có kết nối với tuyến tiếp vận của quân đội đón tiếp, bằng không
    tối nay chúng tôi sẽ chẳng có nổi một bữa ăn nóng sốt''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán & đại từ: giữ tình thái suy đoán ''có lẽ đã
    lén nhét vài thanh sô-cô-la vào ba lô'', đại từ ''chúng tôi'' và giới hạn ''cầm
    cự được bao lâu cũng chỉ có giới hạn''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại, giọng mỉa mai & thuật ngữ: câu lẩm bẩm mỉa mai
    một mình dùng đại từ ''Mình''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''37-mil
    tungsten shells'' -> ''đạn vonfram 37 ly''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: trần thuật ngôi thứ ba gọi ''Tanya'';
    giữ phủ định ''thậm chí còn chẳng có thời gian mà nguyền rủa trời xanh''; ''enemy
    strongpoint'' -> ''cứ điểm của địch''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Đại từ giả định khái quát & đối lập: dùng ''bạn'' cho chủ thể
    giả định chung; giữ sự đối lập giữa lúc rảnh rỗi dư dả thời gian và khoảnh khắc
    từng giây đều quý giá."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quan hệ nhân quả: trần thuật ngôi thứ ba gọi ''Tanya'';
    giữ quan hệ nguyên nhân – hệ quả giải thích lý do toàn đơn vị mang nhiều quân
    trang hơn thường lệ."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Quan hệ nhượng bộ & nhân quả: giữ mệnh đề nhượng bộ ''Dù đã giảm
    tải xuống mức tối thiểu'' và nguyên nhân ''Vì việc phải bay qua lãnh thổ địch
    nằm ngoài dự tính'' dẫn tới phương án vứt bớt đồ không cần thiết cho chiến đấu."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & mức độ: trần thuật ngôi thứ ba gọi ''Tanya''; giữ
    nhận định dứt khoát ''Chỉ có tay mơ mới tính đến chuyện vứt bỏ trang bị của mình
    dù chỉ trong một giây''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & ẩn dụ khẩu ngữ: ''eastern front'' -> ''Mặt
    trận phía đông''; ''the Empire'' -> ''Đế quốc''; nội tâm số nhiều dùng ''chúng
    tôi''; giữ hình ảnh khẩu ngữ ''chỉ còn cách một trận lở đất thảm hại đúng một
    cú sẩy chân''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện & thuật ngữ: dùng ''chúng tôi'' cho đơn vị;
    giữ phép đối chiếu phủ định ''hoàn toàn khác với việc quẳng đồ đạc trên thao trường
    ở quê nhà để di chuyển nhẹ nhàng hơn khi đánh giáp lá cà''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến, chức danh & phủ định kép: ''Battalion commander''
    -> ''Tiểu đoàn trưởng''; Tanya xưng ''Tôi'' và gọi đơn vị là ''các vị''; giữ câu
    hỏi kiểm tra có phủ định kép ''Tôi không nghĩ... không có tên ngốc nào trót vứt
    ba lô đi rồi đấy chứ?''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & ẩn dụ quản trị: chỉ bọc tiếng cười ''*Ha-ha-ha.*''
    ở đầu đoạn theo DEC-P01-002; giữ cách ví von chiến trường như ''môi trường làm
    việc'' có ''tỷ lệ tai nạn rất thấp''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Thoại cảnh báo: giữ câu hô ngắn gọn, khẩn cấp ''“Pháp sư địch
    đang bay lên!”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn pha trộn, đại từ & thuật ngữ: câu đầu bám điểm nhìn
    nội tâm của Tanya nên dùng ''sĩ quan phụ tá của mình''; câu thứ ba chuyển sang
    trần thuật ngôi thứ ba nên gọi ''Tanya'' và đại từ ''nó'' theo DEC-P01-001; giữ
    nhận định quản trị ở câu cuối."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn pha trộn & điều kiện: câu đầu dùng ''chúng tôi'' (tự
    thuật số nhiều của đơn vị), câu sau chuyển sang trần thuật ngôi thứ ba gọi ''Tanya'';
    giữ quan hệ điều kiện về xác suất xảy ra sự cố khi tác chiến trong trạng thái
    mỏi mệt."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & thuật ngữ: giữ dấu chấm lửng mở đầu câu lẩm bẩm
    và đại từ ''Quân ta''; trần thuật quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    ''The 203rd'' -> ''Tiểu đoàn 203''; ''intercepting'' -> ''đánh chặn''."]'
