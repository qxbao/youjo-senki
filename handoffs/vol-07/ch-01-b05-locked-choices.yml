choices:
- segment_id: YS-LN07/Text/chapter002.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: độc thoại nội tâm của Tanya tự quy chiếu bằng
    ''mình'' theo DEC-P01-001; ''formulas manifest'' -> ''thuật thức hiển hiện'';
    ''hunks of meat'' -> ''những tảng thịt''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn: trần thuật ngôi thứ ba gọi ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Thoại & tôn giáo: tiếng hô của Tanya dưới tác động của Type 95
    xưng ''Ta'', gọi địch là ''bọn chúng''; ''the Lord'' -> ''Chúa''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật gọi ''Tanya'' và quy chiếu bằng
    ''nó'' theo DEC-P01-001; ''holy relic'' -> ''thánh vật''; giữ nguyên ''Weiss''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh & xưng hô: Tanya phát lệnh cho đại đội xưng ''tôi''
    (''Toàn đại đội, theo tôi!''); ''score'' -> ''thành tích''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Đại từ: trần thuật quy chiếu Tanya bằng ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Đại từ & logic: trần thuật quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    giữ quan hệ thời gian và lựa chọn hành động dứt khoát không do dự."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tu từ: ''Weiss’s company'' -> ''đại đội của
    Weiss''; ''flank'' -> ''bên sườn''; giữ nguyên câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Thoại địch: giữ sắc thái cảm thán kinh hãi ''“Chết tiệt, là lời
    nguyền của mụ phù thủy già!”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định so sánh: ''hand-to-hand combat'' -> ''đánh
    giáp lá cà''; giữ cấu trúc phủ định tuyệt đối ''chẳng âm thanh nào có thể ngọt
    ngào hơn thế''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ câu nghi vấn ngắn ''“Hửm?”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ trực giác nhận biết sự bất thường ''có một cảm giác
    rõ mồn một rằng có gì đó sai sai''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại, đại từ & khẩu ngữ: Tanya tự hỏi xưng ''mình'';
    ''close-quarters combat'' -> ''cận chiến''; giữ sắc thái khẩu ngữ mạnh ''dở như
    hạch''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đối lập thời gian: ''Federation mages'' -> ''Đám pháp
    sư Liên bang''; giữ sự đối lập giữa trạng thái gắn kết vài giây trước và việc
    vứt bỏ kỷ luật, tính tổ chức hiện tại."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Điều kiện, phủ định & đại từ: giữ điều kiện loại trừ ''Trừ phi...
    thường không...''; đại từ ngôi thứ nhất số nhiều chỉ phe Đế quốc dùng ''chúng
    tôi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Thoại & điểm nhìn: giữ chuỗi câu hỏi suy luận của Tanya và câu
    trần thuật ngôi thứ ba gọi ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*xét một cách tương
    đối*'' khớp thẻ em nguồn theo DEC-P01-002; ''aerial mage battles'' -> ''các trận
    không chiến giữa pháp sư trên không''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & thuật ngữ: giữ cấu trúc phủ định kép ''không thể
    tăng quân số mà không dùng đến những biện pháp cực đoan''; ''the Federation''
    -> ''Liên bang''; ''hand-to-hand combat'' -> ''đánh giáp lá cà''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ ẩn dụ khẩu ngữ ''bữa tiệc buffet tha hồ chém
    giết''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ câu châm ngôn nội tâm ''*Hãy có
    dũng khí để bị ghét.*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi đuôi, phủ định & đại từ: giữ câu hỏi đuôi ''phải không?'';
    đại từ ngôi thứ nhất số nhiều khái quát dùng ''chúng ta''; ''compulsory moral
    education'' -> ''môn giáo dục đạo đức bắt buộc''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh: giữ giọng hô hào châm biếm ''“Các đức hạnh cần
    phải được coi trọng một cách nghiêm túc! Chém gục bọn chúng đi!”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & thuật ngữ: chỉ bọc ''“*phi lý*”''
    khớp thẻ em nguồn theo DEC-P01-002; trần thuật gọi ''Tanya''; phân biệt ''phi
    lý'' (''absurd'') và ''phi hợp lý'' (''irrational'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhượng bộ: ''Federation Army'' -> ''Quân đội Liên
    bang''; ''fight hand to hand with shovels'' -> ''đánh giáp lá cà bằng xẻng'';
    ''close-quarters engagements'' -> ''cuộc cận chiến''; trần thuật gọi ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Thoại địch: giữ câu hỏi cảm thán hoảng loạn ''“Sao chuyện này
    lại xảy ra được chứ?!”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''Federation mages'' -> ''đám pháp sư Liên
    bang''; ''nonverbal communication'' -> ''giao tiếp phi ngôn ngữ''; giữ tình thái
    lấp lửng cuối câu ''chắc vậy''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô & câu hỏi tu từ: trần thuật gọi ''Tanya'';
    thoại mỉa mai quân địch xưng ''Bọn ta'' – ''các ngươi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc giới hạn & thuật ngữ: giữ cấu trúc ''Chỉ có kẻ nghiệp
    dư mới tin rằng...''; ''close-quarters combat'' -> ''cận chiến''; ''kinetic energy''
    -> ''động năng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: phân biệt đại từ giả định khái quát ''Bạn''
    và đại từ nội tâm tự quy chiếu ''Mình'' theo DEC-P01-001; giữ phủ định ''Không,
    chẳng cần phải cầu nguyện'' và ''Mình không cho rằng...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc câu độc thoại ''*Thế này
    không ổn chút nào.*'' khớp thẻ em nguồn theo DEC-P01-002; trần thuật ngôi thứ
    ba gọi ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & phủ định: chỉ bọc ''*kenjutsu*''
    khớp thẻ em nguồn theo DEC-P01-002; giữ nguyên ''kendo''; ''magic blade'' -> ''lưỡi
    kiếm ma pháp''; giữ phủ định ''dường như không tài nào hiểu nổi điều đó''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ sự đối lập giữa ''tránh bị thương hoàn
    toàn'' và ''tập trung ngăn ngừa riêng những vết thương chí mạng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điều kiện: chỉ bọc mệnh đề điều kiện ''“*miễn
    sao bạn vẫn còn cử động được khi đối mặt với kẻ thù*”'' khớp thẻ em nguồn theo
    DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Thoại & giả định ước muốn: giữ thành ngữ ''như bầy cừu non bước
    vào lò mổ'' và cấu trúc giả định trái thực tế ''Giá mà chiến trường nào cũng biết
    điều như thế này''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: nội tâm tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; ''aerial victories'' -> ''chiến công bắn hạ trên không''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Thoại chế giễu & thuật ngữ: xưng hô với quân địch ''Các ngươi'';
    ''atheists'' -> ''lũ vô thần''; ''party'' -> ''Đảng''; ''ideology'' -> ''hệ tư
    tưởng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & tình thái: nội tâm tự quy chiếu dùng ''mình''
    theo DEC-P01-001; giữ nguyên ''Type 95''; giữ tình thái tự nhận thức ''có lẽ mình
    đang đánh giá hơi thấp nó một chút''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: nội tâm tự quy chiếu dùng ''mình''
    theo DEC-P01-001; xử lý chuẩn cấu trúc phủ định ''hầu như chẳng thể tìm ra lý
    lẽ hợp lý nào để phản đối việc tận hưởng nó cả''; ''totalitarians'' -> ''những
    kẻ theo chủ nghĩa toàn trị''; ''capitalist and liberal'' -> ''con người tư bản
    và tự do chủ nghĩa''."]'
