- segment_id: YS-LN07/Text/chapter008.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, điểm nhìn & nhấn mạnh Markdown: chỉ bọc ''*Ha-ha-ha—nhìn
