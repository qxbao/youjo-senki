    nhấn mạnh ''Đời nào mình chịu quay về tay trắng''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nội tâm của Tanya dùng ''chúng ta''; giữ ý
    chiến thuật tận dụng tốc độ cao để vờn địch."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ nhận định chuyển ý ngắn gọn rằng mọi chuyện diễn
    ra suôn sẻ hơn dự kiến.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: lời hô xung phong gọi thuộc cấp là ''các anh'',
    giữ nhịp dồn dập."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & thuật ngữ: ''Weiss'' -> ''Weiss''; ''explosion
    formulas'' -> ''thuật thức phát nổ''; ''smoke screen'' -> ''màn khói''; giữ mệnh
    lệnh phủ định ''Đừng ngừng bắn'' và đại từ ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ, phủ định & thuật ngữ: quy chiếu Tanya bằng
    ''Nó'' theo DEC-P01-001 và tên ''Tanya''; ''rear guard'' -> ''lực lượng đoạn hậu'';
    ''explosion formulas'' -> ''các thuật thức phát nổ''; giữ mệnh đề nhượng bộ phủ
    định ''Dù không hiệu quả bằng''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: ''explosion formulas'' -> ''thuật thức
    phát nổ''; ''203rd Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên không số
    203''; giữ cấu trúc giới hạn ''Chỉ những đơn vị... mới có thể hy vọng''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: dùng ''chúng ta''; giữ đủ ba vế
    phủ định (''Không ai trong chúng ta...'', ''không lao nhầm vào đường bắn'', ''chẳng
    hề lơ là chuyện yểm trợ'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm tự quy chiếu của Tanya
    dùng ''mình'' theo DEC-P01-001 và ''chúng ta'' cho đơn vị; ''veterans'' -> ''những
    người lính kỳ cựu''; ''melee'' -> ''cuộc hỗn chiến''; ''sharpshooters'' -> ''những
    tay súng thiện xạ''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: ''focused opticals'' -> ''các
    đòn quang học dạng hội tụ''; ''defensive shells'' -> ''lớp vỏ phòng thủ''; giữ
    vế rào đón phủ định ''Dù không thể bắn hạ chúng chỉ bằng một đòn'' và khẳng định
    chắc chắn ''không còn nghi ngờ gì nữa''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, điều kiện & thuật ngữ: ''magic blades'' -> ''lưỡi kiếm
    ma pháp''; dùng ''chúng ta'' và giữ cấu trúc điều kiện cùng hai phương án tác
    chiến tầm gần – tầm xa."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=[''Thoại: giữ thông báo ngắn gọn xác nhận khu vực đã sạch bóng địch.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Thoại & quân hàm: ''Major'' -> ''Thiếu tá'' (Tanya khen ngợi Thiếu
    tá Weiss)."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nhấn mạnh Markdown: chỉ bọc cụm ''*Dù sao
    đi nữa*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; nội tâm tự quy chiếu
    của Tanya dùng ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & thuật ngữ: ''Federation mage battalion''
    -> ''Tiểu đoàn pháp sư Liên bang''; ''203rd Aerial Mage Battalion'' -> ''Tiểu
    đoàn Pháp sư Trên không số 203''; dùng ''chúng ta'' cho đại quân phe Đế quốc."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ câu trần thuật ngắn gọn về sự sụp đổ của sức
    kháng cự có tổ chức bên phía địch.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Tanya khen ngợi binh sĩ bằng ''các anh em''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: quy chiếu trực tiếp tên ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & phủ định: quy chiếu Tanya bằng ''nó'' / ''Nó''
    theo DEC-P01-001; giữ phủ định ''không bên nào chịu tổn thất nặng nề'' và sự nhẹ
    nhõm trước phán đoán sai."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tình thái & thuật ngữ: giữ sắc thái suy đoán (''xem
    ra'', ''có lẽ''); ''ratio of losses'' -> ''tỷ lệ tổn thất''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn: giữ giọng điệu thực dụng của Tanya khi chuyển sang
    săn lùng các chiến tích thưởng thêm.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, phủ định kép & thuật ngữ: ''Federation soldiers''
