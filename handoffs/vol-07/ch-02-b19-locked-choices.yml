    dùng ''chúng ta'' cho quân mình và ''bạn'' cho chủ thể khái quát; giữ phủ định
    kép ''không thể nào không ý thức được''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn: giữ nhận định khái quát ngắn gọn về bản chất tâm lý
    con người.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Thoại, điểm nhìn & thuật ngữ: giữ nguyên mã hiệu ''Salamander
