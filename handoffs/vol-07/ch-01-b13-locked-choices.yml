choices:
- segment_id: YS-LN07/Text/chapter002.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & thuật ngữ: giữ dấu chấm lửng mở đầu, đại từ tự
    xưng ''Tôi'' của Tanya, phủ định ''không nghe thấy đủ'' và thuật ngữ ''súng máy
    hạng nhẹ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Tình thái, câu hỏi nội tâm & thuật ngữ: giữ suy đoán ''hẳn là
    từng trận địa đã bắt đầu tổ chức phản kích theo kế hoạch phòng ngự'', câu hỏi
    ''Chẳng lẽ họ đã đánh mất toàn bộ trang bị hạng nặng trong lúc rút lui rồi sao?''
    và nhận định ''Hỏa lực bắn trả của quân ta nghe yếu ớt đến thảm hại.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán & phủ định: giữ câu phủ định ''Thậm chí chẳng tìm
    nổi một điểm sáng le lói nào.'' và câu hỏi cảm thán của Tanya."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & thuật ngữ: giữ hình ảnh so sánh dàn nhạc giao hưởng của
    hỏa lực Đế quốc với chiếc máy hát đĩa bị hỏng; giữ đối lập giữa sự kháng cự ngoan
    cường của từng đơn vị riêng lẻ và sự thiếu vắng phối hợp cũng như ''hỏa lực yểm
    trợ cấp trung đoàn hoặc sư đoàn''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giọng mỉa mai: dùng ''chúng tôi'' cho phe
    mình; ''local chain of command'' -> ''hệ thống chỉ huy tại chỗ''; ''artillery
    division'' -> ''sư đoàn pháo binh''; giữ giọng mỉa mai cay độc ở câu cuối."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn: giữ ''Nói ngắn gọn, đây là kịch bản tồi tệ nhất.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & trần thuật: dùng ''chúng tôi'' trong nội tâm
    và ''Chúng ta'' trong câu thoại; giữ phủ định ''không còn phương tiện để dựng
    lên một thế trận phòng ngự có tổ chức''; chỉnh ''rủa thầm trời xanh'' thành ''nguyền
    rủa trời xanh'' (hoặc ''buông lời nguyền rủa trời xanh'') theo finding minor."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, quân hàm & thuật ngữ: quy chiếu Tanya bằng
    ''nó'' theo DEC-P01-001; ''Fifty-Fourth Regiment'' -> ''Trung đoàn 54''; ''Colonel
    Dirichlet'' -> ''Đại tá Dirichlet''; ''chain of command'' -> ''hệ thống chỉ huy'';
    giữ phủ định ''hầu như chẳng biết gì'' và ''vẫn chưa được thiết lập''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, thời gian giả định & phủ định: tự quy chiếu của
    Tanya dùng ''Mình''/''mình'' theo DEC-P01-001, số nhiều dùng ''chúng tôi''; giữ
    giả định quá khứ ''cứ đinh ninh rằng chúng tôi sẽ có thời gian...'' và phủ định
    kép ''chẳng thể chối cãi rằng sai lầm ngớ ngẩn này đáng bị lôi ra xử bắn''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: giữ câu phủ định ngắn ''Không.'',
    cấu trúc đối lập ''nắm quyền chỉ huy, chứ không phải tự kiểm điểm'' và đại từ
    trần thuật ''nó'' quy chiếu Tanya theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & mệnh lệnh: ''Fifty-Fourth Regiment'' -> ''Trung đoàn
    54''; Tanya gọi các sĩ quan là ''các anh''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: quy chiếu Tanya bằng ''Nó'' theo
    DEC-P01-001; giữ câu mệnh lệnh phủ định mang tính quy tắc ''Đừng bao giờ coi thường...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & đại từ thoại: ''Colonel Dirichlet'' -> ''Đại tá Dirichlet'';
    Tanya xưng ''Tôi'' khi tuyên bố tạm thời nắm quyền chỉ huy."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & hình ảnh ẩn dụ: tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; ''Fifty-Fourth Regiment'' -> ''Trung đoàn 54''; giữ dấu chấm
    lửng và hình ảnh ''những bánh răng chỉ biết làm theo mệnh lệnh''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & đại từ: giữ quan hệ nhân quả - điều kiện ''nên
    nếu chúng ta tra cho họ chất bôi trơn thích hợp thì vẫn còn hy vọng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & thoại lắp bắp: giữ ''Tr-Trung tá?!'' khi sĩ quan cấp
    dưới gọi Tanya."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: ''second-in-command'' -> ''phó chỉ huy'';
    Tanya xưng ''tôi'' và gọi ''các anh''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ cách diễn đạt thành ngữ ''thúc đít
    đội ngũ sĩ quan của Trung đoàn 54'' và chủ thể ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mệnh lệnh: ''intercept'' -> ''đánh chặn''; giữ dấu
    gạch ngang và đại từ ''các anh''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu nhận định ''Đây là những mệnh lệnh được sinh ra
    từ những lời thề nguyện đã định sẵn.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh: giữ nhịp câu ngắn dồn dập ''Di chuyển! Di chuyển! Chuẩn
    bị sẵn sàng! Các sĩ quan, làm tròn bổn phận của mình đi!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & phủ định: giữ mệnh đề phủ định ''không biết phải bắt
    đầu từ đâu'' và điều kiện ''Chừng nào họ còn hiểu được mục đích của việc đánh
    chặn quân địch...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh ngắn: giữ ''Sẵn sàng chiến đấu!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh ngắn: giữ ''Nhanh lên! Về vị trí! Tăng tốc lên!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ suy đoán ''hẳn phải là thành quả của quá trình
    huấn luyện hằng ngày''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Đối lập & phủ định: giữ tương phản giữa tốc độ ban đầu còn uể
    oải và việc chuyển sang thế trận phòng ngự ''không đến mức chậm chạp một cách
    chí mạng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ nhận định khái quát ''Ngay cả tại một điểm tựa tạm
    thời trong lúc rút quân, một đội quân sẽ luôn cần ít nhất sự chuẩn bị ở mức tối
    thiểu.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: ''Major Weiss'' -> ''Thiếu tá Weiss''; Tanya
    dùng ''chính chúng ta'' cho đơn vị và xưng ''tôi'' khi nói với Weiss."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Tình thái & trần thuật: giữ ''hẳn sẽ ổn thỏa'' và chủ thể ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; giữ phủ định ''chẳng có cơ may nào đạt được phản ứng gần như tức
    thời'' và thành ngữ ''liệu cơm gắp mắm''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát: dùng ''bạn'' cho câu châm ngôn khái quát."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, xưng hô & thuật ngữ: câu hỏi đầu dùng ''Chúng
    ta'' và ''phó chỉ huy''; trần thuật quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    thoại sau Tanya xưng ''Tôi'', gọi viên sĩ quan trẻ là ''anh'' và quy chiếu phó
    chỉ huy Trung đoàn 54 là ''ông ta''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cấp dưới: giữ dấu chấm lửng và tiểu từ lễ phép ''ạ''
    trong câu hỏi ngược lại ''…Ai đang nắm quyền chỉ huy cơ ạ?!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & xưng hô: chỉ bọc chữ nghiêng đại từ ''*anh*''
    theo đúng DEC-P01-002; giữ câu hỏi phủ định ''Anh không biết sao?!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & giọng ngập ngừng: ''Ma’am'' -> ''Thưa Trung
    tá''; ''HQ section'' -> ''ban chỉ huy''; viên sĩ quan xưng ''tôi'' kèm ''ạ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Vẫn còn chết lặng, Tanya nhận ra sai lầm của
    mình.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000531
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhấn mạnh Markdown, đại từ trần thuật & phủ định: ''203rd
    Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên không số 203''; chỉ bọc chữ
    nghiêng ''*Nếu đã vậy…*'' theo DEC-P01-002; quy chiếu Tanya bằng ''Nó'' theo DEC-P01-001;
    giữ phủ định ''chẳng có việc gì để làm'' và ''đã không cử Weiss và những người
    khác đi tìm kiếm sớm hơn''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000532
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & trích dẫn trong thoại: ''provisional headquarters''
    -> ''sở chỉ huy lâm thời''; ''203rd Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp
    sư Trên không số 203''; giữ chỗ tự ngắt lời bằng dấu gạch ngang và nội dung thông
    điệp trong cặp nháy đơn."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000533
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ trần thuật & thuật ngữ khí tượng: chỉ
    bọc chữ nghiêng câu hỏi nội tâm đầu đoạn ''*Rốt cuộc chuyện quái gì đang xảy ra
    thế này…?*'' theo DEC-P01-002; quy chiếu Tanya bằng ''nó'' ở câu thứ ba theo DEC-P01-001;
    phân biệt ''trần mây quang đãng'' và ''tầng mây che phủ đầy chướng mắt''."]'
