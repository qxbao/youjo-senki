choices:
- segment_id: YS-LN07/Text/chapter012.xhtml/p000270
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nhấn mạnh Markdown: câu đầu là độc thoại nội
    tâm tự quy chiếu bằng ''mình'' theo DEC-P01-001; câu thứ hai bọc chính xác ''*Đây
    là một sự cố nghiêm trọng đặt tính mạng con người vào vòng nguy hiểm—họ đang nghĩ
    cái quái gì vậy?*'' khớp thẻ em nguồn theo DEC-P01-002; câu thứ ba chuyển sang
    trần thuật ngôi thứ ba gọi tên ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000271
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại: giữ ''các pháp sư quan sát'' cùng hai
    câu hỏi tu từ cảm thán liên tiếp của Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000272
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & nghĩa: dùng đại từ tự quy chiếu ''Mình'' theo
    DEC-P01-001; chỉnh động từ thành ''hiểu được'' theo finding (''Mình có thể hiểu
    được chuyện bị quân địch bắn.'')."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm: dùng ''Chúng ta'' bao gộp đơn vị và giữ câu nhận
    định ngắn ''Thế mới công bằng.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000274
  kind: terminology_and_voice
  value: 'choices=["Phủ định & đối lập: giữ đối lập trực tiếp ''Bị chính pháo binh
    quân mình bắn thì chẳng công bằng chút nào.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & phủ định: dùng ''Mình'' theo DEC-P01-001;
    giữ thuật ngữ ''màn hỏa lực di động'' và cấu trúc phủ định bộ phận ''Đâu phải
    cứ lên lịch pháo kích là có thể tính toán quỹ đạo đạn chính xác 100 phần trăm
    được.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh: giữ câu lệnh ngắn ''Cho tôi báo cáo thương vong!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới, phủ định & thuật ngữ: giữ kính ngữ ''ạ'', hai
    mệnh đề phủ định về tổn thất/thương vong và thuật ngữ ''trận địa phòng ngự''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: giữ ''Thiếu tá Weiss'', tên ''Tanya'' và cách
    Tanya gọi Weiss là ''Anh'' trong câu hỏi xác nhận."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Weiss đáp ''Vâng, thưa Trung tá.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000280
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & chức danh: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001, quy chiếu Weiss bằng ''Vị phó chỉ huy của nó'' và ''anh''; giữ phủ
    định ''sẽ không bao giờ đưa ra một báo cáo chưa được xác nhận''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000281
  kind: terminology_and_voice
  value: 'choices=["Thoại ngập ngừng: giữ dấu ba chấm ngắt nhịp ''…Tôi… thực sự rất
    mừng khi nghe điều đó.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000282
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & quan hệ tương phản: quy chiếu Tanya bằng ''nó'',
    đơn vị bằng ''họ''; giữ tương phản giữa sự điên tiết vì bị nã pháo và thực tế
    không chịu tổn thất làm dịu cái đầu đang bốc hỏa."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000283
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi xác nhận: giữ ''Chỉ để xác nhận lại thôi, xe tăng và pháo
    không bị hư hại gì chứ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000284
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & điều kiện: Weiss đáp ''Không đâu, thưa Trung
    tá. Nếu cần, chúng tôi đã sẵn sàng khai hỏa vào phía pháo binh rồi ạ.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000285
  kind: terminology_and_voice
  value: 'choices=["Thoại & tình thái phủ định: Tanya xưng ''tôi'', giữ tình thái
    ''xem ra không cần phải làm thế nữa''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000286
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ trần thuật: giữ ''Sở chỉ huy'', đại từ ''nó''
    cho Tanya và thành ngữ ''cái may trong cái rủi này''; chỉnh động từ câu đầu thành
    ''đang dần thả lỏng'' (hoặc ''đang dịu lại'') theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000287
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ trần thuật: chỉ bọc ''*Thiệt tình*''
    khớp thẻ em nguồn theo DEC-P01-002; trần thuật gọi ''Tanya'' và quy chiếu bằng
    ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000288
  kind: terminology_and_voice
  value: 'choices=["Tôn ti quân hàm: Đại tá Calandro gọi xã giao Tanya là ''Trung
    tá'' (''Xin thứ lỗi, Trung tá.'')."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000289
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: Tanya gọi ''Đại tá Calandro'' và
    ''ngài'', tự xưng ''Tôi'' kèm ''ạ''; giữ ''sự cố ngoại giao quốc tế'' và ''đạn
    quân mình bắn nhầm''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000290
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên ''Calandro'' và nét miêu tả trạng thái khỏe
    khoắn lành lặn khi bước vào."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000291
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại: Calandro xưng ''tôi'', gọi phía Tanya là ''bên
    cô'' (''Các đơn vị pháo binh bên cô'')."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000292
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Tanya dùng ''chúng ta'' bao gộp, tự xưng
    ''Tôi'' / ''mình'', quy chiếu pháo binh là ''họ'' và giữ tình thái phỏng đoán
    ''có lẽ chính vì họ cẩu thả nên ngay từ đầu chúng ta mới bị nã pháo''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=["Dấu thoại kép: giữ nguyên cặp dấu ngoặc kép đôi ''““Ha-ha-ha.””''
    biểu thị tiếng cười đồng thanh của hai người."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=[''Nhận định khái quát: giữ hai câu nhận định ngắn gọn về quy luật
    tự nhiên.'']'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & quy chiếu đơn vị: Calandro xưng ''tôi'',
    gọi Tanya là ''cô''; giữ thuật ngữ ''bắn tiêu diệt'', ''hỏa lực pháo binh''; đổi
    ''các cô'' (chỉ tập thể đơn vị) thành ''bên cô'' hoặc ''đơn vị cô'' theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya xưng ''tôi - Ngài ... ạ''; giữ ''trận
    đấu pháo'' và ''mặt trận Rhine''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Tình thái & phủ định: Calandro xưng ''tôi'', giữ tình thái ''Có
    lẽ tôi không tài nào thấu hiểu nổi, vì bản thân tôi chưa từng trải qua nỗi kinh
    hoàng đó.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Chức danh & đại từ: trong thoại Tanya xưng ''tôi ... ạ'', nhắc
    tới ''sĩ quan phụ tá, phó chỉ huy của tôi''; trong trần thuật quy chiếu Tanya
    bằng ''Nó'' theo DEC-P01-001 và nhóm ba người bằng ''họ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại: Calandro xưng ''tôi - cô'', giữ câu hỏi lịch sự
    đề nghị giải thích sự việc."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=["Đại từ, xưng hô & thuật ngữ: trần thuật gọi ''Calandro'', ''Tanya''
    và quy chiếu Calandro bằng ''ông''; trong thoại Tanya dùng ''ngài - chúng tôi
    ... ạ''; giữ ''pháp sư quan sát'' và ''quân Liên bang''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*sương mù chiến tranh*''
    bên trong cặp dấu nháy đơn khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000302
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trong thoại dùng ''chúng tôi ... ạ''; trong
    trần thuật gọi ''Tanya'', ''Calandro'' và quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    giữ thành ngữ ''cái may trong cái rủi này'' nhất quán với p000286."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: Calandro gọi Tanya là ''Trung tá''
    và ''cô'', xưng ''tôi''; giữ thuật ngữ ''bắn tiêu diệt''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000304
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya xưng ''Tôi ... ạ'', quy chiếu phía
    pháo binh bằng ''họ''; giữ ''mật mã liên lạc'' và ''ngừng bắn''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Calandro xưng ''tôi - cô''; giữ ''hiệp đồng
    tác chiến'' và đối lập giữa lý thuyết với chi tiết thực tế."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000306
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya dùng ''Chúng tôi - ngài ... ạ''; giữ
    ''cơ chế an toàn''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000307
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Calandro xưng ''tôi - cô''; giữ chức trách
    ''quan sát viên quân sự''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000308
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nhấn mạnh Markdown: trần thuật quy chiếu Tanya
    bằng ''nó'' và tên ''Tanya'' theo DEC-P01-001; bọc chính xác câu độc thoại nội
    tâm cuối đoạn ''*Không đời nào có chuyện đó đâu*.'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: quy chiếu Calandro bằng ''ông'',
    Tanya bằng ''nó'', phía pháo binh bằng ''họ''; giữ cấu trúc nhượng bộ ''Cho dù
    ông có cố gặng hỏi đến đâu đi nữa, nó cũng không thể nói cho ông biết...''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000310
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, giả định & thuật ngữ: độc thoại nội tâm dùng
    đại từ tự quy chiếu ''mình'' theo DEC-P01-001; giữ ''hồ sơ chính thức'', ''CV''
    và câu điều kiện giả định về nguy cơ để lại vết nhơ trong hồ sơ."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000311
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát: dùng ''bạn'' cho chủ thể khái quát trong suy
    nghĩ về việc tự bảo toàn bản thân lâu dài và giữ gìn thể diện bề ngoài."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000312
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc điệp: giữ nhịp điệp ba danh ngữ ''Sơ yếu lý lịch hoàn
    hảo, sự nghiệp hoàn hảo, tương lai hoàn hảo.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: giữ ''tín hiệu nhận dạng địch–ta'', ''ân
    sủng của Thượng đế'' và xưng hô ''tôi ... ạ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000314
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & cấu trúc lựa chọn: điểm nhìn ngôi thứ nhất
    của Tanya dùng ''mình'' cho bản thân và ''ông'' cho Calandro; giữ cặp liên từ
    lựa chọn ''hoặc là vì... hoặc là vì...''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000315
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & đại từ: giữ đại từ ''mình'' (Tanya) và ''ông''
    (Calandro)."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000316
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: trong lời than phiền thành tiếng, Tanya xưng
    ''Tôi'' / ''mình''; giữ ''huấn luyện viên'', ''tiền tuyến'', ''quan sát viên''
    và ''Lục quân Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000317
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điều kiện: dùng ''chúng ta'' trong câu điều kiện khép
    lại đoạn."]'
