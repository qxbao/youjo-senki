- segment_id: YS-LN07/Text/chapter022.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian – địa điểm: giữ định dạng in hoa toàn bộ ''NGÀY
    13 THÁNG 5 NĂM THỐNG NHẤT 1927, THỦ ĐÔ ĐẾ QUỐC BERUN, VĂN PHÒNG BỘ TỔNG THAM MƯU
    LỤC QUÂN ĐẾ QUỐC''; không dùng chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ dòng trong dấu sao
    ''*Từ: Lục quân Đế quốc, Sở chỉ huy Cụm tập đoàn quân phía Đông*'' khớp thẻ em
    nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ dòng trong dấu sao
    ''*Kính gửi: Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc*'' khớp thẻ em nguồn
    theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu báo cáo trong
    dấu sao khớp thẻ em nguồn; ''Federation Army'' -> ''Quân đội Liên bang''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: bọc toàn bộ câu trong
    dấu sao khớp thẻ em nguồn; ''We'' -> ''chúng tôi''; ''provisional estimations
    of achievements on the eastern front'' -> ''thống kê sơ bộ chiến quả trên mặt
    trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu trong dấu sao
    khớp thẻ em nguồn; giữ ''Nhiều sư đoàn, bao gồm cả quân chủ lực của địch, đã bị
    tiêu diệt hoàn toàn.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: bọc toàn bộ câu trong
    dấu sao khớp thẻ em nguồn; ''We'' -> ''Chúng tôi''; ''pursue the enemy and capitalize
    on our gains'' -> ''truy kích quân địch và phát huy chiến quả''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nghĩa: bọc toàn bộ dòng tái bút trong dấu
    sao khớp thẻ em nguồn; giữ ''Tái bút: Đề nghị thu xếp phương tiện vận chuyển tù
    binh càng sớm càng tốt.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: giữ câu hỏi xác nhận của Rudersdorf ''“Chúng ta
    thắng rồi nhỉ?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Thoại & dấu câu: giữ dấu chấm lửng mở đầu và câu đáp của Zettour
    ''“…Đúng là thắng thật rồi.”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & giả định khái quát: ''Imperial Army'' -> ''Lục
    quân Đế quốc''; ''both the boulder and the willow'' -> ''cả tảng đá lẫn cành liễu'';
    ''major maneuver battle on the eastern front'' -> ''trận đánh cơ động quy mô lớn
    trên mặt trận phía đông''; dịch đại từ khái quát ''you'' thành ''có ai'' / ''người
    đó''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & dấu câu: ''they'' -> ''họ''; ''frontline units''
    -> ''các đơn vị tiền tuyến''; ''Eastern Army Group Headquarters'' -> ''Sở chỉ
    huy Cụm tập đoàn quân phía Đông''; giữ dấu gạch ngang dài trước mệnh đề kết luận."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ câu chuyển ý ngắn ''Dẫu vậy, kết quả đã hiện rõ
    rành rành trên bản đồ.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & địa danh: giữ dấu chấm lửng mở đầu, đại từ
    ''chúng ta'', mức độ suy đoán ''Có lẽ … thậm chí còn có thể'', địa danh ''Moskva''
    và ''các thành phố phía nam''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & danh xưng: chỉ bọc từ ''*lý thuyết*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ cách gọi thẳng tên bạn đồng cấp
    ''Rudersdorf''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi: giữ câu hỏi ngắn của Rudersdorf ''“Vậy là sẽ gay
    go đấy hả?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm & đại từ: chỉ bọc câu đầu ''*Nói
    thế còn là nhẹ chán.*'' trong dấu sao khớp thẻ em nguồn; giữ ''Trung tướng von
    Zettour'', cụm ''người bạn đáng kính của mình'', phủ định tuyệt đối ''là bất khả
    thi'' và đại từ ''chúng ta'' trong thoại."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''maneuver battle'' -> ''trận đánh cơ động''; ''limits
    of logistics'' -> ''những giới hạn về hậu cần''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Giả định, thuật ngữ, đại từ & phủ định: giữ câu điều kiện giả
    định và khả thể quá khứ ''đã có thể nhận được sự hậu thuẫn''; ''interior lines
    strategy'' -> ''chiến lược nội tuyến''; ''self-governing provincial bodies'' ->
    ''các cơ quan tự quản cấp tỉnh''; giữ phủ định cuối câu ''—đó không chỉ là lý
    thuyết suông trên bàn giấy.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ tương phản: ''Council for Self-Government''
    -> ''Hội đồng Tự trị''; giữ sự đối lập giữa sân nhà và đất khách quê người cùng
    nhận định ''đã là một cơn ác mộng về hậu cần''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''supply base'' -> ''căn cứ tiếp vận''; ''the
    Empire’s national strength'' -> ''quốc lực của Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & thuật ngữ: giữ ''Chúng ta'', ''các kho tiếp vận
    của địch tại sở chỉ huy của chúng'', ''Hội đồng Tự trị'' và dấu gạch ngang dài
    trước ''—đúng là một phép màu.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc ''*Binh pháp Tôn Tử*''
    trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ dấu gạch ngang dài và đại
    từ khái quát ''người ta''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi giả định: giữ ''“Thế nhỡ nguồn đó đứt đoạn thì sao?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: giữ câu đáp ''“Thì lúc đó chúng ta sẽ thực sự
    phải thu mua toàn bộ mọi thứ trên lãnh thổ địch.”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & cấu trúc phân biệt: giữ phủ định ''thậm
    chí còn chẳng muốn tưởng tượng tới viễn cảnh đó''; ''matériel'' -> ''vật tư và
    trang bị quân sự''; giữ sự phân biệt giữa thu giữ vật tư tiếp vận của địch ngoài
    chiến trường với việc cưỡng ép người dân giao nộp."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi: giữ câu hỏi ngắn ''“Cụ thể là sao?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu Zettour bằng ''ông'' (''Đã được
    hỏi thì ông đành phải trả lời.'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: giữ câu trả lời ngắn gọn ''“Cướp bóc có tổ
    chức.”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & xưng hô: giữ phủ định ''Thời nay đâu còn là
    thời đại của lính đánh thuê nữa.''; Rudersdorf gọi Zettour là ''Ông'' và tên ''Zettour''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & thuật ngữ: Zettour xưng ''Tôi''/''tôi'', trần
    thuật quy chiếu bằng ''Ông''; ''requisitions in line with military law'' -> ''việc
    trưng thu theo đúng quân luật''; ''military scrip'' -> ''quân phiếu''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phép so sánh: quy chiếu Rudersdorf bằng ''người
    bạn cũ của ông'' / ''ông ấy''; ''Military scrip'' -> ''Quân phiếu''; giữ hình
    ảnh so sánh ''mong manh chẳng khác nào ngọn nến trước gió'' và mệnh đề giới hạn
    ''những người duy nhất tin vào nó là những kẻ đang ở vào thế buộc phải giả vờ
    tin mà thôi''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi, dấu câu & thuật ngữ: giữ dấu chấm lửng giữa câu
    và cụm ''việc trưng thu bằng quân phiếu với cướp bóc''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & nhân quả: giữ dấu chấm lửng mở đầu, đại từ ''chúng
    ta'', phủ định ''những thứ vốn chẳng tồn tại'' và ''cũng đâu thể dễ dàng từ bỏ
    chiến dịch chỉ vì vấn đề tiếp vận được''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Zettour xưng ''Tôi'', gọi Rudersdorf là ''ông''
    (''“Tôi thì mong ông từ bỏ lắm đấy.”'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & danh xưng: Rudersdorf gọi ''Tướng von Zettour'',
    xưng hô ''ông'' - ''chúng ta'', giữ dấu chấm lửng và phủ định ''Nghe chẳng giống
    phong thái của ông chút nào''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: giữ tên ''Zettour'', ''Rudersdorf'' và đại
    từ ''ông'' quy chiếu Zettour."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi giả định, xưng hô & thuật ngữ: giữ giả định ''Giả
    sử như chúng ta thực hiện thêm một đợt tiến quân nữa trong hoàn cảnh hiện tại'',
    đại từ ''ông'' và thuật ngữ ''những biện pháp hậu cần''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Thoại, câu hỏi đuôi & thuật ngữ: giữ dấu chấm lửng mở đầu, câu
    hỏi ''Đàm phán ngừng bắn mới là ưu tiên cao hơn chứ, chẳng phải sao?'' và ''ngay
    cả Liên bang cũng sẽ khó lòng từ chối ngồi vào bàn đàm phán''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Thoại điều kiện & xưng hô: giữ điều kiện ''Đàm phán chỉ khả thi
    khi phía bên kia cũng đồng thuận tham gia.'' và câu hỏi ''Ông quên rồi ư?''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, phủ định & thoại: giữ phủ định gián tiếp ''Zettour
    toan đáp rằng mình đâu có quên'', đại từ trần thuật ''ông'', và thoại xưng hô
    ''Tôi'' - ''Ông'' cùng ''chúng ta''/''họ'' ở câu hỏi cuối."]'
