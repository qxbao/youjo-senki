- segment_id: YS-LN07/Text/chapter022.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu Zettour bằng ''ông'', nhóm quan
    chức bằng ''Đám người kia''; giữ tình thái suy đoán ''Hẳn là ông đã dùng cái giọng
    như thể đang nói chuyện với lũ ngốc.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Thoại, danh xưng & xưng hô: ''General von Rudersdorf'' -> ''Tướng
    von Rudersdorf''; công chức gọi Rudersdorf là ''Ngài'' và quy chiếu Zettour bằng
    ''ông ấy''; giữ dấu chấm lửng đầu câu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Thoại & danh xưng: Rudersdorf xưng ''tôi''; ''General von Zettour''
    -> ''Tướng von Zettour''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán & dấu câu: giữ dấu chấm lửng đầu câu và dấu gạch
    ngang dài trước dấu chấm than ''…Thật hết chỗ nói—!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu phía Đế quốc bằng ''họ''; ''in
    the east'' -> ''ở phương đông''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điểm nhìn & thoại: ''the barking civil servants'' ->
    ''đám công chức dân sự đang sủa ầm lên kia''; ''General Staff'' -> ''Bộ Tổng tham
    mưu''; suy nghĩ của Zettour dùng ''mình'' - ''bọn họ'', thoại dùng ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & giả định: chỉ bọc ''*Chắc chắn ngài đang
    đùa rồi.*'' và ''*Chà! Những ánh nhìn mới lạnh lùng và sắc lẹm làm sao.*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ câu điều kiện giả định trái thực
    tế ''Nếu ánh mắt mà tạo ra được áp lực vật lý thì hẳn ông đã bị xiên thủng từ
    lâu.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & độc thoại nội tâm: chỉ bọc ''*Mình đã lường
    trước sẽ có sự phản đối ở một mức độ nào đó, nhưng chuyện này vượt xa những gì
    mình tưởng tượng.*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; Zettour
    tự quy chiếu bằng ''Mình''/''mình'' trong nội tâm."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: công chức gọi Zettour là ''Ngài''; ''the
    Empire'' -> ''Đế quốc''; giữ dấu ''?!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & mức độ chắc chắn: quy chiếu Zettour bằng ''Ông''/''ông'';
    ''Oriental saying about teaching Buddhist sutras'' -> ''câu ngạn ngữ phương Đông
    về chuyện giảng kinh Phật'' (không tự chèn giải thích ngoài nguồn); giữ tình thái
    ''chắc hẳn chỉ có lác đác vài người''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Thoại, trần thuật & quân hàm: Zettour xưng ''Tôi'' - ''mình'';
    ''the Empire'' -> ''Đế quốc''; ''Lieutenant General von Zettour'' -> ''Trung tướng
    von Zettour''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, giả định & độc thoại nội tâm: bọc toàn bộ
    ''*Giá mà không biết, hẳn mình đã có thể nói ra điều gì đó lạc quan hơn…*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ giả định trái thực tế và đại từ
    nội tâm ''mình''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: Zettour xưng ''Tôi'' - ''mình''; ''Supreme
    Command'' -> ''Bộ Tư lệnh Tối cao''; ''matériel distribution'' -> ''việc phân
    bổ vật tư và trang bị quân sự''; ''human resources'' -> ''nguồn nhân lực''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cơ quan: quy chiếu Zettour bằng ''Ông''; ''logistics''
    -> ''công tác hậu cần''; ''Service Corps'' -> ''Cục Quân vụ''; ''matériel mobilization
    plan'' -> ''kế hoạch huy động vật tư và trang bị quân sự''; ''Operations'' ->
    ''Cục Tác chiến''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại & phủ định: quy chiếu Zettour bằng ''mình''
    (trong mệnh đề nội dung sự tự tin) và ''ông'' (trần thuật), xưng ''tôi'' / ''chúng
    ta'' trong thoại; giữ câu điều kiện phủ định ''Nếu không, câu trả lời của tôi
    cho câu hỏi vừa rồi vẫn không thay đổi.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & danh xưng: công chức gọi Zettour là ''ngài''
    và ''Tướng von Zettour'', dùng ''chúng ta'' khi nói về tình hình chung."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Và sao nữa?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: ''the Empire'' -> ''Đế quốc''; ''national wealth''
    -> ''của cải quốc gia''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & xưng hô: Zettour xưng ''Tôi'', gọi nhóm công
    chức là ''các vị''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: công chức gọi Zettour là ''Ngài''; giữ dấu chấm
    lửng cuối câu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: ''The civil servants'' -> ''Đám công chức dân sự''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & dấu câu: công chức dùng ''Chúng ta'', gọi Zettour
    là ''ngài''; ''reparations'' -> ''bồi thường chiến phí''; ''the Empire'' -> ''Đế
    quốc''; giữ dấu gạch ngang dài ngắt lời cuối câu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=["Thoại & trần thuật: Zettour xưng ''Tôi''; giữ hành động ''Zettour
    ngắt lời''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: quy chiếu phía Đế quốc bằng ''Họ''/''họ'';
    ''matériel mobilization'' -> ''công tác huy động vật tư và trang bị quân sự'';
    ''front lines'' -> ''tiền tuyến''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & dấu câu: Zettour xưng ''Tôi''/''tôi''; giữ
    cặp dấu gạch ngang dài chen ngang; ''the apparatus'' -> ''bộ máy nhà nước''; ''the
    imperial family'' -> ''hoàng gia''; giữ tình thái dè dặt ''Tôi cho là...'' và
    ''có lẽ cũng sẽ gặp nguy hiểm''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Thoại bỏ lửng & xưng hô: công chức gọi Zettour là ''ngài''; giữ
    kết câu ''thì—!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: quy chiếu nhóm công chức bằng ''Họ''/''họ'',
    Zettour bằng ''ông''; giữ phủ định ''đó đâu phải là phận sự của một người lính''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=["Thoại: Zettour xưng ''tôi''; ''military man'' -> ''quân nhân''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Thế nghĩa là sao?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: Zettour xưng ''Tôi''; ''the emperor and the
    state'' -> ''Hoàng đế và quốc gia''; ''fatherland'' -> ''tổ quốc''; ''domestic
    affairs'' -> ''chuyện nội chính''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: ''designated authority'' -> ''thẩm quyền
    đã được ấn định''; ''career soldier'' -> ''quân nhân chuyên nghiệp''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc phủ định – đối lập: giữ mệnh đề ''Chiến tranh,
    xét từ gốc rễ, là sự nối dài của chính trị.''; ''grand strategy'' -> ''đại chiến
    lược''; ''military strategy'' -> ''chiến lược quân sự''; ''Imperial Army'' ->
    ''Lục quân Đế quốc''; ''violence machine'' -> ''cỗ máy bạo lực''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Thoại, danh xưng & xưng hô: công chức xưng ''tôi'', gọi ''Tướng
    von Zettour'' và ''Ngài''; ''the state’s finances'' -> ''nền tài chính quốc gia''."]'
