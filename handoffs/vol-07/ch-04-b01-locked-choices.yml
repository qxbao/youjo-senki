segment_id_end: YS-LN07/Text/chapter014.xhtml/p000032
choices:
- segment_id: YS-LN07/Text/chapter014.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian – địa điểm: giữ định dạng in hoa toàn bộ ''NGÀY
    5 THÁNG 5 NĂM THỐNG NHẤT 1927, VƯƠNG QUỐC ILDOA, VĂN PHÒNG TƯỚNG GASSMAN''; không
    dùng chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & cấu trúc tương phản: giữ định nghĩa vai trò ''người đưa
    tin'' (truyền đạt chuẩn xác ý định người gửi, chuyển đúng nguyên văn không thêm
    bớt hay sửa đổi) và sự đối lập ở câu cuối khi một sĩ quan thực hiện nhiệm vụ đưa
    tin."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & phủ định thời gian: giữ ''Đại tá von Lergen'',
    đại từ trần thuật ''anh'' và cấu trúc ''mãi đến tận lúc này anh mới thấu hiểu
    trọn vẹn điều đó''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & cấu trúc song hành: ''the home country'' ->
    ''bản quốc''; quy chiếu Lergen bằng ''anh''; giữ ba vế song hành về nét mặt, giọng
    điệu và lời nói theo ý muốn của bản quốc."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Phủ định giảm nhẹ & danh xưng: giữ ''khó lòng tóm gọn là chỉ việc
    mở miệng nói chuyện'' và sự tương phản giữa nụ cười hòa nhã thường thấy của ''Tướng
    Gassman'' với việc ''Lergen'' đi thẳng vào vấn đề."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Lergen gọi Gassman là ''ngài''; ''the
    home country'' -> ''bản quốc''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & quân hàm: Gassman hỏi lại và gọi đúng ''Đại tá
    von Lergen''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, phủ định kép, đại từ & thoại: giữ tương quan cấp bậc
    ''với tư cách một đại tá trước mặt một vị tướng'', cấu trúc phủ định kép ''cần
    đến một quyết tâm chẳng hề nhỏ'', đại từ trần thuật ''anh'', và lời thoại nghiêm
    túc xưng ''tôi'' cùng câu hỏi cuối ''Được chứ ạ?''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: giữ câu ngắn ''Anh ngừng lại lấy hơi.'' quy
    chiếu Lergen."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Thoại & sắc thái: giữ nguyên độ thô ráp trực diện của thông điệp
    ''“Đi mà ăn cứt đi. Chỉ có vậy thôi.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & phủ định: ''cease-fire'' -> ''lệnh ngừng
    bắn''; giữ cặp dấu gạch ngang dài giải thích ''—tức là để chấm dứt chiến tranh—''
    và thái độ ''tuyệt đối không lộ vẻ yếu thế, quyết không khoan nhượng''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi, xưng hô & thuật ngữ: Gassman hỏi lại với ''bản
    quốc của ngài''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Thoại & cấu trúc khẳng định: giữ ''“Nói toạc ra thì không hơn
    không kém chính là như vậy.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ, phủ định & nhân quả: giữ giả định ''Nếu có một
    tấm gương ở đây, hẳn anh sẽ thấy trong đó hình ảnh một quân nhân Đế quốc ngạo
    mạn'', phủ định ''gương mặt mình trông chẳng có vẻ gì là đáng gờm'' và quan hệ
    nhân quả ''Đó là lý do anh phải ép những cơ mặt cứng đờ của mình nặn ra một biểu
    cảm gần như tự tin thái quá''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đại từ & điều kiện phủ định: giữ dấu chấm lửng mở đầu
    đoạn, đại từ ''anh''/''mình'', và câu điều kiện phủ định ''Nếu không làm được,
    anh chẳng khác nào một gã hề''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái so sánh: ''Federation Army'' ->
    ''Quân đội Liên bang''; ''the home country'' -> ''bản quốc''; ''Operation Iron
    Hammer'' -> ''Chiến dịch Búa Sắt''; ''Communist ideas'' -> ''tư tưởng Cộng sản'';
    ''us'' -> ''chúng tôi''; giữ mệnh đề so sánh giả định ''cứ như thể làm vậy là
    ước nguyện ấp ủ bấy lâu nay của họ''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Thoại & sắc thái: giữ nhận xét của Gassman ''“Cách diễn đạt đó
    nghe đậm chất quân phiệt đấy.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc, đại từ & tình thái: quy chiếu Gassman bằng
    ''ông'' / ''một quân nhân chính khách'' / ''một vị tướng cáo già'' và Lergen bằng
    ''một sĩ quan cấp trung non kinh nghiệm''; giữ tình thái suy đoán ''hẳn ông đã
    nhận ra''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Lergen xưng ''tôi''/''Tôi'', gọi Gassman
    là ''ngài'' và ''thưa Tướng quân''; ''the Federation’s pronouncements'' -> ''những
    tuyên bố của phía Liên bang''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tính nhất quán của hình ảnh ''làm một gã hề''
    với p000015."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: Gassman hỏi Lergen bằng đại từ ''Ngài''
    (''“Ngài có biết điều cơ bản nhất về đàm phán không đấy?”'')."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Lergen đáp ngắn gọn ''“Tất nhiên là tôi biết.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu Lergen bằng ''Anh''/''mình'' và
    giữ thời quá khứ hoàn thành ''đã biết trước''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: chỉ bọc cụm ''*Đừng có đòi hỏi
    quá đáng như thế nữa*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ
    ''Đế quốc'', ''Vương quốc Ildoa'' và cặp quy chiếu ''bên trước'' - ''bên sau''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Gassman xưng ''Tôi'', gọi Lergen là
    ''ngài'', gộp hai bên là ''chúng ta''; giữ ''Ildoa'' và ''các điều khoản của Đế
    quốc''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Thoại, trần thuật, phủ định & tình thái: giữ sự tương phản giữa
    cái gật đầu cung kính của Lergen và ''thượng lệnh nghiêm ngặt là không được nhượng
    bộ nửa bước''; giữ tình thái ''có lẽ sẽ chỉ trông như sự lịch sự bề ngoài trong
    mắt vị tướng quân''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & đại từ: giữ dấu chấm lửng mở đầu đoạn và đại từ ''anh''
    quy chiếu Lergen."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ ngoại giao, câu hỏi & xưng hô: ''reparations'' -> ''bồi
    thường chiến phí''; ''disarmed region'' -> ''khu vực phi quân sự''; ''cession
    of key strategic points'' -> ''việc cắt nhượng những cứ điểm chiến lược trọng
    yếu''; ''citizen votes in occupied territories'' -> ''việc tổ chức bỏ phiếu lấy
    ý kiến công dân tại các vùng lãnh thổ bị chiếm đóng''; Gassman gọi phía Đế quốc
    là ''các ngài''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & điều kiện giả định: ''The home country'' ->
    ''Bản quốc''; phân biệt ''tôi'' (Lergen) và ''chúng tôi'' (Đế quốc); giữ điều
    kiện ''nếu cần thiết'' và mệnh đề giả định ''dù điều đó dựa trên giả định rằng
    hiệp ước bảo đảm các nơi ấy được thiết lập thành những vùng tự trị''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, dấu câu & đại từ: Gassman gọi ''Đại tá von Lergen'',
    giữ dấu chấm lửng sau ''nói thẳng ra là…'', phân biệt ''chúng tôi'' (Ildoa) và
    ''các ngài'' (Đế quốc), giữ ''chuyện bỏ phiếu và việc ấn định sự chia cắt này''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Thoại phủ định & đại từ: Lergen từ chối dứt khoát ''“Chúng tôi
    không thể làm vậy.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Phủ định, tình thái & thuật ngữ: giữ phủ định nhấn mạnh ''thậm
    chí chẳng buồn che giấu vẻ chua chát'', tình thái ''Có lẽ điều đó cũng hoàn toàn
    tự nhiên thôi'' và ''phía Ildoa hẳn đã hình dung được mình phải đối mặt với điều
    gì ngay cả trong giai đoạn đàm phán sơ bộ''."]'
