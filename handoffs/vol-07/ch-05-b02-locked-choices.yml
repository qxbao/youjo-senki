    chọn anh ta về làm việc dưới trướng mình.''", ''Không dùng nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: ''*về cơ bản*'' tương ứng
    với thẻ em trong nguồn", "Xưng hô của Loria với viên đại tá: ''đồng chí''", ''Câu
    hỏi xác nhận hàm ý có ngoại lệ'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''political commissars'' -> ''các chính ủy''; ''in
    the field'' -> ''ngoài thực địa''", "Tình thái dè dặt trong lời đáp của viên đại
    tá: ''Hình như đã có một số bàn bạc... nhằm diễn giải lại mệnh lệnh sao cho phù
    hợp với nhận định của họ.''", ''Không dùng nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Danh xưng & xưng hô: ''Đồng chí Đại tá'' (''Comrade Colonel'');
    ''tôi'' (Loria) - ''đồng chí'' (viên đại tá)", "Thuật ngữ: ''doctrine'' -> ''học
    thuyết''; ''purging'' -> ''thanh trừng''; ''commanders in the field'' -> ''Các
    chỉ huy ngoài thực địa''", "Phủ định & giả định: ''tôi không đổ lỗi cho ai cả.
    Cuộc tìm hiểu này (hoặc Việc tìm hiểu này) không nhằm mục đích buộc tội... Nếu
    tôi muốn thanh trừng một ai đó, tôi thừa sức bịa ra vô số lý do.''", ''Không dùng
    nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & cơ quan: ''Tôi'' (viên đại tá); ''Commissariat for Internal
    Affairs'' -> ''Bộ Dân ủy Nội vụ''", "Phủ định dè dặt có dấu ba chấm đầu và cuối
    câu: ''“…Tôi không nghĩ đó là kiểu chuyện đáng phải báo cáo lên Bộ Dân ủy Nội
    vụ…”''", ''Không dùng nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trong lời Loria: ''Đồng chí, tôi cứ tưởng đồng chí đã
    hiểu ý tôi rồi chứ.''", ''Không dùng nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000039
