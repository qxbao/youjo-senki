    lại''", ''Không dùng nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''slight tactical improvements'' -> ''những cải tiến
