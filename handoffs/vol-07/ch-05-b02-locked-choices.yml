- segment_id: YS-LN07/Text/chapter018.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật chỉ Loria: ''gã''; chỉ giới sĩ quan: ''họ''",
    "Giữ sát nghĩa mặt chữ nguồn ở vế đầu (''trong việc khuất phục nó theo ý chí của
    quân đội'') và quan hệ nhượng bộ ''Mặc dù... nhưng xét về mặt..., xem ra người
    tiền nhiệm của gã đã đi hơi quá đà.''", ''Không dùng nhấn mạnh Markdown'']'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000044
