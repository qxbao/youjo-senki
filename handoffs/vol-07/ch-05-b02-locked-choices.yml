- segment_id: YS-LN07/Text/chapter018.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown theo DEC-P01-002: ''*nhỏ*'' tương ứng với thẻ
    em trong nguồn", "Xưng hô van nài dè dặt của viên đại tá: ''…Đồng chí, xin đồng
