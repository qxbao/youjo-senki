- segment_id: YS-LN07/Text/chapter008.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & điểm nhìn: giữ nhận định tình hình thực sự hỗn loạn
    và phản ứng ''Tanya chỉ muốn thở dài.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=[''Thoại: Tanya nhận xét tín hiệu liên lạc bắt được từ phía quân
    mình là một mớ hỗn độn.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại, xưng hô & thuật ngữ: ''Serebryakov''; trong
    thoại tự xưng ''tôi'' kèm ''ạ''; ''Federation Army'' -> ''Quân đội Liên bang'';
