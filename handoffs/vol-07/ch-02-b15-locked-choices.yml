- segment_id: YS-LN07/Text/chapter008.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & câu hỏi: Serebryakov đáp lời Tanya kèm ''thưa
    Trung tá'' và tiểu từ ''ạ''; giữ câu hỏi xác nhận quy trình quen thuộc."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: ''adjutant'' -> ''Viên sĩ quan phụ tá'';
    quy chiếu Serebryakov bằng ''cô ấy''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & thuật ngữ: truyền đạt mệnh lệnh cho toàn ''Kampfgruppe'';
    ''aerial mage battalion'' -> ''Tiểu đoàn pháp sư trên không''; ''right wing of
    the main troops'' -> ''cánh phải của lực lượng chủ lực''; ''intercept'' -> ''đánh
    chặn''; ''forward positions'' -> ''vị trí tiền tiêu''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thoại: giữ lời nhắn của Tanya ''Tôi trông cậy vào
    các anh đấy'' và cách gọi thân mật ''đám con cưng của mình'' cho tiểu đoàn pháp
    sư."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định kép: giữ cấu trúc phủ định song song (''không
    quá phấn khích mà cũng chẳng hề lơi lỏng'') và hình ảnh so sánh với khối cơ bắp
    đã qua rèn luyện bài bản."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: nội tâm của Tanya dùng ''chúng
    ta''; giữ phủ định ''không thể tự hào coi đây là tiêu chuẩn chung''; ''Imperial
    Army'' -> ''Lục quân Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=["Thoại, trần thuật & đại từ: giữ câu lẩm bẩm nghi vấn của Tanya;
    trần thuật dùng ''Nó'' cho Tanya theo DEC-P01-001; ''friendly signals'' -> ''tín
    hiệu của quân ta''; ''rescue mission'' -> ''nhiệm vụ tiếp ứng giải vây''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: giữ cấu trúc tăng tiến ''Càng... càng...''
    và đại từ ''nó'' quy chiếu Tanya theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & thuật ngữ: ''Group leader'' -> ''Chỉ huy cụm
    chiến đấu''; ''Kampfgruppe'' -> ''Kampfgruppe''; ''new orbs'' -> ''quả cầu mới'';
    giữ sắc thái thừa nhận sức mạnh thực tế của khí tài địch."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000302
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến, phủ định & thuật ngữ: ''defensive shell'' -> ''Lớp
    vỏ phòng thủ''; ''Explosion formulas'' -> ''Thuật thức phát nổ'' kèm phủ định
    ''không xuyên thủng được''; ''opticals'' -> ''các đòn quang học''; ''shield''
    -> ''Lá chắn''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, quân hàm, đại từ & thuật ngữ: ''Lieutenant Colonel
    Tanya von Degurechaff'' -> ''Trung tá Tanya von Degurechaff''; quy chiếu Tanya
    bằng ''nó'' theo DEC-P01-001; ''computation orb'' -> ''quả cầu tính toán''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000304
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, tình thái & đại từ: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; giữ mức độ suy đoán ''hẳn phải giống như một Valkyrie'' và ''có lẽ...
    một thiên thần''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, phủ định & đại từ: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; ''self-preservationist'' -> ''kẻ theo chủ nghĩa bảo toàn mạng sống'';
    giữ câu phủ định bác bỏ (''chẳng ngăn cản nó làm tròn công việc của mình'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000306
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & phủ định kép: quy chiếu Tanya bằng ''nó''
    theo DEC-P01-001; giữ nguyên cấu trúc phủ định kép ở câu cuối (''chẳng phải vì
    thế mà một người như vậy lại không có tâm tư gì trước tình hình hiện tại'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000307
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ câu dẫn ngắn gọn ''Một lời phàn nàn buột khỏi
    miệng.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000308
  kind: terminology_and_voice
  value: 'choices=["Thoại & câu hỏi: Tanya lẩm bẩm hỏi về ''mấy mẫu mới này'' đang
    gây rắc rối cho ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, thuật ngữ & giả định quá khứ: Grantz đáp lời Tanya
    kèm tiểu từ ''ạ'', tự xưng ''tôi''; ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ giả định quá khứ trách móc (''Đáng lẽ chúng cứ dùng những khí tài quen tay
    như chúng ta là được rồi'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000310
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, điểm nhìn & đại từ: quy chiếu Grantz bằng ''anh ta'';
    giữ quan hệ đối lập giữa ý định độc thoại của Tanya và phản hồi thiện chí của
    cấp dưới."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000311
  kind: terminology_and_voice
  value: 'choices=["Thoại & quân hàm: Tanya đáp lại Grantz bằng ''Trung úy'', giữ
    phủ định khẳng định ''Không nghi ngờ gì về điều đó đâu''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000312
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Grantz tự xưng ''tôi'' kèm ''ạ'', dùng ''chúng
    ta'' và giữ quan hệ nhân quả nhấn mạnh lý do đơn vị mình xuất kích."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại, xưng hô & thuật ngữ: giữ tình thái suy đoán
    ''có lẽ hoàn toàn nghiêm túc''; trong thoại Tanya xưng ''tôi'' – ''cậu'' với Grantz;
    ''the Rhine'' -> ''mặt trận Rhine''; giữ hình ảnh ví von ''chú cừu non run lẩy
    bẩy''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000314
  kind: terminology_and_voice
  value: 'choices=["Thoại & ẩn dụ: Grantz tự xưng ''tôi'', giữ lối chơi chữ kết hợp
    thành ngữ ''rèn sắt khi còn nóng'' và việc đạn pháo đã làm nóng người."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000315
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, điểm nhìn, đại từ & giả định quá khứ: quy chiếu Grantz
    bằng ''Anh ta'' / ''chàng trai trẻ này''; giữ giả định quá khứ đối lập với hiện
    tại (''Trước kia, hẳn chàng trai trẻ này đã câm như hến rồi'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000316
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & quân hàm: câu đầu Tanya gọi Grantz là ''cậu'';
    câu sau chuyển sang gọi ''Thiếu tá Weiss'' bằng ''Anh''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000317
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: Weiss phủ định nhẹ nhàng (''Không đâu, vẫn còn
    sớm lắm''), quy chiếu Grantz bằng ''cậu ta'' và giữ cấu trúc nhượng bộ khen pha
    chê."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000318
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & xưng hô: Tanya đáp Weiss (''Anh nói không sai''),
    tự xưng ''Tôi'' và nhắc cả đội bớt tán gẫu vì đồng đội đang chiến đấu gian khổ."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=["Thoại & định dạng: giữ nguyên cặp dấu ngoặc kép lồng nhau biểu
    thị đồng thanh đáp lời (''““Đã rõ ạ.””'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=[''Thoại: giữ câu bổ sung ôn hòa của Tanya về việc có chút thư thái
    trước trận đánh.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & thuật ngữ: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; ''imperial troops'' -> ''các đơn vị quân Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000322
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & thuật ngữ: ''Group leader'' -> ''Chỉ huy cụm
    chiến đấu''; giữ nhịp lắp bắp khẩn cấp yêu cầu báo cáo tình hình."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000323
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & thuật ngữ: giữ bốn lời thoại hỗn loạn liên tiếp;
    ''Third Company'' -> ''Đại đội 3''; ''01'' -> ''01''; ''protocols'' -> ''giao
    thức liên lạc''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến, câu hỏi phủ định & thuật ngữ: giữ câu hỏi bức
    bối ''Không có pháo binh chi viện sao?!''; ''Sector B-23'' -> ''Khu vực B-23'';
