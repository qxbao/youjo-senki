- segment_id: YS-LN07/Text/chapter008.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=["Thoại, trần thuật & thuật ngữ: ''The Reich’s troops'' -> ''Quân
    đội Đế quốc''; giữ câu hỏi mỉa mai và tiếng cười khẩy của Tanya."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & câu hỏi tu từ: giữ đối lập giữa ''thế yếu về số lượng''
    với ''ưu thế về chất lượng cùng sức mạnh tổ chức'' trong câu hỏi tu từ của Tanya."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: giữ câu nhận định phủ định dứt khoát ''Đó
    chẳng phải là cách để đánh một cuộc chiến.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: độc thoại nội tâm tự quy chiếu của
    Tanya dùng ''Mình'' theo DEC-P01-001; giữ phủ định ở cả hai vế (''không có ý định
    tin tưởng mù quáng vào chuyện tinh thần thắng vật chất'', ''vấn đề sĩ khí cũng
    không thể bị xem nhẹ'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: chỉ bọc ''*đáng công sức*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ phủ định ''chẳng ngần ngại cam
    chịu điều kiện tồi tệ''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & phủ định: lược đại từ khái quát ngôi thứ hai, giữ
    mệnh lệnh phủ định ''Không được đánh giá thấp sức mạnh của ngôn từ.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến: ''01 gọi 02''; giữ cách nói giảm nói tránh ''màn
    chào đón nồng nhiệt hơn tưởng tượng''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến: ''02 nghe rõ. Đúng như lời 01 nói.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm, xưng hô & phủ định: Serebryakov báo cáo kèm ''Thưa
    Trung tá'' và ''ạ''; ''Captain Meybert'' -> ''Đại úy Meybert''; giữ phủ định ''họ
    không có đủ binh lực để bảo vệ vị trí''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: Tanya quy chiếu Đại úy Meybert bằng ''Anh ấy''
    và yêu cầu tạm chờ để cân nhắc."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, quân hàm & nhấn mạnh Markdown: bọc trọn câu
    hỏi độc thoại nội tâm ''*Mình có nên tách dù chỉ một mình Trung úy Grantz ra rồi
    cử quay lại không nhỉ?*'' trong dấu sao theo DEC-P01-002 và dùng ''Mình'' theo
    DEC-P01-001; câu trần thuật sau dùng ''nó'' cho Tanya."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000339
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: giữ sự tương phản binh chủng giữa ''Meybert
    là lính pháo binh'' và ''Ahrens là lính xe tăng''; ''armored unit commander''
    -> ''chỉ huy đơn vị thiết giáp''; ''mobile defensive battle'' -> ''trận phòng
    ngự cơ động''."]'
