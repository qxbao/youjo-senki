choices:
- segment_id: YS-LN07/Text/chapter012.xhtml/p000318
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới & thuật ngữ: giữ dấu ba chấm mở đầu, thuật ngữ
    ''quân bổ sung'', tình thái tất yếu ''ắt hẳn sẽ sụt giảm'' và tiểu từ kính ngữ
    ''ạ'' khi Weiss nói với Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Tanya đáp ''Tôi biết chứ, Thiếu tá Weiss.''
    (không dùng ''ạ'' với cấp dưới)."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tu từ: giữ ''các cựu binh'', ''lính thời vụ'',
    ''Bộ Tổng tham mưu'' và ''suy nghĩ viển vông''; giữ sắc thái hoài nghi mỉa mai
    ở câu hỏi cuối."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trần thuật: chỉ bọc ''*Hừm…*'' khớp thẻ em
    nguồn theo DEC-P01-002; trần thuật gọi tên ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000322
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, phủ định & nhấn mạnh Markdown: quy chiếu Tanya
    bằng ''nó'' theo DEC-P01-001; giữ cấu trúc phủ định ''không thể phủ nhận'', từ
    vựng ''lính mới'', ''tiền tuyến'' và chỉ bọc ''*về mặt lý thuyết*'' khớp thẻ em
    nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000323
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhấn mạnh Markdown: giữ ''Lục quân Đế quốc''; bọc
    chính xác hai cụm đối lập ''*Sắp cạn*'' và ''*cạn sạch*'' khớp hai thẻ em nguồn
    theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=["Điều kiện loại trừ & thuật ngữ: giữ cấu trúc ''Trừ phi ..., bằng
    không ...'' và thuật ngữ ''bản quốc''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & quan hệ tiền đề: dùng đại từ tự quy chiếu
    ''Mình'' theo DEC-P01-001; giữ ý phủ định rào đón ''Mình không định viện dẫn thống
    kê bảo hiểm đâu'' và quy luật tích tụ áp lực nhỏ trước tai nạn."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=["So sánh & câu hỏi nội tâm: giữ so sánh mức độ ''lớn hơn một sai
    lầm đơn thuần rất nhiều'' và hai câu hỏi liên tiếp về sự biến đổi chất lượng quân
    lính trong vài ngày."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=["Đại từ & đối lập thời gian: dùng ''chúng ta''; giữ đối lập trực
    tiếp giữa ''lệnh tiến quân hôm qua'' và ''lệnh rút lui đột ngột vào hôm nay''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=["Tình thái giả định & thuật ngữ: giữ thành ngữ ''bị quay như chong
    chóng'', tình thái ''Thông thường, đây sẽ là dấu hiệu...'' và tên ''Lục quân Đế
    quốc''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc ''*Thông thường*'' khớp thẻ em nguồn
    theo DEC-P01-002, liên kết trực tiếp với p000328."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tương phản: giữ phủ định đầu câu ''Không xảy ra rối
    loạn trên chiến trường mới là chuyện đáng ngạc nhiên hơn'' và mệnh đề tương phản
    dạng câu hỏi ở vế sau."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nhấn mạnh Markdown: quy chiếu Tanya bằng ''Nó''
    theo DEC-P01-001; bọc chính xác ''*Chiến tuyến đang rối rắm, nên trước mắt cứ
    rút lui đã*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế & thuật ngữ: giữ câu điều kiện ''Nếu ...
    thì người ta đã chẳng bao giờ cần đến...'' và thuật ngữ ''lực lượng đoạn hậu''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: giữ ''cấp trên'' và đại từ bao gộp ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định kép & nhấn mạnh Markdown: trần thuật quy chiếu
    Tanya bằng ''nó'' theo DEC-P01-001; bọc riêng ''*Và*'' ở đầu câu và bọc toàn bộ
    hai câu nội tâm tiếp theo khớp chính xác hai thẻ em nguồn theo DEC-P01-002; giữ
    phủ định kép ''Không thể nói là hoàn toàn không có chút rối loạn nào''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=["Phủ định điều kiện: giữ cấu trúc phủ định đi kèm điều kiện loại
    trừ ''không thể nào xảy ra được trừ phi có kẻ nào đó ở đâu đó đang thao túng mọi
    chuyện''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=[''Thoại suy luận: giữ câu hỏi xác định mục đích của chủ thể đứng
    sau thao túng.'']'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: giữ ''trận địa phòng ngự'', ''lính mới'', ''tiền
    tuyến'', ''cựu binh''; đổi ''rút bớt các cựu binh ra'' thành ''giải phóng lực
    lượng cựu binh'' (hoặc ''rút các cựu binh ra để rảnh tay'') theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu bỏ lửng: giữ thuật ngữ ''Trinh sát chiến đấu''
    và câu điều kiện bỏ lửng ở cuối."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000339
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: giữ ''Kampfgruppe'', ''chúng ta'',
    ''Lục quân Đế quốc'', ''quân đoàn'', ''trinh sát chiến đấu'' cùng hai mệnh đề
    phủ định liên tiếp."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000340
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & kính ngữ: sĩ quan phụ tá gọi Tanya là ''Trung tá''
    và dùng kính ngữ ''ạ'' ở cuối câu hỏi."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000341
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & chức danh: gọi tên ''Tanya'' và quy chiếu
    bằng ''nó'' theo DEC-P01-001; giữ chức danh ''viên sĩ quan phụ tá'' và cấu trúc
    ''Phải đến khi ... thì nó mới để ý''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000342
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ huy: Tanya xưng ''tôi'' với sĩ quan phụ tá, giữ giọng
    tự nhiên."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000343
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ trần thuật: chỉ bọc ''*Dù sao thì.*''
    khớp thẻ em nguồn theo DEC-P01-002; trần thuật quy chiếu Tanya bằng ''Nó'' / ''nó''
    và ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000344
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000345
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nghĩa: quy chiếu Tanya bằng ''Nó'', cấp dưới
    bằng ''thuộc cấp'' / ''họ''; giữ ''phương án khắc phục'' và ''các mệnh lệnh tiếp
    theo''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000346
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, giả định quá khứ & thuật ngữ: Tanya xưng ''tôi'', dùng
    ''chúng ta'' bao gộp đơn vị; giữ ''Đại tá Calandro'' và ''sự cố ngoại giao quốc
    tế''; đổi ''Thưa các quân nhân'' thành ''Này mọi người'' (hoặc ''Các vị'') theo
    finding để khớp vị thế chỉ huy và giọng đùa."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000347
  kind: terminology_and_voice
  value: 'choices=["Dấu thoại ba lớp, tình thái & thuật ngữ: giữ nguyên cặp ngoặc
    kép ba lớp ''“““Ha-ha-ha!”””'', tên ''Tospan'', ''Tanya'', tình thái suy đoán
    ''hẳn đều đang...'' và ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000348
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ trần thuật: chỉ bọc ''*Chà*'' khớp
    thẻ em nguồn theo DEC-P01-002; quy chiếu Tanya bằng ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000349
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ tên ''Tanya'', ''Bộ Tổng tham mưu'' và ''Nguồn
    nhân lực''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000350
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & tình thái: Tanya dùng ''Chúng ta'' và ''tôi'',
    giữ ''sở chỉ huy'', tình thái ''nghe đâu là tàn nhẫn nhất trong số chúng ta''
    và ''Trung úy Serebryakov''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & phân biệt đại từ: Serebryakov xưng ''Tôi'',
    gọi Tanya là ''thưa Trung tá''; đổi thán từ mở đầu từ ''Dạ—?'' thành ''Hả—?''
    (hoặc ''Ơ—?'') theo finding; trong trần thuật giữ ''Kampfgruppe'' và dùng đại
    từ ''cô'' cho Serebryakov để phân biệt với ''nó'' (Tanya)."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=["Thoại thuộc cấp: giữ ''chỉ huy của chúng ta'' và lời tán thưởng
    pha nét hóm hỉnh của Ahrens."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000353
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tôn ti xưng hô & thuật ngữ: giữ ''Đại úy Ahrens'', ''các
    sĩ quan ma pháp'' và đại từ ''cô ấy'' (chỉ Serebryakov); đổi ''Vâng ... Đại úy
    Ahrens ạ'' thành ''Ừm ... Đại úy Ahrens'' (bỏ ''ạ'') theo finding để giữ đúng
    tôn ti Trung tá chỉ huy nói với Đại úy thuộc cấp."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000354
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & nghĩa số lượng: trong thoại Ahrens xưng ''tôi
    ... ạ'', gọi Serebryakov là ''cô ấy''; trong trần thuật quy chiếu Ahrens bằng
    ''anh'', Serebryakov bằng ''cô''; đổi ''không dưới một lần'' thành ''hơn một lần''
    (hoặc ''không chỉ một lần'') theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000355
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: quy chiếu Tanya bằng ''Nó'' theo
    DEC-P01-001; giữ tình thái ''dường như đều đồng tình''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000356
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: giữ ''Đại úy Meybert'', ''Trung úy Tospan'',
    ''Đại úy Ahrens'', ''Thiếu tá Weiss''; Tanya gọi Meybert và Tospan là ''hai người'',
    gọi Weiss là ''Anh'' (không dùng ''ạ'')."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000357
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới: Weiss dùng kính ngữ ''ạ'' khi đáp lời Tanya và
    quy chiếu Serebryakov bằng ''Cô ấy''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000358
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ hình ảnh ẩn dụ ''Màn song tấu thở dài''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000359
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nghĩa: gọi tên ''Tanya'' và quy chiếu bằng
    ''nó'' theo DEC-P01-001; giữ trọn mạch suy nghĩ thực dụng về việc dùng câu chuyện
    làm chất liệu gắn kết với thuộc cấp."]'
