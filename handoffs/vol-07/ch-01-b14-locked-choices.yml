- segment_id: YS-LN07/Text/chapter002.xhtml/p000559
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & chiến thuật: Tanya gọi thuộc cấp là ''các anh''; ''hold
    ground'' -> ''giữ đất''; ''flank our numbskull enemies and scatter them'' -> ''đánh
