    vô hiệu hóa kẻ địch.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000570
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại lính chiến: giữ câu hỏi xác nhận mang sắc thái khẩu
    ngữ ''Đã tiêu diệt xong, phải không hả?!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000571
  kind: terminology_and_voice
  value: 'choices=["Xưng hô quân hàm: ''Colonel'' (gọi Trung tá Tanya) -> ''Thưa Trung
    tá''; giữ ''Thưa Trung tá, đằng kia!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000572
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & nghĩa: tự quy chiếu của Tanya dùng ''mình'' theo
    DEC-P01-001; giữ cách đánh giá ''đám lính thảm hại có thể được mô tả là tàn quân
    của đội quân bại trận''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000573
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, đại từ & suy luận: giữ dấu chấm lửng giữa câu, đại từ
