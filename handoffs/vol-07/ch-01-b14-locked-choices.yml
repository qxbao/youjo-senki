- segment_id: YS-LN07/Text/chapter002.xhtml/p000566
  kind: terminology_and_voice
  value: 'choices=["Thoại cảnh báo ngắn: giữ ''Lính địch!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000567
  kind: terminology_and_voice
  value: 'choices=["Thoại tác chiến: giữ ''Chúng ta đã chạm trán địch! Xông vào đi!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000568
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''hand-to-hand combat'' -> ''đánh giáp lá
