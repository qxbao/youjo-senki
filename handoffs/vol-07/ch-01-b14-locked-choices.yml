    hiện một lỗ thủng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000574
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh: giữ câu hỏi cảm thán và mệnh lệnh ''Cái quái
    gì thế kia? Vá nó lại ngay!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000575
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm/khái quát & thuật ngữ: tự quy chiếu của Tanya dùng
    ''Mình'' theo DEC-P01-001, chủ ngữ khái quát dùng ''Bạn''; ''academy'' -> ''học
    viện quân sự''; ''defense by interior lines'' -> ''phòng ngự theo lối nội tuyến'';
    ''total rout'' -> ''vỡ trận toàn diện''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000576
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm/khái quát, điều kiện & thuật ngữ: tự quy chiếu
    của Tanya dùng ''Mình'' theo DEC-P01-001, chủ ngữ khái quát dùng ''bạn''; ''war
    college'' -> ''trường đại học quân sự''; ''mobile defense'' -> ''phòng ngự cơ
