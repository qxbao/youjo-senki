- segment_id: YS-LN07/Text/chapter002.xhtml/p000534
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; giữ nét phỏng đoán/ước chừng ''có lẽ là tất cả những gì nó có thể
    làm vào lúc này''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000535
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại cảm thán: giữ hai câu hỏi bức xúc liên tiếp của Tanya
    ''Làm thế quái nào mà cái lũ hoàn toàn nghiệp dư này lại trở thành sĩ quan được
    chứ?! Rốt cuộc chuyện quái gì đang diễn ra thế này?!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000536
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ nguyên chủ thể ''Tanya'' và hành động ''Nén lại
    thôi thúc muốn tặc lưỡi, Tanya lắc đầu.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000537
  kind: terminology_and_voice
  value: 'choices=["Thời gian giả định, phủ định & thuật ngữ: giữ giả định trái thực
    tế trong quá khứ ''Giá mà ít nhất đã kịp bàn bạc một kế hoạch với Trung đoàn 54
    thì tốt biết mấy…'', phủ định hiện tại ''xem chừng không còn đủ thời gian nữa
    rồi'' và nhận định ''Tự kiểm điểm và hối tiếc là thứ xa xỉ chỉ người còn sống
    mới được phép tận hưởng.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000538
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm khái quát: dùng ''chúng ta'' cho nhận định tự chiêm
    nghiệm ''Còn có khả năng lo lắng chính là một cách khá thích hợp để tự chứng minh
    với bản thân rằng chúng ta vẫn đang còn sống.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000539
  kind: terminology_and_voice
  value: 'choices=["Đại từ thoại & phủ định: giữ dấu chấm lửng mở đầu, đại từ ''Chúng
    ta''/''chúng ta'' và ''Tôi'' của Tanya; giữ hai câu phủ định ''Chúng ta không
    thể phối hợp với mấy người này được. Thậm chí chẳng nên thử làm gì.'' cùng ý ''chất
    chồng một đống chiến thắng cá nhân cho đến khi nó mang dáng dấp na ná lối đánh
    đồng đội''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000540
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn: giữ ''Sự cấp thiết biện minh cho lựa chọn đó.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mệnh lệnh khích lệ: ''aerial mage battalion'' -> ''tiểu
    đoàn pháp sư trên không''; giữ ''Hãy tận dụng sức cơ động của một tiểu đoàn pháp
    sư trên không.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & thuật ngữ: tự quy chiếu của Tanya dùng ''Mình''/''mình''
    theo DEC-P01-001; ''operation theory'' -> ''lý thuyết tác chiến''; ''war college''
    -> ''trường đại học quân sự''; ''General von Zettour'' -> ''Tướng von Zettour''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu & thuật ngữ: giữ dấu gạch ngang giải thích; ''single
    strikes'' -> ''những đòn tập kích đơn lẻ''; ''aerial mage battalion'' -> ''tiểu
    đoàn pháp sư trên không''; ''optimal reserve force'' -> ''lực lượng dự bị tối
    ưu''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa: giữ ''những chuyên gia săn lùng con người tối
    ưu nhất'' và cách tự nhắc tên ''Tanya'' trong dòng suy nghĩ chuyển mạch."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Nhận định ngắn: giữ ''Tình hình hiện tại cực kỳ bất lợi.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''Chain of command'' -> ''Hệ thống chỉ huy''; giữ ''Hệ
    thống chỉ huy đã sụp đổ.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ ''Việc chuyển giao quyền chỉ huy không
    phát huy tác dụng.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ ''Đã thế, quân số của địch lại còn ở mức đáng ngại.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & đối lập: dùng ''chúng tôi'' cho đơn vị của
    Tanya; giữ phủ định ''không phải là lý do để sao nhãng'' và quan hệ đối lập ''Trái
    lại, chúng tôi càng phải thực hiện công việc của mình một cách vững vàng và cẩn
    trọng hơn cả thường lệ.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh quân sự: giữ ''Toàn tiểu đoàn, nghiêm!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngắn: giữ ''Mệnh lệnh lập tức nhận lại một phản ứng
    hoàn hảo.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & thuật ngữ: tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; ''203rd Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên
    không số 203''; giữ hình ảnh so sánh ''cứ như thể có một luồng điện vừa chạy dọc
    từ đỉnh đầu xuống tận gót chân họ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ ''Đó là điều đã được rèn giũa vào người họ vô số lần
    trên thao trường.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & tên nhân vật: giữ ''Thiếu tá Weiss, Trung úy Grantz
    và Trung úy Serebryakov''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & phủ định: tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; giữ cấu trúc phủ định nhấn mạnh ''không cảm thấy gì ngoài sự
    hài lòng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh & phủ định: dùng ''chúng ta'' cho tiểu đoàn; giữ
    câu mệnh lệnh phủ định ''Đừng trông mong các đơn vị khác làm được bất cứ việc
