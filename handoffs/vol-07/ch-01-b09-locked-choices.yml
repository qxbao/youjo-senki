- segment_id: YS-LN07/Text/chapter002.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nội tâm số nhiều dùng ''bọn mình'' theo DEC-P01-001;
    quy chiếu cánh quân bằng ''họ''; giữ nhận định ''một cuộc rút lui có trật tự là
    điều lý tưởng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ sự chuyển ý đối lập ''Nhưng… trong hoàn cảnh này, đó
