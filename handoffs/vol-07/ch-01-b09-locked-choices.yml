- segment_id: YS-LN07/Text/chapter002.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: câu độc thoại nội tâm ngôi thứ nhất số nhiều
    dùng ''bọn mình'' theo DEC-P01-001 (''Vâng, bọn mình đang chạy đấy.'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tên riêng & tình thái: ''regimental headquarters''
    -> ''sở chỉ huy trung đoàn''; giữ nguyên ''Dirichlet''; giữ suy đoán điều kiện
    ''hẳn Dirichlet phải có thể lực rất sung mãn thì mới có thể chạy dọc con đường
    này trong điều kiện tồi tệ đến thế''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000353
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: quy chiếu Dirichlet bằng ''ông ấy''; nội tâm
