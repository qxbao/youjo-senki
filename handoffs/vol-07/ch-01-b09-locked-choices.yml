    một chút ý cười'', ''chẳng buồn che giấu'' và suy đoán ''Hẳn anh ta đã nhận ra''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000317
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & thuật ngữ: Weiss đáp ''“…Rõ.”'', xưng ''Tôi''
    và ''chúng tôi''; ''company'' -> ''đại đội''; ''cover us'' -> ''yểm trợ cho chúng
    tôi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000318
  kind: terminology_and_voice
  value: 'choices=["Thoại: Tanya nhận lời ngắn gọn ''“Cứ giao cho tôi.”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & phủ định: giữ phủ định ''chẳng phải là công việc gì khó
