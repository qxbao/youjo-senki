- segment_id: YS-LN07/Text/chapter002.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=["Nghĩa, thuật ngữ & phủ định: đối lập hai kịch bản ''Trong kịch
    bản khả quan nhất'' và ''còn kịch bản tồi tệ nhất''; ''imperial lines'' -> ''phòng
