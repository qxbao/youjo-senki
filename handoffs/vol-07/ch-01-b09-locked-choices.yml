- segment_id: YS-LN07/Text/chapter002.xhtml/p000315
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ thán từ ngạc nhiên ''“Hả?”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000316
  kind: terminology_and_voice
  value: 'choices=["Thoại, cấp bậc, điểm nhìn, đại từ & phủ định: Tanya gọi Weiss
