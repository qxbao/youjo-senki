- segment_id: YS-LN07/Text/chapter002.xhtml/p000313
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tình thái: trần thuật gọi ''Tanya'' và quy
    chiếu bằng ''nó'' theo DEC-P01-001; gọi ''Weiss'' và quy chiếu bằng ''anh ta'';
