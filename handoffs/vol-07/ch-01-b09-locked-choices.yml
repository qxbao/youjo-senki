- segment_id: YS-LN07/Text/chapter002.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, tên riêng & phủ định: giữ nguyên ''Weiss'' và ''Tanya'';
    giữ phủ định mức độ ''chẳng mất mấy thời gian'' và sắc thái ''cảm giác hẫng hụt''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu lẩm bẩm ''“…Lạ thật đấy.”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000322
  kind: terminology_and_voice
