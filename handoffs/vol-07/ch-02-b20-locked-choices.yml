- segment_id: YS-LN07/Text/chapter008.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định, thuật ngữ & nhấn mạnh Markdown: chỉ bọc ''*Xin
    chia buồn cùng gia quyến*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002;
    ''sympathy vote'' -> ''phiếu bầu cảm thông''; giữ mệnh đề nhân quả phủ định ''chỉ
    đơn giản vì họ không ghét người ấy''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & điều kiện: dùng ''bạn'' cho chủ thể khái quát;
    giữ cấu trúc bất kể ''dù có... hay không'' và phủ định ''cũng chẳng mất mát gì''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu đáp nhận lệnh ngắn gọn ''Rõ.''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nội tâm tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001 (''Những người lính của mình'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: nội tâm tự quy chiếu của Tanya dùng
    ''mình'' theo DEC-P01-001; giữ trạng thái khẳng định đi kèm phủ định ''Chắc chắn
    họ không hề nghi ngờ''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tên riêng: giữ nguyên tên ''Tanya'' trong câu so sánh
    khách quan hóa bản thân."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000531
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & nhấn mạnh Markdown: chỉ bọc ''*Phù.*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Tanya trong trần thuật bằng
    ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000532
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & phủ định: Tanya tự xưng ''Tôi'' trong thoại; giữ
    câu phủ định bày tỏ thái độ ''Tôi chẳng thể nào ưa nổi kiểu cứng cáp như thế''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000533
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, phủ định & thuật ngữ: nội tâm tự quy chiếu
    của Tanya dùng ''mình'' theo DEC-P01-001 và dùng ''bạn'' cho chủ thể khái quát;
    ''Republican Army'' -> ''Quân đội Cộng hòa''; ''Named'' -> ''Pháp sư Định danh'';
    ''Rhine front'' -> ''mặt trận Rhine''; ''Federation’s new model'' -> ''mẫu mới
    của Liên bang''; ''defensive shell'' -> ''lớp vỏ phòng thủ''; giữ phủ định so
    sánh ''Ngay cả... cũng không bền bỉ đến mức đó''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000534
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu nhận xét của Visha với chủ ngữ khái quát ''khiến
    người ta bất an'', không tự thêm đại từ xưng hô khi nguồn không nêu."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000535
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại & thuật ngữ: ''adjutant'' -> ''viên sĩ quan
    phụ tá''; quy chiếu tên ''Tanya''; dùng ''chúng ta'' trong thoại của Tanya; ''defensive
    shells'' -> ''những lớp vỏ phòng thủ''; giữ quan hệ thời gian ''trước khi súng
    của mình kịp xuyên thủng''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000536
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & nhân quả: quy chiếu Tanya bằng ''Nó'' theo
    DEC-P01-001; giữ quan hệ nhân quả ''Vì chúng quá chắc chắn nên phải mất nhiều
    thời gian mới bắn hạ nổi''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000537
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, tình thái, phủ định & thuật ngữ: dùng ''chúng
    ta''; ''Federation'' -> ''Liên bang''; ''Federation mages'' -> ''đám pháp sư Liên
    bang''; giữ tình thái ''có thể là'', phủ định ''không thể làm ngơ'' và ''không
    thể chấp nhận được''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000538
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, giả định & thuật ngữ: giữ cấu trúc giả định trái thực
    tế ''mọi chuyện sẽ khác nếu...''; ''NCOs'' -> ''các hạ sĩ quan''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000539
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & thuật ngữ: dùng ''chúng ta'' (''Lính mới của chúng
    ta''); ''Federation forces'' -> ''quân Liên bang''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000540
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: ''war of attrition'' -> ''cuộc
    chiến tiêu hao''; giữ phủ định tuyệt đối ''chẳng còn lấy một chút kỷ luật nào''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000541
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ, câu hỏi nội tâm & thuật ngữ: ''The Empire''
    -> ''Đế quốc''; ''eastern front'' -> ''mặt trận phía đông''; dùng ''chúng ta''
    và giữ nguyên độ mở của câu hỏi giả định ''Nhỡ tình hình toàn cầu trở nên tồi
    tệ hơn trong lúc chúng ta đang chật vật ở đây thì sao?''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000542
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: ''Imperial Army'' -> ''Lục quân Đế quốc'';
    ''eastern front'' -> ''mặt trận phía đông''; ''Ildoa'' -> ''Ildoa''; ''General
    Staff'' -> ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000543
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, phủ định, tên riêng & quân hàm: ''the Empire'' ->
    ''Đế quốc''; ''Tanya'' -> ''Tanya''; ''Colonel von Lergen'' -> ''Đại tá von Lergen'';
    giữ cấu trúc phủ định ngoại trừ ''không còn lựa chọn nào khác ngoài việc chấp
    nhận''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000544
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, điểm nhìn, đại từ & nhấn mạnh Markdown: chỉ bọc ''*Đau
    đầu thật đấy*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; dùng ''Chúng
    ta'' và ''phe mình'' ở câu đầu, quy chiếu tên ''Tanya'' ở vế trần thuật."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000545
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề báo cáo & thuật ngữ: giữ định dạng viết hoa toàn bộ tiêu
    đề báo cáo; ''UNIFIED YEAR 1927 SPRING CONFERENCE ON COMBAT RESEARCH'' -> ''HỘI
    NGHỊ NGHIÊN CỨU TÁC CHIẾN MÙA XUÂN NĂM THỐNG NHẤT 1927''; ''NEW ENEMY ORB'' ->
    ''QUẢ CẦU MỚI CỦA ĐỊCH''; ''EASTERN FRONT'' -> ''MẶT TRẬN PHÍA ĐÔNG''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000546
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ báo cáo: người viết báo cáo của Cục Công nghệ
    tự xưng ''tôi'' (không áp dụng đại từ ''mình'' của nội tâm Tanya theo giới hạn
    tại DEC-P01-001)."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000547
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: dùng ''chúng ta'' cho phía Đế
    quốc; ''Federation'' -> ''Liên bang''; ''eastern front'' -> ''mặt trận phía đông'';
    ''test officer'' -> ''sĩ quan thử nghiệm''; giữ các vế phủ định ''Chẳng cần phải
    chờ'', ''hoàn toàn không tinh xảo bằng'', ''chẳng có khái niệm gì''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000548
  kind: terminology_and_voice
  value: 'choices=["Trích dẫn báo cáo, đại từ & thuật ngữ: ''test battalion'' -> ''tiểu
    đoàn thử nghiệm''; người phát ngôn trong trích dẫn xưng ''tôi''; ''aerial mage''
    -> ''pháp sư trên không''; ''turn radius'' -> ''bán kính vòng lượn''; ''friendlies''
    -> ''quân mình''; giữ nguyên quan hệ nhân quả và so sánh hơn kém giữa các thế
    hệ khí tài."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000549
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo: giữ quan hệ kết quả ''Do đó'' và sắc thái khẳng
    định ''kết luận không gì lay chuyển nổi''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000550
  kind: terminology_and_voice
  value: 'choices=["Trích dẫn kết luận & phủ định: giữ câu kết luận phủ định ''Mẫu
    này không phù hợp cho các hoạt động tác chiến của quân đội ta.''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000551
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo, tình thái & thuật ngữ: ''Federation’s new orb''
    -> ''quả cầu mới của Liên bang''; giữ sắc thái đánh giá dè dặt ''rất khó nói rằng
    nó vượt trội hơn'' và ''khó lòng thay đổi''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000552
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo & thuật ngữ: ''Imperial Army'' -> ''Lục quân Đế
    quốc''; ''orb'' -> ''quả cầu''; giữ sắc thái nhượng bộ ''Tuy nói vậy... cũng miễn
    cưỡng thừa nhận''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000553
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo, nhân quả & phủ định: giữ cấu trúc nhân quả phủ
    định kép ''vì không được chế tác với độ chuẩn xác cao nên chúng không đòi hỏi
    nhiều kỹ năng từ người sử dụng''; ''mass-producing'' -> ''sản xuất hàng loạt'';
    ''mass-trained soldiers'' -> ''những binh lính được huấn luyện đại trà''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000554
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo & tương phản: giữ cấu trúc nhượng bộ – tương phản
    ''Tuy có thể chậm chạp, nhưng khả năng phòng ngự mà chúng mang lại là rất cao''
    và nhận định ''khó lòng bắn hạ được''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000555
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo, thuật ngữ & nhấn mạnh Markdown: chỉ bọc ''*Kết
    luận ư?*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; ''General Staff''
    -> ''Bộ Tổng tham mưu''; ''Imperial Army'' -> ''Lục quân Đế quốc''; ''human-wave
    tactics'' -> ''chiến thuật biển người''; ''aerial mages'' -> ''các pháp sư trên
    không''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000556
  kind: terminology_and_voice
  value: 'choices=["Văn bản báo cáo & tương phản: ''numerical superiority'' -> ''ưu
    thế về quân số''; giữ phép đối lập giữa ''đội quân chất lượng hàng đầu của chúng
    ta'' và ''thứ chất lượng tàm tạm với số lượng cực lớn''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000557
  kind: terminology_and_voice
  value: 'choices=[''Văn bản báo cáo: giữ câu nhận định ngắn gọn chốt lại mức độ nghiêm
    trọng của vấn đề.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000558
  kind: terminology_and_voice
  value: 'choices=["Chữ ký/nguồn báo cáo, thuật ngữ & nhấn mạnh Markdown: bọc toàn
    bộ ''*Báo cáo về Quả cầu Tính toán Type T3476 từ Cục Công nghệ*'' trong dấu sao
    khớp thẻ em nguồn theo DEC-P01-002; ''Type T3476 Computation Orb'' -> ''Quả cầu
    Tính toán Type T3476''; ''Technology'' -> ''Cục Công nghệ''."]'
