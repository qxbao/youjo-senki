choices:
- segment_id: YS-LN07/Text/chapter020.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & điều kiện: quy chiếu Tanya trong trần thuật
    bằng ''nó'' theo DEC-P01-001; ''their victory'' -> ''chiến thắng của họ''; ''you''
    khái quát -> ''người ta''; giữ ''Liên bang'', ''lệnh ngừng bắn'' và ''các nhà
    ngoại giao''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Thoại, điều kiện & thuật ngữ: giữ ''lệnh ngừng bắn'', đại từ gộp
    ''chúng ta'' và mệnh đề điều kiện ''một khi đã là chiến tranh, người lính phải
    tiếp tục chiến đấu để giành chiến thắng''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi đuôi & đánh giá: giữ câu nhận xét của Calandro dành
    cho Tanya (''Không phải kiểu người dễ lơ là cảnh giác, nhỉ? Đó là một phẩm chất
    đáng quý đấy.'')."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: chỉ bọc câu hỏi nội tâm ''*Sao
    mình lại lơ là được chứ?*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002;
    dùng đại từ ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Phủ định, ẩn dụ & thuật ngữ: giữ phủ định ''Tanya đâu phải kẻ
    đần độn đến mức không chịu rút kinh nghiệm từ những sai lầm của mình mà để tuột
    mất chiến thắng đến hai lần'', ẩn dụ ''Học phí trả cho người thầy mang tên kinh
    nghiệm'' và thuật ngữ ''hiệu quả chi phí''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Ngạn ngữ, câu hỏi tu từ & xưng hô: dịch ''Security is the greatest
    enemy'' là ''sự chủ quan là kẻ thù lớn nhất'' nối mạch với p000062; Tanya gọi
    Calandro là ''ngài'' trong câu hỏi phủ định tu từ."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & dấu câu: Calandro xưng ''tôi'', gọi Tanya là
    ''cô''; giữ dấu gạch ngang dài trong ''Nhưng—tôi nói một lời được chứ?''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn & sắc thái lễ phép: giữ ''“Tất nhiên rồi ạ.”'' thể
    hiện thái độ lịch sự của Tanya với sĩ quan quan sát viên cấp trên."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, phủ định & đại từ trần thuật: Calandro xưng ''tôi'',
    gọi Tanya là ''cô''; giữ lời đính chính ''Không, tôi không muốn cô hiểu lầm ý
    đó đâu''; quy chiếu Calandro trong trần thuật bằng ''Ông''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: giữ ''mình'' (phản thân) và ''nó'' (trần thuật
    về Tanya theo DEC-P01-001); giữ phủ định ''nhận ra chẳng có phương án nào có lợi
    cho mình'' và ''một nụ cười lịch sự mà mơ hồ''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Châm ngôn nội tâm: giữ hai câu khẳng định ngắn gọn ''Im lặng là
    vàng. Vàng là chân lý.''; không tự thêm chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, phủ định & thuật ngữ: ''common sense'' -> ''lẽ thường'';
    ''Colonel von Degurechaff'' -> ''Trung tá von Degurechaff''; giữ phủ định ''chẳng
    ai muốn tiếp tục cuộc chiến tranh lố bịch này ở cái quy mô lố bịch như thế cả''
    và nhận định ''tình hình hiện tại là bất bình thường''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, phủ định & thuật ngữ: giữ dấu chấm lửng mở đầu thoại,
    đại từ ''Tôi''/''chúng ta'', phủ định ''hầu như chẳng có chút kinh nghiệm nào''
    và thuật ngữ ''những suy nghĩ viển vông''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc, dấu câu & câu hỏi: giữ ''Liên bang'', dấu
    chấm lửng ngắt câu, ''cánh sĩ quan cấp trung chúng ta'', đại từ trần thuật ''ông''
    quy chiếu Calandro, và câu hỏi cuối ''Cô không tin vào chiến thắng của lý trí
    sao, Trung tá?''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & tương phản: Tanya xưng ''Tôi''/''mình''; giữ
    sự phân biệt giữa ''tin vào lý trí của chính mình'', ''không thể dám chắc về những
    người khác mà mình hầu như chẳng quen biết'' và tương phản ''kỳ vọng họ sẽ hành
    xử có lý trí, nhưng để đặt niềm tin vào họ thì rất khó''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & dấu câu: ''raison d’état'' -> ''lý trí quốc
    gia'' đối lập với ''kiểu lý trí cá nhân'' (the personal sort); ''Imperial Army
    General Staff'' -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; quy chiếu Calandro bằng
    ''ông''; giữ dấu chấm lửng ngập ngừng; không dùng chữ nghiêng vì nguồn không có
    thẻ em."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, câu hỏi tu từ & tương quan thứ bậc: giữ sự đối chiếu
    cấp bậc giữa ''một đại tá'' (Calandro) và ''một trung tá quèn như tôi'' (Tanya)."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép, dấu câu & xưng hô: giữ phủ định kép ''nếu bảo rằng
    tôi không có chính kiến gì thì sẽ là nói dối'', dấu chấm lửng và dấu gạch ngang
    dài trong câu chúc mừng cuối."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Phủ định giảm nhẹ, tình thái & thuật ngữ: giữ cấu trúc ''ngay
    cả khi chiến thắng dứt khoát của Lục quân Đế quốc không phải là tin tức tồi tệ,
    thì cũng khó mà gọi đó là tin tốt lành được'', tình thái ''hẳn là'' và danh xưng
    ''một quân nhân đến từ Ildoa''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thuật ngữ: giữ cặp dấu gạch ngang dài ''—kể cả khi hành
    xử như vậy—'' và quan hệ ''Ildoa... và Đế quốc vẫn là các quốc gia đồng minh''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Thoại phủ định quá khứ: giữ lời thú nhận của Calandro ''“Thẳng
    thắn mà nói, tôi chỉ là đã không nghĩ chuyện này sẽ xảy ra.”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*Thú vị đấy.*''
    trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Tanya bằng ''Nó''
    theo DEC-P01-001; giữ ''Ildoa'' và ''Bộ Tổng tham mưu Ildoa'' trong câu hỏi thăm
    dò."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & xưng hô: chỉ bọc ''*Nein*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; Calandro xưng ''tôi''/''chúng tôi'',
    gọi Tanya là ''cô''; giữ phủ định nhấn mạnh ''Tôi không mảy may nghi ngờ chiến
    thắng của đồng minh chúng tôi dù chỉ một phút''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & đánh giá: giữ lời đáp lịch sự ''“Được thôi ạ,”''
    của Tanya, đại từ ''ông'' quy chiếu Calandro và nhận định ''mấy người này cũng
    là những người biết điều''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & phủ định: giữ câu hỏi suy luận ''Vậy là họ đã
    không chắc liệu Đế quốc có thể làm nên chuyện hay không ư?'' không bọc dấu sao
    vì nguồn không có thẻ em."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: chỉ bọc ''*Chà, đó là
    mức độ dè chừng hợp lý thôi*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002;
    giữ ''Lục quân Đế quốc'', phủ định ''hoàn toàn không đảm bảo cho một chiến thắng
    ở quy mô thế này'' và phủ định ''chẳng thể nói rằng họ đã đưa ra những giả định
    thiếu suy nghĩ rồi rốt cuộc bị thực tế chứng minh là sai lầm''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn & sắc thái: giữ câu hỏi lửng lịch sự ''“Ít
    nhất là trên mặt chính thức phải không ạ?”''."]'
