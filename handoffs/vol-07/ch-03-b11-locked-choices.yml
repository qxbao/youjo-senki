segment_id_end: YS-LN07/Text/chapter012.xhtml/p000064
choices:
- segment_id: YS-LN07/Text/chapter012.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, sắc thái & cấp bậc: giữ dấu chấm lửng đầu câu, giọng
    nhận xét hàm ý mỉa mai của Calandro và danh xưng ''Trung tá von Degurechaff''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ trần thuật & phủ định: chỉ bọc dấu
    sao chính xác cho ''*Các điều ước không áp dụng*'' theo DEC-P01-002; trần thuật
    gọi Tanya là ''Nó'' theo DEC-P01-001; trong thoại Tanya xưng ''tôi'' / ''chúng
    ta'' / ''chúng tôi'' kèm kính ngữ ''ạ''; giữ các phủ định ''chưa từng ngờ rằng'',
    ''không áp dụng'', ''chẳng có mấy đội quân nào'' và thuật ngữ ''luật pháp quốc
    tế'', ''quân quy''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Liên kết từ vựng & xưng hô: giữ dấu chấm lửng, đại từ ''cô'' và
    cụm ''tuân thủ pháp luật'' khớp với p000037."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, nhân quả & tình thái: giữ chuẩn ''Kampfgruppe'', ''Bộ
    Tổng tham mưu'', ''tiểu đoàn pháp sư trên không''; giữ sắc thái nhượng bộ ''Dẫu
    chỉ là trên danh nghĩa'', phỏng đoán ''có lẽ'' và quan hệ nhân quả ''Vì... nên...''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định kép & đại từ trần thuật: bọc dấu
    sao đúng phạm vi vế đầu theo DEC-P01-002; giữ phủ định kép ''Không thể nào đánh
    trận mà không có căn cứ bào chữa về mặt pháp lý được''; gọi Tanya là ''nó'' và
    Calandro là ''ông'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: gọi Tanya là ''nó'' / ''mình''
    theo DEC-P01-001; giữ mức suy đoán ''hẳn đã để lại ấn tượng'' và tên riêng ''Calandro'',
    ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & thuật ngữ: Tanya xưng ''Tôi'' / ''Chúng
    ta'', gọi chung các sĩ quan là ''các vị'' và gọi riêng ''Đại úy Meybert'' là ''anh'';
    trần thuật gọi Tanya là ''Nó'' và Meybert là ''anh''; giữ chuẩn ''các pháp sư
    trên không''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & dấu câu: Meybert xưng ''tôi'', gọi Tanya là
    ''thưa Trung tá'' / ''Trung tá'' kèm ''ạ''; giữ hai dấu chấm lửng ngập ngừng khi
    trình bày ''Kế hoạch tác chiến''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thuật ngữ: gọi Meybert là ''Anh'' và giữ thuật
    ngữ ''pháo kích''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, điều kiện & tình thái: không bọc dấu sao vì
    nguồn không in nghiêng theo DEC-P01-002; dùng ''chúng ta'' trong độc thoại nội
    tâm của Tanya; giữ điều kiện ''nếu quân địch cố thủ bên trong'', hai dấu chấm
    lửng và mức phỏng đoán ''xem chừng là''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & tình thái: giữ ''các lô cốt bê tông'', dấu
    gạch ngang dài và mức phỏng đoán ''có lẽ còn hiệu quả hơn''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại, đại từ trần thuật & phủ định: Tanya xưng ''tôi'',
    trần thuật gọi ''nó'' / ''mình'' theo DEC-P01-001; giữ phủ định ''Không cần phải
    màu mè làm gì'' và thuật ngữ ''kế hoạch tác chiến'', ''các hỏa điểm''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: chỉ bọc dấu sao chính
    xác cho câu đầu ''*Pháo binh cày xới, rồi bộ binh tiến lên.*'' theo DEC-P01-002;
    giữ phủ định ''vẫn không hề thay đổi'' và thuật ngữ ''Chiến tranh không giới hạn''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tình thái & thuật ngữ: Tanya dùng ''chúng ta'' / ''ta''
    và ''tôi''; giữ chuẩn ''Đại úy Meybert'', ''các pháp sư quan sát'', mức độ ''có
    lẽ'' và mục đích ''tạo ra càng ít mảnh vỡ đổ nát càng tốt''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tên riêng & đối lập: Weiss xưng ''tôi'' kèm ''ạ'', giữ
    chuẩn ''Trung úy Grantz'' đối lập với ''Trung úy Wüstemann'' và dấu chấm lửng
    cuối câu."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & câu hỏi: Tanya gọi Weiss là ''anh'' / ''Thiếu
    tá'', gọi ''Trung úy Tospan'' là ''anh''; giữ chuẩn ''Trung úy Grantz'', ''Trung
    úy Wüstemann'' và câu hỏi giao việc trực tiếp."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thuật ngữ: gọi Tanya là ''Nó'' theo DEC-P01-001;
    giữ tên ''Tospan'', cụm ''gã trai vô tư lự này'' và ''Kampfgruppe''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, điều kiện & dấu câu: Tospan gọi Tanya là ''Trung tá'',
    xưng ''chúng tôi''; giữ cấu trúc điều kiện ''Nếu đó là lệnh của Trung tá'' và
    vế bỏ lửng ''nhưng gấp gáp thế này thì…''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, đối lập & điều kiện: không bọc dấu sao theo
    DEC-P01-002; gọi Tospan là ''anh ta''; giữ tương phản ''Một Tospan biết nói không''
    với ''một Tospan cứ nhắm mắt gật đầu trước điều bất khả thi'', điều kiện ''Nếu
    có thể nhận ra điều mình không làm nổi'' và ẩn dụ ''bánh răng ăn khớp trong bộ
    máy''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Điều kiện phủ định, chủ thể giả định & thuật ngữ: dùng ''bạn''
    cho chủ thể giả định chung trong câu điều kiện phủ định ''Nếu bạn không ghi nhận...'';
    giữ tên ''Tanya'' và thuật ngữ ''phát triển nhân sự''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: chỉ bọc dấu sao chính xác
    cho câu đầu theo DEC-P01-002; dùng ''mình'' cho tự quy chiếu của Tanya trong nội
    tâm theo DEC-P01-001 và giữ tên ''Tanya'' ở vế trần thuật."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & thuật ngữ: Tanya gọi ''Thiếu tá Weiss'' là
    ''anh'', dùng ''chúng ta''; giữ chuẩn ''quan sát trực tiếp'' và ''đại đội''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định: giữ câu đáp ngắn gọn lễ phép ''Không vấn
    đề gì ạ.'' của Weiss."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, cấp bậc & phân công tác chiến: giữ chuẩn ''Trung úy Wüstemann'',
    ''Trung úy Grantz'', ''Đại úy Ahrens'', ''hỏa lực dự bị'', ''bộ binh'', ''đơn
    vị thiết giáp'' và ''đợt xung phong''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & giọng thoại: giữ ba lớp dấu ngoặc kép ''“““Rõ!”””''
    biểu thị ba sĩ quan đồng thanh đáp lệnh."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, xưng hô & mệnh lệnh phủ định: gọi Tanya là
    ''Nó'' theo DEC-P01-001; trong thoại Tanya dùng ''tôi'' / ''chúng tôi'' / ''chúng
    ta'' và gọi các sĩ quan là ''Các vị''; giữ chuẩn ''lực lượng dự bị'' và mệnh lệnh
    cấm đoán ''Các vị chớ có để quân địch chọc thủng phòng tuyến đấy''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & sắc thái: bọc dấu sao toàn bộ câu
    theo DEC-P01-002; dùng đại từ ''Tôi'' để diễn đạt lời viện cớ mang tính phát ngôn
    chính thức (''lời tuyên bố sáo rỗng'' được nhắc ở p000063); giữ chuẩn ''Đại tá
    Calandro'' và phủ định ''nên tôi không thể ra tiền tuyến được''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, giả định & phủ định: không bọc dấu sao theo
    DEC-P01-002; dùng ''mình'' cho tự quy chiếu của Tanya theo DEC-P01-001; giữ cặp
    dấu gạch ngang dài đính chính ''tác dụng phụ—hay đúng hơn là rắc rối—'' và mục
    đích phủ định ''để làm cái cớ khỏi phải ra tiền tuyến''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, giả định & dấu câu: giữ dấu chấm lửng đầu
    đoạn; chỉ bọc dấu sao chính xác cho ''*thực sự*'' theo DEC-P01-002; giữ câu hỏi
    giả định ''nhỡ có chuyện gì đó *thực sự* xảy đến với Calandro thì sao?'' và hệ
    quả giả định về tiền đồ của Tanya."]'
