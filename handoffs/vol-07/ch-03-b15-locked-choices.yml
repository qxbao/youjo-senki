  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; ''The higher-ups'' -> ''Cấp trên''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Tanya bằng ''Nó'', các sĩ quan thuộc
    ''Kampfgruppe'' bằng ''họ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm & thuật ngữ: chỉ bọc ''*đáng ngạc
    nhiên thay*'' khớp thẻ em nguồn theo DEC-P01-002; ''aerial mage battalion'' ->
    ''tiểu đoàn pháp sư trên không''; ''home country'' -> ''bản quốc''; ''Hai Đại
    úy Meybert và Ahrens cùng Trung úy Wüstemann''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi & quân hàm: giữ câu hỏi nhận định về ''Trung úy Tospan''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu ngắt câu: Tospan xưng ''tôi'' / ''chúng ta'', có
    từ kính ngữ ''ạ''; giữ dấu gạch ngang lửng câu ''Tôi không thấy có lý do gì phải—''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya xưng ''tôi'', gọi ''Trung úy Tospan''
    là ''anh''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & câu hỏi phản vấn: Tospan dùng ''Chúng ta''
    / ''mình'' (ngôi thứ nhất số nhiều bao gộp trong thoại) và ''Tôi'', gọi địch là
    ''quân địch'' / ''chúng''; giữ câu hỏi phản vấn với ''Chẳng phải tình huống tệ
    nhất là... hay sao ạ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trong thoại Tanya gọi ''Trung úy Tospan''
    là ''Anh''; trong trần thuật quy chiếu Tanya bằng ''nó'' và Tospan bằng ''anh
    ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & câu hỏi phản vấn: ''Yes, Colonel'' -> ''Vâng,
    thưa Trung tá''; ''front lines'' -> ''tiền tuyến''; ''foothold'' -> ''bàn đạp'';
    ''encounter battle'' -> ''trận tao ngộ chiến''; ''Federation Army'' -> ''Quân
    đội Liên bang''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: bọc chính xác ''*Chà!*'' khớp thẻ
    em nguồn theo DEC-P01-002; trần thuật quy chiếu Tanya bằng ''nó'' và Tospan bằng
    ''anh ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tanya bằng ''nó'', Tospan bằng ''anh
    ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ tình thái ''có lẽ đúng là trông như vậy thật''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đại từ khái quát: trong thoại Tospan hỏi ''Ý Trung tá
    là…?''; trong trần thuật quy chiếu Tospan bằng ''anh ta'' và chủ thể giả định
    chung bằng ''bạn''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: quy chiếu Tospan bằng ''anh ta'', giữ tên ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & không tự thêm chữ nghiêng: độc thoại nội tâm
    ngôi thứ nhất của Tanya dùng đại từ tự quy chiếu ''mình'' theo DEC-P01-001; không
    bọc chữ nghiêng vì nguồn không có thẻ nhấn mạnh theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & đối lập khái niệm: Tanya gọi Tospan là ''Anh''; giữ
    đối lập ''không gian hai chiều cổ điển'' và ''tác chiến ba chiều''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ ''Hả?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quân hàm: ''aerial mage'' -> ''pháp sư trên không'';
    ''Major Weiss'' -> ''Thiếu tá Weiss''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới: giữ câu đáp của Weiss có ''ạ'' cuối câu (''Chúng
    đan cài vào nhau quá mức rối rắm ạ.'')."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & đại từ: ''magic officers'' -> ''sĩ quan
    ma pháp''; quy chiếu Meybert và Ahrens bằng ''họ'', Tospan bằng ''anh ta''; giữ
    tình thái suy luận ''hẳn có nghĩa là''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ & đại từ: giữ cấu trúc nhượng bộ ''cho dù anh ta không
    thể nghe một hiểu mười đi chăng nữa, thì cũng còn quá sớm để trách cứ anh ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & chú thích: giữ ''Nguyên lý Peter⁶''
    kèm số chú thích; dùng đại từ nội tâm ''mình'' cho Tanya và ''anh ta'' cho Tospan
    theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Xưng hô thoại: Tanya gọi Tospan là ''anh'', dùng ''chúng ta''
    và gọi quân địch là ''bọn chúng''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: ''Yes, ma’am'' -> ''Vâng, thưa Trung tá'';
    Tospan xưng ''tôi''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Đại từ, giả định & thuật ngữ: trong thoại Tanya xưng ''tôi'' -
    ''anh'' và gọi ''Trung úy''; trong trần thuật quy chiếu Tanya bằng ''Nó''; ''artillery
    support'' -> ''pháo binh chi viện''; ''the artilleryman'' -> ''vị sĩ quan pháo
    binh''; giữ đầy đủ chuỗi giả định và câu hỏi đuôi."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Phủ định, điều kiện & quân hàm: Meybert xưng ''chúng tôi'', nhắc
    tới ''Trung úy Tospan''; lược bỏ cụm tự thêm ''bảo đảm an toàn'' theo finding
    để giữ nguyên nét hàm ngôn khô khan của câu thoại."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & tên gọi: ''Captain Meybert'' -> ''Đại úy Meybert''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: dùng ''bạn'' cho câu giả định chung
    và ''chúng ta'' ở câu kết; chỉ bọc ''*đúng là*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''bombardment'' -> ''Pháo kích''; ''HQ'' -> ''sở chỉ
    huy''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Thoại đứt quãng: giữ nguyên cấu trúc cảm thán đứt quãng ''Quân
    địch tấn công ư?! Thật là—!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & sắc thái: bọc câu hỏi đầu đoạn bằng ''*...*''
