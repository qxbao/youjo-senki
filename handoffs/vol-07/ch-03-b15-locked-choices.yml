    này?*'' theo finding; giữ lời hét của Meybert."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Meybert bằng ''anh ta''; ''the rear''
    -> ''phía hậu phương''; giữ câu phủ định cảm thán ''Không thể có chuyện đó được!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc câu thứ hai ''*Chẳng lẽ
