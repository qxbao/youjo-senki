choices:
- segment_id: YS-LN07/Text/chapter006.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề trích lục & nhấn mạnh Markdown: giữ viết hoa toàn bộ;
    chỉ bọc ''*GHI CHÉP VỀ MẶT TRẬN PHÍA ĐÔNG*'' trong dấu sao khớp với thẻ em nguồn
    theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & ẩn dụ: ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen'';
    ''eastern front'' -> ''mặt trận phía đông''; giữ hình ảnh ''một bóng ma trên mặt
    trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Tình thái & phủ định kép: giữ tình thái dè dặt ''đều dường như
    cho thấy đơn vị này trên thực tế quả thực có tồn tại'' và phủ định kép ''Hiếm
    có ai... mà lại không biết đến cái tên ấy''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhịp liệt kê: giữ tên ba phe ''Đế quốc, Liên bang
    và thậm chí cả Khối Thịnh vượng chung'', định danh ''Kampfgruppe Lergen lừng lẫy''
    và chuỗi ba cụm danh từ ca ngợi chiến công."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Sắc thái & nhấn mạnh: giữ cụm rào đón ''Dù nói ra có phần khiếm
    nhã'', cấu trúc khẳng định duy nhất ''Họ và chỉ riêng họ'' và nhịp chuyển ''những
    người hùng—hoặc nói một cách thi vị hơn: những huyền thoại''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Tình thái & nghịch lý: giữ giả định ''Hầu hết mọi người hẳn sẽ
    kỳ vọng...'', câu phủ định chuyển ý ''Thế nhưng chuyện đó đã không xảy ra.'' và
    vế đối lập ''Ai cũng biết đến họ, vậy mà chẳng một ai thực sự biết về họ.''"]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & tình thái: giữ phủ định ''cũng chẳng dám
    chắc sự thật là gì'', tình thái khẳng định ''chắc chắn là'' và thuật ngữ ''tốc
    độ tiêu hao cực kỳ khủng khiếp trên mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''order of battle'' -> ''biên chế tác chiến'';
    giữ phủ định gần như tuyệt đối ''hầu như không có đơn vị nào trụ lại được'' và
    đối lập ''Trên giấy tờ, cả Kampfgruppe đã bị xóa sổ ngoại trừ một nhúm nhỏ những
    người sống sót''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu nhận xét ngắn ''Chuyện đó chẳng có gì lạ trên
    mặt trận phía đông.''"]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Phủ định & ẩn dụ: giữ cặp phủ định ''Không thể phủ nhận là vô
    cùng thảm khốc, nhưng điều đó không phải ngoại lệ'' và hình ảnh ẩn dụ mặt trận
    phía đông ''vốn dĩ là một con quái vật như thế''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: tác giả Baxter tự xưng ''tôi'',
    gọi người cựu binh là ''Ông ta'' (trong thoại cựu binh xưng ''Tôi''); ''armored
    units'' -> ''các đơn vị thiết giáp''; ''aerial mages'' -> ''các pháp sư trên không'';
    giữ chuỗi miêu tả tuần tự từ bánh xích xe tăng đến pháp sư trên không và máy bay."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: chỉ bọc từ ''*bất thường*'' trong dấu sao
    khớp với thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & quân hàm: giữ phủ định kép ''Không phải là không
    có tư liệu ghi chép nào''; khóa cách dịch ''Đại tá (vào thời điểm đó) von Lergen''
    và ''sĩ quan tham mưu''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: quy chiếu Lergen bằng ''Ông''; ''General Staff''
    -> ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Ẩn dụ & quan hệ nhân quả: giữ cụm ''dưới trướng hai con quạ Zettour
    và Rudersdorf trong lĩnh vực tác chiến'' và kết luận ''hẳn chẳng có gì đáng ngạc
    nhiên''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & mức độ: giữ quan hệ đối lập ''Nhưng'' và mức độ ''những
    khoảng trống trọng yếu nhiều đến mức kỳ lạ''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Tình thái & đối lập: giữ tình thái ''dường như gợi mở một mối
    liên hệ sâu sắc giữa Kampfgruppe Lergen và ông'' và vế ngược lại ''nhưng bản thân
    mối liên hệ ấy lại hết sức mù mờ''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & thuật ngữ: giữ viết hoa toàn bộ ''NGÀY 22 THÁNG
    4, NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, MỘT ĐIỂM TẬP KẾT CỦA LỤC QUÂN ĐẾ QUỐC'';
    không dùng chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tình thái: bọc chính xác ''*Ngoài dự kiến*''
    khớp thẻ em nguồn theo DEC-P01-002; giữ tình thái ''có lẽ là'' và dấu chấm lửng
    cuối câu."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & thời gian: ''203rd Aerial Mage Battalion'' -> ''Tiểu
    đoàn Pháp sư Trên không số 203''; ''Federation pursuit'' -> ''Đợt truy kích...
    của quân Liên bang''; ''designated line of retreat'' -> ''tuyến rút lui chỉ định'';
    giữ mốc thời gian ''vào đêm qua''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi nội tâm: phân biệt ''chúng tôi'' (cho
    đơn vị) và ''mình'' (Tanya tự quy chiếu trong câu hỏi nội tâm) theo DEC-P01-001;
    ''orbs'' -> ''các quả cầu''; ''ersatz coffee'' -> ''cà phê thay thế''; giữ nguyên
    độ mở của câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & nhượng bộ: ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; ''203rd Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên không
    số 203''; ''General Staff'' -> ''Bộ Tổng tham mưu''; ''strike force'' -> ''lực
    lượng xung kích''; ''depot'' -> ''kho hậu cần''; dùng ''Chúng tôi'' cho đơn vị
    và giữ mệnh đề nhượng bộ ''dù làm vậy sẽ trái với quy trình tác chiến tiêu chuẩn''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & so sánh: giữ tên riêng ''Tanya'' ở câu trần thuật
    và mức độ so sánh ''nhanh hơn nhiều so với những gì Tanya hằng mong đợi''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm & đại từ: ''Captain Ahrens'' -> ''Đại úy Ahrens'';
    tự xưng ''Chúng tôi'' khi báo cáo hội quân với lực lượng chủ lực."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái suy đoán: ''armored officer'' ->
    ''Viên sĩ quan thiết giáp''; ''crumpled crusher cap'' -> ''chiếc mũ mềm bẹp chóp'';
    ''tank man'' -> ''người lính xe tăng''; quy chiếu Ahrens bằng ''anh ta'', đối
    chiếu với ''Tanya'' và giữ tình thái suy đoán quá khứ ''hẳn anh ta đã có một chuyến
    đi dễ chịu hơn nhiều''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ chuyển ý: giữ liên từ ''Nhưng'', đại từ ''anh
    ta'' quy chiếu Đại úy Ahrens và nhận định ''cũng đủ khiến mọi chuyện đều có thể
    tha thứ được''."]'
