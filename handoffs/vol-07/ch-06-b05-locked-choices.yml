- segment_id: YS-LN07/Text/chapter022.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi tu từ & xưng hô: Zettour gọi nhóm quan chức là ''Các
    vị'', dùng ''chúng ta''; giữ đối lập giữa ''suy thoái từ từ'' (''gentle decline'')
    và ''cảnh bần cùng'' (''poverty'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ tài chính: ''the officer of the Ministry
    of the Treasury'' -> ''vị quan chức Bộ Ngân khố''; gọi Zettour là ''Ngài'', xưng
    ''Chúng ta''; ''credit in bonds'' -> ''nợ tín dụng dưới dạng trái phiếu''; ''scraps
    of paper'' -> ''những mẩu giấy vụn''; ''government bonds'' -> ''trái phiếu chính
    phủ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & giả định: chỉ bọc ''*Các người
    nói thật đấy à?*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; quy chiếu
    Zettour bằng ''ông'', nhóm quan chức bằng ''họ''; giữ dấu chấm lửng giữa câu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: Zettour xưng ''Tôi'' - ''chúng ta''; giữ nhất
    quán ''scraps of paper'' -> ''những mẩu giấy vụn'' với p000150."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quân hàm: ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour'', quy chiếu bằng ''ông''; ''military man'' -> ''quân nhân''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: giữ dấu chấm lửng đầu câu; quy chiếu Zettour
    bằng ''Ông'' và những người lính/lớp thanh niên bằng ''họ''; giữ phủ định ''sẽ
    không cho phép bất cứ thứ gì được đặt lên trên họ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Thoại mỉa mai, xưng hô & thuật ngữ: quan chức gọi Zettour là ''Ngài'';
    ''the mint'' -> ''xưởng đúc tiền''; ''denomination of marks'' -> ''đồng mark có
    mệnh giá bao nhiêu''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & thuật ngữ: Zettour dùng ''Chúng ta'' - ''mình'';
    ''inflation'' -> ''lạm phát''; ''the Reich'' -> ''Đế quốc''; giữ tình thái nhượng
    bộ ''có thể suy thoái vì lạm phát, nhưng thế vẫn còn tốt hơn là...''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Thoại phủ định: giữ phủ định kép hai đối tượng ''Cả hai thứ đó
    đều không được phép lâm vào cảnh ngàn cân treo sợi tóc!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: quy chiếu Zettour bằng ''ông''; giữ sắc thái ''đầy
    vẻ van nài''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & độc thoại nội tâm: bọc toàn bộ câu ''*…Liệu
