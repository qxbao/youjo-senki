    sao khớp thẻ em nguồn theo DEC-P01-002; ''imperial family'' -> ''hoàng tộc'';
    ''subject of the Empire'' -> ''thần dân nào của Đế quốc''; giữ cấu trúc phủ định
    kép ở cả câu nội tâm đầu đoạn và câu kết đoạn."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & câu hỏi nội tâm: chỉ bọc câu thứ hai ''*Bọn
    họ bảo không được để những hy sinh ấy trở nên vô nghĩa, nhưng rồi lại đòi tiếp
    tục chiến đấu dù biết rõ rằng làm vậy sẽ kéo theo nhiều sự hy sinh hơn nữa ư?*''
    trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ quan hệ đối lập và nhân
    quả."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Thoại & điều kiện: giữ đại từ ''chúng ta''; ''better terms'' ->
