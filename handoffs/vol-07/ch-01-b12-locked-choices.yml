    cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000448
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & trần thuật: ''heavy-artillery fire'' -> ''hỏa lực
    trọng pháo''; giữ tên ''Tanya'' và trạng thái ''bất giác hét lên''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000449
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ nhịp lặp nhấn mạnh ''Quá sớm! Chuyện này diễn
