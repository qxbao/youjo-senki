- segment_id: YS-LN07/Text/chapter002.xhtml/p000454
  kind: terminology_and_voice
  value: 'choices=["Nội tâm ngắn: giữ nhận định giả định ''Chuyện đó thật nực cười.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000455
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ nhận định ''Hầu hết mọi người sẽ gọi đây là sự
