    sống của mình phụ thuộc vào...'' và phủ định ''chẳng thực sự có vật liệu hay công
    cụ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000452
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm: giữ ''Vậy chúng tôi phải làm gì đây?''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000453
  kind: terminology_and_voice
  value: 'choices=["Phủ định & nhấn mạnh Markdown: giữ câu hỏi phủ định và chỉ bọc
