choices:
- segment_id: YS-LN07/Text/chapter014.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Phủ định & trần thuật: giữ ''Lergen quả thực không thể nhượng
    bộ''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi, điều kiện & xưng hô: Gassman gọi phía Đế quốc là
    ''các ngài'', xưng ''chúng tôi'' (Ildoa); giữ dấu chấm lửng và ''thu xếp ổn thỏa
    với phía Liên bang gần như ngay lập tức''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, xưng hô & sắc thái khiêm nhường ngoại giao: ''General''
    -> ''Thưa Tướng quân''; ''a mere colonel'' -> ''một đại tá quèn như tôi''; Lergen
    xưng ''tôi'', gọi Gassman là ''ngài''; giữ ''tôi vẫn buộc phải từ chối. Mong ngài
    lượng thứ cho''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Gassman xưng ''Tôi'', gọi Lergen là ''ngài'';
    giữ ''hiểu cho thiện chí của nước đồng minh''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Thoại phủ định & đại từ: Lergen đại diện Đế quốc xưng ''chúng
    tôi''; giữ phủ định lịch sự ''Chỉ đơn giản là chúng tôi sẽ không đón nhận thiện
    chí ấy''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, câu hỏi & đại từ: giữ dấu chấm lửng mở đầu, phân biệt
    ''chúng ta'' (hai bên), ''Tôi'' (Gassman), ''các ngài'' (Đế quốc) và ''Ngài''
    (Lergen); giữ chuỗi câu hỏi thăm dò giới hạn yêu sách."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc nhấn mạnh: ''reparations'' -> ''bồi thường
    chiến phí''; ''The Empire'' -> ''Đế quốc''; ''peace of mind'' -> ''sự an tâm'';
    giữ dấu hai chấm dẫn vào mệnh đề cốt lõi."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Sự an tâm ư?”'' khớp trực tiếp với
    p000039."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, bị động & phủ định: giữ dấu gạch ngang dài giải thích
    và mệnh đề phủ định bị động ''—rằng chúng tôi sẽ không bị tấn công thêm lần nào
    nữa''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & trần thuật: ''Strategic sneak attacks'' -> ''Những
    cuộc đánh lén cấp chiến lược''; ''geopolitical circumstances'' -> ''hoàn cảnh
    địa chính trị''; quy chiếu Đế quốc bằng ''họ''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ quyết tâm: ''The Imperial Army General Staff''
    -> ''Bộ Tổng tham mưu Lục quân Đế quốc''; giữ ''muốn được giải thoát khỏi nỗi
    kinh hoàng đó bằng bất cứ giá nào''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & tình thái bắt buộc: giữ dấu chấm lửng mở đầu và ''Hòa
    bình phải đồng nghĩa với việc chấm dứt nỗi sợ hãi''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cấu trúc điều kiện: ''the General Staff'' -> ''Bộ
    Tổng tham mưu''; giữ cấu trúc song hành ''dù có hay không có bồi thường chiến
    phí, và dù có hay không có việc cắt nhượng lãnh thổ''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thuật ngữ: giữ dấu chấm lửng mở đầu câu hỏi và ''Sự
    an toàn tuyệt đối cho môi trường chiến lược của Đế quốc sao?''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, cấu trúc tăng tiến & phủ định: chỉ bọc ''*Không
    đời nào*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ cấu trúc ''không
    chỉ nằm ở bài toán nan giải... mà còn ở thực tế là chỉ vì... không có nghĩa là...''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & trần thuật: giữ ''môi trường chiến lược an toàn'',
    ''mang tính có lợi một chiều quá mức'' và ''Ngay cả Bộ Tổng tham mưu cũng sẽ thừa
    nhận điều đó''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & phủ định: giữ dấu chấm lửng mở đầu đoạn, sự đối lập
    của ''dư luận tại Đế quốc'' và câu phủ định ''Bất cứ thứ gì kém hơn mức đó, công
    chúng Đế quốc đều sẽ không chấp nhận''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Thoại & nhân quả: giữ ''“Đó chính là lý do tôi đệ trình yêu cầu
    này.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: giữ ''quá đáng'' khớp với p000052 và
    đại từ ''ngài''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc song hành & câu hỏi phản biện: giữ ba vế ''giải quyết
    xong phía tây, xử lý gọn phía bắc và dọn dẹp sạch phía nam'', ''Mối đe dọa duy
    nhất còn sót lại nằm ở phía đông'', ''một đòi hỏi tối thiểu'' và câu hỏi cuối
    ''Sao ngài lại cho rằng như thế là quá đáng?''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & điều kiện giả định: quy chiếu Lergen bằng
    ''anh'', Đế quốc bằng ''họ''/''mình''; ''cease-fire'' -> ''lệnh ngừng bắn''; giữ
    ''lằn ranh không thể bước qua'' và nỗi sợ bị cuốn vào ''một cuộc chiến ngu xuẩn
    khác''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: chỉ bọc ''*khuôn khổ hòa bình chung
    cuộc và vĩnh viễn*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ ''kiên
    quyết giữ vững lập trường không khoan nhượng rằng họ sẽ không nhượng bộ''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & sắc thái: Gassman gọi ''Đại tá von Lergen'',
    phân biệt ''các ngài'' (Đế quốc) và ''ngài'' (Lergen); giữ ''Với tư cách là đồng
    minh của các ngài, Ildoa cảm thấy buộc phải cảnh báo ngài''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Thoại phủ định ngắn: giữ ''“Ngài không cần phải lo lắng.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & thuật ngữ: giữ ''quân đội của các ngài đang chịu
    sức ép từ quân đội Liên bang sao?''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, thuật ngữ, phủ định tương phản & câu hỏi: giữ dấu chấm
    lửng mở đầu, ''Lục quân Đế quốc đang chiến đấu trên lãnh thổ địch, chứ không phải
    trên đất của chúng tôi'' và câu hỏi ''ngài có thể hiểu được bên nào đang chiếm
    ưu thế chứ?''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thành ngữ ngoại giao: quy chiếu Lergen bằng
    ''anh''/''mình'', Đế quốc bằng ''họ''; giữ ''khẳng định rằng họ không hề thua''
    và hình ảnh ''một kẻ nói dối trung thực''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc & xưng hô: ''logistics'' -> ''hậu cần''; ''Colonel''
    -> ''Đại tá''; ''rate of attrition'' -> ''tốc độ tiêu hao''; giữ phủ định ''ngay
    cả Đế quốc cũng chẳng thể tiến quân mãi được'' và lời khuyên ưu tiên ''việc sớm
    đạt được một thỏa thuận dàn xếp''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, tình thái & đại từ: giữ dấu chấm lửng giữa câu, tình
    thái nhượng bộ ''có thể ngài nói đúng'' và ''chúng tôi biết mình chỉ còn cách
    chiến thắng một bước chân nữa thôi''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc, dấu câu & tình thái phủ định: giữ ''Đại tá'', dấu chấm
    lửng, đại từ ''tôi''/''ngài''/''các ngài'' và ''có lẽ không phải là thế giới mà
    các ngài hằng mong đợi đâu''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Điển tích & câu hỏi nội tâm: giữ hình ảnh ''niềm hy vọng vẫn còn
    nằm lại dưới đáy chiếc hộp Pandora'' và hai câu hỏi liên tưởng thí nghiệm con
    mèo (''Nhưng rốt cuộc đã có ai hé mắt nhìn vào và kiểm tra chưa? Có mở ra xem
    thì mới biết con mèo còn sống hay đã chết chứ, đúng không?'')."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc thoại ngắt quãng, dấu câu & thuật ngữ: giữ ''“Có lẽ là
    không. Nhưng,” Lergen tiếp lời với một nụ cười nhợt nhạt'', dấu gạch ngang dài
    và ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, câu hỏi & thuật ngữ: giữ dấu chấm lửng mở đầu, phân biệt
    ''ngài'' và ''các ngài''/''mình'', ''counterattack'' -> ''cuộc phản công''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thoại khẳng định: giữ ''“Đương nhiên, chúng tôi đã chuẩn bị sẵn
    sàng.”''."]'
- segment_id: YS-LN07/Text/chapter014.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & dấu câu: giữ ''Đại tá von Lergen'', ''Tướng
    Gassman'', dấu chấm phẩy và đại từ ''ông'' quy chiếu Gassman."]'
