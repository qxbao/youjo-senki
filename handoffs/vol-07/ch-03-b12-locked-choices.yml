- segment_id: YS-LN07/Text/chapter012.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: giữ xưng hô ''Tôi'' - ''ngài'' và câu hỏi lịch
    sự ''Ngài không phiền chứ ạ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi điều kiện: giữ nguyên cấu trúc giả định ''…Nếu tôi tìm
    thấy gì đó, vậy có nghĩa là đợt pháo kích sẽ được hủy bỏ sao?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Phủ định & điều kiện: giữ phủ định tuyệt đối ''Tôi sẽ không bao
    giờ ra lệnh cho cấp dưới của mình nổ súng vào một nơi thờ tự khi đã biết rõ điều
    đó'' và lời khẳng định với ''ngài''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nhượng bộ & thuật ngữ: quy chiếu Tanya bằng ''Nó'', Calandro
    bằng ''ông'' / ''người này''; lược bỏ ''lấy lệ'' theo finding (''Nó chẳng hề nói
    dối hay gì cả''); giữ cấu trúc nhượng bộ ''Ngay cả khi người này không đủ trung
    lập để được coi là một bên thứ ba'' và đối lập ''một quân nhân không thuộc Đế
    quốc''."]'
