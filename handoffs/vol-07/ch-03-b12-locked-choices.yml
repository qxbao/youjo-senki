- segment_id: YS-LN07/Text/chapter012.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & câu hỏi tu từ: chỉ bọc ''*trong
    lúc*'' khớp thẻ em nguồn theo DEC-P01-002; ''trench warfare'' -> ''tác chiến chiến
    hào''; quy chiếu Tospan bằng ''anh ta''; giữ câu hỏi tu từ cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001 và quy chiếu viên sĩ quan phụ tá Serebryakov bằng ''cô''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, nội tâm & thoại: bọc ''*Vậy thì nhiệm vụ trọng
    yếu của mình là…*'' và dùng đại từ nội tâm ''mình'' theo DEC-P01-001, DEC-P01-002;
