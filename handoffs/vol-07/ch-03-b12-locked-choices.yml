  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya xưng ''tôi'', gọi tập thể sĩ quan là
    ''tất cả các vị'' và gọi trực tiếp ''cô... Trung úy Serebryakov''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới: Serebryakov đáp ''Đã rõ ạ. Tôi có thể lo liệu
    được.''"]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: bọc ''*Tốt.*'' khớp thẻ em nguồn
    theo DEC-P01-002; quy chiếu Đại tá Calandro bằng ''ông''; giữ cấu trúc so sánh
    ''nằm ở quân hàm nhiều hơn là tính khí của ông''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & cấu trúc: giữ nguyên nhận định tổng quát về thời gian,
