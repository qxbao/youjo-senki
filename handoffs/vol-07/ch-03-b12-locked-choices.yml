- segment_id: YS-LN07/Text/chapter012.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhân quả: trần thuật quy chiếu Tanya bằng ''Nó'';
    giữ chi tiết ''khoảng thời gian chờ đợi hơi lỡ cỡ cho đến giờ Meybert hành động
