- segment_id: YS-LN07/Text/chapter012.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: quy chiếu Tanya bằng ''nó'' ở vế
    đầu; bọc chính xác ''*Nhưng…*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Tình thái, phủ định & thuật ngữ: giữ tình thái ''có thể đang ở
    đó'' và phủ định ''tôi đã không thấy bất kỳ biểu trưng đặc biệt nào cả''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & điểm nhìn không gian: quy chiếu Calandro là
    ''vị đại tá'', Tanya là ''nó''; sửa ''từ phần chân tháp'' thành ''từ căn cứ của
    họ'' (hoặc ''từ trận địa của họ'') theo finding; giữ phủ định ''nhưng không phát
