    nó đã là minh chứng cho sự xuất sắc''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Tình thái, đại từ khái quát & thuật ngữ: giữ tình thái ''Có lẽ
    người ta có thể nói'', hình ảnh ''công việc đòi hỏi sự lành nghề như thợ thủ công'',
    điều kiện ''chỉ có thể thực hiện trót lọt khi chỉ huy ở mọi cấp đều hiểu rõ vai
    trò của mình'' và thuật ngữ ''các hạ sĩ quan''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo: giữ câu báo cáo ngắn gọn ''Tất cả các đơn vị đã
    vào vị trí ạ.''"]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: ''her adjutant'' -> ''viên sĩ quan phụ tá'';
