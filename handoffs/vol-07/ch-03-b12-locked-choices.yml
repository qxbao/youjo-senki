- segment_id: YS-LN07/Text/chapter012.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Thoại & sắc thái: giữ tiếng cười ''…Ha-ha-ha, tốt lắm.'' và lời
    thoại của Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán nghi vấn: giữ ''Ồ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000079
