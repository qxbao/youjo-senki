- segment_id: YS-LN07/Text/chapter012.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắt lời: giữ ''Khoan đã!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi: trần thuật quy chiếu Tanya bằng ''Nó'', Calandro
    bằng ''ông''; giữ câu hỏi lịch sự ''Hửm? Tôi có nhầm lẫn ở điểm nào sao ạ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & tình thái: ''Colonel von Degurechaff'' ->
