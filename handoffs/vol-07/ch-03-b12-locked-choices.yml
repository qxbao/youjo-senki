    khi hài lòng liếc nhìn đồng hồ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & thuật ngữ: ''Lieutenant Tospan'' -> ''Trung úy Tospan'';
