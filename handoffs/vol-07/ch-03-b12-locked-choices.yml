- segment_id: YS-LN07/Text/chapter012.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu đáp ngắn gọn ''Tất nhiên rồi. Ta nói nhanh thôi.''"]'
