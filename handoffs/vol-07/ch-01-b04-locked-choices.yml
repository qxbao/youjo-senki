    pháp sư Liên bang''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Logic & cấu trúc giới hạn: giữ châm ngôn ''Chặt đứt đầu thì phần
    thân khắc chết'' và cấu trúc giới hạn ''Chỉ có kẻ ngu dốt mang tư tưởng lãng mạn
    kỳ quặc mới rủa xả chúng là lũ hèn nhát''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật gọi ''Tanya''; ''Federation
    Army'' -> ''Quân đội Liên bang''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & đại từ: chỉ bọc ''*lageri*'' khớp
    thẻ em nguồn theo DEC-P01-002; ''Commies'' -> ''mấy tên Cộng sản''; đại từ ngôi
    thứ nhất số nhiều trong thoại dùng ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: nội tâm tự quy chiếu dùng ''mình'' theo DEC-P01-001;
    giữ nguyên ''Type 95''; ''processor overload'' -> ''quá tải bộ xử lý''; ''four
    cores'' -> ''bốn lõi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Thoại cầu nguyện & thuật ngữ: ''Good News'' -> ''Tin Mừng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, câu hỏi tu từ & phủ định kép: giữ câu hỏi
    tu từ đầu đoạn; ''the Lord'' -> ''Chúa''; chỉ bọc câu ngạn ngữ ''*Không thể đánh
    trận mà không đánh mất sự tỉnh táo*'' khớp thẻ em nguồn theo DEC-P01-002 và giữ
    đúng cấu trúc phủ định kép."]'
