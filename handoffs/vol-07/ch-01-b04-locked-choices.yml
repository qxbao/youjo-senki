choices:
- segment_id: YS-LN07/Text/chapter002.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & tình thái: trần thuật ngôi thứ ba gọi ''Tanya''; giữ
    mức độ cần thiết ''cần phải hạ gục càng nhiều tên trong số chúng càng tốt''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & sắc thái: giữ nguyên ''Elinium Type 95''; ''cursed
    object of power'' -> ''vật phẩm quyền năng bị nguyền rủa''; ''wholesale slaughter''
    -> ''tàn sát hàng loạt''; giữ giọng thực dụng lạnh lùng ''Công việc là công việc...
    nhưng đây là chiến tranh''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Thoại cầu nguyện & xưng hô: lời khấn kích hoạt Type 95 dùng danh
    xưng tôn kính ''Hỡi Đấng...'' và đại từ ''chúng con''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: độc thoại nội tâm tự quy chiếu của Tanya dùng
    ''mình'' theo DEC-P01-001; giữ phủ định định ngữ ''một thứ lẽ ra không nên tồn
    tại…''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, câu hỏi nội tâm & đại từ: chỉ bọc hai câu
    hỏi ''*Đạo đức là gì? Công lý là gì?*'' khớp thẻ em nguồn theo DEC-P01-002; trần
    thuật gọi ''Tanya'' và quy chiếu bằng ''nó'' theo DEC-P01-001; giữ cấu trúc ''chẳng
    còn lựa chọn nào khác ngoài việc...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhượng bộ: câu cảm thán nội tâm quy chiếu bản
    thân bằng ''mình'' theo DEC-P01-001; giữ quan hệ đối lập ''Dẫu vậy, đó là sự hy
    sinh được tự nguyện dâng lên để đổi lấy chiến thắng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Thoại cầu nguyện: tiếp nối mạch khấn nguyện trang trọng với đại
    từ ''chúng con''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ: ''four layers of explosion formulas'' -> ''bốn
    tầng thuật thức phát nổ''; ''mana'' -> ''ma lực''; ''suppressive fire'' -> ''hỏa
    lực chế áp''; ''augmented company'' -> ''đại đội tăng cường''; giữ đúng tỷ lệ
    ''lớn gấp bốn lần bình thường''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Tình thái & khẩu ngữ: giữ mức suy đoán chắc chắn ''Ắt hẳn đây
    chính là...'' và hình ảnh ẩn dụ ''não mình như muốn cháy khét vì làm việc quá
    sức''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Thoại cầu nguyện: giữ văn phong trang trọng ''“Kia là vòng nguyệt
    quế đã hứa—ngôi nhà vinh quang, một thế giới bình yên và thuần khiết.”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & quan hệ nhượng bộ: trần thuật gọi ''Tanya''; giữ thế
    đối lập giữa cảm giác ý thức chực tuột mất và kết quả đòn đánh nhấn chìm toán
    pháp sư địch đang bốc lên cao."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''opening salvo'' -> ''loạt đạn mở màn''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, khẩu ngữ & nhượng bộ: ''Federation Army'' -> ''Quân
    đội Liên bang''; ''roasted medium well'' -> ''nướng chín vừa tới''; giữ mệnh đề
    nhượng bộ cuối câu ''dù bản thân chúng có nhận ra hay không''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh & chức danh: ''battalion commander'' -> ''tiểu
    đoàn trưởng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & nhân vật: ''Major Weiss'' -> ''Thiếu tá Weiss''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Weiss xin phép cấp trên xưng ''tôi'' (''đơn vị
    của tôi'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Thoại, tôn giáo & xưng hô: ''the Lord'' -> ''Chúa''; Tanya gọi
    đơn vị của Weiss là ''các anh'' và phát lệnh ngắn gọn ''Triển khai đi!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật gọi ''Tanya'', quy chiếu Tanya
    bằng ''nó'' theo DEC-P01-001 và quy chiếu Weiss bằng ''anh''; ''strike formation''
    -> ''đội hình tập kích''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tu từ: ''Named mages'' -> ''những Pháp sư
    Định danh''; ''eastern front'' -> ''mặt trận phía đông''; ''“warmongers”'' ->
    ''“những kẻ hiếu chiến”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''optical decoys'' -> ''mồi nhử quang học'';
    ''enemy aerial mages'' -> ''lực lượng pháp sư trên không của địch''; ''regiment''
    -> ''trung đoàn''; giữ mức phỏng đoán ''ắt phải xấp xỉ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*truy kích*''
    và ''*tháo chạy*'' khớp hai thẻ em nguồn theo DEC-P01-002; ''Federation mages''
    -> ''đám pháp sư Liên bang''; đại từ ngôi thứ nhất số nhiều chỉ phe Đế quốc dùng
    ''chúng tôi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Hình ảnh ẩn dụ & mức độ: giữ mức độ ''gần như là điều chắc chắn''
    và cặp ẩn dụ ''những con chó săn chiến tranh'' / ''những chú chó săn cừ khôi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & quan hệ đối lập: giữ sự đối lập tình thế ''Đang ở thế
    tấn công mà bỗng dưng lại trở thành kẻ hứng đòn'' và tác động tiêu cực tới ''nhuệ
    khí''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ nhận định khái quát về sự suy giảm nhuệ khí làm suy
    yếu cả đạo quân hùng mạnh nhất.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''Federation Army'' -> ''Quân đội Liên
    bang''; giữ tình thái suy đoán ''có lẽ số lượng cựu binh cũng chẳng nhiều nhặn
    gì''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Thoại độc thoại, đại từ & phủ định: lời lẩm bẩm của Tanya dùng
    ''mình''; trần thuật ngôi thứ ba gọi ''Tanya'' và quy chiếu bằng ''nó'' theo DEC-P01-001;
    giữ phủ định ''chẳng hề có ý định cho nó hưởng ngay cả thứ xa xỉ nhỏ nhoi đó''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Biệt danh trong thoại địch: ''Rusted Silver'' -> ''Bạch Ngân Rỉ
    Sét''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ tiếng chửi lặp lại ''“Khốn kiếp! Khốn kiếp!”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Thoại địch & xưng hô: pháp sư địch xưng ''ta'' – ''ngươi'', giữ
    quyết tâm liều mạng ''Có chết ta cũng phải kéo ngươi theo cùng!''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: nội tâm tự quy chiếu của Tanya dùng ''mình''
    theo DEC-P01-001; phân biệt ''các đường ngắm khóa mục tiêu'' (''targeting sights'')
