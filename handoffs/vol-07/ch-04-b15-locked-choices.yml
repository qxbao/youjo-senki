choices:
- segment_id: YS-LN07/Text/chapter016.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha điểm nhìn Tanya: giữ tên riêng ''Tanya'', đại từ
    ''nó'' theo DEC-P01-001, ẩn dụ ''vai trò đỡ đòn như xe tăng trong một tổ đội''
    (party''s tank), và ''đám pháp sư Liên bang'' (Federation mages)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Tiểu đoàn Pháp sư Trên không số 203'' (203rd
    Aerial Mage Battalion) và chuỗi hành động vờ tản ra rồi lập tức vòng ngược lại
    tập kích."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Binh lính Liên bang'' (Federation soldiers),
    ''lực lượng tinh nhuệ của Đế quốc'' (the elites of the Reich), và quan hệ nhân
    quả khi cục diện xoay chuyển đột ngột."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ đại từ tự xưng ''mình'' theo
    DEC-P01-001 và ''binh lính Liên bang'' (Federation soldiers)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Trần thuật từ điểm nhìn Tanya: giữ tên riêng ''Tanya'', đại từ
    ''nó'' theo DEC-P01-001, ''những lớp vỏ phòng thủ bền chắc'' (durable defensive
    shells), và nhận định thực lực không tỷ lệ thuận với ý chí."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Tiểu đoàn Pháp sư Trên không số 203'' (203rd
    Aerial Mage Battalion)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với cấp dưới: giữ đại từ ''Chúng ta'' / ''chúng
    ta'', ''pháp sư trên không của địch'' (enemy aerial mages), và danh xưng ''Thiếu
    tá Weiss'' (Major Weiss)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của Thiếu tá Weiss: giữ ''thuật thức phát nổ'' (explosion
    formula), ''đại đội'' (companies), ''chúng ta'' (we), và tiểu từ lễ phép ''ạ''
    khi báo cáo với cấp trên."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ câu hỏi xác nhận tỷ lệ thương vong ''một
    phần tư quân số của chúng ta'' (a quarter of our members)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000399
  kind: terminology_and_voice
  value: 'choices=["Trần thuật kết hợp nội tâm Tanya: giữ đại từ ''Nó'' / ''nó'' cho
    Tanya theo DEC-P01-001, ''Họ'' cho đơn vị, ''đám pháp sư Liên bang'' (Federation
    mages), và giữ đúng phạm vi nhấn mạnh Markdown ''*Cảm giác chẳng giống như chúng
    ta đang giao chiến với Quân đội Liên bang chút nào…*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000400
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ đại từ tự xưng ''mình'' theo
    DEC-P01-001, ''Quân đội Liên bang'' (Federation Army), ''sức kháng cự có tổ chức
    của Liên bang'' (the Federation''s organized resistance), và phủ định ''chẳng
    hề lộ dấu hiệu sụp đổ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000401
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ giả định trái thực tế ''hẳn đã
    phải rệu rã'' và đại từ tự xưng ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000402
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ huy của Tanya: giữ đại từ ''chúng ta'', ''ưu thế trên
    không cục bộ'' (limited air superiority), ''viện binh địch'' (enemy reinforcements)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000403
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss và trần thuật: giữ cách đáp ''Rõ, thưa Trung tá!''
    (Yes, ma''am!), ''sở chỉ huy địch'' (enemy HQ), đại từ ''Anh'' cho Weiss, ''vị
    phó chỉ huy'' (vice commander), và giữ đúng phạm vi nhấn mạnh Markdown ''*được
    xác định*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000404
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ mức độ phán đoán ''khả năng rất cao'' (a
    very good chance) và ''trò nghi binh'' (deception)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000405
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Weiss: giữ sắc thái lễ phép ''Sao cơ ạ?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000406
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Weiss: giữ tình thái phỏng đoán ''Có lẽ''
    (probably), đại từ ''chúng ta'' và tự xưng ''Tôi''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000407
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya: giữ đại từ ''Nó'' / ''nó'' theo DEC-P01-001
    và phủ định ''thực sự không muốn''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000408
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên riêng ''Tanya'', ''sở chỉ huy của Quân đội
    Liên bang'' (Federation Army headquarters), ''Moskva'', ''tác chiến chống pháp
    sư'' (anti-mage combat), và đại từ ''họ'' chỉ tiểu đoàn."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000409
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ ''nhiệm vụ phụ trội'' (additional
    task), ''lực lượng biệt kích dù'' (paratrooper rangers), ''điểm vượt sông'' (river
    crossing), đại từ ''chúng ta'' và phủ định ''Chẳng có lý do gì''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000410
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ đại từ ''Chúng ta'' và tình thái
    khả năng ''có thể'' (could)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000411
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss gọi Tanya: giữ danh xưng cấp bậc thực tế ''Thưa
    Trung tá?'' (Colonel?)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000412
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ ''Sức kháng cự của Liên bang'' (Federation
    resistance), đại từ ''chúng ta'', và ''Sở chỉ huy của chúng'' (The headquarters)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000413
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss tán đồng Tanya: giữ cách xưng hô tôn kính ''…Vâng,
    Trung tá nói đúng ạ.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000414
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya và trần thuật: giữ ''vị phó chỉ huy'' (second-in-command),
    ''lá cờ đỏ của phe Cộng sản'' (the Communists'' red flag), danh xưng ''Thiếu tá''
    (Major), ''Nghi binh'' (Deception), ''sở chỉ huy địch'' (enemy HQ), và ''suy nghĩ
    quá đỗi viển vông'' (thinking too wishfully)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000415
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss hỏi lại Tanya: giữ xưng hô ''Trung tá'', đại từ
    ''chúng ta'' và tiểu từ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000416
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya và trần thuật: giữ tên riêng ''Tanya'', đại từ
    ''nó'' theo DEC-P01-001, ''sở chỉ huy'' (HQ), và giữ đúng phạm vi nhấn mạnh Markdown
    ''*Chắc chắn là không rồi*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000417
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya: giữ đại từ ''Nó'' / ''nó'' theo DEC-P01-001,
    tên riêng ''Weiss'', và độ bất định ''chẳng chắc chắn về sự thật''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000418
  kind: terminology_and_voice
  value: 'choices=["Bình luận nội tâm của Tanya: giữ cấu trúc điều kiện ''Nếu người
    chỉ huy trong một cuộc tập kích thất bại'' và ''một cái cớ hợp lý'' (a plausible
    excuse)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000419
  kind: terminology_and_voice
  value: 'choices=["Thoại nhận xét về đối phương: giữ thành ngữ khuyết ''lũ ngốc và
    cái thứ gì đó rất mê chỗ cao'' và ''đám Cộng sản'' (Communists)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000420
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss với Tanya: giữ tự xưng ''Tôi'' kèm ''ạ'' (''Tôi
    hiểu rồi ạ.'') và đại từ ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000421
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại mệnh lệnh của Tanya: giữ đúng phạm vi nhấn
    mạnh Markdown ''*Đành chịu vậy thôi*'' theo DEC-P01-002, ''đội hình tập kích''
    (assault formation), và ''tìm và diệt'' (search and destroy)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000422
  kind: terminology_and_voice
  value: 'choices=["Thoại nhận lệnh của Weiss: giữ ''Đã rõ ạ.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000423
  kind: terminology_and_voice
  value: 'choices=["Trần thuật từ điểm nhìn Tanya: giữ ''Vị phó chỉ huy của nó'' (her
    second-in-command), đại từ ''Nó'' / ''nó'' và ''mình'' cho Tanya theo DEC-P01-001,
    đại từ ''anh'' cho Weiss, và ''các đồng đội của nó'' (her friends)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000424
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya về thị trường lao động: giữ lập luận
    về mức đãi ngộ tương xứng và ví dụ về các cầu thủ bóng chày chuyên nghiệp tầm
    cỡ át chủ bài.'']'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000425
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha nội tâm Tanya: giữ đại từ ''chúng ta'', tên riêng
    ''Tanya'', đại từ ''nó'' theo DEC-P01-001, ''mệnh lệnh phụ trội'' (additional
    order), và ''sở chỉ huy địch'' (enemy HQ)."]'
