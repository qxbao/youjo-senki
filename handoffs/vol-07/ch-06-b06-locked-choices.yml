  value: 'choices=["Nhấn mạnh Markdown, giả định & thuật ngữ: giữ dấu chấm lửng đầu
    câu; chỉ bọc ''*Chúng ta không thể thắng*'' trong dấu sao khớp thẻ em nguồn theo
