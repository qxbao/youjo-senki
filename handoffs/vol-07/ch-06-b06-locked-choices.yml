    nói khái quát''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại & thuật ngữ: ''The civil servant'' -> ''Vị công
    chức dân sự''; gọi Rudersdorf là ''Ngài''; ''the Empire'' -> ''Đế quốc''; giữ
    phủ định ''không thể hy vọng giành thêm chiến thắng được nữa''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu Rudersdorf bằng ''ông ấy''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: tiếp tục quy chiếu Rudersdorf bằng ''ông
    ấy''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Thoại, tình thái & trần thuật: giữ tình thái dè dặt ''có lẽ sẽ
    khó đấy''; quy chiếu Rudersdorf bằng ''ông ấy''; ''the civil servants'' -> ''đám
    công chức dân sự''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ câu hỏi vặn ''Khó ư?''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ ''Đúng vậy. Cực kỳ khó.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: công chức gọi Rudersdorf là ''ngài''; giữ phủ
    định ''nhưng ngài không nói là bất khả thi''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Hỏi câu đó chẳng hay
    ho gì đâu*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Rudersdorf
    bằng ''ông ấy'', giữ điểm nhìn của Zettour."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & so sánh: quy chiếu Rudersdorf bằng ''ông ấy''; giữ
    cấu trúc phủ định so sánh ''chẳng có câu hỏi nào đáng ghét hơn...''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi tu từ & thuật ngữ: giữ dấu chấm lửng đầu câu; Rudersdorf
