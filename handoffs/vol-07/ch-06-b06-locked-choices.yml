- segment_id: YS-LN07/Text/chapter022.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ so sánh: quy chiếu Zettour bằng ''ông'';
    giữ đúng cấu trúc so sánh ''thứ duy nhất nguy hiểm hơn một trận đại bại chính
    là một trận đại thắng''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & độc thoại nội tâm: chỉ bọc ''*Bọn họ cứ thế
    tự huyễn hoặc rằng chúng ta vẫn có thể thắng ư?*'' và ''*Các người nói thật đấy
    à?!*'' trong dấu sao khớp hai thẻ em nguồn theo DEC-P01-002; quy chiếu Zettour
    bằng ''ông'', nhóm công chức bằng ''Bọn họ'' / ''Các người''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Thoại: Rudersdorf xưng ''tôi''; giữ sắc thái lịch sự khi xin phát
    biểu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Thoại & danh xưng: ''General von Rudersdorf'' -> ''Tướng von Rudersdorf''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu Zettour bằng ''ông'' và Rudersdorf
    (''his esteemed friend'') bằng ''vị chiến hữu đáng kính'' / ''ông ấy''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Thoại, danh xưng & đại từ: Rudersdorf gọi các công chức là ''Các
    vị'', dùng ''chúng ta'' - ''mình''; ''General von Zettour'' -> ''Tướng von Zettour''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: công chức gọi ''Tướng von Rudersdorf''
    bằng ''Ngài'' / ''ngài'', xưng ''tôi''; ''Operations'' -> ''Cục Tác chiến''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Rudersdorf xưng ''tôi'' / ''Tôi'', gọi phía công
