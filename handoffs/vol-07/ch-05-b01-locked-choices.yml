choices:
- segment_id: YS-LN07/Text/chapter018.xhtml/p000001
  kind: terminology_and_voice
  value: target_text_snapshot=NGÀY 11 THÁNG 5 NĂM THỐNG NHẤT 1927, BỨC ĐIỆN TIỄN BIỆT
    CỦA QUÂN ĐỘI LIÊN BANG; status=locked; notes=Tiêu đề thời gian và tên bức điện
    mở đầu Chương 5; nguồn không có thẻ nhấn mạnh, bản dịch viết hoa toàn bộ không
    bọc sao đúng quy ước.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000002
  kind: terminology_and_voice
  value: 'target_text_snapshot=*Từ: Tập đoàn quân phía Tây, Đại diện Chính ủy Hobrov
    và Đại diện Tư lệnh, Trung tướng Markov*; status=locked; notes=Dòng người gửi
    bức điện bọc nghiêng toàn đoạn khớp nguồn; chức danh và cấp bậc của Hobrov và
    Markov chuẩn xác.'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000003
  kind: terminology_and_voice
  value: 'target_text_snapshot=*Gửi: Bộ Tổng tham mưu Quân đội Liên bang*; status=locked;
    notes=Dòng người nhận bức điện bọc nghiêng toàn đoạn khớp nguồn.'
- segment_id: YS-LN07/Text/chapter018.xhtml/p000004
  kind: terminology_and_voice
  value: target_text_snapshot=*Sở chỉ huy đã ban hành mệnh lệnh nghiêm ngặt yêu cầu
    toàn bộ binh lính còn lại rút lui. Bộ chỉ huy nguyện làm lực lượng đoạn hậu yểm
    trợ cho các đồng chí triệt thoái. Chỉ cần cứu thêm được dù chỉ một người lính,
    chúng tôi cũng đã mãn nguyện rồi.*; status=locked; notes=Bọc nghiêng toàn đoạn
    khớp nguồn; phân biệt hợp lý 'Headquarters' ('Sở chỉ huy') và 'Command' ('Bộ chỉ
    huy'), xưng hô 'chúng tôi - các đồng chí' trang trọng.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000005
  kind: terminology_and_voice
  value: target_text_snapshot=*Hiện tại chúng tôi đang hứng chịu hỏa lực chế áp. Vào
    thời khắc tiễn biệt này, Bộ chỉ huy xin gửi lời cảm ơn đến các đồng chí đã chiến
    đấu bằng tất cả sức mình. Nhưng chúng tôi không thể báo đáp sự hy sinh của những
    đồng chí đã ngã xuống trong bùn lầy. Một khi đã mất ưu thế trên không, tất cả
    những gì chúng ta có thể làm chỉ là chất chồng thêm những tổn thất vô ích.*; status=locked;
    notes=Bọc nghiêng toàn đoạn khớp nguồn; thuật ngữ 'hỏa lực chế áp' và 'ưu thế
    trên không' chuẩn xác.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000006
  kind: terminology_and_voice
  value: target_text_snapshot=*Dù ai cũng biết rõ bộ binh dưới mặt đất dễ bị tổn thương
    đến mức nào khi đánh mất quyền kiểm soát vùng trời, chúng tôi xin nhân cơ hội
    này một lần nữa nhấn mạnh mối đe dọa đó. Những đòn cơ động đặc thù mà Lục quân
    Đế quốc từng sử dụng tại Dacia nay đã được chứng minh hết lần này đến lần khác
    qua nhiều trận đánh khác.*; status=locked_with_minor_note; notes=Bọc nghiêng toàn
    đoạn khớp nguồn; xem finding minor về việc chỉnh 'bộ binh dưới mặt đất' thành
    'quân mặt đất' hoặc 'lực lượng mặt đất' cho sát nghĩa 'ground troops'.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000007
  kind: terminology_and_voice
  value: target_text_snapshot=• *Ngay cả khi không thể giành được quyền làm chủ bầu
    trời, hãy chặn đứng các đợt không kích của địch bằng hỏa lực phục kích nếu thời
    cơ xuất hiện.*; status=locked; notes=Giữ đúng dấu bullet ngoài cặp dấu sao nghiêng
    ('• *...*') khớp chính xác cấu trúc thẻ <em> trong nguồn.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000008
  kind: terminology_and_voice
  value: target_text_snapshot=• *Nỗ lực cải thiện công tác dự báo thời tiết.*; status=locked;
    notes=Giữ đúng cấu trúc '• *...*' khớp nguồn.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000009
  kind: terminology_and_voice
  value: target_text_snapshot=• *Các đơn vị pháp sư trên không chiến đấu rất đáng
    gờm, vì vậy hãy liều mạng phòng ngự. Dù cục diện chiến sự có chuyển biến xấu đi,
    hãy kiên quyết giữ vững trận địa.*; status=locked; notes=Giữ đúng cấu trúc '•
    *...*' khớp nguồn; thuật ngữ 'đơn vị pháp sư trên không' khớp canon.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000010
  kind: terminology_and_voice
  value: target_text_snapshot=*Để đáp lại một số mối nghi ngờ liên quan đến vấn đề
    cấp bậc, chúng tôi tin rằng binh lính của mình đã chứng minh sự trong sạch bằng
    chính máu thịt của họ. Chúng tôi hy vọng các đồng chí sẽ ghi nhận những đóng góp
    ấy.*; status=locked; notes=Bọc nghiêng toàn đoạn khớp nguồn; ngữ nghĩa và giọng
    điệu trần tình trước Bộ Tổng tham mưu tự nhiên.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000011
  kind: terminology_and_voice
  value: target_text_snapshot=*Ngoài ra, chúng ta đang ở thế bất lợi trước một kẻ
    địch có cơ cấu tổ chức ít cứng nhắc hơn, do đó chúng ta cần sự linh hoạt và nhạy
    bén cao hơn ở cấp độ chiến dịch. Chúng tôi hy vọng các đồng chí sẽ cân nhắc những
    vấn đề mang tính hệ thống này.*; status=locked; notes=Bọc nghiêng toàn đoạn khớp
    nguồn; thuật ngữ 'ở cấp độ chiến dịch' ('on the operational level') và 'những
    vấn đề mang tính hệ thống' chuẩn xác.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000012
  kind: terminology_and_voice
  value: target_text_snapshot=• *Chúng tôi nhận thấy rằng lối diễn đạt lặp đi lặp
    lại trong các bức điện và báo cáo của các chính ủy làm suy giảm hiệu quả của mật
    mã dùng để mã hóa chúng.*; status=locked; notes=Giữ đúng cấu trúc '• *...*' khớp
    nguồn; dịch chính xác nhận định kỹ thuật mật mã về báo cáo của các chính ủy.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000013
  kind: terminology_and_voice
  value: target_text_snapshot=• *Các chiến dịch của chúng ta thường có vẻ bị lộ mỗi
    khi gửi điện tín. Điều này dường như đã dẫn đến việc rò rỉ vị trí sở chỉ huy của
    chúng tôi. Rất có khả năng đó chính là nguyên nhân gây ra cuộc tập kích của đơn
    vị pháp sư trên không lần này. Xin hãy sử dụng sĩ quan giao liên và tìm cách rút
    ngắn nội dung điện tín cũng như tránh lặp từ.*; status=locked; notes=Giữ đúng
    cấu trúc '• *...*' khớp nguồn; các thuật ngữ 'vị trí sở chỉ huy', 'đơn vị pháp
    sư trên không', 'sĩ quan giao liên' chuẩn xác.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000014
  kind: terminology_and_voice
  value: target_text_snapshot=• *Việc thường xuyên sử dụng các thuật ngữ tư tưởng
    là một điểm yếu chí mạng xét về mặt mã hóa.*; status=locked; notes=Giữ đúng cấu
    trúc '• *...*' khớp nguồn; diễn đạt gọn và sát nghĩa.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000015
  kind: terminology_and_voice
  value: target_text_snapshot=*Xin các đồng chí hiểu cho rằng việc hạn chế những tin
    tức tình báo cần thiết trong quá trình tác chiến có thể chuốc lấy vô vàn khó khăn.
    Nhưng ngoại trừ Bộ chỉ huy ra, tất cả mọi người đều đã cố gắng hết sức mình.*;
    status=locked; notes=Bọc nghiêng toàn đoạn khớp nguồn; lời nhắn gửi bảo vệ cấp
    dưới rõ ràng.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000016
  kind: terminology_and_voice
  value: target_text_snapshot=*Để các đồng chí của mình phải chết uổng chết nhục hoàn
    toàn là thất bại của Bộ chỉ huy, vì vậy xin đừng trách phạt các đơn vị cấp dưới
    của chúng tôi. Tôi xin chúc tất cả các đồng chí chiến hữu gặp nhiều may mắn.*;
    status=locked; notes=Bọc nghiêng toàn đoạn khớp nguồn; giữ đúng sự chuyển đổi
    từ 'Command' ('Bộ chỉ huy' / 'chúng tôi') sang ngôi thứ nhất số ít 'I' ('Tôi')
    ở câu chúc cuối.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000017
  kind: terminology_and_voice
  value: target_text_snapshot=*Tổ quốc, Đảng và nhân dân muôn năm.*; status=locked;
    notes=Khẩu hiệu kết thúc bức điện bọc nghiêng toàn đoạn khớp nguồn.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000018
  kind: terminology_and_voice
  value: target_text_snapshot=CÙNG NGÀY, MOSKVA, VĂN PHÒNG BỘ DÂN ỦY NỘI VỤ; status=locked;
    notes=Tiêu đề chuyển cảnh tại Moskva; khớp thuật ngữ 'Bộ Dân ủy Nội vụ' trong
    work/run-state/pending-terms-index.yml.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000019
  kind: terminology_and_voice
  value: target_text_snapshot=Khoảnh khắc đọc xong bức điện, cảm giác xâm chiếm lấy
    gã là một sự trống rỗng mênh mông. Trước kết cục của cuộc đụng độ với Lục quân
    Đế quốc, Ủy viên Dân ủy Nội vụ Loria buông một tiếng thở dài não nuột.; status=locked;
    notes=Điểm nhìn trần thuật ngôi thứ ba bám sát Loria ('gã'); thuật ngữ 'Lục quân
    Đế quốc' và 'Ủy viên Dân ủy Nội vụ Loria' nhất quán.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000020
  kind: terminology_and_voice
  value: target_text_snapshot=“…Thật thảm hại. Ta chưa từng nghĩ mọi chuyện lại tệ
    hại đến mức này.”; status=locked_with_minor_note; notes=Thoại độc thoại cảm thán
    của Loria; xem finding minor về đại từ tự xưng 'Ta' (p000020) so với 'tôi' (p000030).
- segment_id: YS-LN07/Text/chapter018.xhtml/p000021
  kind: terminology_and_voice
  value: target_text_snapshot=Bản báo cáo chính thức, bản sao các bức điện tín, và
    cả tai mắt nội tuyến mà gã cài vào để báo tin cho mình…; status=locked; notes=Dịch
    sát nghĩa 'the insider he’d sent to inform him' ('tai mắt nội tuyến mà gã cài
    vào để báo tin cho mình').
- segment_id: YS-LN07/Text/chapter018.xhtml/p000022
  kind: terminology_and_voice
  value: target_text_snapshot=“Ưu thế về quân số, trang thiết bị dồi dào—chúng ta
    thậm chí còn cải thiện cả các tuyến tiếp tế, thế mà kết cục nhận về lại là thế
    này ư?”; status=locked; notes=Thoại chất vấn/than thở của Loria mạch lạc, tự nhiên.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000023
  kind: terminology_and_voice
  value: target_text_snapshot=Tình cảnh hiện tại của họ bi đát hơn những gì gã có
    thể tưởng tượng.; status=locked; notes=Câu trần thuật ngắn gọn, đúng điểm nhìn
    Loria.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000024
  kind: terminology_and_voice
  value: target_text_snapshot=Một đơn vị đổ bộ đường không của địch đã đánh úp họ
    từ phía sau, và sau khi đẩy họ vào cảnh hỗn loạn, Lục quân Đế quốc, với lực lượng
    thiết giáp làm mũi chủ công, đã đâm thủng tiền tuyến của họ để bao vây và tiêu
    diệt hoàn toàn. Đạo quân này lẽ ra phải chuẩn bị kỹ lưỡng gấp bội cho ngày hôm
    nay, thế nhưng lại sụp đổ chóng vánh đến mức trận đánh trông chẳng khác nào một
    cảnh tượng bước ra từ bộ phim tuyên truyền rẻ tiền.; status=locked; notes=Thuật
    ngữ tác chiến ('đơn vị đổ bộ đường không', 'Lục quân Đế quốc', 'lực lượng thiết
    giáp làm mũi chủ công', 'bao vây và tiêu diệt h
- segment_id: YS-LN07/Text/chapter018.xhtml/p000025
  kind: terminology_and_voice
  value: target_text_snapshot=Điểm khác biệt duy nhất giữa trận đánh đó và một trong
    những thước phim do Đảng sản xuất là khoảng cách giữa phe chính diện và phe phản
    diện.; status=locked; notes=Dịch chuẩn xác sự so sánh châm biếm giữa chiến trường
    thực tế và phim tuyên truyền của Đảng.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000026
  kind: terminology_and_voice
  value: target_text_snapshot=Ngoại trừ việc Quân đội Liên bang, bên lẽ ra phải chiến
    thắng, lại bị Lục quân Đế quốc, bên lẽ ra phải thất bại, càn quét và đánh đuổi,
    thì mọi thứ đều y hệt như trong phim. Xem chừng mấy gã ở xưởng phim lại có tài
    theo đuổi tính chân thực hơn người ta tưởng.; status=locked; notes=Giọng trần
    thuật mỉa mai sâu cay của góc nhìn Loria được truyền tải mượt mà.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000027
  kind: terminology_and_voice
  value: target_text_snapshot=*Hay là tống cổ hết bọn chúng tới Sildberia nhỉ?* Sự
    giống nhau kỳ lạ đến mức gã nửa muốn thực sự trút giận lên đám làm phim theo cách
    đó.; status=locked; notes=Bảo toàn chính xác câu độc thoại nội tâm in nghiêng
    '*Hay là tống cổ hết bọn chúng tới Sildberia nhỉ?*' khớp thẻ <em> nguồn; địa danh
    'Sildberia' khớp pending-terms-index.yml.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000028
  kind: terminology_and_voice
  value: target_text_snapshot=“Vậy đây là một đòn giáng nặng nề đối với quân đội sao?”;
    status=locked; notes=Câu hỏi của Loria mở đầu cuộc đối thoại với đại tá tham mưu
    tự nhiên.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000029
  kind: terminology_and_voice
  value: target_text_snapshot=Xem ra chỉ nỗ lực đôi chút sẽ chẳng đủ để xoay chuyển
    cục diện chiến tranh. Chỉ cần đọc qua một lượt là đủ thấy rõ điều đó. Nói thẳng
    ra, tình cảnh này không thể giải quyết bằng cái bài ca *thiếu tinh thần cách mạng*
    vạn năng được nữa.; status=locked; notes=Bảo toàn chính xác cụm từ nhấn mạnh '*thiếu
    tinh thần cách mạng*' khớp thẻ <em> nguồn ('lack of revolutionary spirit').
- segment_id: YS-LN07/Text/chapter018.xhtml/p000030
  kind: terminology_and_voice
  value: target_text_snapshot=“Nói cho tôi biết đi, đồng chí. Cách thức vận hành của
    Tập đoàn quân phía Tây có vấn đề gì không?”; status=locked; notes=Cách xưng hô
    'tôi - đồng chí' của Loria khi chất vấn đại tá tham mưu tự nhiên, đúng bối cảnh
    Liên bang.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000031
  kind: terminology_and_voice
  value: target_text_snapshot=“Tôi nghe nói về cơ bản là đều tuân theo đúng học thuyết,
    thưa đồng chí.”; status=locked; notes=Câu trả lời của viên đại tá ('Tôi - thưa
    đồng chí') và thuật ngữ 'học thuyết' ('doctrine') chuẩn xác.
- segment_id: YS-LN07/Text/chapter018.xhtml/p000032
  kind: terminology_and_voice
  value: target_text_snapshot=Tay sĩ quan tham mưu này cũng to gan thật đấy dù chỉ
    là một đại tá quèn—ngầm ám chỉ rằng xét cho cùng, đó không phải lỗi của quân đội.;
    status=locked; notes=Dịch sát nghĩa 'staffer' ('Tay sĩ quan tham mưu') và 'a mere
    colonel' ('một đại tá quèn'); khép lại batch 01 mượt mà.
