choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: sĩ quan tham mưu gọi Zettour là ''thưa Trung
    tướng'' và ''ngài'', dùng ''chúng ta'' cho phía Đế quốc; ''reconnaissance units''
    -> ''đơn vị trinh sát''; ''tactical reconnaissance'' -> ''trinh sát chiến thuật'';
    ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: giữ câu nhận định ngắn gọn ''Vậy là chúng ta vừa
    kịp lúc.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Operations'' -> ''Cục Tác chiến''; ''manager''
    -> ''người đứng đầu''; trần thuật gọi Rudersdorf là ''ông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Rudersdorf xưng ''chúng ta'' (toàn
    quân) / ''chúng tôi'' (Cục Tác chiến) và gọi Zettour là ''Ông''; ''recon net''
    -> ''mạng lưới trinh sát''; giữ quan hệ nhân quả và phủ định ''bị tê liệt quá
    dễ dàng, thành ra chẳng tài nào nắm chắc được ý đồ của địch''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: Zettour xưng ''tôi'' và gọi Rudersdorf là
    ''ông''; giữ sắc thái thân mật giữa hai đồng cấp ''cũng bõ công tôi chật vật vét
    quân gom lại''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & câu hỏi: Rudersdorf xưng ''Tôi'', gọi Zettour
    là ''ông''; giữ mệnh đề nhượng bộ phủ định ''vẫn chưa phân tích số tài liệu đó''
    và câu hỏi về nhận định đối với ''cuộc tiến công của địch''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Mức độ & nghĩa: giữ đúng mức độ sát ranh giới ''cực kỳ tồi tệ
    nhưng vẫn chưa tới mức chí mạng''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nghĩa: ''the Empire’s forces'' -> ''quân lực Đế quốc'';
    giữ nhận định tổng kết về thời điểm bất lợi."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Phủ định: giữ câu khẳng định qua cấu trúc phủ định ''Đó là sự
    thật không thể chối cãi.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ: ''eastern front'' -> ''mặt trận phía đông'';
    ''southern front'' -> ''mặt trận phía nam''; giữ dấu chấm lửng mở đầu và mức độ
    giảm nhẹ ''đều có phần đáng lo ngại''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: giữ mô tả Zettour hỏi người bạn cũ; ''negotiation
    team'' -> ''Phái đoàn đàm phán''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & so sánh: quy chiếu Lergen (''our man on the
    ground'') bằng ''người của chúng ta tại chỗ'' và ''Anh ấy'' nhất quán với batch
    trước; ''preliminary discussions'' -> ''cuộc thảo luận sơ bộ''; giữ cấu trúc so
    sánh hơn ''nghiêm trọng hơn nhiều so với việc chỉ đơn thuần tìm kiếm điểm chung''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & thuật ngữ: bọc chính xác câu suy
    nghĩ đầu đoạn trong dấu sao ''*Vậy là Lergen đang muốn nói rằng sẽ chẳng dễ dàng
    gì để giành được sự ủng hộ của họ.*'' theo DEC-P01-002; trần thuật gọi Zettour
    là ''Ông''; giữ phủ định ''vốn chưa bao giờ nghĩ''; dịch ''the Emp'' là ''Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Rudersdorf gọi Zettour là ''Ông''; ''Federation
    Army'' -> ''Quân đội Liên bang''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Đại từ, tình thái & điều kiện: Zettour xưng ''Tôi'' / ''chúng
    ta'', gọi quân Liên bang là ''chúng''; ''bargaining chip'' -> ''quân bài mặc cả'';
    ''Imperial Army'' -> ''Lục quân Đế quốc''; ''eastern front'' -> ''mặt trận phía
    đông''; ''southern border'' -> ''biên giới phía nam''; giữ câu điều kiện giả định
    ''Nếu... Ildoa rất có thể sẽ bắt đầu rục rịch...''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''classic feint'' -> ''đòn nghi binh kinh điển''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện: Rudersdorf gọi Zettour là ''ông'', dùng ''chúng
    ta''; giữ hình ảnh mạnh trong câu hỏi điều kiện ''Ildoa sẽ chồm lên bóp cổ chúng
    ta sao?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Phủ định, quân hàm & câu hỏi tu từ: giữ phủ định ''Chẳng ai có
    thể loại trừ hoàn toàn một trăm phần trăm khả năng đó'' và phủ định kép ''không
    còn lựa chọn nào khác ngoài việc phải dè chừng''; ''General von Rudersdorf'' ->
    ''Tướng von Rudersdorf''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=[''Dấu câu & nghi vấn: giữ dấu chấm lửng mở đầu và nỗi băn khoăn
    của Rudersdorf về mục tiêu thực sự của địch.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Tình thái & thuật ngữ: giữ chuỗi ba giả thuyết với tình thái suy
    đoán (''có thể là'', ''cũng có thể là'', ''biết đâu lại là''); ''feint'' -> ''đòn
    nghi binh''; ''main attack'' -> ''đòn tấn công chủ lực''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''The Federation'' -> ''Liên bang''; ''secret
    negotiations'' -> ''các cuộc đàm phán bí mật''; ''huge offensive'' -> ''cuộc tiến
    công quy mô lớn''; giữ hai khả năng song song (''Biết đâu...'', ''Hoặc cũng có
    khả năng...'')."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Sắc thái & nghĩa: giữ trạng ngữ chỉ cảm xúc ''Đáng bực mình ở
    chỗ'' và nhận định ''giả thuyết nào cũng có cơ sở hợp lý và đủ khả năng xảy ra''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc điều kiện đối lập, phủ định & thuật ngữ: giữ cặp điều
    kiện tiến thoái lưỡng nan (''Nếu chúng ta giáng trả... Nhưng nếu cứ tiếp tục rút
    lui...''); giữ quan hệ nhân quả do thiếu tình báo; ''Federation field army'' ->
    ''đạo quân dã chiến của Liên bang''; ''reserve forces'' -> ''lực lượng dự bị''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Staff officers'' -> ''Các sĩ quan tham
    mưu''; giữ phủ định ''không tài nào nắm bắt chính xác thực lực của kẻ địch''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định kép & câu hỏi đuôi: bọc câu nhận
    định sai lầm đầu đoạn trong dấu sao ''*Quân đội Liên bang không còn đủ khả năng
    mở một trận đánh lớn, ít nhất là vào lúc này.*'' theo DEC-P01-002; giữ cấu trúc
    phủ định kép ''Nếu không có... là điều bất khả thi''; ''creative accounting''
    -> ''thủ thuật xào nấu sổ sách''; giữ câu hỏi đuôi ''phải không?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi trách móc: Rudersdorf gọi Zettour là ''ông'',
    giữ giọng trách móc tự nhiên."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sự đối lập: Zettour xưng ''tôi'', giữ sự đối lập ''Ồ,
    có liên quan chứ. Trái lại là đằng khác...''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giọng thoại: giữ giọng mỉa mai nhẹ của Rudersdorf với
    cấu trúc phủ định ''Tôi không chắc một người giỏi khoản vét nhân sự như ông lại
    có tư cách nói câu đó đâu.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=[''Nhấn mạnh Markdown, thuật ngữ & phủ định: bọc chính xác hai cụm
    trong dấu nháy đơn kèm chữ nghiêng ‘*Cục Quân vụ*’ và ‘*những nhà giả kim*’ theo
    DEC-P01-002; giữ mệnh đề nhượng bộ và phủ định về giới hạn tài nguyên.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''logistical limitations'' -> ''những giới
    hạn về hậu cần''; giữ mô tả cử chỉ và giọng điệu căng thẳng của Rudersdorf."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Sắc thái: giữ câu xác nhận ngắn gọn ''Đáng tiếc thay, đúng là
    như vậy.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Rudersdorf gọi Zettour là ''Ông'' và dùng ''chúng
    ta'' trong câu hỏi dồn về việc rút lui."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Phủ định, thuật ngữ & điều kiện: giữ phủ định kép ''không thể
    phủ nhận điều đó''; ''eastern front'' -> ''mặt trận phía đông''; ''delaying defense''
    -> ''phòng ngự trì hoãn''; ''logistical burden'' -> ''gánh nặng hậu cần''; giữ
    cấu trúc phủ định mức độ đi kèm điều kiện ''Tôi không nói chúng ta phải lùi sâu
    một cách đột ngột, nhưng nếu ta có thể lùi về bất kỳ điểm nào khả thi...''."]'
