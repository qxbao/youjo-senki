choices:
- segment_id: YS-LN07/Text/chapter020.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn nối mạch: giữ ''“Tất nhiên là trên mặt chính thức rồi.”''
    khớp trực tiếp với câu hỏi ở p000086."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & cấp bậc: Tanya xưng ''tôi'', gọi Calandro là
    ''ngài'' và ''thưa Đại tá''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Phủ định giảm nhẹ & ẩn dụ: giữ ''một sự ăn ý ngầm'', ''những khoảng
    lặng hàm ý giữa các câu chữ'' và phủ định kép giảm nhẹ ''chẳng hề khó chịu chút
    nào''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & cấp bậc: Calandro gọi Tanya là ''Cô'' và giữ
    cấp bậc ''một trung tá bất lịch sự''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: giữ ''tôi trưởng thành từ chiến trường mà''
    để đối lập giữa sĩ quan tác chiến thực địa với giới tham mưu."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Dấu câu, phủ định & thuật ngữ: giữ dấu chấm lửng đầu câu, phủ
    định ''chẳng biết phải nói sao trước câu đó nữa'' và danh xưng ''Người được trao
    tặng Cánh Bạc''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn & tình thái: giữ ''“Có lẽ vậy ạ.”'' đúng sắc thái lịch
    sự xã giao của Tanya."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & tình thái: dùng ''mình'' theo DEC-P01-001; giữ
    tình thái ''Có lẽ'' và mốc thời gian ''một khi chiến tranh kết thúc''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ nội tâm: giữ chuỗi ''Ngừng bắn, bình định,
    và rồi hòa bình'' cùng đại từ nội tâm ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & tình thái: Calandro xưng ''tôi''; giữ ''không
    đọ lại được điều đó rồi'' và lời chào ''Chắc giờ tôi xin phép cáo từ thôi''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, phủ định & thuật ngữ: Tanya gọi Calandro là ''ngài'',
    xưng ''Tôi''; giữ câu hỏi gợi ý ''sao không đi thị sát chiến trường một vòng nhỉ?'',
    tên đơn vị ''Kampfgruppe Lergen'' và phủ định ''chẳng cho ngài xem được mấy''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: giữ sự pha trộn điểm nhìn giữa
    tên riêng ''Tanya'', đại từ ''ông'' quy chiếu Calandro, đại từ ''chúng tôi'' và
    cụm ''màn kịch “Kampfgruppe Lergen”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Thoại, quan hệ trực thuộc & thuật ngữ: giữ ''các sĩ quan chủ chốt
    của Kampfgruppe Salamander, đơn vị dưới quyền Kampfgruppe Lergen'' và xưng hô
    ''Tôi'' – ''ngài''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Thoại từ chối lịch sự: giữ ''“Tôi rất cảm kích lời đề nghị đó,
    nhưng không cần đâu.”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Ngài chắc chứ?”'' của Tanya hỏi Calandro."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nhân quả: chỉ bọc vế suy nghĩ ''*Chuyện tiếp
    đón chừng đó thì chúng ta có thể làm khá nhẹ nhàng mà…*'' trong dấu sao khớp thẻ
    em nguồn theo DEC-P01-002; giữ quan hệ nhân quả ''đang nghĩ vậy nên đâm ra bất
    ngờ''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm & cấp bậc: giữ ''Đại tá Calandro'', đại từ ''ông
    ấy'' và đại từ nội tâm ''Mình'' theo DEC-P01-001; không bọc dấu sao vì nguồn không
    có thẻ em."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Thoại, tên riêng & phủ định: giữ ''Đại tá von Lergen'' và phủ
    định ''mà chẳng gặp chút rắc rối nào''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Vậy tức là sao ạ?”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & lời chúc: giữ phủ định ''Tôi sẽ không làm phiền
    buổi ăn mừng của các cô đâu'' và lời chúc của Calandro."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ, phủ định & cấp bậc: chỉ bọc ''*Ngài
    không tham gia cùng chúng tôi sao?*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002;
    quy chiếu Tanya bằng ''Nó''/''nó'' theo DEC-P01-001; giữ cấu trúc phủ định ngoại
    trừ ''không nên làm những việc mà mình biết rõ đối phương sẽ chẳng thích với bất
    kỳ ai ngoài kẻ thù'' và danh xưng ''Trung tá Tanya von Degurechaff là một cá nhân
    biết lẽ thường''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn & xưng hô: giữ ''“Cảm ơn ngài. Chúng tôi sẽ tận hưởng
    ạ.”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ ''“Cứ tự nhiên nhé.”'' của Calandro."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô quân sự: dịch ''Yes, sir.'' của Tanya đối với
    Calandro là ''“Rõ, thưa Đại tá.”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ ''Kampfgruppe Salamander với Tanya
    dẫn đầu'' và ''lãnh thổ Liên bang''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ quân sự: giữ ''Chúng tôi đã tiêu diệt hoàn
    toàn nhiều quân đoàn.''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Đại từ, so sánh & thuật ngữ: giữ ''Chúng tôi'', hình ảnh so sánh
    ''chẳng khác nào cơn mưa lành'' và thuật ngữ ''tổ chức hậu cần của Lục quân Đế
    quốc''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Thoại, cấp bậc & ngữ cảnh: dịch ''Colonel!'' là ''Thưa Trung tá!''
    vì binh sĩ đang gọi Tanya; dịch ''One more shot!'' là ''Chụp thêm một kiểu nữa
    đi ạ!'' khớp ngữ cảnh chụp ảnh ở các đoạn kế tiếp."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Tanya xưng ''Tôi'', gọi thuộc cấp là ''các anh''
    trong câu đáp ''Tôi cũng sẽ chụp cho các anh vài kiểu nữa!''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Trần thuật ngắn: giữ ''Mọi người quây quần hòa vào nhau, gương
    mặt ai nấy đều rạng rỡ.''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Đại từ, dấu câu & phủ định: giữ cặp dấu gạch ngang dài tự đính
    chính ''—à nhầm, một chiến lợi phẩm—'', phủ định ''đâu phải chuyện ngày nào cũng
    có dịp làm'', ''chưa bao giờ nghĩ'' và đại từ trần thuật ''nó''/''mình'' quy chiếu
    Tanya theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Câu cảm thán trần thuật: giữ ''Đúng là một mùi hương tuyệt đẹp
    làm sao.''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ ''“Hửm? Khoan đã.”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ, điều kiện & phủ định: chỉ bọc từ tượng
    thanh ''*Khịt, khịt.*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ
    sự chuyển đổi đại từ từ ''nó'' (trần thuật theo DEC-P01-001) sang ''chúng tôi'',
    điều kiện ''Nếu đây là thật…'' và phủ định ''đã khá lâu rồi không được thấy ngoài
    tiền tuyến…''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi: giữ ''“Hả? Thứ đó ở đâu ra thế?”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: giữ ''khẩu phần đặc biệt từ Đảng kính
    yêu'', xưng hô ''thưa Trung tá!'' – ''Bọn tôi'', và ''sở chỉ huy địch''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, nghịch lý & thuật ngữ: chỉ bọc thán từ ''*Aaaa.*''
    trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ ''Liên bang'' và nghịch
    lý ''sự kinh hoàng ngọt ngào của nền kinh tế man rợ''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh & thuật ngữ: giữ ''Trung úy Serebryakov'', ''kinh
    phí của chúng ta'' và ''Kampfgruppe''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: Visha hỏi Tanya ''“Ngài chắc chứ, thưa
    Trung tá?”''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Tanya xưng ''tôi''/''chúng ta'', gọi
    Visha là ''cô''; giữ ''Mấy anh chàng bên đơn vị đổ bộ đường không'' và ''gửi lời
    tri ân của chúng ta''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Thoại đáp lệnh: Visha xưng ''Tôi'', giữ ''theo đúng tinh thần
    sẻ chia!''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Nhân quả, phủ định, giả định & thuật ngữ: giữ ''Lũ Cộng sản'',
    ''Chủ nghĩa Cộng sản'', phủ định giảm nhẹ ''biết đâu cũng chẳng tệ đến thế'',
    và cấu trúc giả định phản thực ''Nếu cái thông lệ phi sản xuất là tước đoạt từ
    người có của cứ tiếp diễn mãi mãi, thì hiệu quả phân phối trong một nền kinh tế
    cướp bóc như vậy hẳn sẽ tuyệt vời biết bao!''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & so sánh: giữ ''Trung úy Serebryakov'', ''kinh
    phí mật từ ngân quỹ của Kampfgruppe'', ''các đơn vị bạn'' và so sánh nhượng bộ
    ''vét được nhiều chiến lợi phẩm hơn mức họ có thể tiêu thụ hết dù quân số có đông
    đến đâu''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & so sánh: giữ ''nhiều căn cứ tiếp vận của Liên
    bang'', đại từ ''chúng tôi'' và đối sánh ''tình hình lương thực ngoài tiền tuyến
    khấm khá hơn hẳn ở hậu phương''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Điệp cấu trúc danh ngữ: giữ nhịp liệt kê ''chiến thắng tuyệt vời,
    bữa tiệc tuyệt vời, và hương vị của nền văn minh''."]'
- segment_id: YS-LN07/Text/chapter020.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Câu kết chương: giữ câu khẳng định ngắn gọn ''Chiến thắng quả
    thực tuyệt vời đến thế đấy.''."]'
