    ''aerial mages'' -> ''các pháp sư trên không''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=["Hô hiệu & thuật ngữ: giữ nguyên ''03 gọi 01''; ''enemy mage unit''
