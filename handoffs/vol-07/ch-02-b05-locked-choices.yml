- segment_id: YS-LN07/Text/chapter006.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu hỏi mỉa mai ngắn gọn ''“Ha, chỉ có bấy nhiêu thôi
    sao?”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật quy chiếu Tanya bằng ''nó'' theo
