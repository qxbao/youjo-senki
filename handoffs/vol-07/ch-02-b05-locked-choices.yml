  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''anti-aircraft cannons'' -> ''pháo phòng không'';
    ''artillery position'' -> ''trận địa pháo binh''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*…bắn trúng
    được chúng ta*'' và ''*Nếu chúng ta đang phải đối mặt với màn hỏa lực chặn đầu
    từ pháo phòng không… thì có lẽ chúng đã tính toán xong xuôi phần tử bắn cho vùng
    không phận này rồi!*'' khớp hai thẻ em nguồn theo DEC-P01-002; trong thoại Tanya
    xưng ''Tôi'', trần thuật quy chiếu bằng ''Nó'', nội tâm dùng ''chúng ta''; ''curtain
    fire'' -> ''màn hỏa lực chặn đầu''; ''firing solutions'' -> ''phần tử bắn''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh: giữ nguyên khẩu lệnh ''Break!'' kèm mệnh lệnh ''Tăng
    độ cao!''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: câu đầu trần thuật quy chiếu Tanya bằng ''nó''
    và ''mình''; câu hai dùng đại từ khái quát ''Bạn''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: trần thuật quy chiếu Tanya bằng ''nó''; giữ đúng
    trình tự thời gian ngay sau khi ngoặt khỏi đường bay tập kích thì đạn pháo phát
    nổ văng mảnh vào vị trí các pháp sư vừa bay qua."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: ''Timed fuses'' -> ''Ngòi nổ hẹn giờ''."]'
