- segment_id: YS-LN07/Text/chapter006.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật nêu tên ''Tanya''; ''her
    adjutant'' -> ''viên sĩ quan phụ tá''; ''aerial mages'' -> ''các pháp sư trên
    không''; ''air support'' -> ''yểm trợ đường không''; đại từ giả định khái quát
    dùng ''bạn''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh: giữ nhịp câu dứt khoát ''“Giao chiến với chúng!
