    chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000622
  kind: terminology_and_voice
  value: terms=['sở chỉ huy', 'Zettour', 'Quân đội Liên bang']; pov_and_pronouns=Thoại
