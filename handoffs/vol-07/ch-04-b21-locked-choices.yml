    nghiêng đúng vế cảm thán '*Không thể nào như thế được*' trước dấu phẩy theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000601
  kind: terminology_and_voice
  value: pov_and_pronouns=Câu cảm thán nội tâm kèm trần thuật; dùng 'nó' cho Tanya
    theo DEC-P01-001.; emphasis=In nghiêng đúng vế '*Ắt hẳn phải có sự nhầm lẫn nào
    đó*' trước dấu phẩy theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000602
  kind: terminology_and_voice
  value: pov_and_pronouns=Câu cảm thán nội tâm kèm trần thuật; dùng 'nó' cho Tanya
    theo DEC-P01-001.; emphasis=In nghiêng đúng vế '*Thật hết sức vô lý*' trước dấu
    phẩy theo DEC-P01-002.
