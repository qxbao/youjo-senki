- segment_id: YS-LN07/Text/chapter016.xhtml/p000605
  kind: terminology_and_voice
  value: terms=['THỦ ĐÔ ĐẾ QUỐC BERUN', 'VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC'];
