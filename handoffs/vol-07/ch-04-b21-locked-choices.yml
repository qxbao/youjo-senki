- segment_id: YS-LN07/Text/chapter016.xhtml/p000634
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại đáp ngắn của Uger; xưng 'Tôi' và có kính ngữ 'ạ'.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000635
  kind: terminology_and_voice
  value: terms=['Zettour']; pov_and_pronouns=Thoại ngắn kèm trần thuật ngôi thứ ba.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000636
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại kết đoạn của Zettour nói với Uger; xưng 'Tôi' – 'anh'.;
    emphasis=Không dùng chữ nghiêng.
