- segment_id: YS-LN07/Text/chapter016.xhtml/p000618
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại đáp ngắn của Zettour; giữ mệnh đề điều kiện ('Nếu
    điều đó là sự thật').; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000619
  kind: terminology_and_voice
  value: terms=['sở chỉ huy', 'túi vây', 'đại tướng']; pov_and_pronouns=Thoại báo
