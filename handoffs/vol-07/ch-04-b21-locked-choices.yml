    dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000623
  kind: terminology_and_voice
  value: terms=['binh lính Liên bang']; pov_and_pronouns=Thoại cảm thán của Zettour.;
