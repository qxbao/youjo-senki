    hoàn toàn').; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000609
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngôi thứ ba; dùng 'họ' cho các sĩ quan tham mưu.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000610
  kind: terminology_and_voice
  value: terms=['túi vây', 'sở chỉ huy', 'tiểu đoàn pháp sư trên không', 'đơn vị thiết
