- segment_id: YS-LN07/Text/chapter016.xhtml/p000632
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại nhận lệnh của Uger; xưng 'Tôi', gọi bên Tình báo là
    'họ', có kính ngữ 'ạ'.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000633
  kind: terminology_and_voice
  value: terms=['lệnh ngừng bắn']; pov_and_pronouns=Thoại của Zettour nói với Uger
    ('anh', 'chúng ta'); giữ cấu trúc phủ định ('Chỉ vì… không có nghĩa là…').; emphasis=Không
