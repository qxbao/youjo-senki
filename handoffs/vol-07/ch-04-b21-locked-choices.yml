    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000626
  kind: terminology_and_voice
  value: terms=['Moskva', 'Liên bang']; pov_and_pronouns=Trần thuật ngôi thứ ba; dùng
