    nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000625
  kind: terminology_and_voice
  value: terms=['Uger', 'Lục quân Đế quốc', 'mặt trận phía đông', 'đạo quân dã chiến
