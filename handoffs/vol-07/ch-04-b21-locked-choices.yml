    dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000629
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngắn đúc kết phương châm tác chiến.; emphasis=In
    nghiêng đúng cụm châm ngôn '*ứng biến thô sơ nhưng thần tốc ăn đứt trau chuốt
    mà chậm chạp*' theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000630
  kind: terminology_and_voice
  value: terms=['Zettour', 'Rudersdorf']; pov_and_pronouns=Độc thoại nội tâm trực
    tiếp của Zettour xen câu trần thuật; trong nội tâm Zettour tự xưng 'ta' nhất quán
    với giọng nhân vật.; emphasis=In nghiêng đúng hai phần độc thoại nội tâm ở đầu
    và cuối đoạn, giữ câu trần thuật ở giữa không in nghiêng theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000631
  kind: terminology_and_voice
  value: terms=['Trung tá Uger', 'bên Tình báo', 'Quân đội Liên bang']; pov_and_pronouns=Thoại
