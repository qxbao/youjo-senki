    chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000606
  kind: terminology_and_voice
  value: terms=['các sĩ quan tham mưu', 'Chiến dịch Búa Sắt', 'Norden']; pov_and_pronouns=Trần
