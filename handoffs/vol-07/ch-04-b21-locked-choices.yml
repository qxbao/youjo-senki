- segment_id: YS-LN07/Text/chapter016.xhtml/p000627
  kind: terminology_and_voice
  value: terms=['Lục quân Đế quốc']; pov_and_pronouns=Trần thuật ngôi thứ ba; giữ
    đúng giả định quá khứ trái thực tế ('Nếu cuộc tiến công này diễn ra muộn hơn…
