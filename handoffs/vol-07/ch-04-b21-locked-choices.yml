    '*Vòng vây đã bị phá vỡ ư?*' theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000608
  kind: terminology_and_voice
  value: terms=['Bộ Tổng tham mưu', 'Chiến dịch Búa Sắt', 'đạo quân dã chiến của địch'];
    pov_and_pronouns=Trần thuật ngôi thứ ba; dùng 'họ' cho phía Đế quốc và giữ cấu
