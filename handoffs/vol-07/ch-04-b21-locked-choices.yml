- segment_id: YS-LN07/Text/chapter016.xhtml/p000621
  kind: terminology_and_voice
  value: terms=['Đế quốc']; pov_and_pronouns=Trần thuật phân tích theo điểm nhìn của
    Zettour; giữ giả định trái thực tế ('Nếu đây là… thì thực ra lại đỡ đau đầu hơn')
