choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000187
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, nghĩa & thuật ngữ: giữ nét hóm hỉnh khi Tanya chia
    tay chiếc giường cùng giấc ngủ thân yêu để chạy tới ''sở chỉ huy'' (''headquarters'')
    và tiếng thở dài nén lại khi đọc ''bản tóm tắt tình hình'' (''the brief'')."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000188
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & thuật ngữ: giữ câu hỏi xác nhận mở đầu và nhận định
    chạm trán địch sớm hơn dự tính của ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000189
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: gọi Tanya là ''nó'' theo DEC-P01-001; giữ sắc
    thái khó kìm nén cơn thịnh nộ và những lời chỉ trích."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000190
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, cấu trúc tăng tiến & phủ định: dùng ''Mình'' cho
    Tanya (theo DEC-P01-001) và ''chúng ta'' cho lực lượng tiền tuyến; giữ cấu trúc
    tăng tiến ''Không phải nhanh hơn dự kiến mà là nhanh hơn bất cứ những gì chúng
    ta từng có thể tưởng tượng'' cùng mệnh đề phủ định lo ngại về nhận thức tình hình
    lệch pha của Bộ Tổng tham mưu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000191
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & độ mở: giữ nguyên hai câu hỏi nối tiếp về năng
    lực (''thiện chiến hơn'') và sức mạnh (''hùng mạnh hơn'') của địch so với ước
    tính của Bộ Tổng tham mưu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000192
  kind: terminology_and_voice
  value: 'choices=["Phủ định & so sánh: giữ nhận định phủ định ''chẳng phải một diễn
    biến thuận lợi cho Tanya'', sự đối lập giữa thể thao với chiến tranh, và so sánh
    hơn ''thực tế và có lời hơn nhiều''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000193
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & phủ định: dùng đại từ ''chúng ta'' / ''mình''; giữ
    giọng than thở châm biếm và phủ định ''thậm chí còn chẳng thể chọn được đối thủ
    mà mình muốn''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000194
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & câu điều kiện: gọi Tanya là ''nó'' theo DEC-P01-001;
    giữ câu điều kiện phủ định ''Nếu nó không loại bỏ mối đe dọa trước mắt trước tiên,
    tương lai của tự do tư tưởng sẽ lâm nguy.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000195
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & mệnh lệnh: giữ cách gọi ''Thiếu tá Weiss'' và câu lệnh
    ngắn gọn ''báo cáo chi tiết đi''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000196
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, phủ định & nhân quả: ''Captain Ahrens'' -> ''Đại úy
    Ahrens'' (đại từ ''anh ấy''); giữ thông tin phủ định ''Phía ta không chịu tổn
    thất nào'', số lượng ''Năm xe tăng địch đã bị tiêu diệt'' và quan hệ nhân quả
    ''vì bộ binh địch đã xuất hiện chi viện nên anh ấy quyết định rút lui''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000197
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi & quân hàm: giữ hai câu hỏi nghi vấn của Tanya về việc
    báo cáo đến muộn và khả năng máy vô tuyến gặp trục trặc; giữ danh xưng ''Đại úy
    Ahrens''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000198
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ sắc thái suy đoán dè dặt ''Có vẻ như ở đó vừa có
    một cơn mưa nhỏ.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000199
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, phủ định & câu hỏi: dùng ''mình'' và ''chúng ta''
    theo DEC-P01-001; giữ phủ định ''không muốn tin rằng chỉ một cơn mưa phùn cỏn
    con lại có thể gây ra rắc rối lớn đến thế'' và câu hỏi tự vấn cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000200
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép, dấu ngoặc kép & quan hệ nhân quả: giữ phủ định kép
    ''không thể loại trừ khả năng hỏng hóc cơ học'', dấu ngoặc kép mỉa mai quanh chữ
    “chính xác”, và chuỗi giải thích nguyên nhân thiết bị vốn chế tạo cho ''quê nhà''
    bị vắt kiệt công suất ngoài dự tính trên ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000201
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc chính xác câu nội tâm ''*Thật sự hết sức
    bực mình.*'' và âm thanh ''*chậc*'' trong dấu sao theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000202
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: lính gác gọi Tanya là ''Thưa Trung tá'' (''ma’am'')
    và báo tin ''Đại tá Calandro đã tới ạ!''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000203
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: gọi Tanya là ''nó'' theo DEC-P01-001; giữ hình
    ảnh ẩn dụ ''chuyển mạch suy nghĩ trong đầu nó''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thành ngữ: bọc chính xác câu cảm thán nội
    tâm ''*Họa vô đơn chí mà…*'' trong dấu sao theo DEC-P01-002; giữ mô tả động tác
    chào dứt khoát chuẩn sách giáo khoa."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: dịch lời chào ''Sir!'' của Tanya với Calandro là ''Thưa
    Đại tá!''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Calandro đáp lại Tanya là ''Cảm ơn cô, Trung
    tá.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & phủ định: trần thuật gọi Tanya là ''nó'' và
    tự quy chiếu nội tâm là ''mình'' theo DEC-P01-001; ''command post'' -> ''sở chỉ
    huy''; ''Colonel von Lergen'' -> ''Đại tá von Lergen''; giữ ý phủ định ''cũng
    chẳng giúp ích được gì nữa''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & phủ định: Calandro xưng ''tôi'', giữ lời xin lỗi lịch
    sự ''không cố ý làm gián đoạn công việc''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya dùng ''chúng tôi'' kèm tiểu từ lễ phép
    ''ạ'', giữ thuật ngữ ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: gọi Calandro là ''Ông'' / ''ông'',
    gọi Tanya là ''nó'' theo DEC-P01-001; giữ tình thái ''có vẻ hiểu ý nó là đừng
    bận tâm về chuyện đó''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Calandro gọi Tanya là ''Cô'', xưng ''tôi''
    trong câu hỏi nắm tình hình."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, chức danh & quân hàm: Tanya xưng ''Tôi''; ''duty officer,
    Major Weiss'' -> ''sĩ quan trực ban, Thiếu tá Weiss''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Đại từ, nghĩa & thuật ngữ: trần thuật gọi Tanya là ''Nó'' theo
    DEC-P01-001, gọi Weiss là ''anh''; sửa ''fill them in'' thành ''tóm tắt lại tình
    hình cho họ nắm''; giữ chuẩn các thuật ngữ ''đơn vị thiết giáp tiền tiêu'' và
    ''đơn vị bộ binh của Trung úy Tospan''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi: giữ câu hỏi ngắn gọn xác định vị trí chạm trán địch.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Weiss xưng ''tôi''; dịch ''on the grid''
    là ''trên lưới tọa độ''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc câu & xưng hô: giữ cấu trúc câu dẫn xen lời thoại ngắn
    bằng dấu gạch ngang dài và cách Weiss gọi Calandro là ''ngài''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & chi tiết: gọi Tanya là ''nó'' theo DEC-P01-001;
    giữ chi tiết Tanya phải trèo lên ghế để nhìn bản đồ và phản ứng muốn tặc lưỡi
    bực bội trước địa hình."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: gọi Tanya là ''nó'' theo DEC-P01-001,
    gọi Calandro là ''ông''; giữ tình thái ''có vẻ đã nắm khá rõ tình hình''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi đuôi & quân hàm: giữ câu hỏi xác nhận của Calandro về
    vị trí sát ''khu dân cư'' và danh xưng ''Trung tá'' gọi Tanya."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu đáp ngắn gọn đồng tình của Tanya ''Vâng,
    đúng là phiền phức thật.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Tình thái & tương phản: giữ các từ chỉ mức độ phỏng đoán (''có
    vẻ'', ''có lẽ'') về nguồn gốc bản đồ dân sự được trưng dụng và quan hệ tương phản
    ''nhưng nó vẫn làm tròn vai trò cung cấp một bức tranh cơ bản''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000222
  kind: terminology_and_voice
  value: 'choices=["Tự hiệu chỉnh & thuật ngữ: giữ nhịp tự đính chính trong nội tâm
    (''Không, xét về mặt kỹ thuật thì có lẽ nó giống một thị trấn hay ngôi làng hơn…'')
    và sự đối lập giữa địa hình nhiều ''vật che đỡ'' (''cover'') với một ''trận đánh
    dã chiến'' (''field battle'')."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Calandro xưng ''tôi'', giữ lời rào đón lịch
    thiệp và câu hỏi về thông lệ xử lý của ''Lục quân Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc chính xác câu cảm thán nội
    tâm ''*Đúng là một câu hỏi xoáy thẳng vào trọng tâm.*'' trong dấu sao theo DEC-P01-002;
    giữ chuẩn các thuật ngữ ''quan sát viên quân sự'', ''Lục quân Đế quốc'' và ''vị
    đại tá người Ildoa''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: giữ sự chuyển tiếp tự nhiên giữa
    đại từ nội tâm ''mình'' (''I suppose'') và đại từ trần thuật ''nó'' (''she has
    to tell him'') theo DEC-P01-001; giữ phủ định ''trên đời này làm gì tồn tại thứ
    tiện lợi như thế''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, dấu chấm lửng & phủ định: Tanya gọi Calandro là ''ngài'';
    giữ hai cụm dấu chấm lửng ngắt nhịp ngập ngừng, thuật ngữ ''bản quốc'', ''các
    quy trình tác chiến tiêu chuẩn'' và mệnh đề phủ định ''hiện tại chúng vẫn chưa
    được thiết lập''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi: giữ câu hỏi ngắn thể hiện sự ngạc nhiên của Calandro
    ''Thật vậy sao?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000228
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & giả định trái thực tế: trong thoại
    Tanya xưng ''Tôi'', trần thuật gọi Tanya là ''nó'' theo DEC-P01-001; giữ trọn
    hai cấu trúc giả định trái thực tế (''mọi chuyện sẽ dễ dàng hơn biết bao nếu có
    những quy trình đó'' và ''Giá như có một cách làm việc cứ chiếu theo sách vở mà
    áp dụng, nó có thể đơn giản làm theo đó và né được biết bao nhiêu là trách nhiệm'')."]'
