choices:
- segment_id: YS-LN07/Text/chapter002.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh & thuật ngữ: giữ định dạng viết hoa toàn bộ ''NGÀY
    20 THÁNG 4, NĂM THỐNG NHẤT 1927, TỌA ĐỘ CHƯA XÁC ĐỊNH TRÊN MẶT TRẬN PHÍA ĐÔNG'';
    không có chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & so sánh: ''bird’s-eye view'' -> ''góc nhìn chim bay'';
    ''avant-garde art'' -> ''nghệ thuật tiền phong''; giữ cấu trúc bổ sung tăng tiến
    ở câu sau (''Đã thế lại còn mang tính hình học hơn cả...'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Nhịp liệt kê & nghĩa: giữ nguyên phép điệp ba lần danh từ ''bùn
    lầy'' xen giữa ''Hố đạn pháo'', ''xác những con chiến mã gục chết'' và ''thương
    binh'' để khắc họa đầm lầy hỗn độn."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & sắc thái: giữ nhận định khái quát từ trên không rằng
    ngay cả những kẻ miễn cưỡng nhất cũng buộc phải thấm thía mối họa từ bùn lầy.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái: giữ các mệnh đề phủ định ''Thiếu vắng mọi
    đường nét phân định'', ''Chẳng có lấy một dấu hiệu rõ ràng nào của con đường mà
    theo bản đồ lẽ ra phải nằm ngay bên dưới'' và ''Không một ai có thể đọc chính
    xác vị trí này''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thoại & điểm nhìn: trần thuật ngôi thứ ba gọi Tanya là ''người
    chỉ huy Tanya''; giữ tiếng lẩm bẩm ''Hừm''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=[''Câu hỏi nội tâm & tình thái: giữ câu hỏi tu từ chất vấn về nhiệm
    vụ vốn được cho là chỉ đơn thuần bay dọc theo con đường.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc chính xác hai câu trích dẫn
    trực tiếp trong ''*...*'' theo DEC-P01-002, để ngoài dấu sao cụm ''họ đã bảo thế!''
    và ''họ đã nói vậy.''; ''main highway'' -> ''tuyến đường trục chính''; ''forward-most
    line'' -> ''tuyến tiền tiêu xa nhất''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: bọc toàn bộ câu hỏi nội
    tâm trong ''*...*'' khớp thẻ em nguồn theo DEC-P01-002; dùng ''chúng tôi'' và
    ''của mình'' cho đơn vị; ''celestial navigation'' -> ''phương pháp định vị thiên
    văn''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: trần thuật ngôi thứ ba
    quy chiếu Tanya bằng ''nó'' theo DEC-P01-001; chỉ bọc chữ ''*đâu đó*'' trong ngoặc
    kép theo DEC-P01-002; giữ phủ định giới hạn ''chẳng thể nào xác định rõ hơn ngoài
    mức''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định kép: trần thuật dùng ''nó'' cho Tanya và ''họ''
    cho cả nhóm; giữ cấu trúc phủ định song song ''không có lấy... cũng chẳng có...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''203rd Aerial Mage Battalion''
    -> ''Tiểu đoàn Pháp sư Trên không số 203''; ''search and destroy'' -> ''nhiệm
    vụ tìm và diệt''; ''air fleet'' -> ''không hạm đội''; ''Northern Sea'' -> ''Biển
    Bắc''; trần thuật quy chiếu Tanya bằng ''Nó'' theo DEC-P01-001; giữ phủ định ''Chẳng
    có lý do gì để họ phải gặp quá nhiều khó khăn...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Quan hệ chuyển ý: giữ câu trần thuật ngắn đối lập ''Ấy vậy mà
    Tanya vẫn phải kinh ngạc.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Tình thái & phủ định: giữ sự đối lập giữa dự kiến trên bản đồ
    và thực tế (''Trận địa quân ta lẽ ra phải ở gần đây lại chẳng thấy tăm hơi đâu'',
    ''Tuyến đường trục chính... đã chìm nghỉm dưới bùn lầy'', lính địch đi lại nơi
    chúng không được phép bén mảng tới)."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép, tình thái & đại từ: giữ phủ định kép ''không phải
    vô cớ'' và mức độ ''suýt chút nữa đã tán thành đề xuất quay đầu của cấp dưới'';
    trần thuật dùng ''nó'' cho Tanya."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''home country'' -> ''quê nhà''; trần thuật
    quy chiếu Tanya bằng ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ & đại từ: giữ đúng tính giả định trái thực tế
    trong quá khứ ''Giá mà mặc kệ họ thì đã nhẹ nợ hơn biết bao nhiêu!''; trần thuật
    dùng ''nó'' cho Tanya."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc câu đầu ''*Và đây là thứ
    chúng tôi nhận lại.*'' theo DEC-P01-002; câu trần thuật sau để chữ thường."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: giữ câu hỏi bực tức thành tiếng của Tanya và đại
    từ trần thuật ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & tình thái: ''friendly picket line'' -> ''tuyến
    cảnh giới của quân ta''; nội tâm tự thuật số nhiều dùng ''chúng tôi''; giữ tình
    thái ''lẽ ra phải là''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & cảm thán: giữ câu cảm thán ngắn ''Ấy thế mà!''; ''enemy
    anti-air position'' -> ''trận địa phòng không của địch''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Phủ định & tình thái: giữ phủ định tuyệt đối ''Chẳng có lấy nửa
    lời nhắc tới chuyện này'' và sắc thái ''trên thứ được cho là tấm bản đồ mới nhất
    hiện có''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ lời chửi thề và câu hỏi miệt thị năng lực quân
    nhà (''Khốn kiếp thật. Quân ta toàn một lũ nghiệp dư hay sao?'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ câu nhận xét ngắn làm cầu nối dẫn sang lời khen
    công binh địch ở đoạn sau.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''field engineers'' -> ''Công binh dã chiến'';
    giữ tình thái nhận định ''có vẻ là dân chuyên nghiệp đấy''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán: giữ dấu chấm lửng mở đầu lời đáp của Serebryakov,
    tình thái suy đoán quá khứ ''hẳn phải được dựng lên sau khi phòng tuyến của ta
    sụp đổ'' và ''xem chừng rất quyết tâm''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & phủ định kép: Tanya gọi cấp dưới là ''Cô''
    và ''Trung úy Serebryakov''; giữ phủ định kép ''nói không sai đâu''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: câu độc thoại nội tâm ngôi thứ nhất số nhiều
    dùng ''chúng tôi'' và ''của mình''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: độc thoại nội tâm ngôi thứ nhất số ít tự quy
    chiếu của Tanya dùng ''Mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái phủ định: ''General Staff'' -> ''Bộ Tổng
    tham mưu''; giữ tình thái suy đoán phủ định quá khứ ''hẳn đã không lường trước
    được chuyện này''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật quy chiếu Tanya bằng ''nó'' và
    đơn vị bằng ''họ''; ''pre-mission briefing'' -> ''buổi phổ biến trước nhiệm vụ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: trần thuật dùng ''Nó'' cho Tanya;
    giữ phủ định ''chẳng có ý kiến gì''; ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa: giữ câu nhận định ngắn giải thích việc điều chuyển chỉ
    đơn thuần là chấp hành mệnh lệnh.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: bọc chính xác ''*Nhảy
    đi*'' và ''*Cao bao nhiêu ạ?*'' theo DEC-P01-002; nội tâm tự quy chiếu của Tanya
    dùng ''Mình'' và ''chúng tôi'' (cho đơn vị) theo DEC-P01-001; ''General Staff''
    -> ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: câu lẩm bẩm thành tiếng đặt trong ngoặc kép nên
    Tanya tự xưng ''Tôi'' (phân biệt với ''Mình'' trong nội tâm không ngoặc kép);
    giữ dấu chấm lửng mở đầu."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ chuyển ý: giữ câu trần thuật đối lập dẫn sang lời than
    phiền thành tiếng ở đoạn kế tiếp.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: ''Eastern Army'' -> ''Tập đoàn
    quân phía Đông''; bọc chính xác cụm động từ ''*làm cái trò gì*'' khớp với thẻ
    em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa & mức độ: giữ nhận định rằng chỉ riêng việc kiềm chế không
    thẳng thừng mắng họ là lũ ngu đần đã là cả một sự thử thách đối với khả năng tự
    chủ.'']'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ nhân quả: ''frontline aerial magic officer''
    -> ''sĩ quan ma pháp trên không nơi tiền tuyến''; ''war college'' -> ''trường
    đại học quân sự''; ''General Staff'' -> ''Bộ Tổng tham mưu''; giữ quan hệ nhân
    quả giữa nỗi sợ phạm sai lầm do nền giáo dục chỉ huy cấp cao gieo vào và phản
    xạ ráo riết săn lùng tin tình báo mới."]'
