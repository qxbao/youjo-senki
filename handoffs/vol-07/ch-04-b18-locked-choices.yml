choices:
- segment_id: YS-LN07/Text/chapter016.xhtml/p000498
  kind: terminology_and_voice
  value: 'choices=["Thoại của Đại úy Meybert với Tanya: giữ tự xưng ''tôi'' và tiểu
    từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000499
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh của Tanya với Meybert: giữ xưng hô ''tôi'' – ''anh''
    / ''chúng ta'', phủ định ''không cao lắm'', ''quân đổ bộ đường không'' (airborne
    troops), và giữ đúng phạm vi nhấn mạnh Markdown ''*Đừng*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000500
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha nhận định nội tâm của Tanya: giữ ''Viên sĩ quan
    pháo binh'' (The artillery officer) và cấu trúc đối lập ''đáng được khích lệ chứ
    không phải trách cứ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000501
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya: giữ ''Tanya'', ''phó chỉ huy''
    (vice commander), ''Thiếu tá Weiss'' (Major Weiss), và nhịp bỏ lửng ''chúng ta…
    Hửm?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000502
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo khi quay về của Trung úy Serebryakov: giữ ''Tôi
    đã quay về rồi ạ.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000503
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya: giữ ''viên sĩ quan phụ tá'' (adjutant),
    ''Weiss'', ''Tanya'', ''Trung úy Serebryakov'' (Lieutenant Serebryakov), xưng
    hô ''cô'' trong thoại, và câu hỏi kiểm tra việc phá hủy cầu của các đơn vị khác."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000504
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của Serebryakov: giữ tình thái ''Hình như'' (Apparently),
    phủ định ''không được phép làm vậy'', và tiểu từ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000505
  kind: terminology_and_voice
  value: 'choices=["Thoại và trần thuật: giữ cặp câu hỏi ngắn của Tanya, đại từ ''nó''
    cho Tanya theo DEC-P01-001, và ''viên sĩ quan phụ tá'' (adjutant)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000506
  kind: terminology_and_voice
  value: 'choices=["Thoại của Serebryakov và nhận định của Tanya: giữ ''Lực lượng
    biệt kích dù'' (paratrooper rangers), phủ định ''không được làm hư hại nó'', ''quân
    ta'' (our control), và ''Quân đội Liên bang'' (Federation Army)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000507
  kind: terminology_and_voice
  value: 'choices=["Nội tâm và trần thuật: giữ đúng phạm vi nhấn mạnh Markdown ''*Chuyện
    quái gì thế này…?*'' theo DEC-P01-002 và tên riêng ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000508
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ hai cấu trúc điều kiện ''Nếu...''
    / ''Chỉ cần... thì...'' và phủ định kép ''không thể phủ nhận''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000509
  kind: terminology_and_voice
  value: 'choices=["Thoại của Weiss và trần thuật: giữ phủ định ''không thể phá hủy
    chúng'', danh xưng ''thưa Trung tá'' (Colonel), và tên riêng ''Weiss'', ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000510
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ ''Bộ Tổng tham mưu tham lam thật.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000511
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Weiss: giữ ''Tham lam ạ?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000512
  kind: terminology_and_voice
  value: 'choices=["Thoại và độc thoại phân tích của Tanya: giữ đại từ ''nó'' cho
    Tanya theo DEC-P01-001, ''vị phó chỉ huy'' (the vice commander), ''sĩ quan tham
    mưu'' (staff officer), ''diễn tập sa bàn'' (map maneuvers), và ''tuyến tiếp vận''
    (supply route)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000513
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ tình thái ''có lẽ'' (perhaps),
    ''Bộ Tổng tham mưu'' (General Staff), ''Quân đội Liên bang'' (Federation Army),
    và giữ đúng phạm vi nhấn mạnh Markdown ''*Nếu các người không chấp nhận các điều
    khoản của chúng tôi trong cuộc đàm phán này, chúng tôi sẽ tiến quân xâm lược.*''
    theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000514
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ ''đường tiến công'' (route to
    attack), phủ định ''Chẳng còn mấy cách nào khác'', và đại từ tự quy chiếu nội
    tâm ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000515
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ tương phản ''Nhưng dù có thể...
    lại đang...'', điều kiện phủ định ''Nếu không thể...'', và tình thái phản bác
    ''đáng lẽ phải là một phương án được tính đến chứ!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000516
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ tự xưng ''Tôi'' / ''chúng ta'', tình thái
    ''xem chừng'' (apparently), và ''cấp trên'' (the higher-ups)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000517
  kind: terminology_and_voice
  value: 'choices=["Thoại của Serebryakov và trần thuật điểm nhìn Tanya: giữ câu hỏi
    lễ phép có ''Trung tá'' / ''ạ'', tên riêng ''Serebryakov'', ''Tanya'', và địa
    danh ''Ildoa''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000518
  kind: terminology_and_voice
  value: 'choices=["Thoại chữa lời của Tanya: giữ ''Ồ, không có gì đâu. Đừng bận tâm.
    Cả hai người cứ quên chuyện đó đi.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000519
  kind: terminology_and_voice
  value: 'choices=["Thoại tuân lệnh của cấp dưới: giữ ''Rõ, thưa Trung tá.'' (Yes,
    ma’am.)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000520
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Viên sĩ quan phụ tá'' (adjutant), ''phó chỉ
    huy'' (vice commander), đại từ sở hữu ''của nó'' theo DEC-P01-001, và tên riêng
    ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000521
  kind: terminology_and_voice
  value: 'choices=["Trần thuật nội tâm của Tanya: giữ tên riêng ''Tanya'' và đại từ
    ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000522
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya với Meybert: giữ đại từ ''Nó'' theo
    DEC-P01-001, ''Đại úy Meybert'' (Captain Meybert), và xưng hô ''Tôi'' – ''anh''
    cùng ''cô ấy'' (quy chiếu Serebryakov)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000523
  kind: terminology_and_voice
  value: 'choices=["Thoại tiếc nuối của Đại úy Meybert: giữ ''…Tôi muốn hành động
    theo thẩm quyền riêng của mình ạ…''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000524
  kind: terminology_and_voice
  value: 'choices=["Thoại và trần thuật của Tanya: giữ ''Đại úy'' (Captain), ''bản
    quốc'' (home country), xưng hô ''tôi'' – ''anh'', đại từ trần thuật ''Nó'' theo
    DEC-P01-001, giữ đúng phạm vi nhấn mạnh Markdown ''*Tôi không thể cho phép chuyện
    đó. Chắc chắn là anh hiểu mà*'' theo DEC-P01-002, ''Đại úy Ahrens'' (Captain Ahrens),
    và ''đơn vị thiết giáp'' (armored unit)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000525
  kind: terminology_and_voice
  value: 'choices=["Thoại nhận nhiệm vụ của Đại úy Ahrens: giữ tự xưng ''chúng tôi''
    kèm ''ạ'', ''bộ binh của Trung úy Tospan'' (Lieutenant Tospan’s infantry), và
    ''mấy anh lính đổ bộ đường không'' (the airborne guys)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000526
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ huy của Tanya: giữ đại từ ''Chúng ta'' và mệnh lệnh
    khẩn trương lên đường chi viện cho các đơn vị khác."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000527
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha hiệu lệnh nội tâm: giữ tên riêng ''Tanya'', giữ
    đúng phạm vi nhấn mạnh Markdown ''*Lên đường thôi!*'' theo DEC-P01-002, và ''Tiểu
    đoàn Pháp sư Trên không số 203'' (203rd Aerial Mage Battalion)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000528
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''lực lượng pháp sư trên không'' (aerial mage
    forces) và ''mặt trận Rhine'' (the Rhine)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000529
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''mặt trận Rhine'' (the Rhine) và tên riêng ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000530
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''không hạm đội'' (air fleet / the fleet), ''trận
    đánh tiêu diệt'' (battle of annihilation), ''bầu trời phía đông'' (eastern skies),
    và ''tỷ lệ hoạt động'' (operating rate)."]'
