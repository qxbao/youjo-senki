choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000033
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu trích dẫn: ''the Empire'' -> ''Đế quốc''; ''cease-fire''
    -> ''lệnh ngừng bắn''; ''reparations'' -> ''bồi thường chiến phí''; ''local referendums''
    -> ''trưng cầu dân ý tại chỗ''; ''occupied areas'' -> ''các vùng chiếm đóng'';
    giữ nguyên cặp dấu nháy đơn trích dẫn điều khoản giả định."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000034
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Lergen tự xưng ''tôi'' trong hội thoại ngoại
    giao với Tướng Gassman; giữ sắc thái đánh giá giảm nhẹ ''với tôi những yêu cầu
    đó xem ra vẫn còn khiêm tốn chán''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000035
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & so sánh: Gassman xưng ''Tôi'' và gọi phía Đế quốc qua
    Lergen là ''các ngài'' / ''phía các ngài''; giữ cấu trúc so sánh hơn ''tham lam
    hơn nhiều so với mức đền bù đơn thuần có thể biện minh''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000036
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái nhượng bộ: ''home country'' -> ''bản quốc'';
    ''General Staff'' -> ''Bộ Tổng tham mưu''; ''safe space'' / ''safe zone'' -> ''không
    gian an toàn'' / ''vùng đệm an toàn''; giữ tình thái ''chắc chắn là lý do biện
    minh quá đủ đầy'' và mệnh đề nhượng bộ ''cho dù lợi ích lãnh thổ thu về có bị
    ép xuống mức tối thiểu đi chăng nữa''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000037
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép & nghĩa: giữ cấu trúc ''không còn lựa chọn nào khác
    ngoài gạt vấn đề quân hàm sang một bên và cứng đầu đối chọi trong chuyện này''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000038
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Lergen gọi Gassman là ''thưa Tướng quân''
    và ''ngài''; giữ giọng điệu ngoại giao lịch sự."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000039
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Gassman gọi Lergen là ''ngài''; giữ câu hỏi
    mỉa mai nhẹ ''Ồ? Vậy là ngài cũng có chút tự thức đấy chứ?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000040
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & dấu trích dẫn: Lergen xưng ''tôi'', gọi Gassman
    là ''ngài'', đại diện Đế quốc trong cụm nháy đơn ''chúng tôi yêu cầu''; giữ cấu
    trúc phủ định đối lập ''không phải quan điểm cá nhân của tôi mà là thượng lệnh
    nghiêm ngặt từ bản quốc''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000041
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trần thuật: bọc chính xác tiếng thở dài ''*Phù.*''
    khớp thẻ em nguồn theo DEC-P01-002; trần thuật gọi Gassman là ''vị tướng quân''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & câu hỏi tu từ: ''open negotiation'' -> ''đàm
    phán công khai''; ''working-level meeting'' -> ''cuộc họp cấp chuyên viên''; ''the
    Empire'' -> ''Đế quốc''; ''the Federation'' -> ''Liên bang''; giữ cấu trúc ''không
    phải... mà là...'' và câu hỏi phản vấn ''nhưng chẳng phải thái độ cứng nhắc đó
    của Đế quốc chính là lý do khiến Liên bang tấn công hay sao?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=[''Giọng thoại & nghĩa: giữ giọng đáp trả sắc lạnh của Lergen về
    trò lấy đề nghị đàm phán làm mồi nhử rồi kết thúc bằng tấn công của đám man rợ
    thời cổ đại.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & dấu ngắt câu: Gassman xưng ''Tôi'' (cá nhân) và ''chúng
    tôi'' (với tư cách đồng minh Ildoa); giữ dấu gạch ngang tự ngắt lời ''chúng tôi
    sẽ—phải, chúng tôi sẽ thực hiện các biện pháp thích đáng''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái ngoại giao: Lergen gọi Gassman là ''ngài'';
    giữ lời cảm ơn khách sáo và câu xã giao ''Xin ngài cứ liệu bề xử lý cho thỏa đáng''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trích dẫn: giữ câu ''“Cứ giao cho tôi”''
    trong ngoặc kép và chỉ bọc chữ ''*Cảm ơn*'' trong dấu sao khớp thẻ em nguồn theo
    DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định kép: trần thuật gọi Lergen là ''anh'' / ''mình'';
    giữ phủ định kép ''không thể phủ nhận rằng'' và phần giải thích trong cặp dấu
    gạch ngang."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''imperial embassy'' -> ''đại sứ quán Đế quốc'';
    ''General Gassman'' -> ''Tướng Gassman''; trần thuật dùng ''anh'' cho Lergen."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ câu cầu nguyện nội tâm ''*Xin
    hãy chiến thắng.*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ, thuật ngữ & đại từ: giữ đúng tính giả định trái
    thực tế ''Anh sẽ cảm thấy khá hơn biết bao nếu được ở lại mặt trận phía đông và
    đích thân chỉ huy Kampfgruppe Lergen!''; ''eastern front'' -> ''mặt trận phía
    đông''; ''Lergen Kampfgruppe'' -> ''Kampfgruppe Lergen''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Độc thoại thành tiếng & thuật ngữ: giữ dấu chấm lửng mở đầu ''…Hừ.''
    và thuật ngữ ''chỉ huy Kampfgruppe'' trong lời tự giễu của Lergen."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Đại từ & cấu trúc câu: trần thuật dùng ''anh'' cho Lergen; giữ
    dấu gạch ngang nhấn mạnh đối tượng niềm tin."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ định dạng viết hoa toàn bộ ''NGÀY 1 THÁNG 5
    NĂM THỐNG NHẤT 1927, THỦ ĐÔ ĐẾ QUỐC BERUN''; không dùng chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, cấp bậc & hình ảnh: ''War Room'' -> ''Phòng Tác chiến'';
    ''Lieutenant General von Rudersdorf'' -> ''Trung tướng von Rudersdorf''; giữ hình
    ảnh ẩn dụ ''những pháo đài tàn thuốc đang được đắp lên trong các gạt tàn''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi: ''eastern front'' -> ''mặt trận phía đông'';
    giữ câu hỏi ngắn gọn của Rudersdorf."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: trần thuật quy chiếu Rudersdorf
    bằng ''ông''; giữ phủ định nhấn mạnh ''hoàn toàn không lớn, nhưng lại vang rõ
    khắp phòng''; ''staff officer'' -> ''sĩ quan tham mưu''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''general offensive'' -> ''cuộc tổng tấn công'';
    ''Operations officer'' -> ''sĩ quan Cục Tác chiến''; ''organized retreat'' ->
    ''cuộc rút lui có tổ chức''; sĩ quan báo cáo dùng ''Chúng ta'' cho quân Đế quốc,
    trần thuật gọi viên sĩ quan là ''anh ta''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Cấp bậc & điểm nhìn: ''Lieutenant General von Zettour'' -> ''Trung
    tướng von Zettour''; giữ mô tả sắc mặt nghiêm nghị và giọng điệu mệt mỏi của Zettour."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''mobilization and supply stockpiling'' -> ''động viên
    và tích trữ tiếp vận''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & quan hệ nhân quả: giữ sắc thái lễ phép của
    cấp dưới báo cáo (''Không khả quan lắm ạ.''); ''forward depot'' -> ''kho tiếp
    vận tiền phương''; ''planned reorganization'' -> ''kế hoạch tái tổ chức''; giữ
    quan hệ nhân quả ''Vì... đành phải hoãn lại một thời gian ngắn''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & câu hỏi tu từ: ''forward depot'' -> ''kho tiếp vận
    tiền phương''; giữ quan hệ nhân quả do lùi chiến tuyến khá xa và câu hỏi tu từ
    chua chát cuối đoạn (''Có lẽ việc họ đã tiêu hủy hầu hết mọi thứ trước khi quân
    địch kịp chạm tay vào là điểm sáng duy nhất chăng?'')."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & điều kiện: giữ dấu chấm lửng mở đầu và cấu trúc điều
    kiện ''…Nhưng nếu đó mà gọi là điểm sáng, thì đủ hiểu tình hình đang tồi tệ đến
    mức nào.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & mức độ: ''air fleet'' -> ''Không hạm đội''; ''air
    superiority'' -> ''ưu thế trên không''; giữ mức độ ''vừa vặn giữ được ưu thế trên
    không tại tất cả các khu vực''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Đại từ, chỉ dẫn & câu hỏi xác nhận: trần thuật gọi Zettour là
    ''ông''; giữ chỉ dẫn giả định địch có thể được tăng viện để tiếp tục duy trì quyền
    kiểm soát bầu trời và câu hỏi xác nhận cuối đoạn (''...đấy chứ?'')."]'
