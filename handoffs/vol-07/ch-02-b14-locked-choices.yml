    chiếu địch bằng ''chúng''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000248
  kind: terminology_and_voice
  value: 'choices=["Tình thái: giữ mức độ suy đoán ''could be comparably few'' ->
    ''có thể sẽ tương đối ít''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000249
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & quân hàm: Serebryakov báo cáo với Tanya kèm tiểu
    từ ''ạ'', dùng ''Chúng ta''; ''Captain Meybert'' -> ''Đại úy Meybert'' (quy chiếu
