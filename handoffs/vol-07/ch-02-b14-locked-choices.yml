- segment_id: YS-LN07/Text/chapter008.xhtml/p000250
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, thoại & thuật ngữ: ''adjutant'' -> ''viên sĩ quan
    phụ tá''; ''CP'' -> ''CP''; ''Captain Ahrens'' -> ''Đại úy Ahrens''; ''skirmishing
    line'' -> ''đội hình tản khai''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000251
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & thuật ngữ: giữ nhịp dồn dập của bốn câu gọi cấp
    cứu qua vô tuyến; ''HQ'' -> ''Sở chỉ huy''; ''right flank'' -> ''Mạn sườn phải'';
    ''supporting artillery'' -> ''pháo binh yểm trợ''; ''air support mages'' -> ''Các
    pháp sư yểm trợ đường không''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000252
  kind: terminology_and_voice
  value: 'choices=["Thoại: Tanya ra lệnh kiểm tra tình hình hỗn loạn phía quân mình
    (''our troops'' -> ''Phía quân ta'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000253
  kind: terminology_and_voice
  value: 'choices=["Thoại, điểm nhìn & xưng hô: Serebryakov tự xưng ''Tôi'' kèm ''ạ'',
    gọi Tanya là ''Thưa Trung tá''; câu trần thuật mang điểm nhìn Tanya dùng ''cô
    ấy'' cho Serebryakov và giữ tình thái suy đoán ''Hẳn là cô ấy đã nhận ra''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000254
  kind: terminology_and_voice
  value: 'choices=["Thoại & sắc thái: giữ khẩu khí bực dọc của Tanya và câu hỏi xác
    nhận ''Vậy là mạn sườn phải đang bị giã tơi tả sao?''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000255
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, điều kiện & đại từ: độc thoại nội tâm của Tanya dùng
    ''Chúng ta''; giữ cấu trúc điều kiện nhượng bộ (''Ngay cả khi... nếu... thì chiến
    dịch cũng không thể tiến hành được''); ''main troops'' -> ''lực lượng chủ lực'';
    ''suppressed'' -> ''bị chế áp''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000256
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, phủ định & thuật ngữ: nội tâm của Tanya; giữ ẩn dụ
    khẩu ngữ ''ngồi không ăn bỏng ngô xem kịch'' và hệ quả nhân sự ''bị cách chức,
    điều chuyển hoặc giáng cấp''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000257
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nội tâm tự quy chiếu của Tanya dùng ''mình''
