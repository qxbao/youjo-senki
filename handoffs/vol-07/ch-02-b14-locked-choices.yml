    nấy...'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trần thuật: chỉ bọc ''*Nhưng mà…*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ nguyên phần trần thuật ''Tanya
    nhăn mặt.'' không in nghiêng."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhân quả & phủ định: giữ cấu trúc nhân quả giải thích
    vì sao ở cấp thấp việc răm rắp tuân lệnh bị lầm tưởng là phẩm chất cao quý nhất.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & đại từ: ''Adding value'' -> ''Tạo ra giá
