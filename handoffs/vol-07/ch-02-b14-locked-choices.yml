    ''bức tranh toàn cục''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000258
  kind: terminology_and_voice
  value: 'choices=["Đại từ & câu hỏi: dùng ''bạn'' cho đại từ khái quát ''you'' trong
