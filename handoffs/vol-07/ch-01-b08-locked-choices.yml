    quy chiếu bằng ''Nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Thoại, quan hệ nhân quả & thuật ngữ: giữ quan hệ nhân quả trong
