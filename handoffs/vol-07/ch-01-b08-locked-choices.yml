- segment_id: YS-LN07/Text/chapter002.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & phủ định: ''routed army'' -> ''đạo quân vỡ
    trận''; ''mechanized infantry'' -> ''bộ binh cơ giới''; ''Imperial Army'' -> ''Lục
    quân Đế quốc''; ''highway'' -> ''tuyến đường cái''; giữ phủ định ''Ngay cả...
    cũng không phải ngoại lệ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & đại từ: chỉ bọc ''*Đúng là một
