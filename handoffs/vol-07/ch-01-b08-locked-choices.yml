    câu nhận định ngoài thẻ em."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000308
  kind: terminology_and_voice
  value: 'choices=["Thoại & nghĩa: giữ câu nhận định khái quát ''“Đây là chiến tranh.
    Ai rồi cũng có lúc phải tới lượt chịu đòn thôi.”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=["Thoại, điểm nhìn, đại từ & thuật ngữ: Serebryakov xưng ''tôi'';
    ''the Rhine'' -> ''mặt trận Rhine''; trần thuật gọi ''Serebryakov'' và ''Tanya'';
