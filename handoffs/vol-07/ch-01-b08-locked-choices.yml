    nên đó ắt hẳn phải là...''; ''Federation Army'' -> ''Quân đội Liên bang''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Thoại & điểm nhìn: trần thuật gọi ''Tanya''; giữ khẳng định dứt
