- segment_id: YS-LN07/Text/chapter022.xhtml/p000042
  kind: terminology_and_voice
  value: 'choices=["Thoại xác nhận ngắn: giữ ''“Đúng vậy.”''; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000043
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: người nói xưng ''tôi''; ''Colonel
    von Lergen'' -> ''Đại tá von Lergen'', quy chiếu bằng ''anh ta''; ''a cease-fire
    agreement'' -> ''thỏa thuận ngừng bắn''; giữ dấu chấm lửng giữa câu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000044
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & câu hỏi xác nhận: xưng ''Tôi'', quy chiếu
    Lergen bằng ''Anh ta''; ''the Federation side'' -> ''phía Liên bang''; ''groping
    for the possibility of a cease-fire, right?'' -> ''đang dò dẫm tìm kiếm khả năng
    ngừng bắn, phải không?''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000045
  kind: terminology_and_voice
  value: 'choices=["Thoại & trần thuật: giữ ''“Phải,” Zettour đáp lời rồi nói tiếp.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000046
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: giữ địa danh ''Ildoa''; ''current demarcation
    line'' -> ''tuyến phân giới hiện tại''; ''Occupied territories'' -> ''Các vùng
    lãnh thổ bị chiếm đóng''; ''provisional control'' -> ''quyền kiểm soát lâm thời'';
    ''possession would not change hands'' -> ''quyền sở hữu sẽ không đổi chủ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000047
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện: ''the Empire'' -> ''Đế quốc''; ''final
    solution'' -> ''giải pháp chung cuộc''; ''Imperial Army'' -> ''Lục quân Đế quốc'';
    ''demilitarized zone'' -> ''khu phi quân sự''; giữ điều kiện ''Nếu cần thiết,
    vẫn có dư địa cho phép đóng quân chiếm đóng nhằm bảo đảm an ninh.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000048
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, giả định & đại từ: ''residents of occupied territories
    would vote on where they felt they belonged'' -> ''cư dân tại các vùng lãnh thổ
    bị chiếm đóng sẽ bỏ phiếu tự quyết xem họ cảm thấy mình thuộc về bên nào''; ''multiple
    nationalities'' -> ''tình trạng đa quốc tịch''; ''nominal reparations'' -> ''khoản
    bồi thường chiến phí mang tính danh nghĩa''; lược đại từ khái quát ''you'' (''có
    thể nói'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000049
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & dấu câu: giữ đại từ ''chúng ta'' - ''họ''; ''cease-fire''
    -> ''lệnh ngừng bắn''; giữ hai dấu chấm lửng trong câu."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000050
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi, xưng hô & phủ định: Rudersdorf gọi Zettour là ''Ông'';
    ''the Federation side'' -> ''phía Liên bang''; giữ phủ định và sắc thái dè dặt
    ''Rudersdorf không thể phủ nhận điều ấy, nhưng vẫn cảm thấy chuyện này có thể
    xuất phát từ những nguyên do khác.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000051
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & đại từ: ''belligerent states'' -> ''các quốc
    gia tham chiến''; ''the Ildoans'' -> ''người Ildoa''; ''our side'' -> ''phía chúng
    ta''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000052
  kind: terminology_and_voice
  value: 'choices=["Thoại & mức độ chắc chắn: giữ nhận định giới hạn ''“Rốt cuộc thì
    tất cả cũng mới chỉ dừng ở mức khả năng mà thôi.”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000053
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & đại từ: giữ ''chúng ta'' và ''kịch bản tồi tệ
    nhất''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000054
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi, xưng hô & danh xưng: Rudersdorf gọi ''Ông'' và
    ''Tướng von Zettour''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000055
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ trần thuật: chỉ bọc ''*Ra vậy.*''
    trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Zettour bằng ''Ông'',
    phía Đế quốc bằng ''họ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000056
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định kép: bọc chính xác câu nội tâm cuối
    đoạn ''*Sau một chiến thắng triệt để đến thế này, không đời nào việc đàm phán
    lại không thành công.*'' trong dấu sao khớp thẻ em nguồn; giữ phủ định ở cả phần
    dẫn (''vẫn không sao ngăn được'') và nội tâm (''không đời nào … lại không thành
    công'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000057
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''The remnants of the Republic'' -> ''Tàn
    dư của Cộng hòa''; ''the Commonwealth'' -> ''Khối Thịnh vượng chung''; ''could
    expect support'' -> ''có thể trông cậy vào sự hậu thuẫn''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000058
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái: ''The Commonwealth'' -> ''Khối Thịnh vượng
    chung''; ''the Federation and the Unified States'' -> ''Liên bang và Hợp chúng
    quốc''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000059
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''Unified States'' -> ''Hợp chúng quốc'';
    ''lend-lease and voluntary soldiers'' -> ''viện trợ theo chương trình cho thuê–cho
    mượn và các đội lính tình nguyện''; ''the Federation'' -> ''Liên bang''; giữ phủ
    định ''chẳng mấy mặn mà với việc tham chiến'' và ''không thể sánh được với sức
    nặng hiện diện của Liên bang''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000060
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & tình thái suy đoán: ''Federation Army’s overwhelming
    matériel superiority'' -> ''ưu thế áp đảo về vật tư và trang bị quân sự của Quân
    đội Liên bang''; ''must have been the pillar'' -> ''hẳn phải là trụ cột''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000061
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc tăng tiến & tình thái: ''the Empire'' -> ''Đế quốc'';
    giữ cấu trúc tăng tiến ''Không dừng lại ở đó, chiến công này hẳn còn gây chấn
    động và khiến tất cả các nước lân cận phải kinh sợ.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000062
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & tình thái: bọc toàn bộ câu ''*Với kết quả
    đó, hẳn là có thể giải quyết bằng con đường ngoại giao.*'' trong dấu sao khớp
    thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & dấu câu: quy chiếu Zettour bằng ''ông'';
    chỉ bọc phần độc thoại nội tâm ''*Một cuộc gọi từ đường dây trực tiếp ư? Vào đúng
    thời điểm này nghĩa là…*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm & dấu câu: giữ ''Trung tướng von Zettour'', dấu
    chấm lửng và ''Tôi đã rõ.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Tin tốt chứ?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: giữ ''Người bạn cũ của Zettour'', đại từ ''ông''
    quy chiếu Zettour và thuật ngữ ''Bộ Tư lệnh Tối cao'' (''Supreme Command'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & thuật ngữ: giữ ''Bộ Tư lệnh Tối cao'' (''Supreme
    Command'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc câu nội tâm xen
    giữa ''*Chỉ còn một chút nữa thôi.*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002;
    giữ đại từ ''Họ'', ''chúng ta'', ''ông'', ''mình'' và giữ nguyên danh từ tiếng
    Đức ''Heimat''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & tình thái: giữ đại từ ''Họ''/''họ''; phân
    biệt ''fatherland'' -> ''tổ quốc'' và ''homeland'' -> ''quê hương''; giữ tình
    thái suy đoán quá khứ và tương lai (''hẳn cũng đã bảo vệ … và con cháu mai sau
    của họ rồi cũng sẽ như vậy'')."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & quan hệ nhân quả: giữ ''Và đó là lý do hiện tại này
    tồn tại—như một di sản được kế thừa từ quá khứ.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & quân hàm: Zettour gọi Rudersdorf là ''Ông'' và
    ''Tướng von Rudersdorf''; ''marshal'' -> ''nguyên soái''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ sắc thái cho phép ''dường như lúc này, họ đã có
    thể cho phép bản thân đắm mình trong cảm giác kỳ lạ của một người vừa làm tròn
    bổn phận'' và cụm ''người đồng sự của mình''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & chức vụ: Rudersdorf xưng ''tôi'', gọi Zettour
    là ''ông''; ''merely a deputy'' -> ''chẳng qua chỉ là cấp phó mà thôi''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & phủ định: Zettour xưng ''Tôi'', gọi Rudersdorf
    là ''ông''; ''the Empire'' -> ''Đế quốc''; giữ phủ định ''Tôi không nghĩ Đế quốc
    lại mục nát đến mức làm ngơ trước những chiến công hiển hách nhường ấy đâu.''."]'
