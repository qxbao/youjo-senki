choices:
- segment_id: YS-LN07/Text/chapter022.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Rudersdorf xưng ''Tôi'', gọi Zettour là ''ông'';
    giữ dấu chấm lửng giữa và cuối câu; không có nhấn mạnh Markdown."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thoại & xưng hô: chỉ bọc ''*Thôi nào.*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002; Zettour gọi Rudersdorf là ''ông''
    và ''Người bạn của tôi''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: Rudersdorf xưng ''Tôi'' và tự quy chiếu bằng ''mình''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: Zettour xưng ''tôi''; ''the troops'' -> ''binh
    sĩ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Thoại & trần thuật: quy chiếu Rudersdorf bằng ''Ông''; giữ ''“Nợ
    binh sĩ.”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Thoại & dấu câu: giữ dấu chấm lửng và đại từ ''Họ'' quy chiếu
    binh sĩ."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & độc thoại nội tâm: bọc chính xác hai cụm
    ''*Chính vì thế…*'' và ''*Lần này mình phải đặt dấu chấm hết cho nó, bất kể phải
    trả giá ra sao.*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; Zettour tự
    quy chiếu bằng ''mình'' trong nội tâm."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: quy chiếu Zettour bằng ''ông''/''Ông''; giữ
    mạch đối lập ''Tuy có phần xa xỉ, nhưng ông có thể đặt niềm tin vào nó.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Trần thuật chuyển mạch: giữ ''Dẫu vậy, hãy thừa nhận điều đó đi.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & bị động: quy chiếu Zettour bằng ''ông''; giữ cấu
    trúc tự sửa lời ''Không, hãy thừa nhận rằng ông đã buộc phải thừa nhận điều đó.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & cấu trúc tăng tiến: bọc toàn bộ câu ''*Đó
    không chỉ là suy nghĩ viển vông mà còn là sự tắc trách.*'' trong dấu sao khớp
    thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: viết hoa toàn bộ ''CÙNG NGÀY HÔM ĐÓ, VÀO BUỔI CHIỀU,
    THỦ ĐÔ ĐẾ QUỐC BERUN, PHÒNG HỘI NGHỊ LIÊN LẠC, CUỘC HỌP CỦA BỘ TƯ LỆNH TỐI CAO''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & đại từ: ''Lieutenant General von Zettour''
    -> ''Trung tướng von Zettour'', quy chiếu bằng ''ông''; ''Supreme Command meeting''
    -> ''cuộc họp của Bộ Tư lệnh Tối cao''; ''Ildoa'' -> ''Ildoa''; ''post-victory
    course-of-action meeting'' -> ''phiên họp bàn về phương hướng hành động sau chiến
    thắng''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & dấu câu: ''civil servants'' -> ''các công chức dân
    sự''; giữ dấu chấm lửng và dấu ngoặc kép quanh từ ''“hiểu”''; không dùng nhấn
    mạnh Markdown."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown: bọc toàn bộ ''*Đáng lẽ phải vậy…*'' trong
    dấu sao khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Trần thuật đối lập: giữ ''Thế nhưng thứ đang cuộn xoáy trong phòng
    họp lúc này lại là một luồng cảm xúc dữ dội.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: nhóm quan chức xưng ''chúng tôi''; giữ sắc thái
    gay gắt ''những lời nhảm nhí đó''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: ''The bureaucrats'' -> ''Đám quan chức''; giữ hành
    động ''bật dậy đập bàn, công khai bộc lộ thái độ của mình''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: quan chức gọi Zettour là ''Ngài'' (''sir'');
    giữ dấu ''?!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thoại & xưng hô: chỉ bọc ''*tốt*'' trong dấu
    sao khớp thẻ em nguồn theo DEC-P01-002; gọi Zettour là ''ngài'', tự xưng ''chúng
    tôi''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Zettour xưng ''Tôi'' (''tôi''); giữ sắc thái
    lịch sự khách sáo ''Với tất cả sự tôn trọng, quả thực là vậy.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Thoại, danh xưng & thuật ngữ: ''General von Zettour'' -> ''Tướng
    von Zettour'', gọi là ''ngài''; ''the Empire'' -> ''Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Thoại ngắn: giữ ''“Tất nhiên.”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000098
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: giữ phủ định giảm nhẹ ''bầu không khí này
    chẳng dễ chịu chút nào''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000099
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & đại từ: giữ đại từ ''chúng ta'' và câu hỏi tu
    từ kết thúc bằng ''?!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000100
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, xưng hô & thuật ngữ: chỉ bọc ''*những điều
    khoản thế này*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; Zettour gọi
    các công chức là ''Các vị'', xưng ''tôi'' và dùng ''chúng ta'' khi nói về phía
    Đế quốc; ''cease-fire agreement and peace talks'' -> ''thỏa thuận ngừng bắn và
    đàm phán hòa bình''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, xưng hô & dấu câu: chỉ bọc ''*những*'' trong
    ''*những* điều khoản này'' khớp thẻ em nguồn theo DEC-P01-002; giữ cặp dấu gạch
    ngang dài, xưng ''tôi'' và gọi ''Tướng von Zettour'' / ''ngài''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & trần thuật: quy chiếu Zettour bằng ''Ông'';
    chỉ bọc ''*Đúng thế đấy.*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, dấu câu & đại từ: giữ dấu gạch ngang dài; ''imperial
    military power'' -> ''sức mạnh quân sự của Đế quốc''; quy chiếu phía quân đội
    bằng ''Họ'' và Zettour bằng ''ông''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, tình thái & đại từ: giữ tình thái suy đoán ''hẳn đã
    xem đấy là một sự khiêu khích''; quy chiếu các quan chức bằng ''Họ'' và Zettour
    bằng ''ông''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & điều kiện phủ định: quan chức xưng ''Tôi'' /
    ''chúng tôi'', gọi Zettour là ''ngài''; giữ câu điều kiện ''Nếu ngài cứ giữ im
    lặng thì chúng tôi không thể hiểu được đâu!''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ: giữ ''Zettour thấy mình bắt đầu lấy lại được
    sự điềm tĩnh'' trước cơn thịnh nộ của ''họ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & phủ định: quy chiếu Zettour bằng ''ông'', đối phương
    bằng ''họ''; giữ phủ định ''Chẳng có lý do gì khiến ông phải nổi nóng rồi bị cuốn
    theo luật chơi của họ cả.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định: ''having the initiative'' -> ''nắm giữ thế
    chủ động''; giữ phủ định một phần ''không nhất thiết đồng nghĩa với việc đánh
    mất thế chủ động ấy''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & nhượng bộ: quy chiếu Zettour bằng ''ông'', các quan
    chức bằng ''Họ''; giữ cấu trúc nhượng bộ ''Họ có thể hung hăng đấy, nhưng hung
    hăng thì cũng chỉ tổ tiêu hao năng lượng mà thôi.''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Thoại & mức độ chắc chắn: Zettour xưng ''Tôi'' - ''mình''; giữ
    sắc thái ''Tôi khá chắc là…''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thoại & xưng hô: chỉ bọc ''*ngài*'' và ''*quân
    đội*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ dấu chấm lửng đầu
    câu và danh xưng ''Tướng von Zettour''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đánh giá: giữ cấu trúc tương quan ''càng kích động
    bao nhiêu thì ông lại càng trở nên bình tĩnh bấy nhiêu'' và cụm ''đôi co với lũ
    ngu xuẩn'' theo điểm nhìn của Zettour."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Trần thuật gián tiếp: quy chiếu Zettour bằng ''Ông'', các quan
    chức bằng ''họ''; giữ tình thái ''hẳn họ phải tự biết điều đó chứ''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi ngắn: giữ ''“Vậy tức là sao?”''."]'
- segment_id: YS-LN07/Text/chapter022.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi tu từ & chức vụ: ''deputy chief of the Service Corps''
    -> ''Phó cục trưởng Cục Quân vụ''; ''general opinion of the army'' -> ''ý kiến
    chung của quân đội''."]'
