choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000229
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giả định trái thực tế: Calandro dùng ''các vị'' chỉ
    phía sĩ quan Đế quốc; giữ cấu trúc giả định trái thực tế ''Nếu các vị có một chính
    sách tiêu chuẩn, thì các vị đã có thể tránh được những vấn đề gai góc chỉ bằng
    cách áp dụng các quy tắc do cấp trên đề ra.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000230
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: gọi Calandro là ''ông'' và gọi Tanya là ''nó''
    theo DEC-P01-001; giữ phản ứng ''đành phải nhăn mặt'' khi bị nói toạc ra."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thành ngữ: Tanya gọi Calandro là ''ngài'', xưng ''chúng
    tôi''; giữ thành ngữ ''tiến lên với tốc độ rùa bò'' khi có ''khu dân cư'' chắn
    đường."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & nhân quả: giữ chuẩn các thuật ngữ ''công
    ước chiến tranh trên bộ'', ''Đế quốc'', ''tác chiến đô thị'', ''Liên bang'', ''điều
    ước quốc tế'', ''Lục quân Đế quốc'', ''chiến lược nội tuyến''; giữ nguyên các
    mệnh đề phủ định và giả định quá khứ ''lẽ ra họ phải nghĩ tới chuyện đó''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi & phủ định: giữ câu hỏi nghi vấn kèm dấu chấm lửng của
    Calandro và phủ định ''ngay cả những cựu binh dày dạn kinh nghiệm cũng không chắc
    phải làm gì sao…?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya xưng ''tôi'', gọi Calandro là ''thưa
    Đại tá''; giữ ý phản bác lịch sự ''thực tế lại ngược lại''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000235
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Calandro gọi Tanya là ''cô'' trong câu hỏi
    xác nhận ngắn ''Ý cô là ngược lại ư?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000236
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: gọi Tanya là ''nó'' (''các cấp dưới của nó'')
    theo DEC-P01-001; giữ sự tương phản giữa vẻ mặt khó hiểu của Calandro và cái gật
    đầu của cấp dưới."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000237
  kind: terminology_and_voice
  value: 'choices=["Phủ định & so sánh: giữ cấu trúc phủ định so sánh ''hầu như chẳng
    có nơi nào kém phù hợp cho chiến tranh hơn một khu dân cư'' và lý do có quá nhiều
    chướng ngại vật."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000238
  kind: terminology_and_voice
  value: 'choices=[''Giọng thoại: giữ nhận định khái quát của Tanya về những ai từng
    nếm trải kinh nghiệm cay đắng trong khu dân cư.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000239
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tên đơn vị: gọi Tanya là ''Nó'' theo DEC-P01-001;
    giữ chuẩn tên đơn vị ''Tiểu đoàn Pháp sư Trên không số 203''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000240
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Tanya xưng ''Tôi'' và gọi ''Thiếu tá Weiss''
    trong câu hỏi tìm sự đồng tình."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000241
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & thuật ngữ: trong thoại Weiss xưng
    ''tôi'' và gọi Tanya là ''Trung tá''; trong trần thuật gọi Tanya là ''nó'' theo
    DEC-P01-001; giữ tên ''Cộng hòa'' và chi tiết ''nụ cười méo xệch''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000242
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định: gọi Weiss là ''anh''; giữ phủ định
    kép ''không phải ngoại lệ trước quy luật rằng việc cảnh giới mọi hướng trong một
    khu dân cư gần như là bất khả thi''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000243
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, ẩn dụ & giả định: giữ thuật ngữ ''cảnh giới 360 độ'',
    hình ảnh ''cánh rừng bê tông'' và câu giả định cuối đoạn ''Mọi chuyện sẽ dễ dàng
    hơn biết bao nếu chúng ta có thể cứ thế đi vòng qua nó.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000244
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nghĩa literal: giữ mô tả phản ứng của Calandro trước
    tiếng thở dài của nhóm Tanya và dịch sát nghĩa câu thoại ''Ha-ha-ha. Điểm kinh
    nghiệm, hửm?''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000245
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu đáp ngắn gọn ''Đại loại là vậy.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000246
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Calandro xưng ''tôi'', gọi Tanya là ''cô''; giữ ý lùi
    sang một bên để tránh cản trở khi Tanya chỉ huy."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000247
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & quân hàm: Tanya cảm ơn Calandro bằng
    ''Cảm ơn ngài''; trần thuật gọi Tanya là ''Nó'' và Calandro là ''ông''; giữ danh
    xưng ''Thiếu tá Weiss''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000248
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Weiss xưng ''tôi'' / ''Chúng ta'' và dùng tiểu
    từ lễ phép ''ạ'' khi hỏi xác nhận lệnh xuất phát."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000249
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & chức danh: gọi Weiss là ''anh'', giữ chức
    danh ''phó chỉ huy'' và lời khen trong nội tâm của Tanya."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000250
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & quan hệ nhân quả: gọi Tanya là ''Nó'' / ''nó''
    theo DEC-P01-001; giữ quan hệ tương phản và nhân quả về bổn phận giải thích ý
    định của cấp trên."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000251
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & phủ định: giữ mệnh đề phụ phủ định ''những người chuyên
    nghiệp không quá ỷ lại vào nhau'' và yêu cầu truyền đạt, xác nhận ngắn gọn, chuẩn
    xác."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000252
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quân hàm: giữ thuật ngữ ''hiệu suất vô tuyến'', ''sở
    chỉ huy'', danh xưng ''Đại úy Ahrens'' và đại từ ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000253
  kind: terminology_and_voice
  value: 'choices=["Khẩu lệnh quân sự: dịch ''Understood!'' là ''Rõ!''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000254
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nội tâm: gọi Weiss là ''Anh'', tự quy chiếu
    nội tâm của Tanya dùng ''Mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000255
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, chức danh & xưng hô: bọc chính xác câu suy
    nghĩ trực tiếp ''*Ể, có lẽ gọi đó là làm thêm việc thì hơi thất lễ*'' trong dấu
    sao theo DEC-P01-002; giữ chức danh ''quan sát viên quân sự'' và cách Tanya gọi
    Calandro là ''ngài'' / ''thưa Đại tá''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000256
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Calandro gọi Tanya là ''cô'', xưng ''tôi'';
    giữ dấu gạch ngang dài và sắc thái hỏi vặn."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000257
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: Tanya xưng ''Tôi'' / ''tôi''; giữ
    đầy đủ ba mệnh đề phủ định và các thuật ngữ ''sở chỉ huy'', ''tiền tuyến'', ''các
    trận tao ngộ chiến''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000258
  kind: terminology_and_voice
  value: 'choices=["Dấu chấm lửng & nghĩa: giữ cụm danh từ bỏ lửng ''Đạn lạc hoặc
    những pha quấy rối từ một tay bắn tỉa ẩn nấp…''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, phủ định & thuật ngữ: gọi Tanya là ''Nó'' theo
    DEC-P01-001; giữ thuật ngữ ''tiền tuyến'', ''khu vực phi tác chiến'' và các khẳng
    định phủ định (''chẳng bao giờ được bảo đảm'', ''không phải kẻ lừa đảo'')."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & lập luận: trong thoại Tanya xưng ''Chúng tôi''; giữ
    mạch lập luận về ''tuân thủ quy định'', ''hình ảnh trước công chúng'' và yếu tố
    quan trọng nhất là ''luật pháp''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & phủ định kép: gọi Tanya là ''nó'' theo DEC-P01-001;
    giữ phủ định ''không thể xem nhẹ'' và mục đích ''bảo đảm không có vấn đề gì về
    mặt đạo đức''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000262
  kind: terminology_and_voice
  value: 'choices=["Cấu trúc lựa chọn & thuật ngữ: giữ cấu trúc ''Dù là để... hay
    để...'', thuật ngữ ''phát tín hiệu ngoài xã hội'' và tầm quan trọng của khâu xử
    lý ban đầu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: Tanya xưng ''Chúng tôi'', gọi Calandro
    là ''ngài''; giữ mệnh đề phủ định ''không thể bảo đảm'' và các thuật ngữ ''Liên
    bang'', ''quan sát viên quân sự'', ''Lục quân Hoàng gia Ildoa''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000264
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, dấu chấm lửng & phủ định: giữ dấu chấm lửng đầu câu;
    Calandro xưng ''Tôi'' / ''tôi'' / ''mình'', gọi Tanya là ''cô''; giữ phủ định
    ''không chắc mình đồng tình với việc bị đối xử như một đứa trẻ được bao bọc thái
    quá đâu'' và lời đề nghị được quan sát."]'
