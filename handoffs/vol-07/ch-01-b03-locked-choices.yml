choices:
- segment_id: YS-LN07/Text/chapter002.xhtml/p000063
  kind: terminology_and_voice
  value: 'choices=["Đại từ & mức độ: độc thoại nội tâm ngôi thứ nhất số nhiều của
    đơn vị dùng ''chúng tôi''; giữ đúng mức độ so sánh ''đông gấp hơn ba lần''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000064
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & địa danh: nội tâm tự quy chiếu của Tanya dùng
    ''Mình'' và ''chúng tôi'' (cho đơn vị) theo DEC-P01-001; giữ phủ định ''chẳng
    thích chuyện này chút nào''; ''Northern Sea'' -> ''Biển Bắc''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000065
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & quan hệ đối sánh: ''rationality'' -> ''tính
    hợp lý''; ''emergency evacuation'' -> ''rút lui khẩn cấp''; nội tâm tự quy chiếu
    dùng ''mình'' theo DEC-P01-001; giữ phép cân nhắc giữa tình yêu tính hợp lý/tự
    do và nhu cầu rút lui khẩn cấp."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000066
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & khẩu ngữ: lời nói thành tiếng đặt trong ngoặc
    kép dùng ''chúng ta''; giữ phủ định ''chẳng còn lựa chọn nào khác rồi'' và khẩu
    ngữ cảm thán ''Đúng là một mớ hỗn độn chết tiệt''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000067
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại: cấp dưới gọi Trung tá Tanya là ''Thưa Trung
    tá?''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000068
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & điểm nhìn: giữ mã gọi ''01 gọi tất cả các đơn
    vị'' và đại từ ''Tôi'' trong lệnh vô tuyến; câu sau chuyển sang trần thuật ngôi
    thứ ba gọi ''Tanya'' và chi tiết ''kìm lại tiếng tặc lưỡi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000069
  kind: terminology_and_voice
  value: 'choices=["Nghĩa & sắc thái: giữ nhận định khái quát về ''chân lý bất di
    bất dịch về những gì thực tại đòi hỏi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000070
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc cụm ''*Chuyện
    này bắt buộc phải làm thôi*'' khớp thẻ em nguồn theo DEC-P01-002; nội tâm tự quy
    chiếu dùng ''mình'' theo DEC-P01-001; ''orb'' -> ''quả cầu''; giữ nguyên ''Elinium
    Type 95''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000071
  kind: terminology_and_voice
  value: 'choices=["Đại từ & sắc thái đối nghịch: trần thuật ngôi thứ ba gọi ''Tanya''
    và quy chiếu bằng ''nó'' theo DEC-P01-001; giữ cụm nghịch lý ''sảng khoái đến
    mức kinh tởm'' cùng cảm giác ''minh mẫn và toàn năng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000072
  kind: terminology_and_voice
  value: 'choices=["Thoại cầu nguyện & thuật ngữ: ''O Lord'' -> ''Hỡi Chúa''; giữ
    văn phong trang trọng của lời khấn kích hoạt quả cầu."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000073
  kind: terminology_and_voice
  value: 'choices=["Đại từ & trạng thái: trần thuật quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; giữ tiếng thở dài ''“Haaah…”'' và hai trạng thái đối lập cùng lúc
    (''vừa kinh khủng không sao chịu nổi lại vừa phấn khích tột độ'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000074
  kind: terminology_and_voice
  value: 'choices=["Thoại địch & xưng hô: pháp sư Liên bang hô khẩu hiệu gọi đối phương
    là ''Lũ phản động ngoan cố!'' và xưng ''Ta'' – ''các ngươi''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000075
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm, đại từ & thuật ngữ: ''the wireless'' -> ''vô
    tuyến''; giữ câu hỏi tự vấn nghi hoặc về nguồn âm thanh và đại từ nội tâm ''mình''
    theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000076
  kind: terminology_and_voice
  value: 'choices=["Thoại chiến đấu, điểm nhìn & phủ định: trong thoại khiêu khích
    dưới tác động của Type 95, Tanya xưng ''ta'' và gọi địch là ''lũ Cộng sản'' /
    ''Đám cặn bã Cộng sản các ngươi''; câu chêm trần thuật gọi ''Tanya''; giữ phủ
    định tương lai ''thực tại sẽ không bị bóp méo bởi ý thức hệ đâu''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000077
  kind: terminology_and_voice
  value: 'choices=["Thoại địch, thuật ngữ & phủ định: giữ phủ định ''Chẳng ai thèm
    nghe'', thuật ngữ ''tổ quốc và của Đảng'', ''búa sắt của nhân dân'' và danh xưng
    miệt thị ''con phù thủy kia''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000078
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & giọng mỉa mai: trần thuật gọi ''Tanya'' và
    quy chiếu bằng ''nó'' theo DEC-P01-001; ''the Empire'' -> ''Đế quốc''; ''the Federation''
    -> ''Liên bang''; giữ giọng mỉa mai ở câu cuối khuyên pháp sư địch đào tẩu."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000079
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & thuật ngữ: nội tâm tự quy chiếu dùng ''mình''
    theo DEC-P01-001; giữ phủ định ''chẳng ưa gì''; ''Communists'' -> ''những người
    Cộng sản''; ''nationalists'' -> ''những kẻ theo chủ nghĩa dân tộc''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000080
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm & thuật ngữ: giữ câu hỏi tu từ đối lập giữa việc
    gắn bó với quê hương và việc coi trọng ''thực thể tưởng tượng mang tên tổ quốc''
    hơn mạng sống."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000081
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn: giữ câu trần thuật ngắn ngôi thứ ba ''Tanya dừng dòng
    suy nghĩ ở đó.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000082
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ điều kiện: ''Communist nationalists'' -> ''những
    kẻ theo chủ nghĩa dân tộc Cộng sản''; ''Federation Army'' -> ''Quân đội Liên bang'';
    giữ quan hệ nhượng bộ – điều kiện (''tuy chúng có thể là một dạng tà giáo, nhưng
    chừng nào chúng còn là ác quỷ thì chúng vẫn là kẻ thù của thần linh hoặc những
    thực thể tương tự'')."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000083
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: giữ phủ định ''Thần linh thực ra
    chẳng tồn tại'' và phủ định định ngữ ''không chấp nhận''; chỉ bọc từ ''*lập trường*''
    khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000084
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & phủ định: giữ phủ định ''Thật chẳng công
    bằng'' và ''không bao giờ có thể đồng thuận''; chỉ bọc cụm ''*sự thấu hiểu lẫn
    nhau*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000085
  kind: terminology_and_voice
  value: 'choices=["Đại từ & quan hệ nhân quả: nội tâm tự quy chiếu dùng ''Mình''
    / ''mình'' theo DEC-P01-001; giữ chuỗi lập luận dẫn tới kết luận ''Vậy nên mình
    sẽ ghi nhận họ''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000086
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện phủ định & thuật ngữ: dùng ''mình'' theo DEC-P01-001;
    giữ điều kiện phủ định ''Nếu không đánh giá điểm đó một cách công tâm, góc nhìn
    của mình không thể chối cãi sẽ bị thiên lệch''; ''modern intellectual integrity''
    -> ''sự liêm chính tri thức hiện đại''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000087
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhận định khái quát: ''intellectual honesty'' -> ''tính
    trung thực tri thức''; giữ mệnh đề khái quát ''Bất cứ ai muốn giữ sự công tâm
    đều cần phải tuân thủ...''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000088
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật ngôi thứ ba gọi ''Tanya''
    và quy chiếu bằng ''nó'' theo DEC-P01-001; ''intellectualism'' -> ''chủ nghĩa
    tri thức''; giữ sắc thái mỉa mai giữa tâm trí bị tiêm nhiễm lý tưởng phát buồn
    nôn và cảm giác ấm lòng."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000089
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ nhịp câu cảm thán dồn dập ''“Phải! Tốt! Rất
    tốt! Điều này xứng đáng nhận được một tràng pháo tay hoan hô!”''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000090
  kind: terminology_and_voice
  value: 'choices=["Quan hệ đối lập: giữ sự phân biệt giữa ''Khó mà gọi cảm giác ấy
    là dễ chịu'' và ''nhưng nó thật sự gây phấn khích''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000091
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & sắc thái: nội tâm tự quy chiếu dùng ''mình''
    theo DEC-P01-001; ''psychological contamination'' -> ''sự ô nhiễm tâm lý''; ''corrupting
    Type 95'' -> ''chiếc Type 95 gây tha hóa''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000092
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu trong ''*...*''
    khớp thẻ em nguồn theo DEC-P01-002; ''explosion formulas'' -> ''thuật thức phát
    nổ''; ''area suppression'' -> ''chế áp diện rộng''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000093
  kind: terminology_and_voice
  value: 'choices=["Nghĩa: giữ câu nhận định ngắn ''Về lý thuyết, đó là giải pháp
    tối ưu.''"]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000094
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, phủ định & giọng mỉa mai: ''aerial mages'' -> ''các
    pháp sư trên không''; giữ các phủ định ''gần như bất khả thi'', ''Không bao giờ
    được đánh giá thấp'', ''Đặc biệt là khi...'' và kết luận mỉa mai ''Chúng ta cần
    phải cư xử cho lịch thiệp và đảm bảo giết họ thật cẩn thận''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000095
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến & thuật ngữ: Tanya xưng ''Tôi'' khi phát lệnh cảnh
    báo toàn tiểu đoàn; ''explosive saturation fire'' -> ''hỏa lực nổ bão hòa''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000096
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; ''manifestation area'' -> ''phạm vi hiển hiện''."]'
- segment_id: YS-LN07/Text/chapter002.xhtml/p000097
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: trần thuật quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; ''intercept'' -> ''đánh chặn''; ''dense array of formulas'' -> ''trận
    liệt thuật thức dày đặc''."]'
