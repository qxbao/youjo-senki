choices:
- segment_id: YS-LN07/Text/chapter016.xhtml/p000464
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya: giữ ''các chỉ huy'' (commanders),
    ''các sĩ quan trực ban'' (officers on duty), ''mặt trận phía đông'' (eastern front),
    ''sở chỉ huy'' (command post), ''Thiếu tá Weiss'' (Major Weiss), đại từ ''nó''
    cho Tanya theo DEC-P01-001, và câu hỏi cảm thán của Tanya."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000465
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của Thiếu tá Weiss với Tanya: giữ danh xưng ''Vâng,
    thưa Trung tá…'' (Yes, ma’am…), ''sườn trái'' (left flank), ''đơn vị đổ bộ đường
    không'' (airborne unit), và tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000466
  kind: terminology_and_voice
  value: 'choices=["Trần thuật từ điểm nhìn Tanya: giữ đại từ ''Nó'' theo DEC-P01-001,
    ''bị bao vây hoàn toàn'' (completely encircled), và ''bên sườn trái'' (left flank)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000467
  kind: terminology_and_voice
  value: 'choices=[''Nhận định nội tâm của Tanya: giữ cấu trúc tăng tiến từ đang chịu
    áp lực lớn sang sắp vỡ tung tới nơi.'']'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000468
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ cảm thán ''Đột ngột quá… Thật là một cảnh
    tượng không thể tin nổi.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000469
  kind: terminology_and_voice
  value: 'choices=["Trần thuật kết hợp nội tâm Tanya: giữ đại từ ''nó'' và tự quy
    chiếu ''mình'' theo DEC-P01-001, tên riêng ''Tanya'', và giữ đúng phạm vi nhấn
    mạnh Markdown ''*Thật hết sức vô lý—!*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000470
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ câu hỏi tu từ mở đầu, đối lập
    giữa ''về mặt lý thuyết'' và ''trên thực tế'', cùng phạm vi ''lịch sử quân sự
    ở bất kỳ thời đại hay nơi chốn nào''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000471
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ địa danh ''Cannae'', tỷ lệ ''chỉ
    bằng phân nửa quân số của mình'', và ''lực lượng bộ binh nặng tinh nhuệ'' (elite
    heavy infantry)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000472
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ phủ định kép ''Cũng không phải
    là không có'', ''trận Dyrrhachium,⁸'' kèm chú thích số 8, tỷ lệ ''một chọi ba'',
    và đại từ giả định khái quát ''bạn''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000473
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ phủ định kép ''không phải là
    không tồn tại'', ''trận Chipyong-ni'', đại từ nội tâm ''mình'' theo DEC-P01-001,
    ''trung đoàn'' (regiment), ''quyền làm chủ bầu trời'' (air supremacy), và ''quy
    mô của cả một đạo quân'' (the scale of a whole army)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000474
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha nội tâm Tanya: giữ địa danh ''Austerlitz'' và ''Tannenberg'',
    tên riêng ''Tanya'', và phủ định ''chẳng bao giờ nghi ngờ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000475
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi nội tâm của Tanya: giữ ''Ấy thế mà giờ đây vòng vây lại
    đang bị phá vỡ ư?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000476
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya: giữ ''cơ động một cách có tổ chức'' (maneuver
    in an organized way), ''các tuyến phòng ngự'' (defensive lines), và các câu hỏi
    truy vấn tình hình quân ta."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000477
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm của Tanya: giữ ''đơn vị đổ bộ đường không''
    (airborne unit), ''chế áp điểm vượt sông'' (suppressed the crossing), ''cả hai
    bên sườn'' (both flanks), ''đơn vị tiếp viện'' (reinforcing units), và ''lực lượng
    thiết giáp'' (armor)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000478
  kind: terminology_and_voice
  value: 'choices=["Nội tâm và trần thuật: giữ chuỗi ba câu hỏi nội tâm mở đầu, giữ
    đúng phạm vi nhấn mạnh Markdown ''*Không.*'' theo DEC-P01-002, tên riêng ''Tanya'',
    tự quy chiếu ''mình'', và ''biện pháp khắc phục'' (remedial measures)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000479
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh của Tanya: giữ ''Khốn kiếp! Mau tập hợp tất cả
    mọi người lại đây!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000480
  kind: terminology_and_voice
  value: 'choices=["Thoại của Thiếu tá Weiss với Tanya: giữ tự xưng ''Tôi'', ''quán
    xuyến trận địa'', ''chi viện cho công tác phòng ngự'', và tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000481
  kind: terminology_and_voice
  value: 'choices=[''Thoại của Tanya với Weiss: giữ nhịp đồng ý rồi lập tức bảo khoan
    đã.'']'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000482
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đại từ ''Nó'' cho Tanya theo DEC-P01-001, ''Thiếu
    tá Weiss'' (Major Weiss), và ''người sĩ quan trẻ tuổi dễ sai bảo nhất''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000483
  kind: terminology_and_voice
  value: 'choices=["Thoại giao việc của Tanya cho Grantz: giữ ''Trung úy Grantz!''
    (Lieutenant Grantz!) và xưng hô ''tôi'' – ''anh''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000484
  kind: terminology_and_voice
  value: 'choices=["Thoại tuân lệnh của Grantz: giữ ''Rõ, thưa Trung tá! Tôi đi ngay
    đây ạ!'' (Yes, ma’am! Right away!)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000485
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại ra lệnh của Tanya: giữ ''Tanya'', ''Trung
    úy Serebryakov'' (Lieutenant Serebryakov), xưng hô ''cô'' với Serebryakov, ''đơn
    vị đổ bộ đường không'' (airborne unit), và ''lực lượng bộ binh của Trung úy Tospan''
    (Lieutenant Tospan’s infantry)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000486
  kind: terminology_and_voice
  value: 'choices=["Thoại nhận lệnh của Serebryakov: giữ ''Tôi làm ngay ạ!'' (On it!)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000487
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Weiss: giữ ''Thiếu tá Weiss'' (Major Weiss),
    xưng hô ''tôi'' – ''anh'' / ''chúng ta'', ''ứng trực chờ lệnh'' (stand by), và
    giả định ''một cuộc đào thoát có tổ chức'' (an organized escape)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000488
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Đại úy Meybert: giữ đại từ ''nó'' cho
    Tanya theo DEC-P01-001, ''Thưa Trung tá!'' / ''xin Trung tá'' (Colonel!), ''Đại
    úy Meybert'' (Captain Meybert), ''khu vực pháo kích'' (bombardment zone), ''pháo
    binh'' (artillery), và ''màn pháo kích'' (artillery barrage)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000489
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya và trần thuật phân tích: giữ xưng hô ''Anh'' với
    Meybert, tên riêng ''Tanya'' và ''Meybert'', ''pháo tự hành'' (self-propelled),
    ''đạn dẫn đường chính xác'' (precision-guided munitions), và ''pháo kích gián
    tiếp'' (indirect shelling)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000490
  kind: terminology_and_voice
  value: 'choices=["Thoại của Đại úy Meybert: giữ tự xưng ''chúng tôi'', ''hỏa lực
    bắn thẳng'' (direct fire), ''chướng ngại vật tạm thời'' (temporary obstruction),
    và tiểu từ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000491
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Tanya: giữ ''Các anh bắn trúng nó được à?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000492
  kind: terminology_and_voice
  value: 'choices=["Thoại của Đại úy Meybert: giữ ''Chỉ cần Trung tá ra lệnh cho chúng
    tôi ạ.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000493
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya: giữ tên riêng ''Meybert'' và ''Tanya'',
    đại từ ''anh ta'', tình thái ''có lẽ'' (probably), ''tạm thời chấp thuận'' (tentatively
    accepts), và ''Đại úy Meybert'' (Captain Meybert)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000494
  kind: terminology_and_voice
  value: 'choices=["Thoại của Đại úy Meybert: giữ cặp câu hỏi ''Ai sẽ là người quyết
    định việc chúng ta có phá hủy nó hay không ạ? Tôi quyết định được chứ?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000495
  kind: terminology_and_voice
  value: 'choices=["Thoại kìm lại của Tanya: giữ ''Đừng vội manh động, Đại úy.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000496
  kind: terminology_and_voice
  value: 'choices=["Trần thuật nội tâm của Tanya: giữ đại từ ''nó'' cho Tanya theo
    DEC-P01-001, ''anh ta'' cho Meybert, và ba khả năng song hành trong suy đoán của
    Tanya."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000497
  kind: terminology_and_voice
  value: 'choices=["Thoại và trần thuật của Tanya: giữ xưng hô ''Tôi'' – ''Anh'' /
    ''chúng ta'', đại từ ''Nó'' trong trần thuật theo DEC-P01-001, và giữ đủ các cấu
    trúc phủ định (''không được quên'', ''không phải là phương án tối ưu'', ''không
    quên nhấn mạnh'')."]'
