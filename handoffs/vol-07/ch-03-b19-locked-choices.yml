choices:
- segment_id: YS-LN07/Text/chapter012.xhtml/p000360
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quy chiếu & phủ định: Tanya xưng ''Tôi''; giữ cấu trúc
    phủ định rào đón ''Tôi sẽ không bảo ... phải nương tay với kẻ địch đâu, nhưng
    có lẽ ... nên xem xét lại...''; đổi cả ''các người'' và ''hai người'' thành ''cô''
    (quy chiếu Trung úy Serebryakov) theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000361
  kind: terminology_and_voice
  value: 'choices=["Quân hàm trong thoại: giữ câu cảm thán ''“Trung tá?! Thiếu tá?!”''
    của Serebryakov khi phản ứng trước lời trêu của Tanya và Weiss."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000362
  kind: terminology_and_voice
  value: 'choices=["Dấu thoại ba lớp & thuật ngữ: giữ nguyên cặp ngoặc kép ba lớp
    ''“““Ha-ha-ha!”””'' và cụm ''sở chỉ huy Kampfgruppe''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000363
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ, đại từ trần thuật & tôn ti chỉ huy: giữ ''Trung
    úy Serebryakov'' (''cô''), ''Thiếu tá Weiss'' (''anh''), ''lực lượng đoạn hậu'',
    ''Đại úy Ahrens'' (''anh''), ''tiểu đoàn pháp sư trên không'', ''lực lượng thiết
    giáp'', ''Trung úy Tospan'', ''Đại úy Meybert'', ''pháo binh'', ''Đại tá Calandro'';
    trần thuật gọi tên ''Tanya'' và quy chiếu bằng ''nó'' / ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000364
  kind: terminology_and_voice
  value: 'choices=["Thoại quân lệnh: giữ câu đáp ngắn gọn ''“Rõ!”''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000365
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, chức danh & nhấn mạnh Markdown: quy chiếu Tanya
    bằng ''nó'' / ''Nó'' theo DEC-P01-001; giữ ''viên sĩ quan phụ tá'' / ''phụ tá''
    và tên ''Serebryakov''; chỉ bọc ''*Chẳng phải ở đâu cũng tìm được sự hỗ trợ như
    thế.*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000366
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & ẩn dụ công sở: giữ ''Thiếu tá Weiss'', ''Trung
    úy Grantz'', đại từ bao gộp ''Chúng ta'' và ''cấp quản lý không được trả lương
    làm thêm giờ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000367
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới: Grantz xưng ''tôi'' và dùng kính ngữ ''ạ'' khi
    đáp lời Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000368
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, nhấn mạnh Markdown, thuật ngữ & xưng hô: quy
    chiếu Tanya bằng ''nó'' theo DEC-P01-001; chỉ bọc ''*Đúng rồi, Weiss là cấp trung,
    nhưng Grantz thì vẫn ở cấp thấp hơn.*'' khớp thẻ em nguồn theo DEC-P01-002; trong
    thoại Tanya xưng ''tôi'', gọi Grantz là ''anh'', giữ ''trung úy'' và ''bên Pháp
    chế và Tổng vụ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000369
  kind: terminology_and_voice
  value: 'choices=["Xưng hô cấp dưới: Grantz gọi Tanya là ''Trung tá'', xưng ''tôi''
    và dùng kính ngữ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000370
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: giữ ''pháp sư trên không'', ''xuất kích khẩn
    cấp'', ''phụ cấp bay'', ''phụ cấp phản ứng nhanh'', ''trợ cấp làm thêm giờ'';
    Tanya gọi Grantz là ''anh''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000371
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới & thuật ngữ: Grantz xưng ''tôi ... ạ'', giữ ''nhà
    quản lý đến từ quê nhà''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000372
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái & nghĩa: giữ tên ''Grantz'', ''Tanya'',
    ''Weiss'' và tình thái suy đoán ''hẳn Grantz đã...''; chỉ bọc ''*Tốt lắm*'' khớp
    thẻ em nguồn theo DEC-P01-002; đổi ''nụ cười gượng gạo'' thành ''nụ cười nửa miệng''
    (hoặc ''nụ cười hóm hỉnh'') theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000373
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: Tanya xưng ''tôi'', giữ ''sĩ quan Bộ Tổng
    tham mưu'', ''trường đại học quân sự'' và ''hành chính quân sự''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000374
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới: giữ câu hỏi ngắn ''“Vậy thì sao ạ?”''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000375
  kind: terminology_and_voice
  value: 'choices=["Giả định trái thực tế: giữ cấu trúc điều kiện ''Nếu có thể, tôi
    đã kiếm lấy...''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000376
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, thuật ngữ & đại từ: trần thuật gọi tên ''Weiss'' và
    quy chiếu bằng ''anh''; trong thoại Weiss gọi Tanya là ''Trung tá'', dùng ''hậu
    phương'' và kính ngữ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000377
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & phủ định: Tanya gọi Weiss là ''Thiếu tá''
    và ''anh'', xưng ''tôi''; giữ câu phủ định ''Đâu phải tôi từng mong mỏi được phục
    vụ ngoài tiền tuyến đâu.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000378
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới: giữ kính ngữ ''ạ'' khi Weiss bày tỏ sự ngạc nhiên
    với Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000379
  kind: terminology_and_voice
  value: 'choices=["Xưng hô chỉ huy: Tanya hỏi Weiss bằng đại từ ''anh'' (không dùng
    ''ạ'')."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000380
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thoại cấp dưới: giữ cấu trúc phủ định ''chẳng giống
    điều mà một vị sĩ quan từng đặt chân lên hầu khắp mọi mặt trận sẽ nói chút nào
    ạ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000381
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: quy chiếu Tanya bằng ''Nó'' / ''nó''
    / ''mình'' theo DEC-P01-001; giữ tên ''Weiss'', tình thái ''Có lẽ'' và cụm ''sự
    cân bằng giữa công việc và cuộc sống''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000382
  kind: terminology_and_voice
  value: 'choices=["Giả định quá khứ, đại từ trần thuật & địa danh: giữ câu cảm thán
    giả định trái thực tế ''Giá mà chuyện đó không phải sự thật thì đã tốt biết bao—tốt
    hơn biết nhường nào!'', đại từ trần thuật ''Nó'', địa danh ''Norden'' và tình
    thái ''dường như''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000383
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & quy ước nhấn mạnh: câu độc thoại nội tâm của
    Tanya dùng đại từ tự quy chiếu ''mình'' theo DEC-P01-001, giữ định danh ''Being
    X'' và không tự thêm dấu *...* khi nguồn không in nghiêng theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000384
  kind: terminology_and_voice
  value: 'choices=["Tình thái & kính ngữ: giữ tình thái ''Có lẽ'' và tiểu từ ''ạ''
    trong lời Weiss nói với Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000385
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, giả định & đại từ: chỉ bọc ''*Nein!*'' khớp
    thẻ em nguồn theo DEC-P01-002; giữ giả định ''Anh không tưởng tượng nổi tôi sẽ
    nhẹ nhõm đến nhường nào nếu có thể...'', đại từ trần thuật ''Nó'', và xưng hô
    ''tôi'' – ''anh'' / ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000386
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & kính ngữ: Grantz gọi Tanya là ''thưa Trung tá'', xưng
    ''tôi'' và dùng ''ạ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Tanya gọi ''Trung úy Grantz'' bằng ''anh''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, tình thái & phân tầng xưng hô: giữ ''Thiếu tá Weiss'',
    ''Grantz'', ''Tanya'' và tình thái ''Hẳn anh cũng có đôi điều suy nghĩ trong lòng'';
    trong thoại Weiss xưng ''Tôi'' và gọi Grantz là ''cậu''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & đại từ ngôi thứ ba: gọi tên ''Tanya''; đổi ''cậu
    ta'' thành ''cậu ấy'' (chỉ Grantz) theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000390
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & kính ngữ: Weiss gọi Grantz là ''cậu ấy'' và dùng kính
    ngữ ''ạ'' khi đề xuất với Tanya."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, xưng hô & thuật ngữ: Tanya gọi ''Trung úy Grantz'' bằng
    ''anh'', xưng ''tôi'', giữ ''học viện'' và yêu cầu giải thích mệnh lệnh rút lui
    cùng bối cảnh đằng sau."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, kính ngữ & thuật ngữ: Grantz đáp ''Rõ, thưa Trung tá.'',
    giữ ''tái tổ chức các tuyến phòng ngự'' và tiểu từ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000393
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ huy: giữ câu hỏi ngắn ''“Kỳ lạ thế nào?”''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000394
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, câu hỏi tu từ & quan hệ đối lập thời gian: giữ ''thưa
    Trung tá'', cấu trúc câu hỏi ''Chẳng phải rất kỳ lạ khi ... trong lúc ... thay
    vì đợi sau khi ... sao ạ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000395
  kind: terminology_and_voice
  value: 'choices=["Xưng hô chỉ huy: Tanya hỏi Grantz bằng đại từ ''Anh''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000396
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & kính ngữ: Grantz đáp ''Vâng… Trung tá cũng nghĩ giống
    vậy sao ạ?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000397
  kind: terminology_and_voice
  value: 'choices=["Tình thái suy đoán, thuật ngữ & đại từ trần thuật: giữ tình thái
    dè dặt ''Tôi có cảm giác rằng biết đâu chừng, chỉ là biết đâu thôi…'', thuật ngữ
    ''bản quốc'', ''cuộc phản công quy mô lớn'', ''hậu phương'', ''sở chỉ huy'', đại
    từ trần thuật ''Nó'' theo DEC-P01-001; đổi ''điều chuyển binh lực quanh đây''
    thành ''điều chuyển binh lực qua lại'' (hoặc ''điều động binh lực khắp nơi'')
    theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000398
  kind: terminology_and_voice
  value: 'choices=["Dấu thoại ba lớp: giữ nguyên cặp ngoặc kép ba lớp ''“““Rõ!”””''."]'
