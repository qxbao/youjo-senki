- segment_id: YS-LN07/Text/chapter008.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & phủ định: quy chiếu Tanya bằng ''nó'' theo
    DEC-P01-001; giữ phủ định ''chẳng thể phản bác gì được'' và nhận định ''Địa vị
