    toàn'')."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000391
  kind: terminology_and_voice
  value: 'choices=[''Thoại & mệnh lệnh: Tanya phát lệnh cho toàn đơn vị chuẩn bị chiến
    đấu và tiến vào khu vực giao tranh.'']'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000392
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: ''combat control team'' -> ''tổ điều khiển
