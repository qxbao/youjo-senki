choices:
- segment_id: YS-LN07/Text/chapter006.xhtml/p000101
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến, đại từ & thuật ngữ: CP xưng ''Tôi'' và gọi phía
    Tanya là ''các vị''; ''company of aerial mages'' -> ''đại đội pháp sư trên không'';
    ''reserves'' -> ''lực lượng dự bị''; giữ mốc thời gian điều kiện ''một khi tình
    hình ổn định lại''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000102
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định kép & thuật ngữ: trần thuật quy chiếu Tanya bằng
    ''nó'' theo DEC-P01-001; giữ nguyên ''CP''; giữ cấu trúc phủ định kép ''Không
    phải là nó không hiểu CP đang tính làm gì, nhưng chẳng người chỉ huy nào lại hào
    hứng...''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000103
  kind: terminology_and_voice
  value: 'choices=["Hô hiệu, đại từ & phủ định: giữ nguyên ''Salamander 01 gọi CP'';
    Tanya xưng ''Tôi''/''chúng tôi'' và gọi CP là ''các vị''; giữ quan hệ bất định
    – phủ định ''hiện chưa rõ chúng tôi có dư quân hay không, nên tôi không thể hứa
    chắc chuyện để lại lực lượng dự bị cho các vị được''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000104
  kind: terminology_and_voice
  value: 'choices=["Thoại nhượng bộ: giữ sắc thái nhượng bộ điều kiện ''“…Thôi được,
    vậy nếu có thể thì giúp nhé.”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000105
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: giữ cách diễn đạt thành ngữ phủ định ''“Tay
    không thì tôi chẳng thể lấy gì ra mà san sẻ cho các vị được.”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000106
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến: giữ câu đáp ngắn gọn ''“…Đã hiểu.”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000107
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: nội tâm của Tanya dùng ''chúng tôi''
    cho đơn vị mình và ''mình'' để tự quy chiếu theo DEC-P01-001; giữ phủ định ''Bản
    thân chúng tôi cũng chẳng dư dả gì cho cam''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000108
  kind: terminology_and_voice
  value: 'choices=[''Nghĩa & đối lập: giữ phép so sánh tương đồng giữa việc vắt kiệt
    hệ thống tới giới hạn và việc chừa lại một chút dự phòng để bảo đảm trạng thái
    lành mạnh chung của toàn hệ thống.'']'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000109
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & điểm nhìn: chỉ bọc ''*Nào, giờ thì.*'' khớp
    thẻ em nguồn theo DEC-P01-002; phần trần thuật tiếp theo dùng tên ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000110
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: câu đầu là nội tâm tự quy chiếu bằng ''mình'',
    câu sau chuyển sang trần thuật gọi ''Tanya''; ''her tankman'' -> ''người chỉ huy
    xe tăng dưới quyền''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Tanya gọi ''Đại úy Ahrens'' là ''anh'';
    ''203rd Aerial Mage Battalion'' -> ''Tiểu đoàn Pháp sư Trên không số 203''; ''your
    armor'' -> ''lực lượng thiết giáp của anh''; giữ tình thái phỏng đoán ''Có lẽ
    chỉ một mình...''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000112
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: dịch ''Colonel?!'' là ''Thưa Trung tá?!'';
    Ahrens dùng ''Chúng tôi'' cho đơn vị xe tăng của mình."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000113
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định kép & thuật ngữ: trần thuật quy chiếu Tanya bằng
    ''nó''; giữ cấu trúc phủ định kép ''kẻ nào không có thái độ như vậy thì có lẽ
    cũng chẳng hợp làm sĩ quan thiết giáp''; ''armored officer'' -> ''sĩ quan thiết
    giáp''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000114
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh: Tanya xưng ''Tôi'' (''“Tôi cần những chiếc xe
    tăng làm nhiệm vụ phòng ngự.”'')."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000115
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: dịch ''But, ma’am!'' của Đại úy Ahrens là
    ''“Nhưng thưa Trung tá!”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000116
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh, điều kiện phủ định & thuật ngữ: ''Denied!'' ->
    ''Bác bỏ!''; ''strike force'' -> ''lực lượng xung kích''; ''strongpoint'' -> ''cứ
    điểm''; giữ cấu trúc điều kiện phủ định ''Nếu không để lại..., chúng ta sẽ chẳng
    thể nào kiềm chế được chúng!''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000117
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & điều kiện phủ định: trần thuật nêu tên ''Ahrens''
    và ''Tanya''; giữ nhận định điều kiện phủ định ''Sự xông xáo của cấp dưới không
    được phép tán thưởng trừ phi đúng thời điểm''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000118
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: quy chiếu Ahrens bằng ''Anh ta'' và Tanya
    bằng ''nó''; ''eastern front'' -> ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000119
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: dịch ''…Yes, ma’am.'' là ''“…Rõ, thưa Trung
    tá.”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000120
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật gọi ''Tanya'' và quy chiếu bằng
    ''nó''; dịch ''her old hands'' là ''những cựu binh kỳ cựu của mình'' và quy chiếu
    bằng ''Mấy gã này''/''Họ''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000121
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ bọc ''*Đến giờ xung trận rồi*''
    khớp thẻ em nguồn theo DEC-P01-002; trần thuật quy chiếu Tanya bằng ''nó'' và
    nêu tên ''Ahrens''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000122
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Tanya gọi Ahrens là ''Đại úy'' và ''anh''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000123
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & tình thái: Đại úy Ahrens gọi Tanya là ''Trung
    tá'' kèm ''ạ'', xưng ''Tôi'' và dùng ''chúng ta'' cho toàn lực lượng; giữ phủ
    định ''vẫn chưa nắm được bức tranh toàn cảnh'' và tình thái dè dặt ''có lẽ nên
    ưu tiên việc trinh sát trước…''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000124
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & điều kiện: chỉ bọc từ tượng thanh
    ''*bụp*'' khớp thẻ em nguồn theo DEC-P01-002; trần thuật quy chiếu Tanya bằng
    ''nó''; trong thoại gọi ''Đại úy Ahrens ạ'' và dùng ''chúng ta'' trong câu điều
    kiện ''Nếu không biết thì chúng ta chỉ việc đích thân đi tìm hiểu thôi''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000125
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Ahrens gọi Tanya là ''Trung tá'' kèm ''ạ'';
    ''recon-in-force'' -> ''trinh sát chiến đấu''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000126
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''search-and-destroy mission'' -> ''nhiệm
    vụ tìm và diệt''; ''artillery division'' -> ''sư đoàn pháo binh''; trần thuật
    quy chiếu Tanya bằng ''nó'', trong thoại Tanya dùng ''chúng tôi''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000127
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Ahrens hỏi lại ''Ý Trung tá là pháo binh
    cấp sư đoàn ạ?''; phân biệt rõ ''divisional artillery'' (''pháo binh cấp sư đoàn'')
    với ''artillery division'' (''sư đoàn pháo binh'')."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000128
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định kép & thuật ngữ: chỉ bọc cụm ''*Trung-tá-đùa-tôi-chắc*''
    khớp thẻ em nguồn theo DEC-P01-002; giữ cấu trúc phủ định kép ''cũng chẳng phải
    chuyện vô lý''; giữ sự đối lập giữa ''cả một sư đoàn pháo binh'' (''a division
    of artillery'') và ''lực lượng pháo binh cấp sư đoàn'' (''divisional artillery'')."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô, phủ định & thuật ngữ: Tanya xưng ''Tôi'', gọi
    Ahrens là ''anh'' và gộp chung là ''chúng ta''; giữ phủ định ở cả hai câu và sự
    đối lập giữa ''pháo binh cấp sư đoàn'' với ''hỏa lực tương đương cả một sư đoàn''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ: chỉ bọc từ tượng thanh ''*Bịch*''
    khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Tanya bằng ''nó'' và Ahrens bằng
    ''anh ta''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thời gian tương lai trong trần thuật: giữ cấu trúc
    báo trước ''Về sau, Tanya sẽ cay đắng nhớ lại khoảnh khắc này và thấy mừng vì
    lúc ấy mình đã dặn phải chuẩn bị cho tình huống tồi tệ nhất''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & quan hệ chuyển折: ''mage unit'' -> ''đơn vị pháp sư'';
    ''enemy artillery unit'' -> ''đơn vị pháo binh địch''; giữ mạch lập luận ''Đáng
    lẽ... nhưng chúng lại bị mã hóa. Dẫu vậy, những cụm lặp lại đặc thù cũng đủ để
    mang lại một sự xác nhận gián tiếp''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: giữ tiếng hô ''“Đi thôi!”''; trần thuật nêu
    tên ''Tanya'' và quy chiếu bằng ''mình''/''nó''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=["Phủ định & điểm nhìn: giữ cấu trúc so sánh phủ định ''chẳng có
    dự đoán nào dễ ứng nghiệm chuẩn xác hơn những điều mà người ta chỉ mong là mình
    đoán trật''; trần thuật nêu tên ''Tanya'' và tự quy chiếu bằng ''mình''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ giọng cảm thán mỉa mai của Tanya ''“Trời đất,
    ghen tị thật đấy. Hỏa lực pháo binh yểm trợ mới hùng hậu làm sao!”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: câu một và hai trần thuật quy chiếu
    Tanya bằng ''nó'', câu cuối kết hợp giọng nội tâm dùng ''chúng tôi'' cho quân
    lực phe mình; ''Federation position'' -> ''trận địa của quân Liên bang''; ''corps
    artillery battery'' -> ''cụm pháo binh cấp quân đoàn''."]'
