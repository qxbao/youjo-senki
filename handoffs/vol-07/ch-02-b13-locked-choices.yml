  value: 'choices=["Quan hệ nhân quả, điều kiện & thuật ngữ: ''Imperial Army'' ->
    ''Lục quân Đế quốc''; ''base defense'' -> ''phòng thủ căn cứ''; ''take the initiative''
    -> ''giành lấy thế chủ động''; giữ câu điều kiện nhân quả giải thích lý do phải
    chủ động xuất kích."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định kép & thuật ngữ: nội tâm dùng ''chúng ta''; ''aerial
