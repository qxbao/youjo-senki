- segment_id: YS-LN07/Text/chapter008.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn: giữ câu châm ngôn ngắn gọn trong nội tâm Tanya ''Vấn
    đề tồn tại là để được giải quyết.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Tanya phát lệnh cho toàn đơn vị (''troops''
