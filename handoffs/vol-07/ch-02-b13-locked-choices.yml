choices:
- segment_id: YS-LN07/Text/chapter008.xhtml/p000204
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thoại: Serebryakov đáp lời Tanya, dịch ''you'' là ''Trung
    tá'', dùng ''chúng tôi'' cho toàn tiểu đoàn kèm tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000205
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: trần thuật ngôi thứ ba quy chiếu
    Tanya bằng ''nó'' theo DEC-P01-001 (''Her adjutant'' -> ''Viên sĩ quan phụ tá
    của nó''); giữ quan hệ đối lập giữa vẻ nói chuyện tỉnh bơ và ngầm hiểu mọi người
    xung quanh đều nghe thấy."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000206
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & câu hỏi: nội tâm của Tanya quy chiếu Serebryakov
    bằng ''Cô ấy''; giữ câu hỏi tu từ kết hợp cảm thán đánh giá sự trưởng thành của
    cấp dưới."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000207
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Serebryakov hạ giọng nói riêng với Tanya, tự
    xưng ''tôi'', dùng ''chúng ta'' cho đơn vị kèm tiểu từ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000208
  kind: terminology_and_voice
  value: 'choices=["Đại từ & điểm nhìn: nội tâm đánh giá của Tanya, quy chiếu Serebryakov
    bằng ''Cô ấy''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000209
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: Tanya đáp lời Serebryakov, dùng ''Chúng ta'' và
    dịch ''fresh troops'' là ''đám lính mới''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000210
  kind: terminology_and_voice
  value: 'choices=["Thoại, điều kiện & xưng hô: Serebryakov tiếp lời với giả định
    dè dặt ''…Đấy là nếu trong số đó có người nào ra hồn ạ.''"]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000211
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & thuật ngữ: Tanya đồng tình, giữ phủ định ''chẳng
    thể trông mong gì nhiều'' và dịch ''replenishments'' là ''quân bổ sung''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000212
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: nhận định chiến thuật trong nội tâm Tanya;
    ''recruits'' -> ''tân binh''; ''Battle-ready rookies'' -> ''Những lính mới sẵn
    sàng lâm trận ngay''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000213
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & xưng hô: trần thuật dùng ''nó'' cho Tanya theo
    DEC-P01-001; trong thoại Tanya gọi ''Trung úy Serebryakov'' và xưng hô ''cô''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000214
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ thán từ ngơ ngác ngắn gọn ''“Hả? Ờm…?”'' của Serebryakov."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000215
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: Tanya xưng ''tôi'' – ''Cô'' với
    Serebryakov; ''replenishments'' -> ''quân bổ sung''; ''adjutant'' -> ''sĩ quan
    phụ tá''; giữ phủ định ''Tôi không muốn phải làm đơn xin một sĩ quan phụ tá mới
    đâu!''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000216
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: nội tâm hồi tưởng của Tanya dùng
    ''Mình'' (số ít), ''cô ấy'' (Serebryakov) và ''Hai đứa'' (số nhiều) theo DEC-P01-001;
    ''Rhine front'' -> ''mặt trận Rhine''; ''corporal'' -> ''hạ sĩ''; ''replenishments''
    -> ''quân bổ sung''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000217
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ hành động quan sát toàn tiểu đoàn
    trước giờ xuất kích; ''her adjutant'' -> ''viên sĩ quan phụ tá''; ''ready to sortie''
    -> ''sẵn sàng xuất kích''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000218
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: nội tâm kiểm điểm trước trận của Tanya, dùng
    ''chúng ta'' cho toàn tiểu đoàn."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000219
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & điều kiện: nội tâm tự quy chiếu của Tanya
    dùng ''Mình'' và ''chúng ta'' theo DEC-P01-001; giữ phủ định ''không thể nói là
    chuyện này sẽ dễ dàng'' và điều kiện ''nếu làm thật chắc tay''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000220
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: nội tâm dùng ''Chúng ta''; ''due east'' ->
    ''thẳng về hướng đông''; ''corps and divisions'' -> ''quân đoàn và sư đoàn'';
    ''Imperial Army'' -> ''Lục quân Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000221
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''aerial mage battalions'' -> ''các tiểu đoàn pháp
