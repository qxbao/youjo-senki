choices:
- segment_id: YS-LN07/Text/chapter012.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhịp thoại: giữ lời cảnh báo ngập ngừng ''Họ… họ có
    quan sát viên! Đợt pháo kích thực sự sắp ập tới rồi!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & nhấn mạnh Markdown: trần thuật quy chiếu Tanya
    bằng ''nó'' theo DEC-P01-001; bọc chính xác toàn bộ phần độc thoại nội tâm cuối
    đoạn bằng ''*...*'' khớp thẻ em nguồn theo DEC-P01-002, dùng đại từ bao gộp ''Chúng
    ta''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm, thuật ngữ & không tự thêm chữ nghiêng: độc
    thoại nội tâm ngôi thứ nhất của Tanya dùng đại từ ''Mình'' / ''mình'' theo DEC-P01-001;
    không bọc chữ nghiêng vì nguồn không có thẻ nhấn mạnh theo DEC-P01-002; ''base
    piece'' -> ''Khẩu pháo chuẩn''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh tác chiến: giữ nhịp mệnh lệnh dồn dập ''Tất cả các đơn
    vị, tìm chỗ trú ẩn! Trú ẩn ngay! Và để mắt canh chừng bầu trời.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000235
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & thuật ngữ: dùng ''bạn'' cho chủ thể giả định
    chung; ''observer mage'' -> ''pháp sư quan sát''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000236
  kind: terminology_and_voice
  value: 'choices=["Thoại cảm thán: giữ câu cảm thán ''Khốn kiếp, xem ra không còn
    lựa chọn nào khác rồi!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000237
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thuật ngữ: quy chiếu Tanya bằng ''Nó'' theo
    DEC-P01-001; ''electronic countermeasure'' -> ''biện pháp đối kháng điện tử'';
    giữ ''Elinium Type 95'' và ''pháp sư quan sát''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000238
  kind: terminology_and_voice
  value: 'choices=["Xưng hô trang trọng & thuật ngữ: giữ cặp xưng hô ''ta - các ngươi''
    mang âm hưởng giáo huấn tôn giáo do tác động của Type 95 cùng ''Thượng đế'' và
    ''Chúa''; giữ ''Kampfgruppe Salamander'' và ''ô lưới tọa độ C-39''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000239
  kind: terminology_and_voice
  value: 'choices=["Xưng hô vô tuyến & thuật ngữ: dùng cách hỏi trung tính ''của bên
    đó'' khi người hỏi chưa rõ đối phương; ''call sign'' -> ''hô hiệu''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000240
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, xưng hô & thuật ngữ: trần thuật quy chiếu Tanya bằng
    ''Nó''; trong thoại dùng ''chúng tôi'' cho đơn vị mình và ''Ngươi'' khi quát hỏi
    đích danh ''pháp sư quan sát''; giữ hô hiệu ''Salamander 01''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000241
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn phân tách đặc trưng: giữ đúng sự chuyển đổi ngôi trong
    độc thoại nội tâm của nhân vật khi tự xưng ''mình'' nhưng nhắc đến ''Tanya'' ở
    ngôi thứ ba."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000242
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ nội tâm: dùng đại từ tự quy chiếu
    ''mình'' theo DEC-P01-001; chỉ bọc ''*kẻ địch của mình là mọi tên ngu xuẩn nổ
    súng vào mình*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000243
  kind: terminology_and_voice
  value: 'choices=["Thoại cấp dưới & thuật ngữ: giữ ''ạ'' cuối câu báo cáo của phụ
    tá; ''identification signal'' -> ''Tín hiệu nhận dạng''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000244
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh & dấu câu: giữ dấu gạch ngang thúc giục ''Vậy thì bắn
    pháo hiệu lên đi—nhanh lên!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000245
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: bọc chính xác ''*Hãy dạy
    cho lũ nghiệp dư đó biết tay!*'' khớp thẻ em nguồn theo DEC-P01-002; trần thuật
    quy chiếu Tanya bằng ''Nó'' / ''nó'', đối phương bằng ''họ''; ''adjutant'' ->
    ''viên sĩ quan phụ tá''; ''signal flare'' -> ''quả pháo hiệu''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000246
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến: giữ câu gằn giọng ''Đấy! Đã nhìn thấy chưa hả?!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000247
  kind: terminology_and_voice
  value: 'choices=["Thoại vô tuyến: giữ câu đáp ấp úng ''Ờ, tôi thấy rồi, nhưng mà…''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000248
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & thuật ngữ: Tanya xưng ''Tôi'' - ''các người'';
    ''observed fire'' -> ''hỏa lực bắn có quan sát''; giữ ''tín hiệu IFF''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000249
  kind: terminology_and_voice
  value: 'choices=["Thoại lắp bắp: giữ nét nói lắp ''T-tại sao đơn vị của các người
    lại ở đằng đó?''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000250
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya dùng ''Các người - chúng tôi''; ''firing
    for effect'' -> ''bắn tiêu diệt''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe
    Salamander''; ''aerial mage battalion'' -> ''Tiểu đoàn pháp sư trên không''; ''anti-artillery
    assault'' -> ''cuộc đột kích chế áp pháo binh''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000251
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: dùng ''Mình'' / ''mình'' và ''chúng
    ta'' trong độc thoại nội tâm theo DEC-P01-001; ''division of artillery'' -> ''sư
    đoàn pháo binh''; ''The Imperial Army’s batteries'' -> ''Các khẩu đội pháo của
    Lục quân Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000252
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & thuật ngữ: trong thoại Tanya dùng ''Tôi - các
    người'', nhắc tới ''mặt trận Rhine''; trong trần thuật quy chiếu Tanya bằng ''nó'';
    giữ thuật ngữ ''tấm ván của Carneades''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000253
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & ẩn dụ pháp lý: dùng đại từ tự quy chiếu ''Mình''
    / ''mình''; giữ hình ảnh ''tấm ván của mình''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000254
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & thuật ngữ: dùng đại từ ''mình''; ''Mr. Ildoa''
    -> ''ngài Ildoa''; ''Salamander Kampfgruppe'' -> ''Kampfgruppe Salamander''; ''emergency
    evacuation'' -> ''hành vi lánh nạn khẩn cấp''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000255
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh tác chiến: giữ lệnh truyền cho ''Toàn tiểu đoàn'' chuẩn
    bị xuất kích đáp trả."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000256
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: ''Understood, Colonel!'' -> ''Rõ, thưa Trung
    tá!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000257
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát & thuật ngữ: dùng ''bạn'' cho mệnh đề khái quát;
    giữ ''tiền tuyến'', ''tín hiệu IFF'', ''tín hiệu nhận dạng''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000258
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ & thuật ngữ: trong thoại dùng ''các người - chúng
    tôi / tôi / chúng ta''; trong trần thuật quy chiếu Tanya bằng ''nó''; ''Federation
    artillery units'' -> ''các đơn vị pháo binh Liên bang''; ''encoded wireless receiver''
    -> ''máy thu vô tuyến mã hóa''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000259
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & nhịp vô tuyến: giữ nét nói lắp ''S-sở chỉ huy gọi
    Salamander CP, nghe rõ trả lời—khẩn cấp!''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000260
  kind: terminology_and_voice
  value: 'choices=["Hô hiệu & thuật ngữ: giữ ''Salamander 01 gọi sở chỉ huy, yêu cầu
    giải thích.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000261
  kind: terminology_and_voice
  value: 'choices=["Tình thái nội tâm: giữ tình thái phán đoán ''chắc là không sao
    đâu'' và ''kênh liên lạc mở''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000262
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''nhận dạng nhầm'' (khớp đoạn tiếp theo) và ''Pháp
    sư quan sát''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, thuật ngữ & tự nhiên: chỉ bọc ''*nhận dạng
    nhầm*'' khớp thẻ em nguồn theo DEC-P01-002; giữ ''hỏa lực bắn có quan sát''; chỉnh
    cụm cuối câu đầu thành ''vào lúc khác!'' theo finding."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000264
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ ''pháp sư quan sát'' và câu giải thích bỏ lửng."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000265
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản vấn & thuật ngữ: giữ ''quy trình tiêu chuẩn'', ''tín
    hiệu nhận dạng'', ''mật mã liên lạc''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000266
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & văn phong quân chính: người trực ở sở chỉ huy xưng ''Tôi'',
    gọi pháp sư quan sát là ''cậu ta''; giữ ''bản kiểm điểm xin lỗi chính thức''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000267
  kind: terminology_and_voice
  value: 'choices=["Giọng mỉa mai nội tâm: giữ câu nhận xét ngắn ''Ồ, đúng kiểu câu
    trả lời quan liêu.''."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000268
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & giọng thoại: ''General Staff'' -> ''Bộ Tổng tham mưu'';
    giữ nhịp bùng nổ dồn dập của Tanya trước và sau khi dập ống nghe."]'
- segment_id: YS-LN07/Text/chapter012.xhtml/p000269
  kind: terminology_and_voice
  value: 'choices=["Nhịp câu kết: lược bỏ mệnh đề tự thêm ''Một khi đã mất đi thì''
    theo finding để giữ hai câu khẳng định ngắn gọn, đanh thép."]'
