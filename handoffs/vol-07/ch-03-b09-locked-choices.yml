    cứ địch rồi tấn công'' và hệ quả phải hết sức lưu tâm đến yếu tố thời gian."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000310
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật: gọi Tanya là ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000311
  kind: terminology_and_voice
  value: 'choices=["Dấu câu & thuật ngữ: giữ dấu chấm lửng mở đầu câu hỏi của Calandro
