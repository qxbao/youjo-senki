- segment_id: YS-LN07/Text/chapter010.xhtml/p000303
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & câu hỏi: giữ câu hỏi ngắn ''Vậy là vẫn như mọi khi
    hả?'' của Tanya với cấp dưới."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000304
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ giả định chung & điều kiện: Ahrens đáp ''Vâng,
    thưa Trung tá.''; dùng ''bạn'' cho chủ thể giả định chung và giữ mệnh đề điều
