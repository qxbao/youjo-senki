    tốn quá nhiều thời gian."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000309
  kind: terminology_and_voice
  value: 'choices=["Đại từ, phủ định & nhân quả: dùng ''chúng ta''; giữ mệnh đề nguyên
