- segment_id: YS-LN07/Text/chapter010.xhtml/p000305
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nhân quả: Ahrens dùng ''chúng tôi'' cho đơn vị mình;
    giữ nguyên nhân ''Vì quân địch đang tiến vào một khu dân cư'' và quyết định tạm
    thời rút lui để tránh một trận đánh trên đường phố."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000306
  kind: terminology_and_voice
  value: 'choices=["Tên riêng & sắc thái: giữ tiếng đáp ''Ừm.'' và miêu tả Tanya lĩnh
