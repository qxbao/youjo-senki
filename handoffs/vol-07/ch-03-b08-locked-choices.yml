choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000265
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định & điều kiện: Tanya xưng ''Tôi'' / ''chúng tôi'',
    gọi Calandro là ''ngài''; giữ phủ định ''không có gì phải giấu giếm đồng minh
    của mình cả'' và mệnh đề điều kiện nhượng bộ ''Nếu ngài đã quyết ý như vậy, xin
    cứ thoải mái quan sát theo ý muốn.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000266
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Calandro xưng ''Tôi'' / ''mình'', gọi Tanya
    là ''Trung tá'' và ''cô'' trong lời xin lỗi."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000267
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, nhấn mạnh Markdown & thuật ngữ: trần thuật
    gọi Tanya là ''Nó'' / ''nó'' theo DEC-P01-001 và gọi Calandro là ''ông''; bọc
    dấu sao câu độc thoại nội tâm ''*Thế thì có lẽ ngài nên biết tự giữ mình đi*''
    theo DEC-P01-002; giữ chuẩn ''Đại tá von Lergen'' và ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000268
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ tương phản: giữ sự đối lập giữa nỗi lòng bên trong của
    Tanya và câu đáp lễ phép ngoài miệng.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000269
  kind: terminology_and_voice
  value: 'choices=["Phủ định & giọng thoại: giữ phủ định ''Không đâu ạ, chuyện đó
    chẳng có gì là quá đáng cả'' với sắc thái lịch sự xã giao."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000270
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, câu hỏi & thuật ngữ: gọi Tanya là ''nó'' theo
    DEC-P01-001; giữ câu hỏi tu từ mở đầu và các thuật ngữ ''động vật chính trị'',
    ''Trung tá Tanya von Degurechaff''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000271
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, thuật ngữ & phủ định: Tanya xưng ''tôi'' / ''Tôi'', gọi
    Calandro là ''ngài''; giữ tên ''Bộ Tổng tham mưu'' và lời mời phủ định ''xin ngài
    đừng ngần ngại''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000272
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại & dấu câu: giữ câu hỏi bỏ lửng kèm dấu chấm lửng ''Vậy
    còn chuyện vừa rồi…'' của Calandro."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000273
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nghĩa: Tanya xưng ''tôi'', gọi Calandro là ''ngài'';
    giữ giải thích rằng việc nhắc đến rủi ro chỉ là một phần phận sự."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000274
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Calandro xưng ''Tôi'' / ''tôi'', gọi Tanya
    là ''cô'' và ''Trung tá''; giữ ý khẳng định tự nguyện làm việc này."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000275
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: giữ tên ''Calandro'', ''ban tham mưu'' và ''sở chỉ
    huy''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000276
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & nhân quả: gọi Calandro là ''ông'', gọi Tanya
    là ''nó'' theo DEC-P01-001; giữ mệnh đề điều kiện ''Nếu ông đã muốn đi cùng...''
    và kết luận bổn phận của Tanya đã được hoàn thành hoàn hảo."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000277
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, giả định & phủ định: gọi Calandro là ''ông'',
    Tanya là ''nó''; giữ giả định ''Ngay cả khi ông có bị bắn chết'', tên ''Bộ Tổng
    tham mưu'' và mệnh đề phủ định ''Hy vọng chuyện đó không xảy ra''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000278
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & thuật ngữ: bọc dấu sao câu nội tâm ''*Nếu
    đã cực chẳng đã…*'' theo DEC-P01-002; giữ chức danh ''viên sĩ quan phụ tá'' và
    ''Đại tá Calandro''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000279
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Serebryakov đáp lệnh Tanya bằng ''Rõ, thưa
    Trung tá!''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000280
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & giả định: gọi Serebryakov là ''cô'', Calandro
    là ''ông''; giữ hình ảnh ẩn dụ ''tấm khiên tuyệt vời'' và tình huống phòng bị
    ''phòng khi có bất trắc xảy ra''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000281
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, thuật ngữ & dấu câu: gọi Serebryakov là ''cô'',
    Calandro là ''ông'', Tanya là ''nó'' theo DEC-P01-001; giữ thuật ngữ ''sở chỉ
    huy'' và dấu gạch ngang dài trước nhận xét ''quá hoàn hảo''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000282
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & quân hàm: Calandro gọi Tanya là ''Trung tá''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000283
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu hỏi đáp lễ phép ''Vâng, chuyện gì vậy ạ?''
    của Tanya."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000284
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện: Calandro xưng ''tôi'', gọi Tanya là ''cô'',
    dùng ''chúng ta'' cho đoàn di chuyển; giữ điều kiện lịch sự ''Nếu cô không phiền''
    và đề nghị dự khán cuộc họp."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000285
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & câu hỏi tu từ: gọi Tanya là ''nó'' theo DEC-P01-001;
    giữ câu hỏi tu từ so sánh với việc họp kinh doanh trước mặt sếp lớn từ công ty
    khách hàng."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000286
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, nhấn mạnh Markdown & thuật ngữ: gọi Tanya là
    ''nó'' theo DEC-P01-001; bọc dấu sao chính xác cho ''*nein*'' và ''*Thân phận
    công chức nhà nước thật khốn khổ*'' theo DEC-P01-002; giữ chức danh ''quan sát
    viên quân sự'' và phủ định ''không cho phép''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000287
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & dấu câu: trong thoại Tanya xưng ''tôi''
    / ''Tôi'' và gọi Calandro là ''ngài'', trong trần thuật gọi Tanya là ''nó'' theo
    DEC-P01-001; giữ dấu chấm lửng mở đầu và dấu gạch ngang dài sau ''Nhưng—''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000288
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Calandro xưng ''tôi'', giữ câu hỏi ngắn ''Cụ
    thể là chuyện gì?'' và thiện chí hợp tác."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000289
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đại từ trần thuật & cấp bậc: trong thoại Tanya xưng ''tôi'',
    dùng ''chúng ta'' và gọi Calandro là ''ngài''; trong trần thuật gọi Tanya là ''nó''
    (tự quy chiếu ''mình'') theo DEC-P01-001; giữ dấu chấm lửng, cặp dấu gạch ngang
    dài và chi tiết cấp bậc ''vị đại tá''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000290
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & ẩn dụ: gọi Tanya là ''nó'' theo DEC-P01-001,
    gọi Calandro là ''ông''; giữ hình ảnh biến Calandro thành ''một vật trang trí''
    và nhận định việc vừa đánh trận vừa kèm cặp cấp trên vượt quá sức Tanya."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000291
  kind: terminology_and_voice
  value: 'choices=["Đại từ giả định chung & cấu trúc tăng tiến: dùng ''bạn'' cho chủ
    thể khái quát; giữ đúng cấu trúc ''không chỉ làm hạ thấp sự đánh giá của xã hội
    dành cho bạn mà còn ảnh hưởng trực tiếp đến tài sản và chính mạng sống của bạn''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000292
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & nghĩa: Calandro xưng ''tôi'', giữ lời đồng ý ''Cứ xem
    tôi là một người đứng ngoài cuộc đi.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000293
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật/nội tâm, nhấn mạnh Markdown & phủ định: nội
    tâm Tanya xưng ''mình'' và gọi Calandro là ''Ông ấy'' / ''ông ấy'', trần thuật
    gọi Tanya là ''nó'' theo DEC-P01-001; bọc dấu sao toàn bộ ba câu độc thoại nội
    tâm theo DEC-P01-002; giữ các phủ định ''không thể hoàn toàn phớt lờ'' và ''chẳng
    thể nói toạc ra thành lời''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000294
  kind: terminology_and_voice
  value: 'choices=[''Tình thái & giọng kể: giữ sắc thái cam chịu thực dụng của Tanya
    trước việc phải làm việc dưới ánh mắt của vị khách quan trọng.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000295
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, tình thái & phủ định: giữ chuẩn ''Kampfgruppe'', ''tiền
    tuyến'', ''đội tiên phong''; giữ sắc thái phỏng đoán và phủ định ''ngoài đội tiên
    phong của Kampfgruppe ra thì có lẽ chẳng còn ai khác trên đường''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000296
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, phủ định & thuật ngữ: gọi Tanya là ''nó'' theo
    DEC-P01-001; giữ phủ định ''không gặp mấy trở ngại'' và các thuật ngữ ''lực lượng
    thiết giáp'', ''Đại úy Ahrens''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000297
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn nội tâm & định dạng: tự quy chiếu của Tanya dùng ''Mình''
    theo DEC-P01-001; không bọc dấu sao câu đầu vì nguồn không in nghiêng theo DEC-P01-002;
    giữ dấu chấm lửng."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000298
  kind: terminology_and_voice
  value: 'choices=["Phủ định & thuật ngữ: giữ cấu trúc phủ định ''không còn lựa chọn
    nào khác ngoài việc ưu tiên công năng hơn hình thức'' và thuật ngữ ''Sở chỉ huy
    lâm thời''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000299
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & tình thái: gọi Calandro là ''ông''; giữ suy
    đoán ''hẳn phải có điều gì đó mới lạ'' và dự đoán ''ông cũng sẽ sớm thấy nó bình
    thường thôi''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000300
  kind: terminology_and_voice
  value: 'choices=["Dấu ngoặc kép & thuật ngữ: giữ dấu ngoặc kép cho ''“phòng họp”''
    và thuật ngữ ''bộ thiết bị vô tuyến''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000301
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Tanya gọi các sĩ quan trong cuộc
    họp là ''Thưa các vị'' / ''các vị'', gọi ''Đại úy Ahrens'' là ''anh''; giữ thuật
    ngữ ''buổi phổ biến tác chiến''."]'
