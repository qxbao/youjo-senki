- segment_id: YS-LN07/Text/chapter006.xhtml/p000231
  kind: terminology_and_voice
  value: 'choices=["Tên nhân vật & nghĩa: giữ nguyên ''Tanya'', ''Visha'', ''Lergen''
    và sự tương phản giữa thái độ im lặng kính cẩn với tiếng thở dài không giấu giếm."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000232
  kind: terminology_and_voice
  value: 'choices=["Thoại & đại từ: Lergen xưng ''tôi''/''ta'', gọi quân Liên bang
    là ''chúng''; giữ câu hỏi cảm thán và câu bỏ lửng cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000233
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*Keng keng*''
    khớp thẻ em nguồn theo DEC-P01-002; gọi Lergen là ''ông''; ''the rear'' -> ''hậu
