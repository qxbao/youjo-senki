- segment_id: YS-LN07/Text/chapter006.xhtml/p000223
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & quân hàm: trần thuật quy chiếu Tanya bằng
    ''Nó''/''nó'', tự quy chiếu phụ thuộc bằng ''mình'', nêu tên ''Tanya'' ở cuối
    câu theo DEC-P01-001; ''one colonel'' -> ''một vị đại tá''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000224
  kind: terminology_and_voice
  value: 'choices=["Đại từ & nghĩa: trần thuật quy chiếu Tanya bằng ''nó'', gọi Lergen
    là ''ông'', dùng ''quân ta'' và ''đơn vị'' tự nhiên theo ngữ cảnh."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000225
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thuật ngữ: dùng ''họ'' cho đoàn thị sát; ''forward-most
    line'' -> ''tuyến tiền tiêu ngoài cùng''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000226
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc ''*Tuyệt hảo.*''
    khớp thẻ em nguồn theo DEC-P01-002; trần thuật quy chiếu Tanya bằng ''Nó''; ''Federation
    main battle tank'' -> ''xe tăng chiến đấu chủ lực của Liên bang''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000227
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: trần thuật nêu tên ''Lergen'' và quy chiếu
    bằng ''ông''; giữ tình thái suy đoán ''Hẳn ông cũng là người khá tinh tường.''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000228
  kind: terminology_and_voice
  value: 'choices=["Đại từ & thoại: trần thuật gọi Lergen là ''ông''; trong thoại
    Lergen xưng ''tôi''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000229
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & phủ định điều kiện: ''armored officer'' -> ''sĩ quan
    thiết giáp''; ''tank guns'' -> ''pháo xe tăng''; giữ cấu trúc phủ định điều kiện
    ''không thể xuyên thủng nổi nếu không bắn ở cự ly cực gần''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000230
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ: ''active main battle tanks'' -> ''xe tăng chiến đấu
