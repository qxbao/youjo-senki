- segment_id: YS-LN07/Text/chapter006.xhtml/p000236
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Lergen gọi Tanya là ''cô'', quy chiếu xe tăng
    địch bằng ''chúng''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000237
