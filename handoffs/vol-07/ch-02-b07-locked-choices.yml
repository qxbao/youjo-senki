    hề thiếu trí tưởng tượng''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000239
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, thuật ngữ & phủ định: trần thuật nêu tên ''Tanya'',
