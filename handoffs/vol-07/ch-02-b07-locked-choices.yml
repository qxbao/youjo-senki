  value: 'choices=["Thoại: Lergen xưng ''tôi'', giữ câu hỏi ngắn ''Rồi sao?''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000263
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya gọi Lergen là ''Ngài''/''ngài'', xưng
