- segment_id: YS-LN07/Text/chapter006.xhtml/p000244
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Lergen xưng ''tôi'', gọi Tanya là ''cô''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000245
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & thuật ngữ: gọi Lergen là ''ông'', quy chiếu
