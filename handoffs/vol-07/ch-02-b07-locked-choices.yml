    ''trang bị chủ lực''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000234
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Lergen gọi Tanya là ''cô'', giữ câu hỏi trực
