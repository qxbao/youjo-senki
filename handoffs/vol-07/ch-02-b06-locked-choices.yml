    nào khác ngoài việc chùn bước'')."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Đại từ & phủ định: dùng ''bạn'' và ''mình'' cho chủ thể khái quát;
    giữ các cấu trúc nói giảm và phủ định (''chẳng lấy gì làm vui sướng'', ''hầu như
    chẳng giống một chiến thắng'', ''cảm giác mơ hồ nhất rằng mình vừa bảo vệ được
    trận địa'')."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000183
