  value: 'choices=["Đại từ & dấu câu: giữ đại từ khái quát ''bạn'', dấu ba chấm và
    cụm đóng ngoặc kép ''“không rõ nguồn gốc”''."]'
- segment_id: YS-LN07/Text/chapter006.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & thuật ngữ: trần thuật nêu tên ''Tanya''; giữ câu bỏ
