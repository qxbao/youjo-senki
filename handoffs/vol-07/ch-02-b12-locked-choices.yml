- segment_id: YS-LN07/Text/chapter008.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Ahrens tự xưng ''tôi'' kèm tiểu từ lễ phép ''ạ''
