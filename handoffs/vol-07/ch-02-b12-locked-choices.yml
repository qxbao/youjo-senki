    hẳn'', phủ định ''không hề mang trong mình khao khát cháy bỏng'' và khẳng định
    tuyệt đối ''chưa bao giờ là một trải nghiệm dễ chịu''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Đại từ & xưng hô: trần thuật dùng ''Nó'' cho Tanya theo DEC-P01-001;
    giữ phủ định dứt khoát ''nhưng không, chúng ta sẽ không làm vậy đâu'' và danh
    xưng ''Đại úy Ahrens''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, đại từ & phủ định: nội tâm dùng ''mình'' theo
