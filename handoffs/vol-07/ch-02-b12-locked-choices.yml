    phát lệnh trước toàn đơn vị."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & câu hỏi: ''Captain Ahrens'' -> ''Đại úy Ahrens''; giữ
