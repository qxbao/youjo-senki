    theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Quan hệ điều kiện & thuật ngữ: giữ điều kiện ''Nếu bên bị áp đảo
