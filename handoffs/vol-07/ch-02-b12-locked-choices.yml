    có chăng là...''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: nội tâm tự quy chiếu số ít dùng
    ''mình'' và số nhiều cho đơn vị dùng ''chúng tôi'' theo DEC-P01-001; giữ phủ định
    ''không còn phải bám trụ để phòng ngự một vị trí cố định nữa''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & đại từ: ''Salamander Kampfgruppe'' -> ''Kampfgruppe
