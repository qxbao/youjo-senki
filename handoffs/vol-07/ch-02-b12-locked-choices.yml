    -> ''giành lấy thế chủ động''; ''Command'' -> ''Bộ chỉ huy''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Ahrens gọi Tanya (''you'') là ''Trung tá'';
