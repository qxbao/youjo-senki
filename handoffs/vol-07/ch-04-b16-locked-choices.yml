choices:
- segment_id: YS-LN07/Text/chapter016.xhtml/p000426
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ đại từ ''chúng ta'', ''bản quốc''
    (home country), ''cuộc tập kích Moskva'' (Moskva raid), và giữ đúng phạm vi nhấn
    mạnh Markdown ''*“tấn công trực tiếp sở chỉ huy địch”*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000427
  kind: terminology_and_voice
  value: 'choices=["Nhận định nội tâm của Tanya: giữ ''Chiến thuật chặt đầu chỉ huy''
    (Decapitation tactics) và quan hệ bất kể thành bại vẫn đạt thành quả."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000428
  kind: terminology_and_voice
  value: 'choices=["Trần thuật từ điểm nhìn Tanya: giữ tên riêng ''Tanya'', đại từ
    ''Nó'' / ''nó'' theo DEC-P01-001, và đại từ ''họ'' chỉ đơn vị."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000429
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của Grantz với Tanya: giữ đại từ ''Chúng tôi'' và
    tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000430
  kind: terminology_and_voice
  value: 'choices=["Trần thuật kết hợp nội tâm Tanya: giữ tên riêng ''Grantz'', đại
    từ ''nó'' cho Tanya theo DEC-P01-001, ''anh ta'' cho Grantz, và giữ đúng phạm
    vi nhấn mạnh Markdown ''*Sao anh ta lại có thể vui mừng trên chiến trường được
    chứ?*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000431
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya: giữ tên riêng ''Tanya'', đại từ
    ''Nó'' theo DEC-P01-001, và câu hỏi xác nhận ''Các anh tìm thấy chúng rồi ư?!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000432
  kind: terminology_and_voice
  value: 'choices=["Trần thuật pha nội tâm Tanya: giữ ''Người cấp dưới này của nó''
    (This subordinate of hers) với đại từ ''nó'' theo DEC-P01-001, ''họ'' (they),
    và ''căn cứ ẩn giấu'' (hidden base)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000433
  kind: terminology_and_voice
  value: 'choices=["Thoại của Grantz với Tanya: giữ danh xưng cấp bậc thực tế ''Thưa
    Trung tá'' / ''Trung tá'' (Colonel) và tiểu từ ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000434
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với Grantz: giữ xưng hô ''Anh'' – ''tôi'' và cấu
    trúc câu hỏi phản vấn sau khi chỉnh thuật ngữ ''war dog''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000435
  kind: terminology_and_voice
  value: 'choices=["Thoại lắp bắp của Grantz: giữ ''Tr-Trung tá?!'' (C-Colonel?!)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000436
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ đại từ tự xưng ''Mình'' theo
    DEC-P01-001 và ý nghĩa lời nói dối vô tình biến thành sự thật."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000437
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉnh đốn cấp dưới của Tanya: giữ ''Trung úy Grantz'' (Lieutenant
    Grantz), đại từ ''anh'', và ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000438
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên riêng ''Tanya'' và phủ định ''không sao hiểu
    nổi''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000439
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh viết hoa toàn bộ: giữ ''CÙNG NGÀY HÔM ĐÓ,
    VÀO BUỔI CHIỀU, THỦ ĐÔ ĐẾ QUỐC BERUN, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000440
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Kampfgruppe Salamander của Lục quân Đế quốc'',
    ''sở chỉ huy cụm tập đoàn quân của Quân đội Liên bang'', ''Cụm tập đoàn quân phía
    Đông'', và ''Bộ Tổng tham mưu''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000441
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''các sĩ quan tham mưu'' (staffers) và phủ định
    ''dù chẳng phải quá nhỏ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000442
  kind: terminology_and_voice
  value: 'choices=["Nội tâm tập thể và trần thuật: giữ đúng phạm vi nhấn mạnh Markdown
    ''*Đã có tin chưa? Giờ thì sao?*'' theo DEC-P01-002, ''người kỹ thuật viên'' (technician),
    và ''bộ thiết bị liên lạc'' (communications set)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000443
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đối lập giữa ''nhóm trước'' (nhân viên thông tin
    liên lạc) và ''nhóm sau'' (các sĩ quan tham mưu) sau khi sửa lỗi cú pháp tỉnh
    lược."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000444
  kind: terminology_and_voice
  value: 'choices=["Nội tâm mong ngóng: giữ đúng phạm vi nhấn mạnh Markdown ''*Vẫn
    chưa có gì sao? Đến giờ vẫn chưa có ư?*'' theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000445
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''tiền tuyến'' (front lines), ''viên sĩ quan trực
    ban'' (duty officer), tình thái ''có lẽ'' (perhaps), và ''đường công văn giao
    liên sĩ quan'' (officer-messenger mail)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000446
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''lực lượng chiếm đóng ở phương bắc'', ''Quân
    đoàn Viễn chinh Lục địa Phía nam'' (Southern Continent Expeditionary Army Corps),
    và ''các trận không chiến ở phía tây''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000447
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Các sĩ quan tham mưu'' (staffers), ''viên sĩ
    quan trực ban'' (duty officer), và đại từ ''anh''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000448
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ẩn dụ ''làn hỏa lực chế áp bằng ánh mắt'' (suppressive
    fire of looks) và đại từ ''anh''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000449
  kind: terminology_and_voice
  value: 'choices=["Thoại báo tin của sĩ quan trực ban: giữ ''Kampfgruppe'' và tiểu
    từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000450
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi dồn: giữ ''Trong đó nói gì?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000451
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và nội dung bức điện: giữ ''Kampfgruppe Lergen'', ''mặt
    trận phía đông'', ''Bộ Tổng tham mưu'', và câu điệp ''Chúng tôi đã tấn công trực
    tiếp bọn chúng. Tôi nhắc lại, chúng tôi đã tấn công trực tiếp bọn chúng.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000452
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ nhịp cảm thán ''Một đòn tấn công trực tiếp! Họ
    đã lao vào tập kích và tung một đòn tấn công trực tiếp!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000453
  kind: terminology_and_voice
  value: 'choices=["Thoại đọc tóm tắt báo cáo của sĩ quan trực ban: giữ ''cuộc không
    kích'' (air raid), ''nhân sự chỉ huy của địch'' (enemy command personnel), ''nhân
    viên thông tin liên lạc'' (communications personnel), và ''Đạo quân phía đông''
    (eastern army)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000454
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Trung tướng von Zettour'' (Lieutenant General
    von Zettour), ''Trung tá Uger'' (Colonel Uger), và phủ định kép ''không lấy làm
    phật ý'' (not-dissatisfied)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000455
  kind: terminology_and_voice
  value: 'choices=["Thoại của Trung tướng von Zettour: giữ xưng hô ''tôi'', đại từ
    ''cô ta'' chỉ Tanya, và ''chó săn'' (hunting dog)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000456
  kind: terminology_and_voice
  value: 'choices=["Thoại của Trung tá Uger với Zettour: giữ xưng hô tôn kính ''ngài
    ... ạ, thưa Trung tướng'' (sir) và đại từ ''Cô ấy'' chỉ Tanya."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000457
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề chuyển cảnh viết hoa toàn bộ: giữ ''NGÀY 11 THÁNG 5 NĂM
    THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, TRẬN ĐỊA PHÒNG NGỰ LIÊN HỢP CỦA ĐƠN VỊ ĐỔ
    BỘ ĐƯỜNG KHÔNG BỜ SÔNG VÀ KAMPFGRUPPE''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000458
  kind: terminology_and_voice
  value: 'choices=["Thoại cảnh báo và trần thuật: giữ ''Cảnh báo toàn chiến trường!''
    (Theater warning!), ''Quân Liên bang'' (Federation troops), ''chọc thủng vòng
    vây'' (punch through the encirclement), và ''mặt trận phía đông''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000459
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Lục quân Đế quốc'' (Imperial Army) và nhận định
    chủ quan của họ về chiến thắng tưởng đã nắm chắc."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000460
  kind: terminology_and_voice
  value: 'choices=["Thoại sững sờ tại tiền tuyến: giữ ''khả năng cơ động có tổ chức''
    (organized maneuvers)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000461
  kind: terminology_and_voice
  value: 'choices=["Thoại phản ứng tại tiền tuyến: giữ tự xưng ''Tôi'', ''khả năng
    kháng cự có tổ chức'' (ability to resist in an organized way)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000462
  kind: terminology_and_voice
  value: 'choices=["Nội tâm và trần thuật: giữ đúng phạm vi nhấn mạnh Markdown ''*Cái
    quái gì thế này…*'' theo DEC-P01-002, ''quân Liên bang'' (the Federation), và
    phủ định ''không còn là một lựa chọn nữa''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000463
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''mặt trận phía đông'' (eastern front), ''ngoài
    ca trực'' (off duty), và phủ định ''không phải là ngoại lệ''."]'
