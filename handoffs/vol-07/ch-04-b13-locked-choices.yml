- segment_id: YS-LN07/Text/chapter016.xhtml/p000319
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điểm nhìn & nhấn mạnh Markdown: trần thuật dùng ''nó'',
    câu hỏi độc thoại nội tâm dùng ''mình'' theo DEC-P01-001; bọc nguyên câu hỏi nội
    tâm trong dấu sao ''*Chẳng lẽ mình lại thực sự thấy nhớ một trong những phát minh
    của tay kỹ sư Schugel kia sao?*'' khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000320
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & đại từ: giữ đại từ tự quy chiếu ''mình'' theo
    DEC-P01-001; không dùng chữ nghiêng vì nguồn không có thẻ nhấn mạnh."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000321
  kind: terminology_and_voice
  value: 'choices=["Đại từ khái quát, nhượng bộ & phủ định: dịch đại từ khái quát
    là ''bạn''; giữ mệnh đề nhượng bộ ''Cho dù... đi chăng nữa'' và hai phủ định ''không
    thể chấp nhận nguy cơ tổn thất'', ''không một ai được phép khước từ một mệnh lệnh
    hợp lệ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000322
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & dấu hai chấm: nội tâm dùng ''chúng ta'' cho
    đơn vị của Tanya và ''Họ'' cho cấp trên; giữ ''sở chỉ huy của Quân đội Liên bang'',
    ''bến vượt sông'', ''Tiểu đoàn Pháp sư Trên không số 203'' và mệnh đề sau dấu
    hai chấm."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000323
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & đại từ: giữ câu ngắn gọn ''Được lệnh đi thì
    mình đi.'' với đại từ ''mình'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000324
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, phủ định & thuật ngữ: giữ tên ''Tanya'' và đại từ
    phản thân ''của mình''; giữ hai phủ định ''Chẳng có lấy chút thời gian'' và ''không
    được phép nói lời từ chối''; dịch ''operation to strike enemy command'' là ''chiến
    dịch tập kích bộ chỉ huy địch''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000325
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, tình thái & thuật ngữ: chỉ bọc ''*đúng như
    dự đoán*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ tình thái ''Có
    lẽ phải nói là'', ''nghe đâu'' và các thuật ngữ ''các công sự phòng ngự của Quân
    đội Liên bang'', ''trận địa chính'', ''mặt trận Rhine''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000326
  kind: terminology_and_voice
  value: 'choices=["Thoại & thuật ngữ: giữ câu cảm thán và câu hỏi ví von ''thế trận
    thành trì gấu chui hang sao?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000327
  kind: terminology_and_voice
  value: 'choices=["Trần thuật & thuật ngữ: giữ cấu trúc liệt kê tăng tiến ''Mật độ
    hỏa lực, quy mô và trên hết là sự liều mạng của quân địch'' và tên đơn vị ''Tiểu
    đoàn Pháp sư Trên không số 203''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000328
  kind: terminology_and_voice
  value: 'choices=["Thoại cảnh báo: giữ câu báo động ngắn gọn ''“Pháp sư địch đang
    bay lên!”''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000329
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & tình thái giả định: giữ ''Lực lượng yểm trợ
    trực tiếp cho sở chỉ huy ư?!'' và câu than phiền giả định quá khứ ''Lẽ ra chúng
    cứ để trống toang nơi đó cho chúng ta có phải hơn không!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000330
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm, đại từ & giả định: dùng ''chúng ta''/''mình''
    cho phe Tanya và ''chúng'' cho quân Liên bang; giữ ''lực lượng dự bị'', giả định
    trái thực tế ''Giá như đây là một sự kiện thể thao, có lẽ mình sẽ...'' và nhận
    định đối lập ''nhưng trong thời chiến, kình địch là đối tượng phải bị tiêu diệt
    hoặc tránh né''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000331
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ, thuật ngữ & phủ định: quy chiếu Tanya bằng
    ''Tanya''/''nó'' theo DEC-P01-001; giữ ''chênh lệch độ cao'', ''triển khai một
    thuật thức'', ''đánh chặn họ'' và phủ định ''chẳng ăn thua''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000332
  kind: terminology_and_voice
  value: 'choices=["Thoại cảnh báo & thuật ngữ: giữ câu hét của Weiss ''“Bọn này dùng
    các mẫu mới!”''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000333
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ, quân hàm & thuật ngữ: quy chiếu Tanya bằng
    ''Nó''/''Tanya''/''nó''; giữ ''Thiếu tá Weiss'', ''pháp sư Liên bang'', ''lớp
    vỏ phòng thủ'', ''mẫu khí tài mới'', ''các thuật thức phát nổ'' và phủ định ''chẳng
    cần đến'', ''chẳng hề hấn gì''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000334
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & thuật ngữ: giữ câu hỏi phủ định ''Vậy là chúng
    ta không thể xuyên thủng lớp vỏ phòng thủ của chúng từ tầm xa ư?!'' và tiếng chửi
    cảm thán."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000335
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, nội tâm, đại từ & nhấn mạnh Markdown: trần thuật dùng
    ''nó'', câu nội tâm dùng ''chúng ta'' và bọc dấu sao ''*Nhưng đâu phải chúng ta
    có thể thong thả phân thắng bại trên bầu trời thuộc lãnh thổ địch.*'' khớp thẻ
    em nguồn theo DEC-P01-002; giữ thuật ngữ ''thuật thức bắn tỉa quang học với sức
    xuyên phá được đẩy lên mức tối đa''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000336
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, quân hàm & thuật ngữ: giữ ''Một vị trung úy'', ''đại
    đội của mình'' và ''mở đợt xung phong''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000337
  kind: terminology_and_voice
  value: 'choices=["Thoại chỉ huy, xưng hô & tình thái: Grantz hô ''Toàn đại đội,
    theo tôi!'' và nhận định tình thái ''Đánh cận chiến hẳn sẽ hữu hiệu trước lũ này!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000338
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & câu hỏi gián tiếp: quy chiếu Grantz bằng
    ''anh ta'' và Tanya bằng ''Tanya''/''nó''; giữ câu hỏi gián tiếp ''phân vân không
    biết có nên ngăn anh ta lại hay không'' và quyết định tôn trọng thái độ chủ động
    của cấp dưới."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000339
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh & quân hàm: Tanya ra lệnh ''“Thiếu tá Weiss, yểm
    trợ anh ta!”''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000340
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & quân hàm: Weiss hỏi lại Tanya bằng ''“Trung tá
    chắc chứ ạ?! Chúng ta sẽ trở thành mục tiêu lộ liễu mất!”'' đúng tương quan cấp
    bậc cấp dưới – cấp trên."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000341
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ, chức vụ & cấu trúc so sánh: quy chiếu Tanya
    bằng ''Nó''/''Tanya'' và Weiss bằng ''vị phó chỉ huy''; giữ ''các mẫu mới yếu
    hơn khi giao chiến ở cự ly gần'' và cấu trúc đối chiếu ''thay vì khư khư bám lấy
    sự an nhàn của lối đánh tầm xa..., lao thẳng vào xung phong mới là ý hay''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000342
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh & đại từ: giữ giọng Tanya gọi Grantz là ''gã ngốc
    Grantz đó'' và ra lệnh ''Hãy yểm trợ anh ta trên không!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000343
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ & thuật ngữ: quy chiếu Tanya bằng ''nó''; giữ
    ''đường rút lui và chi viện'', ''bọc hậu'' và ''truy quét sạch sẽ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000344
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm & thuật ngữ: Tanya gọi Serebryakov là ''Trung
    úy'', dùng ''đại đội chúng ta'', ''Xung phong vào thê đội đó!''; giữ lời ra hiệu
    trong ngoặc kép ''“Đi thôi!”'' và thuật ngữ ''các trận địa phòng không của Liên
    bang bắt đầu khai hỏa''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000345
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm & đại từ: giữ đại từ tự quy chiếu ''mình'' (''Ý
    mình là, chiến tranh mà.'') theo DEC-P01-001; không dùng chữ nghiêng."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000346
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ câu miêu tả biểu cảm kinh ngạc của Tanya ''Hai
    mắt Tanya suýt nữa thì trợn ngược lồi cả ra ngoài.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000347
  kind: terminology_and_voice
  value: 'choices=["Nội tâm câu hỏi & thuật ngữ: giữ câu hỏi kinh ngạc ''Chúng định
    trút cả một cơn mưa đạn phòng không lên khu vực mà chính các pháp sư của chúng
    đang bay sao?!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000348
  kind: terminology_and_voice
  value: 'choices=["Thoại, trần thuật, đại từ, phủ định & thuật ngữ: giữ câu hỏi phủ
    định ''Chúng thậm chí còn chẳng buồn phân biệt địch ta nữa ư?!'', đại từ trần
    thuật ''nó'' cho Tanya, thuật ngữ ''hỏa lực bắn rải theo khu vực'' và phủ định
    ''vốn ít có khả năng gây ra đòn trúng đích chí mạng nào''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000349
  kind: terminology_and_voice
  value: 'choices=["Thoại mệnh lệnh, phủ định & thuật ngữ: giữ phủ định ''Đừng cậy
    vào đánh lừa quang học!'', thuật ngữ ''lớp vỏ phòng thủ'' và lệnh ''Rồi tạm thời
    rút lui ngay!''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000350
  kind: terminology_and_voice
  value: 'choices=["Trần thuật, đại từ, giả định quá khứ & thuật ngữ: quy chiếu Tanya
    bằng ''nó''; giữ trọn các mệnh đề giả định quá khứ trái thực tế (''Nếu rơi vào
    cảnh hỗn loạn..., đám cấp dưới của nó hẳn đã biến thành những con chuồn chuồn
    bốc cháy cả rồi'', ''Nếu những quả cầu tính toán của Lục quân Đế quốc không vượt
    trội..., chắc chắn mọi chuyện đã diễn biến vô cùng tồi tệ'')."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000351
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & phủ định: người nói xưng ''tôi'' - ''chúng ta'';
    giữ phủ định quá khứ ''tôi chưa từng nghĩ chúng ta lại thất bại ngay trong một
    đợt xung phong''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000352
  kind: terminology_and_voice
  value: 'choices=["Nội tâm, đại từ, nhấn mạnh Markdown & thuật ngữ: dùng ''chúng
    ta'' cho phe Đế quốc; giữ ''Công quốc Dacia'', ''màn hỏa lực phòng ngự dày đặc'',
    ''các khẩu pháo phòng không và các chốt súng máy''; chỉ bọc ''*Chúng tao sẽ không
    để bọn mày bén mảng tới gần đâu*'' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000353
  kind: terminology_and_voice
  value: 'choices=["Nội tâm, đại từ, phủ định kép & điều kiện: dùng ''chúng ta'';
    giữ phủ định kép ''không thể phủ nhận rằng'', mệnh đề điều kiện ''Và nếu chúng
    ta chỉ đơn thuần bơm thêm ma năng vào để bù đắp cho sự chênh lệch đó, mức độ mệt
    mỏi của chúng ta sẽ vọt lên gấp nhiều lần bình thường'' và câu kết phủ định ''Chiến
    tranh quả thực chẳng hề đơn giản.''."]'
