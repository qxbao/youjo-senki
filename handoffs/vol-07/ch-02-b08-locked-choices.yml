- segment_id: YS-LN07/Text/chapter008.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Thoại & tình thái: giữ mức suy đoán chắc chắn của Lergen ''“Hẳn
    là điều không thể bàn tới.”''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & nghĩa: chỉ bọc ''*khó khăn*'' và ''*bất khả
    thi*'' khớp đúng hai thẻ em nguồn theo DEC-P01-002; giữ cấu trúc so sánh mức độ."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & phủ định: trần thuật nêu tên ''Tanya'', tự
    quy chiếu phụ thuộc bằng ''mình'', quy chiếu Tanya bằng ''nó'' theo DEC-P01-001;
    giữ phủ định ''chẳng thể nói hết câu''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & đại từ: chỉ bọc ''*Vậy nếu ngài
    đã hiểu rồi thì…*'' khớp thẻ em nguồn theo DEC-P01-002; nội tâm gọi Lergen là
    ''ngài'', trần thuật quy chiếu Tanya bằng ''Nó'' và Lergen bằng ''ông''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Lergen xưng ''tôi'', gọi Tanya là ''cô'', giữ
    sắc thái nhún nhường khi nhờ vả."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm, đại từ & phủ định: chỉ bọc ''*nhờ
