    ''ngài'', trần thuật dùng ''Tanya'' - ''nó'' theo DEC-P01-001; giữ phủ định ''chưa
    từng thấy Lergen cúi đầu bao giờ''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Đại từ, thuật ngữ & câu hỏi nội tâm: quy chiếu Lergen bằng ''Ông''/''ông'';
    ''General Staff officer'' -> ''sĩ quan Bộ Tổng tham mưu''; ''central'' -> ''trung
    ương''; ''general'' -> ''hàng tướng lĩnh''; giữ câu hỏi ngạc nhiên cuối đoạn."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & câu hỏi phủ định: trần thuật nêu tên ''Tanya'';
