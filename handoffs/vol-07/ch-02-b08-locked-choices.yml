- segment_id: YS-LN07/Text/chapter008.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Thoại & phủ định: giữ câu đáp ngắn gọn xác định phạm vi phủ định
    ''“Không phải về mặt chính thức.”''."]'
- segment_id: YS-LN07/Text/chapter008.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & phủ định: quy chiếu Lergen bằng ''ông'' và
