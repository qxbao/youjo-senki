  kind: terminology_and_voice
  value: 'choices=["Thoại, thuật ngữ & phủ định: Tanya xưng ''chúng tôi'' kèm tiểu
    từ lễ phép ''ạ''; giữ nguyên ''Kampfgruppe''; ''observer'' -> ''quan sát viên'';
    giữ phủ định ''không có nhân sự dư dả'' và thế bất định ''chưa rõ bao giờ hay
