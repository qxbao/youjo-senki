choices:
- segment_id: YS-LN07/Text/chapter016.xhtml/p000354
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya mở đầu cảnh: giữ ''đám pháp sư địch'' (enemy mages),
    ''đợt xung phong của chúng ta'' (our charge)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000355
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ ''Lớp vỏ phòng thủ'' (defensive
    shells), đại từ giả định chung ''bạn'' (you), tự xưng ''Mình'' (I), và hình ảnh
    so sánh pháp sư địch với ''xe tăng'' (tanks)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000356
  kind: terminology_and_voice
  value: 'choices=["Trần thuật kết hợp nội tâm Tanya: giữ đại từ trần thuật ''nó''
    (she) theo DEC-P01-001, ''đám xe tăng đó'' (the tanks), và giữ đúng phạm vi nhấn
    mạnh Markdown ''*chúng ta cứ mặc kệ chúng đi.*'' ứng với thẻ em trong nguồn theo
    DEC-P01-002."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000357
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya với cấp dưới: tự xưng ''Tôi'', giữ ''đám pháp
    sư địch'' (the enemy mages)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000358
  kind: terminology_and_voice
  value: 'choices=["Thoại của sĩ quan phụ tá Serebryakov hỏi lại Tanya: giữ sắc thái
    lễ phép sửng sốt ''Sao cơ ạ?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000359
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya: giữ ''viên sĩ quan phụ tá'' (her
    adjutant), đại từ ''Chúng ta'' (Let''s / We''ll), ''trận địa mặt đất của địch''
    (the enemy surface position)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000360
  kind: terminology_and_voice
  value: 'choices=["Thoại của Serebryakov can ngăn Tanya: giữ cách gọi cấp bậc của
    Tanya ở Tập 7 là ''Trung tá'' (''Xin Trung tá hãy cân nhắc lại'') và ý chiến thuật
    ''bị gọng kìm kẹp theo phương thẳng đứng'' (vertically pincered)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000361
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại chỉ huy qua vô tuyến của Tanya: giữ ''viên
    sĩ quan phụ tá'' (her adjutant), xưng hô ''Tôi - Cô'' với Serebryakov, hô hiệu
    ''01 gọi tất cả các đơn vị'' (01 to all units), ''đơn vị pháp sư Liên bang'' (the
    Federation mage unit), ''hỏa lực kiềm chế'' (checking fire)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000362
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ phủ định ''Chẳng có lý do gì''
    (There''s no reason), ''Đám xe tăng đó'' (The tanks), đại từ ''chúng ta'' (we)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000363
  kind: terminology_and_voice
  value: 'choices=[''Độc thoại nội tâm của Tanya: giữ quan hệ nhân quả và mục đích
    chiến thuật làm các đường đạn bắn chéo giao nhau để quân địch tự tiêu diệt lẫn
    nhau.'']'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000364
  kind: terminology_and_voice
  value: 'choices=["Thoại hiệu triệu của Tanya: giữ tự xưng ''tôi'' (''Theo tôi!'')."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000365
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn ngôi thứ nhất số nhiều của đơn vị Tanya: giữ ''ba đội
    hình tập kích'' (three strike formations), tình thái phỏng đoán ''có lẽ'' (probably)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000366
  kind: terminology_and_voice
  value: 'choices=["Mô tả diễn biến giao chiến: giữ ''đám pháp sư địch'' (the enemy
    mages), ''đánh chặn'' (intercept), ''thuật thức phát nổ'' (explosion formulas),
    ''màn khói'' (smoke screen)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000367
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ đúng nhấn mạnh Markdown ''*lướt đi*'' ứng với
    thẻ em ''gliding'' trong nguồn theo DEC-P01-002; giữ ''Tiểu đoàn Pháp sư Trên
    không số 203'' (203rd Aerial Mage Battalion), ''đám pháp sư Liên bang'' (Federation
    mages), ''các trận địa mặt đất'' (ground positions), đại từ ''Họ'' (They)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000368
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya dưới tác động của Type 95: giữ ''Thượng đế'' (God),
    ''chúng ta'' (us), ''lũ vô thần này'' (these atheists)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000369
  kind: terminology_and_voice
  value: 'choices=["Trần thuật về Tanya: giữ đại từ ''nó'' (she) cho Tanya theo DEC-P01-001,
    giữ nguyên tên khí tài ''Elinium Type 95'' và cấu trúc phủ định kép về nguy cơ
    bị ảnh hưởng."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000370
  kind: terminology_and_voice
  value: 'choices=["Thoại của Thiếu tá Weiss hùa theo lời Tanya: giữ tự xưng ''Tôi'',
    ''Thượng đế'' (God), ''kẻ địch của chúng ta'' (our enemy)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000371
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya chỉnh đốn Thiếu tá Weiss: giữ cấp bậc ''Thiếu
    tá'' (Major - chỉ Weiss) và tự xưng ''Tôi''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000372
  kind: terminology_and_voice
  value: 'choices=["Thoại của Thiếu tá Weiss bất ngờ trước phản ứng của Tanya: giữ
    câu cảm thán ngắn ''Hả?'' (Huh?)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000373
  kind: terminology_and_voice
  value: 'choices=["Thoại của Tanya cảnh cáo cấp dưới (Thiếu tá Weiss): giữ xưng hô
    ''tôi - anh'' (''tôi cảnh cáo anh đấy'')."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000374
  kind: terminology_and_voice
  value: 'choices=["Thoại của Thiếu tá Weiss xin lỗi cấp trên (Tanya): giữ sắc thái
    lễ phép của cấp dưới ''Xin thứ lỗi cho tôi ạ.''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000375
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tên riêng ''Tanya'', ''đường bay tập kích'' (strike
    path), ''phương án phòng ngự đã định sẵn'' (prescribed defense plan)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000376
  kind: terminology_and_voice
  value: 'choices=["Trần thuật bình luận chiến thuật: giữ mức độ tuyệt đối ''phản
    ứng tệ hại nhất có thể'' (the worst-possible reaction)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000377
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''Các trận địa mặt đất của Liên bang'' (The Federation
    surface positions), ''hỏa lực bắn rải theo khu vực'' (zone fire), tên riêng ''Tanya''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000378
  kind: terminology_and_voice
  value: 'choices=["Thoại cười đắc thắng của Tanya: giữ ''Quân Liên bang'' (Federation
    troops), ''những phát đạn lạc'' (stray shots)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000379
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ tương phản giữa ''đơn vị pháp sư Liên bang'' (the
    Federation mage unit) và ''Tiểu đoàn Pháp sư Trên không số 203'' (203rd Aerial
    Mage Battalion) đang ''bổ nhào oanh kích'' (dive-bombing), cùng phủ định nhấn
    mạnh ''chẳng hề bị sượt qua dù chỉ một chút'' (doesn''t get so much as grazed)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000380
  kind: terminology_and_voice
  value: 'choices=["Trần thuật: giữ ''hỏa lực phòng không'' (anti-air fire), ''đám
    pháp sư Liên bang'' (the Federation mages), phủ định ''có muốn cũng chẳng thể
    chuyển từ thế thủ sang thế công'', ''các thuật thức phát nổ'' (explosion formulas),
    ''những trận địa pháo phòng không'' (anti-air cannon positions)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000381
  kind: terminology_and_voice
  value: 'choices=["Mệnh lệnh tác chiến của Tanya: giữ ''Triển khai thuật thức!''
    (Manifest formulas!)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000382
  kind: terminology_and_voice
  value: 'choices=["Bình luận chiến thuật từ điểm nhìn của Tanya: giữ đại từ giả định
    chung ''bạn'' (you), ''viên đạn ma pháp'' (magic bullet), ''Hỏa lực yểm trợ của
    pháp sư'' (Mage-covering fire)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000383
  kind: terminology_and_voice
  value: 'choices=["Thoại báo cáo của sĩ quan phụ tá Serebryakov: giữ ''Các trận địa
    địch'' (Enemy positions) và tiểu từ lễ phép ''ạ''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000384
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại mệnh lệnh của Tanya: giữ ''viên sĩ quan phụ
    tá'' (her adjutant), đại từ ''Chúng ta'' (We''re / Let''s)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000385
  kind: terminology_and_voice
  value: 'choices=["Thoại hỏi lại của Serebryakov với Tanya: giữ cách dịch ''…Trò
    đuổi bắt sao ạ?'' (…Tag?)."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000386
  kind: terminology_and_voice
  value: 'choices=["Trần thuật và thoại của Tanya với Serebryakov: giữ đại từ ''cô''
    chỉ Serebryakov trong trần thuật, và đại từ ''Chúng ta'' trong thoại của Tanya."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000387
  kind: terminology_and_voice
  value: 'choices=["Độc thoại phân tích tình huống của Tanya: giữ ''Đám pháp sư Liên
    bang'' (The Federation mages), ''mẫu quả cầu tính toán mới'' (the new computation-orb
    model), cùng cấu trúc điều kiện giả định ở hai câu cuối."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000388
  kind: terminology_and_voice
  value: 'choices=["Độc thoại nội tâm của Tanya: giữ câu hỏi gián tiếp về việc dàn
    dựng màn rút lui giả (''a fake withdrawal'') và câu hỏi tự vấn pha chút ngỡ ngàng
    ở cuối đoạn ''chắc là chúng ta chỉ gặp may thôi nhỉ?''."]'
- segment_id: YS-LN07/Text/chapter016.xhtml/p000389
  kind: terminology_and_voice
  value: 'choices=["Trần thuật từ điểm nhìn Tanya: giữ đại từ ''Nó'' / ''nó'' và ''mình''
    cho Tanya theo DEC-P01-001, đại từ ''họ'' (they) cho đơn vị của Tanya, cùng phủ
    định ''chẳng cần phải làm gì cả'' và ''hóa ra lại thành thừa thãi''."]'
