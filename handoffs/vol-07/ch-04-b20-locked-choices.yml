choices:
- segment_id: YS-LN07/Text/chapter016.xhtml/p000557
  kind: terminology_and_voice
  value: terms=['Tiểu đoàn Pháp sư Trên không số 203', 'Kampfgruppe', 'căn cứ tiền
    phương lâm thời', 'Đại úy Meybert']; pov_and_pronouns=Trần thuật ngôi thứ ba;
    quy chiếu đơn vị bằng 'họ', giữ tên riêng Tanya.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000558
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại của Tanya hỏi nhóm ở lại; gọi cấp dưới là 'các anh'.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000559
  kind: terminology_and_voice
  value: terms=['Đại úy Ahrens']; pov_and_pronouns=Thoại báo cáo của Đại úy Meybert
    với Tanya; có kính ngữ 'ạ', quy chiếu Ahrens đồng cấp bằng 'anh ấy'.; emphasis=Không
    dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000560
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại của Đại úy Ahrens với Tanya; xưng 'tôi', có kính ngữ
    'ạ'.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000561
  kind: terminology_and_voice
  value: terms=['Meybert', 'Ahrens', 'tuyến tiền tiêu']; pov_and_pronouns=Mở đầu bằng
    cảm thán nội tâm của Tanya, tiếp nối bởi trần thuật pha điểm nhìn; gọi Ahrens
    là 'anh ta', giữ phủ định nhấn mạnh ('chẳng mảy may hiểu được').; emphasis=In
    nghiêng đúng từ mở đầu '*Thật quá quắt.*' theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000562
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại của Tanya nói với Ahrens; xưng 'tôi' – 'anh', giữ
    giả định tiếc nuối trong quá khứ ('ước gì lúc đó anh đổi chỗ cho tôi').; emphasis=Không
    dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000563
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại tiếng cười của Ahrens.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000564
  kind: terminology_and_voice
  value: terms=['Ahrens', 'tiểu đoàn pháp sư trên không']; pov_and_pronouns=Trần thuật
    đan xen câu nội tâm trực tiếp in nghiêng và phỏng đoán nội tâm gián tiếp ('Có
    khi… cũng nên').; emphasis=In nghiêng đúng câu nội tâm giữa đoạn theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000565
  kind: terminology_and_voice
  value: terms=['nhiệm vụ ngăn chặn địch đào thoát']; pov_and_pronouns=Trần thuật
    nối tiếp lập luận của đoạn trước; dịch đại từ chỉ tiểu đoàn thành 'đơn vị'.; emphasis=Không
    dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000566
  kind: terminology_and_voice
  value: terms=['cấp trên', 'Bộ Tổng tham mưu']; pov_and_pronouns=Trần thuật theo
    điểm nhìn của Tanya; dùng 'Nó' cho Tanya theo DEC-P01-001 và 'họ' cho tiểu đoàn.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000567
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngôi thứ ba về kỳ vọng của Tanya; dùng 'họ' cho
    đơn vị.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000568
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật dùng 'nó' cho Tanya theo DEC-P01-001; giữ mệnh
    đề điều kiện phủ định ('nếu nó không giải quyết dứt điểm').; emphasis=In nghiêng
    đúng thán từ mở đầu '*À phải rồi*' trước dấu gạch ngang theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000569
  kind: terminology_and_voice
  value: terms=['Trung tướng von Zettour', 'Bộ Tổng tham mưu', 'mặt trận Rhine'];
    pov_and_pronouns=Câu đầu trần thuật ngôi thứ ba ('Họ'), câu hai chuyển sang độc
    thoại nội tâm ngôi thứ nhất không in nghiêng nên tự xưng 'Mình' theo DEC-P01-001.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000570
  kind: terminology_and_voice
  value: terms=['Quân đội Liên bang']; pov_and_pronouns=Thoại của Tanya; dùng 'chúng
    ta' cho quân mình và 'chúng' cho quân địch, giữ sắc thái phỏng đoán ('có lẽ').;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000571
  kind: terminology_and_voice
  value: pov_and_pronouns=Liên từ chuyển đoạn ngắn mang giọng nội tâm.; emphasis=In
    nghiêng toàn bộ '*Vì thế.*' theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000572
  kind: terminology_and_voice
  value: terms=['suy nghĩ viển vông']; pov_and_pronouns=Trần thuật ngôi thứ ba nhận
    xét về sai lầm của Tanya.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000573
  kind: terminology_and_voice
  value: terms=['vòng vây']; pov_and_pronouns=Thoại bỏ lửng nêu băn khoăn về khả năng
    giữ vòng vây.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000574
  kind: terminology_and_voice
  value: terms=['nỗ lực truy quét']; pov_and_pronouns=Thoại của Tanya đáp lại cấp
    dưới ('anh'); dùng 'chúng ta' cho đơn vị.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000575
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại báo cáo ngắn của lính thông tin; thêm 'ạ' thể hiện
    đúng quan hệ cấp dưới báo cáo.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000576
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại cảm thán ngắn kèm trần thuật; dùng 'nó' cho Tanya
    theo DEC-P01-001.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000577
  kind: terminology_and_voice
  value: terms=['người lính thông tin']; pov_and_pronouns=Trần thuật dùng 'nó' và
    đại từ phản thân 'mình' cho Tanya; giữ phủ định ('không phải là điều mình hằng
    hy vọng').; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000578
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại báo cáo khẩn của lính thông tin; có 'ạ' ở cuối câu.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000579
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngôi thứ ba; dùng 'họ' cho Tanya và các sĩ quan
    tại sở chỉ huy.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000580
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại của Tanya; xưng 'Tôi' và dùng 'chúng ta' cho toàn
    quân.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000581
  kind: terminology_and_voice
  value: terms=['vị phó chỉ huy']; pov_and_pronouns=Thoại của Weiss có 'ạ'; trần thuật
    dùng 'nó' cho Tanya và 'anh' cho vị phó chỉ huy.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000582
  kind: terminology_and_voice
  value: pov_and_pronouns=Trần thuật ngôi thứ ba; dùng 'họ' cho Tanya và các sĩ quan.;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000583
  kind: terminology_and_voice
  value: terms=['điểm vượt sông']; pov_and_pronouns=Thoại báo cáo tiếp theo của lính
    thông tin; giữ 'ạ' cuối câu.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000584
  kind: terminology_and_voice
  value: pov_and_pronouns=Thoại thốt lên bị ngắt quãng của Tanya; trần thuật dùng
    'nó' cho Tanya và giữ câu cảm thán giả định ở cuối đoạn.; emphasis=Không dùng
    chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000585
  kind: terminology_and_voice
  value: terms=['Đơn vị đổ bộ đường không', 'sư đoàn xe tăng địch', 'lực lượng thiết
    giáp']; pov_and_pronouns=Thoại báo cáo chiến sự của lính thông tin; giữ kính ngữ
    'ạ'.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000586
  kind: terminology_and_voice
  value: terms=['sở chỉ huy']; pov_and_pronouns=Kết hợp thoại của Tanya ('chúng ta',
    'chúng'), phần lời định nói chuyển vào nội tâm và câu trần thuật ('Nó').; emphasis=In
    nghiêng đúng cụm '*…nghiền nát sở chỉ huy của chúng rồi cơ mà.*' theo DEC-P01-002.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000587
  kind: terminology_and_voice
  value: terms=['sở chỉ huy', 'Quân đội Liên bang']; pov_and_pronouns=Hai câu hỏi
    nội tâm gián tiếp tự do của Tanya; dùng 'chúng' cho phía Liên bang.; emphasis=Không
    dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000588
  kind: terminology_and_voice
  value: terms=['tù binh chiến tranh', 'Quân đội Liên bang', 'đội quân chỉ huy theo
    kiểu cầm tay chỉ việc']; pov_and_pronouns=Trần thuật điểm nhìn của Tanya; dùng
    'Nó' cho Tanya theo DEC-P01-001.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000589
  kind: terminology_and_voice
  value: terms=['vòng vây', 'ảo tưởng']; pov_and_pronouns=Trần thuật dùng 'nó' cho
    Tanya; giữ đúng cấu trúc giả định trái thực tế ('Nếu như trên thực tế vòng vây
    không bị chọc thủng, hẳn nó đã cười khẩy…').; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000590
  kind: terminology_and_voice
  value: terms=['lực lượng đoạn hậu']; pov_and_pronouns=Thoại phẫn nộ và kinh ngạc
    của Tanya; gọi sở chỉ huy địch là 'bọn chúng'.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000591
  kind: terminology_and_voice
  value: terms=['Quân đội Liên bang']; pov_and_pronouns=Trần thuật phân tích cấu trúc
    tổ chức của Quân đội Liên bang; giữ giả định ('lẽ ra phần đầu phải là điểm yếu').;
    emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000592
  kind: terminology_and_voice
  value: terms=['sở chỉ huy', 'đội quân biết tư duy']; pov_and_pronouns=Thoại của
    Tanya; gọi quân Liên bang là 'chúng'.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000593
  kind: terminology_and_voice
  value: terms=['đội quân biết tư duy']; pov_and_pronouns=Thoại hỏi lại lắp bắp của
    cấp dưới ('đ-đội quân'); có 'ạ' cuối câu.; emphasis=Không dùng chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000594
  kind: terminology_and_voice
  value: terms=['Lục quân Đế quốc', 'đội quân chỉ huy theo kiểu cầm tay chỉ việc',
    'phương thức chỉ huy theo nhiệm vụ']; pov_and_pronouns=Thoại của Tanya dùng 'chúng
    ta' và 'Chúng'; câu trần thuật xen giữa dùng 'nó' cho Tanya.; emphasis=Không dùng
    chữ nghiêng.
- segment_id: YS-LN07/Text/chapter016.xhtml/p000595
  kind: terminology_and_voice
  value: terms=['Chỉ huy theo kiểu cầm tay chỉ việc', 'Bộ Tư lệnh', 'chế độ trưng
    binh đại trà']; pov_and_pronouns=Trần thuật giải thích học thuyết quân sự; dùng
    đại từ khái quát 'bạn' tương ứng với 'you' trong bản gốc.; emphasis=Không dùng
    chữ nghiêng.
