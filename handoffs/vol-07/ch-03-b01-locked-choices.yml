choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000001
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề thời gian – địa điểm: giữ định dạng in hoa toàn bộ ''NGÀY
    1 THÁNG 5 NĂM THỐNG NHẤT 1927, ILDOA, VĂN PHÒNG TƯỚNG GASSMAN''; không dùng chữ
    nghiêng."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000002
  kind: terminology_and_voice
  value: 'choices=["Đại từ, quân hàm & dấu câu: trần thuật quy chiếu Lergen bằng ''anh''
    và Tướng Gassman bằng ''ông'' / ''vị tướng quân''; giữ nguyên mệnh đề trong ngoặc
    đơn và dấu ngoặc kép mỉa mai quanh cụm ''“chẳng qua chỉ là” một đại tá''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000003
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm & xưng hô: Tướng Gassman gọi ''Đại tá von Lergen''
    và xưng hô lịch sự ''ngài''; giữ tình thái phỏng đoán ''Chắc hẳn ngài đã mệt nhoài''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000004
  kind: terminology_and_voice
  value: 'choices=["Tình thái giả định & phủ định kép: giữ giả định quá khứ ''Kẻ nào
    không rõ nội tình có lẽ đã rơi nước mắt trước chiếc mặt nạ này rồi'' và cấu trúc
    phủ định kép ''Thật khó mà không mủi lòng trước sự tử tế như thế từ một vị tướng''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000005
  kind: terminology_and_voice
  value: 'choices=["Quân hàm, đại từ & sắc thái: giữ ''Đại tá von Lergen'', đại từ
    ''anh'', hình ảnh ẩn dụ ''chiếc mặt nạ'' và nhận xét ''gần như là một dạng vẻ
    đẹp chuẩn mực mang tính hình thức''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000006
  kind: terminology_and_voice
  value: 'choices=["Thoại ngoại giao & đại từ: Lergen xưng ''Tôi'' và dùng ''chúng
    tôi'' đại diện cho Đế quốc khi cảm ơn ''người đồng minh yêu quý của chúng tôi''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000007
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & thuật ngữ: Gassman dùng ''chúng ta'' cho hai nước
    láng giềng; trần thuật quy chiếu Gassman bằng ''Ông''; ''the Reich’s capital''
    -> ''thủ đô Đế quốc''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000008
  kind: terminology_and_voice
  value: 'choices=["Phủ định kép, đại từ & xưng hô: giữ cấu trúc phủ định kép ''không
    thể nào không nắm bắt được ẩn ý của vị tướng quân''; trần thuật gọi Gassman là
    ''ông'' và Lergen là ''anh''; trong thoại Lergen gọi Gassman là ''ngài'' và lặp
    lại cụm ''“…Lúc hoạn nạn, vâng, ngài nói rất phải.”''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000009
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & phủ định: Gassman xưng ''Tôi'', gọi Lergen là
    ''ngài'' và gộp chung là ''chúng ta''; giữ các cấu trúc phủ định khuyên nhủ ''Không
    cần phải câu nệ như thế đâu'' và ''đừng quá bận tâm đến sự chênh lệch quân hàm
    giữa chúng ta''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000010
  kind: terminology_and_voice
  value: 'choices=["Thoại, xưng hô & thuật ngữ: Lergen xưng ''tôi''/''Tôi'', gọi phía
    Ildoa là ''phía các ngài''; ''mediation of a compromise'' -> ''việc làm trung
    gian hòa giải tiến tới một thỏa hiệp''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000011
  kind: terminology_and_voice
  value: 'choices=["Thoại & xưng hô: Gassman đáp ngắn gọn ''“Ngài cứ nói đi.”''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000012
  kind: terminology_and_voice
  value: 'choices=[''Trần thuật: giữ chi tiết cả hai người đàn ông vừa gật gù vừa
    nhả khói thuốc và tiếp tục cuộc trò chuyện.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000013
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ, tình thái & thuật ngữ: Gassman xưng ''tôi'' và
    ''Chúng tôi'' (Ildoa), gọi phía Đế quốc là ''các ngài''; ''Imperial Army'' ->
    ''Lục quân Đế quốc''; giữ tình thái nhận định ''xem chừng đang gặp nhiều khó khăn
    ở phía đông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000014
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & xưng hô: ''Southern Continent Expeditionary Army Corps''
    -> ''Quân đoàn Viễn chinh Lục địa Phía nam''; Lergen gọi phía Ildoa là ''các ngài'';
    giữ dấu chấm lửng mở đầu câu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000015
  kind: terminology_and_voice
  value: 'choices=["Thoại & câu hỏi đuôi: giữ giọng giả lả tự nhiên của Gassman ''“Ồ
    phải rồi. Còn có chuyện đó nữa nhỉ?”''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000016
  kind: terminology_and_voice
  value: 'choices=["Thoại, đại từ & sắc thái: Lergen xưng ''Tôi''; dịch ''the men
    in the field'' là ''anh em ngoài chiến trường'' và giữ sắc thái nói giảm ''việc
    tiếp tế thường hay bị chậm trễ''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000017
  kind: terminology_and_voice
  value: 'choices=["Phủ định bộ phận, nhượng bộ & xưng hô: giữ phủ định bộ phận ''Đâu
    phải chuyện gì cũng diễn ra suôn sẻ một cách hoàn hảo được'', xưng hô ''Tôi''
    - ''ngài'', và mệnh đề nhượng bộ ''Dù có nghĩa vụ với đồng minh đi chăng nữa,
    bản thân Ildoa cũng có những vấn đề của riêng mình''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000018
  kind: terminology_and_voice
  value: 'choices=["Thoại: giữ câu đáp ngắn gọn của Lergen ''“Tôi hiểu điều đó.”''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000019
  kind: terminology_and_voice
  value: 'choices=["Thoại câu hỏi & xưng hô: Gassman hỏi Lergen bằng cặp ''ngài''
    - ''tôi'' (''“Vậy ngài có thể châm chước điểm đó giúp tôi chứ?”'')."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000020
  kind: terminology_and_voice
  value: 'choices=["Thoại & trần thuật: giữ câu đáp ''“Vâng.”'' và hành động Lergen
    gật đầu với vị tướng quân."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000021
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & tình thái: quy chiếu Gassman bằng ''ông''/''vị
    tướng quân'' và Lergen bằng ''anh''; giữ tình thái suy đoán ''chắc hẳn phía bên
    kia cũng có tâm trạng y hệt'' và mong muốn của Lergen muốn biết suy nghĩ thực
    sự của Gassman và Ildoa."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000022
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ & điều kiện: ''Southern Continent Expeditionary Army
    Corps'' -> ''Quân đoàn Viễn chinh Lục địa Phía nam''; giữ mệnh đề điều kiện bổ
    sung ở câu sau ''Tất nhiên là trong trường hợp cần thiết để phục vụ cho việc đàm
    phán.''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000023
  kind: terminology_and_voice
  value: 'choices=["Thoại, quân hàm, xưng hô & tình thái: giữ sự chuyển ý từ tán thưởng
    sang đi thẳng vào trọng tâm của Gassman; gọi ''Đại tá von Lergen'' là ''ngài''
    và giữ tình thái ''dường như ngài đang hiểu lầm điều gì đó''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000024
  kind: terminology_and_voice
  value: 'choices=["Thoại, phủ định & trần thuật: Lergen đáp bằng câu hỏi ngắn và
    câu phủ định ''Tôi không rõ ý ngài là gì''; trần thuật quy chiếu Lergen bằng ''anh''
    và giữ sự tương phản khi Gassman vừa tươi cười vừa trút lời chỉ trích."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000025
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi, đại từ & tình thái: giữ nguyên hai câu hỏi liên tiếp
    của Gassman; ''the Empire'' -> ''Đế quốc''; ''You'' -> ''các ngài''; ''me'' ->
    ''tôi''; giữ tình thái ''xem ra đó mới là vấn đề cấp bách nhất''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000026
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản bác, đại từ, phủ định & thuật ngữ: phân biệt rõ ''Các
    ngài''/''ngài'' (Ildoa/Gassman) và ''chúng tôi''/''mình''/''tôi'' (Đế quốc/Lergen);
    giữ câu phủ định mỉa mai ''tôi không tài nào hiểu nổi cách hành xử của Vương quốc
    Ildoa''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000027
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & quan hệ chuyển ý: ''Federation'' -> ''Liên
    bang''; ''its logic'' -> ''cái lý của nó''; trần thuật quy chiếu Gassman bằng
    ''ông'', trong thoại dùng ''tôi'' - ''ngài''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000028
  kind: terminology_and_voice
  value: 'choices=["Nhượng bộ, phủ định & nhân quả: giữ mệnh đề nhượng bộ ''Cho dù
    có nhận thức được những nguyên do đó đi chăng nữa'', phủ định ''Đế quốc cũng không
    thể chấp nhận tình hình hiện tại'' và quan hệ hệ quả ''Đó là lý do vì sao Lergen,
    trong vai trò người đưa tin, buộc phải diễn tròn vai của mình theo đúng kịch bản''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000029
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Lergen gọi ''Thưa Tướng quân'', xưng hô ''ngài''
    và hỏi thẳng về ''cái lý'' mà Gassman vừa nêu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000030
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, đại từ & phủ định: ''provisional discussion plan''
    -> ''Phương án thảo luận lâm thời''; ''mediator'' -> ''người trung gian hòa giải'';
    ''Federation'' -> ''Liên bang''; ''unconditional cease-fire with zero reparations
    or cessations'' -> ''một lệnh ngừng bắn vô điều kiện, không bồi thường chiến phí
    cũng không cắt nhượng lãnh thổ''; giữ xưng hô ''nước ngài''/''các ngài'' và đại
    từ trần thuật ''ông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000031
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, phủ định & đại từ: chỉ bọc câu độc thoại nội
    tâm ''*Đòi hỏi thế thì thật quá đáng hết sức.*'' trong dấu sao khớp thẻ em nguồn
    theo DEC-P01-002; giữ phủ định ''sẽ không đời nào nuốt trôi những điều khoản ngang
    ngược như thế'' và đại từ ''anh'' quy chiếu Lergen."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000032
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, quân hàm, phủ định giả định & tình thái: chỉ
    bọc câu nội tâm cuối đoạn ''*Chà, chuyện này quả là, ừm, biết nói sao nhỉ.*''
    trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; giữ tương quan quân hàm ''một
    đại tá'' - ''một vị tướng'', phủ định giả định ''Trong hoàn cảnh bình thường,
    anh sẽ chẳng thể thoát tội chỉ bằng việc toát mồ hôi lạnh'' và tình thái suy đoán
    ''hẳn được chấp nhận nhờ sự ngầm hiểu chung giữa đôi bên''."]'
