- segment_id: YS-LN07/Text/chapter004.xhtml/p000129
  kind: terminology_and_voice
  value: 'choices=Thoại của Weiss đáp lời Tanya: giữ cách thưa ''Rõ, thưa Trung tá.''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000130
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: dùng đại từ ''chúng tôi'' chỉ đơn vị mình; khóa ''các
    pháp sư trên không của Liên bang'', ''mặt trận phía đông'', ''Trung đoàn 54''
    và tình thái dự đoán thuận lợi ở câu cuối.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000131
  kind: terminology_and_voice
  value: 'choices=Thoại của Tanya với thuộc cấp: xưng ''Chúng ta''/''Tôi''; giữ chỉ
    dẫn ở lại chờ màn đêm che phủ và tranh thủ thay phiên nhau ngủ.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000132
  kind: terminology_and_voice
  value: 'choices=Thoại của Weiss: giữ câu lửng than phiền việc giường chiếu đã bị
    thổi bay hết.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000133
  kind: terminology_and_voice
  value: 'choices=Thoại của Tanya với Weiss: xưng ''Tôi'', gọi ''anh''; khóa ''nửa
    tiểu đoàn pháp sư trên không'' và chỉ dẫn dùng trà cùng ''sô-cô-la giàu năng lượng''
    cho số binh sĩ chưa tới lượt ngủ.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000134
  kind: terminology_and_voice
  value: 'choices=Thoại của Weiss với Tanya: giữ sắc thái nhận xét bông đùa lễ phép
    có kính ngữ ''ạ''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000135
  kind: terminology_and_voice
  value: 'choices=Nội tâm, trần thuật và thoại của Tanya: giữ đúng phạm vi nhấn mạnh
    Markdown ''*Anh nói không sai.*'' theo DEC-P01-002; khóa ''vị phó chỉ huy'' và
    câu điều kiện phủ định ''Đấy là nếu quân địch không tấn công.''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000136
  kind: terminology_and_voice
  value: 'choices=Thoại của Weiss với Tanya: xưng ''tôi''; giữ lời xin phép đi nghỉ
    ca đầu.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000137
  kind: terminology_and_voice
  value: 'choices=Thoại của Tanya với Weiss: xưng ''Tôi'', gọi ''anh''; giữ mốc thời
    gian ''hai tiếng nữa đổi ca'' và lời hẹn gọi dậy.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000138
  kind: terminology_and_voice
  value: 'choices=Thoại và trần thuật: khóa ''Weiss chào điều lệnh'', ''hai vị trung
    úy''; dùng đại từ ''nó'' cho Tanya trong trần thuật theo DEC-P01-001.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000139
  kind: terminology_and_voice
  value: 'choices=Thoại giao việc của Tanya: gọi ''Trung úy Serebryakov'' là ''cô''
    (bảo đi ngủ), gọi ''Trung úy Grantz'' là ''anh'', xưng ''tôi'' (bảo ở lại cùng
    mình và đi tìm hạt cà phê).'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000140
  kind: terminology_and_voice
  value: 'choices=Thoại hỏi lại của Grantz với Tanya: giữ kính ngữ ''Hạt cà phê ạ,
    thưa Trung tá?''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000141
  kind: terminology_and_voice
  value: 'choices=Thoại của Tanya với Grantz: xưng ''Tôi''/''chúng ta'', gọi ''anh'';
    khóa ''sở chỉ huy Trung đoàn 54'', ''thẻ bài của binh lính'', ''hậu phương'',
    ''hàng xa xỉ phẩm''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000142
  kind: terminology_and_voice
  value: 'choices=Thoại nhận lệnh của Grantz: xưng ''Tôi''; giữ ý cắt cử vài người
    đi thực hiện.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000143
  kind: terminology_and_voice
  value: 'choices=Trần thuật: khóa ''các pháp sư'', ''Tanya'' và chi tiết vác xẻng
    lên đường trong khi Tanya ăn sô-cô-la.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000144
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: dùng ''chúng tôi''; khóa ''điểm tập kết'' và ''Kampfgruppe
    Salamander''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000145
  kind: terminology_and_voice
  value: 'choices=Nội tâm phân tích: giữ quan hệ điều kiện giữa khả năng điều phối
    đáng ngờ và viễn cảnh kinh khủng khi phải hợp tác với đơn vị khác.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000146
  kind: terminology_and_voice
  value: 'choices=Trần thuật kết hợp nội tâm: giữ tên ''Tanya'', cấu trúc phủ định
    kép ''khó để không lộ cảm xúc đó ra'' và sự đối lập giữa ''dân chuyên nghiệp''
    với ''đám tay mơ''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=Nội tâm nhận định: giữ hình ảnh ẩn dụ ''Một đám quân ô hợp về cơ
    bản chẳng khác nào một cơn ác mộng di động.''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=Nội tâm lập luận: khóa ''trách nhiệm tập thể''; dùng đại từ giả
    định chung ''bạn'' cho mệnh đề đánh cược mạng sống.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: dùng đại từ tự quy chiếu ''Mình''/''mình'' theo DEC-P01-001;
    giữ phủ định dứt khoát việc phó thác mạng sống cho kẻ không đáng tin.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: giữ câu hỏi tu từ so sánh với việc để ''gã lang băm
    không có giấy phép hành nghề y'' chữa trị.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: dùng ''mình'' theo DEC-P01-001; giữ điều kiện ''Chừng
    nào họ còn đảm bảo các chuẩn mực chuyên môn'' để dành sự tôn trọng cho bác sĩ.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=Nội tâm lập luận: giữ đầy đủ các cấu trúc phủ định so sánh (''Chẳng
    có thứ phế thải nào độc hại hơn...'', ''không được phép có bất kỳ sự thỏa hiệp
    nào'', ''chẳng khác nào gánh nặng vô dụng, thậm chí còn chẳng dùng làm bia đỡ
    đạn được'').'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=Nội tâm và trần thuật: giữ đúng phạm vi nhấn mạnh Markdown cho ba
    câu đầu theo DEC-P01-002 (dùng ''tôi'' trong lời nhắn giả định hướng tới đối tượng
    không chuyên); phần trần thuật sau giữ tên ''Tanya'' và ''Tanya von Degurechaff''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=Nội tâm hồi ức: dùng ''mình'' theo DEC-P01-001; khóa ''động vật
    chính trị'' và ''Nhật Bản''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: dùng ''mình'' theo DEC-P01-001; giữ tình thái ''có
    lẽ'' và phủ định ''chưa thực sự thấu hiểu hết''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=Thoại độc thoại của Tanya: khóa ''học tập suốt đời'' và giữ dạng
    câu hỏi đuôi cảm thán.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=Nội tâm lập luận: khóa thuật ngữ ''vốn con người'' theo P03-human-capital;
    giữ hai mệnh đề phủ định ở câu đầu và câu cuối.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=Thoại độc thoại của Tanya: giữ câu hỏi cảm thán về bổn phận của
    ''dân chuyên nghiệp''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=Trần thuật/nội tâm: khóa ''Tiểu đoàn Pháp sư Trên không số 203'',
    ''Kampfgruppe Salamander'' và đánh giá ''những chuyên gia mẫu mực thực thụ''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=Trần thuật đánh giá: giữ tên ''Tanya''; khóa ba yếu tố thứ yếu ''tính
    cách, học vấn và gu thẩm mỹ'' và tiêu chí chính là hoàn thành tốt nhiệm vụ.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: dùng ''mình'' theo DEC-P01-001; giữ sự phân biệt
    giữa đời tư và công việc, cùng lựa chọn ''nhóm đầu tiên'' (những kẻ cuồng chiến
    biết đánh trận) khi ở ngoài ''tiền tuyến''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=Trần thuật: giữ tên ''Tanya'' và nhịp chuyển bất ngờ.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=Thoại tự vấn của Tanya: tự xưng ''mình''; giữ đúng câu hỏi về tiền
    đề mặc định phải tham chiến.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=Trần thuật: dùng đại từ ''nó'' cho Tanya theo DEC-P01-001; giữ quan
    hệ giả định ''Nếu bảo lý do là vì... thì cũng chẳng còn gì để bàn cãi.''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=Trần thuật/nội tâm: khóa ''người theo chủ nghĩa dân chủ tự do ôn
    hòa và yêu chuộng hòa bình như Tanya''; giữ đúng phạm vi nhấn mạnh Markdown ''*một
    ngoại lệ*'' theo DEC-P01-002 và câu phủ định kế tiếp.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=Nội tâm nhận định: giữ phủ định ''Chiến tranh không nên được dùng
    làm cái cớ để biện minh cho bất cứ điều gì.''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=Thoại chửi thề ngắn của Tanya: giữ ''Khốn kiếp thật.''.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=Nội tâm Tanya: giữ đúng phạm vi nhấn mạnh Markdown toàn câu ''*Cuộc
    chiến này cần phải kết thúc.*'' theo DEC-P01-002.'
- segment_id: YS-LN07/Text/chapter004.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=Trần thuật kết chương: giữ tên ''Tanya'', chi tiết nuốt ngược những
    lời đó vào lòng thay vì nói ra và xoay gót bước đi với vẻ mặt u ám.'
