choices:
- segment_id: YS-LN07/Text/chapter010.xhtml/p000147
  kind: terminology_and_voice
  value: 'choices=["Câu hỏi phản bác & thành ngữ: giữ câu hỏi cảm thán của Zettour
    và dịch ''respond in kind'' là ''ăn miếng trả miếng'', dùng đại từ ''chúng ta''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000148
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & ẩn dụ: Rudersdorf gọi Zettour là ''ông'', dùng ''chúng
    ta'' cho phía Đế quốc; giữ trọn chuỗi ẩn dụ nhử địch ra khỏi hang và gieo mầm
    – gặt quả – mùa thu hoạch."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000149
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thái độ: Zettour xưng ''tôi'', gọi Rudersdorf là ''ông'';
    giữ sự đối lập giữa vẻ ngơ ngác của Zettour và giọng bực dọc của Rudersdorf."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000150
  kind: terminology_and_voice
  value: 'choices=[''Quan hệ nhân quả & thuật ngữ: giữ kết nối nhân quả giữa việc
    gieo mầm tự quyết làm nở rộ phong trào chống Liên bang ở vùng chiếm đóng với thời
    cơ tiêu diệt chủ lực địch.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000151
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & nhịp điệu: giữ phản ứng lẩm bẩm ''Hừm'' của Zettour
    và đà nói ngày càng hăng hái của Rudersdorf."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000152
  kind: terminology_and_voice
  value: 'choices=["Phủ định, so sánh & thuật ngữ: giữ khẳng định phủ định ''Liên
    bang không thể trụ nổi đâu!'' và phép so sánh tương đồng giữa sự sụp đổ của hoàng
    tộc Russy với cảnh Đảng Cộng sản Liên bang tán loạn như lũ chuột."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000153
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, câu hỏi & thuật ngữ: Zettour xưng ''tôi'', gọi Rudersdorf
    là ''Ông''; giữ yêu cầu đưa bằng chứng và câu hỏi nghi vấn về ''suy nghĩ viển
    vông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000154
  kind: terminology_and_voice
  value: 'choices=["Giọng thoại: giữ câu đáp ngắn gọn, đanh thép ''Lịch sử làm chứng.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000155
  kind: terminology_and_voice
  value: 'choices=["Nhân hóa & phủ định ngầm: Zettour xưng ''Tôi'' / ''tôi''; giữ
    lối nhân hóa lịch sử thành ''gã khốn đó'' và ''kẻ nói dối tệ hại nhất''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000156
  kind: terminology_and_voice
  value: 'choices=["Điều kiện & tình thái: giữ tiếng cười, cử chỉ nhún vai và câu
    điều kiện giả định kèm tình thái khả năng ''biết đâu ta lại có thể dùng nắm đấm
    sắt mà tóm gọn nó''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000157
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: giữ câu nhận xét của Zettour gọi Rudersdorf là ''ông''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000158
  kind: terminology_and_voice
  value: 'choices=["Đại từ, điều kiện & mệnh lệnh: Rudersdorf dùng ''cả hai chúng
    ta'' / ''chúng ta''; giữ thứ tự ưu tiên ''trước hết... siết chặt lại chiến tuyến'',
    điều kiện ''Nếu có thể, chúng ta sẽ phản công'' và câu chốt giao việc ''Hãy thu
    xếp đi.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000159
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ nguyên định dạng viết hoa thời gian, mặt trận
    và tên đơn vị ''NGÀY 1 THÁNG 5 NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, SỞ CHỈ
    HUY KAMPFGRUPPE SALAMANDER''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000160
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ: giữ đại từ nội tâm tự quy chiếu của Tanya
    là ''Mình'' theo DEC-P01-001; gọi Đại tá Calandro là ''vị đại tá'' / ''ông'';
    giữ suy luận khen ngợi việc chuẩn bị trang bị chống rét."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000161
  kind: terminology_and_voice
  value: 'choices=["Dấu hai chấm & liệt kê: giữ danh xưng tự giễu ''sinh vật xã hội
    Tanya'' và cấu trúc dấu hai chấm liệt kê ba chuẩn mực giao tiếp."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000162
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn & đại từ trần thuật: trần thuật gọi Tanya là ''nó''
    theo DEC-P01-001, gọi Calandro là ''Vị đại tá'' / ''Ông''; giữ tình thái suy đoán
    ''hẳn cũng có cùng lập trường'' và chi tiết ''nụ cười đầy vẻ giả lả''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000163
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Calandro xưng ''tôi'', gọi Tanya là ''cô'';
    giữ nguyên từ tiếng Đức ''Fräulein'' đối lập với quân hàm ''Trung tá'' và dấu
    chấm lửng cuối câu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000164
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Tanya xưng ''Tôi'' / ''tôi'', gọi Calandro
    là ''thưa Đại tá'' / ''ngài''; giữ nguyên từ ''Frau'' đặt cạnh ''Trung tá''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000165
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, tên riêng & chức danh: Calandro xưng ''Tôi''; giữ chi
    tiết vẻ mặt thoáng đanh lại cùng lời tự giới thiệu ''Đại tá Virginio Calandro''
    thuộc ''Lục quân Hoàng gia Ildoa'' với tư cách ''quan sát viên quân sự''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000166
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, đối lập danh nghĩa – thực tế & thuật ngữ: Tanya xưng
    ''Tôi'' / ''tôi'', gọi Calandro là ''ngài''; giữ sự đối lập rõ ràng giữa chức
    vụ ''Trên danh nghĩa'' (phó chỉ huy Kampfgruppe Lergen) và ''trên thực tế'' (chỉ
    huy của Kampfgruppe Salamander)."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000167
  kind: terminology_and_voice
  value: 'choices=[''Điểm nhìn & nghĩa: giữ nhận định mở đầu về hai tiêu chí phân
    loại người (kinh nghiệm và quân hàm) và thiện cảm cá nhân của Tanya dành cho Đại
    tá Calandro.'']'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000168
  kind: terminology_and_voice
  value: 'choices=["Đại từ nội tâm, câu hỏi & phủ định: dùng đại từ tự quy chiếu ''mình''
    theo DEC-P01-001 trong câu hỏi nội tâm; giữ cấu trúc phủ định kép ''hẳn đều không
    thể quá bất tài được''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000169
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & thuật ngữ: Calandro xưng ''Tôi'' / ''tôi'', gọi Tanya
    là ''cô'', gọi Lergen là ''Đại tá von Lergen'' / ''Ông ấy''; giữ đúng các danh
    hiệu ''Bạch Ngân'', ''Huy hiệu Xung kích Cánh Bạc'' và ''Pháp sư Định danh''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000170
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & giọng thoại: Tanya xưng ''Tôi'', giữ giọng đáp lịch
    sự pha chút hài hước nhà binh về lợi thế diện tích bề mặt nhỏ."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000171
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & tình thái: Calandro xưng ''tôi''; giữ tình thái bông
    đùa ''Có lẽ tôi sẽ phải vừa khom lưng vừa đi qua chiến trường mất.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000172
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & câu hỏi: Tanya gọi Calandro là ''ngài'', giữ lời rào
    đón lịch sự và câu hỏi về kinh nghiệm thực chiến."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000173
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, quân hàm & thuật ngữ: Calandro xưng ''Tôi'' / ''tôi'',
    gọi Tanya là ''thưa Trung tá''; ''Alpine Regiment'' -> ''Trung đoàn Sơn cước'';
    ''covert ops'' -> ''chiến dịch ngầm''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000174
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown, điểm nhìn & đại từ: bọc chính xác thán từ
    nội tâm ''*Phù*'' trong dấu sao theo DEC-P01-002; giữ đại từ ''Ông'' chỉ Calandro
    và cảm giác nhẹ nhõm của Tanya."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000175
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật, so sánh & phủ định: trần thuật gọi Tanya là
    ''nó'' theo DEC-P01-001; giữ phép so sánh hơn, mệnh đề phủ định ''chẳng có lúc
    nào để mà lơ là cảnh giác'' và ý nhượng bộ cuối câu."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000176
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: Tanya xưng ''tôi'', gọi Calandro là ''ngài'';
    giữ giọng xã giao khéo léo của Tanya."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000177
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & sắc thái: Calandro xưng ''tôi'', giữ giọng tự giễu về
    việc bị quẳng ra tận mặt trận phía đông."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000178
  kind: terminology_and_voice
  value: 'choices=["Điểm nhìn, đại từ & xưng hô: phân biệt rõ đại từ trần thuật ''nó''
    chỉ Tanya (theo DEC-P01-001) với đại từ ''tôi'' / ''ngài'' trong lời thoại chào
    mừng Calandro."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000179
  kind: terminology_and_voice
  value: 'choices=["Xưng hô & điều kiện: Calandro xưng ''tôi'', gọi Tanya là ''cô'';
    giữ câu điều kiện ''Nếu cô cứ cho tôi thấy mọi thứ đúng như thực tế thì sẽ hoàn
    hảo nhất.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000180
  kind: terminology_and_voice
  value: 'choices=["Xưng hô, phủ định giảm nhẹ & nhượng bộ: Tanya xưng ''Tôi'' / ''tôi'';
    giữ ý tự khiêm ''khó lòng đáp ứng nổi những yêu cầu tối thiểu nhất'' và mệnh đề
    nhượng bộ ''dù chẳng được là bao''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000181
  kind: terminology_and_voice
  value: 'choices=["Xưng hô: Calandro xưng ''Tôi'', giữ câu đáp lịch thiệp ngắn gọn."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000182
  kind: terminology_and_voice
  value: 'choices=["Tiêu đề cảnh: giữ nguyên định dạng viết hoa ''NGÀY 2 THÁNG 5 NĂM
    THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, DOANH TRẠI LỤC QUÂN ĐẾ QUỐC''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000183
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & xưng hô: Serebryakov gọi Tanya là ''Thưa Trung tá von
    Degurechaff'', dùng ''chúng ta'' khi báo cáo chạm trán quân địch."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000184
  kind: terminology_and_voice
  value: 'choices=["Quân hàm & so sánh: ''First Lieutenant Serebryakov'' -> ''Trung
    úy Serebryakov''; giữ phép so sánh phản xạ có điều kiện ''Hệt như con chó của
    Pavlov vậy.''"]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000185
  kind: terminology_and_voice
  value: 'choices=["Nhấn mạnh Markdown & đại từ trần thuật: bọc chính xác cụm ''*quân
    địch*'' trong dấu sao theo DEC-P01-002 (đồng bộ với lời báo cáo ở p000183); trần
    thuật gọi Tanya là ''nó'' theo DEC-P01-001."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000186
  kind: terminology_and_voice
  value: 'choices=["Đại từ trần thuật & thoại: trần thuật gọi Tanya là ''Nó'' theo
    DEC-P01-001; trong thoại Tanya xưng ''Tôi''."]'
