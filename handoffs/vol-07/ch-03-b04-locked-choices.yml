    là lựa chọn tốt hơn đấy''."]'
- segment_id: YS-LN07/Text/chapter010.xhtml/p000111
  kind: terminology_and_voice
  value: 'choices=["Thuật ngữ, điều kiện & tình thái: ''Operations man'' -> ''người
