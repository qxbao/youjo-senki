# Danh sách đề xuất; chưa chốt bản dịch cho các mục pending.
# Mục chỉ ghi ngữ cảnh cần phân biệt dùng id, source_term, status: pending,
# context và references (segment_id); chưa điền phương án tiếng Việt.
# Khi ghi phương án tiếng Việt, mỗi mục cần có:
#   id: mã đề xuất ổn định
#   proposed_vi: phương án tiếng Việt (chỉ là đề xuất)
#   category: loại vấn đề, chẳng hạn thuật ngữ / xưng hô / quân hàm
#   status: pending, proposed hoặc needs_context; không dùng approved tại đây
#   rationale: lý do bằng tiếng Việt
#   references: danh sách segment_id và locator nguồn cục bộ
#   alternatives_vi: danh sách phương án tiếng Việt khác, có thể để trống
# source_term chỉ nhận diện thuật ngữ cần xét; không chép câu hoặc trích đoạn
# nguồn tiếng Anh. Tra nguồn tại chỗ qua references.
# Chỉ chuyển lựa chọn vào canon chính thức sau khi có quyết định được duyệt
# trong canon/decisions.md, giữ dấu vết mã đề xuất.
terms:
  - id: P03-paradigm-shift
    source_term: paradigm shift
    proposed_vi: chuyển đổi mô thức
    category: thuật ngữ
    status: pending
    rationale: >-
      Phương án tạm để chỉ sự thay đổi căn bản trong cách nhìn hoặc mô hình;
      cần xét cách dùng tự nhiên và nhất quán trong ngữ cảnh.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000043
        volume: vol-01
        chapter: 0
    alternatives_vi:
      - thay đổi hệ hình
  - id: P03-Chicago-school
    source_term: Chicago school
    proposed_vi: trường phái Chicago
    category: thuật ngữ
    status: pending
    rationale: >-
      Tạm giữ tên gọi chung vì lĩnh vực của trường phái chưa được xác định;
      cần đối chiếu chú thích ¹ trước khi cân nhắc bổ nghĩa lĩnh vực.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000046
        volume: vol-01
        chapter: 0
    alternatives_vi:
      - trường phái kinh tế Chicago
  - id: P03-rationality
    source_term: rationality
    proposed_vi: tính hợp lý
    category: thuật ngữ
    status: pending
    rationale: >-
      Phương án tạm tránh sắc thái thuật ngữ triết học quá hẹp; cần đối chiếu
      ngữ cảnh chuyên môn trước khi chọn cách dịch ổn định.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000046
        volume: vol-01
        chapter: 0
    alternatives_vi:
      - tính duy lý
  - id: P03-moratorium
    source_term: moratorium
    proposed_vi: quãng tạm hoãn
    category: thuật ngữ
    status: pending
    rationale: >-
      Cách diễn đạt tạm cho giai đoạn trì hoãn trước khi bước vào đời;
      cần xác minh nghĩa chuyên ngành tâm lý-xã hội trong ngữ cảnh.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000047
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P03-human-capital
    source_term: human capital
    proposed_vi: vốn con người
    category: thuật ngữ
    status: pending
    rationale: >-
      Phương án tạm cho thuật ngữ kinh tế-xã hội; cần thống nhất cách dùng
      nếu khái niệm này xuất hiện ở các đoạn khác.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000047
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P03-signaling-theory
    source_term: signaling theory
    proposed_vi: lý thuyết tín hiệu
    category: thuật ngữ
    status: pending
    rationale: >-
      Phương án tạm cho thuật ngữ được dùng trong lập luận về tín hiệu xã hội;
      cần kiểm tra tính nhất quán chuyên ngành.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000047
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P03-touchstone-award
    source_term: Touchstone award
    proposed_vi: giải Touchstone
    category: thuật ngữ
    status: pending
    rationale: >-
      Tạm giữ Touchstone như tên riêng, vì chưa rõ đây là tên giải hay cách
      gọi mô tả; không tự diễn giải nghĩa.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000055
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P03-section-manager
    source_term: section manager
    proposed_vi: trưởng phòng
    category: chức danh
    status: pending
    rationale: >-
      Chức danh được dịch tạm theo cấp quản lý bộ phận trong đoạn; cần đối
      chiếu hệ thống chức danh nếu xuất hiện thêm ngữ cảnh.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000055
        volume: vol-01
        chapter: 0
    alternatives_vi:
      - quản lý bộ phận
  - id: P01-sensibility
    source_term: sensibility
    status: pending
    context: >-
      Cần phân biệt khả năng cảm nhận với cách cư xử theo chuẩn xã hội,
      đồng thời phân biệt với lý trí và tính cách trong cùng lập luận.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
  - id: P01-personality
    source_term: personality
    status: pending
    context: >-
      Cần phân biệt đặc điểm tính cách với đánh giá đạo đức; xác minh
      cách gọi chuyên môn theo ngữ cảnh, không đồng nhất với phẩm chất đạo đức.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
      - YS-LN01/Text/chapter001.xhtml/p000030
  - id: P01-individual-disposition
    source_term: individual disposition
    status: pending
    context: >-
      Cần phân biệt khuynh hướng riêng của cá nhân với tính cách và phẩm chất
      đạo đức trong lập luận về khả thể quá khứ không phụ thuộc các yếu tố này.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
      - YS-LN01/Text/chapter001.xhtml/p000030
  - id: P01-moral-character
    source_term: moral character
    status: pending
    context: >-
      Cần phân biệt bình diện phẩm chất đạo đức với tính cách và khuynh hướng
      cá nhân; không đưa bình diện đạo đức vào nhận định đúng/sai về điều học được.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
      - YS-LN01/Text/chapter001.xhtml/p000030
      - YS-LN01/Text/chapter001.xhtml/p000031
  - id: P01-deindividuation
    source_term: deindividuation
    status: pending
    context: >-
      Cần xác minh phạm vi khái niệm trong chuỗi phân vai, thay đổi trạng thái
      cá nhân và phục tùng; phân biệt với cách hiểu mất toàn bộ tính cách
      hoặc bản sắc cá nhân trước khi chọn thuật ngữ hay cách diễn giải.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
  - id: P01-authority
    source_term: authority
    status: pending
    context: >-
      Cần phân biệt với quyền lực nói chung, xét vị thế của người chi phối
      và quan hệ với hiện tượng phục tùng; không đổi từ tùy tiện để tránh lặp.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
  - id: P01-obedience-to-authority
    source_term: obedience to authority
    status: pending
    context: >-
      Cần nhận diện đây là tên hiện tượng trong lập luận; phân biệt mô tả
      sự phục tùng với sắc thái bị ép khuất phục hoặc phán xét đạo đức,
      đồng thời giữ liên hệ với việc phân vai và nguyên nhân được nêu.
    references:
      - YS-LN01/Text/chapter001.xhtml/p000029
  - id: P04-cost-performance
    source_term: cost performance
    proposed_vi: hiệu quả chi phí
    category: thuật ngữ
    status: pending
    rationale: >-
      Thuật ngữ đánh giá hiệu quả nhân viên trong tương quan với chi phí; tạm chọn
      cách nói tự nhiên, cần xét nhất quán ở các lần xuất hiện.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000060
        volume: vol-01
        chapter: 0
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000069
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P04-occupational-physician
    source_term: occupational physician
    proposed_vi: bác sĩ y tế lao động
    category: thuật ngữ
    status: pending
    rationale: >-
      Chức danh chuyên môn trong bối cảnh công ty; cần xác minh thuật ngữ Việt
      phù hợp với vai trò cụ thể.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000060
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P04-cash-advance-loan
    source_term: cash advance loan
    proposed_vi: khoản vay ứng lương
    category: thuật ngữ
    status: pending
    rationale: >-
      Tạm diễn đạt khoản vay nhận trước tiền lương; cần phân biệt với ứng lương
      thông thường nếu văn cảnh sau làm rõ.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000060
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P04-pip
    source_term: PIP
    proposed_vi: PIP
    category: thuật ngữ
    status: pending
    rationale: >-
      Nguồn chỉ dùng chữ viết tắt, chưa khai triển tên chương trình; giữ nguyên
      để tránh tự mở rộng hoặc đoán sai.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000062
        volume: vol-01
        chapter: 0
    alternatives_vi: []
  - id: P04-pink-slip
    source_term: pink slip
    proposed_vi: giấy thôi việc
    category: thuật ngữ
    status: pending
    rationale: >-
      Cách nói tạm chỉ thông báo chấm dứt việc làm; cần cân nhắc sắc thái khẩu ngữ
      trong ngữ cảnh.
    references:
      - segment_id: YS-LN01/Text/chapter001.xhtml/p000073
        volume: vol-01
        chapter: 0
    alternatives_vi: []
