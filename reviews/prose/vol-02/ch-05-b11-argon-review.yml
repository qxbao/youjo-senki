findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000263
    category: pronoun_and_pov_consistency
    issue: >-
      Trong các đoạn trần thuật ngôi thứ ba (`p000263`, `p000270`, `p000271`, `p000272`, `p000280`), bản dịch quy chiếu Tanya bằng `cô`, trong độc thoại nội tâm ngôi thứ nhất (`p000254`, `p000256`–`p000259`, `p000266`, `p000272`, `p000273`, `p000276`, `p000277`, `p000280`–`p000283`) dùng `tôi` / `chúng tôi`, và khi cấp dưới xưng hô với Thiếu tá Tanya (`p000265`, `p000267`) dùng `ngài`. Hệ thống này nhất quán nội bộ với `ch-05-b10`, nhưng khác với quy ước `nó` (trần thuật ngôi 3) / `mình` (nội tâm ngôi 1) ở các batch đầu chương và khác nhẹ với `bà` / `thưa bà` trong `ch-05-b10` (`p000242`, `p000244`).
    basis: >-
      `canon/decisions.md` (`DEC-P01-001`) quy định không tự động mở rộng `nó`/`mình` sang giai đoạn khác khi chưa chốt; trong `b11`, sự chuyển đổi giữa `Tanya`/`cô` (ngôi 3) và `tôi`/`chúng tôi` (ngôi 1) bám sát sự chuyển ngôi của nguyên văn (đặc biệt tại `p000262`, `p000270`, `p000272`, `p000276`, `p000280`) mà không gây nhầm chủ thể.
    recommendation: >-
      Không chặn signoff; giữ nguyên theo quy ước đã khóa của cặp `b10`–`b11`, hoặc đồng bộ đại từ xưng hô của cấp dưới với Tanya (`Thiếu tá` / `ngài` / `cô`) ở bước polish toàn chương.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000267
    category: dialogue_addressee_nuance
    issue: >-
      Ở câu bỏ lửng cuối đoạn (`Thật không ngờ ngài lại…`), bản dịch chọn `ngài` (quy chiếu Thiếu tá Tanya) ngay sau câu đầu gọi Tanya ở ngôi thứ ba (`buổi huấn luyện của Thiếu tá có vẻ khá khắc nghiệt`). Đặt trong mạch đối thoại sau lời cảm ơn của Serebryakov ở `p000265`, đại từ ngôi thứ hai ở câu bỏ lửng cũng có thể hướng về Serebryakov (`cô` — ngạc nhiên vì Serebryakov chịu đựng nổi kỳ huấn luyện khắc nghiệt đó).
    basis: >-
      Do câu thoại của Weiss bị ngắt lửng và liền sau đó Tanya chất vấn trực tiếp ở `p000268`, cả hai cách hiểu đều không làm thay đổi diễn biến hay quan hệ nhân vật trong cảnh.
    recommendation: >-
      Có thể giữ nguyên hoặc cân nhắc chỉnh thành `Thật không ngờ cô lại…` (hoặc lược đại từ thành `Không thể tin nổi là…`) ở bước polish.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000270
    category: lexical_repetition_and_nuance
    issue: >-
      Câu 2 (`Dù sao, cô cũng phải chuẩn bị tinh thần chấp hành.`) và câu 3 (`Tanya miễn cưỡng chuẩn bị tinh thần.`) lặp cụm `chuẩn bị tinh thần`, đồng thời làm dịu sắc thái nguyên tắc quân kỷ (`mệnh lệnh là mệnh lệnh`) của câu 2 sau khi chỉnh để tránh mâu thuẫn với `p000275`.
    basis: >-
      Cách diễn đạt hiện tại đã giải quyết triệt để nguy cơ hiểu nhầm rằng lệnh chính thức đã được ban ở `p000270` (theo `p01_resolution` trong `handoffs/vol-02/ch-05-b11.yml`) và giữ đúng mạch tâm lý miễn cưỡng của Tanya.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giảm lặp từ bằng cách dịch câu 2 là `Dù sao thì có lệnh là phải chấp hành.` hoặc `Suy cho cùng, đã là mệnh lệnh thì phải chấp hành.`
    resolution: optional_polish

