    pronouns_and_address: "Lời đáp ngắn gọn của Weiss, lược đại từ."
    pov_and_voice: "Giọng cấp dưới vội vàng rút lui và xin lỗi."
    modality_and_logic: "Giữ đúng phản ứng chối ngay và xin lỗi của Weiss."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000270
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật hạn tri dùng `Tanya` / `cô`, phản thân `mình`, quy chiếu thuộc cấp là `họ`."
    pov_and_voice: "Giọng trần thuật hạn tri thể hiện sự cam chịu miễn cưỡng của Tanya."
    modality_and_logic: "Bảo toàn nhận định rằng đám thuộc cấp sẽ lo liệu chuyện tân binh và thái độ miễn cưỡng chuẩn bị tinh thần chấp hành nhiệm vụ của Tanya."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000271
    terms: []
    pronouns_and_address: "Trần thuật hạn tri ngôi thứ ba dùng `cô`."
    pov_and_voice: "Giọng phân tích tỉnh táo, bi quan thực tế."
    modality_and_logic: "Giữ đúng quan hệ nguyên nhân: Tanya không thể nghĩ tích cực vì cô hiểu rõ thực tế tàn khốc của chiến trường."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000272
    terms:
      - "pháo kích áp chế"
      - "chiến hào"
      - "đội ngũ quân y"
      - "hậu phương"
      - "tiền tuyến"
    pronouns_and_address: "Chuyển ngôi từ `cô` (trần thuật hạn tri ở câu 2–3) sang `Tôi` (độc thoại nội tâm trực tiếp ở câu kết), khớp với sự chuyển ngôi của nguyên văn; dùng `người ta` cho đại từ ngôi thứ hai phiếm chỉ ở câu 1."
    pov_and_voice: "Giọng lo âu thực tế của người chỉ huy tiền tuyến."
    modality_and_logic: "Bảo toàn phép đối lập giữa tình huống lính mới phát điên ở căn cứ (có thể đẩy cho quân y hậu phương) với tình huống hoảng loạn ngay tại tiền tuyến (không có thời gian xử lý)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000273
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `tôi`."
    pov_and_voice: "Giọng thực dụng lạnh lùng pha hài đen đặc trưng của Tanya."
    modality_and_logic: "Bảo toàn chuỗi giả định dây chuyền (hoảng loạn và nôn mửa lây lan làm mất kiểm soát đơn vị), giải pháp cực đoan trong tình huống tệ nhất là dùng xẻng bắt im lặng, và giữ nguyên ký hiệu chú thích `18`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000274
    terms:
      - "chiến hào"
    pronouns_and_address: "Độc thoại nội tâm khái quát hóa của Tanya, quy chiếu tân binh là `họ` và chiếc xẻng là `nó`."
    pov_and_voice: "Giọng hài đen châm biếm về công dụng của chiếc xẻng quân dụng."
    modality_and_logic: "Bảo toàn đầy đủ ba công dụng của xẻng trong việc dạy dỗ lính mới (chôn chất thải, bắt im miệng, và nếu cần thì chôn luôn cả họ) tương ứng với ba địa điểm (chiến hào, căn cứ, nghĩa địa)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000275
    terms:
      - "Bộ chỉ huy"
    pronouns_and_address: "Trong lời thoại, Tanya gọi các sĩ quan dưới quyền là `Các anh`, xưng `chúng ta`; phần độc thoại xen giữa ẩn chủ ngữ."
    pov_and_voice: "Đan xen giữa lời hiệu triệu dứt khoát của chỉ huy và suy tính thủ tục hành chính thận trọng."
    modality_and_logic: "Bảo toàn sự phân biệt then chốt: mệnh lệnh là mệnh lệnh nhưng lệnh này thực tế chưa được ban xuống chính thức, nên bước đầu tiên là phải liên hệ Bộ chỉ huy để xác nhận."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000276
    terms:
      - "Tanya"
    pronouns_and_address: "Độc thoại nội tâm dùng `tôi` / `mình` và `chúng ta`, xen câu trần thuật ngôi thứ ba `Tanya tự trấn tĩnh` theo đúng nguyên văn."
    pov_and_voice: "Giọng toan tính giới hạn trách nhiệm để bảo toàn sức lực."
    modality_and_logic: "Giữ đúng mạch suy nghĩ: hỏi xác nhận tin đồn, nếu đúng là phải kèm lính mới thì phải làm sao cho khỏi kiệt sức chứ không thể cầm tay chỉ việc từng bước."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000277
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `tôi` / `mình`."
    pov_and_voice: "Giọng suy luận kiểu quản trị nhân sự của Tanya."
    modality_and_logic: "Bảo toàn hai mặt của lập luận: hiểu rằng lãng phí nhân lực quý giá là điều dại dột cần tránh, nhưng chỉ muốn thực hiện trong giới hạn không tạo gánh nặng quá lớn cho bản thân."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000278
    terms:
      - "Thiếu tá von Degurechaff"
      - "pháp sư"
    pronouns_and_address: "Tanya tự giới thiệu qua điện thoại `Tôi là Thiếu tá von Degurechaff`."
    pov_and_voice: "Giọng liên lạc quân vụ chuẩn mực, đi thẳng vào vấn đề."
    modality_and_logic: "Giữ đúng câu mở lời hỏi Bộ chỉ huy về các pháp sư mới."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000279
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng `Tanya`."
    pov_and_voice: "Giọng trần thuật ngắn gọn, dứt khoát."
    modality_and_logic: "Bảo toàn hành động Tanya nêu một phỏng đoán đơn giản để dò hỏi và lập tức nhận được xác nhận từ đầu dây bên kia."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000280
    terms:
      - "giúp đám lính mới làm quen với công việc"
      - "Tanya"
    pronouns_and_address: "Câu 1 dùng `chúng tôi`; câu 2 dùng `Tanya` và `đơn vị của cô`, khớp với sự chuyển ngôi trong nguyên văn."
    pov_and_voice: "Giọng tóm lược kết quả cuộc gọi của Tanya."
    modality_and_logic: "Giữ đúng hai mức độ thông tin: nhiệm vụ chung là giúp lính mới quen việc, và qua cuộc điện thoại Tanya khá chắc chắn rằng đơn vị mình sẽ trực tiếp huấn luyện họ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000281
    terms:
      - "tuyến hỏa lực"
      - "tiểu đoàn"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `Tôi`, quy chiếu tân binh là `họ`."
    pov_and_voice: "Giọng chỉ huy lên phương án thực tế và tự trấn an."
    modality_and_logic: "Bảo toàn quyết định đầu tiên (cho tân binh quan sát tuyến hỏa lực càng sớm càng tốt) và niềm an ủi rằng nhờ nhiệm vụ này mà tiểu đoàn có lẽ sẽ không bị ném vào nơi thực sự nguy hiểm."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000282
    terms:
      - "Tiền tuyến"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `tôi`, quy chiếu tân binh là `họ`."
    pov_and_voice: "Giọng thực chiến lạnh lùng của Tanya và sự đồng lòng của binh lính dưới quyền."
    modality_and_logic: "Giữ đúng nhận định rằng tiền tuyến sẽ dạy họ thực tế tốt hơn cả triệu lời giải thích và binh lính trong đơn vị cũng đồng tình."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000283
    terms: []
    pronouns_and_address: "Độc thoại nội tâm hồi cố của Tanya dùng `tôi`."
    pov_and_voice: "Giọng tự giễu pha chút hối tiếc muộn màng ở câu kết đoạn."
    modality_and_logic: "Bảo toàn chính xác sắc thái giả định trái thực tế trong quá khứ (`Lẽ ra tôi phải nghĩ... mới đúng`)."
    emphasis: "Bảo toàn chính xác 1 cụm `*...*` tương ứng `<html:em>` (`*Được rồi, cần lên kế hoạch huấn luyện*`)."
