  proposed_vi: "Tanya, pa-tê cá theo mùa, súp khoai tây, khẩu phần chiến trường, cá thịt trắng / cá thịt trắng xào áp chảo, người phục vụ, đầu bếp (part0022/p000041–p000043, p000046, p000048, p000062) / hội quân nhân dự bị, các quân nhân dự bị, Koskenkorva,¹⁰ (Koskenkorva¹⁰), Trung ương, thị trấn nghỉ dưỡng (part0022/p000044, p000045, p000049) / Giáng sinh, bổn phận, Churchill, các tàu chiến chủ lực, cà phê đen (part0022/p000051–p000053) / Thiếu tướng von Rudersdorf / tướng von Rudersdorf, Bộ Tổng Tham mưu Quân đội Đế quốc, Thiếu tá Tanya von Degurechaff / Thiếu tá von Degurechaff / Cô von Degurechaff, Liên minh Entente, tiền tuyến xa nhất, tiền tuyến, Điện văn, đồn trú gần nhất, mệnh lệnh điều động, liên lạc vô tuyến, huấn luyện (part0022/p000049, p000054, p000056, p000058–p000061)"
  alternatives_vi:
  - hội cựu quân nhân / hội binh sĩ dự bị (thay cho `hội quân nhân dự bị` tại part0022/p000044 — bắt buộc giữ `hội quân nhân dự bị` theo mục `vol02-ch04-b03-reservists-association` trong `work/run-state/pending-terms.yml` và bản sửa M2 đã nghiệm thu trong `handoffs/vol-02/ch-04-b03.yml`, tuyệt đối không thêm `cựu`) / rượu Koskenkorva (thay cho tên riêng `Koskenkorva` tại part0022/p000045 — giữ nguyên `Koskenkorva` kèm số chú thích `¹⁰` theo mục `vol02-ch04-b03-koskenkorva`; ở bước chuốt văn có thể lược dấu phẩy thừa đứng ngay trước số mũ chú thích để thành `Koskenkorva¹⁰,`) / cá trắng (thay cho `cá thịt trắng` tại part0022/p000043, p000048 — giữ `cá thịt trắng` / `cá thịt trắng xào áp chảo` tự nhiên, trung tính, không tự suy đoán loài cá cụ thể) / Central (thay cho `Trung ương` tại part0022/p000049 — giữ `Trung ương` theo bản sửa M3 đã nghiệm thu và đồng bộ với mục `vol02-ch04-b22-central`) / thiết giáp hạm / tàu chủ lực (thay cho `các tàu chiến chủ lực` tại part0022/p000052 — bắt buộc giữ `các tàu chiến chủ lực` theo bản sửa M4 đã nghiệm thu và mục `vol02-ch04-b05-capital-ships` để không thu hẹp khái niệm thành một lớp tàu đơn lẻ) / Bộ Tổng tham mưu / Văn phòng Bộ Tổng tham mưu (thay cho `Bộ Tổng Tham mưu Quân đội Đế quốc` tại part0022/p000054, p000058 — giữ nhất quán `Bộ Tổng Tham mưu Quân đội Đế quốc` trong toàn bộ lô b03 đã nghiệm thu)
