  proposed_vi: "Trong 3 đoạn kết cuộc chia tay giữa hai người đàn ông (part0022/p000038–p000040) và phân cảnh bữa trưa của Tanya bị cắt ngang bởi cuộc gọi điều động từ Thiếu tướng von Rudersdorf (part0022/p000041–p000062): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1, M5, M6 đã được nghiệm thu trong `handoffs/vol-02/ch-04-b03.yml`: (1) Ở đoạn đối thoại và trần thuật khép lại cuộc gặp giữa hai người đàn ông (p000038–p000040): giữ cách xưng hô trung tính – trang trọng đã sửa theo M1 (`Ngài` – `tôi` / `mình` ở p000038 và `Chúng tôi` – `ngài` ở p000039), tuyệt đối không dùng đại từ mang giới tính nữ, khớp hoàn toàn với câu trần thuật `Một người cúi chào, người kia mỉm cười đáp lại cử chỉ ấy. Họ không cần nói thêm gì nữa.` ở p000040. (2) Trong độc thoại nội tâm trực tiếp ngôi thứ nhất của Tanya (p000045 câu hai, p000046 câu ba, p000050, p000051, p000053, p000057): giữ nhất quán đại từ tự quy chiếu `mình` / `Mình` xuyên suốt theo `DEC-P01-001` và bản sửa M6 đã nghiệm thu. (3) Trong câu trần thuật ngôi thứ ba theo điểm nhìn của Tanya (p000041–p000044, p000046–p000049, p000052, p000056, p000061, p000062): quy chiếu Tanya bằng tên riêng `Tanya` (p000041, p000046) và đại từ `cô` / `Cô` kết hợp phản thân `mình` (p000044, p000048); quy chiếu các thành viên hội quân nhân dự bị và nhân vật địa phương bằng `họ` (p000044–p000047); quy chiếu người phục vụ bằng `Người phục vụ` / `người phục vụ` và `Anh ta` (p000043, p000048, p000049, p000062); quy chiếu Thiếu tướng von Rudersdorf bằng `tướng von Rudersdorf` và đại từ `ông` (p000056, p000061). (4) Trong đối thoại trực tiếp và qua điện thoại (p000049, p000054, p000055, p000058, p000059): người phục vụ gọi Tanya là `“Cô von Degurechaff?”` (p000049); qua điện thoại, Rudersdorf tự giới thiệu `“Tôi là Thiếu tướng von Rudersdorf thuộc Bộ Tổng Tham mưu Quân đội Đế quốc. Thiếu tá Tanya von Degurechaff phải không?”` (p000054) và truyền đạt mệnh lệnh gọi `Thiếu tá von Degurechaff` (p000058); Tanya đáp lễ chuẩn mực quân kỷ cấp dưới với cấp trên bằng `“Vâng, thưa ngài, tôi đây.”` (p000055) và `“Rõ, thưa ngài. Chúng tôi sẽ lập tức đến đồn trú gần nhất, và tôi sẽ báo cáo ngay khi mọi người đã tập hợp đủ.”` (p000059, phân biệt rõ `Chúng tôi` chỉ toàn đơn vị với `tôi` chỉ cá nhân Tanya báo cáo)"
  alternatives_vi:
  - cậu (thay cho `ngài` ở câu đáp part0022/p000039 khi đối chiếu liên thông với mạch đối thoại giữa Nghị viên Cazor và Đại tá Sue ở cuối `ch-04-b02` — giữ nguyên phương án trung tính `ngài` ở cả p000038 và p000039 theo bản sửa M1 đã nghiệm thu trong `handoffs/vol-02/ch-04-b03.yml` vì trong phạm vi gói nguồn b03 độc lập không nêu tên hai người đàn ông) / nó / lặp tên riêng Tanya (thay cho `cô` / `Cô` trong câu trần thuật ngôi thứ ba nói về Tanya — giữ nguyên `cô` / `Cô` trong bản dịch b03 đã được nghiệm thu tại `reviews/prose/vol-02/ch-04-b03-fixes-signoff-claude.md`, đồng thời ghi nhận quy ước `DEC-P01-001` cho đối chiếu toàn tập)
