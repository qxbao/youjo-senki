- id: F01
  severity: moderate
  category: pronoun_viewpoint_consistency
  segment_ids:
  - YS-LN02/Text/part0018.xhtml/p000142
  - YS-LN02/Text/part0018.xhtml/p000144
  - YS-LN02/Text/part0018.xhtml/p000147
  - YS-LN02/Text/part0018.xhtml/p000152
  issue: >
    Đoạn p000142–p000155 là mạch trần thuật ngôi thứ ba đan xen độc thoại nội tâm từ điểm nhìn
    của Tanya tại phòng họp chỉ huy trên kỳ hạm, nối trực tiếp từ cuối ch-03-b12 (p000134–p000140)
    sang đầu ch-03-b14 (p000162–p000163). Tuy nhiên bản dịch hiện tại chưa đồng bộ theo DEC-P01-001
    (canon/decisions.md) và các mục đã khóa ở b11/b12/b14 (vol02-ch03-b11-tanya-third-person-reference,
    vol02-ch03-b11-tanya-interior-pronoun): (1) Tại p000142, câu trần thuật ngôi thứ ba bám điểm nhìn
    Tanya đang dùng "cô" hai lần ("cảm xúc của cô", "Trong lòng, cô than vãn ầm ĩ") thay vì "nó"
    như ở p000134–p000138 (b12) và p000162–p000163 (b14); đồng thời trật tự bổ ngữ ở câu đầu
    ("Tanya lắng nghe chỉ huy báo cáo tình hình cho mọi người, vẻ mặt nghiêm nghị, chẳng hay biết gì
    về cảm xúc của cô về chuyện này") đặt cụm "vẻ mặt nghiêm nghị, chẳng hay biết gì về cảm xúc của
    cô" lửng lơ khiến người đọc dễ gắn nhầm chủ thể giữa Tanya và vị tư lệnh đang phổ biến tình hình
    mà không hề biết nỗi lòng của Tanya. (2) Tại p000147 ("Một mặt, tôi nể nước đi này; mặt khác,
    tôi chỉ muốn than thở đôi chút...") và p000152 ("Đâu phải chỉ mình tôi nghĩ vậy—"), độc thoại
    nội tâm tự quy chiếu ngôi thứ nhất của Tanya lại dùng "tôi" thay vì "mình", làm nhòe ranh giới
    với lời phát biểu trực tiếp dùng "tôi" của tư lệnh hạm đội ở p000141 và lệch với quy chuẩn
    DEC-P01-001 (dành "mình" cho tự quy chiếu nội tâm của Tanya và "tôi" cho thoại). Tại p000144,
    mệnh đề kết câu đầu ("chợt hiểu ra") cũng có thể làm rõ điểm nhìn Tanya bằng "nó chợt hiểu ra"
    theo đúng cấu trúc nguồn.
  recommendation: >
    Chuẩn hóa hệ đại từ điểm nhìn Tanya theo DEC-P01-001 và tách rõ chủ thể bổ ngữ ở p000142:
    - p000142: Đổi "cô" sang "nó" ở cả hai câu, đồng thời cấu trúc lại câu đầu để phân định rõ
      người không biết cảm xúc của Tanya là vị chỉ huy đang thuyết trình và vẻ mặt nghiêm nghị
      của Tanya (kết hợp sửa thuật ngữ ở F02): "Tanya giữ vẻ mặt nghiêm nghị lắng nghe vị chỉ huy
      phổ biến tình hình cho mọi người mà chẳng hề hay biết cảm xúc của nó về chuyện này, nhưng
      những lời càu nhàu trong đầu đã chực trào ra. Trong lòng, nó than vãn ầm ĩ, lặp đi lặp lại
      rằng giá mà đội nhảy dù được bổ sung thêm vài người thì hay biết mấy."
    - p000144: Làm rõ đại từ điểm nhìn ở câu đầu (kết hợp F03, F04): "*…Hỗ trợ Cụm tập đoàn quân
      phương Bắc ư?* Tanya bắt đầu nghĩ, rồi nó chợt hiểu ra."
    - p000147: Đổi "tôi" sang "mình" trong nội tâm của Tanya (kết hợp F03): "Một mặt, mình nể nước
      đi này; mặt khác, mình chỉ muốn than thở đôi chút rằng một khi trực thuộc Trung ương thì
      người ta bị đem ra sử dụng như công cụ thế này đây."
    - p000152: Đổi "chỉ mình tôi" sang "chỉ riêng mình" (hoặc "chỉ mỗi mình"): "Đâu phải chỉ riêng
      mình nghĩ vậy—một người lính muốn tham gia trận đánh nắm phần thắng thì chẳng có gì lạ."
- id: F02
  severity: moderate
  category: terminology_consistency
  segment_ids:
  - YS-LN02/Text/part0018.xhtml/p000142
  - YS-LN02/Text/part0018.xhtml/p000154
  issue: >
    Tại p000142 và p000154, bản dịch dùng từ "đổ bộ" cho lực lượng và hoạt động tác chiến đường
    không của đơn vị pháp sư ("đội đổ bộ" ở p000142; "chiến dịch đổ bộ đường không" ở p000154).
    Cách dịch này vi phạm trực tiếp nguyên tắc phân biệt tác chiến đường không với đổ bộ đường biển
    đã khóa tại work/run-state/pending-terms.yml (mục vol02-ch03-b08-airborne-amphibious,
    vol02-ch03-b14-airborne-action) cũng như các bản sửa đã nghiệm thu ở ch-03-b12 (p000138 đổi
    "Đổ bộ" sang "Đáp xuống" để không trùng với "cuộc tấn công đổ bộ" ở p000135) và ch-03-b14
    (p000162, p000163, p000166 đổi toàn bộ sang "chiến dịch đột kích đường không" / "đơn vị đột
    kích đường không"). Ngay trong nội bộ b13, p000150 và p000151 đã dùng "chiến dịch đổ bộ" /
    "tiến hành đổ bộ" cho hoạt động đổ bộ đường biển của Hạm đội Bắc Hải; việc gọi đơn vị của
    Tanya là "đội đổ bộ" ở p000142 và "chiến dịch đổ bộ đường không" ở p000154 gây chồng lấn thuật
    ngữ giữa hai quân chủng và đứt mạch trực tiếp với câu mở đầu b14 (p000162).
  recommendation: >
    Đồng bộ với vol02-ch03-b08-airborne-amphibious, vol02-ch03-b14-airborne-action và ch-03-b14:
    - p000142: Đổi "đội đổ bộ" thành "đội nhảy dù" (hoặc "đội đột kích đường không").
    - p000154: Đổi "chiến dịch đổ bộ đường không" thành "chiến dịch đột kích đường không" ("Mà
      chúng ta còn phải thực hiện một chiến dịch đột kích đường không.") để khớp hoàn toàn với
      p000162–p000163 của ch-03-b14 ngay sau đó.
- id: F03
  severity: moderate
  category: terminology_consistency
  segment_ids:
  - YS-LN02/Text/part0018.xhtml/p000143
