  issue: >
    Nhiều định danh phe phái và đơn vị cốt lõi trong b13 đang lệch khỏi canon/glossary.yml và
    work/run-state/pending-terms.yml của Chương 3:
    (1) Phe địch ở mặt trận phương Bắc được dịch thành "Cơ chế Hiệp ước" tại p000149 (2 lần),
    p000150 và p000151, trong khi toàn bộ Quyển 1–2 và Chương 3 (b03, b05, b06, b09, b11 p000089,
    b20 mục vol02-ch03-b20-entente-alliance) đều khóa là "Liên minh Entente". Cụm "Cơ chế Hiệp ước"
    làm biến dạng danh xưng quốc gia/liên minh tham chiến thành một cơ chế pháp lý trừu tượng.
    (2) Định danh cơ quan trung ương tại p000144 và p000147 đang dịch là "Tập đoàn quân Trung tâm"
    (p000144) và "Trung tâm" (p000147), trái với các mục vol02-ch03-b05-central-army,
    vol02-ch03-b06-central-army-group, b03, b07 và b11 (p000111) đã khóa "Quân Trung ương" và
    "Trung ương" (không tự thêm cấp "Tập đoàn quân" và không đổi "Trung ương" thành "Trung tâm").
    (3) Định danh "Cụm Tập đoàn quân phương Bắc" tại p000143, p000144 (2 lần), p000146 viết hoa
    chữ "Tập", lệch quy tắc viết hoa "Cụm tập đoàn quân phương Bắc" đã khóa xuyên suốt Chương 3
    (vol02-ch03-b05-northern-army-group, vol02-ch03-b06-northern-army-group, b09, b10, b11) và
    chính p000144 cũng viết "Đại quân" (chữ "quân" viết thường) thay vì "Đại Quân" theo
    canon/glossary.yml.
    (4) Tên hạm đội tại p000148, p000149, p000151 đang dùng "Hạm đội Biển Bắc" và "Hạm đội Biển
    Khơi" (viết hoa chữ "Khơi"), trong khi ngay đoạn liền trước ở ch-03-b12 (p000134, mục
    vol02-ch03-b12-northern-sea-fleet) khóa "Hạm đội Bắc Hải" (còn b19 mục vol02-ch03-b19-fleet-names
    dùng "Hạm đội Biển Bắc" và "Hạm đội Biển khơi" viết thường chữ "khơi"). Việc chuyển đột ngột
    từ "Hạm đội Bắc Hải" ở p000134 sang "Hạm đội Biển Bắc" ở p000148 ngay trong cùng một cảnh họp
    gây bất nhất cục bộ.
  recommendation: >
    Chuẩn hóa đồng bộ các định danh theo canon/glossary.yml và pending ledger Chương 3:
    - Tại p000149 (2 chỗ), p000150, p000151: Đổi toàn bộ "Cơ chế Hiệp ước" thành "Liên minh Entente"
      ("chốt chặn Liên minh Entente", "chiến hạm của Liên minh Entente", "hạm đội Liên minh Entente",
      "các chiến hạm Liên minh Entente").
    - Tại p000144 và p000147: Đổi "Tập đoàn quân Trung tâm" (p000144) thành "Quân Trung ương", và
      đổi "Trung tâm" (p000147) thành "Trung ương".
    - Tại p000143, p000144, p000146: Chuẩn hóa viết hoa "Cụm tập đoàn quân phương Bắc" (chữ "tập"
      viết thường) và tại p000144 đổi "Đại quân" thành "Đại Quân" theo canon/glossary.yml; đồng
      thời ở câu 2 của p000146 khôi phục đầy đủ danh xưng "Cụm tập đoàn quân phương Bắc" thay vì
      rút gọn thành "trong cụm" ("cũng chẳng ai trong Cụm tập đoàn quân phương Bắc bị tổn hại").
    - Tại p000148, p000149, p000151: Chuẩn hóa "Hạm đội Biển Khơi" thành "Hạm đội Biển khơi" (viết
      thường chữ "khơi" theo quy tắc danh từ chung đi kèm và mục vol02-ch03-b19-fleet-names); với
      hạm đội địa phương tại p000148, p000149, p000151, khuyến nghị ưu tiên đổi sang "Hạm đội Bắc
      Hải" để nối mạch liền kề trực tiếp với p000134 của ch-03-b12 trong cùng phân cảnh họp trên
      kỳ hạm (hoặc nếu điều phối viên chọn giữ "Hạm đội Biển Bắc" theo b19 thì cần ghi chú đồng bộ
      ngược với p000134 ở bước hợp nhất).
- id: F04
  severity: minor
  category: formatting_and_fidelity
  segment_ids:
  - YS-LN02/Text/part0018.xhtml/p000141
  - YS-LN02/Text/part0018.xhtml/p000144
  - YS-LN02/Text/part0018.xhtml/p000155
  issue: >
    Ba chi tiết trình bày và sắc thái từ ngữ nhỏ cần chỉnh để khớp sát nguồn và DEC-P01-002:
    (1) Tại p000141, câu thoại mở màn của tư lệnh hạm đội bị thiếu cặp dấu ngoặc kép mở/đóng
    (“...”), trong khi nguồn có dấu ngoặc kép đầy đủ và tất cả các câu thoại khác trong batch
    (p000143, p000148, p000156, p000161) đều đặt trong “...”.
    (2) Tại p000144, phần in nghiêng mở đầu `*Hỗ trợ chiến dịch của Cụm Tập đoàn quân phương Bắc
    ư?*` làm rơi dấu ba chấm mở đầu `…` nằm bên trong thẻ `<em>` của nguồn và tự thêm cụm
    "chiến dịch của" vốn không có trong mệnh đề lặp lại lời tư lệnh ở đầu đoạn p000144.
    (3) Tại p000155, cụm "Ngay cả Hồng quân Liên Xô" làm rơi tính từ chỉ màu sắc nhấn mạnh sắc
    thái châm biếm của Tanya trong nguồn ("đỏ rực" / "đỏ chót" đi trước danh xưng quân đội Liên Xô).
  recommendation: >
    - p000141: Bổ sung cặp dấu ngoặc kép chuẩn: `“Được rồi, tôi sẽ giải thích tình hình.”` (hoặc
      `“Được, tôi sẽ giải thích tình hình.”`).
    - p000144: Khôi phục dấu ba chấm mở đầu trong phạm vi in nghiêng theo DEC-P01-002 và bỏ cụm
      tự thêm "chiến dịch của": `*…Hỗ trợ Cụm tập đoàn quân phương Bắc ư?*`.
    - p000155: Khôi phục sắc thái màu sắc: `Ngay cả Quân đội Liên Xô đỏ rực cũng gặp đủ thứ tai
      họa trong các cuộc chiến mùa đông.` (hoặc `Ngay cả Hồng quân Liên Xô đỏ rực cũng gặp đủ thứ
      tai họa trong các cuộc chiến mùa đông.`).
