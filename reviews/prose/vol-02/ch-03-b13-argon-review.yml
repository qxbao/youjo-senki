- source_term: tanya_flagship_briefing_pronouns_and_viewpoint_vol02_ch03_b13
  proposed_vi: "Trong phân cảnh tư lệnh hạm đội phổ biến kế hoạch tác chiến tại phòng họp chỉ huy trên kỳ hạm và dòng phân tích nội tâm của Tanya (part0018/p000141–p000161): tuân thủ nghiêm ngặt `DEC-P01-001` (`canon/decisions.md`) và nối mạch liền kề với `ch-03-b12` (p000134–p000140) cùng `ch-03-b14` (p000162–p000163): (1) Trong trần thuật ngôi thứ ba bám điểm nhìn Tanya (p000142, p000144), quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` (cần sửa hai chỗ `cô` tại p000142 sang `nó` theo F01). (2) Trong độc thoại nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya (p000147, p000152), bắt buộc dùng `mình` (cần sửa hai chỗ `tôi` tại p000147 và một chỗ `tôi` tại p000152 sang `mình` theo F01); khi Tanya quy chiếu tập thể đơn vị mình hoặc lực lượng Đế quốc tham gia chiến dịch trong nội tâm (p000152, p000154, p000155, p000159) và trong câu dẫn lời tư lệnh (p000156), giữ ngôi thứ nhất số nhiều bao gộp `chúng ta`. (3) Trong lời phát biểu trực tiếp của tư lệnh hạm đội trước phòng họp (p000141, p000143, p000148, p000156, p000161), tư lệnh tự xưng `tôi` ở câu mở đầu (p000141) và dùng `Chúng ta` / `chúng ta` khi đại diện toàn lực lượng tham gia chiến dịch (p000143, p000148, p000156, p000161); quy chiếu Thiếu tướng von Rudersdorf trong nội tâm của Tanya bằng `ông ta` (p000147), quy chiếu Bộ Tổng tham mưu và các đơn vị bạn bằng `họ` (p000144–p000146, p000149), và quy chiếu quân địch / hải quân địch bằng `địch` / `chúng` (p000156, p000158, p000159, p000161)"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật điểm nhìn Tanya tại part0018/p000142 — bắt buộc đổi sang `nó` theo `DEC-P01-001`, mục `vol02-ch03-b11-tanya-third-person-reference` và mạch liền kề ở `ch-03-b12` p000134–p000138, `ch-03-b14` p000162–p000163) / tôi (thay cho `mình` trong độc thoại nội tâm của Tanya tại part0018/p000147, p000152 — bắt buộc đổi sang `mình` theo `DEC-P01-001` và mục `vol02-ch03-b11-tanya-interior-pronoun` để tách bạch với lời phát biểu công khai dùng `tôi` của tư lệnh hạm đội ở p000141)
