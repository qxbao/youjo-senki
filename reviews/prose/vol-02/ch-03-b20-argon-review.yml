  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ tình báo – ngoại giao – hải quân, đơn vị, địa danh, chính thể và cấp bậc đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b20_translation_proposals` cùng `handoffs/vol-02/ch-03-b20.yml` (`Người điện báo`, `Dacia`, `tàu phụ trợ *Lytol*`, `tàu buôn vũ trang`, `mật mã dùng một lần`, `Liên minh Entente`, `nhân vật quan trọng`, `nghị viên nhà nước`, `chính phủ lưu vong`, `Đế quốc`, `Khối Thịnh vượng chung`, `Bộ Ngoại giao`, `người nghe báo cáo`, `Ban Chiến lược Đối ngoại`, `một phòng thuộc ban chiến lược của cơ quan tình báo`, `Tướng Habergram`, `Hải quân Liên minh Entente`, `cơ quan tình báo Khối Thịnh vượng chung`), bảo toàn trọn vẹn các bản sửa V1–V3 và N1, N4–N6, N8, N11–N12 đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b20-fixes-signoff-claude.md`."
