  proposed_vi: "Người điện báo, bãi mìn (part0018/p000358, p000369) / cấp trên, Dacia (part0018/p000359) / Điện khẩn, tàu phụ trợ *Lytol* (part0018/p000360, p000373) / tàu thu thập tin tình báo cải trang thành tàu dân sự, tàu buôn vũ trang, mức ưu tiên khẩn cấp cao nhất, mật mã dùng một lần (part0018/p000362) / Liên minh Entente, nhân vật quan trọng (part0018/p000364, p000365, p000368, p000370, p000373, p000377, p000379) / mười nghị viên nhà nước, chính phủ lưu vong, Đế quốc, lợi ích quốc gia, Khối Thịnh vượng chung (part0018/p000365, p000373, p000377, p000379) / Bộ Ngoại giao (part0018/p000366, p000368) / người nghe báo cáo, Ban Chiến lược Đối ngoại, đầu mối liên lạc, công tác thu thập tin tình báo (part0018/p000367) / kênh chính thức, đại sứ quán tại nước sở tại, xin tị nạn, một phòng thuộc ban chiến lược của cơ quan tình báo (part0018/p000368, p000377) / vị sĩ quan cấp trên, Tướng Habergram (part0018/p000369) / Hải quân Liên minh Entente (part0018/p000370) / lỗ hổng an ninh nghiêm trọng (part0018/p000371) / cơ quan tình báo Khối Thịnh vượng chung (part0018/p000373) / rò rỉ tin tình báo, tay nghiệp dư (part0018/p000374) / phà chở khách thông thường (part0018/p000376) / cường quốc, tình báo Đế quốc, chính phủ Liên minh Entente (part0018/p000377) / những người đứng đầu chính phủ, kháng cự với tinh thần dân tộc chủ nghĩa (part0018/p000378) / cuộc tấn công quy mô lớn, các tuyến phía bắc (part0018/p000379)"
  alternatives_vi:
  - Thiếu tướng Habergram (thay cho `Tướng Habergram` tại part0018/p000369 — bắt buộc giữ `Tướng Habergram` theo mục `vol02-ch03-b20-habergram-rank` trong `work/run-state/pending-terms.yml` và bản sửa V2 đã nghiệm thu trong `handoffs/vol-02/ch-03-b20.yml` vì văn bản nguồn tại p000369 chỉ nêu cấp tướng chung) / ủy viên Hội đồng Nhà nước / ủy viên nhà nước (thay cho `nghị viên nhà nước` tại part0018/p000365 — giữ `nghị viên nhà nước` theo mục `vol02-ch03-b20-councilor-state` và bản sửa N6 đã nghiệm thu để đồng bộ với hệ thuật ngữ nghị viên của Liên minh Entente) / khóa dùng một lần / sổ mã dùng một lần (thay cho `mật mã dùng một lần` tại part0018/p000362 — giữ `mật mã dùng một lần` theo mục `vol02-ch03-b20-one-time-pad`) / báo vụ viên / nhân viên vô tuyến (thay cho `Người điện báo` tại part0018/p000358, p000369 — giữ `Người điện báo` nhất quán nội bộ lô như đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b20-fixes-signoff-claude.md`)
