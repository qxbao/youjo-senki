  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa chủ thể báo cáo (`Người điện báo`, `anh` / `anh ta`) và chủ thể nghe báo cáo (`người nghe báo cáo`, `vị sĩ quan cấp trên`, `Tướng Habergram`), đại từ tập thể `họ` / `Họ`, cùng sắc thái đối thoại ngắn gọn, thực dụng giữa cấp trên và cấp dưới trong cơ quan tình báo Khối Thịnh vượng chung."
