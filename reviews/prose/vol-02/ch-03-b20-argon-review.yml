- source_term: commonwealth_foreign_strategy_division_habergram_and_operator_pronouns_vol02_ch03_b20
  proposed_vi: "Trong phân cảnh tại Ban Chiến lược Đối ngoại thuộc cơ quan tình báo Khối Thịnh vượng chung khi người điện báo trình bức điện khẩn từ tàu phụ trợ *Lytol* cho Tướng Habergram về việc Liên minh Entente đề nghị vận chuyển một nghị viên nhà nước để lập chính phủ lưu vong (part0018/p000358–p000379): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa V1–V3, N1, N4–N6, N8, N11–N12 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b20.yml`: (1) Trần thuật ngôi thứ ba quy chiếu người điện báo bằng `Người điện báo` kết hợp đại từ `anh` / `Anh` hoặc `anh ta` / `Anh ta` (p000358, p000359, p000362, p000363, p000369, p000377); tách bạch rõ người nhận báo cáo tại p000367 bằng cụm `người nghe báo cáo` (theo V1) và `vị sĩ quan cấp trên` / `Tướng Habergram` tại p000369 (theo V2); dùng cấu trúc điều kiện khái quát lược đại từ ngôi thứ hai phiếm chỉ tại câu thứ hai của p000377 (`Nếu tìm kiếm sự giúp đỡ một cách bừa bãi, sớm muộn gì tin tức cũng sẽ lọt ra ngoài.`). (2) Quy chiếu tập thể Ban Chiến lược Đối ngoại và cơ quan tình báo Khối Thịnh vượng chung bằng `Họ` / `họ` kết hợp đại từ phản thân `mình` (p000362, p000367, p000374, p000379); quy chiếu phía Liên minh Entente / người liên lạc / người dân Entente bằng `họ` / `Họ` / `những người này` (p000368, p000371–p000373, p000377–p000379). (3) Trong đối thoại báo cáo giữa người điện báo và Tướng Habergram (p000360, p000361, p000364, p000366, p000370–p000372, p000375, p000376): Tướng Habergram tự xưng `tôi`, dùng `chúng ta` khi nói về cơ quan tình báo Khối Thịnh vượng chung (p000371) và dùng các câu hỏi/mệnh lệnh ngắn gọn lược đại từ (`“Báo cáo đi.”`, `“…Chuyện này chẳng phải thuộc thẩm quyền Bộ Ngoại giao sao?”`, `“Chẳng màng đến thể diện sao? Đúng là nước cờ tệ hại. Có danh sách không?”`); người điện báo giữ giọng báo cáo công vụ chuẩn mực, dùng `chúng ta` cho phía Khối Thịnh vượng chung (p000372) và đáp lễ phép `“Đây ạ.”` khi trình danh sách (p000376)"
  alternatives_vi:
  - người nhận điện (thay cho `người nghe báo cáo` tại part0018/p000367 — bắt buộc giữ `người nghe báo cáo` theo bản sửa V1 đã nghiệm thu để không gây nhầm chủ thể với người điện báo vừa giải mã bức điện ở p000362–p000363) / bạn (thay cho cấu trúc vô nhân xưng ở câu thứ hai của part0018/p000377 — ưu tiên lược bỏ đại từ ngôi thứ hai phiếm chỉ để giữ giọng phân tích tình báo tự nhiên)
  segment_ids:
