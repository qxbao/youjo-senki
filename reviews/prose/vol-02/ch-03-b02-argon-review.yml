  proposed_vi: "Trong phần kết bài phóng sự điều tra sau chiến tranh của phóng viên đặc biệt Andrew thuộc hãng tin WTN về vụ can thiệp bí mật của Khối Thịnh vượng chung tại Regadonia và bí ẩn Nữ thần Thứ Mười Một (part0016/p000041–p000059): Andrew tự xưng ngôi thứ nhất số ít bằng `tôi` / `Tôi` kết hợp đại từ phản thân `mình` khi nêu trải nghiệm cá nhân tại mặt trận phía tây và lời nhắn cuối bài (p000054, p000057), dùng `Chúng tôi` / `chúng tôi` khi đại diện nhóm điều tra cùng Jeffrey hoặc đối sánh góc nhìn giữa hai cơ quan báo chí (p000045–p000047, p000050, p000055, p000056), và dùng `chúng ta` khi mời gọi tiếp tục tìm hiểu ở câu kết (p000057); tuân thủ nghiêm ngặt `DEC-P01-001` và mục `vol02-ch03-b01-jeffrey-reference`, tiếp tục lặp lại tên riêng `Jeffrey` ở p000042, p000051, p000053 để không suy diễn tuổi tác hay thứ bậc; đối với `Nữ thần Thứ Mười Một`, giữ đại từ `cô ấy` ở p000041 bám sát đại từ giống cái giả định theo danh xưng nữ thần trong câu hỏi đầu đoạn, sau đó chuyển sang đại từ vô nhân xưng trung tính `chính thứ đó` / `đó` ở p000050 khi đặt câu hỏi phân vân giữa một người hay một thuật ngữ chuyên môn; dùng chủ ngữ khái quát `Người ta` ở p000045 và quy chiếu Cục Lưu trữ Quốc gia, đội quân tình nguyện, cũng như giới lãnh đạo Khối Thịnh vượng chung bằng `họ` (p000045, p000049, p000050, p000052). Trong phân cảnh chuyển cảnh sang cuộc họp bàn kế hoạch rút lui chiến lược của Quân đội Đế quốc (part0016/p000060–p000064): tuân thủ giới hạn suy luận của `DEC-P01-001`, giữ đại từ ngôi thứ nhất `Tôi` và `chúng ta` ở p000060 (do đoạn mở cảnh mới sau dấu ngắt đoạn chưa nêu danh tính chủ thể điểm nhìn trong phạm vi batch), quy chiếu vị vĩ nhân trong câu trích dẫn bằng `ông ấy` (p000060), dùng chủ ngữ khái quát `người ta` (p000061), quy chiếu những người lính thực dụng bằng `Họ` (p000062), giữ đại từ `tôi` trong câu thoại đề xuất giảm thiểu thương vong ở p000063, và dùng cụm trung tính `người đó` cho một sĩ quan bình thường giả định ở p000064"
  alternatives_vi:
  - anh / ông ấy (thay cho lặp tên `Jeffrey` tại part0016/p000042, p000051, p000053 — bắt buộc giữ cách lặp tên `Jeffrey` để đồng bộ tuyệt đối với `ch-03-b01` và mục `vol02-ch03-b01-jeffrey-reference` theo `DEC-P01-001`) / Mình (thay cho `Tôi` tại part0016/p000060 — ưu tiên giữ `Tôi` trong phạm vi `b02` vì chủ thể suy ngẫm ở p000060–p000062 chưa được định danh trực tiếp trong đoạn văn bản này và thực chất thuộc mạch nhìn của Zettour/Bộ Tổng tham mưu ở lô kế tiếp, tránh quy chiếu nhầm thành độc thoại của Tanya)
