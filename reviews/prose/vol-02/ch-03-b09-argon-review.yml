- source_term: rudersdorf_tanya_orders_and_tanya_smoking_rant_pronouns_vol02_ch03_b09
  proposed_vi: "Trong phần kết cuộc trao đổi chiến lược giữa Rudersdorf với Tanya và phân cảnh Tanya trở về doanh trại gặp Trung úy Weiss rồi bực dọc vì khói thuốc ở cuộc họp tham mưu (part0018/p000032–p000063): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `ch-03-b08`: (1) Ở phân cảnh từ điểm nhìn của Rudersdorf (p000032–p000059), trần thuật ngôi thứ ba quy chiếu Rudersdorf bằng `ông` / `Ông` (p000033, p000035, p000037, p000041, p000042, p000045, p000052, p000053, p000056) kết hợp đại từ phản thân `mình` (p000035, p000056), và quy chiếu Tanya bằng `cô` / `Cô` (p000033, p000041, p000042, p000045, p000056) kết hợp tên riêng `Degurechaff` / `Tanya` (p000032, p000035, p000045); trong các câu độc thoại nội tâm in nghiêng của Rudersdorf (p000037, p000042, p000045, p000046, p000048, p000052), Rudersdorf tự quy chiếu ngôi thứ nhất bằng `mình` (p000045) và gọi Tanya là `cô ấy` / `Cô ấy` (p000037, p000042, p000052) hoặc `đứa trẻ này` – `nó` khi liên tưởng Tanya với một đứa trẻ được sai vặt (p000045). (2) Trong đối thoại giữa Rudersdorf và Tanya (p000033, p000034, p000038, p000039, p000040, p000043, p000044, p000047, p000049, p000050, p000051, p000054, p000055, p000057, p000058, p000059): Rudersdorf tự xưng `Tôi` / `tôi` (kèm đại từ phản thân `mình` ở p000040), gọi Tanya là `cô` / `Cô` kèm danh xưng `Thiếu tá` (p000043, p000047, p000050, p000059), gọi gộp Tanya và tiểu đoàn là `Các cô` (p000047), và dùng `chúng ta` khi nói về việc sử dụng đơn vị của Tanya (p000043); Tanya tự xưng `Tôi` / `tôi`, dùng `chúng ta` khi nói về tình hình chung của Đế quốc (p000039), và thưa Rudersdorf trọng thị bằng `ngài` / `thưa ngài` / `đúng không ạ?`. (3) Ở phân cảnh Tanya trở về doanh trại và độc thoại nội tâm về chuyện hút thuốc (p000060–p000063): câu mở đầu p000060 chuyển cảnh từ điểm nhìn bên ngoài đón `Thiếu tá von Degurechaff` nên dùng `cô`, quy chiếu các binh sĩ dưới quyền bằng `họ` và quy chiếu Trung úy Weiss bằng `Anh` / `Anh ta` / `anh ta` (p000060, p000061); trong độc thoại nội tâm trực tiếp của Tanya (p000061–p000063), Tanya tự quy chiếu ngôi thứ nhất bằng `mình` / `Mình` đúng quy ước `DEC-P01-001` (riêng câu lời nói tưởng tượng in nghiêng hướng ra ngoài `*Đừng phả khói vào mặt tôi.*` ở p000061 dùng `tôi`), và quy chiếu các sĩ quan cấp cao hút xì gà trong phòng họp tham mưu bằng `họ` / `Họ`"
  alternatives_vi:
  - tôi (thay cho `mình` / `Mình` trong độc thoại nội tâm của Tanya tại part0018/p000061–p000063 — bắt buộc giữ `mình` / `Mình` theo `DEC-P01-001` và bản sửa followup M4 đã hoàn tất trong `handoffs/vol-02/ch-03-b09.yml`) / Bọn họ (thay cho `Họ` tại part0018/p000063 — giữ `Họ` theo bản sửa followup để tuân thủ `style-guide.md` về việc không tự thêm sắc thái miệt thị vào đại từ khi câu gốc chỉ dùng *They*)
