  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa điểm nhìn và độc thoại nội tâm của Rudersdorf (`ông` / `mình` – `cô` / `cô ấy`), đối thoại quân sự giữa cấp trên và cấp dưới (`Tôi` / `chúng ta` – `cô` / `Thiếu tá` và `tôi` / `chúng ta` – `ngài` / `thưa ngài`), cùng đoạn độc thoại nội tâm châm biếm của Tanya ở cuối lô (`mình` / `Mình` tự quy chiếu, `tôi` trong câu nói giả định hướng ra ngoài, `Anh` / `Anh ta` cho Weiss và `Họ` / `họ` cho các sĩ quan cấp cao hút thuốc)."
