  proposed_vi: "Rudersdorf, Degurechaff, Tanya (part0018/p000032, p000033, p000035, p000041, p000045, p000061, p000063) / cuộc đổ bộ đường biển, kế hoạch bí mật, sĩ quan tham mưu cấp trung thấp, Tướng von Zettour, Zettour (part0018/p000033, p000035, p000053, p000054, p000057) / kế hoạch đổ bộ quy mô lớn vào hậu phương, học viện, lập luận chiến lược, vận tải, sĩ quan cực kỳ triển vọng (part0018/p000037, p000041, p000042) / đơn vị, Thiếu tá, lệnh điều động, Tiểu đoàn, căn cứ hải quân (part0018/p000043, p000047, p000050, p000059) / nhảy dù, lực lượng đổ bộ, mũi tiên phong, quân đội, mũi nhọn (part0018/p000047, p000048) / cuộc tiến công, Cụm tập đoàn quân phương Bắc, Trung tướng von Schreise, Thượng tướng von Wragell (part0018/p000051, p000052, p000057) / phía Tác chiến, mặt trận, Cục Hậu cần, tiếp tế, binh sĩ (part0018/p000053, p000060, p000063) / Bộ Tổng tham mưu, Liên minh Entente, phòng thủ trong nước, Rhine (part0018/p000056, p000057) / Thiếu tá von Degurechaff, doanh trại, sĩ quan trực ban tuần, phó chỉ huy, Trung úy Weiss, lính phục vụ, chiếc áo khoác dự phòng (part0018/p000060) / buổi họp tham mưu, chiến trường, khu vực hút thuốc và khu vực không hút thuốc riêng, tuyến lệ, quyền cá nhân, sĩ quan cấp cao (part0018/p000061, p000062)"
  alternatives_vi:
