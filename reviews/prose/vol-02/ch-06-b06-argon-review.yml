    modality_and_logic: "Bảo toàn chính xác cấu trúc giả định trái thực tế và khả thể trong quá khứ: nếu họ chỉ là những kẻ nổi dậy có vũ trang không có pháp sư, thì dù khó dẹp yên, lực lượng cảnh sát vẫn có thể đã đủ sức xử lý; hoặc có lẽ một sư đoàn bộ binh cũng đã có thể giải quyết."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000182
    terms:
      - "giao chiến trong đô thị"
      - "pháp sư"
      - "bộ binh hạng nặng"
      - "chiến trường ba chiều"
      - "các trận đánh ở đô thị"
    pronouns_and_address: "Dùng chủ ngữ khái quát `người ta` cho nhận định gián tiếp ở câu 3."
    pov_and_voice: "Giọng phân tích chiến thuật chuyên môn."
    modality_and_logic: "Bảo toàn đủ 4 câu: đối đầu pháp sư trong đô thị khiến ngay cả bộ binh hạng nặng cũng phải chuẩn bị chịu tổn thất khủng khiếp -> giải thích thành phố là chiến trường ba chiều đầy chỗ ẩn nấp và chướng ngại vật -> dẫn nhận định ít được nói công khai rằng người ta cho là pháp sư phát huy tốt nhất trong tác chiến đô thị -> kết luận đây sẽ là một trận chiến cam go."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000183
    terms:
      - "đánh chặn"
    pronouns_and_address: "Câu hỏi dùng đại từ nghi vấn `ai` và quy chiếu pháp sư địch bằng `họ`."
    pov_and_voice: "Giọng hỏi khẩn trương nhằm kiểm tra phản ứng phòng không."
    modality_and_logic: "Bảo toàn câu hỏi trực tiếp xem có lực lượng nào đang đánh chặn toán pháp sư địch hay không."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000184
    terms:
      - "pháp sư"
      - "sư đoàn bộ binh"
      - "lực lượng dự bị đã tập kết"
      - "đám đông có vũ trang"
      - "cảnh sát"
      - "Bộ Nội vụ"
    pronouns_and_address: "Quy chiếu lực lượng cảnh sát và Bộ Nội vụ bằng `họ`."
    pov_and_voice: "Giọng lập luận giải thích tầm quan trọng chiến thuật của việc pháp sư địch vào được thành phố."
    modality_and_logic: "Bảo toàn đủ 3 câu và giữ nguyên tính khả thể giả định ở câu 2–3: đó là lý do việc pháp sư tham gia phòng thủ thành phố có ý nghĩa lớn đến vậy; chỉ một sư đoàn bộ binh rút từ lực lượng dự bị đã tập kết có lẽ cũng đủ trấn áp đám đông có vũ trang dù mất chút thời gian; với nhân lực của cảnh sát và Bộ Nội vụ, họ có thể đã đủ sức trấn áp đám đông dù phải đổ máu (không dịch thành sự việc đã hoàn tất)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000185
    terms:
      - "pháp sư"
      - "đánh chặn"
      - "vị trí phòng thủ"
      - "sự can thiệp quân sự"
      - "khí tài"
      - "khu phố"
    pronouns_and_address: "Quy chiếu các pháp sư phòng thủ thành phố bằng `họ`; lược đại từ ngôi thứ hai phiếm chỉ ở câu cuối theo `direct-address choice`."
    pov_and_voice: "Giọng mổ xẻ bài toán công kiên đô thị tàn khốc."
    modality_and_logic: "Bảo toàn đủ 3 câu: một khi pháp sư là lực lượng phòng thủ thành phố thì khác hẳn đánh chặn trên địa hình phẳng hay từ vị trí phòng thủ, đòi hỏi can thiệp quân sự -> dẫu vậy chỉ ném thật nhiều khí tài vào họ cũng không hiệu quả lắm -> cần thực sự bất chấp mọi thiệt hại để chiếm từng khu phố một."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000186
    terms:
      - "pháp sư"
      - "không chiến"
      - "mạng lưới phòng không"
    pronouns_and_address: "Quy chiếu các pháp sư địch bằng đại từ sở hữu `của họ`."
    pov_and_voice: "Giọng đối chiếu kế hoạch lý thuyết với thực tại thất bại."
    modality_and_logic: "Bảo toàn sắc thái lẽ ra phải có nhưng không đạt được ở cả hai câu (`lẽ ra phải ngăn chặn... đồng thời thiết lập một mạng lưới phòng không bao quát 360 độ`, `Đáng lẽ mọi chuyện phải là như thế`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000187
    terms: []
    pronouns_and_address: "Quy chiếu lực lượng đánh chặn bằng `Họ`."
    pov_and_voice: "Giọng báo cáo ngắn gọn xác nhận việc đánh chặn bất thành."
    modality_and_logic: "Bảo toàn hai thông tin trả lời câu hỏi ở `p000183`: lực lượng đánh chặn đã không đến kịp và bị điều/cuốn đi hướng khác."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000188
    terms:
      - "lực lượng không quân"
      - "Hạm đội Không quân Đế quốc"
      - "Trận không chiến Rhine"
    pronouns_and_address: "Trần thuật phân tích tình hình chung của phía Đế quốc."
    pov_and_voice: "Giọng phân tích thực trạng quá tải của lực lượng không quân Đế quốc."
    modality_and_logic: "Bảo toàn đủ 3 câu: khoảng cách rõ rệt giữa kế hoạch và tình hình hiện tại; cơ chế luân phiên lực lượng không quân lẽ ra phải có độ linh hoạt nhất định nhưng đã ngưng trệ từ lâu; Hạm đội Không quân Đế quốc gần như phải tung toàn lực mỗi ngày và chật vật bù đắp tổn thất sau Trận không chiến Rhine."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000189
    terms:
      - "Các đơn vị không quân"
      - "ưu thế trên trời"
      - "quân đội"
      - "Lục quân"
      - "kiểm soát bầu trời"
    pronouns_and_address: "Quy chiếu các đơn vị không quân bằng `họ`."
    pov_and_voice: "Giọng bình luận chiến lược về sự thay đổi nhận thức của quân đội trước và sau khi chiến tranh nổ ra."
    modality_and_logic: "Bảo toàn đủ 3 câu: các đơn vị không quân có nhiều loại nhiệm vụ hơn dự kiến chứ không chỉ giành ưu thế trên trời -> kế hoạch lập trước chiến tranh trở nên vô nghĩa trước thực tế các đơn vị không quân gần như kiệt sức vẫn bị động viên cho những nhiệm vụ ngoài dự kiến -> chỉ sau khi điều động các đơn vị ấy, quân đội mới hiểu sự cần thiết của các nhiệm vụ họ đảm nhận, và Lục quân nhận thức rõ hơn nhiều tầm quan trọng của việc kiểm soát bầu trời so với trước chiến tranh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000190
    terms:
      - "Dacia"
      - "trường hợp điển hình"
      - "Hạm đội Không quân Đế quốc"
      - "quyền kiểm soát bầu trời"
      - "tiền tuyến"
    pronouns_and_address: "Lược đại từ ngôi thứ hai phiếm chỉ trong câu hỏi tu từ bằng tiểu từ nghi vấn `chăng?` theo `direct-address choice`."
    pov_and_voice: "Giọng phân tích pha chút tự vấn mỉa mai về cái giá của việc dồn toàn lực ra tiền tuyến."
    modality_and_logic: "Bảo toàn đủ cấu trúc 3 phần cùng dấu gạch ngang dài `—`: Dacia, nơi những kẻ tung cánh trên trời chi phối mọi thứ, được lấy làm trường hợp điển hình; hai câu hỏi tu từ nối tiếp đặt nghi vấn về nguyên nhân; và hệ quả là Hạm đội Không quân Đế quốc đã dốc toàn lực giành quyền kiểm soát bầu trời gần tiền tuyến."
    emphasis: "Bảo toàn chính xác hai cụm nhấn mạnh tách biệt theo `DEC-P01-002`: `*Chỉ vì lý do ấy thôi*` và `*chính vì thế?*` (giữ dấu chấm hỏi nằm trong cặp dấu `*` thứ hai và giữ chữ `chăng?`, `Hay` cùng phần còn lại ở chữ thường)."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000191
    terms:
      - "mặt trận"
      - "ưu thế nhất định trên không"
      - "tập kích bất ngờ"
      - "hậu phương"
      - "Norden"
    pronouns_and_address: "Quy chiếu Hạm đội Không quân Đế quốc / phía Đế quốc bằng `họ`."
    pov_and_voice: "Giọng nhận xét trớ trêu khi liên hệ tình cảnh hiện tại với chiến dịch Norden."
    modality_and_logic: "Bảo toàn đủ 3 câu: nhờ đó họ đã ổn định được mặt trận và giành được một mức độ ưu thế nhất định trên không; thật trớ trêu khi lại thiếu lực lượng ngăn một cuộc tập kích bất ngờ vào hậu phương; tình cảnh này gần giống Norden chỉ đảo ngược giữa tấn công và phòng thủ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000192
    terms:
      - "đầu cầu"
    pronouns_and_address: "Tanya lược chủ ngữ hoặc ngầm hiểu `chúng ta`, quy chiếu quân địch bằng `họ`."
    pov_and_voice: "Giọng nhận định nguy cấp của Tanya."
    modality_and_logic: "Bảo toàn hai câu ngắn: đánh giá tình thế (`Tệ rồi`) và yêu cầu kiên quyết không để địch thiết lập đầu cầu."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000193
    terms:
      - "trận chiến chống pháp sư"
      - "pháp sư"
    pronouns_and_address: "Dùng đại từ ngôi thứ nhất số nhiều gộp `chúng ta` ở cuối câu hỏi thứ hai."
    pov_and_voice: "Giọng hỏi xác nhận tính chất khắc nghiệt của nhiệm vụ sắp tới."
    modality_and_logic: "Bảo toàn cả hai câu hỏi liên tiếp: xác nhận đây sẽ là một trận chiến chống pháp sư, và nhấn mạnh tình thế bất lợi khi phải đối đầu với những pháp sư đã sẵn sàng chờ đón."
    emphasis: "none"
