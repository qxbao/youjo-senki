  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000174
    category: style_repetition
    issue: >-
      Tại `p000174`, từ `lệnh` lặp lại ba lần liên tiếp trong hai câu ngắn (`Ra lệnh sẵn sàng chờ lệnh. Bảo đảm chúng ta có thể cơ động ngay khi có lệnh.`).
    basis: >-
      Cách diễn đạt hiện tại đã xử lý triệt để góp ý F01 của vòng review trước và bảo toàn chính xác nghĩa mệnh lệnh ứng trực cùng tín hiệu xuất phát; tuy nhiên nhịp câu hơi nặng do trùng âm từ `lệnh`.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc tinh chỉnh nhẹ thành `Phát lệnh sẵn sàng ứng trực. Bảo đảm chúng ta có thể cơ động ngay khi có lệnh.` miễn giữ nguyên nghĩa chuẩn bị chờ lệnh điều động.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000187
    category: clause_connection_nuance
    issue: >-
      Tại `p000187`, liên từ kết nối hai vế (`không đến kịp` và `bị điều đi nơi khác` / `bị thu hút hướng khác`) đang được dịch bằng quan hệ nhân quả `nên` (`Họ không đến kịp nên bị điều đi nơi khác.`).
    basis: >-
      Bản dịch vẫn giữ đúng sự việc lực lượng đánh chặn không kịp tiếp cận và bị chuyển hướng; tuy nhiên dùng liên từ đẳng lập `và` sẽ trung tính hơn về trình tự nhân quả giữa việc bị cầm chân/điều chuyển hướng và việc không đến kịp.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc cân nhắc `Họ không đến kịp và đã bị điều đi hướng khác.`
    resolution: optional_polish

