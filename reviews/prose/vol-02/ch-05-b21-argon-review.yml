    modality_and_logic: "Bảo toàn 3 câu: các trận đánh hằng ngày trong chiến hào diễn ra chẳng khác gì thế giới của *Phía Tây không có gì lạ*; ngày nào cũng lặp lại gần như cùng một khuôn mẫu; điều mới mẻ duy nhất thu hút sự chú ý là đám tân binh đang huấn luyện ngay tại tiền tuyến có làm tốt hay không."
