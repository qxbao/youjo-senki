findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000535
    category: pronoun_and_internal_voice_consistency
    issue: >-
      Trong phần độc thoại và tự sự ngôi thứ nhất không in nghiêng của Tanya (`p000535`–`p000538`, `p000551`), bản dịch đang dùng đại từ `tôi`, trong khi ở các câu độc thoại nội tâm in nghiêng (`p000539`, `p000552`, `p000557`) dùng `mình` / `Mình` và ở các câu trần thuật ngôi thứ ba (`p000539`, `p000541`–`p000550`, `p000552`, `p000554`–`p000556`) dùng `Tanya` / `nó` kết hợp phản thân `mình`; ngoài ra khi quy chiếu nhóm tân binh, `p000539`–`p000540` đang dùng `chúng` còn `p000541`–`p000542`, `p000545` dùng `họ`.
    basis: >-
      Cách phân tách `tôi` cho các đoạn tự sự ngôi thứ nhất không in nghiêng (tiếp nối trực tiếp mạch `p000530`–`p000534` ở cuối `ch-05-b20`), `mình` cho độc thoại nội tâm in nghiêng và `nó` cho trần thuật ngôi thứ ba vẫn giữ đúng ranh giới điểm nhìn của Tanya, hoàn toàn không dùng `cô` trong trần thuật theo đúng `DEC-P01-001`.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc đồng bộ đại từ ngôi thứ nhất số ít của Tanya tại `p000535`–`p000538` và `p000551` về `mình` (giữ `chúng tôi` cho ngôi thứ nhất số nhiều) và thống nhất đại từ quy chiếu nhóm tân binh ở `p000539`–`p000540` thành `họ` để liền mạch với `p000541`–`p000545`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000548
    category: lexical_nuance_and_specificity
    issue: >-
      Tại câu cuối của `p000548`, danh từ chỉ hai lính mới tử trận (`two newbies`) đang được dịch khái quát thành `hai người` (`Trong hoàn cảnh đó, chỉ mất hai người đâu có gì tệ.`); bên cạnh đó, tại `p000542`, cụm chỉ việc rời đi/rút quân sau ba mươi giây (`leaving in thirty seconds`, đối chiếu lệnh rút lui sau 30 giây ở `ch-05-b20` `p000498`) đang dịch là `xuất phát sau ba mươi giây`.
    basis: >-
      Vì `p000538`–`p000542` và `p000547` ngay trước đó đã nêu rõ hai tổn thất trong đêm đột kích là hai tân binh không kịp rút lui trước đợt pháo kích, người đọc vẫn nắm bắt chính xác đối tượng và diễn biến sự việc.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh `hai người` ở `p000548` thành `hai lính mới` (hoặc `hai tân binh`) để giữ sắc thái phân trần của Tanya rằng tổn thất chỉ nằm ở đám lính mới, và đổi `xuất phát` ở `p000542` thành `rời đi` (hoặc `rút đi`) để khớp tuyệt đối với lệnh rút quân ở `p000498`.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000558
    category: institutional_term_and_reference_nuance
    issue: >-
      Tại `p000558`, hai cơ quan đồng chủ trì cuộc họp (`Service Corps` và `Operations`) đang được dịch là `bộ phận Hậu cần` và `bộ phận Tác chiến`, dẫn tới việc `Service Corps` (`p000558`) và `Logistics` (`p000565`) cùng được dịch thành `bộ phận Hậu cần` (trong khi một số lô khác ở Bộ Tổng Tham mưu dùng `Cục Quân vụ` / `Cục Hậu cần` và `Cục Tác chiến`); ngoài ra tại `p000565`, cụm chỉ mục đích bảo đảm sự sụp đổ của Liên minh Entente (`to ensure it`) đang dịch hơi lặp từ `ở đó` (`đến khu vực đó để bảo đảm tình hình ở đó`).
    basis: >-
      Trong cơ cấu Bộ Tổng Tham mưu Đế quốc, Thiếu tướng von Zettour đứng đầu khối Quân vụ/Hậu cần và trực tiếp phụ trách bài toán tiếp tế xuyên suốt phân cảnh `p000558`–`p000565`, đồng thời cách dịch `bộ phận Hậu cần` tại `p000565` đồng bộ trực tiếp với `ch-05-b18` (`p000443`), không làm sai lệch nội dung cuộc họp.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc phân biệt `Cục Quân vụ` (hoặc `Khối Hậu cần`) với `Cục Tác chiến` ở `p000558` và gọt câu `p000565` thành `cần tạm thời điều một phần binh lực đến khu vực đó để bảo đảm kết cục ấy, việc này cũng khiến bộ phận Hậu cần thêm nặng gánh.` để tránh lặp `ở đó`.
    resolution: optional_polish

