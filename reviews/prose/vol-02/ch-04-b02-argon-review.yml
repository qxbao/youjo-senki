  proposed_vi: "Trong phân cảnh Đại tá Anson Sue tiễn vợ và con gái Mary lên tàu sơ tán rồi nhận khẩu tiểu liên quà Giáng sinh từ Nghị viên Cazor (part0022/p000001–p000037): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1, M2, M4 cùng bản khôi phục ngữ cảnh `p000009` đã được nghiệm thu trong `handoffs/vol-02/ch-04-b02.yml`: (1) Trong trần thuật ngôi thứ ba theo điểm nhìn của Đại tá Sue (p000004, p000008, p000011, p000014, p000015, p000017, p000021–p000023, p000029, p000032, p000034): quy chiếu Sue bằng tên riêng `Sue` và đại từ `ông` / `Ông` kết hợp phản thân `mình` (p000015, p000017); quy chiếu con gái Mary bằng `Con bé` / `con bé` / `con gái` / `con gái ông`; quy chiếu vợ của Sue bằng `Vợ ông` / `mẹ`, và quy chiếu chung hai mẹ con bằng `họ` (p000011, p000015). (2) Trong độc thoại nội tâm trực tiếp in nghiêng của Sue (p000012, p000024, p000030, câu đầu p000034, p000035): giữ chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002`; khi cầu nguyện với `Tổ quốc` và `Chúa` tại p000012 tự xưng `con` và gọi `Người`; khi tự vấn ở p000024, p000030 dùng đại từ nội tâm `mình` (`con gái mình`); khi nhắn nhủ thầm với con gái ở câu đầu p000034 tự xưng `cha` và gọi `con` / `con yêu`. (3) Trong đối thoại gia đình trước lúc chia tay (p000001–p000003, p000005–p000007, p000009, p000010, p000013): vợ gọi tên chồng `“Anson…”` (p000001) và nói câu chúc bình an trung tính không đại từ `“Xin hãy giữ gìn an toàn.”` (p000010, theo bản sửa M2); Sue và con gái xưng hô `cha` – `con` (p000002, p000003, p000005–p000007, p000013); tại câu p000009 khi nói chung với vợ con để nén xúc động, Sue dùng cách nói trung tính `tôi` – `mọi người` theo bản khôi phục ngữ cảnh đã nghiệm thu. (4) Trong đối thoại giữa Nghị viên Cazor và Đại tá Sue (p000016, p000019, p000020, p000025–p000028, p000031–p000033, p000036, p000037): Cazor (người quen cũ của Sue theo p000015) gọi Sue bằng tên `Sue` (p000016), cấp bậc `Đại tá` (p000033, p000037) và đại từ thân mật `cậu` xuyên suốt cả cảnh (p000016, p000025, p000027, p000033, p000037 theo mục `vol02-ch04-b02-cazor-sue-address` và bản sửa M4), đồng thời dùng `ta` / `chúng ta` cho phía Liên minh Entente (p000025, p000037); Sue gọi Cazor bằng chức danh `Nghị viên Cazor` (p000019) và tự xưng `tôi` / `Tôi` (p000028, p000036); khi tự lẩm bẩm một mình lúc xem súng ở p000022, Sue gọi con gái là `con bé`"
  alternatives_vi:
  - ông (thay cho `cậu` trong lời của Nghị viên Cazor nói với Đại tá Sue tại part0022/p000016, p000025, p000027, p000033, p000037 — bắt buộc giữ `cậu` xuyên suốt cả cảnh theo mục `vol02-ch04-b02-cazor-sue-address` và bản sửa M4 đã nghiệm thu trong `handoffs/vol-02/ch-04-b02.yml` để phản ánh quan hệ người quen cũ ở p000015 và tránh nhảy bậc xưng hô ở p000037) / anh – em / mẹ con em (thay cho cách nói trung tính `tôi` – `mọi người` tại p000009 và câu chúc không đại từ tại p000010 — bắt buộc giữ phương án trung tính đã nghiệm thu trong `reviews/prose/vol-02/ch-04-b02-context-restoration-signoff-claude.md` theo `DEC-P01-001`)
