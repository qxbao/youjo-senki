      - "học viện quân sự (military academy)"
      - "cấp dưới (subordinates)"
    names_and_ranks:
      - "Phó chỉ huy Weiss (Vice Commander Weiss)"
    pronouns_and_address:
      - "Độc thoại nội tâm của Tanya dùng nhất quán đại từ `mình` / `Mình` theo DEC-P01-001."
    pov_and_voice: "Độc thoại nội tâm phản ánh thoáng ngập ngừng rồi lập tức lấy lại sự quyết đoán của Tanya."
    modality_and_logic: "Giữ hai câu tự vấn liên tiếp, lời răn từ học viện quân sự và cấu trúc so sánh lựa chọn ở câu cuối (`thà hối hận vì đã làm gì đó còn hơn chẳng làm gì, cứ thế mà để mặc mọi chuyện`)."
    emphasis: "Khóa nhấn mạnh `*Đừng bao giờ nao núng trước cấp dưới.*` khớp chính xác với thẻ `<em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000388
    terms:
      - "nhân sự trong tiểu đoàn (battalion personnel)"
      - "điều căn bản (the basics)"
      - "nhân tài (talent)"
    pronouns_and_address:
      - "Câu 1 trần thuật ngôi thứ ba dùng `nó` (theo DEC-P01-001 / B24-R01); câu 2 và câu 3 chuyển sang độc thoại nội tâm ngôi thứ nhất dùng `mình`."
    pov_and_voice: "Trần thuật ngôi thứ ba chuyển sang độc thoại nội tâm ngay trong cùng đoạn."
    modality_and_logic: "Giữ mức độ kiểm soát biểu cảm ở câu 1 (`chỉ vừa đủ giữ được vẻ mặt thản nhiên rồi liếc nhìn quanh`), phủ định giảm nhẹ ở câu 2 (`có vẻ... vẫn chưa chán những lần mình liên tục xác nhận`) và ước muốn thu nạp nhân tài ở câu 3."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000389
    terms:
      - "Đế quốc (Empire)"
      - "người canh giữ (watchdog)"
    pronouns_and_address:
      - "Quy chiếu Đế quốc bằng `họ`."
    pov_and_voice: "Lời tuyên bố khích lệ lòng trung thành của Tanya trước tiểu đoàn."
    modality_and_logic: "Giữ cấu trúc mệnh lệnh khích lệ (`Hãy cho Đế quốc thấy... tài giỏi đến mức nào`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000390
    terms:
      - "quân đội (the army)"
      - "công cụ bạo lực (instrument of violence)"
      - "người canh giữ (watchdog)"
      - "nhà nước (the state)"
    pronouns_and_address:
      - "Câu 1 dùng `Mình` và quy chiếu binh sĩ bằng `họ`; câu 3–4 dùng `Chúng ta` / `mình` / `chúng ta`."
    pov_and_voice: "Độc thoại nội tâm thực dụng, cảnh giác chính trị của Tanya."
    modality_and_logic: "Giữ định nghĩa bản chất quân đội ở câu 2, mục đích chứng minh sự phục tùng không chống lại sự kiểm soát của nhà nước ở câu 3, và sự cảnh giác trước những ánh mắt giám sát ở câu 4."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000391
    terms:
      - "lòng trung thành (loyalty)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình`; quy chiếu cấp dưới/người quan sát bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm toan tính xen lẫn giọng độc đoán của chỉ huy."
    modality_and_logic: "Giữ so sánh hơn tuyệt đối ở câu 2 (`Để họ cười mình còn tốt hơn gấp triệu lần việc khiến họ cảnh giác rồi tự đẩy mình vào thế bí`) và cách xử lý thẳng tay ở câu 3 (`ai cười thì mình cứ đánh cho một trận là được`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000392
    terms:
      - "lũ chuột (those rats)"
    pronouns_and_address:
      - "Trong lời thoại: dùng `chúng ta` đối lập với `lũ chuột ấy` / `chúng`."
    pov_and_voice: "Lời tuyên bố truy kích kẻ địch của Tanya trước tiểu đoàn."
    modality_and_logic: "Giữ quan hệ nhượng bộ toàn phần (`chúng có chạy đi đâu thì chúng ta cũng sẽ bám sát gót`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000393
    terms:
      - "Người có lý trí (anyone with common sense)"
    names_and_ranks:
      - "Tsuji"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình` / `Mình`; quy chiếu Tsuji bằng `ông ta`; quy chiếu người đời bằng `họ`."
    pov_and_voice: "Độc thoại tự chất vấn khi Tanya chợt nhận ra hành vi của mình giống Tsuji."
    modality_and_logic: "Giữ chuỗi câu hỏi – tự đáp phủ định (`Người có lý trí nào lại thích ông ta chứ? Còn lâu.`) và câu hỏi truy nguyên nhân ở cuối đoạn (`Vì sao? Vì ông ta cứ hành động mà chẳng bàn bạc với ai sao?`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000394
    terms:
      - "người biết điều (sensible person)"
      - "cấp dưới (subordinate)"
      - "đội hành quyết (firing squad)"
    names_and_ranks:
      - "Tsuji"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình`; quy chiếu Tsuji bằng `hắn`."
    pov_and_voice: "Độc thoại nội tâm gay gắt của Tanya đối với mẫu sĩ quan tự tiện kiểu Tsuji."
    modality_and_logic: "Giữ câu điều kiện giả định trái thực tế (`Nếu một người biết điều như mình có cấp dưới kiểu Tsuji, hẳn mình sẽ đưa hắn ra trước đội hành quyết`), lý do giải thích và câu cảm thán phê phán sự vô dụng ở cuối đoạn."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000395
    terms:
      - "phó chỉ huy (vice commander)"
      - "biết điều (have common sense)"
      - "nổi cơn làm loạn (go on a rampage)"
    names_and_ranks:
      - "Tsuji"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình`; quy chiếu phó chỉ huy Weiss bằng `anh ta`."
    pov_and_voice: "Độc thoại nội tâm suy diễn lo âu của Tanya về cách Weiss nhìn nhận mình."
    modality_and_logic: "Giữ liên kết suy luận giữa hai câu hỏi (`Thế phó chỉ huy của mình có biết điều không? Nói cách khác, anh ta kết luận rằng mình là một Tsuji có thể nổi cơn làm loạn à?`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000396
    terms:
      - "người biết điều (sensible person)"
      - "tuân thủ quy tắc (following rules)"
      - "lẽ tồn tại (meaning of my existence)"
      - "kẽ hở (loopholes)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng nhất quán `mình` / `Mình`."
    pov_and_voice: "Độc thoại tự biện hộ đầy đặc trưng của Tanya về việc thượng tôn quy tắc và lách luật."
    modality_and_logic: "Giữ phủ định hành vi tự ý quyết định rồi đổ trách nhiệm, khẳng định việc tuân thủ quy tắc là lẽ tồn tại, và thế đối lập sắc sảo ở câu kết (`Mình không phá luật; mình tìm kẽ hở!`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000397
    terms:
      - "Rhine"
      - "thưa các quý ông (gentlemen)"
    names_and_ranks:
      - "Trung úy (Lieutenant)"
    pronouns_and_address:
      - "Tanya gọi Weiss là `Trung úy`, dùng `chúng ta` cho cả đơn vị, và gọi toàn thể sĩ quan/binh sĩ là `thưa các quý ông`."
    pov_and_voice: "Lời thông báo điểm điều chuyển mới của Tanya trước tiểu đoàn."
    modality_and_logic: "Khóa việc giữ nguyên tên địa danh `Rhine` không thêm từ `sông` ở cả hai vị trí (theo B24-R03)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000398
    names_and_ranks:
      - "Tanya"
      - "Tsuji"
      - "tướng Brute-Guchi (General Brute-Guchi)"
      - "Trung úy Weiss (Lieutenant Weiss)"
    pronouns_and_address:
      - "Câu 1 trần thuật ngôi thứ ba dùng `Tanya`; câu 2–3 chuyển sang độc thoại nội tâm ngôi thứ nhất dùng `mình`; quy chiếu Tsuji và Brute-Guchi bằng `họ`; quy chiếu Trung úy Weiss bằng `anh ta`."
    pov_and_voice: "Trần thuật ngôi thứ ba chuyển sang độc thoại nội tâm lo lắng của Tanya."
    modality_and_logic: "Giữ nguyên nhân gây căng thẳng (`toát mồ hôi lạnh vì hiểu lầm này`), mong muốn tránh bị đánh đồng với nhóm Tsuji / tướng Brute-Guchi và câu điều kiện dự định nói chuyện với Weiss."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000399
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng `nó` theo DEC-P01-001 (B24-R01)."
    pov_and_voice: "Trần thuật ngôi thứ ba bám sát trạng thái của Tanya."
    modality_and_logic: "Giữ quan hệ nhượng bộ giữa tâm trạng bên trong và hành động bên ngoài (`Dù trong lòng còn rối bời, nó vẫn tập trung vượt qua tình thế trước mắt`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000400
    terms:
      - "Rhine"
    pronouns_and_address: []
    pov_and_voice: "Câu hỏi lặp lại địa danh đầy ngạc nhiên của thuộc cấp."
    modality_and_logic: "Khóa việc giữ nguyên `Rhine ư?` không thêm từ `sông` (theo B24-R03)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000401
    terms:
      - "quét chiến trường theo chiều ngược kim đồng hồ (counterclockwise sweep of the battlefield)"
    pronouns_and_address:
      - "Trong lời thoại: dùng `chúng ta` / `Chúng ta`; quy chiếu cấp trên bằng `họ`."
    pov_and_voice: "Lời giải thích kế hoạch tác chiến của Tanya."
    modality_and_logic: "Giữ thế đối lập (`sẽ phải gấp rút, nhưng họ kỳ vọng rất nhiều ở chúng ta`) và hướng cơ động (`quét chiến trường theo chiều ngược kim đồng hồ`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000402
    pronouns_and_address:
      - "Dùng `Chúng ta`."
    pov_and_voice: "Nhận định ngắn gọn, khẩu ngữ trong nội tâm của Tanya về nhiệm vụ."
    modality_and_logic: "Giữ giới hạn phạm vi công việc tối giản (`chỉ cần nện cho mấy kẻ cả gan xuất hiện một trận. Chỉ thế thôi.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000403
    terms:
      - "thăng chức (promotions / getting promoted)"
      - "quân đội (the army)"
      - "cấp lương (pay grade)"
      - "Being X"
    names_and_ranks:
      - "Tanya"
      - "Tsuji"
    pronouns_and_address:
      - "Câu 1 dùng `Chúng ta`; câu 3–5 và câu 6 dùng `mình` / `Mình` cho độc thoại nội tâm của Tanya; mệnh đề dẫn lời kể dùng tên riêng `Tanya`."
    pov_and_voice: "Độc thoại nội tâm thực dụng của Tanya xen mệnh đề dẫn lời kể ngôi thứ ba."
    modality_and_logic: "Giữ lập luận giới hạn nỗ lực theo đúng cấp lương vì thăng chức trong quân đội không hẳn mang lại hạnh phúc, lời than thở quy căn nguyên cho Being X và kết luận tự răn không hành xử quá giống Tsuji."
    emphasis: "Khóa phạm vi nhấn mạnh `*Tại sao chuyện này lại xảy ra cơ chứ? Không, mình biết gốc rễ mọi chuyện là Being X*` theo đúng thẻ `<em>` trong nguồn, để mệnh đề `, Tanya than thở.` và câu cuối ở ngoài dấu `*...*` (DEC-P01-002 / B24-R02)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000404
    terms:
      - "binh sĩ (troops)"
    names_and_ranks:
      - "Serebryakov"
      - "Weiss"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình` / `Mình`; quy chiếu binh sĩ bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm cân nhắc việc thăm dò tâm tư cấp dưới của Tanya."
    modality_and_logic: "Giữ hai câu hỏi lựa chọn đối tượng tham vấn (`hỏi Serebryakov xem họ nghĩ gì về mình chăng? Hay hỏi Weiss xem họ dạo này thế nào?`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000405
    pronouns_and_address: []
    pov_and_voice: "Câu hỏi ngắn thúc giục tiếp tục mạch thông báo của Weiss."
    modality_and_logic: "Giữ câu hỏi ngắn `“Rồi sao?”`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000406
    terms:
      - "pháp sư hải quân (marine mages)"
      - "hải quân (the navy)"
    pronouns_and_address:
      - "Trong lời thoại: dùng `chúng ta`."
    pov_and_voice: "Lời thông báo pha giọng trêu đùa của Tanya trước đơn vị."
    modality_and_logic: "Giữ trình tự thời gian (`nhưng trước đó chúng ta sẽ tham gia một trò chơi nhỏ của các pháp sư hải quân`), câu mệnh lệnh khích lệ (`Vui lên nào`) và câu hỏi đuôi về chất lượng đồ ăn của hải quân."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000407
    terms:
      - "suất ăn của hải quân (Navy meals)"
      - "hải quân (the navy)"
      - "lục quân (the army)"
      - "“phần cứng” (“hardware”)"
      - "“phần mềm” (“software”)"
      - "phúc lợi (welfare)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình`; quy chiếu binh sĩ bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm so sánh chế độ đãi ngộ giữa hai quân chủng dưới góc nhìn môi trường làm việc."
    modality_and_logic: "Khóa việc dùng `lục quân` đối lập với `hải quân` ở cả bốn vị trí so sánh trực tiếp trong đoạn (theo B24-R04), bảo toàn cặp ẩn dụ trong ngoặc kép `“phần cứng”` – `“phần mềm”` và kết luận về góc độ phúc lợi."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000408
    pronouns_and_address: []
    pov_and_voice: "Tiếng thốt ngạc nhiên ngắn gọn của thuộc cấp."
    modality_and_logic: "Giữ câu cảm thán nghi vấn `“Hả?”`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000409
    terms:
      - "hạm đội (the fleet)"
    names_and_ranks:
      - "Đại tá von Lergen (Colonel von Lergen)"
    pronouns_and_address:
      - "Trong lời thoại: dùng `Chúng ta`."
    pov_and_voice: "Lời giải thích ngắn gọn của Tanya về nhiệm vụ phối hợp với hạm đội."
    modality_and_logic: "Giữ nguyên nhân/người thu xếp (`Nhờ Đại tá von Lergen đấy`) và nhiệm vụ sắp tới (`đến hỗ trợ hạm đội`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000410
    terms:
      - "một trăm feet (one hundred feet)"
    pronouns_and_address: []
    pov_and_voice: "Câu trần thuật ngắn mở đầu cảnh bay diễn tập trên biển."
    modality_and_logic: "Giữ thông số độ cao `Ở độ cao một trăm feet.`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000411
    terms:
      - "đội hình đột kích lên tàu (boarding assault formation)"
      - "mục tiêu (target)"
      - "các đại đội (the companies)"
    names_and_ranks:
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng chức danh `Thiếu tá von Degurechaff` ở câu 1 và đại từ `nó` ở câu 3 theo DEC-P01-001 (B24-R01)."
    pov_and_voice: "Trần thuật ngôi thứ ba mô tả mệnh lệnh và triển khai đội hình bay sát mặt biển."
    modality_and_logic: "Khóa thuật ngữ `đội hình đột kích lên tàu` (theo B24-R05), giữ nguyên mô tả kỹ thuật bay (`lướt sát mặt nước mà không giảm tốc độ rồi lao vào mục tiêu`) và sự phối hợp đội hình giữa các đại đội."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000412
    terms:
      - "làn đạn phòng không (anti–air fire)"
      - "cuộc diễn tập / diễn tập (exercise)"
      - "màn đánh chặn (interception)"
      - "hỏa lực đánh chặn (intercepting fire)"
    names_and_ranks:
      - "Tanya"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng tên riêng `Tanya` và đại từ `nó` / `Nó` (theo DEC-P01-001 / B24-R01); quy chiếu đơn vị trong lời kể bằng `Họ` và trong câu độc thoại nội tâm cuối bằng `chúng ta`; quy chiếu phía hạm đội phòng không bằng `Họ` / `họ`."
    pov_and_voice: "Trần thuật ngôi thứ ba đan xen hai câu độc thoại nội tâm trực tiếp in nghiêng của Tanya."
    modality_and_logic: "Giữ sự tương phản giữa vẻ mặt nghiêm nghị bên ngoài với sự kinh ngạc bên trong, kỳ vọng về màn đánh chặn tương xứng so với thực tế hỏa lực đánh chặn quá yếu, câu hỏi nghi vấn việc khai hỏa `*Họ có đang bắn không vậy?*` (không hàm ý hỏi về đạn thật theo B24-R06), và sự tin chắc ở câu cuối (`*Chắc chắn họ sẽ bắn vào chúng ta, dù đây chỉ là diễn tập.*`)."
    emphasis: "Khóa chính xác hai phạm vi nhấn mạnh `*Họ có đang bắn không vậy?*` và `*Chắc chắn họ sẽ bắn vào chúng ta, dù đây chỉ là diễn tập.*` theo đúng hai thẻ `<em>` trong nguồn (DEC-P01-002)."
