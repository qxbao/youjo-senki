findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000341
    category: lexical_nuance
    issue: >-
      Tại `p000341`, tác phẩm được dẫn theo tên dịch tiếng Việt quen thuộc là `*Phía Tây không có gì lạ*`, trong khi cụm kết câu lại dịch theo nghĩa đen của từ tĩnh lặng ở bản Anh (`chẳng còn gì động tĩnh`), làm giảm nhẹ hiệu ứng lặp từ trực tiếp với nhan đề bộ phim.
    basis: >-
      Ý nghĩa so sánh hài đen của Tanya (nếu quân số hao hụt nhanh như trong phim thì cả chiến tuyến sẽ im bặt đúng như tên phim) vẫn hoàn toàn rõ ràng và dấu nhấn mạnh `*...*` được bảo toàn đúng theo `DEC-P01-002`.
    recommendation: >-
      Không chặn signoff; có thể giữ nguyên hoặc ở bước polish tinh chỉnh vế sau thành `đúng như nhan đề bộ phim: phía Tây chẳng còn gì động tĩnh` / `đúng như nghĩa đen của nhan đề bộ phim: hoàn toàn tĩnh lặng`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000352
    category: lexical_nuance
    issue: >-
      Tại câu 1 của `p000352`, mệnh đề tự rào đón về cách lập luận cực đoan của Tanya vừa nêu ở `p000350`–`p000351` đang được dịch thành `Dĩ nhiên, đó là nói đến trường hợp cực đoan.` (hơi nghiêng sang cực hạn tình huống thay vì cách nói cực đoan).
    basis: >-
      Đặt trong mạch nối tiếp giả định mức tập kích tối đa của địch ở `p000351`, câu dịch hiện tại vẫn hợp logic và không gây hiểu sai đại ý.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh nhẹ thành `Dĩ nhiên, đó là nói một cách cực đoan.` để sát hơn với sắc thái tự bình luận về phát ngôn của Tanya.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000354
    category: modality_and_register
    issue: >-
      Ở `p000354`, câu hỏi phủ định mang hàm ý gợi mở của vị đại tá được chuyển thành câu hỏi nghi vấn thông thường và lặp đại từ `cô` đồng thời biến mệnh đề bị động về tỷ lệ tổn thất thành chủ động (`cô nghĩ với sự chỉ dẫn và điều hành của mình, cô có thể hạ tỷ lệ tổn thất xuống không?`).
    basis: >-
      Đích giao tiếp (vị đại tá thăm dò khả năng nhờ Tanya hướng dẫn để kéo giảm tỷ lệ tổn thất của tân binh) và thái độ lịch sự công vụ vẫn được truyền tải đầy đủ.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể làm mượt thành `“Thiếu tá von Degurechaff, cô không nghĩ rằng với sự hướng dẫn và chỉ đạo của cô thì tỷ lệ tổn thất có thể giảm xuống sao?”`
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000357
    category: pronoun_and_pov_consistency
    issue: >-
      Tại câu cuối của `p000357` (`Chợt hiểu ra điều đó, Tanya nhận thấy tiểu đoàn của mình cũng vẫn chưa trải qua một số chuyện ở Rhine.`), cụm mở đầu dịch `Chợt hiểu ra điều đó` hơi lệch nhẹ so với mạch liên tưởng từ ví dụ bảng chữ cái do chính Tanya vừa nêu, và từ phản thân `mình` xuất hiện trong câu trần thuật ngôi thứ ba dễ trùng bề mặt với đại từ nội tâm `mình` theo `DEC-P01-001`.
    basis: >-
      Trong tiếng Việt, `của mình` đi sau chủ ngữ `Tanya` đóng vai trò đại từ phản thân hợp ngữ pháp nên không làm rối người đọc.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh thành `Nghĩ đến đó, Tanya nhận ra tiểu đoàn của nó cũng vẫn chưa trải qua một số chuyện ở Rhine.`
    resolution: optional_polish

