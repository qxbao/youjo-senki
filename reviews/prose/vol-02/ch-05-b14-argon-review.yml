      - "thương vong"
      - "lính mới"
    pronouns_and_address: "Độc thoại nội tâm lược đại từ `we` để giữ giọng nhận định chiến thuật khách quan, quy chiếu quân địch là `họ`."
    pov_and_voice: "Giọng phân tích chiến thuật tự tin pha sự thực dụng của người chỉ huy."
    modality_and_logic: "Bảo toàn mệnh đề nhượng bộ giả định (dù địch dùng cả sư đoàn đánh đêm như Chiến tranh Nga–Nhật thì súng máy và pháp sư yểm trợ vẫn dễ dàng đẩy lùi) và kết luận thực tế (vẫn phải chấp nhận một mức thương vong trong giới hạn cho phép khi lính mới còn đang học việc)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000343
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình` theo đúng `DEC-P01-001`, quy chiếu binh sĩ là `họ`."
    pov_and_voice: "Độc thoại nội tâm vị kỷ nhưng lý tính của Tanya."
    modality_and_logic: "Bảo toàn cả hai vế phủ định bổ sung cho nhau: lý do sâu xa là bản thân Tanya không phải người sẽ bỏ mạng, nhưng cũng không có nghĩa là muốn họ chết nếu có thể tránh được."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000344
    terms:
      - "trận cơ động quy mô lớn"
      - "huấn luyện"
    pronouns_and_address: "Vị đại tá gọi Tanya là `cô` và dùng `ta` cho phía quân đội Đế quốc."
    pov_and_voice: "Giọng tán đồng về mặt lý trí nhưng còn day dứt của vị đại tá."
    modality_and_logic: "Bảo toàn sự đồng tình với nhận định chiến thuật của Tanya và liên từ bỏ lửng `nhưng…` mở đường cho nỗi trăn trở ở các đoạn sau."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000345
    terms:
      - "ngài đại tá"
      - "Tanya"
    pronouns_and_address: "Trần thuật hạn tri dùng `ngài đại tá` và `Tanya`."
    pov_and_voice: "Trần thuật hạn tri ghi nhận việc lập luận của Tanya không bị bác bỏ."
    modality_and_logic: "Bảo toàn mệnh đề phủ định: rốt cuộc vị đại tá không đưa ra ý kiến nào bác bỏ lời Tanya."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000346
    terms: []
    pronouns_and_address: "Trần thuật hạn tri quy chiếu vị đại tá bằng `ông`."
    pov_and_voice: "Trần thuật mô tả sự giằng xé nội tâm của vị sĩ quan tham mưu có lương tâm."
    modality_and_logic: "Bảo toàn nội dung cảm xúc toát ra từ lời đáp đau đớn của vị đại tá: cảm giác sai trái không sao rũ bỏ được và sự căm ghét lối đánh nướng quá nhiều sinh mạng trẻ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000347
    terms:
      - "giao tranh nhỏ"
      - "tổn thất"
      - "tinh thần binh sĩ"
    pronouns_and_address: "Vị đại tá dùng `chúng ta`."
    pov_and_voice: "Giọng trăn trở, lo âu của người làm công tác tham mưu chiến dịch."
    modality_and_logic: "Bảo toàn cấu trúc nối tiếp từ `p000344` (`…chúng ta cũng không thể làm ngơ...`), sự tích tụ của những tổn thất nhỏ và hệ quả đáng ngại nhất là sự suy sụp tinh thần binh sĩ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000348
    terms:
      - "giao tranh nhỏ"
      - "tổn thất"
    pronouns_and_address: "Câu thoại của Tanya không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng phản biện khô khan, thuần túy dựa trên quy mô con số."
    modality_and_logic: "Bảo toàn lập luận điều kiện của Tanya: nếu chỉ là giao tranh nhỏ thì không lý nào lại gây ra quá nhiều tổn thất."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000349
    terms:
      - "Tanya"
      - "tổn thất"
      - "tỷ lệ thương vong"
      - "Thế chiến thứ nhất"
    pronouns_and_address: "Trần thuật hạn tri dùng tên riêng `Tanya`, quy chiếu người bình thường ở thế giới này bằng `người bình thường` / `họ`."
    pov_and_voice: "Độc thoại nội tâm chuyển sang trần thuật hạn tri tự nhận thức về sự lệch chuẩn trong thước đo thương vong của Tanya."
    modality_and_logic: "Bảo toàn bước ngoặt nhận thức (`Khoan đã`), phép so sánh với Thế chiến thứ nhất khiến các vụ đụng độ hiện tại trông thật nhỏ bé, và sự đối조 với người bình thường (dù có biết cũng không lấy Thế chiến thứ nhất làm thước đo, còn nếu không biết thì ắt sẽ rùng mình trước những con số không tưởng đó)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000350
    terms:
      - "cuộc tập kích quấy rối"
    pronouns_and_address: "Tanya xưng `tôi` trong lời thoại với vị đại tá."
    pov_and_voice: "Giọng bình thản đến vô cảm khi nói về sinh mạng binh lính."
    modality_and_logic: "Bảo toàn lập luận khắc nghiệt của Tanya rằng các cuộc tập kích quấy rối cùng lắm chỉ giết những kẻ đằng nào cũng chết nên không có gì to tát."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000351
    terms:
      - "đại đội bộ binh"
      - "tập kích bất ngờ"
      - "pháp sư"
      - "đợt tập kích quấy rối quy mô tiểu đoàn"
      - "thương vong"
      - "Đế quốc"
    pronouns_and_address: "Trần thuật hạn tri / độc thoại phân tích chiến thuật không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng ước tính rủi ro – chi phí quân sự chuẩn xác."
    modality_and_logic: "Bảo toàn chuỗi suy luận: đột kích lớn quá mạo hiểm nên địch tối đa chỉ dùng một đại đội bộ binh đánh lén hoặc một tiểu đoàn pháp sư tập kích quấy rối; với quy mô đó thì thương vong của phía Đế quốc không thể cao bất thường."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000352
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật hạn tri dùng tên riêng `Tanya`."
    pov_and_voice: "Trần thuật hạn tri nối kết suy nghĩ nội tâm với hành động đời thường trong phòng họp."
    modality_and_logic: "Bảo toàn lời tự rào đón cho nhận định vừa nêu và chi tiết Tanya uống cạn tách cà phê dở tệ rồi ăn kẹo bạc hà để khử vị."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000353
    terms:
      - "cựu binh"
      - "lính mới"
      - "Tỷ lệ tổn thất"
      - "binh sĩ bổ sung"
      - "cuộc chiến Dacia"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình` (`đơn vị mình`) theo đúng `DEC-P01-001`, quy chiếu cựu binh/lính mới bằng `họ`, và lược đại từ ngôi thứ hai phiếm chỉ ở câu cuối."
    pov_and_voice: "Độc thoại nội tâm tổng kết kinh nghiệm chỉ huy thực chiến."
    modality_and_logic: "Bảo toàn đầy đủ các ý: khoảng cách giữa cựu binh và tân binh nằm ở trải nghiệm thực chiến; đơn vị của Tanya có tỷ lệ tổn thất thấp nhất nhưng lính bổ sung từ đơn vị khác cũng đang dần bị thương; và sự đối lập giữa những người may mắn được làm quen chiến trường ở cuộc chiến Dacia dễ dàng với những tân binh phải nếm trải mặt trận Rhine khốc liệt ngay lần đầu."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000354
    terms:
      - "Thiếu tá von Degurechaff"
      - "tỷ lệ tổn thất"
    pronouns_and_address: "Vị đại tá gọi `Thiếu tá von Degurechaff` và `cô`."
    pov_and_voice: "Giọng đặt vấn đề lịch sự, chuẩn bị giao nhiệm vụ huấn luyện thực địa cho Tanya."
    modality_and_logic: "Bảo toàn câu hỏi gợi ý rằng sự hướng dẫn và chỉ đạo của Tanya có thể giúp kéo giảm tỷ lệ tổn thất."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000355
    terms: []
    pronouns_and_address: "Tanya gọi vị đại tá là `ngài`, tự xưng `tôi`, và quy chiếu đám tân binh là `những người lần đầu ra trận này` / `họ`."
    pov_and_voice: "Giọng nhận lệnh chuẩn mực của một sĩ quan cấp dưới đi kèm quan điểm huấn luyện thực tế."
    modality_and_logic: "Bảo toàn cam kết sẵn sàng dốc hết sức nếu có lệnh, kèm khẳng định rằng giải pháp duy nhất cho số lính mới lần đầu ra trận là phải kèm cặp từng bước một."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000356
    terms:
      - "lính bắn tỉa"
      - "chiến hào"
      - "pháo dã chiến"
      - "hỏa lực tập trung"
      - "pháo hạng nặng cỡ lớn"
      - "bê tông cốt thép"
      - "nhân viên vô tuyến"
      - "lô cốt"
    pronouns_and_address: "Độc thoại nội tâm của Tanya lược đại từ ngôi thứ hai phiếm chỉ và quy chiếu đám tân binh bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm sắc lạnh, thực tế về phương pháp huấn luyện trực quan trên chiến trường."
    modality_and_logic: "Bảo toàn hai ví dụ đối chiếu sinh động: chỉ vào một kẻ ngốc bị bắn tỉa hiệu quả hơn lời nhắc suông không được thò đầu ra; và bắt tân binh đi đào xác những nhân viên vô tuyến bị chôn sống chết ngạt trong lô cốt bị trọng pháo bắn sập sẽ giúp họ khắc cốt ghi tâm việc không được tụ tập hết vào một chỗ."
    emphasis: "Bảo toàn chính xác 2 cụm `*...*` tương ứng `<html:em>` (`*Đừng thò đầu ra!*` và `*nên đừng có chui hết vào cùng một chỗ!*`) theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000357
    terms:
      - "Tanya"
      - "tiểu đoàn"
      - "Rhine"
    pronouns_and_address: "Hai câu đầu lược đại từ ngôi thứ hai phiếm chỉ; câu cuối trần thuật ngôi thứ ba dùng tên riêng `Tanya`."
    pov_and_voice: "Độc thoại nội tâm chuyển sang trần thuật hạn tri khép lại đoạn hồi tưởng và nối lại với quyết định huấn luyện thực địa ở đầu chương."
    modality_and_logic: "Bảo toàn phép loại suy với việc dạy viết bảng chữ cái từng bước A-B-C và kết luận bất ngờ của Tanya rằng ngay cả tiểu đoàn của mình cũng còn một số bài học thực tế ở Rhine chưa từng trải qua."
    emphasis: "none"
