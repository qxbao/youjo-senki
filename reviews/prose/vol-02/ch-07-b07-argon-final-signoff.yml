    segment_id: YS-LN02/Text/part0032.xhtml/p000160
    category: emphasis_and_meaning
    issue: >-
      Chưa được sửa trong `translations/vol-02/ch-07-b07.jsonl` (dù `self-check` và
      `translator_fixes` báo đã sửa): trường `translation` của `p000160` chỉ đổi
      `status` sang `reviewed` nhưng văn bản vẫn thiếu dấu nhấn mạnh Markdown `*...*`
      cho hai câu đầu nằm trong thẻ `<html:em>` theo `DEC-P01-002`, vẫn giữ `mắc kẹt ở
      đây, phải chặn chúng` (thêm nghĩa vị trí không gian không có căn cứ), và vẫn lược
      mất sắc thái tất yếu ở đầu câu thứ ba.
    evidence: >-
      Trong `translations/vol-02/ch-07-b07.jsonl` (sha256
      `7a9edf09a314f08ce10e338965c638d4864e0718c9883054597808c0bc4315a4`), dòng 8 vẫn
      giữ nguyên nội dung: `Không thể tin nổi chúng tôi lại mắc kẹt ở đây, phải chặn
      chúng trước khi chúng vượt qua tuyến phòng thủ cuối cùng. Chúng tôi có nguy cơ
      chịu tổn thất vì các đòn quấy rối, đồng thời để chúng mang tin tình báo về. Chuyện
      này khiến ai nấy đều cảm thấy hổ thẹn.`
    recommendation: >-
      Áp dụng thực tế bản sửa vào `translations/vol-02/ch-07-b07.jsonl`: bọc chính xác
      hai câu đầu trong `*...*` theo `DEC-P01-002`, bỏ `ở đây` (ví dụ: `*Không thể tin
      nổi chúng tôi lại rơi vào cảnh phải chặn chúng trước khi chúng vượt qua tuyến
      phòng thủ cuối cùng. Chúng tôi có nguy cơ chịu tổn thất vì các đòn quấy rối, đồng
      thời để chúng mang tin tình báo về.*`), và khôi phục sắc thái tất yếu cho câu thứ
      ba ngoài thẻ nghiêng (ví dụ: `Không tránh khỏi, chuyện này khiến ai nấy đều cảm
      thấy hổ thẹn.`).
    resolution: unresolved
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000161
    category: terminology_and_pronoun_reference
    issue: >-
      Chưa được sửa trong `translations/vol-02/ch-07-b07.jsonl` (dù `self-check` báo đã
      đổi sang `Tổng hành dinh Rhine` và `chúng`): dòng 9 vẫn giữ nguyên `Bộ chỉ huy Tập
      đoàn quân Rhine` (tự thêm cấp biên chế `Tập đoàn quân`) và đại từ `họ` (`nghiền nát
      họ`, `những tin tình báo họ có`), gây lệch thái độ ngôi kể và nhập nhằng chủ thể
      nắm tin tình báo.
    evidence: >-
      Dòng 9 của `translations/vol-02/ch-07-b07.jsonl` hiện tại vẫn là: `Một tiểu đoàn
      pháp sư có thể đã chọc thủng phòng tuyến, nhưng Bộ chỉ huy Tập đoàn quân Rhine lẽ
      ra phải dễ dàng nghiền nát họ. Tuy nhiên, xét đến những tin tình báo họ có, trận
      này rất có thể sẽ kết thúc trong thảm họa.`
    recommendation: >-
      Sửa trực tiếp vào `translations/vol-02/ch-07-b07.jsonl`: đổi `Bộ chỉ huy Tập đoàn
      quân Rhine` thành `Tổng hành dinh Rhine` và đổi cả hai đại từ `họ` chỉ tiểu đoàn
      pháp sư địch thành `chúng` (`nghiền nát chúng`, `những tin tình báo mà chúng có`).
    resolution: unresolved
