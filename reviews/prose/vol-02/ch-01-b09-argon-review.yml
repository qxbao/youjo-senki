  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, đơn vị, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1 cùng B01–B08 của Tập 2 (`Trung úy Weiss`, `Thiếu tá`, `Đế quốc`, `Quân đội Đế quốc`, `Bộ Tổng Tham mưu`, `Quân đội Dacia`, `Quân đội Công quốc`, `Tiểu đoàn Pháp sư Không quân 203`, `sư đoàn`, `đại đội`, `sở chỉ huy`, `nhân viên sở chỉ huy`), đồng thời khóa tạm toàn bộ các thuật ngữ tác chiến và lựa chọn đã sửa theo M2–M4 và được signoff trong `handoffs/vol-02/ch-01-b09.yml` cùng `work/run-state/pending-terms.yml` (`giao chiến ở cự ly gần`, `Chỉ với súng ngắn`, `bẫy` / `bẫy nổ`, `con dấu nhập cảnh`, `chiến thuật chiến tranh chớp nhoáng`, `gã Khốn-guchi ở Imphal`, `đội bay`)."
