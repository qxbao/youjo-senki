  proposed_vi: "Trung úy Weiss, đội hình (part0010/p000219, p000239) / Đế quốc, tù binh, tù binh chiến tranh, tù binh cấp cao (part0010/p000220, p000221, p000226, p000238) / sư đoàn, bộ phận Hậu cần (part0010/p000221) / Quân đội Dacia, sách giáo khoa Dacia, lính Dacia, quân đội Dacia, sĩ quan Dacia (part0010/p000222, p000225, p000228, p000236, p000238) / đại đội pháp sư, giao chiến ở cự ly gần, nhân viên sở chỉ huy, đại đội, súng ngắn (part0010/p000225, p000226, p000230) / Bộ Tổng Tham mưu (part0010/p000226) / bẫy, sở chỉ huy, bẫy nổ, tinh thần (part0010/p000227, p000228, p000230) / tờ rơi về các chuyến tham quan theo đoàn, Trung úy, con dấu nhập cảnh (part0010/p000231, p000232) / nước Ý, Ethiopia (part0010/p000234) / Quân đội Công quốc, Tiểu đoàn Pháp sư Không quân 203, yểm trợ trên không lẫn ma pháp, công nghệ quân sự hiện đại và cổ đại, Quân đội Đế quốc (part0010/p000235) / nhân viên chỉ huy, người kế nhiệm (part0010/p000237) / tập kích bất ngờ, chiến thuật chiến tranh chớp nhoáng, bộ binh không được yểm trợ, gã Khốn-guchi ở Imphal, huân chương (part0010/p000238) / Thiếu tá (part0010/p000240) / đội bay (part0010/p000242) / quản lý nhân sự (part0010/p000243)"
  alternatives_vi:
  - Thượng úy hoặc Trung úy nhất (thay cho `Trung úy` khi dịch `First Lieutenant` gắn với Weiss tại part0010/p000219 — ưu tiên `Trung úy Weiss` theo `provisional_review_choices.first_lieutenant` đã sửa M4 và signoff, giữ nhất quán với bản đồ cấp bậc tạm xuyên suốt B02–B08 và câu gọi `Trung úy Weiss` ở p000239) / cận chiến (thay cho `giao chiến ở cự ly gần` tại part0010/p000225 — ưu tiên `giao chiến ở cự ly gần` theo `vol02-ch01-b09-close-quarters-battle` để tránh gợi nghĩa đánh giáp lá cà bằng tay không hoặc vũ khí lạnh khi hai bên dùng ma pháp và súng ngắn) / bẫy gài hoặc mìn bẫy (thay cho cặp `bẫy` ở part0010/p000227 và `bẫy nổ` ở part0010/p000230 — ưu tiên giữ `bẫy` / `bẫy nổ` theo `vol02-ch01-b09-booby-trap` đã signoff vì khớp với cơ chế phát nổ được nêu ở p000229 mà không tự suy diễn thành mìn quân dụng) / Tiểu đoàn Pháp sư trên không 203 (thay cho `Tiểu đoàn Pháp sư Không quân 203` tại part0010/p000235 — ưu tiên giữ `Tiểu đoàn Pháp sư Không quân 203` theo `vol02-ch01-b09-aerial-mage` để liền mạch với B06 và B10) / chiến thuật chớp nhoáng hoặc Blitzkrieg (thay cho `chiến thuật chiến tranh chớp nhoáng` tại part0010/p000238 — ưu tiên `chiến thuật chiến tranh chớp nhoáng` theo `vol02-ch01-b09-blitzkrieg-tactics` để giữ rõ học thuyết quân sự) / gã Cứt-guchi ở Imphal, gã Nhảm-guchi ở Imphal hoặc gã ngu ngốc ở Imphal (thay cho `gã Khốn-guchi ở Imphal` tại part0010/p000238 — ưu tiên `gã Khốn-guchi ở Imphal` theo `provisional_review_choices.nickname_p000238` đã sửa M3 và signoff vì giữ nguyên cấu trúc chơi chữ hậu tố `-guchi` cùng địa danh `Imphal` mà không tự mở rộng lore hay thêm chú thích) / phi đội hoặc Hạm đội Không quân (thay cho `đội bay` tại part0010/p000242 — ưu tiên `đội bay` theo `vol02-ch01-b09-air-fleet` vì trung tính và đồng bộ với B10)
