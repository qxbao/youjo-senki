- source_term: tanya_weiss_subordinates_and_dacian_officers_pronouns_and_address_vol02_ch01_b09
  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` kết hợp lặp tên riêng `Tanya` hoặc lược chủ ngữ khi cần phân biệt rõ chủ thể (part0010/p000219, p000221, p000224, p000225, p000226, p000228, p000234, p000235, p000241, p000243), tuyệt đối không dùng `cô` theo DEC-P01-001 và M1 đã signoff; mệnh đề nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya ở cuối p000234 dùng `mình` theo DEC-P01-001 (`mình sẽ chẳng thể ngẩng mặt lên được`); các câu độc thoại nội tâm ngôi thứ nhất số nhiều chỉ tập thể đơn vị / phía Đế quốc dùng `chúng ta` (part0010/p000237, p000238); quy chiếu Trung úy Weiss trong trần thuật và nội tâm đánh giá của Tanya bằng `Trung úy Weiss` (p000219) và `anh ta` / `Gã này` (p000241, p000243); quy chiếu các sĩ quan và binh lính Dacia trong trần thuật và nội tâm bằng `họ` / `hắn` (cho viên sĩ quan cấp cao nhất lao vào Tanya ở p000219) / `chúng` / `bọn chúng` (p000219, p000221, p000224, p000228, p000235, p000237, p000241); trong câu nội tâm in nghiêng của các sĩ quan Dacia ở p000219, họ gọi Tanya là `Con bé này` và tự xưng `chúng ta`; trong đối thoại: khi Tanya hỏi cung và ra lệnh xử lý nhóm sĩ quan Dacia (p000220, p000223), Tanya gọi nhóm sĩ quan bằng giọng lịch sự mỉa mai `Các vị` (tiếp nối B08 p000217) và chỉ viên tướng bất tỉnh là `vị tướng kia`; khi Tanya ra lệnh và trao đổi với thuộc cấp và Trung úy Weiss (p000227, p000229, p000233, p000239, p000242), Tanya dùng `chúng ta`, gọi đích danh `Trung úy Weiss` và dùng đại từ `anh` (p000239); Trung úy Weiss đáp lệnh Tanya bằng `Rõ, Thiếu tá` (p000240); khi một binh sĩ hỏi xin sơn để làm con dấu nhập cảnh ở p000232, gọi `Trung úy`, dùng `anh` và tự xưng `Tôi`"
  alternatives_vi:
  - cô (thay cho `nó` / `Tanya` trong trần thuật và `mình` ở mệnh đề nội tâm cuối p000234 — bác bỏ theo DEC-P01-001 và M1 đã signoff) / lược đại từ `anh` trong câu hỏi `Trung úy, anh có sơn không?` tại part0010/p000232 (vì nguồn chỉ ghi `Lieutenant` không nêu rõ người được hỏi là Weiss hay Serebryakov — giữ nguyên câu hiện tại trong bản dịch đã signoff vì dịch giả đã chọn `Trung úy` khớp với cấp bậc của Weiss, đồng thời ghi nhận độ bất định chủ thể ở p000232)
