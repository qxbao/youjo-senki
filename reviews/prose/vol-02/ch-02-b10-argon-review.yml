- source_term: viper_02_cp_operator_and_northern_army_group_hq_pronouns_vol02_ch02_b10
  proposed_vi: "Trong phân cảnh Tiểu đoàn Viper nhận lệnh rút lui, liên lạc với Sở chỉ huy về viện binh Pixie (part0014/p000221–p000246) và phân cảnh phản ứng tại Sở chỉ huy Cụm tập đoàn quân phương Bắc (part0014/p000247–p000257): tiếp nối B08–B09, trần thuật ngôi thứ ba quy chiếu quyền chỉ huy Tiểu đoàn Viper (Viper 02) bằng `anh` / `Anh` xuyên suốt (p000221, p000226, p000232, p000234, p000238, p000239, p000242, p000244) theo signoff `M1` và mục `vol02-ch02-b10-viper-commander-narration`, quy chiếu tập thể đơn vị hoặc viện binh/bộ phận điều động bằng `họ` / `Họ` theo ngữ cảnh (p000226, p000228, p000229, p000231, p000232, p000235, p000237, p000239, p000241); trong độc thoại nội tâm trực tiếp của Viper 02, tự quy chiếu cá nhân bằng `mình` / `Mình` (p000235, p000237) theo signoff `M3` và mục `vol02-ch02-b08-viper-interior-self-reference`, kết hợp ngôi thứ nhất số nhiều `chúng ta` khi quy chiếu tập thể đơn vị (p000229, p000237); trong liên lạc vô tuyến giữa Viper 02 và Sở chỉ huy (CP): Viper 02 tự xưng `Tôi` và đại diện đơn vị bằng `Chúng tôi` (p000227, p000230) hoặc xưng hô hiệu `Viper 02` (p000236), còn nhân viên trực ban ở Sở chỉ huy gọi tập thể đơn vị là `các anh` (p000228) và gọi cá nhân Viper 02 là `anh` (p000233, theo signoff `M2` và mục `vol02-ch02-b10-cp-address-to-viper02`). Từ p000247–p000257 tại Sở chỉ huy Cụm tập đoàn quân phương Bắc: Phó cục trưởng Tác chiến từ Bộ Tổng tham mưu Trung ương đại diện Trung ương bằng `Chúng tôi` và gọi viện binh là `họ` (p000247); các sĩ quan phương Bắc quy chiếu tập thể mình bằng `chúng ta` / `ta` trong cả độc thoại nội tâm lẫn hội thoại (p000251–p000254, p000256), tự xưng cá nhân trong lời thoại bằng `tôi` và được quy chiếu trong trần thuật ngôi thứ ba bằng `Anh` (p000257), đồng thời quy chiếu Bộ Tổng tham mưu / Trung ương bằng `chúng` khi chửi rủa bực tức (p000248) và bằng `họ` / `Họ` / `Đám người đó` trong các câu trần thuật, nội tâm và đối thoại tiếp theo (p000251–p000254, p000256, p000257)"
  alternatives_vi:
  - cậu (thay cho `anh` khi nhân viên Sở chỉ huy nói với Viper 02 tại part0014/p000233 — ưu tiên `anh` theo signoff `M2` và mục `vol02-ch02-b10-cp-address-to-viper02` để giữ trung tính, đồng bộ với `các anh` ở p000228 và tuân thủ `DEC-P01-001` là không suy diễn quan hệ bề trên hay thân mật khi thiếu ngữ cảnh) / tôi (thay cho `mình` / `Mình` trong độc thoại nội tâm của Viper 02 tại part0014/p000235, p000237 — ưu tiên `mình` / `Mình` theo signoff `M3` và mục `vol02-ch02-b08-viper-interior-self-reference` để thống nhất xuyên suốt nội tâm của Viper 02 từ B08–B10) / nó (thay cho `anh` tại part0014/p000221 — bác bỏ `nó` theo signoff `M1` và `DEC-P01-001` vì `nó` chỉ dành riêng cho trần thuật về Tanya ở giai đoạn đã duyệt, còn chủ thể tại p000221 là người chỉ huy Tiểu đoàn Viper)
