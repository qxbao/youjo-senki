- segment_id: YS-LN02/Text/part0014.xhtml/p000256
  locks:
  - "Giữ đúng phạm vi nhấn mạnh in nghiêng toàn đoạn theo `DEC-P01-002`, các cụm `các kho tiếp tế miền Bắc`, `mạng lưới hậu cần vốn đã tồi tệ của Cụm tập đoàn quân phương Bắc`, các đại từ `họ` / `Họ`, `chúng ta`, và câu hỏi kết đoạn `*Họ có biết mạng lưới hậu cần vốn đã tồi tệ của Cụm tập đoàn quân phương Bắc có thể sụp đổ hoàn toàn không?*`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000257
  locks:
  - "Giữ câu thoại mở đầu `“Đường tiếp tế miền Bắc đang khủng hoảng mà họ còn lớn tiếng thế. Ước gì tôi cũng tự tin được như vậy.”`, đúng phạm vi nhấn mạnh in nghiêng chỉ ở câu thứ hai theo `DEC-P01-002` `*Có thể gọi lời cảnh báo đó là ngạo mạn cũng chẳng sai.*`, đại từ `Anh` trong câu trần thuật tiếp theo, và câu kết `Rồi lại có thêm tin khiến mọi người kinh ngạc hơn nữa.`."
