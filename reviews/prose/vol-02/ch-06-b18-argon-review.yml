    modality_and_logic: "Bảo toàn đủ 6 câu: đúng như dự đoán, dân quân bắn chết một người rồi la hét những lời tục tĩu -> thời nào dân quân thiếu kỷ luật cũng dễ hành xử như vậy -> đó là lý do quân đội chính quy và dân quân là hai thứ khác nhau -> những người đấu tranh vì tự do thì tốt thôi, nhưng tự do không có trật tự sẽ dẫn đến xung đột nội bộ nghiêm trọng, chẳng khác nào một hiểm họa môi trường -> đám này hết thuốc chữa -> chúng có thể tự làm việc đó, vậy mà lại lôi cả những thường dân đang làm ăn lương thiện (hoặc những công dân đang tham gia hoạt động kinh tế lành mạnh) vào cuộc."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000561"
    terms:
      - "Đế quốc"
    pronouns_and_address: "Độc thoại nội tâm của Tanya quy chiếu đám dân quân là `họ`, kèm câu thoại giả định tiếng chửi của địch."
    pov_and_voice: "Giọng suy đoán dửng dưng về lời lẽ kích động của dân quân."
    modality_and_logic: "Bảo toàn đủ 2 câu và câu khẩu hiệu giả định trong ngoặc kép: trong tình cảnh đó có lẽ họ đang hét câu chửi rủa quân Đế quốc -> đại loại thế."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000562"
    terms:
      - "nguyên tắc"
      - "huấn luyện"
      - "tổ chức dân sự thiếu kỷ luật"
    pronouns_and_address: "Độc thoại nội tâm của Tanya quy chiếu những người chưa quen chiến tranh là `Họ` / `họ`."
    pov_and_voice: "Giọng phân tích tâm lý đám đông vũ trang chưa qua rèn luyện quân sự."
    modality_and_logic: "Bảo toàn đủ 3 câu: người chưa quen chiến tranh thường hành xử như vậy -> họ có thể tin vào một nguyên tắc cao đẹp nào đó, nhưng chừng nào chưa được huấn luyện thì vẫn bị cảm xúc chi phối -> vậy nên có lẽ đây là điều tất yếu khi một tổ chức dân sự thiếu kỷ luật được trang bị súng."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000563"
    terms:
      - "quân phục"
      - "huấn luyện"
      - "dân quân"
      - "kinh tế học"
      - "vốn con người"
    pronouns_and_address: "Độc thoại nội tâm khái quát của Tanya không dùng đại từ cá nhân."
    pov_and_voice: "Giọng quy chiếu mọi hiện tượng quân sự về lý thuyết vốn con người của kinh tế học."
    modality_and_logic: "Bảo toàn đủ 2 câu và thuật ngữ `vốn con người` (`P03-human-capital`): cũng như một thành viên hữu ích của xã hội, người lính dù mặc quân phục vẫn vô dụng nếu không được huấn luyện, và rõ ràng chẳng thể trông mong điều đó ở dân quân -> nói cách khác, chuyện này củng cố luận điểm của kinh tế học rằng vốn con người quan trọng đến thế nào."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000564"
    terms:
      - "Sở chỉ huy"
      - "video"
      - "giải cứu"
    pronouns_and_address: "Tanya gọi `Sở chỉ huy` và tự xưng `tôi` qua vô tuyến."
    pov_and_voice: "Giọng báo cáo công vụ khẩn trương, xin phép mở chiến dịch giải cứu ngay lập tức."
    modality_and_logic: "Bảo toàn đủ 2 câu: báo đang gửi video cho Sở chỉ huy -> xin phép lập tức bắt đầu giải cứu."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000565"
    terms:
      - "nghĩa vụ cảnh báo"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `chúng ta` cho đơn vị/phe mình."
    pov_and_voice: "Giọng nắm bắt thời cơ nhanh nhạy sau khi hoàn tất thủ tục pháp lý."
    modality_and_logic: "Bảo toàn đủ 2 câu: đồng thời đây cũng là cơ hội lớn -> trên danh nghĩa, chúng ta đã hoàn thành nghĩa vụ cảnh báo."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000566"
    terms:
      - "cuộc tiêu diệt"
      - "vị thế chính trị"
      - "miễn trách nhiệm"
    pronouns_and_address: "Độc thoại nội tâm của Tanya tự xưng `mình` nhất quán theo `DEC-P01-001`."
    pov_and_voice: "Giọng tính toán đường lui chính trị để né tránh phần việc bẩn tay."
    modality_and_logic: "Bảo toàn đủ 2 câu: giờ chỉ còn tham gia cuộc tiêu diệt, nhưng nếu có thể thì mình muốn tránh việc ấy vì nghĩ đến vị thế chính trị của mình sau này -> lý do rất đơn giản, ai cũng sẽ miễn trách nhiệm cho mình."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000567"
    terms:
      - "đồng bào"
    pronouns_and_address: "Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`."
    pov_and_voice: "Giọng hồ hởi thực dụng khi tìm được lá chắn chính nghĩa hoàn hảo."
    modality_and_logic: "Bảo toàn đủ 2 câu theo `B18-F01`: khẳng định đây là cơ hội hoàn hảo (`Đây là cơ hội hoàn hảo.`) -> nêu rõ ngay trước mắt mình là một lý do chính đáng tuyệt vời: bảo vệ đồng bào."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000568"
    terms:
      - "thường dân"
      - "công dân Đế quốc"
      - "giai đoạn tiêu diệt toàn bộ"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng câu hỏi tu từ khái quát."
    pov_and_voice: "Giọng lập luận sắc bén về lợi ích chính trị của hành động giải cứu con tin."
    modality_and_logic: "Bảo toàn đủ 3 câu: câu hỏi tu từ quân đội nào có thể trách một người lính vì cứu thường dân của chính phe mình -> ít nhất, cứu các công dân/thần dân Đế quốc bị bắt là một hành động trong sạch về mặt chính trị -> có thể việc ấy không có nhiều ý nghĩa xét về quân sự, nhưng giờ chỉ còn giai đoạn tiêu diệt toàn bộ."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000569"
    terms:
      - "hành vi chính trị"
      - "đồng bào"
      - "tấm bùa miễn tội"
    pronouns_and_address: "Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`."
    pov_and_voice: "Giọng toan tính dùng nhiệm vụ giải cứu làm bằng chứng ngoại phạm trước lịch sử."
    modality_and_logic: "Bảo toàn đủ 2 câu: vậy đây là giai đoạn mà hành vi chính trị trở nên quan trọng -> việc mình không trực tiếp tham chiến mà tham gia giải cứu đồng bào hẳn sẽ là tấm bùa miễn tội."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000570"
    terms: []
    pronouns_and_address: "Câu kết luận nội tâm ngắn gọn của Tanya."
    pov_and_voice: "Giọng chốt lại mức bảo đảm tối thiểu của phương án tự vệ pháp lý."
    modality_and_logic: "Bảo toàn tình thái dự đoán (`Ít nhất thì đó cũng hẳn là một lý do để biện minh.`)."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000571"
    terms:
      - "Sở chỉ huy"
    pronouns_and_address: "Thông điệp vô tuyến từ `Sở chỉ huy` phê chuẩn đề xuất của Tanya."
    pov_and_voice: "Giọng quân lệnh ngắn gọn, chuẩn y ngay lập tức."
    modality_and_logic: "Bảo toàn đủ 2 câu ngắn (`“Sở chỉ huy, rõ. Cứ tiến hành.”`)."
    emphasis: "none"

