findings:
  - id: "B18-F01"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000567"
    category: "omission_and_completeness"
    issue: "Tại `p000567`, bản dịch mới chỉ chuyển ngữ câu thứ hai (`Ngay trước mắt mình là một lý do chính đáng tuyệt vời: bảo vệ đồng bào.`) và bỏ sót hoàn toàn câu đầu tiên của đoạn khẳng định đây là cơ hội hoàn hảo."
    basis: "Đoạn `p000567` trong nguyên tác gồm hai câu độc lập: câu đầu nối tiếp mạch tính toán ở `p000565`–`p000566` để khẳng định đây là cơ hội hoàn hảo, còn câu sau mới nêu cụ thể chính nghĩa bảo vệ đồng bào đang ở ngay trước mắt. Theo `canon/style-guide.md`, bản dịch không được lược bỏ câu hay chi tiết của nguồn."
    recommendation: "Khôi phục đầy đủ câu mở đầu của `p000567`, chẳng hạn: `Đây là cơ hội hoàn hảo. Ngay trước mắt mình là một lý do chính đáng tuyệt vời: bảo vệ đồng bào.`"
    resolution: "pending_revision"

  - id: "B18-F02"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000554"
    category: "pronoun_consistency_in_dialogue"
    issue: "Tại `p000554`, thông điệp cảnh báo chính thức phát cho lực lượng nổi dậy trong thành phố dùng đại từ ngôi thứ nhất bao gộp `Chúng ta` ở câu thứ hai (`Chúng ta không thể để các người tiếp tục tàn sát.`), nhưng ngay câu thứ ba lại đổi sang đại từ loại trừ `Chúng tôi` (`Chúng tôi yêu cầu thả các công dân Đế quốc...`)."
    basis: "Cả hai câu đều là lời tuyên bố của phía Quân đội Đế quốc đối lập trực tiếp với đối phương (`các người`). Việc dùng `Chúng ta` (bao gồm cả người nghe) ở câu 2 gây lệch ngôi xưng hô và thiếu nhất quán với `Chúng tôi` ở câu 3."
    recommendation: "Đổi `Chúng ta` ở câu thứ hai của `p000554` thành `Chúng tôi`: `“Lập tức thả những người dân thường không thuộc phe nào. Chúng tôi không thể để các người tiếp tục tàn sát. Chúng tôi yêu cầu thả các công dân Đế quốc theo Điều 26, Khoản 3 của Quy tắc Chiến tranh trên bộ.”`"
    resolution: "pending_revision"

  - id: "B18-F03"
    severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000560"
    category: "register_and_terminology_nuance"
    issue: "Tại câu cuối của `p000560`, cụm từ mang màu sắc thuật ngữ kinh tế học đặc trưng trong độc thoại của Tanya (`citizens engaged in wholesome economic activity`) được dịch thoát ý theo lối khẩu ngữ là `những thường dân đang làm ăn lương thiện`."
    basis: "Nghĩa cốt lõi vẫn bảo đảm, nhưng trong mạch `p000560`–`p000563`, Tanya đang nhìn nhận chiến trường bằng lăng kính kinh tế học (`environmental hazard`, `economic theory`, `human capital`), nên giữ sắc thái thuật ngữ kinh tế sẽ làm nổi bật giọng nhân vật hơn."
    recommendation: "Ở bước chỉnh sửa hoặc polish có thể cân nhắc đổi thành `những công dân đang tham gia hoạt động kinh tế lành mạnh` (hoặc giữ nguyên nếu ưu tiên nhịp khẩu ngữ)."
    resolution: "optional_polish"

  - id: "B18-F04"
    severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000580"
    category: "lexical_nuance"
    issue: "Tại `p000580`, cảm giác kích ứng khứu giác trong mũi của Grantz trước mùi thịt người cháy (`strange tingle in his nose`) được dịch là `cảm giác nhột lạ trong mũi`, nghe thiên về xúc giác cơ học hơn là sự cay rát/ngứa râm ran do mùi khét và khí độc gây ra; ngoài ra ở `p000583`, cụm `quan tâm đến người phía mình hơn kẻ địch` có thể làm rõ hơn sắc thái ưu tiên nhiệm vụ giải cứu đồng đội so với việc tiêu diệt địch."
    basis: "Ngay câu sau của `p000580` giải thích rõ nguyên nhân là mùi hôi khét đang kích ứng mũi (`một mùi hôi đang kích ứng nơi ấy`), và câu cuối `p000583` giải thích rằng Tanya chỉ đang quyết định theo thứ tự ưu tiên nhiệm vụ."
    recommendation: "Ở bước chỉnh sửa hoặc polish có thể đổi `cảm giác nhột lạ trong mũi` ở `p000580` thành `cảm giác cay rát kỳ lạ trong mũi` (hoặc `cảm giác ngứa râm ran kỳ lạ trong mũi`), và ở `p000583` có thể diễn đạt là `ưu tiên người phe mình hơn việc đánh địch` / `bận tâm đến người phía mình hơn kẻ địch`."
    resolution: "optional_polish"

