    pronouns_and_address: "Tanya dùng mã hiệu `Pixie 01` và tự xưng `Tôi` khi đáp lại Sở chỉ huy."
    pov_and_voice: "Giọng nhận lệnh dứt khoát qua vô tuyến."
    modality_and_logic: "Bảo toàn đủ 2 câu ngắn (`“Pixie 01, rõ. Tôi sẽ lập tức tiến hành.”`)."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000573"
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya tự xưng `mình` theo `DEC-P01-001`."
    pov_and_voice: "Giọng mỉa mai thực dụng khi bẻ câu cách ngôn hướng thiện thành lợi ích vị kỷ."
    modality_and_logic: "Bảo toàn đủ 4 câu: được rồi, cứu người thôi -> làm một việc tốt nào -> vì chính mình -> khen người nói câu châm ngôn quả là biết cách dùng từ."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh câu châm ngôn `*Điều tốt mình làm cho người khác rồi sẽ quay lại với mình*` tương ứng thẻ `<html:em>`."

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000574"
    terms:
      - "Grantz"
      - "Visha"
      - "cuộc thảm sát"
      - "màn truy quét"
    pronouns_and_address: "Trần thuật ngôi thứ ba sau ngắt cảnh (`space-break`), quy chiếu `Visha` bằng đại từ `cô`."
    pov_and_voice: "Giọng trần thuật đối chiếu phản ứng tâm lý của hai thuộc cấp trước cảnh tàn phá thành phố."
    modality_and_logic: "Bảo toàn đủ 3 câu và ý tự hiệu chỉnh ở câu 2: với Grantz và Visha, đó là một cuộc thảm sát được tô vẽ thành màn truy quét -> không, Visha đón nhận chuyện ấy khá hơn một chút vì cô đã có kinh nghiệm -> ít ra cô cũng hiểu mối nguy khi chần chừ trên chiến trường."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000575"
    terms:
      - "Grantz"
      - "luyện ngục"
      - "địa ngục"
    pronouns_and_address: "Trần thuật ngôi thứ ba gắn với điểm nhìn của `Grantz`."
    pov_and_voice: "Giọng trần thuật khắc họa cú sốc tinh thần nặng nề của người lính trẻ."
    modality_and_logic: "Bảo toàn hai hình ảnh tăng tiến: với Grantz, nơi ấy chẳng khác nào luyện ngục, hay có lẽ đơn giản là địa ngục."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000576"
    terms:
      - "Sở chỉ huy"
      - "truy quét"
      - "Quân đội Cộng hòa"
    pronouns_and_address: "Mệnh lệnh vô tuyến từ `Sở chỉ huy` phát cho toàn bộ các đơn vị tham chiến."
    pov_and_voice: "Giọng mệnh lệnh hành quân lạnh lùng, vô cảm."
    modality_and_logic: "Bảo toàn đủ 3 câu mệnh lệnh: Sở chỉ huy gọi tất cả các đơn vị tham chiến -> chuyển sang truy quét -> xóa sổ Quân đội Cộng hòa."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000577"
    terms:
      - "sở chỉ huy"
      - "vô tuyến"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Grantz bằng đại từ `anh`."
    pov_and_voice: "Giọng miêu tả cảm giác bàng hoàng, tê liệt giác quan của Grantz giữa biển lửa."
    modality_and_logic: "Bảo toàn đủ 4 câu: những ngọn lửa đỏ tô điểm cho thế giới đen xám -> rồi anh chỉ còn thấy ánh chớp nhạt nhòa -> ý thức lơ mơ ghi nhận âm thanh mệnh lệnh từ sở chỉ huy truyền khắp chiến trường -> giọng nói đều đều qua vô tuyến khiến anh sửng sốt vì nghe thật phi thực."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000578"
    terms:
      - "mệnh lệnh"
      - "Grantz"
    pronouns_and_address: "Trần thuật ngôi thứ ba bám sát dòng ý thức của `Grantz`."
    pov_and_voice: "Giọng tự bấu víu vào khái niệm mệnh lệnh để giải thích sự hiện diện của bản thân."
    modality_and_logic: "Bảo toàn đủ 3 câu và nhịp điệp từ `mệnh lệnh`: nhưng điều cốt yếu là mệnh lệnh -> đúng vậy, mệnh lệnh -> Grantz, với tư cách một cá nhân, có mặt ở nơi này theo lệnh."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000579"
    terms: []
    pronouns_and_address: "Độc thoại nội tâm trực tiếp của Grantz tự xưng `Mình` / `mình`."
    pov_and_voice: "Giọng tự thú day dứt khi nhận ra đối tượng bị bắn hạ là một con người bằng xương bằng thịt."
    modality_and_logic: "Bảo toàn đủ 2 câu và sự chuyển nhận thức từ `kẻ địch` sang `một con người`."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ đoạn độc thoại nội tâm tương ứng thẻ `<html:em>`."

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000580"
    terms:
      - "protein"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Grantz bằng đại từ `Anh`."
    pov_and_voice: "Giọng tả thực ám ảnh về mùi tử khí và thịt người cháy trên chiến trường."
    modality_and_logic: "Bảo toàn đủ 5 câu: anh nhận ra cảm giác kích ứng/nhột lạ trong mũi đã bắt đầu từ lúc nào đó -> dù đã quen với mùi chiến trường, một mùi hôi đang kích ứng nơi ấy -> đó là mùi thịt người cháy -> một xác chết vừa bị thiêu cháy thành than, mùi khét chưa bị mùi thối rữa che lấp -> không khí quánh dính vì protein, hôi thối khủng khiếp."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000581"
    terms:
      - "axit"
      - "Thiếu úy Grantz"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu `Thiếu úy Grantz` bằng đại từ `Anh` / `anh` và phản thân `mình`."
    pov_and_voice: "Giọng ghi nhận nỗ lực kìm nén cơn buồn nôn và giữ sự tỉnh táo của người sĩ quan trẻ."
    modality_and_logic: "Bảo toàn đủ 3 câu: anh chắc mình đã nôn hết những gì có thể nôn nhưng vẫn dốc sức ngăn dịch axit trào ra miệng -> có lẽ anh đang dần quen với chiến đấu thực sự -> việc Thiếu úy Grantz còn đủ khả năng cố hiểu tình hình cho thấy anh vẫn giữ được chút bình tĩnh."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000582"
    terms:
      - "Lời cảnh báo đầu hàng"
      - "thường dân"
      - "dân quân"
      - "người không tham chiến"
      - "Đế quốc"
    pronouns_and_address: "Trần thuật ngôi thứ ba đan xen nhận định nội tâm của Grantz."
    pov_and_voice: "Giọng nhận thức cay đắng về bản chất thủ tục của lời cảnh báo trước cuộc tấn công tàn khốc."
    modality_and_logic: "Bảo toàn đủ 3 câu: lời cảnh báo đầu hàng và nỗ lực tách thường dân khỏi dân quân mới diễn ra cách đây không lâu -> câu nhận định nội tâm in nghiêng rằng về mặt thủ tục có lẽ đó là một bước để có thể coi thường dân là dân quân -> ngay khi không còn cần phân loại thường dân là người không tham chiến, Đế quốc đã bắt đầu tấn công thành phố không chút khoan nhượng."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu thứ hai (`*Xét về mặt thủ tục, có lẽ đó là một bước để có thể coi thường dân là dân quân.*`) tương ứng thẻ `<html:em>`."

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000583"
    terms:
      - "Lục quân Đế quốc"
      - "Thiếu tá von Degurechaff"
    pronouns_and_address: "Trần thuật ngôi thứ ba theo điểm nhìn của Grantz (`anh`), quy chiếu cấp trên `Thiếu tá von Degurechaff` bằng đại từ `cô` (khớp `pending-terms-index.yml`)."
