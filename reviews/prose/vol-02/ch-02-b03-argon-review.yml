  proposed_vi: "Nghị viên Abensoll, Nghị viên Ngoại giao Abensoll, Abensoll, một nghị viên (part0014/p000044, p000046, p000059, p000061, p000062) / Cộng hòa, Khối Thịnh vượng chung, các cường quốc, cường quốc trung lập (part0014/p000045–p000047, p000049, p000051, p000052, p000057, p000059, p000064, p000067) / Liên minh Entente, ban lãnh đạo Liên minh Entente, Đế quốc, lực lượng hải quân, thế cân bằng quyền lực, realpolitik (part0014/p000047, p000049, p000052, p000054, p000056, p000057, p000059, p000061, p000064) / Hiệp ước Londinium (part0014/p000048) / Chiến tranh Dacia, Dacia, các vùng hậu phương, hậu phương (part0014/p000051, p000055, p000071) / Nghị viên Nội vụ (part0014/p000053) / tập đoàn quân, tiền tuyến (part0014/p000054) / các đơn vị pháp sư, lữ đoàn kỵ binh Đế quốc, chiến dịch đổ bộ đường không, pháp sư không quân, Sư đoàn phản ứng nhanh của Liên minh Entente, các pháp sư (part0014/p000055, p000056) / cuộc tấn công hải quân của Đế quốc, đổ bộ từ biển, cuộc đổ bộ đường biển, lực lượng đổ bộ đường biển (part0014/p000057–p000060) / Hải quân Cộng hòa, thiết giáp hạm, hải quân Đế quốc, hạm đội Cộng hòa (part0014/p000062, p000064) / Tiểu đoàn trưởng, tiểu đoàn trưởng, chỉ huy Đại đội Hai, Trung úy Weiss, Tanya (part0014/p000068, p000069, p000071) / Tiểu đoàn Pháp sư Không quân số 203, lệnh điều chuyển, Norden (part0014/p000070) / Trung tá von Lergen, huấn luyện phối hợp, huấn luyện cơ bản, tân binh, cuộc diễn tập tác chiến (part0014/p000071)"
  alternatives_vi:
  - Ủy viên Hội đồng / Ủy viên Ngoại giao Abensoll / Ủy viên Nội vụ (thay cho `Nghị viên` / `Nghị viên Ngoại giao Abensoll` / `Nghị viên Nội vụ` tại part0014/p000044, p000046, p000053, p000059, p000062 — ưu tiên `Nghị viên` theo đúng lựa chọn tạm đã khóa từ B02 và đã được translator áp dụng đồng bộ tại `handoffs/vol-02/ch-02-b03.yml` để đảm bảo tính nhất quán tuyệt đối cho nhân vật Abensoll và hội đồng Liên minh Entente xuyên suốt chương) / cụm tập đoàn quân (thay cho `tập đoàn quân` tại part0014/p000054 — giữ `tập đoàn quân` trong bản dịch hiện tại vì vẫn truyền đạt rõ quy mô đại đơn vị chiến lược của Đế quốc áp đảo nguồn lực Liên minh Entente, đồng thời ghi nhận phương án `cụm tập đoàn quân` trong sổ pending) / chiến hạm chủ lực (thay cho `thiết giáp hạm` tại part0014/p000062 — giữ `thiết giáp hạm` trong câu thoại hiện tại vì tự nhiên, tạo sức nặng cụ thể khi nhấn mạnh sự ít ỏi chỉ có hai tàu lớn của hải quân Liên minh Entente)
