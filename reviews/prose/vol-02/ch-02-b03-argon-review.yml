  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, nhân vật, cấp bậc và thuật ngữ quân sự – ngoại giao đã khóa tạm từ Tập 1, Chương 1 Tập 2 và B01–B02 Chương 2 Tập 2 (`Nghị viên Abensoll` / `Nghị viên Ngoại giao Abensoll` / `Nghị viên Nội vụ`, `Liên minh Entente`, `Cộng hòa`, `Khối Thịnh vượng chung`, `Đế quốc`, `Dacia`, `Norden`, `Tiểu đoàn Pháp sư Không quân số 203`, `Tiểu đoàn trưởng`, `chỉ huy Đại đội Hai`, `Trung úy Weiss`, `Trung tá von Lergen`, `Tanya`), đồng thời khóa tạm các thuật ngữ ngoại giao và tác chiến xuất hiện trong cuộc họp hội đồng Liên minh Entente và buổi tập hợp Tiểu đoàn 203 (`Hiệp ước Londinium`, `thế cân bằng quyền lực`, `realpolitik`, `Chiến tranh Dacia`, `lữ đoàn kỵ binh Đế quốc`, `chiến dịch đổ bộ đường không`, `Sư đoàn phản ứng nhanh của Liên minh Entente`, `cuộc đổ bộ đường biển` / `lực lượng đổ bộ đường biển`, `Hải quân Cộng hòa` / `hạm đội Cộng hòa`, `thiết giáp hạm`, `huấn luyện phối hợp`, `huấn luyện cơ bản`, `cuộc diễn tập tác chiến`)."
  uncertainty: low
  status: pending
