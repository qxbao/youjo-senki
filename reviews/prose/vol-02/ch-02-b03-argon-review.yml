- source_term: entente_council_deliberation_and_tanya_203rd_auditorium_pronouns_vol02_ch02_b03
  proposed_vi: "Trong phân cảnh họp hội đồng của Liên minh Entente (part0014/p000044–p000067): tiếp nối B02, trần thuật ngôi thứ ba quy chiếu Nghị viên Ngoại giao Abensoll bằng `ông` xuyên suốt (p000046, p000063) và định danh bằng `Nghị viên Ngoại giao Abensoll` / `Abensoll` (p000046, p000059, p000061); quy chiếu các cường quốc, Khối Thịnh vượng chung, Cộng hòa, Liên minh Entente, các đơn vị pháp sư và giới lãnh đạo Liên minh Entente bằng `họ` / `Họ` kết hợp phản thân `mình` (p000045–p000047, p000049, p000051, p000052, p000055–p000057, p000059), và quy chiếu quân xâm lược Đế quốc giả định trong lời thoại bằng `chúng` (p000058). Trong đối thoại tại phòng họp hội đồng: các nghị viên tự xưng `Tôi` / `tôi` (p000053, p000058), dùng đại từ bao gộp `chúng ta` / `Chúng ta` cho phía Liên minh Entente (p000045, p000048, p000050, p000051, p000053, p000055, p000058, p000060, p000062, p000066, p000067), gọi Abensoll bằng chức danh `Nghị viên Abensoll` kết hợp đại từ `ông` (p000044, p000062), và Abensoll gọi chung các nghị viên trong phòng là `Thưa các vị` (p000066); trong lời cảnh báo của các sĩ quan Khối Thịnh vượng chung được dẫn lại ở p000059, người nói tự xưng `Tôi` và gọi phía Liên minh Entente là `các vị`. Trong phân cảnh tại khán phòng của Tiểu đoàn Pháp sư Không quân số 203 (part0014/p000068–p000071): tuân thủ nghiêm ngặt `DEC-P01-001` và quyết định tạm `P01-tanya-narration-ch01`, trần thuật ngôi thứ ba ở p000069 định danh Tanya bằng `tiểu đoàn trưởng` và lặp tên riêng `Tanya` kèm đại từ phản thân `mình` (tránh dùng `cô`); trong lời thông báo trước toàn tiểu đoàn ở p000070, Tanya gọi thuộc cấp là `mọi người` và dùng `Chúng ta` cho toàn đơn vị; trong độc thoại nội tâm trực tiếp ở p000071, Tanya tự quy chiếu ngôi thứ nhất bằng `mình` xuyên suốt và tự nhắc đến bản thân ở ngôi thứ ba bằng tên riêng `Tanya` (`gương mặt Tanya`, `bắt Tanya làm việc quá sức`)"
  alternatives_vi:
  - cô (thay cho việc lặp tên riêng `Tanya` trong câu trần thuật tại part0014/p000069 — bắt buộc tránh `cô` theo quyết định đã duyệt `DEC-P01-001` và quy ước `P01-tanya-narration-ch01`; việc lặp tên `Tanya` ở p000069 vừa tuân thủ canon vừa giúp phân biệt rõ chủ thể với `Trung úy Weiss` và `Các binh sĩ` trong cùng đoạn) / ngài (thay cho `ông` khi nghị viên khác nhắc Nghị viên Abensoll tại part0014/p000062 — giữ `ông` đi kèm danh xưng `Nghị viên Abensoll` vì tự nhiên, thể hiện đúng giọng chất vấn căng thẳng và thực tế giữa các đồng nghiệp ngang cấp trong hội đồng)
