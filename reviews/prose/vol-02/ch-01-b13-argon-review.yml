  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, đơn vị, cấp bậc, tôn giáo và thuật ngữ quân sự – ma pháp đã khóa tạm từ Tập 1 cùng B01–B12 của Tập 2 (`Rudersdorf`, `Zettour`, `Tanya`, `Visha`, `Weiss`, `Thiếu tá`, `thiếu tá von Degurechaff`, `Tiểu đoàn Pháp sư Không quân 203`, `Type 95`, `Chúa`, `Being X`, `luật pháp quốc tế`, `quả cầu`, `thuật thức`, `ma lực`, `phe Cộng hòa`, `thủ đô Dacia`), đồng thời khóa tạm các thuật ngữ tác chiến hỏa lực tầm xa, mục tiêu công nghiệp và biến âm phát thanh trong B13 (`chân chọng`, `mọi nười`, `thuật thức phóng chiếu tầm xa`, `thuật thức tấn công tầm xa`, `thuật thức nổ tầm xa`, `quan sát viên`, `Nhà máy Vũ khí Carberius`, `pháo chống ma pháp`, `tiểu đoàn pháp sư tăng cường gồm bốn mươi tám người`, `những vụ nổ thứ cấp`, `Tamayaaa!`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_visha_weiss_battalion_bombardment_pronouns_and_address_vol02_ch01_b13
  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` kết hợp tên riêng `Tanya` / `thiếu tá von Degurechaff` / `cấp trên` / `Chỉ huy của họ` xuyên suốt (part0010/p000328, p000331, p000332, p000334, p000337, p000338, p000341–p000343, p000346, p000348, p000350, p000363, p000364), tuyệt đối không dùng `cô` cho Tanya theo DEC-P01-001 và M2 đã sửa trong signoff; trong độc thoại nội tâm ngôi thứ nhất số ít (part0010/p000331, p000345), Tanya tự quy chiếu bằng `mình` / `Mình` theo DEC-P01-001; ở mệnh đề trần thuật/nội tâm gộp toàn đơn vị (part0010/p000334, p000359) dùng `chúng tôi`; quy chiếu Visha trong trần thuật và suy nghĩ nội tâm bằng `Visha` / `cô` (part0010/p000332, p000333), trong đó câu suy nghĩ nội tâm của Visha gọi Tanya bằng cấp bậc `*Thấp kém quá đấy, Thiếu tá.*` (p000333); quy chiếu Trung úy Weiss trong trần thuật ngôi thứ ba bằng `Weiss` / `anh` theo căn cứ giới nam tại p000337 (part0010/p000337, p000338, p000364); quy chiếu tập thể binh sĩ Tiểu đoàn 203 bằng `họ` (part0010/p000340, p000341, p000350, p000365) và phía địch bằng `họ` / `chúng` (part0010/p000336, p000345, p000347); trong lời thông báo phát thanh giả giọng trẻ con (part0010/p000327, p000330), dùng `chúng ta` ở p000327 và `Chúng tôi` ở p000330; trong đối thoại và mệnh lệnh tác chiến (part0010/p000335, p000336, p000339, p000344, p000347, p000349, p000351–p000353, p000363): Weiss gọi Tanya bằng cấp bậc `Thiếu tá` ở cả vị trí hô gọi lẫn chủ ngữ câu hỏi (`“Thiếu tá, Thiếu tá đã từng diễn xuất chưa?”`, p000335) theo M5 đã sửa trong signoff, không dùng đại từ giới tính `chị`; Tanya tự xưng `Tôi` / `tôi` và dùng đại từ phản thân `mình` (p000336, p000339, p000344, p000363), gọi Weiss là `cậu` (p000336), gọi toàn đơn vị là `các binh sĩ` / `chúng ta` (p000339, p000344), và chuyển sang tự xưng `Ta` mang sắc thái trang nghiêm giả tạo khi hô khẩu hiệu tôn giáo thi triển đại thuật thức (`“Ta sẽ khiến quyền năng của Chúa hiển hiện trên mặt đất này!”`, p000349)"
  alternatives_vi:
  - cô (thay cho `nó` khi trần thuật về Tanya tại part0010/p000331, p000332, p000337, p000338, p000342, p000343, p000346, p000348, p000364 — bác bỏ theo DEC-P01-001 và M2 đã sửa trong signoff vì gây lệch chuẩn đại từ trần thuật của Tanya và làm nhập nhằng với `cô` chỉ Visha ở p000332–p000333) / chị (thay cho `Thiếu tá` trong câu hỏi của Weiss tại part0010/p000335 — bác bỏ theo DEC-P01-001 và M5 đã sửa trong signoff vì gán quan hệ thân tộc/giới tính không có căn cứ trong nguồn)
