  proposed_vi: "diễn tập (part0010/p000327) / Rudersdorf, Zettour, Tanya (part0010/p000328, p000331, p000334, p000337, p000342, p000363) / chân chọng, mọi nười, luật pháp quốc tế (part0010/p000330) / Type 95, Chúa, Being X (part0010/p000331, p000347, p000349) / Visha, tiểu đoàn (part0010/p000332) / Thiếu tá (part0010/p000333, p000335) / Weiss, nitroglycerin (part0010/p000337, p000338, p000364) / thiếu tá von Degurechaff (part0010/p000338, p000346, p000353) / quả cầu, súng trường (part0010/p000341) / nhà máy sản xuất đạn dược, phe Cộng hòa, Tiểu đoàn Pháp sư Không quân 203 (part0010/p000342) / thuật thức, thuật thức phóng chiếu tầm xa, thuật thức tấn công tầm xa, thuật thức nổ tầm xa, thuật thức tầm xa (part0010/p000346, p000351, p000352, p000354, p000355, p000357, p000359, p000361, p000363) / quan sát viên (part0010/p000351) / Nhà máy Vũ khí Carberius (part0010/p000352) / đại đội (part0010/p000353) / pháo chống ma pháp, pháp sư địch tuần tra (part0010/p000355) / tiểu đoàn pháp sư tăng cường gồm bốn mươi tám người, ma lực (part0010/p000359) / đạn dược (part0010/p000361) / thủ đô Dacia (part0010/p000366) / những vụ nổ thứ cấp (part0010/p000367) / Tamayaaa! (part0010/p000369)"
  alternatives_vi:
  - công thức / công thức phóng chiếu (thay cho `thuật thức` và `thuật thức phóng chiếu tầm xa` tại part0010/p000346, p000351, p000352, p000354, p000355, p000357, p000359, p000361, p000363 — bác bỏ `công thức`, ưu tiên giữ `thuật thức` và `thuật thức phóng chiếu tầm xa` theo `provisional_review_choices.formula` đã sửa và signoff trong `handoffs/vol-02/ch-01-b13.yml` để đồng bộ tuyệt đối với Tập 1 và B05–B12 của Tập 2) / người quan sát (thay cho `quan sát viên` tại part0010/p000351 — bác bỏ `người quan sát`, ưu tiên giữ `quan sát viên` theo M4 đã sửa trong signoff để khớp hệ thuật ngữ quân sự với `quan sát viên pháo binh` mà không tự suy diễn thành `pháp sư quan sát`) / Xưởng đúc vũ khí Carberius (thay cho `Nhà máy Vũ khí Carberius` tại part0010/p000352 — ưu tiên giữ `Nhà máy Vũ khí Carberius` để đồng bộ với cách gọi cùng mục tiêu là `nhà máy vũ khí` ở B12 và `nhà máy sản xuất đạn dược` ở p000342) / phát âm chuẩn không biến âm (thay cho `chân chọng` và `mọi nười` tại part0010/p000330 — bác bỏ theo style guide và `provisional_review_choices.childish_pronunciation` đã signoff nhằm bảo toàn chi tiết nói ngọng trẻ con ở hai từ chính tương ứng với nguồn)
