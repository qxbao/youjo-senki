    pov_and_voice: "Giọng độc thoại nội tâm gay gắt, cho rằng sự cuồng chiến thắng của họ đã vượt ngưỡng tỉnh táo."
    modality_and_logic: "Bảo toàn đủ 2 câu: ý định giành chiến thắng bằng mọi giá kể cả phát điên -> mệnh đề nhượng bộ tuy là binh lính nhưng họ đúng là phát rồ."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ 2 câu tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000338
    terms: []
    pronouns_and_address: "Lời thoại dùng đại từ phủ định phiếm chỉ `Đừng ai`."
    pov_and_voice: "Giọng buông tiếng thở dài ngao ngán cho số phận nhà binh."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu `…` và câu khuyên phủ định (`“…Đừng ai làm lính cả.”`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000339
    terms: []
    pronouns_and_address: "Lời đáp dùng `Cậu` (hoặc `Cô`) và đại từ bất định `ai` kèm phản thân `mình`."
    pov_and_voice: "Giọng đồng cảm trầm đục của người lính già trước thực tế đời người."
    modality_and_logic: "Bảo toàn sự tán đồng ở câu đầu và câu phủ định bộ phận ở câu sau (`Nhưng đâu phải ai cũng được sống cuộc đời mình mong muốn`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000340
    terms:
      - "Thiếu tá Pháp sư von Degurechaff"
    pronouns_and_address: "Độc thoại nội tâm hướng trực tiếp tới Tanya bằng quân hàm đầy đủ `Thiếu tá Pháp sư von Degurechaff`."
    pov_and_voice: "Giọng xác nhận thầm trong đầu vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn câu khẳng định ngắn gắn với danh xưng."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ câu tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000341
    terms:
      - "Mặt trận Rhine"
    pronouns_and_address: "Nội tâm vị tư lệnh hướng trực tiếp tới Tanya bằng đại từ ngôi thứ hai `cô`."
    pov_and_voice: "Giọng đánh giá lạnh người khép lại góc nhìn của vị tư lệnh quân đoàn trước khi chuyển cảnh."
    modality_and_logic: "Bảo toàn cả hai mức tình thái suy đoán (`có lẽ`, `Có lẽ`), phép so sánh không ai hợp làm lính hơn cô, và hình ảnh cảm thấy quen thuộc như ở nhà giữa địa ngục nơi Mặt trận Rhine."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ 2 câu tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000342
    terms:
      - "hầm trú quân"
      - "tuyến trước cùng"
      - "hầm chỉ huy"
      - "mệnh lệnh ưu tiên cao nhất"
      - "pháp sư địch"
      - "hậu phương"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: sau ngắt cảnh `space-break1`, độc thoại nội tâm ngôi thứ nhất của Tanya tự quy chiếu nhất quán bằng `Mình` / `mình`."
    pov_and_voice: "Giọng tự sự nội tâm thực dụng, tỉnh táo của Tanya khi điểm lại diễn biến nhận lệnh."
    modality_and_logic: "Bảo toàn sự tương phản giữa thắc mắc ban đầu (được triệu tập khỏi hầm trú quân chờ lệnh ở tuyến trước cùng về hầm chỉ huy an toàn ở phía sau theo mệnh lệnh ưu tiên cao nhất) với nhiệm vụ thực tế vừa nhận (tiêu diệt pháp sư địch xâm nhập địa điểm trọng yếu ở hậu phương), cùng nhận xét đánh pháp sư địch vốn là nhiệm vụ hết sức bình thường."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000343
    terms:
      - "“chiến trường”"
      - "Arene"
      - "mạng lưới vận tải đường sắt"
      - "Đế quốc"
      - "cấp trên"
    pronouns_and_address: "Nội tâm Tanya dùng `chúng ta` cho lực lượng thực thi mệnh lệnh và `mình` khi nói về chuỗi cấp trên (`cấp trên của cấp trên của cấp trên mình`)."
    pov_and_voice: "Giọng phân tích nhiệm vụ rành mạch của Tanya."
    modality_and_logic: "Bảo toàn đủ 4 câu: điểm khác biệt là “chiến trường” trong ngoặc kép sẽ là một thành phố -> nhấn mạnh vị trí của Arene là nút giao trọng yếu trong mạng lưới vận tải đường sắt của Đế quốc -> yêu cầu phải hành động mau lẹ kèm dấu chấm lửng -> nội dung chỉ thị từ ba tầng cấp trên."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh mệnh đề chỉ thị `*Tiêu diệt kẻ địch bằng mọi cách cần thiết*` tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000344
    terms:
      - "Mùa xuân Praha"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: chuyển sang câu trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` kèm phản thân `mình`."
    pov_and_voice: "Giọng trần thuật bám sát lăng kính lịch sử kiếp trước của Tanya."
    modality_and_logic: "Bảo toàn đủ 2 câu: sau khi tự sắp xếp tình hình theo cách riêng thì thấy không khó -> tóm tắt vị thế của nó giống như nhận lệnh dẹp tan Mùa xuân Praha."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000345
    terms:
      - "pháp sư địch"
      - "lực lượng dân quân quy mô cấp tiểu đoàn"
      - "cuộc nổi dậy"
      - "xe tăng"
      - "pháo binh"
    pronouns_and_address: "Dùng `chúng` cho phe nổi dậy và hiểu ngầm chủ thể pháo binh quân mình."
    pov_and_voice: "Giọng quy đổi tương quan lực lượng sang mô hình chiến tranh hiện đại quen thuộc."
    modality_and_logic: "Bảo toàn tình thái nghe nói (`Có vẻ`), thành phần lực lượng (pháp sư địch đi cùng lực lượng dân quân quy mô cấp tiểu đoàn) và phép giải thích giữa cặp dấu gạch ngang dài (`cùng xe tăng của chúng—tức các pháp sư`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000346
    terms:
      - "đám đông"
      - "tuyến tiếp tế"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: trần thuật dùng tên `Tanya` kết hợp đại từ `nó`."
    pov_and_voice: "Giọng trần thuật thể hiện sự nhàm chán pha lẫn tính toán thực tế của Tanya."
    modality_and_logic: "Bảo toàn đủ 3 câu: nếu chỉ là nghiền nát đám đông thì Tanya gần như thấy chán vì biết lịch sử có vô số lệnh như vậy -> chuyển ý `Dĩ nhiên` nhìn nhận tuyến tiếp tế đang gặp nguy nên không phải nhiệm vụ nhỏ -> khẳng định Tanya hiểu rõ điều đó."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000347
    terms:
      - "bạo loạn"
      - "tư lệnh quân đoàn địa phương"
      - "sĩ quan tiền tuyến"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: trần thuật quy chiếu Tanya bằng `Nó` / `nó`."
    pov_and_voice: "Giọng trần thuật giải thích lý do Tanya hỏi vặn đi vặn lại vị tư lệnh ở `b10`."
    modality_and_logic: "Bảo toàn đủ 3 câu: giới hạn vấn đề chỉ có vậy -> nếu bạo loạn nổ ra thì cứ ra lệnh dẹp yên -> nguyên nhân nó kiểm tra đi kiểm tra lại nhiều lần là vì giật mình khi tư lệnh quân đoàn địa phương lại phải gọi một sĩ quan tiền tuyến như nó đến bàn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000348
    terms:
      - "đám đông"
      - "tiền tuyến"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: câu trần thuật đầu đoạn dùng `nó`; hai câu nội tâm in nghiêng tiếp theo lược đại từ."
    pov_and_voice: "Giọng trần thuật chuyển mượt sang niềm hân hoan thầm kín của Tanya khi tưởng vớ được việc nhẹ ở hậu phương."
    modality_and_logic: "Bảo toàn câu trần thuật (nhận ra lệnh chỉ là xử lý đám đông nên suýt không nén nổi nụ cười) — giải thích đúng nụ cười ma cà rồng mà vị tư lệnh thấy ở `b10` — và 2 câu nội tâm đắc ý về độ dễ cùng cơ hội rời tiền tuyến."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ câu đầu ở chữ thường, bọc dấu `*...*` quanh trọn 2 câu nội tâm cuối đoạn tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000349
    terms:
      - "sở chỉ huy tiểu đoàn"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: trần thuật quy chiếu Tanya bằng `nó` kèm sở hữu `mình`."
    pov_and_voice: "Giọng trần thuật nối mốc thời gian vừa chạy về sở chỉ huy tiểu đoàn chuẩn bị."
    modality_and_logic: "Bảo toàn quan hệ tiếp nối sau khi kết luận như vậy và mốc thời gian `cách đây chưa lâu`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000350
    terms:
      - "văn bản mệnh lệnh"
      - "oanh kích chiến lược không phân biệt mục tiêu"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: độc thoại nội tâm của Tanya tự quy chiếu bằng `mình`, dùng `chúng ta` cho phe mình và `họ` cho cấp trên."
    pov_and_voice: "Giọng khựng lại đầy nghi hoặc khi Tanya đọc kỹ lại văn bản mệnh lệnh."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu `…`, sự nhận ra điểm gợn trong văn bản mệnh lệnh, và câu hỏi đối lập: về pháp lý hoàn toàn trong sạch nhưng tại sao lại ám chỉ khả năng oanh kích chiến lược không phân biệt mục tiêu."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000351
    terms:
      - "pháp sư địch"
      - "WTO"
      - "Mùa xuân Praha"
    pronouns_and_address: "Đan xen đại từ `chúng ta` ở câu 1, câu trần thuật dùng `Tanya` / `nó` ở câu 2 (`DEC-P01-001`), và `họ` cho khối `WTO` ở câu 4."
    pov_and_voice: "Giọng suy luận sắc lạnh khi Tanya nhận ra lỗ hổng chết người trong phép so sánh với Mùa xuân Praha."
    modality_and_logic: "Bảo toàn đủ 5 câu: điều kiện nếu diệt xong pháp sư địch mà quân còn lại không đầu hàng thì bước tiếp theo thật đáng sợ -> Tanya lập tức động não hết mức -> nhận thức lại rằng WTO từng nghiền nát Mùa xuân Praha chính là WTO -> phủ định việc họ hành động dưới ngọn cờ dân chủ -> hệ quả lịch sử có thể lên án việc đó."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000352
    terms:
      - "thuốc nổ mạnh"
      - "công thức gây nổ"
    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng phân tích kỹ thuật công phá đô thị thuần túy dưới góc độ quân sự."
    modality_and_logic: "Bảo toàn đủ 2 câu: yêu cầu của kế hoạch là dùng thuốc nổ mạnh và công thức/thuật thức gây nổ phá hủy tối đa các tòa nhà đá -> đánh giá về mặt quân sự đó là ý hay vì sẽ phơi bày phần bên trong dễ bắt lửa của các tòa nhà."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000353
    terms:
      - "bom cháy"
      - "đạn pháo hẹn giờ"
      - "Lục quân Đế quốc"
      - "Arene"
      - "Dresden"
    pronouns_and_address: "Lược đại từ tự xưng để câu hỏi tự vấn và tự trả lời trôi chảy."
    pov_and_voice: "Giọng suy tính lạnh lùng của Tanya về kịch bản phóng hỏa toàn thành phố bằng pháo binh."
    modality_and_logic: "Bảo toàn đủ 3 câu: câu hỏi phỏng đoán thả chủ yếu bom cháy -> tự bác bỏ (`Không`) và thay bằng khả năng dùng đạn pháo hẹn giờ cũng đủ đốt cháy mọi thứ -> mệnh đề điều kiện nếu mọi đơn vị Lục quân Đế quốc tập kết ở đây dồn hỏa lực thì Arene sẽ có điểm chung với Dresden."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000354
    terms:
      - "cuộc thảm sát"
      - "pháo binh"
      - "ném bom rải thảm"
      - "Khởi nghĩa Warsaw"
    pronouns_and_address: "Dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Giọng thừa nhận thực tế tàn khốc rồi tự trấn an bằng tiền lệ lịch sử."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu `…`, nhận định ngay cả khi không mắc sai lầm thì đây vẫn sẽ là một cuộc thảm sát, và câu thứ hai mở đầu bằng thán từ `Ờ` giải thích việc dùng pháo binh thay cho ném bom rải thảm giống như trong Khởi nghĩa Warsaw nên chuyện này *vẫn* thuộc loại thường thấy."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh từ khẳng định `*vẫn*` tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000355
    terms:
      - "vùng xám"
      - "tội phạm chiến tranh"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: độc thoại nội tâm của Tanya tự quy chiếu bằng `mình` / `Mình` kèm phản thân `bản thân`."
    pov_and_voice: "Giọng lo ngại sâu sắc về tiêu chuẩn kép của bên thắng trận và nguy cơ cá nhân bị truy cứu sau chiến tranh."
    modality_and_logic: "Bảo toàn đủ 3 câu: chỉ ra vùng xám đáng tiếc nơi các vụ ném bom của nước bại trận bị coi là tội ác còn của nước chiến thắng thì thậm chí chẳng bị chất vấn chứ đừng nói đến bị lên án sau những cuộc chất vấn không hề tồn tại -> nguy cơ chỉ một bước sai lầm là mình có thể bị quy là tội phạm chiến tranh -> thái độ dứt khoát từ chối tự đặt bản thân vào nguy hiểm như thế."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000356
    terms:
      - "Đế quốc"
      - "tội bất tuân"
      - "bỏ chạy trước mặt địch"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: nội tâm Tanya dùng `chúng ta` cho Đế quốc và `mình` cho bản thân."
    pov_and_voice: "Giọng lật ngược vấn đề khi nhận ra thế tiến thoái lưỡng nan ngay trong hiện tại."
    modality_and_logic: "Bảo toàn đủ 2 câu: tự chặn lại (`Khoan đã`) rằng chuyện đó chỉ xảy ra nếu Đế quốc thua -> suy ra nếu giả sử không thua mà giờ từ chối tuân lệnh thì sẽ bị xử bắn vì tội bất tuân, bỏ chạy trước mặt địch, vân vân."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000357
    terms:
      - "mệnh lệnh"
      - "cấp trên"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: nội tâm Tanya tự quy chiếu nhất quán bằng `mình` / `Mình` và gọi cấp trên là `họ`."
    pov_and_voice: "Giọng tự thuyết phục bản thân dựa trên tính hợp lệ hiện thời của mệnh lệnh và áp lực thời gian."
    modality_and_logic: "Bảo toàn đủ 5 câu: mệnh lệnh vẫn là mệnh lệnh -> lúc này những mệnh lệnh nhận được không có gì sai -> không có căn cứ từ chối và không có lý do phải lo -> không biết cấp trên có chịu nghe nếu tìm cách nói chuyện hay không -> kết luận dù sao cũng có thể chẳng còn thời gian."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000358
    terms:
      - "áp dụng hồi tố"
      - "Tòa án Quân sự Viễn Đông"
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: nội tâm Tanya tự quy chiếu nhất quán bằng `mình`."
