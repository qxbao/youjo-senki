findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000339
    category: dialogue_address_consistency
    issue: >-
      Tại `p000339`, lời đáp của vị tư lệnh quân đoàn với Tanya mở đầu bằng đại từ ngôi thứ hai `Cậu` (`“Cậu nói đúng. Nhưng đâu phải ai cũng được sống cuộc đời mình mong muốn.”`), trong khi xuyên suốt cuộc trao đổi ở cuối `b10` (`p000304`, `p000310`, `p000328`) và ngay trong lời tự nhủ nội tâm kế tiếp ở `p000340`–`p000341`, ông gọi Tanya bằng quân hàm `Thiếu tá` / `Thiếu tá Pháp sư von Degurechaff` hoặc đại từ `cô`.
    basis: >-
      Trong bản thân gói nguồn `b11`, lời thoại ở `p000339` không gắn nhãn người nói trực tiếp mà được nhận diện qua câu suy nghĩ tiếp nối ở `p000340`. Cách dịch `Cậu nói đúng` vẫn truyền đạt chuẩn nghĩa đồng tình và giữ giọng trao đổi trầm lắng của hai người lính, không làm lệch quan hệ hay cốt truyện.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc chỉnh nhẹ thành `“Cô nói đúng...”` / `“Đúng thế...”` nếu điều phối viên muốn đồng bộ tuyệt đối trục xưng hô với `b10` và `p000341`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000351
    category: footnote_marker_tracking
    issue: >-
      Tại câu thứ ba của `p000351` (`Đúng rồi, tổ chức WTO, tổ chức đã nghiền nát Mùa xuân Praha, chính là WTO.`), gói nguồn XHTML có đánh dấu chỉ số chú thích trên cao `20` ngay sau chữ viết tắt `WTO` lần đầu (`<html:sup class="calibre8">20</html:sup>`), nhưng bản dịch hiện lược bỏ ký hiệu số chú thích này; ngoài ra việc thêm danh từ loại biệt `tổ chức` lặp hai lần làm nhịp câu hơi nặng hơn cấu trúc đồng nhất ngắn gọn trong nguồn.
    basis: >-
      Nội dung chú thích 20 nằm ở tệp khác ngoài phạm vi gói nguồn `b11`, và `canon/decisions.md` hiện chưa khóa quy ước biểu diễn ký hiệu chú thích trong trường `translation`. Bản dịch giữ nguyên chữ viết tắt `WTO` mà không tự khai triển là hoàn toàn đúng giới hạn của `AGENTS.md`.
    recommendation: >-
      Không chặn signoff; ghi nhận vị trí mốc chú thích `20` tại `p000351` để điều phối viên theo dõi khi dựng EPUB, và ở bước polish có thể cân nhắc rút gọn nhịp lặp thành `Đúng rồi, WTO, bên đã nghiền nát Mùa xuân Praha, suy cho cùng vẫn là WTO.` (hoặc thêm chỉ số `²⁰` nếu điều phối viên áp dụng quy ước giữ mốc chú thích).
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000352
    category: terminology_consistency
    issue: >-
      Tại `p000352`, thuật ngữ chỉ phương tiện ma đạo đi kèm thuốc nổ mạnh được dịch là `các công thức gây nổ` (`...dùng thuốc nổ mạnh và các công thức gây nổ để phá hủy những tòa nhà đá hết mức có thể.`), trong khi `P01-formulas` và các lô trước (`vol-01` `ch-03-b20`–`b23`) ưu tiên phương án `thuật thức gây nổ` để phân biệt rõ phép thuật tác chiến của pháp sư với công thức toán/hóa học thông thường.
    basis: >-
      `chapter6_b11_reviewer_recommendations` trong `work/run-state/pending-terms.yml` hiện cho phép giữ tạm `công thức gây nổ` (với `thuật thức gây nổ` là phương án thay thế) miễn là tách bạch rõ với cụm `thuốc nổ mạnh` đứng trước. Câu dịch hiện tại bảo toàn hoàn toàn chính xác mục đích quân sự là phá vỡ lớp tường đá để làm lộ phần cấu trúc dễ bắt lửa bên trong.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên theo `chapter6_b11_reviewer_recommendations` hoặc đồng bộ thành `các thuật thức gây nổ` theo `P01-formulas`.
    resolution: optional_polish

