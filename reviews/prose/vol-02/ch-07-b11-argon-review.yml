locked_choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000269
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng ở toàn bộ câu thứ hai theo DEC-P01-002, đại từ gộp “chúng ta”, điều kiện nhượng bộ phủ định “ngay cả khi không tiêu diệt hoàn toàn được Lục quân Cộng hòa” và tình thái “chừng đó hẳn vẫn đủ để bảo đảm an toàn cho Đế quốc”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000270
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Và sau đó, chúng ta có thể tập trung tái thiết các vùng lãnh thổ bị chiến tranh tàn phá.*` theo DEC-P01-002."
- segment_id: YS-LN02/Text/part0032.xhtml/p000271
  locks:
  - "Giữ dấu ba chấm mở đầu đoạn, chủ thể “Grantz” (quy chiếu bằng “anh”), mức độ phủ định bất khả thi “ác liệt đến mức không sao nghĩ nổi về tương lai” và chi tiết ánh nhìn lo lắng từ những người đồng đội cùng chiến tuyến."
- segment_id: YS-LN02/Text/part0032.xhtml/p000272
  locks:
  - "Giữ đại từ “anh” / “mình”, các phủ định “đã không để ý đến xung quanh suốt một lúc khá lâu”, “Không phải là thực tế đã trôi qua lâu đến thế”, “không thể tin nổi” và cấp so sánh hơn “những trận đánh khốc liệt hơn mà anh từng trải qua”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000273
  locks:
  - "Giữ chi tiết “cốc cà phê giờ đã hơi nguội”, phủ định “chỉ uống mà chẳng mấy để tâm”, sự đối lập giữa “khẩu phần cấp phát” với độ hiếm của hạt cà phê và sự khan hiếm của nước đun sôi trên chiến trường khiến cà phê trở thành một thứ xa xỉ."
- segment_id: YS-LN02/Text/part0032.xhtml/p000274
  locks:
  - "Giữ quan hệ nhân quả đang trong ca trực nên rượu bia hiển nhiên bị cấm, và tâm trạng biết ơn vì có nguồn dự trữ dồi dào loại cà phê mà chỉ huy của họ yêu thích."
- segment_id: YS-LN02/Text/part0032.xhtml/p000275
  locks:
  - "Giữ tình thái suy đoán “Xem chừng họ đã trưng dụng cả đống thứ này”, cấu trúc phủ định “mà không phải dùng đến cà phê thay thế” và nhận định kết đoạn về việc Grantz để ý tới cả những chi tiết nhỏ nhặt nhất."
- segment_id: YS-LN02/Text/part0032.xhtml/p000276
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở mệnh đề đầu `*Hẳn là mình đang bình tĩnh lắm đây*` theo DEC-P01-002, đại từ nội tâm “mình” / trần thuật “anh”, phủ định kép “việc không mất lấy vài người là điều bất khả thi”, định danh “Tiểu đoàn Pháp sư Trên không số 203” và chi tiết biên chế làm “lính bổ sung lâm thời”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000277
  locks:
  - "Giữ cấu trúc so sánh hơn “Chắc chắn thế vẫn tốt hơn là bị điều chuyển khỏi đơn vị quen thuộc nơi họ từng cùng nhau huấn luyện để rồi phải chật vật ở một đơn vị mới” và định danh trên giấy tờ “Tiểu đoàn Hỗn hợp Lâm thời số 203 của Lục quân Đế quốc” lấy “Tiểu đoàn 203” làm nòng cốt."
- segment_id: YS-LN02/Text/part0032.xhtml/p000278
  locks:
  - "Giữ thuật ngữ “Hô hiệu”, tên riêng “Fairy”, “Pixie”, phủ định “chẳng khác nhau là mấy”, định danh “Tiểu đoàn Pháp sư Trên không số 203” và từ trong ngoặc kép “lâm thời”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000279
  locks:
  - "Giữ chủ thể “Grantz” tự luận ra hàm ý của đợt tái tổ chức tạm thời và mốc thời gian “Cấp trên sẽ tiến hành đợt chuyển đổi thực sự sau chiến dịch sắp tới”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000280
  locks:
  - "Giữ đại từ “anh”, nhận định đêm yên ả đến khó tin đối với một chiến trường và sự tương phản của bầu trời nhìn từ dưới chiến hào trông đầy sao đến lạ trong những khoảnh khắc tĩnh lặng."
- segment_id: YS-LN02/Text/part0032.xhtml/p000281
  locks:
  - "Giữ thuật ngữ “tiếng súng máy”, “hỏa lực quấy rối ban đêm” và quan hệ hệ quả sự vắng bóng rõ rệt của chúng lại lạc lõng đến mức gây căng thẳng thần kinh."
- segment_id: YS-LN02/Text/part0032.xhtml/p000282
  locks:
  - "Giữ nguyên dấu ngoặc kép hội thoại, dấu ba chấm mở đầu, danh xưng cấp bậc “Thiếu úy” và đại từ “Cậu” khi Weiss gọi Grantz."
- segment_id: YS-LN02/Text/part0032.xhtml/p000283
  locks:
  - "Giữ câu đầu ở mạch trần thuật (“anh”) không in nghiêng, và bọc dấu nhấn mạnh `*...*` từ câu thứ hai đến hết đoạn theo DEC-P01-002 với đại từ nội tâm “Mình/mình”, định danh “tuyến phòng thủ Rhine”, ẩn dụ “những cơn bão thép” cùng câu hỏi tự vấn về hình ảnh “chú gà con còn đội vỏ trứng trên đầu”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000284
  locks:
  - "Giữ câu thoại ngắn trong ngoặc kép và danh xưng “Trung úy Weiss”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000285
  locks:
  - "Giữ định danh “Trung úy Weiss”, địa danh “Arene”, đại từ quy chiếu “anh” và dấu gạch ngang dài giải thích việc mọi người cảm thấy vững tâm hơn khi có anh ở bên."
- segment_id: YS-LN02/Text/part0032.xhtml/p000286
  locks:
  - "Giữ quan hệ nhượng bộ giữa việc “Grantz là sĩ quan duy nhất thực sự cần phải trực gác” với việc “Weiss vẫn phụ giúp để nỗ lực lấy lại bản năng chiến đấu sau một thời gian vắng mặt”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000287
  locks:
  - "Giữ hai danh từ “sự buồn chán và thần kinh căng thẳng” là kẻ thù chính của “lính gác”, cùng cấu trúc phủ định so sánh bậc nhất “chẳng thể nào biết ơn hơn” đối với “sĩ quan đàn anh”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000288
  locks:
  - "Giữ cấu trúc phủ định kép “cũng không phải là tôi không hiểu cảm giác của cậu”, câu phủ định “Tôi cũng chẳng tài nào bình tĩnh được đây” và cặp đại từ xưng hô “tôi – cậu”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000289
  locks:
  - "Giữ danh từ cấp bậc viết thường “Viên trung úy”, chủ thể suy đoán “Grantz” và phủ định “vết thương đã không còn gây rắc rối gì cho anh nữa”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000290
  locks:
  - "Giữ định danh “Trung úy Weiss”, thuật ngữ “đấu tập” với “chỉ huy”, và bọc dấu nhấn mạnh `*...*` đúng ở câu thứ hai theo DEC-P01-002 với cặp đại từ nội tâm “anh ấy” (Weiss) – “mình” (Grantz)."
- segment_id: YS-LN02/Text/part0032.xhtml/p000291
  locks:
  - "Giữ câu trần thuật thứ nhất không in nghiêng và bọc dấu nhấn mạnh `*...*` ở câu hỏi nội tâm thứ hai `*Anh ấy cũng không thể thư giãn sao?*` theo DEC-P01-002."
- segment_id: YS-LN02/Text/part0032.xhtml/p000292
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu ba chấm mở đầu, đại từ “anh” (Grantz gọi Weiss) và câu hỏi nghi vấn “cảm thấy có gì đó không ổn sao?”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000293
  locks:
  - "Giữ câu thoại khẳng định của Weiss về việc tiểu đoàn ở ngoài tiền tuyến suốt từ lúc mới tập hợp thành lập đến giờ, cùng hành động “mỉm cười chua chát và uống cạn cốc cà phê”."
- segment_id: YS-LN02/Text/part0032.xhtml/p000294
  locks:
  - "Giữ quan hệ đối lập giữa việc đã trải qua những trận giao tranh ác liệt với nụ cười mang vẻ thích thú trên gương mặt Weiss."
- segment_id: YS-LN02/Text/part0032.xhtml/p000295
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng cho toàn bộ câu hỏi nội tâm ngắn `*Nhưng tại sao chứ?*` theo DEC-P01-002."
- segment_id: YS-LN02/Text/part0032.xhtml/p000296
  locks:
  - "Giữ phép so sánh thời gian trên chiến trường của Grantz ngắn ngủi hơn nhiều so với mọi người nhưng lại có cảm giác như đã sống thế này suốt nửa đời người, và nhận định kết lại rằng những ngày qua quả thực kín đặc sự kiện."
