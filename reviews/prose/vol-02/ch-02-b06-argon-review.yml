  proposed_vi: "Trong phân cảnh kết thúc buổi phổ biến nhiệm vụ chung và bước vào cuộc họp các đại đội trưởng do Tanya cùng Trung úy Weiss điều hành (part0014/p000118–p000140): tuân thủ nghiêm ngặt `DEC-P01-001` và mục `vol02-ch02-b06-tanya-narration`, độc thoại nội tâm trực tiếp của Tanya tự quy chiếu ngôi thứ nhất bằng `Mình` / `mình` xuyên suốt (p000119, p000120, p000123, p000124, p000135, p000137, p000139) và dùng `Chúng ta` / `chúng ta` khi suy ngẫm với tư cách tập thể đơn vị (p000119, p000120); trong các câu trần thuật ngôi thứ ba (p000120, p000121, p000125, p000132, p000135, p000137), định danh Tanya bằng cách lặp tên riêng `Tanya` hoặc lược chủ ngữ (không dùng `nó` hay `cô` / `cô ấy`); quy chiếu Trung úy Weiss bằng `anh` (p000135); quy chiếu các đại đội trưởng, binh lính và các quốc gia như Liên minh Entente hay các nước trung lập bằng `họ` (p000118, p000123, p000127, p000129–p000132, p000137, p000139, p000140); trong lời thoại trực tiếp: Weiss dùng `chúng ta` / `mình` / `Các đại đội trưởng` / `mọi người` khi thông báo trước đơn vị (p000118, p000122) và gọi Tanya là `Chỉ huy` (p000134); Tanya khi phát biểu trước các đại đội trưởng và nói với Weiss tự xưng `tôi`, gọi tập thể sĩ quan là `mọi người` / `Thưa các vị`, và gọi đích danh `Trung úy Weiss` (p000126, p000136, p000138)"
  alternatives_vi:
  - cô ấy / nó (thay cho việc lặp tên riêng `Tanya` hoặc lược chủ ngữ trong trần thuật tại part0014/p000120, p000121, p000135 — bắt buộc bác bỏ theo `DEC-P01-001`, mục `vol02-ch02-b06-tanya-narration` và báo cáo signoff `reviews/prose/vol-02/ch-02-b06-fixes-signoff-claude.md`)
