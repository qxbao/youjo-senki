findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000431
    category: rank_vocative_and_title_nuance
    issue: >-
      Tại đầu câu thoại `p000431`, danh xưng hô gọi cấp bậc của Serebryakov (`Lieutenant`) đang được lược bỏ, chỉ giữ đại từ `Cô` (`“Cô với tôi đã chứng kiến đủ cảnh lính mới làm hỏng việc ở mặt trận Rhine đến phát ngán rồi. Cô xử lý được họ chứ?”`); đồng thời tại `p000440`, cụm danh xưng `Sĩ quan cấp úy Serebryakov` dùng trong độc thoại nội tâm của Tanya hơi mang sắc thái giải thích hành chính (tương tự `p000428` của `ch-05-b17`).
    basis: >-
      Do nguyên văn chỉ ghi cấp úy chung mà không nêu tiểu cấp cụ thể tại hai đoạn này, phương án lược danh xưng ở `p000431` và dịch trung tính `Sĩ quan cấp úy Serebryakov` ở `p000440` đã tuân thủ đúng giới hạn suy luận của `DEC-P01-001` và giữ đồng bộ hoàn toàn với `ch-05-b17` (`p000428`).
    recommendation: >-
      Không chặn signoff; ở bước polish hoặc biên tập toàn tập, nếu đối chiếu khóa cấp bậc của Serebryakov tại thời điểm Chương 5 Tập 2 (Thiếu úy), có thể cân nhắc bổ sung hô ngữ đầu câu `p000431` và rút gọn danh xưng tại `p000440` cho tự nhiên hơn.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000451
    category: lexical_nuance_and_repetition
    issue: >-
      Tại câu 1 của `p000451`, danh từ chỉ câu chuyện truyền miệng mang màu sắc huyền thoại ở học viện (`legend`) đang được dịch là `lời đồn` (lặp với `tin đồn` / `lời đồn` ở `p000450` ngay trước đó), và liên từ `rằng` lặp lại hai lần liên tiếp trong cùng một câu (`ở học viện có lời đồn rằng một học viên thuộc lớp thứ hai từng lẩm bẩm rằng Học viên Degurechaff còn đáng sợ hơn cả chiến trường`).
    basis: >-
      Nghĩa cốt lõi về giai thoại truyền tai nhau tại học viện quân sự vẫn hoàn toàn chính xác.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể đổi thành `Chẳng hạn, ở học viện có một giai thoại kể rằng từng có học viên lớp hai lẩm bẩm Học viên Degurechaff còn đáng sợ hơn cả chiến trường.` để làm nổi bật sắc thái phóng đại của từ gốc và tránh lặp từ `rằng`.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000457
    category: pronoun_and_parallel_structure_nuance
    issue: >-
      Trong phần điểm nhìn của Warren Grantz (`p000451`, `p000457`, `p000458`, `p000460`, `p000461`), Grantz quy chiếu Thiếu tá von Degurechaff bằng đại từ `cô ta` (trong khi sang `ch-05-b19` tại `p000475`, `p000478`, `p000487`, `p000488`, `p000491` lại dùng `cô`); ngoài ra tại `p000457`, câu thứ ba (`Vẻ như cô ta đang khát máu.`) hơi lệch cấu trúc danh ngữ song hành so với hai câu đầu (`Nụ cười của cô ta. Cách cô ta nhìn chúng tôi như nhìn lũ giòi bọ.`), và hai câu độc thoại in nghiêng ở `p000458`, `p000462` đang dùng `tôi` thay vì `mình` như ở `p000443`, `p000454`.
    basis: >-
      Điểm nhìn từ `p000443` đến `p000464` là của Warren Grantz (không phải trần thuật điểm nhìn Tanya nên không thuộc phạm vi cấm của `DEC-P01-001`), và sắc thái `cô ta` trong `b18` phản ánh tâm lý kinh hãi của Grantz trước lời đồn “ác quỷ đội lốt bé gái”; việc dùng `tôi` trong câu in nghiêng ở `p000458`, `p000462` cũng khớp với mạch tự sự ngôi thứ nhất `tôi` từ `p000456` trở đi.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh câu 3 của `p000457` thành `Cách cô ta trông như đang khát máu.` (hoặc `Vẻ khát máu của cô ta.`) để giữ nhịp điệp cấu trúc, và đồng bộ đại từ quy chiếu của Grantz giữa `b18` và `b19` nếu muốn thống nhất xuyên suốt cảnh.
    resolution: optional_polish

