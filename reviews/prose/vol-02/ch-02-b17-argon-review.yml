- segment_id: YS-LN02/Text/part0014.xhtml/p000445
  locks:
  - "Giữ đại từ nội tâm `mình` theo `DEC-P01-001`, đại từ số nhiều `Họ` / `họ`, các cụm `đánh cho quân Dacia một trận tơi bời`, `cấp dưới của mình thật sự đang thèm khát chiến tranh`, và `Tinh thần phụng sự của họ quả là tận tụy hết mực.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000446
  locks:
  - "Giữ đại từ nội tâm `mình`, đại từ `Họ` / `họ`, giả định phản thực tế `nếu không tận tụy theo đuổi cái sự nghiệp chiến tranh vô ích ấy, mình nhất định sẽ muốn chiêu mộ họ`, và câu kết `Chính những chuyện như thế này chứng minh quỷ dữ tồn tại.` (theo `review-devil`)."
- segment_id: YS-LN02/Text/part0014.xhtml/p000447
  locks:
  - "Giữ cấu trúc giả định phản thực tế `Nếu Chúa tồn tại, tài nguyên đã chẳng bị phân bổ bất hợp lý đến thế.` và hai mệnh đề kinh tế học `Nguyên tắc thị trường mới là con đường chân lý duy nhất. Chỉ thị trường mới có bàn tay vô hình.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000448
  locks:
  - "Giữ thuật ngữ `kinh tế học` và toàn văn câu nội tâm `Nói thật, chuyện này đáng tiếc quá. Thế giới đúng là được tạo ra để khiến mọi thứ trở nên khó khăn. Có lẽ còn lâu kinh tế học mới giải quyết được tất cả.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000449
  locks:
  - "Giữ định danh `Đại đội Bốn`, đại từ ngôi thứ nhất số nhiều `chúng ta` / `Chúng ta`, và câu lệnh `“Đại đội Bốn, chúng ta lên cao. Chúng ta sẽ vòng qua đánh hai đại đội có vẻ là quân tiếp viện kia.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000450
  locks:
  - "Giữ đại từ nội tâm `mình`, các cụm `Đơn vị ta là một tiểu đoàn tăng cường—gồm bốn đại đội` (theo `vol02-ch02-b12-augmented-battalion`), `Tiểu đoàn ta sẽ chặn hai tiểu đoàn, còn đại đội tăng cường sẽ đối phó với hai đại đội kia`, và câu kết `Mà mình muốn tự làm cho mọi chuyện nhẹ nhàng, nên sẽ đi cùng nhóm sau.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000451
  locks:
  - "Giữ đại từ phản thân `mình` và toàn văn `Trên chiến trường, mục tiêu cao cả nhất là đánh bại kẻ địch với ít công sức nhất có thể. Tất cả chỉ xoay quanh việc làm sao để đời mình thoải mái hơn.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000452
  locks:
  - "Giữ đại từ nội tâm `Mình` / `mình`, ẩn dụ tài chính `đáng tin ngang một mẩu quảng cáo quỹ đầu cơ`, và câu kết `Mình nghĩ cứ để mình rèn tính cách cho người khác vậy.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000453
  locks:
  - "Giữ đại từ tôn xưng `ngài`, thuật ngữ `máy bay ném bom`, và câu hỏi `“Rõ. Còn máy bay ném bom thì ngài định xử lý thế nào?”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000454
  locks:
  - "Giữ đại từ `Chúng`, ngôi tự xưng `tôi` / `Tôi`, và câu thoại `“Chúng là của tôi. Đừng ghét tôi nhé! Tôi chỉ muốn vừa là át chủ bài của lục quân, vừa là át chủ bài của không quân thôi.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000455
  locks:
  - "Giữ nguyên câu thoại `“Ha ha ha. Hay đấy.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000456
  locks:
  - "Giữ đại từ ngôi thứ ba `Anh ta` (chỉ đại đội trưởng Đại đội Bốn), đại từ nội tâm `mình` / `Mình` theo `DEC-P01-001`, định danh `Being X` (theo `P05-being-x` / `vol02-ch02-b17-being-x`), và câu hỏi nội tâm `Một người tốt như mình, cớ sao lại bị Being X hành hạ vô lý và bắt phải tham chiến trong cuộc chiến này chứ?`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000457
  locks:
  - "Giữ đại từ nội tâm `mình`, cụm `cấp dưới của mình`, đại từ `họ`, và câu kết `Thấy đáng ngờ, mình lườm họ rồi hỏi rốt cuộc có gì buồn cười.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000458
  locks:
  - "Giữ đại từ tôn xưng `Ngài`, thuật ngữ `máy bay tiêm kích`, và câu hỏi `“Ngài biết là phải dùng máy bay tiêm kích mới làm được, đúng không?”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000459
  locks:
  - "Giữ đại từ nội tâm `mình` và các câu `Bực thật, xem ra mình đã hiểu nhầm quy định. Để lộ sự thiếu hiểu biết trước mặt binh lính thế này đúng là đáng tiếc. Xấu hổ không sao tả xiết.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000460
  locks:
  - "Giữ các đại từ `chúng ta`, `Tôi`, `chúng`, thuật ngữ `máy bay tiêm kích`, và toàn văn câu thoại của Tanya."
- segment_id: YS-LN02/Text/part0014.xhtml/p000461
  locks:
  - "Giữ cặp đại từ `ngài` – `tôi`, và lời nói đùa liên kết với vụ cá cược ở `b16` `“Sao ngài không đi? Có điều, nếu tôi đi cùng thì e là cuối cùng lại phải khao cả tiểu đoàn mất.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000462
  locks:
  - "Giữ các đại từ `họ`, `mình` / `Mình`, cụm `mượn máy bay tiêm kích của không quân ư?`, và câu phủ định `Mình không thể làm thế được.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000463
  locks:
  - "Giữ đại từ nội tâm `mình` / `Mình`, các thuật ngữ `bỏ chạy trước mặt quân địch`, `Xử bắn! Chắc chắn đang chờ mình là án xử bắn.`, `máy bay tiêm kích`, `bộ máy quan liêu`, và câu hỏi kết `Chẳng có hội nhóm nào bảo vệ lợi ích hay quyền lợi, thậm chí một nhóm lợi ích nào đó, đứng ra bảo vệ mình sao?`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000464
  locks:
  - "Giữ ngôi tự xưng `Tôi` và câu thoại `“Tôi không thể nào quay lưng lại với kẻ địch.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000465
  locks:
  - "Giữ nguyên câu thoại `“Thôi, đành vậy. Kết thúc chuyện này nhanh nhất có thể thôi.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000466
  locks:
  - "Giữ nguyên hai câu `Rồi tin nhắn từ các đơn vị khác truyền đến. Không gì tuyệt hơn đúng lúc cả.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000467
  locks:
  - "Giữ đại từ nội tâm `Mình` / `mình`, đại từ `họ`, và các câu `Mình thích việc binh lính biết đọc tình hình. Chắc chắn họ sẽ giúp ích nhiều cho con đường thăng tiến của mình. Tốt quá.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000469
  locks:
  - "Sau khi sửa `F01`, khóa đại từ ngôi thứ hai `cậu` (chỉ đại đội trưởng Đại đội Bốn), đại từ ngôi thứ nhất số nhiều `bọn tôi`, và hiệu lệnh `Xung phong!` trong câu `“Xin lỗi nhé, chắc chắn cậu sẽ phải khao bọn tôi rồi. Xung phong!”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000470
  locks:
  - "Giữ cụm `Hai mươi lăm năm…` (quy chiếu chai vang hai mươi lăm năm tuổi ở `p000423`), ngôi tự xưng `Tôi`, và hiệu lệnh `“Hai mươi lăm năm… Tôi sẽ uống cho thỏa thích. Đại đội, tiến lên!”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000471
  locks:
  - "Giữ danh xưng `chiến hữu`, cách thưa `ngài, Chỉ huy`, và toàn văn `“Có chiến hữu tốt thật chẳng gì bằng. Vậy nhé, xin phép ngài, Chỉ huy.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000472
  locks:
  - "Giữ cụm gọi các đại đội trưởng đồng cấp `Mấy cậu này!`, cách thưa `ngài, Chỉ huy`, và toàn văn `“Ái chà! Mấy cậu này! Xin lỗi ngài, Chỉ huy.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000473
  locks:
  - "Giữ đại từ `Họ` và toàn văn `Bầu không khí đã thay đổi hẳn. Họ đúng là chỗ dựa tuyệt vời.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000474
  locks:
  - "Giữ đại từ nội tâm `mình` / `Mình`, các cụm `làm ở phòng nhân sự`, `Mấy anh chàng này đúng là hợp làm kinh doanh`, và `đủ sức đảm đương việc hoạch định chiến lược.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000475
  locks:
  - "Giữ đại từ `Họ` / `họ`, đại từ nội tâm `Mình`, cụm `yêu chiến tranh thay vì kinh doanh`, và `tôn trọng ý chí tự do của họ`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000476
  locks:
  - "Giữ ngôi tự xưng `tôi` và câu lệnh `“Được rồi. Đừng lo cho tôi. Cứ đi trước đi.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000477
  locks:
  - "Giữ cách thưa `Cảm ơn ngài`, định danh `Đại đội Bốn`, đại từ `chúng ta`, và hiệu lệnh `“Cảm ơn ngài. Đại đội Bốn, chúng ta lên trước!”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000478
  locks:
  - "Giữ đại từ nội tâm `mình`, đại từ `Họ`, cụm `các đại đội trưởng của mình`, và hình ảnh so sánh `như lũ Doberman trước con mồi; vừa được mình thả dây cương là lập tức phóng đi.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000479
  locks:
  - "Giữ đại từ `Họ` / `họ`, thuật ngữ `đội hình xung kích hình thoi`, và câu kết `Cú xung phong chớp nhoáng được thực hiện đồng bộ hoàn hảo, nhưng ham muốn chiến đấu mãnh liệt khiến họ hơi liều lĩnh quá mức.`."
