  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, thực thể siêu nhiên và thuật ngữ quân sự – kinh tế đã khóa tạm từ Tập 1 và các batch trước của Tập 2 (`quân Dacia`, `quỷ dữ` theo `review-devil`, `Being X` theo `P05-being-x` / `vol02-ch02-b17-being-x`, `Đại đội Bốn`, `tiểu đoàn tăng cường` theo `vol02-ch02-b12-augmented-battalion`, `quân tiếp viện`, `máy bay ném bom`, `chiến hữu`, `Chỉ huy`), đồng thời khóa tạm các ẩn dụ kinh tế – công sở và thuật ngữ không chiến trong phân cảnh Đại đội Bốn tách đội hình (`Nguyên tắc thị trường`, `bàn tay vô hình`, `quảng cáo quỹ đầu cơ`, `át chủ bài của lục quân`, `át chủ bài của không quân`, `máy bay tiêm kích`, `bỏ chạy trước mặt quân địch`, `án xử bắn`, `nhóm lợi ích`, `phòng nhân sự`, `đội hình xung kích hình thoi`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_interior_monologue_and_fourth_company_commander_banter_pronouns_vol02_ch02_b17
  proposed_vi: "Trong phân cảnh Tanya dẫn Đại đội Bốn vòng lên cao để đánh chặn máy bay ném bom cùng hai đại đội hộ tống của địch và đối đáp với đại đội trưởng Đại đội Bốn cũng như các đại đội trưởng khác qua vô tuyến (part0014/p000445–p000479): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối B15–B16, trong toàn bộ mạch độc thoại nội tâm và tự thuật ngôi thứ nhất của Tanya (p000445, p000446, p000450–p000452, p000456, p000457, p000459, p000462, p000463, p000467, p000474, p000475, p000478), Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` nhất quán, và dùng ngôi thứ nhất số nhiều `Đơn vị ta` / `Tiểu đoàn ta` khi xét biên chế tác chiến chung (p000450); dùng cấu trúc khái quát lược đại từ hoặc danh từ chung (`khi còn trẻ`, `người ta`) cho đại từ ngôi thứ hai phiếm chỉ ở p000451, p000452, p000456; quy chiếu vị đại đội trưởng Đại đội Bốn trong nội tâm bằng `Anh ta` (p000456), và quy chiếu tập thể các đại đội trưởng cùng binh sĩ dưới quyền bằng `Họ` / `họ` / `Mấy anh chàng này` (p000445, p000446, p000457, p000459, p000462, p000467, p000473–p000475, p000478, p000479). Trong đối thoại giữa Tanya và đại đội trưởng Đại đội Bốn (p000449, p000453–p000455, p000458, p000460, p000461, p000464, p000465, p000471, p000472, p000476, p000477): Tanya tự xưng `tôi` / `Tôi`, dùng `chúng ta` / `Chúng ta` khi bao gộp mình và Đại đội Bốn; đại đội trưởng Đại đội Bốn tự xưng `tôi`, dùng `chúng ta`, và gọi Tanya lễ phép là `ngài` / `Chỉ huy`. Trong liên lạc vô tuyến từ các đại đội trưởng khác gọi sang trêu đại đội trưởng Đại đội Bốn rồi dẫn quân xung phong (p000469–p000472): các đại đội trưởng tự xưng `bọn tôi` / `Tôi`, gọi đại đội trưởng Đại đội Bốn là `cậu` (sau khi sửa `F01` ở p000469), gọi nhau là `chiến hữu` / `Mấy cậu này!`, và chào Tanya lễ phép là `ngài, Chỉ huy`"
  alternatives_vi:
  - anh (thay cho `cậu` khi các đại đội trưởng gọi nhau tại part0014/p000469 — ưu tiên `cậu` để khớp hoàn hảo với câu cảm thán đáp trả `“Ái chà! Mấy cậu này! Xin lỗi ngài, Chỉ huy.”` của đại đội trưởng Đại đội Bốn ngay tại p000472) / cô (thay cho `cậu` tại part0014/p000469 — không dùng vì người bị trêu phải khao rượu theo vụ cá cược ở p000423 và p000461 là vị đại đội trưởng Đại đội Bốn nam giới chứ không phải Tanya, xem `F01`)
