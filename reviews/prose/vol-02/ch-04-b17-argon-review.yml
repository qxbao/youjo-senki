  - id: vol02-ch04-b17-pronouns-pov-disambiguation-and-emphasis
    source_term: Syrtis captain third-person pronouns (p000175–p000180), collective crew inner thought and emphasis in p000180, POV shift and subject disambiguation for the first officer in p000182–p000192, dialogue address between the first officer and the technical officer (p000187–p000191), and Major General Habergram third-person/dialogue pronouns (p000193, p000195–p000198)
    proposed_vi: >-
      xác nhận bản sửa V1 theo `handoffs/vol-02/ch-04-b17.yml` đã được áp dụng
      đầy đủ và nghiệm thu: ở đoạn p000175–p000180 trước khi tàu trúng đòn tấn
      công, quy chiếu thuyền trưởng tàu ngầm *Syrtis* nhất quán bằng chức danh
      “thuyền trưởng” / “Thuyền trưởng” và đại từ ngôi thứ ba trang trọng “Ông”
      / “ông” kèm đại từ phản thân “mình” (đồng bộ hoàn toàn với b16 p000157–p000172),
      đồng thời quy chiếu tập thể thủy thủ đoàn cũng như phía pháp sư Đế quốc ở
      p000179 bằng “họ” / “Họ”; tại p000180, bảo toàn chính xác phạm vi nhấn
      mạnh Markdown `*Mình phải cử động.*` cho ý nghĩ chung của các thủy thủ
      theo đúng DEC-P01-002; tại p000182 khi thuyền trưởng đã bất tỉnh ở cuối
      p000180, nêu rõ chủ thể “Sĩ quan phó” ngay đầu câu đầu tiên và dùng đại từ
      “anh” ở câu thứ hai để tách bạch hoàn toàn điểm nhìn của sĩ quan phó khỏi
      thuyền trưởng (bản sửa V1); xuyên suốt p000183–p000192, duy trì nhất quán
      “anh” / “Sĩ quan phó” / “sĩ quan phó” cho người tạm nắm quyền chỉ huy tàu
      (lưu ý đại từ “nó” tại p000185 chỉ quy chiếu danh từ bất động vật “bánh
      lái”); trong đối thoại kín giữa sĩ quan phó và viên sĩ quan kỹ thuật bí ẩn
      (p000187–p000191), sĩ quan phó gọi đối phương là “Thưa ngài” / “ngài”,
      xưng “chúng tôi” (thay mặt thủy thủ đoàn ở p000187) và “Chúng ta” (cho cả
      tàu ở p000190), còn sĩ quan kỹ thuật gọi sĩ quan phó là “Anh” (p000188) và
      đáp “Rõ” (p000191); ở cảnh chuyển sang trụ sở tình báo Khối Thịnh vượng
      chung (p000193–p000198), Thiếu tướng Habergram quát mắng các sĩ quan tình
      báo bằng đại từ số nhiều “Các người” (p000193), và trần thuật ngôi thứ ba
      quy chiếu Habergram nhất quán bằng “Thiếu tướng Habergram” / “Vị tướng” /
      “Tướng Habergram” và đại từ “Ông” / “ông” (lưu ý từ “nó” tại p000194 quy
      chiếu tòa nhà và tại p000195 quy chiếu chiếc bàn)
    alternatives_vi:
      - Tôi phải cử động (thay cho `*Mình phải cử động.*` ở p000180 — ưu tiên giữ `*Mình phải cử động.*` vì tự nhiên cho phản xạ nội tâm tức thời của từng thủy thủ và không xung đột với DEC-P01-001)
