locked_choices:
  - segment_id: YS-LN02/Text/part0030.xhtml/p000132
    terms: []
    pronouns_and_address: "Viên sĩ quan Tác chiến dùng đại từ ngôi thứ nhất số nhiều gộp `Ta` khi trình bày phương án tác chiến."
    pov_and_voice: "Giọng báo cáo tham mưu lạnh lùng, nói thẳng bản chất tàn khốc của kế hoạch."
    modality_and_logic: "Bảo toàn cấu trúc giả định phương thức tác chiến: dùng phương pháp đơn giản, thẳng thừng là thiêu rụi cả thành phố."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000133
    terms:
      - "viên sĩ quan Tác chiến"
    pronouns_and_address: "Mệnh đề nội tâm giả định qua giọng nói tự xưng `Tôi`; phần trần thuật quy chiếu viên sĩ quan Tác chiến bằng `anh ta` / `Anh ta`."
    pov_and_voice: "Giọng trần thuật ngôi thứ ba ghi nhận sự miễn cưỡng, nặng nề của cả người báo cáo lẫn những người nghe."
    modality_and_logic: "Bảo toàn cả hai câu: sắc thái chỉ muốn kết thúc cho xong việc toát ra từ giọng viên sĩ quan Tác chiến khi tiếp tục giải thích theo yêu cầu, và cấu trúc phủ định mở rộng (`Anh ta không phải người duy nhất mong chẳng còn gì phải tiếp tục nữa`)."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh mệnh đề đầu câu (`*Tôi chỉ muốn cho xong chuyện này thôi*`) tương ứng thẻ `<html:em>`, giữ phần trần thuật còn lại ở chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000134
    terms:
      - "pháp sư"
    pronouns_and_address: "Câu hỏi của vị tư lệnh quân đoàn không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng hỏi pha lẫn ngạc nhiên và hoài nghi về hiệu quả chiến thuật."
    modality_and_logic: "Bảo toàn đủ 3 câu và đúng hướng tác động của đòn tấn công ở câu cuối: hỏi xác nhận tấn công bằng lửa -> nhận xét đó là bài bản cổ điển -> hỏi ngược lại việc dùng cách đó để đối phó với pháp sư (tránh hiểu nhầm thành dùng pháp sư để tấn công)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000135
    terms:
      - "bão lửa"
    pronouns_and_address: "Câu hỏi ngắn lược đại từ chủ ngữ để giữ trung tính, tránh gán sai giới tính người nghe."
    pov_and_voice: "Giọng hỏi dẫn dắt của viên sĩ quan Tác chiến."
    modality_and_logic: "Bảo toàn câu hỏi nghi vấn về việc đã từng nghe nói đến hiện tượng bão lửa hay chưa."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000136
    terms:
      - "quỷ dữ"
      - "lý trí"
      - "lương tri"
      - "chiến thuật"
    pronouns_and_address: "Quy chiếu người lập kế hoạch bằng danh ngữ `Kẻ nghĩ ra chuyện này` / `một con quỷ`."
    pov_and_voice: "Giọng độc thoại / trần thuật kinh hoàng, lên án kịch liệt sự vô nhân tính của kế hoạch."
    modality_and_logic: "Bảo toàn đủ 4 câu: cảm thán đây là báo cáo đáng sợ hay đề xuất từ địa ngục; nhận định kẻ nghĩ ra hẳn là luật sư xảo quyệt đến mức quỷ dữ cũng muốn bắt tay hợp tác hoặc là tội phạm; đánh giá lối suy nghĩ gần như phi nhân tính; và kết luận chỉ một con quỷ đánh mất lý trí cùng lương tri từ trong bụng mẹ mới nghĩ ra chiến thuật như thế."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000137
    terms:
      - "năng lực kỹ thuật"
      - "chiến dịch"
    pronouns_and_address: "Quy chiếu những người lập kế hoạch bằng `Họ`; quy chiếu chiến dịch bằng `nó`."
    pov_and_voice: "Giọng độc thoại nội tâm bàng hoàng, phẫn nộ của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn sự phân biệt giữa việc có năng lực kỹ thuật để tiến hành một chiến dịch với việc thực sự thực hiện nó, cùng câu hỏi tu từ cuối đoạn (`Họ mất trí rồi sao?`)."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000138
    terms: []
    pronouns_and_address: "Vị tư lệnh quân đoàn tự xưng `tôi`, quy chiếu khái niệm bão lửa bằng `nó`."
    pov_and_voice: "Giọng trả lời ngắn gọn, thành thật trong cuộc họp."
    modality_and_logic: "Bảo toàn từ phủ định mở đầu (`Không`) và xác nhận đây là lần đầu nghe nói đến hiện tượng này."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000139
    terms:
      - "hỏa hoạn quy mô lớn"
    pronouns_and_address: "Dùng chủ ngữ khái quát `người ta` cho chủ thể kiểm chứng ý tưởng."
    pov_and_voice: "Giọng giải thích mang tính kỹ thuật – lịch sử của viên sĩ quan Tác chiến."
    modality_and_logic: "Bảo toàn trình tự thời gian và phương thức: đề xuất được đưa ra sau khi ý tưởng đã được kiểm chứng thông qua việc xem xét các vụ hỏa hoạn quy mô lớn trong quá khứ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000140
    terms:
      - "Chiến tranh đô thị"
      - "ràng buộc pháp lý"
      - "quân đội"
    pronouns_and_address: "Quy chiếu các ràng buộc pháp lý bằng `những ràng buộc ấy` / `chúng`."
    pov_and_voice: "Giọng trần thuật phân tích sự trượt chuẩn giữa mục tiêu nghiên cứu ban đầu và phương án thực tế."
    modality_and_logic: "Bảo toàn 2 câu và sự đối lập cốt lõi: chiến tranh đô thị có nhiều ràng buộc pháp lý; đề tài nghiên cứu vốn là cách quân đội xử lý những ràng buộc ấy, nhưng chẳng ai ngờ lại đi tìm một kế hoạch xóa bỏ luôn chúng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000141
    terms:
      - "binh sĩ"
      - "quân đội"
      - "khuynh hướng bài trí thức"
      - "nguyên tắc pháp lý"
    pronouns_and_address: "Quy chiếu các binh sĩ bằng `họ`; lược đại từ ngôi thứ hai phiếm chỉ trong cấu trúc nhận định khách quan (`có thể gọi...`, `có thể bảo...`)."
    pov_and_voice: "Giọng trần thuật mổ xẻ tâm lý ngại va chạm luật lệ của giới quân nhân."
    modality_and_logic: "Bảo toàn đủ 3 câu: ngoài giới chuyên môn ra thì chẳng binh sĩ nào muốn đối mặt với luật lệ; hai góc nhìn đánh giá (nói nhẹ nhàng là đơn thuần, nói tiêu cực là quân đội có khuynh hướng bài trí thức); và hệ quả là họ không quen nghe giải thích về các nguyên tắc pháp lý."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000142
    terms:
      - "quy tắc giao chiến"
      - "dân thường"
      - "con tin"
    pronouns_and_address: "Dùng `anh` cho đại từ ngôi thứ hai giả định ở câu hỏi giữa đoạn; quy chiếu các con tin bằng `họ`."
    pov_and_voice: "Giọng phân tích đối sánh sắc lạnh giữa lẽ thường của người bình thường và tư duy quân sự."
    modality_and_logic: "Bảo toàn đủ 3 câu: quy tắc giao chiến vốn phần nào hiển nhiên với người lính và việc bắn bừa bãi dân thường chẳng khác nào cảnh sát bắn cả con tin lẫn tội phạm; câu hỏi tu từ rằng dù bắt thủ phạm là ưu tiên cao nhất nhưng liệu có nghĩ ra kế hoạch thủ tiêu con tin thay vì cứu họ không; và câu kết nghịch lý rằng những ý tưởng người bình thường hoàn toàn không thể nghĩ tới lại là lẽ thường của người lính."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000143
    terms:
      - "tư duy quân sự"
      - "đạo đức"
      - "chuẩn mực luân lý"
    pronouns_and_address: "Quy chiếu giới quân sự bằng đại từ sở hữu `của họ`."
    pov_and_voice: "Giọng bình luận khách quan chỉ ra độ trễ của đạo đức quân sự."
    modality_and_logic: "Bảo toàn quan hệ nhân quả và mức độ tình thái (`thường có phần lỗi thời`, `tất yếu dựa vào`): vấn đề nhạy cảm trong tư duy quân sự là đạo đức và chuẩn mực luân lý thường lỗi thời do tiêu chuẩn tất yếu tham chiếu các cuộc chiến thời đại trước."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000144
    terms:
      - "hợp lý"
      - "tính hợp lý trong việc đạt mục đích"
    pronouns_and_address: "Trần thuật khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng đúc kết bản chất cực đoan của đề xuất."
    modality_and_logic: "Bảo toàn sự chuyển ý từ nhận định chung (`nhìn chung lối suy nghĩ của người lính khá hợp lý`) sang đánh giá mức độ cực đoan của phương án này (`chỉ chăm chăm theo đuổi tính hợp lý trong việc đạt mục đích đến mức trở nên dị thường`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000145
    terms:
      - "chiến dịch"
      - "pháp sư"
      - "đòn tấn công lửa"
    pronouns_and_address: "Quy chiếu nhóm nghiên cứu bằng `họ`."
    pov_and_voice: "Giọng báo cáo tiếp nối của viên sĩ quan Tác chiến."
    modality_and_logic: "Bảo toàn mức độ dè dặt (`Có vẻ họ đã đi đến một kết luận`) và điều kiện tối ưu (`lý tưởng nhất là chiến dịch sẽ do các pháp sư tiến hành bằng những đòn tấn công lửa`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000146
    terms: []
    pronouns_and_address: "Câu mệnh lệnh và câu hỏi của vị tư lệnh quân đoàn lược đại từ."
    pov_and_voice: "Giọng hỏi thực tế, gạt qua phần lý thuyết."
    modality_and_logic: "Bảo toàn hai câu ngắn: yêu cầu tạm gác lý thuyết và hỏi xem kế hoạch đã được áp dụng vào thực tế chưa."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000147
    terms:
      - "thao trường của quân đội"
      - "đòn tấn công bằng lửa"
    pronouns_and_address: "Dùng chủ ngữ khái quát `người ta` ở câu 1; quy chiếu hiện tượng bão lửa bằng `nó` ở cuối câu 2."
    pov_and_voice: "Giọng báo cáo kết quả thực nghiệm tại thao trường của viên sĩ quan Tác chiến."
    modality_and_logic: "Bảo toàn chính xác mức độ kết quả thực nghiệm (đạt được hiện tượng gần với kết quả dự kiến khi thử nghiệm tại thao trường) và câu điều kiện khẳng định tính khả thi (nếu phối hợp tấn công bằng lửa từ nhiều vị trí thì hoàn toàn có thể tạo ra nó)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000148
    terms:
      - "vị tư lệnh quân đoàn"
      - "quân đội"
    pronouns_and_address: "Quy chiếu vị tư lệnh quân đoàn bằng danh xưng chức vụ kết hợp đại từ phản thân sở hữu `mình` (`quân đội mình`)."
    pov_and_voice: "Giọng trần thuật khắc họa nỗi kinh hãi của vị tư lệnh quân đoàn khi hiểu trọn hàm ý kế hoạch."
    modality_and_logic: "Bảo toàn quan hệ thời gian – tâm lý: đến khi hiểu ra, vị tư lệnh quân đoàn mới thấy sợ hãi trước kế hoạch mà quân đội mình nhận được."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000149
    terms: []
    pronouns_and_address: "Câu cảm thán nội tâm của vị tư lệnh quân đoàn không dùng đại từ nhân xưng."
    pov_and_voice: "Tiếng thở dài kinh hoàng trong nội tâm vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu `…` và lời cảm thán."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000150
    terms: []
    pronouns_and_address: "Độc thoại nội tâm trực tiếp của vị tư lệnh quân đoàn tự quy chiếu bằng `mình` (lựa chọn tự quy chiếu nội tâm cục bộ tại chỗ, không mở rộng quy ước `DEC-P01-001` của Tanya)."
    pov_and_voice: "Giọng tự vấn đầy dằn vặt của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn phép điệp từ nghi vấn (`Tại sao, tại sao`) và câu hỏi bắt buộc phải làm chuyện này."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000151
    terms:
      - "quỷ dữ"
    pronouns_and_address: "Độc thoại nội tâm trực tiếp của vị tư lệnh quân đoàn tiếp tục tự quy chiếu bằng `mình`."
    pov_and_voice: "Giọng độc thoại nội tâm bi phẫn trước mệnh lệnh."
    modality_and_logic: "Bảo toàn cấu trúc bị động (`bị ra lệnh thực hiện`) và định ngữ (`một kế hoạch do quỷ dữ nghĩ ra`)."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000152
    terms:
      - "sĩ quan Tình báo"
      - "đại úy"
      - "Tanya"
    pronouns_and_address: "Sau khoảng ngắt cảnh (`space-break1`), mạch truyện chuyển về điểm nhìn của Tanya: phần nội tâm tự quy chiếu dùng `mình`, quy chiếu viên đại úy Tình báo bằng `anh ta`; phần trần thuật ngôi thứ ba gọi tên riêng `Tanya` theo đúng `DEC-P01-001`."
    pov_and_voice: "Sự đan xen đặc trưng giữa độc thoại nội tâm sắc lạnh và lời kể ngôi thứ ba của Tanya."
    modality_and_logic: "Bảo toàn trình tự 3 câu: đáp lại lệnh triệu tập khẩn và được một sĩ quan Tình báo hàm đại úy ra đón -> kết luận nội tâm rằng hẳn anh ta mang tin xấu đến -> Tanya hít sâu chuẩn bị tinh thần."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh mệnh đề kết luận nội tâm (`*hẳn anh ta là người mang tin xấu đến.*`) tương ứng thẻ `<html:em>`, giữ cụm nối `Nói cách khác,` và các câu còn lại ngoài dấu nhấn mạnh."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000153
    terms: []
    pronouns_and_address: "Câu tự nhắc nhở trong nội tâm của Tanya lược đại từ chủ ngữ."
    pov_and_voice: "Giọng tự kỷ luật điềm tĩnh của Tanya."
    modality_and_logic: "Bảo toàn mệnh lệnh tự nhắc phải luôn bình tĩnh và điềm đạm."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000154
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya không dùng đại từ nhân xưng."
    pov_and_voice: "Nhịp câu ngắn, gấp, cắt ngang sự bình tĩnh vừa tạo dựng."
    modality_and_logic: "Bảo toàn đủ 3 câu: ý nghĩ ấy lập tức tan biến; mức độ gây chấn động của tin tức; và cụm danh từ bỏ lửng mở đường cho lời thoại kế tiếp (`Cái tin rằng…`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000155
    terms:
      - "Hậu phương"
    pronouns_and_address: "Câu báo cáo của viên đại úy Tình báo không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng thông báo ngắn gọn, nghiêm trọng."
    modality_and_logic: "Bảo toàn thông tin cốt lõi: hậu phương đã bị cắt đứt."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000156
    terms:
      - "tiền bối"
    pronouns_and_address: "Nội tâm của Tanya tự quy chiếu bằng `mình`; câu trích dẫn lời khuyên lược đại từ ngôi thứ hai phiếm chỉ."
    pov_and_voice: "Giọng hồi tưởng chiêm nghiệm của Tanya."
    modality_and_logic: "Bảo toàn lời dẫn về vị tiền bối và nội dung lời khuyên khi nhận tin xấu phải xem có tìm được điểm sáng nào trong đó hay không."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh phần lời khuyên trong ngoặc kép tương ứng thẻ `<html:em>`, giữ lời dẫn đầu câu ở chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000157
    terms: []
    pronouns_and_address: "Nội tâm của Tanya tự quy chiếu bằng `mình` theo `DEC-P01-001`."
    pov_and_voice: "Giọng tự thuật kiên định."
    modality_and_logic: "Bảo toàn tính liên tục từ thời điểm đó đến hiện tại: vẫn luôn làm theo lời khuyên ấy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000158
    terms:
      - "sở chỉ huy hậu phương"
    pronouns_and_address: "Nội tâm của Tanya tự quy chiếu bằng `mình` ở cả hai mệnh đề."
    pov_and_voice: "Giọng hài hước đen tối, thực dụng đặc trưng của Tanya khi tìm 'điểm sáng' giữa tin dữ."
    modality_and_logic: "Bảo toàn ví dụ thực tế và giả định trái thực tế: đang cầm tách cà phê thật (món quà từ sở chỉ huy hậu phương) và mừng vì chưa uống, bởi nếu phun ra hay sặc thì sẽ rất phí món đồ quý giá ấy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000159
    terms:
      - "hậu phương"
      - "Tuyến tiếp tế"
    pronouns_and_address: "Câu hỏi nội tâm của Tanya không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng sững sờ khi nhận thức mức độ nguy ngập về hậu cần."
    modality_and_logic: "Bảo toàn dấu `…` mở đầu và hai câu hỏi liên tiếp xoáy vào việc hậu phương và tuyến tiếp tế bị cắt đứt."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000160
    terms:
      - "Thiếu tá von Degurechaff"
      - "cuộc nổi dậy của du kích"
    pronouns_and_address: "Viên đại úy Tình báo gọi Tanya bằng quân hàm và họ `Thiếu tá von Degurechaff`."
    pov_and_voice: "Giọng báo cáo quân sự chuẩn mực."
    modality_and_logic: "Bảo toàn lời xác nhận (`Vâng, Thiếu tá von Degurechaff.`) và nguyên nhân là một cuộc nổi dậy của du kích."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000161
    terms: []
    pronouns_and_address: "Câu hỏi thảng thốt của Tanya không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng sửng sốt trước thời điểm nổ ra bạo loạn."
    modality_and_logic: "Bảo toàn câu hỏi cảm thán ngắn về thời điểm (`Ngay lúc này ư?!`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000162
    terms:
      - "giới lãnh đạo Cộng hòa"
      - "Hậu phương"
      - "Hậu cần"
      - "đạo quân"
    pronouns_and_address: "Nội tâm của Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình`, và quy chiếu toàn quân Đế quốc bằng đại từ gộp `chúng ta`."
    pov_and_voice: "Nhịp câu dồn dập, phân tích chuỗi sụp đổ dây chuyền cấp chiến dịch."
    modality_and_logic: "Bảo toàn đủ 4 câu và đúng mức độ khả thể ở câu cuối: nghĩ ngay tới giới lãnh đạo Cộng hòa -> hậu phương bị cắt đứt -> hậu cần sụp đổ -> nếu chuyện đó xảy ra, cả đạo quân của chúng ta có thể tháo chạy trong hoảng loạn (không tự thêm nguyên nhân bị địch đánh bật)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000163
    terms:
      - "Phong trào du kích"
      - "hậu phương"
      - "lực lượng chủ lực"
      - "Lục quân Đế quốc"
      - "giới Cộng hòa"
      - "đám du kích"
    pronouns_and_address: "Độc thoại nội tâm phân tích khách quan, không dùng đại từ nhân xưng ngôi thứ nhất."
    pov_and_voice: "Giọng phân tích chiến lược sắc bén, sử dụng chuỗi ẩn dụ lửa – dầu – phóng hỏa."
    modality_and_logic: "Bảo toàn đủ 5 câu cùng hai cấu trúc phủ định kép khẳng định tính tất yếu: đến trẻ con cũng hình dung được -> câu hỏi tóm tắt tình thế phong trào du kích mạnh lên ở điểm chiến lược hậu phương khi chủ lực Lục quân Đế quốc bị ghìm chân -> chẳng đời nào giới Cộng hòa không đổ thêm dầu vào đám cháy nhỏ ấy -> được rót thêm dầu rồi thì đám du kích chắc chắn càng hăng máu phóng hỏa -> logic quá rõ ràng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000164
    terms: []
    pronouns_and_address: "Độc thoại nội tâm khái quát không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng dự báo bi quan nhưng tỉnh táo của Tanya."
    modality_and_logic: "Bảo toàn đủ 3 câu: chắc chắn một đám cháy lớn sắp bùng lên; tình thế bất lợi thường nhanh chóng xấu đi; và ngoại lệ chỉ đếm trên đầu ngón tay."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000165
    terms: []
    pronouns_and_address: "Viên đại úy Tình báo đáp `Vâng, ngay lúc này, thưa bà.` (tạm giữ cách dịch literal `thưa bà`, hoặc `thưa Thiếu tá` ở bước polish)."
    pov_and_voice: "Giọng xác nhận ngắn gọn, nghiêm túc."
    modality_and_logic: "Bảo toàn đầy đủ lời xác nhận cả ý lẫn mốc thời gian (`Vâng, ngay lúc này`) đáp lại câu hỏi ở `p000161`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000166
    terms: []
    pronouns_and_address: "Nội tâm của Tanya tự quy chiếu bằng `mình` theo `DEC-P01-001`."
    pov_and_voice: "Giọng chửi thề thô ráp trong nội tâm khi cực kỳ bức bối trước tình thế chiến cuộc."
    modality_and_logic: "Bảo toàn đúng đối tượng bị nguyền rủa là `tình cảnh này` và giữ nguyên mức độ tục tĩu của câu gốc (`đi mà ăn cứt`), không làm mềm giọng và không thêm chữ nghiêng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000167
    terms:
      - "Tanya"
      - "bộ chỉ huy"
      - "cấp dưới"
      - "sĩ quan"
    pronouns_and_address: "Tuân thủ nghiêm ngặt `DEC-P01-001`: phần trần thuật ngôi thứ ba quy chiếu bằng tên riêng `Tanya` (không dùng đại từ `cô`), phần độc thoại nội tâm tự quy chiếu bằng `mình`; quy chiếu các sĩ quan khác bằng `họ`."
    pov_and_voice: "Sự hòa quyện giữa quan sát ngoại cảnh, tự quan sát bản thân với chút tự giễu bình thản lạ lùng, và suy nghĩ về hình ảnh trước cấp dưới."
    modality_and_logic: "Bảo toàn đủ 5 câu cùng các sắc thái tình thái (`Chắc`, `Có lẽ`, `chỉ biết mong vậy thôi`, `có lẽ họ cũng ngại vì vẻ mặt ấy`)."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh mệnh đề độc thoại nội tâm `*Chắc trông mình cũng y hệt*` tương ứng thẻ `<html:em>`, giữ toàn bộ phần trần thuật và các câu suy nghĩ còn lại ở chữ thường."
