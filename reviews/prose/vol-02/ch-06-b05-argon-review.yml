findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000142
    category: pronoun_register_consistency
    issue: >-
      Tại câu hỏi tu từ thứ hai của `p000142`, đại từ ngôi thứ hai phiếm chỉ trong giả định so sánh với cảnh sát giải cứu con tin đang được dịch là `anh` (`nhưng liệu anh có nghĩ ra kế hoạch thủ tiêu con tin thay vì cứu họ không?`), trong khi ở đoạn liền trước (`p000141`) cấu trúc ngôi thứ hai phiếm chỉ được lược chủ ngữ.
    basis: >-
      Cách dùng `anh` trong câu hỏi giả định đối thoại với độc giả vẫn tự nhiên và giữ nguyên hoàn toàn nội dung so sánh cũng như nghịch lý ở câu kết đoạn; tuy nhiên chủ ngữ khái quát `người ta` / `ai` hoặc lược chủ ngữ sẽ trung tính hơn theo quy ước `direct-address choice` trong `pending-terms.yml`.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc cân nhắc đổi sang `nhưng liệu có ai lại nghĩ ra kế hoạch thủ tiêu con tin thay vì cứu họ không?` / `nhưng liệu người ta có đi tới một kế hoạch...`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000165
    category: address_register
    issue: >-
      Tại `p000165`, từ hô gọi kính trọng dành cho sĩ quan chỉ huy nữ (`ma’am`) trong lời đáp của viên đại úy Tình báo với Thiếu tá Tanya von Degurechaff đang được dịch sát nghĩa bề mặt là `thưa bà`.
    basis: >-
      Lựa chọn `thưa bà` đã được ghi nhận trong self-check như phương án tạm bám sát từ vựng tại chỗ để không tự thêm cấp bậc không xuất hiện ngay trong câu `p000165`; dù vậy, vì chính viên đại úy này vừa gọi `Thiếu tá von Degurechaff` ở `p000160`, cách thưa theo điều lệnh quân đội Đế quốc (`thưa Thiếu tá`) cũng có căn cứ ngữ cảnh trực tiếp trong cùng phân cảnh.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên `thưa bà` như lựa chọn literal tạm thời hoặc đồng bộ với `p000160` thành `thưa Thiếu tá`.
    resolution: optional_polish

