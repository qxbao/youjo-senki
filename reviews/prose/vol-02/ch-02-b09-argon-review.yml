  volume: vol-02
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, cấp bậc, hô hiệu, đơn vị đo độ cao và thuật ngữ quân sự – ma pháp đã khóa tạm tại `work/run-state/pending-terms.yml#chapter2_b09_translation_proposals` và `handoffs/vol-02/ch-02-b09.yml` (`Tiểu đoàn Viper`, `Viper 02`, `Trung úy`, `Sở chỉ huy`, `thuật thức`, `thuật thức bắn tỉa tầm xa`, `giành ưu thế trên không`, `Kho Kraggana`, giữ nguyên đơn vị `foot` ở p000201, p000206, p000216 và giữ số trần không kèm đơn vị ở p000199, p000208)."
  uncertainty: low
