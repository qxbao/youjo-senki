      - Trần thuật ngôi thứ ba giữ tên riêng "Tanya" và đại từ "nó" (DEC-P01-001)
    pov_and_logic:
      - Giữ nguyên phép so sánh lượng hỏa lực (pháo hạm của một thiết giáp hạm bắn ra lượng sắt nhiều hơn hẳn cả một sư đoàn bộ binh) và hai tầng phòng thủ kết hợp (hỏa lực phòng không dày đặc như lông nhím cùng các pháp sư thủy quân lục chiến đánh chặn)
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000130
    names_and_ranks:
      - U.S. ships -> các tàu của Hợp chúng quốc
      - Marianas -> quần đảo Mariana
    pronouns_and_address:
      - Quy chiếu các chiến hạm Liên minh Entente bằng "chúng"
    pov_and_logic:
      - Giữ sắc thái phỏng đoán ("có lẽ dễ tiếp cận hơn...") và câu kết mở về mức độ chênh lệch ("Chỉ là dễ hơn đến mức nào thôi.")
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000131
    names_and_ranks:
      - General Staff -> Bộ Tổng tham mưu
      - Entente Alliance fleet -> hạm đội Liên minh Entente
    pronouns_and_address:
      - Lời thuyết trình của Trung úy Weiss kèm câu hỏi tu từ tương tác với cử tọa ("Rõ như ban ngày, phải không?")
    pov_and_logic:
      - Giữ kết luận phân tích của Bộ Tổng tham mưu rằng đây là những lực lượng chủ lực còn lại của hạm đội Liên minh Entente đang tìm cách tháo chạy
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000132
    names_and_ranks:
      - Republic -> Cộng hòa
      - Commonwealth -> Khối Thịnh vượng chung
      - imperial pursuit -> quân Đế quốc truy kích
    pronouns_and_address:
      - Nội tâm Tanya dùng "Chúng ta" cho phía Đế quốc và "chúng" cho hạm đội Liên minh Entente đang tháo chạy
    pov_and_logic:
      - Giữ hai khả năng lộ trình đối lập (đường thẳng tới Cộng hòa hoặc đường vòng vèo tới Khối Thịnh vượng chung) và mục đích của hai phía (cắt đuôi truy kích tẩu thoát đối lập với xác định vị trí và tiêu diệt)
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000133
    names_and_ranks:
      - Commonwealth Navy -> Hải quân Khối Thịnh vượng chung
      - territorial waters / imperial waters -> lãnh hải của ta / lãnh hải Đế quốc
    pronouns_and_address:
      - Nội tâm Tanya dùng "Chúng ta" / "Ta" / "ta" cho phía Đế quốc và "họ" cho phía Hải quân Khối Thịnh vượng chung
    pov_and_logic:
      - Bảo toàn thế giằng co ngoại giao – quân sự hai chiều: một mặt đơn vị được thông báo phải tránh bắn lạc, mặt khác Đế quốc cũng đã cảnh báo bất kể chuyện gì xảy ra ngoài khơi, hễ xâm phạm lãnh hải Đế quốc thì sẽ bị bắn
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000134
    names_and_ranks:
      - Fleet Command -> Bộ Tư lệnh Hạm đội
      - Entente Alliance vessels -> các tàu của Liên minh Entente
      - General Staff -> Bộ Tổng tham mưu
    pronouns_and_address:
      - Lời phổ biến của Trung úy Weiss dùng "đơn vị chúng ta" cho Tiểu đoàn 203 và "họ" cho các chiến hạm của Bộ Tư lệnh Hạm đội
    pov_and_logic:
      - Phân biệt rõ mệnh lệnh của Bộ Tư lệnh Hạm đội cho các chiến hạm (tìm diệt tàu Liên minh Entente) và mệnh lệnh của Bộ Tổng tham mưu cho tiểu đoàn (hỗ trợ họ)
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000135
    names_and_ranks:
      - Lieutenant Weiss -> Trung úy Weiss
    pronouns_and_address:
      - Độc thoại nội tâm ngôi thứ nhất của Tanya: quy chiếu Weiss bằng "anh ta", tự quy chiếu bằng "mình" (DEC-P01-001)
    pov_and_logic:
      - Giữ nguyên lý do mang màu sắc công sở của Tanya khi tiếp lời Weiss (không muốn trông như nhận lương mà không làm gì)
    emphasis:
      - Giữ nguyên dấu nhấn mạnh Markdown `*hỗ trợ*` đúng vị trí từ in nghiêng trong nguồn theo DEC-P01-002
  - segment_id: YS-LN02/Text/part0022.xhtml/p000136
    names_and_ranks:
      - Battalion -> Tiểu đoàn
      - Reconnaissance Mage Task Force 2 -> Lực lượng đặc nhiệm Pháp sư Trinh sát 2
      - Northern Sea Fleet Command -> Bộ tư lệnh Hạm đội Biển Bắc
    pronouns_and_address:
      - Tanya phát biểu trước toàn đơn vị: gọi "Tiểu đoàn", quy chiếu Trung úy Weiss bằng "anh ấy", dùng "chúng ta" cho tiểu đoàn và "họ" cho tàu của quốc gia trung lập
    pov_and_logic:
      - Giữ dấu nháy đơn mang sắc thái mỉa mai quanh cụm `‘quốc gia trung lập’` và chỉ thị không được bắn trúng họ
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000137
    names_and_ranks:
      - scouts -> các trinh sát
      - Commonwealth -> Khối Thịnh vượng chung
      - Entente Alliance -> Liên minh Entente
    pronouns_and_address:
      - Độc thoại nội tâm của Tanya dùng "ta" cho phía Đế quốc và "họ" cho phía Khối Thịnh vượng chung đang tập trận
    pov_and_logic:
      - Giữ trọn mạch suy nghĩ ba vế: thông cảm với sự vất vả của lực lượng trinh sát dưới trời mưa, nhận xét sự trái khoáy khi phải cử đơn vị canh chừng cuộc tập trận của Khối Thịnh vượng chung trong lúc đang tìm Liên minh Entente, và quyết định giữ kín nhận xét đó để không làm giảm sĩ khí
    emphasis: none
