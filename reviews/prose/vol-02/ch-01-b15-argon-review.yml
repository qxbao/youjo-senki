  proposed_vi: "tiền tuyến, hậu phương (part0012/p000020, p000031) / Tướng von Rudersdorf, Rudersdorf, những người phụ trách đầu máy toa xe, Cục Hậu cần, hậu cần, Norden (part0012/p000021, p000030, p000031, p000034, p000035) / Tướng von Zettour, Zettour, tuyến tiếp tế đường biển (part0012/p000022, p000023, p000026, p000030, p000034) / các tuyến hàng hải, cảng, tàu buôn, trưng dụng, cơ sở cảng, đổ bộ (part0012/p000023, p000027) / kiểm soát được biển, cuộc giao tranh nhỏ, chiến dịch đổ bộ, phòng tuyến địch, đơn vị (part0012/p000025) / tổn thất, chiến dịch (part0012/p000026, p000029) / Đế quốc, tiếp tế và tác chiến, Hải quân Đế quốc, các tuyến tiếp tế (part0012/p000027, p000028) / eo biển hẹp, tuyến tiếp tế quy mô lớn (part0012/p000028) / phòng tuyến Liên minh Entente, Liên minh Entente, liên lạc (part0012/p000029, p000031, p000034, p000035) / chiến lược (part0012/p000030, p000034) / sức mạnh quốc gia, Dacia, Lục quân Đế quốc, binh sĩ (part0012/p000031, p000035) / nước Cộng hòa (part0012/p000032) / mặt trận (part0012/p000033, p000034) / Cục Tác chiến, gánh nặng hậu cần (part0012/p000034)"
  alternatives_vi:
