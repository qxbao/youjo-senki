  - "Giữ tên riêng `Zettour`, đại từ trần thuật `ông`, cặp đại từ đối thoại `ông` – `tôi` (đặc biệt là `Nếu cần, tôi có thể điều một con tàu gần ba trăm nghìn tấn tới một cơ sở cảng nào đó ở phía bắc để tiến hành đổ bộ` đã sửa theo signoff), đại từ gộp `ta`, và các thuật ngữ `các tuyến hàng hải`, `cảng`, `tàu buôn`, `trưng dụng`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000024
  locks:
  - "Giữ đại từ `ông` và giọng đối đáp của Rudersdorf `“Vậy là quyết định thế nhé? Giá mà ông nói thế ngay từ đầu.”`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000025
  locks:
  - "Giữ đại từ `Tôi` và `ta`, điều kiện giả định `chỉ có giá trị với giả định rằng ta kiểm soát được biển`, cấu trúc tương phản – phủ định `Tôi có thể chấp nhận một hai cuộc giao tranh nhỏ, nhưng không muốn đánh cược vào một chiến dịch đổ bộ sâu sau phòng tuyến địch, có nguy cơ mất cả một đơn vị lẫn một con tàu`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000026
  locks:
  - "Giữ tên riêng `Zettour`, đại từ `Ông`, và phép so sánh mức độ quan ngại `Ông lo về những tổn thất có thể xảy ra hơn là khả năng chiến dịch thành công`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000027
  locks:
