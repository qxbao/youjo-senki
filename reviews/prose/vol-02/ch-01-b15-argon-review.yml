  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, quốc gia, địa danh và thuật ngữ quân sự đã khóa tạm từ Tập 1 cùng B01–B14 của Tập 2 (`Tướng von Rudersdorf`, `Rudersdorf`, `Tướng von Zettour`, `Zettour`, `Norden`, `Dacia`, `Đế quốc`, `Hải quân Đế quốc`, `Lục quân Đế quốc`, `Liên minh Entente`, `nước Cộng hòa`, `cơ sở cảng`, `hậu cần`, `tác chiến`, `chiến lược`, `tiền tuyến`, `hậu phương`, `binh sĩ`), đồng thời khóa tạm cặp cơ quan tham mưu ngang cấp và thuật ngữ vận tải – hải quân đã signoff trong B15 (`Cục Hậu cần`, `Cục Tác chiến`, `những người phụ trách đầu máy toa xe`, `tuyến tiếp tế đường biển`, `các tuyến hàng hải`, `tàu buôn`, `chiến dịch đổ bộ`, `eo biển hẹp`, `sức mạnh quốc gia`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: zettour_and_rudersdorf_strategic_debate_pronouns_and_address_vol02_ch01_b15
  proposed_vi: "Trong phân cảnh thảo luận chiến lược giữa hai vị tướng tại nhà ăn Bộ Tổng tham mưu (part0012/p000019–p000035): tiếp nối B14, trần thuật ngôi thứ ba quy chiếu Zettour và Rudersdorf bằng tên riêng `Zettour`, `Rudersdorf` và đại từ `ông` / `Ông` (part0012/p000023, p000026, p000030, p000031, p000034), hoặc `hai người đàn ông` / `họ` khi quy chiếu chung (part0012/p000020); quy chiếu phía Đế quốc / Hải quân Đế quốc / Lục quân Đế quốc / Liên minh Entente ở ngôi thứ ba số nhiều bằng `họ` theo đúng ngữ cảnh từng câu (part0012/p000027–p000029, p000031, p000032). Trong đối thoại trực tiếp giữa Rudersdorf (Tác chiến: p000019, p000022, p000024, p000029, p000033) và Zettour (Hậu cần: p000021, p000023, p000025, p000032, p000035): cả hai xưng `tôi` xuyên suốt ở ngôi thứ nhất số ít (đã đồng bộ `tôi có thể điều` tại p000023 theo signoff), gọi nhau trọng thị ngang hàng bằng `ông` và danh xưng cấp bậc `Tướng von Rudersdorf` / `Tướng von Zettour` (p000021, p000022), đồng thời dùng đại từ gộp `ta` khi chỉ chung phía quân đội Đế quốc (`các tuyến hàng hải của ta`, `mà ta có thể trưng dụng`, `ta kiểm soát được biển`, `Hay ta bỏ qua họ` tại p000023, p000025, p000032)"
  alternatives_vi:
  - ta ở ngôi thứ nhất số ít (thay cho `tôi` trong câu `Nếu cần, tôi có thể điều một con tàu...` của Zettour tại part0012/p000023 — bác bỏ theo m1 đã sửa trong signoff để tránh lẫn với đại từ gộp `ta` = `chúng ta` và giữ nhất quán tuyệt đối ngôi tự xưng `tôi` của Zettour tại p000021, p000023, p000025, p000032) / anh – tôi (thay cho `ông` – `tôi` giữa Zettour và Rudersdorf tại part0012/p000019–p000035 — ưu tiên `ông` – `tôi` để giữ phong thái đĩnh đạc của hai tướng lĩnh cao cấp trong Bộ Tổng tham mưu, nối tiếp trực tiếp B14)
