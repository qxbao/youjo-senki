  volume: vol-02
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các lựa chọn đã sửa, signoff trong `handoffs/vol-02/ch-01-b15.yml`, duy trì nhất quán cặp đại từ đối thoại ngang hàng `tôi` – `ông`, danh xưng `Tướng von Rudersdorf` / `Tướng von Zettour`, đại từ gộp `ta` cho phía Đế quốc và đại từ trần thuật `ông` tiếp nối liền mạch từ B14."
