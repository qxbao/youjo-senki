- segment_id: YS-LN02/Text/part0012.xhtml/p000028
  locks:
  - "Giữ danh xưng `Đế quốc`, đại từ `họ`, các thuật ngữ `những eo biển hẹp`, `tuyến tiếp tế quy mô lớn`, và cấu trúc phủ định giới hạn `không còn lựa chọn nào ngoài việc bi quan về khả năng thiết lập một tuyến tiếp tế quy mô lớn`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000029
  locks:
  - "Giữ đại từ `Ông` và `họ`, cụm `những tổn thất trên giấy`, và các thuật ngữ `phòng tuyến Liên minh Entente`, `cắt đứt liên lạc của họ`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000030
  locks:
  - "Giữ tên riêng `Rudersdorf`, `Zettour`, và cụm đối chiếu `lạc quan gần như đến mức bất cẩn nếu so với những mối bận tâm chiến lược của Zettour`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000031
  locks:
  - "Giữ các danh xưng `Liên minh Entente`, `Dacia`, `Rudersdorf`, `Lục quân Đế quốc`, các thuật ngữ `tiền tuyến giằng co`, `sức mạnh quốc gia`, `vùng hậu phương`, `binh sĩ`, và điều kiện giả định `nhưng nếu Lục quân Đế quốc chiếm được một vùng hậu phương như cách binh sĩ của họ từng giày xéo Dacia, thì ngay cả Liên minh Entente cũng sẽ tự sụp đổ`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000032
  locks:
  - "Giữ đại từ `Tôi`, `họ`, `ta`, danh xưng `nước Cộng hòa`, hai cấu trúc phủ định `Tôi không thể phủ nhận`, `tôi không nghĩ họ còn là mối đe dọa lớn`, và câu hỏi đề xuất `Hay ta bỏ qua họ và kết liễu nước Cộng hòa đi?`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000033
  locks:
  - "Giữ câu bỏ lửng có cấu trúc so sánh phủ định `“Không gì tốt hơn việc giảm số mặt trận, nhưng…”`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000034
  locks:
  - "Giữ danh xưng `Liên minh Entente`, tên riêng `Zettour`, hai cơ quan đối xứng đã đồng bộ ở cả câu đầu và câu cuối theo final signoff `Cục Tác chiến` và `Cục Hậu cần`, phủ định `Zettour không nghĩ tiến quân lên phía bắc sẽ giúp giảm bớt gánh nặng hậu cần`, và các thuật ngữ `gánh nặng hậu cần`, `mặt trận`, `tình hình chiến lược`."
- segment_id: YS-LN02/Text/part0012.xhtml/p000035
  locks:
  - "Giữ danh xưng `Liên minh Entente`, đại từ đối thoại `ông`, các thuật ngữ `góc độ hậu cần`, `binh sĩ`, và hai cấu trúc phủ định `chẳng hề nhẹ`, `Dù không bắn một viên đạn nào, binh sĩ vẫn chết đói nếu không được ăn, ông biết đấy`."
