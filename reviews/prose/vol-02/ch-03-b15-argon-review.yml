  rationale: "Kế thừa đồng bộ toàn bộ các lựa chọn thuật ngữ quân sự, hải quân, đơn vị và trang bị đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b15_translation_proposals` cùng `handoffs/vol-02/ch-03-b15.yml` (`các pháp sư thủy quân lục chiến` / `các chỉ huy trung đoàn thủy quân lục chiến`, `trang bị nhảy dù`, `nhảy dù`, `chiến dịch đổ bộ` / `lực lượng đổ bộ`, `Tiểu đoàn Pháp sư Không quân 203` / `pháp sư không quân`, `vịnh hẹp`), bảo toàn trọn vẹn cả 3 bản sửa mức vừa đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b15-fixes-signoff-claude.md`."
  uncertainty: low
