  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, phân tách rạch ròi giữa trần thuật (`Tanya`, `nó` / `Nó`), độc thoại nội tâm tự quy chiếu (`Mình` / `mình`, `chúng ta` / `chúng tôi`), đối thoại quân sự với cấp trên (`tôi` / `thưa ngài` – `ta` / `Thiếu tá` / `cô`), và lời chỉ huy cấp dưới (`Tôi` / `tôi` – `Các anh chị` / `Tất cả`, `chúng ta`)."
