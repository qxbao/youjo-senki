  proposed_vi: "Trong phần kết cuộc thương lượng xin quyền đề nghị hủy chiến dịch trên soái hạm và phân cảnh Tiểu đoàn Pháp sư Không quân 203 trên máy bay vận tải chuẩn bị nhảy dù xuống Osfjord (part0018/p000191–p000214): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa đã được nghiệm thu trong `handoffs/vol-02/ch-03-b15.yml`: (1) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000197–p000200, p000203, p000206, p000207, p000209, p000214), quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` / `Nó` và đại từ phản thân `mình` (p000206, p000209) đúng chuẩn `DEC-P01-001`; quy chiếu các pháp sư Tiểu đoàn 203 bằng `họ` (p000200, p000203, p000208, p000209) và quy chiếu lực lượng / công sự địch bằng `chúng` (p000200, p000201). (2) Trong độc thoại nội tâm của Tanya (p000191, p000193–p000195, p000204, p000208, p000210, p000212), nhất quán dùng `Mình` / `mình` cho ngôi thứ nhất số ít tự quy chiếu (p000191, p000193, p000212), dùng `chúng ta` (p000191, p000210) và `chúng tôi` (p000204, kèm tên riêng `Tanya` ở câu cuối p000204) cho ngôi thứ nhất số nhiều chỉ đơn vị đang thực hiện nhiệm vụ, quy chiếu vị sĩ quan chỉ huy đối thoại bằng `ông ấy` / `Ông ấy` (p000191, p000193, p000195), và giữ chuẩn xác nghĩa `một mình rơi vào cảnh đó` tại p000212 theo bản sửa đã nghiệm thu. (3) Trong lời thoại trực tiếp: với vị chỉ huy chiến dịch (p000192, p000193, p000196), người chỉ huy xưng `ta` / `Ta` – gọi Tanya là `Thiếu tá` / `cô`, còn Tanya đáp `Rõ, thưa ngài` và tự xưng `tôi`; trong câu lẩm bẩm của Tanya (p000199) dùng `chúng ta`; trong thông báo của phi công từ buồng lái (p000202) dùng `Tôi` và `Máy bay`; trong lời phổ biến nhiệm vụ của Tanya trước tiểu đoàn (p000205, p000209, p000211, p000213) và câu cầu nguyện thầm hướng tới cấp dưới in nghiêng ở cuối p000214, Tanya tự xưng `Tôi` / `tôi`, gọi cấp dưới là `Các anh chị` / `các anh chị` / `Tất cả` / `tất cả`, dùng `chúng ta` cho toàn đơn vị, và quy chiếu các pháp sư thủy quân lục chiến bằng `họ` (p000193, p000211)"
  alternatives_vi:
  - tự chuốc lấy cảnh đó (thay cho `một mình rơi vào cảnh đó` tại part0018/p000212 — bắt buộc giữ `một mình rơi vào cảnh đó` theo bản sửa mức vừa đã nghiệm thu trong `handoffs/vol-02/ch-03-b15.yml` để bảo toàn nghĩa không muốn một mình chịu cảnh sụp đổ mà muốn đề nghị chung với các chỉ huy đến sau) / cô (thay cho `nó` / `Nó` trong trần thuật tại part0018/p000200, p000206, p000207, p000209, p000214 — bắt buộc giữ `nó` / `Nó` theo `DEC-P01-001`)
