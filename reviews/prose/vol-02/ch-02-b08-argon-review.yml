  alternatives_vi:
  - mất khả năng chiến đấu / không còn hiệu quả chiến đấu (thay cho `mất sức chiến đấu` tại part0014/p000180 — ưu tiên `mất sức chiến đấu` theo mục `vol02-ch02-b08-combat-ineffective` trong `pending-terms.yml` và `handoffs/vol-02/ch-02-b08.yml` vì chuẩn thuật ngữ quân sự chỉ trạng thái đơn vị suy giảm năng lực tác chiến chứ không nhất thiết bị xóa sổ hoàn toàn) / tiểu đội quan sát mặt đất (thay cho `Đội quan sát mặt đất` tại part0014/p000183 — ưu tiên `Đội quan sát mặt đất` theo mục `vol02-ch02-b08-surface-observer-squad`) / thi triển thuật thức (thay cho `thi triển phép thuật` tại part0014/p000174 — tại p000174 cách dịch thoát ý `thi triển phép thuật` vẫn tự nhiên và bảo toàn nghĩa tác chiến nên giữ ổn định, các lô sau ưu tiên `thuật thức` theo sổ thuật ngữ tạm) / Thượng đế (thay cho `Chúa` tại part0014/p000182 — trong câu chửi thề nội tâm bộc phát của người lính tiền tuyến Viper 02, `Chúa` tự nhiên và hợp khẩu ngữ hơn)
