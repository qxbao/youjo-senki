- source_term: viper_01_viper_02_and_cp_radio_operator_pronouns_vol02_ch02_b08
  proposed_vi: "Trong phân cảnh giao chiến phòng ngự của Tiểu đoàn Viper trên mặt trận phía Bắc (part0014/p000168–p000189): trần thuật ngôi thứ ba quy chiếu tập thể Tiểu đoàn Viper bằng `họ` / `Họ` kèm phản thân `mình` (p000168–p000170, p000174, p000177, p000184), quy chiếu quân địch Liên minh Entente và hỏa lực phòng không tạm thời bằng `chúng` (p000177, p000180, p000183, p000184); quy chiếu cả chỉ huy Tiểu đoàn Viper (01) bị thương lẫn người kế nhiệm Viper 02 bằng `anh` trong trần thuật ngôi thứ ba (p000172–p000174, p000177); trong độc thoại nội tâm trực tiếp của Viper 02 (p000177, p000182, p000184, p000185, p000187), tự quy chiếu cá nhân bằng `Mình` / `mình` theo mục `vol02-ch02-b08-viper-interior-self-reference` và quy chiếu tập thể đơn vị bằng `ta` / `chúng ta` / `Chúng ta` (p000184, p000185, p000187). Trong đối thoại và liên lạc vô tuyến: cấp dưới hô gọi chỉ huy tiểu đoàn là `Chỉ huy!` (p000171); chỉ huy 01 khi bàn giao quyền chỉ huy tự xưng `Tôi` và gọi 02 là `02` / `cậu` (p000175); Viper 02 đáp `Rõ, Chỉ huy!`, gọi hai thuộc cấp 07 và 13 là `hai người`, và quy chiếu chỉ huy 01 là `anh ấy` (p000176); khi liên lạc với Sở chỉ huy (CP), 01 và 02 xưng hô theo hô hiệu `Đây là 01` / `Đây là Viper 02` / `Viper 02 gọi sở chỉ huy`, tự xưng `tôi` / `Tôi` và đại diện tiểu đoàn bằng `chúng tôi` (p000178, p000181, p000186, p000188), còn người điện đài ở Sở chỉ huy gọi đơn vị của Viper 02 là `các anh` (p000183)"
  alternatives_vi:
  - tôi (thay cho `Mình` / `mình` trong độc thoại nội tâm của Viper 02 tại part0014/p000182, p000184 — ưu tiên `Mình` / `mình` theo mục `vol02-ch02-b08-viper-interior-self-reference` để tạo sự tự nhiên trong độc thoại nội tâm trực tiếp và phân biệt rõ với lời thoại báo cáo qua vô tuyến dùng `tôi`) / anh (thay cho `cậu` khi chỉ huy 01 nói với 02 tại part0014/p000175 — ưu tiên `cậu` theo mục `vol02-ch02-b08-tanya-address-to-viper02` trong sổ pending cho lời phó thác của chỉ huy tiểu đoàn với cấp phó thân cận trên chiến trường)
