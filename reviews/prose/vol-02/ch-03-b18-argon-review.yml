- source_term: tanya_sue_aerial_melee_and_republican_navy_command_pronouns_vol02_ch03_b18
  proposed_vi: "Trong phân cảnh hỗn chiến tầm gần giữa đơn vị của Thiếu tá Tanya von Degurechaff với tiểu đoàn của Đại tá Anson Sue, trung đoàn tiếp viện Đế quốc đến ứng cứu và Bộ chỉ huy Hải quân Cộng hòa nhận cảnh báo về hạm đội Đế quốc xuất cảng (part0018/p000302–p000334): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1–M6 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b18.yml`: (1) Trong phân cảnh theo điểm nhìn Đại tá Sue (p000302–p000304, p000308, p000312, p000316, p000317, p000324): trần thuật ngôi thứ ba quy chiếu Sue bằng đại từ trang trọng `ông` / `Ông` (đã sửa M5 ở p000302–p000304 để đồng bộ với b06/b17) kết hợp tên riêng – cấp bậc `Sue` / `Đại tá Sue`; quy chiếu các pháp sư Đế quốc bằng `Bọn chúng` / `Bọn này` / `chúng`, và quy chiếu Tanya từ góc nhìn đối địch của Sue ở p000304 bằng `nữ pháp sư kia` / `cô ta`. (2) Trong phân cảnh phía Tanya, Tiểu đoàn 203 và chỉ huy trung đoàn tiếp viện Đế quốc (p000305–p000307, p000309–p000311, p000315, p000317–p000323): trần thuật ngôi thứ ba quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` (đã sửa triệt để M1 tại p000307, p000309, p000321 theo `DEC-P01-001`), còn trong suy nghĩ gián tiếp/tự quy chiếu dùng `mình` (p000305, p000309, p000317) và trong câu tuyên bố giả định đặt trong dấu nháy in nghiêng tại p000305 (`*“Việc này đâu có trong hợp đồng của tôi”*`) tự xưng `tôi`; trong đối thoại tác chiến giữa chỉ huy lực lượng tiếp viện và Tanya (p000318–p000320), viên chỉ huy gọi `Thiếu tá von Degurechaff`, gọi cấp dưới dưới quyền mình là `Hai tiểu đoàn các anh` – `Những người còn lại` và quy chiếu Tanya là `thiếu tá`, còn Tanya tự xưng `tôi` và quy chiếu lực lượng Đế quốc dưới mặt đất bằng `họ`; trần thuật p000321–p000322 quy chiếu Tanya và chỉ huy tiếp viện bằng `Cả hai` / `họ`, và quy chiếu binh sĩ Lục quân Đế quốc bằng `họ`. (3) Trong phân cảnh tại Bộ chỉ huy Hải quân Cộng hòa (p000325–p000334): trần thuật quy chiếu phía Hải quân Cộng hòa và các sĩ quan bằng `họ`, quy chiếu hạm đội Đế quốc bằng `chúng` (trong lời vị chỉ huy ở p000328) hoặc `họ` (trong câu hỏi sững sờ ở p000331); câu nội tâm đại diện cho cảm nghĩ chung tại p000329 dùng `*Chúng ta đã chờ đợi.*` in nghiêng toàn câu, và câu hỏi nội tâm mở đầu p000334 được bọc `*…Bên trong có thể là gì?*` đúng phạm vi theo `DEC-P01-002` và bản sửa M2"
