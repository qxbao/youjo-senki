  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ quân sự, đơn vị, cấp bậc và danh xưng đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b18_translation_proposals` cùng `handoffs/vol-02/ch-03-b18.yml` (`Thiếu tá von Degurechaff` / `thiếu tá`, `Đại tá Sue` / `Sue`, `thuật thức`, `công nghệ khoa học mana`, `chiến dịch chiếm lĩnh`, `Lục quân Đế quốc`, `Hải quân Đế quốc`, `Hải quân Cộng hòa`, `phòng tuyến Rhine`, `tuyến cảnh giới sớm` / `tuyến cảnh giới`, `DEFCON 1`, `Cuộc điều động hạm đội`, `biên đội thiết giáp hạm`, `tàu vận tải`), bảo toàn trọn vẹn các bản sửa M1–M6 đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b18-fixes-signoff-claude.md`."
  uncertainty: low
