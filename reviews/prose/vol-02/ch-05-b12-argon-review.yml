    terms:
      - "Rhine"
    pronouns_and_address: "Tanya gọi đám tân binh là `các anh`, quy chiếu chiến trường Rhine là `nó`."
    pov_and_voice: "Lời thoại cảnh báo lạnh lùng, trực diện của Tanya."
    modality_and_logic: "Giữ đúng hai hình ảnh ẩn dụ cảnh tỉnh tân binh: Rhine là địa ngục và có thể ví như một nghĩa địa."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000294
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật hạn tri dùng `Tanya`, quy chiếu đám tân binh là `họ`."
    pov_and_voice: "Trần thuật hạn tri đan cài suy tính thực tế của Tanya."
    modality_and_logic: "Bảo toàn đầy đủ ba nhịp lập luận: Tanya cảnh báo thẳng thắn để tân binh không chết như ngả rạ; tiếc rằng họ chưa được huấn luyện kỹ hơn vì lính không hiểu chuyện chỉ là gánh nặng; rồi chợt nhận ra chính vì họ còn quá non nên cấp trên mới bày ra nhiệm vụ huấn luyện này."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000295
    terms:
      - "mặt trận Rhine"
      - "Quân đội Cộng hòa"
    pronouns_and_address: "Tanya gọi đám tân binh là `các anh`."
    pov_and_voice: "Giọng thuyết giảng mỉa mai sâu cay của Tanya."
    modality_and_logic: "Bảo toàn cách nói ngược đầy châm biếm về `mặt trận Rhine tuyệt vời`, nơi Quân đội Cộng hòa mở tiệc chào đón những kẻ vô dụng và người lính có thể được thăng liền hai cấp trong chớp mắt (nhờ tử trận)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000296
    terms:
      - "các tuyến Rhine"
      - "Thiếu tá"
      - "truy thăng hai cấp sau khi chết"
      - "hậu phương"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `Mình` / `mình`."
    pov_and_voice: "Độc thoại nội tâm phân tích thực trạng hao hụt nhân sự ở mặt trận Rhine."
    modality_and_logic: "Bảo toàn mối liên hệ giải thích cho câu nói mỉa mai ở `p000295`: tỷ lệ tổn thất ở Rhine quá cao đến mức các sĩ quan cấp trên có mặt khi Tanya mới tới đều đã tử trận và nhận truy thăng hai cấp, hoặc nếu may mắn thì được chuyển đi hay đưa về hậu phương."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000297
    terms:
      - "Thiếu tá"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình`."
    pov_and_voice: "Giọng nhận xét tỉnh táo pha chút ngỡ ngàng trước tốc độ đào thải cấp chỉ huy."
    modality_and_logic: "Giữ đúng phép so sánh vị trí: dù mới chỉ mang quân hàm Thiếu tá nhưng Tanya đã đứng gần đỉnh của cơ cấu chỉ huy tại mặt trận hơn là ở đáy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000298
    terms:
      - "các tuyến Rhine"
      - "Darwin"
    pronouns_and_address: "Độc thoại nội tâm khái quát hóa của Tanya, ẩn đại từ ngôi thứ hai phiếm chỉ."
    pov_and_voice: "Giọng liên tưởng học thuật châm biếm (kinh tế học thị trường lao động kết hợp thuyết tiến hóa của Darwin)."
    modality_and_logic: "Bảo toàn trọn vẹn câu giả định về Darwin và cặp câu hỏi đối lập về thuyết tiến hóa (đỉnh cao tiến hóa hay nơi thuyết tiến hóa sụp đổ)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000299
    terms: []
    pronouns_and_address: "Lời thoại của Tanya dùng đại từ phiếm chỉ `ai`."
    pov_and_voice: "Giọng huấn thị lạnh lùng, khiêu khích những kẻ thích thể hiện anh hùng cá nhân."
    modality_and_logic: "Giữ đúng lời khuyên mỉa mai: ai muốn làm anh hùng thì cứ ra đùa với lính bắn tỉa."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000300
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya lược đại từ ngôi thứ hai phiếm chỉ, gọi đám lính ngu ngốc không biết nghe lời là `chúng`."
    pov_and_voice: "Giọng tính toán chi phí - lợi ích tàn nhẫn của Tanya."
    modality_and_logic: "Bảo toàn hai vế nhận định: nói chuyện với lũ ngốc không chịu nghe là vô ích, và để chúng lảng vảng tiêu xài quân nhu là sự lãng phí."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000301
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya ẩn chủ ngữ ngôi thứ nhất, gọi đám lính ngốc là `chúng`."
    pov_and_voice: "Giọng thực dụng lạnh băng, coi việc loại bỏ lính vô dụng như một giao dịch có lời."
    modality_and_logic: "Bảo toàn điều kiện tính toán lợi ích: nếu vừa tống khứ được lũ ngốc vừa làm tiêu hao đạn và sức lực của xạ thủ bắn tỉa địch thì đó là một món hời không tệ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000302
    terms: []
    pronouns_and_address: "Tanya xưng `tôi`, hướng lời dặn tới số tân binh còn lại."
    pov_and_voice: "Giọng mệnh lệnh ngắn gọn, dứt khoát."
    modality_and_logic: "Giữ đúng yêu cầu tối thiểu đối với những tân binh còn lại: cố hết sức đừng làm vướng chân."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000303
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya gọi đám tân binh là `chúng`."
    pov_and_voice: "Giọng đánh giá thực dụng, phũ phàng."
    modality_and_logic: "Giữ đúng điều kiện: nếu chịu nghe theo chỉ dẫn thì ít nhất chúng cũng dùng làm bia đỡ đạn được."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000304
    terms: []
    pronouns_and_address: "Tanya gọi các tân binh là `các anh` và dùng `chúng ta`."
    pov_and_voice: "Giọng kết thúc bài phát biểu lịch sự kiểu xã giao nhưng ẩn chứa hàm ý u ám về tỷ lệ sống sót."
    modality_and_logic: "Bảo toàn sự tương phản giữa dự báo chỉ gắn bó với nhau một thời gian ngắn và lời kêu gọi sống hòa thuận."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000305
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình`."
    pov_and_voice: "Giọng người làm công ăn lương khép lại phần thủ tục chào hỏi để bắt tay vào việc chính."
    modality_and_logic: "Giữ đúng hai câu kết thúc cảnh huấn thị và chuyển sang phần việc tiếp theo theo mức lương được trả."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000306
    terms: []
    pronouns_and_address: "Độc thoại nội tâm mở đầu đoạn ngợi ca chiếc xẻng sau ngắt cảnh (`space-break1`), không dùng đại từ cá nhân."
    pov_and_voice: "Giọng tụng ca hào hứng, nghiêm túc một cách hài hước của Tanya về chiếc xẻng công binh."
    modality_and_logic: "Giữ đúng cấu trúc hai câu ngắn dồn dập tôn vinh xẻng là tinh hoa của nền văn minh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000307
    terms:
      - "chiến hào"
    pronouns_and_address: "Dùng đại từ khái quát `ta` cho `you` phiếm chỉ, tạo nhịp điệu tự nhiên cho bài thuyết trình nội tâm về công năng của xẻng."
    pov_and_voice: "Giọng phân tích công năng thực địa của công cụ quân sự."
    modality_and_logic: "Bảo toàn sự phát triển theo quy mô nhân lực: một người cầm xẻng thì đào được hố cá nhân đủ ẩn mình, tập hợp nhiều người cầm xẻng thì đào được một chiến hào tốt."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000308
    terms:
      - "chiến hào"
      - "chiến thuật đào hầm"
    pronouns_and_address: "Tiếp tục dùng đại từ khái quát `ta` cho `you` phiếm chỉ."
    pov_and_voice: "Giọng giảng giải chiến thuật công binh kèm lời chú giải thực tế."
    modality_and_logic: "Bảo toàn bước phát triển từ đào hào sang đào đường hầm để đánh sập chiến hào kiên cố của địch bằng chiến thuật đào hầm, cùng nhận xét phụ chú rằng chiến thuật này không mấy khi được dùng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000309
    terms:
      - "chiến hào"
    pronouns_and_address: "Nhận định khái quát không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng khẳng định chắc nịch, chuyển mượt từ công năng đào đất sang công năng vũ khí cận chiến."
    modality_and_logic: "Giữ đúng hai mệnh đề song hành: xẻng là bạn tốt của mọi người lính và là trang bị tốt nhất khi đánh giáp lá cà trong chiến hào."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000310
    terms:
      - "lưỡi lê"
      - "súng trường"
    pronouns_and_address: "Độc thoại nội tâm của Tanya chuyển về tự xưng `mình` ở câu cuối theo đúng nguyên văn."
    pov_and_voice: "Giọng đánh giá kỹ-chiến thuật và kinh tế sản xuất, kết thúc bằng liên hệ cá nhân về tác dụng phụ lên tâm trí."
    modality_and_logic: "Bảo toàn đầy đủ 3 phép so sánh ưu thế vật lý (dài hơn lưỡi lê, dễ dùng hơn súng trường, bền hơn mọi công cụ khác), ưu thế chi phí sản xuất hàng loạt, và ưu thế cá nhân đối với Tanya là không lo bị tổn hại đầu óc (như khi dùng Elinium Type 95)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000311
    terms: []
    pronouns_and_address: "Độc thoại nội tâm khái quát, dùng phản thân `mình` cho chủ thể `Nền văn minh`."
    pov_and_voice: "Giọng tán dương cao trào mang màu sắc triết lý lịch sử công cụ."
    modality_and_logic: "Giữ đúng ba câu khẳng định dồn dập: món trang bị lý tưởng, đích đến tất yếu của nhân loại, và thành tựu công cụ của nền văn minh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000312
    terms:
      - "dò quét ma thuật"
    pronouns_and_address: "Dùng `ta` cho cấu trúc khái quát và `nó` quy chiếu chiếc xẻng."
    pov_and_voice: "Giọng thực chiến tàn nhẫn pha nét hài đen sống động với từ tượng thanh mô phỏng tiếng xẻng bổ xuống."
    modality_and_logic: "Bảo toàn quan hệ nhân quả then chốt: vì xẻng không dùng ma thuật/ma pháp nên cực kỳ tối ưu để hạ sát lặng lẽ, giúp 'giáo dục' những kẻ chỉ biết ỷ lại vào dò quét ma thuật trong các cuộc đột kích ban đêm cũng như làm công cụ đa năng suốt cả ngày."
    emphasis: "Bảo toàn chính xác 1 cụm `*...*` tương ứng `<html:em>` (`*Keng!*`)."
