findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000285
    category: dialogue_address_consistency
    issue: >-
      Trong lời mở đầu chào đón đám tân binh tại `p000285`, bản dịch dùng `Thưa các ngài` cho `Gentlemen`, trong khi xuyên suốt phần còn lại của bài huấn thị (`p000291`, `p000293`, `p000295`, và đặc biệt là `p000304` cũng dịch từ `gentlemen`) Tanya đều gọi đám tân binh là `các anh`.
    basis: >-
      Cách dịch `Thưa các ngài` ở câu mở màn có thể đọc như giọng điệu trịnh trọng pha chút mỉa mai kiểu diễn thuyết trước khi Tanya hạ giọng thực dụng ở các câu sau, nên không làm sai lệch quan hệ cấp bậc giữa Thiếu tá chỉ huy và lính mới.
    recommendation: >-
      Không chặn signoff; có thể giữ nguyên để tạo sắc thái châm biếm ở câu chào đầu tiên hoặc đồng bộ với `p000304` thành `Các anh, chào mừng đến mặt trận Rhine!` ở bước polish.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000291
    category: terminology_consistency
    issue: >-
      Tại `p000291`, cấp bậc `Magic Major von Degurechaff` được dịch là `Thiếu tá Pháp sư von Degurechaff`, và tại `p000312`, `magic` / `magic scanning` được dịch là `ma thuật` / `dò quét ma thuật`, trong khi sổ thuật ngữ tạm (`work/run-state/pending-terms.yml`) thường dùng tổ hợp `ma pháp` cho cấp bậc và kỹ thuật (`thiếu úy ma pháp`, `kỹ thuật ma pháp`, `thuật thức gây nhiễu ma pháp`).
    basis: >-
      Trong tiếng Việt, cả `Thiếu tá Pháp sư` lẫn `Thiếu tá Ma pháp` và `ma thuật` lẫn `ma pháp` đều truyền đạt rõ nghĩa trong ngữ cảnh, không gây mơ hồ về chức danh hay cơ chế kỹ thuật.
    recommendation: >-
      Không chặn signoff; ở bước polish toàn chương có thể cân nhắc đồng bộ thành `Thiếu tá Ma pháp von Degurechaff` (`p000291`) và `ma pháp` / `dò quét ma pháp` (`p000312`) theo hệ thuật ngữ `ma pháp`.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000301
    category: modality_and_nuance
    issue: >-
      Câu đầu của `p000301` (`Tốt nhất là bảo chúng đi khiến xạ thủ bắn tỉa địch phải phí một viên đạn.`) thêm động từ `bảo`, làm câu nghiêng nhẹ sang hướng chỉ thị hành động, trong khi nguyên văn đánh giá giới hạn giá trị sử dụng tối đa của đám tân binh không chịu nghe lời (`Điều tốt nhất chúng có thể làm là...`).
    basis: >-
      Đặt nối tiếp `p000299`–`p000300`, cả hai cách diễn đạt đều giữ nguyên ý châm biếm lạnh lùng của Tanya rằng đám lính ngốc nghếch chỉ có tác dụng làm tiêu hao đạn của lính bắn tỉa địch.
    recommendation: >-
      Có thể giữ nguyên hoặc tinh chỉnh nhẹ ở bước polish thành `Điều tốt nhất chúng làm được là đi khiến xạ thủ bắn tỉa địch phải tốn một viên đạn.`
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000305
    category: lexical_nuance
    issue: >-
      Tại `p000305`, cụm `đến lúc làm việc xứng với số tiền mình được trả rồi` có thể gợi sắc thái tận tụy làm cho xứng đồng lương, trong khi mạch tâm lý người làm công ăn lương của Tanya (đối chiếu với lời than lương thấp ở `ch-05-b10` `p000240`) mang sắc thái thực dụng là chỉ làm việc đúng bằng mức lương được trả (`lương trả bao nhiêu thì làm bấy nhiêu`).
    basis: >-
      Cách dịch hiện tại vẫn hợp ngữ cảnh chuyển cảnh sau khi Tanya kết thúc bài phát biểu chiếu lệ cho xong trách nhiệm với đám tân binh.
    recommendation: >-
      Có thể giữ nguyên hoặc chỉnh nhẹ ở bước polish thành `đến lúc làm việc đúng với số tiền lương mình được trả rồi`.
    resolution: optional_polish

