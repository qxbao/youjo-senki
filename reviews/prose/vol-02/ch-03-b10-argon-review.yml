  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ nguyên bản sửa followup M1 đã ký duyệt tại p000075, phân biệt rõ trần thuật ngôi thứ ba (`Tanya`, `nó` / `Nó`), độc thoại nội tâm tự quy chiếu (`mình`), chuỗi câu bình luận diễn ngôn (`tôi` / `Tôi`), đại từ gộp (`ta` / `Ta` / `chúng ta`), và lời thoại trực tiếp giữa Tanya với cấp dưới (`tôi` – `Đây ạ, thưa ngài.`)."
