  proposed_vi: "cuộc chiến giả, chuyên gia tư vấn, nguồn lực quản lý (part0018/p000065) / Tanya, cặp sĩ quan tham mưu, phương Bắc, tiền tuyến, đơn vị phòng thủ cơ động, lùi các tuyến tiếp tế về phía sau (part0018/p000066) / Cụm tập đoàn quân phương Bắc, cuộc tiến công, cuộc hành quân tử thần, Bộ Tổng tham mưu, chiến dịch đổ bộ tuyệt mật, hậu phương (part0018/p000067, p000071, p000074, p000085–p000087) / vật tư trang bị, công sự, tiếp tế, chiến công, chủ nghĩa quân phiệt, chiến dịch đổ bộ quy mô lớn (part0018/p000069–p000071) / nhảy dù, các pháp sư không quân, cuộc tập kích vào hậu phương (part0018/p000074) / MacArthur, Bộ Tổng tham mưu Đế quốc, kế hoạch tác chiến, Tướng von Rudersdorf (part0018/p000075) / chiến trường phía bắc, bản đồ tình hình đã ghi chú, vịnh hẹp, phòng thủ bờ biển, nã pháo, khẩu đội pháo (part0018/p000079, p000080, p000082) / pháo đài, cuộc xâm lăng đường bộ, Singapore, các quân cờ (part0018/p000081) / hạm đội chiến hạm, chiến hạm, thuốc nổ, Pháo bờ biển, cửa vịnh, pháo kích (part0018/p000082) / Thung lũng Moomin, lớp vỏ phòng thủ (part0018/p000083) / tấm bản đồ dự báo chiến sự, phương án dự phòng, Cục Tác chiến, những sĩ quan cấp trưởng phòng, lực lượng phía bắc, các tập đoàn quân khu vực (part0018/p000085, p000086) / Đại quân, Norden, Ludwig, hội đồng cố vấn, Hoàng đế Bệ hạ, quyền lực tối cao, cụm tập đoàn quân khu vực (part0018/p000087)"
  alternatives_vi:
  - chiến tranh giả tạo / cuộc chiến kỳ quặc (thay cho `cuộc chiến giả` tại part0018/p000065 — bắt buộc giữ `cuộc chiến giả` theo mục `vol02-ch03-b10-phony-war` trong `work/run-state/pending-terms.yml` và bản sửa followup trong `handoffs/vol-02/ch-03-b10.yml` để đối xứng trực tiếp với cụm `đánh thật` trong câu và không tự gán sắc thái đạo đức) / rút các tuyến tiếp tế / rút lui cùng các tuyến tiếp tế (thay cho `lùi các tuyến tiếp tế về phía sau` tại part0018/p000066 — ưu tiên giữ `lùi các tuyến tiếp tế về phía sau` theo mục `vol02-ch03-b10-supply-lines-withdrawal` trong ledger để giữ cách diễn đạt trung tính, ít suy diễn nhất trước cấu trúc câu nguồn có độ bất định) / hành quân đến chết / cuộc hành quân chết chóc (thay cho `cuộc hành quân tử thần` tại part0018/p000067 — giữ `cuộc hành quân tử thần` theo mục `vol02-ch03-b10-death-march` trong ledger vì tự nhiên và truyền tải đúng ẩn dụ tiêu hao kiệt quệ) / trang thiết bị quân sự / vật tư chiến tranh (thay cho `vật tư trang bị` tại part0018/p000069 — giữ `vật tư trang bị` theo mục `vol02-ch03-b10-materiel` trong ledger để bao quát cả vũ khí, đạn dược và vật tư mở chiến dịch) / Phòng Tác chiến / Ban Tác chiến (thay cho `Cục Tác chiến` tại part0018/p000086 — giữ `Cục Tác chiến` theo mục `vol02-ch03-b10-operations-division` trong ledger để đồng bộ với các lô trước của Chương 3 và tương thích với cấp bậc trưởng phòng của các sĩ quan bên dưới)
