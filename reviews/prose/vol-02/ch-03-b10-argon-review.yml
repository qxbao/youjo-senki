  proposed_vi: "Trong phân cảnh Tanya vừa trở về bàn làm việc, vừa trải bản đồ phân tích tình hình chiến sự phương Bắc, chiến dịch đổ bộ hậu phương ở vùng vịnh hẹp và mối bất hòa giữa Bộ Tổng tham mưu với các cụm tập đoàn quân khu vực (part0018/p000064–p000087): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `ch-03-b09`: (1) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000066, p000074, p000075, p000079–p000081, p000083, p000085), quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` / `Nó` (p000066, p000074, p000079, p000080) và đại từ phản thân `mình` (p000081) đúng chuẩn `DEC-P01-001`. (2) Trong độc thoại nội tâm và bình luận chiến sự của Tanya: dùng `mình` khi tự quy chiếu nội tâm về bản thân và dự tính tác chiến cá nhân (p000075, p000080, p000086, đã giải quyết triệt để lỗi M1 tại p000075 và kèm đại từ phản thân `mình` ở p000069, p000073); dùng `tôi` / `Tôi` trong chuỗi câu bình luận khuyên nhủ mang tính diễn ngôn trực tiếp ở p000069–p000071, p000073 và câu kết p000086 (kèm cách gọi người nghe giả định là `ngài` tại p000069); dùng đại từ gộp `ta` / `Ta` / `chúng ta` khi tính toán phương án tác chiến chung của đơn vị và phe Đế quốc (p000065, p000074, p000075, p000082, p000083, p000085); quy chiếu MacArthur bằng `gã đó` và quy chiếu Tướng von Rudersdorf bằng `ông` (p000075); quy chiếu Cụm tập đoàn quân phương Bắc, Bộ Tổng tham mưu và giới chỉ huy hiếu chiến bằng `đám cuồng này` (p000065) và `họ` (p000069–p000071, p000075, p000086, p000087); quy chiếu các khẩu đội pháo bờ biển và đối phương bằng `chúng` / `Chúng` (p000082, p000083). (3) Trong lời thoại thành tiếng của Tanya (p000064, p000068, p000072, p000076, p000084) và lời đáp của cấp dưới (p000077): Tanya tự xưng `Tôi` / `tôi`, gọi các sĩ quan hiếu chiến là `Mấy người này` (p000068); cấp dưới thưa Tanya lễ phép bằng `Đây ạ, thưa ngài.` (p000077)"
  alternatives_vi:
  - nó (thay cho `mình` ở hai mệnh đề đầu câu thứ ba của part0018/p000075 — bắt buộc giữ `mình` theo `DEC-P01-001` và bản sửa followup M1 đã ký duyệt trong `handoffs/vol-02/ch-03-b10.yml` vì câu đang ở giọng độc thoại nội tâm ngôi thứ nhất trước khi chuyển sang trần thuật `Tanya nghĩ` ở câu cuối) / cô (thay cho `nó` / `Nó` trong trần thuật ngôi thứ ba tại part0018/p000066, p000074, p000079, p000080 — bắt buộc giữ `nó` / `Nó` theo `DEC-P01-001` vì toàn bộ lô B10 đặt dưới điểm nhìn của Tanya)
