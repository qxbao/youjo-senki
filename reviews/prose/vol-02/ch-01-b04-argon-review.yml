  volume: vol-02
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` cho độc thoại nội tâm của Tanya (`mình`), đồng thời giữ đúng các quyết định đã sửa và signoff trong handoff `handoffs/vol-02/ch-01-b04.yml` (`M1`, `M2`, `M4`, `M5`, `vol02-ch01-b04-address-to-unit`, `vol02-ch01-b04-serebryakov-address`: lặp tên riêng `Tanya` trong trần thuật; dùng `mọi người` khi gọi chung đơn vị; phân biệt rõ lời thoại `Tôi` của phụ tá Serebryakov ở p000084 với nội tâm `mình` của Tanya; gọi Serebryakov là `Thiếu úy` nhất quán ở p000060, p000082, p000085, p000087)."
