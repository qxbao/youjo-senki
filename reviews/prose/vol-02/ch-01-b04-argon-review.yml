- source_term: dacian_vanguard_turkey_shoot_and_203rd_first_strike_terms_vol02_ch01_b04
  proposed_vi: "Thiếu úy, Thiếu úy Serebryakov (part0010/p000060, p000082, p000085, p000087) / Công quốc Dacia, buổi diễn tập bắn đạn thật, diễn tập bắn đạn thật (part0010/p000062, p000069, p000076) / lính Dacia, đội quân Dacia, quân Dacia, Đơn vị Dacia (part0010/p000063, p000067, p000068, p000072, p000074, p000087) / cuộc bắn gà tây, quần đảo Mariana (part0010/p000065) / chiếc búa sắt (part0010/p000066) / lực lượng tiên phong, Quân đội Đế quốc, đội tiên phong (part0010/p000068, p000072, p000073, p000076) / cuộc săn người (part0010/p000070) / hiệp sĩ huyền thoại Don Quixote (part0010/p000071) / nhân viên hậu phương, Bộ Tổng tham mưu, cứ điểm, tiểu đoàn, Tiểu đoàn, ba sư đoàn, đội hình công kích (part0010/p000072, p000074, p000078, p000083, p000085, p000086, p000087) / các đơn vị tuần tra biên giới (part0010/p000073) / lượt công kích (part0010/p000074) / Học thuyết quân sự, đòn phép thuật, oanh tạc từ trên không, nhân lực, vốn con người (part0010/p000075) / Aconitum 01 (part0010/p000077) / pháp sư không quân, lực lượng mặt đất, bốn đại đội, các đại đội trưởng, các đại đội, quyền kiểm soát bầu trời (part0010/p000078, p000079, p000081) / lực lượng dự bị, phòng không, các pháp sư (part0010/p000081) / cựu binh mặt trận Rhine (part0010/p000085) / Thiếu tá (part0010/p000086)"
  alternatives_vi:
  - cuộc bắn hạ một chiều hoặc cuộc tàn sát một chiều (thay cho `cuộc bắn gà tây` tại part0010/p000065 — ưu tiên giữ cách dịch literal `cuộc bắn gà tây` theo lựa chọn tạm `vol02-ch01-b04-turkey-shoot` đã signoff trong handoff vì nguồn gắn trực tiếp thành ngữ với địa danh lịch sử `quần đảo Mariana` và tránh trùng lặp từ vựng với động từ `tàn sát` ở câu liền trước) / cuộc săn lùng con người hoặc cuộc truy lùng (thay cho `cuộc săn người` tại part0010/p000070 — ưu tiên `cuộc săn người` theo lựa chọn tạm `vol02-ch01-b04-manhunt` vì súc tích, giữ đúng nghĩa đen gắn với vế bổ nghĩa `Một môn thể thao` ngay sau) / pháp sư trên không (thay cho `pháp sư không quân` tại part0010/p000078 — ưu tiên `pháp sư không quân` theo mục sửa `M7` và lựa chọn tạm `vol02-ch01-b04-aerial-mage` để đồng bộ với sổ pending Tập 1) / nguồn nhân lực và vốn nhân lực (thay cho cặp phân biệt `nhân lực` và `vốn con người` tại part0010/p000075 — ưu tiên `nhân lực` cho câu đầu đi với danh từ chỉ lượng `một núi` và `vốn con người` cho câu sau theo mục sửa `M6`, giữ rõ sự đối lập giữa tài nguyên con người bị phung phí và tư duy kinh tế học về vốn của Tanya)
