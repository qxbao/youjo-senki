  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng cách lặp lại tên riêng `Tanya` (part0010/p000061, p000067, p000068, p000072, p000073, p000083), không dùng đại từ `nó` cho Tanya; độc thoại nội tâm của Tanya dùng `Mình` / `mình` cho ngôi thứ nhất số ít (part0010/p000063, p000078, p000081, p000083, p000087) và dùng `chúng ta` cho ngôi thứ nhất số nhiều chỉ tập thể đơn vị / phía Đế quốc (part0010/p000065, p000071); trong lời hiệu triệu trước toàn tiểu đoàn và mệnh lệnh qua vô tuyến cho các đại đội trưởng: Tanya tự xưng `tôi` / `Tôi`, dùng `chúng ta` / `ta` cho tập thể đơn vị, và gọi thuộc cấp trung tính là `mọi người` / `Mọi người`, kèm danh xưng nghi thức `Các quý ông`, `tất cả các đơn vị`, `Các đại đội trưởng` theo đúng văn bản nguồn (part0010/p000060, p000062, p000064, p000066, p000069, p000077, p000079), các đại đội trưởng đồng thanh đáp `“““Rõ!”””` (part0010/p000080); trong đối thoại giữa Tanya và sĩ quan phụ tá Thiếu úy Serebryakov: Tanya tự xưng `Tôi`, dùng `Chúng ta`, và gọi trực tiếp bằng cấp bậc `Thiếu úy` ở cả vị trí hô ngữ lẫn chủ ngữ ngôi thứ hai (part0010/p000060, p000082, p000085), còn Serebryakov tự xưng `Tôi` / `tôi` và gọi Tanya là `Thiếu tá` / `ngài` (part0010/p000084, p000086)"
  alternatives_vi:
  - nó cho Tanya trong trần thuật (thay cho việc lặp tên riêng `Tanya` tại part0010/p000061, p000067, p000068, p000072, p000073, p000083 — ưu tiên lặp tên riêng `Tanya` theo đúng quyết định sửa `M4` đã signoff trong handoff `handoffs/vol-02/ch-01-b04.yml`, đồng bộ với B01–B03 của Chương 1 Tập 2) / các anh hoặc lặp lại các đại đội trưởng (thay cho `mọi người` ở vế sau câu lệnh tại part0010/p000079 — ưu tiên giữ `mọi người` theo lựa chọn tạm `vol02-ch01-b04-address-to-unit` đã signoff vì đầu câu đã nêu rõ hô ngữ `Các đại đội trưởng`, tránh tự suy đoán giới tính của toàn bộ chỉ huy đại đội) / Cô (thay cho cách gọi bằng cấp bậc `Thiếu úy` khi Tanya hỏi Serebryakov tại part0010/p000085 — ưu tiên giữ `Thiếu úy` theo lựa chọn tạm `vol02-ch01-b04-serebryakov-address` để giữ giọng quân sự chuẩn mực và không suy diễn giới tính từ đại từ tiếng Anh)
