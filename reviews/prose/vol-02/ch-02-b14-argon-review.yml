  - "Giữ bản sửa theo signoff `MOD-2` lặp tên `Tanya` xuyên suốt, các cụm `người quan sát cấp dưới`, `các kiểm soát viên của địch`, và `Tanya đắc thắng giương súng trường lên và reo hò.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000389
  locks:
  - "Giữ bản sửa theo signoff `MOD-2` lặp tên `Tanya`, đại từ `chúng`, và toàn văn `Chỉ cần nhìn từ xa, Tanya đã hài lòng khi thấy đội hình địch bắt đầu chao đảo — dấu hiệu cho thấy chúng vừa chịu một cú sốc lớn.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000390
  locks:
  - "Giữ các đại từ `ta`, `chúng`, và câu thoại `“Được rồi, chắc chắn ta hạ được chúng rồi, đúng không? Vậy tiến lên thôi.”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000391
  locks:
  - "Giữ bản sửa theo signoff `MOD-1` và `MOD-2` với đại từ nội tâm tự quy chiếu `Mình` theo `DEC-P01-001` (`Mình sẽ kiên quyết từ chối.`), đúng phạm vi nhấn mạnh in nghiêng một từ `*hỗn loạn*` theo `DEC-P01-002`, và câu kết `Nhiệm vụ duy trì kỷ luật và biến tình hình thành một trận chiến có tổ chức quá sức với chỉ huy tuyến đầu của họ.`."
