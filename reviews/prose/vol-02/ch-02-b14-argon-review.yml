  proposed_vi: "phía đối phương, một đơn vị Quân đội Đế quốc hậu thuẫn, rút lui, tuyến hậu cần của địch (part0014/p000354) / máy bay ném bom, kho nhiên liệu, Liên minh Entente, Khối Thịnh vượng chung, máy bay ném bom tốc độ cao, những chiếc máy bay ném bom “tốc độ cao” (part0014/p000355–p000357, p000359, p000363–p000365) / tiêm kích, đánh chặn, Cộng hòa, các pháp sư địch, Named, tiểu đoàn chưa rõ lai lịch kia (part0014/p000358, p000360, p000361, p000364, p000373) / sở chỉ huy, Quân đội Liên minh Entente, tiền tuyến, hai mươi cây số, pháp sư, Viên sĩ quan sở chỉ huy phụ trách điều khiển, máy vô tuyến (part0014/p000367, p000369, p000387) / Tiểu đoàn α, hầm trú ẩn (part0014/p000370, p000374, p000377, p000383) / tín hiệu mana mạnh, thuật thức oanh kích ma pháp, Người điều khiển, Một thuật thức oanh kích ma pháp hội tụ, Oanh kích ma pháp, pháo 28 cm, Phương trình điều khiển bảy lớp (part0014/p000373, p000374, p000379, p000380) / Chúa (part0014/p000378) / sóng giám sát, Đơn vị quan sát địch, người quan sát, Thiếu úy Serebryakov, Serebryakov, Thiếu tá, Tanya, nhân viên quan sát của địch (part0014/p000381–p000384, p000386–p000389) / Quân đội Cộng hòa, quân đội Liên minh Entente, đơn vị điều khiển, đoàn tàu giám sát mặt đất (part0014/p000383, p000384) / Trung tâm Điều hành Tác chiến, người quan sát cấp dưới, các kiểm soát viên của địch, không phận, chỉ huy tuyến đầu (part0014/p000387, p000388, p000391)"
  alternatives_vi:
