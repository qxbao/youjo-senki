- source_term: commonwealth_cp_officers_prayer_and_tanya_serebryakov_attack_pronouns_vol02_ch02_b14
  proposed_vi: "Trong phân cảnh thảo luận phương án và hoảng loạn tại sở chỉ huy bí mật do nhóm sĩ quan Khối Thịnh vượng chung/Liên minh Entente tiếp quản trước đòn oanh kích tầm xa (part0014/p000354–p000377): tiếp nối B13, trần thuật ngôi thứ ba quy chiếu tập thể các sĩ quan tại sở chỉ huy bằng `họ` / `Họ` kết hợp phản thân `mình` xuyên suốt (p000354, p000356, p000357, p000363, p000365–p000367, p000377) và quy chiếu chủ thể đối phương có đơn vị Đế quốc hậu thuẫn ở p000354 bằng cụm trung tính `phía đối phương` (theo `MOD-5`); trong đối thoại giữa các sĩ quan tại sở chỉ huy và lời báo cáo khẩn cấp (p000355, p000358–p000362, p000364, p000368, p000370, p000371, p000373, p000375, p000376), người nói tự xưng `Tôi` / `tôi` (p000355, p000358, p000360, p000373) hoặc dùng ngôi thứ nhất số nhiều bao gộp `ta` / `chúng ta` (p000355, p000358, p000362, p000371, p000375), quy chiếu mục tiêu Named của Đế quốc từ góc nhìn đối phương bằng `Named` và đại từ ngôi thứ ba số ít `Cô ta` ở p000373, p000375, quy chiếu pháp sư và tiểu đoàn địch bằng `họ` (p000364) hoặc `Chúng` (p000371). Trong lời cầu nguyện niệm chú khi khai hỏa (part0014/p000378): quy chiếu `Chúa` bằng đại từ tôn kính viết hoa `Ngài`. Trong phân cảnh của Tanya và Thiếu úy Serebryakov sau đòn oanh kích tiêu diệt đơn vị quan sát địch (part0014/p000381–p000391): tuân thủ bản sửa `MOD-2` đã ký duyệt và mục `vol02-ch02-b06-tanya-narration`, trần thuật ngôi thứ ba quy chiếu Tanya bằng cách lặp tên riêng `Tanya` hoặc lược chủ ngữ (p000381, p000382, p000386, p000388, p000389) và lặp tên riêng `Serebryakov` ở vế dẫn thoại p000381 (`Serebryakov nói thêm`) để tách bạch hoàn toàn hai nhân vật nữ mà không dùng `cô`; trong nội tâm tự quy chiếu ở p000391, Tanya dùng `Mình` (`Mình sẽ kiên quyết từ chối`) theo đúng `DEC-P01-001`; trong câu nhận định khái quát ở p000384 dùng chủ ngữ phiếm chỉ `người ta`; quy chiếu các nạn nhân tại sở chỉ huy địch bằng `Họ` / `họ` / `chúng` kết hợp phản thân `mình` (p000382, p000383, p000385, p000387, p000389, p000391); trong thoại vô tuyến, Serebryakov gọi Tanya bằng cấp bậc `Thiếu tá` nhất quán ở cả p000381 và p000387, còn Tanya dùng ngôi thứ nhất số nhiều bao gộp `ta` khi ra lệnh cho đơn vị tiến lên ở p000390"
  alternatives_vi:
