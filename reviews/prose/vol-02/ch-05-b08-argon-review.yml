findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000184
    issue: "Tại câu 2 và câu 3 của p000184, cụm `Đôi môi bóng mọng` thêm nét nghĩa độ đầy (`mọng`) bên cạnh độ bóng (`glossy`), và `chẳng khác nào nó được tuyên là vô tội` hơi gợi thêm hành vi tuyên án chính thức so với trạng thái tương đương (`as good as innocent`)."
    basis: "Cấu trúc so sánh `chẳng khác nào` đã giữ được bản chất nhận định chủ quan của Tanya về hệ quả thực tế thay vì một phán quyết tuyên trắng án của tòa; tương ứng mục minor đã hoãn B08-P02."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `Đôi môi bóng của nó` và `Thế này thì chẳng khác nào nó vô tội` / `coi như vô tội`."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000188
    issue: "Ở đầu câu 1 của p000188 (`Dẫu vậy, đối diện với nụ cười của cô`), lời trần thuật dùng đại từ `cô` thay vì `nó` theo DEC-P01-001 (trong khi lời tuyên đọc công vụ trong ngoặc kép ở p000182 lại đang dùng `nó`)."
    basis: "Câu 1 của p000188 đặt từ góc nhìn quan sát của những người dự khán trong phòng xử án (`nhiều người dự khán`) nối tiếp p000185 nên không gây nhầm chủ thể; tương ứng mục minor đã hoãn B08-P04."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc đồng bộ thành `trước nụ cười của nó` tại p000188 (và `cô ấy` trong lời tuyên đọc trực tiếp của tòa ở p000182)."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000189
    issue: "Tại câu 1 của p000189 (`Mặt trận Rhine đang khẩn thiết yêu cầu.`), động từ `yêu cầu` đứng cuối câu không có tân ngữ đi kèm khiến câu hơi lửng so với sắc thái chỉ tình thế cấp bách (`call for urgency`)."
    basis: "Đặt ngay sau câu cuối p000188 (`nữ pháp sư ưu tú mà tiền tuyến tha thiết mong muốn`) và trước câu 2 p000189, người đọc vẫn hiểu rõ yêu cầu khẩn thiết của mặt trận Rhine là đòi người; tương ứng mục minor đã hoãn B08-P05."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `Tình hình ở mặt trận Rhine đang hết sức cấp bách.`"
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000192
    issue: "Tại câu in nghiêng mở đầu p000192 (`*Chúng ta cần cô ấy ở Rhine. Đành chịu vậy thôi.*`), đại từ `Chúng ta` mang sắc thái gộp người nghe trong khi nguồn không nêu rõ chủ thể phát ngôn cụ thể."
    basis: "Trong mạch p000188–p000192, đây là tiếng nói/lập luận nội bộ của phía quân đội và Bộ Tổng tham mưu khi quyết định giữ Tanya lại cho chiến tuyến nên dùng `Chúng ta` và gọi Tanya là `cô ấy` vẫn hợp ngữ cảnh; tương ứng mục minor đã hoãn B08-P07."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc lược chủ thể thành `*Cần cô ấy ở Rhine. Đành chịu vậy thôi.*`"
    resolution: optional_polish

