  - id: vol02-ch05-b08-tanya-pov-monologue-shifts-and-emphasis
    source_term: "Courtroom verdict dialogue at p000182 and p000186, third-person narration and external observer framing at p000183–p000185, p000187–p000193, and final sentence of p000197 (`Tanya` / `nó` / `cô bé` / `cô ấy`), extended first-person interior monologue of Tanya across p000194–p000204 (`mình`), generic second-person rhetorical question at p000195 (`bạn`), and exact preservation of five italicized spans across p000191, p000192, p000193, p000197, p000205"
    proposed_vi: "Tiếp nối trực tiếp cảnh tuyên đọc phán quyết từ ch-05-b07, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000183, p000184, p000187, p000193, câu cuối p000197), quy chiếu Tanya bằng tên riêng `Tanya` và đại từ trần thuật `nó` (kèm phản thân `mình` ở p000193); trong các câu đặt từ góc nhìn quan sát của phòng xử án và lập luận của Bộ Tổng tham mưu (p000185, p000188, p000192), dùng `cô bé`, `bị cáo`, `Thiếu tá von Degurechaff`, `nữ pháp sư ưu tú`, `cô` / `cô ấy`; (2) trong toàn bộ chuỗi độc thoại nội tâm ngôi thứ nhất của Tanya từ p000194 đến p000204 (bao gồm bản sửa B08-P09 tại p000203 `Mình rất nghi ngờ`), dùng nhất quán đại từ tự quy chiếu `mình` / `Mình` theo đúng DEC-P01-001, đồng thời bảo toàn điểm chuyển điểm nhìn nội đoạn tại p000197 từ độc thoại nội tâm in nghiêng (`*Mình... mình.*`) sang câu trần thuật xác nhận (`Và phân tích của Tanya là chính xác.`); (3) trong lời tuyên đọc kết luận của tòa ở p000182 và p000186, hội đồng xét xử xưng `chúng tôi` và gọi `Thiếu tá von Degurechaff`; tại câu hỏi tu từ cuối p000195 dùng `bạn`; (4) bảo toàn chính xác và duy nhất 5 vùng nhấn mạnh bằng `*...*` khớp tuyệt đối với 5 thẻ `<html:em>` trong nguồn: `*Cho chúng tôi thêm pháp sư! Chỉ thêm một người thôi cũng được!*` (p000191), `*Chúng ta cần cô ấy ở Rhine. Đành chịu vậy thôi.*` (p000192), `*Chỉ có những lý do đó thôi.*` (p000193), `*Mình là một pháp sư đầy triển vọng, lại còn được trao Phù hiệu Tấn công Cánh Bạc. Nói cách khác, họ không thể để mất mình.*` (p000197) và `*Quân đội Đế quốc tàn bạo.*` (p000205), không tự thêm `*...*` ở bất kỳ đoạn nội tâm nào khác (DEC-P01-002)."
    alternatives_vi:
