      - "Hội đồng xét xử tự xưng `chúng tôi`, nêu chức danh và họ `Thiếu tá von Degurechaff`."
    pov_and_voice: "Lời tuyên đọc thủ tục tố tụng tại tòa."
    modality_and_logic: "Giữ tuyên bố chính thức hủy bỏ lệnh tạm giam đối với Thiếu tá von Degurechaff vì những lý do đã nêu."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000187
    terms:
      - "lệnh tạm giam (one [detention order])"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` (DEC-P01-001)."
    pov_and_voice: "Trần thuật châm biếm về sự chênh lệch giữa thủ tục tuyên bố và thực tế."
    modality_and_logic: "Khóa bản sửa theo B08-P03 (`nó vốn chưa từng bị đặt dưới lệnh tạm giam ấy`), bảo toàn phép hồi chỉ về `lệnh tạm giam` ở p000186."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000188
    terms:
      - "người dự khán (the attendees)"
      - "nữ pháp sư ưu tú (the superior mage)"
      - "tiền tuyến (the front lines)"
      - "nơi giam giữ (custody)"
      - "Bộ Tổng tham mưu (the General Staff)"
    pronouns_and_address:
      - "Quy chiếu Tanya bằng `cô` / `nữ pháp sư ưu tú` từ góc nhìn người dự khán."
    pov_and_voice: "Trần thuật mô tả nỗi băn khoăn của những người dự khán và kết cục đúng theo tính toán của Bộ Tổng tham mưu."
    modality_and_logic: "Giữ sự đối lập giữa nỗi thấp thỏm của người dự khán với thực tế quyết định đã được đưa ra và pháp sư ưu tú mà tiền tuyến mong mỏi sẽ được thả đúng như Bộ Tổng tham mưu dự liệu."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000189
    terms:
      - "Mặt trận Rhine (The Rhine lines)"
      - "pháp sư còn có thể sử dụng (a usable mage)"
      - "vấn đề chính trị (a political issue)"
    pronouns_and_address: []
    pov_and_voice: "Bình luận theo góc nhìn tác chiến của quân đội."
    modality_and_logic: "Giữ lập luận rằng trong bối cảnh khẩn cấp ở mặt trận Rhine, việc giam giữ một pháp sư có thể sử dụng vì lý do chính trị là điều không thể chấp nhận."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000190
    terms:
      - "đạn pháo và các vật tư khác (shells and other supplies)"
      - "Đại quân (the Great Army)"
      - "pháp sư (mages)"
    pronouns_and_address:
      - "Quy chiếu phía điều phối quân sự bằng `Họ`."
    pov_and_voice: "Câu hỏi tu từ chất vấn về thứ tự ưu tiên chi viện."
    modality_and_logic: "Khóa tên gọi tạm `Đại quân` (`Great Army`), giữ câu hỏi phản vấn đối lập giữa việc ưu tiên đạn pháo/vật tư với việc ưu tiên pháp sư."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000191
    terms:
      - "pháp sư (mages)"
      - "tiền tuyến (the front lines)"
      - "Bộ Tổng tham mưu (the General Staff)"
      - "người mang danh hiệu Named đã được trao phù hiệu quân sự (a decorated Named)"
    pronouns_and_address:
      - "Trong lời cầu viện từ tiền tuyến tự xưng `chúng tôi`."
    pov_and_voice: "Trần thuật tái hiện tiếng kêu cứu từ tiền tuyến và tình thế thiếu hụt nguồn lực của Bộ Tổng tham mưu."
    modality_and_logic: "Khóa bản sửa theo B08-P06 (`một người mang danh hiệu Named đã được trao phù hiệu quân sự`), giữ hai câu điều kiện giả định trái thực tế ở đầu và cuối đoạn cùng câu hỏi tu từ `Mà lấy đâu ra nguồn lực chứ?`"
    emphasis: "Khóa chính xác hai câu cầu viện in nghiêng `*Cho chúng tôi thêm pháp sư! Chỉ thêm một người thôi cũng được!*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000192
    terms:
      - "Rhine (the Rhine)"
      - "tắc trách (negligent)"
    pronouns_and_address:
      - "Trong suy nghĩ của phía quân đội xưng `Chúng ta` và gọi Tanya là `cô ấy`; câu giả định cuối đoạn tiếp tục quy chiếu bằng `cô ấy`."
    pov_and_voice: "Tái hiện suy nghĩ quyết định của phía quân đội và lời bình bổ sung."
    modality_and_logic: "Giữ sự chuyển ý tự sửa ở câu cuối (`À không, nếu cô ấy thật sự tắc trách thì có lẽ mọi chuyện đã khác.`)."
    emphasis: "Khóa chính xác hai câu in nghiêng `*Chúng ta cần cô ấy ở Rhine. Đành chịu vậy thôi.*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000193
    terms: []
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba quy chiếu Tanya bằng `Nó` kèm phản thân `mình` (`phán đoán trước đây của mình`) theo đúng DEC-P01-001."
    pov_and_voice: "Câu kết luận nội tâm nối tiếp bằng trần thuật ngôi thứ ba theo điểm nhìn Tanya."
    modality_and_logic: "Giữ tâm trạng tự hào và nhẹ nhõm thấy rõ của Tanya khi phán đoán trước đó được chứng minh là đúng."
    emphasis: "Khóa chính xác câu in nghiêng `*Chỉ có những lý do đó thôi.*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000194
    terms:
      - "luật quân sự và luật quốc tế (military and international law)"
      - "tàu ngầm không rõ quốc tịch (a submarine of unknown nationality)"
      - "những phát súng cảnh cáo (warning shots)"
    pronouns_and_address:
      - "Độc thoại nội tâm ngôi thứ nhất của Tanya tự quy chiếu bằng `mình` (DEC-P01-001)."
    pov_and_voice: "Độc thoại nội tâm của Tanya điểm lại lập luận pháp lý bảo vệ hành động của bản thân."
    modality_and_logic: "Khóa bản sửa theo B08-P08 (`Theo luật quân sự và luật quốc tế, mình đã đe dọa một tàu ngầm không rõ quốc tịch`), giữ nguyên nhân tai nạn là do các phát súng cảnh cáo được bắn theo quy trình vốn không được xây dựng để áp dụng với tàu ngầm."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000195
    terms:
      - "các nhà ngoại giao (the diplomats)"
      - "vật tế thần (a sacrifice)"
    pronouns_and_address:
      - "Quy chiếu các nhà ngoại giao bằng `họ`; dùng `bạn` trong câu hỏi tu từ cuối đoạn."
    pov_and_voice: "Độc thoại nội tâm phân tích thế cờ giữa sai sót nghiệp vụ và mưu đồ tế thần."
    modality_and_logic: "Giữ câu điều kiện giả định trái thực tế ở câu 1 đối lập với thực tế không có lấy một lỗi nào ở câu 2–3."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000196
    terms:
      - "áp dụng kỷ luật (disciplinary action)"
      - "Bộ Nội vụ (the Ministry of the Interior)"
      - "lục quân và hải quân (the army and navy)"
      - "Bộ Ngoại giao (the Foreign Office)"
      - "thành tựu quân sự (military achievement)"
    pronouns_and_address:
      - "Độc thoại nội tâm của Tanya tự quy chiếu bằng `mình` (DEC-P01-001); quy chiếu phe muốn ép xử phạt bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm sắc sảo, pha chút tự giễu của Tanya."
    modality_and_logic: "Giữ hệ quả dây chuyền nếu cố ép kỷ luật Tanya (biến thành bê bối liên lụy từ Bộ Nội vụ, những người soạn quy tắc ở lục quân và hải quân, tới Bộ Ngoại giao) và câu tự nhận xét châm biếm ở cuối đoạn."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000197
    terms:
      - "pháp sư đầy triển vọng (a promising mage)"
      - "Phù hiệu Tấn công Cánh Bạc (the Silver Wings Assault Badge)"
      - "Tanya (Tanya)"
    pronouns_and_address:
      - "Trong hai câu độc thoại nội tâm in nghiêng tự quy chiếu bằng `Mình` / `mình`, quy chiếu cấp trên bằng `họ`; câu cuối chuyển sang trần thuật nêu tên `Tanya` (DEC-P01-001)."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất chuyển sang lời xác nhận của người kể chuyện."
    modality_and_logic: "Khóa tên gọi tạm `Phù hiệu Tấn công Cánh Bạc`, giữ kết luận nhân quả `Nói cách khác, họ không thể để mất mình.` và câu khẳng định của người kể."
    emphasis: "Khóa chính xác hai câu in nghiêng `*Mình là một pháp sư đầy triển vọng, lại còn được trao Phù hiệu Tấn công Cánh Bạc. Nói cách khác, họ không thể để mất mình.*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000198
    terms:
      - "Cục Đường sắt của lục quân (The army’s Railroad Department)"
      - "lực lượng hậu cần (the Service Corps)"
      - "Ban Tác chiến thuộc Bộ Tổng tham mưu (Operations in the General Staff)"
      - "bộ phận công nghệ (the Technology Division)"
      - "các sĩ quan pháp chế (the legal officers)"
    pronouns_and_address:
      - "Quy chiếu những người phụ trách ở các đơn vị bằng `họ`."
    pov_and_voice: "Trần thuật giải thích hoạt động gây sức ép ngầm của các cơ quan trong lục quân."
    modality_and_logic: "Khóa danh sách 4 cơ quan quân sự cùng gây sức ép không chính thức lên các sĩ quan pháp chế và nhận định ngoại suy ở câu cuối (`Sức ép ấy hẳn lớn đến mức khiến các sĩ quan pháp chế đau cả dạ dày.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000199
    terms:
      - "tổ chức quân sự (military organizations)"
      - "các sĩ quan pháp chế (the legal officers)"
    pronouns_and_address:
      - "Độc thoại nội tâm ngôi thứ nhất của Tanya tự quy chiếu bằng `Mình` / `mình` (DEC-P01-001); quy chiếu các sĩ quan pháp chế bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm của Tanya về tầm quan trọng của bản thân đối với bộ máy quân sự."
    modality_and_logic: "Giữ cấu trúc bác bỏ – khẳng định (`Không ai trực tiếp đe dọa cả, nhưng kỳ vọng mà nhiều tổ chức quân sự đặt vào mình đã gây sức ép ghê gớm lên các sĩ quan pháp chế, khiến họ không thể làm những đơn vị ấy thất vọng.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000200
    terms:
      - "các chuyên viên pháp chế (the legal specialists)"
      - "đưa ... ra xét xử tại tòa án quân sự (court-martial)"
    pronouns_and_address:
      - "Độc thoại nội tâm tự quy chiếu bằng `mình` (`đưa mình ra xét xử`); quy chiếu các chuyên viên pháp chế bằng `họ` kèm phản thân `mình` (`công việc của mình`)."
    pov_and_voice: "Độc thoại nội tâm đánh giá nỗ lực giữ thể diện quy trình của bộ phận pháp chế."
    modality_and_logic: "Khóa cụm `đưa mình ra xét xử tại tòa án quân sự và cân nhắc vụ việc`, giữ lời khen châm biếm nhẹ của Tanya rằng họ đã làm tốt công việc."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000201
    terms:
      - "chuyện nội bộ (an internal matter)"
      - "tổ chức (the organization)"
    pronouns_and_address: []
    pov_and_voice: "Độc thoại nội tâm phân tích sự khác biệt giữa góc nhìn nội bộ và góc nhìn bên ngoài."
    modality_and_logic: "Giữ phép nhượng bộ – đối lập: có thể ai đó trong tổ chức đã phản đối, nhưng với người ngoài thì kết quả cuối cùng trông vẫn chẳng khác gì."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000202
    terms:
      - "luật pháp quốc tế (international law)"
      - "Đế quốc (the Empire)"
      - "Khối Thịnh vượng chung (the Commonwealth)"
      - "tai nạn đáng tiếc (an unfortunate accident)"
    pronouns_and_address:
      - "Quy chiếu phía Khối Thịnh vượng chung bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm tổng kết cách dàn xếp ngoại giao chính thức giữa hai quốc gia."
    modality_and_logic: "Giữ đầy đủ ba vế của thỏa thuận ngoại giao: Đế quốc bày tỏ sự lấy làm tiếc, Khối Thịnh vượng chung tuyên bố mong chuyện không tái diễn, rồi hai bên đổ lỗi qua lại và quy phần lớn trách nhiệm cho bên kia."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000203
    terms:
      - "các nhà ngoại giao (diplomats)"
      - "Dân chúng Khối Thịnh vượng chung (The Commonwealth’s public)"
      - "chiến hạm (warships)"
    pronouns_and_address:
      - "Độc thoại nội tâm ngôi thứ nhất của Tanya tự quy chiếu bằng `Mình` (`Mình rất nghi ngờ`) theo đúng DEC-P01-001; quy chiếu dân chúng Khối Thịnh vượng chung bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm dự báo phản ứng phẫn nộ của công chúng Khối Thịnh vượng chung."
    modality_and_logic: "Khóa bản sửa đại từ theo B08-P09 (`Mình rất nghi ngờ`), giữ nguyên nhân khiến dân chúng Khối Thịnh vượng chung không dễ dàng bỏ qua (một chiến hạm bị đánh chìm và có người thiệt mạng)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000204
    terms:
      - "chính quyền Khối Thịnh vượng chung (Commonwealth authorities)"
    pronouns_and_address: []
    pov_and_voice: "Độc thoại nội tâm nhận định thẳng thắn về động thái kích động dư luận của chính quyền Khối Thịnh vượng chung."
    modality_and_logic: "Giữ dấu ba chấm mở đầu và nhận định trực diện rằng chính quyền Khối Thịnh vượng chung đang vui vẻ kích động những dư luận phẫn nộ ấy."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000205
    terms:
      - "Quân đội Đế quốc (Imperial Army)"
    pronouns_and_address: []
    pov_and_voice: "Khẩu hiệu/nhãn định kiến của dư luận Khối Thịnh vượng chung khép lại đoạn."
    modality_and_logic: "Giữ cụm danh từ cảm thán ngắn gọn kết đoạn."
    emphasis: "Khóa chính xác toàn bộ câu in nghiêng `*Quân đội Đế quốc tàn bạo.*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."
