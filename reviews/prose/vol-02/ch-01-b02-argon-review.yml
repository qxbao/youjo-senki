- source_term: turao_maneuver_area_border_alarm_and_dacian_mobilization_terms_vol02_ch01_b02
  proposed_vi: "Khu thao trường Turao, hậu phương, Dacia (part0010/p000001) / Đế quốc (part0010/p000002) / quân Dacia, hợp tác quốc tế, cuộc diễn tập (part0010/p000003) / Tiểu đoàn 203, vị trí chiến đấu, Bộ chỉ huy Biên phòng (part0010/p000005) / nhân sự của Bộ chỉ huy (part0010/p000006) / Trung úy Weiss (part0010/p000007) / Thiếu tá, báo cáo chiến trường, Hạm đội Không quân 7, Sở chỉ huy (part0010/p000008, p000012, p000020) / Trung úy Serebryakov (part0010/p000009) / Đại tá von Lergen, tùy viên quân sự, sĩ quan liên lạc (part0010/p000010, p000011, p000013) / Bộ Tổng tham mưu, mệnh lệnh niêm phong, Văn phòng Bộ Tổng tham mưu (part0010/p000013, p000024) / quân đội Dacia (part0010/p000014) / khu vực trung tâm (part0010/p000015) / sáu trăm nghìn quân Dacia, Hướng đạo sinh, toán Hướng đạo sinh (part0010/p000016, p000018, p000021) / Công quốc, chiến tranh hiện đại (part0010/p000017, p000018) / Cụm tập đoàn quân khu vực, bốn sư đoàn, mũi tiên phong (part0010/p000019) / lực lượng vệ binh quốc gia dự bị, Quân đội Nhân dân Triều Tiên, Quân đội Đế quốc (part0010/p000022)"
  alternatives_vi:
  - Bãi diễn tập dã chiến Turao (thay cho `Khu thao trường Turao` tại part0010/p000001 — ưu tiên `Khu thao trường Turao` vì gọn và tự nhiên trong ngữ cảnh quân sự tiếng Việt, đồng thời khớp với từ `thao trường` đã khóa ở B01) / Tập đoàn quân Không quân 7 hoặc Binh đoàn Không quân 7 (thay cho `Hạm đội Không quân 7` tại part0010/p000008 — ưu tiên giữ dịch sát `Hạm đội Không quân 7` theo lựa chọn tạm trong handoff, ghi nhận độ bất định do sắc thái hải quân trong tiếng Việt) / Bộ chỉ huy Biên giới (thay cho `Bộ chỉ huy Biên phòng` tại part0010/p000005 — ưu tiên `Bộ chỉ huy Biên phòng` vì đúng chức năng canh phòng tuyến biên giới trong ngữ cảnh báo động) / Cục Bộ Tổng tham mưu hoặc Bộ Tổng tham mưu (thay cho `Văn phòng Bộ Tổng tham mưu` tại part0010/p000013 — ưu tiên `Văn phòng Bộ Tổng tham mưu` để phân biệt bề mặt thuật ngữ với `Bộ Tổng tham mưu` trong cùng đoạn mà không tự suy diễn thành một cục chuyên trách cụ thể) / miền Trung hoặc Trung ương (thay cho `khu vực trung tâm` tại part0010/p000015 — ưu tiên `khu vực trung tâm` vì trung tính, ít suy diễn địa lý – hành chính nhất khi nguồn chưa nêu rõ cơ cấu vùng)
