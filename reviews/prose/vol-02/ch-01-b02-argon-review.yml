  - YS-LN02/Text/part0010.xhtml/p000024
  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ các thuật ngữ quân sự, quốc gia, đơn vị và nhân vật đã xác lập ở Tập 1 cùng B01 của Tập 2 (`Dacia`, `Công quốc`, `Đế quốc`, `Quân đội Đế quốc`, `Bộ Tổng tham mưu`, `Thiếu tá`, `sáu trăm nghìn quân Dacia`), đồng thời khóa tạm toàn bộ các lựa chọn thuật ngữ trong handoff `handoffs/vol-02/ch-01-b02.yml` (`Khu thao trường Turao`, `Tiểu đoàn 203`, `Bộ chỉ huy Biên phòng`, `nhân sự của Bộ chỉ huy`, `Trung úy Weiss`, `Trung úy Serebryakov`, `Hạm đội Không quân 7`, `Sở chỉ huy`, `Văn phòng Bộ Tổng tham mưu`, `khu vực trung tâm`, `Hướng đạo sinh` / `toán Hướng đạo sinh`, `Cụm tập đoàn quân khu vực`, `lực lượng vệ binh quốc gia dự bị`, `Quân đội Nhân dân Triều Tiên`, `mệnh lệnh niêm phong`). Đối với cấp bậc của Lergen tại part0010/p000010, p000011, p000013, giữ nguyên `Đại tá von Lergen` bám sát văn bản nguồn của lô này mà không tự ý đồng nhất hóa với `Trung tá von Lergen` ở B01."
  uncertainty: medium
  status: pending
  canon: false
- source_term: tanya_lergen_and_203rd_pronouns_and_address_vol02_ch01_b02
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng cách lặp lại tên riêng `Tanya` hoặc lược chủ ngữ khi không mơ hồ (part0010/p000001, p000003, p000004, p000010, p000016, p000018, p000025), dùng `mình` ở cụm sở hữu phản thân (part0010/p000025), và quy chiếu Đại tá von Lergen bằng cách lặp lại tên riêng `Lergen` (part0010/p000010, p000018); độc thoại nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` nhất quán (part0010/p000001, p000002, p000003, p000013); trong đối thoại giữa Tanya và thuộc cấp tại sở chỉ huy: thuộc cấp báo cáo gọi `Thưa Thiếu tá`, xưng `chúng tôi` (part0010/p000008), Tanya hạ lệnh gọi cấp bậc + tên (`Trung úy Weiss`, `Trung úy Serebryakov`) và tự xưng `tôi` (part0010/p000007, p000009); trong đối thoại giữa Tanya và Đại tá von Lergen: Tanya gọi `Đại tá von Lergen` / `thưa ngài` / `ngài`, tự xưng `tôi` / `tiểu đoàn tôi` (part0010/p000011, p000014, p000017, p000019, p000021, p000024), còn Lergen gọi Tanya là `Thiếu tá`, tự xưng `tôi` / `chúng tôi` (phía Bộ Tổng tham mưu) / `chúng ta` (phía Đế quốc nói chung) và dùng đại từ phản thân `mình` trong câu hỏi trực tiếp (part0010/p000012, p000015, p000020)"
  alternatives_vi:
  - nó hoặc cô cho Tanya / anh hoặc ông cho Lergen trong trần thuật (thay cho việc lặp tên riêng `Tanya` và `Lergen` hoặc lược chủ ngữ tại part0010/p000001, p000003, p000010, p000016, p000018, p000025 — ưu tiên lặp tên riêng `Tanya` / `Lergen` hoặc lược chủ ngữ theo đúng F3 và lựa chọn tạm `vol02-ch01-b02-tanya-narration`, `vol02-ch01-b02-lergen-narration` đã signoff trong handoff `handoffs/vol-02/ch-01-b02.yml`)
