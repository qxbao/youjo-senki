      - "diễn tập cận chiến của toàn hạm đội (full fleet close-quarters exercise)"
    pronouns_and_address:
      - "Trong lời thoại mở đầu cuộc họp: dùng đại từ bao gộp `ta`."
    pov_and_voice: "Lời phát biểu mở đầu buổi họp rút kinh nghiệm sau diễn tập."
    modality_and_logic: "Khóa thuật ngữ tạm `diễn tập cận chiến của toàn hạm đội` (T1); giữ lời kêu gọi điểm lại cuộc diễn tập."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa cụm `diễn tập cận chiến của toàn hạm đội` và đại từ `ta`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000480
    terms:
      - "Thủy thủ (The seamen)"
      - "PX"
      - "các sĩ quan (the officers)"
      - "ban trọng tài (the referees)"
      - "chỉ huy đơn vị (unit commander)"
      - "chiến đấu thực tế (actual combat)"
    pronouns_and_address:
      - "Quy chiếu thủy thủ bằng `họ`; dùng `Chúng tôi` cho nhóm sĩ quan (bao gồm Tanya) tham gia rà soát báo cáo sau diễn tập."
    pov_and_voice: "Trần thuật đan xen điểm nhìn ngôi thứ nhất số nhiều của Tanya trong vai trò sĩ quan."
    modality_and_logic: "Khóa việc giữ nguyên chữ viết tắt `PX` (T2) và thuật ngữ `ban trọng tài` (T3); giữ sự tương phản giữa thủy thủ được phép lên bờ trong tâm trạng nghỉ lễ phấn chấn sau diễn tập với các sĩ quan bắt đầu công việc thực sự (xem xét nhận xét của ban trọng tài và báo cáo của từng chỉ huy đơn vị để rút bài học cho thực chiến)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Thủy thủ`, `PX`, `các sĩ quan`, `ban trọng tài`, `chỉ huy đơn vị`, `chiến đấu thực tế` và đại từ `họ` / `Chúng tôi`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000481
    terms:
      - "tình huống đổ bộ lên tàu (boarding scenario)"
    pronouns_and_address: []
    pov_and_voice: "Nhận định đánh giá mục đích diễn tập từ góc nhìn của Tanya."
    modality_and_logic: "Giữ điểm khác biệt của cuộc diễn tập lần này (có thêm tình huống đổ bộ lên tàu mô phỏng thực tế tối đa) và nhận định giả định ở câu 2 (`Nhưng làm *chỉ* mỗi việc đó thì thật lãng phí`)."
    emphasis: "Khóa chính xác phạm vi nhấn mạnh `*chỉ*` khớp với thẻ `<em>` trong nguồn (DEC-P01-002)."
    locks:
      - "Khóa cụm `tình huống đổ bộ lên tàu` và dấu nhấn mạnh `*chỉ*` theo DEC-P01-002."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000482
    terms:
      - "cuộc diễn tập (exercise)"
    pronouns_and_address:
      - "Người phát biểu trong cuộc họp tự xưng `tôi`."
    pov_and_voice: "Lời phát biểu đánh giá tổng quan mở đầu cuộc họp."
    modality_and_logic: "Giữ quan hệ nhượng bộ về thời điểm đầu năm và nhận định có rào đón (`dù năm nay mới chỉ bắt đầu, tôi nghĩ có thể nói cuộc diễn tập này rất có ý nghĩa`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa đại từ `tôi` và mệnh đề nhượng bộ – đánh giá trong lời thoại."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000483
    terms:
      - "những người tham gia (the participants)"
      - "cuộc diễn tập (the exercise)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật tóm tắt kết quả đánh giá sau diễn tập."
    modality_and_logic: "Giữ quan hệ chứng minh giữa kết quả đánh giá và nhận định của những người tham gia rằng cuộc diễn tập đáng để tổ chức."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa nội dung kết quả đánh giá cho thấy những người tham gia đều cho rằng cuộc diễn tập đáng tổ chức."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000484
    terms:
      - "Hải quân (The navy)"
      - "căn cứ (the base)"
      - "chiến đấu chống pháp sư (anti-mage combat)"
      - "tác chiến chống hạm (counter-ship warfare)"
      - "các pháp sư tác chiến trên biển (marine mages)"
    pronouns_and_address:
      - "Quy chiếu Hải quân bằng `họ`."
    pov_and_voice: "Trần thuật phân tích nhu cầu tác chiến của Hải quân."
    modality_and_logic: "Khóa thuật ngữ `pháp sư tác chiến trên biển` (đồng bộ b25) và `tác chiến chống hạm`; giữ mức độ khát khao kinh nghiệm chống pháp sư của Hải quân (`có bao nhiêu cũng không đủ`) và bài học rút ra qua thực chiến rằng không thể xem nhẹ pháp sư tác chiến trên biển."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Hải quân`, `chiến đấu chống pháp sư`, `tác chiến chống hạm`, `các pháp sư tác chiến trên biển` và đại từ `họ`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000485
    terms:
      - "pháp sư tác chiến trên biển (marine mages)"
      - "diễn tập chiến tranh (war games)"
      - "hải quân (the navy)"
      - "cuộc diễn tập chung (joint exercise)"
    pronouns_and_address:
      - "Quy chiếu hải quân ở câu 1 bằng `họ`."
    pov_and_voice: "Trần thuật phân tích tình trạng thiếu hụt pháp sư nội bộ của hải quân."
    modality_and_logic: "Khóa sửa chữa B27-04: giữ đúng chủ thể `các pháp sư tác chiến trên biển` là những người vốn đã gần quá tải và vì được cần đến ở quá nhiều nơi nên không còn đủ điều kiện tham gia `diễn tập chiến tranh`, dẫn tới việc hải quân vô cùng phấn khởi khi có `cuộc diễn tập chung` này."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa sửa chữa B27-04 (`các pháp sư tác chiến trên biển vốn đã gần quá tải lại được cần đến ở quá nhiều nơi, nên không còn đủ điều kiện tham gia diễn tập chiến tranh`) và cụm `cuộc diễn tập chung`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000486
    terms:
      - "Tiểu đoàn 203 (203rd Battalion)"
      - "chiến đấu chống hạm (anti-ship combat)"
      - "đánh chiếm tàu (battles to capture ships)"
      - "Bộ Tổng tham mưu (General Staff)"
    names_and_ranks:
      - "Tanya"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng `bản thân Tanya và Tiểu đoàn 203`, quy chiếu tập thể đơn vị bằng `họ` / `Họ` (lưu ý từ `nó` cuối câu 2 quy chiếu cuộc diễn tập)."
    pov_and_voice: "Trần thuật từ góc nhìn của phía Tanya và Tiểu đoàn 203."
    modality_and_logic: "Giữ cả hai lý do tham gia: lợi ích tích lũy kinh nghiệm chống hạm/đánh chiếm tàu và tính bắt buộc do ý muốn của Bộ Tổng tham mưu (`Họ không còn lựa chọn nào khác ngoài tham gia`), cùng kết luận nhượng bộ (`Dẫu vậy, đây vẫn là một trải nghiệm hữu ích`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `bản thân Tanya và Tiểu đoàn 203`, `chiến đấu chống hạm`, `đánh chiếm tàu`, `Bộ Tổng tham mưu` và tính chất bắt buộc tham gia ở câu 3."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000487
    terms:
      - "ban trọng tài (the referees)"
      - "những pháp sư tinh nhuệ đặc biệt (particularly elite mages)"
      - "hải quân (the navy)"
    pronouns_and_address:
      - "Quy chiếu ban trọng tài ở câu 1 bằng `họ`."
    pov_and_voice: "Trần thuật khẳng định giá trị thực chất của cuộc diễn tập."
    modality_and_logic: "Khóa thuật ngữ `ban trọng tài` (T3); giữ sự thực tâm trong lời nhận xét của ban trọng tài và quan hệ nhượng bộ ở câu 2 (`dù phải đối đầu với những pháp sư tinh nhuệ đặc biệt, việc tích lũy kinh nghiệm ứng phó với tình huống ấy rõ ràng rất có giá trị đối với hải quân`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `ban trọng tài`, `những pháp sư tinh nhuệ đặc biệt`, `hải quân` và quan hệ nhượng bộ ở câu 2."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000488
    terms:
      - "chiến hạm *Basel* (warship *Basel*)"
    names_and_ranks:
      - "Thuyền trưởng Grän (Captain Grän)"
    pronouns_and_address: []
    pov_and_voice: "Lời người chủ trì cuộc họp giới thiệu phần phát biểu của Thuyền trưởng Grän."
    modality_and_logic: "Khóa chức danh tạm `Thuyền trưởng Grän` theo quyết định B27-05 (không tự suy diễn thành quân hàm `Đại úy`)."
    emphasis: "Khóa chính xác phạm vi nhấn mạnh tên tàu `*Basel*` khớp với thẻ `<em>` trong nguồn (DEC-P01-002)."
    locks:
      - "Khóa chức danh tạm `Thuyền trưởng Grän` (B27-05) và tên tàu in nghiêng `*Basel*` (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000489
    terms:
      - "chiến hạm (ship)"
      - "cuộc diễn tập (the exercise)"
    names_and_ranks:
      - "Thuyền trưởng Grän (Captain Grän)"
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
    pronouns_and_address:
      - "Trong lời kể: dùng `Thuyền trưởng Grän`, `Thiếu tá von Degurechaff` và đại từ `ông` / `mình` cho Grän; trong lời thoại của Grän: dùng `phía cô` để quy chiếu lực lượng của Tanya và `chúng tôi` cho phía tàu của mình."
    pov_and_voice: "Trần thuật hành động và biểu cảm của Thuyền trưởng Grän đan xen lời thoại thừa nhận thất bại."
    modality_and_logic: "Khóa sửa chữa B27-05 (`Thuyền trưởng Grän`) và B27-06 (`phía cô` — không dùng `các cô`); giữ cấu trúc phủ định kép ở câu cuối (`Trong cuộc diễn tập không ai thiệt mạng, nhưng điều đó không có nghĩa con tàu không bị phá tan hoang`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Thuyền trưởng Grän`, `Thiếu tá von Degurechaff`, cách gọi `phía cô` – `chúng tôi` (B27-06), đại từ `ông` và cấu trúc phủ định kép ở câu cuối."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000490
    terms:
      - "thuật thức (formulas)"
      - "lựu đạn (grenades)"
      - "thủy thủ đoàn (the crew)"
      - "kiểm soát thiệt hại (damage control)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật mô tả hiện trạng hư hại trên tàu sau cuộc diễn tập."
    modality_and_logic: "Khóa thuật ngữ `kiểm soát thiệt hại` (T4) và `thuật thức`; giữ cấu trúc tăng tiến (`Không chỉ là vỡ vài ô cửa kính`), sự nhượng bộ về trang bị diễn tập vẫn bị ném khắp nơi, và dấu chấm lửng bỏ lửng ở cuối câu 3 (`nhưng dù sao thì…`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `thuật thức`, `lựu đạn`, `thủy thủ đoàn`, `kiểm soát thiệt hại` (T4) và nhịp bỏ lửng ở cuối đoạn."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000491
    terms:
      - "kiểm soát thiệt hại (Damage control)"
      - "Thủy thủ đoàn (The crew)"
    pronouns_and_address: []
    pov_and_voice: "Lời báo cáo ngắn gọn của Thuyền trưởng Grän về công tác khắc phục hậu quả."
    modality_and_logic: "Khóa thuật ngữ `kiểm soát thiệt hại` (T4) đồng bộ với p000490; giữ đánh giá mức độ (`khá suôn sẻ`) và việc sửa chữa kịp thời."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa cụm `Công tác kiểm soát thiệt hại` và `Thủy thủ đoàn`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000492
    terms:
      - "kiểm tra khả năng vận hành (operation inspection)"
      - "bảo dưỡng bên trong (interior maintenance)"
      - "động cơ (the engines)"
    pronouns_and_address:
      - "Quy chiếu phía hải quân/thủy thủ đoàn bằng `họ` và kết quả bằng `chúng`."
    pov_and_voice: "Trần thuật ghi nhận kết quả kiểm tra kỹ thuật của tàu sau diễn tập."
    modality_and_logic: "Giữ mức độ đánh giá vừa phải (`Kết quả cũng ổn. Ít ra họ có thể hài lòng với chúng.`) và khẳng định không phát hiện vấn đề gì khi kiểm tra vận hành sau bảo dưỡng bên trong (chủ yếu là động cơ)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `kiểm tra khả năng vận hành`, `bảo dưỡng bên trong`, `động cơ` và phủ định `không phát hiện vấn đề gì`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000493
    terms:
      - "đưa tàu vào ụ (docked)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật bổ sung thực tế các hư hỏng lặt vặt vẫn tốn thời gian sửa chữa."
    modality_and_logic: "Giữ quan hệ nhượng bộ giữa việc thiệt hại chưa đến mức phải đưa tàu vào ụ với việc vẫn còn nhiều hạng mục sửa chữa (thay kính vỡ, nắn chỗ móp méo...) sẽ mất thời gian."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa cụm `chưa nghiêm trọng đến mức phải đưa tàu vào ụ` và phần liệt kê trong cặp dấu gạch ngang."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000494
    terms:
      - "Liên minh Entente (Entente Alliance)"
      - "cảng trung lập (neutral port)"
      - "thuyền trưởng (the captain)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật nêu mốc thời gian sửa chữa gắn với tình hình tàu Liên minh Entente."
    modality_and_logic: "Khóa tên riêng `Liên minh Entente`, `cảng trung lập` và chức danh `thuyền trưởng`; giữ quan hệ đối lập giữa việc may mắn kịp vá víu xong trước mốc tàu Liên minh Entente phải rời cảng trung lập với thái độ vẫn không vui của thuyền trưởng."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Liên minh Entente`, `cảng trung lập` và `thuyền trưởng`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000495
    names_and_ranks:
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
    pronouns_and_address:
      - "Câu 1 trần thuật ngôi thứ ba dùng chức danh `Thiếu tá von Degurechaff`; câu 2–3 chuyển sang độc thoại nội tâm ngôi thứ nhất của Tanya dùng nhất quán đại từ tự quy chiếu `mình` theo DEC-P01-001 (B27-08)."
    pov_and_voice: "Trần thuật ngôi thứ ba chuyển trực tiếp sang độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa sửa chữa B27-08: giữ đúng sự chuyển ngôi từ hành động cúi chào đáp lễ của `Thiếu tá von Degurechaff` sang suy nghĩ nội tâm dùng `mình` (`có lẽ mình cứ phải làm vậy thôi; còn hơn để người ta cho là mình vô tâm`), bảo toàn sắc thái ngập ngừng (`có lẽ`) và lý do giữ hình ảnh xã giao."
    emphasis: "Không dùng `*...*` (nguồn không có thẻ `<em>` ở đoạn này)."
    locks:
      - "Khóa `Thiếu tá von Degurechaff` ở câu 1 và đại từ nội tâm `mình` ở câu 3 theo DEC-P01-001 (B27-08)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000496
    terms:
      - "hỏa lực phòng không (anti–air fire)"
      - "pháp sư (mages)"
    pronouns_and_address:
      - "Trong lời thoại: Thuyền trưởng Grän dùng `chúng ta`; trong lời kể: quy chiếu Grän bằng `Ông`."
    pov_and_voice: "Lời phát biểu bức xúc của Thuyền trưởng Grän tiếp nối bằng câu trần thuật mô tả thái độ của ông."
    modality_and_logic: "Khóa thuật ngữ `hỏa lực phòng không` (T5); giữ chi tiết phủ định nhấn mạnh (`chẳng sượt trúng được pháp sư nào đang áp sát`) và thái độ muốn dạy dỗ đám thuộc hạ từng khoác lác rằng sẽ không để pháp sư nào bén mảng tới gần tàu."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `hỏa lực phòng không` (T5), đại từ `chúng ta` trong thoại và `Ông` trong trần thuật."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000497
    terms:
      - "pháo thủ (gunners)"
      - "cuộc diễn tập (an exercise)"
      - "chiến trận thực sự (actual combat)"
    pronouns_and_address:
