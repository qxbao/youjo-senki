  - id: vol02-ch04-b27-ranks-pronouns-and-pov
    source_term: "Captain Grän (`Thuyền trưởng Grän`), Major von Degurechaff (`Thiếu tá von Degurechaff`), Tanya third-person narration (`Tanya` / `Thiếu tá von Degurechaff`) vs. first-person interior monologue (`mình` in p000495) and first-person plural officer group (`Chúng tôi` in p000480), Captain Grän dialogue address to Tanya's side (`phía cô` in p000489), conference question address to Tanya (`cô` in p000499), generic second-person omission (p000501), and italicized emphases (p000481, p000488)"
    proposed_vi: "Khóa danh xưng chức trách tạm `Thuyền trưởng Grän` (p000488, p000489) và `thuyền trưởng` / `Các thuyền trưởng quan sát` (p000488, p000494, p000498) theo quyết định B27-05 trong handoff, không tự gán quân hàm hải quân khi chưa đủ căn cứ; quy chiếu Grän trong lời kể bằng đại từ trang trọng trung tính `ông` / `Ông` (p000489, p000496, p000497); giữ quân hàm `Thiếu tá von Degurechaff` (p000489, p000495, p000499); tuân thủ nghiêm ngặt DEC-P01-001 và sửa chữa B27-08: trong trần thuật ngôi thứ ba về Tanya dùng chức danh/tên riêng `Thiếu tá von Degurechaff` (p000489, p000495 câu 1) hoặc `Tanya` (p000486, p000500, p000501), tuyệt đối không dùng đại từ `cô` trong lời kể (lưu ý từ `nó` ở câu 2 p000486 quy chiếu cuộc diễn tập); khi chuyển sang độc thoại nội tâm ngôi thứ nhất số ít tự quy chiếu của Tanya tại câu 2–3 của p000495, dùng nhất quán đại từ `mình` (`có lẽ mình cứ phải làm vậy thôi; còn hơn để người ta cho là mình vô tâm`); khi Tanya gộp mình vào nhóm các sĩ quan phải làm việc hậu diễn tập tại p000480, dùng `Chúng tôi`; trong lời thoại tại cuộc họp, người chủ trì dùng `ta` (p000479) và `tôi` (p000482), đồng thời khi hỏi trực tiếp Tanya tại p000499 gọi `Thiếu tá von Degurechaff` và dùng đại từ ngôi thứ hai `cô`; Thuyền trưởng Grän khi nói với Tanya về lực lượng của Tanya tại p000489 dùng cụm trung tính theo ngữ cảnh `phía cô` đối lập với `chúng tôi` (theo quyết định B27-06, tránh gán giới tính nữ cho toàn bộ đơn vị tấn công), và khi nói về nhiệm vụ chung của phía hải quân tại p000496 dùng `chúng ta`; Tanya trong lời thoại phát biểu trước cuộc họp tại p000500 tự xưng `tôi` / `Tôi`; tại p000501, lược chủ ngữ ngôi thứ hai phiếm chỉ trong cấu trúc điều kiện/dẫn giải khái quát; bảo toàn chính xác hai phạm vi nhấn mạnh `*...*` theo DEC-P01-002 tại p000481 (`*chỉ*`) và p000488 (`*Basel*`)"
    alternatives_vi:
      - "phía tấn công (thay cho `phía cô` trong lời Thuyền trưởng Grän nói với Thiếu tá von Degurechaff tại p000489 — ưu tiên giữ `phía cô` vì khớp trực tiếp với quyết định B27-06 của coordinator và giữ được sắc thái Grän đang đứng dậy cúi chào nói trực tiếp với Tanya)"
    segment_ids:
