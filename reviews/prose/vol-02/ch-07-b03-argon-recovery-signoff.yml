      nhất để chỉ hoạt động vừa giao chiến thật sự (chấp nhận thương vong cao như
      nêu ở p000053, p000058) vừa thăm dò bố trí phòng ngự/vị trí quân địch (p000056).
      “Trinh sát bằng vũ lực” sát chữ nhưng hơi nặng cấu trúc giới từ; “trinh sát
      có vũ trang” dễ làm giảm sắc thái chủ động giao chiến. Tại p000056, Flash có
      thể cân nhắc sắc thái dò tìm (“thăm dò”) nếu cần làm mượt câu nhưng bản hiện
      tại đã đủ nghĩa.
