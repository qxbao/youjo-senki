  proposed_vi: "Tanya, quân phương Bắc, Bộ Tổng tham mưu, chiến dịch quy mô lớn, Norden, quyền chủ động dẫn dắt cuộc chiến (part0018/p000088) / Liên minh Entente, Đế quốc, những đòn đánh chặn kiểu du kích, phản công, giới tinh hoa trong Lục quân Đế quốc (part0018/p000089) / Vitamin P (part0018/p000090) / Trung úy Weiss, phó chỉ huy (part0018/p000094, p000098, p000102) / Thiếu úy Serebryakov, Miền Bắc, Bộ chỉ huy phương Bắc (part0018/p000096) / cuộc tổng tấn công, phong thư lệnh, cuộc tổng tấn công lớn, Cụm tập đoàn quân phương Bắc, Dacia (part0018/p000097–p000099, p000102, p000111, p000112) / các sĩ quan cấp cao, trường phái Chicago, cơ chế khuyến khích (part0018/p000100, p000107) / ngân sách cho hậu cần, tuyến tiếp tế, kho tiền bí mật (part0018/p000101, p000102) / nguồn tiền ngoài sổ sách, các thanh tra, nền kinh tế bong bóng, Kiểm toán, thị trường (part0018/p000103) / các quan chức đi thu thuế, kinh tế thị trường tự do, tư nhân hóa việc thu thuế (part0018/p000105, p000107) / căn cứ hải quân, tiệc mừng chiến thắng (part0018/p000110) / Quân Trung ương, viên chức của Cụm tập đoàn quân phương Bắc, Ban Ngân sách, yêu cầu cấp kinh phí (part0018/p000111) / Trung úy Serebryakov, quỹ tiểu đoàn, dự toán (part0018/p000113, p000115)"
