findings:
  - id: "B16-F01"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000492"
    category: "terminology_and_role_distinction"
    issue: "Tại câu đầu của `p000492`, cụm danh từ chỉ Weiss với vai trò người trợ giúp/cấp phó đắc lực của Tanya được dịch là `người phụ tá tài giỏi`, trùng từ khóa `phụ tá` vừa dùng cho chức danh sĩ quan phụ tá (`adjutant`) của Serebryakov ở `p000483` (`viên phụ tá của mình`), dễ gây nhầm lẫn chức vụ trong ban chỉ huy tiểu đoàn."
    basis: "Trong `p000482`, Weiss được xác định là `Phó chỉ huy` (`vice commander`), còn ở `p000483` Serebryakov là `viên phụ tá` (`adjutant`). Ở `p000492`, danh từ nguồn mang nghĩa người trợ thủ/cánh tay phải đắc lực chứ không phải chức danh sĩ quan phụ tá."
    recommendation: "Đổi `người phụ tá tài giỏi` ở `p000492` thành `người trợ thủ tài giỏi` hoặc `người trợ thủ đắc lực` để tách bạch rõ với chức danh `viên phụ tá` của Serebryakov ở `p000483`."
    resolution: "pending_revision"

  - id: "B16-F02"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000493"
    category: "rank_consistency_and_lexical_accuracy"
    issue: "Tại câu đầu của `p000493`, cấp bậc đầy đủ của Weiss (`First Lieutenant Weiss`) được dịch là `Thượng úy Weiss`, mâu thuẫn trực tiếp với cách gọi `Trung úy Weiss` ở `p000482` và `p000484` trong cùng batch; đồng thời tính từ định danh mang sắc thái phẩm chất hiền lành/tốt bụng đi trước cấp bậc được dịch lệch sang năng lực thành `xuất sắc` (`viên Thượng úy Weiss xuất sắc`)."
    basis: "Trong hệ thống quân hàm của truyện và mạch dịch hiện tại, Weiss giữ quân hàm `Trung úy` (khi gọi tắt ở `p000482`, `p000484` lẫn khi nêu đủ bậc ở `p000493`). Ngoài ra, tính từ đi kèm tên Weiss ở `p000493` tương ứng trực tiếp với cặp tính từ chỉ bản tính lương thiện, có lương tâm của anh ở `p000506` (`Weiss lương thiện và có lương tâm`) — chính vì bản tính đàng hoàng, tử tế và sáng suốt nên anh mới nảy sinh băn khoăn về chiến dịch ở Arene, còn năng lực tác chiến của anh được tách riêng ở câu thứ hai (`trên mức trung bình`)."
    recommendation: "Đồng bộ quân hàm ở `p000493` thành `Trung úy Weiss` và chỉnh cụm danh ngữ thành `chàng Trung úy Weiss tử tế` hoặc `viên Trung úy Weiss lương thiện` (hoặc `Trung úy Weiss tốt bụng`)."
    resolution: "pending_revision"

  - id: "B16-F03"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000508"
    category: "terminology_accuracy"
    issue: "Tại vế in nghiêng thứ hai của `p000508`, danh từ chỉ lực lượng vũ trang không chính quy/du kích tại Arene (`the partisans of Arene`) được dịch thành `phe thân Cộng hòa ở Arene`, làm mờ ranh giới thuật ngữ quân sự - pháp lý giữa đối tượng có thiện cảm chính trị (`pro-Republic` ở `p000504`) và thành phần du kích kháng chiến (`partisans`)."
    basis: "Ở `p000504`, nguồn dùng cách gọi chỉ khuynh hướng chính trị và đã được dịch đúng là `đám thân Cộng hòa cố thủ ở Arene`. Sang `p000506`–`p000508`, lập luận của Tanya xoay quanh tính hợp pháp theo luật chiến tranh, trong đó việc định danh mục tiêu tại Arene là `quân du kích` / `lực lượng du kích` (`partisans`) là cơ sở trực tiếp dẫn tới kết luận hoàn cảnh đòi hỏi họ phải chết."
    recommendation: "Đổi `phe thân Cộng hòa ở Arene` ở `p000508` thành `quân du kích ở Arene` hoặc `lực lượng du kích ở Arene` (hoặc `đám du kích ở Arene`)."
    resolution: "pending_revision"

  - id: "B16-F04"
    severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000479"
    category: "terminology_alignment"
    issue: "Tại câu thứ hai của `p000479`, cụm thuật ngữ chỉ hỏa lực bắn có kỷ luật/kiểm soát của Cộng hòa được dịch là `hỏa lực được tổ chức bài bản của Cộng hòa`, hơi khác về chữ so với phương án tạm `hỏa lực có kiểm soát` trong `work/run-state/pending-terms-index.yml`."
    basis: "Nghĩa chiến thuật và quan hệ nhượng bộ giữa thiết kế đội hình tấn công với thực tế đội hình bị rối loạn sau đợt phản công của địch vẫn được truyền tải rõ ràng."
    recommendation: "Không bắt buộc chặn nếu giữ tự nhiên, nhưng khuyến nghị đồng bộ thành `hỏa lực có kiểm soát của Cộng hòa` theo `pending-terms-index.yml`."
    resolution: "optional_polish"

  - id: "B16-F05"
    severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000499"
    category: "lexical_nuance"
    issue: "Tại câu thứ ba của `p000499`, danh từ định danh chiến tranh như một sự lãng phí nguồn lực (`this waste called war`) được dịch thoát ý thành `cuộc chiến vô nghĩa này`, làm giảm nhẹ phép ẩn dụ kinh tế học nối tiếp câu trước về vốn con người trong xã hội tư bản."
    basis: "Câu thứ hai và thứ ba của `p000499` đặt trong lăng kính thị trường của Tanya: những cá nhân coi trọng lý trí và thị trường là trụ cột của xã hội tư bản tương lai, nên việc tiêu hao họ (`squander them`) vào sự lãng phí mang tên chiến tranh (`this waste called war`) là điều kinh khủng."
    recommendation: "Ở bước chỉnh sửa hoặc polish có thể đổi `trong cuộc chiến vô nghĩa này` thành `vào sự lãng phí mang tên chiến tranh này` để giữ trọn sắc thái kinh tế học của Tanya."
    resolution: "optional_polish"

