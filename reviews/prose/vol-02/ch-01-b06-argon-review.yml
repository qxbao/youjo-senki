  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` cho độc thoại nội tâm của Tanya (`mình`), đồng thời giữ đúng toàn bộ các quyết định đã sửa và signoff trong handoff `handoffs/vol-02/ch-01-b06.yml` (`M1`, `M2`, `M3`, `M4`: phân biệt rõ `Thiếu úy Serebryakov` với `Trung úy Weiss`; lặp tên riêng `Tanya` hoặc lược chủ ngữ trong trần thuật ngôi thứ ba; tách câu nêu rõ chủ thể `tôi` nổ súng ở p000132; dùng `mình` cho suy nghĩ nội tâm và `tôi` cho hành động được kể ở ngôi thứ nhất)."
