  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng cách lặp lại tên riêng `Tanya` hoặc tỉnh lược chủ ngữ kết hợp đại từ phản thân `mình` (part0010/p000120, p000121, p000122, p000124, p000126, p000127, p000128, p000129, p000135, p000137), không dùng `nó` hay `cô`; trong các đoạn chuyển sang điểm nhìn ngôi thứ nhất của Tanya: mệnh đề suy nghĩ/đánh giá nội tâm dùng `Mình` / `mình` theo DEC-P01-001 (part0010/p000128, p000131, p000152), còn mệnh đề thuật lại hành động trực tiếp (ra lệnh, phong ấn, cảm ơn, nổ súng, ngắm bắn) giữ `Tôi` / `tôi` (part0010/p000131, p000132); trần thuật ngôi thứ ba từ điểm nhìn của Trung úy Weiss quy chiếu Weiss bằng `anh` kết hợp đại từ phản thân `mình`, và câu hỏi độc thoại nội tâm in nghiêng dùng `Mình` (part0010/p000141, p000143, p000144, p000148, p000152), riêng khi nhìn từ góc độ của Tanya thì quy chiếu Weiss bằng `anh ta` (part0010/p000131, p000132, p000137, p000152) hoặc `hắn` trong câu mệnh lệnh giận dữ với Serebryakov (part0010/p000129); trong đối thoại quân sự: Tanya tự xưng `tôi`, dùng `ta` trong câu đe dọa đưa ra tòa án quân sự, gọi Serebryakov là `Thiếu úy` và gọi Weiss là `Weiss` / `Trung úy` – `anh` (part0010/p000121, p000124, p000129, p000135, p000138, p000140, p000145, p000147, p000150); Serebryakov và Weiss gọi Tanya là `Thiếu tá` / `thưa thiếu tá` / `T-Thiếu tá von Degurechaff`, Weiss tự xưng `tôi` kèm tiểu từ lễ phép `ạ` khi hỏi lại (part0010/p000125, p000130, p000134, p000136, p000139, p000142, p000149)"
  alternatives_vi:
  - nó cho Tanya trong trần thuật (thay cho việc lặp tên riêng `Tanya` hoặc tỉnh lược chủ ngữ tại part0010/p000121, p000122, p000128, p000129, p000135, p000137 — ưu tiên lặp tên riêng `Tanya` hoặc tỉnh lược chủ ngữ theo đúng quyết định sửa `M2` và `provisional_review_choices.tanya_third_person_narration` đã signoff trong handoff `handoffs/vol-02/ch-01-b06.yml`, đồng bộ với B01–B05 của Chương 1 Tập 2) / anh ta (thay cho `hắn` trong lời quát của Tanya tại part0010/p000129 — giữ `hắn` theo bản dịch đã signoff và chỉ ghi nhận `anh ta` làm gợi ý tùy chọn ở bước chuốt văn)
