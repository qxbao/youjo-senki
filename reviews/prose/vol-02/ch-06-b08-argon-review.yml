      Ở các câu trần thuật ngôi thứ ba quy chiếu Tanya trong `b08` (`p000225`, `p000232`, `p000238`, `p000242`, `p000246`), bản dịch đang dùng đại từ `cô` theo lựa chọn cục bộ `T03` trong `ch-06-b08-codex.md`, trong khi phần mở đầu cùng phân cảnh thảo luận ở cuối `b07` (`p000214`, `p000215`, `p000217`) và phân cảnh kế tiếp ở `b09` (`p000274`, `p000276`, `p000278`, `p000279`, `p000281`) dùng `nó` hoặc lặp tên riêng `Tanya` theo `DEC-P01-001`.
    basis: >-
      Trong nội bộ `b08`, sự phân tách giữa lời kể ngôi thứ ba (`cô` / `Tanya`) và nội tâm tự quy chiếu (`mình` tại `p000242`, `p000245`) được thực hiện hoàn toàn nhất quán, rõ chủ thể và đã xử lý đầy đủ toàn bộ 8 finding của vòng review trước (`B08-M01`–`B08-M06`, `B08-L01`–`B08-L02`).
    recommendation: >-
      Không chặn signoff; ở bước polish/signoff, điều phối viên có thể giữ nguyên tính nhất quán cục bộ của `b08` hoặc đồng bộ đại từ trần thuật ngôi thứ ba về `nó` / `Tanya` để liền mạch giọng kể với `b07` và `b09`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000249
    category: style_repetition
    issue: >-
      Tại câu thứ ba của `p000249`, cụm danh từ chủ ngữ và động từ vị ngữ đứng sát nhau có hiện tượng lặp từ gần âm/gần nghĩa (`Những kẻ lợi dụng luật pháp để kiếm lợi thậm chí có thể kiếm lời từ những vụ kiện bằng sáng chế tốn thời gian…`).
    basis: >-
      Câu dịch đã áp dụng đúng đề xuất tạm `những kẻ lợi dụng luật pháp để kiếm lợi` trong `chapter6_b08_coordinator_choices` và giữ nguyên nghĩa mỉa mai về kiện tụng bằng sáng chế, chỉ hơi nặng nhịp câu do lặp `kiếm lợi` – `kiếm lời`.
    recommendation: >-
      Không chặn signoff; ở bước chuốt văn có thể tinh chỉnh nhẹ thành `Những kẻ lợi dụng luật pháp để kiếm lợi thậm chí còn thu lời được từ những vụ kiện bằng sáng chế tốn thời gian…` hoặc `Những kẻ lợi dụng luật pháp để trục lợi thậm chí có thể kiếm lời từ...`.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000250
    category: syntax_clarity
    issue: >-
      Tại câu đầu của `p000250` (`Đế quốc vốn luôn nghiêm túc diễn giải lại luật pháp một cách nghiêm túc thì có gì sai?`), định ngữ `vốn luôn nghiêm túc` đặt liền trước động từ `diễn giải lại` không có từ nối hoặc danh từ làm điểm tựa nên khi đọc lướt dễ bị hiểu nhầm thành trạng ngữ chỉ thói quen diễn giải luật từ trước đến nay của Đế quốc.
    basis: >-
      Bản dịch đã bảo toàn rất tốt phép điệp tính từ `nghiêm túc` phục vụ giọng tự biện hộ của Tanya; việc tách rõ ranh giới giữa cụm danh từ chủ ngữ (`Đế quốc vốn luôn nghiêm túc`) và hành động (`diễn giải lại luật pháp một cách nghiêm túc`) sẽ giúp cấu trúc câu sáng rõ hơn nữa.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh nhẹ thành `Việc Đế quốc vốn luôn nghiêm túc nay diễn giải lại luật pháp một cách nghiêm túc thì có gì sai?` hoặc `Một Đế quốc vốn luôn nghiêm túc lại đi nghiêm túc diễn giải lại luật pháp thì có gì sai?`.
    resolution: optional_polish

