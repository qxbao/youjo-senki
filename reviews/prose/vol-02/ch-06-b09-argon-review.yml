  - segment_id: YS-LN02/Text/part0030.xhtml/p000265
    terms:
      - "Nam Tư cũ"
      - "công dân"
      - "binh lính"
      - "tội ác chiến tranh"
      - "lý trí"
    pronouns_and_address: "Quy chiếu `Nam Tư cũ` và công dân của họ bằng `họ` / `bọn họ`, dùng `ta` trong mệnh đề suy luận giả định, và chuyển đại từ ngôi thứ hai phiếm chỉ ở câu cuối sang `người ta` theo `direct-address choice`."
    pov_and_voice: "Giọng liên tưởng lịch sử kiếp trước kết hợp tự nhận thức tỉnh táo về việc lối diễn giải cực đoan này bóp méo cả lý trí."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu `…`, dẫn chứng tiền lệ Nam Tư cũ tuyên bố mọi công dân đều là binh lính, mệnh đề kết luận hợp lý của cách diễn giải đó (rằng có thể cho nổ tung tất cả mà không phạm tội ác chiến tranh, không tự thêm phương tiện ném bom), và câu nhận xét nhượng bộ ở cuối rằng đẩy kiểu diễn giải này đến cực đoan có thể bóp méo cả lý trí."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh mệnh đề suy luận giả định `*Nếu ai cũng là binh lính, ta có thể cho nổ tung tất cả bọn họ mà không bị xem là phạm tội ác chiến tranh*` tương ứng thẻ `<html:em>`, giữ nguyên phần lời kể còn lại ở chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000266
    terms:
      - "công lý"
      - "sự công bằng"
    pronouns_and_address: "Nhận định nội tâm khái quát không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng kết luận dửng dưng, thực tế."
    modality_and_logic: "Bảo toàn quan hệ hệ quả tất nhiên: công lý và sự công bằng tất nhiên cũng bị bóp méo theo."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000267
    terms:
      - "một vị thần hay ác quỷ"
      - "Being X"
      - "công lý"
    pronouns_and_address: "Quy chiếu `Being X` bằng cụm định danh bất kính `gã Being X này` và đại từ phản thân `mình`; lược đại từ ngôi thứ hai phiếm chỉ ở câu cuối theo `direct-address choice`."
    pov_and_voice: "Giọng độc thoại nội tâm bất cần, thách thức và đổ lỗi ngược cho Being X để tự hợp thức hóa bản thân."
    modality_and_logic: "Bảo toàn đủ 6 câu cùng cặp dấu gạch ngang dài chêm ý: lời xác nhận bất cần (`Đúng thế. Rồi sao? Thì sao nào?`) -> định đề thực chứng pháp lý (`Khái niệm vẫn chỉ là khái niệm, luật tồi vẫn là luật`) -> tiền đề về thế giới nơi `gã Being X này` tùy ý làm theo ý mình -> giả định suy ngẫm nghiêm túc về công lý kèm mức phỏng đoán `có lẽ` rằng kẻ quy định thế giới phải chìm trong chiến tranh mới là kẻ ác."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000268
    terms: []
    pronouns_and_address: "Tuân thủ `DEC-P01-001`: nội tâm tự quy chiếu của Tanya dùng `mình`."
    pov_and_voice: "Giọng tự bào chữa trơ trẽn mà hoàn toàn tự tin của Tanya."
    modality_and_logic: "Bảo toàn kết luận đánh đồng việc tuân thủ quy tắc/lách luật với sự lương thiện (`Nói cách khác, mình chỉ là một người tốt đang làm tròn bổn phận`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000269
    terms:
      - "Q.E.D.¹⁹"
    pronouns_and_address: "Cụm kết luận viết tắt không dùng đại từ."
    pov_and_voice: "Giọng đóng lại chuỗi ngụy biện nội tâm như một bài toán đã chứng minh xong."
    modality_and_logic: "Bảo toàn chữ viết tắt `Q.E.D.` và ký hiệu gọi chú thích số mũ `¹⁹`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000270
    terms:
      - "tư lệnh quân đoàn"
      - "thiếu tá"
      - "con quái vật này"
    pronouns_and_address: "Mở đầu phân cảnh mới từ góc nhìn vị tư lệnh quân đoàn: quy chiếu tư lệnh quân đoàn bằng `ông`, và quy chiếu Tanya bằng cách gọi đánh giá `một sĩ quan chỉ mang hàm thiếu tá` / `con quái vật này`."
    pov_and_voice: "Giọng trần thuật ngôi thứ ba bám sát tâm trạng ngán ngẩm, bất đắc dĩ của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn đủ 3 câu: sự hiếm hoi của việc một tư lệnh quân đoàn triệu một sĩ quan chỉ mang hàm thiếu tá -> phỏng đoán `có lẽ` vị tư lệnh chẳng vui vẻ gì với sự hiếm hoi ấy -> mệnh đề nhượng bộ (`Dù là chuyện ngoại lệ`) dẫn tới khả năng đáng ngại rằng một ngày nào đó ông có thể lại phải triệu con quái vật này đến."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000271
    terms: []
    pronouns_and_address: "Trần thuật quy chiếu vị tư lệnh quân đoàn bằng `ông`."
    pov_and_voice: "Giọng trần thuật hài hước khô khan."
    modality_and_logic: "Bảo toàn giả định truyền đạt và giới hạn mức độ (`Dù có bảo ông rằng đó mới chỉ là một khả năng, ông cũng chẳng thấy khá hơn`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000272
    terms:
      - "Thiếu tá von Degurechaff"
    pronouns_and_address: "Tư lệnh quân đoàn gọi trực tiếp cấp dưới bằng cấp bậc và họ `Thiếu tá von Degurechaff`."
    pov_and_voice: "Giọng bề trên trang trọng khi mở lời giao nhiệm vụ."
    modality_and_logic: "Bảo toàn câu mở lời của vị tư lệnh với Thiếu tá von Degurechaff."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000273
    terms: []
    pronouns_and_address: "Tanya đáp lễ cấp trên bằng `“Thưa ngài.”`"
    pov_and_voice: "Giọng đáp điều lệnh ngắn gọn, chuẩn mực."
    modality_and_logic: "Bảo toàn lời thưa ngắn gọn của cấp dưới."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000274
    terms:
      - "con quái vật"
      - "tư lệnh quân đoàn"
      - "pháp sư"
    pronouns_and_address: "Tuân thủ `DEC-P01-001` và `chapter6_b09_coordinator_choices`: trần thuật quy chiếu vị tư lệnh quân đoàn bằng `ông` và quy chiếu Tanya bằng `nó`."
    pov_and_voice: "Giọng trần thuật từ điểm nhìn của vị tư lệnh quân đoàn—một quân nhân bình thường cảm thấy xa lạ trước các pháp sư."
    modality_and_logic: "Bảo toàn nỗ lực tránh nhìn thẳng vào con quái vật đang đứng nghiêm trước mặt, sự chấp nhận tiếp chuyện vì công việc, và mức độ đánh giá mạnh rằng dưới góc nhìn người bình thường thì pháp sư quả thực rất xa lạ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000275
    terms:
      - "ma pháp"
      - "lý trí"
    pronouns_and_address: "Quy chiếu các pháp sư nói chung bằng `Họ`, và vị tư lệnh quân đoàn bằng `ông`."
    pov_and_voice: "Giọng phân tích tâm lý của một người bình thường khi đối diện trực tiếp với năng lực siêu nhiên của pháp sư."
    modality_and_logic: "Bảo toàn định nghĩa về pháp sư (những con người có thể tự bay và dùng ma pháp can thiệp vào thế giới) và sự lệch pha giữa nhận thức lý trí với cảm xúc khi giáp mặt ngoài đời."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000276
    terms:
      - "thiếu tá"
    pronouns_and_address: "Trần thuật quy chiếu vị tư lệnh bằng `ông`, quy chiếu Tanya bằng `vị thiếu tá trước mặt` và đại từ `nó` (`DEC-P01-001`), và chuyển đại từ ngôi thứ hai phiếm chỉ sang `người ta` (`direct-address choice`)."
    pov_and_voice: "Giọng trần thuật sắc lạnh, khắc họa sự rợn ngợp của vị tư lệnh trước ánh mắt phi nhân tính đối lập với gương mặt xinh xắn của Tanya."
    modality_and_logic: "Bảo toàn đủ 3 câu: khẳng định chắc chắn rằng không thể dùng lý trí hay cảm xúc của bất kỳ ai để hiểu nguyên tắc hành động của vị thiếu tá trước mặt -> đôi mắt lạnh như vật vô tri khiến người ta buộc phải kết luận suy nghĩ, khuôn khổ tư duy và cách tồn tại của nó đều méo mó -> sự đối lập giữa đôi mắt xanh, gương mặt xinh xắn có lẽ tạo ấn tượng dịu dàng với cảm xúc trong đôi mắt ấy nói lên tất cả và khiến nó trông khác hẳn."
    emphasis: "Bảo toàn chính xác hai từ nhấn mạnh theo `DEC-P01-002` tương ứng hai thẻ `<html:em>` trong nguồn: `*hay*` và `*bất kỳ ai*`, không nhấn mạnh lan sang phần khác."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000277
    terms:
      - "nhiệm vụ đặc biệt"
      - "bộ chỉ huy khu vực"
    pronouns_and_address: "Trong lời thoại trực tiếp, tư lệnh quân đoàn gọi Tanya là `Cô`."
    pov_and_voice: "Giọng thông báo mệnh lệnh công vụ ngắn gọn."
    modality_and_logic: "Bảo toàn thông báo nhận nhiệm vụ đặc biệt từ bộ chỉ huy khu vực."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000278
    terms:
      - "sĩ quan"
    pronouns_and_address: "Trần thuật quy chiếu Tanya bằng `Nó` theo `DEC-P01-001`."
    pov_and_voice: "Giọng trần thuật nêu lại chi tiết lý lịch gây sốc của Tanya."
    modality_and_logic: "Bảo toàn mốc thời gian và tư cách được phong hàm sĩ quan trước cả khi lên mười."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000279
    terms:
      - "lính trẻ em"
      - "cỗ máy chiến đấu"
      - "Tanya"
      - "Huy hiệu Đột kích Cánh bạc"
      - "nàng tiên"
      - "ma cà rồng"
    pronouns_and_address: "Trần thuật quy chiếu vị tư lệnh bằng `ông` (kèm phản thân `mình`) và quy chiếu Tanya bằng `nó` / tên riêng `Tanya`."
    pov_and_voice: "Giọng trần thuật tái hiện sự chuyển biến nhận thức của vị tư lệnh từ lúc nghe đồn đến khi tận mắt gặp Tanya."
    modality_and_logic: "Bảo toàn đủ 5 câu: phản ứng bật cười ban đầu khi nghe tin -> ấn tượng đầu tiên khi gặp trực tiếp là một cỗ máy chiến đấu -> lập tức sửa lại cách nhìn ấy nhưng không hề nghĩ mình đã hiểu nó -> xác nhận lời đồn đi trước Tanya về người nhận Huy hiệu Đột kích Cánh bạc trông như nàng tiên sinh ra để chiến đấu hẳn đúng từng chữ -> suy đoán có lẽ vì đường nét cân đối mà Tanya giống kiểu người có thể bị gọi sau lưng là ma cà rồng."
    emphasis: "Bảo toàn chính xác 3 vùng nhấn mạnh theo `DEC-P01-002` tương ứng 3 thẻ `<html:em>` trong nguồn: câu hỏi `*Vậy là một lính trẻ em như trong truyền thuyết à?*`, cụm ấn tượng `*một cỗ máy chiến đấu*`, và mệnh đề lời đồn chêm giữa cặp gạch ngang dài `*người nhận Huy hiệu Đột kích Cánh bạc trông như một nàng tiên, dù sinh ra để chiến đấu*`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000280
    terms: []
    pronouns_and_address: "Lời thoại thông báo thời gian ban lệnh không dùng đại từ."
    pov_and_voice: "Giọng truyền đạt mệnh lệnh quân sự chuẩn xác."
    modality_and_logic: "Bảo toàn thời điểm ban lệnh ở thể bị động tương lai (`“Mệnh lệnh sẽ được ban ra lúc 14 giờ 22.”`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000281
    terms:
      - "huấn luyện dã chiến"
      - "lính mới"
      - "tập kích ban đêm"
      - "chiến hào tiền đồn của địch"
      - "tỷ lệ tổn thất"
      - "quân nhân"
    pronouns_and_address: "Trần thuật quy chiếu Tanya bằng `nó` và đơn vị của Tanya bằng `Họ`."
    pov_and_voice: "Giọng trần thuật điểm lại thành tích huấn luyện thực chiến đáng kinh ngạc của Tanya trước khi chuyển sang lời nhận xét thầm của vị tư lệnh."
    modality_and_logic: "Bảo toàn đủ 4 câu: được lệnh tổ chức huấn luyện dã chiến đơn giản nhưng lại dẫn lính mới tập kích ban đêm vào chiến hào tiền đồn của địch -> tỷ lệ tổn thất của đơn vị lại thấp đến bất ngờ -> dù chiến đấu quyết liệt, gan dạ không nao núng và lập được chiến công, tỷ lệ tổn thất vẫn thấp hơn mọi đơn vị khác -> câu kết nhận định giả định rằng nếu chỉ xét điều đó thì quả là một quân nhân xuất sắc."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ câu cuối `*Nói thật, nếu chỉ xét điều đó thì nó đúng là một quân nhân xuất sắc.*` tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000282
    terms:
      - "Trung tá von Lergen"
      - "các chuyên gia pháp lý"
      - "Bộ Ngoại giao"
    pronouns_and_address: "Trong độc thoại nội tâm trực tiếp của vị tư lệnh quân đoàn, Tanya được quy chiếu bằng `Cô` / `cô`."
    pov_and_voice: "Giọng độc thoại nội tâm trầm ngâm, e ngại trước sự hoàn hảo không kẽ hở của Tanya và sự bất lực của các cơ quan từng muốn kìm hãm cô."
    modality_and_logic: "Bảo toàn đủ 5 câu cùng dấu chấm lửng cuối đoạn: nhận xét cô quá hoàn hảo -> không có gì để chê vì quá lý trí và đạt quá nhiều thành tựu -> hệ quả không ai ngăn nổi -> lý giải việc Trung tá von Lergen thất bại khi tìm cách loại bỏ cô là dễ hiểu -> phỏng đoán `có lẽ` việc các chuyên gia pháp lý để cô thoát và Bộ Ngoại giao bỏ cuộc còn là những yếu tố lớn hơn."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ đoạn văn tương ứng thẻ `<html:em>` trong nguồn."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000283
    terms:
      - "đơn vị pháp sư địch"
      - "thành phố Arene"
      - "lực lượng tiếp viện"
      - "dẹp yên thành phố"
    pronouns_and_address: "Câu mệnh lệnh quân sự trực tiếp lược chủ ngữ ngôi thứ hai."
    pov_and_voice: "Giọng giao nhiệm vụ tác chiến dứt khoát của tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn đúng trình tự hai bước nhiệm vụ và khẩu lệnh kết thúc: nhanh chóng tiêu diệt đơn vị pháp sư địch đã đột nhập vào thành phố Arene phía sau chiến tuyến -> sau đó hội quân với lực lượng tiếp viện và dẹp yên thành phố -> `Hết.`"
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000284
    terms:
      - "Các pháp sư Cộng hòa"
      - "thành phố Arene"
      - "hậu phương"
      - "các đơn vị cảnh giới của Đế quốc"
      - "những cuộc bạo loạn của du kích"
      - "dẹp yên"
      - "đường sắt"
      - "tuyến hậu cần"
    pronouns_and_address: "Trần thuật dùng đại từ gộp `ta` cho phía Đế quốc ở câu điều kiện."
    pov_and_voice: "Giọng trần thuật phân tích tình hình chiến lược khẩn cấp tại mắt xích giao thông Arene."
    modality_and_logic: "Bảo toàn đủ 4 câu: pháp sư Cộng hòa đổ bộ xuống thành phố Arene ở hậu phương, theo một nghĩa nào đó hoàn toàn qua mặt các đơn vị cảnh giới Đế quốc -> các cuộc bạo loạn của du kích đang lan rộng -> chuỗi hai điều kiện nhân quả liên hoàn: nếu không dẹp yên được Arene thì không thể sử dụng đường sắt, và nếu không dùng được đường sắt thì tuyến hậu cần sẽ bị cắt đứt."
    emphasis: "none"
