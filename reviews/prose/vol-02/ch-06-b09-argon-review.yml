    modality_and_logic: "Bảo toàn đủ 3 câu: nghĩa vụ chung của cả hai bên theo luật chiến tranh trong việc bảo vệ người không tham chiến -> kỳ vọng nỗ lực tối đa để thực hiện nghĩa vụ ấy -> nhận định tùy cách vận dụng mà phía mình có thể tận dụng quy định đó."
