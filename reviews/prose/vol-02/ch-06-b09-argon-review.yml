    modality_and_logic: "Bảo toàn đủ 4 câu: câu hỏi giả định về việc cho một toán nhỏ xâm nhập khu dân cư rồi bị tấn công -> điều kiện giả định chỉ cần một viên đạn lạc bắn về phía mình là đủ biến thành cái cớ -> lời tự nhận xét đó là cách làm cực đoan -> khẳng định vẫn có cách chính đáng hơn."
