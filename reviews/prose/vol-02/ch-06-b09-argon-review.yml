    pronouns_and_address: "Trong lời phát biểu trước lớp, Tanya dùng `cả hai ta` (hoặc `cả hai bên chúng ta`) và `chúng ta` / `ta` cho chủ thể các bên/phía mình, tự xưng `tôi` khi nêu quan điểm cá nhân (`nhưng tôi nghĩ`), và chuyển đại từ ngôi thứ hai phiếm chỉ sang cấu trúc danh động từ (`Còn tùy cách vận dụng`) theo `direct-address choice`."
