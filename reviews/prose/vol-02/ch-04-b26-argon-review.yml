  - id: vol02-ch04-b26-pronouns-pov-and-command-register
    source_term: "Tanya first-person narration (`Tôi` / `tôi`) and unit-collective first-person plural (`chúng ta` / `Chúng ta`), third-person narration referring to Tanya (`Tanya` / `Thiếu tá Pháp sư Tanya von Degurechaff` / `cô`), fierce command register (`ta` in p000448, `tôi` in p000461, `các người` in p000471), defending crew/marines and attacking mages combat calls (p000453, p000454, p000459, p000460, p000464), referee intervention (p000465, p000467, p000468), and generic second-person rendering (`người ta` in p000477)"
    proposed_vi: "Theo đúng phạm vi đã xác nhận tại `reviews/prose/vol-02/ch-04-b26-codex.md` và `reviews/prose/vol-02/ch-04-b26-fixes-signoff-codex.md`: trong các đoạn tự sự/nhận xét ngôi thứ nhất số ít của Tanya (p000447 câu 5, p000476 câu 2), giữ lựa chọn tạm `Tôi` / `tôi` (kế thừa mạch tự sự ngôi thứ nhất không in nghiêng từ `vol02-ch04-b22-tanya-first-person-narration`), và khi quy chiếu tập thể Tiểu đoàn 203 / nhóm sĩ quan tham gia diễn tập ở ngôi thứ nhất số nhiều (p000447, p000455, p000461, p000462, p000463, p000473, p000478) dùng nhất quán `chúng ta` / `Chúng ta`; trong các câu trần thuật ngôi thứ ba về Tanya (p000449, p000451, p000452, p000461, p000466, p000467, p000477), dùng tên riêng/quân hàm `Tanya` / `Thiếu tá Pháp sư Tanya von Degurechaff` và đại từ `cô` theo lựa chọn tạm đã được signoff của batch (ghi nhận phương án đồng bộ liên lô theo DEC-P01-001 là dùng `nó` hoặc lặp lại tên `Tanya` trong trần thuật và `mình` trong nội tâm tự quy chiếu ở `alternatives_vi`); trong khẩu lệnh chiến đấu trực tiếp, Tanya hô hào toàn quân bằng giọng uy quyền gay gắt xưng `ta` (`tiểu đoàn của ta`) và gọi đối phương là `chúng` tại p000448, xưng `tôi` khi phân công cụ thể cho các đại đội (`Theo tôi.`) tại p000461, và dùng giọng bề trên bỗ bã gọi đám lính bị xử tử trận là `mấy cái xác ngu ngốc` / `các người` tại p000471; trong lời thoại giữa trận, phía phòng thủ trên tàu dùng `Chúng ta` (p000453), phía tấn công gọi `Thiếu tá von Degurechaff` và quy chiếu địch bằng `Chúng` / `chúng` (p000454), các tổ báo cáo ngắn gọn `Đã thông đường.` – `Bên tôi cũng vậy.` (p000459–p000460), và trọng tài gọi `Thiếu tá von Degurechaff` (p000465); tại câu cuối p000477, dịch đại từ ngôi thứ hai phiếm chỉ thành `người ta` tự nhiên; toàn batch không có thẻ nhấn mạnh trong nguồn và không tự thêm `*...*` theo đúng DEC-P01-002"
    alternatives_vi:
      - "nó / Tanya và mình (thay cho `cô` trong trần thuật ngôi thứ ba tại p000449, p000452, p000466, p000467, p000477 và thay cho `Tôi` / `tôi` ở p000447, p000476 nếu điều phối viên quyết định đồng bộ toàn diện quy ước DEC-P01-001 xuyên suốt mọi batch của Chương 4 — hiện giữ nguyên theo signoff của b26 để không tạo thay đổi ngoài phạm vi các finding vừa đã khóa)"
