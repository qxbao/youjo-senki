    modality_and_logic: "Giữ quan hệ nhượng bộ ở cả câu 1 (`dù lo lắng về những thứ trên tàu đã bị hư hại, cuối cùng mọi người cũng có thể thở phào`) và câu 3 (`Nhiều thứ bị hỏng, nhưng không có tai nạn nào xảy ra`), không tự ý sửa đổi để làm mất sự đối chiếu với các ca thương tích nhẹ ở p000474–p000476."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000471
    pronouns_and_address:
      - "Gọi đám binh lính giả chết bằng `mấy cái xác ngu ngốc` và đại từ ngôi thứ hai số nhiều `các người`."
    pov_and_voice: "Lời gọi bỗ bã đánh thức những người đã bị xử loại khỏi vòng chiến."
    modality_and_logic: "Giữ sắc thái trêu chọc gay gắt và sự cho phép cử động trở lại."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000472
    terms:
      - "thủy thủ và lính thủy đánh bộ (sailors and marines)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật mô tả cảnh những người bị xử tử trận đứng dậy."
    modality_and_logic: "Giữ đầy đủ trạng thái của các thủy thủ và lính thủy đánh bộ: bị phán định là đã chết, được lệnh nằm im úp mặt xuống đất, rồi uể oải đứng dậy."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000473
    terms:
      - "đạn cao su dành cho diễn tập (exercise-grade rubber bullets)"
      - "công thức gây nổ công suất thấp (low-power explosion formulas)"
    pronouns_and_address:
      - "Dùng `chúng ta` cho phía sử dụng vũ khí diễn tập và `chúng` cho đạn cao su cùng công thức gây nổ công suất thấp."
    pov_and_voice: "Nhận xét thực tế ngôi thứ nhất số nhiều từ góc nhìn của Tanya."
    modality_and_logic: "Khóa sửa chữa B26-F03 (`công thức gây nổ công suất thấp` / `vol02-ch04-b26-explosive-formula`): giữ cấu trúc nhượng bộ khẳng định việc thực tế đã dùng đạn cao su diễn tập và công thức gây nổ công suất thấp (`Dù chúng ta đã dùng...`), đồng thời giữ hệ quả phủ định rằng trúng phải chúng vẫn chẳng dễ chịu gì."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000474
    terms:
      - "người bị thương (the injured)"
      - "bệnh xá (infirmary)"
      - "bác sĩ phẫu thuật (surgeon)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật nêu mức độ thương tích thực tế sau diễn tập."
    modality_and_logic: "Giữ sắc thái nhấn mạnh mức độ (`Thậm chí một số người bị thương còn phải đến bệnh xá để bác sĩ phẫu thuật điều trị`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000475
    terms:
      - "thủy thủ (sailors)"
      - "màn đấu súng (firefight)"
      - "Tiểu đoàn số 203 (203rd Battalion)"
      - "lính thủy đánh bộ (marines)"
      - "đạn lạc (stray bullets)"
    pronouns_and_address:
      - "Quy chiếu những thủy thủ không may bằng `Họ`."
    pov_and_voice: "Trần thuật dẫn ví dụ cụ thể về thương tích do đạn lạc."
    modality_and_logic: "Giữ tình huống các thủy thủ vô tình bị cuốn vào màn đấu súng giữa Tiểu đoàn 203 và lính thủy đánh bộ, cùng lời kể lại rằng dù đã cúi rạp xuống nhưng vẫn chịu thương tích vì liên tục trúng đạn lạc."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000476
    terms:
      - "cuộc hỗn chiến bên trong tàu (melee on the interior of the ship)"
      - "quân y và bác sĩ phẫu thuật (medics and surgeons)"
      - "bệnh xá (infirmary)"
    pronouns_and_address:
      - "Mệnh đề cuối câu 2 dùng đại từ ngôi thứ nhất số ít `tôi` (`nhưng tôi đoán...`)."
    pov_and_voice: "Trần thuật kết hợp phỏng đoán ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ hai cặp quan hệ nhượng bộ: dù vận rủi như vậy hiếm gặp nhưng vẫn có không ít người bị thương trong cuộc hỗn chiến bên trong tàu; và dù đội quân y cùng bác sĩ phẫu thuật đã túc trực sẵn sàng tiếp nhận nhanh chóng, người kể vẫn đoán bệnh xá sẽ còn đông đúc một thời gian."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000477
    terms:
      - "phòng sĩ quan (wardroom)"
      - "sĩ quan (officers)"
      - "lục quân (army)"
      - "hải quân (navy)"
      - "khẩu phần riêng (their own rations)"
      - "bánh quy (cookies)"
    names_and_ranks:
      - "Thiếu tá Pháp sư Tanya von Degurechaff (Magic Major Tanya von Degurechaff)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng danh xưng đầy đủ `Thiếu tá Pháp sư Tanya von Degurechaff` và đại từ `cô`; quy chiếu nhân sự hải quân bằng `họ`; dịch đại từ ngôi thứ hai khái quát ở cuối đoạn bằng `người ta`."
    pov_and_voice: "Trần thuật ngôi thứ ba chuyển cảnh sang phòng sĩ quan trên tàu kết hợp nhận xét mang điểm nhìn của Tanya."
    modality_and_logic: "Khóa sửa chữa B26-F04 (`bên lục quân` đối lập `hải quân` / `vol02-ch04-b26-army-navy-contrast`): giữ chi tiết phòng sĩ quan đã được dọn dẹp, không gian nhỏ nhưng thiết kế chu đáo tạo cảm giác thư thái, hiện chật kín sĩ quan, tách cà phê trên tay Tanya được truyền lời là ngon hơn cà phê bên lục quân phục vụ (`nghe nói`), mùi bánh nướng thoang thoảng và suy đoán chỉ ở hải quân nơi được phép mang khẩu phần riêng cùng bánh quy mới có được thú vui ấy."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000478
    terms:
      - "tụ tập uống trà (having a tea party)"
      - "Cuộc diễn tập (the exercise)"
      - "sự kiện chính (the main event)"
    pronouns_and_address:
      - "Dùng đại từ ngôi thứ nhất số nhiều `chúng ta` cho các sĩ quan có mặt trong phòng."
    pov_and_voice: "Lời dẫn ngôi thứ nhất số nhiều khép lại cảnh chiến đấu để mở sang buổi họp rút kinh nghiệm hậu diễn tập."
    modality_and_logic: "Giữ phủ định về mục đích tụ tập (`không tụ tập uống trà vô cớ`) và trình tự chuyển sang sự kiện chính sau khi cuộc diễn tập kết thúc."
    emphasis: "Không dùng `*...*`."
