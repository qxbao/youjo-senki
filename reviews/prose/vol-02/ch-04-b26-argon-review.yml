findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000451
    issue: "Tại p000451, cụm `với bộ mặt dữ tợn như quỷ sứ đang nhập vai` gán thêm sắc thái diễn kịch (`đang nhập vai`) cho nét mặt căng thẳng, quyết liệt khi bước vào giao chiến và khiến cấu trúc cụm danh từ hơi cồng kềnh."
    basis: "Ghi nhận từ mục minor B26-F05 đã hoãn trước đó; câu dịch vẫn giữ đúng hành động các thủy thủ bắt đầu rút lui trước các pháp sư và việc Tanya dẫn một toán nhỏ đi đường vòng mà không làm sai lệch diễn biến chiến thuật."
    recommendation: "Có thể giữ nguyên hoặc tinh chỉnh ở bước chuốt văn thành `Đúng lúc các thủy thủ bắt đầu rút lui trước những pháp sư mang vẻ mặt dữ tợn như quỷ sứ, Tanya dẫn một toán nhỏ đi đường vòng.`"
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000456
    issue: "Tại p000456, kết hợp từ `Phá vỡ bình tĩnh của chúng, làm rối loạn kỷ luật` hơi cứng trong tiếng Việt khi diễn đạt chuỗi ba bước tác động tâm lý và tổ chức lên đối phương."
    basis: "Ghi nhận từ mục minor B26-F06 đã hoãn trước đó; trình tự nhân quả ba bước từ làm mất bình tĩnh, phá vỡ kỷ luật đến nghiền nát đối phương vẫn hoàn toàn rõ ràng."
    recommendation: "Có thể giữ nguyên hoặc chuốt thành `Làm chúng mất bình tĩnh, phá vỡ kỷ luật của chúng, rồi nghiền nát chúng.` ở bước chuốt văn."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000462
    issue: "Tại p000462, cụm `được thực hiện rất nghiêm túc` nghiêng về thái độ chấp hành hơn là đánh giá mức độ chuẩn mực/chất lượng triển khai (`with high standards`)."
    basis: "Ghi nhận từ mục minor B26-F07 đã hoãn trước đó; câu dịch vẫn bảo toàn đầy đủ kế hoạch quét rộng từ các vị trí đã chiếm, việc vòng tránh các ổ kháng cự để giữ tốc độ và sự phân chia gánh nặng trong toàn tiểu đoàn."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước chuốt văn thành `...và quyết định chia sẻ gánh nặng trong toàn tiểu đoàn được triển khai với chất lượng rất cao.` / `...được thực hiện theo tiêu chuẩn cao.`"
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000463
    issue: "Tại p000463, cụm mở đầu `Khi phía trên tàu nhận ra...` dễ gợi nghĩa vị trí tầng trên của con tàu hơn là phe phòng thủ của tàu (`the ship side`), và vế `phương thức kháng cự cũng chẳng có mấy` hơi khẩu ngữ."
    basis: "Ghi nhận từ mục minor B26-F08 đã hoãn trước đó; toàn bộ mạch sự kiện về sự sụp đổ kỷ luật bên trong tàu, việc lực lượng giả định địch hội quân với tiếp viện và việc phe phòng thủ phải thừa nhận thất bại trước trọng tài đều đã chuẩn xác."
    recommendation: "Có thể giữ nguyên hoặc chỉnh ở bước chuốt văn thành `Khi phe phòng thủ trên tàu nhận ra chúng ta đã chiếm được các khu vực trọng yếu, họ từ bỏ chống cự.` và `các biện pháp chống trả cũng rất hạn chế`."
    resolution: optional_polish

  - id: m5
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000475
    issue: "Tại p000475, cụm `cuối cùng vẫn bị thương tích tệ hơn` dễ gợi hàm ý so sánh với một thương tích có sẵn từ trước thay vì diễn đạt thành ngữ chỉ kết cục bầm dập, tả tơi (`came out of it worse for wear`)."
    basis: "Ghi nhận từ mục minor B26-F09 đã hoãn trước đó; câu dịch vẫn giữ đúng trường hợp các thủy thủ bị kẹt giữa màn đấu súng của Tiểu đoàn số 203 với lính thủy đánh bộ và bị đạn lạc bắn trúng liên tục dù đã cúi rạp xuống."
    recommendation: "Có thể giữ nguyên hoặc chỉnh ở bước chuốt văn thành `Họ nói rằng dù đã cúi rạp xuống, rốt cuộc vẫn bị thương tích vì liên tục trúng đạn lạc.`"
    resolution: optional_polish

