findings:
  - severity: "serious"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000719"
    category: "meaning_and_context"
    issue: "Cụm từ chỉ độ tuổi ở câu cuối (at such an age) bị dịch ngược nghĩa thành 'lại còn trẻ như vậy'. Theo mạch ngữ cảnh từ lô trước (p000682, p000707) đến p000730, người đề ra kế hoạch nghi binh và chiến tranh thông tin này là Tướng von Zettour thuộc Bộ Tổng tham mưu (một tướng lĩnh đã lớn tuổi), không phải một người trẻ tuổi."
    recommendation: "Sửa 'lại còn trẻ như vậy' thành 'đã ở độ tuổi như vậy' (hoặc 'ở độ tuổi như thế')."
  - severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000725"
    category: "pronouns_and_register"
    issue: "Trong lời thoại của Tanya nói với Thiếu tá Uger ở p000725, đại từ ngôi thứ hai đang dùng là 'anh' ('Ý anh là...'), đồng thời ở p000712 lại thêm tiểu từ kính ngữ 'ạ' ('Diễn kịch ạ?'). Cách xưng hô này lệch với quy ước đồng cấp 'tôi' - 'ông' (không dùng 'ạ') đã xác lập giữa hai thiếu tá cùng khóa trường đại học quân sự trong ch-06-b22 (p000675, p000684, p000697)."
    recommendation: "Đổi 'Ý anh là' ở p000725 thành 'Ý ông là', đồng thời bỏ 'ạ' ở p000712 (đổi thành '“Diễn kịch sao?”' hoặc '“Một màn kịch sao?”')."
  - severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000730"
    category: "pronouns_and_context"
    issue: "Đại từ ngôi thứ ba số ít chỉ người nghĩ ra kế hoạch (he) đang được dịch là 'anh ta'. Đối tượng được nhắc đến là Tướng von Zettour, nên việc Tanya gọi một vị tướng thượng cấp là 'anh ta' trong lời thoại với Thiếu tá Uger làm sai lệch tương quan cấp bậc, độ tuổi và thái độ tán thưởng của Tanya."
    recommendation: "Đổi 'anh ta' thành 'ông ấy' hoặc 'ngài ấy' ('“Ý tưởng tuyệt vời thật. Tôi ngạc nhiên là ông ấy nghĩ ra được.”')."
  - severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000745"
    category: "pronouns_and_viewpoint"
    issue: "Trong lời thoại đáp lại Thiếu tá Uger ngay sau khi ông cho biết Tiểu đoàn Pháp sư Trên không số 203 của cô sẽ làm đội hậu vệ (p000744), Tanya lại dùng đại từ gộp 'chúng ta' ('…Họ đánh giá chúng ta cao quá rồi.'). Vì Uger thuộc Cục Đường sắt chứ không thuộc Tiểu đoàn 203, lời thoại trực tiếp với Uger phải dùng đại từ ngôi thứ nhất số nhiều loại trừ ('chúng tôi')."
    recommendation: "Đổi 'chúng ta' thành 'chúng tôi' ('“…Họ đánh giá chúng tôi cao quá rồi.”')."
  - severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000741"
    category: "pending_term_consistency"
    issue: "Cụm từ chỉ cấp bậc/vai trò 'field major' đang được dịch là 'thiếu tá dã chiến', chưa khớp với phương án tạm 'thiếu tá tác chiến' trong work/run-state/pending-terms-index.yml của vol-02."
    recommendation: "Đổi 'thiếu tá dã chiến' thành 'thiếu tá tác chiến'."
  - severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000744"
    category: "pending_term_consistency"
    issue: "Tên đơn vị '203rd Aerial Mage Battalion' đang được dịch là 'Tiểu đoàn Pháp sư trên không 203', chưa đồng bộ với phương án tạm 'Tiểu đoàn Pháp sư Trên không số 203' trong work/run-state/pending-terms-index.yml của vol-02."
    recommendation: "Đổi thành 'Tiểu đoàn Pháp sư Trên không số 203'."
