locked_choices:
- segment_id: YS-LN02/Text/part0034.xhtml/p000001
  locks:
  - "Giữ nguyên câu mô tả thời tiết ngắn gọn “Đó là một ngày lạnh giá và nhiều mây.”, không thêm dấu nhấn mạnh."
- segment_id: YS-LN02/Text/part0034.xhtml/p000002
  locks:
  - "Giữ chức danh “Thiếu úy Pháp sư Tanya Degurechaff”, đại từ trần thuật “Nó” theo DEC-P01-001, cấp so sánh “cô độc hơn bao giờ hết”, mốc thời gian “suốt bảy mươi hai giờ đồng hồ” và phủ định “mà vẫn chưa thấy hồi kết”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000003
  locks:
  - "Giữ địa danh “thủ đô Đế quốc, Berun”, định danh “Lục quân Đế quốc”, đại từ “nó” theo DEC-P01-001 và phủ định “trơ trọi một mình và không một ai giúp sức”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000004
  locks:
  - "Giữ phủ định “chưa bao giờ học được cách nương tay”, đại từ “nó” theo DEC-P01-001, mức độ “gần như bão hòa ngay lập tức” và hệ quả phủ định “đến mức nó không sao xoay xở nổi”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000005
  locks:
  - "Giữ tình thái “Lẽ ra nó phải là”, đại từ “nó” theo DEC-P01-001, các thuật ngữ “sĩ quan hiện trường”, “Norden”, “Huy hiệu Đột kích Cánh bạc”, quan hệ nhượng bộ “dù vẫn còn sống”, biệt danh trong ngoặc kép “Bạch Ngân”, danh xưng “Thiếu úy Degurechaff” và vế so sánh phủ định “như thể mới nhận quân hàm và chẳng biết chiến đấu là gì”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000006
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở câu đầu `*Quả đúng là nỗi nhục bị giày xéo sau một trận chiến đơn độc khi mọi sự kháng cự đều tỏ ra vô ích.*` theo DEC-P01-002, đại từ “nó” theo DEC-P01-001 và hình ảnh so sánh tâm trí bị nghiền nát thành hư không ở câu thứ hai."
- segment_id: YS-LN02/Text/part0034.xhtml/p000007
  locks:
  - "Giữ quan hệ nhượng bộ “Nhưng ngay cả thế”, đại từ “nó” theo DEC-P01-001 và phủ định “cũng không thể bỏ chạy”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000008
  locks:
  - "Giữ cấu trúc liệt kê ba tầng tăng tiến bằng dấu chấm phẩy (“với tư cách một người lính Đế quốc; với tư cách một người lính nói chung; và xét cho cùng là với tư cách một con người văn minh hiện đại có nghĩa vụ hợp đồng”), mệnh đề nhượng bộ về các biện pháp sơ tán khẩn cấp và hệ quả “đào tẩu trước quân địch đồng nghĩa với việc bị xử bắn”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000009
  locks:
  - "Giữ cấu trúc đối lập cô đọng “Tiếp tục là địa ngục, nhưng bỏ chạy là diệt vong.”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000010
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở cụm mở đầu `*Nếu đã vậy…*` kèm dấu ba chấm theo DEC-P01-002, chủ thể “Tanya”, đại từ phản thân “mình” và ý khơi lại quyết tâm kháng cự đến tận cùng."
- segment_id: YS-LN02/Text/part0034.xhtml/p000011
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Ở Norden khi phải đối mặt với cả một đại đội, chẳng phải mình đã chuẩn bị tinh thần đón nhận cái chết rồi sao?*` theo DEC-P01-002, đại từ nội tâm “mình” theo DEC-P01-001, địa danh “Norden”, cấp đơn vị “đại đội” và câu hỏi tu từ phủ định."
- segment_id: YS-LN02/Text/part0034.xhtml/p000012
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Chẳng phải gã nhà khoa học điên đó đã ép mình phải tham gia đủ thứ thí nghiệm nguy hiểm hay sao?*` theo DEC-P01-002, đại từ nội tâm “mình” theo DEC-P01-001, cụm “gã nhà khoa học điên” và câu hỏi tu từ phủ định."
- segment_id: YS-LN02/Text/part0034.xhtml/p000013
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Thế nhưng mình vẫn ở đây, vẫn còn sống. Phải, vẫn còn sống. Mình đã không gục ngã.*` theo DEC-P01-002, đại từ nội tâm “mình” / “Mình” theo DEC-P01-001 và câu khẳng định phủ định “Mình đã không gục ngã.”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000014
  locks:
  - "Giữ nhịp hai cụm danh ngữ ngắn (“Tinh thần bất khuất. Ý chí tự do và lòng tận tụy đến mức cố chấp dành cho phẩm giá của mình.”) và đại từ phản thân “mình”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000015
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, phần chêm trong cặp dấu gạch ngang dài `—Thiếu úy Pháp sư Tanya Degurechaff—` và cụm “quyết tâm sắt đá” liên kết trực tiếp với p000019."
- segment_id: YS-LN02/Text/part0034.xhtml/p000016
  locks:
  - "Giữ dấu ngoặc kép hội thoại, tên gọi “Tanya”, cách gọi thân mật “bé cưng ơi” và đại từ “em” trong câu hỏi của nhóm nữ quân nhân."
- segment_id: YS-LN02/Text/part0034.xhtml/p000017
  locks:
  - "Giữ câu cảm thán ngắn độc lập “Đáng buồn thay.”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000018
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ gộp “chúng ta” - “em” và chi tiết “cuối cùng chúng ta cũng sẽ trang điểm cho em nhé!”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000019
  locks:
  - "Giữ cụm danh ngữ độc lập “Quyết tâm sắt đá của nó.” với đại từ “nó” theo DEC-P01-001."
- segment_id: YS-LN02/Text/part0034.xhtml/p000020
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cặp đại từ “Bọn chị - em”, câu hỏi tu từ “tội gì không làm tới chứ nhỉ?” và lời rủ mặc thử bộ đồ dễ thương."
- segment_id: YS-LN02/Text/part0034.xhtml/p000021
  locks:
  - "Giữ cụm danh ngữ độc lập “Lời thề kháng cự của nó.” với đại từ “nó” theo DEC-P01-001."
- segment_id: YS-LN02/Text/part0034.xhtml/p000022
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu đề nghị ngắn gọn “Thay sang bộ này đi nhé?”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000023
  locks:
  - "Giữ cụm danh ngữ độc lập “Lòng tự trọng của nó.” với đại từ “nó” theo DEC-P01-001."
- segment_id: YS-LN02/Text/part0034.xhtml/p000024
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cặp đại từ “chị - Em”, từ “áo corset mới”, nguyên nhân “Em bảo cái trước khó cử động quá”, cấp so sánh bậc nhất “loại mềm dẻo nhất” và nhịp giục giã “Lại đây, lại đây nào.”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000025
  locks:
  - "Giữ câu tổng kết bị động “Hôm nay, trong hoàn cảnh này, tất cả những thứ đó sẽ đều bị nghiền nát dưới gót giày.” khép lại chuỗi danh ngữ p000019, p000021, p000023."
- segment_id: YS-LN02/Text/part0034.xhtml/p000026
  locks:
  - "Giữ dấu ba chấm mở đầu `…`, đại từ “nó” theo DEC-P01-001 và mốc thời gian hồi tưởng “vào ba ngày trước”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000027
  locks:
  - "Giữ tình thái “lẽ ra là”, đại từ “nó” theo DEC-P01-001, thuật ngữ “Huy hiệu Đột kích Cánh bạc”, từ “nhỏ nhặt” trong ngoặc kép ở câu thứ hai, cấu trúc “của giới thượng tầng, không chỉ trong quân đội mà ở bất kỳ tổ chức nào” và câu nhận định “Phải trừ hao đi nhiều phần mới được.”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000028
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001 và “ông ta” (nhà khoa học điên), hai vế phủ định song hành ngăn cách bằng dấu chấm phẩy (“sẽ không phải làm chuột bạch cho một gã nhà khoa học điên rồi bị phát minh của ông ta thổi tung; nó sẽ không phải thực hiện tác chiến trì hoãn trong tình thế cô lập ngoài tiền tuyến;”) và vế đối lập “lần này lẽ ra chỉ đơn giản là góp đôi ba lời về vài chủ đề cho một tác phẩm tuyên truyền nhỏ”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000029
  locks:
  - "Giữ phủ định “chẳng có gì có vẻ rắc rối cả”, đại từ “nó” theo DEC-P01-001, các thuật ngữ “lễ phục kiểu I”, “Ban Văn hóa và Tuyên truyền” và bước ngoặt “mọi thứ bắt đầu chệch hướng hoàn toàn”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000030
  locks:
  - "Giữ đại từ “nó” / “mình” theo DEC-P01-001, các thuật ngữ “mũ kê-pi”, “Huy hiệu Đột kích Cánh bạc”, “Norden”, “pháp sư”, “trung sĩ”, chi tiết trị liệu ma thuật tiên tiến, động tác chào kiểu mẫu và giả định quá khứ phủ định “ngay cả viên trung sĩ của nó ở học viện cũng chẳng thể bắt bẻ vào đâu được”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000031
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở câu trích dẫn đầu đoạn `*“Hãy ghi nhớ rằng với tư cách một sĩ quan pháp sư, cô là thành viên kiểu mẫu của Đế quốc.”*` theo DEC-P01-002, đại từ “cô” trong lời dặn hành chính, các thuật ngữ “sĩ quan pháp sư”, “Đế quốc”, đại từ trần thuật “Nó” / “mình” / “nó” theo DEC-P01-001 và phép so sánh với các bậc anh hùng thuở trước."
- segment_id: YS-LN02/Text/part0034.xhtml/p000032
  locks:
  - "Giữ quan hệ nhân quả giữa ấn tượng đầu tiên in đậm trong tâm trí người ta với việc “nó đã đặc biệt chú trọng đến ngoại hình của mình” và đại từ “nó” / “mình” theo DEC-P01-001."
- segment_id: YS-LN02/Text/part0034.xhtml/p000033
  locks:
  - "Giữ nhịp ngắt câu ngắn “Ấy thế mà.”, đại từ “Nó” / “mình” theo DEC-P01-001 và ý buộc phải nhận ra mình đã phạm một sai lầm khổng lồ."
- segment_id: YS-LN02/Text/part0034.xhtml/p000034
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001 và chi tiết những tiếng thở dài vang lên ngay khoảnh khắc nó bước vào phòng."
- segment_id: YS-LN02/Text/part0034.xhtml/p000035
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, danh từ “những nữ quân nhân”, mức độ thất vọng tương tự và hệ quả phủ định “cằn nhằn với nó dữ dội đến mức nó chẳng hiểu họ đang nói cái quái gì”."
- segment_id: YS-LN02/Text/part0034.xhtml/p000036
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, các thuật ngữ “quần cưỡi ngựa”, “mũ kê-pi”, chi tiết đôi ủng đánh bóng nửa ngày bị quẳng đi và quan hệ nhượng bộ “dù vừa vặn giữ lại được đồ lót trên người, nó đã đánh mất chiếc mũ kê-pi”."
