findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000388
    category: pronoun_and_style_nuance
    issue: >-
      Trong các đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (`p000388`, `p000394`, `p000397`), bản dịch đã tuân thủ đúng giới hạn của `DEC-P01-001` khi tuyệt đối không dùng đại từ `cô` cho Tanya, nhưng lặp lại tên riêng `Tanya` dày trong cùng một câu hoặc các câu liền kề (như câu 3 của `p000388`: `Tanya chỉ vừa mới kinh hoàng nhận ra rằng, trong sự bất thường của chiến tranh, Tanya đã trở nên phi lý và lười biếng.`) thay vì luân phiên với đại từ trần thuật `nó` theo `DEC-P01-001` (như ở `ch-05-b14` và `ch-05-b15`) hoặc lược chủ ngữ ở mệnh đề phụ đồng chủ ngữ.
    basis: >-
      Cách lặp tên riêng `Tanya` là lựa chọn an toàn để tránh dùng `cô` và hoàn toàn không làm sai lệch điểm nhìn hay nghĩa của đoạn.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể lược bớt chủ ngữ lặp ở mệnh đề phụ hoặc luân phiên với đại từ trần thuật `nó` theo `DEC-P01-001` để nhịp câu thanh thoát hơn (ví dụ tại câu 3 `p000388`: `Tanya chỉ vừa mới kinh hoàng nhận ra rằng, trong sự bất thường của chiến tranh, mình/nó đã sa vào sự phi lý và lười biếng.`).
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000395
    category: modality_and_lexical_nuance
    issue: >-
      Tại câu 3 của `p000395`, tình thái từ diễn tả sự phỏng đoán/kỳ vọng hợp lý dựa trên tiêu chuẩn quân nhu đang được dịch nghiêng sang sắc thái bắt buộc (`Ít ra thì lượng ca-lo vẫn phải đạt định mức.`).
    basis: >-
      Đặt trong mạch độc thoại nội tâm suy đoán về việc ưu tiên vận chuyển đồ hộp ở câu 1–2, ý đánh giá vớt vát của Tanya về mặt dinh dưỡng vẫn rõ ràng.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh nhẹ thành `Ít ra thì lượng ca-lo chắc vẫn sẽ đạt định mức.` (hoặc `hẳn vẫn đạt đúng quy định`) để sát sắc thái phỏng đoán của nội tâm.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000397
    category: lexical_nuance
    issue: >-
      Tại câu 2 của `p000397`, cách nói ẩn dụ mang màu sắc nhà binh chỉ việc Tanya thôi không phàn nàn về chuyện khoai tây cũ nữa đang được dịch thoát ý thành `đành gác chuyện ăn uống sang một bên`.
    basis: >-
      Nghĩa thực tế trong văn cảnh (chấp nhận nhượng bộ chuyện khẩu phần để tiếp tục cuộc họp tác chiến) được truyền tải tự nhiên, trôi chảy.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc giữ nhẹ hình ảnh ẩn dụ quân sự (`đành hạ vũ khí trong chuyện ăn uống rồi tiếp tục cuộc họp`) để làm nổi bật nét hóm hỉnh trong giọng kể.
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000401
    category: pronoun_and_lexical_nuance
    issue: >-
      Ở câu 2 của `p000401`, tân ngữ chỉ quân địch trong độc thoại tính toán chiến thuật của Tanya đang dùng đại từ `họ` (`Nếu giáng chừng ấy hỏa lực xuống họ dưới màn đêm...`), và ở câu 4, động từ chỉ việc cả khu vực bị bắn phá dồn dập sau khi địch rút lui đang dịch là `oanh kích bừa bãi` (dễ gợi liên tưởng hẹp tới không kích hơn là pháo kích/bắn phá mặt đất tại chiến hào Rhine).
    basis: >-
      Mạch lập luận chiến thuật về nguy cơ lộ vị trí khi dùng thuật thức gây nhiễu trong đêm vẫn hoàn toàn chính xác.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh thành `Nếu giáng chừng ấy hỏa lực xuống quân địch (hoặc: xuống chúng) dưới màn đêm...` và `cả khu vực bị bắn phá (hoặc: pháo kích) bừa bãi`.
    resolution: optional_polish

