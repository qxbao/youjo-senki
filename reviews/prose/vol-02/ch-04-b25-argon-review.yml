      - "Quy chiếu các hạ sĩ quan trên tàu bằng `họ`; câu 3 lược chủ ngữ ngôi thứ hai khái quát (`Một khi để pháp sư áp sát đến mức này thì không thể tránh khỏi giao chiến trên boong`)."
    pov_and_voice: "Nhận định đánh giá chiến thuật mang sắc thái khắt khe từ điểm nhìn của Tanya."
    modality_and_logic: "Giữ sự đối lập giữa động thái bắt đầu xử lý với tốc độ `chậm chạp đến vô vọng`, tính tất yếu không thể tránh giao chiến trên boong khi đã để pháp sư áp sát, và cấu trúc nhượng bộ ở câu kết (`Có thể họ không ngờ chuyện này xảy ra, nhưng thế này vẫn quá tệ hại`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000416
    terms:
      - "bẫy (trap)"
      - "thời tàu buồm (age of sailing ships)"
      - "tiểu thuyết hàng hải (nautical novels)"
      - "trên boong (on the deck)"
      - "mánh lừa (trick)"
    pronouns_and_address:
      - "Mệnh đề dẫn trần thuật ngôi thứ ba dùng `nó` (`Bên trong, nó tự hỏi:`); câu suy nghĩ ngôi thứ nhất dùng `Mình` / `mình` theo đúng DEC-P01-001 (B25-F01)."
    pov_and_voice: "Trần thuật ngôi thứ ba dẫn vào độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ nguyên độ mở của hai câu hỏi nghi vấn liên tiếp và mức độ chắc chắn vừa phải trong hồi tưởng đọc sách (`Mình khá chắc mình từng đọc tiểu thuyết hàng hải kể rằng cảnh hỗn loạn trên boong hóa ra lại là một mánh lừa`)."
    emphasis: "Khóa chính xác phạm vi nhấn mạnh `*Đây là bẫy sao?*` khớp với thẻ `<em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000417
    terms:
      - "đối thủ (opponents)"
      - "Boong tàu (The deck)"
      - "thủy thủ (sailors)"
    pronouns_and_address:
      - "Độc thoại nội tâm của Tanya dùng `mình` ở câu 2 (theo DEC-P01-001 / B25-F01) và lược chủ ngữ tự nhiên ở đầu câu 1; quy chiếu thủy thủ đối phương bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm quan sát và suy luận thực tế của Tanya."
    modality_and_logic: "Giữ nhận định về sự thiếu kinh nghiệm của đối phương, chi tiết quan sát thấy thủy thủ vấp ngã và câu điều kiện giả định trái thực tế ở cuối đoạn (`Nếu đó là diễn kịch thì hẳn họ đã phải tập luyện rất lâu mới ngã tự nhiên đến thế`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000418
    terms:
      - "kiếm ma thuật (Magic blades)"
      - "Đại đội (Company)"
    pronouns_and_address:
      - "Trong khẩu lệnh trực tiếp, Tanya gọi `Đại đội` và tự xưng `tôi` (`theo tôi!`)."
    pov_and_voice: "Khẩu lệnh xung phong dứt khoát của Tanya."
    modality_and_logic: "Giữ hai mệnh lệnh liên tiếp: giương kiếm ma thuật và bám theo chỉ huy."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000419
    terms:
      - "xung phong (the charge)"
      - "công thức gây nhiễu (interference formula)"
      - "thủy thủ (sailors)"
    names_and_ranks:
      - "Tanya"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng tên riêng `Tanya` ở câu 1 và đại từ `Nó` ở câu 2 theo đúng DEC-P01-001 (B25-F01)."
    pov_and_voice: "Trần thuật ngôi thứ ba mô tả pha bổ nhào tấn công của Tanya."
    modality_and_logic: "Giữ thế bắt buộc duy trì tốc độ khi dẫn đầu xung phong (`buộc phải giữ tốc độ thật chuẩn rồi bổ nhào xuống`) và hành động tăng tiến ở câu 2 (`Nó còn tung một công thức gây nhiễu ngay vào đám thủy thủ đang hoảng loạn tụ lại`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000420
    terms:
      - "thủy thủ (sailors)"
      - "đơn vị lính thủy đánh bộ / lính thủy đánh bộ (marine unit / marines)"
      - "đại đội (company)"
      - "hỏa lực kiềm chế (checking fire)"
    pronouns_and_address:
      - "Định ngữ sở hữu ngôi thứ nhất số ít của Tanya ở câu 2 dùng `mình` (`đại đội mình`) theo DEC-P01-001 (B25-F01); ngôi thứ nhất số nhiều chỉ phía Tanya ở câu 3 dùng `chúng tôi`; quy chiếu phía lính thủy đánh bộ bằng `Họ`."
    pov_and_voice: "Trần thuật từ điểm nhìn của Tanya mô tả cục diện hỗn loạn trên boong."
    modality_and_logic: "Giữ chuỗi nhân quả: một số thủy thủ bị hất văng -> thủy thủ càng rối trí và đơn vị lính thủy đánh bộ bị cuốn vào -> phần còn lại của đại đội Tanya cản trở nỗ lực lập lại trật tự -> đối phương bỏ lỡ cơ hội chặn lại vì bận đấu hỏa lực kiềm chế."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000421
    pronouns_and_address: []
    pov_and_voice: "Khẩu lệnh thúc giục duy trì hỏa lực trong giao chiến."
    modality_and_logic: "Giữ mệnh lệnh phủ định và tiếp diễn (`Đừng chùn tay! Cứ bắn tiếp!`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000422
    terms:
      - "lưỡi lê (bayonets)"
    pronouns_and_address:
      - "Dùng `Tất cả` cho toàn bộ nhân lực trên boong (`All hands`)."
    pov_and_voice: "Khẩu lệnh chuẩn bị cận chiến của phía tàu."
    modality_and_logic: "Giữ nhịp lặp khẩn trương của mệnh lệnh lắp lưỡi lê."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000423
    terms:
      - "sĩ quan (officers)"
      - "thủy thủ (sailors)"
    pronouns_and_address:
      - "Quy chiếu nhóm sĩ quan và thủy thủ chống trả bằng `họ`."
    pov_and_voice: "Trần thuật mô tả sức kháng cự yếu ớt trên boong."
    modality_and_logic: "Giữ mức độ chật vật (`chỉ vừa đủ sức chống trả`) và sự bất lực trước sức ép tấn công (`nhưng họ không thể ngăn nổi đà tấn công`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000424
    terms:
      - "đại đội (company)"
      - "hàng phòng thủ (defense)"
      - "kiếm ma thuật (magic blades)"
      - "lớp chắn mảnh đạn mềm (soft shrapnel shielding)"
      - "đài chỉ huy thứ hai (second bridge)"
      - "khung bên trong (internal frames)"
    names_and_ranks:
      - "Tanya"
    pronouns_and_address:
      - "Câu 1–2 trần thuật ngôi thứ ba dùng `Tanya và đại đội` và đại từ số nhiều `họ` (từ `nó` cuối câu 2 quy chiếu `lớp chắn mảnh đạn mềm`); câu 3 chuyển sang ngôi thứ nhất số nhiều `Chúng tôi`."
    pov_and_voice: "Trần thuật ngôi thứ ba chuyển sang ngôi thứ nhất số nhiều của Tanya ngay trong cùng đoạn."
    modality_and_logic: "Giữ trình tự xuyên thủng phòng thủ -> đâm kiếm ma thuật vào lớp chắn mảnh đạn mềm của đài chỉ huy thứ hai để bám trụ -> khẳng định không hề giảm tốc kèm phỏng đoán hệ quả (`có lẽ một trong những khung bên trong đã bị móp`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000425
    pronouns_and_address:
      - "Dùng đại từ ngôi thứ nhất số nhiều `chúng tôi`."
    pov_and_voice: "Nhận xét ngắn từ góc nhìn của Tanya về cảnh tượng đổ bộ."
    modality_and_logic: "Giữ nhận định ước đoán về ấn tượng thị giác dữ dội khi cả đội lao tới."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000426
    pronouns_and_address: []
    pov_and_voice: "Khẩu lệnh thúc quân đổ bộ và đánh chiếm tàu."
    modality_and_logic: "Giữ mệnh lệnh hành động liên hoàn (`Đổ bộ, chiếm tàu! Tiến lên, tiến lên!`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000427
    terms:
      - "Tiểu đoàn 203 (203rd Battalion)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật mô tả khí thế của Tiểu đoàn 203 sau cú đáp."
    modality_and_logic: "Khóa sửa chữa B25-F06: bảo toàn sự kiện va chạm là đã xảy ra và đặt mức độ xấp xỉ vào hướng tiếp cận (`Dù đã đâm sầm vào đối phương gần như trực diện, các thành viên Tiểu đoàn 203 vẫn hừng hực khí thế`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000428
    terms:
      - "đầu cầu (bridgehead)"
    pronouns_and_address:
      - "Quy chiếu các thành viên Tiểu đoàn 203 bằng `Họ` / `họ`."
    pov_and_voice: "Trần thuật mô tả nhịp triển khai chiến thuật của Tiểu đoàn 203 trên tàu."
    modality_and_logic: "Giữ trình tự thiết lập đầu cầu -> đánh chiếm các khu vực trọng yếu -> quan hệ nhượng bộ giữa bất lợi quân số và khả năng phối hợp bọc lót (`Tuy quân số ít hơn, sự phối hợp của họ vẫn giúp mọi người yểm trợ lẫn nhau kín kẽ`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000429
    terms:
      - "bệ pháo phòng không (anti–air gun mounts)"
    pronouns_and_address: []
    pov_and_voice: "Khẩu lệnh chỉ huy tấn công trên boong tàu của phía Tiểu đoàn 203."
    modality_and_logic: "Giữ hai mục tiêu liên tiếp: phá hủy các bệ pháo phòng không và chiếm các vị trí tiếp theo."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000430
    terms:
      - "Pháo thủ (Gunners)"
    pronouns_and_address:
      - "Gọi `Pháo thủ` và quy chiếu đối phương đang áp sát bằng `chúng`."
    pov_and_voice: "Khẩu lệnh chống trả của phía thủy thủ đoàn trên tàu."
    modality_and_logic: "Giữ mệnh lệnh ngăn chặn đối phương tiếp cận."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000431
    terms:
      - "đài chỉ huy thứ hai (second bridge)"
      - "đội xung kích (assault team)"
      - "đơn vị lính thủy đánh bộ (marine unit)"
    pronouns_and_address:
      - "Trong lời thoại chỉ huy trên tàu: dùng `Chúng ta`."
    pov_and_voice: "Mệnh lệnh tổ chức phản kích của chỉ huy phía tàu."
    modality_and_logic: "Khóa sửa chữa B25-F07: giữ mục tiêu chiếm lại đài chỉ huy thứ hai và xác định đúng quan hệ tổ chức lấy đơn vị lính thủy đánh bộ làm hạt nhân (`Lập đội xung kích lấy đơn vị lính thủy đánh bộ làm nòng cốt`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000432
    terms:
      - "đội phản kích (counterattack team)"
      - "lính thủy đánh bộ (marines)"
    pronouns_and_address:
      - "Quy chiếu phía tàu bằng `họ`."
    pov_and_voice: "Trần thuật mô tả quá trình lập đội phản kích của phía tàu."
    modality_and_logic: "Giữ quan hệ nhượng bộ về thời gian (`Mất một lúc, nhưng cuối cùng họ cũng lập xong...`) và thành phần nòng cốt (`chủ yếu gồm lính thủy đánh bộ`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000433
    terms:
      - "tiểu đoàn (battalion)"
      - "cơ động (mobility)"
      - "lính thủy đánh bộ (marines)"
      - "pháp sư tác chiến trên biển (marine mages)"
    pronouns_and_address:
      - "Dùng đại từ ngôi thứ nhất số nhiều `chúng tôi` cho đơn vị của Tanya."
    pov_and_voice: "Phân tích chiến thuật từ điểm nhìn của Tanya."
    modality_and_logic: "Giữ quan hệ nhượng bộ – hạn chế (`Dù là một tiểu đoàn, thế mạnh của chúng tôi là cơ động, mà trong không gian kín bên trong tàu thì không thể phát huy hết sở trường ấy`) làm nguyên nhân giải thích việc `lính thủy đánh bộ` và `các pháp sư tác chiến trên biển` có thể chống trả quyết liệt bên trong. Khóa lựa chọn tạm `pháp sư tác chiến trên biển` (`vol02-ch04-b25-marine-mages`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000434
    terms:
      - "Lính thủy đánh bộ (Marines)"
    pronouns_and_address: []
    pov_and_voice: "Tiếng hô xung phong phản kích của phía lính thủy đánh bộ."
    modality_and_logic: "Giữ nhịp hô ngắn gọn (`Phản công đây! Lính thủy đánh bộ!`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000435
    pronouns_and_address:
      - "Quy chiếu đối phương đột nhập bằng `chúng`."
    pov_and_voice: "Lời hô hào bỗ bã của lính thủy đánh bộ khi phản kích."
    modality_and_logic: "Giữ hai câu mệnh lệnh liên tiếp (`Ném chúng xuống biển! Tống khứ chúng đi.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000436
    terms:
      - "Tiểu đoàn 203 (203rd Battalion)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật đối lập hiệu quả tiến công thực tế của Tiểu đoàn 203 với đợt phản kích."
    modality_and_logic: "Giữ liên từ đối lập `Nhưng` ở đầu câu và mức độ hiệu quả (`lần lượt chiếm hết vị trí này đến vị trí khác với hiệu quả đáng kinh ngạc`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000437
    terms:
      - "pháp sư (mages)"
      - "chiến đấu cơ động (mobile battles)"
      - "các động tác cơ động trên không (aerial maneuvers)"
      - "đánh giáp lá cà (close-quarters fighting)"
      - "bộ phận tiên phong (vanguard)"
      - "các thành viên ở phía sau (members in the rear)"
      - "huấn luyện (training)"
    pronouns_and_address: []
    pov_and_voice: "Nhận định tổng quát về đặc thù tác chiến và mục đích huấn luyện của pháp sư."
    modality_and_logic: "Khóa sửa chữa B25-F08: giữ đúng bình diện `chiến đấu cơ động và các động tác cơ động trên không`, phân biệt `Những người thuộc bộ phận tiên phong` với `các thành viên ở phía sau` trong đội hình mà không biến thành tiền tuyến – hậu phương, và giữ kết luận về mục đích của huấn luyện (`Nhưng huấn luyện là để khắc phục điểm yếu`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000438
    terms:
      - "lính thủy đánh bộ (marines)"
      - "đám lính đất liền (landlubbers)"
    pronouns_and_address:
      - "Dùng `lính thủy đánh bộ chúng ta` cho phe mình và `chúng` / `đám lính đất liền ấy` cho đối phương."
    pov_and_voice: "Lời khích lệ tinh thần tự tôn quân chủng của phía lính thủy đánh bộ."
    modality_and_logic: "Giữ hai câu mệnh lệnh khích lệ và miệt thị đối phương là lính đất liền."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000439
    pronouns_and_address:
      - "Người nói tự xưng `Tôi` và quy chiếu nhóm tiếp theo vừa đến bằng `họ`."
    pov_and_voice: "Báo cáo và điều động lực lượng tiếp ứng trong trận đánh."
    modality_and_logic: "Giữ thông báo nhóm tiếp theo đã tới và hành động tung vào ngay lập tức."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000440
    terms:
      - "Tiểu đoàn 203 (203rd Battalion)"
      - "lính thủy đánh bộ (marines)"
      - "đánh giáp lá cà (close-quarters combat)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật khái quát thế giằng co giữa hai lực lượng."
    modality_and_logic: "Giữ sự đối đầu không khoan nhượng giữa hai phong cách cận chiến và thế cân bằng động (`Lính thủy đánh bộ có vị trí nhỉnh hơn đôi chút, nhưng tình hình vẫn biến động khó lường`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000441
    terms:
      - "đại đội tiếp viện (follow-up company)"
    pronouns_and_address: []
    pov_and_voice: "Trần thuật bước ngoặt chiến thuật khi đại đội tiếp theo hạ cánh."
