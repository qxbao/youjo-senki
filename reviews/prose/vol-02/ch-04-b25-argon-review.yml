findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000413
    issue: "Tại p000413, cụm `bằng các động tác chiến đấu trực quan, có thể quan sát rõ` ghép tính từ `trực quan` trực tiếp vào động tác chiến đấu, dễ gợi nghĩa động tác được thực hiện để trình diễn hơn là cơ động chiến đấu dựa trên tầm nhìn mắt thường trong điều kiện quan sát rõ."
    basis: "Ghi nhận từ mục minor B25-F02 đã hoãn trước đó; câu dịch vẫn giữ đúng hành động đột kích tàu, điều kiện quan sát rõ và chi tiết triển khai màn khói ở câu kế tiếp mà không tự suy diễn thêm tên học thuyết chiến thuật."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn chỉnh thành `Chúng ta đang tiến hành đột kích một con tàu, thực hiện các động tác cơ động chiến đấu trong điều kiện quan sát rõ.` để câu văn tự nhiên và rõ quan hệ điều kiện hơn."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000417
    issue: "Tại p000417, cụm `có vẻ hơi thiếu kinh nghiệm` làm dịu nhẹ sắc thái chê bai mức độ non kinh nghiệm quá đáng của đối phương, đồng thời liên từ `vậy mà` ở câu 2 làm mờ quan hệ nhượng bộ (`Boong tàu có thể chật hẹp, vậy mà mình còn thấy...`)."
    basis: "Ghi nhận từ mục minor B25-F03 đã hoãn trước đó; đại từ nội tâm `mình` (B25-F01) và câu điều kiện giả định trái thực tế ở cuối đoạn (`Nếu đó là diễn kịch thì hẳn họ đã phải tập luyện rất lâu...`) đều đã chuẩn xác."
    recommendation: "Có thể giữ nguyên hoặc tinh chỉnh ở bước chuốt văn thành `...cũng có vẻ quá non kinh nghiệm. Boong tàu có thể chật hẹp thật, nhưng mình còn thấy vài thủy thủ vấp ngã.`"
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000420
    issue: "Tại p000420, cụm `vì còn bận đấu hỏa lực kiềm chế` hơi cứng về mặt kết hợp từ tiếng Việt khi diễn đạt việc hai bên trao đổi hỏa lực kiềm chế lẫn nhau."
    basis: "Ghi nhận từ mục minor B25-F04 đã hoãn trước đó; đại từ sở hữu nội tâm `đại đội mình` (B25-F01) và quan hệ nhân quả khiến lính thủy đánh bộ bỏ lỡ cơ hội chặn đà tiến công đều đã được bảo toàn."
    recommendation: "Có thể giữ nguyên hoặc chuốt thành `vì còn mải bắn kiềm chế qua lại` ở bước chuốt văn."
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0024.xhtml/p000425
    issue: "Tại p000425, quán ngữ `Chắc hẳn` ở đầu câu đẩy mức độ chắc chắn lên cao hơn sắc thái phỏng đoán trong nguồn, và `kinh khủng lắm` hơi làm phẳng chất khẩu ngữ của nhận xét giữa trận đánh."
    basis: "Ghi nhận từ mục minor B25-F05 đã hoãn trước đó; không làm sai lệch điểm nhìn hay mạch sự kiện sau cú đáp không giảm tốc ở p000424."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ thành `Cảnh chúng tôi ập tới có lẽ trông khiếp thật.` ở bước chuốt văn."
    resolution: optional_polish

