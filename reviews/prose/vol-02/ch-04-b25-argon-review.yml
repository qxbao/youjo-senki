    pronouns_and_address:
      - "Câu 1 độc thoại nội tâm in nghiêng dùng `Chúng ta`; câu 2 trần thuật ngôi thứ ba dùng `Thiếu tá von Degurechaff và các đại đội trưởng`; câu 3–6 quy chiếu phía lính thủy đánh bộ và thủy thủ trên tàu bằng `họ` / `Họ`."
    pov_and_voice: "Câu nội tâm khẳng định chiến thắng của Tanya chuyển sang trần thuật quan sát hai phía."
    modality_and_logic: "Giữ sự tương phản giữa nụ cười của Thiếu tá von Degurechaff cùng các đại đội trưởng với vẻ nhục nhã của lính thủy đánh bộ, tình trạng cạn dần nguồn lực chiến đấu, thế kẹt không thể rút thủy thủ khỏi các khẩu pháo và hệ quả do dự làm chậm hành động."
    emphasis: "Khóa chính xác phạm vi nhấn mạnh `*Chúng ta sẽ chiến thắng.*` khớp với thẻ `<em>` ở câu đầu (DEC-P01-002)."

