  - id: vol02-ch04-b25-pronouns-pov-shifts-and-emphasis
    source_term: "Tanya third-person narration (`Tanya` / `Thiếu tá von Degurechaff` / `nó`) vs. first-person interior self-reference (`mình`), collective unit first-person plural (`chúng ta` / `ta` / `chúng tôi`), intra-paragraph POV shifts (p000416, p000420, p000424), generic second-person omissions (p000415, p000444), combat command dialogue pronouns, and italicized emphases (p000416, p000442)"
    proposed_vi: "Trong các câu/mệnh đề trần thuật ngôi thứ ba về Tanya (p000413 câu 3, p000416 mệnh đề dẫn, p000419, p000424 câu 1, p000442 câu 2), dùng tên riêng `Tanya`, chức danh/quân hàm `Thiếu tá von Degurechaff` (p000442) và đại từ trần thuật `nó` / `Nó` (p000416, p000419) theo đúng DEC-P01-001 và sửa chữa B25-F01, tuyệt đối không dùng `cô` (lưu ý từ `nó` ở câu 2 p000424 quy chiếu danh từ bất động vật `lớp chắn mảnh đạn mềm`); trong độc thoại nội tâm ngôi thứ nhất số ít tự quy chiếu của Tanya (p000416 câu 4, p000417 câu 2, p000420 câu 2), dùng nhất quán đại từ `mình` (`Mình khá chắc mình từng đọc...`, `mình còn thấy...`, `đại đội mình`) theo đúng DEC-P01-001 và B25-F01; khi quy chiếu tập thể đơn vị của Tanya ở ngôi thứ nhất số nhiều trong trần thuật/nhận định điểm nhìn Tanya, dùng `Chúng ta` / `ta` ở mở đầu kịch bản (p000413) và câu nội tâm chiến thắng in nghiêng (`*Chúng ta sẽ chiến thắng.*` tại p000442), đồng thời dùng `chúng tôi` / `Chúng tôi` khi đối lập trực tiếp với lực lượng phòng thủ trên tàu (p000420 câu 3, p000424 câu 3, p000425, p000433); tại các câu điều kiện khái quát dùng đại từ ngôi thứ hai phiếm chỉ trong nguồn (p000415 câu 3, p000444), dùng cấu trúc vô nhân xưng/lược chủ ngữ tự nhiên trong tiếng Việt; trong các khẩu lệnh chiến đấu trực tiếp của Tanya và hai phe (p000414, p000418, p000421, p000422, p000426, p000429–p000431, p000434, p000435, p000438, p000439, p000443), Tanya xưng `tôi` với thuộc cấp (`Đại đội, theo tôi!` tại p000418), sĩ quan/lính thủy đánh bộ trên tàu xưng `Tôi` (p000439) hoặc `chúng ta` / `Chúng ta` (p000431, p000438, p000443), gọi đối phương là `chúng` (p000430, p000435, p000438, p000443) và gọi lực lượng chi viện phe mình là `họ` (p000439); bảo toàn chính xác hai phạm vi nhấn mạnh `*...*` theo DEC-P01-002 tại p000416 (`*Đây là bẫy sao?*`) và p000442 (`*Chúng ta sẽ chiến thắng.*`)"
    alternatives_vi:
      - "chúng ta (thay cho `chúng tôi` / `Chúng tôi` tại p000420, p000424, p000425, p000433 — ưu tiên giữ `chúng tôi` / `Chúng tôi` như bản dịch hiện tại vì đặt tập thể Tiểu đoàn 203/đại đội của Tanya ở thế đối lập rõ rệt với phe phòng thủ trên tàu, tránh lẫn với các khẩu lệnh dùng `chúng ta` của phía lính thủy đánh bộ ở p000431, p000438, p000443)"
