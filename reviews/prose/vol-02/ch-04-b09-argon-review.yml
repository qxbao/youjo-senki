    pov_and_logic:
      - Giữ đánh giá vị trí đội hình (Đại đội Hai và Ba ở tầng thấp có vị trí tốt; Đại đội Một và Bốn canh phòng phía trên nên còn dư địa độ cao) cùng toan tính cá nhân của Tanya (vì trực tiếp chỉ huy Đại đội Một nên muốn đẩy việc nguy hiểm sang Đại đội Bốn) dẫn đến quyết định điều chỉnh bố trí
