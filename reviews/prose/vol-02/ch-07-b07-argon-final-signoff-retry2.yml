    jsonl_verification: >-
      Đã kiểm tra trực tiếp dòng 11 trong `translations/vol-02/ch-07-b07.jsonl`: đã sửa
      thành `lực lượng địch có thể vẫn còn sung sức.`, khớp mạch nhân quả với việc phòng
      không phải dựa vào thiết bị quang học và các đoạn `p000164`–`p000166`.
