      `translations/vol-02/ch-07-b07.jsonl`: đã đổi lần lượt thành `một cuộc tiến công
      liều lĩnh của Đế quốc` và `một cuộc tiến công quy mô lớn của Đế quốc`, phân biệt
      rõ quy mô và bỏ chữ `tổng` dư thừa.
  - segment_id: YS-LN02/Text/part0032.xhtml/p000157
    prior_severity: minor
