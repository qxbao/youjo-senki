prior_findings_verification:
  - segment_id: YS-LN02/Text/part0032.xhtml/p000160
    prior_severity: moderate
    category: emphasis_and_meaning
    resolution: resolved
    jsonl_verification: >-
      Đã kiểm tra trực tiếp dòng 8 trong `translations/vol-02/ch-07-b07.jsonl`
      (`feda73f398624248ee917f609ec7f7be46d74a311c8b81d251eedfd9e8b838eb`): hai câu
      đầu đã được bọc chính xác bằng `*...*` khớp thẻ `<html:em>` theo `DEC-P01-002`
      (`*Không thể tin nổi chúng tôi lại rơi vào cảnh phải chặn chúng trước khi chúng
      vượt qua tuyến phòng thủ cuối cùng. Chúng tôi có nguy cơ chịu tổn thất vì các đòn
      quấy rối, đồng thời để chúng mang tin tình báo về.*`), đã bỏ cụm thêm nghĩa không
      gian `mắc kẹt ở đây`, và câu thứ ba nằm ngoài dấu sao đã khôi phục sắc thái tất
      yếu (`Không tránh khỏi, chuyện này khiến ai nấy đều cảm thấy hổ thẹn.`).
  - segment_id: YS-LN02/Text/part0032.xhtml/p000161
    prior_severity: moderate
    category: terminology_and_pronoun_reference
    resolution: resolved
    jsonl_verification: >-
      Đã kiểm tra trực tiếp dòng 9 trong `translations/vol-02/ch-07-b07.jsonl`: đã đổi
      sang `Tổng hành dinh Rhine` (bỏ cấp biên chế `Tập đoàn quân` không có trong nguồn)
      và dùng nhất quán đại từ `chúng` cho tiểu đoàn pháp sư địch ở cả hai vị trí
      (`nghiền nát chúng`, `những tin tình báo mà chúng có`), loại bỏ hoàn toàn sự nhập
      nhằng về chủ thể nắm tin tình báo.
  - segment_id: YS-LN02/Text/part0032.xhtml/p000153
    prior_severity: moderate
    category: meaning_and_terminology
    resolution: resolved
    jsonl_verification: >-
      Đã kiểm tra trực tiếp dòng 1 trong `translations/vol-02/ch-07-b07.jsonl`: đã sửa
      thành `Ai cũng chỉ mong có thể giải quyết êm thấm các cuộc giao chiến với địch`
      và `lực lượng đánh chặn của chúng tôi`, khôi phục đúng nghĩa mong ca trực đêm kết
      thúc êm thấm và bỏ hàm ý biên chế `phi đội`.
  - segment_id: YS-LN02/Text/part0032.xhtml/p000162
    prior_severity: moderate
    category: terminology
    resolution: resolved
    jsonl_verification: >-
      Đã kiểm tra trực tiếp dòng 10 trong `translations/vol-02/ch-07-b07.jsonl`: đã đổi
      `các điện báo viên` thành `các nhân viên thông tin vô tuyến`, giữ đúng phương tiện
      thông tin liên lạc vô tuyến bị nhiễu ma thuật làm tê liệt.
  - segment_id: YS-LN02/Text/part0032.xhtml/p000170
    prior_severity: moderate
    category: modality
    resolution: resolved
    jsonl_verification: >-
      Đã kiểm tra trực tiếp dòng 18 trong `translations/vol-02/ch-07-b07.jsonl`: đã sửa
      thành `Quyết tâm và khí thế nghe được trong giọng nói ấy cho thấy mức độ căng thẳng
      vừa đủ của một chiến binh cảnh giác.`, khôi phục tình thái mô tả và bỏ từ quy phạm
      `cần có`.
  - segment_id: YS-LN02/Text/part0032.xhtml/p000156
    affected_segment_ids:
