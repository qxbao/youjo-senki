  - "Giữ các cụm thuật ngữ `lễ phục kiểu II của Lục quân Liên minh Entente`, `phù hiệu quân hàm mới`, `cấp trên thuộc Cục Nhân sự Lục quân`, đại từ `ông ta` quy chiếu viên sĩ quan cấp trên và hình ảnh so sánh `nở nụ cười gượng gạo như đeo mặt nạ`."
