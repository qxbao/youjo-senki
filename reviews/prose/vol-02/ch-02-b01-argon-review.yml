  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các lựa chọn tạm đã ghi nhận tại `handoffs/vol-02/ch-02-b01.yml` cùng `work/run-state/pending-terms.yml`, phân biệt rõ đại từ trần thuật của Sue (`ông`) với viên cấp trên ở Cục Nhân sự (`ông ta`), giữ nhất quán cách xưng hô `Tôi`/`Chúng tôi` – `ông` trong nghi thức trao quân hàm và đại từ tự quy chiếu nội tâm `mình` của Sue."
