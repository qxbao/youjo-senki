- source_term: anson_sue_and_personnel_superior_pronouns_and_address_vol02_ch02_b01
  proposed_vi: "Trong phân cảnh phong quân hàm tại Cục Nhân sự Lục quân và khi Đại tá Anson Sue rời phòng (part0014/p000001–p000024): trần thuật ngôi thứ ba quy chiếu Anson Sue bằng `Ông` / `ông` xuyên suốt (p000003, p000004, p000013, p000014, p000016, p000018–p000024), kết hợp đại từ phản thân `mình` (p000003, p000016) và tên riêng `Sue` (p000004, p000012, p000013, p000021); quy chiếu viên sĩ quan cấp trên ở Cục Nhân sự Lục quân bằng `ông ta` (p000001) để phân biệt rõ chủ thể với Sue và thể hiện khoảng cách xa cách của nghi thức giả tạo; trong đối thoại, cấp trên tự xưng `Chúng tôi` (đại diện cơ quan/quân đội ở p000007) và `Tôi` (p000009), gọi Sue nhất quán là `Ông` / `ông` kèm quân hàm `Đại tá Anson Sue` / `Đại tá` (p000002, p000007, p000009); Sue tự xưng `tôi` và dùng `đất nước chúng ta` trong lời thoại (p000003); cấp dưới hỏi han gọi `Đại tá Sue?` (p000017); trong độc thoại nội tâm trực tiếp, Sue tự quy chiếu ngôi thứ nhất số ít bằng `mình` (p000018, p000019) và ngôi thứ nhất số nhiều chỉ giới quân nhân là `những người lính chúng ta` (p000012); quy chiếu tập thể những người trong phòng, các tình nguyện viên trẻ và phía Liên minh Entente bằng `họ` / `Họ` kết hợp phản thân `mình` (p000006, p000008, p000012, p000014, p000016, p000018–p000023)"
  alternatives_vi:
  - anh (thay cho `Ông` / `ông` khi sĩ quan cấp trên ở Cục Nhân sự gọi Đại tá Anson Sue tại part0014/p000002, p000007, p000009 — ưu tiên `Ông` / `ông` theo đúng lựa chọn đã signoff trong handoff `vol02-ch02-b01-superior-address-to-sue` vì văn cảnh không nêu rõ chênh lệch tuổi tác và `ông` giữ được sắc thái xã giao hành chính trang trọng đối với một sĩ quan cao cấp vừa thăng hàm Đại tá) / tôi (thay cho `mình` trong độc thoại nội tâm của Sue tại part0014/p000018, p000019 — ưu tiên `mình` như một lựa chọn tạm riêng cho giọng nội tâm tự vấn của Sue theo `vol02-ch02-b01-sue-interior-self-reference`, không đánh đồng với quy ước canon của Tanya tại `DEC-P01-001`)
