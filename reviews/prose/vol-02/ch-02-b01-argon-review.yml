  proposed_vi: "lễ phục kiểu II của Lục quân Liên minh Entente, phù hiệu quân hàm mới, Cục Nhân sự Lục quân (part0014/p000001) / Đại tá Anson Sue, Đại tá, Đại tá Sue, Sue (part0014/p000002, p000004, p000007, p000012, p000013, p000017, p000021) / Liên minh Entente (part0014/p000004, p000021) / phù hiệu mới (part0014/p000007) / Tổ quốc (part0014/p000009, p000010, p000016, p000019, p000023, p000024) / tình nguyện viên trẻ tuổi (part0014/p000014) / người yêu nước (part0014/p000016) / Cộng hòa, cường quốc (part0014/p000021) / quê hương (part0014/p000024)"
  alternatives_vi:
  - Ban Nhân sự Lục quân hoặc Phòng Nhân sự Lục quân (thay cho `Cục Nhân sự Lục quân` tại part0014/p000001 — ưu tiên `Cục Nhân sự Lục quân` vì phù hợp với quy mô cơ quan trung ương phụ trách thăng hàm cấp đại tá của Lục quân Liên minh Entente, đồng thời giữ trạng thái đề xuất tạm do chưa xác định rõ phân cấp tổ chức hành chính của Liên minh Entente) / lễ phục số II (thay cho `lễ phục kiểu II` tại part0014/p000001 — ưu tiên `lễ phục kiểu II` vì bám sát cách định danh mẫu quân phục `type II` một cách tự nhiên, không suy diễn thêm quy chuẩn quân trang) / Cộng hòa Pháp (thay cho `Cộng hòa` tại part0014/p000021 — ưu tiên giữ `Cộng hòa` để không tự quy chiếu sang quốc gia thực tế ngoài văn cảnh)
