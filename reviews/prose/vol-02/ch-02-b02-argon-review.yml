  volume: vol-02
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán đại từ trần thuật `ông` cho Đại tá Sue (tiếp nối B01) cùng sắc thái cổ kính `Ta` – `ngươi, hỡi Tổ quốc` trong lời thề ở p000029, đồng thời xác lập chuẩn mực xưng hô nghi thức `tôi` – `thưa quý vị` / `ngài` – `chúng ta` giữa các nghị viên Liên minh Entente trong phòng họp."
