- source_term: anson_sue_oath_and_entente_councilors_pronouns_and_address_vol02_ch02_b02
  proposed_vi: "Trong phân cảnh giác ngộ và lập lời thề của Đại tá Anson Sue (part0014/p000025–p000030): tiếp nối B01, trần thuật ngôi thứ ba quy chiếu Sue bằng `ông` xuyên suốt (p000025, p000027, p000030) và định danh là `Đại tá Sue` (p000029); quy chiếu người dân/đất nước trong suy tư gián tiếp của Sue bằng `họ` (p000025); trong lời thề trang trọng hướng tới Tổ quốc được nhân cách hóa ở p000029, Sue xưng `Ta` và gọi Tổ quốc là `ngươi, hỡi Tổ quốc`. Trong phân cảnh họp hội đồng của Liên minh Entente (part0014/p000031–p000043): trần thuật ngôi thứ ba quy chiếu tập thể các nghị viên bằng `họ` (p000032, p000041), quy chiếu Nghị viên Ngoại giao Abensoll và Nghị viên Lục quân Cazor bằng `ông` (p000038, p000043), và quy chiếu các quốc gia (`Đế quốc`, `Công quốc Dacia`, `Cộng hòa`, `Liên minh Entente`) bằng `mình` / `họ` (p000032, p000033, p000038, p000040, p000041, p000043); trong đối thoại tại phòng họp, Abensoll tự xưng `tôi`, gọi chung các nghị viên là `thưa quý vị` và dùng đại từ bao gộp `chúng ta` (p000036); khi trao đổi trực tiếp, Abensoll và Cazor gọi nhau trọng thị bằng chức danh `Nghị viên Cazor` và đại từ `ngài`, đồng thời dùng `chúng ta` cho phía Liên minh Entente (p000042, p000043); trong lời nhận xét của nhà ngoại giao Cộng hòa nói với Abensoll (p000039) dùng `các vị` để chỉ phía Liên minh Entente; trong suy nghĩ chung của mười nghị viên (p000041) dùng `chúng ta` cho Liên minh Entente và phản thân `mình` cho Cộng hòa"
  alternatives_vi:
  - mình (thay cho `Ta` trong lời thề nội tâm của Đại tá Sue tại part0014/p000029 — ưu tiên `Ta` – `ngươi, hỡi Tổ quốc` vì câu gốc mang sắc thái thề nguyền cổ kính, trang nghiêm trực tiếp hướng tới Tổ quốc được nhân cách hóa, khác với các câu độc thoại tự vấn thông thường dùng `mình` ở B01) / ông (thay cho `ngài` khi Nghị viên Ngoại giao Abensoll và Nghị viên Lục quân Cazor xưng hô với nhau tại part0014/p000042, p000043 — ưu tiên `ngài` đi kèm danh xưng `Nghị viên Cazor` để giữ đúng nghi thức nghị trường trang trọng giữa các ủy viên hội đồng cấp quốc gia của Liên minh Entente)
  segment_ids:
