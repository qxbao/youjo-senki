locked_choices:
- segment_id: YS-LN02/Text/part0014.xhtml/p000025
  locks:
  - "Giữ câu mở đầu in nghiêng `*Khoan đã.*` theo DEC-P01-002; giữ đại từ `ông`, `họ`, sự phân biệt từ vựng `quê hương` – `nhà nước` – `mái nhà` – `Tổ quốc`, cùng các cụm `một đất nước bị hủy diệt không có nghĩa là người dân nước đó cũng phải diệt vong`, `cánh đồng Tổ quốc lại nở hoa`, `Vẫn còn hy vọng được tái sinh.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000026
  locks:
  - "Giữ sự phân biệt từ vựng `Quê hương` và `quê nhà` trong câu `Quê hương không chỉ là lãnh thổ; chừng nào quê nhà còn tồn tại trong trái tim người dân, chừng đó vẫn chưa phải hồi kết.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000027
  locks:
  - "Giữ đại từ `Ông`, các cụm `đồng bào`, `đại nghĩa đáng để một người lính của quốc gia đang lụi tàn dốc lòng phụng sự`, và `một người lính đã thề bảo vệ Tổ quốc có thể tự hào`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000028
  locks:
  - "Giữ câu thoại cảm thán ngắn `“Đây rồi. Phải, tìm thấy rồi!”`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000029
  locks:
  - "Giữ danh xưng `Đại tá Sue` và câu thề nội tâm in nghiêng theo DEC-P01-002 với cặp đại từ cổ kính trang trọng `*Ta sẽ không bao giờ để bất kỳ ai hủy diệt ngươi, hỡi Tổ quốc.*`."
