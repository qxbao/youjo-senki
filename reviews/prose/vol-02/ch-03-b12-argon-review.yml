  proposed_vi: "Trong phân cảnh Weiss và Serebryakov báo tin Tiểu đoàn Viper tặng rượu cho buổi tiệc tại căn cứ, tiếp nối sang cảnh Tanya đi tới phòng họp chỉ huy trên kỳ hạm của Hạm đội Bắc Hải (part0018/p000116–p000140): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa followup M1, M2 cùng 9 điểm minor đã được nghiệm thu trong `handoffs/vol-02/ch-03-b12.yml`: (1) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000117, p000120, p000124, p000134–p000138, p000140), quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` / `Nó` (p000117, p000120, p000134–p000138) và đại từ phản thân `mình` (p000122, p000136, p000137) đúng chuẩn `DEC-P01-001`; tại p000117 giữ `Đúng lúc nó định bảo cô ấy làm đi thì—` theo bản sửa M2 để phân biệt rõ chủ ngữ `nó` (Tanya) với tân ngữ `cô ấy` (Serebryakov). (2) Trong độc thoại nội tâm của Tanya (p000122, p000124, p000125, p000127, p000129–p000131, p000138), nhất quán dùng `mình` / `Mình` cho ngôi thứ nhất số ít tự quy chiếu theo `DEC-P01-001`, dùng `chúng ta` / `ta` cho ngôi thứ nhất số nhiều chỉ đơn vị của Tanya (p000124, p000129), quy chiếu Trung úy Serebryakov bằng `cô ấy` (p000122), quy chiếu Trung úy Weiss trong thoáng nghi ngờ hài hước ở p000120 bằng `hắn`, và quy chiếu Tiểu đoàn Viper bằng `họ` (p000124, p000127). (3) Trong lời thoại trực tiếp giữa Tanya với Weiss và Serebryakov (p000116, p000118, p000121, p000123, p000125, p000126, p000128) và câu tuyên bố khai mạc cuộc họp của nhân viên tham mưu Hải quân Đế quốc (p000139): Tanya tự xưng `tôi` khi nói với cấp dưới (`Nhờ họ mà tôi có thể đãi tiểu đoàn mình` tại p000125 theo mục `vol02-ch03-b12-tanya-dialogue-self-reference`), gọi cấp dưới bằng `Trung úy` (p000125), dùng `Chúng ta` cho đơn vị và `họ` cho Tiểu đoàn Viper (p000125, p000128); Weiss gọi Tanya là `Thiếu tá`, dùng `chúng ta` kèm tiểu từ kính ngữ `ạ` (p000118); Serebryakov dùng `chúng tôi` khi báo cáo với cấp trên (p000121); câu đáp ở p000126 giữ từ xác nhận trung tính lễ phép `Vâng` theo mục `vol02-ch03-b12-neutral-acknowledgment`; nhân viên tham mưu Hải quân tự xưng `tôi` trong câu thông báo trang trọng ở p000139"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật về Tanya tại part0018/p000117, p000120, p000134–p000138 — bắt buộc giữ `nó` theo `DEC-P01-001` và bản sửa M2 tại p000117 để không nhầm với Serebryakov) / mình (thay cho `tôi` trong lời thoại của Tanya nói với cấp dưới tại part0018/p000125 — bắt buộc giữ `tôi` trong thoại và dành `mình` cho nội tâm theo `DEC-P01-001`, mục `vol02-ch03-b12-tanya-dialogue-self-reference` và bản sửa followup đã signoff) / Ừ (thay cho `Vâng` ở đầu câu thoại tại part0018/p000126 — bắt buộc giữ `Vâng` theo mục `vol02-ch03-b12-neutral-acknowledgment` vì người nói là cấp dưới của Thiếu tá Tanya)
