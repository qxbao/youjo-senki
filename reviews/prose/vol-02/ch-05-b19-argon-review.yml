      Một số vị trí đánh dấu nhấn mạnh giữa `xhtml` nguồn và bản dịch chưa khớp hoàn toàn về hình thức theo `DEC-P01-002`: tại `p000471` hai từ nhấn mạnh (`buried`, `depths`) và tại `p000483` câu mở đầu (`This is crazy.`) có thẻ `<html:em>` trong nguồn nhưng bản dịch đang để chữ thường không có `*...*`; tại `p000478` tên tài liệu trong `<html:em>` (`Field Trip Guide`) đang đặt trong ngoặc kép `“Hướng dẫn dã ngoại”` thay vì `*Hướng dẫn dã ngoại*`; ngược lại tại `p000485` nguồn không có thẻ `<html:em>` nhưng bản dịch đang bọc `*“…Chúng ta chết chắc rồi.”*`; ngoài ra tại `p000479`, `p000481`, `p000482`, `p000486` dấu chấm hỏi `?` ở cuối đoạn trích đang đặt ngoài dấu `*` đóng (`*“...”*?`).
    basis: >-
      Toàn bộ nghĩa văn bản, giọng điệu mỉa mai của cẩm nang dã ngoại và cảm xúc kinh hãi của các pháp sư đều được truyền tải chính xác, tự nhiên; sự khác biệt chỉ nằm ở quy ước ký hiệu đánh dấu.
    recommendation: >-
      Không chặn signoff; ở bước polish hoặc rà soát định dạng toàn tập có thể đồng bộ dấu `*...*` tại `p000471`, `p000478`, `p000483`, `p000485` và đưa dấu `?` vào trong phạm vi `*...*` ở `p000479`, `p000481`, `p000482`, `p000486` để khớp tuyệt đối với `DEC-P01-002`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000465
    category: lexical_nuance
    issue: >-
      Tại câu 3 của `p000465`, động từ miêu tả Trung đội Bảy lao vội vào phòng (`in ran Seventh Platoon`) đang được dịch nhẹ thành `Trung đội Bảy đã tới`; đồng thời tại `p000478`, hai câu liên tiếp dùng hai từ khác nhau cho cùng một khái niệm (`Hướng dẫn dã ngoại` và `Quy trình đi picnic à?`, trong khi ở `p000467` và `p000477` đều dịch `picnic` là `dã ngoại`).
    basis: >-
      Mạch hành động chạy đua với thời hạn ba phút ở `p000465` và sắc thái châm biếm ở `p000478` vẫn rõ ràng, hoàn toàn không ảnh hưởng đến logic tự sự.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh `p000465` thành `Trung đội Bảy cũng vừa chạy ùa vào` và thống nhất `Quy trình dã ngoại à?` ở `p000478` để đồng bộ với `p000467`, `p000477`.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000475
    category: pronoun_and_vocative_consistency
    issue: >-
      Trong tự sự ngôi thứ nhất của Warren Grantz ở lô `ch-05-b19` (`p000475`, `p000478`, `p000487`, `p000488`, `p000491`), Grantz quy chiếu Thiếu tá von Degurechaff nhất quán bằng đại từ `Cô` / `cô`, trong khi ở nửa cuối `ch-05-b18` (`p000451`, `p000457`, `p000458`, `p000460`, `p000461`) lại dùng `cô ta`; ngoài ra tại `p000487`, câu cầu nguyện thầm của Grantz dịch là `*Lạy Chúa, xin cứu chúng con.*` (khớp với phương án thay thế trong `b07-god-vocative` và `ch-05-b17` `p000424`, bên cạnh phương án `Thượng đế` ở `review-God`).
    basis: >-
      Điểm nhìn xuyên suốt `ch-05-b19` là của Thiếu úy ma pháp Warren Grantz (không phải trần thuật điểm nhìn Tanya nên không thuộc phạm vi cấm dùng `cô` của `DEC-P01-001`), và cách dùng `Cô` / `cô` nhất quán trong toàn bộ `b19`, đồng thời câu cảm thán `*Lạy Chúa, xin cứu chúng con.*` rất tự nhiên đối với lời cầu cứu trong tâm tưởng người lính.
    recommendation: >-
      Không chặn signoff; giữ nguyên trong `b19` và chỉ cần lưu ý nếu biên tập viên muốn đồng bộ sắc thái đại từ quy chiếu của Grantz giữa `b18` và `b19` ở bước chuốt văn toàn chương.
    resolution: optional_polish

