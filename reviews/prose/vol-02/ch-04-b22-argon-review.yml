    pronouns_and_address:
      - Đại từ "cô ấy" quy chiếu Tanya trong độc thoại nội tâm của Lergen
    pov_and_logic:
      - Giữ bản sửa M1 in nghiêng toàn đoạn độc thoại nội tâm của Lergen: sự đối lập giữa người xuất sắc nhất Đế quốc từng tạo ra với kẻ cuồng chiến tồi tệ nhất từng thấy, cùng hai câu hỏi tu từ chất vấn việc một con người có thể vui sướng khi giết đồng loại và trung thành thực hiện mọi nhiệm vụ quân sự không chút do dự
    emphasis: "*Dù là người xuất sắc nhất Đế quốc từng tạo ra, cô ấy cũng là kẻ cuồng chiến tồi tệ nhất từng thấy. Một con người bình thường có thể vui sướng đến thế khi giết đồng loại sao? Một con người bình thường có thể không chút do dự mà trung thành thực hiện bất cứ nhiệm vụ quân sự nào sao?*"
  - segment_id: YS-LN02/Text/part0024.xhtml/p000334
    names_and_ranks: []
