    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000332
    names_and_ranks: []
    pronouns_and_address:
      - Trong độc thoại nội tâm in nghiêng của Lergen, dùng "Tôi" cho Lergen, "cô ấy" cho Tanya, và "hai người" cho cả hai (theo bản sửa L6, không dùng "mình" của Tanya cho nội tâm Lergen)
    pov_and_logic:
      - Giữ bản sửa M1 in nghiêng toàn đoạn độc thoại nội tâm của Lergen: cảm giác nói gì cô ấy cũng không hiểu, hai người nói chuyện chẳng ăn nhập với nhau, và nỗi kinh ngạc khi lời khích lệ hoàn thành nhiệm vụ lại khiến "quả cầu điên loạn" này bùng lên ý chí chiến đấu và tuyên bố tiêu diệt sạch đối phương
    emphasis: "*Tôi nói gì cô ấy cũng chẳng hiểu. Trông thì như đang trò chuyện, nhưng bằng cách nào đó hai người cứ nói mà chẳng ăn nhập với nhau. Tôi chỉ bảo cô ấy hoàn thành nhiệm vụ thôi; sao quả cầu điên loạn này lại bùng lên ý chí chiến đấu và tuyên bố sẽ tiêu diệt sạch đối phương cơ chứ? Cuồng chiến đến mức nào nữa đây?*"
  - segment_id: YS-LN02/Text/part0024.xhtml/p000333
    names_and_ranks:
