      - Giữ nhận định tiếp nối p000323: người đó không chấp nhận bất cứ điều gì chưa hoàn hảo; tâm trí cô là sự kết hợp đáng sợ giữa khát máu và lòng yêu nước được nhào nặn thành tâm lý người lính, giống một con búp bê mang hình dáng người lính hơn là một người lính thực thụ
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000327
    names_and_ranks: []
