    emphasis: "*Tôi vừa thoát nạn trong gang tấc.*"
  - segment_id: YS-LN02/Text/part0024.xhtml/p000351
    names_and_ranks:
      - Colonel von Lergen -> Đại tá von Lergen
      - General Staff -> Bộ Tổng tham mưu
      - administrative note -> thông báo hành chính
      - the brass -> giới chóp bu
    pronouns_and_address:
      - Đại từ ngôi thứ nhất "Tôi" / "tôi" kết hợp phản thân "mình" trong lời kể ngôi thứ nhất của Tanya (`vol02-ch04-b22-tanya-first-person-narration`)
    pov_and_logic:
      - Giữ sự đối lập hài hước với góc nhìn của Lergen ở trên: Tanya thực chất đã run lên vì sợ bị khiển trách về thất bại trong nhiệm vụ đó, nhưng khi mở phong bì người bạn là Đại tá von Lergen (`vol02-ch04-b22-colonel-rank`) mang từ Bộ Tổng tham mưu về thì thấy chỉ là một thông báo hành chính, nên thở phào cho rằng giới chóp bu khoan dung hơn mình tưởng
    emphasis: none
