  - id: vol02-ch04-b22-lergen-and-tanya-pov-pronouns-and-emphasis
    source_term: Lergen third-person POV narration and italicized interior monologue (p000312–p000349), formal military dialogue pronouns between Lergen and Tanya, perspective switch to Tanya’s first-person narrative/thought in p000350–p000351, and DEC-P01-002 emphasis across 7 segments
    proposed_vi: >-
      xác nhận hệ thống điểm nhìn, đại từ, xưng hô và nhấn mạnh trong toàn lô:
      (1) Từ p000312 đến p000349 (điểm nhìn ngôi thứ ba và độc thoại nội tâm của
      Lergen), quy chiếu Lergen trong lời kể bằng “Lergen” và đại từ “anh” /
      “Anh” (p000317, p000318, p000321, p000336, p000337, p000341, p000345,
      p000347) kết hợp đại từ phản thân “mình” (p000341, p000345, p000347), và
      trong độc thoại nội tâm in nghiêng của Lergen tại p000332 dùng đại từ ngôi
      thứ nhất “Tôi” cùng “hai người” (tuyệt đối không mở rộng quy ước “mình”
      của Tanya trong DEC-P01-001 sang độc thoại nội tâm của nhân vật khác); quy
      chiếu Tanya dưới góc nhìn của Lergen bằng “cô” / “Cô” trong lời kể và câu
      cảm thán nội tâm tại p000328, và “cô ấy” trong độc thoại nội tâm tại
      p000332–p000333 (từ “nó” tại p000314 quy chiếu chiếc tàu ngầm và tại
      p000329 quy chiếu “một đứa trẻ”, hoàn toàn không dùng “nó” cho Tanya khi
      không phải điểm nhìn của Tanya). (2) Trong đối thoại công vụ trực tiếp
      (p000315, p000316, p000319, p000320, p000324, p000325, p000330, p000331,
      p000335, p000338, p000340, p000342–p000344, p000346, p000348), Lergen tự
      xưng “tôi” / “Tôi” (hoặc “Chúng tôi” khi đại diện Bộ Tổng tham mưu tại
      p000330) và gọi Tanya là “Thiếu tá” / “cô” / “Cô”; Tanya tự xưng “tôi” /
      “Tôi” và gọi Lergen là “ngài” (p000325, p000348). (3) Tại p000350–p000351
      (chuyển sang góc nhìn ngôi thứ nhất của Tanya), dùng nhất quán đại từ ngôi
      thứ nhất “Tôi” / “tôi” kết hợp đại từ phản thân “mình” theo đúng mục
      `vol02-ch04-b22-tanya-first-person-narration`. (4) Bảo toàn chính xác toàn
      bộ 7 vị trí nhấn mạnh `*...*` theo DEC-P01-002 (đã xử lý triệt để M1 tại
      p000328, p000329, p000332, p000333, hai vùng tách biệt tại p000337,
      p000347 và p000350), không tự thêm nhấn mạnh ở đoạn khác
    alternatives_vi:
      - ông (thay cho “anh” trong trần thuật quy chiếu Lergen nếu muốn đồng bộ xuyên lô với b21 p000308–p000309) / mình (thay cho “Tôi” / “tôi” trong câu tâm tưởng in nghiêng tại p000350 và lời kể ngôi thứ nhất của Tanya tại p000351 theo phương án thay thế ghi trong `vol02-ch04-b22-tanya-first-person-narration`)
