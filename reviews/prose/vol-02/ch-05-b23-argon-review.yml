    pronouns_and_address: "Trần thuật ngôi thứ ba bám sát điểm nhìn của Zettour: quy chiếu Zettour bằng `Ông` / `ông` và phản thân `mình` (tuân thủ giới hạn của `DEC-P01-001`), quy chiếu Tanya từ góc nhìn khách quan của Zettour bằng `cô lính trẻ`, `cô` và `Cô bé Degurechaff ấy`."
