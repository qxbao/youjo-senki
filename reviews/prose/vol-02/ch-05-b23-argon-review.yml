findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000589
    category: terminology_consistency
    issue: >-
      Tại `p000589`, danh xưng cơ quan `Operations` đang được dịch là `bộ phận Tác chiến` (trong khi các lô khác ở Tập 1–4 thường dùng `Cục Tác chiến` hoặc `Phòng Tác chiến`); bên cạnh đó, tại `p000598`, cụm `war college` được dịch là `trường quân sự` (trong khi ngữ cảnh thư viện nơi Zettour từng trao đổi với Tanya ở Tập 1 là `Đại học Quân sự` / `Học viện Quân sự`).
    basis: >-
      Cách dịch `một thành viên bộ phận Tác chiến` tại `p000589` và `thư viện trường quân sự` tại `p000598` vẫn truyền đạt hoàn toàn rõ nghĩa, tự nhiên và không làm sai lệch chức năng cơ quan hay bối cảnh hồi tưởng của Zettour.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc đồng bộ `bộ phận Tác chiến` thành `Cục Tác chiến` (hoặc `Phòng Tác chiến`) tại `p000589` và `trường quân sự` thành `Đại học Quân sự` (hoặc `Học viện Quân sự`) tại `p000598`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000606
    category: monologue_pronoun_and_figurative_reference
    issue: >-
      Tại `p000606`, câu độc thoại nội tâm in nghiêng của Zettour đang dùng đại từ tự xưng `tôi` (`*Ít nhất, tôi không thể đưa những người trong tình trạng ấy trở lại phá vỡ phòng tuyến lần nữa...*`) thay vì đại từ nội tâm `mình` hoặc `ta`; ngoài ra, tại `p000612` (`*Ông điên rồi*, họ nói.`), đại từ chủ ngữ trong nguyên bản quy chiếu trực tiếp về `Vẻ mặt đông cứng của các đồng nghiệp và cấp dưới` ở `p000611` trong bầu không khí im lặng của phòng họp, nên dịch thẳng là `họ nói` dễ gợi cảm giác các sĩ quan cất tiếng nói thành lời.
    basis: >-
      Tại `p000606`, đại từ `tôi` vẫn thể hiện rõ suy nghĩ cá nhân mang tính nguyên tắc của một tướng lĩnh; tại `p000612`, đặt giữa `p000611` (`Vẻ mặt đông cứng... cho thấy điều đó`) và `p000613` (`Không ai tránh khỏi nghĩ đến những điều ấy`), người đọc vẫn hiểu `*Ông điên rồi*` là lời phán xét không thành tiếng qua ánh mắt và nét mặt của cử tọa.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc đổi `tôi` thành `mình` (hoặc `ta`) trong câu nội tâm tại `p000606`, và chỉnh `họ nói` tại `p000612` thành `những gương mặt ấy như muốn nói vậy` (hoặc `vẻ mặt họ như nói lên điều đó`).
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000618
    category: pending_term_nuance
    issue: >-
      Tại `p000618`, cụm chứa thuật ngữ pending `rationality` (`P03-rationality` trong `canon/glossary-pending.yml`: `tính hợp lý` / `tính duy lý`) đang được dịch gọn thành `một đề xuất phi lý` (`a proposal that was devoid of rationality`).
    basis: >-
      Trong mạch văn kết đoạn (`p000617`–`p000618`) ngay sau khẩu hiệu nghịch lý `tìm đường thoát bằng cách tiến lên!`, cụm `một đề xuất phi lý` vẫn diễn đạt tự nhiên và đúng ý một đề xuất vượt ra ngoài lý tính/lẽ thường thông thường.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên `một đề xuất phi lý` để câu văn gọn đanh, hoặc cân nhắc `một đề xuất hoàn toàn trái với lý tính` / `một đề xuất đi ngược lại tính hợp lý` nếu muốn neo sát hơn vào mục từ `P03-rationality`.
    resolution: optional_polish

