- segment_id: YS-LN02/Text/part0010.xhtml/p000174
  locks:
  - "Giữ đại từ nội tâm `Mình` theo DEC-P01-001, sự đối lập `những người ở hậu phương` – `trải nghiệm nơi tiền tuyến`, câu hỏi có dấu chú thích `họ không chịu thừa nhận cuộc chuyển đổi mô thức?³` và cụm `chiến tranh ba chiều`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000175
  locks:
  - "Giữ các cụm `Các cựu binh ở mặt trận Norden và Rhine`, `các mô hình chiến tranh cũ`, và hai lần đại từ nội tâm `mình` theo DEC-P01-001 ở câu cuối."
- segment_id: YS-LN02/Text/part0010.xhtml/p000176
  locks:
  - "Giữ danh xưng `Toàn thể Quân đội Đế quốc`, phủ định `đang không học hỏi được gì` và ẩn dụ `người thầy có cái giá cắt cổ chỉ có thể trả bằng máu và sắt: kinh nghiệm`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000177
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, danh xưng `Tướng quân von Zettour`, lựa chọn tên tổ chức tạm `Quân đoàn Công vụ` theo `provisional_review_choices.service_corps`, cùng các cụm `các đạo quân ở phía đông và phía nam` và `trực thuộc Bộ Tổng tham mưu`."
