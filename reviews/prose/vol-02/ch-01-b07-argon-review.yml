  proposed_vi: "đòn đánh chống mục tiêu mặt đất, vị trí phòng không (part0010/p000153) / Bộ binh địch, bộ binh (part0010/p000154, p000156, p000161) / thế bắn theo đội hình khép sát, đại đội (part0010/p000155) / Trung úy, Trung úy Weiss, Weiss, pháp sư (part0010/p000156, p000157, p000159, p000165, p000168, p000170) / Thiếu tá (part0010/p000158, p000169, p000171) / ngài Lẽ Thường, súng trường bộ binh khóa nòng, tầm bắn hiệu quả, lớp vỏ phòng ngự (part0010/p000159) / kỵ binh hạng nặng, đội hình tercio, giáo dài, súng hỏa mai, vũ khí cá nhân, đội hình vuông bộ binh, mặt trận Rhine, Viễn Đông, Akitsushima, Liên bang (part0010/p000160) / học thuyết, thao trường, đạn thật, đội hình bộ binh dày đặc, phản ứng có điều kiện (part0010/p000161) / thuật thức (part0010/p000162, p000168) / đạn ma thuật, súng trường, cuộc xung phong (part0010/p000165) / Quân đội Đế quốc, binh sĩ Dacia (part0010/p000168, p000172, p000176) / buổi diễn tập bắn đạn thật (part0010/p000170) / học thuyết quân đội² (part0010/p000173) / hậu phương, tiền tuyến, cuộc chuyển đổi mô thức?³, tân binh, chiến tranh ba chiều (part0010/p000174) / cựu binh, mặt trận Norden và Rhine, mô hình chiến tranh cũ (part0010/p000175) / máu và sắt (part0010/p000176) / Tướng quân von Zettour, Quân đoàn Công vụ, các đạo quân ở phía đông và phía nam, Bộ Tổng tham mưu (part0010/p000177) / vùng trời tác chiến, ưu thế trên không (part0010/p000178)"
  alternatives_vi:
  - trận địa phòng không (thay cho `vị trí phòng không` tại part0010/p000153 — ưu tiên `vị trí phòng không` vì giữ phạm vi khái quát bao gồm cả đội hình bộ binh bắn tập trung lên không ở p000155 mà không thu hẹp thành công sự cố định) / tư thế bắn theo đội hình khép chặt hoặc vị trí bắn đội hình sát nhau (thay cho `thế bắn theo đội hình khép sát` tại part0010/p000155 — ưu tiên `thế bắn theo đội hình khép sát` theo `provisional_review_choices.close_ranks_firing_position` đã signoff trong handoff `handoffs/vol-02/ch-01-b07.yml`) / ngài Thường Thức (thay cho `ngài Lẽ Thường` tại part0010/p000159 — ưu tiên `ngài Lẽ Thường` theo lựa chọn tạm đã signoff tại `vol02-ch01-b07-mr-common-sense`) / vũ khí mang theo bên mình (thay cho `vũ khí cá nhân` tại part0010/p000160 — ưu tiên `vũ khí cá nhân` theo `provisional_review_choices.sidearms` đã sửa M1 và signoff) / Tướng von Zettour, Cục Hậu cần và Văn phòng Bộ Tổng tham mưu (thay cho `Tướng quân von Zettour`, `Quân đoàn Công vụ` và `Bộ Tổng tham mưu` tại part0010/p000177 — giữ `Tướng quân von Zettour`, `Quân đoàn Công vụ` và `Bộ Tổng tham mưu` theo bản dịch đã signoff và `provisional_review_choices.service_corps` trong handoff B07, đồng thời ghi nhận các phương án kia làm đối chiếu đồng bộ chéo với các batch về sau)
