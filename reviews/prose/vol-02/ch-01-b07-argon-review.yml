  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` cho đại từ trần thuật (`nó` / `Tanya`) và nội tâm tự quy chiếu (`mình`) của Tanya, đồng thời giữ đúng toàn bộ các quyết định đại từ và chủ thể đã sửa và signoff trong `handoffs/vol-02/ch-01-b07.yml` (`M3` ở p000165 bỏ `điều khiển nó` để tránh mơ hồ chủ thể; `L4` ở p000168 dùng `quân địch` / `họ` trung tính thay cho `chúng`; tỉnh lược chủ ngữ an toàn ở p000166)."
