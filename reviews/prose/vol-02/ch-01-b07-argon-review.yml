locked_choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000153
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, các thuật ngữ tạm `đòn đánh chống mục tiêu mặt đất` và `vị trí phòng không`, cùng tên riêng `Tanya` ở vế trần thuật cuối câu."
- segment_id: YS-LN02/Text/part0010.xhtml/p000154
  locks:
  - "Giữ cụm `Bộ binh địch đấy!` và câu hỏi phủ định trách cứ `Cậu không hiểu tôi đã ra lệnh tấn công ngay lập tức à?!` với cặp đại từ `Cậu` – `tôi`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000155
  locks:
  - "Giữ lời đáp của Weiss `Vâng`, đại từ `họ` – `tôi`, lựa chọn thuật ngữ tạm `thế bắn theo đội hình khép sát` theo T3/L2 và cụm `ra lệnh cho đại đội tránh họ`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000156
  locks:
  - "Giữ đúng phạm vi nhấn mạnh câu nội tâm `*Chỉ là— chỉ là một đám bộ binh đứng sát nhau thôi mà!*` theo DEC-P01-002, đại từ trần thuật `nó` cho Tanya theo DEC-P01-001, tên riêng `Weiss` và vế đối lập `đúng y như trong sách giáo khoa`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000157
  locks:
  - "Giữ cách gọi `Trung úy`, các đại từ `tôi` – `chúng ta` – `họ`, thuật ngữ `pháp sư`, giữ đúng phạm vi nhấn mạnh đại từ chỉ định `*thứ đó*` theo DEC-P01-002 (chỉ thế bắn của bộ binh địch, không nhầm với lớp vỏ phòng ngự), và lời đe dọa `tôi sẽ giết họ trước khi kẻ địch kịp ra tay`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000158
  locks:
  - "Giữ lời ngắt câu `“Nhưng, Thiếu tá—”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000159
  locks:
  - "Giữ biệt danh mỉa mai `ngài Lẽ Thường` theo L1, cặp đại từ `tôi` – `Cậu`, cùng các thuật ngữ `súng trường bộ binh khóa nòng`, `rìa tầm bắn hiệu quả` và `lớp vỏ phòng ngự của pháp sư` theo M2."
- segment_id: YS-LN02/Text/part0010.xhtml/p000160
  locks:
  - "Giữ cấu trúc phủ định `Có phải cậu là kỵ binh hạng nặng sắp đâm sầm vào đội hình tercio với giáo dài và súng hỏa mai đâu.` theo L3, lựa chọn thuật ngữ tạm `vũ khí cá nhân bên ta` theo M1, `đội hình vuông bộ binh của họ`, cùng các danh xưng `mặt trận Rhine`, `Viễn Đông`, `Akitsushima`, `Liên bang` và cụm `cuộc đụng độ đáng cười mà tàn khốc` theo L3."
- segment_id: YS-LN02/Text/part0010.xhtml/p000161
  locks:
  - "Giữ tên riêng `Tanya`, câu hỏi mỉa mai `Nếu bộ binh đã tụ tập lại để tự sát thì sao không giúp họ một tay?`, phủ định `ở thao trường không dùng đạn thật`, và quan hệ nhân quả – tăng tiến `cảnh hàng loạt nòng súng chĩa vào họ từ một đội hình bộ binh dày đặc thường khơi lên phản ứng có điều kiện là quay đầu rút lui; người phục vụ và huấn luyện càng lâu thì xu hướng ấy càng mạnh`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000162
  locks:
  - "Giữ cặp đại từ `Tôi` – `cậu`, cụm `gỡ lại danh dự` theo L7 và mệnh lệnh `Thử phóng một thuật thức thẳng vào giữa đội hình đó xem.`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000163
  locks:
  - "Giữ tiếng thốt ngỡ ngàng `“Hả?”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000164
  locks:
  - "Giữ cặp đại từ `tôi` / `Tôi` – `cậu` trong lời chỉ dẫn `“…Làm theo tôi. Tôi sẽ làm mẫu cho cậu xem.”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000165
  locks:
  - "Giữ câu đã sửa rõ chủ thể theo M3 `Nói rồi, Tanya nạp một viên đạn ma thuật vào súng trường rồi lượn xuống gọn ghẽ để tấn công giữa đội hình kéo dài.`, tên riêng `Weiss` đi với đại từ `anh` / `Anh`, việc lặp lại tên `Tanya` ở câu cuối và cụm `một cuộc xung phong liều lĩnh, tuyệt vọng`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000166
  locks:
  - "Giữ cách dịch tỉnh lược chủ ngữ trung tính `“…Đã thổi bay họ rồi.”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000167
  locks:
  - "Giữ lời thúc giục của Tanya `“Không còn gì để nói. Giờ thì làm nhiệm vụ đi!”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000168
  locks:
  - "Giữ đại từ `Anh` cho Weiss, `Họ` cho nhóm Tanya – Weiss, mệnh đề nhượng bộ trung tính `Dù quân địch có thể phòng thủ hay không thì hẳn họ cũng phải có cách đối phó` theo L4, cùng các danh xưng `Quân đội Đế quốc`, `Weiss`, `binh sĩ Dacia` và kết quả `bị nổ tung`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000169
  locks:
  - "Giữ lời nhận lỗi `“Thiếu tá… tôi thành thật xin lỗi.”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000170
  locks:
  - "Giữ danh xưng `Trung úy Weiss`, cặp đại từ `tôi` – `cậu`, và thuật ngữ `buổi diễn tập bắn đạn thật`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000171
  locks:
