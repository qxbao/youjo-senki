  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, nhân vật, cấp bậc và thuật ngữ quân sự – ma pháp đã xác lập ở Tập 1 cùng B01–B06 của Tập 2 (`Trung úy Weiss` / `Trung úy`, `Thiếu tá`, `pháp sư`, `lớp vỏ phòng ngự`, `đội hình vuông bộ binh`, `mặt trận Rhine`, `mặt trận Norden và Rhine`, `Liên bang`, `thuật thức`, `đạn ma thuật`, `Quân đội Đế quốc`, `binh sĩ Dacia`, `buổi diễn tập bắn đạn thật`, `chiến tranh ba chiều`, `Bộ Tổng tham mưu`), đồng thời khóa tạm toàn bộ các lựa chọn thuật ngữ đã sửa và signoff theo `M1`, `M2` cùng `provisional_review_choices` trong handoff `handoffs/vol-02/ch-01-b07.yml` (`đòn đánh chống mục tiêu mặt đất`, `vị trí phòng không`, `thế bắn theo đội hình khép sát`, `ngài Lẽ Thường`, `đội hình tercio`, `vũ khí cá nhân`, `học thuyết quân đội²`, `cuộc chuyển đổi mô thức?³`, `Quân đoàn Công vụ`, `ưu thế trên không`)."
  uncertainty: medium
  status: pending
  canon: false
- source_term: tanya_and_weiss_combat_demo_pronouns_and_address_vol02_ch01_b07
  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` theo DEC-P01-001 hoặc lặp lại tên riêng `Tanya` (part0010/p000153, p000156, p000161, p000165, p000173, p000178), không dùng `cô`; độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng `mình` / `Mình` xuyên suốt theo DEC-P01-001 (part0010/p000153, p000174, p000175, p000177), dùng `cậu` và `bên ta` khi mắng thầm Trung úy Weiss trong đầu (part0010/p000160), dùng chủ ngữ khái quát `người ta` và `phe ta` ở đoạn suy tư tổng kết (part0010/p000178); trần thuật ngôi thứ ba quy chiếu Trung úy Weiss bằng `anh` / `Anh` (part0010/p000165, p000168), quy chiếu chung hai người bằng `Họ` (part0010/p000168) và quy chiếu bộ binh Dacia trung tính bằng `họ` / `quân địch` (part0010/p000160, p000161, p000168); câu cảm thán ở p000166 tỉnh lược chủ ngữ trung tính (`…Đã thổi bay họ rồi.`); trong đối thoại quân sự: Tanya tự xưng `tôi`, dùng `chúng ta` khi chỉ đơn vị, gọi Weiss bằng cấp bậc `Trung úy` / `Trung úy Weiss`, biệt danh mỉa mai `ngài Lẽ Thường` và đại từ ngôi thứ hai `Cậu` / `cậu` (part0010/p000154, p000157, p000159, p000162, p000164, p000167, p000170, p000172); Weiss gọi Tanya là `Thiếu tá` (kể cả khi dịch từ `ma'am` ở p000171) và tự xưng `tôi` همراه lời đáp `Vâng` (part0010/p000155, p000158, p000163, p000169, p000171)"
  alternatives_vi:
  - anh (thay cho `Cậu` / `cậu` khi Tanya gọi Trung úy Weiss trong thoại và độc thoại hướng tới Weiss tại part0010/p000154, p000159, p000160, p000162, p000164, p000170 — giữ `Cậu` / `cậu` vì hoàn toàn nhất quán trong nội bộ B07, thể hiện tự nhiên thái độ bề trên khiển trách và chỉ bảo thuộc cấp của Thiếu tá Tanya sau khi cơn giận đòi bắn ở B06 chuyển sang màn thị phạm thực địa) / lặp tên Tanya ở mọi chỗ thay cho `nó` (tại part0010/p000156, p000173 — giữ `nó` kết hợp lặp tên `Tanya` vì tuân thủ đúng `DEC-P01-001` đã duyệt và đã được signoff tại `reviews/prose/vol-02/ch-01-b07-fixes-signoff-claude.md`)
