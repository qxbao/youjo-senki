    modality_and_logic: "Khóa cụm `bị sốc vì pháo kích` theo B03-F08 (phản ánh suy đoán của mọi người về sự hoảng loạn tinh thần của lính điện đài chứ không khẳng định chấn thương thể chất) và bước ngoặt bất ngờ ngay sau đó."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000054
    pronouns_and_address:
      - "Dùng `chúng tôi`; tân ngữ `nó` quy chiếu hiện tượng ở câu trước."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất tự đính chính giác quan tiếp nhận."
    modality_and_logic: "Giữ nguyên câu đính chính ngắn gọn `Hay đúng hơn là chúng tôi nghe thấy nó.`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000055
    terms:
      - "Tổ quốc (Fatherland)"
    pronouns_and_address: []
    pov_and_voice: "Thông điệp mật khẩu phát qua vô tuyến trên toàn vùng."
    modality_and_logic: "Khóa câu mật khẩu `“Ôi Tổ quốc thân yêu, hãy bình yên.”` đồng bộ hoàn toàn với p000060."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000056
    terms:
      - "mọi kênh (every channel)"
      - "binh sĩ bình thường (regular soldier)"
      - "năng lực ma pháp (magic ability)"
    pronouns_and_address: []
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ cấu trúc mức độ tăng tiến (`mạnh đến mức ngay cả một binh sĩ bình thường không có năng lực ma pháp cũng nghe thấy`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000057
    terms:
      - "chiến trường (battlefield)"
    pronouns_and_address: []
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ sự tương phản mạnh giữa khung cảnh chiến trường hỗn loạn mù mịt bụi bùn với giọng nói `bình thản đến lạ`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000058
    pronouns_and_address:
      - "Dùng `chúng tôi` kết hợp đại từ phản thân `mình`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ câu hỏi nội tâm gián tiếp (`tự hỏi liệu mình cũng phát điên rồi chăng`) nối với nghi vấn về người lính điện đài ở p000053."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000059
    terms:
      - "mật mã (code)"
      - "đơn vị quân tiếp viện (unit of reinforcements)"
      - "quân chi viện (backup)"
      - "ảo giác thính giác (auditory hallucination)"
    pronouns_and_address:
      - "Dùng `Chúng tôi`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ sự hoài nghi ban đầu (`nghĩ rằng quân chi viện không thể nào có thật, hẳn chỉ là ảo giác thính giác`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000060
    terms:
      - "Tổ quốc (Fatherland)"
    pronouns_and_address: []
    pov_and_voice: "Thông điệp mật khẩu phát lặp lại qua vô tuyến."
    modality_and_logic: "Khóa câu mật khẩu lặp lại nguyên văn từ p000055: `“Ôi Tổ quốc thân yêu, hãy bình yên.”`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000061
    terms:
      - "ngôn ngữ chính thức của Đế quốc (official language of the Empire)"
      - "mật khẩu dùng một lần (single-use password)"
    pronouns_and_address:
      - "Dùng `chúng tôi`; quy chiếu đơn vị phát tín hiệu bằng `họ`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất chuyển từ hoài nghi sang vỡ òa xác nhận."
    modality_and_logic: "Giữ cấu trúc phủ định kép đầu câu (`không nghe nhầm, cũng chẳng phát điên`) và thông tin then chốt `mật khẩu dùng một lần để chứng minh họ là bạn chứ không phải địch!`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000062
    terms:
      - "Những người bảo vệ Rhine (Guardians of the Rhine)"
    pronouns_and_address:
      - "Dùng đại từ ngôi thứ hai số nhiều `Các anh` cho các vế xướng đáp."
    pov_and_voice: "Lời đáp mật khẩu vang dội từ hầm vô tuyến dưới mặt đất."
    modality_and_logic: "Khóa cụm `Những người bảo vệ Rhine` (giữ nguyên địa danh `Rhine` không tự thêm `sông`) theo `vol02-ch05-b03-guardians-of-rhine` (B03-F05) và giữ nguyên bốn vế lặp nhịp nhàng."
    emphasis: "Khóa nhấn mạnh toàn bộ câu thoại `*“Những người bảo vệ Rhine! Các anh trung thành! Các anh là đá tảng! Các anh trung thành! Các anh là đá tảng!”*` theo đúng thẻ `<em>` duy nhất trong nguồn của batch (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000063
    terms:
      - "Người lính điện đài (The operator)"
      - "hầm vô tuyến (radio dugout)"
      - "máy vô tuyến (radio)"
      - "đội súng máy (machine-gun squad)"
    pronouns_and_address:
      - "Dùng `tôi`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ mức cực cấp của cảm xúc (`âm thanh vui sướng nhất tôi từng nghe`) và dấu ấn ký ức vĩnh viễn (`sẽ mãi khắc sâu vào tai tôi`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000064
    terms:
      - "mật mã (codes)"
      - "những người lính điện đài (The radio operators)"
      - "Màn nhiễu sóng trên diện rộng (The widespread interference)"
      - "pháp sư (mages)"
      - "những pháp sư tinh nhuệ của Lục quân Đế quốc (the elite mages of the Imperial Army)"
    pronouns_and_address:
      - "Dùng `Chúng tôi`, `tôi`, `tất cả chúng tôi`; quy chiếu người đặt mật mã và các lính điện đài bằng `họ`, quy chiếu các mật mã bằng `chúng`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất khép lại góc nhìn của người lính dưới chiến hào."
    modality_and_logic: "Giữ sự đối lập giữa thái độ chế giễu thường ngày với niềm an ủi thực sự ở thời khắc sinh tử (`nhưng lần này, chỉ lần này thôi, tôi nghĩ tất cả chúng tôi đều thật sự được an ủi bởi chúng`), cùng ba câu khẳng định dồn dập xác nhận lực lượng pháp sư tinh nhuệ của Lục quân Đế quốc."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000065
    terms:
      - "những vị cứu tinh (their saviors)"
      - "quân tiếp viện (their reinforcements)"
      - "đồng minh (allies)"
    pronouns_and_address:
      - "Bước chuyển từ ngôi thứ nhất của người cựu binh sang lời kể khách quan quy chiếu những người lính dưới hào bằng `họ` kết hợp sở hữu phản thân `của mình`."
    pov_and_voice: "Trần thuật ngôi thứ ba toàn tri tạo nghịch lý kịch tính trước khi chuyển sang góc nhìn của Tanya."
    modality_and_logic: "Giữ nguyên nghịch lý trớ trêu (`Thật may là họ không biết những vị cứu tinh, quân tiếp viện của mình lại nguy hiểm đến thế, có thể giáng sự hủy diệt hoàn toàn lên chính đồng minh.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000066
    terms:
      - "giới chỉ huy cấp cao của Lục quân Đế quốc (the Imperial Army brass)"
      - "thần chết (a god of death)"
      - "tiểu đoàn (battalion)"
      - "những kẻ cuồng chiến tranh (war nuts)"
    pronouns_and_address:
      - "Khóa đại từ trần thuật ngôi thứ ba `Nó` / `nó` cho Tanya theo DEC-P01-001 và B03-F01; quy chiếu những người lính dưới mặt đất và tiểu đoàn pháp sư bằng `họ`."
    pov_and_voice: "Trần thuật ngôi thứ ba giới thiệu Tanya và tiểu đoàn pháp sư của nó."
    modality_and_logic: "Khóa hai lựa chọn đã nghiệm thu: (1) `giới chỉ huy cấp cao của Lục quân Đế quốc` theo `vol02-ch05-b03-brass` (B03-F07); (2) cấu trúc song song `Đó là một tiểu đoàn dành cho những kẻ cuồng chiến tranh, do chính những kẻ cuồng chiến tranh lập nên; họ đã có mặt trên chiến trường.` theo B03-F09."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000067
    terms:
      - "Thiếu tá Tanya von Degurechaff (Major Tanya von Degurechaff)"
      - "đơn vị phản ứng nhanh (response unit)"
      - "Vùng nhận dạng phòng không Rhine, phân khu D-5 (Rhine Air Defense Identification Zone Sector D-5)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng `nó` và danh xưng đầy đủ `Thiếu tá Tanya von Degurechaff` kết hợp phản thân `của mình`."
    pov_and_voice: "Trần thuật ngôi thứ ba mở đầu phân cảnh điểm nhìn của Tanya (sau `space-break1`)."
    modality_and_logic: "Khóa địa chỉ tác chiến hai cấp `Vùng nhận dạng phòng không Rhine, phân khu D-5` theo `vol02-ch05-b03-air-defense-identification-zone` (B03-F02, B03-F05) và sự đối lập giữa nội tâm với vẻ mặt (`trong lòng chán ngấy mọi chuyện nhưng ngoài mặt vẫn trơ như không`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000068
    terms:
      - "Mật mã (Code)"
      - "Tiểu đoàn Pháp sư Trên không số 203 (203rd Aerial Mage Battalion)"
      - "hô hiệu Pixie (call sign Pixie)"
    pronouns_and_address:
      - "Tanya đại diện đơn vị báo danh qua vô tuyến bằng `Chúng tôi`."
    pov_and_voice: "Thông báo vô tuyến tác chiến ngắn gọn, chuẩn xác của Tanya."
    modality_and_logic: "Khóa tên đơn vị `Tiểu đoàn Pháp sư Trên không số 203` theo `vol02-ch05-b03-203rd-aerial-mage-battalion` (B03-F03), định danh `hô hiệu Pixie` theo `vol02-ch05-b03-pixie-call-sign` (B03-F06), và thời gian tiếp cận `160 giây`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000069
    terms:
      - "chiến tranh chiến hào (trench warfare)"
      - "tuyên truyền (propaganda)"
    pronouns_and_address:
      - "Câu 1 trần thuật ngôi thứ ba dùng tên riêng `Tanya`; câu 2 chuyển sang độc thoại nội tâm ngôi thứ nhất tự quy chiếu bằng `mình` theo đúng DEC-P01-001 và B03-F01."
    pov_and_voice: "Trần thuật ngôi thứ ba chuyển mượt sang độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa cấu trúc so sánh bậc nhất loại trừ ở câu 2 (`Công việc duy nhất mình ghét hơn là phải tỏ ra duyên dáng để phục vụ tuyên truyền.`) theo B03-F01."
    emphasis: "Không dùng `*...*` (tuân thủ DEC-P01-002, không tự đánh dấu nghiêng cho câu nội tâm)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000070
    terms:
      - "rào cản vô hình (invisible glass ceiling)"
      - "tuyên truyền (propaganda)"
      - "chiến tranh chiến hào (Trench warfare)"
    pronouns_and_address:
      - "Độc thoại nội tâm ngôi thứ nhất của Tanya dùng nhất quán đại từ `mình`."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất thực dụng của Tanya."
    modality_and_logic: "Giữ nguyên hai lý do khiến Tanya chán ghét hai công việc: sự bất lợi về thăng tiến trong cơ chế trọng nam khiến mình chẳng muốn diễn vẻ nữ tính cho tuyên truyền, và mức độ quá nguy hiểm của chiến tranh chiến hào."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000071
    terms:
      - "hệ thống nhân sự của Đế quốc (the Empire’s personnel system)"
      - "những nguyên tắc trọng dụng nhân tài (meritocratic principles)"
    pronouns_and_address:
      - "Độc thoại nội tâm ngôi thứ nhất dùng `mình`."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ cụm rào đón `theo một nghĩa nào đó` và mức độ đánh giá `khá hài lòng` (`more or less satisfied`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000072
    terms:
      - "độ cao thấp nhất có thể (lowest-possible altitude)"
      - "chiến trường (battlefield)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya dùng `nó` kết hợp đại từ phản thân `mình` ở mệnh đề phụ."
    pov_and_voice: "Trần thuật ngôi thứ ba gắn với suy nghĩ của Tanya."
    modality_and_logic: "Giữ quan hệ nhượng bộ – nguyên nhân (`dù bay bám sát mọi đường nét địa hình để duy trì độ cao thấp nhất có thể trên đường lao tới chiến trường là rất nguy hiểm, nó vẫn hài lòng vì ít ra mình sẽ được trọng dụng`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000073
    terms:
      - "vỏ đạn đã bắn (spent shells)"
      - "trận địa pháo của địch (enemy artillery position)"
      - "phụ cấp nguy hiểm và phụ cấp vùng chiến sự (hazard and war zone pay)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng `nó`."
    pov_and_voice: "Trần thuật ngôi thứ ba."
    modality_and_logic: "Giữ sự đối lập giữa chế độ đãi ngộ (`Dù có thêm phụ cấp nguy hiểm và phụ cấp vùng chiến sự`) với cảm giác thực tế trước nhiệm vụ đột kích trận địa pháo địch (`nó vẫn chẳng thấy vui vẻ gì`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000074
    terms:
      - "yểm trợ tác chiến (supporting combat)"
      - "đạn chống mục tiêu mặt đất (anti-surface ordnance)"
      - "công thức nổ khuếch tán (diffusion explosion formulas)"
      - "công thức đánh lừa quang học (optical deception formulas)"
      - "vỏ ngoài chống đạn (counter-bullet outer shells)"
      - "đối phó với máy bay và pháp sư địch (counter-air and -mage fights)"
      - "súng trường (rifle)"
      - "quả cầu tính toán (computation orb)"
    pronouns_and_address:
      - "Trong thoại chỉ huy, Tanya gọi thuộc cấp là `Các cậu`; trong câu trần thuật, quy chiếu bằng tên riêng `Tanya`."
    pov_and_voice: "Lời mệnh lệnh tác chiến trực tiếp của Tanya kết hợp câu trần thuật ngôi thứ ba."
    modality_and_logic: "Khóa thuật ngữ `công thức đánh lừa quang học` theo `vol02-ch05-b03-optical-deception-formulas` (B03-F04) và `quả cầu tính toán` theo `vol02-ch05-b03-computation-orb`, giữ đầy đủ bốn hạng mục chuẩn bị và quyền tùy nghi giao chiến phòng không / chống pháp sư."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000075
    terms:
      - "Yểm trợ tác chiến (Supporting combat)"
      - "người chỉ huy (commanders)"
      - "quân mình (our own troops)"
      - "các vị trí hỏa lực dưới mặt đất (the firing positions on the ground)"
    pronouns_and_address:
      - "Độc thoại nội tâm của Tanya dùng `chúng ta` và `quân mình` khi đặt toàn đơn vị vào giả định tác chiến."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya khép lại batch."
    modality_and_logic: "Giữ nguyên giả định nhân quả chắc chắn (`Nếu chúng ta thổi bay quân mình, chắc chắn ngay sau đó sẽ là một trận mưa đạn từ các vị trí hỏa lực dưới mặt đất.`) mà không tự suy diễn thêm chủ thể bắn trả ngoài những gì nguồn nêu."
    emphasis: "Không dùng `*...*`."
