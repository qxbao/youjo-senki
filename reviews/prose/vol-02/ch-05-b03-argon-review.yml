  - id: vol02-ch05-b03-pov-transition-pronouns-and-emphasis
    source_term: "First-person veteran recollection pronouns (`tôi` / `chúng tôi` / `chúng ta`) in p000049–p000064, radio password and countersign address (`Các anh`) in p000055/p000060/p000062, omniscient bridge reference to ground troops (`họ`) and Tanya (`Nó` / `nó`) in p000065–p000066, Tanya POV third-person narration (`nó` / `Tanya`) vs. first-person interior monologue (`mình` / `chúng ta`) and radio/command dialogue (`Chúng tôi`, `Các cậu`) in p000067–p000075, and italicized span in p000062"
    proposed_vi: "Bảo toàn chính xác bước chuyển điểm nhìn hai nửa của batch và tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 cùng sửa chữa B03-F01: (1) ở nửa đầu từ p000049 đến p000064 (tiếp nối hồi ức ngôi thứ nhất của người cựu binh từ ch-05-b02), người kể tự xưng `tôi` / `Tôi` ở ngôi thứ nhất số ít và `chúng tôi` / `Chúng tôi` ở ngôi thứ nhất số nhiều (kết hợp phản thân `mình` tại p000058), dùng `chúng ta` trong lời lẩm bẩm trực tiếp với đồng đội tại p000050, quy chiếu người lính điện đài bằng `anh ta` (p000053) và các lính điện đài / người đặt mật mã / pháp sư tiếp viện bằng `họ` (p000051, p000061, p000064), quy chiếu quân địch bằng `chúng` (p000051), giữ lời mật khẩu trang trọng `“Ôi Tổ quốc thân yêu, hãy bình yên.”` lặp nguyên văn tại p000055 và p000060, và dùng đại từ ngôi thứ hai số nhiều `Các anh` trong lời đáp mật khẩu từ hầm vô tuyến tại p000062; (2) ở đoạn cầu nối chuyển cảnh p000065–p000066, quy chiếu những người lính dưới mặt đất bằng `họ` (kết hợp phản thân `mình`), giới thiệu Tanya ở ngôi thứ ba bằng đại từ `Nó` / `nó` theo đúng DEC-P01-001 (B03-F01), và quy chiếu tập thể tiểu đoàn pháp sư bằng `họ`; (3) ở nửa sau từ p000067 đến p000075 (điểm nhìn của Thiếu tá Tanya von Degurechaff mở đầu bằng `space-break1` tại p000067), phân biệt rạch ròi giữa trần thuật ngôi thứ ba dùng `nó` / `Tanya` (p000067, câu 1 p000069, p000072, p000073, câu 2 p000074 — tuyệt đối không dùng `cô` / `cô ta`) với độc thoại nội tâm ngôi thứ nhất dùng `mình` (câu 2 p000069 theo B03-F01, p000070, p000071) và `chúng ta` khi bao gồm cả tiểu đoàn trong giả định bắn nhầm quân mình tại p000075; trong lời thoại của Tanya, dùng `Chúng tôi` khi báo danh qua vô tuyến (p000068) và `Các cậu` khi hạ lệnh cho thuộc cấp trong tiểu đoàn (p000074); (4) bảo toàn duy nhất phạm vi nhấn mạnh toàn câu `*“Những người bảo vệ Rhine! Các anh trung thành! Các anh là đá tảng! Các anh trung thành! Các anh là đá tảng!”*` tại p000062 theo đúng thẻ `<em>` trong nguồn, không thêm `*...*` vào bất kỳ câu nội tâm hay đoạn nào khác (DEC-P01-002)"
    alternatives_vi:
