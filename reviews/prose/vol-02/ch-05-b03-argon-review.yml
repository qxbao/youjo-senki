findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000058
    issue: "Tại câu 2 của p000058, danh từ chỉ hiện tượng âm thanh phát thanh kỳ lạ vang khắp chiến trường (`phenomenon`) được dịch là `Cảnh tượng ấy`, hơi thiên về thị giác trong khi ngay từ p000054 người kể đã đính chính rằng họ nghe thấy chứ không phải nhìn thấy."
    basis: "Đặt liền sau câu mô tả bầu trời mù bụi và bùn lầy ở p000057, `Cảnh tượng ấy phi thực đến thế` vẫn giữ đúng cảm giác siêu thực khiến binh lính ngỡ mình phát điên hoặc gặp ảo giác thính giác ở p000059."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `Hiện tượng ấy phi thực đến thế` để khớp chặt hơn với mạch thính giác từ p000054 đến p000059."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000063
    issue: "Tại câu 2 của p000063, cụm `machine-gun squad` được dịch gọn là `đội súng máy` (so với `tiểu đội súng máy` ở ch-05-b01 p000009) và danh từ giải phẫu chỉ màng nhĩ (`eardrums`) được dịch thoát ý thành `tai tôi`."
    basis: "Câu dịch hiện tại (`Dòng lời tuôn ra từ máy vô tuyến của đội súng máy sẽ mãi khắc sâu vào tai tôi.`) rất tự nhiên trong tiếng Việt và bảo toàn trọn vẹn ấn tượng thính giác không thể phai mờ của người cựu binh."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc đồng bộ thành `máy vô tuyến của tiểu đội súng máy sẽ mãi khắc sâu vào màng nhĩ tôi`."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000074
    issue: "Tại đầu câu 1 của p000074, danh từ hô gọi toàn đơn vị ở đầu mệnh lệnh tác chiến (`Troops,`) được gộp trực tiếp vào đại từ chủ ngữ `Các cậu` (`Các cậu sẽ đảm nhiệm nhiệm vụ yểm trợ tác chiến`), làm giảm nhẹ nhịp hô tập hợp đầu câu của người chỉ huy."
    basis: "Đại từ `Các cậu` và chuỗi mệnh lệnh chuẩn bị vũ khí – công thức phía sau vẫn truyền tải đầy đủ đối tượng nhận lệnh cũng như giọng chỉ huy bình thản, dứt khoát của Tanya."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc thêm hô ngữ ngắn ở đầu câu như `Tất cả nghe đây, các cậu sẽ đảm nhiệm nhiệm vụ yểm trợ tác chiến` / `Toàn đơn vị, các cậu sẽ đảm nhiệm nhiệm vụ yểm trợ tác chiến`."
    resolution: optional_polish

