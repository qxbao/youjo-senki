  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, bảo toàn trọn vẹn các bản sửa V1–V6 và N1–N13 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b14.yml`, phân tách rạch ròi giữa trần thuật (`Tanya`, `nó` / `Nó`), độc thoại nội tâm tự quy chiếu (`Mình` / `mình`, `chúng ta`), và đối thoại quân sự giữa người chỉ huy chiến dịch với Tanya (`tôi` / `Chúng tôi` – `cô` / `Thiếu tá`, `chúng ta`)."
