- source_term: tanya_flagship_briefing_withdrawal_request_dialogue_and_monologue_pronouns_vol02_ch03_b14
  proposed_vi: "Trong phân cảnh tư lệnh hạm đội giao nhiệm vụ tiên phong đột kích chiếm pháo bờ biển ở Osfjord cho Tiểu đoàn Pháp sư Không quân 203 và cuộc đối đáp thăm dò quyền đề nghị rút lui của Thiếu tá Tanya von Degurechaff (part0018/p000162–p000190): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa V1, V2, V4, V5 cùng các điểm minor đã được nghiệm thu trong `handoffs/vol-02/ch-03-b14.yml`: (1) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000162, p000163, p000179), quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` / `Nó` và đại từ phản thân `mình` (p000179) đúng chuẩn `DEC-P01-001`; tại p000189 giữ cách lặp tên `những lời Tanya đã nói` theo bản sửa V5 để tách bạch hoàn toàn với chủ ngữ `ông ấy` trong cùng câu. (2) Trong độc thoại nội tâm của Tanya (p000163, p000165, p000166, p000168–p000170, p000175, p000176, p000180, p000183–p000185, p000187–p000189), nhất quán dùng `Mình` / `mình` cho ngôi thứ nhất số ít tự quy chiếu (p000166, p000175, p000176, p000185), dùng `chúng ta` cho ngôi thứ nhất số nhiều chỉ đơn vị của Tanya và lực lượng tham gia chiến dịch (p000163, p000166, p000168, p000183, p000184, p000188), và quy chiếu vị sĩ quan chỉ huy đối thoại bằng cách gọi trung tính `người đó` tại p000187 theo mục `vol02-ch03-b14-unknown-male-reference` cùng `ông ấy` tại p000189. (3) Trong lời thoại trực tiếp giữa tư lệnh / sĩ quan chỉ huy chiến dịch và Tanya (p000164, p000167, p000171–p000174, p000177, p000178, p000181, p000182, p000186, p000190): người chỉ huy tự xưng `tôi` (p000167) hoặc `Chúng tôi` khi đại diện ban chỉ huy chiến dịch (p000171, p000177), dùng `chúng ta` / `Quân ta` khi nói về toàn lực lượng Đế quốc (p000164, p000167, p000186), gọi Tanya nhất quán là `cô` kèm quân hàm `Thiếu tá von Degurechaff` / `Thiếu tá` (p000171, p000173, p000177, p000181, p000186, đã xử lý triệt để V1 tại p000181 và V2 `đơn vị của cô` tại p000177); Tanya tự xưng `Tôi` / `tôi` (p000172, p000174, p000178, p000182) và dùng `chúng ta` khi lập luận về lợi ích chung của hạm đội và chiến dịch phong tỏa (p000190)"
  alternatives_vi:
  - anh (thay cho `cô` trong câu hỏi của người chỉ huy tại part0018/p000181 — bắt buộc giữ `cô` theo bản sửa V1 đã nghiệm thu để đồng bộ với p000171, p000177, p000186) / các cô (thay cho `đơn vị của cô` tại part0018/p000177 — bắt buộc giữ `đơn vị của cô` theo `DEC-P01-001` và bản sửa V2 để không tự suy diễn giới tính của toàn tiểu đoàn) / những điều mình nói (thay cho `những lời Tanya đã nói` tại part0018/p000189 — giữ `những lời Tanya đã nói` theo bản sửa V5 đã nghiệm thu để không gây hiểu nhầm `mình` là đại từ phản thân của chủ ngữ `ông ấy`)
