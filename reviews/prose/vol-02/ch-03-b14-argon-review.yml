  proposed_vi: "Tanya, Tướng von Rudersdorf, chiến dịch đột kích đường không, pháo bờ biển, cuộc tập kích bất ngờ, Pháp sư Không quân, hạm đội, vịnh hẹp, lục quân, đơn vị tinh nhuệ, cứ điểm ven biển ở tuyến sau (part0018/p000162) / các khẩu pháo của địch, cửa vịnh, cầu thang tàu, nhảy dù, quả cầu tính toán, súng trường (part0018/p000163, p000164) / hải quân, các pháp sư hải quân (part0018/p000166) / trấn áp lực lượng địch (part0018/p000168) / pháp sư, tàu chiến, Tiểu đoàn Pháp sư Không quân 203 (part0018/p000170) / đội tiên phong, Thiếu tá von Degurechaff, Thiếu tá (part0018/p000171, p000173) / tiểu đoàn tăng cường, hỏa lực, quân tiếp viện của địch (part0018/p000174) / con lừa khoác da sư tử (part0018/p000176) / hai trung đoàn lính thủy đánh bộ, tăng viện (part0018/p000177) / hủy chiến dịch, rút lui, lui quân (part0018/p000178, p000184, p000185) / cuộc xung phong bất chấp (part0018/p000188) / phe Cộng hòa, Khối Thịnh vượng chung, cuộc phong tỏa (part0018/p000190)"
  alternatives_vi:
  - chiến dịch đổ bộ đường không / đổ bộ (thay cho `chiến dịch đột kích đường không` tại part0018/p000162, p000163, p000166 và `nhảy dù` tại part0018/p000177 — bắt buộc giữ `chiến dịch đột kích đường không` và `nhảy dù` theo mục `vol02-ch03-b14-airborne-action` cùng `vol02-ch03-b08-airborne-amphibious` trong `work/run-state/pending-terms.yml` và bản sửa V3 đã nghiệm thu trong `handoffs/vol-02/ch-03-b14.yml` để tách bạch hoàn toàn với hoạt động đổ bộ đường biển) / Tiểu đoàn Pháp sư Đường không số 203 (thay cho `Tiểu đoàn Pháp sư Không quân 203` tại part0018/p000170 — bắt buộc giữ `Tiểu đoàn Pháp sư Không quân 203` theo mục `vol02-ch03-b06-aerial-mage-battalion` trong ledger và bản sửa V6 trong handoff) / trung đoàn thủy quân lục chiến / pháp sư thủy quân lục chiến (thay cho `hai trung đoàn lính thủy đánh bộ` tại part0018/p000177 và `các pháp sư hải quân` tại part0018/p000166 — giữ `lính thủy đánh bộ` và `các pháp sư hải quân` tại b14 theo đúng mục `vol02-ch03-b14-marines` trong `work/run-state/pending-terms.yml` và `handoffs/vol-02/ch-03-b14.yml`, đồng thời ghi nhận phương án ở `vol02-ch03-b15-marine-regiment` để đối chiếu về sau mà không tự nâng thành canon) / cầu tính toán (thay cho `quả cầu tính toán` tại part0018/p000163 — giữ `quả cầu tính toán` theo mục `vol02-ch03-b14-computation-orb` và bản sửa N5) / fjord (thay cho `vịnh hẹp` tại part0018/p000162, p000168 — giữ `vịnh hẹp` theo mục `vol02-ch03-b14-fjord`)
