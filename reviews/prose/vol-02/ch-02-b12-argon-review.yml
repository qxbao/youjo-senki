  proposed_vi: "Trong phân cảnh tại trạm tình báo / sở chỉ huy của Khối Thịnh vượng chung ở mặt trận phía bắc khi phát hiện tín hiệu của Named Đế quốc cùng tiểu đoàn pháp sư mới (part0014/p000300–p000328): trần thuật ngôi thứ ba quy chiếu tập thể các sĩ quan và quan sát viên Khối Thịnh vượng chung bằng `họ` kết hợp phản thân `mình` xuyên suốt (p000300, p000305, p000314, p000317, p000318, p000321), dùng đại từ ngôi thứ hai khái quát `anh` trong câu giả định ở p000302; quy chiếu viên sĩ quan tình báo bằng chức danh `Viên sĩ quan tình báo` và đại từ ngôi thứ ba số ít `Anh ta` / `anh ta` nhất quán ở cả bốn đoạn trần thuật và suy nghĩ gián tiếp (p000311, p000314, p000317, p000318); trong đối thoại nội bộ giữa các sĩ quan và quan sát viên Khối Thịnh vượng chung, người nói tự xưng `Tôi` / `tôi` (p000301, p000309, p000320) hoặc `Chúng tôi` khi đại diện bộ phận quan sát báo cáo (p000304), dùng ngôi thứ nhất số nhiều bao gộp `Chúng ta` / `chúng ta` / `Ta` / `ta` kết hợp phản thân `mình` (p000306, p000312, p000322, p000323), gọi đồng sự là `Anh` (p000310), và cấp dưới thưa người chỉ huy tại chỗ là `Thưa chỉ huy` (p000319); quy chiếu mục tiêu Named của Đế quốc từ góc nhìn đối phương bằng `cô ta` / `Cô ta` ở p000300–p000302, p000304, p000305 và giữ nguyên đại từ nam `hắn` trong lời thoại p000313 theo đúng sự khác biệt nhận thức trong nguyên bản mà không tự ý đồng nhất; quy chiếu đơn vị địch ở p000316 bằng `Chúng` ở câu đầu và lặp cụm danh từ `mật mã và giao thức ấy` ở câu sau; quy chiếu Đế quốc, quân Dacia và Liên minh Entente ở ngôi thứ ba số nhiều bằng `họ` theo từng câu (p000308–p000311, p000324, p000325)"
  alternatives_vi:
