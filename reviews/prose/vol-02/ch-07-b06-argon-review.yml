findings:
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000138
    issue: >-
      Câu thứ tư dịch là "Vậy mà mình hiếm khi bị ra lệnh giết họ nhiều đến thế",
      biến "mình" thành chủ ngữ trực tiếp của "hiếm khi bị ra lệnh" và làm đảo
      ngược nghĩa tần suất/so sánh của bản gốc (bản gốc dùng cấu trúc vô nhân xưng
      kèm mệnh đề so sánh để khẳng định hiếm có ai/hiếm có trường hợp nào lại bị
      ra lệnh giết người thường xuyên như nhân vật "mình").
    basis: >-
      Đối chiếu cấu trúc mệnh đề so sánh tần suất trong p000138 và mạch lập luận
      tương phản với câu trước ("Chắc chắn chẳng ai yêu thương con người hơn mình.
      Vậy mà...").
    proposal: >-
      Sửa thành "Vậy mà hiếm có ai lại bị ra lệnh giết người nhiều như mình."
      hoặc "Vậy mà. Hiếm khi có ai bị ra lệnh giết họ thường xuyên như mình."
    resolution: open_for_translator_or_coordinator
    status: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000137
    issue: >-
      Đoạn p000137 không có dấu ngoặc kép và là độc thoại nội tâm của Tanya đang
      trách thầm đám pháp sư đối phương kéo tới khiêu chiến (có liên hệ tới khái
      niệm làm thêm không lương và năng suất lao động), nhưng bản dịch dùng tự
      xưng "bọn tôi / tôi" thay vì "bọn mình / mình" như các đoạn nội tâm liền kề
      p000134–p000135 và p000138–p000140.
    basis: >-
      DEC-P01-001 quy định nội tâm tự quy chiếu của Tanya dùng "mình"; cấu trúc
      đoạn không có dấu thoại trong XHTML nguồn.
    proposal: >-
      Đổi tự xưng sang "bọn mình / mình" ("...lại đến khiêu chiến với bọn mình à?
      Cá nhân mình khó mà khen ngợi thái độ đó, vì mình biết...") để nhất quán
      điểm nhìn nội tâm, giữ "các người" cho đối tượng quân địch được gọi thầm.
    resolution: open_for_translator_or_coordinator
    status: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000146
    issue: >-
      Trong thông báo của Đài điều khiển, vị ngữ mô tả nhóm xâm nhập được dịch là
      "khá cừ đấy" thiên về khen kỹ năng thay vì cảnh báo tính chất làm thật/nghiêm
      túc của đối phương; câu cuối dùng "Các anh" cho lời gọi chung toàn đơn vị
      khi chưa có căn cứ giới tính toàn bộ thành viên.
    basis: >-
      Liên kết ngữ nghĩa với sắc thái "có phần nghiêm trọng" ở p000147 và nhận
      xét đối phương quyết tâm tiến sâu ở p000148; giới hạn suy luận giới tính
      theo DEC-P01-001.
    proposal: >-
      Chỉnh nhẹ thành "Hôm nay khách của chúng ta làm thật đấy. Mọi người sẽ bận
      tay đây." (hoặc "khá nghiêm túc đấy / căng đấy").
    resolution: open_for_translator_or_coordinator
    status: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000148
    issue: >-
      Các đoạn p000145, p000147 và p000151 dịch thuật ngữ ghép là "trinh sát chiến
      đấu", nhưng câu đầu p000148 khi tách thành tố bổ nghĩa trong dấu ngoặc kép
      lại viết "Dù có thêm chữ “bằng vũ lực”, về cơ bản đó vẫn là “trinh sát”",
      làm lệch bề mặt từ vựng giữa thuật ngữ ghép và thành tố được viện dẫn.
    basis: >-
      Tính liên kết bề mặt của lập luận giải thích thuật ngữ giữa p000147 và
      p000148.
    proposal: >-
      Giữ "trinh sát chiến đấu" theo mạch chương 7 và làm rõ liên hệ tại p000148
      (ví dụ: "Dù có thêm cụm chỉ tính chất “chiến đấu” / “bằng vũ lực”, về cơ bản
      đó vẫn là “trinh sát”" hoặc đồng bộ thành tố giữa các đoạn).
    resolution: open_for_translator_or_coordinator
    status: unresolved
