risks:
  - >-
    Lỗi nghĩa mức moderate tại p000138 làm đảo ngược chủ thể và tần suất của mệnh
    đề so sánh ("mình hiếm khi bị ra lệnh..." thay vì "hiếm có ai bị ra lệnh...
    nhiều như mình"); cần sửa trước khi nâng bản chuẩn.
  - >-
    Đoạn p000137 là độc thoại nội tâm hướng thầm về phía quân địch nhưng đang dùng
    đại từ "bọn tôi / tôi"; cần đồng bộ về "bọn mình / mình" theo DEC-P01-001 để
    không bị đọc nhầm thành lời diễn văn nối tiếp p000136.
  - >-
    Thành tố bổ nghĩa trong ngoặc kép ở p000148 ("bằng vũ lực") cần được khớp bề
    mặt với thuật ngữ "trinh sát chiến đấu" ở p000145, p000147 và p000151.
