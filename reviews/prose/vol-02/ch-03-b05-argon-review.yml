  volume: vol-02
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ nhất quán hệ đại từ điểm nhìn bên ngoài của Tướng von Schreise và các sĩ quan Cụm tập đoàn quân phương Bắc (`ông` cho Schreise, `cô` cho Tanya, `họ` cho các sĩ quan tham mưu), đồng thời duy trì chuẩn mực xưng hô trong tranh luận quân sự (`Tôi` / `tôi` – `các anh` – `Cô` / `cô` – `chúng ta`)."
