- source_term: schreise_and_staff_external_pov_conference_pronouns_vol02_ch03_b05
  proposed_vi: "Trong phân cảnh cuộc tranh luận tại hội nghị tham mưu Cụm tập đoàn quân phương Bắc nhìn từ góc độ bên ngoài của Tham mưu trưởng – Tướng Jekof von Schreise – và các sĩ quan tham mưu (part0016/p000100–p000119): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `ch-03-b04` (p000084–p000099), trần thuật ngôi thứ ba quy chiếu Schreise bằng `ông` / `Ông` xuyên suốt (p000105, p000107, p000110, p000111, p000118) kết hợp tên riêng `Schreise` (p000104, p000109, p000118); quy chiếu Tanya từ điểm nhìn bên ngoài của Schreise và các sĩ quan trong phòng họp bằng `cô` / `Cô` xuyên suốt (p000100, p000102, p000108, p000109, p000118, đồng bộ tuyệt đối với `vol02-ch03-b05-tanya-external-pov` trong `work/run-state/pending-terms.yml`) kết hợp đại từ phản thân `mình` (p000100) và danh xưng `Degurechaff` / `Thiếu tá von Degurechaff` / `Tanya` / `một viên thiếu tá` (p000100, p000108, p000110, p000114, p000117); quy chiếu tập thể các sĩ quan Hậu cần, Tác chiến và các sĩ quan Trung ương bằng `họ` / `Họ` (p000102, p000105, p000107, p000108, p000111). Trong đối thoại tại hội nghị (p000100–p000103, p000106, p000108, p000112, p000115, p000119): Tanya tự xưng `Tôi` / `tôi` (p000108, p000119), gọi các sĩ quan Tác chiến/Hậu cần chủ trương xuất quân là `các anh` (p000103), và dùng đại từ bao gộp `chúng ta` / `quân ta` khi nói về tình thế chung của quân Đế quốc (p000101, p000108, p000119); phía Hậu cần và Tình báo dùng `chúng ta` / `Chúng ta` / `ta` khi trình bày năng lực tiếp tế và thúc giục tiến công (p000106, p000115); người phát biểu phản bác Tanya ở p000112 gọi Tanya nhất quán là `Cô` / `cô` kết hợp phản thân `mình` và đại từ bao gộp `quân ta`"
  alternatives_vi:
  - nó (thay cho `cô` / `Cô` khi quy chiếu Tanya trong trần thuật tại part0016/p000100, p000102, p000108, p000109, p000118 — bắt buộc giữ `cô` / `Cô` theo mục `vol02-ch03-b05-tanya-external-pov` vì toàn bộ lô này được kể từ điểm nhìn quan sát bên ngoài của Schreise và các sĩ quan tham mưu Cụm tập đoàn quân phương Bắc, trong khi `nó` theo `DEC-P01-001` chỉ áp dụng cho trần thuật gắn điểm nhìn của Tanya) / cô ta (thay cho `cô` tại part0016/p000118 — bắt buộc giữ `cô` như bản sửa F04 đã signoff để đồng bộ với toàn lô và không tự thêm sắc thái miệt thị ở p000118) / các vị (thay cho `các anh` trong lời Tanya nói với các sĩ quan Tác chiến tại part0016/p000103 — tạm giữ `các anh` trong bản dịch đã duyệt vì tự nhiên với ngữ cảnh tranh luận trực diện tại bàn họp quân sự)
