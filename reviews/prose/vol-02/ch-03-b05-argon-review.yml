  proposed_vi: "Phía Tác chiến, các sĩ quan phía Tác chiến, Degurechaff (part0016/p000100, p000102, p000108) / lãnh thổ địch, một đòn quyết định (part0016/p000101) / Phía Hậu cần, các nhân viên phía Hậu cần, các sĩ quan phía Hậu cần, thu hẹp tuyến (part0016/p000102, p000104, p000107) / Schreise, hàng tiếp tế, chiến dịch tiến công ngắn ngày, tiền tuyến (part0016/p000104–p000106, p000109, p000118) / đạn dược tiêu chuẩn, khẩu phần ăn, Nhiên liệu hàng không, nhiên liệu thông dụng, cụm tập đoàn quân, mặt trận phía bắc, Lực lượng dự bị (part0016/p000107) / tuyến đường sắt nhẹ, đường sắt nhẹ, các tuyến tiếp tế (part0016/p000108, p000111) / tàn quân địch, cuộc đại tiến công, các toán pháp sư biệt kích của địch, Thiếu tá von Degurechaff (part0016/p000110) / công binh dã chiến, các sĩ quan Trung ương, Quân Trung ương (part0016/p000111, p000118) / Liên minh Entente, tổn thất pháp sư, tiểu đoàn pháp sư của Đế quốc, trung đoàn của Liên minh Entente (part0016/p000112–p000114) / Tuyến phòng thủ chủ lực, nhân viên tình báo, Tanya, tù binh địch, Phía Tình báo (part0016/p000114, p000116) / Cụm tập đoàn quân phương Bắc, viên thiếu tá (part0016/p000117) / hai tiểu đoàn, một đại đội tăng cường (part0016/p000119)"
  alternatives_vi:
  - đường sắt dã chiến / đường sắt đô thị / tàu điện nhẹ (thay cho `đường sắt nhẹ` / `tuyến đường sắt nhẹ` tại part0016/p000108, p000111 — ưu tiên `đường sắt nhẹ` theo mục `vol02-ch03-b05-light-rail` trong `work/run-state/pending-terms.yml` vì phản ánh trung tính tuyến đường ray hạng nhẹ do công binh dã chiến lắp đặt để phục vụ tiếp tế tiền tuyến, tránh gán bối cảnh đô thị hoặc tự thêm khẳng định kỹ thuật về khổ ray) / Lục quân Trung ương (thay cho `Quân Trung ương` tại part0016/p000118 — ưu tiên `các sĩ quan Trung ương` ở p000111 và `Quân Trung ương` ở p000118 theo mục `vol02-ch03-b05-central-army` để giữ độ mở về cấp cơ quan chỉ huy và đồng bộ với `ch-03-b03`, `ch-03-b04`, `ch-03-b06`) / nhiên liệu đa dụng (thay cho `nhiên liệu thông dụng` tại part0016/p000107 — giữ `nhiên liệu thông dụng` theo `vol02-ch03-b05-military-terms`)
