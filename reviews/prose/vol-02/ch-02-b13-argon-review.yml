- source_term: commonwealth_dispatched_officers_dialogue_and_enemy_named_pronouns_vol02_ch02_b13
  proposed_vi: "Trong phân cảnh phân tích tình hình và trao đổi của nhóm sĩ quan thu thập tình báo Khối Thịnh vượng chung tại hiện trường (part0014/p000329–p000353): trần thuật ngôi thứ ba quy chiếu tập thể các sĩ quan và binh sĩ Khối Thịnh vượng chung bằng `Họ` / `họ` kết hợp phản thân `mình` / `chính mình` xuyên suốt (p000329, p000330, p000333, p000334, p000336, p000339, p000340, p000342, p000345, p000347, p000348, p000353); dùng đại từ khái quát `người ta` kết hợp phản thân `chính mình` hoặc cấu trúc khái quát vô nhân xưng cho đại từ ngôi thứ hai phiếm chỉ trong lời thoại và trần thuật (p000332, p000336, p000337, p000345); quy chiếu mục tiêu Named của Đế quốc từ góc nhìn phía Khối Thịnh vượng chung bằng cụm danh từ `Named này` / `Named đó` / `một Named` và đại từ ngôi thứ ba số ít `cô ấy` nhất quán tại p000335, p000341, p000342 (theo mục `vol02-ch02-b13-named-reference` và bản sửa `MOD-1`), không dùng `nó` hay `con` và không suy diễn danh tính; trong các câu thoại của các sĩ quan tại chỗ (p000331, p000332, p000338, p000341, p000343, p000344, p000346, p000349, p000352), người nói tự xưng `tôi` (p000331) hoặc dùng ngôi thứ nhất số nhiều bao gộp `chúng ta` (p000338, p000344, p000349) trung tính, không tự suy diễn cấp bậc hay người nói cụ thể; quy chiếu Khối Thịnh vượng chung, Cộng hòa, Đế quốc và tiểu đoàn địch bằng `nước này` / `họ` / `Họ` theo mạch từng câu (p000330, p000333, p000343, p000348, p000350, p000351)"
  alternatives_vi:
  - cô ta (thay cho `cô ấy` khi quy chiếu Named tại part0014/p000335, p000341, p000342 — cả `cô ta` và `cô ấy` đều được cho phép trong `provisional_choices.named` của `handoffs/vol-02/ch-02-b13.yml`; ưu tiên giữ `cô ấy` theo văn bản đã được signoff tại `reviews/prose/vol-02/ch-02-b13-fixes-signoff-claude.md` và mục `vol02-ch02-b13-named-reference` trong `pending-terms.yml`, đồng thời tuân thủ nghiêm ngặt `DEC-P01-001` là không dùng `nó` ngoài điểm nhìn trần thuật của Tanya)
