  proposed_vi: "những người lão luyện trong công tác thu thập tình báo, Đế quốc (part0014/p000329, p000340, p000348) / Khối Thịnh vượng chung, các quân đội của Khối Thịnh vượng chung, Quân đội Đế quốc, học thuyết trước chiến tranh (part0014/p000330, p000333, p000336, p000346–p000348, p000350, p000351, p000353) / tiểu đoàn, ba trăm kilômét một giờ, thiết bị (part0014/p000331, p000332, p000340, p000341, p000343, p000345, p000352) / sĩ quan tham mưu, Named, một Named của Đế quốc (part0014/p000335, p000340–p000342, p000353) / chuyên gia, cục diện chiến tranh, công tác tình báo, sách giáo khoa chuyên ngành (part0014/p000336, p000337) / Lực lượng viện binh, tiểu đoàn tăng cường, cuộc tấn công quy mô cấp tiểu đoàn, đại đội (part0014/p000340–p000342) / đơn vị hỗn hợp (part0014/p000344) / Cộng hòa, Liên minh Entente, học thuyết tác chiến, vị thế trung lập (part0014/p000346–p000348, p000350, p000351) / một tiểu đoàn được tổ chức lại, lực lượng tình nguyện của Khối Thịnh vượng chung, chế độ thời chiến, ưu thế về quân số (part0014/p000352, p000353)"
  alternatives_vi:
