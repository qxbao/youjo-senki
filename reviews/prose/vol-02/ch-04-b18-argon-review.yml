  - id: vol02-ch04-b18-observer-narrator-pronouns-and-counterfactual-modality
    source_term: observer narrator first-person choice in p000201/p000203/p000207, senior officer third-person reference and briefing room dialogue address in p000204–p000206/p000212–p000213, epistemic modifier in p000212, and past counterfactual modality in p000221
    proposed_vi: >-
      xác nhận bản sửa M1 và toàn bộ đề xuất điều phối tại
      `handoffs/vol-02/ch-04-b18.yml` đã được áp dụng đầy đủ và nghiệm thu: (1)
      Ở đoạn đầu lô (p000201, p000203, p000207), giữ nguyên lựa chọn tạm dùng đại
      từ ngôi thứ nhất “tôi” cho người quan sát/chiếu đoạn phim theo đúng mục
      `vol02-ch04-b18-observer-narrator-pronoun` trong sổ pending và chỉ dẫn của
      coordinator; sang p000212–p000213, quy chiếu người chất vấn bằng “một người
      đàn ông” và đại từ ngôi thứ ba trang trọng “ông” (đồng bộ với mạch trần
      thuật về Thiếu tướng Habergram ở cuối b17 p000195–p000198). (2) Trong lời
      thoại tại cuộc họp tình báo, các sĩ quan tình báo tự xưng “Chúng tôi”
      (p000204) / “tôi” (p000205), còn người chủ trì chất vấn tự xưng “Tôi”, gọi
      tập thể sĩ quan tình báo là “các vị” và dùng “chúng ta” cho phía mình
      (p000212). (3) Tuân thủ nghiêm ngặt DEC-P01-001 và DEC-P01-002: toàn lô
      không thuộc điểm nhìn của Tanya, đại từ “nó” chỉ quy chiếu danh từ bất
      động vật/đơn vị (“Đoạn phim trận chiến” tại p000207 và “đơn vị ấy” tại
      p000221), và không tự thêm bất kỳ dấu `*...*` nào khi nguồn không có nhấn
      mạnh. (4) Tại p000212, xác nhận bản sửa M1 dịch chuẩn xác trạng từ tình thái
      là “được cho là đã triển khai”; tại p000221, bảo toàn chính xác tình thái
      giả định quá khứ trái thực tế ở câu thứ hai (“Nếu đơn vị ấy đã được rút đi
      rồi xuất hiện ở phòng tuyến sông Rhine, có thể xem đó là bằng chứng...”) và
      không hàm ý đơn vị đó thực sự biến mất vĩnh viễn
    alternatives_vi:
      - ông / cấu trúc trung tính lược chủ ngữ tại p000201, p000203, p000207 (nếu đồng bộ hoàn toàn ngôi kể thứ ba với cuối b17 p000195–p000198 và p000212–p000213 ở bước rà soát liên lô; hiện giữ “tôi” theo quyết định tạm đã khóa trong handoff b18)
      - bọc câu hỏi mở đầu tại p000199 trong dấu ngoặc kép `“...”` khi rà soát đồng bộ dấu câu với nguồn
