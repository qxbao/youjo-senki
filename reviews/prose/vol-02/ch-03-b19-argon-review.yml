- source_term: republican_channel_fleet_command_and_habergram_pronouns_vol02_ch03_b19
  proposed_vi: "Trong phân cảnh Bộ chỉ huy Hạm đội Eo biển Cộng hòa nhận tin Hạm đội Đế quốc chuyển hướng lên phía bắc nhưng bị tàu ngầm – pháp sư địch lập tuyến ngăn chặn và nhận tin dữ từ tùy viên quân sự tại Liên minh Entente, chuyển sang văn phòng tình báo Khối Thịnh Vượng Chung của Thiếu tướng Donald Habergram (part0018/p000335–p000357): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa V1–V3, N1–N5 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b19.yml`: (1) Trong phân cảnh phía Bộ chỉ huy Hạm đội Eo biển Cộng hòa (p000335–p000355): trần thuật ngôi thứ ba quy chiếu tập thể nhân viên Bộ chỉ huy và phía Cộng hòa bằng `họ` / `Họ` / `ai nấy` / `tất cả` (p000335, p000338–p000342, p000346, p000348–p000350, p000352, p000354, p000355); quy chiếu lực lượng và tàu địch của Đế quốc bằng `Chúng` / `chúng` (p000342, p000349, p000355); trong các câu suy nghĩ và lời thề nội tâm tập thể được in nghiêng đúng phạm vi theo `DEC-P01-002`, dùng đại từ ngôi thứ nhất số nhiều `Chúng ta` / `chúng ta` (`*Chúng ta có kịp không?*`, `*Nhất định phải kịp.*` ở p000352; `*Lần tới… Lần tới, chúng ta sẽ đánh bại chúng.*` ở p000355); trong khẩu lệnh vô tuyến và mệnh령 tác chiến trực tiếp (p000336, p000337, p000342–p000344, p000351, p000353) lược đại từ nhân xưng để giữ giọng quân sự khẩn trương, dứt khoát. (2) Trong phân cảnh tại văn phòng tình báo của Khối Thịnh Vượng Chung (p000356–p000357): trần thuật ngôi thứ ba quy chiếu Thiếu tướng Donald Habergram bằng danh xưng `Thiếu tướng Donald Habergram` kết hợp đại từ trang trọng `ông` ở câu kết p000357"
  alternatives_vi:
  - ông ta / hắn (thay cho `ông` khi quy chiếu Thiếu tướng Donald Habergram tại part0018/p000357 — bắt buộc giữ đại từ trung tính trang trọng `ông` cho tướng lĩnh cấp cao theo chuẩn trần thuật xuyên suốt Tập 1–2 và đồng bộ với b20–b22) / chúng tôi (thay cho `Chúng ta` / `chúng ta` trong nội tâm tập thể tại part0018/p000352, p000355 — ưu tiên `Chúng ta` / `chúng ta` để thể hiện tiếng nói nội tâm đồng lòng của toàn bộ nhân viên Bộ chỉ huy Hạm đội Eo biển Cộng hòa, đồng bộ với p000329 ở b18)
