  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt nhất quán giữa trần thuật ngôi thứ ba về tập thể Bộ chỉ huy Hạm đội Eo biển Cộng hòa (`họ` / `Họ`), đại từ chỉ quân địch Đế quốc (`Chúng` / `chúng`), suy nghĩ/lời thề nội tâm tập thể in nghiêng (`Chúng ta` / `chúng ta`), khẩu lệnh tác chiến lược chủ ngữ, và đại từ trần thuật trang trọng `ông` cho Thiếu tướng Donald Habergram ở p000357."
