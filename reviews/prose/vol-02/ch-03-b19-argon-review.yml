  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ quân sự – hải quân, đơn vị, địa danh, chính thể và cấp bậc đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b19_translation_proposals` cùng `handoffs/vol-02/ch-03-b19.yml` (`Bộ chỉ huy`, `Spike 04`, `Hạm đội Đế quốc` / `hạm đội Đế quốc`, `chiến dịch đổ bộ`, `Cộng hòa`, `Dacia`, `Liên minh Entente`, `Cụm tập đoàn quân phương Bắc của Đế quốc`, `Lục quân Đế quốc`, `Khối Thịnh Vượng Chung`, `các pháp sư thủy quân lục chiến`, `tuyến ngăn chặn`, `Hạm đội Eo biển Cộng hòa` / `Hạm đội Eo biển`, `Hạm đội Biển khơi Đế quốc` / `Hạm đội Biển khơi`, `Hạm đội Biển Bắc`, `Soái hạm`, `*Helgoland*` / `lớp Helgoland`, `tàu chiến chủ lực`, `Bộ chỉ huy Hạm đội Eo biển`, `tùy viên quân sự`, `Hải quân Đế quốc`, `Osfjord`, `cơ quan tình báo`, `Thiếu tướng Donald Habergram`), bảo toàn trọn vẹn các bản sửa V1–V3 và N1–N5 đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b19-fixes-signoff-claude.md`."
