- source_term: commonwealth_admiralty_first_lord_and_general_habergram_pronouns_vol02_ch03_b22
  proposed_vi: "Trong phân cảnh Tướng Habergram báo cáo khẩn và bàn bạc riêng với Đệ nhất Lãnh chúa Hải quân tại Văn phòng Bộ Hải quân về phương án bí mật đưa nghị viên Liên minh Entente sang lãnh thổ Khối Thịnh vượng chung bằng tàu ngầm thay cho tàu phụ trợ *Lytol* (part0018/p000411–p000438): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa V1–V5 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b22.yml`: (1) Trần thuật ngôi thứ ba quy chiếu Tướng Habergram và Đệ nhất Lãnh chúa Hải quân bằng đại từ trang trọng `ông` / `Ông` kết hợp danh xưng chức vụ (`Đệ nhất Lãnh chúa Hải quân`, `cấp trên`) và bảo toàn đúng mức độ mơ hồ chủ thể như bản gốc tại p000418, p000426, p000431 (p000411, p000414, p000418, p000426, p000431, p000435). (2) Quy chiếu phía Khối Thịnh vượng chung / cơ quan Tình báo / Bộ Hải quân, các thành viên cốt cán của chính phủ lưu vong và phía Liên minh Entente bằng `họ` / `chính họ` / `phía tàu` (p000415, p000419, p000420, p000426, p000430, p000431, p000434, p000436), trong đó tại p000430 nêu rõ chủ thể `Liên minh Entente` và `phía tàu` theo bản sửa V3; quy chiếu nghị viên tị nạn bằng `người đó` (p000430); quy chiếu tàu *Lytol* bằng `nó` và các tàu khách / phà / vũ khí ngụy trang bằng `chúng` (p000420, p000421, p000423, p000425, p000426, p000428, p000433). (3) Trong đối thoại trực tiếp giữa Đệ nhất Lãnh chúa Hải quân (cấp trên) và Tướng Habergram (cấp dưới) (p000412, p000413, p000416, p000417, p000423, p000432, p000434, p000437, p000438): Đệ nhất Lãnh chúa Hải quân gọi Habergram là `Tướng`, tự xưng `tôi` và gọi đối phương là `ông` (p000412, đã sửa theo V1 để giữ đúng chiều thứ bậc với p000413–p000414); Tướng Habergram thưa `Thưa ngài`, tự xưng `tôi` / `Tôi` kèm đại từ phản thân `mình` (p000413, p000423); cả hai dùng `chúng ta` / `Chúng ta` khi chỉ phía Khối Thịnh vượng chung (p000416, p000434, p000437, p000438)."
  alternatives_vi:
  - Thưa Tướng quân, mong ngài... (thay cho `Tướng, tôi tin ông...` tại part0018/p000412 — bắt buộc giữ `Tướng, tôi tin ông có thể nói ngắn gọn.` theo bản sửa V1 đã nghiệm thu vì p000414 xác nhận Đệ nhất Lãnh chúa Hải quân là cấp trên của người báo cáo nên không được dùng `Thưa` / `ngài` làm đảo ngược thứ bậc với lời đáp `Thưa ngài` của Habergram ở p000413) / phía bên kia (thay cho `phía tàu` tại part0018/p000430 — bắt buộc giữ `phía tàu` theo bản sửa V3 đã nghiệm thu để tránh hiểu nhầm thành phía Đế quốc)
