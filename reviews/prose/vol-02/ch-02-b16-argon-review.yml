  proposed_vi: "Trong phân cảnh Tanya khích lệ tinh thần chiến đấu của Tiểu đoàn Pháp sư Không quân 203, liên tưởng đến Tsuji cùng các ẩn dụ công sở – tài chính và phái các đại đội xuất kích (part0014/p000417–p000444): tuân thủ nghiêm ngặt `DEC-P01-001`, trong toàn bộ mạch độc thoại nội tâm trực tiếp (p000417–p000419, p000421, p000422, p000424–p000426, p000429–p000434, p000436–p000440, p000442), Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` nhất quán và dùng ngôi thứ nhất số nhiều bao gộp `chúng ta` khi xét hình ảnh chung của đơn vị (p000417, p000439); dùng cấu trúc khái quát lược đại từ cho đại từ ngôi thứ hai phiếm chỉ ở p000425 (`Điều có thể rút ra là…`, `sự nghiệp sau này`); quy chiếu Tsuji theo đúng sắc thái phê phán trong nội tâm của Tanya bằng `tên Tsuji to mồm kia` / `Tsuji` và các đại từ `Hắn` / `hắn` / `gã đó` / `gã kia` (p000419, p000421, p000422, p000424); quy chiếu quân địch (`Liên minh Entente` và `Cộng hòa`) bằng `chúng` / `Chúng` kết hợp đại từ phản thân `mình` (p000420, p000435, p000436, p000438) và `họ` khi xét bình diện quốc gia hoặc đối tượng tiếp nhận người đào ngũ (p000432, p000437). Trong mệnh lệnh và lời hiệu triệu qua vô tuyến (p000420, p000423, p000427, p000428, p000435, p000438, p000441, p000443, p000444): Tanya tự xưng `tôi` / `Tôi` (p000420, p000423), dùng `chúng ta` / `Chúng ta` khi bao gộp toàn tiểu đoàn (p000423, p000438), dùng `Chúng tôi` (ngôi thứ nhất số nhiều loại trừ, chỉ Tanya và Đại đội Bốn vòng ra đánh bọc hậu) khi tách hướng tiến công với `Đại đội Một, Hai và Ba` ở p000441, gọi các đại đội trưởng và thuộc cấp là `các anh` (p000420, đồng bộ với p000398 ở b15), `các quý ông` (p000428, đồng bộ trực tiếp với lời mở đầu `thưa các quý ông…` ở p000415 cuối b15) và `tất cả` (p000444); bốn đại đội đồng thanh đáp bốn lớp ngoặc kép `““““Rõ!””””` ở p000427, và ba đại đội tiên phong đồng thanh đáp ba lớp ngoặc kép `“““Rõ! Vì vinh quang của Tổ quốc và chỉ huy của chúng ta!”””` ở p000443"
  alternatives_vi:
  - Các vị (thay cho `các anh` tại part0014/p000420 và `các quý ông` tại part0014/p000428 — ghi nhận phương án trung tính `Các vị` trong `vol02-ch02-b16-gentlemen-address`, nhưng khóa giữ `các anh` ở p000420 và `các quý ông` ở p000428 theo bản dịch đã ký duyệt tại `reviews/prose/vol-02/ch-02-b16-fixes-signoff-claude.md` để nối mạch liền lạc tuyệt đối với `các anh` ở p000398 và `thưa các quý ông…` ở p000415 của `ch-02-b15`) / Chúng ta (thay cho `Chúng tôi` tại part0014/p000441 — ưu tiên giữ `Chúng tôi` vì câu lệnh phân tách rõ nhiệm vụ của `Đại đội Một, Hai và Ba` tiến lên chính diện với mũi vu hồi đánh từ phía sau của Tanya và Đại đội Bốn đã giao ở p000406, p000413 thuộc b15)
