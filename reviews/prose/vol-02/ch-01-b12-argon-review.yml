  proposed_vi: "Thiếu úy Serebryakov, luật chiến tranh (part0010/p000299, p000313, p000318, p000321) / các nhà nhân đạo, kinh nghiệm lập pháp (part0010/p000300) / thường dân, ném bom bừa bãi (part0010/p000301) / Thiếu tá (part0010/p000303, p000306) / nhà máy vũ khí, thông báo sơ tán, kênh báo nguy quốc tế (part0010/p000304, p000305, p000324) / cơ sở quân sự, đạn dược, ngài Molotov⁴, giỏ bánh mì (part0010/p000305) / yếu tố bất ngờ (part0010/p000306) / Trung úy Weiss (part0010/p000307) / luật pháp quốc tế, các sĩ quan cấp dưới (part0010/p000308) / mục tiêu quân sự, chỉ huy tiểu đoàn, Thiếu tá Tanya von Degurechaff (part0010/p000311) / những người lính Đế quốc (part0010/p000312) / Serebryakov, Thiếu tá von Degurechaff, chuyên gia (part0010/p000315, p000316, p000318) / Weiss (part0010/p000316) / chỉ huy (part0010/p000318) / Thiếu úy (part0010/p000320) / luật quốc tế, chết trên thực tế (part0010/p000321) / ống nghe, lời cánh báo (part0010/p000322) / thủ đô Dacia (part0010/p000323) / Quân đội Đế quốc, bắt đầuuu, cơ sở cung ứng quân sự (part0010/p000325) / mức độ phổ cập radio ở Dacia (part0010/p000326)"
  alternatives_vi:
  - Thiếu úy Weiss (thay cho `Trung úy Weiss` tại part0010/p000307 — bác bỏ `Thiếu úy Weiss`, ưu tiên giữ `Trung úy Weiss` và `Thiếu úy Serebryakov` theo `provisional_review_choices.first_lieutenant_map` đã sửa và signoff trong `handoffs/vol-02/ch-01-b12.yml` để đồng bộ tuyệt đối với thang quân hàm đã khóa ở B02, B06, B08, B09, B10, B11) / kênh cấp cứu quốc tế hoặc kênh cứu nạn quốc tế (thay cho `kênh báo nguy quốc tế` tại part0010/p000304, p000324 — ưu tiên giữ `kênh báo nguy quốc tế` vì dịch sát nghĩa đen ít suy diễn nhất cho kênh vô tuyến phát thông báo sơ tán theo quy định và đã nhất quán giữa hai đoạn) / phát âm chuẩn không biến âm (thay cho `lời cánh báo` tại part0010/p000322 và `bắt đầuuu` tại part0010/p000325 — bác bỏ theo style guide và `provisional_review_choices.childish_speech` đã signoff nhằm bảo toàn chi tiết cố ý nói ngọng/kéo giọng trẻ con ở từ chính của thông báo)
