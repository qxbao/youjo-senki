  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, nhân vật, cấp bậc và thuật ngữ quân sự – pháp lý đã khóa tạm từ Tập 1 cùng B01–B11 của Tập 2 (`Thiếu úy Serebryakov`, `Trung úy Weiss`, `chỉ huy tiểu đoàn`, `Thiếu tá Tanya von Degurechaff`, `Thiếu tá von Degurechaff`, `Thiếu tá`, `Quân đội Đế quốc`, `luật chiến tranh`, `luật pháp quốc tế` / `luật quốc tế`, `nhà máy vũ khí`, `đạn dược`, `thủ đô Dacia`, `Dacia`), đồng thời khóa tạm các thuật ngữ thông tin liên lạc, điển cố lịch sử và biến âm giọng trẻ con trong B12 (`kênh báo nguy quốc tế`, `thông báo sơ tán`, `ngài Molotov⁴`, `giỏ bánh mì`, `chết trên thực tế`, `lời cánh báo`, `bắt đầuuu`, `cơ sở cung ứng quân sự`, `mức độ phổ cập radio`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_serebryakov_evacuation_warning_pronouns_and_address_vol02_ch01_b12
  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` (hoặc `chính nó`) kết hợp tên riêng `Tanya` / `Thiếu tá von Degurechaff` và đại từ phản thân `mình` ở mệnh đề phụ thuộc (part0010/p000308, p000312, p000315–p000318, p000322, p000324), tuyệt đối không dùng `cô` cho Tanya theo DEC-P01-001; trong độc thoại nội tâm ngôi thứ nhất số ít (part0010/p000311, p000312, p000318, p000319, p000321), Tanya tự quy chiếu bằng `mình` / `Mình` xuyên suốt theo DEC-P01-001, dùng `chúng ta` khi bàn về khuôn khổ áp dụng luật chiến tranh đối với đơn vị (p000302) và dùng `Tôi` trong câu giải thích giả định dự kiến nói với người khác (p000318); quy chiếu tập thể các sĩ quan cấp dưới và phía Dacia bằng `họ` (p000305, p000308, p000311, p000312, p000318); trong đối thoại quân sự tại mục tiêu (part0010/p000299, p000303, p000304, p000306, p000307, p000309, p000313, p000314, p000320): Tanya tự xưng `tôi` / `Tôi` (p000320), dùng `chúng ta` khi bao hàm toàn đơn vị (p000299, p000304), gọi trực tiếp cấp dưới bằng cấp bậc và tên `Thiếu úy Serebryakov` / `Thiếu úy` (p000299, p000313, p000320) và `Trung úy Weiss` kèm lược đại từ ngôi thứ hai ở vế sau (p000307) theo `provisional_review_choices.lieutenants_address` đã signoff để tránh gán đại từ mang giới tính khi đoạn thoại không nêu; Serebryakov và Weiss tự xưng `tôi` / `*Tôi*` (p000303, p000314), dùng `ta` / `Chúng ta` khi nói về đơn vị (p000306, p000309), và gọi Tanya là `thưa Thiếu tá` / `Thiếu tá` (p000303, p000306); trong lời phát thanh cảnh báo chính thức trên sóng vô tuyến (part0010/p000325), Tanya đại diện Quân đội Đế quốc tự xưng `Chúng tôi`"
  alternatives_vi:
  - cô (thay cho lược chủ ngữ tại part0010/p000307 và thay cho `Thiếu úy` tại part0010/p000320 — bác bỏ theo DEC-P01-001 và M2 đã sửa trong signoff vì nguồn ở p000307 không có căn cứ giới tính cho Weiss và quy ước đối thoại cấp trên – cấp dưới của Tanya gọi theo cấp bậc `Trung úy Weiss` / `Thiếu úy`)
