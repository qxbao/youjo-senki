    modality_and_logic: "Giữ sự đồng tình của trọng tài với Tanya dựa trên trải nghiệm trực tiếp đi cùng đợt xung phong, sự đối lập với hy vọng của phần lớn sĩ quan, và phép so sánh ví von (`hỏa lực phòng không hiện tại của chúng ta hữu dụng chẳng khác gì một đống pháo tép`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Vị trọng tài`, `Thiếu tá von Degurechaff`, `đợt xung phong`, `tuyến hỏa lực`, `hỏa lực phòng không`, hình ảnh `một đống pháo tép` và hệ đại từ `Tôi` / `chúng ta` – `cô ấy` / `ông`."

