      - "nó / Tanya (thay cho `Cô` / `cô` trong trần thuật ngôi thứ ba tại p000509, p000516, p000517, p000519, p000525, p000526, p000528 nếu điều phối viên quyết định áp dụng mở rộng DEC-P01-001 cho toàn bộ Tập 2 — hiện giữ nguyên theo bản dịch đã signoff của b28)"
