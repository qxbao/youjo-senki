    modality_and_logic: "Giữ sắc thái thông tin nghe nói (`vốn được cho là có hỏa lực phòng không mạnh`), phủ định mức độ (`không thể hoàn toàn ngăn chặn`) và tiền đề của phương thức tấn công (`với giả định rằng sẽ không trở về`); không tự chèn thuật ngữ lịch sử ngoài văn bản nguồn."
    emphasis: "Khóa chính xác hai vùng chữ nghiêng tách biệt `*Hơn nữa*` và `*ngay cả ... sẽ không trở về.*`, để cụm dẫn `Tanya thầm nghĩ` nằm ngoài dấu `*...*` theo DEC-P01-002 (F06)."
    locks:
