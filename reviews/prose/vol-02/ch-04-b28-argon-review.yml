  - id: vol02-ch04-b28-ranks-pronouns-pov-and-emphasis
    source_term: "Major von Degurechaff (`Thiếu tá von Degurechaff` / `thiếu tá`), Captain Grän (`Thuyền trưởng Grän`), Tanya third-person narration (`Tanya` / `Cô` / `cô` / reflexive `mình`), referee and navy officers third-person narration (`ông` / `họ`), conference dialogue pronouns (`tôi` / `chúng ta` / `ta` – `cô` / `ông` – `cô ấy`), and italicized emphases (p000502, p000503, p000504, p000508, p000512, p000527)"
    proposed_vi: "Kế thừa đồng bộ danh xưng quân hàm/chức vụ `Thiếu tá von Degurechaff` (p000511; viết thường `một thiếu tá` khi dùng như danh từ chung tại p000510) và `Thuyền trưởng Grän` (p000523 — đồng bộ quyết định B27-05 tại b27, không tự suy diễn quân hàm hải quân); trong lời kể ngôi thứ ba của lô này, giữ lựa chọn tạm đã qua signoff là dùng tên riêng `Tanya` (p000502, p000509, p000511, p000516, p000519, p000525) kết hợp đại từ `Cô` / `cô` và đại từ phản thân `mình` / `chính mình` (p000509, p000516, p000517, p000519, p000525, p000526, p000528; ghi nhận phương án đồng bộ liên lô theo DEC-P01-001 là dùng `nó` hoặc lặp tên `Tanya` trong trần thuật ở `alternatives_vi`); lưu ý từ `nó` trong lời thoại tại p000509 chỉ quy chiếu danh từ bất động vật là hỏa lực phòng không của tàu *Basel*; quy chiếu viên sĩ quan hải quân nêu câu hỏi (p000505) và vị trọng tài phụ trách phía tấn công (p000511) bằng đại từ trang trọng trung tính `ông`, quy chiếu tập thể các sĩ quan Bộ Tư lệnh Hạm đội Biển Bắc bằng `họ` / `Họ` kết hợp phản thân `mình` (p000508, p000510, p000512, p000526); trong lời thoại công vụ tại cuộc họp tổng kết, người nói tự xưng `Tôi` / `tôi` ở ngôi thứ nhất số ít (p000511, p000513, p000515, p000519, p000522, p000525) và dùng `chúng ta` / `Chúng ta` (p000503, p000511, p000512, p000513, p000515, p000522, p000525) hoặc `ta` (Thuyền trưởng Grän tại p000524) ở ngôi thứ nhất số nhiều chỉ phía Đế quốc / hải quân; khi hỏi trực tiếp Tanya tại p000518 dùng đại từ ngôi thứ hai `cô`, khi hỏi Thuyền trưởng Grän tại p000523 gọi `Thuyền trưởng Grän` và dùng `ông`, và khi vị trọng tài nhắc tới Tanya ở ngôi thứ ba tại p000511 gọi `Thiếu tá von Degurechaff` và `cô ấy`; bảo toàn chính xác mọi phạm vi chữ nghiêng `*...*` theo DEC-P01-002 (F06, F07) tại p000502, p000503, p000504, p000508, p000512 và p000527"
