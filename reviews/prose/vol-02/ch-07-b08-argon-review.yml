      rear guard: đội hậu vệ
      shield: tấm lá chắn (chỉ đội tiên phong)
    chronology_and_modality: giữ nhận định mọi việc diễn ra quá dễ dàng và mốc thời gian đã quá muộn khi đội hậu vệ mất lá chắn mới tìm cách rút lui
  - segment_id: YS-LN02/Text/part0032.xhtml/p000190
    terms:
      The Republicans: Quân Cộng hòa
      imperial mages: các pháp sư Đế quốc (không dùng từ miệt thị `những kẻ`)
    negation_and_modality: giữ phủ định kép về khoảng cách lẫn tốc độ (`không có đủ khoảng cách lẫn tốc độ`) trước đối phương đã tăng tốc tấn công
  - segment_id: YS-LN02/Text/part0032.xhtml/p000191
    terms:
      theater: chiến trường (hoặc khu vực tác chiến)
      Third Mage Battalion of the Republican Army’s Twenty-Second Division: Tiểu đoàn Pháp sư số Ba thuộc Sư đoàn số Hai mươi Hai của Lục quân Cộng hòa (hoặc Tiểu đoàn Pháp sư số 3 thuộc Sư đoàn 22 của Lục quân Cộng hòa)
    negation_and_modality: giữ kết cục cuộc chạy thoát bất thành và tuyên bố xóa sổ hoàn toàn tiểu đoàn pháp sư Cộng hòa
  - segment_id: YS-LN02/Text/part0032.xhtml/p000192
    terms:
      initial explosion formula: thuật thức phát nổ ban đầu (hoặc công thức phát nổ ban đầu; không dịch thành `vụ nổ công thức`)
    modality_and_logic: giữ sắc thái trớ trêu (`Mỉa mai thay`) rằng những người duy nhất sống sót lại là vài người bị đánh gục ngay từ đòn thuật thức phát nổ đầu tiên
  - segment_id: YS-LN02/Text/part0032.xhtml/p000193
    terms:
      Republican Army: Lục quân Cộng hòa
      the Rhine general headquarters’ select mage battalion: tiểu đoàn pháp sư tinh nhuệ của Tổng hành dinh Rhine
      supply depots: kho tiếp tế
      Republican Army Command: Bộ chỉ huy Lục quân Cộng hòa
      invading battalion: tiểu đoàn xâm nhập
    negation_and_modality: giữ quan hệ đối lập (`nhưng... Trái lại...`) giữa việc điều động tiểu đoàn tinh nhuệ thất bại trong truy tìm với việc để đối phương đốt phá kho tiếp tế và thu hút toàn bộ sự chú ý của Bộ chỉ huy
  - segment_id: YS-LN02/Text/part0032.xhtml/p000194
    terms:
      major offensive: cuộc tiến công quy mô lớn
      Arene: Arene
    modality_and_logic: giữ cấu trúc hai cụm danh từ độc lập về tin đồn tiến công lớn và lời xì xào quanh số phận Arene
  - segment_id: YS-LN02/Text/part0032.xhtml/p000195
    emphasis: bọc toàn bộ câu trong `*...*` theo `DEC-P01-002`
    modality_and_logic: giữ nguyên thông điệp tuyên truyền ca ngợi sự chiến đấu dũng cảm đến người cuối cùng
  - segment_id: YS-LN02/Text/part0032.xhtml/p000196
    terms:
      the Republic: Cộng hòa
    emphasis: chỉ bọc câu thứ hai trong `*...*` theo `DEC-P01-002`; không đánh dấu câu đầu
    negation_and_modality: giữ tác động thuyết phục của tuyên truyền ở câu đầu và lời kêu gọi phủ định ở câu hai (`*Không thể để cái chết của họ trở nên vô ích.*` hoặc `*Chúng ta không thể để cái chết của họ trở nên vô ích.*`)
  - segment_id: YS-LN02/Text/part0032.xhtml/p000197
    terms:
      Imperial Army: Lục quân Đế quốc
      the Empire: Đế quốc
      supply lines: các tuyến tiếp tế
      military maneuvers: cơ động quân sự
    modality_and_logic: giữ sự nhượng bộ (`tuy khá dễ khắc phục đối với Đế quốc, nhưng đòn giáng ấy vẫn khiến họ đau điếng`) và quyết định dứt khoát dùng cơ động quân sự để thoát khỏi tình thế tồi tệ
  - segment_id: YS-LN02/Text/part0032.xhtml/p000198
    terms:
      the front: tiền tuyến
      the Empire: Đế quốc
    modality_and_logic: giữ cấu trúc mục đích song hành (`Để bảo vệ tiền tuyến, để bảo vệ Đế quốc.` hoặc `Bảo vệ tiền tuyến, bảo vệ Đế quốc.`)
  - segment_id: YS-LN02/Text/part0032.xhtml/p000199
    terms:
      the Empire: Đế quốc
      supply lines: những tuyến tiếp tế
      the Republic: Cộng hòa
    emphasis: chỉ bọc mệnh đề suy nghĩ ở câu đầu trong `*...*` theo `DEC-P01-002`
    modality_and_logic: giữ tâm lý chán ngán chung của cả hai nước và góc nhìn trái ngược của Đế quốc (bế tắc) với Cộng hòa (hy vọng) trước các tuyến tiếp tế thiếu tin cậy
  - segment_id: YS-LN02/Text/part0032.xhtml/p000200
    terms:
      Imperial Army: Lục quân Đế quốc
      the Empire: Đế quốc
      Imperial Army General Staff: Bộ Tổng tham mưu Lục quân Đế quốc
      partisans: đám du kích (hoặc quân du kích)
    emphasis: chỉ bọc mệnh đề nhận định sau dấu hai chấm ở câu đầu trong `*...*` theo `DEC-P01-002`
    negation_and_modality: giữ nhận định phủ định trong phần nhấn mạnh, sự xác nhận tuyệt đối ở câu hai, và kết luận của Bộ Tổng tham mưu rằng việc duy trì một tiền tuyến không mục đích là chẳng đáng công
  - segment_id: YS-LN02/Text/part0032.xhtml/p000201
    terms:
      the Republic: Cộng hòa
      the Empire: Đế quốc
      major offensives: những cuộc tiến công quy mô lớn
      Dacia: Dacia
      Norden: Norden
    modality_and_logic: giữ nghịch lý thực tế khách quan lại nuôi dưỡng ngộ nhận của Cộng hòa dựa trên tiền lệ ở Dacia và Norden
  - segment_id: YS-LN02/Text/part0032.xhtml/p000202
    terms:
      the delaying: hoạt động tác chiến trì hoãn (hoặc giai đoạn đánh trì hoãn)
      the Empire: Đế quốc
    modality_and_logic: giữ ngoại lệ giai đoạn đầu cuộc chiến và sự khẳng định lặp lại về việc bảo vệ lãnh thổ của chính mình
  - segment_id: YS-LN02/Text/part0032.xhtml/p000203
    terms:
      the Republicans: người Cộng hòa
      officers of the Republican Army: các sĩ quan Lục quân Cộng hòa
      fatherland: tổ quốc
    emphasis: bọc chính xác câu đầu tiên và câu hỏi cuối đoạn trong `*...*` theo `DEC-P01-002`; phần dẫn giữa đoạn để thường
    negation_and_modality: giữ phủ định tuyệt đối ở câu đầu, sự đối chiếu giữa niềm tin một chiều và chân lý hiển nhiên trong mắt sĩ quan Cộng hòa, cùng câu hỏi tu từ ở cuối đoạn
  - segment_id: YS-LN02/Text/part0032.xhtml/p000204
    terms:
      Imperial Army General Staff war machine: cỗ máy chiến tranh Bộ Tổng tham mưu Lục quân Đế quốc
      Republican soldiers: binh sĩ Cộng hòa
    modality_and_logic: giữ mức độ đọc sai hoàn toàn đến nực cười và nhận định có tính dè dặt (`Có lẽ có thể nói rằng...`) về việc binh sĩ Cộng hòa mắc kẹt trong cảm xúc của chính mình
  - segment_id: YS-LN02/Text/part0032.xhtml/p000205
    terms:
      Imperial Army: Lục quân Đế quốc
      Republican Army: Lục quân Cộng hòa
      abandoning the front: từ bỏ tiền tuyến (hoặc rút bỏ tiền tuyến)
    negation_and_modality: giữ kết quả Lục quân Đế quốc từ bỏ tiền tuyến thành công mà Lục quân Cộng hòa không hề hay biết
  - segment_id: YS-LN02/Text/part0032.xhtml/p000206
    terms:
      the Empire: Đế quốc
    chronology_and_modality: giữ lời chuyển mạch của người kể sang phần trình bày về mầm mống chiến thắng của Đế quốc
  - segment_id: YS-LN02/Text/part0032.xhtml/p000207
    terms:
      recon-in-force: trinh sát chiến đấu
    modality_and_logic: giữ đúng quan hệ đối chọi/đánh đổi (`versus`) giữa thương vong cao và nhu cầu chiến thuật khi tiến hành trinh sát chiến đấu vào các vị trí phòng thủ nghiêm ngặt
term_recommendations:
  - source_term: formula bullets / explosion formula / optical shot formulas
    recommended_vi: đạn thuật thức / thuật thức phát nổ / thuật thức bắn quang học
    alternatives_vi:
      - đạn công thức / công thức phát nổ / công thức bắn quang học
      - đạn thuật thức / thuật thức nổ / thuật thức xạ kích quang học
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000180
      - YS-LN02/Text/part0032.xhtml/p000182
      - YS-LN02/Text/part0032.xhtml/p000192
    rationale: >-
      Thống nhất một gốc dịch cho `formula` xuyên suốt cả ba đoạn (`p000180`, `p000182`,
      `p000192`) và giữ đúng danh từ chính tại `p000192` (không đảo thành `vụ nổ công thức`).
      Ưu tiên `thuật thức` để khớp với đề xuất tạm trong các chương trước và sắc thái kỹ
      thuật ma thuật quân sự; `công thức` là phương án thay thế literal nếu áp dụng đồng bộ.
    uncertainty: medium
    status: pending
    non_canon: true
  - source_term: vanguard / rear guard
    recommended_vi: đội tiên phong / đội hậu vệ
    alternatives_vi:
      - bộ phận tiền vệ / bộ phận hậu vệ
      - toán đi đầu / toán bọc hậu
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000182
      - YS-LN02/Text/part0032.xhtml/p000183
      - YS-LN02/Text/part0032.xhtml/p000184
      - YS-LN02/Text/part0032.xhtml/p000186
      - YS-LN02/Text/part0032.xhtml/p000187
      - YS-LN02/Text/part0032.xhtml/p000189
    rationale: >-
      Kế thừa nhất quán lựa chọn tạm từ `p000179` (B07) cho hai bộ phận hai đại đội trước–sau
      của tiểu đoàn pháp sư Cộng hòa trong cùng trận đánh.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: Third Mage Battalion of the Republican Army’s Twenty-Second Division / Fairy Battalion
    recommended_vi: Tiểu đoàn Pháp sư số Ba thuộc Sư đoàn số Hai mươi Hai của Lục quân Cộng hòa / Tiểu đoàn Fairy
    alternatives_vi:
      - Tiểu đoàn Pháp sư số 3 thuộc Sư đoàn 22 của Lục quân Cộng hòa / Tiểu đoàn Fairy
      - Tiểu đoàn Pháp sư số Ba thuộc Sư đoàn Hai mươi Hai Lục quân Cộng hòa / Tiểu đoàn Tiên nữ
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000188
      - YS-LN02/Text/part0032.xhtml/p000191
    rationale: >-
      Giữ nguyên định danh `Fairy` theo tiền lệ mã gọi vô tuyến trong chương 7 (`Fairy 01`,
      `Fairy 08`) và dịch đầy đủ cấp biên chế của tiểu đoàn pháp sư Cộng hòa bị tiêu diệt.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: the Rhine general headquarters / Imperial Army General Staff
    recommended_vi: Tổng hành dinh Rhine / Bộ Tổng tham mưu Lục quân Đế quốc
    alternatives_vi:
      - Bộ tổng chỉ huy Rhine / Bộ Tổng tham mưu Quân đội Đế quốc
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000193
      - YS-LN02/Text/part0032.xhtml/p000200
      - YS-LN02/Text/part0032.xhtml/p000204
    rationale: >-
      Kế thừa nhất quán `Tổng hành dinh Rhine` từ B07 (trung tính, không tự thêm cấp Tập
      đoàn quân) và `Bộ Tổng tham mưu Lục quân Đế quốc` xuyên suốt chương 7.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: recon-in-force / disciplined fire
    recommended_vi: trinh sát chiến đấu / hỏa lực có kiểm soát
    alternatives_vi:
      - trinh sát bằng vũ lực / hỏa lực kỷ luật
      - trinh sát có vũ trang / khai hỏa có kiểm soát
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000187
      - YS-LN02/Text/part0032.xhtml/p000207
    rationale: >-
      Giữ tính liên tục thuật ngữ với các batch trước trong chương 7 (`B03`, `B06`, `B07`),
      phản ánh đúng bản chất tác chiến thăm dò bằng giao chiến thật và hỏa lực bắn có kiểm
      soát của quân Cộng hòa.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: Arene / Dacia / Norden
    recommended_vi: Arene / Dacia / Norden
    alternatives_vi: []
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000194
      - YS-LN02/Text/part0032.xhtml/p000201
    rationale: >-
      Giữ nguyên dạng viết Latin của các địa danh theo thông lệ hiện hành của dự án khi chưa
      có quyết định canon hóa khác.
    uncertainty: low
    status: pending
    non_canon: true
