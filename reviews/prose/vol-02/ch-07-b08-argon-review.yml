risks:
  - >-
    Đoạn p000181 cần đổi đại từ `chúng ta` về `chúng tôi` để giữ nhất quán điểm nhìn hồi cố
    ngôi thứ nhất của đơn vị Cộng hòa từ B07 trước khi chuyển sang trần thuật toàn cảnh ở
    p000182.
  - >-
    Đoạn p000192 cần sửa `vụ nổ công thức ban đầu` về đúng danh từ trung tâm (`thuật thức
    phát nổ ban đầu` hoặc `công thức phát nổ ban đầu`) và đồng bộ với p000180, p000182.
  - >-
    Đoạn p000207 cần sửa liên từ `hay` thành quan hệ đối chọi/đánh đổi giữa thương vong cao
    và nhu cầu chiến thuật để không làm lệch bản chất thế tiến thoái lưỡng nan.
