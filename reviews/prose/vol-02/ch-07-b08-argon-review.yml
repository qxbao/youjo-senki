findings:
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000181
    category: pronoun_and_viewpoint
    issue: >-
      Đoạn `p000181` vẫn thuộc lời kể hồi cố ngôi thứ nhất số nhiều của pháp sư đánh chặn
      Cộng hòa nối tiếp trực tiếp từ cuối B07 (`p000153`–`p000179`), không phải lời thoại
      trực tiếp hay khẩu hiệu tuyên truyền, nhưng bản dịch lại đổi đại từ chủ ngữ sang
      `chúng ta` (`chúng ta đã mắc bẫy`), làm lệch điểm nhìn trần thuật và kéo cả người
      đọc vào ngôi gộp.
    evidence: >-
      Câu không có dấu ngoặc kép hay thẻ nhấn mạnh `<html:em>`, nối trực tiếp mạch đánh giá
      thất bại của đơn vị người kể sau giả định hồi cố ở `p000179`–`p000180` trước khi
      chuyển sang trần thuật toàn cảnh ngôi thứ ba từ `p000182`.
    recommendation: >-
      Đổi `chúng ta` về `chúng tôi` để khớp điểm nhìn với B07 (ví dụ: `Tình hình xấu đi—chúng
      tôi đã bị chơi xỏ, và chẳng còn cách nào ngăn máu đổ hay thiệt hại xảy ra.` hoặc
      `chúng tôi đã mắc bẫy...`).
    resolution: unresolved
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000192
    category: terminology_and_head_noun
    issue: >-
      Cụm `the initial explosion formula` tại `p000192` bị dịch đảo danh từ chính thành
      `vụ nổ công thức ban đầu` (biến thuật thức/công thức phép thành "vụ nổ công thức"),
      đồng thời thiếu nhất quán với `p000182` (`Công thức phát nổ`), `p000180` (`đạn công
      thức`) và mục đề xuất trong sổ pending của chính B08 (`công thức nổ / đạn thuật thức`).
    evidence: >-
      Đối chiếu `formula bullets` (`p000180`), `explosion formula` / `optical shot formulas`
      (`p000182`) và `initial explosion formula` (`p000192`) cùng mục
      `chapter7_b08_translator_proposals` trong `work/run-state/pending-terms.yml`.
    recommendation: >-
      Giữ đúng danh từ trung tâm là `thuật thức` (hoặc `công thức`) và thống nhất xuyên suốt
      cả 3 đoạn `p000180`, `p000182`, `p000192`. Khuyến nghị dùng hệ `thuật thức`: `đạn
      thuật thức` (`p000180`), `Thuật thức phát nổ` / `thuật thức bắn quang học` (`p000182`),
      và `bị quật ngã bởi thuật thức phát nổ ban đầu` (`p000192`); nếu giữ `công thức` thì
      sửa `p000192` thành `bị quật ngã bởi công thức phát nổ ban đầu`.
    resolution: unresolved
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000207
    category: meaning_and_logic
    issue: >-
      Ở câu thứ hai, quan hệ đối lập/đánh đổi (`versus`) giữa thương vong cao và yêu cầu
      chiến thuật bị dịch bằng liên từ lựa chọn `hay` (`thương vong cao hay nhu cầu chiến
      thuật`), làm biến chất thế tiến thoái lưỡng nan thành việc chọn một trong hai vế rời
      nhau, trong khi bản chất bài toán là muốn đáp ứng nhu cầu chiến thuật thì phải gánh
      thương vong cao. Ngoài ra, câu đầu tự thêm tình thái bắt buộc `phải` (`thực tế phải
      tiến hành`) không có trong danh ngữ nguồn.
    evidence: >-
      Cấu trúc danh ngữ câu đầu và quan hệ `versus` nêu hai mặt xung đột trực tiếp của bài
      toán trinh sát chiến đấu vào các vị trí phòng thủ dày đặc tại `p000207`.
    recommendation: >-
      Bỏ `phải` ở câu đầu và diễn đạt rõ thế giằng co/đối chọi ở câu hai, ví dụ: `Mọi
      chuyện bắt đầu từ thực tế của việc tiến hành trinh sát chiến đấu vào những vị trí
      được phòng thủ nghiêm ngặt. Thế tiến thoái lưỡng nan vô cùng nghiêm trọng: một bên
      là thương vong cao, một bên là nhu cầu chiến thuật.` (hoặc `sự đối chọi giữa thương
      vong cao và yêu cầu chiến thuật`).
    resolution: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000183
    category: modality_and_meaning
    issue: >-
      Cụm chêm `if only barely` bổ nghĩa cho khả năng kháng cự có tổ chức mang sắc thái
      gượng gạo, chật vật lắm mới duy trì được, nhưng dịch là `dù chỉ vừa đủ` lại gợi nghĩa
      đạt mức đủ dùng. Ở câu sau, `cover the gap in the vanguard` bằng hỏa lực áp chế là
      bắn bọc lót/che chắn cho khoảng trống, khác với hành động lấp kín lỗ hổng ở `p000184`.
    evidence: >-
      Đối chiếu `if only barely` + `cover the gap` (`p000183`) với `cover for the vanguard
      to plug up that hole` (`p000184`).
    recommendation: >-
      Sửa thành `Tuy vậy, quân Cộng hòa vẫn có thể kháng cự có tổ chức, dù hết sức chật
      vật. Đội hậu vệ bắt đầu bắn áp chế; họ biết mình phải bọc lót cho khoảng trống ở đội
      tiên phong.`
    resolution: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000190
    category: register_and_tone
    issue: >-
      Từ `p000182` mạch truyện đã chuyển sang điểm nhìn trần thuật ngôi thứ ba khách quan,
      nhưng mệnh đề quan hệ chỉ các pháp sư Đế quốc ở `p000190` lại dùng từ chỉ loại mang
      sắc thái miệt thị `những kẻ` (`những kẻ đã tăng tốc để tấn công`), chưa sát quy tắc
      không tự thêm sắc thái phán xét/miệt thị trong `canon/style-guide.md`.
    evidence: >-
      Đoạn `p000190` đặt song song `The Republicans` và `the imperial mages` ở ngôi thứ ba
      trung tính.
    recommendation: >-
      Đổi `những kẻ đã tăng tốc để tấn công` thành cách diễn đạt trung tính như `vốn đã
      tăng tốc để tấn công` (hoặc `khi đối phương đã tăng tốc để tấn công`).
    resolution: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000204
    category: meaning_clarity
    issue: >-
      Cụm đồng vị `the Imperial Army General Staff war machine’s intentions` ví chính Bộ
      Tổng tham mưu Lục quân Đế quốc như một cỗ máy chiến tranh duy lý (đối lập với binh sĩ
      Cộng hòa bị giam cầm trong cảm xúc ở câu sau), nhưng bản dịch dùng `thuộc` (`cỗ máy
      chiến tranh thuộc Bộ Tổng tham mưu Lục quân Đế quốc`) làm đổi quan hệ đồng vị thành
      quan hệ sở hữu/trực thuộc.
    evidence: >-
      Thứ tự danh từ ghép đồng vị ở câu đầu và phép đối lập trực tiếp với `trapped in their
      own emotions` ở câu thứ hai của `p000204`.
    recommendation: >-
      Sửa thành `ý đồ của cỗ máy chiến tranh Bộ Tổng tham mưu Lục quân Đế quốc` (hoặc `cỗ
      máy chiến tranh mang tên Bộ Tổng tham mưu Lục quân Đế quốc`).
    resolution: unresolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000205
    category: meaning_nuance
    issue: >-
      Động từ `abandoning` trong `abandoning the front` mang sắc thái chủ động từ bỏ/vứt bỏ
      tiền tuyến (kết nối trực tiếp với nhận định tiền tuyến vô mục đích ở `p000200` và
      niềm tin không ai từ bỏ lãnh thổ ở `p000203`), nhưng dịch là `rút khỏi tiền tuyến`
      làm nhẹ mất sắc thái từ bỏ dứt khoát này.
    evidence: >-
      Mạch lập luận từ `p000200` đến `p000205` xoay quanh quyết định vứt bỏ tiền tuyến hao
      tổn của Bộ Tổng tham mưu Đế quốc.
    recommendation: >-
      Đổi `rút khỏi tiền tuyến thành công` thành `từ bỏ tiền tuyến thành công` (hoặc `rút
      bỏ tiền tuyến thành công`).
    resolution: unresolved
