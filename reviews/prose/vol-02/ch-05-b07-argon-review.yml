  - segment_id: YS-LN02/Text/part0026.xhtml/p000163
    terms:
      - "quân đội Đế quốc (The imperial military)"
      - "sĩ quan và binh lính (officers and men)"
      - "công dân gương mẫu (model citizens)"
      - "binh nhì (privates)"
    pronouns_and_address: []
    pov_and_voice: "Phân tích chuẩn mực đạo đức trong quân đội Đế quốc."
    modality_and_logic: "Giữ phạm vi áp dụng toàn diện của kỳ vọng làm công dân gương mẫu từ sĩ quan cho tới binh nhì cấp thấp nhất."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000164
    terms:
      - "những sĩ quan có danh dự (honorable officers)"
      - "thời bình (peacetime)"
      - "năng lực quân nhân (caliber as a soldier)"
      - "giới chức quân đội (the military authorities)"
      - "tòa án binh (a court-martial)"
    pronouns_and_address:
      - "Quy chiếu các sĩ quan bằng `họ`, giới chức quân đội bằng `họ`, và dùng đại từ phiếm chỉ `anh` cho người vi phạm quy tắc."
    pov_and_voice: "Phân tích kỷ luật thời bình và sự cứng nhắc của giới chức quân sự."
    modality_and_logic: "Khóa cụm từ đã sửa theo B07-03 (`những sĩ quan có danh dự`) và thuật ngữ tạm `tòa án binh` (`vol02-ch05-b07-court-martial`); giữ phép so sánh mức độ quan trọng trong thời bình và hệ quả chỉ cần phạm một quy tắc là có tòa án binh chờ sẵn."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000165
    terms:
      - "sĩ quan quân đội (military officers)"
      - "bị đưa ra tòa án binh (being court-martialed)"
      - "thời bình (peacetime)"
    pronouns_and_address: []
    pov_and_voice: "Nhận định chuyển dịch thời cuộc từ thời bình sang thời chiến."
    modality_and_logic: "Khóa cách diễn đạt `bị đưa ra tòa án binh`, giữ bước ngoặt đối lập (`Nhưng đó là chuyện thời bình. Kỷ nguyên thanh bình, nơi người ta đặt danh dự lên hàng đầu và tôn thờ lý tưởng, đã qua rồi.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000166
    terms:
      - "chiến tranh (war)"
      - "tòa án binh (military courts)"
      - "nhiệm vụ (duty)"
    pronouns_and_address:
      - "Dùng `chúng ta` ở câu khẳng định tình trạng chiến tranh và đại từ phiếm chỉ `anh` ở câu sau."
    pov_and_voice: "Phân tích tiêu chuẩn xét xử trong thời chiến."
    modality_and_logic: "Khóa việc thống nhất dùng `tòa án binh` cho `military courts`, giữ trọng tâm xét xử thời chiến xoay quanh việc có kiên quyết hoàn thành nhiệm vụ hay không."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000167
    terms:
      - "logic quân đội (military logic)"
      - "sĩ quan (an officer)"
      - "thỏa thuận chính trị quốc tế (an international political deal)"
      - "luật pháp (legislation)"
    pronouns_and_address: []
    pov_and_voice: "Phân tích lập trường bảo vệ người thi hành công vụ của phía quân đội."
    modality_and_logic: "Giữ chuỗi nguyên nhân: theo logic quân đội, khó có thể làm ngơ việc một sĩ quan chỉ đang thi hành nhiệm vụ lại bị cuốn vào một thỏa thuận chính trị quốc tế bắt nguồn từ hệ thống luật pháp không được duy trì đúng mức."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000168
    terms:
      - "đối ngoại (foreign affairs)"
      - "sĩ quan cấp cao (high-ranking officers)"
      - "các nhà ngoại giao ( the diplomats)"
      - "vật tế thần (a scapegoat)"
      - "phòng xử (courtroom)"
    pronouns_and_address:
      - "Quy chiếu nhóm sĩ quan cấp cao và nhà ngoại giao bằng `họ`; trong lời phản bác trực tiếp dùng `Các người`."
    pov_and_voice: "Mô tả sự xung đột gay gắt giữa quan điểm chính trị đối ngoại và quan điểm bảo vệ quân nhân tại tòa."
    modality_and_logic: "Giữ thế giằng co giữa hai luồng quan điểm đối chọi khiến bầu không khí trong phòng xử căng như dây đàn."
    emphasis: "Khóa chính xác hai câu thoại in nghiêng `*“Xin hãy nghĩ đến chính trị!”*` và `*“Các người định biến một sĩ quan đã làm tròn nhiệm vụ thành vật tế thần sao?”*` khớp với hai thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000169
    terms:
      - "xét xử theo pháp luật (a trial according to law)"
    pronouns_and_address: []
    pov_and_voice: "Câu dẫn ngắn mang sắc thái châm biếm nhẹ trước khi tuyên án."
    modality_and_logic: "Giữ câu đúc kết chuyển ý sang phần đọc phán quyết (`Đó là lúc nguyên tắc xét xử theo pháp luật được vận dụng.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000170
    terms:
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
      - "không thụ lý vụ việc (dismissing your case)"
      - "chuyên gia pháp lý giữ vai trò thẩm phán (legal specialist acting as the judge)"
      - "phán quyết (the decision)"
      - "quân phục / thường phục (uniforms and suits)"
    pronouns_and_address:
      - "Thẩm phán xưng `tòa`, gọi Tanya là `Thiếu tá von Degurechaff` và `cô`."
    pov_and_voice: "Lời tuyên đọc phán quyết chính thức tại tòa và mô tả khung cảnh phòng xử."
    modality_and_logic: "Khóa câu phán quyết đã sửa theo B07-01 (`“Thiếu tá von Degurechaff, tòa quyết định không thụ lý vụ việc của cô.”`), giữ đúng bản chất thủ tục không thụ lý và không tự gán Tanya là người nộp đơn kiện, cùng hình ảnh ẩn dụ rừng gai từ ánh mắt của cả phe quân phục lẫn thường phục."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000171
    terms:
      - "không thụ lý vụ việc (throwing out my case)"
      - "thỏa hiệp (compromise)"
      - "bác yêu cầu (reject the claim)"
      - "phán quyết tư pháp (a judicial call)"
      - "tiêu chí để được thụ lý (the criteria to be considered)"
    pronouns_and_address:
      - "Độc thoại nội tâm của Tanya tự quy chiếu bằng `mình` (`vụ việc của mình`) theo DEC-P01-001; quy chiếu hội đồng xét xử bằng `Họ` / `họ`."
    pov_and_voice: "Độc thoại nội tâm phân tích thủ thuật pháp lý của tòa án."
    modality_and_logic: "Khóa bản sửa theo B07-02: phân biệt rõ hành động `*không thụ lý* vụ việc của mình` (né tránh đưa ra phán quyết tư pháp bằng lý do kỹ thuật rằng vụ việc không đáp ứng tiêu chí để được thụ lý) với việc `bác yêu cầu vì không có căn cứ`."
    emphasis: "Khóa chính xác cụm nhấn mạnh `*không thụ lý*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000172
    terms:
      - "thẩm phán xử quyền (acting judge)"
      - "người François (a Françoisman)"
      - "xứ Albion (Albion)"
      - "dung hòa (sublation)"
      - "gác vụ việc lại (shelving the case)"
    pronouns_and_address:
      - "Quy chiếu những người cầm trịch phiên tòa bằng `Họ`."
    pov_and_voice: "Bình luận châm biếm của Tanya về vẻ mặt vị thẩm phán và giải pháp giữ thể diện hai bên."
    modality_and_logic: "Khóa lựa chọn tạm `dung hòa` cho `sublation` (`vol02-ch05-b07-sublation`), giữ phép so sánh vẻ mặt như người François ăn món ngon nhất xứ Albion ba đêm liền và lời giải thích trực tiếp ở câu cuối (`Nói cách khác, lựa chọn duy nhất là gác vụ việc lại.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000173
    terms:
      - "tàu của quốc gia trung lập (the neutral country’s vessel)"
      - "tai nạn đáng tiếc (an unfortunate accident)"
    pronouns_and_address: []
    pov_and_voice: "Lời tuyên đọc bổ sung của vị thẩm phán tại tòa."
    modality_and_logic: "Giữ nguyên nhận định chính thức gọi vụ tấn công và đánh chìm tàu của quốc gia trung lập là một tai nạn đáng tiếc."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000174
    terms:
      - "phòng xử (the courtroom)"
      - "vị sĩ quan pháp lý chủ tọa (the presiding legal officer)"
    pronouns_and_address:
      - "Quy chiếu vị thẩm phán bằng `ông`."
    pov_and_voice: "Trần thuật phân tích mục đích chính trị – tâm lý của câu nói thêm."
    modality_and_logic: "Giữ ý nghĩa của việc chèn thêm câu cuối: bày tỏ sự lấy làm tiếc về vụ việc và làm dịu bớt cú sốc cho những người ngồi trong phòng xử."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000175
    terms:
      - "Tanya (Tanya)"
      - "sự dàn xếp (the reconciliation)"
      - "logic của tổ chức (the logic of the organization)"
      - "bị kỷ luật (being disciplined)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` (`mà nó đã dự liệu`, `Nó biết rằng`) theo đúng DEC-P01-001; quy chiếu người trung thành với tổ chức bằng `họ`."
    pov_and_voice: "Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya."
    modality_and_logic: "Khóa bản sửa đại từ theo B07-04 (`nó`), giữ điều kiện ngoại trừ (`người trung thành với logic của tổ chức sẽ không gặp nguy cơ bị kỷ luật, trừ khi họ làm điều gì đó gây tổn hại cho toàn thể`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000176
    terms:
      - "Bộ Ngoại giao (the Foreign Office)"
      - "quân đội (the army)"
      - "Tanya (Tanya)"
      - "hàng ghế khán giả (the gallery)"
    pronouns_and_address:
      - "Quy chiếu nhóm người từ Bộ Ngoại giao bằng `Họ` / `họ`."
    pov_and_voice: "Trần thuật mô tả thái độ của phái đoàn Bộ Ngoại giao trên hàng ghế khán giả."
    modality_and_logic: "Giữ sự tương phản giữa lý trí và cảm xúc của nhóm người Bộ Ngoại giao: dù đã chuẩn bị tinh thần và hiểu quân đội sẽ không đưa ra phán quyết họ muốn, sự thấu hiểu ấy vẫn không làm dịu những ánh mắt căm tức ném về phía Tanya với nắm tay siết chặt."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000177
    terms:
      - "Tanya (Tanya)"
      - "Bộ Ngoại giao (the Foreign Office)"
      - "vật tế thần (a scapegoat)"
      - "Khối Thịnh vượng chung (the Commonwealth)"
    pronouns_and_address:
      - "Độc thoại nội tâm ngôi thứ nhất tự quy chiếu bằng `mình` đi kèm cụm định vị danh tính `với tư cách Tanya, mình thấy...` (DEC-P01-001); quy chiếu người của Bộ Ngoại giao bằng `họ` / `Họ`."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ cảm giác thấy bất công khi bị nhìn với ánh mắt sát khí như kẻ giết cha mẹ họ, đồng thời hiểu rõ động cơ của phía Bộ Ngoại giao là đang rất cần một vật tế thần để xoa dịu dư luận ở Khối Thịnh vượng chung."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000178
    terms:
      - "Bộ Ngoại giao (the Foreign Office)"
      - "toàn thể quốc gia (the entire state)"
      - "lợi ích của một cá nhân (an individual’s interests)"
      - "những mối quan tâm của đất nước (the national concerns)"
    pronouns_and_address:
      - "Quy chiếu những người ở Bộ Ngoại giao bằng `họ`."
    pov_and_voice: "Nhận xét nội tâm của Tanya về hệ quy chiếu của giới ngoại giao."
    modality_and_logic: "Giữ quan hệ nhân quả và sắc thái suy đoán (`có vẻ`): vì coi trọng toàn thể quốc gia nên họ không đặt lợi ích của một cá nhân vào cùng hệ quy chiếu với những mối quan tâm của đất nước."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000179
    terms:
      - "Tanya (Tanya)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` (DEC-P01-001) và nhóm người Bộ Ngoại giao bằng `họ`."
    pov_and_voice: "Câu cảm thán nội tâm nối tiếp bằng trần thuật ngôi thứ ba theo điểm nhìn của Tanya."
    modality_and_logic: "Giữ lý do Tanya kìm tiếng thở dài: thấy họ đã sôi sục trong lòng nên nó tính toán rằng giữ im lặng là kế hoạch khôn ngoan hơn."
    emphasis: "Khóa chính xác câu cảm thán nội tâm in nghiêng `*Chà, phiền thật.*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000180
    terms:
      - "quan hệ quốc tế (international relations)"
      - "tiền lệ (precedent)"
      - "luật lệ (laws and regulations)"
      - "nghĩa vụ đạo đức (moral obligation)"
      - "sự tắc trách của Thiếu tá von Degurechaff (Major von Degurechaff’s negligence)"
      - "thẩm quyền pháp lý (legal authority)"
      - "quyền tài phán (jurisdiction)"
    pronouns_and_address:
      - "Thẩm phán đại diện tòa tự xưng `chúng tôi` (kèm phản thân `mình` ở cuối câu), gọi Tanya là `Thiếu tá von Degurechaff`."
    pov_and_voice: "Lời tuyên đọc trang trọng, mang đậm văn phong pháp lý – hành chính của vị thẩm phán."
    modality_and_logic: "Khóa sự phân biệt giữa `thẩm quyền pháp lý` (`legal authority`) và `quyền tài phán` (`jurisdiction`, `vol02-ch05-b07-jurisdiction`), giữ đầy đủ các tầng nhượng bộ (công nhận quan hệ quốc tế bị tổn hại là sự thật nghiêm trọng; thừa nhận nghĩa vụ đạo đức phải bàn về sự tắc trách của Thiếu tá von Degurechaff; nhưng căn cứ tiền lệ và luật lệ thì kết luận vụ việc nằm ngoài quyền tài phán của tòa)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000181
    terms:
      - "nghĩa vụ đạo đức (moral obligation)"
      - "thẩm quyền pháp lý (legal authority)"
      - "Tanya (Tanya)"
    pronouns_and_address:
      - "Quy chiếu vị thẩm phán bằng `ông`, tòa án/quân đội bằng `họ`, và quy chiếu Tanya bằng `nó` ở cả hai động từ cuối câu (`không xét xử nó cũng đồng nghĩa với không đổ lỗi cho nó`) theo đúng DEC-P01-001."
    pov_and_voice: "Trần thuật ngôi thứ ba khép lại cảnh phiên tòa."
    modality_and_logic: "Khóa bản sửa theo B07-05 (`không xét xử nó cũng đồng nghĩa với không đổ lỗi cho nó`), giữ trọn ý nghĩa thực chất đằng sau câu trả lời quan liêu mập mờ: ai cũng hiểu việc tòa từ chối xét xử Tanya thực chất đồng nghĩa với việc không quy trách nhiệm cho nó."
    emphasis: "Không dùng `*...*`."
