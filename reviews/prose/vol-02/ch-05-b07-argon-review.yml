  - id: vol02-ch05-b07-tanya-courtroom-pov-pronouns-and-emphasis
    source_term: "Shift from veteran reminiscence back to Tanya courtroom POV at p000158, Tanya third-person narration pronouns (`Tanya` / `nó`) at p000159, p000175, p000176, p000179, p000181 vs first-person interior monologue pronouns (`mình`) at p000171, p000177, explicit first-person/third-person dissociation (`với tư cách Tanya, mình...`) at p000177, courtroom formal address (`Thiếu tá von Degurechaff` / `cô` vs `chúng tôi` / `tòa`) at p000170, p000180, generic pronouns (`bạn` / `anh` / `chúng ta`) in military-political commentary at p000159–p000166, and exact preservation of five italicized spans across p000159, p000168, p000171, p000179"
    proposed_vi: "Sau khi khép lại hồi ức của người cựu binh ở cuối ch-05-b06, mạch truyện tại p000158 chuyển thẳng về điểm nhìn của Tanya tại phiên tòa quân sự, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000159, p000175 — đã sửa theo B07-04, p000176, p000179, p000181 — đã sửa theo B07-05), quy chiếu Tanya nhất quán bằng tên riêng `Tanya` và đại từ trần thuật `nó` (tuyệt đối không dùng `cô` trong trần thuật hay để lẫn `mình` làm mơ hồ tân ngữ ở cuối p000181); (2) trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất trực tiếp của Tanya (p000171, p000177, cùng các câu cảm thán không chủ ngữ ở p000158, p000179), dùng đại từ tự quy chiếu `mình` theo đúng DEC-P01-001, đặc biệt giữ rõ cấu trúc tự nhận thức tách lớp `với tư cách Tanya, mình thấy...` ở p000177; (3) trong lời tuyên đọc phán quyết công vụ của vị chuyên gia pháp lý giữ vai trò thẩm phán (p000170, p000173, p000180), người đọc phán quyết xưng `tòa` / `chúng tôi` (kèm phản thân `mình` ở cuối p000180) và gọi Tanya là `Thiếu tá von Degurechaff` / `cô`, còn lời trần thuật quy chiếu vị thẩm phán bằng `ông` (p000174, p000181) và các phe Bộ Ngoại giao / quân đội bằng `họ` (p000160, p000164, p000168, p000171, p000172, p000176–p000179, p000181); (4) trong lời đấu khẩu giả định giữa phe ngoại giao và phe quân sự ở p000168, phía quân sự gọi phía đòi đem sĩ quan làm vật tế thần là `Các người`; (5) bảo toàn chính xác và duy nhất 5 cụm nhấn mạnh bằng `*...*` khớp tuyệt đối với 5 thẻ `<html:em>` trong nguồn: `*“Công cụ bạo lực là sao?”*` (p000159), `*“Xin hãy nghĩ đến chính trị!”*` và `*“Các người định biến một sĩ quan đã làm tròn nhiệm vụ thành vật tế thần sao?”*` (p000168), `*không thụ lý*` (p000171) và `*Chà, phiền thật.*` (p000179), không tự thêm `*...*` ở bất kỳ vị trí nào khác (DEC-P01-002)."
    alternatives_vi:
      - "như thể nó đã giết cha mẹ họ (thay cho `như thể mình đã giết cha mẹ họ` ở vế so sánh phụ của p000177 nếu muốn tách bạch cả ngôi thứ ba trong mệnh đề giả định — giữ `mình` trong bản dịch hiện tại vì liền mạch tự nhiên với chủ ngữ `với tư cách Tanya, mình thấy` ngay trước đó)"
