- segment_id: YS-LN02/Text/part0010.xhtml/p000098
  locks:
  - "Giữ đại từ `Chúng tôi` / `chúng tôi`, động từ `đánh tan` theo L6, và điều kiện kỹ thuật `súng trường bộ binh muốn xuyên thủng lớp vỏ phòng ngự của chúng tôi thì phải bào mòn chúng bằng một loạt đạn dày đặc`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000099
  locks:
