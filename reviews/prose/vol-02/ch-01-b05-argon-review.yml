  volume: vol-02
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` cho độc thoại nội tâm của Tanya (`mình`), đồng thời giữ đúng toàn bộ các quyết định đã sửa và signoff trong handoff `handoffs/vol-02/ch-01-b05.yml` (`M1`, `M3`, `M4`, `M5`, `M6`: lặp tên riêng `Tanya` hoặc lược chủ ngữ trong trần thuật ngôi thứ ba; dùng `mình` cho độc thoại nội tâm đơn lẻ và `chúng tôi` cho trần thuật hành động tập thể; dùng cấu trúc vô nhân xưng ở p000109; gọi Serebryakov nhất quán là `Thiếu úy Serebryakov` / `Thiếu úy`)."
