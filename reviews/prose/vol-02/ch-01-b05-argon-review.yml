  proposed_vi: "sĩ quan phụ tá, người theo chủ nghĩa hậu cấu trúc, giải cấu trúc (part0010/p000088, p000115) / Thiếu úy Serebryakov, Thiếu úy (part0010/p000089, p000092, p000095, p000118) / Thiếu tá (part0010/p000090, p000101) / sư đoàn, quân đội Dacia, Quân đội Dacia (part0010/p000092, p000100) / đại chiến thế giới đầu tiên, sức mạnh không chiến, chiến tranh hai chiều, không gian ba chiều (part0010/p000093) / Đại đội chỉ huy (part0010/p000094) / lựu đạn chống mục tiêu mặt đất đã cố định thuật thức, mảnh đạn, mũ sắt, đại đội, thuật thức (part0010/p000097) / lớp vỏ phòng ngự (part0010/p000098) / súng máy hạng nặng, phòng không (part0010/p000099) / các đại đội (part0010/p000100, p000112) / cuộc diễn tập bắn đạn thật (part0010/p000103) / Liên minh Entente (part0010/p000105) / Công quốc (part0010/p000106) / công cụ bạo lực, pháo binh, Friedrich Đại đế (part0010/p000109) / Being X (part0010/p000110) / Lục quân Đế quốc, bắn phòng không (part0010/p000112) / đội hình vuông, đội hình vuông bộ binh (part0010/p000113, p000116, p000118) / kỵ binh, xung phong kỵ binh, các đợt tấn công mặt đất bằng ma pháp (part0010/p000117, p000118)"
  alternatives_vi:
  - lựu đạn chống lực lượng mặt đất hoặc gắn thuật thức / thuật thức cố định (thay cho `lựu đạn chống mục tiêu mặt đất đã cố định thuật thức` tại part0010/p000097 — ưu tiên `lựu đạn chống mục tiêu mặt đất đã cố định thuật thức` theo các lựa chọn tạm `vol02-ch01-b05-anti-surface-grenade` và `vol02-ch01-b05-formula-fixed` đã signoff trong handoff, diễn đạt chính xác loại lựu đạn đã nạp sẵn thuật thức kích nổ tầm cao để rải mảnh xuống bộ binh mặt đất) / đội hình ô vuông của bộ binh (thay cho `đội hình vuông bộ binh` tại part0010/p000116, p000118 — ưu tiên `đội hình vuông bộ binh` theo lựa chọn tạm `vol02-ch01-b05-infantry-square` vì là thuật ngữ lịch sử quân sự cô đọng chỉ đội hình chống kỵ binh truyền thống) / Frederick Đại đế (thay cho `Friedrich Đại đế` tại part0010/p000109 — ưu tiên `Friedrich Đại đế` theo `provisional_review_choices.Frederick_the_Great` để hợp bối cảnh văn hóa quân sự kiểu Đức – Phổ của Đế quốc)
