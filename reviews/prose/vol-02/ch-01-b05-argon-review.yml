  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, nhân vật, cấp bậc và thuật ngữ ma pháp – quân sự đã xác lập ở Tập 1 cùng B01–B04 của Tập 2 (`sĩ quan phụ tá`, `Thiếu úy Serebryakov`, `Thiếu úy`, `Thiếu tá`, `quân đội Dacia`, `Công quốc`, `Liên minh Entente`, `Lục quân Đế quốc`, `Being X`, `thuật thức`, `lớp vỏ phòng ngự`, `cuộc diễn tập bắn đạn thật`, `phòng không`), đồng thời khóa tạm toàn bộ các lựa chọn thuật ngữ đã sửa và signoff theo `M1`, `M4` cùng `provisional_review_choices` và `provisional_choices` trong handoff `handoffs/vol-02/ch-01-b05.yml` (`người theo chủ nghĩa hậu cấu trúc`, `Đại đội chỉ huy`, `lựu đạn chống mục tiêu mặt đất đã cố định thuật thức`, `Friedrich Đại đế`, `đội hình vuông bộ binh`, `các đợt tấn công mặt đất bằng ma pháp`)."
  uncertainty: medium
  status: pending
  canon: false
- source_term: tanya_serebryakov_and_command_company_pronouns_and_address_vol02_ch01_b05
  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng cách lặp lại tên riêng `Tanya` hoặc tỉnh lược chủ ngữ khi đã rõ (part0010/p000092, p000095, p000112), không dùng `cô` hay `nó`; độc thoại nội tâm một chủ thể của Tanya dùng `mình` / `Mình` cho ngôi thứ nhất số ít (part0010/p000088, p000105, p000110, p000115), quy chiếu phụ tá Serebryakov trung tính là `sĩ quan phụ tá` / `sĩ quan ấy` (part0010/p000088, p000115), riêng câu suy nghĩ nhấn mạnh đặt trong `*...*` ở đoạn chuyển tiếp điểm nhìn giữ `tôi` (part0010/p000092); trần thuật ngôi thứ nhất số nhiều mô tả hành động tác chiến chung của đơn vị dùng `Chúng tôi` / `chúng tôi` (part0010/p000097, p000098, p000099, p000118); câu bình luận nguyên lý chung dùng cấu trúc vô nhân xưng tự nhiên (part0010/p000109); trong đối thoại và mệnh lệnh tác chiến: Tanya tự xưng `tôi`, dùng `Chúng ta` / `Ta` / `chúng ta` khi bao hàm đơn vị, gọi phụ tá bằng cấp bậc `Thiếu úy Serebryakov` / `Thiếu úy` và gọi đơn vị là `Đại đội chỉ huy`, `Tất cả các đại đội` (part0010/p000089, p000091, p000094, p000096, p000100, p000107, p000116); Serebryakov và các đại đội trưởng báo cáo hoặc hỏi lại gọi Tanya là `thưa Thiếu tá` / `Thiếu tá`, tự xưng `Tôi` và gọi phe mình là `bên mình` (part0010/p000090, p000101, p000104)"
  alternatives_vi:
  - nó cho Tanya trong trần thuật (thay cho việc lặp tên riêng `Tanya` hoặc tỉnh lược chủ ngữ tại part0010/p000092, p000095, p000112 — ưu tiên lặp tên riêng `Tanya` hoặc tỉnh lược chủ ngữ theo đúng quyết định sửa `M3` và `provisional_review_choices.tanya_third_person_narration` đã signoff trong handoff `handoffs/vol-02/ch-01-b05.yml`, đồng bộ với B01–B04 của Chương 1 Tập 2) / cô ấy (thay cho `sĩ quan ấy` khi quy chiếu phụ tá trong nội tâm tại part0010/p000088 — ưu tiên `sĩ quan ấy` để giữ sắc thái công vụ trung tính và tuân thủ giới hạn không suy diễn ngoài ngữ cảnh của DEC-P01-001)
