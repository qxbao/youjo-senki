- segment_id: YS-LN02/Text/part0010.xhtml/p000089
  locks:
  - "Giữ danh xưng `Thiếu úy Serebryakov` và cách gọi ngôi thứ hai `Thiếu úy` theo M1."
- segment_id: YS-LN02/Text/part0010.xhtml/p000090
  locks:
  - "Giữ lời hỏi ngập ngừng của Serebryakov `“Ơ… thưa Thiếu tá?”` theo L14."
- segment_id: YS-LN02/Text/part0010.xhtml/p000091
  locks:
  - "Giữ đại từ `tôi` trong lời thoại của Tanya, cụm `một đám ô hợp năm vạn người đang liều mạng làm loạn` theo L2, điều kiện phủ định `Không định nghĩa thuật ngữ cho đúng thì đương nhiên sẽ gây hiểu lầm` và câu tự trách cuối đoạn."
- segment_id: YS-LN02/Text/part0010.xhtml/p000092
  locks:
  - "Giữ danh xưng `Thiếu úy Serebryakov` theo M1, giữ đúng phạm vi nhấn mạnh `*Họ có thể chuẩn bị tinh thần cho một trận ác chiến với kẻ địch hùng mạnh, quả là đáng khen; nhưng tôi đã sai khi gọi quân địch là “sư đoàn”.*` theo M2 và DEC-P01-002, cùng tên riêng `Tanya` và cụm `quân đội Dacia là một thế lực quân sự đáng gờm` ở câu cuối."
- segment_id: YS-LN02/Text/part0010.xhtml/p000093
  locks:
