findings:
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000181
    category: pronoun_and_viewpoint
    issue: >-
      Ở lượt review trước, đoạn `p000181` dùng đại từ gộp `chúng ta` trong lời kể hồi cố
      ngôi thứ nhất số nhiều của pháp sư đánh chặn Cộng hòa nối tiếp B07.
    resolution: resolved
    verification: >-
      Đã đổi sang `chúng tôi` (`Tình hình xấu đi—chúng tôi đã mắc bẫy, và chẳng còn cách
      nào ngăn máu đổ hay thiệt hại xảy ra.`), khớp hoàn toàn với điểm nhìn hồi cố của nhóm
      từ B07 và giữ đúng phủ định tuyệt đối khả năng ngăn chặn thương vong lẫn thiệt hại.
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000192
    category: terminology_and_head_noun
    issue: >-
      Ở lượt review trước, `initial explosion formula` tại `p000192` bị đảo danh từ chính
      thành `vụ nổ công thức ban đầu` và thiếu đồng bộ với `p000180`, `p000182`.
    resolution: resolved
    verification: >-
      Đã sửa `p000192` thành `bị quật ngã bởi thuật thức phát nổ ban đầu` và đồng bộ toàn
      bộ hệ thuật ngữ tạm `đạn thuật thức` (`p000180`), `Thuật thức phát nổ` / `thuật thức
      bắn quang học` (`p000182`), `thuật thức phát nổ ban đầu` (`p000192`).
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000207
    category: meaning_and_logic
    issue: >-
      Ở lượt review trước, câu đầu tự thêm tình thái bắt buộc `phải`, còn câu hai dịch
      quan hệ đối chọi/đánh đổi (`versus`) thành liên từ lựa chọn `hay`.
    resolution: resolved
    verification: >-
      Đã bỏ `phải` ở câu đầu (`thực tế của việc tiến hành trinh sát chiến đấu vào những vị
      trí được phòng thủ nghiêm ngặt`) và diễn đạt chuẩn xác hai vế đối chọi của thế tiến
      thoái lưỡng nan ở câu hai (`một bên là thương vong cao, một bên là nhu cầu chiến thuật`).
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000183
    category: modality_and_meaning
    issue: >-
      Ở lượt review trước, `if only barely` được dịch là `dù chỉ vừa đủ` và `cover the gap
      in the vanguard` chưa tách rõ nghĩa bắn bọc lót cho khoảng trống.
    resolution: resolved
    verification: >-
      Đã sửa thành `dù hết sức chật vật` và `bọc lót cho khoảng trống ở đội tiên phong`,
      phản ánh đúng mức độ kháng cự gượng gạo và tác dụng hỏa lực áp chế của đội hậu vệ.
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000190
    category: register_and_tone
    issue: >-
      Ở lượt review trước, mệnh đề quan hệ chỉ các pháp sư Đế quốc dùng từ chỉ loại mang
      sắc thái miệt thị `những kẻ` trong câu trần thuật ngôi thứ ba khách quan.
    resolution: resolved
    verification: >-
      Đã đổi thành `vốn đã tăng tốc để tấn công`, giữ đúng giọng trần thuật ngôi thứ ba
      trung tính theo `canon/style-guide.md`.
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000204
    category: meaning_clarity
    issue: >-
      Ở lượt review trước, cụm đồng vị `the Imperial Army General Staff war machine’s
      intentions` bị dịch với từ `thuộc`, làm đổi quan hệ đồng vị thành quan hệ trực thuộc.
    resolution: resolved
    verification: >-
      Đã sửa thành `ý đồ của cỗ máy chiến tranh Bộ Tổng tham mưu Lục quân Đế quốc`, bảo
      toàn chính xác quan hệ đồng vị ví Bộ Tổng tham mưu như một cỗ máy chiến tranh duy lý.
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000205
    category: meaning_nuance
    issue: >-
      Ở lượt review trước, `abandoning the front` được dịch là `rút khỏi tiền tuyến`, làm
      nhẹ sắc thái chủ động từ bỏ tiền tuyến.
    resolution: resolved
    verification: >-
      Đã sửa thành `từ bỏ tiền tuyến thành công`, kết nối chặt chẽ với mạch lập luận từ
      `p000200` đến `p000205`.
