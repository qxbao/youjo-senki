  - segment_id: YS-LN02/Text/part0024.xhtml/p000053
    names_and_ranks:
      - Tanya -> Tanya
      - long-range wireless set -> bộ vô tuyến tầm xa
      - Command -> Bộ chỉ huy
      - receiver -> ống nghe
    pronouns_and_address:
      - Câu tự nhủ nội tâm in nghiêng mở đầu dùng "Mình" theo DEC-P01-001 (bản sửa M2); phần trần thuật ngôi thứ ba dùng tên riêng "Tanya"
    pov_and_logic:
      - Giữ trọn trình tự hành động: tự trấn an đã hoàn thành nhiệm vụ, nén tiếng thở dài, lệnh cho người lính mang bộ vô tuyến tầm xa gọi về Bộ chỉ huy, qua vài lượt trao đổi mật mã để kết nối rồi cầm ống nghe báo cáo tóm tắt tình hình
    emphasis:
      - Giữ đúng phạm vi nhấn mạnh Markdown `*Mình đã hoàn thành nhiệm vụ*` cho câu tự nhủ mở đầu và đặt phần trần thuật ngôi thứ ba ra ngoài dấu sao theo DEC-P01-002 (bản sửa M2)
  - segment_id: YS-LN02/Text/part0024.xhtml/p000054
