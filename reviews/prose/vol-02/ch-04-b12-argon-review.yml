  - id: vol02-ch04-b12-tanya-pronouns-pov-shifts-and-emphasis
    source_term: Tanya first-person interior monologue pronouns (p000027, p000029, p000032, p000033, p000038, p000040, p000046, p000048–p000050, p000053, p000056), Tanya third-person narration pronouns (p000040, p000044, p000050, p000053), intra-paragraph POV shift in p000050, spoken/radio dialogue pronouns (p000026, p000030, p000034–p000036, p000039, p000041–p000043, p000047, p000051, p000052, p000054, p000055), and emphasis spans
    proposed_vi: >-
      xác nhận các bản sửa M1, M2 và M3 đã được thực hiện đầy đủ và nghiệm thu:
      trong trần thuật ngôi thứ ba bám sát điểm nhìn Tanya (p000040, p000044,
      p000050, p000053), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại
      từ “nó” theo DEC-P01-001 và `vol02-ch04-b12-narrative-pronoun` (tuyệt đối
      không dùng “cô”; lưu ý từ “nó” tại p000035 quy chiếu con tàu khu trục
      địch); trong các đoạn và câu độc thoại nội tâm ngôi thứ nhất của Tanya
      (p000027, p000029, p000032, p000038, p000046, p000049, p000050, p000053),
      tự quy chiếu số ít nhất quán bằng “mình” / “Mình” kết hợp “bản thân” theo
      DEC-P01-001, và quy chiếu tập thể đơn vị / phía Đế quốc trong nội tâm
      (p000029, p000032, p000033, p000040, p000048, p000056) bằng “chúng ta” /
      “ta” / “chúng tôi”; tại p000050, bảo toàn chính xác sự chuyển ngôi ngay
      trong cùng một đoạn từ trần thuật ngôi thứ ba ở câu đầu (“Nghĩ đến đó, nó
      suýt bật cười.”) sang độc thoại nội tâm ngôi thứ nhất ở ba câu sau
      (“mình”); trong đối thoại tác chiến và liên lạc vô tuyến, Tanya và các
      thuộc cấp dùng “chúng ta” / “ta” / “Bên ta” khi nói về kết quả chung của
      đơn vị (p000030, p000035, p000036, p000039, p000041, p000043), thuộc cấp
      gọi Tanya là “Thiếu tá” và tự xưng “tôi” (p000042), Tanya tự xưng “tôi”
      trong đối thoại trực tiếp cũng như báo cáo vô tuyến (p000043, p000047,
      p000054), và Urban Control tự xưng “Chúng tôi”, gọi đơn vị của Tanya là
      “Các anh” (p000055); bảo toàn chính xác 2 phạm vi nhấn mạnh Markdown
      `*...*` cho hai câu nghĩ trực tiếp tại p000040 và p000053 (đặt mệnh đề dẫn
      ngôi thứ ba ra ngoài dấu sao) cùng ký hiệu chú thích `¹⁴` tại p000038 theo
      DEC-P01-002
    alternatives_vi:
      - cả đội / bọn mình (thay cho “chúng tôi” ở câu đầu p000032 và cuối p000056)
      - lược đại từ ngôi thứ hai số nhiều hoặc dùng cách gọi trung tính tại câu hỏi của Urban Control ở p000055
