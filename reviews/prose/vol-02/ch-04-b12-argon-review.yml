    pov_and_logic:
      - Giữ suy tính thiết thực của Tanya là tập trung vào thiệt hại của đơn vị để làm đơn xin cho họ được huấn luyện lại và nghỉ ngơi
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000050
    names_and_ranks:
