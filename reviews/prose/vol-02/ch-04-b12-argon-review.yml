    pronouns_and_address:
      - Câu đầu là trần thuật ngôi thứ ba dùng "nó" cho Tanya (bản sửa M3); ba câu sau chuyển sang độc thoại nội tâm ngôi thứ nhất dùng "mình" kết hợp "bản thân" theo đúng DEC-P01-001
    pov_and_logic:
      - Bảo toàn sự chuyển ngôi trong cùng đoạn và diễn biến tâm lý: nghĩ tới kỳ nghỉ ở hậu phương khiến nó suýt bật cười, định dùng kinh nghiệm kiềm chế để giả vờ đau buồn nhưng lập tức tự chỉnh lại rằng mình thật sự buồn và chán nản vì tổn thất của đơn vị đã dày công huấn luyện
    emphasis: none
