      - Giữ đúng phạm vi nhấn mạnh Markdown `*Có lẽ chỉ là mong ước hão huyền thôi*` cho câu nghĩ trực tiếp và đặt phần dẫn "nó than thở" ở ngoài dấu sao theo DEC-P01-002 (bản sửa M1)
