    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000231
    names_and_ranks:
      - forty-five hundred feet -> 4.500 feet
      - spindle shape -> đội hình con thoi
    pronouns_and_address:
      - Tự sự hành động tập thể của đơn vị dùng "chúng tôi"
    pov_and_logic:
      - Giữ đúng độ cao bổ nhào ("4.500 feet"), thuật ngữ tạm "đội hình con thoi" (`vol02-ch04-b10-spindle-shape`) và động tác tinh chỉnh từng chút một góc tấn công
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000232
    names_and_ranks: []
