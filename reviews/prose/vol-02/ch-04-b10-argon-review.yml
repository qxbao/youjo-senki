    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000233
    names_and_ranks:
      - destroyer -> tàu khu trục
    pronouns_and_address:
      - Độc thoại nội tâm dùng "chúng tôi" cho cả đội và "mình" cho cá nhân Tanya ("một người của mình") theo DEC-P01-001 (bản sửa M1)
    pov_and_logic:
