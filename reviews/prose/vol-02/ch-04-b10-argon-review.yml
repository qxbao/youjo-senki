      - anti–air fire -> bắn phòng không
    pronouns_and_address:
      - Độc thoại nội tâm tự quy chiếu bằng "mình" (DEC-P01-001, bản sửa M1) và quy chiếu pháp sư thuộc cấp trúng đạn bằng "anh ta"
    pov_and_logic:
      - Giữ thông số pháo chính 127 mm bắn phòng không hiệu quả khiến Tanya đánh giá lại tình hình, cùng nhận xét người pháp sư trúng đạn vẫn bay được nhưng trông không ổn lắm nên có lẽ phải rút khỏi trận
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000235
    names_and_ranks: []
    pronouns_and_address:
      - Quy chiếu pháp sư trúng đạn bằng "Anh ta" / "anh ta", và tập thể đơn vị bằng "Chúng tôi"
    pov_and_logic:
      - Giữ suy nghĩ lạnh lùng thực dụng của Tanya: anh ta còn nói được thì sẽ tự bay về căn cứ, đơn vị không thể làm gì khác ngoài hy vọng anh ta làm mồi nhử tốt
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000236
    names_and_ranks:
      - explosion formulas -> thuật thức nổ
      - destroyer -> tàu khu trục
      - depth charges -> mìn sâu
      - torpedo tubes -> ống phóng ngư lôi
    pronouns_and_address:
      - Khẩu lệnh trực tiếp của Tanya gọi đơn vị là "mọi người" và "ta"
    pov_and_logic:
      - Giữ lời giục người bị thương rời đi, lệnh chuẩn bị "thuật thức nổ" (`vol02-ch04-b10-explosion-formulas`) và chỉ thị nhắm vào các "mìn sâu" (`vol02-ch04-b10-depth-charge`) lộ ra ngoài hoặc các ống phóng ngư lôi
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000237
    names_and_ranks:
      - Tanya -> Tanya
    pronouns_and_address:
      - Trần thuật ngôi thứ ba quy chiếu Tanya bằng tên riêng "Tanya", đại từ "nó" và đại từ sở hữu phản thân "mình" ("đơn vị mình") theo DEC-P01-001; câu lẩm bẩm tự nhủ dùng "Mình"
    pov_and_logic:
      - Giữ hành động vặn người né đạn nhờ rèn luyện, lời lẩm bẩm tự đắc khi né được và suy nghĩ ghi nhận đơn vị mình cần huấn luyện thêm trong lúc bắn trả
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000238
    names_and_ranks:
      - interceptor formulas -> thuật thức đánh chặn
      - Entente Alliance -> Liên minh Entente
      - direct support -> lực lượng yểm trợ trực tiếp
      - destroyer -> tàu khu trục
    pronouns_and_address:
      - Quy chiếu toán pháp sư địch bằng "Đám đang bắn..." và "họ"
    pov_and_logic:
      - Giữ thuật ngữ "thuật thức đánh chặn" (`vol02-ch04-b10-interceptor-formulas`), bản sửa M2 "Liên minh Entente", và suy luận rằng vì hộ tống tàu khu trục nên chắc chỉ có vài người nhưng đã dám lên tận đây thì không thể xem thường
    emphasis:
      - Giữ đúng phạm vi nhấn mạnh Markdown `*Vì họ hộ tống một tàu khu trục nên chắc chỉ có vài người, nhưng nếu đã đủ gan lên tận đây thì không thể xem thường.*` ở câu thứ hai theo DEC-P01-002
  - segment_id: YS-LN02/Text/part0022.xhtml/p000239
    names_and_ranks:
      - fjord -> vịnh hẹp
    pronouns_and_address:
      - Trần thuật ngôi thứ ba quy chiếu Tanya bằng "nó" (DEC-P01-001); quy chiếu pháp sư địch bằng "một tên địch—một pháp sư", "Hắn" và "con quái vật cuồng yêu nước đó"
    pov_and_logic:
      - Giữ chi tiết nhận ra tên pháp sư từng gây nhiều rắc rối cho Tanya ở vịnh hẹp và câu nhận xét nội tâm về ngoại hình giống con quái vật cuồng yêu nước đó
    emphasis:
      - Giữ đúng phạm vi nhấn mạnh Markdown `*Hắn trông rất giống con quái vật cuồng yêu nước đó.*` ở câu thứ hai theo DEC-P01-002
  - segment_id: YS-LN02/Text/part0022.xhtml/p000240
    names_and_ranks: []
    pronouns_and_address:
      - Quy chiếu pháp sư địch bằng "gã này" và "hắn"
    pov_and_logic:
      - Giữ lập luận rằng giết một kẻ địch tồi tệ thì ít áy náy hơn giết một kẻ tốt, nên việc gã này trông giống kẻ tồi tệ là điểm cộng và bắn hắn sẽ thật hả hê
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000241
    names_and_ranks:
      - heavy explosion type -> Loại thuật thức nổ hạng nặng (cần sửa từ "Loại thuật thức đánh chặn mạnh" theo F01)
      - rifle -> súng trường
    pronouns_and_address:
      - Trần thuật ngôi thứ ba quy chiếu Tanya bằng "Nó" / "nó" theo DEC-P01-001
    pov_and_logic:
      - Sau khi sửa F01, giữ đúng chuỗi cân nhắc phương án tấn công của Tanya: loại thuật thức nổ hạng nặng có thể phá hủy một khu vực rộng nhưng sẽ biến nó thành mục tiêu bất động khi thi triển ("Loại ngay."), còn bắn bằng súng trường thì chẳng đủ để quấy rối ("Bác bỏ.")
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000242
    names_and_ranks:
      - kinetic energy -> động năng
      - rifle -> khẩu súng trường
    pronouns_and_address:
      - Câu dẫn ngôi thứ ba dùng "nó"; câu quyết định nội tâm ngôi thứ nhất dùng "Mình" (DEC-P01-001) và quy chiếu tên pháp sư địch bằng "hắn"
    pov_and_logic:
      - Giữ khoảnh khắc nảy ra ý tưởng tận dụng động năng khổng lồ của cú bổ nhào để lao thẳng vào đâm hắn bằng đầu nhọn của khẩu súng trường
    emphasis:
      - Giữ đúng phạm vi nhấn mạnh Markdown `*Bổ nhào ở tốc độ này hẳn sẽ tạo ra động năng khổng lồ.*` theo DEC-P01-002
  - segment_id: YS-LN02/Text/part0022.xhtml/p000243
    names_and_ranks: []
    pronouns_and_address: []
    pov_and_logic:
      - Giữ câu ngắn độc lập miêu tả khoảnh khắc giao cắt thoáng qua
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000244
    names_and_ranks:
      - Tanya -> Tanya
      - bayonet -> lưỡi lê
      - Entente Alliance mage -> pháp sư Liên minh Entente
      - defensive shell -> lớp khiên phòng thủ
      - four hundred knots -> bốn trăm hải lý/giờ
      - medieval heavy cavalry -> kỵ binh hạng nặng thời trung cổ
    pronouns_and_address:
      - Quy chiếu Tanya bằng tên riêng "Tanya", quy chiếu pháp sư Liên minh Entente bằng "hắn"
    pov_and_logic:
      - Giữ bản sửa M2 "pháp sư Liên minh Entente", hành động lưỡi lê xuyên qua lớp khiên phòng thủ cắm vào người hắn, và phép so sánh cú đâm lưỡi lê ở tốc độ hơn bốn trăm hải lý/giờ gây sát thương lớn hơn cú xung phong bằng thương của kỵ binh hạng nặng thời trung cổ
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000245
    names_and_ranks:
      - Tanya -> Tanya
      - bayonet -> lưỡi lê
      - barrel -> nòng súng
    pronouns_and_address:
      - Trần thuật ngôi thứ ba quy chiếu Tanya bằng "Nó" / "nó" và tên riêng "Tanya" (DEC-P01-001); quy chiếu đối phương bằng "tên lính địch", "hắn" và đại từ phản thân "mình" ("bụng mình")
    pov_and_logic:
      - Giữ trọn diễn biến: Tanya đâm lưỡi lê vào và hài lòng nhìn vẻ mặt sững sờ của tên lính địch không tin nổi bụng mình bị đâm xuyên, nhưng khi rút ra thì hơi cau mày vì cả lưỡi lê lẫn nòng súng đã cắm quá sâu và bị kẹt, khiến Tanya phải chật vật một chút mới rút ra được
    emphasis: none
