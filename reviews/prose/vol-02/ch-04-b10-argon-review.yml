    category: terminology_and_meaning
    segment_id: YS-LN02/Text/part0022.xhtml/p000241
    segment_ids:
      - YS-LN02/Text/part0022.xhtml/p000241
    issue: >-
      Tại câu thứ hai của p000241, cụm chỉ loại thuật thức nổ hạng nặng trong
      nguồn (`heavy explosion type`) đang bị dịch nhầm thành “Loại thuật thức
      đánh chặn mạnh” (“Loại thuật thức đánh chặn mạnh có thể phá hủy một khu
      vực rộng, nhưng trong lúc thi triển nó sẽ thành mục tiêu bất động.”).
      Trong ngữ cảnh p000241, Tanya đang tìm cách *tấn công* tên pháp sư địch
      hiệu quả nhất và cân nhắc một thuật thức nổ diện rộng trước khi loại bỏ vì
      thời gian thi triển lâu làm lộ sơ hở; còn “thuật thức đánh chặn”
      (`interceptor formulas`) là đòn bắn cản từ phía dưới của lực lượng yểm trợ
      Liên minh Entente ở p000238. Nguyên nhân sai lệch là do mục
      `vol02-ch04-b10-interceptor-formulas` trong `work/run-state/pending-terms.yml`
      và `term_alignment_scope` trong `handoffs/vol-02/ch-04-b10.yml` đã gán nhầm
      mã đoạn `p000241` vào nhóm `interceptor formulas` thay vì nhóm `explosion
      formulas` / `heavy explosion type`, khiến bước căn chỉnh thuật ngữ thay
      nhầm từ khóa tại p000241.
    evidence: >-
      Đối chiếu trực tiếp gói nguồn tại `YS-LN02/Text/part0022.xhtml/p000241`
      (`heavy explosion type` đi kèm tác dụng làm nổ tung một khu vực rộng để
      tấn công) với `p000236` (`explosion formulas` -> “thuật thức nổ”) và
      `p000238` (`interceptor formulas` -> “thuật thức đánh chặn”).
    recommendation: >-
      Đổi “Loại thuật thức đánh chặn mạnh” tại p000241 thành “Loại thuật thức nổ
      hạng nặng” (hoặc “Loại thuật thức nổ mạnh”): “Loại thuật thức nổ hạng nặng
      có thể phá hủy một khu vực rộng, nhưng trong lúc thi triển nó sẽ thành mục
      tiêu bất động.” Đồng thời cập nhật `work/run-state/pending-terms.yml` để
      chuyển `YS-LN02/Text/part0022.xhtml/p000241` từ mục
      `vol02-ch04-b10-interceptor-formulas` sang nhóm `explosion formulas` /
      `heavy explosion type`.
    resolution: open_for_translator_or_coordinator
    status: unresolved
