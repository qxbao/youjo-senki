    pov_and_logic:
      - Giữ suy luận có dấu hỏi từ việc không có tàu nào hộ tống bên cạnh để đoán đó là một chiếc khu trục hạm đơn độc
    emphasis: none
  - segment_id: YS-LN02/Text/part0022.xhtml/p000229
    names_and_ranks:
