findings:
  - severity: moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000138
    issue: >-
      Câu so sánh tần suất ở bản dịch đầu làm đảo chủ thể sang "mình hiếm khi bị ra lệnh".
    basis: >-
      Đối chiếu cấu trúc vô nhân xưng kèm mệnh đề so sánh tần suất trong p000138.
    proposal: >-
      Sửa thành "Vậy mà hiếm có ai bị ra lệnh giết họ thường xuyên như mình."
    resolution: >-
      Đã sửa tại baseline cc8cd67986aa259a3c6bf2d7df12d474f868db8fedc6d473f2c49f581886cc8b
      thành "Vậy mà hiếm có ai bị ra lệnh giết họ thường xuyên như mình.", khôi phục
      đúng chủ thể và hướng so sánh tần suất.
    status: resolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000137
    issue: >-
      Độc thoại nội tâm hướng thầm về phía pháp sư địch dùng tự xưng "bọn tôi / tôi"
      chưa đồng bộ với các đoạn nội tâm liền kề theo DEC-P01-001.
    basis: >-
      DEC-P01-001 và cấu trúc đoạn không có dấu thoại trong XHTML nguồn.
    proposal: >-
      Đổi tự xưng sang "bọn mình / mình", giữ "các người" cho quân địch.
    resolution: >-
      Đã sửa tại baseline cc8cd67986aa259a3c6bf2d7df12d474f868db8fedc6d473f2c49f581886cc8b
      sang "bọn mình / mình" nhất quán với điểm nhìn nội tâm.
    status: resolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000146
    issue: >-
      Vị ngữ cảnh báo của Đài điều khiển ở bản đầu thiên về khen kỹ năng và câu cuối
      dùng đại từ gán giới tính cho toàn đơn vị.
    basis: >-
      Liên kết sắc thái cảnh báo với p000147–p000148 và nguyên tắc tránh suy diễn
      giới tính theo DEC-P01-001.
    proposal: >-
      Dùng "Hôm nay khách của chúng ta khá nghiêm túc đấy. Mọi người sẽ bận tay đây."
    resolution: >-
      Đã sửa tại baseline cc8cd67986aa259a3c6bf2d7df12d474f868db8fedc6d473f2c49f581886cc8b
      đúng theo đề xuất, giữ sắc thái cảnh báo và lời gọi chung trung tính.
    status: resolved
  - severity: minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000148
    issue: >-
      Thành tố bổ nghĩa trong ngoặc kép ở đầu p000148 chưa khớp bề mặt từ vựng với
      thuật ngữ tạm "trinh sát chiến đấu" ở p000145, p000147, p000151.
    basis: >-
      Tính liên kết bề mặt của lập luận giải thích thuật ngữ giữa p000147 và p000148.
    proposal: >-
      Đồng bộ thành tố trong ngoặc kép tại p000148 thành “chiến đấu”.
    resolution: >-
      Đã sửa câu mở đầu p000148 tại baseline cc8cd67986aa259a3c6bf2d7df12d474f868db8fedc6d473f2c49f581886cc8b
      thành "Dù có thêm thành tố “chiến đấu”, về cơ bản đó vẫn là “trinh sát”.",
      khớp trực tiếp với "trinh sát chiến đấu".
    status: resolved
