findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0028.xhtml/p000042
    category: rank_and_address_consistency
    issue: >-
      Tại `p000042` (thuộc phân cảnh kết thúc mạch tự sự ngôi thứ nhất của Thiếu úy Pháp sư Warren Grantz ở `p000040`–`p000043`, trước đoạn chuyển cảnh `p000044`), danh xưng hô ngữ `Lieutenant` mà viên sĩ quan đàn anh dùng khi vỗ vai động viên Grantz đang được dịch là `Trung úy` (`“Đừng nghĩ ngợi nhiều quá, Trung úy. Cứ tập trung sống sót là được.”`), trong khi cấp bậc của Grantz đã xác lập ngay ở đầu phân cảnh tại `ch-05-b25` (`p000012`) và `ch-05-b24` (`p000620`) là `Thiếu úy` (`Magic Second Lieutenant Grantz`); bên cạnh đó, tại `p000073`, trong câu báo cáo của Trung úy Weiss với cấp trên trực tiếp là Thiếu tá Tanya von Degurechaff (`“Không ạ, cô được triệu đến trình diện ngay lập tức.”`), đại từ ngôi thứ hai đang dùng `cô` thay vì lặp quân hàm `Thiếu tá` (đồng bộ với `p000060`) hoặc dùng đại từ kính ngữ `ngài`.
    basis: >-
      Trong nguyên bản tiếng Anh tại `p000042`, danh xưng hô ngữ chỉ dùng từ chỉ cấp úy chung không kèm tiểu cấp, và mạch khích lệ đàn em ở `p000042`–`p000043` cũng như câu báo cáo có tiểu từ kính ngữ `ạ` của Weiss ở `p000073` vẫn hoàn toàn rõ chủ thể giao tiếp và sắc thái tôn trọng.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh `Trung úy` tại `p000042` thành `Thiếu úy` để khớp chính xác với quân hàm của Grantz, và đổi `cô` tại `p000073` thành `Thiếu tá` (hoặc `ngài`) để đồng bộ lễ tiết quân ngũ giữa cấp phó và tiểu đoàn trưởng.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0028.xhtml/p000045
    category: pronoun_and_pov_consistency
    issue: >-
      Tại câu 2 của `p000045` (`Trước hết, khi mình thức dậy, bữa sáng và cà phê đã được chuẩn bị tươm tất sẵn cho mình.`), mệnh đề thời gian trong nguyên bản vẫn thuộc mạch trần thuật ngôi thứ ba nối tiếp câu 1 (`Với Tanya, mọi chuyện đều suôn sẻ quá mức.`) và đoạn `p000046` ngay sau đó, nhưng chủ ngữ đang dùng đại từ nội tâm `mình` (`khi mình thức dậy`) thay vì đại từ trần thuật ngôi thứ ba `nó` theo quy ước `DEC-P01-001`; ngoài ra, tại cuối câu `p000070` (`Nếu gửi cho chỉ huy thì ngoài nhân viên vô tuyến ra, không ai được đọc trước ngài.`), đại từ quy chiếu danh từ khái quát `chỉ huy` trong lời giải thích quy trình bảo mật điện tín đang dịch là `trước ngài`, mang sắc thái kính xưng của cấp dưới hơn là giọng thuyết minh trung tính từ góc nhìn của chính vị chỉ huy tiểu đoàn.
    basis: >-
      Do lối tự sự ở Phân cảnh 2 (`p000045`–`p000076`) thường xuyên chuyển dịch linh hoạt giữa trần thuật ngôi thứ ba (`Tanya` / `nó`) và độc thoại nội tâm ngôi thứ nhất (`mình`), việc dùng `mình` ở câu 2 `p000045` hay `ngài` ở `p000070` không làm sai lệch điểm nhìn hay nội dung thông tin.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh câu 2 `p000045` thành `Trước hết, khi nó thức dậy, bữa sáng và cà phê đã được chuẩn bị tươm tất sẵn cho mình (hoặc: cho nó).` để bám sát `DEC-P01-001`, và chỉnh cuối câu `p000070` thành `không ai được đọc trước người chỉ huy (hoặc: trước họ).`.
    resolution: optional_polish

