    pronouns_and_address: "Câu 1 quy chiếu bộ phận hậu cần bằng `họ`; câu 2 dùng `mình` trong phần suy nghĩ in nghiêng và `Tanya` / `nó` trong phần trần thuật theo đúng `DEC-P01-001`."
    pov_and_voice: "Sự thận trọng của Tanya được thể hiện qua cả suy nghĩ trực tiếp lẫn lời kể ngôi thứ ba."
    modality_and_logic: "Bảo toàn mệnh đề điều kiện – suy đoán ở câu 1 (`Nếu... thì hẳn là...`), câu suy nghĩ có điều kiện in nghiêng và mệnh đề phủ định kép ở cuối câu 2 (`không ngại chuẩn bị cho mọi tình huống`)."
    emphasis: "Bảo toàn chính xác cụm `*Chắc mình nên tránh ra ngoài một thời gian, nếu không cần thiết*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0028.xhtml/p000051
    terms:
      - "Tanya"
      - "binh lính"
      - "chiến hào"
      - "đơn vị"
      - "trạng thái sẵn sàng chiến đấu cấp độ hai"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu `Tanya` bằng `Nó` nhất quán qua 3 câu cuối theo đúng `DEC-P01-001`."
    pov_and_voice: "Từ nhận định nội tâm in nghiêng chuyển sang chuỗi quyết định chỉ huy dứt khoát."
    modality_and_logic: "Bảo toàn trọn vẹn 5 câu: câu 1 khẳng định chắc chắn hôm nay sẽ có rắc rối; câu 2 Tanya chuẩn bị tinh thần; câu 3–5 nêu ba biện pháp dự phòng ở thì tương lai (`Nó sẽ...`)."
    emphasis: "Bảo toàn chính xác câu mở đầu `*Hôm nay chắc chắn sẽ có rắc rối.*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0028.xhtml/p000052
    terms:
      - "bít tết thật"
      - "dưa cải muối"
      - "nước ép đại hoàng"
    pronouns_and_address: "Trần thuật khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Nhịp câu ngắn, gãy gọn tạo hiệu ứng hài hước khi sự cảnh giác cao độ của Tanya chỉ dẫn tới một bữa trưa thịnh soạn."
    modality_and_logic: "Bảo toàn đầy đủ 4 câu: chẳng hiểu sao không có chuyện gì xảy ra và đã đến giờ ăn trưa; thức ăn được dọn lên; là bít tết thật kèm dưa cải muối; tráng miệng còn có nước ép đại hoàng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000053
    terms:
      - "tuyến tiếp tế"
    pronouns_and_address: "Trần thuật quy chiếu bữa ăn bằng `Tất cả`."
    pov_and_voice: "Lời giải thích ngắn gọn nối tiếp `p000052`."
    modality_and_logic: "Bảo toàn nguyên nhân: tất cả vừa được chuyển đến nhờ tuyến tiếp tế vận hành trơn tru khác thường."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000054
    terms:
      - "đơn vị"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` theo đúng `DEC-P01-001`."
    pov_and_voice: "Sự đối lập giữa vẻ háo hức của thuộc cấp và tính đa nghi của Tanya."
    modality_and_logic: "Bảo toàn quan hệ đối lập – nhân quả: các thành viên trong đơn vị đều hào hứng ăn ngấu nghiến, nhưng nó vẫn chưa tin nổi nên kiểm tra thức ăn một lúc rồi mới ăn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000055
    terms: []
    pronouns_and_address: "Độc thoại nội tâm ngôi thứ nhất của Tanya dùng `Mình` theo đúng `DEC-P01-001`."
    pov_and_voice: "Độc thoại nội tâm liên tưởng tới viên sĩ quan từng bị đau bụng vì khoai tây hỏng ở đầu Tập 2."
    modality_and_logic: "Bảo toàn tâm lý ghen tị với người gặp vận may nhờ vụ khoai tây ấy mà được rút về khu vực an toàn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000056
    terms:
      - "hậu phương"
      - "chính sách đối ngoại"
      - "Khối Thịnh vượng chung"
      - "ngộ độc thức ăn"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `Mình` / `mình` và quy chiếu thượng cấp bằng `họ`."
    pov_and_voice: "Lập luận đa nghi mang tính toán chính trị – quân sự đặc trưng của Tanya."
    modality_and_logic: "Bảo toàn trọn vẹn 2 câu cùng sắc thái phỏng đoán (`liệu... hay không`, `có lẽ`) và câu điều kiện – nhân quả (`Nếu..., họ sẽ..., nên...`): tự hỏi liệu họ có định đưa mình về hậu phương ngay từ bây giờ vì tác động có lẽ mình đã gây ra với chính sách đối ngoại liên quan đến Khối Thịnh vượng chung; nếu bị ngộ độc thức ăn họ sẽ sẵn lòng hy sinh mình nên không thể bất cẩn đổ bệnh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000057
    terms:
      - "cấp dưới"
    pronouns_and_address: "Độc thoại nội tâm của Tanya lược chủ ngữ đại từ sở hữu trước `cấp dưới`."
    pov_and_voice: "Lời than thở thực tế trước sức hấp dẫn của món bít tết."
    modality_and_logic: "Bảo toàn nhận định: nhìn cấp dưới ngấu nghiến thịt đúng là cực hình."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000058
    terms: []
    pronouns_and_address: "Độc thoại nội tâm ngôi thứ nhất của Tanya dùng `mình` / `Mình` theo đúng `DEC-P01-001`."
    pov_and_voice: "Nhịp độc thoại dồn nén từ sự ấm ức sang khoảnh khắc chuẩn bị thưởng thức món ăn thì bị cắt ngang."
    modality_and_logic: "Bảo toàn đầy đủ 3 câu cùng mệnh đề điều kiện ở câu 1 (`nếu cuối cùng chẳng có vấn đề gì...`) và bước ngoặt ở cuối câu 3 (`sắp bắt đầu ăn miếng thịt thì chuyện đó xảy ra`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000059
    terms:
      - "Trung úy Weiss"
      - "bức điện tín"
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba định danh `Trung úy Weiss` và `Tanya`."
    pov_and_voice: "Trần thuật ngôi thứ ba mô tả sự xuất hiện đúng lúc trớ trêu của phó chỉ huy Weiss."
    modality_and_logic: "Bảo toàn quan hệ kéo theo: Trung úy Weiss chạy tới cùng một bức điện tín, khiến Tanya lỡ mất cơ hội ăn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000060
    terms:
      - "Thiếu tá"
      - "Bộ chỉ huy"
    pronouns_and_address: "Trung úy Weiss gọi Tanya bằng quân hàm `Thiếu tá`."
    pov_and_voice: "Câu báo cáo ngắn gọn, khẩn trương."
    modality_and_logic: "Bảo toàn thông tin bức điện gửi từ Bộ chỉ huy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000061
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba định danh `Tanya`."
    pov_and_voice: "Trần thuật ngôi thứ ba nhấn mạnh sự bực bội của Tanya khi bị gián đoạn bữa ăn."
    modality_and_logic: "Bảo toàn hành động đặt dao nĩa xuống để chào đáp lễ và trạng thái *không hài lòng*."
    emphasis: "Bảo toàn chính xác cụm `*không hài lòng*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0028.xhtml/p000062
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình` và quy chiếu Weiss bằng `anh ta`."
    pov_and_voice: "Câu càu nhàu trong đầu vừa tức tối vừa thừa nhận năng lực của Weiss."
    modality_and_logic: "Bảo toàn câu điều kiện trái thực tế (`Nếu anh ta không biết điều đến thế, mình đã đuổi cổ anh ta ngay rồi.`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000063
    terms:
      - "tiền tuyến"
    pronouns_and_address: "Hai câu đầu là độc thoại nội tâm trách móc ngầm; câu thứ ba chuyển về trần thuật ngôi thứ ba dùng `nó` theo đúng `DEC-P01-001`."
    pov_and_voice: "Sự chuyển dịch liền mạch từ cơn giận dữ trong tâm tưởng sang thái độ đáp lời bên ngoài."
    modality_and_logic: "Bảo toàn trọn vẹn 3 câu: câu 1 trách không biết nhìn tình hình; câu 2 đặt điều kiện rằng đã cản trở bữa ăn ngon hiếm hoi nơi tiền tuyến thì việc đó phải vô cùng quan trọng; câu 3 nêu việc nó không kìm được mà đáp cộc lốc dù biết là phản ứng cảm tính."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000064
    terms:
      - "Trung úy Weiss"
    pronouns_and_address: "Tanya tự xưng `Tôi` và gọi `Trung úy Weiss`."
    pov_and_voice: "Giọng nhắc nhở lạnh lùng pha chút bất mãn của cấp trên."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu và câu thoại `“…Tôi đang ăn, Trung úy Weiss.”`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000065
    terms:
      - "cấp dưới"
      - "cấp trên"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Tanya ở câu 1 bằng `nó`, và quy chiếu `cấp dưới` khái quát bằng `họ` / `mình`."
    pov_and_voice: "Trần thuật phân tích tâm lý tổ chức và tính chất khác thường của tình huống."
    modality_and_logic: "Bảo toàn đầy đủ 5 câu: giọng không hẳn trách móc nhưng phảng phất bất mãn; hầu hết cấp dưới sẽ chần chừ nếu cấp trên nói giọng đó; chẳng ai muốn chọc giận sếp; nhưng trong tình huống bất thường họ không nhượng bộ; và đây là một trong những trường hợp hiếm hoi ấy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000066
    terms: []
    pronouns_and_address: "Trung úy Weiss tự xưng `Tôi`."
    pov_and_voice: "Lời cáo lỗi lịch sự nhưng kiên quyết vì tính chất công việc."
    modality_and_logic: "Bảo toàn quan hệ nhượng bộ – đối lập: xin lỗi nhưng việc này khá khẩn cấp."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000067
    terms:
      - "bản tin mã hóa ngắn"
      - "ống đựng thông điệp"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Weiss bằng `anh ta` và Tanya bằng `nó` theo đúng `DEC-P01-001`."
    pov_and_voice: "Trực giác nhạy bén của Tanya khi quan sát hình thức văn bản được trình lên."
    modality_and_logic: "Bảo toàn cấu trúc phủ định – đối lập (`một bản tin mã hóa ngắn chứ không phải ống đựng thông điệp`) và hệ quả nhận thức (`nó ngửi thấy mùi rắc rối`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000068
    terms:
      - "mệnh lệnh"
    pronouns_and_address: "Câu hỏi ngắn của Tanya không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng ngạc nhiên xen lẫn nghi vấn của Tanya."
    modality_and_logic: "Bảo toàn thán từ nghi vấn và câu hỏi phủ định `“Ừm? Không phải mệnh lệnh à?”`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000069
    terms:
      - "mệnh lệnh"
      - "điện tín"
    pronouns_and_address: "Trần thuật thuyết minh không dùng đại từ nhân xưng."
    pov_and_voice: "Lời giải thích ngắn gọn về quy trình truyền đạt mệnh lệnh thông thường."
    modality_and_logic: "Bảo toàn nhận định: thông thường mệnh lệnh được gửi bằng điện tín."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000070
    terms:
      - "chỉ huy"
      - "nhân viên vô tuyến"
    pronouns_and_address: "Trần thuật dùng danh từ `chỉ huy` và đại từ quy chiếu `ngài` (xem thêm finding `m2`)."
    pov_and_voice: "Thuyết minh quy tắc bảo mật thư tín chỉ huy tại đơn vị."
    modality_and_logic: "Bảo toàn cấu trúc điều kiện – ngoại trừ: nếu gửi cho chỉ huy thì ngoài nhân viên vô tuyến ra, không ai được đọc trước."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000071
    terms:
      - "bản tin mã hóa ngắn"
      - "điện tín"
    pronouns_and_address: "Trần thuật thuyết minh quy chiếu nội dung cần truyền đạt bằng `việc đó`."
    pov_and_voice: "Kết luận logic từ quy trình ở `p000069`–`p000070`."
    modality_and_logic: "Bảo toàn quan hệ hệ quả và hai trường hợp phủ định: bản tin mã hóa ngắn được dùng khi việc đó không cần hoặc không thể gửi bằng điện tín."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000072
    terms: []
    pronouns_and_address: "Độc thoại nội tâm của Tanya quy chiếu sự việc bằng `chuyện này`."
    pov_and_voice: "Phán đoán châm biếm đầy bi quan của Tanya."
    modality_and_logic: "Bảo toàn cấu trúc lựa chọn tăng tiến (`hoặc sẽ ngu ngốc, hoặc sẽ cực kỳ phiền phức *và* ngu ngốc`)."
    emphasis: "Bảo toàn chính xác liên từ nhấn mạnh `*và*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0028.xhtml/p000073
    terms:
      - "được triệu đến trình diện ngay lập tức"
    pronouns_and_address: "Trung úy Weiss đáp `Không ạ` và gọi Tanya là `cô` (xem thêm finding `m1`)."
    pov_and_voice: "Câu trả lời nghiêm túc báo nội dung triệu tập."
    modality_and_logic: "Bảo toàn phủ định kèm thông báo lệnh triệu tập trình diện ngay lập tức."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000074
    terms:
      - "Được triệu đến trình diện ngay lập tức"
    pronouns_and_address: "Tanya tự xưng `Tôi`."
    pov_and_voice: "Câu hỏi lặp lại để xác nhận trước khi tiếp nhận mệnh lệnh gọn gàng đúng tác phong quân nhân."
    modality_and_logic: "Bảo toàn cả câu hỏi xác nhận và câu đáp `Tôi hiểu rồi.`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000075
    terms: []
    pronouns_and_address: "Độc thoại nội tâm cảm thán không dùng đại từ nhân xưng."
    pov_and_voice: "Tiếng thở dài ngao ngán trong nội tâm Tanya."
    modality_and_logic: "Bảo toàn thán từ và câu cảm thán `Chậc, đúng là khổ thật.`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000076
    terms: []
    pronouns_and_address: "Độc thoại nội tâm quy chiếu tình hình sắp tới bằng `Thế này`."
    pov_and_voice: "Dự cảm u ám của Tanya khép lại Chương 5."
    modality_and_logic: "Bảo toàn dự đoán tương lai: thế này sẽ khủng khiếp lắm đây."
    emphasis: "none"
