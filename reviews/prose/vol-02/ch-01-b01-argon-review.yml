  - YS-LN02/Text/part0008.xhtml/p000018
  - YS-LN02/Text/part0008.xhtml/p000019
  - YS-LN02/Text/part0008.xhtml/p000020
  volume: vol-02
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các lựa chọn tạm đã xác lập trong handoff `handoffs/vol-02/ch-01-b01.yml`, phân biệt rõ lời trần thuật (lặp tên `Tanya` cho Tanya, dùng `anh` cho Lergen) với độc thoại nội tâm tự quy chiếu (`mình`) và lời thầm cảm thán trung tính với Thượng đế."
