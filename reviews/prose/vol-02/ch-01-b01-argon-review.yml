  locks:
  - "Giữ tên riêng `Tanya` ở các câu trần thuật, giữ điểm nhìn độc thoại nội tâm ngôi thứ nhất `mình` kèm sắc thái khả năng `dường như sẽ ... có thể nhảy chân sáo` ở câu thứ hai, và giữ lời thì thầm trung tính `“Thượng đế ơi, cảm ơn vì cơ hội một phần triệu này.”`."
