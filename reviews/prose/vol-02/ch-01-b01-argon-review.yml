  proposed_vi: "Thiếu tá chỉ huy tiểu đoàn von Degurechaff (part0008/p000001) / điện báo viên, Bộ chỉ huy, lực lượng không quân địch (part0008/p000002, p000003, p000004, p000010, p000016, p000019) / liên lạc hữu tuyến, vô tuyến, FAC Dacia (part0008/p000003; khai triển tạm trong sổ: kiểm soát không quân tiền phương) / Thiếu tá von Degurechaff (part0008/p000004) / Lergen, Trung tá von Lergen (part0008/p000005, p000018) / lực lượng yểm trợ trên không của địch (part0008/p000007, p000008) / ưu thế tương đối trên không, Đế quốc, Norden, Rhine (part0008/p000009) / ưu thế tuyệt đối, ưu thế tuyệt đối trên không (part0008/p000010, p000017) / quân đội Công quốc Dacia (part0008/p000011) / Thượng đế ơi (part0008/p000015) / sáu trăm nghìn quân Dacia (part0008/p000018) / lệnh triển khai, buổi báo cáo (part0008/p000019) / Tiểu đoàn Pháp sư Không quân 203, dãy Alpen, Kinh nghiệm chiến đấu, tinh thần đồng đội, phép thử bằng lửa đạn, thao trường (part0008/p000020)"
  alternatives_vi:
  - kiểm soát viên không quân tiền phương / tiền sát viên không quân (thay cho việc giữ nguyên chữ viết tắt `FAC` trong văn bản `FAC Dacia` và khai triển tạm `kiểm soát không quân tiền phương` trong sổ tại part0008/p000003 — ưu tiên giữ `FAC` trong bản dịch và khai triển không có chữ `viên` trong sổ vì ngữ cảnh hiện tại chưa xác định rõ đây là cá nhân hay đài/đơn vị điều phối) / Lạy Thượng đế hoặc Lạy Chúa (thay cho `Thượng đế ơi` tại part0008/p000015 — ưu tiên `Thượng đế ơi` để đồng bộ với đề xuất tạm ở Tập 1 và giữ sắc thái cảm thán trung tính, không tự thêm quan hệ bề tôi hay cha–con)
