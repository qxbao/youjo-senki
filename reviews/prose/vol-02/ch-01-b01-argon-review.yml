- source_term: tanya_and_lergen_narration_and_interior_pronouns_vol02_ch01_b01
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng cách lặp lại tên riêng `Tanya` hoặc lược chủ ngữ khi không mơ hồ (part0008/p000002, p000003, p000006, p000014, p000015, p000016, p000017, p000019, p000020), dùng `mình` ở cụm sở hữu phản thân (part0008/p000006); độc thoại nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` nhất quán (part0008/p000011, p000012, p000015) và ngôi thứ nhất số nhiều chỉ phía Đế quốc dùng `chúng ta` (part0008/p000013); lời cầu cảm thán buột miệng của Tanya gọi `Thượng đế ơi` và lược đại từ nhân xưng để giữ trung tính (part0008/p000015); trần thuật quy chiếu Trung tá von Lergen bằng `anh` (part0008/p000005, p000018, p000019)"
  alternatives_vi:
  - nó hoặc cô (thay cho việc lặp tên `Tanya` trong trần thuật tại part0008/p000002, p000003, p000006, p000014–p000017, p000019 — ưu tiên lặp tên `Tanya` hoặc lược chủ ngữ theo đúng lựa chọn tạm đã signoff trong handoff `vol02-ch01-b01-tanya-narration` để tránh tự mở rộng đại từ khi chưa chốt quy ước đại từ trần thuật cho Tập 2) / tôi (thay cho `mình` trong độc thoại nội tâm của Tanya tại part0008/p000011, p000012, p000015 — ưu tiên `mình` theo `DEC-P01-001` và `vol02-ch01-b01-interior-self-reference`)
  segment_ids:
  - YS-LN02/Text/part0008.xhtml/p000002
  - YS-LN02/Text/part0008.xhtml/p000003
  - YS-LN02/Text/part0008.xhtml/p000005
  - YS-LN02/Text/part0008.xhtml/p000006
