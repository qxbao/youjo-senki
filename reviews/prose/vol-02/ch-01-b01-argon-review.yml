- segment_id: YS-LN02/Text/part0008.xhtml/p000018
  locks:
  - "Giữ danh xưng `Trung tá von Lergen`, đại từ `anh` và con số `sáu trăm nghìn quân Dacia đã vượt biên giới`."
- segment_id: YS-LN02/Text/part0008.xhtml/p000019
  locks:
  - "Giữ đại từ `anh` quy chiếu Lergen, tên riêng `Tanya`, các cụm `lệnh triển khai của đơn vị`, `buổi báo cáo` và `Bộ chỉ huy`."
- segment_id: YS-LN02/Text/part0008.xhtml/p000020
  locks:
  - "Giữ các danh xưng và thuật ngữ `Tiểu đoàn Pháp sư Không quân 203`, `dãy Alpen`, `Tanya`, `“Kinh nghiệm chiến đấu.”`, `tinh thần đồng đội`, `phép thử bằng lửa đạn` và `thao trường`."
