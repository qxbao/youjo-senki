  volume: vol-02
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, cơ quan tham mưu, địa danh, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1, Chương 1 Tập 2 và B01–B03 Chương 2 Tập 2 (`Tiểu đoàn Pháp sư Không quân 203`, `Bộ Tổng tham mưu`, `Trung úy Weiss`, `phó chỉ huy`, `sĩ quan phụ tá`, `cụm tập đoàn quân`, `Đế quốc`, `Tổ quốc`, `Hoàng đế Bệ hạ`, `Dacia`, `Norden`, `pháp sư`, `công nghệ ma pháp`), đồng thời khóa tạm các ẩn dụ lịch sử – tôn giáo và thuật ngữ tổ chức tác chiến xuất hiện trong bài huấn thị của Tanya và thông báo của Weiss (`cuộc cách mạng tầm Copernicus`, `sự hoán cải của Thánh Paul`, `những con chó chọi`, `những kẻ tinh hoa thuần chủng`, `thử thách của lửa và thép`, `chiến tranh du kích`, `cuộc diễn tập bắn đạn thật`, `cơn sốt chiến tranh`, `quản lý nhân sự`, `tiểu đoàn cơ động`, `đơn vị độc lập`, `quyền tự chủ`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_203rd_battalion_address_and_monologue_pronouns_vol02_ch02_b04
  proposed_vi: "Trong phân cảnh Tanya huấn thị Tiểu đoàn Pháp sư Không quân 203 và bàn giao phần phổ biến chi tiết cho Trung úy Weiss (part0014/p000072–p000092): tuân thủ nghiêm ngặt `DEC-P01-001` và quyết định tạm `P01-tanya-narration-ch01`, độc thoại nội tâm trực tiếp của Tanya tự quy chiếu ngôi thứ nhất bằng `mình` xuyên suốt (p000072, p000077–p000079, p000085–p000087, p000089), kết hợp dùng đại từ bao gộp `chúng ta` / `Chúng ta` khi suy ngẫm với tư cách toàn đơn vị (p000091, p000092); trong các câu trần thuật ngôi thứ ba và độc thoại tự nhìn nhận bản thân từ góc nhìn chỉ huy (p000073, p000074, p000081, p000084), định danh bằng tên riêng `Tanya` và tránh dùng `cô`; quy chiếu tập thể binh sĩ Tiểu đoàn 203 và Bộ Tổng tham mưu bằng `họ` / `Họ` (p000072, p000073, p000077, p000078, p000085–p000087, p000092). Trong lời thoại trực tiếp trước toàn tiểu đoàn: Tanya gọi các thuộc cấp là `Các vị` (p000075, p000080) và dùng `chúng ta` cho toàn đơn vị (p000074, p000088); toàn thể binh sĩ đồng thanh đáp `Rõ, thưa chỉ huy!` (p000083); Trung úy Weiss mở đầu báo cáo với Tanya bằng `Thưa chỉ huy`, sau đó hướng về toàn đơn vị gọi `các vị` và nhắc tới Tanya là `chỉ huy của chúng ta` (p000090)"
  alternatives_vi:
  - Các anh (thay cho `Các vị` khi Tanya gọi toàn tiểu đoàn tại part0014/p000075, p000080 và khi Weiss nói với đơn vị tại p000090 — ưu tiên `Các vị` / `các vị` theo đúng quy ước plural-address đã khóa tại `handoffs/vol-02/ch-02-b04.yml` để giữ sắc thái quân phong trang trọng và không tự suy diễn giới tính của toàn bộ thành viên trong đơn vị theo `DEC-P01-001`) / cô (thay cho việc lặp tên riêng `Tanya` ở các câu trần thuật tại part0014/p000081, p000084 — bắt buộc tránh `cô` theo `DEC-P01-001` và `P01-tanya-narration-ch01`)
