  volume: vol-02
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán đại từ nội tâm tự quy chiếu `mình` của Tanya, quy ước lặp tên `Tanya` trong trần thuật (tránh `cô`), và hệ thống hô gọi quân sự `Các vị` – `Thưa chỉ huy` – `chỉ huy của chúng ta` – `chúng ta` giữa Tanya, Trung úy Weiss và toàn thể Tiểu đoàn 203."
