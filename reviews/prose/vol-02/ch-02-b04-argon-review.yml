- source_term: 203rd_battalion_norden_briefing_and_mobile_battalion_terms_vol02_ch02_b04
  proposed_vi: "Tiểu đoàn Pháp sư Không quân 203, Bộ Tổng tham mưu, chỉ huy, Trung úy Weiss, Dacia, cuộc cách mạng tầm Copernicus, sự hoán cải của Thánh Paul (part0014/p000073, p000074, p000080, p000088, p000090–p000092) / Norden, những con chó chọi, bầy chó lai hèn nhát, những kẻ tinh hoa thuần chủng (part0014/p000074) / thử thách của lửa và thép (part0014/p000075) / Mỹ, thời kỳ Đồ đá, chiến tranh du kích, vùng Vịnh, Iraq (part0014/p000076, p000077) / Đế quốc, cường quốc hàng đầu thế giới (part0014/p000077, p000086, p000089) / công nghệ ma pháp, nhà khoa học điên (part0014/p000078) / cuộc diễn tập bắn đạn thật (part0014/p000080) / cơn sốt chiến tranh (part0014/p000081) / Hoàng đế Bệ hạ, Tổ quốc, vị hoàng đế (part0014/p000082, p000086) / quản lý nhân sự (part0014/p000085) / pháp sư (part0014/p000087) / phó chỉ huy, sĩ quan phụ tá (part0014/p000089) / tiểu đoàn cơ động, cụm tập đoàn quân, đơn vị độc lập, quyền tự chủ (part0014/p000090–p000092)"
  alternatives_vi:
  - cuộc cách mạng kiểu Copernicus (thay cho `cuộc cách mạng tầm Copernicus` tại part0014/p000073 — ưu tiên `cuộc cách mạng tầm Copernicus` theo đúng lựa chọn đã duyệt tại `handoffs/vol-02/ch-02-b04.yml` vì nhấn mạnh đúng quy mô và tầm vóc thay đổi nhận thức sau trận thực chiến đầu tiên) / cuộc cải đạo của Thánh Paul (thay cho `sự hoán cải của Thánh Paul` tại part0014/p000073 — ưu tiên `sự hoán cải của Thánh Paul` vì chuẩn xác điển tích tôn giáo về sự thay đổi nhận thức đột ngột trên đường Damascus hơn là đổi tôn giáo) / tiểu đoàn lưu động (thay cho `tiểu đoàn cơ động` tại part0014/p000090, p000091 — ưu tiên `tiểu đoàn cơ động` vì chuẩn thuật ngữ tác chiến quân sự chỉ đơn vị phản ứng nhanh trực thuộc Bộ Tổng tham mưu, tách biệt với các đơn vị biên chế cố định theo `cụm tập đoàn quân`)
