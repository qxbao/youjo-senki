findings:
  - severity: "serious"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000684"
    category: "pronouns_and_speaker"
    issue: "Nhầm chủ thể phát ngôn và đại từ ngôi thứ hai trong câu thoại ngắn. Sau khi Uger nói mình đi làm việc cho Tướng von Zettour và hỏi ngược lại Tanya ở p000682, Tanya suy đoán ở p000683 rồi chính Tanya là người hỏi Uger ở p000684 xem ông có biết thông tin gì không; nhờ vậy ở p000685 Uger mới ngập ngừng đáp rằng có thể kể cho cô và tiết lộ tin mật của ngành đường sắt ở p000688. Bản dịch hiện dùng đại từ 'Cô' ở p000684 khiến Uger vừa tự hỏi Tanya vừa tự trả lời ở câu kế tiếp."
    recommendation: "Đổi đại từ ngôi thứ hai ở p000684 từ 'Cô' sang 'Ông' ('“Ông biết chuyện gì sao?”')."
  - severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000674"
    category: "pronouns_and_viewpoint"
    issue: "Tại p000674, câu đầu p000675 và p000681, bản dịch dùng 'tôi'/'chúng tôi' cho phần tự thuật/độc thoại ngôi thứ nhất của Tanya, nhưng ngay câu thứ hai của p000675 và toàn bộ các đoạn nội tâm còn lại trong lô lại dùng 'mình' theo DEC-P01-001. Ngoài ra, ở p000674 gọi Uger là 'ông ta' mang sắc thái xa cách hơn so với 'ông ấy' ở các đoạn liền sau."
    recommendation: "Thống nhất đại từ tự quy chiếu ngôi thứ nhất của Tanya ngoài thoại là 'mình' ở p000674, p000675 (ở p000681 dùng 'mình và ông ấy' hoặc 'hai chúng mình'), đồng thời đổi 'ông ta' ở p000674 thành 'ông ấy'."
  - severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000681"
    category: "omission"
    issue: "Bản dịch lược mất danh từ giải thích nhấn mạnh ở cuối câu sau dấu gạch ngang dài (khái niệm chỉ mạng lưới quan hệ/mối dây liên hệ, tạo tiền đề trực tiếp cho p000687)."
    recommendation: "Khôi phục thành phần giải thích sau dấu gạch ngang ở cuối câu, chẳng hạn: '...vẫn thúc đẩy các sĩ quan gắn kết với nhau—tạo thành những mối dây liên hệ.'"
  - severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000689"
    category: "terminology_and_meaning"
    issue: "Cụm danh từ chỉ các sĩ quan ngoài mặt trận/tác chiến (field officers) bị dịch rút gọn thành 'các sĩ quan', làm mất nét nghĩa đối lập giữa sĩ quan tác chiến ngoài tiền tuyến được vận chuyển (Tanya) và sĩ quan hậu phương lập kế hoạch vận chuyển (Uger)."
    recommendation: "Bổ sung định ngữ thành 'các sĩ quan tác chiến được vận chuyển' hoặc 'các sĩ quan mặt trận được vận chuyển'."
  - severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000682"
    category: "pending_term_consistency"
    issue: "Tại p000682 và p000707, 'General von Zettour' đang được dịch là 'Tướng quân von Zettour', chưa khớp với phương án tạm 'Tướng von Zettour' trong work/run-state/pending-terms-index.yml của vol-02."
    recommendation: "Đổi 'Tướng quân von Zettour' thành 'Tướng von Zettour' tại p000682 và p000707."
  - severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000676"
    category: "terminology_consistency"
    issue: "Tên cơ quan 'Railroad Department' tại p000676, p000688 và p000690 là danh từ riêng chỉ cơ quan thuộc quân đội (đặt song song với 'Logistics' và 'General Staff'), nhưng đang được viết thường là 'cơ quan đường sắt'."
    recommendation: "Thống nhất viết hoa tên cơ quan là 'Cục Đường sắt' (hoặc 'Ban Đường sắt' / 'Cơ quan Đường sắt') tại p000676, p000688 và p000690."
  - severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000677"
    category: "meaning_and_logic"
    issue: "Ở câu cuối p000677, giới từ chỉ tương quan đối chiếu ('for someone not serving on a battlefield') khi dịch là 'Với một người không phục vụ ở chiến trường, có lẽ ông ấy sẽ nhanh chóng lên đến trung tá' dễ bị đọc nhầm thành nguyên nhân thuận chiều thay vì sự tương phản (dù không phục vụ ngoài chiến trường nhưng vẫn thăng tiến khá nhanh)."
    recommendation: "Chỉnh lại thành: 'So với một người không phục vụ ngoài chiến trường, có lẽ ông ấy sẽ lên đến trung tá khá nhanh.'"
  - severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000703"
    category: "pending_term_consistency"
    issue: "Cụm 'economic, rational sensibilities' được dịch là 'óc kinh tế và lý trí', chưa tách bạch giữa 'sensibility' (khả năng cảm nhận/cảm quan) với 'lý trí' theo lưu ý tại P01-sensibility và P03-rationality trong canon/glossary-pending.yml."
    recommendation: "Chỉnh thành 'cảm quan kinh tế và tính hợp lý của mình' (đồng bộ với cách dịch ở p000704)."
