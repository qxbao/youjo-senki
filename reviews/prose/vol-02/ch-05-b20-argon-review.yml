    terms:
      - "thư quân đội"
    pronouns_and_address: "Trần thuật khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Trần thuật bổ sung đặc thù của đường thư quân sự."
    modality_and_logic: "Bảo toàn quan hệ nhân quả – nhượng bộ: vì là thư quân đội nên đôi khi bị chậm trễ, nhưng nhìn chung vẫn có thể gửi và nhận như thư thông thường."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000508
    terms:
      - "Tanya"
      - "thân nhân"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng tên riêng `Tanya`, tránh dùng `cô` theo `DEC-P01-001` và `P01-tanya-narration-ch01`."
    pov_and_voice: "Trần thuật điểm nhìn Tanya nêu hoàn cảnh cá nhân không có người thân."
    modality_and_logic: "Bảo toàn nhận định hiển nhiên: một người không có thân nhân như Tanya thì chẳng có thư từ cá nhân nào để viết."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000509
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng tên riêng `Tanya`."
    pov_and_voice: "Trần thuật làm rõ phạm vi viết thư của Tanya."
    modality_and_logic: "Bảo toàn giới hạn: chỉ viết thư vì công việc chính thức hoặc không chính thức mà thôi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000510
    terms:
      - "thư công vụ"
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng tên riêng `Tanya`."
    pov_and_voice: "Trần thuật khắc họa sự ngập ngừng hiếm thấy của Tanya trước một bức thư công vụ đặc biệt."
    modality_and_logic: "Bảo toàn sự đối lập: lần này viết vì việc công, thế nhưng trong một trường hợp hiếm hoi, Tanya lại rụt rè lấy giấy viết thư ra và ngòi bút lướt đi đầy lúng túng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000511
    terms:
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba lược chủ ngữ câu đầu và dùng tên riêng `Tanya` ở câu hai."
    pov_and_voice: "Trần thuật đối chiếu thái độ làm việc thường ngày với sự nặng nề trong ngày hôm nay."
    modality_and_logic: "Bảo toàn 3 câu: đã từng viết cả đống văn bản kiểu này; thường chỉ coi là công việc rồi giải quyết cho xong; nhưng hôm nay đầu ngòi bút lại nặng trĩu."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000512
    terms: []
    pronouns_and_address: "Câu bình luận nội tâm dùng chủ ngữ khái quát `một người`."
    pov_and_voice: "Giọng tự nhủ mở đầu cho nội dung bức thư kỳ quặc bên dưới."
    modality_and_logic: "Bảo toàn cấu trúc giả định: một người mà có thể viết lá thư này không chút khó khăn nào thì mới là chuyện lạ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000513
    terms:
      - "Chuẩn úy Anluk E. Kahteijanen"
    pronouns_and_address: "Dòng mở đầu thư trang trọng gửi gia đình của Chuẩn úy Anluk E. Kahteijanen."
    pov_and_voice: "Văn phong thư công vụ gửi thân nhân quân nhân."
    modality_and_logic: "Bảo toàn đầy đủ lời chào đầu thư và danh xưng cấp bậc Chuẩn úy Anluk E. Kahteijanen."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000514
    terms:
      - "Thiếu tá Pháp sư Tanya von Degurechaff"
      - "cấp trên"
    pronouns_and_address: "Trong thư, Tanya tự xưng `Tôi` và quy chiếu Chuẩn úy Kahteijanen bằng `anh ấy`."
    pov_and_voice: "Văn phong thư công vụ trang trọng, chuẩn mực."
    modality_and_logic: "Bảo toàn câu tự giới thiệu cấp bậc, họ tên và tư cách là sĩ quan cấp trên của Kahteijanen."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000515
    terms:
      - "Anluk E. Kahteijanen"
      - "giải ngũ vì thương tật"
    pronouns_and_address: "Tanya tự xưng `Tôi` và gọi gia đình người lính một cách kính trọng là `quý vị`."
    pov_and_voice: "Văn phong thông báo tin buồn trang trọng của cấp chỉ huy."
    modality_and_logic: "Bảo toàn thông báo lấy làm tiếc rằng người con duy nhất của gia đình là Anluk E. Kahteijanen sẽ được giải ngũ vì thương tật."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000516
    terms:
      - "nhiệm vụ tác chiến"
      - "bác sĩ phẫu thuật"
    pronouns_and_address: "Quy chiếu Kahteijanen trong thư bằng `anh`."
    pov_and_voice: "Giọng văn hành chính quân y trình bày nguyên nhân giải ngũ một cách lịch sự, giữ thể diện cho quân nhân."
    modality_and_logic: "Bảo toàn hai vế: anh đột ngột đổ bệnh trong một nhiệm vụ tác chiến, và bác sĩ phẫu thuật nhận định anh khó có thể chịu đựng thời gian phục vụ quân ngũ kéo dài."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000517
    terms:
      - "dưỡng bệnh"
      - "bệnh viện quân y"
    pronouns_and_address: "Quy chiếu Kahteijanen trong thư bằng `anh`."
    pov_and_voice: "Văn phong thông báo hướng điều trị phục hồi."
    modality_and_logic: "Bảo toàn mức độ khả năng (`Nhiều khả năng`) và hai lựa chọn nơi tịnh dưỡng: cần một thời gian dưỡng bệnh dài ở nhà hoặc tại bệnh viện quân y để hồi phục."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000518
    terms:
      - "Cục Nhân sự"
      - "phương án điều trị"
    pronouns_and_address: "Câu trần thuật hành chính trong thư không dùng đại từ."
    pov_and_voice: "Văn phong xác nhận quyết định phê duyệt của cơ quan nhân sự quân đội."
    modality_and_logic: "Bảo toàn thông tin Cục Nhân sự đã đồng ý tiến hành phương án điều trị này."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000519
    terms:
      - "dưỡng bệnh"
    pronouns_and_address: "Quy chiếu Kahteijanen bằng `anh ấy`."
    pov_and_voice: "Lời nhắn nhủ ân cần của chỉ huy gửi tới gia đình quân nhân."
    modality_and_logic: "Bảo toàn lời đề nghị gia đình trò chuyện với anh ấy và đảm bảo anh ấy có kỳ dưỡng bệnh yên tĩnh."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000520
    terms: []
    pronouns_and_address: "Tanya đại diện đơn vị tự xưng `chúng tôi` và gọi gia đình là `quý vị`."
    pov_and_voice: "Lời xin lỗi trang trọng của người chỉ huy khi trả người lính về gia đình trong tình trạng bệnh tật."
    modality_and_logic: "Bảo toàn lời xin gia đình thứ lỗi vì đã đưa con của họ trở về trong tình trạng như vậy."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000521
    terms:
      - "pháp sư"
      - "người đồng đội"
    pronouns_and_address: "Quy chiếu Kahteijanen bằng `Anh ấy` và đơn vị bằng `chúng tôi`."
    pov_and_voice: "Lời ca ngợi phẩm chất quân nhân trang trọng trong thư gửi gia đình."
    modality_and_logic: "Bảo toàn đầy đủ các phẩm chất: là một pháp sư xuất sắc, người đồng đội không thể thay thế, dũng cảm và được mọi người tin cậy."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000522
    terms:
      - "Anluk E. Kahteijanen"
      - "hàng ngũ"
    pronouns_and_address: "Tanya đại diện đơn vị dùng `Chúng tôi`."
    pov_and_voice: "Lời bày tỏ niềm tiếc nuối chính thức của đơn vị."
    modality_and_logic: "Bảo toàn thông điệp đau buồn khi từ nay không còn Anluk E. Kahteijanen trong hàng ngũ."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000523
    terms:
      - "Huy hiệu Phục vụ Chiến trường Hạng Nhất"
      - "Huân chương Thương tật"
    pronouns_and_address: "Tanya tự xưng `tôi` và quy chiếu Kahteijanen bằng `anh ấy`."
    pov_and_voice: "Giọng văn chuẩn mực thông báo chế độ khen thưởng để an ủi gia đình."
    modality_and_logic: "Bảo toàn mệnh đề nhượng bộ và kết quả: dẫu biết chỉ là chút an ủi nhỏ nhoi, Tanya đã đề cử anh nhận Huy hiệu Phục vụ Chiến trường Hạng Nhất cùng Huân chương Thương tật và cả hai đều đã được phê chuẩn."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000524
    terms: []
    pronouns_and_address: "Tanya tự xưng `Tôi` và quy chiếu Kahteijanen bằng `anh ấy`."
    pov_and_voice: "Lời chúc bình phục cuối thư."
    modality_and_logic: "Bảo toàn lời chúc mong anh ấy hồi phục hoàn toàn."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn câu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000525
    terms: []
    pronouns_and_address: "Công thức kết thư trang trọng (`Trân trọng,`)."
    pov_and_voice: "Văn phong thư tín chính thức."
    modality_and_logic: "Bảo toàn lời chào kết thư."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000526
    terms:
      - "Chỉ huy đơn vị"
      - "Lục quân Đế quốc"
      - "Thiếu tá Pháp sư Tanya von Degurechaff"
    pronouns_and_address: "Chữ ký chức danh và quân hàm đầy đủ kèm ký hiệu che tên đơn vị `[xxx]`."
    pov_and_voice: "Văn phong ký tên công văn/thư tín quân đội thời chiến."
    modality_and_logic: "Bảo toàn nguyên vẹn ký hiệu kiểm duyệt `[xxx]`, chức danh chỉ huy đơn vị, quân chủng Lục quân Đế quốc và quân hàm Thiếu tá Pháp sư Tanya von Degurechaff."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` toàn dòng tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000527
    terms:
      - "phi công Thunderbolt Mỹ"
      - "cựu binh"
      - "ngộ độc thực phẩm"
    pronouns_and_address: "Độc thoại nội tâm của Tanya sau dấu ngắt cảnh (`space-break1`) tự xưng `mình` theo đúng `DEC-P01-001`."
    pov_and_voice: "Cú lật giọng hài hước đen tối: từ bức thư bi tráng chuyển thẳng sang sự thật trớ trêu là ngộ độc khoai tây hỏng."
    modality_and_logic: "Bảo toàn cả hai câu: nỗi ngỡ ngàng khi có ngày mất một người lính vì mấy củ khoai tây hỏng; và sự kiểm chứng giai thoại của một phi công Thunderbolt Mỹ rằng ngay cả lính kỳ cựu/cựu binh cũng không thắng nổi ngộ độc thực phẩm."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000528
    terms:
      - "Tanya"
      - "hậu cần"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng tên riêng `Tanya`, không dùng `cô` theo `DEC-P01-001`."
    pov_and_voice: "Độc thoại nội tâm in nghiêng kết hợp trần thuật ngôi thứ ba thể hiện sự bực bội với khâu hậu cần."
    modality_and_logic: "Bảo toàn câu kết luận nội tâm rằng đám khoai tây đó đúng là đã hỏng thật (nối lại chi tiết khoai tây ở `ch-05-b18` `p000443`), cùng hành động Tanya cất bút và nỗi bực dọc trước tình hình hậu cần ngày một tệ."
    emphasis: "Bảo toàn chính xác 1 câu đầu trong `*...*` tương ứng thẻ `<html:em>` (`*Vậy là khoai tây đúng là bị hỏng thật.*`) theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000529
    terms:
      - "cấp dưới"
      - "cấp trên"
      - "Tanya"
    pronouns_and_address: "Độc thoại nội tâm in nghiêng dùng `mình`; câu trần thuật ngôi thứ ba lặp lại tên `Tanya` (không dùng `cô`), từ `nó` quy chiếu `sự việc`."
    pov_and_voice: "Độc thoại nội tâm đan xen trần thuật khắc họa tâm trạng dở khóc dở cười của Tanya."
    modality_and_logic: "Bảo toàn sự tương phản: viết thư cho gia đình khi cấp dưới gặp chuyện là trách nhiệm của cấp trên và Tanya không hề phản đối việc viết thư, nhưng lý do lại là ngộ độc khoai tây khiến Tanya rối bời không sao gạt khỏi tâm trí được."
    emphasis: "Bảo toàn chính xác 1 câu đầu trong `*...*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000530
    terms:
      - "cuộc đột kích ban đêm"
      - "cựu binh"
      - "vũ khí NBC"
      - "pháp sư"
      - "thuật thức trị liệu"
      - "Màn bảo hộ"
    pronouns_and_address: "Hồi tưởng ngôi thứ nhất của Tanya quy chiếu Kahteijanen bằng `Anh ấy` / `anh ta` và tập thể đơn vị bằng `chúng tôi` (xem thêm finding `m1` về đại từ số ít)."
    pov_and_voice: "Tự sự hồi tưởng sinh động cảnh náo loạn đêm qua khi tưởng thuộc cấp trúng vũ khí hóa-sinh-hạt nhân mới."
    modality_and_logic: "Bảo toàn đầy đủ 6 câu: ăn xong đi đột kích đêm, lúc về nôn thốc tháo và kêu đau bụng dữ dội làm Tanya choáng váng; Tanya sững người; thấy một lính kỳ cựu quằn quại như vậy nên đinh ninh đã trúng vũ khí NBC vốn có tác dụng cả với pháp sư; vội thi triển thuật thức trị liệu nhưng chỉ làm dịu cơn đau; vì màn bảo hộ vốn che chắn toàn diện trước NBC nên cả đơn vị suýt hoảng loạn tưởng địch vừa phát triển vũ khí mới chưa có trong danh mục."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000531
    terms:
      - "bác sĩ phẫu thuật"
      - "ngộ độc thực phẩm cấp tính"
      - "Anluk E. Kahteijanen"
    pronouns_and_address: "Hồi tưởng ngôi thứ nhất số nhiều dùng `chúng tôi`, quy chiếu Kahteijanen bằng `anh` và họ tên đầy đủ."
    pov_and_voice: "Nhịp thở phào nhẹ nhõm pha lẫn sự trớ trêu khi biết chẩn đoán thực sự."
    modality_and_logic: "Bảo toàn 3 câu: bác sĩ phẫu thuật vội chạy tới khám thì cả bọn mới thở phào được; hóa ra chỉ là ngộ độc thực phẩm cấp tính đột ngột; và chỉ một mình anh chàng xui xẻo Anluk E. Kahteijanen mắc phải (chơi chữ `unlucky Anluk`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000532
    terms:
      - "pháp sư"
      - "tiền tuyến"
    pronouns_and_address: "Độc thoại của Tanya quy chiếu Kahteijanen bằng `anh ấy`, tự quy chiếu bằng `Tôi` / `mình`."
    pov_and_voice: "Lời chửi thề tiếc của khi mất đi một thuộc cấp giỏi vì lý do lãng xẹt."
    modality_and_logic: "Bảo toàn tiếng chửi thề tiếc nuối một pháp sư giỏi và suy nghĩ chưa từng ngờ sẽ phải tiễn người rời tiền tuyến theo cách này."
    emphasis: "none"

