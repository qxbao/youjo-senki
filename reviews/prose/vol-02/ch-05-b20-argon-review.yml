    pov_and_voice: "Tự sự ngôi thứ nhất thuật lại thao tác cất cánh đúng hiệp đồng thời gian."
    modality_and_logic: "Bảo toàn trình tự: làm đúng theo lệnh, 30 giây sau khởi động quả cầu tính toán hết công suất và cất cánh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000501
    terms:
      - "phòng tuyến"
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `Chúng tôi` / `mình` cho đơn vị và `tôi` / `Tôi` cho trải nghiệm cá nhân."
    pov_and_voice: "Câu ngắn dồn dập khắc họa nỗi khiếp đảm tột cùng giữa màn đạn pháo khi bay rút lui."
    modality_and_logic: "Bảo toàn trọn vẹn 6 câu: vội vã bay về phòng tuyến quân mình; chỉ mất vài phút; việc duy nhất phải làm chỉ là bay—đơn giản; nhưng thực tế thật khủng khiếp; tim đập thình thịch theo mỗi tiếng pháo nổ; đến thở cũng thấy đau."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000502
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `Tôi` kết hợp phản thân `mình` / `chính mình`."
    pov_and_voice: "Tự sự ngôi thứ nhất diễn tả trạng thái tê liệt cảm thức bản thân vì quá sợ hãi."
    modality_and_logic: "Bảo toàn quan hệ mức độ – hệ quả: sợ đến mức gần như không còn cảm thấy mình là chính mình nữa."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000503
    terms:
