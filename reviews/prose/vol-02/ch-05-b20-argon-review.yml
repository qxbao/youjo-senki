    pov_and_voice: "Tự sự ngôi thứ nhất mô tả khoảnh khắc xả hết căng thẳng khi thoát khỏi vùng nguy hiểm."
    modality_and_logic: "Bảo toàn quan hệ thời gian và mục đích: khi bay lên cao để tránh bị bắn nhầm và lập lộ trình an toàn về căn cứ hậu phương, mọi căng thẳng lập tức tan biến và cơn mệt mỏi ập tới."
