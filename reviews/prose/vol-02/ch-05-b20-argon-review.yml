    pronouns_and_address: "Tanya gọi các bộ phận trong đơn vị là `Đại đội`, `Lính mới` và dùng đại từ gộp `Chúng ta`."
    pov_and_voice: "Khẩu lệnh rút quân ngắn gọn, dứt khoát trên chiến trường."
    modality_and_logic: "Bảo toàn đầy đủ chuỗi mệnh lệnh: báo đã đến giờ; đại đội khiêng tù binh; lính mới làm nhiệm vụ yểm trợ; sau 30 giây lệnh cấm dùng ma pháp được dỡ bỏ để bay rút khỏi đó; đồng bộ đồng hồ và đếm ngược ba, hai, một, bắt đầu."
    emphasis: "none"

