    pronouns_and_address: "Độc thoại của Tanya quy chiếu Kahteijanen bằng `anh ấy`."
    pov_and_voice: "Tư duy thực dụng đặc trưng của Tanya: vừa bảo toàn quyền lợi và danh dự cho thuộc cấp, vừa giữ sạch hồ sơ cá nhân của bản thân."
