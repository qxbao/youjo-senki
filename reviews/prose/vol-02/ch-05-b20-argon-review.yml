    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi`, quy chiếu các mệnh lệnh bằng `chúng`."
    pov_and_voice: "Tự sự ngôi thứ nhất ghi nhận tác dụng cứu mạng của kỷ luật và huấn luyện quân sự."
    modality_and_logic: "Bảo toàn 4 câu: mệnh lệnh phát ra bằng giọng thì thầm bình tĩnh không chút nao núng kéo Grantz về thực tại; kết hợp với những gì được huấn luyện, chúng dần khiến cơ thể cử động; đó chính là điều anh đã được rèn luyện; và khóa huấn luyện đã cứu mạng anh."
    emphasis: "none"

