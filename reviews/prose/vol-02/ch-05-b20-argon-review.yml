findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000530
    category: pronoun_and_internal_voice_consistency
    issue: >-
      Trong phân cảnh hồi tưởng và độc thoại nội tâm của Tanya sau khi viết xong thư (`p000527`–`p000534`), đại từ tự quy chiếu ngôi thứ nhất số ít đang chuyển đổi giữa `mình` (tại `p000527`, `p000529` và câu 2 `p000534`) và `tôi` (tại `p000530`, `p000532`, `p000533` và câu 1 `p000534`).
    basis: >-
      Các đoạn `p000530`–`p000534` được viết ở ngôi thứ nhất không in nghiêng trong nguyên văn (nối tiếp phần thư công vụ xưng `tôi` ở `p000514`–`p000526` và đan xen đại từ số nhiều `chúng tôi` ở `p000530`–`p000531`), đồng thời ở các câu trần thuật ngôi thứ ba (`p000508`–`p000511`, `p000528`–`p000529`) bản dịch đã lặp lại tên `Tanya` và tuyệt đối không dùng `cô` theo đúng `DEC-P01-001` và `P01-tanya-narration-ch01`.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc đồng bộ đại từ tự quy chiếu ngôi thứ nhất số ít của Tanya tại `p000530`, `p000532`, `p000533` và đầu `p000534` về `mình` (giữ `chúng tôi` cho ngôi thứ nhất số nhiều chỉ đơn vị ở `p000530`–`p000531`) để thống nhất hoàn toàn với `p000527`, `p000529` theo `DEC-P01-001`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000514
    category: rank_and_redacted_title_nuance
    issue: >-
      Trong bức thư gửi gia đình Chuẩn úy Kahteijanen (`p000514`, `p000526`), quân hàm của Tanya được dịch là `Thiếu tá Pháp sư Tanya von Degurechaff` (trong khi mô hình ghép cấp bậc ở `chapter1_b01_pending_terms` và `ch-05-b18`/`b19` cho `Magic Second Lieutenant` là `Thiếu úy ma pháp` / `Thiếu úy Ma pháp`); ngoài ra tại dòng ký tên `p000526`, cụm chỉ chức vụ có phần phiên hiệu bị kiểm duyệt che khuất đang đặt ký hiệu `[xxx]` ở đầu (`*[xxx] Chỉ huy đơn vị, Lục quân Đế quốc, Thiếu tá Pháp sư Tanya von Degurechaff*`).
    basis: >-
      Nghĩa quân hàm và quy ước kiểm duyệt thư tín quân sự vẫn rõ ràng, trang trọng và nhất quán giữa hai lần xuất hiện trong thư (`p000514` và `p000526`).
    recommendation: >-
      Không chặn signoff; ở bước polish hoặc rà soát thuật ngữ toàn tập có thể cân nhắc đồng bộ thành `Thiếu tá Ma pháp Tanya von Degurechaff` và đảo trật tự danh ngữ tại `p000526` thành `*Chỉ huy Đơn vị [xxx], Lục quân Đế quốc, Thiếu tá Ma pháp Tanya von Degurechaff*` để tự nhiên hơn theo cú pháp tiếng Việt.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000527
    category: lexical_and_punctuation_markup_nuance
    issue: >-
      Tại `p000527` và `p000530`, từ chỉ người lính dày dạn kinh nghiệm đang tại ngũ được dịch là `cựu binh` (trong khi một số lô trước ưu tiên `lính kỳ cựu` để phân biệt với người lính đã xuất ngũ); bên cạnh đó, tại `p000513` và `p000525`, dấu phẩy cuối dòng mở đầu và dòng kết thư đang nằm trong cặp dấu `*...*` dù trong `xhtml` nguồn dấu phẩy nằm ngay sau thẻ đóng `</html:em>`.
    basis: >-
      Trong ngữ cảnh câu nói của phi công Thunderbolt Mỹ (`p000527`) và tình huống cấp cứu sau trận đột kích (`p000530`), nghĩa của `cựu binh` vẫn hoàn toàn rõ ràng, không gây hiểu lầm là quân nhân đã giải ngũ; vị trí dấu phẩy trong `*...*` ở `p000513`, `p000525` không ảnh hưởng đến hiển thị hay ngữ nghĩa của bức thư.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc đổi `cựu binh` ở `p000527`, `p000530` thành `lính kỳ cựu` và đưa dấu phẩy ra ngoài dấu `*` đóng ở `p000513`, `p000525` nếu muốn khớp từng ký tự với `xhtml` nguồn.
    resolution: optional_polish

