    pronouns_and_address: "Trần thuật khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Trần thuật giải thích điều kiện liên lạc thư tín tại hậu phương."
    modality_and_logic: "Bảo toàn 2 câu: ở căn cứ hậu phương thư từ vẫn chuyển đến được; dĩ nhiên khi cần thì có thể gửi thư."
    emphasis: "none"

