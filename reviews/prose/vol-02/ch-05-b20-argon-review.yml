    modality_and_logic: "Bảo toàn cả 3 câu: một sĩ quan để mất lính vì khoai tây hỏng thì người ta chỉ có nước cười nhạo; câu hỏi tu từ ai mà ngờ trong đơn vị mình lại có người bị chính cái dạ dày quật ngã; và câu tự phủ định khép đoạn rằng thực ra chẳng buồn cười chút nào."
