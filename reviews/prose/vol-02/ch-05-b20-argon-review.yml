    terms:
      - "Thiếu tá von Degurechaff"
    pronouns_and_address: "Trần thuật ngôi thứ ba sau dấu ngắt cảnh (`space-break1`) định danh `Thiếu tá von Degurechaff`, không dùng đại từ `cô`."
    pov_and_voice: "Chuyển sang trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya vào buổi sáng tại căn cứ hậu phương."
    modality_and_logic: "Bảo toàn trình tự thời gian và sắc thái: hôm nay, sau khi tập thể dục buổi sáng và ăn sáng xong, Thiếu tá von Degurechaff với vẻ như đã hạ quyết tâm liền với tay lấy bút."
    emphasis: "none"

