    pov_and_voice: "Đánh giá thực lực đối phương trên chiến trường Rhine."
    modality_and_logic: "Bảo toàn thế đối lập hai câu: Quân đội Cộng hòa trên các tuyến Rhine là đối thủ rất khó nhằn; tuy nhiên, nếu chỉ có mình Cộng hòa thì Đế quốc vẫn còn cơ hội chiến thắng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000573
    terms:
      - "đơn vị"
      - "Khối Thịnh vượng chung"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng đại từ sở hữu `của họ` cho phía Đế quốc."
    pov_and_voice: "Câu hỏi giả định nối tiếp câu trả lời mang tính cảnh báo."
    modality_and_logic: "Bảo toàn câu hỏi giả định (nhưng điều gì sẽ xảy ra nếu một số đơn vị của Khối Thịnh vượng chung xuất hiện?) và khả năng đảo ngược vị thế ưu thế hiện tại."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000574
    terms:
      - "Hải quân Đế quốc"
      - "Hải quân Khối Thịnh vượng chung"
      - "tàn quân Hải quân Cộng hòa"
      - "hạm đội Đế quốc"
    pronouns_and_address: "Trần thuật phân tích tương quan lực lượng hải quân bằng danh từ riêng chỉ từng hạm đội."
    pov_and_voice: "Phân tích cán cân hải quân giữa ba cường quốc."
    modality_and_logic: "Bảo toàn quan hệ điều kiện kép: khi việc Hải quân Đế quốc có chặn nổi Hải quân Khối Thịnh vượng chung hay không còn đáng ngờ, nếu tàn quân Hải quân Cộng hòa tham gia thêm, hạm đội Đế quốc chỉ riêng việc tự vệ thôi đã là quá sức (xem thêm finding `m2`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000575
    terms:
      - "Đế quốc"
      - "Dacia"
      - "Liên minh Entente"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu phía Đế quốc bằng `họ`."
    pov_and_voice: "Phân tích áp lực thời gian đối với sức chịu đựng của Đế quốc."
    modality_and_logic: "Bảo toàn cả 3 câu: dĩ nhiên họ không thể khoanh tay ngồi yên quá lâu; nếu chần chừ hành động thì ngay cả Đế quốc cũng sẽ hụt hơi; khi ấy họ sẽ đánh mất những hiệu quả/lợi thế chiến lược đạt được từ việc hạ gục Dacia và Liên minh Entente."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000576
    terms:
      - "Khối Thịnh vượng chung"
      - "cường quốc"
      - "tình thế tiến thoái lưỡng nan"
    pronouns_and_address: "Trần thuật câu đầu dùng `Họ`; câu hỏi nội tâm in nghiêng lược chủ ngữ (`chúng ta`) tự nhiên trong tiếng Việt."
    pov_and_voice: "Trần thuật chuyển thẳng vào câu hỏi độc thoại nội tâm thể hiện sự bế tắc chiến lược."
    modality_and_logic: "Bảo toàn câu trần thuật (không thể chịu nổi ý nghĩ bị Khối Thịnh vượng chung hay một cường quốc xen ngang nào khác đánh tạt sườn) và câu hỏi nội tâm in nghiêng về thế tiến thoái lưỡng nan."
    emphasis: "Bảo toàn chính xác câu hỏi thứ hai trong `*...*` (`*Phải làm sao với tình thế tiến thoái lưỡng nan này đây?*`) tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000577
    terms:
      - "các tuyến tiếp tế"
      - "tình thế nan giải"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu phía Đế quốc / các tướng lĩnh bằng `họ`."
    pov_and_voice: "Trần thuật chỉ rõ tử huyệt hậu cần trong thế giằng co hiện tại."
    modality_and_logic: "Bảo toàn cả 2 câu: ngày càng rõ là nếu cứ cam chịu tình hình hiện tại, bất kỳ sự cố nào ảnh hưởng đến các tuyến tiếp tế cũng có thể dẫn tới thảm họa; đó chính là tình thế nan giải gây bức bối cho họ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000578
    terms:
      - "Đại Đế quốc"
      - "những vùng đất lịch sử"
      - "các tranh chấp lãnh thổ"
    pronouns_and_address: "Trần thuật lịch sử địa chính trị dùng danh xưng `Đại Đế quốc` và phản thân `của mình`."
    pov_and_voice: "Trần thuật khái quát định mệnh địa chính trị của Đế quốc từ buổi lập quốc."
    modality_and_logic: "Bảo toàn quan hệ nhượng bộ – nhân quả: từ khi lập quốc, Đại Đế quốc đã giành được những vùng đất lịch sử của mình nhưng cũng luôn bị các tranh chấp lãnh thổ bủa vây, nên chẳng bao giờ thiếu mồi lửa cho cuộc chiến tiếp theo."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000579
    terms: []
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu các sĩ quan trong phòng họp bằng `họ` và `những người có mặt ở đó`."
    pov_and_voice: "Trần thuật chuyển mạch từ nỗi khổ tâm chung sang những cá nhân có sẵn lời giải trong phòng họp."
    modality_and_logic: "Bảo toàn 3 câu: bởi vậy họ mới khổ tâm; người có lời giải đơn giản cho vấn đề thì đâu phải chịu khổ; may hay rủi, trong số những người có mặt tại đó lại có người nắm được kế hoạch."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000580
    terms:
      - "Zettour"
      - "quân nhân"
      - "hiện trạng"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Zettour bằng `Zettour` và `Ông`, quy chiếu phía Đế quốc bằng `họ`."
    pov_and_voice: "Trần thuật khắc họa tư duy phòng ngự thực dụng khác thường của Zettour."
    modality_and_logic: "Bảo toàn đầy đủ 4 câu và các cấu trúc phủ định: Zettour biết; ông biết điều duy nhất họ cần làm là đừng để thua; đáng ngạc nhiên đối với một quân nhân, Zettour tin rằng họ không cần tấn công; nói đơn giản, cứ giữ nguyên hiện trạng là ổn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000581
    terms:
      - "Rudersdorf"
      - "Zettour"
      - "chiến hào"
      - "cuộc chiến tiêu hao"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Rudersdorf bằng `Rudersdorf` và `Ông` / `ông`, quy chiếu phía Đế quốc bằng `họ`."
    pov_and_voice: "Trần thuật đối chiếu lập trường tác chiến chủ động của Rudersdorf với tư duy giữ nguyên hiện trạng của Zettour."
    modality_and_logic: "Bảo toàn trọn vẹn 4 câu: Rudersdorf cũng nhận thức được điều đó; ông biết không cần mở những cuộc tiến công lớn vào chiến hào; tuy nhiên khác với Zettour, ông không chấp nhận quan niệm cứ duy trì cuộc chiến tiêu hao này là ổn; ông mang quyết tâm sáng suốt của một người lính: nếu kiểm soát được tổn thất mà vẫn giành chiến thắng thì sao lại không làm?"
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000582
    terms: []
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Zettour và Rudersdorf bằng `cả hai`."
    pov_and_voice: "Câu bản lề mở màn cho phần phát biểu tại cuộc họp."
    modality_and_logic: "Bảo toàn hai hành động nối tiếp: cuối cùng cả hai đều hạ quyết tâm và được phép phát biểu."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000583
    terms: []
    pronouns_and_address: "Trong lời thoại trước hội nghị Bộ Tổng Tham mưu, Zettour tự xưng `Tôi` và dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Lời mở đầu điềm đạm nhưng mang tính bước ngoặt của Zettour tại cuộc họp."
    modality_and_logic: "Bảo toàn lời đề xuất thay đổi cách nhìn nhận vấn đề."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000584
    terms:
      - "Zettour"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng `Zettour`, đại từ `ông` và phản thân `mình`."
    pov_and_voice: "Trần thuật miêu tả tâm lý căng thẳng kín đáo của Zettour trước khi nêu kế hoạch táo bạo."
    modality_and_logic: "Bảo toàn cả 2 câu: Zettour không tự coi mình là kẻ nhút nhát, nhưng trước tầm quan trọng của điều sắp nói, ngay cả ông cũng thấy hồi hộp; giọng ông thoáng chút cứng nhắc nhỏ đến mức hầu như không ai nhận ra, nhưng ông vẫn cố nói bình tĩnh hết mức có thể."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000585
    terms:
      - "Nút thắt Gordian"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng đại từ sở hữu `của ông` cho Zettour."
    pov_and_voice: "Trần thuật bình luận sắc lạnh về bản chất đẫm máu của kế hoạch mà Zettour sắp đề xuất."
    modality_and_logic: "Bảo toàn trọn vẹn 3 câu: kế hoạch bí mật của ông nhằm tháo gỡ mớ chỉ rối này chỉ bằng một nhát chém sẽ vô cùng đẫm máu; nút thắt Gordian suy cho cùng chỉ là chuyện kể; thanh gươm sắc thì chém ai cũng sắc như nhau."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000586
    terms:
      - "học thuyết"
      - "chuyển đổi mô thức"
    pronouns_and_address: "Lời thoại của Zettour dùng đại từ gộp `chúng ta` / `Chúng ta`."
    pov_and_voice: "Lời tuyên bố cốt lõi của Zettour đòi hỏi thay đổi tận gốc tư duy quân sự."
    modality_and_logic: "Bảo toàn cả 2 câu và mức độ tình thái (`có lẽ`): với học thuyết và các giá trị hiện có, có lẽ chúng ta sẽ không trụ nổi; chúng ta cần một sự chuyển đổi mô thức (`P03-paradigm-shift`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000587
    terms:
      - "văn kiện đầu hàng"
      - "Đế quốc"
      - "Dacia"
      - "Liên minh Entente"
      - "sức mạnh quốc gia"
      - "đầu hàng hoàn toàn"
    pronouns_and_address: "Trần thuật phân tích chiến lược quy chiếu kẻ địch bằng `họ` / `đối phương`."
    pov_and_voice: "Trần thuật diễn giải luận điểm chiến tranh tiêu hao hiện đại của Zettour."
    modality_and_logic: "Bảo toàn đầy đủ 3 câu: giành chiến thắng bằng cách công phá thành trì địch rồi buộc ký văn kiện đầu hàng nay đã bất khả thi; trừ những trường hợp chênh lệch quốc lực áp đảo như Đế quốc với Dacia hay Liên minh Entente, sẽ rất khó đòi hỏi đầu hàng hoàn toàn; nhìn vào cuộc chiến khủng khiếp hiện tại, cảnh đổ máu có vẻ sẽ phải tiếp diễn cho đến khi một trong hai cường quốc/một bên không thể chịu đựng thêm nữa (xem thêm finding `m3`)."
    emphasis: "none"
