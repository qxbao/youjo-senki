findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000301
    category: terminology_consistency
    issue: >-
      Tại `p000301`, tên cơ quan của Tướng von Zettour được dịch là `Bộ Hậu cần` (`*Tướng von Zettour bên Bộ Hậu cần đã kể cho mình mọi chi tiết...*`), trong khi `chapter6_b01_coordinator_choices` trong `work/run-state/pending-terms.yml` đang tạm chọn cách gọi trung tính `bộ phận Hậu cần` (hoặc `Cơ quan Hậu cần` / `Ngành Hậu cần`) để tránh tự ấn định cấp bộ.
    basis: >-
      Trong độc thoại nội tâm của vị tư lệnh quân đoàn, `Bộ Hậu cần` hoặc `bên Hậu cần` / `bộ phận Hậu cần` đều truyền đạt rõ nhánh phụ trách hậu cần của Tướng von Zettour mà không làm sai lệch quan hệ nhân vật hay mạch nghĩa của đoạn.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc chỉnh nhẹ thành `bộ phận Hậu cần` / `Cục Hậu cần` nếu điều phối viên muốn đồng bộ chặt với `chapter6_b01_coordinator_choices`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000308
    category: emphasis_punctuation_nuance
    issue: >-
      Ở câu thứ hai của `p000308` (`Đây không phải nhiệm vụ có thể thực hiện nếu không biết *“kẻ địch”* nghĩa là gì.`), bản dịch thêm cặp dấu ngoặc kép bao quanh từ được nhấn mạnh `*“kẻ địch”*`, trong khi gói nguồn XHTML chỉ đánh dấu nhấn mạnh `<html:em>` cho từ này mà không có ngoặc kép (khác với `p000306` có ngoặc kép nhưng không in nghiêng).
    basis: >-
      Việc kết hợp dấu ngoặc kép giúp làm rõ chức năng siêu ngôn ngữ (nhắc lại khái niệm vừa định nghĩa ở `p000306`) và vẫn bảo toàn đúng từ được nhấn mạnh theo `DEC-P01-002`.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên `*“kẻ địch”*` hoặc lược ngoặc kép thành `*kẻ địch*` để bám sát hình thức bề mặt của gói nguồn.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000320
    category: inner_voice_register
    issue: >-
      Câu mở đầu độc thoại nội tâm của vị tư lệnh quân đoàn tại `p000320` (`*Mình nói thẳng nhé.*`) dùng tiểu từ cuối câu `nhé` thường mang sắc thái hướng tới người đối thoại trực tiếp, trong khi toàn bộ `p000320` là dòng tự nhủ trong đầu giải thích lý do ông vừa nói toạc mệnh lệnh ở `p000319`.
    basis: >-
      Đại từ tự quy chiếu `Mình` và dấu in nghiêng toàn đoạn đã giữ đúng điểm nhìn nội tâm của vị tư lệnh theo `chapter6_b10_coordinator_choices`; đây chỉ là điểm tinh chỉnh nhỏ về sắc thái tiểu từ tình thái.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh nhẹ thành `*Mình cứ nói thẳng ra vậy.*` hoặc `*Cứ nói thẳng ra thôi.*` để giọng tự nhủ nội tâm tự nhiên hơn.
    resolution: optional_polish

