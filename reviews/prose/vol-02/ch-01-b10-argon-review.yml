  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` kết hợp tên riêng `Tanya` hoặc chức danh `Chỉ huy Tiểu đoàn von Degurechaff` / `chỉ huy tiểu đoàn, Thiếu tá Tanya von Degurechaff` (part0010/p000250, p000254, p000259, p000264, p000267, p000273–p000275), và dùng `bức ảnh ấy` khi quy chiếu bức ảnh giả định ở p000274 để tránh mơ hồ với `nó` = Tanya theo đúng `provisional_review_choices.tanya_narration` đã sửa V2 và signoff, tuyệt đối không dùng `cô` theo DEC-P01-001; trong độc thoại nội tâm ngôi thứ nhất số ít (part0010/p000247, p000253, p000255, p000259, p000260) cũng như mệnh đề phản thân phụ thuộc (p000250), Tanya tự quy chiếu bằng `mình` theo DEC-P01-001, và dùng `chúng ta` khi bao hàm cả đơn vị trong câu nội tâm in nghiêng ở p000264; quy chiếu Trung úy Weiss trong trần thuật và nội tâm đánh giá của Tanya bằng `Weiss` / `Trung úy Weiss` và đại từ `anh ta` xuyên suốt (part0010/p000247, p000253, p000259, p000260, p000265); quy chiếu tập thể Tiểu đoàn Pháp sư Không quân 203 và binh lính dưới quyền bằng `họ` (part0010/p000266, p000267), Đội bay số 7 bằng `họ` (p000245), và quân địch / phía Dacia bằng `chúng` (p000267, p000274); trong đối thoại quân sự giữa Tanya và Weiss (part0010/p000245, p000246, p000248–p000252, p000256–p000258, p000261–p000263): Tanya tự xưng `Tôi` (p000258), dùng `Chúng ta` / `chúng ta` khi chỉ toàn đơn vị đang hành quân (p000245, p000256, p000261, p000263), gọi Weiss là `Trung úy` (p000261) và dùng đại từ ngôi thứ hai `Anh` / `anh` (p000250, p000258); Weiss tự xưng `tôi` / `Tôi` (p000251, p000257), dùng `Chúng ta` (p000246), gọi Tanya bằng cấp bậc `Thiếu tá` / `thưa Thiếu tá` kèm tiểu từ kính ngữ `ạ` khi hỏi hoặc báo cáo (p000246, p000249, p000251, p000257, p000262)"
  alternatives_vi:
  - cô (thay cho `nó` / `Tanya` trong trần thuật tại part0010/p000274 — bác bỏ theo DEC-P01-001 và V2 đã signoff) / lặp tên `Tanya` thay cho `Nó` ở câu `Nó cười toe toét` tại part0010/p000264 (nhằm tách rõ khỏi `Đại tá von Lergen` ở câu trước — giữ nguyên `Nó cười toe toét` trong bản dịch đã signoff vì trong hệ quy chiếu DEC-P01-001 xuyên suốt tập truyện, `Nó` chỉ gắn với Tanya còn Lergen luôn được quy chiếu bằng `ông ta` / `anh ta`, không gây nhầm lẫn thực tế)
