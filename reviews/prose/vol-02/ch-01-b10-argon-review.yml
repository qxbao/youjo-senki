- segment_id: YS-LN02/Text/part0010.xhtml/p000273
  locks:
  - "Giữ chức danh và cấp bậc đầy đủ `chỉ huy tiểu đoàn, Thiếu tá Tanya von Degurechaff` cùng vị trí `đang dẫn đầu đội hình`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000274
  locks:
  - "Giữ cấu trúc giả định `Nếu có bức ảnh ghi lại khoảnh khắc… bức ảnh ấy hẳn sẽ chứng minh…`, biệt hiệu đã khóa tạm `“Bạch Ngân”`, tên riêng `Tanya` kết hợp đại từ trần thuật `Nó` / `nó` đã sửa theo V2 và DEC-P01-001 (tách biệt với `bức ảnh ấy`), cùng sự tương phản giữa bầu trời đêm yên bình và ý nghĩ về `cuộc tập kích dữ dội sắp tới. Đốt trụi mục tiêu của chúng sẽ vui lắm đây.`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000275
  locks:
