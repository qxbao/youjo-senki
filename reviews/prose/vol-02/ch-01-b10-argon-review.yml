- source_term: dacian_capital_advance_and_night_raid_terms_vol02_ch01_b10
  proposed_vi: "Đội bay số 7, đội bay (part0010/p000244, p000267) / Thiếu tá, Thiếu tá Tanya von Degurechaff, Chỉ huy Tiểu đoàn von Degurechaff, chỉ huy tiểu đoàn (part0010/p000246, p000249, p000251, p000262, p000267, p000273) / Weiss, Trung úy, Trung úy Weiss, cánh tay phải (part0010/p000247, p000259–p000261, p000265) / thủ đô, thủ đô Công quốc Dacia, thủ đô địch (part0010/p000248, p000249, p000267, p000268, p000275) / đội hộ tống, thương binh, tù binh (part0010/p000250, p000267) / thương vong (part0010/p000253) / khẩu súng trường, tiểu đoàn (part0010/p000254) / sĩ quan mới, căn cứ (part0010/p000256) / trung đội, Đại đội Bốn (part0010/p000257) / quản lý đơn vị, đóng quân, chỉ huy đại đội thời bình, chỉ huy đại đội thời chiến (part0010/p000259) / những kẻ cuồng chiến (part0010/p000260) / màn chơi thưởng thêm, Đại tá von Lergen (part0010/p000264) / mục đích tồn tại duy nhất, Tiểu đoàn Pháp sư Không quân 203 (part0010/p000265, p000267, p000271) / lực lượng dự bị chiến lược, Cụm tập đoàn quân phía Đông, Tập đoàn quân số 17, phòng tuyến Quân đội Dacia, khu vực giao chiến (part0010/p000267) / Công quốc Dacia (part0010/p000268) / khói súng (part0010/p000270) / cuộc tập kích ban đêm, tập kích ban đêm, cuộc tập kích, đội hình (part0010/p000272–p000275) / biệt hiệu “Bạch Ngân” (part0010/p000274) / chế độ tắt đèn, bay duyệt binh, đánh chặn, hỏa lực phòng không, khẩu đội pháo (part0010/p000275)"
  alternatives_vi:
  - Hạm đội Không quân số 7 / Hạm đội Không quân hoặc phi đội (thay cho `Đội bay số 7` / `đội bay` tại part0010/p000244, p000267 — ưu tiên `Đội bay số 7` / `đội bay` theo `provisional_review_choices.air_fleet` đã signoff trong `handoffs/vol-02/ch-01-b10.yml` để giữ đồng bộ với B09 p000242 và trung tính về cấp tổ chức) / Tiểu đoàn Pháp sư Không trung 203 hoặc Tiểu đoàn Pháp sư trên không 203 (thay cho `Tiểu đoàn Pháp sư Không quân 203` tại part0010/p000265, p000267, p000271 — ưu tiên giữ `Tiểu đoàn Pháp sư Không quân 203` theo `provisional_review_choices.aerial_mage_battalion` để nhất quán xuyên suốt Tập 2 từ B06, B09) / Bạc Trắng (thay cho `Bạch Ngân` khi dịch `White Silver` tại part0010/p000274 — ưu tiên `“Bạch Ngân”` theo `provisional_review_choices.white_silver` vì giữ sắc thái trang nhã của biệt hiệu và tránh dịch lệch sang `Bạch Kim`) / Đại đội 4 (thay cho `Đại đội Bốn` tại part0010/p000257 — giữ nguyên `Đại đội Bốn` trong bản dịch đã signoff của đơn vị đại đội thuộc tiểu đoàn, tách biệt với cách ghi số Ả Rập của cấp tập đoàn quân/đội bay/tiểu đoàn `Đội bay số 7`, `Tập đoàn quân số 17`, `203`)
