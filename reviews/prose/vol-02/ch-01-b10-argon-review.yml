  locks:
  - "Giữ các danh xưng và thuật ngữ đã signoff `lực lượng dự bị chiến lược`, `Cụm tập đoàn quân phía Đông`, `Tập đoàn quân số 17`, `đội bay`, `phòng tuyến Quân đội Dacia`, `Tiểu đoàn Pháp sư Không quân 203`, `khu vực giao chiến`, `Chỉ huy Tiểu đoàn von Degurechaff`, các con số `Hai nghìn người chết`, `sáu trăm nghìn` đối đầu với `bảy mươi nghìn`, và đúng phạm vi nhấn mạnh theo DEC-P01-002 trong câu hỏi tu từ `“Ai mà *chẳng* nghiền nát được chúng?”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000268
  locks:
  - "Giữ danh xưng `thủ đô Công quốc Dacia` và hình ảnh so sánh `bình yên như mọi buổi tối kể từ thuở khai thiên lập địa`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000269
  locks:
  - "Giữ tương phản giữa cảnh người dân Dacia say sưa bàn tán khi chiến tranh mới nổ ra (`với lòng nhiệt thành lớn lao mà vô nghĩa`) và trạng thái tĩnh lặng lúc đêm muộn (`khắp nơi đã lắng xuống và phần lớn mọi người đều đi ngủ`)."
- segment_id: YS-LN02/Text/part0010.xhtml/p000270
  locks:
