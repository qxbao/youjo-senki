findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000358
    category: lexical_nuance
    issue: >-
      Tại câu 1 của `p000358`, danh từ chỉ chướng ngại vật đi kèm `trenches` đang được lược bớt (`Chiến hào quả thực đã làm thay đổi...`), và tại câu 2, thuật ngữ `guard duty` (nhiệm vụ canh gác nói chung) bị thu hẹp thành `việc gác đêm`.
    basis: >-
      Đặt trong mạch bàn về tác chiến ban đêm nơi chiến hào, câu dịch hiện tại vẫn trôi chảy và không làm sai lệch luận điểm của đoạn.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể tinh chỉnh thành `Chướng ngại vật mang tên chiến hào quả thực đã làm thay đổi cách tiến hành các trận đánh ban đêm. Chúng cũng khiến việc canh gác khác đi, mà quân thay thế rõ ràng chưa quen với điều đó.`
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000366
    category: syntactic_and_lexical_nuance
    issue: >-
      Ở `p000366`, cụm trạng ngữ chỉ điều kiện/hoàn cảnh về trình độ non kém của tân binh đang được gắn như định ngữ bổ nghĩa trực tiếp cho cụm danh từ chỉ các trận đánh nhỏ (`những trận đánh quy mô nhỏ có đám tân binh được huấn luyện sơ sài thế này`).
    basis: >-
      Người đọc vẫn hiểu rõ câu hỏi xác nhận của Tanya về nỗi lo ngại của vị đại tá đối với các trận giao tranh nhỏ khi tân binh chưa được huấn luyện đầy đủ.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh lại cấu trúc cho sát quan hệ điều kiện của câu hỏi: `“Với đám tân binh chỉ được huấn luyện sơ sài thế này, ngài lo ngại cả những trận đánh quy mô nhỏ sao?”`
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000369
    category: modality_and_negation_nuance
    issue: >-
      Tại câu 2 của `p000369`, chủ ngữ độc thoại nội tâm ngôi thứ nhất của Tanya được lược bỏ, và tại câu 3, cấu trúc phủ định kép nhấn mạnh sự bất định (`không có gì đảm bảo rằng những vấn đề này sẽ không trầm trọng hơn`) được rút gọn thành mệnh đề khả năng khẳng định (`những vấn đề này có thể còn trầm trọng hơn`).
    basis: >-
      Hướng lập luận quản trị rủi ro dưới góc nhìn nhân sự của Tanya và kết luận cần cải thiện từ những điểm nhỏ nhất vẫn được giữ trọn vẹn.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể khôi phục cấu trúc phủ định kép và đại từ nội tâm `mình` (`DEC-P01-001`): `Sắc sảo thật. Xét từ góc độ nhân sự, mình phải công nhận họ nhìn xa trông rộng. Chẳng có gì đảm bảo những vấn đề này sẽ không trở nên trầm trọng hơn nếu tình hình phát triển thành một trận đánh lớn; vì vậy, dù chỉ có cách cải thiện nhỏ nhất, ta cũng phải bắt tay vào làm.`
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000375
    category: dialogue_address_consistency
    issue: >-
      Tại `p000375`, người nói là vị đại tá Ban Tác chiến đang hỏi Thiếu tá Tanya về kinh nghiệm tác chiến không dùng phép thuật ở mặt trận Norden (liền ngay sau đó ở `p000376` Tanya đáp lại `“Đúng như ngài nói... tôi sẽ ghi nhớ khi huấn luyện họ.”`), nhưng bản nháp hiện dùng đại từ `Ngài` / `ngài` thay vì `Cô` / `cô` như ở `p000334`, `p000344`, `p000354` và `p000381`.
    basis: >-
      Do đoạn `p000375` không có lời dẫn thoại trực tiếp nên người dịch tạm chọn `Ngài`; tuy nhiên xét theo lịch sử tham chiến của Tanya tại Norden (Tập 1) và câu đáp lễ phép của Tanya ở `p000376`, chủ thể phát ngôn tại `p000375` là vị đại tá nói với Tanya.
    recommendation: >-
      Không chặn signoff; ở bước polish khuyến nghị đổi `Ngài` / `ngài` thành `Cô` / `cô` để đồng bộ hoàn toàn hệ xưng hô giữa vị đại tá và Thiếu tá Tanya: `“Cô từng tham gia một chiến dịch ở Norden mà không thể dựa vào phép thuật, đúng không? Tôi đoán cô nắm được đại khái rồi.”`
    resolution: optional_polish

