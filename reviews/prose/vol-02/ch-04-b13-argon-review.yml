  - id: vol02-ch04-b13-tanya-pronouns-pov-shifts-and-emphasis
    source_term: radio dialogue pronouns (p000057–p000059), Tanya third-person narration pronouns (p000060, p000061, p000066–p000068, p000073, p000075), Tanya first-person interior monologue pronouns (p000065, p000067, p000069–p000074, p000076–p000078), generic pronouns (p000062–p000064), and emphasis spans (p000068, p000075, p000078)
    proposed_vi: >-
      trong đối thoại vô tuyến mở đầu nối tiếp b12 (p000057–p000059), Tanya tự
      xưng “tôi”, gọi đơn vị là “chúng tôi”, và sĩ quan điều phối (Urban
      Control) tự xưng “Tôi”, gọi đơn vị của Tanya là “các anh” đồng bộ với b12
      p000055; trong trần thuật ngôi thứ ba bám sát điểm nhìn Tanya (p000060,
      p000061, p000066, câu đầu p000067, phần dẫn p000068, câu cuối p000073, phần
      dẫn p000075), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại từ
      “nó” kết hợp đại từ phản thân “mình” theo đúng DEC-P01-001 (tuyệt đối
      không dùng “cô”; các từ “nó” tại p000066, p000070, p000078 quy chiếu chiếc
      tàu ngầm); trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000065, bốn
      câu cuối p000067, p000070–p000072, hai câu đầu p000073, p000074,
      p000076–p000078), tự quy chiếu số ít nhất quán bằng “mình” / “Mình” theo
      DEC-P01-001, dùng “chúng tôi” / “chúng ta” cho tập thể đơn vị / Lục quân
      Đế quốc / đồng loại con người, và dùng “Các người” khi chất vấn trong đầu
      tại p000069; trong các nhận định khái quát về chức trách chỉ huy và quản
      lý (p000062–p000064), dùng “họ” cho “the senior officer” số ít mang nghĩa
      khái quát và “người ta” cho “you” khái quát; xác nhận bản sửa F3 tại
      p000078 đã thu hẹp đúng phạm vi nhấn mạnh Markdown `*...*` vào từ `*này*`
      (“vùng biển *này*”) và giữ nguyên `*Chuyện đó*` cùng 2 câu nghĩ trực tiếp
      in nghiêng tại p000068 và p000075 theo đúng DEC-P01-002
    alternatives_vi:
      - các vị (thay cho “các anh” trong phản hồi vô tuyến của sĩ quan điều phối tại p000058 — giữ “các anh” để đồng bộ trực tiếp với lượt thoại ngay trước đó ở b12 p000055)
