    pov_and_logic:
      - Giữ quan hệ nhân quả: vì đã phát hiện ra chiếc tàu ngầm nên Tanya, với tư cách sĩ quan cấp cao nhất, buộc phải xử lý
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000067
    names_and_ranks:
      - troops -> quân lính
      - soldiers -> những người lính
    pronouns_and_address:
      - Câu đầu là trần thuật ngôi thứ ba dùng "Nó" cho Tanya và "họ" cho binh lính; các câu sau chuyển sang độc thoại nội tâm dùng "chúng ta" cho loài người ("đồng loại của chúng ta"), "họ" cho binh lính và "Mình" cho Tanya theo DEC-P01-001
    pov_and_logic:
      - Bảo toàn sự chuyển điểm nhìn từ hành động cho quân tản ra và cảm giác phát ớn trước ánh mắt nghiêm nghị của thuộc cấp sang suy nghĩ nội tâm: một phát bắn có thể giết gần trăm đồng loại, binh lính quyết tâm không bắn trượt, và lời nguyền rủa thế giới nơi con người không thể hành xử như con người
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000068
    names_and_ranks:
      - war laws -> luật chiến tranh
      - Tanya -> Tanya
    pronouns_and_address:
      - Mệnh đề dẫn trần thuật dùng tên riêng "Tanya"
    pov_and_logic:
      - Giữ lời rủa xả nội tâm hướng vào "luật chiến tranh" (`vol02-ch04-b13-law-of-war`)
    emphasis:
      - Giữ đúng phạm vi nhấn mạnh Markdown `*Với cả luật chiến tranh nữa, cứ chết tiệt đi*` cho phần độc thoại trực tiếp và đặt mệnh đề dẫn ở ngoài dấu sao theo DEC-P01-002
  - segment_id: YS-LN02/Text/part0024.xhtml/p000069
    names_and_ranks:
      - right to innocent passage -> quyền qua lại vô hại
      - submarines -> tàu ngầm
      - principle of legality -> nguyên tắc pháp chế
      - maritime court -> tòa án hàng hải
    pronouns_and_address:
      - Độc thoại nội tâm dùng "Các người" cho đại từ ngôi thứ hai mang sắc thái trách cứ/mỉa mai
    pov_and_logic:
      - Giữ lời chê trách lỗ hổng pháp lý khi không có điều khoản về "quyền qua lại vô hại" (`vol02-ch04-b13-innocent-passage`) cho tàu ngầm, hai câu hỏi tu từ mỉa mai về việc viện dẫn "nguyên tắc pháp chế" (`vol02-ch04-b13-principle-of-legality`) hay chờ phán quyết từ "tòa án hàng hải" (`vol02-ch04-b13-maritime-court`), và câu kết khẳng định đây không phải chuyện đùa
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000070
    names_and_ranks:
      - submarine of unknown nationality -> chiếc tàu ngầm không rõ quốc tịch
      - Imperial Army -> Lục quân Đế quốc
    pronouns_and_address:
      - Độc thoại nội tâm dùng "mình" cho Tanya (DEC-P01-001), "chúng ta" cho đơn vị thuộc Lục quân Đế quốc, và "Nó" cho chiếc tàu ngầm
    pov_and_logic:
      - Giữ tình huống cấp bách trước mắt: tàu ngầm không rõ quốc tịch đang lặn nhanh để trốn chạy khỏi Lục quân Đế quốc đúng lúc Tanya chỉ huy; nó sẽ lặn hoàn toàn trong chưa đầy một phút, nhưng hiện tại đơn vị vẫn còn một phút ngắn ngủi đó
    emphasis: none
