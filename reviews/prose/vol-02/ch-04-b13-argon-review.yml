      - Giữ địa danh tạm "Biển Bắc" (`vol02-ch04-b13-northern-sea`, bản sửa F1), cấu trúc tăng tiến "không chỉ… mà việc… còn là…" (thời tiết bay tệ nhất cộng thêm việc chạm trán tàu ngầm không rõ quốc tịch trên đường về) và lời than phiền xui xẻo đến mức nghi ngờ lý thuyết xác suất
