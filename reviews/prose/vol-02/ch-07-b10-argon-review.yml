locked_choices:
- segment_id: YS-LN02/Text/part0032.xhtml/p000238
  locks:
  - Giữ điều kiện phủ định “chẳng phù hợp để đưa vào sử dụng thực tế trừ phi có thể dùng được, đúng không?” và câu chuyển ý bỏ lửng ở cuối đoạn.
- segment_id: YS-LN02/Text/part0032.xhtml/p000239
  locks:
  - Giữ thuật ngữ “đơn vị đổ bộ đường không” và phép so sánh ý tưởng nghe như đến từ chiều không gian khác.
- segment_id: YS-LN02/Text/part0032.xhtml/p000240
  locks:
  - Giữ dấu ngoặc đơn quanh từ “‘đơn vị’”, câu hỏi đưa ra phía sau vị trí địch và đại từ quy chiếu “anh ta” cho viên sĩ quan.
- segment_id: YS-LN02/Text/part0032.xhtml/p000241
  locks:
  - Giữ thuật ngữ “khí cụ gia tốc bổ sung”, nhận định gần như bất khả thi để quay về và khiếm khuyết nếu làm phương tiện trinh sát, cùng phép so sánh đáng tin cậy hơn “nhảy dù” để đưa các “pháp sư” ra sau phòng tuyến địch.
- segment_id: YS-LN02/Text/part0032.xhtml/p000242
  locks:
  - Giữ quan hệ nhân quả bay cao vượt tầm thực tế của hỏa lực phòng không để vượt qua quân địch đánh chặn, và khả năng phái thẳng một “đại đội pháp sư” tới “sở chỉ huy địch” nhằm “chặt đầu chiến dịch”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000243
  locks:
  - Giữ chức danh/cấp bậc “Thiếu tướng von Zettour”, “bộ phận Hậu cần Bộ Tổng tham mưu”, “Kỹ sư trưởng Schugel” và việc “Bộ Tổng tham mưu” yêu cầu báo cáo tiến độ chi tiết.
- segment_id: YS-LN02/Text/part0032.xhtml/p000244
  locks:
  - Giữ chủ thể “những người ủng hộ chiến tranh du kích” ưu tiên xúc tiến kế hoạch và sự hậu thuẫn theo đúng nghĩa đen từ “Bộ Tổng tham mưu”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000245
  locks:
  - Giữ mốc thời gian hoàn thiện nguyên mẫu ngay trước khi “quân du kích” tạm thời chiếm quyền kiểm soát “Arene”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000246
  locks:
  - Giữ định danh “Quả cầu Tính toán Xung kích Type 97 của Elinium Arms” và hai thuật ngữ bảo vệ “lớp vỏ phòng thủ”, “màn chắn bảo hộ”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000247
  locks:
  - Giữ thuật ngữ rút gọn “quả cầu xung kích” và đánh giá của nhân sự thử nghiệm rằng thiết bị hoạt động đúng như kỳ vọng.
- segment_id: YS-LN02/Text/part0032.xhtml/p000248
  locks:
  - Giữ số lượng “hai mươi mẫu sản xuất hàng loạt” thuộc lô đầu tiên được xuất xưởng gấp rút.
- segment_id: YS-LN02/Text/part0032.xhtml/p000249
  locks:
  - Giữ các định danh “Bộ Tổng tham mưu”, “Thiếu tướng von Rudersdorf”, “Lục quân Cộng hòa”, “Zettour”, “bộ phận nghiên cứu kỹ thuật” và nội dung chiến lược dụ địch tiến vào rồi tiêu diệt.
- segment_id: YS-LN02/Text/part0032.xhtml/p000250
  locks:
  - Giữ nguyên dấu nhấn mạnh chữ nghiêng `*Kinh hoàng và Khiếp sợ.*` theo DEC-P01-002.
- segment_id: YS-LN02/Text/part0032.xhtml/p000251
  locks:
  - Giữ tên chiến dịch trong ngoặc kép “Kinh hoàng và Khiếp sợ” đồng bộ với p000250 và nhận định giai đoạn đầu rất đơn giản.
- segment_id: YS-LN02/Text/part0032.xhtml/p000252
  locks:
  - Giữ nguyên câu trích dẫn trong ngoặc kép về việc tấn công trực diện sở chỉ huy địch để làm sụp đổ phòng tuyến của chúng.
- segment_id: YS-LN02/Text/part0032.xhtml/p000253
  locks:
  - Giữ câu kết ngắn gọn “Chỉ có vậy thôi.”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000254
  locks:
  - Giữ định danh “Tiểu đoàn Pháp sư Trên không số 203 của Lục quân Đế quốc”, “Thiếu úy Warren Grantz”, đại từ “anh” và chi tiết đứng gác trong áo khoác dã chiến lót len, ngồi trực chờ lệnh nhấm nháp cà phê trong khẩu phần dã chiến.
- segment_id: YS-LN02/Text/part0032.xhtml/p000255
  locks:
  - Giữ đại từ “Anh” (Grantz), các phủ định không có đạn pháo nổ gần đó, không có cảnh báo đề phòng tập kích, không nhớ nổi lần cuối đi ngủ mà không nghe tiếng súng trường, và câu tình thái suy đoán “Hẳn chuyện đó đã từ lâu lắm rồi.”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000256
  locks:
  - Giữ quan hệ nhân quả sự tĩnh lặng có được nhờ “giới chỉ huy cấp cao” tiến hành “củng cố chiến tuyến” với quyết tâm phi thường.
- segment_id: YS-LN02/Text/part0032.xhtml/p000257
  locks:
  - Giữ các định danh “Lục quân Cộng hòa”, “Lục quân Đế quốc”, “Tiểu đoàn 203”, “Chỉ huy tiểu đoàn”, việc hoãn xuất kích cho binh lính nghỉ ngơi và cách lược đại từ nhân xưng ở mệnh đề phụ (“trước khi quay về giường ngủ”) theo DEC-P01-001.
- segment_id: YS-LN02/Text/part0032.xhtml/p000258
  locks:
  - Giữ danh xưng “Chỉ huy Degurechaff”, sắc thái rào đón “có lẽ có thể nói như vậy” và câu hỏi tu từ cuối đoạn.
- segment_id: YS-LN02/Text/part0032.xhtml/p000259
  locks:
  - Giữ quan hệ nhượng bộ giữa khung giờ cao điểm cho nhiệm vụ đánh chặn ban đêm / tuần tra chống tập kích với thực tế mọi thứ vẫn bình yên vô sự.
- segment_id: YS-LN02/Text/part0032.xhtml/p000260
  locks:
  - Giữ chi tiết “căn cứ tuyến sau”, sắc thái tình thái “có lẽ họ vẫn nên cảnh giác hơn một chút” và câu phủ định đính chính “Tất nhiên, không phải là đơn vị đã trở nên lơi lỏng.”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000261
  locks:
  - Giữ sự tương phản giữa tình trạng rã rời có thể ngủ gục cả trong bùn lầy với khả năng lập tức phản ứng trước mệnh lệnh khẩn cấp.
- segment_id: YS-LN02/Text/part0032.xhtml/p000262
  locks:
  - Giữ mức độ giảm nhẹ “Dẫu vậy, họ vẫn thả lỏng đôi chút.”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000263
  locks:
  - Giữ câu khẳng định ngắn “Lý do đã quá rõ ràng.”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000264
  locks:
  - Giữ định danh “Lục quân Cộng hòa”, “Tiểu đoàn 203” và chi tiết tiến vào khoảng trống mà quên bẵng vị trí phòng ngự của Tiểu đoàn 203.
- segment_id: YS-LN02/Text/part0032.xhtml/p000265
  locks:
  - Giữ định danh “Lục quân Cộng hòa” và hành động bước ra khỏi các phòng tuyến kiên cố để dồn toàn lực mở rộng thành quả tiến quân.
- segment_id: YS-LN02/Text/part0032.xhtml/p000266
  locks:
  - Giữ cấu trúc so sánh hơn thiệt giữa việc tiến vào khu vực bỏ trống để đẩy chiến tuyến lên với việc “đổ máu và sắt thép” tranh giành tuyến chiến hào phòng thủ vững chắc.
- segment_id: YS-LN02/Text/part0032.xhtml/p000267
  locks:
  - Giữ quan hệ quy chiếu nhân quả “Điều đó lý giải cho đêm bình yên hiếm hoi này.”.
- segment_id: YS-LN02/Text/part0032.xhtml/p000268
  locks:
  - Giữ cấu trúc phủ định kép kèm nhấn mạnh `*hoàn toàn không có*` về việc kéo lùi chiến tuyến, lời tuyên bố của chỉ huy dùng đại từ gộp “chúng ta” trong cặp dấu nhấn mạnh `*“Ngày mai, chúng ta sẽ là mũi nhọn kết thúc cuộc chiến này.”*` theo DEC-P01-002, và kết luận suy đoán tất yếu ở câu cuối.
