    terms: []
    pronouns_and_address: "Lời thoại chỉ huy của Tanya dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Giọng khẳng định dứt khoát như điều hiển nhiên của Tanya."
    modality_and_logic: "Bảo toàn trạng từ khẳng định (`Đương nhiên`) và mục tiêu giành lại thành phố."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000387
    terms:
      - "Tanya"
      - "tái chiếm"
      - "chiến trường"
      - "nguồn tiếp tế"
      - "mệnh lệnh xuất kích"
      - "Grantz"
    pronouns_and_address: "Trần thuật dùng tên riêng `Tanya`, `Grantz`, đại từ số nhiều `họ`, và chuyển đại từ ngôi thứ hai phiếm chỉ ở cuối đoạn thành cấu trúc khái quát vô nhân xưng (`việc đương nhiên phải làm`)."
    pov_and_voice: "Giọng trần thuật song hành điểm nhìn, chỉ ra điểm giao thoa giữa Tanya và Grantz ở phản xạ hiếu chiến nhà binh trước áp lực đứt tiếp tế."
    modality_and_logic: "Bảo toàn đủ 5 câu: ngay khi nói vậy chính Tanya cũng tin tái chiếm là lựa chọn duy nhất như một kết luận đủ hợp lý -> bản chất chiến trường giết hoặc bị giết -> việc sắp làm chỉ là đổi vị trí -> so sánh với nỗi kinh hoàng bị cắt tiếp tế thì lệnh xuất kích còn có phần quen thuộc -> quan hệ nhân quả từ `khuynh hướng suy nghĩ trong trạng thái kích động` của cả hai dẫn tới việc thấy tấn công là đương nhiên."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000388
    terms: []
    pronouns_and_address: "Câu thoại chuyển ý không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng Tanya bất ngờ chững lại để báo hiệu điểm rắc rối của nhiệm vụ."
    modality_and_logic: "Bảo toàn câu thoại mở ra bước ngoặt (`“Giờ mới đến phần khó đây.”`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000389
    terms:
      - "mục tiêu nhiệm vụ"
    pronouns_and_address: "Quy chiếu Tanya bằng `cô` (lựa chọn cục bộ pending theo điểm nhìn quan sát của Grantz) và cấp dưới bằng `họ`."
    pov_and_voice: "Giọng trần thuật ghi nhận cử chỉ khác thường của Tanya so với thói quen truyền đạt mệnh lệnh nhanh gọn mọi khi."
    modality_and_logic: "Bảo toàn mệnh đề nhượng bộ đối lập giữa thói quen luôn nhanh chóng truyền đạt những mục tiêu nhiệm vụ đơn giản với hành động cố ý hít sâu một hơi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000390
    terms:
      - "sĩ quan"
    pronouns_and_address: "Quy chiếu Grantz bằng `anh`."
    pov_and_voice: "Giọng trần thuật theo ánh mắt quan sát xung quanh của Grantz."
    modality_and_logic: "Bảo toàn hành động nhìn quanh và nhận thấy gương mặt các sĩ quan khác cũng căng thẳng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000391
    terms:
      - "Grantz"
    pronouns_and_address: "Câu hỏi nội tâm không dùng đại từ nhân xưng; câu trần thuật dùng tên riêng `Grantz`."
    pov_and_voice: "Giọng thắc mắc bồn chồn trong nội tâm Grantz đi liền với phản xạ gồng mình chờ đợi."
    modality_and_logic: "Bảo toàn câu hỏi nội tâm cảm thán và động tác hơi gồng mình lên của Grantz."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu hỏi nội tâm đầu đoạn (`*Rốt cuộc là chuyện quái gì?*`) tương ứng thẻ `<html:em>`, giữ câu trần thuật thứ hai ở chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000392
    terms:
      - "Arene"
    pronouns_and_address: "Câu thoại bỏ lửng chỉ gồm địa danh."
    pov_and_voice: "Giọng ngập ngừng hiếm hoi của Tanya."
    modality_and_logic: "Bảo toàn dấu chấm lửng sau tên thành phố (`“Arene…”`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000393
    terms:
      - "Grantz"
      - "Arene"
    pronouns_and_address: "Trần thuật dùng tên `Grantz` và quy chiếu Tanya bằng `cô`; câu suy nghĩ trực tiếp in nghiêng của Grantz quy chiếu Tanya bằng `Cô`."
    pov_and_voice: "Giọng trần thuật chuyển sang cú sốc trong nhận thức của Grantz khi thấy cấp trên nghẹn lời."
    modality_and_logic: "Bảo toàn đủ 2 câu: Grantz thấp thỏm chờ nói tiếp rồi bàng hoàng nhận ra một điều -> nhận thức trực tiếp rằng cô mới nói “Arene” rồi không biết phải tiếp lời thế nào."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ câu đầu ở chữ thường, bọc dấu `*...*` quanh toàn bộ câu thứ hai (`*Cô đã nói “Arene” rồi không biết phải tiếp lời thế nào.*`) tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000394
    terms:
      - "sĩ quan"
    pronouns_and_address: "Quy chiếu Tanya bằng cụm danh từ `Một sĩ quan`."
    pov_and_voice: "Giọng nhận định đầy chấn động của Grantz trước sự tương phản hoàn toàn với tính cách thường ngày của Tanya."
    modality_and_logic: "Bảo toàn sự đối lập giữa một sĩ quan vốn có thể bình thản ra lệnh xung phong xuống địa ngục với trạng thái đang do dự hiện tại."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000395
    terms: []
    pronouns_and_address: "Quy chiếu Tanya bằng `Cô` / `cô`."
    pov_and_voice: "Giọng quan sát của Grantz cảm nhận sự giằng xé nội tâm của Tanya (dù Grantz không biết lý do thật là nỗi sợ tòa án hậu chiến của Tanya ở `b11`–`b12`)."
    modality_and_logic: "Bảo toàn cả hai vế hành động: cố gạt bỏ điều gì đó và làm một việc khiến cô khó chịu đựng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000396
    terms:
      - "đơn vị"
      - "cuộc xuất kích"
    pronouns_and_address: "Không dùng đại từ nhân xưng cá nhân."
    pov_and_voice: "Giọng trần thuật khắc họa bầu không khí ngột ngạt bao trùm toàn đơn vị."
    modality_and_logic: "Bảo toàn đủ 4 câu: cảm giác u ám và nặng nề -> cả đơn vị im phăng phắc không một tiếng động -> linh cảm có gì đó không ổn -> những người lính vốn đang bị phân tâm bởi cuộc xuất kích sắp tới bắt đầu tự hỏi chuyện gì đang xảy ra."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000397
    terms: []
    pronouns_and_address: "Quy chiếu binh lính bằng `họ` và Tanya bằng `cô`."
    pov_and_voice: "Giọng trần thuật nối nhịp khi Tanya phá vỡ sự im lặng."
    modality_and_logic: "Bảo toàn mệnh đề so sánh giả định (`như thể muốn cắt ngang dòng suy nghĩ của họ`) và hành động gắng gượng nói tiếp."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000398
    terms:
      - "Arene"
      - "Quân đội Cộng hòa"
      - "chiếm đóng"
      - "Các binh sĩ"
      - "binh sĩ Cộng hòa"
    pronouns_and_address: "Trong lời thoại mệnh lệnh, Tanya hô `Các binh sĩ` và dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Giọng tuyên bố mệnh lệnh đanh thép của Tanya, nhấn giọng vào phạm vi mục tiêu đã được hợp thức hóa về mặt pháp lý ở `b10` (`p000319`)."
    modality_and_logic: "Bảo toàn đủ 2 câu: tiền đề Arene hiện đang bị Quân đội Cộng hòa chiếm đóng -> mệnh lệnh để giành lại thành phố thì cần tiêu diệt *toàn bộ* binh sĩ Cộng hòa."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh lượng từ `*toàn bộ*` tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000399
    terms:
      - "pháp sư Cộng hòa"
      - "dân quân"
      - "pháp sư"
    pronouns_and_address: "Độc thoại nội tâm của Grantz lược đại từ hoặc dùng cấu trúc điều kiện khái quát."
    pov_and_voice: "Giọng ngơ ngác trong nội tâm Grantz khi tự động hiểu hẹp cụm “binh sĩ Cộng hòa” của Tanya thành “các pháp sư Cộng hòa”."
    modality_and_logic: "Bảo toàn đủ 4 câu: thán từ ngạc nhiên (`Hả?`) -> nhận xét nghe quá rõ ràng -> câu điều kiện nếu pháp sư Cộng hòa liên kết với dân quân chiếm thành phố thì sẽ quá nguy hiểm nếu không diệt hết pháp sư -> câu hỏi tu từ khẳng định điều hiển nhiên."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ 4 câu của đoạn tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000400
    terms:
      - "Grantz"
    pronouns_and_address: "Trần thuật dùng tên riêng `Grantz`."
    pov_and_voice: "Giọng trần thuật nối tiếp câu hỏi về độ khó thực hiện nhiệm vụ với sự bối rối của Grantz trước thái độ của cấp trên."
    modality_and_logic: "Bảo toàn chính xác đối tượng câu hỏi đầu là độ khó của nhiệm vụ (`Liệu việc đó có khó đến thế không?`) và câu trần thuật thứ hai (`Grantz vẫn chưa thực sự hiểu.`) theo đúng `B13-R03`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000401
    terms:
      - "lính bổ sung"
      - "mệnh lệnh"
    pronouns_and_address: "Quy chiếu nhóm `lính bổ sung` bằng `Họ` / `họ` kèm phản thân `mình`."
    pov_and_voice: "Giọng trần thuật mở rộng ra nhận thức chung của nhóm lính bổ sung mới về tiểu đoàn."
    modality_and_logic: "Bảo toàn từ chuyển ý đính chính (`Không, thật ra`), đối tượng `hầu hết lính bổ sung` (`B13-T05`, `B13-R05`) không thấy mệnh lệnh này khác gì thường lệ, và suy nghĩ đơn giản rằng được bảo tiến lên như mọi khi thì cứ làm thế."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000402
    terms:
      - "Grantz"
      - "Weiss"
      - "trung úy"
    pronouns_and_address: "Lặp rõ tên riêng `Grantz` và `Weiss` cùng chức danh `viên trung úy` để phân tách rành mạch hai chủ thể nam theo `B13-R04`."
    pov_and_voice: "Giọng trần thuật qua cái liếc nhìn tìm kiếm manh mối của Grantz về phía Phó chỉ huy Weiss."
    modality_and_logic: "Bảo toàn đủ 5 câu: mục đích liếc nhìn Weiss xem có ai hiểu chuyện gì không -> gương mặt viên trung úy hơi căng lại -> nhận xét của Grantz thấy điều đó thật lạ -> biểu hiện rõ ràng đang lo lắng và dao động của Weiss -> hành động Weiss hít sâu như thể cố chuẩn bị tinh thần."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000403
    terms:
      - "mặt trận Rhine"
      - "tay lão luyện"
      - "cựu binh"
    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng chất vấn kinh ngạc trong tâm trí Grantz khi thấy một người dày dạn như Weiss cũng dao động."
    modality_and_logic: "Bảo toàn đủ 2 câu hỏi liên tiếp: nối trực tiếp động tác chuẩn bị tinh thần từ `p000402` (`Chuẩn bị tinh thần để đối mặt với điều gì?`) -> câu hỏi về mức độ khủng khiếp có thể làm chấn động một tay lão luyện ở mặt trận Rhine dày dạn như cựu binh (lính kỳ cựu)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000404
    terms:
      - "người không tham chiến"
      - "thiệt hại tài sản"
    pronouns_and_address: "Lời thoại chỉ huy của Tanya dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Giọng phổ biến quy tắc giao chiến chuẩn mực về mặt câu chữ pháp lý của Tanya."
    modality_and_logic: "Bảo toàn quan hệ đối lập giữa hai vế: mệnh lệnh nghiêm cấm nổ súng vào *người không tham chiến* -> mệnh đề nhượng bộ vì *được phép* gây *thiệt hại tài sản* nên việc đó không bị tính là vi phạm."
    emphasis: "Bảo toàn chính xác 3 cụm nhấn mạnh rời theo `DEC-P01-002` và `B13-R01`: `*người không tham chiến*`, `*được phép*` và `*thiệt hại tài sản*` tương ứng 3 thẻ `<html:em>` trong gói nguồn."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000405
    terms:
      - "quy tắc giao chiến"
      - "miễn trách nhiệm"
      - "thiệt hại tài sản"
      - "quy trình"
    pronouns_and_address: "Quy chiếu Tanya bằng `Cô` và đơn vị bằng `họ`."
    pov_and_voice: "Giọng nhận xét của Grantz, thấy các quy định được nêu đều nằm trong khuôn khổ thủ tục quen thuộc."
    modality_and_logic: "Bảo toàn đủ 4 câu: hành động nhấn mạnh quy tắc giao chiến -> đánh giá quy tắc giao chiến hết sức bình thường -> điểm đáng chú ý duy nhất là việc được miễn trách nhiệm đối với thiệt hại tài sản -> khẳng định ngay cả `việc được miễn trừ đó` cũng thuộc quy trình thông thường (`B13-R07`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000406
    terms:
      - "pháp sư địch"
      - "cảnh báo yêu cầu đầu hàng"
    pronouns_and_address: "Lời thoại của Tanya dùng `chúng ta` cho đơn vị và `họ` cho pháp sư địch."
    pov_and_voice: "Giọng bổ sung chỉ thị tác chiến của Tanya."
    modality_and_logic: "Bảo toàn chính xác cả hai mốc thời gian phát cảnh báo yêu cầu đầu hàng: `trước khi giao chiến với pháp sư địch` và `sau khi tiêu diệt họ`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000407
    terms: []
    pronouns_and_address: "Câu hỏi nội tâm trực tiếp của Grantz tự quy chiếu bằng `Mình… mình`; câu trần thuật tiếp theo quy chiếu Grantz bằng `anh`."
    pov_and_voice: "Giọng hoang mang cực độ khi Grantz cảm nhận sự bất thường trong thái độ của Tanya và Weiss nhưng không tìm ra điểm bất thường trong nội dung mệnh lệnh."
    modality_and_logic: "Bảo toàn câu hỏi tự vấn ngập ngừng có dấu chấm lửng và câu trần thuật mô tả nỗi lo mơ hồ, khó gọi tên bao trùm lấy anh."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu hỏi nội tâm đầu đoạn (`*Mình… mình đang bỏ sót điều gì sao?*`) tương ứng thẻ `<html:em>`, giữ câu trần thuật thứ hai ở chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000408
    terms:
      - "tạm ngừng chiến đấu"
      - "cảnh báo"
    pronouns_and_address: "Câu mệnh lệnh trực tiếp không dùng đại từ."
    pov_and_voice: "Giọng dặn dò thủ tục của Tanya."
    modality_and_logic: "Bảo toàn mệnh lệnh phải nhớ tạm ngừng chiến đấu trong lúc đang phát cảnh báo."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000409
    terms:
      - "xuất kích"
      - "thành phố"
    pronouns_and_address: "Quy chiếu Tanya bằng `Cô` và thuộc cấp bằng `họ`."
    pov_and_voice: "Giọng trần thuật tóm lược cách hiểu của Grantz."
    modality_and_logic: "Bảo toàn đủ 2 câu: cô đang đưa ra chỉ thị như mọi lần xuất kích -> điểm khác biệt duy nhất là trận chiến sẽ diễn ra trong thành phố."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000410
    terms:
      - "hạn chế"
      - "mục tiêu chính"
      - "pháp sư địch"
    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng suy luận hợp lý hóa của Grantz."
    modality_and_logic: "Bảo toàn đủ 2 câu: thừa nhận một vài hạn chế sẽ khác đi -> nhượng bộ dù có điều chỉnh như vậy thì mục tiêu chính là tiêu diệt các pháp sư địch vẫn không đổi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000411
    terms: []
    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng độc thoại nội tâm chần chừ, hé lộ chút gợn nghi ngờ của Grantz."
    modality_and_logic: "Bảo toàn dấu chấm lửng mở đầu `…` và tình thái dè dặt (`*…Ít nhất thì lẽ ra phải vậy.*`)."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ đoạn (bao gồm cả dấu ba chấm mở đầu) tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000412
    terms:
      - "cảnh báo"
      - "trận chiến đô thị"
      - "đầu hàng"
      - "thương vong"
      - "quét sạch"
    pronouns_and_address: "Lược chủ ngữ `anh` ở đầu câu 1, chuyển đại từ ngôi thứ hai phiếm chỉ sang `ta` ở câu 3 và giữ đại từ trung tính `họ` cho đối tượng bị tấn công."
    pov_and_voice: "Giọng suy luận chiến thuật thông thường của Grantz về lợi ích giảm thương vong khi kêu gọi đầu hàng trong tác chiến đô thị."
    modality_and_logic: "Bảo toàn đủ 3 câu: câu hỏi phỏng đoán có lẽ là chuyện cảnh báo -> lý lẽ hiển nhiên trong trận chiến đô thị rằng khiến địch đầu hàng thay vì kết liễu sẽ ít thương vong hơn -> điều kiện nếu họ từ chối thì chỉ việc tiến hành một trận đánh hơi phiền phức để quét sạch họ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000413
    terms:
      - "cảnh báo"
    pronouns_and_address: "Lời thoại kết thúc phổ biến mệnh lệnh của Tanya dùng `họ` cho phía địch và `chúng ta` cho đơn vị."
    pov_and_voice: "Giọng chốt mệnh lệnh gọn lạnh của Tanya."
    modality_and_logic: "Bảo toàn đủ 3 câu: điều kiện nếu họ chấp nhận cảnh báo thì tốt -> điều kiện ngược lại nếu không thì chuyển sang tiêu diệt họ -> câu kết thúc mệnh lệnh (`Chỉ vậy thôi.`)."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ câu 1 và câu 3 ở chữ thường, chỉ bọc dấu `*...*` quanh câu điều kiện thứ hai (`*Nếu không, chúng ta sẽ chuyển sang tiêu diệt họ.*`) tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000414
    terms:
      - "cấp trên"
      - "đầu hàng"
    pronouns_and_address: "Trần thuật quy chiếu Grantz bằng `anh`, Tanya bằng `cấp trên của anh`, và phía đối phương trong câu nội tâm cuối bằng `họ`."
    pov_and_voice: "Giọng trần thuật ghi nhận âm sắc vô cảm quen thuộc của Tanya, kèm lời nhẩm lại trong đầu Grantz."
    modality_and_logic: "Bảo toàn đủ 2 câu: giọng cấp trên hoàn toàn đều đều, che giấu cảm xúc như mọi khi -> câu nhẩm lại điều kiện đầu hàng."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ câu đầu ở chữ thường, chỉ bọc dấu `*...*` quanh câu thứ hai (`*Nếu họ đầu hàng thì tốt.*`) tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000415
    terms: []
    pronouns_and_address: "Dùng `họ` cho đơn vị của Grantz và `đối phương` cho phía địch."
    pov_and_voice: "Giọng tự trấn an của Grantz rằng mọi thứ hoàn toàn bình thường."
    modality_and_logic: "Bảo toàn mệnh đề điều kiện nếu không suôn sẻ thì chuyển sang hạ gục đối phương như thường lệ và cụm kết sau dấu gạch ngang dài (`—chuyện hết sức bình thường`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000416
    terms:
      - "xuất kích"
      - "quả cầu tính toán"
      - "súng trường"
      - "chiến trường"
      - "vũ khí"
      - "bảo dưỡng"
    pronouns_and_address: "Trần thuật quy chiếu Grantz bằng `anh`; câu hỏi nội tâm trực tiếp in nghiêng tự quy chiếu bằng `mình` và `chúng ta` (`B13-R06`)."
    pov_and_voice: "Giọng trần thuật đan xen câu tự vấn kỷ luật nhà binh của Grantz, gạt bỏ linh cảm bất an để tập trung kiểm tra vũ khí trước giờ xuất kích."
    modality_and_logic: "Bảo toàn đủ 5 câu: nếu phải nói rõ thì đành thừa nhận có điều khác thường -> cảm giác có gì đó không ăn khớp, không ổn -> câu hỏi tự vấn nội tâm có nên để tâm trí phân tán ngay trước khi xuất kích không -> hành động kiểm tra lần cuối quả cầu tính toán và súng trường -> so sánh thà quên đi suy nghĩ khác còn hơn ra chiến trường không dùng được vũ khí vì bảo dưỡng không đầy đủ."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002` và `B13-R01`: chỉ bọc dấu `*...*` quanh trọn câu hỏi nội tâm thứ ba (`*Dẫu vậy, mình có thật sự nên để tâm trí bị phân tán ngay trước khi chúng ta xuất kích không?*`) tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000417
    terms:
      - "Tân binh"
      - "chiến tranh"
    pronouns_and_address: "Quy chiếu nhóm `Tân binh` bằng `họ`."
    pov_and_voice: "Giọng trần thuật khái quát khép lại phân cảnh chuẩn bị xuất kích của Tiểu đoàn 203."
    modality_and_logic: "Bảo toàn cả hai vế: tân binh được khắc sâu vào đầu rằng học hỏi là bước đầu tiên để sống sót -> mỗi ngày trôi qua lại càng quen với chiến tranh hơn."
    emphasis: "none"
