  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` cho đại từ trần thuật ngôi thứ ba (`nó` / `Tanya`) và câu nội tâm trực tiếp (`Mình` ở p000203), giữ nguyên sự chuyển đổi điểm nhìn ngôi thứ ba ↔ ngôi thứ nhất (`tôi` / `chúng tôi`) của nguyên tác, đồng thời bảo toàn toàn bộ các lựa chọn cấp bậc, xưng hô và khử mơ hồ đại từ đã được signoff trong `handoffs/vol-02/ch-01-b08.yml` (`Thiếu úy Serebryakov` ở p000200, `thưa Thiếu tá` ở p000213, `lá cờ của sở chỉ huy ấy` ở p000216)."
