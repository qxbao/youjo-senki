  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, nhân vật, cấp bậc và thuật ngữ quân sự – ma pháp đã xác lập ở Tập 1 cùng B01–B07 của Tập 2 (`ưu thế trên không`, `Thiếu tá`, `Trung úy Weiss`, `Thiếu úy Serebryakov`, `Quân đội Dacia`, `Quân đội Đế quốc`, `Đế quốc`, `lẽ thường`, `quả cầu`, `đại đội`, `tiểu đoàn`, `lớp vỏ phòng ngự`), đồng thời khóa tạm toàn bộ 6 nhóm thuật ngữ và lựa chọn đã sửa theo M1–M3, L-a, L-b và được signoff trong `handoffs/vol-02/ch-01-b08.yml` cùng `work/run-state/pending-terms.yml` (`sở chỉ huy` / `tổng hành dinh` / `tổng hành dinh dã chiến`, `chiến thuật chặt đầu bộ chỉ huy`, `trinh sát bằng lực lượng`, `không mã hóa` / `không bảo mật` / `tin đánh lừa`, giữ nguyên `Type 97` / `Type 95`, `cơ quan quản lý nhập cảnh` / `kiểm tra nhập cảnh` / `Đội Tuần tra Biên giới của Quân đội Đế quốc`)."
  uncertainty: medium
