- source_term: dacian_hq_intercept_raid_and_mock_immigration_terms_vol02_ch01_b08
  proposed_vi: "sở chỉ huy, sở chỉ huy tiền tuyến, sở chỉ huy cấp sư đoàn hoặc lữ đoàn (part0010/p000179, p000184, p000185, p000216) / ưu thế trên không, chiến thuật chặt đầu bộ chỉ huy, đầu não của quân địch (part0010/p000182) / Thiếu tá (part0010/p000183, p000213) / tổng hành dinh, tổng hành dinh của đạo quân xâm lược, đạo quân xâm lược (part0010/p000186, p000189, p000190, p000192, p000197, p000206, p000211) / bức điện không mã hóa, không mã hóa, tín hiệu không mã hóa (part0010/p000191, p000192, p000199) / tin đánh lừa, điện báo viên, sĩ quan thông tin (part0010/p000192) / vùng trời, cường độ tín hiệu (part0010/p000194, p000196) / Quân đội Dacia, lục quân, tín hiệu không bảo mật, Quân đội Đế quốc (part0010/p000197, p000211, p000217) / lẽ thường (part0010/p000198) / quả cầu (part0010/p000199) / Trung úy Weiss, Thiếu úy Serebryakov, đại đội (part0010/p000200, p000202) / cơ động trên không, trinh sát bằng lực lượng, lớp vỏ phòng ngự, Type 97, Type 95 (part0010/p000202) / đội hình xung kích (part0010/p000211) / Đế quốc (part0010/p000212, p000217) / cơ quan quản lý nhập cảnh, kiểm tra nhập cảnh (part0010/p000214, p000218) / tiểu đoàn (part0010/p000215) / tổng hành dinh dã chiến (part0010/p000216) / trưởng đoàn du lịch, Đội Tuần tra Biên giới của Quân đội Đế quốc, hộ chiếu (part0010/p000217) / người Dacia (part0010/p000218)"
  alternatives_vi:
  - bộ chỉ huy hoặc trạm chỉ huy, sở chỉ huy dã chiến (thay cho hệ phân biệt `sở chỉ huy` / `tổng hành dinh` / `tổng hành dinh dã chiến` tại part0010/p000179, p000184–p000186, p000189, p000192, p000197, p000206, p000211, p000216 — ưu tiên giữ phân biệt theo `vol02-ch01-b08-command-post-headquarters` đã signoff: `sở chỉ huy` cho cấp sư đoàn/lữ đoàn và vị trí chỉ huy chung, `tổng hành dinh` cho đại bản doanh đạo quân xâm lược, và `tổng hành dinh dã chiến` kèm `sở chỉ huy ấy` ở p000216 để giữ liên kết địa điểm mà không gây mơ hồ đại từ `nó`) / trinh sát vũ trang hoặc trinh sát chiến đấu, trinh sát bằng vũ lực (thay cho `trinh sát bằng lực lượng` tại part0010/p000202 — ưu tiên `trinh sát bằng lực lượng` theo `vol02-ch01-b08-air-power-tactics` để giữ nghĩa chiến thuật trung tính và tránh sắc thái bạo lực của `bằng vũ lực`) / nghi binh hoặc thông tin sai lệch (thay cho `tin đánh lừa` tại part0010/p000192 — ưu tiên `tin đánh lừa` theo `vol02-ch01-b08-comms-disinformation` vì bám đúng bình diện thông tin thay vì động tác điều binh) / cơ quan xuất nhập cảnh và lực lượng tuần tra biên giới (thay cho `cơ quan quản lý nhập cảnh` tại part0010/p000214 và `Đội Tuần tra Biên giới của Quân đội Đế quốc` tại part0010/p000217 — ưu tiên phương án đã signoff theo `vol02-ch01-b08-border-procedures` vì khớp chiều nhập cảnh trong trò đùa hỏi hộ chiếu và giữ sắc thái tên đơn vị viết hoa của nguồn) / quân Dacia hoặc phía Dacia (thay cho `người Dacia` tại part0010/p000218 — giữ `người Dacia` vì hợp tự nhiên với ngữ cảnh trò đùa đóng giả kiểm tra đoàn khách du lịch nhập cảnh sau khi đã dùng `Quân đội Dacia` ở p000197, p000211)
