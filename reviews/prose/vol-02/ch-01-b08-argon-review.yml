- source_term: tanya_subordinates_and_dacians_pronouns_and_address_vol02_ch01_b08
  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng tên riêng `Tanya` kết hợp đại từ phản thân `mình` (part0010/p000181), lặp tên `Tanya` và dùng đại từ `nó` / `Nó` theo DEC-P01-001 (part0010/p000198, p000216, p000217), tuyệt đối không dùng `cô` trong trần thuật và đã đổi `lá cờ của nó` ở p000216 thành `lá cờ của sở chỉ huy ấy` để tránh nhầm với Tanya; câu nội tâm in nghiêng ở p000203 tự quy chiếu bằng `Mình` theo DEC-P01-001; các đoạn trần thuật ngôi thứ nhất của Tanya dùng `tôi` / `Tôi` (part0010/p000199, p000202, p000204, p000206, p000210, p000212, p000215) kèm đại từ phản thân `mình` (p000199, p000202, p000204), và dùng `ta` / `chúng tôi` khi chỉ tập thể đơn vị Đế quốc (part0010/p000182, p000202, p000208, p000211, p000216); trần thuật quy chiếu sĩ quan báo cáo thông tin bằng `anh ta` / `anh` (part0010/p000197, p000199); quy chiếu phía địch Dacia bằng `chúng` (trong câu báo cáo đầu tiên p000179) và `họ` (trong báo cáo và trần thuật tại p000196, p000218); trong đối thoại quân sự: cấp dưới báo cáo và đáp lời Tanya tự xưng `Chúng tôi` / `tôi` / `Tôi`, gọi Tanya là `Thiếu tá`, `cô` (khi giải thích lý do ở p000194, tiếp nối tiền lệ B03 p000045) và `thưa Thiếu tá` (dịch từ `ma'am` ở p000213); Tanya tự xưng `tôi`, gọi thuộc cấp trực tiếp là `Cậu` / `cậu` (p000187, p000200), gọi đích danh `Trung úy Weiss` và `Thiếu úy Serebryakov` (p000200), gọi chung các sĩ quan thuộc cấp bằng giọng mỉa mai lịch sự `Các vị` kèm `chúng ta` (p000209, p000212, p000214); khi diễn kịch kiểm tra nhập cảnh trước mặt sĩ quan Dacia trong lều tổng hành dinh (p000217), Tanya tự xưng `tôi` và gọi đối phương bằng giọng lễ phép giả tạo `Ngài` (với người được hỏi là trưởng đoàn) và `các vị` / `Các vị` (với cả nhóm trong lều)"
  alternatives_vi:
  - thưa ngài hoặc thưa cô (thay cho `thưa Thiếu tá` khi dịch `ma'am` tại part0010/p000213 — ưu tiên `thưa Thiếu tá` theo `vol02-ch01-b08-ranks-and-address` đã signoff để giữ đúng chiều hạ cấp thưa gửi thượng cấp, khớp với p000183 và không suy diễn giới tính hay dùng nhầm danh xưng `thưa ngài` vốn dành cho cấp trên của Tanya ở B02) / Trung úy cho cả Weiss và Serebryakov (tại part0010/p000200 — ưu tiên phân biệt `Trung úy Weiss` và `Thiếu úy Serebryakov` theo `provisional_review_choices.serebryakov_rank` đã sửa M1 và signoff, giữ nhất quán với bản đồ cấp bậc tạm xuyên suốt B02–B07)
