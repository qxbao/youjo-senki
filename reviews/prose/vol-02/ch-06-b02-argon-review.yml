    terms:
      - "Đế quốc"
    pronouns_and_address: "Dùng đại từ khái quát ngôi thứ nhất gộp `ta` cho chủ thể nhận thức chung (`you` phiếm chỉ)."
    pov_and_voice: "Giọng thuyết minh truyền hình của phóng viên Andrew nêu vấn đề pháp lý và đạo lý."
    modality_and_logic: "Bảo toàn hai nhận định song hành: hành động đáp trả của Đế quốc đến nay vẫn gây tranh cãi và bị nhiều người chỉ trích; đồng thời khó lòng không nhận thấy sự chênh lệch kỳ lạ giữa những bộ luật phức tạp và lẽ thường."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000037
    terms:
      - "học giả luật pháp"
      - "vụ thảm sát"
      - "luật chiến tranh"
    pronouns_and_address: "Andrew gọi trực tiếp khán giả truyền hình là `quý vị đang theo dõi ở nhà`."
    pov_and_voice: "Giọng dẫn chương trình nhấn mạnh nghịch lý pháp lý gây chấn động người xem."
    modality_and_logic: "Bảo toàn kết luận đồng thuận của giới học giả luật pháp rằng vụ thảm sát không vi phạm luật chiến tranh nào, và suy đoán chắc chắn (`Hẳn... sẽ khiến`) rằng sự thật ấy gây sửng sốt cho khán giả."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000038
    terms:
      - "cuộc nổi dậy vũ trang"
      - "quân phục"
      - "chiến binh phi chính quy"
      - "luật pháp quốc tế"
      - "tù binh"
    pronouns_and_address: "Quy chiếu những người dân tham gia nổi dậy vũ trang bằng `Họ` / `họ`."
    pov_and_voice: "Giọng giải thích ngắn gọn, rành mạch cơ sở phân loại pháp lý quốc tế."
    modality_and_logic: "Bảo toàn chuỗi lập luận 3 câu: người dân tham gia nổi dậy vũ trang không mặc quân phục -> họ là chiến binh phi chính quy -> nói cách khác, luật pháp quốc tế thậm chí không bảo đảm cho họ quyền được đối xử như tù binh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000039
    terms:
      - "Lục quân Đế quốc"
    pronouns_and_address: "Quy chiếu nhóm nổi dậy trong thành phố bằng `họ`."
    pov_and_voice: "Giọng dẫn nối kết từ quy định pháp lý sang hành động thực tế của Lục quân Đế quốc."
    modality_and_logic: "Bảo toàn tình thái suy đoán (`Có lẽ vì thế mà`) về lý do Lục quân Đế quốc bao vây và gửi lời cảnh cáo."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000040
    terms:
      - "Quy tắc Chiến tranh trên bộ"
      - "công dân Đế quốc"
    pronouns_and_address: "Lời cảnh cáo của phía Đế quốc tự xưng `Chúng tôi` / `chúng tôi`, gọi lực lượng nổi dậy là `các người` và quy chiếu dân thường không thuộc phe phái nào bằng `họ`."
    pov_and_voice: "Giọng tuyên bố tối hậu thư trang trọng, viện dẫn điều khoản pháp lý quân sự."
    modality_and_logic: "Bảo toàn đủ 3 câu mệnh lệnh và yêu sách: yêu cầu lập tức thả dân thường không thuộc phe phái nào; tuyên bố không thể để hành vi tàn sát tiếp diễn; và viện dẫn điều 26, khoản 3 của Quy tắc Chiến tranh trên bộ để yêu cầu thả các công dân Đế quốc."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ lời cảnh cáo được trích dẫn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000041
    terms:
      - "Đế quốc"
      - "Lục quân Đế quốc"
    pronouns_and_address: "Dùng đại từ gộp `ta` cho người dẫn và khán giả khi nêu dữ kiện đã được xác nhận."
    pov_and_voice: "Giọng thuyết minh lịch sử thận trọng đối chiếu sự thiếu hụt tư liệu với sự việc được chứng kiến trực tiếp."
    modality_and_logic: "Bảo toàn quan hệ đối lập: ghi chép về hành động của dân chúng rất thưa thớt do hỗn loạn, nhưng có dữ kiện xác thực rằng một số ít người ủng hộ Đế quốc tìm cách trốn thoát và bị bắn ngay trước mắt Lục quân Đế quốc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000042
    terms:
      - "thảm kịch"
    pronouns_and_address: "Câu hỏi chuyển đoạn không dùng đại từ nhân xưng."
    pov_and_voice: "Câu hỏi đặt vấn đề trực diện của người dẫn chương trình."
    modality_and_logic: "Bảo toàn câu hỏi nguyên nhân vì sao thảm kịch lại xảy ra."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000043
    terms:
      - "tuyên truyền"
      - "Cộng hòa"
      - "quân cứu viện"
    pronouns_and_address: "Lặp lại danh ngữ `Phía Cộng hòa` ở câu thứ hai để tránh nhập nhằng quy chiếu với `các học giả` ở câu đầu."
    pov_and_voice: "Giọng tổng thuật quan điểm nghiên cứu lịch sử những năm gần đây."
    modality_and_logic: "Bảo toàn mức độ khả thể (`đã nêu khả năng`) rằng đây là hệ quả ngoài dự kiến từ công tác tuyên truyền của Cộng hòa, gắn với việc phía Cộng hòa từng bày tỏ ý định phái quân cứu viện giành lại thành phố."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000044
    terms:
      - "binh sĩ Cộng hòa"
      - "Đế quốc"
    pronouns_and_address: "Câu trần thuật khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng thuyết minh bổ sung mức độ sẵn sàng tham chiến của một bộ phận quân Cộng hòa."
    modality_and_logic: "Bảo toàn sắc thái nhấn mạnh tăng tiến (`Thậm chí`) về việc một số binh sĩ Cộng hòa đã sẵn sàng giao chiến với Đế quốc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000045
    terms:
      - "sử gia"
      - "Arene"
      - "pháp sư"
      - "Quân đội Cộng hòa"
    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng thuyết minh dẫn nguồn nhận định của giới sử gia."
    modality_and_logic: "Bảo toàn hai nhận định nối tiếp của giới sử gia: bầu không khí ấy lan đến người dân Arene, và sự xuất hiện của các pháp sư thuộc Quân đội Cộng hòa đã khiến dân chúng đưa ra quyết định sai lầm."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000046
    terms:
      - "người sống sót"
      - "Cộng hòa"
    pronouns_and_address: "Quy chiếu người dân trong thành phố bằng `họ`."
    pov_and_voice: "Giọng dẫn chứng thực tế từ lời kể của những người sống sót."
    modality_and_logic: "Bảo toàn sự tương ứng giữa nhận định của sử gia và lời kể của nhiều người sống sót về tâm lý phổ biến khi ấy: tin rằng họ có thể cầm cự cho đến khi Cộng hòa đến cứu."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000047
    terms:
      - "Đế quốc"
    pronouns_and_address: "Câu trần thuật ngắn không dùng đại từ nhân xưng."
    pov_and_voice: "Nhịp dẫn ngắn gọn báo hiệu bước ngoặt cuối cùng trước khi khai hỏa."
    modality_and_logic: "Bảo toàn trình tự thời gian: sau đó Đế quốc đưa ra lời cảnh cáo cuối cùng."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000048
    terms:
      - "chiến binh phi chính quy"
      - "cuộc nổi dậy vũ trang"
      - "Quy tắc Chiến tranh trên bộ"
      - "thần dân Đế quốc"
    pronouns_and_address: "Người phát cảnh cáo tự xưng `tôi`, đại diện cho phía Đế quốc là `chúng tôi`, và gọi lực lượng nổi dậy là `các người`."
    pov_and_voice: "Giọng tuyên đọc tối hậu thư sắc lạnh, chuẩn mực điều lệnh và pháp lý."
    modality_and_logic: "Bảo toàn định danh đối tượng nhận cảnh cáo (các chiến binh phi chính quy trong cuộc nổi dậy vũ trang) và yêu sách chiếu theo điều 8, khoản 5 của Quy tắc Chiến tranh trên bộ đòi cử người gặp đại diện Đế quốc để thảo luận về những thần dân Đế quốc đang bị giam giữ bất công."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn trích dẫn lời cảnh cáo tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000049
    terms:
      - "Arene"
    pronouns_and_address: "Lời đáp của phía thành phố Arene tự xưng `Chúng tôi`."
    pov_and_voice: "Lời tuyên bố dứt khoát của phía thành phố Arene khước từ yêu sách của Đế quốc."
    modality_and_logic: "Bảo toàn phần dẫn ngoài dấu nghiêng và 3 câu tuyên bố trong dấu nghiêng: khẳng định họ là cư dân Arene, phủ định hoàn toàn việc có người bị giam giữ, và tuyên bố họ chỉ là những người muốn được tự do."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh lời thoại trích dẫn trong thẻ `<html:em>`, giữ nguyên phần dẫn `Đáp lại, thành phố Arene tuyên bố:` ở dạng chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000050
    terms:
      - "Quy tắc Chiến tranh trên bộ"
      - "chiến binh phi chính quy"
      - "công dân Đế quốc"
      - "Đế quốc"
    pronouns_and_address: "Lặp lại danh từ `thành phố` ở cuối câu để câu tiếng Việt rõ nghĩa, trang trọng."
    pov_and_voice: "Giọng thuyết minh tóm kết logic pháp lý lạnh lùng dẫn tới chiến dịch tấn công."
    modality_and_logic: "Bảo toàn quan hệ nhân quả pháp lý: theo Quy tắc Chiến tranh trên bộ, vì trong số các chiến binh phi chính quy chiếm đóng thành phố không có người bị giam giữ cũng như không có công dân Đế quốc, nên Đế quốc tiến hành chiến dịch chiếm lại thành phố."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000051
    terms:
      - "binh sĩ"
      - "pháo kích"
    pronouns_and_address: "Quy chiếu các binh sĩ bằng `họ` ở mệnh đề điều kiện và làm rõ chủ ngữ `quân đội` ở mệnh đề chính để tránh mơ hồ quy chiếu."
    pov_and_voice: "Giọng phân tích mục đích giảm thiểu gánh nặng trách nhiệm cá nhân cho binh lính thông qua lựa chọn hỏa lực pháo binh."
    modality_and_logic: "Bảo toàn mệnh đề mục đích kèm giả định (`Để tránh đặt từng binh sĩ trước gánh nặng trách nhiệm lớn nếu họ tiến vào thành phố và phải tận mắt xác nhận mục tiêu`) và phương thức tác chiến (`nhắm tới việc gây ra những đám cháy lan rộng bằng cách pháo kích từ các vị trí bao quanh thành phố`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000052
    terms:
      - "thử nghiệm ý tưởng"
      - "bão lửa"
    pronouns_and_address: "Quy chiếu phía quân đội Đế quốc bằng `họ`."
    pov_and_voice: "Giọng thuyết minh tiết lộ chi tiết lạnh người từ một phần hồ sơ lưu trữ."
    modality_and_logic: "Bảo toàn thông tin tư liệu: một phần hồ sơ cho thấy họ đã chọn những mục tiêu dễ làm lửa lan rộng nhằm thử nghiệm ý tưởng tạo ra một trận bão lửa."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000053
    terms:
      - "Lục quân Đế quốc"
      - "Thảm sát Arene"
    pronouns_and_address: "Câu trần thuật định danh sự kiện không dùng đại từ nhân xưng."
    pov_and_voice: "Lời kết đanh thép khép lại phần tóm tắt diễn biến sự kiện."
    modality_and_logic: "Bảo toàn định danh lịch sử: hành động tàn bạo khét tiếng do Lục quân Đế quốc gây ra này thường được gọi là Thảm sát Arene."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000054
    terms:
      - "Giáo sư Walter Halbom"
      - "Đại học Londinium"
      - "Lục quân Đế quốc"
    pronouns_and_address: "Andrew dùng đại từ gộp `chúng ta` khi giới thiệu khách mời và gọi trực tiếp khách mời là `Thưa Giáo sư Halbom`."
    pov_and_voice: "Giọng người dẫn chương trình giới thiệu chuyên gia khách mời và đặt câu hỏi phỏng vấn trực diện."
    modality_and_logic: "Bảo toàn lời giới thiệu Giáo sư Walter Halbom thuộc Đại học Londinium, lời chuyển ý vào thẳng vấn đề và câu hỏi vì sao Lục quân Đế quốc lại hành động quân sự quyết liệt không chút do dự."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000055
    terms:
      - "binh sĩ Đế quốc"
      - "Mô thức tư duy"
    pronouns_and_address: "Lược đại từ ngôi thứ hai phiếm chỉ (`cần hiểu`), quy chiếu binh sĩ Đế quốc bằng `họ`."
    pov_and_voice: "Giọng trả lời phỏng vấn điềm đạm, mang tính phân tích học thuật pha nét trò chuyện tự nhiên của Giáo sư Halbom."
    modality_and_logic: "Bảo toàn 3 câu mở đầu lập luận: cần hiểu cách nghĩ của binh sĩ Đế quốc khi ấy; mô thức tư duy của họ thường nghiêng về quân sự; nói cách khác, họ muốn áp dụng lối suy nghĩ ấy vào mọi việc."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại đang tiếp diễn (mở ngoặc kép ở đầu đoạn, chưa đóng ngoặc kép ở cuối đoạn) tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000056
    terms:
      - "chiến lược"
    pronouns_and_address: "Quy chiếu binh sĩ / phía quân sự Đế quốc bằng `họ`."
    pov_and_voice: "Giọng giải thích giản dị hóa khái niệm học thuật cho khán giả truyền hình."
    modality_and_logic: "Bảo toàn cách diễn giải tương đương: họ nhìn mọi việc dưới góc độ chiến lược và những chuyện đại loại thế."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000057
    terms:
      - "bạo loạn"
      - "hậu phương"
      - "chiến tuyến"
      - "Quân đội Khu vực phía Tây"
    pronouns_and_address: "Giáo sư Halbom gọi người dẫn/khán giả là `quý vị` và quy chiếu những người mang lối tư duy quân sự ấy bằng `họ`."
    pov_and_voice: "Giọng dẫn dắt người nghe đặt mình vào góc nhìn chiến lược của quân đội Đế quốc."
    modality_and_logic: "Bảo toàn tình thái suy đoán (`hẳn quý vị có thể hiểu`) về ý nghĩa nghiêm trọng của các cuộc bạo loạn nổ ra ở hậu phương, phía sau chiến tuyến của Quân đội Khu vực phía Tây, đối với những người có lối tư duy đó."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000058
    terms:
      - "vùng Arene-Roygen"
      - "Đế quốc"
      - "kháng chiến du kích"
      - "Lục quân Đế quốc"
      - "phe chống Đế quốc"
    pronouns_and_address: "Dùng đại từ gộp `Ta` trong lời mời phân tích từng bước (`Ta hãy xét từng bước`)."
    pov_and_voice: "Giọng giảng giải có hệ thống, bóc tách từng tiền đề chiến lược."
    modality_and_logic: "Bảo toàn bước phân tích thứ nhất: vùng Arene-Roygen vốn luôn âm ỉ mầm mống kháng chiến du kích, và Lục quân Đế quốc đặt giả thuyết có kẻ đang kích động phe chống Đế quốc trong vùng."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000059
    terms: []
    pronouns_and_address: "Giáo sư Halbom tự xưng `tôi`."
    pov_and_voice: "Giọng nhận định cá nhân của chuyên gia lịch sử quân sự."
    modality_and_logic: "Bảo toàn cấu trúc phủ định kép / tình thái khả thể: vấn đề thực sự nằm ở chỗ không thể hoàn toàn bác bỏ khả năng ấy."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000060
    terms:
      - "cuộc nổi dậy"
      - "khu vực hậu phương"
      - "Lục quân Đế quốc"
      - "tiền tuyến"
    pronouns_and_address: "Lược đại từ ngôi thứ hai phiếm chỉ trong mệnh đề điều kiện (`nếu xét rằng`)."
    pov_and_voice: "Giọng phân tích nối mạch nhân quả địa chiến lược."
    modality_and_logic: "Bảo toàn quan hệ điều kiện – hệ quả: nếu xét thêm việc cuộc nổi dậy đã chia cắt các khu vực hậu phương của Lục quân Đế quốc ở phía tây khỏi tiền tuyến, thì phần còn lại rất dễ hiểu."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000061
    terms:
      - "Bộ Tổng tham mưu Lục quân Đế quốc"
      - "đơn vị trấn áp"
      - "Đế quốc"
      - "phòng tuyến sông Rhine"
      - "dân quân"
      - "Quân đội Cộng hòa"
      - "khu công nghiệp phía tây"
    pronouns_and_address: "Quy chiếu phía Đế quốc / Bộ Tổng tham mưu bằng `họ`."
    pov_and_voice: "Giọng phân tích sâu sắc mối lo ngại chiến lược hàng đầu của Bộ Tổng tham mưu Đế quốc."
    modality_and_logic: "Bảo toàn đầy đủ hai câu: nỗi sợ lớn nhất của Bộ Tổng tham mưu Lục quân Đế quốc khi ấy là quân đội phía tây bị ghìm chân trước khi kịp gom đủ quân lập đơn vị trấn áp; và vì đại bộ phận lực lượng Đế quốc đang dồn ở các phòng tuyến sông Rhine, một cuộc tấn công của dân quân trong lúc quân chủ lực bị Quân đội Cộng hòa ghìm chân có thể khiến Đế quốc mất khu công nghiệp phía tây."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000062
    terms:
      - "vùng Arene-Roygen"
      - "khu công nghiệp"
      - "Arene"
      - "tuyến đường sắt tiếp tế"
    pronouns_and_address: "Quy chiếu phía Đế quốc bằng `họ`, Giáo sư Halbom tự xưng `Tôi`."
    pov_and_voice: "Giọng phân tích kịch bản thứ hai với nhịp ngập ngừng (`nhưng…`) làm nổi bật vị trí yết hầu giao thông của Arene."
    modality_and_logic: "Bảo toàn kịch bản thứ hai: ngay cả khi cuộc nổi dậy chỉ giới hạn trong vùng Arene-Roygen và khu công nghiệp được bảo vệ, việc Arene là thành phố lớn nằm ngay trên tuyến đường sắt tiếp tế vẫn đóng vai trò trọng yếu."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000063
    terms:
      - "tuyến tiếp tế"
    pronouns_and_address: "Giáo sư Halbom hướng tới người nghe bằng cụm chuyển tiếp `quý vị biết đấy`."
    pov_and_voice: "Giọng giải thích nguyên lý hậu cần cơ bản bằng ngôn từ gần gũi."
    modality_and_logic: "Bảo toàn câu điều kiện kết hợp nhượng bộ: nếu các tuyến tiếp tế bị gây sức ép thì quân đội dù thiện chiến đến đâu cũng không thể chiến đấu lâu dài."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000064
    terms:
      - "Đế quốc"
      - "kịch bản tồi tệ nhất"
    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng đánh giá khách quan về tính hợp lý nội tại trong lối suy luận của phía Đế quốc."
    modality_and_logic: "Bảo toàn cả hai vế: nguy cơ kịch bản tồi tệ nhất xảy ra với Đế quốc là có thật, và ít nhất việc phía Đế quốc suy luận theo hướng đó cũng không phải điều bất ngờ."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000065
    terms:
      - "phong trào chống Đế quốc"
      - "Đế quốc"
      - "chiến lược"
    pronouns_and_address: "Lược đại từ gộp `We` bằng cấu trúc khách quan `Có thể thấy`."
    pov_and_voice: "Giọng tóm lược tác động tâm lý – chiến lược của cuộc nổi dậy."
    modality_and_logic: "Bảo toàn nhận định: cuộc nổi dậy của phong trào chống Đế quốc đã giáng một cú sốc lớn về mặt chiến lược cho Đế quốc."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000066
    terms:
      - "tuyến liên lạc"
      - "hậu phương"
    pronouns_and_address: "Giáo sư Halbom tự xưng nhấn mạnh `chính tôi` khi dẫn kinh nghiệm quân ngũ của bản thân."
    pov_and_voice: "Giọng khẳng định đanh thép dựa trên trải nghiệm thực tế từng phục vụ trong quân đội."
    modality_and_logic: "Bảo toàn sự nhấn mạnh mức độ: từ kinh nghiệm phục vụ trong quân ngũ, chính ông có thể khẳng định chỉ riêng ý nghĩ các tuyến liên lạc với hậu phương bị tê liệt thôi cũng đủ khiến bất cứ ai kinh hãi."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000067
    terms:
      - "Lục quân Đế quốc"
      - "Bộ chỉ huy Quân đội Cộng hòa"
      - "lực lượng kháng chiến"
      - "pháp sư Cộng hòa"
    pronouns_and_address: "Giáo sư Halbom tự xưng `tôi`, quy chiếu các lực lượng Đế quốc bằng `họ`."
    pov_and_voice: "Giọng phân tích khép lại lô với dự phóng về sự can thiệp của pháp sư Cộng hòa."
    modality_and_logic: "Bảo toàn chuỗi suy luận giả định 2 câu: Lục quân Đế quốc hình dung Bộ chỉ huy Quân đội Cộng hòa sẽ gây sức ép; nếu chuyện đó xảy ra, lực lượng Đế quốc sẽ được yêu cầu khẩn trương dẹp tan kháng chiến nhưng đồng thời phải lo ngại các pháp sư Cộng hòa tham gia và tăng cường cho lực lượng kháng chiến ấy."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."
