findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000040
    category: lexical_nuance
    issue: >-
      Tại câu thứ hai của `p000040`, cụm danh từ chỉ hành động tàn sát của phe nổi dậy (`your slaughter`) đang được chuyển thành cấu trúc động từ có bổ ngữ đại từ xác định (`tiếp tục tàn sát họ`).
    basis: >-
      Trong văn cảnh ngay sau câu yêu cầu thả những người dân thường không thuộc phe phái nào, đại từ `họ` hoàn toàn rõ nghĩa và tự nhiên trong tiếng Việt, không làm sai lệch lập luận cảnh cáo của phía Đế quốc.
    recommendation: >-
      Không chặn signoff; ở bước chuốt văn có thể giữ nguyên hoặc cân nhắc dịch sát danh ngữ `tiếp tục hành vi tàn sát của mình` / `tiếp tục cuộc tàn sát này` nếu muốn giữ độ khái quát nguyên bản.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000067
    category: lexical_nuance
    issue: >-
      Tại câu đầu của `p000067`, thành ngữ khẩu ngữ `throw their weight around` trong lời bình của Giáo sư Halbom đang được dịch trung tính thành `gây sức ép`.
    basis: >-
      Cách dịch `gây sức ép` truyền tải đúng bản chất tác động chiến lược mà Lục quân Đế quốc lo ngại từ phía Bộ chỉ huy Quân đội Cộng hòa, dù hơi giản lược sắc thái cậy thế hoặc phô trương sức mạnh của thành ngữ gốc.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc cân nhắc `dùng vị thế của mình để gây sức ép` / `ra tay gây sức ép mạnh mẽ` để làm nổi bật hơn giọng bình luận của học giả từng phục vụ quân ngũ.
    resolution: optional_polish

