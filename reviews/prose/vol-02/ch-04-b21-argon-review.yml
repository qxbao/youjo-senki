      - Đại từ "ông" quy chiếu Thiếu tướng von Zettour; "họ" quy chiếu các bên tham dự cuộc họp
    pov_and_logic:
      - Giữ đánh giá của Zettour (lục quân đã trút gần hết bất mãn, hải quân sắp cạn kiên nhẫn, kéo dài chỉ phí thời gian) và quyết định chấm dứt "cuộc săn phù thủy" (`vol02-ch04-b21-witch-hunt`) để hướng tới giải pháp thực tế
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000284
    names_and_ranks:
      - navy -> Hải quân / hải quân
      - army officers -> những sĩ quan lục quân
      - Zettour -> Zettour
    pronouns_and_address:
      - Đại từ "chúng ta" trong lời Zettour quy chiếu cuộc họp; "ông" quy chiếu Zettour
    pov_and_logic:
      - Giữ câu hỏi chuyển hướng sang bước tiếp theo dành cho hải quân, ánh nhìn nghiêm nghị ngăn các sĩ quan lục quân nói thêm, và ý nghĩ nội tâm in nghiêng của Zettour khi một sĩ quan hải quân trẻ đứng dậy
    emphasis: "*Cậu nhóc trẻ thật*"
  - segment_id: YS-LN02/Text/part0024.xhtml/p000285
    names_and_ranks:
      - Republic -> Cộng hòa
      - diplomatic front -> về mặt ngoại giao
    pronouns_and_address:
