  - id: vol02-ch04-b21-meeting-and-lergen-pov-pronouns-and-emphasis
    source_term: Imperial Army/Navy meeting pronouns and forms of address (p000278–p000303), scene transition to Lieutenant Colonel von Lergen facing Major von Degurechaff (p000304–p000311), Lergen’s address to Tanya in p000310, and DEC-P01-002 emphasis in p000284/p000295
    proposed_vi: >-
      xác nhận hệ thống điểm nhìn, đại từ, xưng hô và nhấn mạnh trong toàn lô:
      (1) Từ p000278 đến p000303 (cuộc họp giữa Bộ Tổng Tham mưu Lục quân và Hải
      quân Đế quốc dưới góc nhìn của Thiếu tướng von Zettour), quy chiếu Zettour
      bằng “Thiếu tướng von Zettour” / “Zettour” và đại từ ngôi thứ ba trang
      trọng “ông” / “Ông” (p000283, p000284, p000286, p000290); trong đối thoại,
      sĩ quan lục quân gọi phía hải quân là “các anh” (p000280), Zettour dùng
      “chúng ta” cho tập thể cuộc họp (p000284, p000296) và gọi viên sĩ quan hải
      quân trẻ là “anh” (p000287), còn phía hải quân tự xưng “Chúng tôi” / “Tôi”
      (p000285, p000303); trong trần thuật và lời bàn, phân biệt rõ chủ thể
      “Đế quốc” (p000295 — đã áp dụng bản sửa M3), “họ” / “Họ” cho phía Hải quân
      hoặc Đế quốc (p000279, p000281, p000283, p000297–p000299) và “Khối Thịnh
      vượng chung” (p000288–p000290), với “họ” / “chúng” chỉ các tàu của Liên
      minh Entente (p000285, p000290, p000294, p000296, p000298). (2) Từ p000304
      đến p000311 (chuyển cảnh sang góc nhìn của Trung tá von Lergen khi giao
      lệnh điều chuyển cho Thiếu tá von Degurechaff), quy chiếu Lergen bằng
      “Trung tá von Lergen” và đại từ “ông” (p000307–p000309); đại từ “Nó” tại
      p000304 quy chiếu sự điên loạn kết tinh trong ánh mắt và “chúng” tại
      p000305 quy chiếu “Đôi mắt kinh hoàng ấy”, hoàn toàn không dùng “nó” hay
      “mình” cho Tanya vì đoạn này thuộc điểm nhìn ngôi thứ ba của Lergen (tuân
      thủ nghiêm ngặt DEC-P01-001); trong lời thoại công vụ, Tanya gọi cấp trên
      là “Đại tá” (`vol02-ch04-b21-colonel-address`, p000306) và Lergen gọi Tanya
      là “Thiếu tá von Degurechaff, cô...” (`vol02-ch04-b21-lergen-address-for-tanya`,
      p000310). (3) Bảo toàn chính xác hai vị trí nhấn mạnh `*...*` theo đúng
      DEC-P01-002 tại p000284 và p000295, không tự thêm nhấn mạnh ở đoạn khác
    alternatives_vi:
      - các vị / ông (thay cho “các anh” / “anh” tại p000280, p000287 nếu muốn trung tính hóa hoàn toàn xưng hô trong cuộc họp) / người ta (thay cho đại từ khái quát ngôi thứ hai “bạn” tại p000305 ở bước chuốt văn để đồng bộ giọng trần thuật khách quan)
