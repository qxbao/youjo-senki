    pronouns_and_address:
      - Lược đại từ ngôi thứ nhất trong câu thoại của Zettour
    pov_and_logic:
      - Giữ lời can thiệp của Thiếu tướng von Zettour nhằm chấm dứt màn đổ lỗi và than vãn vô ích
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000283
    names_and_ranks:
