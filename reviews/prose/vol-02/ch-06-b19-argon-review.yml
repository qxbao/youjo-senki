findings:
  - id: "B19-F01"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000601"
    category: "pending_terminology_consistency"
    issue: "Tại `p000601`, tên đơn vị `203rd Aerial Mage Battalion` đang được dịch là `Tiểu đoàn Pháp sư Không quân 203`, lệch với phương án tạm đã lập trong `work/run-state/pending-terms-index.yml` là `Tiểu đoàn Pháp sư Trên không số 203`."
    basis: "Theo `agents/shared.md` và `AGENTS.md`, bản dịch cần áp dụng nhất quán phương án tạm trong sổ pending (`Tiểu đoàn Pháp sư Trên không số 203` trong `work/run-state/pending-terms-index.yml`), đồng thời tránh gọi lực lượng pháp sư trên không thuộc Lục quân Đế quốc là `Không quân`."
    recommendation: "Đổi `Tiểu đoàn Pháp sư Không quân 203` tại `p000601` thành `Tiểu đoàn Pháp sư Trên không số 203`."
    resolution: "pending_revision"

  - id: "B19-F02"
    severity: "moderate"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000608"
    category: "causal_and_temporal_logic"
    issue: "Tại câu đầu của `p000608`, cụm chỉ mục đích đào tạo đi kèm quyết định biên chế hiện tại (`As part of his training`) được dịch thành trạng ngữ chỉ thời gian quá khứ `Trong thời gian huấn luyện, anh được phân công về đại đội sở chỉ huy`, làm lệch quan hệ nhân quả với hai câu cuối đoạn."
    basis: "Trong mạch `p000606`–`p000609`, Grantz đang ở ngay cạnh Thiếu tá von Degurechaff trong đại đội sở chỉ huy tại chiến trường Arene vì việc biên chế về đại đội sở chỉ huy nằm trong chương trình huấn luyện/bồi dưỡng để anh học phong cách chỉ huy của cô (câu 4), chứ không phải chuyện chỉ diễn ra trong thời gian huấn luyện trước kia. Ngoài ra, ở câu đầu `p000604`, nhận định nghi ngờ (`was doubtful`) đang dịch hơi trung tính là `Không rõ ... hay không`."
    recommendation: "Tại `p000608`, sửa câu đầu thành `Như một phần của quá trình huấn luyện, anh được phân công về đại đội sở chỉ huy.` (hoặc `Để phục vụ việc huấn luyện, anh được phân công về đại đội sở chỉ huy.`); đồng thời ở câu đầu `p000604` nên làm rõ sắc thái nghi ngờ, chẳng hạn: `Rất đáng nghi ngờ liệu người dân Arene còn đủ phương tiện để sống sót hay không, nói gì đến chiến đấu.`"
    resolution: "pending_revision"

  - id: "B19-F03"
    severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000587"
    category: "referent_clarity_and_pending_terms"
    issue: "Tại cuối `p000587`, cụm `cho thấy rõ ý định gây hại của họ` đặt ngay sau `những nhân viên quân đội được tìm lại` khiến đại từ `họ` dễ bị đọc nhầm sang các nạn nhân thay vì dân thường phe Cộng hòa; ngoài ra ở `p000590`, `high explosives` đang dịch là `thuốc nổ mạnh` trong khi `pending-terms-index.yml` ghi `đạn nổ mạnh`."
    basis: "Trong `p000587`, chủ thể mang ý định gây hại là dân thường phe Cộng hòa đã đứng lên chống Đế quốc, còn thân thể/thi thể các nhân viên quân đội được tìm thấy là bằng chứng cho ý định đó."
    recommendation: "Ở bước chỉnh sửa hoặc polish có thể làm rõ quy chiếu ở cuối `p000587` thành `cho thấy rõ ý định gây hại của đám dân thường ấy` (hoặc `cho thấy rõ ý định sát hại của phía dân thường`), và cân nhắc dùng `đạn nổ mạnh` ở `p000590` theo `pending-terms-index.yml`."
    resolution: "optional_polish"

  - id: "B19-F04"
    severity: "minor"
    segment_id: "YS-LN02/Text/part0030.xhtml/p000603"
    category: "sentence_rhythm_and_term_alignment"
    issue: "Tại cuối `p000603`, từ nhấn mạnh đặt sau dấu ba chấm ở nguyên tác (`...firsthand.`) được đưa lên trước động từ (`định đích thân tham gia...`) nhưng vẫn giữ dấu ba chấm treo ở cuối câu; bên cạnh đó, `HQ` ở `p000605`–`p000606` đang dịch là `Bộ Chỉ huy` trong khi lô b18 liền trước và cụm `đại đội sở chỉ huy` ở `p000608` dùng `Sở chỉ huy`."
    basis: "Dấu ba chấm ở cuối `p000603` trong nguyên tác là nhịp ngắt trước trạng từ chốt câu; khi đã đảo `đích thân` lên trước thì việc để dấu ba chấm ở cuối làm câu có cảm giác bỏ lửng."
    recommendation: "Ở bước chỉnh sửa hoặc polish có thể kết câu `p000603` bằng dấu chấm hoặc giữ nhịp ngắt `...một cách trực tiếp.`, đồng thời có thể thống nhất `HQ` ở `p000605`–`p000606` thành `Sở chỉ huy` cho khớp với `p000564`–`p000577` và `p000608`."
    resolution: "optional_polish"

