    pronouns_and_address: "Trần thuật gắn với lăng kính quan sát của Tanya."
    pov_and_voice: "Giọng bình phẩm dửng dưng, pha chút liên tưởng văn hóa Á Đông từ tiền kiếp của Tanya."
    modality_and_logic: "Bảo toàn đủ 2 câu và các từ tình thái (`có lẽ`, `Chắc hẳn`): không chỉ vậy, có lẽ các pháp sư phe Cộng hòa còn bị thiêu nướng trong biển lửa -> chắc hẳn thành phố giờ trông còn giống địa ngục hơn cả những bức tranh Phật giáo được cho là mô tả cảnh ấy."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000594"
    terms:
      - "Tanya"
      - "Thượng đế"
    pronouns_and_address: "Trần thuật gắn với suy nghĩ của `Tanya`, quy chiếu `Thượng đế` bằng đại từ `ngài` (khớp `pending-terms-index.yml`)."
    pov_and_voice: "Giọng giễu cợt vô thần đặc trưng của Tanya."
    modality_and_logic: "Bảo toàn đủ 2 ý và vế điều kiện mỉa mai sau dấu gạch ngang: về chuyện đó cảm nghĩ của Tanya rất đơn giản -> Thượng đế hẳn đang bất bình/đau lòng lắm—nếu ngài tồn tại."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000595"
    terms:
      - "Being X"
      - "tôn giáo"
    pronouns_and_address: "Độc thoại nội tâm/nhận định của Tanya dùng câu hỏi tu từ và đại từ bao gộp nhân loại `chúng ta`."
    pov_and_voice: "Giọng duy lý thực dụng, phủ nhận sự cứu rỗi siêu nhiên."
    modality_and_logic: "Bảo toàn đủ 4 câu: xem ra Being X chẳng tử tế đến mức chìa tay giúp đỡ trong thảm họa kiểu này -> biết làm sao được -> chỉ con người mới cứu được con người -> quên mất điều đó rồi bám víu vào tôn giáo hẳn là điểm yếu của chúng ta."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000596"
    terms:
      - "Tanya"
      - "nhân viên quân đội"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu `Tanya` là `cô` và phản thân `mình`."
    pov_and_voice: "Giọng phân tích sự khôn ngoan thực dụng của Tanya khi tận dụng tâm lý đám đông trong lịch sử."
    modality_and_logic: "Bảo toàn đủ 2 câu: dẫu vậy, Tanya tin rằng chính điểm yếu ấy đã tạo nên những biến đổi to lớn trong lịch sử loài người -> vì thế cô giữ tay mình sạch sẽ và đi cứu những nhân viên quân đội đang bị giam cầm."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000597"
    terms:
      - "ý thức tập thể"
      - "người thực tế"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Tanya là `Cô` / `cô` và phản thân `mình`."
    pov_and_voice: "Giọng tự đắc của một kẻ theo chủ nghĩa hiện thực luôn chuẩn bị sẵn chứng cứ ngoại phạm."
    modality_and_logic: "Bảo toàn đủ 2 vế hành động: cô làm điều mà ý thức tập thể của những người yếu đuối ấy hẳn mong cô làm -> và tự khen mình là người thực tế không quên tạo sẵn cái cớ cho tương lai."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000598"
    terms:
      - "Grantz"
      - "người không tham chiến"
    pronouns_and_address: "Trần thuật ngôi thứ ba chuyển lại điểm nhìn của `Grantz` (`anh`, phản thân `mình`)."
    pov_and_voice: "Giọng khắc họa sự bấu víu tuyệt vọng vào lương tâm trong sạch của người sĩ quan trẻ."
    modality_and_logic: "Bảo toàn đủ 3 câu: trong khi đó với Grantz, người không đủ khả năng đoán được suy nghĩ trong lòng cấp trên, thứ duy nhất giữ anh tỉnh táo là đôi bàn tay trắng tinh sạch sẽ của mình -> anh có thể tự bào chữa rằng mình đã vượt qua mà không bắn vào người không tham chiến nào -> anh đang cứu người, chứ không phải tàn sát họ."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000599"
    terms: []
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Grantz bằng đại từ `anh`."
    pov_and_voice: "Giọng cảm thông pha lẫn chua xót về sự mong manh của niềm an ủi tinh thần trên chiến trường."
    modality_and_logic: "Bảo toàn dấu ba chấm và quan hệ nhượng bộ: trên chiến trường này đó chỉ là một kiểu tự huyễn hoặc/hư cấu… nhưng chừng nào còn giữ được nó, anh vẫn thấy được an ủi."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000600"
    terms:
      - "Thiếu tá von Degurechaff"
      - "chỉ huy tiểu đoàn"
      - "lời cảnh báo đầu hàng"
      - "dân quân"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Grantz là `anh` và cấp trên là `Thiếu tá von Degurechaff`."
    pov_and_voice: "Giọng nghiệt ngã khi thực tế chiến trường đập tan ảo tưởng tự trấn an của Grantz."
    modality_and_logic: "Bảo toàn quan hệ nhân quả: đáng tiếc, lời cảnh báo đầu hàng của Tiểu đoàn trưởng, Thiếu tá von Degurechaff, cùng việc dân quân bác bỏ lời cảnh báo ấy đã khiến sự tự huyễn hoặc của anh vỡ vụn chỉ trong chốc lát."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000601"
    terms:
      - "mũi tiên phong"
      - "thần dân Đế quốc"
      - "Tiểu đoàn Pháp sư Trên không số 203"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Grantz là `anh`, đơn vị là `họ`."
    pov_and_voice: "Giọng nhận thức nặng nề khi nhiệm vụ giải cứu khép lại và nhiệm vụ tác chiến thực sự ập đến."
    modality_and_logic: "Bảo toàn đủ 2 câu, giả định trái thực tế ở quá khứ (`nếu không vì... thì họ đã...`) và tên đơn vị chuẩn theo sổ pending (`Tiểu đoàn Pháp sư Trên không số 203` theo `B19-F01`)."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000602"
    terms:
      - "Pixie 01"
      - "mục tiêu"
    pronouns_and_address: "Thoại vô tuyến ngắn gọn theo mã hiệu `Pixie 01`, lược đại từ nhân xưng."
    pov_and_voice: "Giọng báo cáo và xin chỉ thị mục tiêu chuyên nghiệp, lạnh lùng."
    modality_and_logic: "Bảo toàn đủ 2 câu ngắn (`“Pixie 01, rõ. Xin thông tin mục tiêu.”`)."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000603"
    terms:
      - "tù nhân Đế quốc"
      - "tiểu đoàn"
      - "Thiếu tá von Degurechaff"
      - "Arene"
    pronouns_and_address: "Trần thuật ngôi thứ ba theo điểm nhìn tập thể trong đơn vị và Grantz."
    pov_and_voice: "Giọng bàng hoàng của binh sĩ khi nhận ra chỉ huy trưởng định trực tiếp đưa đơn vị tham gia cuộc tàn sát ở Arene."
    modality_and_logic: "Bảo toàn đủ 3 câu: sau khi nhanh chóng và an toàn giải cứu các tù nhân Đế quốc, tiểu đoàn đã tập hợp lại chờ lệnh tiếp theo -> ai cũng hiểu không cần nói ra rằng đó sẽ là nhiệm vụ vốn dĩ của họ: tấn công -> mọi người đều nói tránh đi, nhưng thật khó tin là Thiếu tá von Degurechaff dường như định trực tiếp/đích thân tham gia vào chuyện kinh hoàng đang diễn ra ở Arene."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000604"
    terms:
      - "Arene"
      - "Bộ Chỉ huy Lục quân Đế quốc"
      - "bộ chỉ huy tiểu đoàn"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu người dân Arene (`những người ấy`) và các cấp chỉ huy (`họ`)."
    pov_and_voice: "Giọng nhận định khắc nghiệt về guồng máy quân sự không dừng lại trước khi triệt hạ hoàn toàn mục tiêu."
    modality_and_logic: "Bảo toàn đủ 3 câu và sắc thái nghi ngờ ở câu 1 (theo `B19-F02`): rất đáng nghi ngờ liệu người dân Arene còn đủ phương tiện để sống sót hay không, nói gì đến chiến đấu -> thế nhưng cả Bộ Chỉ huy Lục quân Đế quốc, bộ chỉ huy tiểu đoàn lẫn từng chỉ huy đơn vị đều chưa thể hài lòng -> chừng nào những người ấy còn tồn tại trước mắt, họ sẽ dốc toàn lực cho nhiệm vụ và không chấp nhận phương án nào khác."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000605"
    terms:
      - "lệnh truy kích"
      - "Sở chỉ huy"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu các thành viên đơn vị là `Họ` / `họ` và Tanya là `vị chỉ huy của họ`."
    pov_and_voice: "Giọng đối lập sự miễn cưỡng của toàn quân với giọng điệu bình thản thường ngày của Tanya khi giục xin lệnh truy kích."
    modality_and_logic: "Bảo toàn đủ 3 câu: họ không biết cách nào khác để giải quyết tình thế -> ai cũng miễn cưỡng nói ra nhưng nếu được hỏi chính thức thì buộc phải thừa nhận rằng đã có lệnh đánh truy kích -> còn vị chỉ huy của họ vẫn trao đổi với Sở chỉ huy/Bộ Chỉ huy bằng giọng thường ngày, báo đã tập hợp lại và thúc giục ra lệnh tiếp theo."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000606"
    terms:
      - "Sở chỉ huy"
      - "Tiểu đoàn Pixie"
      - "pháp sư địch"
      - "hậu quân"
    pronouns_and_address: "Thông điệp vô tuyến từ `Sở chỉ huy` (`Bộ Chỉ huy`) gửi `Tiểu đoàn Pixie`, quy chiếu pháp sư địch là `họ`."
    pov_and_voice: "Giọng giao nhiệm vụ tác chiến qua vô tuyến."
    modality_and_logic: "Bảo toàn đủ 2 câu: báo các pháp sư địch còn lại đang làm lực lượng đoạn hậu/hậu quân khi rút lui -> hỏi đơn vị có thể tiêu diệt họ không."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000607"
    terms: []
    pronouns_and_address: "Tanya đáp qua vô tuyến, tự xưng `Tôi` khi xác nhận mục tiêu bằng mắt và `Chúng tôi` khi nhận nhiệm vụ cho cả tiểu đoàn."
    pov_and_voice: "Giọng nhận lệnh điềm tĩnh, dứt khoát."
    modality_and_logic: "Bảo toàn dấu ba chấm và đủ 3 câu ngắn (`“Tôi thấy họ rồi… Không vấn đề gì. Chúng tôi làm được.”`)."
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000608"
    terms:
      - "huấn luyện"
      - "đại đội sở chỉ huy"
      - "phong cách chỉ huy"
    pronouns_and_address: "Trần thuật ngôi thứ ba theo điểm nhìn của Grantz (`anh`, phản thân `mình`), quy chiếu Tanya là `cô`."
    pov_and_voice: "Giọng hối hận chua chát của Grantz khi nhận ra cái giá của việc được biên chế về đại đội sở chỉ huy để học cách chỉ huy của Tanya."
    modality_and_logic: "Bảo toàn đủ 4 câu và quan hệ mục đích ở câu 1 theo `B19-F02`: như một phần của quá trình huấn luyện, anh được phân công về đại đội sở chỉ huy -> ý nghĩ rằng chỉ huy đánh giá mình có tiềm năng từng khiến anh vui mừng, nhưng sự ngây thơ ấy hóa ra là một sai lầm khủng khiếp… -> điều đó có nghĩa là anh phải nghe tin tồi tệ nhất -> không ngờ anh lại được giao học phong cách chỉ huy của cô!"
    emphasis: "none"

  - segment_id: "YS-LN02/Text/part0030.xhtml/p000609"
    terms:
      - "Thiếu tá von Degurechaff"
      - "pháp sư Quân đội Cộng hòa"
    pronouns_and_address: "Trần thuật ngôi thứ ba theo điểm nhìn của Grantz (`anh`), quy chiếu đoàn người rút lui là `Họ`."
    pov_and_voice: "Giọng quan sát trực tiếp từ trên không xác nhận đoàn người rút lui và toán pháp sư Cộng hòa đầy thương tích đang bọc hậu."
    modality_and_logic: "Bảo toàn đủ 3 câu: nhìn theo ánh mắt của Thiếu tá von Degurechaff, anh quả thực thấy một nhóm người có vẻ khá trật tự -> họ ở khoảng cách có thể nhìn thấy bằng mắt thường—không thể nhầm được -> và đúng là đi khóa đuôi phía sau có một đám trông như các pháp sư Quân đội Cộng hòa, dù mình mẩy đầy thương tích."
    emphasis: "none"
