- source_term: tanya_pronouns_dialogue_and_italic_commands_vol02_ch04_b04
  proposed_vi: "Xuyên suốt phân cảnh Tanya rời bữa trưa với các quý ông địa phương, lên xe quân sự phát lệnh động viên khẩn cấp và nhận điện tín từ Hạm đội Biển Bắc (part0022/p000063–p000095), tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1, M3, M6 đã được nghiệm thu trong `handoffs/vol-02/ch-04-b04.yml`: (1) Trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000065, p000066, p000071, p000074 câu đầu, p000076 câu cuối, p000077, p000083 câu hai và ba, p000085, p000088 câu đầu, p000095 câu hai và cuối): tự quy chiếu nhất quán bằng `mình` / `Mình` (số ít) và `chúng ta` (số nhiều chỉ toàn đơn vị ở p000095); riêng tại câu hỏi nội tâm p000074 giữ chuẩn bản sửa M1 (`Liệu mình có thể chắc rằng không ai trong số họ đang thầm mừng vì người gặp chuyện không phải là họ không?`), phân biệt rõ chủ thể tự hỏi `mình` (Tanya) với đối tượng `họ` (các quý ông địa phương). (2) Trong câu trần thuật ngôi thứ ba theo điểm nhìn của Tanya (p000063, p000067, p000074 câu hai, p000076, p000078–p000080, p000083, p000088, p000092, p000095): quy chiếu Tanya bằng tên riêng `Tanya` (p000063, p000074, p000088, p000095) và đại từ `nó` / `Nó` (p000067, p000076, p000078–p000080, p000083, p000088, p000092 — bao gồm cả hai câu ở p000079 đã sửa theo M6). (3) Trong đối thoại trực tiếp và qua liên lạc (p000064, p000067, p000072, p000073, p000075, p000081, p000082, p000084, p000086, p000087, p000090, p000091, p000093, p000094): với quý ông địa phương, đối phương gọi `Thiếu tá von Degurechaff` / `Thiếu tá` và chúc `Chúc cô thượng lộ bình an, Thiếu tá.` (p000064, p000073), còn Tanya đáp lễ lịch sự `thưa ông` / `ông` và tự xưng `tôi` / `Tôi` (p000067, p000072, p000075); với cấp dưới (Hạ sĩ lái xe và sĩ quan trực ban tuần), Tanya gọi `Hạ sĩ` / `cậu` (p000081) hoặc ra lệnh trực tiếp (p000086, p000090, p000094), còn cấp dưới đáp `Vâng, thưa Thiếu tá.` (p000082), `Thiếu tá cần tôi làm gì ạ?` (p000084) và `…Vâng, đã rõ, lệnh động viên. Tôi sẽ gọi mọi người đang nghỉ phép nửa ngày quay về.` (p000087, giữ chuẩn phạm vi M3). (4) Biểu diễn nhấn mạnh theo `DEC-P01-002`: chỉ dùng `*...*` bao quanh trọn câu thoại ở đúng hai đoạn `p000090` và `p000091` tương ứng thẻ `<em>` trong nguồn, không tự thêm chữ nghiêng ở bất kỳ đoạn nội tâm nào khác."
  alternatives_vi:
  - thưa chỉ huy (thay cho `thưa Thiếu tá` tại part0022/p000082 — giữ `thưa Thiếu tá` trong bản dịch b04 đã được nghiệm thu tại `reviews/prose/vol-02/ch-04-b04-fixes-signoff-claude.md`, đồng bộ với cách gọi `Thiếu tá` ở p000084) / anh (thay cho `cậu` khi Tanya nói với Hạ sĩ lái xe tại part0022/p000081 — giữ `cậu` tự nhiên cho lời nói của Thiếu tá chỉ huy với hạ sĩ cấp dưới)
