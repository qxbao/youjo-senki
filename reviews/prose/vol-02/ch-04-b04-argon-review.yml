  proposed_vi: "Thiếu tá von Degurechaff / Thiếu tá, người phục vụ / những người phục vụ, động vật chính trị, động vật xã hội, trận tập kích (part0022/p000064, p000067, p000070, p000071, p000073, p000076, p000078, p000079) / bộ quân phục, áo khoác ngoài, áo măng tô, chiếc xe quân sự, lính phục vụ, phòng chờ (part0022/p000076–p000078) / Hạ sĩ, doanh trại, quả cầu tính toán, đồn trú, sĩ quan trực ban tuần, lệnh động viên (part0022/p000081, p000083, p000086, p000087) / thị trấn nghỉ dưỡng, Tướng von Rudersdorf, căn cứ hải quân, tuyến phía Bắc, hoạt động gián điệp, Bộ Tổng Tham mưu, Tiểu đoàn Pháp sư Không quân 203, Cục Tác chiến, Norden (part0022/p000088, p000090, p000092, p000095) / Điện tín, Bộ chỉ huy Hạm đội Biển Bắc của Hải quân Đế quốc, bộ chỉ huy hạm đội (part0022/p000093, p000095)"
  alternatives_vi:
  - lính liên lạc (thay cho `lính phục vụ` tại part0022/p000078 — bắt buộc giữ `lính phục vụ` theo bản sửa M2 đã nghiệm thu trong `handoffs/vol-02/ch-04-b04.yml` và mục `vol02-ch04-b04-orderly` trong `work/run-state/pending-terms.yml`, tuyệt đối không dịch thành cấp sĩ quan) / sĩ quan trong tuần / sĩ quan trực tuần (thay cho `sĩ quan trực ban tuần` tại part0022/p000083 — giữ `sĩ quan trực ban tuần` theo mục `vol02-ch04-b04-officer-of-week` trong sổ pending) / Tiểu đoàn Pháp sư trên không 203 (thay cho `Tiểu đoàn Pháp sư Không quân 203` tại part0022/p000088, p000095 — giữ `Tiểu đoàn Pháp sư Không quân 203` theo mục `vol02-ch04-b04-aerial-mage`) / phía Tác chiến / Ban Tác chiến (thay cho `Cục Tác chiến` tại part0022/p000092 — bắt buộc giữ `Cục Tác chiến` theo bản sửa M4 đã nghiệm thu và mục `vol02-ch04-b04-operations-division`) / Hạm đội Bắc Hải (thay cho `Hạm đội Biển Bắc` tại part0022/p000093 — bắt buộc giữ `Hạm đội Biển Bắc` theo bản sửa M5 đã nghiệm thu và mục `vol02-ch04-b04-northern-sea-fleet`)
