findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000111
    issue: "Tại câu 2 của p000111, cụm định ngữ so sánh nhất chỉ vị trí chiến tuyến nằm sát phía trước nhất (`forward-most line`) được dịch gọn thành `tuyến đầu`, làm nhẹ đi đôi chút sắc thái nhấn mạnh tuyến hào cực tiền tiêu nằm sát nách địch chỉ cách vài chục mét đã nêu ở p000109."
    basis: "Đặt trong mạch văn nối tiếp trực tiếp p000109–p000110 về khoảng cách gần nhất giữa hai tuyến hỏa lực, cách dịch `ở tuyến đầu` vẫn bảo toàn đúng đối lập không gian với khu vực hậu phương ở p000108 và p000113."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `ở tuyến tiền tiêu sát địch nhất` / `ở tuyến đầu sát nhất`."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000114
    issue: "Tại câu 2 của p000114, danh từ chỉ sóng vô tuyến (`strong waves`) được chuyển thành `tín hiệu mạnh`, dịch chuyển nhẹ từ hình ảnh vật lý của luồng sóng phát ra sang khái niệm tín hiệu liên lạc."
    basis: "Vì câu 1 vừa nêu rõ chủ đề là máy vô tuyến và vế sau đã được sửa chuẩn xác theo PR-B05-02 (`từ sở chỉ huy địch hoặc một hầm ở căn cứ của chúng`), `tín hiệu mạnh` vẫn diễn đạt tự nhiên và giữ nguyên cơ chế định vị mục tiêu bằng sóng vô tuyến."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `luồng sóng mạnh` / `bước sóng mạnh`."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000123
    issue: "Ở cuối câu thoại cảnh báo của CP gửi Pixie 01 tại p000123, tiểu từ tình thái nhắc nhở/cảnh báo khẩn thiết (`you know!`) được dịch là `biết chưa!`, hơi nghiêng sang giọng quát nạt của cấp trên đối với cấp dưới thay vì lời cảnh báo hốt hoảng về độ nguy hiểm của đạn nổ trên không."
    basis: "Trong bối cảnh liên lạc vô tuyến khẩn cấp giữa trận đánh ác liệt, `biết chưa!` vẫn truyền tải được sự sốt ruột của đài chỉ huy trước yêu cầu pháo kích liều lĩnh của Pixie 01 mà không làm sai lệch nội dung thông tin."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `đấy nhé!` / `đấy có biết không!`."
    resolution: optional_polish

