    modality_and_logic: "Bảo toàn đủ 2 câu và xử lý chuẩn xác theo `B15-F01`: câu 1 phỏng đoán mục tiêu của địch (`*Hẳn họ muốn giành lại Arene càng sớm càng tốt.*`) -> câu 2 nêu kịch bản xấu nhất nếu địch sẵn sàng rút quân khỏi các tuyến mặt trận (`rút khỏi các tuyến`, không tự thêm nhãn phòng ngự) thì tình hình sẽ trở nên rất căng thẳng."
