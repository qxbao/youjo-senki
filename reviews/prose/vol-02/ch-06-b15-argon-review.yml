  - segment_id: YS-LN02/Text/part0030.xhtml/p000456
    terms:
      - "đợt xung phong"
      - "đại đội pháp sư"
      - "tiểu đoàn tăng cường"
      - "kẻ địch"
    pronouns_and_address: "Trần thuật dùng đại từ `họ` cho phía Cộng hòa và `kẻ địch` cho phía Đế quốc, xử lý chuẩn xác theo `B15-F03`."
    pov_and_voice: "Giọng trần thuật phân tích sự chênh lệch giữa dự tính ban đầu và thực tế chiến trường."
    modality_and_logic: "Bảo toàn đủ 2 câu: ban đầu họ tưởng chỉ là một đợt xung phong đơn giản hoặc cùng lắm là một đại đội pháp sư -> nhưng nếu bất ngờ phải đối mặt với cả một tiểu đoàn tăng cường thì rõ ràng kẻ địch cực kỳ quyết tâm."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000457
    terms:
      - "Vianto"
      - "Named"
    pronouns_and_address: "Quy chiếu chỉ huy Cộng hòa bằng tên riêng `Vianto` và phía Đế quốc bằng đại từ `họ`, giữ nguyên danh hiệu `một Named`."
    pov_and_voice: "Giọng trần thuật nhấn mạnh mối bận tâm lớn nhất của Vianto."
    modality_and_logic: "Bảo toàn cấu trúc nhấn mạnh nối tiếp câu trước: điều khiến Vianto đau đầu nhất là đối phương sẵn sàng tung cả một Named vào trận."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000458
    terms:
      - "cuộc phản công ở mặt trận"
      - "các vị trí phòng thủ"
      - "nguồn tiếp tế"
    pronouns_and_address: "Trong lời thoại của sĩ quan phụ tá với Vianto, dùng `quân ta` cho chủ lực Cộng hòa, `chúng` cho quân Đế quốc ở tiền tuyến, và gọi Vianto là `anh` ở câu hỏi cuối."
    pov_and_voice: "Giọng sĩ quan phụ tá cố tìm điểm sáng chiến lược từ kế hoạch tổng phản công ở mặt trận chính."
    modality_and_logic: "Bảo toàn đủ 2 câu và sắc thái kỳ vọng theo đúng `B15-F04`: khi cuộc phản công ở mặt trận bắt đầu thì áp lực từ phía địch sẽ giảm -> quan trọng nhất là `quân ta hẳn sẽ có thể chọc thủng các vị trí phòng thủ của chúng` khi nguồn tiếp tế bị cắt đứt, kèm câu hỏi thăm dò ý kiến `anh nghĩ sao?`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000459
    terms: []
    pronouns_and_address: "Vianto tự xưng `Tôi` và dùng đại từ gộp `chúng ta` cho phe Cộng hòa."
    pov_and_voice: "Giọng trả lời thực tế, lạnh lùng và không ảo tưởng của Trung tá Vianto."
    modality_and_logic: "Bảo toàn đủ 2 câu: bác bỏ kỳ vọng lạc quan của cấp dưới là mong muốn viển vông -> khẳng định dù bản thân cũng mong thành công nhưng thực tế sẽ vô cùng gian nan."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000460
    terms:
      - "lực lượng bạn"
      - "dân quân du kích"
      - "quân mặt đất"
      - "pháp sư"
      - "hỏa lực"
      - "Đế quốc"
      - "Cộng hòa"
      - "đạn dược"
      - "thả từ trên không"
      - "quân Cộng hòa"
      - "kho dự trữ tại địa phương"
    pronouns_and_address: "Trong câu độc thoại nội tâm mở đầu, Vianto dùng `Ta` cho lực lượng mình; sang 2 câu trần thuật tiếp theo, lặp rõ danh ngữ `Quân mặt đất ấy` theo `B15-F05` để tránh nhầm chủ ngữ với du kích và gọi phe mình là `quân Cộng hòa`."
    pov_and_voice: "Độc thoại nội tâm chuyển mượt sang trần thuật phân tích tương quan hỏa lực và hậu cần dưới góc nhìn của Vianto."
    modality_and_logic: "Bảo toàn đủ 3 câu: câu hỏi nội tâm về việc đã có lực lượng bạn chi viện và gặp dân quân du kích nhưng chuyện gì sẽ xảy ra khi quân mặt đất của địch thực sự xuất hiện -> quân mặt đất ấy sẽ có pháp sư yểm trợ trong khi về căn bản hỏa lực Đế quốc mạnh hơn Cộng hòa -> về đạn dược, ngoài một lượng nhỏ được thả từ trên không, toàn bộ số đạn quân Cộng hòa có chỉ gồm kho dự trữ tại địa phương và cơ số mỗi pháp sư mang theo."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu đầu tương ứng thẻ `<html:em>`, giữ hai câu sau ở chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000461
    terms:
      - "dân thường"
      - "lá chắn"
      - "người lính"
    pronouns_and_address: "Câu 1 trần thuật dùng `Họ` cho lực lượng Cộng hòa tại Arene; câu 2 độc thoại nội tâm của Vianto dùng `chúng ta` và `người lính chúng ta`."
    pov_and_voice: "Sự đan xen giữa nhận định chiến thuật bi quan và nỗi dằn vặt đạo đức nghề lính của Vianto."
    modality_and_logic: "Bảo toàn đủ 2 câu: dự báo họ sẽ không thể cầm cự lâu và có lẽ sẽ chịu tổn thất nặng nề -> suy nghĩ nội tâm đau đớn rằng tệ hơn nữa, có lẽ họ sẽ phải chiến đấu trong khi lấy dân thường làm lá chắn—điều mà người lính nên thấy hổ thẹn."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: giữ câu đầu ở chữ thường, bọc dấu `*...*` quanh toàn bộ câu thứ hai tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000462
    terms:
      - "raison d’état"
      - "du kích"
    pronouns_and_address: "Trần thuật dùng cụm danh từ `Một số người tin vào raison d’état` và đại từ `họ` / `đất nước họ`, giữ nguyên cụm tiếng Pháp `raison d’état` đồng bộ với lô `b14`."
    pov_and_voice: "Giọng trần thuật chua chát của Vianto khi nhìn thấu sự thực dụng tàn nhẫn của giới hoạch định chiến lược Cộng hòa."
    modality_and_logic: "Bảo toàn dấu ba chấm mở đầu (`…`) và đủ 2 câu: một số kẻ tôn thờ lý lẽ quốc gia thậm chí tính rằng trong tình huống xấu nhất có thể vắt kiệt sức lực của du kích để câu giờ -> thừa nhận đó là tính toán hợp lý về lý trí nhưng đồng thời phơi bày bộ mặt xấu xí của đất nước họ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000463
    terms: []
    pronouns_and_address: "Lời thoại của sĩ quan phụ tá dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Giọng hỏi lại trầm nặng của sĩ quan phụ tá khi xác nhận phương án tác chiến cuối cùng."
    modality_and_logic: "Bảo toàn câu hỏi kết luận: vậy trong trường hợp xấu nhất, họ sẽ tiếp tục câu giờ và cố gây thiệt hại cho địch nhiều nhất có thể sao."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000464
    terms: []
    pronouns_and_address: "Vianto dùng `chúng ta` ở câu đầu và cấu trúc khái quát `làm lính` ở câu cảm thán thứ hai theo đúng `B15-F06`."
    pov_and_voice: "Giọng cam chịu đắng cay của một người lính chuyên nghiệp bị đặt vào thế buộc phải tuân lệnh."
    modality_and_logic: "Bảo toàn đủ 2 câu: khẳng định đó là lựa chọn duy nhất của họ -> lời than thở khái quát rằng dù thế nào đi nữa, làm nghề lính trong hoàn cảnh này cũng thật tồi tệ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000465
    terms:
      - "chiến dịch"
      - "dân thường"
      - "lá chắn"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Vianto và đơn vị Cộng hòa bằng đại từ `họ`."
    pov_and_voice: "Giọng trần thuật nặng nề, lột tả sự nhục nhã của những người lính phải thực thi mệnh lệnh trái lương tâm."
    modality_and_logic: "Bảo toàn đủ 2 câu: thật nhục nhã khi về cơ bản nhiệm vụ của họ là trung thành thực hiện chiến dịch biến dân thường thành lá chắn -> nhưng khi được bảo rằng việc đó sẽ giúp chiến thắng cuộc chiến, họ chẳng còn lựa chọn nào khác."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000466
    terms:
      - "chiến dịch"
      - "raison d’être"
      - "người lính"
      - "những người lính Cộng hòa"
      - "Cộng hòa"
      - "công dân Cộng hòa"
    pronouns_and_address: "Trần thuật bám điểm nhìn Vianto quy chiếu nhân vật bằng `anh` kết hợp phản thân `mình`, giữ nguyên thuật ngữ tiếng Pháp `raison d’être`."
    pov_and_voice: "Giọng trần thuật xoáy sâu vào bi kịch nội tâm và nghịch lý lý tưởng của Trung tá Vianto."
    modality_and_logic: "Bảo toàn đủ 2 câu: chẳng có chiến dịch nào khiến anh phải nghi ngờ lý do tồn tại (`raison d’être`) của mình với tư cách một người lính nhiều như chiến dịch này -> nghịch lý đau đớn khi là những người lính Cộng hòa, chiến đấu vì Cộng hòa mà lại để công dân Cộng hòa phải chết."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000467
    terms:
      - "Tiền đội địch"
      - "vùng nhận dạng phòng không"
      - "thành phố"
    pronouns_and_address: "Báo cáo tác chiến gọi lực lượng đi đầu của Đế quốc là `Tiền đội địch` ở câu 1 và đại từ `Chúng` ở câu 2."
    pov_and_voice: "Giọng báo động khẩn cấp của sỹ quan/trắc thủ cảnh giới Cộng hòa cắt ngang dòng suy tư của Vianto."
    modality_and_logic: "Bảo toàn đủ 2 câu cảm thán: tiền đội địch đã tiến vào vùng nhận dạng phòng không -> chúng đang nhanh chóng áp sát thành phố."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000468
    terms:
      - "người lính"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Vianto nhất quán bằng đại từ `anh`."
    pov_and_voice: "Giọng trần thuật rắn rỏi, thể hiện bản lĩnh chiến trường của một sĩ quan dày dạn kinh nghiệm."
    modality_and_logic: "Bảo toàn đủ 3 câu: nhưng dù sao anh cũng là một người lính -> anh hiểu việc suy ngẫm có thể có ý nghĩa nhưng phải đúng lúc, đúng chỗ -> câu điều kiện trái thực tế trong quá khứ: nếu không hiểu điều đó thì hẳn anh đã bỏ mạng từ lâu rồi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000469
    terms:
      - "chỉ huy"
    pronouns_and_address: "Sĩ quan cấp dưới gọi Vianto là `Thưa chỉ huy` và dùng đại từ gộp `chúng ta`."
    pov_and_voice: "Giọng xin chỉ thị gấp gáp của cấp dưới khi địch đã áp sát, bị ngắt ngang bằng dấu gạch ngang dài (`—`)."
    modality_and_logic: "Bảo toàn câu hỏi xin lệnh bỏ lửng đúng cấu trúc dấu câu nguyên bản (`“Thưa chỉ huy, vậy chúng ta nên—”`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000470
    terms:
      - "phục kích"
    pronouns_and_address: "Vianto tự xưng `Tôi` và gọi quân Đế quốc đang tới là `Chúng`."
    pov_and_voice: "Giọng hạ lệnh dứt khoát, ngắn gọn của người chỉ huy tại trận."
    modality_and_logic: "Bảo toàn đủ 3 câu ngắn dồn dập: xác nhận đã nắm tình hình (`Tôi biết.`) -> báo địch đã tới (`Chúng đến rồi.`) -> phát lệnh tác chiến (`Chuẩn bị phục kích!`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000471
    terms:
      - "kẻ địch"
      - "nhiệm vụ"
    pronouns_and_address: "Trần thuật khép lại phân cảnh của Vianto (ngay trước ngắt cảnh `space-break1` ở `p000472`) bằng đại từ `anh`."
    pov_and_voice: "Giọng trần thuật trầm tĩnh, khép lại nỗi giằng xé nội tâm để bước vào trận đánh sinh tử."
    modality_and_logic: "Bảo toàn đủ 2 câu: khi kẻ địch đã áp sát, anh buộc phải gác những suy nghĩ giằng xé về nhiệm vụ sang một bên -> anh sẽ làm mọi điều trong khả năng để sống sót—bởi sự hối tiếc là đặc quyền chỉ người còn sống mới có."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000472
    terms:
      - "kẻ địch"
      - "khu vực hậu phương"
    pronouns_and_address: "Sau ngắt cảnh `space-break1`, chuyển điểm nhìn về Tanya theo đúng `DEC-P01-001`: dùng đại từ ngôi thứ hai phiếm chỉ `bạn` cho câu hỏi tu từ mở đầu và tự xưng `mình` xuyên suốt các câu độc thoại nội tâm tiếp theo."
    pov_and_voice: "Giọng độc thoại nội tâm kiểu nhân viên văn phòng thực dụng, hay than vãn của Tanya khi dẫn đơn vị bay vào vùng chiến sự."
    modality_and_logic: "Bảo toàn đủ 3 câu: câu hỏi tu từ mở đầu về việc có bao giờ được lệnh đi tiêu diệt một kẻ địch không hề nao núng đang tấn công khu vực hậu phương chưa -> khẳng định trước giờ mình cũng chưa từng -> vì thế dù vui vì trước đây đã may mắn đến vậy, mình vẫn muốn than thở về tình cảnh hiện tại."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ đoạn tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000473
    terms:
      - "lẽ thường"
    pronouns_and_address: "Độc thoại nội tâm của Tanya tự xưng `mình` nhất quán theo `DEC-P01-001`."
    pov_and_voice: "Giọng tự nhận thức đầy mỉa mai của Tanya khi tự coi mình là mẫu người chăm chỉ làm việc, điềm tĩnh và biết suy nghĩ theo lẽ thường."
    modality_and_logic: "Bảo toàn đủ 3 câu: khẳng định muốn làm cho ra trò mà không để bất cứ điều gì cản đường -> nhận xét gần đây nhận ra mình là kiểu người sống để làm việc -> mong muốn có thể tự hào rằng mình là người điềm tĩnh, biết suy nghĩ theo lẽ thường."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh theo `DEC-P01-002`: bọc dấu `*...*` quanh toàn bộ đoạn tương ứng thẻ `<html:em>`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000474
    terms:
      - "Tanya"
      - "hỏa lực tầm xa được kiểm soát chặt chẽ"
      - "Lục quân Cộng hòa"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` theo đúng `DEC-P01-001`."
    pov_and_voice: "Giọng trần thuật châm biếm nhẹ, nối trực tiếp vào mạch độc thoại nội tâm vừa kết thúc ở `p000473` bằng dấu ba chấm mở đầu (`…`)."
    modality_and_logic: "Bảo toàn dấu ba chấm mở đầu và xử lý chuẩn xác theo `B15-F07`: tổng kết đó là kiểu suy nghĩ của Tanya khi nó giả vờ bất bình trước thời đại đáng buồn đến mức chỉ bay trên trời thôi cũng bị chặn đánh, đồng thời khéo léo cơ động né tránh làn hỏa lực tầm xa được kiểm soát chặt chẽ mà Lục quân Cộng hòa rất tự hào."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000475
    terms:
      - "tia laser"
      - "đơn vị thu hồi tài nguyên hữu cơ thù địch với loài người"
      - "việc quan sát xác định mục tiêu"
    pronouns_and_address: "Câu trần thuật khách quan pha lăng kính liên tưởng của Tanya, không xuất hiện đại từ nhân xưng trực tiếp."
    pov_and_voice: "Giọng phân tích kỹ thuật pha chút liên tưởng khoa học viễn tưởng đặc trưng của Tanya khi đánh giá đòn bắn quang học/ma đạo của địch."
    modality_and_logic: "Bảo toàn quan hệ nhượng bộ – nguyên nhân: dù những luồng sáng ấy chẳng mạnh hơn tia laser do một đơn vị thu hồi tài nguyên hữu cơ thù địch với loài người bắn ra, tỷ lệ trúng đích vẫn thấp hơn nhiều chỉ đơn giản vì khâu quan sát xác định mục tiêu do con người đảm nhiệm."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000476
    terms:
      - "màn bảo hộ"
      - "lớp vỏ ngoài"
      - "mana"
      - "Type 95"
      - "tự sát về tinh thần"
    pronouns_and_address: "Đoạn văn phản ánh trực tiếp tính toán nội tâm của Tanya trên không trung, tự xưng `mình` nhất quán theo `DEC-P01-001`."
    pov_and_voice: "Giọng tính toán rủi ro thực dụng của Tanya giữa việc né đạn và cái giá phải trả nếu kích hoạt tối đa `Type 95`."
    modality_and_logic: "Bảo toàn đủ 3 câu và xử lý chuẩn xác theo `B15-F08`: dù tỷ lệ trúng thấp nhưng mình vẫn khá nghiêm túc trong việc né tránh chúng vì nếu trúng đòn thì có thể xuyên thủng cả màn bảo hộ lẫn lớp vỏ ngoài khiến mình rơi xuống -> có lẽ nếu dốc toàn lực truyền mana vào Type 95 thì có thể chống đỡ được, nhưng làm thế chẳng khác nào tự sát về tinh thần nên mình ngần ngại -> kết luận tốt nhất vẫn là né tránh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000477
    terms: []
    pronouns_and_address: "Tiếng hô báo động/giao chiến của pháp sư đối phương dùng đại từ `Chúng` để chỉ đơn vị của Tanya."
    pov_and_voice: "Giọng hô hoán khẩn trương của quân Cộng hòa khi thấy tốc độ lao vào và kỹ năng cơ động điêu luyện của đối phương."
    modality_and_logic: "Bảo toàn đủ 3 câu cảm thán ngắn: hô tấn công (`Tấn công!`) -> kinh ngạc trước tốc độ (`Chúng nhanh quá!`) -> thừa nhận sự lão luyện của địch (`Rành việc thật!`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000478
    terms:
      - "pháo kích"
      - "Tanya"
      - "những lực lượng hạng hai"
      - "Dacia"
      - "Norden"
    pronouns_and_address: "Trần thuật ngôi thứ ba quy chiếu Tiểu đoàn 203 của Tanya bằng đại từ `họ` và gọi đích danh `Tanya`."
    pov_and_voice: "Giọng trần thuật tổng kết cục diện tiếp cận chiến trường, đối chiếu kinh nghiệm chiến đấu trước đây của Tiểu đoàn 203 với hỏa lực thực chiến của Cộng hòa."
    modality_and_logic: "Bảo toàn đủ 2 câu và xử lý chuẩn xác câu tục ngữ mở đầu theo `B15-F09`: dẫu vậy, cũng như khó lòng trăm trận trăm thắng, xem ra họ khó lòng đột phá mà không bị tổn hại -> mật độ pháo kích dày đặc đến mức ngay cả Tanya cũng phải kinh ngạc; việc trước đây họ chỉ đánh bại những lực lượng hạng hai ở Dacia và Norden giờ đã khiến họ phải trả giá."
    emphasis: "none"
