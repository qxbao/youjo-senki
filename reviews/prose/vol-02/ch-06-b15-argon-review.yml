    pov_and_voice: "Giọng biện giải pha chút bất lực của sĩ quan phụ tá khi nói về lực lượng hiện có."
    modality_and_logic: "Bảo toàn đủ 2 câu: nêu thực tế đã tung hai đại đội để kìm chân Ác quỷ sông Rhine -> câu hỏi tu từ còn biết làm gì hơn nữa."
