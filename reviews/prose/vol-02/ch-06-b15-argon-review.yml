findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000460
    category: lexical_scope_nuance
    issue: >-
      Tại câu thứ ba của `p000460`, mệnh đề tổng quát chỉ toàn bộ lượng đạn dược/vật tư hỏa lực mà quân Cộng hòa hiện có được diễn đạt lặp danh từ `số đạn` (`toàn bộ số đạn mà quân Cộng hòa có chỉ gồm kho dự trữ tại địa phương và số đạn mỗi pháp sư mang theo`), làm hẹp nhẹ sắc thái danh từ không đếm được ở đầu câu trước khi liệt kê hai nguồn cụ thể.
    basis: >-
      Toàn bộ 3 câu của `p000460` đã xử lý triệt để điểm nhắc ở `B15-F05` (tách rõ quy chiếu `Quân mặt đất ấy sẽ có pháp sư yểm trợ`), giữ đúng câu mở đầu in nghiêng `*...*` theo `<html:em>`, và truyền tải đầy đủ thế bất lợi về hỏa lực lẫn nguồn tiếp tế đạn dược của lực lượng Cộng hòa tại Arene.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc chỉnh nhẹ vế đầu thành `tất cả những gì quân Cộng hòa có chỉ là kho dự trữ tại địa phương và cơ số đạn mỗi pháp sư mang theo`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000478
    category: idiom_nuance
    issue: >-
      Tại câu thứ hai của `p000478`, cụm trạng ngữ biểu thị phản ứng kinh ngạc bất giác/ngoài ý muốn của nhân vật được dịch thành `ngay cả Tanya cũng phải kinh ngạc`, nghiêng nhẹ sang sắc thái nhấn mạnh mức độ (`ngay cả... cũng`) thay vì phản ứng bất giác không kìm được.
    basis: >-
      Ý nghĩa cốt lõi về mật độ lưới lửa phòng không dày đặc của Lục quân Cộng hòa, câu tục ngữ mở đầu đã được hiệu đính chuẩn xác theo `B15-F09` (`cũng như khó lòng trăm trận trăm thắng, xem ra họ khó lòng đột phá mà không bị tổn hại`) và nhận định về hệ lụy từ việc trước đó chỉ chạm trán các lực lượng hạng hai ở `Dacia` và `Norden` đều được bảo toàn trọn vẹn.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc chỉnh nhẹ thành `Mật độ pháo kích dày đặc đến mức Tanya cũng phải bất giác kinh ngạc`.
    resolution: optional_polish

