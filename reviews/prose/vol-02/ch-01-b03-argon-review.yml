  locks:
  - "Giữ ẩn dụ `Kinh nghiệm là người thầy vĩ đại` và cụm `đám ngốc lạc hậu này sắp được học xem nền văn minh hiện đại tạo ra khác biệt lớn đến mức nào`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000031
  locks:
  - "Giữ cách xưng hô `ngài` – `chúng ta` – `Tôi` và hình ảnh `giáng chiếc búa sắt của văn minh xuống đầu bọn man rợ này`."
