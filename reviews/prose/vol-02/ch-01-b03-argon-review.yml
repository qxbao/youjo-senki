  locks:
  - "Giữ các thuật ngữ `Chiến tranh hiện đại`, `sức mạnh quốc gia`, `Giáo dục, huấn luyện, hậu cần`, `cường quốc`, đại từ nội tâm `Mình` và cụm `theo kiểu các conquistador` theo m4."
