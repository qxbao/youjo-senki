  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng cách lặp lại tên riêng `Tanya` hoặc lược chủ ngữ khi không mơ hồ (part0010/p000054, p000056, p000059), dùng đại từ phản thân `mình` ở các cụm sở hữu/nhận thức nội tâm trong câu trần thuật (part0010/p000054, p000059), và quy chiếu Đại tá von Lergen bằng danh xưng `Đại tá von Lergen` / `Đại tá` / `vị đại tá` / `ông` (part0010/p000056); độc thoại nội tâm và lời kể gián tiếp tự do bám sát điểm nhìn của Tanya dùng `mình` cho ngôi thứ nhất số ít (part0010/p000026, p000029, p000035, p000038, p000039, p000048, p000049, p000055) và dùng `ta` / `chúng ta` cho ngôi thứ nhất số nhiều chỉ phía đơn vị/quân Đế quốc (part0010/p000029, p000032, p000041, p000048, p000056); trong đối thoại giữa Tanya và Đại tá von Lergen: Tanya gọi `Đại tá` / `Thưa ngài` / `ngài`, tự xưng `Tôi` / `tôi` kèm tiểu từ lễ phép `ạ` ở câu hỏi đầu và dùng `chúng ta` / `ta` / `Chúng tôi` theo ngữ cảnh (part0010/p000027, p000031, p000034, p000040, p000042, p000044, p000046, p000056), còn Lergen gọi Tanya là `Thiếu tá` / `Cô` (part0010/p000036, p000045); trong đối thoại giữa Tanya và Thiếu úy Serebryakov: Serebryakov tự xưng cấp bậc + tên `Thiếu úy Serebryakov`, thưa `thưa thiếu tá`, xưng `tôi` – `Cô` kèm tiểu từ `ạ` (part0010/p000051), còn Tanya gọi cấp bậc `Thiếu úy` và đáp gọn `Ừ` (part0010/p000052)"
  alternatives_vi:
  - nó cho Tanya và ông ta cho Lergen trong trần thuật (thay cho việc lặp tên riêng `Tanya` / lược chủ ngữ và dùng `Đại tá` / `vị đại tá` / `ông` tại part0010/p000054, p000056, p000059 — ưu tiên giữ `Tanya` / lược chủ ngữ và `Đại tá` / `vị đại tá` / `ông` theo đúng quyết định sửa `M3`, `m3` và lựa chọn tạm `vol02-ch01-b03-tanya-narration` đã signoff trong handoff `handoffs/vol-02/ch-01-b03.yml`, đồng bộ với B01–B02) / lặp cấp bậc Thiếu tá thay cho đại từ Cô trong lời thoại của Lergen và Serebryakov (tại part0010/p000036, p000045, p000051 — ưu tiên giữ nguyên `Cô` làm phương án tạm đã được signoff xác nhận không chặn trong lô này)
