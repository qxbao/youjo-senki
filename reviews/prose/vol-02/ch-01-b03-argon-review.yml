  volume: vol-02
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` cho độc thoại nội tâm của Tanya (`mình`), đồng thời giữ đúng các quyết định đã sửa và signoff trong handoff `handoffs/vol-02/ch-01-b03.yml` (`M1`, `M2`, `M3`, `m3`: lặp tên `Tanya` hoặc lược chủ ngữ trong trần thuật thay cho `nó`; gọi `Đại tá` / `vị đại tá` / `ông` thay cho `ông ta`; Tanya gọi Serebryakov là `Thiếu úy` khớp tự xưng ở p000051; giữ `Trung úy Weiss` nhất quán ở p000053, p000058)."
