  proposed_vi: "quyền tự quyết (part0010/p000026) / Đại tá, quân Dacia, pháo kích, quyền kiểm soát không phận (part0010/p000027, p000037, p000056) / sáu trăm nghìn quân Liên bang hoặc quân Cộng hòa, yểm trợ đường không, quân tiếp viện, pháo kích chuẩn bị, ưu thế trên không (part0010/p000029) / nền văn minh hiện đại (part0010/p000030) / chiếc búa sắt của văn minh, bọn man rợ (part0010/p000031) / pháp sư (part0010/p000032) / Tiểu đoàn, tiểu đoàn (part0010/p000034, p000052, p000058, p000059) / Chiến tranh hiện đại, sức mạnh quốc gia, hậu cần, cường quốc, các conquistador (part0010/p000035, p000041, p000044) / đội tiên phong, ba sư đoàn, lãnh thổ Đế quốc, lực lượng tinh nhuệ nòng cốt, quân đội thường trực (part0010/p000036, p000037, p000038, p000041) / sư đoàn thiết giáp, bộ binh cơ giới (part0010/p000038) / nguyên tắc cạnh tranh (part0010/p000039) / chiều không gian thứ ba, diễn tập bắn đạn thật (part0010/p000041) / Thiếu tá, thiếu tá (part0010/p000045, p000051) / Dacia, vùng Rhine, Norden (part0010/p000046, p000048) / sĩ quan phụ tá (part0010/p000049, p000056) / Thiếu úy Serebryakov, Thiếu úy (part0010/p000051, p000052) / Trung úy Weiss (part0010/p000053, p000058) / bộ chỉ huy (part0010/p000055) / Đại tá von Lergen, Bộ Tổng tham mưu, sáu trăm nghìn quân Dacia (part0010/p000056) / quân trang huấn luyện, đạn thật, xuất kích (part0010/p000057)"
  alternatives_vi:
  - lực lượng Liên bang hoặc lực lượng Cộng hòa (thay cho `quân Liên bang hoặc quân Cộng hòa` tại part0010/p000029 — ưu tiên `quân Liên bang hoặc quân Cộng hòa` theo lựa chọn tạm `vol02-ch01-b03-federal-republican-forces` đã signoff trong handoff, ghi nhận độ bất định về việc tính từ thứ hai chỉ chính thể Cộng hòa hay mang nghĩa mô tả chung) / những kẻ chinh phục (thay cho `các conquistador` tại part0010/p000035, p000041 — ưu tiên giữ mượn từ `các conquistador` theo lựa chọn tạm `vol02-ch01-b03-conquistador` để bảo toàn điển cố lịch sử gắn với ngựa và súng mà không tự thêm quốc tịch hay trùng lặp từ vựng với động từ `chinh phục` ở p000032) / trợ tá hoặc sĩ quan tùy tùng (thay cho `sĩ quan phụ tá` tại part0010/p000049, p000056 — ưu tiên `sĩ quan phụ tá` theo lựa chọn tạm `vol02-ch01-b03-adjutant` và đồng bộ với các tập sau) / Trung úy cho cả Serebryakov và Weiss (thay cho cặp phân biệt `Thiếu úy Serebryakov` / `Thiếu úy` và `Trung úy Weiss` tại part0010/p000051, p000052, p000053, p000058 — ưu tiên phân biệt `Serebryakov: Thiếu úy; Weiss: Trung úy` theo đúng cấp bậc tường minh trong văn bản nguồn của lô này và mục `M1`, `M2`, `vol02-ch01-b03-lieutenant` trong handoff)
