  locks:
  - "Giữ cấu trúc giả định phản thực `Nếu đó là sáu trăm nghìn quân Liên bang hoặc quân Cộng hòa có yểm trợ đường không, thì gọi quân tiếp viện chẳng có gì đáng xấu hổ, và có lẽ mình cũng sẽ làm vậy`, các thuật ngữ `pháo kích chuẩn bị`, `ưu thế trên không`, và đại từ `mình` / `ta`."
