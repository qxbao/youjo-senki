- segment_id: YS-LN02/Text/part0010.xhtml/p000027
  locks:
  - "Giữ danh xưng `Đại tá`, `quân Dacia`, tiểu từ lễ phép `ạ` và câu hỏi về `pháo kích hay tranh giành quyền kiểm soát không phận`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000028
  locks:
