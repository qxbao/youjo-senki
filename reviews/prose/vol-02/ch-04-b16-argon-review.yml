  - id: vol02-ch04-b16-pronouns-pov-disambiguation-and-emphasis
    source_term: Tanya first-person narration/monologue pronouns (p000142–p000151, p000156), Syrtis captain third-person pronouns (p000158, p000159, p000164, p000171), Empire vs Commonwealth party disambiguation in p000162, submarine crew dialogue pronouns (p000165, p000169), footnote marker 16 (p000158), and emphasis spans (p000157, p000158, p000165)
    proposed_vi: >-
      xác nhận toàn bộ các bản sửa V1 (gồm cả bản sửa bổ sung V1-residual), V2,
      V3 và V4 theo `handoffs/vol-02/ch-04-b16.yml` đã được áp dụng đầy đủ và
      nghiệm thu: ở nửa đầu lô theo điểm nhìn ngôi thứ nhất của Tanya (p000142–p000151,
      p000156), giữ lựa chọn tạm dùng “tôi” / “Tôi” cho cá nhân chỉ huy và
      “chúng ta” cho tập thể đơn vị (p000144, p000150, p000156), quy chiếu các
      thuộc cấp bằng “họ” (p000147) và quy chiếu các thuật thức nổ mạnh / chiếc
      tàu ngầm bằng “chúng” / “nó” (p000141, p000143, p000151, p000154); ở nửa
      sau lô khi chuyển điểm nhìn sang tàu ngầm *Syrtis* của Khối Thịnh vượng
      chung (p000157–p000172), quy chiếu vị thuyền trưởng nhất quán bằng chức
      danh “thuyền trưởng” / “Thuyền trưởng” và đại từ ngôi thứ ba trang trọng
      “Ông” / “ông” (p000158, p000159, p000164 — xác nhận bản sửa V2 loại bỏ hoàn
      toàn từ “hắn”), quy chiếu tập thể thủy thủ đoàn và phía tàu ngầm bằng “Họ”
      / “họ” kèm đại từ phản thân “mình” (p000158–p000160, p000163); tại p000162,
      xác nhận bản sửa V1 và V1-residual đã tách minh bạch chủ thể “Phía Đế quốc”
      (đã có mặt tại điểm hẹn vốn chỉ một số ít người biết đến) khỏi “Phía Khối
      Thịnh vượng chung” (vừa kịp chuyển giao hàng) và thay cụm “đáng lẽ phải
      biết” bằng “vốn chỉ một số ít người biết đến” đúng theo yêu cầu của
      coordinator; tại p000166, p000168, p000172, quy chiếu phía Đế quốc bằng
      “Kẻ địch” / “chúng” / “họ”, và tại p000171 dùng “chúng” quy chiếu danh từ
      số nhiều “Tàu ngầm lớp S”; trong lời báo cáo trực tiếp trên tàu ngầm
      *Syrtis* (p000165, p000169), thủy thủ dùng “Họ” cho các pháp sư Lục quân Đế
      quốc và “chúng ta” cho phía tàu ngầm; xác nhận bản sửa V4 bảo toàn chính
      xác 3 phạm vi nhấn mạnh Markdown `*...*` tại p000157 (`*Syrtis*`), p000158
      (`*Có một gián điệp cài trong cơ quan tình báo.*`) và p000165 (`*Lytol*`)
      theo đúng DEC-P01-002 (ghi nhận dấu chú thích 16 tại p000158 thuộc nhóm N8
      đã được phép lưu hồ sơ mà không chặn signoff)
    alternatives_vi:
      - mình (thay cho “tôi” trong các câu suy nghĩ ngôi thứ nhất của Tanya ở p000142–p000150 theo DEC-P01-001; giữ “tôi” theo lựa chọn tạm đã được signoff trong handoff b16)
