    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000082
    terms:
      - "hỏa lực chế áp yểm trợ (supporting suppressive fire)"
    pronouns_and_address:
      - "Trong thoại vô tuyến, Tanya tự xưng `Tôi` khi nêu yêu cầu và dùng `chúng tôi` cho đơn vị mình, `chúng` cho vị trí pháo địch."
    pov_and_voice: "Lời thoại vô tuyến tác chiến của Tanya."
    modality_and_logic: "Khóa thuật ngữ `hỏa lực chế áp yểm trợ` theo `vol02-ch05-b04-artillery-emplacement-suppressive-fire`, thời lượng `năm phút`, mốc thời gian `bắt đầu ngay bây giờ`, và cam kết xử lý mục tiêu trong khoảng thời gian đó."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000083
    terms:
      - "Huy hiệu Tấn công Cánh bạc (Silver Wings Assault Badge)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình` ở cả câu 1 và câu 2 (B04-F02), đồng thời giữ nguyên cách tự nhắc tên `Tanya` ở ngôi thứ ba trong mệnh đề phụ đúng như cấu trúc tự tách mình của nguyên tác."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa tên phần thưởng `Huy hiệu Tấn công Cánh bạc` theo `vol02-ch05-b04-silver-wings-assault-badge` và quyền tự chủ tự do chọn mục tiêu."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000084
    terms:
      - "Căn cứ hậu phương (the rear base)"
      - "trận pháo kích (a barrage)"
    pronouns_and_address: []
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ phép so sánh hơn kém giữa điều kiện ở căn cứ hậu phương với cảnh lấm lem bùn đất, bị lệnh giữ chốt rồi hứng pháo kích giữa lúc hỗn loạn."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000085
    terms:
      - "căn cứ hậu phương (rear base)"
      - "khẩu phần chiến hào đóng gói tiêu chuẩn (standard portable trench rations)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình` cho ngôi thứ nhất số ít (B04-F02), `chúng tôi` cho ngôi thứ nhất số nhiều, và `họ` cho quân lính dưới mặt đất."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa câu `Đây mới là mùa xuân đầu tiên của chúng tôi` theo B04-F08 (chỉ số thứ tự mùa xuân chứ không thêm ý đầu mùa) và suy luận nhân quả từ mùi hôi nồng nặc khi bay thấp đến tình trạng làm trái ngược hẳn nguyên tắc vệ sinh."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000086
    terms:
      - "chiến hào (trenches)"
      - "tàu ngầm (submarine)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình` (B04-F02); `Nó` ở đầu câu 2 quy chiếu môi trường chiến trường."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất hồi chiếu tiền kiếp của Tanya."
    modality_and_logic: "Khóa hình ảnh so sánh sát nguyên văn `ở trên một chiếc tàu ngầm đang chìm xuống một nhà vệ sinh hỏng bét` theo B04-F03 (giữ đúng quan hệ không gian tàu ngầm chìm vào nhà vệ sinh hỏng, không tự sửa thành nhà vệ sinh trên tàu ngầm)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000087
    terms:
      - "các khẩu pháo dã chiến (field guns)"
      - "hỏa lực phòng không (anti–air fire)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `mình` (B04-F02)."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất thực dụng của Tanya."
    modality_and_logic: "Giữ sự hài lòng về công việc tương xứng với đồng lương khi đánh phá các khẩu pháo dã chiến chỉ có hỏa lực phòng không yếu ớt."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000088
    terms:
      - "pháp sư đánh chặn (intercepting mages)"
      - "nghỉ phép (leave)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `Mình` / `mình` cho cá nhân (B04-F02), `chúng tôi` cho đơn vị và `Chúng` cho mục tiêu."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ điều kiện miễn trừ (`miễn là không có pháp sư nào đánh chặn`), ẩn dụ `đi săn vịt`, và lập luận pháp lý hình thức của Tanya (`nếu chẳng có gì ghi trên giấy tờ thì mình phải được phép thực hiện quyền lợi của mình chứ`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000089
    terms:
      - "hậu phương (the rear)"
      - "vị trí an toàn (a safe post)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng `Mình` (B04-F02)."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Giữ nguyên mong muốn xuyên suốt của Tanya là sớm được điều về hậu phương nhận một vị trí an toàn."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000090
    terms:
      - "hỏa lực phòng không (anti–air fire)"
      - "pháo binh (artillery)"
    pronouns_and_address: []
    pov_and_voice: "Lời thoại vô tuyến phản đối vì lo ngại từ phía đơn vị dưới mặt đất."
    modality_and_logic: "Giữ cấu trúc tăng tiến phủ định (`Chừng ấy còn chẳng đủ chế áp hỏa lực phòng không, nói gì đến pháo binh.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000091
    terms:
      - "nhiệm vụ không kích (strike mission)"
      - "tiền tuyến (the front line)"
    pronouns_and_address:
      - "Dùng đại từ phiếm chỉ `người ta` cho chủ ngữ khái quát."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa mệnh đề quan hệ `vốn tương đối an toàn ở tiền tuyến` theo B04-F07 (làm rõ tính tương đối an toàn của loại nhiệm vụ này trong bối cảnh tiền tuyến, không gây hiểu nhầm rằng nhiệm vụ làm cho tiền tuyến an toàn)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000092
    terms:
      - "tiểu đội quan sát (observation squad)"
      - "các quan sát viên tiền tuyến (frontline observers)"
      - "quan sát điểm đạn rơi (spotting impacts)"
      - "pháo binh (artillery)"
    pronouns_and_address:
      - "Dùng `chúng tôi` và `phe ta`; quy chiếu các quan sát viên bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm phân tích tình hình chiến trường của Tanya."
    modality_and_logic: "Khóa thuật ngữ `tiểu đội quan sát` theo `vol02-ch05-b04-observation-squad` (B04-F06, không tự thêm chức năng `trinh sát`) và chuỗi suy luận: quan sát viên tiền tuyến vốn phải quan sát điểm đạn rơi, nay lại rảnh để làm hoa tiêu chứng tỏ phe ta thiếu pháo binh."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000093
    terms:
      - "lớp vỏ ngoài của pháp sư (mage’s outer shells)"
      - "đội hình xung kích chống mục tiêu mặt đất (anti-surface assault formation)"
    pronouns_and_address:
      - "Dùng `quân ta` cho phe mình."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa hai thuật ngữ `lớp vỏ ngoài của pháp sư` (`vol02-ch05-b04-mage-outer-shells`) và `đội hình xung kích chống mục tiêu mặt đất` (`vol02-ch05-b04-anti-surface-assault-formation`), cùng kết luận loại trừ khả năng bị quân ta bắn nhầm."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000094
    terms:
      - "mẫu quả cầu mới (the new orb model)"
      - "pháo kích (artillery)"
      - "khóa huấn luyện tân binh (boot camp)"
    pronouns_and_address:
      - "Dùng `chúng tôi` cho đơn vị."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa mức độ dự đoán có điều kiện `mẫu quả cầu mới có lẽ sẽ giúp chúng tôi tránh bị thương chí mạng` theo B04-F04 và `vol02-ch05-b04-orb` (không biến khả năng sống sót thành sự bảo đảm tuyệt đối)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000095
    pronouns_and_address:
      - "Trong thoại vô tuyến, Tanya dùng `chúng tôi` khi nói với đơn vị bạn."
    pov_and_voice: "Lời thoại vô tuyến trấn an và ra chỉ thị phối hợp hỏa lực của Tanya."
    modality_and_logic: "Giữ nguyên chỉ thị tác chiến táo bạo: đừng lo cho đơn vị của Tanya mà cứ tiếp tục bắn pháo ngay cả sau khi họ đã xông vào."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000096
    terms:
      - "đợt xung kích chống mục tiêu mặt đất (an anti-surface assault)"
      - "chỉ huy (the commander)"
      - "yểm trợ trên không (air cover)"
      - "không chiến (air battle)"
    pronouns_and_address: []
    pov_and_voice: "Độc thoại nội tâm nêu nguyên tắc chiến thuật của Tanya."
    modality_and_logic: "Khóa dạng ngữ cảnh `đợt xung kích chống mục tiêu mặt đất` theo `vol02-ch05-b04-anti-surface-assault-formation` và sự phân công một đơn vị tấn công – một đơn vị yểm trợ trên không."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000097
    terms:
      - "lực lượng yểm trợ trực tiếp (direct support)"
      - "trận pháo kích (a barrage)"
    pronouns_and_address:
      - "Độc thoại nội tâm dùng nhất quán `mình` ở cả ba câu theo DEC-P01-001 và B04-F02."
    pov_and_voice: "Độc thoại nội tâm ngôi thứ nhất của Tanya."
    modality_and_logic: "Khóa thuật ngữ `lực lượng yểm trợ trực tiếp` theo `vol02-ch05-b04-direct-support` và hai lợi ích kèm theo: giảm mạnh nguy cơ lọt vào lưới pháo kích và được nâng độ cao thoát khỏi lớp không khí hôi hám."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000098
    terms:
      - "vùng nguy hiểm (the danger zone)"
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
    pronouns_and_address:
      - "Trần thuật/tự thuật khách quan hóa dùng danh xưng `Thiếu tá von Degurechaff`."
    pov_and_voice: "Câu trần thuật pha giọng tự trào nối giữa nội tâm và lời thoại chỉ huy."
    modality_and_logic: "Giữ nguyên nhân kép làm tâm trạng của Thiếu tá von Degurechaff khá lên: rời khỏi mùi hôi và rời khỏi vùng nguy hiểm."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000099
    terms:
      - "Úy Serebryakov (Lieutenant Serebryakov)"
      - "các buổi diễn tập ứng phó pháo kích (artillery shelling drills)"
      - "tiểu đoàn (battalion)"
    pronouns_and_address:
      - "Trong lời thoại chỉ huy trực tiếp, Tanya gọi thuộc cấp là `Úy Serebryakov`, dùng `chúng ta`, tự xưng `tôi`, dùng `tiểu đoàn mình` và `quân ta`."
    pov_and_voice: "Lời thoại chỉ huy pha nét mỉa mai tự tin của Tanya nói với Serebryakov."
    modality_and_logic: "Khóa hai lựa chọn đã nghiệm thu: (1) danh xưng quân hàm trung tính không tự gán bậc `Úy Serebryakov` theo `vol02-ch05-b04-lieutenant-serebryakov` (B04-F05); (2) cụm `các buổi diễn tập ứng phó pháo kích` theo B04-F09 (làm rõ đây là diễn tập phòng tránh đạn pháo chứ không phải tập bắn pháo)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000100
    pronouns_and_address: []
    pov_and_voice: "Lời đáp nhận lệnh ngắn gọn của Serebryakov."
    modality_and_logic: "Giữ nguyên lời đáp công vụ `“Đã rõ.”` đồng bộ với p000082."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000101
    pronouns_and_address:
      - "Phân tách chính xác ba lớp quy chiếu theo DEC-P01-001 và B04-F02: câu 1 dùng `mình` cho chủ thể tự nhận thức, `“cô ấy”` cho đại từ ngôi thứ ba giống cái được đem ra bàn luận, và `cô bé này` cho hình thể hiện tại; câu 2 chuyển sang trần thuật ngôi thứ ba dùng `Nó`; câu 3 trở lại suy nghĩ tập thể của đơn vị dùng `chúng tôi`."
    pov_and_voice: "Độc thoại nội tâm tự quan sát kết hợp trần thuật ngôi thứ ba của Tanya."
    modality_and_logic: "Giữ cảm giác kỳ cục khi gọi bản thân là `“cô ấy”`, chi tiết Serebryakov đáp lời hơi gượng gạo mà Tanya chẳng bận tâm, và điểm cộng khi tấn công mặt đất là không phải leo lên độ cao lạnh cóng."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000102
    terms:
      - "Thiếu tá Tanya von Degurechaff (Major Tanya von Degurechaff)"
    pronouns_and_address:
      - "Trần thuật ngôi thứ ba dùng danh xưng đầy đủ `Thiếu tá Tanya von Degurechaff` ở câu 1 và đại từ `nó` ở câu 2 theo đúng DEC-P01-001."
    pov_and_voice: "Trần thuật ngôi thứ ba khép lại batch."
    modality_and_logic: "Giữ quan hệ hệ quả `Vì thế` và mức độ biểu cảm tăng tiến từ `phấn chấn hẳn lên` đến `giãn ra thành một nụ cười toe toét`."
    emphasis: "Không dùng `*...*`."
