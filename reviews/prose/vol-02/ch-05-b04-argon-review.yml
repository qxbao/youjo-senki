findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000085
    issue: "Tại câu 2 của p000085, tính từ chỉ đặc tính cơ động/mang theo bên người của khẩu phần ăn dưới hào (`portable trench rations`) được dịch thành `khẩu phần chiến hào đóng gói tiêu chuẩn`, hơi dịch chuyển nét nghĩa từ tiện mang theo sang quy cách đóng gói."
    basis: "Trong ngữ cảnh đối lập trực tiếp với `thức ăn nóng tử tế` tại căn cứ hậu phương, `khẩu phần chiến hào đóng gói tiêu chuẩn` vẫn diễn đạt tự nhiên và giữ nguyên sự tương phản về chất lượng bữa ăn."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `khẩu phần chiến hào mang theo tiêu chuẩn` / `khẩu phần dã chiến mang theo tiêu chuẩn`."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000092
    issue: "Tại câu 1 của p000092, thành phần chêm giải thích nằm giữa cặp dấu gạch ngang (`going out of their way—volunteering—to support us`) được gộp phẳng thành `đang chủ động tình nguyện hỗ trợ chúng tôi`, làm nhẹ đi nhịp nhấn mạnh bổ sung của nguyên tác."
    basis: "Cụm `chủ động tình nguyện hỗ trợ chúng tôi` vẫn bảo toàn đầy đủ cả ý vượt ngoài phận sự thường lệ lẫn hành động tình nguyện làm hoa tiêu của tiểu đội quan sát."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc tách nhịp bằng dấu gạch ngang như `đang cất công—thậm chí tình nguyện—hỗ trợ chúng tôi`."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000094
    issue: "Tại đầu câu 1 của p000094, cụm giới từ chỉ xác suất trùng hợp hi hữu theo lối nói mỉa mai (`by some miraculous chance`) khi đi với giả định bất lợi là trúng đạn pháo trực tiếp lại được dịch là `nhờ phép màu nào đó`, dễ gợi sắc thái may mắn tích cực trong tiếng Việt."
    basis: "Đặt trong mạch câu điều kiện giả định có chứa `mẫu quả cầu mới có lẽ sẽ giúp chúng tôi tránh bị thương chí mạng` (đã sửa đúng theo B04-F04), người đọc vẫn hiểu đây là cách nói ngược chỉ một xác suất cực thấp."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `Nếu do một sự trùng hợp thần kỳ nào đó mà chúng tôi trúng đạn trực tiếp` / `Nếu chẳng may có phép màu ngược đời nào khiến chúng tôi trúng đạn trực tiếp`."
    resolution: optional_polish

