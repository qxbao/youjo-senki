  - id: vol02-ch05-b04-tanya-pov-pronouns-and-emphasis
    source_term: "Tanya first-person interior monologue pronouns (`mình` / `chúng tôi`), third-person narration and self-detachment references (`Tanya`, `Thiếu tá von Degurechaff`, `Thiếu tá Tanya von Degurechaff`, `cô bé này`, `Nó` / `nó`, metalinguistic quote `“cô ấy”`), radio and command dialogue pronouns (`Tôi`, `chúng tôi`, `chúng ta`, `tiểu đoàn mình`), generic subject (`người ta`) in p000091, and single italicized interjection (`*ối*`) in p000076"
    proposed_vi: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và toàn bộ sửa chữa B04-F01 → B04-F09 đã nghiệm thu: (1) trong độc thoại nội tâm ngôi thứ nhất số ít của Tanya (p000076, p000079, p000083, p000085, p000086, p000087, p000088, p000089, p000097, câu 1 p000101), dùng nhất quán đại từ tự quy chiếu `mình` / `Mình` theo đúng B04-F02 (tuyệt đối không dùng `tôi` hay `cô` cho nội tâm tự quy chiếu); khi tự quy chiếu tập thể đơn vị/phe mình ở ngôi thứ nhất số nhiều trong suy nghĩ (p000085, p000088, p000092, p000094, câu 3 p000101), dùng `chúng tôi` kết hợp `phe ta` / `quân ta` (p000092, p000093); dùng chủ ngữ phiếm chỉ `người ta` cho đại từ khái quát ở p000091; (2) ở các câu/mệnh đề trần thuật ngôi thứ ba hoặc khi Tanya tự nhìn nhận bản thân từ góc nhìn khách quan bên ngoài, giữ nguyên tên riêng/quân hàm `Tanya` (p000083), `Thiếu tá von Degurechaff` (p000098), `Thiếu tá Tanya von Degurechaff` (p000102), danh ngữ `cô bé này` (câu 1 p000101) và đại từ trần thuật `Nó` / `nó` (câu 2 p000101, câu 2 p000102), đồng thời giữ nguyên đại từ trích dẫn trong ngoặc kép `“cô ấy”` tại câu 1 p000101 như đối tượng của lời bình về việc gọi bản thân bằng đại từ giống cái; (3) trong lời thoại vô tuyến tác chiến và giao tiếp chỉ huy trực tiếp, Tanya tự xưng `Tôi` (p000082, p000099), dùng `chúng tôi` khi đại diện đơn vị làm việc với CP/đài quan sát (p000082, p000095), và dùng `chúng ta` cùng `tiểu đoàn mình` khi thông báo cho thuộc cấp là Úy Serebryakov (p000099); (4) bảo toàn duy nhất dấu nhấn mạnh Markdown `*ối*` tại câu 3 p000076 khớp với thẻ `<html:em>` duy nhất trong nguồn, không tự thêm `*...*` ở bất kỳ đoạn nào khác (DEC-P01-002)"
    alternatives_vi:
      - "chúng ta (thay cho `chúng tôi` ở câu `Đây mới là mùa xuân đầu tiên của chúng tôi` tại p000085 — ưu tiên giữ `chúng tôi` để đồng bộ với các đoạn suy nghĩ quy chiếu đơn vị/quân đồn trú tại p000088, p000092, p000094, p000101)"
