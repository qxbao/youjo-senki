  rationale: "Kế thừa đồng bộ toàn bộ các lựa chọn thuật ngữ, đơn vị, quân hàm, phù hiệu và danh xưng đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b06_translation_proposals`, `handoffs/vol-02/ch-03-b06.yml#reviewer_term_recommendations` và báo cáo signoff `reviews/prose/vol-02/ch-03-b06-fixes-signoff-claude.md`, đồng thời liên thông chặt chẽ với `ch-03-b04` và `ch-03-b05` (`phía Tình báo`, `Cụm tập đoàn quân Trung ương` / `Quân Trung ương` / `Trung ương`, `Cụm tập đoàn quân phương Bắc`, `Thượng tướng von Wragell`, `học viện chiến tranh`, `Bộ Tổng tham mưu`, `Liên minh Entente`, `sĩ quan tham mưu pháp sư` / `sĩ quan tham mưu` / `sĩ quan tham mưu cấp cao`, `pháp sư biệt kích`, `Tiểu đoàn Pháp sư Không quân 203`, `sĩ quan cấp tá`, `dây tham mưu` / `phù hiệu tham mưu`, `Đế quốc, Đế chế`, `Đại tá`)."
