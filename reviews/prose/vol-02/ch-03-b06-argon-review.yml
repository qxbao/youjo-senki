  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ nhất quán hệ đại từ điểm nhìn bên ngoài của Tướng von Schreise và các sĩ quan tham mưu (`ông` cho Schreise và von Wragell, `anh ta` / `anh` cho viên đại tá tham mưu, `cô ta` cho Tanya trong góc nhìn cay cú ở p000121 và câu nội tâm ở p000128/p000134, `cô` / `Cô` cho Tanya ở các đoạn trần thuật còn lại), bảo toàn hướng châm chọc trung tính ở p000139, và duy trì chuẩn mực xưng hô quân sự giữa Tanya với các sĩ quan cấp trên (`Tôi` / `tôi` / `tiểu đoàn tôi` – `quân ta` – `Thưa ngài` / `thưa Đại tá`)."
