- source_term: schreise_and_staff_officers_external_pov_conference_pronouns_vol02_ch03_b06
  proposed_vi: "Trong phân cảnh cuộc đấu trí tại phòng họp tham mưu Cụm tập đoàn quân phương Bắc nhìn từ góc độ bên ngoài của Tướng Jekof von Schreise và các sĩ quan tham mưu (part0016/p000120–p000142): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `ch-03-b04` – `ch-03-b05`, trần thuật ngôi thứ ba quy chiếu Schreise và Thượng tướng von Wragell bằng đại từ trang trọng `ông` / `Ông` (p000122, p000123, p000127) kết hợp tên riêng `Schreise` và danh xưng `Thượng tướng von Wragell` / `vị cựu binh` / `cấp trên`; quy chiếu viên đại tá tham mưu lên tiếng thuyết phục Tanya bằng `anh ta` / `Anh ta` và `anh` (p000129, p000130, p000132); quy chiếu Tanya từ điểm nhìn bực tức ngầm của Schreise ở p000121 và trong câu nội tâm bực dọc của các sĩ quan ở p000128, p000134 bằng `cô ta` / `Cô ta` (theo mục `vol02-ch03-b06-schreise-tanya-reference` đã sửa ở F2), còn trong toàn bộ phần trần thuật quan sát bên ngoài cũng như câu hỏi tu từ nội tâm tán thưởng giả bộ của sĩ quan tham mưu thì dùng `cô` / `Cô` xuyên suốt (p000126, p000129, p000130, p000132, p000139, p000141) kết hợp danh xưng `Degurechaff` / `Thiếu tá von Degurechaff` (p000126, p000129, p000132, p000142); quy chiếu phía Tình báo, các cụm tập đoàn quân khu vực, Cụm tập đoàn quân phương Bắc, bộ chỉ huy Liên minh Entente và tập thể các sĩ quan trong phòng họp bằng `họ` / `Họ` (p000120, p000121, p000122, p000126, p000127, p000128, p000136, p000141), đồng thời bảo toàn nguyên vẹn độ mở quy chiếu của đại từ `Họ` / `họ` ở p000127–p000128 theo đúng khuyến nghị của báo cáo review; trong nội tâm trực tiếp được nhấn mạnh bằng chữ nghiêng của Schreise (p000128) và của viên đại tá tham mưu (p000129–p000131), Schreise gọi các sĩ quan tham mưu pháp sư là `Các anh`, còn viên đại tá tham mưu tự quy chiếu ngôi thứ nhất bằng `tôi` và gọi Tanya là `cô`; ở câu hỏi mỉa mai không lời mà Tanya dường như muốn gửi tới cử tọa tại p000139, dùng cấu trúc vô nhân xưng trung tính không ép chủ ngữ (`*Đến cả kẻ địch đã suy yếu mà cũng không đẩy lui nổi sao?*`) theo đúng bản sửa F1 đã signoff. Trong đối thoại trực tiếp tại hội nghị (p000124, p000125, p000129, p000133, p000136, p000137, p000138, p000140, p000142): các sĩ quan tham mưu tự xưng `tôi`, gọi Tanya là `Thiếu tá von Degurechaff` / `Cô` / `cô` kết hợp phản thân `mình` và đại từ bao gộp `chúng ta` (p000124, p000129, p000137, p000140); Tanya tự xưng `Tôi` / `tôi` hoặc lược chủ ngữ (ở câu đáp khiêm nhường tại p000125 theo bản sửa F3), thưa cấp trên trọng thị bằng `Thưa ngài` (p000138) và `thưa Đại tá` (p000142), đồng thời phân biệt rõ giữa `tiểu đoàn tôi` (chỉ riêng Tiểu đoàn 203) và `quân ta` (chỉ lực lượng chung của Đế quốc đã bào mòn địch trước đó) tại p000138 theo bản sửa F5"
  alternatives_vi:
  - nó (thay cho `cô ta` tại part0016/p000121 hoặc thay cho `cô` / `Cô` tại p000126, p000129, p000130, p000132, p000139, p000141 — bắt buộc giữ `cô ta` ở p000121 theo bản sửa F2 và mục `vol02-ch03-b06-schreise-tanya-reference`, đồng thời giữ `cô` / `Cô` ở các đoạn còn lại theo mục `vol02-ch03-b05-tanya-external-pov` vì toàn bộ lô này được kể từ điểm nhìn bên ngoài của Schreise và các sĩ quan tham mưu, trong khi `nó` theo `DEC-P01-001` chỉ áp dụng cho điểm nhìn của Tanya) / ta / binh sĩ chúng tôi (thay cho cấu trúc lược chủ ngữ ở p000125 và `quân ta` ở p000138 — bắt buộc giữ bản sửa F3 và F5 đã signoff để bảo đảm lễ tiết cấp dưới – cấp trên và tính nhất quán logic trong lập luận của Tanya) / cô / các vị (thay cho câu hỏi mở lược chủ ngữ tại part00016/p000139 — bắt buộc giữ câu hỏi trung tính không chủ ngữ theo bản sửa F1 đã signoff)
