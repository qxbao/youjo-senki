  - id: vol02-ch04-b20-pov-transition-pronouns-and-emphasis
    source_term: perspective shift between Commonwealth intelligence (General Habergram in p000250–p000266) and Imperial General Staff / Navy briefing (p000267–p000277), pronoun disambiguation in p000270–p000274, and DEC-P01-002 emphasis in p000255/p000274/p000276
    proposed_vi: >-
      xác nhận hệ thống điểm nhìn, đại từ và nhấn mạnh trong toàn lô: (1) Từ
      p000250 đến p000266 (điểm nhìn phía Khối Thịnh vượng chung và Tướng
      Habergram), quy chiếu Tướng Habergram bằng “Tướng Habergram” và đại từ
      “ông” / “Ông” (kết hợp đại từ phản thân “mình” tại p000265), dùng “chúng
      ta” (p000255) và “ta” (p000263) cho phía Khối Thịnh vượng chung/đồng minh,
      và quy chiếu lực lượng pháp sư Đế quốc tập kích bằng “chúng” / “Chúng”
      (kết hợp “mình” tại p000256 và “tất cả” tại p000259). (2) Từ p000267 đến
      p000277 (chuyển cảnh sang cuộc họp giữa Bộ Tổng Tham mưu Lục quân và Hải
      quân Đế quốc), dùng “Chúng ta” / “chúng ta” trong lời thoại của các sĩ
      quan Đế quốc (p000269, p000272), dùng “họ” / “Họ” trong trần thuật cho các
      sĩ quan tham mưu và phía Hải quân Đế quốc (p000268, p000270, p000274), và
      phân biệt rõ với các tàu của Liên minh Entente bằng “đối phương” (p000270),
      “chúng” (p000271, p000273, p000274 — đã áp dụng bản sửa L1 tại p000273) và
      “họ” trong lời giải trình của sĩ quan hải quân tại p000277. (3) Bảo toàn
      chính xác ba vị trí nhấn mạnh `*...*` theo DEC-P01-002 tại p000255,
      p000274 và p000276, không tự thêm nhấn mạnh ở đoạn khác và không dùng đại
      từ “nó” cho nhân vật (chỉ dùng “nó” cho chiếc tàu tại p000263)
    alternatives_vi:
      - dùng “chúng” thay cho “họ” tại p000277 nếu muốn quy chiếu thuần túy tới các con tàu thay vì hạm đội/thủy thủ đoàn đối phương
