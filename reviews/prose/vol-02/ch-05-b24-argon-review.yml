findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000620
    category: rank_terminology_consistency
    issue: >-
      Tại `p000620`, quân hàm đầy đủ `Magic Second Lieutenant Warren Grantz` đang được dịch là `Thiếu úy Pháp sư Warren Grantz` (tương tự cách dịch `Thiếu tá Pháp sư` trong thư tại `ch-05-b20` `p000514`, `p000526`), trong khi mục `Magic Second Lieutenant` ở `chapter1_b01_pending_terms` (`work/run-state/pending-terms.yml`) và các lần xuất hiện trước tại `ch-05-b18` (`p000444`), `ch-05-b19` (`p000489`) dùng `Thiếu úy ma pháp Warren Grantz` / `Thiếu úy Ma pháp Warren Grantz`.
    basis: >-
      Cả hai cách dịch `Thiếu úy Pháp sư` và `Thiếu úy ma pháp` / `Thiếu úy Ma pháp` đều diễn đạt chính xác cấp bậc sĩ quan pháp sư cấp thiếu úy của Warren Grantz và không gây nhầm lẫn ngữ nghĩa.
    recommendation: >-
      Không chặn signoff; ở bước polish hoặc rà soát thuật ngữ toàn tập có thể cân nhắc đồng bộ thành `Thiếu úy ma pháp Warren Grantz` (hoặc `Thiếu úy Ma pháp Warren Grantz`) để thống nhất với `chapter1_b01_pending_terms` và `ch-05-b18`–`b19`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000625
    category: lexical_register_and_aerial_nuance
    issue: >-
      Tại `p000625`, động từ chỉ việc pháp sư bay vọt lên cao (`climbing`) đang dịch sát nghĩa đen là `đang leo lên với tốc độ chóng mặt`; đồng thời tại câu cuối của `p000626`, khi Grantz nhắc tới hai đồng đội tân binh thuộc Trung đội Bảy vừa tử trận vì trúng hỏa lực (`those other two guys`, đối chiếu `p000629`), bản dịch dùng từ `hai gã kia` có sắc thái hơi suồng sã so với tâm trạng bàng hoàng, thương cảm và mặc cảm tội lỗi của Grantz xuyên suốt lô.
    basis: >-
      Đặt liền với động từ `bay lên` ở ngay câu mở đầu `p000626`, người đọc vẫn hiểu rõ hành động tăng độ cao trên không ở `p000625`, và quy chiếu về hai người lính mới đến mặt trận cùng đợt với Grantz ở `p000626`–`p000629` vẫn hoàn toàn rõ ràng.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh `đang leo lên` ở `p000625` thành `đang bay vọt lên cao` (hoặc `đang vọt lên cao`) và đổi `hai gã kia` ở `p000626` thành `hai cậu kia` (hoặc `hai người kia`).
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000633
    category: military_hierarchy_nuance
    issue: >-
      Tại `p000633`, cụm `the senior officers` (chỉ các sĩ quan thâm niên/đàn anh trong tiểu đoàn đang trực tiếp thẩm vấn tù binh ngay cạnh đám tân binh vừa rút về căn cứ hậu phương) đang được dịch là `các sĩ quan cấp cao`, dễ gợi liên tưởng tới các sĩ quan cấp tướng hoặc cấp đại tá/thượng tá ở Bộ Tư lệnh thay vì các sĩ quan kỳ cựu trong Tiểu đoàn 203.
    basis: >-
      Trong ngữ cảnh đối lập trực tiếp với `tân binh` (`p000631`) ngay tại căn cứ hậu phương của tiểu đoàn sau cuộc đột kích đêm, người đọc vẫn hiểu đây là nhóm sĩ quan cấp trên/kỳ cựu của đơn vị.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh `các sĩ quan cấp cao` tại `p000633` thành `các sĩ quan đàn anh` hoặc `các sĩ quan kỳ cựu` (hoặc `các sĩ quan cấp trên`).
    resolution: optional_polish

