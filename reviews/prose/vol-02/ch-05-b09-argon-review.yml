  - id: vol02-ch05-b09-tanya-pov-narration-monologue-shifts-and-emphasis
    source_term: "Third-person narration pronouns for Tanya at p000219, p000221, p000225, and p000226 (`Tanya` / `nó`), first-person interior monologue pronouns at p000220 and p000225 (`mình` / `bọn mình`), intra-paragraph POV shift from third-person narration to first-person monologue at p000225, generic second-person omission across p000216, p000223, and p000224, and exact preservation of three italicized spans at p000207, p000213, and p000224"
    proposed_vi: "Tiếp nối mạch phân tích chính trị – ngoại giao sau phiên tòa từ ch-05-b08 và chuyển cảnh sang chiến tuyến sông Rhine, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000219, p000221, đầu câu 1 p000225, p000226), quy chiếu Tanya nhất quán bằng tên riêng `Tanya`, chức danh `Thiếu tá von Degurechaff`, biệt danh `Ác quỷ sông Rhine` và đại từ trần thuật `nó` (đã sửa triệt để 3 lần ở p000219 theo B09-P03 và 2 lần `nó cùng binh lính của nó` ở p000221 theo B09-P04, tuyệt đối không dùng `cô`); (2) trong độc thoại nội tâm ngôi thứ nhất của Tanya tại p000220 và p000225, dùng nhất quán đại từ tự quy chiếu `mình` và số nhiều `bọn mình` (gộp Tanya và Trung úy Serebryakov ở câu 2–3 p000225), đồng thời bảo toàn chính xác điểm chuyển điểm nhìn nội đoạn tại p000225 từ câu mở đầu trần thuật (`Vừa nghĩ vậy, Tanya chợt nhận ra mình muốn tự khen mình...`) sang chuỗi độc thoại nội tâm trực tiếp (`chỉ có mình và Trung úy Serebryakov... bọn mình...`); (3) lược bỏ tự nhiên đại từ ngôi thứ hai phiếm chỉ (`you`) trong các câu nhận định khái quát và châm ngôn đời lính ở p000216, p000223 và p000224 theo quy ước direct-address choice; (4) bảo toàn chính xác và duy nhất 3 vùng nhấn mạnh bằng `*...*` khớp tuyệt đối với 3 thẻ `<html:em>` trong nguồn: `*sự cố đáng tiếc*` (p000207, đã sửa theo B09-P01), `*Đế quốc đánh chìm tàu Khối Thịnh vượng chung*` (p000213) và toàn bộ đoạn 3 câu `*Nếu binh lính mất khả năng mỉm cười thì đó là dấu hiệu chẳng lành. Những lúc như thế, phải đảm bảo họ không uống quá nhiều. Nếu không muốn bị bắn tỉa, phải bỏ thuốc lá.*` (p000224), không tự thêm `*...*` ở bất kỳ câu nội tâm nào khác (DEC-P01-002)."
