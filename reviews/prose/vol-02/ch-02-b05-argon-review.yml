- source_term: tanya_weiss_203rd_briefing_and_monologue_pronouns_vol02_ch02_b05
  proposed_vi: "Trong phân cảnh Trung úy Weiss và Tanya tiếp tục phổ biến nhiệm vụ cho Tiểu đoàn 203 kèm chuỗi độc thoại nội tâm của Tanya (part0014/p000093–p000117): tuân thủ nghiêm ngặt `DEC-P01-001` và quy ước trần thuật Chương 2 Tập 2, độc thoại nội tâm trực tiếp của Tanya tự quy chiếu ngôi thứ nhất bằng `Mình` / `mình` xuyên suốt (p000096, p000100, p000103, p000105, p000108, p000115, p000116), dùng `binh lính dưới quyền mình` ở p000096 (tránh đại từ ngôi thứ ba giới tính hóa), và dùng `chúng ta` khi suy ngẫm với tư cách toàn đơn vị hoặc loài người nói chung (p000094, p000111, p000114, p000116); trong các câu trần thuật ngôi thứ ba (p000094, p000099, p000101, p000113), định danh Tanya bằng tên riêng `Tanya` (tránh `cô`); quy chiếu Trung úy Weiss bằng `anh` / `anh ta` / `phó chỉ huy` (p000101, p000103, p000105, p000106); quy chiếu Bộ Tổng tham mưu và binh lính bằng `họ` (p000095, p000098, p000100, p000103, p000108); trong lời thoại trực tiếp trước đơn vị (p000093, p000095, p000107, p000109, p000112), cả Weiss và Tanya đều dùng đại từ bao gộp `chúng ta`; trong câu thoại giả định của cấp trên tại p000108 dùng `Chúng tôi` và lược đại từ ngôi thứ hai để tránh gán giới tính"
  alternatives_vi:
  - cô / cô ấy (thay cho việc lặp tên riêng `Tanya` ở trần thuật p000101 hoặc `mình` ở nội tâm p000096, và trong câu nói giả định ở p000108 — bắt buộc bác bỏ theo `DEC-P01-001` và báo cáo signoff `reviews/prose/vol-02/ch-02-b05-fixes-signoff-claude.md`)
