  proposed_vi: "nội tuyến, cơ động qua lại theo nội tuyến (part0014/p000093) / Bộ Tổng tham mưu, đội ngựa kéo bị đóng ách, cà rốt (part0014/p000095, p000096, p000104, p000108, p000112, p000114) / sĩ quan và tướng lĩnh, binh sĩ cấp thấp, hệ thống thị trường tự do (part0014/p000098) / chế độ nghĩa vụ quân sự, Đế quốc, Serebryakov, Tanya (part0014/p000094, p000099, p000101, p000113) / chế độ quân nhân tình nguyện, lương hưu công chức lẫn lương hưu sĩ quan (part0014/p000100) / Weiss, Trung úy Weiss, phó chỉ huy (part0014/p000101, p000105, p000106, p000113) / Tiểu đoàn! Nghiêm! (part0014/p000102) / phẩm giá con người, “thuần hóa” (part0014/p000108) / cụm hỗn hợp, Cụm Tập đoàn quân phía Đông, Cụm Tập đoàn quân phía Nam, Trung ương, Bộ Chỉ huy phương Bắc, phía Bắc (part0014/p000109, p000112) / phẩm giá chính trị, chế độ độc tài của hoàng đế hay quý tộc, đám đông cai trị, loài vật chính trị (part0014/p000110, p000116) / danh dự, lý trí (part0014/p000111) / chiến thuật chiến đấu mới (part0014/p000112) / cụm tập đoàn quân, các đạo quân khu vực (part0014/p000114) / con khỉ xiếc, hội bảo vệ động vật, binh lính Đế quốc (part0014/p000115, p000116) / sự thương hại của những người theo chủ nghĩa gia trưởng (part0014/p000117)"
  alternatives_vi:
  - tuyến nội bộ / đường nội tuyến (thay cho `nội tuyến` tại part0014/p000093 — ưu tiên `nội tuyến` theo đúng mục `vol02-ch02-b05-interior-lines` trong `pending-terms.yml` vì là thuật ngữ chiến lược quân sự chuẩn xác chỉ việc cơ động lực lượng giữa các mặt trận từ vị trí trung tâm) / Bộ Chỉ huy phía Bắc và Bộ Tư lệnh Trung ương (thay cho `Bộ Chỉ huy phương Bắc` và `Trung ương` tại part0014/p000109 — ưu tiên `Bộ Chỉ huy phương Bắc` và `Trung ương` theo đúng mục `vol02-ch02-b05-northern-central-command` để giữ tính trung tính khi nguyên tác chỉ viết `Central` và đồng bộ với tiền lệ Chương 1) / thể diện chính trị (thay cho `phẩm giá chính trị` tại part0014/p000110 — ưu tiên `phẩm giá chính trị` theo mục `vol02-ch02-b05-political-dignity` để giữ phép đối chiếu trực tiếp với `phẩm giá con người` ở p000108)
