- source_term: entente_councilors_and_colonel_sue_family_farewell_pronouns_vol02_ch04_b01
  proposed_vi: "Trong phân cảnh các nghị viên Liên minh Entente bàn việc chuyển giao quyền hạn để tiếp tục kháng chiến ở nước ngoài và cảnh Đại tá Anson Sue tiễn vợ cùng con gái Mary sơ tán sang Hợp chúng quốc trước giờ xuất kích (part0020/p000001–p000024): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và hai bản sửa M1, M2 đã được nghiệm thu trong `handoffs/vol-02/ch-04-b01.yml`: (1) Trong đối thoại giữa các nghị viên Liên minh Entente (p000004, p000005, p000008–p000011) và câu tuyên bố mang tính biểu tượng (p000012): giữ nguyên khung ngoặc kép lời thoại ở p000004 theo bản sửa M1; người nói tự xưng `tôi` / `Tôi` (p000009–p000011), gọi đối phương bằng chức danh kèm họ `Nghị viên Abensoll` và đại từ trang trọng `ông` (p000011), dùng `chúng ta` / `Chúng ta` cho tập thể hội đồng / phe kháng chiến (p000004, p000008, p000010, p000012); tại p000009 giữ rõ tân ngữ quy chiếu `người sẽ tiếp nhận quyền hạn ấy` theo bản sửa M2. (2) Trong trần thuật ngôi thứ ba về Đại tá Sue và gia đình (p000015, p000016, p000021, p000022, p000024): quy chiếu Đại tá Sue bằng cấp bậc – tên riêng `Đại tá Sue` / `Sue`, đại từ `anh` / `Anh` (p000015, p000016, p000021, p000022, p000024) và đại từ phản thân `mình` (p000021); quy chiếu vợ của Sue trong câu trần thuật p000015 bằng `Bà`, và quy chiếu chung hai mẹ con bằng `họ` (p000015, p000016). (3) Trong độc thoại nội tâm trực tiếp in nghiêng của Đại tá Sue (p000016, p000022, p000023): giữ đúng phạm vi nhấn mạnh `*...*` theo `DEC-P01-002`; tại câu mở đầu suy ngẫm khái quát ở p000016 dùng `tôi` kết hợp phản thân `mình` và `Tổ quốc chúng ta`, còn trong chuỗi tự vấn đầy hối tiếc về gia đình ở p000022–p000023 dùng `mình` / `Mình` và `cuộc sống của chúng ta`. (4) Trong đối thoại gia đình giữa Đại tá Sue, vợ và con gái Mary (p000014, p000015, p000017–p000020): khi nói với vợ, Sue tự xưng `Anh` (`“…Anh xin lỗi,”` tại p000015); khi nói với con gái Mary, Sue tự xưng `Bố` và gọi Mary là `Mary` / `con` (p000018, p000020); Mary gọi cha là `Bố` (`“Bố ơi?”` tại p000017, `“…Bố không thể đi cùng mẹ con con sao?”` tại p000019) và tự quy chiếu hai mẹ con là `mẹ con con`"
  alternatives_vi:
  - ông (thay cho `anh` / `Anh` trong trần thuật về Đại tá Sue tại part0020/p000015, p000016, p000021, p000022, p000024 — giữ `anh` / `Anh` theo bản dịch đã nghiệm thu để đồng bộ mạch cảm xúc người chồng, người cha trẻ trung và nhất quán với lời thoại tự xưng `Anh` với vợ ở p000015) / người nhận nhiệm vụ (thay cho `người sẽ tiếp nhận quyền hạn ấy` tại part0020/p000009 — bắt buộc giữ `người sẽ tiếp nhận quyền hạn ấy` theo bản sửa M2 đã nghiệm thu trong `handoffs/vol-02/ch-04-b01.yml` để liên kết chính xác với `chuyển giao quyền hạn` ở p000008)
