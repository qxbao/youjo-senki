  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ tình báo – ngoại giao – hải quân, đơn vị, địa danh, chính thể và cấp bậc đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b20_translation_proposals`, `chapter3_b21_translation_proposals` và `chapter3_b22_translation_proposals` cùng `handoffs/vol-02/ch-03-b21.yml` (`Đế quốc`, `Liên minh Entente`, `Dacia`, `chính phủ lưu vong`, `một sĩ quan bên Tác chiến`, `tàu tuần dương thương mại vũ trang`, `luật quốc tế`, `Tướng Habergram`, `Tình báo` / `cơ quan Tình báo`, `nhân vật quan trọng`, `Cộng hòa`, `các tuyến thứ ba`, `các tuyến phía bắc`, `tàu phụ trợ`, `Hải quân Đế quốc`, `nghị viên nhà nước`, `Khối Thịnh vượng chung`, `sĩ quan tham mưu`, `chính trị gia ở cấp bộ trưởng`, `quy chế tị nạn` / `xin tị nạn`, `một người độc đến thế`, `Văn phòng Bộ Hải quân`, `Đệ nhất Lãnh chúa Hải quân`, `quân cảnh`, `sĩ quan trực ban`), bảo toàn trọn vẹn các bản sửa V1–V5 và N1, N4–N6, N8, N11 đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b21-fixes-signoff-claude.md`."
