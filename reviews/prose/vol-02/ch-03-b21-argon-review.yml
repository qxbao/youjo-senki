- source_term: commonwealth_intelligence_habergram_staff_and_admiralty_duty_officer_pronouns_vol02_ch03_b21
  proposed_vi: "Trong phân cảnh thảo luận nội bộ tại cơ quan Tình báo Khối Thịnh vượng chung dưới quyền Tướng Habergram về yêu cầu tị nạn của một nghị viên nhà nước Liên minh Entente trên tàu phụ trợ và cuộc di chuyển khẩn cấp tới Văn phòng Bộ Hải quân (part0018/p000380–p000410): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa V1–V5, N1, N4–N6, N8, N11 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b21.yml`: (1) Trần thuật ngôi thứ ba quy chiếu Tướng Habergram bằng danh xưng `Tướng Habergram` / `người đứng đầu` / `Người phụ trách ở đây` / `vị tướng` kết hợp đại từ trang trọng `ông` / `Ông` / `chính ông` (p000387, p000389, p000395, p000399, p000401–p000404, p000406, p000407, p000410) và đại từ phản thân `mình` (p000403), trong đó đại từ `Ông` tại p000395 là quy chiếu suy luận từ ngữ cảnh theo mục `vol02-ch03-b21-habergram-referent`; quy chiếu sĩ quan trực ban gác trước Văn phòng Bộ Hải quân bằng `sĩ quan trực ban` / `viên sĩ quan trẻ này` và đại từ `anh ta` (p000406, p000407, p000410); dùng cấu trúc câu khái quát lược đại từ ngôi thứ hai phiếm chỉ tại p000386 (`Không nên phá vỡ hiệp ước; phải ép đối phương phá vỡ chúng.`). (2) Quy chiếu tập thể cơ quan Tình báo Khối Thịnh vượng chung, các sĩ quan dưới quyền và thủy thủ đoàn tàu phụ trợ bằng `họ` / `Họ` (p000382, p000384, p000385, p000389, p000392–p000395, p000397, p000401, p000404); quy chiếu các hiệp ước và các con tàu bằng `chúng` (p000384, p000386). (3) Trong đối thoại tại phòng họp Tình báo (p000381–p000383, p000388, p000390, p000391, p000396, p000400): cấp dưới gọi Tướng Habergram là `Thưa ngài`, tự xưng `Tôi` (p000383, p000390) và dùng `chúng ta` cho phía cơ quan Tình báo Khối Thịnh vượng chung (p000381–p000383); Tướng Habergram tự xưng `tôi` (p000388) và dùng các câu hỏi/mệnh lệnh ngắn gọn lược đại từ (`“…Vậy thì lúc này, thêm một ít hàng hóa cũng chẳng khác biệt là bao. Nhân vật quan trọng đó là ai?”`, `“…Chờ một chút.”`). (4) Trong đối thoại trước Văn phòng Bộ Hải quân giữa Tướng Habergram và sĩ quan trực ban (p000405, p000408, p000409): Tướng Habergram xưng tên `Habergram đây`, tự xưng `Tôi` và quy chiếu Đệ nhất Lãnh chúa Hải quân bằng danh xưng chức vụ cùng đại từ tôn kính `ngài ấy`; sĩ quan trực ban đáp lễ phép `“Có ạ. Ngài đã hẹn trước chưa?”`"
  alternatives_vi:
  - Anh ta (thay cho `Ông` tại part0018/p000395 — bắt buộc giữ `Ông` theo mục `vol02-ch03-b21-habergram-referent` và bản sửa V3 đã nghiệm thu để đồng bộ cấp bậc với Tướng Habergram xuyên suốt p000387–p000407) / bạn / người ta (thay cho cấu trúc vô nhân xưng tại part0018/p000386 — ưu tiên lược bỏ đại từ ngôi thứ hai phiếm chỉ để giữ giọng đúc kết nguyên tắc ngoại giao – tình báo súc tích, đanh thép)
