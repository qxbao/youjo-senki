  proposed_vi: "Đế quốc, Liên minh Entente, Dacia (part0018/p000380, p000382, p000389, p000392, p000401) / chính phủ lưu vong, một sĩ quan bên Tác chiến (part0018/p000382, p000397, p000398) / tàu tuần dương thương mại vũ trang, luật quốc tế, thu thập tình báo và phá hoại hoạt động thương mại, tàu có vũ trang, tàu buôn, thủy thủ đoàn, cướp biển (part0018/p000383–p000385, p000387) / Tướng Habergram, vị tướng (part0018/p000387, p000399, p000402, p000405, p000406, p000410) / lên tàu kiểm tra, người đứng đầu, Tình báo, cơ quan Tình báo (part0018/p000388, p000389, p000392, p000397) / nhân vật quan trọng (part0018/p000391) / các nhân viên Tình báo, Cộng hòa, các tuyến thứ ba, công tác thu thập và phân tích tình báo, các tuyến phía bắc (part0018/p000392) / tin tình báo, tàu phụ trợ, Hải quân Đế quốc, kế hoạch đổ bộ (part0018/p000393) / một nghị viên nhà nước, mười nghị viên nhà nước, Khối Thịnh vượng chung, sĩ quan tham mưu (part0018/p000396, p000397) / chính trị gia ở cấp bộ trưởng, chính phủ tiền nhiệm có đủ thẩm quyền (part0018/p000398) / quy chế tị nạn, xin tị nạn, các cơ quan chính phủ, rủi ro chính trị và ngoại giao, thẩm quyền tự quyết (part0018/p000401, p000402) / nắm quyền điều hành, một người độc đến thế, tính bảo mật, người hộ tống, Văn phòng Bộ Hải quân, Đệ nhất Lãnh chúa Hải quân (part0018/p000403–p000405) / quân cảnh, sĩ quan trực ban (part0018/p000406, p000410)"
  alternatives_vi:
  - Văn phòng Bộ Hải quân / Đệ nhất Hải vụ khanh hoặc Văn phòng Hải vụ / Đệ nhất Hải vụ khanh (thay cho `Văn phòng Bộ Hải quân` / `Đệ nhất Lãnh chúa Hải quân` tại part0018/p000404, p000405 — bắt buộc giữ `Văn phòng Bộ Hải quân` / `Đệ nhất Lãnh chúa Hải quân` theo mục `vol02-ch03-b21-admiralty-titles` và `vol02-ch03-b22-admiralty-titles` trong `work/run-state/pending-terms.yml` cùng bản sửa V5 đã nghiệm thu trong `handoffs/vol-02/ch-03-b21.yml`) / các tuyến phòng thủ thứ ba (thay cho `các tuyến thứ ba` tại part0018/p000392 — giữ `các tuyến thứ ba` theo mục `vol02-ch03-b21-third-lines` và bản sửa N8 đã nghiệm thu để tránh tự suy diễn chức năng phòng thủ ngoài văn bản nguồn) / tàu buôn vũ trang (thay cho `tàu tuần dương thương mại vũ trang` tại part0018/p000383, p000384 — giữ `tàu tuần dương thương mại vũ trang` theo mục `vol02-ch03-b20-armed-merchant-cruiser` để bảo toàn yếu tố phân loại tàu tuần dương và phân biệt với `tàu buôn` thông thường ở câu bốn của p000384) / nhân vật gai góc / kẻ khó nuốt (thay cho `một người độc đến thế` tại part0018/p000404 — giữ `một người độc đến thế` theo mục `vol02-ch03-b21-toxic-description` và bản sửa V4 đã nghiệm thu để bám sát nghĩa đen ít suy diễn nhất; ghi độ bất định cao)
