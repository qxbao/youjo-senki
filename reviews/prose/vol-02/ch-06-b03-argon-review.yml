findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000068
    category: lexical_nuance
    issue: >-
      Tại vế thứ hai của `p000068`, danh từ `demand` (yêu cầu / đòi hỏi) và cụm trạng ngữ chỉ tính đồng thời đang được diễn đạt mở rộng thành cấu trúc song hành `nên việc phải vừa ổn định hậu phương vừa giữ quân ở tiền tuyến gần như là bất khả thi`.
    basis: >-
      Cách diễn đạt hiện tại hoàn toàn tự nhiên, mạch lạc trong tiếng Việt và phản ánh đúng thế kẹt giữa thiếu hụt binh lực ở mặt trận với nhiệm vụ ổn định hậu phương mà không làm sai lệch quan hệ nhân quả của câu gốc.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc cân nhắc bám sát danh từ `demand` như `nên yêu cầu vừa phải giữ mặt trận vừa ổn định hậu phương cùng lúc gần như là bất khả thi`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0030.xhtml/p000088
    category: terminology_consistency
    issue: >-
      Danh xưng `Imperial Army` được dịch là `Quân đội Đế quốc` tại `p000076`, `p000077`, `p000091` nhưng dịch là `Lục quân Đế quốc` trong cụm `Bộ Tổng tham mưu Lục quân Đế quốc` tại `p000083`, `p000087`; đồng thời chức danh `army corps commander` tại `p000088` được dịch là `vị chỉ huy quân đoàn` (trong khi `b04` và `chapter6_b10_coordinator_choices` dùng `vị tư lệnh quân đoàn`).
    basis: >-
      Trong nội bộ `b03`, việc dùng `Quân đội Đế quốc` khi đối sánh tổng thể với `Quân đội Cộng hòa` và dùng `Bộ Tổng tham mưu Lục quân Đế quốc` cho cơ quan tham mưu đầu não hoàn toàn tự nhiên; cách gọi `vị chỉ huy quân đoàn` tại `p000088` cũng chuẩn xác về chức trách quân sự và không tự suy đoán cấp hàm.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể giữ nguyên hoặc cân nhắc đồng bộ `vị tư lệnh quân đoàn` / `Lục quân Đế quốc` với các lô liền kề trong Chương 6 nếu muốn thống nhất tuyệt đối xuyên suốt các phân cảnh.
    resolution: optional_polish

