    pronouns_and_address: "Không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng nhận định lịch sử nghiêm khắc của Giáo sư Halbom về bước ngoặt dẫn tới tội ác."
    modality_and_logic: "Bảo toàn định vị thời điểm (`Chính vào lúc này`) và sự phê phán: Quân đội Đế quốc phạm một hành động tàn bạo hiển nhiên, để lại vết nhơ trong lịch sử mà không quốc gia nào nên gây ra."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000078
    terms:
      - "binh sĩ"
    pronouns_and_address: "Dùng đại từ gộp `chúng ta` cho giới nghiên cứu / hậu thế khi nói về hồ sơ lưu trữ."
    pov_and_voice: "Giọng thuyết minh chỉ ra khoảng trống có chủ đích trong hồ sơ lịch sử."
    modality_and_logic: "Bảo toàn đủ 3 câu: không rõ ai ra lệnh; không có ghi chép thực sự về người thi hành; và nhận định đó quả là những binh sĩ buộc phải bị gạt khỏi sử sách."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000079
    terms:
      - "binh sĩ"
      - "trận phòng ngự"
      - "Đế quốc"
    pronouns_and_address: "Quy chiếu những người lính thi hành bằng `Họ`."
    pov_and_voice: "Giọng bình luận nêu bật sự tương phản cực đoan giữa chiến công quân sự và vết nhơ đạo đức."
    modality_and_logic: "Bảo toàn cấu trúc song hành đối lập (`vừa là... vừa là...`): vừa là những binh sĩ xuất sắc bậc nhất lập nên trận phòng ngự thần kỳ, vừa là đám người hèn hạ nhất làm hoen ố sâu sắc danh dự của Đế quốc."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000080
    terms:
      - "thời hậu chiến"
      - "binh sĩ"
      - "mệnh lệnh"
    pronouns_and_address: "Giáo sư Halbom tự xưng `tôi`, quy chiếu những người thực thi mệnh lệnh bằng `họ`."
    pov_and_voice: "Giọng bày tỏ quan điểm cá nhân cảm thông với hoàn cảnh của người lính cấp dưới."
    modality_and_logic: "Bảo toàn sự đối lập giữa dư luận của nhiều binh sĩ thời hậu chiến (chỉ trích họ) với lập trường cá nhân của Halbom (bênh vực những người bị đặt vào tình thế khó khăn ấy vì họ không còn lựa chọn nào khác và đó là mệnh lệnh)."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại tiếp diễn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000081
    terms:
      - "phòng tuyến của Đế quốc"
    pronouns_and_address: "Giáo sư Halbom tự xưng `tôi`."
    pov_and_voice: "Lời kết khép lại phần trả lời phỏng vấn của Giáo sư Halbom."
    modality_and_logic: "Bảo toàn sự phân tách rạch ròi giữa kết quả khách quan (`Điều chắc chắn là đã có người cứu vãn phòng tuyến của Đế quốc`) và thái độ cá nhân (`dù tôi phải nói rằng cá nhân tôi không tán thành cách làm ấy`)."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn thoại khép lại bằng dấu đóng ngoặc kép tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000082
    terms:
      - "Giáo sư Walter Halbom"
    pronouns_and_address: "Câu cảm ơn lịch sự của người dẫn chương trình Andrew dành cho `Giáo sư Walter Halbom`."
    pov_and_voice: "Giọng dẫn chương trình truyền hình chuyên nghiệp."
    modality_and_logic: "Bảo toàn lời cảm ơn trực tiếp gửi tới Giáo sư Walter Halbom."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000083
    terms:
      - "Giáo sư Halbom"
      - "tài liệu nội bộ"
      - "Bộ Tổng tham mưu Lục quân Đế quốc"
    pronouns_and_address: "Câu mệnh lệnh dẫn dắt khán giả lược đại từ chủ ngữ (`hãy xem`)."
    pov_and_voice: "Giọng thuyết minh chuyển cảnh giới thiệu tư liệu mới trên màn hình."
    modality_and_logic: "Bảo toàn lời mời xem đoạn phim tiếp theo và thông tin Giáo sư Halbom cung cấp một tài liệu nội bộ của Bộ Tổng tham mưu Lục quân Đế quốc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000084
    terms:
      - "thực dụng"
    pronouns_and_address: "Quy chiếu chủ thể nữ chưa định danh trong mẩu ghi chú bằng đại từ ngôi thứ ba `Cô ấy` (không áp dụng `DEC-P01-001` vì đây là tài liệu ẩn danh được trích dẫn, không phải trần thuật từ điểm nhìn của Tanya)."
    pov_and_voice: "Giọng ghi chép chiêm nghiệm lạnh lùng trong mẩu giấy nội bộ."
    modality_and_logic: "Bảo toàn tình thái khả thể (`có thể gọi đó là`) cùng cấu trúc trích dẫn lồng dấu ngoặc kép và dấu nháy đơn (`“một hình thức ‘thực dụng’ cực đoan”`)."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn trích dẫn tài liệu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000085
    terms:
      - "Bộ chỉ huy"
      - "Đế quốc"
      - "binh sĩ"
    pronouns_and_address: "Quy chiếu chủ thể nữ bằng `cô`, quy chiếu Bộ chỉ huy bằng `họ`, và người viết mẩu ghi chú tự xưng `tôi`."
    pov_and_voice: "Giọng độc thoại nội tâm căng thẳng, giằng xé của người viết mẩu ghi chú tại Bộ Tổng tham mưu."
    modality_and_logic: "Bảo toàn sự chuyển ngôi tự nhiên có sẵn trong nguồn (từ ngôi thứ ba `cô` / `họ` sang ngôi thứ nhất `tôi` ở câu 3 rồi quay lại `cô` ở câu 5) cùng toàn bộ 5 câu nhận định về việc Bộ chỉ huy tháo bỏ xiềng xích/giới hạn của cô để giành chiến thắng, nghĩa vụ tuân lệnh của người lính, những thôi thúc bị kìm nén bằng lý trí được tháo cũi vì đại nghiệp, và khả thể lý do khiến cô do dự sẽ biến mất."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn trích dẫn tài liệu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000086
    terms: []
    pronouns_and_address: "Người viết mẩu ghi chú tự xưng `Tôi`; đại từ `nó` chỉ quy chiếu danh từ bất động vật/động vật ẩn dụ `một con thú`."
    pov_and_voice: "Giọng chất vấn triết lý sắc lạnh quy kết trách nhiệm cho cấp ra lệnh."
    modality_and_logic: "Bảo toàn câu hỏi tu từ mở đầu về trách nhiệm khi con thú cắn miếng ăn ném trước mặt nó, và câu trả lời khẳng định những kẻ chịu trách nhiệm chính là những người đã ném vật hiến tế cho con thú đang đói."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn trích dẫn tài liệu tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000087
    terms:
      - "Bộ Tổng tham mưu Lục quân Đế quốc"
    pronouns_and_address: "Dòng chú thích nguồn gốc tư liệu không dùng đại từ nhân xưng."
    pov_and_voice: "Chú thích hồ sơ ngắn gọn."
    modality_and_logic: "Bảo toàn dấu sao chú thích literal ở đầu dòng (`\\*`, được escape một lần để không biến thành dấu nhấn mạnh chữ nghiêng) và thông tin mẩu ghi chú nguệch ngoạc được tìm thấy trong sọt rác tại Bộ Tổng tham mưu Lục quân Đế quốc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000088
    terms:
      - "tham mưu trưởng"
      - "vị chỉ huy quân đoàn"
    pronouns_and_address: "Trong lời thoại, vị chỉ huy quân đoàn gọi tham mưu trưởng là `ngài`."
    pov_and_voice: "Chuyển sang mạch trần thuật lịch sử tại sở chỉ huy quân đoàn với giọng hỏi giả bộ điềm tĩnh nhưng nén giận."
    modality_and_logic: "Bảo toàn câu hỏi trực tiếp dành cho tham mưu trưởng (`Với cương vị tham mưu trưởng, ngài có biết chuyện này có thể xảy ra không?`) và phần dẫn miêu tả vị chỉ huy quân đoàn giả vờ hỏi với vẻ độ lượng trong khi cố giấu giọng run trước mức độ nghiêm trọng của tình hình."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000089
    terms:
      - "Quân đội Cộng hòa"
      - "Đế quốc"
    pronouns_and_address: "Trần thuật quy chiếu vị chỉ huy quân đoàn bằng đại từ `ông`."
    pov_and_voice: "Giọng trần thuật bám sát điểm nhìn của vị chỉ huy quân đoàn."
    modality_and_logic: "Bảo toàn sự đối lập giữa vẻ mặt bình thản bên ngoài với cơn giận sôi sục bên trong, cùng nguyên nhân là Quân đội Cộng hòa đã hành động nhanh hơn nhiều so với dự liệu của Đế quốc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000090
    terms:
      - "lực lượng pháp sư tiếp viện"
      - "Arene"
    pronouns_and_address: "Quy chiếu phía quân đoàn / Đế quốc bằng `họ`."
    pov_and_voice: "Giọng trần thuật báo tin dữ bất ngờ từ chiến trường."
    modality_and_logic: "Bảo toàn nội dung tin tức kèm mệnh đề nhượng bộ: trái hẳn mọi dự tính của họ, một lực lượng pháp sư tiếp viện, tuy số lượng ít, đã tiến vào Arene."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000091
    terms:
      - "Phòng tuyến Arene"
      - "Quân đội Đế quốc"
    pronouns_and_address: "Trần thuật quy chiếu vị chỉ huy quân đoàn bằng `ông`, quy chiếu bộ tham mưu/quân đoàn bằng `họ`; hai câu độc thoại nội tâm trực tiếp dùng đại từ ngôi thứ nhất số nhiều `chúng ta`."
    pov_and_voice: "Sự đan xen giữa lời kể ngôi thứ ba và hai câu cảm thán nội tâm đầy cay đắng của vị chỉ huy quân đoàn."
    modality_and_logic: "Bảo toàn 4 câu: dự đoán phòng tuyến Arene sẽ càng vững chắc theo thời gian; câu nội tâm xác nhận kế hoạch đã thất bại hoàn toàn; sự đối lập giữa việc kiểm soát được hỗn loạn ban đầu với cảnh tượng thảm hại của đám quân hoảng loạn khiến ông muốn che mắt; và câu hỏi tu từ nội tâm cuối đoạn."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh hai câu nội tâm tương ứng với hai thẻ `<html:em>` (`*Trong khi đó, kế hoạch của chúng ta đã thất bại hoàn toàn.*` và `*Đây thật sự là Quân đội Đế quốc của chúng ta sao?*`), giữ nguyên các câu trần thuật ở dạng chữ thường."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000092
    terms:
      - "đơn vị trấn áp"
      - "Bộ Tổng tham mưu trung ương"
      - "Bộ phận Đường sắt"
    pronouns_and_address: "Quy chiếu vị chỉ huy quân đoàn bằng `Ông` và quy chiếu Bộ phận Đường sắt bằng `họ`."
    pov_and_voice: "Giọng trần thuật phản ánh cơn bực tức của vị chỉ huy quân đoàn trước sự chậm trễ hậu cần – vận tải."
    modality_and_logic: "Bảo toàn hai câu: ngay cả đơn vị trấn áp mà Bộ Tổng tham mưu trung ương hứa điều đến cũng bị chậm trễ dẫn tới kết quả này; và ý muốn mắng cho Bộ phận Đường sắt (cơ quan chịu trách nhiệm quản lý lịch trình) một trận để hỏi rốt cuộc họ đã làm quái gì."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000093
    terms:
      - "Arene"
      - "tuyến tiếp tế"
      - "tiền tuyến"
      - "quân nhu"
      - "sư đoàn"
      - "Bộ Tổng tham mưu"
    pronouns_and_address: "Trần thuật khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng phân tích hậu cần khép lại lô với những con số định lượng khắc nghiệt."
    modality_and_logic: "Bảo toàn đầy đủ 4 câu cùng các mốc số lượng và điều kiện: việc phải than phiền cho thấy tình hình ở Arene tồi tệ đến mức nào; nếu tàu chạy qua đó tê liệt dù chỉ một ngày thì tuyến tiếp tế chở hàng chục nghìn tấn đạn dược và lương thực ra tiền tuyến sẽ bị đứt đoạn; nếu không điều ít nhất năm trăm—tốt nhất là một nghìn—tấn quân nhu đến mỗi sư đoàn thì quân số tiền tuyến sẽ hao hụt dần; và con số thống kê ấy giờ đã trở thành cơn ác mộng của Bộ Tổng tham mưu."
    emphasis: "none"
