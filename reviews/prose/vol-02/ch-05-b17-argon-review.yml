    pov_and_voice: "Độc thoại nội tâm thực dụng, bám sát câu chữ trong mệnh lệnh cấp trên giao phó."
    modality_and_logic: "Bảo toàn sự tán đồng rằng cần tránh giao chiến vì mệnh lệnh nhận được chỉ gói gọn đúng một câu: cho đám tân binh kinh nghiệm đánh đêm, chấm hết."
