    pov_and_voice: "Độc thoại nội tâm dẫn binh pháp Tôn Tử rồi chuyển sang giọng giễu nhại văn minh hiện đại."
    modality_and_logic: "Bảo toàn trọn vẹn mạch liên tưởng: từ câu châm ngôn biết địch biết ta, sang lối nói mỉa mai về việc thấu hiểu nhau một cách văn minh tiến bộ, để đi tới kết luận rằng một chuyến đi dạo đêm mời lính địch sang chơi cũng không tệ."
    emphasis: "none"

