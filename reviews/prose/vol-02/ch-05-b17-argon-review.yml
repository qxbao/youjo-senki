    pronouns_and_address: "Độc thoại nội tâm dùng `Mình` và `chúng mình` (`DEC-P01-001`)."
    pov_and_voice: "Độc thoại nội tâm chuyển từ nỗi lo chiến thuật sang giọng hài đen tỉnh rụi khi nhắc tới kinh nghiệm huấn luyện khắc nghiệt."
    modality_and_logic: "Bảo toàn đầy đủ các ý: cần suy xét nghiêm túc; lính địch chống cự sẽ không bị giết mà chỉ bị đánh bất tỉnh; với pháp sư việc đó rất dễ vì đã thực hành nhiều ở học viện quân sự và khóa huấn luyện cơ bản về cách làm người ta sống dở chết dở; và sự hữu dụng bất ngờ của Daigongen cùng Zusho."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000415
    terms:
      - "binh lính"
      - "nông dân"
      - "lý thuyết cai trị"
      - "thường dân"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình` (`DEC-P01-001`)."
    pov_and_voice: "Độc thoại nội tâm nối tiếp điển cố ở `p000414` kèm lời tự thú lạnh lùng của Tanya."
    modality_and_logic: "Bảo toàn sự đối chiếu giữa binh lính và nông dân trên bình diện lý thuyết cai trị, cùng câu tự đính chính ở vế sau rằng bản thân Tanya thấy làm việc đó với thường dân thoải mái hơn nhiều."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000416
    terms:
      - "xẻng"
      - "mặt phẳng của xẻng"
      - "tân binh"
    pronouns_and_address: "Câu 1–2 lược đại từ chủ ngữ / đại từ ngôi thứ hai phiếm chỉ theo quy ước `direct-address choice`, quy chiếu lính địch bằng `họ`; câu 3 dùng `mình` (`DEC-P01-001`)."
    pov_and_voice: "Độc thoại nội tâm say sưa ca ngợi tính đa dụng của chiếc xẻng công binh."
    modality_and_logic: "Bảo toàn sự phân biệt công năng: quét ngang lưỡi xẻng thì cứa đứt, còn đập bằng mặt phẳng thì hạ gục gọn một người; từ đó dẫn tới ý nghĩ nửa đùa nửa thật muốn trang bị độc mỗi xẻng cho toàn bộ tân binh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000417
    terms:
      - "chiến hào cảnh giới"
      - "tù binh"
      - "nhóm làm nhiệm vụ trinh sát chiến đấu"
      - "đơn vị phản công"
      - "trận chiến hào"
      - "cuộc tiêu hao lực lượng"
    pronouns_and_address: "Độc thoại nội tâm dùng `ta` / `chúng ta` cho đơn vị và lược đại từ ngôi thứ hai phiếm chỉ ở câu 4 (`direct-address choice`)."
    pov_and_voice: "Độc thoại nội tâm phân tích tỉnh táo rủi ro sau thời điểm bắt được tù binh."
    modality_and_logic: "Bảo toàn trọn vẹn chuỗi lập luận 6 câu: đặt câu hỏi phải làm gì sau khi bắt được “khách”; nếu chiến hào cảnh giới báo động thì chỉ có thể đánh hoặc chạy; vì mục tiêu là bắt tù binh nên đánh nhau là vô nghĩa; với binh lực của một nhóm trinh sát chiến đấu mà đánh nhau trong chiến hào với đơn vị phản công chỉ là cuộc tiêu hao vô vọng; lỡ thời cơ rút lui là chết uổng mạng; do đó đạt mục tiêu xong là phải rút ngay."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000418
    terms: []
    pronouns_and_address: "Lược đại từ sở hữu ngôi thứ hai phiếm chỉ theo quy ước `direct-address choice`."
    pov_and_voice: "Châm ngôn làm việc đúng giờ tan ca của một cựu nhân viên công sở."
    modality_and_logic: "Bảo toàn nhận định khái quát rằng làm xong việc thì chẳng gì tuyệt hơn là về thẳng nhà."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000419
    terms:
      - "tín hiệu mana"
      - "thuật thức bay"
      - "chiến tuyến"
    pronouns_and_address: "Độc thoại nội tâm dùng `ta` ở câu 1 và lược đại từ sở hữu ngôi thứ hai phiếm chỉ ở câu 2 (`direct-address choice`)."
    pov_and_voice: "Độc thoại nội tâm hào hứng ca tụng ưu thế cơ động của thuật thức bay."
    modality_and_logic: "Bảo toàn mối quan hệ nhân quả: khi rút lui có thể ưu tiên tốc độ tối đa mà không cần tiếp tục ém tín hiệu mana nữa, bung hết tín hiệu mana ra và dùng thuật thức bay để vọt thẳng khỏi chiến tuyến."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000420
    terms:
      - "hỏa lực dồn dập đáp lại tín hiệu cầu cứu"
    pronouns_and_address: "Độc thoại nội tâm dùng `Chúng ta`."
    pov_and_voice: "Độc thoại nội tâm nhìn nhận thực tế hiểm nghèo trong vài phút tháo chạy."
    modality_and_logic: "Bảo toàn hai vế đối lập: phải liều mạng chạy trối chết trong vài phút, nhưng nếu không thoát kịp thì sẽ bị thổi tung dưới làn hỏa lực dồn dập đáp lại tín hiệu cầu cứu của địch."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000421
    terms: []
    pronouns_and_address: "Độc thoại nội tâm dùng `ta` / `chúng ta`."
    pov_and_voice: "Giọng tự an ủi mang màu sắc hài đen lạnh lùng."
    modality_and_logic: "Bảo toàn góc nhìn tích cực kiểu bi quan: miễn bị bắn trúng gọn một phát chí mạng thì sẽ không phải chịu đau đớn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000422
    terms: []
    pronouns_and_address: "Dùng đại từ phiếm chỉ `ai cũng`."
    pov_and_voice: "Nhận định chuyển ý khẳng định bản năng ham sống của con người."
    modality_and_logic: "Bảo toàn mệnh đề chuyển折 (`Dẫu vậy, ai cũng muốn tận hưởng cuộc sống.`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000423
    terms: []
    pronouns_and_address: "Dùng `con người` và đại từ bao gộp nhân loại `mỗi chúng ta` (đồng bộ `b07-human-we`)."
    pov_and_voice: "Độc thoại nội tâm giả giọng nhân văn tươi sáng để làm bàn đạp cho lập luận vị kỷ ở đoạn sau."
    modality_and_logic: "Bảo toàn cả ba câu: ngay cả người muốn tự sát cũng không sinh ra với nỗi tuyệt vọng mãnh liệt đến mức muốn tự hủy diệt; nếu tin vào tương lai thì con người đều có tiềm năng xây dựng ngày mai tươi sáng, thanh bình; và mỗi con người đều là duy nhất không thể thay thế."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000424
    terms:
      - "quỷ dữ"
      - "Chúa"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng nhất quán `mình` (`DEC-P01-001`)."
    pov_and_voice: "Độc thoại nội tâm bộc lộ bản chất vị kỷ tuyệt đối và ý chí sinh tồn mãnh liệt của Tanya."
    modality_and_logic: "Bảo toàn sự thu hẹp từ nhân loại chung về bản thân Tanya (`không biết người khác ra sao, nhưng với mình, chẳng có ai thay thế được`), sự nâng cấp tình thái từ `muốn sống sót` lên khẳng định nhấn mạnh `*nhất định* sẽ sống sót`, và quyết tâm sẵn sàng ca tụng cả quỷ dữ như Chúa trong vài phút ấy để dốc toàn lực chạy thoát."
    emphasis: "Bảo toàn chính xác 1 cụm `*...*` tương ứng thẻ `<html:em>` (`*nhất định*`) theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000425
    terms:
      - "tù binh"
    pronouns_and_address: "Độc thoại nội tâm dùng `mình` cho cá nhân Tanya (`DEC-P01-001`), `chúng ta` cho đơn vị và lược đại từ ngôi thứ hai phiếm chỉ ở câu 2 (`direct-address choice`)."
    pov_and_voice: "Độc thoại nội tâm vạch rõ giới hạn giữa lời hứa hỗ trợ đồng đội và nguyên tắc tự bảo toàn mạng sống."
    modality_and_logic: "Bảo toàn sự đối lập giữa việc để mắt hỗ trợ lẫn nhau khi rút lui và quyết định dứt khoát không dừng lại của Tanya, vì tụt lại phía sau đồng nghĩa với bị bắt làm tù binh nếu may mắn hoặc chết trận nếu không may."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000426
    terms: []
    pronouns_and_address: "Lời thoại của thuộc cấp nhận xét về thái độ thận trọng của Tanya (hiện dùng `cô`, có thể tinh chỉnh theo finding `m4`)."
    pov_and_voice: "Giọng thuộc cấp bình thản, tán thưởng sự căng thẳng vừa phải trước trận đánh."
    modality_and_logic: "Bảo toàn nhận xét rằng mức độ lo lắng/căng thẳng như vậy là đúng mực."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000427
    terms:
      - "cấp dưới"
      - "đám nghiện chiến tranh"
    pronouns_and_address: "Độc thoại nội tâm của Tanya dùng `mình` (`DEC-P01-001`) và quy chiếu cấp dưới bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm ngán ngẩm, tự chất vấn quyết định tuyển quân của chính mình."
    modality_and_logic: "Bảo toàn sự lệch pha nhận thức: Tanya nêu mối lo thực sự về sinh mạng nhưng cấp dưới lại coi đó là “lo lắng đúng mức”, khiến Tanya tự hỏi phải chăng mình đã sai lầm khi gom toàn đám nghiện chiến tranh vào đơn vị."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000428
    terms:
      - "sĩ quan cấp úy Serebryakov"
    pronouns_and_address: "Độc thoại/tự sự ngôi thứ nhất của Tanya dùng `Mình` / `mình` (`DEC-P01-001`)."
    pov_and_voice: "Độc thoại nội tâm tìm kiếm một tiếng nói tỉnh táo giữa đám thuộc cấp hiếu chiến."
    modality_and_logic: "Bảo toàn chuỗi hành động: muốn giữ khoảng cách một chút, tìm kiếm một ý kiến bình thường, và bắt gặp Serebryakov đang giơ tay phát biểu khi đảo mắt nhìn quanh."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000429
    terms:
      - "Thiếu tá"
      - "tân binh"
    pronouns_and_address: "Serebryakov gọi Tanya bằng quân hàm `Thiếu tá` và dùng đại từ gộp `chúng ta` cho đơn vị."
    pov_and_voice: "Giọng phát biểu điềm tĩnh, thực tế của Serebryakov, nối mạch trực tiếp sang đầu `ch-05-b18` (`p000430`)."
    modality_and_logic: "Bảo toàn cả hai vế trong ý kiến của Serebryakov: tán đồng rằng mấy phút cuối khi rút lui mới là lúc nguy hiểm nhất, đồng thời bổ sung rằng trên đường tiếp cận mục tiêu cũng phải hỗ trợ đám tân binh."
    emphasis: "none"
