    pov_and_voice: "Độc thoại nội tâm lật đi lật lại vấn đề theo lối tương đối hóa."
    modality_and_logic: "Bảo toàn ba nhịp phủ định – trung hòa: không tệ, nhưng cũng chẳng tốt, và có lẽ mọi chuyện không thể đơn giản phân định tốt hay xấu."
