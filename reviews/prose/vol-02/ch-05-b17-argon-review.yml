    pronouns_and_address: "Trong lời thoại mở đầu, Tanya tự xưng `Tôi`; trong phần độc thoại/tự sự ngôi thứ nhất tiếp theo, Tanya dùng `Mình` / `mình` theo đúng `DEC-P01-001`."
    pov_and_voice: "Lời thoại nêu mối lo chiến thuật nối liền với dòng tự nhủ về trách nhiệm của người chỉ huy."
    modality_and_logic: "Bảo toàn mối quan tâm hàng đầu về tốc độ và yêu cầu rút lui thật nhanh, cùng suy nghĩ tự trấn an rằng với tư cách người đứng đầu, việc cân nhắc và chuẩn bị cho mọi tình huống là đương nhiên."
