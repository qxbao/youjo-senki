findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000417
    category: lexical_repetition_nuance
    issue: >-
      Tại câu 4 của `p000417`, cụm danh từ `Với sức chiến đấu của nhóm làm nhiệm vụ trinh sát chiến đấu` lặp lại từ `chiến đấu` hai lần liên tiếp trong cùng một ngữ đoạn ngắn.
    basis: >-
      Nghĩa chiến thuật và quan hệ nhân quả trong câu hoàn toàn chính xác, không gây hiểu nhầm.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể đổi từ đầu thành `binh lực` hoặc `thực lực` để câu thanh thoát hơn (`Khi trong tay chỉ có binh lực của một nhóm làm nhiệm vụ trinh sát chiến đấu...`).
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000419
    category: lexical_nuance
    issue: >-
      Tại câu 1 của `p000419`, trạng từ nhấn mạnh nghĩa đen của hành động bay vọt đi bằng thuật thức bay (chơi chữ giữa thành ngữ phóng vọt đi và việc thực sự bay lên không trung) đang được gộp nhẹ vào động từ `bay vút khỏi nơi này`.
    basis: >-
      Ý nghĩa cốt lõi về việc bung tín hiệu mana và dùng thuật thức bay để rút lui tốc độ cao vẫn được truyền tải rõ ràng, tự nhiên.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể bổ sung nhẹ nét nhấn mạnh nghĩa đen (`rồi dùng thuật thức bay để bay vút khỏi nơi này theo đúng nghĩa đen`).
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000425
    category: modality_and_conditional_nuance
    issue: >-
      Tại câu 2 của `p000425`, cặp điều kiện đối lập chỉ vận may (`nếu may mắn... còn nếu không...`) đang được dịch bằng phó từ `may ra` (`Tụt lại phía sau thì may ra bị bắt làm tù binh, còn không sẽ chết trận.`), trong tiếng Việt dễ nghiêng sang nghĩa ước đoán xác suất thấp hơn là điều kiện giả định về may rủi.
    basis: >-
      Người đọc vẫn hiểu rõ hai kết cục nghiệt ngã của việc tụt lại phía sau khi rút lui.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể chỉnh thành `Tụt lại phía sau thì nếu may mắn sẽ bị bắt làm tù binh, còn không may thì chết trận.` để giữ thật cân xứng hai vế điều kiện.
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000426
    category: dialogue_address_and_rank_nuance
    issue: >-
      Tại `p000426`, câu nhận xét của thuộc cấp sau khi nghe Tanya nêu mối lo về tốc độ rút lui đang dùng đại từ ngôi thứ hai `cô` (`“…Chà, xem ra cô lo lắng đúng mức đấy.”`), hơi suồng sã so với chuẩn xưng hô của cấp dưới đối với tiểu đoàn trưởng tại `p000407` (`thưa chỉ huy`) và `p000429` (`Thiếu tá`); đồng thời tại `p000428`, cách dịch trung tính không phân tiểu cấp `sĩ quan cấp úy Serebryakov` cho `Lieutenant Serebryakov` hơi thiên về diễn giải trong dòng độc thoại nội tâm của Tanya.
    basis: >-
      Tại `p000426` câu thoại không có lời dẫn định danh người nói và tại `p000428` nguyên văn không ghi rõ tiểu cấp của cấp úy, nên lựa chọn hiện tại đã tuân thủ quy tắc thận trọng của `DEC-P01-001` và đồng bộ với `ch-05-b18` (`p000440`).
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh `p000426` theo hướng lược đại từ hoặc dùng danh xưng chỉ huy (`“…Chà, xem ra chỉ huy cũng lo lắng đúng mức đấy.”` / `“…Chà, xem ra sự căng thẳng thế này là vừa phải đấy.”`), và đối chiếu cấp bậc của Serebryakov xuyên suốt Tập 2 nếu muốn rút gọn ở bước biên tập toàn tập.
    resolution: optional_polish

