- source_term: tanya_viper_radio_and_gunning_hospital_breakdown_pronouns_vol02_ch02_b19
  proposed_vi: "Trong phân cảnh mở đầu khi tiểu đoàn của Tanya nhận lệnh và lao vào tiêu diệt lực lượng Liên minh Entente trên sóng vô tuyến hỗn loạn (part0014/p000513–p000544): tuân thủ nghiêm ngặt `DEC-P01-001`, trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` kết hợp định danh tên riêng `Tanya` và quy chiếu thuộc cấp bằng `họ` (p000514); thuộc cấp đồng thanh đáp `“Rõ, thưa bà!”` (p000513, giữ biến thể tại chỗ đã được signoff chấp nhận), và Tanya khích lệ toàn đơn vị bằng `chúng ta` (p000515); trong các luồng liên lạc vô tuyến đan xen giữa quân Liên minh đang tan vỡ và quân Đế quốc đang vây diệt, phía Liên minh dùng `chúng ta` / `ta` / `quân ta` cho phe mình (p000526, p000527, p000532), `tôi` khi cầu cứu cá nhân (p000543), và `Chúng` / `chúng` / `Bọn kia` cho quân Đế quốc đang truy sát (p000519, p000521, p000525, p000527, p000534 theo bản sửa `M2` `“Không được rồi! Không cắt đuôi được chúng!”`); giữa `Viper 02` và `Pixie 01` / `Tiểu đoàn Pixie` (p000528, p000537, p000538, p000544), hai bên tự xưng `Chúng tôi` / `Tôi`, gọi nhau lịch sự ngang hàng theo đơn vị là `các anh`, và quy chiếu quân địch bằng `Chúng`. Trong phân cảnh Trung úy Gunning tỉnh dậy trong bệnh viện dã chiến và sụp đổ tinh thần khi nhớ lại cảnh đồng đội bị nghiền nát như pháo hoa trên bầu trời (part0014/p000545–p000596): trần thuật ngôi thứ ba quy chiếu Gunning nhất quán bằng `anh ta` / `Anh ta` (p000546, p000547, p000551, p000556, p000558–p000560, p000562, p000565–p000567), kết hợp đại từ phản thân `mình` (p000547, p000548, p000558, p000559, p000562, p000567) và định danh `Trung úy Gunning` (p000548 theo bản sửa `M1`); trong toàn bộ mạch độc thoại nội tâm trực tiếp được đánh dấu in nghiêng `*...*` theo `DEC-P01-002` và bản sửa `M3` / `m5` (p000545, p000549, p000553–p000555, p000557, p000559, p000560, p000565, p000567, p000570–p000572, p000575–p000578, p000588, p000592–p000596), Gunning tự quy chiếu ngôi thứ nhất bằng `mình` / `Mình`, quy chiếu những người đang gọi ngoài phòng bệnh bằng `họ` (p000553), và quy chiếu các đồng đội, cấp trên, thuộc cấp đã tử trận bằng `Đồng đội của mình`, `anh em của mình`, `Anh em của mình. Cấp trên của mình. Người của mình.` cùng đại từ trung tính `họ` ở câu kết `*Giờ họ chỉ còn là thịt.*` (p000592 theo bản sửa `M4`); trong lời thoại của nhân viên quân y tại bệnh viện (p000552, p000563, p000568) và câu hỏi đáp lại của Gunning (p000569), hai bên gọi nhau bằng `Trung úy` / `anh` / `Anh`; trong đoạn hồi ức âm thanh vô tuyến của đối phương và lời báo cáo thiệt hại (p000573, p000574, p000579–p000586, p000591), cấp dưới gọi cấp trên là `Đại úy` / `Chỉ huy`, tự xưng `Chúng tôi` / `tôi`, gọi tù binh / đối phương là `Anh` / `Anh ấy`, và vị đại úy / chỉ huy tự xưng `tôi`, gọi đám lính dưới quyền là `mấy cậu` / `các cậu` / `Các cậu`"
  alternatives_vi:
  - thưa chỉ huy / thưa Thiếu tá (thay cho `thưa bà` tại part0014/p000513 — giữ `thưa bà` như phương án biến thể tại chỗ đã được `reviews/prose/vol-02/ch-02-b19-fixes-signoff-claude.md` chấp nhận ở mục `m1`) / chúng (thay cho `họ` tại part0014/p000592 — bắt buộc giữ `họ` theo bản sửa `M4` đã ký duyệt để không thêm sắc thái miệt thị đối với những đồng đội đã hy sinh của Gunning) / họ (thay cho `chúng` tại part0014/p000534 — bắt buộc giữ `chúng` trong câu `“Không được rồi! Không cắt đuôi được chúng!”` theo bản sửa `M2` đã ký duyệt để phản ánh đúng tình huống quân Liên minh không thoát khỏi sự truy kích của quân Đế quốc)
