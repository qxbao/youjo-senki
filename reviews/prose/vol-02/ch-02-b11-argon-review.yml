- segment_id: YS-LN02/Text/part0014.xhtml/p000294
  locks:
  - "Giữ thuật ngữ giữ nguyên `Named` (theo `vol02-ch02-b10-named`), biệt danh `Ác quỷ sông Rhine` (theo `vol02-ch02-b11-devil-of-rhine`), các danh xưng `Người quan sát`, `sở chỉ huy`, các đại từ `anh ta`, `họ`, và câu kết `Named mà họ còn chẳng chắc có thật hay không đã xuất hiện.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000295
  locks:
  - "Giữ câu đã sửa theo signoff với danh từ mở đầu `Kẻ` và thuật ngữ `vùng chết` (theo `vol02-ch02-b11-death-zone`): `Kẻ ung dung bay xuyên qua vùng chết.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000296
  locks:
  - "Giữ cấu trúc điệp đầu câu `Kẻ` và cấp đơn vị `đại đội`: `Kẻ một mình tàn sát cả một đại đội.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000297
  locks:
  - "Giữ câu đã sửa theo signoff `M6` với cấu trúc điệp đầu câu `Kẻ` và thuật ngữ `những thuật thức gây nhiễu` (theo `vol02-ch02-b11-interference-formulas`): `Kẻ có thể dùng những thuật thức gây nhiễu mạnh đến mức làm biến dạng không gian.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000298
  locks:
  - "Giữ câu đã sửa theo signoff với cụm `đầu mối trong Quân đội Cộng hòa của họ` (theo `vol02-ch02-b11-republican-army-contact`), các đại từ `họ`, `anh ta`, và toàn văn `Khi đầu mối trong Quân đội Cộng hòa của họ cung cấp tin tình báo, họ đã cười nhạo, nghĩ rằng còn quá sớm để đùa ngày Cá tháng Tư, hơn nữa anh ta lại đang say rượu.`."
- segment_id: YS-LN02/Text/part0014.xhtml/p000299
  locks:
  - "Giữ các danh xưng `Đế quốc`, `phe Cộng hòa`, `Named`, đại từ quy chiếu từ góc nhìn bên ngoài của các sĩ quan phương Bắc `cô`, đại từ `họ`, và toàn văn đoạn kết thúc phân cảnh."
