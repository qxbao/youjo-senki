  - id: vol02-ch04-b14-tanya-pronouns-pov-alternation-and-emphasis
    source_term: Tanya first-person interior monologue pronouns (p000079, p000080, p000099), first-person retrospective narration pronouns (p000081, p000083, p000087, p000089, p000098), Tanya third-person narration pronouns (p000081, p000084, p000086, p000089, p000092, p000093, p000109), intra-paragraph POV shift in p000089, unit and maritime radio dialogue pronouns/vocatives (p000082, p000088, p000090, p000094–p000096, p000100–p000108, p000110), Serebryakov third-person pronoun (p000110), and emphasis spans
    proposed_vi: >-
      xác nhận toàn bộ các bản sửa M2, M3 và đề xuất của coordinator về đại từ
      trần thuật cũng như cách xưng hô trung tính đã được áp dụng đầy đủ: trong
      độc thoại nội tâm trực tiếp ở thời hiện tại của Tanya (p000079, p000080,
      p000099), tự quy chiếu số ít nhất quán bằng “mình” / “Mình” theo
      DEC-P01-001 (nối tiếp mạch cuối b13 p000076–p000078); trong các đoạn/câu
      tự thuật hồi tưởng ngôi thứ nhất giải thích bối cảnh dẫn tới tình thế hiện
      tại (p000081, p000083, p000087, câu đầu p000089, p000098), dùng “tôi” /
      “Tôi” (số ít) và “chúng tôi” (tập thể đơn vị); trong các đoạn/câu trần
      thuật ngôi thứ ba bám sát điểm nhìn Tanya (p000081, p000084, p000086, câu
       thứ hai p000089, p000092, p000093, p000109), quy chiếu Tanya nhất quán
      bằng tên riêng “Tanya” và đại từ “nó” / “Nó” theo DEC-P01-001 và
      `vol02-ch04-b14-tanya-pronoun` (tuyệt đối không dùng “cô” cho Tanya; lưu ý
      các từ “nó” tại p000079 quy chiếu tàu ngầm, và tại p000085, p000088 quy
      chiếu chiếc thuyền khả nghi), đồng thời bảo toàn chính xác sự chuyển ngôi
      từ ngôi thứ nhất (“tiểu đoàn tôi… tôi… chúng tôi”) sang ngôi thứ ba
      (“Tanya cùng tiểu đoàn của nó”) ngay trong cùng đoạn p000089 đúng như
      nguồn; tại p000110, quy chiếu Trung úy Serebryakov bằng “cô” theo đại từ
      ngôi thứ ba giống cái trong nguồn; trong giao tiếp nội bộ đơn vị (p000082,
      p000088, p000090, p000094–p000096, p000106–p000108), thuộc cấp gọi Tanya
      trung tính là “Chỉ huy” / “thưa chỉ huy” (xác nhận M2 và
      `coordinator_proposals.neutral_address`), và khi Tanya giao việc cho Trung
      úy Weiss tại p000106 dùng lặp danh xưng cấp bậc “đại đội của trung úy” mà
      không gán đại từ giới tính chưa có căn cứ trong lô (xác nhận M3); trong
      liên lạc vô tuyến kiểm tra tàu *Lytol* (p000100–p000105), phía Tiểu đoàn
      203 tự xưng “Chúng tôi” (tập thể) / “Tôi” (người phát ngôn trên sóng khi
      nhắc lại lệnh) và gọi phía tàu *Lytol* trung tính là “các vị”
      (p000100, p000104), còn phía *Lytol* tự xưng “Chúng tôi” / “chúng tôi”;
      bảo toàn chính xác 10 phạm vi nhấn mạnh Markdown `*...*` tại p000086,
      p000087, p000091, p000100–p000105 và p000110 theo đúng DEC-P01-002
    alternatives_vi:
