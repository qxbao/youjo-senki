  rationale: "Kế thừa đồng bộ toàn bộ các lựa chọn thuật ngữ quân sự, hải quân, cấp bậc, chức vụ và tổ chức đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b16_translation_proposals` và `handoffs/vol-02/ch-03-b16.yml` (`trung úy` cho Weiss / `thiếu úy` cho Serebryakov, `Phó chỉ huy Weiss`, `chỉ huy dự bị`, `khẩu đội Albert` / `khẩu đội Narva`, `im lặng vô tuyến`, `chim hoàng yến`, `đại tá Anson Sue`, `Quân đội Liên minh Entente` / `Hải quân Liên minh Entente`, `tín hiệu mana`, `Đội áp chế`, `pháo bờ biển`, `các chiến dịch ma pháp`, `tuyến tuần tra` và `tuyến cảnh giới` / `tuyến cảnh giới trên mặt biển`), bảo toàn trọn vẹn các bản sửa M1–M4 đã được nghiệm thu."
