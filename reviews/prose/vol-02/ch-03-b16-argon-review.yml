  proposed_vi: "Trung úy, khẩu đội Albert, khẩu đội Narva (part0018/p000215) / im lặng vô tuyến, Phó chỉ huy Weiss (part0018/p000216, p000217) / quân tiếp viện của ta, quân tiếp viện của địch (part0018/p000217, p000218) / thiếu úy Serebryakov, chỉ huy dự bị, trung úy Weiss, rút lui (part0018/p000222) / chim hoàng yến (part0018/p000224, p000225) / Tanya, thoát thân bằng đường không, Đế chế (part0018/p000226) / dù (part0018/p000231) / đại tá Anson Sue, Quân đội Liên minh Entente (part0018/p000234) / tín hiệu mana, Đội áp chế (part0018/p000236) / đại tá Sue, vùng biển, mất thế chủ động trong chiến trận (part0018/p000237, p000243) / các khẩu pháo bờ biển, quân dự bị, hậu phương (part0018/p000240) / đòn quấy nhiễu, một thành phố ở tuyến sau như Os (part0018/p000242) / các đơn vị ven biển, các tàu tuần tra (part0018/p000245) / tuyến tuần tra, một cuộc tập kích bất ngờ của pháp sư bay ra từ tàu ngầm (part0018/p000246) / đơn vị biệt kích, tàu ngầm, Hải quân Liên minh Entente, lực lượng tuần duyên, các chiến dịch ma pháp, tập trận biển sâu định kỳ, bị tước vũ khí như tàu chiến tại một quốc gia trung lập (part0018/p000247) / xuất kích, nhân viên vô tuyến, tuyến cảnh giới (part0018/p000248, p000253) / Tàu trên tuyến cảnh giới, cả tuyến cảnh giới trên mặt biển (part0018/p000252) / Pháp sư địch, các khẩu đội (part0018/p000254)"
  alternatives_vi:
  - trung úy Serebryakov (thay cho `thiếu úy Serebryakov` tại part0018/p000222 — bắt buộc giữ phân biệt `thiếu úy Serebryakov` và `trung úy Weiss` theo mục `vol02-ch03-b16-lieutenant` trong `work/run-state/pending-terms.yml` và bản sửa M1 đã nghiệm thu trong `handoffs/vol-02/ch-03-b16.yml`) / tuyến canh phòng (thay cho `tuyến cảnh giới` và `tuyến cảnh giới trên mặt biển` tại part0018/p000248, p000252 — bắt buộc giữ thống nhất một gốc `tuyến cảnh giới` theo mục `vol02-ch03-b16-picket-lines` và bản sửa M4 đã nghiệm thu, đồng thời tách biệt với `tuyến tuần tra` ở p000246) / trận địa pháo (thay cho `khẩu đội` tại part0018/p000215, p000254 — giữ `khẩu đội` theo mục `vol02-ch03-b16-battery`) / đội chế áp / đội trấn áp (thay cho `Đội áp chế` tại part0018/p000236 — giữ `Đội áp chế` theo mục `vol02-ch03-b16-suppression-squad`)
