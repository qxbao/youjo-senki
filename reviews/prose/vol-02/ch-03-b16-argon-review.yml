  proposed_vi: "Trong phân cảnh Tanya phân công nhiệm vụ cuối cùng trước khi nhảy dù cho Phó chỉ huy Weiss và Thiếu úy Serebryakov cùng phân cảnh chuyển điểm nhìn sang Đại tá Anson Sue thuộc Quân đội Liên minh Entente tại Os (part0018/p000215–p000256): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1–M4 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b16.yml`: (1) Trong trần thuật ngôi thứ ba ở nửa đầu lô (p000216, p000226, p000231), quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` (p000226) đúng chuẩn `DEC-P01-001`. (2) Trong độc thoại nội tâm của Tanya (p000221, p000225, p000228, p000232), nhất quán dùng `Mình` / `mình` cho ngôi thứ nhất số ít tự quy chiếu (p000228, p000232, đã xử lý triệt để M3 tại p000228), và dùng `chúng ta` / `ta` cho ngôi thứ nhất số nhiều chỉ tập thể đơn vị (p000221, p000225). (3) Trong lời thoại chỉ huy giữa Tanya với Weiss và Serebryakov (p000215–p000220, p000222–p000224, p000227, p000229, p000230, p000233): Tanya tự xưng `Tôi` / `tôi`, dùng `chúng ta` / `ta` cho đơn vị, và gọi cấp dưới thuần túy theo cấp bậc `Trung úy` / `trung úy` (cho Weiss tại p000215, p000222, p000229) và `thiếu úy Serebryakov` / `thiếu úy` (cho Serebryakov tại p000222, p000224), tuyệt đối không dùng đại từ giới tính theo đúng mục `vol02-ch03-b16-address-pronouns` và bản sửa M1, M2; Weiss và Serebryakov tự xưng `tôi` (p000227), dùng `chúng ta` (p000216), và đáp lời Tanya bằng cách gọi trung lập theo chức vụ `thưa chỉ huy` (p000220, p000223, p000230) theo mục `vol02-ch03-b16-maam`. (4) Trong nửa sau lô theo điểm nhìn của Đại tá Anson Sue và quân Liên minh Entente (p000234–p000256): trần thuật ngôi thứ ba quy chiếu Sue bằng `đại tá Anson Sue` / `đại tá Sue` / `Sue` kết hợp đại từ `ông` / `Ông` và phản thân `mình` (p000237, p000242–p000244, p000248, p000251); quy chiếu đơn vị của Sue, quân đội/hải quân Liên minh Entente bằng `họ` / `Họ` (p000237, p000238, p000240, p000247–p000250, p000254), và quy chiếu lực lượng pháp sư Đế quốc tấn công bằng `chúng` / `Chúng` (p000236, p000253); trong thoại của phía Entente dùng `Chúng ta` (p000236), `Tôi` (p000245, p000249), và `Anh` khi hỏi nhân viên vô tuyến tại p000250"
  alternatives_vi:
  - cô / anh (thay cho cách gọi theo cấp bậc `Trung úy` / `trung úy` và `thiếu úy` tại part0018/p000215, p000222, p000224, p000229 — bắt buộc giữ cách gọi theo cấp bậc, không dùng đại từ giới tính theo `DEC-P01-001`, mục `vol02-ch03-b16-address-pronouns` và bản sửa M2 đã nghiệm thu) / Tôi (thay cho `Mình` trong nội tâm của Tanya tại part0018/p000228 — bắt buộc giữ `Mình` và giới hạn lời khen vào `câu đùa đó của Weiss` theo `DEC-P01-001`, mục `vol02-ch03-b16-tanya-thought` và bản sửa M3 đã nghiệm thu) / thưa bà / thưa cô (thay cho `thưa chỉ huy` tại part0018/p000220, p000223, p000230 — giữ `thưa chỉ huy` theo mục `vol02-ch03-b16-maam`)
