  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, phân biệt rạch ròi giữa điểm nhìn nội tâm của Tanya ở đầu batch (`mình` cho nội tâm tự quy chiếu, `nó` cho trần thuật ngôi thứ ba ở p000082) với điểm nhìn bên ngoài của Tướng von Schreise từ p000084 trở đi (`ông` cho Schreise, `cô` cho Tanya, `ông ta` / `người này` cho Rudersdorf, và `họ` cho các sĩ quan tham mưu Hậu cần – Tác chiến), bảo đảm mạch chuyển giao hoàn hảo giữa `ch-03-b03` và `ch-03-b05`."
