  rationale: "Kế thừa đồng bộ toàn bộ các lựa chọn thuật ngữ, đơn vị, chức danh và danh xưng đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b04_translation_proposals`, `handoffs/vol-02/ch-03-b04.yml#reviewer_term_recommendations` và báo cáo phản biện `reviews/prose/vol-02/ch-03-b04-claude.md`, đồng thời liên thông chặt chẽ với `ch-03-b01` – `ch-03-b03` và `ch-03-b05` (`Quân đội Đế quốc`, `Cụm tập đoàn quân phương Bắc`, `Đại Quân`, `Liên minh Entente`, `Trung ương`, `chiến dịch tấn công mùa xuân`, `Tướng Jekof von Schreise`, `Thiếu tá von Degurechaff`, `Rudersdorf`, `Chỉ huy Ragheno`, `phía Hậu cần`, `Phía Tác chiến`, `Cục Tác chiến`)."
