- source_term: tanya_interior_monologue_and_schreise_conference_pov_pronouns_vol02_ch03_b04
  proposed_vi: "Trong phần kết mạch độc thoại nội tâm của Tanya về bài toán quản lý vật tư mùa đông và ý đồ câu giờ bằng tác chiến đường không (part0016/p000080–p000083): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `ch-03-b03` (p000067–p000077), Tanya tự quy chiếu ngôi thứ nhất số ít trong nội tâm bằng `mình` xuyên suốt (p000080–p000083), bao gồm cả cụm tự chú giải trong ngoặc đơn `Tanya (tức là mình)` ở p000082; trần thuật ngôi thứ ba gắn điểm nhìn Tanya ở câu sau của p000082 quy chiếu Tanya bằng `nó` kết hợp cụm phản thân `đơn vị mình`; quy chiếu Thiếu tướng von Rudersdorf (người dặn Tanya chuẩn bị kỹ trước cuộc đổ bộ đường không ở `ch-03-b01` p000017–p000019) bằng `ông ấy` (p000081), và dùng cấu trúc khái quát lược chủ ngữ cho câu điều kiện ở p000081. Trong phân cảnh chuyển sang điểm nhìn của Tham mưu trưởng Cụm tập đoàn quân phương Bắc – Tướng Jekof von Schreise – theo dõi cuộc tranh luận giữa Thiếu tá von Degurechaff với các sĩ quan Hậu cần và Tác chiến (part0016/p000084–p000099): trần thuật ngôi thứ ba quy chiếu Schreise bằng `ông` / `Ông` xuyên suốt (p000084–p000086, p000099) kết hợp đại từ phản thân `mình` (p000086, p000098); quy chiếu Tanya từ điểm nhìn bên ngoài của Schreise và các sĩ quan trong phòng họp bằng `cô` (p000089, p000090, đồng bộ với `vol02-ch03-b05-tanya-external-pov` ở `ch-03-b05` và `ch-03-b06`) kết hợp danh xưng `Thiếu tá von Degurechaff` / `Degurechaff` / `Tanya` (p000087, p000092); quy chiếu Rudersdorf từ góc nhìn nghi ngờ, bực bội của Schreise bằng `ông ta` (p000092) và `kẻ ...` / `người này` (p000099); quy chiếu tập thể các nhân viên Hậu cần và Tác chiến bằng `họ` / `Họ` kết hợp phản thân `mình` (p000090, p000092, p000093). Trong đối thoại tại hội nghị (p000088, p000089, p000094, p000095, p000098): sĩ quan Hậu cần tự xưng `tôi`, gọi Tanya là `Thiếu tá von Degurechaff` / `Cô` (p000088); Tanya, sĩ quan Tác chiến và Schreise đều dùng đại từ ngôi thứ nhất số nhiều bao gộp `chúng ta` / `Chúng ta` khi bàn về kế hoạch tác chiến và tình hình vật tư của quân Đế quốc (p000089, p000094, p000098)"
  alternatives_vi:
  - nó (thay cho `cô` khi quy chiếu Tanya trong trần thuật tại part0016/p000089, p000090 — bắt buộc giữ `cô` ở p000089–p000090 vì từ p000084 điểm nhìn trần thuật đã chuyển hẳn sang góc nhìn quan sát bên ngoài của Tướng von Schreise và các sĩ quan Cụm tập đoàn quân phương Bắc, đồng bộ tuyệt đối với mục `vol02-ch03-b05-tanya-external-pov` trong `work/run-state/pending-terms.yml`, trong khi `nó` chỉ dùng cho điểm nhìn của Tanya như ở p000082 theo `DEC-P01-001`) / tôi (thay cho `mình` trong độc thoại nội tâm của Tanya tại part0016/p000080–p000083 — bắt buộc giữ `mình` theo quyết định canon `DEC-P01-001` và đồng bộ với `ch-03-b03`)
  segment_ids:
