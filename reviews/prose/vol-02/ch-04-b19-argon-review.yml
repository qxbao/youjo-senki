      - Giữ sự bác bỏ gay gắt đối với khả năng tình cờ chạm trán một tiểu đoàn pháp sư không người dẫn đường ngay sau đòn tấn công của tàu ngầm: nếu không phải kế hoạch và không phải sự trùng hợp chỉ Chúa mới nghĩ ra được thì điều đó bất khả thi
