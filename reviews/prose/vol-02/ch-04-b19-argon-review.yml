    pov_and_logic:
      - Giữ bước ngoặt bác bỏ cách hiểu lạc quan: ngay sau đó chính đơn vị ấy lại đột kích vùng biển nơi tàu phụ trợ và tàu ngầm hẹn gặp, khiến việc nghi ngờ có vụ rò rỉ nghiêm trọng là điều tất yếu, thậm chí địch hành động táo bạo đến mức chẳng buồn giấu việc đang nắm được tin tình báo
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000239
