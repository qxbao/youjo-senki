      - Giữ hệ quả thể lực của việc hạn chế công suất (tạm thời tăng sức bền nhưng cuối cùng độ mệt mỏi tăng vọt khiến không thể bước vào chiến đấu) và suy đoán bỏ lửng rằng có lẽ họ hạn chế công suất vì lý do khác chứ không phải để tập kích
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000238
    names_and_ranks:
