      - mage -> pháp sư
      - anti-air fire -> hỏa lực phòng không
    pronouns_and_address:
      - Chủ ngữ khái quát "người ta" ở câu đầu
    pov_and_logic:
      - Giữ lập luận chiến thuật: thông thường sẽ có chút do dự hoặc chọn nhiều cách tiếp cận khác như triển khai thuật thức bắn loạt từ xa, vì thuật thức bắn loạt tầm cực xa của pháp sư có thể vượt qua phần lớn hỏa lực phòng không
