      - Chủ ngữ phiếm chỉ "Người ta" cho câu hỏi tu từ khái quát (theo N4)
    pov_and_logic:
      - Giữ sự đối lập giữa lý thuyết mà cả hải quân lẫn lục quân đều biết (hỏa lực phòng không ít khi bắn trúng trực tiếp) với trải nghiệm thực tế, dẫn tới câu hỏi tu từ về việc liệu người ta có lao vào một tuần dương hạm chiến đấu trang bị đầy pháo tự động chỉ vì đạn thường không trúng đích hay không
