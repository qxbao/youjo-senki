  - id: vol02-ch04-b19-briefing-pronouns-generic-subject-and-emphasis
    source_term: briefing room collective first-person plural in p000226/p000233 vs investigation team first-person plural in p000244–p000245, generic second-person subject in p000231, plural address in p000240, and DEC-P01-002 emphasis in p000227/p000249
    proposed_vi: >-
      xác nhận toàn bộ đề xuất điều phối tại `handoffs/vol-02/ch-04-b19.yml` đã
      được áp dụng nhất quán: (1) Ở phần phân tích chiến thuật chung tại
      p000226 và p000233, dùng “Chúng ta” / “chúng ta” cho phía phe mình đang
      xem xét trận đánh; ở phần báo cáo kết quả truy lùng nội bộ tại
      p000244–p000245, các sĩ quan phụ trách điều tra dùng nhất quán “Chúng tôi”
      (kết hợp “tôi” khi nêu nhận định cá nhân ở p000245), phân biệt rõ với
      người chất vấn đang gọi họ là “các vị” tại p000240 (theo N5 và N6). (2)
      Tại câu hỏi tu từ khái quát ở cuối p000231, dùng chủ ngữ phiếm chỉ trung
      tính “Người ta” (theo N4, tuân thủ DEC-P01-001 không gán giới tính hay
      quan hệ xưng hô). (3) Trong trần thuật ngôi thứ ba xuyên suốt lô, quy
      chiếu các pháp sư Đế quốc bằng “họ” (p000227–p000228, p000237, p000247)
      hoặc “Chúng” / “chúng” trong lời nhận xét trực tiếp và đoạn mô tả góc nhìn
      bị tập kích (p000230, p000233, p000238), quy chiếu lực lượng pháp sư phe
      mình và đội ngũ tình báo/điều tra bằng “họ” / “Họ”, hoàn toàn không dùng
      “nó” cho nhân vật (tuân thủ DEC-P01-001). (4) Bảo toàn chính xác hai vị
      trí nhấn mạnh `*không*` (p000227) và `*trùng hợp*` (p000249) theo đúng
      DEC-P01-002, cùng ký hiệu chú thích `¹⁷` tại p000235
    alternatives_vi:
