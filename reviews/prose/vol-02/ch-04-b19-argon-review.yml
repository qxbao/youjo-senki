    pov_and_logic:
      - Giữ mạch giằng xé nghề nghiệp của ngành tình báo: dù muốn coi sự việc lộ liễu đến mức bất thường và nghĩ rằng đã rà soát kỹ mọi tình tiết, họ vẫn không thể gạt bỏ khả năng ấy vì trong chiến tranh thông tin sự thật không bao giờ được bảo đảm, buộc phải nghi ngờ mọi khả năng kể cả giả thuyết rò rỉ
