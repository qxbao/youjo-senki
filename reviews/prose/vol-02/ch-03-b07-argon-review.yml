  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự chuyển dịch sắc thái đại từ hợp lý giữa hai nửa phân cảnh: nửa đầu dưới điểm nhìn căng thẳng, cay cú của Schreise và các sĩ quan phương Bắc (`Ông` / `ông`, `Họ` / `họ`, `cô ta` khi bực dọc và `cô` khi quan sát hành động, `con bé đưa tin kia` trong nội tâm Schreise), và nửa sau dưới điểm nhìn trọng dụng của Thiếu tướng von Rudersdorf (`ông`, `cô` / `Cô` trong trần thuật và nội tâm, cặp xưng hô chuẩn mực `Tôi` / `tôi` – `cô` / `Cô` và `tôi` – `Thưa ngài` / `ngài` trong đối thoại)."
