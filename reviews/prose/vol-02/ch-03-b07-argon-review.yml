  proposed_vi: "Trong phần cao trào cuộc họp tham mưu tại Cụm tập đoàn quân phương Bắc dưới điểm nhìn của Tướng Jekof von Schreise và các sĩ quan tham mưu (part0016/p000143–p000166) cùng phân cảnh Thiếu tá Tanya von Degurechaff xin gặp riêng Thiếu tướng von Rudersdorf dưới điểm nhìn của Rudersdorf (part0016/p000167–p000178): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `ch-03-b05` – `ch-03-b06`: (1) Ở nửa đầu (p000143–p000166), dùng chủ ngữ khái quát `người ta` cho đại từ ngôi thứ hai phiếm chỉ tại p000143; trần thuật ngôi thứ ba quy chiếu Schreise bằng đại từ trang trọng `Ông` / `ông` (p000145–p000147, p000151, p000158, p000159, p000163) kết hợp phản thân `mình` (p000159, p000163) và tên riêng `Schreise` (p000145, p000146, p000157); quy chiếu tập thể các sĩ quan tham mưu phương Bắc bằng `Họ` / `họ` (p000146, p000149, p000152, p000155, p000163, p000166); quy chiếu Tanya bằng `cô ta` / `Cô ta` trong các câu trần thuật phản ánh trực tiếp cơn bực tức và khinh miệt của Schreise (p000146, p000150–p000152, p000159), bằng `con bé đưa tin kia` trong câu độc thoại nội tâm in nghiêng của Schreise tại p000147, và bằng `cô` / `Cô` trong các câu trần thuật quan sát hành động từ bên ngoài (p000147, p000149, p000153–p000155, p000163, p000166) kết hợp danh xưng `Thiếu tá von Degurechaff` / `Degurechaff` / `vị thiếu tá` (p000145, p000152, p000154, p000164); giữ cấu trúc bị động trung tính không đại từ ngôi thứ ba `mà lại không bị xem thường` ở cuối p000146 theo bản sửa V3 và cụm chỉ vật chuẩn xác `ánh nhìn ấy` ở đầu p000149 theo bản sửa V1. Trong thoại tại phòng họp (p000145, p000148, p000151, p000154, p000156, p000160–p000162, p000165): Schreise dùng `chúng ta` khi làm người hòa giải ở p000145 (`cô ấy` khi nhắc Tanya trước phòng họp), dùng `chúng tôi` khi đại diện bộ tham mưu phương Bắc ở p000151, và gọi trực tiếp Tanya là `Thiếu tá` / `cô` ở p000151, p000160; Tanya tự xưng `Tôi` / `tôi`, dùng `binh sĩ chúng ta` ở p000154 và gọi cử tọa là `các vị` ở p000156, p000165. (2) Ở nửa sau (p000167–p000178), trần thuật ngôi thứ ba đặt dưới điểm nhìn thiện cảm và thấu hiểu của Thiếu tướng von Rudersdorf nên quy chiếu Rudersdorf bằng `ông` / `Ông` kết hợp phản thân `mình` (p000167, p000170, p000174, p000178), quy chiếu Tanya nhất quán bằng `cô` / `Cô` xuyên suốt cả trần thuật lẫn độc thoại nội tâm in nghiêng của Rudersdorf (p000167, p000168, p000173, p000174, p000178), và dùng `họ` cho hai người ở p000170. Trong đối thoại riêng giữa hai người (p000169, p000171, p000172, p000175–p000177): Rudersdorf nhất quán dùng cặp đại từ `Tôi` / `tôi` – `cô` / `Cô` kèm danh xưng `Thiếu tá` ở cả ba lượt lời p000169, p000172, p000176 theo bản sửa V2 và mục `vol02-ch03-b07-rudersdorf-address`; Tanya tự xưng `tôi` / `Tôi` kèm phản thân `mình` và thưa Rudersdorf là `Thưa ngài` / `ngài`"
  alternatives_vi:
  - ta – cô / Tôi – ngài (thay cho cặp `Tôi` / `tôi` – `cô` / `Cô` trong lời thoại của Thiếu tướng von Rudersdorf nói với Thiếu tá von Degurechaff tại part0016/p000169, p000172, p000176 — bắt buộc giữ `Tôi` / `tôi` – `cô` / `Cô` theo mục `vol02-ch03-b07-rudersdorf-address` đã sửa ở V2 và được signoff để đảm bảo đúng tôn ti quân hàm thiếu tướng – thiếu tá cũng như tính nhất quán xuyên suốt cuộc đối thoại) / không hề xem thường ông ta (thay cho cấu trúc bị động trung tính `mà lại không bị xem thường` ở câu cuối part0016/p000146 — bắt buộc giữ bản sửa V3 đã signoff để tránh gây nhầm chủ thể nam ngôi thứ ba với Schreise) / lời ấy (thay cho `ánh nhìn ấy` ở câu đầu part0016/p000149 — bắt buộc giữ `ánh nhìn ấy` theo bản sửa V1 đã signoff vì quy chiếu trực tiếp về `ánh mắt cương quyết` của Schreise ở p000147) / nó (thay cho `cô` / `cô ta` khi quy chiếu Tanya trong trần thuật — bắt buộc giữ `cô` / `cô ta` vì toàn bộ lô này đặt dưới điểm nhìn bên ngoài của Schreise và Rudersdorf, tuân thủ `DEC-P01-001` và mục `vol02-ch03-b05-tanya-external-pov`)
