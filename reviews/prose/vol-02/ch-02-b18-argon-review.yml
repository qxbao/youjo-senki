- source_term: tanya_narration_interior_monologue_and_hotel_03_radio_pronouns_vol02_ch02_b18
  proposed_vi: "Trong phân cảnh Tanya một mình bay lên đánh chặn đội hình oanh tạc cơ, quở trách báo vụ viên quên dùng hiệu gọi, trao đổi với Hotel 03 về việc điều Tiểu đoàn Viper làm đơn vị hậu vệ và thông báo tin quân tiếp viện cho tiểu đoàn mình (part0014/p000480–p000512): tuân thủ nghiêm ngặt `DEC-P01-001` và bản sửa `M3` đã ký duyệt, trần thuật ngôi thứ ba quy chiếu Tanya bằng cách lặp tên riêng `Tanya` hoặc lược chủ ngữ (p000498, p000500, p000501, p000504, p000505, p000512), bao gồm cấu trúc trung tính `Lần này Tanya may mắn hơn dự tính.` ở p000501 để không trộn lẫn đại từ ngôi thứ nhất vào câu trần thuật ngôi thứ ba; trong toàn bộ mạch độc thoại nội tâm trực tiếp (p000480, p000482, p000484–p000486, p000489, p000490, p000493, p000495, p000504, p000507, p000509, p000512) và hai câu tự nhủ thành tiếng khi bay một mình (p000481, p000483), Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` nhất quán (bao gồm cả câu suy nghĩ in nghiêng `*Sao mình không cứ thong thả chờ quân tiếp viện đến?*` ở p000512 theo `DEC-P01-002`); dùng cấu trúc khái quát hoặc chủ ngữ `người ta` / `mọi người` cho đại từ phiếm chỉ ở p000484, p000490, p000493, p000495, p000501; quy chiếu Đại đội Bốn, Tiểu đoàn Viper cùng các đơn vị rút lui và binh sĩ thuộc quyền của Tanya bằng `họ` / `Họ` (p000480, p000497, p000498, p000502, p000505, p000507, p000512), quy chiếu đám oanh tạc cơ địch bằng `chúng` (p000482, p000484, p000486), và quy chiếu viên báo vụ viên quên hiệu gọi trong nội tâm bằng `Anh` (hướng thoại nội tâm trực tiếp ở p000493) và `anh ta` (p000509). Trong liên lạc vô tuyến với báo vụ viên và sĩ quan `Hotel 03` (p000487, p000488, p000491, p000492, p000494, p000496, p000497, p000499, p000502, p000503): báo vụ viên gọi Tanya là `Thiếu tá von Degurechaff` (p000487) và tự xưng `T-tôi` khi lắp bắp xin lỗi (p000491); Tanya (`Pixie 01`) gọi báo vụ viên là `anh`, dùng `chúng ta` khi nhắc quy định chung (p000488, p000492), và chuyển sang tự xưng `Tôi` / `chúng tôi` lịch sự khi làm việc với `Hotel 03` (p000496, p000503); `Hotel 03` tự xưng `Tôi` (p000502) và dùng ngôi thứ nhất số nhiều bao gộp `Ta` khi đề xuất phương án điều động đơn vị hậu vệ (p000497). Trong liên lạc vô tuyến gửi toàn tiểu đoàn của mình (p000506, p000508, p000511): Tanya định danh `chỉ huy của mọi người`, tự xưng `tôi`, dùng `Chúng ta` / `chúng ta` khi bao gộp toàn đơn vị, và gọi tập thể tiểu đoàn bằng cụm trung tính `mọi người` / `Mọi người` (theo `vol02-ch02-b18-address-to-unit` và bản sửa `L7` đã ký duyệt)"
  alternatives_vi:
  - cô (thay cho việc lặp tên `Tanya` trong trần thuật ngôi thứ ba tại part0014/p000498, p000500, p000501, p000505 — bắt buộc tránh `cô` theo quyết định đã duyệt `DEC-P01-001` trong `canon/decisions.md` và bản sửa `M3` đã ký duyệt tại `reviews/prose/vol-02/ch-02-b18-fixes-signoff-claude.md`, giữ lặp tên `Tanya` đồng bộ với p000504 và p000512) / các anh (thay cho `mọi người` / `Mọi người` khi Tanya gọi tiểu đoàn tại part0014/p000506, p000511 — ưu tiên giữ `mọi người` / `Mọi người` theo mục `vol02-ch02-b18-address-to-unit` và bản sửa `L7` đã ký duyệt để tránh suy diễn giới tính hoặc thu hẹp thành ngôi số ít ở p000511)
