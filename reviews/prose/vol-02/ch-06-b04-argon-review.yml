    pronouns_and_address: "Câu hỏi nội tâm dùng đại từ gộp `ta`; phần trần thuật quy chiếu phía quân đoàn Đế quốc bằng `họ`."
    pov_and_voice: "Câu hỏi nội tâm căng thẳng mở đầu đoạn, tiếp nối bằng phân tích thế tiến thoái lưỡng nan."
    modality_and_logic: "Bảo toàn câu hỏi giả định ở đầu đoạn (`*Nếu ta dịch chuyển mặt trận, Cộng hòa sẽ phản ứng chứ?*`), hệ quả kiềm chế điều quân khi nỗi lo ấy còn đó, và mệnh đề điều kiện đối lập về nguy cơ mất khả năng chiến đấu nếu nguồn tiếp tế bị gián đoạn dù chỉ vài ngày."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu hỏi nội tâm đầu đoạn tương ứng thẻ `<html:em>`, giữ hai câu trần thuật sau ở dạng chữ thường."

