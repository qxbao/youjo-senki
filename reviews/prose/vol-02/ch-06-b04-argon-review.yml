  - segment_id: YS-LN02/Text/part0030.xhtml/p000107
    terms: []
    pronouns_and_address: "Quy chiếu bộ tham mưu / những người lập kế hoạch bằng `họ`."
    pov_and_voice: "Giọng trần thuật làm rõ mối quan tâm duy nhất của vị tư lệnh."
    modality_and_logic: "Bảo toàn mệnh đề nghi vấn gián tiếp (`có dùng được hay không`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000108
    terms: []
    pronouns_and_address: "Quy chiếu vị tư lệnh quân đoàn bằng `Ông ta`."
    pov_and_voice: "Giọng trần thuật phản ánh tâm thế sẵn sàng chấp nhận biện pháp quyết liệt của vị tư lệnh."
    modality_and_logic: "Bảo toàn đủ 3 câu: tình hình rất tệ; một kế hoạch nửa vời sẽ chẳng ích gì; và điều kiện duy nhất để ông ta chấp nhận bất cứ phương án nào là nó giải quyết dứt điểm vấn đề chỉ trong một lần."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000109
    terms: []
    pronouns_and_address: "Quy chiếu vị tư lệnh quân đoàn bằng `ông ta`."
    pov_and_voice: "Nhịp câu chùng xuống với dấu ba chấm mở đầu thể hiện sự dè dặt."
    modality_and_logic: "Bảo toàn dấu `…` đầu câu và nhận định dự cảm rằng nghe giọng điệu báo cáo kia thì ông ta chẳng thể kỳ vọng nhiều."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000110
    terms: []
    pronouns_and_address: "Câu trả lời của viên sĩ quan tham mưu lược chủ ngữ."
    pov_and_voice: "Giọng báo cáo vừa khẳng định hiệu quả kỹ thuật vừa ngập ngừng trước sức nặng của quyết định."
    modality_and_logic: "Bảo toàn sự tương phản giữa vế khẳng định chắc chắn (`chắc chắn sẽ đạt được một số kết quả`) và vế ngập ngừng có từ cảm thán chen giữa (`Nhưng sẽ cần đưa ra một quyết định, ừm, rất quan trọng…`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000111
    terms: []
    pronouns_and_address: "Quy chiếu vị tư lệnh quân đoàn bằng `ông ta` kết hợp phản thân `mình`."
    pov_and_voice: "Câu mệnh lệnh nội tâm sốt ruột đặt cạnh hành động tự kiềm chế bên ngoài."
    modality_and_logic: "Bảo toàn ý tự kìm mình để không quát thành tiếng câu thúc giục."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh cụm độc thoại nội tâm `*Nói thẳng ra đi*` tương ứng thẻ `<html:em>`, giữ phần dẫn trần thuật ngoài dấu nhấn mạnh."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000112
    terms: []
    pronouns_and_address: "Vị tư lệnh quân đoàn dùng đại từ gộp `Chúng ta` ở câu đầu và tự xưng `tôi` ở câu mệnh lệnh thứ hai."
    pov_and_voice: "Giọng chỉ huy nghiêm khắc, hối thúc cấp dưới báo cáo thẳng."
    modality_and_logic: "Bảo toàn câu phủ định về thời gian và câu mệnh lệnh yêu cầu nói rõ kế hoạch là gì."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000113
    terms:
      - "ủy ban nghiên cứu chiến lược"
      - "Học viện Quân sự"
      - "đơn vị địch"
      - "pháp sư"
      - "tuyến phòng thủ"
    pronouns_and_address: "Viên sĩ quan tham mưu thưa `Vâng, thưa ngài`."
    pov_and_voice: "Giọng thuyết trình tham mưu súc tích."
    modality_and_logic: "Bảo toàn đầy đủ nguồn gốc kế hoạch (do ủy ban nghiên cứu chiến lược của Học viện Quân sự đệ trình) và mục tiêu tác chiến (tiêu diệt trong thời gian cực ngắn các đơn vị địch, kể cả pháp sư, đang dựng tuyến phòng thủ trong đô thị)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000114
    terms:
      - "vị tư lệnh quân đoàn"
      - "ủy ban nghiên cứu chiến lược"
      - "Học viện Quân sự"
      - "pháp sư"
    pronouns_and_address: "Quy chiếu ủy ban nghiên cứu chiến lược bằng `họ` ở câu hai, và quy chiếu phía quân đoàn bằng `họ` ở câu ba."
    pov_and_voice: "Giọng trần thuật bám sát quá trình đánh giá của vị tư lệnh quân đoàn vốn đang hoài nghi."
    modality_and_logic: "Bảo toàn chuỗi suy luận 3 câu: nghe qua có vẻ hiệu quả -> nếu ủy ban nghiên cứu chiến lược của Học viện Quân sự đệ trình thì hẳn họ đã công nhận tính khả thi -> nếu thực sự dùng nó để nhanh chóng loại bỏ pháp sư và các hệ thống phòng thủ trong đô thị thì kế hoạch sẽ vô giá trong tình cảnh hiện tại."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000115
    terms:
      - "quân đội"
    pronouns_and_address: "Quy chiếu kế hoạch bằng `nó`."
    pov_and_voice: "Giọng ngạc nhiên xen lẫn thắc mắc hợp lý của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn dấu `…` mở đầu, câu hỏi đuôi xác nhận tính đột phá (`phải không?`) và câu hỏi vì sao kế hoạch không được phổ biến rộng rãi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000116
    terms: []
    pronouns_and_address: "Câu hỏi nội tâm ngắn gọn lược đại từ."
    pov_and_voice: "Giọng tự vấn trực diện trong suy nghĩ của vị tư lệnh."
    modality_and_logic: "Bảo toàn câu hỏi điều kiện (`*Nếu hữu dụng đến thế thì sao không chia sẻ?*`)."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000117
    terms:
      - "Công ước Worms"
      - "tham mưu trưởng"
      - "hiệp ước quốc tế"
    pronouns_and_address: "Quy chiếu kế hoạch bằng `Nó` trong câu hỏi của tham mưu trưởng."
    pov_and_voice: "Câu hỏi trực tiếp của tham mưu trưởng nối kết với lời dẫn giải thích mối lo pháp lý quốc tế."
    modality_and_logic: "Bảo toàn câu hỏi nghi vấn về việc vi phạm Công ước Worms và sắc thái suy đoán (`Có lẽ cũng đang nghĩ đến điều tương tự`) khi tham mưu trưởng nêu lên mối lo về một hiệp ước quốc tế."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000118
    terms:
      - "khí độc"
      - "pháo hạng nặng"
      - "Bộ Tổng tham mưu"
    pronouns_and_address: "Quy chiếu các chỉ huy tại cuộc họp bằng `Họ`."
    pov_and_voice: "Giọng trần thuật phân tích các giả định thông thường về vũ khí công thành."
    modality_and_logic: "Bảo toàn đủ 3 câu: họ hình dung sẽ khó chiếm nhanh thành phố và dập tắt kháng cự nếu không dùng khí độc hoặc pháo hạng nặng; dĩ nhiên không được phép dùng khí độc trong thành phố; và ngay cả Bộ Tổng tham mưu có lẽ cũng chẳng có kế hoạch phòng thủ trước khí độc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000119
    terms:
      - "chuyên gia pháp lý"
      - "hiệp ước hiện hành"
    pronouns_and_address: "Quy chiếu kế hoạch bằng `nó`."
    pov_and_voice: "Giọng báo cáo trấn an về mặt pháp lý của viên sĩ quan tham mưu."
    modality_and_logic: "Bảo toàn lời phủ định mở đầu (`Không`) và thông tin dẫn nguồn từ các chuyên gia pháp lý rằng kế hoạch không xung đột với bất kỳ hiệp ước hiện hành nào."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000120
    terms: []
    pronouns_and_address: "Lời thoại ngắn không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng truy vấn dứt khoát của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn nhận định (`Càng tốt.`) và câu hỏi trực diện (`Vậy vấn đề là gì?`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000121
    terms: []
    pronouns_and_address: "Độc thoại nội tâm dùng đại từ ngôi thứ nhất số nhiều `chúng ta`."
    pov_and_voice: "Giọng độc thoại nội tâm thúc bách của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn hai câu nội tâm: nếu hợp pháp thì chẳng có lý do gì phải chần chừ, và thực sự họ không thể phí thêm dù chỉ một giây."
    emphasis: "Bảo toàn dấu nhấn mạnh `*...*` bao quanh toàn bộ đoạn tương ứng thẻ `<html:em>` theo `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0030.xhtml/p000122
    terms:
      - "chuyên gia pháp lý"
      - "Vị tư lệnh quân đoàn"
      - "viên tham mưu"
    pronouns_and_address: "Quy chiếu phía bộ chỉ huy quân đoàn bằng `Họ`."
    pov_and_voice: "Giọng trần thuật miêu tả cử chỉ mất kiên nhẫn của vị tư lệnh quân đoàn."
    modality_and_logic: "Bảo toàn hai câu: không có thời gian tranh luận với các chuyên gia pháp lý; vị tư lệnh quân đoàn bực tức đập bàn và dùng ánh mắt thúc giục viên tham mưu đang do dự tiếp tục nói."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000123
    terms:
      - "người không tham chiến"
      - "lực lượng địch"
    pronouns_and_address: "Câu báo cáo khách quan không dùng đại từ nhân xưng."
    pov_and_voice: "Giọng trình bày tiền đề lý thuyết lạnh lùng của viên tham mưu."
    modality_and_logic: "Bảo toàn chính xác giả định cốt lõi của kế hoạch: xét từ góc độ thuần túy quân sự, trong thành phố không có người không tham chiến mà chỉ có lực lượng địch."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000124
    terms: []
    pronouns_and_address: "Dùng đại từ gộp `ta` trong câu hỏi của vị tư lệnh quân đoàn."
    pov_and_voice: "Giọng phản ứng gay gắt trước một giả định phi thực tế."
    modality_and_logic: "Bảo toàn hai câu hỏi liên tiếp chất vấn ý nghĩa của câu nói và làm sao có thể dùng một kế hoạch dựa trên giả định khó tin đến vậy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000125
    terms:
      - "lính địch"
    pronouns_and_address: "Quy chiếu vị tư lệnh quân đoàn bằng `Ông ta`."
    pov_and_voice: "Giọng trần thuật kết hợp nhận định lẽ thường hiển nhiên."
    modality_and_logic: "Bảo toàn mức độ tự kìm nén (`Ông ta suýt hét lên rằng thật ngu xuẩn`) và câu phủ định tuyệt đối (`Chẳng có thành phố nào chỉ toàn lính địch sinh sống`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000126
    terms:
      - "thường dân"
      - "dân quân"
      - "Arene"
    pronouns_and_address: "Quy chiếu quân đội Đế quốc bằng `họ`."
    pov_and_voice: "Giọng trần thuật nêu thực tế nhân khẩu đô thị và dữ kiện đã xác nhận tại Arene."
    modality_and_logic: "Bảo toàn đủ 3 câu: cư dân thành phố phần lớn là thường dân; cùng lắm chỉ có dân quân lẫn trong đó; và khi chiếm Arene họ đã xác nhận có rất nhiều thường dân sinh sống tại đấy."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000127
    terms:
      - "thủ tục hợp pháp"
    pronouns_and_address: "Viên tham mưu dùng đại từ gộp `ta`."
    pov_and_voice: "Giọng giải thích bình thản nhưng rợn người về việc dùng thủ tục pháp lý để hợp thức hóa điều kiện tác chiến."
    modality_and_logic: "Bảo toàn từ mở đầu (`À`) và phương thức tạo ra điều kiện giả định bằng cách tuân theo một thủ tục hợp pháp."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000128
    terms: []
    pronouns_and_address: "Quy chiếu hai người đối thoại bằng `Cả người trả lời lẫn người đặt câu hỏi`."
    pov_and_voice: "Giọng trần thuật khắc họa bầu không khí căng thẳng bị nén chặt dưới vẻ ngoài vô cảm."
    modality_and_logic: "Bảo toàn mục đích của việc cả hai đều nói bằng giọng đều đều là để che giấu cảm xúc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000129
    terms:
      - "chuyên gia pháp lý"
      - "người không tham chiến"
    pronouns_and_address: "Viên tham mưu dùng đại từ gộp `ta`."
    pov_and_voice: "Giọng nói thẳng bản chất lừa dối pháp lý của phương án."
    modality_and_logic: "Bảo toàn đầy đủ 2 câu và đúng đối tượng bị loại trừ ở cuối câu: thừa nhận ngắn gọn đó là một kiểu lừa dối; theo các chuyên gia pháp lý, kế hoạch chỉ hợp lệ khi đã loại trừ sự hiện diện của người không tham chiến, nên họ chỉ cần đảm bảo không còn người không tham chiến."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000130
    terms: []
    pronouns_and_address: "Câu hỏi xác nhận dùng đại từ gộp `ta`."
    pov_and_voice: "Giọng hỏi trầm đục khi lột trần hệ quả thực tế của thủ thuật pháp lý."
    modality_and_logic: "Bảo toàn dấu `…` mở đầu và câu hỏi suy luận trực diện: vậy là cứ giết hết mọi người bất kể giới tính hay tuổi tác?"
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0030.xhtml/p000131
    terms:
      - "chiến đấu trong đô thị"
      - "trận chiến đô thị"
      - "tính hợp pháp trên thực tế"
    pronouns_and_address: "Quy chiếu các sĩ quan trong phòng họp bằng `mọi người` / `Ai` / `họ`."
    pov_and_voice: "Giọng trần thuật khép lại lô với nhận thức chung lạnh người của toàn bộ phòng họp."
    modality_and_logic: "Bảo toàn đủ 4 câu: điều đó rõ rành rành; hình ảnh chiến đấu trong đô thị hiện lên trong đầu mọi người; thực chất là một cuộc thảm sát đẫm máu đội lốt trận chiến đô thị; và ai cũng hiểu nếu bị yêu cầu nghiêm túc tiến hành cuộc chiến bẩn thỉu này thì họ chẳng thể bận tâm đến tính hợp pháp trên thực tế."
    emphasis: "none"
