  - segment_id: YS-LN02/Text/part0030.xhtml/p000097
    terms:
      - "Feldgendarmerie"
      - "quân cảnh"
    pronouns_and_address: "Quy chiếu vị tư lệnh quân đoàn bằng `Ông ta`; câu rủa thầm lược đại từ chủ ngữ để giữ giọng quát tháo tự nhiên; quy chiếu các sĩ quan hiện diện bằng `ai` / `tất cả`."
    pov_and_voice: "Đan xen giữa trần thuật ngôi thứ ba, câu rủa thầm gay gắt trong nội tâm và hành động bất mãn tập thể."
    modality_and_logic: "Bảo toàn đủ 3 câu: sự bất mãn trước thái độ lười biếng của đám Feldgendarmerie thuộc quân cảnh; câu rủa thầm đuổi về quê ngủ trưa; và mệnh đề nhượng bộ (`Dù chẳng ai nói thành lời, tất cả đều rên rỉ rồi nhổ xuống đất`)."
    emphasis: "Bảo toàn chính xác phạm vi nhấn mạnh từng phần theo `DEC-P01-002`: chỉ bọc dấu `*...*` quanh câu độc thoại nội tâm ở giữa đoạn (`*Nếu có thói quen ngủ trưa thì xéo về quê mà ngủ.*`) tương ứng thẻ `<html:em>`, giữ nguyên hai câu trần thuật ở dạng chữ thường."

