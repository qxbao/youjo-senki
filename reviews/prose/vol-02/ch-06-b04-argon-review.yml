    modality_and_logic: "Bảo toàn chuỗi 3 câu: yêu cầu bắt buộc phải loại bỏ mối đe dọa ở Arene -> nhận xét nói thì dễ -> lý do thực tế là việc nhanh chóng tiêu diệt quân nổi dậy sẽ vô cùng khó khăn khi pháp sư Cộng hòa đã hội quân với chúng."
