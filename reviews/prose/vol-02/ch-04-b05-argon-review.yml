- source_term: tanya_pronouns_serebryakov_address_and_emphasis_vol02_ch04_b05
  proposed_vi: "Xuyên suốt phân cảnh Tanya nghe lệnh tác chiến tìm diệt cho Tiểu đoàn 203, chỉ thị Thiếu úy Serebryakov nối máy với Norden Control và Hạm đội Biển Bắc (part0022/p000096–p000113), tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1, M2, M3 đã được nghiệm thu trong `handoffs/vol-02/ch-04-b05.yml`: (1) Trong độc thoại nội tâm và câu trần thuật ngôi thứ nhất nội tâm của Tanya (p000096 ba câu đầu, p000098, p000099 mệnh đề bổ ngữ `rằng mình sẽ phải bay...`, p000100 câu hai, p000102–p000105, p000109 vế chữ nghiêng đầu câu, p000113): tự quy chiếu nhất quán bằng `mình` / `Mình` (số ít) và `bọn mình` (số nhiều chỉ đơn vị/cuộc trao đổi tại p000098, p000102, p000113); đặc biệt tại `p000102` giữ chuẩn bản sửa M2 (`Cô đưa bản đồ và ống nghe cho mình... Bọn mình chỉ trao đổi đôi ba câu, rồi nhân viên điện đài nối máy cho mình... không chuyển việc cho mình...`), tuyệt đối không pha lẫn `tôi` / `chúng tôi` trong nội tâm. (2) Trong câu trần thuật ngôi thứ ba theo điểm nhìn của Tanya (p000096 câu cuối, p000097 câu hai, p000099, p000100 câu cuối, p000109, p000111, p000112): quy chiếu Tanya bằng tên riêng `Tanya` (p000096, p000099, p000100, p000109, p000111) và đại từ `nó` / `Nó` (p000096, p000097, p000099, p000109, p000111, p000112 — bao gồm cụm `Đáp lại yêu cầu của nó` ở p000097 đã sửa theo M1); quy chiếu nhân viên điện đài ở p000097 là `anh ta` và quy chiếu Thiếu úy Serebryakov ở đầu câu p000102 là `Cô` để tránh mọi nhập nhằng chủ thể với Tanya. (3) Trong lời thoại trực tiếp (p000097, p000100, p000101, p000107, p000108): khi ra lệnh cho Serebryakov, Tanya gọi cấp bậc `Thiếu úy` và tự xưng `tôi` (p000100, p000107); khi đáp lời Tanya, Serebryakov dùng `Vâng, thưa thiếu tá. Tôi làm ngay.` (p000101) và `Tôi sẽ hỏi ngay ạ!` (p000108). (4) Biểu diễn nhấn mạnh theo `DEC-P01-002`: chỉ dùng `*...*` tại đúng từ `*quá*` trong `p000103` và mệnh đề nội tâm `*Cỗ máy quân sự bắt đầu vận hành, còn mình là một bánh răng trong đó*` trong `p000109` tương ứng thẻ `<em>` trong nguồn, không tự thêm chữ nghiêng ở bất kỳ đoạn nào khác."
  alternatives_vi:
  - thưa chỉ huy (thay cho `thưa thiếu tá` tại part0022/p000101 — giữ `thưa thiếu tá` trong bản dịch đã được nghiệm thu tại `reviews/prose/vol-02/ch-04-b05-fixes-signoff-claude.md`, ghi nhận `thưa chỉ huy` ở mục `vol02-ch04-b05-maam-address` là phương án trung tính thay thế) / hạm đội phe ta (thay cho `hạm đội phe mình` tại part0022/p000109 — giữ `hạm đội phe mình` tự nhiên trong câu trần thuật gắn với điểm nhìn của Tanya)
