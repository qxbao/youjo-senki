  proposed_vi: "nước Cộng hòa (part0012/p000036) / chiến tranh giữa các quốc gia, chiến dịch, hậu cần, các mặt trận đang hoạt động (part0012/p000038) / về tác chiến, vùng hậu phương phía bắc, Zettour, kế hoạch tấn công (part0012/p000039, p000043, p000047, p000054) / Osfjord, vịnh hẹp, pháo bờ biển (part0012/p000040, p000041) / Thành phố Os, Os, đầu mối đường sắt chính, Liên minh Entente, đường ray, tiếp tế (part0012/p000042, p000044, p000045) / trung tâm giao thông, các tuyến tiếp tế, Rudersdorf (part0012/p000043, p000047, p000050) / lực lượng tiền tuyến, Bộ chỉ huy phương Bắc, cuộc tấn công chính diện (part0012/p000045) / đơn vị, Norden (part0012/p000046, p000055) / cấp tác chiến, trận đánh quy mô lớn, sĩ quan Bộ Tổng tham mưu (part0012/p000047) / đơn vị pháp sư (part0012/p000049, p000051) / đơn vị 203, Dacia, Tiểu đoàn, chỉ huy đơn vị 203 (part0012/p000052–p000056) / đơn vị chiến đấu, chiến tranh cơ động, nhà máy vũ khí, đơn vị tăng cường, khí tài tối tân, Xưởng Vũ khí Kỹ thuật, Trung tá von Lergen, Đế quốc (part0012/p000054)"
  alternatives_vi:
  - Xưởng kỹ thuật hoặc Kho Vũ khí Kỹ thuật (thay cho `Xưởng Vũ khí Kỹ thuật` tại part0012/p000054 — bác bỏ theo M1 đã sửa và signoff trong `handoffs/vol-02/ch-01-b16.yml`; ưu tiên giữ `Xưởng Vũ khí Kỹ thuật` để đồng bộ tuyệt đối với mục `b02-technical-arsenal` của Tập 1 và phản ánh chính xác cơ quan chế tạo, trang bị khí tài tối tân) / Vịnh Os (thay cho `Osfjord` tại part0012/p000040, p000041 — bác bỏ vì làm xóa nhòa ranh giới giữa vịnh hẹp `Osfjord` nơi bố trí pháo bờ biển ở p000041 và `Thành phố Os` / `Os` là đầu mối đường sắt ở p000042, p000044)
