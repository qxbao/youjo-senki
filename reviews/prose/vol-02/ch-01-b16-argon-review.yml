  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, cơ quan, đơn vị, quốc gia, địa danh và thuật ngữ quân sự đã khóa tạm từ Tập 1 cùng B01–B15 của Tập 2 (`Zettour`, `Rudersdorf`, `Trung tá von Lergen`, `Đế quốc`, `nước Cộng hòa`, `Liên minh Entente`, `Norden`, `Dacia`, `Bộ Tổng tham mưu`, `sĩ quan Bộ Tổng tham mưu`, `Bộ chỉ huy phương Bắc`, `Xưởng Vũ khí Kỹ thuật`, `đơn vị pháp sư`, `đơn vị 203`, `Tiểu đoàn`, `đơn vị tăng cường`, `chiến tranh cơ động`, `hậu cần`, `tiền tuyến`, `hậu phương`), đồng thời khóa tạm cụm địa danh mục tiêu tác chiến và thuật ngữ học thuyết trong B16 (`Osfjord`, `Thành phố Os`, `Os`, `pháo bờ biển`, `đầu mối đường sắt chính`, `chiến tranh giữa các quốc gia`, `về tác chiến`, `cấp tác chiến`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: zettour_rudersdorf_toast_and_commander_203_pronouns_vol02_ch01_b16
  proposed_vi: "Trong phần kết cuộc thảo luận chiến lược và nâng ly tại nhà ăn Bộ Tổng tham mưu (part0012/p000036–p000064): tiếp nối B14–B15, trần thuật ngôi thứ ba quy chiếu Zettour, Rudersdorf và Trung tá von Lergen bằng tên riêng cùng đại từ `ông` / `Ông` (part0012/p000039, p000043, p000047, p000050, p000054, p000056) và đại từ phản thân `mình` ở mệnh đề phụ thuộc (p000050); khi quy chiếu chung hai vị tướng dùng `cả hai` / `họ` / `mình` (p000038, p000043, p000061, p000064); khi quy chiếu chỉ huy đơn vị 203 (Tanya) qua điểm nhìn gián tiếp của Rudersdorf ở p000056 dùng `chỉ huy đơn vị 203` và đại từ ngôi thứ ba `cô`. Trong đối thoại trực tiếp giữa Rudersdorf và Zettour (p000036, p000037, p000040–p000042, p000044, p000046–p000049, p000051–p000053, p000055, p000057, p000058, p000060, p000062, p000063): cả hai xưng `tôi` xuyên suốt ở ngôi thứ nhất số ít, gọi nhau ngang hàng bằng `ông` (đặc biệt giữ câu hỏi xác nhận mức độ sẵn lòng `Ông chịu được chứ?` ở p000053 theo M2 đã sửa và signoff), đồng thời dùng `ta` / `quân mình` / `chúng ta` khi bao hàm chung phía Đế quốc hoặc hai người (p000040, p000042, p000044, p000055, p000058)"
  alternatives_vi:
  - nó (thay cho `cô` khi quy chiếu `chỉ huy đơn vị 203` tại part0012/p000056 — ưu tiên giữ `cô` ở p000056 vì đây là đoạn trần thuật bám điểm nhìn của Tướng Rudersdorf đang đánh giá khách quan một sĩ quan chỉ huy tiểu đoàn cấp dưới chưa nêu tên theo đúng giới tính ngữ pháp của nguồn, phù hợp với giới hạn phạm vi tại `DEC-P01-001`)
