  volume: vol-02
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các lựa chọn đã sửa, signoff trong `handoffs/vol-02/ch-01-b16.yml`, giữ nhất quán cặp đại từ đối thoại ngang hàng `tôi` – `ông`, đại từ gộp `ta` / `chúng ta`, đại từ trần thuật `ông` cho các sĩ quan cao cấp và đại từ `cô` khi nhìn nhận nữ chỉ huy đơn vị 203 từ góc nhìn của Tướng Rudersdorf."
