    pronouns_and_address:
      - "Sĩ quan hải quân phát biểu dùng `chúng ta`."
    pov_and_voice: "Lời thoại ngập ngừng của phía hải quân trong buổi tổng kết."
    modality_and_logic: "Giữ cấu trúc phủ định rào đón bỏ lửng (`Không phải chúng ta xem nhẹ việc phòng không, nhưng…`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa đại từ `chúng ta`, `phòng không` và cấu trúc rào đón `Không phải ..., nhưng…`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000533
    terms:
      - "các tàu khác (other ships)"
    pronouns_and_address:
      - "Sĩ quan hải quân dùng `chúng ta`."
    pov_and_voice: "Lời thoại của sĩ quan hải quân nêu điều kiện cân nhắc dựa trên nhiệm vụ đối phó tàu chiến."
    modality_and_logic: "Giữ câu điều kiện gắn với việc phát sinh trở ngại khi giao chiến với tàu khác (`Nếu nảy sinh vấn đề khi đối phó với các tàu khác thì chúng ta sẽ phải xem xét`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa điều kiện `Nếu nảy sinh vấn đề khi đối phó với các tàu khác` và đại từ `chúng ta`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000534
    terms:
      - "sĩ quan (officers)"
      - "hải quân (the navy)"
      - "nhiệm vụ chống hạm ban đầu (original counter-ship combat mission)"
    pronouns_and_address:
      - "Dùng đại từ phản thân `mình` cho `hải quân`."
    pov_and_voice: "Trần thuật nhận xét tư duy ăn sâu bén rễ của các sĩ quan hải quân."
    modality_and_logic: "Khóa cụm `nhiệm vụ chống hạm ban đầu` (`vol02-ch04-b29-counter-ship-doctrine`); giữ phủ định kép đánh giá năng lực (`chẳng hề kém cỏi`) và quan hệ nguyên nhân–kết quả giải thích vì sao tàu được trang bị để đối phó tàu."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `chẳng hề kém cỏi`, `hải quân` và `nhiệm vụ chống hạm ban đầu`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000535
    terms:
      - "học thuyết chống hạm (counter-ship doctrine)"
      - "pháo phụ (secondary guns)"
      - "cận chiến (close-quarters fighting)"
      - "xuồng phóng ngư lôi (torpedo boats)"
      - "tàu khu trục (destroyers)"
    pronouns_and_address:
      - "Quy chiếu phía hải quân bằng `họ`."
    pov_and_voice: "Trần thuật giải thích lý do chiến thuật khiến hải quân muốn giữ pháo phụ."
    modality_and_logic: "Khóa bản sửa `B29-F02` (`pháo phụ`) và `học thuyết chống hạm`; giữ thế nhượng bộ rằng dù tầm quan trọng của trang bị cận chiến đã giảm, nhu cầu chống lại xuồng phóng ngư lôi và tàu khu trục lao vào tấn công vẫn là yếu tố họ không thể bỏ qua."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `học thuyết chống hạm`, `pháo phụ` (B29-F02), `cận chiến`, `xuồng phóng ngư lôi`, `tàu khu trục` và đại từ `họ`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000536
    terms:
      - "bộ phận Công nghệ (Technology / the Technology Department)"
      - "bộ chỉ huy hải quân (navy command)"
    pronouns_and_address:
      - "Người phát biểu dùng `Chúng ta`."
    pov_and_voice: "Lời kết luận hành chính khép lại chủ đề nâng cấp phòng không trong cuộc họp."
    modality_and_logic: "Khóa bản sửa `B29-F03` (`bộ phận Công nghệ` ở cả hai câu) và `bộ chỉ huy hải quân`; giữ ý chuyển giao vấn đề cho hai đầu mối này bàn bạc xử lý."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `bộ phận Công nghệ` (B29-F03), `bộ chỉ huy hải quân` và đại từ `Chúng ta`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000537
    terms:
      - "hỏa lực phòng không (the anti–air fire)"
    names_and_ranks:
      - "Tanya"
    pronouns_and_address:
      - "Trần thuật dùng tên riêng `Tanya`, phản thân `mình` và đại từ `nó` (lưu ý `xếp nó lại` ở câu 1 quy chiếu `ý tưởng`)."
    pov_and_voice: "Trần thuật đúc kết kết cục kiến nghị bị xếp lại và thái độ thực dụng của Tanya."
    modality_and_logic: "Giữ cấu trúc đối lập `không bác bỏ ý tưởng mà sẽ xem xét thêm—về cơ bản có nghĩa là xếp nó lại`, nhận định Tanya đã làm tròn bổn phận khi nêu ý kiến, và ý phủ định rằng việc tăng cường hay không tăng cường hỏa lực phòng không chẳng ảnh hưởng gì đến Tanya."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Tanya`, đại từ trần thuật `nó`, `hỏa lực phòng không` và nghĩa thực chất của việc ghi nhận để xem xét là `xếp nó lại`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000538
    terms:
      - "Đế quốc (the Empire)"
      - "quốc gia lục địa (a continental state)"
      - "quốc gia hàng hải (a maritime state)"
    pronouns_and_address:
      - "Nội tâm tự quy chiếu của Tanya dùng `mình`; đại từ `nó` ở câu 1 quy chiếu `con tàu`."
    pov_and_voice: "Độc thoại nội tâm thẳng thắn của Tanya."
    modality_and_logic: "Giữ điều kiện loại trừ (`Miễn không phải con tàu mình đang ở trên đó, nó chìm ở đâu cũng chẳng liên quan đến mình`) và đối lập địa chính trị (`Đế quốc là một quốc gia lục địa, không phải quốc gia hàng hải`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa đại từ nội tâm `mình`, `Đế quốc`, `quốc gia lục địa` và `quốc gia hàng hải`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000539
    terms:
      - "huấn luyện binh sĩ (training my troops)"
    pronouns_and_address:
      - "Câu 1 trần thuật dùng `nó`; câu 2 độc thoại nội tâm dùng `mình`."
    pov_and_voice: "Chuyển tiếp từ trần thuật ngôi thứ ba ở câu 1 sang độc thoại nội tâm ngôi thứ nhất của Tanya ở câu 2."
    modality_and_logic: "Giữ sự đối lập giữa vẻ ngoài điềm đạm giấu kín suy nghĩ thật với sự nghiêm túc tuyệt đối bên trong, cùng kết luận rằng cách tốt nhất để đảm bảo sống sót là huấn luyện binh sĩ của mình."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa sự phân tách đại từ trần thuật `nó` (câu 1) và nội tâm `mình` (câu 2) theo DEC-P01-001."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000540
    terms:
      - "buổi tổng kết (this postmortem)"
    pronouns_and_address:
      - "Trần thuật dùng `nó` / `Nó` cho Tanya."
    pov_and_voice: "Trần thuật giải thích sự hăng hái của Tanya trong buổi họp tổng kết sau diễn tập."
    modality_and_logic: "Giữ mạch lý giải rằng Tanya hăng hái vạch ra các vấn đề vì tin rằng ngăn ngừa sai lầm là cách tốt nhất."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `buổi tổng kết`, đại từ trần thuật `nó` / `Nó` và mệnh đề `ngăn ngừa sai lầm là tốt nhất`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000541
    terms:
      - "Phía tấn công (the attacking side)"
    pronouns_and_address: []
    pov_and_voice: "Lời người chủ trì cuộc họp hỏi thêm ý kiến từ phía tấn công."
    modality_and_logic: "Giữ câu hỏi mở dành cho phía tấn công."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Phía tấn công`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000542
    terms:
      - "vấn đề trong phối hợp (cooperation problems)"
    pronouns_and_address:
      - "Tanya phát biểu tự xưng `tôi`."
    pov_and_voice: "Lời phát biểu của Tanya nêu vấn đề phối hợp."
    modality_and_logic: "Giữ cách nêu ý kiến chừng mực (`Theo tôi, có vấn đề trong phối hợp`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa đại từ `tôi` và `vấn đề trong phối hợp`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000543
    terms: []
    pronouns_and_address: []
    pov_and_voice: "Câu hỏi ngắn yêu cầu làm rõ loại vấn đề."
    modality_and_logic: "Giữ câu hỏi ngắn gọn."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa câu hỏi `“Vấn đề kiểu gì?”`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000544
    terms:
      - "Thủy quân lục chiến / thủy quân lục chiến (The marines / the marines)"
      - "thủy thủ / các thủy thủ (sailors / the sailors)"
    pronouns_and_address:
      - "Tanya tự xưng `Tôi`."
    pov_and_voice: "Lời nhận xét của Tanya chỉ ra sự thiếu ăn ý giữa thủy quân lục chiến và thủy thủ."
    modality_and_logic: "Khóa thuật ngữ `thủy quân lục chiến` (`vol02-ch04-b29-marines`) và `thủy thủ`; giữ sắc thái nhận xét cảm quan lịch sự (`dường như phối hợp không ăn ý lắm`, `Tôi có cảm giác`) và hướng tác động là sự lộn xộn của các thủy thủ làm cản trở thủy quân lục chiến."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `Thủy quân lục chiến`, `thủy thủ`, đại từ `Tôi` và quan hệ nhân quả `sự lộn xộn của các thủy thủ đang cản trở thủy quân lục chiến`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000545
    terms:
      - "trên boong (the deck)"
      - "hai lực lượng (the two different corps)"
    pronouns_and_address:
      - "Trần thuật dùng `Nó` cho Tanya."
    pov_and_voice: "Trần thuật hồi tưởng quan sát của Tanya khi tiếp cận tàu."
    modality_and_logic: "Khóa bản sửa `B29-F04`: thời điểm quan sát là `lúc tiến lại gần tàu`, tình trạng trên boong tàu là `thật hỗn loạn`, và cách gọi trung tính `hai lực lượng` (không tự suy diễn thành hai quân chủng)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa đại từ `Nó`, `lúc tiến lại gần tàu`, `trên boong thật hỗn loạn` và `hai lực lượng` (B29-F04)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000546
    terms:
      - "những đơn vị cùng phục vụ trên một con tàu (units that are shipmates)"
      - "thủy quân lục chiến (the marines)"
      - "tác chiến trên bộ và đổ bộ (ground and landing battles)"
    pronouns_and_address:
      - "Câu 2 độc thoại nội tâm của Tanya dùng `mình`; quy chiếu các đơn vị / thủy quân lục chiến bằng `họ`."
    pov_and_voice: "Độc thoại nội tâm của Tanya đánh giá nguyên nhân phối hợp kém."
    modality_and_logic: "Khóa bản sửa `B29-F05`: giữ giả định trái thực tế (`Nếu họ chỉ mới được bố trí đến đó hôm nay thì phối hợp kém còn có thể hiểu được`) đối lập với thực tế họ là `những đơn vị cùng phục vụ trên một con tàu`, đồng thời dùng đại từ nội tâm `mình` ở câu 2 khi nhận xét thủy quân lục chiến dường như coi nhiệm vụ của mình chỉ gồm `tác chiến trên bộ và đổ bộ`."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa điều kiện giả định `Nếu họ chỉ mới được bố trí đến đó hôm nay`, cụm đối lập `những đơn vị cùng phục vụ trên một con tàu`, đại từ nội tâm `mình` (B29-F05), `thủy quân lục chiến` và `tác chiến trên bộ và đổ bộ`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000547
    terms:
      - "tác chiến trên tàu (fighting on board a ship)"
      - "thủy thủ (sailors)"
      - "bộ phận bán hàng (sales)"
      - "bộ phận kỹ thuật hệ thống (systems engineering)"
      - "những đợt làm việc đến chết / *làm việc đến chết* (a death march / *death march*)"
    pronouns_and_address:
      - "Độc thoại nội tâm của Tanya dùng `mình` ở câu 1, cấu trúc khái quát `đâu ai muốn` ở vế thứ hai, và `họ` cho thủy quân lục chiến."
    pov_and_voice: "Độc thoại nội tâm của Tanya liên hệ sự rạn nứt phối hợp giữa thủy thủ và thủy quân lục chiến với kinh nghiệm quản trị doanh nghiệp."
    modality_and_logic: "Khóa bản sửa `B29-F06` (`mình không thể phủ nhận`, `đâu ai muốn họ tác chiến trên tàu kém cỏi`) và `B29-F07` (`bộ phận bán hàng và bộ phận kỹ thuật hệ thống`, lặp hình ảnh `những đợt làm việc đến chết` -> `chữ *chết* trong *làm việc đến chết* mang nghĩa đen`)."
    emphasis: "Khóa chính xác hai vùng chữ nghiêng tách biệt `*chết*` và `*làm việc đến chết*` ở câu cuối theo DEC-P01-002 (B29-F07); không in nghiêng lần xuất hiện đầu ở câu 3."
    locks:
      - "Khóa đại từ `mình` (B29-F06), `bộ phận bán hàng và bộ phận kỹ thuật hệ thống`, `những đợt làm việc đến chết` và hai vùng chữ nghiêng `*chết*`, `*làm việc đến chết*` (B29-F07)."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000548
    terms:
      - "tự bảo toàn (self-preservation)"
      - "vị tha (altruistic)"
      - "số đông (the majority)"
    names_and_ranks:
      - "Tanya"
    pronouns_and_address:
      - "Câu 1 độc thoại nội tâm dùng `chính mình` và `quân ta`; câu 2–3 trần thuật dùng tên riêng `Tanya` và đại từ `nó`."
    pov_and_voice: "Chuyển từ câu kết nội tâm của Tanya ở câu 1 sang trần thuật bình luận tính hai mặt tự bảo toàn / vị tha trong lập luận của Tanya."
    modality_and_logic: "Giữ tính khả thể của rủi ro thương vong ở câu 1, sự đối lập giữa động cơ gốc là `tự bảo toàn` với hiệu quả `vị tha`, và cấu trúc phủ định kép ở cuối đoạn (`không thể nói rằng nó không hành động nhằm đem lại lợi ích cho số đông`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa phân tách đại từ nội tâm `chính mình` (câu 1) với trần thuật `Tanya` / `nó` (câu 2–3), cặp khái niệm `tự bảo toàn` – `vị tha` và phủ định kép `không thể nói rằng nó không hành động nhằm đem lại lợi ích cho số đông`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000549
    terms:
