  - id: vol02-ch04-b29-pronouns-pov-and-emphasis
    source_term: "Tanya third-person narration (`Tanya` / `nó` / reflexive `mình`), Tanya first-person interior monologue (`mình` / `chúng ta` / boundary `Tôi` at p000529), head referee and navy/marine officers third-person narration (`ông` / `họ`), postmortem dialogue pronouns (`tôi` / `chúng ta` / `chúng tôi`), and italicized emphases in p000547 and p000555"
    proposed_vi: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các bản sửa đã qua signoff (`B29-F05`, `B29-F06`, `B29-F07`): trong lời kể ngôi thứ ba về Tanya, dùng tên riêng `Tanya` (p000537, p000548, p000552, p000554, p000557) kết hợp đại từ `nó` / `Nó` và đại từ phản thân `mình` / `chính nó` (p000537, p000539, p000540, p000545, p000548, p000553, p000557; lưu ý từ `nó` tại câu 1 p000537 quy chiếu ý tưởng đề xuất và tại câu 1 p000538 quy chiếu con tàu); trong độc thoại nội tâm tự quy chiếu của Tanya, dùng nhất quán `mình` ở ngôi thứ nhất số ít (p000538, p000539, p000546, p000547, p000548; riêng câu 2 p000529 ở đầu batch tạm giữ `Tôi nghe nói` và ghi nhận phương án `Mình nghe nói` ở `alternatives_vi`), dùng cấu trúc câu khái quát `đâu ai muốn` cho `we don’t want` tại p000547 (`B29-F06`) và dùng `chúng ta` khi bao hàm Tanya cùng đơn vị được hải quân mời ăn tối tại p000556; quy chiếu Trưởng ban trọng tài bằng chức danh `Trưởng ban trọng tài` và đại từ `ông` (p000550), quy chiếu các sĩ quan hải quân, thủy thủ và thủy quân lục chiến ở ngôi thứ ba số nhiều bằng `họ` (p000535, p000546, p000547, p000550); trong lời thoại công vụ tại buổi tổng kết: các sĩ quan hải quân dùng `chúng ta` / `Chúng ta` (p000532, p000533, p000536), Trưởng ban trọng tài tự xưng `Tôi` khi hỏi phía thủy quân lục chiến (p000550), đại diện thủy quân lục chiến tự xưng `Tôi` và đại diện cho lực lượng của mình bằng `chúng tôi` (p000551), còn Tanya trong lời phát biểu chính thức tự xưng `tôi` / `Tôi` kèm `đơn vị mình` (p000542, p000544, p000552); bảo toàn chính xác hai vùng chữ nghiêng `*chết*` và `*làm việc đến chết*` tại p000547 cùng vùng chữ nghiêng `*sau khi*` tại p000555 theo `DEC-P01-002`, không tự thêm chữ nghiêng ở các đoạn khác"
