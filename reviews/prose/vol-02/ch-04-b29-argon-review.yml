      - "Khóa `hạm đội`, `chống hạm`, `pháp sư`, `trên bộ` và thông tin nghe nói trong năm nay."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000530
    terms:
      - "quả cầu tính toán / quả cầu (Computation orb / orbs)"
      - "thông số máy bay / máy bay (aircraft specs / planes)"
    pronouns_and_address: []
    pov_and_voice: "Phân tích nội tâm nối tiếp về sự tiến bộ kỹ thuật của quả cầu tính toán và máy bay."
    modality_and_logic: "Giữ quan hệ nhân quả (`Vì thế`) và sắc thái phỏng đoán dè dặt kết hợp thời điểm mới chớm (`ý nghĩ rằng có lẽ quả cầu và máy bay là mối đe dọa chỉ mới bắt đầu lan rộng`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `quả cầu tính toán`, `thông số máy bay`, tình thái `có lẽ` và mức độ `chỉ mới bắt đầu lan rộng`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000531
    terms:
      - "ngành hàng không (aviation)"
      - "Thế chiến thứ hai (the Second World War)"
      - "khoa học và công nghệ (scientific and technological advances)"
    pronouns_and_address: []
    pov_and_voice: "Độc thoại nội tâm của Tanya liên hệ tới lịch sử Thế chiến thứ hai từ ký ức kiếp trước."
    modality_and_logic: "Giữ điều kiện giới hạn duy nhất (`Chỉ những ai hiểu lịch sử phát triển vượt bậc của ngành hàng không trong Thế chiến thứ hai mới hiểu được`) và phủ định tuyệt đối trước mốc thời gian đó (`Trước đó, chẳng ai hình dung...`)."
    emphasis: "Không dùng `*...*`."
    locks:
      - "Khóa `ngành hàng không`, `Thế chiến thứ hai`, `khoa học và công nghệ` và cấu trúc `Chỉ những ai ... mới hiểu được`."

  - segment_id: YS-LN02/Text/part0024.xhtml/p000532
    terms:
