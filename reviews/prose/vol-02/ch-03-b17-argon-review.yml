  rationale: "Kế thừa đồng bộ toàn bộ các lựa chọn thuật ngữ quân sự, đơn vị, cấp bậc, địa danh và biệt danh đã khóa tạm tại `work/run-state/pending-terms.yml#chapter3_b17_translation_proposals` cùng `handoffs/vol-02/ch-03-b17.yml` (`Tiểu đoàn Pháp sư Không quân 203`, `Thiếu úy Serebryakov` / `Trung úy Weiss`, `Đại đội Một`, `khẩu đội` / `khẩu đội pháo`, `Os` / `Osfjord`, giữ riêng từng dạng `Sue` / `Đại tá Anson` / `Đại tá Sue` theo nguồn, cặp biệt danh `Bạch Ngân` / `Ngân Gỉ` gắn với chuỗi hình ảnh `bám dai như gỉ` – `hoen gỉ`, và `thuật thức`), bảo toàn trọn vẹn các bản sửa M1–M8 đã được nghiệm thu trong `reviews/prose/vol-02/ch-03-b17-fixes-signoff-claude.md`."
