- source_term: tanya_company_interception_and_colonel_sue_counterattack_pronouns_vol02_ch03_b17
  proposed_vi: "Trong phân cảnh tiểu đoàn của Đại tá Anson Sue xuất kích đánh chặn tại Osfjord và Thiếu tá Tanya von Degurechaff trực tiếp dẫn Đại đội Một vọt lên nghênh chiến (part0018/p000257–p000301): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và các bản sửa M1–M8 đã được nghiệm thu trong `handoffs/vol-02/ch-03-b17.yml`: (1) Trong phần đánh giá tình báo của Bộ Tổng tham mưu Đế quốc (p000259–p000264), quy chiếu Bộ Tổng tham mưu và những người lính bằng `Họ` / `họ`, và quy chiếu viên sĩ quan tham mưu phân tích số liệu bằng `ông ta` / `Ông ta` kết hợp phản thân `mình` (p000260–p000262). (2) Trong phân cảnh phía Tanya và Tiểu đoàn 203 (p000265–p000277): trần thuật ngôi thứ ba quy chiếu Tanya bằng tên riêng `Tanya` kết hợp đại từ `nó` (đã xử lý triệt để M4 tại cả hai mệnh đề của p000273 và đồng bộ với p000276) cùng phản thân `tự mình` (p000272); độc thoại nội tâm tự quy chiếu của Tanya tại p000272 nhất quán dùng `Mình` / `mình` theo `DEC-P01-001`; trong lời thoại chỉ huy (p000266, p000268–p000270, p000274, p000275), Tanya mở đầu p000268 bằng câu nhận biết `Tôi thấy rồi!` theo bản sửa M1, tự xưng `tôi`, dùng `Chúng ta` / `Bên này` cho đơn vị mình, quy chiếu địch bằng `chúng`, và gọi cấp dưới thuần túy theo cấp bậc – tên riêng `Thiếu úy Serebryakov` (p000268, bản sửa M2) và `Trung úy Weiss` (p000270, bỏ đại từ thân mật/giới tính theo mục `vol02-ch03-b17-weiss-address` và bản sửa M3), còn Weiss gọi Tanya là `Thiếu tá` và tự xưng `Tôi` / `nhóm mình` (p000269). (3) Trong phân cảnh theo điểm nhìn của Đại tá Anson Sue và tiểu đoàn Liên minh Entente (p000257, p000258, p000278–p000301): trần thuật ngôi thứ ba quy chiếu Sue bằng `Sue` / `Đại tá Anson` / `Đại tá Sue` kết hợp đại từ trang trọng `ông` / `Ông` và phản thân `mình` (p000280, p000282, p000286, p000288, p000290–p000292, p000297, p000299, p000301); độc thoại nội tâm của Sue dùng `mình` (p000257, p000292), còn trong lời cầu nguyện trực tiếp gửi Chúa tại p000300 xưng `con` – gọi `Người`; quy chiếu Tanya từ góc nhìn đối địch của Sue bằng `cô ta` (p000295–p000297, đã khử cách gọi hạ thấp súc vật hóa tại p000296 theo bản sửa M6), `Đối thủ này` (p000296), `cô gái đáng ghét ấy` và `con quỷ` (p000299, p000300); trong lời thoại của binh sĩ và Sue (p000278, p000279, p000283–p000285, p000287, p000289, p000293, p000294, p000296) dùng `Tôi`, `chúng ta`, `bọn mình`, gọi chỉ huy là `Đại tá Sue`, và gọi quân Đế quốc là `Chúng` / `chúng` / `Đám này`"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật về Tanya tại part0018/p000273 — bắt buộc giữ `nó` ở cả hai vị trí theo `DEC-P01-001` và bản sửa M4 đã nghiệm thu) / cậu / anh (thay cho cách gọi theo cấp bậc không kèm đại từ đối với `Trung úy Weiss` tại part0018/p000270 — bắt buộc giữ cách gọi theo cấp bậc, bỏ đại từ theo mục `vol02-ch03-b17-weiss-address` và bản sửa M3 đã nghiệm thu) / Con này / nó (thay cho `Đối thủ này` và `cô ta` trong lời của Sue tại part0018/p000296 — bắt buộc giữ `Đối thủ này` và `cô ta` theo bản sửa M6 đã nghiệm thu để không tự thêm sắc thái súc vật hóa ngoài nguồn và đồng bộ với p000295, p000297)
