  volume: vol-02
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, quốc gia, địa danh, cơ quan tham mưu và thuật ngữ quân sự đã khóa tạm từ Tập 1 cùng B01–B13 của Tập 2 (`Tanya`, `Dacia`, `Norden`, `Đế quốc`, `Khối Thịnh vượng chung`, `Bộ Tổng tham mưu`, `Thiếu tướng von Rudersdorf`, `Thiếu tướng von Zettour`, `các binh sĩ`, `bộ phận Nhân sự`), đồng thời khóa tạm các thuật ngữ hậu cần, ẩm thực thời chiến và lý luận tác chiến đã signoff trong B14 (`diễn tập bắn đạn thật`, `khẩu phần thời chiến`, `quán cà phê chiến trường thường trực`, `cà phê giả`, `thực phẩm giống bánh mì`, `đồ thay thế`, `chiếc tách Meissen`, `lý thuyết tác chiến`, `tác chiến cơ động`, `chiến tranh cơ động`, `đơn vị tiên phong`, `Anluk E. Kahteijanen`, `vật tư quân sự`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_and_zettour_rudersdorf_pronouns_and_address_vol02_ch01_b14
  proposed_vi: "Trong phần kết cảnh oanh tạc tại Dacia (part0012/p000001–p000006): trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng tên riêng `Tanya` và đại từ `nó` xuyên suốt (part0012/p000003, p000005), tuyệt đối không dùng `cô` theo DEC-P01-001 và `provisional_review_choices.Tanya_narration` đã sửa trong signoff; trong lời thoại với thuộc cấp (part0012/p000002, p000004, p000006), Tanya dùng câu mệnh lệnh rút gọn chủ ngữ tự nhiên (`“Chỉ là tiếng cảm thán thôi. Đừng bận tâm.”`), dùng `chúng ta` khi gộp toàn đơn vị, gọi phía Dacia là `Họ`, và gọi các quân nhân dưới quyền là `các binh sĩ` (p000006, đồng bộ với B13). Trong phân cảnh tại nhà ăn Bộ Tổng tham mưu (part0012/p000007–p000018): trần thuật ngôi thứ ba quy chiếu Thiếu tướng von Rudersdorf và Thiếu tướng von Zettour bằng `ông` / `Ông` kết hợp cấp bậc và tên riêng, hoặc `hai người` / `cả hai` / `họ` khi gộp chung (part0012/p000009–p000012, p000014–p000016); trong đối thoại trực tiếp giữa hai thiếu tướng đồng cấp đồng sự (part0012/p000012, p000013, p000017, p000018), cả Zettour và Rudersdorf đều xưng `tôi`, gọi nhau là `ông` kèm tên riêng `Rudersdorf` (`‘Tôi cho ông thời gian, nên hậu cần ông lo đi?’`), và dùng `ta` / `chúng ta` khi nói về phía Đế quốc (`kẻ địch của ta`, `đứng về phía chúng ta`, `chiến lược căn bản của chúng ta`)"
  alternatives_vi:
  - cô (thay cho `Tanya` / `nó` khi trần thuật về Tanya tại part0012/p000003, p000005 — bác bỏ theo DEC-P01-001 và M1 đã sửa trong signoff) / anh – tôi (thay cho `ông` – `tôi` giữa Zettour và Rudersdorf tại part0012/p000013, p000018 — ưu tiên `ông` – `tôi` vì phản ánh chuẩn mực vị thế, độ tuổi và phong thái đĩnh đạc của hai vị thiếu tướng trong Bộ Tổng tham mưu Đế quốc, đồng bộ với các phân cảnh Zettour – Rudersdorf từ Tập 1 và B03–B04 của Tập 2)
