  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các lựa chọn đã sửa, signoff trong `handoffs/vol-02/ch-01-b14.yml` (`Tanya` / `nó` cho trần thuật về Tanya, `các binh sĩ` khi Tanya gọi thuộc cấp, `ông` cho trần thuật về hai vị thiếu tướng Zettour và Rudersdorf, và cặp đại từ ngang hàng trọng thị `tôi` – `ông` kèm `ta` / `chúng ta` trong đối thoại chiến lược giữa hai người)."
