  proposed_vi: "Tanya (part0012/p000003, p000005) / Dacia, diễn tập bắn đạn thật, màn pháo hoa sau buổi huấn luyện (part0012/p000004, p000016, p000017) / căn cứ, các binh sĩ (part0012/p000006) / đại úy, khẩu phần thời chiến (part0012/p000007) / bộ phận Nhân sự, Nhà ăn Bộ Tổng tham mưu, quán cà phê chiến trường thường trực, hậu phương (part0012/p000008) / Thiếu tướng von Rudersdorf, Rudersdorf, nhà ăn, Khối Thịnh vượng chung (part0012/p000009–p000016, p000018) / Thiếu tướng von Zettour, Zettour, Bộ Tổng tham mưu, sĩ quan Bộ Tổng tham mưu (part0012/p000010, p000011, p000014–p000016) / Đế quốc, cà phê giả, thực phẩm giống bánh mì, đồ thay thế, chiếc tách Meissen (part0012/p000012, p000013) / hai mặt trận (part0012/p000013) / hậu cần, chiến lược, tác chiến, lý thuyết tác chiến (part0012/p000014, p000015, p000017, p000018) / tác chiến cơ động (part0012/p000015) / chiến tranh cơ động, triển khai binh lực, đơn vị tiên phong (part0012/p000016) / Anluk E. Kahteijanen, các cơ sở cảng, Norden, vật tư quân sự, cuộc tấn công mùa đông (part0012/p000018)"
  alternatives_vi:
  - Cục Nhân sự / Phòng Nhân sự (thay cho `bộ phận Nhân sự` tại part0012/p000008 — bác bỏ việc gắn cấp biên chế `Cục`/`Phòng` khi nguồn chưa nêu rõ cấp đơn vị, ưu tiên giữ `bộ phận Nhân sự` trung tính và đồng bộ với Tập 1) / học thuyết tác chiến và các chiến dịch quân sự (thay cho `lý thuyết tác chiến` và `tác chiến` tại part0012/p000014, p000015 — bác bỏ `học thuyết` và `chiến dịch`, ưu tiên giữ `lý thuyết tác chiến`, `tác chiến` và `tác chiến cơ động` theo `provisional_review_choices.operational_terms` đã sửa và signoff trong `handoffs/vol-02/ch-01-b14.yml`) / quân nhu (thay cho `vật tư quân sự` tại part0012/p000018 — bác bỏ `quân nhu` vì thu hẹp phạm vi về lương thực/quân trang, ưu tiên giữ `vật tư quân sự` theo `provisional_review_choices.materiel` đã sửa và signoff nhằm bao quát cả vũ khí, đạn dược và trang bị cho chiến dịch mùa đông) / thêm danh từ phân loại trước `Anluk E. Kahteijanen` (tại part0012/p000018 — bác bỏ việc tự suy diễn là tàu hay tuyến đường sắt khi nguồn chưa giải thích, giữ nguyên tên riêng `Anluk E. Kahteijanen`)
