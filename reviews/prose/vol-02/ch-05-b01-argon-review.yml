findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000005
    issue: "Tại câu 2 của p000005, tính từ miêu tả ký ức chiến tranh chưa lành/còn nguyên vẹn nỗi đau (`raw`) được dịch thành `quá dữ dội`, hơi nghiêng về cường độ sự việc hơn là cảm giác nhức nhối, sống động như mới hôm qua trong tâm trí người lính."
    basis: "Câu dịch hiện tại (`vẫn quá dữ dội trong tâm trí họ, chưa thể phai mờ`) vẫn truyền tải đúng hệ quả ký ức không phai nhạt và nối mạch tự nhiên với câu kế tiếp (`nhớ thế giới ấy rõ mồn một`), không làm sai lệch logic."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `vẫn còn quá nhức nhối và sống động trong tâm trí họ đến mức không thể phai mờ`."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000008
    issue: "Tại câu 1 của p000008, cụm trạng ngữ chỉ mức độ chi tiết (`in detail`) được gộp nhẹ vào động từ `nhớ rõ` (`Tôi nhớ rõ những sự việc hôm ấy`), làm giảm đôi chút sắc thái hồi tưởng tỉ mỉ từng chi tiết khi so với câu `Tôi nhớ rất rõ ngày hôm ấy` ở p000014."
    basis: "Không ảnh hưởng đến nghĩa cốt lõi hay mạch tự sự hồi tưởng của người cựu binh."
    recommendation: "Có thể giữ nguyên, hoặc tinh chỉnh ở bước chuốt văn thành `Tôi nhớ tường tận những sự việc của ngày hôm ấy` để tạo độ phân biệt sắc thái rõ hơn với p000014."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000011
    issue: "Tại câu 1 của p000011, cụm chỉ thái độ phớt lờ/coi như không có gì trước tầm nhìn mù mịt (`made nothing of`) được dịch là `chẳng hề nao núng`, hơi chuyển sang nét nghĩa dũng cảm không sợ hãi thay vì thái độ bất chấp/chẳng mảy may bận tâm của pháo binh địch; đồng thời ở cuối p000012, thuật ngữ `lines of fire` của súng máy dịch là `làn đạn` hơi rộng hơn `đường bắn`."
    basis: "Cả hai vị trí đều giữ nguyên vẹn quan hệ nhân quả và hiện thực chiến trường lầy lội trong hồi ức của xạ thủ súng máy."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc đổi thành `chẳng mảy may bận tâm đến tầm nhìn tồi tệ` tại p000011 và `kiểm soát đường bắn của mình` tại p000012."
    resolution: optional_polish

