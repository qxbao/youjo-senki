    source_term: "Old veteran third-person frame narration (`ông lão` / `ông`), collective veteran plural (`họ`), transition to first-person interior thought and retrospective narration (`tôi` / `chúng tôi`), generic second-person rendering, and italicized spans in p000006, p000007, p000021, p000024"
