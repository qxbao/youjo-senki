      - "Tự sự hồi tưởng ngôi thứ nhất dùng `Tôi` / `tôi` (số ít) và `chúng tôi` (số nhiều, Đại đội G); quy chiếu Đại đội E bằng `họ`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất của người cựu binh thuộc Đại đội G."
    modality_and_logic: "Giữ bối cảnh đạn pháo đan chéo trên đầu, mệnh lệnh tiến lên vị trí tấn công mới và mục đích nhiệm vụ yểm trợ sườn cho Đại đội E."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000009
    terms:
      - "tiểu đội súng máy (machine-gun squad)"
      - "chiến hào (trench)"
      - "đơn vị tiên phong (vanguard unit)"
      - "trận địa bắn (firing position)"
      - "Quân đội Đế quốc (Imperial Army)"
      - "Quân đội Cộng hòa (Republican Army)"
      - "áp chế (suppressed)"
    pronouns_and_address:
      - "Dùng `Tôi` và `chúng tôi`; cặp đối lập `us and them` dịch tự nhiên là `ta và địch`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất của lính tiểu đội súng máy."
    modality_and_logic: "Giữ sự đối lập giữa giả định theo kế hoạch (`Lẽ ra Quân đội Đế quốc đã áp chế được Quân đội Cộng hòa khá tốt...`) và thực tế chiến tuyến biến động hỗn loạn (`nhưng như mọi khi, ranh giới giữa hai bên vô cùng phức tạp. Chúng gần như biến động liên tục.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000010
    terms:
      - "Trận pháo kích (The bombardment)"
      - "vũng lầy (mire)"
      - "chiến hào (trench)"
      - "khói pháo (artillery smoke)"
    pronouns_and_address:
      - "Lược chủ ngữ ở mệnh đề điều kiện khái quát (`hễ ló đầu khỏi chiến hào nhìn ra`), tránh dịch đại từ phiếm chỉ thành ngôi thứ hai trực tiếp."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ chi tiết duy nhất một cái cây còn sót lại (`quật đổ tất cả cây cối trong vũng lầy này, chỉ chừa lại một cây`) và ba đặc điểm tàn khốc của bãi lầy."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000011
    terms:
      - "pháo thủ địch (enemy artillerymen)"
      - "Tiểu đội súng cối chiến hào (trench mortar squad)"
      - "đại đội (company)"
      - "chớp lửa đầu nòng (muzzle flashes)"
      - "Quân đội Cộng hòa (Republican Army)"
    pronouns_and_address:
      - "Dùng `chúng tôi` cho phía đại đội của người kể; quy chiếu pháo thủ địch bằng `bọn pháo thủ địch khốn kiếp`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất mang giọng điệu bức xúc của người lính dưới làn pháo kích."
    modality_and_logic: "Giữ nhịp độ pháo kích biến thiên (`với nhịp độ khi nhanh khi chậm`), sự kém hiệu quả khi súng cối bắn trả (`nhưng hầu như chẳng gây được tổn thất gì`), và quan sát thực tế qua làn khói (`vẫn nhìn thấy nhiều chớp lửa đầu nòng từ các vị trí của Quân đội Cộng hòa`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000012
    terms:
      - "súng cối (mortars)"
      - "Sàn ván lót (duckboards)"
      - "xạ thủ súng máy (machine guns ... gunners)"
      - "làn đạn (lines of fire)"
    pronouns_and_address:
      - "Dùng `Tôi`, `chúng tôi` và quy chiếu các khẩu đội súng cối bằng `họ`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ quan hệ nguyên nhân – hệ quả (`Sàn ván lót không đứng vững vì cứ lún xuống bùn, khiến họ không có chỗ bắn ổn định`) và cấu trúc tăng tiến mức độ khắc nghiệt (`Điều kiện tồi tệ đến mức ngay cả các xạ thủ súng máy được huấn luyện kỹ lưỡng cũng không thể kiểm soát làn đạn`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000013
    terms:
      - "vị trí tấn công (attack positions)"
    pronouns_and_address:
      - "Dùng `Tôi` và `ai nấy đều...`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất."
    modality_and_logic: "Giữ tầm nhìn bao quát (`xa đến tận tầm mắt`) và nỗ lực tột cùng của những người lính phủ đầy bùn nhằm giữ vững vị trí tấn công."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000014
    pronouns_and_address:
      - "Dùng `Tôi`."
    pov_and_voice: "Câu khẳng định ngắn gọn tạo nhịp nhấn trong hồi ức của người cựu binh."
    modality_and_logic: "Giữ nguyên câu ngắn `Tôi nhớ rất rõ ngày hôm ấy.`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000015
    terms:
      - "pháo dã chiến (field guns)"
      - "chiến hào (trench)"
      - "bắn hiệu chỉnh theo quan sát (observed fire)"
      - "các tay súng được chỉ định (designated riflemen)"
      - "hố cá nhân (foxholes)"
      - "bệnh bàn chân chiến hào (trench foot)"
    pronouns_and_address:
      - "Dùng `tôi` cho người kể; quy chiếu những người lính dũng cảm bằng `những người lính ấy` / `Họ` / `họ`."
    pov_and_voice: "Tự sự hồi tưởng kết hợp sự kính phục sâu sắc khi nhìn lại từ hiện tại."
    modality_and_logic: "Khóa thuật ngữ `bắn hiệu chỉnh theo quan sát` (`vol02-ch05-b01-observed-fire`) và `bệnh bàn chân chiến hào` (`vol02-ch05-b01-trench-foot`); giữ nguyên cách diễn đạt đã sửa theo F01 (`Cảnh tượng lòng dũng cảm ấy vẫn in hằn trước mắt tôi, mang một vẻ thiêng liêng; đến tận hôm nay, tôi vẫn kính trọng họ từ tận đáy lòng.`) mà không thêm tính từ phán xét thẩm mỹ ngoài nguồn."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000016
    pronouns_and_address:
      - "Dùng chủ ngữ phiếm chỉ `người ta` cho đại từ khái quát trong nguồn."
    pov_and_voice: "Nhận định chiêm nghiệm của người cựu binh."
    modality_and_logic: "Giữ điều kiện loại trừ (`không thể hiểu nếu chưa từng trải qua; chỉ khi ở đó, người ta mới hiểu được`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000017
    terms:
      - "Đám cóc ấy (Those toads)"
    pronouns_and_address:
      - "Quy chiếu quân địch bằng `Đám cóc ấy` / `chúng`."
    pov_and_voice: "Lời thoại bông đùa của đồng đội trong tiểu đội súng máy."
    modality_and_logic: "Giữ giọng điệu mỉa mai khẩu ngữ trong chiến hào."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000018
    terms:
      - "Đám pháo thủ (The gunners)"
      - "đầm lầy (swamp)"
    pronouns_and_address: []
    pov_and_voice: "Lời thoại hưởng ứng câu đùa của đồng đội."
    modality_and_logic: "Khóa cách dịch `Đám pháo thủ` (chỉ pháo binh địch đang bắn phá làm mặt đất hóa đầm lầy, nối tiếp câu đùa ở p000017)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000019
    terms:
      - "Đại đội H (Company H)"
    pronouns_and_address:
      - "Người lính trong hố cá nhân tự xưng `Tôi`, quy chiếu Đại đội H bằng `họ`."
    pov_and_voice: "Lời thoại của những người lính ở hố cá nhân gần đó."
    modality_and_logic: "Giữ sự chuyển giọng từ bông đùa sang thương cảm cho đơn vị bạn đang hứng hỏa lực (`Nhưng người đang bị bắn là Đại đội H. Tôi thấy thương họ.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000020
    terms:
      - "hố cá nhân (foxhole)"
      - "Đại đội H (Company H)"
      - "giới chỉ huy cấp cao (the brass)"
      - "phòng tuyến địch (enemy’s defense)"
      - "những viên đạn sống (human bullets)"
    pronouns_and_address:
      - "Dùng `chúng tôi` cho đơn vị của người kể."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất pha lẫn sự bất mãn đối với giới chỉ huy cấp cao thời bấy giờ."
    modality_and_logic: "Khóa ẩn dụ `những viên đạn sống` theo `vol02-ch05-b01-human-bullets` (F02) và giữ sắc thái nhận định `dường như tin chắc` (`seemed convinced`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000021
    pronouns_and_address:
      - "Dùng đại từ ngôi thứ ba số nhiều `Họ` quy chiếu `giới chỉ huy cấp cao` (nối từ câu cuối p000020) theo đúng sửa chữa F03."
    pov_and_voice: "Câu hỏi tu từ nội tâm đầy phẫn nộ của người lính."
    modality_and_logic: "Giữ nguyên câu hỏi cảm thán chất vấn sự coi rẻ sinh mạng binh sĩ vì một mảnh đất lầy lội."
    emphasis: "Khóa nhấn mạnh toàn câu `*Họ nghĩ mảnh đất lầy lội này đáng giá bao nhiêu mạng người?!*` theo đúng thẻ `<em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000022
    terms:
      - "Yểm trợ đường không (Air support)"
      - "mấy khẩu pháo địch (the enemy guns)"
    pronouns_and_address: []
    pov_and_voice: "Tiếng kêu bất lực của một người lính trong đại đội."
    modality_and_logic: "Khóa cụm `mấy khẩu pháo địch` theo sửa chữa F06 để giữ rõ đối tượng hỏa lực pháo binh địch cần bị dập tắt."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000023
    terms:
      - "đại đội (company)"
      - "tuyến chiến đấu (the lines)"
      - "ưu thế trên không cục bộ (local air superiority)"
      - "Chiến dịch (the operation)"
    pronouns_and_address:
      - "Dùng `chúng tôi` cho phía đại đội."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất giải thích kế hoạch tác chiến trên lý thuyết."
    modality_and_logic: "Giữ rõ hành động `đẩy tuyến chiến đấu lên` theo sửa chữa F07 và cấu trúc giả định trái với thực tế đang diễn ra (`Lẽ ra chúng tôi phải... Chiến dịch vốn phải vận hành như vậy.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000024
    terms:
      - "Đám tai to mặt lớn (bigwigs)"
      - "yểm trợ đường không (air support)"
    pronouns_and_address:
      - "Dùng `chúng tôi` cho những người lính dưới chiến hào và `họ` cho `Đám tai to mặt lớn khốn kiếp ấy`."
    pov_and_voice: "Tự sự hồi tưởng ngôi thứ nhất kết thúc đoạn bằng sự châm biếm chua chát."
    modality_and_logic: "Giữ sự chơi chữ đối lập trực diện giữa lời hứa hẹn của cấp trên (`yểm trợ đường không *đầy đủ*`) và thực tế phũ phàng dưới chiến hào (`*hoàn toàn không có* yểm trợ đường không`)."
    emphasis: "Khóa chính xác hai phạm vi nhấn mạnh `*đầy đủ*` và `*hoàn toàn không có*` (để cụm `yểm trợ đường không` ở ngoài dấu `*...*`) theo đúng hai thẻ `<em>` trong nguồn (DEC-P01-002 / F08)."
