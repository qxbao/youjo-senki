findings:
  - segment_id: "YS-LN02/Text/part0030.xhtml/p000610"
    severity: "moderate"
    category: "terminology_and_meaning"
    issue: "Thuật ngữ 'observation formula' đang dịch là 'công thức quan sát', lệch hệ thuật ngữ 'formula' = 'thuật thức' trong sổ pending của tập 2; đồng thời cấu trúc bổ nghĩa đang gắn việc tăng cường vào thị giác thay vì gắn 'boosted' trực tiếp vào thuật thức quan sát của pháp sư."
    recommendation: "Đổi 'công thức quan sát' thành 'thuật thức quan sát' và chỉnh lại quan hệ bổ nghĩa, ví dụ: 'Nhưng tầm nhìn đặc thù của các pháp sư khi tăng cường thuật thức quan sát lại cho anh thấy...'."
  - segment_id: "YS-LN02/Text/part0030.xhtml/p000613"
    severity: "moderate"
    category: "terminology"
    issue: "Thuật ngữ 'protective formulas' đang dịch là 'công thức bảo vệ', chưa thống nhất với quy ước dịch 'formula' trong phép thuật quân sự là 'thuật thức'."
    recommendation: "Đổi 'công thức bảo vệ' thành 'thuật thức bảo vệ' (hoặc 'thuật thức phòng hộ', đồng bộ với p000618)."
  - segment_id: "YS-LN02/Text/part0030.xhtml/p000618"
    severity: "moderate"
    category: "terminology"
    issue: "Thuật ngữ 'protective formulas' đang dịch là 'các công thức bảo vệ', chưa thống nhất với hệ thuật ngữ 'thuật thức' của tập 2."
    recommendation: "Đổi 'các công thức bảo vệ' thành 'các thuật thức bảo vệ' (hoặc 'các thuật thức phòng hộ', đồng bộ với p000613)."
  - segment_id: "YS-LN02/Text/part0030.xhtml/p000640"
    severity: "moderate"
    category: "tone_and_register"
    issue: "Từ chửi thề trong độc thoại nội tâm của Grantz đang dịch là 'Đệch.', mang sắc thái tiếng lóng hiện đại pha tính bông đùa, làm lệch giọng văn bi kịch và uất nghẹn khi nhân vật buộc phải tuân lệnh tấn công dẫn đến cái chết của dân thường."
    recommendation: "Đổi 'Đệch.' thành 'Khốn kiếp.' hoặc 'Chết tiệt.' để giữ đúng sắc thái nặng nề, dằn vặt trong ngữ cảnh."
  - segment_id: "YS-LN02/Text/part0030.xhtml/p000617"
    severity: "minor"
    category: "pronouns_and_clarity"
    issue: "Câu '*Giết họ*, họ nói vậy.' lặp đại từ 'họ' liên tiếp cho hai đối tượng quy chiếu khác nhau (tân ngữ là nhóm người phía sau các pháp sư địch, chủ ngữ là cấp trên/Bộ chỉ huy), dễ gây vấp khi đọc."
    recommendation: "Tách bạch hai đối tượng quy chiếu, ví dụ: '*Giết họ đi*, cấp trên nói vậy.' hoặc '*Giết chúng đi*, họ nói vậy.'."
  - segment_id: "YS-LN02/Text/part0030.xhtml/p000626"
    severity: "minor"
    category: "terminology"
    issue: "Thuật ngữ 'battalion commander' đang dịch là 'chỉ huy tiểu đoàn', trong khi pending-terms-index.yml đã ghi nhận phương án 'tiểu đoàn trưởng'."
    recommendation: "Đổi 'chỉ huy tiểu đoàn' thành 'tiểu đoàn trưởng' để đồng bộ với sổ thuật ngữ tạm."
