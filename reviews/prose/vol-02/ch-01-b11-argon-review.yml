  proposed_vi: "Trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` kết hợp tên riêng `Tanya` và đại từ phản thân `mình` ở mệnh đề phụ thuộc (part0010/p000277, p000278, p000283, p000284, p000289, p000291, p000294, p000296, p000298), tuyệt đối không dùng `cô` cho Tanya theo DEC-P01-001; trong độc thoại nội tâm ngôi thứ nhất số ít (part0010/p000276–p000278, p000282–p000284, p000290, p000298), Tanya tự quy chiếu bằng `mình` xuyên suốt theo DEC-P01-001 và `provisional_review_choices.tanya_interior_self_reference` đã signoff, dùng `chúng ta` khi đặt Đế quốc trong thế đối sánh với Công quốc Dacia ở p000281 và dùng `chúng tôi` / `Chúng tôi` khi chỉ tập thể đơn vị đang tiếp cận nhà máy đạn dược ở p000285; quy chiếu Trung úy Weiss trong trần thuật bằng `Trung úy Weiss` / `Weiss` kết hợp đại từ `anh` và phản thân `mình` (part0010/p000293, p000294, p000296), và giữ cấu trúc mở không gắn đại từ sở hữu hẹp ở cụm `dù thiếu kinh nghiệm` tại p000296 theo `provisional_review_choices.ambiguous_subject_p000296` đã signoff; quy chiếu Thiếu úy Serebryakov trong trần thuật và nội tâm của Tanya tại p000298 bằng `sĩ quan phụ tá của nó, Thiếu úy Serebryakov` và đại từ `cô`; quy chiếu phía Dacia / quân địch bằng `họ` (p000276, p000277, p000281, p000292, p000293) hoặc `lũ ngốc này` / `chúng` khi gắn với thái độ khinh miệt của Tanya (p000278, p000289, p000290); trong đối thoại quân sự tại mục tiêu (part0010/p000286–p000289, p000292, p000293, p000295, p000297): Tanya tự xưng `tôi` (p000289), dùng `chúng ta` (p000292) và gọi cấp dưới ở p000287 là `Trung úy`; Weiss (và cấp dưới ở p000286, p000288, p000295) tự xưng `tôi` / `Tôi`, dùng `chúng ta` (p000295), gọi Tanya là `Ngài` / `thiếu tá` kèm tiểu từ lễ phép `ạ` ở câu hỏi p000286; tại câu đề xuất tấn công của Serebryakov ở p000297 dùng đại từ gộp `Ta` (`Ta ra tay chứ?`)"
  alternatives_vi:
  - tôi (thay cho `mình` trong độc thoại nội tâm của Tanya tại part0010/p000276, p000277 — bác bỏ theo DEC-P01-001 và M3 đã sửa trong signoff) / bản thân thiếu kinh nghiệm (thay cho `dù thiếu kinh nghiệm` tại part0010/p000296 — bác bỏ theo M4 đã signoff nhằm bảo toàn độ mở của đại từ sở hữu trung tính trong nguồn giữa phó chỉ huy và cấp trên) / Thiếu úy (thay cho `Trung úy` ở lời gọi trần `Lieutenant` tại part0010/p000287 nếu người nhận là Serebryakov — giữ tạm `Trung úy` theo báo cáo signoff vì toàn mạch đối thoại p000286–p000296 gắn trực tiếp với phản ứng tán đồng của Trung úy Weiss ở p000293–p000296, trong khi Serebryakov chỉ chen vào ở p000297–p000298 với dấu hiệu chuyển chủ thể `Cùng lúc đó`)
