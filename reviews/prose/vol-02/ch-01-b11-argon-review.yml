  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và các lựa chọn đã sửa và signoff trong `handoffs/vol-02/ch-01-b11.yml` (`nó` / `Tanya` cho trần thuật về Tanya, `mình` cho toàn bộ độc thoại nội tâm ngôi thứ nhất số ít của Tanya kể cả p000276–p000277, giữ độ mở chủ thể tại p000296, phân biệt rõ `anh` cho Weiss và `cô` cho Serebryakov, giữ chuẩn mực xưng hô cấp trên – cấp dưới trong đối thoại quân sự)."
