- source_term: dacian_munitions_factory_raid_and_enlightenment_irony_terms_vol02_ch01_b11
  proposed_vi: "ổ súng ẩn, thủ đô, quân Dacia, không chiến, trận địa khai hỏa (part0010/p000276) / mồi nhử, cấm ánh sáng ban đêm, được khai sáng (part0010/p000277) / vị giảng viên mang tên Trải nghiệm (part0010/p000279) / cố vấn chính phủ nước ngoài thời Minh Trị (part0010/p000280) / Công quốc, chiến tranh hiện đại, văn minh, sức mạnh quốc gia, Quân đội Đế quốc, Bộ Tổng tham mưu Quân đội Đế quốc (part0010/p000281) / ánh sáng văn minh, những kẻ man rợ, sứ mệnh thiêng liêng, ưu thế chủng tộc, cảm giác toàn năng (part0010/p000282) / Thượng đế, lý do tồn tại, Being X (part0010/p000283) / trò chơi điện tử, chiếc đèn pin, các chỉ huy (part0010/p000284) / nhà máy đạn dược, đạn pháo (part0010/p000285) / thiếu tá (part0010/p000286, p000295) / Trung úy (part0010/p000287) / nhà máy vũ khí (part0010/p000288) / thế giới hai chiều (part0010/p000289) / chiều không gian thứ ba trên bầu trời, người Dacia, chiến tranh phẳng lì tuyệt đối (part0010/p000290) / Các nhà tư tưởng thời Khai sáng, Trung úy Weiss, phó chỉ huy (part0010/p000293, p000296) / Weiss, cấp phó (part0010/p000296) / sĩ quan phụ tá, Thiếu úy Serebryakov, mặt trận Rhine, huấn luyện sĩ quan ngắn hạn nhưng chuyên sâu, phương diện pháp lý (part0010/p000298)"
  alternatives_vi:
  - tắt đèn phòng không hoặc chế độ tắt đèn (thay cho `cấm ánh sáng ban đêm` tại part0010/p000277 — ưu tiên giữ `cấm ánh sáng ban đêm` theo `provisional_review_choices.blackout` đã signoff trong `handoffs/vol-02/ch-01-b11.yml` vì diễn đạt chuẩn xác ý niệm kiểm soát ánh sáng ban đêm mà Tanya muốn “dạy” cho phía Dacia, tách biệt tự nhiên với cụm kỹ thuật `chế độ tắt đèn` ở B10 p000275) / Thượng úy Weiss (thay cho `Trung úy Weiss` tại part0010/p000293 — bác bỏ `Thượng úy`, ưu tiên `Trung úy Weiss` / `Trung úy` tại p000287, p000293 theo `provisional_review_choices.first_lieutenant` đã signoff để đồng bộ tuyệt đối với thang quân hàm Anh–Mỹ và các lô B02, B06, B08, B09, B10) / Thời kỳ Khai sáng và giác ngộ (thay cho `thời Khai sáng` tại part0010/p000293 và `được khai sáng` tại part0010/p000277 — ưu tiên cặp `được khai sáng` – `thời Khai sáng` để bảo toàn trọn vẹn phép chơi chữ mỉa mai về ánh sáng đèn điện của thủ đô Dacia và trào lưu triết học Khai sáng, không gộp với nghĩa tôn giáo `giác ngộ` của Being X ở Tập 1)
