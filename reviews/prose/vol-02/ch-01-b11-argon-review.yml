locked_choices:
- segment_id: YS-LN02/Text/part0010.xhtml/p000276
  locks:
  - "Giữ mệnh đề nhượng bộ `dù chỉ mới nằm trong phạm vi khả năng, vẫn có xác suất khác không là cả khu vực này đầy những ổ súng ẩn`, câu hỏi phản biện `nếu họ đã chuẩn bị kỹ lưỡng đến thế, sao lại để binh lính địch tiến vào thủ đô?`, các thuật ngữ `quân Dacia`, `không chiến`, `trận địa khai hỏa phức tạp`, và đại từ nội tâm ngôi thứ nhất `mình` đã sửa theo DEC-P01-001 (`mình không thể tưởng tượng nổi`)."
- segment_id: YS-LN02/Text/part0010.xhtml/p000277
  locks:
  - "Giữ đại từ nội tâm `mình` ở hai câu đầu theo DEC-P01-001 (`điều khiến mình tin chắc`, `mình tự hỏi`), sự chuyển ngôi sang trần thuật `nó` kết hợp phản thân `mình` ở câu cuối theo đúng nguồn, thuật ngữ đã sửa và signoff `khái niệm cấm ánh sáng ban đêm`, cùng cụm chơi chữ `được khai sáng đôi chút`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000278
  locks:
  - "Giữ đại từ nội tâm `Mình` / `mình` theo DEC-P01-001, tên riêng `Tanya`, cặp danh từ cảm xúc `lòng thương hại và sự khinh miệt`, và lối nói khẩu ngữ sắc lạnh `bằng cách đá đít chúng`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000279
  locks:
  - "Giữ câu độc thoại thành tiếng của Tanya với ẩn dụ `vị giảng viên mang tên Trải nghiệm`, cụm `thu một khoản phí hậu hĩnh` và nhận định phủ định giảm nhẹ `nghe cũng chẳng tệ`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000280
  locks:
  - "Giữ phép liên tưởng lịch sử `cố vấn chính phủ nước ngoài thời Minh Trị`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000281
  locks:
  - "Giữ danh xưng `Công quốc tội nghiệp ấy`, các bình diện so sánh `chiến tranh hiện đại, văn minh và sức mạnh quốc gia`, cùng tên tổ chức `Quân đội Đế quốc` và `Bộ Tổng tham mưu Quân đội Đế quốc`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000282
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, các khái niệm ẩn dụ châm biếm `ánh sáng văn minh`, `những kẻ man rợ`, `sứ mệnh thiêng liêng`, `khác biệt về văn hóa và văn minh với ưu thế chủng tộc`, và `cảm giác toàn năng khủng khiếp này`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000283
  locks:
  - "Giữ đúng phạm vi nhấn mạnh `*Chà, thế này không ổn rồi.*` ở câu đầu theo DEC-P01-002, tên riêng `Tanya`, đại từ nội tâm `mình` theo DEC-P01-001, và các thuật ngữ đã khóa tạm `Thượng đế`, `lý do tồn tại của riêng mình`, `sứ mệnh thiêng liêng`, `Being X`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000284
  locks:
  - "Giữ sự chuyển điểm nhìn từ đại từ nội tâm `mình` sang tên riêng trần thuật `Tanya`, phép so sánh `như trong trò chơi điện tử`, và hành động ra hiệu bằng `chiếc đèn pin` để gọi `các chỉ huy`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000285
  locks:
  - "Giữ thuật ngữ `Nhà máy đạn dược`, `sản xuất đạn pháo`, hình ảnh `biến đêm tối thành ban ngày`, và đại từ ngôi thứ nhất số nhiều `chúng tôi` / `Chúng tôi` chỉ đơn vị của Tanya."
- segment_id: YS-LN02/Text/part0010.xhtml/p000286
  locks:
  - "Giữ câu hỏi trình diện lễ phép của cấp dưới `“Ngài gọi tôi ạ, thiếu tá?”`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000287
  locks:
  - "Giữ thông báo `Đã tìm thấy mục tiêu như dự kiến.` và cách gọi cấp bậc tạm `Trung úy` trong câu hỏi `Trung úy nhìn thấy chứ? Ở đằng kia.`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000288
  locks:
  - "Giữ đại từ `Tôi`, thuật ngữ `nhà máy vũ khí` và mệnh đề phủ định `không thể tin nổi… lại không được canh gác`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000289
  locks:
  - "Giữ lời tán đồng `Thật lòng mà nói, tôi cũng không tin nổi.`, tên riêng `Tanya` cùng đại từ trần thuật `nó` theo DEC-P01-001, đại từ `chúng` chỉ quân địch, và ẩn dụ `sống trong thế giới hai chiều`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000290
  locks:
  - "Giữ các cụm thuật ngữ ẩn dụ không gian `chiều không gian thứ ba trên bầu trời`, `người Dacia`, `kiểu chiến tranh phẳng lì tuyệt đối`, đại từ nội tâm `mình` theo DEC-P01-001, và giọng mỉa mai `Kẻ địch nào của mình cũng cứ việc để trí tuệ teo tóp đi.`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000291
  locks:
  - "Giữ tên riêng `Tanya`, đại từ phản thân `mình` và hai vế song hành `vui mừng trước sự ngu ngốc của kẻ địch, đồng thời ăn mừng tình thế thuận lợi`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000292
  locks:
  - "Giữ đại từ `chúng ta`, `họ` và nhận xét mỉa mai `nên nể phục việc nhà máy của họ hoạt động suốt ngày đêm`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000293
  locks:
  - "Giữ cụm `Các nhà tư tưởng thời Khai sáng`, cấp bậc và tên riêng đã sửa theo signoff `Trung úy Weiss`, chức vụ `phó chỉ huy`, và động cơ `để rửa sạch thanh danh`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000294
  locks:
  - "Giữ tên riêng `Tanya`, đại từ `anh` quy chiếu Weiss, và chuỗi hành động `khôi phục danh dự`, `điều chỉnh đánh giá về anh`, `quyết định có thể giao nhiệm vụ cho anh`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000295
  locks:
  - "Giữ cặp đại từ `tôi` – `chúng ta` và cách gọi cấp bậc `thiếu tá` ở cuối câu thoại của Weiss."
- segment_id: YS-LN02/Text/part0010.xhtml/p000296
  locks:
  - "Giữ tên riêng `Weiss`, `Tanya`, các chức danh `phó chỉ huy`, `cấp trên`, `cấp phó`, cấu trúc giữ nguyên độ mở chủ thể đã sửa theo signoff `dù thiếu kinh nghiệm`, và đại từ phản thân `mình` ở câu cuối."
- segment_id: YS-LN02/Text/part0010.xhtml/p000297
  locks:
  - "Giữ câu nhận định `Đây là cơ hội tấn công tuyệt vời.` và câu hỏi thúc giục `Ta ra tay chứ?`."
- segment_id: YS-LN02/Text/part0010.xhtml/p000298
  locks:
  - "Giữ chức vụ và cấp bậc `sĩ quan phụ tá của nó, Thiếu úy Serebryakov`, địa danh `mặt trận Rhine`, sự phân biệt rõ đại từ trần thuật `nó` / `Tanya` và nội tâm `Mình` cho Tanya theo DEC-P01-001 với đại từ `cô` cho Serebryakov, mệnh đề đối lập `đã dạy cô cách tiến hành chiến tranh, chứ chưa dạy cách xoay xở với luật lệ của nó…`, cùng cụm `huấn luyện sĩ quan ngắn hạn nhưng chuyên sâu` và `phương diện pháp lý`."
