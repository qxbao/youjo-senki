findings:
  - id: F01
    severity: moderate
    category: pronoun_viewpoint_consistency
    segment_ids:
      - YS-LN02/Text/part0016.xhtml/p000067
      - YS-LN02/Text/part0016.xhtml/p000068
      - YS-LN02/Text/part0016.xhtml/p000069
      - YS-LN02/Text/part0016.xhtml/p000070
      - YS-LN02/Text/part0016.xhtml/p000071
      - YS-LN02/Text/part0016.xhtml/p000072
      - YS-LN02/Text/part0016.xhtml/p000073
      - YS-LN02/Text/part0016.xhtml/p000074
      - YS-LN02/Text/part0016.xhtml/p000075
      - YS-LN02/Text/part0016.xhtml/p000077
    issue: >
      Đoạn p000067–p000077 là mạch trần thuật ngôi thứ ba đan xen độc thoại nội tâm
      từ điểm nhìn của Tanya tại cuộc họp tham mưu ở Cụm tập đoàn quân phương Bắc, nối
      trực tiếp sang ch-03-b04 (p000080–p000083). Tuy nhiên bản dịch hiện tại chưa đồng bộ
      theo DEC-P01-001 (canon/decisions.md): (1) Độc thoại nội tâm tự quy chiếu của Tanya ở
      p000068, p000070–p000075 và p000077 đang dùng "tôi" (và "Chúng tôi" ở p000075) thay vì
      "mình" (và "chúng ta"/"đơn vị mình" khi gộp tiểu đoàn trong suy nghĩ), làm nhòe ranh giới
      giữa lời phát biểu công khai trước phòng họp ("Tôi" ở p000066) với dòng suy nghĩ thầm,
      đồng thời lệch trực tiếp với mạch nội tâm dùng "mình" ở đầu b04 (p000080–p000083).
      (2) Trần thuật ngôi thứ ba gắn điểm nhìn Tanya ở p000067–p000069 và p000071 đang dùng
      "cô" thay vì "nó" (hoặc lặp tên "Tanya"/lược đại từ theo DEC-P01-001 và p000082 của b04);
      đặc biệt ở câu cuối p000071 vừa dùng "quân hàm của cô" ở vế đầu vừa nhảy sang "chuyền sang
      cho tôi" ở vế sau trong cùng một câu.
    recommendation: >
      Chuẩn hóa theo DEC-P01-001 và mạch liền kề ở ch-03-b04:
      - Giữ "Tôi" ở p000066 vì đây là lời phát biểu trực tiếp của Thiếu tá von Degurechaff
        trước hội nghị tham mưu.
      - Ở trần thuật ngôi thứ ba điểm nhìn Tanya (p000067–p000069, p000071), đổi "cô" sang "nó"
        (hoặc lược đại từ nơi câu đã rõ chủ ngữ Tanya), đồng bộ với p000082.
      - Ở độc thoại nội tâm tự quy chiếu của Tanya (p000068, p000070–p000075, p000077), đổi
        "tôi" sang "mình" (ví dụ: p000068 "mình cũng chẳng thể nghiêm túc..."; p000070 "ban đầu
        mình đâu định...", "mình cứ nghĩ..."; p000071 "nên mình nghĩ cứ lịch sự...", "Dù đếm từ
        dưới lên sẽ nhanh chạm tới cấp bậc của mình hơn, quả bóng lại bị đẩy sang chỗ mình";
        p000072 "có lẽ mình nên làm mẫu..."; p000073 "kẻ chịu trận sẽ là mình..."; p000074
        "Trước hết, mình đã đẩy lui...", "thành tích đáng kể của mình ở Dacia... khiến lời nhận
        xét của mình..."; p000075 "Tiểu đoàn của mình đã cố gắng hết sức... Đơn vị mình đã đánh
        bật... Chúng ta có thể tự hào..."; p000077 "Ông ta mặt dày hơn mình tưởng").
  - id: F02
    severity: moderate
    category: meaning_precision
    segment_ids:
      - YS-LN02/Text/part0016.xhtml/p000070
    issue: >
      Ở p000070 ("Rudersdorf thuộc Cục Tác chiến của Bộ Tổng tham mưu—tôi cứ nghĩ việc ông ta hay
      thúc ép người khác vốn là nhiệm vụ của mình"), đại từ phản thân "của mình" đặt ngay sau
      mệnh đề suy nghĩ của Tanya khiến câu tiếng Việt bị hiểu nhầm thành "nhiệm vụ của chính Tanya",
      trong khi nguyên nghĩa chỉ phần việc/vai trò của Rudersdorf (vốn là người từ Cục Tác chiến
      Bộ Tổng tham mưu đến nên Tanya tưởng chính ông ta sẽ đứng ra đóng vai kẻ gây sức ép trong
      cuộc họp). Ngoài ra, cụm "hay thúc ép người khác" biến hành động đóng vai người thúc ép tại
      buổi họp thành thói quen tính cách thường ngày.
    recommendation: >
      Tách rõ sở hữu của Rudersdorf và giữ đúng sắc thái vai trò trong cuộc họp, kết hợp sửa đại từ
      nội tâm ở F01: "Thật tình, ban đầu mình đâu định can thiệp nhiều đến thế. Rudersdorf đến từ
      Cục Tác chiến của Bộ Tổng tham mưu—mình cứ nghĩ đóng vai kẻ gây sức ép là việc của ông ta."
