        - Giữ yêu cầu pháp sư phải tự lực quay về căn cứ sau khi đột phá, ẩn dụ “tấm vé một chiều xuống địa ngục” và câu kết phủ định ý nghĩa của trinh sát nếu đi quan sát mà không thể quay về.
