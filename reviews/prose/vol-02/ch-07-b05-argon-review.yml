    value: >-
      Nội tâm "mình"; giữ khả thể "Có thể đó chỉ là vấn đề của lý thuyết xác
      suất" và kết luận "may mắn đáng để nghiên cứu".
  - segment_id: YS-LN02/Text/part0032.xhtml/p000108
    kind: dialogue_question
    value: Câu hỏi mở ngắn gọn "Có chuyện gì vậy?", không thêm đại từ xưng hô.
  - segment_id: YS-LN02/Text/part0032.xhtml/p000109
    kind: military_terms_and_order
    value: >-
      Giữ "quy mô cấp tiểu đoàn", địa danh "phòng tuyến Rhine", "rìa tầm radar
      của ta" và mốc thời gian mệnh lệnh "đến hết giai đoạn ba".
  - segment_id: YS-LN02/Text/part0032.xhtml/p000110
    kind: callsign_and_term
    value: >-
      Giữ callsign "Fairy 01" và thuật ngữ tạm "tác chiến ngăn chặn"; nội tâm
      "mình" nén giận, "chật vật giữ giọng chuyên nghiệp" và nhận xét "Họ nói
      nhẹ tênh như vậy đấy".
  - segment_id: YS-LN02/Text/part0032.xhtml/p000111
    kind: military_contrast_and_viewpoint
    value: >-
      Nội tâm "mình"/"chúng ta"; đối lập "tác chiến ngăn chặn" với thực tế tương
      đương "hai đại đội đang tiến hành trinh sát chiến đấu", phủ định "không
      bay đội hình chặt chẽ" và hao tổn sức lực khi bay qua "các vị trí phòng
      thủ".
  - segment_id: YS-LN02/Text/part0032.xhtml/p000112
    kind: military_term_and_conditional_negation
    value: >-
