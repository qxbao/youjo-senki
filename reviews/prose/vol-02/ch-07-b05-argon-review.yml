risks:
  - >-
    Tất cả các lựa chọn thuật ngữ quân sự, tên đơn vị, địa danh, hô hiệu và đại
    từ trong báo cáo này là phương án tạm thời có căn cứ cục bộ cho lô b05
    (non-canon), không tự nâng thành canon.
  - >-
    Tên "Matsusheeta²⁵" ở p000106 có đính kèm chú thích 25 ở tệp khác ngoài
    package được giao; giữ nguyên dạng chữ và dấu số mũ để tránh suy diễn ngoài
    phạm vi.
  - >-
    Các lượt thoại vô tuyến ở p000105, p000108, p000117, p000122, p000124 không
    nêu danh tính/cấp bậc người đối thoại trong phạm vi b05; việc lược đại từ
    xưng hô là phương án an toàn nhất theo DEC-P01-001.
