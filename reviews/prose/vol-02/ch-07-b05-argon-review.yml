findings:
  - id: B05-C01
    severity: resolved_moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000104
    issue: >-
      Kiểm tra việc khôi phục cấu trúc so sánh giả định về năng lực phá kho đạn
      của đơn vị 203 và loại bỏ từ nối lặp.
    evidence: >-
      Câu hỏi tự giễu ở p000104 nêu nguyên nhân từ vụ phá nhà máy tại Dacia dẫn
      tới niềm tin rằng nếu có đơn vị nào phá hủy được kho đạn địch thì đó là
      Tiểu đoàn Pháp sư Trên không số 203.
    resolution: >-
      Đã xử lý đạt: bản dịch hiện tại giữ đúng cấu trúc điều kiện "nếu có đơn vị
      nào phá hủy được kho đạn của địch, thì đó chính là Tiểu đoàn Pháp sư Trên
      không số 203", bỏ chữ "vì" lặp và giữ giọng tự giễu.
  - id: B05-C02
    severity: resolved_moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000112
    issue: >-
      Kiểm tra cách dịch trung tính cho vị trí hỏa lực bên dưới đường bay mà
      không tự thu hẹp thành trận địa pháo binh.
    evidence: >-
      Đoạn p000112 chỉ nêu vùng trời phía trên các vị trí khai hỏa là sân nhà
      của đối phương và điều kiện họ không vô tình bị bắn trúng, không định danh
      loại vũ khí cụ thể.
    resolution: >-
      Đã xử lý đạt: bản dịch dùng "các vị trí khai hỏa", giữ nguyên điều kiện
      phủ định "miễn là họ không vô tình bị bắn trúng" và bối cảnh sân nhà.
  - id: B05-C03
    severity: resolved_moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000126
    issue: >-
      Kiểm tra cách gọi lực lượng rút lui trên bộ và động từ chỉ hành động cầm
      cự câu giờ của lực lượng đoạn hậu.
    evidence: >-
      Đoạn p000126 đặt giả định nếu màn nghi binh bằng trinh sát chiến đấu thất
      bại thì lực lượng đoạn hậu phải trụ lại câu giờ đến cùng, nếu không cuộc
      rút lui trật tự của quân trên mặt đất sẽ vỡ thành hỗn loạn và có nguy cơ
      bị giẫm đạp.
    resolution: >-
      Đã xử lý đạt: bản dịch dùng "cầm cự và câu giờ đến phút cuối cùng" và
      "lực lượng trên mặt đất", đồng thời giữ bị động "có thể bị giẫm đạp" không
      tự gán tác nhân.
  - id: B05-C04
    severity: resolved_minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000106
    issue: >-
      Kiểm tra sự hiện diện của ký hiệu chú thích dạng số mũ ngay sau tên
      Matsusheeta.
    evidence: >-
      Cấu trúc XHTML trong package tại p000106 gắn thẻ số mũ 25 ngay sau tên
      nhân vật được nhắc trong giai thoại tuyển dụng.
    resolution: >-
      Đã xử lý đạt: bản dịch ghi đúng "Matsusheeta²⁵" và không tự mở hay chèn
      nội dung chú thích ngoài phạm vi.
  - id: B05-C05
    severity: resolved_minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000110
    issue: >-
      Kiểm tra diễn đạt nội tâm khi Tanya nén cơn giận và cố giữ giọng điệu
      công vụ trên vô tuyến.
    evidence: >-
      Sau câu đáp vô tuyến ở p000110, phần độc thoại mô tả việc kìm cơn giận
      đang trào lên để vừa đủ giữ giọng làm việc chuyên nghiệp trước lời ra lệnh
      nhẹ tênh của cấp trên.
    resolution: >-
      Đã xử lý đạt: "Nén cơn giận đang dâng lên trong lòng, mình chật vật giữ
      giọng chuyên nghiệp. Họ nói nhẹ tênh như vậy đấy." tự nhiên và sát nghĩa.
  - id: B05-C06
    severity: resolved_minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000130
    issue: >-
      Kiểm tra việc rút gọn chuỗi phủ định lồng nhau trong phép ví về đầu tư và
      rủi ro nhỏ.
    evidence: >-
      Ở p000130, người kể tự nhận thức rõ sự dại dột của việc bỏ qua đầu tư chỉ
      vì sợ một rủi ro nhỏ và đặt trọng tâm vào lợi nhuận thu về.
    resolution: >-
      Đã xử lý đạt: "Mình hiểu rõ việc không đầu tư chỉ vì sợ một rủi ro nhỏ là
      dại dột. Điều quan trọng nhất là lợi nhuận." giữ trọn nghĩa logic và sắc
      thái tự khẳng định.
  - id: B05-R01
    severity: resolved_minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000114
    issue: >-
      Kiểm tra việc thay sắc thái "vô tư" bằng hành động đáp lệnh không suy
      nghĩ.
    evidence: >-
      Đoạn p000114 phủ định khả năng đối phương chỉ là kiểu người máy móc nhận
      lệnh đi đánh chặn mà không hề suy tính.
    resolution: >-
      Đã xử lý đạt: bản dịch dùng "mình không nghĩ đối phương thuộc kiểu người
      sẽ chẳng cần suy nghĩ đã đáp “rõ, thưa ngài”", giữ đúng phủ định và lời
      đáp quân sự.
  - id: B05-R02
    severity: resolved_minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000115
    issue: >-
      Kiểm tra sắc thái xuất kích khẩn trương từ mặt đất để cản trở nhiệm vụ
      trinh sát.
    evidence: >-
      Đoạn p000115 giải thích lý do phải coi trọng địch vì đó là một tiểu đoàn
      được tung lên khẩn cấp từ mặt đất nhằm cản nhiệm vụ trinh sát.
    resolution: >-
      Đã xử lý đạt: bản dịch dùng "một tiểu đoàn được lệnh khẩn trương xuất kích
      từ mặt đất để cản trở nhiệm vụ trinh sát của chúng ta", không suy diễn
      phương tiện.
  - id: B05-R03
    severity: resolved_moderate
    segment_id: YS-LN02/Text/part0032.xhtml/p000123
    issue: >-
      Kiểm tra trọng tâm phủ định "không phải không có lý do" khi nói về quá
      trình huấn luyện.
    evidence: >-
      Đoạn p000123 gắn việc trải qua huấn luyện với tư duy hợp lý và đầu óc kinh
      tế, phủ định việc chịu huấn luyện mà không có lý do.
    resolution: >-
      Đã xử lý đạt: bản dịch dùng "mình trải qua huấn luyện đâu phải không có lý
      do", giữ nguyên giọng tự khẳng định, tên Being X và chữ nghiêng *Homo
      sapiens*.
  - id: B05-R04
    severity: resolved_minor
    segment_id: YS-LN02/Text/part0032.xhtml/p000128
    issue: >-
      Kiểm tra cấu trúc câu điều kiện ở nhận xét cuối về vấn đề của kế hoạch và
      sự rõ ràng của chủ thể chịu nguy cơ bị tiêu diệt.
    evidence: >-
      Đoạn p000128 nêu phỏng đoán về việc phía ra lệnh sẵn sàng bắt lực lượng
      đoạn hậu câu giờ đến mức bị xóa sổ, rồi kết bằng mệnh đề điều kiện rằng
      nếu kế hoạch có vấn đề gì thì đó là người kể đang ở phía nhận lệnh.
    resolution: >-
      Đã xử lý đạt: bản dịch dùng "dù lực lượng ấy có phải bị tiêu diệt sạch
      theo đúng nghĩa đen" và "Nếu kế hoạch này có vấn đề gì, thì đó là mình
      đang ở phía nhận lệnh."
