findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000313
    category: lexical_nuance
    issue: >-
      Tại câu 1 của `p000313`, cụm `chúc quân địch ngủ ngon bằng xẻng` dịch thoát từ cách nói giảm mang sắc thái hài đen chỉ việc chào buổi tối đối phương trong cuộc đột kích ban đêm.
    basis: >-
      Cách dịch `chúc quân địch ngủ ngon bằng xẻng` vẫn truyền tải trọn vẹn nét mỉa mai đen tối về việc dùng xẻng công binh hạ sát lính địch trong chuyến xuất kích ban đêm nối tiếp `p000312`.
    recommendation: >-
      Không chặn signoff; có thể giữ nguyên hoặc chỉnh nhẹ ở bước polish thành `gửi lời chào buổi tối tới quân địch bằng xẻng`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000319
    category: pronoun_and_pov_consistency
    issue: >-
      Ở câu 1 của `p000319` (`Đó là hài kịch hay bi kịch còn tùy vào góc nhìn của bạn.`), đại từ ngôi thứ hai phiếm chỉ trong lời bình chuyển cảnh được dịch thành `bạn`, trong khi câu liền trước (`p000318`) dùng `ta` và quy ước `direct-address choice` trong `work/run-state/pending-terms.yml` ưu tiên cấu trúc trung tính hoặc lược đại từ.
    basis: >-
      Câu văn nằm ở đoạn chuyển cảnh hồi cố của người kể chuyện nên dùng `bạn` không làm lệch điểm nhìn hay quan hệ nhân vật.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh thành `Đó là hài kịch hay bi kịch còn tùy vào góc nhìn của mỗi người.` hoặc `còn tùy vào góc nhìn.`
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000321
    category: emphasis_formatting
    issue: >-
      Câu thứ hai của `p000321` (`Tỷ lệ sẽ là thế này nếu phải đưa tân binh ra trận khi họ chưa được huấn luyện đầy đủ và còn thiếu kinh nghiệm.`) tương ứng với thẻ `<html:em>` trong XHTML nguồn nhưng hiện chưa được bọc bằng dấu `*...*` theo quy ước `DEC-P01-002`.
    basis: >-
      Nhờ câu 1 dẫn hành động (`nó đặt thông báo lên bàn rồi thở dài ngồi xuống`), người đọc vẫn nhận ra ngay câu 2 là nhận định nội tâm của Tanya và toàn bộ nghĩa điều kiện – hệ quả được bảo toàn chính xác.
    recommendation: >-
      Không chặn signoff; ở bước polish hoặc hậu kỳ định dạng có thể bọc câu 2 bằng dấu `*...*` thành `*Tỷ lệ sẽ là thế này nếu phải đưa tân binh ra trận khi họ chưa được huấn luyện đầy đủ và còn thiếu kinh nghiệm.*`
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000328
    category: terminology_consistency
    issue: >-
      Tại câu 1 của `p000328`, thuật ngữ `firing line` trong lời thoại của Tanya được dịch là `tuyến đầu`, trong khi tại `ch-05-b11` (`p000281`) cùng thuật ngữ này được dịch là `tuyến hỏa lực` (và `tuyến đầu xa nhất` đang dùng cho `forward-most line` ở `p000324`).
    basis: >-
      Trong lời thoại ngắn giải thích điều kiện nguồn nước ngoài chiến trường đối lập với Bộ Tổng tham mưu ở hậu phương, `Đây là tuyến đầu` hoàn toàn tự nhiên và rõ nghĩa.
    recommendation: >-
      Không chặn signoff; có thể giữ nguyên hoặc cân nhắc đồng bộ với `ch-05-b11` thành `Đây là tuyến hỏa lực` / `Đây là tuyến lửa` ở bước polish.
    resolution: optional_polish

