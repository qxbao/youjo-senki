  - id: vol02-ch05-b02-veteran-recollection-pronouns-dialogue-and-emphasis
    source_term: "First-person retrospective narration of the machine-gunner veteran (`tôi` / `chúng tôi`), trench dialogue address (`Tôi – Cậu`, `các cậu`, `anh em`), third-person references to medics/Sanis (`họ`) and Republican forces/sniper (`hắn`, `quân Cộng hòa` / `Chúng` / `chúng`), generic second-person rendering, and italicized spans in p000032, p000035, p000040, p000042"
    proposed_vi: "Tiếp nối trực tiếp mạch hồi tưởng ngôi thứ nhất từ ch-05-b01 và tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (tuyệt đối không áp dụng quy ước `nó` / `mình` của Tanya cho người cựu binh chiến trường Rhine): xuyên suốt lời kể hồi tưởng từ p000026 đến p000048, người cựu binh thuộc tổ súng máy tự xưng `tôi` / `Tôi` ở ngôi thứ nhất số ít và `chúng tôi` / `Chúng tôi` ở ngôi thứ nhất số nhiều (kết hợp đại từ phản thân `mình` ở các cấu trúc phụ thuộc `Tôi nhớ mình đã...` tại p000031, `chiêu đãi mình` tại p000041, `chúng tôi nghĩ mình sẽ...` tại p000048); lược chủ ngữ cho đại từ phiếm chỉ ở câu kết p000028 (`Muốn sống sót qua cuộc chiến kinh hoàng này, không thể đặt quá nhiều hy vọng`); trong lời thoại của binh lính tại chiến hào, dùng cặp xưng hô ngang hàng `Tôi – Cậu` tại p000025, `Tôi` khi báo trúng đạn tại p000029, `các cậu` khi hô ném lựu đạn tại p000039, và danh xưng tập thể `anh em` trong thông báo vô tuyến từ tiểu đoàn trưởng tại p000044; quy chiếu các nhân viên quân y (`*Sanis*`) và người khiêng cáng bằng đại từ trân trọng `họ` / `Họ` (p000033, p000035–p000037, p000040); quy chiếu tay bắn tỉa địch bằng `hắn` (p000032) và quân Cộng hòa bằng `quân Cộng hòa` / `Chúng` / `chúng` (p000041, p000043); quy chiếu phía tiểu đoàn trưởng / cấp chỉ huy phát thông báo qua vô tuyến bằng `họ` (p000045); bảo toàn chính xác các phạm vi nhấn mạnh `*...*` theo DEC-P01-002 tại p000032 (`*Chúng tôi không muốn chết.*`), p000035 (`*Sanis*`), p000040 (`*Sanis*`) và p000042 (`*vút*`, `*ầm*`), không tự thêm `*...*` ở bất kỳ đoạn nào khác"
    alternatives_vi:
