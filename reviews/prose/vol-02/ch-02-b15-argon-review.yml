  proposed_vi: "Trong phân cảnh Tanya đánh giá cục diện sau khi loại bỏ Control địch và triển khai kế hoạch tác chiến cho Tiểu đoàn Pháp sư Không quân 203 (part0014/p000392–p000416): tuân thủ nghiêm ngặt `DEC-P01-001` và bản sửa `F02` đã ký duyệt, trần thuật ngôi thứ ba quy chiếu Tanya bằng tên riêng `Tanya` (p000392, p000404) và đại từ `nó` ở p000405 (`Hiếm khi nó gặp được…`, `những nỗ lực ngày này qua ngày khác của nó`); quy chiếu chủ thể ngôi thứ ba số ít tại p000396 bằng cụm trung tính `người đó` (theo `vol02-ch02-b15-uncertain-she-reference` để tránh gán đại từ `cô` khi câu nguồn chuyển điểm nhìn đột ngột ngay sau câu thoại vô tuyến); trong toàn bộ mạch độc thoại nội tâm trực tiếp (p000401–p000403, p000405, p000407–p000412, p000414, p000416), Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` nhất quán (bao gồm cả câu suy nghĩ in nghiêng `*Có khi đến lúc nào đó mình sẽ phải tự thân chiến đấu*` ở p000408 theo `DEC-P01-002`), và dùng ngôi thứ nhất số nhiều bao gộp `ta` / `chúng ta` / `Chúng ta` khi nhận định tình hình chung của phe Đế quốc và đơn vị (p000400, p000402, p000407); dùng cấu trúc khái quát không đại từ cho câu nhận định chung ở p000392 (`họ`, `mình`), p000394 (`mỗi pháp sư`) và p000396 (`Cứ thử mới biết`); quy chiếu các pháp sư và cấp dưới thuộc Tiểu đoàn 203 bằng `họ` / `đám cấp dưới` / `đám người này` / `Bọn họ` (p000402, p000408–p000412), quy chiếu Cụm tập đoàn quân phương Bắc bằng `họ` (p000416), và quy chiếu quân địch bằng `chúng` (p000396, p000399, p000401–p000403) kết hợp `họ` khi dẫn báo cáo của CP hoặc xét đối tượng tác chiến của cấp dưới (p000399, p000414). Trong liên lạc vô tuyến và mệnh lệnh trực tiếp (p000395, p000398, p000399, p000406, p000413, p000415): Tanya (`Pixie 01`) tự xưng `tôi` (`“Đại đội Bốn, theo tôi.”` ở p000406), dùng ngôi thứ nhất số nhiều `chúng ta` / `ta` khi giao nhiệm vụ cho Đại đội Bốn (p000413), gọi toàn tiểu đoàn là `toàn đội` (p000395), gọi nhân viên `CP` là `các anh` (p000398), và mở đầu lời hiệu triệu bằng `thưa các quý ông…` (p000415)"
  alternatives_vi:
  - tôi (thay cho `mình` trong độc thoại nội tâm của Tanya tại part0014/p000401, p000414 — bắt buộc giữ `mình` theo quyết định đã duyệt `DEC-P01-001` trong `canon/decisions.md`, mục `vol02-ch02-b15-tanya-interior-pronoun` và bản sửa `F02` đã ký duyệt để thống nhất hoàn toàn với p000402–p000403, p000405, p000407–p000412, p000416) / cô (thay cho `người đó` tại part0014/p000396 và `nó` tại part0014/p000405 — ưu tiên giữ `người đó` ở p000396 theo mục `vol02-ch02-b15-uncertain-she-reference` và `nó` ở p000405 theo `DEC-P01-001`)
