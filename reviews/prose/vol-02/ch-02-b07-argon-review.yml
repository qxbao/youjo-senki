  proposed_vi: "những nhân vật tầm cỡ thế giới, nhượng địa tiềm năng (part0014/p000141) / Bộ Tổng tham mưu, Bộ Tư lệnh Tối cao, Đế quốc (part0014/p000143, p000148, p000150) / pháp sư Đế quốc, các đơn vị pháp sư Đế quốc (part0014/p000144, p000161, p000164) / các chiến hữu, phương Bắc (part0014/p000153) / Tiểu đoàn Viper của Đế quốc, Tiểu đoàn Viper, xuất kích (part0014/p000156, p000159, p000160, p000165) / Đại Quân, Bộ Chỉ huy phương Bắc, Lục quân Đế quốc, Liên minh Entente, Cụm tập đoàn quân phương Bắc (part0014/p000157–p000163, p000165) / Lục quân Liên minh Entente, kho tiếp tế, kho hàng, tuyến tiếp tế, biệt kích Liên minh Entente, pháp sư không quân địch (part0014/p000158, p000159) / Cấp chỉ huy, ít hơn xét theo tổng số tuyệt đối, tuyến liên lạc (part0014/p000160) / đơn vị biệt kích, Đơn vị biệt kích pháp sư Liên minh Entente, mẫu quả cầu mới nhất, không đánh dấu nguồn gốc, Cộng hòa, Khối Thịnh vượng chung, Hợp chúng quốc, Liên bang (part0014/p000161) / lực lượng Đế quốc, các chỉ huy Đế quốc, “pháp sư tình nguyện” (part0014/p000162) / cựu binh, đơn vị chiến đấu hạng nhất (part0014/p000165) / bên Tình báo (part0014/p000167)"
  alternatives_vi:
  - Bộ Chỉ huy Tối cao (thay cho `Bộ Tư lệnh Tối cao` tại part0014/p000143 — ưu tiên `Bộ Tư lệnh Tối cao` theo mục `vol02-ch02-b07-supreme-command` trong `pending-terms.yml` để phân biệt rõ cơ quan chỉ huy tối cao với `Bộ Chỉ huy phương Bắc` ở p000157) / Đại quân (thay cho `Đại Quân` tại part0014/p000157 — ưu tiên `Đại Quân` theo mục `vol02-ch02-b07-great-army` và tiền lệ Tập 1 vì là tên riêng của đại đơn vị chủ lực) / Cụm tập đoàn quân phía Bắc (thay cho `Cụm tập đoàn quân phương Bắc` tại part0014/p000157–p000159 — ưu tiên `Cụm tập đoàn quân phương Bắc` theo mục `vol02-ch02-b07-northern-army-group` và báo cáo signoff `reviews/prose/vol-02/ch-02-b07-term-signoff-claude.md` để đồng bộ với `Bộ Chỉ huy phương Bắc` trong cùng đoạn) / không mang ký hiệu xuất xứ (thay cho `không đánh dấu nguồn gốc` tại part0014/p000161 — ưu tiên `không đánh dấu nguồn gốc` theo mục `vol02-ch02-b07-unmarked-origin` và handoff b07) / Các Quốc gia Hợp nhất (thay cho `Hợp chúng quốc` tại part0014/p000161 — ưu tiên `Hợp chúng quốc` theo mục `vol02-ch02-b07-unified-states` vì tự nhiên, cô đọng trong chuỗi bốn cường quốc) / pháp sư xung phong (thay cho `pháp sư tình nguyện` tại part0014/p000162 — ưu tiên `pháp sư tình nguyện` theo mục `vol02-ch02-b07-voluntary-mages` vì phản ánh đúng diện binh lực nước ngoài can thiệp không rõ quốc tịch) / Tiểu đoàn Rắn lục (thay cho `Tiểu đoàn Viper` tại part0014/p000156, p000159, p000160, p000165 — ưu tiên giữ nguyên `Tiểu đoàn Viper` theo mục `vol02-ch02-b07-viper-battalion`)
