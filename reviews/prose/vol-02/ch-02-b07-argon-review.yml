  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và mục `vol02-ch02-b07-tanya-interior-self-reference`, giữ nhất quán đại từ nội tâm tự quy chiếu `mình` của Tanya, cách xưng hô giữa Tanya với các đại đội trưởng (`Các anh`, `các chiến hữu`, `chúng ta` – `Tôi`), và hệ quy chiếu đại từ tập thể `họ` trong phân cảnh Tiểu đoàn Viper."
