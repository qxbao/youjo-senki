  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, cơ quan chỉ huy – tham mưu, đơn vị và các lựa chọn thuật ngữ đã khóa tạm tại `work/run-state/pending-terms.yml#chapter2_b07_translation_proposals` và `handoffs/vol-02/ch-02-b07.yml` (`Bộ Tổng tham mưu`, `Bộ Tư lệnh Tối cao`, `Đế quốc`, `Lục quân Đế quốc`, `Đại Quân`, `Bộ Chỉ huy phương Bắc`, `Cụm tập đoàn quân phương Bắc`, `Tiểu đoàn Viper`, `Liên minh Entente`, `Lục quân Liên minh Entente`, `Cộng hòa`, `Khối Thịnh vượng chung`, `Hợp chúng quốc`, `Liên bang`, `không đánh dấu nguồn gốc`, `ít hơn xét theo tổng số tuyệt đối`, `“pháp sư tình nguyện”`, `bên Tình báo`)."
