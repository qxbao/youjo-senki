      standby unit is scrambled: đơn vị dự bị (hoặc đơn vị trực chiến) được lệnh xuất kích
      sortie orders: lệnh xuất kích
    negation_and_modality: giữ điều kiện phủ định `trừ phi... thường không thể...`, quy trình thông thường khi tuyến hai bị vượt qua, và nhận định đánh giá của người kể ở cuối câu về phản ứng quá chậm
  - segment_id: YS-LN02/Text/part0032.xhtml/p000158
    pronouns:
      controller_inclusive_we: chúng ta
    terms:
      widespread magic jamming: nhiễu ma thuật trên diện rộng
      scouting network: mạng lưới trinh sát
    modality_and_logic: giữ quan hệ nguyên nhân–kết quả giữa nhiễu ma thuật diện rộng làm tê liệt mạng lưới trinh sát và việc phản ứng bị chậm trễ
  - segment_id: YS-LN02/Text/part0032.xhtml/p000159
    pronouns:
      narrator_group: chúng tôi
    terms:
      controller: sĩ quan điều khiển
      intercept: đánh chặn
      stand by: chờ lệnh (hoặc trực chờ)
    modality_and_logic: giữ câu hỏi tu từ phủ định (`sao có thể khác được?`) và tâm lý bực bội vì bị điều đi đánh chặn gấp sau khi liên tục phải chờ lệnh
  - segment_id: YS-LN02/Text/part0032.xhtml/p000160
    pronouns:
      narrator_group: chúng tôi
      enemy: chúng
    terms:
      last defensive line: tuyến phòng thủ cuối cùng
      harassing attacks: các đòn quấy rối (hoặc các đợt tấn công quấy rối)
      intelligence: tin tình báo
    emphasis: bọc chính xác hai câu đầu trong `*...*` theo `DEC-P01-002`; không đánh dấu câu thứ ba
    modality_and_logic: giữ tình thế bị đẩy vào cảnh phải chặn địch trước tuyến cuối, hai rủi ro song hành (thiệt hại do quấy rối và lộ tin tình báo), cùng sắc thái tất yếu ở câu kết
  - segment_id: YS-LN02/Text/part0032.xhtml/p000161
    pronouns:
      enemy_battalion: chúng (giữ nhất quán, không đổi sang `họ`)
    terms:
      battalion of mages: tiểu đoàn pháp sư
      the Rhine general headquarters: Tổng hành dinh Rhine (hoặc Bộ tổng chỉ huy Rhine; không thêm `Tập đoàn quân`)
    modality_and_logic: giữ tương phản giữa khả năng nghiền nát địch theo lý thuyết (`lẽ ra phải...`) và nguy cơ dẫn tới thảm họa khi xét những tin tình báo mà địch đã nắm được
  - segment_id: YS-LN02/Text/part0032.xhtml/p000162
    pronouns:
      narrator_singular: tôi
      narrator_group: chúng tôi
      radio_operators_ref: họ
    terms:
      high-ranking officers: sĩ quan cấp cao
      heads would roll: bị cách chức (hoặc mất chức)
      widespread magic jamming: nhiễu ma thuật trên diện rộng
      radio operators: nhân viên thông tin vô tuyến (hoặc lính thông tin vô tuyến)
    modality_and_logic: giữ ba mức phỏng đoán tương lai của người kể (`Tôi chắc...`, `Hẳn...`, `Và tôi cá rằng...`)
  - segment_id: YS-LN02/Text/part0032.xhtml/p000163
    terms:
      anti-air fire: hỏa lực phòng không
      optical instruments: thiết bị quang học
    modality_and_logic: giữ tình thái nghe truyền đạt (`Nghe nói...`) và cảnh báo rằng do phòng không chỉ dựa vào thiết bị quang học nên quân địch có thể vẫn còn nguyên sức/sung sức
  - segment_id: YS-LN02/Text/part0032.xhtml/p000164
    pronouns:
      enemy: chúng
    terms:
      Roger: Rõ
      injured beast: con thú bị thương
    modality_and_logic: giữ lời đáp nhận lệnh, ẩn dụ cảnh giác không xem thường con thú bị thương và các câu hỏi ngắn xin thêm thông tin
  - segment_id: YS-LN02/Text/part0032.xhtml/p000165
    chronology_and_modality: giữ sự chuyển mạch từ chuyện tương lai về nhiệm vụ hôm nay, dự báo mức độ căng thẳng cao hơn thường lệ và mốc nhận thức lần đầu của cả đơn vị
  - segment_id: YS-LN02/Text/part0032.xhtml/p000166
    pronouns:
      narrator_group: chúng tôi
    terms:
      enemy mages: pháp sư địch
    modality_and_logic: giữ đối lập giữa các lần đẩy lui pháp sư địch đã kiệt sức với khả năng lần này phải chạm trán lực lượng còn bảo toàn được sức lực ở mức tương đối trong đêm tối
  - segment_id: YS-LN02/Text/part0032.xhtml/p000167
    pronouns:
      our_side: của ta
      narrator_group: chúng tôi
    terms:
      anti-air gunners: pháo thủ phòng không
      optical instruments: thiết bị quang học
      friendly fire: bị quân mình bắn nhầm (hoặc hỏa lực phe ta bắn nhầm)
    negation_and_modality: giữ phủ định kép ở cuối câu (`it wasn't unthinkable` → hoàn toàn có thể xảy ra / không phải chuyện không tưởng) và làm rõ nguy cơ bị phòng không phe mình bắn nhầm
  - segment_id: YS-LN02/Text/part0032.xhtml/p000168
    pronouns:
      controller_inclusive_we: chúng ta
      enemy: chúng
    terms:
      jamming: nhiễu
      superior: cấp trên (giữ chung, không suy diễn quân hàm)
      elites: tinh nhuệ (hoặc quân tinh nhuệ)
      large-scale imperial offensive: cuộc tiến công quy mô lớn của Đế quốc
    negation_and_modality: giữ phủ định hoàn thành (`vẫn chưa nhận diện được chúng`), nhận định dè dặt từ cấp trên (`có vẻ là tinh nhuệ`) và mệnh lệnh cảnh giác
  - segment_id: YS-LN02/Text/part0032.xhtml/p000169
    terms:
      Troops: Mọi người (hoặc Toàn đội)
      game faces on: nghiêm túc lên (giữ liên kết từ vựng với p000172)
    modality_and_logic: giữ lời cảm ơn của chỉ huy với đài điều khiển và khẩu lệnh đốc thúc đơn vị xuất phát
  - segment_id: YS-LN02/Text/part0032.xhtml/p000170
    pronouns:
      narrator_group: chúng tôi
    terms:
      commander: người chỉ huy
      vigilant warrior: chiến binh cảnh giác
    modality_and_logic: giữ tình thái mô tả phẩm chất nghe được trong giọng người chỉ huy (thể hiện mức độ căng thẳng vừa đủ của một chiến binh cảnh giác), không biến thành câu quy phạm `cần có`
  - segment_id: YS-LN02/Text/part0032.xhtml/p000171
    chronology_and_modality: giữ bước ngoặt hồi cố (`Nhưng đó chỉ là khi nhìn lại.`) nối giữa ấn tượng lúc xuất kích và nhận thức sau trận đánh
  - segment_id: YS-LN02/Text/part0032.xhtml/p000172
    pronouns:
      commander_and_superiors: Họ
      narrator_group: Chúng tôi
    negation_and_modality: giữ câu phủ định bác bỏ (`Họ đã sai. Chúng tôi không cần phải nghiêm túc lên.`) và nghịch lý sống chết ở câu thứ ba
  - segment_id: YS-LN02/Text/part0032.xhtml/p000173
    pronouns:
      inclusive_unit: Chúng ta
    terms:
      All hands: Toàn thể đơn vị
      battalion commander: tiểu đoàn trưởng (chức vụ, không thêm quân hàm)
      Prepare to engage: Chuẩn bị giao chiến
    modality_and_logic: giữ đúng mệnh lệnh thông báo phát hiện địch và chuẩn bị giao chiến qua vô tuyến
  - segment_id: YS-LN02/Text/part0032.xhtml/p000174
    pronouns:
      narrator_group: chúng tôi
    modality_and_logic: giữ quan hệ nguyên nhân bóng tối làm thu hẹp tầm nhìn của cả hai bên và gây bất lợi cho đơn vị người kể
  - segment_id: YS-LN02/Text/part0032.xhtml/p000175
    pronouns:
      both_units_or_narrator_unit: Chúng tôi
    terms:
      battalion commanders: các tiểu đoàn trưởng
      Republican mage doctrine: học thuyết tác chiến của pháp sư Cộng hòa
      imperial mages: pháp sư Đế quốc
      organized combat: tác chiến có tổ chức
      disciplined fire: hỏa lực kỷ luật
    chronology_and_modality: giữ tính đồng thời (`gần như đồng thời`, `gần như cùng lúc`) và nội dung học thuyết tác chiến nhóm áp đảo sức mạnh cá nhân
  - segment_id: YS-LN02/Text/part0032.xhtml/p000176
    terms:
      encounter battle: trận chạm trán (hoặc trận tao ngộ chiến)
      jamming: nhiễu
      mana density: mật độ mana
    modality_and_logic: giữ hai yếu tố định hình tình huống là trận chạm trán bất ngờ tại khu vực địch tiến vào và nhiễu mạnh do mật độ mana cao
  - segment_id: YS-LN02/Text/part0032.xhtml/p000177
    pronouns:
      narrator_group: chúng tôi
    terms:
      veteran mages: các pháp sư kỳ cựu
      close-quarters fighting: cận chiến
    negation_and_modality: giữ ước tính dè dặt rằng trận đánh khác hẳn những gì đơn vị quen đối phó và mô tả năng lực cận chiến của đối phương
  - segment_id: YS-LN02/Text/part0032.xhtml/p000178
    terms:
      Dacia: Dacia
      Norden: Norden
    negation_and_modality: giữ phủ định tuyệt đối (`Không đơn vị bình thường nào có thể hứng trọn...`) và giữ nguyên hai địa danh `Dacia`, `Norden`
  - segment_id: YS-LN02/Text/part0032.xhtml/p000179
    terms:
      vanguard: đội tiên phong
      rear guard: đội hậu vệ
    chronology_and_modality: giữ nguyên hai giả định trái thực tế trong quá khứ (`Nếu... có lẽ... đã có thể... Hoặc nếu... có thể đã...`) phản ánh cái nhìn hồi cố sau khi cả hai bộ phận đều không kịp thoát
term_recommendations:
  - source_term: recon-in-force units
    recommended_vi: các đơn vị trinh sát chiến đấu
    alternatives_vi:
      - các đơn vị trinh sát hỏa lực
      - các đơn vị trinh sát vũ trang
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000153
    rationale: >-
      Kế thừa nhất quán phương án tạm từ B06; diễn đạt đúng bản chất trinh sát kèm giao
      chiến thăm dò mà không thu hẹp thành phương thức hỏa lực cụ thể.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: get enemy engagements done quietly
    recommended_vi: giải quyết êm thấm các cuộc giao chiến với địch
    alternatives_vi:
      - cho xong các cuộc chạm trán với địch một cách êm thấm
      - kết thúc êm xuôi các cuộc giao chiến với địch
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000153
    rationale: >-
      Biểu thị mong muốn ca trực đêm trôi qua gọn lẹ, không biến thành giao tranh lớn;
      tránh dịch là `âm thầm giao chiến` dễ gây hiểu nhầm thành chiến thuật đánh lén.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: offensive / large-scale imperial offensive
    recommended_vi: cuộc tiến công / cuộc tiến công quy mô lớn của Đế quốc
    alternatives_vi:
      - cuộc tấn công / cuộc tấn công quy mô lớn của Đế quốc
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000156
      - YS-LN02/Text/part0032.xhtml/p000168
    rationale: >-
      Phân biệt rõ `offensive` nói chung ở p000156 với `large-scale ... offensive` ở
      p000168, tránh gán sẵn chữ `tổng` làm trùng nét nghĩa khi đi kèm `quy mô lớn`.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: standby unit is scrambled
    recommended_vi: đơn vị dự bị được lệnh xuất kích
    alternatives_vi:
      - đơn vị trực chiến được lệnh xuất kích khẩn cấp
      - đơn vị chờ lệnh được điều xuất kích khẩn cấp
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000157
    rationale: >-
      Giữ nghĩa điều động khẩn cấp đơn vị đang trực chờ khi phòng tuyến thứ hai bị vượt
      qua mà không tự gán biên chế không quân cố định.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: controller
    recommended_vi: sĩ quan điều khiển
    alternatives_vi:
      - đài điều khiển
      - điều phối viên tác chiến
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000159
    rationale: >-
      Giữ nhất quán với lựa chọn tạm từ B06 cho người dẫn đường/điều phối qua vô tuyến
      (`the controller's voice`), trung tính về quân hàm.
    uncertainty: medium
    status: pending
    non_canon: true
  - source_term: the Rhine general headquarters
    recommended_vi: Tổng hành dinh Rhine
    alternatives_vi:
      - Bộ tổng chỉ huy Rhine
      - Bộ chỉ huy chung mặt trận Rhine
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000161
    rationale: >-
      Bám sát `general headquarters` mà không tự thêm cấp biên chế `Tập đoàn quân` chưa
      được nêu trong câu nguồn.
    uncertainty: medium
    status: pending
    non_canon: true
  - source_term: radio operators
    recommended_vi: nhân viên thông tin vô tuyến
    alternatives_vi:
      - lính thông tin vô tuyến
      - nhân viên vô tuyến
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000162
    rationale: >-
      Nguồn chỉ định rõ `radio` (vô tuyến); không dùng `điện báo viên` (telegraph) để
      tránh lệch phương tiện thông tin trong bối cảnh nhiễu ma thuật.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: heads would roll
    recommended_vi: bị cách chức
    alternatives_vi:
      - mất chức
      - bị kỷ luật nặng
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000162
    rationale: >-
      Thành ngữ chỉ việc sĩ quan cấp cao phải chịu trách nhiệm và mất chức vì phản ứng
      chậm trễ; `bị cách chức` tự nhiên và đúng sắc thái quân sự.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: vanguard / rear guard
    recommended_vi: đội tiên phong / đội hậu vệ
    alternatives_vi:
      - bộ phận tiền vệ / bộ phận hậu vệ
      - toán đi đầu / toán bọc hậu
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000179
    rationale: >-
      Trong p000179, `rear guard` đặt đối xứng trực tiếp với `vanguard` như hai bộ phận
      đội hình có pháp sư chiến đấu và yểm trợ lẫn nhau rút lui, nên cặp `đội tiên phong /
      đội hậu vệ` rõ nghĩa đội hình chiến thuật hơn cách dịch vị trí thuần túy `tuyến sau`.
    uncertainty: low
    status: pending
    non_canon: true
  - source_term: Dacia / Norden
    recommended_vi: Dacia / Norden
    alternatives_vi: []
    segment_ids:
      - YS-LN02/Text/part0032.xhtml/p000178
    rationale: >-
      Giữ nguyên dạng Latin của địa danh theo thông lệ hiện hành khi chưa có quyết định
      canon hóa khác.
    uncertainty: low
    status: pending
    non_canon: true
