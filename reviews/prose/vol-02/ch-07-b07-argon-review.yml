risks:
  - >-
    Đoạn p000160 có thẻ `<html:em>` cho hai câu đầu nhưng bản dịch hiện tại chưa bọc
    `*...*`; cần sửa trước khi chuyển sang bước chuốt văn để không vi phạm `DEC-P01-002`.
  - >-
    Đoạn p000161 cần khóa chặt đại từ `chúng` cho tiểu đoàn pháp sư địch để không gây
    hiểu nhầm chủ thể nắm tin tình báo là Tổng hành dinh Rhine.
