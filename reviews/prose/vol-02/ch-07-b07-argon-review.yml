locked_choices:
  - segment_id: YS-LN02/Text/part0032.xhtml/p000153
    narrator_viewpoint: ngôi thứ nhất số nhiều (`chúng tôi`) của pháp sư đánh chặn Cộng hòa
    terms:
      recon-in-force units: các đơn vị trinh sát chiến đấu
      our interceptors: lực lượng đánh chặn của chúng tôi (hoặc các đơn vị đánh chặn của chúng tôi)
      get enemy engagements done quietly: giải quyết êm thấm các cuộc giao chiến với địch
    modality_and_logic: giữ quan hệ mức độ–hệ quả của các cuộc đụng độ nhỏ ban đêm diễn ra thường xuyên đến mức được ví đùa như một phần cảnh đêm
  - segment_id: YS-LN02/Text/part0032.xhtml/p000154
    pronouns:
      enemy: chúng
      defensive_line_personnel: mấy người ở tuyến phòng thủ
    modality_and_logic: giữ nguyên câu hỏi phàn nàn về tốc độ tiếp cận của địch và phản ứng của các tuyến phòng thủ
  - segment_id: YS-LN02/Text/part0032.xhtml/p000155
    pronouns:
      narrator_group: chúng tôi
      enemy_unit: chúng
    terms:
      third defensive line: tuyến phòng thủ thứ ba
      shelters: nơi trú ẩn (hoặc hầm trú ẩn)
      frontline command: sở chỉ huy tiền phương
    modality_and_logic: giữ suy luận từ việc địch đã vượt qua tuyến phòng thủ thứ ba và khả năng cao (`good chance`) chúng đã phát hiện nơi trú ẩn cùng sở chỉ huy tiền phương
