findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000230
    category: pronoun_and_pov_consistency
    issue: >-
      Trong các đoạn trần thuật ngôi thứ ba (`p000230`, `p000233`, `p000234`, `p000245`), bản dịch quy chiếu Tanya bằng `cô`, trong độc thoại nội tâm ngôi thứ nhất (`p000230`, `p000232`, `p000235`, `p000237`, `p000239`, `p000240`, `p000245`, `p000248`) dùng `tôi`, và trong lời Serebryakov báo cáo (`p000242`, `p000244`) dùng `bà` / `thưa bà` cho `you` / `ma'am`. Các lựa chọn này nhất quán trong phạm vi `b10`–`b11` (theo `handoffs/vol-02/ch-05-b10.yml`), nhưng khác với quy ước `nó` (ngôi 3 trần thuật) / `mình` (ngôi 1 độc thoại nội tâm) và `Thiếu tá` / `thưa Thiếu tá` (hoặc `cô` / `thưa cô`) ở các batch `ch-05-b01`..`b09`.
    basis: >-
      `canon/decisions.md` (`DEC-P01-001`) ghi rõ quy ước `nó`/`mình` áp dụng cho giai đoạn pilot-01 và không tự động suy rộng cho giai đoạn khác; trong `b10`, cặp `Tanya`/`cô` (ngôi 3) và `tôi`/`chúng tôi` (ngôi 1) phân tách rõ hai tầng giọng mà không gây nhầm chủ thể ở bất kỳ segment nào.
    recommendation: >-
      Không chặn signoff; có thể giữ nguyên theo quy ước nội bộ đã khóa ở `handoffs/vol-02/ch-05-b10.yml`, hoặc ở bước polish đồng bộ toàn chương với `ch-05-b01`..`b09` (`nó` cho ngôi 3 trần thuật, `mình` cho độc thoại nội tâm ngôi 1, và `Thiếu tá` / `thưa Thiếu tá` hoặc `cô` / `thưa cô` cho `ma'am` ở `p000242`, `p000244`).
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000231
    category: lexical_nuance
    issue: >-
      Cụm `giấy gọi nhập ngũ` dịch chức năng của `red slips` (tờ giấy báo triệu tập nhập ngũ màu đỏ) nhưng lược mất sắc thái thị giác/biểu tượng màu sắc của nguyên văn.
    basis: >-
      Không làm sai lệch logic lập luận về chi phí phát hành giấy gọi nhập ngũ so với giá mạng lính bộ binh; đã được ghi nhận trong `notes` của segment và `R01` của báo cáo hậu kiểm trước đó.
    recommendation: >-
      Có thể giữ nguyên `giấy gọi nhập ngũ` hoặc tinh chỉnh nhẹ thành `giấy gọi nhập ngũ màu đỏ` ở bước polish.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000243
    category: modality_degree
    issue: >-
      Cụm `điều hành tiểu đoàn sao cho hiệu quả về chi phí` giữ đúng hướng nghĩa quản trị chi phí của nguyên văn nhưng hơi làm dịu sắc thái so sánh bậc nhất về mức độ tối ưu chi phí.
    basis: >-
      Vẫn bảo toàn đầy đủ mạch nhân quả giải thích vì sao Tanya không hiểu nổi quyết định bổ sung tân binh khi tiểu đoàn chưa hề có thương vong (`p000243`).
    recommendation: >-
      Có thể giữ nguyên hoặc chỉnh nhẹ thành `điều hành tiểu đoàn sao cho đạt hiệu quả cao nhất về chi phí` ở bước polish.
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000251
    category: aspect_nuance
    issue: >-
      Cụm `đang được điều đến Bộ chỉ huy làm quan sát viên ở Rhine` có thể gợi nét hành động thuyên chuyển đang diễn ra, trong khi nguyên văn thiên về trạng thái hiện đang được biệt phái/gắn với Bộ chỉ huy làm quan sát viên tại Rhine.
    basis: >-
      Không ảnh hưởng đến nội dung cốt lõi của đoạn đối thoại (người bạn đồng khóa cùng phân khu nhưng khác địa bàn vẫn gửi thư cá nhân báo tin đồn điều chuyển).
    recommendation: >-
      Có thể giữ nguyên hoặc chỉnh nhẹ thành `hiện được biệt phái về Bộ chỉ huy làm quan sát viên ở Rhine` ở bước polish.
    resolution: optional_polish

