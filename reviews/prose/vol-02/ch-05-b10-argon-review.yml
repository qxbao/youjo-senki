    pronouns_and_address: "Độc thoại nội tâm khái quát."
    pov_and_voice: "Giọng bình luận kinh tế vĩ mô của Tanya."
    modality_and_logic: "Giữ đúng nhận định châm biếm rằng tổ hợp công nghiệp – quân sự chắc hẳn đang cười tít mắt vì lợi nhuận."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000237
    terms:
      - "Grupper"
      - "mua sắm đặc biệt"
    pronouns_and_address: "Độc thoại nội tâm dùng `tôi`."
    pov_and_voice: "Giọng nhà đầu tư tiếc nuối cơ hội kiếm lời."
    modality_and_logic: "Bảo toàn điều kiện giả định trái thực tế: nếu biết trước có đợt mua sắm đặc biệt thời chiến thế này thì đã dốc sạch tiền mua cổ phiếu Grupper."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000238
    terms: []
    pronouns_and_address: "Độc thoại nội tâm ẩn chủ ngữ."
    pov_and_voice: "Giọng suy tính thị trường chứng khoán."
    modality_and_logic: "Giữ đúng phán đoán chắc chắn rằng cổ phiếu công nghiệp quốc phòng đã tăng vọt."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000239
    terms:
      - "công ty quân sự tư nhân"
    pronouns_and_address: "Độc thoại nội tâm dùng `tôi`."
    pov_and_voice: "Giọng doanh nhân hiện đại của Tanya."
    modality_and_logic: "Bảo toàn ước muốn giả định: với lượng cầu lớn thế này, Tanya ước gì mình có thể lập một công ty quân sự tư nhân."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000240
    terms:
      - "Cộng hòa"
    pronouns_and_address: "Độc thoại nội tâm trực tiếp dùng `tôi`."
    pov_and_voice: "Độc thoại nội tâm in nghiêng toàn đoạn; giọng bức xúc vì sự bất cân xứng giữa ngân sách ném vào đạn pháo và tiền lương bản thân."
    modality_and_logic: "Bảo toàn trọn vẹn 3 câu độc thoại nội tâm: so sánh việc ném tiền bắn đạn pháo sang Cộng hòa như nước lã với mức lương bèo bọt của mình và tự hỏi ngân sách chạy đi đâu (đã sửa lỗi nối gộp câu ở vòng trước)."
    emphasis: "Bảo toàn chính xác 1 cặp `*...*` bao quanh toàn bộ đoạn tương ứng `<html:em>` của nguồn."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000241
    terms:
      - "Đế quốc"
      - "Tanya"
      - "Trung úy Serebryakov"
    pronouns_and_address: "Trần thuật ngôi thứ ba gọi `Tanya` và `Trung úy Serebryakov`."
    pov_and_voice: "Giọng trần thuật chuyển cảnh từ dòng suy nghĩ miên man của Tanya sang báo cáo hành chính thực tế."
    modality_and_logic: "Bảo toàn chính xác nghĩa `thông báo hành chính` (administrative announcement) của Trung úy Serebryakov cắt ngang dòng suy nghĩ về chi tiêu quân sự của Đế quốc (đã sửa lỗi dịch lệch sang thông báo của chính quyền ở vòng trước)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000242
    terms:
      - "Thiếu tá"
      - "Bộ chỉ huy tập đoàn quân"
    pronouns_and_address: "Serebryakov gọi Tanya là `Thiếu tá`, xưng `tôi` - gọi `bà`."
    pov_and_voice: "Giọng báo cáo quân vụ nghiêm túc, chuẩn mực của phó quan Serebryakov."
    modality_and_logic: "Giữ đúng nội dung báo cáo: đã nhận được thông báo bổ sung nhân sự từ Bộ chỉ huy tập đoàn quân."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000243
    terms:
      - "Tanya"
      - "mặt trận Rhine"
      - "Trung úy Serebryakov"
    pronouns_and_address: "Trần thuật hạn tri dùng `Tanya`; trong lời thoại gọi `Trung úy Serebryakov`, xưng `chúng ta`."
    pov_and_voice: "Giọng chỉ huy thực dụng, ngạc nhiên vì được nhận tân binh khi chưa có hao hụt quân số."
    modality_and_logic: "Bảo toàn câu hỏi xác nhận không có thương vong và mạch lý giải rằng Tanya vốn định điều hành tiểu đoàn hiệu quả về chi phí ở mặt trận Rhine điên loạn này nên không hiểu nổi thông báo của cấp trên."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000244
    terms: []
    pronouns_and_address: "Serebryakov đáp `thưa bà` (`ma'am`)."
    pov_and_voice: "Giọng báo cáo ngắn gọn, rõ ràng của phó quan."
    modality_and_logic: "Xác nhận không có ai tử trận và bổ sung thông tin có một số tân binh sắp được điều tới."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000245
    terms:
      - "Bộ chỉ huy"
      - "Trung úy Serebryakov"
      - "tiểu đoàn tăng cường"
    pronouns_and_address: "Tanya xưng `tôi` / `chúng ta`, gọi `Trung úy Serebryakov`; câu trần thuật cuối dùng `của cô`."
    pov_and_voice: "Giọng Tanya suy đoán nguyên nhân hành chính của quyết định bổ sung quân và bỏ lửng câu nói khi chưa rõ ý đồ của Bộ chỉ huy."
    modality_and_logic: "Bảo toàn câu hỏi có phải lệnh điều động từ trước không, câu bỏ lửng ở cuối lời thoại, và chi tiết Serebryakov nghiêng đầu khó hiểu trước lời lẩm bẩm của Tanya."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000246
    terms:
      - "Thiếu tá"
    pronouns_and_address: "Serebryakov gọi `Thiếu tá`, dùng `chúng ta`."
    pov_and_voice: "Giọng Serebryakov dè dặt nêu giả thuyết giải thích lệnh bổ sung quân."
    modality_and_logic: "Giữ đúng lập luận suy đoán: vì tiểu đoàn được tổ chức vội vã nên có lẽ đây là quân số chi viện đáng lẽ phải nhận từ trước."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000247
    terms: []
    pronouns_and_address: "Tanya đối thoại ngắn, không dùng đại từ trực tiếp."
    pov_and_voice: "Giọng chỉ huy điềm tĩnh nhưng cảnh giác trước sự bất thường của bộ máy quan liêu."
    modality_and_logic: "Giữ đúng hai vế: có khả năng như vậy, nhưng thời điểm lại quá kỳ quặc."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000248
    terms:
      - "Tanya"
      - "Thực thể X"
      - "Thiếu tá"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng `Tanya`; độc thoại nội tâm dùng `tôi`; lời thoại của Serebryakov ở cuối đoạn dùng `tôi` và gọi `Thiếu tá`."
    pov_and_voice: "Chuyển mượt từ nỗi nghi kỵ âm mưu của Thực thể X trong đầu Tanya sang lời bắt chuyện dè dặt của Serebryakov."
    modality_and_logic: "Bảo toàn nguyên nhân Tanya sinh nghi (từng bị số phận trêu ngươi vô số lần), nỗi lo có bàn tay thao túng của Thực thể X, và câu rào đón dựa trên tin đồn của Serebryakov."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000249
    terms:
      - "đơn vị huấn luyện"
    pronouns_and_address: "Tanya hỏi ngắn gọn, lược đại từ chủ ngữ để giữ nhịp hội thoại tự nhiên."
    pov_and_voice: "Giọng cấp trên hỏi dò nguồn tin của cấp dưới."
    modality_and_logic: "Giữ đúng câu hỏi suy đoán nguồn tin đồn đến từ đơn vị huấn luyện ở hậu phương của Serebryakov."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000250
    terms:
      - "Trung úy Serebryakov"
      - "Tanya"
    pronouns_and_address: "Trần thuật ngôi thứ ba dùng `Trung úy Serebryakov` và `Tanya`."
    pov_and_voice: "Giọng trần thuật khách quan mô tả nét lúng túng của Serebryakov trước khi trả lời."
    modality_and_logic: "Giữ đúng chi tiết Serebryakov thoáng ngập ngừng khi bị hỏi về nguồn tin."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000251
    terms:
      - "Thiếu tá"
      - "Bộ chỉ huy"
      - "Rhine"
      - "Trường Thiếu sinh quân"
    pronouns_and_address: "Serebryakov thưa `Không, thưa Thiếu tá`, xưng `tôi`."
    pov_and_voice: "Giọng Serebryakov thành thật giải thích nguồn tin cá nhân nhưng vẫn giữ lễ tiết quân đội."
    modality_and_logic: "Bảo toàn đầy đủ thông tin: nguồn tin từ bạn cùng lớp hiện làm quan sát viên ở Rhine thuộc Bộ chỉ huy (cùng phân khu nhưng khác địa bàn), qua thư cá nhân nhắc tới khả năng người quen từ Trường Thiếu sinh quân được điều về đơn vị."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0026.xhtml/p000252
    terms: []
    pronouns_and_address: "Serebryakov xưng `tôi`, gọi các tân binh là `họ`."
    pov_and_voice: "Giọng báo cáo kết thúc mạch đối thoại của Serebryakov."
    modality_and_logic: "Giữ đúng kết luận suy đoán của Serebryakov rằng đợt bổ sung này có lẽ là các học viên thiếu sinh quân đó."
    emphasis: "none"
