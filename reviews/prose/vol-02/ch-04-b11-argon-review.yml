    pronouns_and_address: []
    pov_and_logic:
      - Giữ thuật ngữ "quay về căn cứ" (`vol02-ch04-b11-rtb`) kèm ký hiệu chú thích `¹³` đúng vị trí và sự phân định ưu tiên ("Giao chiến với các tàu chỉ là mục tiêu phụ.")
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000019
    names_and_ranks:
      - search and destroy mission -> phần việc tìm kiếm và tiêu diệt
      - Entente Alliance -> Liên minh Entente
      - Northern Sea Fleet -> Hạm đội Biển Bắc
    pronouns_and_address:
      - Độc thoại nội tâm dùng "mình" cho cá nhân Tanya (DEC-P01-001) và "chúng ta" / "ta" cho đơn vị
    pov_and_logic:
      - Giữ điều kiện hoàn thành nhiệm vụ theo cách tính của Tanya (chỉ cần bắn trả là coi như xong phần việc tìm kiếm và tiêu diệt) và việc đẩy trách nhiệm tiêu diệt tàu Liên minh Entente sang cho Hạm đội Biển Bắc
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000020
    names_and_ranks:
      - First Company -> Đại đội Một
    pronouns_and_address:
      - Khẩu lệnh trực tiếp của Tanya gọi "Đại đội Một"
    pov_and_logic:
      - Giữ giọng khích tướng của Tanya thúc giục Đại đội Một bắt tay vào việc nếu không muốn bị gọi là lũ vô tích sự
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000021
    names_and_ranks:
      - air-to-ground attacks -> những đợt tấn công từ trên không xuống mặt đất
      - intercepting shots -> những phát đạn đánh chặn
    pronouns_and_address:
      - Độc thoại nội tâm dùng "Bọn mình" / "bọn mình" cho tập thể đại đội và "mình" cho cá nhân Tanya theo đúng DEC-P01-001 và bản sửa M3
    pov_and_logic:
      - Giữ chi tiết tăng tốc bổ nhào, sự khó chịu do hơi ẩm từ mặt nước kết hợp với trời mưa khác hẳn các đợt tấn công từ trên không xuống mặt đất, và việc đạn đánh chặn bay sượt qua không trúng Tanya đúng như dự đoán
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000022
    names_and_ranks:
      - company -> đại đội
    pronouns_and_address:
      - Độc thoại nội tâm dùng "mình" (DEC-P01-001)
    pov_and_logic:
      - Giữ sự kết nối logic với nguyên lý bắn đón ở b09: trừ phi địch kém cỏi hết thuốc chữa thì những người bay phía sau Tanya trong đại đội đang gặp nguy hiểm, kèm nhận xét thực dụng rằng dùng cấp dưới làm mồi nhử để sống sót và thăng tiến là hằng số trong cả doanh nghiệp lẫn quân đội
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000023
    names_and_ranks:
