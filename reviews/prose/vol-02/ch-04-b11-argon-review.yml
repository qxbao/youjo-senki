    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000017
    names_and_ranks:
      - fleet -> hạm đội
      - enemy fleet -> hạm đội địch
      - submarines -> tàu ngầm
      - the brass -> cấp trên
    pronouns_and_address:
      - Độc thoại nội tâm của Tanya tự quy chiếu cá nhân bằng "Mình" (DEC-P01-001), quy chiếu tập thể đơn vị/phe Đế quốc bằng "ta" / "chúng ta", quy chiếu các thuộc cấp đang cầm chân pháp sư địch bằng "họ", và quy chiếu pháp sư địch bằng "chúng"
    pov_and_logic:
      - Giữ trọn lập luận tính công trạng của Tanya: dù khó cầm chân địch đến khi hạm đội ta tới nhưng thuộc cấp chắc chắn sẽ được thưởng vì đẩy nhanh việc tiêu hao địch; đơn vị đã lập công lớn khi định vị được hạm đội địch và phối hợp với tàu ngầm phe ta, nên chỉ cần báo cáo với cấp trên rằng đã làm hết sức bằng quyết định chớp nhoáng
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000018
    names_and_ranks:
