    pov_and_logic:
      - Giữ bản sửa M1 "thuật thức" (`vol02-ch04-b11-formulas`) trong mệnh lệnh triển khai thuật thức
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000024
    names_and_ranks:
      - destroyer -> khu trục hạm
    pronouns_and_address:
      - Độc thoại nội tâm dùng "mình" (DEC-P01-001) và quy chiếu pháp sư thuộc cấp trúng đạn ở b10 p000232 bằng "gã vừa bị bắn trúng lúc nãy"
    pov_and_logic:
      - Giữ sự ngạc nhiên tích cực của Tanya khi trái với dự tính là không ai bị loại khỏi vòng chiến, cùng suy đoán hợp lý rằng vì mục tiêu chỉ là một khu trục hạm nên người bị bắn trúng lúc nãy có lẽ chỉ là trường hợp hiếm hoi
    emphasis: none
  - segment_id: YS-LN02/Text/part0024.xhtml/p000025
    names_and_ranks:
