  - id: vol02-ch04-b11-tanya-pronouns-pov-shifts-and-emphasis
    source_term: Tanya third-person narration pronouns (p000002–p000006), intra-paragraph POV shift in p000003, Tanya first-person interior monologue pronouns (p000003, p000004, p000009–p000011, p000014, p000017, p000019, p000021, p000022, p000024), spoken self-talk and command/subordinate radio dialogue pronouns (p000004, p000012, p000013, p000015, p000016, p000020, p000023), enemy mage reference (p000001–p000003), and emphasis spans
    proposed_vi: >-
      trong phần trần thuật ngôi thứ ba bám sát điểm nhìn Tanya ở đầu lô
      (p000002–p000006), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại
      từ “nó” / “Nó” kết hợp đại từ phản thân “mình” theo DEC-P01-001 (tuyệt đối
      không dùng “cô”; lưu ý từ “nó” thứ hai ở câu cuối p000003 quy chiếu “cái
      xác”, ở p000004 quy chiếu “khẩu tiểu liên tiêu chuẩn”, và ở p000010 quy
      chiếu “khu trục hạm”); bảo toàn chính xác sự đan xen ngôi kể trong cùng
      đoạn tại p000003 và p000004 từ ngôi thứ ba (“Nó” / “Tanya”) sang độc thoại
      nội tâm ngôi thứ nhất (“Mình” / “mình” / “chính mình”); trong toàn bộ chuỗi
      độc thoại nội tâm ngôi thứ nhất của Tanya (p000003, p000004, p000009–p000011,
      p000014, p000017, p000019, p000021, p000022, p000024), tự quy chiếu số ít
      nhất quán bằng “mình” / “Mình” và quy chiếu tập thể đơn vị bằng “Bọn mình”
      / “bọn mình” (p000021 — xác nhận bản sửa M3) hoặc “ta” / “chúng ta”
      (p000017, p000019) theo DEC-P01-001; quy chiếu viên pháp sư địch bị thương
      nặng ở đầu lô (Anson Sue, nối tiếp cuối b10) bằng “Tên lính địch” và “hắn”
      (p000002, p000003); trong lời lẩm bẩm và tự khích lệ thành tiếng của Tanya
      dùng “ta” (p000004) và “Mình” (p000012); trong giao tiếp vô tuyến tác chiến
      (p000013, p000015, p000016, p000020, p000023), dùng câu khẩu lệnh ngắn gọn
      lược chủ ngữ hoặc gọi “Đại đội Một” / “Tất cả”, giữ nguyên ba lớp dấu ngoặc
      kép `“““Rõ!”””` tại p000016; bảo toàn chính xác 2 phạm vi nhấn mạnh
      Markdown `*...*` tại p000002 và p000004 cùng các ký hiệu chú thích `¹²`
      (p000006) và `¹³` (p000018) theo DEC-P01-002
    alternatives_vi:
      - mình (thay cho “ta” trong câu lẩm bẩm một mình của Tanya ở cuối p000004)
      - lặp danh từ “cái xác” thay cho từ “nó” thứ hai ở câu cuối p000003
