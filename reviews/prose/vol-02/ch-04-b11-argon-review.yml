      - Độc thoại nội tâm tự quy chiếu bằng "mình" (DEC-P01-001), quy chiếu pháp sư thủy quân lục chiến địch bằng "Họ" và các tàu địch bằng "chúng"
    pov_and_logic:
      - Giữ bản sửa M2 "các pháp sư thủy quân lục chiến" (`vol02-ch04-b11-marine-mages`), chi tiết đối phương hạ độ cao để xử lý tàu ngầm giúp Tanya rảnh tay bổ nhào mà không sợ bị đánh úp từ trên cao, và nhận định trên danh nghĩa chỉ đến để quấy nhiễu nên tình thế quá hoàn hảo
    emphasis: none
