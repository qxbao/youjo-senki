findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0028.xhtml/p000012
    category: rank_terminology_consistency
    issue: >-
      Tại `p000012`, quân hàm `Magic Second Lieutenant Grantz` đang được dịch là `Thiếu úy Pháp sư Grantz` (đồng bộ với `ch-05-b24` `p000620`, trong khi `chapter1_b01_pending_terms` trong `work/run-state/pending-terms.yml` và `ch-05-b18`–`b19` dùng `Thiếu úy ma pháp` / `Thiếu úy Ma pháp`); bên cạnh đó, tại `p000033`, `p000036` và `p000037`, danh xưng `Lieutenant Serebryakov` / `Lieutenant` (nguyên văn chỉ ghi cấp úy chung, không nêu rõ tiểu cấp) đang được dịch là `Trung úy Serebryakov` / `thưa Trung úy` (trong khi `ch-05-b17` `p000428` và `ch-05-b18` `p000440` dùng cách dịch trung tính `Sĩ quan cấp úy Serebryakov`, còn tiểu cấp cụ thể của Serebryakov ở giai đoạn Tập 2 là `Thiếu úy`).
    basis: >-
      Cách dịch `Thiếu úy Pháp sư Grantz` hoàn toàn rõ nghĩa và thống nhất trực tiếp với `ch-05-b24` (`p000620`); đối với `Lieutenant Serebryakov`, phương án `Trung úy Serebryakov` nằm trong nhóm phương án thay thế đã ghi nhận tại `vol02-ch05-b17-lieutenant-serebryakov` và giữ mạch đối thoại quân ngũ tự nhiên trong toàn bộ phân cảnh `p000033`–`p000037`.
    recommendation: >-
      Không chặn signoff; ở bước polish hoặc rà soát thuật ngữ toàn tập có thể cân nhắc đồng bộ `Thiếu úy Pháp sư Grantz` tại `p000012` thành `Thiếu úy ma pháp Grantz` (hoặc `Thiếu úy Ma pháp Grantz`) và đối chiếu cấp bậc của Serebryakov xuyên suốt Tập 2 để thống nhất thành `Thiếu úy Serebryakov` / `thưa Thiếu úy` tại `p000033`, `p000036`, `p000037`.
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0028.xhtml/p000002
    category: monologue_pronoun_consistency
    issue: >-
      Tại câu độc thoại nội tâm in nghiêng ở `p000002` (`*Con người vẫn phải ăn, kể cả vào những lúc thế này. Cũng giống như lúc tôi kiệt sức ở học viện mà vẫn phải ép thức ăn xuống cổ họng.*`), bản dịch đang dùng đại từ ngôi thứ nhất `tôi`, trong khi các câu độc thoại nội tâm in nghiêng và lời tự nhủ tiếp theo của Grantz trong cùng lô (`p000007` `*Mình có thể cười.*`, `p000009` `“Ôi, mình không thể đến muộn được.”`, `p000015` `*Mình đến muộn rồi sao?*`) đều dùng `Mình` / `mình`.
    basis: >-
      Toàn bộ lô `ch-05-b25` được trần thuật ở ngôi thứ nhất (`Tôi` / `tôi`) dưới điểm nhìn của Warren Grantz (không thuộc phạm vi quy ước đại từ trần thuật Tanya của `DEC-P01-001`), nên việc dùng `tôi` ở câu tự nhủ đầu tiên ngay sau mệnh đề tự sự ngôi thứ nhất ở `p000001` vẫn hoàn toàn tự nhiên và rõ điểm nhìn.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc đổi `tôi` trong phần in nghiêng tại `p000002` thành `mình` (`*...Cũng giống như lúc mình kiệt sức ở học viện mà vẫn phải ép thức ăn xuống cổ họng.*`) để đồng bộ hoàn toàn với `p000007`, `p000009` và `p000015`.
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0028.xhtml/p000024
    category: idiomatic_and_conversational_nuance
    issue: >-
      Tại câu cuối của `p000024`, thành ngữ tiếng Anh (`reap what you sow`) diễn tả tâm lý tự trào của Grantz rằng đã trót lơ ngơ bước nhầm vào phòng họp trong ngày nghỉ thì đành ngồi lại chịu trận luôn đang được dịch sát chữ là `Gieo gì gặt nấy mà.`; ngoài ra, tại `p000028`, câu đáp thông cảm của viên sĩ quan kỳ cựu khi nghe Grantz thú nhận chuyện mất hồn trong trận đầu (`that’s how it goes, I suppose`) đang dịch hơi sát cấu trúc tiếng Anh là `“Ừ, tôi đoán chuyện là vậy.”`.
    basis: >-
      Tại `p000024`, bản dịch đã tuân thủ đúng quy ước `direct-address choice` khi lược đại từ ngôi thứ hai phiếm chỉ và giữ sát nghĩa thành ngữ trong nguồn; tại `p000028`, thái độ đồng cảm, không trách cứ của các sĩ quan đàn anh vẫn thể hiện rõ nhờ mạch văn liền kề ở `p000029`–`p000031`.
    recommendation: >-
      Không chặn signoff; ở bước polish có thể cân nhắc chỉnh câu cuối `p000024` thành `Tự làm tự chịu thôi mà.` (hoặc `Trót đâm lao thì phải theo lao thôi.`) và làm mượt câu thoại `p000028` thành `“Ừ, chuyện thường tình ấy mà.”` (hoặc `“Ừ, lần đầu thì thường thế đấy.”`).
    resolution: optional_polish

