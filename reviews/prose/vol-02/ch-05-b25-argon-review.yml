      - "đại đội trưởng"
      - "sĩ quan chủ chốt"
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi`."
    pov_and_voice: "Tự sự ngôi thứ nhất ghi lại khung cảnh vắng vẻ bất thường trong phòng."
    modality_and_logic: "Bảo toàn quan hệ đối lập – ngoại trừ: khi đến nơi, ngoài vài đại đội trưởng và sĩ quan chủ chốt đang nhìn mình đầy khó hiểu thì các bàn đều trống không."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000015
    terms: []
    pronouns_and_address: "Câu hỏi nội tâm in nghiêng dùng `Mình`; phần tự sự tiếp theo dùng `tôi`."
    pov_and_voice: "Độc thoại nội tâm lo lắng chuyển sang sự bối rối khi đối chiếu đồng hồ."
    modality_and_logic: "Bảo toàn câu hỏi nội tâm sợ mình đến muộn, nối với chi tiết nhìn đồng hồ treo tường thì thấy thực ra vừa kịp đến sớm năm phút."
    emphasis: "Bảo toàn chính xác câu hỏi `*Mình đến muộn rồi sao?*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0028.xhtml/p000016
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất dùng đại từ bất định `mọi người`."
    pov_and_voice: "Tự sự ngôi thứ nhất nêu quy chuẩn giờ giấc thường ngày của đơn vị."
    modality_and_logic: "Bảo toàn tình thái quy chuẩn (`Đáng lẽ`): vào giờ đó mọi người phải có mặt đông đủ rồi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000017
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `mình tôi`."
    pov_and_voice: "Tự sự ngôi thứ nhất khẳng định sự bất thường của tình huống."
    modality_and_logic: "Bảo toàn phủ định nhấn mạnh: bình thường chẳng đời nào chỉ có một mình anh tất tả chạy đến đây."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000018
    terms: []
    pronouns_and_address: "Trung úy Weiss gọi nhóm tân binh của Grantz là `các cậu`."
    pov_and_voice: "Lời hỏi thăm giải thích nguyên nhân phòng học trống trải."
    modality_and_logic: "Bảo toàn cả câu hỏi có chuyện gì vậy và thông tin hôm nay nhóm của Grantz được nghỉ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000019
    terms:
      - "Trung úy Weiss"
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi` và quy chiếu `Trung úy Weiss` bằng `anh ấy`."
    pov_and_voice: "Tự sự ngôi thứ nhất ghi lại khoảnh khắc vỡ lẽ sau lời nhắc của Weiss."
    modality_and_logic: "Bảo toàn tình thái suy đoán (`hẳn đã hiểu`) và trình tự nhân quả: Trung úy Weiss hẳn đã hiểu vì sao Grantz bối rối, và nghe anh ấy nói xong Grantz mới nhận ra."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000020
    terms:
      - "Trung úy"
    pronouns_and_address: "Grantz thưa `Thưa Trung úy` và tự xưng `tôi`."
    pov_and_voice: "Giọng phân trần ngượng ngùng nhưng lễ phép của cấp dưới với cấp trên trực tiếp."
    modality_and_logic: "Bảo toàn lời thú nhận đầy xấu hổ rằng cứ tưởng hôm nay có giờ học."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000021
    terms:
      - "Trung úy Weiss"
      - "nghỉ phép"
      - "các sĩ quan cấp trên"
      - "ngày nghỉ"
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi` / `chúng tôi`, quy chiếu các sĩ quan cấp trên bằng `họ`."
    pov_and_voice: "Tự sự ngôi thứ nhất giải thích sự hiểu lầm trớ trêu nhưng hợp lý giữa hai bên."
    modality_and_logic: "Bảo toàn đầy đủ 4 câu: có lẽ cú sốc tối qua quá lớn nên lời dặn không lọt vào đầu; Trung úy Weiss nhăn mặt giải thích rằng sau khi về căn cứ cả bọn đã được cho nghỉ phép; sáng nay đầu óc mải nghĩ chuyện khác nên lảo đảo thức dậy nhưng họ lại tưởng anh thong thả ăn sáng tận hưởng ngày nghỉ; nói cách khác các sĩ quan cấp trên nghĩ anh đang thư thả dùng bữa sáng trong ngày nghỉ nên không đến kiểm tra."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000022
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi`."
    pov_and_voice: "Lời tự trách ngắn gọn."
    modality_and_logic: "Bảo toàn tình thái tiếc nuối quá khứ: lẽ ra phải nhận ra sớm hơn."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000023
    terms: []
    pronouns_and_address: "Grantz tự xưng `Tôi`."
    pov_and_voice: "Lời xin lỗi ngắn gọn vì đã làm phiền các sĩ quan."
    modality_and_logic: "Bảo toàn câu thoại `“Tôi xin lỗi.”`."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000024
    terms:
      - "cuộc đột kích"
      - "Trung úy Weiss"
      - "sĩ quan"
    pronouns_and_address: "Trong thoại, Trung úy Weiss tự xưng `tôi` và gọi Grantz là `cậu`; trong tự sự, Grantz dùng `tôi`; câu cuối lược đại từ ngôi thứ hai phiếm chỉ theo quy ước `direct-address choice`."
    pov_and_voice: "Thái độ cởi mở, thân tình của Trung úy Weiss và quyết định ngồi lại trò chuyện của Grantz."
    modality_and_logic: "Bảo toàn trọn vẹn 5 câu: Weiss xua tay bảo không sao và tiện đang ở đây thì kể xem nghĩ thế nào về cuộc đột kích vừa nói vừa chỉ ghế ngồi; các sĩ quan khác không phiền nên Grantz quyết định nhập hội; tự nhủ đây cũng là dịp tốt và chốt bằng câu thành ngữ chấp nhận hoàn cảnh (xem thêm finding `m3`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000025
    terms:
      - "căn cứ"
    pronouns_and_address: "Grantz tự xưng `tôi`."
    pov_and_voice: "Lời thú nhận thật thà của tân binh sau trận thực chiến đầu đời."
    modality_and_logic: "Bảo toàn cả 2 câu: thành thật mà nói lúc ấy cứ như người mất hồn; đến khi nhận ra thì đã về tới căn cứ rồi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000026
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi`, lược chủ ngữ đại từ ngôi thứ hai ở mệnh đề điều kiện (`nếu hỏi tôi`)."
    pov_and_voice: "Tự sự ngôi thứ nhất bổ sung lý giải cho câu trả lời ở `p000025`."
    modality_and_logic: "Bảo toàn quan hệ nhân quả và đối lập qua 2 câu: vì không muốn chết nên hoàn toàn dồn tâm trí vào hành động; nhưng nếu hỏi thực sự đã làm gì thì ký ức lại rất mơ hồ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000027
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi` và quy chiếu các sĩ quan bằng `họ`."
    pov_and_voice: "Tự sự ngôi thứ nhất thể hiện sự bộc trực của nhân vật."
    modality_and_logic: "Bảo toàn quan hệ nhượng bộ: dù thấy xấu hổ nhưng vẫn nói thật với họ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000028
    terms: []
    pronouns_and_address: "Viên sĩ quan tự xưng `tôi`."
    pov_and_voice: "Giọng đáp bình thản, từng trải của sĩ quan đàn anh."
    modality_and_logic: "Bảo toàn lời đồng tình rằng chuyện lần đầu ra trận như vậy là bình thường (xem thêm finding `m3`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000029
    terms: []
    pronouns_and_address: "Sĩ quan đàn anh gọi Grantz là `cậu`."
    pov_and_voice: "Lời khen ngợi và khích lệ thiết thực dành cho tân binh vừa qua lửa đạn."
    modality_and_logic: "Bảo toàn cả 2 câu: khen sống sót trở về là giỏi rồi; với trận vừa rồi làm trải nghiệm thực chiến đầu tiên thì lần sau hẳn sẽ dễ dàng hơn nhiều."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000030
    terms:
      - "sĩ quan"
      - "học viện"
      - "tiền tuyến"
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi` và quy chiếu các sĩ quan bằng `họ`; câu mắng giả định in nghiêng dùng cấu trúc mệnh lệnh không chủ ngữ."
    pov_and_voice: "Tự sự ngôi thứ nhất đối chiếu sự giáo điều ở học viện với chủ nghĩa thực tế nơi tiền tuyến."
    modality_and_logic: "Bảo toàn đầy đủ 3 câu cùng giả định trái thực tế quá khứ ở câu 2: các sĩ quan dường như không thật sự trách anh; nếu ở học viện hẳn đã bị mắng té tát bắt ra ngoài đó phải giữ cái đầu tỉnh táo; còn ở tiền tuyến họ thực tế hơn và ghi nhận việc anh đã sống sót."
    emphasis: "Bảo toàn chính xác câu mắng giả định `*Ra ngoài đó thì phải tỉnh táo lên chứ!*` tương ứng thẻ `<html:em>` theo đúng `DEC-P01-002`."

  - segment_id: YS-LN02/Text/part0028.xhtml/p000031
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `tôi` và quy chiếu các sĩ quan bằng `họ`."
    pov_and_voice: "Sự ngạc nhiên ấm lòng của Grantz trước thái độ ân cần của các bậc đàn anh."
    modality_and_logic: "Bảo toàn phép so sánh giả định: thật ra họ còn đối xử tử tế với anh, như thể sự quan tâm chu đáo là chuyện thường tình."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000032
    terms:
      - "khóa huấn luyện của chỉ huy"
    pronouns_and_address: "Sĩ quan đàn anh dùng đại từ phiếm chỉ `Ai cũng` và gọi Grantz là `cậu`."
    pov_and_voice: "Lời động viên pha chút hài hước nhà binh về độ khắc nghiệt của Tanya."
    modality_and_logic: "Bảo toàn cả 2 câu: ai cũng phải bước qua cửa ải đó; nếu sống sót qua khóa huấn luyện của chỉ huy thì coi như cũng tạm ổn rồi."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000033
    terms:
      - "Trung úy Serebryakov"
    pronouns_and_address: "Lời thoại quy chiếu Serebryakov bằng `Trung úy Serebryakov` và quy chiếu Tanya bằng `cô ấy`."
    pov_and_voice: "Lời trêu đùa thân mật của một sĩ quan trong phòng hướng sang Serebryakov."
    modality_and_logic: "Bảo toàn nhận định rằng Serebryakov chỉ cần bay theo chỉ huy thôi là đã cứng cáp lên rồi (xem thêm finding `m1`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000034
    terms: []
    pronouns_and_address: "Serebryakov tự xưng `tôi` và hỏi cả phòng `Có ai`."
    pov_and_voice: "Giọng thở dài nửa đùa nửa thật của Serebryakov khi làm phó quan bay kèm Tanya."
    modality_and_logic: "Bảo toàn lời thừa nhận kèm câu hỏi gạ đổi vị trí: đúng là thế thật, nhưng có ai muốn đổi chỗ với cô không."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000035
    terms:
      - "phó chỉ huy"
    pronouns_and_address: "Trung úy Weiss tự xưng `Tôi` và quy chiếu Tanya bằng `cô ấy`."
    pov_and_voice: "Tiếng cười sảng khoái và lời từ chối khéo dựa trên chức trách phó chỉ huy tiểu đoàn của Weiss."
    modality_and_logic: "Bảo toàn tiếng cười và lý do từ chối: vì là phó chỉ huy nên không thể bay cùng cô ấy được."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000036
    terms:
      - "Đại đội trưởng"
      - "Trung úy"
    pronouns_and_address: "Một đại đội trưởng tự xưng `tôi` và gọi Serebryakov là `cô` / `thưa Trung úy`."
    pov_and_voice: "Lời từ chối lịch sự, hài hước viện dẫn nguyên tắc phân tán chỉ huy."
    modality_and_logic: "Bảo toàn quan hệ nhân quả: các đại đội trưởng tụ tập hết một chỗ thì không ổn, nên thực tế nhiệm vụ khiến anh không thể đổi chỗ với Serebryakov được (xem thêm finding `m1`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000037
    terms:
      - "Trung úy Serebryakov"
    pronouns_and_address: "Trần thuật ngôi thứ nhất định danh `Trung úy Serebryakov`."
    pov_and_voice: "Câu thoại ngắn và cử chỉ làm bộ giận dỗi khuấy động không khí phòng họp."
    modality_and_logic: "Bảo toàn câu than tiếc thật đấy và hình ảnh Serebryakov phồng má, phụng phịu như thể đang giận dỗi thật sự (xem thêm finding `m1`)."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000038
    terms:
      - "những người lính dày dạn"
    pronouns_and_address: "Tự sự ngôi thứ nhất quy chiếu nhóm sĩ quan kỳ cựu bằng `Những người` / `những người lính dày dạn`."
    pov_and_voice: "Sự nhận thức mới mẻ của Grantz về hai mặt chiến đấu và đời thường của những người lính thiện chiến."
    modality_and_logic: "Bảo toàn sự đồng nhất đối tượng giữa hai thời điểm: tập hợp những con người đang tạo nên bầu không khí yên bình nơi đây chính là những người lính dày dạn đã làm việc điên cuồng hôm nọ."
    emphasis: "none"

  - segment_id: YS-LN02/Text/part0028.xhtml/p000039
    terms: []
    pronouns_and_address: "Tự sự ngôi thứ nhất của Grantz dùng `Tôi` / `tôi`."
    pov_and_voice: "Nhịp lắng dịu khép lại lô khi Grantz dần thoát khỏi trạng thái sang chấn."
    modality_and_logic: "Bảo toàn cả 2 câu và sự chuyển biến tâm lý theo thời gian: chợt cảm thấy như có thể thở phào nhẹ nhõm; vừa mới đây thôi còn bàng hoàng đến vậy, nhưng giờ đã bắt đầu bình tĩnh lại đôi chút."
    emphasis: "none"
