  - id: vol02-ch05-b06-veteran-reminiscence-pronouns-and-emphasis
    source_term: "Veteran first-person retrospective narration pronouns (`tôi` / `mình` / `chúng tôi` / `chúng ta`), third-person references to Major von Degurechaff (`cô ấy` / `cô` in veteran narration; `cô ta` in NCO/Outsider skeptical dialogue at p000129/p000149/p000150; `Thiếu tá, cô` in CP radio query at p000133), apostrophe to Major von Degurechaff (`Thưa bà, bà...` at p000148), Pixie 01 radio command pronouns (`tôi` / `chúng tôi` / `chúng ta` / `các chiến sĩ` / `Mọi người`), subject-omitted rhetorical question at p000144, and exact preservation of three italicized spans at p000136, p000137, p000147"
    proposed_vi: "Tiếp nối mạch hồi ức ngôi thứ nhất của người cựu binh từ ch-05-b05, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 và DEC-P01-002: (1) người cựu binh tự xưng nhất quán là `tôi` (p000126, p000127, p000135–p000137, p000139–p000142, p000144, p000147) kết hợp đại từ phản thân/nội thuộc `mình` (`kéo mình trở lại` ở p000139, `nhớ mình phải` ở p000141, `ngăn được mình` ở p000147), dùng `chúng tôi` khi quy chiếu bản thân cùng anh hạ sĩ quan hoặc đồng đội Đế quốc trên tuyến Rhine (p000127, p000137, p000148, p000155 — đã sửa theo B06-07 để giữ người kể nằm trong nhóm đứng cạnh thần linh, kết nối trực tiếp với `người của chúng tôi` ở p000157), và dùng `lũ chiên như chúng ta` / `quân ta` / `quân mình` trong nhận định chung (p000130–p000132); (2) quy chiếu Thiếu tá von Degurechaff (Pixie 01) theo đúng điểm nhìn và thái độ của người nói (không áp quy ước `nó` của điểm nhìn Tanya): trong lời kể của người cựu binh và câu hỏi đầu tiên ở p000128 dùng `cô ấy` / `cô`; trong lời hoài nghi của anh hạ sĩ quan (p000129), lời dè bỉu của kẻ xấu số (p000149) và lời đồn từ phía Đại quân (p000150) dùng `cô ta`; trong lời hỏi ngập ngừng của CP qua vô tuyến (p000133) dùng `Thiếu tá, cô...?`; riêng tại p000148 khi người cựu binh hướng lời tôn vinh trực tiếp tới vị chỉ huy từ khoảng cách hồi tưởng hậu chiến (`You, ma'am, were a great officer... you were a god`), dùng kính ngữ trang trọng `Thưa bà, bà...`; (3) trong các mệnh lệnh qua vô tuyến của Pixie 01 (p000134, p000143, p000146, p000152), dùng `tôi` (`Theo tôi`), `chúng tôi` (khi đại diện đơn vị nói với CP hoặc bộ phận khác), `chúng ta` (khi hiệu triệu toàn đơn vị đánh bật địch) và gọi thuộc cấp là `các chiến sĩ` / `Mọi người`; (4) tại câu hỏi mở hướng tới người nghe ở p000144, lược bỏ đại từ nhân xưng (`Không biết lời nói cũng có thể có thần ngụ trong đó sao?`, đồng bộ B06-09) để không tự gán quan hệ tuổi tác/thân sơ khi chưa có căn cứ; (5) bảo toàn chính xác và duy nhất ba vùng nhấn mạnh bằng `*...*` khớp tuyệt đối với ba thẻ `<html:em>` trong nguồn tại p000136 (`*Kết liễu tôi đi cho rồi!*`), p000137 (`*Cơn lạnh quái quỷ này là sao?*`) và p000147 (`*Đồ quái vật!*`), không tự thêm `*...*` ở bất kỳ đoạn nào khác (DEC-P01-002)."
    alternatives_vi:
      - "Thưa Thiếu tá, cô... (thay cho `Thưa bà, bà...` tại p000148 nếu muốn giữ đồng nhất độ tuổi trẻ của Tanya — giữ `Thưa bà, bà...` như phương án khả chấp trong bản dịch hiện tại để phản ánh sắc thái tôn kính trang trọng của từ `ma'am` và vị thế như một vị thần trong mắt lính chiến hào)"
