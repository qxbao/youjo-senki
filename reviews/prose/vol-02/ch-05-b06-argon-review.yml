      - "Người kể tự xưng `tôi` (kèm `mình` trong `ngăn được mình`)."
    pov_and_voice: "Hồi ức ngôi thứ nhất đối chiếu nhận xét thông thường với ấn tượng kinh hoàng còn in sâu trong ký ức."
    modality_and_logic: "Giữ cấu trúc giả định ở hai câu đầu (bình thường nói thế sẽ là trịch thượng và tự tin thái quá; người dưới quyền hẳn là không may mắn) đối lập với thực tế mỗi khi hồi tưởng lại ở thì hiện tại (`tôi không sao ngăn được mình hét lên: *Đồ quái vật!*`)."
    emphasis: "Khóa chính xác cụm cảm thán in nghiêng `*Đồ quái vật!*` khớp với thẻ `<html:em>` trong nguồn (DEC-P01-002)."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000148
    terms:
      - "anh hùng (A hero)"
      - "ngôi sao (a star)"
      - "sĩ quan pháp sư xuất chúng (an outstanding magic officer)"
      - "binh sĩ Đế quốc (imperial soldiers)"
      - "tuyến Rhine (the Rhine lines)"
      - "một vị thần (a god)"
    pronouns_and_address:
      - "Người kể gọi trực tiếp vị chỉ huy từ khoảng cách hồi tưởng bằng `Thưa bà, bà...`, và tự xưng số nhiều `tất cả chúng tôi, những binh sĩ Đế quốc`."
    pov_and_voice: "Lời tôn vinh trực tiếp đầy kính sợ trong hồi ức của người cựu binh."
    modality_and_logic: "Giữ chuỗi danh ngữ ca ngợi ở câu đầu và sự tôn sùng của toàn bộ binh sĩ Đế quốc trên tuyến Rhine coi vị chỉ huy ấy là một vị thần."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000149
    terms:
      - "chỉ huy mới (A new commander)"
      - "ma lực (mana)"
    pronouns_and_address:
      - "Trong câu bình phẩm coi thường của kẻ xấu số, quy chiếu vị chỉ huy bằng `Cô ta`."
    pov_and_voice: "Trích dẫn lời giễu cợt trong quá khứ kèm lời bình lạnh lùng của người cựu binh."
    modality_and_logic: "Giữ sự tương phản mỉa mai giữa lời chê bai vị chỉ huy mới (`nhiều ma lực mà chẳng có gì khác? Cô ta chán sống rồi chắc.`) và kết cục của chính kẻ nói câu đó (`Đáng tiếc, kẻ buông lời bình phẩm đó giờ đã không còn sống nữa.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000150
    terms:
      - "Pixies (Pixies)"
      - "Đại quân (Great Army)"
      - "thần chết (a god of death)"
    pronouns_and_address:
      - "Người nói tự xưng `Tôi`, quy chiếu đơn vị bằng `họ`, những người bên Đại quân bằng `Họ`, và vị chỉ huy bằng `cô ta`."
    pov_and_voice: "Lời thoại truyền tai nhau về lời đồn từ phía Đại quân."
    modality_and_logic: "Khóa tên gọi `Pixies`, `Đại quân` và lời đồn rằng cô ta là `thần chết`."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000151
    terms:
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
      - "một vị thần (a god)"
      - "sinh tử (life and death)"
    pronouns_and_address:
      - "Quy chiếu Thiếu tá von Degurechaff bằng `cô ấy`."
    pov_and_voice: "Hồi ức ngôi thứ nhất xác nhận lời đồn của người cựu binh."
    modality_and_logic: "Khóa cụm từ đã sửa theo B06-06 (`một vị thần có quyền năng vô cùng lớn, cai quản sinh tử`), giữ đúng mức độ sức mạnh cực lớn mà không tự nâng thành độc nhất vô song."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000152
    terms:
      - "các chiến sĩ (troops)"
    pronouns_and_address:
      - "Pixie 01 gọi thuộc cấp là `các chiến sĩ` và `Mọi người`."
    pov_and_voice: "Lời thoại của Thiếu tá von Degurechaff với quân lính trước lúc xung trận."
    modality_and_logic: "Giữ sự tương phản rợn người giữa câu chữ nói về niềm vui (`Giờ mọi chuyện bắt đầu vui rồi đấy, các chiến sĩ. Mọi người cũng đang vui chứ?`) với cơn giận dữ được mô tả ngay ở đoạn sau."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000153
    pronouns_and_address:
      - "Quy chiếu Thiếu tá von Degurechaff bằng `cô ấy` / `cô` và phản thân `mình`."
    pov_and_voice: "Hồi ức ngôi thứ nhất của người cựu binh."
    modality_and_logic: "Giữ mô tả lời nói tràn ngập cơn giận lạnh sống lưng lan khắp khu vực và cấu trúc giả định (`như thể cô đang định dụ toàn bộ sự thù địch của quân địch về phía mình, tựa bướm đêm lao vào lửa`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000154
    terms:
      - "Thiếu tá von Degurechaff (Major von Degurechaff)"
    pronouns_and_address: []
    pov_and_voice: "Hồi ức ngôi thứ nhất của người cựu binh."
    modality_and_logic: "Giữ hình ảnh ẩn dụ `Thiếu tá von Degurechaff đã nhe nanh` và hệ quả trực tiếp `Hành động ấy khơi mào một phản ứng dữ dội.`"
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000155
    terms:
      - "Cộng hòa (The Republic)"
      - "ác quỷ (the devil)"
      - "vị thần chết (the god of death)"
      - "Thần linh (Gods)"
    pronouns_and_address:
      - "Quy chiếu Cộng hòa bằng `họ`, các vị thần bằng `họ`, và nhóm người lính Đế quốc gồm cả người kể bằng `chúng tôi, những người ở bên cạnh họ`."
    pov_and_voice: "Hồi ức ngôi thứ nhất đúc kết bi kịch của những người lính thường đứng cạnh vị thần chiến tranh."
    modality_and_logic: "Khóa câu hỏi tu từ đã sửa theo B06-07 (`Thần linh không chết, nhưng chúng tôi, những người ở bên cạnh họ, thì sao?`), bảo toàn sự hiện diện của người kể và đồng đội trong nhóm chịu thương vong bên cạnh vị thần bất tử."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000156
    terms:
      - "thần chết (a god of death)"
    pronouns_and_address:
      - "Quy chiếu những người đặt biệt danh bằng `Họ` và Thiếu tá von Degurechaff bằng `cô ấy`."
    pov_and_voice: "Lời cảm thán trầm ngâm trong hồi ức của người cựu binh."
    modality_and_logic: "Giữ dấu ba chấm mở đầu và lời thừa nhận chua chát (`…Họ gọi cô ấy là thần chết quả chẳng sai.`)."
    emphasis: "Không dùng `*...*`."

  - segment_id: YS-LN02/Text/part0026.xhtml/p000157
    terms:
      - "quân địch (the enemy)"
      - "người của chúng tôi (our men)"
      - "vị thiếu tá cao quý (the noble major)"
    pronouns_and_address:
      - "Quy chiếu Thiếu tá von Degurechaff bằng `Cô ấy` và danh ngữ `vị thiếu tá cao quý`; dùng `người của chúng tôi` cho binh sĩ phe mình."
    pov_and_voice: "Hồi ức ngôi thứ nhất khép lại cảnh chiến trường bằng giọng điệu lạnh lẽo, bi tráng."
    modality_and_logic: "Giữ cấu trúc đối xứng nghiệt ngã ở câu 1 (`Cô ấy giết quân địch, còn quân địch giết người của chúng tôi.`) và hình ảnh vị thiếu tá cao quý liếc nhìn những xác chết trong bùn rồi rời đi."
    emphasis: "Không dùng `*...*`."
