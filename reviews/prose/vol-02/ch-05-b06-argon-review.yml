findings:
  - id: m1
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000139
    issue: "Tại câu 1 của p000139 (`kéo mình trở lại`), động từ chuyển trạng thái tinh thần khi nghe tiếng báo động (`brought me back to myself`) chưa có bổ ngữ chỉ ý thức/tâm trí, khiến câu văn hơi lửng (dễ đọc lướt thành kéo trở lại một vị trí)."
    basis: "Đặt ngay sau cơn sợ lạnh buốt ở p000137 và tiếng cảnh báo vô tuyến của Pixie 03 ở p000138, người đọc vẫn hiểu người kể sực tỉnh khỏi nỗi kinh hoàng; đây là điểm đã được ghi nhận ở mục minor B06-08."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc chỉnh thành `đã kéo tôi về với thực tại` / `đã khiến tôi hoàn hồn`."
    resolution: optional_polish

  - id: m2
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000147
    issue: "Tại câu 2 của p000147 (`Những người dưới quyền chỉ huy ấy`), việc lược danh từ chỉ người giữa `dưới quyền` và `chỉ huy ấy` dễ khiến cụm từ được đọc thành danh từ trừu tượng chỉ sự chỉ huy hơn là vị chỉ huy (`that commander`)."
    basis: "Mạch văn trước và sau (p000146, p000148, p000149) đều đang nói trực tiếp về cá nhân chỉ huy Pixie 01 nên nghĩa câu không bị lệch; tương ứng mục minor B06-10."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc thêm từ chỉ người: `Những người dưới quyền vị chỉ huy ấy` / `Những người dưới quyền người chỉ huy ấy`."
    resolution: optional_polish

  - id: m3
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000149
    issue: "Ở đầu đoạn p000149, câu trích dẫn lời bình phẩm (`Một chỉ huy mới, nhiều ma lực mà chẳng có gì khác? Cô ta chán sống rồi chắc.”`) có dấu đóng ngoặc kép ở cuối phần trích dẫn nhưng bị khuyết dấu mở ngoặc kép ở đầu đoạn."
    basis: "Ranh giới giữa lời bình phẩm được trích lại và câu trần thuật tiếp theo (`Đáng tiếc, kẻ buông lời bình phẩm đó giờ đã không còn sống nữa.`) vẫn rõ nhờ dấu đóng ngoặc kép đang có; tương ứng mục minor B06-11."
    recommendation: "Ở bước chuốt văn hoặc hậu kỳ định dạng, thêm dấu mở ngoặc kép `“` trước `Một chỉ huy mới` để khép cặp với dấu đóng ngoặc kép hiện có."
    resolution: optional_polish

  - id: m4
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000153
    issue: "Ở cuối câu p000153 (`như thể cô đang định dụ toàn bộ sự thù địch của quân địch về phía mình, tựa bướm đêm lao vào lửa`), việc tách cụm so sánh `tựa bướm đêm lao vào lửa` ra sau dấu phẩy khiến chủ thể được ví với bướm đêm hơi mơ hồ giữa `cô` và `sự thù địch của quân địch`."
    basis: "Động từ `dụ ... về phía mình` đã định hướng người chỉ huy là ngọn lửa thu hút côn trùng, nên ý chính của hình ảnh ví von vẫn được giữ; tương ứng mục minor B06-12."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc gắn rõ chiều thu hút: `như thể cô đang định thu hút toàn bộ sự thù địch của quân địch về phía mình như lửa hút bướm đêm`."
    resolution: optional_polish

  - id: m5
    severity: minor
    segment_id: YS-LN02/Text/part0026.xhtml/p000157
    issue: "Tại câu 2 của p000157, cụm `những xác chết nằm la liệt trong bùn` thêm sắc thái miêu tả trạng thái phân bố (`nằm la liệt`) so với cách diễn đạt cô đọng trong nguồn (`all the dead in the mud`)."
    basis: "Trong bối cảnh bãi chiến trường lầy lội sau cuộc giao tranh đẫm máu của cả hai bên ở câu 1, `nằm la liệt` là kết hợp từ tự nhiên trong tiếng Việt và không làm đổi sự kiện hay thái độ lạnh lùng của vị thiếu tá; tương ứng mục minor B06-13."
    recommendation: "Có thể giữ nguyên, hoặc ở bước chuốt văn cân nhắc rút gọn thành `tất cả những người chết trong bùn` / `tất cả những xác chết trong bùn`."
    resolution: optional_polish

