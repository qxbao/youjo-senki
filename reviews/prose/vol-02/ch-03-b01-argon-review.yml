- source_term: rudersdorf_tanya_briefing_and_postwar_reporter_investigation_pronouns_vol02_ch03_b01
  proposed_vi: "Trong phân cảnh Thiếu tướng von Rudersdorf đón Thiếu tá Tanya von Degurechaff trở lại mặt trận Norden và giao nhiệm vụ chuẩn bị cho chiến dịch đổ bộ đường không (part0016/p000001–p000022): dùng chủ ngữ khái quát `người ta` ở đoạn mở đầu (p000001); trong đối thoại trực tiếp giữa Rudersdorf và Tanya, Rudersdorf tự xưng `tôi` / `Tôi` (hoặc `Chúng tôi` / `chúng tôi` khi đại diện bộ chỉ huy ở p000009, p000017, và `ta` khi chuyển sang bàn công việc ở p000011), gọi Tanya là `cô` / `Cô` kèm quân hàm `Thiếu tá von Degurechaff` / `Thiếu tá` (p000002, p000005, p000007, p000009, p000013, p000015, p000017, p000019, p000021); Tanya tự xưng `Tôi` / `tôi` (hoặc `chúng tôi` / `đơn vị chúng tôi` khi đại diện tiểu đoàn ở p000014, p000022), gọi Rudersdorf lễ phép là `ngài` / `thưa ngài` / `Tướng von Rudersdorf` kèm tiểu từ kính ngữ `ạ` ở câu hỏi xác nhận (p000003, p000006, p000012, p000016, p000018, p000020, p000022), và quy chiếu quân địch bằng `chúng` (p000018); trong trần thuật (p000004, p000008), quy chiếu các sĩ quan Bộ Tổng tham mưu và cặp Rudersdorf – Tanya bằng `họ`, quy chiếu Zettour bằng `ông ta` và phản thân `mình`, quy chiếu Tanya ở p000008 bằng `cô` và phản thân `mình` (theo bản dịch đã qua signoff). Trong phân cảnh sau chiến tranh của nhóm phóng viên điều tra lời đồn về Nữ thần Thứ Mười Một (part0016/p000023–p000040): người dẫn chuyện tự xưng cá nhân bằng `tôi` / `Tôi` (p000025, p000035, p000037), quy chiếu nhóm phỏng vấn bằng `chúng tôi` / `Chúng tôi` (p000023, p000026, p000030, p000032, p000033), và dùng `chúng ta` cho nhận định bao gộp chung (p000037); tuân thủ nghiêm ngặt `DEC-P01-001`, bản sửa `F-08` đã ký duyệt và mục `vol02-ch03-b01-jeffrey-reference`, lặp lại tên riêng `Jeffrey` ở p000023, p000024, p000037, p000038 để tránh suy diễn tuổi tác hay vị thế từ đại từ `anh`; giữ đại từ trung tính `nó` / `đó` khi quy chiếu `Nữ thần Thứ Mười Một` (p000024–p000026) để không suy diễn bản chất thực thể; quy chiếu vị tướng đã nghỉ hưu bằng `Ông` / `ông` trong trần thuật và gọi nhóm phóng viên là `những kẻ như các người` / `Các người` trong lời quát tháo giận dữ của ông (p000031, p000033)"
  alternatives_vi:
  - anh / ông ấy (thay cho lặp tên `Jeffrey` tại part0016/p000023, p000024 — bắt buộc giữ cách lặp tên `Jeffrey` theo bản sửa `F-08` đã ký duyệt tại `reviews/prose/vol-02/ch-03-b01-fixes-signoff-claude.md` và mục `vol02-ch03-b01-jeffrey-reference` trong `pending-terms.yml` nhằm tuân thủ `DEC-P01-001`, không suy diễn tuổi tác hay quan hệ khi thiếu ngữ cảnh) / cô ấy / bà ấy (thay cho `nó` khi quy chiếu `Nữ thần Thứ Mười Một` tại part0016/p000024, p000026 — bắt buộc giữ `nó` vì nguyên tác dùng đại từ vô nhân xưng cho đối tượng tin đồn, tránh suy diễn lore sớm)
