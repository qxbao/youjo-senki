    category: "word_choice"
    issue: "Cụm từ nguồn 'with a handicap' đang được dịch là 'với thế chấp'. Dù ý người dịch là 'thế (vị thế) + chấp (nhường/thiệt)', tổ hợp từ 'thế chấp' trong tiếng Việt trùng hoàn toàn với thuật ngữ tài chính (mortgage/collateral), dễ gây khựng nhịp đọc."
    recommendation: "Có thể cân nhắc đổi thành 'ở thế bất lợi', 'với phần thiệt về mình' hoặc 'trong thế chấp quân' ở bước chuốt văn để câu văn tự nhiên và tránh đồng âm khác nghĩa."
