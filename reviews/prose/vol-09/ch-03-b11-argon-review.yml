  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000443"
    choices:
      - "Nhấn mạnh Markdown & câu bỏ lửng: bọc chính xác đại từ '*chúng ta*' bằng dấu sao theo DEC-P01-002 ('“Đó là quả ngư lôi của *chúng ta*. Tôi không cố ý…”')."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000444"
    choices:
      - "Điểm nhìn trần thuật & so sánh: giữ hình ảnh 'Với gương mặt tái mét như một kẻ phạm tội', hành động 'quỳ sụp xuống' rồi 'phủ phục xuống đất như thể đang xưng thú một trọng tội nào đó'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000445"
    choices:
      - "Thoại ngắn: giữ '“Tôi thực sự rất xin lỗi.”'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000446"
    choices:
      - "Nhấn mạnh Markdown & độc thoại nội tâm: giữ câu ngắn 'Xin đính chính.', tự quy chiếu 'Mình', gọi Schugel là 'ông' và chỉ bọc từ '*chính xác*' bằng dấu sao theo DEC-P01-002."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000447"
    choices:
      - "Xưng hô, quân hàm & tình thái suýt xảy ra: giữ cách gọi 'Trung tá', đại từ 'tôi' / 'chúng ta', phần giải thích giữa cặp gạch ngang dài '—sự hợp tác giữa chúng ta—' và hai mốc tình thái 'suýt chút nữa đã sa vào thói ngạo mạn', 'suýt quên mất điều đó'."
