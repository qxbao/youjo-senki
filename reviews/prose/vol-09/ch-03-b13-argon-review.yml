    severity: "minor"
    category: "address_register"
    issue: "Lời thốt lên ngắn của Tanya khi sững sờ được dịch là '“…Sao cơ ạ?”', thêm tiểu từ lễ độ 'ạ' dù ở p000499 người đối thoại gọi Tanya là 'thưa Trung tá' và ở p000513 xưng hô ngang/lịch sự ('Cô không biết sao?')."
