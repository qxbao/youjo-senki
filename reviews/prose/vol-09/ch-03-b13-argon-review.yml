  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000522"
    choices:
      - "Thuật ngữ hải quân – không quân & không thêm nhấn mạnh: giữ 'máy bay ném bom bổ nhào', 'tàu khu trục hay tàu chở quân', 'chưa chủ trương đưa máy bay ra đối đầu trực tiếp với tàu chủ lực' và không thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-143."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000523"
    choices:
      - "Trần thuật & thuật ngữ chiến lược: giữ 'Câu trả lời thật cộc lốc', hình ảnh 'phía sau bức màn…' và nhận định về 'Đế quốc' như một 'quốc gia lục địa điển hình đến đáng buồn, với hình ảnh tiêu biểu là Đại Quân của mình'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000524"
    choices:
      - "Trần thuật: giữ quan hệ kết quả 'Nhờ chính sách mở rộng quyết liệt, hải quân trong những năm gần đây đã ngày càng lớn mạnh cho đến khi sở hữu một đội hình đáng gờm.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000525"
    choices:
      - "Tương phản chiến lược & thuật ngữ không quân: giữ tương phản 'Thế nhưng không quân lại chủ yếu tập trung vào việc giành quyền làm chủ bầu trời và thực hiện các nhiệm vụ yểm trợ đường không tầm gần' gắn với 'một quốc gia lục địa'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000526"
    choices:
      - "Lễ độ & câu hỏi xác minh trong thoại: giữ '“Xin thứ lỗi cho sự thiếu hiểu biết của tôi, nhưng liệu chúng ta có đang phát triển máy bay cường kích và chiến thuật tấn công tàu chiến chút nào không?”'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000527"
    choices:
      - "Tình thái dự báo & xưng hô trong thoại: giữ khẳng định kèm giới hạn 'Chúng ta có đang làm, nhưng không thể hoàn thành trong một sớm một chiều được', ước lượng 'Có lẽ phải mất một hoặc hai năm nữa' và đại từ 'cô' khi nói với Tanya về mốc đưa vào thực chiến."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000528"
    choices:
      - "Trần thuật: giữ sắc thái 'Câu hỏi chẳng khác nào lời van nài của Tanya' và kết cục 'niềm lạc quan mong manh trong nó vỡ vụn'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000529"
    choices:
      - "Trần thuật: giữ 'Hy vọng duy nhất của nó vốn đặt cả vào thế mạnh công nghệ của Đế quốc.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000530"
    choices:
      - "Thuật ngữ & tình thái chắc chắn: giữ 'tài sản vô hình to lớn là bí quyết công nghệ' và nhận định 'chắc chắn sẽ mất rất nhiều thời gian'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000531"
    choices:
      - "Mệnh đề nhượng bộ mở đầu: giữ dấu chấm lửng cuối câu 'Ngay cả khi chẳng có gì dễ chuốc lấy kết cục phi lý bằng việc hành xử theo cảm tính…'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000532"
    choices:
      - "Liên kết câu & thuật ngữ kinh tế: giữ dấu chấm lửng mở đầu nối với p000531, cụm 'con người vốn đề cao tính hợp lý kinh tế này' và 'nỗi căm ghét trớ trêu của mình đối với sự phi lý'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000533"
    choices:
      - "Câu hỏi đề xuất trong thoại: giữ '“Vậy còn phương án cho tàu ngầm hoặc tàu phóng lôi tiến hành tấn công tầm gần thì sao?”'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000534"
    choices:
      - "Điểm nhìn trần thuật & tự đánh giá: giữ 'trên cương vị một người trưởng thành biết điều và một người lính được thực tế rèn giũa kỹ lưỡng, chỉ là đưa ra một phương án thay thế.'."
