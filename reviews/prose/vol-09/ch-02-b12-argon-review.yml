  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000473"
    severity: "minor"
    category: "diction"
    issue: "Động từ 'Sập bẫy' khi đứng đầu câu làm vị ngữ ngoại động ('Sập bẫy thành công một người...') hơi kém tự nhiên trong tiếng Việt vì 'sập bẫy' thường dùng như nội động từ chỉ phía trúng bẫy, trong khi ngữ cảnh là Uger chủ động giăng bẫy/cho đối phương sập bẫy."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước chuốt văn thành 'Giăng bẫy thành công một người từng nhận Huy hiệu Xung kích Cánh Bạc...' hoặc 'Cho một người từng nhận Huy hiệu Xung kích Cánh Bạc sập bẫy thành công...'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000490"
    severity: "minor"
    category: "modality"
    issue: "Cấu trúc 'Chẳng phải... sao?' mang sắc thái câu hỏi tu từ khẳng định, trong khi câu hỏi ở nguồn là nghi vấn trực tiếp khi Tanya vừa nếm thử đồ ăn và hỏi Uger xem tình hình có phải đã tệ đi hơn trước không."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước chuốt văn thành '“…Nó còn tệ hơn trước sao?”' hoặc '“…Mọi thứ còn tệ đi hơn trước sao?”'."
