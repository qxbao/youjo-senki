findings:
  - segment_id: "YS-LN09/Text/chapter012.xhtml/p000003"
    severity: "minor"
    category: "pronouns"
    issue: "Đại từ trần thuật ngôi thứ ba quy chiếu Tanya trong lô ch-03-b18 (tại p000003, p000004, p000012, p000014, p000027) tiếp tục dùng 'nó' theo DEC-P01-001 (nhất quán với chuỗi lô ch-03-b12 đến ch-03-b17 liền trước), trong khi một số lô đầu của tập 9 dùng 'cô'."
    recommendation: "Nội bộ lô ch-03-b18 đã phân tách nhất quán giữa trần thuật ('nó'), độc thoại/tự thuật ngôi thứ nhất ('mình' / 'bọn mình' tại p000002, p000005–p000007, p000009, p000017, p000020, p000021, p000028, p000030) và thoại công vụ ('tôi' tại p000019, p000022, p000025, p000031); ở bước chuốt văn hoặc ghép chương có thể giữ nguyên theo DEC-P01-001 hoặc đồng bộ thành 'cô' nếu muốn thống nhất toàn chương 3."
  - segment_id: "YS-LN09/Text/chapter012.xhtml/p000004"
    severity: "minor"
    category: "style_repetition"
    issue: "Trong cụm 'nó *lẽ ra phải* truyền đạt cho nó', đại từ 'nó' được dùng hai lần liên tiếp cho hai chủ thể khác nhau (từ 'nó' thứ nhất chỉ chương trình học, từ 'nó' thứ hai chỉ Tanya) khiến câu hơi lặp từ."
    recommendation: "Ở bước chuốt văn Flash, có thể đổi từ 'nó' đầu thành 'chương trình ấy' ('chương trình ấy *lẽ ra phải* truyền đạt cho nó') để tránh lặp đại từ khác quy chiếu mà vẫn giữ nguyên nhấn mạnh Markdown."
