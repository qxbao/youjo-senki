    severity: "minor"
    issue: "Bản dịch thêm hình ảnh 'nằm trên giấy' khi diễn đạt ý giữ nguyên Plan B chỉ là Plan B; dù hợp ngữ cảnh nhưng hơi mở rộng so với lối diễn đạt cô đọng của nguyên bản."
    rationale: "Nguyên bản lặp lại trực tiếp danh xưng Plan B để nhấn mạnh mong muốn nó mãi chỉ dừng ở phương án dự phòng không bao giờ phải kích hoạt."
    recommendation: "Có thể cân nhắc rút gọn thành 'Anh chỉ muốn cứ để Kế hoạch B mãi mãi là Kế hoạch B' khi chuốt văn, hoặc giữ nguyên nếu muốn làm rõ sắc thái dự phòng."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000575"
    severity: "minor"
    issue: "Câu hỏi tu từ ở giữa đoạn về thực tại khó chịu đang được chuyển thành câu cảm thán kết thúc bằng dấu chấm than."
    rationale: "Nguyên bản đặt câu hỏi tu từ mang giọng tự trào chua chát của Lergen trước thực tại chiến tranh."
    recommendation: "Có thể cân nhắc giữ hình thức câu hỏi tu từ như 'Thực tại này mới khó chịu làm sao chứ?' hoặc giữ câu cảm thán hiện tại nếu ưu tiên nhịp văn tiếng Việt."
