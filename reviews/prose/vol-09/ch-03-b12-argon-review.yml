    choices:
      - "Quan hệ tương phản & điểm khởi đầu: giữ tương phản giữa 'hoàn cảnh liều lĩnh như vậy' với 'được giám sát và quản lý khá hợp lý', cùng mốc 'khi Tanya được hỏi xin ý kiến tham vấn'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000480"
    choices:
      - "Trần thuật & chi tiết biểu cảm: giữ 'cuộc họp dự án nghiên cứu kỹ thuật', tư cách 'người dày dạn kinh nghiệm thực chiến' và hình ảnh 'há hốc mồm kinh ngạc'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000481"
    choices:
      - "Thuật ngữ lực lượng: giữ 'Hải quân Khối Thịnh vượng chung vượt trội hơn hẳn' và 'tàn dư hạm đội Cộng hòa'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000482"
    choices:
      - "Điểm nhìn & thuật ngữ quân sự: giữ 'người lính Tanya này', chi tiết 'nắm rõ những bài học của Thế chiến thứ hai' và hai phương thức 'không kích hoặc tác chiến tàu ngầm'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000483"
    choices:
      - "Trần thuật & thuật ngữ hải quân: giữ chuỗi 'thiết giáp hạm, pháo chính rồi... tàu lớn pháo to' và mệnh đề 'sự kiên nhẫn của nó đã chạm tới giới hạn và nó bèn lên tiếng'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000484"
    choices:
      - "Câu hỏi tu từ trong thoại & đánh giá trần thuật: giữ '“Tác chiến chống hạm ư? Chẳng phải chúng ta có thể triển khai máy bay ném bom chống hạm hoặc tàu ngầm mang ngư lôi hay sao?”' và nhận định 'Với Tanya, đây là một ý kiến vô cùng hợp lý.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000485"
    choices:
      - "Nhấn mạnh Markdown & chơi chữ lóng: giữ câu hỏi tu từ trần thuật, bọc chính xác '*Aal*' bằng dấu sao theo DEC-P01-002, giữ 'Hải quân Đế quốc' và nghĩa đen 'gần như là lươn thật'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000486"
    choices:
      - "Nhấn mạnh Markdown, lịch sử quân sự & không thêm nhấn mạnh: giữ 'Trân Châu Cảng', chỉ bọc '*Prince of Wales*' và '*Repulse*' bằng dấu sao theo DEC-P01-002 (bỏ qua thẻ neo page-141), giữ phủ định kép về việc phóng ngư lôi đánh chìm tàu chủ lực/chiến hạm và sự đối lập giữa 'chiến lược chống tiếp cận khu vực bài bản' với quy luật chung 'tàu thuyền trên biển hễ trúng thuốc nổ là sẽ chìm'."
