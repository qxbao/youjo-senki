locked_choices:
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000663"
    choices:
      - "Xưng hô & ẩn dụ hội thoại: giữ cụm ẩn dụ 'người bạn chung của chúng ta' và đại từ 'Anh' khi Tanya hỏi Uger."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000664"
    choices:
      - "Nhấn mạnh Markdown & đại từ: giữ đại từ 'Chúng tôi' và chỉ bọc duy nhất câu kết thúc đàm phán '*Có lẽ là trong một hoàn cảnh khác vậy*' bằng dấu sao theo đúng thẻ em của nguồn (DEC-P01-002)."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000665"
    choices:
      - "Câu hỏi ngạc nhiên: giữ cụm 'Người bạn định đứng ra hòa giải cho chúng ta lại nói thế sao?!'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000666"
    choices:
      - "Điểm nhìn, điều kiện & thuật ngữ: giữ mệnh đề điều kiện 'Nếu Ildoa đang cản trở việc liên lạc giữa Đế quốc và Khối Thịnh vượng chung...', câu cảm thán mỉa mai trong nội tâm và câu trần thuật góc nhìn thứ ba với 'Tanya' và 'Uger'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000667"
    choices:
      - "Phủ định & quy chiếu: giữ câu đính chính 'Không, đó là lựa chọn của phía chúng ta'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000668"
    choices:
      - "Xưng hô trong ẩn dụ hội thoại: giữ cặp đại từ 'Tôi' – 'anh' tiếp nối lối nói ẩn dụ cá nhân hóa cuộc hòa đàm."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000669"
    choices:
      - "Ẩn dụ hội thoại & quan hệ nhân quả: giữ hình ảnh 'khoảng cách đã trở nên quá lớn rồi' và đại từ 'Tôi' khi Uger đóng vai phía Đế quốc rời bàn đàm phán."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000670"
    choices:
      - "Giọng thoại ngắn gọn: giữ ba câu đáp ngắn 'Ra vậy. Tiếc thật đấy. Tôi hiểu rồi.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000671"
    choices:
      - "Ẩn dụ nội tâm & câu hỏi tu từ: giữ cụm ẩn dụ 'Giới lãnh đạo Đế quốc bị tê chân mất rồi!' (liên kết với hình ảnh ngồi đàm phán trước đó), đại từ 'chúng ta' và câu hỏi bức xúc của Tanya."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000672"
    choices:
      - "Giả định phản thực tế quá khứ & điểm nhìn: giữ cấu trúc 'nếu không phải vì đã biết rõ Uger từ trước, hẳn Tanya đã bật dậy mà hét thẳng vào mặt anh...'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000673"
    choices:
      - "Xưng hô & cấp bậc: giữ cặp đại từ 'tôi' – 'cô', thuật ngữ 'chuyến đi thực tế' và danh xưng 'Tướng Rudersdorf'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000674"
    choices:
      - "Câu hỏi nội tâm & đại từ: giữ đại từ 'chúng ta' và sự tương phản mỉa mai giữa hy vọng hòa bình bị nghiền nát với việc đi thực tế."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000675"
    choices:
      - "Câu hỏi xác nhận: giữ 'Đó có phải là mệnh lệnh không?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000676"
    choices:
      - "Thoại khẳng định ngắn: giữ 'Đúng vậy.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000677"
    choices:
      - "Thuật ngữ logic & đại từ: giữ đại từ 'anh' cho Uger và cụm 'điều kiện cần và đủ'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000678"
    choices:
      - "Thoại tuân lệnh: giữ 'Vậy tôi sẽ làm theo chỉ thị.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000679"
    choices:
      - "Xưng hô & quân hàm: giữ cách gọi 'Cảm ơn cô, Trung tá.' của Uger với Tanya."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000680"
    choices:
      - "Thoại đáp lễ: giữ 'Không có gì đâu.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000681"
    choices:
      - "Câu hỏi nội tâm lồng trong trần thuật: giữ nguyên câu hỏi 'nhưng tại sao Uger lại thấy cần phải tuyên bố về nhân tính của anh như vậy?' và câu kết 'Tanya không có câu trả lời.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000682"
    choices:
      - "Tiêu đề thời gian – địa điểm: giữ 'NGÀY 2 THÁNG 7 NĂM THỐNG NHẤT 1927, ĐẾ ĐÔ, GẦN GA TRUNG TÂM'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000683"
    choices:
      - "Thuật ngữ không gian & tình thái: giữ 'miền đông', 'đế đô', 'mặt trận phía đông', 'chiến hào' và trạng thái 'hoặc có lẽ đang run rẩy'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000684"
    choices:
      - "Quan hệ nhân quả & mức độ: giữ nguyên nhân kép 'trước cục diện chiến sự nguy ngập và tình trạng đường sắt ngày càng tồi tệ' và hệ quả 'việc có cơ hội thực sự được hưởng kỳ nghỉ phép theo tiêu chuẩn gần như là một ước muốn quá đỗi xa vời'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000685"
    choices:
      - "Thuật ngữ tiếng Đức & tương phản: giữ nguyên từ 'Heimat' (không in nghiêng), 'thủ đô', 'những người trở về' và hình ảnh tương phản 'những cỗ quan tài lặng câm'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000686"
    choices:
      - "Tương phản không gian & hình ảnh: giữ sự dịch chuyển 'từ tây sang đông' và chi tiết 'trong tư thế nằm ngang bên trong quan tài'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000687"
    choices:
      - "Thuật ngữ trang phục & nghi lễ: giữ 'bộ tang phục dân sự' và 'lễ truy điệu tử sĩ'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000688"
    choices:
      - "Quân hàm, đại từ & điểm nhìn: giữ 'Trung tướng Rudersdorf', đại từ 'ông' cho Rudersdorf và 'cô' cho Tanya, cùng cụm 'bộ lễ phục giản dị'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000689"
    choices:
      - "Điểm nhìn kép theo DEC-P01-001: giữ đại từ tự quy chiếu 'Mình' ở câu độc thoại nội tâm đầu đoạn và tên 'Tanya' ở câu trần thuật tiếp theo."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000690"
    choices:
      - "Trần thuật vị trí: giữ 'họ' và 'lối ra phía bắc của nhà ga'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000691"
    choices:
      - "Từ vựng trang phục: giữ sự phân biệt giữa 'tang phục' và 'lễ phục quân đội'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000692"
    choices:
      - "Nhấn mạnh Markdown: bọc dấu sao toàn bộ đoạn nội tâm '*Những đốm trắng kia là lễ phục hải quân sao? Trông chúng nổi bật quá mức rồi.*' theo đúng thẻ em của nguồn (DEC-P01-002)."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000693"
    choices:
      - "Quân hàm & đối chiếu: giữ 'các sĩ quan lục quân', 'từ đại úy trở xuống', 'sĩ quan cấp tá', 'đồ lễ phục dân sự của Tanya và vị tướng' và sự tương phản với những người mặc quân phục."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000694"
    choices:
      - "Đại từ khái quát & trần thuật: giữ đại từ khái quát 'bạn' ở câu nhận định chung và tên 'Tanya' ở câu kết luận."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000695"
    choices:
      - "Quan hệ nhân quả: giữ đại từ 'cô', định danh 'Đế quốc' và yêu cầu 'vẫn cần phải tuân thủ những chuẩn mực nhất định'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000696"
    choices:
      - "Nhận định tổng quát: giữ 'Bất kể diễn ra ở đâu, tất cả những nghi lễ thế này đều bắt đầu theo cùng một cách.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000697"
    choices:
      - "Thuật ngữ quân nhạc & nghi lễ: giữ 'tiếng kèn đồng bi thương', thế đối sánh 'nghi thức giản lược ngoài tiền tuyến' và 'lễ truy điệu tử sĩ ở hậu phương'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000698"
    choices:
      - "Giọng bình luận: giữ 'Nói thẳng ra thì Đế quốc rất chuộng lễ nghi khuôn phép.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000699"
    choices:
      - "Cấu trúc liệt kê không gian: giữ 'ở thủ đô, trên tuyến đầu xa xôi nhất, hay phải rồi, ngay dưới những chiến hào miền đông' và cụm 'theo đúng phương thức đã quy định'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000700"
    choices:
      - "Điểm nhìn kép theo DEC-P01-001: giữ đại từ tự quy chiếu 'mình' ở câu đầu, 'người ta' cho chủ thể khái quát ở câu hai, và 'Tanya' / 'cô' ở phần trần thuật."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000701"
    choices:
      - "Thuật ngữ điều lệnh & hành động: giữ 'Đứng nghiêm, cô kịp kìm lại ngay trước khi giơ tay chào theo điều lệnh' và lý do 'đang ăn vận như một thường dân'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000702"
    choices:
      - "Nhận định mục tiêu: giữ 'Mục đích ở đây là quan sát.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000703"
    choices:
      - "Trần thuật: giữ đại từ 'cô' và bước ngoặt 'bất ngờ thấy mình rơi vào cảnh bối rối'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000704"
    choices:
      - "Phủ định ngắn: giữ 'Cô không nhìn thấy gì cả.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000705"
    choices:
      - "Hình ảnh & giọng điệu: giữ 'nói toẹt ra, là cả một biển lưng người chắn phía trước'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000706"
    choices:
      - "Điểm nhìn kép & nhấn mạnh Markdown: giữ đại từ trần thuật 'cô' ở câu đầu, và bọc dấu sao đúng phạm vi câu hỏi nội tâm cuối đoạn với đại từ 'mình' ('*Thế này thì mình biết làm ăn gì được đây?*') theo DEC-P01-001 và DEC-P01-002."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000707"
    choices:
      - "Xưng hô của Rudersdorf: giữ câu hỏi 'Cô có nhìn thấy không đấy?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000708"
    choices:
      - "Trần thuật: giữ 'Cô thành thật đáp lại giọng nói trêu chọc của vị sĩ quan, xen lẫn chút sốt ruột.'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000709"
    choices:
      - "Giọng thoại ngập ngừng & lễ phép với cấp trên: giữ nét lắp bắp 'C-cũng hơi…', từ 'Dạ' và đại từ 'tôi' khi Tanya đáp lời Trung tướng Rudersdorf."
