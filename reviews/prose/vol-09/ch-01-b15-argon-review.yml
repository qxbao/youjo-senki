locked_choices:
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000437
    choice: "Thoại Rudersdorf với Tanya: xưng 'Ta', gọi 'Trung tá' (Colonel)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000438
    choice: "Thoại Tanya với Rudersdorf: xưng 'tôi', tự quy chiếu 'mình', gọi 'ngài' và 'thưa Tướng quân' (sir); giữ sắc thái khách sáo trịnh trọng."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000439
    choice: "Trần thuật ngôi thứ ba: giữ tên 'Tanya', quy chiếu Rudersdorf bằng 'ông'; giữ sắc thái giả vờ kính phục ('như thể đang vô cùng kính phục ông')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000440
    choice: "Thoại Rudersdorf: xưng 'Ta' / 'ta', gọi 'cô'; 'bureaucrat in the capital' -> 'quan chức hành chính ở thủ đô'; giữ câu rào đón 'ta không có ý xúc phạm cô đâu nhé'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000441
    choice: "Thoại Tanya: xưng 'tôi', gọi 'ngài' kèm 'ạ'; đồng nhất 'bureaucrats' -> 'giới quan chức hành chính'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000442
    choice: "Trần thuật và thoại đồng thanh: giữ nguyên cặp dấu ngoặc kép lồng nhau biểu thị hai người cùng cười."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000443
    choice: "Nội tâm bình luận khái quát: giữ ẩn dụ 'chất bôi trơn xã giao tuyệt hảo' và 'mối ác cảm chung dành cho bộ máy quan liêu'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000444
    choice: "Thoại Rudersdorf: 'we' -> 'chúng ta', 'you' -> 'cô'; khóa 'Colonel Lergen' -> 'Đại tá Lergen' và sự đối lập giữa hồ sơ chính thức với thực quyền của Tanya."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000445
    choice: "Thoại Tanya: đáp gọn 'Rõ, thưa Tướng quân.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000446
    choice: "Thoại Rudersdorf: 'your leave' -> 'kỳ nghỉ phép của các cô'; khóa 'Kampfgruppe', 'Colonel Lergen' -> 'Đại tá Lergen', 'General Staff' -> 'Bộ Tổng tham mưu'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000447
    choice: "Thoại Tanya: nhận xét ngắn lễ phép 'Một đợt thăng chức ạ.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000448
    choice: "Độc thoại nội tâm Tanya: gọi Lergen là 'vị đại tá' và 'Anh ta'; khóa 'Central' -> 'Trung ương', 'human capital' -> 'vốn con người', 'social capital' -> 'vốn xã hội'; giữ đúng cấu trúc 'không chỉ… mà còn…' cùng chủ ngữ."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000449
    choice: "Thoại Rudersdorf: 'we' -> 'chúng ta', 'the capital' -> 'thủ đô', 'armored and mage units' -> 'các đơn vị thiết giáp và pháp sư'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000450
    choice: "Thoại Tanya: giữ câu hỏi thăm dò lễ phép về việc bổ sung pháp sư thay thế."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000451
    choice: "Thoại Rudersdorf: câu mệnh lệnh phủ định dứt khoát 'Đừng trông mong gì.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000452
    choice: "Thoại Tanya: giữ dấu chấm lửng biểu thị sự ngập ngừng trước khi đáp '…Tôi hiểu rồi ạ.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000453
    choice: "Độc thoại nội tâm Tanya: tự xưng 'mình' (I) theo DEC-P01-001; giữ phủ định giảm nhẹ đầu câu và sắc thái chấp nhận thực tế."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000454
    choice: "Thoại Rudersdorf: xưng 'Ta', gọi 'cô', 'We' -> 'chúng ta'; khóa 'front lines' -> 'tiền tuyến' và cấu trúc phủ định nhấn mạnh sự chiếu cố ('không rút bớt người từ đơn vị của cô đi')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000455
    choice: "Thoại Tanya: xưng 'tôi' / 'chúng tôi'; khóa 'Kampfgruppe', '203rd Aerial Mage Battalion' -> 'Tiểu đoàn Pháp sư Trên không số 203', 'quick-reaction force' -> 'lực lượng phản ứng nhanh', 'Type 97 computation orb' -> 'quả cầu tính toán Type 97'; giữ giọng điệu khiêm nhường cầu khẩn và câu bỏ lửng."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000456
    choice: "Thoại Rudersdorf: gọi 'Trung tá' (Colonel), 'We' -> 'Chúng ta'; giữ thành ngữ 'Đừng có được đằng chân lân đằng đầu'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000457
    choice: "Thoại Tanya: giữ dấu chấm lửng và câu đáp '…Rõ, thưa Tướng quân.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000458
    choice: "Độc thoại nội tâm: 'we' -> 'chúng ta'; khóa 'First Lieutenant Wüstemann' -> 'Trung úy Wüstemann', 'total war' -> 'chiến tranh tổng lực'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000459
    choice: "Nội tâm pha trần thuật: giữ sự chuyển đổi điểm nhìn tự nhiên giữa 'chúng ta' và 'Tanya' theo sát nguồn; khóa nhấn mạnh Markdown '*Haiz.*' khớp với thẻ em ('Hah.') theo DEC-P01-002; khóa 'Type 97' -> 'mẫu Type 97', 'aerial mages' -> 'các pháp sư trên không'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000460
    choice: "Độc thoại nội tâm Tanya: tự xưng 'mình' (I) theo DEC-P01-001; 'the labor standards guys' -> 'mấy tay thanh tra tiêu chuẩn lao động'; giữ cấu trúc đối lập xưa–nay."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000461
    choice: "Thoại Rudersdorf: xưng 'Ta' / 'ta', gọi 'cô'; khóa 'Colonel Lergen' -> 'Đại tá Lergen'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000462
    choice: "Thoại Tanya: xưng 'tôi', gọi 'thưa Tướng quân' kèm 'ạ'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000463
    choice: "Trần thuật ngôi thứ ba: giữ tên 'Tanya', đại từ 'cô' và 'Colonel Lergen' -> 'Đại tá Lergen'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000464
    choice: "Thoại Lergen và trần thuật: gọi Tanya là 'Trung tá' (Colonel) và 'cô'; trần thuật gọi Lergen là 'anh'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000465
    choice: "Thoại Tanya với Lergen: đáp 'Vâng, thưa Đại tá.' (sir)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000466
    choice: "Thoại Lergen: 'Chúng ta đi dạo một chút nhé.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000467
    choice: "Trần thuật pha nội tâm: quy chiếu Lergen bằng 'anh', Tanya bằng 'cô' và 'Tanya'; giữ dấu gạch ngang ngắt mạch cảm xúc."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000468
    choice: "Trần thuật: giữ tên 'Lergen', đại từ 'cô' cho Tanya; giữ cấu trúc phủ định kép 'vẫn chưa đến mức quá vô tâm mà quên để ý tới…'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000469
    choice: "Nội tâm: 'he' -> 'anh', giữ tình thái suy đoán 'hẳn anh phải có chuyện gì đó muốn bàn'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000470
    choice: "Trần thuật: 'he' -> 'anh', 'his' -> 'của mình'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000471
    choice: "Thoại Lergen với Tanya: xưng 'Tôi', gọi 'cô' và 'Trung tá' (Colonel)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000472
    choice: "Thoại Tanya với Lergen: thêm kính ngữ 'ạ' ('Rất bất lợi ạ.')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000473
    choice: "Thoại Lergen: xác nhận ngắn gọn 'Đúng thế.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000474
    choice: "Trần thuật: 'the esteemed colonel' -> 'vị đại tá đáng kính'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000475
    choice: "Thoại Lergen: giữ nhận định khái quát 'Đây là thực trạng chung ở khắp mọi nơi.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000476
    choice: "Thoại Tanya: câu cảm thán ngắn 'Thật khó mà tin nổi.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000477
    choice: "Thoại Lergen: xưng 'Tôi' / 'tôi', gọi 'Cô' / 'cô' và 'Trung tá Degurechaff' (Colonel Degurechaff); khóa 'public opinion' -> 'dư luận', 'the capital' -> 'thủ đô', 'another world' -> 'một thế giới khác'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000478
    choice: "Trần thuật/nội tâm: 'He' -> 'anh', giữ tên 'Tanya' và cụm 'một thế giới khác' để nối mạch chơi chữ."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000479
    choice: "Thoại Tanya với Lergen: xưng 'tôi'; giữ giọng cảm thán nửa đùa nửa thật và cụm 'một thế giới khác'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000480
    choice: "Nội tâm: 'him' -> 'anh'; giữ sự chuyển ý từ việc Lergen không hiểu hàm ý sang sự đồng cảm nhất thời của Tanya."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000481
    choice: "Nội tâm chiêm nghiệm: khóa 'common language' -> 'tiếng nói chung' và 'another world' -> 'một thế giới khác'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000482
    choice: "Thoại và trần thuật: giữ tiếng thở dài 'Haaah.' trong ngoặc kép theo sát nguồn."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000483
    choice: "Thoại lẩm bẩm thành tiếng của Tanya trước mặt Lergen: xưng 'tôi'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000484
    choice: "Thoại Lergen: khóa 'The language of the Reich' -> 'Ngôn ngữ của Đế quốc' và câu hỏi đuôi 'phải không?'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000485
    choice: "Thoại Tanya: đáp lễ phép 'À, tất nhiên rồi ạ.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000486
    choice: "Độc thoại nội tâm: giữ đồng nhất 'ngôn ngữ của Đế quốc' và 'một thế giới khác'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000487
    choice: "Độc thoại nội tâm Tanya: tự xưng 'Mình' (I) theo DEC-P01-001; giữ nguyên điệp cấu trúc ba lần cụm 'thế giới khác' (another world)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000488
    choice: "Độc thoại nội tâm Tanya: tự xưng 'mình' (I); giữ câu hỏi tự trào 'Có phải mình đang bị đột quỵ không đấy?'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000489
    choice: "Độc thoại nội tâm: khóa 'Being X' -> 'Being X'; giữ đúng cấu trúc giả định trái thực tế trong quá khứ ('Nếu không phải tại… thì chuyện này đã chẳng bao giờ xảy ra')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000490
    choice: "Độc thoại nội tâm kết chương: tự xưng 'mình' (I), gọi Being X là 'tên khốn đó'; giữ sắc thái quyết tâm trả đũa."
