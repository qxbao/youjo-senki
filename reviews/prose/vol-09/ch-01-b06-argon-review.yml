  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000070"
    choices:
      - "Thuật ngữ, phủ định & quan hệ nhượng bộ: giữ 'lực lượng nòng cốt', đại từ 'Chúng ta'/'chúng ta', phủ định 'chẳng còn nơi nào' và mệnh đề nhượng bộ cảm thán với 'lệnh tổng động viên dân số cả nước'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000071"
    choices:
      - "Sắc thái nội tâm & câu hỏi tu từ: giữ cụm 'Đám người cục mịch đang hậu thuẫn cho đạo quân khổng lồ này', phủ định 'không thể vét thêm được chút nhân sự nào nữa' và 'bộ máy quan liêu hiện đại tinh vi của Đế quốc'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000072"
    choices:
      - "Nhấn mạnh Markdown: bọc chính xác toàn bộ câu ngắn '*Sự khởi đầu của hồi kết.*' bằng dấu sao theo DEC-P01-002."
