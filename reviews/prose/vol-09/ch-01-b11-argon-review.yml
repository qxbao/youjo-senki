  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000293"
    choices:
      - "Điểm nhìn quan sát & thuật ngữ: giữ điểm nhìn của Rudersdorf ('ông'), các chi tiết 'đôi mắt rệu rã', 'sĩ quan cấp tá trở về từ mặt trận phía đông', 'Một đứa trẻ mang gương mặt của một vị chỉ huy dày dạn phong sương' và 'chiến tranh tổng lực'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000294"
    choices:
      - "Xưng hô & quân hàm trong thoại: Rudersdorf gọi Tanya là 'Trung tá' và 'cô' trong lời chào hỏi thân tình của cấp trên."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000295"
    choices:
      - "Xưng hô & câu hỏi trong thoại: Tanya gọi Rudersdorf là 'Tướng quân' / 'Ngài', giữ dấu chấm lửng ngập ngừng và kính ngữ 'ạ' trong câu hỏi về việc sụt cân."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000296"
    choices:
      - "Điểm nhìn Tanya & tình thái suy đoán: giữ 'vị cấp trên của Tanya', đại từ 'ông' và tình thái suy đoán 'Hẳn ông đang phải chịu đựng sự kiệt sức và căng thẳng vô cùng lớn'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000297"
    choices:
      - "Quân hàm, tên riêng & nhận định: giữ 'Trung tướng Rudersdorf', 'Tanya' và nhận định đánh giá tính bất cẩn của câu hỏi về việc sụt cân đối với một người đang kiệt quệ."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000298"
    choices:
      - "Đại từ & mức độ đánh giá: giữ đại từ 'ông' quy chiếu Rudersdorf và nhận định 'Chỉ riêng việc hàm ý rằng ông đang ốm yếu hay không khỏe thôi cũng đã là đi quá giới hạn rồi'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000299"
    choices:
      - "Xưng hô & phủ định trong thoại: Rudersdorf tự xưng 'Ta' và giữ phủ định 'không sao nuốt nổi đồ ăn ở đó'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000300"
    choices:
      - "Thuật ngữ & giọng thoại cấp dưới: giữ 'nhà ăn của Văn phòng Bộ Tổng tham mưu' và câu hỏi lễ phép có 'ạ' của Tanya."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000301"
    choices:
      - "Xưng hô trong thoại & quan hệ nhượng bộ: Rudersdorf gọi Tanya là 'Trung tá' / 'cô', tự xưng 'ta'; giữ quan hệ nhượng bộ 'dù biết làm vậy là phí thời gian'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000302"
    choices:
      - "Thuật ngữ & sắc thái mỉa mai: giữ 'mặt trận phía đông' và giọng bông đùa lễ phép ('đấy ạ') của Tanya."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000303"
    choices:
      - "Xưng hô & câu hỏi đáp lời: Rudersdorf gọi Tanya là 'cô' và giữ câu hỏi vặn lại hóm hỉnh '“Ngon đến mức nhận được lời khen tấm tắc từ cô cơ à?”'."
