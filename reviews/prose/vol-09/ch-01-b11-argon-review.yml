findings:
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000264"
    severity: "minor"
    category: "punctuation"
    issue: "Dấu chấm than đặt ngay sau hệ từ 'là' và trước cụm vị ngữ viết thường ('Ngần ấy là! vừa đủ.') gây đứt gãy cú pháp tiếng Việt do bám sát lỗi chế bản tại vị trí ngắt trang của EPUB gốc."
    rationale: "Trong XHTML gốc, dấu chấm than nằm ngay trước thẻ neo ngắt trang page-029 giữa chủ ngữ-hệ từ và bổ ngữ. Khi chuyển sang tiếng Việt, 'Ngần ấy là! vừa đủ.' vừa làm gãy cấu trúc 'là vừa đủ' vừa để chữ thường ngay sau dấu chấm than."
    recommendation: "Sửa thành 'Ngần ấy là vừa đủ.' (lược dấu chấm than do lỗi chế bản ngắt trang) hoặc ngắt câu tự nhiên và viết hoa đầu câu sau dấu chấm than: 'Thế là đủ! Vừa vặn đủ.'."
