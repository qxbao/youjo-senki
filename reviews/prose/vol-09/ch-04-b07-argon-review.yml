locked_choices:
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000053"
    choices:
      - "Phân biệt tên riêng Tanya ở câu trần thuật đầu và đại từ tự xưng (mình) ở câu nội tâm theo DEC-P01-001: Tanya tặc lưỡi lắc đầu / Là một người chuyên nghiệp, mình biết cách tách bạch cảm xúc khỏi nhu cầu… bởi mình hiểu hoàn cảnh như thế này đòi hỏi điều gì."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000054"
    choices:
      - "Mệnh lệnh của Tanya với Thiếu tá Weiss trong thoại: “Từ bỏ đi, Thiếu tá. Chúng ta rút lui!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000055"
    choices:
      - "Lời đáp nhận lệnh ngắn gọn của Weiss: “…Rõ!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000056"
    choices:
      - "Đại từ ngôi thứ ba cho Weiss (anh ta) và nhận định về tác phong cựu binh: Weiss là một cựu binh dày dạn nên anh ta không phản đối quá một lần. Biết tùy thời tùy lúc là điều rất quan trọng."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000057"
    choices:
      - "Xưng hô của chỉ huy Tanya với toàn đơn vị (Tôi - các bạn) và giới hạn mệnh lệnh: “Toàn bộ các đơn vị, rút lui! Tôi cho phép các bạn nã vài phát đạn chia tay vào đám pháp sư địch, nhưng chỉ thế thôi!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000058"
    choices:
      - "Thuật ngữ tác chiến trong lời kể: Tanya chính thức phát lệnh rút lui, đồng thời bật đèn xanh cho một đòn tập kích quấy rối chớp nhoáng nhằm giáng đòn đau vào quân địch đang truy kích."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000059"
    choices:
      - "Đại từ trần thuật về Tanya (cô), đơn vị Đế quốc (họ) và quân truy kích (chúng): Ngay thời điểm cô quyết định gây khó dễ cho toán quân truy đuổi họ, mục tiêu chuyển thành làm chậm bước tiến của chúng càng nhiều càng tốt."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000060"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-176); giữ mệnh lệnh nghiêm cấm tuyệt đối: “Khoan đã! Trước khi bắt đầu nổ súng—kể từ giờ phút này, tôi nghiêm cấm bắn vào bất kỳ con tàu nào!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000061"
    choices:
      - "Câu hỏi sửng sốt của cấp dưới (Weiss) với Tanya: “Sao cơ ạ?!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000062"
    choices:
      - "Cách gọi quân hàm Thiếu tá Weiss và khẩu ngữ trong thoại của Tanya: “Này Thiếu tá, nếu chúng ta đánh chìm hết tàu bè, lũ ngốc đang điên tiết kia sẽ lao vào húc thẳng vào mông chúng ta mất!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000063"
    choices:
      - "Đại từ nội tâm của Tanya (mình), ngôi gọi Weiss trong suy nghĩ (anh) và câu hỏi đuôi: Ở đây chỉ có mỗi mình là biết động não thôi sao? / Khốn thật, Weiss. Dù mình đã nói đến thế rồi, anh vẫn định hễ có cơ hội là lập tức lao vào tấn công chúng ngay đúng không?"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000064"
    choices:
      - "Câu trần thuật chuyển tiếp trước thoại vô tuyến: Ngay lúc Tanya vừa hé môi định mắng cho anh ta một trận thì một giọng nói khác vang lên qua vô tuyến."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000065"
    choices:
      - "Lời giải thích lễ phép của Trung úy Visha gửi Thiếu tá Weiss qua vô tuyến và thuật ngữ: “Thưa Thiếu tá, nếu vẫn còn tàu bè sót lại, lực lượng Khối Thịnh vượng chung sẽ vớt những người đang trôi dạt. Nếu các pháp sư quá bận rộn với nhiệm vụ cứu hộ, họ sẽ không thể đuổi theo chúng ta được ạ!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000066"
    choices:
      - "Lời khen thầm Visha và miêu tả nét mặt Tanya: Hay lắm, Visha! Gương mặt Tanya giãn ra đầy vui vẻ."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000067"
    choices:
      - "Đại từ tự xưng nội tâm (mình) và đại từ ngôi thứ ba cho Visha (Cô ấy): Cố vấn của mình lúc nào cũng hiểu rõ mình đang nghĩ gì. Cô ấy quả thực vẫn là một trợ lý hạng nhất."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000068"
    choices:
      - "Lời thoại của Tanya xác nhận ý kiến của Visha với Weiss: “Đúng như cô ấy nói đấy, Weiss! Hãy tận dụng thật tốt đám lính bị thương! Bọn họ sẽ cần người chăm sóc và cần nơi trú ẩn!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000069"
    choices:
      - "Thuật ngữ chức danh, tàu chiến và miêu tả hành động của Weiss: lời của Tanya và viên sĩ quan phụ tá của cô / Weiss lập tức hiểu ra ngay / một chiếc tàu khu trục địch / đám binh lính dưới mặt nước / nở một nụ cười khẩy hiểm độc"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000070"
    choices:
      - "Cách xưng hô của Thiếu tá Weiss với Trung tá Tanya von Degurechaff và tình thái so sánh: “…Trung tá giàu lòng nhân đạo hơn tôi tưởng đấy ạ.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000071"
    choices:
      - "Câu đáp tự nhận đầy mỉa mai của Tanya trong thoại: “Tôi là một người theo chủ nghĩa nhân đạo từ trong xương tủy mà.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000072"
    choices:
      - "Thuật ngữ chức vụ, đại từ nội tâm (mình) kết hợp tự quy chiếu bằng tên riêng Tanya trong câu hỏi tu từ: vị phó chỉ huy và viên sĩ quan phụ tá của mình / triệu chứng nhiễm độc chiến tranh / ai có thể phủ nhận chuyện Tanya là một tín đồ kiên định của chủ nghĩa nhân đạo cơ chứ?"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000073"
    choices:
      - "Mệnh đề điều kiện giới hạn và đại từ nội tâm (mình): Chừng nào điều đó không xâm phạm đến sự an toàn của bản thân mình, mình hoàn toàn ủng hộ việc sống nhân đạo."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000074"
    choices:
      - "Câu hỏi tu từ phủ định và tình thái khuyên nhủ trong thoại: “Yêu thương đồng loại chẳng phải là điều rất tuyệt vời sao? Cả kẻ thù lẫn đồng minh đều nên trân trọng sinh mạng hơn nữa.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000075"
    choices:
      - "Thuật ngữ biên chế, binh chủng, tàu ngầm và đại từ tập thể (chúng mình) trong nội tâm Tanya: một lực lượng cỡ lữ đoàn pháp sư hải quân đánh bộ của Khối Thịnh vượng chung / hội quân với chiếc tàu ngầm / bám sát đuôi chúng mình / cắt đuôi bọn họ và rút lui êm thấm"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000076"
    choices:
      - "Giả định thông thường đối lập với thực tại may mắn của cả đội (chúng mình): Thông thường thì mọi chuyện sẽ diễn ra như vậy. Nhưng xem chừng chúng mình đang gặp may."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000077"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-177); giữ quan hệ nhân quả và thuật ngữ tàu chiến: đám pháp sư địch / chiếc tàu khu trục đang lết đi một cách tập tễnh kia / cứu vớt đám thủy thủ đoàn đang vùng vẫy dưới nước"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000078"
    choices:
      - "Phủ định tương lai về hành động của đối phương: Và các pháp sư Khối Thịnh vượng chung sẽ không bỏ mặc những người đang cần sự giúp đỡ của họ."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000079"
    choices:
      - "Mệnh lệnh rút quân và khích lệ thuộc cấp của Tanya: “Mặt trời sắp lặn rồi! Rút khỏi đây thôi! Làm tốt lắm, các binh sĩ!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000080"
    choices:
      - "Bảo toàn ba lớp dấu ngoặc kép biểu thị tiếng đồng thanh đáp lệnh: “““Rõ!”””"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000081"
    choices:
      - "Thuật ngữ hải quân, đại từ nội tâm (mình / chúng mình) và cấu trúc lựa chọn bắt buộc: con tàu đó đang nghiêng hẳn sang một bên / chiếc tàu sân bay về danh nghĩa thì vẫn còn nổi / ngăn bọn họ truy đuổi chúng mình quá sát / tập trung vào công tác cứu hộ thay vì đuổi theo"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000082"
    choices:
      - "Lời nhắc nhở định hướng bay trong thoại của Tanya: “Kiểm tra lại định hướng bay đi! Tôi không muốn có ai bị lạc đâu đấy!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000083"
    choices:
      - "Logic thời gian lúc hoàng hôn, thuật ngữ binh chủng và đại từ nội tâm (chúng mình / mình): những người bị rơi xuống biển / các pháp sư hải quân đánh bộ từ bỏ việc truy đuổi chúng mình ngay bây giờ / điểm mấu chốt trong kế hoạch của mình"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000084"
    choices:
      - "Đối lập hai quốc gia và câu hỏi tu từ cuối đoạn: Chỉ được chọn một trong hai mà thôi / Khối Thịnh vượng chung không phải là Liên bang—liệu họ có thực sự nhẫn tâm phớt lờ tính nhân đạo trong một trường hợp như thế này không?"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000085"
    choices:
      - "Câu trần thuật gắn với tên riêng Tanya và lời cảm thán mỉa mai: Tanya biết rõ câu trả lời cho điều đó. Tôn trọng sinh mạng con người! Thật tuyệt vời và nhân đạo làm sao!"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000086"
    choices:
      - "Tình thái giả định chung và tự quy chiếu bằng tên riêng Tanya: Xét dưới góc độ né tránh giao chiến một cách hợp lý, chắc chắn bất kỳ ai cũng sẽ làm như vậy. Ngay cả Tanya cũng sẽ lấy việc giải cứu đồng minh làm cái cớ để tránh né giao tranh."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000087"
    choices:
      - "Cách dịch thành ngữ cùng thắng: Chẳng ai phải chịu thiệt cả; đây là thế đôi bên cùng có lợi."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000088"
    choices:
      - "Thuật ngữ kinh tế học/lý thuyết trò chơi và sắc thái mỉa mai: trạng thái cân bằng thú vị mà ngài Nash vô cùng yêu thích / một nền hòa bình khiêm tốn giữa bối cảnh thời chiến"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000089"
    choices:
      - "Câu trần thuật ngắn về Tanya: Tanya thở dài thườn thượt trong lòng."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000090"
    choices:
      - "Đại từ nội tâm (mình), câu điều kiện và thuật ngữ tài chính: Nếu mình không sống sót qua cuộc chiến này, mình sẽ bỏ lỡ cơ hội thu về những khoản thu nhập thụ động và sống ung dung nhờ tiền bản quyền mất."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000091"
    choices:
      - "Đại từ khái quát (bạn) và tình thái suy đoán: một khi đã xoay xở rút lui ổn thỏa, bạn lại có được cái thú xa xỉ là ngồi than vãn vu vơ / triệu chứng của việc cảm thấy nhẹ nhõm hơn"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000092"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-178); giữ thuật ngữ V-2, lữ đoàn pháp sư hải quân đánh bộ và đại từ nội tâm (mình): Cưỡi V-2 xung phong, thoát khỏi cả một lữ đoàn pháp sư hải quân đánh bộ của địch / sự chủ quan chính là kẻ thù lớn nhất / khoảnh khắc nguy hiểm nhất"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000093"
    choices:
      - "Đại từ ngôi thứ nhất (mình) nối mạch độc thoại sang hành động gọi toàn đơn vị: Nhận thấy cần phải giữ cho binh sĩ dưới quyền luôn cảnh giác, mình buông giọng thản nhiên gọi toàn thể mọi người trong đơn vị."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000094"
    choices:
      - "Lời dặn dò cảnh giác trên đường rút quân về căn cứ của Tanya: “Mọi người làm tốt lắm! Nhưng đừng quên để mắt canh chừng phía sau lưng chúng ta đấy! Nhiệm vụ vẫn chưa kết thúc cho đến khi chúng ta trở về căn cứ an toàn đâu. Đừng có lơ là cảnh giác trên đường về nhà!”"
