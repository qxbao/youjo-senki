locked_choices:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000606"
    choice: "Dịch 'eastern front–style' là 'phong cách của mặt trận phía đông', giữ nhịp khẳng định ngắn gọn về nguyên tắc đảm bảo mức tối thiểu."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000607"
    choice: "Giữ thế đối lập giữa sự thiếu thốn đủ bề và việc mức tối thiểu luôn sẵn sàng; dịch chuẩn bốn binh chủng 'Lực lượng thiết giáp, pháo binh, bộ binh, pháp sư'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000608"
    choice: "Giữ nguyên 'Kampfgruppe' và ý cần tránh mọi trận đánh bị gián đoạn chi viện."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000609"
    choice: "Meybert xưng 'chúng tôi' (đại diện đơn vị pháo binh) khi hứa chi viện 'hỏa lực yểm trợ' cho Tospan."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000610"
    choice: "Dịch 'receiver' là 'ống nghe' và 'an NCO' là 'một người hạ sĩ quan'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000611"
    choice: "Dịch 'high explosives' là 'đạn nổ mạnh', giữ rõ chỉ dẫn chỉ đổi loại đạn ở một vị trí."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000612"
    choice: "Người hạ sĩ quan gọi 'Thưa Đại úy?', dịch 'armor-penetrating rounds' là 'đạn xuyên giáp' và giữ câu nói bỏ lửng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000613"
    choice: "Dịch 'the lower-ranking officer' là 'người cấp dưới có quân hàm thấp hơn' để khớp mạch với người hạ sĩ quan ở p000610/p000616; Meybert xưng 'Chúng ta' / 'ta'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000614"
    choice: "Cấp dưới thưa có tiểu từ 'ạ', dịch 'garrison' là 'đơn vị đồn trú' và 'facilities' là 'các công trình'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000615"
    choice: "Meybert xưng 'Tôi' với giọng gạt phắt: 'Tôi cóc cần biết!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000616"
    choice: "Đại từ 'anh' cho Meybert; dịch 'NCO' là 'người hạ sĩ quan'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000617"
    choice: "Giữ giọng quát thẳng thắn của Meybert rằng giờ mới lo hư hại công trình thì đã muộn."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000618"
    choice: "Dịch 'military administrators' là 'đám sĩ quan quân quản', 'occupied territory' là 'lãnh thổ chiếm đóng'; giữ lập luận phân định trách nhiệm sòng phẳng của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000619"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ câu độc thoại nội tâm '*Xong trận đánh này, các người muốn tôi điền bao nhiêu trang giấy tờ cũng được.*'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000620"
    choice: "Giữ tiếng hô cảnh báo quân địch sắp đâm sầm vào."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000621"
    choice: "Dịch 'destroyer' là 'tàu khu trục', giữ nhận xét con tàu quá cứng cáp so với tàu khu trục thông thường."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000622"
    choice: "Giữ phủ định nhấn mạnh rằng cụm quân địch lao tới thậm chí chẳng hề giảm tốc độ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000623"
    choice: "Dịch 'pseudo-destroyer' là 'chiếc tàu khu trục trá hình' và 'wharf' là 'cầu cảng', giữ chi tiết hích phần bụng kim loại trườn lên mặt cầu cảng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000624"
    choice: "Giữ nhịp mô tả bộ binh địch tản ra và thoăn thoắt nhảy xuống."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000625"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*đúng là*' ('is') và dịch 'commando unit' là 'đơn vị biệt kích'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000626"
    choice: "Đại từ 'anh' cho Meybert; giữ tương phản số lượng ít nhưng tác phong nhanh nhẹn, kỷ luật và được huấn luyện bài bản."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000627"
    choice: "Giữ tình thái 'dường như' ('seemed to') và 'có lẽ sẽ' ('would probably') khi so sánh sự lì lợm của đơn vị địch với lính Liên bang."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000628"
    choice: "Dịch 'tank desant' là 'chiến thuật tùng thiết trên xe tăng', 'destroyer desant' là 'tùng thiết trên tàu khu trục', 'boarding' là 'đổ bộ tiếp mạn' và 'the limeys' là 'đám người Anh'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000629"
    choice: "Dịch 'position defense' là 'phòng ngự trận địa', 'matériel might' là 'sức mạnh vật tư và trang bị quân sự'; giữ tình thái 'có lẽ' ('probably') về việc đại đội bộ binh của Tospan sẽ xử lý được toán biệt kích."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000630"
    choice: "Tiếng gọi khẩn trương của cấp dưới: 'Thưa Đại úy!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000631"
    choice: "Meybert xưng 'Tôi', gọi các pháo thủ là 'các cậu' và dịch 'the limeys' là 'đám người Anh'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000632"
    choice: "Dịch 'high explosives' là 'đạn nổ mạnh', 'enemy destroyer' là 'chiếc tàu khu trục của địch', giữ ý phát bắn tiệm cận sự hoàn hảo hết mức có thể."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000633"
    choice: "Giữ rõ nguyên nhân hạn chế hiệu quả pháo kích do tường các công trình tại cảng chắn góc bắn và có quá nhiều chướng ngại vật."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000634"
    choice: "Giữ quan hệ nhân quả: quân ta và địch áp sát hỗn chiến cộng thêm thời điểm phát tán mảnh văng của đạn nổ mạnh khó lường nên pháo binh chần chừ không dám bắn bừa."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000635"
    choice: "Meybert dùng 'chúng ta' khi nhận xét hiệu quả bị hạn chế ở địa hình này."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000636"
    choice: "Đại từ 'Anh' cho Meybert và 'họ' cho đơn vị pháo binh; dịch 'supporting fire' là 'hỏa lực yểm trợ'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000637"
    choice: "Meybert dùng 'Chúng ta' / 'ta', giữ tình thái cân nhắc 'Có lẽ ta nên bắn chúng trước' và tiếng gầm gừ bối rối 'Hử?!' khi nhìn qua ống nhòm."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000638"
    choice: "Giữ hai câu hỏi nội tâm trong trần thuật ('Có ai đó đã bắn trúng trực diện ư? Là đơn vị nào thế?') không tự ý thêm in nghiêng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000639"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown ở chữ '*màn chắn*' trong cụm 'một *màn chắn* khói' ('a smoke *screen*')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000640"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ đoạn độc thoại nội tâm của Meybert về việc tàu địch dùng màn khói."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000641"
    choice: "Dịch 'coastal guns' là 'khẩu pháo bờ biển' và 'smoke screens' là 'màn khói ngụy trang'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000642"
    choice: "Dịch 'area barrage' là 'màn pháo kích diện rộng' và 'direct hit' là 'bắn trúng trực diện', giữ rõ hai lý do pháo binh không thể bắn hiệu quả."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000643"
    choice: "Dịch 'commandos' là 'đám biệt kích', 'garrison troops' là 'binh lính đồn trú' và giữ câu điều kiện bỏ lửng ở cuối."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000644"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown ở câu đầu '*Tình hình đằng đó thế nào rồi?*' và giữ mô tả cái cau mày tuyệt vọng của Meybert."
