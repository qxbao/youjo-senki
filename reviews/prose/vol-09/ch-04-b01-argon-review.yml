locked_choices:
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000001"
    choices:
      - "Tiêu đề thời gian – địa điểm: giữ nguyên chữ in hoa 'NGÀY 15 THÁNG 7 NĂM THỐNG NHẤT 1927, MẶT TRẬN NỘI HẢI'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000002"
    choices:
      - "Trần thuật mở đầu: giữ 'Hiện tại, các tàu ngầm của Đế quốc thường hoạt động theo bầy.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000003"
    choices:
      - "So sánh tăng tiến & thuật ngữ: giữ chuỗi 'Hai chiếc tàu ngầm tốt hơn một chiếc. Ba chiếc lại tốt hơn hai chiếc. Cốt lõi nằm ở ưu thế số lượng.' cùng các thuật ngữ 'chiến thuật bầy sói', 'đánh chặn tàu buôn' và 'thiết giáp hạm'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000004"
    choices:
      - "Trần thuật: giữ 'Khi có báo cáo phát hiện mục tiêu, cuộc săn đuổi liền bắt đầu.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000005"
    choices:
      - "Thuật ngữ hải quân: giữ 'Hải đội đã tiếp cận mục tiêu thành công.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000006"
    choices:
      - "Thoại báo cáo: giữ '“Có điện từ tàu bạn trong hải đội. Đã phát hiện tàu địch!”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000007"
    choices:
      - "Thoại báo cáo sonar: giữ '“Bắt được tín hiệu trên sonar rồi!”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000008"
    choices:
      - "Câu hỏi trong thoại: giữ '“Nguồn phát ra âm thanh là gì?”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000009"
    choices:
      - "Thoại xác nhận & thuật ngữ: giữ mức khẳng định 'Chắc chắn là chân vịt tàu địch.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000010"
    choices:
      - "Dấu chấm lửng, câu hỏi & thuật ngữ trong thoại: giữ đủ các dấu chấm lửng ngập ngừng, phủ định tăng tiến 'Không chỉ có một chiếc…', câu hỏi phân loại 'Tàu thuộc lớp nào thế này?' và kết luận 'đó chắc chắn là một đoàn tàu có hộ tống'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000011"
    choices:
      - "Mệnh lệnh & phủ định trong thoại: giữ '“Chuẩn bị phóng ngư lôi! Đừng để tụt lại phía sau các tàu khác!”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000012"
    choices:
      - "Trần thuật & thuật ngữ: giữ 'phòng điều khiển' và trạng thái 'tập trung cao độ và hết sức cảnh giác'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000013"
    choices:
      - "Chức danh & trần thuật: giữ 'Từ Thuyền trưởng Barchet trở xuống, toàn bộ thủy thủ đoàn đều đang làm việc vô cùng ấn tượng.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000014"
    choices:
      - "Điểm nhìn trần thuật & thuật ngữ: giữ tên riêng 'Tanya', chi tiết 'người chỉ ngồi dự thính cho có lệ' và 'những người lính tàu ngầm này hết sức nhạy bén'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000015"
    choices:
      - "Tình thái phỏng đoán & đại từ trần thuật: giữ tình thái 'hẳn công việc đã tạm ổn thỏa', tên riêng 'Barchet' và đại từ 'ông'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000016"
    choices:
      - "Quân hàm & giọng ngập ngừng trong thoại: giữ '“Trung tá Degurechaff này, ờm… mặt trời sắp lặn rồi.”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000017"
    choices:
      - "Dấu gạch ngang & xưng hô trong thoại: giữ dấu gạch ngang dài và đại từ 'tôi' trong '“Ngay trước lúc hoàng hôn—theo tôi thì đó là thời điểm hoàn hảo để tấn công đấy.”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000018"
    choices:
      - "Cấu trúc chêm xen, khí tài & câu hỏi trong thoại: giữ phần dẫn chêm giữa cặp gạch ngang dài '—ông có vẻ đang suy tính rồi nói ra mối băn khoăn của mình—', tên khí tài 'V-2', nhận định 'tầm nhìn hạn chế vào lúc chập choạng tối hoàn toàn không mấy lý tưởng' và câu hỏi xin ý kiến 'Chúng ta có nên tránh giao chiến không?'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000019"
    choices:
      - "Nhận định ngắn: giữ 'Ông ấy nói có lý.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000020"
    choices:
      - "Nhận định đối lập: giữ 'Mặt khác, đó cũng chỉ là một khía cạnh mà thôi.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000021"
    choices:
      - "Xưng hô, câu điều kiện, phủ định & không thêm nhấn mạnh: giữ cặp xưng hô lịch thiệp 'ngài' – 'tôi' / 'chúng ta' khi Tanya nói với Thuyền trưởng Barchet, câu điều kiện phủ định 'Nếu chúng ta rút lui bây giờ thì chẳng có gì đảm bảo sẽ tiếp cận lại được mục tiêu', và không thêm nhấn mạnh Markdown tại vị trí thẻ neo trang page-162."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000022"
    choices:
      - "Đại từ số nhiều loại trừ trong thoại: giữ 'chúng tôi' (chỉ riêng thủy thủ đoàn tàu ngầm) trong '“Đó là phần việc của chúng tôi.”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000023"
    choices:
      - "Độc thoại nội tâm & phủ định theo DEC-P01-001: giữ đại từ nội tâm 'bọn mình' – 'mình', danh xưng 'vị thuyền trưởng', đại từ 'ông ấy' và phủ định kép 'mình chẳng phải hạng gà mờ trên cạn hoàn toàn mù tịt về cách thức hoạt động của tàu ngầm'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000024"
    choices:
      - "Thoại khẳng định của Tanya: giữ '“Tôi đang nói dựa trên kinh nghiệm đấy.”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000025"
    choices:
      - "Thoại ngắn: giữ '“Ồ?”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000026"
    choices:
      - "Địa danh, trần thuật & yêu cầu tác chiến trong thoại: giữ tên riêng 'Tanya', địa danh 'Norden', danh xưng 'vị thuyền trưởng', nhận định giới hạn vật lý 'Tốc độ di chuyển dưới mặt nước của tàu ngầm có giới hạn' và lời đề nghị 'Tôi biết yêu cầu thế này là đòi hỏi nhiều, nhưng tôi muốn ngài cứ tiếp tục đẩy mạnh đợt tấn công.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000027"
    choices:
      - "Đại từ & hình ảnh so sánh trong thoại: giữ '“Xin đừng nói như thể chúng tôi là loài rùa chậm chạp vậy chứ.”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000028"
    choices:
      - "Xưng hô, phủ định & dấu chấm lửng trong thoại: giữ cặp đại từ 'Tôi' – 'ngài', phủ định 'Tôi không có ý chê trách ngài hay thủy thủ đoàn' và dấu chấm lửng trong 'Vấn đề về độ cơ động không phải… chuyện có thể giải quyết bằng cách nỗ lực hết sức.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000029"
    choices:
      - "Điểm nhìn trần thuật, tình thái & thuật ngữ: giữ đại từ 'nó' – 'mình', danh xưng 'vị thuyền trưởng', đại từ 'ông', tình thái phỏng đoán phủ định 'Hẳn ông không ngờ mình lại phải nghe thuyết giảng về chiến thuật tàu ngầm' và thuật ngữ 'một sĩ quan ma pháp đơn thuần'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000030"
    choices:
      - "Nhận định trần thuật: giữ 'Mà quả thật họ cũng là dân chuyên nghiệp.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000031"
    choices:
      - "Độc thoại nội tâm & chuỗi định nghĩa tăng tiến: giữ tự quy chiếu 'Mình' theo DEC-P01-001, nhận xét 'kiểu nói chuyện ra vẻ biết tuốt là chẳng lịch sự chút nào' và chuỗi ba vị ngữ dẫn tới 'cái thứ cực kỳ gai góc mang tên mệnh lệnh từ sĩ quan cấp trên'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000032"
    choices:
      - "Ẩn dụ điển tích, phủ định & xưng hô trong thoại: giữ tên riêng 'Tanya', ẩn dụ 'Nữ thần May mắn', phủ định 'Chẳng có gì đảm bảo Nữ thần May mắn sẽ để yên cho chúng ta túm tóc bà ta từ phía sau đâu', hành động 'táng thẳng vào mặt bà ta rồi vơ lấy bất cứ thứ gì nắm được trong lúc còn cơ hội' và câu hỏi kết 'Ngài có đồng ý không, Thuyền trưởng?'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000033"
    choices:
      - "Xưng hô, dấu chấm lửng & tên đơn vị trong thoại: giữ đại từ 'cô' (Barchet gọi Tanya), 'chúng ta', dấu chấm lửng sau 'bất cứ giá nào…' và tên đơn vị 'Quân đoàn Viễn chinh Lục địa Phía nam'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000034"
    choices:
      - "Trần thuật & nhân vật: giữ tên riêng 'Barchet', 'Tanya', 'Trung úy Serebryakov' và chi tiết 'buông một tiếng thở dài ngao ngán'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000035"
    choices:
      - "Quân hàm & câu hỏi trong thoại: giữ '“Có tin tức gì mới không, thưa Trung tá?”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000036"
    choices:
      - "Mệnh lệnh & quân hàm trong thoại: giữ '“Chuẩn bị xuất kích đi, Trung úy. Đến giờ cho tiết mục chính của mọi chiến dịch tàu ngầm rồi.”'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000037"
    choices:
      - "Nhấn mạnh Markdown, điểm nhìn & so sánh khí tài: không thêm nhấn mạnh tại vị trí thẻ neo trang page-163, chỉ bọc '*Và đó là lý do…*' bằng dấu sao theo DEC-P01-002, giữ đại từ trần thuật 'Nó', so sánh phủ định 'Lần này sẽ không xóc nảy dữ dội như hồi dùng mẫu V-1 đâu' và khẳng định 'Chúng ta sẽ có thể điều khiển hướng đi đôi chút.'."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000038"
    choices:
      - "Trần thuật kết lô: giữ 'Giữa những tiếng cười ồn ào, Tanya quay về phía một người lính liên lạc đang chạy tới.'."
