findings:
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000003"
    severity: "minor"
    category: "style_pronoun_agreement"
    issue: "Ở câu cuối, cụm danh từ số nhiều chỉ chiến thuật đánh theo bầy trong nguyên tác được dịch sang danh từ số ít 'Chiến thuật bầy sói này', nhưng mệnh đề sau vẫn dùng đại từ số nhiều 'chúng' ('nhưng chúng vẫn phát huy tác dụng rất tốt') để quy chiếu lại."
    recommendation: "Ở bước chuốt văn Flash, có thể đổi 'chúng' thành 'nó' ('nhưng nó vẫn phát huy tác dụng rất tốt') hoặc đổi chủ ngữ vế đầu thành 'Các chiến thuật bầy sói này' để thống nhất số ít/số nhiều giữa hai vế."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000029"
    severity: "minor"
    category: "pronouns"
    issue: "Đại từ trần thuật ngôi thứ ba quy chiếu Tanya trong lô ch-04-b01 (tại p000029, p000037) dùng 'nó' theo sát DEC-P01-001 (nhất quán với chuỗi lô từ ch-03-b11 trở đi), trong khi một số lô đầu của tập 9 dùng 'cô'."
    recommendation: "Nội bộ lô ch-04-b01 đã phân tách nhất quán giữa trần thuật ('nó' / 'Tanya'), độc thoại nội tâm ('mình' / 'bọn mình' tại p000023, p000029, p000031) và thoại công vụ ('tôi' / 'chúng ta'); ở bước chuốt văn hoặc ghép chương có thể giữ nguyên theo DEC-P01-001 hoặc đồng bộ thành 'cô' tùy quyết định của điều phối viên."
  - segment_id: "YS-LN09/Text/chapter014.xhtml/p000031"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Câu thứ hai trong nguyên tác lấy danh từ chỉ 'sự cấp thiết' làm chủ ngữ chung cho chuỗi ba vị ngữ đẳng lập ('là mẹ đẻ của phát minh', 'là người bảo trợ của sự đổi mới bắt buộc', và 'suy cho cùng là cái thứ cực kỳ gai góc mang tên mệnh lệnh từ sĩ quan cấp trên'). Khi vế đầu được Việt hóa thành câu thành ngữ trọn vẹn 'cái khó ló cái khôn', hai vị ngữ phía sau ('là bà đỡ của sự đổi mới bắt buộc, và suy cho cùng, chính là cái thứ cực kỳ gai góc...') bị khuyết chủ ngữ danh từ hoặc dễ bị hiểu nhầm chủ ngữ là 'cái khôn'."
    recommendation: "Ở bước chuốt văn Flash, nên khôi phục chủ ngữ danh từ để giữ mạch cấu trúc ba vị ngữ nối tiếp, chẳng hạn: 'Nhưng sự cấp thiết vốn là mẹ đẻ của phát minh, là người bảo trợ cho sự đổi mới bắt buộc, và suy cho cùng, chính là cái thứ cực kỳ gai góc mang tên mệnh lệnh từ sĩ quan cấp trên.'"
