    issue: "Dịch lệch danh từ phương tiện và động từ di chuyển tại nhà ga đường sắt: cụm chỉ các đoàn tàu hỏa đang tiến vào ga bị dịch thành 'dòng tàu thuyền cập bến'."
    rationale: "Bối cảnh từ p000002 đến p000008 đang miêu tả mạng lưới đường sắt và Ga Trung tâm tại đế đô Berun nội địa; danh từ gốc chỉ các đoàn tàu hỏa đến ga chứ không phải phương tiện đường thủy ('tàu thuyền cập bến')."
    recommendation: "Sửa 'dòng tàu thuyền cập bến' thành 'dòng đoàn tàu tiến vào ga' hoặc 'những đoàn tàu nối đuôi nhau tiến vào ga'."
