locked_choices:
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000001"
    choices:
      - "Tiêu đề cảnh & địa danh: giữ nguyên định dạng in hoa 'NGÀY 29 THÁNG 6 NĂM THỐNG NHẤT 1927, ĐẾ ĐÔ BERUN'; không thêm nhấn mạnh Markdown."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000002"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: bọc chính xác ba cụm '*Đường*', '*sắt*' và '*đường sắt*' theo DEC-P01-002; giữ các thuật ngữ 'Con đường Hoàng gia', 'những tuyến đường lớn của La Mã', 'Tổ quốc' và 'mặt trận'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000003"
    choices:
      - "Thuật ngữ & quan hệ tăng tiến: giữ 'quốc gia dân tộc' cho 'nation-state' và cấu trúc tăng tiến 'Quan trọng hơn cả, nó gắn kết một cách hữu cơ...'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000004"
    choices:
      - "Thuật ngữ, phủ định & tình thái: giữ 'Đế quốc', 'cường quốc quân sự trên bộ', 'cỗ máy chiến tranh' và cấu trúc phủ định so sánh tuyệt đối 'không thể có phương thức vận tải thời chiến nào tốt hơn đường sắt'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000005"
    choices:
      - "Đại từ & điểm nhìn: giữ đại từ 'chúng ta' thể hiện góc nhìn gắn với phía Đế quốc trong lời dẫn."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000006"
    choices:
      - "Địa danh & tình thái: giữ 'đế đô Berun', 'Ga Trung tâm' và tình thái dè dặt 'có lẽ vẫn còn là nói nhẹ'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000007"
    choices:
      - "Tình thái giả định & hình ảnh ẩn dụ: giữ giả định 'sẽ là quá sức đối với một cơ thể bằng xương bằng thịt' và thế đối lập với 'trái tim bằng thép, những tuyến đường sắt đóng vai trò huyết mạch, và một vùng lõi dân cư đông đúc vận hành bằng hơi nước'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000008"
    choices:
      - "Điểm nhìn & nghĩa: giữ điểm nhìn quan sát của Tanya qua cửa sổ toa tàu chở khách đang chầm chậm tiến vào ga; sửa cụm chỉ các đoàn tàu đến ga cho đúng phương tiện đường sắt (không dùng 'tàu thuyền cập bến')."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000009"
    choices:
      - "Đại từ trần thuật, phủ định & dấu câu: quy chiếu Tanya bằng 'cô' trong trần thuật; giữ quan hệ nhượng bộ phủ định 'Dù chẳng mấy tương xứng với...' và cụm ngoặc kép '“sức mạnh của Đế quốc”'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000010"
    choices:
      - "Tình thái suy đoán & thuật ngữ: giữ tình thái suy đoán chắc chắn 'hẳn phải là quân nhu', định danh 'Đế quốc' và 'tiền tuyến'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000011"
    choices:
      - "Thuật ngữ: giữ 'ô cửa sổ khoang hạng nhất' và nhận định không đổi 'vẫn y hệt như mọi khi'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000012"
    choices:
      - "Đại từ độc thoại & tình thái: Tanya tự nhủ một mình dùng đại từ 'mình' và giữ tình thái 'Xem ra…'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000013"
    choices:
      - "Điểm nhìn trần thuật: giữ tên riêng 'Tanya' và sắc thái lời thì thầm sâu lắng."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000014"
    choices:
      - "Đại từ trần thuật, thời gian & thuật ngữ: quy chiếu Tanya bằng 'cô'; giữ 'mặt trận phía đông', mốc thời gian 'trước lúc mùa khô kéo tới' và mục đích 'tái tổ chức và nghỉ ngơi'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000015"
    choices:
      - "Thuật ngữ, cấp bậc & điểm nhìn nội tâm: giữ 'Kampfgruppe Lergen', 'Trung tướng Zettour'; chuyển mượt sang nội tâm trực tiếp ở câu thứ hai với đại từ 'chúng ta' và tự quy chiếu 'mình' theo DEC-P01-001."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000016"
    choices:
      - "Nhấn mạnh Markdown, phủ định & đại từ: chỉ bọc '*Làm như có chuyện đó vậy.*' bằng dấu sao theo DEC-P01-002; giữ đại từ 'chúng ta' và hai cấu trúc phủ định ('không thể làm ngơ được', 'chẳng có gì là đặc biệt cả')."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000017"
    choices:
      - "Quân hàm, tên riêng & thuật ngữ: giữ 'hai Đại úy Ahrens và Meybert', 'chứng từ vận chuyển cùng các mẫu đơn xin cấp phát', đại từ 'chúng ta' và 'chính quốc'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000018"
    choices:
      - "Điểm nhìn nội tâm, tình thái & thuật ngữ: Tanya tự quy chiếu bằng 'mình' ('đám hiếu chiến dưới quyền mình'); giữ 'lính Liên bang' và tình thái suy đoán 'hẳn... cũng phải vui mừng'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000019"
    choices:
      - "Quân hàm & tên riêng: giữ 'Trung úy Serebryakov'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000020"
    choices:
      - "Quân hàm & xưng hô trong thoại: Serebryakov gọi Tanya là 'Thưa Trung tá', dùng 'chúng ta' và kính ngữ 'ạ'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000021"
    choices:
      - "Thuật ngữ & câu hỏi nội tâm: giữ 'viên sĩ quan phụ tá của Tanya' và câu tự hỏi đánh giá sắc thái 'Hay nói là cô nàng đang vô tư lự thì chính xác hơn nhỉ?'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000022"
    choices:
      - "Thoại ngắn: giữ câu cảm thán ngắn gọn '“Cuối cùng cũng về đến nhà rồi.”'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000023"
    choices:
      - "Xưng hô & sắc thái thoại: Serebryakov đáp lời lễ phép ('Vâng... ạ'), dùng đại từ 'chúng ta' và địa danh 'thủ đô'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000024"
    choices:
      - "Đại từ trần thuật & phủ định: quy chiếu Tanya bằng 'cô' và 'Tanya'; giữ phủ định 'chẳng đủ tốt để mỉm cười đáp lại'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000025"
    choices:
      - "Xưng hô trong thoại, thuật ngữ & phủ định: Tanya xưng 'tôi' khi nói chuyện với cấp dưới; giữ 'tiền tuyến', 'hậu phương', tình thái 'có khi làm tôi phát điên mất' và phủ định triệt để 'hoàn toàn chẳng hiểu nổi'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000026"
    choices:
      - "Giọng thoại cấp dưới: giữ dấu chấm lửng mở đầu và tiểu từ kính ngữ 'ạ' của Serebryakov."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000027"
    choices:
      - "Xưng hô, quân hàm & phủ định: Tanya gọi Serebryakov là 'Trung úy', tự xưng 'Tôi'; giữ phần giải thích sau gạch ngang dài '—lũ ngu—' và hai phủ định ('không biết ai đã kiểm duyệt', 'chẳng hề có chút khái niệm nào về thế giới thực cả')."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000028"
    choices:
      - "Điểm nhìn nội tâm & thuật ngữ: giữ tự quy chiếu 'mình' của Tanya theo DEC-P01-001, 'thủ đô', 'miền đông', 'hậu phương' và 'Zettour'."
  - segment_id: "YS-LN09/Text/chapter002.xhtml/p000029"
    choices:
      - "Điểm nhìn nội tâm & quan hệ thời gian: giữ cấu trúc 'Chỉ sau khi... mới...' và đại từ tự quy chiếu 'mình' trong độc thoại nội tâm của Tanya."
