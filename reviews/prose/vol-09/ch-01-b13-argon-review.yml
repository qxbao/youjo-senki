  - segment_id: YS-LN09/Text/chapter004.xhtml/p000349
    choice: "Trần thuật: 'The man speaking' -> 'Người đàn ông đang lên tiếng', 'in dismay' -> 'vẻ ngao ngán'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000350
