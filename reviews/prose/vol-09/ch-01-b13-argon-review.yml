  - segment_id: YS-LN09/Text/chapter004.xhtml/p000344
    choice: "Thoại Rudersdorf: xưng 'Ta', gọi Tanya là 'Trung tá' (Colonel) và 'cô'; khóa 'major offensive' -> 'cuộc tiến công quy mô lớn'."
