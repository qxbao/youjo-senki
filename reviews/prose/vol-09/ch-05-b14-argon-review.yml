  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000420"
    choice: "Meybert xưng 'tôi' khi xin phép nổ súng lần cuối."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000421"
    choice: "Dịch 'Captain Meybert' là 'Đại úy Meybert', Trung tá Paul gọi Meybert là 'anh', giữ giọng quát tháo và câu hỏi giả định về việc bắn nhầm tàu quân mình."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000422"
    choice: "Đại từ trần thuật 'Anh' cho Meybert, bảo toàn đúng phạm vi nhấn mạnh Markdown '*Mẹ kiếp tất cả đi.*' ở câu giữa."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000423"
    choice: "Meybert xưng 'Tôi' khi nhận định cuộc trao đổi không đi đến đâu."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000424"
    choice: "Dịch 'Captain' là 'Đại úy', giữ đại từ 'anh' từ phía Trung tá Paul."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000425"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown cho phần độc thoại xen giữa hai câu thoại; xưng hô 'Các ngài' trong thoại với 'Bộ chỉ huy' và 'ông' trong độc thoại nội tâm hướng tới Paul."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000426"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ đoạn độc thoại nội tâm, dùng đại từ tự xưng 'Mình'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000427"
    choice: "Dịch ngắn gọn câu nói lịch sự mang tính cắt ngang trước khi dập máy: 'Xin thứ lỗi.'"
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000428"
    choice: "Đại từ trần thuật 'Anh' cho Meybert, dịch 'his people' là 'những người lính dưới quyền'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000429"
    choice: "Bảo toàn nhấn mạnh Markdown '*rõ, thưa Đại úy*' cho cụm 'yes, sir' không lời của thuộc cấp."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000430"
    choice: "Giữ đúng cấu trúc điều kiện phủ định kép và bảo toàn nhấn mạnh Markdown duy nhất ở từ '*không*'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000431"
    choice: "Giữ nguyên ý nhấn mạnh tính chất cơ bản, dễ hiểu của nguyên tắc nhận diện địch - ta."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000432"
    choice: "Dịch 'the captain' là 'vị đại úy', 'HQ' là 'bộ chỉ huy', đại từ nội tâm 'mình' và bảo toàn nhấn mạnh Markdown cho hai câu độc thoại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000433"
    choice: "Giữ nhịp câu nhận định khái quát về sự phi lý trên chiến trường."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000434"
    choice: "Hạ sĩ quan gọi 'Thưa Đại úy', dùng đại từ 'chúng ta' và kính ngữ 'ạ'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000435"
    choice: "Dịch 'the NCO' là 'người hạ sĩ quan', giữ mệnh lệnh ngắn gọn 'Cứ xử lý chúng như quân địch.'"
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000436"
    choice: "Giữ cấu trúc phủ định kép 'không phải là anh không thoáng nghĩ', bảo toàn đúng phạm vi nhấn mạnh Markdown '*Nhỡ mình sai thì sao…?*' và không in nghiêng câu hỏi tiếp theo."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000437"
    choice: "Bảo toàn nhấn mạnh Markdown '*…Đến lúc đó rồi tính.*' cho câu độc thoại nội tâm."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000438"
    choice: "Giữ giọng nói dứt khoát, giản lược của Meybert trước thuộc cấp: 'Chúng không chứng minh được mình là quân ta. Vậy nên chúng là kẻ xấu.'"
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000439"
    choice: "Bảo toàn chính xác hai vùng nhấn mạnh Markdown ở đầu và cuối đoạn; dịch 'southern continent' là 'lục địa phía nam' và giữ cấu trúc phủ định kép khẳng định."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000440"
    choice: "Dịch sát nghĩa 'friendly fire' và câu điều kiện giả định trái thực tế ở quá khứ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000441"
    choice: "Meybert xưng 'Tôi' và 'chúng ta - mình' khi kết luận với thuộc cấp rằng đối phương đang cố đánh lừa họ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000442"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ hai câu độc thoại nội tâm chốt hạ quyết định của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000443"
    choice: "Dịch khẩu lệnh tác chiến chuẩn xác: 'Chuẩn bị!' và 'Ngắm!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000444"
    choice: "Dịch 'command post' là 'sở chỉ huy', giữ hình ảnh ẩn dụ tiếng bánh răng nghiến làm khựng guồng quay."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000445"
    choice: "Hạ sĩ quan báo cáo 'Thưa Đại úy, là từ bộ chỉ huy ạ.'"
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000446"
    choice: "Dịch 'the NCO' là 'người hạ sĩ quan', giữ mệnh lệnh tiếp tục giữ đường ngắm trong khi Meybert nghe điện thoại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000447"
    choice: "Dịch 'HQ' là 'bộ chỉ huy', giữ sắc thái ngán ngẩm và thất vọng của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000448"
    choice: "Giữ đúng sắc thái đối lập nhẹ giữa sự chuẩn bị cho tình huống xấu nhất và chút lạc quan còn sót lại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000449"
    choice: "Bảo toàn chính xác hai cặp nhấn mạnh Markdown tách biệt quanh chữ 'quá mức' ('that' không in nghiêng giữa hai phần in nghiêng của bản gốc)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000450"
    choice: "Đại từ trần thuật 'anh' và tự quy chiếu 'mình' cho Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000451"
    choice: "Giữ giọng quát tháo gay gắt của Trung tá Paul với 'Đại úy Meybert' ('Anh')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000452"
    choice: "Giữ dấu gạch ngang dài và câu cảm thán phê phán sự vô lý của cấp trên giữa tình huống khẩn cấp."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000453"
    choice: "Bảo toàn nhấn mạnh Markdown '*Lạy Chúa, đây là một bài thử thách sao?*' cho phần độc thoại nội tâm."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000454"
    choice: "Dịch 'the colonel' là 'vị trung tá' (ám chỉ Trung tá Tanya von Degurechaff), Meybert xưng 'tôi'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000455"
    choice: "Giữ câu hỏi tưởng bở của Trung tá Paul: 'Anh hiểu rồi ư, Đại úy?'"
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000456"
    choice: "Meybert khẳng định đối tượng mình nhắc tới là 'cấp trên trực tiếp của tôi' ('my direct superior')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000457"
    choice: "Giữ câu hỏi ngơ ngác 'Cái gì?' của Paul."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000458"
    choice: "Giữ nguyên tên 'Degurechaff' và cụm 'hành động theo quyền tự quyết' ('acting on her own discretion') để liên kết trực tiếp với p000462."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000459"
    choice: "Giữ giọng văn bức xúc, khẩn trương của Meybert trước việc lãng phí thời gian."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000460"
    choice: "Bảo toàn nhấn mạnh Markdown '*Vào lúc thế này, cô ấy sẽ nói gì nhỉ?*', dùng đại từ 'cô ấy' cho Degurechaff."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000461"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ hai câu độc thoại nội tâm của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000462"
    choice: "Dịch đồng bộ 'I’m acting on my own discretion' là 'Tôi đang hành động theo quyền tự quyết của mình' và giữ câu chào cắt liên lạc 'Xin phép ngài…'"
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000463"
    choice: "Giữ tên 'Meybert', đại từ 'anh' và ý nghĩa về những lần phải tự mình đưa ra quyết định trong quãng đời binh nghiệp ngắn ngủi."
