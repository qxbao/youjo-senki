  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000417"
    choice: "Dịch 'warning shots' là 'bắn cảnh cáo', 'garrison' là 'đơn vị đồn trú' và 'battle stations' là 'vị trí chiến đấu'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000418"
    choice: "Bảo toàn nhấn mạnh Markdown '*Các người chẳng biết cái quái gì cả sao?!*' cho câu chất vấn ngầm."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000419"
