findings:
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000116"
    severity: "minor"
    issue: "Sắc thái tình thái trong câu hỏi tu từ mỉa mai hơi lệch nhẹ khi dịch cụm động từ chỉ khả năng chịu đựng/chấp nhận thành nghĩa bị động bắt buộc."
    evidence: "Nguồn dùng cấu trúc câu hỏi giả định với động từ khuyết thiếu chỉ khả năng chịu đựng/dung thứ tình cảnh hiện tại (nếu tướng địch không xuất chúng thì làm sao phía Khối Thịnh vượng chung có thể chấp nhận nổi tình cảnh dây dưa này); bản dịch dùng 'lại phải cam chịu' vẫn hiểu được ý mỉa mai nhưng hơi nghiêng sang sắc thái bị ép buộc."
    recommendation: "Có thể giữ nguyên ở mức chấp nhận được hoặc cân nhắc tinh chỉnh thành 'làm sao chúng ta có thể chịu đựng/chấp nhận nổi cái tình cảnh này cơ chứ?' ở bước chuốt văn nếu muốn bám sát hơn sắc thái mỉa mai."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000117"
    severity: "minor"
    issue: "Thuật ngữ chỉ quan hệ giữa giới quân sự và giới chính khách dân sự được dịch rút gọn dễ gợi liên tưởng sang nghĩa quan hệ giữa quân đội và nhân dân."
    evidence: "Thuật ngữ 'military-civil relations' trong ngữ cảnh viên tướng phàn nàn về sự gò bó do giới chính khách ('politicians') áp đặt lên lực lượng vũ trang chỉ mối quan hệ giữa quân đội và chính quyền/giới lãnh đạo dân sự, trong khi 'quan hệ quân – dân' trong tiếng Việt thường chỉ tình cảm giữa quân đội và nhân dân."
    recommendation: "Văn cảnh xung quanh đã làm rõ đối tượng là cánh quan chức dân sự và chính khách nên không gây hiểu sai cốt truyện; có thể cân nhắc 'quan hệ quân sự – dân sự' ở bước chuốt văn."
