  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000150"
    choices:
      - "Chức danh, quân hàm & thành ngữ: giữ 'người đứng đầu Bộ Tổng tham mưu là Trung tướng Rudersdorf', 'các sĩ quan tham mưu' và cách diễn đạt khẩu ngữ 'than trời trách đất rồi miễn cưỡng xắn tay vào việc'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000151"
    choices:
      - "Nhịp trần thuật: giữ 'Tất cả bọn họ đều được triệu tập trong một phòng họp.'"
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000152"
