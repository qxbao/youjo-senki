    choices:
      - "Thuật ngữ & quan hệ nhân quả: giữ 'những kỳ vọng thiếu thực tế đã dẫn đến tình cảnh khốn đốn hiện tại', 'Các ước tính trước chiến tranh' và 'sĩ quan tham mưu'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000139"
