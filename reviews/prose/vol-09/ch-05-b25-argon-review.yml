    issue: "Bản dịch diễn giải 'paradigms' thành 'mô thức nhận thức' (tương tự ở p000911), hơi cụ thể hóa hơn so với phương án gốc 'mô thức' đã ghi nhận tại mục P03-paradigm-shift trong canon/glossary-pending.yml."
