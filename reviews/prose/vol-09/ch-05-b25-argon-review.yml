  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000938"
    severity: "minor"
    category: "lexical_choice"
    issue: "Từ 'evacuation' được dịch là 'việc đào thoát' mang sắc thái vượt ngục hoặc đào ngũ rõ rệt, trong khi nguyên tác dùng danh từ trung tính hơn chỉ việc sơ tán hoặc rút lui an toàn khi Đế quốc thất thế."
    recommendation: "Có thể cân nhắc chỉnh nhẹ ở bước polish thành 'việc sơ tán' hoặc 'việc di tản' để giữ đúng sắc thái bề mặt của từ gốc."
