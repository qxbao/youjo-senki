    Touch: "preserve"
    rationale: "Lời đáp của Calandro giữ đúng xưng hô ('Trung tá', 'Tôi - cô', 'chúng tôi') và thuật ngữ 'quốc gia trung lập'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000787"
    Touch: "preserve"
    rationale: "Trần thuật phân biệt rõ 'quốc gia trung lập' và 'quốc gia tham chiến', giữ đúng giọng văn châm biếm khách quan."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000788"
    Touch: "preserve"
    rationale: "Độc thoại nội tâm của Tanya bảo toàn cả đại từ ngôi thứ nhất ('Mình') lẫn lối tự xưng ngôi thứ ba đặc trưng ('Tanya sẽ hạ cố tỏ ra khó chịu ít nhất là trong chốc lát')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000789"
    Touch: "preserve"
    rationale: "Lời thoại ngắn mang tính thăm dò của Tanya chính xác."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000790"
    Touch: "preserve"
    rationale: "Câu khẳng định ngắn của Calandro gọn và đúng sắc thái."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000791"
    Touch: "preserve"
