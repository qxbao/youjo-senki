    rationale: "Cách dịch 'Sự trung lập nghiêm ngặt' và 'lối nói ngoại giao' chuẩn xác, giữ trọn chất thực dụng của Calandro."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000795"
    Touch: "preserve"
    rationale: "Lời thoại của Tanya ('Thưa Đại tá', 'tôi') giữ đúng cấu trúc giả định lịch sự kiểu ngoại giao và cụm 'quy chế trung lập của Ildoa'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000796"
    Touch: "preserve"
    rationale: "Trần thuật kết hợp lời thoại của Calandro mượt mà, giữ đúng nhịp ngắt câu."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000797"
    Touch: "preserve"
    rationale: "Câu tiếp lời của Tanya khớp mạch hội thoại với p000796 và nhất quán thuật ngữ 'xăng có chỉ số octan cao'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000798"
    Touch: "preserve"
    rationale: "Lời thoại của Calandro chuẩn thuật ngữ 'cuộc không chiến ở mặt trận phía tây' và 'nhiên liệu hàng không'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000799"
    Touch: "preserve"
    rationale: "Câu hỏi của Tanya ('một giọt dầu sánh ngang một giọt máu sao?') giàu nhịp điệu và sát nghĩa."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000800"
    Touch: "preserve"
    rationale: "Độc thoại của Tanya giữ chuẩn địa danh 'Viễn Đông', 'khẩu hiệu thời chiến', 'chiến lược tổng thể' và cấu trúc phản thực quá khứ ('lẽ ra nó dứt khoát phải được... mới phải')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000801"
    Touch: "preserve"
    rationale: "Trần thuật pha độc thoại gián tiếp tự do giữ trọn sự tương phản mỉa mai và câu hỏi tu từ ('Nghe có nực cười không cơ chứ?'); bỏ qua thẻ neo trang hợp lệ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000802"
    Touch: "preserve"
    rationale: "Lời chất vấn lịch sự nhưng sắc bén của Tanya ('Thưa Đại tá, xin thứ lỗi cho tôi nói thẳng...') rất tự nhiên."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000803"
    Touch: "preserve"
    rationale: "Độc thoại nội tâm của Tanya dùng thành ngữ 'thái độ gió chiều nào xoay chiều ấy' ('weathercock attitude') rất đắt và hợp giọng nhân vật."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000804"
    Touch: "preserve"
    rationale: "Độc thoại nội tâm của Tanya dùng đúng đại từ 'mình' và thuật ngữ quân sự 'trinh sát chiến đấu' ('recon-in-force')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000805"
    Touch: "preserve"
    rationale: "Lời thăm dò của Tanya phân biệt rõ 'chúng tôi' (Đế quốc) và 'các ngài' (Ildoa), giữ đúng câu hỏi tu từ ở cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000806"
    Touch: "preserve"
    rationale: "Lời đáp thoái thác khéo léo của Calandro ('đất nước cô', 'chúng tôi', 'Tôi') giữ nguyên sắc thái khiêm nhường ngoại giao."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000807"
    Touch: "preserve"
    rationale: "Nhận xét nội tâm của Tanya về lối trả lời công thức của Calandro chính xác, súc tích."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000808"
    Touch: "preserve"
    rationale: "Độc thoại nội tâm của Tanya ('Mình') truyền tải chuẩn xác quyết định thu lưới để tránh lún sâu vào chính trị."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000809"
    Touch: "preserve"
    rationale: "Cấu trúc phủ định kép ('chẳng phải là nhà ngoại giao mà cũng chẳng phải là chính trị gia') và thuật ngữ 'sĩ quan cấp tá' ('field officer') chuẩn xác."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000810"
    Touch: "preserve"
    rationale: "Đoạn thoại kết hợp trần thuật dài bảo toàn chính xác mọi thuật ngữ canon/pending: 'Huy hiệu Xung kích Cánh Bạc', 'trung tá', 'con chó điên', 'sĩ quan tham mưu', 'Thập Nhị Hiệp Sĩ', 'trường đại học quân sự', 'luận văn tốt nghiệp'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000811"
    Touch: "preserve"
    rationale: "Câu trần thuật ngắn chuyển nhịp trước lời đề nghị đi dạo của Calandro mượt mà."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000812"
    Touch: "preserve"
    rationale: "Chuẩn hóa chính xác cấp bậc xưng hô của Tanya thành 'Trung tá' (khắc phục lỗi in sót chữ của bản tiếng Anh) và giữ giọng mời mọc lịch thiệp của Calandro."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000813"
    Touch: "preserve"
    rationale: "Câu kết batch giữ chuẩn thuật ngữ 'chỉ huy tiền tuyến' ('frontline commander') và mô tả ánh nhìn sắc lạnh của Calandro tự nhiên."
