  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000792"
    Touch: "preserve"
    rationale: "Lời thoại của Calandro diễn đạt rõ phép ẩn dụ con tàu chuẩn bị chìm và sự đối lập giữa giao dịch thương mại với nghĩa vụ đồng minh."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000793"
    Touch: "preserve"
