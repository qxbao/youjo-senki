  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000214"
    choices:
      - "Xưng hô & quân hàm trong thoại: Tanya đáp Lergen '“Không có gì đâu, thưa Đại tá.”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000215"
    choices:
      - "Thoại ngắn: giữ '“Tốt.”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000216"
    choices:
      - "Điểm nhìn chuyển tiếp trần thuật – nội tâm & cấp bậc: giữ 'Tanya', 'vị đại tá cũng trầm mặc không kém', đại từ tự quy chiếu 'mình' theo DEC-P01-001 và cụm 'một sắc thái đơn điệu đến nhức mắt'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000217"
    choices:
      - "Độc thoại nội tâm & câu hỏi tu từ: giữ hình ảnh 'một vệt màu nhạt nhòa thoáng lọt vào tầm mắt', 'nằm ngoài tầm với' và câu cảm thán 'Bao giờ, ôi đến bao giờ các sĩ quan mới được đi nghỉ phép đây?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000218"
    choices:
      - "Độc thoại nội tâm & nhịp câu ngắn: giữ tự quy chiếu 'Mình', 'cải cách luật lao động' và chuỗi câu ngắn 'Rất khao khát là đằng khác. Ngay bây giờ luôn. Cơ mà nghĩ lại thì…'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000219"
    choices:
      - "Tự quy chiếu nội tâm: giữ 'Mình khẽ lắc đầu.' theo DEC-P01-001."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000220"
    choices:
      - "Điểm nhìn nội tâm phân tách bản ngã & thuật ngữ: giữ sự phân biệt giữa tự quy chiếu 'mình' và cái tên khách thể hóa 'Tanya', các cụm 'bộ luật lao động ngoài tầm với kia', 'một công cụ bạo lực có thể xóa sổ mọi rắc rối của mình' và 'lá chắn thịt nhằm bảo đảm an toàn cho Tanya'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000221"
    choices:
      - "Thuật ngữ & phủ định bộ phận: giữ 'Hội đồng Tự trị mà Zettour dựng lên ở miền đông', phủ định kép 'không hẳn đó là một dự án vô bổ' và giới hạn 'chẳng thể trông cậy vào nó cho bất cứ việc gì ngoài phòng ngự chiều sâu'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000222"
    choices:
      - "Độc thoại nội tâm, thuật ngữ & ẩn dụ câu hỏi: giữ tự quy chiếu 'Mình', 'thế bị động thuần túy phải chạy theo đối phó', 'giới chóp bu lục quân và chính phủ đang bất đồng' và câu hỏi ẩn dụ 'Liệu tình thế này có cứu vãn nổi không nếu có sẵn một chiếc tã lót trong tay?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000223"
    choices:
      - "Nhấn mạnh Markdown & trần thuật: bọc chính xác '*Haizzz.*' bằng dấu sao theo DEC-P01-002; giữ 'Tanya nuốt ngược một tiếng thở dài nữa vào lòng.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000224"
    choices:
      - "Câu hỏi tự vấn nội tâm: giữ tự quy chiếu 'Mình' và sự đối lập 'thậm chí còn chưa từng nuôi con bao giờ, thế mà giờ đùng một cái lại phải lãnh phần việc thay tã sao?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000225"
    choices:
      - "Điểm nhìn nội tâm phân tách & thuật ngữ: giữ phân biệt 'Tanya' ('nghĩa vụ và hợp đồng của Tanya') với 'mình' ('Ước gì chí ít mình cũng có thể nộp hóa đơn đòi trả thêm thù lao'), giữ tên riêng 'Zettour'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000226"
    choices:
      - "Phủ định & nhịp ngắt nội tâm: giữ 'Chẳng có chỗ cho lời phàn nàn nào, nhưng… khoan đã.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000227"
    choices:
      - "Cấu trúc tăng tiến & câu hỏi tu từ: giữ 'dịch vụ hộ lý chăm sóc', 'những nhà lãnh đạo ở hạt nhân trung tâm của Đế quốc' và cấu trúc 'không những cần tới tã lót mà thậm chí còn chẳng tự mặc nổi cho mình sao?' (không thêm nhấn mạnh cho thẻ neo trang)."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000228"
    choices:
      - "Cảm thán nội tâm: giữ 'Đúng là một câu hỏi kỳ quặc đến khó tin.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000229"
    choices:
      - "Tiêu đề chuyển cảnh: giữ in hoa 'TỔNG HÀNH DINH BỘ TỔNG THAM MƯU, VĂN PHÒNG CỦA TRUNG TƯỚNG RUDERSDORF'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000230"
    choices:
      - "Thoại độc thoại mở cảnh: giữ '“…Ra là ngay cả chuyện nhảm nhí một khi đi đến mức cực đoan cũng trở thành một cú sốc.”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000231"
    choices:
      - "Điểm nhìn trần thuật & quân hàm: giữ 'Trung tướng Rudersdorf', đại từ 'ông' và chi tiết 'nhăn mặt', 'dốc hết sức mình để cố nặn ra một nụ cười'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000232"
    choices:
      - "Câu hỏi chuyển ý ngắn: giữ 'Kết quả thì sao?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000233"
    choices:
      - "Điểm nhìn trần thuật: giữ đại từ 'ông' và hình ảnh 'Hai khóe miệng đang co giật tội nghiệp của ông đã nói lên tất cả.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000234"
    choices:
      - "Xưng hô & phủ định liệt kê trong thoại độc thoại của Rudersdorf: giữ cặp đại từ 'Các người' – 'Ta', chuỗi phủ định 'muốn thắng cuộc chiến, nhưng lại không muốn chi tiền, và cũng chẳng muốn chịu hy sinh?' và yêu cầu 'nhượng bộ ít nhất một điểm'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000235"
    choices:
      - "Giả định trái thực tế & điểm nhìn trần thuật: giữ giả định 'Giá có một tấm gương trước mặt lúc này, hẳn ông sẽ thấy một bộ mặt sững sờ há hốc đến thảm hại', quy chiếu Rudersdorf bằng 'ông', chi tiết 'người bạn của ông thường chẳng nhịn được phải gọi là trơ trẽn' và so sánh 'hệt như thể bác sĩ vừa thông báo rằng ông mắc một căn bệnh nan y vô phương cứu chữa'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000236"
    choices:
      - "Đối lập trần thuật: giữ đại từ 'ông', sự tương phản 'khác một trời một vực với giọng điệu ngạo mạn mà ông vẫn thể hiện trước mặt thuộc cấp' và câu kết ngắn 'Yếu ớt đến khó tin.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000237"
    choices:
      - "Nhận định trần thuật: giữ tên riêng 'Rudersdorf' và 'nhận thức rất rõ sự trớ trêu ấy'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000238"
    choices:
      - "Thoại ngắn: giữ '“Chúng ta đang có chiến tranh.”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000239"
    choices:
      - "Nhấn mạnh Markdown: bọc chính xác toàn bộ câu ngắn '*Ngay cả vào lúc này.*' bằng dấu sao theo DEC-P01-002."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000240"
    choices:
      - "Nhấn mạnh Markdown & trần thuật: bọc chính xác '*Tại sao?*' bằng dấu sao theo DEC-P01-002; giữ phần dẫn 'ông buộc phải tự chất vấn chính mình.' bên ngoài dấu sao."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000241"
    choices:
      - "Giả định quá khứ & phủ định kép trong thoại: giữ 'Nếu không phải tại lũ ngốc đã chọn không dừng lại khi chúng ta còn cơ hội, thì chuyện này hẳn đã kết thúc từ đời nào rồi.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000242"
    choices:
      - "Khả thể quá khứ & thuật ngữ: giữ đại từ 'Ông', 'Đế quốc' ('The Reich') và khả thể quá khứ 'Đáng lẽ Đế quốc đã có thể bước đi về phía ánh sáng đó.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000243"
    choices:
      - "Thoại cảm thán: giữ đại từ 'chúng ta' và 'Nhưng con đường ấy đã khép lại với chúng ta rồi… Thật là một bi kịch…'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000244"
    choices:
      - "Nhấn mạnh Markdown kép & trần thuật: bọc chính xác hai cụm '*Tại sao chứ?*' và '*Lạy Chúa, tại sao?*' bằng dấu sao theo DEC-P01-002; giữ đại từ 'ông' và tên riêng 'Rudersdorf'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000245"
    choices:
      - "Phủ định trong thoại: giữ '“Hối tiếc và cầu nguyện cũng chẳng thay đổi được điều gì.”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000246"
    choices:
      - "Điểm nhìn trần thuật: giữ đại từ 'Ông' và 'không thể ngăn những lời tự giễu cứ thế tuôn ra khỏi miệng'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000247"
    choices:
      - "Điệp từ nhấn mạnh & trần thuật: giữ cấu trúc gạch ngang điệp 'Tất cả mọi thứ—tất cả mọi thứ—đều đã tuột khỏi tầm tay ông.' (không thêm nhấn mạnh cho thẻ neo trang)."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000248"
    choices:
      - "Khả thể quá khứ & hình ảnh ẩn dụ: giữ 'Khả thể đáng lẽ đã nằm gọn trong tầm với ấy từ lâu đã tan biến mất tăm' và 'cặn bã của một giấc mơ'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000249"
    choices:
      - "Nhấn mạnh Markdown & trần thuật: bọc chính xác '*Không.*' bằng dấu sao theo DEC-P01-002; giữ 'Tới đó, người đàn ông mỉm cười cay đắng.' bên ngoài dấu sao."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000250"
    choices:
      - "Xưng hô & phủ định trong thoại: giữ đại từ 'Ta' ('“Ta không thể chịu khuất phục.”')."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000251"
    choices:
      - "Nhấn mạnh Markdown & độc thoại trực tiếp: bọc chính xác toàn bộ đoạn '*Chuyện này vẫn chưa kết thúc. Vẫn còn quá sớm để bỏ cuộc. Ta vẫn còn ý chí chiến đấu.*' bằng dấu sao theo DEC-P01-002; giữ đại từ 'Ta'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000252"
    choices:
      - "Nhấn mạnh Markdown, điệp từ & câu hỏi tu từ: bọc chính xác '*Chưa đâu, chưa đâu, chưa đâu*' bằng dấu sao theo DEC-P01-002; giữ đại từ 'ông' và câu hỏi tu từ cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000253"
    choices:
      - "Điểm nhìn trần thuật: giữ đại từ 'ông' và 'một phương thức cực kỳ đơn giản'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000254"
    choices:
      - "Ẩn dụ y khoa & điểm nhìn trần thuật: giữ đại từ 'Ông'/'ông', 'ngăn không cho các vấn đề nảy sinh' và 'Những biện pháp khẩn cấp để xử lý ổ nhiễm trùng'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000255"
    choices:
      - "Điểm nhìn trần thuật & thuật ngữ: giữ tên riêng 'Rudersdorf', 'Mục tiêu' ('objective') và 'bảo vệ Đế quốc'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000256"
    choices:
      - "Phân biệt thuật ngữ: dịch 'target' là 'đối tượng nhắm tới' để phân biệt rõ với 'objective' ('Mục tiêu') ở đoạn p000255."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000257"
    choices:
      - "Thuật ngữ & câu hỏi trong thoại: giữ 'đòn tấn công phẫu thuật', đại từ 'Chúng ta' và câu hỏi 'Chúng ta có nên nhắm vào bộ phận đang cần đến nó nhất không?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000258"
    choices:
      - "Phủ định, thuật ngữ & hàm ý: giữ 'chưa từng có tiền lệ thành công nào trong việc xóa sổ đạo quân dã chiến của địch', 'Tung một đòn tấn công phẫu thuật vào vị trí trọng yếu nhất' và 'thực hiện một biện pháp dường như không thể dung thứ'."
