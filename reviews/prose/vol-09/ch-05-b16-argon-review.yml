locked_choices:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000509"
    choice: "Meybert xưng 'Tôi' và gọi Trung tá Paul là 'thưa Trung tá' qua điện thoại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000510"
    choice: "Giữ khẩu khí mệnh lệnh dồn dập của Paul: 'Ngừng bắn ngay lập tức! Dừng lại ngay!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000511"
    choice: "Đại từ trần thuật 'anh' và tự quy chiếu 'mình' cho Meybert; giữ rõ sự đối lập giữa thoáng băn khoăn và tiếng nói của lý trí."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000512"
    choice: "Meybert xưng 'tôi', từ chối lịch sự nhưng dứt khoát."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000513"
    choice: "Trần thuật dùng 'ông ta' cho Paul; trong thoại Paul gọi Meybert là 'Anh' và mắng 'đồ ngu xuẩn kia'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000514"
    choice: "Meybert xưng 'Tôi', gọi 'thưa Trung tá' / 'bên ngài', giữ giọng mỉa mai khi đặt giả thuyết về lời phàn nàn từ quân mình."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000515"
    choice: "Paul xưng 'tôi', gọi 'anh', giữ nguyên câu hỏi chất vấn về việc nổ súng khi chưa có xác nhận."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000516"
    choice: "Meybert xưng 'tôi', gọi Paul là 'ngài', giữ thán từ kéo dài 'Ồồồ' và kết luận phủ định 'vậy là họ đã không gọi cho ngài'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000517"
    choice: "Giữ câu khẳng định ngắn gọn làm rõ quan hệ nhân quả vì sao phải nổ súng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000518"
    choice: "Giữ phép so sánh khẳng định độ hiển nhiên như việc các hành tinh xoay quanh mặt trời."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000519"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ câu độc thoại nội tâm; dùng đại từ tự quy chiếu 'mình', dịch 'HQ' là 'bộ chỉ huy' và 'geocentric or heliocentric' là 'thuyết địa tâm hay thuyết nhật tâm'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000520"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown ở vế đầu '*Tôi chỉ đang làm điều phải làm mà thôi*' (lời Meybert định nói tiếp với Paul), đại từ trần thuật 'anh'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000521"
    choice: "Giữ phủ định 'Đó không phải là tiếng pháo của bên anh' và dịch 'artillery teams' là 'các khẩu đội pháo'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000522"
    choice: "Giữ nhịp suy luận dứt khoát xác định cuộc tấn công của quân địch."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000523"
    choice: "Tiếng hô cảnh báo dùng 'Chúng' (địch) và 'chúng ta' (quân mình)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000524"
    choice: "Dịch 'NCO' là 'người hạ sĩ quan', đại từ 'anh' cho Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000525"
    choice: "Meybert dùng 'chúng ta' và gọi thuộc cấp là 'Các cậu', giữ nhịp khẩu lệnh dồn dập 'Bắn, bắn, bắn điên cuồng vào' và phủ định mệnh lệnh 'Tuyệt đối không được phép thua một lũ tàu bè!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000526"
    choice: "Dịch 'coastal artillery battery' là 'khẩu đội pháo bờ biển' và 'naval vessels' là 'tàu hải quân'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000527"
    choice: "Giữ đúng cấu trúc giả định trái thực tế ở quá khứ ('hẳn họ đã phải đối mặt') khi đối chiếu mặt trận phía đông với cảng gần chính quốc."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000528"
    choice: "Đại từ 'anh' cho Meybert, giữ cấu trúc ba vế miêu tả tác phong chuyên nghiệp của cấp dưới."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000529"
    choice: "Giữ nhận định khen ngợi những người lính chủ động thực thi nhiệm vụ không cần nhắc từng bước."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000530"
    choice: "Meybert xưng 'Tôi', gọi Paul là 'ngài', tuyên bố nắm quyền chỉ huy cuộc giao chiến phòng thủ trước khi cúp máy."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000531"
    choice: "Đại từ 'Anh' cho Meybert, miêu tả đoàn tàu địch tăng tốc và xả màn khói trắng vừa đấu pháo."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000532"
    choice: "Giữ phủ định tuyệt đối 'Không đời nào' và lập luận loại trừ hoàn toàn khả năng nhận diện nhầm do tàu địch xông thẳng tới thay vì né tránh."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000533"
    choice: "Giữ nhịp hai câu ngắn khẳng định dứt khoát đây là quân địch đang xông thẳng vào họ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000534"
    choice: "Dịch 'field telephone' là 'điện thoại dã chiến', giữ tên 'Meybert' và đại từ 'anh'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000535"
    choice: "Meybert xưng tên, gọi 'Trung úy Tospan' và dùng đại từ 'Cậu - tôi'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000536"
    choice: "Tospan đáp lời có kính ngữ 'ạ' ('Tất nhiên rồi ạ') và hỏi nhận định về việc quân địch lộ nguyên hình."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000537"
    choice: "Meybert gọi 'Trung úy Tospan ạ', dùng 'chúng ta' và giữ giọng châm biếm về việc đồng minh quá quen với hòa bình."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000538"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Quá đỗi dễ đoán*' ở đầu câu và thế đối lập giữa khó hình dung thành công với dễ hình dung lý do thất bại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000539"
    choice: "Đại từ 'Anh' cho Meybert, giữ câu ngắn nhấn mạnh việc không cần nhìn qua ống nhòm."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000540"
    choice: "Dịch 'The other garrison troops' là 'Các binh lính đồn trú khác', đại từ 'anh' cho Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000541"
    choice: "Dùng 'Quân ta' ('Quân ta xoay xở chậm chạp quá') khi nhận xét về phản ứng của lực lượng đồn trú tại cảng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000542"
    choice: "Giữ câu đáp ngắn gọn: 'Đành chịu thôi.'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000543"
    choice: "Tospan gọi Meybert là 'Anh' kèm kính ngữ 'ạ', dịch 'dock and submarine pen' là 'khu bến tàu và boong-ke tàu ngầm'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000544"
    choice: "Meybert gọi Tospan là 'cậu', dùng 'chúng ta' và dịch 'HQ' là 'bộ chỉ huy'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000545"
    choice: "Tospan dùng 'chúng ta' và kính ngữ 'ạ' trong câu nói đùa về việc đi dã ngoại quan sát."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000546"
    choice: "Meybert từ chối lời nói đùa, nhắc lại lợi thế không thiếu đạn dược và dùng 'chúng ta'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000547"
    choice: "Dịch 'Federation Army' là 'Lục quân Liên bang', giữ sự tương phản giữa cảnh thoải mái nã pháo hiện tại với nỗi lo thiếu đạn trước kia."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000548"
    choice: "Tospan hỏi xin chỉ thị cho bên bộ binh kèm kính ngữ 'ạ'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000549"
    choice: "Meybert xưng 'tôi', dịch 'HQ' là 'bộ chỉ huy', chỉ thị cho bộ binh chờ lệnh phản ứng nhanh."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000550"
    choice: "Tospan đáp lệnh ngắn gọn: 'Rõ ạ.'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000551"
    choice: "Đại từ 'anh' cho Meybert, dịch 'command post' là 'sở chỉ huy'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000552"
    choice: "Cấp dưới báo động một tàu địch đang lao thẳng về phía 'chúng ta'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000553"
    choice: "Khẩu lệnh dứt khoát: 'Nã pháo chặn đánh!' cho động từ 'interdict'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000554"
    choice: "Đại từ 'anh' cho Meybert, giữ bước ngoặt linh cảm bất thường ngay sau khi phát lệnh."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000555"
    choice: "Dịch 'transport ship or an armed merchant cruiser' là 'tàu vận tải hay tàu tuần dương buôn vũ trang', 'coastal artillery' là 'pháo bờ biển' và giữ câu bỏ lửng ở cuối."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000556"
    choice: "Giữ đúng hai khả năng suy luận khẩn cấp của Meybert: con tàu đó hoặc định tự nổ tung, hoặc chở đầy quân."
