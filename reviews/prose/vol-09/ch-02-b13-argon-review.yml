findings:
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000507"
    severity: "minor"
    category: "diction"
    issue: "Từ Hán-Việt 'độc canh' trong 'sản xuất độc canh triền miên' thường chỉ việc trồng duy nhất một loại cây nông nghiệp trên một vùng đất (monoculture), trong khi thuật ngữ nguồn chỉ việc sản xuất công nghiệp/kinh tế độc nhất một loại sản phẩm đơn điệu (đối lập với sự dồi dào, đa dạng hàng hóa của chủ nghĩa tư bản ở câu sau)."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước chuốt văn thành 'lối sản xuất độc một mặt hàng triền miên' hoặc 'lối sản xuất đơn phẩm triền miên'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000520"
    severity: "minor"
    category: "diction"
    issue: "Cụm 'điều bình thường mới' mang sắc thái khẩu ngữ hiện đại (dịch can từ 'new normal'), trong khi danh từ ở nguồn chỉ đơn thuần nghĩa là chuẩn mực chung / chuyện thường tình."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước chuốt văn thành 'Chẳng qua là đồ ăn dở tệ đã trở thành chuyện thường tình mà thôi.' hoặc '...đã trở thành mặt bằng chung mà thôi.'."
