findings:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000890"
    severity: "minor"
    category: "explicitation"
    issue: "Cụm 'để dùng làm đạn dược ngoại giao' thêm từ 'ngoại giao' giải thích sớm ẩn dụ, trong khi bản gốc ở đoạn này chỉ viết ngắn gọn là 'ammo' và phải sang p000891 mới mở rộng thành 'ammo for social situations'."
    recommendation: "Có thể giữ nguyên hoặc rút gọn nhẹ ở bước polish thành 'để dùng làm đạn dược'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000891"
    severity: "minor"
    category: "pronoun_consistency"
    issue: "Ở câu cuối khi điểm nhìn tách đôi giữa 'I' ('mình') và ngôi thứ ba chỉ Tanya ('her'), bản dịch dùng 'cô bé' thay vì đại từ ngôi thứ ba chuẩn 'cô' đang dùng thống nhất cho Tanya trong Vol. 09 khi nguyên tác chỉ dùng đại từ nhân xưng."
    recommendation: "Nên chỉnh nhẹ ở bước polish thành 'mà mình có thể thu về tay cô' hoặc 'mà mình có thể giúp cô chạm tay tới' để đồng nhất với đại từ 'cô' ở p000877, p000890."
