      - "Điểm nhìn trần thuật & nhượng bộ nội tâm: giữ đại từ 'Anh' chỉ Lergen, 'họ' chỉ Bộ Tổng tham mưu, dấu chấm lửng trước 'kỳ vọng' và mệnh đề nhượng bộ 'cho dù họ có cố ngụy biện rằng đó chỉ là một cuộc diễn tập đi chăng nữa, thì sức thuyết phục của cái cớ ấy cũng có giới hạn thôi'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000112"
    choices:
      - "Xưng hô, thuật ngữ & phủ định tuyệt đối: giữ 'thưa Đại tá', 'Ngài', 'chúng tôi' (đơn vị của Tanya), 'Tanya' ở phần dẫn; giữ 'quân địch giả định', 'cuộc đảo chính quân sự', 'cuộc đảo chính thật sự', 'Bộ Tư lệnh Tối cao' và phủ định tuyệt đối 'tuyệt đối không đời nào có thể nhắm mục tiêu vào Bộ Tư lệnh Tối cao được…' (không thêm nhấn mạnh cho thẻ neo trang)."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000113"
    choices:
      - "Giả định tương đồng trong thoại: giữ 'thủ đô của Khối Thịnh vượng chung', đại từ 'chúng ta' và lý giải 'để cả bên tấn công lẫn bên phòng thủ đều phải làm thật nghiêm túc'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000114"
    choices:
      - "Câu hỏi xác nhận trong thoại: giữ đại từ 'chúng ta', cụm 'gây ra một sự hiểu lầm' và kính ngữ 'sao ạ?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000115"
    choices:
      - "Xưng hô, thuật ngữ & kịch bản ngụy tạo: Lergen dùng 'Chúng tôi'/'chúng tôi' chỉ Bộ Tổng tham mưu; giữ 'Bộ Tổng tham mưu', 'lưới phòng không của thủ đô còn lâu mới kín kẽ', 'cuộc diễn tập' và lý do hợp thức hóa 'do sai sót trong khâu truyền đạt thông tin nên còi báo động mới rú lên'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000116"
    choices:
      - "Ẩn dụ nội tâm & câu hỏi hoài nghi: giữ 'câu chuyện bình phong khá hợp lý', đại từ 'họ', cụm ẩn dụ mỉa mai 'màn hài kịch xen giữa của chúng ta' và câu hỏi 'Nhưng liệu Bộ Tư lệnh Tối cao có thực sự mắc lừa không đây?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000117"
    choices:
      - "Nhận định nội tâm ngắn: giữ 'Chuyện này nghe cứ như một trò điên rồ vậy.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000118"
    choices:
      - "Câu hỏi tu từ & hệ quả pháp lý quân sự: giữ 'đơn vị đảo chính', đại từ 'chúng ta' và hệ quả 'Chỉ cần sẩy chân một bước thôi là chúng ta sẽ phải ra tòa án quân sự với tội danh phản quốc ngay'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000119"
    choices:
      - "Điểm nhìn trần thuật & phủ định nhượng bộ: giữ tên riêng 'Tanya', phủ định 'không thể gật đầu đồng ý với chuyện này' và mệnh đề nhượng bộ 'kể cả là để tỏ ra lịch sự xã giao đi chăng nữa'."
