  - segment_id: YS-LN09/Text/chapter004.xhtml/p000391
    choice: "Trần thuật ngôi thứ ba: giữ tên 'Tanya' và đại từ 'cô'; 'the capital' -> 'thủ đô'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000392
    choice: "Thoại Tanya: giữ nét lắp bắp đầu câu ('C-có phải'), phủ định toàn phần và kính ngữ 'ạ'; khóa 'Supreme Command' -> 'Bộ Tư lệnh Tối cao', 'strategic objectives' -> 'mục tiêu chiến lược'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000393
    choice: "Thoại Rudersdorf: câu khẳng định ngắn gọn 'Đúng là như vậy.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000394
    choice: "Độc thoại nội tâm: 'their' -> 'của họ' (chỉ Bộ Tư lệnh Tối cao); giữ câu hỏi tu từ mỉa mai."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000395
    choice: "Độc thoại nội tâm: khóa 'raison d’état' -> 'Lý tính nhà nước' (không in nghiêng theo đúng nguồn)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000396
    choice: "Trần thuật: giữ tên 'Tanya' và đại từ 'cô'; khóa 'Federation Army' -> 'Quân đội Liên bang' và cấu trúc giả định nhượng bộ ('dù ... có ... đi chăng nữa, thì cũng chẳng thể...')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000397
    choice: "Nội tâm: đại từ 'our' -> 'của chúng ta'; giữ phủ định 'không sao tưởng tượng nổi' và 'Chẳng còn cách nào khác'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000398
    choice: "Nội tâm: giữ cấu trúc so sánh đính chính tăng cấp ('Cứ như thể ... Không, phải giống như ... thì đúng hơn') và phân biệt 'tổ bay' với 'chính cái buồng lái'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000399
    choice: "Thoại Tanya với Rudersdorf: gọi 'Thưa Tướng quân', xưng 'Tôi'; 'the capital' -> 'thủ đô'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000400
    choice: "Thoại Rudersdorf với Tanya: gọi 'cô' và 'Trung tá' (Colonel); khóa ẩn dụ 'dư luận ở thủ đô đã hóa thành một con quái vật rồi'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000401
    choice: "Trần thuật: 'His' -> 'của ông', giữ tên 'Tanya'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000402
    choice: "Độc thoại nội tâm Tanya: tự xưng 'mình' (I) theo DEC-P01-001, gọi chính trị gia trong giai thoại là 'ông ta'; giữ sắc thái cảm thán giả định."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000403
    choice: "Độc thoại nội tâm: 'I' -> 'mình', 'we' -> 'chúng ta'; khóa 'the Empire' -> 'Đế quốc', 'Imperial Army' -> 'Lục quân Đế quốc', 'work ethic' -> 'đạo đức nghề nghiệp'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000404
    choice: "Độc thoại nội tâm: 'we' / 'our' -> 'chúng ta'; giữ chuỗi liệt kê dồn dập về lương thực, tiền lương, thiếu tiếp tế và lạm phát."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000405
    choice: "Độc thoại nội tâm: 'my' -> 'của mình'; khóa 'social contract' -> 'khế ước xã hội'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000406
    choice: "Độc thoại nội tâm: giữ sắc thái quyết liệt 'đáng bị thanh trừng. Ngay lập tức và không chút nương tay.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000407
    choice: "Thoại Tanya: xưng 'tôi', thêm kính ngữ 'ạ'; giữ cụm 'một tai nạn nổ tung'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000408
    choice: "Thoại Rudersdorf: giữ giọng hưởng ứng chua chát 'Kẹt một nỗi là nghe cũng khá cám dỗ đấy.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000409
    choice: "Trần thuật: 'the general' -> 'vị tướng', 'he' -> 'ông'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000410
    choice: "Nội tâm Tanya hướng về Rudersdorf: 'you' -> 'ông', 'we' -> 'chúng ta'; khóa ẩn dụ 'điểm sôi' (boiling point)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000411
    choice: "Thoại Rudersdorf: xưng 'Ta', 'the Empire' -> 'Đế quốc' (quy chiếu bằng 'nó' trong ẩn dụ y khoa); giữ ẩn dụ 'căn bệnh nan y', 'bác sĩ' và 'con bệnh'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000412
    choice: "Thoại Tanya: giữ câu hỏi nối tiếp ẩn dụ y khoa ('điều dưỡng cho nó bình phục') và kính ngữ 'ạ'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000413
    choice: "Thoại Rudersdorf: giữ câu giả định bỏ lửng; khóa 'the Federation' -> 'Liên bang', 'land war' -> 'cuộc chiến tranh trên bộ'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000414
    choice: "Nội tâm: 'he' -> 'ông', 'we' -> 'chúng ta'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000415
    choice: "Nội tâm: 'the Empire' -> 'Đế quốc', 'the east' -> 'miền đông', 'the Federation' -> 'Liên bang', 'us' -> 'chúng ta'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000416
    choice: "Câu hỏi tu từ nội tâm: 'we' -> 'chúng ta'; giữ sắc thái mỉa mai về việc mơ tưởng điều kiện lý tưởng."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000417
    choice: "Nội tâm: giữ câu ngắn 'Có một vấn đề lớn ở đây.'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000418
    choice: "Thoại Tanya: gọi Rudersdorf là 'Ngài', thêm 'ạ'; khóa nhấn mạnh Markdown '*Kranke*' khớp với thẻ em trong nguồn."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000419
    choice: "Thoại Rudersdorf: xưng 'Ta' ('Ta không biết.')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000420
    choice: "Thoại Tanya: câu hỏi ngắn biểu thị sự sững sờ lễ phép 'Sao cơ ạ?'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000421
    choice: "Trần thuật/nội tâm: giữ tên 'Tanya', đại từ 'cô'; 'The general' -> 'Vị tướng'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000422
    choice: "Nội tâm: giữ tên 'Rudersdorf'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000423
    choice: "Độc thoại nội tâm: 'me' / 'I' -> 'mình', 'him' -> 'ông'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000424
    choice: "Thoại Rudersdorf: xưng 'Ta' / 'ta'; giữ chuẩn xác thế lưỡng khả phủ định kép ('không thể dám chắc là bất khả thi, nhưng cũng chẳng có gì bảo đảm là chuyện đó khả thi cả')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000425
    choice: "Thoại bỏ lửng của Tanya: gọi 'Thưa Tướng quân'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000426
    choice: "Thoại Rudersdorf: 'We' -> 'Chúng ta', gọi Tanya là 'Cô' và 'Trung tá' (Colonel)."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000427
    choice: "Độc thoại nội tâm: 'I' / 'my' -> 'Mình' / 'mình', 'him' -> 'ông', giữ tên 'Rudersdorf'; khóa 'psychological evaluation' -> 'giám định tâm lý'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000428
    choice: "Nội tâm: 'He' -> 'Ông' ('Ông đang tuyệt vọng.')."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000429
    choice: "Độc thoại nội tâm: 'I' -> 'mình', 'he' -> 'ông'; giữ phủ định 'thật khó mà không cảm thấy u ám'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000430
    choice: "Thoại Tanya: gọi 'Thưa Tướng quân', xưng 'tôi', 'your' -> 'của riêng ngài'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000431
    choice: "Trần thuật và thoại Rudersdorf: 'The lieutenant general' -> 'Vị trung tướng', 'Our' / 'we' -> 'của chúng ta' / 'chúng ta', 'the east' -> 'miền đông', 'the west' -> 'phía tây'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000432
    choice: "Nội tâm: 'He' -> 'Ông', 'the Empire' -> 'Đế quốc', 'my superior' -> 'cấp trên của mình', 'us' -> 'chúng ta'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000433
    choice: "Thoại Rudersdorf: xưng 'ta' / 'Ta', tự quy chiếu 'mình'; khóa 'purging' -> 'thanh lọc' và nhấn mạnh Markdown '*Kranke*' khớp với thẻ em trong nguồn."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000434
    choice: "Nội tâm: khóa nhấn mạnh Markdown '*Thanh lọc*' khớp với thẻ em ('Purge') trong nguồn và đồng nhất từ vựng với p000433; 'he' -> 'Ông'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000435
    choice: "Nội tâm: giữ cách diễn đạt thành ngữ tự nhiên 'chọc vào ổ kiến lửa'."
  - segment_id: YS-LN09/Text/chapter004.xhtml/p000436
    choice: "Trần thuật và chiêm nghiệm kết đoạn: 'the general' -> 'vị tướng', giữ tên 'Tanya'."
