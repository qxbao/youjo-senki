locked_choices:
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000066"
    locked: "Tanya xưng 'tôi ... ạ', gọi 'Tướng Rudersdorf' là 'ngài ấy'; khóa thuật ngữ 'cuốn sách tranh' và 'tiền bản quyền'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000067"
    locked: "Câu hỏi ngắn đầy ngạc nhiên của Lergen: '…Một cuốn sách tranh ư? Vị tướng đó á?'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000068"
    locked: "Trần thuật gọi Lergen là 'anh', gọi 'Tanya' ở ngôi thứ ba; giữ hình ảnh so sánh 'Vị tướng nghiêm nghị, sừng sững như tảng đá ấy' và câu cảm thán hoài nghi ở cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000069"
    locked: "Chuyển đại từ khái quát thành 'người ta' / 'con người ta'; giữ nhận xét về những sở thích đáng kinh ngạc."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000070"
    locked: "Tanya xưng 'tôi', gọi 'Tướng von Rudersdorf' là 'Ngài ấy'; giữ câu hỏi đuôi lịch sự 'Chẳng phải đó là một dự án rất thú vị sao ạ?'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000071"
    locked: "Lergen xưng 'Tôi', gọi Tanya là 'cô'; giữ lời hẹn vui vẻ khao một tách cà phê."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000072"
    locked: "Tanya xưng 'Tôi ... ạ'; giữ cụm 'đi chào hỏi một vòng' (making the rounds) thống nhất với lô ch-06-b01."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000073"
    locked: "Lergen gọi Tanya là 'Trung tá' và 'cô'; khóa thuật ngữ 'tấm phiếu khẩu phần hạng A' và 'Bộ Tổng tham mưu'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000074"
    locked: "Câu hỏi xác nhận lịch sự của Tanya: 'Như vậy có ổn không ạ?'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000075"
    locked: "Phân biệt rõ 'mình' trong trần thuật nội tâm của Tanya theo DEC-P01-001 và 'Tôi' trong lời thoại của Lergen."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000076"
    locked: "Tanya đáp lễ 'Vâng, thưa Đại tá' và xin phép cáo từ ('tôi ... ạ')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000077"
    locked: "Trần thuật ngôi thứ ba chuyển sang điểm nhìn của 'Lergen' sau khi nhìn theo bóng 'cô' rời đi."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000078"
    locked: "Lergen lẩmbẩm lặp lại thuật ngữ '…Tiền bản quyền ư?'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000079"
    locked: "Điểm nhìn nội tâm gián tiếp của Lergen gọi Tanya là 'cô bé ấy'; giữ sắc thái cảm thông bi kịch 'Thật bi thảm làm sao.'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000080"
    locked: "Lời chúc thầm của Lergen dành cho Tanya: gọi 'Trung tá', xưng 'tôi - cô'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000081"
    locked: "Giữ trọn ba hình ảnh song hành: 'viên đạn bạc', 'thanh gươm Damocles' và 'kế hoạch dự phòng'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000082"
    locked: "Giữ đối lập thời gian giữa người biết tình hình trước chiến tranh và cảm giác vài năm trước như ở một chiều không gian khác."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000083"
    locked: "Giữ câu hỏi tu từ kép 'Làm thế nào và tại sao mọi chuyện lại đi đến nông nỗi này?'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000084"
    locked: "Thuật ngữ 'lý thuyết về chiến tranh tổng lực'; giữ đối lập giữa quá khứ né tránh như điều cấm kỵ của Lergen và thực tại hôm nay."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000085"
    locked: "Giữ câu phủ định đính chính nâng cấp mức độ: 'Không, thực chất điều đó là không thể tha thứ được.'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000086"
    locked: "Trần thuật gọi Lergen là 'Anh'; khóa thuật ngữ 'người lính' và 'sĩ quan tham mưu'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000087"
    locked: "Thuật ngữ 'cuộc chiến tranh tổng lực', 'Tổ quốc', 'Đế quốc', 'giới quý tộc'; giữ cấu trúc câu giả định bỏ lửng ở cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000088"
    locked: "Bảo toàn toàn bộ đoạn độc thoại nội tâm của Lergen trong dấu nhấn mạnh Markdown '*...*' theo DEC-P01-002; đại từ tự quy chiếu 'Mình - mình' và điệp câu 'Đây là hiện thực. Đây là hiện thực.'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000089"
    locked: "Bảo toàn câu chửi thầm trong dấu nhấn mạnh Markdown '*Chết tiệt thật.*' theo DEC-P01-002."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000090"
    locked: "Chuyển cảnh sang trần thuật ngôi thứ ba theo chân 'Tanya' ('Cô'); thuật ngữ 'Trung tướng Rudersdorf' ('ông') và cụm 'đi chào hỏi một vòng'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000091"
    locked: "Giữ sự chuyển đổi tự nhiên giữa đại từ nội tâm 'mình' ở câu đầu và tên gọi 'Tanya' ở câu sau đúng theo bản gốc; thuật ngữ 'Trung tướng Zettour'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000092"
    locked: "Câu báo cáo trình diện của Tanya: 'Trung tá Degurechaff xin trình diện, thưa Tướng quân!'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000093"
    locked: "Rudersdorf cho phép vào phòng và gọi Tanya là 'Trung tá'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000094"
    locked: "Trần thuật gọi 'Rudersdorf' là 'ông', gọi Tanya là 'cô'; giữ nét miêu tả gương mặt khá mệt mỏi và tính cách ghét sự rườm rà."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000095"
    locked: "Rudersdorf xưng 'Ta - cô' và 'chúng ta'; khóa các thuật ngữ 'tàu tuần dương', 'tàu sân bay', 'tàu khu trục', 'hải quân'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000096"
    locked: "Tanya xưng 'tôi - chúng tôi', gọi Rudersdorf là 'ngài'; khóa thuật ngữ 'bộ chỉ huy tàu ngầm', 'hải quân' và giữ câu điều kiện phủ định nhấn mạnh."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000097"
    locked: "Câu nhắc khéo của Rudersdorf; khóa thuật ngữ 'Xưởng Kỹ thuật' (Technical Arsenal)."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000098"
    locked: "Giữ nhịp ngập ngừng bằng dấu chấm lửng trong câu đáp miễn cưỡng của Tanya: '…Vâng, ngài nói phải ạ. Tôi cũng… biết ơn… họ nữa ạ.'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000099"
    locked: "Nội tâm Tanya tự quy chiếu 'mình' theo DEC-P01-001; giữ cách gọi 'gã tiến sĩ điên' (Schugel) và 'tên lửa V-2'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000100"
    locked: "Rudersdorf nhắc đến 'Kỹ sư trưởng Schugel' và khen ngợi vũ khí mới."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000101"
    locked: "Phân biệt rõ 'mình' trong câu dẫn nội tâm của Tanya và 'tôi - chúng ta', 'thưa ngài' trong lời thoại khuyên can không nên đánh giá quá cao 'V-2'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000102"
    locked: "Rudersdorf yêu cầu giải thích, gọi Tanya là 'Cô'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000103"
    locked: "Trần thuật ngôi thứ ba 'Tanya'; lời thoại mở đầu phần giải thích có kính ngữ 'ạ'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000104"
    locked: "Rudersdorf hỏi lại để xác nhận ý của Tanya ('cô') về khả năng 'các pháp sư tấn công từ dưới mặt nước'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000105"
    locked: "Tanya đáp 'Vâng, thưa Tướng quân', xưng 'Tôi - chúng ta'; khóa thuật ngữ 'Yếu tố bất ngờ' và 'tín hiệu ma đạo' (mana signals)."
