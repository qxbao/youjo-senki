    choices:
      - "Khóa phép ví von về sự ngon lành được ban cho hình hài cụ thể."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000112
    choices:
      - "Khóa đại từ nội tâm 'Mình' ở câu đầu, thuật ngữ 'Hậu phương' (The rear) và tự quy chiếu ngôi thứ ba 'Tanya' ở câu cuối."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000113
    choices:
      - "Khóa câu độc thoại thành tiếng của Tanya với đại từ tự quy chiếu 'mình': '“Đó là lý do chuyện này thật đau đớn… Sao mình lại có thể…?”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000114
    choices:
      - "Khóa đại từ nội tâm 'Mình' / 'mình' và chi tiết tự nhận đang 'ghen tị' – một 'cảm xúc phi lý'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000115
    choices:
      - "Khóa câu tự vấn thành tiếng: '“Giờ thì ngay cả đồ ăn ngon cũng thành vấn đề sao?”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000116
    choices:
      - "Khóa sự đối lập 'giữa chúng ta và họ ngay trước mặt mình' và nhận định 'Hương vị rất trung thực. Chúng chẳng thể dễ dàng làm giả được.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000117
    choices:
      - "Khóa cặp khái niệm trong ngoặc kép '“Mức tối thiểu cần thiết cho các bữa ăn”' và '“mức tối thiểu cần thiết cho các bữa ăn văn minh”', thành ngữ 'con người không thể sống chỉ nhờ bánh mì' và định danh 'Being X'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000118
    choices:
      - "Khóa nhận định triết lý về những điều kiện cơ bản tối thiểu của thực tại không thể thiếu để có được sự tự do về tinh thần."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000119
    choices:
      - "Khóa câu lẩm bẩm một mình của Tanya với đại từ 'mình': '“Chắc là mình mệt rồi.”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000120
    choices:
      - "Khóa cách gọi 'Thưa Trung tá?' (Colonel?) và sắc thái lễ phép 'ạ' của sĩ quan phụ tá Serebryakov."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000121
    choices:
      - "Khóa điểm nhìn trần thuật ngôi thứ ba với 'Tanya', đại từ 'cô' và chức danh 'vị sĩ quan phụ tá' (her adjutant)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000122
    choices:
      - "Khóa cách gọi 'Trung úy Serebryakov' (Lieutenant Serebryakov) và câu đáp trấn an của Tanya."
