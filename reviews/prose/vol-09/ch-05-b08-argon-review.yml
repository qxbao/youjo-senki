locked_choices:
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000163
    choices:
      - "Khóa nhấn mạnh Markdown '*Họ có là ủi chúng không thế?!*' theo DEC-P01-002 và nhịp câu cảm thán dồn dập mô tả quân phục phẳng phiu, ủng sáng bóng không vương một hạt bùn."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000164
    choices:
      - "Khóa sự đối lập giữa 'Đội tiêu binh danh dự trong lễ tang' (honor guard at a funeral) với 'đơn vị đồn trú tại cảng' (port garrison) dưới góc nhìn của những người lính từng chiến đấu ở miền đông."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000165
    choices:
      - "Khóa đại từ phiếm chỉ 'Bạn' trong câu nhận định khái quát về việc không thể đánh trận trong bộ quân phục sạch sẽ."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000166
    choices:
      - "Khóa cấp bậc và tên gọi 'Trung tướng Zettour', cụm 'mặt trận phía đông' và hình ảnh bộ 'quân phục dã chiến' sờn cũ đẫm bùn đất và mồ hôi."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000167
    choices:
      - "Khóa các thuật ngữ 'sĩ quan cấp trung', 'mặt trận phía đông', 'vùng lãnh thổ chiếm đóng ở hậu phương', 'đơn vị đồn trú tại cảng' và nhấn mạnh Markdown '*Họ đang nghênh ngang đi lại trong những bộ quân phục hồ cứng ư?*' theo DEC-P01-002."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000168
    choices:
      - "Khóa câu trần thuật ngắn: 'Cảm giác ấy tách biệt khỏi thế giới thực tại đến mức kinh khủng.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000169
    choices:
      - "Khóa các thuật ngữ 'bộ chỉ huy cảng', 'cơ sở phòng thủ cảng', 'Kampfgruppe Lergen' và chi tiết phải vật lộn với khoảng cách văn hóa khó tin."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000170
    choices:
      - "Khóa chức danh 'phó chỉ huy' đi kèm tên riêng 'Tospan', tên riêng 'Meybert', đại từ trần thuật 'anh' và dấu ba chấm cuối câu."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000171
    choices:
      - "Khóa câu trần thuật: 'Ngày hôm nay cũng chẳng có gì khác.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000172
    choices:
      - "Khóa đại từ thoại 'tôi' và đại từ trần thuật 'anh' của Tospan khi nhìn xuống bộ quân phục được là ủi phẳng phiu và mặc đúng chuẩn quy định."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000173
    choices:
      - "Khóa điểm nhìn đánh giá của Tospan ('theo anh thấy') phân biệt việc giữ quân phục hợp vệ sinh với sự phí công vô ích."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000174
    choices:
      - "Khóa cách xưng hô 'Thưa Đại úy' – 'chúng ta' và tiểu từ lễ phép 'ạ' khi Trung úy Tospan phàn nàn với cấp trên là Đại úy Meybert."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000175
    choices:
      - "Khóa câu đáp ngắn gọn của Meybert và cách gọi 'Trung úy Tospan' (Lieutenant Tospan)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000176
    choices:
      - "Khóa cụm 'vị đại úy pháo binh' (artillery captain) và nhấn mạnh Markdown '*với tất cả sự kính trọng*' theo DEC-P01-002."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000177
    choices:
      - "Khóa cách xưng hô 'thưa Đại úy Meybert' – 'tôi' kèm tiểu từ 'ạ' giữ đúng lễ tiết cấp dưới nói với cấp trên."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000178
    choices:
      - "Khóa cặp đại từ thoại 'cậu' – 'tôi' / 'mình' của Đại úy Meybert với Trung úy Tospan và đại từ trần thuật 'Anh'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000179
    choices:
      - "Khóa đại từ 'anh' (chỉ Meybert), 'chúng ta' và cách dịch 'bẻ mềm mũ thành kiểu mũ crusher' cho thuật ngữ 'make them crushers'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000180
    choices:
      - "Khóa câu hỏi ngắn thể hiện sự ngạc nhiên của Meybert: '“Hả?”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000181
    choices:
      - "Khóa câu trần thuật mô tả Tospan chỉ vào chiếc mũ đội theo kiểu thịnh hành trên đầu Meybert."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000182
    choices:
      - "Khóa giải thích về mẹo giảm thời gian bảo quản và trọng lượng mũ ngoài tiền tuyến vốn trái với quy định nếu xét nghiêm ngặt."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000183
    choices:
      - "Khóa tiểu từ lễ phép 'ạ' và đại từ 'chúng ta' trong lời nhắc của Tospan về thông báo cấm làm biến dạng mũ."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000184
    choices:
      - "Khóa đại từ thoại 'Tôi' – 'chúng ta', cụm 'mặt trận phía đông', đại từ trần thuật 'Anh' – 'mình' và chi tiết Meybert đinh ninh mình nguyên tắc nhưng đã vô tình đi chệch quy chuẩn."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000185
    choices:
      - "Khóa cấp bậc 'Trung tá Degurechaff' (Colonel Degurechaff), đại từ 'cô ấy' chỉ Tanya và dấu nháy đơn quanh cụm '‘diễn giải lại’'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000186
    choices:
      - "Khóa cụm 'vị đại úy' (Meybert), 'vị sĩ quan cấp trên cực kỳ thực dụng' và đại từ 'cô' chỉ Tanya trong lời trần thuật."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000187
    choices:
      - "Khóa đại từ thoại 'Tôi' – 'chúng ta' của Meybert và đại từ 'cô ấy' ở câu bỏ lửng khi nhận xét về Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000188
    choices:
      - "Khóa từ đáp lễ phép 'Vâng' của Tospan và dấu ba chấm trước cụm 'nét kỳ quặc'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000189
    choices:
      - "Khóa nhấn mạnh Markdown '*Đúng nhỉ? Thật đấy*' theo DEC-P01-002 trong phần miêu tả hai người thoải mái trò chuyện khi cấp trên vắng mặt."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000190
    choices:
      - "Khóa đại từ 'cô ấy' và hai câu hỏi phỏng đoán về lòng yêu nước thái quá của Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000191
    choices:
      - "Khóa câu nhận xét ngắn gọn: '“Cô ấy chẳng hề do dự lấy một chút nào.”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000192
    choices:
      - "Khóa cách gọi 'Trung úy' (Lieutenant), cụm '‘nghĩa vụ với quốc gia’' và đại từ 'cô ấy' chỉ Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000193
    choices:
      - "Khóa toàn bộ phần độc thoại nội tâm của Meybert bọc trong '*...*' theo DEC-P01-002, đại từ 'Cô ấy' chỉ Tanya và đại từ tự quy chiếu nội tâm 'mình' của Meybert."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000194
    choices:
      - "Khóa đại từ thoại 'tôi' và tên kèm quân hàm 'Đại úy Ahrens' (Captain Ahrens)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000195
    choices:
      - "Khóa lời đồng tình lễ phép 'Thật đấy ạ', đại từ 'Tôi' của Tospan và thuật ngữ 'lính xe tăng' (the tankers)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000196
    choices:
      - "Khóa các thuật ngữ 'thủ đô', 'thao trường diễn tập' (maneuvering range) và đại từ 'Họ' / 'họ' chỉ cánh lính xe tăng."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000197
    choices:
      - "Khóa các thuật ngữ binh chủng 'pháo thủ', 'bộ binh', 'lính xe tăng', 'pháo binh', 'pháp sư trên không', 'các đơn vị xe tăng' cùng tên đơn vị 'Kampfgruppe'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000198
    choices:
      - "Khóa nhấn mạnh Markdown '*Thật đáng kinh ngạc là chúng ta từng tự do đến nhường nào dưới quyền Trung tá Degurechaff.*' theo DEC-P01-002 và cấp bậc 'Trung tá Degurechaff'."
