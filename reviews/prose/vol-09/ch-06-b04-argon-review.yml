locked_choices:
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000106"
    choices:
      - "Trần thuật gọi Rudersdorf; 'mana signals in the water' khóa là 'tín hiệu ma lực dưới nước'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000107"
    choices:
      - "Tanya xưng 'tôi', gọi Trung tướng Rudersdorf là 'thưa Tướng quân' ('sir'); khóa 'pháp sư hải quân đánh bộ' ('marine mages'), 'tàu sân bay' ('carriers') và 'tàu chủ lực' ('capital ships')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000108"
    choices:
      - "Khóa 'Mẫu V-2', 'ngư lôi dẫn đường' ('guided torpedo'), 'ngư lôi của Đế quốc' ('imperial torpedo'), 'đạn pháo hay thuật thức' ('shell or formula') và đơn vị tốc độ 'hải lý mỗi giờ' ('knots')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000109"
    choices:
      - "Khóa 'thiết giáp hạm' ('battleships'), 'tàu sân bay' ('carriers') và đại từ 'chúng ta' ('we') trong nhận định chiến thuật."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000110"
    choices:
      - "Khóa 'các đợt tấn công thông thường' ('regular attacks')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000111"
    choices:
      - "Tanya xưng 'tôi', giữ sắc thái lễ độ với cấp trên ('ạ'); khóa 'mẫu V-1' và 'mẫu V-2'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000112"
    choices:
      - "Khóa 'ngư lôi dẫn đường' ('guided torpedo')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000113"
    choices:
      - "Trần thuật ngôi thứ ba gọi 'Tanya' và 'ông' (Rudersdorf); khóa 'bộ não của lục quân' ('the brains of the army') và 'tên lửa và ngư lôi dẫn đường' ('guided missiles and torpedoes')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000114"
    choices:
      - "Khóa 'phương thức dẫn đường' ('guidance method')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000115"
    choices:
      - "Tanya xưng 'tôi', gọi Rudersdorf là 'ngài'; khóa 'Tiểu đoàn 203' ('the 203rd') và 'tiểu đoàn của tôi' ('my battalion')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000116"
    choices:
      - "Rudersdorf gọi Tanya là 'cô'; khóa 'cựu binh' ('veterans')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000117"
    choices:
      - "Nội tâm/hành động ngôi thứ nhất của Tanya dùng 'mình' theo DEC-P01-001; thoại phủ định mở đầu giữ rõ ràng, khóa 'các đơn vị pháp sư' ('mage units') và 'tác chiến trên biển' ('maritime operations')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000118"
    choices:
      - "Rudersdorf gọi Tanya là 'cô' trong câu hỏi."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000119"
    choices:
      - "Tanya xưng 'tôi', gọi Rudersdorf là 'ngài'; khóa 'pháp sư trên không' ('aerial mage')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000120"
    choices:
      - "Trần thuật ngôi thứ nhất dùng 'mình' và gọi Rudersdorf là 'vị tướng' ('the general')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000121"
    choices:
      - "Tanya dùng 'chúng tôi' đại diện giới pháp sư trên không; khóa 'phương thức dẫn đường' ('navigation method') và 'dẫn đường địa văn' ('terrestrial navigation')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000122"
    choices:
      - "Giữ giọng mệnh lệnh ngắn gọn của cấp trên ('Nói rõ hơn xem nào')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000123"
    choices:
      - "Khóa chuỗi thuật ngữ 'dẫn đường địa văn' ('terrestrial navigation'), 'chương trình huấn luyện cấp tốc' ('accelerated training'), 'hệ thống đánh chặn dẫn đường từ mặt đất' ('ground-controlled interception') và 'dẫn đường vô tuyến' ('wireless navigation')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000124"
    choices:
      - "Khóa 'khoán ngoài' ('outsourced'), 'các đơn vị kiểm soát mặt đất' ('ground control units') và 'bí quyết dẫn đường' ('navigation know-how')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000125"
    choices:
      - "Khóa 'khoán ngoài' ('outsourcing') và 'sự suy yếu của năng lực cốt lõi' ('weakening of the core')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000126"
    choices:
      - "Khóa 'dẫn đường thiên văn' ('celestial navigation') và 'các pháp sư trên không' ('aerial mages')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000127"
    choices:
      - "Tanya xưng 'tôi' trong thoại và giữ câu bỏ lửng với dấu chấm lửng cuối câu."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000128"
    choices:
      - "Rudersdorf xưng 'ta', gọi Tanya là 'cô' và nhắc trực tiếp tên 'Zettour'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000129"
    choices:
      - "Khóa lời hỏi lại lễ phép 'Thưa Tướng quân…?' ('Sir…?')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000130"
    choices:
      - "Rudersdorf gọi Tanya là 'cô'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000131"
    choices:
      - "Tanya xưng 'tôi', giữ thái độ lịch sự ('ạ')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000132"
    choices:
      - "Nội tâm ngôi thứ nhất dùng 'mình'; khóa 'Trung tướng Zettour' ('Lieutenant General Zettour') và 'mặt trận phía đông' ('eastern front')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000133"
    choices:
      - "Khóa 'Tiểu đoàn Pháp sư Trên không số 203' ('203rd Aerial Mage Battalion') và 'chương trình huấn luyện cấp tốc' ('accelerated training')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000134"
    choices:
      - "Tanya xưng 'tôi', quy chiếu kính trọng tới Trung tướng Zettour là 'ngài ấy'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000135"
    choices:
      - "Khóa cấp bậc 'trung úy' ('first lieutenant') và giữ đúng tỷ lệ so sánh quân số 'một nửa hoặc thậm chí một phần ba quân số' trong lời dẫn trực tiếp."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000136"
    choices:
      - "Theo DEC-P01-002, giữ nhấn mạnh Markdown '*À à.*' cho từ cảm thán in nghiêng ở đầu đoạn; nội tâm dùng 'mình'; trong thoại khóa 'Trung úy Grantz' ('Lieutenant Grantz') và 'Tướng Zettour' ('General Zettour')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000137"
    choices:
      - "Rudersdorf gọi Tanya là 'cô' và quy chiếu Grantz là 'cậu ta'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000138"
    choices:
      - "Giữ câu trả lời phủ định ngắn gọn, chuẩn mực của Tanya ('Nói cho chính xác thì là không ạ.')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000139"
    choices:
      - "Rudersdorf quy chiếu Grantz là 'cậu ta'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000140"
    choices:
      - "Trần thuật ngôi thứ ba dùng 'Ông' (Rudersdorf), 'Tanya' và 'cô'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000141"
    choices:
      - "Tanya xưng 'tôi', gọi Grantz là 'cậu ta' / 'thuộc cấp của mình'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000142"
    choices:
      - "Rudersdorf gọi Tanya là 'cô'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000143"
    choices:
      - "Tanya gọi Rudersdorf là 'Thưa Tướng quân' / 'ngài', xưng 'tôi'; khóa 'lính tốt nghiệp chương trình huấn luyện cấp tốc' ('accelerated-training graduates'), 'cựu binh' ('veterans') và tỷ lệ 'đông gấp ba lần' ('triple the numbers')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000144"
    choices:
      - "Độc thoại nội tâm dùng 'mình' theo DEC-P01-001."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000145"
    choices:
      - "Độc thoại nội tâm dùng 'mình'; khóa 'chỉ huy đơn vị' ('commander of the unit') và 'quân tinh nhuệ' ('elite troops')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000146"
    choices:
      - "Thoại dùng 'tôi' / 'chúng tôi' - 'ngài', nhịp trần thuật xen giữa dùng 'mình'; khóa 'Bộ Tổng tham mưu' ('General Staff') và 'Pháp sư Định danh' ('Named')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000147"
    choices:
      - "Rudersdorf xưng 'ta' ('Ta hiểu rồi.')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000148"
    choices:
      - "Giữ sự đối xứng thời gian quá khứ - hiện tại tiếp diễn trong câu khẳng định của Tanya."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000149"
    choices:
      - "Trần thuật ngôi thứ ba nhắc 'Tanya' và 'Rudersdorf'; theo DEC-P01-002, giữ nhấn mạnh Markdown '*Phải thế chứ!*' cho cụm in nghiêng cuối câu."
