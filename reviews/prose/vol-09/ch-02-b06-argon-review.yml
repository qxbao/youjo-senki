    issue: "Đại từ ngôi thứ hai 'ông' trong câu thoại giữa Lergen và Rudersdorf hơi trung tính so với hệ quy chiếu cấp bậc (Đại tá Lergen thưa Trung tướng Rudersdorf là 'Tướng quân'/'ngài' ở p000199, còn Rudersdorf gọi cấp dưới là 'anh'/'các anh')."
    recommendation: "Theo nhịp đối thoại (p000209 Rudersdorf nêu nghịch lý thiếu người, p000210 Lergen đáp lời dè dặt, p000211 Rudersdorf chốt lệnh chọn người), có thể cân nhắc đổi 'ông' thành 'ngài' ('…Tôi chắc là ngài cũng hiểu việc đó khó khăn đến mức nào.') để nhất quán tôn ti quân hàm."
