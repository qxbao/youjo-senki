findings:
  - segment_id: YS-LN09/Text/chapter018.xhtml/p000037
    related_segment_ids:
      - YS-LN09/Text/chapter018.xhtml/p000038
    severity: minor
    category: terminology
    issue: "Thuật ngữ 'U-boat' ở p000037 ('U-boat bunkers') và p000038 ('U-boat') đang được dịch kèm từ giải thích là 'tàu ngầm U-boat' ('boong-ke tàu ngầm U-boat', 'bằng tàu ngầm U-boat'), vừa thêm yếu tố giải thích ngoài nguồn vừa gây lặp từ với 'submarine' ('tàu ngầm') ở câu thứ hai của p000038."
    evidence: "Trong work/run-state/pending-terms-index.yml của vol-09, 'U-boat' có phương án tạm là 'U-boat'; theo canon/style-guide.md, không tự thêm giải thích ngoài văn bản nguồn."
    recommendation: "Đổi thành 'boong-ke U-boat' ở p000037 và 'bằng U-boat' (hoặc 'bằng chiếc U-boat') ở p000038 để giữ phân biệt bề mặt từ vựng với 'tàu ngầm' ('submarine') ở câu sau."
  - segment_id: YS-LN09/Text/chapter018.xhtml/p000041
    related_segment_ids:
      - YS-LN09/Text/chapter018.xhtml/p000044
    severity: minor
    category: style_register
    issue: "Danh ngữ chỉ phái đoàn đón tiếp ở p000041 và 'the Ildoan military personnel' ở p000044 đang dùng từ chỉ loại 'đám' ('đám người mà mình đoán là phái đoàn đón tiếp bên quân đội', 'đám quân nhân Ildoa'), thêm sắc thái miệt thị vào chủ thể trong khi danh ngữ gốc mang sắc thái trung tính."
    evidence: "Theo canon/style-guide.md, không thêm sắc thái phán xét hoặc miệt thị không có trong nguồn; ở p000044 sắc thái tiêu cực nằm ở cụm 'rude stares' ('những ánh nhìn khiếm nhã') chứ không nằm ở danh ngữ chỉ nhân sự quân đội Ildoa."
    recommendation: "Đổi 'đám người mà mình đoán là phái đoàn đón tiếp bên quân đội' ở p000041 thành 'những người mà mình đoán là phái đoàn đón tiếp bên quân đội' và đổi 'đám quân nhân Ildoa' ở p000044 thành 'các quân nhân Ildoa'."
  - segment_id: YS-LN09/Text/chapter018.xhtml/p000051
    related_segment_ids:
      - YS-LN09/Text/chapter018.xhtml/p000054
      - YS-LN09/Text/chapter018.xhtml/p000064
    severity: minor
    category: meaning_nuance
    issue: "Cụm 'sense of incongruity' ở p000051 đang được dịch là 'cảm giác lạc lõng', làm lệch nghĩa sang tâm trạng cô đơn/xa lạ thay vì trực giác nhận thấy sự bất thường/sai khác của ngoại cảnh (vốn được giải mã ở p000054–p000064 là do đoàn tàu chạy quá êm và bình nước thủy tinh hầu như không rung lắc)."
    evidence: "Theo canon/style-guide.md, cần giữ đúng nghĩa và quan hệ nhân quả trong mạch suy luận của Tanya từ p000051 qua câu hỏi ở p000054 đến nhận xét về 'discrepancies' ('sự chênh lệch') ở p000064."
    recommendation: "Đổi 'một cảm giác lạc lõng khó tả' thành 'một cảm giác bất thường khó tả' hoặc 'một cảm giác sai khác khó tả'."
