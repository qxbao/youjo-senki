  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000153"
    choices:
      - "Đan xen thoại – nội tâm, nhấn mạnh Markdown & câu hỏi tu từ: giữ lời rào đón 'Xin thứ lỗi nếu tôi có phần mạo phạm, thưa Đại tá, nhưng tôi cũng đồng tình'; giữ tên riêng 'Tanya' và bọc chính xác '*cần thiết*' bằng dấu sao theo DEC-P01-002; giữ nhịp mỉa mai nội tâm 'Phải, chúng ta vẫn còn sống. Tuyệt vời làm sao.', nhận định 'việc vứt bỏ mạng người cũng khó lòng gọi là hợp lý được' và câu hỏi tu từ cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000154"
    choices:
      - "Liên kết ẩn dụ & tâm trạng bất định trong thoại: Lergen xưng 'tôi'/'mình', giữ liên kết ẩn dụ 'đã đang chìm nghỉm vào đó rồi' (nối với 'đắm chìm trong sự ủy mị' ở p000153), cảm giác 'chỗ đứng của mình đang hết sức chênh vênh nguy hiểm' và 'khó mà phân biệt nổi liệu mình có thực sự đang sống hay không nữa'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000155"
    choices:
      - "Câu hỏi ngắn lễ phép: giữ '“Thưa Đại tá?”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000156"
    choices:
      - "Tình thái dự đoán & câu hỏi đối lập trong thoại: Lergen xưng 'tôi', giữ 'Lịch sử nhiều khả năng sẽ quả quyết rằng tôi từng ở ngoài miền đông' và câu hỏi 'Đâu là sự thật và đâu là dối trá?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000157"
    choices:
      - "Điểm nhìn suy đoán nội tâm & đối lập hoàn cảnh: giữ địa danh 'Ildoa', đối lập giữa 'quãng thời gian thong thả ở Ildoa, vùng đất được ưu ái ban tặng ánh nắng ngập tràn' với 'được hậu thế ghi nhớ như một người từng đứng nơi mặt trận phía đông', tên riêng 'Lergen' và 'trong một thoáng tự giễu'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000158"
    choices:
      - "Điểm nhìn nội tâm & quan hệ điều kiện: Tanya tự quy chiếu bằng 'Mình' theo DEC-P01-001; giữ phủ định mức độ 'chẳng mấy tán thành chuyện chỉ thiên vị những người trực tiếp xông pha nơi lằn ranh sinh tử' và nhận định về vai trò của 'những công việc thầm lặng diễn ra ở hậu trường'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000159"
    choices:
      - "Câu hỏi cảm thán trong thoại: giữ hai câu hỏi đau xót '“Thực lòng mà nói, những cái chết này là vì điều gì cơ chứ? Tại sao lại phải hy sinh nhiều đến thế này?”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000160"
    choices:
      - "Câu hỏi ngắn lễ phép: giữ '“Thưa Đại tá?”'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000161"
    choices:
      - "Xưng hô, phủ định & hành động trần thuật: Lergen gọi Tanya là 'cô', xưng 'tôi', dùng 'chúng ta'; giữ phủ định 'cô không cần bận tâm đến lời tôi đâu—tôi chỉ đang than vãn chút thôi', 'Rên rỉ ở nơi công cộng chẳng giúp ích gì cho chúng ta cả…' và câu trần thuật 'Anh lầu bầu trong lúc dùng mũi giày nghiền nát mẩu tàn xì gà.' (không thêm nhấn mạnh cho thẻ neo trang)."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000162"
    choices:
      - "Điểm nhìn trần thuật, phủ định & liên kết từ vựng: giữ tên riêng 'Tanya', đại từ 'cô'/'Cô', 'anh' (chỉ Lergen), chức danh 'viên sĩ quan phụ tá của mình', phủ định 'đây chẳng phải lúc để Tanya tự giác thú nhận' và từ 'than vãn' lặp lại tương ứng với lời Lergen ở p000161."
