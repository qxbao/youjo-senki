  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000123"
    choices:
      - "Thuật ngữ & giả định thuận lợi trong thoại: giữ 'Các đơn vị phòng không', 'Liên lạc nội bộ trong quân đội ta vốn không chê vào đâu được' và nhận định 'Thật ra nếu có ai đó nổ súng thì lại càng tiện'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000124"
    choices:
      - "Câu hỏi nội tâm & phủ định: quy chiếu Lergen bằng 'anh ta', giữ đúng đối tượng câu hỏi và phủ định 'Điều gì đang ẩn sau những lời anh ta chưa nói ra?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000125"
    choices:
