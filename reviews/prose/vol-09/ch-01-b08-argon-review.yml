  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000126"
    choices:
      - "Xưng hô, câu hỏi tu từ & thuật ngữ trong thoại: Tanya xưng 'tôi', dùng 'Chúng ta' cho phía Đế quốc; giữ câu hỏi phản biện 'chẳng phải chẳng khác nào công khai rêu rao rằng lưới phòng không của thủ đô có lỗ hổng sao ạ?' và các thuật ngữ 'Khối Thịnh vượng chung', 'ném bom chiến lược'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000127"
    choices:
      - "Thuật ngữ, điều kiện giả định & sắc thái thái độ trong thoại: giữ 'đế đô', đại từ 'tôi' của Lergen, mệnh đề giả định 'nếu nơi mà họ cảm thấy an toàn suýt bị ném bom' và sắc thái khinh miệt 'ngay cả đám chính khách cũng sẽ buộc phải sáng mắt ra thôi' (không thêm nhấn mạnh cho thẻ neo trang)."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000128"
    choices:
      - "Điểm nhìn pha trộn nội tâm – trần thuật: giữ tên riêng 'Lergen', 'Tanya', đại từ 'anh', 'cô' ở câu cuối, cụm 'tràn ngập vẻ ghê tởm và thù địch', 'ghét đám chính khách' và 'bộc lộ chút cảm xúc thật trước mặt Tanya cũng phần nào khiến cô thấy nhẹ nhõm'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000129"
    choices:
      - "Đối lập thái độ & thuật ngữ: quy chiếu Lergen bằng 'anh', giữ đối lập giữa 'thái độ thẳng thừng hơn hẳn khi nói về giới chính khách' với 'những băn khoăn của anh đối với Bộ Tư lệnh Tối cao lại vòng vo hơn nhiều' và nhận định 'một sự khác biệt nhỏ nhưng mang tính sống còn'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000130"
    choices:
      - "Quân hàm & câu hỏi xác nhận trong thoại: giữ 'Thưa Đại tá… Ngài nói thật về tất cả những chuyện này sao ạ?'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000131"
    choices:
      - "Câu điều kiện lập luận trong thoại: giữ mệnh đề 'Nếu mục đích biện minh cho phương tiện, thì đó rõ ràng là phương án nhanh nhất.'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000132"
    choices:
