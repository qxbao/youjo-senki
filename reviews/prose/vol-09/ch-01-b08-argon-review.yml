  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000121"
    choices:
      - "Quân hàm, xưng hô & tình thái gợi ý trong thoại: Lergen dùng 'chúng ta' cho hoàn cảnh chung, gọi Tanya là 'cô' và 'Trung tá'; giữ câu điều kiện giả định 'nếu có mấy kẻ ngu xuẩn bắn vào cô, thì biết đâu cô cứ để mặc cho họ bắn lại hay đấy'."
  - segment_id: "YS-LN09/Text/chapter004.xhtml/p000122"
    choices:
