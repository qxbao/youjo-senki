locked_choices:
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000123
    choices:
      - "Khóa đại từ tôn xưng 'Ngài' và tiểu từ lễ phép 'ạ' trong câu hỏi thăm của Trung úy Serebryakov dành cho Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000124
    choices:
      - "Khóa đại từ 'cô ấy' chỉ Serebryakov, đại từ nội tâm 'mình' của Tanya và đại từ phiếm chỉ 'bạn' trong nhận định chung về cấp trên ngồi càu nhàu một mình."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000125
    choices:
      - "Khóa cách gọi 'Trung úy' (Lieutenant) và lời trấn an của Tanya rằng thực sự không có vấn đề gì."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000126
    choices:
      - "Khóa đại từ 'ngài' và nhận xét ngập ngừng của Serebryakov về việc tâm trạng của Tanya dạo gần đây có vẻ chùng xuống."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000127
    choices:
      - "Khóa sự chuyển đổi giữa đại từ nội tâm 'mình' ở câu đầu và tự quy chiếu ngôi thứ ba 'Tanya' ở câu sau với hình mẫu người sĩ quan lý tưởng kiên định và tràn đầy tự tin."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000128
    choices:
      - "Khóa địa danh 'Ildoa', đại từ nội tâm 'Mình' và sự đối lập giữa 'lớp vỏ bọc dày dạn' với thực tế 'mong manh đến bất ngờ'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000129
    choices:
      - "Khóa đại từ thoại 'tôi' của Tanya và nhấn mạnh Markdown '*Tôi cũng chỉ là con người mà thôi*' theo DEC-P01-002 cho phần lời không được nói ra."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000130
    choices:
      - "Khóa điểm nhìn trần thuật mô tả những chiếc bánh quy được đóng gói cầu kỳ trang nhã đối lập với lớp giấy gói đơn sơ ở 'Đế quốc'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000131
    choices:
      - "Khóa đại từ thoại 'tôi' và câu nói bỏ lửng của Tanya về hương vị của chiếc bánh quy."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000132
    choices:
      - "Khóa cặp đại từ 'Tôi' – 'ngài' cùng sắc thái lễ phép 'Vâng... ạ' của Serebryakov khi nhắc tới việc có thể yêu cầu lấy thêm sô-cô-la."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000133
    choices:
      - "Khóa tên riêng 'Ildoa', câu hỏi về sự chu đáo và ý định lấy một ít của Tanya ('tôi')."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000134
    choices:
      - "Khóa tình thái phỏng đoán 'Chắc họ làm vậy để phô trương thôi', đại từ nội tâm 'mình' và tâm lý tranh thủ vơ vét khi còn có cơ hội của người quen sống trong cảnh thiếu thốn."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000135
    choices:
      - "Khóa đại từ thoại 'Tôi', thuật ngữ 'Toa ăn' (The dining car) và ý định kiếm lấy một ít lá trà cùng hạt cà phê."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000136
    choices:
      - "Khóa đại từ thoại 'tôi' và mong muốn mang về một ít đường trắng làm quà lưu niệm."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000137
    choices:
      - "Khóa câu đáp lệnh chuẩn mực của Serebryakov: '“Rõ, thưa Trung tá.”' (Understood, ma’am)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000138
    choices:
      - "Khóa đại từ nội tâm 'Mình' / 'mình' và cụm 'vị sĩ quan phụ tá đang mỉm cười' (smiling adjutant)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000139
    choices:
      - "Khóa sự tương phản giữa việc 'một người lính Đế quốc' mang đường về làm quà lưu niệm hiện tại với việc 'Đế quốc' từng hoàn toàn tự cung tự cấp bằng 'đường củ cải' sản xuất trong nước trước 'cuộc chiến tranh tổng lực này'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000140
    choices:
      - "Khóa câu cảm thán ngắn: 'Mọi chuyện đã đổi thay biết bao.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000141
    choices:
      - "Khóa sự đối lập gay gắt giữa vùng đất 'Ildoa' ngay bên kia biên giới (muốn gì cũng kiếm được) và tình cảnh ở 'Đế quốc' (cái gì cũng thiếu thốn), cùng đại từ phiếm chỉ 'bạn'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000142
    choices:
      - "Khóa đại từ 'chúng ta' ở vế đầu và tự quy chiếu ngôi thứ ba 'Tanya' ở câu sau khi cô suýt đưa tay lên vò đầu bứt tai nhưng dừng lại với tiếng thở dài."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000143
    choices:
      - "Khóa hai câu hỏi nội tâm 'Đây là sự ghen tị ư? Hay là sự cam chịu?' và đại từ nội tâm 'Mình' / 'mình'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000144
    choices:
      - "Khóa câu trần thuật ngắn: 'Tanya lắc đầu.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000145
    choices:
      - "Khóa định danh 'Being X', đại từ nội tâm 'mình' và quyết tâm tự bước đi trên con đường của riêng mình."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000146
    choices:
      - "Khóa sự chuyển đổi từ đại từ phiếm chỉ 'Bạn' trong nhận định khái quát về xuất thân và số phận sang đại từ nội tâm 'mình' ở câu khẳng định ý định cá nhân."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000147
    choices:
      - "Khóa đại từ nội tâm 'Mình' / 'mình', cụm 'thời kỳ chiến quốc của Đế quốc' và lý do gia nhập quân đội để tránh bị gọi nhập ngũ với thân phận trẻ mồ côi."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000148
    choices:
      - "Khóa cấu trúc tự hiệu chỉnh 'Đế quốc, hay đúng hơn là người lính Đế quốc Tanya' và ý có được một khoảng lặng để cân nhắc về tương lai."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000149
    choices:
      - "Khóa câu lẩm bẩm hình tượng của Tanya về việc chiếc đồng hồ cát sắp cạn sạch vẫn có thể lật ngược lại được."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000150
    choices:
      - "Khóa dòng tiêu đề thời gian – địa điểm viết hoa toàn bộ: 'NGÀY 18 THÁNG 7 NĂM THỐNG NHẤT 1927, CỤM TẬP ĐOÀN QUÂN PHÍA NAM CỦA LỤC QUÂN ĐẾ QUỐC, KHU VỰC PHÒNG THỦ QUÂN CẢNG AIN THUỘC CỘNG HÒA CŨ'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000151
    choices:
      - "Khóa câu nhận xét mở đầu cảnh: '“Dù sao thì quân phục của họ cũng chỉnh tề đấy chứ.”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000152
    choices:
      - "Khóa thuật ngữ 'đơn vị đồn trú tại cảng' (harbor garrison), tên và cấp bậc 'Đại úy Meybert' cùng 'Trung úy Tospan'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000153
    choices:
      - "Khóa mô tả quân phục phẳng phiu bóng loáng như bước ra từ ảnh chụp, cụm 'mặt trận phía đông' (eastern front) và sự đối lập giữa 'những chú lính chì đồ chơi' với 'đơn vị đồn trú tại cảng'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000154
    choices:
      - "Khóa tên đơn vị 'Kampfgruppe Lergen', cụm 'đơn vị đồn trú tại cảng' (port garrison) và phản ứng chết lặng của toàn bộ binh lính."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000155
    choices:
      - "Khóa câu trần thuật: 'Mọi chuyện bắt đầu từ thiện ý của cấp trên.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000156
    choices:
      - "Khóa các thuật ngữ 'mặt trận phía đông', 'Kampfgruppe Lergen', 'hậu phương', 'đợt luân chuyển nghỉ phép' và 'tái tổ chức'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000157
    choices:
      - "Khóa chi tiết pháo binh và bộ binh được phân công 'làm nhiệm vụ tại cảng' (port duty) cùng thái độ hoan nghênh của 'Meybert' và 'Tospan' trước kỳ nghỉ mang danh nghĩa làm nhiệm vụ canh gác ở 'hậu phương'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000158
    choices:
      - "Khóa tên và cấp bậc 'Đại úy Ahrens', cụm 'lực lượng thiết giáp', dấu ba chấm ngắt nhịp và chi tiết bị điều tới một thao trường ở vùng phụ cận 'thủ đô' để kiện toàn lại đơn vị."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000159
    choices:
      - "Khóa sự đối lập giữa tiếng reo hò của pháo binh và bộ binh với sự tuyệt vọng của cánh lính xe tăng, nhấn mạnh Markdown '*Đùa nhau chắc!*' theo DEC-P01-002 và quy luật càng gần 'chính quốc' (home country) thì quy định càng nghiêm ngặt."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000160
    choices:
      - "Khóa phép so sánh giữa những người làm nhiệm vụ tại cảng được tận hưởng sản vật của biển khơi với bên thiết giáp phải lấm lem bùn đất ngoài thao trường."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000161
    choices:
      - "Khóa câu chuyển ý: 'Nhưng tinh thần phấn chấn của họ chỉ kéo dài cho đến khi họ trông thấy những người đồng sự của mình.'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000162
    choices:
      - "Khóa tên đơn vị 'Kampfgruppe Lergen', 'mặt trận phía đông', 'đơn vị đồn trú tại cảng', chi tiết trang bị toàn đồ lỗi thời tạo nên 'sự pha trộn lạ lùng giữa già và trẻ' và câu kết mở ra mối bận tâm lớn hơn."
