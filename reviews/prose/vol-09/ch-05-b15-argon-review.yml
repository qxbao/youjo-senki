  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000497"
    choice: "Dịch 'coastal guns' là 'các khẩu pháo bờ biển' và 'near miss' là 'phát bắn sượt sát sạt'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000498"
    choice: "Giữ nguyên thế đối lập cân bằng 'Quá gần để nói là bắn trượt nhưng lại quá xa để bảo là đã bắn trúng'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000499"
    choice: "Giữ đánh giá khen ngợi phát bắn đầu tiên gần như hoàn hảo."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000500"
    choice: "Giữ đúng cấu trúc giả định trái thực tế ở quá khứ về việc chưa quen đặc tính riêng của các khẩu pháo bờ biển."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000501"
    choice: "Dịch 'Calibration shot' là 'Phát bắn hiệu chỉnh', 'fire for effe—' là 'bắn tiêu diệ—' (ngắt giữa chừng) và 'coastal artillery' là 'pháo bờ biển'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000502"
    choice: "Bảo toàn chính xác phạm vi nhấn mạnh Markdown '*Họ đã làm rất tốt.*' ở câu đầu, tách biệt với câu trần thuật tiếp theo."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000503"
    choice: "Bảo toàn nhấn mạnh Markdown cho toàn bộ đoạn độc thoại nội tâm; dùng 'chúng ta' và dịch 'signal flags' là 'cờ tín hiệu'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000504"
    choice: "Giữ câu trần thuật ngắn tạo nhịp cắt đột ngột: 'Chuông điện thoại đột ngột reo vang.'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000505"
    choice: "Đại từ trần thuật 'Anh' cho Meybert, giữ đúng nhận định về thời gian phản ứng quá sớm so với loạt pháo vừa bắn."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000506"
    choice: "Meybert xưng danh qua điện thoại: 'Vâng, tôi là Đại úy Meybert bên pháo binh đây.'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000507"
    choice: "Trung tá Paul gọi 'Đại úy Meybert', xưng 'tôi - anh' và giữ giọng gào thét giận dữ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000508"
    choice: "Dịch 'Lieutenant Colonel Paul' là 'Trung tá Paul', dùng đại từ trần thuật 'ông ta' từ điểm nhìn của Meybert."
