findings:
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000153"
    severity: "minor"
    issue: "Cách dịch danh xưng 'our honorable Exchequer' thành 'ngài Bộ trưởng Tài chính đáng kính' hơi lệch cấp bậc so với thông tin ở p000154 và p000159."
    evidence: "Nguồn dùng danh từ chỉ cơ quan tài chính/ngân khố (hoặc hoán dụ cho đại diện của cơ quan này trong cuộc họp), còn p000154 và p000159 nêu rõ người có mặt phát biểu là 'The officer serving the Exchequer' / 'the Exchequer officer' (được dịch là 'vị quan chức đại diện cho Bộ Tài chính' / 'vị quan chức Bộ Tài chính'). Việc gọi thẳng là 'ngài Bộ trưởng Tài chính' ở p000153 dễ khiến người đọc hiểu nhầm chính Bộ trưởng đang dự họp."
    recommendation: "Có thể giữ nguyên nếu hiểu theo lối nói xã giao phóng đại của phía hải quân hướng tới cơ quan nắm hầu bao, hoặc tinh chỉnh nhẹ thành 'quý Bộ Tài chính đáng kính của chúng ta' / 'ngài đại diện Bộ Tài chính đáng kính của chúng ta' ở bước chuốt văn."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000173"
    severity: "minor"
    issue: "Cụm chức danh 'Magic Officer' đi trước quân hàm của Tanya được dịch là 'Sĩ quan Pháp sư' thay vì 'Sĩ quan Ma pháp' như các đề xuất trước trong sổ pending."
    evidence: "Trong sổ pending (vol-04), 'magic officer' được đề xuất là 'sĩ quan ma pháp' (khác với khi ghép trực tiếp vào quân hàm như 'Magic Lieutenant Colonel' -> 'Trung tá Pháp sư')."
    recommendation: "Không ảnh hưởng nghĩa hay cốt truyện; có thể giữ nguyên hoặc đồng bộ thành 'Sĩ quan Ma pháp Đế quốc, Trung tá Tanya von Degurechaff' ở bước chuốt văn."
