  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000665"
    choices:
      - "Khóa cách xưng hô của Meybert với Tospan: gọi 'Trung úy', dùng đại từ 'Cậu' và giữ câu hỏi xác nhận ở cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000666"
