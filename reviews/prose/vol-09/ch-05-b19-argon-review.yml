  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000689"
    choices:
      - "Khóa định danh 'Meybert' và lời cảnh báo phủ định '“Không có gì đảm bảo chúng chỉ toàn là bộ binh đâu!”'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000690"
    choices:
      - "Khóa đại từ trần thuật 'Anh', thuật ngữ 'pháp sư' (mages) và câu cảm thán phủ định 'Làm gì có chuyện những kẻ đang bay trên mặt nước kia là toàn bộ số pháp sư mà chúng có chứ!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000691"
    choices:
      - "Khóa định danh 'Soldim 528' (sau khi bỏ từ giải thích 'trận') và không sinh dấu nhấn mạnh từ thẻ neo trang page-244."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000692"
    choices:
      - "Khóa nhấn mạnh Markdown bao trọn toàn bộ đoạn độc thoại nội tâm mô tả chiến thuật dùng một bộ phận pháp sư làm mồi nhử rồi bất ngờ đánh thốc vào sườn."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000693"
    choices:
      - "Khóa câu cảm thán khẳng định đây chính là thủ pháp/mánh khóe từng mang lại hiệu quả mỹ mãn cho họ."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000694"
    choices:
      - "Khóa các thuật ngữ 'mặt trận phía đông' (eastern front), 'toán biệt kích' (commando group), quân hàm 'Trung tá' (The colonel, chỉ Trung tá Tanya von Degurechaff) và dấu gạch ngang dài ngắt câu ở cuối lời thoại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000695"
    choices:
      - "Khóa đại từ trần thuật 'anh' và đúng 1 cụm nhấn mạnh Markdown '*trà trộn các pháp sư vào đó*' nối tiếp câu thoại bị cắt ngang ở p000694."
