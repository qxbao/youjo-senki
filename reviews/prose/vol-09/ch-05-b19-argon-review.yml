locked_choices:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000645"
    choices:
      - "Khóa câu thoại hoảng loạn trên kênh liên lạc: giữ thuật ngữ 'biệt kích' (commandos), cách gọi 'Quân mình' (our guys) và ba câu cảm thán/nghi vấn liên tiếp."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000646"
    choices:
      - "Khóa tiếng kêu cứu và dấu gạch ngang dài cắt lời ở cuối câu thoại: '“Cứu với! Là quân địch! Quân địch đang—!”'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000647"
    choices:
      - "Khóa tiếng hét ngăn bắn nhầm: '“Dừng lại! Ngừng bắn ngay! Bắn trúng quân mình bây giờ!”'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000648"
    choices:
      - "Khóa lời gào đáp trả trong cơn hoảng loạn: '“Chúng đang bắn về phía chúng ta! Chúng là quân địch đấy!”'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000649"
    choices:
