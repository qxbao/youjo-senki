findings:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000658"
    severity: "minor"
    category: "emphasis_style"
    issue: "Ở câu đầu của p000658, bản dịch đang tách đôi từ ghép 'tất nhiên' để chỉ đặt dấu nhấn mạnh Markdown vào âm tiết thứ hai ('Tất *nhiên*'), gây vụn nhịp từ vựng tiếng Việt."
    evidence: "Theo DEC-P01-002 và canon/style-guide.md, cần giữ đúng phạm vi và số lượng cụm nhấn mạnh Markdown ('*...*') nhưng vẫn đảm bảo kết hợp từ tiếng Việt tự nhiên."
    recommendation: "Đổi 'Tất *nhiên*' thành 'Lẽ *dĩ nhiên*' ('Lẽ *dĩ nhiên* là chuyện đó cứ phải xảy ra vào lúc này rồi.') để vừa giữ nguyên trạng từ đứng trước cụm '*dĩ nhiên*' tương ứng với cấu trúc nhấn mạnh của nguồn, vừa không cắt rời một từ ghép hai âm tiết."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000661"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Ở vế đầu của câu thứ nhất tại p000661, trạng thái bị kiềm chế/ngăn cản không thể nổ súng vào quân địch (do quân mình đang ở lẫn bên dưới và la hét yêu cầu ngừng bắn tại p000647, p000666) đang được dịch là 'bị kìm chân', dễ gợi nghĩa bị ghìm giữ bước tiến khi cơ động."
    evidence: "Theo canon/style-guide.md, cần giữ chuẩn xác quan hệ nhân quả và sự đối lập giữa hai vế: vế đầu nói về việc định khai hỏa thì bị ngăn lại, còn vế hai mới nói về việc định tiến lên chặn địch thì lại bị quân mình bắn nhầm (p000653–p000656)."
    recommendation: "Đổi 'bị kìm chân' thành 'bị cản lại' hoặc 'bị ngăn lại' ('Khi định nổ súng vào quân địch thì họ bị cản lại; khi định chặn đứng quân địch thì họ lại bị bắn.')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000691"
    severity: "minor"
    category: "terminology"
    issue: "Tại p000691, định danh 'Soldim 528' đang được dịch kèm danh từ 'trận' ('trận Soldim 528'), tức tự thêm từ phân loại ngoài văn bản nguồn."
    evidence: "Theo canon/style-guide.md, không tự thêm từ giải thích ngoài nguồn khi định danh gốc chỉ nêu tên vị trí/mốc chiến trường."
    recommendation: "Lược bỏ từ 'trận', giữ nguyên định danh 'Soldim 528' ('Khi nhớ lại Soldim 528, điều đó mới hiển nhiên làm sao!')."
