  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000684"
    choices:
      - "Khóa nhận định ngắn: 'Nhưng đó là một canh bạc lớn.'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000685"
    choices:
      - "Khóa nhấn mạnh Markdown bao trọn toàn bộ đoạn độc thoại nội tâm về độ liều lĩnh khi chỉ dùng bộ binh đơn thuần và sự tự tin vào 'phương án rút quân' (extraction)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000686"
