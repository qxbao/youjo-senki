  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000651"
    choices:
      - "Khóa nhận định trần thuật về cảnh hỗn loạn ngay trước khi 'vỡ trận' (rout) và phủ định 'tình hình chẳng còn chút trật tự nào' (far from orderly situation)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000652"
    choices:
      - "Khóa đại từ trần thuật ngôi thứ ba của Meybert là 'anh', tên riêng 'Tospan' và đúng 1 cụm nhấn mạnh Markdown '*Đúng lúc lắm.*'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000653"
    choices:
      - "Khóa danh xưng 'Trung úy Tospan' và câu thoại bỏ lửng bằng dấu gạch ngang dài 'Cứ đà này thì—'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000654"
    choices:
      - "Khóa cách xưng hô của Tospan với Meybert: gọi 'Đại úy!', xưng 'Chúng tôi' và phủ định 'Chúng tôi sẽ không tới kịp mất!'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000655"
    choices:
      - "Khóa cấu trúc chêm xen câu hỏi nội tâm in nghiêng giữa hai dấu gạch ngang dài '—*Sao các cậu lại không tới kịp được cơ chứ?*—' và đại từ trần thuật 'anh'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000656"
    choices:
      - "Khóa báo cáo bị bắn nhầm của Tospan: '“Chúng tôi đang bị bắn! Từ một chốt của quân mình!”'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000657"
    choices:
