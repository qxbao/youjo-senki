locked_choices:
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000001"
    locked: "Giữ định dạng tiêu đề thời gian – địa điểm viết hoa toàn bộ: 'NGÀY 22 THÁNG 7 NĂM THỐNG NHẤT 1927, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000002"
    locked: "Giữ cấu trúc hai khả năng ('Dù là vừa đi công tác về hay có dịp ghé qua tổng hành dinh đi nữa') và phủ định nhấn mạnh ('tuyệt đối không thể lơ là')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000003"
    locked: "Thuật ngữ 'Văn phòng Bộ Tổng tham mưu' (General Staff Office); giữ mạch liên kết với đoạn trước."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000004"
    locked: "Điểm nhìn nội tâm Tanya tự quy chiếu 'mình' ('sĩ quan phụ tá của mình') theo DEC-P01-001; thuật ngữ 'chiến dịch V-2 ở phía nam', 'Ildoa'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000005"
    locked: "Giữ nghĩa thành ngữ công sở 'make the rounds' là 'đi một vòng chào hỏi xã giao'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000006"
    locked: "Trần thuật ngôi thứ ba gọi 'Tanya' là 'cô', gọi 'Đại tá Lergen' là 'anh'; câu thoại của Lergen với Tanya dùng 'Tôi - cô' ('Tôi gặp cô một lát được chứ?')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000007"
    locked: "Đại từ trần thuật chỉ Lergen là 'anh ta' / 'anh'; giữ đối lập chuyển cảnh ('Nhưng khi anh chia sẻ tin tức của mình, mọi suy nghĩ lan man đều lập tức bay biến sạch')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000008"
    locked: "Tanya gọi Lergen là 'Thưa Đại tá Lergen', đại từ 'ngài ... ạ' thể hiện đúng lễ tiết cấp dưới với cấp trên."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000009"
    locked: "Lergen gọi Tanya là 'Cô' và quân hàm 'Trung tá' (dịch từ cách gọi tắt 'Colonel' dành cho Lieutenant Colonel)."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000010"
    locked: "Điểm nhìn ngôi thứ nhất của Tanya dùng 'Mình' theo DEC-P01-001; giữ danh xưng 'Đại tá Lergen'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000011"
    locked: "Thuật ngữ 'Đại úy Meybert', 'Trung úy Tospan', 'quân cảnh'; Lergen xưng 'Tôi', gọi hai sĩ quan là 'họ'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000012"
    locked: "Tanya xưng 'tôi', gọi Lergen là 'thưa Đại tá' / 'Ngài'; giữ phủ định ('Vấn đề ở đây không phải là thời gian bao lâu') và cụm 'người lính pháo binh và gã ngốc bộ binh của tôi'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000013"
    locked: "Nội tâm Tanya tự xưng 'Mình', gọi Meybert và Tospan là 'Họ' / 'cả hai người họ'; giữ cụm 'Hai kẻ cuồng sổ tay quy chế'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000014"
    locked: "Giữ phủ định nhấn mạnh ('Họ tuyệt đối không phải hạng ngu đần vô dụng...') và quan hệ nhượng bộ – suy luận ở câu sau ('Tospan có thể là kiểu đầu gỗ..., nhưng điều đó có nghĩa là ít nhất anh ta cũng đã đọc qua chúng rồi')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000015"
    locked: "Tanya xưng 'tôi' trong thoại, giữ so sánh hơn ('cứng nhắc nguyên tắc hơn cả tôi nữa'), phủ định ('không tài nào nghĩ ra được bất kỳ lý do gì') và câu hỏi có kính ngữ 'vậy ạ?'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000016"
    locked: "Thuật ngữ 'bến cảng chiếm đóng', 'biệt kích của Khối Thịnh vượng chung', 'Kampfgruppe Lergen'; giữ từ khóa cáo buộc 'sự lơ là' (laziness) liên kết với p000017."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000017"
    locked: "Tanya hỏi lại 'sự lơ là sao ạ?', giữ đối lập điều kiện ('Nếu bảo là quá hăng máu chiến đấu thì tôi còn hiểu được, chứ bảo là lười biếng lơ là ư? Mấy người đó thì không đời nào')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000018"
    locked: "Điểm nhìn trần thuật gắn với nhận thức của 'Tanya'; giữ phủ định ở câu hai ('Họ đơn giản không phải hạng ngốc nghếch đến mức bị bắt vì chểnh mảng nhiệm vụ')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000019"
    locked: "Giữ danh xưng 'Trung úy Tospan', đại từ 'anh ta', kính ngữ 'đấy ạ!' và cấu trúc khẳng định giới hạn tuyệt đối ('Lúc duy nhất anh ta chểnh mảng trước mặt kẻ địch là khi anh ta đã chết rồi!')."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000020"
    locked: "Lergen xưng 'tôi', gọi Tanya là 'cô'; phân biệt rõ 'mấy tay bên hải quân' ('họ') và Meybert – Tospan ('hai người họ'); giữ tình thái 'Nghe đâu' (Supposedly) khớp với câu đáp ở p000021."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000021"
    locked: "Tanya xưng 'Tôi', gọi 'ngài ... ạ'; giữ trích dẫn từ '‘nghe đâu’' đối chiếu trực tiếp với lời Lergen ở p000020."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000022"
    locked: "Khóa bộ ba tội danh: 'chống lệnh cấp trên, bất tuân mệnh lệnh và cố ý bắn vào quân mình'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000023"
    locked: "Lặp lại chính xác ba tội danh từ p000022 ở dạng câu cảm thán; giữ phủ định phỏng đoán ('Chuyện thực tế diễn ra không thể nào như thế được') và câu hỏi cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000024"
    locked: "Lergen xưng 'Tôi', gọi hai sĩ quan là 'họ', thuật ngữ 'phòng thủ bến cảng'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000025"
    locked: "Nội tâm Tanya tự xưng 'mình'; giữ nhịp ba cụm danh từ cảm thán liên tiếp phê phán sự bất tài, ngu xuẩn và thiếu trí tưởng tượng."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000026"
    locked: "Tanya dùng 'chúng ta', thuật ngữ 'mặt trận phía đông', 'hậu phương'; giữ ẩn dụ 'trả học phí cho người thầy mang tên kinh nghiệm' và 'gạch sổ bọn họ rồi kê đơn cho ăn đạn chì'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000027"
    locked: "Lergen nhắc nhở Tanya bằng danh xưng 'Trung tá Degurechaff' và đại từ 'cô'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000028"
    locked: "Phân biệt rõ 'Mình' trong câu dẫn nội tâm và 'Tôi' trong lời thoại của Tanya; thuật ngữ 'quân cảnh', 'mặt trận phía đông', 'Quân đội Liên bang'."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000029"
    locked: "Giữ cấu trúc hai câu điều kiện đối xứng về nguyên tắc của người làm cấp trên đối với cấp dưới và câu khẳng định ngắn 'Luôn luôn là vậy.' ở cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter022.xhtml/p000030"
    locked: "Giữ thuật ngữ 'bài học nhập môn về chế độ trọng dụng nhân tài' (Meritocracy 101) và hai mệnh đề điều kiện giả định đối lập về 'Meybert lẫn Tospan' và 'những kẻ ngu xuẩn thực sự'."
