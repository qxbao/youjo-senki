    choices:
      - "Xưng hô trong thoại: giữ câu đáp ngắn gọn '“Cảm ơn Tướng quân.”'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000193"
    choices:
      - "Xưng hô & quân hàm: giữ xưng hô 'Tôi' – 'anh', gọi cấp bậc 'Đại tá ạ' và câu hỏi thúc giục 'Anh còn nghĩ ra được ai khác nữa không?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000194"
    choices:
      - "Điểm nhìn & quan hệ thời gian: giữ 'Trước cả khi kịp nửa đùa nửa thật xin tha, anh đã bị ra lệnh phải nêu tên đề xuất tiếp theo của mình.'"
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000195"
    choices:
      - "Nhấn mạnh Markdown, đại từ nội tâm & thuật ngữ: bọc chính xác câu nội tâm '*Tới nước này thì chắc mình cứ thuần túy xét theo lý lịch binh nghiệp vậy.*' bằng dấu sao theo DEC-P01-002 (dùng đại từ tự quy chiếu 'mình'); giữ 'đủ năng lực quán triệt đến cùng ý đồ của Bộ Tổng tham mưu…'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000196"
    choices:
      - "Nhấn mạnh Markdown & đại từ: bọc chính xác câu hỏi nội tâm '*Ông ấy thì sao nhỉ?*' bằng dấu sao theo DEC-P01-002 (dùng đại từ 'Ông ấy' quy chiếu tới Tướng Romel ở đoạn kế tiếp)."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000197"
    choices:
      - "Quân hàm, phiên hiệu & cấu trúc điều kiện: giữ 'Tướng quân', 'Tướng Romel', đại từ 'ông ấy', 'miền tây', 'Bộ Tổng tham mưu', phiên hiệu 'Quân đoàn Viễn chinh Lục địa Phía nam' và mệnh đề điều kiện giả định 'Nếu chúng ta điều ông ấy sang miền tây... tôi nghĩ chúng ta có thể phổ biến cho ông ấy nắm rõ tình hình'."
