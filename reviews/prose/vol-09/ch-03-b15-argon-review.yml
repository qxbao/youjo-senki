  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000609"
    choices:
      - "Thoại khẳng định có điều kiện: giữ '“Nếu chúng ta có thể sử dụng chúng thì dĩ nhiên rồi. Đó chỉ là một ý tưởng thôi, nhưng tôi nghĩ nó rất khả quan.”'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000610"
    choices:
      - "Đoạn chuyển có dấu gạch ngang: giữ 'Nhưng—'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000611"
    choices:
      - "Trần thuật & thuật ngữ: giữ định nghĩa về tình huống cực đoan của chiến tranh và thuật ngữ 'chiến tranh tổng lực'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000612"
    choices:
      - "Liên hệ lịch sử & ẩn dụ trần thuật: giữ 'quy mạng sống con người thành những con số thuần túy', dẫn chứng 'trước Thế chiến thứ nhất, từng có một vị tướng người Anh... qua những bài học từ cuộc Chiến tranh Nga – Nhật' và ẩn dụ 'người thầy mang tên kinh nghiệm—người luôn đòi một cái giá quá đắt'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000613"
    choices:
      - "Quan hệ tương phản tỷ lệ thuận: giữ 'Ngược lại, một người càng biết suy xét hợp lý thì lại càng có xu hướng suy nghĩ về tương lai dưới góc nhìn của những quan niệm cố hữu và lẽ thường.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000614"
    choices:
      - "Điểm nhìn ngoại quan về Tanya: giữ 'Nói cách khác, Tanya trông chẳng khác nào một con quái vật hành động theo một hệ logic và những nguyên tắc hành xử hoàn toàn không thể lý giải nổi.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000615"
    choices:
      - "Dấu câu & sự thực khách quan: giữ dấu chấm lửng mở đầu và ý 'thực chất Tanya chỉ đơn thuần là nắm được một lượng kiến thức lịch sử tàm tạm mà thôi.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000616"
    choices:
      - "Thoại đính chính câu hỏi cuối lô: giữ '“Không, ý tôi là, liệu một trong hai phương án cải tiến ngư lôi đó có thực sự khả thi để triển khai hay không?”'."
