  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000583"
    severity: "minor"
    category: "pronouns"
    issue: "Đại từ trần thuật ngôi thứ ba quy chiếu Tanya trong lô ch-03-b15 (tại p000583, p000584, p000589, p000593, p000594, p000597) tiếp tục dùng 'nó' theo DEC-P01-001 (nhất quán với các lô ch-03-b12 đến ch-03-b14 liền trước), trong khi một số lô đầu của tập 9 dùng 'cô'."
    recommendation: "Nội bộ lô ch-03-b15 đã nhất quán hoàn toàn giữa trần thuật ('nó') và độc thoại nội tâm ('mình' tại p000576); ở bước chuốt văn Flash hoặc khi ghép chương, điều phối viên có thể giữ nguyên theo DEC-P01-001 hoặc đồng bộ thành 'cô' nếu muốn thống nhất toàn chương 3."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000590"
    severity: "minor"
    category: "style_nuance"
    issue: "Tại p000590 và p000591, cách nói ví von 'dùng các ngư lôi cỡ nhỏ làm xuồng/thuyền' được dịch giải nghĩa thành 'phương tiện di chuyển dưới nước' / 'phương tiện di chuyển', làm lộ sớm ý giải thích 'tàu lặn' ở p000598 và giảm nhẹ độ lạ lẫm khiến người nghe hỏi vặn lại ở p000591."
    recommendation: "Có thể giữ nguyên để câu văn rõ nghĩa, hoặc cân nhắc chỉnh nhẹ ở bước chuốt văn thành 'xuồng nhỏ' / 'thuyền di chuyển' tại p000590–p000591 để giữ trọn hiệu ứng đối đáp dẫn tới lời giải thích rõ hơn ở p000598."
