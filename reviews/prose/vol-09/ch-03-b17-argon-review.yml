findings:
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000662"
    severity: "minor"
    category: "terminology_consistency"
    issue: "Từ chỉ chỉ huy tàu ngầm trong p000662 được dịch là 'hạm trưởng', trong khi ở các lô trước của cùng chương (như ch-03-b14, ch-03-b15) thuật ngữ tương ứng cho chỉ huy tàu ngầm và tàu khu trục được dịch là 'thuyền trưởng'."
    recommendation: "Cách dịch 'hạm trưởng' hoàn toàn chuẩn xác về mặt thuật ngữ hải quân; ở bước chuốt văn Flash hoặc khi ghép chương, điều phối viên có thể giữ nguyên hoặc đồng bộ với 'thuyền trưởng' tùy theo lựa chọn thống nhất toàn chương."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000671"
    severity: "minor"
    category: "pronouns"
    issue: "Đại từ trần thuật ngôi thứ ba quy chiếu Tanya trong lô ch-03-b17 (tại p000671, p000674, p000687) tiếp tục dùng 'nó' theo DEC-P01-001 (nhất quán với chuỗi lô ch-03-b12 đến ch-03-b16 liền trước), trong khi một số lô đầu của tập 9 dùng 'cô'."
    recommendation: "Nội bộ lô ch-03-b17 đã phân tách nhất quán giữa trần thuật ('nó') và độc thoại/tự thuật ngôi thứ nhất ('mình' / 'bọn mình' tại p000669, p000671, p000672, p000676, p000677, p000679, p000681, p000685); ở bước chuốt văn hoặc ghép chương có thể giữ nguyên theo DEC-P01-001 hoặc đồng bộ thành 'cô' nếu muốn thống nhất toàn chương 3."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000675"
    severity: "minor"
    category: "style_redundancy"
    issue: "Cụm mở đầu 'Điều gây hoang mang nhất hơn cả là' kết hợp cả hai dấu hiệu so sánh bậc nhất ('nhất' và 'hơn cả') liền nhau khiến câu hơi thừa từ."
    recommendation: "Ở bước chuốt văn Flash, có thể tinh giản thành 'Điều gây hoang mang hơn cả là' hoặc 'Điều gây hoang mang nhất là' để câu văn tự nhiên hơn."
