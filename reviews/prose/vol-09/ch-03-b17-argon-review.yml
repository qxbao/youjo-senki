  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000684"
    choices:
      - "Phân biệt mục tiêu chiến lược & phủ định: giữ 'Chiến lược đánh chặn của Hải quân Đế quốc Nhật Bản, dù thường bị chỉ trích là giáo điều', sự đối lập 'nhằm làm suy yếu lực lượng hải quân của đối phương chứ không phải tiêu diệt hoàn toàn bất cứ thứ gì' và phủ định 'Họ chưa bao giờ tuyên bố rằng mình sẽ giành lấy quyền kiểm soát tuyệt đối trên mặt biển.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000685"
    choices:
      - "Câu điều kiện & tình thái: giữ 'Bộ Tổng tham mưu', đại từ 'bọn mình', thuật ngữ 'tìm và diệt lực lượng hải quân địch' và câu lửng 'Hoặc có lẽ là không.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000686"
    choices:
      - "Nhận định chuyên môn & câu điều kiện: giữ 'Các sĩ quan tham mưu vốn chuyên môn hóa quá mức vào tác chiến trên bộ', 'những gã lục quân cực kỳ thông minh' và hệ quả khi 'đánh đồng sức mạnh hải quân với sức mạnh lục quân'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000687"
    choices:
      - "Nhấn mạnh Markdown, đại từ & quan hệ nhượng bộ: chỉ bọc '*Các người bị ngu à?*' bằng dấu sao theo DEC-P01-002, giữ đại từ 'nó' và ý 'dù nói ra điều đó thì thật xấc xược, nhưng nó vẫn không sao tránh khỏi cảm giác bất mãn'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000688"
    choices:
      - "Nhận định kết lô: giữ 'Đất liền và biển cả tuy nối liền với nhau, nhưng lại là hai thế giới hoàn toàn khác biệt.'."
