  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000141"
    choices:
      - "Đại từ nội tâm tập thể (Chúng mình) và nhận định về nghi thức xã giao: Những nghi thức xã giao thực ra lại khá hữu ích giúp việc giao tiếp với những người lần đầu gặp mặt trở nên dễ dàng hơn."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000142"
    choices:
      - "Xưng hô trong thoại của Tanya với sĩ quan trực ban (Chúng tôi / tôi - anh) và phủ định sự chắc chắn tuyệt đối: không cho kẻ biến thái nào bám đuôi mình, nhưng tôi cũng không dám khẳng định chắc chắn là không có tên nào"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000143"
    choices:
      - "Phân biệt đại từ cá nhân (mình) và đại từ chung (chúng ta) trong nội tâm cùng chức danh: Viên sĩ quan trực ban gật đầu tỏ ý thấu hiểu."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000144"
    choices:
      - "Xưng hô lịch sự của sĩ quan trực ban với đoàn khách (chúng tôi - các vị): Mời các vị lên tàu. Dù vậy, nếu các vị muốn hút một điếu thuốc hay hít thở chút không khí trong lành bên ngoài thì cứ tự nhiên."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000145"
    choices:
      - "Sự ngạc nhiên của Tanya (Tôi - chúng tôi) trước việc tàu chưa lập tức rời đi: “…Ồ? Tôi cứ đinh ninh là tàu sẽ khởi hành ngay khi chúng tôi vừa lên tàu chứ.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000146"
    choices:
      - "Ẩn dụ về sự nguy hiểm khi tàu ngầm nổi trên mặt nước và câu hỏi nội tâm: Một chiếc tàu ngầm nổi trên mặt nước chẳng khác nào bia tập bắn. Dù màn đêm đang dần buông xuống, liệu cứ lềnh bềnh trên mặt nước khi lực lượng địch có thể đang rình mò quanh đây có thực sự là ý hay không?"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000147"
    choices:
      - "Cách gọi cấp bậc Trung tá (thưa Trung tá - cô - ạ) của sĩ quan trực ban và thông báo từ thuyền trưởng: chúng tôi nhận được lệnh phải di chuyển nổi trên mặt nước / thuyền trưởng có yêu cầu được gặp cô ngay lập tức ạ"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000148"
    choices:
      - "Phản ứng buột miệng rồi lập tức lấy lại vẻ điềm tĩnh của Tanya: “Cái gì? Ờ, ý tôi là, đã rõ.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000149"
    choices:
      - "Đại từ chỉ sĩ quan trực ban (Anh ta) và đại từ khái quát (bạn) trong suy nghĩ về trách nhiệm người truyền tin: Anh ta đã hoàn thành bổn phận của một người truyền tin. Dù bạn có thích thông điệp đó hay không, bạn vẫn phải ghi nhận rằng người ta đã làm tròn phận sự của mình."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000150"
    choices:
      - "Xưng hô của Tanya (Tôi) và đại từ chỉ thuyền trưởng (ông ấy): “Cảm ơn. Tôi sẽ xuống chào ông ấy ngay.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000151"
    choices:
      - "Trần thuật ngôi thứ ba gắn với tên riêng Tanya và điều kiện an toàn để ngủ: Tanya lịch sự bước vào chiếc tàu ngầm rồi chợt khựng lại / muốn ngủ yên giấc thì cần có người đứng gác"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000152"
    choices:
      - "Khẳng định nguyên tắc cảnh giới ban đêm: Ngay cả một đêm bình thường cũng đòi hỏi phải có người canh gác để đảm bảo an toàn. Sự an toàn là điều kiện tiên quyết tối thiểu nhất."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000153"
    choices:
      - "Xưng hô của Tanya với phía tàu ngầm (tôi - các anh) và thuật ngữ: đứng gác bằng dò tìm ma pháp"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000154"
    choices:
      - "Phản hồi ngập ngừng của sĩ quan hải quân: “À thì, việc quan sát trên biển thường được thực hiện theo phương thức của hải quân…”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000155"
    choices:
      - "Xưng hô trong thoại (chúng tôi - Các anh - họ): “Tất nhiên, chúng tôi hiểu điều đó. Các anh cứ thoải mái sử dụng họ sao cho tiện là được. Họ sẽ không làm vướng chân đâu.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000156"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-182); giữ so sánh năng lực cảnh giới đêm và thuật ngữ: những người lính cảnh giới kỳ cựu / một người lính cảnh giới thông thường trên tàu ngầm / một hải đội phóng lôi tiến công vốn được huấn luyện chuyên biệt cho tác chiến đêm"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000157"
    choices:
      - "Thuật ngữ và mức độ ước lượng khả năng: các pháp sư trên không có kinh nghiệm tác chiến đêm từ mặt trận phía đông có lẽ sẽ đảm đương khá tốt một phần việc gần giống như phát hiện kẻ địch đang tiếp cận"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000158"
    choices:
      - "Xưng hô trong thoại (chúng ta - các anh - tôi) và giả định lặn khẩn cấp: lặn khẩn cấp / đá thẳng họ xuống biển / được huấn luyện lao xuống chiến hào rồi, nên tôi không nghĩ họ lại lề mề đến mức ấy đâu"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000159"
    choices:
      - "Lời xác nhận và cảm kích của sĩ quan trực ban với Tanya (Cô - chúng tôi): “Cô chắc chứ? Được hỗ trợ thế thì chúng tôi thực sự rất cảm kích.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000160"
    choices:
      - "Lời đáp khách sáo của Tanya (chúng tôi - anh): “Vì chúng tôi là khách đi nhờ nên phụ giúp một tay cũng là lẽ tự nhiên thôi. Xin anh đừng bận tâm.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000161"
    choices:
      - "Trần thuật gắn với tên riêng Tanya và phiên hiệu rút gọn Tiểu đoàn 203: Sự hợp tác. Một hành vi tuyệt vời của con người dựa trên lợi ích chung. Tanya muốn ngủ yên giấc, còn chiếc tàu ngầm muốn hành trình an toàn. Lẽ đương nhiên là Tiểu đoàn 203 sẽ ngỏ ý phụ giúp."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000162"
    choices:
      - "Mệnh lệnh của Tanya giao cho Thiếu tá Weiss (tôi - anh - họ): Thiếu tá Weiss, tôi giao nhiệm vụ hỗ trợ thủy thủ đoàn canh gác lại cho anh / Chia làm ba ca chắc là đủ / coi mệnh lệnh của họ như mệnh lệnh của chính tôi"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000163"
    choices:
      - "Lời đáp nhận lệnh của Thiếu tá Weiss với Trung tá Tanya: “Vâng, thưa Trung tá! Đã rõ. Tôi sẽ làm bất cứ việc gì cần thiết ạ.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000164"
    choices:
      - "Nhận xét về sự sung sức của Weiss (anh ta) sau trận đánh lớn: Một câu trả lời tràn đầy năng lượng. Thật không ngờ anh ta vẫn còn sung sức và hăng hái đến thế sau trận đánh lớn vừa rồi."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000165"
    choices:
      - "Đại từ nội tâm tập thể (chúng mình) và thuật ngữ: Đế quốc / Bộ Tổng tham mưu kính mến cứ bảo rằng không thể kiếm được quân bổ sung cho chúng mình"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000166"
    choices:
      - "Lời nhắc cảnh báo khi lặn khẩn cấp: “Khi lặn khẩn cấp là các anh có thể bị bỏ lại đấy nhé!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000167"
    choices:
      - "Lời đáp của Weiss với Tanya (chúng tôi / tôi - thưa Trung tá): “Không sao đâu—chúng tôi sẽ không trễ đâu. Dù sao thì tôi xin phép đi hỗ trợ các thủy thủ hải quân đây, thưa Trung tá.”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000168"
    choices:
      - "Đại từ nội tâm (Mình) theo DEC-P01-001: Mình gật đầu rồi chui xuống cửa nắp."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000169"
    choices:
      - "Đại từ nội tâm (mình), phủ định kép giữ đúng nghĩa (chẳng hề xa lạ) và miêu tả mùi trong tàu ngầm: dù vẫn chưa quen nổi, nhưng thứ mùi này chẳng hề xa lạ chút nào. Mùi dầu máy, mồ hôi và một thứ gì đó tù đọng."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000170"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-183); giữ đại từ nội tâm (mình) và thuật ngữ: mặt trận phía đông / đám binh sĩ dày dạn dưới quyền mình / những người đàn ông trưởng thành cao lớn lại còn thường xuyên cụng đầu vào đủ thứ bên trong tàu ngầm"
