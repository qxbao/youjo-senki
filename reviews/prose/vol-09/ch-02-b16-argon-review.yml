locked_choices:
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000622"
    choices:
      - "Đại từ trần thuật & sắc thái: giữ đại từ 'anh' cho Uger và cụm động từ biểu cảm 'yếu ớt dứt ra từng lời từ sâu trong lồng ngực'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000623"
    choices:
      - "Quân hàm, xưng hô & thuật ngữ: giữ cách gọi 'Trung tá Degurechaff', cặp đại từ hội thoại 'tôi' của Uger, thuật ngữ 'sĩ quan tham mưu quái vật' và thế đối lập giữa quá khứ từng muốn trở thành quái vật với thực tại 'vượt quá sức tôi rồi'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000624"
    choices:
      - "Câu hỏi nội tâm: giữ nguyên độ mở và sắc thái ngạc nhiên 'Một lời tuyên bố về nhân tính của anh ư?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000625"
    choices:
      - "Điểm nhìn nội tâm & thuật ngữ: giữ đại từ tự quy chiếu 'mình' theo DEC-P01-001, thuật ngữ 'trường đại học quân sự', 'người bạn đồng khóa của mình' và cụm 'hội tụ đủ mọi phẩm chất của một công dân hiện đại'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000626"
    choices:
      - "Xưng hô, điểm nhìn & tình thái: giữ tên 'Tanya' trong câu dẫn trần thuật, cặp xưng hô 'tôi' – 'anh' lịch sự của Tanya với Uger, thuật ngữ 'sĩ quan tham mưu xuất sắc' và tình thái phủ định khích lệ 'chắc chắn chẳng có lý do gì phải nản lòng cả!'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000627"
    choices:
      - "Thuật ngữ & phủ định: giữ 'người giám sát phân phối và hậu cần', 'thương lượng ở hậu phương', 'các sĩ quan tham mưu' và phủ định 'chẳng liên quan gì đến những việc mà các sĩ quan tham mưu thực sự phải làm cả'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000628"
    choices:
      - "Đại từ trần thuật & phủ định: giữ đại từ 'Anh', sắc thái 'yếu ớt tự giễu mình' và mệnh đề phủ định 'chẳng thể giúp ích được gì trên chiến trường'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000629"
    choices:
      - "Thuật ngữ & giọng tự nhận thức: giữ 'kẻ làm tác chiến hạng ba', 'người chỉ huy' và nhận định 'Dù tốt hay xấu thì ít nhất tôi cũng có thể nhìn nhận bản thân một cách khách quan'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000630"
    choices:
      - "Tên nhân vật & đại từ nội tâm: giữ 'Uger', 'lời tự đánh giá khó tin này bằng giọng dửng dưng' và đại từ nội tâm 'mình' trong 'vượt quá khả năng thấu hiểu của mình'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000631"
    choices:
      - "Câu hỏi nội tâm: giữ câu hỏi biểu cảm 'Rốt cuộc chuyện quái gì đang diễn ra thế này?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000632"
    choices:
      - "Xưng hô & thuật ngữ: giữ cặp đại từ 'tôi' – 'cô' của Uger với Tanya, thuật ngữ 'hậu phương' và câu trần thuật 'Đầu Uger cúi thấp xuống'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000633"
    choices:
      - "Địa danh, điểm nhìn kép & suy luận điều kiện: giữ 'quán cà phê Zolka', đại từ 'chúng tôi' cho hai người ở chốn công cộng, sự chuyển đổi điểm nhìn đặc trưng từ 'chỗ Tanya đang ngồi' sang đại từ nội tâm 'mình' theo DEC-P01-001, và cấu trúc điều kiện 'Nếu anh chẳng màng... ắt hẳn anh đang rất nghiêm túc'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000634"
    choices:
      - "Điểm nhìn kép & giả định điều kiện: giữ sự song hành giữa góc nhìn thứ ba ('Tanya', 'cô') và góc nhìn nội tâm ('mình'), cùng cụm 'một câu đáp lại ôn hòa'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000635"
    choices:
      - "Xưng hô & sắc thái xã giao: giữ cặp đại từ 'tôi' – 'anh' và lối nói lịch sự 'Xin thứ lỗi cho tôi nói thẳng… hồi đó, tôi chỉ đơn thuần đưa ra lời khuyên cho anh với tư cách một người bạn đồng khóa có lòng quan tâm mà thôi'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000636"
    choices:
      - "Xưng hô & sắc thái biểu cảm: giữ cặp đại từ 'tôi' – 'cô' của Uger và câu 'Dù vậy đi nữa, tôi vẫn cảm ơn cô từ tận đáy lòng'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000637"
    choices:
      - "Điểm nhìn kép & thuật ngữ: giữ câu hỏi nội tâm 'phải chăng đây là niềm vui của một người dân thường?', thuật ngữ 'tiền tuyến', đại từ nội tâm 'mình' và góc nhìn thứ ba 'trong cổ họng Tanya' theo đúng cấu trúc bản gốc."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000638"
    choices:
      - "Xưng hô, phủ định & quan hệ nhân quả: giữ cặp đại từ 'tôi' – 'cô', nhận định phủ định 'cá nhân cô không phải là người xấu' và mệnh đề nhấn mạnh nguyên nhân 'đó chính xác là lý do vì sao tôi lại nói với cô những điều này'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000639"
    choices:
      - "Giọng thoại lịch sự: giữ câu đáp khuôn mẫu 'Tôi xin trân trọng thiện ý đó'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000640"
    choices:
      - "Quân hàm & mệnh lệnh phủ định: giữ câu khuyên '…Đừng nói năng khách sáo như thế, Trung tá'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000641"
    choices:
      - "Giọng thoại: giữ câu trả lời ngắn 'Đó chỉ là bản tính của tôi thôi'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000642"
    choices:
      - "Đại từ nội tâm, phủ định & định danh quốc gia: giữ đại từ 'Mình', phủ định 'đâu có ngu ngốc đến mức mất cảnh giác rồi vứt bỏ phép xã giao với bạn bè đồng nghiệp' và 'Đế quốc'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000643"
    choices:
      - "Xưng hô, giả định phản thực tế & câu hỏi phủ định: giữ cặp đại từ 'tôi' – 'cô', giả định quá khứ 'Nếu không hiểu rõ cô từ trước, hẳn tôi đã liệt cô vào hạng cầm thú máu lạnh rồi' và câu hỏi phủ định 'Cô không lo người ta sẽ hiểu lầm về mình sao?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000644"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: giữ 'Uger', 'công dân điển hình của Đế quốc' và chỉ bọc duy nhất cụm '*kẻ thích lo chuyện bao đồng*' bằng dấu sao theo đúng thẻ em của nguồn (DEC-P01-002)."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000645"
    choices:
      - "Điểm nhìn & giọng thoại: giữ tên 'Tanya' ở câu dẫn và đại từ 'tôi' / 'mình' trong câu thoại tự hào về các mối quan hệ."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000646"
    choices:
      - "Xưng hô & lời khuyên: giữ tiếng cười 'Ha-ha-ha', nhận định 'Người trong cuộc bao giờ cũng là người nhận ra muộn nhất' và cách gọi 'cô... Degurechaff'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000647"
    choices:
      - "Cấu trúc liệt kê trong thoại: giữ 'những cấp trên tốt, những người chiến hữu đáng tin cậy, và cả những cấp dưới giỏi giang' cùng đại từ 'Tôi'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000648"
    choices:
      - "Đại từ nội tâm, ẩn dụ & câu hỏi tu từ: giữ đại từ 'mình', chuỗi liệt kê tương ứng 'Những vị sếp có năng lực, một người bạn đồng khóa cũ giúp cuộc sống của mình dễ thở hơn, cùng tấm lá chắn thịt đáng tin cậy của mình' và câu hỏi tu từ cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000649"
    choices:
      - "Đại từ nội tâm, thuật ngữ & tình thái: giữ đại từ 'Mình', thuật ngữ 'Lục quân Đế quốc đang ngày một rệu rã nhanh chóng này' và tình thái suy đoán 'có lẽ hiếm tìm được một sĩ quan nào may mắn như mình'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000650"
    choices:
      - "Xưng hô & tình thái nhượng bộ: giữ cặp đại từ 'tôi' – 'cô' và sắc thái dè dặt 'Chà, tôi cho là cô cứ việc giữ niềm tự hào đó nếu muốn'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000651"
    choices:
      - "Cấu trúc điệp & giọng thoại: giữ điệp ngữ 'Tự do muôn năm. Tình bạn muôn năm.' và đại từ 'Tôi'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000652"
    choices:
      - "Trần thuật & chuyển tông giọng: giữ chi tiết 'nụ cười của anh hơi tối đi đôi chút', sự chuyển giọng tinh tế và cụm 'bàn bạc kín với cô…'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000653"
    choices:
      - "Câu hỏi trong thoại: giữ câu hỏi ngắn 'Chuyện đó là gì vậy?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000654"
    choices:
      - "Đại từ nội tâm: giữ 'Mình nhận ra tín hiệu ngầm không lời ấy'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000655"
    choices:
      - "Đại từ khái quát & quan hệ thời gian: giữ 'một mối quan hệ không chính thức', đại từ khái quát 'bạn' trong mệnh đề bình luận chung và tương phản thời gian giữa lúc bản tin phát sóng với lúc 'những người nắm rõ nội tình đã nghe được kết cục từ lâu rồi'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000656"
    choices:
      - "Quan hệ điều kiện duy nhất: giữ cấu trúc 'cách duy nhất để nắm bắt tình hình biến động và thay đổi khôn lường là khai thác thông tin từ những người trong cuộc'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000657"
    choices:
      - "Điểm nhìn nội tâm & hô ngữ: giữ đại từ tự quy chiếu 'mình' ở câu tự nhủ đầu và cặp xưng hô 'Anh' – 'tôi' kèm hô ngữ 'Uger ạ' khi Tanya trò chuyện thầm với Uger trong đầu."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000658"
    choices:
      - "Thoại ngắn: giữ 'Tôi có tin xấu đây'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000659"
    choices:
      - "Điểm nhìn kép & câu hỏi suy đoán: giữ câu hỏi nội tâm với đại từ 'anh' – 'mình' ('Có lẽ đó là lý do vì sao anh lại đưa ra những lời cảnh báo vòng vo này cho mình chăng?') và câu trần thuật góc nhìn thứ ba với tên 'Tanya'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000660"
    choices:
      - "Cụm từ gạch nối ẩn dụ & xưng hô: giữ cụm danh từ ghép có gạch nối 'Bữa tiệc hãy-làm-bạn-lại-nhé', cặp đại từ 'tôi' – 'cô' và câu hỏi 'Cô có ấn tượng gì không?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000661"
    choices:
      - "Câu hỏi nội tâm liệt kê: giữ 'Người bạn, bữa tiệc, và… làm hòa với ai đó ư?'."
  - segment_id: "YS-LN09/Text/chapter006.xhtml/p000662"
    choices:
      - "Đại từ nội tâm, tình thái suy đoán & thuật ngữ: giữ đại từ 'mình' – 'anh', tình thái 'mình đoán anh đang ám chỉ...' và cụm 'các cuộc đàm phán hòa bình thông qua Ildoa'."
