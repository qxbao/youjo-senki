    locked: "Độc thoại nội tâm: giữ đại từ 'Bọn mình' – 'bọn mình', tên riêng 'Ildoa' và mệnh lệnh 'cho Ildoa thấy là bọn mình làm thật'."
  - segment_id: "YS-LN09/Text/chapter012.xhtml/p000067"
    locked: "Độc thoại nội tâm & triết lý chính trị: giữ sự đối lập giữa nhận định thường tình về bạo lực với 'tùy thuộc vào thời điểm và hoàn cảnh', so sánh 'Đối với một cường quốc tham chiến, thà khiến kẻ khác khiếp sợ còn hơn là bị xem thường.' và thuật ngữ 'chủ nghĩa Machiavelli'."
  - segment_id: "YS-LN09/Text/chapter012.xhtml/p000068"
    locked: "Thoại độc bạch kết chương & dấu câu: giữ dấu chấm lửng mở đầu và câu cảm thán '“…Một sợi dây xích quả là thứ chẳng vừa đâu.”'."
