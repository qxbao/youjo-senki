findings:
  - segment_id: "YS-LN09/Text/chapter012.xhtml/p000038"
    severity: "minor"
    category: "pronouns"
    issue: "Đại từ trần thuật ngôi thứ ba quy chiếu Tanya tại p000038 tiếp tục dùng 'nó' theo DEC-P01-001 (nhất quán với chuỗi lô ch-03-b12 đến ch-03-b18 liền trước), trong khi các lô đầu của chương 3 (ch-03-b01 đến ch-03-b10) dùng 'cô'."
    recommendation: "Nội bộ lô ch-03-b19 đã phân tách nhất quán giữa trần thuật ngôi thứ ba ('nó' / 'Tanya'), độc thoại nội tâm ngôi thứ nhất ('mình' / 'bọn mình') và thoại công vụ ('tôi' / 'chúng tôi' / 'chúng ta'). Ở bước chuốt văn hoặc ghép chương có thể giữ nguyên theo DEC-P01-001 hoặc đồng bộ thành 'cô' nếu muốn thống nhất toàn chương 3."
  - segment_id: "YS-LN09/Text/chapter012.xhtml/p000044"
    severity: "minor"
    category: "meaning_precision"
    issue: "Cụm 'màn sương mù chiến tranh đầy phiền toái ấy' thêm từ 'chiến tranh' để giải thích rõ ẩn dụ trong khi nguyên văn chỉ viết về màn sương mù phiền toái (tiếp nối ngay sau tên riêng Clausewitz ở p000043)."
    recommendation: "Theo canon/style-guide.md (không tự thêm giải thích), ở bước chuốt văn Flash có thể rút gọn thành 'màn sương mù đầy phiền toái ấy' mà người đọc vẫn hiểu rõ ẩn dụ quân sự nhờ câu nhắc tới Clausewitz ngay trước đó."
