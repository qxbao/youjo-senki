    locked: "Thoại của Barchet, câu điều kiện giả định & thuật ngữ: giữ đại từ 'tôi', giả định 'Nếu trong báo cáo có nhắc tới vài chiếc tàu chở dầu thì họa may tôi còn bảo là họ nhìn nhầm', phủ định 'chứ tôi chẳng nghĩ có ai lại đi nhầm lẫn giữa một tàu chiến lớn với tàu sân bay cả', và câu kết có dấu chấm lửng 'Mà nếu không có chiếc nào thật thì với tôi đó quả là tin tuyệt vời…'."
