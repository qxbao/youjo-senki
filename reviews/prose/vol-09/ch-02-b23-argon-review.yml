findings:
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000190"
    severity: "moderate"
    category: "meaning_and_syntax"
    issue: "Bản dịch gộp danh ngữ 'memory loss' vào làm tân ngữ của mệnh đề đầu và tự đổi động từ thành 'làm phai mờ ký ức', khiến đại từ 'nó' ('it') ở vế sau quy chiếu nhầm về 'Thời gian' thay vì 'memory loss'."
    evidence: "Trong cấu trúc nguyên bản, vế một nêu vai trò của 'Time' như liều thuốc xoa dịu nỗi đau ('relieves pain'), còn sau liên từ 'and' là chủ ngữ tách trái 'memory loss' được đại từ 'it' sau dấu gạch ngang tiếp chỉ ('memory loss—it seems to be a tonic for the troubled mind'). Đoạn p000191 ngay sau đó tiếp tục triển khai ý con người có khả năng quên đi những điều bất tiện."
    recommendation: "Tách đúng hai chủ thể song hành: '“Thời gian là liều thuốc xoa dịu nỗi đau, còn sự lãng quên—nó dường như là một phương thuốc bổ cho tâm trí đang rối bời.”' (hoặc dùng 'chứng mất trí nhớ / sự quên lãng' làm chủ ngữ của vế sau)."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000184"
    severity: "minor"
    category: "orthography_and_terminology"
    issue: "Cách viết 'Chiến tranh Xô – viết – Afghanistan' dùng dấu gạch ngang có khoảng trắng giữa hai âm tiết của từ ghép 'Xô-viết', làm ngang hàng với dấu nối liên danh giữa hai bên tham chiến."
    evidence: "Thuật ngữ nguồn 'Soviet-Afghan War' ghép hai định danh 'Soviet' và 'Afghan'; trong tiếng Việt cần phân biệt gạch nối nội từ ('Xô-viết' hoặc viết hoa 'Xô Viết' / 'Liên Xô') với dấu gạch ngang nối hai chủ thể."
    recommendation: "Sửa thành 'Chiến tranh Xô-viết – Afghanistan' (hoặc 'Chiến tranh Liên Xô – Afghanistan')."
