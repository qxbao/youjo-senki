  - segment_id: YS-LN09/Text/chapter016.xhtml/p000327
    choices:
      - "Câu cảm thán bàng hoàng: “…Cái quái gì thế này?”"
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000328
    choices:
      - "Phủ định và câu hỏi tự vấn: Mình vốn chẳng hề có triệu chứng tự cảm nhận nào, nhưng chẳng lẽ chiến trường rốt cuộc đã đầu độc mình rồi sao?"
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000329
    choices:
      - "Điều kiện phủ định và tình thái khả năng: Nếu chúng ta không sớm giải quyết cho xong cuộc chiến này, có khi mình sẽ phát điên mất thật."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000330
    choices:
      - "Đối lập thể xác và tâm trí trong nội tâm: Nếu không cẩn thận, thể xác mình có thể sống sót qua cuộc chiến nhưng tâm trí thì không. Mình cần cả hai cùng khỏe mạnh."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000331
    choices:
      - "Định danh và thành ngữ tương đương: mất trí / Being X / đặt cái cày trước con trâu"
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000332
    choices:
      - "Mệnh đề khẳng định ngắn gọn: Tự do đòi hỏi cả một tâm trí lẫn một cơ thể lành lặn."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000333
