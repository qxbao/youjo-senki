  - segment_id: YS-LN09/Text/chapter016.xhtml/p000337
    choices:
      - "Chuyển điểm nhìn sang trần thuật ngôi thứ ba khép lại chương: Trung tá Tanya von Degurechaff lặng lẽ tuyên bố quyết tâm từ tận đáy lòng của cô."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000338
    choices:
      - "Lời tuyên bố kết chương: “Chúng ta phải chiến thắng. Nhất định phải thắng. Bằng bất cứ giá nào.”"
