  - segment_id: YS-LN09/Text/chapter016.xhtml/p000334
    choices:
      - "Cấu trúc phủ định thể hiện ý chí: Mình không thể chịu khuất phục trước cái thế giới điên rồ, mục nát và kỳ quái tột độ này được."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000335
    choices:
      - "Điệp cấu trúc khẳng định ý chí: Mình sẽ sống—mình sẽ sống và ăn mừng chiến thắng của lý trí."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000336
    choices:
