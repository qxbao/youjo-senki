      - "Liên tưởng tiền kiếp và câu hỏi giả định phủ định: nhân viên công sở làm công ăn lương / âu phục và cà vạt / nếu ngay cả một chiếc cà vạt mà mình còn không thắt nổi, liệu mình có thể đi làm hằng ngày được không…?"
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000326
    choices:
