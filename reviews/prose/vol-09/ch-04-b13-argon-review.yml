  - segment_id: YS-LN09/Text/chapter016.xhtml/p000322
    choices:
      - "Giả định trái thực tế kèm phủ định ở mệnh đề điều kiện: Nếu đây không phải là một chiếc tàu ngầm chật chội và mình không ở vào cái cương vị đòi hỏi phải giữ gìn thanh danh cùng hình ảnh trước mặt binh lính, hẳn mình đã mặc kệ thể diện mà tức tốc chạy ngay đến phòng khám sức khỏe tâm thần gần nhất rồi."
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000323
    choices:
      - "Nhấn mạnh Markdown toàn câu khớp thẻ in nghiêng nguồn: *Chuyện này lẽ ra không nên xảy ra mới phải.*"
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000324
    choices:
      - "Lời tự hỏi lẩm bẩm của Tanya: “…Mình đã lún sâu đến mức đó rồi sao?”"
  - segment_id: YS-LN09/Text/chapter016.xhtml/p000325
