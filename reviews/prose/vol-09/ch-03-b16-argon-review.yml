findings:
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000625"
    severity: "minor"
    category: "pronouns"
    issue: "Đại từ trần thuật ngôi thứ ba quy chiếu Tanya trong lô ch-03-b16 (tại p000625, p000628, p000629, p000631, p000632, p000633, p000634, p000650) tiếp tục dùng 'nó' theo DEC-P01-001 (nhất quán với các lô ch-03-b12 đến ch-03-b15 liền trước), trong khi một số lô đầu của tập 9 dùng 'cô'."
    recommendation: "Nội bộ lô ch-03-b16 đã nhất quán hoàn toàn giữa trần thuật ('nó') và độc thoại nội tâm ('mình' tại p000622, p000647, p000649); ở bước chuốt văn Flash hoặc khi ghép chương, điều phối viên có thể giữ nguyên theo DEC-P01-001 hoặc đồng bộ thành 'cô' nếu muốn thống nhất toàn chương 3."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000626"
    severity: "minor"
    category: "style_repetition"
    issue: "Trong cụm 'gây ra hệ lụy dây chuyền nghiêm trọng lên các dây chuyền sản xuất sẵn có của họ', từ 'dây chuyền' bị lặp lại hai lần liên tiếp ở hai nghĩa khác nhau (hiệu ứng kéo theo và dây chuyền sản xuất)."
    recommendation: "Ở bước chuốt văn Flash, có thể cân nhắc đổi cụm đầu thành 'tác động kéo theo nghiêm trọng' hoặc 'hệ lụy kéo theo nghiêm trọng' để câu văn mượt hơn mà vẫn giữ nguyên nghĩa."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000648"
    severity: "minor"
    category: "style_nuance"
    issue: "Phần dẫn nhập dịch sát số lượng từ của bản gốc là 'Năm chữ hiện lên trong tâm trí:', nhưng câu thành ngữ tiếng Việt phía sau ('*Gieo nhân nào gặt quả nấy.*') lại gồm sáu chữ/âm tiết."
    recommendation: "Có thể giữ nguyên thành ngữ quen thuộc, hoặc ở bước chuốt văn cân nhắc rút gọn thành năm chữ nhưng vẫn giữ hình ảnh gieo hạt nối với p000649 như '*Gieo gì thì gặt nấy.*' hoặc '*Gieo nhân ắt gặt quả.*'."
