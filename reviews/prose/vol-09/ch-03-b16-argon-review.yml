    choices:
      - "Độc thoại nội tâm & ẩn dụ nhân quả: giữ đại từ tự quy chiếu 'mình' và hình ảnh 'những hạt giống mình gieo xuống quả thực đã dẫn thẳng tới tình cảnh này'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000650"
    choices:
      - "Nhấn mạnh Markdown, thuật ngữ & đại từ trần thuật: chỉ bọc '*maiali*' bằng dấu sao theo DEC-P01-002, giữ dấu chấm lửng, đại từ 'nó' và thuật ngữ 'một quả ngư lôi sống'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000651"
    choices:
      - "Nhận định kết cảnh: giữ 'Thật khó mà gọi bất cứ chuyện nào trong số này là vui vẻ được.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000652"
    choices:
      - "Tiêu đề chuyển cảnh: giữ chữ in hoa 'NGÀY 12 THÁNG 7 NĂM THỐNG NHẤT 1927, MẶT TRẬN NỘI HẢI'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000653"
    choices:
      - "Thuật ngữ hải quân & bối cảnh: giữ 'Các đơn vị tàu ngầm tại Nội hải của Hải quân Đế quốc' và 'trang bị theo cùng một tiêu chuẩn như phần còn lại của hạm đội'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000654"
    choices:
      - "Trần thuật & sắc thái mỉa mai: giữ 'số ngư lôi mà họ được cấp phát chẳng được tích sự gì cả' và 'nhắc về chuyện đó ở thì quá khứ là một tin tốt lành cho cả họ lẫn người phát triển ra loại ngư lôi ấy'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000655"
    choices:
      - "Thuật ngữ kỹ thuật ngư lôi: giữ 'bước cải tiến vượt bậc ở ngòi nổ' và ba lỗi điển hình 'bắn trúng đích trực diện bằng đạn lép, phát nổ ngay khi vừa phóng ra, và những ngòi nổ từ tính cứ thế lao vút qua thẳng hạm đội địch'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000656"
    choices:
      - "Ẩn dụ lóng & phủ định: giữ 'Mấy con lươn ấy cuối cùng đã tiến hóa thành những quả ngư lôi mà lực lượng tàu ngầm hằng mong đợi' và mệnh đề nhượng bộ 'cũng chẳng phải những quả ngư lôi trang bị tiêu chuẩn ấy đã biến thành một viên đạn bạc vạn năng'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000657"
    choices:
      - "Trần thuật đánh giá: giữ 'Chúng chỉ là thứ vũ khí tầm trung bình, chẳng có gì đặc biệt.'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000658"
    choices:
      - "Đặc tính kỹ thuật & thuật ngữ tác chiến: giữ 'ưu tiên độ tin cậy về mặt cơ khí và chạy bằng điện—một lựa chọn thiết kế xuất sắc nhằm tối ưu hiệu suất chế tạo' và mục đích 'tung vào chiến trường Nội hải đang sục sôi để phục vụ tác chiến đánh phá tàu buôn'."
  - segment_id: "YS-LN09/Text/chapter010.xhtml/p000659"
    choices:
      - "Trần thuật & điểm nhìn kết lô: giữ 'săn lùng tàu buôn', dấu chấm lửng trong 'Nhưng tình hình đang thay đổi… chỉ một chút thôi.' và góc nhìn 'những thủy thủ đoàn dày dạn kinh nghiệm'."
