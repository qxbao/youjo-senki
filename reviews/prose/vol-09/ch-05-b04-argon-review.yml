  - segment_id: YS-LN09/Text/chapter020.xhtml/p000018
    choices:
      - "Khóa đại từ trần thuật 'Ông ta', cụm 'một người lính ngoài chiến trường' (a soldier in the field) và cách gọi đúng quân hàm 'Trung tá Degurechaff' (Colonel Degurechaff)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000019
    choices:
      - "Khóa câu hỏi thẳng thừng '“Ý ngài là ăn cắp ư?”' của Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000020
    choices:
      - "Khóa đại từ trần thuật 'ông ta', chi tiết tiếng vỗ tay kêu bộp cùng nụ cười ẩn ý và cụm 'Mấy gã tham ăn phụ trách nhà bếp' (Those gluttons who run the kitchen)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000021
    choices:
      - "Khóa cấu trúc suy luận điều kiện của Tanya về mức độ thân thiết để có cá cho bữa tối."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000022
    choices:
      - "Khóa ẩn dụ 'bậc thầy của ván cờ lớn' (masters of the great game), phép so sánh 'ngon ngang ngửa, thậm chí là hơn' và đại từ 'cô'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000023
    choices:
