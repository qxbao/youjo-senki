  - segment_id: YS-LN09/Text/chapter020.xhtml/p000028
    choices:
      - "Khóa tổ chức 'Bộ Tổng tham mưu' (General Staff), quân hàm 'Trung tá Uger' (Lieutenant Colonel Uger), 'Đại tá Lergen' (Colonel Lergen) và đại từ nội tâm 'mình'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000029
    choices:
      - "Khóa cách xưng hô 'Thưa Đại tá' (Colonel) và đại từ 'cả hai chúng ta' trong lời đồng cảm giữa những người lính của Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000030
    choices:
      - "Khóa sự chuyển đổi giữa lời thoại của Tanya ('tôi') và phần dẫn thoại ngôi thứ ba ('Tanya mỉm cười nhạt với Calandro'), cùng sự đối lập giữa 'ba bữa ăn đàng hoàng' (three square meals) và 'sự lãng mạn' (romance)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000031
    choices:
      - "Khóa câu cảm thán nội tâm của Tanya nêu chuỗi ba khâu hậu cần: chuẩn bị nguyên liệu dinh dưỡng, kiếm chất đốt hâm nóng và cung cấp cho binh lính không trục trặc."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000032
    choices:
      - "Khóa các thuật ngữ 'tiền tuyến' (front lines), 'chính quốc' (home country), 'K-Brot', đại từ 'chúng ta' và hình ảnh so sánh 'phóng tàu thăm dò lên mặt trăng'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000033
    choices:
      - "Khóa đại từ thoại 'Tôi' (tự quy chiếu 'mình') và cụm 'món ngâm xốt này' (this marinade)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000034
    choices:
      - "Khóa cặp đại từ 'Cô' – 'Tôi', cụm 'một thực khách thích khám phá' (an adventurous eater) và 'người Đế quốc' (people from the Empire)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000035
    choices:
      - "Khóa cụm 'một người lính ngoài chiến trường' (a soldier in the field) đồng nhất với p000018."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000036
    choices:
      - "Khóa cặp đại từ thoại 'tôi' – 'cô' và cụm 'khẩu vị sành sỏi' (discerning palate) trong lời khen xã giao của Calandro."
