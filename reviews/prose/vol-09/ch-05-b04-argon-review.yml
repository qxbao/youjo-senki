findings:
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000002
    severity: minor
    category: meaning_nuance
    issue: "Cụm từ diễn tả việc hai đại diện quốc gia lời qua tiếng lại theo kịch bản ở p000002 đang được dịch là 'kẻ tung người hứng đúng theo kịch bản', dễ gợi sắc thái hai bên thông đồng phối hợp với nhau để diễn cho bên thứ ba xem, trong khi hai câu trước vừa xác lập lập trường đối lập giữa Ildoa (muốn giữ khoảng cách tế nhị) và Đế quốc (muốn ép Ildoa tỏ rõ thái độ đứng về phía mình)."
    evidence: "Theo canon/style-guide.md, cần giữ đúng nghĩa, sắc thái và quan hệ logic của bản gốc; ở đây Tanya và Calandro đang đại diện cho hai quốc gia có mục tiêu ngoại giao trái ngược, chỉ đối đáp/qua lại theo đúng kịch bản ngoại giao tương ứng với mức lương của mình."
    recommendation: "Đổi 'kẻ tung người hứng đúng theo kịch bản' thành 'đối đáp qua lại đúng theo kịch bản' hoặc 'lời qua tiếng lại đúng theo kịch bản'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000008
    severity: minor
    category: addition_omission
    issue: "Danh từ chỉ bánh mì ở p000008 đang được dịch thêm từ chỉ vật chứa thành 'giỏ bánh mì' ('hương thơm của giỏ bánh mì'), trong khi nguyên văn chỉ nhắc đến hương thơm của bánh mì nói chung."
    evidence: "Theo canon/style-guide.md, không tự thêm giải thích hay chi tiết không có trong nguồn."
    recommendation: "Bỏ từ 'giỏ', đổi 'hương thơm của giỏ bánh mì' thành 'hương thơm của bánh mì' (hoặc 'hương thơm của những ổ bánh mì')."
