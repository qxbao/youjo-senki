  - segment_id: YS-LN09/Text/chapter020.xhtml/p000006
    choices:
      - "Khóa lời khuyên 'Đừng vội kết luận sớm thế' và cụm 'Bữa tiệc chào mừng' (welcome banquet) trong thoại của Calandro."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000007
    choices:
