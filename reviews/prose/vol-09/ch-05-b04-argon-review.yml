  - segment_id: YS-LN09/Text/chapter020.xhtml/p000013
    choices:
      - "Khóa lời cảm ơn lịch sự '“Cảm ơn ngài.”' của Tanya."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000014
    choices:
      - "Khóa cấu trúc phủ định giảm nhẹ 'Mà cũng không phải là các món thịt bị dở đâu…', đại từ trần thuật 'ông ta' và cặp đại từ thoại 'tôi' – 'cô'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000015
    choices:
