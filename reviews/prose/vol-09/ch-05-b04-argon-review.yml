  - segment_id: YS-LN09/Text/chapter020.xhtml/p000024
    choices:
      - "Khóa câu danh ngữ nội tâm tiếp nối về nguồn cung hàng hóa ổn định và 'một mối quen biết tốt' (a good connect)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000025
    choices:
      - "Khóa câu cảm thán mang tính bề ngoài xã giao của Tanya: '“Thật đáng trách quá đi mất.”'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000026
    choices:
