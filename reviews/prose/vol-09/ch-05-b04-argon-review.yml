  - segment_id: YS-LN09/Text/chapter020.xhtml/p000016
    choices:
      - "Khóa định danh 'Calandro', đại từ 'cô' và các chi tiết 'quân cảng' (navy port), 'thu mua hải sản' (procuring seafood)."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000017
    choices:
