  - segment_id: YS-LN09/Text/chapter020.xhtml/p000011
    choices:
      - "Khóa sự phân tách đại từ: 'Tôi' trong lời thoại xã giao với 'Đại tá' (Colonel) và 'Mình' trong câu trần thuật ngôi thứ nhất ở giữa."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000012
    choices:
