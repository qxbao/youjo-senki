  - segment_id: YS-LN09/Text/chapter020.xhtml/p000009
    choices:
      - "Khóa câu hỏi lịch sự xin xem thực đơn của Tanya với đại từ 'Tôi'."
  - segment_id: YS-LN09/Text/chapter020.xhtml/p000010
    choices:
