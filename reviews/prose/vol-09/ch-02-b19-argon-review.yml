locked_choices:
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000038"
    choices:
      - "Nhấn mạnh Markdown: bọc dấu sao toàn bộ từ cảm thán nội tâm '*Kỳ lạ thật.*' theo đúng thẻ em của nguồn (DEC-P01-002)."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000039"
    choices:
      - "Phủ định, suy đoán & câu hỏi nội tâm: giữ phủ định 'lẽ ra làm gì có thứ gì bên trong', mức độ suy đoán 'nhiều khả năng nó chỉ là một cái hòm rỗng' và câu hỏi nghi vấn về sự lưu tâm tới thường dân."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000040"
    choices:
      - "Nhượng bộ & phủ định tuyệt đối: giữ cấu trúc 'còn sót lại lấy một mẩu xương để đặt vào linh cữu đã là may mắn lắm rồi' và câu kết 'Không tài nào khỏa lấp được thực tại đó đâu.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000041"
    choices:
      - "Điểm nhìn, phủ định & câu hỏi nội tâm: giữ đại từ tự quy chiếu 'mình' (DEC-P01-001), thuật ngữ 'điều lệnh mai táng tử sĩ', phủ định 'làm gì có quy định nào bắt phải khiêng linh cữu như thể nó là một gánh nặng trĩu vai đâu' và câu hỏi cuối đoạn."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000042"
    choices:
      - "Câu hỏi, suy luận & giả định phản thực tế: giữ thuật ngữ 'sĩ quan cao cấp' và mệnh đề điều kiện phản thực tế 'Nhưng nếu đúng là thế thì giữa đám đông phải có nhiều gương mặt quen thuộc hơn chứ.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000043"
    choices:
      - "Điểm nhìn tách biệt theo DEC-P01-001: giữ đại từ tự quy chiếu 'Mình' ở câu độc thoại nội tâm đầu và tên riêng 'Tanya' ở câu trần thuật thứ hai."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000044"
    choices:
      - "Nhận định tổng quát: giữ cụm 'cánh lính trơn' và cấu trúc khẳng định 'bao giờ cũng nằm ở...'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000045"
    choices:
      - "Trần thuật & quan hệ tăng tiến: giữ tên 'Tanya', đại từ 'cô' và cấu trúc 'càng nhìn họ lâu, thôi thúc muốn ngoảnh mặt đi trong cô càng lớn dần'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000046"
    choices:
      - "Cảm thán nội tâm: giữ 'Đúng là lệch nhịp hết chỗ nói!'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000047"
    choices:
      - "Điểm nhìn, phủ định & câu hỏi: giữ đại từ 'Mình', phủ định 'đâu có đòi hỏi họ phải đi đều bước kiểu ngỗng hoàn hảo không tì vết', thuật ngữ 'ở hậu phương' và nhận định 'thật khó hiểu'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000048"
    choices:
      - "Giả định phản thực tế: giữ cấu trúc điều kiện 'Nếu có một gã quan liêu quân sự hay càm ràm và tôn sùng điều lệnh có mặt ở đây, hẳn gã sẽ chẳng ngần ngại lấy một giây...'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000049"
    choices:
      - "Điểm nhìn, phủ định & thuật ngữ: giữ đại từ 'mình', các thuật ngữ 'quân quy', 'đội tiêu binh danh dự', 'Kampfgruppe Salamander' và mệnh đề phủ định rào đón ở đầu câu."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000050"
    choices:
      - "So sánh giả định: giữ 'Ngay cả một đơn vị chưa từng được huấn luyện lễ tiết bao nhiêu cũng còn khá khẩm hơn.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000051"
    choices:
      - "Thoại lẩm bẩm & trần thuật: giữ câu cảm thán '…Thật là một mớ bòng bong.' và tên 'Tanya'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000052"
    choices:
      - "Điều kiện khái quát & phủ định: giữ đại từ khái quát 'anh', nhận định 'hoàn toàn không thể chấp nhận' và cấu trúc giả định 'Trong hoàn cảnh bình thường, thật khó mà tin nổi...'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000053"
    choices:
      - "Tình thái suy đoán: giữ 'Hoặc biết đâu nó thực sự đem lại cảm giác nặng nề thật—đối với mấy gã ngấp nghé suy dinh dưỡng này thì có khi đúng là thế lắm.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000054"
    choices:
      - "Trần thuật chuyển ý: giữ tên 'Tanya' và chi tiết 'một điều khác lại lộ rõ'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000055"
    choices:
      - "Thuật ngữ, câu hỏi suy đoán & đại từ: giữ 'những người khiêng linh cữu', 'hậu phương', 'vết thương vàng', đại từ 'cô' và quan sát 'dáng vẻ hơi tập tễnh như thể bị tật ở chân'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000056"
    choices:
      - "Mô tả ngoại hình: giữ 'những chàng trai trẻ đôi má còn ửng hồng'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000057"
    choices:
      - "Thuật ngữ & đối lập nhấn mạnh: giữ 'đội tiêu binh danh dự' và vế nhấn mạnh 'nhưng hơn hết thảy, họ trẻ đến khó tin'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000058"
    choices:
      - "Tình thái & thuật ngữ: giữ đại từ 'cô', 'các học viên từ học viện sĩ quan' và 'những người lính tình nguyện ở độ tuổi giữa đến cuối niên thiếu'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000059"
    choices:
      - "Thoại độc thoại & trần thuật: giữ khái niệm 'sự méo mó', tên 'Tanya', đại từ 'Cô' và cụm 'cấp trên của cô'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000060"
    choices:
      - "Xưng hô hội thoại: giữ đại từ 'cô' khi Rudersdorf nói với Tanya."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000061"
    choices:
      - "Đại từ trần thuật: giữ đại từ 'ông' (Rudersdorf), 'mình' (tự quy chiếu về Tanya) và tên 'Tanya'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000062"
    choices:
      - "Thoại đáp lễ phép: giữ 'Vâng.' khi Tanya đáp lời cấp trên."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000063"
    choices:
      - "Xưng hô, tên riêng & hành động: giữ cặp đại từ 'cô' – 'chúng ta', tên 'Rudersdorf', hành động 'ngồi xổm xuống và thì thầm' cùng lời nhận xét 'Kẻ ốm yếu và người non trẻ phải đi khiêng quan tài. Thật tệ hại.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000064"
    choices:
      - "Điểm nhìn, thuật ngữ & đại từ: giữ 'nguồn nhân lực đã cạn kiệt', tên 'Tanya', đại từ 'cô', tên 'Rudersdorf' và đại từ 'Ông'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000065"
    choices:
      - "Xưng hô, định danh & chỉ dẫn: giữ 'Đế quốc', đại từ 'chúng ta', 'Ông', tên 'Tanya' và đại từ 'cô' trong lời dặn 'Hôm nay, cô hãy nhớ nhìn thật kỹ gương mặt của mọi người.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000066"
    choices:
      - "Trần thuật & câu hỏi nội tâm: giữ đại từ 'cô', chi tiết 'hàng dài những gương mặt đẫm vẻ đau thương' và hai câu hỏi phỏng đoán liên tiếp."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000067"
    choices:
      - "Suy luận tất yếu & nhận định chung: giữ 'đoàn đưa tang', 'người quá cố' và nhận định 'Cái chết của một người thân cận bao giờ cũng gây đau đớn tột cùng.'."
  - segment_id: "YS-LN09/Text/chapter008.xhtml/p000068"
    choices:
      - "Mô tả không khí & kết luận khẳng định: giữ hình ảnh 'Bầu không khí tang thương trở nên nặng nề đặc quánh', 'tiếng nức nở nghẹn ngào khi dòng nước mắt tuôn trào' và câu kết 'Đây không lẫn vào đâu được chính là một đám rước tang.'."
