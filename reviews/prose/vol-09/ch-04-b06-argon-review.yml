  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000006"
    choices:
      - "Tình thái so sánh giả định trong trần thuật: Đúng lúc ai đó vừa buột miệng thốt lên câu ấy như thể đang nguyền rủa trời cao."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000007"
    choices:
      - "Điểm nhìn phía Khối Thịnh vượng chung gọi quân Đế quốc và quan hệ chuyển ý đột ngột: Chúng đang ở ngay đó / đám hung đồ Đế quốc lại tản ra tứ phía, đội hình của chúng rơi vào cảnh rối loạn"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000008"
    choices:
      - "Miêu tả cảnh tượng chuyển biến tức thời: Chỉ một thoáng sau, cả thế giới chìm ngập trong ánh sáng chói lòa."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000009"
    choices:
      - "Ẩn dụ thần chết nối tiếp từ batch trước và sắc thái giải thoát bất ngờ: Bóng dáng thần chết hiện lên từ màn vũ đạo được dàn dựng tỉ mỉ kia đã tan tành / cái chết tưởng chừng không tài nào tránh khỏi bỗng chốc bị thổi bay mất dạng"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000010"
    choices:
      - "Giữ nguyên đối tượng và độ mở của hai câu hỏi nội tâm liên tiếp: Quyền năng của Chúa ư? Phải chăng đó là một phép màu?"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000011"
    choices:
      - "Nhịp phủ định dứt khoát ba lần: Không, không, không phải."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000012"
    choices:
      - "Tiếng reo báo tin trong thoại và thuật ngữ hải quân: “Quân tiếp viện! Là quân tiếp viện từ hạm đội chủ lực!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000013"
    choices:
      - "Thuật ngữ chức danh, ma pháp và đơn vị: sĩ quan thông tin / cơn mưa thuật thức bắn tỉa quang học / đơn vị pháp sư trên không của Đế quốc"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000014"
    choices:
      - "Lời reo mừng ngắn trong thoại: “Họ đến rồi!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000015"
    choices:
      - "Lời reo mừng thoát chết trong thoại: “Chúng ta được cứu rồi!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000016"
    choices:
      - "Câu cảm thán tôn giáo trong thoại: “Ôi lạy Chúa!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000017"
    choices:
      - "Tình thái cầu chúc trong lời kể: Cầu mong tin tốt lành lúc nào cũng được như vậy."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000018"
    choices:
      - "Cấu trúc so sánh cấp độ cảm xúc: Đó không hẳn là niềm vui dâng trào mà giống một sự bùng nổ cảm xúc hơn. Tất cả những người còn sống sót đều phát cuồng lên trước cảnh tượng quân tiếp viện xuất hiện."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000019"
    choices:
      - "Cấu trúc phủ định – khẳng định và thuật ngữ: Không phải kẻ thù mà là đồng minh! Các pháp sư trên không của quân đồng minh đã tới chi viện cho họ!"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000020"
    choices:
      - "Đối lập thái độ trước – sau và đại từ quy chiếu về Chúa: những người thủy thủ này / Chúa trên trời / ca ngợi vinh quang của ngài như thể vừa được tái sinh"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000021"
    choices:
      - "Câu hỏi tu từ mang giọng điệu mỉa mai nhẹ nhàng và định danh quốc gia: Mà như thế thì có gì sai nào? Đó đều là những giá trị hoàn toàn tốt đẹp của Khối Thịnh vượng chung cả đấy."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000022"
    choices:
      - "Điểm nhìn của thủy thủ Khối Thịnh vượng chung về quân Đế quốc rút lui: đám pháp sư Đế quốc… chúng đang nhanh chóng quay đầu, cụp đuôi tháo chạy tán loạn / các thủy thủ Khối Thịnh vượng chung / bất chấp thất bại cay đắng của mình"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000023"
    choices:
      - "Nhận định ngắn gọn về thiệt hại: Tổn thất là vô cùng nặng nề."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000024"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-174); giữ câu tỉnh lược chủ ngữ: Đau đớn đến mức chẳng dám nghĩ tới."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000025"
    choices:
      - "Nhấn mạnh Markdown đúng phần câu cảm thán nhạo báng cuối đoạn theo nguồn (DEC-P01-002): một người đến từ Khối Thịnh vượng chung / *Đáng đời lũ bây lắm!*"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000026"
    choices:
      - "Tiêu đề chuyển cảnh viết hoa toàn bộ và tên đơn vị: CÙNG NGÀY HÔM ĐÓ, TIỂU ĐOÀN PHÁP SƯ TRÊN KHÔNG SỐ 203"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000027"
    choices:
      - "Thành ngữ mở đầu độc thoại nội tâm của Tanya: Đúng là thiếu mất nét chấm phá hoàn thiện cuối cùng."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000028"
    choices:
      - "Đại từ ngôi thứ nhất số nhiều trong nội tâm Tanya (DEC-P01-001) và quan hệ đối lập: Chúng mình đã ở rất gần việc xóa sổ hoàn toàn bọn họ theo đúng nghĩa đen rồi! Vậy mà thay vào đó, chúng mình lại phạm phải một sai lầm rành rành."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000029"
    choices:
      - "Thuật ngữ khí cụ V-2, ẩn dụ kinh tế học và câu hỏi tu từ: Chúng mình / hạm đội địch trên những quả V-2 / Muốn thu về cổ tức thì có gì là sai chứ?!"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000030"
    choices:
      - "Hệ thống thuật ngữ tàu chiến và ẩn dụ thể thao: lực lượng tập kích của chúng mình / thiết giáp hạm, tàu sân bay, và thậm chí cả các tàu tuần dương cùng tàu khu trục hộ tống của họ / một chiến thắng áp đảo tuyệt đối"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000031"
    choices:
      - "Sắc thái khẳng định mạnh trong nội tâm Tanya: Chúng mình hoàn toàn xứng đáng được mang chiến lợi phẩm trong tay trở về nhà!"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000032"
    choices:
      - "Hình ảnh so sánh ví von bữa ăn trong nội tâm Tanya: chúng mình lại hứng chịu một đòn giáng tồi tệ từ đâu ập tới / cậu bồi bàn lẽ ra phải mang món tráng miệng ra phục vụ lại biến mất tăm ngay giữa bữa ăn"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000033"
    choices:
      - "Giọng tự trấn an và định khung lại vấn đề trong nội tâm Tanya: À mà khoan đã. Hãy nhìn nhận lại chuyện này theo hướng tích cực hơn nào."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000034"
    choices:
      - "Ẩn dụ món chính tiếp nối đoạn trước: Chúng mình thực sự đã được thưởng thức món chính rồi."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000035"
    choices:
      - "Thuật ngữ cơ quan, cấp bậc nhân vật và điều kiện giả định: Chúng mình / Bộ Tổng tham mưu / tuyến đường rút lui / Chừng nào Tướng von Romel không đến muộn… cuộc triệt thoái hẳn sẽ không vấp phải bất kỳ vấn đề gì."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000036"
    choices:
      - "Đại từ quy chiếu về Tướng von Romel (ông ấy) cùng quân đoàn của ông (họ) và câu hỏi bất cần cuối đoạn: ông ấy / một pha cơ động chiến thuật / Chắc chắn họ sẽ xoay xở triệt thoái an toàn thôi. Mà kể cả có chuyện gì xảy ra thật đi nữa thì đã sao nào?"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000037"
    choices:
      - "Mệnh đề điều kiện quy kết trách nhiệm: Nếu ai đó đến muộn, thì đấy là lỗi của chính họ."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000038"
    choices:
      - "Đại từ giả định chung (bạn) và sắc thái nguyên tắc tuyệt đối: Những quy tắc cơ bản của một người trưởng thành ngoài xã hội / Nếu bạn đến muộn, bạn sẽ bị bỏ lại phía sau."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000039"
    choices:
      - "Điểm nhìn gắn với tên riêng Tanya và định danh đối phương: đối với Tanya / đám pháp sư Khối Thịnh vượng chung đến trễ mà vẫn xoay xở xông bừa vào được là điều hết sức phi lý"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000040"
    choices:
      - "Phân biệt đại từ tập thể đơn vị (chúng mình) và cá nhân Tanya (mình) theo DEC-P01-001: chúng mình không chịu thiệt hại thực sự nào / Nhưng mình rất muốn đòi bồi thường cho cú tác động nghiêm trọng tới trạng thái tinh thần của mình đấy!"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000041"
    choices:
      - "Không thêm nhấn mạnh tại thẻ neo trang (page-175); giữ giọng càu nhàu trong nội tâm Tanya: Lúc nào bọn họ cũng ngáng đường chúng mình vào đúng giây cuối cùng! Đã định đến muộn thì đừng có vác mặt tới luôn đi!"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000042"
    choices:
      - "Báo cáo khẩn trong thoại và thuật ngữ quy mô đơn vị: “Đó là một nhóm pháp sư quy mô cỡ lữ đoàn! Họ đang lao về phía chúng ta rất nhanh!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000043"
    choices:
      - "Lời thoại ngắn của Tanya khi quyết định rút lui: “Chậc! Hết giờ rồi!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000044"
    choices:
      - "Đại từ tự xưng nội tâm (mình) theo DEC-P01-001 và tên đầy đủ của tiểu đoàn: phẩm chất xuất sắc của đơn vị mình / Tiểu đoàn Pháp sư Trên không số 203, rất muốn tránh rơi vào thế bị áp đảo về quân số"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000045"
    choices:
      - "Đại từ tự xưng nội tâm (mình) theo DEC-P01-001 và cấu trúc điều kiện: Đặc biệt là trong một trận đánh trên mặt nước. Nếu có thể tránh được thì mình muốn tránh nó."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000046"
    choices:
      - "Cách xưng hô của cấp dưới (Thiếu tá Weiss) với Trung tá Tanya von Degurechaff trong thoại: “Thưa Trung tá! Cho chúng tôi đánh thêm hai chiếc tàu nữa thôi thì sao ạ!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000047"
    choices:
      - "Mệnh lệnh rút quân dứt khoát của Tanya trong thoại: “Thời gian quý giá hơn! Đừng có tham lam! Chúng ta rút lui!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000048"
    choices:
      - "Tên riêng, quân hàm và đại từ ngôi thứ ba cho Thiếu tá Weiss: Tanya hô hào toàn đội thu quân / cơn khát chiến đấu của Thiếu tá Weiss / anh ta / ngay trước mắt họ"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000049"
    choices:
      - "Lời van nài xin xuất kích của Thiếu tá Weiss trong thoại: “Nếu ra tay ngay bây giờ thì chẳng tốn bao nhiêu thời gian đâu! Xin hãy để chúng tôi đi!”"
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000050"
    choices:
      - "Tường thuật gián tiếp lời Thiếu tá Weiss và thuật ngữ: Anh ta nài nỉ rằng mình có thể hạ gọn chúng chỉ bằng vài thuật thức."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000051"
    choices:
      - "Giữ nguyên câu hỏi nội tâm, tình thái phỏng đoán và đại từ tự xưng (mình) của Tanya (DEC-P01-001): Anh ta nói nghiêm túc đến mức nào nhỉ? Chà, có lẽ anh ta làm được thật đấy. Vấn đề duy nhất là vào lúc này mình chẳng bận tâm đến chuyện đó."
  - segment_id: "YS-LN09/Text/chapter016.xhtml/p000052"
    choices:
      - "Tình thái giả định quá khứ trái thực tế và tiếng chửi thầm kết đoạn: Khi quân tiếp viện của địch đang áp sát, luật chơi đã thay đổi rồi. Trước lúc bọn họ kéo tới, việc quét sạch số tàu chiến đó hẳn sẽ là phương án tối ưu, nhưng… lũ khốn này."
