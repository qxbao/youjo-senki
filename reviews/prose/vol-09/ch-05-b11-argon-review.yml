locked_choices:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000284"
    locks:
      - "Giữ xưng hô của Đại úy Meybert với Trung úy Tospan: gọi 'cậu', giọng điềm tĩnh của cấp trên trực tiếp."
      - "Giữ thuật ngữ 'sĩ quan hành chính' (administrative officers) và 'doanh trại' (barracks)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000285"
    locks:
      - "Giữ câu đáp lễ quân ngũ của cấp dưới: 'Rõ ạ' (Understood) và tên riêng 'Tospan'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000286"
    locks:
      - "Giữ chính xác phạm vi nhấn mạnh Markdown '*Mình cứ làm cho xong quách đi vậy. Mình muốn binh lính quay lại làm việc càng sớm càng tốt…*' theo DEC-P01-002."
      - "Giữ đại từ tự quy chiếu 'Mình' trong độc thoại nội tâm và 'Anh' trong trần thuật ngôi thứ ba về Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000287"
    locks:
      - "Giữ phép so sánh ngang bằng giữa 'Bộ máy quan liêu' (Bureaucracy) và 'Lục quân Liên bang' (Federation Army)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000288"
    locks:
      - "Giữ tên 'Meybert' và các hạng mục bắt buộc trên đơn: đề cương tổng quát của công việc, chi phí vận hành, vật tư."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000289"
    locks:
      - "Giữ cấu trúc phủ định liệt kê ba hạng mục không làm: xây công sự bê tông, thiết lập trận địa nhiều tuyến tinh vi, rải mìn."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000290"
    locks:
      - "Giữ chuỗi chi tiết thực tế đối lập với thủ tục: chỉ chất bao cát, vật tư duy nhất là bao vải, xúc đất cát có sẵn gần đó nhồi vào và xếp chồng, lính đã có sẵn xẻng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000291"
    locks:
      - "Giữ ý khả thể 'gói gọn trên một trang sổ tay'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000292"
    locks:
      - "Giữ sự tương phản giữa 'một trang sổ tay' và 'mười biểu mẫu khác nhau' với quy cách điền riêng biệt."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000293"
    locks:
      - "Giữ từ 'hậu phương' (the rear) và dấu ngoặc kép biểu thị sắc thái mỉa mai của từ 'formal'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000294"
    locks:
      - "Giữ hình thức câu hỏi liệt kê bốn yêu cầu: nguồn gốc số đất, xác nhận quyền sở hữu, kế hoạch phòng thủ hiện hành, kiểm tra bản vẽ thi công."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000295"
    locks:
      - "Giữ chính xác phạm vi nhấn mạnh Markdown '*Có khi nhồi đống giấy tờ này vào bao còn nhanh hơn là xúc đất ấy chứ!*' theo DEC-P01-002."
      - "Giữ đại từ trần thuật 'anh' chỉ Meybert và ý muốn 'nổi loạn' (mutiny)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000296"
    locks:
      - "Giữ hai mệnh đề tăng tiến về sự chậm trễ: thời gian trôi qua nhiều hơn dự kiến và công việc chậm tiến độ hơn tính toán."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000297"
    locks:
      - "Giữ cấp bậc và xưng hô trong thoại của Tospan với Meybert: tự xưng 'Tôi là Trung úy Tospan', gọi 'thưa Đại úy', có tiểu từ kính ngữ 'ạ'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000298"
    locks:
      - "Giữ câu trả lời phủ định ngắn gọn và đại từ 'Tôi' trong thoại của Meybert với cấp dưới."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000299"
    locks:
      - "Giữ đại từ 'tôi', sắc thái kính ngữ 'ạ' và ý tự nhận không giỏi chuyện giấy tờ của Tospan."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000300"
    locks:
      - "Giữ đúng các danh xưng và thuật ngữ: 'Trung úy Serebryakov', 'sĩ quan phụ tá' (adjutant), 'Trung tá Degurechaff' (Colonel Degurechaff), đại từ 'cô ấy'."
      - "Giữ tình thái giả định trái thực tế đối với nhận định về Serebryakov sau khi áp dụng sửa lỗi."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000301"
    locks:
      - "Giữ điểm nhìn hồi tưởng của Meybert ('anh') về Serebryakov ('cô') và thuật ngữ 'pháp sư' (mage)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000302"
    locks:
      - "Giữ cụm 'mối đe dọa cấp chiến thuật' (tactical threat) và cách gọi 'Trung úy Tospan', xưng 'tôi' - 'cậu'."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000303"
    locks:
      - "Giữ câu đáp 'Rõ ạ.' nhất quán với p000285."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000304"
    locks:
      - "Giữ quan hệ nhượng bộ: miệng cằn nhằn nhưng không còn lựa chọn nào khác ngoài tiếp tục làm."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000305"
    locks:
      - "Giữ đại từ khái quát ở câu đầu, quân hàm 'đại úy' (captain) và chuyên ngành 'lính pháo binh' (artilleryman) của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000306"
    locks:
      - "Giữ phép đối lập giữa sức nặng của đạn pháo (p000305) và sự nhẹ bẫng của cây bút nhưng không nhích được tiến độ vì không quen tay."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000307"
    locks:
      - "Giữ thuật ngữ 'sở chỉ huy' (command post) và chi tiết vị trí hướng ra biển."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000308"
    locks:
      - "Giữ hai thao tác gây kiệt sức: lập kế hoạch thi công đúng quy định và chép thành văn bản lên đủ loại biểu mẫu để nộp xét duyệt."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000309"
    locks:
      - "Giữ câu hỏi tu từ phàn nàn về 'cuốn sổ quy tắc' (rule book) và 'bản đề xuất thi công' (construction proposal)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000310"
    locks:
      - "Giữ sự đối lập giữa lời lẩm bẩm và đôi tay vẫn tiếp tục viết của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000311"
    locks:
      - "Giữ thuật ngữ 'hệ thống phân loại' (classification system), con số 'mười hai loại bao cát khác nhau' và yêu cầu phải chỉ định chính xác loại sử dụng."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000312"
    locks:
      - "Giữ độc thoại tự than của Meybert ('mình') và sự đối lập hài hước đen giữa 'tử trận nơi sa trường' (killed in action) với bị giấy tờ lấy mạng trước."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000313"
    locks:
      - "Giữ thuật ngữ 'mặt trận phía đông' (eastern front) và phạm vi nhấn mạnh Markdown '*Tử thủ trận địa đến cùng*' theo DEC-P01-002."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000314"
    locks:
      - "Giữ so sánh nghịch lý: lệnh đào công sự bám trụ và giữ vững trận địa bằng mọi giá trở nên chẳng đến nỗi tệ khi đặt cạnh việc điền vô số giấy tờ chi tiết theo sách quy tắc."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000315"
    locks:
      - "Giữ thuật ngữ 'mặt trận phía đông' (eastern front) và ý đối lập giữa quyền tự quyết ngoài thực địa (chỉ kèm một tờ mệnh lệnh bằng văn bản duy nhất) với mớ việc vặt rườm rà hiện tại."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000316"
    locks:
      - "Giữ chi tiết uống nước sạch thỏa thích, sự xa xỉ chỉ có ở 'nơi đồn trú' (garrison) và câu cảm thán về 'hệ thống nước máy' (running water)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000317"
    locks:
      - "Giữ nhận định chung về tác dụng của nước mát đối với tâm trí rã rời."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000318"
    locks:
      - "Giữ cách gọi 'Trung úy Tospan' và đại từ 'cậu' trong câu hỏi thăm tiến độ của Meybert."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000319"
    locks:
      - "Giữ trần thuật gián tiếp về câu trả lời của viên trung úy và hành động Meybert đưa bình nước để cả hai cùng rót uống."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000320"
    locks:
      - "Giữ đại từ 'Tôi - mình' trong lời thoại của Tospan, thuật ngữ 'công binh dã chiến' (field engineer), và chính xác phạm vi nhấn mạnh Markdown '*Thế mà ở đây cái gì cũng khác.*' theo DEC-P01-002."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000321"
    locks:
      - "Giữ phép chơi chữ đối lập giữa cử động tay chân và cách 'múa bút' (the way pens move), cùng chi tiết vẽ sơ đồ khi đi rải mìn."
