findings:
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000300"
    severity: "moderate"
    category: "modality_and_tense"
    issue: "Biến giả định trái thực tế (would have been able to) thành dự đoán tương lai (sẽ giải quyết ... đây), làm lệch thời gian và tính giả định theo canon/style-guide.md."
    rationale: "Trong ngữ cảnh p000300, Trung úy Serebryakov không có mặt tại đơn vị đồn trú để làm hộ giấy tờ cho Meybert; Meybert chỉ đang nhớ lại năng lực của một sĩ quan phụ tá và giả định nếu là cô ấy thì hẳn đã giải quyết xong rất nhanh. Dùng 'sẽ giải quyết ... đây' khiến người đọc hiểu nhầm Serebryakov sắp sửa bắt tay vào xử lý đống giấy tờ này."
    recommendation: "Đổi 'Tôi cá là cô ấy sẽ giải quyết êm đẹp mớ này nhanh gọn lắm đây.' thành 'Tôi cá là cô ấy hẳn đã có thể giải quyết êm đẹp mớ này nhanh gọn lắm rồi.' (hoặc 'Tôi cá là nếu có cô ấy thì hẳn cô ấy đã giải quyết êm đẹp mớ này nhanh gọn lắm rồi.')."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000284"
    severity: "minor"
    category: "ellipsis_and_nuance"
    issue: "Khôi phục động từ khuyết thiếu tỉnh lược 'can' thành 'lại tin nổi đấy' và tăng mức độ 'just different' thành 'hoàn toàn khác chúng ta'."
    rationale: "Trong phạm vi gói nguồn của batch b11 không có câu thoại p000283 phía trước để xác nhận động từ được tỉnh lược sau 'can' có phải là 'believe' hay không; dịch trung tính theo trợ động từ khuyết thiếu giúp tránh rủi ro lệch động từ nếu câu trước nói về hành động hay đòi hỏi khác. Ngoài ra, 'just different' chỉ nhấn nhẹ sự khác biệt về thường thức chứ không có trạng từ chỉ mức độ tuyệt đối 'hoàn toàn'."
    recommendation: "Cân nhắc chỉnh thành: 'À thì, các sĩ quan hành chính ở đây thì có thể đấy. Thường thức của họ vốn dĩ đã khác rồi.' (hoặc đối chiếu p000283 nếu giữ động từ cụ thể)."
  - segment_id: "YS-LN09/Text/chapter020.xhtml/p000294"
    severity: "minor"
    category: "lexical_precision"
    issue: "Diễn đạt 'multiple checks of the construction plans' thành 'kiểm tra chéo bản vẽ thi công qua nhiều khâu' hơi suy diễn thêm yếu tố 'chéo'."
    rationale: "Nguồn chỉ nêu việc kiểm tra bản vẽ/phương án thi công nhiều lần (multiple checks), không nêu rõ hình thức 'kiểm tra chéo' (cross-check)."
    recommendation: "Cân nhắc chỉnh thành 'kiểm tra bản vẽ thi công nhiều lần?' hoặc 'kiểm tra bản vẽ thi công qua nhiều vòng?'."
