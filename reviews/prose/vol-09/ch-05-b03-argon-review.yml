findings:
  - segment_id: YS-LN09/Text/chapter018.xhtml/p000067
    severity: minor
    category: terminology
    issue: "Từ 'glass' ở p000067 đang được dịch là 'kính' ('kiếm bao nhiêu kính tùy thích'), làm đứt mạch liên kết từ vựng và logic với chi tiết chiếc bình nước trên bàn toa ăn làm bằng 'thủy tinh' ở p000057–p000058 ngay cuối lô trước (ch-05-b02)."
    evidence: "Theo canon/style-guide.md, cần giữ đúng nghĩa và quan hệ nhân quả trong mạch suy luận của nhân vật; p000067 là lý do bổ sung giải thích vì sao phía Ildoa thản nhiên dùng bình nước thủy tinh trên tàu hỏa sau khi Tanya nhận ra tàu chạy rất êm ở p000059–p000066."
    recommendation: "Đổi 'kính' thành 'thủy tinh' (hoặc 'đồ thủy tinh'): 'Và người Ildoa có lẽ còn có thể kiếm bao nhiêu thủy tinh tùy thích.'"
  - segment_id: YS-LN09/Text/chapter018.xhtml/p000087
    severity: minor
    category: style_register
    issue: "Thành ngữ chỉ việc làm cho đám quan liêu hiểu ra vấn đề trong lời thoại của Đại tá Calandro ở p000087 đang dịch bằng từ lóng hiện đại là 'thông não', lệch sắc thái văn phong quân sự – ngoại giao của nhân vật."
    evidence: "Theo canon/style-guide.md, cần giữ giọng kể và giọng thoại nhất quán theo ngữ cảnh; Đại tá Calandro dù nói năng thân mật, hoa mỹ nhưng vẫn là sĩ quan cấp cao trong bối cảnh lịch sử quân sự."
    recommendation: "Đổi 'cuối cùng tôi cũng thông não được cho đám quan liêu ngu xuẩn đó rồi' thành 'cuối cùng tôi cũng làm cho đám quan liêu ngu xuẩn đó thủng ra rồi' hoặc 'cuối cùng tôi cũng nhét được chuyện đó vào đầu đám quan liêu ngu xuẩn kia rồi'."
  - segment_id: YS-LN09/Text/chapter018.xhtml/p000106
    related_segment_ids:
      - YS-LN09/Text/chapter018.xhtml/p000094
      - YS-LN09/Text/chapter018.xhtml/p000100
    severity: minor
    category: pronouns_pov
    issue: "Đại từ ngôi thứ nhất số nhiều 'We' ở câu trần thuật nội tâm kết cảnh p000106 (chỉ Tanya và Đại tá Calandro) đang dịch là 'Chúng tôi', làm lệch điểm nhìn tự quy chiếu của Tanya từ 'mình' (đang dùng nhất quán ở p000094, p000100 và toàn cảnh) sang 'tôi'."
    evidence: "Theo DEC-P01-001 và quy ước trong work/run-state/pending-terms-index.yml, độc thoại/trần thuật ngôi thứ nhất của Tanya dùng 'mình'; ở p000094, cùng chủ thể hai người trong hành động thăm dò lẫn nhau đã được dịch hợp lý là 'cả hai'."
    recommendation: "Đổi 'Chúng tôi' ở p000106 thành 'Cả hai' hoặc 'Hai bên' ('Cả hai lời qua tiếng lại châm chọc để thăm dò lẫn nhau.') để đồng nhất với p000094 và giữ vững điểm nhìn nội tâm của Tanya."
