    issue: "Trong câu thoại phàn nàn về việc phục vụ món trà kém chất lượng tại khách sạn, đại từ ngôi thứ hai chỉ phía nhà hàng/khách sạn được dịch là 'các cô', hơi thu hẹp chủ thể về nhóm nữ phục vụ thay vì toàn bộ cơ sở phục vụ trước khi câu sau mới chuyển sang hỏi riêng người nữ phục vụ và nhắc tới các nam phục vụ."
    basis: "Đối chiếu mạch chuyển chủ thể trong thoại tại p000023 theo nguyên tắc giữ chính xác phạm vi quy chiếu trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'bên cô' hoặc 'khách sạn lại đem thứ này ra phục vụ' để phân tách rõ ý trách chung cơ sở dịch vụ với câu hỏi cá nhân kế tiếp; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000028"
    severity: "minor"
    issue: "Ở câu cuối đoạn, món ăn dùng để so sánh với phần mứt thiếu đường và kém chất lượng được dịch là 'món mứt quả ninh nhừ'; việc lặp lại từ 'mứt' làm mờ nhẹ ý đối lập rằng thứ mứt phết bánh này loãng và nhạt đến mức giống món trái cây/hoa quả ninh hơn là mứt đúng chuẩn."
    basis: "Đối chiếu sắc thái từ vựng ẩm thực tại p000028 theo style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'món trái cây ninh nhừ' hoặc 'món hoa quả hầm' để làm nổi bật sự xuống cấp so với mứt truyền thống."
