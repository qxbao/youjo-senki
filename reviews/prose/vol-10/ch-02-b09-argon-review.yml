      - "Khóa câu thốt ngắn ngỡ ngàng nhưng vẫn giữ lễ tiết cấp dưới của Tanya ('Sao cơ ạ?')."
  - segment_id: "YS-LN10/Text/chapter008.xhtml/p000289"
    locks:
      - "Khóa điểm nhìn trần thuật từ phía Zettour ('ông' - 'cô'), thuật ngữ 'Đòn phục kích chiến lược', tên 'Degurechaff', cụm 'một trong những trung tá pháp sư vĩ đại nhất lịch sử' và cảm giác thỏa mãn khép lại phân cảnh."
