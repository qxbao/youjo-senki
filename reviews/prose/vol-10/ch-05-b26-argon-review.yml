locked_choices:
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000129"
    locked: "Khóa danh xưng 'vị tướng', đại từ 'ông' và chi tiết 'những cơn run rẩy không dứt của vị tướng mới dừng lại, và cuối cùng ông cũng châm được điếu thuốc vẫn nằm kiên nhẫn giữa hai bờ môi mình'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000130"
    locked: "Khóa đại từ 'Ông', thuật ngữ 'thuốc lá quân đội' và chi tiết 'khi lớp nhựa thuốc ngấm sâu vào buồng phổi'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000131"
    locked: "Khóa đại từ 'ông', quan hệ nhượng bộ 'Dẫu vậy, ý nghĩ cực đoan vừa thoáng qua ban nãy vẫn cứ đeo bám lấy ông' và phép so sánh 'hệt như một vết nhơ hằn sâu trong tâm trí—một vết nhơ mang hình dáng của chiếc ủng cao gót'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000132"
    locked: "Khóa ẩn dụ 'Từ phía sau vết nhơ ấy, ý tưởng kia lại lấp ló thò đầu ra lần thứ hai.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000133"
    locked: "Khóa đại từ 'chúng ta', 'bọn họ' và câu hỏi bỏ lửng trong thoại '“Hay là chúng ta cứ triệt hạ bọn họ nhân lúc còn…?”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000134"
    locked: "Khóa 'Vị tướng', đại từ 'ông', quan hệ thời gian 'bị cắt ngang trước khi kịp nói thêm lời nào', nguyên nhân 'bởi một tràng ồn ào vọng lại từ bên ngoài văn phòng' và chuỗi hành động 'Hàng chân mày ông khẽ chau lại trước khi đứng bật dậy.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000135"
    locked: "Khóa 'Trung tâm chỉ huy', đại từ 'ông' và phủ định mức độ 'nhưng chưa bao giờ đến mức đánh mất hoàn toàn trật tự kỷ cương như thế này'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000136"
    locked: "Khóa đúng phạm vi nhấn mạnh nội tâm '*Chuyện gì đang xảy ra thế này?*' theo DEC-P01-002, đại từ 'Ông', thuật ngữ 'sĩ quan ma pháp' và chi tiết 'gần như bị đạp tung từ phía bên kia bởi một sĩ quan ma pháp đang đùng đùng nổi giận'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000137"
    locked: "Khóa danh xưng 'Tướng Romel', cặp đại từ xưng hô của Tanya với cấp trên 'Tôi' - 'ngài' và câu thoại '“Tướng Romel! Tôi muốn yêu cầu một lời giải thích từ ngài!”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000138"
    locked: "Khóa cụm 'Vị sĩ quan nhỏ bé ấy' và mức độ cảm xúc 'đang tràn ngập cơn phẫn nộ và bất mãn đến tận cùng'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000139"
    locked: "Khóa 'Trung tá Degurechaff', 'Tướng Romel', đại từ 'cô' và chi tiết 'hét to lên chính mối nghi ngờ sâu kín nhất trong lòng Tướng Romel'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000140"
    locked: "Khóa đại từ 'chúng ta' và câu hỏi chất vấn '“Tại sao quân địch lại phục sẵn chờ chúng ta cơ chứ?!”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000141"
    locked: "Khóa đúng phạm vi nhấn mạnh Markdown '*Ồ, phải rồi.*' theo DEC-P01-002."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000142"
    locked: "Khóa cặp đại từ trần thuật 'Ông' - 'cô', biệt danh 'Bạch Ngân Rỉ Sét' và chi tiết 'lập tức đáp trả bằng những lời lẽ đầy bức xúc'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000143"
    locked: "Khóa đại từ 'chúng ta', cụm 'thông tin mật' và câu hỏi bức xúc '“Rốt cuộc hiện giờ chúng ta đang quản lý thông tin mật kiểu quái gì thế hả?!”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000144"
    locked: "Khóa đúng phạm vi nhấn mạnh nội tâm của Romel '*Cô ấy nổi giận là hoàn toàn có lý.*' theo DEC-P01-002 và câu trần thuật 'Ông gật đầu và tiếp tục nở nụ cười.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000145"
    locked: "Khóa danh xưng 'Trung tá Degurechaff', đại từ 'Cô' khi Romel nói với Tanya và câu hỏi '“Đó là một câu hỏi rất hay, Trung tá Degurechaff. Cô có muốn biết câu trả lời không?”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000146"
    locked: "Khóa đại từ 'tôi' và câu đáp của Tanya '“Làm ơn đi, đó chính xác là điều tôi đến đây để tìm hiểu đấy!”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000147"
    locked: "Khóa đại từ 'Tôi' và câu trả lời phủ định ngắn gọn '“Tôi không biết.”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000148"
    locked: "Khóa 'vị tướng', 'Tanya' và mức độ 'khiến Tanya gần như cứng họng'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000149"
    locked: "Khóa câu hỏi ngắn thể hiện sự sững sờ của cấp dưới '“Cái gì cơ ạ?”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000150"
    locked: "Khóa đúng phạm vi nhấn mạnh toàn câu '*Vẻ mặt đó là sao chứ? Cô ấy kỳ vọng ông sẽ nói gì cơ chứ?*' theo DEC-P01-002 và điểm nhìn gián tiếp tự do với cặp đại từ 'Cô ấy' - 'ông'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000151"
    locked: "Khóa cặp đại từ 'cô' - 'ông' và đầy đủ các sắc thái tình thái/thời gian ở cả ba câu ('nhiều khả năng cô cũng sẽ đi đến cùng một kết luận như ông mà thôi', 'có lẽ cô đã nghĩ ra rồi', 'Chắc hẳn đó là lý do khiến cô tức giận ra mặt như vậy')."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000152"
    locked: "Khóa đại từ 'chúng ta', 'Cô', ba khả năng ('có kẻ phản bội trong hàng ngũ chúng ta', 'quân địch đã giải mã được mật mã của chúng ta', 'do một sai sót nào đó của con người') và câu hỏi 'Cô nghĩ khả năng nào dễ xảy ra nhất?'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000153"
    locked: "Khóa đại từ 'tôi' và câu điều kiện '“Nếu đó là ba phương án của tôi, thì tôi biết chính xác là phương án nào.”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000154"
    locked: "Khóa cặp đại từ 'ông' - 'cô' và nhận định 'Đúng hệt như ông biết trước cô sẽ trả lời.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000155"
    locked: "Khóa cặp đại từ 'tôi' - 'cô' và câu mệnh lệnh '“Nếu cô nghĩ mình đã biết, vậy thì hãy cho tôi nghe câu trả lời của cô xem nào.”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000156"
    locked: "Khóa câu đồng thanh '“Là mật mã của chúng ta.”', thuật ngữ 'hệ thống mã hóa' và quan hệ tương phản 'Sự đồng thuận ấy lại là cội nguồn của nỗi bực dọc vô bờ đối với cả hai, nhưng họ đều hiểu đây là câu trả lời có khả năng xảy ra cao nhất.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000157"
    locked: "Khóa 'Trung tướng Romel', 'Tanya', cặp đại từ 'ông' - 'cô' và nhận định 'Câu trả lời ông nhận được vô cùng hợp lý.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000158"
    locked: "Khóa đại từ 'ngài', câu hỏi tu từ 'Liệu có kẻ phản bội đơn lẻ nào lại nắm được bức tranh toàn cảnh chứ?' và giả định loại trừ 'Cách duy nhất để điều đó xảy ra là chính ngài mới là kẻ phản bội.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000159"
    locked: "Khóa đúng phạm vi nhấn mạnh '*Chính xác.*' theo DEC-P01-002, tên 'Romel', cặp đại từ 'Ông' - 'cô' và mức độ 'Ông suýt nữa thì cảm thấy tức giận trước việc chẩn đoán của cô lại chuẩn xác đến nhường ấy.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000160"
    locked: "Khóa đại từ 'ông' và mục đích hành động 'quyết định tự xốc lại tinh thần của mình bằng cách trêu chọc cấp dưới'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000161"
    locked: "Khóa đại từ 'cô' và câu hỏi vặn lại '“Chẳng phải người đó cũng có thể là cô sao?”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000162"
    locked: "Khóa cặp đại từ 'Ngài' - 'tôi' và câu hỏi '“Cái gì cơ? Ngài nghĩ đó là tôi sao?”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000163"
    locked: "Khóa đại từ 'Cô', thuật ngữ 'lực lượng đặc nhiệm', 'Khối Thịnh vượng chung' và giả định quá khứ/điều kiện 'Nếu cô định tìm cách đào tẩu sang Khối Thịnh vượng chung, thì đó hẳn sẽ là món thông tin hoàn hảo để mang theo đấy.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000164"
    locked: "Khóa 'Vị trung tá', 'vị tướng', cặp đại từ 'cô' - 'ông' và chi tiết 'cảm nhận được cô đang bắt đầu nghi ngờ sự tỉnh táo của ông'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000165"
    locked: "Khóa cặp đại từ 'Tôi' - 'cô', cách gọi 'Trung tá' và lời trấn an '“Tôi chỉ đùa với cô thôi. Cô nên lấy lại bình tĩnh đi, Trung tá.”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000166"
    locked: "Khóa cặp đại từ 'Ông' - 'cô' và chi tiết 'giữ kín trong lòng chuyện chính mình cũng vừa ở trong trạng thái tương tự chỉ mới vài giây trước đó'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000167"
    locked: "Khóa 'Lục quân Đế quốc', 'lục quân', thuật ngữ 'thẩm tra lý lịch', phủ định 'một hai tiếng cười chẳng thể nào giúp họ thoát khỏi cái hố sâu này' và nhận định 'Ý nghĩ rằng có thể tồn tại một kẻ phản bội thật hết sức ngu xuẩn.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000168"
    locked: "Khóa mức độ phủ định 'gần như là điều bất khả thi' đối với giả thuyết có kẻ phản bội trong hàng ngũ."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000169"
    locked: "Khóa câu chuyển ý bỏ lửng 'Điều đó có nghĩa là…'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000170"
    locked: "Khóa phủ định trong thoại '“…Chuyện này làm thay đổi tất cả. Với tình hình hiện tại thì chẳng còn Kế hoạch A hay B gì nữa cả.”'."
