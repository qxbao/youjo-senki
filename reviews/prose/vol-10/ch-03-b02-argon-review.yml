findings:
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000023"
    severity: "moderate"
    issue: "Trong thoại quân sự, viên sĩ quan trực ban đang nói chuyện với Trung tá Tanya von Degurechaff nhưng bản dịch dùng đại từ ngôi thứ hai 'cô', vừa lệch chuẩn xưng hô quân ngũ vừa chạm giới hạn suy diễn quan hệ/giới tính trong thoại theo DEC-P01-001."
    basis: "Đối chiếu quy ước DEC-P01-001, cấp bậc Trung tá của Tanya trong vol-10 và bối cảnh giao tiếp công vụ tại tổng hành dinh ở p000022-p000027."
    recommendation: "Đổi 'cô' thành 'Trung tá' (ví dụ: '“Chà, Trung tá cũng biết tính vị tướng ấy thế nào rồi đấy.”')."
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000024"
    severity: "moderate"
    issue: "Bản dịch dùng 'Tôi đã nghe kể tường tận' làm đổi nghĩa sang tiếp nhận thông tin gián tiếp qua lời kể của người khác, mâu thuẫn với mạch sự kiện của bộ truyện và ngay với p000029 (Tanya trực tiếp phục vụ dưới quyền Romel và bị ông quần tơi tả ở chiến trường miền nam)."
    basis: "Đối chiếu nghĩa động từ nhận thức qua trải nghiệm trong nguồn tại p000024 với thông tin tự thuật trực tiếp ở p000029."
    recommendation: "Sửa thành cách diễn đạt thể hiện sự hiểu rõ/thấm thía từ trải nghiệm thực tế (ví dụ: '“Tôi đã quá rõ thói quen bất chợt biến mất của ngài ấy hồi ở miền nam rồi.”' hoặc '“Hồi ở miền nam tôi đã hiểu quá rõ thói quen bất chợt biến mất của ngài ấy rồi.”')."
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000031"
    severity: "moderate"
    issue: "Dùng đại từ phản thân 'mình' cho chủ thể ngôi thứ ba ('ông ta ghét cay ghét đắng bất cứ thứ gì mình cho là lãng phí') ngay sát câu dùng 'mình' cho ngôi thứ nhất của Tanya ('Theo phỏng đoán của mình') gây nhập nhằng chủ thể đánh giá sự lãng phí giữa Romel và Tanya."
    basis: "Đối chiếu điểm nhìn độc thoại nội tâm ngôi thứ nhất ('mình') xuyên suốt batch và chủ thể mệnh đề phụ ở p000031."
    recommendation: "Đổi 'mình cho là lãng phí' thành 'ông ta cho là lãng phí' hoặc 'bản thân ông ta cho là lãng phí'."
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000022"
    severity: "minor"
    issue: "Động từ 'gặng hỏi' hơi nặng sắc thái tra vấn so với hành động gợi chuyện/hỏi dò nhẹ nhàng vì hơi tò mò, và 'gật gù đồng tình' thêm chi tiết cử chỉ không nêu trực tiếp trong nguồn."
    basis: "Đối chiếu sắc thái từ vựng ở p000022 và lời đáp tự nhiên của sĩ quan trực ban ở p000023."
    recommendation: "Có thể cân nhắc chỉnh nhẹ thành 'hỏi dò thêm' / 'khơi chuyện với' và 'đáp lại đầy đồng tình' khi sửa bản dịch hoặc ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000040"
    severity: "minor"
    issue: "Đại từ ngôi thứ nhất số nhiều 'chúng mình' trong câu nói về việc Tanya và các đầu mối ở Bộ Tư lệnh Hạm đội gặp gỡ trao đổi thông tin nghe hơi thân mật so với giọng độc thoại quân sự của Tanya (vốn dùng 'chúng ta' ở p000028 hoặc 'chúng tôi')."
    basis: "Đối chiếu giọng nhân vật Tanya và mục đại từ nội tâm trong pending-terms-index.yml."
    recommendation: "Đề xuất đổi 'chúng mình' thành 'chúng ta' hoặc 'hai bên' để giữ đúng giọng văn quân sự."
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000041"
    severity: "minor"
    issue: "Cụm 'chỉ để thị sát trong muôn vàn việc khác' bám sát chữ khá nặng nề so với cấu trúc cảm thán tỏ ý bất ngờ trước lý do đi thị sát."
    basis: "Đối chiếu cấu trúc ngữ dụng ở câu đầu p000041."
    recommendation: "Có thể diễn đạt tự nhiên hơn như 'lại đến tận đó để thị sát trong biết bao nhiêu việc' hoặc 'lại đến tận đó chỉ để thị sát cơ chứ' ở bước sửa/chuốt văn."
