findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000239"
    severity: "minor"
    issue: "Câu chửi thề nhắm vào quân Đế quốc trong mệnh lệnh của Drake được dịch thành 'Kệ xác lũ Đế quốc!', dễ gây cảm giác mâu thuẫn nhẹ với mệnh lệnh ngay kế tiếp ('Ngắm bắn như thể chúng đang cách bốn nghìn ấy!') vì 'kệ xác' thường gợi nghĩa bỏ mặc, không bận tâm."
    basis: "Đối chiếu mạch logic mệnh lệnh tác chiến trong đoạn và nguyên tắc giữ đúng sắc thái trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'Khốn kiếp lũ Đế quốc!' hoặc 'Mẹ kiếp lũ Đế quốc!' để giữ đúng sắc thái chửi thề mà không gợi nghĩa bỏ mặc mục tiêu; không làm sai lệch mệnh lệnh cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000251"
    severity: "minor"
    issue: "Chi tiết mô tả độ dài câu đáp trong nguồn được dịch thoáng thành 'chỉ bằng câu ngắn gọn', lược nhẹ sắc thái định lượng ngắn gọn để tránh lệch số chữ với câu thoại tiếng Việt ở p000250."
    basis: "Đối chiếu nguyên tắc không lược bỏ chi tiết trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc diễn đạt thành 'chỉ bằng đôi lời ngắn gọn' để vừa giữ sát sắc thái định lượng của nguồn vừa khớp tự nhiên với câu thoại tiếng Việt; không làm sai nghĩa câu nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000260"
    severity: "minor"
    issue: "Cụm 'Giá như kẻ đó tình cờ chạm trán chúng ta khi chỉ có một mình' hơi lưỡng nghĩa nhẹ về chủ thể của trạng thái 'chỉ có một mình' nếu đọc tách riêng vế đầu, dù vế sau ('đằng này tên pháp sư kia lại bỏ lại toàn bộ đội hình của mình ở tít phía sau') vẫn giúp xác định đúng chủ thể là tên pháp sư địch."
    basis: "Đối chiếu nguyên tắc viết tiếng Việt rõ ràng và giữ đúng quan hệ điều kiện giả định trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'Giá như kẻ đó đi lẻ một mình rồi tình cờ chạm trán chúng ta' để câu văn rõ nghĩa ngay từ vế đầu; không làm sai nghĩa nên không bắt buộc sửa bản chuẩn."
