      - "Khóa các thuật ngữ 'không quân', 'Chiến tranh Thái Bình Dương', 'lực lượng yểm trợ đường không', 'các tàu chiến-tuần dương' và kết luận phủ định rằng nếu không có yểm trợ đường không thì tàu chiến-tuần dương chỉ có nước chìm xuống đáy đại dương."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000386"
    locks:
      - "Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và ý nghi ngờ đôi tai của chính mình."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000387"
    locks:
      - "Khóa dấu gạch ngang mở lời thoại của Romel và phủ định việc yểm trợ đường không sẽ không diễn ra."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000388"
    locks:
      - "Khóa câu hỏi ngắn thể hiện sự sững sờ của Tanya ('Sao cơ ạ?')."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000389"
    locks:
      - "Khóa đại từ thoại 'chúng ta', các thuật ngữ 'hệ thống phòng không', 'Các lực lượng không quân', 'những phi đoàn' và lý do lực lượng không quân đã bị điều đi chi viện phương xa hoặc đang tái tổ chức."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000390"
    locks:
      - "Khóa tên gọi 'Đế quốc', 'siêu cường quân sự', 'Cụm tập đoàn quân phía Tây' và câu hỏi nội tâm phản ánh sự nghịch lý khi không có nổi lực lượng cần thiết để tác chiến toàn lực."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000391"
    locks:
      - "Khóa đại từ nội tâm 'mình' theo DEC-P01-001 và quyết tâm nói thẳng suy nghĩ trong lòng."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000392"
    locks:
      - "Khóa danh xưng 'thưa Tướng quân', tiểu từ 'ạ' và phủ định 'tiền đề của kế hoạch không còn đứng vững nữa'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000393"
    locks:
      - "Khóa đại từ nội tâm 'chúng ta', số lượng và chủng loại tàu ('Hai chiếc tàu chiến-tuần dương và ba chiếc tàu tuần dương hạng nhẹ'), thuật ngữ 'sự yểm trợ đường không', 'các đội tuần tra đêm' và điều kiện tối thiểu phải xử lý đội tuần tra đêm của địch."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000394"
    locks:
      - "Khóa đại từ thoại của Tanya ('tôi', 'chúng ta', tiểu từ 'ạ'), các thuật ngữ 'ưu thế trên không cục bộ', 'các điểm nghẽn', 'những chiến hạm' và cảnh báo bất kỳ phương án nào khác sẽ dẫn đến tổn thất toàn bộ các chiến hạm quan trọng."
