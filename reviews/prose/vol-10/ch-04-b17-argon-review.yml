findings:
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000370"
    severity: "minor"
    issue: "Ở câu cuối, cụm chỉ chiến thắng thuần túy bằng lực lượng hải quân được dịch thành 'một chiến thắng thuần túy trên biển'. Vì tác chiến bằng pháp sư trên không ở vùng biển vẫn diễn ra trên biển, cách dịch 'thuần túy của hải quân' hoặc 'hải quân thuần túy' sẽ làm nổi bật rõ hơn lý do Tanya hỏi lại ở p000371 rằng có phải chỉ được dựa chủ yếu vào tàu chiến hay không."
    basis: "Đối chiếu mạch lập luận giữa câu thứ ba, câu thứ tư của p000370 và câu hỏi nối tiếp ở p000371."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'một chiến thắng thuần túy của hải quân' hoặc 'một chiến thắng hải quân thuần túy'; không ảnh hưởng nghĩa cốt lõi vì câu liền trước đã nêu rõ việc dùng hải quân đánh bại hải quân địch."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000375"
    severity: "minor"
    issue: "Ở mệnh đề nhượng bộ đầu câu, cụm thành ngữ trung tính chỉ sự tương đồng về tính chất/chiều hướng được dịch là 'không cùng một giuộc với'. Trong tiếng Việt, 'cùng một giuộc' thường dùng với sắc thái khẩu ngữ miệt thị để chỉ nhóm người/phe cánh đồng lõa xấu xa, khi ghép với danh từ trừu tượng 'cuộc chiến dai dẳng' hơi lệch trường nghĩa và sắc thái."
    basis: "Đối chiếu sắc thái từ vựng tại p000375 và nguyên tắc không thêm sắc thái miệt thị trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể đổi 'không cùng một giuộc với' thành 'không cùng một kiểu với' hoặc 'không cùng tính chất với' để câu văn tự nhiên và đúng sắc thái hơn."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000384"
    severity: "minor"
    issue: "Ở cuối câu thứ hai, cấu trúc tỉnh lược của nguyên bản khi chuyển sang tiếng Việt ('nếu không có yểm trợ đường không, cho dù sự yểm trợ ấy chỉ ở mức hạn chế đi chăng nữa') có thể khiến người đọc thoáng hiểu nhầm mệnh đề nhượng bộ bổ nghĩa trực tiếp cho trạng thái 'không có'."
    basis: "Đối chiếu cấu trúc điều kiện - nhượng bộ ở câu thứ hai của p000384 và mục tiêu giành ưu thế trên không cục bộ ở p000394."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc diễn đạt rõ mạch tỉnh lược hơn, chẳng hạn 'nếu không có lấy sự yểm trợ đường không, dù chỉ ở mức hạn chế đi chăng nữa'; không bắt buộc sửa bản chuẩn."
