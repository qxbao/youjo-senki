  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000212"
    locks:
      - "Khóa cách gọi miệt thị 'lũ Cộng sản', hô ngữ 'Trung tá', và lời gạt đi của Habergram rằng Drake không cần bận tâm đến tổn thất của họ."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000213"
    locks:
      - "Khóa câu giả định trái thực tế ở hiện tại 'Tôi sẽ đồng tình với ngài nếu tôi không biết rõ sự thật' và lập trường của người có mặt tại hiện trường."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000214"
    locks:
      - "Khóa cụm 'Người đứng đầu ngành Tình báo' và sự chuyển biến trong ánh mắt nhìn Drake: từ chỗ đối đãi như 'một quý ông của hải quân' sang nhìn anh như 'một người lính thực thụ'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000215"
    locks:
      - "Khóa hô ngữ 'Trung tá Drake', cặp đại từ 'tôi' - 'anh', và câu chất vấn sắc bén 'Tôi vẫn luôn đinh ninh anh là người căm ghét Liên bang chứ'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000216"
    locks:
      - "Khóa hô ngữ 'thưa ngài', sự phân biệt thái độ của Drake giữa việc căm ghét 'Chủ nghĩa Cộng sản' đến tận xương tủy và nhận định phủ định 'tôi không nghĩ sẽ có ngày mình có cảm tình nổi với Liên bang đâu'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000217"
    locks:
      - "Khóa sự phân biệt rạch ròi của Drake giữa 'người dân Liên bang' và 'hệ tư tưởng Cộng sản'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000218"
    locks:
      - "Khóa phủ định 'không thể nào làm ngơ' và bối cảnh 'khi anh kề vai sát cánh cùng họ trên chiến trường'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000219"
    locks:
      - "Khóa mệnh đề nhượng bộ 'dù nhiều người dân Liên bang là những tín đồ Cộng sản chính hiệu từ trong máu' và nhận định phủ định kép phê phán việc đánh đồng mọi công dân Liên bang là 'một suy nghĩ hết sức thiển cận'."
