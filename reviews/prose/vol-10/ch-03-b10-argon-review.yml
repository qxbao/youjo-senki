findings:
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000190"
    severity: "minor"
    issue: "Câu mở đầu dùng cụm giới từ 'Ngay từ vấn đề đầu tiên được đem ra bàn' làm chủ ngữ cho vị ngữ 'đã khiến ruột gan anh quặn thắt...', tạo cấu trúc câu khuyết chủ ngữ trong tiếng Việt."
    basis: "Quy tắc viết tiếng Việt tự nhiên, rõ ràng trong canon/style-guide.md tại p000190."
    recommendation: "Ở bước chuốt văn có thể bỏ từ 'từ' để chỉnh thành 'Ngay vấn đề đầu tiên được đem ra bàn đã khiến ruột gan anh quặn thắt...'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000202"
    severity: "minor"
    issue: "Từ 'quở phạt' mang thêm nét nghĩa trừng phạt nặng hơn sắc thái quở trách nhẹ bằng lời nói của từ gốc trong cụm đi đôi với 'trách móc'."
    basis: "Quy tắc giữ đúng sắc thái và bình diện đánh giá của bản gốc trong canon/style-guide.md tại p000202."
    recommendation: "Ở bước chuốt văn có thể chỉnh 'quở phạt' thành 'quở trách' hoặc 'khiển trách'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000207"
    severity: "minor"
    issue: "Dịch cụm danh từ chỉ đơn kiến nghị rút lui/triệu hồi thành 'đơn thỉnh cầu rút quân' hơi thu hẹp đối tượng vào toàn bộ quân đội, trong khi câu kế tiếp liên hệ trực tiếp với hồ sơ lý lịch của đơn vị tình nguyện đa quốc gia và Trung úy Sue."
    basis: "Quy tắc không tự thu hẹp phạm vi nghĩa của bản gốc trong canon/style-guide.md tại p000207."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'đơn kiến nghị cho rút về' hoặc 'đơn thỉnh cầu rút lui' để bao quát tự nhiên cả trường hợp rút nhân sự lẫn đơn vị."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000213"
    severity: "minor"
    issue: "Cụm 'làm ngơ như vậy' ở cuối câu cụ thể hóa hơi sâu đại từ chỉ định chung trong nguyên văn (vốn quy chiếu cả về việc đồng tình với nhận định của cấp trên lẫn việc không bận tâm đến tổn thất)."
    basis: "Quy tắc giữ độ mở và không tự thêm giải thích trong canon/style-guide.md tại p000213."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'làm như vậy được' hoặc 'làm vậy được'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000216"
    severity: "minor"
    issue: "Việc dịch đồng thời đại từ nhân xưng ngôi thứ hai và hô ngữ tôn kính thành 'lời ngài, thưa ngài' và 'với ngài, thưa ngài' gây lặp từ 'ngài' sát nhau hai lần trong cùng một câu thoại."
    basis: "Quy tắc viết tiếng Việt tự nhiên, tránh bám máy móc cấu trúc tiếng Anh trong canon/style-guide.md tại p000216."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'Xin phép được đính chính, thưa ngài—' và 'Và xin nói thẳng, thưa ngài,' để giữ trọn sắc thái kính trọng mà câu thoại gọn tự nhiên hơn."
