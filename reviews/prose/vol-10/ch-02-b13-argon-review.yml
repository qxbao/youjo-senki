  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000117"
    severity: "minor"
    issue: "Trong độc thoại nội tâm của Tanya khi nhắc tới tập thể công ty cũ ở thế giới trước, đại từ ngôi thứ nhất số nhiều đang dịch là 'Chúng mình' (thường mang sắc thái thân mật cá nhân), hơi lệch nhẹ so với giọng nhận định lạnh lùng của một quản lý nhân sự."
    basis: "Đối chiếu giọng nhân vật Tanya ở p000117–p000118 và hướng dẫn giữ giọng kể nhất quán trong style-guide.md."
