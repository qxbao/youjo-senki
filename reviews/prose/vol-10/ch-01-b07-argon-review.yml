locked_choices:
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000001"
    locked: "Khóa câu hỏi ngắn '“Hướng tây sao ạ?”' thể hiện đúng thái độ lễ phép của cấp dưới khi hỏi lại mệnh lệnh."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000002"
    locked: "Khóa định danh 'Đại tá Lergen', đại từ 'cô' (chỉ Tanya trong trần thuật góc nhìn Lergen) và hành động phổ biến chi tiết."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000003"
    locked: "Khóa cặp xưng hô 'Chúng tôi/Tôi' – 'cô', các định danh 'Trung tướng Romel', 'Văn phòng Bộ Tổng tham mưu', đại từ 'ngài ấy' và hình ảnh ẩn dụ 'một quân tốt duy nhất'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000004"
    locked: "Khóa tên 'Lergen', tổ chức 'Lục quân Đế quốc', cụm in nghiêng '*Eile mit Weile*' (theo DEC-P01-002) và châm ngôn 'Chậm là trơn tru, mà trơn tru tức là nhanh.'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000005"
    locked: "Khóa cụm cấp bậc số nhiều 'các đại tá và trung tá' và quan hệ nhấn mạnh tiếp nối đoạn trước."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000006"
    locked: "Khóa câu đáp điều lệnh 'Rõ, thưa Đại tá.', đại từ 'Tôi', tên cơ quan 'Văn phòng Bộ Tổng tham mưu' và giọng mỉa mai lịch sự 'Các ngài tử tế biết bao.'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000007"
    locked: "Khóa định danh 'Trung tướng Rudersdorf' và nhận xét đối đáp 'vốn là một người giàu lòng trắc ẩn mà'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000008"
    locked: "Khóa đại từ 'Tôi', 'mình', thuật ngữ 'Kampfgruppe' và câu hỏi xin chỉ thị điều động đơn vị."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000009"
    locked: "Khóa từ phủ định 'Không', cặp xưng hô 'chúng tôi' – 'cô', cụm 'tiểu đoàn pháp sư trên không' và chỉ thị cho các binh sĩ còn lại tập trung nghỉ ngơi hồi phục."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000010"
    locked: "Khóa cụm 'Vị trung tá điềm tĩnh', tên 'Lergen', cụm 'người lính Đế quốc' và các đại từ 'cô', 'mình'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000011"
    locked: "Khóa các đại từ 'cô', 'anh' và cấu trúc phủ định 'khiến anh không tài nào phớt lờ được' đối với ánh nhìn của Tanya."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000012"
    locked: "Khóa dấu ba chấm mở đầu, tên 'Đế quốc', 'Lergen', 'Văn phòng Bộ Tổng tham mưu', 'Romel', đại từ 'mình' và sắc thái tình thái 'có lẽ mình nên nói rõ hơn'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000013"
    locked: "Khóa đại từ 'tôi' và danh xưng 'Trung tá' khi Lergen gọi Tanya."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000014"
    locked: "Khóa lời đáp hỏi lại lễ phép '“Vâng, thưa Đại tá?”'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000015"
    locked: "Khóa các đại từ 'chúng ta', 'Tôi', 'cô' và hai lời dặn: giữ không trượt qua bờ vực, hạn chế tối đa những quyết định táo bạo và nóng vội."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000016"
    locked: "Khóa danh xưng 'Thưa Đại tá', đại từ 'tôi', 'mình' và cam kết thực thi nhiệm vụ trong phạm vi thẩm quyền được giao."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000017"
    locked: "Khóa tên 'Lergen', đại từ 'cô', 'mình' và mệnh đề phủ định 'không còn là một sĩ quan cần phải cam đoan với bất kỳ ai rằng mình sẽ hoàn thành bổn phận nữa'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000018"
    locked: "Khóa tên 'Lergen', các đại từ 'cô', 'mình', 'Anh' và sự đồng cảm của Lergen trước thái độ vạch ranh giới chỉ làm một người lính, ghét chính trị."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000019"
    locked: "Khóa định danh đầy đủ 'Trung tá Tanya von Degurechaff', cặp đại từ 'tôi/mình' – 'cô' và hình ảnh ẩn dụ 'khứu giác nhạy bén đáng kinh ngạc'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000020"
    locked: "Khóa cặp xưng hô kính trọng 'ngài' – 'thưa Đại tá' trong câu hỏi lại của Tanya."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000021"
    locked: "Khóa đại từ 'Anh', 'mình' và hình ảnh so sánh 'Một con chó săn mang khứu giác của chó săn âu cũng là lẽ tự nhiên.'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000022"
    locked: "Khóa mức độ phỏng đoán 'Rất có thể', đại từ 'cô', 'họ' và thuật ngữ 'Kế hoạch B'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000023"
    locked: "Khóa tên 'Lergen', 'Tham tán Conrad', các đại từ 'mình', 'Anh', 'cô' và ý tự nghiệm cần học lại cách giải thích cho người ngoại đạo."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000024"
    locked: "Khóa 'Đại tá Lergen', 'Degurechaff', các đại từ 'Anh', 'cô' và hành động nén tiếng cười tự giễu để quay lại công việc trước mắt."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000025"
    locked: "Khóa cặp đại từ 'tôi' – 'cô' và yêu cầu thực hiện công việc đồng thời tuân thủ nghiêm ngặt lịch trình."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000026"
    locked: "Khóa câu đáp '“Rõ, thưa Đại tá. Lịch trình đó thế nào ạ?”'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000027"
    locked: "Khóa cặp đại từ 'Tôi' – 'cô', các định danh 'mặt trận phía đông', 'Tướng Rudersdorf', 'Tướng Zettour', 'đế đô' và đúng trình tự bốn chặng di chuyển trong lịch trình."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000028"
    locked: "Khóa dòng tiêu đề chuyển cảnh viết hoa 'SAU ĐÓ, TẠI PHÒNG KHÁNH TIẾT CỦA VĂN PHÒNG BỘ TỔNG THAM MƯU'."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000029"
    locked: "Khóa cụm 'Phòng khánh tiết tại Văn phòng Bộ Tổng tham mưu' và nhận định khuynh hướng tập trung sau bữa trưa đang nhanh chóng trở thành thông lệ."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000030"
    locked: "Khóa cấu trúc phủ định về những người không biết đến thời kỳ trước chiến tranh."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000031"
    locked: "Khóa điểm nhìn 'theo những gì Tướng Romel được biết', cụm 'phòng khánh tiết của Văn phòng Bộ Tổng tham mưu' và chi tiết khét tiếng phục vụ những bữa ăn có mùi vị tệ nhất thế giới."
  - segment_id: "YS-LN10/Text/chapter006.xhtml/p000032"
    locked: "Khóa mệnh đề nhượng bộ 'Cho dù... đi chăng nữa', cụm 'các sĩ quan tham mưu cao cấp' và hệ quả quá bận rộn trước cục diện chiến sự biến đổi khôn lường nên chỉ ăn vội ở mức tối thiểu."
