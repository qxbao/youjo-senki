findings:
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000014"
    severity: "minor"
    issue: "Cụm ẩn dụ ở câu cuối p000014 ('một ngọn hải đăng hy vọng nhỏ nhoi') và phần nối tiếp ở đầu p000015 ('Dẫu là một ngọn hải đăng…') dịch danh từ chỉ ngọn đèn/ánh sáng dẫn đường thành 'ngọn hải đăng'; khi đi kèm tính từ 'nhỏ nhoi', hình ảnh một công trình hải đăng đồ sộ trở nên hơi vênh về mặt liên tưởng trong tiếng Việt."
    basis: "Đối chiếu mạch ẩn dụ liên kết giữa p000014 và p000015 cùng nguyên tắc kết hợp từ tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'một ngọn đèn hy vọng nhỏ nhoi' (hoặc 'một đốm sáng hy vọng nhỏ nhoi') ở p000014 và chỉnh tương ứng ở đầu p000015 ('Dẫu là một ngọn đèn dẫn đường…' / 'Dẫu là một đốm sáng…') để hình ảnh vừa khớp kích thước 'nhỏ nhoi' vừa giữ trọn nghĩa biểu trưng."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000019"
    severity: "minor"
    issue: "Cụm 'trút bỏ được một gánh nặng áp lực rất lớn' ở câu cuối ghép trực tiếp hai danh từ đồng nghĩa ('gánh nặng' và 'áp lực') khiến diễn đạt hơi trùng lặp."
    basis: "Đối chiếu câu cuối p000019 và nguyên tắc viết tiếng Việt tự nhiên, rõ ràng trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc gọn lại thành 'trút bỏ được một phần lớn áp lực cho vị tướng' hoặc 'trút bỏ được một gánh nặng rất lớn cho vị tướng'."
