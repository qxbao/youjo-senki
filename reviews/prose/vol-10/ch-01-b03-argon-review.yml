locked_choices:
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000067"
    locked: "Khóa cụm 'lũ đần độn' (nối tiếp p000066 của lô trước) và câu hỏi trực tiếp 'Thế rút cuộc lũ đần độn đó là ai?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000068"
    locked: "Khóa đại từ số nhiều 'các ông' (chỉ giới sĩ quan Bộ Tổng tham mưu) và cụm 'những người dân thường mà các ông vốn ghét cay ghét đắng ấy'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000069"
    locked: "Khóa 'Lergen', 'vị tham tán', đại từ 'Anh ta' (chỉ Conrad dưới góc nhìn của Lergen) và phủ định tuyệt đối 'chưa từng có suy nghĩ như vậy về quần chúng nhân dân dù chỉ một lần'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000070"
    locked: "Khóa danh xưng 'thưa Đại tá', cặp xưng hô 'tôi' – 'ông' và câu hỏi phỏng đoán 'tôi đoán là ông không đồng tình với đánh giá của tôi nhỉ?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000071"
    locked: "Khóa đại từ 'Tôi', 'mình' và phủ định 'chưa từng coi thường bất kỳ ai vì xuất thân tầng lớp cả'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000072"
    locked: "Khóa 'Tham tán Conrad' và chi tiết cử chỉ 'đưa tay lên vuốt cằm, nở một nụ cười toe toét trên môi với vẻ hoài nghi không chút giấu giếm'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000073"
    locked: "Khóa đại từ 'ông' và giọng điệu mỉa mai của Conrad ('chẳng ngại giải thích đi giải thích lại...', 'hiểu thấu đáo thứ mà họ mới chỉ nắm được một mảnh vụn nhỏ nhoi thôi, đúng chứ? Quả là một nhà giáo dục xuất sắc')."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000074"
    locked: "Khóa sự phân biệt đại từ 'Anh ta' (Conrad) và 'Anh' (Lergen), tên 'Lergen', chức danh 'các sĩ quan tham mưu' và chi tiết 'lĩnh hội và ghi nhớ thông tin chỉ sau một lần nghe duy nhất'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000075"
    locked: "Khóa đại từ 'Họ' và chuẩn đánh giá 'hoàn toàn dựa trên mức độ hiệu quả khi xử lý công việc'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000076"
    locked: "Khóa 'sĩ quan tham mưu', đại từ 'Anh', 'họ' và cấu trúc phủ định kép 'không thể phủ nhận rằng họ luôn mải mê cắt bỏ mọi chi tiết rườm rà ở bất cứ đâu có thể'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000077"
    locked: "Khóa cặp xưng hô 'tôi' – 'ông', đại từ số nhiều 'các ông' và phạm vi giới hạn 'chỉ trở thành vấn đề đối với các ông khi phải làm việc với các tổ chức bên ngoài'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000078"
    locked: "Khóa cặp xưng hô 'tôi' – 'ông', đại từ 'mình' và lời thừa nhận của Lergen rằng các đồng nghiệp của mình đều là những người có năng lực giao tiếp vô cùng xuất sắc."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000079"
    locked: "Khóa 'Trung tá Degurechaff', đại từ 'Cô' / 'cô' (chỉ Tanya dưới góc nhìn của Lergen), 'anh' (Lergen) và 'Đại tá Calandro của Ildoa'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000080"
    locked: "Khóa đại từ 'anh' cùng hai cấp trên 'Trung tướng Zettour và Trung tướng Rudersdorf'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000081"
    locked: "Khóa 'Lergen', đại từ 'anh', 'Trung tá Uger' và phủ định 'chưa bao giờ phải nói thêm bất kỳ chi tiết thừa thãi nào'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000082"
    locked: "Khóa đại từ 'anh' và nhận định 'Cả cấp trên lẫn cấp dưới của anh đều rất nhạy bén.'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000083"
    locked: "Khóa đại từ 'họ', cụm 'ngôn ngữ chung' (lingua franca), 'những chiến thuật chung' và 'niềm tự hào chung đối với bổn phận của mình'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000084"
    locked: "Khóa 'Tham tán Conrad', 'Lergen', đại từ 'anh' và cụm 'thực trạng hiện nay' (status quo)."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000085"
    locked: "Khóa đại từ 'ông', 'chúng ta' và câu hỏi nghi vấn phủ định '…Vậy ý ông là chúng ta vẫn chưa trao đổi thông tin đủ nhiều sao?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000086"
    locked: "Khóa đại từ 'Tôi', 'Bộ Ngoại giao chúng tôi', cấu trúc phủ định kép 'không phải là không có lỗi' và nhận định 'Việc trao đổi thông tin vốn đã yếu kém trên mọi phương diện.'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000087"
    locked: "Khóa 'Tham tán Conrad' và hành động lục tìm chiếc hộp nhỏ từ túi áo trong trước khi rút ra một điếu xì gà."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000088"
    locked: "Khóa đại từ 'Anh ta' (Conrad), tên 'Lergen' và mệnh đề chêm '—như thể muốn bày tỏ thiện chí bằng hữu—'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000089"
    locked: "Khóa lời mời lịch sự 'Ông làm một điếu chứ, thưa Đại tá?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000090"
    locked: "Khóa cặp xưng hô 'tôi' – 'ông' và lời đáp 'Nếu ông đã có nhã ý mời thì tôi rất sẵn lòng.'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000091"
    locked: "Khóa chi tiết 'quà biếu dành cho văn phòng thứ trưởng'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000092"
    locked: "Khóa 'Lergen', 'vị tham tán', sự phân biệt đại từ 'anh ta' (Conrad) và 'anh' (Lergen), tên nước 'Ildoa' và cơ quan 'Văn phòng Bộ Tổng tham mưu'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000093"
    locked: "Khóa cặp xưng hô 'Tôi' – 'ông', đại từ gộp 'chúng ta', 'vị cấp trên phiền phức của mình', 'trên bộ' (the ministry) và sắc thái đùa hóm hỉnh về việc trở thành đồng phạm."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000094"
    locked: "Khóa 'Tham tán Conrad' và sự tương phản 'buông câu bông đùa đó với vẻ mặt vô cùng nghiêm nghị'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000095"
    locked: "Khóa đại từ 'anh ta' (Conrad), tên 'Lergen' và chi tiết 'bật ra một tiếng cười gượng gạo khi cầm lấy một điếu xì gà'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000096"
    locked: "Khóa đại từ 'Tôi', 'mình', cụm 'ngành ngoại giao' (diplomatic corps) và phủ định 'chưa từng nghĩ sẽ có ngày...'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000097"
    locked: "Khóa 'Tham tán Conrad' và cử chỉ 'vỗ hai bàn tay vào nhau tỏ ý hoàn toàn tán đồng, rồi lộ vẻ hài lòng trên gương mặt'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000098"
    locked: "Khóa cặp xưng hô 'Tôi' – 'ông', 'cả hai chúng ta', 'thiện chí hợp tác từ phía các ông' và câu hỏi cuối đoạn 'Tôi nói có sai không, thưa Đại tá?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000099"
    locked: "Khóa cặp xưng hô 'Tôi' – 'ông', đại từ 'chúng ta' và câu hỏi phản biện 'nhưng chẳng phải những gì chúng ta thu về được sẽ quan trọng hơn là ý định của chúng ta sao?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000100"
    locked: "Khóa danh xưng 'thưa Đại tá' và lập luận đối lập giữa 'Ý chí' / 'chủ đích' và 'năng lực' ('Ý chí quả thực luôn đi trước năng lực... Có năng lực mà không có chủ đích thì còn tệ hơn cả vô dụng')."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000101"
    locked: "Khóa 'Tham tán Conrad' và chi tiết 'khẽ bật cười khúc khích'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000102"
    locked: "Khóa cặp xưng hô 'Ông' – 'tôi', cụm 'những người tiền nhiệm của tôi' và nhận định 'Trên giấy tờ, bọn họ đều là một tập hợp gồm toàn những người có năng lực.'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000103"
    locked: "Khóa đại từ 'Anh ta' (Conrad) và phép so sánh 'như thể đang điểm tên bảy đức hạnh'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000104"
    locked: "Khóa đại từ 'bọn họ', 'Ông', cụm 'nhà ngoại giao cao quý đặt trọn niềm tin vào thị trường tự do và hệ thống tư pháp' và câu phủ định tăng tiến 'Ông chẳng thể đòi hỏi một nhóm người nào tốt hơn thế được nữa.'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000105"
    locked: "Khóa đại từ 'Anh ta', 'mình' và chuỗi cử chỉ 'cụp hết các ngón tay xuống trừ một ngón, rồi dùng ngón tay đó gõ vào đầu mình với vẻ mặt vô cùng nghiêm nghị'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000106"
    locked: "Khóa nhận định 'Tất cả bọn họ đều thiếu động lực phấn đấu.' và câu hỏi 'Tôi đoán cơ quan của ông cũng đang khổ sở vì một vấn đề tương tự nhỉ?'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000107"
    locked: "Khóa đại từ 'Tôi', 'chúng tôi', cụm 'cuộc đối đầu ban đầu' và tên 'Liên minh Hiệp ước'."
