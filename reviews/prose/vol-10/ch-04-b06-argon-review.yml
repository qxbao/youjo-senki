  - segment_id: YS-LN10/Text/chapter022.xhtml/p000005
    severity: minor
    category: prose_naturalness
    issue: "Tại p000005, câu 'Bảo hiểm chỉ đúng là như thế—bảo hiểm mà thôi.' bám sát cấu trúc nhấn mạnh của nguồn nhưng kết hợp từ 'chỉ đúng là như thế' hơi gượng trong tiếng Việt."
    recommendation: "Có thể giữ nguyên vì không sai nghĩa, hoặc tinh chỉnh nhẹ ở bước polish thành 'Bảo hiểm đúng là như thế—chỉ là bảo hiểm mà thôi.' hoặc 'Bảo hiểm suy cho cùng cũng chỉ là như thế—bảo hiểm mà thôi.'."
  - segment_id: YS-LN10/Text/chapter022.xhtml/p000007
    severity: minor
    category: collocation
    issue: "Tại p000007, thuật ngữ 'insurance fraud' đang dịch là 'trục lợi bảo hiểm gian lận', hơi trùng ý giữa 'trục lợi' và 'gian lận' và lặp lại từ 'trục lợi' vừa dùng cho 'capitalize on' ở p000006."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước polish thành 'gian lận bảo hiểm' (và tại p000006 có thể cân nhắc 'kiếm lời từ' / 'tận dụng' hoặc giữ 'trục lợi từ' đều đạt)."
