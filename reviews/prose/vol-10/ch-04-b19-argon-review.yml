findings:
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000447"
    severity: "minor"
    issue: "Mệnh đề phụ dùng liên tiếp ba đại từ ngôi thứ ba số nhiều ('khiến chúng tưởng rằng họ đang cố buộc chúng phải rút bớt quân khỏi tiền tuyến'), trong đó 'họ' quy chiếu về danh từ tập hợp số ít 'Đế quốc' ở đầu câu, làm nhịp câu hơi rối."
    basis: "Đối chiếu mạch quy chiếu chủ thể tại p000447 và nguyên tắc viết tiếng Việt tự nhiên, rõ ràng trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể thay 'họ' bằng 'Đế quốc' hoặc 'phe ta' ('khiến chúng tưởng rằng Đế quốc đang cố buộc chúng...') để phân tách chủ thể rõ hơn."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000465"
    severity: "minor"
    issue: "Ở câu đầu tiên, chủ ngữ chỉ vật ('những đôi giày ủng da ấy') đi với động từ 'đặt chân lên mặt đất' tạo cảm giác hơi lệch kết hợp từ trong tiếng Việt."
    basis: "Đối chiếu hình ảnh hoán dụ tại p000465 và nguyên tắc ưu tiên kết hợp từ tiếng Việt tự nhiên trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể chỉnh nhẹ thành 'khi những đôi ủng da ấy giẫm lên mặt đất' hoặc 'bước lên mặt đất'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000473"
    severity: "minor"
    issue: "Từ 'bất ngờ' lặp lại ở hai câu liên tiếp ('Chà, thật bất ngờ đấy' và 'nhưng phản ứng của Visha lại làm mình bất ngờ'), trong khi câu sau diễn tả sắc thái bị bất ngờ đến mức không lường trước."
    basis: "Đối chiếu sắc thái từ vựng tại p000473 và hướng dẫn văn phong trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể đổi cụm thứ hai thành 'lại làm mình không kịp trở tay' hoặc 'lại khiến mình hơi sững người' để tránh lặp từ."
