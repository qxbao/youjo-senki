      - "Khóa hai danh xưng 'Đại tá Mikel' và 'Trung tá Drake', thuật ngữ 'hai hệ thống chỉ huy' và nhận định về nỗi bất an thường trực cố hữu khi tồn tại hai đầu mối chỉ huy có nguy cơ xung đột; không dùng nhấn mạnh Markdown cho thẻ neo trang."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000291"
    locks:
      - "Khóa định danh 'Drake' và cảnh các đơn vị của anh đồng loạt khai hỏa với đường ngắm thảm hại."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000292"
    locks:
      - "Khóa đại từ 'ta' / 'chúng ta' và 'chúng' trong lời than chửi thề về độ cơ động vượt quá sức đối phó của quân địch."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000293"
    locks:
      - "Khóa đại từ 'Anh' và hành động tự kìm lời nhận xét về khả năng phối hợp vượt trội của đối phương."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000294"
    locks:
      - "Khóa thuật ngữ 'đồng đội cùng biên đội', định danh 'Drake' và sự kinh ngạc trước trình độ kỹ thuật điêu luyện của hai pháp sư đối phương."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000295"
    locks:
      - "Khóa nhận định cảm thán về khả năng nhận thức tình huống, không gian vô song và sự phối hợp gần như siêu phàm của đối phương."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000296"
    locks:
      - "Khóa câu thoại bỏ lửng kinh ngạc trước độ cao và tốc độ của địch."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000297"
    locks:
      - "Khóa định danh 'Drake', thuật ngữ 'Pháp sư Định danh', danh xưng 'Trung úy Sue', thuật ngữ 'hỏa lực yểm trợ' và nhận định loạt bắn hỗ trợ của đơn vị anh không đủ để bắn trúng kẻ địch."
