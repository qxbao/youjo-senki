findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000271"
    severity: "minor"
    issue: "Câu thứ hai dịch cấu trúc 'makes us proper human beings' thành 'Chính điều đó làm nên những con người đúng nghĩa như chúng ta', hơi chuyển sắc thái từ mệnh đề tác động chung ('biến chúng ta thành / giúp chúng ta trở thành những con người đúng nghĩa') sang lối tự ví von ('như chúng ta')."
    basis: "Đối chiếu nguyên tắc giữ đúng sắc thái và quan hệ nghĩa trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'Chính điều đó mới làm nên những con người đúng nghĩa như chúng ta' hoặc 'Chính điều đó biến chúng ta thành những con người đúng nghĩa'; không làm lệch ý mạch văn nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000284"
    severity: "minor"
    issue: "Cụm thành ngữ kết hợp nghĩa đen 'a literal bolt from the blue' được dịch là 'tiếng sét đánh ngang tai theo đúng nghĩa đen'; trong tiếng Việt, 'sét đánh giữa trời quang' sẽ khớp trực tiếp hơn với hình ảnh hai pháp sư bổ nhào từ bầu trời xanh xuống theo cả nghĩa bóng lẫn nghĩa đen."
    basis: "Đối chiếu nguyên tắc ưu tiên kết hợp từ tiếng Việt tự nhiên và giữ đúng hình ảnh bản gốc trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'chẳng khác nào tia sét giáng xuống giữa trời quang theo đúng nghĩa đen'; không làm sai nghĩa câu nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000294"
    severity: "minor"
    issue: "Liên từ 'thế mà vẫn có thể' nối giữa việc luôn nắm chắc vị trí của đồng đội cùng biên đội với việc di chuyển nhịp nhàng và bọc lót cho nhau dễ gây cảm giác nghịch lý nhẹ trong tiếng Việt, vì hai vế này vốn bổ trợ thuận chiều cho khả năng phối hợp bay."
    basis: "Đối chiếu nguyên tắc viết tiếng Việt tự nhiên, rõ ràng và giữ đúng quan hệ logic giữa các mệnh đề trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'đồng thời vẫn có thể di chuyển nhịp nhàng ăn ý và bọc lót cho nhau'; không làm sai nghĩa nên không bắt buộc sửa bản chuẩn."
