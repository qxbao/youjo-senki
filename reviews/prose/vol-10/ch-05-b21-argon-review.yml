findings:
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000773"
    severity: "minor"
    category: "word_choice"
    issue: "Tính từ chỉ trạng thái tàu địch bên dưới đang lộ sơ hở/dễ bị công kích sau khi mất lực lượng pháp sư bảo vệ trên không được dịch thành 'đã mất khả năng phòng bị', hơi mạnh hơn sắc thái gốc vì bản thân tàu chiến vẫn còn hỏa lực phòng không."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'Đám tàu chiến bên dưới đang lộ sơ hở!' hoặc 'Đám tàu chiến bên dưới đã mất lớp che chắn!'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000800"
    severity: "minor"
    category: "word_choice"
    issue: "Động từ chỉ máu chảy thành dòng từ nắm đấm của Romel đang được dịch là 'rỉ ra', làm giảm nhẹ mức độ dữ dội của hành động nện tay xuống bàn liên tiếp."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'dòng máu đang chảy ra từ nắm đấm' hoặc 'dòng máu đang tứa ra từ nắm đấm'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000806"
    severity: "minor"
    category: "tense_modality"
    issue: "Câu thứ hai nối tiếp mạch nhận thức sau khi kế hoạch đã thất bại (p000802), nên cụm 'chỉ hy vọng rằng kế hoạch sẽ diễn ra' nếu thiếu từ chỉ thời gian quá khứ có thể khiến người đọc hiểu nhầm là Romel hiện vẫn đang hy vọng."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'Trung tướng Romel vốn chỉ hy vọng rằng kế hoạch sẽ diễn ra chí ít được một nửa như dự tính mà thôi.'"
