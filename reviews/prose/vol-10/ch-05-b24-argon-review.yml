locked_choices:
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000064"
    locked: "Khóa đại từ trần thuật 'ông' (chỉ Romel) và câu hỏi phương thức 'Nhưng ông sẽ truyền tin đi bằng cách nào đây?'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000065"
    locked: "Khóa đại từ 'Ông' và giữ đúng phạm vi nhấn mạnh Markdown '*Đúng vậy—đây chính là vấn đề bao trùm lên tất cả.*' theo DEC-P01-002."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000066"
    locked: "Khóa đại từ 'Ông', 'mình' và quan hệ mục đích 'để giữ cho mình khỏi bị choáng váng'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000067"
    locked: "Khóa 'hệ thống mã hóa của Đế quốc', 'điện đài', 'sĩ quan đồng ngũ', phủ định 'không thể sử dụng điện đài' và điều kiện 'Nếu muốn cẩn trọng, ông cần phải trực tiếp chuyển thông điệp...'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000068"
    locked: "Khóa đại từ 'ông', hai câu hỏi tu từ về sự tin cậy, tình thái 'có thể đã xảy ra rò rỉ thông tin' và phủ định 'chẳng có biện pháp đề phòng nào là quá thừa thãi'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000069"
    locked: "Khóa cấu trúc so sánh hơn 'Đáng sợ hơn cả là khả năng...' và cụm 'trao thông tin tối quan trọng vào thẳng tay gián điệp của địch'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000070"
    locked: "Khóa 'sở chỉ huy cơ động', 'các biện pháp phản gián', 'căn cứ tác chiến', đại từ 'ông' và giả định bổ sung 'khả năng kẻ địch chỉ đơn thuần đang khai thác một lỗ hổng nào đó trong hệ thống của họ…'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000071"
    locked: "Giữ câu cảm thán trong thoại độc thoại của Romel: '“Khốn kiếp thật!”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000072"
    locked: "Khóa đại từ 'Ông', phép so sánh với trải nghiệm 'ngoài sa mạc khi lính bắn tỉa của địch luôn là mối đe dọa thường trực' và thế đối lập 'biết rõ có kẻ địch đang rình rập ngay gần đó, nhưng lại chẳng biết làm cách nào để xác định vị trí của chúng!'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000073"
    locked: "Khóa đại từ 'ông' và hình ảnh so sánh 'như đang có một họng súng dí sát vào đầu ông vậy'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000074"
    locked: "Khóa đại từ 'ông', ẩn dụ 'chẳng khác nào bia tập bắn—một con mồi hoàn hảo cho gã thợ săn đói khát đang rình mò kiếm bữa tối' và nhận định 'chỉ còn là vấn đề thời gian mà thôi'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000075"
    locked: "Giữ câu thoại bỏ lửng '“Với tình hình như hiện tại…”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000076"
    locked: "Khóa phủ định 'Đây không còn là vấn đề chiến lược nữa.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000077"
    locked: "Khóa phép so sánh hơn nối tiếp 'Mà là một điều đơn giản hơn nhiều.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000078"
    locked: "Khóa 'Kế hoạch B' và tình thái bỏ lửng '“Ngay cả Kế hoạch B cũng có thể…”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000079"
    locked: "Khóa đúng phạm vi nhấn mạnh Markdown '*…đang gặp nguy hiểm*' theo DEC-P01-002, đại từ 'ông' và phủ định hệ quả 'không sao thốt nên trọn vẹn cả câu'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000080"
    locked: "Khóa 'Kế hoạch B', 'Đế quốc', mức độ bắt buộc 'buộc phải được giữ bí mật bằng mọi giá' và câu điều kiện giả định 'Nếu tin tức về việc nó đang được triển khai bị lộ ra ngoài, điều đó có thể đặt dấu chấm hết cho chính Đế quốc.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000081"
    locked: "Giữ nguyên hai câu hỏi liên tiếp về xác suất tin tức đã lọt đến tai kẻ địch và khả năng địch lấy được thông tin như vậy giữa cuộc chiến."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000082"
    locked: "Giữ nhịp cảm thán dồn dập trong thoại của Romel: '“…A, chết tiệt, chết tiệt, chết tiệt thật mà.”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000083"
    locked: "Khóa đại từ 'Ông', 'mình' và trình tự hành động từ lúc choáng váng, bấu víu lấy ghế rồi ngã quỵ xuống sàn nhìn trân trân lên trần nhà."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000084"
    locked: "Khóa đại từ 'ông', phủ định 'Trong văn phòng của ông vốn chẳng hề nóng bức' và nguyên nhân cơn vã mồ hôi bắt nguồn từ cảm giác lạnh toát chạy dọc sống lưng cùng nhịp tim đập không ngừng."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000085"
    locked: "Khóa đại từ 'ông' và quan hệ tương phản giữa việc đã kiểm soát lại được nhịp thở sau hai hơi hít sâu với việc cơ thể vẫn run rẩy không ngừng."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000086"
    locked: "Khóa 'Romel', cấp bậc 'thiếu úy', đại từ 'Ông', phủ định 'chưa bao giờ cảm thấy nỗi sợ hãi nào như thế trước đây, ngay cả khi ở trên chiến trường' và phép so sánh hơn 'căng thẳng hơn cả lúc phát mệnh lệnh đầu tiên khi còn là một thiếu úy'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000087"
    locked: "Khóa đại từ 'ông', sự đối lập thời gian 'Trước đây... Nhưng giờ đây...' và phủ định nhấn mạnh 'Những sai sót đơn thuần trong khâu lập kế hoạch giờ chẳng còn bất cứ ý nghĩa gì nữa!'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000088"
    locked: "Khóa định danh 'Tướng Romel', đại từ 'ông' và chi tiết sau vài lần châm lửa bất thành chỉ biết ngồi đờ ra đó với điếu thuốc kẹp giữa hai làn môi."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000089"
    locked: "Khóa đúng phạm vi nhấn mạnh Markdown '*Đúng là một cơn ác mộng.*' theo DEC-P01-002."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000090"
    locked: "Giữ câu thoại ngắn '“Quên chuyện chính trị đi.”'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000091"
    locked: "Khóa 'Đế quốc' và câu điều kiện giả định 'Nếu Đế quốc thực sự đã bị gián điệp của địch thâm nhập, thì điều đó có thể mang lại tai họa khôn lường cho họ.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000092"
    locked: "Khóa 'Văn phòng Bộ Tổng tham mưu', 'lục quân', phủ định 'không còn khả năng tiếp tục cuộc chiến' và hai câu hỏi giả định liên tiếp."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000093"
    locked: "Khóa sắc thái tình thái 'có lẽ sẽ' trong câu 'Cả thế giới có lẽ sẽ hợp lực lại để nhanh chóng đặt dấu chấm hết cho cuộc chiến của họ.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000094"
    locked: "Khóa phủ định 'Không. Mọi chuyện sẽ không chỉ dừng lại ở đó.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000095"
    locked: "Khóa 'Đế quốc', phép so sánh hơn 'mang tính định đoạt hơn nhiều...', mức độ chắc chắn 'chắc chắn chúng sẽ áp đặt những điều khoản trói buộc hà khắc...' và nhận định 'Tình hình đang xấu đi ở mức có thể đo đếm rõ ràng và với tốc độ chóng mặt.'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000096"
    locked: "Khóa 'Ildoa', 'giữ thái độ trung lập', định danh 'Trung tướng Romel', đại từ 'ông' và mốc không gian 'khi ông còn ở dưới miền nam'."
  - segment_id: "YS-LN10/Text/chapter026.xhtml/p000097"
    locked: "Khóa đại từ 'chúng ta', tên riêng 'Ildoa' và câu hỏi giả định trong thoại '“Nhỡ đâu chúng ta phải giao chiến với cả Ildoa thì sao…?”'."
