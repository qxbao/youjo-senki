findings:
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000096"
    severity: "minor"
    issue: "Chính tả tiếng Việt chuẩn của từ chỉ trạng thái sắp bật ra hoặc trào ra ở đầu lưỡi là 'chực trào' thay vì 'trực trào'."
    basis: "Quy tắc chính tả tiếng Việt và ngữ cảnh mô tả ba chữ suýt buột ra khỏi đầu lưỡi tại p000096."
    recommendation: "Ở bước chuốt văn có thể chỉnh nhẹ 'trực trào' thành 'chực trào'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000099"
    severity: "minor"
    issue: "Trong lời thoại của Tanya với Tướng Romel, câu thứ ba dùng 'Tôi tự tin rằng chúng tôi có thể...' nhưng cuối câu lại dùng 'mà mình đang có', tạo sự pha trộn nhẹ giữa đại từ thoại ('tôi'/'chúng tôi') và đại từ phản thân ('mình') vốn dùng cho độc thoại nội tâm."
    basis: "Đối chiếu quy ước đại từ nội tâm trong DEC-P01-001 và hệ xưng hô trong thoại cấp dưới – cấp trên giữa Tanya và Tướng Romel."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'mà chúng tôi đang có' hoặc 'hiện có' để giữ thuần nhất hệ đại từ trong lời thoại."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000112"
    severity: "minor"
    issue: "Ở câu cuối, đại từ phản thân 'mình' trong cụm 'sẵn lòng giúp đỡ mình' quy chiếu về gia tộc Oda (ngôi thứ ba số nhiều), dễ trùng bề mặt với đại từ tự xưng 'mình' trong độc thoại nội tâm của Tanya ở các câu kế tiếp."
    basis: "Đối chiếu quy ước đại từ nội tâm trong DEC-P01-001 và mạch độc thoại so sánh giữa Đế quốc với gia tộc Oda tại p000112–p000113."
    recommendation: "Ở bước chuốt văn có thể đổi 'giúp đỡ mình' thành 'giúp đỡ họ' để phân tách rõ chủ thể ngôi thứ ba với đại từ nội tâm của Tanya."
