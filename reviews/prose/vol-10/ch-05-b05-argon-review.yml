  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000147"
    locks:
      - "Khóa tên riêng 'Drake', đơn vị 'đại đội', chi tiết quan sát 'đôi vai họ rõ ràng vẫn thiếu đi vẻ căng thẳng', phủ định một phần 'Điều đó không hẳn là xấu' và giả định trái thực tế trong quá khứ 'nhưng chắc chắn chuyện sẽ chẳng như vậy nếu những người lính này từng tận mắt chứng kiến con ác quỷ kia'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000148"
    locks:
      - "Khóa đại từ 'Anh', 'họ' và tính tất yếu phải cảnh báo rằng thuộc cấp sắp phải chiến đấu giành giật mạng sống của chính mình."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000149"
    locks:
      - "Khóa cụm 'trận chiến một mất một còn đầy tàn khốc', chỉ dẫn 'Hãy coi kẻ địch như những con ác quỷ thực thụ' và lời răn 'Đừng để vẻ bề ngoài của chúng đánh lừa'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000150"
    locks:
      - "Khóa câu hỏi xác nhận của người lính thuộc cấp với đại từ 'Chúng ta' và đối tượng quy chiếu là 'con bé nhỏ nhắn đó'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000151"
    locks:
      - "Khóa lời khẳng định của Drake với đại từ tự xưng 'tôi', đại từ quy chiếu 'ả', sự tương phản giữa ngoại hình 'giống một bé gái' và bản chất 'một con quái vật nhỏ xảo quyệt'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000152"
    locks:
      - "Khóa tên riêng 'Drake', cụm 'các chiến hữu của mình' và phản ứng trái ngược của họ khi tưởng anh nói đùa rồi cười xòa cho qua."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000153"
    locks:
      - "Khóa câu đáp mang tính hoài nghi bông đùa của người lính và câu hỏi trêu chọc về việc 'Trung tá ở miền đông lâu quá rồi'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000154"
    locks:
      - "Khóa chi tiết 'Nỗi lo âu đã hoàn toàn tan biến khỏi người lính đó', quan sát của Drake qua tư thế thuộc cấp và nhận thức rõ đối thủ sẽ vô cùng khó nhằn ngay cả với 'những cựu binh này'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000155"
    locks:
      - "Khóa cách gọi 'những người anh em pháp sư hải quân đánh bộ của tôi', cặp đại từ 'Tôi' - 'các anh', nhận thức của Drake về lời lẽ 'trái ngược với phong thái quý ông', mệnh lệnh không được do dự trước phụ nữ ('buộc phải giết chúng nếu không muốn mất mạng') và chỉ thị dứt khoát bắn hạ ngay lập tức nếu phát hiện một bé gái trên bầu trời."
