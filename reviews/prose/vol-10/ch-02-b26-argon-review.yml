locked_choices:
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000001"
    locked: "Khóa cách xưng hô 'Thưa Tướng quân', đại từ 'ngài' và lời thỉnh cầu 'xin ngài hãy cân nhắc lại việc tấn công chính diện'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000002"
    locked: "Khóa nhấn mạnh Markdown '*Đừng có viện cớ nữa*' theo DEC-P01-002, tình thái 'ánh mắt của vị tướng dường như muốn nói vậy' và chủ thể 'viên sĩ quan phản đối'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000003"
    locked: "Khóa thuật ngữ 'tuyến tiếp vận của địch', cách xưng hô 'ngài', 'thưa Tướng quân' và nội dung 'Đây là cơ hội tuyệt vời nhất để đánh vào tuyến tiếp vận của địch!'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000004"
    locked: "Khóa cặp đại từ 'tôi - anh' của Zettour với sĩ quan cấp dưới và câu hỏi 'Anh có thích chơi poker không?'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000005"
    locked: "Khóa câu hỏi ngắn thể hiện sự bất ngờ lễ phép của viên sĩ quan: '“Sao cơ ạ?”'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000006"
    locked: "Khóa đại từ 'anh', chi tiết 'đem số xì gà của mình ra đặt cược' và ý 'học được đôi điều về việc đánh giá quá cao hay quá thấp bài trên tay mình khi có thứ gì đó để mất'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000007"
    locked: "Khóa chủ thể khái quát 'người chơi' đối lập với 'đối thủ', cùng chuỗi danh ngữ 'trò chơi của sự phỉnh gạt, đọc vị lẫn nhau và đánh lừa lẫn nhau'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000008"
    locked: "Khóa cấu trúc bổ sung 'Không những thế, trong đó còn có cả yếu tố may rủi nữa.'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000009"
    locked: "Khóa hình ảnh so sánh 'cuộc đấu trí chiến lược với các đối thủ của mình', ẩn dụ 'thước đo đáng tin cậy' và thuật ngữ 'những sĩ quan Bộ Tổng tham mưu có năng lực'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000010"
    locked: "Khóa sự phân biệt đại từ ngôi thứ hai số ít 'Đề xuất của anh' và số nhiều 'Các anh hẳn là mất trí rồi', tên 'Quân đội Liên bang', đại từ 'chúng ta', 'tôi', phủ định 'không bày sẵn một bữa tiệc chào đón' và quyết định 'chọn phương án phục kích', 'đánh tạt sườn chúng mạnh đến mức tống thẳng chúng xuống tầng thứ bảy của địa ngục'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000011"
    locked: "Khóa các chủ thể 'giới phân tích của Liên bang', 'Lực lượng địch', 'Lục quân Đế quốc', 'Trung tá Degurechaff' và quan hệ so sánh 'hệt như Trung tá Degurechaff đã làm'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000012"
    locked: "Khóa nhấn mạnh Markdown '*Thế này thì hoàn hảo*' theo DEC-P01-002 và định danh 'Trung tướng Zettour'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000013"
    locked: "Khóa đại từ trần thuật 'ông' chỉ Zettour, nhận định 'Những vị chỉ huy mẫn cán nhất thường lại là những kẻ dễ bị lừa nhất' và chuỗi ẩn dụ đi săn - làm thịt con mồi."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000014"
    locked: "Khóa chủ thể khái quát 'Người ta ... mình' và luận điểm 'Làm cho kẻ địch tin chắc rằng chúng đã nhốt gọn mình trong bẫy cũng chính là cách tốt nhất để đánh lừa chúng.'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000015"
    locked: "Khóa cách xưng hô 'Thưa Tướng quân', 'ngài', 'chúng tôi', 'chúng ta' và câu hỏi xác nhận hai vế về 'mũi lồi của Quân đội Liên bang' cùng 'tuyến tiếp vận của chúng'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000016"
    locked: "Khóa chủ thể 'Câu hỏi của viên sĩ quan', sắc thái 'âm hưởng hoài nghi lộ liễu' và hình ảnh 'để lại một thứ mùi khó ngửi trong bầu không khí'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000017"
    locked: "Khóa cụm 'kiêu ngạo và khinh địch', tên 'Quân đội Liên bang', đại từ 'anh ta' chỉ viên sĩ quan và nhận định về giới hạn của niềm kiêu hãnh."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000018"
    locked: "Khóa đại từ 'Anh', tên 'Quân đội Liên bang' và câu hỏi chất vấn có phủ định 'không có khả năng làm được chuyện đó đấy à?'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000019"
    locked: "Khóa đại từ 'Tôi', 'chúng ta', 'chúng' và sự đối lập giữa dự đoán tương lai 'Chắc hẳn đến một lúc nào đó chúng cũng sẽ học được lối đánh của chúng ta' với câu hỏi hoài nghi 'nhưng lẽ nào chuyện ấy lại diễn ra sớm đến thế sao ạ?'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000020"
    locked: "Khóa câu đáp ngắn gọn của Zettour: '“Bọn chúng có một người thầy giỏi đấy.”'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000021"
    locked: "Khóa chủ thể 'Viên sĩ quan', 'Trung tướng Zettour', 'Đế quốc' và phủ định 'chẳng phải thực thể duy nhất có khả năng nghiên cứu'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000022"
    locked: "Khóa nhận định khái quát 'Chiến tranh buộc những kẻ tham chiến phải luôn tiếp tục học hỏi.'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000023"
    locked: "Khóa hai mệnh đề cảnh báo về việc ngừng tích lũy chiến thuật mới và quá dựa dẫm vào kinh nghiệm cũ, đại từ 'Ông' chỉ Zettour, cụm 'mặt trận phía đông' và mục tiêu ngăn chặn 'những nhận thức sai lầm'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000024"
    locked: "Khóa cách gọi 'các anh', đại từ 'chúng ta', chủ thể 'Quân đội Liên bang', ẩn dụ trả phí vào trường đại học kinh nghiệm bằng máu và suy luận 'Đến giờ hẳn là chúng cũng phải thu về được thành quả gì đó chứ.'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000025"
    locked: "Khóa cấu trúc nhượng bộ 'Dù Quân đội Liên bang là phần nối dài của một Liên bang cứng nhắc' và phủ định 'cũng không thể áp dụng cùng một lối suy luận ấy trên chiến trường được'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000026"
    locked: "Khóa cách dịch 'một sĩ quan thuộc bộ chỉ huy với vẻ mặt căng thẳng', đại từ 'Anh ta' và tình thế e ngại trước đông đảo cấp trên đang tề tựu."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000027"
    locked: "Khóa định danh 'Trung tướng Zettour' và hành động 'khéo léo lên tiếng hỏi con người tội nghiệp ấy'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000028"
    locked: "Khóa cách gọi cấp dưới trẻ tuổi 'Cậu kia' và câu hỏi 'có chuyện gì thế?'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000029"
    locked: "Khóa nét ngập ngừng 'D-dạ, thưa Tướng quân', đại từ 'Tôi' và thông tin 'Một bức điện từ Trung tá Degurechaff ạ.'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000030"
    locked: "Khóa mệnh lệnh điềm tĩnh của Zettour: '“Tốt. Bình tĩnh rồi đọc cho chúng tôi nghe đi.”'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000031"
    locked: "Khóa nguyên văn ám hiệu trong ngoặc đơn '‘Mặt trời đã xua tan sương mù.’' được lặp lại hai lần, đại từ 'Cô ấy' chỉ Tanya và báo cáo 'đã thành công trong việc nhử quân địch ra rồi, thưa Tướng quân'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000032"
    locked: "Khóa lời khen '“Tuyệt vời.”', tên 'Zettour', danh xưng 'Vị trung tá' chỉ Tanya và nhận định 'lúc nào cũng đạt được thành quả lớn nhất với nguồn lực ít ỏi nhất'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000033"
    locked: "Khóa câu nói ngập ngừng bỏ lửng: '“N-ngoài ra còn có…”'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000034"
    locked: "Khóa nhấn mạnh Markdown '*Lại chuyện gì nữa đây?*' theo DEC-P01-002 và danh xưng 'viên sĩ quan truyền tin'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000035"
    locked: "Khóa nét lắp bắp 'C-cô ấy' và nội dung 'có để lại một lời phàn nàn ạ'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000036"
    locked: "Khóa câu hỏi lặp lại đầy ngạc nhiên của Zettour: '“Một lời phàn nàn ư?”'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000037"
    locked: "Khóa đại từ 'Ông' chỉ Zettour, ẩn dụ 'rơi vào thế bị phục kích' và chủ thể 'viên sĩ quan trẻ'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000038"
    locked: "Khóa đại từ 'Cô ấy' ở phần dẫn và cặp đại từ 'Tôi - ngài' trong lời nhắn của Tanya gửi Zettour: '‘Tôi muốn thỉnh cầu đây sẽ là lần cuối cùng ngài phái tôi đi thực hiện một nhiệm vụ liều lĩnh đến mức này.’'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000039"
    locked: "Khóa đại từ 'Tôi' và cách rào đón giới hạn phạm vi lời hứa của Zettour ở cụm 'cho nỗ lực lần này'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000040"
