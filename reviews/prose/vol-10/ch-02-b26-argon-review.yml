    category: "lexical_nuance"
    issue: "Trong nhận định chiến thuật của Trung tướng Zettour ở p000014, cụm 'Người ta dễ tổn thương nhất là vào lúc tự đinh ninh rằng mình đã dồn được kẻ địch vào đúng nơi mình muốn' hơi nghiêng về sắc thái tâm lý - cảm xúc so với ngữ cảnh bẫy chiến thuật trên chiến trường."
    evidence: "Theo canon/style-guide.md, cần ưu tiên cách kết hợp từ tiếng Việt tự nhiên và đúng bình diện đánh giá theo ngữ cảnh."
    recommendation: "Có thể cân nhắc chỉnh 'dễ tổn thương nhất' thành 'dễ lộ sơ hở nhất' hoặc 'dễ bị tổn thương nhất' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000024"
    related_segment_ids: []
    severity: "minor"
    category: "collocation"
    issue: "Cụm ẩn dụ 'trả học phí nhập trường đại học kinh nghiệm bằng máu' ở p000024 hơi gượng ở kết hợp từ 'học phí nhập trường'."
    evidence: "Theo canon/style-guide.md, ưu tiên kết hợp từ tiếng Việt tự nhiên mà vẫn giữ nguyên hình ảnh ẩn dụ của bản gốc."
    recommendation: "Có thể chỉnh thành 'trả lệ phí nhập học vào ngôi trường đại học kinh nghiệm bằng máu' hoặc 'trả học phí vào trường đại học kinh nghiệm bằng máu' ở bước chuốt văn."
