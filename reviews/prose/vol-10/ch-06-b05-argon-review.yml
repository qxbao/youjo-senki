findings:
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000130"
    severity: "minor"
    issue: "Cụm 'phòng tuyến của ông tỏ ra yếu ớt nhất' hơi mang sắc thái nhân hóa đối với chủ thể vô tri là phòng tuyến."
    basis: "Đối chiếu p000130 và nguyên tắc kết hợp từ tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'phòng tuyến của ông lộ rõ vẻ mỏng yếu nhất' hoặc 'phòng tuyến của ông có vẻ mỏng yếu nhất'."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000138"
    severity: "minor"
    issue: "Đại từ quy chiếu Liên bang ở câu đầu ('chiến thuật của chúng') chuyển đổi hơi đột ngột so với câu ngay trước tại p000137 ('cho thấy họ đang chịu cảnh thiếu hụt quân số')."
    basis: "Đối chiếu mạch quy chiếu Liên bang giữa p000137 và p000138, đồng thời giữ sự phân biệt rõ ràng với chủ thể Lục quân Đế quốc ('họ') ở câu thứ ba của p000138."
    recommendation: "Ở bước chuốt văn, polisher có thể đổi 'chiến thuật của chúng' ở câu đầu p000138 thành 'chiến thuật của phía bên kia' hoặc 'chiến thuật của đối phương' để vừa liền mạch với p000137 vừa không trùng đại từ 'họ' của Lục quân Đế quốc ở cuối đoạn."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000144"
    severity: "minor"
    issue: "Câu độc thoại nội tâm in nghiêng mở đầu bằng đại từ tự xưng 'Mình' ('*Mình thừa biết...*') hơi lệch giọng so với đại từ tự xưng 'Ta' của Trung tướng Zettour ở các câu độc thoại lân cận (p000131, p000142, p000146, p000152, p000154, p000157)."
    basis: "Đối chiếu DEC-P01-001 trong decisions.md (không tự mở rộng quy ước dùng 'mình' của Tanya sang chủ thể khác) và tính nhất quán trong giọng nhân vật của Zettour xuyên suốt chương 6."
    recommendation: "Ở bước chuốt văn, polisher có thể thống nhất thành '*Ta thừa biết là cần phải có thứ gì đó thay đổi!*' để đồng bộ hoàn toàn với giọng độc thoại của Zettour."
