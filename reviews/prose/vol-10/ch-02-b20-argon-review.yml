findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000339"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000344"
      - "YS-LN10/Text/chapter010.xhtml/p000355"
    severity: "minor"
    category: "pronouns_viewpoint"
    issue: "Câu cảm thán đặt trong ngoặc kép (lời buột miệng thành tiếng hướng về phía kẻ địch đang lao tới) đang lược chủ ngữ ngôi thứ hai và dùng đại từ tự xưng nội tâm 'mình' ('“Lao thẳng vào mình sao?!”'), làm nhòa ranh giới giữa lời nói thành tiếng và độc thoại nội tâm."
    evidence: "Theo canon/decisions.md (DEC-P01-001) và canon/style-guide.md, cần phân biệt đại từ trong thoại với đại từ tự quy chiếu trong nội tâm; ở các câu thoại khác trong lô (p000344, p000355), Drake xưng 'tôi' và gọi địch là 'chúng'."
    recommendation: "Có thể chỉnh nhẹ thành '“Chúng định lao thẳng vào tôi sao?!”' hoặc '“Lao thẳng vào tôi sao?!”' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000352"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000344"
    severity: "minor"
    category: "negation_terminology"
    issue: "Phủ định toàn phần đi kèm tình thái biểu kiến trong nguồn đang được dịch giảm nhẹ thành phủ định bộ phận ('dường như chẳng mấy ảnh hưởng'); đồng thời thuật ngữ 'suppressing fire' được dịch là 'làn đạn chế áp' thay vì giữ đồng nhất 'hỏa lực chế áp' như ở p000344."
    evidence: "Theo canon/style-guide.md, cần giữ đúng mức độ phủ định và tính nhất quán thuật ngữ trong cùng cảnh chiến đấu."
    recommendation: "Có thể chỉnh thành 'hỏa lực chế áp dường như không hề ảnh hưởng gì đến sự tự do cơ động của kẻ địch' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000362"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000356"
      - "YS-LN10/Text/chapter010.xhtml/p000361"
    severity: "minor"
    category: "addition"
    issue: "Động từ chỉ việc không trượt mục tiêu ở cuối câu được dịch cụ thể hóa thành 'bắn trượt' ('không tài nào bắn trượt được'), tự thêm nét nghĩa 'bắn' trong khi nguồn chỉ dùng động từ chung và các đoạn p000356, p000361 đang đặt nhân vật vào thế rút kiếm ma pháp cận chiến ở cự ly đấu dao."
    evidence: "Theo canon/style-guide.md, không tự thu hẹp hoặc thêm chi tiết phương thức hành động chưa được nêu rõ trong câu nguồn."
    recommendation: "Có thể chỉnh thành 'anh cũng không tài nào đánh trượt được' hoặc 'anh cũng không tài nào trượt mục tiêu được' ở bước chuốt văn."
