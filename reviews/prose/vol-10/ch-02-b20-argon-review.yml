locked_choices:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000331"
    locked: "Khóa phạm vi nhấn mạnh Markdown '*Chết tiệt.*' theo DEC-P01-002, đại từ trần thuật 'anh' cho Drake và chi tiết 'quân địch đã tách ra và một tên đang lao thẳng về phía anh'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000332"
    locked: "Khóa cặp thuật ngữ 'màn chắn bảo hộ' – 'lớp vỏ phòng thủ', tên 'Drake', đại từ 'anh'/'mình', ẩn dụ 'quả tên lửa sống' và nhận thức về mục tiêu thực sự của kẻ địch."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000333"
    locked: "Khóa phủ định 'Anh không phải là mục tiêu duy nhất…', thuật ngữ 'hệ thống chỉ huy', đại từ 'Chúng' chỉ địch và câu hỏi tự vấn 'Chỉ với hai pháp sư thôi ư? Không, với chúng thì hai người là quá đủ rồi!'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000334"
    locked: "Khóa định danh 'Trung tá Drake', đại từ sở hữu 'của mình' và hành động 'hô lớn với binh lính'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000335"
    locked: "Khóa lời cảnh báo của Drake: 'Chúng nhắm vào các sĩ quan! Đó là đòn tập kích chặt đầu chỉ huy! Đó mới là mục tiêu của chúng khi tới đây!'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000336"
    locked: "Khóa biệt danh 'Ác quỷ sông Rhine' và nhận định 'quả thực quá thích hợp cho công việc này'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000337"
    locked: "Khóa 'hai vị chỉ huy của đơn vị tình nguyện đa quốc gia', giả định trái thực tế 'Bình thường Drake hẳn sẽ bật cười trước ý tưởng ấy nếu anh không phải đang đối đầu với một con ác quỷ theo đúng nghĩa đen', hình ảnh so sánh 'như những ngôi sao chổi', định danh 'Trung tá Drake' và thuật ngữ 'thuật thức phát nổ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000338"
    locked: "Khóa thuật ngữ 'thuật thức', đại từ 'anh', 'các pháp sư Đế quốc' và cấu trúc phủ định tăng tiến 'hầu như chẳng làm các pháp sư Đế quốc nao núng, chứ đừng nói đến chuyện cản bước chúng'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000339"
    locked: "Khóa câu hỏi cảm thán trực tiếp của Drake trước pha lao thẳng của địch."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000340"
    locked: "Khóa 'Hai pháp sư', phạm vi nhấn mạnh Markdown '*Lửa lẽ ra phải gieo rắc nỗi kinh hoàng vào tim mọi sinh vật chứ!*' theo DEC-P01-002 và cụm 'Tinh thần thép của những pháp sư Đế quốc này'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000341"
    locked: "Khóa tên 'Drake', thuật ngữ 'thuật thức ngụy trang quang học' và nhận thức 'vì sao chúng lại tập trung vào mình đến thế'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000342"
    locked: "Khóa 'Hỏa lực yểm trợ cho anh gần như bằng không', hai phạm vi nhấn mạnh Markdown '*Cái quái gì đang diễn ra thế này?*' và '*chờ lệnh*' theo DEC-P01-002, cùng cấu trúc tăng tiến 'binh lính đa quốc gia chẳng những phản ứng chậm chạp mà lại còn đang *chờ lệnh*'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000343"
    locked: "Khóa phủ định điều kiện 'không biết phải làm gì giữa trận chiến nếu không có mệnh lệnh!'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000344"
    locked: "Khóa đại từ tự xưng 'Tôi', thuật ngữ 'hỏa lực chế áp' và mệnh lệnh 'Có bao nhiêu dốc hết vào chúng đi!'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000345"
    locked: "Khóa đại từ 'Anh', 'tiểu đoàn', phủ định giới hạn 'chẳng làm gì cả cho đến khi được bảo' và cấu trúc 'Đã thế, đường đạn của họ còn loạn xạ khắp nơi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000346"
    locked: "Khóa phạm vi nhấn mạnh Markdown '*Thế mà cũng gọi là tài thiện xạ à?*' theo DEC-P01-002, định danh 'Trung tá Drake' và chi tiết nhận ra mánh khóe khác của địch."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000347"
    locked: "Khóa câu cảnh báo trong thoại: '“Coi chừng mồi nhử! Chết tiệt, đây là quang học sao?!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000348"
    locked: "Khóa thuật ngữ 'thuật thức ngụy trang quang học', 'mồi nhử', 'Phóng chiếu ảo ảnh' và địa danh 'mặt trận Rhine'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000349"
    locked: "Khóa quan hệ đối lập 'đơn giản nhưng hiệu quả khủng khiếp', so sánh 'khó hơn vẻ bề ngoài rất nhiều' và mệnh đề điều kiện khái quát '—nhất là khi đang hoảng loạn'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000350"
    locked: "Khóa điều kiện phủ định trong thoại 'Không tập trung hỏa lực thì chẳng có ích gì đâu!' và mệnh lệnh 'Bình tĩnh lại và ngắm bắn đi!'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000351"
    locked: "Khóa phủ định 'Mệnh lệnh của anh chẳng lọt vào tai ai' và cấu trúc tăng tiến 'Binh lính của anh chẳng những mất bình tĩnh mà còn hoàn toàn bất lực trong việc dồn một lượng hỏa lực đáng kể lên các mục tiêu'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000352"
    locked: "Khóa nhận định 'Tình hình hỗn loạn tột độ' và cụm 'sự tự do cơ động của kẻ địch'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000353"
    locked: "Khóa khẳng định chắc chắn 'Không nghi ngờ gì nữa, đạn của họ có trúng đích', giới hạn 'chưa đủ để xuyên thủng màn chắn bảo hộ của chúng', tình thái quá khứ 'Điều này anh vốn có thể đoán trước…' và câu hỏi cảm thán cuối đoạn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000354"
    locked: "Khóa tên 'Drake', cụm 'một pháp sư Đế quốc thấp bé', cách dịch trung tính 'trong tay đối phương' (không suy diễn giới tính theo DEC-P01-001), thuật ngữ 'lưỡi kiếm ma pháp' và phủ định 'chẳng có lấy một cơ hội nào để cản lưỡi kiếm ấy'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000355"
    locked: "Khóa khẩu lệnh '“Chúng tới rồi! Yểm trợ cho tôi!”', giả định quá khứ 'Lý tưởng nhất là anh đã có thể tận dụng lợi thế sải tay để tung đòn trước', phủ định 'Đây không phải là một trận đấu kiếm giao hữu…' và 'Không còn đủ thời gian để đỡ đòn nữa'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000356"
    locked: "Khóa đại từ 'Anh', thuật ngữ 'lưỡi kiếm ma pháp' và mục đích 'để cố gắng dựng lên ít nhất một thế phòng thủ nào đó'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000357"
    locked: "Khóa thán từ bị choáng khi va chạm '“Hự?!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000358"
    locked: "Khóa hình ảnh so sánh 'như thể anh vừa tông sầm vào một tảng đá lớn', hai phần nhấn mạnh Markdown '*Mình mà lại bị đè bẹp bởi một pháp sư bé như con chuột nhắt thế này sao?! Đừng có chọc cười người ta!*' và '*Ôi, lạy Chúa.*' theo DEC-P01-002, phân biệt đại từ 'anh' (trần thuật) và 'Mình' (nội tâm), cùng hình ảnh so sánh 'hệt như kẻ săn mồi đang dõi theo con mồi của nó'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000359"
    locked: "Khóa tiếng chửi thề '“Chết tiệt thật!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000360"
    locked: "Khóa phủ định 'Anh chẳng thể làm gì để ngăn lưỡi kiếm ma pháp lại một lần nữa lao vút về phía mình', định danh 'Trung tá Drake' và chi tiết 'chấp nhận số phận'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000361"
    locked: "Khóa nhận định cự ly 'Khoảng cách giữa hai bên đủ gần cho một màn cận chiến bằng dao'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000362"
    locked: "Khóa đối lập hai chiều giữa ưu thế của 'pháp sư Đế quốc thấp bé' (về vóc dáng và vị trí) với việc khoảng cách quá gần khiến 'anh' cũng không thể trượt mục tiêu."
