  - segment_id: "YS-LN10/Text/chapter008.xhtml/p000157"
    locks:
      - "Khóa cách xưng hô chuẩn quân ngũ của Tanya với Zettour: 'Vâng, thưa Tướng quân', tự xưng 'Tôi' và gọi 'ngài'."
  - segment_id: "YS-LN10/Text/chapter008.xhtml/p000158"
    locks:
      - "Khóa cách Zettour gọi Rudersdorf ('lão già cứng đầu đó'), địa danh 'mặt trận phía đông', đại từ 'cô' chỉ Tanya, và thành ngữ tương đương 'tre già vẫn uốn được'."
  - segment_id: "YS-LN10/Text/chapter008.xhtml/p000159"
    locks:
      - "Khóa lời đề nghị lịch sự của Tanya với Zettour: gọi 'ngài', tiểu từ lễ phép 'ạ', và nội dung yêu cầu xác nhận các bức thông điệp."
