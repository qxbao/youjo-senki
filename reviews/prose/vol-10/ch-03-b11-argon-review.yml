findings:
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000225"
    severity: "minor"
    issue: "Cụm 'sự đồng cảnh ngộ ngoài ý muốn' diễn giải hơi cụ thể nét nghĩa cảm giác thân thuộc/gần gũi bất chợt của danh từ gốc khi Drake liên tưởng bản thân với que diêm đang cháy dần."
    basis: "Quy tắc giữ đúng mức độ cụ thể và không tự thêm giải thích trong canon/style-guide.md tại p000225."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'một cảm giác gần gũi ngoài ý muốn' hoặc 'một sự đồng cảm ngoài ý muốn' nếu muốn sát sắc thái bề mặt hơn."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000236"
    severity: "minor"
    issue: "Cụm tính từ ghép 'méo mó dị dạng' hơi nặng hơn sắc thái mô tả hình thái chiến tuyến bị biến dạng, mất cân đối trong nguyên văn."
    basis: "Quy tắc giữ đúng sắc thái đánh giá của bản gốc trong canon/style-guide.md tại p000236."
    recommendation: "Ở bước chuốt văn có thể tiết chế thành 'tuyến đầu méo mó ấy' hoặc 'tuyến đầu mất cân đối ấy'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000248"
    severity: "minor"
    issue: "Câu thoại bị ngắt lửng ở cụm tính từ trong nguyên văn được dịch thành danh ngữ 'một con nhãi xấc xược…', làm rõ sớm giới tính nữ của đối phương hơn cách gọi trung tính xuyên suốt các câu lân cận."
    basis: "Quy tắc giữ độ mở và giới hạn suy luận trong canon/style-guide.md và DEC-P01-001 tại p000248."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'đó là một đứa nhóc xấc xược…' hoặc 'đó là một con quỷ nhỏ xấc xược…' để giữ sắc thái trung tính đồng bộ với mạch thoại."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000257"
    severity: "minor"
    issue: "Động từ 'nung nấu điều gì đó trong đầu' mang sắc thái ấp ủ ý đồ mạnh hơn cách diễn đạt trung tính chỉ việc đang bận tâm suy nghĩ điều gì đó của nguyên văn."
    basis: "Quy tắc giữ đúng sắc thái và mức độ chắc chắn của bản gốc trong canon/style-guide.md tại p000257."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'ông đang bận tâm suy nghĩ điều gì đó' hoặc 'trong đầu ông đang có điều gì đó trăn trở'."
