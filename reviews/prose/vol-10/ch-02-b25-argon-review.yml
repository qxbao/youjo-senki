findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000506"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000509"
    severity: "minor"
    category: "lexical_nuance"
    issue: "Danh từ chỉ ý nghĩ/nhận định chung được các sĩ quan trong bộ chỉ huy Liên bang nói ra ở p000506 ('“Sắp bắt đầu rồi.”') và p000509 ('“Lần này chúng ta sẽ tóm được hắn!”') đang được dịch là 'tâm tư' ('bày tỏ tâm tư này', 'bày tỏ một tâm tư khác'), hơi nghiêng về nỗi niềm riêng tư thay vì nhận định hoặc cảm nghĩ chung trước diễn biến chiến sự."
    evidence: "Theo canon/style-guide.md, cần ưu tiên cách kết hợp từ tiếng Việt tự nhiên và đúng sắc thái ngữ cảnh."
    recommendation: "Có thể chỉnh 'tâm tư' ở p000506 và p000509 thành 'nhận định' hoặc 'cảm nghĩ' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000511"
    related_segment_ids: []
    severity: "minor"
    category: "modality_conditional"
    issue: "Mệnh đề điều kiện giả định trái thực tế ở quá khứ mở đầu bằng 'Giá như' ('Giá như họ không dự đoán được những bước đi của ông, cuộc tấn công này hẳn đã đẩy binh lính của họ vào cảnh hoảng loạn'), dễ gợi sắc thái mong ước/tiếc nuối cho một kịch bản bất lợi thay vì giả định điều kiện trung tính."
    evidence: "Theo canon/style-guide.md, cần giữ đúng sắc thái tình thái của giả định ở quá khứ."
    recommendation: "Có thể chỉnh 'Giá như' ở đầu câu p000511 thành 'Nếu' hoặc 'Nếu như' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000531"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000522"
      - "YS-LN10/Text/chapter010.xhtml/p000527"
    severity: "minor"
    category: "pronouns_register"
    issue: "Trong cuộc họp phổ biến kế hoạch tại trung tâm chỉ huy, đại từ tự xưng của Trung tướng Zettour trước các sĩ quan cao cấp ở p000531 đang dùng 'Ta' ('Ta đã quyết tâm thực hiện kế hoạch này rồi'), hơi lệch sang sắc thái cổ trang so với đại từ 'Tôi' chuẩn mực của tướng lĩnh Lục quân Đế quốc ở các lô trước; đồng thời đại từ chỉ các sĩ quan cao cấp trong lời trần thuật ở p000522 và p000527 dùng 'bọn họ' hơi khẩu ngữ so với 'họ' ở các đoạn lân cận."
    evidence: "Theo canon/style-guide.md, cần giữ giọng kể và giọng thoại nhất quán với ngữ cảnh quân sự hiện đại của tác phẩm."
    recommendation: "Có thể chỉnh 'Ta' thành 'Tôi' ở p000531 và chỉnh 'bọn họ' thành 'họ' ở p000522, p000527 trong bước chuốt văn."
