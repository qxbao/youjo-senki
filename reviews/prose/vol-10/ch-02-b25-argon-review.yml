locked_choices:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000499"
    locked: "Khóa tình thái biểu kiến 'Cuối cùng thì xem ra' và nhận định 'quân địch đã sập vào cái bẫy này'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000500"
    locked: "Khóa đại từ 'Họ' chỉ phía Liên bang, các thuật ngữ 'các pháp sư trên không', 'Kampfgruppe', 'các tuyến tiếp vận', 'mặt trận phía đông', 'Đơn vị tình nguyện đa quốc gia', 'các pháp sư Đế quốc' và tình thái 'những kẻ có vẻ là...'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000501"
    locked: "Khóa cấu trúc nhượng bộ 'Và tuy họ đã thành công trong việc đẩy lùi đối phương…', các thuật ngữ 'các lực lượng đa quốc gia', 'hai đại đội', định danh 'Trung tướng Zettour', tên 'Liên bang' và hình ảnh 'nanh vuốt chí mạng'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000502"
    locked: "Khóa quan hệ đối lập 'Nhưng' và ý xác nhận cuối cùng mà phía Liên bang cần."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000503"
    locked: "Khóa đại từ 'Hắn' chỉ Zettour trong lời thoại của phía Liên bang và nhận định 'lúc nào cũng mở màn các chiến dịch của mình bằng một đòn tấn công lớn'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000504"
    locked: "Khóa chủ thể 'bộ chỉ huy Quân đội Liên bang', đại từ trần thuật 'ông' chỉ Zettour, các thuật ngữ 'những pháp sư trên không thiện nghệ', 'các Pháp sư Định danh' và quan hệ nhân quả làm lộ khu vực tập trung tấn công."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000505"
    locked: "Khóa câu thoại ngắn báo hiệu giao tranh: '“Sắp bắt đầu rồi.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000506"
    locked: "Khóa các thuật ngữ 'bộ chỉ huy', 'Đế quốc', 'Quân đội Liên bang', 'cuộc tấn công chính diện quy mô lớn', 'trận pháo kích quy mô lớn' và sự ăn khớp giữa thực tế với dự đoán của Liên bang."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000507"
    locked: "Khóa hình ảnh 'cơn mưa đạn pháo, tựa như loạt đạn khai hỏa mở màn cho một cuộc tổng tấn công', phủ định 'Đó không phải là kiểu oanh kích mà một kẻ địch đang tháo chạy có thể thực hiện được', chủ thể 'các chỉ huy Liên bang', 'Quân đội Liên bang' và đại từ 'ông' chỉ Zettour."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000508"
    locked: "Khóa lời thoại của chỉ huy Liên bang với các đại từ 'chúng ta', 'bọn chúng', 'hắn' và nội dung 'tin tình báo của chúng ta về việc bọn chúng thiếu đạn dược lại là một mánh khóe khác của hắn rồi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000509"
    locked: "Khóa câu trần thuật chuyển tiếp dẫn vào câu thoại kế tiếp của cùng những giọng nói ấy."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000510"
    locked: "Khóa câu thoại quyết tâm của phía Liên bang: '“Lần này chúng ta sẽ tóm được hắn!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000511"
    locked: "Khóa giả định trái thực tế ở quá khứ 'cuộc tấn công này hẳn đã đẩy binh lính của họ vào cảnh hoảng loạn', đại từ 'ông' chỉ Zettour, chủ thể 'Quân đội Liên bang' và cụm 'thực hiện các biện pháp phòng ngừa thích hợp'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000512"
    locked: "Khóa đại từ 'Họ', chi tiết 'triển khai các đơn vị vào những khoảng ngớt tiếng pháo', 'vành đai phòng ngự chặt chẽ' và thuật ngữ 'phản pháo'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000513"
    locked: "Khóa câu thoại tự đắc của chỉ huy Liên bang: '“Mọi thứ đang diễn ra đúng như chúng ta dự đoán… Hắn đã nằm gọn trong lòng bàn tay của chúng ta rồi.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000514"
    locked: "Khóa chủ thể 'Các sĩ quan chỉ huy' và nhận định 'đây chính là cơ hội để họ báo thù'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000515"
    locked: "Khóa câu trần thuật nửa trực tiếp mang giọng điệu của phía Liên bang 'Lần này, chắc chắn họ sẽ tóm gọn gã Trung tướng Zettour chết tiệt kia' và chủ thể 'bộ chỉ huy Quân đội Liên bang'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000516"
    locked: "Khóa ẩn dụ ván bài 'kẻ lừa đảo ngồi phía bên kia bàn—người mà họ đinh ninh sẽ ngửa bài bất cứ lúc nào—đạp tung cả cái bàn ra khỏi trước mặt họ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000517"
    locked: "Khóa tiêu đề chuyển cảnh 'CÙNG NGÀY HÔM ĐÓ, TRUNG TÂM CHỈ HUY LÂM THỜI CỦA LỤC QUÂN ĐẾ QUỐC TRÊN MẶT TRẬN PHÍA ĐÔNG'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000518"
    locked: "Khóa chủ thể 'Các sĩ quan cao cấp', địa điểm 'trung tâm chỉ huy', định danh 'Trung tướng Zettour', đại từ 'ông' và mệnh lệnh trực tiếp 'Chuẩn bị cho trận chiến sắp nổ ra'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000519"
    locked: "Khóa hành động 'đồng loạt gật đầu' và mục tiêu ban đầu trên bản đồ là 'mũi lồi của địch'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000520"
    locked: "Khóa nhận định 'Suy cho cùng, hầu như ai cũng đã đoán được rằng đó sẽ là mục tiêu của họ.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000521"
