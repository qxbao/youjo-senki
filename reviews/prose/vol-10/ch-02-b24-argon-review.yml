    severity: "minor"
    category: "pronouns_consistency"
    issue: "Trong mạch trần thuật khách quan từ góc nhìn phân tích của phía Liên bang về Trung tướng Zettour (p000489–p000498), đại từ ngôi thứ ba chỉ Zettour đang dùng chủ đạo là 'ông', nhưng ở câu đầu của p000493 (ngay trước câu thứ hai dùng lại 'ông' ba lần) và cuối câu thứ hai của p000498 lại chuyển sang 'ông ta', tạo độ chênh nhẹ về sắc thái đại từ."
    evidence: "Theo canon/style-guide.md, cần giữ giọng kể và hệ thống đại từ quy chiếu nhất quán trong cùng đoạn và cùng mạch trần thuật."
    recommendation: "Có thể chỉnh 'ông ta' ở câu đầu p000493 và câu cuối p000498 thành 'ông' ở bước chuốt văn để đồng nhất."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000494"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000497"
    severity: "minor"
    category: "terminology_consistency"
    issue: "Thuật ngữ quân sự chỉ phần chiến tuyến nhô ra ở p000494 và p000497 đang được dịch là 'mũi lồi', truyền đạt đúng nghĩa chiến thuật nhưng hơi khác với phương án 'mấu lồi' đã ghi nhận ở Tập 9 trong work/run-state/pending-terms-index.yml."
    evidence: "Theo work/run-state/pending-terms-index.yml (mục 'Hofen salient / salient'), thuật ngữ này từng được đề xuất là 'mấu lồi'."
    recommendation: "Có thể cân nhắc đồng bộ thành 'mấu lồi' ở bước chuốt văn hoặc giữ 'mũi lồi' như phương án tương đương."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000497"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000494"
    severity: "minor"
    category: "pronouns_viewpoint"
    issue: "Ở câu thứ hai, đại từ phản thân 'của mình' được dùng hai lần cho hai chủ thể khác nhau trong cùng một câu (lần đầu ở mệnh đề phụ chỉ Zettour: 'các lực lượng cơ động nhất của mình', lần hai ở cuối mệnh đề chính chỉ Quân đội Liên bang: 'mũi lồi của mình' ngay sau khi vừa dùng 'lực lượng dự bị của họ'), đồng thời cụm 'tới đó' đặt ở vế đầu khi chưa nêu địa điểm dễ làm câu hơi kém thoát ý."
    evidence: "Theo canon/style-guide.md, cần giữ rõ chủ thể quy chiếu giữa các mệnh đề và tránh bám máy móc trật tự đại từ quy chiếu xuôi của tiếng Anh."
    recommendation: "Có thể chỉnh cụm cuối câu thành 'ngay tại phần gốc mũi lồi của họ' (hoặc đảo địa điểm lên vế đầu) ở bước chuốt văn để phân biệt rõ hai chủ thể."
