  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000481"
    names_and_ranks: "lực lượng pháp sư hải quân đánh bộ (the marine mages); lực lượng pháp sư Đế quốc (imperial mage troops)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('họ')"
    modality_and_logic: "Tương phản giữa danh tiếng bậc thầy tác chiến ba chiều và thực tế đang mắc kẹt ở chiều không gian thứ hai; thiếu nhận thức không gian trên dưới nên trở thành mồi ngon cho pháp sư Đế quốc xảo quyệt"
