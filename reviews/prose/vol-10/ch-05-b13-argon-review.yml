  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000487"
    names_and_ranks: "Tướng Ballmer (General Ballmer); Quân đội (The army); tân binh (new recruits)"
    pronouns_and_pov: "Thoại của cấp dưới giải thích cho Drake; gọi Ballmer là 'ông ấy', đám lính là 'bọn họ'"
    modality_and_logic: "Đánh giá Tướng Ballmer đã thuộc nhóm chỉ huy giỏi hơn; nêu nguyên nhân quân đội phải đốt cháy giai đoạn huấn luyện để kịp đưa tân binh vào hoạt động, nên việc rèn được họ di chuyển thành đơn vị đã là đáng nể"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000488"
    names_and_ranks: "Trung tá Drake (Lieutenant Colonel Drake)"
    pronouns_and_pov: "Nội tâm và trần thuật điểm nhìn Drake ('anh')"
    modality_and_logic: "Cảm thán sững sờ; phủ định nguyên nhân ('suýt nữa thì bật run lên, mà lý do không phải vì trận chiến đang diễn ra trước mắt anh'); câu hỏi tu từ kinh hoàng khi biết đám pháp sư tồi tệ này lại được xếp vào hàng khá hơn"
    emphasis: "Giữ nhấn mạnh chữ nghiêng Markdown `*Khoan đã nào*` và `*khá hơn*` tương ứng với hai thẻ `<html:em>` trong nguồn"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000489"
    names_and_ranks: "màn chắn bảo hộ (protective films); các thuật thức phát nổ (explosion formulas); Liên bang (the Federation); thuật thức bắn tỉa quang học (optical sniping formula)"
    pronouns_and_pov: "Trần thuật và nội tâm điểm nhìn Drake ('Anh')"
    modality_and_logic: "Quan sát cảnh quân địch dễ dàng bóc toạc màn chắn bảo hộ của họ bằng thuật thức phát nổ; đặt câu hỏi bức xúc về việc gọi đám pháp sư này là đạt chuẩn, rồi đối chiếu với những cỗ máy lì đòn của Liên bang vốn chịu được mọi đòn đánh trừ phi trúng trực diện thuật thức bắn tỉa quang học"
    emphasis: "Giữ nhấn mạnh chữ nghiêng Markdown `*đạt chuẩn*` tương ứng với `<html:em>up to par</html:em>` trong nguồn"
