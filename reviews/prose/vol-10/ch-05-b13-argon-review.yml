    modality_and_logic: "Sự sững sờ của Drake trước lời người bạn kiêm cấp dưới; suy luận nội tâm rằng cách nói ấy hàm ý đám tân binh mới hơn thậm chí còn không biết bay"
    emphasis: "Giữ nhấn mạnh chữ nghiêng Markdown `*...*` cho toàn bộ câu thứ hai, khớp với thẻ `<html:em>` trong nguồn"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000480"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Drake hỏi vặn cấp dưới ('anh')"
