findings:
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000465"
    severity: "minor"
    category: "diễn đạt / sắc thái từ vựng"
    issue: "Dịch 'avert his eyes' thành 'ngoảnh mặt làm ngơ' hơi nghiêng về sắc thái thờ ơ đạo đức hơn là hành động quay mắt/rời mắt khỏi một cảnh tượng quá sức chịu đựng trên chiến trường."
    basis: "Câu sau kết nối trực tiếp bằng nhận định đây là một cảnh tượng không sao chịu đựng nổi, đồng thời trên chiến trường việc rời mắt khỏi diễn biến trước mặt sẽ khiến Drake lập tức trở thành con mồi mới của địch."
    recommendation: "Có thể cân nhắc chỉnh nhẹ ở bước chuốt văn (polish) thành 'quay mắt đi' hoặc 'rời mắt đi'; không ảnh hưởng logic cốt lõi nên không chặn lô."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000481"
    severity: "minor"
    category: "diễn đạt / chuốt câu"
    issue: "Cụm 'họ đang tự dâng mình lên đĩa cho lực lượng pháp sư Đế quốc xảo quyệt làm thịt' chuyển cấu trúc bị động thành chủ động 'tự dâng mình', dù vẫn giữ được ý làm mồi ngon nhưng có thể diễn đạt sát hơn với tác nhân phía Đế quốc."
    basis: "Nguồn nhấn mạnh việc các pháp sư tân binh thiếu nhận thức không gian trên dưới nên bị lực lượng pháp sư Đế quốc xảo quyệt biến thành miếng mồi dâng sẵn trên đĩa."
    recommendation: "Có thể cân nhắc chuốt nhẹ ở bước polish thành 'họ chẳng khác nào miếng mồi bày sẵn trên đĩa cho lực lượng pháp sư Đế quốc xảo quyệt'; không bắt buộc sửa ngay."
