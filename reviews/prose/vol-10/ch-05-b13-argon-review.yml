    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000460"
    names_and_ranks: "lữ đoàn pháp sư hải quân đánh bộ (brigade’s worth of marine mages); tiểu đoàn địch (enemy battalion); Hướng đạo sinh (Boy Scouts)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake; gọi phía pháp sư Khối Thịnh vượng chung là 'họ'"
    modality_and_logic: "Đối lập quy mô: có quân số tương đương cả một lữ đoàn nhưng hoàn toàn không có hy vọng đánh bại một tiểu đoàn địch; so sánh như đám Hướng đạo sinh lao vào vung tay đánh những khí cụ chiến tranh được tinh chỉnh hoàn hảo"
    emphasis: "Giữ nhấn mạnh chữ nghiêng Markdown `*tiểu đoàn*` tương ứng với `<html:em>battalion</html:em>` trong nguồn"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000461"
    names_and_ranks: "pháp sư hải quân đánh bộ của Khối Thịnh vượng chung (Commonwealth marine mages)"
    pronouns_and_pov: "Thoại độc thoại hoài nghi của Drake ('Những kẻ này')"
    modality_and_logic: "Câu hỏi nghi vấn đầy kinh ngạc trước chất lượng của lực lượng pháp sư hải quân đánh bộ Khối Thịnh vượng chung"
    emphasis: "Giữ nhấn mạnh chữ nghiêng Markdown `*Những kẻ này*` tương ứng với `<html:em>These men</html:em>` trong nguồn"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000462"
    names_and_ranks: "binh lính của Khối Thịnh vượng chung (Commonwealth’s soldiers); Drake"
    pronouns_and_pov: "Trần thuật ngôi thứ ba điểm nhìn Drake ('mình')"
    modality_and_logic: "Quan hệ nhượng bộ: dù nắm lợi thế quân số khổng lồ, phần lớn binh lính lại sắp suy sụp tinh thần; Drake không thể tin vào mắt mình"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000463"
    names_and_ranks: "các pháp sư trên không của Đế quốc (imperial aerial mages); Drake"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake; gọi binh lính phe mình là 'họ'"
    modality_and_logic: "Giả định nhượng bộ hai vế: sẽ còn hiểu được nếu họ thiếu quân số hoặc chí ít đang ăn miếng trả miếng tương xứng với lợi thế chiến thuật; dẫn chứng tiền lệ pháp sư Đế quốc hóa thành những kẻ man rợ tàn nhẫn trên chiến trường mà chính Drake từng chứng kiến"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000464"
    names_and_ranks: "Lực lượng pháp sư hải quân đánh bộ (The marine mages); Khối Thịnh vượng chung (the Commonwealth); lữ đoàn (brigade); Drake"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('anh')"
    modality_and_logic: "Đối lập giữa kỳ vọng (vốn được coi là niềm kiêu hãnh của Khối Thịnh vượng chung) và thực tại (cả lữ đoàn chẳng kháng cự được là bao); hành động lắc đầu và hít sâu để trấn tĩnh giữa nỗi bàng hoàng, hoài nghi"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000465"
    names_and_ranks: "kẻ địch (the enemy)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('Anh', 'mình')"
    modality_and_logic: "Sự bất lực chỉ có thể đứng nhìn; điều kiện nhân quả: nếu quay mắt đi thì chẳng mấy chốc chính anh cũng thành con mồi mới của địch; kết luận đây đúng nghĩa là cảnh tượng không sao chịu đựng nổi"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000466"
    names_and_ranks: "những người lính trẻ (young soldiers); lớp vỏ phòng thủ (defensive shells); thuật thức bắn tỉa quang học (optical sniping formulas); thuật thức nghi binh quang học (optical deception formulas)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('Anh' - lính trẻ là 'Họ')"
    modality_and_logic: "Trình tự: lính trẻ bị tước sạch lớp vỏ phòng thủ bằng thuật thức bắn tỉa quang học rồi rơi xuống thiệt mạng; nguyên nhân do họ là những kẻ nghiệp dư quá non kinh nghiệm nên không biết né hỏa lực địch hay dùng thuật thức nghi binh quang học"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000467"
    names_and_ranks: "binh lính (soldiers); sĩ quan (officer)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('anh', 'Họ')"
    modality_and_logic: "So sánh với bầy cừu non bị dắt tới lò mổ, không bay nổi cho đàng hoàng mà chỉ miễn cưỡng lơ lửng tại chỗ; giả định phủ định quá khứ ('Nếu không nhờ bộ quân phục đang mặc trên người, hẳn anh cũng chẳng nhận ra họ là binh lính'); mong muốn tự lừa dối rằng chuyện này không xảy ra"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000468"
    names_and_ranks: "Lực lượng pháp sư hải quân đánh bộ của Khối Thịnh vượng chung (The Commonwealth marine mage troops)"
    pronouns_and_pov: "Nội tâm gián tiếp tự do của Drake ('họ')"
    modality_and_logic: "Nối tiếp mong muốn coi tất cả chỉ là cơn ác mộng; tình thái trách nhiệm/kỳ vọng quá khứ ('vốn phải là những người rắn rỏi nhất', 'Đáng lý không thể có chuyện bất kỳ ai trong số họ lại nao núng như thế này')"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000469"
    names_and_ranks: "Chỉ huy Ballmer (Commander Ballmer)"
    pronouns_and_pov: "Trần thuật và nội tâm điểm nhìn Drake ('anh'; gọi Ballmer là 'ông')"
    modality_and_logic: "Khẳng định không thể trốn chạy thực tại thông qua câu hỏi tự vấn và câu trả lời: hình dung rõ gương mặt đắng cay và tiếng than khóc của Chỉ huy Ballmer trước đám lính trẻ thiếu huấn luyện"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000470"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại chửi thề của Drake"
    modality_and_logic: "Lời chửi thề cay đắng"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000471"
    names_and_ranks: "Đại tá Mikel (Colonel Mikel); Chỉ huy Ballmer (Commander Ballmer)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('anh')"
    modality_and_logic: "Quy luật lặp lại: mỗi khi phối hợp với các sĩ quan lớn tuổi như Mikel và Ballmer, anh luôn phải đối mặt thực tại nghiệt ngã rằng chỉ huy ngày một già, lính ngày một trẻ, còn thế hệ ở giữa đều đã tử trận"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000472"
    names_and_ranks: "Drake; pháp sư (mages)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('Anh')"
    modality_and_logic: "Lặp lại bi kịch phải nhìn những đứa trẻ bước vào chỗ chết và niềm hy vọng duy nhất là tàu bên dưới vớt được càng nhiều pháp sư bị bắn rơi càng tốt"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000473"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại độc thoại của Drake; gọi Ballmer là 'Ông ấy', đám tân binh là 'bọn họ'"
    modality_and_logic: "Nhắc lại cách gọi 'đám lính non nớt mới ra ràng' (fledglings) và xác nhận cách nói đó hoàn toàn không phải nói giảm nói tránh"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000474"
    names_and_ranks: "Drake"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('mình')"
    modality_and_logic: "Nhận thức rằng việc nhận ra điều đó vào lúc này đã là quá muộn"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000475"
    names_and_ranks: "thuật thức quang học tầm xa (long-range optical formulas)"
    pronouns_and_pov: "Trần thuật điểm nhìn Drake ('anh', 'mình')"
    modality_and_logic: "Mệnh đề nhượng bộ: dù rất muốn can thiệp nhưng thực tế không làm được gì nhiều; cân nhắc phương án tự thi triển thuật thức quang học tầm xa nhưng bác bỏ vì quá mạo hiểm khi hai bên đã quần thảo xoắn xuýt vào nhau"
