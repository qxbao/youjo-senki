findings:
  - segment_id: "YS-LN10/Text/chapter020.xhtml/p000031"
    severity: "minor"
    issue: "Cụm danh từ chỉ năng lực/uy thế chiến trận của quốc gia được dịch là 'võ công của nước ta'; dù đúng nghĩa Hán-Việt cổ điển (chiến công/năng lực quân sự), trong tiếng Việt hiện đại từ 'võ công' đôi khi dễ gợi liên tưởng sang võ thuật cá nhân."
    basis: "Đối chiếu ngữ cảnh các bức tranh ca ngợi chiến thắng lịch sử của Đế quốc tại p000025-p000031 và nguyên tắc diễn đạt tự nhiên, rõ nghĩa trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'uy thế quân sự của nước ta' hoặc 'sức mạnh thượng võ của nước ta'; không làm sai lệch nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter020.xhtml/p000043"
    severity: "minor"
    issue: "Hai câu liên tiếp cùng dùng từ 'tỉnh táo' ('một cái đầu tỉnh táo' và 'vài người tỉnh táo') cho hai cách diễn đạt khác nhau trong nguyên bản (một thành ngữ chỉ đầu óc điềm tĩnh/biết suy xét và một tính từ chỉ người bình thường/không điên rồ)."
    basis: "Đối chiếu sắc thái từ vựng tại p000043 và hướng dẫn văn phong tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi câu trước thành 'Hẳn ông ta phải là người có đầu óc biết suy xét thấu đáo' hoặc 'Hẳn ông ta phải có cái đầu rất nhạy bén' để tránh lặp từ với câu cảm thán kế tiếp."
