    severity: "minor"
    issue: "Ở mệnh đề cuối câu kết đoạn độc thoại nội tâm ('bắt đầu từ chính những người mà bạn muốn giữ lại nhất'), đại từ ngôi thứ hai khái quát được dịch sát thành 'bạn' trong khi trước đó người kể đang tự quy chiếu bằng 'mình'."
    basis: "Nguyên tắc viết tiếng Việt tự nhiên và giữ giọng độc thoại nội tâm nhất quán trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'mà bạn muốn giữ lại nhất' thành 'mà người ta muốn giữ lại nhất' hoặc 'mà tổ chức muốn giữ lại nhất'; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000218"
    severity: "minor"
    issue: "Cụm mô tả biểu cảm của Tham tán Conrad ('nở một nụ cười toe toét') mang sắc thái hơi xuề xòa, trẻ con so với hình tượng nhà ngoại giao có ánh mắt lạnh lùng, toan tính vừa được khắc họa ở các đoạn p000215-p000216."
    basis: "Nguyên tắc giữ đúng sắc thái ngữ cảnh và tính nhất quán nhân vật trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc điều chỉnh thành 'nở một nụ cười đầy ẩn ý' hoặc 'nhếch môi cười'; không làm sai lệch nghĩa hành động nên không bắt buộc sửa bản chuẩn."
