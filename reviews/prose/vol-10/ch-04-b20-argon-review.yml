findings:
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000483"
    severity: "minor"
    issue: "Động từ miêu tả hai vai buông xuôi đang viết là 'trùng xuống' thay vì dạng chính tả chuẩn 'chùng xuống'; ngoài ra cụm 'đánh trống lảng sang chuyện khác' hơi nghiêng về sắc thái lảng tránh khẩu ngữ so với hành động chủ động chuyển chủ đề cuộc họp."
    basis: "Đối chiếu chính tả tiếng Việt và ngữ cảnh điều hành cuộc họp tại p000483 theo hướng dẫn trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể chỉnh thành 'Hai vai mình hơi chùng xuống, và mình quyết định chuyển sang chủ đề khác'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000488"
    severity: "minor"
    issue: "Có hiện tượng lặp từ sát nhau ở câu thứ hai ('cấp dưới dưới quyền mình' và 'chuyên môn ... chuyên biệt hóa') cũng như hai giới từ sở hữu liền nhau ở câu cuối ('một trong các hải cảng của Đế quốc của họ')."
    basis: "Đối chiếu nhịp câu tại p000488 và nguyên tắc viết tiếng Việt tự nhiên, rõ ràng trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể lược bớt từ lặp thành 'Lĩnh vực chuyên môn của các thuộc cấp dưới quyền mình' và 'Xét việc năng lực bảo vệ một hải cảng Đế quốc của họ từng được thử lửa qua thực chiến'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000520"
    severity: "minor"
    issue: "Ở câu cuối, cụm 'việc đi săn việc làm' lặp lại danh từ 'việc' sát nhau làm nhịp câu hơi nặng."
    basis: "Đối chiếu kết hợp từ tại p000520 và hướng dẫn văn phong trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể đổi nhẹ thành 'chuyện săn tìm việc làm' hoặc 'việc đi tìm bến đỗ mới'."
