      - "Khóa câu điều kiện giả định trái thực tế ('Nếu không tại tên khốn đó, mình đã có thể ...'), đại từ nội tâm 'mình' theo DEC-P01-001 và cụm 'các quyền con người cơ bản'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000519"
    locks:
      - "Khóa đại từ độc thoại 'Mình' và cụm 'mức tiêu chuẩn văn hóa tối thiểu'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000520"
    locks:
      - "Khóa đại từ nội tâm 'mình'/'Mình' theo DEC-P01-001, chuỗi ẩn dụ 'con tàu đang đắm' - 'con tàu đắm' - 'lật úp' - 'con thuyền này', cấu trúc tăng tiến đổi chủ thể 'không những ... mà mình lại còn ...' và cụm 'nhà tuyển dụng tiềm năng'."
