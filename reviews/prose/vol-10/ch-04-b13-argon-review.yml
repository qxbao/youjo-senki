    basis: "Nguyên tắc giữ đúng sắc thái ngữ cảnh và mạch cảm xúc nhân vật trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc điều chỉnh thành 'Nghe chính cô nói ra câu đó thì thật thấm thía đấy' hoặc 'Nghe câu đó từ chính miệng cô thì thật chua xót đấy'; không làm sai lệch nghĩa cơ bản nên không bắt buộc sửa bản chuẩn."
