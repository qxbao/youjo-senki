    severity: "moderate"
    category: "terminology_meaning"
    issue: "Trong lời thoại của Tham tán Conrad thuộc Bộ Ngoại giao, động từ 'discharged' (chỉ các vị tiền nhiệm của Conrad ở Bộ Ngoại giao) đang được dịch là 'bị cho giải ngũ', dùng nhầm thuật ngữ xuất ngũ của quân nhân cho quan chức ngoại giao dân sự."
    evidence: "Theo văn cảnh p000022, p000027, p000028 và p000030, Conrad là tham tán dân sự của Bộ Ngoại giao Đế quốc đang nói về những người tiền nhiệm/tiền bối cùng cơ quan đã bị miễn nhiệm hoặc cho thôi chức."
    recommendation: "Đổi 'đều đã bị cho giải ngũ cả rồi' thành 'đều đã bị miễn nhiệm cả rồi' hoặc 'đều đã bị cho thôi chức cả rồi'."
  - segment_id: "YS-LN10/Text/chapter004.xhtml/p000024"
    related_segment_ids:
      - "YS-LN10/Text/chapter004.xhtml/p000025"
    severity: "moderate"
    category: "meaning_register"
    issue: "Câu hỏi nghi vấn có–không của Đại tá Lergen đang được dịch kết câu bằng 'ra sao?' ('Bộ mặt tôi đã để lộ suy nghĩ trong lòng ra sao?'), làm lệch thành câu hỏi về cách thức/mức độ và không khớp với câu trả lời xác nhận trực tiếp 'Vâng, đúng vậy đấy.' ở p000025; đồng thời từ 'Bộ mặt tôi' mang sắc thái tiêu cực không phù hợp với phong thái lịch thiệp của Lergen."
    evidence: "Theo canon/style-guide.md, cần giữ nguyên đối tượng, loại câu hỏi và sắc thái biểu cảm của câu gốc cũng như tính liên kết hội thoại với p000025."
    recommendation: "Đổi thành 'Nét mặt tôi đã để lộ suy nghĩ trong lòng rồi sao?' hoặc 'Vẻ mặt tôi đã để lộ suy nghĩ trong lòng rồi hay sao?'."
