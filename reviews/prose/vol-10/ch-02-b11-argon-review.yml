findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000033"
    severity: "minor"
    issue: "Ở câu thứ hai, vị ngữ nói về khả năng đáp ứng của 'tuyến tiếp vận' (supply line) cho cánh quân tiến sâu được dịch là 'sẽ không tài nào chi viện nổi'; trong tiếng Việt quân sự, 'chi viện' thường thiên về tăng viện binh lực hoặc hỏa lực, còn với tuyến tiếp vận thì dùng 'duy trì tiếp tế nổi' hoặc 'đảm bảo hậu cần nổi' sẽ chuẩn xác hơn về mặt kết hợp từ."
    basis: "Đối chiếu ngữ nghĩa hậu cần ở câu thứ hai của p000033 và nguyên tắc kết hợp từ tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'chi viện nổi' thành 'duy trì tiếp tế nổi' hoặc 'nuôi quân nổi'; không làm sai lệch logic nhân quả nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000057"
    severity: "minor"
    issue: "Ở câu thứ hai, cụm danh từ chỉ từ khóa mật trong giao tiếp được dịch là 'mật danh'; 'mật danh' thường tương ứng với 'codename' (tên gọi mật của cá nhân/chiến dịch), trong khi ở đây Tanya đang hỏi liệu từ 'hy vọng' mà Zettour nhấn mạnh có phải là một 'mật ngữ' hoặc 'ám hiệu' vượt thẩm quyền của cô hay không."
    basis: "Đối chiếu sắc thái từ vựng ở câu thứ hai của p000057 và ngữ cảnh đối thoại từ p000053 đến p000057."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'mật danh' thành 'mật ngữ' hoặc 'ám hiệu' để khớp sát hơn với ngữ cảnh lời nói."
