    issue: "Tại p000133, cụm 'khiến chúng ta không thể xuể được' thiếu động từ chính đi kèm với bổ ngữ 'xuể' (thường dùng 'xoay xở không xuể' hoặc 'đối phó không xuể')."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước polish thành 'Có quá nhiều kẻ địch khiến chúng ta không sao đối phó xuể.' / 'Có quá nhiều kẻ địch, chúng ta xoay xở không xuể đâu.'."
