    issue: "Tại p000115, cụm 'Dù việc chỉ ra điều đó là một ý kiến có phần thất lễ' dịch sát chữ 'notion' nhưng kết hợp 'việc chỉ ra... là một ý kiến' hơi cồng kềnh trong tiếng Việt."
