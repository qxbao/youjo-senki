    modality_and_logic: "Câu hỏi xác nhận mệnh lệnh và nhắc lại ưu tiên ban đầu là chia cắt lực lượng địch để chọc thủng vành đai phòng ngự"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000310"
    names_and_ranks: "Trung úy Wüstemann"
    pronouns_and_pov: "Thoại của Tanya với Weiss ('chúng ta')"
    modality_and_logic: "Công nhận ý kiến của Weiss nhưng đổi ưu tiên sang việc làm mẫu cho Trung úy Wüstemann học hỏi cách chiến đấu"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000311"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại đáp nhận lệnh của Weiss"
    modality_and_logic: "Khẳng định ngắn gọn 'Rõ!'"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000312"
    names_and_ranks: "đào tạo tại chỗ (on-the-job training)"
    pronouns_and_pov: "Nội tâm Tanya ('mình'); gọi nhóm lính mới là 'họ'"
    modality_and_logic: "Câu điều kiện ('Nếu đào tạo tại chỗ là cơ hội duy nhất... thì mình sẽ phải tận dụng tối đa'); nhượng bộ về nguy cơ nhiễm thói quen kỳ quặc khi học qua lửa đạn thực chiến; khẳng định quăng binh lính vào gian khổ vẫn là cách tốt nhất để rèn vào khuôn khổ"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000313"
    names_and_ranks: "none"
    pronouns_and_pov: "Nội tâm Tanya ('mình')"
    modality_and_logic: "Tạm thời xoay xở với những gì đang có trong tay"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000314"
    names_and_ranks: "Trung úy Wüstemann; đại đội (company)"
    pronouns_and_pov: "Thoại của Tanya qua vô tuyến ('Chúng tôi' - 'cậu' / 'các cậu')"
    modality_and_logic: "Kiểm tra liên lạc ('nghe rõ không?'), thông báo lùa con mồi về phía đại đội của Wüstemann và ví như bài tập gắn kết đội ngũ"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000315"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại đáp của Wüstemann với Tanya ('ạ')"
    modality_and_logic: "Giữ nét lắp bắp căng thẳng 'R-rõ rồi ạ.'"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000316"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại trấn an của Tanya với Wüstemann ('Cậu', 'các cậu' - quân địch là 'Chúng')"
    modality_and_logic: "Trấn an cấp dưới rằng đội của cậu đang làm tốt, đồng thời dùng cấu trúc tăng tiến ('Không những thế, nhìn kẻ địch của các cậu kìa. Chúng đang chết đuối giữa bầu trời đấy')"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000317"
    names_and_ranks: "viên trung úy (first lieutenant)"
    pronouns_and_pov: "Trần thuật"
    modality_and_logic: "Phản ứng thở phào nhẹ nhõm của viên trung úy trẻ khi được chỉ rõ điều đó"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000318"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Wüstemann ('chúng tôi')"
    modality_and_logic: "Liên tưởng kẻ địch hiện tại với hình ảnh của chính nhóm mình ngày trước"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000319"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Tanya ('Chúng ta' - 'chúng' - 'các cậu')"
    modality_and_logic: "Tán đồng và nêu mệnh lệnh phải tiêu diệt chúng ngay hôm nay trước khi chúng đạt tới trình độ của nhóm Wüstemann"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000320"
    names_and_ranks: "none"
    pronouns_and_pov: "Nội tâm phân tích của Tanya"
    modality_and_logic: "Quy luật kinh nghiệm biến tay nghiệp dư thành chuyên nghiệp, cộng thêm áp lực đặt cược mạng sống trong chiến tranh là động lực lớn nhất thúc đẩy sự trưởng thành vượt bậc"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000321"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Tanya ('Chúng ta')"
    modality_and_logic: "Ẩn dụ 'bẻ nanh vuốt của kẻ địch ngay khi còn cơ hội'"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000322"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại cảm thán của Wüstemann"
    modality_and_logic: "Cảm thán về sự khắc nghiệt thực sự của chiến tranh"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000323"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại và trần thuật ngôi thứ nhất của Tanya ('mình')"
    modality_and_logic: "Khẳng định đồng tình kèm cái gật đầu"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000324"
    names_and_ranks: "Thiếu tá Weiss; đại đội (company); Đại đội dự bị của Trung úy Wüstemann (First Lieutenant Wüstemann’s reserve company)"
    pronouns_and_pov: "Trần thuật ngôi thứ nhất của Tanya ('Mình')"
    modality_and_logic: "Phủ định ('chẳng có nhiều thời gian để đắm mình vào những suy tư như thế'); phối hợp ba mũi: Thiếu tá Weiss dồn ép địch tiến về phía trước, Tanya dẫn đại đội đi săn, và đại đội dự bị của Trung úy Wüstemann chỉ việc lao vào toán pháp sư đang rối loạn"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000325"
    names_and_ranks: "none"
    pronouns_and_pov: "Nội tâm Tanya; gọi nhóm Wüstemann là 'họ'"
    modality_and_logic: "Phỏng đoán có căn cứ ('hẳn sẽ là một cách nhanh chóng và hiệu quả để họ tích lũy kinh nghiệm thực chiến')"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000326"
    names_and_ranks: "none"
    pronouns_and_pov: "Nội tâm/trần thuật ngôi thứ nhất của Tanya ('Mình')"
    modality_and_logic: "Kết thúc lô bằng tiếng cười trước sự yếu ớt của kẻ địch"
    emphasis: "none"
