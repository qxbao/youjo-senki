    severity: "minor"
    issue: "Cụm 'các điều khoản của nhiệm vụ' mang sắc thái hợp đồng thương mại khá đậm; dù phù hợp với mạch liên tưởng công sở ở p000004, trong ngữ cảnh quân sự báo cáo trực tiếp với tướng lĩnh có thể cân nhắc từ tự nhiên hơn."
    basis: "Đối chiếu câu cuối của p000005 trong ngữ cảnh đối thoại quân sự giữa Tanya và Tướng Romel."
    recommendation: "Ở bước chuốt văn có thể giữ nguyên nếu muốn nhấn giọng công sở của Tanya, hoặc chỉnh nhẹ thành 'khuôn khổ của nhiệm vụ' / 'các điều kiện của nhiệm vụ'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000028"
    severity: "minor"
    issue: "Câu hỏi mở đầu đoạn ('Và chuyện gì sẽ xảy ra nếu...') dùng phụ từ chỉ tương lai 'sẽ', trong khi câu gốc là giả định trái thực tế trong quá khứ (câu sau đã dịch chuẩn là 'hẳn đã khép lại... hẳn đã bị đẩy xuống...')."
    basis: "Đối chiếu quy tắc giữ đồng thời tính giả định, mức chắc chắn và thời gian của giả định trong canon/style-guide.md tại p000028."
    recommendation: "Ở bước chuốt văn có thể chỉnh câu đầu thành 'Và chuyện gì hẳn đã xảy ra nếu tướng quân Nobunaga chỉ ngồi không trong thành...?' để đồng bộ thời gian giả định quá khứ với câu tiếp theo."
