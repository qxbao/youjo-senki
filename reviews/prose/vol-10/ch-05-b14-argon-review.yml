    issue: "Thuật ngữ 'pseudo-unit' đang dịch là 'đơn vị bán chính quy', dễ gợi nghĩa lực lượng bán quân sự (paramilitary/semi-regular) trong khi ngữ cảnh p000498 chỉ lữ đoàn tân binh đang huấn luyện nên mới chỉ gần giống pháp sư thực thụ."
    recommendation: "Có thể giữ tạm trong bản nháp hoặc cân nhắc 'đơn vị nửa vời' / 'đơn vị tạm bợ' ở bước chuốt văn nếu cần sát sắc thái mô tả trình độ chưa hoàn chỉnh, nhưng vẫn giữ nguyên vế 'gần giống các pháp sư thực thụ rồi'."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000512"
    severity: "minor"
    category: "diction"
    issue: "Cụm 'gằn cao giọng' cho 'raise his voice' hơi lệch kết hợp từ tiếng Việt (vì 'gằn giọng' thường chỉ giọng trầm nén xuống, còn 'cao giọng/lớn tiếng' là nâng âm lượng)."
    recommendation: "Ở bước chuốt văn có thể chỉnh nhẹ thành 'nâng cao giọng' hoặc 'lớn tiếng' trên sóng vô tuyến mà không đổi nghĩa."
