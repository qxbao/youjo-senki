    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'tỉnh khỏi giấc mộng ban ngày nhỏ nhoi của mình rồi!' để câu thoại gọn và tự nhiên hơn; không ảnh hưởng nghĩa nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000061"
    severity: "minor"
    issue: "Cụm vị ngữ ở đầu câu chỉ cảm giác nặng nề/khó chịu khi phải chứng kiến cảnh người khác suy sụp đang được dịch là 'thật khó coi', dễ gợi sắc thái chê bai hình thức hơn là sự ái ngại và cảm thông nối tiếp ở p000062."
    basis: "Đối chiếu mạch tâm lý nội tâm giữa p000061 và p000062 với nguyên tắc giữ đúng bình diện đánh giá theo ngữ cảnh trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'thật khó coi' thành 'chẳng dễ chịu gì' hoặc 'thật khó mà nhìn' để khớp tự nhiên hơn với câu bày tỏ sự cảm thông ngay sau đó."
