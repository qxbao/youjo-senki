    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Grantz với Tanya ('ngài ... ạ' - địch là 'chúng')"
    modality_and_logic: "Câu hỏi xác nhận ý định chiến thuật (kéo địch ra khỏi chiến tuyến) và đáp nhận lệnh 'Rõ!'"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000350"
    names_and_ranks: "Trung úy Grantz (First Lieutenant Grantz)"
    pronouns_and_pov: "Thoại khen ngợi của Tanya"
    modality_and_logic: "Khen sự nhạy bén của Trung úy Grantz"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000351"
    names_and_ranks: "Grantz; Tướng Zettour (General Zettour); vị tướng (the general)"
    pronouns_and_pov: "Nội tâm Tanya ('Mình'); gọi Grantz là 'cậu ta', Zettour là 'ông'"
    modality_and_logic: "Đánh giá Grantz đã học hỏi nhiều dưới trướng Tướng Zettour nên dễ sử dụng hơn hẳn; tự hỏi liệu đó có phải nhờ sự rèn giũa của sĩ quan cao cấp và dự định hỏi vị tướng về phương pháp giảng dạy"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000352"
    names_and_ranks: "Thử thách qua lửa đạn thực chiến (Trial by fire); đào tạo tại chỗ (on-the-job training)"
    pronouns_and_pov: "Nội tâm Tanya ('mình')"
    modality_and_logic: "Quyết định trước mắt dựa vào phương pháp đã qua kiểm chứng của bản thân, coi thử thách qua lửa đạn thực chiến là kiểu đào tạo tại chỗ tốt nhất"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000353"
    names_and_ranks: "Wüstemann; Grantz"
    pronouns_and_pov: "Thoại chỉ dẫn của Tanya với Wüstemann; gọi Grantz là 'cậu ấy'"
    modality_and_logic: "Trấn an Wüstemann đừng sợ và chỉ dẫn bám theo sự dẫn dắt, quan sát từng động tác của Grantz"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000354"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại đáp lệnh của Wüstemann"
    modality_and_logic: "Giữ nét nói lắp căng thẳng 'R-rõ!'"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000355"
    names_and_ranks: "Tanya"
    pronouns_and_pov: "Trần thuật ngôi thứ ba ('Tanya')"
    modality_and_logic: "Trình tự thời gian: trút cơn mưa hỏa lực nghiền nát một pháp sư địch thành thịt băm trước khi vui vẻ lên tiếng với cấp dưới"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000356"
    names_and_ranks: "Trung úy (First Lieutenant)"
    pronouns_and_pov: "Thoại của Tanya với Wüstemann ('Cậu')"
    modality_and_logic: "Khuyên Trung úy thư giãn, tự nhìn lại bản thân và thả lỏng ra"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000357"
    names_and_ranks: "thưa Trung tá (Colonel)"
    pronouns_and_pov: "Thoại của Wüstemann với Tanya ('tôi' - 'thưa Trung tá ... ạ')"
    modality_and_logic: "Câu hỏi tu từ phủ định kèm nét nói lắp ('ch-chẳng phải tôi nên cố giữ sự tập trung sao ạ?')"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000358"
    names_and_ranks: "lính mới non nớt (greenhorn)"
    pronouns_and_pov: "Nội tâm đánh giá của Tanya"
    modality_and_logic: "Nhận xét đó là câu trả lời nghiêm túc kiểu lính mới non nớt và phủ định tính lý tưởng của nó"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000359"
    names_and_ranks: "none"
    pronouns_and_pov: "Nội tâm phân tích của Tanya"
    modality_and_logic: "Nhượng bộ có những lúc sự tập trung mang tính sống còn, nhưng ví con người như dây cao su: kéo căng hết cỡ sẽ mất độ đàn hồi; kết luận bảo toàn sức lực khi không cần dùng là kỹ năng không thể thiếu để sống sót"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000360"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Tanya với Wüstemann ('cậu')"
    modality_and_logic: "Giải thích không thể tận hưởng trận chiến nếu cứ cứng nhắc và căng thẳng; thả lỏng và nương theo dòng chảy là chìa khóa để sống sót trở về"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000361"
    names_and_ranks: "Phó chỉ huy (XO)"
    pronouns_and_pov: "Trần thuật ngôi thứ nhất của Tanya ('mình')"
    modality_and_logic: "Hành động đồng thời: Phó chỉ huy bất ngờ góp lời trong lúc thổi bay một toán địch khỏi bầu trời"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000362"
    names_and_ranks: "thưa Trung tá (Colonel)"
    pronouns_and_pov: "Thoại của Weiss với Tanya ('ngài ... ạ')"
    modality_and_logic: "Câu hỏi tò mò về điều Tanya suy nghĩ khi đang chiến đấu"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000363"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại của Tanya với Weiss ('Tôi')"
    modality_and_logic: "Phủ định ('Tôi chẳng nghĩ ngợi gì cả'), gọi đó là một bí quyết nghề nghiệp khác và bảo cấp dưới tùy ý vận dụng"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000364"
    names_and_ranks: "tiểu đoàn (battalion)"
    pronouns_and_pov: "Nội tâm Tanya ('mình')"
    modality_and_logic: "Khẳng định qua phủ định ('không thể phủ nhận') khi quan sát tiểu đoàn làm việc"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000365"
    names_and_ranks: "số quân bổ sung (replacements)"
    pronouns_and_pov: "Nội tâm Tanya ('Mình' - binh lính trong đơn vị là 'họ')"
    modality_and_logic: "Loại trừ số quân bổ sung, nhận xét phần lớn đơn vị là đám hiếu chiến nhưng hành động có kiểm soát; nhấn mạnh phép so sánh những người lính vận hành như cỗ máy được tra dầu trơn tru, mỗi người là một bánh răng bạo lực giữ cho tổng thể chạy êm"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000366"
    names_and_ranks: "none"
    pronouns_and_pov: "Nội tâm Tanya ('mình' - binh lính là 'họ')"
    modality_and_logic: "Quan hệ điều kiện: không câu nệ niềm tin của binh lính dưới quyền miễn sao nó giúp họ không hoảng loạn trên chiến trường"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000367"
    names_and_ranks: "quái vật mì Ý bay (flying spaghetti monsters)"
    pronouns_and_pov: "Nội tâm Tanya ('mình' - binh lính là 'Họ')"
    modality_and_logic: "Giả định nhượng bộ cực đoan: dù họ có tin vào quái vật mì Ý bay thì Tanya cũng chẳng bận tâm"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000368"
    names_and_ranks: "none"
    pronouns_and_pov: "Thoại lẩm bẩm của Tanya ('Chúng ta')"
    modality_and_logic: "Triết lý lao động chiến trường: phải tận tâm và làm việc chăm chỉ nhiều giờ liền, bên nào làm được nhiều hơn sẽ thắng"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000369"
    names_and_ranks: "pháp sư hải quân đánh bộ (marine mage); lưỡi kiếm ma pháp (magic blade)"
    pronouns_and_pov: "Trần thuật ngôi thứ nhất của Tanya ('Mình' - tên địch là 'hắn')"
    modality_and_logic: "Chuỗi hành động: gạt cú vung chém của pháp sư hải quân đánh bộ đang lao tới, đâm xuyên lưỡi kiếm ma pháp qua lưng hắn, lẩm bẩm một mình trước khi thở dài"
    emphasis: "none"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000370"
    names_and_ranks: "các buổi kích động thù hận (hate sessions)"
    pronouns_and_pov: "Nội tâm Tanya ('chúng ta', 'mình' - kẻ địch là 'chúng')"
    modality_and_logic: "Nhận xét địch đang điên tiết, mỉa mai giả định việc nổi giận giúp đánh giỏi hơn, và câu điều kiện trái thực tế ('Nếu đúng là thế thì mình đã chẳng ngại ngần gì mà tổ chức các buổi kích động thù hận cho chính quân của mình rồi')"
    emphasis: "none"
