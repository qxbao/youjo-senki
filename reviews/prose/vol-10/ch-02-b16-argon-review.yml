    severity: "minor"
    issue: "Cụm 'cô học trò nhỏ của mình' dùng đại từ phản thân 'mình' để quy chiếu về chủ ngữ ngôi thứ ba 'Trung tướng Zettour' trong lời trần thuật theo góc nhìn của Drake, dễ gây thoáng nhầm với đại từ nội tâm ngôi thứ nhất."
    basis: "Đối chiếu quy ước phân biệt đại từ trần thuật và nội tâm trong DEC-P01-001 cùng nguyên tắc diễn đạt rõ ràng trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'cô học trò nhỏ của ông ta'; không làm sai nghĩa câu nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000209"
    severity: "minor"
    issue: "Trong cùng một câu có hai đại từ 'anh' quy chiếu tới hai nhân vật khác nhau ('hỏi người cộng sự xem ý anh là gì' chỉ Mikel, 'kéo sự chú ý của anh quay lại' chỉ Drake), làm giảm nhẹ độ rõ ràng khi đọc lướt."
    basis: "Đối chiếu nguyên tắc viết tiếng Việt rõ ràng và giữ điểm nhìn mạch lạc trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh vế đầu thành 'Trước khi Drake kịp hỏi người cộng sự xem ý ông ấy là gì' hoặc 'hỏi xem người cộng sự có ý gì'; không làm sai nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000211"
    severity: "minor"
    issue: "Cụm 'công nghệ ma đạo tối tân' dùng từ 'ma đạo' thay vì 'ma pháp' vốn đang được dùng thống nhất cho các thuật ngữ cùng gốc trong dự án (như 'sĩ quan ma pháp', 'oanh kích ma pháp', 'lưỡi kiếm ma pháp')."
    basis: "Đối chiếu các mục thuật ngữ có yếu tố 'magic' trong work/run-state/pending-terms-index.yml."
    recommendation: "Ở bước chuốt văn, polisher nên cân nhắc đồng bộ thành 'công nghệ ma pháp tối tân của Lục quân Đế quốc'; không làm lệch nghĩa câu nên không bắt buộc sửa bản chuẩn."
