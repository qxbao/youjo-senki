    severity: "minor"
    issue: "Ở mệnh đề chính, cụm chỉ cảm giác thôi thúc phải đặt câu hỏi được dịch thành 'mình không khỏi bức xúc muốn hỏi'; từ 'bức xúc' làm rõ sớm sắc thái cảm xúc vốn mới được nêu trực tiếp ở đoạn p000016 tiếp theo."
    basis: "Đối chiếu sắc thái từ vựng tại p000015 và p000016 theo nguyên tắc không tự thêm giải thích trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'mình thấy buộc phải hỏi' hoặc 'mình không khỏi muốn hỏi' để bám sát nhịp tăng tiến cảm xúc từ p000015 sang p000016; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter020.xhtml/p000022"
    severity: "minor"
    issue: "Tính từ mang sắc thái tôn giáo/thiêng liêng bổ nghĩa cho sự riêng tư của tâm trí được dịch thoát ý thành 'bất khả xâm phạm'; cách dịch này hợp ngữ cảnh nhưng làm mờ sắc thái ẩn dụ tôn giáo vốn được Tanya dùng kiểu mỉa mai."
    basis: "Đối chiếu từ ngữ mở đầu p000022 và nguyên tắc giữ sắc thái từ vựng trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc dùng 'thiêng liêng' ('Trong cõi riêng tư thiêng liêng của tâm trí') hoặc giữ 'bất khả xâm phạm' nếu ưu tiên nhịp văn tự nhiên."
