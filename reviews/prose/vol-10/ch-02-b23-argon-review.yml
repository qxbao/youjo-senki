locked_choices:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000443"
    locked: "Khóa câu hỏi tu từ phủ định mở đầu '“Chẳng phải lượng ma lực đó là quá nhiều để một người đơn lẻ sử dụng sao? Đồ quái vật khốn kiếp.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000444"
    locked: "Khóa cấu trúc phủ định nguyên nhân kỹ thuật/công nghệ 'chẳng phải một kỹ thuật đặc biệt hay công nghệ tiên tiến nào đã làm nên điều này' và khẳng định 'Đơn giản chỉ là sức mạnh thuần túy của con lợn rừng kia mà thôi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000445"
    locked: "Khóa đại từ nội tâm 'Mình' theo DEC-P01-001 song hành với lối tự quy chiếu ngôi thứ ba 'Tanya', thuật ngữ 'Type 95', cách gọi miệt thị 'con ngốc này' và câu hỏi tu từ cuối đoạn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000446"
    locked: "Khóa định danh 'Con quái vật này', 'Being X', đại từ 'mình', thuật ngữ 'thuật thức' và cấu trúc tăng tiến 'vốn đã bất chấp mọi quy luật logic... thế mà lại còn thực sự đem thứ sức mạnh ấy trút vào một thuật thức cải biến cả thế giới theo đúng nghĩa đen'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000447"
    locked: "Khóa đại từ 'Mình', thuật ngữ 'pháp sư trên không át chủ bài', 'chiến dịch Rhine', tên riêng 'Tanya' và định danh quân hàm 'Trung úy Serebryakov'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000448"
    locked: "Khóa ẩn dụ 'người thầy vĩ đại nhất thế gian, dù học phí thường đắt đỏ vô cùng…' và đại từ khái quát 'bạn' trong mệnh đề điều kiện."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000449"
    locked: "Khóa đại từ nội tâm 'mình'/'Mình' và khẳng định 'Mình có nhiều phương án lựa chọn.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000450"
    locked: "Khóa các thuật ngữ 'thuật thức tấn công tầm xa', 'chống tiếp cận khu vực', 'các đòn tấn công trực diện', 'đòn tập kích bất ngờ', 'bức xạ', đại từ 'mình' và giả định 'Nói thẳng ra, mình phải là một kẻ ngốc mới bị nó bắn trúng'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000451"
    locked: "Khóa nhận định so sánh 'Có những lúc tốc độ cao lại là lớp phòng ngự tốt hơn cả giáp dày.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000452"
    locked: "Khóa mệnh đề điều kiện phủ định trong lời độc thoại '“Hừ, xem ra có bao nhiêu ma lực trên đời đi nữa mà không bắn trúng đích thì cũng vô giá trị thôi.”'."
