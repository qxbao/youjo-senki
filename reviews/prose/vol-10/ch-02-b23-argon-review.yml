findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000445"
    related_segment_ids: []
    severity: "minor"
    category: "terminology_consistency"
    issue: "Cụm từ chỉ năng lượng ma pháp dự trữ ở câu thứ ba đang được dịch là 'năng lượng ma thuật', hơi lệch sắc thái thuật ngữ nội bộ so với cách dùng 'ma pháp'/'ma lực' xuyên suốt hệ thống thuật ngữ quân sự – ma pháp của bộ truyện."
    evidence: "Theo work/run-state/pending-terms-index.yml và các lô trước, tính từ tương ứng trong văn cảnh quân sự được dịch nhất quán là 'ma pháp' hoặc 'ma lực'."
    recommendation: "Có thể chỉnh 'nguồn dự trữ năng lượng ma thuật quý giá' thành 'nguồn dự trữ năng lượng ma pháp quý giá' hoặc 'nguồn ma lực dự trữ quý giá' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000453"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000450"
    severity: "minor"
    category: "meaning_precision"
    issue: "Cụm danh từ bỏ lửng ở cuối câu đầu đang được dịch là 'nếu không phải vì một chút…', dễ khiến người đọc hiểu thành định lượng ('một chút gì đó') thay vì chỉ định về nhược điểm/vấn đề nhỏ của thuật thức tầm xa vừa phân tích ở p000450."
    evidence: "Theo canon/style-guide.md, cần giữ đúng đối tượng quy chiếu và mạch liên kết với lập luận trước đó."
    recommendation: "Có thể chỉnh thành 'nếu không phải vì cái điểm nhỏ nhặt đó…' hoặc 'nếu không vướng một vấn đề nhỏ đó…' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000454"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000453"
    severity: "minor"
    category: "logic_connector"
    issue: "Quan hệ giữa hai vế câu đầu ('Dù sẽ khá phiền phức, nhưng dọc theo đường rút lui của chúng mình chẳng có mấy chỗ che chắn') đang dùng cặp từ nối 'Dù... nhưng...' làm hai bất lợi (việc rút lui dưới hỏa lực truy kích rất phiền phức và việc thiếu chỗ che chắn) nghe như đối lập nhau."
    evidence: "Theo canon/style-guide.md, cần giữ đúng quan hệ logic giữa các mệnh đề khi chuyển sang tiếng Việt."
    recommendation: "Có thể chỉnh thành 'Dù chuyện đó sẽ khá phiền phức, dọc theo đường rút lui của chúng mình lại chẳng có mấy chỗ che chắn.' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000468"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000469"
      - "YS-LN10/Text/chapter010.xhtml/p000470"
    severity: "minor"
    category: "terminology_nuance"
    issue: "Thuật ngữ chỉ tỷ lệ trục trặc/nổ lệch của thuật thức đang được dịch là 'tỷ lệ bắn nhầm', có thể gợi nét nghĩa nhận diện nhầm mục tiêu, trong khi ở p000469–p000470 đối phương vẫn nhắm vào Tanya nhưng đạn nổ/thuật thức lệch hoặc xuyên ra mục tiêu nằm phía sau đường ngắm."
    evidence: "Theo canon/style-guide.md, cần giữ chính xác quan hệ nhân quả chiến thuật giữa p000468 và p000469–p000470."
    recommendation: "Có thể cân nhắc chỉnh thành 'tỷ lệ phát nổ sai lệch' hoặc 'tỷ lệ bắn chệch/sự cố' ở bước chuốt văn (hoặc giữ nếu hiểu 'bắn nhầm' theo nghĩa rộng là gây sát thương nhầm vào quân mình)."
