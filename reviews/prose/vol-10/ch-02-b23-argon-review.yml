    locked: "Khóa giả định quá khứ 'lẽ ra cũng đã có thể tung thêm một đòn tấn công nữa rồi', đại từ 'ả' chỉ pháp sư địch và 'chúng mình' chỉ Tanya cùng Visha."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000454"
