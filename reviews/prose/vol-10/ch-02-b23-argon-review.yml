    locked: "Khóa đại từ 'mình' và các thuật ngữ 'đan dệt một thuật thức khổng lồ đến mức lố bịch', 'thuật thức phát nổ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000458"
