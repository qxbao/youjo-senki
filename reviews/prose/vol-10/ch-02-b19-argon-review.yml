    severity: "minor"
    category: "meaning_modality"
    issue: "Câu hỏi nội tâm ở cuối đoạn đang kết bằng tiểu từ 'đâu?' ('nhưng đã đủ thời gian để cô ta tiếp cận đâu?'), mang sắc thái câu hỏi tu từ phủ định thay vì câu hỏi nghi vấn có–không mở để nối trực tiếp với tiếng hét phản bác '*KHÔNG!*' của các giác quan ở p000305; đồng thời cụm 'make contact' nên giữ đồng nhất với 'tiếp chiến' như ở p000299."
    evidence: "Theo canon/style-guide.md, cần giữ độ mở của câu hỏi nội tâm và mạch liên kết với câu trả lời phủ định trực tiếp ở p000305."
    recommendation: "Có thể chỉnh thành 'nhưng đã đủ thời gian để cô ta tiếp chiến rồi sao?' hoặc 'nhưng đã đủ thời gian để cô ta tiếp cận rồi sao?' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000316"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000317"
      - "YS-LN10/Text/chapter010.xhtml/p000319"
    severity: "minor"
    category: "context_word_choice"
    issue: "Danh từ 'their proximity' của đội hình pháp sư trên không đang bay ở độ cao lớn được dịch là 'việc họ đứng sát nhau', dùng động từ 'đứng' chưa thật sát với trạng thái tác chiến trên không."
    evidence: "Theo văn cảnh p000300, p000313 và p000319, đơn vị của Drake đang duy trì đội hình bay trên không trung ở độ cao 8.000."
    recommendation: "Có thể chỉnh nhẹ thành 'việc họ ở sát nhau' hoặc 'cự ly co cụm sát nhau của họ' khi chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000319"
    severity: "minor"
    category: "addition"
    issue: "Cụm chỉ độ cao trong nguồn chỉ nêu con số 'eight thousand' không kèm đơn vị đo, nhưng bản dịch thêm danh từ đơn vị 'mét' ('ở độ cao tám nghìn mét')."
    evidence: "Theo canon/style-guide.md, tránh tự thêm chi tiết không nêu trực tiếp trong câu nguồn."
    recommendation: "Có thể giữ sát nguồn là 'ở độ cao tám nghìn' (hoặc giữ nguyên nếu thống nhất theo mạch quy ước độ cao của chương)."
