findings:
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000157"
    severity: "minor"
    issue: "Ở câu đầu, cụm 'một mệnh lệnh trắng trợn đến mức này' mang sắc thái phán xét tiêu cực mạnh hơn so với từ gốc vốn chỉ sự rõ ràng, thẳng thừng (đặt trong thế đối lập với việc 'ẩn ý' ở vế trước)."
    basis: "Quy tắc giữ đúng bình diện đánh giá và không thêm sắc thái phán xét trong canon/style-guide.md tại p000157."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'một mệnh lệnh thẳng thừng đến mức này' hoặc 'một mệnh lệnh rõ ràng đến mức này'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000171"
    severity: "minor"
    issue: "Cụm 'hầu như sẽ chẳng từ thủ đoạn nào' mang sắc thái đạo đức tiêu cực hơn so với cấu trúc phủ định kép chỉ mức độ sẵn sàng cao độ của các sĩ quan trong nguồn."
    basis: "Quy tắc không thêm sắc thái phán xét hoặc đạo đức không có trong nguồn tại canon/style-guide.md."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'hầu như sẵn sàng làm bất cứ điều gì' hoặc 'hầu như chẳng nề hà việc gì'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000179"
    severity: "minor"
    issue: "Câu đầu lặp từ 'lại' hai lần gần nhau ('nhưng đôi khi chúng lại mang lại cảm giác') và tự thêm từ giải thích 'báo động' vào sau hình ảnh ẩn dụ 'những con chim hoàng yến', làm lộ trước ý 'đưa ra lời cảnh báo' ở câu thứ hai."
    basis: "Quy tắc không tự thêm giải thích và viết tiếng Việt tự nhiên trong canon/style-guide.md tại p000179."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'nhưng đôi khi chúng lại đem đến cảm giác giống những con chim hoàng yến hơn'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000186"
    severity: "minor"
    issue: "Trong lời thoại của cấp trên nói với Trung tá Drake, câu 'Nào, hãy nghe báo cáo của anh xem sao' dùng trợ từ mệnh lệnh 'hãy nghe' dễ tạo cảm giác yêu cầu người nghe tự nghe báo cáo của chính mình."
    basis: "Quy tắc diễn đạt tiếng Việt tự nhiên, rõ nghĩa trong canon/style-guide.md tại p000186."
    recommendation: "Ở bước chuốt văn có thể chỉnh thành 'Nào, để tôi nghe báo cáo của anh xem sao' hoặc 'Nào, giờ thì nghe báo cáo của anh xem sao'."
