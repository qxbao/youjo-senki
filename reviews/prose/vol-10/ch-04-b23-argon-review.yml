    severity: "minor"
    issue: "Cụm 'ở đầu dây bên kia' mang sắc thái liên lạc điện thoại hữu tuyến, trong khi ngữ cảnh tại đây là liên lạc qua sóng vô tuyến."
    basis: "Đối chiếu ngữ cảnh liên lạc vô tuyến từ p000611 đến p000624 và nguyên tắc dùng từ chuẩn xác trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể chỉnh thành 'ở đầu sóng bên kia' hoặc 'ở đầu bên kia'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000648"
    severity: "minor"
    issue: "Cụm 'bị bỏ lại phía sau lưng' hơi thừa chữ 'lưng' khi diễn đạt thành ngữ chỉ việc bị đối phương bỏ xa."
    basis: "Đối chiếu cấu trúc câu tại p000648 và nguyên tắc kết hợp từ tiếng Việt tự nhiên trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể chỉnh thành 'bị bỏ xa phía sau' hoặc 'bị bỏ lại tít phía sau'."
