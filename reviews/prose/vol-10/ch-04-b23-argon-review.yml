      - "Khóa phủ định 'Không làm được! Không thể truy kích.', sự chuyển đổi hợp lý giữa 'chúng ta' (phe Khối Thịnh vượng chung bị chơi xỏ) và 'Chúng tôi' (đơn vị của Scotch Leader cần hạ cánh tái tổ chức) cùng điều kiện loại trừ 'trừ phi các người muốn cả bọn chúng tôi cũng bị tiêu diệt sạch!'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000658"
    locks:
      - "Khóa hô hiệu 'Scotch Leader', đại từ 'Anh', thuật ngữ 'nhân viên mặt đất' và chi tiết hạ cánh xuống một căn cứ khác."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000659"
    locks:
      - "Khóa đại từ 'Chúng' - 'chúng ta' và tình thái dự cảm 'chuyện này có lẽ mới chỉ là khởi đầu thôi!'."
