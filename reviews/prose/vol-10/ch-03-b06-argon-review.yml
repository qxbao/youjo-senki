    severity: "minor"
    issue: "Trong câu thứ hai, cụm 'Các quốc gia đặt lợi ích quốc gia tối thượng của mình' lặp từ 'quốc gia' sát nhau và dùng từ 'mình' làm sở hữu cách ngôi thứ ba số nhiều, dễ trùng bề mặt với đại từ độc thoại nội tâm 'mình' của Tanya ở các đoạn lân cận."
    basis: "Đối chiếu quy ước đại từ nội tâm trong DEC-P01-001 và nhịp văn nghị luận nội tâm tại p000068."
    recommendation: "Ở bước chuốt văn có thể lược từ 'của mình' hoặc tinh chỉnh nhẹ thành 'Các nước đặt lợi ích quốc gia tối thượng vào việc giành chiến thắng trong những trận đánh này'."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000075"
    severity: "minor"
    issue: "Trong lời thoại của Tanya với Tướng Romel, câu thứ hai mở đầu bằng 'Tôi nghĩ' nhưng cuối câu lại dùng 'ngấm vào người mình mất rồi ạ', tạo sự pha trộn nhẹ giữa đại từ thoại ('tôi') và đại từ phản thân thân mật ('mình')."
    basis: "Đối chiếu hệ đại từ xưng hô trong thoại cấp dưới – cấp trên giữa Tanya và Tướng Romel xuyên suốt ch-03."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'ngấm vào người tôi mất rồi ạ' hoặc 'bắt đầu làm tôi bị lây mất rồi ạ' để giữ thuần nhất ngôi xưng 'tôi' trong thoại."
