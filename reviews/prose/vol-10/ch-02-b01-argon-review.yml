    severity: "minor"
    issue: "Chủ thể đầu câu đang nối tiếp nhóm sĩ quan Lục quân Đế quốc được triệu tập ở p000004 khi họ tản về các tiểu đoàn tương ứng của mình; dịch là 'những người lính' hơi làm mờ sự phân tầng giữa nhóm sĩ quan nhận lệnh ở p000004-p000005 với binh lính thường ở p000010, dù trong tiếng Việt 'những người lính' vẫn có thể hiểu rộng là quân nhân nói chung và không làm sai mạch sự kiện."
    basis: "Đối chiếu mạch quy chiếu giữa p000004, p000005 và p000010-p000011."
    recommendation: "Có thể giữ nguyên hoặc cân nhắc đổi thành 'họ' / 'các sĩ quan ấy' ở bước chuốt văn nếu muốn làm rõ hơn sự chuyển dịch điểm nhìn từ cấp sĩ quan sang binh lính; không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter008.xhtml/p000027"
    severity: "minor"
    issue: "Cách dịch 'rất khó chấp nhận' ở câu cuối hơi nghiêng sang thái độ phản kháng tâm lý so với sắc thái nhận thức ('khó tiêu hóa' / 'khó mà hiểu nổi' / 'khó lý giải nổi' khi cố phân tích mệnh lệnh phi chiến lược)."
    basis: "Đối chiếu mạch lập luận nhận thức của các sĩ quan chỉ huy từ p000025 đến p000029."
    recommendation: "Chấp nhận được trong ngữ cảnh cảm xúc bức bối của cấp chỉ huy; polisher có thể cân nhắc 'khó mà hiểu nổi' hoặc giữ nguyên."
