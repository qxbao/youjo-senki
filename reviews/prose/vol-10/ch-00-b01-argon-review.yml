locked_choices:
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000001"
    locked: "Giữ tiêu đề 'NGÀY 25 THÁNG 7 NĂM THỐNG NHẤT 1927, ĐẾ ĐÔ'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000002"
    locked: "Giữ tình thái khẳng định tất yếu ('ắt hẳn cũng là một thời buổi bất hạnh')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000003"
    locked: "Tên riêng 'Tào Tháo', 'Trung Hoa', đại từ 'ông ta'; giữ sắc thái đánh giá nhượng bộ ('Ít nhất cũng phải nói rằng...')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000004"
    locked: "Đại từ 'ông ta' (Tào Tháo), thuật ngữ 'người nông dân', 'thần dân nhà Hán'; giữ câu hỏi mở đầu và câu giả định tiếp nối."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000005"
    locked: "Giữ câu hỏi giả định ('Nếu được quyền lựa chọn, liệu họ có tự nguyện chọn...') và câu khẳng định đối lập ('Chắc chắn đại đa số người đời sẽ thà chọn...'); giữ 'Tào Tháo', 'triều Hán', đại từ 'họ' và 'ông ta'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000006"
    locked: "Giữ cấu trúc điều kiện phủ định ('Khi không có..., đơn giản là người ta chẳng việc gì phải cần đến...'), câu đảo chiều ('Tất nhiên, điều ngược lại cũng hoàn toàn đúng') và quan hệ nhân quả ('Lý do duy nhất khiến... là vì...')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000007"
    locked: "Giữ định danh 'Đế quốc' và câu chuyển ý liên hệ trực tiếp với lập luận trước."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000008"
    locked: "Giữ thuật ngữ 'Heimat' (không in nghiêng) và nét nghĩa gắn kết vì một chính nghĩa chung."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000009"
    locked: "Chủ thể 'Đế quốc', cụm 'phát lời hiệu triệu cầm vũ khí tới từng vùng lãnh thổ của mình'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000010"
    locked: "Giữ cấu trúc phủ định ('không gì có thể thay thế được những màn tuyên truyền chính thức bất tận của Đế quốc') và hệ quả ('khiến người dân nước này tin vào những lời dối trá còn nguy hiểm hơn')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000011"
    locked: "Giữ điều kiện phủ định kép ('sẽ chẳng thể nào nhìn thấy hồi kết của cuộc chiến nếu toàn thể Đế quốc không đồng lòng sát cánh bên nhau')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000012"
    locked: "Định danh và cấp bậc 'Tanya von Degurechaff, trung tá Lục quân Đế quốc'; giữ mức độ chắc chắn tuyệt đối ('tin chắc không chút mảy may nghi ngờ') và quan hệ so sánh hơn giữa lượng lời kêu gọi đoàn kết và khả năng cung ứng."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000013"
    locked: "Giữ phép so sánh chênh lệch ('chút đoàn kết ít ỏi nào có thể tìm thấy cũng đều thua xa mức độ đang cần đến')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000014"
    locked: "Thuật ngữ kinh tế 'cung và cầu' (supply and demand), giữ thể bị động hoàn thành ('đã bị phá hủy')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000015"
    locked: "Thuật ngữ 'hợp lý, có tư duy logic' (rational, logical), 'tính toàn vẹn của thị trường' (market's integrity); giữ tình thái giả định ('cũng sẽ phải phẫn nộ')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000016"
    locked: "Thoại độc thoại của Tanya dùng 'Chúng ta', giữ phủ định ('không còn ở vào vị thế... nữa rồi') và thuật ngữ 'thị trường tự do' (free market)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000017"
    locked: "Trần thuật gọi 'Tanya', đại từ 'cô'; giữ phủ định ('chẳng thể kìm nén trong lòng') và cụm 'mối mâu thuẫn bài trừ lẫn nhau'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000018"
    locked: "Giữ điệp từ 'hợp lý' (rational) ở cả ba vị trí, thuật ngữ 'chủ nghĩa tư bản' (capitalism), 'tính toàn vẹn của thị trường' (market's integrity), 'Mười Điều Răn' (Ten Commandments)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000019"
    locked: "Nội tâm Tanya tự xưng 'Mình' (theo DEC-P01-001); khóa thuật ngữ 'tính hợp lý có giới hạn' (bounded rationality)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000020"
    locked: "Nội tâm Tanya tự xưng 'Mình'; khóa thuật ngữ 'tính hợp lý' (rationality)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000021"
    locked: "Đại từ phiếm chỉ 'người ta', khóa thuật ngữ 'tính tối thượng của tính hợp lý với tư cách là một mô hình'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000022"
    locked: "Giữ giọng cảm thán mỉa mai của câu nội tâm ('Ấy thế mà ôi thôi, thực tại của cái thế giới này mới tuyệt diệu làm sao!')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000023"
    locked: "Giữ phủ định tuyệt đối ('chẳng mảy may có lấy một khái niệm nào') và đúng phạm vi nhấn mạnh Markdown '*thực sự muốn mua*' theo DEC-P01-002."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000024"
    locked: "Thoại của Tanya: giữ 'Đế quốc là một con quái thú chimera', phép điệp 'khao khát hòa bình' / 'chẳng cầu mong gì ngoài hòa bình' và hình ảnh ẩn dụ 'cùng nằm chung một giường nhưng lại mơ những giấc mộng khác nhau'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000025"
    locked: "Trần thuật nêu chủ thể 'Đế quốc' và 'Tanya', giữ hình ảnh 'nụ cười méo xệch' (wretched smile)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000026"
    locked: "Thuật ngữ 'Lục quân Đế quốc', 'công cụ bạo lực', 'nhà nước dân tộc', 'Đế quốc', 'quan hệ ủy nhiệm – đại diện'; giữ đúng phạm vi nhấn mạnh Markdown '*phiên bản*' theo DEC-P01-002."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000027"
    locked: "Giữ đối lập giữa câu phủ định ('Đế quốc không hề muốn hòa bình') và câu khẳng định có dấu ngoặc kép ('Thứ mà nó muốn là “chiến thắng”'); đại từ 'nó' chỉ Đế quốc."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000028"
    locked: "Đại từ 'nó' (Đế quốc), thuật ngữ 'thỏa thuận đình chiến hiện tại' (current armistice agreement); giữ câu hỏi tu từ và câu trả lời phủ định ngắn 'Không hề.'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000029"
    locked: "Giữ câu hỏi tu từ về 'sự hòa giải làm con đường dẫn tới hòa bình' và câu trả lời phủ định 'Không hề.'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000030"
    locked: "Giữ câu hỏi tu từ về 'làm thỏa mãn Đế quốc' và câu trả lời phủ định 'Không hề.'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000031"
    locked: "Đại từ 'họ', giữ cấu trúc giới hạn ('chẳng qua chỉ là chiến thắng vì bản thân sự chiến thắng mà thôi')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000032"
    locked: "Giữ phủ định ('Chuyện này chẳng còn chút hợp lý nào nữa') và phép đối lập giữa 'Dùng lửa để dập lửa có thể hợp logic...' với việc 'sở cứu hỏa cứ mỗi lần có cháy lại điều một chiếc xe tăng đi thay vì xe cứu hỏa'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000033"
    locked: "Nội tâm Tanya tự xưng 'mình', gọi phía Đế quốc là 'họ'; giữ nhận định khẳng định ('Rõ ràng là họ đã hoàn toàn đánh mất mục tiêu của mình rồi')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000034"
    locked: "Giữ câu hỏi tu từ mỉa mai ('Thế mà họ cũng gọi đây là một quốc gia ư?'), phủ định ('Chẳng hề có bất kỳ chiến lược nào...') và hình ảnh 'cỗ máy chiến tranh'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000035"
    locked: "Nội tâm Tanya tự xưng 'mình', dùng 'chúng ta' khi bao hàm bản thân trong guồng máy chiến tranh của Đế quốc; giữ quan hệ nhượng bộ ('Dù... đáng lẽ phải là..., mình vẫn...')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000036"
    locked: "Tanya tự xưng 'mình', gọi người đọc giả định ở thế giới hiện đại là 'những ai trong số các bạn'; giữ tình thái 'có lẽ sẽ khó hiểu'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000037"
    locked: "Dùng đại từ ngôi thứ hai giả định chung 'bạn', thuật ngữ 'chuỗi thức ăn nhanh', tên riêng 'Reich’s'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000038"
    locked: "Đại từ 'bạn', 'Họ' (chủ sở hữu và cổ đông), tên riêng 'Reich’s'; giữ nguyên chỉ thị trong ngoặc kép ('“tối đa hóa lợi nhuận nhanh nhất có thể”') và chuỗi ba phủ định ('không kế hoạch, không mục tiêu, và cũng chẳng có định hướng nào')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000039"
    locked: "Đại từ 'Họ', 'bạn'; giữ phủ định ('chẳng cấp thêm cho bạn chút ngân sách hay thẩm quyền nào')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000040"
    locked: "Giữ câu điều kiện giả định ('Nếu việc kinh doanh thất bại, chính các nhân viên sẽ là những người lâm vào cảnh rắc rối') và câu hỏi tu từ cảm thán kết bằng '?!'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000041"
    locked: "Giữ phủ định toàn phần ('Chẳng người lao động nào có thể mang lại thành công cho công ty của họ dưới những điều kiện bất khả thi ấy')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000042"
    locked: "Chủ thể 'Đế quốc', giữ câu kết khép lại phép loại suy ('đây chính xác là những gì Đế quốc đang làm khi đòi hỏi chiến thắng từ người dân của mình')."
