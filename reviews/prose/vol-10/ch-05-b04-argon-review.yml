findings:
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000109"
    severity: "minor"
    issue: "Từ nhấn mạnh chỉ những người lính trẻ mới nhập ngũ trong lời than của Ballmer được dịch là '*lũ trẻ con*'; từ 'lũ' hơi nghiêng về sắc thái miệt thị hơn là sự ái ngại của người chỉ huy khi phải đưa lính non ra trận."
    basis: "Đối chiếu ngữ cảnh lời thoại của Chỉ huy Ballmer tại p000109 và nguyên tắc giữ đúng sắc thái đánh giá trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành '*mấy đứa trẻ*' hoặc '*đám trẻ*' để giữ trọn sự cảm thông của vị chỉ huy; không làm sai nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000110"
    severity: "minor"
    issue: "Câu thứ hai bổ sung cụm 'của cô ta' ('bắt gặp bất kỳ động tĩnh gì của cô ta ở đây') trong khi nguyên gốc dùng đại từ bất định trung tính và các câu thoại liền trước (p000107–p000108) chỉ gọi đối phương là 'pháp sư đó', 'con quái vật đó', 'con ác quỷ đó'."
    basis: "Đối chiếu p000107–p000110 và nguyên tắc không tự thu hẹp độ mở hay thêm chi tiết giải thích trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc lược 'của cô ta' (ví dụ 'Tôi vẫn nghi ngờ khả năng chúng ta sẽ thấy bất kỳ động tĩnh gì ở đây') để giữ đúng độ mở và cách quy chiếu trung tính của câu thoại gốc."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000117"
    severity: "minor"
    issue: "Thành ngữ tiếng Anh chỉ việc tính toán hoặc mừng rỡ quá sớm trước khi sự việc ngã ngũ được dịch bằng tục ngữ Việt 'chưa đỗ ông nghè đã đe hàng tổng'; tục ngữ này mang nghĩa hống hách khi chưa có địa vị và đậm màu sắc khoa cử phong kiến bản địa, chưa thật khớp với mạch suy nghĩ của một sĩ quan Khối Thịnh vượng chung đang tính chuyện sau khi hoàn thành nhiệm vụ."
    basis: "Đối chiếu nghĩa thành ngữ và bối cảnh nhân vật Drake tại p000117."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc thay bằng cách diễn đạt trung tính và sát nghĩa hơn như 'tính chuyện quá xa khi mọi việc còn chưa ngã ngũ' hoặc 'vội tính trước khi mọi chuyện ngã ngũ'."
