findings:
  - segment_id: YS-LN10/Text/chapter020.xhtml/p000108
    severity: moderate
    category: terminology_consistency
    issue: "Tại p000108, cụm thuật ngữ 'aerial magic battalion' đang được dịch là 'tiểu đoàn ma pháp trên không', chưa đồng bộ với phương án đề xuất đã khóa nhất quán trong work/run-state/pending-terms-index.yml của vol-10 và các tập trước là 'tiểu đoàn pháp sư trên không'."
    recommendation: "Đổi 'tiểu đoàn ma pháp trên không' thành 'tiểu đoàn pháp sư trên không' trong p000108 để giữ tính nhất quán thuật ngữ đơn vị quân sự xuyên suốt tập 10."
  - segment_id: YS-LN10/Text/chapter020.xhtml/p000089
    severity: minor
    category: nuance_and_register
    issue: "Tại p000089, cụm 'tiết lộ cho ông ấy biết cái tin khủng khiếp đó' diễn đạt đúng nghĩa đen nhưng hơi nặng về sắc thái tiết lộ bí mật mới, trong khi ngữ cảnh là Tanya giữ thái độ điềm tĩnh để nói thẳng cho Conrad biết sự thật phũ phàng (nối tiếp từ p000086 và dẫn vào lời thoại p000090)."
    recommendation: "Có thể giữ nguyên vì không sai nghĩa, hoặc tinh chỉnh nhẹ ở bước polish thành 'cho ông ấy biết tin dữ đó' / 'nói thẳng cho ông ấy biết sự thật tồi tệ đó' để mạch văn tự nhiên hơn."
  - segment_id: YS-LN10/Text/chapter020.xhtml/p000106
    severity: minor
    category: pov_and_pronoun_flow
    issue: "Tại p000106, nguyên tác đan xen giữa độc thoại nội tâm ngôi thứ nhất và lời kể nửa trực tiếp nhắc tên 'Tanya' cùng đại từ ngôi thứ ba ở câu cuối ('giá trị thực sự của cô'). Bản dịch đã xử lý rất chuẩn lỗi in 'comprises' (= 'compromises' / 'những thỏa hiệp khó chịu') của bản gốc, nhưng vế cuối câu kết dùng 'của cô' ngay sau mạch độc thoại 'Mình' có thể hơi gợn nhẹ."
    recommendation: "Có thể giữ nguyên để bám sát cấu trúc chuyển điểm nhìn của nguyên tác, hoặc cân nhắc đổi 'giá trị thực sự của cô' thành 'giá trị thực sự của mình' / 'giá trị thực sự của bản thân' ở bước polish nếu muốn mạch độc thoại liền lạc hơn."
