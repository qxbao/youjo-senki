    severity: "minor"
    issue: "Ở câu cuối, danh từ chỉ chức danh công vụ quy chiếu về Tanya được dịch thoát ý theo đối tượng thành 'đương sự'; dù mạch văn tự nhiên và đúng người được nhắc tới, bản gốc dùng từ mang sắc thái chỉ viên chức/quan chức."
    basis: "Đối chiếu từ ngữ câu cuối của p000003 và nguyên tắc giữ sắc thái từ vựng trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc dùng 'vị quan chức này' hoặc giữ 'đương sự' nếu ưu tiên nhịp văn tự nhiên; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter016.xhtml/p000021"
    severity: "minor"
    issue: "Ở câu thứ hai, cụm chỉ các đơn vị ngoài chiến trường được dịch là 'các đơn vị thực địa'; cách dịch này hiểu được nhưng trong ngữ cảnh quân sự thường dùng 'các đơn vị dã chiến' hoặc 'các đơn vị ngoài hiện trường/ngoài mặt trận' tự nhiên hơn."
    basis: "Đối chiếu thuật ngữ câu thứ hai của p000021 với quy ước diễn đạt tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi nhẹ thành 'các đơn vị dã chiến' để thuật ngữ quân sự mượt hơn."
