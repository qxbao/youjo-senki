findings:
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000567"
    severity: "minor"
    issue: "Lặp cụm từ 'vô tuyến' khá sát nhau ở hai câu đầu ('máy bộ đàm vô tuyến' và 'các tần số vô tuyến')."
    basis: "Đối chiếu nhịp văn tại p000567 và nguyên tắc diễn đạt tiếng Việt tự nhiên, cô đọng trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể lược bớt một từ 'vô tuyến' (ví dụ: 'hét lớn vào máy bộ đàm. Ông phát thông điệp đi khắp các tần số vô tuyến...')."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000569"
    severity: "minor"
    issue: "Cụm 'mở đường máu' trong 'càn lướt mở đường máu xuyên qua' thường gợi sắc thái quân bị vây khốn liều chết thoát thân, trong khi ngữ cảnh tại đây là đại đội Pháp sư Định danh của Đế quốc đang áp đảo hoàn toàn và cậy sức mạnh càn lướt xuyên thủng tuyến phòng không."
    basis: "Đối chiếu ngữ cảnh tác chiến tại p000569 và nguyên tắc giữ đúng sắc thái trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể chỉnh thành 'đang tìm cách càn lướt đột phá xuyên qua!' hoặc 'đang tìm cách dùng vũ lực càn lướt xuyên qua!'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000583"
    severity: "minor"
    issue: "Cụm 'Lũ chó săn Đế quốc' hơi lệch nhẹ sắc thái vì 'chó săn' thường chỉ tay sai phục vụ một thế lực khác, trong khi lời chửi ở đây nhắm trực tiếp vào quân Đế quốc."
    basis: "Đối chiếu sắc thái lời thoại tại p000583 và nguyên tắc dịch chuẩn xác trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'Lũ chó Đế quốc khốn kiếp!'."
