      - "Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, đại từ 'họ' và ý truyền ý thức mạnh mẽ về mục tiêu chiến đấu."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000433"
    locks:
      - "Khóa các phủ định và lập luận nội tâm cuối đoạn về 'Ý chí', 'cảm giác tự chán ghét chính mình' và cảnh báo việc mất khả năng nhận biết điều sai trái sẽ dẫn tới sự bất tài thực sự."
