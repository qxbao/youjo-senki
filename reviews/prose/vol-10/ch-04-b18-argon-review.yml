findings:
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000409"
    severity: "minor"
    issue: "Ở câu thứ hai, thành ngữ tiếng Anh chỉ việc quen thuộc diễn ra như thường lệ được dịch thành 'chuyện thường ngày ở huyện'. Cách nói có yếu tố hành chính bản địa ('ở huyện') hơi lệch màu sắc bối cảnh quân sự phương Tây của tác phẩm."
    basis: "Đối chiếu sắc thái văn phong tại p000409 và hướng dẫn giữ giọng kể tự nhiên, phù hợp ngữ cảnh trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'chuyện thường ngày' hoặc 'chuyện cơm bữa' để hợp bối cảnh hơn; không ảnh hưởng nghĩa cốt lõi."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000413"
    severity: "minor"
    issue: "Ở câu cuối, cụm thành ngữ khen binh sĩ dày dạn, cứng cỏi được dịch là 'rắn rỏi như đinh đóng cột'. Trong tiếng Việt, 'như đinh đóng cột' thường đi với 'chắc' để chỉ lời nói hoặc sự việc chắc chắn, bất di bất dịch, khi ghép với tính từ chỉ phẩm chất con người 'rắn rỏi' tạo cảm giác lệch kết hợp từ."
    basis: "Đối chiếu nghĩa của thành ngữ tại p000413 và nguyên tắc ưu tiên kết hợp từ tiếng Việt tự nhiên trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể đổi thành 'cứng cỏi như sắt đá' hoặc 'rắn rỏi như thép tôi'."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000415"
    severity: "minor"
    issue: "Ở câu đầu tiên, hai đại từ ngôi thứ nhất số nhiều cùng chỉ tập thể đơn vị (tiểu đoàn pháp sư từng tác chiến tại Khối Thịnh vượng chung) được dịch lần lượt là 'Chúng ta' và 'mình' ('Chúng ta sắp sửa tấn công một vùng đất mà trước đây mình từng ghé thăm'), làm thu hẹp phạm vi chủ thể ở mệnh đề quan hệ."
    basis: "Đối chiếu mạch quy chiếu với p000414 và các câu tiếp theo trong p000415."
    recommendation: "Ở bước chuốt văn, polisher nên đồng bộ đại từ ở mệnh đề sau thành 'chúng ta' ('mà trước đây chúng ta từng ghé thăm') hoặc lược chủ ngữ lặp ('mà trước đây từng ghé thăm')."
