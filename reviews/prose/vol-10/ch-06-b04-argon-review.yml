findings:
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000102"
    severity: "minor"
    issue: "Hai câu đầu lặp lại cấu trúc mở đầu 'Về phần... / về phần...', đồng thời cụm 'vấn đề tranh chấp lãnh thổ dai dẳng với Ildoa' hơi thu hẹp quan hệ sở hữu so với tính từ chỉ thuộc tính của Ildoa trong nguyên văn."
    basis: "Đối chiếu p000102 và nguyên tắc giữ đúng độ mở ngữ nghĩa, diễn đạt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh câu hai thành 'Thế nhưng, đối với những kẻ thù của Đế quốc...' và đổi cụm ở câu ba thành 'vấn đề tranh chấp lãnh thổ dai dẳng của Ildoa'."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000111"
    severity: "minor"
    issue: "Cụm 'kéo dài sự sụp đổ tất yếu' ở câu đầu nghe hơi gượng trong tiếng Việt (dễ gợi ý kéo dài quá trình đang sụp đổ thay vì kéo dài thời gian trước khi sụp đổ), trong khi câu thứ hai đã dịch rất thoát cùng động từ đó là 'trì hoãn sự sụp đổ ấy'."
    basis: "Đối chiếu p000111, mạch lập luận câu giờ ở p000109–p000113 và nguyên tắc kết hợp từ tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể thống nhất câu đầu thành 'trì hoãn sự sụp đổ tất yếu mà đất nước họ đang phải đối mặt' để mạch logic giữa hai câu liền lạc hơn."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000116"
    severity: "minor"
    issue: "Cụm 'thực tế lại chứng tỏ là kém kỳ diệu và kém phấn khởi hơn nhiều' còn mang dấu vết cú pháp dịch sát từ nguyên văn, nhịp câu tiếng Việt hơi cứng."
    basis: "Đối chiếu p000116 và nguyên tắc tránh bám máy móc cấu trúc câu tiếng Anh trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc làm mượt thành 'nhưng… thực tế lại chẳng mấy kỳ diệu và đáng phấn khởi như những gì đăng trên mặt báo'."
