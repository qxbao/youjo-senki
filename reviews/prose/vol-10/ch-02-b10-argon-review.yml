    basis: "Đối chiếu sắc thái câu thứ hai của p000019 và quy tắc không thêm sắc thái miệt thị trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'đám sĩ quan trẻ tuổi hơn' thành 'các sĩ quan trẻ tuổi hơn' hoặc 'lớp sĩ quan trẻ tuổi hơn' để trung tính và chuẩn phong thái tướng lĩnh hơn."
