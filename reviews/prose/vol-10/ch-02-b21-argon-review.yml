    severity: "minor"
    category: "pronouns_viewpoint"
    issue: "Trong câu thứ hai, cụm sở hữu 'ngay sau phòng tuyến của mình' đặt liền sau câu mở đầu có chủ ngữ tự xưng 'Mình' (Tanya) gây lưỡng nghĩa quy chiếu (dễ đọc nhầm thành phòng tuyến của Tanya thay vì phòng tuyến của quân địch)."
    evidence: "Theo canon/style-guide.md và DEC-P01-001, cần giữ rõ chủ thể quy chiếu trong độc thoại nội tâm dùng đại từ 'mình'."
    recommendation: "Có thể chỉnh thành 'ngay sau phòng tuyến của chúng' ở bước chuốt văn để phân biệt rõ với đại từ tự xưng 'Mình'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000403"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000380"
      - "YS-LN10/Text/chapter010.xhtml/p000386"
