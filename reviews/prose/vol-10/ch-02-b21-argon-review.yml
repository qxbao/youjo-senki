locked_choices:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000363"
    locked: "Khóa đại từ trần thuật 'Anh' cho Drake, cụm 'lưỡi kiếm của pháp sư Đế quốc', thuật ngữ 'thuật thức bắn tỉa quang học', tên 'Drake' và chi tiết 'hiện thực hóa vụ nổ cuối cùng của mình'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000364"
    locked: "Khóa thuật ngữ 'thuật thức', tên 'Drake', đại từ 'anh' và cụm 'một tia hy vọng thoáng qua'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000365"
    locked: "Khóa nguyên vẹn chuỗi dấu câu cảm thán '“?!!!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000366"
    locked: "Khóa chủ thể 'Pháp sư địch', tình thái quá khứ giả định 'lưỡi kiếm lẽ ra đã xuyên thủng vai anh', tên 'Drake' và suy đoán 'nhiều khả năng là báng súng—nện thẳng vào bụng mình'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000367"
    locked: "Khóa thuật ngữ 'thuật thức', quan hệ nhân quả 'khiến nỗ lực liều mạng cuối cùng thất bại chỉ vài mili giây trước khi kịp phát nổ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000368"
    locked: "Khóa 'Pháp sư địch', tên 'Drake', đại từ 'anh' và cụm 'bằng thứ tiếng Khối Thịnh vượng chung lưu loát hoàn hảo'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000369"
    locked: "Khóa lời quát tháo trong thoại của pháp sư địch: '“Tránh xa đường ta ra, đồ khốn.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000370"
    locked: "Khóa tiếng rên đứt quãng của Drake: '“Khốn… kiếp…”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000371"
    locked: "Khóa câu thoại tiễn biệt '“Tạm biệt nhé, tên người Anh.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000372"
    locked: "Khóa tên 'Drake' và chi tiết 'một chiếc ủng da không chút khách khí đạp văng Drake ra xa'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000373"
    locked: "Khóa định danh 'Trung tá Drake', đại từ 'anh', tình thái biểu kiến 'dường như đang rút một khẩu tiểu liên ra' và trạng thái 'trong lúc anh vẫn tiếp tục rơi xuống'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000374"
    locked: "Khóa đúng phạm vi nhấn mạnh Markdown '*À, chết tiệt thật. Mình sẽ không gục ngã mà không đánh trả đâu.*' theo DEC-P01-002, phân biệt đại từ 'Mình' (nội tâm) với 'anh' (trần thuật), cùng thuật ngữ 'thuật thức phát nổ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000375"
    locked: "Khóa đại từ 'Anh', quan hệ đối lập 'đã ép cơ thể mình vượt quá giới hạn từ lâu, nhưng vẫn gắng gượng ép bản thân hoàn tất một thuật thức cuối cùng'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000376"
    locked: "Khóa đại từ 'anh', so sánh 'như thể não anh sắp sửa tan chảy đến nơi' và khẳng định 'vẫn còn tỉnh táo. Anh biết rõ mình cần phải làm gì'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000377"
    locked: "Khóa định danh 'Trung tá Drake', thuật ngữ 'thuật thức', mốc thời gian 'ngay trước khi tầm mắt chìm vào bóng tối' và hình ảnh 'kẻ địch đang uyển chuyển lượn vòng trên không trung'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000378"
    locked: "Khóa phủ định 'Anh biết mình không thể thắng' và mục đích tối thiểu 'chí ít cũng phải thiêu rụi được cái đuôi của con ác quỷ khốn kiếp kia'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000379"
    locked: "Khóa tiếng cười và lời chửi trong thoại của Drake: '“Ha-ha-ha! Nhận lấy này, đồ khốn kiếp!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000380"
    locked: "Khóa chuyển điểm nhìn sang ngôi thứ nhất nội tâm của Tanya với đại từ 'Mình' và tự xưng tên 'Tanya' theo DEC-P01-001, đúng phạm vi nhấn mạnh Markdown '*sôi máu vì giận*' theo DEC-P01-002, cùng phủ định 'Chẳng có cách nào giữ được vẻ bình tĩnh thường ngày của Tanya sau khi chứng kiến sự liều lĩnh phi lý đến nhường ấy'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000381"
    locked: "Khóa đại từ nội tâm 'mình' và cụm 'một trong các sĩ quan chỉ huy của đơn vị địch'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000382"
    locked: "Khóa hình ảnh 'chuẩn xác như một ca phẫu thuật, giữ những tổn thất không cần thiết ở mức tối thiểu' và so sánh bậc nhất 'cuộc tập kích ôn hòa và nhân đạo nhất mà bất kỳ ai có thể thực hiện tại một vùng chiến sự'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000383"
    locked: "Khóa thuật ngữ 'Lục quân Đế quốc', đại từ 'bản thân mình' và sắc thái mỉa mai '—và tất nhiên là cho cả bản thân mình nữa'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000384"
    locked: "Khóa cụm 'những pha cơ động né tránh khẩn cấp này' và đánh giá 'đã là công bằng hết mức có thể rồi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000385"
    locked: "Khóa đại từ 'mình' và cấu trúc nhấn mạnh 'Phản ứng mà mình nhận lại mới là thứ không tài nào tin nổi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000386"
    locked: "Khóa chủ thể 'Tên sĩ quan đó', đại từ 'hắn', cụm 'ảo ảnh quang học ở cự ly cực gần', thuật ngữ 'thuật thức phát nổ toàn lực' và hệ quả 'cầm chắc việc chính hắn cũng sẽ bị cuốn vào vụ nổ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000387"
    locked: "Khóa 'đánh bom tự sát', phủ định 'đâu phải cuộc giao tranh này là thù oán cá nhân gì', đại từ 'mình' và đối lập 'hiểu được việc xem binh lính như vũ khí, nhưng tự nguyện biến bản thân thành vũ khí lại là một tội ác chống lại nhân loại'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000388"
    locked: "Khóa câu cảm thán nội tâm 'À… cái thế giới này thật thối nát làm sao.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000389"
    locked: "Khóa đại từ 'mình', phủ định 'Cũng đâu phải mình đòi hỏi…', 'Mình chẳng cần các người phải chơi đúng luật' và lời kêu gọi 'ít nhất chúng ta hãy cố mà giữ lấy nhân tính của mình chứ'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000390"
    locked: "Khóa lời độc thoại thành tiếng trong ngoặc kép của Tanya: '“Vậy đây chính là kết cục của con người ta khi cả đời chỉ biết đánh trận sao.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000391"
    locked: "Khóa câu cảm thán và câu hỏi tu từ biểu thị sự ghê tởm của Tanya."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000392"
    locked: "Khóa đại từ nội tâm 'Mình', thuật ngữ 'thuật thức', 'thuật thức phát nổ' và ý đánh vào phía sau phòng tuyến quân địch."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000393"
    locked: "Khóa đại từ 'Mình', 'chúng' và ý định 'thả thêm vài quả nữa xuống bất cứ chỗ nào chúng bắt đầu tản ra'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000394"
    locked: "Khóa thuật ngữ 'mồi nhử quang học', 'mồi nhử', đại từ 'Kẻ địch của chúng ta'/'bọn chúng', cùng nhận định 'Không chiến diễn ra trong không gian ba chiều. Đây là điều mà những người lính mắc kẹt trong lĩnh vực hai chiều sẽ chẳng bao giờ hiểu nổi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000395"
    locked: "Khóa đại từ 'mình' và nhắc nhở tự thân 'vẫn cần phải luôn đề cao cảnh giác'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000396"
    locked: "Khóa nhận định 'Dù sao thì đạn lạc vẫn là thứ hoàn toàn có thật.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000397"
    locked: "Khóa đại từ 'mình', các thuật ngữ 'kiểm soát độ cao', 'ưu thế trên không', 'lớp vỏ phòng thủ và màn chắn bảo hộ', cùng phủ định 'Hầu hết các đòn tấn công chẳng bao giờ vượt qua nổi…'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000398"
    locked: "Khóa chuỗi hành động chiến thuật 'Bắn, né tránh, rồi xuyên thủng phòng tuyến của chúng ở vận tốc tối đa.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000399"
    locked: "Khóa đại từ 'Mình', phủ định 'Chẳng cần phải bận tâm đến quân số của chúng khi giữa chúng có khoảng cách lớn nhường này' và nhận định 'Đội quân đa quốc gia không hề thích hợp với lối giao chiến hỗn loạn'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000400"
    locked: "Khóa chuyển ý 'Tuy nói vậy' và nhận định của Tanya 'mình thực sự tin rằng đầu óc bọn chúng bị điên thật rồi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000401"
    locked: "Khóa thoại lẩm bẩm của Tanya, đại từ 'mình', 'Chúng'/'đám này', thuật ngữ 'quân phục của Khối Thịnh vượng chung', phủ định 'chẳng phải binh lính của Khối Thịnh vượng chung' và tên sự kiện 'Trận Không chiến Phương Tây'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000402"
