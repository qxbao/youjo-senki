    category: "terminology_nuance"
    issue: "Thuật ngữ 'common sense' ở vế sau đang được dịch là 'lương tri', hơi nghiêng sang bình diện đạo đức/lương tâm thay vì năng lực phán đoán hợp lý, tỉnh táo thông thường mà Tanya đang phê phán từ p000380 và p000386."
    evidence: "Theo canon/style-guide.md, cần giữ đúng bình diện đánh giá theo ngữ cảnh và không pha thêm sắc thái đạo đức khi nguồn chỉ nói về nhận thức thông thường."
    recommendation: "Có thể cân nhắc chỉnh 'lương tri' thành 'lẽ thường' ở bước chuốt văn."
