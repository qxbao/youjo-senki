findings:
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000167"
    severity: "minor"
    issue: "Câu mở đầu đặt cụm cảm thán 'quái quỷ' ngay sau phần in nghiêng ('Vậy thì *những thứ kia* quái quỷ là gì thế?'), khiến trật tự từ tiếng Việt hơi ngượng."
    basis: "Đối chiếu cấu trúc câu hỏi cảm thán tại p000167, quy ước giữ nguyên phạm vi nhấn mạnh DEC-P01-002 và nguyên tắc viết tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'Vậy thì *những thứ kia* là cái quái gì thế?' để vừa bảo toàn phạm vi in nghiêng '*những thứ kia*' vừa giúp nhịp câu tự nhiên hơn."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000171"
    severity: "minor"
    issue: "Mệnh đề phủ định ở câu thứ hai dùng hư từ 'cho cam' ('Đây sẽ chẳng phải một trận giao chiến cho cam—mà chỉ là một cuộc thảm sát đơn thuần.'); trong tiếng Việt, 'cho cam' thường đi với cấu trúc nhượng bộ hoặc than thở ('nào phải... gì cho cam', 'đã đành một nhẽ... cho cam'), nên đặt vào câu nhận định trực tiếp này nghe hơi lệch quán ngữ."
    basis: "Đối chiếu ngữ cảnh nhận định của Tanya tại p000171 và nguyên tắc kết hợp từ tiếng Việt tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'Đây sẽ chẳng thể gọi là một trận giao chiến thực sự—mà chỉ là một cuộc thảm sát đơn thuần.' hoặc 'Đó sẽ chẳng phải một trận giao chiến ra hồn—mà chỉ là một cuộc thảm sát đơn thuần.'"
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000192"
    severity: "minor"
    issue: "Thán từ biểu thị tiếng gầm gừ/rên tức tối của Tanya ở câu cuối p000192 (và câu độc thoại p000175) được dịch là 'Ái chà'; trong tiếng Việt, 'Ái chà' thường gợi sắc thái ngạc nhiên thích thú hoặc tán thưởng nhẹ, chưa khớp với trạng thái nghiến răng uất ức và 'sự kích động dâng trào' của nhân vật."
    basis: "Đối chiếu mạch cảm xúc của Tanya tại p000175, p000183, p000192 và nguyên tắc giữ đúng sắc thái giọng thoại trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc thay 'Ái chà' ở p000175 và p000192 bằng thán từ bộc lộ sự bực bội/uất ức như 'Khốn thật', 'Chết tiệt' hoặc 'Hừ'."
