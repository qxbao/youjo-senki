findings:
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000002"
    related_segment_ids: []
    severity: "minor"
    category: "collocation"
    issue: "Trong mô tả chiến thuật bao vây ở p000002, cụm 'bao vây kẻ địch và cắt đứt chúng' hơi gượng vì động từ 'cắt đứt' kết hợp trực tiếp với đại từ chỉ người/đơn vị ('chúng') dễ gợi nghĩa vật lý hơn là nghĩa quân sự (chia cắt, cô lập đường tiếp viện/rút lui)."
    evidence: "Theo canon/style-guide.md, ưu tiên kết hợp từ tiếng Việt tự nhiên và rõ nghĩa trong ngữ cảnh tác chiến."
    recommendation: "Có thể cân nhắc chỉnh 'cắt đứt chúng' thành 'cô lập chúng' hoặc 'chia cắt chúng' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000010"
    related_segment_ids: []
    severity: "minor"
    category: "style"
    issue: "Câu ngắn ở p000010 ('Chính những trung tâm tiếp vận mới được thiết lập mới là mấu chốt.') lặp từ 'mới' ở hai vai trò ngữ pháp sát nhau, đồng thời thuật ngữ 'supply hubs' trong sổ pending của tập 10 từng được đề xuất là 'đầu mối tiếp vận'."
    evidence: "Theo canon/style-guide.md và work/run-state/pending-terms-index.yml (mục 'supply line / supply hub': 'tuyến tiếp vận / đầu mối tiếp vận')."
    recommendation: "Có thể cân nhắc chỉnh nhịp câu hoặc đồng bộ thuật ngữ ở bước chuốt văn (ví dụ: 'Chính những đầu mối tiếp vận vừa được thiết lập mới là mấu chốt.' hoặc 'Chính những trung tâm tiếp vận vừa được thiết lập mới là mấu chốt.')."
