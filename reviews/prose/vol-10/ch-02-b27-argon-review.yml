locked_choices:
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000042"
    locked: "Khóa câu đáp dứt khoát của Zettour với viên sĩ quan trẻ: '“Bây giờ chưa cần phải lo về chuyện đó đâu. Khi nào có lần sau thì hẵng lo cho lần sau.”'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000043"
    locked: "Khóa định danh 'Trung tướng Zettour', chủ thể 'viên sĩ quan trẻ', đại từ 'Ông' và phủ định 'không có thời gian cho những cuộc tranh cãi vụn vặt'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000044"
    locked: "Khóa cách gọi 'các quý ông', tên 'Liên bang' và mệnh lệnh 'Hãy cho Liên bang biết mùi vị của thất bại là như thế nào đi.'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000045"
    locked: "Khóa thuật ngữ 'lực lượng cơ động', định danh 'Trung tướng Zettour', mục tiêu 'bao vây và tiêu diệt hoàn toàn quân địch' và chủ thể 'Quân đội Liên bang'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000046"
    locked: "Khóa phương hướng 'phía đông tiền tuyến', tên 'Quân đội Liên bang' và phủ định nhấn mạnh 'nằm mơ cũng không bao giờ ngờ tới'."
  - segment_id: "YS-LN10/Text/chapter012.xhtml/p000047"
    locked: "Khóa chủ thể 'Quân đội Liên bang', cụm 'một cuộc tổng phản công của Đế quốc' và nhận định nhân quả 'chính kinh nghiệm của họ lại là thứ sẽ hại chết họ'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000001"
    locked: "Khóa câu mở đầu chuyển cảnh: '…Hiểu biết đôi khi lại là một thứ đáng sợ.'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000002"
    locked: "Khóa chủ thể 'Lục quân Đế quốc', thuật ngữ 'mũi lồi' và thao tác chiến thuật 'thắt chặt phần đáy của một mũi lồi'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000003"
    locked: "Khóa quan hệ nhân quả 'Đó là lý do vì sao họ đã hình dung được nơi Lục quân Đế quốc sẽ xuất hiện' và thông tin 'điều động binh lực cho một cuộc phản công'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000004"
    locked: "Khóa ẩn dụ 'cái bẫy tư duy' và nhận định 'quá tự tin vào nhận định sâu sắc của mình về cách thức di chuyển của kẻ địch'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000005"
    locked: "Khóa nhấn mạnh Markdown '*Chúng đang nhắm vào tuyến tiếp vận*' theo DEC-P01-002, ẩn dụ 'điểm mù' và chủ thể 'Zettour và quân của ông'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000006"
    locked: "Khóa sự phân biệt chủ thể giữa 'Quân Đế quốc' và 'Phía Liên bang' / 'Quân đội Liên bang', các thuật ngữ 'tuyến tiếp vận', 'mũi lồi', 'cánh cửa xoay', 'đòn tổng công kích chính diện' và cấu trúc tương quan 'càng tin chắc ... càng khó chấn chỉnh lại thế trận'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000007"
    locked: "Khóa định danh 'Trung tướng Zettour', nhấn mạnh Markdown '*rút lui*' theo DEC-P01-002, mục đích 'nhằm nhử kẻ địch lộ diện' và sự so sánh về mức độ am hiểu địa hình giữa 'Lục quân Đế quốc' với 'Quân đội Liên bang'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000008"
    locked: "Khóa chủ thể 'Quân đội Liên bang', 'Các tướng lĩnh của họ', thuật ngữ 'lực lượng dự bị', chuỗi điệp cấu trúc 'Họ biết mình cần phải...' và câu chốt phủ định 'không biết chính xác phải bố trí quân ở đâu'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000009"
    locked: "Khóa tình thái quá khứ 'khu vực mà lẽ ra mình phải nắm rõ từ trước' và hệ quả 'đến khi tìm ra câu trả lời thì mọi sự đã quá muộn rồi'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000010"
    locked: "Khóa mệnh đề nhấn mạnh vai trò then chốt của các cơ sở tiếp vận mới được thiết lập."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000011"
    locked: "Khóa các chủ thể 'Lục quân Đế quốc', 'Quân đội Liên bang', 'Trung tướng Zettour', 'Liên bang' và cấu trúc đối lập 'không tập trung vào vị chỉ huy đối địch, mà chú trọng vào những nét đặc thù trong cách Quân đội Liên bang thiết lập các tuyến tiếp vận'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000012"
    locked: "Khóa tính chất 'đã được chuẩn hóa', tên 'Zettour' và cụm 'vị trí các căn cứ tiếp vận của Liên bang'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000013"
    locked: "Khóa thuật ngữ 'kho tiếp vận', đại từ 'Ông' chỉ Zettour và mệnh lệnh cho 'lực lượng xe tăng của mình hoàn thành nhiệm vụ đầy cam go là càn lướt qua các căn cứ này'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000014"
    locked: "Khóa chi tiết 'vứt bỏ khoảng một nửa số kho bãi cùng lượng vật tư còn nguyên vẹn bên trong', chủ thể 'Lục quân Đế quốc' và kết quả 'thu giữ được pháo dã chiến và nguồn dự trữ đạn dược của chúng'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000015"
    locked: "Khóa chi tiết 'sau khi họ đã dùng cạn số đạn pháo ít ỏi giữ lại làm dự bị cho đòn nghi binh', nhấn mạnh Markdown '*Đây chính là số vật tư mà mình đang cần*' theo DEC-P01-002, định danh 'Trung tướng Zettour' và thuật ngữ 'pháo dã chiến'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000016"
    locked: "Khóa sự đối lập giữa chủ thể 'Binh chủng pháo binh Đế quốc' và phương tiện 'những khẩu pháo của Liên bang'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000017"
    locked: "Khóa địa danh 'mặt trận phía đông', chủ thể 'Số pháo thủ mà họ xoay xở gom góp được' và ý 'đã quen vận hành vũ khí của Liên bang, nên họ hoàn toàn sẵn sàng thắp sáng lãnh thổ địch bằng chính trang bị của chúng'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000018"
    locked: "Khóa chủ thể 'bộ chỉ huy Quân đội Liên bang', 'Lục quân Đế quốc' và nhận định phủ định trong dự đoán của phía Liên bang: 'không có đủ pháo thủ để có thể trích ra bất kỳ ai cho một nhiệm vụ thọc sâu phía sau chiến tuyến địch'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000019"
    locked: "Khóa quan hệ điều kiện – hệ quả 'nếu bất ngờ bị pháo kích từ một vị trí mà họ cho là bất khả thi, chắc chắn họ sẽ rơi vào cảnh hỗn loạn'."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000020"
    locked: "Khóa cấu trúc 'Đòn đánh ấy không chỉ giáng trúng điểm mù của họ, mà các báo cáo về pháo binh địch ở phía sau tuyến phòng ngự cùng sự hỗn loạn sắp sửa ập đến cũng sẽ làm nhiễu loạn thông tin tình báo của họ về nơi mà lực lượng Đế quốc đã kiếm được số đạn dược ấy.' theo đúng quy tắc đổi chủ ngữ hai vế trong canon/style-guide.md."
  - segment_id: "YS-LN10/Text/chapter014.xhtml/p000021"
    locked: "Khóa định danh 'Trung tướng Zettour' và câu kết chương: 'Và sau đó… chà, đánh vào nơi kẻ địch yếu ớt nhất vốn là sở trường của Trung tướng Zettour mà.'."
