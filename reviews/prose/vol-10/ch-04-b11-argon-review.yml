findings:
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000195"
    severity: "minor"
    issue: "Cụm mở đầu câu đầu tiên ('Thực tế vấn đề là') bám khá sát cấu trúc bề mặt của thành ngữ tiếng Anh nên nhịp câu tiếng Việt hơi cứng."
    basis: "Nguyên tắc viết tiếng Việt tự nhiên, tránh bám máy móc cấu trúc câu tiếng Anh trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc làm mượt thành 'Sự thật là' hoặc 'Thực tế là' trong khi vẫn giữ nguyên toàn bộ nghĩa và ẩn dụ tài chính phía sau; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000196"
    severity: "minor"
    issue: "Trong cùng một đoạn độc thoại nội tâm dùng chủ ngữ giả định chung, câu thứ hai dịch là 'Người ta' nhưng câu cuối lại chuyển sang 'đất nước của bạn', tạo cảm giác hơi dịch sát đại từ ngôi thứ hai khái quát."
    basis: "Nguyên tắc giữ giọng kể và điểm nhìn nội tâm tự nhiên, nhất quán trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'khi đất nước của bạn đang cố' thành 'khi chính quốc gia của mình đang cố' (tương tự p000193) hoặc 'khi một quốc gia đang cố'; không sai lệch nghĩa nên không bắt buộc sửa bản chuẩn."
