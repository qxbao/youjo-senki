    basis: "Đối chiếu từ nối nhượng bộ trong câu thoại ở p000043 với nguyên tắc giữ quan hệ logic trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'Dẫu vậy, đó có phải là lý do để không thử không, thưa Trung tá?' hoặc 'Đó có phải là lý do để vẫn không chịu thử không, thưa Trung tá?'; không làm sai lệch ý cốt lõi của câu hỏi tu từ nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter022.xhtml/p000049"
    severity: "minor"
    issue: "Ở câu thứ hai, cụm động từ chỉ hành động đưa các cố vấn học thuật ra xếp hàng trước đội xử bắn được dịch là 'dựng các cố vấn học thuật của mình đứng xếp hàng'; từ 'dựng' hơi khẩu ngữ so với giọng điệu nghị luận lạnh lùng của Tanya."
    basis: "Đối chiếu cụm động từ ở câu thứ hai của p000049 và yêu cầu giữ giọng thoại nhất quán trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi nhẹ 'dựng ... đứng xếp hàng' thành 'đưa ... ra xếp hàng' hoặc 'bắt ... xếp hàng' để câu thoại tự nhiên và chuẩn mực hơn."
