  - segment_id: "YS-LN10/Text/chapter008.xhtml/p000118"
    severity: "minor"
    issue: "Cụm kết câu 'kế hoạch của ông hoàn toàn khả thi' thêm phó từ chỉ mức độ tuyệt đối 'hoàn toàn', làm tăng độ chắc chắn hơn một chút so với ý gốc đang dọn đường cho sự giới hạn ở p000119 ('*Khả thi* chính là từ khóa') và p000120 (đối lập với 'Sự chắc chắn')."
    basis: "Đối chiếu mạch lập luận và mức độ tình thái liên đoạn từ p000118 sang p000119–p000120."
    recommendation: "Từ khóa liên kết '*Khả thi*' giữa p000118 và p000119 đã được giữ đúng; ở bước chuốt văn có thể lược từ 'hoàn toàn' (ví dụ: 'kế hoạch của ông là khả thi' hoặc 'kế hoạch của ông có tính khả thi') để khớp sát hơn với nhịp nhấn ở p000119."
