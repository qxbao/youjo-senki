  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000232"
    locks:
      - "Khóa tên riêng 'Tanya', đại từ 'cô', động cơ đặt nặng việc bảo toàn bản thân nên không bao giờ thừa nhận điều đó thành lời, và cấu trúc phủ định kép khẳng định cô vẫn sẽ gật đầu thật mạnh tán đồng nếu chủ đề đó được khơi ra."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000233"
    locks:
      - "Khóa tên riêng 'Visha', đại từ 'tôi', chức danh 'sĩ quan chỉ huy', 'tiểu đoàn', 'cấp dưới' và lập luận làm gương của Tanya: nếu chính cô không nghỉ phép thì cấp dưới sẽ không đời nào dám nghỉ."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000234"
    locks:
      - "Khóa hình ảnh tự ví von 'nhà quản lý biết quan tâm', 'một cô gái', đại từ 'cô' và quan hệ tương phản: dù việc giả bộ đó làm hao tổn sức lực nhưng cô vẫn cần diễn cho tròn vai."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000235"
    locks:
      - "Khóa đại từ 'cô', cụm 'người phụ tá' và nhận định tuyên bố của cô được đón nhận khá tốt qua phản ứng của người phụ tá."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000236"
    locks:
      - "Khóa lời đáp của Visha với cụm 'Tiểu đoàn chúng ta' và nhận định tiểu đoàn có xu hướng bỏ qua 'thời gian nghỉ phép'."
  - segment_id: "YS-LN10/Text/chapter028.xhtml/p000237"
    locks:
      - "Khóa câu hỏi nội tâm lựa chọn của Tanya về 'cấp dưới của cô' (bản tính quá nghiêm túc hay đã từ bỏ ý định nghỉ phép sau thời gian dài chinh chiến) và sự tương phản giữa việc luôn chuẩn chỉnh trong ca trực luân phiên với sự lơ là đến khó tin khi đụng tới chuyện nghỉ phép của 'tiểu đoàn pháp sư'."
