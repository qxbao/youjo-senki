locked_choices:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000404"
    locked: "Khóa thuật ngữ 'mặt trận phía đông' và nhận định mở đầu '…Có điều gì đó vặn vẹo ở mặt trận phía đông.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000405"
    locked: "Khóa cấu trúc khuyên răn phủ định 'Chớ bắt chước kẻ ác, kẻo chính mình cũng hóa ra kẻ ác' và hai vế đối lập dùng hình ảnh 'tuấn mã' cùng 'bậc hiền triết'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000406"
    locked: "Khóa đại từ nội tâm 'Mình' theo DEC-P01-001, chi tiết 'những câu ngạn ngữ cổ này trong giờ tiếng Nhật hồi còn ôn thi đại học' và hình ảnh 'những mảnh chân lý mà tổ tiên để lại'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000407"
    locked: "Khóa câu trích dẫn ngạn ngữ '“Dẫu chỉ là về hình thức, bắt chước bậc hiền triết vẫn là điều khôn ngoan.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000408"
    locked: "Khóa đại từ nội tâm 'Mình' và cụm 'câu ngạn ngữ cổ đó'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000409"
    locked: "Khóa đại từ 'mình', câu hỏi tu từ phủ định 'Chẳng phải chính vì thế mà chiến trường mới trở nên hỗn loạn đến vậy sao?' và mệnh đề điều kiện 'Nếu đúng là như vậy, thì chiến tranh chẳng qua chỉ là một vòng xoáy đi xuống đầy bất lực mà thôi'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000410"
    locked: "Khóa phủ định 'Không cách nào chặn nổi một khi nó đã lao dốc.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000411"
    locked: "Khóa định nghĩa 'Chiến tranh là entropy và sự hỗn loạn không thể kìm hãm.'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000412"
    locked: "Khóa thuật ngữ 'cuộc chiến tranh tổng lực', hai phạm vi nhấn mạnh Markdown '*Trật tự*' và '*hỗn loạn*' theo DEC-P01-002, đại từ 'kẻ địch của chúng ta'/'Đám lính này'/'mình' và hình ảnh so sánh 'dạo bước qua địa ngục mỗi ngày nhẹ tựa một buổi tản bộ trong công viên'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000413"
    locked: "Khóa lối tự quy chiếu ngôi thứ ba bằng tên riêng 'Tanya' và cụm 'một đối tượng để căm thù'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000414"
    locked: "Khóa đại từ ngôi thứ ba 'cô ấy' nối tiếp điểm nhìn khách quan hóa bản thân của Tanya từ p000413 và nhận định 'Tất cả những gì cô ấy đang làm chỉ là tận tụy hết mình vì công việc'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000415"
    locked: "Khóa chuyển lại đại từ nội tâm ngôi thứ nhất 'Mình' theo DEC-P01-001 và cụm 'quỹ đạo bay của bản thân'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000416"
    locked: "Khóa tên riêng 'Tanya', cấu trúc tăng tiến 'khiến cuộc đời vốn đã u ám của Tanya càng thêm u ám hơn mà thôi' và sắc thái giới hạn 'nhìn chung'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000417"
    locked: "Khóa song hành đại từ 'Mình' và tên 'Tanya', thuật ngữ 'hỏa lực quấy rối lấy lệ', phủ định 'Đó chẳng thực sự là những phát đạn mà quân địch có khả năng bắn trúng' và kết luận 'Chẳng có gì phải bận tâm cả'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000418"
    locked: "Khóa đại từ 'mình', 'chúng' và trạng ngữ mức độ 'về cơ bản'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000419"
    locked: "Khóa hô hiệu '02 gọi 01' và xưng hô 'tôi' – 'ngài' ('ạ') của Visha với Tanya qua vô tuyến."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000420"
    locked: "Khóa câu đáp vô tuyến ngắn gọn của Tanya: '“01 đây, xác nhận. Báo cáo đi, 02.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000421"
    locked: "Khóa đúng phạm vi nhấn mạnh Markdown '*Cô có hạ được mục tiêu không?*' theo DEC-P01-002, cụm 'Sĩ quan phụ tá của Tanya', đại từ 'cô ấy' và câu hỏi nội tâm 'Vậy tức là cô ấy đã thất bại sao?'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000422"
    locked: "Khóa đại từ 'Tôi', phủ định 'nhưng không bắn hạ được sĩ quan chỉ huy địch ạ' trong lời báo cáo của Visha."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000423"
    locked: "Khóa đại từ 'Mình', 'Cả hai chúng mình', 'cô ấy' và quan hệ nhân quả 'đều quay về tay trắng, nên rõ ràng chẳng có lý do gì để trách mắng cô ấy cả'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000424"
    locked: "Khóa lời đáp của Tanya: '“Bên này cũng vậy. Quả nhiên bọn chúng rất khó nhằn.”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000425"
    locked: "Khóa câu hỏi giả định quá khứ của Visha: '“Đó có phải là kẻ mà lẽ ra chúng ta nên khử ngay khi còn cơ hội không ạ?”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000426"
    locked: "Khóa cụm 'người cộng sự của Tanya', đại từ 'Mình' và cấu trúc phủ định kép 'không thiếu phần châm biếm'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000427"
    locked: "Khóa tự xưng trong thoại 'một pháp sư biết điều như tôi', cụm 'đánh bom tự sát' và thuật ngữ 'đòn tập kích chặt đầu chỉ huy'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000428"
    locked: "Khóa hình ảnh so sánh 'giống hệt vi khuẩn kháng kháng sinh' và cấu trúc tương quan 'Chúng ta càng giết nhiều, chúng lại càng tạo dựng được sức đề kháng trước chiến thuật của chúng ta'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000429"
    locked: "Khóa đại từ 'mình', 'kẻ địch của chúng ta', phủ định 'không thể phủ nhận rằng kẻ địch của chúng ta đang ngày một tiến bộ hơn', thuật ngữ 'mặt trận phía đông' và kết luận 'chuyện ấy cũng sẽ bất khả thi ở mặt trận phía đông. Đó là sự thật phũ phàng'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000430"
    locked: "Khóa tình thái ước đoán trong thoại '“Nhưng chừng này hẳn là đủ để đáp ứng yêu cầu của tướng quân rồi…”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000431"
    locked: "Khóa đại từ 'chúng ta', tên 'Tanya' và cụm 'một màn đánh lạc hướng lớn thành công, đúng như mệnh lệnh mà Tanya nhận được…'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000432"
    locked: "Khóa đại từ nội tâm 'mình' và chi tiết nhận ra điều kỳ lạ đang diễn ra xung quanh."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000433"
    locked: "Khóa thán từ nghi vấn ngắn '“Hửm?”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000434"
    locked: "Khóa đại từ 'Mình', thuật ngữ 'lớp vỏ phòng thủ', cụm 'một dòng ma lực đầy khó chịu' và so sánh 'như thể có kẻ vừa dí súng vào đầu mình vậy'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000435"
    locked: "Khóa hai câu hỏi cảm thán liên tiếp: '“Đây là bức xạ sao?! Ở tận khoảng cách này ư?!”'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000436"
    locked: "Khóa đại từ 'Mình', 'Chúng mình', hai tên riêng 'Tanya' và 'Visha', cùng thuật ngữ 'các pha cơ động né tránh'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000437"
    locked: "Khóa đại từ 'Cả hai'/'Chúng mình', các thuật ngữ 'lõi kép', 'quỹ đạo', 'bay theo đường lắt léo hình chữ chi' và 'các quả cầu tính toán Type 97'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000438"
    locked: "Khóa sắc thái giới hạn 'chỉ vừa vặn làm được mà thôi' và thành ngữ 'tránh được luồng bắn trong đường tơ kẽ tóc'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000439"
    locked: "Khóa đại từ 'Mình' và hai thuật ngữ ma pháp 'thuật thức quang học tầm xa quy mô lớn' cùng 'thuật thức quan sát quang học'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000440"
    locked: "Khóa cụm 'một bóng dáng đơn độc, nhỏ bé đến lạ', thuật ngữ 'tín hiệu ma lực' và đại từ 'mình'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000441"
    locked: "Khóa ẩn dụ 'con lợn rừng ban nãy', 'cái thứ quái thai phản tự nhiên ấy', đại từ 'ả' và chi tiết 'đang tích tụ ma lực cho đòn bắn tầm xa thứ hai của ả'."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000442"
    locked: "Khóa định danh 'Trung úy Serebryakov', đại từ 'mình', các thuật ngữ 'quả cầu tính toán', 'đám quân tình nguyện đa quốc gia' và so sánh phủ định 'còn lâu mới sánh được với của chúng ta về mặt thông số kỹ thuật'."
