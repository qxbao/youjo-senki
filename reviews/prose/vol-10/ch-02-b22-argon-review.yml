findings:
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000406"
    related_segment_ids: []
    severity: "minor"
    category: "modality"
    issue: "Trạng từ tình thái biểu thị sự phỏng đoán dè dặt ở đầu câu thứ hai đang bị lược bỏ khi dịch thẳng thành 'Lẽ ra mình nên chú tâm hơn... mới phải', làm mức độ khẳng định của lời tự trách mạnh hơn so với nguyên gốc."
    evidence: "Theo canon/style-guide.md, cần giữ đồng thời tính giả định và mức độ chắc chắn của bản gốc."
    recommendation: "Có thể bổ sung sắc thái tình thái ở bước chuốt văn, chẳng hạn: 'Có lẽ mình đã nên chú tâm hơn đến những mảnh chân lý mà tổ tiên để lại mới phải.'"
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000432"
    related_segment_ids:
      - "YS-LN10/Text/chapter010.xhtml/p000423"
      - "YS-LN10/Text/chapter010.xhtml/p000431"
      - "YS-LN10/Text/chapter010.xhtml/p000436"
    severity: "minor"
    category: "pronouns_register"
    issue: "Đại từ ngôi thứ nhất số nhiều trong độc thoại nội tâm của Tanya (chỉ Tanya và sĩ quan phụ tá Visha) đang được dịch là 'hai đứa' ('quanh hai đứa'), mang sắc thái khẩu ngữ ngang hàng/thân mật quá mức so với quan hệ chỉ huy – thuộc cấp và lệch với cách dùng 'chúng mình'/'chúng ta' ở các đoạn kế cận (p000423, p000431, p000436–p000438)."
    evidence: "Theo canon/decisions.md (DEC-P01-001) và canon/style-guide.md, cần giữ giọng kể nhất quán và tránh dùng từ xưng hô hàm ý quan hệ thân mật ngoài ngữ cảnh."
    recommendation: "Có thể chỉnh 'quanh hai đứa' thành 'quanh chúng mình' hoặc 'quanh hai chúng mình' ở bước chuốt văn."
  - segment_id: "YS-LN10/Text/chapter010.xhtml/p000434"
    related_segment_ids: []
    severity: "minor"
    category: "meaning_modality"
    issue: "Mệnh đề chỉ vị trí dự kiến của quân địch ở câu thứ ba đang được dịch là 'ở nơi quân địch đang đóng', vừa làm mất sắc thái tình thái dự đoán/ước lượng vị trí, vừa thêm nét nghĩa 'đóng quân' cố định trên mặt đất trong khi đối phương là đơn vị pháp sư đang giao chiến trên không."
    evidence: "Theo canon/style-guide.md, cần giữ đúng sắc thái tình thái và không tự thêm chi tiết trạng thái không có trong nguồn."
    recommendation: "Có thể chỉnh thành 'ở nơi lẽ ra là vị trí của quân địch…' hoặc 'ở chỗ quân địch đáng lẽ đang hiện diện…' ở bước chuốt văn."
