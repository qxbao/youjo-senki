      - "vị trung tá nhỏ nhắn (the tiny lieutenant colonel)"
      - "miền đông (the east)"
      - "miền tây (the west)"
    pov_and_pronouns: "Điểm nhìn Trung tướng Romel ('Ông' / 'ông') về Degurechaff ('Cô' / 'cô')."
    modality_and_negation: "Giữ mức độ 'suýt chút nữa đã thấy tội nghiệp', phủ định tuyệt đối 'chẳng bao giờ có lấy một phút nghỉ ngơi' và sự tương phản hài hước đen tối giữa lời chúc nghỉ ngơi ở miền đông với ý định 'vắt kiệt sức làm việc của cô' ở miền tây."
    emphasis: "Không dùng *...*."
