    pov_and_pronouns: "Trần thuật ngôi thứ ba quy chiếu 'Trung tướng Rudersdorf'."
    modality_and_negation: "Giữ tính chủ đích 'cố tình hắng giọng một tiếng đầy hàm ý' và quan hệ thời gian 'trước khi quay lại vấn đề chính'."
    emphasis: "Không dùng *...*."
  - segment_id: YS-LN10/Text/chapter006.xhtml/p000085
    terms:
