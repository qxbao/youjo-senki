    modality_and_negation: "Giữ quan hệ điều kiện chấp thuận 'nếu đã vậy thì tôi hiểu rồi'."
    emphasis: "Không dùng *...*."
  - segment_id: YS-LN10/Text/chapter006.xhtml/p000083
    terms: []
    pov_and_pronouns: "Thoại trực tiếp của Trung tướng Rudersdorf."
    modality_and_negation: "Giữ lời đáp ngắn gọn."
    emphasis: "Không dùng *...*."
