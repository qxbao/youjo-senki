findings:
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000690"
    severity: "minor"
    category: "word_choice"
    issue: "Trong lời cảm thán của Tanya, cách dịch 'vừa bay ngang càn quét vừa bắn trả' hơi chồng lấp nét nghĩa tác xạ giữa 'càn quét' và 'bắn trả', trong khi động từ nguyên văn ở đây nhấn mạnh động tác cơ động trượt/lách ngang khi đang giao chiến trên không."
    recommendation: "Ở bước chuốt văn có thể cân nhắc chỉnh thành 'chúng vừa bay lách ngang vừa bắn trả sao?!' hoặc 'chúng vừa cơ động tạt ngang vừa bắn trả sao?!' để tách bạch chuyển động và hỏa lực."
  - segment_id: "YS-LN10/Text/chapter024.xhtml/p000717"
    severity: "minor"
    category: "style_register"
    issue: "Từ láy 'xó xỉnh' lặp lại ở hai câu liên tiếp ('ở cái xó xỉnh nào thế hả?' và 'trong quán rượu xó xỉnh nào đó')."
    recommendation: "Ở bước chuốt văn có thể đổi câu sau thành 'Bộ đang chui rúc trong quán rượu vớ vẩn nào đó mà nốc đến say bí tỉ rồi sao?' để tránh lặp từ mà vẫn giữ đúng giọng độc thoại nội tâm bực dọc của Drake."
