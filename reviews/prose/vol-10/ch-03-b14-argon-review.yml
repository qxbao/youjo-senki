  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000361"
    severity: "minor"
    issue: "Danh từ chỉ loại đồ uống cụ thể trong nguyên bản ('brandy') đang được dịch khái quát hóa thành 'rượu mạnh'."
    evidence: "Đoạn p000361 nêu cụ thể loại rượu Habergram giấu dưới gầm bàn làm việc là 'brandy'."
    recommendation: "Có thể giữ rõ tên loại rượu là 'rượu brandy' khi chuốt văn để bảo toàn chi tiết cụ thể của nguyên tác."
  - segment_id: "YS-LN10/Text/chapter018.xhtml/p000371"
    severity: "minor"
    issue: "Cách diễn đạt 'vị trí đóng quân của từng chiếc tàu ngầm địch' hơi thiên về lực lượng trên bộ khi đi với đối tượng là tàu ngầm đang hoạt động trên biển."
    evidence: "Đoạn p000371 nói về việc dùng tin tình báo Ultra để nắm vị trí tàu ngầm địch ('enemy submarines') nhằm tổ chức đoàn tàu vận tải hộ tống qua eo biển."
    recommendation: "Có thể cân nhắc chỉnh nhẹ thành 'vị trí bố trí của từng chiếc tàu ngầm địch' hoặc 'vị trí chốt chặn của từng chiếc tàu ngầm địch' ở bước chuốt văn."
