locked_choices:
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000043"
    locked: "Giữ thuật ngữ 'cửa tiệm thức ăn nhanh' khớp với lô b01 và tình thái giả định ('sẽ lập tức bắt đầu tìm kiếm một công việc mới')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000044"
    locked: "Giữ cấu trúc phủ định bác bỏ ('Có phải nhân viên sống vì tập đoàn đâu cơ chứ') và giới hạn mục đích ('Họ chỉ làm việc ở đó để trang trải chi phí sinh hoạt mà thôi')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000045"
    locked: "Giữ hai câu hỏi tu từ nối tiếp về việc 'thề nguyện trung thành với một chuỗi nhà hàng'; đại từ 'họ'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000046"
    locked: "Giữ mức độ khái quát ('Hầu như bất kỳ con người nào có não đều có thể đồng tình với điều trên')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000047"
    locked: "Giữ quan hệ đối lập 'Tuy nhiên', cụm 'Ảo ảnh về sự đoàn kết' và chuỗi so sánh bậc nhất ('những công dân thông minh nhất, văn minh nhất và có học thức nhất')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000048"
    locked: "Giữ các cặp đối lập 'Yêu và hận, thiện và ác' và thuật ngữ 'quan niệm hiện đại về nhà nước dân tộc' (modern conception of the nation-state)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000049"
    locked: "Chủ thể 'Tanya', 'Đế quốc'; khóa tên riêng 'Leviathan', hình ảnh 'con quái thú chimera ba đầu' và tình thái giả định quá khứ ('hẳn đã là một kẻ thù đáng yêu hơn nhiều')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000050"
    locked: "Khóa tên ba nhánh quyền lực: 'Hoàng gia và nghị viện', 'giới quan chức hành chính', 'Lục quân Đế quốc'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000051"
    locked: "Khóa cụm 'Quân đội, giới quan chức hành chính và các chính khách' và thuật ngữ 'khối scrum'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000052"
    locked: "Khóa 'Khối scrum', 'lời phán của Chúa' (word of God); giữ cấu trúc tự hiệu chỉnh ('Bất chấp điều đó—không, chính vì điều đó') và cụm 'một sai lầm sơ đẳng duy nhất'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000053"
    locked: "Trần thuật gọi 'Tanya', đại từ 'cô'; khóa tính từ 'khôn ngoan và hợp lý' (wise and rational) và hệ quả 'trở thành tất yếu'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000054"
    locked: "Giữ câu hỏi mở đầu 'Sai lầm của họ ư?', cụm dẫn gọi người đọc 'Bạn thấy đấy' và tiền đề so sánh ngang bằng ('cũng sẽ khôn ngoan và tài giỏi chẳng kém gì mình')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000055"
    locked: "Giữ cấu trúc bị động với trạng từ 'được hệ thống Đế quốc định nghĩa vô điều kiện là' và phần trích dẫn trong ngoặc kép '“một điều hiển nhiên đối với nguồn nhân lực xuất sắc”'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000056"
    locked: "Giữ điều kiện 'Nếu cứ để tự vận hành' và tình thái suy luận ('lẽ ra phải phát triển thành quốc gia hùng mạnh nhất thế giới')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000057"
    locked: "Giữ cặp trạng ngữ đối lập ('Thật may mắn mà cũng thật bất hạnh cho các tầng lớp lãnh đạo đời sau của Đế quốc'), cụm trong ngoặc kép '“trỗi dậy nắm giữ quyền lực một cách thần tốc”' và quan hệ đối lập ở câu sau."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000058"
    locked: "Khóa chủ thể 'Con quái thú chimera ấy', cụm chêm 'dù tốt hay xấu' (for better or worse) và thuật ngữ 'siêu cường' (superpower)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000059"
    locked: "Giữ quan hệ nhân quả 'Kết quả là', từ trong ngoặc kép '“bộ não”' và hình ảnh mỗi cái đầu cố kéo phần cơ thể chung về phía mình."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000060"
    locked: "Giữ thành ngữ tương đương 'lắm thầy nhiều ma' (too many cooks in the kitchen)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000061"
    locked: "Giữ nhận định trực tiếp 'Thứ mà đất nước cần ngay lúc này là sự đoàn kết.'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000062"
    locked: "Chủ thể 'Đế quốc', 'Tanya', 'Lục quân Đế quốc'; giữ phủ định ('không thể phung phí dù chỉ một chút thời gian hay nguồn lực nào', 'cũng chẳng phải là người duy nhất') và cụm 'nhận thức lạnh lùng'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000063"
    locked: "Trần thuật nêu chủ thể 'Tanya' và hành động nội tâm 'thầm than thở cho sự bất hạnh của tình cảnh này'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000064"
    locked: "Thoại độc thoại của Tanya: giữ 'Quân đội là cái đầu duy nhất có sự đoàn kết…' và mệnh đề rào đón 'Mà nói cho công bằng thì sự đoàn kết này cũng chỉ giới hạn trong lĩnh vực chiến tranh mà thôi.'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000065"
    locked: "Giữ thuật ngữ 'quân đội', 'Đế quốc', cấu trúc đối lập 'thay vì' và đúng phạm vi nhấn mạnh Markdown '*thành viên*' theo DEC-P01-002."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000066"
    locked: "Giữ câu hỏi tu từ với cụm 'con quái thú chimera của chúng ta' (our chimera) và 'quyền kiểm soát tuyệt đối'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000067"
    locked: "Giữ chuỗi ba động từ tiếp nối ('chia rẽ, tan rã rồi tự ý lang thang theo hướng của riêng mình')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000068"
    locked: "Giữ hai cặp tương phản giữa lời hô hào với ý định hợp tác, và giữa 'Người dân có thể đoàn kết' với 'con quái thú này thì chắc chắn là không'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000069"
    locked: "Giữ đối lập giữa 'thời bình' và 'giữa lúc nghịch cảnh', cùng phủ định toàn phần ('chẳng tồn tại ở bất cứ đâu')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000070"
    locked: "Giữ cụm 'tình thế tiến thoái lưỡng nan' (dilemma) và 'những người lính có lòng yêu nước nồng nhiệt' (soldiers who are ardent patriots)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000071"
    locked: "Giữ cấu trúc khẳng định hiển nhiên ('Kẻ xâm lược ngoại bang cần phải được đón đánh bằng sự đoàn kết—chừng đó là điều hiển nhiên')."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000072"
    locked: "Giữ câu hỏi trọng tâm 'Câu hỏi đặt ra là, điều gì cấu thành nên sự đoàn kết?'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000073"
    locked: "Giữ câu nhận định ngắn 'Có quá nhiều cái đầu trên con quái thú chimera này.'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000074"
    locked: "Giữ đối lập giữa lúc 'vạch ra chiến lược' ('càng nhiều cái đầu càng tốt') với khi 'mục tiêu duy nhất đã được ấn định' ('chỉ có thể có một cái đầu duy nhất chỉ huy con quái thú'); khóa thuật ngữ 'Hệ thống chỉ huy' (chain of command)."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000075"
    locked: "Giữ cấu trúc nhấn mạnh 'không thể nào rõ ràng hơn dưới góc nhìn thuần túy quân sự' và đối lập 'như một chỉnh thể gắn kết chứ không phải bị chia cắt'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000076"
    locked: "Khóa thuật ngữ 'hệ thống chỉ huy thứ hai' và cấu trúc tăng tiến phủ định '—chứ đừng nói đến cái thứ ba'."
  - segment_id: "YS-LN10/Text/chapter002.xhtml/p000077"
    locked: "Khóa tên riêng 'Đế quốc', 'Liên bang', 'Khối Thịnh vượng chung'; giữ sắc thái mỉa mai 'bản hiệp ước kêu rền hoành tráng' (grandiose treaty) và 'chân lý hiển nhiên' (self-evident truth)."
