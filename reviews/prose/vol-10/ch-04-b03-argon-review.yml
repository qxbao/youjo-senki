findings:
  - segment_id: "YS-LN10/Text/chapter020.xhtml/p000053"
    severity: "minor"
    issue: "Cụm mở đầu câu thứ hai 'Trước nỗi bất lực tột cùng của họ' bám hơi sát cấu trúc giới từ chỉ thái độ trong nguyên bản, khiến mạch nối với mệnh đề chính hơi nặng."
    basis: "Đối chiếu ngữ cảnh tâm lý các sĩ quan tại p000053 và nguyên tắc diễn đạt tiếng Việt tự nhiên, tránh bám máy móc cấu trúc câu tiếng Anh trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh nhẹ thành 'Điều khiến họ vô cùng bất lực là...' hoặc 'Trong nỗi bức bối tột cùng của họ, ngay cả việc mảy may nghĩ tới khả năng thất bại thôi...'; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN10/Text/chapter020.xhtml/p000070"
    severity: "minor"
    issue: "Trong cùng một câu nhận định khái quát về nguyên tắc ứng xử với khách hàng, chủ ngữ giả định chung chuyển từ 'người ta' ở mệnh đề trước sang 'bạn' ('trước khi bạn đưa ra ý kiến thành thật của mình') ở mệnh đề sau, khiến giọng văn hơi giống sách hướng dẫn trực tiếp người đọc."
    basis: "Đối chiếu điểm nhìn trần thuật bám theo góc nhìn Tanya tại p000070 và hướng dẫn giữ giọng kể tự nhiên trong style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc lược đại từ 'bạn' ('trước khi đưa ra ý kiến thành thật của mình') để câu văn mượt và hợp giọng độc thoại/trần thuật hơn; không làm sai nghĩa nên không bắt buộc sửa bản chuẩn."
