findings:
  - severity: minor
    segment_id: YS-LN08/Text/chapter012.xhtml/p000209
    issue: "Trong các đoạn độc thoại nội tâm không tách chủ thể trực tiếp với tên Tanya (p000209, p000210, p000212, p000219, p000230, p000238), đại từ ngôi thứ nhất đang dùng 'tôi' thay vì 'mình' như ở câu độc thoại p000214 và các lô liền trước."
    rationale: "Tại p000208 câu văn đặt song song chủ thể cái tôi tiền kiếp làm nhân sự ('tôi') với 'Tanya' nên mạch đoạn sau tiếp nối bằng 'tôi' vẫn giữ rõ điểm nhìn và không gây nhầm chủ thể; chỉ ghi nhận ở mức minor."
    recommendation: "Có thể giữ nguyên để liền mạch với cấu trúc phân tách chủ thể từ p000208, hoặc cân nhắc chuyển sang 'mình' ở các câu tự vấn nội tâm (như p000238) trong bước chuốt văn theo DEC-P01-001."
  - severity: minor
    segment_id: YS-LN08/Text/chapter012.xhtml/p000239
    issue: "Thán từ biểu thị sự bực tức 'Argh' trong lời thoại của Tanya đang dịch là 'Ác thật', hơi lệch nhẹ sang nghĩa nhận xét tính chất thay vì tiếng gầm gừ/rên tức giận thuần túy."
    rationale: "Không ảnh hưởng đến nghĩa cốt lõi của câu thoại phía sau nên chỉ ghi nhận ở mức minor."
    recommendation: "Cân nhắc đổi 'Ác thật' thành 'Gừ' hoặc 'Chết tiệt' ở bước chuốt văn để sát sắc thái cảm thán."
