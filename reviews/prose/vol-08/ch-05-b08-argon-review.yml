findings:
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000264
    severity: moderate
    category: pronouns_and_addressee
    issue: "Trong chuỗi thoại p000261–p000263, Trung úy Grantz là người giật mình lắp bắp trước cụm từ của Zettour, được Zettour hỏi thăm đích danh ở p000262 và xin thứ lỗi ở p000263. Lời giải thích ở p000264 là câu Zettour nói tiếp với Grantz về điều cậu đang lo sợ (trước khi Chỉ huy Cramm lên tiếng hỏi ở p000265 và Zettour gọi lại danh xưng Chỉ huy Cramm ở p000268). Bản dịch hiện dùng đại từ 'anh' (cách Zettour gọi Cramm) thay vì 'cậu' (cách Zettour gọi Grantz ở p000242), làm lệch đối tượng tiếp nhận lời thoại."
    recommendation: "Đổi 'điều mà anh đang lo sợ' thành 'điều mà cậu đang lo sợ'."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000249
    severity: minor
    category: terminology
    issue: "Thuật ngữ 'Federation Army' đang dịch là 'Lục quân Liên bang', chưa đồng nhất với phương án tạm đã khóa xuyên suốt tập 8 trong pending-terms-index.yml là 'Quân đội Liên bang'."
    recommendation: "Đổi 'Các đơn vị Lục quân Liên bang' thành 'Các đơn vị Quân đội Liên bang'."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000253
    severity: minor
    category: terminology
    issue: "Các thuật ngữ 'General Staff Office', 'front lines' và 'Supreme Command' đang dịch là 'Bộ Tổng tham mưu', 'Chiến tuyến' và 'Bộ Tổng Tư lệnh', chưa đồng nhất với phương án tạm trong pending-terms-index.yml ('General Staff Office': 'Văn phòng Bộ Tổng tham mưu' để phân biệt với 'General Staff' ở p000276; 'front lines': 'tiền tuyến'; 'Supreme Command': 'Bộ Tư lệnh Tối cao')."
    recommendation: "Đổi 'ở Bộ Tổng tham mưu' thành 'ở Văn phòng Bộ Tổng tham mưu', 'Chiến tuyến' thành 'Tiền tuyến', và 'Bộ Tổng Tư lệnh' thành 'Bộ Tư lệnh Tối cao'."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000268
    severity: minor
    category: register_and_hierarchy
    issue: "Trung tướng Zettour (cấp trên, xưng 'ta' – gọi 'anh' với Cramm) đang trực tiếp giao nhiệm vụ cho Chỉ huy Cramm; việc thêm tiểu từ kính ngữ 'ạ' ở cuối câu ('Chỉ huy Cramm ạ') không phù hợp tương quan quân hàm cấp trên – cấp dưới. Thái độ tôn trọng nêu ở p000267 được thể hiện qua việc nói thẳng, nghiêm túc thay vì dùng kính ngữ của cấp dưới."
    recommendation: "Bỏ tiểu từ 'ạ', sửa thành: '“Chúng ta cần mồi nhử, Chỉ huy Cramm.”'."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000279
    severity: minor
    category: terminology
    issue: "Danh từ chung 'war college' không viết hoa trong nguồn và có phương án tạm trong pending-terms-index.yml là 'trường đại học quân sự', nhưng bản dịch đang viết hoa như tên riêng ('Đại học Quân sự')."
    recommendation: "Đổi 'ở Đại học Quân sự' thành 'ở trường đại học quân sự'."
