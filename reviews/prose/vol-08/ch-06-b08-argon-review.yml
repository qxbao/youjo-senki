findings:
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000269"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Cụm 'phải vắt kiệt sức mới thốt ra được' làm quá mức độ của động từ nguyên bản khi mô tả việc vị đại tá cố ép giọng nói thoát ra khỏi cổ họng đang nghẹn lại vì sợ hãi."
    basis: "Theo canon/style-guide.md, cần giữ đúng sắc thái và mức độ của bản gốc; nguyên bản chỉ diễn tả sự khó nhọc khi rặn/nặn ra từng lời vì căng thẳng chứ không phải vắt kiệt thể lực."
    recommendation: "Đổi 'phải vắt kiệt sức mới thốt ra được' thành 'phải khó nhọc lắm mới thốt ra được' hoặc 'phải cố nặn ra từng tiếng'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000287"
    severity: "minor"
    category: "addition"
    issue: "Bản dịch tự thêm cụm giải thích 'để giữ thành' ('cam kết dốc toàn bộ mọi thứ hiện có để giữ thành') không có trong nguyên bản."
    basis: "Theo canon/style-guide.md, không tự thêm giải thích thu hẹp phạm vi nghĩa khi nguồn chỉ nói chung về cam kết huy động mọi nguồn lực hiện có."
    recommendation: "Lược bỏ cụm 'để giữ thành', giữ là 'cam kết dốc toàn bộ mọi thứ hiện có giờ đã là chuyện của quá khứ xa xôi rồi'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000306"
    severity: "minor"
    category: "style_naturalness"
    issue: "Cụm 'nhóm nhà báo giới hạn kia' bám sát máy móc cấu trúc tiếng Anh và lược mất ý mệnh đề quan hệ phụ thuộc chỉ số lượng nhà báo hạn chế mà phía Liên bang đã tiếp nhận."
    basis: "Theo canon/style-guide.md, viết tiếng Việt tự nhiên, rõ ràng và giữ đủ chi tiết của bản gốc."
    recommendation: "Đổi 'ngay cả nhóm nhà báo giới hạn kia đặt chân vào' thành 'ngay cả nhóm nhỏ nhà báo được phép vào một cách hạn chế như vừa qua đặt chân tới'."
