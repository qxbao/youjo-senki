findings:
  - severity: minor
    segment_id: YS-LN08/Text/chapter012.xhtml/p000281
    issue: "Cụm 'veteran aces' trong lời cảnh báo của Tanya đang được dịch cụ thể hóa thành 'phi công át chủ bài kỳ cựu', trong khi mạch ngữ cảnh từ các đoạn trước đang bàn về lực lượng pháp sư trên không của Liên bang (hoặc các tay súng/pháp sư át chủ bài nói chung) chứ không giới hạn ở phi công lái máy bay."
    rationale: "Ý cốt lõi về việc đối phương trộn lẫn những cá nhân thiện chiến dày dạn kinh nghiệm từ thời tiền cách mạng vẫn rõ ràng nên chỉ ghi nhận ở mức minor."
    recommendation: "Ở bước chuốt văn, cân nhắc lược chữ 'phi công' thành 'những át chủ bài kỳ cựu' để giữ đúng độ mở của từ gốc trong ngữ cảnh tác chiến pháp sư trên không."
  - severity: minor
    segment_id: YS-LN08/Text/chapter012.xhtml/p000285
    issue: "Trong lời thoại của Tanya (Trung tá, chỉ huy trưởng) nói với Serebryakov (Trung úy, sĩ quan phụ tá thuộc quyền), cách gọi 'Trung úy ạ' có tiểu từ kính ngữ 'ạ' hơi lệch chuẩn tôn ti quân đội dù câu thoại mang sắc thái lịch sự."
    rationale: "Ngôi xưng 'tôi - cô' và cấp bậc 'Trung úy' trong câu vẫn phân định rõ người nói và người nghe nên không gây nhầm chủ thể; chỉ ghi nhận ở mức minor."
    recommendation: "Ở bước chuốt văn, cân nhắc bỏ tiểu từ 'ạ' (chỉ giữ ', Trung úy;' hoặc ', thưa Trung úy;' theo lối khách sáo xã giao không dùng 'ạ') để chuẩn vị thế cấp trên nói với cấp dưới."
