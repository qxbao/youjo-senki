  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000093"
    choices:
      - "Xưng hô & sắc thái lễ độ: Grantz mở đầu bằng 'Với tất cả lòng kính trọng, thưa Tướng quân' và khẳng định tính chất chính thức của hoạt động quân sự."
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000094"
    choices:
      - "Giọng thoại: giữ lời nhận xét điềm tĩnh của Zettour 'Đó là một câu trả lời rất đúng mực của một quân nhân.'"
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000095"
    choices:
      - "Nhấn mạnh, đại từ & điều kiện: bảo toàn chữ nghiêng toàn câu theo DEC-P01-002; trong nội tâm Zettour quy chiếu Grantz bằng 'cậu ta' và giữ mệnh đề điều kiện rào đón '*Đó là nếu như cậu ta thực sự tin vào điều ấy.*'"
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000096"
    choices:
      - "Phân biệt đại từ, phủ định & nhân vật: quy chiếu Zettour bằng 'ông', Grantz bằng 'anh'; giữ phủ định 'Zettour không cho rằng bản thân Grantz nắm rõ mọi uẩn khúc' và định danh 'Degurechaff'."
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000097"
    choices:
      - "Đại từ, câu hỏi, điều kiện & phủ định: Zettour xưng 'tôi', gọi Grantz là 'Anh', dùng 'quân ta' / 'chúng ta'; giữ câu hỏi phủ định + điều kiện ở đầu đoạn và cấu trúc điều kiện phủ định ở câu cuối ('Không có một đòn tấn công mạnh mẽ, tôi e rằng chúng ta chẳng thể phá vỡ được vòng vây đâu')."
