findings:
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000299
    severity: minor
    category: metaphor_cohesion
    issue: "Chuỗi đoạn p000297–p000299 xây dựng ẩn dụ liền mạch từ hình ảnh 'cả một núi việc' ở p000297 sang hành động phá nhỏ ở p000298 và biến ngọn núi đó thành đống đá vụn ở p000299. Cách dịch 'bóc tách được nó ra' (p000298) và 'đập vụn nó thành đống gạch đá' (p000299) hơi lệch chất liệu hình ảnh của ngọn núi (đất đá thay vì gạch đá)."
    recommendation: "Có thể cân nhắc chỉnh p000298 thành 'Nhưng ông đã xoay xở phá nhỏ được nó ra.' và p000299 thành 'Việc đập vụn nó thành đống đá vụn không còn chỉ là một giấc mơ nữa.' để giữ trọn mạch ẩn dụ."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000306
    severity: minor
    category: style_fidelity
    issue: "Bản dịch thêm cụm giải thích 'sự ngang bướng' ('chịu đựng sự ngang bướng của ông') ở p000306 và các từ bổ nghĩa 'xương máu', 'thay thế' ở p000318 dù văn bản gốc chỉ diễn đạt trực tiếp ('chịu đựng ông', 'những bài học', 'nòng súng'). Tuy không làm lệch nghĩa cốt lõi nhưng theo style-guide.md nên hạn chế tự thêm từ giải thích."
    recommendation: "Có thể rút gọn thành 'chịu đựng ông' (p000306), 'những bài học trên mặt trận Rhine' và 'thiếu hụt đạn dược và nòng súng kinh niên' (p000318)."
