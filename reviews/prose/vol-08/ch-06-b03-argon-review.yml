      - "Nhấn mạnh & đại từ nội tâm: bảo toàn chính xác chữ nghiêng '*Đó là bằng hữu của mình.*' theo DEC-P01-002; Drake tự quy chiếu trong nội tâm bằng 'mình'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000106"
    choices:
      - "Nhấn mạnh & đại từ nội tâm: bảo toàn chính xác chữ nghiêng '*Và đây là mình.*' theo DEC-P01-002."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000107"
    choices:
      - "Nhấn mạnh, điển tích & câu hỏi tu từ: bảo toàn chính xác phạm vi chữ nghiêng ở câu đầu '*Vậy nên giống như Horatius, mình phải bảo vệ những gì mình cần bảo vệ.*' theo DEC-P01-002; giữ nguyên hai câu sau không in nghiêng và câu hỏi tu từ kết đoạn 'Còn có gì phải khiếp sợ nữa chứ?'."
