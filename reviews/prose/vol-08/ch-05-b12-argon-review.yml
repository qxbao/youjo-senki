findings:
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000416
    severity: moderate
    category: pronouns_and_address
    issue: "Trong lời thoại trực tiếp của sĩ quan cấp dưới (Đại úy Meybert) hỏi Trung tá Tanya, bản dịch viết 'Ý Trung tá là cô định rút...' khiến cấp dưới gọi thẳng cấp trên bằng đại từ ngôi thứ hai 'cô' ngay sau danh xưng 'Trung tá', lệch chuẩn tôn ti quân đội."
    recommendation: "Sửa lại đại từ/cách hô gọi ngôi thứ hai cho đúng tôn ti cấp dưới nói với cấp trên: '“Tr-Trung tá! Ý Trung tá là định rút Tiểu đoàn Pháp sư Trên không số 203 khỏi trận địa khi chúng ta vẫn đang bị bao vây sao?!”' (hoặc lặp lại 'Trung tá định rút')."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000411
    severity: minor
    category: register_and_vocative
    issue: "Ở p000411 và p000434, Tanya là chỉ huy trưởng đang lên lớp và hạ lệnh trực tiếp cho thuộc cấp nhưng bản dịch lại thêm từ kính ngữ 'thưa' ('thưa các vị'), làm giọng điệu hơi khách sáo quá mức so với khẩu khí mệnh lệnh suồng sã trong đoạn (như câu lệnh ở p000434)."
    recommendation: "Có thể lược chữ 'thưa', chỉ giữ hô ngữ 'các vị' ở p000411 ('“*Ở đây*, các vị.”') và p000434 ('“Rõ cả chưa, các vị?”') để thể hiện đúng vị thế chỉ huy của Tanya."
