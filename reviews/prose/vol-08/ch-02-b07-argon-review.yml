  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000230"
    choices:
      - "Xưng hô & giọng thoại: Zettour tự xưng 'Tôi', gọi Rudersdorf là 'ông'; giữ giọng bông đùa 'Tôi đang tính làm cho ông sạt nghiệp đấy.'."
