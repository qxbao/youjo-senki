      - "Thuật ngữ & đại từ: 'shock troops' -> 'lực lượng xung kích'; 'Elinium Arms Type 97 Assault Computation Orb' -> 'Quả cầu Tính toán Xung kích Type 97 của Elinium Arms'; dùng 'chúng tôi' trong lời suy tính chiến thuật."
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000592"
    choices:
      - "Thuật ngữ & quan hệ thời gian: 'ranged attacks' -> 'các đòn tấn công tầm xa'; 'her adjutant' -> 'viên sĩ quan phụ tá'."
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000593"
    choices:
      - "Thuật ngữ quân sự: 'firing range' -> 'tầm bắn'; 'enemy mage company' -> 'đại đội pháp sư địch'."
  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000594"
    choices:
      - "Đại từ nội tâm & thuật ngữ: tự xưng 'Mình' theo DEC-P01-001; 'suppressing your mana signal' -> 'trạng thái ém tín hiệu ma năng'; 'max combat velocity' -> 'vận tốc chiến đấu tối đa'; quy chiếu đại đội pháp sư địch bằng 'chúng'."
