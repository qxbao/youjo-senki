locked_choices:
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000528"
    choices:
      - "Thoại Tanya với Zettour: xưng 'Tôi', có kính ngữ 'ạ', dùng 'Chúng ta' khi nói về Đế quốc đang có chiến tranh; phần trần thuật gọi Tanya là 'cô'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000529"
    choices:
      - "Trần thuật gắn với góc nhìn của Tanya: khóa 'người theo chủ nghĩa hòa bình' (pacifist) và 'Vốn con người' (Human capital)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000530"
    choices:
      - "Thoại Tanya: giữ nguyên hình ảnh ẩn dụ 'ném từng khúc củi sinh mạng con người vào ngọn lửa chiến tranh' và sắc thái bức xúc."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000531"
    choices:
      - "Độc thoại nội tâm của Tanya: khóa 'các nhà kinh tế học ở Ngân hàng Thế giới', 'lực lượng lao động có học thức', phép so sánh với 'dịch Ebola và căn bệnh AIDS', cùng cấu trúc điều kiện – hệ quả."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000532"
    choices:
      - "Độc thoại nội tâm: giữ ẩn dụ y khoa 'đơn thuốc điều trị' (prescription for a cure) và tình thái bắt buộc 'buộc phải chấp nhận nó'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000533"
    choices:
      - "Thoại Tanya: khóa ẩn dụ tài chính – y khoa 'chảy máu biết bao sinh mạng con người quý giá' và 'quyết định cắt lỗ'; giữ kính ngữ 'ạ' cuối câu."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000534"
    choices:
      - "Độc thoại nội tâm: khóa thuật ngữ đầu tư 'khoản đầu tư' (investment) và 'cổ tức đáng tin cậy' (reliable dividends)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000535"
    choices:
      - "Độc thoại nội tâm: khóa 'chi phí khởi đầu' (start-up costs), 'thương vụ' (enterprise) và 'liên tục chảy máu dẫn tới thua lỗ' (constantly bleeding out into the red)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000536"
    choices:
      - "Trần thuật ngôi thứ ba: gọi tên 'Tanya' và 'Zettour'; giữ chuỗi 3 phủ định liên tiếp 'Không phản bác, không thuyết phục, không phủ nhận'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000537"
    choices:
      - "Nội tâm trực tiếp của Tanya: tự xưng 'Mình' theo DEC-P01-001, gọi Zettour là 'ông ấy'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000538"
    choices:
      - "Độc thoại nội tâm: khóa 'sĩ quan Bộ Tổng tham mưu giàu tư duy logic', gọi Zettour là 'ông' và giữ dấu chấm lửng bỏ lửng câu như bản gốc."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000539"
    choices:
      - "Độc thoại nội tâm khái quát hóa: lược chủ ngữ đại từ chung để câu tiếng Việt tự nhiên, giữ mệnh đề điều kiện phủ định."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000540"
    choices:
      - "Độc thoại nội tâm: giữ đối sánh 'giới hạn của ngôn từ, hay có lẽ là của chính lý trí'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000541"
    choices:
      - "Thoại Tanya: khóa 'thua lỗ' (in the red), 'hậu phương' (the rear), 'thực tại chẳng mấy sinh lời' (unproductive reality) và câu hỏi có kính ngữ 'sao ạ?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000542"
    choices:
      - "Trần thuật ngôi thứ ba: gọi 'Zettour' và đại từ 'ông', giữ mạch miêu tả hành động cắt và châm xì gà điềm tĩnh."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000543"
    choices:
      - "Thoại Zettour: khóa 'những kẻ lãng mạn tìm kiếm danh dự và uy danh', 'khao khát báo thù', 'Dư luận' (Public opinion) và hình ảnh 'con quái vật tạp nham chẳng khác nào loài chimera'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000544"
    choices:
      - "Thoại Tanya: khóa 'những loạt súng máy lia ngang' (sweeping machine gun fire) và điển cố 'Sắt và máu' (Iron and blood)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000545"
    choices:
      - "Độc thoại nội tâm: giữ mệnh đề khẳng định ngắn gọn 'Các quy luật vật lý sẽ đập tan những lời nói nhảm nhí'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000546"
    choices:
      - "Độc thoại nội tâm: dùng đại từ chung 'bạn' cho ngôi thứ hai khái quát, giữ nguyên định danh 'Being X' và phủ định ở câu cuối."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000547"
    choices:
      - "Thoại Zettour với Tanya: gọi Tanya là 'cô', dùng 'chúng ta' và 'mình' cho nhóm thiểu số của hai người."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000548"
    choices:
      - "Thoại Tanya với Zettour: khóa 'thuyết địa tâm', 'thuyết nhật tâm', hô ngữ 'thưa ngài', tự xưng 'Tôi' và dùng 'chúng ta' ở câu kết."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000549"
    choices:
      - "Thoại Zettour: gọi 'Trung tá von Degurechaff', xưng 'Tôi – cô' và 'chúng ta'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000550"
    choices:
      - "Trần thuật ngôi thứ ba: gọi 'Tanya', dùng đại từ phản thân 'mình' và đại từ 'cô'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000551"
    choices:
      - "Thoại Tanya: khóa 'công việc nội chính' (domestic affairs), 'nắm được quyền chủ động' (seize the initiative), gọi Zettour là 'ngài' kèm kính ngữ 'ạ'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000552"
    choices:
      - "Thoại Zettour: tự xưng 'tôi', khóa 'quan chức quân sự tận tụy' (faithful military bureaucrat), 'tổ chức quân đội', 'chính trường' và 'tay mơ thiếu kinh nghiệm'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000553"
    choices:
      - "Thoại Tanya hỏi lại: gọi Zettour là 'ngài', giữ kính ngữ 'sao ạ?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000554"
    choices:
      - "Thoại Zettour: gọi Tanya là 'Trung tá' (Colonel), xưng 'tôi – cô', khóa từ khóa then chốt 'đồng phạm' (accomplices)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000555"
    choices:
      - "Trần thuật ngôi thứ ba ngắn gọn: 'Tanya khẽ giật mình.'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000556"
    choices:
      - "Nội tâm trực tiếp của Tanya: tự xưng 'Mình' theo DEC-P01-001, giữ phủ định 'chẳng thích từ đó chút nào'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000557"
    choices:
      - "Thoại Tanya hỏi lại: giữ dấu nháy đơn quanh từ 'đồng phạm' như bản gốc và hô ngữ 'thưa ngài'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000558"
    choices:
      - "Thoại Zettour xác nhận ngắn gọn: '“…Phải.”'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000559"
    choices:
      - "Thoại Tanya: xưng 'Tôi', có kính ngữ 'đấy ạ', giữ sự tương ứng với cảm xúc hoang mang."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000560"
    choices:
      - "Trần thuật pha giọng tự trào của Tanya: khóa cụm định danh 'công dân hiện đại chuẩn mực, giàu lương tri và tràn đầy tinh thần thượng tôn pháp luật là Tanya von Degurechaff'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000561"
    choices:
      - "Nội tâm trực tiếp của Tanya: tự xưng 'mình' theo DEC-P01-001, giữ câu phủ định ngắn gọn."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000562"
    choices:
      - "Độc thoại nội tâm: dùng đại từ chung 'bạn', khóa điển cố 'thanh kiếm của Damocles', 'uy tín của thị trường' và 'cố tình phạm pháp là điều không thể chấp nhận được'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000563"
    choices:
      - "Độc thoại nội tâm: giữ dấu ngoặc kép quanh cụm '“phạm pháp”' và sắc thái cấm kỵ trong xã hội hiện đại."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000564"
    choices:
      - "Thoại Zettour: xưng 'Tôi – Cô', gộp 'chúng ta', khóa 'chỉ huy tiền tuyến' (frontline commanders) và 'sĩ quan tham mưu' (staff officer), giữ phủ định kép 'khó mà nghĩ rằng cô lại không hiểu'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000565"
    choices:
      - "Thoại Tanya: hô ngữ 'Thưa Tướng quân', xưng 'tôi', kính ngữ 'ạ', giữ cấu trúc nhấn mạnh nhân quả 'chính vì hiểu rõ nên tôi mới do dự'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000566"
    choices:
      - "Độc thoại nội tâm: khóa 'Bộ Tổng tham mưu Lục quân Đế quốc', ẩn dụ công sở 'ông sếp vô cùng khắt khe', 'Chỉ tiêu' (quotas) và đại từ chung 'bạn'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000567"
    choices:
      - "Độc thoại nội tâm: giữ liên tưởng tới người đi làm trong 'một công việc bình thường'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000568"
    choices:
      - "Độc thoại nội tâm: dùng đại từ chung 'Bạn' kèm phản thân 'mình', khóa cụm điều kiện 'miễn đó là một mệnh lệnh hợp pháp' (lawful order)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000569"
    choices:
      - "Độc thoại nội tâm: khóa 'tiền đề' (premise) và 'cấp trên' (the higher-ups)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000570"
    choices:
      - "Độc thoại nội tâm kết đoạn: khóa 'thành viên nào của xã hội', 'tay quản lý ngu ngốc', 'giới lãnh đạo đã vứt bỏ lý trí ngay giữa lúc chiến tranh' và câu hỏi tu từ với 'các biện pháp đối phó bất hợp pháp' (illegal countermeasures)."
