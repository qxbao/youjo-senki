      - "Độc thoại thành tiếng & phủ định: Zettour xưng 'tôi', gọi họ là 'họ'; giữ câu nhận xét phủ định tự nhiên."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000439"
    choices:
      - "Xưng hô: dịch '“General?”' là '“Thưa Tướng quân?”'."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000440"
    choices:
      - "Thuật ngữ, đại từ & phạm vi hạn định: 'General Staff Office' -> 'Văn phòng Bộ Tổng tham mưu'; 'General Staff' -> 'Bộ Tổng tham mưu'; 'the forward-most line in the east' -> 'tuyến tiền tiêu xa nhất ở miền đông'; quy chiếu Zettour bằng 'Ông' / 'ông' / 'mình'."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000441"
    choices:
      - "Thuật ngữ, ngôi khái quát & điều kiện: 'magic officer' -> 'sĩ quan ma pháp'; dịch 'you' khái quát bằng 'người ta'; giữ câu điều kiện cuối đoạn."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000442"
    choices:
      - "Ẩn dụ, nhượng bộ & thuật ngữ: 'precious pearl of a mage company' -> 'viên ngọc quý là đại đội pháp sư'; 'General Staff Office' -> 'Văn phòng Bộ Tổng tham mưu'; 'eastern army' -> 'đạo quân phía đông'; giữ quan hệ nhượng bộ 'bất chấp việc bị gạt khỏi... mà không có thực quyền'."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000443"
    choices:
      - "Quân hàm, xưng hô & thành ngữ: 'Lieutenant Grantz' -> 'Trung úy Grantz'; Zettour xưng 'tôi' – 'cậu'; dịch 'bend over backward for me' là 'dốc hết sức vì tôi một phen'."
