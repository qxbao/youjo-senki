locked_choices:
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000143"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi / mình (Andrew)"
    locked_elements:
      - "Thuật ngữ: phiên dịch viên, buổi họp báo, Liên bang."
      - "Diễn biến tâm lý ban đầu: ngạc nhiên khi biết phiên dịch viên là phụ nữ và thừa nhận có ấn tượng tốt rằng Liên bang khá cởi mở ở ít nhất một khía cạnh."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000144"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi (Andrew); cô ta (Tanechka)"
    locked_elements:
      - "Thuật ngữ: sĩ quan chính trị, những người Cộng sản, quan hệ công chúng."
      - "Ẩn dụ thiện cảm bị 'hỏa lực pháo hạng nặng thổi bay sạch' ngay khi nghe chức danh sĩ quan chính trị."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000145"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi (Andrew); ông ta (Mikel); viên sĩ quan chính trị này (Tanechka)"
    locked_elements:
      - "Thuật ngữ và quân hàm: đại tá Quân đội Liên bang tên là Mikel, ngôn ngữ của Khối Thịnh vượng chung, sĩ quan chính trị."
      - "Giữ dấu ngoặc kép mỉa mai quanh từ “phiên dịch viên” ở câu đầu và sự đối lập với việc thừa nhận nhu cầu có phiên dịch viên là tự nhiên."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000146"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Thuật ngữ: sĩ quan chính trị."
      - "Nhận định việc cử sĩ quan chính trị làm công việc đó mang lại một thông điệp lộ liễu đến phát sợ."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000147"
    speaker: "First Lieutenant Tanechka"
    pronouns_and_address: "tôi (Tanechka); đồng chí đại tá (quy chiếu Colonel Mikel)"
    locked_elements:
      - "Nhân vật và quân hàm: Trung úy Tanechka, đồng chí đại tá."
      - "Lời mở đầu buổi họp báo và tự giới thiệu vai trò phiên dịch."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000148"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "Hai người họ (Mikel và Tanechka)"
    locked_elements:
      - "Mô tả hành động hai người lần lượt lên tiếng."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000149"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "Bạn (đại từ khái quát 'You')"
    locked_elements:
      - "Tình thái suy đoán chắc chắn ('ắt hẳn đang diễn ra theo một chương trình được dàn dựng sẵn') và hình ảnh ví von 'diễn viên hạng ba đang diễn một kịch bản hạng tư'."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000150"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew); Trung úy Tanechka / cô ta"
    locked_elements:
      - "Quân hàm: Trung úy Tanechka."
      - "Hai câu hỏi nghi vấn đối lập (đang phiên dịch hay là người duy nhất thực sự phát biểu) và kết luận nghiêng về vế sau."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000151"
    speaker: "First Lieutenant Tanechka"
    pronouns_and_address: "Đồng chí đại tá (Mikel)"
    locked_elements:
      - "Thuật ngữ: đồng chí đại tá, cuộc tác chiến liên hợp, các đơn vị của Liên bang và Khối Thịnh vượng chung."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000152"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi (Andrew); cô ta (Tanechka)"
    locked_elements:
      - "Thuật ngữ: Ngôn ngữ của Khối Thịnh vượng chung, giọng Russy, sĩ quan chính trị."
      - "Thế lưỡng nan mỉa mai giữa việc khen phát âm khá chuẩn hay yêu cầu một phiên dịch viên đúng nghĩa."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000153"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew); cô ta (Tanechka)"
    locked_elements:
      - "Quan sát việc Tanechka lựa lời rất cẩn thận."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000154"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew); họ (Liên bang)"
    locked_elements:
      - "Thuật ngữ: tuyên truyền, buổi họp báo, nhà báo nước ngoài, đơn vị đa quốc gia, cuộc phản công, Liên bang, sĩ quan chính trị."
      - "Sự đối lập giữa việc lường trước yếu tố tuyên truyền và nỗi khó hiểu khi Liên bang không nhận ra việc để sĩ quan chính trị phiên dịch sẽ gây tác dụng ngược."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000155"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew)"
    locked_elements:
      - "Hành động chuyển trạng thái sang tập trung vào công việc làm báo."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000156"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew)"
    locked_elements:
      - "Thuật ngữ: phóng viên *WTN*, Ban biên tập thời sự, sĩ quan chính trị của Quân đội Liên bang."
      - "Nhấn mạnh Markdown: chỉ bọc '*WTN*' theo DEC-P01-002."
      - "Phủ định và so sánh: không có phóng viên *WTN* nào khác ở đây nên không được phép xao nhãng, vì ban biên tập ở quê nhà đáng sợ hơn bất kỳ sĩ quan chính trị nào."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000157"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew)"
    locked_elements:
      - "Chi tiết ghi chép tốc ký các ý chính của phần phổ biến thông tin hơi khó theo dõi."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000158"
    speaker: "First Lieutenant Tanechka"
    locked_elements:
      - "Thuật ngữ: Quân đội Liên bang, Quân đội Khối Thịnh vượng chung, các đồng minh và đồng chí, cuộc phản công lớn."
      - "Giọng điệu tuyên truyền chính trị ('lực lượng phải đẩy lùi quân xâm lược vì nhân dân')."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000159"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "họ (phía Liên bang)"
    locked_elements:
      - "Thuật ngữ: quan hệ truyền thông."
      - "Nhận xét hai vế: có biết đôi chút về quan hệ truyền thông nhưng vẫn còn quá nhiều chi tiết rườm rà khiến thông điệp chưa thực sự dễ hiểu."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000160"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Nhấn mạnh Markdown: chỉ bọc '*Chúng tôi sẽ cùng nhau phản công*' theo DEC-P01-002."
      - "Câu hỏi tu từ châm biếm sự sáo rỗng của lời tuyên truyền."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000161"
    speaker: "First Lieutenant Tanechka"
    pronouns_and_address: "chúng ta"
    locked_elements:
      - "Thuật ngữ: Lục quân Đế quốc."
      - "Sự phân biệt giữa mục tiêu tối hậu (giành lại mảnh đất của nhân dân) và mục tiêu chính (đánh đuổi quân xâm lược là Lục quân Đế quốc)."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000162"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi (Andrew); Họ (phía Liên bang và lực lượng liên hợp)"
    locked_elements:
      - "Thuật ngữ: Lục quân Đế quốc, đầu cầu (bridgehead), các chiến dịch trong tương lai."
      - "Chuỗi ba mục tiêu quân sự thực chất sau khi bóc tách lời lẽ cường điệu: kìm chân Lục quân Đế quốc, thiết lập đầu cầu và đảm bảo tuyến đường làm tiền đề."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000163"
    speaker: "First Lieutenant Tanechka"
    locked_elements:
      - "Lời kết thúc phần trình bày và mở phần đặt câu hỏi."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000164"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew); các đồng nghiệp giàu tham vọng của tôi"
    locked_elements:
      - "Thuật ngữ: phần hỏi đáp (Q and A), Liên bang, sĩ quan chính trị."
      - "Sự tương phản giữa nỗi phân vân của Andrew (sợ đặt câu hỏi xoáy là thất lễ) và thái độ chẳng mấy bận tâm của các đồng nghiệp."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000165"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Chi tiết một phóng viên gan dạ giơ thẳng tay lên."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000166"
    speaker: "East-West News correspondent"
    pronouns_and_address: "Tôi (phóng viên tờ East-West News)"
    locked_elements:
      - "Thuật ngữ: tờ *East-West News*, Lục quân Đế quốc, Quân đội Liên bang."
      - "Nhấn mạnh Markdown: chỉ bọc '*East-West News*' theo DEC-P01-002."
      - "Nội dung câu hỏi về việc Lục quân Đế quốc đang tập kết ở phía nam."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000167"
    speaker: "First Lieutenant Tanechka"
    pronouns_and_address: "ngài (phóng viên hỏi) - chúng tôi (Quân đội Liên bang)"
    locked_elements:
      - "Thuật ngữ: Lục quân Đế quốc, đào công sự cố thủ, trận đánh phòng ngự, quân Đế quốc, phòng tuyến của Đế quốc."
      - "Lập luận hai hướng: đào công sự cố thủ ghìm chân địch ở phía nam đồng thời phản công tại đây để đẩy lùi phòng tuyến Đế quốc."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000168"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "họ (Liên bang)"
    locked_elements:
      - "Thuật ngữ: đoàn phóng viên, Liên bang."
      - "Sự thất vọng của đoàn phóng viên trước câu trả lời nghe có vẻ chuẩn mực nhưng thực chất lảng tránh câu hỏi cốt lõi là có bảo vệ nổi các thành phố đó hay không."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000169"
    pov: "Andrew (ngôi thứ nhất 'chúng tôi')"
    pronouns_and_address: "chúng tôi (đoàn phóng viên); Viên sĩ quan chính trị trên bục (Tanechka)"
    locked_elements:
      - "Thuật ngữ: Liên bang, sĩ quan chính trị."
      - "Câu hỏi cảm thán và sự hụt hẫng khi sĩ quan chính trị khơi gợi kỳ vọng rồi từ chối trả lời thẳng."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000170"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Thuật ngữ: tờ *East-West News*."
      - "Nhấn mạnh Markdown: chỉ bọc '*East-West News*' theo DEC-P01-002."
      - "Chi tiết gạt bỏ sự dè dặt thông thường khi chất vấn phụ nữ để tung ra câu hỏi thứ hai."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000171"
    speaker: "East-West News correspondent"
    locked_elements:
      - "Thuật ngữ: các đơn vị Đế quốc, phòng tuyến phía nam."
      - "Hai câu hỏi truy vấn trực diện về xác suất phòng ngự thành công và tin đồn phòng tuyến phía nam đang lâm nguy."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000172"
    speaker: "First Lieutenant Tanechka"
    pronouns_and_address: "tôi (Tanechka); quân ta; đồng chí đại tá (Mikel)"
    locked_elements:
      - "Thuật ngữ: bảo mật tác chiến (operational security), đồng chí đại tá."
      - "Lời từ chối tiết lộ chi tiết di biến động vì lý do bảo mật tác chiến và viện dẫn phát biểu trước đó của đại tá."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000173"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "Cô ta / Trung úy Tanechka; vị đại tá / ông ta (Mikel)"
    locked_elements:
      - "Nhân vật và quân hàm: vị đại tá, Trung úy Tanechka, phần hỏi đáp."
      - "Chi tiết Tanechka chỉ bồi thêm phần dẫn lời đại tá như sực nhớ ra vào phút chót mà không buồn giả vờ hỏi ý ông ta, còn vị đại tá thì trưng ra vẻ mặt ngơ ngác như không hiểu diễn biến phần hỏi đáp."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000174"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Thuật ngữ: Chúa, đoàn phóng viên."
      - "Sự đối lập giữa việc chỉ Chúa mới biết chắc và việc toàn bộ đoàn phóng viên đã coi chuyện vị đại tá không hiểu gì gần như là sự thật hiển nhiên."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000175"
    speaker: "East-West News correspondent"
    pronouns_and_address: "Tôi (phóng viên) - ngài đại tá / ngài (quy chiếu và hướng tới Colonel Mikel)"
    locked_elements:
      - "Quân hàm: ngài đại tá."
      - "Lời đề nghị lịch sự nhưng sắc bén đòi nghe câu trả lời trực tiếp (dù chỉ là khái quát) từ chính vị đại tá."
