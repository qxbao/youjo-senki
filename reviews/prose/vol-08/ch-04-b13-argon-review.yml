      - "Nhấn mạnh Markdown, thuật ngữ & phủ định kép: in nghiêng '*Nghe này, Chỉ huy Cramm*'; dịch 'straitlaced field officers' là 'những sĩ quan chiến trường nghiêm túc' (hoặc 'những sĩ quan thực địa nghiêm túc', không dịch là 'sĩ quan cấp tá'); giữ phủ định kép 'chẳng thể khẳng định rằng mình sẽ không giở mánh khóe nào'."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000483"
    choices:
      - "Đại từ & thuật ngữ: quy chiếu Zettour bằng 'ông'; 'officer in the field' -> 'sĩ quan ngoài chiến trường'."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000484"
    choices:
      - "Xưng hô, thuật ngữ & đính chính: Zettour xưng 'tôi' – 'Anh'; giữ nhịp tự đính chính 'nhưng tôi—không, một sĩ quan Bộ Tổng tham mưu—mới phải là người nắm bắt cơ hội này để bao vây một trong các cánh quân của địch' và câu hỏi tu từ cuối đoạn."
