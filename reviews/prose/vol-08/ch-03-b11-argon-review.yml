findings:
  - segment_id: "YS-LN08/Text/chapter012.xhtml/p000079"
    severity: "minor"
    issue: "Cụm tình thái phủ định ở câu đầu đang dịch là 'không đời nào có thể' (sắc thái phủ định khả năng tuyệt đối), trong khi thực tế các pháp sư Liên bang đang tác chiến ở trình độ đó ngay trước mắt Tanya và nguồn dùng cấu trúc mang nghĩa trái với kỳ vọng/chuẩn mực ('đáng lẽ không thể' / 'lẽ ra không thể')."
    evidence: "Ở p000077–p000078 Tanya vừa chứng kiến pháp sư Liên bang đánh ngang ngửa với Tiểu đoàn 203 nên tại p000079 cô nhận định theo chuẩn thông thường thì họ đáng lẽ không thể đạt tới trình độ này."
    recommendation: "Đề xuất đổi 'không đời nào có thể' thành 'đáng lẽ không thể' hoặc 'lẽ ra không thể' để khớp chính xác sắc thái tình thái của nguồn."
  - segment_id: "YS-LN08/Text/chapter012.xhtml/p000098"
    severity: "minor"
    issue: "Đại từ ngôi thứ nhất số nhiều trong mạch độc thoại nội tâm của Tanya dùng 'chúng tôi' ở p000098 nhưng dùng 'chúng ta' ở p000111."
    evidence: "Cả p000098 và p000111 đều là suy nghĩ nội tâm của Tanya về đơn vị/quân Đế quốc (tương tự p000078 và p000080 dùng 'mình' cho ngôi thứ nhất số ít)."
    recommendation: "Cân nhắc đổi 'chúng tôi' ở p000098 thành 'chúng ta' để đồng bộ với quy ước độc thoại nội tâm ('mình / chúng ta') và thống nhất với p000111."
