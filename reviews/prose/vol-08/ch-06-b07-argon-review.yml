findings:
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000227"
    severity: "minor"
    category: "tone_nuance"
    issue: "Cách dịch 'giở trò này' thêm sắc thái miệt thị/mánh khóe không có trong động từ nguyên bản khi nói về việc Grantz lại nài nỉ xin truy kích vì thương bộ binh."
    basis: "Theo canon/style-guide.md, không thêm sắc thái phán xét hoặc miệt thị không có trong nguồn; tại đây người nói chỉ chất vấn việc Grantz lại hành xử như vậy một lần nữa."
    recommendation: "Đổi 'lại định giở trò này nữa đấy à?!' thành 'lại thế này nữa đấy à?!' hoặc 'lại làm chuyện này nữa đấy à?!'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000228"
    severity: "minor"
    category: "pronouns_address"
    issue: "Thêm đại từ xưng hô 'ngài' ('Xin ngài đấy!') khi Grantz cầu xin cấp trên trực tiếp (Trung tá Tanya von Degurechaff), trong khi nguồn chỉ dùng thán từ cầu khẩn ngắn và chuẩn xưng hô với Tanya trong tập là 'Trung tá'."
    basis: "Theo DEC-P01-001 và hệ thống xưng hô trong vol-08, cấp dưới gọi Tanya bằng quân hàm 'Trung tá' thay vì 'ngài', hoặc giữ lời cầu khẩn trực tiếp không tự gán danh xưng 'ngài'."
    recommendation: "Đổi 'Xin ngài đấy!' thành 'Xin Trung tá đấy!' hoặc 'Làm ơn đi mà!'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000251"
    severity: "minor"
    category: "pov_pronouns"
    issue: "Đại từ ngôi thứ nhất số nhiều trong độc thoại nội tâm của Tanya đang dịch là 'chúng tôi', lệch giọng với 'mình' (p000250, p000258) và 'chúng ta' (p000259) trong cùng chuỗi suy nghĩ."
    basis: "Quy ước điểm nhìn nội tâm của Tanya dùng 'mình' (số ít) và 'chúng ta' (số nhiều) khi tự suy ngẫm, tránh dùng 'chúng tôi' vốn mang sắc thái hướng tới người nghe bên ngoài."
    recommendation: "Đổi 'chúng tôi từng thấy' thành 'chúng ta từng thấy' hoặc 'mình cùng đơn vị từng thấy'."
