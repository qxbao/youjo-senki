    severity: "minor"
    issue: "Đại từ ngôi thứ nhất số nhiều trong mạch điểm nhìn ngôi thứ nhất/độc thoại nội tâm của Tanya đang chuyển đổi giữa 'chúng tôi' (p000045, p000046, p000051) và 'chúng ta' (p000049, p000068) ở các đoạn liền kề."
    evidence: "Ở p000049 dùng 'chúng ta', sang p000051 ngay sau đó lại dùng 'chúng tôi' cho cùng chủ thể đơn vị của Tanya trong suy nghĩ/tự thuật."
    recommendation: "Có thể cân nhắc thống nhất dùng 'chúng ta' ở p000051 (và p000045, p000046 nếu muốn đồng bộ hoàn toàn giọng độc thoại nội tâm dùng 'mình / chúng ta'), hoặc giữ nếu chủ ý tách câu trần thuật ngôi thứ nhất với câu cảm thán nội tâm trực tiếp."
  - segment_id: "YS-LN08/Text/chapter012.xhtml/p000059"
    severity: "minor"
    issue: "Từ 'miserable' trong cụm tính từ chê bai nhà khoa học điên (Schugel) mang sắc thái rủa xả/tệ hại ('khốn kiếp', 'tệ hại') hơn là đáng thương/cơ cực ('khốn khổ')."
    evidence: "Cụm danh từ chỉ vị kỹ sư trưởng đi kèm thái độ bực dọc của Tanya đối với người thiết kế Type 97."
    recommendation: "Đề xuất đổi 'khốn khổ' thành 'khốn kiếp' hoặc 'tệ hại' để khớp sắc thái phàn nàn của Tanya."
