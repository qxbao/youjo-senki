    pronouns_and_address: "tôi - Ngài (Andrew hỏi Drake)"
    locked_elements:
      - "Lời rào đón lịch sự và câu hỏi xác nhận sự thật vì điều đó nghe hoàn toàn bất khả thi ở vùng chiến sự."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000100"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew); Ông ấy (Drake)"
    locked_elements:
      - "Thuật ngữ: quân đội Liên bang, bữa trà chiều xa hoa."
      - "Câu hỏi nội tâm kinh ngạc trước việc phục vụ trà chiều xa hoa cho nhà báo giữa lúc chiến tranh."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000101"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "tôi (Drake nói với Andrew)"
    locked_elements:
      - "Tình thái phỏng đoán chắc chắn của Drake: khó tin nhưng hoàn toàn có khả năng."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000102"
    speaker: "Andrew"
    pronouns_and_address: "Tiểu từ lễ phép 'ạ' cuối câu"
    locked_elements:
      - "Thuật ngữ: tuyến tiền tiêu (forward-most line)."
      - "Thán từ cảm thán nhấn mạnh sự phi lý nơi tiền tuyến."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000103"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "cậu (Drake nói với Andrew); họ (phía Liên bang)"
    locked_elements:
      - "Chi tiết dưa chuột muối chua thay vì đồ tươi nhưng vẫn đáp ứng yêu cầu tới hai trăm phần trăm."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000104"
    speaker: "Andrew"
    pronouns_and_address: "Tiểu từ lễ phép 'ạ' cuối câu hỏi"
    locked_elements:
      - "Phản ứng nghi ngờ có ẩn ý đằng sau sự hậu đãi bất thường."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000105"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "chúng tôi (cánh phóng viên đi theo đơn vị)"
    locked_elements:
      - "Thuật ngữ: phóng viên đi theo đơn vị (embedded reporters)."
      - "Nhận thức thực tế về vị thế là những kẻ không mời mà đến đang ăn bám miễn phí."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000106"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "vị trung tá (Drake)"
    locked_elements:
      - "Quân hàm: vị trung tá."
      - "So sánh giá trị món quà hậu hĩnh với tách trà xã giao mà cánh nhà báo thường mời."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000107"
    speaker: "Andrew"
    pronouns_and_address: "Tiểu từ lễ phép 'ạ' cuối câu hỏi"
    locked_elements:
      - "Câu hỏi phỏng đoán mục đích tuyên truyền."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000108"
    pov: "Andrew (ngôi thứ nhất)"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "ông ấy / Drake (trần thuật); cậu (Drake nói với Andrew)"
    locked_elements:
      - "Thuật ngữ: mặt trận phía đông."
      - "Sự chuyển đổi biểu cảm từ cười toe toét sang mệt mỏi và lời cảnh báo bóng gió về bẫy mỹ nhân kế khắp mặt trận phía đông."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000109"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    speaker: "Andrew"
    pronouns_and_address: "Tôi (Andrew)"
    locked_elements:
      - "Lời nói lắp trong tiếng hét bất giác vì không thể bỏ qua chi tiết vừa nghe."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000110"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi; hai chúng tôi (Andrew và Drake)"
    locked_elements:
      - "Thuật ngữ: người của Liên bang."
      - "Hành động phản xạ nhìn quanh rồi mới sực nhớ cả hai đang ở ngoài trời không có ai ở gần."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000111"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi (Andrew); vị trung tá (Drake); người ta (đại từ khái quát 'you')"
    locked_elements:
      - "Quân hàm: vị trung tá."
      - "Bước ngoặt nhận thức ở câu cuối: vốn tưởng chỉ là chuyện đồn thổi bên bàn rượu không thể tin ngay."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000112"
    speaker: "Andrew"
    pronouns_and_address: "Tiểu từ lễ phép 'ạ' cuối câu hỏi"
    locked_elements:
      - "Câu hỏi ngắn xác nhận lại tính xác thực của lời đồn."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000113"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "Tôi / mình (Drake nói với Andrew)"
    locked_elements:
      - "Lời thề lấy rượu rum ra đảm bảo và giả định trái thực tế ('Nếu có thể, tôi đã cảnh báo cho tất cả mọi người rồi')."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000114"
    speaker: "Andrew"
    pronouns_and_address: "Tôi (Andrew hỏi Drake kèm 'ạ')"
    locked_elements:
      - "Câu hỏi gạn mức độ nghiêm trọng của sự việc."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000115"
    pov: "Andrew (ngôi thứ nhất)"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "ông ấy (Drake); Tôi - cậu (Drake nói với Andrew)"
    locked_elements:
      - "Thuật ngữ: mấy ông bạn phe Đỏ (Red pals)."
      - "Chi tiết Drake lén cảnh báo riêng từng người và bị phía Liên bang khiển trách kịch liệt, cùng biểu cảm kiệt sức tột độ."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000116"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "ông ấy (Drake)"
    locked_elements:
      - "Nhận định rõ ràng về sự ngán ngẩm của Drake."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000117"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "họ (phía Liên bang / Đảng Cộng sản)"
    locked_elements:
      - "Thuật ngữ: Đảng Cộng sản."
      - "Nhận xét khách quan về tình thế tuyệt vọng của Đảng Cộng sản."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000118"
    speaker: "Andrew"
    pronouns_and_address: "ngài (Andrew hỏi Drake kèm 'ạ'); họ (Đảng Cộng sản)"
    locked_elements:
      - "Câu hỏi diễn giải thành ngữ 'at the end of their rope' là 'đã cùng đường'."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000119"
    pov: "Andrew (ngôi thứ nhất)"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "Drake / mình; Họ (Đảng Cộng sản)"
    locked_elements:
      - "Phủ định mức độ ('Không hẳn') và sự đối lập giữa tuyên bố đảng hoàn hảo với thực chất chỉ đang cố cầm cự, dẫn đến việc bất chấp thủ đoạn để giữ thể diện."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000120"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi / mình (Andrew); ông ấy (Drake)"
    locked_elements:
      - "Tâm trạng bứt rứt của người làm báo khi cảm nhận được điều hệ trọng nhưng còn thiếu các mảnh ghép thông tin."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000121"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "tôi - cậu; chúng ta (Drake nói với Andrew)"
    locked_elements:
      - "Lời ngắt câu chuyện khéo léo: đã nói khá sâu chỉ với cái giá một tách trà, muốn nghe thêm phải trả thêm phí."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000122"
    speaker: "Andrew"
    pronouns_and_address: "tôi (Andrew nói với Drake kèm 'ạ')"
    locked_elements:
      - "Lời đề nghị mang theo xì gà vào lần tới."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000123"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "tôi (Drake nói với Andrew)"
    locked_elements:
      - "Thuật ngữ: sĩ quan ma pháp hải quân đánh bộ."
      - "Lý do từ chối xì gà để giữ phổi của pháp sư và yêu cầu đổi sang một chai scotch ngon vì đã có sẵn rượu rum."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000124"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Nhận xét ngắn gọn về mức độ đắt đỏ ngoài dự tính của yêu cầu."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000125"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi (Andrew)"
    locked_elements:
      - "Phép tính đầu tư - lợi nhuận: tự hỏi có đáng giá không nhưng nếu không đầu tư thì chắc chắn không thu được gì."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000126"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Quyết định dứt khoát không còn lựa chọn nào khác ngoài việc phải dấn tới."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000127"
    speaker: "Andrew"
    pronouns_and_address: "Tôi - thưa Trung tá / ngài (Andrew nói với Drake)"
    locked_elements:
      - "Quân hàm và thuật ngữ: thưa Trung tá, cuộc tác chiến tiếp theo."
      - "Mưu mẹo thăm dò thời điểm tác chiến qua lời hứa chuẩn bị rượu trước cuộc tác chiến."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000128"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "tôi - cậu / Andrew; mình (Drake nói với Andrew)"
    locked_elements:
      - "Lời vạch trần ý đồ dò hỏi lịch trình tác chiến và chỉ dẫn cứ kiếm sẵn một chai để bên mình."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000129"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi / mình (Andrew); Ông ấy / vị trung tá (Drake)"
    locked_elements:
      - "Quân hàm: vị trung tá."
      - "Sự thừa nhận thất bại khi mánh thăm dò bị Drake nhìn thấu ngay lập tức."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000130"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "tôi / mình (Andrew); ông ấy (Drake)"
    locked_elements:
      - "Ràng buộc chữ tín nghề báo: dù chỉ nhận lại lời hứa miệng nhưng đã trót nhận lời thì không thể thất hẹn."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000131"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew)"
    locked_elements:
      - "Ý định phải nhanh chóng xoay xở kiếm cho ra 'hương vị quê nhà' (rượu scotch)."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000132"
    speaker: "Andrew"
    pronouns_and_address: "Tôi - thưa Trung tá / ngài (Andrew nói với Drake)"
    locked_elements:
      - "Quân hàm và thuật ngữ: thưa Trung tá, cuộc tác chiến."
      - "Lời chốt cam kết chuẩn bị kịp trước cuộc tác chiến."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000133"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "tôi - cậu (Drake nói với Andrew)"
    locked_elements:
      - "Đòn phản công bất ngờ của Drake: đòi nhận chai rượu đó ngay bây giờ."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000134"
    speaker: "Andrew"
    pronouns_and_address: "Tiểu từ lễ phép 'ạ' cuối câu hỏi"
    locked_elements:
      - "Thán từ sững sờ 'Sao cơ ạ?'."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000135"
    pov: "Andrew (ngôi thứ nhất 'tôi')"
    pronouns_and_address: "Tôi (Andrew); Drake"
    locked_elements:
      - "Sự ngơ ngác của Andrew đối lập với nụ cười thích thú và cử chỉ đặt tay lên vai của Drake."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000136"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "tôi - Andrew (Drake nói với Andrew)"
    locked_elements:
      - "Thuật ngữ: buổi phổ biến nhiệm vụ (briefing), cuộc tác chiến liên hợp với Liên bang, giảng đường lớn, 17 giờ 00."
      - "Tiết lộ cuộc tác chiến diễn ra ngay hôm nay và lời nhắn mong chờ chai scotch."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000137"
    pov: "Andrew (ngôi thứ nhất)"
    pronouns_and_address: "ông ấy (Drake)"
    locked_elements:
      - "Lời khẳng định chắc chắn phần thắng trong hiệp đấu trí này thuộc về Drake."
