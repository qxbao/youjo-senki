      - "Thông báo có ba giới hạn và nêu giới hạn thứ nhất (không gửi bản tin về các cuộc chuyển quân ngay khi đang diễn ra) kèm câu nói đùa về việc không háo danh đến mức muốn phát sóng tung tích của mình cho Lục quân Đế quốc."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000203"
    pov: "Andrew (ngôi thứ nhất)"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "ông ấy / tôi (Drake); các vị (đoàn phóng viên)"
    locked_elements:
      - "Mệnh đề giả định trái thực tế ('Nếu quyền quyết định nằm ở tôi, tôi sẽ chẳng yêu cầu các vị điều này đâu, nhưng…') ngay sau khi tiếng cười làm ấm bầu không khí."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000204"
    pov: "Andrew (ngôi thứ nhất)"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "Ông ấy (Drake)"
    locked_elements:
      - "Thuật ngữ: nhân viên kiểm duyệt, bí mật quân sự."
      - "Thông báo nghiêm nghị về sự hiện diện của nhân viên kiểm duyệt để bảo vệ bí mật quân sự."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000205"
    speaker: "Andrew"
    locked_elements:
      - "Thuật ngữ: Phía Liên bang, kiểm duyệt."
      - "Câu hỏi xác minh xem có phải phía Liên bang thực hiện việc kiểm duyệt hay không."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000206"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "các vị (đoàn phóng viên); chúng tôi (phía lực lượng liên hợp)"
    locked_elements:
      - "Thuật ngữ: Các thanh tra thông tin liên lạc, Khối Thịnh vượng chung, Liên bang."
      - "Thông tin cả hai bên cùng đảm nhận kiểm duyệt và lời khẳng định đón đầu rằng sẽ không lấy cớ thiếu nhân sự để trì hoãn."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000207"
    pov: "Andrew (ngôi thứ nhất 'chúng tôi')"
    pronouns_and_address: "Họ (phía quân đội liên hợp); ông ấy (Drake); chúng tôi (đoàn phóng viên)"
    locked_elements:
      - "Quan hệ đánh đổi: nỗ lực giúp quy trình rà soát nhanh chóng và thuận tiện để đổi lấy sự nhượng bộ từ phía phóng viên vì sự an toàn chung."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000208"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "Tôi (Drake); chúng tôi (phía chỉ huy); các vị / các chàng trai và cô gái đây (đoàn phóng viên)"
    locked_elements:
      - "Thuật ngữ: sở chỉ huy, những chàng Tommy, nhân dân Liên bang, chính phủ ở chính quốc, chiến hào."
      - "Giới hạn thứ hai yêu cầu đưa tin từ sở chỉ huy và cấu trúc phủ định kép ('cả nhân dân Liên bang lẫn chính phủ ở chính quốc đều chẳng hề muốn đẩy các chàng trai và cô gái đây xuống dưới chiến hào')."
