locked_choices:
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000033"
    choices:
      - "Tiêu đề cảnh: giữ định dạng viết hoa toàn bộ 'NGÀY 19 THÁNG 6 NĂM THỐNG NHẤT 1927, PHÒNG TUYẾN PHÍA ĐÔNG, ĐƠN VỊ LỤC QUÂN ĐẾ QUỐC ĐANG TRUY KÍCH'; không có chữ nghiêng."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000034"
    choices:
      - "Nghĩa & phủ định so sánh: giữ cấu trúc đối lập 'Phần thưởng của chiến thắng thì muôn hình vạn trạng, nhưng có một thứ được bảo đảm chắc chắn chính là quyền truy sát quân địch đang tháo chạy' và phủ định so sánh 'chẳng có gì mang lại cảm giác sảng khoái hơn việc nã đạn vào ba lô của kẻ địch'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000035"
    choices:
      - "Điểm nhìn & đại từ: nội tâm tự quy chiếu của Tanya dùng 'mình' ('Ý mình là'), ngôi thứ hai phiếm chỉ dùng 'bạn' theo DEC-P01-001; giữ câu hỏi đuôi thân mật 'biết chứ?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000036"
    choices:
      - "Thuật ngữ & tình thái bắt buộc: 'general pursuit' -> 'lệnh tổng truy kích'; giữ tình thái bắt buộc bất chấp ý muốn 'tất cả mọi người đều phải lên đường dù muốn hay không'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000037"
    choices:
      - "Đơn vị, thuật ngữ & ẩn dụ: '203rd Aerial Mage Battalion' -> 'Tiểu đoàn Pháp sư Trên không số 203'; 'aerial strike formation' -> 'đội hình tập kích đường không'; giữ hình ảnh 'với tư cách là những con chó săn của Đế quốc'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000038"
    choices:
      - "Nhân vật, quân hàm & đại từ trần thuật: 'commander Lieutenant Colonel Tanya von Degurechaff' -> 'người chỉ huy đang dẫn đầu đoàn quân là Trung tá Tanya von Degurechaff'; 'vice commander' -> 'phó chỉ huy'; trần thuật quy chiếu Tanya bằng 'cô'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000039"
    choices:
      - "Đại từ & sắc thái đánh giá: quy chiếu Weiss bằng 'anh ta'; giữ nét nghĩa đánh giá cao trong phần sau dấu gạch ngang dài '—xứng đáng đạt điểm tuyệt đối vì đã lưu tâm đến những ánh mắt dõi theo của cấp dưới'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000040"
    choices:
      - "Câu hỏi tu từ & thuật ngữ: 'pursuit battle' -> 'trận đánh truy kích'; giữ câu hỏi tu từ đóng kịch trước mặt cấp dưới 'Ai mà ngờ lại có một trận đánh truy kích cơ chứ?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000041"
    choices:
      - "Xưng hô & địa danh: Weiss đáp lời Tanya dùng 'Ngài' ('Ngài nói đúng lắm'); 'breakthrough' -> 'Cuộc đột phá'; giữ nguyên địa danh 'Soldim 528'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000042"
    choices:
      - "Đơn vị, chức vụ & quan hệ nhượng bộ: 'commander and deputy commander' -> 'chỉ huy và phó chỉ huy'; '203rd Aerial Mage Battalion' -> 'Tiểu đoàn Pháp sư Trên không số 203'; giữ cấu trúc nhượng bộ 'có thể..., nhưng ít nhất đơn vị vẫn có những người chỉ huy đáng để trông cậy'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000043"
    choices:
      - "Nhân vật, chức vụ & tình thái: 'Tanya’s adjutant' -> 'viên sĩ quan phụ tá của Tanya'; giữ tình thái phỏng đoán 'Có lẽ người duy nhất nhận ra bầu không khí đầy ẩn ý giữa hai người họ'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000044"
    choices:
      - "Xưng hô & nghĩa: cấp dưới gọi Tanya là 'thưa Trung tá?' ('Colonel?'); giữ mục đích tác chiến 'vừa truy đuổi vừa truy quét tàn quân địch để đảm bảo an toàn cho khu vực'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000045"
    choices:
      - "Xưng hô & câu hỏi: Tanya gọi thẳng tên 'Weiss' và xưng 'tôi - anh'; giữ câu hỏi trực diện 'xét tình hình hiện tại, anh có thực sự nghĩ việc truy kích là khả thi không?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000046"
    choices:
      - "Xưng hô, câu hỏi phủ định & thuật ngữ: Weiss gọi Tanya là 'ngài', xưng 'chúng ta'; giữ câu hỏi nghi vấn 'nhưng đó không phải điều ngài muốn sao?' và thuật ngữ 'mission-capable' -> 'đủ khả năng thực hiện nhiệm vụ'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000047"
    choices:
      - "Quân hàm & phủ định nhấn mạnh: 'Major Weiss' -> 'Thiếu tá Weiss'; giữ cấu trúc nhấn mạnh kèm phủ định 'đến cả chúng ta cũng đã kiệt sức, mà chắc chắn chúng ta còn chưa phải chịu cảnh tồi tệ nhất đâu'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000048"
    choices:
      - "Đơn vị & quan hệ đối lập: 'breakthrough operation' -> 'chiến dịch đột phá'; 'the 203rd' -> 'Tiểu đoàn 203'; giữ tình thái 'có lẽ' và sự đối lập 'Ấy vậy mà Tanya vẫn do dự không muốn nắm lấy cơ hội mở rộng chiến quả thông qua việc truy kích'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000049"
    choices:
      - "Giả định quá khứ & tình thái bất định: bảo toàn giả định trái thực tế 'Nếu chỉ có mỗi đơn vị của mình, có lẽ cô đã ép họ phải theo kịp nhịp độ của các cánh quân còn lại' và độ bất định 'chưa chắc đã còn ở trong tình trạng có thể di chuyển được'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000050"
    choices:
      - "Đơn vị & mốc thời gian: 'B Group' -> 'Cụm B'; giữ đúng quan hệ thời gian 'vào thời điểm họ thực hiện thành công cuộc đột phá… binh lính vốn đã chạm tới giới hạn của mình rồi'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000051"
    choices:
      - "Câu hỏi phủ định: giữ câu hỏi ngắn của Weiss 'Vậy là hoàn toàn không có cách nào sao?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000052"
    choices:
      - "Đại từ & phủ định: quy chiếu Tanya bằng 'Cô', Weiss bằng 'anh'; giữ phủ định 'Cô chẳng cần phải hỏi cũng biết anh đang nói tới điều gì'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000053"
    choices:
      - "Phủ định kép / song hành & thuật ngữ: giữ cấu trúc hai vế phủ định 'Không thể dốc toàn lực thừa thắng xông lên sau một thắng lợi quả thực rất đáng bực mình, nhưng cũng chẳng có cách nào khỏa lấp được thực tế là họ hoàn toàn không còn quân dự bị' ('reserves' -> 'quân dự bị')."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000054"
    choices:
      - "Thuật ngữ & giới hạn chiến thuật: 'air fleet' -> 'không hạm đội'; Tanya xưng 'tôi' và 'chúng ta'; giữ giới hạn chỉ thị 'Tôi sẽ phê chuẩn việc tiến lên một quãng ngắn như một biện pháp chiến thuật, nhưng tôi muốn tránh chuốc thêm bất kỳ sự mệt mỏi nào nữa'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000055"
    choices:
      - "Xưng hô & câu bỏ lửng: Weiss gọi Tanya là 'ngài' ('Nếu đó là mệnh lệnh của ngài…')."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000056"
    choices:
      - "Thuật ngữ & phủ định: 'strict orders' -> 'nghiêm lệnh'; 'multinational unit' -> 'đơn vị đa quốc gia'; giữ hai câu phủ định chỉ ý chí của chỉ huy 'Tôi không muốn vắt kiệt sức lực...', 'Tôi không thể để chuyện này dây dưa kéo dài được'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000057"
    choices:
      - "Câu hỏi xác nhận: giữ câu hỏi của Weiss 'Vậy chúng ta có nên hủy bỏ hoàn toàn việc truy kích không?'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000058"
    choices:
      - "Điểm nhìn trần thuật: quy chiếu Tanya bằng 'cô'; giữ mạch chuyển từ đối thoại sang suy tính nội tâm."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000059"
    choices:
      - "Điểm nhìn nội tâm, nhân vật & đại từ: 'we' -> 'chúng tôi'; 'General Zettour' -> 'Tướng Zettour', quy chiếu bằng 'ông ấy'; giữ chi tiết 'đích thân ra tận tiền tuyến, tay lăm lăm khẩu súng'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000060"
    choices:
      - "Xưng hô trong lời dẫn trực tiếp: Zettour gọi Tanya là 'Trung tá' ('Colonel') và xưng 'ta - cô' ('ta muốn cô tới trình diện và báo cáo cho ta nghe tình hình diễn ra thế nào')."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000061"
    choices:
      - "Điểm nhìn trần thuật: giữ câu ngắn 'Nhớ lại chuyện đó, Tanya thở dài'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000062"
    choices:
      - "Câu hỏi nội tâm & lời nửa trực tiếp: giữ hai câu hỏi liên tiếp 'nhưng phải chăng điều đó có nghĩa là ông ấy đang trông đợi một món quà lưu niệm? Liệu cô có dám quay về tay không chăng?' (giữ đại từ 'cô' của lối trần thuật nửa trực tiếp)."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000063"
    choices:
      - "Độc thoại nội tâm & phủ định: Tanya tự quy chiếu bằng 'Mình' theo DEC-P01-001; giữ phủ định 'Mình chẳng muốn trở thành kiểu sếp chỉ biết truyền đạt lại nguyên xi những mệnh lệnh mâu thuẫn của cấp trên'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000064"
    choices:
      - "Lời lẩm bẩm & cấu trúc ngắt câu: Tanya tự nhủ dùng 'Mình' ('Mình không muốn trở thành người như thế, nhưng mà'); giữ phần trần thuật xen giữa hai dấu gạch ngang dài và vế kết 'bỏ qua thì cũng thấy phí thật'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000065"
    choices:
      - "Điểm nhìn nội tâm & điển cố lịch sử: tự quy chiếu bằng 'mình', số nhiều đơn vị dùng 'chúng tôi'; 'Cao Cao' -> 'Tào Tháo'; giữ quan hệ đối lập giữa lựa chọn thực tế ('rút quân') và cảm giác tiếc cơ hội."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000066"
    choices:
      - "Giả định ước muốn, thuật ngữ & phủ định kép: 'Federation and Commonwealth mages' -> 'đám pháp sư của Liên bang và Khối Thịnh vượng chung'; giữ câu giả định ước muốn bỏ lửng 'Giá mà mình có thể nện cho... một trận ra trò…' và cấu trúc phủ định kép 'cũng chẳng phải tự dưng mà mình lại mong ước điều đó'."
