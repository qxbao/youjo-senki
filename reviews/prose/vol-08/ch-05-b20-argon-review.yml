    emphasis: "none"
    logic_and_modality: "Sự đảo chiều thế trận nhờ đòn đánh bọc hậu."

  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000777"
    pov: "tự sự / nhận định chiến thuật"
    pronouns: "bạn (generic you)"
    terms:
