    emphasis: "none"
    logic_and_modality: "Giữ sắc thái giả vờ tấn công trực diện ('như thể có ý định đối đầu trực diện') và phỏng đoán niềm tin của địch ('Hẳn là chúng tin chắc không chút nghi ngờ...')."

