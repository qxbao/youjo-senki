    logic_and_modality: "Khẩu lệnh bắn yểm trợ trước khi xung phong."

  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000769"
    pov: "độc thoại nội tâm / tự sự ngôi thứ nhất của Tanya"
    pronouns: "chúng tôi (we), chúng (they/them)"
    terms:
