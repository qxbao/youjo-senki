    emphasis: "none"
    logic_and_modality: "Giữ cấu trúc giới hạn duy nhất ('Người duy nhất có khả năng tưởng tượng ra... chính là người đã ban ra mệnh lệnh ấy.')."

  - segment_id: "YS-LN08/Text/chapter018.xhtml/p000774"
    pov: "thoại khẩu lệnh"
    terms:
