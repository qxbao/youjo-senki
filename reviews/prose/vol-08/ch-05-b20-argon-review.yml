      - "đơn vị pháp sư địch (enemy mage unit)"
    emphasis: "none"
    logic_and_modality: "Giữ cấu trúc điều kiện - nhượng bộ - phủ định khả năng ('Nếu bạn đang... ngay đúng lúc..., thì dù bạn có là... đi chăng nữa, việc duy trì đội hình cũng là điều bất khả thi') và hệ quả tất yếu ('Kết quả là... rơi vào cảnh hỗn loạn')."
