      - "các thuật thức phát nổ được hiện thực hóa (manifested explosion formulas)"
      - "chiếc búa sắt của sự quan phòng (the iron hammer of providence)"
      - "hòa bình và trật tự (peace and order)"
    emphasis: "none"
    logic_and_modality: "Giữ chi tiết 'thứ chất lỏng màu đỏ đang bắn tung tóe' và lời cầu nguyện kích hoạt thuật thức."

