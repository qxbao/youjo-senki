  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000034"
    choices:
      - "Phủ định bộ phận: giữ đúng mức độ phủ định nhẹ nhưng kiên quyết của Zettour '“Nói vậy không hẳn là đúng.”'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000035"
    choices:
      - "Thuật ngữ & quan hệ đối lập: 'B Group staffers' -> 'Các sĩ quan tham mưu Cụm B'; giữ tương phản giữa nỗ lực phản biện rằng việc đó bất khả thi của các sĩ quan tham mưu và thái độ kiên quyết xoáy sâu vào luận điểm của Zettour."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000036"
    choices:
      - "Xưng hô, thuật ngữ & phủ định: Zettour gọi các sĩ quan tham mưu Cụm B là 'các vị'; 'General Staff' -> 'Bộ Tổng tham mưu'; giữ sự phân biệt giữa nhiệm vụ 'giữ vững phòng tuyến' và phủ định 'nó không hề hạn chế quyền cơ động của các vị'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000037"
    choices:
      - "Xưng hô & câu cảm thán: sĩ quan tham mưu gọi Zettour là 'ngài', xưng 'chúng ta'; giữ giọng van nài khẩn thiết về tình trạng ít quân."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000038"
    choices:
      - "Đại từ, thuật ngữ & câu hỏi đuôi: Zettour xưng 'Tôi' và dùng 'chúng ta'; giữ điều kiện phủ định ('nhưng khi không có phương án thay thế nào khác, chúng ta chẳng còn lựa chọn nào cả…'); 'strike of surgical precision' -> 'đòn tập kích chuẩn xác như dao mổ'; 'concentrated deployment of our reserves' -> 'triển khai tập trung lực lượng dự bị của chúng ta'; giữ câu hỏi đuôi xác nhận 'phải không?'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000039"
    choices:
      - "Giọng thoại & xưng hô: giữ tật nói lắp bàng hoàng 'Ý-ý-ý ngài là' và câu hỏi xác nhận 'toàn bộ lực lượng dự bị ư?'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000040"
    choices:
      - "Đại từ trần thuật & phủ định: trần thuật ngôi thứ ba quy chiếu Zettour bằng 'ông'; giữ lời khẳng định dứt khoát và câu phủ định 'Chúng ta không thể bỏ rơi binh lính của mình được.'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000041"
    choices:
      - "Đại từ, điều kiện & dấu câu: sĩ quan tham mưu xưng 'Tôi', dùng 'chúng ta' và gọi đơn vị bị vây là 'họ'; 'withdraw under their own power' -> 'tự lực rút lui'; 'mount a major operation to break the encirclement' -> 'phát động một chiến dịch quy mô lớn nhằm phá vỡ vòng vây'; giữ mệnh đề điều kiện bỏ lửng ở cuối câu."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000042"
    choices:
      - "Xưng hô cá nhân, thuật ngữ & chuỗi câu hỏi trách cứ: Zettour xưng 'tôi' và gọi viên sĩ quan tham mưu vừa phát biểu là 'anh'; 'staff officer curriculum' -> 'chương trình đào tạo sĩ quan tham mưu'; 'war college' -> 'trường đại học quân sự'; giữ rõ nguyên nhân đơn vị bị vây hãm là 'do sai lầm của cấp trên'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000043"
    choices:
      - "Phủ định điều kiện & thuật ngữ: 'basic leadership' -> 'thuật lãnh đạo cơ bản'; giữ cấu trúc phủ định gắn với khả thể ('Không cử quân đi giải cứu khi có thể sẽ gây ra những hệ lụy tiêu cực sâu rộng trong quân đội')."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000044"
    choices:
      - "Xưng hô số nhiều, thuật ngữ & phủ định kép: Zettour gọi nhóm sĩ quan tham mưu là 'các vị' và xưng 'tôi'; 'matériel' -> 'vật tư và trang bị quân sự'; 'Melting Line' -> 'Tuyến Tan Băng'; 'Soldim position' -> 'trận địa Soldim'; 'high-ranking General Staff officers' -> 'những sĩ quan cấp cao của Bộ Tổng tham mưu'; 'Rhine front' -> 'mặt trận Rhine'; 'Great Army' -> 'Đại Quân'; giữ cấu trúc phủ định kép 'Đừng nói với tôi là các vị không biết tại sao... lại bị giáng chức nhé'."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000045"
    choices:
      - "Điểm nhìn khái quát, phủ định & câu hỏi tu từ: chuyển chủ ngữ khái quát thành 'Người ta' / câu hỏi vô nhân xưng tự nhiên; 'intangible assets' -> 'những tài sản vô hình'; 'fighting spirit, morale, or trust in the organization' -> 'tinh thần chiến đấu, sĩ khí hay niềm tin vào tổ chức'; giữ câu hỏi tu từ cuối đoạn."
  - segment_id: "YS-LN08/Text/chapter010.xhtml/p000046"
    choices:
