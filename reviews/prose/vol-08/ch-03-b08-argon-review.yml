findings:
  - segment_id: YS-LN08/Text/chapter010.xhtml/p000263
    severity: moderate
    category: pronoun_and_register
    issue: "Trong mệnh lệnh vô tuyến gửi cho hô hiệu '02', bản dịch dùng đại từ 'cô' ('02, cô làm kẻ giăng bẫy!'), tự suy diễn người nhận ở đầu dây '02' là nữ (như Serebryakov, vốn đang bay ngay cạnh Tanya ở đại đội 1), trong khi ở Tiểu đoàn 203 hô hiệu '02' (Fairy 02) thường chỉ Phó tiểu đoàn trưởng/Đại đội trưởng Đại đội 2 Weiss (nam) hoặc đơn vị số 2 đang quan sát hướng đại đội bổ sung từ xa (p000259). Theo DEC-P01-001, với thoại vô tuyến dùng hô hiệu chưa nêu đích danh giới tính người nhận tại chỗ, cần tránh giả định đại từ giới tính cụ thể và ưu tiên câu mệnh lệnh quân sự ngắn gọn gắn với callsign."
    recommendation: "Lược đại từ giới tính 'cô' và dùng cấu trúc mệnh lệnh vô tuyến trực tiếp: '“02, đảm nhận vai trò kẻ giăng bẫy! Hãy nhắm vào những tên địch đang săn đuổi số lính mới tới của chúng ta!”' hoặc '“02, làm kẻ giăng bẫy! Hãy nhắm vào những tên địch đang săn đuổi số lính mới tới của chúng ta!”'."
