      - "Tình thái quá khứ: 'Chỉ có ... mới cứu vãn nổi'."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000023"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
      - "Quan hệ nhân quả: hệ quả từ những điều kỳ quặc của con quái vật mang tên chính trị dẫn tới một phép màu."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000024"
    pov: "Andrew (ngôi thứ nhất)"
    locked_elements:
