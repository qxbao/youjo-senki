      - "Thuật ngữ: đơn vị đa quốc gia, Quân đội Liên bang."
      - "Nhấn mạnh phạm vi giới hạn ('Tại khu vực nơi đơn vị đa quốc gia đồn trú này, và chỉ riêng khu vực này mà thôi') và sự biến mất đầy bí ẩn của vấn đề tiếp tế."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000096"
    speaker: "Andrew"
    pronouns_and_address: "Tiểu từ lễ phép 'ạ' cuối câu hỏi"
    locked_elements:
      - "Các món trà chiều đặc trưng của Khối Thịnh vượng chung: bánh nướng scone, trà và bánh mì kẹp dưa chuột."
  - segment_id: "YS-LN08/Text/chapter004.xhtml/p000097"
    speaker: "Lieutenant Colonel Drake"
    pronouns_and_address: "Tôi (Drake nói với Andrew); họ (phía Liên bang)"
    locked_elements:
      - "Câu hỏi nối ý về buổi trà chiều tao nhã như ở quê nhà và lời khẳng định đánh cược họ có thể thu xếp được."
