    segment_id: YS-LN08/Text/chapter012.xhtml/p000154
    issue: "Cụm 'common sense' trong độc thoại nội tâm của Tanya được dịch là 'lương tri thông thường', hơi nghiêng sang sắc thái đạo đức so với bình diện đánh giá thực dụng/duy lý trong ngữ cảnh (so sánh với p000167 dịch là 'nhận thức chung')."
    rationale: "Câu dịch hiện tại vẫn giữ được ý phê phán sự phi lý của việc tự bỏ tiền túi đi đánh trận ở nơi hẻo lánh, không làm sai lệch cốt truyện nên chỉ ghi nhận ở mức minor."
    recommendation: "Có thể giữ nguyên hoặc cân nhắc chỉnh thành 'lẽ thường' hoặc 'nhận thức thông thường' ở bước chuốt văn để tránh sắc thái đạo đức theo style-guide."
