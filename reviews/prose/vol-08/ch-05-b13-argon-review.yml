findings:
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000440
    severity: minor
    category: meaning_and_precision
    issue: "Cụm 'thọc sườn hậu phương địch' ghép nhầm khái niệm đánh vào sườn với đánh vào hậu phương; đồng thời câu đầu bổ sung sớm từ 'ma lực' khi nguyên văn ở p000440 chỉ mới nêu 'signals' (sang p000441 mới định danh rõ 'mana signals')."
    recommendation: "Sửa 'thọc sườn hậu phương địch' thành 'đánh úp vào hậu phương địch' (hoặc 'giáng một đòn vào hậu phương địch') và chỉ dịch 'signals' ở p000440 là 'tín hiệu'."
  - segment_id: YS-LN08/Text/chapter018.xhtml/p000441
    severity: minor
    category: terminology_consistency
    issue: "Tại p000441 và p000480, 'aerial mage officers' / 'aerial mages' đang được dịch là 'sĩ quan pháp sư hàng không' / 'pháp sư hàng không'; tại p000441, p000444 và p000459, 'mana signals' đang dịch là 'tín hiệu ma lực', chưa đồng bộ với phương án tạm đã dùng xuyên suốt tập 8 ('pháp sư trên không', 'tín hiệu ma năng')."
    recommendation: "Đồng bộ thành 'sĩ quan pháp sư trên không' (p000441), 'pháp sư trên không' (p000480) và 'tín hiệu ma năng' (p000441, p000444, p000459) để khớp với các lô trước của chương 5."
