findings:
  - severity: minor
    segment_id: YS-LN08/Text/chapter012.xhtml/p000328
    issue: "Danh từ 'the colors' đang được dịch cụ thể hóa thành 'màu sơn', trong khi đặt nối tiếp với p000326–p000327 (Zettour đang nhìn bức không ảnh và nhận xét 'Màu sắc bạc đi tệ thật') thì từ gốc có thể chỉ màu sắc/sắc độ trên ảnh chụp do chất lượng vật tư ghi hình kém khi ưu tiên dồn cho phụ tùng máy bay."
    rationale: "Ý chính về việc ưu tiên kiếm phụ tùng máy bay, chất lượng vật tư kém và việc Hội đồng Tự trị gấp rút thu mua trang bị cũ của Quân đội Liên bang vẫn được bảo toàn nên chỉ ghi nhận ở mức minor."
    recommendation: "Ở bước chuốt văn, cân nhắc đổi 'màu sơn' thành 'màu sắc' để giữ đúng độ mở của từ gốc và liên kết mạch lạc với nhận xét về bức không ảnh ở p000327."
  - severity: minor
    segment_id: YS-LN08/Text/chapter012.xhtml/p000336
    issue: "Cụm 'The maneuvers via Ildoa' đang được dịch tường minh hóa thành 'Các bước đi ngoại giao thông qua Ildoa' (thêm chữ 'ngoại giao' so với mặt chữ gốc)."
    rationale: "Ngữ cảnh nối tiếp ngay ở p000337 xác nhận đây là các động thái trung gian hòa giải thông qua Đại tá Calandro của Ildoa nên không làm sai lệch nội dung hay điểm nhìn; chỉ ghi nhận ở mức minor."
    recommendation: "Có thể giữ nguyên hoặc cân nhắc dịch sát mặt chữ hơn thành 'Các bước đi vận động thông qua Ildoa' ở bước chuốt văn."
