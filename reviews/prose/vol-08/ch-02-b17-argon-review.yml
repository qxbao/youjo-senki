      - "Xưng hô & quân hàm: Tanya gọi Visha là 'cô' và 'Trung úy Serebryakov' ('Lieutenant Serebryakov')."
  - segment_id: "YS-LN08/Text/chapter008.xhtml/p000364"
    choices:
      - "Dấu chấm lửng, địa danh & xưng hô: giữ dấu chấm lửng đầu câu; 'the Rhine' -> 'mặt trận Rhine'; Visha tự xưng 'tôi' kèm 'ạ' và giữ hình ảnh hài hước 'Đem xẻng của chúng ta đi dã ngoại một chuyến có khi lại hay.'"
  - segment_id: "YS-LN08/Text/chapter008.xhtml/p000365"
    choices:
      - "Phủ định & cách gọi trong thoại: Tanya xưng 'tôi', từ chối thẳng thừng và gọi thuộc cấp là 'lũ hiếu chiến các người' ('you warmongers')."
  - segment_id: "YS-LN08/Text/chapter008.xhtml/p000366"
    choices:
      - "Điểm nhìn, đại từ nội tâm & phủ định: giữ câu đầu quy chiếu 'Tanya' và câu sau chuyển sang ngôi thứ nhất nội tâm 'mình' / 'bản thân' ở kiếp trước theo DEC-P01-001; giữ phủ định nhấn mạnh 'có nằm mơ cũng chẳng bao giờ tưởng tượng nổi'."
