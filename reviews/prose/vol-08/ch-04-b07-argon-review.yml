  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000247"
    choices:
      - "Xưng hô, điểm nhìn, phủ định & đại từ: 'Yes, ma’am' -> 'Rõ, thưa Trung tá'; câu nhận định nội tâm giữ phủ định 'Thế là không ổn rồi.' và đại từ khái quát 'Bạn' ('You')."
  - segment_id: "YS-LN08/Text/chapter014.xhtml/p000248"
    choices:
