  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000139"
    choices:
      - "Điểm nhìn, đối lập & dấu câu: giữ sự tương phản giữa 'thanh niên phe địch' và 'những người trẻ tuổi của phe mình', cùng dấu gạch ngang dài '—đó chính là chiến tranh'."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000140"
    choices:
      - "Thuật ngữ & cấu trúc so sánh phủ định: 'General Staff officer' -> 'sĩ quan Bộ Tổng tham mưu'; giữ cấu trúc so sánh bậc nhất phủ định 'Không ai kém phù hợp... hơn một kẻ muốn được lòng mọi người'."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000141"
    choices:
      - "Đại từ, thuật ngữ & giả định trái thực tế ở quá khứ: Zettour tự xưng 'tôi', dùng 'Chúng ta' cho 'We'; 'foreign affairs' -> 'công việc đối ngoại'; 'Supreme Command' -> 'Bộ Tư lệnh Tối cao'; giữ dấu chấm lửng và điều kiện giả định 'Ngay cả khi tôi không tự ý hành động theo thẩm quyền của mình hay chống đối Bộ Tư lệnh Tối cao… thì sớm muộn gì tôi cũng sẽ bị trừng phạt thôi'."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000142"
    choices:
      - "Đại từ & tình thái: quy chiếu Zettour bằng 'ông'; giữ tình thái đánh giá 'có thể coi là nhẹ nhàng đến bất ngờ'."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000143"
    choices:
      - "Phủ định: giữ nhận định phủ định 'Zettour chẳng hề ôm lòng oán hận nào'."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000144"
    choices:
      - "Nhấn mạnh, thuật ngữ, đại từ & câu hỏi tu từ: giữ chính xác phạm vi in nghiêng '*Vậy nên những gì đã xảy ra là điều tất yếu*'; Zettour dùng 'chúng ta' cho 'we', trần thuật quy chiếu Zettour bằng 'ông' / 'mình'; 'accountability' -> 'trách nhiệm giải trình'; 'principles of military command' -> 'các nguyên tắc chỉ huy quân sự'; 'military administration' -> 'ngành hành chính quân sự'; giữ hai câu hỏi tu từ ở giữa và cuối đoạn."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000145"
    choices:
