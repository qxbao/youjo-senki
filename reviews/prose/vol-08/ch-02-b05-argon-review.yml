  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000146"
    choices:
      - "Quan hệ nhượng bộ & phủ định: giữ cấu trúc 'Ngay cả khi xung quanh không có ai, Rudersdorf cũng đang đi quá giới hạn rồi'."
  - segment_id: "YS-LN08/Text/chapter006.xhtml/p000147"
    choices:
