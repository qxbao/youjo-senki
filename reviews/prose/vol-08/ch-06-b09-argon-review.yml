findings:
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000329"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Dịch tính từ chỉ mùi hương hồng trà đã lâu không được thưởng thức thành 'đã thất truyền từ lâu' làm lệch nghĩa sang một bí quyết hoặc kỹ nghệ bị mai một vĩnh viễn."
    basis: "Theo ngữ cảnh ở p000333 và canon/style-guide.md, nguồn hồng trà chỉ bị gián đoạn do cuộc phong tỏa đường biển của Khối Thịnh vượng chung nên vắng bóng suốt thời gian dài ở Đế quốc, chứ không phải bị thất truyền."
    recommendation: "Đổi 'mùi hương đã thất truyền từ lâu của hồng trà' thành 'mùi hương hồng trà vốn đã vắng bóng từ lâu' hoặc 'mùi hương hồng trà đã lâu không được ngửi thấy'."
  - segment_id: "YS-LN08/Text/chapter022.xhtml/p000346"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Dịch danh từ khẩu ngữ chỉ kẻ ăn chực/hưởng lợi chùa ('mooch') thành 'kẻ chỉ biết ăn không ngồi rồi' làm lệch trọng tâm sang sự lười biếng thay vì việc uống trà chùa mà không đóng góp ý kiến tương xứng."
    basis: "Trong ngữ cảnh Tanya vừa được Zettour mời uống hồng trà quý hiếm (p000331–p000334) rồi được hỏi ý kiến, Tanya tự nhủ nếu không tận dụng cơ hội đóng góp hoặc nói ra suy nghĩ của mình thì chẳng khác nào kẻ đến uống trà chùa/ăn chực."
    recommendation: "Đổi 'một kẻ chỉ biết ăn không ngồi rồi' thành 'một kẻ ăn chực' hoặc 'một kẻ chỉ biết uống trà chùa'."
