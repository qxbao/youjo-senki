  - segment_id: "YS-LN06/Text/part0021.html/p000119"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng đại từ 'nó' cho Tanya ('Nhưng đó cũng chỉ là ý kiến của riêng nó')."
  - segment_id: "YS-LN06/Text/part0021.html/p000120"
    choices:
      - "Trần thuật: giữ tên 'Uger' và quan hệ hệ quả 'Cũng bởi vậy mà một Uger vốn ôn hòa, hiểu chuyện lại lộ vẻ mặt khổ sở đến thế'."
  - segment_id: "YS-LN06/Text/part0021.html/p000121"
    choices:
      - "Thoại Uger nói với Tanya: gọi 'Trung tá von Degurechaff' và giữ mệnh đề phủ định 'đó không phải là hòa bình'."
  - segment_id: "YS-LN06/Text/part0021.html/p000122"
    choices:
      - "Thoại Tanya hỏi lại: giữ nguyên độ mở câu hỏi '“Vậy thì đó là gì?”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000123"
    choices:
      - "Thoại của Uger và trần thuật: giữ hai phủ định 'Nó chẳng khác nào đầu hàng cả. Tuyệt đối không thể gọi đó là hòa bình được'; theo DEC-P01-001 quy chiếu Tanya bằng 'nó' và Uger bằng 'anh ấy'; giữ tình thái suy đoán 'có lẽ cũng nên khen ngợi nỗ lực đó của anh ấy'."
  - segment_id: "YS-LN06/Text/part0021.html/p000124"
    choices:
      - "Thoại Uger hỏi Tanya: gọi Tanya là 'Cô', dùng ngôi gộp 'Chúng ta' và giữ hai câu hỏi liên tiếp về cái giá của cuộc chiến và số thi thể người trẻ."
  - segment_id: "YS-LN06/Text/part0021.html/p000125"
    choices:
      - "Thoại Tanya đáp Uger: tự xưng 'tôi', dùng ngôi gộp 'chúng ta', giữ lập luận phản đối hy sinh thêm."
  - segment_id: "YS-LN06/Text/part0021.html/p000126"
    choices:
      - "Trần thuật suy đoán: giữ tình thái 'Có lẽ', quy chiếu Uger là 'anh ấy' và trạng thái 'bàng hoàng đến mức không thốt nên lời'."
  - segment_id: "YS-LN06/Text/part0021.html/p000127"
    choices:
      - "Trần thuật và thoại Uger hỏi Weiss: quy chiếu Uger là 'anh ấy', trong thoại gọi 'Thiếu tá Weiss' và đại từ ngôi thứ hai 'cậu' (cấp trên gọi cấp dưới)."
  - segment_id: "YS-LN06/Text/part0021.html/p000128"
    choices:
      - "Thoại cảm thán bất ngờ của Weiss: '“Hả?”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000129"
    choices:
      - "Thoại Uger hỏi Weiss: xưng 'Tôi - Cậu', giữ cụm 'một sĩ quan ngoài thực địa'."
  - segment_id: "YS-LN06/Text/part0021.html/p000130"
    choices:
      - "Trần thuật: quy chiếu Uger bằng 'Anh ấy' (phản thân 'mình'), giữ cấp bậc đầy đủ 'Trung tá Tanya von Degurechaff' và phủ định 'một góc nhìn không phải của Trung tá Tanya von Degurechaff'."
  - segment_id: "YS-LN06/Text/part0021.html/p000131"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya ('Người thuộc cấp của nó'), phản thân 'mình' cho Weiss và giữ tên 'Tanya'."
  - segment_id: "YS-LN06/Text/part0021.html/p000132"
    choices:
      - "Thoại Tanya cho phép Weiss nói: gọi 'Thiếu tá' và đại từ 'Anh' nhất quán với cách Tanya gọi thuộc cấp nam."
  - segment_id: "YS-LN06/Text/part0021.html/p000133"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng đại từ 'Nó' cho Tanya."
  - segment_id: "YS-LN06/Text/part0021.html/p000134"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tên 'Serebryakov', 'Weiss', chức danh 'sĩ quan phụ tá', dùng 'nó' cho Tanya và 'anh ta' cho Weiss; giữ mệnh đề nhượng bộ - phủ định 'ngay cả khi ý kiến của anh ta không thể gọi là khách quan, thì nó vẫn sẽ có giá trị tham khảo'."
  - segment_id: "YS-LN06/Text/part0021.html/p000135"
    choices:
      - "Thoại Weiss trình bày quan điểm: tự xưng 'tôi', giữ cấu trúc giả định lựa chọn giữa hai vế (có phủ định 'không phải hy sinh thêm bất kỳ điều gì nữa') và nhận định 'việc từ bỏ vào thời điểm này là cực kỳ khó khăn'."
  - segment_id: "YS-LN06/Text/part0021.html/p000136"
    choices:
      - "Thoại Uger đáp Weiss: tự xưng 'Tôi', giữ cụm 'tâm tư nơi tiền tuyến'."
  - segment_id: "YS-LN06/Text/part0021.html/p000137"
    choices:
      - "Thoại Weiss đáp cấp trên: tự xưng 'tôi' kèm tiểu từ kính ngữ 'ạ' ('Chí ít thì đó là cảm nghĩ của cá nhân tôi ạ')."
  - segment_id: "YS-LN06/Text/part0021.html/p000138"
    choices:
      - "Trần thuật và nội tâm trực tiếp theo DEC-P01-001 và DEC-P01-002: giữ tên 'Weiss', 'Uger', 'Tanya' ở câu trần thuật; câu nội tâm ngôi thứ nhất tự quy chiếu bằng 'mình', quy chiếu Weiss bằng 'anh ta', không thêm Markdown in nghiêng vì nguồn không có thẻ nhấn mạnh."
  - segment_id: "YS-LN06/Text/part0021.html/p000139"
    choices:
      - "Thoại Tanya ngắt lời: gọi 'Thiếu tá Weiss' ('“…Khoan đã, Thiếu tá Weiss.”')."
  - segment_id: "YS-LN06/Text/part0021.html/p000140"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng đại từ 'nó' cho Tanya ('…Bởi thế nên nó buộc phải cắt ngang')."
  - segment_id: "YS-LN06/Text/part0021.html/p000141"
    choices:
      - "Thoại Tanya hỏi Weiss: gọi Weiss là 'anh', giữ câu hỏi phủ định '“Đến cả anh cũng không thể từ bỏ sao?”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000142"
    choices:
      - "Thoại Weiss đáp Tanya: xưng 'tôi - ngài', gọi 'thưa Trung tá' thể hiện đúng lễ tiết cấp dưới nói với chỉ huy trực tiếp."
  - segment_id: "YS-LN06/Text/part0021.html/p000143"
    choices:
      - "Thoại Tanya đáp Weiss: dùng ngôi gộp 'chúng ta', giữ 'chỉ huy ngoài tiền tuyến' và 'đưa ra quyết định và tập trung nguồn lực'."
  - segment_id: "YS-LN06/Text/part0021.html/p000144"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tên 'Weiss', quy chiếu Weiss là 'anh ta' và Tanya là 'nó'."
  - segment_id: "YS-LN06/Text/part0021.html/p000145"
    choices:
      - "Trần thuật và nội tâm theo DEC-P01-001 và DEC-P01-002: dùng 'nó' cho Tanya ở phần dẫn, 'Anh ta' cho Weiss; giữ chính xác ba cụm nhấn mạnh Markdown '*Anh ta có thể suy nghĩ thực tế khi cần*', '*Anh ta không thể không thực tế được.*' (bảo toàn phủ định kép) và '*Tại sao chứ?!*' khớp với ba thẻ em trong nguồn."
  - segment_id: "YS-LN06/Text/part0021.html/p000146"
    choices:
      - "Nội tâm câu hỏi cảm thán theo DEC-P01-002: bọc toàn câu trong Markdown '*Sao anh ta lại tỏ vẻ bối rối ra mặt như thế?!*' khớp với thẻ em của nguồn."
  - segment_id: "YS-LN06/Text/part0021.html/p000147"
    choices:
      - "Thoại Weiss nói với Tanya: xưng 'tôi', dịch 'ma’am' là 'thưa Trung tá', giữ 'đó chỉ là lý thuyết suông thôi… Đó chỉ là một quan điểm'."
  - segment_id: "YS-LN06/Text/part0021.html/p000148"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tình thái 'lẽ ra phải tán thành hòa bình mới đúng', tên 'Tanya' và đại từ 'nó'."
  - segment_id: "YS-LN06/Text/part0021.html/p000149"
    choices:
      - "Thoại Uger điều phối lại cuộc trò chuyện: gọi Tanya là 'Trung tá', xưng 'tôi - cô' và dùng ngôi gộp 'chúng ta'."
  - segment_id: "YS-LN06/Text/part0021.html/p000150"
    choices:
      - "Thoại và trần thuật theo DEC-P01-001: đáp '“Vâng.”', dùng 'Nó' cho Tanya và giữ tên 'Uger'."
  - segment_id: "YS-LN06/Text/part0021.html/p000151"
    choices:
      - "Thoại Uger nói với Tanya: xưng 'Tôi - cô', giữ nhịp nhấn lặp '“…Tôi hiểu lập luận của cô; tôi thực sự hiểu.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000152"
    choices:
      - "Thoại Tanya đáp Uger: gọi 'anh, Trung tá Uger'."
  - segment_id: "YS-LN06/Text/part0021.html/p000153"
    choices:
      - "Thoại Uger nói với Tanya: gọi 'Trung tá von Degurechaff' và quy chiếu Weiss bằng 'cậu ấy'."
  - segment_id: "YS-LN06/Text/part0021.html/p000154"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tên 'Tanya' và đại từ sở hữu 'của nó'."
  - segment_id: "YS-LN06/Text/part0021.html/p000155"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'của nó' cho Tanya, giữ cấu trúc so sánh phủ định 'chẳng phải vì tính trẻ con mà là do đang choáng váng thì đúng hơn'."
  - segment_id: "YS-LN06/Text/part0021.html/p000156"
    choices:
      - "Thoại Uger nói với Tanya: dùng ngôi gộp 'Chúng ta', giữ phủ định 'không thể từ bỏ được' và gọi Tanya là 'cô'."
  - segment_id: "YS-LN06/Text/part0021.html/p000157"
    choices:
      - "Thoại Weiss nói chen với Uger về Tanya: tự xưng 'Tôi' và quy chiếu Tanya một cách kính trọng là 'ngài ấy' ('“Tôi nghĩ là ngài ấy đã đồng ý rồi…”')."
  - segment_id: "YS-LN06/Text/part0021.html/p000158"
    choices:
      - "Thoại Tanya tự giãi bày: tự xưng 'tôi' (phản thân 'mình'), giữ hình ảnh 'bị kẹt trong một cái lô cốt và phải cố thủ đến hơi thở cuối cùng' và phủ định 'Tôi chẳng thể nào vui vẻ mà tán thành chuyện này được'."
  - segment_id: "YS-LN06/Text/part0021.html/p000159"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tên 'Uger', 'Tanya', tình thái 'có lẽ' và đại từ sở hữu 'của nó'."
  - segment_id: "YS-LN06/Text/part0021.html/p000160"
    choices:
      - "Thoại Tanya hỏi Uger: gọi Uger là 'Anh' ('“Anh chấp nhận việc phải gánh thêm tổn thất sao?”')."
  - segment_id: "YS-LN06/Text/part0021.html/p000161"
    choices:
      - "Thoại Uger hỏi vặn lại Tanya: gọi Tanya là 'cô' ('“Còn cô thì chấp nhận để những tổn thất từ trước tới nay trở thành vô nghĩa sao?”')."
  - segment_id: "YS-LN06/Text/part0021.html/p000162"
    choices:
      - "Theo DEC-P01-002 giữ nhấn mạnh Markdown '*À ra thế*' đúng phạm vi từ cảm thán in nghiêng trong nguồn; giữ tên 'Tanya' ở vế trần thuật."
  - segment_id: "YS-LN06/Text/part0021.html/p000163"
    choices:
      - "Trần thuật nội tâm: giữ thuật ngữ 'Hiệu ứng Concorde' và ký hiệu chú thích '⁵'."
  - segment_id: "YS-LN06/Text/part0021.html/p000164"
    choices:
      - "Câu cảm thán nội tâm: giữ 'Không ngờ lại chính là Hiệu ứng Concorde!'."
  - segment_id: "YS-LN06/Text/part0021.html/p000165"
    choices:
      - "Trần thuật phân tích: giữ khẳng định phủ định kép 'Không còn nghi ngờ gì nữa', phủ định 'một khoản đầu tư không còn đáng giá đối với Đế quốc' và cụm giải thích 'người trẻ tuổi cuối cùng—lực lượng lao động của mình—khắp nơi trên mặt đất'."
  - segment_id: "YS-LN06/Text/part0021.html/p000166"
    choices:
      - "Trần thuật phân tích: giữ câu hỏi tu từ 'Và đổi lại họ nhận được gì?' và câu trả lời 'Những dải lãnh thổ rộng lớn lúc nhúc quân du kích và phiến quân'."
  - segment_id: "YS-LN06/Text/part0021.html/p000167"
    choices:
      - "Nhận định nhấn mạnh mức độ: giữ phủ định 'Nói rằng nó không đáng giá thì vẫn còn là quá nhẹ'."
  - segment_id: "YS-LN06/Text/part0021.html/p000168"
    choices:
      - "Trần thuật phân tích: dịch đại từ khái quát 'you' là 'bạn', giữ tình thái 'có lẽ bạn vẫn có thể nhắm tới việc cải thiện doanh thu', mệnh đề đối lập 'đây vẫn là một thương vụ thua lỗ' và giả định 'Cách tốt nhất, nếu có thể làm được, là khép lại dự án mạo hiểm này ngay lập tức'."
  - segment_id: "YS-LN06/Text/part0021.html/p000169"
    choices:
      - "Trần thuật chuyển ý: 'Chỉ có một vấn đề duy nhất'."
  - segment_id: "YS-LN06/Text/part0021.html/p000170"
    choices:
      - "Trần thuật kết đoạn theo DEC-P01-002: dịch đại từ khái quát là 'người ta ... mình', giữ nhấn mạnh Markdown '*buộc phải*' đúng phạm vi từ in nghiêng trong nguồn."
