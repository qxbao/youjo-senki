      - "Thoại lắp bắp & câu hỏi: giữ hiệu ứng nói lắp đầu câu 'Ch-chúng ta' và câu hỏi ngạc nhiên 'được điều chuyển về thủ đô ư?'."
  - segment_id: "YS-LN06/Text/part0017.html/p000218"
    choices:
      - "Điểm nhìn, quân hàm & thuật ngữ: phản thân 'mình'; 'Lieutenant Colonel Tanya von Degurechaff' -> 'Trung tá Tanya von Degurechaff'; 'General Staff' -> 'Bộ Tổng tham mưu'."
  - segment_id: "YS-LN06/Text/part0017.html/p000219"
    choices:
      - "Đại từ theo DEC-P01-001, phủ định & thuật ngữ: trần thuật quy chiếu Tanya bằng 'nó', quy chiếu Bộ Tổng tham mưu bằng 'họ'; 'General Staff' -> 'Bộ Tổng tham mưu'; 'regional army group’s headquarters' -> 'sở chỉ huy cụm tập đoàn quân khu vực'; giữ phủ định giảm nhẹ 'chẳng có gì đáng ngạc nhiên cho lắm'."
  - segment_id: "YS-LN06/Text/part0017.html/p000220"
    choices:
      - "Trần thuật ngắn: giữ nguyên câu khẳng định trọng tâm 'Vấn đề nằm ở điểm đến.'."
  - segment_id: "YS-LN06/Text/part0017.html/p000221"
    choices:
      - "Đại từ & thuật ngữ địa điểm: quy chiếu đơn vị của Tanya bằng 'Họ' / 'họ'; 'front line' -> 'tiền tuyến'; 'staging area' -> 'khu tập kết'; 'garrison near Berun' -> 'một doanh trại đồn trú gần Berun'; lược đại từ khái quát 'you' bằng cấu trúc 'hoàn toàn có thể nói là'."
