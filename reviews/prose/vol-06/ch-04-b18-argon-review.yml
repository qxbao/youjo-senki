locked_choices:
  - segment_id: "YS-LN06/Text/part0021.html/p000038"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng đại từ 'nó'; giữ cấp bậc và tên đầy đủ 'Trung tá Tanya von Degurechaff'; giữ giới hạn phạm vi 'Lĩnh vực của nó là chỉ huy ngoài thực địa'."
  - segment_id: "YS-LN06/Text/part0021.html/p000039"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó' và tên 'Tanya'; giữ quan hệ đối lập - phủ định 'có rất nhiều quyền tự quyết. Song nó lại không ở vị trí được tham dự khi các nhân vật chủ chốt hoạch định chiến lược'."
  - segment_id: "YS-LN06/Text/part0021.html/p000040"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó', phản thân 'tự mình'; giữ câu điều kiện phủ định 'Nếu không cam chịu điều đó, nó chỉ còn cách tự mình làm gì đó mà thôi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000041"
    choices:
      - "Thoại lầm bầm của Tanya: dùng ngôi gộp 'Chúng ta', giữ hình ảnh ẩn dụ 'gieo vài hạt mầm ngay khi còn sớm'; trần thuật về Tanya theo DEC-P01-001 dùng 'nó'."
  - segment_id: "YS-LN06/Text/part0021.html/p000042"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó'; giữ cụm 'những vấn đề tế nhị thế này' và mức độ cảm xúc 'khiến nó vô cùng phấn chấn'."
  - segment_id: "YS-LN06/Text/part0021.html/p000043"
    choices:
      - "Thoại mệnh lệnh ngắn gọn của Tanya: '“Đổi kế hoạch.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000044"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'Nó'; giữ sắc thái 'lấy làm xót xa khi phải xóa sổ kỳ nghỉ phép của thuộc cấp'."
  - segment_id: "YS-LN06/Text/part0021.html/p000045"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'Nó - nó', phản thân 'của mình'; giữ quan hệ nhượng bộ 'nhưng trước tính chất cấp bách của công việc, nó buộc phải huy động các sĩ quan của mình'."
  - segment_id: "YS-LN06/Text/part0021.html/p000046"
    choices:
      - "Giả định trái thực tế và đối lập cấp bậc: 'Nếu họ là binh nhì thì có lẽ đã khác, đằng này tất cả đều là sĩ quan'."
  - segment_id: "YS-LN06/Text/part0021.html/p000047"
    choices:
      - "Nhận định nguyên tắc quân ngũ: 'Quyền hạn và quân hàm luôn tỷ lệ thuận với trách nhiệm'."
  - segment_id: "YS-LN06/Text/part0021.html/p000048"
    choices:
      - "Thoại Tanya giao việc cho thuộc cấp: tự xưng 'tôi', gọi 'Thiếu tá Weiss' là 'anh', gọi 'Trung úy Serebryakov' là 'cô', giữ đúng tên và cấp bậc 'Đại úy Ahrens hoặc Đại úy Meybert' cùng yêu cầu 'tối nay tôi cần một trong hai người trực ban'."
  - segment_id: "YS-LN06/Text/part0021.html/p000049"
    choices:
      - "Thoại Serebryakov đáp lời Tanya: tự xưng 'tôi', kèm tiểu từ lễ phép 'ạ' ở cuối câu hỏi xin chỉ thị."
  - segment_id: "YS-LN06/Text/part0021.html/p000050"
    choices:
      - "Thoại Tanya nói với Serebryakov: gọi 'Cô', giữ phủ định mở đầu 'Không cần, cơ hội thế này chẳng mấy khi có được' và lời cho phép 'đi trò chuyện với người bạn ở mặt trận phía tây đi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000051"
    choices:
      - "Nội tâm tự quy chiếu của Tanya: dùng ngôi gộp 'chúng ta', giữ so sánh 'trao đổi với Weiss dễ dàng hơn' và điều kiện ưu tiên 'nếu chúng ta có một mối quen biết có thể khai thác thông tin về tình hình mặt trận phía tây, việc đó cần được ưu tiên'."
  - segment_id: "YS-LN06/Text/part0021.html/p000052"
    choices:
      - "Trần thuật và thoại của Tanya: giữ 'sĩ quan phụ tá', tên 'Tanya', 'người bồi bàn' và câu hỏi lịch sự '“Cho tôi mượn điện thoại một chút được không?”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000053"
    choices:
      - "Tiêu đề chuyển cảnh viết hoa toàn bộ: 'TỐI CÙNG NGÀY'."
  - segment_id: "YS-LN06/Text/part0021.html/p000054"
    choices:
      - "Trần thuật: giữ đánh giá phủ định hàm ẩn 'Khó lòng nói rằng' và tên cơ quan 'Cục Quân vụ trong Bộ Tổng tham mưu'."
  - segment_id: "YS-LN06/Text/part0021.html/p000055"
    choices:
      - "Trần thuật: giữ 'Trung tướng von Zettour' và hình ảnh 'dán mắt vào những bảng biểu giờ tàu nơi từng giây một đều mang tính sống còn'."
  - segment_id: "YS-LN06/Text/part0021.html/p000056"
    choices:
      - "Trần thuật: giữ 'Bộ Tổng tham mưu', chức danh và cấp bậc 'chuyên gia quản lý đường sắt, Trung tá Uger', cùng phủ định 'chẳng phải người xem nhẹ công việc của mình…'."
  - segment_id: "YS-LN06/Text/part0021.html/p000057"
    choices:
      - "Thoại Tanya chào hỏi xã giao Uger: gọi 'Trung tá Uger', hỏi thăm lịch sự 'Phu nhân và cháu gái ở nhà vẫn khỏe cả chứ ạ?'."
  - segment_id: "YS-LN06/Text/part0021.html/p000058"
    choices:
      - "Thoại Uger đáp lời Tanya: tự xưng 'tôi', tự quy chiếu với con gái là 'bố' ('con gái mình sắp quên mất mặt bố rồi')."
  - segment_id: "YS-LN06/Text/part0021.html/p000059"
    choices:
      - "Thoại Tanya nói với Uger: gọi Uger là 'anh', giữ sắc thái cáo lỗi 'vào buổi tối đáng lẽ phải về nhà làm tròn bổn phận gia đình thế này'."
  - segment_id: "YS-LN06/Text/part0021.html/p000060"
    choices:
      - "Thoại Uger nói với Tanya: gọi Tanya là 'cô', giữ câu hỏi suy đoán có phủ định 'Chắc hẳn là chuyện cô không muốn người ngoài nghe thấy, đúng không? Cô có đang vội không?'."
  - segment_id: "YS-LN06/Text/part0021.html/p000061"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: giữ tên 'Tanya' và đại từ 'nó'; giữ thuật ngữ 'vốn xã hội', 'Bộ Tổng tham mưu' và cấu trúc so sánh hơn 'là lợi thế lớn hơn cả những gì nó có thể kỳ vọng'."
  - segment_id: "YS-LN06/Text/part0021.html/p000062"
    choices:
      - "Nội tâm khái quát của Tanya: dịch đại từ khái quát ngôi thứ hai thành 'Người ta', giữ phép so sánh 'lòng tin thực chất lại giống như không khí'."
  - segment_id: "YS-LN06/Text/part0021.html/p000063"
    choices:
      - "Nội tâm khái quát của Tanya: tiếp nối đại từ khái quát 'người ta' ('Khi có nó, người ta sẽ thấy dễ thở hơn nhiều')."
  - segment_id: "YS-LN06/Text/part0021.html/p000064"
    choices:
      - "Thoại Tanya nói với Uger: tự xưng 'tôi', giữ cách nói giảm nhẹ 'tán gẫu đôi chút về tình hình dạo này thôi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000065"
    choices:
      - "Theo DEC-P01-001: dùng 'nó' trong câu trần thuật ('cái cớ của nó'), dùng 'mình' trong câu tự vấn nội tâm của Tanya ('Tanya bất giác tự hỏi liệu có phải mình nên nói là'); theo DEC-P01-002: giữ nhấn mạnh Markdown '*ôn chuyện cũ*' đúng phạm vi cụm in nghiêng trong nguồn; quy chiếu Uger bằng 'Anh ấy - anh ấy'."
  - segment_id: "YS-LN06/Text/part0021.html/p000066"
    choices:
      - "Thoại Tanya giới thiệu Weiss với Uger: tự xưng 'Tôi - tôi', gọi chung Uger và Weiss là 'hai người', giữ 'thuộc cấp của tôi, Thiếu tá Weiss'."
  - segment_id: "YS-LN06/Text/part0021.html/p000067"
    choices:
      - "Trần thuật: giữ tên 'Weiss' (quy chiếu là 'anh ta'), 'Uger', 'Tanya'; thoại Uger hỏi Tanya: gọi Tanya là 'Cô - cô' và quy chiếu Weiss (sĩ quan cấp dưới trẻ hơn) là 'cậu ta'."
  - segment_id: "YS-LN06/Text/part0021.html/p000068"
    choices:
      - "Thoại Tanya đáp Uger: tự xưng 'tôi', gọi Uger là 'Trung tá', giữ 'quân cảnh hoặc cảnh sát trị an' và câu hỏi phản vấn giả định 'Chẳng phải Trung tá cũng sẽ lo lắng nếu con gái mình ra ngoài một mình vào giờ này sao?'."
  - segment_id: "YS-LN06/Text/part0021.html/p000069"
    choices:
      - "Thoại Uger đáp Tanya: xưng 'Tôi - cô', giữ thế lưỡng phân 'đang nói thật hay chỉ mượn đó làm cái cớ tiện lợi cho mục đích của mình' và sự nhượng bộ 'nhưng thôi cứ chiều theo ý cô vậy'."
  - segment_id: "YS-LN06/Text/part0021.html/p000070"
    choices:
      - "Nhận định của Tanya về Uger: quy chiếu Uger là 'anh ấy', giữ phủ định 'không phản đối việc chia sẻ chuyện cơ mật'."
  - segment_id: "YS-LN06/Text/part0021.html/p000071"
    choices:
      - "Trần thuật: giữ chi tiết 'Cà phê thật được rót đầy ắp vào các tách' và cử chỉ của 'Uger'."
  - segment_id: "YS-LN06/Text/part0021.html/p000072"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya, 'anh ấy' cho Uger; thoại Uger nói với Tanya: gọi 'Trung tá von Degurechaff', xưng 'cô - tôi' và đề nghị 'cứ đi thẳng vào vấn đề giúp tôi đi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000073"
    choices:
      - "Thoại Tanya hỏi lại khớp với cụm từ ở p000072: '“Đi thẳng vào vấn đề sao?”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000074"
    choices:
      - "Thoại Uger nói với Tanya: xưng 'Tôi - cô', ngôi gộp 'chúng ta', giữ phủ định 'vẫn chưa quên' và thuật ngữ 'trường đại học quân sự'; trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya, 'anh ấy' cho Uger, giữ phủ định 'chẳng cảm nhận được chút căng thẳng nào'."
  - segment_id: "YS-LN06/Text/part0021.html/p000075"
    choices:
      - "Trần thuật quan sát của Tanya về Uger: quy chiếu Uger là 'anh ấy', giữ các chi tiết ngoại hình - giọng nói và hệ quả 'khiến người ta khó lòng đoán được tuổi thật của anh ấy'."
  - segment_id: "YS-LN06/Text/part0021.html/p000076"
    choices:
      - "Nhận định kết đoạn: giữ quan hệ nguyên nhân và tình thái phủ định 'nhưng tình trạng thiếu ngủ có lẽ cũng chẳng giúp ích được gì'."
