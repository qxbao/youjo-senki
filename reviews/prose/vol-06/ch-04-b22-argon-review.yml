  - segment_id: "YS-LN06/Text/part0021.html/p000227"
    choices:
      - "Phân tích chiến lược: giữ 'Bộ Tổng tham mưu', tên riêng 'Hannibal' và câu điều kiện phủ định 'Nếu Bộ Tổng tham mưu không thể tận dụng thỏa đáng các chiến thắng quân sự của mình, họ sẽ có kết cục giống như Hannibal'."
