locked_choices:
  - segment_id: "YS-LN06/Text/part0021.html/p000210"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng đại từ 'nó' cho Tanya ('Vì thế, nó tuyên bố'); trong thoại với Uger xưng 'Tôi - anh', giữ tên 'Đế quốc', 'Tướng von Zettour', ẩn dụ 'Cỗ máy bạo lực chính xác của Đế quốc đang mục ruỗng dần' và mệnh đề Clausewitz 'Chuyện quân sự suy cho cùng chỉ là sự tiếp nối của chính trị. Chúng đòi hỏi một giải pháp chính trị'."
  - segment_id: "YS-LN06/Text/part0021.html/p000211"
    choices:
      - "Thoại Uger đáp Tanya: tự xưng 'Tôi', quy chiếu Tướng von Zettour bằng 'ngài ấy' ('“Được thôi. Tôi sẽ nói chuyện với ngài ấy.”')."
  - segment_id: "YS-LN06/Text/part0021.html/p000212"
    choices:
      - "Trần thuật và thoại ngắn: giữ tên 'Tanya', 'Uger' và sự chuyển giọng 'nhưng Uger lại tiếp lời bằng một giọng trầm xuống'."
  - segment_id: "YS-LN06/Text/part0021.html/p000213"
    choices:
      - "Thoại Uger dặn trước Tanya: tự xưng 'tôi', giữ mệnh lệnh phủ định 'Đừng kỳ vọng nhiều'."
  - segment_id: "YS-LN06/Text/part0021.html/p000214"
    choices:
      - "Thoại Tanya hỏi lại: tự xưng 'Tôi', giữ câu hỏi '“Tôi có thể hỏi tại sao không?”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000215"
    choices:
      - "Thoại Uger giải thích: tự xưng 'tôi', giữ phủ định khả năng 'Sẽ không thể nào hành động ngay lập tức được đâu' và câu tự đính chính 'tôi không thể khiến họ hành động được'."
  - segment_id: "YS-LN06/Text/part0021.html/p000216"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya, 'anh ấy' cho Uger, giữ tên 'Zettour' và quan hệ nhượng bộ phủ định 'Ngay cả khi Zettour ghi nhận lời đề xuất ấy, điều đó cũng không có nghĩa là nó sẽ đạt được màn chuyển hướng quyết liệt như mình mong muốn'."
  - segment_id: "YS-LN06/Text/part0021.html/p000217"
    choices:
      - "Thoại Tanya hỏi thẳng Uger: gọi 'Trung tá Uger', xưng 'tôi - anh', giữ ba câu hỏi liên tiếp về việc trì hoãn, 'phá hoại ngầm' và 'kẻ nổi loạn bên trong tổ chức'."
  - segment_id: "YS-LN06/Text/part0021.html/p000218"
    choices:
      - "Thoại Weiss can ngăn Tanya: giữ nét lắp bắp và cấp bậc '“Tr-Trung tá von Degurechaff!”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000219"
    choices:
      - "Thoại Uger trấn an: tự xưng 'tôi', giữ '“Không sao đâu… Thật ra, vừa rồi tôi mới chợt nhận ra…”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000220"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tên 'Weiss', 'Tanya', 'Uger', dùng 'nó' cho Tanya và 'anh ta' cho Weiss."
  - segment_id: "YS-LN06/Text/part0021.html/p000221"
    choices:
      - "Thoại Uger và trần thuật xen: xưng 'tôi' và ngôi gộp 'chúng ta', quy chiếu Uger bằng 'Anh ấy' ở câu trần thuật; giữ 'Bộ Tổng tham mưu', 'Lục quân Đế quốc', 'Đế quốc', thuật ngữ 'phòng ngự cơ động', các phủ định ('chưa bao giờ hình dung', 'chỉ được thiết kế với mục tiêu phòng ngự cơ động ở gần biên giới mà thôi', 'thậm chí còn chẳng có sẵn một kế hoạch nào') và quan hệ nhân quả 'vì không thể khắc phục được chuyện đó, nên chúng ta chỉ đang đối phó một cách chắp vá mà thôi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000222"
    choices:
      - "Thoại Tanya hỏi lại Uger: gọi 'anh', dùng ngôi gộp 'chúng ta', giữ cấu trúc hạn định 'tránh được cảnh sụp đổ hoàn toàn nhờ vào sự nỗ lực hết sức của các cá nhân ngoài thực địa'."
  - segment_id: "YS-LN06/Text/part0021.html/p000223"
    choices:
      - "Thoại Uger và trần thuật tiếp nối: tự xưng 'tôi', quy chiếu Uger bằng 'Anh ấy - anh ấy', dùng đại từ khái quát 'người ta' trong thoại và 'bạn' ở câu trần thuật cuối; giữ 'Bộ Tổng tham mưu' và phủ định so sánh 'Chẳng còn hình ảnh nào có thể giúp bạn hiểu rõ hơn mức độ trầm trọng của tình cảnh mà Bộ Tổng tham mưu đang phải đối mặt'."
  - segment_id: "YS-LN06/Text/part0021.html/p000224"
    choices:
      - "Trần thuật góc nhìn Tanya: giữ tên 'Tanya', 'Lục quân Đế quốc', 'văn hóa tổ chức' và nhận định 'nhiễm phải cái thói xấu là việc đến đâu mới xử lý đến đó'."
  - segment_id: "YS-LN06/Text/part0021.html/p000225"
    choices:
