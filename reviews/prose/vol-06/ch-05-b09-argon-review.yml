      - "Ẩn dụ & phủ định: giữ cụm ẩn dụ 'cỗ máy bạo lực chính xác của Đế quốc' ('the Empire’s precision instrument of violence') và phủ định 'cũng không thể vận hành hoàn hảo mãi được'."
  - segment_id: "YS-LN06/Text/part0023.html/p000308"
    choices:
      - "Nhấn mạnh Markdown & tình thái: chỉ bọc '*Và thế là*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ tình thái 'có lẽ phải diễn tả như vậy…'."
  - segment_id: "YS-LN06/Text/part0023.html/p000309"
    choices:
      - "Nghĩa & sắc thái: giữ sắc thái đánh giá 'Cảnh tượng đáng hổ thẹn' ('The shameful affair'), 'trung tâm đầu não của quân đội' ('the core of the army') và 'một số sĩ quan tinh tường phải lo âu từ tận đáy lòng'."
  - segment_id: "YS-LN06/Text/part0023.html/p000310"
    choices:
      - "Tên riêng, quân hàm & đơn vị: 'Lieutenant Colonel Tanya von Degurechaff' -> 'Trung tá Tanya von Degurechaff'; 'Salamander Kampfgruppe' -> 'Kampfgruppe Salamander'; 'outskirts of the imperial capital' -> 'ngoại ô thủ đô Đế quốc'; 'quick response' -> 'phản ứng nhanh'."
  - segment_id: "YS-LN06/Text/part0023.html/p000311"
    choices:
      - "Tên riêng, phủ định & thuật ngữ: giữ tên riêng 'Tanya'; 'high command' -> 'bộ tư lệnh tối cao'; giữ mệnh đề định ngữ phủ định 'mấy gã ở bộ tư lệnh tối cao không nhìn thấu được mớ rắc rối phức tạp ấy'."
  - segment_id: "YS-LN06/Text/part0023.html/p000312"
    choices:
      - "Đại từ trần thuật: quy chiếu Tanya trong trần thuật bằng 'nó' tuân thủ nghiêm ngặt DEC-P01-001."
  - segment_id: "YS-LN06/Text/part0023.html/p000313"
    choices:
      - "Thoại, tình thái & đại từ: giữ dấu ba chấm đầu câu, tình thái có thể 'Có khả năng' ('There’s a chance') và phân biệt đại từ 'chúng' (địch) với 'chúng ta' (phe Đế quốc)."
  - segment_id: "YS-LN06/Text/part0023.html/p000314"
    choices:
      - "Thoại câu hỏi, xưng hô & thuật ngữ: sĩ quan phụ tá gọi Tanya là 'Trung tá' kèm kính ngữ 'ạ'; giữ câu hỏi xác nhận '“Ý Trung tá là chúng xâm nhập bằng tàu ngầm ạ?”'."
  - segment_id: "YS-LN06/Text/part0023.html/p000315"
    choices:
      - "Đại từ trần thuật/thoại, tình thái & thuật ngữ: trần thuật quy chiếu Tanya bằng 'nó / mình' theo DEC-P01-001; trong thoại Tanya xưng 'Tôi – chúng ta' và đáp 'Ừ'; 'adjutant' -> 'viên sĩ quan phụ tá'; 'Federation / Federation Navy' -> 'Liên bang / Hải quân Liên bang'; giữ tình thái phỏng đoán 'Tôi cho là...' và 'chắc cũng xoay xở vận chuyển được...'."
  - segment_id: "YS-LN06/Text/part0023.html/p000316"
    choices:
      - "Thuật ngữ hải quân, phủ định & ẩn dụ: 'Imperial Navy' -> 'Hải quân Đế quốc'; 'antisub capabilities' -> 'năng lực chống ngầm'; 'High Seas Fleet' -> 'Hạm đội Biển khơi'; 'destroyers' -> 'khu trục hạm'; 'escorts' -> 'tàu hộ tống'; giữ hai phủ định ('về cơ bản không có năng lực chống ngầm', 'chẳng có lý do gì để bên hải quân chịu nhả những đứa con cưng quý giá của họ ra cả')."
  - segment_id: "YS-LN06/Text/part0023.html/p000317"
    choices:
      - "Địa danh, đại từ & thành ngữ: 'the mainland' -> 'bản thổ'; giữ địa danh 'Norden', đại từ 'họ' (Hải quân Đế quốc) và cách diễn đạt 'khiến họ tối mắt tối mũi rồi' ('had their hands full')."
