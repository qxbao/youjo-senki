  - segment_id: "YS-LN06/Text/part0013.html/p000249"
    choices:
      - "Thuật ngữ pháp lý quân sự & phủ định: giữ 'ở nước ta', 'các thành phần tham chiến không chính quy' ('irregular combatants'), mệnh đề điều kiện phủ định 'khi họ không đủ điều kiện hưởng quy chế bên tham chiến hợp pháp' ('belligerents') và hình phạt 'xử bắn' ('death by firing squad') cùng dấu chấm lửng cuối câu; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000250"
    choices:
      - "Đại từ & câu hỏi cảm thán: trong thoại Drake gọi Sue là 'Cô' và tù binh là 'họ', trong trần thuật quy chiếu Drake bằng 'Ông'; giữ câu hỏi cảm thán và quan hệ nhượng bộ 'bất chấp cơn đau đầu'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000251"
    choices:
      - "Hình ảnh so sánh: giữ đúng nghĩa so sánh mức độ 'Chuyện này đã tiệm cận mức độ của một đứa trẻ kén ăn mất rồi.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000252"
    choices:
      - "Nhấn mạnh Markdown, tình thái quá khứ & cấp bậc: giữ tình thái 'lẽ ra phải là điều không thể tưởng tượng nổi'; bọc chính xác hai cụm '*Ấy thế mà*' và '*lại là một trung úy ư?!*' bằng dấu sao, để cụm 'thứ này' ở giữa bằng chữ thường khớp tuyệt đối với hai thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0013.html/p000253"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu '*Của Lục quân Khối Thịnh vượng chung vinh quang ư?!*' bằng dấu sao khớp với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0013.html/p000254"
    choices:
      - "Giọng thoại lắp bắp & đại từ: giữ nét lắp bắp 'Đ-đang là Giáng sinh mà ạ', Mary Sue xưng 'tôi' và quy chiếu tù binh bằng 'họ' kèm dấu chấm lửng cuối câu; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000255"
    choices:
      - "Quan hệ tương phản & mức độ: quy chiếu 'Drake' bằng 'ông / mình', giữ quan hệ tương phản 'là một người lính dày dạn kinh nghiệm, nhưng câu trả lời này vẫn khiến ông hoàn toàn sững sờ không kịp trở tay' và mức độ 'ngớ ngẩn đến mức... chìm vào trạng thái đờ đẫn'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000256"
    choices:
      - "Nhấn mạnh Markdown & đại từ nội tâm: bọc toàn bộ câu độc thoại nội tâm '*Mình nhận được tin báo—ngay giữa bữa tiệc Giáng sinh—rằng số tù binh của chúng ta đã bị giao cho Liên bang!*' bằng dấu sao khớp với thẻ em trong XHTML theo DEC-P01-002; giữ tự xưng 'Mình' và 'chúng ta'."
  - segment_id: "YS-LN06/Text/part0013.html/p000257"
    choices:
      - "Nhấn mạnh Markdown, tên gọi & phủ định: bọc toàn bộ câu cảm thán nội tâm '*Ông già Noel sẽ chẳng bao giờ làm ra chuyện nhẫn tâm đến thế!*' bằng dấu sao khớp với thẻ em trong XHTML theo DEC-P01-002; giữ tên gọi 'Ông già Noel' và phủ định tuyệt đối 'chẳng bao giờ'."
  - segment_id: "YS-LN06/Text/part0013.html/p000258"
    choices:
      - "Đại từ & phủ định trong thoại: Drake xưng 'Tôi', giữ câu phủ định dứt khoát 'Tôi không muốn nghe.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000259"
    choices:
      - "Cấp bậc, tên riêng & phủ định: giữ 'Trung úy Mary Sue', tên riêng 'Drake' và phủ định 'dường như chẳng mảy may ý thức được mình vừa làm ra chuyện tàn nhẫn đến nhường nào'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000260"
    choices:
      - "Xưng hô & thuật ngữ trong thoại: Drake gọi Mary Sue là 'Cô' và khẳng định 'Cô là một người lính của Khối Thịnh vượng chung đấy!'; không có chữ nghiêng."
