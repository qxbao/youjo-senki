    issue: "Bản dịch đang dịch cấu trúc phủ định kép (litotes 'might not fail to be') thành 'biết đâu lại chẳng thể trở thành bước đi đầu tiên hướng tới hòa bình'. Trong tiếng Việt, 'chẳng thể trở thành' mang nghĩa phủ định đơn ('không thể trở thành'), làm đảo ngược sắc thái khẳng định dè dặt của câu và làm mờ lý do vì sao ngay ở p000350 Rudersdorf phàn nàn rằng cách nói của Zettour quá vòng vo."
    evidence: "Đối chiếu cụm vị ngữ phủ định kép trong p000349 và phản ứng của Rudersdorf ở p000350."
    recommendation: "Sửa thành cấu trúc phủ định kép giữ đúng nghĩa và độ vòng vo, chẳng hạn: '“Vậy nên đề xuất của Gassman bên Lục quân Hoàng gia Ildoa… thoạt nhìn, biết đâu cũng không phải là không thể trở thành bước đi đầu tiên hướng tới hòa bình.”' hoặc '“…thoạt nhìn, chưa hẳn đã không thể trở thành bước đi đầu tiên hướng tới hòa bình.”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000371"
    severity: "minor"
    category: "tình thái / mức độ chắc chắn"
    issue: "Bản dịch dùng 'hoàn toàn có thể giả định rằng họ đủ khả năng...' làm tăng mức độ chắc chắn so với hai lớp tình thái dè dặt trong nguồn ('probably all right to assume' và 'might be possible')."
    evidence: "Đối chiếu các từ tình thái ở p000371 theo quy tắc giữ mức độ chắc chắn của giả định trong canon/style-guide.md."
    recommendation: "Hạ nhẹ độ khẳng định để sát tình thái gốc, chẳng hạn: 'Điều đó có nghĩa là có lẽ cứ cho rằng họ có khả năng dạy cho đám anh hùng tự phong đang ra vẻ là những kẻ quan sát khôn ngoan kia một bài học nhớ đời thì cũng chẳng sao.' hoặc 'Điều đó có nghĩa là có lẽ hoàn toàn có thể giả định rằng việc dạy cho đám anh hùng tự phong đang ra vẻ là những kẻ quan sát khôn ngoan kia một bài học nhớ đời là điều khả thi.'."
