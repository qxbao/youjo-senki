      - "Nhấn mạnh Markdown, điểm nhìn & câu bỏ lửng: chỉ bọc '*đúng thế*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ đúng đối tượng 'nơi mà ông ta đang đắn đo xem có nên giáng đòn hay không chính là…'."
  - segment_id: "YS-LN06/Text/part0027.html/p000368"
    choices:
      - "Xưng hô & câu hỏi: Zettour gọi Rudersdorf là 'Ông'; giữ câu hỏi '“Ông đã vạch sẵn kế hoạch cho việc đó rồi ư?”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000369"
    choices:
      - "Thuật ngữ, phủ định kép & đại từ: Rudersdorf xưng 'Chúng tôi'; 'emergency response plan' -> 'kế hoạch ứng phó khẩn cấp'; 'mobile defense' -> 'phòng ngự cơ động'; giữ phủ định kép 'Chuyện đó không phải là bất khả thi đâu.' và phủ định cuối đoạn 'Ông ta không phải hạng người thích phô trương khoác lác.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000370"
    choices:
      - "Điều kiện & tình thái: giữ 'Nếu ông ta đã nói là làm được, thì có lẽ là làm được thật.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000371"
    choices:
      - "Nghĩa & danh xưng miệt thị (lưu ý tinh chỉnh tình thái theo finding minor): giữ 'đám anh hùng tự phong đang ra vẻ là những kẻ quan sát khôn ngoan kia' và 'một bài học nhớ đời'."
  - segment_id: "YS-LN06/Text/part0027.html/p000372"
    choices:
      - "Nhấn mạnh Markdown, xưng hô & câu hỏi: chỉ bọc '*Thế nhưng*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; Zettour hỏi Rudersdorf bằng 'Ông' ('“Ông muốn tiến xa hơn cả mức phòng thủ biên giới sao?”')."
  - segment_id: "YS-LN06/Text/part0027.html/p000373"
    choices:
      - "Mệnh lệnh, thuật ngữ, phủ định & ẩn dụ: giữ 'Đúng vậy. Hãy nhớ rằng...', 'nhu cầu tất yếu về mặt chiến thuật', phủ định 'Tôi không muốn cứ tiếp tục phơi bày...' và ẩn dụ 'vùng hạ bộ hiểm yếu của chúng ta trước mặt một quốc gia thù địch'."
