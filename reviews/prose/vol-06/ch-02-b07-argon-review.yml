      - "Điểm nhìn & đại từ: từ góc nhìn thù địch của Drake, dịch 'She—they—' thành 'Ả ta—bọn chúng—' giữ nguyên cặp dấu gạch ngang tự sửa lời."
  - segment_id: "YS-LN06/Text/part0011.html/p000286"
    choices:
      - "Thuật ngữ & đại từ: 'The Devil of the Rhine' -> 'Ác quỷ sông Rhine'; giữ đại từ 'ả' nhất quán với p000285."
  - segment_id: "YS-LN06/Text/part0011.html/p000287"
    choices:
      - "Thoại & quân hàm: giữ tiếng gọi lắp bắp '“T-Trung tá Drake!”' đúng cấp bậc Trung tá của Drake."
  - segment_id: "YS-LN06/Text/part0011.html/p000288"
    choices:
      - "Thoại & đại từ: Drake đáp ngắn gọn '“Tôi biết rồi!”'."
  - segment_id: "YS-LN06/Text/part0011.html/p000289"
    choices:
      - "Nhấn mạnh Markdown, điểm nhìn & quân hàm: chỉ bọc '*Nguy rồi.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; phần trần thuật sau để chữ thường; dịch sát 'Lieutenant Colonel Mikel' -> 'Trung tá Mikel' theo đúng nguồn của đoạn."
  - segment_id: "YS-LN06/Text/part0011.html/p000290"
    choices:
      - "Thoại, quân hàm & thuật ngữ: gọi 'Colonel Mikel' -> 'Trung tá Mikel' khớp với quân hàm ở p000289; 'battalion of Named' -> 'tiểu đoàn Pháp sư Định danh'."
  - segment_id: "YS-LN06/Text/part0011.html/p000291"
    choices:
      - "Thoại & đại từ: phía Mikel xưng 'Chúng tôi' và hỏi dồn 'Tình hình thế nào rồi?!'."
  - segment_id: "YS-LN06/Text/part0011.html/p000292"
    choices:
      - "Thoại, đại từ & thuật ngữ: dùng 'chúng ta / ta' cho phe Liên bang – đa quốc gia và 'bọn chúng' cho quân Đế quốc; giữ dấu gạch ngang giải thích mức chênh lệch thực lực; 'delaying action' -> 'đánh trì hoãn'."
  - segment_id: "YS-LN06/Text/part0011.html/p000293"
    choices:
      - "Thoại, tình thái & thuật ngữ: giữ tiếng chửi thề mở đầu bằng dấu chấm lửng '“…Chết tiệt! Đây là kịch bản tồi tệ nhất!”'; phần trần thuật giữ tên 'Mikel', tình thái 'có lẽ' và 'the imperials' -> 'quân Đế quốc'."
  - segment_id: "YS-LN06/Text/part0011.html/p000294"
    choices:
      - "Thuật ngữ & tình thái: 'Federation General Staff' -> 'Bộ Tổng tham mưu Liên bang'; 'Imperial Army' -> 'Lục quân Đế quốc'; 'defensive position' -> 'trận địa phòng ngự'; giữ mức độ 'khá muộn' và 'gần như đã cam đoan'."
  - segment_id: "YS-LN06/Text/part0011.html/p000295"
    choices:
      - "Đối lập: giữ câu chuyển ý đối lập 'Nhưng thực tế lại chẳng chiều lòng người như vậy.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000296"
    choices:
      - "Thuật ngữ & mức độ: 'Imperial Army' -> 'Lục quân Đế quốc'; giữ mức độ nhấn mạnh 'quá đỗi nhanh chóng'."
  - segment_id: "YS-LN06/Text/part0011.html/p000297"
    choices:
      - "Thoại câu hỏi: giữ câu hỏi của Drake '“Chúng ta đã chiếm được ngôi làng chưa?”'."
  - segment_id: "YS-LN06/Text/part0011.html/p000298"
    choices:
      - "Thoại & phủ định: giữ dấu chấm lửng mở đầu, đại từ 'Chúng tôi' và hai câu phủ định ('không mấy khả quan', 'vẫn chưa chọc thủng được tuyến phòng ngự')."
  - segment_id: "YS-LN06/Text/part0011.html/p000299"
    choices:
      - "Nhấn mạnh Markdown, thoại bỏ lửng & phủ định: giữ câu thoại bỏ lửng bằng dấu gạch ngang 'Sao lại có thể—!'; câu nội tâm sau tách đúng hai cụm in nghiêng '*Các đơn vị bộ binh và pháp sư* hợp sức lại *mà thậm chí không chiếm nổi một ngôi làng sao?!*' khớp chính xác với hai thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000300"
    choices:
      - "Thoại & thuật ngữ: 'stronghold' -> 'cứ điểm'; 'secure perimeter' -> 'vành đai phòng ngự kiên cố'."
  - segment_id: "YS-LN06/Text/part0011.html/p000301"
    choices:
      - "Thoại & phủ định: giữ cả hai câu phủ định bác bỏ ('Không thể nào như thế được.', 'Chúng ta đâu có đang tấn công một căn cứ quân sự nào chứ!')."
  - segment_id: "YS-LN06/Text/part0011.html/p000302"
    choices:
      - "Phủ định: giữ nét nghĩa khó tin và phủ định 'chẳng hề báo trước'."
  - segment_id: "YS-LN06/Text/part0011.html/p000303"
    choices:
      - "Nhấn mạnh Markdown, điểm nhìn, đại từ & phủ định: chỉ bọc từ '*làng*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ cấu trúc đối lập phủ định 'khu dân cư, chứ không phải một cứ điểm được gia cố để chiến đấu' và câu phủ định 'Ông không tài nào hiểu nổi...' (quy chiếu Drake bằng 'Ông')."
  - segment_id: "YS-LN06/Text/part0011.html/p000304"
    choices:
      - "Thoại câu hỏi phủ định & xưng hô: Drake hỏi bằng đại từ 'Các anh' với cấu trúc phủ định nhấn mạnh 'không thể đột phá ngay cả khi có hỏa lực của pháp sư sao?'."
  - segment_id: "YS-LN06/Text/part0011.html/p000305"
    choices:
      - "Thoại, phủ định, tình thái quá khứ & thuật ngữ: dùng 'Chúng tôi' khi báo cáo kết quả thử nghiệm và 'chúng ta' khi tiếc nuối về trang bị chung; giữ phủ định 'Ngay cả... cũng không ăn thua' và giả định tiếc nuối quá khứ 'nhưng… lẽ ra chúng ta phải mang theo pháo hạng nặng'; 'penetration formulas' -> 'thuật thức xuyên phá'; 'heavy artillery' -> 'pháo hạng nặng'."
  - segment_id: "YS-LN06/Text/part0011.html/p000306"
    choices:
      - "Nhấn mạnh Markdown & câu hỏi nội tâm: câu trần thuật đầu để chữ thường; bọc toàn bộ câu hỏi nội tâm thứ hai '*Chúng ta chọn đại một ngôi làng ngẫu nhiên, thế mà tình cờ nơi đó lại có hệ thống phòng thủ kiên cố đến mức cần phải có pháo hạng nặng mới chiếm được ư?*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000307"
    choices:
      - "Thoại & phủ định: giữ dấu chấm lửng mở đầu, đại từ 'Tôi' và phủ định 'chưa bao giờ ngờ rằng họ lại chuẩn bị kỹ lưỡng đến mức này'."
  - segment_id: "YS-LN06/Text/part0011.html/p000308"
    choices:
      - "Đại từ, giới hạn & thuật ngữ: quy chiếu Drake bằng 'Ông', giữ từ giới hạn 'chỉ biết đến'; 'marine mage' -> 'pháp sư hải quân đánh bộ'; 'counterinsurgency battles' -> 'các trận đánh chống nổi dậy'."
  - segment_id: "YS-LN06/Text/part0011.html/p000309"
    choices:
      - "Điểm nhìn, đại từ, phủ định & thuật ngữ: trần thuật quy chiếu Drake bằng 'ông'; trong thoại Drake xưng 'Tôi - Anh' với Mikel, giữ phủ định 'Tôi không thể tin được…' và câu hỏi chất vấn; 'fieldworks' -> 'công sự dã chiến'."
  - segment_id: "YS-LN06/Text/part0011.html/p000310"
    choices:
      - "Giả định trái thực tế, đại từ & thuật ngữ: giữ cấu trúc điều kiện giả định trái thực tế 'Sẽ còn thực tế hơn nếu có ai đó nói với ông rằng...'; 'mole' -> 'kẻ nội gián'; 'upper echelons' -> 'giới chóp bu'."
