  - segment_id: "YS-LN06/Text/part0023.html/p000194"
    choices:
      - "Nhấn mạnh Markdown, đối lập & đại từ: chỉ bọc '*Nhưng*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; quy chiếu Drake bằng 'ông' và giữ mức độ giảm nhẹ 'không khỏi cảm thấy hơi lo lắng'."
  - segment_id: "YS-LN06/Text/part0023.html/p000195"
    choices:
