      - "Thoại mệnh lệnh, quân hàm, xưng hô & thuật ngữ: quy chiếu Drake bằng 'Ông' trong trần thuật; trong thoại dùng 'chúng ta / chúng tôi', gọi Mary là 'Trung úy Sue' và 'cô'; 'assault formation' -> 'đội hình xung kích'; 'Osfjord' -> 'Osfjord'; 'take point' -> 'đi mở đường'; 'fatherland' -> 'tổ quốc'."
  - segment_id: "YS-LN06/Text/part0023.html/p000191"
    choices:
