  - segment_id: "YS-LN06/Text/part0023.html/p000230"
    choices:
      - "Đại từ, đối lập & thuật ngữ: quy chiếu hai đơn vị/chỉ huy bằng 'Họ / họ'; 'joint missions' -> 'nhiệm vụ liên hợp'; giữ dấu ba chấm và ý giới hạn 'chỉ tình cờ chiến đấu cạnh nhau trên cùng một chiến trường mà thôi'."
  - segment_id: "YS-LN06/Text/part0023.html/p000231"
    choices:
      - "Đại từ, phủ định & thuật ngữ: quy chiếu Drake bằng 'ông'; 'partisan units' -> 'các đơn vị du kích'; giữ phủ định 'chẳng biết phải trông đợi gì'."
  - segment_id: "YS-LN06/Text/part0023.html/p000232"
    choices:
      - "Tăng tiến & thuật ngữ: 'joint operation' -> 'chiến dịch tác chiến liên hợp'; 'mage units' -> 'các đơn vị pháp sư'; 'local partisan ground troops' -> 'lực lượng mặt đất của quân du kích địa phương'; giữ cấu trúc tăng tiến 'không chỉ giữa... mà còn với cả...'."
  - segment_id: "YS-LN06/Text/part0023.html/p000233"
    choices:
      - "Thoại độc thoại, thành ngữ & giả định trái thực tế: dịch câu tục ngữ sang thành ngữ tương đương 'cứ tận nhân lực rồi nghe thiên mệnh'; trong câu điều kiện giả định trái thực tế ở hiện tại, Drake tự xưng 'ta' ('Nếu đây là một ván bài poker, hẳn tầm này ta đã úp bài bỏ cuộc rồi!')."
  - segment_id: "YS-LN06/Text/part0023.html/p000234"
    choices:
      - "Đại từ, phủ định, điển tích & câu hỏi đuôi: quy chiếu Drake bằng 'Ông'; giữ phủ định 'không muốn ngã nhào xuống đất vì lầm tưởng...', viết hoa 'Nữ thần May mắn' và 'Số phận'; giữ điển tích đôi cánh sáp Icarus và câu hỏi đuôi tu từ 'chẳng phải là một kế hoạch nực cười lắm sao?'."
  - segment_id: "YS-LN06/Text/part0023.html/p000235"
    choices:
      - "Tên riêng, so sánh ngang bằng & phủ định kép: giữ tên riêng 'Mikel', so sánh 'đôi mắt cũng biết nói chẳng kém gì cái miệng' và khẳng định qua phủ định kép 'quả không sai'."
  - segment_id: "YS-LN06/Text/part0023.html/p000236"
    choices:
      - "Thoại & xưng hô: Mikel xưng 'Tôi' khi báo tin cho Drake ('“Tôi có tin xấu đây.”')."
  - segment_id: "YS-LN06/Text/part0023.html/p000237"
    choices:
      - "Thoại câu hỏi: giữ câu hỏi ngắn gọn '“Chuyện gì thế?”' của Drake."
  - segment_id: "YS-LN06/Text/part0023.html/p000238"
    choices:
      - "Thoại, tình thái trái thực tế, phủ định & thuật ngữ: 'sortie point three' -> 'điểm xuất kích số ba'; 'warning line' -> 'tuyến cảnh giới'; giữ nét nghĩa 'lẽ ra phải có mặt... đã bị... phát hiện và không tới được' cùng dấu ba chấm ngập ngừng ở câu cuối."
