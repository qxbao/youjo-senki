findings:
  - segment_id: "YS-LN06/Text/part0013.html/p000020"
    severity: "minor"
    category: "idiom_and_nuance"
    issue: "Cấu trúc 'sự thuận lợi về mặt chính trị mà chiến thắng này mang lại là điều không hề nói quá' hơi trúc trắc về mặt cú pháp tiếng Việt vì gán trực tiếp danh từ 'sự thuận lợi' làm chủ ngữ của vị ngữ 'là điều không hề nói quá'."
    basis: "Cụm vị ngữ phủ định ở cuối câu nguồn mang nghĩa mức độ thuận lợi về chính trị của chiến thắng này lớn đến mức dù có đề cao hay nhấn mạnh bao nhiêu cũng không ngoa/không quá lời."
    recommendation: "Có thể chỉnh lại cho tự nhiên và sát nghĩa thành ngữ hơn: 'Dẫu vậy, sự thuận lợi về mặt chính trị của chiến thắng này có nhấn mạnh bao nhiêu cũng không quá lời.' hoặc 'Dẫu vậy, không hề quá lời khi nói về sự thuận lợi chính trị mà chiến thắng này mang lại.'"
  - segment_id: "YS-LN06/Text/part0013.html/p000032"
    severity: "minor"
    category: "style_and_nuance"
    issue: "Dịch cụm cuối câu thành 'chuẩn bị sẵn vài cái hố chôn cho chúng' đã thêm từ giải thích 'chôn', làm lộ rõ nghĩa đen của lối nói giảm đầy sát khí trong suy nghĩ của Loria."
    basis: "Nguồn chỉ dùng danh từ chỉ những cái hố một cách hàm súc, lạnh lùng; theo canon/style-guide.md cần giữ đúng sắc thái của bản gốc và không tự thêm từ giải thích."
    recommendation: "Lược từ 'chôn' để giữ nguyên sắc thái nói giảm lạnh lùng của Loria: '...chuẩn bị sẵn vài cái hố cho chúng.'"
