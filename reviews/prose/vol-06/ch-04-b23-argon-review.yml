    issue: "Cấp bậc của von Lergen trong cụm 'Colonel von Lergen' đang được dịch là 'Trung tá von Lergen', chưa khớp với cấp bậc đã thăng trong Tập 6 và làm mờ đối lập cấp bậc ngay trong đoạn."
    rationale: "Theo dữ liệu Tập 6 trong work/run-state/pending-terms-index.yml (mục 'Colonel von Lergen / regimental commander' từ ch-03-b11, thời điểm cuối tháng 1 năm 1927 trước khi đi Ildoa), von Lergen đã được thăng lên Đại tá (Colonel) và nhận chức trung đoàn trưởng. Hơn nữa, ngay ở câu mở đầu đoạn p000268, Uger vừa nhấn mạnh cả anh ta lẫn Tanya đều chỉ là trung tá ('lieutenant colonels' -> 'trung tá') nên khó tác động lên Cục Tác chiến, rồi mới nêu giả định giá như có 'Colonel von Lergen' ở đây thì việc nói chuyện với Cục Tác chiến sẽ dễ dàng hơn. Dịch 'Colonel von Lergen' thành 'Đại tá von Lergen' vừa nhất quán với hệ thống cấp bậc Tập 6 vừa giữ trọn logic đối lập về thẩm quyền giữa trung tá và đại tá trong lời thoại của Uger."
    recommended_fix: "Đổi 'Trung tá von Lergen' thành 'Đại tá von Lergen' tại segment YS-LN06/Text/part0021.html/p000268."

