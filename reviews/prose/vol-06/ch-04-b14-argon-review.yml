findings:
  - segment_id: "YS-LN06/Text/part0019.html/p000483"
    severity: "minor"
    category: "pronouns_and_cohesion"
    issue: "Trong câu thứ hai của thoại Tanya, đại từ 'chúng' vừa dùng để chỉ phía Khối Thịnh vượng chung ('Đám khách sạn nổi đắt đỏ trên biển của chúng') vừa dùng ngay sau đó để chỉ các chiến hạm ('sự tồn tại của chúng', 'bắt chúng làm chút việc'), trong khi chủ thể phía Khối Thịnh vượng chung ở vế sau lại đổi sang 'họ' ('hẳn họ cũng ngứa ngáy')."
    evidence: "Quy chiếu trong cùng một câu có hai đối tượng số nhiều khác nhau (người của Khối Thịnh vượng chung và các khách sạn nổi trên biển); việc dùng chung đại từ 'chúng' rồi đổi sang 'họ' làm giảm tính nhất quán quy chiếu."
    recommendation: "Có thể đổi 'của chúng' ở đầu câu thành 'của họ' (hoặc 'của mấy gã đó') để 'họ' quy chiếu nhất quán về người của Khối Thịnh vượng chung và 'chúng' quy chiếu nhất quán về các khách sạn nổi; không ảnh hưởng nghĩa cốt lõi."
  - segment_id: "YS-LN06/Text/part0019.html/p000508"
    severity: "minor"
    category: "terminology_consistency"
    issue: "Dịch 'wonderful personality' là 'nhân cách tuyệt vời' hơi nghiêng sang bình diện phẩm chất đạo đức thay vì đặc điểm tính cách."
    evidence: "canon/glossary-pending.yml (P01-personality) lưu ý phân biệt đặc điểm tính cách với đánh giá đạo đức, và ở lô liền trước (p000471) từ này đang được dịch là 'tính cách'."
    recommendation: "Có thể cân nhắc dùng 'tính cách tuyệt vời' để đồng bộ với P01-personality và các đoạn lân cận; tuy nhiên trong ngữ cảnh nhận xét ngoại giao ở p000508–p000510 thì 'nhân cách tuyệt vời' không làm sai lệch lập luận."
