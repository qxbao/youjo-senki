      - "Nhấn mạnh Markdown, điểm nhìn, đại từ & phủ định: bọc toàn bộ câu hỏi độc thoại nội tâm '*Giờ thì mình nên hiểu thái độ không đồng tình mà cũng chẳng phản đối đó thế nào đây?*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; nội tâm tự quy chiếu của Gassman dùng 'mình' và giữ phủ định kép 'không đồng tình mà cũng chẳng phản đối'."
  - segment_id: "YS-LN06/Text/part0015.html/p000043"
    choices:
      - "Nhấn mạnh Markdown & đại từ: chỉ bọc từ '*Không*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; câu trần thuật sau để chữ thường và quy chiếu Gassman bằng 'ông'."
  - segment_id: "YS-LN06/Text/part0015.html/p000044"
    choices:
      - "Thoại, quân hàm & đại từ: giữ dấu chấm lửng mở đầu, Gassman gọi 'Đại tá' và dùng đại từ 'chúng ta'."
  - segment_id: "YS-LN06/Text/part0015.html/p000045"
    choices:
      - "Thoại, tình thái & thuật ngữ: Calandro xưng 'Tôi'; 'General Staff' -> 'Bộ Tổng tham mưu'; 'the Empire' -> 'Đế quốc'; giữ tình thái cảnh báo 'có thể sẽ phản ứng dữ dội'."
  - segment_id: "YS-LN06/Text/part0015.html/p000046"
    choices:
      - "Phủ định kép: giữ cấu trúc phủ định kép khẳng định tính hợp lý 'Nỗi lo âu của Calandro không phải là không có cơ sở.'."
  - segment_id: "YS-LN06/Text/part0015.html/p000047"
    choices:
      - "Nhấn mạnh Markdown, tình thái, giả định & thuật ngữ: chỉ bọc cụm '*Giờ thì các người đã đi quá giới hạn rồi đấy*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ tình thái 'rất có khả năng sẽ', câu điều kiện 'nếu họ thua cược' và khả năng 'quân Đế quốc giận dữ rất có thể sẽ sớm tràn qua biên giới nước họ'."
  - segment_id: "YS-LN06/Text/part0015.html/p000048"
    choices:
      - "Phủ định & nhượng bộ điều kiện: giữ phủ định 'Gassman không thể gạt bỏ khả năng đó' và mệnh đề nhượng bộ 'dù xác suất xảy ra chỉ là một phần triệu đi chăng nữa'."
  - segment_id: "YS-LN06/Text/part0015.html/p000049"
    choices:
      - "Đối lập, thoại câu hỏi đuôi & quân hàm: giữ liên từ đối lập 'Thế nhưng', đại từ 'ông' và câu hỏi đuôi có phủ định '“Không có vấn đề gì đâu, phải không Đại tá?”'."
  - segment_id: "YS-LN06/Text/part0015.html/p000050"
    choices:
      - "Thoại bỏ lửng: giữ lời ngập ngừng '“Nhưng…”'."
  - segment_id: "YS-LN06/Text/part0015.html/p000051"
    choices:
      - "Thoại, mức độ chắc chắn & thuật ngữ: Gassman xưng 'Tôi' khẳng định 'chắc chắn'; 'Imperial Army General Staff' -> 'Bộ Tổng tham mưu Lục quân Đế quốc'; 'sneak attack' -> 'đòn tập kích bất ngờ'; giữ nhận định về năng lực và kinh nghiệm thực chiến dồi dào của đối phương."
  - segment_id: "YS-LN06/Text/part0015.html/p000052"
    choices:
      - "Đại từ & phủ định: quy chiếu Gassman bằng 'Ông' và giữ phủ định nhấn mạnh 'không mảy may nghi ngờ điều đó'."
  - segment_id: "YS-LN06/Text/part0015.html/p000053"
    choices:
      - "Đối lập cân xứng: giữ cấu trúc đối lập cân xứng giữa hai thái cực sai lầm ('Mặc định rằng những ý tưởng đã được kiểm chứng qua chiến trận luôn ưu việt hơn là điều nguy hiểm' và 'phủ nhận sạch trơn chúng cũng ngu xuẩn không kém')."
