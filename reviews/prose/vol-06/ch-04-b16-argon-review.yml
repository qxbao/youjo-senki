  - segment_id: "YS-LN06/Text/part0019.html/p000596"
    choices:
      - "Thoại Tanya hỏi lại: giữ dấu nháy đơn quanh '‘Hàng để dành’ ư?'."
  - segment_id: "YS-LN06/Text/part0019.html/p000597"
    choices:
      - "Nhấn mạnh Markdown theo DEC-P01-002: giữ '*Gì thế này?*' đúng phạm vi câu in nghiêng trong nguồn; trần thuật về Tanya theo DEC-P01-001: dùng 'Nó' và phản thân 'mình'."
  - segment_id: "YS-LN06/Text/part0019.html/p000598"
    choices:
      - "Thoại Tanya: giữ câu cảm thán bỏ lửng '…Hửm? Mùi này là…'."
  - segment_id: "YS-LN06/Text/part0019.html/p000599"
    choices:
      - "Thoại người bồi bàn mời Tanya: gọi 'cô' kèm 'ạ', giữ sắc thái khiêm tốn 'Chẳng phải thứ gì cao sang đâu, nhưng xin mời cô dùng một tách ạ'."
  - segment_id: "YS-LN06/Text/part0019.html/p000600"
    choices:
