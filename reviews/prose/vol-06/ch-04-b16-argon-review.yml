  - segment_id: "YS-LN06/Text/part0019.html/p000604"
    choices:
      - "Nội tâm phân tích của Tanya: giữ 'quốc gia thứ ba', 'Ildoa đang tỏ ra hữu ích trong vai trò một quốc gia trung lập, ít nhất là ở khoản để cho hàng xa xỉ đi qua'."
  - segment_id: "YS-LN06/Text/part0019.html/p000605"
    choices:
      - "Thoại Tanya hỏi dí dỏm: giữ tên cơ quan 'Cục Đường sắt' và câu hỏi đuôi 'phải không?'."
  - segment_id: "YS-LN06/Text/part0019.html/p000606"
    choices:
      - "Thoại người bồi bàn đáp khéo: 'Trong phạm vi pháp luật cho phép thôi ạ'."
  - segment_id: "YS-LN06/Text/part0019.html/p000607"
    choices:
      - "Thoại Tanya nói về Uger: gọi 'Trung tá Uger', quy chiếu bằng 'Anh ấy / anh ấy', tự xưng 'tôi'; giữ dấu gạch ngang và phủ định 'cẩn thận không mang về vượt quá mức quy định cho phép'."
  - segment_id: "YS-LN06/Text/part0019.html/p000608"
    choices:
      - "Thoại người bồi bàn: gọi Tanya là 'Cô', quy chiếu Uger là 'ngài ấy' kèm 'ạ'."
  - segment_id: "YS-LN06/Text/part0019.html/p000609"
    choices:
      - "Nhận xét trong nội tâm Tanya: 'Đúng là một cuộc trò chuyện dễ chịu với người bồi bàn đang mỉm cười này'."
  - segment_id: "YS-LN06/Text/part0019.html/p000610"
    choices:
      - "Thoại người bồi bàn chào lui: xưng 'tôi - cô' kèm 'ạ'."
  - segment_id: "YS-LN06/Text/part0019.html/p000611"
    choices:
      - "Câu danh ngữ trong nội tâm Tanya: 'Mùi hương của trí tuệ, văn minh và văn hóa'."
  - segment_id: "YS-LN06/Text/part0019.html/p000612"
    choices:
      - "Nhấn mạnh Markdown theo DEC-P01-002: giữ '*Chính là đây—giờ nghỉ ngơi của một con người văn minh*' đúng phạm vi phần in nghiêng trong nguồn; trần thuật về Tanya theo DEC-P01-001 dùng 'Nó'."
  - segment_id: "YS-LN06/Text/part0019.html/p000613"
    choices:
      - "Thoại thuộc cấp nói với Tanya: tự xưng 'Tôi' kèm 'ạ', giữ vẻ trịnh trọng pha chút láu cá 'Tôi lấy làm vinh dự được thưởng thức phần của mình ạ'."
  - segment_id: "YS-LN06/Text/part0019.html/p000614"
    choices:
      - "Thoại Tanya đáp lại nhóm thuộc cấp: dùng từ cảm thán 'Chậc' và đại từ số nhiều trung tính 'mấy người' (bao quát cả nhóm sĩ quan nam lẫn Serebryakov)."
  - segment_id: "YS-LN06/Text/part0019.html/p000615"
    choices:
      - "Thoại thuộc cấp than thở với Tanya: gọi 'Thưa Trung tá' kèm 'ạ!' ('Thưa Trung tá, thế là bất công quá ạ!')."
  - segment_id: "YS-LN06/Text/part0019.html/p000616"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'Tanya' và 'nó', quy chiếu nhóm thuộc cấp là 'họ / đám người này'; giữ dấu chấm phẩy và nhận xét 'tinh thần của đám người này đúng là lì lợm thật'."
  - segment_id: "YS-LN06/Text/part0019.html/p000617"
    choices:
      - "Nội tâm tự quy chiếu của Tanya theo DEC-P01-001: dùng đại từ 'mình', quy chiếu thuộc cấp là 'họ'; giữ 'Lục quân Đế quốc' và cấu trúc nhượng bộ – đối lập 'Có thể mình không được phép nói ra những suy nghĩ như thế, nhưng thầm nghĩ vậy với vẻ chán ghét là đặc quyền của mình'."
