  - segment_id: "YS-LN06/Text/part0019.html/p000569"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó' và đại từ phản thân 'mình'; giữ tương phản 'chẳng có lựa chọn nào khác nên đành nhấp một ngụm, dù nét mặt vẫn khiến nó trông như phát ốm'."
  - segment_id: "YS-LN06/Text/part0019.html/p000570"
    choices:
      - "Thoại độc thoại của Tanya: giữ nhận xét nhượng bộ 'À thì, vị của nó cũng đỡ hơn một chút…'."
  - segment_id: "YS-LN06/Text/part0019.html/p000571"
    choices:
      - "Nhận định ngắn trong nội tâm: 'Cà phê là một mặt hàng xa xỉ'."
  - segment_id: "YS-LN06/Text/part0019.html/p000572"
    choices:
      - "Trần thuật gián tiếp tự do: giữ tên 'Tanya', phủ định 'cà phê lại không được xem là nhu yếu phẩm' và quan hệ đối lập 'Ấy vậy mà niềm yêu thích cà phê gần như cuồng nhiệt đã trở thành thứ bệnh lý khắp toàn Đế quốc'."
  - segment_id: "YS-LN06/Text/part0019.html/p000573"
    choices:
      - "Nội tâm Tanya: giữ phép so sánh giữa 'Lục quân Đế quốc mà thiếu cà phê' với 'đám người Anh thiếu rượu rum của họ' và phủ định nhấn mạnh 'Còn lâu mới có thể gọi đó là một cuộc sống lành mạnh'."
  - segment_id: "YS-LN06/Text/part0019.html/p000574"
    choices:
      - "Nội tâm Tanya: dịch đại từ khái quát thành 'người ta', giữ hình ảnh ẩn dụ 'chiếc phong vũ biểu cho biết tình trạng của Đế quốc', giả định tương lai 'chẳng mấy chốc người ta sẽ thực sự lấy nước bùn thay cho cà phê mất' và ngôi gộp 'chúng ta không có nhiều lựa chọn'."
  - segment_id: "YS-LN06/Text/part0019.html/p000575"
    choices:
      - "Kết luận ngắn trong nội tâm: 'Phải là hòa bình'."
  - segment_id: "YS-LN06/Text/part0019.html/p000576"
    choices:
      - "Thoại lẩm bẩm bỏ lửng của Tanya: dùng ngôi gộp 'Chúng ta', giữ điệp ngữ và câu hỏi đuôi 'Chúng ta nên làm thế. Chúng ta nên làm thế, phải không? Nhưng mà…'."
  - segment_id: "YS-LN06/Text/part0019.html/p000577"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó'; nhấn mạnh Markdown theo DEC-P01-002: giữ '*giảng hòa*' đúng phạm vi cụm in nghiêng trong nguồn."
  - segment_id: "YS-LN06/Text/part0019.html/p000578"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó'; giữ các phủ định 'không bắt gặp ai có vẻ đang lộ liễu nghe lén', 'Ngay cả khi quân cảnh không nghe lén, nó cũng chẳng có chút hứng thú nào' và cụm 'những người yêu nước có thiện ý'."
  - segment_id: "YS-LN06/Text/part0019.html/p000579"
    choices:
      - "Trần thuật: giữ tên 'Tanya' và so sánh 'dân thường ở hậu phương có xu hướng ủng hộ những quan điểm cực đoan hơn cả binh lính'."
  - segment_id: "YS-LN06/Text/part0019.html/p000580"
    choices:
      - "Nội tâm Tanya: giữ cấu trúc đối xứng 'Không biết thì không biết xấu hổ—có lẽ là đại loại như thế'."
  - segment_id: "YS-LN06/Text/part0019.html/p000581"
    choices:
      - "Nội tâm tự quy chiếu của Tanya theo DEC-P01-001: dùng 'chúng ta' và 'mình'; nhấn mạnh Markdown theo DEC-P01-002: giữ '*Tôi đến giúp các vị đây!*' đúng phạm vi câu in nghiêng trong nguồn; giữ ngoặc kép quanh chữ 'chiến thắng'."
  - segment_id: "YS-LN06/Text/part0019.html/p000582"
    choices:
      - "Nhận định khái quát: giữ cấu trúc phủ định đi kèm điều kiện loại trừ 'chẳng rút ra được bài học gì trừ khi tự mình trải qua chuyện đó'."
  - segment_id: "YS-LN06/Text/part0019.html/p000583"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'Tanya' và 'nó'; giữ cấu trúc phủ định kép song hành 'không phản đối… nhưng nó cũng chẳng thể phủ nhận…'."
  - segment_id: "YS-LN06/Text/part0019.html/p000584"
    choices:
      - "Thoại Tanya: giữ nhận xét 'Trời đất. Hiểu theo nghĩa đó thì hương vị này chính là hiện thực đấy'."
  - segment_id: "YS-LN06/Text/part0019.html/p000585"
    choices:
      - "Nội tâm Tanya: giữ ẩn dụ 'Vị đắng của tách cà phê này là sự thật của Đế quốc' và câu hỏi tu từ về 'các lực lượng tác chiến của quốc gia'."
  - segment_id: "YS-LN06/Text/part0019.html/p000586"
    choices:
      - "Nhấn mạnh Markdown theo DEC-P01-002: giữ '*Đa phần là không rồi*' đúng phạm vi cụm in nghiêng ở đầu câu; trần thuật về Tanya theo DEC-P01-001: dùng 'nó' và phản thân 'mình'."
  - segment_id: "YS-LN06/Text/part0019.html/p000587"
    choices:
