  - segment_id: "YS-LN06/Text/part0019.html/p000593"
    choices:
      - "Thoại Tanya: giữ cách gọi 'Trung tá Uger' và câu cảm thán 'Đúng là trái đất tròn thật'."
  - segment_id: "YS-LN06/Text/part0019.html/p000594"
    choices:
