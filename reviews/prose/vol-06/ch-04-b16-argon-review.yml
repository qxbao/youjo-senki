locked_choices:
  - segment_id: "YS-LN06/Text/part0019.html/p000566"
    choices:
      - "Thoại Tanya: giữ nhận định '…Đúng là một vấn đề hết thuốc chữa'; trần thuật giữ tên 'Tanya' và trạng thái 'chỉ còn biết thốt ra một câu nhận xét như vậy trong tiếng thở hắt'."
  - segment_id: "YS-LN06/Text/part0019.html/p000567"
