  - segment_id: "YS-LN06/Text/part0019.html/p000601"
    choices:
      - "Trần thuật về Tanya theo DEC-P01-001: dùng 'nó', giữ khẳng định 'quả thực chính là món hàng thật mà nó hằng mong mỏi bấy lâu'."
  - segment_id: "YS-LN06/Text/part0019.html/p000602"
