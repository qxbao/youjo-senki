    issue: "Từ lóng 'Limeys' được dịch thoát nghĩa thành 'đám người Anh', dùng trực tiếp quốc danh thế giới thực thay vì giữ sắc thái biệt danh lóng hoặc đối chiếu với bối cảnh Khối Thịnh vượng chung."
    evidence: "Trong độc thoại nội tâm của Tanya đôi khi vẫn xuất hiện địa danh/khái niệm thực tế từ ký ức tiền kiếp (như truyền thống cấp phát rượu rum của Hải quân Hoàng gia Anh), nhưng ở các tập trước các biệt danh chỉ người thuộc Khối Thịnh vượng chung/Hợp chúng quốc thường được giữ dạng biệt danh như 'đám John Bull' hoặc 'đám Yankee'."
    recommendation: "Có thể giữ tạm 'đám người Anh' vì đây là liên tưởng trong nội tâm của Tanya và vẫn truyền tải rõ phép so sánh, hoặc cân nhắc 'đám Limey' khi tổng hợp canon về từ lóng các nước."
