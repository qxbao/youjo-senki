      - "Chuỗi giả định nhân quả & thuật ngữ: giữ trọn chuỗi giả định hệ lụy chính trị – quân sự nếu bỏ mặc đồng minh bản địa; 'Imperial Army' -> 'Lục quân Đế quốc'; 'Council for Self-Government' -> 'Hội đồng Tự trị'; 'the Empire' -> 'Đế quốc'; 'the Federation' -> 'Liên bang'; 'Lieutenant General von Zettour' -> 'Trung tướng von Zettour'; 'imperial supply lines' -> 'các tuyến tiếp tế của Đế quốc'."
  - segment_id: "YS-LN06/Text/part0011.html/p000240"
    choices:
      - "Thoại, giả định nhượng bộ & phủ định: giữ dấu chấm lửng sau liên từ 'Nhưng…', đại từ 'chúng ta / mình', mệnh đề nhượng bộ giả định 'ngay cả khi chúng ta có nói với họ rằng mình không làm được đi nữa' và phủ định tuyệt đối 'chẳng đời nào chúng ta có thể quay thẳng về căn cứ'."
  - segment_id: "YS-LN06/Text/part0011.html/p000241"
    choices:
      - "Nghĩa: giữ nhận định chuyển ý 'Xét đến mức độ cấp bách của tình hình, con đường phía trước đã quá rõ ràng.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000242"
    choices:
      - "Phủ định & thuật ngữ: 'the Empire' -> 'Đế quốc'; 'Council for Self-Government' -> 'Hội đồng Tự trị'; 'Imperial Army General Staff' -> 'Bộ Tổng tham mưu Lục quân Đế quốc'; giữ nét nghĩa phủ định 'không bỏ rơi' và 'hoàn toàn không có chỗ cho tình cảm'."
  - segment_id: "YS-LN06/Text/part0011.html/p000243"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: chỉ bọc '*Dù thành công hay thất bại*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; 'the higher-ups' -> 'cấp trên'; 'relief unit' -> 'đơn vị giải vây'."
  - segment_id: "YS-LN06/Text/part0011.html/p000244"
    choices:
      - "Nhấn mạnh Markdown, điểm nhìn, đại từ & giả định trái thực tế: chỉ bọc hai câu đầu '*Thành công thì tuyệt vời. Còn nếu chúng ta thất bại, đó cũng là điều tối thiểu ta có thể làm, nhưng ta sẽ nhỏ vài giọt nước mắt cho những hy sinh mà chúng ta đã bỏ ra nhân danh việc tổ chức giải cứu.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002 (dùng 'ta / chúng ta' cho lời độc thoại giả định của sĩ quan tham mưu); phần trần thuật sau để chữ thường, quy chiếu Tanya bằng 'nó / Tanya' theo DEC-P01-001; 'General Staff officer' -> 'Sĩ quan Bộ Tổng tham mưu'; giữ câu điều kiện giả định trái thực tế 'Nếu không phải chính nó là con cừu hiến tế trong kịch bản này, hẳn Tanya cũng chẳng mảy may băn khoăn khi đem hy sinh con cừu đó.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000245"
    choices:
      - "Nhấn mạnh Markdown, điểm nhìn, phủ định & thuật ngữ: câu đầu giữ phủ định 'Rút lui không phải là một lựa chọn.'; câu sau dùng 'nó' quy chiếu Tanya theo DEC-P01-001 và chỉ bọc '*Chúng ta đã đổi chỗ cho Quân đội Liên bang mất rồi!*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; 'Federation Army' -> 'Quân đội Liên bang'; giữ từ khóa 'bước ngoặt trớ trêu' khớp với câu lặp lại ở p000246."
  - segment_id: "YS-LN06/Text/part0011.html/p000246"
    choices:
      - "Thoại, từ khóa liên kết & đại từ: giữ câu tự hỏi trong thoại '“Hửm…? Bước ngoặt trớ trêu ư?”' lặp lại đúng từ khóa ở p000245; câu trần thuật sau quy chiếu Tanya bằng 'nó' theo DEC-P01-001."
  - segment_id: "YS-LN06/Text/part0011.html/p000247"
    choices:
      - "Nhấn mạnh Markdown: bọc toàn câu '*Có điều gì đó khác với mọi khi.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000248"
    choices:
      - "Nhấn mạnh Markdown & câu hỏi nội tâm: bọc toàn câu '*Đó là gì nhỉ?*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000249"
    choices:
      - "Nhấn mạnh Markdown & đại từ: bọc toàn câu '*Vị thế của chúng ta đã đảo ngược.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000250"
    choices:
      - "Thoại & câu hỏi bỏ lửng: giữ câu hỏi sực tỉnh bỏ lửng trong ngoặc kép '“Khoan đã, chẳng lẽ là…?”'."
  - segment_id: "YS-LN06/Text/part0011.html/p000251"
    choices:
      - "Tình thái giới hạn: giữ câu nhận định dè dặt 'Đó mới chỉ là một khả năng.'."
