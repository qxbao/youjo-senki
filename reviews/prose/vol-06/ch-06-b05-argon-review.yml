      - "Phủ định so sánh, thuật ngữ & xưng hô: giữ phủ định 'cũng chẳng khác gì trinh sát sĩ quan cả!' ('officer recon' -> 'trinh sát sĩ quan') và câu van nài lễ phép 'Xin Trung tá đấy ạ!'."
  - segment_id: "YS-LN06/Text/part0027.html/p000169"
    choices:
      - "Tình thái suy đoán: giữ mức độ chắc chắn 'Ắt hẳn anh ta thực sự có ý đó.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000170"
    choices:
      - "Phủ định & nhượng bộ: giữ hai phủ định ('không muốn dập tắt động lực của cấp dưới', 'Dù không sao gạt bỏ được nỗi lo ngại về tính nóng vội của anh ta') và mệnh đề đối lập 'song dù gì anh ta cũng đã tích lũy được kha khá kinh nghiệm'."
  - segment_id: "YS-LN06/Text/part0027.html/p000171"
    choices:
      - "Nhấn mạnh Markdown, phủ định kép, đại từ trần thuật & điều kiện: chỉ bọc '*Cũng đâu phải là anh ta không làm nổi*' (đặt dấu phẩy ngoài dấu sao) khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; trần thuật quy chiếu Tanya bằng 'Tanya / nó' theo DEC-P01-001; giữ câu điều kiện 'Nếu cho anh ta xuất kích, nó sẽ khuyết mất một đại đội trưởng và anh ta cũng sẽ càng thêm mỏi mệt.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000172"
    choices:
      - "Đại từ trần thuật & nghĩa: quy chiếu Tanya bằng 'nó' theo DEC-P01-001; giữ nghĩa 'phải đắn đo kỹ lưỡng trước việc dập tắt tinh thần xung phong tình nguyện của anh ta'."
  - segment_id: "YS-LN06/Text/part0027.html/p000173"
    choices:
      - "Thuật ngữ, phủ định & câu hỏi chỉ thị: 'search-and-destroy mission' -> 'nhiệm vụ lùng và diệt'; giữ phủ định 'nhưng không cần phải truy kích chúng quá xa làm gì' và câu hỏi giao nhiệm vụ 'Anh có thể ưu tiên việc nắm bắt tình hình được chứ?'."
  - segment_id: "YS-LN06/Text/part0027.html/p000174"
    choices:
      - "Ngữ khí thoại & câu hỏi xác nhận: giữ sự hào hứng lễ phép của Grantz '“Tất nhiên rồi ạ! Vậy là được phép đi phải không thưa Trung tá?”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000175"
    choices:
      - "Điều kiện phủ định & điều kiện đối ứng: giữ cặp điều kiện 'Trừ phi đám du kích đó là lũ đầu đất hoàn toàn, bằng không chúng sẽ chẳng nán lại quanh quẩn đó đâu. Còn nếu chúng thực sự ở lại, anh có thể cho phần còn lại của đại đội xuất kích.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000176"
    choices:
      - "Thoại tuân lệnh: giữ câu đáp gọn lễ phép '“Rõ ạ!”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000177"
    choices:
      - "Tình thái giả định: giữ sắc thái dè dặt 'Nếu hỏi lại xem anh ta có thực sự hiểu hay không thì e là sẽ hơi thiếu tế nhị.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000178"
    choices:
      - "Giả định cầu khiến: giữ sắc thái giả định mong ước '“Nếu một cơ hội như thế thực sự xuất hiện thì tốt biết mấy.”'."
