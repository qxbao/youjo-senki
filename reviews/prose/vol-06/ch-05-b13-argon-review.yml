findings:
  - segment_id: "YS-LN06/Text/part0023.html/p000454"
    severity: "minor"
    category: "pronouns_pov"
    issue: "Đoạn nhận xét nội tâm không in nghiêng của Tanya đang dùng đại từ 'chúng tôi', mang sắc thái phát ngôn hướng ngoại như trong hội thoại thay vì điểm nhìn nội tâm tự quy chiếu ('mình' theo DEC-P01-001)."
    evidence: "Các đoạn nội tâm lân cận của Tanya (p000452, p000466, p000468) đều tự quy chiếu bằng 'mình'; ở p000454, chủ thể bao gồm Tanya và phía đơn vị của nó (tách biệt với Uger)."
    recommendation: "Đổi 'chúng tôi' thành 'bọn mình' hoặc 'chúng mình' (ví dụ: 'Nếu bọn mình mà không lên tiếng, có trời mới biết anh ta sẽ điều số trang bị của bọn mình đi tận đẩu tận đâu!') để giữ nhất quán giọng nội tâm."
  - segment_id: "YS-LN06/Text/part0023.html/p000457"
    severity: "minor"
    category: "pronouns_tone"
    issue: "Trong lời thoại của Trung tá Uger nói với Tanya và Đại úy Ahrens, đại từ ngôi thứ hai số nhiều 'Các người' mang sắc thái lạnh lùng hoặc chất vấn kẻ đối địch, chưa khớp với thái độ thông cảm và thân tình của Uger trong ngữ cảnh."
    evidence: "Ở p000455, p000465, p000466 và p000469, Uger giữ giọng điệu đồng nghiệp lịch sự, hơi ngượng nghịu nhưng thiện chí với Tanya ('tôi - cô')."
    recommendation: "Đổi 'Các người' thành 'Các vị' hoặc 'Phía bên cô' (ví dụ: 'Chà, tôi hiểu mà. Các vị vốn là bên suýt nữa thì mất trang bị còn gì.')."
