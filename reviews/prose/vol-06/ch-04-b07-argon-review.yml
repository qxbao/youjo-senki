    logic_notes: "Giữ nguyên hình ảnh ẩn dụ 'hai con quạ' (ám chỉ cặp Zettour - Rudersdorf ở Bộ Tổng tham mưu Đế quốc) và 'bồ câu đưa thư' (người truyền tin hòa đàm/giao thiệp)"
