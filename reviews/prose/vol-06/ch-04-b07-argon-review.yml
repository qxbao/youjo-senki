    modality_and_negation: "Phủ định mức độ bất thường ('chẳng có gì đặc biệt kỳ lạ') và nhượng bộ ('Dù mối quan hệ... đã phần nào nguội lạnh, về mặt chính thức thì họ vẫn là đồng minh')"
    logic_notes: "Nêu lý do vì sao cuộc gặp có thể chỉ là trao đổi công vụ thông thường giữa hai nước đồng minh"
  - segment_id: "YS-LN06/Text/part0019.html/p000232"
    names: "Ildoa"
    pronouns: "người nói xưng 'Tôi'"
    viewpoint: "Thoại trực tiếp của một sĩ quan trong cuộc họp"
    modality_and_negation: "Rào đón phủ định ('Tôi không có ý bất đồng') kết hợp câu hỏi phản biện giả định ('nhưng chẳng phải hiểu như thế có nghĩa là... sao?')"
    logic_notes: "Đặt nghi vấn về việc thông tin mật lại rò rỉ quá dễ dàng từ phía Ildoa"
  - segment_id: "YS-LN06/Text/part0019.html/p000233"
    names: ""
    pronouns: ""
    viewpoint: "Thoại trực tiếp tiếp lời trong cuộc họp"
    modality_and_negation: "Câu hỏi tu từ phủ định ('Chẳng phải chuyện này quá lộ liễu sao?')"
    logic_notes: "Bổ sung nghi vấn rằng cuộc gặp giữa Lergen và Calandro diễn ra quá công khai"
  - segment_id: "YS-LN06/Text/part0019.html/p000234"
    names: "Habergram"
    pronouns: "họ (các sĩ quan cấp dưới); Ông (Habergram)"
