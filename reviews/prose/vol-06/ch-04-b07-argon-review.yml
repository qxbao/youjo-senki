    modality_and_negation: "Phủ định ('Ông không nghĩ cấp dưới của mình sai'), cấu trúc đối lập ('không phải là sự việc trông có vẻ như thế nào mà là bản chất thực sự của nó là gì')"
    logic_notes: "Nhấn mạnh khoảng cách giữa suy đoán 99% và sự chắc chắn 100% trong công tác tình báo"
  - segment_id: "YS-LN06/Text/part0019.html/p000235"
    names: ""
    pronouns: "Habergram xưng 'tôi', gọi 'Thưa các quý ông', dùng 'chúng ta'"
    viewpoint: "Thoại trực tiếp của Habergram"
    modality_and_negation: "Đối lập phủ định - khẳng định ('tôi không muốn những lời phỏng đoán. Tôi muốn có bằng chứng...')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000236"
    names: ""
    pronouns: "chúng ta (phía Khối Thịnh vượng chung); họ (phía Đế quốc và Ildoa)"
    viewpoint: "Thoại trực tiếp của một sĩ quan phân tích trong cuộc họp"
    modality_and_negation: "Mệnh đề nhượng bộ phủ định kép ('Ngay cả khi... là điều không có gì bất thường') dẫn tới kết luận thận trọng ('chúng ta vẫn không thể loại trừ khả năng...')"
    logic_notes: "Nêu giả thuyết rằng việc hai đại tá trò chuyện tại cuộc tập trận có mặt quan sát viên Khối Thịnh vượng chung là một thông điệp cố ý"
