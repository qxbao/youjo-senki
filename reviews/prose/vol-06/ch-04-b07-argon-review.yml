    modality_and_negation: "Câu hỏi xác minh phe phái ('Đại tá Calandro thuộc phe phái nào?')"
    logic_notes: "'Đó là đầu mối liên lạc của ông ta ở đằng kia' quy chiếu Calandro là đầu mối tiếp xúc của Lergen tại Ildoa"
  - segment_id: "YS-LN06/Text/part0019.html/p000229"
    names: "Tướng Gassman; Lục quân Hoàng gia Ildoa"
