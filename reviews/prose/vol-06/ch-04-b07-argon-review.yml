    modality_and_negation: "Câu hỏi xác nhận danh tính ('…Lergen ư? Đây có phải là... không?')"
    logic_notes: "Phía tình báo Khối Thịnh vượng chung nhận diện ngay Đại tá von Lergen của Bộ Tổng tham mưu Đế quốc"
  - segment_id: "YS-LN06/Text/part0019.html/p000227"
