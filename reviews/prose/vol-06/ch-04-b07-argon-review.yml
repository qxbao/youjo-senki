    viewpoint: "Thoại trực tiếp của chuyên gia phụ trách tình hình Ildoa"
    modality_and_negation: "Đối lập ('không quá nổi bật, nhưng lại là những nhân vật hàng đầu...')"
    logic_notes: "Xác định vị thế của Calandro và phe Tướng Gassman trong bộ máy hành chính Lục quân Hoàng gia Ildoa"
  - segment_id: "YS-LN06/Text/part0019.html/p000230"
    names: "Habergram"
    pronouns: "Habergram xưng 'tôi', gọi cấp dưới là 'các vị, thưa các quý ông', dùng 'Chúng ta'"
