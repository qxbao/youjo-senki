    logic_notes: "Làm nổi bật tầm quan trọng bất ngờ của nội dung báo cáo đánh máy"
  - segment_id: "YS-LN06/Text/part0019.html/p000226"
    names: "Lergen; Đại tá von Lergen; Bộ Tổng tham mưu của Đế quốc"
