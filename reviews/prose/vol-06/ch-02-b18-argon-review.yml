      - "Đại từ & phủ định trong thoại: Drake xưng 'Tôi / tôi', gọi Sue là 'cô'; giữ phủ định giới hạn 'Tôi không thể nói nhiều hơn thế này được nữa, nhưng tôi chỉ cần cô hiểu cho.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000290"
    choices:
      - "Đại từ, tên riêng & phủ định: quy chiếu Drake bằng 'ông', giữ phủ định 'Nhưng nỗi lòng thực sự của ông đã không thể truyền tải tới nơi' và tên riêng 'Sue' cùng hình ảnh 'sự thất vọng tràn trề'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000291"
    choices:
      - "Đại từ & điểm nhìn: quy chiếu Drake bằng 'Ông' và Mary Sue bằng 'cô ta'; giữ hành động 'nhìn theo bóng cô ta cáo lui'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000292"
    choices:
      - "Giả định quá khứ, phủ định & điểm nhìn: quy chiếu Mary Sue bằng 'cô ta', Drake bằng 'ông / Drake' và hai người bằng 'họ'; giữ câu giả định 'Nếu cô ta muốn bàn chuyện cơ mật, tất cả những gì cô ta cần làm là mời ông ra ngoài—tới một nơi nào đó mà họ không có nguy cơ bị rình mò.' và câu chốt điểm nhìn của Drake; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000293"
    choices:
      - "Phủ định toàn phần & sắc thái mỉa mai: giữ chủ ngữ phủ định 'Chẳng một ai có lương tri bình thường lại có thể chấp nhận nổi chuyện...', thuật ngữ 'Khối Thịnh vượng chung', 'Đảng Cộng sản Liên bang' và cụm từ mỉa mai 'đôi bàn tay nhân từ'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000294"
    choices:
      - "Giọng thoại độc thoại: giữ tiếng chửi thề và so sánh nhất 'Khốn kiếp, đây đúng là kỳ Giáng sinh tồi tệ nhất từ trước đến nay.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000295"
    choices:
      - "Đại từ & nghĩa: quy chiếu Drake bằng 'ông', giữ nghĩa thành ngữ 'Tâm trạng ăn mừng của ông đã bay biến sạch sành sanh.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000296"
    choices:
      - "Giọng thoại tự nhủ: giữ câu cảm thán 'Thật tình, đúng là một mớ bòng bong.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000297"
    choices:
      - "Đại từ, thời gian & thuật ngữ: quy chiếu Drake bằng 'Ông', giữ mốc thời gian 'kể từ khi mặt trận Rhine sụp đổ'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000298"
    choices:
      - "Nhấn mạnh Markdown, đại từ nội tâm & câu hỏi tự vấn: bọc toàn bộ câu hỏi nội tâm '*Có khi nào thực ra vận số của mình lại xúi quẩy lắm không nhỉ?*' bằng dấu sao khớp với thẻ em trong XHTML theo DEC-P01-002; giữ đại từ tự xưng 'mình'."
  - segment_id: "YS-LN06/Text/part0013.html/p000299"
    choices:
      - "Đại từ tự nhủ & phủ định: Drake lẩm bẩm một mình nên tự xưng 'mình'; giữ quan hệ nhượng bộ và hai vế phủ định 'Dù mình chưa bao giờ thua bài, mà đánh bạc cũng chẳng tệ chút nào.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000300"
    choices:
      - "Nhấn mạnh Markdown, ẩn dụ & phủ định: bọc chính xác hai câu nội tâm '*Nữ thần May mắn đúng là một mụ đàn bà xấu chơi. Thay vì không có lấy một sợi tóc nào ở sau gáy, mụ ta lại đội một bộ tóc giả hễ chạm vào là tuột ngay.*' bằng dấu sao khớp với thẻ em trong XHTML theo DEC-P01-002; câu trần thuật cuối đoạn ('Ông chỉ muốn chửi thề một tiếng.') để chữ thường."
  - segment_id: "YS-LN06/Text/part0013.html/p000301"
    choices:
      - "Tên riêng & phủ định: giữ tên riêng 'Drake', đại từ 'mình' và phủ định 'chẳng biết câu hỏi của mình sẽ tan biến đi về đâu'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000302"
    choices:
      - "Đại từ & quan hệ chuyển ý: quy chiếu Drake bằng 'ông', giữ quan hệ đối lập 'Thế nhưng, ông vẫn phải hỏi.'; không có chữ nghiêng."
  - segment_id: "YS-LN06/Text/part0013.html/p000303"
    choices:
      - "Cảm thán & câu hỏi kết chương: giữ lời than 'Ôi lạy Chúa' và câu hỏi cảm thán 'rốt cuộc tại sao mọi chuyện lại cứ phải thành ra thế này cơ chứ?'; không có chữ nghiêng."
