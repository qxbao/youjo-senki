  - segment_id: "YS-LN06/Text/part0019.html/p000479"
    choices:
      - "Thoại và trần thuật về Serebryakov: câu hỏi với Tanya kết bằng 'ạ'; trần thuật gọi Serebryakov là 'Cô'; giữ các thuật ngữ 'không hạm đội phía tây', 'mặt trận Rhine'."
  - segment_id: "YS-LN06/Text/part0019.html/p000480"
    choices:
      - "Thoại nhận xét tình hình điều quân: giữ nguyên nhân - hệ quả 'Với cái đà họ rút bớt quân để điều sang phía đông như thế này thì cũng đành chịu thôi'."
  - segment_id: "YS-LN06/Text/part0019.html/p000481"
    choices:
      - "Trần thuật về Tanya và Weiss: Tanya dùng đại từ 'Nó' (DEC-P01-001), Weiss dùng đại từ 'anh'; giữ nghĩa ngữ cảnh hội thoại 'Nhưng Tanya phải bênh vực cho phía tây. Nó liếc nhìn Weiss và anh hiểu ngay ý nó'."
