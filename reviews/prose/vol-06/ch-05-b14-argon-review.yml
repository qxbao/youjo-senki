findings:
  - segment_id: "YS-LN06/Text/part0025.html/p000015"
    severity: "minor"
    category: "pronouns_pov"
    issue: "Trong chuỗi lời thoại liên tiếp của Mary nhằm thuyết phục quân du kích cùng hợp sức chống Đế quốc (p000010, p000012, p000015), đại từ ngôi thứ nhất số nhiều ở p000015 chuyển sang 'Chúng tôi' (tách biệt với người nghe), chưa đồng nhất với 'chúng ta' ở p000010 và p000012 khi Mary vẫn đang kêu gọi sự đồng lòng của quân du kích trước khi bị họ gạt ra như người ngoài ở p000020–p000023."
    evidence: "Ở p000010 ('Tất cả chúng ta đều cùng chung một con thuyền mà') và p000012 ('Nhưng chúng ta có năng lực đó'), Mary đều dùng đại từ gộp 'chúng ta' để nhấn mạnh mục tiêu chung giữa đơn vị mình và lực lượng du kích địa phương."
    recommendation: "Đổi 'Chúng tôi' thành 'Chúng ta' (ví dụ: '“Chúng ta sẽ làm những gì mình có thể, từng chút từng chút một, để đuổi cổ Đế quốc đi! Như thế thì có gì sai chứ?!”') để giữ mạch xưng hô gộp nhất quán trong lời kêu gọi của Mary."
  - segment_id: "YS-LN06/Text/part0025.html/p000029"
    severity: "minor"
    category: "pronouns_tone"
    issue: "Trong câu trần thuật bám điểm nhìn của Mary, danh từ chỉ lực lượng du kích đang được dịch là 'Đám du kích', mang sắc thái hạ thấp/miệt thị (thường chỉ dùng trong điểm nhìn của phía Đế quốc), chưa khớp với thái độ trân trọng của Mary dành cho những người kháng chiến nơi quê nhà."
    evidence: "Ở p000002 và p000036, bản dịch dùng cách gọi trung tính 'quân du kích' và 'nhóm du kích'; đến p000043, điểm nhìn của Mary vẫn nhìn nhận họ là 'các chiến sĩ kháng chiến đầy kiêu hãnh này'."
    recommendation: "Đổi 'Đám du kích' thành 'Nhóm du kích' hoặc 'Những người du kích' / 'Quân du kích' (ví dụ: 'Nhóm du kích quắc mắt nhìn cô trong khi các cấp trên của cô lại đang cố giữ những nụ cười xã giao có phần gượng gạo trên môi.') theo đúng quy tắc không thêm sắc thái miệt thị ngoài văn cảnh trong canon/style-guide.md."
