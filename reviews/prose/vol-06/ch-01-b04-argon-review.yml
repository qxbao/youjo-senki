  - segment_id: "YS-LN06/Text/part0008.html/p000149"
    choices:
      - "Xưng hô & phủ định trong thoại: Tanya xưng 'Tôi / tôi'; giữ phủ định 'Tôi không tài nào hình dung nổi thực tế sẽ ra sao nếu chỉ đọc qua sách vở'."
  - segment_id: "YS-LN06/Text/part0008.html/p000150"
    choices:
      - "Điểm nhìn, đại từ, thuật ngữ & quân hàm: trần thuật quy chiếu Tanya bằng 'Nó' theo DEC-P01-001, quy chiếu Serebryakov bằng 'Serebryakov / cô'; trong thoại Serebryakov gọi 'General Mud' -> 'Tướng Bùn Lầy' và 'Colonel' -> 'thưa Trung tá'."
  - segment_id: "YS-LN06/Text/part0008.html/p000151"
    choices:
      - "Điểm nhìn: câu trần thuật ngắn dùng tên riêng 'Tanya'."
  - segment_id: "YS-LN06/Text/part0008.html/p000152"
    choices:
      - "Thuật ngữ & xưng hô: 'General Mud' -> 'Tướng Bùn Lầy'; Tanya xưng 'tôi'."
  - segment_id: "YS-LN06/Text/part0008.html/p000153"
    choices:
      - "Điểm nhìn, đại từ & phủ định: trần thuật quy chiếu Tanya bằng 'Nó' theo DEC-P01-001; giữ phủ định 'thậm chí chẳng cần phải nhìn ra ngoài cửa sổ'."
  - segment_id: "YS-LN06/Text/part0008.html/p000154"
    choices:
      - "Nghĩa: giữ câu nhận định khách quan 'Tuyết là sự kết tinh của hơi ẩm.'."
  - segment_id: "YS-LN06/Text/part0008.html/p000155"
    choices:
      - "So sánh giả định: giữ cấu trúc 'Một khi trời ấm lên, kết quả sẽ chẳng khác mấy so với việc có ai đó hất nước ra khắp mặt đất.'."
  - segment_id: "YS-LN06/Text/part0008.html/p000156"
    choices:
      - "Đại từ nhân cách hóa, xưng hô & thuật ngữ: quy chiếu 'General Mud' bằng 'Ông ta' và dịch là 'Tướng Bùn Lầy'; Serebryakov xưng 'tôi' kèm 'ạ'; 'the Empire' -> 'Đế quốc'; 'General Winter' -> 'Tướng Mùa Đông'."
  - segment_id: "YS-LN06/Text/part0008.html/p000157"
    choices:
      - "Điểm nhìn, đại từ & thuật ngữ: trần thuật quy chiếu Tanya bằng 'nó' theo DEC-P01-001; 'German-Soviet lines in the east' -> 'chiến tuyến Đức – Xô ở phía đông'."
  - segment_id: "YS-LN06/Text/part0008.html/p000158"
    choices:
      - "Điểm nhìn & đại từ nội tâm: độc thoại nội tâm của Tanya dùng 'mình' và 'chúng ta' theo DEC-P01-001; giữ nguyên tên 'Serebryakov' và 'quân Đức'."
  - segment_id: "YS-LN06/Text/part0008.html/p000159"
    choices:
      - "Xưng hô & lập luận trong thoại: Tanya gọi Serebryakov là 'Cô', xưng 'Tôi', dùng 'chúng ta' cho đơn vị."
  - segment_id: "YS-LN06/Text/part0008.html/p000160"
    choices:
      - "Xưng hô & phủ định lễ phép: Serebryakov xưng 'tôi' kèm 'ạ' ('Với tất cả sự kính trọng, tôi không đồng ý ạ.')."
  - segment_id: "YS-LN06/Text/part0008.html/p000161"
    choices:
      - "Xưng hô & chỉ dẫn trong thoại: Tanya gọi Serebryakov là 'cô', yêu cầu trình bày rõ hơn quan điểm."
  - segment_id: "YS-LN06/Text/part0008.html/p000162"
    choices:
      - "Điểm nhìn, đại từ & thuật ngữ: trần thuật phân biệt rõ 'nó' (quy chiếu Tanya theo DEC-P01-001) và 'cô' (quy chiếu Serebryakov); 'adjutant' -> 'sĩ quan phụ tá'; 'Federation' -> 'Liên bang'; giữ cấu trúc tăng tiến 'và hơn thế nữa, cô còn là...'."
