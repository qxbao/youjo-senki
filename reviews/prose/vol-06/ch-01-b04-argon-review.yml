findings:
  - segment_id: "YS-LN06/Text/part0008.html/p000136"
    severity: "moderate"
    category: "meaning_logic"
    issue: "Trật tự từ 'mua lại quân trang Liên bang bị đánh cắp từ Hội đồng Tự trị' gây nhập nhằng cú pháp tiếng Việt, dễ khiến người đọc hiểu cụm 'từ Hội đồng Tự trị' bổ nghĩa cho 'bị đánh cắp' (tức quân trang bị đánh cắp khỏi Hội đồng Tự trị), làm đảo ngược vai trò của Hội đồng Tự trị từ bên bán sang bên bị mất cắp."
    basis: "Trong cấu trúc nguồn, cụm giới từ chỉ nguồn cung ứng bổ nghĩa cho động từ mua, còn phân từ đứng trước chỉ trạng thái số quân trang Liên bang bị đánh cắp; các đoạn p000140 và p000142 kế tiếp cũng xác nhận Hội đồng Tự trị là đầu mối nắm giữ và bán lại số quân trang này."
    recommendation: "Đưa cụm chỉ nguồn bán lên ngay sau động từ mua, chẳng hạn: 'Chủ yếu chúng tôi mua lại từ Hội đồng Tự trị số quân trang Liên bang bị đánh cắp, nhưng họ cũng chẳng có dư dả bao nhiêu.'"
  - segment_id: "YS-LN06/Text/part0008.html/p000142"
    severity: "minor"
    category: "pronouns_pov"
    issue: "Dùng đại từ 'mình' trong 'lời họ nói rằng mình không có nguồn dự trữ đáng kể' để quy chiếu ngôi thứ ba số nhiều (Hội đồng Tự trị) ngay giữa mạch độc thoại nội tâm của Tanya gây giao thoa với đại từ tự quy chiếu 'mình / Mình' của Tanya theo DEC-P01-001 (xuất hiện ngay đầu câu p000143)."
    basis: "Theo DEC-P01-001, 'mình' được khóa cho nội tâm tự quy chiếu của Tanya; chủ thể được quy chiếu trong mệnh đề phụ ở p000142 là Hội đồng Tự trị."
    recommendation: "Lược đại từ dễ gây nhầm hoặc thay bằng 'họ', chẳng hạn: 'Xét tới đủ mọi cuộc xung đột nổ ra khắp nơi trong thời chiến, lời họ nói rằng không có nguồn dự trữ đáng kể hẳn cũng có phần đúng sự thật.'"
