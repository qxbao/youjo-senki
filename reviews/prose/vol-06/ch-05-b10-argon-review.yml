    issue: "Tại p000319, sĩ quan thuộc cấp mở đầu câu hỏi với Tanya bằng 'Vậy thưa Trung tá von Degurechaff…' nhưng vế ngay sau lại dịch đại từ ngôi thứ hai thành 'ý cô là'. Trong ngữ cảnh quân sự chính quy của Kampfgruppe Salamander và theo chuẩn nhất quán xuyên suốt tập 6 (như ch-01-b02 p000063, ch-01-b03 p000099), thuộc cấp khi trực tiếp hỏi chỉ huy của mình cần giữ xưng hô theo cấp bậc 'Trung tá' ('ý Trung tá là') thay vì gọi bằng 'cô'."
