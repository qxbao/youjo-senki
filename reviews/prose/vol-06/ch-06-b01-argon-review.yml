      - "Liệt kê lịch sử & thuật ngữ: 'French Revolution' -> 'Cách mạng Pháp'; 'modern rebellions' -> 'các cuộc nổi loạn thời cận đại'; 'violent proletariat revolution' -> 'cuộc cách mạng vô sản bạo lực'; giữ điệp cấu trúc liệt kê dẫn chứng lịch sử."
  - segment_id: "YS-LN06/Text/part0027.html/p000028"
    choices:
      - "Điểm nhìn, đại từ, quân hàm & phủ định: quy chiếu Tanya bằng 'nó'; 'Her adjutant' -> 'Viên sĩ quan phụ tá... của nó'; 'First Lieutenant Serebryakov' -> 'Trung úy Serebryakov'; giữ câu hỏi phủ định 'không hiểu ra ư?' và câu phủ định bỏ lửng 'đâu có ngốc, nhưng…'."
  - segment_id: "YS-LN06/Text/part0027.html/p000029"
    choices:
      - "Thoại, quân hàm & xưng hô: Tanya xưng 'Tôi', gọi Serebryakov là 'cô' và 'Trung úy'; giữ giọng chỉ dạy của cấp trên."
  - segment_id: "YS-LN06/Text/part0027.html/p000030"
    choices:
      - "Thoại & xưng hô quân đội: 'Yes, ma’am.' -> '“Rõ, thưa Trung tá.”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000031"
    choices:
      - "Thoại, đại từ, phủ định & thuật ngữ: Tanya dùng đại từ 'Chúng ta / chúng ta'; 'partisans' -> 'quân du kích'; 'cleaning up militia' -> 'truy quét dân quân'; 'local gangs or mafia' -> 'các băng nhóm địa phương hoặc mafia'; giữ đối lập phủ định 'Nhưng khó mà gọi việc chúng ta đang làm là truy quét dân quân được.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000032"
    choices:
      - "Đại từ, điểm nhìn nội tâm, phủ định & câu hỏi: giữ cách kéo dài chữ trong thoại '“V…âng ạ,”'; trong trần thuật quy chiếu Tanya bằng 'nó' và Serebryakov bằng 'Cô'; trong câu hỏi nội tâm cuối đoạn giữ đại từ gộp 'chúng ta' và phủ định 'rằng chúng ta đang không phải đối mặt với một tổ chức quân sự cơ chứ?'."
  - segment_id: "YS-LN06/Text/part0027.html/p000033"
    choices:
      - "Thoại & tên nhân vật: giữ tên gọi thân mật 'Visha' và mệnh lệnh nhắc nhở '“Visha, động não một chút đi.”'."
