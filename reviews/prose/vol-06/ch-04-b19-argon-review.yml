locked_choices:
  - segment_id: "YS-LN06/Text/part0021.html/p000077"
    choices:
      - "Thoại hoài niệm ngắn: giữ dấu ba chấm mở đầu và cảm thán '“…Cảm giác như đã xa xôi lắm rồi.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000078"
    choices:
      - "Thoại tiếp nối cảm thán: '“Đã có biết bao chuyện xảy ra.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000079"
    choices:
      - "Thoại đồng tình: giữ sự tán đồng '“Đúng thật. Quả thực đã có quá nhiều chuyện diễn ra.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000080"
    choices:
      - "Trần thuật: giữ 'Bộ Tổng tham mưu', dịch đại từ khái quát thành 'người ta', quy chiếu 'Uger' bằng 'anh ấy'; theo DEC-P01-002 giữ nhấn mạnh Markdown '*vị trung tá già*' đúng phạm vi cụm in nghiêng trong nguồn và giữ giả định không có thật 'Nếu không biết tuổi thật của Uger, có lẽ người ta sẽ nhắc đến anh ấy như *vị trung tá già* hệt một nhân vật trong truyện vậy'."
  - segment_id: "YS-LN06/Text/part0021.html/p000081"
    choices:
      - "Nhận định suy đoán chắc chắn của Tanya: 'Chắc chắn là do điều kiện làm việc tồi tệ rồi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000082"
    choices:
      - "Trần thuật: giữ tên 'Tanya', thuật ngữ 'quân luật', 'các sĩ quan tham mưu'; theo DEC-P01-002 giữ nhấn mạnh Markdown '*trong thời chiến, luật pháp phải lặng im*' đúng phạm vi câu ngạn ngữ in nghiêng trong nguồn."
  - segment_id: "YS-LN06/Text/part0021.html/p000083"
    choices:
      - "Thoại Uger hỏi Tanya: xưng 'tôi - cô', giữ liên kết nhân quả với câu trước '“Bởi vậy nên tôi mới muốn biết cô tìm gặp trò chuyện là vì việc gì.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000084"
    choices:
      - "Thoại Tanya đáp Uger: tự xưng 'tôi', giữ sắc thái dè dặt và cụm 'đi thẳng vào vấn đề' nhất quán với batch trước."
  - segment_id: "YS-LN06/Text/part0021.html/p000085"
    choices:
      - "Trần thuật: giữ tên 'Weiss', 'Uger', 'Tanya' và nhận xét phủ định trong nội tâm 'Họ đâu cần phải phản ứng kịch tính đến thế'."
  - segment_id: "YS-LN06/Text/part0021.html/p000086"
    choices:
      - "Nội tâm bỏ lửng của Tanya: giữ 'tạm gác một Uger đang chịu quá nhiều áp lực sang một bên, chí ít thì…'."
  - segment_id: "YS-LN06/Text/part0021.html/p000087"
    choices:
      - "Thoại Tanya nói với Uger: xưng 'Tôi' và cụm 'chỗ anh với tôi'."
  - segment_id: "YS-LN06/Text/part0021.html/p000088"
    choices:
      - "Thoại Uger đáp Tanya: tự xưng 'tôi', gọi Tanya là 'Trung tá', giữ câu hỏi 'Vậy giờ tôi nên nói gì đây?'."
  - segment_id: "YS-LN06/Text/part0021.html/p000089"
    choices:
      - "Trần thuật và thoại của Tanya: giữ 'Lục quân Đế quốc', phủ định 'không ở vị thế có thể theo đuổi chiến thắng' và ngôi gộp 'chúng ta' ('Chí ít chúng ta cũng cần thừa nhận rằng mình đang lâm vào thế bế tắc')."
  - segment_id: "YS-LN06/Text/part0021.html/p000090"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya, 'anh ấy' cho Uger."
  - segment_id: "YS-LN06/Text/part0021.html/p000091"
    choices:
      - "Thoại và trần thuật về Uger: giữ khẳng định phủ định kép '“Điều đó thì không còn nghi ngờ gì nữa.”', quy chiếu 'Uger' là 'Anh ấy' và giữ 'chuyên gia về hậu cần và đường sắt'."
  - segment_id: "YS-LN06/Text/part0021.html/p000092"
    choices:
      - "Trần thuật: giữ 'Lục quân Đế quốc', 'Bộ Tổng tham mưu', quy chiếu Uger là 'anh ấy', giữ quan hệ nhân quả 'do mở rộng chiến tuyến quá mức nên mạng lưới hậu cần bảo đảm cho các tuyến ấy đã bị kéo căng đến tột cùng giới hạn'."
  - segment_id: "YS-LN06/Text/part0021.html/p000093"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'Tanya' và 'Nó' cho Tanya, 'anh ấy' cho Uger; trong thoại Tanya tự xưng 'tôi', dùng ngôi gộp 'chúng ta', giữ tên 'Đế quốc' và các mệnh đề phủ định 'không thể gánh thêm bất kỳ sự mở rộng chiến tuyến nào nữa', 'chẳng có cơ sở nào để kỳ vọng kẻ địch sẽ đầu hàng'."
  - segment_id: "YS-LN06/Text/part0021.html/p000094"
    choices:
      - "Trần thuật: giữ 'Lục quân Đế quốc', mệnh đề phủ định 'vốn chưa từng hình dung đến một cuộc chiến trường kỳ' và nguyên nhân 'nhờ vào sự nỗ lực phi thường đến mức kỳ diệu'."
  - segment_id: "YS-LN06/Text/part0021.html/p000095"
    choices:
      - "Nhận định khái quát: giữ hai hình ảnh 'một vũng lầy—hay cũng có thể gọi là một khoảng lắng'."
  - segment_id: "YS-LN06/Text/part0021.html/p000096"
    choices:
      - "Thoại Uger: tự xưng 'Tôi - tôi', giữ 'Bộ Tổng tham mưu', 'Tướng von Zettour', quy chiếu Zettour là 'ngài ấy' và giữ phủ định 'Tôi không ở vị trí có thể biết được tâm tư của Tướng von Zettour'."
  - segment_id: "YS-LN06/Text/part0021.html/p000097"
    choices:
      - "Thoại Tanya bị ngắt quãng: tự xưng 'Tôi', giữ 'Lục quân Đế quốc', 'trên bình diện chiến lược' và dấu gạch ngang ngắt câu ở cuối."
  - segment_id: "YS-LN06/Text/part0021.html/p000098"
    choices:
      - "Thoại Uger ngắt lời: '“Thế là đủ rồi.”'."
  - segment_id: "YS-LN06/Text/part0021.html/p000099"
    choices:
      - "Thoại và trần thuật: giữ 'Tanya', 'Uger' và đại từ 'anh ấy' quy chiếu Uger."
  - segment_id: "YS-LN06/Text/part0021.html/p000100"
    choices:
      - "Thoại Uger nói với Tanya: gọi 'Trung tá von Degurechaff', dùng ngôi gộp 'chúng ta' / 'cả hai ta', tự xưng 'Tôi', giữ phủ định 'đừng nói vòng vo dậm chân tại chỗ nữa' và 'đều chẳng dư dả thời gian đâu'."
  - segment_id: "YS-LN06/Text/part0021.html/p000101"
    choices:
      - "Thoại và trần thuật của Tanya: theo DEC-P01-001 dùng 'Nó' trong trần thuật; trong thoại gọi Uger là 'anh' và 'Trung tá Uger', dùng ngôi gộp 'chúng ta', khẳng định 'giảng hòa ngay lập tức là lựa chọn duy nhất của chúng ta'."
  - segment_id: "YS-LN06/Text/part0021.html/p000102"
    choices:
      - "Thoại Uger đáp Tanya: gọi 'Trung tá von Degurechaff', xưng 'tôi - cô', giữ 'Bộ Ngoại giao', phủ định 'vì cô lại không biết đấy' và câu bị ngắt 'Hòa bình là—'."
  - segment_id: "YS-LN06/Text/part0021.html/p000103"
    choices:
      - "Theo DEC-P01-002 giữ nhấn mạnh Markdown '*Không phải*'; theo DEC-P01-001 dùng 'Nó' cho Tanya và 'anh ấy' cho Uger; trong thoại dịch 'stalemate' là 'một thế cờ hòa vì hết nước đi' để khớp với lời giải thích ẩn dụ cờ vua ở p000104–p000105."
  - segment_id: "YS-LN06/Text/part0021.html/p000104"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'Nó' cho Tanya, giữ 'ẩn dụ cờ vua' và 'mô tả hoàn cảnh của họ một cách trực diện và rõ ràng nhất'."
  - segment_id: "YS-LN06/Text/part0021.html/p000105"
    choices:
      - "Trần thuật và nội tâm của Tanya: giữ 'Đế quốc', phủ định 'không thể tìm ra nước đi tiếp theo'; theo DEC-P01-002 giữ nhấn mạnh Markdown '*Mà làm sao tìm ra nổi chứ?*' đúng phạm vi câu hỏi tu từ in nghiêng trong nguồn; giữ câu hỏi phản vấn phủ định 'Không gọi đây là bế tắc thì còn gọi là gì được nữa?'."
  - segment_id: "YS-LN06/Text/part0021.html/p000106"
    choices:
      - "Thoại Tanya nói với Uger: dùng ngôi gộp 'Chúng ta', xưng 'tôi - anh', giữ phủ định 'không còn nước cờ nào để đi nữa'."
  - segment_id: "YS-LN06/Text/part0021.html/p000107"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'Nó - nó' cho Tanya, giữ phủ định 'chẳng tài nào thốt ngay ra được những lời tiếp theo', thuật ngữ 'trường đại học quân sự', tên 'Uger', 'Đế quốc' và cụm 'mô thức tư duy của Đế quốc'."
  - segment_id: "YS-LN06/Text/part0021.html/p000108"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya, giữ phủ định và sắc thái gay gắt 'chẳng hứng thú làm hạng rác rưởi chỉ biết ngậm miệng làm thinh khi có những điều buộc phải nói ra'."
  - segment_id: "YS-LN06/Text/part0021.html/p000109"
    choices:
      - "Thoại Tanya: tự xưng 'Tôi', giữ cấu trúc phủ định ngoại trừ 'không còn con đường nào khác ngoài việc lập tức đề xuất một nền hòa bình theo nguyên tắc *restitutio in integrum*' và giữ nhấn mạnh Markdown '*restitutio in integrum*' theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0021.html/p000110"
    choices:
      - "Trần thuật theo DEC-P01-001: dùng 'nó' cho Tanya, giữ phủ định 'dường như chẳng để lại mấy ấn tượng'."
  - segment_id: "YS-LN06/Text/part0021.html/p000111"
    choices:
      - "Trần thuật theo DEC-P01-001: giữ tên 'Weiss', dùng 'nó' cho Tanya, giữ hai phủ định 'có vẻ chẳng hiểu gì cả' và 'cũng chẳng có gì lạ'."
  - segment_id: "YS-LN06/Text/part0021.html/p000112"
    choices:
      - "Trần thuật: giữ tên 'Tanya' và cụm 'mọi quân nhân Đế quốc khác'."
  - segment_id: "YS-LN06/Text/part0021.html/p000113"
    choices:
      - "Trần thuật: giữ 'Đế quốc' và cụm 'thiên sử ca vinh quang bất tận của họ'."
  - segment_id: "YS-LN06/Text/part0021.html/p000114"
    choices:
      - "Trần thuật: giữ định nghĩa 'Chiến thắng đồng nghĩa với sự bành trướng huy hoàng' và câu điều kiện nhượng bộ - phủ định 'Ngay cả khi ai đó hiểu được sự cần thiết của hòa bình, thì chừng nào chưa được chỉ rõ ra, họ cũng sẽ chẳng thể hiểu thấu bản chất của vấn đề'."
  - segment_id: "YS-LN06/Text/part0021.html/p000115"
    choices:
      - "Thoại và trần thuật của Tanya: trong thoại dùng ngôi gộp 'chúng ta', giữ đầy đủ chuỗi phủ định và điều kiện ('không nên bác bỏ phương án khôi phục biên giới về lại vị trí trước chiến tranh mà không sáp nhập lãnh thổ, từ bỏ mọi yêu sách, không đòi bồi thường chiến phí, và nếu cần thì ký kết cả hiệp ước giới hạn vũ trang'); trong trần thuật theo DEC-P01-001 giữ tên 'Tanya' (phản thân 'mình') và đại từ 'nó'."
