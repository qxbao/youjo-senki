      - "Quân hàm, đại từ & phủ định: 'Colonel von Lergen' -> 'Đại tá von Lergen'; Zettour xưng 'Tôi / tôi'; giữ câu trả lời phủ định 'Nói thẳng vào vấn đề thì, tôi không biết.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000330"
    choices:
      - "Xưng hô, câu hỏi & điểm nhìn trần thuật: Rudersdorf gọi Zettour là 'Ông'; giữ thái độ bực bội của Rudersdorf và bình luận trần thuật 'Mà, phản ứng đó cũng dễ hiểu thôi.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000331"
    choices:
      - "Thuật ngữ địa chính trị & chú thích ngoặc đơn: giữ 'hoàn cảnh địa chính trị của Ildoa', 'Đế quốc' và phần giải thích trong ngoặc đơn 'qua một cuộc tập trận (mà thực chất là lệnh động viên) cho thấy nước này có thể đánh chiếm miền nam Đế quốc'."
  - segment_id: "YS-LN06/Text/part0027.html/p000332"
    choices:
      - "Nghĩa & thành ngữ thương lượng: giữ đúng chủ thể và tân ngữ 'Ngay trong lúc hai người đang trò chuyện, Ildoa đã và đang vạch sẵn kế hoạch tự bán mình cho bên trả giá cao nhất.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000333"
    choices:
      - "Nhấn mạnh Markdown, phủ định kép & thuật ngữ: chỉ bọc '*buộc phải trói chân một phần binh lực ở biên giới*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; 'the Empire' -> 'Đế quốc'; 'Imperial Army' -> 'Lục quân Đế quốc'; giữ hai mệnh đề phủ định ('không phải là con số không', 'chừng nào chưa thể loại trừ khả năng nước này tham chiến với tư cách kẻ địch')."
  - segment_id: "YS-LN06/Text/part0027.html/p000334"
    choices:
      - "Nhấn mạnh Markdown, đại từ nội tâm giả định & thuật ngữ: chỉ bọc '*Giá mà mình có được một lực lượng lớn cỡ đó…*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; 'Operations' -> 'Cục Tác chiến'; giữ đối lập giữa tỷ trọng so với tổng quân số và quy mô thực tế đủ đối đầu với cả một quốc gia."
  - segment_id: "YS-LN06/Text/part0027.html/p000335"
    choices:
      - "Thoại đề xuất: giữ câu nói '“Hãy rà soát lại thực tế cho rõ ràng đã.”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000336"
    choices:
      - "Danh xưng trần thuật & hành động: giữ 'người bạn đáng kính' ('his esteemed friend' chỉ Rudersdorf) và hành động của Zettour 'liền điểm lại tình thế của họ và bắt đầu suy tính'."
