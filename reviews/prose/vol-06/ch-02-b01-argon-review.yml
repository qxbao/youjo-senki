    category: "terminology_consistency"
    issue: "Danh xưng 'Colonel Mikel' đang được dịch là 'Đại tá Mikel', lệch với cấp bậc 'Trung tá Mikel' đã được xác lập và khóa ở chương 1 (ch-01-b17, ch-01-b18) cũng như phần sau của chương 2 (ch-02-b07, ch-02-b08)."
    basis: "Tại YS-LN06/Text/part0011.html/p000289 (cùng chương 2), bản gốc ghi rõ cấp bậc đầy đủ là 'Lieutenant Colonel Mikel' và gọi rút gọn là 'Colonel Mikel' ở câu thoại kế tiếp (p000290). Trong work/run-state/pending-terms-index.yml và các báo cáo review ch-01-b17, ch-01-b18, ch-02-b07, ch-02-b08, cách gọi tắt này đã được thống nhất dịch là 'Trung tá Mikel' (tương tự trường hợp Trung tá Tanya và Trung tá Drake được gọi tắt bằng Colonel)."
    recommendation: "Đổi 'Đại tá Mikel' thành 'Trung tá Mikel': 'Sau khi công khai rời khỏi sở chỉ huy lực lượng liên hợp, Trung tá Drake và Trung tá Mikel đã cùng nhau hướng về nơi ở được phân công...'"
  - segment_id: "YS-LN06/Text/part0011.html/p000016"
    severity: "moderate"
    category: "terminology_consistency"
    issue: "Cách xưng hô 'Colonel Mikel' trong lời thoại của Drake đang được dịch là 'thưa Đại tá Mikel', chưa đồng bộ với cấp bậc 'Trung tá Mikel' đã khóa trong tập 6."
    basis: "Theo work/run-state/pending-terms-index.yml và các lô đã review của chương 1–2 tập 6 (ch-01-b17, ch-01-b18, ch-02-b07, ch-02-b08), Mikel mang quân hàm Trung tá (Lieutenant Colonel) và khi được gọi bằng 'Colonel Mikel' cần dịch nhất quán là 'Trung tá Mikel'."
    recommendation: "Đổi 'thưa Đại tá Mikel' thành 'thưa Trung tá Mikel': '“Tôi rất tiếc, thưa Trung tá Mikel. Tôi không biết gì về chuyện đó cả.”'"
  - segment_id: "YS-LN06/Text/part0011.html/p000018"
    severity: "moderate"
    category: "terminology_consistency"
    issue: "Cách gọi 'Colonel' khi Drake thưa chuyện với Mikel đang được dịch là 'thưa Đại tá', lệch với phương án 'thưa Trung tá' đã khóa ở chương 1 (p000661, p000677)."
    basis: "Trong work/run-state/pending-terms-index.yml (mục 'Colonel (addressing Mikel) -> Trung tá') và các lô ch-01-b17, ch-01-b18, lời gọi tắt 'Colonel' dành cho Trung tá Mikel được thống nhất dịch là 'Trung tá' / 'thưa Trung tá'."
    recommendation: "Đổi 'thưa Đại tá' thành 'thưa Trung tá': '“Ý tôi là, thưa Trung tá. Mệnh lệnh duy nhất mà chúng tôi nhận được là ‘hợp tác với Quân đội Liên bang’...”'"
