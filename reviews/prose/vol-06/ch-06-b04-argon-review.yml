      - "Đại từ trần thuật & mức độ: quy chiếu Tanya bằng 'nó' theo DEC-P01-001; giữ mức độ 'đang bắt đầu xâm hại khả năng tư duy lý tính của nó đến mức đáng giật mình'."
  - segment_id: "YS-LN06/Text/part0027.html/p000135"
    choices:
      - "Nhân quả & giả định quá khứ: giữ quan hệ hệ quả và cấu trúc khả thể quá khứ 'một tai nạn nghiêm trọng lẽ ra hoàn toàn có thể tránh được'."
  - segment_id: "YS-LN06/Text/part0027.html/p000136"
    choices:
      - "Phủ định, tình thái, điều kiện, đại từ & thuật ngữ: giữ phủ định 'Chẳng có phương thuốc thần kỳ nào chữa được sự kiệt sức cả.', tình thái và điều kiện giới hạn 'Hoặc có lẽ là có đấy, nhưng chỉ khi nó chấp nhận chịu đựng những tác dụng phụ khủng khiếp, giống như với Elinium Type 95 vậy.'; quy chiếu Tanya bằng 'nó' theo DEC-P01-001."
