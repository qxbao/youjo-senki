findings:
  - segment_id: "YS-LN06/Text/part0008.html/p000539"
    severity: "moderate"
    category: "pronoun_accuracy"
    issue: "Cụm sở hữu ngôi thứ nhất số nhiều chỉ máy bay của phe Liên bang đang được dịch lệch sang ngôi thứ hai số nhiều ('máy bay của các đồng chí')."
    basis: "Trong câu thoại phản biện tại p000539, vế đầu người nói dùng ngôi thứ hai gọi các quân nhân ('comrades'), nhưng ở vế sau khi nhắc tới số máy bay lạc hậu so với Không hạm đội Đế quốc thì dùng tính từ sở hữu ngôi thứ nhất số nhiều ('our planes') để chỉ trang bị chung của phe mình, chứ không quy riêng thành 'máy bay của các đồng chí'."
    recommendation: "Sửa 'máy bay của các đồng chí' thành 'máy bay của chúng ta': '“Tôi hiểu các đồng chí đang làm những gì có thể, nhưng xin đừng phớt lờ thực tế là máy bay của chúng ta đã lỗi thời so với Không hạm đội Đế quốc.”'"
  - segment_id: "YS-LN06/Text/part0008.html/p000534"
    severity: "minor"
    category: "referent_clarity"
    issue: "Đại từ 'chúng' ở đầu đoạn p000534 đứng ngay sau cụm danh từ số nhiều 'lũ đầu gỗ ở Ủy ban Kháng chiến tại các Vùng lãnh thổ bị Chiếm đóng' ở cuối p000533 nên dễ gây nhập nhằng đối tượng quy chiếu."
    basis: "Trong nguyên bản, đại từ chủ ngữ ở p000534 là ngôi thứ ba số ít, quy chiếu rõ về 'Lục quân Đế quốc' (số ít) chứ không phải nhóm 'lũ đầu gỗ' (số nhiều) ở cuối câu trước. Trong tiếng Việt, cả hai đều có thể được quy chiếu bằng 'chúng'."
    recommendation: "Có thể nêu rõ chủ thể 'quân Đế quốc' thay cho 'chúng' để tránh mơ hồ: 'Chắc chắn là quân Đế quốc đang lâm vào cảnh khốn đốn.'"
  - segment_id: "YS-LN06/Text/part0008.html/p000540"
    severity: "minor"
    category: "lexical_nuance"
    issue: "Cụm 'smoothing over the truth' đang được dịch là 'tô hồng sự thật', hơi lệch sắc thái so với hành vi bao biện, lấp liếm ở p000539."
    basis: "Ở p000539, người phản bác không vẽ ra viễn cảnh tươi đẹp ('tô hồng') mà viện cớ máy bay lạc hậu để chữa cháy và che đậy báo cáo thiếu căn cứ trước đó; do vậy nghĩa sát hơn là 'khỏa lấp sự thật' hoặc 'lấp liếm sự thật'."
    recommendation: "Cân nhắc đổi 'thói tô hồng sự thật' thành 'thói khỏa lấp sự thật' hoặc 'thói lấp liếm sự thật'."
