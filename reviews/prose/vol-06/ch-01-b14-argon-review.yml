      - "Thuật ngữ, đại từ, phủ định & tình thái: Loria xưng 'Tôi', gọi 'Thưa các đồng chí / chúng ta'; trần thuật quy chiếu Loria bằng 'gã / Gã'; 'Commissariat for Internal Affairs' -> 'Bộ Dân ủy Nội vụ'; 'partisan activities' -> 'hoạt động du kích'; 'Imperial Army' -> 'Lục quân Đế quốc'; 'wishful thinking' -> 'suy nghĩ viển vông'; giữ tình thái phủ định 'có lẽ không sai' và cặp đối lập 'Đó không phải là suy nghĩ viển vông mà là thực tế đơn thuần'."
  - segment_id: "YS-LN06/Text/part0008.html/p000552"
    choices:
      - "Đại từ & thuật ngữ: quy chiếu Loria bằng 'Gã'; 'Imperial Army' -> 'Lục quân Đế quốc'."
  - segment_id: "YS-LN06/Text/part0008.html/p000553"
    choices:
      - "Xưng hô & chỉ dẫn: Loria xưng 'Tôi', gọi 'các đồng chí' và nhắc đến 'câu hỏi của bên quân đội'."
  - segment_id: "YS-LN06/Text/part0008.html/p000554"
    choices:
      - "Dấu câu & thuật ngữ: giữ dấu chấm lửng mở đầu; 'repair facilities' -> 'các cơ sở sửa chữa'."
  - segment_id: "YS-LN06/Text/part0008.html/p000555"
    choices:
      - "Trần thuật & chỉ dẫn: giữ hành động Loria chờ phát xong tài liệu cho mọi người và câu chỉ dẫn 'Hãy chú ý đến toàn bộ số máy móc đó.'."
  - segment_id: "YS-LN06/Text/part0008.html/p000556"
    choices:
      - "Quan hệ nhượng bộ & đại từ: giữ cấu trúc 'Dù bức ảnh khá mờ nhạt, một chuyên gia vẫn có thể dễ dàng đọc ra...' và quy chiếu các quân nhân bằng 'họ'."
  - segment_id: "YS-LN06/Text/part0008.html/p000557"
    choices:
      - "Đại từ & thuật ngữ: quy chiếu quân Đế quốc bằng 'chúng'; 'assets' -> 'khí tài'; 'rear' -> 'hậu phương'."
  - segment_id: "YS-LN06/Text/part0008.html/p000558"
    choices:
      - "Thuật ngữ, dấu câu & phủ định: 'Federation Army General Staff officers' -> 'các sĩ quan Bộ Tổng tham mưu Quân đội Liên bang'; 'Imperial Army' -> 'Lục quân Đế quốc'; giữ dấu gạch ngang giải thích và phủ định nhấn mạnh 'hầu như chẳng còn nghi ngờ gì nữa'."
  - segment_id: "YS-LN06/Text/part0008.html/p000559"
    choices:
      - "Nghĩa & thuật ngữ kết đoạn: giữ nguyên tắc hoạt động gián điệp về việc giấu kín nguồn tin ngay cả với đồng minh."
