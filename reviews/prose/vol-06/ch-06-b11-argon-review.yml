    severity: "moderate"
    category: "nghĩa / cấu trúc mệnh đề quan hệ"
    issue: "Ở câu thứ hai của lời thoại, bản dịch dịch thành ngữ nhận định về tính cách quen thuộc của người đối thoại ('you we’re talking about') thành 'Dù sao người đang nói chuyện đây cũng là ông cơ mà'. Cách dịch này biến tân ngữ của giới từ ('người mà chúng ta đang nói tới / tính cách của ông') thành chủ thể đang phát ngôn ('người đang nói chuyện đây'), làm lệch ý nhận xét của Rudersdorf về sự kỹ lưỡng vốn có của Zettour."
    evidence: "Đối chiếu cấu trúc mệnh đề quan hệ rút gọn ở câu thứ hai trong p000402 và mạch lập luận tiếp nối sang điều kiện về nguồn quân tiếp viện."
    recommendation: "Sửa lại cho đúng nghĩa nhận định về con người Zettour, chẳng hạn: '“Nhưng ông không tán thành nó. Dù sao đây cũng là ông cơ mà. Chắc hẳn còn kèm theo điều kiện *miễn là ông biết quân tiếp viện sẽ lấy từ đâu ra*, đúng không?”' hoặc '“…Dù sao người đang được nhắc tới ở đây cũng là ông cơ mà…”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000396"
    severity: "minor"
    category: "đại từ / liên kết quy chiếu"
    issue: "Hai câu trong đoạn cùng quy chiếu một chủ thể nam ngôi thứ ba số ít ('he' và 'him'), nhưng bản dịch chuyển câu đầu thành đại từ phiếm chỉ 'người ta' còn câu sau dùng 'ông ta'. Do đoạn p000394 ngay trước đó đang dùng 'ông' để chỉ Zettour còn Rudersdorf ('ông ta') đã cách xa từ p000392, việc tách 'người ta' và 'ông ta' làm mạch quy chiếu trong đoạn hơi lỏng và dễ gây phân vân chủ thể."
    evidence: "Đối chiếu cặp đại từ ngôi thứ ba trong hai câu của p000396 với mạch điểm nhìn từ p000394 đến p000397."
    recommendation: "Giữ thống nhất đại từ quy chiếu ở cả hai câu trong p000396 (dùng 'ông' ở cả hai câu nếu hiểu theo điểm nhìn nội tâm của Zettour từ p000394–p000397, hoặc dùng 'ông ta' ở cả hai câu nếu quy chiếu Rudersdorf với tư cách chuyên gia tác chiến)."
  - segment_id: "YS-LN06/Text/part0027.html/p000407"
    severity: "minor"
    category: "độ trung thành / thêm chi tiết giải thích"
    issue: "Bản dịch thêm cụm 'mở hộp ra' ('chừng nào chưa mở hộp ra kiểm tra xem con mèo đã chết hay chưa') khi dịch ẩn dụ con mèo của Schrödinger, trong khi nguyên tác chỉ nêu hành động kiểm tra xem con mèo đã chết hay chưa."
    evidence: "Đối chiếu mệnh đề trạng ngữ chỉ thời gian ở câu thứ tư của p000407 với quy tắc không tự thêm giải thích trong canon/style-guide.md."
    recommendation: "Lược cụm giải thích thêm để bám sát nguyên tác: '“…Nhưng trong mọi chuyện, chừng nào chúng ta chưa kiểm tra xem con mèo đã chết hay chưa thì tương lai vẫn còn bất định…”'."
