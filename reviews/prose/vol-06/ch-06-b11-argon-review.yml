  - segment_id: "YS-LN06/Text/part0027.html/p000406"
    choices:
      - "Phủ định thẳng thừng: giữ '“Không, không thể nào đâu.”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000407"
    choices:
      - "Xưng hô, ẩn dụ & phủ định (lưu ý lược cụm thêm theo finding minor): Zettour xưng 'tôi', gộp chung 'chúng ta / ta'; giữ ẩn dụ con mèo và mệnh đề phủ định cuối câu 'số phương án thay thế mà ta không tự tay loại bỏ mà thôi'."
  - segment_id: "YS-LN06/Text/part0027.html/p000408"
    choices:
      - "Thuật ngữ, xưng hô & câu hỏi: Rudersdorf gọi Zettour là 'ông'; 'the Communists' -> 'phía Cộng sản'; 'the separatists' -> 'phe ly khai'."
  - segment_id: "YS-LN06/Text/part0027.html/p000409"
    choices:
      - "Thuật ngữ & xưng hô: 'buffer state' -> 'vùng đệm' (thống nhất với p000405); Zettour gọi Rudersdorf là 'ông'."
  - segment_id: "YS-LN06/Text/part0027.html/p000410"
    choices:
      - "Thuật ngữ & câu hỏi nghi vấn: 'Federation’s nationalism' -> 'chủ nghĩa dân tộc của Liên bang'; giữ câu hỏi '“…Liệu chủ nghĩa dân tộc của Liên bang có cho phép chuyện đó không?”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000411"
    choices:
      - "Trần thuật đánh giá: giữ 'Đó là một nhận xét rất sắc bén.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000412"
    choices:
      - "Nhấn mạnh Markdown, tình thái & phủ định: chỉ bọc '*Người dân Liên bang*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; giữ hai lần tình thái 'Có lẽ' và phủ định 'sẽ không cho phép chuyện đó đâu'."
  - segment_id: "YS-LN06/Text/part0027.html/p000413"
    choices:
      - "Thuật ngữ, đại từ & ẩn dụ: dùng 'ông' chỉ Zettour; giữ ẩn dụ 'con quái vật mang tên chủ nghĩa dân tộc' và các định danh 'Đảng Cộng sản', 'Quân đội Liên bang', 'quân Đế quốc xâm lược'."
  - segment_id: "YS-LN06/Text/part0027.html/p000414"
    choices:
      - "Thuật ngữ: giữ 'Sự dung hợp giữa tuyên truyền và chủ nghĩa dân tộc', 'phe chống đối chế độ' và 'dưới ngọn cờ của Đảng'."
  - segment_id: "YS-LN06/Text/part0027.html/p000415"
    choices:
      - "Thuật ngữ & phủ định: 'fatherland' -> 'tổ quốc'; giữ phủ định 'Lòng yêu tổ quốc vốn chẳng hề tuân theo logic.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000416"
    choices:
      - "Thuật ngữ & nhượng bộ: 'Heimat' -> 'quê hương bản quán'; 'mother earth' -> 'đất mẹ'; giữ cấu trúc nhượng bộ 'Dù có bao nhiêu máu phải đổ xuống đất mẹ đi chăng nữa, chắc chắn họ vẫn sẽ kiên quyết bám trụ lấy mảnh đất ấy.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000417"
    choices:
      - "Trần thuật & thoại ngắt quãng: giữ 'Rudersdorf vừa định phản bác—“Vậy thì”—Zettour đã nói tiếp thêm một câu.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000418"
    choices:
      - "Nhấn mạnh Markdown & tình thái đối lập: chỉ bọc '*Đảng Cộng sản thì có thể đấy*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002, tạo thế đối lập trực tiếp với '*Người dân Liên bang*' ở p000412."
  - segment_id: "YS-LN06/Text/part0027.html/p000419"
    choices:
      - "Xưng hô & câu hỏi cảm thán: giữ '“Hả? Ông điên rồi sao, Zettour?”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000420"
    choices:
      - "Đại từ thoại & khẳng định: giữ '“Ồ, tôi hoàn toàn tỉnh táo đấy chứ.”'."
