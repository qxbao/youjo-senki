      - "Phủ định & đối lập mục đích: Zettour xưng 'Tôi'; giữ '“Tôi không thể từ chối một kế hoạch mang tính tiến công nhằm mục đích phòng ngự.”'."
  - segment_id: "YS-LN06/Text/part0027.html/p000401"
    choices:
      - "Điểm nhìn & trần thuật: dùng 'ông' chỉ Zettour; giữ 'Qua khóe mắt, ông thấy Rudersdorf đang nở một nụ cười chua chát.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000402"
    choices:
      - "Nhấn mạnh Markdown, phủ định & xưng hô (cần sửa câu thứ hai theo finding moderate): Rudersdorf gọi Zettour là 'ông'; giữ phủ định 'Nhưng ông không tán thành nó', sửa câu thứ hai thành 'Dù sao đây cũng là ông cơ mà', và chỉ bọc '*miễn là ông biết quân tiếp viện sẽ lấy từ đâu ra*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0027.html/p000403"
    choices:
      - "Thoại xác nhận: giữ '“Đúng vậy.” Zettour gật đầu.'."
  - segment_id: "YS-LN06/Text/part0027.html/p000404"
    choices:
      - "Thuật ngữ & điều kiện giới hạn: 'limited offensive' -> 'cuộc tiến công giới hạn'; giữ điều kiện 'chỉ có thể tiến hành... khi nó gắn kết được với những bước tiếp theo'."
  - segment_id: "YS-LN06/Text/part0027.html/p000405"
    choices:
