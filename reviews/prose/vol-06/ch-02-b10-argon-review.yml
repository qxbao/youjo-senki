findings:
  - segment_id: "YS-LN06/Text/part0011.html/p000404"
    severity: "moderate"
    category: "terminology_consistency"
    issue: "Thuật ngữ 'mage company' và 'mage unit' đang được dịch là 'đại đội ma đạo' và 'đơn vị ma đạo', lệch với phương án 'đại đội pháp sư' và 'đơn vị pháp sư' đã thống nhất trong sổ pending xuyên suốt tập 1–6."
    basis: "Trong work/run-state/pending-terms-index.yml (các mục 'mage company -> đại đội pháp sư', 'mage unit / mage units -> đơn vị pháp sư / các đơn vị pháp sư' từ vol-01 đến vol-06), toàn bộ hệ thống thuật ngữ cho 'mage' đều dùng 'pháp sư', không dùng 'ma đạo'."
    recommendation: "Đổi 'đại đội ma đạo' thành 'đại đội pháp sư' và 'đơn vị ma đạo' thành 'đơn vị pháp sư': 'Việc áp giải mười người đàn ông trưởng thành về hậu phương đồng nghĩa với việc một đại đội pháp sư sẽ phải rời khỏi chiến tuyến. Một đơn vị pháp sư có thể tự rút lui êm thấm, nhưng khi đi cùng bộ binh, ông không thể bỏ mặc việc yểm trợ.'"
  - segment_id: "YS-LN06/Text/part0011.html/p000407"
    severity: "minor"
    category: "terminology_and_context"
    issue: "Cụm 'to the homeland' trong lời thoại của Drake nói về việc đưa các tù binh Liên bang đi nhờ tàu về nước của Drake đang dịch là 'về cố hương', dễ gây hiểu lầm Khối Thịnh vượng chung là quê hương của đám tù binh ('họ')."
    basis: "Chủ ngữ 'they' ('họ') ở vế sau quy chiếu 'the prisoners who surrendered to us' ở câu trước (công dân Liên bang đầu hàng quân Khối Thịnh vượng chung) và khớp với câu hỏi của Liliya ở p000419 ('ở nước của ngài'). Tại p000376 (ch-02-b09), địa điểm chuyển tù binh về nước của Drake đã được dịch là 'chính quốc'."
    recommendation: "Đổi 'về cố hương' thành 'về chính quốc': 'Một khi tàu RMS *Queen of Anjou* sửa chữa xong, họ có thể đi nhờ tàu về chính quốc.'"
  - segment_id: "YS-LN06/Text/part0011.html/p000436"
    severity: "moderate"
    category: "terminology_consistency"
    issue: "Danh từ 'mage' đang được dịch là 'ma đạo sĩ', lệch với thuật ngữ 'pháp sư' đã dùng thống nhất trong sổ pending tập 1–6."
    basis: "Theo work/run-state/pending-terms-index.yml (các mục 'mage / mages -> pháp sư / những pháp sư / các pháp sư'), 'mage' luôn được dịch là 'pháp sư' để đồng bộ với 'pháp sư trên không', 'pháp sư hải quân đánh bộ', 'Pháp sư Định danh'."
    recommendation: "Đổi 'ma đạo sĩ' thành 'pháp sư': '...vốn là khát vọng của mọi pháp sư.'"
  - segment_id: "YS-LN06/Text/part0011.html/p000442"
    severity: "moderate"
    category: "terminology_consistency"
    issue: "Danh từ 'mages' đang được dịch là 'ma đạo sĩ', lệch với thuật ngữ 'pháp sư' / 'các pháp sư' đã thống nhất trong sổ pending tập 1–6."
    basis: "Theo work/run-state/pending-terms-index.yml, 'mages' cần được dịch nhất quán là 'các pháp sư' hoặc 'pháp sư'."
    recommendation: "Đổi 'ma đạo sĩ' thành 'các pháp sư': '“Quân tiên phong của địch có vẻ là các pháp sư thuộc một đội phản ứng nhanh. Với quân số đó, chúng sẽ không truy kích chúng ta qua khỏi phòng tuyến đâu!”'"
