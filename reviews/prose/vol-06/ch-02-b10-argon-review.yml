  - segment_id: "YS-LN06/Text/part0011.html/p000439"
    choices:
      - "Thoại mệnh lệnh: giữ khẩu lệnh lặp '“Quân địch đang kéo tới! Rút lui! Rút lui!”'."
  - segment_id: "YS-LN06/Text/part0011.html/p000440"
    choices:
      - "Nghĩa: giữ câu tả âm thanh 'Một giọng nói nghiêm nghị hét vang mệnh lệnh rút lui.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000441"
    choices:
      - "Thoại câu hỏi & thuật ngữ theo ngữ cảnh: 'blocking unit' trong ngữ cảnh chiến thuật 'to slow them down' dịch là 'đơn vị chặn hậu' (phân biệt với đội đốc chiến NKVD)."
  - segment_id: "YS-LN06/Text/part0011.html/p000442"
    choices:
      - "Thoại, tình thái, phủ định & thuật ngữ: 'mages' -> 'các pháp sư'; 'quick response team' -> 'đội phản ứng nhanh'; giữ tình thái 'có vẻ là' và phủ định 'sẽ không truy kích chúng ta qua khỏi phòng tuyến đâu!'."
  - segment_id: "YS-LN06/Text/part0011.html/p000443"
    choices:
      - "Điểm nhìn & thái độ: giữ cảm xúc bất mãn của Mary ('thấy thật chướng tai gai mắt') trước lời trấn an của vị chỉ huy."
  - segment_id: "YS-LN06/Text/part0011.html/p000444"
    choices:
      - "Thoại nhúng & đại từ: giữ tiếng hô '“Xuất phát thôi!”' và đại từ phản thân 'mình' của Mary."
  - segment_id: "YS-LN06/Text/part0011.html/p000445"
    choices:
      - "Đại từ & phủ định: quy chiếu Mary bằng 'Cô', giữ câu phủ định 'Cô không muốn bỏ chạy.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000446"
    choices:
      - "Giả định trái thực tế & thuật ngữ: giữ điều kiện giả định 'Nếu có thể, cô thà chặn đánh đơn vị địch...' và nhịp tự đính chính 'cho Lục quân Đế quốc—không, cho Ác quỷ sông Rhine—một phen khiếp vía'."
  - segment_id: "YS-LN06/Text/part0011.html/p000447"
    choices:
      - "Thoại độc thoại, đại từ & phủ định: Mary tự xưng 'mình', giữ dấu chấm lửng mở đầu và phủ định 'lúc này mình vẫn chưa làm được'."
  - segment_id: "YS-LN06/Text/part0011.html/p000448"
    choices:
      - "Đại từ & nghĩa: quy chiếu Mary bằng 'Cô' và 'mình', giữ nhận thức về sức mạnh của đối thủ."
  - segment_id: "YS-LN06/Text/part0011.html/p000449"
    choices:
      - "Đại từ & quan hệ thời gian: quy chiếu Mary bằng 'Cô' và 'mình', giữ mốc giới hạn thời gian 'cho đến thời khắc đòn tấn công của mình thực sự phát huy tác dụng'."
  - segment_id: "YS-LN06/Text/part0011.html/p000450"
    choices:
      - "Dấu câu & nghĩa: giữ câu bỏ lửng 'Nhưng một ngày nào đó…'."
  - segment_id: "YS-LN06/Text/part0011.html/p000451"
    choices:
      - "Đại từ, mức chắc chắn & dấu câu: quy chiếu Mary bằng 'cô', giữ mức khẳng định 'nhất định cô sẽ…'."
  - segment_id: "YS-LN06/Text/part0011.html/p000452"
    choices:
      - "Thoại độc thoại & đại từ: giữ đại từ 'Chúng ta' và nhịp ngắt bằng dấu chấm lửng."
  - segment_id: "YS-LN06/Text/part0011.html/p000453"
    choices:
      - "Nhấn mạnh Markdown, đại từ & phủ định: bọc toàn bộ câu nội tâm '*Mình vẫn chưa thể vươn tới.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; Mary tự quy chiếu bằng 'Mình'."
  - segment_id: "YS-LN06/Text/part0011.html/p000454"
    choices:
      - "Nhấn mạnh Markdown, đại từ & phủ định: bọc toàn bộ câu nội tâm '*Mình vẫn chưa đủ sức gánh vác.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; Mary tự quy chiếu bằng 'Mình'."
  - segment_id: "YS-LN06/Text/part0011.html/p000455"
    choices:
      - "Nhấn mạnh Markdown, đại từ & phủ định: bọc toàn bộ câu nội tâm '*Mình vẫn chưa sẵn sàng.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; Mary tự quy chiếu bằng 'Mình'."
  - segment_id: "YS-LN06/Text/part0011.html/p000456"
    choices:
      - "Nhấn mạnh Markdown, đại từ & phủ định: bọc toàn bộ câu nội tâm '*Có cả một danh sách dài những điều mình vẫn chưa làm được.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002; Mary tự quy chiếu bằng 'mình'."
  - segment_id: "YS-LN06/Text/part0011.html/p000457"
    choices:
      - "Thoại độc thoại, đại từ & phủ định: để ngoài dấu sao (vì nguồn là câu thoại trong ngoặc kép không in nghiêng), Mary tự xưng 'mình' ('“Nhưng mình sẽ không bỏ cuộc.”')."
  - segment_id: "YS-LN06/Text/part0011.html/p000458"
    choices:
      - "Nhấn mạnh Markdown & đại từ: bọc toàn bộ cụm nội tâm '*Kẻ thù của cha mình.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000459"
    choices:
      - "Nhấn mạnh Markdown & đại từ: bọc toàn bộ cụm nội tâm '*Kẻ thù của tất cả chúng ta.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000460"
    choices:
      - "Nhấn mạnh Markdown & đại từ: bọc toàn bộ câu nội tâm '*…Chúng ta phải quay trở lại.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000461"
    choices:
      - "Thoại độc thoại & đại từ: để ngoài dấu sao, giữ nhịp nhấn mạnh giữa hai dấu gạch ngang '“Hiện giờ—và chỉ hiện giờ thôi—mình sẽ rời đi.”'."
  - segment_id: "YS-LN06/Text/part0011.html/p000462"
    choices:
      - "Nghĩa & tên nhân vật: giữ tên 'Mary' và nhận xét tiếng hô rút quân đang thưa dần."
  - segment_id: "YS-LN06/Text/part0011.html/p000463"
    choices:
      - "Nhấn mạnh Markdown & đại từ: bọc toàn bộ câu nội tâm '*Mình phải nhanh lên.*' khớp chính xác với thẻ em trong XHTML theo DEC-P01-002."
  - segment_id: "YS-LN06/Text/part0011.html/p000464"
    choices:
      - "Tình thái: giữ mức độ phỏng đoán 'Có lẽ mọi người đều đã gần như sẵn sàng khởi hành.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000465"
    choices:
      - "Nhượng bộ & đại từ: quy chiếu Mary bằng 'cô', giữ cấu trúc nhượng bộ 'Dù điều đó khiến cô đau lòng, và trái tim cô đòi hỏi cô phải ở lại chiến đấu đến người cuối cùng… cô vẫn phải nhẫn nhịn.'."
  - segment_id: "YS-LN06/Text/part0011.html/p000466"
    choices:
      - "Điều kiện giả định & cấu trúc tăng tiến: giữ câu điều kiện 'Nếu còn chần chừ thêm nữa, cô sẽ gây rắc rối cho không chỉ bản thân mà cả tất cả mọi người.'."
