    modality_and_negation: "Khẳng định số lượng sẵn có ('Có hai đơn vị biệt kích đang sẵn sàng ngay lập tức') kèm điều kiện và hạn chế ('Nếu cần, chúng ta có thể điều thêm sang, nhưng việc đó sẽ mất một chút thời gian')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000259"
    names: ""
    pronouns: "chúng ta (phía Khối Thịnh vượng chung)"
    viewpoint: "Thoại trực tiếp của Habergram"
    modality_and_negation: "Phủ định dứt khoát quyết định hành động ('…Thôi bỏ đi, chúng ta sẽ không làm nữa.')"
    logic_notes: "Habergram hủy bỏ ý định tập kích tuyến tiếp tế"
  - segment_id: "YS-LN06/Text/part0019.html/p000260"
    names: ""
    pronouns: "ông (Habergram); họ (phía Khối Thịnh vượng chung)"
    viewpoint: "Trần thuật ngôi thứ ba bám điểm nhìn Habergram"
    modality_and_negation: "Phủ định kép nhượng bộ ('Không phải là ông không ước gì họ có thể làm được') đối lập với nghĩa vụ nghề nghiệp ('nhưng với tư cách một chuyên gia, ông buộc phải chọn phương án an toàn nhất')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000261"
    names: "Ildoa"
    pronouns: "cấp dưới gọi Habergram là 'Thưa Tướng quân, ngài'; họ (Ildoa)"
    viewpoint: "Thoại trực tiếp của sĩ quan cấp dưới"
    modality_and_negation: "Câu hỏi bày tỏ sự tiếc nuối ('Thưa Tướng quân, ngài chắc chứ? Đây là cơ hội để bắt quả tang Ildoa phá vỡ quy chế trung lập của họ.')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000262"
    names: "Ultra"
    pronouns: ""
    viewpoint: "Thoại trực tiếp của Habergram"
    modality_and_negation: "So sánh hơn xác lập ưu tiên ('Giữ lại được Ultra quan trọng hơn.')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000263"
    names: "Ultra; Lục quân Đế quốc"
    pronouns: "cấp dưới gọi Habergram là 'Ngài', xưng 'tôi'; họ (Lục quân Đế quốc)"
    viewpoint: "Thoại trực tiếp của sĩ quan cấp dưới"
    modality_and_negation: "Câu hỏi nghi vấn ('Ngài nghĩ sẽ có chuyện gì đó xảy ra với Ultra sao?') và nhận định nhượng bộ ('tôi nghĩ Lục quân Đế quốc sẽ vô cùng khó xác định chính xác ai là người liên đới trong một cuộc tập kích như thế này, ngay cả khi họ có mở cuộc điều tra nội bộ đi chăng nữa')"
    logic_notes: "Sĩ quan cấp dưới tưởng lầm Ultra là một điệp viên nằm vùng nên đánh giá rủiro theo hướng điều tra truy tìm nội gián"
  - segment_id: "YS-LN06/Text/part0019.html/p000264"
    names: "Ultra; Bộ Tổng tham mưu Lục quân Đế quốc"
    pronouns: "người đó / đó (điệp viên hư cấu mang mật danh Ultra trong nhận thức của các sĩ quan thông thường)"
    viewpoint: "Trần thuật ngôi thứ ba giải thích vỏ bọc bảo mật của Ultra"
    modality_and_negation: "Phủ định hiểu biết ('cũng không nắm rõ chi tiết về điệp viên này') và giới hạn thông tin ('chỉ được cho biết đó là một sĩ quan cấp tướng...')"
    logic_notes: "Làm rõ câu chuyện bình phong trong nội bộ cơ quan tình báo: nhân viên cấp dưới chỉ được nghe kể rằng Ultra là một tướng lĩnh trong Bộ Tổng tham mưu Đế quốc"
  - segment_id: "YS-LN06/Text/part0019.html/p000265"
    names: "Ultra; Lục quân Đế quốc; Habergram"
    pronouns: ""
    viewpoint: "Trần thuật ngôi thứ ba tiết lộ bản chất thật của Ultra"
    modality_and_negation: "Khẳng định sự thật đối lập với vỏ bọc ('Trên thực tế, Ultra chính là mật mã của Lục quân Đế quốc đã bị bẻ khóa…') và giới hạn phạm vi người biết ('những người duy nhất biết chuyện này chỉ là một nhóm giới hạn...')"
    logic_notes: "Giải thích bản chất thực sự của Ultra: không phải điệp viên con người mà là hệ thống mật mã Đế quốc đã bị giải mã"
  - segment_id: "YS-LN06/Text/part0019.html/p000266"
    names: "Ultra; Đế quốc"
    pronouns: "Họ (phía Habergram / những người nắm bí mật Khối Thịnh vượng chung)"
    viewpoint: "Trần thuật ngôi thứ ba bám điểm nhìn Habergram"
    modality_and_negation: "Mệnh đề cần thiết mang tính phòng ngừa tuyệt đối ('Họ cần phải tránh để Đế quốc dù chỉ mảy may nghi ngờ rằng họ có trong tay tin tình báo Ultra')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000267"
    names: "Ildoa"
    pronouns: "họ (phía Đế quốc); Tôi (sĩ quan cấp dưới); chúng ta (phía Khối Thịnh vượng chung)"
    viewpoint: "Thoại trực tiếp của sĩ quan cấp dưới"
    modality_and_negation: "Câu hỏi tu từ phủ định ('Chẳng phải họ sẽ cho rằng đó là một vụ rò rỉ từ phía Ildoa sao?') và phủ định lo ngại ('Tôi thực sự không nghĩ chúng ta có gì phải lo lắng về phương diện gián điệp cả')"
    logic_notes: "Cấp dưới vẫn tiếp tục lập luận dựa trên giả định Ultra là hoạt động gián điệp con người"
  - segment_id: "YS-LN06/Text/part0019.html/p000268"
    names: ""
    pronouns: "Habergram gọi cấp dưới là 'các vị'"
    viewpoint: "Thoại trực tiếp của Habergram"
    modality_and_negation: "Câu hỏi lạnh lùng cắt ngang ('Ý kiến của các vị chỉ có bấy nhiêu thôi sao?')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000269"
    names: ""
    pronouns: ""
    viewpoint: "Trần thuật ngôi thứ ba bám điểm nhìn Habergram"
    modality_and_negation: "Phủ định tương đương ('hoàn toàn không nằm cùng một bình diện với việc danh tính của ai đó bị bại lộ')"
    logic_notes: "Nhấn mạnh sự chênh lệch nhận thức giữa Habergram (biết Ultra là mật mã) và cấp dưới (tưởng Ultra là điệp viên)"
  - segment_id: "YS-LN06/Text/part0019.html/p000270"
    names: "Đế quốc; Ultra"
    pronouns: "mình (Đế quốc); họ (Đế quốc)"
    viewpoint: "Trần thuật ngôi thứ ba bám điểm nhìn Habergram"
    modality_and_negation: "Chuỗi câu điều kiện - hệ quả cấp tiến ('Nếu Đế quốc bắt đầu nghi ngờ..., việc giải mã sẽ... Chỉ riêng việc thay đổi mật mã thôi đã..., nhưng khả năng tồi tệ nhất là họ giảm hẳn việc truyền tin đi. Nếu Đế quốc đặt dấu hỏi..., năng lực siêu phàm của Ultra sẽ bị trói chân')"
    logic_notes: "Giải thích hậu quả chiến lược thảm khốc nếu Đế quốc nghi ngờ độ an toàn của mật mã và thay đổi mật mã hoặc hạn chế liên lạc vô tuyến"
  - segment_id: "YS-LN06/Text/part0019.html/p000271"
    names: ""
    pronouns: ""
    viewpoint: "Trần thuật ngôi thứ ba bám điểm nhìn Habergram"
    modality_and_negation: "Điều kiện so sánh lựa chọn ('Nếu việc đó đồng nghĩa với đánh mất lợi ích chiến lược, thì thà bỏ qua một cơ hội chiến thuật còn hơn')"
    logic_notes: "Đặt lợi ích chiến lược (duy trì giải mã Ultra) lên trên cơ hội chiến thuật (đánh phá tuyến tiếp tế nhiên liệu)"
  - segment_id: "YS-LN06/Text/part0019.html/p000272"
    names: ""
    pronouns: "Habergram xưng 'tôi'"
    viewpoint: "Thoại trực tiếp của Habergram"
    modality_and_negation: "Khẳng định giữ nguyên kết luận phủ định ('Vậy thì kết luận của tôi vẫn không đổi: Không.')"
    logic_notes: ""
  - segment_id: "YS-LN06/Text/part0019.html/p000273"
    names: ""
    pronouns: "ông (Habergram)"
    viewpoint: "Trần thuật ngôi thứ ba"
    modality_and_negation: "Mệnh đề thời gian bỏ lửng ('Khi ông hỏi liệu còn vấn đề nào khác cần thảo luận không…')"
    logic_notes: "Chuyển sang vấn đề tiếp theo trong cuộc họp"
  - segment_id: "YS-LN06/Text/part0019.html/p000274"
    names: "Ildoa; Đế quốc"
    pronouns: "người phát biểu xưng 'tôi', dùng 'chúng ta' (Khối Thịnh vượng chung), gọi Ildoa và Đế quốc là 'họ'"
    viewpoint: "Thoại trực tiếp của sĩ quan phụ trách an ninh tình báo xen câu trần thuật ngôi thứ ba"
    modality_and_negation: "Khuyến nghị hạn chế ('tôi nghĩ chúng ta nên hãm phanh việc xuất khẩu vũ khí') dựa trên giả định điều kiện ('Nếu liên minh của họ sâu sắc đến mức đó, Ildoa có thể lấy số vũ khí chúng ta xuất khẩu cho họ rồi trao lại cho Đế quốc')"
    logic_notes: "Mở ra vấn đề kiểm soát xuất khẩu vũ khí sang Ildoa do lo ngại rò rỉ sang Đế quốc"
