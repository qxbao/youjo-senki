locked_choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000071
  locks:
  - "Giữ mệnh đề điều kiện thời gian “Một khi quy mô lực lượng đã được chốt”, định danh “Đế quốc” và hình ảnh “cỗ máy chiến tranh tinh vi của Đế quốc lập tức vận hành hết công suất”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000072
  locks:
  - "Giữ con số và tên đơn vị “Mười hai thành viên thuộc Tiểu đoàn Pháp sư Trên không số 203”, các thuật ngữ “căn cứ phóng ở hậu phương”, “lực lượng tấn công”, “thiết bị gia tốc bổ sung (mật danh V-1)” và mục đích “thực hiện cuộc tập kích phía sau phòng tuyến địch”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000073
  locks:
  - "Giữ hai nội dung chuẩn bị là được “các kỹ sư phổ biến kỹ thuật” và “cung cấp tin tức tình báo về lãnh thổ địch”, cùng khẳng định phủ định cuối đoạn “Mọi công tác chuẩn bị cho nhiệm vụ tác chiến của họ đều được hoàn tất không chút chậm trễ.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000074
  locks:
  - "Giữ quan hệ chuyển ý “Tuy nhiên”, cấp bậc và họ “Thiếu tá von Degurechaff”, việc bác bỏ “cuộc phóng thử” vì lo ngại bảo mật, đánh giá “quyết định bất khả kháng” do mấu chốt chiến dịch là “một đòn đánh úp”, cùng thuật ngữ “phản gián” và phủ định khả năng cho phép của “Bộ Tổng tham mưu”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000075
  locks:
  - "Giữ nhận định rủi ro khi thực hiện mà không tập dượt, chủ thể “Văn phòng Bộ Tổng tham mưu”, quan hệ nhân quả giữa việc cơ hội thành công phụ thuộc hoàn toàn vào “yếu tố bất ngờ” với việc đề cao “tính chất tuyệt mật của nhiệm vụ” đến mức dập tắt mọi ý kiến bất đồng, và sự thừa nhận miễn cưỡng của “Thiếu tá von Degurechaff” đối với “công tác phản gián”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000076
  locks:
  - "Giữ sự đối lập giữa việc tiến hành “các bài tập điều khiển trong nhà chứa máy bay” với phủ định “không có cuộc phóng thực tế nào cùng trang thiết bị được thực hiện”, cùng chi tiết bảo dưỡng “các thiết bị gia tốc bổ sung” hết sức cẩn trọng theo yêu cầu của “Thiếu tá von Degurechaff”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000077
  locks:
  - "Giữ chi tiết lịch trình chiến dịch được vạch ra thành từng mục chặt chẽ, hai mục tiêu tối thiểu là giáng đòn vào “hệ thống chỉ huy của địch” và tạm thời đánh sập “mạng lưới liên lạc của chúng”, cùng lộ trình rút về phía bắc ngay sau cuộc đột kích vào “tổng hành dinh địch” để “một tàu ngầm hoặc tàu chiến phe ta” đón."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000078
  locks:
  - "Giữ thuật ngữ “Bộ Tổng tham mưu”, tình thái mức độ “tất cả những người tham gia nhìn chung đã đi đến thống nhất”, định danh “Đơn vị V-1” và mốc thời gian “Ngày X đã điểm vào ngày 25 tháng 5”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000079
  locks:
  - "Giữ câu trích dẫn trong ngoặc kép, dấu nhấn mạnh chữ nghiêng đúng ở tên tác phẩm `*Lịch sử Mặt trận Rhine Tập 3*` theo DEC-P01-002 và định danh cơ quan “Ban Biên soạn Chiến sử thuộc Lục quân Khối Thịnh vượng chung”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000080
  locks:
  - "Giữ định dạng tiêu đề thời gian và địa điểm in hoa toàn bộ “NGÀY 25 THÁNG 5, NĂM THỐNG NHẤT 1925, CĂN CỨ PHÓNG V-1 BÍ MẬT CỦA LỤC QUÂN ĐẾ QUỐC”, không thêm dấu nhấn mạnh `*...*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000081
  locks:
  - "Giữ đầy đủ cấp bậc và tên riêng “Thiếu tá Tanya von Degurechaff”, bối cảnh đứng trên đường băng tại sân bay ngắm mặt trời mọc, hình ảnh so sánh cường điệu “ánh mắt u ám đến mức có thể khiến cả cá chết cũng phải tháo chạy tán loạn” và dấu nhấn mạnh chữ nghiêng chỉ ở đúng cụm tiếng Đức `*Guten Morgen*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000082
  locks:
  - "Giữ đại từ trần thuật “nó” quy chiếu Tanya theo DEC-P01-001, các thuật ngữ “một đại đội tinh nhuệ”, “tổng hành dinh địch”, “chặt đứt đầu não quân đội của chúng” và “chặt đầu lực lượng của chúng bằng một đòn tập kích chính xác”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000083
  locks:
  - "Giữ cấu trúc so sánh giả định kèm phủ định “Như thể bản thân cái mệnh lệnh ngông cuồng ấy vẫn chưa đủ gây chán nản”, đại từ trần thuật “nó” theo DEC-P01-001 và vế tăng tiến “phương thức mà nó cần phải sử dụng lại còn tệ hại hơn nữa”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000084
  locks:
  - "Giữ khẳng định phủ định “Việc xuyên thủng hàng phòng ngự của địch bằng các biện pháp thông thường là điều bất khả thi”, tình thái “Xem chừng giới chóp bu cũng hiểu được chừng ấy”, thuật ngữ “một quả tên lửa dẫn đường” và nghịch lý ở câu cuối “hệ thống dẫn đường lại được thực hiện ngay trên khoang và bằng tay”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000085
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, hình ảnh “biến thành một quả tên lửa người và lao vào”, cấu trúc giả định trái thực tế ở hiện tại “Nếu Tanya không phải bận tâm giữ gìn thanh danh, hẳn ngay lúc này nó đã ôm đầu mà gào lên” và dấu nhấn mạnh chữ nghiêng đúng ở câu tiếng thét `*Sao chuyện lại ra nông nỗi này cơ chứ?!*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000086
  locks:
  - "Giữ đại từ tự quy chiếu “mình” trong mệnh đề phụ thuộc suy nghĩ của Tanya theo DEC-P01-001, cấu trúc phủ định “không chỉ là một canh bạc liều lĩnh”, khẳng định “Không còn nghi ngờ gì nữa, vẫn tồn tại một cơ hội thành công hợp lý” và kết luận về “tính khả thi về mặt chiến lược”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000087
  locks:
  - "Giữ chuỗi lập luận về “Quy luật của sự tiến bộ”, “những bước tiến mang tính cách mạng”, “thái độ hoài nghi cảnh giác trước lẽ thường như một nguy cơ dẫn đến thiên kiến”, “liên tục thách thức các mô thức hiện hữu”, cùng đại từ trần thuật “nó” theo DEC-P01-001 và thuật ngữ “bất hợp lý”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000088
  locks:
  - "Giữ quan hệ đối lập “Nhưng nhìn từ một góc độ hợp lý khác”, nhận định tiến hành chiến tranh là sự lãng phí khổng lồ, phủ định kép “không thể phủ nhận rằng sự tiêu hao gần như vô nghĩa đối với mọi nguồn lực cần phải được giữ ở mức tối thiểu” và kết luận “việc cắt giảm chi phí ở bất cứ đâu có thể là điều cần thiết và hợp logic”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000089
  locks:
  - "Giữ sự song hành giữa “Mọi dữ liệu” và “Những con số”, nhu cầu thực hiện “các biện pháp bảo toàn” và đảm bảo “một nguồn cung thay thế để bù đắp cho các tổn thất không thể tránh khỏi”, cấu trúc điều kiện phủ định “Trừ phi Đế quốc tịch thu tài sản của Cộng hòa trong các điều khoản hòa bình hay đại loại thế, bằng không đất nước của Tanya sẽ sụp đổ dưới sức nặng của khoản chi phí chiến tranh ngày một phình to”, cùng nhận định “giới chóp bu đang có ý định vắt kiệt các khoản bồi thường chiến phí từ Cộng hòa”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000090
  locks:
  - "Giữ nhận định về việc dùng “dữ liệu thống kê để củng cố lẽ thường hoặc qua mặt nó là điều hợp lý” và câu phủ định “Tanya không thể phủ nhận điều đó trên cơ sở đạo đức hay cảm xúc.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000091
  locks:
  - "Giữ cặp câu ngắn đối lập “Tất nhiên, những con số thống kê biết nói dối. Nhưng chúng lại là kiểu nói dối tuyệt vời nhất.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000092
  locks:
  - "Giữ phủ định mở đầu “Về mặt thống kê, chẳng ai ngờ một người có tài khoản tiết kiệm và bảo hiểm nhân thọ lại là kẻ đánh bom tự sát”, chi tiết “một nhân viên ngân hàng thực sự còn muốn duy trì mối quan hệ lâu dài với một khách hàng như vậy” và quan hệ nhân quả “Đó chính xác là lý do tại sao một kẻ khủng bố thực dụng và xảo quyệt lại có khả năng lách qua sự giám sát bằng cách mở một tài khoản tiết kiệm và mua bảo hiểm nhân thọ.”."
