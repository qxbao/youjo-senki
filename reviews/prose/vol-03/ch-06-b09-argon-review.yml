  volume: vol-03
  chapter: 6
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`: giữ liền mạch hệ đại từ của Tướng de Lugo từ B04–B08 và của điệp viên John từ Chương 2, đồng thời bảo toàn chính xác phạm vi nhấn mạnh `*...*` ở đúng 9 đoạn có thẻ `<html:em>` trong nguồn (`p000256`, `p000257`, `p000261`, `p000264`, `p000266`, `p000268`, `p000273`, `p000287`, `p000288`)."
  uncertainty: low
