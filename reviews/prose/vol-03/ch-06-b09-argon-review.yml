  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng và địa danh đã khóa từ Chương 2 (`John`, `tinh thần John Bull`, `Whitehall`, `Tình báo Khối Thịnh vượng chung`) và các batch trước của Chương 6 (`Turus` / `Căn cứ Hải quân Turus`, `Lục quân Đế quốc` / `Đế quốc`, `Lục quân Cộng hòa Tự do` / `quân Cộng hòa`, `de Lugo`, `chính quốc`), đồng thời khóa tạm các thuật ngữ quân sự và tình báo sa mạc mới xuất hiện trong lô gồm `công binh dã chiến` (`p000259`), `bãi mìn` (`p000259`, `p000267`), `cuộc tiến quân phân tán` (`p000262`), `làn đạn giao nhau` (`p000268`), `các bộ tộc du mục` / `những người du mục` (`p000276`–`p000278`, `p000280`) và `quỹ mật` (`p000286`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: de_lugo_and_john_pov_pronouns_and_register_vol03_ch06_b09
  proposed_vi: "Nửa đầu tại sở chỉ huy Lục quân Cộng hòa Tự do (chapter006_002/p000253–p000273): trần thuật ngôi thứ ba tiếp tục quy chiếu Tướng de Lugo bằng `ông ta` (`p000254`), lực lượng Cộng hòa bằng `họ` / `mình`, và lực lượng Đế quốc bằng `chúng` / `nó`; độc thoại nội tâm trực tiếp in nghiêng của de Lugo và tập thể quân Cộng hòa dùng `chúng ta` / `ta` / `mình` (`p000256`, `p000257`, `p000261`, `p000266`, `p000268`, `p000273`); trong thoại chỉ huy, de Lugo gọi thuộc cấp là `thưa các quý ông` và xưng `Chúng ta` (`p000263`, `p000271`), các sĩ quan đồng thanh đáp `“““Rõ, thưa ngài!”””` (`p000272`) / Nửa sau tại ngoại ô Căn cứ Hải quân Turus theo điểm nhìn điệp viên John (chapter006_002/p000274–p000288): trần thuật ngôi thứ ba quy chiếu John nhất quán bằng `anh` (và `mình` trong cấu trúc phản thân), độc thoại nội tâm in nghiêng tự xưng `mình` (`p000287`, `p000288`), lời thoại và lời than thở thành tiếng xưng `tôi` (`p000275`, `p000286`); thương nhân du mục gọi John là `Vị khách quý` / `ngài` và xưng `chúng ta` (`p000285`)"
  alternatives_vi:
  - ông (thay cho `anh` khi quy chiếu điệp viên John trong trần thuật tại chapter006_002/p000277–p000284, p000287–p000288 — ưu tiên `anh` để giữ liền mạch tuyệt đối với giọng trần thuật đã khóa cho John tại `ch-02-b19` đến `ch-02-b21`) / tôi (thay cho `mình` trong câu độc thoại nội tâm của de Lugo tại `p000261` và của John tại `p000287`, `p000288` — ưu tiên `mình` theo `DEC-P01-001` để phân biệt rõ suy nghĩ nội tâm với lời phát ngôn trực tiếp)
