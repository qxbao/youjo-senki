  proposed_vi: "xuất kích (chapter006_002/p000253) / Tình báo Khối Thịnh vượng chung, trinh sát, Turus (chapter006_002/p000254, p000255, p000283) / Lục quân Đế quốc, Lục quân Cộng hòa Tự do (chapter006_002/p000255, p000277) / phương pháp chuẩn mực theo sách giáo khoa (chapter006_002/p000256) / quân Cộng hòa, các mục tiêu chiến lược, de Lugo, công binh dã chiến, bãi mìn, bộ binh (chapter006_002/p000259, p000262, p000267, p000269, p000273) / màn nghi binh (chapter006_002/p000260) / Đế quốc, các tuyến tiếp tế, tập trung lực lượng, lực lượng Đế quốc (chapter006_002/p000261, p000266–p000268, p000273) / cuộc tiến quân phân tán (chapter006_002/p000262) / quân tinh nhuệ, làn đạn giao nhau, các đơn vị hạng nhẹ cơ động nhanh, các đơn vị hạng nặng (chapter006_002/p000268) / cựu binh dày dạn kinh nghiệm, các cường quốc (chapter006_002/p000270) / sĩ khí, cuộc phản công (chapter006_002/p000273) / Năm Thống nhất 1925, ngoại ô Căn cứ Hải quân Turus, Căn cứ Hải quân Turus (chapter006_002/p000274, p000276, p000277) / các bộ tộc du mục, những người du mục (chapter006_002/p000276–p000278, p000280) / John, các loại nước hãm, chính quốc (chapter006_002/p000278, p000279, p000282, p000287) / đoàn lữ hành (chapter006_002/p000280) / mạng lưới tình báo (chapter006_002/p000281) / quỹ mật (chapter006_002/p000286) / tinh thần John Bull (chapter006_002/p000287) / Whitehall, tư tưởng của giới tài chính thành thị (chapter006_002/p000288)"
