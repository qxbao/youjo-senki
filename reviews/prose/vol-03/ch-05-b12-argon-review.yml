- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000204
  locks:
  - "Giữ đại từ `cô`, các định danh `Trường Đại học Chiến tranh`, `sĩ quan Bộ Tổng tham mưu`, `sĩ quan ma pháp` và lời đánh giá đáp ứng mọi tiêu chuẩn đáng mong đợi ở một sĩ quan."
