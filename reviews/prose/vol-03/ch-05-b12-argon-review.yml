- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000199
  locks:
  - "Giữ tên riêng `Romel`, đại từ `ông`, các cụm `chiến dịch phía nam`, `một đám quân tuyến hai chắp vá`, `Bộ Tổng tham mưu` và việc không nhận được câu trả lời thỏa đáng."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000200
  locks:
  - "Giữ các thuật ngữ `tiểu đoàn pháp sư tăng cường`, `bộ phận Hậu cần và Cục Tác chiến trong Bộ Tổng tham mưu`, `đơn vị tuyến đầu` và ba phẩm chất `trang bị bài bản, kinh nghiệm thực chiến cùng đội hình đầy đủ`."
