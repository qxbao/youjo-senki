  volume: vol-03
  chapter: 5
  rationale: "Kế thừa đồng bộ hệ thuật ngữ cơ quan chỉ huy, cấp bậc, học thuyết và biên chế từ các batch trước (`Bộ Tổng tham mưu`, `Trung tướng von Zettour`, `Lục quân Đế quốc`, `chiến lược tuyến nội địa`, `lục địa phía nam`, `Norden`, `Khối Thịnh vượng chung`, `Cộng hòa`, `sư đoàn bộ binh nhẹ`, `mặt trận Rhine`, `bộ phận Hậu cần`, `Cục Tác chiến`, `sĩ quan cấp tá`, `Trường Đại học Chiến tranh`, `sĩ quan ma pháp`); khóa tạm các thuật ngữ mới phát sinh trong batch gồm cặp phe phái `phe kiểm soát tổn thất` / `phe hiếu chiến` (p000178, p000183), nhóm thuật ngữ hậu cần đường biển `các tàu hộ tống đoàn vận tải` / `các tàu vận tải` / `các đơn vị chi viện trực tiếp` / `hoạt động hộ tống đoàn tàu` (p000180–p000182, p000185–p000186), danh xưng `Tướng von Romel` (p000198), `tiểu đoàn pháp sư tăng cường` (p000200) và `sĩ quan Bộ Tổng tham mưu` (p000204)."
  uncertainty: low
  status: pending
  canon: false
- source_term: zettour_and_romel_perspective_pronouns_vol03_ch05_b12
  proposed_vi: "Trần thuật ngôi thứ ba tại Bộ Tổng tham mưu (p000176–p000193): quy chiếu `Bộ Tổng tham mưu`, `phe kiểm soát tổn thất`, `Lục quân Đế quốc` và phe đối phương (`Khối Thịnh vượng chung và Cộng hòa` ở p000187) bằng `họ`; quy chiếu `kẻ địch` trực diện trên chiến trường ở p000191 bằng `Chúng` / Trần thuật ngôi thứ ba gắn với điểm nhìn của `Tướng von Romel` (p000195–p000204): quy chiếu Romel bằng `Ông` / `ông`; quy chiếu hai sư đoàn thuộc quyền bằng `họ`; quy chiếu vị nữ chỉ huy tiểu đoàn pháp sư tăng cường qua hồ sơ đánh giá nhân sự (p000203–p000204) bằng `cô`"
  alternatives_vi:
  - cô ấy (thay cho `cô` khi quy chiếu vị chỉ huy tiểu đoàn pháp sư tăng cường trong hồ sơ đánh giá tại chapter005_004/p000203–p000204 — ưu tiên `cô` để đồng bộ với cách quy chiếu `Thiếu tá von Degurechaff` từ góc nhìn của các tướng lĩnh cấp cao trong `vol-03-ch-05-b07`, đồng thời tuân thủ nghiêm ngặt DEC-P01-001 không dùng `nó` ngoài trần thuật trực tiếp theo điểm nhìn của Tanya)
