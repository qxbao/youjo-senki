  proposed_vi: "Bộ Tổng tham mưu (chapter005_004/p000176, p000190, p000192, p000199, p000200) / lục địa phía nam (chapter005_004/p000177, p000179, p000184, p000195) / phe kiểm soát tổn thất, Trung tướng von Zettour, phe hiếu chiến, thành quả chiến tranh (chapter005_004/p000178, p000183, p000191, p000193) / các tuyến tiếp tế (chapter005_004/p000179) / các tàu hộ tống đoàn vận tải (chapter005_004/p000180) / các tàu vận tải, tàu vận tải (chapter005_004/p000181, p000185) / các đơn vị chi viện trực tiếp (chapter005_004/p000182) / sĩ quan hậu cần, Lục quân Đế quốc, chiến lược tuyến nội địa (chapter005_004/p000183, p000185, p000188) / phần lãnh thổ Đế quốc chiếm đóng tại Norden, năng lực vận tải đường biển (chapter005_004/p000185) / quốc gia lục địa, các tuyến hàng hải huyết mạch, hoạt động hộ tống đoàn tàu (chapter005_004/p000186) / Khối Thịnh vượng chung, Cộng hòa, nền tảng công nghiệp tương đối tại các thuộc địa (chapter005_004/p000187) / các khu vực mới nằm trong phạm vi ảnh hưởng của Đế quốc (chapter005_004/p000188) / NGÀY 4 THÁNG 9, NĂM THỐNG NHẤT 1925, THỦ ĐÔ ĐẾ QUỐC (chapter005_004/p000194) / danh sách biên chế (chapter005_004/p000196) / sư đoàn bộ binh nhẹ, tân binh và quân dự bị, cựu binh (chapter005_004/p000197) / mặt trận Rhine, Tướng von Romel, Romel (chapter005_004/p000198, p000199) / chiến dịch phía nam, quân tuyến hai (chapter005_004/p000199) / tiểu đoàn pháp sư tăng cường, bộ phận Hậu cần và Cục Tác chiến trong Bộ Tổng tham mưu, đơn vị tuyến đầu (chapter005_004/p000200) / học viện, chuẩn sĩ quan cấp tá (chapter005_004/p000203) / Trường Đại học Chiến tranh, sĩ quan Bộ Tổng tham mưu, sĩ quan ma pháp (chapter005_004/p000204)"
  alternatives_vi:
  - phe cắt giảm tổn thất / phe chủ chiến (thay cho `phe kiểm soát tổn thất` / `phe hiếu chiến` tại chapter005_004/p000178, p000183 — ưu tiên `phe kiểm soát tổn thất` / `phe hiếu chiến` vì phản ánh sát nghĩa literal của `loss control faction` và `aggressive faction` trong cuộc tranh luận về việc giới hạn chi phí – rủi ro hậu cần đối lập với mở rộng thành quả chiến tranh) / các tàu hộ tống (thay cho `các tàu hộ tống đoàn vận tải` tại chapter005_004/p000180 — ưu tiên `các tàu hộ tống đoàn vận tải` để làm rõ chức năng bảo vệ đoàn tàu biển trước khi nhắc đến `các tàu vận tải` ở p000181 và `hoạt động hộ tống đoàn tàu` ở p000186) / sĩ quan tham mưu (thay cho `sĩ quan Bộ Tổng tham mưu` tại chapter005_004/p000204 — ưu tiên `sĩ quan Bộ Tổng tham mưu` vì nguồn ghi rõ `general staff officer`, phân biệt với sĩ quan tham mưu cấp đơn vị thông thường)
