- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000091
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách gọi “Tướng von Rudersdorf”, ngôi xưng “tôi – ông / chúng ta”, các địa danh “phòng tuyến Rhine”, “Parisii” và giới hạn bảo đảm không quá “tám quả đạn pháo mỗi ngày”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000092
