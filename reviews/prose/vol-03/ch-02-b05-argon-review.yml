- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000093
  locks:
  - "Giữ dấu ngoặc kép hội thoại, giới hạn “chỉ bao gồm các loại đạn pháo dưới 155 mm”, điều kiện duy trì ngắn hạn ở mức tối ưu và cảnh báo “Các tuyến tiếp tế của chúng ta đang tiến gần tới giới hạn rồi.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000094
  locks:
  - "Giữ dấu ngoặc kép hội thoại, câu hỏi bất bình “Không có pháo hạng nặng và chỉ có tám quả đạn cho mỗi khẩu pháo thôi ư?” và câu cảm thán “Ông đùa tôi đấy chắc.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000095
  locks:
  - "Giữ tên “Zettour”, “Rudersdorf”, đại từ “ông”, “hai người” và chi tiết các sĩ quan tham mưu quanh đó kinh ngạc ngoái nhìn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000096
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng toàn đoạn `*Không đời nào có thể đánh đấm gì được với cơ số đạn pháo như thế.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000097
  locks:
  - "Giữ câu trần thuật ngắn “Những lời ấy đã trực trào nơi đầu lưỡi của ông.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000098
  locks:
  - "Giữ dấu ngoặc kép hội thoại, điều kiện không dùng được đường sắt của địch nên phải trông cậy vào ngựa kéo và xe tải, cùng chi tiết đã trưng dụng mọi thứ có thể từ “các cụm tập đoàn quân khu vực và hai vùng lãnh thổ chiếm đóng”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000099
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “bộ phận Hậu cần”, thuật ngữ “trận đấu pháo” và mệnh đề điều kiện bỏ lửng về mức tối thiểu “bốn mươi bốn quả đạn cho mỗi khẩu pháo mỗi ngày…”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000100
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các thuật ngữ “công binh dã chiến”, “đường sắt khổ hẹp”, “vùng đất giữa hai chiến tuyến” và thực trạng thiếu ngựa, cạn cỏ khô dự trữ, trái mùa thu mua tại chỗ khiến chỉ riêng việc tải tám quả đạn pháo cùng lương thực ra tiền tuyến cũng đủ làm ngựa kiệt sức gục ngã."
