- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000075
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng “chúng ta” và câu bông đùa châm biếm rằng nếu họ tấn công thì chỉ cần gọi một viên cảnh sát tới bắt giữ vì tình nghi vi phạm luật nhập cư."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000076
  locks:
  - "Giữ các định danh “Công quốc Dacia”, “Khối Thịnh vượng chung”, “Đế quốc” và phép so sánh về mặt quân số cùng tính chất đảo quốc khiến cả hai chiều tiếp cận đều khó khăn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000077
  locks:
  - "Giữ điều kiện vận chuyển binh lính bằng đường biển, giả định nhượng bộ về việc vượt chặng đường dài trên mặt nước và nhận định quy mô “quân thường trực của Khối Thịnh vượng chung” không đủ lớn để thành mối đe dọa nghiêm trọng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000078
  locks:
  - "Giữ các định danh “Khối Thịnh vượng chung”, “mặt trận Rhine”, thuật ngữ “cấp độ chiến thuật”, ước tính hào phóng tối đa “mười sư đoàn” và sự tương phản với hơn một trăm sư đoàn đang giao chiến."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000079
  locks:
  - "Giữ cấu trúc tăng tiến phủ định giữa “cấp độ chiến dịch” và “cấp độ chiến lược”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000080
  locks:
  - "Giữ dấu ngoặc kép hội thoại, sự thừa nhận đối với “lực lượng lục quân”, khoảng cách sức mạnh không thể bàn cãi giữa hải quân hai bên và mối lo ngại nếu bị áp đặt lệnh phong tỏa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000081
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng “tôi – ông”, tên gọi “Zettour”, thuật ngữ “cà phê thay thế” và mong muốn sớm kết thúc cuộc chiến thay vì kéo dài."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000082
  locks:
  - "Giữ các định danh “Khối Thịnh vượng chung”, “Hải quân Hoàng gia”, “Hải quân Đế quốc”, “Hải quân Cộng hòa”, “hạm đội bản thổ”, “hạm đội eo biển” và toàn bộ các tầng giả định so sánh tương quan lực lượng hải quân."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000083
  locks:
  - "Giữ cụm chuyển ý ngắn “Mặt khác…”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000084
  locks:
  - "Giữ câu nhận định ngắn “Cũng chỉ có vậy.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000085
  locks:
  - "Giữ điều kiện thiếu “đòn dứt điểm” thì việc gườm nhau bao lâu tùy thích cũng chỉ dẫn tới “một thế bế tắc bất tận”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000086
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu thúc giục ngắn gọn “Hãy giải quyết cho xong chuyện này đi.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000087
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng “tôi – ông”, sự đồng tình muốn kết thúc cuộc chiến càng sớm càng tốt và câu hỏi xác nhận “ông muốn tiến hành kế hoạch đó tới cùng sao?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000088
  locks:
