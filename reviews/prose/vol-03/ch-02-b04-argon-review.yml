locked_choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000051
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng toàn đoạn `*Vậy là họ đang bảo chúng ta phải thiết lập lại môi trường an ninh quốc gia trở về như trước khi cuộc xung đột nổ ra ư?*` theo DEC-P01-002 và ngữ khí câu hỏi nội tâm của Rudersdorf."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000052
  locks:
  - "Giữ đại từ “Ông”, thuật ngữ “lý thuyết cân bằng quyền lực”, định danh “Khối Thịnh vượng chung” và kết luận rằng đề xuất chỉ là thứ họ mong muốn cho chính bản thân họ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000053
  locks:
  - "Giữ nhận định hiểu lý lẽ của động thái ngoại giao nhân danh lợi ích quốc gia nhưng sự thiên vị cũng có giới hạn, phần trần thuật để phẳng và chỉ in nghiêng đúng câu hỏi cuối `*Chẳng lẽ không có khả năng nào là họ viết cái này như một trò đùa sao?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000054
  locks:
  - "Giữ sự tương đồng khi “người đối diện cũng mang vẻ mặt bối rối chẳng kém”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000055
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng câu nhận thức nội tâm `*À, thảo nào trên mặt ông ấy lại có vẻ kỳ lạ như thế.*` theo DEC-P01-002, đại từ “ông ấy” quy chiếu Zettour và đánh giá “đề xuất ngoại giao lạc quẻ, được viết bằng giọng điệu vị kỷ đến mức nực cười”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000056
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng “tôi – chúng ta”, các định danh “Khối Thịnh vượng chung”, “Hạm đội Biển khơi”, điều kiện cảnh báo nguy cơ can thiệp nếu phớt lờ và chi tiết một phần hạm đội đã bắt đầu cơ động."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000057
  locks:
  - "Giữ định danh “Khối Thịnh vượng chung” và sự trăn trở ẩn sau vẻ mặt khó hiểu nhằm tìm hiểu động cơ đằng sau thông điệp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000058
  locks:
  - "Giữ các định danh “Khối Thịnh vượng chung”, “Đế quốc”, phủ định “hoàn toàn không biết giới chức Khối Thịnh vượng chung đang nghĩ gì” và nhận xét bản thông báo sặc mùi vị kỷ như thể cố tình phô trương lợi ích riêng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000059
  locks:
  - "Giữ các định danh “Đế quốc”, “Khối Thịnh vượng chung”, khẳng định câu trả lời khả dĩ duy nhất là từ chối và suy luận điều kiện: nếu đề xuất đưa ra với dự tính bị khước từ thì nghĩa là họ muốn có cớ tấn công Đế quốc."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000060
  locks:
  - "Giữ câu hỏi nghi vấn để phẳng không in nghiêng “Nhưng nếu vậy… sao không gửi thẳng một tối hậu thư luôn đi?” theo đúng nguồn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000061
  locks:
  - "Giữ câu hỏi hoài nghi về việc “những gã keo kiệt đó” thò cổ vào cuộc chiến trên lục địa không có lợi lộc gì, sự bất định “Chẳng ai dám chắc về điểm đó” và nhận định mục đích của “Khối Thịnh vượng chung” gần như không tài nào đoán định nổi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000062
  locks:
  - "Giữ tên “Zettour” và phủ định “ông không thể tìm ra cách nào để lý giải tình hình cho thật thỏa đáng, ngay cả với chính bản thân mình”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000063
  locks:
  - "Giữ dấu ngoặc kép hội thoại, phủ định “vẫn chưa xác nhận được đợt tổng động viên lực lượng lục quân nào”, phỏng đoán “động thái phô trương ngoại giao” và câu hỏi xác nhận chưa có tối hậu thư."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000064
  locks:
  - "Giữ dấu ngoặc kép hội thoại, hai phủ định liên tiếp về tối hậu thư lẫn dấu hiệu tổng động viên, cùng câu hỏi về mưu tính của “Khối Thịnh vượng chung”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000065
  locks:
  - "Giữ dấu ngoặc kép hội thoại, câu hỏi về căn nguyên từ tình hình nội bộ và giả định đây là cách lách qua nghị viện, né tránh đòi hỏi từ chính trị nội bộ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000066
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Bộ Tư lệnh Tối cao”, “Vùng Đất Thấp”, ngôi xưng “tôi – chúng ta” và sự tự hiệu chỉnh từ câu hỏi “ván đã đóng thuyền rồi nhỉ?” sang khẳng định “đã vượt sông Rubicon ngay từ khoảnh khắc biến Vùng Đất Thấp thành mồi nhử rồi”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000067
  locks:
  - "Giữ tên hai vị tướng “Zettour”, “Rudersdorf”, định danh “Đế quốc” và nhận thức không còn nhiều lựa chọn nên chỉ cần chọn phương án tốt nhất cho tình hình hiện tại."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000068
  locks:
  - "Giữ định danh “Bộ Tổng tham mưu Lục quân Đế quốc”, việc không để tạp âm bên ngoài làm phân tâm và bổn phận tiến về phía trước."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000069
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Reich” và lời khẳng định do dự sẽ dẫn tới sự sụp đổ của Reich nên chỉ có thể tiếp tục tiến bước."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000070
  locks:
  - "Giữ các định danh “Lục quân Cộng hòa”, “cánh cửa xoay” kèm ký hiệu chú thích chân trang “³”, “khu công nghiệp phía tây”, “Cộng hòa”, chi tiết tái tổ chức chiến tuyến bất chấp phản đối đáng kể và ẩn dụ phất tấm áo choàng đỏ trước mặt con bò tót đang điên tiết để nhử nó vào tử địa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000071
  locks:
  - "Giữ cấu trúc điều kiện giả định sinh tử “Nếu họ không hạ gục con bò tót chỉ bằng một đòn, chính họ sẽ là kẻ bị húc đến chết.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000072
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Khối Thịnh vượng chung” và hai câu hỏi ước tính chưa tới mười sư đoàn có thể triển khai."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000073
  locks:
  - "Giữ tên “Rudersdorf”, địa danh “mặt trận Rhine” và nhận định dù họ can thiệp cũng chẳng ảnh hưởng bao nhiêu nên không có gì đáng lo ngại."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000074
  locks:
  - "Giữ dấu ngoặc kép hội thoại và đầy đủ các con số ước tính lực lượng: “bảy hay tám sư đoàn, cộng thêm một hoặc hai sư đoàn kỵ binh”, “một vài lữ đoàn” và “một lực lượng không quân ở mức độ nhất định có khả năng tấn công các mục tiêu mặt đất”."
