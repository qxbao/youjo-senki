- source_term: romel_and_degurechaff_command_terms_and_kampfgruppe_vol03_ch05_b14
  proposed_vi: "Cụm tập đoàn quân phương Bắc, Cụm tập đoàn quân phương Tây (chapter005_004/p000236) / tiểu đoàn pháp sư, cơ cấu chỉ huy, sư đoàn, hệ thống chỉ huy tách biệt (chapter005_004/p000237) / Thiếu tá von Degurechaff (chapter005_004/p000238, p000259) / Romel (chapter005_004/p000239, p000240, p000241, p000262, p000264, p000267, p000273) / Bộ Tổng tham mưu (chapter005_004/p000242) / Tướng von Romel (chapter005_004/p000243) / Tướng quân (chapter005_004/p000248, p000253) / ngôn ngữ chính thức của Đế quốc, lối Đế quốc tiêu chuẩn (chapter005_004/p000249) / Hội chứng Tiền tuyến (chapter005_004/p000258) / Lục quân Đế quốc, con chó canh gác cho quốc gia (chapter005_004/p000261) / Thiếu tá (chapter005_004/p000263) / kho đạn (chapter005_004/p000269) / nhà chiến lược (chapter005_004/p000270) / nhiệm vụ cơ động ứng chiến, nhóm thứ hai, Kampfgruppe Bảy, các Kampfgruppe, tiểu đoàn đơn lẻ (chapter005_004/p000274)"
  alternatives_vi:
  - Cụm tác chiến số Bảy / các Cụm tác chiến (thay cho `Kampfgruppe Bảy` / `các Kampfgruppe` tại chapter005_004/p000274 — ưu tiên giữ thuật ngữ vay mượn tiếng Đức `Kampfgruppe Bảy` / `các Kampfgruppe` theo nguyên bản để phản ánh đúng cơ cấu tổ chức chiến thuật đặc thù của quân đội Đế quốc tại chiến trường phía nam mà không đánh đồng với các từ chỉ nhóm/đơn vị chung như `group` ngay câu trước) / nhiệm vụ biệt phái cơ động (thay cho `nhiệm vụ cơ động ứng chiến` tại chapter005_004/p000274 — ưu tiên `nhiệm vụ cơ động ứng chiến` vì lột tả sát bản chất tác chiến cơ động độc lập xử lý tình huống của `flying mission` được làm rõ thêm ở p000275)
