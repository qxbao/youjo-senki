  volume: vol-03
  chapter: 5
  rationale: "Kế thừa đồng bộ hệ thống cấp bậc, cơ quan chỉ huy và danh xưng từ các batch trước (`Cụm tập đoàn quân phương Bắc`, `Cụm tập đoàn quân phương Tây`, `tiểu đoàn pháp sư`, `Thiếu tá von Degurechaff`, `Tướng von Romel`, `Bộ Tổng tham mưu`, `Lục quân Đế quốc`); khóa tạm các thuật ngữ phát sinh ở cuối chương 5 gồm `Hội chứng Tiền tuyến` (p000258), `nhiệm vụ cơ động ứng chiến` và định danh `Kampfgruppe Bảy` / `các Kampfgruppe` (p000274)."
  uncertainty: low
  status: pending
  canon: false
- source_term: romel_and_degurechaff_dialogue_and_monologue_register_vol03_ch05_b14
  proposed_vi: "Trần thuật ngôi thứ ba theo điểm nhìn của `Tướng von Romel` (p000236–p000281): quy chiếu Romel bằng `ông` / `Ông`, quy chiếu `Thiếu tá von Degurechaff` bằng `cô` / `Cô` / Lời thoại trực tiếp của Romel với Degurechaff (p000238, p000242, p000252, p000263, p000270, p000274): tự xưng `ta` / `Ta`, gọi Degurechaff là `cô` (và `các cô` khi chỉ chung cả tiểu đoàn ở p000274) / Lời thoại của Degurechaff với Romel (p000243, p000246, p000248, p000253, p000266, p000276): hô ngữ `Thưa Tướng von Romel` / `thưa Tướng quân`, tự xưng `tôi` / `mình` (và `chúng tôi` khi đại diện đơn vị), gọi Romel là `ngài` / Độc thoại nội tâm trực tiếp in nghiêng của Romel (p000245, p000250, p000261, p000262, p000264, p000271, p000272, p000275, p000278–p000281): tự quy chiếu `mình`, quy chiếu Degurechaff bằng `cô ta` (và `Con bé` tại p000250) / Câu giả định lời đe dọa ngầm của Degurechaff trong suy nghĩ của Romel (p000259): `Ông` – `tôi`"
  alternatives_vi:
  - tôi – cô (thay cho `ta` – `cô` trong lời thoại trực tiếp của Romel với Degurechaff tại chapter005_004/p000238, p000263, p000270, p000274 — ưu tiên `ta` – `cô` để nối tiếp tự nhiên giọng uy quyền của tướng tư lệnh chiến trường đã xác lập từ p000223 của batch b13 và phản ánh đúng khoảng cách cấp bậc Tướng – Thiếu tá)
