locked_choices:
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000041
  locks:
  - "Giữ dấu ngoặc kép hội thoại và mệnh lệnh quát nạt ngắn gọn kèm cấp hàm: `“Thôi ngay đi, Thiếu tá!”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000042
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh `Quân cảng Brest`, `Đế quốc`, cặp xưng hô `Chúng ta / tôi – ngài` và cấu trúc tương phản ở câu cuối khẳng định đây không phải điều bản thân mong muốn nhưng buộc phải hủy diệt Quân cảng Brest vì bổn phận người lính."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000043
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Thiếu tá` và lời bác bỏ dứt khoát: `“Thiếu tá, sẽ không có chuyện đó đâu!”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000044
  locks:
  - "Giữ đại từ `Ông` (chỉ huy căn cứ) và `nó` (Tanya theo DEC-P01-001), cùng hình ảnh so sánh `tiếng gào khóc như lời cầu nguyện của nó`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000045
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu ba chấm đầu câu và lời xin phép tự mình đi: `“…Vậy xin ngài hãy cho phép tôi đi được không?”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000046
  locks:
  - "Giữ dấu ngoặc kép hội thoại và mệnh lệnh gạt phăng: `“Từ bỏ đi!”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000047
  locks:
  - "Giữ dấu ngoặc kép hội thoại và tiếng gọi ngăn cản: `“Thiếu tá!”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000048
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, ngôi `tôi` và sắc thái khẳng định thẩm quyền vốn có (`lẽ ra tôi đã có sẵn thẩm quyền để làm việc này rồi`)."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000049
  locks:
  - "Giữ các cụm `chỉ huy căn cứ`, `lệnh ngừng bắn`, `Thiếu tá von Degurechaff`, đại từ `nó` theo DEC-P01-001 và bảo toàn chính xác phạm vi chữ nghiêng ở mệnh đề bác bỏ cuối đoạn theo DEC-P01-002: `*Tôi cóc cần biết.*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000050
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các thuật ngữ `Bộ Tổng tham mưu`, `nhiệm vụ trinh sát chiến đấu` và tuyên bố đơn phương thực thi nhiệm vụ theo thẩm quyền được trao."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000051
  locks:
  - "Giữ đại từ `nó` và `mình` theo DEC-P01-001, đồng thời bảo toàn nguyên trạng danh từ `vị tướng` theo đúng văn bản nguồn (không tự hợp thức hóa theo cấp hàm Đại tá ở đầu cảnh)."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000052
  locks:
  - "Giữ cụm `Đám quân cảnh`, đại từ `nó` trong trần thuật, ngôi `chúng ta – cô ta` trong lời kể lại về sau, dấu nháy đơn quanh từ `‘khử’` và cấu trúc giả định quá khứ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000053
  locks:
  - "Giữ cụm `sở chỉ huy`, tên `Tanya` và câu chuyển vào mạch độc thoại nội tâm khi liếc nhìn các sĩ quan đang họp khẩn."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000054
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng `*Thiếu tướng de Lugo…*` ở đầu đoạn theo DEC-P01-002, nhịp tăng tiến đánh giá cái tên cực kỳ gở miệng và liên tưởng lịch sử tới chuyện `thử vũ khí hạt nhân hoặc rút khỏi NATO`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000055
  locks:
  - "Giữ đại từ nội tâm `Mình`, ngôi gộp `Chúng ta`, đại từ `hắn`, định danh `Cộng hòa Tự do` và quyết tâm không để hắn trốn thoát."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000056
  locks:
  - "Giữ đại từ `Mình / chúng ta`, cụm `ban chỉ huy` và câu hỏi tự vấn về phương thức tự mình tấn công để kết thúc cuộc chiến."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000057
  locks:
  - "Giữ đại từ `mình`, tên riêng `Rudel`, thuật ngữ `tòa án binh` và lập luận đánh giá rủi ro có thể chấp nhận được khi tấn công một quốc gia thù địch."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000058
  locks:
  - "Giữ giả định mở đầu `Cứ cho là chúng ta sẽ tấn công đi.` và sự đối lập giữa việc đã cố hết sức tranh luận vừa rồi với thực tế không còn ở vị thế nhận được hỗ trợ chính thức."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000059
  locks:
  - "Giữ sắc thái phỏng đoán (`Có lẽ`, `Chắc hẳn`), đại từ `mình / chúng ta` và các thuật ngữ `chiếc tàu ngầm`, `các quả V-1`, `tuyến tuần tra`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000060
  locks:
  - "Giữ cụm `đón người trên mặt nước` và nhận định an toàn hơn nếu ngay từ đầu không trông cậy vào phương án chưa được thu xếp trước do nguy cơ hai bên không tìm thấy nhau."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000061
  locks:
  - "Giữ đại từ `Mình / chúng ta`, định danh `số V-1`, `Brest` và nhận định có thể đột phá tới Brest mà không gặp trở ngại nào."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000062
  locks:
  - "Giữ đại từ `mình`, định danh `Tướng de Lugo` và cách nói uyển ngữ mỉa mai `tiễn Tướng de Lugo rời khỏi cõi đời này`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000063
  locks:
  - "Giữ ẩn dụ kinh doanh `vụ thâu tóm thù địch nhắm vào một công ty mới nổi đầy triển vọng`, các cụm `bằng sáng chế cùng tài sản`, `loại bỏ mọi mối đe dọa tương lai đối với công ty` và kết luận khử `hắn` ngay bây giờ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000064
  locks:
  - "Giữ đại từ `Mình / chúng ta` và nỗi ám ảnh bị lịch sử chế giễu vì `sự do dự phi lý vào đúng lúc lẽ ra phải can thiệp`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000065
  locks:
  - "Giữ nguyên dấu ngoặc kép mở không đóng ở cuối đoạn theo đúng quy ước thoại nhiều đoạn của nguồn: `“Tiểu đoàn, nghiêm!`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000066
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách gọi `toàn quân`, ngôi `Chúng ta` và mệnh lệnh `tấn công Quân cảng Brest`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000067
  locks:
  - "Giữ tên `Tanya`, đại từ `nó` và `mình` theo DEC-P01-001, cùng sự tương phản giữa phong thái tuyên bố mục tiêu thường ngày với sự sững sờ khi thấy vẻ mặt căng thẳng của các sĩ quan."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000068
  locks:
  - "Giữ định danh `Trung úy Weiss vốn hiểu chuyện`, tên `Tanya`, đại từ `mình` và chi tiết các sĩ quan đều lộ vẻ chết lặng khiến Tanya nhận ra lời mình vừa nói nghe thật kỳ quặc."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000069
  locks:
  - "Giữ đại từ `nó` và `mình` theo DEC-P01-001, sự đối lập giữa kỳ vọng đám lính hiếu chiến sẽ vui mừng với thực tế họ chết lặng, cùng câu nhận xét ngắn `Thật hơi đáng xấu hổ.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000070
  locks:
  - "Giữ đại từ nội tâm `Mình` và suy nghĩ rằng họ vốn luôn chăm chăm truy kích kẻ địch tới bất cứ đâu nếu điều đó mang lại thêm chiến tích."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000071
  locks:
  - "Giữ góc nhìn `người xuất thân từ ngành nhân sự`, đại từ `mình` và chuỗi suy luận tự trách rằng nếu người quản lý không hiểu được hy vọng và ước mơ của đám lính dưới quyền thì chỉ có thể là do bản thân yếu kém."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000072
  locks:
  - "Giữ dấu ba chấm đầu câu, thành ngữ `Dục tốc bất đạt.`, đại từ `mình` và quyết định tạm hoãn đưa ra phán xét để bình tĩnh suy nghĩ."
