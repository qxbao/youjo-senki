- source_term: tanya_dual_perspective_and_command_register_vol03_ch06_b22
  proposed_vi: "Trong trần thuật và độc thoại nội tâm đan xen của Tanya (`p000700`–`p000702`, `p000704`, `p000705`, `p000707`–`p000709`, `p000711`–`p000718`, `p000720`–`p000729`): tuân thủ nghiêm ngặt `DEC-P01-001`, quy chiếu ngôi thứ ba Thiếu tá Tanya von Degurechaff bằng `nó` (`p000700`, `p000701`, `p000711`, `p000712`, `p000715`, `p000720`–`p000722`, `p000727`) và tự quy chiếu ngôi thứ nhất trong độc thoại nội tâm bằng `mình` (`p000700`); khi quy chiếu chung toàn đơn vị hoặc phe Đế quốc trong suy tư chiến lược dùng `chúng ta` (`p000716`, `p000718`, `p000725`, `p000726`, `p000729`). Trong lời ra lệnh và cảm thán trực tiếp của Tanya (`p000703`, `p000706`, `p000710`, `p000719`): tiếp nối liền mạch `ch-06-b21`, gọi thuộc cấp trong tiểu đoàn là `Những người còn lại` (`p000703`) và `các vị` (`p000706`), xưng `chúng ta` (`p000703`) hoặc `Tôi` (`p000710`), và gọi quân Cộng hòa bị nhử vào bẫy là `đám đầu gỗ` / `lũ khờ này` / `chúng`"
  alternatives_vi:
  - "cô (thay cho `nó` khi quy chiếu Tanya ở ngôi thứ ba trong trần thuật tại `p000700`, `p000701`, `p000711`, `p000712`, `p000715`, `p000720`–`p000722`, `p000727` — bắt buộc giữ `nó` theo quyết định canon `DEC-P01-001`) / tôi (thay cho `mình` trong độc thoại nội tâm tự quy chiếu tại `p000700` — bắt buộc giữ `mình` theo `DEC-P01-001`, chỉ dùng `Tôi` trong câu thoại trực tiếp tại `p000710`)"
