  rationale: "Kế thừa đồng bộ toàn bộ hệ thuật ngữ quân sự, cấp bậc, chức danh và địa chính trị đã khóa từ các batch trước (`đội hậu vệ`, `mồi nhử`, `công thức`, `Thiếu tá Tanya von Degurechaff`, `Thượng úy Weiss`, `Tướng von Zettour` / `Trung tướng von Zettour`, `Trung tướng von Rudersdorf`, `Vương quốc Ildoa`, `Khối Thịnh vượng chung`, `Lục quân Đế quốc`, `Lục quân Cộng hòa`, `lục địa phía nam`, `cuộc bắn gà tây`), đồng thời khóa tạm cách dịch tự nhiên, chuẩn xác cho các thuật ngữ tác chiến không gian ba chiều và hậu cần sa mạc trong lô (`không phận D-3`, `đội hình hình nón`, `đan chéo đường bắn`, `căn cứ sa mạc`, `tuyến tiếp tế`)."
