- source_term: tanya_pov_blend_and_radio_command_register_vol03_ch06_b03
  proposed_vi: "Trần thuật ngôi thứ ba pha trộn độc thoại nội tâm theo điểm nhìn Tanya: quy chiếu Tanya ở ngôi thứ ba bằng `nó` (chapter006_002/p000073–p000075, p000079, p000080, p000083, p000085, p000087, p000089, p000090, p000093) và tự quy chiếu ở ngôi thứ nhất bằng `mình` / số nhiều bao gộp `chúng ta` tại các mệnh đề nội tâm trực tiếp (chapter006_002/p000069–p000073, p000075, p000077, p000081, p000089, p000095); chủ thể khái quát dùng `người ta` (chapter006_002/p000077, p000091, p000093); quy chiếu Weiss bằng `Anh` / `Anh ta` (chapter006_002/p000079, p000081) và Đại úy Carlos bằng `anh ta` (chapter006_002/p000093, p000094) / Lời thoại tác chiến và liên lạc vô tuyến: mệnh lệnh diệt bắn tỉa tại chỗ giữ giọng gắt, dứt khoát (chapter006_002/p000076, p000078); liên lạc vô tuyến giữa Tanya (`Thiếu tá von Degurechaff`) với nhân viên điện đài và `Đại úy Carlos` (`Tiểu đoàn 44`) dùng cặp đại từ `Tôi` – `anh`, giữ thái độ điềm tĩnh, lịch thiệp nhưng chuẩn mực quân ngũ (chapter006_002/p000087, p000092, p000097)"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật về Tanya — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / cậu (thay cho `anh` khi Tanya nói chuyện qua vô tuyến với Đại úy Carlos tại chapter006_002/p000097 — ưu tiên `anh` để giữ sắc thái giao tiếp công vụ lịch thiệp giữa chỉ huy Kampfgruppe và sĩ quan chỉ huy tiểu đoàn bạn)
