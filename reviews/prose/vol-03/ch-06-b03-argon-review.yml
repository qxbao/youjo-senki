  proposed_vi: "kinh tế học nhân học (chapter006_002/p000071) / vốn con người, mất khả năng thanh toán (chapter006_002/p000072) / tuyến tiếp vận, Quân đội Đế quốc (chapter006_002/p000075, p000093) / Bộ phận yểm trợ trực tiếp (chapter006_002/p000078) / sĩ quan phụ tá, Weiss, đội ứng phó (chapter006_002/p000079) / chuỗi chỉ huy (chapter006_002/p000080) / phó chỉ huy, Phòng Nhân sự (chapter006_002/p000081) / nhân viên điện đài (chapter006_002/p000084, p000087) / Thiếu tá von Degurechaff (chapter006_002/p000087, p000097) / Tiểu đoàn 44, CP, Đại úy Carlos (chapter006_002/p000092, p000097) / người kế nhiệm, giới quản lý doanh nghiệp (chapter006_002/p000095) / chiến lược quản trị, chiến lược quân sự (chapter006_002/p000096)"
