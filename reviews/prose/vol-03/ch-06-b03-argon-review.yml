locked_choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000069
  locks:
  - "Giữ giả định trái thực tế quá khứ (`Nếu họ cảnh giác đàng hoàng thì quân địch đã chẳng đời nào áp sát được đến mức này`), đại từ nội tâm `Chúng ta` và mức phủ định tuyệt đối `bình thường chuyện đó tuyệt đối không bao giờ được phép xảy ra`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000070
  locks:
  - "Giữ đại từ tự quy chiếu `mình` theo `DEC-P01-001` và chi tiết suýt bị đạn bắn tỉa thổi bay đầu."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000071
  locks:
  - "Giữ đại từ `mình`, thuật ngữ `kinh tế học nhân học`, cụm `bạo lực man rợ` và dấu ba chấm lửng ở cuối câu."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000072
  locks:
  - "Giữ thuật ngữ `vốn con người`, đại từ `mình` và ẩn dụ tài chính `suýt chút nữa là mất khả năng thanh toán`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000073
  locks:
  - "Giữ sự chuyển đổi đại từ `nó` – `mình` trong câu giả định đầu và quy chiếu `Tanya` – `nó` ở câu trần thuật thứ hai theo `DEC-P01-001`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000074
  locks:
  - "Giữ giả định trái thực tế quá khứ khi cúi người xuống, đại từ `nó` và lựa chọn `nhưng xét việc mình vẫn còn sống thì nó chọn vui vẻ vậy`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000075
  locks:
  - "Giữ sự đan xen đại từ `nó` (trần thuật) và `mình`, `chúng ta` (độc thoại nội tâm), thuật ngữ `tuyến tiếp vận của Quân đội Đế quốc`, cùng phép đối sánh địa hình chiến hào với sa mạc có các đụn cát."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000076
  locks:
  - "Giữ nguyên mệnh lệnh tác chiến: `“Thổi tung cả khu vực đó lên để diệt gọn đám bắn tỉa đi!”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000077
  locks:
  - "Giữ mục đích `để giữ an toàn cho bản thân mình`, chủ thể khái quát `người ta` và sự đối lập giữa tác chiến trong thành phố với ngoài sa mạc."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000078
  locks:
  - "Giữ câu hỏi trách cứ và mệnh lệnh khẩn cấp: `“Bộ phận yểm trợ trực tiếp của chúng ta đang làm cái gì thế hả?! Khử bọn chúng đi—ngay lập tức!”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000079
  locks:
  - "Giữ chức danh `sĩ quan phụ tá của nó là Weiss`, đại từ `Anh` và hành động điều `đội ứng phó` ra chi viện tiêu diệt đám bắn tỉa."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000080
  locks:
  - "Giữ tên riêng `Tanya`, thuật ngữ `chuỗi chỉ huy` và đại từ `nó` theo `DEC-P01-001`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000081
  locks:
  - "Giữ chức danh `phó chỉ huy`, định danh `Phòng Nhân sự`, đại từ nội tâm `mình` và giả định đề bạt thăng chức cho `anh ta`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000082
  locks:
  - "Giữ chi tiết giao lại mấy việc lặt vặt cho cấp dưới và việc `Tanya` bắt tay ngay vào danh sách các nhiệm vụ ưu tiên của riêng mình."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000083
  locks:
  - "Giữ đại từ `Nó` – `nó`, nguy cơ chịu tổn thất nếu không sớm nắm bắt tình hình và quyết định hướng xử lý, cùng việc `Tanya` giấu kín sự căng thẳng trước những người xung quanh."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000084
  locks:
  - "Giữ thuật ngữ `nhân viên điện đài`, thông tin máy móc thiết bị đều an toàn và câu kết `Họ đã nối được liên lạc.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000085
  locks:
  - "Giữ đại từ `Nó` và hình ảnh xử lý mọi việc điềm tĩnh với nụ cười thường trực trên môi."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000086
  locks:
  - "Giữ phép so sánh với khi đàm phán và lợi ích của việc tỏ ra cứng cỏi vững vàng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000087
  locks:
  - "Giữ lời tự giới thiệu `Thiếu tá von Degurechaff`, thông báo tiếp nhận quyền chỉ huy, đại từ trần thuật `Nó` và câu nói đùa qua điện đài dùng cặp đại từ `Tôi` – `anh`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000088
  locks:
  - "Giữ câu mô tả ngắn gọn: `Lời hồi đáp truyền về cũng đượm nét hài hước tương tự.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000089
  locks:
  - "Giữ sự kết hợp giữa đại từ ngôi thứ ba `nó` và mệnh đề tự quy chiếu ngôi thứ nhất `mình đoán vậy` ở cuối câu."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000090
  locks:
  - "Giữ giả định trái thực tế về `một tay lính mới cứng nhắc, căng thẳng` và đại từ `nó`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000091
  locks:
  - "Giữ chủ thể khái quát `người ta`, cặp khái niệm `đối tác, hay một đối thủ trên bàn đàm phán` và phạm vi khẳng định đúng ở khắp mọi nơi chứ chẳng riêng gì trong chuyện làm ăn."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000092
  locks:
  - "Giữ nguyên báo cáo vô tuyến: `“Tiểu đoàn 44 gọi CP. Đại úy Carlos đây, tôi đã tiếp nhận quyền chỉ huy.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000093
  locks:
  - "Giữ đại từ `Nó`, định danh `Quân đội Đế quốc`, chính xác hai cụm chữ nghiêng `*À*` và `*thế này mới thú vị chứ*` theo `DEC-P01-002`, cùng dấu ngoặc kép quanh từ `“vô tình”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000094
  locks:
  - "Giữ sự đối lập giữa việc chỉ huy vừa bị thổi bay với thái độ không rơi vào hoảng loạn tột độ của `anh ta`, cùng liên tưởng tới cuộc sống chốn công sở."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000095
  locks:
  - "Giữ đại từ nội tâm `mình` – `Mình`, cụm `đào tạo người kế nhiệm` và ý định viết sách cho `giới quản lý doanh nghiệp`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000096
  locks:
  - "Giữ cặp thuật ngữ `chiến lược quản trị dựa trên chiến lược quân sự` và nhận định `nhu cầu chắc chắn là có thật`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000097
  locks:
  - "Giữ lời gọi vô tuyến kết thúc lô: `“Đại úy Carlos, Thiếu tá von Degurechaff đây. Tín hiệu thu bên anh kém quá. Anh cải thiện được không?”`."
