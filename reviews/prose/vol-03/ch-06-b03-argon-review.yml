  rationale: "Kế thừa đồng bộ các lựa chọn tạm từ sổ pending và B01–B02 (`vốn con người` theo `P03-human-capital`, `Quân đội Đế quốc`, `chuỗi chỉ huy`, `nhân viên điện đài`, `Thiếu tá von Degurechaff`, `Tiểu đoàn 44`, `CP`); khóa tạm các thuật ngữ kinh tế – quản trị và quân sự xuất hiện trong lô gồm `kinh tế học nhân học` (`p000071`), `sĩ quan phụ tá` / `đội ứng phó` (`p000079`), `Phòng Nhân sự` (`p000081`), `Đại úy Carlos` (`p000092`, `p000097`) và `chiến lược quản trị` (`p000096`)."
