locked_choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000146
  locks:
  - "Giữ các định danh “quân Cộng hòa”, “Vianto”, “pháp sư”, sự đối lập khi kẻ địch thoát đi còn quân Cộng hòa tiến vào tiếp quản vùng đất bị bỏ lại chẳng khác nào những kẻ ăn mày đón nhận lòng thương hại để rồi giới chóp bu rêu rao đó là một chiến thắng, và cơn giận muốn vung đấm nện cho đám cấp trên gục hàng tá tên khi nhận ra ý nghĩa đằng sau việc các pháp sư của mình bị thuyên chuyển."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000147
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng hai cụm `*Lũ chó đẻ khốn kiếp!*` và `*Thật thảm hại!*` theo DEC-P01-002, đại từ “anh”, địa danh “Arene” và mục đích bịt miệng hoặc làm mọi cách điều chuyển bất cứ ai từng tham gia cuộc nổi dậy ở Arene khỏi tiền tuyến chỉ nhằm che đậy sự thật rằng dự đoán của họ đã quá lạc quan."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000148
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng đúng phạm vi câu nội tâm `*Chắc một tương lai gần phải phục vụ ở tuyến sau hoặc nhận chức ở thuộc địa nào đó cũng đang chờ mình rồi*` theo DEC-P01-002, ngôi tự quy chiếu “mình” trong nội tâm, đại từ “anh” trong trần thuật và tiếng thở dài mệt mỏi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000149
  locks:
  - "Giữ đại từ “Anh” ở câu trần thuật viết cả núi đơn kiến nghị để phản đối, chỉ đánh dấu chữ nghiêng đúng phần nội tâm `*Đây là những gì mình nhận được vì đã hoàn thành nhiệm vụ ư? Thật phi lý! Mình không thể tiếp tục thế này được.*` theo DEC-P01-002 và ngôi “mình”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000150
  locks:
  - "Giữ thuật ngữ “sở chỉ huy tiền phương”, đại từ “anh” và nghịch lý những người duy nhất anh có thể phàn nàn lại là các vị tướng tại sở chỉ huy tiền phương nơi anh trực thuộc, tức là họ chỉ mặc kệ cho anh xả giận tới khi kiệt sức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000151
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng toàn đoạn `*Đồ ăn cứt.*` theo DEC-P01-002 và sắc thái chửi thề trực diện trong nội tâm."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000152
  locks:
  - "Giữ đại từ “anh” và mức độ ngu xuẩn không tài nào chịu đựng nổi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000153
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu chửi thề thành tiếng “Địt mẹ!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000154
  locks:
  - "Giữ đại từ “Anh”, thuật ngữ “bộ phận kiểm soát không phận” và chuỗi hành động quăng điếu thuốc xuống đất, lấy mũi giày ủng nghiến nát mẩu tàn thuốc với cơn thịnh nộ như kẻ đi báo thù cho mẹ trước khi xin phép cất cánh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000155
  locks:
  - "Giữ đại từ “Anh” và ý không thể cứ đứng chôn chân ở đó mà âm ỉ uất hận mãi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000156
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng toàn đoạn theo DEC-P01-002, định danh “Đế quốc”, ngôi “mình” / “bọn mình” và cấu trúc điều kiện nếu không bám trụ lại ở tiền tuyến cho đến khi đánh bại Đế quốc và bắn rụng lũ khốn đó khỏi bầu trời thì sẽ chẳng thể nói lời từ biệt tử tế với những thuộc cấp đã ngã xuống và những người dân mà bọn mình đã không bảo vệ được."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000157
  locks:
  - "Giữ đại từ “Anh”, áp lực sôi sục trong lòng và bối cảnh hai bên cứ thế gườm nhau."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000158
  locks:
  - "Giữ khái niệm “ma sát” cho cuộc tiến quân, tình trạng không nắm được bức tranh rõ ràng về các đơn vị đang tiến lên gây bất an, cùng kinh nghiệm thực tế của “anh” rằng đường dây liên lạc của một đạo quân đang tiến bước luôn đối mặt với vô vàn chướng ngại vật nối tiếp nhau không dứt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000159
  locks:
  - "Giữ thuật ngữ “lực lượng công binh dã chiến”, chi tiết khi rời xa tuyến đường sắt thì liên lạc càng khó khăn hơn và đường dây điện thoại rải ra bị đứt theo đủ kiểu dù vô tình hay cố ý, từ bị đạn pháo địch thổi bay đến bị kỵ binh hoặc xe tải quân mình cán qua."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000160
  locks:
  - "Giữ thuật ngữ “tín hiệu gây nhiễu”, quan hệ nhân quả khi kẻ địch phát tín hiệu gây nhiễu hết công suất khiến quân đồng minh cũng tăng công suất phát theo và chỉ gây ra đủ thứ hỗn loạn, chẳng hạn việc bắt tín hiệu của các đơn vị khác càng trở nên khó khăn hơn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000161
  locks:
  - "Giữ tên “Vianto” và quyết định tự đi xem tình hình đang diễn ra thế nào."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000162
  locks:
  - "Giữ thuật ngữ “lực lượng đặc nhiệm”, đại từ “anh” và nguyên nhân cái cớ đi nắm bắt động thái quân địch phát huy tác dụng: họ đang cần tin tình báo nên giấy phép bay xin được dễ dàng đến bất ngờ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000163
  locks:
  - "Giữ các thuật ngữ “trinh sát sĩ quan”, “sĩ quan tham mưu”, “hạ sĩ quan”, đại từ “anh”, việc được nhờ làm nhiệm vụ trinh sát sĩ quan không chính thức kiêm đưa thư và cõng thêm chiếc rương đầy rượu, thuốc lá do mọi người gom góp cùng câu nhắn trong ngoặc kép dành cho các sĩ quan đang chịu khổ cực ngoài tiền tuyến."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000164
  locks:
  - "Giữ tên “Vianto”, đại từ “anh”, ngôi nội tâm “mình”, chỉ đánh dấu chữ nghiêng ở đúng hai phần `*Cứ đà này*` và `*mình chẳng khác nào một con bồ câu đưa thư hay một con chó thồ thuốc lá cả*` theo DEC-P01-002, cùng mệnh đề đối lập rằng anh hiểu rõ ý nghĩa của những thứ mình đã được tin tưởng phó thác."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000165
  locks:
  - "Giữ cả hai vế đằng sau những lời nhờ cậy: tấm lòng gửi gắm và sự thấu hiểu rằng đây là những vật phẩm đang rất cần thiết ở các tuyến tiền tiêu xa nhất."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000166
  locks:
  - "Giữ phép so sánh phóng đại về việc cách sử dụng thời gian này có ý nghĩa hơn gấp tỷ lần so với phung phí vào lũ quan liêu và những quy định ngu xuẩn của chúng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000167
  locks:
  - "Giữ tên “Vianto”, đại từ “anh”, sự thấu hiểu cá nhân về niềm an ủi ấm lòng của các sĩ quan nơi tiền tuyến khi nhận được tin tức và đồ xa xỉ từ hậu phương, cùng việc không từ chối bất kỳ lời nhờ cậy nào dù biết bay với khối hàng nặng đồng nghĩa với một cấp độ kiệt sức hoàn toàn mới."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000168
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Vianto”, “Hô hiệu Whiskey Dog”, “CP” và lời xin phép cất cánh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000169
  locks:
  - "Giữ thuật ngữ “hô hiệu”, đại từ “anh” và chi tiết giống như những người đi trước, anh bông đùa tự nhận mình là một “chú chó giao hàng” đang định chở thuốc lá và rượu whiskey ra tiền tuyến."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000170
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Whiskey Dog”, “CP”, “các kiểm soát viên không phận vùng Rhine”, “trạm tín hiệu”, “Vùng Đất Thấp”, ngôi “anh” – “Chúng tôi” và nội dung thông báo rằng nhiều trạm tín hiệu phản hồi hy vọng anh đến càng sớm càng tốt cùng lời chào đón nồng nhiệt từ từng đơn vị ở Vùng Đất Thấp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000171
  locks:
  - "Giữ dấu ngoặc kép hội thoại, tiếng cười “Ha-ha-ha!”, ngôi “tôi” và lời đáp không nên đến muộn kẻo họ lo lắng trước khi cất cánh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000172
  locks:
  - "Giữ các định danh “CP”, “Vianto”, đại từ “anh” và mạch suy ngẫm: dù cuộc trao đổi với CP có tiếng cười nhưng từng lời đều cho thấy những người lính ngoài kia vất vả nhường nào, công tác hậu cần cho đạo quân đang tiến bước dễ rối tung ra sao, và nụ cười chua chát khi tự nhủ không được phép đến muộn."
