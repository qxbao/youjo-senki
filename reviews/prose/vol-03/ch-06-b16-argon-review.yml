  rationale: "Kế thừa đồng bộ hệ thuật ngữ đã khóa từ các chương và batch trước (`yểm trợ trực tiếp`, `các khẩu đội pháo`, `Lục quân Cộng hòa`, `Lục quân Cộng hòa Tự do`, `Lục quân Đế quốc`, `Tướng de Lugo`, `Vianto`, `Romel`, `mặt trận Rhine`, `“đòn tập kích chính xác”`, `CÙNG NGÀY, DOANH TRẠI LỤC QUÂN ĐẾ QUỐC`), đồng thời khóa tạm các định danh đơn vị mới xuất hiện trong lô gồm `Tiểu đoàn Pháp sư 5` (`p000485`), `Tiểu đoàn Pháp sư 2` (`p000488`), `Trung đoàn Pháp sư Hỗn hợp 1` (`p000488`) và `Quân đoàn Viễn chinh Phương Nam` (`p000514`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: vianto_realization_and_romel_camp_register_vol03_ch06_b16
  proposed_vi: "Phần đầu tại sở chỉ huy Cộng hòa theo điểm nhìn Tướng de Lugo và Đại tá Vianto (chapter006_002/p000483–p000519): kế thừa nhất quán B15, quy chiếu Tướng de Lugo bằng `ông ta` (`p000488`, `p000489`), quy chiếu Đại tá Vianto trong mạch nhận thức chiến thuật bằng `ông` và phản thân `mình` (`p000494`, `p000501`, `p000504`, `p000519`), quy chiếu phe Cộng hòa và các pháp sư bạn bằng `họ` (`p000484`, `p000499`, `p000502`, `p000512`, `p000516`), và quy chiếu quân Đế quốc / pháp sư Đế quốc bằng `chúng` (`p000487`, `p000493`–`p000496`, `p000498`, `p000503`, `p000507`, `p000508`, `p000510`, `p000514`, `p000515`); trong độc thoại nội tâm của Vianto dùng `chúng ta` / `ta` – `chúng` (`p000502`, `p000515`–`p000517`); trong thoại trực tiếp Vianto thưa cấp trên `“Thưa Tướng de Lugo, xin ngài hãy rút lui.”` (`p000505`) và hiệu triệu thuộc cấp `“Các binh sĩ, hãy bảo vệ tướng quân. Đây là trận chiến cuối cùng của chúng ta.”` (`p000518`) / Phần sau tại doanh trại Lục quân Đế quốc theo điểm nhìn các hạ sĩ quan và Tướng Romel (chapter006_002/p000520–p000528): kế thừa nhất quán Chương 5, trong suy nghĩ của các hạ sĩ quan quy chiếu Romel bằng `ông ấy` (`p000524`); trong trần thuật quy chiếu Romel bằng `ông` và phản thân `mình` (`p000525`, `p000527`, `p000528`); khi quy chiếu Thiếu tá Degurechaff từ góc nhìn của Romel dùng `cô` trong trần thuật và `cô ta` trong độc thoại nội tâm (`p000528`)"
  alternatives_vi:
  - "ông ta (thay cho `ông` khi quy chiếu Đại tá Vianto tại chapter006_002/p000494, p000501, p000504, p000519 — ưu tiên `ông` để phân biệt rõ ràng với chủ thể `ông ta` là Tướng de Lugo ở p000488–p000489 và phản ánh sự dịch chuyển sang điểm nhìn phân tích điềm tĩnh, quyết tử của Vianto) / nó (thay cho `cô` / `cô ta` khi quy chiếu Tanya ở p000528 — không chọn vì `p000528` là điểm nhìn của Tướng Romel nhìn nhận một sĩ quan cấp dưới ưu tú, cần giữ `cô` / `cô ta` đồng bộ với `ch-05-b12`–`b14`)"
