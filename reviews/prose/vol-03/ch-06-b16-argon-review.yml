  volume: vol-03
  chapter: 6
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`: phân biệt rõ hệ đại từ theo điểm nhìn tại sở chỉ huy Cộng hòa (`ông ta` cho de Lugo, `ông` cho Vianto, `họ` cho quân Cộng hòa, `chúng` cho quân Đế quốc) và tại doanh trại Đế quốc (`ông` / `ông ấy` cho Romel, `cô` / `cô ta` cho Thiếu tá Degurechaff dưới góc nhìn của Romel), đồng thời bảo toàn chính xác dấu nhấn mạnh `*...*` tại đúng 8 đoạn có thẻ `<html:em>` trong nguồn (`p000496`, `p000500`, `p000502`, `p000515`, `p000516`, `p000517`, `p000524`, `p000528`)."
