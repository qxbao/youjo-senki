  proposed_vi: "NGÀY 1 THÁNG 11, NĂM THỐNG NHẤT 1925, HẠ VIỆN KHỐI THỊNH VƯỢNG CHUNG (chapter006_004/p000012) / thần dân của Khối Thịnh vượng chung, vị thủ tướng (chapter006_004/p000013, p000014) / những bức tường gỗ (chapter006_004/p000017) / thời kỳ huy hoàng nhất, thời kỳ tồi tệ nhất, tổ quốc vĩnh cửu (chapter006_004/p000027, p000029, p000031) / (Ấu Nữ Chiến Ký, Tập 3: Thời Khắc Huy Hoàng Nhất, Hết) (chapter006_004/p000032)"
  alternatives_vi:
