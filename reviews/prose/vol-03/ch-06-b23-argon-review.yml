  proposed_vi: "Hạm đội Biển khơi, giành quyền làm chủ mặt biển, Khối Thịnh vượng chung, chính phủ bù nhìn, Cộng hòa (chapter006_002/p000730) / hạm đội Đế quốc, chiến lược “hạm đội hiện hữu” (chapter006_002/p000731) / các thuộc địa chẳng mấy trọng yếu của Cộng hòa trên lục địa phía nam, tàn quân của Lục quân Cộng hòa, Vương quốc Ildoa (chapter006_002/p000732, p000734) / các tướng lĩnh Đế quốc, cấp độ chiến thuật, Bộ Tổng tham mưu, cấp độ chiến dịch, tác chiến cơ động, đột phá vòng vây (chapter006_002/p000733, p000735) / các cựu thuộc địa của Cộng hòa giữa sa mạc, giới chính trị gia ở hậu phương, các chính trị gia ở quê nhà, các chính trị gia Đế quốc (chapter006_004/p000003, p000005, p000007) / Lục quân Đế quốc, thời khắc huy hoàng nhất, quốc lực (chapter006_004/p000008–p000011)"
  alternatives_vi:
  - "quyền chế hải (thay cho `quyền làm chủ mặt biển` tại chapter006_002/p000730 — giữ `giành quyền làm chủ mặt biển` để diễn đạt tự nhiên, rõ nghĩa trong mạch suy tư của Tanya) / chiến tranh cơ động (thay cho `tác chiến cơ động` tại chapter006_002/p000733 — giữ `tác chiến cơ động` khi đặt song hành với `đột phá vòng vây` ở `cấp độ chiến dịch`)"
