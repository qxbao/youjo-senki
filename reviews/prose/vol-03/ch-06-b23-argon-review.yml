- source_term: tanya_monologue_and_commonwealth_pm_oratory_register_vol03_ch06_b23
  proposed_vi: "Trong trần thuật và độc thoại nội tâm của Tanya (`chapter006_002/p000730`–`p000736` và `chapter006_004/p000002`–`p000011`): tuân thủ nghiêm ngặt `DEC-P01-001`, quy chiếu ngôi thứ ba Tanya bằng `nó` (`p000731`, `p000732`, `p000004`, `p000006`, `p000007`, `p000011`) và dùng `chúng ta` khi quy chiếu tập thể Lục quân Đế quốc / Đế quốc (`p000008`–`p000011`). Trong phân cảnh bài phát biểu của Thủ tướng Khối Thịnh vượng chung (`chapter006_004/p000012`–`p000031`): ngôi kể khách quan quy chiếu vị thủ tướng bằng `ông` (`p000016`, `p000018`, `p000020`, `p000022`, `p000030`); trong diễn văn trước Hạ viện và qua đài phát thanh, vị thủ tướng tự xưng `tôi`, gọi cử tọa và người dân là `Hỡi thần dân của Khối Thịnh vượng chung`, `quý vị` (`p000013`, `p000015`) và `thưa quý ông và quý bà` (`p000031`), dùng `chúng ta` cho toàn thể quốc gia và `chúng` cho kẻ địch Đế quốc"
  alternatives_vi:
  - "cô (thay cho `nó` khi quy chiếu Tanya ở ngôi thứ ba tại `p000731`, `p000732`, `p000004`, `p000006`, `p000007`, `p000011` — bắt buộc giữ `nó` theo quyết định canon `DEC-P01-001`) / ngài (thay cho `ông` trong lời kể khách quan về vị thủ tướng tại `p000016`, `p000018`, `p000020`, `p000022`, `p000030` — giữ `ông` để duy trì giọng trần thuật khách quan)"
