locked_choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000467
  locks:
  - "Giữ thán từ mở đầu “Thật tình”, giả định “giá mà phe Cộng hòa cứ chịu đầu hàng quách đi cho rồi”, các cụm “nguồn nhân lực của quốc gia”, “lực lượng lao động” và câu hỏi tu từ ở cuối đoạn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000468
  locks:
  - "Giữ thuật ngữ “tính hợp lý về mặt kinh tế”, đại từ nội tâm tự quy chiếu “mình” theo DEC-P01-001, câu hỏi tự vấn về việc tính toán hơn thiệt kinh tế để khuyên đối phương đầu hàng, và nhận định chống trả kẻ địch không thể thắng nổi đến mức bị hủy diệt hoàn toàn đã vượt quá rất xa bổn phận của người lính."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000469
  locks:
  - "Giữ câu hỏi tu từ về giới hạn của “sự chèn ép nhân quyền”, đại từ “Mình” theo DEC-P01-001 và lập luận các quốc gia có logic riêng nhưng chẳng có lý do gì bắt các cá nhân phải tự hy sinh bản thân vì cái logic đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000470
  locks:
  - "Giữ cụm “những cá nhân có quyền con người”, đại từ “Mình” theo DEC-P01-001, sự phân biệt giữa bổn phận chiến đấu/phục vụ vì nền quốc phòng với việc bị xóa sổ hoàn toàn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000471
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ “thê đội một” và khẩu lệnh bắt đầu chiến dịch."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000472
  locks:
  - "Giữ mạch chuyển ý đây chẳng phải kiểu tình huống mà người ta có thể bình tĩnh suy xét thấu đáo mọi chuyện."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000473
  locks:
  - "Giữ cụm “Tín hiệu vô tuyến của quân ta”, đại từ “mình” theo DEC-P01-001 và thông tin chiến dịch đã bước sang giai đoạn tiếp theo."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000474
  locks:
  - "Giữ ngôi “chúng ta” và nhận xét chẳng có nhiều thời gian để cứ thế bay lượn trên này."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000475
  locks:
  - "Giữ ngôi “Chúng ta”, các thuật ngữ “công kích mục tiêu mặt đất”, “hỏa điểm phòng ngự”, “thuật thức nổ” và nhận định chừng đó đã thừa sức bẻ gãy chốt cố thủ cuối cùng của sự kháng cự có tổ chức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000476
  locks:
  - "Giữ đại từ “mình” theo DEC-P01-001, các định danh “Lục quân Cộng hòa”, “Lục quân Đế quốc”, “lính biệt kích Đế quốc”, “đội hình đột kích” và sự tương phản giữa quân Cộng hòa rối loạn với quân Đế quốc giữ vững kỷ luật trong thế trận giẫm đạp một chiều."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000477
  locks:
  - "Giữ các cụm “vị trí phòng ngự”, “thương vong nặng nề”, “súng máy”, “cánh pháp sư chúng ta” và kết luận cuộc chiến thực sự đã trở thành một cuộc chơi một chiều."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000478
  locks:
  - "Giữ các định danh “Lục quân Cộng hòa”, “người Cộng hòa”, “Đế quốc” và lập luận đánh đổi lấy một chút thiệt hại cho Đế quốc bằng sự hủy diệt hoàn toàn thì chẳng có vẻ gì là hợp lý."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000479
  locks:
  - "Giữ hai câu hỏi tu từ nối tiếp về việc chống Đế quốc một cách cuồng tín hay đã cuồng chiến tới mức hết thuốc chữa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000480
  locks:
  - "Giữ câu hỏi tu từ thứ ba với hình ảnh ẩn dụ “những chú cừu non tội nghiệp chẳng hề biết chuyện gì đang diễn ra”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000481
  locks:
  - "Giữ đúng quy chiếu “vế sau” (những chú cừu non không biết gì — còn nói lý lẽ được) và “vế đầu” (cuồng tín/cuồng chiến — tệ nhất), cùng đại từ “Mình”, “chúng ta” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000482
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm “Cảnh báo không phận!” và thông báo phát hiện nhiều “máy bay tiêm kích” đang “xuất kích khẩn cấp”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000483
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ “tín hiệu ma lực” và khẩu lệnh nhắc tất cả các đơn vị cảnh giác đề phòng phục kích."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000484
  locks:
  - "Giữ dấu chấm lửng mở đầu và cấu trúc phủ định kép “không đến mức hoàn toàn không có phản ứng gì”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000485
  locks:
  - "Giữ các cụm “máy bay tiêm kích”, “tác chiến phòng không”, đại từ “mình” theo DEC-P01-001 và phép so sánh an toàn hơn so với giao chiến cùng đám người điên khùng tiềm ẩn đầy nguy hiểm."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000486
  locks:
  - "Giữ đại từ “Mình”, “Chúng ta” theo DEC-P01-001, các thuật ngữ “tiểu đoàn”, “công kích mục tiêu mặt đất”, “đội hình hộp chiến đấu”, “đài kiểm soát”, “trần bay tác chiến” và số lượng “hai mươi chiếc máy bay tiêm kích”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000487
  locks:
  - "Giữ định danh “Không hạm đội của Đế quốc”, đại từ “chúng ta”, “Mình” theo DEC-P01-001, cụm “màn đánh đấm chiếu lệ” và nhận xét pháp sư với máy bay tiêm kích nhìn chung vốn chẳng dễ đối phó với nhau."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000488
  locks:
  - "Giữ sự đối sánh ưu nhược điểm giữa pháp sư (linh hoạt hơn nhưng khó khăn về tốc độ và độ cao) và máy bay (vượt trội về “chiến thuật đánh rồi rút”, ít sát thương hơn nhưng là món hời hơn về mặt chi phí)."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000489
  locks:
  - "Giữ ngôi “chúng ta”, thuật ngữ “hiệu quả chi phí” và kết luận vì máy bay bị bắn hạ thường xuyên hơn nên hai bên bù trừ cho nhau."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000490
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu cảnh báo “Pháo binh địch đang khai hỏa!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000491
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm “Xác nhận trúng đạn.” và lệnh yêu cầu tất cả các chiến hào báo cáo thiệt hại."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000492
  locks:
  - "Giữ dấu ngoặc kép hội thoại và thông báo ngắn gọn “Báo cáo mặt trận. Thiệt hại nhẹ.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000493
  locks:
  - "Giữ dấu ngoặc kép hội thoại, khẩu lệnh “Bắn phản pháo!” và mệnh lệnh nghiền nát địch trong một đòn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000494
  locks:
  - "Giữ dấu ngoặc kép quanh từ ““trận chiến””, phần giải thích trong cặp dấu gạch ngang, đại từ “mình” theo DEC-P01-001, thuật ngữ “công kích mục tiêu mặt đất” và sắc thái giả định tiếc rẻ ở quá khứ (“có lẽ mình nên ở lại phụ giúp… thì hơn”)."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000495
  locks:
  - "Giữ lập luận né tránh rủi ro là hợp logic và bắt buộc, đại từ “mình” theo DEC-P01-001 và cặp thuật ngữ “ưu thế trên không” / “quyền làm chủ bầu trời”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000496
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn bộ đoạn theo DEC-P01-002, dấu chấm lửng mở đầu và ngôi “chúng ta”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000497
  locks:
  - "Giữ câu trần thuật ngắn gọn “Đó là một niềm hy vọng mong manh.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000498
  locks:
  - "Giữ đại từ trần thuật “nó” quy chiếu Tanya theo DEC-P01-001 và hình ảnh cảm giác kỳ lạ như một gợn sóng lăn tăn truyền tới từ phía đại dương."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000499
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Rhine Control”, các cụm “thông báo chung”, “tín hiệu nhận dạng” và yêu cầu khai báo rõ bên trực thuộc của “các vị” ngay lập tức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000500
  locks:
  - "Giữ câu miêu tả ngắn gọn “Một chút xôn xao cùng tiếng hô tra vấn.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000501
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Rhine Control”, ngôi “Tôi”, các thuật ngữ “tín hiệu nhận dạng”, “vùng nhận dạng hàng hải” và mệnh lệnh liên lạc vô tuyến hoặc gửi tín hiệu nhận dạng ngay lập tức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000502
  locks:
  - "Giữ phép so sánh tín hiệu cảnh báo vang vọng khắp chiến trường như những tiếng hét thất thanh, đại từ “mình” theo DEC-P01-001, cụm “kẻ lạ mặt im lìm” và nhận định “kiểm soát viên” đã rơi vào trạng thái hoảng loạn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000503
  locks:
  - "Giữ câu nhận định “Linh cảm xấu lúc nào cũng đúng cả.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000504
  locks:
  - "Giữ các dấu chấm lửng ngập ngừng, định danh “John Bull” và cụm “đám họ hàng khó ưa của những gã John Bull dễ mến”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000505
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Fairy 01”, “Rhine Control”, ngôi “Tôi” và lời xin phép quay đầu đi đánh chặn kẻ không rõ danh tính."
