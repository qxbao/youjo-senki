  volume: vol-03
  chapter: 6
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`: duy trì nhất quán hệ quy chiếu đại từ theo điểm nhìn của Grantz (`anh`, `mình`, `chúng ta`; gọi chỉ huy tiểu đoàn là `cô` / `cô ấy`) và điểm nhìn của Tướng de Lugo (`ông ta`), đồng thời bảo toàn chính xác phạm vi nhấn mạnh chữ nghiêng `*...*` ở đúng 4 đoạn có thẻ `<html:em>` trong nguồn (`p000132`, `p000133`, `p000153`, `p000155`)."
