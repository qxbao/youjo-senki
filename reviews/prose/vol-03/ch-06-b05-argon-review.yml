- source_term: grantz_and_de_lugo_pov_pronouns_and_radio_register_vol03_ch06_b05
  proposed_vi: "Điểm nhìn Grantz trên chiến trường sa mạc (chapter006_002/p000130–p000165): trần thuật ngôi thứ ba quy chiếu Grantz bằng `anh` và tập thể đơn vị bằng `họ`; độc thoại nội tâm trực tiếp của Grantz dùng `mình` và số nhiều bao gộp `chúng ta` (chapter006_002/p000132, p000133, p000155); quy chiếu Thiếu tá von Degurechaff (chỉ huy tiểu đoàn) từ góc nhìn của Grantz bằng `cô` / `cô ấy` (chapter006_002/p000154, p000155); quy chiếu Tướng von Romel bằng `ông` / `ông ấy` (chapter006_002/p000130, p000132, p000139) / Thoại mệnh lệnh và liên lạc vô tuyến: sở chỉ huy và các chỉ huy đơn vị dùng `Tôi nhắc lại`, `Chúng ta`, `Chúng tôi`, `Các anh` với khẩu lệnh quân sự ngắn gọn, dứt khoát (chapter006_002/p000137, p000141, p000144, p000145, p000149, p000150, p000158, p000162, p000163) / Điểm nhìn Tướng de Lugo tại cuộc họp quốc phòng của Cộng hòa Tự do (chapter006_002/p000166–p000169): trần thuật ngôi thứ ba quy chiếu Tướng de Lugo bằng `ông ta` (chapter006_002/p000168, p000169)"
  alternatives_vi:
  - nó (thay cho `cô` / `cô ấy` khi quy chiếu Thiếu tá von Degurechaff ở `p000154`–`p000155` — không chọn vì đoạn này thuộc điểm nhìn và độc thoại nội tâm của Grantz, theo giới hạn của `DEC-P01-001` không mở rộng đại từ `nó` sang điểm nhìn nhân vật khác và cần giữ đúng sự kính nể của cấp dưới với chỉ huy tiểu đoàn) / ông (thay cho `ông ta` khi quy chiếu Tướng de Lugo ở `p000168`–`p000169` — ưu tiên `ông ta` để đồng bộ với lựa chọn đã khóa tại B04 `p000114`, `p000116` và Chương 5 B11)
