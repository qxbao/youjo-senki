  volume: vol-03
  chapter: 6
  rationale: "Kế thừa nhất quán hệ thống thuật ngữ, địa danh, cấp bậc và chức danh đã khóa từ các batch trước (`Tướng de Lugo` / `de Lugo`, `Turus`, `thiếu tướng`, `Cộng hòa` / `Cộng hòa Tự do`, `Trung ương`, `chính quốc`, `đại lục`, `các phòng tuyến Rhine`, `Khối Thịnh vượng chung`), đồng thời khóa tạm các mục mới trong lô gồm `tổng tư lệnh` (`p000174`), `thứ trưởng của cả Bộ Quốc phòng lẫn Lực lượng Vũ trang` (`p000177`), `lộ trình thăng tiến` (`p000181`, `p000183`) và hệ danh xưng phân tầng lực lượng thuộc địa (`lực lượng phòng vệ thuộc địa`, `quân đội thuộc địa`, `lực lượng thuộc địa`)."
  uncertainty: low
