- source_term: de_lugo_pov_pronouns_and_meeting_dialogue_register_vol03_ch06_b06
  proposed_vi: "Điểm nhìn Tướng de Lugo xuyên suốt cuộc họp quốc phòng của Cộng hòa Tự do (chapter006_002/p000170–p000198): trần thuật ngôi thứ ba quy chiếu Tướng de Lugo nhất quán bằng `ông ta` và tập thể các tướng lĩnh/đơn vị bằng `họ`; độc thoại nội tâm trực tiếp của de Lugo dùng `mình` (chapter006_002/p000172) và số nhiều bao gộp `chúng ta` (chapter006_002/p000198) / Thoại trong cuộc họp: de Lugo phát biểu dùng `Chúng ta` / `chúng ta` với giọng điềm tĩnh, dứt khoát (chapter006_002/p000174, p000178); các tướng lĩnh thuộc địa chất vấn và phản đối xưng `tôi`, gọi `Tướng de Lugo` là `ngài` (chapter006_002/p000179, p000193), và khi tự biện hộ tập thể thì xưng `chúng tôi` với giọng điệu kiểu cách, ngang ngạnh (chapter006_002/p000195)"
  alternatives_vi:
  - ông (thay cho `ông ta` khi quy chiếu Tướng de Lugo trong trần thuật — ưu tiên `ông ta` để đồng bộ tuyệt đối với lựa chọn đã khóa tại B04 `p000114`, `p000116` và B05 `p000168`, `p000169`) / tôi (thay cho `mình` trong câu độc thoại nội tâm trực tiếp tại `p000172` — ưu tiên `mình` vì tự nhiên hơn cho suy nghĩ thầm kín của nhân vật và phân biệt rõ với lời thoại phát ngôn trước hội nghị)
