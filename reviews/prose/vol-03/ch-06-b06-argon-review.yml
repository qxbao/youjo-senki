- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000171
  locks:
  - "Giữ đại từ `Ông ta`, cụm nhấn mạnh chữ nghiêng `*một cuộc họp chỉ để cho có họp*` theo `DEC-P01-002`, nguy cơ tự hủy diệt trước khi giành lại `tổ quốc` và sự bất mãn sắp chạm điểm bùng nổ của binh sĩ đi theo `ông ta` từ `đại lục`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000172
  locks:
  - "Giữ trọn câu độc thoại nội tâm in nghiêng toàn đoạn có dấu ba chấm mở đầu theo `DEC-P01-002` và đại từ `mình`: `*…Nhưng. Không, giờ thì mình thực sự có thể hành động rồi.*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000173
  locks:
  - "Giữ cấu trúc nhân quả `Chính vì nhìn thấy cơ hội ấy mà de Lugo mới kiên nhẫn hùa theo màn kịch lố bịch này.` và đại từ `Ông ta`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000174
  locks:
  - "Giữ lời tuyên bố `“Chúng ta hãy xem xét một chiến dịch tái chiếm Turus.”` và chức danh `vị tổng tư lệnh` phớt lờ cảnh ồn ào huyên náo trong phòng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000175
  locks:
  - "Giữ mốc `Trước cuộc đào thoát`, cấp bậc `thiếu tướng` của `de Lugo`, đại từ `ông ta` và nhận xét quân hàm cao đáng nể so với tuổi nhưng đã có nhiều người đạt tới trước."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000176
  locks:
  - "Giữ chi tiết vị tướng trẻ tuổi nhất trong phòng mà xét về cấp bậc đếm từ dưới lên sẽ nhanh hơn, cùng giả định thông thường lẽ ra phải nhường bước trước các sĩ quan thâm niên hơn."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000177
  locks:
  - "Giữ lý do ngồi vị trí chủ tọa thuần túy vì chức trách, cương vị `thứ trưởng của cả Bộ Quốc phòng lẫn Lực lượng Vũ trang`, và thẩm quyền nắm quyền chỉ huy lục quân trong trường hợp khẩn cấp để dẫn dắt `các lực lượng Cộng hòa`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000178
  locks:
  - "Giữ câu hỏi trực diện tại cuộc họp: `“Lực lượng của chúng ta đã tập kết chưa?”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000179
  locks:
  - "Giữ lời hỏi vặn mang sắc thái thách thức ngầm với cặp xưng hô `tôi` – `Tướng de Lugo` / `ngài`: `“Thứ lỗi cho tôi, Tướng de Lugo, nhưng ngài vừa nói gì cơ?”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000180
  locks:
  - "Giữ nhận định thẩm quyền đó của `ông ta` cũng chỉ là trên giấy tờ."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000181
  locks:
  - "Giữ định danh `lực lượng phòng vệ thuộc địa`, cụm `trượt khỏi lộ trình thăng tiến` và vị thế `bậc tiền bối của de Lugo`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000182
  locks:
  - "Giữ thái độ không chịu ngoan ngoãn nghe lời một vị tướng trẻ hơn rất nhiều và tốt nghiệp học viện muộn hơn cả quãng dài."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000183
  locks:
  - "Giữ chính xác hai phần in nghiêng tách biệt bởi mệnh đề trần thuật theo `DEC-P01-002`, thuật ngữ `các đội quân thuộc địa`, `lộ trình thăng tiến ở Trung ương` và sắc thái `chẳng có chút thiện cảm nào`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000184
  locks:
  - "Giữ mục tiêu trên danh nghĩa giành lại `tổ quốc`, tình hình nội bộ hỗn loạn của `Cộng hòa Tự do`, thuật ngữ `quân đội thuộc địa` và dấu gạch ngang dài `—ít nhất là về mặt tổ chức`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000185
  locks:
  - "Giữ nhận xét đám `chỉ huy thuộc địa` chẳng còn nước đi nào khác nên mới chỉ không phản đối, sự vượt trội về năng lực của `de Lugo` và điểm tựa từ `các đơn vị chính quốc`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000186
  locks:
  - "Giữ ba thành phần trong đạo quân `ông ta` mang theo (thiếu kinh nghiệm thực chiến, từng chiến đấu trên `các phòng tuyến Rhine`, đang nâng cấp trang bị ở `Trung ương`) và kết luận nhìn chung họ khá hùng mạnh."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000187
  locks:
  - "Giữ thuật ngữ `cơ cấu chỉ huy` xây dựng xoay quanh `de Lugo` ngay từ đầu giúp lực lượng gắn kết chặt chẽ và có kỷ luật tốt."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000188
  locks:
  - "Giữ sự đối sánh trang bị giữa số quân đào thoát khỏi `chính quốc` với lính đóng quân lâu năm ở thuộc địa, tiêu chuẩn của `lực lượng thuộc địa` và việc `các pháp sư tinh nhuệ đến từ chính quốc` vượt trội hơn hẳn một bậc."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000189
  locks:
  - "Giữ câu chuyển ngắn: `Nhưng de Lugo thầm tự răn mình.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000190
  locks:
  - "Giữ trọn câu độc thoại nội tâm in nghiêng toàn đoạn theo `DEC-P01-002`: `*Cũng chỉ đến mức đó mà thôi.*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000191
  locks:
  - "Giữ sự phụ thuộc vào `quân đội thuộc địa` để liên hệ với `bộ máy hành chính` và `hỗ trợ hậu cần`, cùng thực tế số lượng tướng lĩnh trong `lực lượng thuộc địa` (dù chỉ giữ tên hưởng lương) đông hơn rất nhiều so với đạo quân `đại lục` mà `ông ta` đưa sang."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000192
  locks:
  - "Giữ hệ quả mối quan hệ gượng gạo và việc hai bên ít nhiều đều đang hành động độc lập thay vì tham chiến như một tổ chức thống nhất."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000193
  locks:
  - "Giữ câu đáp nối mạch trực tiếp với `p000178`: `“Họ đã tập kết rồi, nhưng tôi phản đối.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000194
  locks:
  - "Giữ vị thế mơ hồ của `de Lugo`, cảnh mệnh lệnh tập kết quân vấp phải thủ tục quan liêu rườm rà cùng mặc cả, và sự chống đối từ đám `quan chức thuộc địa` thụ động, ăn không ngồi rồi."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000195
  locks:
  - "Giữ chính xác câu trích dẫn in nghiêng `*“Những giá trị ‘lỗi thời’ của chúng tôi là biểu hiện cho tinh thần hiệp sĩ đề cao danh dự và lòng tự trọng,”*` theo `DEC-P01-002` và chi tiết các tướng lĩnh giữ vẻ mặt tỉnh bơ cãi lại."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000196
  locks:
  - "Giữ nhận thức của `de Lugo` rằng suy cho cùng họ chỉ đang chống đối việc `ông ta` vượt mặt họ mà thôi."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000197
  locks:
  - "Giữ việc họ phản đối cuộc tiến quân giành lại `Turus` ngay cả hôm nay và hình ảnh so sánh `chẳng khác gì đổ rượu mới vào bình cũ`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000198
  locks:
  - "Giữ định danh `Khối Thịnh vượng chung`, việc `ông ta` phải muối mặt báo không có nhiên liệu khi được yêu cầu chi viện, và bảo toàn chính xác câu độc thoại nội tâm in nghiêng ở cuối đoạn theo `DEC-P01-002`: `*Có lẽ chỉ là do chúng ta không hợp nhau, nhưng đó quả là một sai lầm ngu xuẩn.*`."
