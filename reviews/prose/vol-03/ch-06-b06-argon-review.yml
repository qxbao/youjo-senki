  proposed_vi: "lính thuộc địa, lực lượng phòng vệ thuộc địa, các đội quân thuộc địa, quân đội thuộc địa, chỉ huy thuộc địa, lực lượng thuộc địa, quan chức thuộc địa (chapter006_002/p000170, p000181, p000183–p000185, p000188, p000191, p000194) / tinh thần hiệp sĩ (chapter006_002/p000170, p000195) / tổ quốc, đại lục, chính quốc (chapter006_002/p000171, p000184, p000185, p000188, p000191) / de Lugo, Tướng de Lugo (chapter006_002/p000173, p000175, p000179, p000181, p000183–p000185, p000187, p000189, p000194, p000196) / Turus (chapter006_002/p000174, p000197) / tổng tư lệnh (chapter006_002/p000174) / thiếu tướng (chapter006_002/p000175) / thứ trưởng của cả Bộ Quốc phòng lẫn Lực lượng Vũ trang, các lực lượng Cộng hòa (chapter006_002/p000177) / lộ trình thăng tiến, Trung ương (chapter006_002/p000181, p000183, p000186) / Cộng hòa Tự do (chapter006_002/p000184) / các phòng tuyến Rhine (chapter006_002/p000186) / cơ cấu chỉ huy, các pháp sư tinh nhuệ (chapter006_002/p000187, p000188) / bộ máy hành chính, hỗ trợ hậu cần (chapter006_002/p000191) / Khối Thịnh vượng chung (chapter006_002/p000198)"
  alternatives_vi:
  - tư lệnh tối cao (thay cho `tổng tư lệnh` tại chapter006_002/p000174 — ưu tiên `tổng tư lệnh` vì chuẩn xác trong ngữ cảnh chỉ huy quân sự cấp cao nhất của các lực lượng Cộng hòa Tự do) / thứ trưởng Bộ Quốc phòng kiêm Thứ trưởng Quân huấn - Vũ trang (thay cho `thứ trưởng của cả Bộ Quốc phòng lẫn Lực lượng Vũ trang` tại chapter006_002/p000177 — ưu tiên `thứ trưởng của cả Bộ Quốc phòng lẫn Lực lượng Vũ trang` để bám sát cấu trúc song hành trong nguồn và đồng bộ với Chương 5 B11) / quân phòng vệ thuộc địa (thay cho `lực lượng phòng vệ thuộc địa` tại chapter006_002/p000181 — ưu tiên `lực lượng phòng vệ thuộc địa` để phân biệt tự nhiên với `quân đội thuộc địa` ở p000184, p000191 và `lực lượng thuộc địa` ở p000188, p000191)
