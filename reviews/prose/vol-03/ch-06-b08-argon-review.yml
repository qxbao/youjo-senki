  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng và địa danh đã khóa từ các batch trước của chương 6 (`thống nhất hệ thống chỉ huy`, `Cộng hòa`, `Đế quốc` / `Lục quân Đế quốc`, `de Lugo`, `Tướng von Romel` / `Romel`, `Khối Thịnh vượng chung`, `Turus`, `chiến tranh cơ động`, `lục địa phía nam`, `Vương quốc Ildoa` / `lãnh thổ Ildoa`), đồng thời khóa tạm bốn thuật ngữ quân sự-hậu cần mới xuất hiện trong lô gồm `lực lượng viễn chinh` (`p000248`), `các cơ sở cảng biển` (`p000248`), `ưu thế quân số cục bộ` (`p000250`) và `phòng ngự cơ động` (`p000250`)."
