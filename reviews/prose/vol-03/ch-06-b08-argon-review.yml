  proposed_vi: "thống nhất hệ thống chỉ huy (chapter006_002/p000227) / Cộng hòa, cường quốc, các thuộc địa, bộ tham mưu, vị tướng (chapter006_002/p000229) / phân tích dữ liệu, lập kế hoạch tác chiến (chapter006_002/p000230) / hai sư đoàn của Đế quốc, de Lugo, Tướng địch Romel, các lực lượng của Khối Thịnh vượng chung, những trận đánh cơ động (chapter006_002/p000231, p000244) / phân tán lực lượng tiến quân (chapter006_002/p000232) / hậu cần, đạo quân tập trung, nguồn tiếp tế, khủng hoảng tiếp tế (chapter006_002/p000233) / lực lượng Đế quốc, một quân đoàn, quân Đế quốc (chapter006_002/p000234, p000235, p000238, p000246) / Lục quân Đế quốc (chapter006_002/p000236, p000248, p000250) / quân Cộng hòa, Khối Thịnh vượng chung, các tuyến phòng thủ, Turus (chapter006_002/p000238, p000246, p000248) / Tướng von Romel, hồ sơ chiến tích, chiến tranh cơ động (chapter006_002/p000243) / chia mũi tiến quân đúng thời điểm (chapter006_002/p000244) / hiệu quả tổ chức (chapter006_002/p000245) / lục địa phía nam (chapter006_002/p000246) / quân đội Đế quốc, lãnh thổ Ildoa, Vương quốc Ildoa (chapter006_002/p000247, p000249) / lực lượng viễn chinh, các cơ sở cảng biển (chapter006_002/p000248) / kịch bản chuẩn mực theo sách giáo khoa, các sĩ quan Đế quốc, ưu thế quân số cục bộ, các đơn vị Cộng hòa, phòng ngự cơ động (chapter006_002/p000250) / Romel (chapter006_002/p000251)"
  alternatives_vi:
  - quân團 viễn chinh hoặc đạo quân viễn chinh (thay cho `lực lượng viễn chinh` tại chapter006_002/p000248 — ưu tiên `lực lượng viễn chinh` vì bám sát danh từ nguồn và bao quát đúng quy mô cấp quân đoàn của Romel mà không tự đổi cấp biên chế) / hạng mục cảng biển hoặc công trình cảng (thay cho `các cơ sở cảng biển` tại chapter006_002/p000248 — ưu tiên `các cơ sở cảng biển` vì tự nhiên, chuẩn xác về hậu cần hải cảng) / ưu thế binh lực cục bộ (thay cho `ưu thế quân số cục bộ` tại chapter006_002/p000250 — ưu tiên `ưu thế quân số cục bộ` để giữ rõ sắc thái số lượng đối sánh trực tiếp với cụm sức chiến đấu đứng trước) / phòng thủ cơ động (thay cho `phòng ngự cơ động` tại chapter006_002/p000250 — ưu tiên `phòng ngự cơ động` vì là thuật ngữ học thuyết tác chiến quân sự tiêu chuẩn tương ứng với `chiến tranh cơ động`)
