- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000086
  locks:
  - "Giữ dấu ba chấm mở đầu và nhận định nối tiếp lập luận cuối lô b11 rằng việc phung phí phần lớn sức công phá khủng khiếp ấy thật vô nghĩa đến mức phát bực."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000087
  locks:
  - "Giữ thuật ngữ “tính hiệu quả chi phí”, giả định quá khứ về một thứ phát tán rộng như “bom chùm” lẽ ra đã phát huy tác dụng tốt hơn, cùng dấu nhấn mạnh chữ nghiêng và đại từ “mình” theo DEC-P01-001, DEC-P01-002 ở câu cuối về ý định mắng đám người ở “Xưởng Vũ khí Kỹ thuật Lục quân Đế quốc” nếu còn quay về được căn cứ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000088
  locks:
  - "Giữ nguyên báo cáo: “Không có dấu hiệu tín hiệu ma lực của địch.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000089
  locks:
  - "Giữ nguyên báo cáo tiếp lời: “Đằng này cũng không phát hiện thấy gì.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000090
  locks:
  - "Giữ nguyên hiệu lệnh ngắn gọn: “Được rồi, bắt đầu thôi.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000091
  locks:
  - "Giữ đại từ “chúng ta” và nhận định trước mắt đã đến lúc tập trung vào chiến dịch vì nước đi đầu tiên quyết định tất cả."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000092
  locks:
  - "Giữ đại từ “chúng ta”, điều kiện thành bại phụ thuộc vào việc tấn công trước khi địch kịp phản ứng và suy luận từ việc không thấy tín hiệu địch rằng chúng đang dồn toàn bộ tâm sức xử lý hậu quả của những quả tên lửa."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000093
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn theo DEC-P01-002: `*…Chà, điều đó cũng hoàn toàn dễ hiểu thôi.*`."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000094
  locks:
  - "Giữ chủ thể “Tanya”, sự thông cảm mỉa mai cho quân địch và lý do một người tỉnh táo bình thường sẽ chẳng bao giờ ngờ có con người đi quá giang trên những quả “đạn pháo hay tên lửa tầm xa” để mở cuộc đột kích trực diện."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000095
  locks:
  - "Giữ đại từ trần thuật “nó” (`thuộc cấp của nó`) theo DEC-P01-001, nhận định nước đi đầu tiên sẽ phần nào dễ dàng và nếu quân số ngang ngửa với lính gác quanh “sở chỉ huy” thì thuộc cấp cuồng chiến, xứng danh “cựu binh” trên góc độ khách quan của nó sẽ tiêu diệt gọn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000096
  locks:
  - "Giữ khẩu lệnh vô tuyến của 01 gọi tất cả các đơn vị nhắc theo dõi đồng hồ với giới hạn tối đa mười phút trước khi quân tiếp viện của “Cộng hòa” xuất hiện."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000097
  locks:
  - "Giữ đại từ “chúng ta”, phân tích việc phe “Cộng hòa” ưu tiên khắc phục thiệt hại thay vì lập tức xuất kích nghênh chiến và mải hoang mang tìm hiểu các vụ va chạm trong lần đầu bị tấn công bằng “tên lửa tầm xa” đến mức chưa nhận ra quân tấn công đã lẻn vào."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000098
  locks:
  - "Giữ câu kết luận bổ sung: “Nếu không thì chẳng có cách nào lý giải được việc vắng bóng các tín hiệu ma lực.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000099
  locks:
  - "Giữ nguyên báo cáo vô tuyến: “03 gọi 01. Tôi đã chặn thu thành công một tín hiệu. Nó không được mã hóa.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000100
  locks:
  - "Giữ sự chuyển điểm nhìn từ trần thuật ngôi thứ ba (“Tanya”) ở câu đầu sang độc thoại nội tâm ngôi thứ nhất số nhiều (“chúng ta”) ở câu hai cùng định danh “Lục quân Cộng hòa”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000101
  locks:
  - "Giữ mệnh lệnh của Tanya về việc ém “tín hiệu ma lực” tràn vào, rút lui hết tốc lực sau đòn tấn công vào “sở chỉ huy” và bắn hai “pháo hiệu hội quân” mười phút sau khi rời đi."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000102
  locks:
  - "Giữ nguyên câu đáp: “Nghe rõ.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000103
  locks:
  - "Giữ chủ thể “Tanya”, đại từ trần thuật “nó” / phản thân “mình” theo DEC-P01-001, định danh “Thiếu úy Serebryakov”, đại từ “cô ấy”, mốc “Trận Rhine”, và cấu trúc giả định trái thực tế trong quá khứ về việc lấy cớ đi tìm đồng đội tiếp đất hỏng để đẩy phần còn lại của đơn vị tiến vào."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000104
  locks:
  - "Giữ đại từ độc thoại “mình” theo DEC-P01-001, thuật ngữ “lãn công hợp pháp” và phần chú thích trong ngoặc đơn `(với tư cách là một người lao động)`."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000105
  locks:
  - "Giữ đại từ “mình” theo DEC-P01-001, cách gọi “người cộng sự của mình”, mốc “Trận Rhine” và thuật ngữ “vốn con người” theo mục P03-human-capital."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000106
  locks:
  - "Giữ nguyên hiệu lệnh: “Được rồi, chúng ta tiến vào đây.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000107
  locks:
  - "Giữ danh xưng “Viên thiếu úy”, chủ thể “Tanya” và đại từ “nó” / “mình” theo DEC-P01-001, niềm tin vào khả năng trưởng thành và phát triển của con người cùng hành động ém “tín hiệu ma lực” tối đa lao lên xung kích."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000108
  locks:
  - "Giữ câu trần thuật ngắn với đại từ “nó” theo DEC-P01-001: “Các thuộc cấp của nó bám sát theo sau.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000109
  locks:
  - "Giữ chủ thể “Tanya” và cảnh tượng lính địch hoàn toàn bị đánh úp bất ngờ, há hốc mồm nhìn trân trân về phía họ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000110
  locks:
  - "Giữ thuật ngữ “căn cứ hậu phương”, nhận định các sĩ quan tại đây không biết cách kiểm soát hỗn loạn và đại từ độc thoại “mình” ở câu cuối theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000111
  locks:
  - "Giữ chủ thể “Tanya” và đại từ “nó” theo DEC-P01-001, thuật ngữ “súng tiểu liên”, dấu ngoặc kép quanh cụm “nhặt được” và hành động vừa dọn dẹp binh lính “Cộng hòa” vừa tiếp tục tiến lên."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000112
  locks:
  - "Giữ đại từ độc thoại “Mình” theo DEC-P01-001, sự bất an nhẹ khi nhiều kẻ không mang vũ khí và lập luận rằng mặc định những người có mặt tại căn cứ là “thành viên tham chiến” để bắn hạ sẽ không gây vấn đề về “luật pháp quốc tế”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000113
  locks:
  - "Giữ đại từ “mình” ở câu đầu và “Tanya” / “mình” / “nó” ở câu hai theo DEC-P01-001, cùng hai cặp dấu nhấn mạnh chữ nghiêng tách biệt bao quanh cụm từ không in nghiêng ở giữa (`*Hai chữ* kẻ địch *tiện lợi ở chỗ nó chẳng đòi hỏi phải bàn cãi gì cả*`) đúng theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000114
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng tại hiệu lệnh `*Quân địch! Bắn!*` theo DEC-P01-002, nhận định về đỉnh cao của kỷ luật quân đội và thuật ngữ tâm lý học “Điều kiện hóa từ kết quả”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000115
  locks:
  - "Giữ nguyên câu hỏi của Tanya với Serebryakov: “Thiếu úy, tình hình đằng đó thế nào?”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000116
  locks:
  - "Giữ nguyên câu đáp lễ phép của cấp dưới: “An toàn! Không có vấn đề gì ạ.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000117
  locks:
  - "Giữ định danh “Thiếu úy Serebryakov”, chủ thể “Tanya” / phản thân “mình” theo DEC-P01-001, và dấu nhấn mạnh chữ nghiêng ở từ cảm thán cuối đoạn (`*Tuyệt vời.*`) theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000118
  locks:
  - "Giữ đại từ độc thoại “Mình” theo DEC-P01-001, niềm vui bất ngờ khi không có kẻ địch đáng gờm nào truy kích từ phía sau và nhận định dự đoán của “Bộ Tổng tham mưu” rằng sở chỉ huy “Lục quân Cộng hòa” được phòng thủ dày đặc đã trật lất."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000119
  locks:
  - "Giữ lời lẩm bẩm của Tanya với thuật ngữ “những người theo chủ nghĩa duy lý” và đại từ tự nhủ “chính mình” ở câu cuối."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000120
  locks:
  - "Giữ đầy đủ các thuật ngữ và định danh ở đoạn kết lô: “Những người theo chủ nghĩa duy lý”, “Bộ Tổng tham mưu”, “Lục quân Đế quốc”, “sở chỉ huy Cụm tập đoàn quân Rhine thuộc Cộng hòa”, “hai vị tướng Rudersdorf và Zettour”, “pháp sư không quân” và “V-1”."
