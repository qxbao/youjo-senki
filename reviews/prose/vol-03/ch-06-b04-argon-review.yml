- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000105
  locks:
  - "Giữ dấu ba chấm đầu câu, đại từ `Cô` quy chiếu chỉ huy tiểu đoàn từ góc nhìn của Grantz, thuật ngữ `lệnh ngừng bắn` và hình ảnh thứ mồi lửa có thể gây ra những rắc rối nghiêm trọng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000106
  locks:
  - "Giữ sự đối sánh `giống chống lệnh hơn là vượt thẩm quyền`, tiến trình chiến dịch cùng đơn kháng nghị đều bị bác bỏ, và hành động `cô` túm lấy ve áo `chỉ huy căn cứ` đe dọa `ông` khiến không thể ém nhẹm chuyện đó đi được nữa."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000107
  locks:
  - "Giữ chi tiết suýt xuất kích sau khi gạt phắt nỗ lực ngăn cản của `ông`, cụm `vị chỉ huy tiểu đoàn chân thành, tận tâm của họ`, định danh `Trung úy Weiss, sĩ quan phụ tá lâu năm của cô`, thuật ngữ `tòa án binh` và `trát triệu tập`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000108
  locks:
  - "Giữ sắc thái trớ trêu khi sự xuất hiện của một mối đe dọa từ bên ngoài đã thổi bay toàn bộ những rắc rối ấy."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000109
  locks:
  - "Giữ trọn câu nhấn mạnh chữ nghiêng theo `DEC-P01-002` và định danh `Khối Thịnh vượng chung`: `*Sự can thiệp của Khối Thịnh vượng chung…*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000110
  locks:
  - "Giữ trạng ngữ `Trên danh nghĩa`, hai định danh `Cộng hòa` và `Khối Thịnh vượng chung`, cùng mục đích làm trung gian hòa giải đàm phán hòa bình."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000111
  locks:
  - "Giữ dấu ngoặc kép quanh từ `“thông báo”`, dấu gạch ngang dài và giả định rằng các điều khoản đó sẽ lại bị bác bỏ lần nữa."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000112
  locks:
  - "Giữ nhận định họ chẳng hề có ý định làm trung gian đàm phán hòa bình, các điều khoản quá thiên vị và cụm `“thông báo cuối cùng” hoàn toàn áp đặt một chiều`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000113
  locks:
  - "Giữ định danh `Đế quốc`, `Khối Thịnh vượng chung`, thuật ngữ `tối hậu thư` và việc nó bị bác bỏ thẳng thừng ngay lập tức đúng như dự đoán."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000114
  locks:
  - "Giữ các thuật ngữ `kháng chiến toàn diện`, `đầu hàng có điều kiện`, cấp bậc `Tướng de Lugo`, chức vụ `Thứ trưởng Quốc phòng`, đại từ `ông ta` và tuyên bố họ mới là chính phủ Cộng hòa chân chính."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000115
  locks:
  - "Giữ sự đối lập giữa chính phủ chính thức nằm ở thủ đô đã bị `Đế quốc` chiếm đóng với việc binh lính và hầu hết các thuộc địa đều đứng về phía `de Lugo`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000116
  locks:
  - "Giữ chi tiết trái với suy nghĩ rằng `ông ta` chỉ là con rối của `Khối Thịnh vượng chung`, tuyên bố thành lập `Cộng hòa Tự do` và việc tập hợp các thuộc địa trên `lục địa phía nam` tiếp tục cuộc chiến chống lại `Đế quốc`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000117
  locks:
  - "Giữ cụm `lục địa phía nam đầy biến động chính trị`, thuật ngữ `các đơn vị tuần tra khu vực`, cùng các pháp sư đồn trú nhằm đối phó `Khối Thịnh vượng chung` hoặc `Vương quốc Ildoa`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000118
  locks:
  - "Giữ định danh `Bộ Tổng tham mưu Lục quân Đế quốc` và trạng thái lâm vào cảnh bí thế."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000119
  locks:
  - "Giữ liên minh giữa `Cộng hòa Tự do` và `Khối Thịnh vượng chung`, bài toán để lại nhiều hơn một số lượng quân nhất định trên `chính quốc` trong khi giải quyết tình hình ở `lục địa phía nam`, và quyết định cần đến `chỉ huy tiểu đoàn của Grantz` dù `cô` có xu hướng tự ý hành động."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000120
  locks:
  - "Giữ chi tiết hủy bỏ toàn bộ các hồ sơ đề nghị trao thưởng huân chương đang chờ duyệt của `cô` từ `mặt trận Rhine` và giới hạn cơn thịnh nộ của cấp trên chỉ dừng lại ở mức đó."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000121
  locks:
  - "Giữ nhận xét khi xét đến vị chỉ huy của họ thì cách xử lý đó xem chừng cũng là chuyện hết sức bình thường."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000122
  locks:
  - "Giữ việc người ta nhận thức rõ giá trị của một lực lượng pháp sư hùng mạnh và niềm vui sướng của `Grantz cùng những người khác` trước mức lương được cải thiện đáng kể."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000123
  locks:
  - "Giữ nghịch lý dù được tăng lương nhưng ở vùng đất phương nam bạt ngàn sa mạc này đằng nào cũng chẳng có chỗ nào để tiêu tiền lương."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000124
  locks:
  - "Giữ chi tiết khí hậu khắc nghiệt của `Lục địa phía nam`, việc chấp nhận số phận ở một mức độ nào đó và nỗi thèm khát một cốc bia lạnh buốt."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000125
  locks:
  - "Giữ sự tán thành đối với chiến lược tấn công các thuộc địa của `Khối Thịnh vượng chung` và `Cộng hòa` nhằm tước đi năng lực tiếp tục chiến đấu của chúng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000126
  locks:
  - "Giữ trọn câu nhấn mạnh chữ nghiêng theo `DEC-P01-002`: `*Trấn áp mạnh tay là một chiến lược tốt.*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000127
  locks:
  - "Giữ sự đồng tình về cơ bản của cả `Trung úy Weiss` lẫn `chỉ huy` ở điểm đó."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000128
  locks:
  - "Giữ nhận định về chất lượng binh sĩ triển khai tới phương nam, thuật ngữ `các đơn vị tuyến hai` và việc đám `quân dự bị và quân bổ sung` được gom góp vội vàng thiếu hụt huấn luyện trầm trọng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000129
  locks:
  - "Giữ phép so sánh khiến ngay cả `Grantz`—người từng bị đối xử như một chú gà con chưa rụng hết vỏ trứng trên `mặt trận Rhine`—cũng trông giống một người lính đã được trang bị đầy đủ, cùng giá trị của một đơn vị đã trải qua lửa sắt rửa tội ở `vùng Rhine`."
