  rationale: "Kế thừa nhất quán hệ thống cấp bậc, cơ quan chỉ huy và biệt danh từ các batch trước (`sĩ quan tham mưu`, `sĩ quan tác chiến`, `Cụm tập đoàn quân phương Bắc`, `Cụm tập đoàn quân phương Tây`, `Bộ Tư lệnh`, `mặt trận Rhine`, `Ngân Gỉ`, `Bạch Ngân`, `Ác quỷ sông Rhine`, `Tướng von Romel`, `Bộ Tổng tham mưu`, `Thiếu tá von Degurechaff`, `sĩ quan ma pháp`, `quân đội Đế quốc`); khóa tạm các mục phát sinh trong batch gồm `phòng thí nghiệm kỹ thuật` (p000211) và biệt danh `Chó Điên` (p000218, kết nối trực tiếp với câu than thở `một con chó điên` ở p000222)."
