- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000372
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “chúng ta” và câu đùa nếu có ai gục ngã vì dư âm cơn say thì sẽ phải quẳng xuống biển để làm mát cái đầu lại."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000373
  locks:
  - "Giữ đại từ “nó” cho Tanya theo DEC-P01-001, danh xưng “Trung úy Weiss”, đại từ “anh” cho Weiss và chi tiết một “sĩ quan hải quân” lên tiếng gọi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000374
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các danh xưng “Thiếu tá von Degurechaff”, “Thuyền trưởng Treizel”, ngôi “Tôi / Chúng ta” và thông báo sắp đến tọa độ đã hẹn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000375
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi – anh”, danh xưng “Thuyền trưởng”, lời nhờ báo sẽ tập hợp đơn vị lên boong tàu ngay lập tức và câu hỏi xin một “bản tin thời tiết” cùng một tấm “hải đồ”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000376
  locks:
  - "Giữ ngôi “chúng ta” trong độc thoại nội tâm và mạch ý tạm biệt chuyến hải hành êm ả, những bữa ăn tuyệt hảo cùng nguồn cà phê bất tận để dứt điểm cuộc chiến và giành lại cuộc sống thường nhật trong chớp mắt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000377
  locks:
  - "Giữ ngôi “Chúng ta” và kết luận việc dốc sức cho một cú hích cuối cùng còn mang lại một lợi ích khác nữa: công việc có ý nghĩa chính là hạnh phúc."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000378
  locks:
  - "Giữ tên “Tanya”, sự đối lập giữa quân số cỡ một đại đội đứng chen chúc trên boong tàu ngầm chật hẹp nhưng vẫn có cảm giác rộng rãi đến bất ngờ so với bên trong tàu, và nhận xét cảm thấy nhẹ nhõm là bản tính tự nhiên của con người."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000379
  locks:
  - "Giữ tên “Tanya”, danh xưng “Thuyền trưởng Treizel”, cụm “vị trí quan sát trên đài chỉ huy”, đại từ “ông” và suy đoán hẳn ông đã cất công ra tận đây để tiễn họ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000380
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng “Thiếu tá”, đại từ “ông” và hành động vừa bước xuống vừa chìa tay ra."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000381
  locks:
  - "Giữ cụm “Hai vị chỉ huy”, tên “Tanya” và hành động bắt tay đúng theo nghi thức kèm lời bày tỏ lòng biết ơn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000382
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ “ngài” và danh xưng “Thuyền trưởng Treizel”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000383
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi – các vị”, chỉ đánh dấu chữ nghiêng đúng cụm `*các vị*` đầu tiên theo DEC-P01-002, và lời chúc bình an ngoài đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000384
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “tôi – ngài”, cụm “thủy thủ đoàn” và lời chúc giành thắng lợi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000385
  locks:
  - "Giữ tên “Tanya” và chuỗi hành động chào nhau theo điều lệnh, gật đầu ra hiệu cho binh sĩ rồi cả đội cất cánh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000386
  locks:
  - "Giữ dấu ngoặc kép hội thoại và khẩu lệnh tiễn biệt “Vẫy mũ đi! Vẫy mũ lên!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000387
  locks:
  - "Giữ danh xưng “Thuyền trưởng Treizel”, cụm “thủy thủ đoàn” và hình ảnh cả đại đội lên đường trong màn tiễn biệt giản dị mà chân tình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000388
  locks:
  - "Giữ các định danh “Vùng Đất Thấp”, “Tanya”, “Rhine Control” và mạch diễn biến bay suôn sẻ tới không phận được chỉ định rồi gọi liên lạc như thói quen thường lệ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000389
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Fairy 01”, “Rhine Control” và khẩu lệnh gọi vô tuyến tiêu chuẩn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000390
  locks:
  - "Giữ thuật ngữ “kiểm soát viên”, dấu ngoặc kép hội thoại, các định danh “Fairy 01”, “Rhine Control”, “hô hiệu Hotel 09” và thông báo nghe to, rõ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000391
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Hotel 09”, “Fairy 01”, ngôi “Tôi” và xác nhận tín hiệu bên đó cũng rất rõ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000392
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Hotel 09”, ngôi “tôi – các vị” và lời khen chiến công xuất sắc kèm câu đùa có cả một đạo quân muốn khao nên sẽ được uống chùa suốt đời."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000393
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Fairy 01”, ngôi “tôi” và câu đáp hóm hỉnh thuộc “phe Cà phê”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000394
  locks:
  - "Giữ định danh “Rhine Control” và nhận định việc có thể bông đùa như vậy cho thấy họ đang khá thư thái, là một tín hiệu tốt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000395
  locks:
  - "Giữ tên “Tanya” ở câu đầu văn bản phẳng và chỉ đánh dấu chữ nghiêng toàn bộ câu thứ hai `*Thông thường, hẳn họ đang phải điều phối các cuộc đánh chặn, gào thét chỉ đạo đến khản cả giọng để xử lý đủ thứ rắc rối; cục diện chiến sự ắt hẳn phải đang vô cùng thuận lợi thì họ mới có được sự thảnh thơi trong tâm trí để trò chuyện cởi mở và giàu tính người đến vậy.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000396
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “tôi – các vị”, đại từ “anh ấy” và chi tiết vị sĩ quan lên kế hoạch cho buổi tiệc mừng trở về lại thuộc “phe Trà”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000397
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Fairy 01”, ngôi “chúng tôi” và câu hỏi về nhiệm vụ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000398
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm nhiệm vụ “lùng sục và đánh chặn”, giới hạn chỉ ở mức được phép tấn công nếu tình cờ bắt gặp địch trên đường về, và lời nhắn mọi người đang chờ những người hùng là “các vị” trở về an toàn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000399
  locks:
  - "Giữ tên “Tanya”, thuật ngữ “kiểm soát viên”, ngôi “chúng ta” trong độc thoại nội tâm và nhận xét triển vọng thuận lợi thực sự giúp nâng cao nhân tính của con người."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000400
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi / Chúng tôi” và ý bộ binh dưới mặt đất đang vất vả chiến đấu nên đơn vị sẽ tiến lên gánh đỡ bớt phần nào cho họ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000401
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thông tin thời tiết tại không phận (trời quang, gần như không có gió, tầm nhìn tốt) và lời nhắc coi chừng hỏa lực từ dưới mặt đất."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000402
  locks:
  - "Giữ đại từ nội tâm tự quy chiếu “mình”, tên “Tanya” kèm đại từ ngôi thứ ba “con bé” khi nhân vật tự tách góc nhìn với vỏ bọc của mình theo DEC-P01-001, và sắc thái tự trào về tâm lý vị tha cùng khao khát làm việc thiện."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000403
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Fairy 01” và câu hỏi về dữ liệu các đơn vị pháp sư địch."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000404
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “chúng tôi”, các định danh “Khối Thịnh vượng chung”, “Cộng hòa”, thuật ngữ “học thuyết”, “Kiểm soát viên” và chi tiết chỉ riêng trong khoảnh khắc cảnh báo ấy giọng anh ta trở nên nghiêm túc."
