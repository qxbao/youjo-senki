  - "Giữ sự phân biệt đại từ “anh” (John bấm nút gọi) với “anh ta” (Caine), phủ định mức độ “không đến mức tê liệt hoàn toàn cảm giác như vậy”, và dấu nhấn mạnh chữ nghiêng `*...*` chỉ bao quanh câu suy đoán thứ hai về dây thần kinh đã hỏng theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000591
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, hai dấu chấm lửng và lời cầu nguyện “Xin Chúa rủ lòng thương… amen.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000592
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cấu trúc giả định “Nếu… thì…”, định danh “người Cộng hòa”, đại từ “tôi / chúng tôi” và cụm “lỗi bất kính về văn hóa”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000593
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ nội tâm “mình” và cụm “tên nội gián của Đế quốc”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000594
  locks:
  - "Giữ đại từ “anh” quy chiếu John và cấu trúc phủ định kép “không phải là vô cớ”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000595
  locks:
  - "Giữ định danh “Caine” và quan hệ nhân quả giữa việc “mất trí nhớ” với nguyên nhân “do ngộ độc khí carbon monoxide”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000596
  locks:
  - "Giữ đại từ “anh ta” quy chiếu Caine và phủ định hoàn toàn khả năng cung cấp thông tin hữu ích."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000597
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ “anh” và lời chúc sớm bình phục."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000598
  locks:
  - "Giữ định danh “John”, đại từ “anh” và chuỗi hành động rời phòng, thở dài rồi nhấc điện thoại của bệnh viện."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000599
  locks:
  - "Giữ định danh “Lục quân Cộng hòa”, đại từ “Anh / mình” cho John, dấu gạch ngang và nhận định tình trạng người đàn ông ấy “gần với một cái xác hơn”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000600
  locks:
  - "Giữ định danh “Caine”, sự phân biệt đại từ “anh” (John) và “anh ta” (Caine), cùng chi tiết tình trạng xấu đi nhanh chóng sau cuộc trò chuyện."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000601
  locks:
  - "Giữ định danh “John”, đại từ “anh ta” quy chiếu Caine và chỉ thị của cấp trên về việc nhanh chóng bàn giao thay vì tra hỏi vô ích."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000602
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` chỉ bao quanh câu độc thoại đầu đoạn theo DEC-P01-002, định danh “Cộng hòa”, đại từ nội tâm “mình”, và hai cụm trong ngoặc kép “tổ chức từ thiện”, “khu vực nguy hiểm”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000603
  locks:
  - "Giữ hai phần chữ nghiêng `*Hơn nữa*` và `*xét tới việc Tướng Habergram sẽ nổi trận lôi đình đến mức nào, phía Cộng hòa cũng nên gánh bớt một phần trách nhiệm.*` tách biệt quanh cụm trần thuật giữa câu theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000604
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` ở câu đầu và câu thứ ba (câu thứ hai để phẳng) theo DEC-P01-002, định danh “Habergram”, đại từ nội tâm “mình” và trần thuật “anh”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000605
  locks:
  - "Giữ đại từ “anh” và chuỗi thao tác rút xì gà, ngậm vào miệng, cắt đầu điếu, châm lửa và rít một hơi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000606
  locks:
  - "Giữ định danh “John”, cụm “tinh thần John Bull⁷” kèm ký hiệu chú thích thượng chỉ `⁷`, và sự tương phản giữa niềm tự hào luôn giữ bình tĩnh với việc tình huống lần này là một thử thách."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000607
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh câu đầu theo DEC-P01-002, từ “ẩm thực” trong ngoặc kép, đại từ “Tôi / tôi” và các định danh “Habergram”, “Tình báo”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000608
  locks:
  - "Giữ cặp dấu gạch ngang nhấn mạnh sự miễn cưỡng và các định danh “John”, “Khối Thịnh vượng chung”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000609
  locks:
  - "Giữ đại từ “anh” và cấu trúc loại trừ “Ngoài trà ra, chẳng có thứ gì…”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000610
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*Haiz*` ở đầu câu theo DEC-P01-002, đại từ “anh / mình” và định danh “Cộng hòa”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000611
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*Khổ thật đấy.*` ở câu đầu theo DEC-P01-002 và hình ảnh ẩn dụ “cơn bão báo cáo”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000612
  locks:
  - "Giữ đại từ “Anh / anh / mình” và hình ảnh so sánh người đàn ông chẳng khác nào con rồng khi nổi trận lôi đình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000613
  locks:
  - "Giữ đại từ “anh” và sự đối lập giữa việc càu nhàu trong bụng với việc không để lộ chút gì ra mặt khi vào phòng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000614
  locks:
  - "Giữ đại từ “Anh”, cụm danh từ chung viết thường “vị thiếu tướng” và chi tiết báo cáo miệng tóm lược những điểm chính."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000615
  locks:
  - "Giữ từ “may mắn” trong ngoặc kép, đại từ “anh” và chi tiết có đủ thời gian để bịt tai lại ngay khi vừa dứt lời."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000616
  locks:
  - "Giữ đại từ “anh” và hành động tận dụng ngay lập tức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000617
  locks:
  - "Giữ dấu ngoặc kép hội thoại, chuỗi dấu chấm lửng mở đầu và câu quát in hoa toàn bộ “ĐỪNG CÓ GIỠN MẶT VỚI TAO!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000618
  locks:
  - "Giữ các chi tiết “thủy thủ”, “hải quân từ thời tàu buồm” và cấp so sánh hơn của tiếng gào thét từ “vị tướng đang giận dữ này”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000619
  locks:
  - "Giữ định danh đầy đủ “Thiếu tướng Habergram thuộc Cục Chiến lược Đối ngoại”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000620
  locks:
  - "Giữ đại từ “ông” quy chiếu Habergram, dấu gạch ngang giải thích chiếc bàn gỗ sồi, câu độc thoại in nghiêng `*Sức mạnh mới tráng lệ làm sao.*` theo DEC-P01-002, và định danh “John”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000621
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “ông ấy” và cụm “võ sư dạy baritsu”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000622
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ tôn xưng “ngài” và chi tiết người sống sót duy nhất bị thiêu bỏng trước cả khi kịp nhận ra."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000623
  locks:
  - "Giữ danh xưng trong ngoặc kép “Ông John”, đại từ “anh / mình” và hàm ý bịt tai vì biết trước sẽ bị gào vào mặt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000624
  locks:
  - "Giữ các định danh “John”, “Habergram”, đại từ “anh” và quan hệ nhân quả nhờ quen biết lâu nên biết cách làm ông dịu xuống."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000625
  locks:
  - "Giữ cấu trúc hai cụm thoại kẹp câu trần thuật của “John” ở giữa, đại từ “tôi / chúng ta / anh ta”, định danh “Cộng hòa” và nhận định không thể trông đợi một bản báo cáo tiếp theo."
