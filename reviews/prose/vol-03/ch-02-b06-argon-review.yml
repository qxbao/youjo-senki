locked_choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000101
  locks:
  - "Giữ tên “Rudersdorf”, “Zettour”, đại từ “ông”, chi tiết nuốt ngược những lời sắp thốt ra và nhận thức rằng nếu ngay cả Zettour cũng nói là bất khả thi thì mọi mưu kế của con người đều đã được vắt kiệt đến tận cùng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000102
  locks:
  - "Giữ điều kiện giả định nếu giao cho bất kỳ ai khác và mức độ phỏng đoán “có lẽ họ chẳng thể cung cấp nổi lấy một nửa những gì Zettour vừa cam kết”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000103
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách gọi “Bạn tôi ơi”, ngôi xưng “tôi – ông / chúng ta”, sự đồng tình với kế hoạch chiến dịch và lời khẳng định con số đó đã là giới hạn khả năng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000104
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi “Vậy chúng ta có thể tác chiến dưới những điều kiện đó trong bao lâu?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000105
  locks:
  - "Giữ tên “Rudersdorf” và hai câu hỏi liên tiếp về giới hạn cùng khoảng thời gian cụ thể có thể duy trì lượng tiếp tế ít ỏi đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000106
  locks:
  - "Giữ dấu ngoặc kép hội thoại, mốc thời gian “Hai tuần”, điều kiện nếu không bị tiêu hao quá nặng nề thì kéo dài thêm được hai tuần nữa và lời khuyên sau đấy mọi người nên cầu nguyện “Thượng đế” theo đức tin của mình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000107
  locks:
  - "Giữ tên “Rudersdorf”, đại từ “ông” và sự tương phản giữa giới hạn thời gian khắc nghiệt với việc tìm thấy một tia hy vọng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000108
  locks:
  - "Giữ mệnh đề điều kiện bỏ lửng “Nếu họ có thể thành công tiêu diệt lực lượng chủ lực của địch…”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000109
  locks:
  - "Giữ điều kiện “Nếu họ nhổ tận gốc khả năng phản kháng của kẻ địch” và hệ quả tổ chức lễ tiếp quản “cung điện Parisii” trước khi tháng sau kết thúc."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000110
  locks:
  - "Giữ hai cặp dấu ngoặc kép hội thoại bao quanh câu trần thuật giữa đoạn, các thuật ngữ “chiến tranh chiến hào”, “các tuyến tiếp tế”, “các tuyến nội địa”, “Lục quân Đế quốc”, giả định biến ra cỏ khô cho ngựa và đường sắt từ hư không, cùng hình ảnh ẩn dụ “làm cho chim cánh cụt bay lên được”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000111
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng “chúng ta / ông”, nhận xét nói chuyện đúng chuẩn sách giáo khoa và câu hỏi xác nhận khả năng cung cấp lượng tiếp tế tối thiểu cho các đơn vị đang tiến quân."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000112
  locks:
  - "Giữ câu trần thuật ngắn “Hướng duy nhất có thể đi là tiến về phía trước.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000113
  locks:
  - "Giữ đại từ “ông”, định danh “bộ phận Hậu cần”, tên “Zettour” và nhịp nhấn mạnh “mức tối thiểu—mức tối thiểu sát sạt—những gì họ cần để làm được điều đó”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000114
  locks:
  - "Giữ dấu ngoặc kép hội thoại, địa danh “Parisii”, ẩn dụ “nhà giả kim” không thể tạo ra nguồn vàng vô tận, các định danh “Lục quân Cộng hòa”, “Bộ Tổng tham mưu” và điều kiện nếu không nhử và tiêu diệt được chủ lực địch thì phải từ bỏ Parisii."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000115
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ “pháo hạng nặng” và câu hỏi nài nỉ của Rudersdorf."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000116
  locks:
  - "Giữ tên “Rudersdorf”, câu trần thuật đầu để phẳng và chỉ đánh dấu chữ nghiêng ở đúng câu cầu khẩn cuối `*Chỉ một chút thôi cũng được, làm ơn đi mà.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000117
  locks:
  - "Giữ hai phần hội thoại tách bởi câu trần thuật tả Zettour trừng mắt và hạ giọng, con số “tám quả đạn pháo”, chi tiết trưng dụng ngựa nông trang và kho cỏ khô dự trữ của dân thường, địa danh “Vùng Đất Thấp” và thành ngữ “đòi hỏi chuyện hái sao trên trời”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000118
  locks:
  - "Giữ quan hệ nhân quả: vì chính Rudersdorf đã đích thân yêu cầu bố trí tập trung số pháo đó nên không thể đòi người bạn của mình xoay thêm ra được nữa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000119
  locks:
  - "Giữ dấu ngoặc kép hội thoại, sự nhượng bộ “Tôi biết, tôi biết rồi.” và kết luận phải tìm cách cải thiện khả năng cơ động của pháo binh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000120
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ “pháo binh cơ giới hóa”, định danh “Vũ khí Kluku” và đề nghị bàn bạc nhân cơ hội này."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000121
  locks:
  - "Giữ tên “Rudersdorf và Zettour”, cấu trúc “không chỉ pháo hạng nặng, mà là của pháo binh nói chung” và mối lo ngại về vấn đề cơ động khi tính đến chuyện tiến quân."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000122
  locks:
  - "Giữ sự tương phản giữa “chiến tranh chiến hào” (chống chịu được một mức độ “hỏa lực phản pháo” nhất định nhờ ẩn mình trong công sự và boong-ke) với “trận dã chiến” (vô cùng khó thay đổi trận địa nhanh chóng khiến hỏa lực thường xuyên đến muộn trong những cuộc giao chiến mang tính quyết định)."
