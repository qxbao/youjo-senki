locked_choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000323
  locks:
  - "Giữ đại từ `nó` theo `DEC-P01-001`, thuật ngữ `tính hợp lý`, sự đối lập giữa việc nhiều khi quân đội hành xử vô lý nhưng không thể phớt lờ lý lẽ hoàn toàn, và câu nhận xét trong ngoặc đơn về việc tranh cãi một lý thuyết bẻ cong các quy luật vật lý chẳng giúp đánh bại kẻ thù."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000324
  locks:
  - "Giữ lời phản biện của Tướng von Romel với đại từ `chúng ta`: `“Nhưng chúng ta đã phái các đơn vị trinh sát đi rồi mà.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000325
  locks:
  - "Giữ địa danh `Turus`, tên riêng `Tanya` đi cùng đại từ `nó`, đại từ `ông ta` quy chiếu Romel trong phần dẫn, thuật ngữ `thiết bị dẫn đường` và hạn chế khó thực hiện `trinh sát ban đêm` của `các đơn vị không quân`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000326
  locks:
  - "Giữ nhận định về sự hợp lý khi điều `không quân` trinh sát phía trước `đạo lục quân đang tiến lên`, và việc một người `lính bộ binh` bình thường gần như không thể trinh sát phía trước giữa vùng sa mạc không có `cột mốc định hướng`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000327
  locks:
  - "Giữ ưu thế của `máy bay trinh sát` được trang bị `máy dẫn đường`, cùng hạn chế vào ban đêm khi khả năng `chụp ảnh trên không` cực kỳ giới hạn và chuyện không thu được tấm ảnh nào không phải điều hiếm gặp."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000328
  locks:
  - "Giữ đại từ `nó`, định danh `Tướng von Romel` và `các sĩ quan tham mưu` đang cố gắng hết sức mình."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000329
  locks:
  - "Giữ mục tiêu tiến quân nhanh chóng và hiệu quả để giáng đòn trước khi địch kịp tập hợp, nhận định `Quân đội Đế quốc` không ngu ngốc đến mức không lo lắng chuyện thiếu trinh sát, sự phối hợp hiệp đồng giữa trên không và mặt đất, và việc `Tanya` ghi nhận thành tựu đáng trân trọng ấy."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000330
  locks:
  - "Giữ các giới hạn kỹ thuật của máy bay khi `trinh sát mặt đất vào ban đêm`, nguy cơ tai nạn quá lớn nếu bất chấp cất cánh, và rủi ro địch lần ra manh mối động tĩnh từ máy bay bị rơi."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000331
  locks:
  - "Giữ lời thoại nối tiếp của Tanya với đại từ `chúng ta`: `“Mà kể cả khi không có chuyện đó, thông tin tình báo của chúng ta vẫn chưa hoàn chỉnh.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000332
  locks:
  - "Giữ bổn phận của một sĩ quan buộc `Tanya` phải chỉ ra bài toán hóc búa hơn nằm ở `tầm nhìn bị hạn chế` của họ."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000333
  locks:
  - "Giữ hai vấn đề là nhiên liệu và vùng lãnh thổ nằm dưới quyền kiểm soát của không quân địch, cùng câu hỏi tu từ về những giới hạn vẫn tồn tại dù họ thực thi nhiệm vụ tận tụy và nghiêm túc đến đâu."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000334
  locks:
  - "Giữ ý `các báo cáo của không quân` vất vả lắm mới thu thập được chỉ phản ánh một mặt của tình hình, tư cách `sĩ quan tham mưu` của `nó`, và nguy cơ thu về dữ liệu thiên lệch hoặc những hiểu lầm hoàn toàn sai lệch nếu quá ỷ lại vào không quân."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000335
  locks:
  - "Giữ lời kết luận đề xuất của Tanya với cặp đại từ `tôi` – `chúng ta`: `“Xét những mối lo ngại đó, tôi tin chắc rằng chúng ta nên thực hiện các biện pháp phòng ngừa.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000336
  locks:
  - "Giữ sự phân biệt giữa `nó` trong trần thuật và `mình` trong mệnh đề phụ thuộc theo `DEC-P01-001`, lợi ích của `vị tư lệnh`, và niềm tự hào của `Tanya` khi đưa ra một `đề xuất đôi bên cùng có lợi`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000337
  locks:
  - "Giữ dấu ba chấm mở đầu và câu lệnh ngắn gọn của Tướng von Romel: `“…Được rồi. Phê chuẩn.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000338
  locks:
  - "Giữ lời cảm ơn và nhận lệnh của Tanya với `ngài` – `Tôi` – `mình`: `“Xin cảm tạ ngài. Tôi sẽ dẫn tiểu đoàn của mình xuất kích ngay lập tức.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000339
  locks:
  - "Giữ đại từ `Nó` / `mình` cho Tanya, `ông ta` cho Romel, định danh `Thượng úy Weiss` đang `trực chiến để ứng phó nhanh` và đại từ `anh` bắt máy ngay sau một hồi chuông."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000340
  locks:
  - "Giữ chính xác từ cảm thán in nghiêng `*Tuyệt vời.*` ở đầu đoạn theo `DEC-P01-002`, đại từ `anh` quy chiếu Weiss, và đại từ `nó` / `mình` quy chiếu Tanya khi báo lệnh xuất kích rồi lao băng qua bãi cát về lều."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000341
  locks:
  - "Giữ cụm `Trinh sát ban đêm tầm xa` giữa sa mạc, yêu cầu kiểm tra kỹ các `khí cụ dẫn đường`, đề phòng `bão cát` cắt đứt liên lạc, và công tác chuẩn bị của một `đơn vị tác chiến độc lập` trong môi trường đặc thù của sa mạc."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000342
  locks:
  - "Giữ các định danh `bản đồ dẫn đường`, `sĩ quan phụ tá`, `Thiếu úy Serebryakov`, `Weiss`, phương án tách bốn `đại đội` tản ra thành một tuyến ngang rồi quay về `điểm tập kết đã định`, và nhận xét đó là phương pháp chính quy nhưng hữu ích."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000343
  locks:
  - "Giữ mục tiêu xác định vị trí của `lực lượng Cộng hòa` trong `cuộc hành quân phân tán` của chúng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000344
  locks:
  - "Giữ đại từ `nó`, các thuật ngữ `trinh sát sĩ quan` và `trận đánh tao ngộ`, cùng thái độ hài lòng của Tanya khi âm thầm làm việc phía sau hậu trường để giảm thiểu nguy hiểm từ trước."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000345
  locks:
  - "Giữ chính xác hai cụm in nghiêng `*Hơn bất cứ điều gì*` và `*mình chỉ mừng vì đây không phải là trinh sát chiến đấu.*` theo `DEC-P01-002`, phân biệt rõ `nó` ở phần dẫn chen giữa và `mình` trong nội tâm theo `DEC-P01-001`, cùng hồi ức bị vắt kiệt sức ở `mặt trận sông Rhine`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000346
  locks:
  - "Giữ sự đối lập giữa `Trinh sát chiến đấu` (phải tiến lên trong khi hứng chịu làn đạn của địch) và `trinh sát thông thường` (chỉ cần mang thông tin tình báo trở về), cùng cảm giác nhẹ nhõm hơn nhiều khi bay lượn mà không lấy việc bị bắn làm tiền đề mặc định."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000347
  locks:
  - "Giữ đại từ `nó`, nhận thức về mối nguy bị địch truy kích trong nhiệm vụ trinh sát, và thực tế hiện tại họ vẫn chưa nhận được bất kỳ `báo cáo chạm trán quân địch` nào trên toàn bộ khu vực."
