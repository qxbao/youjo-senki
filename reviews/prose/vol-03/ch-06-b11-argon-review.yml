  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thuật ngữ đã khóa từ B01–B10 và các quyển trước (`tính hợp lý`, `Tướng von Romel`, `sĩ quan tham mưu`, `Quân đội Đế quốc`, `Thượng úy Weiss`, `sĩ quan phụ tá`, `Thiếu úy Serebryakov`, `lực lượng Cộng hòa`, `mặt trận sông Rhine`, `trinh sát chiến đấu`); khóa tạm địa danh `Turus` (`p000325`) và các thuật ngữ tác chiến – điều hướng mới trong lô gồm `thiết bị dẫn đường` / `máy dẫn đường` / `khí cụ dẫn đường` / `bản đồ dẫn đường` (`p000325`, `p000327`, `p000341`, `p000342`), `chụp ảnh trên không` (`p000327`), `cuộc hành quân phân tán` (`p000343`), `trinh sát sĩ quan` và `trận đánh tao ngộ` (`p000344`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_romel_dialogue_and_battalion_sortie_register_vol03_ch06_b11
  proposed_vi: "Trần thuật ngôi thứ ba và độc thoại nội tâm của Tanya (chapter006_002/p000323–p000347): quy chiếu ngôi thứ ba Tanya nhất quán bằng `nó` (`p000323`, `p000325`, `p000328`, `p000334`, `p000336`, `p000339`, `p000340`, `p000344`, `p000345`, `p000347`) và tự quy chiếu / độc thoại nội tâm bằng `mình` (`p000336`, `p000338`, `p000339`, `p000340`, `p000342`, `p000345`) theo đúng `DEC-P01-001` / Hội thoại quân sự giữa Tanya và Tướng von Romel (chapter006_002/p000324–p000338): hai bên dùng `chúng ta` khi bàn về tình hình chung của quân Đế quốc (`p000324`, `p000325`, `p000331`, `p000335`); Tanya xưng `tôi` và gọi Romel là `ngài` (`p000335`, `p000338`); Romel ra lệnh ngắn gọn `“…Được rồi. Phê chuẩn.”` (`p000337`) và được quy chiếu ngôi thứ ba trong trần thuật là `ông ta` (`p000325`, `p000339`) / Quy chiếu thuộc cấp tại tiểu đoàn (chapter006_002/p000339–p000342): `Thượng úy Weiss` được quy chiếu ngôi thứ ba là `anh` (`p000339`, `p000340`); `Thiếu úy Serebryakov` giữ nguyên cấp bậc kèm chức danh `sĩ quan phụ tá` (`p000342`)"
  alternatives_vi:
  - "cô (thay cho `nó` trong trần thuật ngôi thứ ba quy chiếu Tanya — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / cậu ta (thay cho `anh` khi quy chiếu Thượng úy Weiss tại chapter006_002/p000339, p000340 — ưu tiên `anh` để đồng nhất với B03 và các chương trước)"
