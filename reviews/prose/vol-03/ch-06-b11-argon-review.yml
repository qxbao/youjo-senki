  proposed_vi: "tính hợp lý (chapter006_002/p000323) / các đơn vị trinh sát (chapter006_002/p000324) / các đơn vị không quân, Turus, thiết bị dẫn đường, trinh sát ban đêm (chapter006_002/p000325) / không quân, đạo lục quân đang tiến lên, lính bộ binh, cột mốc định hướng (chapter006_002/p000326) / máy bay trinh sát, máy dẫn đường, chụp ảnh trên không (chapter006_002/p000327) / Tướng von Romel, các sĩ quan tham mưu / sĩ quan tham mưu (chapter006_002/p000328, p000334) / Quân đội Đế quốc, phối hợp hiệp đồng giữa trên không và mặt đất (chapter006_002/p000329) / trinh sát mặt đất vào ban đêm (chapter006_002/p000330) / thông tin tình báo (chapter006_002/p000331, p000346) / tầm nhìn bị hạn chế (chapter006_002/p000332) / báo cáo của không quân (chapter006_002/p000334) / vị tư lệnh, đề xuất đôi bên cùng có lợi (chapter006_002/p000336) / tiểu đoàn, Thượng úy Weiss, trực chiến để ứng phó nhanh (chapter006_002/p000338, p000339) / trinh sát ban đêm tầm xa, khí cụ dẫn đường, bão cát, đơn vị tác chiến độc lập (chapter006_002/p000341) / bản đồ dẫn đường, sĩ quan phụ tá, Thiếu úy Serebryakov, Weiss, các đại đội, điểm tập kết đã định (chapter006_002/p000342) / lực lượng Cộng hòa, cuộc hành quân phân tán (chapter006_002/p000343) / trinh sát sĩ quan, trận đánh tao ngộ (chapter006_002/p000344) / mặt trận sông Rhine, trinh sát chiến đấu, trinh sát thông thường (chapter006_002/p000345, p000346) / báo cáo chạm trán quân địch (chapter006_002/p000347)"
  alternatives_vi:
  - "khí cụ định vị / máy định vị / bản đồ hàng không (thay cho `thiết bị dẫn đường` / `máy dẫn đường` / `khí cụ dẫn đường` / `bản đồ dẫn đường` tại chapter006_002/p000325, p000327, p000341, p000342 — ưu tiên bộ thuật ngữ gốc `dẫn đường` để giữ tính hệ thống cho các trang thiết bị điều hướng giữa sa mạc) / không ảnh (thay cho `chụp ảnh trên không` tại chapter006_002/p000327 — ưu tiên `chụp ảnh trên không` vì diễn đạt rõ hoạt động kỹ thuật của máy bay trinh sát vào ban đêm) / tiến quân phân tán (thay cho `cuộc hành quân phân tán` tại chapter006_002/p000343 — ưu tiên `cuộc hành quân phân tán` vì tự nhiên và khớp với danh từ trong câu) / sĩ quan đi trinh sát (thay cho `trinh sát sĩ quan` tại chapter006_002/p000344 — ưu tiên `trinh sát sĩ quan` vì giữ đúng sắc thái thuật ngữ quân sự chỉ hình thức trinh sát do sĩ quan trực tiếp thực hiện) / trận đánh chạm trán (thay cho `trận đánh tao ngộ` tại chapter006_002/p000344 — ưu tiên `trận đánh tao ngộ` vì chuẩn thuật ngữ tác chiến quân sự)"
