- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000080
  locks:
  - "Giữ hai phần hội thoại kẹp giữa câu trần thuật, các định danh `Phó chỉ huy`, `Tanya`, `Trung úy Weiss`, `Brest`, `Cộng hòa`, thuật ngữ `tấm hải đồ`, `lệnh ngừng bắn`, đại từ trần thuật `nó` cho Tanya theo DEC-P01-001, cặp xưng hô `tôi – anh / Chúng ta` trong thoại và nhận định của Tanya rằng hạm đội địch tập trung ở Brest thực chất là đang bí mật đào thoát chứ không đơn thuần rút quân theo lệnh ngừng bắn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000081
  locks:
  - "Giữ nhận định thẳng thừng của Tanya rằng trò mà quân địch đang giở chắc chắn không lẫn đi đâu được chính là `một vụ Dunkirk`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000082
  locks:
