- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000084
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Trung úy`, ngôi `chúng ta` và lập luận đanh thép của Tanya: ngừng bắn không đồng nghĩa với kết thúc chiến tranh mà là chuyện hoàn toàn khác hẳn, và tính đến thời điểm hiện tại họ vẫn đang trong tình trạng chiến tranh."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000085
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Hẳn là anh ta không hiểu rồi.*` theo DEC-P01-002, tên `Weiss`, đại từ `nó` quy chiếu Tanya theo DEC-P01-001 và cảm giác ức chế đến mức không thể tin nổi trước sự dè dặt thong thả của Weiss đối với mệnh lệnh tấn công."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000086
  locks:
  - "Giữ điệp cấu trúc ba câu mở đầu bằng `Chúng ta không thể...`, cụm `để bị vố Dunkirk`, định danh `de Lugo` kẹp giữa cặp dấu gạch ngang dài `—de Lugo—`, đại từ `hắn` và bước tự đính chính nhấn mạnh sau dấu gạch ngang dài: `Không—chúng ta sẽ chẳng thể nào kết thúc nổi nó.`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000087
  locks:
  - "Giữ quan hệ hệ quả tăng tiến: nếu chuyện đó xảy ra thì con đường phía trước sẽ dẫn tới một bãi lầy, và lối thoát duy nhất khỏi đó chỉ có sự hủy diệt."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000088
  locks:
  - "Giữ sự phân biệt đại từ theo DEC-P01-001 (`Nó` trong câu trần thuật, `mình` trong câu độc thoại nội tâm về chủ sử dụng lao động bị phá sản), định danh `Lục quân Đế quốc`, thuật ngữ `chiến tranh tổng lực`, hình ảnh bị vắt kiệt sức như thân trâu ngựa, và dấu nhấn mạnh chữ nghiêng `*Do đó*` ở câu kết đoạn theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000089
  locks:
