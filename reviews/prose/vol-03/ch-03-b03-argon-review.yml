- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000073
  locks:
  - "Giữ sự tương phản kịch tính: đúng lúc `Visha` định hỏi có nên mang cà phê vào không nếu việc này còn mất thêm một lúc thì `Thiếu tá von Degurechaff` nện mạnh nắm đấm xuống bàn rồi đứng phắt dậy, toàn thân run lẩy bẩy."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000074
