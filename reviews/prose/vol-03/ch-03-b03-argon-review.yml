- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000075
  locks:
  - "Giữ dấu ngoặc kép hội thoại và nét lắp bắp sững sờ của Visha: `“Th-Thưa Thiếu tá?”`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000076
  locks:
