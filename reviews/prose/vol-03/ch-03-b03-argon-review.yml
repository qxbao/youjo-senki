- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000090
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Trung úy`, đại từ `anh` và lời chốt hạ của Tanya: hồ sơ sẽ ghi nhận rằng Weiss đã nêu ý kiến phản đối, còn giờ thì phải hành động, chỉ có hành động mà thôi."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000091
  locks:
  - "Giữ ngôi `Họ / chúng ta / Mình`, cụm `bị vố Dunkirk` và quyết tâm sẵn sàng hủy hoại sự nghiệp quân ngũ của mình nếu việc đó ngăn không cho họ bị vố Dunkirk."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000092
  locks:
  - "Giữ tên `Tanya`, đại từ `nó` theo DEC-P01-001, các thuật ngữ `trinh sát chiến đấu`, `lệnh ngừng bắn`, định danh `Bộ Tổng tham mưu` và lập luận: dù thông báo chung về lệnh ngừng bắn sắp tới là một trở ngại đáng kể, nhưng vì đơn vị của nó báo cáo trực tiếp lên Bộ Tổng tham mưu nên họ hẳn phải có thẩm quyền phê chuẩn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000093
  locks:
  - "Giữ đại từ `Nó` (trần thuật) và `chúng ta / mình` (nội tâm kết đoạn) theo DEC-P01-001, các cụm `một trung đội pháp sư`, `trinh sát sĩ quan`, `Chế độ im lặng vô tuyến`, `V-1`, `de Lugo`, `tàu chiến chủ lực` và tính toán tận dụng chế độ im lặng vô tuyến trong những quả V-1 bay ở tốc độ tối đa làm cái cớ hoàn hảo để chí ít cũng giết được de Lugo cùng tàu chiến chủ lực của hắn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000094
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu báo cáo khẩn trương của Visha khi quay lại: `“Xin phép Thiếu tá!”`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000095
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi ngắn gọn của Tanya: `“Đơn vị đã sẵn sàng chưa?”`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000096
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách thưa `Vâng, ... Thiếu tá ạ` và thông tin `ban chỉ huy căn cứ` đang gọi."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000097
  locks:
  - "Giữ câu mở đầu chuyển cảnh mới: ngay cả khi chuyện đó đang diễn ra ngay trước mắt họ, bất kỳ `người lính Đế quốc` hiểu chuyện nào cũng sẽ thấy thật khó tin."
