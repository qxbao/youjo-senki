  proposed_vi: "Hợp chúng quốc (chapter005_002/p000130, p000132, p000134, p000138, p000151–p000153, p000161) / Liên minh Hiệp ước (chapter005_002/p000134, p000138) / song tịch (chapter005_002/p000134) / Đế quốc (chapter005_002/p000156) / lời tuyên thệ trước lá cờ, Tôi xin thề trung thành… với Hợp chúng quốc và đồng bào của mình, một quốc gia dưới quyền Chúa, không thể chia cắt… và để bảo vệ nền Cộng hòa của quốc gia… nhân danh tự do và công lý. (chapter005_002/p000146, p000151, p000153, p000155, p000157) / giao ước (chapter005_002/p000152) / Chúa, Lạy Chúa, xin Ngài, cúi xin Ngài hãy che chở cho chúng con (chapter005_002/p000145, p000153, p000154, p000159, p000160)"
