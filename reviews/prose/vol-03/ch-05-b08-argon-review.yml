- source_term: zettour_rudersdorf_and_general_staff_pronouns_vol03_ch05_b08
  proposed_vi: "Đối thoại giữa hai Trung tướng von Zettour và von Rudersdorf: xưng `tôi`, gọi nhau là `ông`, dùng `chúng ta` / `cả hai chúng ta` khi chỉ chung hai người hoặc phía Đế quốc (chapter005_004/p000052, p000053, p000055, p000057, p000059–p000061, p000063–p000066) / Quy chiếu Tiểu đoàn 203 và chỉ huy đơn vị trong lời thoại của hai vị tướng: dùng `đám người đó`, `họ` cho toàn đơn vị (chapter005_004/p000055, p000057, p000060) và `cô ta` khi nhắc tới cá nhân chỉ huy trong ngữ cảnh trao đổi thực dụng giữa hai tướng lĩnh (chapter005_004/p000057, p000059) / Trần thuật ngôi thứ ba: quy chiếu từng vị tướng là `ông` (chapter005_004/p000055, p000056), gọi gộp hai vị tướng hoặc các tướng lĩnh dự họp là `họ`, `hai vị tướng`, `các vị tướng` (chapter005_004/p000051, p000060, p000073, p000076, p000078–p000080) / Đối thoại trong cuộc họp liên tịch Bộ Tổng tham mưu: sĩ quan trẻ thông báo giờ họp có kính ngữ `ạ` (chapter005_004/p000068); người chủ trì xưng `Tôi`, gọi cử tọa là `các vị` (chapter005_004/p000069, p000074)"
  alternatives_vi:
  - cô ấy (thay cho `cô ta` tại chapter005_004/p000057, p000059 — ưu tiên `cô ta` vì khớp với sắc thái khẩu ngữ suồng sã khi hai vị tướng ví von việc tung Tanya ra trận như thả xích một quân bài hung hãn ở p000057–p000059)
