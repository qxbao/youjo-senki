  proposed_vi: "Tiểu đoàn Pháp sư Trên không số 203, tiểu đoàn tăng cường (chapter005_004/p000055) / các pháp sư trên không (chapter005_004/p000057) / Khối Thịnh vượng chung (chapter005_004/p000063, p000069, p000079) / NĂM THỐNG NHẤT 1925, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, CUỘC HỌP LIÊN TỊCH GIỮA BỘ PHẬN HẬU CẦN VÀ CỤC TÁC CHIẾN (chapter005_004/p000067) / chính quốc Cộng hòa, Liên minh Hiệp ước (chapter005_004/p000069, p000080) / quân đội Đế quốc (chapter005_004/p000070) / Bộ Tổng tham mưu, tổng tham mưu trưởng (chapter005_004/p000071, p000081) / mặt trận phía bắc, khu vực phía bắc (chapter005_004/p000074–p000076) / chính quyền quân quản, quân quản (chapter005_004/p000075, p000080) / Đế quốc, tàn quân của Cộng hòa (chapter005_004/p000077, p000079) / bộ phận Hậu cần, Cục Tác chiến (chapter005_004/p000080) / thống đốc quân sự, Bộ Tư lệnh Tối cao, Cục Nhân sự (chapter005_004/p000081)"
