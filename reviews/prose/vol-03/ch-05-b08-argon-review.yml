locked_choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000051
  locks:
  - "Giữ mệnh đề nhượng bộ–phủ định của Rudersdorf, ẩn dụ `Trong màn sương mù chiến tranh, không phải phát đạn nào cũng có thể trúng hồng tâm.` và kết luận `nếu đạt được kết quả tốt nhì thì việc hy vọng nhiều hơn thế là đòi hỏi quá mức.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000052
  locks:
  - "Giữ đại từ `ông` – `chúng ta` và lời đề nghị hạn chế tải hậu cần: `“…Nếu ông đã nói vậy. Dù sao đi nữa, chúng ta hãy giữ gánh nặng ở mức tối thiểu.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000053
  locks:
  - "Giữ đại từ `tôi` – `ông`, cụm `đơn vị dự bị` và mong muốn giữ lực lượng dự bị ở trong nước của Zettour."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000054
  locks:
  - "Giữ sự đồng thuận giữa `Zettour` và `Rudersdorf` về việc `giảm thiểu áp lực lên ngành hậu cần`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000055
  locks:
  - "Giữ đại từ `ông` – `tôi` – `Họ`, định danh `Tiểu đoàn Pháp sư Trên không số 203`, `tiểu đoàn tăng cường` và phép so sánh hiệu quả giữa tải hậu cần năm mươi người với sức công phá."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000056
  locks:
  - "Giữ cụm `Với tư cách là người phụ trách chiến dịch` (đồng bộ với p000042 ở B07), quy chiếu `ông` và nhận định về lợi thế mở rộng phạm vi sử dụng của lực lượng chiến đấu cơ động."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000057
  locks:
  - "Giữ đại từ `Tôi` – `họ` – `ông` – `cô ta`, thuật ngữ `các pháp sư trên không` và câu điều kiện–cảm thán: `Hơn nữa, nếu ông thả xích cho cô ta mà không suy tính kỹ, sẽ chẳng biết được cô ta tiến xa đến tận đâu đâu!`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000058
  locks:
  - "Giữ ẩn dụ `một quân bài quý giá như vậy ở sẵn trong tay` và câu phủ định nhấn mạnh `Zettour chẳng đời nào chịu buông nó ra dễ dàng đến thế.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000059
  locks:
  - "Giữ lời khẳng định của Rudersdorf với đại từ `Cô ta` – `Tôi`: `“Cô ta sẽ dẫn đầu mũi xung kích. Tôi cần cô ta khuấy đảo bọn chúng ở dưới đó.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000060
  locks:
  - "Giữ chính xác phạm vi nhấn mạnh `*Giao họ cho tôi đi. Không. Thôi nào, giao họ cho tôi đi mà.*` theo DEC-P01-002 và kết quả màn đôi co giữa `hai vị tướng`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000061
  locks:
  - "Giữ lời nhượng bộ của Zettour và câu hỏi chuyển ý: `“Được rồi. Tôi sẽ thu xếp việc đó. Giờ thì tôi phải đi sang cuộc họp tiếp theo để thông báo chính thức về chuyện này. Còn ông thì sao?”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000062
  locks:
  - "Giữ thành ngữ `chỉ nghe tai này rồi lọt qua tai kia` và nhịp chuyển chủ đề dứt khoát của `Rudersdorf`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000063
  locks:
  - "Giữ đại từ `tôi` – `ông` – `chúng ta`, quốc danh `Khối Thịnh vượng chung` và mệnh đề giả định `với giả định rằng chúng ta sắp sửa bước vào một cuộc giao tranh với Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000064
  locks:
  - "Giữ câu đáp của Zettour với đại từ `tôi` – `ông`: `“Hiểu rồi. Hãy cho tôi biết những gì ông nắm được nhé.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000065
  locks:
  - "Giữ câu đáp ngắn gọn: `“Không thành vấn đề.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000066
  locks:
  - "Giữ lời kết cuộc trò chuyện của hai vị tướng: `“Tuyệt lắm. Vậy thì cả hai chúng ta cùng biến nó thành hiện thực thôi.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000067
  locks:
  - "Giữ dòng tiêu đề thời gian và địa điểm viết in hoa toàn bộ: `NGÀY 29 THÁNG 8, NĂM THỐNG NHẤT 1925, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, CUỘC HỌP LIÊN TỊCH GIỮA BỘ PHẬN HẬU CẦN VÀ CỤC TÁC CHIẾN`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000068
  locks:
  - "Giữ lời thông báo lễ phép của viên sĩ quan trẻ `“Đã đến giờ hẹn rồi ạ.”` và mô tả giọng điệu hồi hộp."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000069
  locks:
  - "Giữ lời tuyên bố khai mạc cuộc họp cùng các định danh `chính quốc Cộng hòa`, `Liên minh Hiệp ước` và `Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000070
  locks:
  - "Giữ cụm `quân đội Đế quốc` và mục đích quyết định phương hướng cơ bản của cuộc họp."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000071
  locks:
  - "Giữ định danh cơ quan `Bộ Tổng tham mưu` và chức danh `tổng tham mưu trưởng`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000072
  locks:
  - "Giữ câu trần thuật ngắn: `Chương trình nghị sự rất đơn giản.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000073
  locks:
  - "Giữ quy chiếu `Họ` và mục tiêu `tháo gỡ những ý kiến bất đồng xoay quanh việc đâu nên là đường lối hành động chính trong cuộc chiến`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000074
  locks:
  - "Giữ cụm `mặt trận phía bắc` và cách xưng hô công vụ trang trọng `xin các vị hãy xem qua tài liệu đã được phát`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000075
  locks:
  - "Giữ câu nhấn mạnh in nghiêng `*Cuối cùng cũng kết thúc rồi.*` theo DEC-P01-002 và các cụm `các chiến tuyến đã bị trấn áp`, `chính quyền quân quản`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000076
  locks:
  - "Giữ mệnh đề nhượng bộ–phủ định `mặc dù họ không thể phủ nhận rằng nó đến hơi muộn` và nhận định về sự cầm cự dai dẳng của đối phương ở `khu vực phía bắc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000077
  locks:
  - "Giữ cấu trúc phủ định kép `không thể làm ngơ trước thực tế là họ đã nhận được sự trợ giúp từ các cường quốc khác` và cái giá về thời gian, công sức mà `Đế quốc` phải trả."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000078
  locks:
  - "Giữ mô tả biểu cảm của các tướng lĩnh dự họp: `gương mặt của các vị tướng tham dự cuộc họp trông chẳng lấy gì làm vui vẻ.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000079
  locks:
  - "Giữ sự tương phản giữa việc gạt bỏ những suy nghĩ ủy mị, phê chuẩn báo cáo sự đã rồi với mối quan tâm thực sự hướng về `Khối Thịnh vượng chung` và `tàn quân của Cộng hòa`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000080
  locks:
  - "Giữ các định danh `Liên minh Hiệp ước`, `quân quản`, `bộ phận Hậu cần`, `Cục Tác chiến` và hai việc còn lại là tập hợp lực lượng cùng chọn người cai quản."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000081
  locks:
  - "Giữ chức danh `thống đốc quân sự` và các cơ quan `Bộ Tư lệnh Tối cao`, `Cục Nhân sự thuộc Bộ Tổng tham mưu`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000082
  locks:
  - "Giữ nhận định khép lại mục đầu tiên: `Vấn đề này được kết thúc nhanh chóng mà không có cuộc tranh luận phức tạp nào, chỉ có đôi ba câu hỏi liên quan đến những chi tiết nhỏ.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000083
  locks:
  - "Giữ câu chuyển đoạn cuối batch: `Trọng tâm của hội nghị nằm ở mục tiếp theo.`."
