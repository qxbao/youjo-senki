- source_term: zettour_rudersdorf_and_degurechaff_pronouns_vol03_ch05_b07
  proposed_vi: "Đối thoại giữa hai Trung tướng von Zettour và von Rudersdorf: xưng `tôi`, gọi nhau là `ông` (hoặc `Bạn của tôi` / `ông` tại p000045), dùng `chúng ta` khi chỉ chung hai người hoặc phía Đế quốc (chapter005_004/p000027–p000029, p000031, p000036, p000038, p000039, p000041–p000046, p000050) / Trần thuật và độc thoại nội tâm ngôi thứ ba của Zettour và Rudersdorf: quy chiếu từng vị tướng là `ông` (chapter005_004/p000027, p000032, p000038, p000047, p000048), gọi gộp là `hai người`, `họ` hoặc `cả hai vị tướng` (chapter005_004/p000030, p000033–p000035, p000037, p000040, p000044), câu hỏi nội tâm dùng `chúng ta` (chapter005_004/p000027, p000030, p000048, p000049) / Quy chiếu Thiếu tá von Degurechaff qua hồi tưởng của Zettour: dùng `Thiếu tá von Degurechaff` và `cô`, lời hét giả định trong hình dung của Zettour dùng `Các ngài` (chapter005_004/p000047, p000048)"
  alternatives_vi:
  - Ngài (thay cho `Các ngài` trong lời hét giả định tại chapter005_004/p000048 — ưu tiên `Các ngài` vì Zettour đang suy ngẫm về sai lầm chung của ban lãnh đạo Bộ Tổng tham mưu và liên kết trực tiếp với câu hỏi `Phải chăng chúng ta đã sai?` ngay cuối đoạn)
