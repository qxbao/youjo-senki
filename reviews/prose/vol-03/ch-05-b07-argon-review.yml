locked_choices:
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000027
  locks:
  - "Giữ câu hỏi mở đoạn `“Vẫn là những vấn đề hậu cần thường lệ sao?”`, phép so sánh `cứ như thể ông đang đọc một công thức hay lý thuyết nào đó` và câu hỏi nội tâm in nghiêng `*Các tuyến tiếp tế và liên lạc của chúng ta thực sự đang căng thẳng đến thế sao?*`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000028
  locks:
  - "Giữ đại từ `tôi`, nhận định `một đợt triển khai quân vô nghĩa` và câu hỏi về thuật ngữ `Một nền hòa bình hạn chế là điều bất khả thi sao?`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000029
  locks:
  - "Giữ đại từ `Tôi` – `ông` – `Chúng ta`, thuật ngữ `hòa bình hạn chế` và cơ quan `Bộ Tư lệnh Tối cao`: `“Tôi không có ý lấy chính lời của ông để vặn lại ông đâu, nhưng tại sao một nền hòa bình hạn chế lại bất khả thi cơ chứ? Chúng ta chỉ đang làm theo ý muốn của Bộ Tư lệnh Tối cao mà thôi.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000030
  locks:
  - "Giữ quy chiếu `hai người` và câu hỏi in nghiêng theo DEC-P01-002: `*Tại sao chúng ta không thể kết thúc cuộc chiến?*`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000031
  locks:
  - "Giữ câu trả lời của Zettour với đại từ `tôi` – `chúng ta` và mệnh đề phủ định: `“Suy cho cùng, tôi cho rằng vấn đề nằm ở chỗ chúng ta vẫn chưa đánh bại hoàn toàn kẻ địch.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000032
  locks:
  - "Giữ quy chiếu `Ông` và sắc thái nặng nề khi thốt ra sự thật: `Ông phải gắng gượng lắm mới thốt ra được những lời đó.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000033
  locks:
  - "Giữ chuỗi bốn danh từ tác chiến `Bao vây, tiêu diệt, tiến quân, chiếm đóng.` và định danh `Lục quân Đế quốc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000034
  locks:
  - "Giữ định danh `hạm đội Cộng hòa` và mối quan hệ nhân quả giữa việc để sổng hạm đội địch hô hào kháng chiến đến cùng với việc hòa bình trở nên xa vời."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000035
  locks:
  - "Giữ quy chiếu `cả hai vị tướng` và ẩn dụ `đóng chiếc đinh cuối cùng vào cỗ quan tài ấy`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000036
  locks:
  - "Giữ đại từ `chúng ta` – `ông`, địa danh `lục địa phía nam` và cấu trúc điều kiện–phủ định kép `nếu ông coi việc phái quân tới lục địa phía nam là một nước đi vì hòa bình, thì đó cũng không phải một ý kiến tồi`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000037
  locks:
  - "Giữ lời khẳng định của Rudersdorf với quy chiếu `họ`: `không phạm cùng một sai lầm đến hai lần. Họ chỉ việc đánh bại bất kỳ kẻ nào ngáng đường mình.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000038
  locks:
  - "Giữ đại từ `Tôi` – `ông` – `Chúng ta` và định nghĩa học thuyết quân sự ở cuối đoạn: `“Chúng ta là một quốc gia lấy lục quân làm nòng cốt, và chúng ta vốn ưu tiên chiến lược tuyến nội địa.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000039
  locks:
  - "Giữ câu đáp của Rudersdorf với đại từ `ông`: `“Đúng như ông nói. Ông đã chỉ ra điểm đó rất nhiều lần rồi.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000040
  locks:
  - "Giữ các định danh `Lục quân Đế quốc`, `Đế quốc`, `năng lực viễn chinh`, `ngành hậu cần của lục quân` và nhận định về tình trạng quá tải cùng các trở ngại phức tạp."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000041
  locks:
  - "Giữ các cụm thuật ngữ `các bộ phận bảo đảm hậu cần của lục quân`, `tình hình làm chủ mặt biển`, `chính quốc Khối Thịnh vượng chung`, `lục địa phía nam`, `chiến dịch hải ngoại`, `các sư đoàn bộ binh nhẹ` và đại từ `Chúng ta` – `tôi` – `Ông`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000042
  locks:
  - "Giữ lời xác nhận và câu hỏi ngược lại của Rudersdorf: `“Với tư cách là người phụ trách chiến dịch, tôi không có vấn đề gì với các sư đoàn bộ binh nhẹ. Còn ông thì sao?”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000043
  locks:
  - "Giữ câu đáp ngắn của Zettour khớp nguyên văn với cụm trích dẫn ở đoạn sau: `“Không, hẳn sẽ không có vấn đề gì đâu.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000044
  locks:
  - "Giữ thuật ngữ `các sư đoàn bộ binh nhẹ` và câu trích dẫn in nghiêng theo DEC-P01-002 `*“Hẳn sẽ không có vấn đề gì đâu”*`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000045
  locks:
  - "Giữ cách gọi thân tình mà trang trọng giữa hai vị tướng: `“…Bạn của tôi, rốt cuộc điều ông muốn nói là gì?”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000046
  locks:
  - "Giữ câu hỏi bộc bạch của Zettour với đại từ `chúng ta` – `ông`: `“Ắt hẳn chúng ta đã phạm phải một sai lầm rồi, ông không nghĩ vậy sao?”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000047
  locks:
  - "Giữ chức danh `Thiếu tá von Degurechaff`, cơ quan `Văn phòng Bộ Tổng tham mưu` và cách quy chiếu `ông` (Zettour) – `cô` (Degurechaff trong hồi tưởng của Zettour)."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000048
  locks:
  - "Giữ cả hai phần nhấn mạnh `*Các ngài đang phạm sai lầm đấy!*` và `*Phải chăng chúng ta đã sai?*`, cùng cách gọi Rudersdorf là `người chiến hữu của mình`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000049
  locks:
  - "Giữ câu hỏi nội tâm in nghiêng của Rudersdorf `*Chúng ta đã phạm sai lầm ư?*` và mạch đồng cảm giữa hai vị tướng."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000050
  locks:
  - "Giữ nguyên lập luận trấn an của Rudersdorf với đại từ `Tôi` – `chúng ta` – `ông` và câu kết pha chút bông đùa của người chiến hữu: `Chỉ là do ông đọc vị chúng quá giỏi nên mới không hay mắc sai lầm đến thế thôi!`."
