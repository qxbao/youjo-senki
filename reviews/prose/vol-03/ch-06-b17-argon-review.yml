  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ toàn bộ hệ thuật ngữ đã khóa từ các chương và batch trước (`Tiểu đoàn Pháp sư Trên không số 203` / `Tiểu đoàn 203`, `Lục quân Cộng hòa Tự do`, `Lục quân Cộng hòa`, `Lục quân Đế quốc`, `Bạch Ngân`, `sĩ quan cấp tá`, `Bộ Tổng tham mưu`, `Cụm tập đoàn quân phương Tây`, `sư đoàn bộ binh nhẹ`, `Thiếu tá von Degurechaff`, `Romel`), đồng thời khóa tạm các cụm từ tác chiến trong mạch phân tích của Romel (`rút lui về phía trước`, `ưu thế cục bộ`, `trận không chiến cơ động`, `đơn vị liên kết`, `chuỗi chỉ huy`, `Chihuahua`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: romel_perspective_and_register_vol03_ch06_b17
  proposed_vi: "Toàn bộ lô nối tiếp trực tiếp điểm nhìn của Tướng von Romel tại doanh trại Lục quân Đế quốc từ cuối B16 (chapter006_002/p000529–p000561): trong trần thuật quy chiếu Romel bằng `ông` và phản thân `mình` (`p000529`–`p000531`, `p000533`–`p000536`, `p000551`, `p000552`, `p000554`, `p000557`, `p000559`, `p000561`); trong độc thoại nội tâm của Romel tự xưng `mình` hoặc `chúng ta` khi gộp chung đạo quân của ông (`p000534`, `p000542`, `p000543`, `p000547`, `p000552`); khi quy chiếu Thiếu tá Degurechaff dùng `cô` trong trần thuật (`p000529`, `p000536`, `p000538`, `p000544`, `p000561`), dùng `cô ta` trong lời cảm thán trực tiếp và độc thoại nội tâm đánh giá năng lực quái kiệt của thuộc cấp (`p000532`, `p000537`, `p000538`, `p000540`–`p000543`), và dùng `cô ấy` cùng cấp bậc viết thường `thiếu tá` khi Romel truyền mệnh lệnh qua sĩ quan tham mưu/phụ tá (`“Bảo với thiếu tá rằng cô ấy muốn làm gì tùy ý.”` tại `p000558`); quy chiếu các đơn vị quân Đế quốc bằng `họ` (`p000531`, `p000534`, `p000545`, `p000546`, `p000549`, `p000552`, `p000555`) và quy chiếu quân Cộng hòa bằng `chúng` / `bọn chúng` (`p000529`, `p000533`, `p000544`, `p000546`, `p000548`, `p000555`)"
  alternatives_vi:
  - "nó (thay cho `cô` / `cô ta` / `cô ấy` khi quy chiếu Tanya — không chọn vì theo `DEC-P01-001`, quy ước `nó` chỉ áp dụng cho trần thuật điểm nhìn của chính Tanya, còn dưới góc nhìn của Tướng Romel cần giữ `cô` / `cô ta` / `cô ấy` đồng bộ với `ch-05-b12`–`b14` và `ch-06-b16`) / cô ta (thay cho `cô ấy` tại `p000558` — ưu tiên `cô ấy` vì đây là lời giao việc chính thức của tướng chỉ huy nói với cấp dưới về một sĩ quan thiếu tá, giữ sắc thái chuẩn mực quân ngũ)"
