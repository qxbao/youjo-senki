  volume: vol-03
  chapter: 6
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`: duy trì nhất quán hệ đại từ theo điểm nhìn của Tướng Romel nối tiếp từ B16 và Chương 5, đồng thời bảo toàn chính xác dấu nhấn mạnh `*...*` tại đúng 8 đoạn có thẻ `<html:em>` trong nguồn (`p000533`, `p000534`, `p000538`, `p000541`, `p000542`, `p000543`, `p000547`, `p000552`)."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000529
  locks:
  - "Giữ đại từ `Ông` – `cô` – `chúng`, lòng cảm kích của Romel vì cô đã nhìn thấu mưu kế của địch và báo động `quân Cộng hòa` đang kéo tới trước khi `lực lượng chủ lực` chạm trán chúng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000530
  locks:
  - "Giữ quan hệ nhân quả `Nhờ vậy` giúp `ông` chuẩn bị sẵn sàng đối phó với một kẻ địch vượt trội."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000531
  locks:
  - "Giữ giả định thông thường rằng các đơn vị nằm ngoài `vòng vây` sẽ nhắm đến chuyện rút lui, và sự đối lập khi `ông` thấy `mình` thật ngốc nghếch lúc chứng kiến thực tế đang diễn ra."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000532
  locks:
  - "Giữ câu hỏi cảm thán ngắt quãng về màn `rút lui về phía trước` và lời tán thưởng `Những pha cơ động của Thiếu tá von Degurechaff thật phi thường!`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000533
  locks:
  - "Giữ định danh `Tiểu đoàn Pháp sư Trên không số 203`, bảo toàn chính xác câu hỏi nội tâm đặt trong `*...*` theo `DEC-P01-002` (`*Làm vậy thì thực sự giải quyết được bao nhiêu khi vòng vây của chúng đã gần như khép kín rồi?*`), và tâm thế cam chịu mất trắng cả đạo quân lúc ấy của `ông`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000534
  locks:
  - "Giữ nhận định về nỗ lực của `Tiểu đoàn 203` và bảo toàn chính xác câu độc thoại nội tâm thứ hai đặt trong `*...*` theo `DEC-P01-002` (`*Nếu chúng ta dốc hết sức mình, biết đâu một số đơn vị có thể thoát ra được, và nếu may mắn, có lẽ chúng ta còn gieo được mầm mống để tái tổ chức lại tuyến phòng ngự.*`)."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000535
  locks:
  - "Giữ chi tiết `Degurechaff` đã `thoát ly giao chiến` và xung kích thẳng vào trung tâm đội hình địch, cùng cấu trúc phủ định kép làm rõ mãi đến khi sự hỗn loạn ở trung tâm `Lục quân Cộng hòa Tự do` lan rộng và động tĩnh của địch trì trệ thì `ông` mới nhận ra đó không phải đợt xung phong cam chịu và liều mình hy sinh."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000536
  locks:
  - "Giữ trình tự nhận thức của `ông` về ba tầng mục tiêu của `cô`: đòn đánh vào `cánh phải` hoàn toàn là `màn nghi binh`, mục tiêu thực sự là `lực lượng chủ lực` của địch mà ông đang đối đầu, và ẩn ý lớn hơn nữa là trực tiếp tấn công `sở chỉ huy địch`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000537
  locks:
  - "Giữ lời cảm thán khẳng định `Cô ta` đã lật ngược thế cờ bằng cách `cơ động` và giành `ưu thế cục bộ`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000538
  locks:
  - "Giữ câu trần thuật mở đầu ví `Cô` như một nhà ảo thuật và bảo toàn chính xác ba câu độc thoại nội tâm tiếp theo đặt trong `*...*` theo `DEC-P01-002` với các hình ảnh đối lập `tấm khiên Bạch Ngân` – `con chó điên` được `thả xích`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000539
  locks:
  - "Giữ nhận định về nỗi đau đầu của một vị tướng kiêu hãnh khi không muốn thừa nhận một kẻ cấp thấp hơn, lại là một đứa trẻ, giỏi đánh trận hơn mình, cùng câu hỏi tu từ kết đoạn."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000540
  locks:
  - "Giữ lời cảm thán của Romel và ẩn dụ `Chẳng ai thích một con chó săn thông minh hơn cả người thợ săn…`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000541
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002` cùng cấp bậc `sĩ quan cấp tá` (`field officer`) và quan hệ `sĩ quan cấp trên` – `thuộc cấp`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000542
  locks:
  - "Giữ toàn bộ câu độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002` với đại từ `mình` – `cô ta`: `*Thậm chí có khi ngay cả mình cũng không kham nổi cô ta.*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000543
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`, nhịp tự sửa `Bộ Tổng tham mưu, không, Cụm tập đoàn quân phương Tây`, cụm `thẩm quyền hành động độc lập`, và hình ảnh `con chó săn có năng lực đáng sợ`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000544
  locks:
  - "Giữ nguyên nhân `cô` cắt đuôi `quân tiếp viện` của địch và càn quét xuyên qua `sở chỉ huy` của `chúng`, cùng kết quả `Lục quân Đế quốc` vốn bị cho là đang bị tàn quân của `Lục quân Cộng hòa` bao vây vẫn duy trì được `đơn vị chiến đấu có tổ chức` và có thể thực hiện một `mũi đột phá`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000545
  locks:
  - "Giữ câu khẳng định ngắn: `Họ hoàn toàn tự do tiến lên phía trước hoặc rút lui.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000546
  locks:
  - "Giữ lý do hai cánh của địch bị tê liệt vì sự hỗn loạn ở trung tâm, cho phép `họ` khôi phục lại kế hoạch ban đầu nhằm tiêu diệt toàn bộ `bọn chúng`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000547
  locks:
  - "Giữ chính xác câu độc thoại đầu đoạn đặt trong `*...*` theo `DEC-P01-002` (`*Chúng ta làm được.*`) và câu trần thuật tiếp theo không in nghiêng (`Romel nở một nụ cười dữ tợn.`)."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000548
  locks:
  - "Giữ mệnh lệnh dồn dập của Romel mở `trận không chiến cơ động` đánh vào `cánh trái` của địch rồi thọc thẳng xuyên qua `lực lượng trung tâm` của `chúng`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000549
  locks:
  - "Giữ quyết định tạm thời mặc kệ `cánh phải` đang rối loạn của địch."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000550
  locks:
  - "Giữ chi tiết `đơn vị liên kết` ở trung tâm đã rơi vào hỗn loạn sau đợt tấn công của `Degurechaff`, và nhận định tức thời của `Romel` rằng thứ còn trụ lại chỉ là `cánh trái`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000551
  locks:
  - "Giữ thế đối lập giữa việc bị cô lập khỏi `chuỗi chỉ huy` với thực tế `cánh trái` vẫn còn giữ được sức chiến đấu có tổ chức nhất, cùng quyết tâm của `Ông` tấn công ngay không để lỡ một giây phút nào."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000552
  locks:
  - "Giữ bảo toàn chính xác câu hỏi nội tâm đặt trong `*...*` theo `DEC-P01-002` (`*Mình nên làm gì đây?*`) cùng nhận thức của `ông` rằng thực chất mình chẳng có đủ quân để phải suy tính sâu xa đến thế."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000553
  locks:
  - "Giữ mệnh lệnh giao cho `Sư đoàn bộ binh nhẹ` bảo vệ vị trí và toàn bộ lực lượng còn lại đánh nghiền nát `cánh trái`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000554
  locks:
  - "Giữ quyết định để `sư đoàn bộ binh nhẹ` non kinh nghiệm nhất ở lại trấn giữ vị trí và dẫn phần lực lượng còn lại đụng độ với `cánh trái` nhằm đánh sập `vòng vây` và tiêu diệt quân địch."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000555
  locks:
  - "Giữ mức độ chắc chắn của hai phán đoán: chí ít đảm bảo được đường rút lui, và nhiều khả năng có thể giáng một đòn khá nặng nề nếu đánh vào lúc `chúng` đang rối loạn sẵn."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000556
  locks:
  - "Giữ lời bình về việc đưa ra phán đoán nhanh chóng đến thế chính là minh chứng cho tài năng khác thường của `Romel`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000557
  locks:
  - "Giữ nhận định việc duy trì sức kháng cự có trật tự ngay trong lúc bị bao vây là rất đáng khen ngợi, và tác phong triển khai rất nhanh của `ông` khi đã có phương hướng hành động."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000558
  locks:
  - "Giữ mệnh lệnh truyền đạt ngắn gọn với cấp bậc viết thường `thiếu tá` và đại từ `cô ấy`: `“Bảo với thiếu tá rằng cô ấy muốn làm gì tùy ý.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000559
  locks:
  - "Giữ nhận định lửng chưa ai biết sẽ dẫn tới kết quả tốt hay xấu, nhưng `ông` đã `buông dây xích`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000560
  locks:
  - "Giữ hình ảnh ẩn dụ `Chú chó Chihuahua ở đầu dây bên kia có lẽ trông dễ thương và đáng yêu đấy.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000561
  locks:
  - "Giữ sự đối lập trên chiến trường thứ `ông` cần là `con chó săn hoang dã kia`, và nhận định kết đoạn rằng `cô` có thể tàn phá quân địch dữ dội hơn nhiều nếu `cô` cùng `tiểu đoàn` của mình không bị gò bó vào những khuôn khổ thông thường."
