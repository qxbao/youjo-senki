  alternatives_vi:
  - "tiến công theo hướng rút lui (thay cho `rút lui về phía trước` tại chapter006_002/p000532 — giữ `rút lui về phía trước` để bảo toàn nghịch lý hài hước nguyên văn khiến Romel bật cười) / tác chiến cơ động trên không (thay cho `trận không chiến cơ động` tại chapter006_002/p000548 — ưu tiên `trận không chiến cơ động` gọn, giàu nhịp điệu mệnh lệnh chiến trường) / sư đoàn khinh binh (thay cho `sư đoàn bộ binh nhẹ` tại chapter006_002/p000553, p000554 — giữ `sư đoàn bộ binh nhẹ` đồng bộ trực tiếp với lựa chọn đã khóa tại Chương 5 `ch-05-b12`)"
