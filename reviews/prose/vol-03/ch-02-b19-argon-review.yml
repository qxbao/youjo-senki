  - "Giữ dấu ngoặc kép hội thoại, cách gọi “Trung úy”, cặp đối lập “chúng ta là công dân, không phải thần dân” và câu hỏi trêu đùa về việc thức trắng nhiều đêm ở “quán rượu”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000545
  locks:
  - "Giữ định danh “Drake”, cụm “đơn vị pháp sư Đế quốc” và hành động vừa tán gẫu với binh lính vừa chuẩn bị nghênh chiến và chờ trận đánh mở màn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000546
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Cộng hòa” và chi tiết người ta gọi “quán rượu” là “‘quán bar’”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000547
  locks:
  - "Giữ dấu ngoặc kép hội thoại và nhận xét “vấn đề phát âm”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000548
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ tôn xưng “Ngài” và câu hỏi ngắn “Ngài nghĩ vậy sao?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000549
  locks:
  - "Giữ định danh “Drake” và quan hệ tương phản giữa việc nói chuyện bông đùa để giữ cho đơn vị thoải mái tinh thần với việc vẫn không hề lơ là cảnh giác."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000550
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ “mục tiêu địch” và lời báo động đang bị nhắm bắn từ tít trên cao."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000551
  locks:
  - "Giữ đại từ “ông” quy chiếu Drake, cụm “người cảnh giới” và chi tiết lập tức phản ứng ngay khi lời cảnh báo vang lên."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000552
  locks:
  - "Giữ các thuật ngữ “phản xạ có điều kiện”, “cơn mưa thuật thức” và chi tiết các binh sĩ chỉ vừa kịp tản ra né tránh sát nút đến mức bàng hoàng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000553
  locks:
  - "Giữ dấu ngoặc kép hội thoại, con số “tám nghìn” và câu hỏi về đơn vị trong những bản báo cáo đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000554
  locks:
  - "Giữ các cụm “đơn vị Đế quốc”, “độ cao tám nghìn”, dấu gạch ngang, định danh “Drake” và chi tiết trước khi tận mắt đối mặt vẫn tin đó chỉ là “huyền thoại nơi chiến trường”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000555
  locks:
  - "Giữ đại từ “ông” quy chiếu Drake, mốc đối sánh “sáu nghìn” với “độ cao tám nghìn” và nhận định vượt quá sức tưởng tượng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000556
  locks:
  - "Giữ cấu trúc hai cụm thoại kẹp câu trần thuật ở giữa, định danh “Drake”, cấp đơn vị “đại đội”, và các khẩu lệnh “Đánh chặn!”, “Giữ kỷ luật hỏa lực!”, “Bắn hỏa lực áp chế!”, “Thu hẹp chênh lệch độ cao hết mức có thể!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000557
  locks:
  - "Giữ đại từ “Ông” quy chiếu Drake, thuật ngữ “hỏa lực có kỷ luật” và ba yếu tố tự tin gồm quân số, trình độ huấn luyện cùng tài thiện xạ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000558
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu gạch ngang ngắt lời “Cái—?” và dấu chấm hỏi cảm thán “?!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000559
  locks:
  - "Giữ đại từ “ông”, các thuật ngữ “tiểu đoàn”, “hỏa lực có kỷ luật” và câu hỏi tu từ làm sao cả một tiểu đoàn lại có thể bắn trượt tất cả mọi mục tiêu."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000560
  locks:
  - "Giữ định danh “Drake”, phần chêm trong cặp dấu gạch ngang có chữ nghiêng `—*Cái quái gì thế không biết*—` theo DEC-P01-002, dấu chấm lửng và chi tiết ông đã chậm mất một nhịp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000561
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Trung úy Hawkins” và lời kêu gọi yểm trợ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000562
  locks:
  - "Giữ đại từ “Ông / ông” quy chiếu Drake, cụm “sóng vô tuyến” và chi tiết điều duy nhất lấy làm mừng là chưa có ai bị bắn rớt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000563
  locks:
  - "Giữ dấu ngoặc kép hội thoại, hai dấu gạch ngang và sắc thái bàng hoàng xen lẫn tiếng chửi thề khi nhận ra câu chuyện điên rồ trong lời đồn là thật."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000564
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002 và các định danh “Liên minh Hiệp ước”, “Cộng hòa”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000565
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, các cụm “Ác quỷ sông Rhine”, “đơn vị Đế quốc”, “độ cao tám nghìn”, dấu gạch ngang và ngôi “chúng ta”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000566
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, thuật ngữ “phân tích viên tình báo”, cụm “cái lũ ăn bám đó” và dấu “?!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000567
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Chúng ta” và mệnh lệnh rút lui vì việc cầm chân địch và thu thập tin tình báo không đáng để mạo hiểm thêm."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000568
  locks:
  - "Giữ định dạng chữ in hoa toàn dòng tiêu đề cảnh, mốc thời gian “NGÀY 28 THÁNG 5, NĂM THỐNG NHẤT 1925” và các định danh “BỆNH VIỆN CỦA TỔ CHỨC CỨU TRỢ NHÂN ĐẠO PEACE WORLD THUỘC KHỐI THỊNH VƯỢNG CHUNG”, “SỞ CHỈ HUY CỤM TẬP ĐOÀN QUÂN RHINE THUỘC CỘNG HÒA”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000569
  locks:
  - "Giữ dấu ngoặc kép hội thoại, hai dấu chấm lửng đầu–cuối và câu cảm thán tỉnh giấc “Trần nhà này lạ quá…”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000570
  locks:
  - "Giữ các định danh “Đại úy Cagire Caine”, “sở chỉ huy Cụm tập đoàn quân Rhine của Cộng hòa” và hành động cố ép tâm trí còn đang mơ hồ vận hành để đánh giá tình hình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000571
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*Được rồi, anh ta tỉnh rồi đây*` theo DEC-P01-002, các định danh “John”, “Caine”, đại từ “Anh / anh ta” và hành động bấm nút gọi y tá."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000572
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “anh ta” và cụm “thuốc an thần tác dụng kéo dài”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000573
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “anh ta” và các chi tiết “bỏng nặng kinh hoàng”, “ngộ độc khí carbon monoxide”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000574
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh đúng hai câu độc thoại đầu đoạn theo DEC-P01-002, đại từ nội tâm “mình / Mình”, đại từ trần thuật “Anh / anh” và dấu chấm lửng giữa câu trần thuật."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000575
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “anh ta” quy chiếu Caine và “mình” tự quy chiếu John."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000576
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “anh ta / mình” và thuật ngữ “đặc vụ Tình báo”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000577
  locks:
  - "Giữ các định danh “John”, “Cagire”, “Tình báo” ở câu trần thuật đầu và dấu nhấn mạnh chữ nghiêng `*...*` bao quanh câu độc thoại thứ hai theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000578
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ “anh” trong thoại, định danh “John”, cụm “vị đại úy” và chi tiết cất lời bằng giọng nói mà lẽ ra vị đại úy phải nhận ra được."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000579
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu, cặp xưng hô “tôi – anh” và yêu cầu lịch sự cho biết tên và cấp bậc."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000580
  locks:
  - "Giữ định danh “John”, đại từ “anh” và nhận định không thể trách Caine vì đã làm đúng quy trình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000581
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “anh ta” và giả định trái hiện thực về việc sẽ nhớ ra nếu không rơi vào tình trạng hoàn toàn mất khả năng vận động."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000582
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cặp xưng hô “tôi – anh” và các định danh “Đại úy Cagire Caine”, “ông John”, “Khối Thịnh vượng chung”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000583
  locks:
  - "Giữ dấu ngoặc kép hội thoại và lời đáp “Ồ, ông John.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000584
  locks:
  - "Giữ cấu trúc ba câu với dấu nhấn mạnh chữ nghiêng `*...*` chỉ bao quanh câu độc thoại ở giữa theo DEC-P01-002, đại từ trần thuật “Anh ta” ở câu đầu và nội tâm tự quy chiếu “mình” ở câu thứ hai."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000585
  locks:
  - "Giữ danh xưng trong ngoặc kép “ông John” và giải thích quan hệ giữa đôi bên không phải kẻ thù mà đủ thân thiện để hợp tác và trao đổi tin tình báo."
