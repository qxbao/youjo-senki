  volume: vol-03
  chapter: 6
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`: duy trì nhất quán hệ đại từ ở cả hai điểm nhìn (sở chỉ huy Cộng hòa của Tướng de Lugo – Đại tá Vianto và đội hình bay của Tiểu đoàn 203 dưới quyền Thiếu tá von Degurechaff), đồng thời bảo toàn chính xác dấu nhấn mạnh `*...*` tại đúng 4 đoạn có thẻ `<html:em>` trong nguồn (`p000637`, `p000638`, `p000652`, `p000654`)."
