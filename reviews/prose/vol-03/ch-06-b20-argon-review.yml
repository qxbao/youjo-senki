  proposed_vi: "sở chỉ huy, sở chỉ huy dự phòng, hầm trú ẩn (chapter006_002/p000633–p000635, p000638, p000642, p000644) / công thức nổ sát thương sinh lực, công thức của pháp sư, lựu đạn và bom năm mươi ký (chapter006_002/p000633, p000638) / các pháp sư Đế quốc, các pháp sư Cộng hòa, các pháp sư phòng thủ, giới chỉ huy Cộng hòa, các sĩ quan tham mưu (chapter006_002/p000634–p000637) / mặt trận Rhine, Vianto, Tướng quân, vị tướng, de Lugo, Đức Mẹ Thánh Thần, Chúa (chapter006_002/p000637, p000639–p000642, p000644–p000647, p000653) / Lục quân Cộng hòa, Cộng hòa, Khối Thịnh vượng chung, Đế quốc, lục địa phía nam, trận chiến tiêu hao (chapter006_002/p000646, p000647, p000651, p000657, p000658) / Thiếu tá, Thiếu tá von Degurechaff, tiểu đoàn, đám ốc sên (chapter006_002/p000659–p000663) / Lục quân Đế quốc, quả cầu tính toán, Type 97, độ cao tác chiến tối đa, tốc độ leo cao, Elinium Type 97, quả cầu xung kích (chapter006_002/p000665–p000667)"
  alternatives_vi:
