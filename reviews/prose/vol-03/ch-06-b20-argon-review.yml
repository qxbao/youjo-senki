  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ toàn bộ hệ thuật ngữ đã khóa từ các chương và batch trước (`sở chỉ huy`, `hầm trú ẩn`, `các sĩ quan tham mưu`, `mặt trận Rhine`, `Lục quân Cộng hòa`, `Cộng hòa`, `Khối Thịnh vượng chung`, `Lục quân Đế quốc`, `Thiếu tá von Degurechaff`, `đám ốc sên`, `quả cầu tính toán`, `Type 97`, `Elinium Type 97`, `quả cầu xung kích`), đồng thời khóa tạm cách dịch tự nhiên, chuẩn xác cho các thuật ngữ kỹ thuật–vũ khí và công trình chỉ huy trong lô (`công thức nổ sát thương sinh lực`, `bom năm mươi ký`, `sở chỉ huy dự phòng`, `trận chiến tiêu hao`, `độ cao tác chiến tối đa`, `tốc độ leo cao`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: republican_retreat_and_203rd_flyby_register_vol03_ch06_b20
  proposed_vi: "Phần đầu tại hầm trú ẩn sở chỉ huy Cộng hòa (`p000633`–`p000658`): kế thừa nhất quán B16–B19, quy chiếu Đại tá Vianto bằng `ông` (`p000642`, `p000644`, `p000645`, `p000647`), quy chiếu Tướng de Lugo bằng `ông ta` (`p000642`, `p000654`, `p000658`), quy chiếu phía Cộng hòa và các sĩ quan tham mưu bằng `họ` (`p000633`, `p000636`, `p000638`, `p000643`, `p000644`, `p000646`, `p000647`, `p000650`, `p000654`, `p000656`–`p000658`), và quy chiếu các pháp sư Đế quốc bằng `chúng` (`p000633`, `p000657`); trong độc thoại nội tâm của Vianto và de Lugo dùng `chúng ta` (`p000638`, `p000652`, `p000654`); trong thoại trực tiếp Vianto thưa cấp trên `Ngài`, `thưa Tướng quân`, `Chúng ta rút lui chứ ạ?` (`p000639`, `p000649`), còn de Lugo xưng `Ta` – `mình` và gọi gộp toàn quân là `chúng ta` (`p000640`, `p000655`). Phần sau chuyển cảnh sang Tiểu đoàn 203 trên không (`p000659`–`p000667`): tuân thủ `DEC-P01-001`, dùng đại từ `Nó` – `mình` cho Thiếu tá Tanya von Degurechaff trong trần thuật (`p000662`); trong thoại giữa sĩ quan thuộc cấp và Tanya, thuộc cấp gọi `Thiếu tá` / `thiếu tá` kèm kính ngữ `ạ` và gọi quân Cộng hòa là `bọn chúng` / `chúng` / `lũ đần độn đó` / `đám ốc sên này` (`p000659`, `p000663`), còn Tanya xưng `Tôi` – `anh` với thuộc cấp và gọi quân Cộng hòa là `chúng` (`p000660`, `p000664`)"
  alternatives_vi:
  - "ông (thay cho `ông ta` khi quy chiếu Tướng de Lugo tại `p000642`, `p000654`, `p000658` — giữ `ông ta` cho de Lugo và `ông` cho Vianto để phân biệt rõ hai chủ thể nam ngôi thứ ba trong cùng cảnh và đồng bộ hoàn toàn với `ch-06-b15`, `ch-06-b16`) / cô (thay cho `Nó` khi quy chiếu Tanya trong câu trần thuật tại `p000662` — bắt buộc giữ `Nó` theo quyết định canon `DEC-P01-001`)"
