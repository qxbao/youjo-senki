  proposed_vi: "trưởng bộ phận hậu cần (chapter006_002/p000199) / de Lugo, Tướng de Lugo (chapter006_002/p000199, p000201, p000210, p000211, p000213, p000215, p000219, p000220, p000224, p000226) / quân cảnh, hệ thống chỉ huy, suất hạ cánh an toàn béo bở (chapter006_002/p000207, p000210) / cải tổ nhân sự, hạ sĩ quan và sĩ quan cấp thấp (chapter006_002/p000208, p000210) / cơ cấu chỉ huy, quân đội thuộc địa, hạ sĩ quan và binh sĩ cấp dưới, Trung ương (chapter006_002/p000209) / các đơn vị đào thoát (chapter006_002/p000210) / quyền kiểm soát nhân sự (chapter006_002/p000215) / văn phòng chính quyền, cố vấn, chính quyền thuộc địa, lục địa phía nam, chức nhàn bổng hậu, mất tích khi làm nhiệm vụ (chapter006_002/p000216–p000218) / sĩ quan cấp trung (chapter006_002/p000221) / chỉ huy tác chiến, chính quốc, thuộc địa, bộ tham mưu, Lục quân Cộng hòa, Lục quân Cộng hòa Tự do (chapter006_002/p000226)"
  alternatives_vi:
  - chủ nhiệm hậu cần (thay cho `trưởng bộ phận hậu cần` tại chapter006_002/p000199 — ưu tiên `trưởng bộ phận hậu cần` vì trung tính và bao quát cả khía cạnh hành chính-quân sự thuộc địa mà không tự gán chức danh biên chế đặc thù) / tham nghị viên hoặc ủy viên hội đồng (thay cho `cố vấn` tại chapter006_002/p000216, p000217 — ưu tiên `cố vấn` vì diễn đạt tự nhiên bản chất một chức vụ hữu danh vô thực ngồi bàn giấy trong văn phòng chính quyền thuộc địa) / Quân đội Cộng hòa Tự do (thay cho `Lục quân Cộng hòa Tự do` tại chapter006_002/p000226 — ưu tiên `Lục quân Cộng hòa Tự do` để đồng bộ trực tiếp với `Lục quân Cộng hòa` đứng ngay trước trong cùng câu)
