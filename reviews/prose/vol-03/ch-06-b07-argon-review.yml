- source_term: de_lugo_pov_pronouns_and_reshuffle_dialogue_register_vol03_ch06_b07
  proposed_vi: "Điểm nhìn Tướng de Lugo xuyên suốt cuộc thanh lọc nhân sự và lập bộ tham mưu tác chiến (chapter006_002/p000199–p000226): trần thuật ngôi thứ ba quy chiếu Tướng de Lugo nhất quán bằng `ông ta` và đám tướng lĩnh thuộc địa bằng `chúng` / `bọn họ` / `họ`; độc thoại nội tâm trực tiếp của de Lugo tự xưng `mình` (chapter006_002/p000202, p000211, p000223) và gọi đám quan chức/tướng lĩnh thuộc địa là `Các người` / `bọn chúng` (chapter006_002/p000199, p000204, p000223) / Thoại công khai: de Lugo xưng `tôi`, gọi các tướng lĩnh thuộc địa là `các vị` với giọng công vụ điềm đạm nhưng dứt khoát (chapter006_002/p000203, p000212, p000214, p000216, p000222), và khi bước sang phòng họp bộ tham mưu tác chiến thì gọi `Thưa các quý ông` / `các vị` và dùng `Chúng ta` (chapter006_002/p000225); phía các tướng lĩnh thuộc địa xưng `Chúng tôi` (chapter006_002/p000206) và gọi `Tướng de Lugo` là `ngài` (chapter006_002/p000213, p000219)"
  alternatives_vi:
  - ông (thay cho `ông ta` khi quy chiếu Tướng de Lugo trong trần thuật — ưu tiên `ông ta` để đồng bộ tuyệt đối với lựa chọn đã khóa tại B04, B05 và B06) / tôi (thay cho `mình` trong độc thoại nội tâm trực tiếp tại `p000211`, `p000223` — ưu tiên `mình` để phân biệt rõ suy nghĩ thầm kín với lời phát biểu công khai trước các tướng lĩnh)
  segment_ids:
