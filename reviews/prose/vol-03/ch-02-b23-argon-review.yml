- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000707
  locks:
  - "Giữ định danh “tuyến Rhine”, “quân Cộng hòa”, các đại từ “chúng ta / mình”, phủ định “chẳng có lấy một quả đạn pháo nào bắn về phía mình” và suy luận loại trừ “Trừ phi đại đa số quân địch đều là tín đồ của chủ nghĩa kháng cự thụ động, bằng không thì hẳn là họ căn bản không có mặt ở đây.”."
