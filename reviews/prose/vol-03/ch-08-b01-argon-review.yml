locked_choices:
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000002
  locks:
  - "Giữ lời chào mở đầu gửi tới những người cầm trên tay `Tập 3`, đại từ `Tôi` – `các bạn`, cách gọi hài hước `những vị anh hùng lần đầu tiên đến với bộ truyện` đã mua liền một lúc cả ba tập sách và cụm trong ngoặc kép `“phía bên này”`."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000003
  locks:
  - "Giữ chi tiết chương trình có thời hạn giới hạn, cụm lặp nhấn mạnh `một bản kịch truyền thanh—một bản kịch truyền thanh đấy!`, giả định phủ định `Trừ phi tôi đang liên tục gặp ảo giác mà không hề hay biết` và suy đoán độc giả đang thưởng thức nội dung đó."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000004
  locks:
  - "Giữ chú thích ngoặc đơn `(theo thông báo từ Tổng hành dinh)`, cụm `“công ty phía đông”`, sự can thiệp ác ý trong khái niệm mà `Clausewitz` gọi là `“ma sát”` và nhịp lặp câu kết `mọi chuyện đã diễn ra tương ứng… mọi chuyện đã diễn ra đúng tiến độ.`."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000005
  locks:
  - "Giữ câu hỏi đuôi `phải không nhỉ?` và cấu trúc đối lập `không phải là máy sưởi mà là máy điều hòa` dù đang là mùa thu."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000006
  locks:
  - "Giữ câu khẳng định `Đây không phải là nói dối đâu.` và mức nhiệt độ `tám mươi ba độ F vô lý hết sức`."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000007
  locks:
  - "Giữ chi tiết bản thảo và cuộc sống thực trùng lịch nhau như một cuộc chiến cam go, hành động hớn hở ra sân bay lên chuyến bay sang `Hoa Kỳ` và tâm trạng tự hào, vô tư phơi phới."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000008
  locks:
  - "Giữ bối cảnh thư giãn ở `miền Nam nước Mỹ`, dạ dày quá tải vì khẩu phần ăn cỡ Mỹ, bản tin tấn công khủng bố ở `Canada`, hai cụm chữ nghiêng `*Cái quái gì thế này?*` và `*Ồ?*` theo DEC-P01-002, cùng bước ngoặt mở thư điện tử với cảm giác ấm áp rồi chết sững."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000009
  locks:
  - "Giữ nội dung bức thư điện tử yêu cầu viết `lời bạt` trước `[Ngày X]!` và câu cảm thán `Ôi Chúa ơi.`."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000010
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng `*Lẽ ra mọi chuyện đâu phải thành ra thế này*` theo DEC-P01-002, địa điểm lưu trú ở `miền nam Hoa Kỳ`, dự đoán đã trở về trên đất `Nhật Bản` khi độc giả cầm sách và ký hiệu `<Có lẽ vậy.>` ở cuối đoạn."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000011
  locks:
  - "Giữ nhận định con người luôn rơi vào cùng một cái bẫy khi hoàn thành việc gì đó, bài học về sự cảnh giác khi tưởng đã đánh bại kẻ địch và câu ngạn ngữ trong ngoặc kép `“Thắng trận rồi vẫn phải thắt chặt dây mũ giáp”`."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000012
  locks:
  - "Giữ câu chuyển ý tự kiểm điểm lại những việc mình đã làm."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000013
  locks:
  - "Giữ giọng điệu tự trào nghiêm túc về cảnh bãi biển đã hứa, sự tự vấn với tư cách một quý ông trước dục vọng và đam mê trần tục, nỗi sợ bị mắng và lời hứa hài hước sẽ khắc họa mọi thứ theo hướng đạo đức hơn cho cuốn tiểu thuyết lành mạnh dành cho những công dân lương thiện."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000014
  locks:
  - "Giữ lời mong độc giả thứ lỗi vì sự thiếu đứng đắn của tập sách này."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000015
  locks:
  - "Giữ ẩn dụ trình làng `Tập 4` với `tốc độ chiến tranh chớp nhoáng (so với những nỗ lực trước đây)` và lời thề cá nhân sẽ đưa ra quyết định sớm nhất có thể."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000016
  locks:
  - "Giữ lời cảm ơn `Tsubakiya Design`, `các nhân viên hiệu đính`, đội ngũ thực hiện `bản kịch truyền thanh` và nhiều người khác."
- segment_id: YS-LN03/Text/chapter008_001.xhtml/p000017
  locks:
  - "Giữ mốc thời gian và tên tác giả ở dòng kết: `Tháng 11 năm 2014 Carlo Zen` (không thêm `*...*` vì thẻ nguồn là `<span class=\"bold-italic\">`, tuân thủ DEC-P01-002)."
