locked_choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000186
  locks:
  - "Giữ chủ thể “Tanya”, đại từ sở hữu “của mình” theo DEC-P01-001, các thuật ngữ “màn chắn bảo hộ”, “đạn 9 mm”, “thuật thức xuyên phá” và quan hệ nhân quả việc tên pháp sư địch chỉ dựng màn chắn yếu ớt vì đinh ninh có lợi thế bất ngờ nên bị Tanya bắn xuyên thủng, mất khả năng kháng cự."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000187
  locks:
  - "Giữ nguyên khẩu lệnh tác chiến ngắn gọn: “Giao chiến! Quét sạch căn phòng!”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000188
  locks:
  - "Giữ hành động ba người còn lại lập tức chĩa súng vào tên pháp sư địch vừa chúi về phía trước rồi đổ gục vì chấn động từ loạt đạn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000189
  locks:
  - "Giữ đại từ độc thoại nội tâm “mình” theo DEC-P01-001 và nhận định pháp sư dai sức hơn vẻ bề ngoài nên thật quá lạc quan nếu nghĩ có thể hạ gục họ chỉ bằng vài viên đạn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000190
  locks:
  - "Giữ phép so sánh pháp sư còn sống như quả lựu đạn cầm tay đã rút chốt an toàn, điều kiện chưa tắt thở thì chưa thể buông lỏng cảnh giác và nguy cơ tự kích nổ bản thân như phương sách cuối cùng."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000191
  locks:
  - "Giữ chủ thể “Tanya”, đại từ sở hữu “của mình” theo DEC-P01-001, mệnh đề đối lập “Đôi khi pháp sư chết quá muộn, nhưng chẳng bao giờ có chuyện họ chết quá sớm cả” và hành động các thuộc cấp nhanh chóng tước đoạt cơ hội phản kích của tên pháp sư địch."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000192
  locks:
  - "Giữ chủ thể “Tanya và binh lính của mình” cùng hành động lập tức chĩa nòng súng vào cánh cửa ngầm nơi tên pháp sư vừa chui ra để kiểm tra sau cuộc chạm trán bất ngờ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000193
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, sự đối lập giữa nỗi lo có thêm lính địch nhảy ra với không gian tĩnh lặng chỉ nghe thấy cử động khẽ khàng và tiếng lạo xạo của trang bị chứ chẳng có tiếng bước chân hay biến động nào."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000194
  locks:
  - "Giữ đại từ “Tôi” trong lời báo cáo, đại từ sở hữu “của nó” theo DEC-P01-001 và hành động người thuộc cấp đá xác tên pháp sư địch sang một bên rồi vừa tặc lưỡi vừa báo cáo."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000195
  locks:
  - "Giữ nhận xét cánh cửa được ngụy trang hết sức khéo léo và có vẻ dẫn xuống khá sâu dưới lòng đất."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000196
  locks:
  - "Giữ nguyên câu hỏi ngắn gọn của chỉ huy: “Sâu cỡ nào?”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000197
  locks:
  - "Giữ câu đáp lễ độ theo điều lệnh của thuộc cấp: “Xin mời nhìn xem ạ, thưa Thiếu tá.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000198
  locks:
  - "Giữ nguyên câu thoại ngắn: “Để tôi xem.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000199
  locks:
  - "Giữ chủ thể “Tanya”, thuật ngữ “Đèn gắn đầu nòng súng” và chi tiết hít sâu kinh ngạc khi nhìn xuống đường hầm tưởng chừng vô tận không chiếu tới đáy."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000200
  locks:
  - "Giữ các mức độ tình thái giả định (“có lẽ vẫn sẽ bình yên vô sự”, “có khả năng chịu được”, “xem ra”), thuật ngữ “đạn pháo đường sắt 280 mm” và nhận xét về tâm sức xây dựng tầng hầm."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000201
  locks:
  - "Giữ giả định trái thực tế quá khứ ở câu đầu, đại từ nội tâm “chúng ta” / “mình” theo DEC-P01-001, các cụm “dân Tình báo” / “bên Tình báo”, dấu nhấn mạnh chữ nghiêng `*Có lẽ nào bên Tình báo đã đúng, còn cảm giác của mình rằng ở đây chẳng có gì mới là sai sao?*` theo DEC-P01-002 và câu trần thuật ngôi thứ ba về “Tanya” ở cuối đoạn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000202
  locks:
  - "Giữ đại từ nội tâm “mình” theo DEC-P01-001, thuật ngữ “kho đạn”, “bên Tình báo” và lập luận phân định rằng họ không hoàn toàn bất tài nhưng mắc nhiều sai lầm đến mức không thể trông cậy vào lúc cần thiết."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000203
  locks:
  - "Giữ đại từ “chúng ta” và sự đối lập trực diện: “Nói vậy chứ, kẻ địch đã mắc sai lầm, còn chúng ta thì không.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000204
  locks:
  - "Giữ đại từ “chúng ta”, tầm quan trọng của quyền ra tay trước và triết lý cạnh tranh/đấu tranh sinh tồn rằng kẻ làm hỏng chuyện phải lãnh đủ theo quy luật tự nhiên."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000205
  locks:
  - "Giữ đại từ “chúng ta” và danh xưng cấp bậc “Thiếu úy” trong lời nhận xét của Tanya với Serebryakov."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000206
  locks:
  - "Giữ định danh “Thiếu úy Serebryakov”, đại từ ngôi ba “cô ấy” và dấu nhấn mạnh chữ nghiêng `*một kho đạn*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000207
  locks:
  - "Giữ chủ thể “Tanya”, đại từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “kho đạn”, “micrô định hướng” và chuỗi câu hỏi kiểm tra âm thanh."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000208
  locks:
  - "Giữ nguyên câu báo cáo ngắn gọn: “Có âm thanh phát ra từ nhiều nguồn. Có lẽ là tiếng người nói.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000209
  locks:
  - "Giữ hai cụm nhấn mạnh chữ nghiêng `*Trúng mánh rồi!*` và `*Cô biết điều này có nghĩa là gì chứ?*` theo DEC-P01-002, chủ thể “Tanya”, đại từ “chúng ta”, “nó”, “của mình” theo DEC-P01-001 và chức danh “sĩ quan phụ tá”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000210
  locks:
  - "Giữ suy luận rằng kẻ ẩn náu kỹ như vậy ắt hẳn đang bàn tính kế hoạch bí mật và nhận định đây là một con mồi béo bở."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000211
  locks:
  - "Giữ đại từ “Nó” theo DEC-P01-001 và định danh “Thiếu úy Serebryakov” cùng những người khác đều tự hiểu không cần nói thêm."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000212
  locks:
  - "Giữ nguyên câu hỏi: “Có nghe rõ cuộc trò chuyện không?”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000213
  locks:
  - "Giữ sắc thái báo cáo lễ độ (“ạ”), dấu ba chấm lửng và nhận xét từ tiếng vọng lại thì dưới đó có vẻ hơi giống một mê cung."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000214
  locks:
  - "Giữ đại từ “chúng ta” và thực tế âm thanh thu qua tiếng vọng lẫn quá nhiều tạp âm nên không thể làm manh mối."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000215
  locks:
  - "Giữ dấu ba chấm mở đầu, đại từ “Chúng ta” và sự phân biệt không nghe rõ từng lời nhưng vẫn nghe thấy tiếng họ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000216
  locks:
  - "Giữ thuật ngữ “tín hiệu sonar”, đại từ “chúng ta”, chủ thể “Tanya”, thành ngữ tương đương “Không vào hang cọp sao bắt được cọp con” và quyết định không xông bừa hay liều mạng quá mức vào lúc này."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000217
  locks:
  - "Giữ chủ thể “Tanya”, lo ngại phòng hờ kẻ địch lâm vào đường cùng tự sát kích nổ sẽ không có chỗ chạy và nhận định chắc chắn rằng những kẻ cố thủ dưới tầng hầm này sẽ không hành xử theo lẽ thường."
