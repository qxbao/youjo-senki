locked_choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000117
  locks:
  - "Giữ đại từ trần thuật “nó” và tự quy chiếu “mình” theo DEC-P01-001, nối tiếp trực tiếp p000116 với bước ngoặt nhận thức rằng tự thân lời lẩm bẩm không bị hiểu theo hướng xấu nhưng tùy ngữ cảnh lại có thể dẫn đến hậu quả nghiêm trọng."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000118
  locks:
  - "Giữ câu thoại ngập ngừng đứt quãng của Lergen và đại từ gọi Tanya là “cô” (“Không, cô—à, ờ, đúng hơn là đối với cô thì…”)."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000119
  locks:
  - "Giữ câu hỏi đáp ngắn gọn lễ phép “Dạ?” của Tanya trước lời bỏ lửng của cấp trên."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000120
  locks:
  - "Giữ đúng cấp bậc “Trung tá von Lergen” như nguyên tác tại đoạn này, nhận định “Đây có vẻ là tình huống tồi tệ nhất rồi” và câu kết “Dù cho một người có cố bấu víu vào sự lạc quan chặt đến mấy, ông cũng chẳng phải kẻ ngốc.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000121
  locks:
  - "Giữ thuật ngữ “Văn phòng Bộ Tổng tham mưu”, đại từ trần thuật “nó” quy chiếu Tanya theo DEC-P01-001, các mức độ đánh giá trong báo cáo giả định (nghi ngờ năng lực thực hiện chiến dịch, phơi bày sự thiếu hụt động lực ngay cả khi chưa quy kết bất tuân mệnh lệnh) và nhận định chắc chắn về Lergen."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000122
  locks:
  - "Giữ câu hỏi độc thoại nội tâm ở dạng văn bản phẳng không in nghiêng theo DEC-P01-002, cấp bậc “Đại tá von Lergen”, đại từ “ông” và đại từ tự quy chiếu “mình” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000123
  locks:
  - "Giữ tên riêng và cấp bậc “Tướng von Zettour”, “Tướng von Rudersdorf”, đại từ “ông” quy chiếu Zettour và cấu trúc tăng tiến giữa dấu gạch ngang “cảm thấy thờ ơ—chứ đừng nói đến việc thẳng thừng chỉ trích—đối với một kế hoạch”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000124
  locks:
  - "Giữ đại từ “cô” trong lời thoại của Lergen, đại từ trần thuật “ông”, chi tiết nét mặt hơi nhăn lại khi lựa lời và suy đoán của Lergen rằng hẳn phải có lý do cho sự do dự của Tanya."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000125
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng bao trọn toàn đoạn `*Một con ma cà rồng vừa bị đóng cọc xuyên tim có lẽ cũng cảm thấy thế này là cùng.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000126
  locks:
  - "Giữ giọng thoại lễ phép của Tanya với cấp trên (“À, ra là vậy… Không, tôi chỉ đang thắc mắc một chuyện thôi ạ.”)."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000127
  locks:
  - "Giữ câu hỏi lặp lại cụm từ khóa “Thắc mắc chuyện gì?” của Lergen."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000128
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng câu giữa đoạn `*Đây là chướng ngại vật bắt buộc phải vượt qua bằng mọi giá.*` theo DEC-P01-002, đại từ “mình” / “nó” theo DEC-P01-001 và chiến thuật kiểm soát thiệt hại bằng cách bày tỏ sự tiếc nuối vì không được dẫn đầu một cuộc tấn công quy mô lớn hơn."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000129
  locks:
  - "Giữ đầy đủ tên riêng “Tanya von Degurechaff”, đại từ trần thuật “nó” theo DEC-P01-001, các thuật ngữ “Lục quân”, “tổng hành dinh địch”, và câu hỏi cuối đoạn của Tanya về việc thực hiện cuộc đánh úp công phu chỉ với mục đích duy nhất là gây hỗn loạn tại tổng hành dinh địch."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000130
  locks:
  - "Giữ các thuật ngữ kỹ thuật “đường ray”, “đường băng”, “các thiết bị gia tốc bổ sung”, “các khối khí tài”, “tầng đẩy”, “bình nhiên liệu” và “chất đẩy lỏng dễ bay hơi”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000131
  locks:
  - "Giữ cấu trúc phủ định “chắc chắn Tanya không phải là người duy nhất cảm nhận được quyết tâm sắt đá trong việc thực hiện chiến dịch đến cùng” và mốc thời điểm khi đường ray được lắp xong và tên lửa bắt đầu được nạp nhiên liệu."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000132
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “tổng hành dinh địch” và lập luận rằng lượng công sức bỏ ra có vẻ không tương xứng."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000133
  locks:
  - "Giữ cấu trúc phủ định kép trong lời đáp của Lergen (“Tôi không cho rằng việc giả định một đòn tấn công nhắm vào tổng hành dinh địch đòi hỏi rất nhiều công tác chuẩn bị trước là sai lầm.”)."
