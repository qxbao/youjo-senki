  locks:
  - "Giữ đại từ “anh” quy chiếu John, định danh “Habergram” và mức độ “chẳng có mấy tác dụng xoa dịu” trước cơn thịnh nộ gần như nổ tung."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000627
  locks:
  - "Giữ dấu ngoặc kép hội thoại và quan hệ nhân quả do các đám cháy nên không còn tài liệu nào sót lại, mọi thứ đã tan thành mây khói."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000628
  locks:
  - "Giữ các cụm “tài liệu mật”, “điệp viên kỳ cựu lẽ ra có thể đã phát hiện được điều gì đó”, “người sống sót bên Cộng hòa” và chi tiết bị thiêu cháy trước cả khi kịp nhận ra chuyện gì đang xảy ra."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000629
  locks:
  - "Giữ cụm trong ngoặc kép “tử nạn trong một sự cố khi huấn luyện” và hệ quả phải đổ lỗi cho ai đó rồi tìm cách ngụy tạo sao cho đáng tin."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000630
  locks:
  - "Giữ nhận định tổn thất nhân mạng quá lớn để cho qua cùng việc thẩm vấn những người sống sót không tiến triển thuận lợi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000631
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu, cặp xưng hô “anh – tôi”, định danh “pháp sư Đế quốc” và dấu “?!”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000632
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002 và sắc thái than thở chuyện đau đầu đáng kêu trời than đất."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000633
  locks:
  - "Giữ định danh “John”, đại từ “Anh” và chi tiết ngay cả John cũng bị nghi ngờ khiến anh đành thở dài."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000634
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` chỉ bao quanh hai câu hỏi độc thoại đầu đoạn theo DEC-P01-002, cách tự ví “một lão già”, từ “sếp”, định danh “John” và hành động đáp trả bằng ánh nhìn sắc lạnh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000635
  locks:
  - "Giữ hai phần chữ nghiêng `*Có ý kiến gì với chuyện đó không?*` và `*Chà, với mối nghi ngờ nghiêm trọng rằng trong nội bộ có nội gián như thế này, tất cả mọi người đều sẽ bị săm soi thôi.*` đúng phạm vi `<html:em>` theo DEC-P01-002, cùng các định danh “Habergram”, “John”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000636
  locks:
  - "Giữ định danh “cơ quan tình báo của Khối Thịnh vượng chung” và cụm trong ngoặc kép “sự trùng hợp không may”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000637
  locks:
  - "Giữ các định danh “Liên minh Hiệp ước”, “trạm quan sát”, “pháp sư Đế quốc”, “hạm đội Liên minh Hiệp ước”, “Khối Thịnh vượng chung”, “Lý thuyết xác suất”, dấu gạch ngang và phủ định kép “không phải là bất khả thi”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000638
  locks:
  - "Giữ danh từ “tàu ngầm” và kết luận xác suất về mặt lý thuyết là “khác không”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000639
  locks:
  - "Giữ phủ định kép “không phải chưa từng nghe tới” và lập luận giả định việc ém nhẹm mọi cuộc bàn tán về số hàng hóa vì lý do bảo mật có thể là hệ quả từ một sự trùng hợp không may."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000640
  locks:
  - "Giữ sự tương phản giữa việc có thể lập luận các vụ trước chỉ là vận rủi bất chấp tỷ lệ mong manh không tưởng với câu ngắn chuyển ngoặt “Rồi chuyện lần này lại xảy ra.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000641
  locks:
  - "Giữ các định danh “tình báo của Khối Thịnh vượng chung”, “cơ quan tình báo của Cộng hòa” và mạch nhân quả dẫn tới việc hợp tác tối mật tại một cơ sở bí mật được bảo vệ hết sức nghiêm ngặt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000642
  locks:
  - "Giữ định danh “pháp sư Đế quốc”, danh từ “tổng hành dinh” và sắc thái mỉa mai khi xem việc cơ sở đó cũng tình cờ bị tấn công chỉ là một khả năng khác."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000643
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh câu đầu (gồm cả dấu gạch ngang và dấu chấm lửng) theo DEC-P01-002, các định danh “Khối Thịnh vượng chung”, “John” và câu trần thuật phẳng ở cuối."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000644
  locks:
  - "Giữ cấu trúc đối lập giữa “một kế hoạch hành động thực tế” và “những suy đoán viển vông”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000645
  locks:
  - "Giữ đại từ “anh”, hai nhánh giả định (“nếu là sự trùng hợp…” / “Còn nếu đó không phải là sự trùng hợp…”) và hình ảnh ẩn dụ “một con chuột chũi to sụ đang đào bới lẩn khuất” cần phải “rọi ánh sáng vào nó và lôi cổ nó ra”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000646
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “chúng ta” và đề xuất tiến hành một cuộc điều tra."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000647
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu, ngôi “chúng ta” và ý phản biện đã làm việc đó mấy lần rồi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000648
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` chỉ bao quanh ba câu độc thoại đầu đoạn theo DEC-P01-002, phép ẩn dụ “lũ chuột chũi nội gián” đào hang/đào xới, định danh “John” và câu thoại nhận việc “Tôi sẽ xem mình có thể tìm ra được gì.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000649
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ nội tâm “mình” và định danh “Bộ Nội vụ”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000650
  locks:
  - "Giữ đại từ “Anh / anh”, thuật ngữ “kẻ nội gián”, việc tính đến khả năng rò rỉ từ các bộ phận khác và nhận định không có nhiều thời gian."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000651
  locks:
  - "Giữ định danh “mặt trận Rhine”, danh xưng trong ngoặc kép “Ông John”, đại từ “anh” và vấn đề liệu có thời gian cho một cuộc săn lùng nội gián thong thả hay không."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000652
  locks:
  - "Giữ định danh “John”, đại từ “anh” và dấu nhấn mạnh chữ nghiêng `*Ừm, phải rồi, chuyện này có lẽ là bất khả thi.*` ở cuối câu theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000653
  locks:
  - "Giữ định dạng chữ in hoa toàn dòng tiêu đề cảnh “NGÀY 18 THÁNG 6, NĂM THỐNG NHẤT 1925, TRÊN BẦU TRỜI VÙNG NGOẠI Ô PARISII”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000654
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ nội tâm “mình” theo DEC-P01-001 và cảm giác “vô cùng sảng khoái”."
