locked_choices:
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000073
  locks:
  - "Giữ dấu ngoặc kép hội thoại, câu hỏi cảm thán và dấu ba chấm bỏ lửng của cấp dưới: `“Thưa Chỉ huy?! Chuyện đó…”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000074
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `Chúng ta`, thuật ngữ `Bộ Tổng tham mưu` và hai câu hỏi tu từ liên tiếp khẳng định lý do đơn vị được báo cáo trực tiếp và hành động độc lập."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000075
  locks:
  - "Giữ hình ảnh so sánh với `bảo hiểm`, ngôi gộp `chúng ta` và ẩn dụ `quân bài tẩy này` dành riêng cho những tình huống như hiện tại."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000076
  locks:
  - "Giữ đại từ trần thuật `nó` và tự quy chiếu `mình` theo DEC-P01-001, cùng các cụm `hệ thống chỉ huy tiêu chuẩn`, `nhóm dự án`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000077
  locks:
  - "Giữ ẩn dụ quản trị doanh nghiệp (`mệnh lệnh đặc biệt từ CEO`, `mức độ tự chủ nhất định`, `thẩm quyền hành động`) và kết luận giải quyết vấn đề với công sức tối thiểu."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000078
  locks:
  - "Giữ ngôi `chúng ta`, lập luận y học về việc phòng ngừa trước khi ngã bệnh để tiết kiệm `chi phí y tế` và nguyên tắc loại bỏ sự lãng phí có thể tránh được."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000079
  locks:
  - "Giữ hình ảnh `một mũi tiêm chủng duy nhất` và sự đối lập giữa xu hướng đánh giá quá cao `những rủi ro trước mắt` với sự ngu ngốc khi quên mất `những rủi ro dài hạn khủng khiếp`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000080
  locks:
  - "Giữ thuật ngữ `y học dự phòng`, cách nói uyển ngữ mỉa mai kế thừa từ lô trước (`tiễn Tướng de Lugo rời khỏi cõi đời này`) và nhận định chiến dịch rất đáng thực hiện dù kéo theo một chút rủi ro."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000081
  locks:
  - "Giữ ngôi `Chúng ta`, ẩn dụ `cơn dịch bệnh sẽ gặm nhấm Đế quốc này`, cấu trúc gạch ngang chêm giải thích và danh xưng đầy đủ `Thiếu tá Tanya von Degurechaff`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000082
  locks:
  - "Giữ câu khẳng định ngắn gọn, dứt khoát: `Bằng mọi giá phải tránh điều đó.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000083
  locks:
  - "Giữ tật nói lắp đầu câu `“Nh-nhưng`, cặp xưng hô `tôi – ngài` và `tiểu đoàn chúng ta` của `Trung úy Weiss`, các định danh `Quân cảng Brest`, `V-1`, `đại đội tuyển chọn`, cùng nhận định của Tanya rằng đó là chuyện vô nghĩa bắt nguồn từ sự bám chấp vào những định kiến có sẵn."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000084
  locks:
  - "Giữ cụm `căn cứ Brest`, đại từ nội tâm `mình` theo DEC-P01-001 và giả định về việc ngay cả một `tiểu đoàn tinh nhuệ` cũng có thể chịu thương vong nghiêm trọng nếu bị đơn vị mai phục sẵn đón đầu bắn trả trực diện."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000085
  locks:
  - "Giữ tên `Tanya`, mạch nhượng bộ – khẳng định và câu phủ định kép ở cuối đoạn (`Chẳng có lý do gì để không làm cả.`)."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000086
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách gọi `Trung úy`, ngôi `chúng ta / Tôi`, thuật ngữ `nhiệm vụ trinh sát chiến đấu` và sự tự tin rằng tiểu đoàn có thể xử lý được mục tiêu đáng giá này."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000087
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng `*Nếu có ai làm được việc đó thì chính là chúng ta.*` theo DEC-P01-002, định danh `những quả V-1` và kế hoạch lao vút vào giáng một đòn duy nhất rồi rút lui ngay."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000088
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, định danh `Quân cảng Brest` và hai yếu tố `công nghệ hàng không hay các pháp sư lính dù`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000089
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ `Anh` (Tanya gọi Weiss), sắc thái phỏng đoán (`có lẽ`, `có thể cho là`) và nhận định hệ thống phòng thủ của địch đã lỗi thời, đang vận hành với những biện pháp bảo vệ cũ kỹ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000090
  locks:
  - "Giữ định danh `Quân cảng Brest`, `Đế quốc`, cùng các đặc điểm địa lý – lịch sử của cảng tự nhiên trú bão, tàu lớn cập bến, lục quân khó tiếp cận và vị trí `nằm an toàn ở hậu phương`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000091
  locks:
  - "Giữ cụm trích dẫn trong ngoặc kép `“nằm an toàn ở hậu phương”`, bối cảnh `cuộc chạy đua vũ trang` và câu hỏi tu từ về việc liệu một nơi được coi là an toàn như `Brest` có được ưu tiên trang bị hay không."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000092
  locks:
  - "Giữ câu hỏi giả định về việc kẻ địch trông cậy vào hệ thống phòng thủ và hỏa lực của hạm đội, dẫn tới kỳ vọng hệ thống phòng thủ của `Quân cảng Brest` chẳng có gì đáng kể."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000093
  locks:
  - "Giữ phép so sánh với `hỏa lực phòng ngự vào cuối Thế chiến thứ hai`, hình ảnh `súng bắn đạn đậu`, ngôi `Chúng ta – mình` và định danh `Lục quân Cộng hòa`."
