- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000117
  locks:
  - "Giữ các định danh `Bộ Tổng tham mưu`, `Xưởng Vũ khí Kỹ thuật`, `những quả V-1 đã được tinh chỉnh`, ngôi gộp `Chúng ta` và lập luận rằng đơn vị duy nhất từng sử dụng chúng sẽ thực hiện cuộc thử nghiệm tiếp theo."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000118
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cấu trúc tăng tiến `không chỉ quyết đoán mà còn là vượt quá thẩm quyền của Thiếu tá…` và dấu chấm lửng cuối câu."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000119
  locks:
  - "Giữ dấu ngoặc kép hội thoại, hệ xưng hô `chúng ta – Tôi – mình – các anh`, lý lẽ về việc các sử gia thế hệ sau sẽ gọi họ là tắc trách, và mệnh lệnh dứt khoát `Chiến dịch bắt đầu—ngay bây giờ!`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000120
  locks:
  - "Giữ ngôi `Chúng ta`, đại từ `hắn` quy chiếu de Lugo, và câu hỏi giả định trái thực tế trong quá khứ về `cuộc rút quân khỏi Dunkirk` cùng khả năng người Anh và người Pháp giữ vững phòng tuyến của nước Anh."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000121
  locks:
  - "Giữ cụm nối tăng tiến `Không, không chỉ có vậy, mà nếu...` và câu hỏi giả định trái thực tế trong quá khứ về việc người Anh vét góp binh lực bảo vệ chính quốc để giáng đòn tơi tả vào đội quân Ý bất tài."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000122
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng `*thế*` theo DEC-P01-002, đại từ nội tâm `mình` theo DEC-P01-001, giả định quá khứ về việc `Đức` nghiền nát `Anh` để giao chiến với `Liên Xô` mà không lo hậu phương, và liên hệ tương tự với `Đế quốc`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000123
  locks:
  - "Giữ dấu chấm lửng mở đầu, cấu trúc `không chỉ... mà... còn...`, các định danh `hạm đội Cộng hòa`, `Thịnh vượng chung`, `Cộng hòa`, `Đế quốc` và kịch bản ác mộng khi Cộng hòa rời cuộc chơi."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000124
  locks:
  - "Giữ định danh `Đế quốc` và nhận định khả thể về việc tạo ra môi trường mang lại lợi thế chiến lược."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000125
  locks:
  - "Giữ hình ảnh `thế hòa bất tận`, các định danh `Thịnh vượng chung`, `lực lượng trên bộ của Đế quốc`, `Hải quân Đế quốc`, điệp ngữ `Vậy thì… Vậy thì!`, và ngôi `Chúng ta` trong dự tính tận dụng cơ sở sản xuất để chấn chỉnh lực lượng và đóng tàu."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000126
  locks:
  - "Giữ nhịp tự hiệu chỉnh qua dấu gạch ngang dài `—không, khi chúng ta làm được điều đó,`, định danh `Thịnh vượng chung` và khả năng chấm dứt chiến tranh."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000127
  locks:
  - "Giữ điệp cấu trúc mở đầu `Khi ấy... Khi ấy...` và ngôi `chúng ta` hướng tới một thế giới hòa bình ngay trước mắt."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000128
  locks:
  - "Giữ câu ngắn bỏ lửng `Để chấm dứt chiến tranh…`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000129
  locks:
  - "Giữ ngôi `Chúng ta` và mệnh đề quyết đoán `phải định đoạt mọi chuyện ngay lúc này.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000130
  locks:
  - "Giữ câu khẳng định ngắn gọn `Chúng ta sẽ chấm dứt chiến tranh.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000131
  locks:
  - "Giữ đại từ nội tâm `Mình` theo DEC-P01-001 và hình ảnh `nắm lấy hòa bình bằng chính đôi tay này.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000132
  locks:
  - "Giữ định danh đầy đủ `Thiếu tá Ma pháp Tanya von Degurechaff`, đại từ trần thuật `nó` theo DEC-P01-001, và chi tiết ra lệnh nghiêm ngặt buộc đám thuộc cấp còn miễn cưỡng hành động."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000133
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, các định danh `những quả V-1`, `Xưởng Vũ khí Kỹ thuật`, `đường băng`, `bệ phóng`, và chi tiết gần như cướp trắng trợn từ các kho hậu phương dưới tấm khiên là yêu cầu của Xưởng Vũ khí Kỹ thuật."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000134
  locks:
  - "Giữ định danh `Degurechaff`, sự chuyển điểm nhìn sang độc thoại nội tâm `mình – chúng ta` theo DEC-P01-001, và chi tiết kỹ thuật về thùng nhiên liệu lớn hơn cùng việc từ bỏ `loại 80` chuyên chống hạm nhưng gắn thêm được đầu đạn vào `loại 25`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000135
  locks:
  - "Giữ đại từ nội tâm `Mình – chúng ta` theo DEC-P01-001, chi tiết lao tới nhanh hơn vận tốc âm thanh, định danh `thiết giáp hạm`, `một con tàu đang thả neo` và `tỷ lệ trúng hồng tâm rất cao`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000136
  locks:
  - "Giữ câu trần thuật ngôi ba về việc triển vọng tương lai tươi sáng làm `Tanya` phấn chấn lên kha khá."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000137
  locks:
  - "Giữ định danh `Tướng de Lugo`, thuật ngữ `chủ lực hạm`, đại từ `hắn`, ngôi `chúng ta` ở câu đầu và đại từ trần thuật `nó` ở câu sau theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000138
  locks:
  - "Giữ ngôi `Chúng ta`, định danh `de Lugo`, đại từ `hắn`, lối nói uyển ngữ mỉa mai `tiễn de Lugo từ giã cõi đời này` và cụm `các đơn vị tàn quân`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000139
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu và lời báo cáo của thuộc cấp: `“…Thưa Chỉ huy, toàn bộ các đơn vị đã tập hợp.”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000140
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh `Những quả V-1`, ngôi `Tôi` và lời nhắc nhở mang sắc thái hài hước đen tối về việc không muốn có quả nào phát nổ khi đang có lính của mình ở bên trong."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000141
  locks:
  - "Giữ dấu ngoặc kép hội thoại, tiểu từ kính ngữ `ạ` của cấp dưới và lời cam đoan của các thợ máy rằng các cỗ máy đã được căn chỉnh an toàn."
