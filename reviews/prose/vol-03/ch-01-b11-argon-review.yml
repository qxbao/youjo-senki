locked_choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000055
  locks:
  - "Giữ chủ thể trần thuật “Tanya” và đại từ “Nó” / phản thân “mình” theo DEC-P01-001, cùng dấu nhấn mạnh chữ nghiêng bao trọn hai câu độc thoại nội tâm ở giữa đoạn (`*Nhiệm vụ đã. Mình phải vượt qua chuyện này trước.*`) theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000056
  locks:
  - "Giữ đại từ trần thuật “nó” / “Tanya” và tự quy chiếu “mình” theo DEC-P01-001, dấu nhấn mạnh chữ nghiêng tại thuật ngữ `*Rotten*` và câu hỏi nội tâm `*Vậy ai đã hạ cánh quanh đây nhỉ?*` theo DEC-P01-002, định danh “Thiếu úy Serebryakov”, chức danh “sĩ quan phó quan”, cụm “người đồng đội gan lì” và chi tiết sát cánh bên nhau từ thời ở Rhine."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000057
  locks:
  - "Giữ nguyên báo cáo vô tuyến: “09 gọi 01. Đã hoàn tất hạ cánh. Không có tổn thất.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000058
  locks:
  - "Giữ nguyên khẩu lệnh vô tuyến của 01: “01, nghe rõ. Báo cáo kết quả va chạm của các thiết bị gia tốc bổ sung.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000059
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng ở câu độc thoại mở đầu `*Đây là một tín hiệu tốt.*` theo DEC-P01-002, định danh “Trung úy Weiss”, đại từ “anh”, thuật ngữ “đại đội” và nhận định việc tái tổ chức diễn ra suôn sẻ nhất có thể nhờ trình độ huấn luyện bài bản."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000060
  locks:
  - "Giữ ẩn dụ “Mấy chiếc vòng gõ cửa” trúng hồng tâm gần hết và mục tiêu duy nhất đánh trượt là “kho đạn”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000061
  locks:
  - "Giữ câu nhận định chuyển ý: “Nhưng mọi chuyện cũng chỉ có thể suôn sẻ đến thế mà thôi.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000062
  locks:
  - "Giữ chủ thể “Tanya” và đại từ “nó” theo DEC-P01-001, quan hệ nhân quả việc “đầu đạn” vốn phải gây hỗn loạn cho an ninh tại “sở chỉ huy địch” sau khi kích nổ “kho đạn” đã không hoàn thành nhiệm vụ, chi tiết không quở trách những tiếng tắc lưỡi qua vô tuyến và câu suy nghĩ in nghiêng cuối đoạn (`*Mình đã bảo họ phải chạy thử nghiệm ít nhất một lần cơ mà.*`) theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000063
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001 và ý tự an ủi rằng nên lấy làm mừng vì cả đội được vận chuyển bằng một khối thuốc nổ hầu như chưa qua thử nghiệm mà vẫn đạt phần lớn mục tiêu đề ra cho đến lúc này mà không tổn thất ai."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000064
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, thoáng do dự suy tính phương án tiếp theo và chi tiết mười một thuộc cấp tiếp đất an toàn đã được xác nhận qua “kênh liên lạc bảo mật”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000065
  locks:
  - "Giữ đại từ “chúng ta”, việc thất bại khi chưa cho nổ tung nhà kho khổng lồ nghi là “kho đạn” khiến địch có lẽ chưa rối loạn lắm, và nhận định “lực lượng phòng thủ” có lẽ vẫn chưa nhận ra cuộc tấn công đang chuẩn bị diễn ra."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000066
  locks:
  - "Giữ dấu ba chấm mở đầu, đại từ “chúng ta” và kết luận vẫn có thể cứu vãn tình thế cũng như việc phá hủy “kho đạn” đó vẫn hoàn toàn khả thi."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000067
  locks:
  - "Giữ khẩu lệnh của Tanya dùng đại từ “chúng ta”, “Tôi” và “Các vị”, phân công tự mình xử lý “kho đạn” còn thuộc cấp thổi bay mọi “lực lượng phòng thủ” và bám sát lịch trình."
