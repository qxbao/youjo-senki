- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000187
  locks:
  - "Giữ tên `Tanya` và hành động chẳng còn biết làm gì ngoài việc ngửa mặt than trời."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000188
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, cấu trúc phủ định `Không phải là nó tin vào trực giác, nhưng...` và tình thế vẫn còn mất thêm một chút xíu nữa đơn vị mới có thể phóng đi."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000189
  locks:
  - "Giữ câu cảm thán về việc ngay cả một sự chậm trễ nhỏ nhoi không đáng kể trong tác chiến cũng có thể dẫn tới hậu quả chí mạng."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000190
  locks:
  - "Giữ đại từ `anh ta` và ý chỉ chênh nhau vài phút ngắn ngủi nhưng quá đủ để lời người lính kia sắp nói kịp thốt ra."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000191
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, nỗi hối hận muộn màng từ tận đáy lòng và chi tiết thoáng nghĩ tới chuyện đánh ngất người đưa tin nhưng lập tức gạt phắt đi vì có quá nhiều người đang nhìn."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000192
  locks:
  - "Giữ mệnh đề phủ định về việc hoảng loạn không giúp cải thiện tình hình, câu hỏi liên tưởng tới khoảnh khắc trước khi bước lên pháp trường và nhận định đây là tận cùng của sự xui xẻo."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000193
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, tiểu từ `ạ` và cụm `mệnh lệnh đặc biệt từ Bộ Tổng tham mưu`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000194
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, chính xác phạm vi chữ nghiêng `*bất cứ thứ gì*` theo DEC-P01-002 và ý người lính chẳng cần mở miệng cũng biết đó là tin tồi tệ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000195
  locks:
  - "Giữ đại từ `cậu` trong lời trách thầm người lính điện đài sao không biết điều hơn và làm việc chậm rãi hơn một chút."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000196
  locks:
  - "Giữ đại từ nội tâm `Mình` theo DEC-P01-001, đại từ `anh ta` và sự tự nhận thức rằng cảm xúc đang gào thét vô lý khi vừa mới thầm tán thưởng lòng tận tụy của người lính cách đó ít khoảnh khắc."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000197
  locks:
  - "Giữ toàn bộ câu ngắn in nghiêng `*Dù vậy.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000198
  locks:
  - "Giữ tên `Tanya`, đại từ `anh ta` và cơn bốc đồng không sao kìm nổi muốn bóp cổ người đưa tin."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000199
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ `Lệnh ngừng bắn`, định danh `Bộ Tổng tham mưu`, tiểu từ `ạ` và mức độ ưu tiên cao nhất gửi tới toàn bộ các đơn vị."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000200
  locks:
  - "Giữ dấu ngoặc kép hội thoại và hai câu hỏi bàng hoàng xác nhận việc ban bố `lệnh ngừng bắn`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000201
  locks:
  - "Giữ sự chuyển đổi điểm nhìn từ trần thuật ngôi ba (`nó`, `Trung úy Weiss`) sang độc thoại nội tâm ngôi một số nhiều (`chúng ta`, `mình`) theo DEC-P01-001, cùng hệ quả tất cả những người khác đều nghe thấy nên không thể phát động tấn công rồi vịn cớ chưa nghe thấy."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000202
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, cấu trúc tăng tiến `chẳng những không... mà... còn` và hệ quả bị xử bắn vì tội phá vỡ `lệnh ngừng bắn`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000203
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, tiểu từ `ạ` và lời khẩn cầu đình chỉ `cuộc xuất kích` ngay lập tức."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000204
  locks:
  - "Giữ câu khẳng định phủ định rằng không có cách nào hiểu lầm tiếng hét đó được."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000205
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm `lệnh ngừng bắn`, tiểu từ `ạ` và lời nhắc lại yêu cầu đình chỉ `cuộc xuất kích` ngay lập tức."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000206
  locks:
  - "Giữ đại từ `Anh ta` và đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000207
  locks:
  - "Giữ chính xác hai câu in nghiêng `*Rồi, tôi nghe thấy cậu rồi.*` và `*Chừng nào đây là nhiệm vụ của cậu, mình nên tôn trọng cậu vì đã hoàn thành nó.*` theo DEC-P01-002, tên `Tanya`, đại từ `Anh ta`, thuật ngữ `hạ sĩ quan` và nhận định mọi hạ sĩ quan đều nên trung thành với chức trách như thế."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000208
  locks:
  - "Giữ tên `Tanya`, đại từ trần thuật `Nó / nó` theo DEC-P01-001, cụm `kế hoạch hành động đơn phương`, định danh `Đế quốc` và lý do đây là cơ hội cuối cùng để Đế quốc tránh khỏi thất bại."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000209
  locks:
  - "Giữ chính xác hai câu đầu in nghiêng `*Ngay bây giờ. Nếu chúng ta không hành động ngay bây giờ, chúng ta sẽ chẳng còn cách nào kịp trở tay nữa.*` theo DEC-P01-002, định danh đầy đủ `Thiếu tá Tanya von Degurechaff`, `Đế quốc` và ẩn dụ lịch sử `Nếu để tái diễn một kịch bản kiểu Dunkirk`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000210
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm in nghiêng `*Vậy nên chúng ta phải làm chuyện đó ngay bây giờ. Nếu không, có lẽ chúng ta chẳng thể cứu vãn nổi Đế quốc.*` theo DEC-P01-002, ngôi `chúng ta`, mức độ chắc chắn `có lẽ` và định danh `Đế quốc`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000211
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, ngôi `họ` và nhận thức rằng nếu xuất kích thì chính Tanya sẽ phải chịu trách nhiệm vì tội vi phạm `lệnh ngừng bắn`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000212
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, giả định trái thực tế ở quá khứ (`Giá như... có lẽ đã khác`) và thực tại đã có chỉ thị rõ ràng đình chỉ `cuộc xuất kích` do `lệnh ngừng bắn` nên không còn chỗ cho những lý lẽ lập lờ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000213
  locks:
  - "Giữ tên `Tanya`, đại từ trần thuật `Nó` theo DEC-P01-001, định danh `Đế quốc` và dự cảm tất yếu về thảm họa cùng sự diệt vong sẽ giáng xuống Đế quốc nếu không đi ngay lúc này."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000214
  locks:
  - "Giữ sự đối lập rằng cứ thế mà đi lại đồng nghĩa với sự sụp đổ không thể tránh khỏi của cá nhân `nó`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000215
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, sự lưỡng nan giữa việc không thể `xuất kích` với cái chết từ từ của một sự sụp đổ đang chực chờ, và nỗi đau đớn khi thấy cơ hội xóa sổ hoàn toàn khả năng ấy ngay trước mắt mà buộc phải buông tay."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000216
  locks:
  - "Giữ câu chuyển đoạn ngắn `Và thế là.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000217
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, hành động bùng nổ trong cơn thịnh nộ khuỵu xuống đường băng bất chấp ai nghe thấy và lời thoại tuyệt vọng `“…Hừ. Chết tiệt, chết tiệt, chết tiệt! Hủy bỏ! Hủy bỏ cuộc xuất kích!”`."
