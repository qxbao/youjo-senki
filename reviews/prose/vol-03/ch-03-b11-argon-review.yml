  locks:
  - "Giữ đại từ trần thuật `Nó` theo DEC-P01-001, định danh `những quả V-1`, việc lược bỏ toàn bộ khâu kiểm tra dự báo thời tiết cùng phân tích động thái quân địch để chỉ nhận tóm tắt sơ lược qua vô tuyến, và lựa chọn tuyến tấn công ngắn nhất nhằm tiết kiệm nhiên liệu kiêm tạo vụ nổ lớn hơn khi đánh trúng tàu địch."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000177
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và sự ưu tiên tốc độ hơn là sự trau chuốt."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000178
  locks:
  - "Giữ định danh `Đế quốc` và lời khen ngợi các kỹ sư lành nghề thoăn thoắt làm việc, thể hiện năng lực hỗ trợ kỹ thuật trình độ cao."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000179
  locks:
  - "Giữ đại từ nội tâm `Mình` theo DEC-P01-001, cụm `những cỗ máy chính xác` và lòng biết ơn khi chúng được bảo dưỡng đàng hoàng."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000180
  locks:
  - "Giữ ý chỉ còn một chút thời gian nữa thôi."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000181
  locks:
  - "Giữ từ phủ định chuyển ý `Không`, ngôi `chúng ta` và nhận định chỉ vài phút nữa là có thể lên đường."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000182
  locks:
  - "Giữ toàn bộ câu hỏi nội tâm in nghiêng `*Có nên ra lệnh cho mọi người vào khoang luôn không nhỉ?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000183
  locks:
  - "Giữ tên `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001, các định danh `cơ sở thông tin liên lạc`, `Bộ Tư lệnh Cụm tập đoàn quân` và chi tiết nét mặt Tanya dần đanh lại khi thấy người lính ban nãy hộc tốc chạy tới."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000184
  locks:
