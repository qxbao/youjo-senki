- source_term: southern_continent_combat_comms_and_units_vol03_ch06_b01
  proposed_vi: "NĂM THỐNG NHẤT 1925, LỤC ĐỊA PHÍA NAM (chapter006_002/p000002) / Thiếu tá von Degurechaff (chapter006_002/p000003) / sở chỉ huy, gây nhiễu tín hiệu, 1105, đường truyền vòng (chapter006_002/p000005, p000009, p000010, p000014, p000022, p000033) / sở chỉ huy dã chiến lâm thời (chapter006_002/p000006, p000027) / mặt trận phía nam, vùng đất phương nam (chapter006_002/p000007, p000008, p000035) / mặt trận Rhine, các phòng tuyến Rhine (chapter006_002/p000008, p000016) / đường dây hữu tuyến, mạng vô tuyến, nhân viên điện đài, sóng ngắn, mật mã xác nhận (chapter006_002/p000009, p000010, p000017, p000020, p000025, p000026) / chiến tranh chiến hào, tác chiến cơ động cao (chapter006_002/p000010, p000022) / chuỗi chỉ huy (chapter006_002/p000012, p000022) / Tiểu đoàn 44, Tiểu đoàn Pháp sư 44 (chapter006_002/p000014, p000020) / Sa mạc Barbad, Kampfgruppe Bảy, đội tiên phong ở cánh trái (chapter006_002/p000022) / Thiếu úy Grantz (chapter006_002/p000024) / kinh tế học hành vi (chapter006_002/p000030) / Thiếu tá von Leinburg (chapter006_002/p000031)"
  alternatives_vi:
  - trạm chỉ huy dã chiến tạm thời / trạm chỉ huy tiền phương lâm thời (thay cho `sở chỉ huy dã chiến lâm thời` tại chapter006_002/p000006, p000027 — ưu tiên `sở chỉ huy dã chiến lâm thời` vì chuẩn thuật ngữ quân sự chỉ cơ quan chỉ huy dã chiến được thiết lập gấp tại mặt trận) / Cụm tác chiến Bảy (thay cho `Kampfgruppe Bảy` tại chapter006_002/p000022 — ưu tiên `Kampfgruppe Bảy` để kế thừa nhất quán quy ước giữ nguyên danh xưng tiếng Đức `Kampfgruppe` từ các chương trước) / đường truyền phụ (thay cho `đường truyền vòng` tại chapter006_002/p000005 — ưu tiên `đường truyền vòng` vì sát nghĩa kỹ thuật chuyển hướng tuyến liên lạc qua trạm trung gian khi đường trực tiếp bị gián đoạn)
