  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ các lựa chọn tạm đã khóa từ các tập và chương trước (`Năm Thống nhất`, `lục địa phía nam`, `mặt trận Rhine`, `Thiếu tá von Degurechaff`, `Thiếu úy Grantz`, `Kampfgruppe Bảy`, `đội tiên phong`, `tác chiến cơ động cao`, `kinh tế học hành vi`); khóa tạm các định danh và thuật ngữ thông tin liên lạc quân sự mới xuất hiện mở màn chương 6 gồm `sở chỉ huy dã chiến lâm thời` (`p000006`, `p000027`), `Tiểu đoàn 44` / `Tiểu đoàn Pháp sư 44` (`p000014`, `p000020`), `Sa mạc Barbad` (`p000022`) và `Thiếu tá von Leinburg` (`p000031`)."
