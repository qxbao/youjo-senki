- source_term: tanya_pov_and_field_command_register_vol03_ch06_b01
  proposed_vi: "Trần thuật ngôi thứ ba theo điểm nhìn Tanya: quy chiếu Tanya bằng `nó` nhất quán xuyên suốt (chapter006_002/p000008–p000010, p000016, p000018, p000032, p000033, p000035–p000037); độc thoại nội tâm trực tiếp tự quy chiếu bằng `Mình` (chapter006_002/p000028) / Lời thoại vô tuyến và chỉ huy tại sở chỉ huy dã chiến: đầu dây đơn vị bạn gọi Tanya là `Thiếu tá von Degurechaff`, xưng `Chúng tôi` – gọi `cô` (chapter006_002/p000003); chỉ huy và bộ phận thông tin tại sở chỉ huy dùng `tôi`, `chúng ta`, `chúng tôi` với câu mệnh lệnh và báo cáo công vụ khẩn trương, có từ đệm lễ phép `ạ` khi báo cáo trực tiếp lên cấp chỉ huy tại p000014 (chapter006_002/p000004, p000005, p000014, p000017, p000025, p000026, p000031)"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật về Tanya — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`)
