  proposed_vi: "Nửa đầu lô (`p000562`–`p000588`) nối tiếp trực tiếp góc nhìn của Tướng von Romel tại sở chỉ huy Lục quân Đế quốc từ B17: trong trần thuật quy chiếu Romel bằng `ông` và phản thân `mình` (`p000562`, `p000565`, `p000566`, `p000571`, `p000580`, `p000581`, `p000586`); trong độc thoại nội tâm tự xưng `mình` hoặc `chúng ta` khi gộp chung đạo quân (`p000567`, `p000572`); trong lời thoại với sĩ quan thuộc cấp xưng `ta` – `các cậu` / `các quý vị` hoặc `chúng ta` (`p000577`, `p000579`, `p000584`, `p000588`), thuộc cấp thưa `ngài` (`p000563`, `p000585`) và xưng `chúng ta` (`p000578`); quy chiếu Thiếu tá Degurechaff bằng `cô` trong trần thuật (`p000566`), `cô ta` trong độc thoại nội tâm đánh giá năng lực chiến trường (`p000567`, `p000568`), và `người đó` / `cô ấy` / `thiếu tá` trong lời thoại của Romel (`p000564`, `p000588`). Nửa cuối lô (`p000589`–`p000594`) chuyển cảnh sang sở chỉ huy quân Cộng hòa: quy chiếu Tướng de Lugo, Đại tá Vianto và các sĩ quan tham mưu bằng `họ` (`p000592`–`p000594`)"
  alternatives_vi:
  - "tôi – các anh (thay cho `ta` – `các cậu` / `các quý vị` trong lời thoại của Romel tại `p000577`, `p000584`, `p000588` — giữ `ta` – `các cậu` / `các quý vị` đồng bộ với phong thái tướng lĩnh uy quyền, sảng khoái của Romel đã khóa ở Chương 5 và các batch trước của Chương 6)"
