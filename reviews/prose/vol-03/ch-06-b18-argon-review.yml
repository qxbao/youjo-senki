- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000566
  locks:
  - "Giữ sự thừa nhận của `ông` rằng xét về điều hành một `tiểu đoàn` thì ông kém hơn, và quan trọng hơn là `mình` sẽ chẳng bao giờ sánh bằng `cô` về khoản đánh hơi thời cơ giao chiến."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000567
  locks:
  - "Giữ toàn bộ câu độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002` với đại từ `cô ta` – `mình`: `*Thời cơ mà cô ta chớp lấy bằng những pha cơ động mau lẹ chỉ diễn ra trong khoảnh khắc ngắn ngủi đến mức dù có nhìn thấy từ xa, mình cũng không tài nào nắm bắt được.*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000568
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`, hình ảnh `những con chó săn của chiến tranh` và `những sĩ quan kỵ binh thời xưa theo đúng nghĩa đen`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000569
  locks:
  - "Giữ lập luận so sánh rằng thay vì mạo hiểm làm `họ` quên mất bản năng săn mồi vì đem đi huấn luyện, cứ thả cho `họ` mặc sức tung hoành lại hợp lý hơn nhiều."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000570
  locks:
  - "Giữ mệnh lệnh khẩn trương chuẩn bị `đột kích xuyên sâu` và đánh úp `các khẩu pháo của quân Cộng hòa` trước khi `chúng` lấy lại được trật tự kỷ luật."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000571
  locks:
  - "Giữ định danh `Degurechaff` và `Tiểu đoàn Pháp sư Trên không số 203`, cùng quyết định của `Ông` ưu tiên xử lý tình hình trước mắt."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000572
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`, đại từ `chúng ta` – `mình`, cụm `pháo binh của quân Cộng hòa`, `màn pháo kích một chiều`, và lòng tự trọng không muốn bị lịch sử chế giễu là vị tướng vô năng uổng phí công sức của đồng đội."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000573
  locks:
  - "Giữ lời đáp nhận lệnh dứt khoát: `“Rõ! Tuân lệnh ngay!”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000574
  locks:
  - "Giữ toàn bộ câu độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002` và thuật ngữ `lực lượng khinh binh`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000575
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`, lời khen `những cựu binh từ mặt trận Rhine` dù thiếu hụt quân số vẫn hữu dụng hơn vì không do dự."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000576
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002` và thuật ngữ `sư đoàn bộ binh nhẹ`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000577
  locks:
  - "Giữ mệnh lệnh của Romel xưng `Ta` – `các cậu`, tập hợp toàn bộ `pháo thủ` còn lại để tránh bị đánh bọc hậu và nã pháo không giới hạn `đạn pháo` vào quân địch ở trung tâm ngay sau khi tấn công xong pháo binh địch."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000578
  locks:
  - "Giữ câu hỏi của thuộc cấp dùng `chúng ta` – `chúng` và từ kính ngữ `ạ` cuối câu."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000579
  locks:
  - "Giữ lời giải thích của Romel rằng không thể mang theo `pháo binh` khi xung phong và `sư đoàn bộ binh nhẹ` ở lại trấn giữ vị trí hiện tại cũng cần được chi viện."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000580
  locks:
  - "Giữ nhận định rằng `họ` rất dễ sụp đổ nếu `ông` bỏ mặc `họ` bị bao vây đơn độc, kéo theo ảnh hưởng tới tất cả các đơn vị đang xung phong."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000581
  locks:
  - "Giữ thuật ngữ `trận đánh cơ động` và lý do `ông` phải bắt binh lính chạy bộ để giảm thiểu thời gian đơn vị dễ tổn thương nhất phải phơi mình."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000582
  locks:
  - "Giữ lập luận về cách vận dụng `pháo binh` thực tế cho cả tấn công lẫn phòng ngự, giữ lại những khẩu pháo làm `con bài tẩy giấu trong tay áo` để bảo vệ `vị trí phòng ngự` trong lúc đánh trận cơ động."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000583
  locks:
  - "Giữ nhịp khẳng định ngắn gọn: `Đã có hy vọng. Phải, một con đường đã mở ra.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000584
  locks:
  - "Giữ lời hô hào `Các quý vị` và mệnh lệnh đưa `đơn vị thiết giáp` lên dẫn đầu trong cuộc chạy đua với thời gian."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000585
  locks:
  - "Giữ câu đáp lễ phép của thuộc cấp: `“Xin thứ lỗi, thưa ngài. Tuân lệnh ngay ạ.”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000586
  locks:
  - "Giữ hình ảnh ánh sáng nơi cuối đường hầm tiếp thêm sinh lực cho `sở chỉ huy`, sự phấn chấn của `Romel` cùng nỗ lực của `các thuộc cấp` để lật ngược thế cờ, và bảo toàn chính xác câu độc thoại cuối đoạn đặt trong `*...*` theo `DEC-P01-002` (`*Chà, cảm giác này tuyệt vời làm sao.*`)."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000587
  locks:
  - "Giữ toàn bộ câu độc thoại nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Nếu các vị thần thực sự tồn tại, hẳn là họ hành sự theo những cách thật nhiệm màu.*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000588
  locks:
  - "Giữ tiếng cười sảng khoái của Romel xưng `Ta`, cấp bậc viết thường `thiếu tá`, và bảo toàn chính xác dấu nhấn mạnh `*đúng là*` theo `DEC-P01-002`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000589
  locks:
  - "Giữ tràng cười dài mở đầu cảnh mới và câu cảm thán `Thật bất ngờ làm sao!`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000590
  locks:
  - "Giữ tràng cười hưởng ứng và lời tán đồng `Quả đúng như vậy!`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000591
  locks:
  - "Giữ dòng chỉ dẫn địa điểm: `Tại sở chỉ huy quân Cộng hòa…`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000592
  locks:
  - "Giữ bầu không khí khác thường bao trùm căn phòng và ánh nhìn căng thẳng của `Các sĩ quan tham mưu` về phía hai vị `sĩ quan cấp cao` đang cười ngoác rộng nhưng trống rỗng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000593
  locks:
  - "Giữ định danh vị `tư lệnh` của họ là `Tướng de Lugo` và người cựu binh cứng cỏi, dày dạn kinh nghiệm nhất là `Đại tá Vianto`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000594
  locks:
  - "Giữ nỗi sợ hãi tột cùng trên chiến trường khi hai trụ cột lại phát rồ lên cười thay vì ứng phó với khủng hoảng, và bảo toàn chính xác câu hỏi nội tâm của các sĩ quan tham mưu đặt trong `*...*` theo `DEC-P01-002` (`*Chẳng lẽ họ phát điên rồi sao?*`)."
