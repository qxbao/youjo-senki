  proposed_vi: "sở chỉ huy (chapter006_002/p000390, p000396) / Serebryakov (chapter006_002/p000391) / đạo quân dã chiến, nhiệm vụ phong tỏa ngăn chặn, tuyến tiếp tế (chapter006_002/p000394, p000407) / quân chủ lực (chapter006_002/p000395, p000414) / quân đoàn, các tuyến liên lạc, lực lượng chủ lực của Đế quốc, các tuyến kháng cự, mặt trận phương nam (chapter006_002/p000396) / Căn cứ Hải quân Turus, quyền làm chủ mặt biển (chapter006_002/p000397, p000404) / hồ sơ quân ngũ (chapter006_002/p000398) / Thiếu tá Tanya von Degurechaff, Quân đội Đế quốc (chapter006_002/p000399, p000403, p000415) / trận địa phòng ngự lâm thời, đội công binh dã chiến (chapter006_002/p000401) / tiểu đoàn pháp sư hàng không (chapter006_002/p000408) / các phương pháp chính quy, thâm nhập tầm xa, vùng không phận trên thực tế thuộc về quân địch, các tuyến vận chuyển nước, ốc đảo, dân du mục địa phương (chapter006_002/p000409) / Lục quân Cộng hòa, cuộc hành quân phân tán (chapter006_002/p000412)"
  alternatives_vi:
  - "tập đoàn quân dã chiến (thay cho `đạo quân dã chiến` tại chapter006_002/p000394 — ưu tiên `đạo quân dã chiến` vì trung tính và bao quát quy mô đại binh dã chiến mà không áp cứng một cấp biên chế cụ thể) / nhiệm vụ chế áp đường giao thông (thay cho `nhiệm vụ phong tỏa ngăn chặn` tại chapter006_002/p000394 — ưu tiên `nhiệm vụ phong tỏa ngăn chặn` vì phản ánh đầy đủ cả mục tiêu cản trở cơ động lẫn cắt đứt tiếp tế được giải thích ngay sau đó) / quyền kiểm soát vùng biển (thay cho `quyền làm chủ mặt biển` tại chapter006_002/p000397 — ưu tiên `quyền làm chủ mặt biển` vì là thuật ngữ hải chiến tiêu chuẩn) / tiểu đoàn pháp sư không quân hoặc tiểu đoàn pháp sư trên không (thay cho `tiểu đoàn pháp sư hàng không` tại chapter006_002/p000408 — giữ `tiểu đoàn pháp sư hàng không` đồng bộ với cách gọi chung trong quyển 3)"
