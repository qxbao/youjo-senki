- source_term: tanya_desert_dilemma_monologue_and_soliloquy_register_vol03_ch06_b13
  proposed_vi: "Trần thuật ngôi thứ ba và độc thoại nội tâm chiến thuật của Tanya (chapter006_002/p000390–p000417): quy chiếu ngôi thứ ba Tanya nhất quán bằng `nó` (`p000399`, `p000402`, `p000407`, `p000408`, `p000415`–`p000417`) và tự quy chiếu cá nhân trong nội tâm / lời cằn nhằn bằng `mình` (`p000398`, `p000402`, `p000405`, `p000409`) theo đúng `DEC-P01-001`; dùng `họ` cho đơn vị Tiểu đoàn 203 hoặc lực lượng Đế quốc trong các câu trần thuật khách quan (`p000390`, `p000391`, `p000397`, `p000403`, `p000405`, `p000409`), dùng `chúng ta` (hoặc `quân ta` tại `p000409`) khi Tanya suy tính chung cho phe Đế quốc (`p000392`, `p000394`–`p000396`, `p000400`–`p000402`, `p000411`, `p000414`, `p000415`), và dùng `chúng` cho quân Cộng hòa / Thoại lẩm bẩm tự nhủ của Tanya (`p000392`, `p000402`, `p000406`, `p000410`, `p000414`, `p000417`): giữ giọng thực dụng, sắc lạnh pha chút cằn nhằn cá nhân (`Chết tiệt, bởi thế nên mình mới ghét sa mạc` ở `p000402`) và reo đắc ý khi tìm ra sơ hở tư duy của địch (`“Tốt lắm,”` ở `p000417`)"
  alternatives_vi:
  - "cô (thay cho `nó` trong trần thuật ngôi thứ ba quy chiếu Tanya tại chapter006_002/p000399, p000402, p000407, p000408, p000415–p000417 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / tôi (thay cho `mình` trong độc thoại nội tâm và lời tự nhủ tại chapter006_002/p000398, p000402, p000405, p000409 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`)"
