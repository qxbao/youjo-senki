  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thuật ngữ đã khóa từ B01–B11 và các quyển trước (`mặt trận sông Rhine`, `cuộc hành quân phân tán`, `Fairy 01`, `Tiểu đoàn Fairy`, `Tướng von Romel`, `luật Lanchester`, `Quân đội Đế quốc`, `Lục quân Cộng hòa`); khóa tạm địa danh quân sự đầy đủ `Căn cứ Hải quân Turus` (`p000376`) và các thuật ngữ tác chiến mới trong lô gồm `các sở chỉ huy nhỏ` / `sở chỉ huy` (`p000348`, `p000379`, `p000380`, `p000388`, `p000389`), `thoát ly giao chiến` (`p000349`), `xuất kích khẩn cấp vào ban đêm` (`p000351`), `các đơn vị biệt kích` / `biệt kích` (`p000354`, `p000356`), `đội quân thuộc địa` (`p000381`) và `nguyên tắc tập trung binh lực` (`p000385`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_night_recon_monologue_and_radio_command_register_vol03_ch06_b12
  proposed_vi: "Trần thuật ngôi thứ ba và độc thoại nội tâm chiến thuật của Tanya (chapter006_002/p000348–p000388): quy chiếu ngôi thứ ba Tanya nhất quán bằng `nó` (`p000351`, `p000352`, `p000380`, `p000388`) theo đúng `DEC-P01-001`; trong các đoạn suy luận nội tâm trực tiếp về hành trình của tiểu đoàn và thế trận chung của quân Đế quốc (`p000358`, `p000359`, `p000361`, `p000375`–`p000381`, `p000385`), dùng `chúng ta` (và `chính mình` tại `p000359`) cho phe Đế quốc và `chúng` cho quân Cộng hòa / Hội thoại chỉ huy qua vô tuyến của Tiểu đoàn 203 (chapter006_002/p000354–p000366, p000380, p000383, p000387, p000389): Tanya truyền đạt mệnh lệnh bằng `chúng ta` (`p000354`, `p000356`, `p000383`), tự xưng định danh `Fairy 01` (`p000360`) hoặc `Tiểu đoàn trưởng` (`p000387`), xưng `tôi` và gọi các đại đội trưởng là `các vị` khi ra lệnh hủy nhiệm vụ và tập hợp khẩn cấp (`p000380`, `p000387`), lược chủ ngữ trực tiếp trong câu quát hỏi sĩ quan thông tin (`p000389`); thuộc cấp đáp lời `“Rõ, thưa chỉ huy.”` (`p000355`) và xưng `chúng tôi` khi các đại đội báo cáo tình hình (`p000364`, `p000365`)"
  alternatives_vi:
  - "cô (thay cho `nó` trong trần thuật ngôi thứ ba quy chiếu Tanya tại chapter006_002/p000351, p000352, p000380, p000388 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / các đồng chí hoặc các cậu (thay cho `các vị` trong lệnh vô tuyến toàn tiểu đoàn tại chapter006_002/p000387 — ưu tiên `các vị` để giữ đúng phong cách chỉ huy quân sự trang trọng của Tanya)"
