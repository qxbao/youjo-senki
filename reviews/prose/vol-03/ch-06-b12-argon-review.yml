  proposed_vi: "các sở chỉ huy nhỏ / sở chỉ huy (chapter006_002/p000348, p000379, p000380, p000388, p000389) / tiểu đoàn, thoát ly giao chiến (chapter006_002/p000349) / mặt trận sông Rhine, chiến trường phương bắc, xuất kích khẩn cấp vào ban đêm (chapter006_002/p000351) / toán tuần tra, các đơn vị biệt kích / biệt kích, những đụn cát (chapter006_002/p000354, p000356) / cuộc hành quân phân tán (chapter006_002/p000358, p000371, p000377) / Fairy 01, Tiểu đoàn Fairy (chapter006_002/p000360) / các đại đội trưởng, Đại đội Hai, Đại đội Ba, Đại đội Bốn, không chạm trán địch / không phát hiện tiếp xúc (chapter006_002/p000363–p000366) / Tướng von Romel, Căn cứ Hải quân Turus (chapter006_002/p000376) / đội hình chiến đấu (chapter006_002/p000378) / luật Lanchester (chapter006_002/p000379) / Quân đội Đế quốc (chapter006_002/p000380) / đội quân thuộc địa, thiên kiến vô thức (chapter006_002/p000381) / Lục quân Cộng hòa (chapter006_002/p000382) / nguyên tắc tập trung binh lực (chapter006_002/p000385) / chiến trường chính (chapter006_002/p000386) / Tiểu đoàn trưởng, các đại đội, nhiệm vụ trinh sát (chapter006_002/p000387, p000388)"
  alternatives_vi:
  - "tổng hành dinh hoặc bộ chỉ huy (thay cho `sở chỉ huy` tại chapter006_002/p000379, p000380, p000388, p000389 — ưu tiên `sở chỉ huy` để đồng nhất gốc từ với `các sở chỉ huy nhỏ` ở p000348 và phản ánh đúng cấp chỉ huy tiền phương trên chiến trường sa mạc) / quân đặc nhiệm (thay cho `các đơn vị biệt kích` / `biệt kích` tại chapter006_002/p000354, p000356 — ưu tiên `biệt kích` vì chuẩn thuật ngữ quân sự chỉ các toán tập kích luồn sâu) / định luật Lanchester (thay cho `luật Lanchester` tại chapter006_002/p000379 — ưu tiên `luật Lanchester` để kế thừa nhất quán cách gọi đã dùng ở các quyển trước) / quy tắc tập trung lực lượng (thay cho `nguyên tắc tập trung binh lực` tại chapter006_002/p000385 — ưu tiên `nguyên tắc tập trung binh lực` vì chuẩn thuật ngữ lý luận quân sự)"
