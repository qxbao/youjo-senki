- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000006
  locks:
  - "Giữ cụm `chỉ huy căn cứ`, `một người lính Đế quốc`, đại từ `ông` và cấu trúc giả định: nếu có thể bị một chỉ huy đóng quân dưới quyền mình ép buộc thì đã chẳng xứng đáng đứng ở vị trí chỉ huy."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000007
  locks:
  - "Giữ dấu ngoặc kép hội thoại, địa danh `Brest`, ngôi `Chúng ta / Tôi – Thiếu tá / cô`, thuật ngữ `lệnh ngừng bắn` và lập luận rằng Brest thất thủ chỉ là vấn đề thời gian nên không cần tiêu hao binh lực vô ích hay làm hỏng lệnh ngừng bắn."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000008
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ `Lệnh ngừng bắn`, ngôi `Chúng ta` và lời phản bác rằng lệnh ngừng bắn chưa được tuyên bố nên vẫn có thể cứu quân đội nếu hành động ngay."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000009
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh `Thiếu tá von Degurechaff`, ngôi `chúng ta` và nhận định hạm đội đó đã bị đánh bại, không còn là mối đe dọa đối với quân đội Đế quốc."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000010
  locks:
  - "Giữ các cụm `đám quân cảnh`, `các sĩ quan tham mưu`, đại từ `nó` theo DEC-P01-001 và sự đối lập giữa việc không nghĩ có thể thuyết phục bằng sức mạnh cơ bắp với suy tính rằng nếu nó là một người lính thì có thể thuyết phục bằng lời lẽ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000011
  locks:
  - "Giữ câu trần thuật ngắn nối mạch: `Thế là họ đã thử làm vậy.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000012
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách gọi `mọi người` và `Thưa Đại tá!`, cùng lời thúc giục khẩn thiết rằng vấn đề nằm ở thời gian và không còn thời gian nữa."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000013
  locks:
  - "Giữ định danh `Thiếu tá von Degurechaff`, đại từ `nó` theo DEC-P01-001, quan hệ nhượng bộ giữa tiếng đồn là người biết điều không cần nói nhiều lời với sự ngoan cố giữ lập trường hôm nay, cùng cấu trúc tăng tiến `Không chỉ vậy` khi sốt ruột đòi dốc toàn lực tấn công."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000014
  locks:
  - "Giữ chính xác dấu chữ nghiêng `*...*` và dấu ba chấm bỏ lửng theo DEC-P01-002: `*Cứ gần như thể là…*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000015
  locks:
  - "Giữ đại từ `nó` theo DEC-P01-001 và nhận định khẳng định nó đang van nài cứ như thể đang khiếp sợ một thứ gì đó."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000016
  locks:
  - "Giữ chính xác dấu chữ nghiêng `*...*` cho toàn bộ câu cảm thán và hai câu hỏi ngắn theo DEC-P01-002 cùng biệt danh `Ngân Gỉ`: `*Thật lố bịch. Ngân Gỉ ư? Sợ hãi ư?*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000017
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng `*Không thể nào có chuyện đó được*` trước vế trần thuật `, vài người đứng xem thầm nghĩ.` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000018
  locks:
  - "Giữ câu trần thuật ngắn: `Chỉ là họ vẫn chưa hiểu ra mà thôi.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000019
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ `Chúng` và hình ảnh so sánh âm thầm đào tẩu, vứt bỏ tổ quốc của mình như lũ chuột."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000020
  locks:
  - "Giữ chính xác dấu chữ nghiêng `*...*` và dấu ba chấm đầu câu theo DEC-P01-002: `*…Thế thì sao chứ?*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000021
  locks:
  - "Giữ các thuật ngữ `các sĩ quan tham mưu`, `tuyến tiếp vận` và chuỗi lập luận hậu cần: quân đội tiêu thụ nhiều lương thực ngay cả trong thời bình, mỗi binh sĩ là một cái bụng đói nên đội quân bị cắt đứt khỏi tuyến tiếp vận sẽ chịu số phận bi thảm."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000022
  locks:
  - "Giữ nhận định bổ sung rằng sự sụp đổ của một đội quân không có căn cứ chỉ còn là vấn đề thời gian."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000023
  locks:
  - "Giữ các thuật ngữ `Quân cảng Brest`, `tái thiết phòng tuyến`, `chiến dịch phản đổ bộ`, `tuyến tiếp vận` và bảo toàn chính xác phạm vi chữ nghiêng ở câu cuối đoạn theo DEC-P01-002: `*À ha, sẽ rắc rối lắm nếu chúng làm giống hệt chúng ta và đe dọa tuyến tiếp vận của ta bằng cách đổ bộ vào hậu phương.*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000024
  locks:
  - "Giữ dấu ngoặc kép hội thoại và hai câu hỏi phản vấn liên tiếp của phía tham mưu về việc quân địch sẽ chỉ tự hủy diệt."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000025
  locks:
  - "Giữ chính xác dấu chữ nghiêng `*...*` cho toàn bộ đoạn theo DEC-P01-002 và đại từ `Cô ta` trong độc thoại nội tâm: `*Cô ta đang sợ cái gì chứ? Tàn sát một đội quân bị cô lập đâu có khó khăn đến thế!*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000026
  locks:
  - "Giữ cấu trúc phủ định bộ phận chuyển ý: `Nhưng cũng không phải là ai nấy đều hoàn toàn yên tâm.`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000027
  locks:
  - "Giữ sự đối lập giữa hình ảnh cô bé gần như đang mất hết lý trí ngay trước mắt họ với việc được tất cả công nhận là sở hữu một bộ óc xuất chúng."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000028
  locks:
  - "Giữ đại từ `nó` theo DEC-P01-001 và ba danh xưng đánh giá năng lực: thiên tài bước ra từ `Trường Đại học Chiến tranh`, cục cưng của `Bộ Tổng tham mưu`, hoặc một chiến lược gia chưa được đánh giá đúng tầm."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000029
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu gạch ngang dài `—` ở chỗ tự sửa chủ ngữ từ số nhiều sang số ít `Chúng đang— Không, hắn đang tìm cách tạo điều kiện cho một phần binh lực của mình đào thoát!` và lời khẳng định `Chúng ta không thể để chuyện đó xảy ra được!`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000030
  locks:
  - "Giữ đại từ `nó` theo DEC-P01-001, chi tiết tiếng gào thét chói tai vang vọng khắp đường băng của căn cứ dù sắp hụt hơi, và sự tương phản khi ai nhìn thấy cũng biết nó đang kêu gọi điều gì đó nhưng không hiểu nổi đó là gì."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000031
  locks:
  - "Giữ chính xác dấu chữ nghiêng `*...*` theo DEC-P01-002 và đại từ `cô ta` trong hai câu hỏi nội tâm: `*Tại sao cô ta lại khăng khăng đến thế? Làm sao cô ta lại đi đến kết luận đó được?*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000032
  locks:
  - "Giữ dấu ngoặc kép hội thoại và nhận định bác bỏ giả thuyết của Tanya là không có cơ sở, cho rằng hợp lý nhất là xem các đơn vị đó như `lực lượng phòng thủ thay thế` hoặc `quân phản kích`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000033
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh `Đế quốc`, ngôi `chúng ta – chúng` và lời cảnh báo nếu để chúng thoát mất thì chiến thắng của Đế quốc sẽ bị lâm nguy và rốt cuộc Đế quốc sẽ sụp đổ."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000034
  locks:
  - "Giữ hai câu ngắn tạo bước ngoặt bi kịch: một vài người đã cố gắng suy nghĩ, nhưng dù có tàn nhẫn đến đâu, tất cả đã quá muộn."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000035
  locks:
  - "Giữ chính xác dấu chữ nghiêng `*...*` theo DEC-P01-002 cho hai câu lặp lại lời cảnh báo: `*Chiến thắng của Đế quốc sẽ bị lâm nguy. Rốt cuộc Đế quốc sẽ sụp đổ.*`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000036
  locks:
  - "Giữ sự đối lập giữa những tiếng gào thét ấy và phản ứng đáp lại khác xa so với những gì kẻ gào thét mong đợi."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000037
  locks:
  - "Giữ dấu ngoặc kép hội thoại, mệnh lệnh `ghì cô ta xuống!` gửi quân cảnh và lời gắt `Thiếu tá, thế là đủ rồi đấy!`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000038
  locks:
  - "Giữ đại từ `nó` theo DEC-P01-001, định danh `Degurechaff`, cụm `Đám quân cảnh và đơn vị của nó`, và chi tiết năm người đàn ông hợp sức đối phó với một cô bé nhỏ tuổi vẫn phải dốc toàn lực mới kéo được nó ra khỏi người vị chỉ huy."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000039
  locks:
  - "Giữ dấu ngoặc kép hội thoại và tiếng van nài tuyệt vọng: `“Thưa Đại tá, làm ơn! Làm ơn đi!”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000040
  locks:
  - "Giữ câu kết lắng đọng khép lại cảnh: `Đó là một tiếng gào thét còn văng vẳng mãi bên tai.`."
