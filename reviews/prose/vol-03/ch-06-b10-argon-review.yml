- source_term: john_nomad_dealings_and_tanya_romel_camp_register_vol03_ch06_b10
  proposed_vi: "Nửa đầu theo điểm nhìn điệp viên John trên sa mạc (chapter006_002/p000289–p000303): trần thuật ngôi thứ ba quy chiếu John nhất quán bằng `anh` (và `mình` trong cấu trúc phản thân tại `p000290`, `p000294`, `p000302`); trong thoại giao dịch với tù trưởng bộ tộc, John xưng `Tôi` – `chúng ta` (`p000291`); vị tù trưởng bộ tộc được quy chiếu ngôi thứ ba là `Ông ta` (`p000297`), trong thoại gọi John là `ngài` / phía John là `các ngài` và xưng `chúng tôi` (`p000296`, `p000299`) / Nửa sau tại doanh trại Lục quân Đế quốc theo điểm nhìn Tanya và các sĩ quan tham mưu (chapter006_002/p000304–p000322): trần thuật ngôi thứ ba quy chiếu Tanya nhất quán bằng `nó` và tự quy chiếu bằng `mình` theo `DEC-P01-001` (`p000307`, `p000312`, `p000313`, `p000315`, `p000316`, `p000318`); trong thoại quân sự, Tanya gọi `Thưa Tướng von Romel`, xưng `tôi` và dùng `chúng ta` khi nói về nhận thức chung của quân Đế quốc (`p000305`, `p000317`, `p000322`); Tướng von Romel hỏi ngắn gọn `“Chuyện gì vậy?”` (`p000314`), gọi Tanya là `cô` và dùng `chúng ta` cho kế hoạch tác chiến chung (`p000321`)"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật ngôi thứ ba quy chiếu Tanya tại chapter006_002/p000307, p000312, p000313, p000316, p000318 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / ông (thay cho `anh` khi quy chiếu điệp viên John tại chapter006_002/p000289, p000290, p000292, p000294, p000295, p000301–p000303 — ưu tiên `anh` để nối tiếp liền mạch với B09 và Chương 2)
