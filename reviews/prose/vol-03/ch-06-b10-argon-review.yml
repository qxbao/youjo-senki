  proposed_vi: "điệp viên, đám quý ông rởm (chapter006_002/p000289, p000292) / John, các mạng lưới quan sát và thông tin liên lạc, các bộ tộc du mục, hoạt động du kích, tù binh Đế quốc, Khối Thịnh vượng chung (chapter006_002/p000292–p000295, p000298, p000300, p000301, p000303) / Đế quốc (chapter006_002/p000293, p000295) / lạc đà một bướu, những người du mục, súng trường (chapter006_002/p000294) / tay săn cáo, kỵ binh cưỡi lạc đà, súng tiểu liên, súng trường tấn công (chapter006_002/p000295) / tù trưởng bộ tộc, đạn thật, vũ khí hạng nặng, thuốc nổ (chapter006_002/p000297) / đoàn lữ hành (chapter006_002/p000301) / các hoạt động bí mật, cuộc chiến chống Cộng hòa, các thuộc địa của Cộng hòa (chapter006_002/p000302) / Lục quân Cộng hòa Tự do (chapter006_002/p000303) / Năm Thống nhất 1925, doanh trại Lục quân Đế quốc, Lục quân Đế quốc (chapter006_002/p000304, p000306, p000310) / Tướng von Romel (chapter006_002/p000305) / Bộ Tổng tham mưu Lục quân Đế quốc, không đoàn, báo cáo trinh sát, các sĩ quan tham mưu (chapter006_002/p000306, p000312) / Thiếu tá von Degurechaff, Degurechaff, sĩ quan cấp tá (chapter006_002/p000307, p000309, p000311) / lực lượng chủ lực (chapter006_002/p000317) / các pháp sư, binh chủng, trinh sát chiến đấu, các trận đánh truy kích (chapter006_002/p000319) / kế hoạch tập kích bất ngờ (chapter006_002/p000321)"
  alternatives_vi:
  - kỵ binh lạc đà (thay cho `kỵ binh cưỡi lạc đà` tại chapter006_002/p000295 — ưu tiên `kỵ binh cưỡi lạc đà` vì diễn đạt rõ hình ảnh các tay súng tập kích trên lưng lạc đà trong xung đột du mục) / hạm đội không quân hoặc đội bay (thay cho `không đoàn` tại chapter006_002/p000306 — ưu tiên `không đoàn` vì chuẩn thuật ngữ biên chế không quân quy mô lớn trong quân đội Đế quốc) / sĩ quan thực địa (thay cho `sĩ quan cấp tá` tại chapter006_002/p000307, p000311 — ưu tiên `sĩ quan cấp tá` vì phản ánh chuẩn xác bậc quân hàm cấp tá của Thiếu tá von Degurechaff khi trực tiếp trình diện đưa đề xuất với tướng tư lệnh) / trinh sát hỏa lực (thay cho `trinh sát chiến đấu` tại chapter006_002/p000319 — ưu tiên `trinh sát chiến đấu` để kế thừa nhất quán thuật ngữ đã khóa ở các chương trước)
