  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thuật ngữ đã khóa từ B01–B09 và các chương trước (`John`, `Khối Thịnh vượng chung`, `các bộ tộc du mục` / `những người du mục`, `đoàn lữ hành`, `Lục quân Cộng hòa Tự do`, `Năm Thống nhất 1925`, `Lục quân Đế quốc`, `Bộ Tổng tham mưu Lục quân Đế quốc`, `Tướng von Romel`, `Thiếu tá von Degurechaff`, `trinh sát chiến đấu`); khóa tạm các thuật ngữ quân sự – vũ khí mới trong lô gồm `kỵ binh cưỡi lạc đà`, `súng tiểu liên`, `súng trường tấn công` (`p000295`), `không đoàn` (`p000306`), `sĩ quan cấp tá` (`p000307`, `p000311`) và `các trận đánh truy kích` (`p000319`)."
