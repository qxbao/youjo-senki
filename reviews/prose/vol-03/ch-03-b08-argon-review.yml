locked_choices:
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000094
  locks:
  - "Giữ thuật ngữ trong ngoặc kép `học thuyết “hạm đội hiện hữu”`, các định danh `Đế quốc`, `Cộng hòa`, `mặt trận Rhine`, `cuộc chiến tiêu hao`, ngôi gộp `chúng ta` và nhận định ở cấp độ hạm đội chúng không có nhiều kinh nghiệm đối phó với lực lượng không quân hay pháp sư."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000095
  locks:
  - "Giữ cấu trúc nhượng bộ về `lễ rửa tội bằng máu lửa nơi địa ngục chiến tuyến Rhine`, sự đối lập giữa `quân dự bị` / `các đơn vị thiếu kinh nghiệm` với `những đội quân tinh nhuệ`, và kết luận về khoảng cách chênh lệch của kinh nghiệm tác chiến tiền tuyến."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000096
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `tôi` và cụm `một tàu ngầm quân ta ở gần căn cứ`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000097
  locks:
  - "Giữ đại từ nội tâm `Mình` và `chúng ta` theo DEC-P01-001, cùng giới hạn kỳ vọng ở tàu ngầm là `phát cảnh báo chứ không phải ngăn chặn hoàn toàn cuộc đào thoát`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000098
  locks:
  - "Giữ ngôi `chúng ta – mình`, ý quá giang tàu ngầm để tấn công nhiều hơn một lần rồi tẩu thoát dưới mặt nước, và điều kiện `miễn là bộ chỉ huy tàu ngầm không can thiệp` để tấn công đồng thời bằng ngư lôi."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000099
  locks:
  - "Giữ dấu ngoặc kép hội thoại, hệ xưng hô `tôi – chúng ta – các anh`, định danh `Quân cảng Brest`, `V-1` và kế hoạch tấn công trực tiếp bằng V-1 rồi lên tàu ngầm tấn công thêm lần nữa."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000100
  locks:
  - "Giữ sự chuyển đổi điểm nhìn tự nhiên giữa `chúng ta` và câu trần thuật ngôi ba quy chiếu `Tanya` bằng `nó` theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000101
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, định danh `những quả V-1`, `Kỹ sư trưởng Schugel` và đánh giá sức công phá của đầu đạn đủ sức phá hủy một con tàu."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000102
  locks:
  - "Giữ ngôi `chúng ta`, ưu thế không gặp rắc rối với sự đánh chặn của địch hay đồng minh ngăn cản, phép so sánh với `tên lửa chống hạm` khi khoang đầy nhiên liệu đánh trúng trực diện, và kết luận ngay cả `thiết giáp hạm` cũng không thể nguyên vẹn."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000103
  locks:
  - "Giữ thuật ngữ `tiểu đoàn tăng cường`, số lượng `bốn mươi tám quả tên lửa` và sự thận trọng chuẩn bị tinh thần cho tỷ lệ trúng đích trực diện thấp do ít kinh nghiệm vận hành."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000104
  locks:
  - "Giữ định danh `những quả V-1`, ước tính một nửa trúng đích trực diện (`Hai mươi bốn quả`) và lý do mục tiêu là một con tàu đang thả neo."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000105
  locks:
  - "Giữ số lượng `hai mươi bốn quả tên lửa`, ngôi `mình – chúng ta`, định danh `Thiếu tướng de Lugo`, quy chiếu `hắn`, cùng lối nói mỉa mai về việc giúp hắn thăng lên `Đại tướng` và tặng một chiếc `thiết giáp hạm làm bia mộ`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000106
  locks:
  - "Giữ cụm trích dẫn `“không chút nghi ngờ”` nối mạch với p000105, dấu nhấn mạnh `*nhất định*` theo DEC-P01-002, sự đối lập giữa `nguyên soái` với `một đợt thăng hàm vượt hai cấp` (truy phong sau khi tử trận) và hình ảnh tấm bia mộ khổng lồ mang hình dáng thiết giáp hạm."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000107
  locks:
  - "Giữ dấu ngoặc kép hội thoại và cách xưng hô của cấp dưới: `“Thưa Thiếu tá, tôi có một câu hỏi.”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000108
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001, nét tâm lý vừa thận trọng vừa chẳng mảy may cắn rứt lương tâm, và câu thoại ngắn gọn cho phép cấp dưới đặt câu hỏi."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000109
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Thưa Chỉ huy`, ngôi `chúng ta` và định danh `những quả V-1`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000110
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng của câu nội tâm mở đầu `*Mình không ngờ lại là một câu hỏi mang tính kỹ thuật.*` theo DEC-P01-002, đại từ trần thuật `Nó` theo DEC-P01-001, và định danh `Xưởng Vũ khí Kỹ thuật` trong lời đáp."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000111
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi xác nhận của thuộc cấp: `“Vậy là chúng ta có giấy phép rồi ạ?”`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000112
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001 và ý chuẩn bị sẵn lập luận tối thiểu cần thiết để tránh phải `ra tòa án binh`."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000113
  locks:
  - "Giữ mạch nhượng bộ – phản biện trong độc thoại nội tâm về việc đảm bảo `chúng ta` có đủ thời gian tấn công quan trọng hơn là xác lập lý do chính đáng."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000114
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001 và sự đối lập giữa cảm giác ruột gan quặn thắt khi làm việc vượt quá thẩm quyền hưởng lương với mục tiêu tối thượng là giữ mạng."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000115
  locks:
  - "Giữ dấu ngoặc kép hội thoại, đại từ `Anh` – `Chúng ta`, định danh `Kỹ sư trưởng Schugel`, thuật ngữ `thử nghiệm thực chiến` và hai câu hỏi mở đầu mang giọng điệu thản nhiên, lấp liếm hợp thức hóa của Tanya."
- segment_id: YS-LN03/Text/chapter003_004.xhtml/p000116
  locks:
  - "Giữ đại từ nội tâm `Mình – chúng ta` theo DEC-P01-001, dấu nhấn mạnh `*ông ta*` quy chiếu Schugel theo DEC-P01-002, dấu gạch ngang dài và các định danh `những quả V-1`, `Quân cảng Brest`."
