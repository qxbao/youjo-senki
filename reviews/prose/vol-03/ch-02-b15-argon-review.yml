locked_choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000405
  locks:
  - "Giữ tên “Tanya”, dấu ngoặc kép hội thoại, cụm “Đám John Bull” và câu hỏi vặn xem họ có đang can thiệp vào hay không."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000406
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Hotel 09”, “Fairy 01”, ngôi “tôi”, cụm “một kiểm soát viên quèn” và lời xin lỗi không dám nói chắc chuyện đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000407
  locks:
  - "Chỉ đánh dấu chữ nghiêng đúng cụm `*Ừ thì, cũng phải thôi*` ở đầu câu theo DEC-P01-002; giữ đại từ trần thuật “nó” theo DEC-P01-001, thuật ngữ “quy tắc giao chiến”, câu hỏi trong ngoặc kép của “Fairy 01” xưng “Chúng tôi”, và câu hỏi nội tâm tiếp nối xưng “Chúng ta” về việc phải đánh chặn hay rút lui trong chiến tranh hiện đại."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000408
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Các vị”, các cụm “quốc gia thứ ba”, “không phận giao tranh” và chỉ dẫn có thể tiêu diệt bất kỳ “pháp sư không phải quân ta” nào như kẻ địch."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000409
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Fairy 01” và câu xác nhận “rõ. Nghe vậy là yên tâm rồi.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000410
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, thuật ngữ “pháp sư trên không” và hai mệnh đề đối xứng “Hễ là kẻ địch thì bắn hạ. Không phải kẻ địch thì yểm trợ.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000411
  locks:
  - "Giữ tên “Tanya”, các định danh “đại đội tuyển chọn thuộc Tiểu đoàn Pháp sư Trên không số 203”, “Vùng Đất Thấp” và hành động dẫn đầu đơn vị tiến vào không phận được chỉ định."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000412
  locks:
  - "Giữ các cụm “trận đánh bao vây khổng lồ”, “Cannae”, ký hiệu chú thích `⁶` ngay sau dấu chấm câu, “thế trận bao vây kép” và cấu trúc “nuốt trọn không chỉ một quân đoàn của Lục quân Cộng hòa mà là toàn bộ lực lượng chủ lực của họ”."
