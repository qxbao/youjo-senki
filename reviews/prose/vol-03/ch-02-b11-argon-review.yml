- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000261
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi” trong lời xin lỗi, tiếng chửi thề “Khốn kiếp!” và câu hỏi ngập ngừng vì sao chuyện này lại xảy ra."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000262
  locks:
  - "Giữ đại từ “anh”, các thuật ngữ “đơn vị pháp sư địch”, “sở chỉ huy tiền tuyến”, “lực lượng mặt đất”, chi tiết hai nắm đấm siết chặt run lên vì giận dữ ở độ cao loãng oxy, sự căm phẫn khi tình huống những người như anh có nhiệm vụ ngăn chặn lại xảy ra, và chỉ đánh dấu chữ nghiêng đúng câu hỏi nội tâm cuối đoạn `*Thế thì tại sao mình lại bỏ mặc lực lượng mặt đất làm mồi nhử rồi một mình chạy trốn thế này?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000263
  locks:
  - "Giữ câu cảm thán ngắn “Thật quá đỗi thảm hại và nhục nhã.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000264
  locks:
  - "Giữ đại từ “anh”, hình ảnh cơn sóng thần cảm xúc khôn tả trào dâng nhưng bị dồn nén xuống để dốc toàn lực bay về hậu phương vì sứ mệnh ngăn tiền tuyến sụp đổ dù phải hy sinh tất cả."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000265
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các cụm “Sở chỉ huy”, “Các nhân viên kiểm soát phòng không”, ngôi tự nhủ “mình” và câu gọi vô tuyến không kết nối được kèm lời chửi bực bội."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000266
  locks:
  - "Giữ đại từ “anh”, định danh “sở chỉ huy Cụm tập đoàn quân Rhine” và mạch nhận thức dù bên kia không hồi đáp nhưng anh hiểu rõ nơi đó hẳn phải đang chìm trong cảnh hỗn loạn tột cùng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000267
  locks:
  - "Giữ tên “Vianto”, cảm giác khinh miệt và chỉ đánh dấu chữ nghiêng đúng hai câu hỏi nội tâm `*Làm thế nào mà họ lại có thể để các pháp sư Đế quốc thọc sâu đến tận mức này vào lãnh thổ của ta mà chẳng hề gửi cho chúng ta lấy một lời cảnh báo nào chứ? Các nhân viên kiểm soát phòng không đang ngủ gật hay sao thế hả?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000268
  locks:
  - "Giữ đại từ “anh”, cảm xúc chán ghét và quan hệ nhân quả một khi việc đánh chặn ban đầu bị chậm trễ thì hoạt động tiếp chiến với quân địch sẽ trở nên hỗn loạn mất tổ chức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000269
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi” và lời gọi vô tuyến lặp lại liên tục tới “Sở chỉ huy Cụm tập đoàn quân Rhine”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000270
  locks:
  - "Giữ chỉ đánh dấu chữ nghiêng đúng câu hỏi đầu đoạn `*Có phải sóng vô tuyến vẫn chưa vươn tới chỗ họ vì mình còn ở khá xa không?*` theo DEC-P01-002, đại từ “anh”, thuật ngữ “quả cầu tính toán” và sự ức chế khi không có lời hồi đáp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000271
  locks:
  - "Giữ chỉ đánh dấu chữ nghiêng đúng câu hỏi đầu đoạn `*Sao chuyện này lại cứ phải xảy ra vào đúng lúc này cơ chứ?*` theo DEC-P01-002, đại từ “anh” và cảnh tiếp tục bay tới trước với lòng dạ nóng như lửa đốt vì sốt ruột."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000272
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm “Nhân viên điện đài” và lời chửi thề trách cứ ngủ quên không đúng lúc."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000273
  locks:
  - "Giữ đại từ “anh”, cụm “sở chỉ huy”, chi tiết bay ở mức gần chạm ngưỡng tốc độ chiến đấu tối đa và câu chuyển ý “Rồi anh nhìn thấy nó.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000274
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu thốt bàng hoàng “…Cái gì thế này?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000275
  locks:
  - "Giữ cảnh tượng mặt đất chi chít hố bom đạn và các cơ sở của sở chỉ huy đang bốc khói ngùn ngụt, chìm trong biển lửa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000276
  locks:
  - "Giữ định danh “Sở chỉ huy Cụm tập đoàn quân Rhine” và cách diễn đạt cụm cơ sở từng được biết đến với tên gọi đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000277
  locks:
  - "Giữ cụm “quân phục Cộng hòa” và hình ảnh những người lính đang chạy ngược chạy xuôi dưới mặt đất để cứu hộ và dập lửa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000278
  locks:
  - "Giữ cụm “sở chỉ huy Cụm tập đoàn quân Rhine” và nhận thức vậy ra đây là nơi đặt sở chỉ huy."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000279
  locks:
  - "Giữ câu ngắn khẳng định vị trí “Chính là nơi này.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000280
  locks:
  - "Giữ chỉ đánh dấu chữ nghiêng đúng từ `*này*` theo DEC-P01-002 và câu hỏi bỏ lửng về nơi đang bốc khói đen kịt, chìm trong chảo lửa hỗn loạn không sao cứu vãn nổi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000281
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm “sở chỉ huy” và câu cảm thán bỏ lửng “Đây là sở chỉ huy ư? Trong muôn vàn chuyện…”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000282
  locks:
  - "Giữ định dạng chữ in hoa toàn bộ tiêu đề chuyển cảnh “NGÀY 26 THÁNG 5, NĂM THỐNG NHẤT 1925, TRÊN BIỂN: ĐÀI CHỈ HUY TÀU NGẦM ĐẾ QUỐC”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000283
  locks:
  - "Giữ ý nhượng bộ “dẫu là do yêu cầu tất yếu”, sự chật hẹp kinh khủng bên trong tàu ngầm và việc hầu hết hành khách thiếu kinh nghiệm đều càu nhàu vì liên tục cụng hay va cơ thể vào thứ gì đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000284
  locks:
  - "Giữ câu dẫn chuyển ý “Thông thường thì chuyện sẽ diễn ra như vậy.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000285
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng “Thuyền trưởng Treizel”, cặp xưng hô “ngài – tôi” kèm kính ngữ “ạ”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000286
  locks:
  - "Giữ chức danh và cấp bậc “chỉ huy tiểu đoàn pháp sư trên không, Thiếu tá Tanya von Degurechaff” cùng chi tiết thoăn thoắt bước qua cửa khoang mà chẳng cần phải cúi đầu."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000287
  locks:
  - "Giữ đại từ “Nó” theo DEC-P01-001 và ý là người duy nhất thủy thủ đoàn không có cơ hội trêu chọc về cảnh lúng túng va đập khắp các lối đi, chí ít là trong một thời gian nữa."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000288
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, câu hỏi “Tại sao ư?” và lời giải thích về cơ thể đặc biệt mà ngay cả khi những thủy thủ thấp bé nhất cũng phải khom lưng thì chiều cao của nó rõ ràng chẳng gây trở ngại nào."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000289
  locks:
  - "Giữ dấu chấm lửng mở đầu, đại từ “nó” theo DEC-P01-001, thuật ngữ “cuống huân chương” và ý bất kỳ ai có chút đầu óc cũng phải đắn đo suy nghĩ lại khi nhìn thấy hàng loạt cuống huân chương minh chứng cho những chiến công hiển hách."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000290
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng “Thiếu tá” và câu hỏi thăm chuyến đi thế nào."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000291
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “tôi”, cụm kính ngữ “thưa ngài” và lời khen chuyến đi yên ả cùng đồ ăn ngon đến mức không cầm nổi nước mắt biết ơn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000292
  locks:
  - "Giữ danh xưng “Thiếu tá von Degurechaff” và chi tiết thực hiện động tác chào theo kiểu hải quân với khuỷu tay gập một góc chuẩn xác."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000293
  locks:
  - "Giữ cụm “Vị thuyền trưởng”, đại từ “ông”, sự phân vân không biết nên ấn tượng hay thấy ghê sợ và hành động đáp lễ bằng cái chào theo kiểu lục quân."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000294
  locks:
  - "Giữ đại từ “ông” và ý đây là con tàu của ông nhưng ông vẫn có thể thể hiện sự tôn trọng đối với một vị khách đi tàu."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000295
  locks:
  - "Giữ đại từ “ông” cho vị thuyền trưởng, đại từ “nó” và cách gọi “quý cô nhỏ nhắn đang đi nhờ tàu này” cho Tanya, thuật ngữ “cuống huân chương” và tên phần thưởng “Huy hiệu Đột kích Cánh bạc”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000296
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi”, cụm “quân nhân lực lượng ma pháp” và thắc mắc về việc được cấp khẩu phần ăn giàu calo."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000297
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi / chúng tôi”, danh xưng “thưa Thuyền trưởng Treizel” và các danh mục khẩu phần “các viên thực phẩm bổ sung dinh dưỡng đóng khối”, “hoa quả đóng hộp”, “xúc xích trắng”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000298
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001 và nhận định về việc xử lý những lời xã giao tán tụng giữa các chỉ huy đơn vị tác chiến thuộc những binh chủng khác nhau một cách điềm tĩnh, khéo léo để giữ quan hệ hòa nhã tránh cãi vã trong cộng đồng nhỏ hẹp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000299
  locks:
  - "Giữ đại từ “ông”, tên “Degurechaff” và niềm vui khi nghe khen đồ ăn trên tàu ngầm tuyệt vời đến nhường nào."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000300
  locks:
  - "Giữ mạch ý tự hào của thủy thủ đoàn tàu ngầm—hơn cả những đơn vị hải quân khác—khi có được một đầu bếp vừa biết tận dụng căn bếp nhỏ xíu và dụng cụ ít ỏi trên tàu vừa nỗ lực sáng tạo món ăn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000301
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu kết về đặc quyền chỉ có ở trên tàu ngầm, nơi rất khó tìm được bất cứ thú vui nào khác."
