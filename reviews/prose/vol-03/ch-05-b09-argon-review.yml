  proposed_vi: "Đối thoại và phát biểu trong cuộc họp Bộ Tổng tham mưu: người chủ trì, Zettour và các tướng lĩnh dự họp xưng `tôi`, dùng `chúng ta` / `của mình` khi chỉ chung phía Đế quốc (chapter005_004/p000084, p000103–p000105, p000107) / Trần thuật ngôi thứ ba: quy chiếu Trung tướng von Zettour bằng `ông` (chapter005_004/p000085–p000088, p000103); quy chiếu tập thể Bộ Tổng tham mưu, các tướng lĩnh Đế quốc hoặc phe địch trong mệnh đề tương ứng bằng `họ` (chapter005_004/p000086, p000087, p000089, p000090, p000096, p000100, p000102–p000104, p000106, p000108, p000109, p000111); quy chiếu lực lượng tự xưng “Cộng hòa Tự do” qua góc nhìn đánh giá của giới tướng lĩnh Đế quốc tại p000096 bằng `bọn chúng`"
