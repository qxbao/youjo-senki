- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000084
  locks:
  - "Giữ lời chuyển mục nghị sự của người chủ trì với đại từ `tôi`, địa danh `lục địa phía nam` và chức danh `Phó cục trưởng Cục Hậu cần von Zettour`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000085
  locks:
  - "Giữ các định danh `Trung tướng von Zettour`, `Lục quân Cộng hòa`, quy chiếu `Ông` và nguyên nhân thăng quân hàm nhờ thành công của kế hoạch nhử mồi và tiêu diệt quân địch."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000086
  locks:
  - "Giữ các định danh `Bộ Tổng tham mưu`, `Đại quân`, `chính quốc Khối Thịnh vượng chung`, `Cộng hòa` và mục tiêu tập kết quân nhằm phô trương thanh thế đồng thời tiếp tục cuộc đấu tranh giành quyền bá chủ."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000087
  locks:
  - "Giữ quy chiếu `Ông` – `họ`, địa danh `lục địa phía nam`, thuật ngữ `các đơn vị tuyến hai` và cụm `như một kiểu tiến công`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000088
  locks:
  - "Giữ nhận định bề ngoài `Thoạt nhìn, có vẻ như ông đang đặt nặng việc đánh chiếm lục địa phía nam.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000089
  locks:
  - "Giữ bản chất `tái tổ chức các chiến tuyến gần như mang tính bị động`, cách nhìn nhận trong nội bộ `lục quân` là `một kế hoạch phòng ngự` và lợi ích phòng vệ khi đưa chiến trường chính ra ngoài `Đế quốc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000090
  locks:
  - "Giữ các cụm `các thuộc địa`, `chính quốc`, `các tuyến tiếp tế của Khối Thịnh vượng chung`, `bộ tham mưu Đế quốc` và nhận định câu giờ để tái tổ chức `lực lượng chủ lực của họ`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000091
  locks:
  - "Giữ câu nêu mục đích thực sự của `Zettour`: `tiến hành hoạt động quấy rối có hiệu quả`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000092
  locks:
  - "Giữ chính xác hai phần nhấn mạnh in nghiêng `*quá*` và câu hỏi tu từ phủ định `*Chẳng phải sẽ đơn giản hơn nếu cứ điều thẳng lực lượng chủ lực sang chính quốc Khối Thịnh vượng chung hay sao?*` theo DEC-P01-002, cùng ý `trận chiến quyết định`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000093
  locks:
  - "Giữ nhận định `Lẽ tự nhiên, kẻ địch phải bảo vệ cả chính quốc lẫn các thuộc địa của mình.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000094
  locks:
  - "Giữ sắc thái suy đoán `nhiều khả năng` và cụm `các thuộc địa sẽ bị thiếu hụt thực lực`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000095
  locks:
  - "Giữ cấu trúc `không cần phải nói cũng biết` và so sánh hơn `các thuộc địa sẽ dễ bị đánh bại hơn`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000096
  locks:
  - "Giữ câu điều kiện `nếu họ thành công trong việc đánh bại các thuộc địa`, định danh `Khối Thịnh vượng chung`, tên tự xưng trong ngoặc kép `“Cộng hòa Tự do”` và đại từ `bọn chúng`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000097
  locks:
  - "Giữ câu kết chuỗi lập luận: `Và đó là lý do mọi người đều nhắm tới một trận chiến quyết định ngay trên chính quốc Khối Thịnh vượng chung.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000098
  locks:
  - "Giữ mệnh đề nhượng bộ công nhận `tính hiệu quả của một chiến dịch tại lục địa phía nam`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000099
  locks:
  - "Giữ liên từ liệt kê `Thứ nhất` (song hành với `Thứ hai` ở p000100) và phủ định `sẽ không quá khó khăn`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000100
  locks:
  - "Giữ liên từ `Thứ hai`, quy chiếu `họ` và tác dụng `mối đe dọa thất bại ngay tại quê nhà sẽ làm phân tán quân địch`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000101
  locks:
  - "Giữ sự đối lập giữa `một chiến dịch đường vòng` và `giáng một đòn trực diện vào chính quốc Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000102
  locks:
  - "Giữ câu thoại ngắn gọn: `“Nếu làm vậy, cuộc chiến sẽ kết thúc,” họ nói.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000103
  locks:
  - "Giữ trọn vẹn lập trường đối lập của `Zettour`, lời thoại với đại từ `Chúng ta` về việc làm địch vắt kiệt sức lực tại `lục địa phía nam` để dẹp yên `các lực lượng du kích` và tái tổ chức quân đội, cùng nỗi sợ lớn nhất của `ông` rằng sau một `trận hải chiến được ăn cả ngã về không` và `chiến dịch đổ bộ` làm `quân đội Đế quốc` kiệt quệ thì một cường quốc khác sẽ can thiệp."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000104
  locks:
  - "Giữ lời phản đối gay gắt với đại từ `Tôi` – `Chúng ta` – `họ` và các định danh `Đại quân`, `Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000105
  locks:
  - "Giữ lời nhắc nhở trang trọng `“Xin hãy nhớ lại sự chênh lệch thực lực giữa hải quân hai bên. Chúng ta không nắm quyền kiểm soát mặt biển.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000106
  locks:
  - "Giữ sự đối sánh giữa hải quân vượt trội của `Khối Thịnh vượng chung` với `Hải quân Đế quốc` cả về chất lượng lẫn số lượng, và mệnh đề nhượng bộ rằng dù mở rộng nhanh chóng những năm gần đây họ vẫn còn tụt lại phía sau."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000107
  locks:
  - "Giữ câu đáp phản biện: `“Đó càng là lý do để chúng ta làm chủ bầu trời bằng lực lượng không quân và pháp sư của mình.”`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000108
  locks:
  - "Giữ mệnh đề nhượng bộ–phủ định về việc chiến hạm của `Đế quốc` dù vượt trội nếu xét riêng từng chiếc so với tàu của `Khối Thịnh vượng chung` nhưng vẫn không thể thắng chỉ bằng `trang bị khí tài` đơn thuần."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000109
  locks:
  - "Giữ vai trò của `huấn luyện và kỹ năng` cùng cấu trúc phủ định `mà họ cũng không thể xem nhẹ tính tuyệt đối của quân số`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000110
  locks:
  - "Giữ câu khẳng định vai trò bù đắp của `lực lượng không quân và pháp sư của Đế quốc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000111
  locks:
  - "Giữ các cụm thuật ngữ `lực lượng không quân và pháp sư`, `quyền làm chủ bầu trời`, `các đòn tấn công chống hạm`, `quân đội Đế quốc`, `mặt trận Rhine` và ý lực lượng ở hậu phương tìm cách chi viện nhiều hơn nhờ kinh nghiệm tích lũy được."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000112
  locks:
  - "Giữ câu kết batch: `Thế nhưng eo biển kia vẫn là một chướng ngại chiến lược to lớn đối với Lục quân Đế quốc.`."
