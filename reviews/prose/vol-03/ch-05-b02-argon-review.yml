locked_choices:
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000039
  locks:
  - "Giữ cấu trúc giới hạn `chỉ có thể bị xem là một thực thể sa ngã, tà ác không còn cách nào cứu vãn`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000040
  locks:
  - "Giữ cụm `con đường cứu rỗi` và cấu trúc nhấn mạnh chủ thể `chính những thực thể còn tương đối thiếu kinh nghiệm, dễ đi chệch hướng, mới là những kẻ sẽ thất bại trong việc dẫn dắt của mình`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000041
  locks:
  - "Giữ quan hệ nhân quả `Đó là lý do vì sao tất cả các thực thể có mặt đều bàng hoàng`, cách gọi `người giám sát của họ` và phủ định `không biết phải tiếp tục việc dẫn dắt của mình như thế nào`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000042
  locks:
  - "Giữ hai câu hỏi lễ phép của thực thể cấp dưới trong ngoặc kép: `“Là những kẻ dưới sự dẫn dắt của ngài sao, thưa ngài Seraph? Làm sao chuyện như vậy lại có thể xảy ra được ạ?”`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000043
  locks:
  - "Giữ danh xưng số nhiều `Các seraphim`, tôn xưng `Đức Cha` và mức độ so sánh bậc nhất `gần gũi nhất trong tất cả`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000044
  locks:
  - "Giữ hai câu hỏi tu từ liên tiếp, các danh xưng `vị seraph`, `Chúa Cha` và câu điều kiện giả định ở cuối đoạn."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000045
  locks:
  - "Giữ cấu trúc tăng tiến `không chỉ vứt bỏ đức tin của mình, mà nếu các ngươi có thể tin nổi… chúng thậm chí còn phạm thượng` và cặp đại từ `các ngươi` – `chúng`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000046
  locks:
  - "Giữ hai câu hỏi ngắn không in nghiêng: `Phạm thượng ư? Làm sao có thể như vậy được?`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000047
  locks:
  - "Giữ ẩn dụ `bầy cừu`, nhận định `các thực thể này về cơ bản có thể được mô tả là thờ ơ` và mức độ `Hiếm khi nào có chuyện gì đó xảy ra khiến thái độ của họ thay đổi.`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000048
  locks:
  - "Giữ dấu gạch ngang trong câu đầu, thuật ngữ `chủ nghĩa vô thần trên diện rộng` và câu hỏi tăng tiến `Không chỉ vậy, các báo cáo còn cho thấy những hành vi bị phán là phạm thượng cũng đang diễn ra trên cùng một quy mô ư?`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000049
  locks:
  - "Giữ câu cảm thán độc lập: `Chúng đang phạm phải tội ác báng bổ thần thánh!`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000050
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng `*Tại sao? Liệu nó có lan ra tất cả bọn chúng không?*` theo DEC-P01-002 và mệnh đề điều kiện mở đầu."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000051
  locks:
  - "Giữ phủ định `Chuyện đó lẽ ra không thể nào xảy ra được.`, ngôi tự xưng `Ta` và chi tiết `phong trào ngông cuồng nhằm thần thánh hóa những kẻ cai trị của chúng`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000052
  locks:
  - "Giữ cách quy chiếu `vị seraph` – `ông ta`, hình ảnh `nhổ toẹt câu trả lời ra` và kết quả `xóa tan mọi nghi ngờ trong tâm trí họ`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000053
  locks:
  - "Giữ nhịp ngắt giữa hai câu và diễn biến tâm lý từ im lặng sang thấm thía ý nghĩa lời nói của `ông ta` rồi kinh ngạc."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000054
  locks:
  - "Giữ hai câu hỏi cảm thán trong ngoặc kép: `“Chúng thực sự chẳng có chút kính sợ nào sao? Phải là loại người như thế nào mới làm ra những chuyện như vậy chứ?!”`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000055
  locks:
  - "Giữ tôn xưng `Thượng đế` và chi tiết `đánh đồng Thượng đế với thuốc phiện`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000056
  locks:
  - "Giữ đại từ `Ông ta`, câu hỏi tu từ về `cội nguồn của thế giới`, tôn xưng `Chúa Cha`, sự đối sánh với `những thực thể từng sa ngã trong quá khứ` và trạng thái `chết lặng`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000057
  locks:
  - "Giữ lời thoại cảm thán: `“Cái gì cơ…?! Sự kinh hoàng này không có giới hạn hay sao?”`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000058
  locks:
  - "Giữ câu trần thuật ngắn: `Đó đại khái là cảm nhận chung của tất cả bọn họ.`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000059
  locks:
  - "Giữ phủ định `Có một suy nghĩ đã không được nói thành lời.`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000060
  locks:
  - "Giữ câu hỏi nội tâm in nghiêng toàn đoạn `*Làm sao chuyện này lại có thể xảy ra được?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000061
  locks:
  - "Giữ câu hỏi đuôi của `vị cherub` và sự đồng cảm của tất cả những ai đang có mặt."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000062
  locks:
  - "Giữ đại từ `ông ta` và mệnh đề giả định so sánh `cứ như thể nó chưa từng tồn tại`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000063
  locks:
  - "Giữ cụm ẩn dụ `những chú cừu non ngoan đạo đang tìm kiếm sự cứu rỗi`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000064
  locks:
  - "Giữ tôn xưng `Thượng đế` và cụm `tìm kiếm sự cứu rỗi từ một đấng siêu việt`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000065
  locks:
  - "Giữ ngôi tự xưng `Ta` và cụm `sa vào sự tà ác của chủ nghĩa vô thần`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000066
  locks:
  - "Giữ câu cảm thán mở đầu bằng `Rằng` và thuật ngữ `Tin Mừng`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000067
  locks:
  - "Giữ cụm mở đầu `…Với tất cả sự kính trọng, tôi thấy điều đó thật khó tin.`, thuật ngữ `Tin Mừng` và hai câu hỏi hoài nghi liên tiếp về `bóng tối nguyên thủy của chủ nghĩa vô thần`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000068
  locks:
  - "Giữ các danh xưng `vị tổng lãnh thiên thần và các thiên thần khác`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000069
  locks:
  - "Giữ nhịp điệp cấu trúc ở hai câu đầu và sự tự đính chính `Chuyện đó quả thực không thể tưởng tượng nổi. Không, họ đang chối bỏ hiện tượng bất khả thi ấy.`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000070
  locks:
  - "Giữ phủ định `lẽ ra không bao giờ được phép xảy ra` và cụm `một tập thể đã được ban cho Tin Mừng`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000071
  locks:
  - "Giữ chính xác chữ nghiêng `*Homo sapiens*` theo DEC-P01-002 và sự đối lập giữa `quan tâm đến con người với tư cách là một tập thể` với `gần như dửng dưng với con người ở góc độ cá nhân`."
- segment_id: YS-LN03/Text/chapter005_002.xhtml/p000072
  locks:
  - "Giữ thuật ngữ `Tin Mừng`, mức độ phủ định `Đó là chuyện hầu như chưa từng nghe thấy bao giờ.` và câu điều kiện về các hình thức đức tin mới hoặc sự suy giảm đức tin trong quá khứ."
