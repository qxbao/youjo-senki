  rationale: "Kế thừa nhất quán “Bộ trưởng Tài chính”, “Ngài Marlborough” (quy chiếu ngôi ba bằng “ông ta”) và “vị thủ tướng” (quy chiếu ngôi ba bằng “ông”) từ b18–b19; dịch chuẩn xác tước hiệu cụ thể mới xuất hiện tại p000346 là “Công tước Marlborough” kèm kính xưng tương ứng trong thoại tại p000349 là “thưa Đức ngài”; đồng bộ chức danh đứng đầu ngành hải quân trong nội các là “Bộ trưởng Hải quân” (p000342–p000343), cơ quan chủ quản viết thường trong nguồn ở p000360 là “bộ hải quân”, và chức danh phụ trách nội chính viết thường là “bộ trưởng nội vụ” (p000337, p000350)."
