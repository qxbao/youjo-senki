- source_term: republican_hq_crisis_and_vianto_register_vol03_ch06_b19
  proposed_vi: "Toàn bộ lô (`p000595`–`p000632`) nối tiếp trực tiếp điểm nhìn tại sở chỉ huy quân Cộng hòa từ cuối B18: quy chiếu các sĩ quan tham mưu, Tướng de Lugo, Đại tá Vianto và phía quân Cộng hòa bằng `họ` / `hai người họ` (`p000596`–`p000599`, `p000601`, `p000604`–`p000608`, `p000610`, `p000611`, `p000613`, `p000618`, `p000619`, `p000623`, `p000630`, `p000632`); quy chiếu riêng Đại tá Vianto bằng `ông` trong trần thuật (`p000630`) và `mình` trong câu độc thoại nội tâm quyết tử (`p000628`), đồng bộ hoàn toàn với B16 (`p000494`, `p000501`, `p000504`, `p000519`); quy chiếu các pháp sư Đế quốc từ góc nhìn đối địch của phe Cộng hòa bằng `chúng` / `bọn chúng` (`p000600`, `p000603`, `p000604`, `p000606`, `p000612`, `p000617`, `p000621`, `p000624`–`p000627`); trong lời thoại của de Lugo và Vianto dùng `chúng ta` – `chúng` / `bọn chúng` (`p000600`, `p000617`), giữ nguyên dấu ngoặc kép đôi `““...””` biểu thị lời nói đồng thanh của hai vị chỉ huy tại `p000617`"
  alternatives_vi:
  - "ông ta (thay cho `ông` khi quy chiếu Đại tá Vianto tại `p000630` — giữ `ông` đồng bộ trực tiếp với lựa chọn đã khóa tại `ch-06-b16`, thể hiện sự trân trọng đối với vị đại tá cựu binh dày dạn kinh nghiệm đã không chút do dự lấy thân mình làm lá chắn bảo vệ tư lệnh)"
