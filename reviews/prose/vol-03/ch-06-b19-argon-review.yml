- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000595
  locks:
  - "Giữ tình thế tiến thoái lưỡng nan đầy nghiêm trọng của `các sĩ quan tham mưu` trong một khoảng thời gian ngắn: có nên gọi `sĩ quan quân y` hay không."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000596
  locks:
  - "Giữ tên riêng `de Lugo` và `Vianto`, sự phân biệt rõ chủ thể giữa `một vài sĩ quan tham mưu` (`họ` / `chính bản thân họ`) với hai vị chỉ huy (`hai người họ`), và bảo toàn chính xác hai cụm nhấn mạnh tách rời theo `DEC-P01-002` (`*Có gì đáng cười thế chứ?*` và `*Ai thèm quan tâm chứ?*`)."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000597
  locks:
  - "Giữ lời rít lên đầy cay độc của `họ` sau khi tràng cười dứt hẳn (`“Thực tại này đúng là một trò đùa chết tiệt.”`) và nhận định đó là lời oán thán trước tình cảnh phi lý mà `mình` đang lâm vào."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000598
  locks:
  - "Giữ sự tự tin ban đầu của `Họ` vào `đội hình tác chiến` và nguyên tắc lý thuyết đơn giản của chiến dịch: gây sức ép lên `Lục quân Đế quốc` đang bị bao vây từ ba hướng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000599
  locks:
  - "Giữ định danh `Lục quân Cộng hòa Tự do` và `Lục quân Đế quốc`, bảo toàn chính xác cụm nhấn mạnh thì quá khứ đặt trong `*...*` theo `DEC-P01-002` (`*Đã từng…*`), và câu nhận định chuyện đó giờ đây phải được nhắc đến ở thì quá khứ."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000600
  locks:
  - "Giữ nhịp ngập ngừng mở đầu câu hỏi và sự đối lập giữa `chiến lược` của `chúng ta` với `một nước đi áp đảo ở cấp độ chiến dịch` của `Chúng`, cùng lời cảm thán `Bọn chúng cũng to gan thật đấy.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000601
  locks:
  - "Giữ sự phân biệt chuẩn xác ba cấp độ tác chiến (`cấp độ chiến lược`, `những pha cơ động chiến thuật` trong quá trình tác chiến, `ưu thế chiến lược`) và sự đối lập giữa lý thuyết không thể xảy ra với thực tế cục diện đã bị đảo ngược."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000602
  locks:
  - "Giữ diễn biến sau khi tấn công `cánh phải`, `trung đoàn địch` về cơ bản đã đổi chỗ với `quân tiếp viện` để đột kích `lực lượng trung tâm`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000603
  locks:
  - "Giữ chi tiết đơn vị dưới quyền trực tiếp của `Vianto` xuất kích đánh chặn nhưng quân địch lập tức rút lui ngay khoảnh khắc vừa chạm trán, khiến `quân Cộng hòa` không thể dùng toán quân tinh nhuệ chặn đứng `chúng` mà cũng không thể tổ chức một tuyến kháng cự thống nhất."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000604
  locks:
  - "Giữ giả định nếu quân địch lao vào tấn công `họ`, một bộ phận có thể ghìm chân `chúng` lại để `lực lượng chủ lực` đánh vào phần còn lại của `quân Đế quốc`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000605
  locks:
  - "Giữ giả định đối lập: `Nhưng nếu quân địch đang rút lui, họ buộc phải tấn công.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000606
  locks:
  - "Giữ hệ quả khiến logic vận hành theo chiều ngược lại và thế kẹt của `họ` không thể cứ thế mặc kệ `chúng` mà buộc phải làm gì đó."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000607
  locks:
  - "Giữ nhận định trong hoàn cảnh của `mình`, `họ` không có nhiều phương án để lựa chọn."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000608
  locks:
  - "Giữ tình cảnh hỗn loạn bên `cánh phải`, cuộc giao chiến ác liệt ở `cánh trái` chống `lực lượng chủ lực của địch` đang tìm cách đột phá, và lý do `họ` không thể cho phép `một trung đoàn pháp sư` muốn làm gì thì làm."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000609
  locks:
  - "Giữ cụm chuyển đoạn ngắn có dấu gạch ngang dài: `Và rồi—`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000610
  locks:
  - "Giữ câu trần thuật ngắn: `Họ hầu như không thể tin vào mắt mình.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000611
  locks:
  - "Giữ sự đối lập giữa việc khả năng đó từng thoáng qua tâm trí mọi người với việc `họ` đã gạt đi vì cho rằng điều ấy bất khả thi."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000612
  locks:
  - "Giữ tiếng báo cáo hốt hoảng khi `Các pháp sư địch` tách thành nhiều tốp và nhịp lắp bắp `Chúng—chúng đang vòng ngược trở lại, và tốc độ rất nhanh!`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000613
  locks:
  - "Giữ phản ứng sững sờ: `Tất cả bọn họ bỗng chốc chết lặng không nói nên lời.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000614
  locks:
  - "Giữ toàn bộ câu cảm thán nội tâm bỏ lửng đặt trong `*...*` theo `DEC-P01-002`: `*Cái quái gì thế này—*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000615
  locks:
  - "Giữ toàn bộ câu hỏi nội tâm đặt trong `*...*` theo `DEC-P01-002`: `*Chuyện đó có khả thi không vậy?*`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000616
  locks:
  - "Giữ nhận định cảnh tượng ấy là lời nhắc nhở sống động về khoảng cách năng lực giữa hai bên."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000617
  locks:
  - "Giữ cặp dấu ngoặc kép đôi biểu thị lời nói đồng thanh của hai người: `““Cứ như thể chúng đang chơi trò đuổi bắt với chúng ta vậy.””`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000618
  locks:
  - "Giữ sự quy chiếu `hai người họ`, thời điểm ngay khoảnh khắc `đơn vị đánh chặn` ngập ngừng đuổi theo, và đòn xuyên thủng đội hình của `Quân Đế quốc` như thể chỉ chực chờ sự xáo trộn nhỏ nhất trên phòng tuyến."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000619
  locks:
  - "Giữ lý do cả hai bên cùng tăng tốc lướt qua nhau quá nhanh khiến việc giao chiến khó khăn, và sự tương phản kết quả giữa `Các pháp sư của Vianto` chỉ vừa vặn sượt qua địch với `các pháp sư Đế quốc` bắn trúng đích một loạt `pháp sư Cộng hòa`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000620
  locks:
  - "Giữ mệnh lệnh khẩn cấp tung `đơn vị dự bị` ra phối hợp với `đơn vị đánh chặn` gọng kìm quân địch lại."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000621
  locks:
  - "Giữ góc nhìn toàn cục từ trên cao khi `lực lượng Đế quốc` đang xung kích bị bao vây tưởng chừng việc bao vây tiêu diệt `chúng` chỉ là vấn đề thời gian, và `các đơn vị pháp sư Cộng hòa` đang khép chặt vòng vây còn áp đảo về quân số."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000622
  locks:
  - "Giữ sự đối lập điểm nhìn của người thực sự ở trong cuộc chiến đó khi tình hình trông hoàn toàn khác hẳn."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000623
  locks:
  - "Giữ cảnh `Quân địch` xé toạc vòng vây và `các pháp sư Đế quốc` bất ngờ áp đảo `họ` bằng hỏa lực và sức cơ động như cười nhạo ưu thế quân số của `phe Cộng hòa`, cứ như một cơn ác mộng."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000624
  locks:
  - "Giữ hình ảnh `chúng` như nhếch mép chế giễu nỗ lực chế áp của `phe Cộng hòa` và lao thẳng một mạch như điên về phía `sở chỉ huy của de Lugo`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000625
  locks:
  - "Giữ tiếng hét báo động: `“Không ổn rồi! Chúng nhanh quá!” ai đó hét lên.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000626
  locks:
  - "Giữ cấu trúc lặp `Trước khi lực lượng dự bị kịp bay lên không trung, trước khi đơn vị truy kích kịp đuổi theo bắt kịp, chúng đã tiếp cận được mục tiêu.`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000627
  locks:
  - "Giữ mục đích duy nhất của đợt xung kích xuyên suốt quãng đường dài: tiêu diệt một người duy nhất."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000628
  locks:
  - "Giữ sự chuẩn bị âm thầm của `Vianto` và bảo toàn chính xác câu độc thoại nội tâm thứ hai đặt trong `*...*` theo `DEC-P01-002` với đại từ `mình` và địa danh `mặt trận Rhine` (`*Bằng mọi giá mình sẽ ngăn chặn sự tái diễn của những gì đã xảy ra ở mặt trận Rhine!*`)."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000629
  locks:
  - "Giữ chuỗi mệnh lệnh khẩn cấp dựng `lưới phòng ngự chống pháp sư`, cảnh báo đòn đánh trực diện sắp giáng xuống, và thúc giục `Nhân sự sở chỉ huy` tìm chỗ ẩn nấp."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000630
  locks:
  - "Giữ đại từ `ông` quy chiếu `Vianto`, hành động dứt khoát đạp `de Lugo` vào `hầm trú ẩn` rồi lao người đè lên trên làm lá chắn, cùng chi tiết `Các sĩ quan tham mưu` nhào theo ngay sau `ông` và dấu gạch ngang dài cuối câu khi tất cả va đập chồng chất lên nhau trong hầm."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000631
  locks:
  - "Giữ âm thanh ngắn: `“Ực!”`."
- segment_id: YS-LN03/Text/chapter006_002.xhtml/p000632
  locks:
  - "Giữ phản xạ có điều kiện của mọi người khi nghe tiếng hét cảnh báo run rẩy và bảo toàn đầy đủ ba động tác bảo vệ trước sóng xung kích (cúi đầu xuống, hé miệng và bịt chặt tai lại) đúng khoảnh khắc màng nhĩ hứng chịu tiếng nổ ầm vang."
