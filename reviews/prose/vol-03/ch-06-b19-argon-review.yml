  proposed_vi: "sĩ quan tham mưu, sĩ quan quân y, de Lugo, Vianto (chapter006_002/p000595, p000596, p000603, p000619, p000624, p000628, p000630) / đội hình tác chiến, Lục quân Đế quốc, Lục quân Cộng hòa Tự do (chapter006_002/p000598, p000599) / chiến lược, nước đi áp đảo ở cấp độ chiến dịch, cấp độ chiến lược, những pha cơ động chiến thuật, ưu thế chiến lược (chapter006_002/p000600, p000601) / cánh phải, trung đoàn địch, quân tiếp viện, lực lượng trung tâm, cánh trái, lực lượng chủ lực, một trung đoàn pháp sư (chapter006_002/p000602, p000604, p000608) / đơn vị đánh chặn, đơn vị dự bị, lực lượng dự bị, đơn vị truy kích (chapter006_002/p000603, p000618, p000620, p000626) / các đơn vị pháp sư Cộng hòa, các pháp sư Đế quốc, sở chỉ huy của de Lugo, nhân sự sở chỉ huy (chapter006_002/p000619, p000621, p000623, p000624, p000629) / mặt trận Rhine, lưới phòng ngự chống pháp sư, hầm trú ẩn (chapter006_002/p000628–p000630)"
  alternatives_vi:
