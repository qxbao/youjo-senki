  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ toàn bộ hệ thuật ngữ đã khóa từ các chương và batch trước (`sĩ quan tham mưu`, `sĩ quan quân y`, `Lục quân Đế quốc`, `Lục quân Cộng hòa Tự do`, `cấp độ chiến dịch`, `cấp độ chiến lược`, `những pha cơ động chiến thuật`, `mặt trận Rhine`, `sở chỉ huy`, `hầm trú ẩn`, `de Lugo`, `Vianto`), đồng thời khóa tạm cách dịch tự nhiên, chuẩn xác cho các thuật ngữ tác chiến phòng không–chống pháp sư tại sở chỉ huy Cộng hòa (`nước đi áp đảo ở cấp độ chiến dịch`, `đơn vị đánh chặn`, `đơn vị dự bị`, `đơn vị truy kích`, `lưới phòng ngự chống pháp sư`)."
