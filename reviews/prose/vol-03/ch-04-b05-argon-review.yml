- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000105
  locks:
  - "Giữ đại từ `Anh`, tên `Serebryakov` và cấu trúc giả định quá khứ đi kèm sắc thái phỏng đoán (`Nếu đầu óc tỉnh táo, có lẽ anh đã nắm bắt được ẩn ý...`)."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000106
  locks:
  - "Giữ đại từ `mình` trong nội tâm, `anh` ở phần dẫn và chính xác hai mệnh đề chữ nghiêng tách bởi phần dẫn trần thuật theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000107
  locks:
  - "Giữ tên `Weiss`, cụm trong ngoặc kép `“nghỉ phép thời chiến”` và sự đối lập giữa việc điều trị y tế ở hậu phương hay hết ca trực dưới chiến hào với kỳ nghỉ thực sự đầu tiên của `anh`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000108
  locks:
  - "Giữ sự chuyển đổi đối tượng trong lời Tanya: khen Weiss với Visha (`anh ấy là một tấm gương mẫu mực trong việc giữ liên lạc`), rồi dặn dò Weiss (`chúng tôi` / `tôi` – `anh`)."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000109
  locks:
  - "Giữ lời chúc của Weiss `“Rõ. Chúc Thiếu tá thượng lộ bình an.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000110
  locks:
  - "Giữ lời chào đáp lại của Tanya `“Nhất định rồi, cảm ơn anh, và một lần nữa xin lỗi anh nhé.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000111
  locks:
  - "Giữ các định danh `Thiếu tá von Degurechaff`, `Tướng von Zettour` và lời yêu cầu gặp khẩn cấp."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000112
  locks:
  - "Giữ câu đáp lễ phép của viên sĩ quan trực ban `“Ồ, thưa Thiếu tá, thật vô cùng xin lỗi, nhưng hiện giờ Tướng quân đang ra ngoài ạ.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000113
  locks:
  - "Giữ chính xác mệnh đề chữ nghiêng mở đầu `*Hừm, chuyện này không thường xuyên xảy ra lắm*` theo DEC-P01-002, đại từ `nó` quy chiếu Tanya và `ông ấy` quy chiếu Zettour theo DEC-P01-001, cùng câu hỏi xin gặp `Tướng von Rudersdorf`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000114
  locks:
  - "Giữ đại từ `Nó` / `nó` quy chiếu Tanya, định danh `Tướng von Zettour` và thuật ngữ `viên sĩ quan tham mưu`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000115
  locks:
  - "Giữ định danh `Thiếu tá von Degurechaff`, `Văn phòng Bộ Tổng tham mưu` và lời thưa ngập ngừng lễ phép."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000116
  locks:
  - "Giữ tên `Tanya`, chức danh `viên sĩ quan trực ban` và sự đối lập giữa việc chuẩn bị tinh thần đối phương sẽ ngần ngại với sự sẵn sàng tiết lộ ngoài dự tính."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000117
  locks:
  - "Giữ câu hỏi dò hỏi lịch sự của Tanya `“Ra vậy. Thế họ có thể đang ở đâu được nhỉ?”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000118
  locks:
  - "Giữ đại từ `nó` quy chiếu Tanya, định danh `các sĩ quan Bộ Tổng tham mưu` và mạch suy luận dựa trên kinh nghiệm của Tanya."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000119
  locks:
  - "Giữ định danh `Bộ Tổng tham mưu Lục quân Đế quốc` và quan hệ nhân quả về sự liên lạc chặt chẽ giữa các sĩ quan chỉ đạo tác chiến."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000120
  locks:
  - "Giữ câu trần thuật ngắn `Đó là lý do Tanya không sao tin nổi chuyện này.`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000121
  locks:
  - "Giữ đại từ `nó` và ý chưa thực sự hiểu ra vấn đề ngay cả khi được báo văn phòng gần như trống không."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000122
  locks:
  - "Giữ đại từ `nó`, các từ chỉ phỏng đoán (`biết đâu`, `có lẽ`) về buổi lễ lớn ở triều đình hay dịp lễ lạt, tiệc tùng và câu kết `Đó là kỳ vọng ngây thơ của nó.`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000123
  locks:
  - "Giữ định danh `Văn phòng Bộ Tổng tham mưu` và nhận định phủ định mạnh về nhóm người nghiêm túc cứng nhắc ấy."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000124
  locks:
  - "Giữ câu trả lời của sĩ quan trực ban và chính xác cụm chữ nghiêng `*sảnh bia*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000125
  locks:
  - "Giữ câu hỏi nhại lại không in nghiêng `“Sảnh bia ư?”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000126
  locks:
  - "Giữ đại từ `nó` và chức danh `viên sĩ quan trực ban`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000127
  locks:
  - "Giữ toàn bộ câu độc thoại nội tâm in nghiêng `*Anh ta vừa nói cái gì với mình thế?*` theo DEC-P01-002 và đại từ `mình` theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000128
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Sảnh bia á?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000129
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Sảnh bia là cái gì?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000130
  locks:
  - "Giữ cụm độc thoại nội tâm in nghiêng `*Sảnh bia.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000131
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Đó là nơi để uống rượu bia.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000132
  locks:
  - "Giữ toàn bộ câu hỏi độc thoại nội tâm in nghiêng và định danh `Bộ Tổng tham mưu` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000133
  locks:
  - "Giữ lời giải thích của sĩ quan trực ban (`Tôi` – `Thiếu tá`) về việc họ hô hào uống rượu ăn mừng chiến thắng của `chúng ta`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000134
  locks:
  - "Giữ lời cảm ơn công vụ chuẩn mực của Tanya `“Vâng, cảm ơn anh vì đã vất vả làm nhiệm vụ. Vậy tôi xin phép cáo từ.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000135
  locks:
  - "Giữ đại từ `nó` và chi tiết buộc phải dồn gần như toàn bộ tâm sức chỉ để giữ nguyên nét mặt vô cảm và gật đầu."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000136
  locks:
  - "Giữ lời chúc ngủ ngon của sĩ quan trực ban `“Vâng, thưa Thiếu tá. Chúc Thiếu tá ngủ ngon.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000137
  locks:
  - "Giữ chức danh `viên sĩ quan trực ban`, tên `Tanya` và chi tiết mặt mày tối sầm chui vào giường."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000138
  locks:
  - "Giữ các định danh `các sĩ quan tham mưu`, `Thiếu tá Tanya von Degurechaff`, `Văn phòng Bộ Tổng tham mưu` và nét hài hước về việc vật lộn với cơn dư vị say rượu đầu tiên sau một thời gian dài."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000139
  locks:
  - "Giữ câu mở lời của Tanya với Zettour `“Thưa Tướng quân, xin thứ lỗi cho tôi, nhưng…”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000140
  locks:
  - "Giữ đại từ `Nó`, định danh `Tướng von Zettour` và `Bộ Tổng tham mưu`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000141
  locks:
  - "Giữ lời nhận xét của Zettour (`Tôi` – `Thiếu tá`), thuật ngữ `hạm đội`, `chỉ huy căn cứ` và kết luận rằng `cả hai người` đều đã phạm sai lầm trong quá trình thực thi nhiệm vụ."
