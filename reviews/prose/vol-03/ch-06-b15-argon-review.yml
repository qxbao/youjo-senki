  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thuật ngữ và nhân danh đã khóa từ các batch trước của chương 6 (`de Lugo` / `Tướng de Lugo`, `Lục quân Đế quốc`, `mạng lưới tình báo`, `vòng vây`), đồng thời khóa tạm các định danh đơn vị, nhân vật và thuật ngữ chiến thuật mới xuất hiện trong lô gồm `tín hiệu cầu cứu khẩn cấp` (`p000447`, `p000475`), `Đại đội Pháp sư 228` (`p000447`), `Tiểu đoàn Pháp sư 12` / `Tiểu đoàn 12` (`p000449`, `p000476`), `Bộ chỉ huy Sư đoàn 7` (`p000452`), `thế phòng ngự trì hoãn` (`p000477`) và `Đại tá Vianto` (`p000479`, `p000480`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: de_lugo_headquarters_crisis_pronouns_and_register_vol03_ch06_b15
  proposed_vi: "Toàn bộ lô theo điểm nhìn của Tướng de Lugo và bộ tham mưu Cộng hòa tại sở chỉ huy (chapter006_002/p000444–p000482): kế thừa nhất quán B07–B09 và B14, trong trần thuật ngôi thứ ba quy chiếu Tướng de Lugo bằng `ông ta` (`p000446`, `p000456`, `p000457`, `p000462`, `p000466`, `p000468`, `p000470`, và `mình` phản thân tại `p000456`), quy chiếu nhân viên điện đài bằng `anh ta` (`p000448`), quy chiếu bộ tham mưu và các đơn vị quân Cộng hòa bằng `họ` / `bọn họ` (`p000449`–`p000451`, `p000455`, `p000461`–`p000463`, `p000469`, `p000473`–`p000477`), và quy chiếu quân Đế quốc bằng `chúng` (`p000456`, `p000461`, `p000469`); trong độc thoại nội tâm in nghiêng của de Lugo dùng `chúng ta` / `bên ta` / `mình` đối lập với `chúng` và chất vấn thuộc cấp bằng `Ý các người là...` (`p000461`, `p000464`, `p000465`, `p000477`); trong thoại khẩn cấp tại sở chỉ huy dùng `chúng ta` – `chúng` và cấp dưới gọi `Thưa Tướng de Lugo` (`p000453`, `p000471`, `p000478`)"
  alternatives_vi:
  - "ông (thay cho `ông ta` khi quy chiếu Tướng de Lugo trong trần thuật tại chapter006_002/p000446, p000456, p000457, p000462, p000466, p000468, p000470 — ưu tiên `ông ta` để giữ liền mạch tuyệt đối với giọng trần thuật ngôi thứ ba đã khóa cho de Lugo tại B04–B09 và B14) / tôi (thay cho `mình` trong độc thoại nội tâm của de Lugo tại chapter006_002/p000465 — ưu tiên `mình` theo `DEC-P01-001` và tiền lệ B06–B09 để phân biệt rõ suy nghĩ nội tâm với lời thoại chỉ huy)"
