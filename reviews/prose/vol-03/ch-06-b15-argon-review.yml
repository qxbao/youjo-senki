  proposed_vi: "tín hiệu cầu cứu khẩn cấp, Đại đội Pháp sư 228 (chapter006_002/p000447, p000475) / nhân viên điện đài (chapter006_002/p000448) / Tiểu đoàn Pháp sư 12, Tiểu đoàn 12, yểm trợ trực tiếp, cánh phải (chapter006_002/p000449, p000450, p000452, p000476, p000477, p000482) / Bộ chỉ huy Sư đoàn 7, sở chỉ huy sư đoàn, các sĩ quan tham mưu (chapter006_002/p000452, p000454, p000473, p000480) / de Lugo, Tướng de Lugo (chapter006_002/p000455, p000461, p000463, p000471, p000473, p000479) / đối phó với các đợt tấn công trên bộ (chapter006_002/p000456) / pháp sư Đế quốc, lực lượng pháp sư chủ lực của Đế quốc, ưu thế về quân số (chapter006_002/p000459, p000462, p000464) / lữ đoàn, mạng lưới tình báo (chapter006_002/p000465) / Lục quân Đế quốc, quân dự bị (chapter006_002/p000466) / mưu mẹo nghi binh (chapter006_002/p000469) / thế phòng ngự trì hoãn, sư đoàn cánh phải (chapter006_002/p000477) / vòng vây (chapter006_002/p000478) / Đại tá Vianto, Vianto (chapter006_002/p000479, p000480) / các khẩu đội pháo (chapter006_002/p000482)"
  alternatives_vi:
  - "Đại đội Pháp sư số 228 / Tiểu đoàn Pháp sư số 12 / Bộ chỉ huy Sư đoàn số 7 (thay cho `Đại đội Pháp sư 228`, `Tiểu đoàn Pháp sư 12`, `Bộ chỉ huy Sư đoàn 7` tại chapter006_002/p000447, p000449, p000452, p000476 — ưu tiên cách gọi lược từ `số` vì ngắn gọn, dồn dập đúng ngữ điệu báo cáo khẩn cấp tại sở chỉ huy tiền phương) / tác chiến chống lực lượng mặt đất (thay cho `đối phó với các đợt tấn công trên bộ` tại chapter006_002/p000456 — ưu tiên `đối phó với các đợt tấn công trên bộ` vì tự nhiên, làm rõ trực tiếp sự đối lập giữa nhiệm vụ cản bộ binh ở hai cánh với nhiệm vụ cản pháp sư địch ở trung tâm tại p000457) / phòng ngự cầm chân (thay cho `thế phòng ngự trì hoãn` tại chapter006_002/p000477 — ưu tiên `thế phòng ngự trì hoãn` vì chuẩn xác theo thuật ngữ tác chiến quân sự)"
