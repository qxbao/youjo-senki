  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ hệ thuật ngữ đã khóa từ `canon/glossary-pending.yml` và các batch B01–B13 (`Being X`, `Norden`, `Tướng von Romel`, `Năm Thống nhất 1925`, `Lục quân Cộng hòa`, `Tướng de Lugo`, `mặt trận sông Rhine`, `cuộc tiến quân phân tán`, `Lục quân Đế quốc`, `Turus`), đồng thời khóa tạm các thuật ngữ quân sự và điển cố lịch sử mới xuất hiện trong lô gồm `tòa án quân sự` (`p000420`, `p000421`), `Đô đốc Byng` (`p000422`, `p000423`), `vừa đánh vừa rút lui` (`p000427`), `Trận Sekigahara` / `Đông quân và Tây quân` (`p000428`), `*kokudaka*` (`p000429`), `Oni-Shimazu` / `Gia tộc Shimazu` (`p000430`, `p000431`) và `những đợt xung phong của Kellerman` (`p000434`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_self_preservation_monologue_and_de_lugo_camp_register_vol03_ch06_b14
  proposed_vi: "Nửa đầu theo điểm nhìn và độc thoại nội tâm của Tanya (chapter006_002/p000418–p000436): tuân thủ nghiêm ngặt `DEC-P01-001`, quy chiếu ngôi thứ ba Tanya bằng `nó` (`p000419`–`p000421`, `p000424`, `p000433`) và tự quy chiếu ngôi thứ nhất trong độc thoại nội tâm bằng `mình` (`p000420`, `p000425`–`p000427`, `p000434`–`p000436`, cùng đại từ phản thân `chính mình` tại `p000424`); dùng `họ` cho tiểu đoàn hoặc quân bạn Đế quốc (`p000418`, `p000419`, `p000426`), và `chúng ta` / `quân ta` khi Tanya gộp chung đơn vị mình trong phương án đột phá (`p000427`, `p000432`) / Nửa sau tại Doanh trại Lục quân Cộng hòa theo điểm nhìn Tướng de Lugo (chapter006_002/p000437–p000443): kế thừa nhất quán B07–B09, trong thoại Tướng de Lugo xưng `chúng ta` (`p000438`) và sĩ quan thuộc cấp đáp `“Vâng, thưa Tướng quân.”` (`p000439`); trong trần thuật ngôi thứ ba quy chiếu de Lugo bằng `ông ta` (`p000441`, `p000442`), phe Cộng hòa bằng `họ` (`p000440`, `p000441`, `p000443`), và quân Đế quốc bị bao vây bằng `chúng` (`p000441`)"
  alternatives_vi:
  - "cô (thay cho `nó` trong trần thuật ngôi thứ ba quy chiếu Tanya tại chapter006_002/p000419–p000421, p000424, p000433 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / tôi (thay cho `mình` trong độc thoại nội tâm của Tanya tại chapter006_002/p000420, p000425–p000427, p000434–p000436 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / ông (thay cho `ông ta` khi quy chiếu Tướng de Lugo trong trần thuật tại chapter006_002/p000441, p000442 — ưu tiên `ông ta` để giữ liền mạch tuyệt đối với giọng trần thuật ngôi thứ ba đã khóa cho de Lugo tại B07–B09)"
