  proposed_vi: "tiểu đoàn, vòng vây, Being X (chapter006_002/p000418) / tòa án quân sự, bỏ chạy trước quân địch, Norden (chapter006_002/p000420–p000422, p000432) / đội xử bắn âm thầm (chapter006_002/p000421) / Đô đốc Byng (chapter006_002/p000422, p000423) / lực lượng chủ lực, Tướng von Romel (chapter006_002/p000424, p000428) / vừa đánh vừa rút lui (chapter006_002/p000427) / Trận Sekigahara, Đông quân và Tây quân (chapter006_002/p000428) / kokudaka, khí thế thượng võ (chapter006_002/p000429) / Oni-Shimazu, Gia tộc Shimazu (chapter006_002/p000430, p000431) / những đợt xung phong của Kellerman (chapter006_002/p000434) / Năm Thống nhất 1925, Doanh trại Lục quân Cộng hòa (chapter006_002/p000437) / Tướng quân, Tướng de Lugo (chapter006_002/p000439, p000442) / Cộng hòa, Đế quốc, binh lính Cộng hòa, mặt trận sông Rhine (chapter006_002/p000440, p000441) / cuộc tiến quân phân tán, lực lượng tập trung, bộ tham mưu (chapter006_002/p000441) / cuộc phản công, Lục quân Đế quốc, lục địa phía nam, Turus (chapter006_002/p000442, p000443)"
  alternatives_vi:
  - "rút lui chiến đấu (thay cho `vừa đánh vừa rút lui` tại chapter006_002/p000427 — ưu tiên `vừa đánh vừa rút lui` vì tự nhiên, rõ nghĩa trong mạch suy tư lịch sử quân sự của Tanya) / thạch cao (thay cho `*kokudaka*` tại chapter006_002/p000429 — ưu tiên giữ nguyên thuật ngữ tiếng Nhật in nghiêng `*kokudaka*` vì ngay phía sau trong câu đã có cụm bổ nghĩa giải thích theo sản lượng lúa gạo, đồng thời tránh nhầm lẫn âm đọc với khoáng vật thạch cao trong tiếng Việt hiện đại) / Quỷ Shimazu (thay cho `Oni-Shimazu` tại chapter006_002/p000430 — ưu tiên giữ `Oni-Shimazu` bám sát cách định danh biệt hiệu lịch sử trong nguồn và kết nối tự nhiên với câu hỏi nhận diện `*…Gia tộc Shimazu ư?*` ở `p000431`) / cuộc hành quân phân tán (thay cho `cuộc tiến quân phân tán` tại chapter006_002/p000441 — giữ `cuộc tiến quân phân tán` đồng bộ trực tiếp với mạch điểm nhìn của Tướng de Lugo đã khóa tại B09 `p000262`)"
