  proposed_vi: "Vương quốc Ildoa, Đế quốc, Cộng hòa, phạm vi ảnh hưởng (chapter005_004/p000142, p000143, p000146, p000164, p000166) / Khối Thịnh vượng chung (chapter005_004/p000144, p000158, p000160, p000161, p000162, p000166, p000167) / Quân đoàn Viễn chinh Lục địa phía Nam của Đế quốc (chapter005_004/p000146) / “đóng quân” (chapter005_004/p000147) / lục địa phía nam, một quân đoàn duy nhất gồm hai sư đoàn và một đơn vị hỗ trợ (chapter005_004/p000148, p000159, p000171) / Bộ Tổng tham mưu, lực lượng đồn trú của quân Cộng hòa (chapter005_004/p000149, p000153, p000171, p000174) / Lục quân Đế quốc (chapter005_004/p000150, p000153, p000161, p000168) / Tư lệnh Quân đoàn von Romel, Tư lệnh von Romel, Romel (chapter005_004/p000151, p000157, p000160, p000165) / khoảng lắng giao tranh, khoảng lắng (chapter005_004/p000152, p000156) / chiến tranh tổng lực (chapter005_004/p000155) / Quân đoàn Viễn chinh Lục địa phía Nam (chapter005_004/p000157) / các thuộc địa của Cộng hòa (chapter005_004/p000158) / chiến tranh cơ động, mặt trận Rhine (chapter005_004/p000161, p000171) / tác chiến cơ động giữa sa mạc (chapter005_004/p000162) / Tướng de Lugo, de Lugo (chapter005_004/p000163, p000165) / đòn nghi binh, Căn cứ Hải quân Turus (chapter005_004/p000165, p000167) / căn cứ tiếp tế (chapter005_004/p000167) / Quân đoàn Viễn chinh Lục địa phía Nam thuộc Lục quân Đế quốc (chapter005_004/p000168) / các phòng tuyến Rhine (chapter005_004/p000169) / Dacia (chapter005_004/p000171) / những kẻ bất đồng chính kiến phản chiến (chapter005_004/p000175)"
  alternatives_vi:
  - Quân đoàn Viễn chinh Nam Lục địa của Đế quốc / Quân đoàn Viễn chinh Nam Lục địa (thay cho `Quân đoàn Viễn chinh Lục địa phía Nam của Đế quốc` / `Quân đoàn Viễn chinh Lục địa phía Nam` tại chapter005_004/p000146, p000157, p000168 — ưu tiên `Quân đoàn Viễn chinh Lục địa phía Nam` vì khớp trực tiếp với địa danh `lục địa phía nam` đã khóa nhất quán xuyên suốt chương 5) / Quân cảng Turus (thay cho `Căn cứ Hải quân Turus` tại chapter005_004/p000165, p000167 — ưu tiên `Căn cứ Hải quân Turus` vì đồng bộ cấu trúc với `căn cứ hải quân Brest` ở chương 2 và đối xứng trực tiếp với `căn cứ tiếp tế` ở p000167) / phần tử bất đồng chính kiến phản chiến (thay cho `những kẻ bất đồng chính kiến phản chiến` tại chapter005_004/p000175 — ưu tiên `những kẻ bất đồng chính kiến phản chiến` vì phản ánh tự nhiên góc nhìn cảnh giác của Bộ Tổng tham mưu Đế quốc đối với nguy cơ kích động chống chiến tranh ở hậu phương)
