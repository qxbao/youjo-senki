- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000143
  locks:
  - "Giữ quan hệ nhân quả: `Và đó là lý do Vương quốc Ildoa lựa chọn liên minh với Đế quốc.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000144
  locks:
  - "Giữ cấu trúc phủ định `không mặc nhiên đồng nghĩa với việc họ bước vào tình trạng chiến tranh` và hai định danh `Cộng hòa và Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000145
  locks:
  - "Giữ giới hạn pháp lý của thỏa thuận: `việc giao chiến là tùy chọn; không có điều khoản nào cho thấy việc tham chiến là bắt buộc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000146
  locks:
  - "Giữ định danh đầy đủ `Quân đoàn Viễn chinh Lục địa phía Nam của Đế quốc`, `Vương quốc Ildoa` và trạng thái `chính thức giữ vị thế trung lập`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000147
  locks:
  - "Giữ dấu ngoặc kép quanh từ `“đóng quân”`, lý do `vì nể tình nước đồng minh` và sự tương phản khi phía `Đế quốc` không mấy nhanh chóng xúc tiến lời đề nghị ấy."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000148
  locks:
  - "Giữ nguyên nhân `Bởi xem nhẹ lục địa phía nam` và quy mô lực lượng `một quân đoàn duy nhất gồm hai sư đoàn và một đơn vị hỗ trợ`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000149
  locks:
  - "Giữ định danh `Bộ Tổng tham mưu`, cuộc tranh cãi về việc tung thêm quân và giả định quá khứ `chỉ riêng lực lượng đồn trú của quân Cộng hòa vốn thường xuyên được triển khai tại đó cũng đã có thể cầm cự được trước họ`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000150
  locks:
  - "Giữ dự đoán chung rằng các đơn vị Đế quốc sẽ tích lũy thêm sức chiến đấu, đánh giá `một quân đoàn nhỏ nhoi đơn độc` không tạo ra mối đe dọa quân sự đáng kể và nhận định về `ý nghĩa chính trị to lớn` của sự hiện diện `Lục quân Đế quốc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000151
  locks:
  - "Giữ danh xưng `Tư lệnh Quân đoàn von Romel`, cụm `Phân tích của giới quan sát` và hai mục đích chính trị `mở rộng tầm ảnh hưởng và thể hiện sự tôn trọng đối với đồng minh của Đế quốc`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000152
  locks:
  - "Giữ dự đoán `khoảng lắng giao tranh sẽ còn tiếp diễn trong tương lai gần`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000153
  locks:
  - "Giữ cụm `bộ phận thuộc Bộ Tổng tham mưu tham gia vào việc truyền đạt mệnh lệnh cho Lục quân Đế quốc` và trạng thái lưỡng lự liệu mặt trận này có thực sự nên được đặt làm ưu tiên hay không."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000154
  locks:
  - "Giữ nhận định `chẳng có lợi ích rõ ràng nào thu được từ việc phái quân tới đó`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000155
  locks:
  - "Giữ cấu trúc điều kiện giả định trái thực tế ở quá khứ và thuật ngữ `chiến tranh tổng lực`: `Nếu mục tiêu không phải là nhằm làm kẻ địch tiêu hao thêm nữa trong cuộc chiến tranh tổng lực này, thì việc điều động binh sĩ Đế quốc có lẽ thậm chí đã chẳng được đưa lên bàn nghị sự.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000156
  locks:
  - "Giữ kết luận `Theo nghĩa đó, dự đoán về một khoảng lắng là một phân tích hoàn toàn hợp lý.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000157
  locks:
  - "Giữ các định danh `Tư lệnh von Romel`, `Quân đoàn Viễn chinh Lục địa phía Nam` và bước ngoặt `ngay khoảnh khắc vừa đặt chân đến nơi, họ đã lập tức lao vào hành động`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000158
  locks:
  - "Giữ nhận định về `một vị tướng tài ba không bao giờ lãng phí thời gian` và việc các đơn vị `Khối Thịnh vượng chung` vừa tới bảo vệ `các thuộc địa của Cộng hòa` phải hứng chịu hậu quả nặng nề nhất."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000159
  locks:
  - "Giữ hình ảnh `Đội quân tân binh ấy vẫn chưa thực sự trải qua lửa đạn trên chiến trường` và suy nghĩ chủ quan rằng hai sư đoàn Đế quốc đóng quân trên `lục địa phía nam` chỉ vì mục đích chính trị."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000160
  locks:
  - "Giữ sự mất cảnh giác của `Khối Thịnh vượng chung` và kết quả các đơn vị Đế quốc dưới quyền `Tư lệnh von Romel` tóm gọn toàn bộ."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000161
  locks:
  - "Giữ các định danh `Lục quân Đế quốc`, `chiến tranh cơ động`, `Khối Thịnh vượng chung`, `mặt trận Rhine`, tương quan quân số địch đông hơn gấp nhiều lần và ưu thế áp đảo về `phẩm chất chiến đấu` nhờ phân nửa là binh lính tinh nhuệ từ mặt trận Rhine."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000162
  locks:
  - "Giữ cụm `một trận tác chiến cơ động giữa sa mạc`, `một đòn phủ đầu tàn khốc` và cảnh tháo chạy hỗn loạn của các đơn vị `Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000163
  locks:
  - "Giữ định danh `Tướng de Lugo` và nhận định về chiến lược đáp trả quá rõ ràng."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000164
  locks:
  - "Giữ đại từ `Ông ta`, định danh `Vương quốc Ildoa` / `phía Ildoa` và hai mặt hành động: gây sức ép chính trị đồng thời ngăn chặn chi viện đến tay phía Ildoa."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000165
  locks:
  - "Giữ phép so sánh `sự nhạy bén của Romel còn nhanh hơn sự khôn ngoan của de Lugo`, đại từ `ông` quy chiếu Romel, cùng chuỗi hành động `tung ra một đòn nghi binh, bất ngờ tập kích Căn cứ Hải quân Turus và đánh chiếm nơi này`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000166
  locks:
  - "Giữ tác động kép: vừa giành được một căn cứ không phụ thuộc vào `Vương quốc Ildoa`, vừa giáng đòn nặng nề vào mạng lưới hậu cần của `Cộng hòa và Khối Thịnh vượng chung`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000167
  locks:
  - "Giữ định danh `Căn cứ Hải quân Turus`, vai trò `căn cứ tiếp tế của Cộng hòa và Khối Thịnh vượng chung` và hệ lụy sâu rộng khi căn cứ thất thủ."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000168
  locks:
  - "Giữ định danh đầy đủ `Quân đoàn Viễn chinh Lục địa phía Nam thuộc Lục quân Đế quốc` và phản ứng cuồng nhiệt của người dân Đế quốc trước chuỗi thắng lợi liên tiếp."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000169
  locks:
  - "Giữ niềm tin của người dân rằng `Đế quốc` đã đánh bại `Cộng hòa` trên `các phòng tuyến Rhine` sau khi đổ vào đó một lượng tiền của và sinh mạng khổng lồ."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000170
  locks:
  - "Giữ nguy cơ người dân bắt đầu chán ghét chiến tranh nếu tiếp tục kéo dài cuộc chiến."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000171
  locks:
  - "Giữ các định danh `Bộ Tổng tham mưu`, `lục địa phía nam`, `Dacia` và `mặt trận Rhine`, cùng hiệu ứng chuỗi chiến thắng đẩy người dân vào cơn cuồng nhiệt."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000172
  locks:
  - "Giữ hình ảnh quân đội Đế quốc như thể bất khả chiến bại và việc công dân chuyển sang ủng hộ chiến tranh."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000173
  locks:
  - "Giữ dấu ba chấm mở đầu `…Kết quả là` và áp lực kỳ vọng quân đội phải lập nên nhiều chiến công hơn nữa."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000174
  locks:
  - "Giữ định danh `Bộ Tổng tham mưu`, nhận định `một sự tính toán sai lầm lớn` và giới hạn `Họ hoan nghênh điều đó ở chừng mực nó đồng nghĩa với việc nhận được sự ủng hộ để tiếp tục cuộc chiến.`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000175
  locks:
  - "Giữ cụm `những kẻ bất đồng chính kiến phản chiến` và nhận định không có dấu hiệu người dân chịu ảnh hưởng của lực lượng này."
