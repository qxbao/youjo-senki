  proposed_vi: "chỉ huy Kampfgruppe (chapter006_002/p000039) / Sở chỉ huy, Kampfgruppe Bảy (chapter006_002/p000040, p000044, p000045, p000047) / Thiếu tá von Leinburg, tần số sóng ngắn, đơn vị bạn (chapter006_002/p000041, p000050) / chuỗi chỉ huy, Đế quốc, kế nhiệm quyền chỉ huy (chapter006_002/p000042, p000043) / Thiếu tá von Degurechaff, các phòng tuyến (chapter006_002/p000044) / phó chỉ huy của Kampfgruppe Bảy (chapter006_002/p000047) / Quân đội Thịnh vượng chung – Cộng hòa (chapter006_002/p000054) / đạn bắn tỉa chống ma pháp 40 mm, súng trường công phá 40 mm, súng trường chống ma pháp (chapter006_002/p000055, p000058, p000059) / công thức gây nhiễu, lớp vỏ phòng thủ, màn chắn bảo hộ (chapter006_002/p000060, p000061, p000062) / Khối Thịnh vượng chung, Cộng hòa (chapter006_002/p000063) / Bắn chế áp (chapter006_002/p000065) / hệ thống phòng thủ vành đai (chapter006_002/p000066) / quân tuyến hai (chapter006_002/p000068)"
  alternatives_vi:
  - súng trường bắn tỉa phá khí tài 40 mm / súng trường chống khí tài 40 mm (thay cho `súng trường công phá 40 mm` tại chapter006_002/p000058 — ưu tiên `súng trường công phá 40 mm` vì là thuật ngữ quân sự tiếng Việt chuẩn xác, cô đọng để dịch định danh vũ khí cấp đại đội/bắn tỉa cỡ nòng lớn, đồng thời đoạn `p000059` ngay sau vẫn bảo toàn rõ chữ `khí tài` khi giải thích lý do nó được gọi phổ biến là `súng trường chống ma pháp`) / Liên quân Thịnh vượng chung – Cộng hòa (thay cho `Quân đội Thịnh vượng chung – Cộng hòa` tại chapter006_002/p000054 — ưu tiên `Quân đội Thịnh vượng chung – Cộng hòa` để bám sát cấu trúc danh ngữ ghép của nguồn mà không tự thêm sắc thái tổ chức liên minh chính thức) / phòng tuyến vành đai (thay cho `hệ thống phòng thủ vành đai` tại chapter006_002/p000066 — ưu tiên `hệ thống phòng thủ vành đai` vì khớp tự nhiên với vị ngữ chỉ cơ chế vận hành ở câu kế tiếp)
