- source_term: tanya_pov_monologue_and_combat_register_vol03_ch06_b02
  proposed_vi: "Trần thuật ngôi thứ ba theo điểm nhìn Tanya: quy chiếu Tanya bằng `nó` nhất quán xuyên suốt (chapter006_002/p000046–p000053, p000067–p000068); độc thoại nội tâm ngôi thứ nhất trực tiếp của Tanya dùng `mình` và số nhiều bao gộp đơn vị dùng `chúng ta` (chapter006_002/p000056, p000064, p000066); chủ thể khái quát dùng `người ta` (chapter006_002/p000042, p000061) / Lời thoại tại sở chỉ huy dã chiến và dưới làn đạn bắn tỉa: nhân viên điện đài báo cáo mệnh lệnh từ sở chỉ huy dùng `Họ` – gọi `Thiếu tá von Degurechaff` (chapter006_002/p000040, p000044); Tanya đáp nhận lệnh ngắn gọn `Degurechaff, rõ.` và gọi nhân viên thông tin là `Anh` (chapter006_002/p000045); tiếng hô cảnh báo bắn tỉa và mệnh lệnh bắn chế áp giữ nhịp dứt khoát, khẩn cấp (chapter006_002/p000055, p000065)"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật về Tanya tại chapter006_002/p000046–p000053, p000067–p000068 — không chọn vì trái với quy ước đã duyệt `DEC-P01-001`) / cậu (thay cho `anh` khi Tanya nói với nhân viên điện đài tại chapter006_002/p000045 — ưu tiên `anh` vì giữ giọng công vụ quân sự trung tính khi nguồn chưa nêu tuổi tác hay cấp bậc cụ thể của nhân viên thông tin)
