  rationale: "Kế thừa đồng bộ các lựa chọn tạm đã khóa từ B01 và các tập trước (`Kampfgruppe Bảy`, `Thiếu tá von Leinburg`, `Thiếu tá von Degurechaff`, `chuỗi chỉ huy`, `tần số sóng ngắn`, `công thức gây nhiễu`, `màn chắn bảo hộ`, `lớp vỏ phòng thủ`, `Khối Thịnh vượng chung`, `Cộng hòa`); khóa tạm bộ thuật ngữ vũ khí – chiến thuật mới xuất hiện trong lô gồm `Quân đội Thịnh vượng chung – Cộng hòa` (`p000054`), `đạn bắn tỉa chống ma pháp 40 mm` / `súng trường công phá 40 mm` / `súng trường chống ma pháp` (`p000055`, `p000058`, `p000059`), `hệ thống phòng thủ vành đai` (`p000066`) và `quân tuyến hai` (`p000068`)."
