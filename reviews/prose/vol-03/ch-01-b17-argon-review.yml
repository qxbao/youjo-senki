locked_choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000250
  locks:
  - "Giữ đại từ độc thoại nội tâm “mình” theo DEC-P01-001, thuật ngữ “sở chỉ huy”, “các đơn vị tác chiến” và suy tính cảnh giác không bám vào ảo tưởng lạc quan để tránh rơi vào vòng vây."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000251
  locks:
  - "Giữ đại từ “chúng ta”, định danh “Lục quân Cộng hòa” và hành động xả hết hỏa lực như món quà chia tay rồi vọt ra khỏi tòa nhà."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000252
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*Rotten*` theo DEC-P01-002, chủ thể “Tanya” và sự sốt ruột khi phải mất thời gian bọc lót đề phòng truy kích."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000253
  locks:
  - "Giữ lời báo cáo lễ độ “Thưa Thiếu tá, Trung úy Weiss báo rằng địa điểm C cũng không phải ạ.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000254
  locks:
  - "Giữ tiếng chửi cảm thán “Chết tiệt.”, đại từ “Chúng ta” / “anh ta” và chỉ thị bảo Weiss bằng mọi giá phải xử lý xong địa điểm B trong khi toán của Tanya tìm cách giải quyết địa điểm A."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000255
  locks:
  - "Giữ câu đáp điều lệnh ngắn gọn: “Rõ.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000256
  locks:
  - "Giữ diễn biến quân địch bắt đầu phản kích hơi muộn và câu cảm thán tiếc rẻ giá mà chúng chịu ngồi yên thêm vài phút nữa."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000257
  locks:
  - "Giữ đối sánh với “chiến hào và vùng đất không người” ngoài tiền tuyến, quan sát của “Tanya” rằng lính địch nấp sau các tòa nhà chứ không phải đất cát, và câu nội tâm in nghiêng `*Hãy tin tưởng vào lớp vỏ phòng thủ cùng màn chắn bảo hộ của chúng ta và thiêu rụi nơi này thành bình địa nào!*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000258
  locks:
  - "Giữ đại từ “Tôi” / “chúng ta”, thuật ngữ “thuật thức hóa hơi nổ” và mệnh lệnh bắn ba loạt 360 độ xung quanh."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000259
  locks:
  - "Giữ câu thốt lên bàng hoàng nhưng vẫn có tiểu từ lễ độ của Serebryakov: “Chúng ta sẽ bị nướng sống mất ạ!”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000260
  locks:
  - "Giữ định danh “Thiếu úy Serebryakov”, đại từ “cô ấy”, thuật ngữ “thuật thức hóa hơi nổ” và nhận định việc thi triển thuật thức giữa vòng vây các tòa nhà chẳng khác nào tự châm lửa đốt chính mình."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000261
  locks:
  - "Giữ lời quát đáp trả của “Tanya” với “cô ấy” kèm nụ cười thách thức rằng binh lính địch sẽ bị nướng chín trước."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000262
  locks:
  - "Giữ định danh “Thiếu úy Serebryakov”, đại từ nội tâm “mình” theo DEC-P01-001 và hành động kiến tạo “thuật thức” ngay sau Tanya không chút đắn đo."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000263
  locks:
  - "Giữ đối sánh hài hước rằng “pháp sư” khó bắt lửa hơn “bộ binh” và câu cảm thán “Muôn năm khả năng chống cháy.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000264
  locks:
  - "Giữ thuật ngữ “Các thuật thức”, chủ thể “Tanya” và cảnh thiêu đốt toàn bộ khu vực theo mọi phương hướng."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000265
  locks:
  - "Giữ đại từ “chúng ta” / “mình” theo DEC-P01-001 và nhận định lửa lan hơi nhanh nhưng nhờ lính Cộng hòa hoảng loạn không chú ý nên đây là một pha xử lý tốt."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000266
  locks:
  - "Giữ đại từ phản thân “mình”, chủ thể “Tanya” và hành động tận dụng lúc không có sức kháng cự để tiếp tục tiến lên."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000267
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001 và cảnh bay vọt ra khỏi biển lửa cùng các thuộc cấp bám theo sau."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000268
  locks:
  - "Giữ đại từ “chúng ta” và suy luận rằng trên chính quê nhà của binh lính Cộng hòa thì chẳng có mấy kẻ đủ gan bắn ngay vào người đang tháo chạy khỏi đám cháy."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000269
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Tất nhiên, thực tế đúng là chúng ta đang chạy trốn một nửa thật, nên màn diễn của chúng ta cũng gần như là sự thật rồi*` theo DEC-P01-002 và chủ thể “Tanya”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000270
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, định danh “Lục quân Cộng hòa” và nhận định đối phương hoàn toàn không lường trước cuộc tấn công."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000271
  locks:
  - "Giữ đại từ “chúng ta” và sự tương phản giữa dự tính gặp địch tác chiến có tổ chức với thực tế hỗn loạn đầy may rủi, chỉ có vài cá nhân gan dạ tự ý kháng cự một cách chắp vá và cực kỳ thiếu tổ chức."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000272
  locks:
  - "Giữ giả định trái thực tế về “chiến tuyến Rhine”, đại từ “chúng ta” / “mình” theo DEC-P01-001 và câu nhận xét mỉa mai về sự khác biệt văn hóa ở căn cứ hậu phương."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000273
  locks:
  - "Giữ khẩu lệnh vô tuyến của Tanya: “01 gọi tất cả các đơn vị. Mục tiêu A đã bị phá hủy. Hết giờ rồi. Báo cáo tình hình đi.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000274
  locks:
  - "Giữ lời báo cáo xác nhận tấn công mục tiêu B thành công và đó chính là mục tiêu cần tìm."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000275
  locks:
  - "Giữ thuật ngữ “sở chỉ huy”, đại từ “chúng ta” và suy luận rằng B là sở chỉ huy còn C là kho bãi nên địch sẽ rối loạn và không biết hướng rút lui ngay cả khi điều động khẩn cấp các đơn vị lân cận."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000276
  locks:
  - "Giữ mệnh lệnh rút lui hết tốc lực về phía bắc và bật “tín hiệu dẫn đường” sau mười phút nữa."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000277
  locks:
  - "Giữ đại từ nội tâm “Mình” / “mình” và “chúng ta” theo DEC-P01-001, phương án để tàu ngầm đón và việc báo cáo chiến quả lên “Bộ Tổng Tham mưu”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000278
  locks:
  - "Giữ đại từ nội tâm “mình” theo DEC-P01-001 cùng lời phàn nàn làm việc vượt quá xa mức lương, mong có tiền thưởng hậu hĩnh và phải đề xuất trao huân chương cho thuộc cấp."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000279
  locks:
  - "Giữ nguyên dòng tiêu đề thời gian - địa điểm viết hoa: “NGÀY 25 THÁNG 5, NĂM THỐNG NHẤT 1925, KHỐI THỊNH VƯỢNG CHUNG, WHITEHALL”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000280
  locks:
  - "Giữ định danh “Khối Thịnh vượng chung” và nguyên tắc địa chính trị tuyệt đối không thể chấp nhận sự ra đời của một siêu cường không có đối thủ trên lục địa."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000281
  locks:
  - "Giữ định danh “Khối Thịnh vượng chung” và nhận định đó là nền tảng trong chính sách đối ngoại."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000282
  locks:
  - "Giữ định danh “Đế quốc”, thuật ngữ “quyền tự quyết của các dân tộc” và sự đối lập giữa thái độ cảm thông ngoài mặt với nỗi bất an bên trong của nhóm chính khách trước các quốc gia quá hùng mạnh."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000283
  locks:
  - "Giữ đại từ trung tính “ông ta”, định danh “Khối Thịnh vượng chung”, thuật ngữ “Thượng đế” và góc nhìn xem sự trỗi dậy của Đế quốc như lời thách thức đối với vận mệnh của quốc gia được Thượng đế chọn lựa."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000284
  locks:
  - "Giữ định danh “Đế quốc”, đại từ “ông ta” và cảnh nhân vật run lên vì giận dữ khi hình dung ra kịch bản tồi tệ nhất lúc Đế quốc bắt đầu nhe nanh táp vào các cường quốc khác để phá vỡ vòng vây lỏng lẻo."
