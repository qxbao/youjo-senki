locked_choices:
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000093
  locks:
  - "Giữ kết luận khái quát mở đầu “Nói cách khác, bất cứ thứ gì cũng có thể trở nên hữu ích tùy thuộc vào cách sử dụng.” nối tiếp trực tiếp mạch lập luận cuối lô b04."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000094
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng đúng ở hai cụm `*Chuyện đó là bất khả thi*` và `*Không thể làm được đâu*` theo DEC-P01-002, đại từ trần thuật “Nó” và tự quy chiếu “mình” theo DEC-P01-001, cùng thái độ sẵn sàng tự vấn lại các kết luận cá nhân trước khi bất đồng với người khác."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000095
  locks:
  - "Giữ quan hệ đối lập “Thế nhưng”, đại từ “nó” / “mình” theo DEC-P01-001, hình ảnh “nhìn chằm chằm vào vật thể khổng lồ trước mặt bằng đôi mắt cá chết” và dấu nhấn mạnh chữ nghiêng đúng ở câu hỏi không lời giải `*Sao chuyện lại ra nông nỗi này?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000096
  locks:
  - "Giữ câu hỏi tu từ “Gã nhà khoa học điên rồ nào lại có khả năng thuyết phục lục quân phê chuẩn một ý tưởng điên khùng đến thế?”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000097
  locks:
  - "Giữ câu trích dẫn trong ngoặc kép “Một đại đội sẽ được phóng đi bằng tên lửa do người dẫn đường, mật danh V-1.”, tên riêng “Zettour”, “Rudersdorf”, “Schugel”, định danh “Lục quân Đế quốc”, và dấu nhấn mạnh chữ nghiêng chỉ ở đại từ `*hắn*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000098
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng ở đúng câu rủa `*Xuống địa ngục đi, Schugel, đồ rác rưởi!*` theo DEC-P01-002 và phần trần thuật “Tanya chỉ muốn gào lên như thế khi nhớ đến gã đàn ông đó.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000099
  locks:
  - "Giữ giả định trái thực tế ở quá khứ “Lẽ ra mình nên giết quách hắn ngay trong những buổi thử nghiệm kích hoạt đó bằng một thuật thức lạc hoặc một “tai nạn” quả cầu tính toán mới phải.”, đại từ độc thoại “mình” theo DEC-P01-001, định danh “Being X” và vế tự sửa “Ngay cả khi hắn là con rối đáng thương đã bị ô nhiễm tâm lý của Being X—hay đúng hơn là chính vì thế—lẽ ra ai đó nên giết hắn sớm hơn, vào lúc hắn vẫn còn giữ được chút nhân phẩm.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000100
  locks:
  - "Giữ sự tự hiệu chỉnh điểm nhìn giữa ngôi thứ nhất và tên riêng “Lý do tại sao mình—hay đúng hơn, tại sao Tanya—lại bị cảm xúc cuốn đi và không thể nguôi ngoai cho đến khi bắn chết Schugel vô số lần trong tâm trí thật ra rất đơn giản.” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000101
  locks:
  - "Giữ đại từ trần thuật “Nó” / “nó” theo DEC-P01-001, các chi tiết “chỉ huy của một tiểu đoàn đang trên bờ vực tan rã vì vô số thương vong hứng chịu trong quá trình làm nhiệm vụ đoạn hậu”, “một căn cứ phe ta ở hậu phương”, sự đối lập giữa niềm háo hức mong chờ được khoản đãi với thực tế nhận ngay chiến dịch mới kèm trang thiết bị mới phát triển và bị tống tới chiến trường nguy hiểm bên trong “một thứ vũ khí đầy bất trắc”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000102
  locks:
  - "Giữ đầy đủ cấp bậc và tên riêng “Thiếu tá Tanya von Degurechaff”, đại từ “mình” / “nó” theo DEC-P01-001 và nhận định không phải kiểu người thích thú với việc phóng vút đi trong một quả tên lửa khổng lồ."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000103
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, sự chán ngán các nhiệm vụ nguy hiểm và lý do phải thực hiện hết chiến dịch lố bịch này đến chiến dịch lố bịch khác nhằm bù đắp rủi ro chỉ vì các kế hoạch đó “khả thi về mặt lý thuyết”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000104
  locks:
  - "Giữ đại từ độc thoại “mình” theo DEC-P01-001, thuật ngữ “các nguyên lý của Heinrich”, quy luật tai nạn có nguy cơ xảy ra thì ắt sẽ xảy ra, cùng tên các phần thưởng quân sự “Huy hiệu Đột kích Cánh bạc”, “Huy hiệu Đột kích Cánh bạc đính Lá sồi”, “Thập tự Bạch kim đính Kiếm vàng” và phủ định kép “không thể phủ nhận rằng những rủi ro đã được ghi nhận thỏa đáng”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000105
  locks:
  - "Giữ hình ảnh “nỗi giằng xé nội tâm đầy thống khổ của Tanya” và nguyên tắc của “Một con người của thế giới hiện đại không thể vô cớ chối bỏ nhiệm vụ khi được trọng vọng đến nhường ấy và được trao tặng huân huy chương vì những đóng góp của mình.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000106
  locks:
  - "Giữ đại từ nội tâm “mình” theo DEC-P01-001, các khái niệm “hợp đồng và sự tín nhiệm” và nhận định “Phản bội lại phẩm giá của chính mình về bản chất cũng là một hình thức tự sát.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000107
  locks:
  - "Giữ tiền đề “Trong một tình thế mà việc sơ tán khẩn cấp là điều không tưởng” và kết luận “lựa chọn thực tế duy nhất của Tanya là trung thành tuân theo mệnh lệnh.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000108
  locks:
  - "Giữ lời tự nhủ trong ngoặc kép dùng đại từ “Mình” (“Mình phải làm thôi. Nếu đã phải làm, thì mình phải thành công.”), định danh “Cộng hòa” và đại từ trần thuật “nó” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000109
  locks:
  - "Giữ đại từ “Nó” / “mình” theo DEC-P01-001 và cách dịch trung tính “có người đã bước tới bên cạnh cho đến khi người đó cất tiếng” cho chủ thể chưa lộ danh tính."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000110
  locks:
  - "Giữ đại từ trần thuật “nó” / “mình” theo DEC-P01-001 và lời tự khích lệ trong ngoặc kép “Mình phải làm thôi. Mình chỉ còn cách phải làm thôi. Mình không thể làm hỏng nhiệm vụ này được.”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000111
  locks:
  - "Giữ đại từ độc thoại nội tâm “Mình” / “mình” theo DEC-P01-001, thuật ngữ “nền kinh tế thị trường”, định danh “Being X”, hình ảnh “đập nát từng bức thần tượng cuối cùng mà mình tóm được” và quyết tâm “không thể chết trước lúc đó được”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000112
  locks:
  - "Giữ lời gọi cấp bậc kèm họ “…Thiếu tá von Degurechaff” và đại từ “cô” lịch sự của cấp trên khi bắt chuyện với Tanya."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000113
  locks:
  - "Giữ thuật ngữ “Phản xạ có điều kiện” và đại từ trần thuật “nó” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000114
  locks:
  - "Giữ giọng thoại lễ độ chuẩn điều lệnh của cấp dưới đối với cấp trên: “A, xin thứ lỗi cho tôi. Tất nhiên rồi, thưa Đại tá von Lergen. Có chuyện gì vậy ạ?”."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000115
  locks:
  - "Giữ đại từ “ông” quy chiếu Đại tá von Lergen, đại từ “nó” / “mình” quy chiếu Tanya theo DEC-P01-001, động tác lùi lại một bước đưa tay lên vành mũ chào chuẩn mực và chi tiết não bộ quay hết tốc lực cố nhớ xem có lỡ lời nói hớ điều gì không nên nói hay không."
- segment_id: YS-LN03/Text/chapter001_002.xhtml/p000116
  locks:
  - "Giữ đại từ trần thuật “Nó” theo DEC-P01-001, chi tiết chỉ lẩm bẩm hai câu trên đường băng và nhận định tự trấn an ở cuối đoạn."
