- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000763
  locks:
  - "Giữ định danh “de Lugo”, đại từ “Ông” và mục tiêu tập hợp toàn bộ binh lực còn lại nhằm chuẩn bị cho cuộc phản công, muốn có được từng người lính mà mình có thể gom góp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000764
  locks:
  - "Giữ đại từ “ông” và hình ảnh đối mặt với nỗi ám ảnh muôn thuở của mọi vị chỉ huy là thời gian."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000765
  locks:
  - "Giữ vế tương phản “Một mặt”, quan hệ tỷ lệ thuận giữa thời gian kéo dài với nguy cơ kế hoạch bị rò rỉ và giả định nếu chuyện đó xảy ra thì lực lượng vốn sẽ trở thành hạt nhân cho “đạo quân kháng chiến” của ông có thể bị tấn công."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000766
  locks:
  - "Giữ vế tương phản “Mặt khác”, đại từ “ông” và việc xét đến tác động tâm lý của chuyện bỏ rơi các đồng minh đang cấp tốc kéo tới hội quân khiến ông không thể rời đi dễ dàng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000767
  locks:
  - "Giữ nhận định “Lẽ dĩ nhiên, quyết định này hết sức cấp bách.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000768
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu, thuật ngữ “đội đặc nhiệm” và hai câu hỏi liên tiếp về tình hình cùng thời điểm đến nơi của họ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000769
  locks:
  - "Giữ cấu trúc nhấn mạnh chính trong hoàn cảnh ngặt nghèo đó mà “de Lugo” đang ngóng đợi “đội đặc nhiệm tinh nhuệ”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000770
  locks:
  - "Giữ các định danh “pháp sư”, “Tướng de Lugo”, “Trung tá Vianto”, “Arene” và kỳ vọng sức mạnh cùng kinh nghiệm của những người sống sót sau trận Arene sẽ là sự trợ giúp to lớn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000771
  locks:
  - "Giữ định danh “Bộ Tổng tham mưu”, câu điều kiện nếu những pháp sư đó xoay xở hội quân được với những người còn lại thì số lượng phương án trong tay họ sẽ tăng lên đáng kể, cùng vế tương phản rằng việc chờ đợi tiềm ẩn rủi ro."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000772
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thời gian dự kiến khoảng mười tiếng nữa, địa danh “Parisii”, khả năng đang bị truy kích và dấu chấm lửng cuối câu."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000773
  locks:
  - "Giữ định dạng chữ nghiêng toàn đoạn `*...*` theo DEC-P01-002, dấu chấm lửng mở đầu, đại từ “chúng ta”, định danh “quân Đế quốc” và kịch bản tệ nhất nếu họ đang bị bám đuôi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000774
  locks:
  - "Giữ định dạng chữ nghiêng toàn đoạn `*...*` theo DEC-P01-002, đại từ “chúng ta” và hệ quả mọi công sức từ trước đến giờ sẽ đổ sông đổ bể cả."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000775
  locks:
  - "Giữ đúng câu hỏi chữ nghiêng `*Chúng ta có nên bỏ họ lại không?*` ở giữa đoạn theo DEC-P01-002, cùng các câu trần thuật chữ thường nêu khả năng đáng sợ không thể chấp nhận được và quan điểm của một số sĩ quan tham mưu, đặc biệt là các sĩ quan thuộc hạm đội."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000776
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu, quyết định khởi hành sau mười tiếng nữa, câu hỏi xác nhận khả năng các pháp sư đuổi kịp trên mặt biển và mệnh lệnh tranh thủ bốc xếp lên tàu nhiều nhất có thể."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000777
  locks:
  - "Giữ câu đáp ngắn gọn trong ngoặc kép “Rõ.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000778
  locks:
  - "Giữ định danh “de Lugo” và quyết định chờ đợi đến tận giây phút cuối cùng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000779
  locks:
  - "Giữ đại từ “Ông”, hình ảnh canh bạc đẩy cả không gian khoang hàng lẫn thời gian tới giới hạn, sự thừa nhận rủi ro cao nhưng khẳng định các pháp sư là tài sản quý giá giúp gia tăng đáng kể hỏa lực của “lực lượng kháng chiến” về sau."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000780
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi chuyển trọng tâm sang tuyến hải trình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000781
  locks:
  - "Giữ dấu ngoặc kép hội thoại, phiên hiệu “Hạm đội Hộ tống số Hai” và thông tin toàn tuyến đều thông suốt và an toàn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000782
  locks:
  - "Giữ câu ngắn “Và tối quan trọng hơn cả là…” cùng dấu chấm lửng ở cuối."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000783
  locks:
  - "Giữ các định danh “Đế quốc”, “Hải quân Đế quốc”, “Hải quân Cộng hòa” và thế tương phản giữa sự tự tin của Hải quân Đế quốc rằng đã chế áp được Hải quân Cộng hòa với thực tế điều đó chỉ miễn cưỡng đúng trong một số hoàn cảnh nhất định."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000784
  locks:
  - "Giữ định danh “Đế quốc” và ý họ vẫn còn đủ thực lực để chứng minh tấn công trực diện không phải là cách duy nhất để một lực lượng hải quân giao chiến."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000785
  locks:
  - "Giữ các định danh “Hải quân Đế quốc”, “Khối Thịnh vượng chung”, “Cộng hòa”, thuật ngữ trong ngoặc kép “hạm đội hiện hữu” và nhận định khó hình dung cảnh họ kéo ra khơi đánh một trận quyết chiến."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000786
  locks:
  - "Giữ các định danh “Hải quân của Khối Thịnh vượng chung”, “de Lugo”, “Quân đội Đế quốc” và nhận định khi có Hải quân Khối Thịnh vượng chung đứng về phía mình thì de Lugo cùng đồng minh sẽ giành phần thắng, còn quân đội Đế quốc không có nhiều sự linh hoạt chiến lược."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000787
  locks:
  - "Giữ dấu ngoặc kép hội thoại, phiên hiệu “Phân đội Tàu ngầm Độc lập số Mười Bốn” và nội dung điện báo không phát hiện địch, tuyến hải trình thông suốt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000788
  locks:
  - "Giữ định danh “Lục quân Đế quốc”, câu phủ định giả định không đời nào những con tàu chất đầy vật tư tiếp tế được phép thoát đi nếu bị phát hiện, và nhận định hiện tại chưa có dấu hiệu cản trở nào."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000789
  locks:
  - "Giữ định danh “quân Đế quốc”, đại từ “Ông” và chuỗi suy luận rằng có thể mất một lúc lâu nữa họ mới nhận ra, nhưng một khi chiến dịch rút thoát bắt đầu thì họ sẽ phát hiện và truy kích vô cùng quyết liệt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000790
  locks:
  - "Giữ đại từ “Ông”, thuật ngữ “tổ quốc” và ý chỉ có một cơ hội duy nhất, đặt cược tương lai của tổ quốc vào phi vụ mạo hiểm này."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000791
  locks:
  - "Giữ dấu gạch ngang trong câu khẳng định khoảnh khắc lệnh ngừng bắn được ban bố chính là cơ hội của họ, cùng hai điều kiện quyết định sự thành bại của chiến dịch."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000792
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các định danh “Khối Thịnh vượng chung”, “Hải quân Khối Thịnh vượng chung” và từ ‘tập trận’ trong dấu nháy đơn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000793
  locks:
  - "Giữ hai câu hỏi nối tiếp “Bọn họ là lũ ngốc ư? Hay đó chỉ là chuyện thường tình như mọi khi?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000794
  locks:
  - "Giữ các định danh “Hạm đội bản thổ của Khối Thịnh vượng chung”, “Đế quốc”, “de Lugo”, cụm “huấn luyện đột xuất” trong ngoặc kép và chi tiết tập trận khẩn cấp ngay sát rìa lãnh hải làm phân tán hoàn toàn sự chú ý của hạm đội, không quân và pháp sư Đế quốc, giúp de Lugo rảnh tay hành động."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000795
  locks:
  - "Giữ định danh “Đế quốc” và hai căn cứ cho thấy Đế quốc chưa nhận ra tình hình: không có rắc rối gây tổn hại cho các con tàu đã tập hợp và không có báo cáo về trinh sát Đế quốc hay kẻ khả nghi quanh căn cứ hải quân."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000796
  locks:
  - "Giữ đại từ “Ông” và thế tương phản giữa việc không muốn nói trước bước không qua với nhận định tình hình không đến nỗi quá tuyệt vọng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000797
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu và câu nói “…Thật tốt khi họ đã hỗ trợ.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000798
  locks:
  - "Giữ câu thoại khích lệ “Hãy vượt qua chuyện này rồi trả đũa.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000799
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh “Khối Thịnh vượng chung”, đại từ “tôi” và ý quyết tâm chiến đấu tới cùng dù phải nuốt thứ đồ ăn dở tệ của Khối Thịnh vượng chung, nóng lòng chờ cuộc phản công từ phương nam."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000800
  locks:
  - "Giữ đại từ “ông”, các định danh “tổ quốc”, “Đế quốc” và quyết tâm dù phải tạm thời nhượng lại tổ quốc cho Đế quốc nhưng rốt cuộc sẽ giành lại mảnh đất đã nuôi dưỡng mình."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000801
  locks:
  - "Giữ câu thoại “Chà, tất cả bắt đầu từ đây.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000802
  locks:
  - "Giữ câu ngắn “Quyết tâm của ông vô cùng vững vàng.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000803
  locks:
  - "Giữ đại từ “ông”, định danh “Đế quốc” và thế nhượng bộ dù đang kìm nén cảm xúc nhưng giọng nói vẫn tràn ngập khí thế quyết chiến với Đế quốc đến cùng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000804
  locks:
  - "Giữ cấp hàm và họ “Thiếu tướng de Lugo” cùng lời khẳng định ông là một người yêu nước."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000805
  locks:
  - "Giữ nhịp điệp ba câu với đại từ “Ông”, phân biệt rõ “đất nước mình”, “tổ quốc mình” và “vinh quang của đất nước mình”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000806
  locks:
  - "Giữ câu điều kiện khép lại chương: “Nếu Cộng hòa không còn vĩ đại nữa, thì đó không còn là Cộng hòa nữa.”."
