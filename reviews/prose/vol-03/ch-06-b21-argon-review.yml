  proposed_vi: "Type 95, Type 97, Elinium Arms, quả cầu chính đáng tin cậy, Elinium Type 97 (chapter006_002/p000668, p000673, p000674) / Đế quốc, lính Cộng hòa, thuộc địa, Thượng đế (chapter006_002/p000671, p000672, p000683, p000698) / cuộc săn vịt, cuộc bắn gà tây (chapter006_002/p000675, p000686) / tiểu đoàn, vòng vây, quân bạn, quân tiếp viện của địch, lực lượng chủ lực (chapter006_002/p000676–p000678, p000680) / đòn đánh chống mục tiêu mặt đất (chapter006_002/p000679, p000681) / Lục quân Đế quốc Nhật Bản (chapter006_002/p000680) / pháp sư, số mạng bắn hạ, khai khống thành tích, mặt trận Rhine, hồ sơ thành tích (chapter006_002/p000682–p000685, p000690) / Thế chiến thứ hai, bọn Nga, mặt trận phía đông, quân Mỹ hay quân Anh, mặt trận phía tây (chapter006_002/p000688) / gia tốc tối đa, đạo luật chống kẻ bám đuôi (chapter006_002/p000692) / *tsurinobuse*, chế độ Shimazu giả tạo, mồi nhử (chapter006_002/p000693, p000694, p000698, p000699) / Fairy 01 gọi 02 và 05 (chapter006_002/p000699)"
  alternatives_vi:
  - "đòn tập kích mặt đất (thay cho `đòn đánh chống mục tiêu mặt đất` tại chapter006_002/p000679, p000681 — giữ `đòn đánh chống mục tiêu mặt đất` để đồng bộ trực tiếp với đề xuất đã khóa tại `vol02-ch01-b07-anti-surface-strikes`) / phục kích nhử mồi kiểu Shimazu (thay cho `*tsurinobuse*` tại chapter006_002/p000693 — ưu tiên giữ nguyên thuật ngữ chiến thuật tiếng Nhật in nghiêng `*tsurinobuse*` theo đúng hình thức của nguồn và kết nối tự nhiên với câu giải thích `chế độ Shimazu giả tạo` ngay ở đoạn `p000694`)"
