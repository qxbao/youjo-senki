  volume: vol-03
  chapter: 6
  rationale: "Kế thừa đồng bộ toàn bộ hệ thuật ngữ đã khóa từ các quyển và batch trước (`Type 95`, `Type 97`, `Elinium Arms`, `Elinium Type 97`, `Đế quốc`, `Cộng hòa`, `Thượng đế`, `đòn đánh chống mục tiêu mặt đất`, `mặt trận Rhine`, `cuộc bắn gà tây`, `Thế chiến thứ hai`, `Fairy 01 gọi 02 và 05`), đồng thời khóa tạm cách dịch tự nhiên, chuẩn xác cho các thuật ngữ quân sự – lịch sử và ẩn dụ chiến thuật trong lô (`cuộc săn vịt`, `Lục quân Đế quốc Nhật Bản`, `số mạng bắn hạ`, `khai khống thành tích`, `bọn Nga`, `gia tốc tối đa`, `*tsurinobuse*`, `chế độ Shimazu giả tạo`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_dual_perspective_and_203rd_radio_register_vol03_ch06_b21
  proposed_vi: "Trong trần thuật và độc thoại nội tâm đan xen của Tanya (`p000668`–`p000670`, `p000672`, `p000674`, `p000676`–`p000685`, `p000688`, `p000690`–`p000692`, `p000694`, `p000695`, `p000697`, `p000698`): tuân thủ nghiêm ngặt `DEC-P01-001`, quy chiếu ngôi thứ ba Thiếu tá Tanya von Degurechaff bằng `nó` (`p000668`, `p000669`, `p000672`, `p000690`, `p000697`, `p000698`) và tự quy chiếu ngôi thứ nhất trong độc thoại nội tâm bằng `mình` (`p000668`–`p000670`, `p000672`, `p000676`, `p000681`–`p000685`, `p000690`, `p000692`, `p000694`, `p000695`); khi gộp chung toàn tiểu đoàn dùng `chúng ta` / `đơn vị ta` (`p000676`, `p000678`–`p000681`, `p000684`, `p000691`, `p000692`, `p000694`, `p000695`); trong lời giễu nhại giả định từ đồng nghiệp nhắm vào Tanya tại `p000684` dùng `Cô` – `mình`. Trong hội thoại và liên lạc vô tuyến giữa Tanya và thuộc cấp Tiểu đoàn 203 (`p000671`, `p000673`, `p000675`, `p000686`, `p000687`, `p000689`, `p000693`, `p000696`, `p000699`): kế thừa liền mạch `ch-06-b20`, thuộc cấp đáp lễ phép `Vâng, thiếu tá nói phải.` (`p000687`), Tanya gọi chung toàn đơn vị là `Các vị` (`p000693`), gọi hai chỉ huy đại đội `02` và `05` là `Các anh` (`p000699`), và cả hai phía gọi quân Cộng hòa truy kích là `chúng` / `lũ gớm ghiếc này` / `lũ hề đó`"
  alternatives_vi:
  - "cô (thay cho `nó` khi quy chiếu Tanya ở ngôi thứ ba trong trần thuật tại `p000668`, `p000669`, `p000672`, `p000690`, `p000697`, `p000698` — bắt buộc giữ `nó` theo quyết định canon `DEC-P01-001`) / tôi (thay cho `mình` trong độc thoại nội tâm tự quy chiếu của Tanya — bắt buộc giữ `mình` theo `DEC-P01-001`, chỉ dùng `tôi` – `chúng tôi` trong lời phát biểu giả định của sĩ quan Lục quân Đế quốc Nhật Bản tại `p000680`)"
