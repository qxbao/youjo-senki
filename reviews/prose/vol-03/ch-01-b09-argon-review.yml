locked_choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000002
  locks:
  - "Giữ đại từ ngôi thứ nhất số nhiều “chúng ta”, hình ảnh được vận chuyển tới không phận phía trên đích đến cùng các thùng nhiên liệu và phép so sánh với những phi hành gia thời kỳ đầu chỉ đi quá giang theo chuyến bay."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000003
  locks:
  - "Giữ cấu trúc đối lập phủ định rằng khác với những phi hành gia thời kỳ đầu, “chúng ta” không thể kỳ vọng màn chào đón nồng nhiệt từ các đồng nghiệp tay ôm bó hoa sau khi hạ cánh thành công."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000004
  locks:
  - "Giữ tương phản không phải quay về Trái Đất nơi đội ngũ hỗ trợ thấp thỏm chờ đón tại điểm đáp dự kiến, mà là lao vào cái ổ của “những chú ốc sên thân mến” đang sục sôi địch ý."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000005
  locks:
  - "Giữ cấu trúc điều kiện giả định, định danh “đám người François”, dấu nhấn mạnh chữ nghiêng ở cụm lời chào tiếng Đức `*Guten Tag*` theo DEC-P01-002 và kết quả nhận lại là những viên đạn chì."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000006
  locks:
  - "Giữ chủ thể ngôi thứ ba “đơn vị của Tanya từ Đế quốc ghé thăm” và ẩn dụ mỉa mai “lịch sự gõ cửa trước”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000007
  locks:
  - "Giữ định danh “V-1”, các thành phần nhiên liệu “hydrazine và phụ gia boron” cùng ẩn dụ dùng chính chúng làm “vòng gõ cửa” để giáng đòn phủ đầu."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000008
  locks:
  - "Giữ chi tiết những quả đạn tên lửa bay nhanh hơn âm thanh mang năng lượng khổng lồ lao vào mục tiêu, lời cam đoan của các nhà khoa học về “những chiếc vòng gõ cửa tuyệt vời nhất trong toàn bộ lịch sử nhân loại” và tác dụng đánh thức bất kỳ ai bất kể “boong-ke ngầm” sâu đến đâu."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000009
  locks:
  - "Giữ đại từ độc thoại “Mình” theo DEC-P01-001, đại từ “chúng ta”, ẩn dụ gõ cửa mạnh tay và định danh “chiến dịch hai giai đoạn đầy lịch thiệp” nơi “phân đội pháp sư” tấn công ngay tiếp sau."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000010
  locks:
  - "Giữ nhận định châm biếm rằng kẻ nghĩ ra kế hoạch này vô cùng độc ác và đó là lời khen ngợi tuyệt vời nhất dành cho một sĩ quan thuộc “Bộ Tổng tham mưu”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000011
  locks:
  - "Giữ đại từ độc thoại “mình” / “Chúng ta” theo DEC-P01-001, nỗi khổ tâm muốn bật khóc khi bị buộc chặt vào quả tên lửa và phép so sánh không cần trúng đạn như “chiếc bật lửa nhạy nổ chỉ với một phát bắn” vì chỉ một vụ nổ bên ngoài cũng đủ kết liễu cả đội."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000012
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng từ `*nên*` theo DEC-P01-002, số phận thổ huyết trong cuộc tử chiến của cả hai phía trên chiến trường và lời tuyên bố ở ngôi thứ ba của “Tanya von Degurechaff” rằng hòa bình là điều thiêng liêng."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000013
  locks:
  - "Giữ sự đối lập giữa cảnh binh lính nhàn tản trong thế giới hòa bình với tình cảnh người lính phải vất vả trên chiến trường, cùng ẩn dụ quốc gia quên mặc tã hoặc quên nuôi chó giữ nhà."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000014
  locks:
  - "Giữ cấp bậc đầy đủ “Thiếu tá Tanya von Degurechaff”, sự chuyển đổi điểm nhìn từ trần thuật ngôi thứ ba dùng đại từ “nó” ở câu đầu sang độc thoại ngôi thứ nhất dùng đại từ “mình” ở câu thứ hai theo DEC-P01-001, và nguyên tắc đơn vị có kỷ luật nghiêm minh không được phép đến muộn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000015
  locks:
  - "Giữ chủ thể “Tanya”, dấu nhấn mạnh chữ nghiêng bao trọn câu suy nghĩ `*Ít nhất thì nếu lịch sử có ghi chép lại chuyện này, nó cũng nên nhắc tới chủ nghĩa vô thần trên chiến trường.*` theo DEC-P01-002, và câu cuối ở dạng văn bản phẳng dùng đại từ “mình”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000016
  locks:
  - "Giữ chủ thể “Tanya”, danh xưng “Chúa” và quyết định thực hiện vài màn quảng bá thật chấn động để hạ thấp Chúa."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000017
  locks:
  - "Giữ đại từ độc thoại “mình” theo DEC-P01-001, châm ngôn không có thứ gọi là truyền thông tồi và phép chơi chữ đối chiếu giữa “cuộc khẩu chiến nảy lửa” trên diễn đàn với “vật chất hữu cơ bốc cháy thành ngọn lửa theo đúng nghĩa đen”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000018
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng chỉ ở đúng câu mở đầu `*Đến giờ làm việc rồi.*` theo DEC-P01-002, cùng hành động xem giờ và rà soát kế hoạch của Tanya."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000019
  locks:
  - "Giữ câu tự nhủ ngắn gọn ở dạng văn bản phẳng không in nghiêng rằng không còn thời gian phung phí vào việc càu nhàu."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000020
  locks:
  - "Giữ chủ thể “Tanya”, đại từ phản thân “mình” và các thuật ngữ kỹ thuật bay “Tốc độ chặng giữa”, “Các thiết lập buồng đốt tăng lực”, “giai đoạn cuối của chuyến bay”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000021
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001 và chi tiết thùng nhiên liệu rỗng từng khiến nó lo phát nổ đã tách ra đúng như thiết kế."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000022
  locks:
  - "Giữ chủ thể “Tanya” / “Nó” theo DEC-P01-001, các thuật ngữ “bản đồ dẫn đường”, “thiết bị đo đạc”, mối lo về sai sót tính toán hoặc bị gió thổi chệch hướng và kết luận mọi thứ đều nằm trong “phạm vi sai số cho phép”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000023
  locks:
  - "Giữ nguyên khẩu lệnh vô tuyến của Tanya: “01 gọi tất cả các đơn vị. Hiện chúng ta đang bước vào chặng cuối. Báo cáo tình hình.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000024
  locks:
  - "Giữ chủ thể “Tanya” / “nó” theo DEC-P01-001, các thuật ngữ “đại đội”, “sóng định hướng”, “thợ máy phụ trách bảo dưỡng V-1” và ý nghĩ thầm cảm ơn họ vì những cỗ máy không gặp trục trặc rồi bất ngờ bung rời ra giữa không trung."
