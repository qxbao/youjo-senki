locked_choices:
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000121
  locks:
  - "Giữ dấu ba chấm mở đầu, chủ thể “Tanya”, sự đối lập giữa tâm trạng lo lắng khi mới xông vào và đánh giá thực tế rằng nơi này trông giống một “căn cứ hậu phương” lỏng lẻo đến tệ hại."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000122
  locks:
  - "Giữ định danh “phe Cộng hòa”, nhận định họ mặc định nơi này sẽ không trở thành chiến trường và quan sát quanh đây chẳng có mấy “hạ sĩ quan” dày dạn kinh nghiệm."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000123
  locks:
  - "Giữ đại từ ngôi thứ nhất số nhiều “chúng ta” trong câu kết luận ngắn: “Vậy nên chúng ta có thể mạnh tay hơn một chút.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000124
  locks:
  - "Giữ phép so sánh với an ninh của một “tổ chức tài chính dân sự” cùng các thuật ngữ “thẻ ra vào”, “thẻ từ IC” và sự chuẩn bị kỹ càng hơn của đội ngũ bảo vệ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000125
  locks:
  - "Giữ câu lẩm bẩm thành tiếng của Tanya với giọng tự giễu nhẹ nhàng rằng thỉnh thoảng liều mạng một phen cũng không tệ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000126
  locks:
  - "Giữ đại từ độc thoại “mình” theo DEC-P01-001, cụm “tổ chức tài chính dân sự” và kết luận mọi thứ vận hành theo “nguyên lý thị trường”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000127
  locks:
  - "Giữ thuật ngữ “đội quân nghĩa vụ” và nhận định không thể trông mong lính gác làm việc nghiêm túc khi bấu víu vào suy nghĩ viển vông rằng địch sẽ không xuất hiện ở hậu phương."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000128
  locks:
  - "Giữ nguyên lời gọi ngắn gọn của thuộc cấp: “Thiếu tá, nhìn kìa.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000129
  locks:
  - "Giữ chuỗi câu hỏi nghi vấn của Tanya (xưng “Tôi / chúng ta”) về khả năng có bẫy hay đến nhầm chỗ khi chỉ có bốn tên canh giữ một “kho đạn”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000130
  locks:
  - "Giữ đại từ sở hữu nội tâm “của mình” theo DEC-P01-001, thuật ngữ “kho đạn”, “quân cảnh” và cảnh bốn tên lính đang phì phèo thuốc lá tán gẫu trước nhà kho."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000131
  locks:
  - "Giữ câu hỏi tu từ về “quân cảnh” hút thuốc trước “kho đạn”, lập luận từ bằng chứng gián tiếp tại thiên đường kỷ luật ở hậu phương rằng chẳng tòa nhà nào giống kho đạn và kết luận “trung đội của Tanya” đã tiếp cận nhầm mục tiêu (“Công dã tràng cả.”)."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000132
  locks:
  - "Giữ lời nhắc cảnh giác và câu hỏi kiểm tra của Tanya với hai thuật ngữ kỹ thuật “ngụy trang quang học” và “chiết suất”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000133
  locks:
  - "Giữ câu báo cáo lễ phép của cấp dưới (“Không ạ... thưa Thiếu tá”) xác nhận không có tín hiệu khả nghi và có lẽ chỉ có mấy tên đó."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000134
  locks:
  - "Giữ sắc thái mỉa mai bộ phận “Tình báo”, cách gọi “Thiếu úy”, đại từ “chúng ta” và mệnh lệnh thổi bay mục tiêu thành từng mảnh rồi quay lại giúp bên “Weiss” dễ thở hơn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000135
  locks:
  - "Giữ nguyên câu đáp điều lệnh “Rõ, thưa Thiếu tá.” và câu trần thuật “Thiếu úy Serebryakov gật đầu.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000136
  locks:
  - "Giữ chủ thể “Tanya”, đại từ sở hữu “của mình” theo DEC-P01-001 và các thuật ngữ “đạn thuật thức”, “súng tiểu liên”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000137
  locks:
  - "Giữ đại từ nội tâm “mình” và “chúng ta” theo DEC-P01-001, xác nhận quân số lính gác địch chỉ ngang bằng quân ta và chỉ là bộ binh thông thường với số lượng ít bất thường."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000138
  locks:
  - "Giữ kết luận nội tâm rằng đây không phải “kho đạn” mà chỉ là một “cơ sở kho bãi”, đại từ “chúng ta” và nhận định bốn tên “quân cảnh” đứng gác thuần túy chỉ để cho có lệ."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000139
  locks:
  - "Giữ câu hỏi hoài nghi của Tanya với định danh đầy đủ “sở chỉ huy Cụm tập đoàn quân Rhine thuộc Cộng hòa”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000140
  locks:
  - "Giữ nguyên câu thoại ngập ngừng của cấp dưới: “À, thưa Thiếu tá, ừm, chuyện là…”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000141
  locks:
  - "Giữ tương quan xưng hô “Tôi - cô / Thiếu úy Serebryakov” và lời khẳng định của Tanya rằng mình không hẹp hòi đến mức từ chối lắng nghe lời khuyên xác đáng của thuộc cấp."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000142
  locks:
  - "Giữ câu đáp lễ phép “Vâng, thưa Thiếu tá.” và giả thuyết rụt rè dưới dạng câu hỏi rằng binh lính địch chỉ tập trung ở những cơ sở trọng yếu hơn."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000143
  locks:
  - "Giữ sự chuyển đổi điểm nhìn từ trần thuật ngôi thứ ba (“Thiếu úy Serebryakov”, “Tanya”, “phe Cộng hòa”) sang độc thoại nội tâm ngôi thứ nhất (“chính mình”) ở câu cuối khi cân nhắc phân bổ quân số giữa vị trí không quan trọng và vị trí trọng yếu."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000144
  locks:
  - "Giữ nguyên câu nhận xét của Tanya: “Điều đó rất có khả năng đấy, nhưng phiền phức thật.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000145
  locks:
  - "Giữ chủ thể “Tanya” và đại từ trần thuật “nó” theo DEC-P01-001: “Tanya thở dài khi sức nặng của tương lai trước mắt đè trĩu lên nó.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000146
  locks:
  - "Giữ cấu trúc đối lập nhân quả trong câu hỏi giả định (“chẳng phải vì chúng bất tài mà bởi khu vực này vốn không mấy quan trọng thì sao…?”) và hệ quả đáng ngại đối với “đơn vị của Weiss”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000147
  locks:
  - "Giữ đại từ “chúng ta” và ba nguy cơ liên tiếp: không hoàn thành mục tiêu, hứng chịu những đợt phản kích triền miên và lỡ mất điểm hẹn hội quân với tàu ngầm."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000148
  locks:
  - "Giữ câu nhận định phủ định ngắn gọn: “Chẳng có kịch bản nào trong số đó là tốt lành cả.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000149
  locks:
  - "Giữ lời thúc giục của Tanya với cấp dưới: “Được rồi, Thiếu úy. Vậy thì càng phải khẩn trương hơn nữa.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000150
  locks:
  - "Giữ nguyên câu độc thoại ngắn: “Đó là tương lai tồi tệ nhất có thể xảy ra.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000151
  locks:
  - "Giữ đại từ “chúng ta” ở câu đầu, đại từ “Mình” ở câu hai theo DEC-P01-001 và dấu nhấn mạnh chữ nghiêng tại đúng liên từ lựa chọn `*hay*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000152
  locks:
  - "Giữ mệnh lệnh tác chiến dứt khoát của Tanya với đại từ “Chúng ta” về việc tiêu diệt gọn đám lính gác rồi quay lại chi viện cho những người khác."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000153
  locks:
  - "Giữ nguyên câu trần thuật với cấp bậc và định danh đầy đủ: “Thế là Thiếu tá Tanya von Degurechaff hạ quyết tâm.”."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000154
  locks:
  - "Giữ đại từ “chúng ta” và quyết tâm một khi đã tới nơi thì phải làm tròn mục đích của chuyến đi."
- segment_id: YS-LN03/Text/chapter001_004.xhtml/p000155
  locks:
  - "Giữ thành ngữ mở đầu (“đâm lao thì phải theo lao”), đại từ nội tâm “Mình” / “chúng ta” theo DEC-P01-001, ý định ban đầu nhường việc xông pha cho thuộc cấp để đứng sau yểm trợ và kết luận xét khả năng bị truy kích từ phía sau thì xông thẳng vào hang cọp cũng không tệ lắm."
