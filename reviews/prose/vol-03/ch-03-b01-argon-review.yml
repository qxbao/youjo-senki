locked_choices:
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000002
  locks:
  - "Giữ dòng tiêu đề thời gian và địa điểm viết in hoa toàn bộ: `NGÀY 20 THÁNG 6, NĂM THỐNG NHẤT 1925, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000003
  locks:
  - "Giữ định danh `hai Thiếu tướng von Zettour và von Rudersdorf`, `cà phê thay thế`, `phòng ăn của Văn phòng Bộ Tổng tham mưu` và hình ảnh dùng cà phê thay thế dở tệ để nuốt trôi những tảng bầy nhầy có mùi vị kỳ quặc mà hầu hết mọi người đều ngần ngại gọi là thức ăn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000004
  locks:
  - "Giữ mệnh đề phủ định `hoàn toàn chẳng kích thích nổi chút vị giác nào của họ` và sự tương phản tăng tiến: điều gây bực bội hơn cả là bày biện thứ đồ ăn dở tệ như thế lên những chiếc đĩa tuyệt đẹp."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000005
  locks:
  - "Giữ sự đối lập giữa bộ đồ ăn đắt tiền sánh ngang bữa quốc yến nơi cung đình với việc hai người xắt vào những tảng có lẽ gọi là thức ăn được kèm chú thích trong ngoặc đơn `(mà có lẽ cũng không)`, việc họ đã vượt qua ngưỡng nhăn mặt vì nó từ lâu, và bí quyết là đừng để tâm tới thứ mình đang ăn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000006
  locks:
  - "Giữ sự tương phản giữa hành động cố hết sức nhìn nhau thay vì nhìn xuống đĩa của mình với chủ đề cuộc thảo luận hôm nay lại trừu tượng một cách khác thường."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000007
  locks:
  - "Giữ các định danh `Cộng hòa`, `Vương quốc Ildoa` và mạch sự kiện: sau tin tốt lành về việc khuất phục Cộng hòa, cuộc tranh luận tiếp theo xoay quanh việc tạo dựng tiền đề để đàm phán với Vương quốc Ildoa."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000008
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng `Ông`, định danh `Vương quốc Ildoa` và câu hỏi về việc có nên thu xếp `các điều khoản đầu hàng` thông qua Vương quốc Ildoa hay không."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000009
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách gọi `Tướng von Rudersdorf ạ`, định danh `Đế quốc`, ngôi `chúng ta` và ranh giới nhiệm vụ: nhiệm vụ của quân đội là bảo vệ Đế quốc, còn chiến lược ngoại giao nằm ngoài thẩm quyền của họ."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000010
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu đáp ngắn thừa nhận của Rudersdorf: `“Ồ, ừm, cũng đúng.”`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000011
  locks:
  - "Giữ tên `Rudersdorf`, `Zettour`, đại từ `ông / họ` và sự đối lập giữa suy nghĩ của Rudersdorf (có lẽ nên soạn thảo `các điều khoản hòa bình`) với lời khuyên của Zettour (làm vậy là vượt quá thẩm quyền của họ)."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000012
  locks:
  - "Giữ chi tiết nỗ lực giữ ánh mắt tránh xa phần ăn của mình, cấu trúc tương phản `không phải với tư cách những người phụ trách mà như một bên thứ ba` và dấu gạch ngang dài `—một chuyện hiếm khi xảy ra`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000013
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh `Bộ Ngoại giao`, ngôi `chúng ta` và lời nhắc cần tôn trọng công việc của Bộ Ngoại giao cũng như tập trung vào trách nhiệm của chính mình."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000014
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ `lệnh ngừng bắn` và câu hỏi xác nhận về các công việc hành chính xoay quanh lệnh ngừng bắn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000015
  locks:
  - "Giữ tên `Zettour`, `Rudersdorf`, định danh `Cục Tác chiến`, thuật ngữ `lệnh ngừng bắn` và mạch nhân quả: tuy chỉ là vấn đề hành chính nhưng quản lý lệnh ngừng bắn sẽ khá gian nan, và người vừa càu nhàu câu đó sẽ có cả một núi công việc phải giải quyết với tư cách người phụ trách Cục Tác chiến."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000016
  locks:
  - "Giữ tên `Rudersdorf`, đại từ `Ông`, tiếng thở dài và nhiệm vụ vẫn phải nắm thật chặt dây cương, hạn chế sự hỗn loạn tới mức tối đa có thể."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000017
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng `ông / chúng ta`, cảnh báo về tâm lý binh sĩ nơi đang thực sự bắn giết lẫn nhau cùng nguy cơ xảy ra sự cố nhầm lẫn khi cảm xúc dâng cao, và câu hỏi rủ định hình trước phương hướng hành động."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000018
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các thuật ngữ `kế hoạch ngừng bắn`, `lệnh ngừng bắn cục bộ`, định danh `bộ phận Pháp chế` và trình tự ba bước: vạch kế hoạch ngừng bắn cho các tiền tuyến, kiểm tra lại khả năng áp dụng quy trình tiêu chuẩn của lệnh ngừng bắn cục bộ cho chắc chắn, rồi đưa cho bộ phận Pháp chế xem qua."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000019
  locks:
  - "Giữ các định danh `học viên sĩ quan`, `Lục quân Đế quốc`, `chuyên gia pháp lý`, sự tương phản giữa kiến thức cơ bản sơ lược học tại học viện với thực tế hiếm hoi sĩ quan có kinh nghiệm xử lý hệ lụy của một cuộc đụng độ quân sự quy mô lớn giữa các quốc gia, và sắc thái giới hạn `may ra cũng chỉ có vỏn vẹn vài chuyên gia pháp lý mà thôi`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000020
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi xưng `ông / chúng ta`, định danh `Trung tá von Lergen`, quy chiếu ngôi ba `anh ta` và đề xuất gọi Lergen (vừa trở về sau chuyến thị sát ngoài thực địa) tới báo cáo chi tiết tình hình."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000021
  locks:
  - "Giữ thuật ngữ `sĩ quan tham mưu` và nhận định rằng những hiểu biết mang về từ tiền tuyến sẽ đi kèm những đề xuất vô cùng giá trị, nhất là từ một người có năng lực và có những bản báo cáo đáng tin cậy."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000022
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `Chúng ta / Tôi`, định danh `Bộ Tư lệnh Tối cao`, chi tiết đã thể hiện sự tự tin rất lớn trước Bộ Tư lệnh Tối cao và quyết tâm không thất bại để rồi biến thành trò cười."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000023
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `ông – tôi`, cụm `các tuyến tiếp tế vào thủ đô` và lời cảm ơn của Rudersdorf vì Zettour đã xử lý khéo léo, thiết lập được các tuyến tiếp tế vào thủ đô."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000024
  locks:
  - "Giữ tên `Zettour và Rudersdorf`, cụm `những người làm việc có năng lực` và sự chuyển dịch mạch trò chuyện từ các vấn đề ngoại giao ngoài thẩm quyền sang một núi vấn đề thực tế tồn đọng liên quan đến công tác hậu cần và các tiền tuyến."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000025
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `ông – tôi` và câu nói đùa có thể cảm ơn bằng hạt cà phê."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000026
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu ba chấm đầu câu, ngôi `tôi – ông`, lời hứa kiếm cho uống cà phê nhập khẩu thỏa thích ngay khi chuyện này kết thúc, và cách gọi bông đùa `đồ ranh mãnh tham lam ạ`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000027
  locks:
  - "Giữ sự tương phản nhượng bộ: ngay cả trong lúc bông đùa, điều duy nhất trong tâm trí họ vẫn là hoàn thành suôn sẻ mọi việc cần thiết để chấm dứt cuộc chiến."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000028
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `Ông – Tôi – chúng tôi`, các định danh `Lục quân Đế quốc`, `các tuyến nội địa` và lời phàn nàn của Zettour rằng bên hậu cần đã phải vật lộn khổ sở đến nhường nào khi Rudersdorf tự ý làm bất cứ điều gì mình thấy hợp lý."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000029
  locks:
  - "Giữ dấu ngoặc kép hội thoại, câu nhận lời `Tôi hiểu mà.` và câu hỏi rủ bắt tay giải quyết dứt điểm công việc ở cuối đoạn."
