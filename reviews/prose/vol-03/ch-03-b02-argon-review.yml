locked_choices:
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000030
  locks:
  - "Giữ dấu ngoặc kép hội thoại, lời đồng tình ngắn gọn và mệnh lệnh gọi `Đại tá von Lergen` đúng theo cấp bậc ghi trong đoạn nguồn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000031
  locks:
  - "Giữ đại từ `Họ`, cấu trúc tăng tiến `Không chỉ vậy...`, mệnh đề tương phản `Tuy nhiên...` và sự phân định rạch ròi giữa vai trò `sĩ quan tham mưu` (luôn phải bận rộn với công việc quân sự) với bổn phận của `binh lính` (tập trung vào việc chiến đấu)."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000032
  locks:
  - "Giữ dòng tiêu đề chuyển cảnh viết in hoa toàn bộ: `CÙNG NGÀY HÔM ĐÓ, HỘI ĐỒNG CỐ VẤN TÌNH BÁO ĐỐI NGOẠI THUỘC BỘ TƯ LỆNH TỐI CAO LỤC QUÂN ĐẾ QUỐC`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000033
  locks:
  - "Giữ hình ảnh những người đàn ông cau mày trong bộ âu phục xám xịt đơn điệu và sự tương phản giữa bầu không khí thường ngày (căng thẳng, trang nghiêm đến mức kiềm chế không hút thuốc) với hiện tại (rộn ràng bàn tán trước tin tốt lành đầu tiên sau một thời gian dài)."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000034
  locks:
  - "Giữ các định danh `thủ đô Cộng hòa`, `lệnh ngừng bắn`, `Đế quốc` và mạch sự kiện: chiến dịch phản công quy mô lớn đã thành công, quân đội thông báo binh lính đã tiến vào thủ đô Cộng hòa và lệnh ngừng bắn đang đến gần, cả hai đều đồng nghĩa với chiến thắng dành cho Đế quốc."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000035
  locks:
  - "Giữ hình ảnh giấc mơ về sự kết thúc của cuộc chiến và sự trở lại của nền hòa bình đang hiện ra ngay trước mắt họ."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000036
  locks:
  - "Giữ dấu ngoặc kép hội thoại, chức danh `Bộ trưởng Ngoại giao` và câu hỏi về phương hướng xử lý việc kết thúc chiến tranh."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000037
  locks:
  - "Giữ sắc thái nhấn mạnh `ngay cả những viên quan chức vốn nghiêm túc thực tế cũng đang sục sôi nhiệt huyết, sớm nghĩ tới các công việc thời hậu chiến`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000038
  locks:
  - "Giữ nhận định rằng việc chấm dứt cuộc xung đột kéo theo rất nhiều công việc phải giải quyết về sau."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000039
  locks:
  - "Giữ định danh `khu công nghiệp Vùng Đất Thấp` và sự đối lập thời gian: mới cách đây không lâu còn đứng ngồi không yên vì chi phí khổng lồ và kinh hoàng trước khủng hoảng mất khu công nghiệp Vùng Đất Thấp, nay lại trao nhau những nụ cười không sao kìm nén nổi và bàn luận về sự kết thúc của cuộc chiến."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000040
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `chúng tôi`, định danh `Cộng hòa` và hai nhóm yêu sách: yêu cầu mỗi quốc gia tham chiến thiết lập đường biên giới hòa bình và trả tiền bồi thường chiến tranh; yêu cầu Cộng hòa giao nộp một số lãnh thổ thuộc địa của họ và từ bỏ một số lãnh thổ khác."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000041
  locks:
  - "Giữ dấu ngoặc kép hội thoại, câu hỏi buột miệng về việc đi theo đường lối cứng rắn và lời xin lỗi ngập ngừng ngay sau đó (`Ờ, xin thứ lỗi cho tôi…`)."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000042
  locks:
  - "Giữ chức danh `Bộ trưởng Ngoại giao` và quan hệ nhân quả: câu trả lời ôn hòa ngoài dự kiến làm dấy lên tiếng xì xào ngạc nhiên, và với những người từng nghi ngờ sẽ có yêu sách quyết liệt từ lập trường cứng rắn thì các điều kiện này có vẻ hết sức thực tế."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000043
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `tôi` và lời thì thầm thắc mắc rằng nghe cách đám quan chức trẻ nói chuyện thì cứ tưởng họ sẽ đưa ra những yêu sách khắc nghiệt hơn."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000044
  locks:
  - "Giữ chức danh `Bộ trưởng Ngoại giao` và chi tiết lời thì thầm ấy đủ lớn để lọt vào tai Bộ trưởng Ngoại giao."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000045
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `tôi – ông / chúng tôi`, thuật ngữ `hiệp ước hòa bình` và giả định ẩn dụ về chuyện sẽ xảy ra nếu soạn thảo hiệp ước hòa bình sau khi đã uống cạn cả một bể bơi men say chiến thắng ngọt ngào."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000046
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi gợi mở ngắn gọn: `“Nghĩa là sao…?”`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000047
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `chúng tôi` và lời thú nhận rằng các viên chức trẻ tuổi đã làm đúng như vậy nên phải đợi cơn say của họ dịu bớt rồi mới bắt viết lại."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000048
  locks:
  - "Giữ đại từ `ông`, dáng vẻ hơi nhăn mặt ngượng ngùng khi thành thật kể lại chuyện hậu trường cho cuộc họp kín và nhận xét rằng các bộ khác đang cười nhạo những trò lố có phần cực đoan của họ."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000049
  locks:
  - "Giữ hai phần hội thoại kẹp giữa câu trần thuật, thuật ngữ `quốc gia phụ thuộc`, ngôi `chúng ta / tôi / Ông` và lời đề nghị gạch phần lạc đề đó khỏi biên bản."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000050
  locks:
  - "Giữ dấu ngoặc kép hội thoại, chỉ thị cho `Thư ký` làm theo lời `ông ấy`, cùng hình ảnh `Các viên lục sự` tận tụy đưa ra phán quyết với sự khoan dung của những người không vướng bận nỗi lo âu về sai lầm thời trai trẻ."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000051
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi về cách xử lý việc đầu hàng."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000052
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `chúng ta / các vị`, nhận định quân đội sẽ lo liệu việc đó vì không nên áp đặt hạn chế lên giới lãnh đạo quân sự trước khi chiến tranh kết thúc, và câu hỏi đuôi kêu gọi mỗi bên làm tốt phần việc tương ứng của mình."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000053
  locks:
  - "Giữ kết luận của cuộc họp là làm những gì có thể để đáp ứng yêu cầu của quân đội trước khi cần mẫn chuyển sang chủ đề thảo luận tiếp theo."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000054
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi `chúng ta`, định danh `Liên bang` và lời chuyển sang vấn đề nghị sự tiếp theo là hiệp định thương mại với Liên bang."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000055
  locks:
  - "Giữ dòng tiêu đề chuyển cảnh viết in hoa toàn bộ bám sát cấp đơn vị trong nguồn: `CÙNG NGÀY HÔM ĐÓ, NƠI ĐỒN TRÚ CỦA ĐẠI ĐỘI PHÁP SƯ TRÊN KHÔNG SỐ 203`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000056
  locks:
  - "Giữ dấu ngoặc kép hội thoại, định danh `Hải quân Cộng hòa` và câu hỏi sững sờ: `“Cái gì? Hải quân Cộng hòa đang rút lui ư?”`."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000057
  locks:
  - "Giữ định danh `Thiếu tá Tanya von Degurechaff` và chi tiết phản ứng đầu tiên trước tin tức này được thốt ra bằng một giọng đều đều."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000058
  locks:
  - "Giữ tên `Visha`, quy chiếu `cấp trên của cô` (không dùng đại từ `cô` cho Tanya theo DEC-P01-001), các cụm `phòng tuyến của Cộng hòa`, `nhiệm vụ chi viện đánh mục tiêu mặt đất`, `bộ tư lệnh tối cao` và góc nhìn của Visha cho rằng bức thông điệp có vẻ là tin tốt lành."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000059
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cách thưa `Vâng, thưa Thiếu tá... ạ`, định danh `Thứ trưởng, Thiếu tướng de Lugo`, `Hải quân Cộng hòa` và nội dung thông điệp chung gửi toàn quân từ hậu phương."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000060
  locks:
  - "Giữ các định danh `lệnh ngừng bắn`, `Lục quân Cộng hòa`, `Đế quốc`, dấu gạch ngang dài `—` và suy luận chắc chắn giấc mơ chiến thắng của Đế quốc đang trở thành hiện thực."
- segment_id: YS-LN03/Text/chapter003_002.xhtml/p000061
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng `Thiếu úy Serebryakov` và câu hỏi truy vấn phân biệt rõ các cụm từ trong dấu nháy đơn: `‘kết thúc chiến tranh’` chứ không phải `‘ngừng bắn’` hay `‘đầu hàng’`."
