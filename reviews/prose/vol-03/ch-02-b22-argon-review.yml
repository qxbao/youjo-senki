- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000664
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, định danh “Parisii”, quy mô “hai sư đoàn—những sư đoàn bộ binh chẳng có điểm nào giống với các đơn vị thiết giáp hay cơ giới hóa” và suy luận từ sự thiếu vắng người trẻ tuổi rằng đây chủ yếu là quân dự bị được huy động khẩn cấp."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000665
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, thuật ngữ “công binh dã chiến” và sự tương phản giữa việc đào chiến hào ở vùng ngoại vi với các con phố nội đô cùng những dãy nhà nguyên vẹn phía sau chưa bị đụng tới."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000666
  locks:
  - "Giữ dấu chấm lửng mở đầu, cấu trúc giả định trái thực tế quá khứ “Lẽ ra chí ít họ cũng phải tháo dỡ một số công trình để tạo tầm bắn thông thoáng cho hỏa lực phòng ngự và cho nổ tung các trụ cầu, nhưng họ đã không làm vậy.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000667
  locks:
  - "Giữ sắc thái cảm thán cho những người bị huy động khẩn cấp và nguyên nhân chính phủ do dự không muốn tiến hành “tác chiến đô thị” ngay trong thủ đô."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000668
  locks:
  - "Giữ dấu ngoặc kép hội thoại, dấu chấm lửng mở đầu, phép ẩn dụ “bốc phải quẻ xui trong trò xổ số chọn sếp”, định danh “Lục quân Đế quốc” và các đại từ “Tôi / chúng ta”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000669
  locks:
  - "Giữ dấu chấm lửng mở đầu và câu điều kiện giả định quá khứ “Hoặc biết đâu nếu được huấn luyện bài bản và cố thủ trong những trận địa phòng ngự kiên cố có hào lũy vững chắc cùng sự yểm trợ của pháo hạng nặng, thì họ đã có thể trở thành một mối đe dọa rồi.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000670
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*Còn với tình cảnh hiện tại thì…*` đúng phạm vi `<html:em>` theo DEC-P01-002 và mệnh đề trần thuật phẳng “Tanya thầm bật cười.”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000671
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*đáng thương*` theo DEC-P01-002, các định danh “Lục quân Đế quốc”, “tuyến Rhine”, “Quân Cộng hòa”, “Tanya”, “Tướng von Zettour” và ý có các mối quan hệ con người tốt đẹp từ cấp dưới cùng cho tới tận cấp cao nhất."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000672
  locks:
  - "Giữ dấu ngoặc kép hội thoại, mẫu gọi vô tuyến “Fairy 01 gọi CP”, đại từ “chúng tôi” và thông tin bộ binh địch quy mô hai sư đoàn đang xây dựng các trận địa phòng ngự."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000673
  locks:
  - "Giữ dấu ngoặc kép hội thoại, hiệu lệnh xác nhận “Nghe rõ.” và mệnh lệnh yểm trợ “sư đoàn thiết giáp” cho đến khi họ tới nơi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000674
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*...*` bao quanh toàn đoạn theo DEC-P01-002, đại từ “chúng ta” và dấu gạch ngang."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000675
  locks:
  - "Giữ đại từ trần thuật “nó” theo DEC-P01-001, các định danh “bộ phận Tình báo”, “Lục quân Cộng hòa”, “Parisii” và nội dung tin tình báo về việc xây dựng các tuyến phòng ngự quanh vùng ngoại vi cùng nhiều sư đoàn khác đang tập kết."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000676
  locks:
  - "Giữ các đại từ “chúng ta / mình” theo DEC-P01-001, sự thay đổi từ kế hoạch “trực chiến chờ lệnh” sang “nhiệm vụ trinh sát và tấn công mặt đất” và nỗi phân vân giữa khoản phụ cấp nhận thêm với kỳ nghỉ phép bị cắt bớt."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000677
  locks:
  - "Giữ hai phần chữ nghiêng `*Nhưng*` và `*nhìn vào tình hình hiện tại của mình, ... một khoản tiền thưởng nữa.*` đúng phạm vi `<html:em>` theo DEC-P01-002, định danh “Tanya” và đại từ nội tâm “mình” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000678
  locks:
  - "Giữ dấu ngoặc kép hội thoại, mẫu gọi vô tuyến “Fairy 03 gọi 01”, đại từ “Tôi” và báo cáo đã nhập xong dữ liệu, gửi kết quả quan sát cho pháo binh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000679
  locks:
  - "Giữ dấu ngoặc kép hội thoại, câu xác nhận “Fairy 01 nghe rõ.” và mệnh lệnh tập trung quan sát."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000680
  locks:
  - "Giữ dấu nhấn mạnh chữ nghiêng `*đến đáng ngạc nhiên*` ở cuối câu theo DEC-P01-002, danh từ “các quan sát viên”, các định danh “Norden”, “các pháp sư Liên minh Hiệp ước” và đại từ “chúng ta”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000681
  locks:
  - "Giữ sự tương phản giữa vài vụ nổ thỉnh thoảng bốc khói dưới mặt đất với bầu trời xanh ngắt trong một ngày nắng đẹp trời."
