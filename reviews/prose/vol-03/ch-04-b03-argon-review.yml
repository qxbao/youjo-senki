locked_choices:
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000038
  locks:
  - "Giữ đại từ trần thuật `nó` ở cả hai câu theo DEC-P01-001, chi tiết uống cạn tách cà phê và cấu trúc phủ định–loại trừ `chẳng còn cách nào khác ngoài việc đích thân đi hỏi họ`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000039
  locks:
  - "Giữ mệnh đề phủ định `tiểu đoàn hiện không trong trạng thái trực chiến phản ứng nhanh`, đại từ `nó` theo DEC-P01-001, định danh `Bộ Tổng tham mưu` và mức độ suy đoán `hẳn sẽ chẳng ai phản đối`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000040
  locks:
  - "Giữ chính xác hai phần chữ nghiêng tách quanh mệnh đề dẫn trần thuật `*Trong trường hợp đó*, Tanya thầm nghĩ, *thời gian là nguồn lực hữu hạn, nên mình không thể lãng phí nó được.*` theo DEC-P01-002 và đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000041
  locks:
  - "Giữ đại từ trần thuật `Nó` theo DEC-P01-001, `thiết bị liên lạc nội bộ ở góc phòng` và hành động gọi cho `ban chỉ huy tiểu đoàn`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000042
  locks:
  - "Giữ câu thoại trực điện thoại chuẩn mực `“Sĩ quan trực ban, Thiếu úy Serebryakov xin nghe.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000043
  locks:
  - "Giữ câu đáp ngắn gọn của Tanya `“Thiếu úy, tôi đây.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000044
  locks:
  - "Giữ lời thưa lễ phép của Serebryakov `“Ồ, thưa Thiếu tá. Tôi có thể giúp gì cho Thiếu tá ạ?”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000045
  locks:
  - "Giữ chi tiết Serebryakov nhấc máy chỉ sau hai hồi chuông, định danh `Bộ Tổng tham mưu`, `sở chỉ huy`, `Trung úy Weiss` và chỉ thị chuẩn bị hành lý cho cả hai (`của tôi và của cô`)."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000046
  locks:
  - "Giữ lời nhận lệnh `“Rõ.”`, việc Serebryakov quy chiếu Weiss bằng `anh ấy`, thông tin Weiss đang nghỉ phép và câu hỏi đặt vé tàu hỏa đường dài."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000047
  locks:
  - "Giữ đại từ `anh ta` khi Tanya nhắc tới Weiss, chỉ dẫn liên lạc qua vô tuyến, định danh `Văn phòng Bộ Tổng tham mưu` và yêu cầu thu xếp chỗ nghỉ ở thủ đô."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000048
  locks:
  - "Giữ ngôi `chúng ta` ở câu đầu, tên `Tanya` và quyết định bay cắt ngang qua `các phòng tuyến Rhine cũ` để tiến thẳng tới đó."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000049
  locks:
  - "Giữ định danh `những chiếc Type 97`, giả định nhượng bộ `Bất luận mọi chuyện sẽ ra sao nếu đây là một chuyến bay tác chiến` và kết luận việc chỉ băng qua không phận phe mình hẳn là hoàn toàn khả thi."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000050
  locks:
  - "Giữ câu hỏi lễ phép `“Rõ, thưa Thiếu tá! Thiếu tá sẽ lưu lại thủ đô bao nhiêu ngày ạ?”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000051
  locks:
  - "Giữ câu trả lời ngắn gọn `“Không nhiều đâu, nhưng chắc chắn là ba ngày.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000052
  locks:
  - "Giữ đại từ trần thuật `Nó` theo DEC-P01-001, định danh `Tướng von Zettour` và lý do nên dự trù dư thời gian lưu trú."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000053
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và quyết tâm mở một cuộc khẩu chiến nảy lửa ngay tại thủ đô nếu cần thiết."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000054
  locks:
  - "Giữ lời đáp nhận lệnh `“Rõ. Tôi sẽ làm ngay, thưa Thiếu tá.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000055
  locks:
  - "Giữ cụm chữ nghiêng mở đầu `*Được rồi.*` theo DEC-P01-002, đại từ trần thuật `nó` theo DEC-P01-001, thuật ngữ `bộ lễ phục kiểu I` và chi tiết nộp hai mẫu đơn xin phê duyệt kế hoạch bay (một cho nó và một cho Serebryakov) cùng kế hoạch dự kiến bay thẳng."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000056
  locks:
  - "Giữ tên `Visha`, `Tanya` và chi tiết Visha khẩn trương chuẩn bị không kém, quyết không để mình chịu thua Tanya."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000057
  locks:
  - "Giữ đại từ `Cô` quy chiếu Visha, các thuật ngữ `câu lạc bộ sĩ quan ma pháp`, `sĩ quan phụ tá`, `Bộ Tổng tham mưu`, `bộ phận hậu phương của Bộ Tổng tham mưu` và chi tiết đặt trước hai phòng cùng mượn một chiếc xe công vụ."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000058
  locks:
  - "Giữ chính xác phạm vi chữ nghiêng ở hai câu suy nghĩ nội tâm của Visha từ câu thứ hai đến hết đoạn theo DEC-P01-002, định danh `Tiểu đoàn 203`, `Bộ Tổng tham mưu` và đại từ tự xưng nội tâm `mình`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000059
  locks:
  - "Giữ lời tự nhủ của Visha với đại từ `mình`: `“Vậy là thay vì ra bãi biển, mình lại đi nghỉ phép ở thủ đô sao…? Chà, cũng không tệ lắm. Biết đâu mình sẽ được gặp lại vài gương mặt thân quen.”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000060
  locks:
  - "Giữ đại từ `cô` ở câu trần thuật đầu và chính xác phạm vi chữ nghiêng ở câu độc thoại nội tâm thứ hai `*Nếu thu xếp được thời gian, có lẽ mình sẽ có dịp trò chuyện trực tiếp với bạn bè thay vì chỉ cập nhật tình hình cho họ qua thư từ.*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000061
  locks:
  - "Giữ tên `Visha`, đại từ `cô`, các thuật ngữ `sĩ quan trực ban ca sau`, `sổ nhật ký tiểu đoàn`, `báo cáo hoạt động` và việc `Trung úy Weiss` (`anh`) có thể nắm bắt toàn bộ những gì cần biết chỉ qua một lần đọc lướt."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000062
  locks:
  - "Giữ định danh `Thiếu tá von Degurechaff`, cách làm rõ chủ thể `Thiếu tá biết Trung úy Weiss đang trong giờ nghỉ` và việc Visha chỉ cần liên lạc với `anh` là hoàn tất phần việc của `cô`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000063
  locks:
  - "Giữ lời gọi điện lịch sự `“Xin thứ lỗi, tôi là Thiếu úy Serebryakov. Cho phép tôi được gặp Trung úy Weiss ạ?”`."
- segment_id: YS-LN03/Text/chapter004_004.xhtml/p000064
  locks:
  - "Giữ từ mở đầu in nghiêng `*Được rồi.*` theo DEC-P01-002, chi tiết gọi điện thoại đường dài tới số của `cơ sở nghỉ dưỡng` được đưa để `“phòng hờ”` và xin gặp `Trung úy Weiss`."
