  proposed_vi: "tập thể các thực thể siêu nhiên – họ (trần thuật tại chapter005_002/p000073, p000075, p000081, p000085, p000088, p000091) / vị cherub – ông ta (trần thuật tại chapter005_002/p000083) / Thượng đế – ngài (quy chiếu ngôi thứ ba tại chapter005_002/p000082, p000091) / đối thoại và tâm niệm chung của các thiên thần: xưng chúng ta, gọi nhau là các vị (chapter005_002/p000076, p000078, p000080, p000084, p000089, p000093), thực thể cấp cao tự xưng Ta (chapter005_002/p000084, p000094), thực thể nêu ý kiến bổ sung lễ phép tự xưng tôi (chapter005_002/p000087), gọi con người/những kẻ vô thần là chúng (chapter005_002/p000074, p000078–p000080) và gọi cá nhân bị nhắm tới là kẻ đó / *kẻ đó* (chapter005_002/p000076, p000084, p000088) / công chúng Đế quốc và các lực lượng đối phương trong trần thuật và dư luận – họ (chapter005_002/p000098–p000100, p000102, p000103)"
  alternatives_vi:
  - người đó / cá nhân đó (thay cho `kẻ đó` tại chapter005_002/p000076, p000084, p000088 — `kẻ đó` giữ đúng thái độ bề trên, dửng dưng với cá nhân con người của các thực thể thiên giới)
