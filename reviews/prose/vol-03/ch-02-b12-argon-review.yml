locked_choices:
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000302
  locks:
  - "Giữ dấu ngoặc kép hội thoại, kính ngữ “ạ” và câu hỏi tu từ khen ngợi đồ ăn quá mức cầu kỳ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000303
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng “Thiếu tá”, ngôi “tôi / chúng tôi”, thuật ngữ “Bộ Tư lệnh Hạm đội” và mạch lời bật mí chuyện câu trộm một đầu bếp xuất sắc cùng lời chúc tận hưởng các bữa ăn trong không gian chật hẹp không có mấy thứ khác để mong đợi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000304
  locks:
  - "Giữ cụm “vị thuyền trưởng”, thuật ngữ “bộ phận Công nghệ”, ngôi “chúng ta” trong suy nghĩ nội tâm, và chỉ đánh dấu chữ nghiêng đúng hai phần suy nghĩ `*Và kết quả của chuyện đó*` cùng `*là khi số ngư lôi chúng ta mới được cấp gần đây bị phát hiện có lỗi, các thuyền trưởng tàu ngầm đã trút cơn giận lên bộ phận Công nghệ thay vì tàu địch.*` theo DEC-P01-002 (giữ phần dẫn lời của người kể chuyện nằm ngoài dấu sao)."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000305
  locks:
  - "Giữ tên “Treizel” và quan hệ nhân quả các thuyền trưởng tàu ngầm được đãi ngộ đặc biệt tốt về ăn uống để xoa dịu họ, mà người đầu bếp xuất sắc kia là một ví dụ."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000306
  locks:
  - "Giữ dấu ngoặc kép hội thoại và nhận định khi nhà nước tâm lý đến thế thì thường có nghĩa là đang có chuyện gì khác diễn ra."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000307
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi”, danh xưng “Thiếu tá” và câu gạt đi đầy ẩn ý."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000308
  locks:
  - "Giữ cụm “bộ tư lệnh tối cao” và ý cả hai cùng nhoẻn miệng cười vì các chỉ huy đều hiểu nếu cấp trên tình cờ thể hiện chút quan tâm chu đáo thì ắt có lý do riêng."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000309
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “tôi / chúng tôi”, địa danh “Norden” và lời nhờ chuyển lời cảm ơn tới chiếc tàu ngầm đã thực hiện màn nghi binh ngoài khơi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000310
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng “Thiếu tá” và câu hỏi về việc đã ở trên vùng biển đó."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000311
  locks:
  - "Giữ dấu ngoặc kép hội thoại, chỉ đánh dấu chữ nghiêng đúng cụm `*màn đánh lạc hướng tuyệt hảo*` theo DEC-P01-002, ngôi “Tôi”, kính ngữ “ạ”, thuật ngữ “bộ phận Công nghệ” và dấu nháy đơn quanh cụm ‘ngư lôi nổ nghi binh’."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000312
  locks:
  - "Giữ dấu ngoặc kép hội thoại, tiếng cười “Ha-ha-ha!”, ngôi “Chúng tôi” và lời kể hài hước về việc mời các nhà phát triển tới dự tiệc trên tàu để tri ân công sức."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000313
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Tôi”, tên “Degurechaff”, đại từ “nó” theo DEC-P01-001 và sắc thái bông đùa nhiều hơn thường lệ nhưng giọng vẫn thoáng chút cam chịu."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000314
  locks:
  - "Giữ cụm “Vị thuyền trưởng”, dấu ngoặc kép hội thoại, danh xưng “Thiếu tá”, ngôi “tôi” và lời sực nhớ ra một chuyện suýt quên."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000315
  locks:
  - "Giữ dấu ngoặc kép hội thoại và câu hỏi ngắn “Thưa ngài?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000316
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “Chúng tôi” và định danh “Chiến dịch Lock Pick” đang được tiến hành."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000317
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “tôi” và lời xin phép xem qua bức điện."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000318
  locks:
  - "Giữ tên “Degurechaff”, sự biến mất của bầu không khí nửa đùa nửa thật và chuỗi hành động cầm bức điện đọc lướt chăm chú, gật đầu một cái, đọc lại lần nữa rồi mỉm cười mãn nguyện."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000319
  locks:
  - "Giữ dấu ngoặc kép hội thoại và thuật ngữ ẩn dụ chiến lược “cánh cửa xoay”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000320
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001 và hình ảnh đôi mắt rực sáng như kẻ săn mồi dồn con mồi vào chân tường khiến trông nó như mất trí."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000321
  locks:
  - "Giữ đánh dấu chữ nghiêng toàn bộ đoạn theo DEC-P01-002, cách gọi “cô bé này” trong suy nghĩ của vị thuyền trưởng và biệt danh “Bạch Ngân”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000322
  locks:
  - "Giữ dấu ngoặc kép hội thoại, thuật ngữ “trận đánh bao vây cơ động”, “mặt trận Rhine”, chỉ đánh dấu chữ nghiêng đúng từ `*thật sự*` thứ hai theo DEC-P01-002, và đại từ trần thuật “Nó” theo DEC-P01-001."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000323
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, thuật ngữ “tiểu đoàn pháp sư trên không tinh nhuệ” và nhận xét về tâm tính của một con mãnh thú đã dồn được con mồi vào đúng vị trí."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000324
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “tôi / chúng tôi”, danh xưng “Thiếu tá”, các định danh “Bộ Tổng tham mưu” và “Vùng Đất Thấp”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000325
  locks:
  - "Giữ dấu ngoặc kép hội thoại và từ cảm thán “Hả?”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000326
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “chúng tôi”, danh xưng “Thiếu tá”, cụm “tuyến tuần tra” và thông báo đang hướng về phía đông, sẽ nổi lên trước bình minh trong tư thế sẵn sàng cho đơn vị cất cánh."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000327
  locks:
  - "Giữ các định danh “Bộ Tổng tham mưu”, “Chiến dịch Lock Pick”, đại từ “nó” theo DEC-P01-001 và dấu ngoặc kép quanh cụm “ngoại lệ đặc biệt”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000328
  locks:
  - "Giữ dấu ngoặc kép hội thoại, danh xưng “ngài, Thuyền trưởng”, ngôi “tôi” và lời chúc “võ vận trường cửu”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000329
  locks:
  - "Giữ dấu ngoặc kép hội thoại, ngôi “chúng tôi / Tôi”, danh xưng “Thiếu tá” và lời đáp vinh dự được hỗ trợ kèm lời chúc may mắn."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000330
  locks:
  - "Giữ tên “Treizel”, đại từ “ông”, cụm “người lính Đế quốc” và niềm tự hào vì con tàu đã góp sức hoàn thành nhiệm vụ được giao."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000331
  locks:
  - "Giữ tên “Degurechaff”, đại từ “ông” cho Treizel, đại từ “nó” cho Tanya theo DEC-P01-001 và hành động trang trọng đưa tay ra chúc bình an thuận lợi."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000332
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001, đại từ “ông” và hình ảnh bàn tay nhỏ nhắn như tay cô con gái của ông nhưng vẫn là cái bắt tay với một người đồng đội."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000333
  locks:
  - "Giữ danh xưng “Thuyền trưởng Treizel”, tên “Tanya” và cụm “các ống phóng ngư lôi phía mũi tàu”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000334
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các cụm “toàn Đại đội”, “Chỉ huy tiểu đoàn”, ngôi “chúng ta” và khẩu lệnh hô nghiêm."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000335
  locks:
  - "Giữ dấu ngoặc kép hội thoại, các danh xưng “Trung úy”, “thưa các quý ông”, “Mọi người”, “Thuyền trưởng Treizel”, ngôi “Chúng ta / tôi” và tên “Chiến dịch Lock Pick”."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000336
  locks:
  - "Giữ đại từ “nó” theo DEC-P01-001 và phản ứng của các thuộc cấp khi đoán được đây là việc hệ trọng nên xốc lại tinh thần lắng nghe."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000337
  locks:
  - "Giữ chỉ đánh dấu chữ nghiêng đúng câu hỏi `*Chiến dịch Lock Pick là gì?*` theo DEC-P01-002."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000338
  locks:
  - "Giữ dấu ngoặc kép hội thoại, cụm “thưa các quý ông”, các định danh “mặt trận Rhine”, “Lục quân Cộng hòa”, “Vùng Đất Thấp” và thông tin mũi xung kích đi đầu đã thổi bay tuyến chiến hào địch."
- segment_id: YS-LN03/Text/chapter002_004.xhtml/p000339
  locks:
  - "Giữ câu ngắn “Những tiếng reo hò vang lên.”."
