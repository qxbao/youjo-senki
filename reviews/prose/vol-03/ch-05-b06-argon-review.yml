  locks:
  - "Giữ dòng tiêu đề thời gian và địa điểm viết in hoa toàn bộ: `NGÀY 24 THÁNG 8, NĂM THỐNG NHẤT 1925, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, PHÒNG ĂN SỐ 1`."
- segment_id: YS-LN03/Text/chapter005_004.xhtml/p000003
  locks:
  - "Giữ các định danh `Nhà ăn tại Văn phòng Bộ Tổng tham mưu`, `Đế quốc`, `Phòng ăn số 1`, quy định so sánh `chất lượng ngang bằng hoặc kém hơn khẩu phần của những người lính được huy động ngoài chiến trường` và sắc thái châm biếm `tin đồn đầy cảm động ấy`."
