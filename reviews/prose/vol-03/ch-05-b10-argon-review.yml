  rationale: "Kế thừa đồng bộ hệ thuật ngữ quân hàm, quốc danh, địa danh và học thuyết quân sự từ các batch trước (`Đế quốc`, `Reich`, `Lục quân Đế quốc`, `quân đội Đế quốc`, `Khối Thịnh vượng chung`, `chính quốc Khối Thịnh vượng chung`, `Cộng hòa`, `Vương quốc Ildoa`, `mặt trận Rhine`, `lục địa phía nam`, `chiến lược tuyến nội địa`, `năng lực viễn chinh`, `Tướng von Zettour`, `Trung tướng von Rudersdorf`); khóa tạm các thuật ngữ/định danh mới trong lô B10 gồm `kế hoạch kiềm chế tiêu hao` (`p000133`), `Khối tập thể Ispagna` (`p000137`), `các thân vương quốc Turkman` và `các khu định cư của Ildoa` (`p000138`)."
