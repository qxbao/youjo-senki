  proposed_vi: "vượt biển, các sĩ quan hoạch định (chapter005_004/p000113) / trận chiến tiêu hao (chapter005_004/p000114, p000116) / Đế quốc, mặt trận Rhine (chapter005_004/p000116, p000122) / chính quốc của địch, tù binh (chapter005_004/p000117, p000118, p000121) / Lục quân Đế quốc (chapter005_004/p000118, p000131) / quân đội Đế quốc, Khối Thịnh vượng chung (chapter005_004/p000119) / một số sĩ quan tham mưu, chiến tranh chớp nhoáng (chapter005_004/p000122) / lãnh thổ chiếm đóng, bảo toàn binh lực (chapter005_004/p000124) / chiến lược tuyến nội địa, năng lực viễn chinh (chapter005_004/p000125) / Tướng von Zettour, quốc lực (chapter005_004/p000127) / chính quốc Khối Thịnh vượng chung (chapter005_004/p000128) / Cộng hòa (chapter005_004/p000130, p000137, p000139, p000141) / các sĩ quan hoạch định tác chiến, Trung tướng von Rudersdorf (chapter005_004/p000131) / một cuộc tiến công hạn chế (chapter005_004/p000132) / kế hoạch kiềm chế tiêu hao (chapter005_004/p000133) / lục địa phía nam, chính quốc (chapter005_004/p000134, p000135, p000137, p000140, p000141) / Khối tập thể Ispagna (chapter005_004/p000137) / Vương quốc Ildoa, “định cư”, các thân vương quốc Turkman, các khu định cư của Ildoa (chapter005_004/p000138) / các chính quyền bù nhìn (chapter005_004/p000139) / các đội quân tình nguyện (chapter005_004/p000140) / Reich (chapter005_004/p000141)"
  alternatives_vi:
  - Liên hiệp Ispagna / Tập thể Ispagna (thay cho `Khối tập thể Ispagna` tại chapter005_004/p000137 — ưu tiên `Khối tập thể Ispagna` vì phản ánh rõ cấu trúc chính thể tập hợp nhiều phe phái đang xung đột chính trị nội bộ được giải thích ngay trong câu sau mà không nhầm với các thiết chế liên bang hay liên minh khác) / các tiểu quốc Turkman (thay cho `các thân vương quốc Turkman` tại chapter005_004/p000138 — ưu tiên `các thân vương quốc Turkman` vì chuẩn thuật ngữ chính trị-lịch sử cho lãnh địa của các tước hiệu quân chủ địa phương) / kế hoạch cầm chân tiêu hao (thay cho `kế hoạch kiềm chế tiêu hao` tại chapter005_004/p000133 — ưu tiên `kế hoạch kiềm chế tiêu hao` vì trang trọng, chuẩn văn phong hoạch định chiến lược của Bộ Tổng tham mưu)
