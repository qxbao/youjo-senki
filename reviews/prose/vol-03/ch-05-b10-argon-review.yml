- source_term: general_staff_debate_and_southern_front_pronouns_vol03_ch05_b10
  proposed_vi: "Đối thoại và phát biểu trong cuộc họp Bộ Tổng tham mưu: Zettour và các sĩ quan/tướng lĩnh tham mưu xưng `tôi`, gọi đối phương trực tiếp là `ông` (`Tướng von Zettour` tại p000127), dùng `chúng ta` / `của mình` khi chỉ chung phía Đế quốc và `họ` khi chỉ phe địch (chapter005_004/p000114, p000120, p000122, p000123, p000125, p000127) / Trần thuật ngôi thứ ba: quy chiếu Trung tướng von Zettour bằng `ông` (chapter005_004/p000124, p000128–p000133); quy chiếu tập thể phe Đế quốc, các sĩ quan tham mưu hoặc các quốc gia/quân địch bằng `họ` (chapter005_004/p000115, p000117, p000119, p000122, p000129, p000130, p000137, p000140); tại p000129 dùng `chúng` cho quân địch trong mệnh đề thể hiện góc nhìn tính toán chiến thuật của Zettour (`kéo chúng tới chiến trường do Đế quốc lựa chọn`)"
  alternatives_vi:
  - họ (thay cho `chúng` tại chapter005_004/p000129 — ưu tiên `chúng` vì tránh lặp đại từ với `cơ hội chiến thắng của họ` ở đầu cùng câu và thể hiện tự nhiên sắc thái chủ động dẫn dụ đối phương vào bẫy của Zettour)
