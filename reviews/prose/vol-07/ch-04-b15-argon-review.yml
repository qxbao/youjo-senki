  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000425"
    choices:
      - "Trần thuật pha nội tâm Tanya: giữ đại từ 'chúng ta', tên riêng 'Tanya', đại từ 'nó' theo DEC-P01-001, 'mệnh lệnh phụ trội' (additional order), và 'sở chỉ huy địch' (enemy HQ)."
