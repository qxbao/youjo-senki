  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000421"
    choices:
      - "Trần thuật và thoại mệnh lệnh của Tanya: giữ đúng phạm vi nhấn mạnh Markdown '*Đành chịu vậy thôi*' theo DEC-P01-002, 'đội hình tập kích' (assault formation), và 'tìm và diệt' (search and destroy)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000422"
    choices:
