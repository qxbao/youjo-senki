  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000396"
    choices:
      - "Thoại của Tanya với cấp dưới: giữ đại từ 'Chúng ta' / 'chúng ta', 'pháp sư trên không của địch' (enemy aerial mages), và danh xưng 'Thiếu tá Weiss' (Major Weiss)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000397"
    choices:
      - "Thoại báo cáo của Thiếu tá Weiss: giữ 'thuật thức phát nổ' (explosion formula), 'đại đội' (companies), 'chúng ta' (we), và tiểu từ lễ phép 'ạ' khi báo cáo với cấp trên."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000398"
    choices:
      - "Thoại của Tanya: giữ câu hỏi xác nhận tỷ lệ thương vong 'một phần tư quân số của chúng ta' (a quarter of our members)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000399"
    choices:
      - "Trần thuật kết hợp nội tâm Tanya: giữ đại từ 'Nó' / 'nó' cho Tanya theo DEC-P01-001, 'Họ' cho đơn vị, 'đám pháp sư Liên bang' (Federation mages), và giữ đúng phạm vi nhấn mạnh Markdown '*Cảm giác chẳng giống như chúng ta đang giao chiến với Quân đội Liên bang chút nào…*' theo DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000400"
    choices:
      - "Độc thoại nội tâm của Tanya: giữ đại từ tự xưng 'mình' theo DEC-P01-001, 'Quân đội Liên bang' (Federation Army), 'sức kháng cự có tổ chức của Liên bang' (the Federation's organized resistance), và phủ định 'chẳng hề lộ dấu hiệu sụp đổ'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000401"
    choices:
      - "Độc thoại nội tâm của Tanya: giữ giả định trái thực tế 'hẳn đã phải rệu rã' và đại từ tự xưng 'mình' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000402"
    choices:
      - "Thoại chỉ huy của Tanya: giữ đại từ 'chúng ta', 'ưu thế trên không cục bộ' (limited air superiority), 'viện binh địch' (enemy reinforcements)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000403"
    choices:
      - "Thoại của Weiss và trần thuật: giữ cách đáp 'Rõ, thưa Trung tá!' (Yes, ma'am!), 'sở chỉ huy địch' (enemy HQ), đại từ 'Anh' cho Weiss, 'vị phó chỉ huy' (vice commander), và giữ đúng phạm vi nhấn mạnh Markdown '*được xác định*' theo DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000404"
    choices:
      - "Thoại của Tanya: giữ mức độ phán đoán 'khả năng rất cao' (a very good chance) và 'trò nghi binh' (deception)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000405"
    choices:
      - "Thoại hỏi lại của Weiss: giữ sắc thái lễ phép 'Sao cơ ạ?'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000406"
    choices:
      - "Thoại của Tanya với Weiss: giữ tình thái phỏng đoán 'Có lẽ' (probably), đại từ 'chúng ta' và tự xưng 'Tôi'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000407"
    choices:
      - "Trần thuật về Tanya: giữ đại từ 'Nó' / 'nó' theo DEC-P01-001 và phủ định 'thực sự không muốn'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000408"
    choices:
      - "Trần thuật: giữ tên riêng 'Tanya', 'sở chỉ huy của Quân đội Liên bang' (Federation Army headquarters), 'Moskva', 'tác chiến chống pháp sư' (anti-mage combat), và đại từ 'họ' chỉ tiểu đoàn."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000409"
    choices:
      - "Độc thoại nội tâm của Tanya: giữ 'nhiệm vụ phụ trội' (additional task), 'lực lượng biệt kích dù' (paratrooper rangers), 'điểm vượt sông' (river crossing), đại từ 'chúng ta' và phủ định 'Chẳng có lý do gì'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000410"
    choices:
