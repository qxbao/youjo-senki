  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000412"
    choices:
      - "Thoại của Tanya: giữ 'Sức kháng cự của Liên bang' (Federation resistance), đại từ 'chúng ta', và 'Sở chỉ huy của chúng' (The headquarters)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000413"
    choices:
      - "Thoại của Weiss tán đồng Tanya: giữ cách xưng hô tôn kính '…Vâng, Trung tá nói đúng ạ.'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000414"
    choices:
      - "Thoại của Tanya và trần thuật: giữ 'vị phó chỉ huy' (second-in-command), 'lá cờ đỏ của phe Cộng sản' (the Communists' red flag), danh xưng 'Thiếu tá' (Major), 'Nghi binh' (Deception), 'sở chỉ huy địch' (enemy HQ), và 'suy nghĩ quá đỗi viển vông' (thinking too wishfully)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000415"
    choices:
      - "Thoại của Weiss hỏi lại Tanya: giữ xưng hô 'Trung tá', đại từ 'chúng ta' và tiểu từ 'ạ'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000416"
    choices:
      - "Thoại của Tanya và trần thuật: giữ tên riêng 'Tanya', đại từ 'nó' theo DEC-P01-001, 'sở chỉ huy' (HQ), và giữ đúng phạm vi nhấn mạnh Markdown '*Chắc chắn là không rồi*' theo DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000417"
    choices:
      - "Trần thuật về Tanya: giữ đại từ 'Nó' / 'nó' theo DEC-P01-001, tên riêng 'Weiss', và độ bất định 'chẳng chắc chắn về sự thật'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000418"
    choices:
