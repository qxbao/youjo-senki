    terms:
      - "hệ thống chỉ huy"
    pov_and_pronouns: "Thoại của Zettour; dùng 'chúng' cho địch và 'chúng ta' cho phía Đế quốc, giữ câu điều kiện bỏ lửng ở cuối."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000629
    terms: []
    pov_and_pronouns: "Trần thuật ngắn đúc kết phương châm tác chiến."
    emphasis: "In nghiêng đúng cụm châm ngôn '*ứng biến thô sơ nhưng thần tốc ăn đứt trau chuốt mà chậm chạp*' theo DEC-P01-002."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000630
    terms:
      - "Zettour"
      - "Rudersdorf"
    pov_and_pronouns: "Độc thoại nội tâm trực tiếp của Zettour xen câu trần thuật; trong nội tâm Zettour tự xưng 'ta' nhất quán với giọng nhân vật."
    emphasis: "In nghiêng đúng hai phần độc thoại nội tâm ở đầu và cuối đoạn, giữ câu trần thuật ở giữa không in nghiêng theo DEC-P01-002."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000631
    terms:
      - "Trung tá Uger"
      - "bên Tình báo"
      - "Quân đội Liên bang"
    pov_and_pronouns: "Thoại chỉ thị của Zettour với Uger; xưng 'tôi' – 'anh', dịch 'Colonel Uger' thành 'Trung tá Uger' theo đúng quân hàm thực tế."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000632
    terms: []
    pov_and_pronouns: "Thoại nhận lệnh của Uger; xưng 'Tôi', gọi bên Tình báo là 'họ', có kính ngữ 'ạ'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000633
    terms:
      - "lệnh ngừng bắn"
    pov_and_pronouns: "Thoại của Zettour nói với Uger ('anh', 'chúng ta'); giữ cấu trúc phủ định ('Chỉ vì… không có nghĩa là…')."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000634
    terms: []
    pov_and_pronouns: "Thoại đáp ngắn của Uger; xưng 'Tôi' và có kính ngữ 'ạ'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000635
    terms:
      - "Zettour"
    pov_and_pronouns: "Thoại ngắn kèm trần thuật ngôi thứ ba."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000636
    terms: []
    pov_and_pronouns: "Thoại kết đoạn của Zettour nói với Uger; xưng 'Tôi' – 'anh'."
    emphasis: "Không dùng chữ nghiêng."
