      - "Điểm nhìn, đại từ & thuật ngữ: quy chiếu Tanya bằng 'Nó'/'nó' theo DEC-P01-001; 'Kampfgruppe HQ' -> 'sở chỉ huy Kampfgruppe'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000155"
    choices:
      - "Thoại & quân hàm: thuộc cấp chào Tanya 'Thưa Trung tá!'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000156"
    choices:
      - "Thoại, điểm nhìn, đại từ & tình thái: Tanya xưng 'tôi'; trần thuật quy chiếu Tanya bằng 'Nó' theo DEC-P01-001; giữ sắc thái 'Xem ra tôi đến muộn rồi.' và câu hỏi 'Tình hình thế nào rồi?'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000157"
    choices:
      - "Điểm nhìn & đại từ: quy chiếu Tanya bằng 'của nó' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000158"
    choices:
      - "Thoại báo cáo & thuật ngữ: 'aerial mage battalion' -> 'tiểu đoàn pháp sư trên không'; 'armor and infantry troops' -> 'Lực lượng thiết giáp và bộ binh'; 'artillery' -> 'pháo binh'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000159"
    choices:
      - "Thoại, xưng hô, quân hàm, điểm nhìn, đại từ & phủ định: Tanya gọi Serebryakov là 'Trung úy' và 'cô'; trần thuật nêu tên 'Tanya' và quy chiếu bằng 'Nó' theo DEC-P01-001; giữ phủ định 'Nó không ngờ vừa mới thức dậy đã có ngay một tách cà phê thơm ngon thế này!'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000160"
    choices:
      - "Điểm nhìn, đại từ khái quát, quân hàm & thuật ngữ: dùng đại từ khái quát 'bạn' cho câu cảm thán mở đầu; 'First Lieutenant Serebryakov' -> 'Trung úy Serebryakov'; 'combat support' -> 'hỗ trợ tác chiến'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000161"
    choices:
      - "Điểm nhìn, tình thái nhượng bộ & phủ định: trần thuật giữ tên 'Tanya'; giữ mệnh đề nhượng bộ 'Có thể quân địch đang tấn công, nhưng mọi công tác chuẩn bị đều đã hoàn tất.' và phủ định 'Chẳng có gì phải hoảng loạn cả.'."
