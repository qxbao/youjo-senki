findings:
  - severity: "moderate"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000197"
    issue: "Thuật ngữ 'aerial mages' đang được dịch là 'các pháp sư hàng không', lệch với phương án chuẩn tạm 'các pháp sư trên không' đã dùng xuyên suốt các tập và khóa trong sổ pending."
    evidence: "Trong work/run-state/pending-terms-index.yml (từ vol-01 đến vol-07), 'aerial mages' luôn được thống nhất là 'pháp sư trên không' / 'các pháp sư trên không'."
    recommendation: "Đổi 'các pháp sư hàng không' thành 'các pháp sư trên không'."
  - severity: "moderate"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000205"
    issue: "Thuật ngữ 'mana signal' đang được dịch là 'tín hiệu ma đạo', lệch với phương án 'tín hiệu ma năng' đã thống nhất trong sổ pending; đồng thời 'home country' dịch là 'chính quốc' chưa đồng bộ với 'bản quốc' / 'quê hương' trong tập 6–7."
    evidence: "Trong work/run-state/pending-terms-index.yml, 'mana signals' được khóa là 'tín hiệu ma năng' và 'home country' được khóa là 'bản quốc' (hoặc 'quê hương')."
    recommendation: "Đổi 'tín hiệu ma đạo' thành 'tín hiệu ma năng' và cân nhắc đổi 'chính quốc' thành 'bản quốc'."
  - severity: "moderate"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000216"
    issue: "Thuật ngữ 'orbs' / 'the orb' ở p000216 và p000217 đang được dịch là 'bảo châu', lệch hoàn toàn với thuật ngữ 'quả cầu' (viết tắt của 'quả cầu tính toán') đã khóa xuyên suốt bộ truyện."
    evidence: "Trong work/run-state/pending-terms-index.yml (từ vol-01 đến vol-07), 'orb' / 'orbs' luôn được dịch là 'quả cầu' / 'các quả cầu'."
    recommendation: "Tại p000216 và p000217, đổi 'bảo châu' thành 'quả cầu'."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000187"
    issue: "Cụm danh từ 'an old country' đang được dịch thành 'một quốc gia cổ hủ', đưa sớm sắc thái phán xét tiêu cực vào tính từ chỉ tuổi đời/lịch sử ('old') và làm mờ quan hệ nhân quả với câu kế tiếp giải thích việc vận hành theo truyền thống."
    evidence: "Theo canon/style-guide.md, không thêm sắc thái phán xét khi nguồn chỉ nêu thuộc tính trung tính làm tiền đề lập luận."
    recommendation: "Đổi 'một quốc gia cổ hủ' thành 'một quốc gia lâu đời' (hoặc 'một quốc gia già cỗi')."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000194"
    issue: "Thuật ngữ 'eastern front' (viết thường trong lời kể) đang được viết hoa thành 'Mặt trận phía Đông' ở cả hai lần xuất hiện, chưa đồng bộ với quy ước viết thường 'mặt trận phía đông' trong lời kể của tập 7."
    evidence: "Trong work/run-state/pending-terms-index.yml của vol-07, 'eastern front' trong văn xuôi luôn được thống nhất là 'mặt trận phía đông' (chỉ viết hoa khi nằm trong tiêu đề phụ hoặc tên tác phẩm)."
    recommendation: "Đổi cả hai cụm 'Mặt trận phía Đông' trong p000194 thành 'mặt trận phía đông'."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000223"
    issue: "Đại từ trần thuật chỉ Đại tá Mikel đang dùng là 'anh' ('khóe miệng anh lại cứng đờ'), thiếu nhất quán với đại từ trần thuật 'ông' dùng cho Trung tá Drake (cấp dưới về quân hàm trong cùng bối cảnh đối thoại ở p000218 và p000224)."
    evidence: "Cả Mikel (Đại tá) và Drake (Trung tá) đều là sĩ quan chỉ huy cấp tá trung niên; p000218 và p000224 đều quy chiếu Drake bằng 'ông'."
    recommendation: "Đổi 'khóe miệng anh lại cứng đờ' thành 'khóe miệng ông lại cứng đờ' để đồng bộ đại từ trần thuật giữa hai vị chỉ huy."
