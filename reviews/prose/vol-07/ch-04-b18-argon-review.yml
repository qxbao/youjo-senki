findings:
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000503"
    severity: "minor"
    category: "pronoun_clarity"
    issue: "Ở mệnh đề 'và Tanya lên tiếng hỏi ngay khi cô giơ tay chào', đại từ 'cô' dùng để quy chiếu về Trung úy Serebryakov nhưng lại đứng ngay sau chủ ngữ 'Tanya', dễ gây nhập nhằng chủ thể hành động chào hoặc tạo cảm giác lẫn đại từ trần thuật của Tanya (vốn dùng 'nó' theo DEC-P01-001)."
    rationale: "Làm rõ đối tượng quy chiếu là Serebryakov và giữ ranh giới đại từ trần thuật thật mạch lạc."
    suggested_fix: "Đổi 'ngay khi cô giơ tay chào' thành 'ngay khi cô ấy giơ tay chào' hoặc 'ngay khi vị trung úy giơ tay chào'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000516"
    severity: "minor"
    category: "register_and_precision"
    issue: "Trong lời thoại của Tanya nói với hai sĩ quan cấp dưới (Thiếu tá Weiss và Trung úy Serebryakov), cụm tự quy chiếu nhóm ở hiện trường ('us in the field') được dịch thành 'đám lính ngoài thực địa chúng ta', hơi lệch vì cả ba đều là sĩ quan chỉ huy và tham mưu chứ không phải binh lính."
    rationale: "Giữ đúng vị thế sĩ quan ngoài thực địa và không tự thu hẹp nghĩa sang 'đám lính'."
    suggested_fix: "Đổi 'lại là đám lính ngoài thực địa chúng ta' thành 'lại là những người ở ngoài thực địa như chúng ta' hoặc 'lại là cánh quân nhân ngoài thực địa chúng ta'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000517"
    severity: "minor"
    category: "style_and_naturalness"
    issue: "Cụm 'là bí mật tuyệt mật' ở cuối đoạn bị lặp yếu tố nghĩa 'mật' khi diễn đạt tính chất bảo mật ('top secret')."
    rationale: "Giúp câu văn tiếng Việt tự nhiên, gọn và chuẩn thuật ngữ bảo mật hơn."
    suggested_fix: "Đổi 'là bí mật tuyệt mật' thành 'là tuyệt mật' hoặc 'thuộc diện tuyệt mật'."
