  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000482"
    choices:
      - "Đại từ nội tâm: giữ tự quy chiếu 'khiến mình phát bệnh' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000483"
    choices:
      - "Thuật ngữ, quân hàm & giả định: 'Colonel Dirichlet' -> 'Đại tá Dirichlet'; 'chain of command' -> 'hệ thống chỉ huy'; 'headquarters' -> 'sở chỉ huy'; giữ mệnh lệnh giả định 'Cứ cho là...' và đại từ 'chúng ta'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000484"
    choices:
      - "Thuật ngữ & câu hỏi phủ định: 'second-in-command' -> 'phó chỉ huy'; 'Fifty-Fourth Regiment' -> 'Trung đoàn 54'; giữ cấu trúc câu hỏi 'Chẳng phải chúng ta nên... sao ạ?' của Serebryakov."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000485"
    choices:
      - "Thoại ngắn: giữ câu bác bỏ dứt khoát 'Chỉ tổ phí thời gian thôi.'"
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000486"
    choices:
      - "Thuật ngữ & đại từ nội tâm: 'adjutant' -> 'sĩ quan phụ tá'; tự quy chiếu bằng 'của mình' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000487"
    choices:
      - "Giả định & phủ định: giữ giả định 'sẽ đẩy mọi thứ vào cảnh hỗn loạn' và phủ định tuyệt đối 'Làm gì có chuyện chúng tôi đủ xa xỉ để...'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000488"
    choices:
      - "Thoại ngập ngừng: giữ 'Nh-nhưng mà—'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000489"
    choices:
      - "Quân hàm: 'Lieutenant Serebryakov' -> 'Trung úy Serebryakov'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000490"
    choices:
      - "Thoại cấp dưới: giữ 'Vâng ạ?'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000491"
    choices:
      - "Xưng hô & nghĩa: Tanya gọi Serebryakov là 'Cô'; giữ câu châm ngôn 'Thời gian là hữu hạn. Sự xa xỉ chính là kẻ thù.'"
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000492"
    choices:
      - "Đại từ trần thuật & thuật ngữ: quy chiếu Tanya bằng 'nó' theo DEC-P01-001; 'Rhine front' -> 'mặt trận Rhine'; giữ dấu chấm lửng cuối đoạn."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000493"
    choices:
      - "Thoại cảnh báo: giữ 'Địch tập kích!' nhất quán với p000443."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000494"
    choices:
      - "Điểm nhìn, đại từ nội tâm & phủ định: tự quy chiếu bằng 'mình' theo DEC-P01-001; giữ câu phủ định kết đoạn 'Không có đủ âm thanh.'"
