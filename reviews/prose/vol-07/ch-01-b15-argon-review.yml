  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000624"
    choices:
      - "Phủ định & giọng thoại khiêu khích: giữ phủ định 'Thúc giục đám lính chẳng mang lại hiệu quả gì'; trong thoại của Tanya dùng 'Các người' và cụm mắng mỏ 'lũ hề xuẩn ngốc hoàn toàn kia!'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000625"
    choices:
      - "Đại từ trần thuật & phủ định: quy chiếu Tanya bằng 'nó' theo DEC-P01-001; giữ chuỗi nhận định phủ định 'không còn biết xấu hổ là gì nữa', 'Việc này vô ích thôi. Chẳng có mấy lý do để tiếp tục cố gắng.'"
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000626"
    choices:
      - "Câu hỏi điều kiện, tình thái & trần thuật: giữ câu hỏi điều kiện 'Nếu bỏ cuộc không phải là một lựa chọn, vậy thứ duy nhất còn lại phải làm là nâng mức độ lên thêm một nấc sao?', từ tình thái 'Có lẽ vậy.' và chi tiết 'mở miệng lần thứ ba'."
