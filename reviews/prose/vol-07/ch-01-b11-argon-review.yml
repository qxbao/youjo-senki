findings:
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000426"
    severity: "minor"
    issue: "Cụm từ gốc 'War dogs' (ẩn dụ chỉ đám thuộc cấp hiếu chiến được quy chiếu bằng 'chúng' ở vế sau) đang được dịch là 'Khuyển chiến'. Trong cấu trúc từ Hán-Việt, hậu tố '-chiến' đứng sau danh từ thường chỉ hình thức giao chiến (như không chiến, hải chiến, khuyển chiến = dogfight), dễ gây nhầm thành tên một kiểu tác chiến thay vì danh từ chỉ loài chó chiến/chó săn chiến trường."
    rationale: "Đổi sang 'Chiến khuyển' hoặc 'Chó săn chiến trường' để giữ đúng danh từ chỉ đối tượng ('war dogs') và khớp tự nhiên với đại từ 'chúng' trong cùng câu."
    suggested_fix: "Đổi 'Khuyển chiến cốt là ở cách bạn sử dụng chúng.' thành 'Chiến khuyển cốt là ở cách người ta sử dụng chúng.' (hoặc 'Chó săn chiến trường cốt là ở cách bạn sử dụng chúng.')."
