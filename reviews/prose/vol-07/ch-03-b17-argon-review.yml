  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000306"
    choices:
      - "Xưng hô & thuật ngữ: Tanya dùng 'Chúng tôi - ngài ... ạ'; giữ 'cơ chế an toàn'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000307"
    choices:
      - "Xưng hô & thuật ngữ: Calandro xưng 'tôi - cô'; giữ chức trách 'quan sát viên quân sự'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000308"
    choices:
      - "Điểm nhìn, đại từ & nhấn mạnh Markdown: trần thuật quy chiếu Tanya bằng 'nó' và tên 'Tanya' theo DEC-P01-001; bọc chính xác câu độc thoại nội tâm cuối đoạn '*Không đời nào có chuyện đó đâu*.' khớp thẻ em nguồn theo DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000309"
    choices:
      - "Đại từ trần thuật & phủ định: quy chiếu Calandro bằng 'ông', Tanya bằng 'nó', phía pháo binh bằng 'họ'; giữ cấu trúc nhượng bộ 'Cho dù ông có cố gặng hỏi đến đâu đi nữa, nó cũng không thể nói cho ông biết...'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000310"
    choices:
      - "Điểm nhìn nội tâm, giả định & thuật ngữ: độc thoại nội tâm dùng đại từ tự quy chiếu 'mình' theo DEC-P01-001; giữ 'hồ sơ chính thức', 'CV' và câu điều kiện giả định về nguy cơ để lại vết nhơ trong hồ sơ."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000311"
    choices:
      - "Đại từ khái quát: dùng 'bạn' cho chủ thể khái quát trong suy nghĩ về việc tự bảo toàn bản thân lâu dài và giữ gìn thể diện bề ngoài."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000312"
    choices:
      - "Cấu trúc điệp: giữ nhịp điệp ba danh ngữ 'Sơ yếu lý lịch hoàn hảo, sự nghiệp hoàn hảo, tương lai hoàn hảo.'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000313"
    choices:
      - "Thuật ngữ & xưng hô: giữ 'tín hiệu nhận dạng địch–ta', 'ân sủng của Thượng đế' và xưng hô 'tôi ... ạ'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000314"
    choices:
      - "Điểm nhìn, đại từ & cấu trúc lựa chọn: điểm nhìn ngôi thứ nhất của Tanya dùng 'mình' cho bản thân và 'ông' cho Calandro; giữ cặp liên từ lựa chọn 'hoặc là vì... hoặc là vì...'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000315"
    choices:
      - "Điểm nhìn nội tâm & đại từ: giữ đại từ 'mình' (Tanya) và 'ông' (Calandro)."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000316"
    choices:
      - "Xưng hô & thuật ngữ: trong lời than phiền thành tiếng, Tanya xưng 'Tôi' / 'mình'; giữ 'huấn luyện viên', 'tiền tuyến', 'quan sát viên' và 'Lục quân Đế quốc'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000317"
    choices:
      - "Đại từ & điều kiện: dùng 'chúng ta' trong câu điều kiện khép lại đoạn."
