      - "Thuật ngữ & xưng hô: 'maneuver battle' -> 'trận đánh cơ động'; Serebryakov gọi Tanya là 'thưa Trung tá'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000203"
    choices:
      - "Thuật ngữ, xưng hô & đối lập: 'aerial mage battalion' -> 'tiểu đoàn pháp sư trên không'; 'augmented [battalion]' -> 'tiểu đoàn tăng cường'; giữ đối lập giữa quân không hiểu việc (gây hại nhiều hơn cả quân địch) với chiều ngược lại (mang tới lợi thế vô cùng to lớn), và giữa quân số tiểu đoàn thông thường với kỳ vọng sức chiến đấu tương đương tiểu đoàn tăng cường."
