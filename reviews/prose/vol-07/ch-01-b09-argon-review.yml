  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000349"
    choices:
      - "Thoại mệnh lệnh, cấp bậc, chức vụ & xưng hô: Tanya cảm ơn Dirichlet bằng 'ông', ra lệnh cho 'Trung úy Serebryakov' đi cùng 'chúng tôi', giao đơn vị cho 'Thiếu tá Weiss' ('anh') và chỉ dẫn phối hợp với 'phó chỉ huy của Trung đoàn 54'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000350"
    choices:
      - "Điểm nhìn, chức vụ, tên riêng & đại từ: 'vice commander' -> 'vị phó chỉ huy'; gọi 'Tanya' và 'Dirichlet'; quy chiếu Dirichlet bằng 'ông'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000351"
    choices:
      - "Điểm nhìn & đại từ: câu độc thoại nội tâm ngôi thứ nhất số nhiều dùng 'bọn mình' theo DEC-P01-001 ('Vâng, bọn mình đang chạy đấy.')."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000352"
    choices:
      - "Thuật ngữ, tên riêng & tình thái: 'regimental headquarters' -> 'sở chỉ huy trung đoàn'; giữ nguyên 'Dirichlet'; giữ suy đoán điều kiện 'hẳn Dirichlet phải có thể lực rất sung mãn thì mới có thể chạy dọc con đường này trong điều kiện tồi tệ đến thế'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000353"
    choices:
      - "Điểm nhìn & đại từ: quy chiếu Dirichlet bằng 'ông ấy'; nội tâm ngôi thứ nhất số nhiều dùng 'bọn mình' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000354"
    choices:
      - "Thoại, đại từ & thuật ngữ: Tanya xưng 'tôi', dùng 'chúng ta' khi nói về vị trí chung cách 'tiền tuyến' ('the front lines') và dùng 'ông' – 'chúng tôi' khi nói việc Dirichlet dẫn đoàn của Tanya tới 'khu trại dã chiến' ('campsite')."
