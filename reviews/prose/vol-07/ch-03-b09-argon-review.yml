      - "Nhấn mạnh Markdown & nghĩa: bọc dấu sao chính xác cho '*Lại nữa hả?*' theo DEC-P01-002; giữ ý cái giá về mặt tinh thần của việc lễ phép nuốt ngược câu đó vào trong chẳng phải chuyện đùa."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000339"
    choices:
      - "Điểm nhìn nội tâm, nhấn mạnh Markdown & phủ định: tự quy chiếu dùng 'Mình' / 'mình' theo DEC-P01-001; chỉ bọc dấu sao duy nhất từ '*bitasen*' theo DEC-P01-002; giữ phủ định 'không bỏ sót một đồng *bitasen* nào đâu', mệnh đề điều kiện phủ định 'Nếu không lập hóa đơn đòi bằng hết...' và các thuật ngữ 'chi phí cơ hội', 'Bộ Tổng tham mưu'."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000340"
    choices:
      - "Xưng hô & câu hỏi: Calandro gọi Tanya là 'Cô' trong hai câu hỏi liên tiếp về việc gọi pháo kích vào khu dân cư."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000341"
    choices:
      - "Giọng thoại: giữ câu xác nhận lễ phép 'Vâng, đúng vậy ạ.' của Tanya."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000342"
    choices:
      - "Câu hỏi & liên kết từ vựng: giữ câu hỏi ngắn 'Thật sự đấy ư?' của Calandro, khớp mạch với sự nghi vấn ở p000344."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000343"
    choices:
      - "Xưng hô & giọng thoại: Tanya gọi Calandro là 'ngài' và giữ vẻ ngơ ngác hỏi lại 'Hả? Ờm, ý ngài là về chuyện gì cơ ạ?'."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000344"
    choices:
      - "Đại từ trần thuật/nội tâm, nhấn mạnh Markdown & câu hỏi tu từ: trần thuật gọi Tanya là 'nó', nội tâm dùng 'mình' và 'chúng ta' theo DEC-P01-001; bọc dấu sao toàn bộ câu hỏi nội tâm theo DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000345"
    choices:
      - "Nhấn mạnh Markdown, đại từ trần thuật, phủ định & thuật ngữ: chỉ bọc dấu sao từ '*Không.*' ở đầu đoạn theo DEC-P01-002; gọi Tanya là 'Nó' theo DEC-P01-001; giữ phủ định 'Calandro không phải người của Lục quân Đế quốc' và thuật ngữ 'văn hóa tổ chức'."
