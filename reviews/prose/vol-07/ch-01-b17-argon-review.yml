  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000082"
    choices:
      - "Thoại khen ngợi & quân hàm: giữ 'Một màn thể hiện xuất sắc, thưa Trung tá.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000083"
    choices:
      - "Quân hàm & xưng hô: giữ 'Thiếu úy Barchet đấy à? Tất cả là nhờ có sự yểm trợ của các anh cả thôi.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000084"
    choices:
