locked_choices:
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000035"
    choices:
      - "Xưng hô & quân hàm: Barchet gọi Tanya là 'Ngài', 'thưa Trung tá' và giữ câu hỏi cảm thán 'Ngài đúng là một con quái vật nhỉ, thưa Trung tá?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000036"
    choices:
      - "Thuật ngữ, xưng hô & câu hỏi tu từ: giữ 'Kẻ thù của tổ quốc', Tanya xưng 'tôi' gọi 'Anh' và câu hỏi 'Anh định bảo tôi phải nở một nụ cười trìu mến với chúng sao?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000037"
    choices:
      - "Cảm thán & đại từ trần thuật: giữ 'Thật là thất lễ quá đi!' và quy chiếu Tanya bằng 'Nó' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000038"
    choices:
      - "Xưng hô & đồng tình: giữ 'Vâng, ngài nói phải, thưa Trung tá.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000039"
    choices:
      - "Khẩu ngữ & quân hàm: giữ 'Quá chuẩn luôn, Trung úy.' nối tiếp cách gọi ở p000031 trước khi Barchet báo danh."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000040"
    choices:
      - "Thoại mệnh lệnh & xưng hô: giữ 'Rõ… Được rồi, anh em, làm tới thôi.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000041"
    choices:
      - "Trần thuật, phủ định & điều kiện: quy chiếu Barchet bằng 'anh ta'; giữ phủ định 'Không thể nhầm lẫn ý chí đó được' và điều kiện 'Nếu một người lính vẫn còn đủ sức để thở dài, anh ta coi như đạt yêu cầu.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000042"
    choices:
      - "Trần thuật: giữ 'Khẽ gật đầu hài lòng, Tanya chìa tay ra.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000043"
    choices:
      - "Câu hỏi tên & xưng hô: giữ 'Tốt, tốt lắm. Anh tên là gì, Trung úy?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000044"
    choices:
      - "Quân hàm & báo danh: giữ 'Thiếu úy Barchet xin nghe lệnh, thưa Trung tá.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000045"
    choices:
      - "Quân hàm, đại từ bao gộp & câu hỏi đuôi: chuyển sang gọi đúng bậc 'Thiếu úy Barchet' sau khi báo danh, dùng 'Chúng ta' và giữ 'Chúng ta bắt tay vào việc ngay chứ nhỉ?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000046"
    choices:
      - "Nhấn mạnh Markdown & trần thuật: chỉ bọc chữ nghiêng câu nội tâm '*Đến giờ làm việc rồi.*' theo đúng DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000047"
    choices:
      - "Đại từ, thuật ngữ & điều kiện: dùng 'chúng tôi' cho phe Tanya; giữ 'trận địa phía tây', mệnh đề nhượng bộ 'Kể cả có phải tách bớt một số pháp sư đi yểm trợ phòng ngự' và giả định 'biết đâu chúng tôi lại có thể dùng họ để bọc lót được phần lớn bên sườn'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000048"
    choices:
      - "Nhận định nội tâm: giữ 'Có một lý do để cảm thấy tràn trề hy vọng lúc nào cũng thật tuyệt diệu.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000049"
    choices:
      - "Đại từ khái quát, phủ định, thoại & đại từ trần thuật: dùng 'bạn' trong nhận định chung ('bạn cũng chẳng thể xem nhẹ'), giữ khẩu lệnh 'Theo tôi! Đi nào!' và quy chiếu Tanya bằng 'Nó' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000050"
    choices:
      - "Đại từ nội tâm, phủ định & ẩn dụ công sở: Tanya tự quy chiếu bằng 'Mình' theo DEC-P01-001; giữ 'chẳng mấy tin vào chuyện tinh thần thắng vật chất' và 'đám nô lệ công sở làm việc không não thì chỉ có thể tạo ra những thắng lợi rỗng tuếch mà thôi'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000051"
    choices:
      - "Đại từ & nhận định: giữ 'Chúng tôi sẽ chỉ việc dốc hết tâm sức vào công việc với tư cách là những thành viên của một xã hội loài người đàng hoàng.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000052"
    choices:
      - "Khẩu lệnh & đại từ bao gộp: giữ 'Tiến lên nào! Chúng ta sẽ phản kích!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000053"
    choices:
      - "Điều kiện & khẩu lệnh khích lệ: giữ 'Nếu có phải chết, chí ít cũng phải ngã xuống về phía trước!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000054"
    choices:
      - "Xưng hô, thuật ngữ & mệnh lệnh: giữ cách gọi 'Lũ đần các người', thuật ngữ 'pháp sư trên không', 'bộ binh' và mệnh lệnh 'Nhấc cái mông lên mà hành động đi! Chạy mau!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000055"
    choices:
      - "Nhấn mạnh Markdown, thuật ngữ & đại từ: giữ '*Hừ.*' in nghiêng theo DEC-P01-002, 'viên sĩ quan phụ tá' và đại từ 'cô' quy chiếu Serebryakov."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000056"
    choices:
      - "Đại từ, phủ định & thuật ngữ: giữ 'chúng ta chẳng bao giờ nên đóng vai một đội đốc chiến cả' và sắc thái khẩu ngữ 'hơi bị gay go đấy'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000057"
    choices:
      - "Dấu câu & giọng thoại cấp dưới: giữ dấu chấm lửng mở đầu và tiểu từ lễ phép 'ạ' của Serebryakov ('…Lúc nãy quả thực khá là căng thẳng ạ.')."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000058"
    choices:
      - "Nội tâm, dấu ngoặc kép & thuật ngữ: giữ câu hỏi ngắn 'Sao cơ? Thế thì có ăn nhằm gì đâu.', chữ '“thuyết phục”' trong ngoặc kép và phủ định 'mà không có nguy cơ bị bên Pháp chế réo tên'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000059"
    choices:
      - "Thành ngữ & phủ định: giữ 'Chuyện đó dễ như ăn kẹo, chẳng tốn lấy một giọt mồ hôi.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000060"
    choices:
      - "Đại từ khái quát & giọng mỉa mai: giữ 'Thậm chí bạn còn có thể gọi đó là một cuộc trò chuyện văn minh nữa kìa.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000061"
    choices:
      - "Trần thuật & dấu gạch ngang: giữ cấu trúc liệt kê việc tập hợp, tái tổ chức, nhắc nhở đám đông hỗn loạn và vế kết '—Tanya lại khá thích cái khoản đó.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000062"
    choices:
      - "Phủ định & trần thuật: giữ 'May thay, không còn cuộc tranh cãi nào khác nổ ra vào thời điểm cấp bách này.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000063"
    choices:
      - "Tình thái & thuật ngữ: giữ sắc thái 'biết đâu vẫn ổn thỏa', 'đơn vị lâm thời' và 'tuyến phòng ngự'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000064"
    choices:
      - "Ẩn dụ & trần thuật: giữ hình ảnh 'một con quái vật bất ngờ từ đâu chui ra, lộ nguyên hình dáng vẻ gớm ghiếc của nó'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000065"
    choices:
      - "Cấu trúc câu ngắn, phủ định & thuật ngữ: giữ hai cụm danh từ mở đầu 'Thân xác đồ sộ. Ngôi sao đỏ sơn trên mình.', phủ định 'Dù chưa từng tận mắt thấy nó bao giờ, chẳng một người lính nào ở mặt trận phía đông lại có thể nhìn nhầm' và 'Không ít người đã bắt đầu văng tục.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000066"
    choices:
      - "Thoại cảnh báo & câu hỏi: giữ 'Xe tăng! Đó là mẫu mới sao?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000067"
    choices:
      - "Thuật ngữ & phủ định: giữ 'pháp sư trên không', 'thuật thức phát nổ', 'màn khói ngụy trang' và nhận định phủ định 'ngoài việc tạo ra được đôi chút che chắn, đòn đánh ấy dường như chẳng hề có bất kỳ tác dụng nào khác'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000068"
    choices:
      - "Thoại chỉ huy, điều kiện & thuật ngữ: giữ điều kiện 'Chỉ cần chặn đứng được nó là ta có thể nện cho nó chết tươi!', tên 'Barchet' và mệnh lệnh 'Kéo pháo phòng không lên đây! Chúng ta có thể dùng chúng để xuyên thủng lớp giáp!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000069"
    choices:
      - "Đại từ nội tâm & nhận xét: Tanya tự quy chiếu bằng 'Mình' theo DEC-P01-001; giữ 'Mình xin rút lại lời khen vừa nãy. Xem ra anh ta đang đánh cuộc chiến này mà trong đầu chỉ độc một lối tư duy của bộ binh.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000070"
    choices:
      - "Quân hàm, xưng hô & ví von: Tanya gọi Barchet là 'Thiếu úy', xưng 'Tôi'/'bọn tôi' gọi 'anh', hô 'Các pháp sư, theo tôi!' và giữ hình ảnh 'cạy nắp chúng ra rồi hâm nóng chúng lên như đồ hộp khẩu phần vậy!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000071"
    choices:
      - "Đáp lệnh & quân hàm: giữ 'Rõ, thưa Trung tá!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000072"
    choices:
      - "Thuật ngữ, đại từ & so sánh: giữ 'các pháp sư trên không', 'tác chiến trong không gian ba chiều', đại từ 'Chúng tôi' và 'bạn', cùng hình ảnh 'những bệ vũ khí hình người mà bạn thường thấy trong truyện khoa học viễn tưởng'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000073"
    choices:
      - "Phủ định & thuật ngữ: giữ 'thổi tung phần nóc của một chiếc xe tăng', phủ định 'Điều đó chẳng hề thay đổi' và thuật ngữ 'trận tao ngộ chiến'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000074"
    choices:
      - "Quân hàm & mệnh lệnh: giữ 'Thiếu tá Weiss! Chừa lại vài phần nguyên vẹn để còn dùng nó làm vật che chắn nhé.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000075"
    choices:
      - "Xưng hô đáp lệnh: Weiss gọi Tanya là 'Ngài' và xưng 'tôi' ('Ngài cứ giao cả cho tôi!')."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000076"
    choices:
      - "Khẩu lệnh & đại từ bao gộp: giữ 'Quân địch đang hoảng sợ tháo chạy rồi! Đây là lúc chúng ta bắt đầu cuộc phản kích! Xung phong!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000077"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: chỉ bọc chữ nghiêng '*Quét sạch bọn chúng nào!*' theo DEC-P01-002 và giữ thuật ngữ 'đội đốc chiến'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000078"
    choices:
      - "Trần thuật & nhấn mạnh Markdown: chỉ bọc chữ nghiêng cụm '*Cuối cùng cũng xong*' theo đúng DEC-P01-002."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000079"
    choices:
      - "Nhượng bộ, điều kiện phủ định & thuật ngữ: giữ 'Cho dù quân địch có tấn công dưới sự chi viện của pháo binh đi chăng nữa, chừng nào chúng không có cả pháp sư trên không đi kèm thì cũng chẳng làm nên trò trống gì.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000080"
    choices:
      - "Thuật ngữ, dấu ngoặc kép & nhấn mạnh Markdown: giữ 'Đế quốc', chữ '“đồng chí”' trong ngoặc kép, 'Liên bang', từ in nghiêng '*lageri*' theo DEC-P01-002 và đại từ 'chúng tôi'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000081"
    choices:
