    choices:
      - "Điểm nhìn, đại từ & phủ định: giữ sự chuyển tiếp tự nhiên giữa đại từ nội tâm 'mình' ('I suppose') và đại từ trần thuật 'nó' ('she has to tell him') theo DEC-P01-001; giữ phủ định 'trên đời này làm gì tồn tại thứ tiện lợi như thế'."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000226"
    choices:
      - "Xưng hô, dấu chấm lửng & phủ định: Tanya gọi Calandro là 'ngài'; giữ hai cụm dấu chấm lửng ngắt nhịp ngập ngừng, thuật ngữ 'bản quốc', 'các quy trình tác chiến tiêu chuẩn' và mệnh đề phủ định 'hiện tại chúng vẫn chưa được thiết lập'."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000227"
    choices:
      - "Câu hỏi: giữ câu hỏi ngắn thể hiện sự ngạc nhiên của Calandro 'Thật vậy sao?'."
  - segment_id: "YS-LN07/Text/chapter010.xhtml/p000228"
    choices:
      - "Xưng hô, đại từ trần thuật & giả định trái thực tế: trong thoại Tanya xưng 'Tôi', trần thuật gọi Tanya là 'nó' theo DEC-P01-001; giữ trọn hai cấu trúc giả định trái thực tế ('mọi chuyện sẽ dễ dàng hơn biết bao nếu có những quy trình đó' và 'Giá như có một cách làm việc cứ chiếu theo sách vở mà áp dụng, nó có thể đơn giản làm theo đó và né được biết bao nhiêu là trách nhiệm')."
