  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000006"
    choices:
      - "Nhấn mạnh Markdown & đại từ trần thuật: giữ tiếng khịt mũi '*Hừ.*' in nghiêng theo đúng DEC-P01-002 và đại từ 'Nó' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000007"
    choices:
      - "Đại từ trần thuật, phủ định & trình tự hành động: quy chiếu Tanya bằng 'nó'/'mình' theo DEC-P01-001; giữ phủ định 'Chẳng mảy may bận tâm' và chi tiết 'chĩa súng ngang tầm mắt và đợi đến tận giây cuối cùng mới nhấc khẩu súng ngắn lên trời để bóp cò'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000008"
    choices:
      - "Đại từ trần thuật, quân hàm & xưng hô: quy chiếu Tanya bằng 'Nó'/'nó' theo DEC-P01-001; giữ danh xưng tự giới thiệu 'Trung tá Tanya von Degurechaff', đại từ ngôi thứ hai số nhiều 'các người' và mệnh lệnh 'Câm miệng lại và nghe đây!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000009"
    choices:
      - "Đại từ trần thuật & chuỗi câu hỏi: quy chiếu Tanya bằng 'nó'; giữ nguyên ba câu hỏi chất vấn về hành động, 'Vị trí chiến đấu của các người đâu?' và 'Ai là chỉ huy của các người?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000010"
    choices:
      - "Quân hàm, xưng hô & giọng lắp bắp: giữ 'Đ-Đại úy Ryan chết rồi! Ch-chúng tôi tiêu đời rồi!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000011"
    choices:
      - "Câu hỏi nội tâm & trần thuật: giữ câu hỏi mở đầu 'Sự căng thẳng đã vỡ òa rồi sao?', chi tiết 'đơn vị của họ đã bị xóa sổ, gương mặt tái nhợt một cách bất thường' và sắc thái đánh giá 'tên đần độn đang hoảng loạn trước tình thế chênh lệch không sao vượt qua nổi ấy'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000012"
    choices:
      - "Phủ định kép: giữ 'Không thể phủ nhận rằng đây sẽ là một trận chiến cam go.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000013"
    choices:
      - "Câu hỏi tu từ ngắn: giữ 'Nhưng thế thì đã sao nào?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000014"
    choices:
      - "Nhận định phủ định: giữ 'Đằng nào thì bỏ chạy cũng có giúp ích được gì đâu.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000015"
    choices:
      - "Ẩn dụ, điều kiện & đại từ khái quát: giữ hình ảnh 'lũ chuột lemming', đại từ khái quát 'bạn' và mệnh đề điều kiện so sánh 'Nếu bạn chỉ định lao đầu xuống nước rồi chết đuối, thì việc chiến đấu đến cùng xem ra còn có triển vọng hơn.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000016"
    choices:
      - "Đại từ trần thuật, phân biệt ngôi xưng & thuật ngữ: quy chiếu Tanya bằng 'nó' trong trần thuật; trong thoại Tanya xưng 'tôi'/'chúng tôi', phân biệt rõ một người lính trước mặt ('Anh kia', 'Anh') với cả đám đông ('các người'); giữ 'lính Đế quốc', 'lính Liên bang' và 'trận địa phía tây'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000017"
    choices:
      - "Đại từ trần thuật & tên nhân vật: quy chiếu Tanya bằng 'nó'/'mình' theo DEC-P01-001; giữ 'Serebryakov và những người khác dường như hiểu ngay ẩn ý của nó—họ đặt ngón tay lên cò vũ khí.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000018"
    choices:
      - "Nhận định tình huống: giữ 'Người đưa ra lời cảnh cáo và những kẻ nhận lời cảnh cáo đều là quân nhân cả. Ai nấy đều hiểu chuyện gì đang diễn ra.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000019"
    choices:
      - "Đại từ trần thuật & điều kiện: quy chiếu Tanya bằng 'nó' theo DEC-P01-001; giữ mệnh đề điều kiện phủ định 'Nếu nó không cần phải giải thích từng li từng tí, mọi chuyện sẽ tiến triển nhanh hơn.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000020"
    choices:
      - "Thuật ngữ & giọng thoại: giữ 'những người lính Đế quốc', 'một trận địa cần phải giữ vững' và kết luận 'Chuyện gì cần phải làm đã quá rõ ràng.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000021"
    choices:
      - "Phủ định & điều kiện phủ định: giữ 'Điều này không thể gọi là một lời đe dọa được' và 'những kẻ ngốc không tài nào lấy lại nổi sự bình tĩnh nếu không bị họng súng chĩa vào người'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000022"
    choices:
      - "Phủ định kép & đại từ: giữ 'luôn không đạt nổi mức kỳ vọng thấp nhất của những người biết suy nghĩ hợp lý như Tanya', phủ định kép 'Chẳng có gì đảm bảo sẽ không có một tên điên loạn ngu xuẩn nào đó' và đại từ 'chúng tôi'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000023"
    choices:
      - "Câu hỏi lựa chọn & thuật ngữ: giữ 'Các người là kẻ địch? Hay các người là Lục quân Đế quốc, giống như chúng tôi?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000024"
    choices:
      - "Xưng hô & phủ định: lính gọi Tanya là 'Ngài', 'thưa Trung tá' và tự xưng 'chúng tôi'; giữ câu cảm thán phủ định 'Chúng tôi chẳng thể làm gì được nữa cả!'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000025"
    choices:
      - "Xưng hô, thuật ngữ & câu hỏi lựa chọn: Tanya xưng 'Tôi'/'chúng tôi' và gọi đám lính là 'các người'; giữ 'chuyên viên tư vấn tâm lý', cặp câu hỏi lựa chọn 'cùng chúng tôi tái chiếm trận địa' hay 'chống trả chúng tôi với tư cách là kẻ địch' và phủ định 'Tôi không thể đợi cả ngày được đâu.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000026"
    choices:
      - "Dấu câu & xưng hô: giữ dấu chấm lửng mở đầu và đại từ tôn xưng 'Ngài'/'ngài' trong hai câu hỏi."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000027"
    choices:
      - "Đại từ bao gộp & tình thái: dùng 'Chúng ta' để lôi kéo binh sĩ cùng tham gia giữ trận địa ('Chúng ta cần phải cứu vãn trận địa của mình ngay tức khắc.')."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000028"
    choices:
      - "Trần thuật & sắc thái: giữ 'vài gương mặt biết giật mình tỉnh ngộ', 'đám tàn quân tả tơi' và 'nét mặt vừa vặn đủ coi là quân nhân sẽ được giữ làm bí mật'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000029"
    choices:
      - "Đại từ & điều kiện: dùng 'chúng tôi' cho nhóm của Tanya; giữ điều kiện 'Nếu chúng tôi có thể tìm thêm được người hướng dẫn chỉ huy, mọi việc sẽ dễ dàng hơn. Người chỉ huy phải gánh vác rất nhiều trách nhiệm.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000030"
    choices:
      - "Đại từ khái quát & giọng mỉa mai: dùng 'bạn' cho chủ ngữ khái quát và giữ câu hỏi đuôi 'Một hành động thật giàu tính nhân văn, phải không nào?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000031"
    choices:
      - "Quân hàm, xưng hô & mệnh lệnh: Tanya gọi viên sĩ quan là 'Trung úy', xưng hô 'anh' và ra lệnh 'tập hợp thuộc hạ của anh lại đi'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000032"
    choices:
      - "Dấu câu & thoại ngập ngừng: giữ '“T—Tôi…”'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000033"
    choices:
      - "Thuật ngữ, nhượng bộ & đại từ khái quát: giữ danh sách 'Cấp hiệu, tuổi tác, cuống huân chương.', đại từ khái quát 'bạn' và mệnh đề nhượng bộ 'Ngay cả khi bạn không thực sự đánh giá được giá trị của một con người qua tấm phù hiệu, đó vẫn là một tiêu chí có thể dùng để đưa ra quyết định.'"
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000034"
    choices:
      - "Xưng hô, điều kiện đe dọa & nhấn mạnh Markdown: Tanya xưng 'tôi' và gọi viên trung úy là 'anh'; giữ câu hỏi tu từ 'Chẳng phải anh đã đi lên từ hàng ngũ lính trơn hay sao?', lời đe dọa 'Nếu không làm nổi, tôi sẽ cho anh yên nghỉ ngàn thu ngay tại đây đấy!' và chỉ bọc chữ nghiêng phần thông điệp không lời '*Cố lên nào, anh làm được mà*' theo đúng DEC-P01-002."
