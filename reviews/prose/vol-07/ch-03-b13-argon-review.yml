    category: "tone_and_meaning"
    issue: "Âm phản ứng đi kèm cái nhăn mặt của Tanya trước câu hỏi gài bẫy của Đại tá Calandro được dịch là 'Ừm.' dễ bị hiểu thành lời xác nhận suồng sã (lệch sắc thái kính trọng 'tôi - ngài ... ạ' xuyên suốt của Tanya và làm mờ mạch dẫn sang câu truy vấn ở p000122); ngoài ra phần trần thuật cuối câu tự thêm chi tiết giải thích ngoài văn bản gốc."
    evidence: "Đối chiếu từ cảm thán ngắn và cụm động từ chỉ hướng phản ứng ở p000121 trong mạch thoại p000120–p000122."
    recommendation: "Đổi thành âm cảm thán/ngập ngừng như 'Hừm.' hoặc 'Ưm.', và dịch sát vế trần thuật là 'Tanya khẽ nhăn mặt nhìn ông.' (hoặc 'Tanya khẽ nhăn mặt với ông.')."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000142"
    severity: "minor"
    category: "meaning_precision"
    issue: "Cụm từ chỉ sự việc vượt ngoài khả năng lý giải/nhận thức của Đại tá Calandro khi trực tiếp chứng kiến cảnh tượng trước mắt được dịch là 'vượt quá sức tưởng tượng của ông', làm lệch nhẹ bình diện nhận thức vì nhân vật đã từng đọc báo cáo và đang nhìn thấy sự việc ngay trước mắt."
    evidence: "Đối chiếu danh từ chỉ sự thấu hiểu/nhận thức ở cuối đoạn p000142."
    recommendation: "Đổi 'vượt quá sức tưởng tượng của ông' thành 'vượt quá khả năng thấu hiểu của ông' hoặc 'nằm ngoài sức hiểu biết của ông'."
