    issue: "Câu đầu hiện dịch là 'Ông ấy từ chối trả lời một cách vòng vo.' dễ bị đọc lướt theo nghĩa Rudersdorf khước từ lối nói vòng vo (tức trả lời thẳng), trong khi theo mạch p000203, p000205 và p000209 thì ông dùng câu hỏi tu từ để khéo léo/vòng vo từ chối đưa ra câu trả lời trực diện."
    evidence: "Đối chiếu hành vi né câu hỏi trực diện bằng câu hỏi tu từ ở p000203 và nhận định về việc ngầm thừa nhận giới hạn ở p000205, p000209."
    recommendation: "Ở lượt chuốt văn có thể cân nhắc đảo trật tự thành 'Ông ấy khéo léo từ chối trả lời một cách vòng vo.' hoặc 'Ông ấy dùng lối nói vòng vo để từ chối trả lời thẳng.' nhằm tránh lưỡng nghĩa."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter022.xhtml/p000222"
    issue: "Cách gọi ngôi thứ hai số ít đứng độc lập ở đầu câu hỏi '…Vị vừa nói gì cơ?' hơi kém tự nhiên trong tiếng Việt so với khi có từ chỉ định đi kèm ('vị đây') hoặc dùng 'Các vị' / 'Ông' / 'Ngài'."
    evidence: "Đối chiếu cách xưng hô giữa Zettour và các công chức dân sự xuyên suốt chương 6 (p000178, p000180, p000220)."
    recommendation: "Ở lượt chuốt văn có thể cân nhắc chỉnh nhẹ thành '…Ông vừa nói gì cơ?', '…Ngài vừa nói gì cơ?' hoặc '…Các vị vừa nói gì cơ?'."
