findings:
  - severity: "moderate"
    segment_id: "YS-LN07/Text/chapter016.xhtml/p000300"
    issue: "Đại từ nhân xưng ở câu cuối dịch thành 'Cả anh lẫn Rudersdorf' làm lệch chủ thể quy chiếu sang Trung tá Uger ('anh'), trong khi xét theo mạch điểm nhìn của Zettour và cặp bài trùng tại Bộ Tổng tham mưu thì chủ thể cùng Rudersdorf sắp sửa nhìn xa xăm vì ngán ngẩm trước bài toán cân bằng giữa quyết đoán và thận trọng chính là Zettour ('ông'). Ngoài ra, cụm 'phóng ánh mắt thất thần' hơi nặng nề so với sắc thái đưa mắt nhìn xa xăm đầy ngẫm ngợi."
    evidence: "Mệnh đề đầu câu cuối đặt nhân vật trong thế song hành với Rudersdorf trước khi chuyển sang mệnh đề đối lập nêu đích danh Zettour mỉm cười nhạt; trong toàn cảnh, Zettour được quy chiếu bằng đại từ 'ông' còn Uger là 'anh'."
    recommendation: "Đổi 'Cả anh lẫn Rudersdorf trông đều như sắp sửa phóng ánh mắt thất thần nhìn vào khoảng không xa xăm' thành 'Cả ông lẫn Rudersdorf trông đều như sắp sửa đưa ánh mắt trống rỗng nhìn vào khoảng không xa xăm' (hoặc 'đưa mắt nhìn xa xăm')."
  - severity: "moderate"
    segment_id: "YS-LN07/Text/chapter016.xhtml/p000312"
    issue: "Từ 'ngụy trang' ở cả hai vế ('bày trò ngụy trang, vả lại ngụy trang cũng là phạm quy') dễ gây hiểu lầm thành hoạt động ngụy trang quân sự trên chiến trường (vốn không hề phạm quy), trong khi văn cảnh đang nối tiếp ý định bông đùa của Tanya ở p000310 là mạo danh/đóng giả Đại tá von Lergen để từ chối yêu cầu."
    evidence: "Ở p000310, Tanya nửa đùa nửa thật rằng muốn lấy danh nghĩa Đại tá von Lergen để trả lời khước từ; p000312 giải thích lý do nó bỏ qua ý định đó vì không có thời gian, sức lực để đóng giả/mạo danh và hành vi ấy vi phạm quy tắc."
    recommendation: "Đổi hai từ 'ngụy trang' thành 'giả dạng' (hoặc 'mạo danh'): 'Dẫu vậy, nó chẳng có thời gian hay sức lực đâu mà bày trò giả dạng, vả lại giả dạng cũng là phạm quy.'"
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter016.xhtml/p000302"
    issue: "Thán từ '“Hả?”' của Trung tá Uger khi đáp lại Trung tướng von Zettour nghe hơi suồng sã so với thái độ lễ phép, chuẩn mực của Uger đối với cấp trên ở p000298 và p000300."
    evidence: "Nguyên bản là thán từ ngắn biểu thị sự ngạc nhiên của cấp dưới khi chưa bắt kịp ý của vị tướng cấp trên."
    recommendation: "Đổi '“Hả?”' thành '“Dạ?”' (hoặc '“Sao cơ ạ?”')."
