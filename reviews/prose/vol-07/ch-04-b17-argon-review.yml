findings:
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000472"
    severity: "minor"
    category: "clarity_and_meaning"
    issue: "Cụm 'khi bạn nằm ở vế một trong phương trình ấy' ở câu thứ hai dùng từ 'vế một' dễ khiến người đọc hiểu nhầm thành 'vế thứ nhất' của một phương trình toán học, trong khi ý nghĩa thực tế đang quy chiếu về con số '1' trong tỷ lệ tương quan lực lượng một chọi ba đã nêu ở câu trước (phe bao vây tại trận Dyrrhachium chỉ có quân số bằng một phần ba đối phương)."
    rationale: "Làm rõ mối liên hệ quy chiếu với tỷ lệ một chọi ba để người đọc nắm bắt ngay logic lịch sử quân sự mà không bị nhiễu nghĩa toán học."
    suggested_fix: "Đổi câu thứ hai thành: 'Rất khó để đánh một trận vây hãm khi bạn là bên chỉ có một phần quân số trong bài toán ấy.' hoặc 'Rất khó để đánh một trận vây hãm khi bạn nằm ở phía con số một trong tương quan ấy.'"
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000474"
    severity: "minor"
    category: "modality_and_nuance"
    issue: "Ở câu đầu tiên, mức độ tình thái chỉ khả năng cao ('likely to win') đang được dịch đẩy lên mức khẳng định tuyệt đối ('là phe nắm chắc phần thắng'), làm trùng lặp và xóa nhòa sự chuyển tiếp sang khẳng định chắc chắn ở câu thứ hai ('là cách làm đơn giản nhưng chắc ăn')."
    rationale: "Giữ đúng mức độ chắc chắn của từng nhận định trong lập luận theo canon/style-guide.md."
    suggested_fix: "Đổi 'là phe nắm chắc phần thắng' ở câu đầu thành 'là phe nắm phần thắng cao' hoặc 'nhiều khả năng sẽ giành chiến thắng'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000481"
    severity: "minor"
    category: "orthography_and_register"
    issue: "Cách lặp chữ có dấu thanh 'Ồồồ' trong lời thoại của Tanya trông thiếu tự nhiên theo chuẩn chính tả tiếng Việt."
    rationale: "Viết tiếng Việt tự nhiên, chuẩn xác trong lời thoại chỉ huy khi Tanya chợt đổi ý."
    suggested_fix: "Đổi 'Ồồồ, không, khoan đã.' thành 'Ồ, không, khoan đã.' hoặc 'À, không, khoan đã.'"
