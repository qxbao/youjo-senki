  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000085"
    choices: "Thoại của Tanya với nhóm Barchet: xưng 'bọn tôi', gọi 'các anh'; giữ câu hỏi bàn giao quyền phụ trách trận địa."
