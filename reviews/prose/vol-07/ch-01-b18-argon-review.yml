    choices: "Thoại của Thiếu úy Barchet với Trung tá Tanya: xưng 'tôi', gọi 'ngài', có kính ngữ 'ạ'; giữ lời hẹn mời một chầu rượu sau trận."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000087"
    choices: "Thoại của Tanya với Barchet: xưng 'tôi', gọi 'anh'; giữ phủ định chưa được phép uống đồ có cồn và đề nghị đổi sang cà phê thượng hạng."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000088"
    choices: "Trần thuật: dùng đại từ 'nó' cho Tanya theo DEC-P01-001; giữ phủ định kép 'cả quân luật lẫn luật dân sự đều sẽ chẳng bảo vệ cho nó' và chi tiết cấm trẻ vị thành niên uống rượu, hút thuốc."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000089"
    choices: "Thoại của Barchet với Tanya: xưng 'tôi', có kính ngữ 'ạ'; giữ câu hỏi gợi ý sữa hoặc thịt từ miền đông."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000090"
    choices: "Thoại của Tanya với Barchet: xưng 'tôi'; giữ lựa chọn dứa đóng hộp và lời cáo từ."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000091"
    choices: "Nội tâm Tanya: giữ nhấn mạnh Markdown '*Ha-ha-ha.*' theo DEC-P01-002; khóa tên 'Barchet' và ý chuyển nhanh sang nhiệm vụ tiếp theo."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000092"
    choices: "Thoại vô tuyến của Tanya: giữ mã gọi '02' và câu hỏi kiểm tra tình trạng đơn vị 'tình hình bên ta thế nào?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000093"
    choices: "Thoại báo cáo của 02 (Weiss): xưng 'chúng ta'; giữ nguyên thông tin không có tổn thất, ba người bị thương nhẹ và phủ định mất sức chiến đấu."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000094"
    choices: "Thoại và trần thuật: trong thoại xưng 'chúng ta', khóa 'tuyến phòng ngự', 'Quân đội Liên bang'; trong trần thuật dùng 'nó' cho Tanya, giữ sự tự hiệu chỉnh sắc thái từ 'công việc dễ dàng' sang 'thong thả hơn'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000095"
    choices: "Trần thuật phân tích: khóa 'các pháp sư trên không của Đế quốc', 'Sư đoàn pháo binh', 'đợt pháo kích mở màn'; giữ điều kiện phủ định về pháp sư địch và hai khả năng phán đoán (cạn đạn hoặc đang thiết lập trận địa)."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000096"
    choices: "Trần thuật: giữ cấu trúc phủ định 'vẫn chưa có chuyện gì xảy ra để bác bỏ giả thuyết đó'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000097"
    choices: "Thoại của Tanya: giữ sắc thái cảm thán nhẹ và câu hỏi phỏng đoán kết thúc giao tranh tạm thời."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000098"
    choices: "Trần thuật: khóa thuật ngữ 'phòng ngự nội tuyến'; giữ hai mệnh đề kết quả (đẩy lùi đợt tấn công, tiêu diệt đơn vị địch xâm nhập)."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000099"
    choices: "Thoại của Weiss với Tanya: gọi 'Thưa Trung tá', xưng 'tôi'; khóa 'phó chỉ huy của Trung đoàn 54'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000100"
    choices: "Thoại tự giới thiệu của Kreisler: khóa danh xưng 'Trung tá Kreisler' và lời cảm ơn hỗ trợ."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000101"
    choices: "Thoại đáp lễ của Tanya: xưng 'Tôi', khóa danh xưng 'Trung tá Degurechaff'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000102"
    choices: "Trần thuật: giữ tên 'Weiss' và nhận định việc cử Weiss đi thương lượng giúp trao đổi suôn sẻ."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000103"
    choices: "Nội tâm Tanya: dùng đại từ tự quy chiếu 'mình' theo DEC-P01-001; giữ đúng giả định trái thực tế ở quá khứ 'hẳn đã trôi chảy hơn nhiều nếu mình không cử...'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000104"
    choices: "Nội tâm và trần thuật: câu hỏi tự vấn mở đầu, tiếp theo là trần thuật dùng đại từ 'nó' cho Tanya."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000105"
    choices: "Thoại của Tanya với Kreisler: xưng 'tôi'/'chúng tôi', gọi Kreisler là 'ngài', gọi Barchet là 'Thiếu úy Barchet'/'anh ấy'; giữ chi tiết xuất thân đề bạt từ binh sĩ và ý muốn xin người về đơn vị."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000106"
    choices: "Thoại của Kreisler với Tanya: xưng 'tôi', gọi Tanya là 'cô', gọi Barchet là 'cậu ấy'; bắt buộc giữ dấu hiệu thời quá khứ 'từng thuộc tiểu đoàn của tôi' để khớp với đoạn sau."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000107"
    choices: "Thoại và trần thuật: dùng 'nó' cho Tanya, 'ông ta' cho Kreisler; giữ nhận xét trực tiếp về cách dùng thì quá khứ."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000108"
    choices: "Thoại của Kreisler: xưng 'Tôi', gọi Barchet là 'cậu ấy'; khóa tên 'Huy hiệu Xung kích Cánh Bạc' và tình thái giả định tiếc nuối."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000109"
    choices: "Thoại câu hỏi ngập ngừng của Tanya với Kreisler: '…Ý ngài là?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000110"
    choices: "Thoại của Kreisler: khóa 'đợt phản kích', 'lựu đạn của quân Liên bang', 'bác sĩ phẫu thuật'; giữ câu bỏ lửng ở cuối."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000111"
    choices: "Trần thuật: giữ đúng phạm vi nhấn mạnh Markdown '*Chúng tôi không cứu được cậu ấy*' theo DEC-P01-002; khóa 'mặt trận phía đông'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000112"
    choices: "Thoại tưởng niệm của Tanya: xưng 'Tôi', gọi Barchet là 'Anh ấy'/'anh ấy', khóa lời cầu nguyện 'Hỡi Chúa' và nhịp đối lập 'Anh ấy yên nghỉ; tôi bước tiếp'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000113"
    choices: "Thoại của Kreisler: xưng 'tôi'/'chúng tôi', gọi phía Tanya là 'Bên cô'; khóa thuật ngữ 'điểm tập kết'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000114"
    choices: "Nội tâm chuyển sang trần thuật: nội tâm dùng 'ông ta', 'chúng tôi' và tự quy chiếu 'Mình' theo DEC-P01-001; câu cuối chuyển về trần thuật khách quan 'Tanya lại lắc đầu'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000115"
    choices: "Trần thuật/nhận định chiến thuật: giữ phủ định 'Không một đơn vị pháp sư trên không nào lại nên hành quân chung đường với một đơn vị bộ binh cả'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000116"
    choices: "Thoại của Tanya với Kreisler: xưng 'tôi'/'Chúng tôi', gọi phía Kreisler là 'các ngài'; khóa 'pháp sư trên không', 'lực lượng đoạn hậu', 'điểm tập kết'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000117"
    choices: "Thoại của Kreisler với Tanya: xưng 'Tôi', gọi 'cô'; giữ câu hỏi xác nhận lại."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000118"
    choices: "Thoại khẳng định ngắn của Tanya: 'Tất nhiên rồi.'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000119"
    choices: "Trần thuật: giữ tên 'Tanya' và chi tiết đáp lại bằng nụ cười tươi."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000120"
    choices: "Trần thuật phân tích: khóa 'các đơn vị pháp sư trên không', 'bắn rồi vọt', 'mặt trận phía đông', 'phòng ngự có chiều sâu', 'trận phòng ngự tĩnh'; giữ mệnh đề nhượng bộ ở cuối câu."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000121"
    choices: "Trần thuật: khóa nguyên dạng 'Kampfgruppe'; giữ phủ định về sức hấp dẫn của việc chung số phận với đơn vị khác."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000122"
    choices: "Thoại của Tanya với Kreisler: xưng 'chúng tôi', gọi 'ngài'; khóa 'Trung đoàn 54' và sắc thái đùa hóm hỉnh về việc xin lại khẩu phần hảo hạng."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000123"
    choices: "Thoại của Kreisler với Tanya: gọi 'cô', khóa 'tấm Cánh Bạc'; giữ câu hỏi phủ định 'không phải chỉ để làm cảnh đâu nhỉ?'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000124"
    choices: "Thoại của Tanya với Kreisler: giữ câu đáp khiêm tốn/bông đùa 'chắc chắn là để làm cảnh đấy' bám sát khẳng định trong nguồn; khóa cách gọi 'Trung tá Kreisler'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000125"
    choices: "Thoại chúc tạm biệt của Kreisler với Tanya: gọi 'cô'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000126"
    choices: "Trần thuật: khóa 'chào điều lệnh', 'Tanya', 'Tiểu đoàn Pháp sư Trên không số 203'."
  - segment_id: "YS-LN07/Text/chapter004.xhtml/p000127"
