    issue: "Đại từ ngôi thứ ba chỉ Ác quỷ sông Rhine trong lời báo cáo của Trung tá Drake ('Có dấu hiệu cho thấy ả đang hoạt động ở mặt trận phía đông.') dùng từ 'ả' mang sắc thái miệt thị khá nặng, chưa thật khớp với giọng điệu điềm đạm, chuẩn mực của một sĩ quan Khối Thịnh vượng chung khi trao đổi công việc và nguyên bản chỉ dùng đại từ trung tính."
    evidence: "Theo canon/style-guide.md về việc không tự thêm sắc thái miệt thị không có trong nguồn và giữ giọng thoại nhất quán với nhân vật Drake."
    recommendation: "Đổi 'ả' thành 'cô ta' (hoặc 'kẻ đó'): 'Có dấu hiệu cho thấy cô ta đang hoạt động ở mặt trận phía đông.'"
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000299"
    issue: "Quan hệ cú pháp trong mệnh đề điều kiện ('Nếu quân du kích và các pháp sư cố thủ ngay tại gốc rễ của các tuyến giao thông liên lạc hoặc một bàn đạp kháng cự có tổ chức...') đang biến cụm động từ chỉ hành động kháng cự có tổ chức thành định ngữ của 'một bàn đạp', làm mờ hành động phát động kháng cự có tổ chức sau khi cố thủ tại huyết mạch giao thông hoặc cứ điểm bàn đạp."
    evidence: "Theo canon/style-guide.md về việc giữ đúng quan hệ logic và điều kiện giữa các vế câu; đối chiếu tiền đề về sự kiện Arene ở p000290–p000292."
    recommendation: "Tách rõ cụm trạng ngữ vị trí cố thủ và hành động kháng cự có tổ chức: 'Nếu quân du kích và các pháp sư cố thủ ngay tại gốc rễ của các tuyến giao thông liên lạc hoặc một cứ điểm bàn đạp rồi tiến hành kháng cự có tổ chức, một đơn vị vũ trang hạng nặng sẽ xuất hiện.'"
