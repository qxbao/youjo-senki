      - "Nhấn mạnh Markdown, đại từ & thuật ngữ: chỉ bọc '*Nhưng…*' khớp thẻ em nguồn theo DEC-P01-002; trần thuật gọi 'Tanya' và quy chiếu bằng 'Nó' theo DEC-P01-001; 'the Commies' -> 'lũ Cộng sản', 'Being X' -> 'Being X'; sửa thuật ngữ 'human engineering' thành 'kỹ thuật yếu tố con người' (hoặc 'công thái học') theo finding."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000181"
    choices:
      - "Nhấn mạnh Markdown, đại từ nội tâm & phủ định kép: chỉ bọc '*nên*' khớp thẻ em nguồn theo DEC-P01-002; nội tâm tự quy chiếu của Tanya dùng 'mình' theo DEC-P01-001; giữ cấu trúc phủ định kép 'Sẽ thật thiếu công bằng nếu không khen ngợi chúng vì đã có dũng khí tiến sát tới tận mép vực thẳm.'"
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000182"
    choices:
      - "Xưng hô, quân hàm & sắc thái: Tanya xưng 'tôi', gọi 'Đại tá Calandro' và quy chiếu bằng 'ngài ấy' với sắc thái mỉa mai lịch sự ('trái tim thượng tôn pháp luật của ngài ấy')."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000183"
    choices:
      - "Sắc thái khẩu ngữ: giữ cách gọi 'của nợ đó' và đại từ 'chúng ta' trong câu nói riêng của Weiss."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000184"
    choices:
      - "Quân hàm, xưng hô & tình thái: Tanya gọi 'Thiếu tá Weiss' và 'Anh'; giữ tình thái cảnh báo 'Anh có thể gây ra sự cố ngoại giao quốc tế đấy.'"
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000185"
    choices:
      - "Xưng hô & thuật ngữ: Weiss xưng 'tôi'; 'the front line and the rear' -> 'tiền tuyến và hậu phương'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000186"
    choices:
      - "Nhấn mạnh Markdown, tôn ti xưng hô & đại từ: lược bỏ tiểu từ 'ạ' trong câu Tanya nói với cấp dưới ('Tôi cũng vậy, Thiếu tá.') theo finding; chỉ bọc '*Nhưng mà nói thật đấy.*' khớp thẻ em nguồn theo DEC-P01-002; giữ cách quy chiếu Calandro là 'ngài ấy' trong thoại của Tanya."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000187"
    choices:
      - "Xưng hô & thuật ngữ: Weiss dùng 'ạ' và xưng 'tôi'; 'international laws and standards' -> 'luật pháp và các quy chuẩn quốc tế'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000188"
    choices:
      - "Nhấn mạnh Markdown, đại từ & phủ định: chỉ bọc '*Chính xác*' khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Calandro bằng 'ông', Tanya bằng 'nó' theo DEC-P01-001; giữ phủ định 'và nó chẳng ưa chuyện đó chút nào'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000189"
    choices:
      - "Xưng hô & quan hệ nhân quả: Tanya xưng 'Tôi' / 'tôi', giữ quan hệ nhân quả 'Tôi hiểu biết rất rõ về luật pháp, nên tôi chẳng muốn bị gọi là kẻ man rợ đâu.'"
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000190"
    choices:
      - "Tiêu đề thời gian - địa điểm: giữ nguyên chữ in hoa 'NGÀY 3 THÁNG 5 NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, GẦN TIỀN TUYẾN, NƠI ĐỒN TRÚ CỦA KAMPFGRUPPE'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000191"
    choices:
      - "Nhấn mạnh Markdown & tình thái: chỉ bọc '*một giấc ngủ mừng chiến thắng trong tòa nhà vừa chiếm được*' khớp thẻ em nguồn theo DEC-P01-002; giữ đối lập 'Nếu gọi đó là... thì nghe có vẻ ngầu đấy. Nhưng thực tế...'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000192"
    choices:
      - "Đại từ trần thuật & thuật ngữ: gọi tên 'Tanya' và quy chiếu bằng 'nó' theo DEC-P01-001; 'headquarters' -> 'sở chỉ huy'; giữ cấu trúc thời gian 'đúng lúc Tanya đang... thì nó nhận được...'."
