  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000429"
    choices:
      - "Thoại, quân hàm, xưng hô & câu hỏi tu từ: cấp dưới tự xưng 'tôi', gọi Tanya là 'Trung tá' kèm 'ạ'; giữ câu hỏi tu từ từ chối hỏi một câu thiếu tế nhị."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000430"
    choices:
      - "Thoại & xưng hô: Tanya gọi đám cấp dưới là 'Các người' với giọng cằn nhằn vì họ để ý chuyện tế nhị không đúng lúc."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000431"
    choices:
      - "Trần thuật, đại từ & nhấn mạnh Markdown: chỉ bọc '*Hả?*' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; quy chiếu Tanya bằng 'nó' theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000432"
    choices:
      - "Thoại vô tuyến, xưng hô & câu hỏi: Tanya xưng danh 'Salamander 01', tự xưng 'Tôi', gọi đơn vị bạn là 'các anh'; giữ hai câu hỏi đối chiếu ('Quân địch không bắn vào các anh sao? Hay là chúng có bắn nhưng vì lý do nào đó mà lại trượt?')."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000433"
    choices:
      - "Trần thuật, đại từ & phủ định: quy chiếu Tanya bằng 'nó' theo DEC-P01-001; giữ phủ định 'không gặp bất kỳ trục trặc nào'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000434"
    choices:
      - "Trần thuật, đại từ & nhấn mạnh Markdown: chỉ bọc câu nội tâm đầu '*…Chuyện này vẫn kỳ quặc lắm.*' trong dấu sao khớp thẻ em nguồn theo DEC-P01-002; phần trần thuật sau dùng 'nó' cho Tanya theo DEC-P01-001."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000435"
    choices:
      - "Thoại vô tuyến & điều kiện: giữ giọng bức xúc của đơn vị dưới mặt đất ('Các người đùa đấy à!') và mệnh đề điều kiện 'nếu trúng đạn thì sẽ là cả một thảm họa đấy!'."
  - segment_id: "YS-LN07/Text/chapter008.xhtml/p000436"
    choices:
      - "Thoại & phủ định: Tanya xác nhận 'Đã rõ' và tóm tắt suy luận của mình kèm phủ định giảm nhẹ ở vế sau ('nhưng khả năng bị bắn trúng lại không cao lắm')."
