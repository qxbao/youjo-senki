    issue: "Thời gian của giả định trong lời van nài của Mary đang dịch thành quá khứ hoàn tất ('Chúng ta đã có thể giải phóng quê hương tôi rồi!'), trong khi tại thời điểm thoại đơn vị vẫn chưa rút đi (đối chiếu p000232, p000236, p000242) và Mary đang thuyết phục Drake giữ nguyên vị trí hiện tại để tiếp tục chiến đấu."
    evidence: "Theo canon/style-guide.md về việc giữ đúng thời gian của giả định; mạch ngữ cảnh p000232–p000242 cho thấy lệnh rút lui vừa mới được thông báo và Mary đang xin bám trụ lại ngay lúc này."
    recommendation: "Bỏ cặp từ chỉ quá khứ đã qua ('đã... rồi'), chỉnh thành giả định ở hiện tại/tương lai: 'Chỉ cần chúng ta chịu bám trụ lại thôi! Chúng ta có thể giải phóng quê hương tôi mà!' (hoặc 'Giá như chúng ta cứ bám trụ! Chúng ta sẽ có thể giải phóng quê hương tôi!')."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000249"
    issue: "Đại từ quy chiếu Đại tá Mikel ('Đại tá Mikel cùng những người tốt khác giống như anh…') đang dùng 'anh', chưa cân xứng về sắc thái tuổi tác/cấp bậc với đại từ trần thuật 'ông' dùng cho Trung tá Drake xuyên suốt lô."
    evidence: "Mikel mang quân hàm Đại tá Liên bang và là sĩ quan đồng cấp/cao cấp hơn Trung tá Drake (được quy chiếu bằng 'ông' trong trần thuật)."
    recommendation: "Đổi 'giống như anh…' thành 'giống như ông ấy…'."
