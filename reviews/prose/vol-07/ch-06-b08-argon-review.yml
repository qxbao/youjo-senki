    category: "meaning_shade"
    issue: "Mệnh đề cuối dịch thoát ý sang việc lâu rồi mới lại được nếm hương vị này, làm mờ sắc thái động từ gốc chỉ việc anh đã quên bẵng hương vị ấy từ lâu (tương ứng với mệnh đề lặp lại ý quên mùi hương rượu thật ở p000288)."
    evidence: "Đối chiếu mệnh đề cuối của p000272 và p000288 trong gói nguồn."
    recommendation: "Có thể chỉnh nhẹ thành: \"Anh đã quên bẵng hương vị này từ lâu rồi.\" trong bước chuốt văn nếu muốn giữ sát sự song hành với p000288; không bắt buộc chặn signoff."
  - segment_id: "YS-LN07/Text/chapter022.xhtml/p000283"
    severity: "minor"
    category: "addition"
    issue: "Lời thoại của đại sứ thêm cụm \"để gửi về\" khi nói về việc tuồn chai rượu qua nước trung lập bằng túi ngoại giao, trong khi ở p000283 chỉ nêu hành động lén mang về qua nước trung lập (chi tiết mua để gửi về bản quốc nằm ở lời dẫn p000284)."
    evidence: "Đối chiếu cụm động từ chỉ việc mang lén qua nước trung lập bằng túi ngoại giao tại p000283 và lời trần thuật tại p000284."
    recommendation: "Có thể lược cụm \"để gửi về\" ở p000283 (ví dụ: \"mà tôi đã lén mang về qua ngả một nước trung lập trong túi bưu phẩm ngoại giao\") để tránh lặp trước thông tin của p000284."
