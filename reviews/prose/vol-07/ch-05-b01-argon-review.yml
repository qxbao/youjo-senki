findings:
  - segment_id: "YS-LN07/Text/chapter018.xhtml/p000006"
    severity: "minor"
    category: "terminology_precision"
    issue: "Thuật ngữ 'ground troops' (đặt trong thế đối lập với việc mất quyền kiểm soát vùng trời 'control of the airspace') đang được dịch hẹp thành 'bộ binh dưới mặt đất' thay vì 'quân mặt đất' hoặc 'lực lượng mặt đất' (bao gồm cả thiết giáp, pháo binh và các đơn vị mặt đất nói chung)."
    recommendation: "Đề xuất chỉnh 'bộ binh dưới mặt đất' thành 'quân mặt đất' hoặc 'lực lượng mặt đất' để chuẩn xác thuật ngữ quân sự (tương tự khuyến nghị tại ch-04-b09 p000180)."
  - segment_id: "YS-LN07/Text/chapter018.xhtml/p000020"
    severity: "minor"
    category: "pronoun_register_note"
    issue: "Tại p000020, Loria tự xưng 'Ta' khi lẩm bẩm cảm thán sau khi đọc báo cáo ('Ta chưa từng nghĩ mọi chuyện lại tệ hại đến mức này.'), sau đó chuyển sang tự xưng 'tôi' khi trực tiếp hỏi viên đại tá tham mưu tại p000030 ('Nói cho tôi biết đi, đồng chí...')."
    recommendation: "Có thể giữ nguyên sự phân hóa sắc thái (độc thoại quyền uy 'Ta' ở p000020 và thoại công vụ 'tôi - đồng chí' ở p000030) hoặc đồng bộ 'Tôi' ở p000020 nếu muốn thống nhất đại từ tự xưng của Loria trong cùng cảnh."
