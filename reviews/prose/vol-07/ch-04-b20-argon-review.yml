    pov_and_pronouns: "Trần thuật điểm nhìn của Tanya; dùng 'Nó' cho Tanya theo DEC-P01-001."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000589
    terms:
      - "vòng vây"
      - "ảo tưởng"
    pov_and_pronouns: "Trần thuật dùng 'nó' cho Tanya; giữ đúng cấu trúc giả định trái thực tế ('Nếu như trên thực tế vòng vây không bị chọc thủng, hẳn nó đã cười khẩy…')."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000590
    terms:
      - "lực lượng đoạn hậu"
    pov_and_pronouns: "Thoại phẫn nộ và kinh ngạc của Tanya; gọi sở chỉ huy địch là 'bọn chúng'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000591
    terms:
      - "Quân đội Liên bang"
    pov_and_pronouns: "Trần thuật phân tích cấu trúc tổ chức của Quân đội Liên bang; giữ giả định ('lẽ ra phần đầu phải là điểm yếu')."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000592
    terms:
      - "sở chỉ huy"
      - "đội quân biết tư duy"
    pov_and_pronouns: "Thoại của Tanya; gọi quân Liên bang là 'chúng'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000593
    terms:
      - "đội quân biết tư duy"
    pov_and_pronouns: "Thoại hỏi lại lắp bắp của cấp dưới ('đ-đội quân'); có 'ạ' cuối câu."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000594
    terms:
      - "Lục quân Đế quốc"
      - "đội quân chỉ huy theo kiểu cầm tay chỉ việc"
      - "phương thức chỉ huy theo nhiệm vụ"
    pov_and_pronouns: "Thoại của Tanya dùng 'chúng ta' và 'Chúng'; câu trần thuật xen giữa dùng 'nó' cho Tanya."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000595
    terms:
      - "Chỉ huy theo kiểu cầm tay chỉ việc"
      - "Bộ Tư lệnh"
      - "chế độ trưng binh đại trà"
    pov_and_pronouns: "Trần thuật giải thích học thuyết quân sự; dùng đại từ khái quát 'bạn' tương ứng với 'you' trong bản gốc."
    emphasis: "Không dùng chữ nghiêng."
