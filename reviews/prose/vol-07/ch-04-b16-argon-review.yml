      - "Tiêu đề chuyển cảnh viết hoa toàn bộ: giữ 'NGÀY 11 THÁNG 5 NĂM THỐNG NHẤT 1927, MẶT TRẬN PHÍA ĐÔNG, TRẬN ĐỊA PHÒNG NGỰ LIÊN HỢP CỦA ĐƠN VỊ ĐỔ BỘ ĐƯỜNG KHÔNG BỜ SÔNG VÀ KAMPFGRUPPE'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000458"
    choices:
      - "Thoại cảnh báo và trần thuật: giữ 'Cảnh báo toàn chiến trường!' (Theater warning!), 'Quân Liên bang' (Federation troops), 'chọc thủng vòng vây' (punch through the encirclement), và 'mặt trận phía đông'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000459"
    choices:
      - "Trần thuật: giữ 'Lục quân Đế quốc' (Imperial Army) và nhận định chủ quan của họ về chiến thắng tưởng đã nắm chắc."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000460"
    choices:
      - "Thoại sững sờ tại tiền tuyến: giữ 'khả năng cơ động có tổ chức' (organized maneuvers)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000461"
    choices:
      - "Thoại phản ứng tại tiền tuyến: giữ tự xưng 'Tôi', 'khả năng kháng cự có tổ chức' (ability to resist in an organized way)."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000462"
    choices:
      - "Nội tâm và trần thuật: giữ đúng phạm vi nhấn mạnh Markdown '*Cái quái gì thế này…*' theo DEC-P01-002, 'quân Liên bang' (the Federation), và phủ định 'không còn là một lựa chọn nữa'."
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000463"
    choices:
      - "Trần thuật: giữ 'mặt trận phía đông' (eastern front), 'ngoài ca trực' (off duty), và phủ định 'không phải là ngoại lệ'."
