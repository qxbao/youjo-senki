  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000577"
    choices:
      - "Thuật ngữ, phủ định & đại từ khái quát: 'defense in depth' -> 'phòng ngự có chiều sâu'; 'static defense' -> 'thế trận phòng ngự tĩnh'; giữ đại từ khái quát 'bạn' và phủ định 'không thể trông cậy vào trong một thế trận phòng ngự tĩnh vốn chẳng có mấy không gian dư dả'."
