      - "Quân hàm, câu hỏi tu từ & quan hệ đối lập thời gian: giữ 'thưa Trung tá', cấu trúc câu hỏi 'Chẳng phải rất kỳ lạ khi ... trong lúc ... thay vì đợi sau khi ... sao ạ?'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000395"
    choices:
      - "Xưng hô chỉ huy: Tanya hỏi Grantz bằng đại từ 'Anh'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000396"
    choices:
      - "Quân hàm & kính ngữ: Grantz đáp 'Vâng… Trung tá cũng nghĩ giống vậy sao ạ?'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000397"
    choices:
      - "Tình thái suy đoán, thuật ngữ & đại từ trần thuật: giữ tình thái dè dặt 'Tôi có cảm giác rằng biết đâu chừng, chỉ là biết đâu thôi…', thuật ngữ 'bản quốc', 'cuộc phản công quy mô lớn', 'hậu phương', 'sở chỉ huy', đại từ trần thuật 'Nó' theo DEC-P01-001; đổi 'điều chuyển binh lực quanh đây' thành 'điều chuyển binh lực qua lại' (hoặc 'điều động binh lực khắp nơi') theo finding."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000398"
    choices:
      - "Dấu thoại ba lớp: giữ nguyên cặp ngoặc kép ba lớp '“““Rõ!”””'."
