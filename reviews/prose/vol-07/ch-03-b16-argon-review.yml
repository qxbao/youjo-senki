    category: "meaning_and_naturalness"
    issue: "Trong câu thoại quát tháo của Tanya, cụm chỉ thời gian ở cuối câu đầu đang dịch sát chữ thành 'vào một ngày sau đó!', nghe giống lời thuật lại sự việc trong quá khứ hơn là mệnh lệnh gạt đi lời phân trần ngay trên sóng vô tuyến để yêu cầu gửi văn bản giải trình vào lúc khác."
    recommendation: "Đổi 'vào một ngày sau đó!' thành 'vào lúc khác!' hoặc 'để lúc khác!' (ví dụ: 'Tôi muốn nhận lời biện hộ chính thức của các người—bằng văn bản—vào lúc khác!')."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000269"
    severity: "minor"
    category: "style_and_conciseness"
    issue: "Câu thứ hai đang tự thêm mệnh đề điều kiện giải thích 'Một khi đã mất đi thì', làm giãn nhịp của câu kết ngắn gọn, đanh thép trong nguyên bản."
    recommendation: "Lược bỏ mệnh đề tự thêm, sửa thành: 'Đây là sinh mạng con người. Chẳng thể nào cứu vãn hay lấy lại được đâu.'."
