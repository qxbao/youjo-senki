    choices:
      - "Giọng mỉa mai nội tâm: giữ câu nhận xét ngắn 'Ồ, đúng kiểu câu trả lời quan liêu.'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000268"
    choices:
      - "Thuật ngữ & giọng thoại: 'General Staff' -> 'Bộ Tổng tham mưu'; giữ nhịp bùng nổ dồn dập của Tanya trước và sau khi dập ống nghe."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000269"
    choices:
      - "Nhịp câu kết: lược bỏ mệnh đề tự thêm 'Một khi đã mất đi thì' theo finding để giữ hai câu khẳng định ngắn gọn, đanh thép."
