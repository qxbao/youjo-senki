  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000351"
    choices:
      - "Quân hàm, xưng hô & phân biệt đại từ: Serebryakov xưng 'Tôi', gọi Tanya là 'thưa Trung tá'; đổi thán từ mở đầu từ 'Dạ—?' thành 'Hả—?' (hoặc 'Ơ—?') theo finding; trong trần thuật giữ 'Kampfgruppe' và dùng đại từ 'cô' cho Serebryakov để phân biệt với 'nó' (Tanya)."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000352"
    choices:
      - "Thoại thuộc cấp: giữ 'chỉ huy của chúng ta' và lời tán thưởng pha nét hóm hỉnh của Ahrens."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000353"
    choices:
      - "Quân hàm, tôn ti xưng hô & thuật ngữ: giữ 'Đại úy Ahrens', 'các sĩ quan ma pháp' và đại từ 'cô ấy' (chỉ Serebryakov); đổi 'Vâng ... Đại úy Ahrens ạ' thành 'Ừm ... Đại úy Ahrens' (bỏ 'ạ') theo finding để giữ đúng tôn ti Trung tá chỉ huy nói với Đại úy thuộc cấp."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000354"
    choices:
      - "Xưng hô, đại từ & nghĩa số lượng: trong thoại Ahrens xưng 'tôi ... ạ', gọi Serebryakov là 'cô ấy'; trong trần thuật quy chiếu Ahrens bằng 'anh', Serebryakov bằng 'cô'; đổi 'không dưới một lần' thành 'hơn một lần' (hoặc 'không chỉ một lần') theo finding."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000355"
    choices:
      - "Đại từ trần thuật & tình thái: quy chiếu Tanya bằng 'Nó' theo DEC-P01-001; giữ tình thái 'dường như đều đồng tình'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000356"
    choices:
      - "Quân hàm & xưng hô: giữ 'Đại úy Meybert', 'Trung úy Tospan', 'Đại úy Ahrens', 'Thiếu tá Weiss'; Tanya gọi Meybert và Tospan là 'hai người', gọi Weiss là 'Anh' (không dùng 'ạ')."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000357"
    choices:
      - "Thoại cấp dưới: Weiss dùng kính ngữ 'ạ' khi đáp lời Tanya và quy chiếu Serebryakov bằng 'Cô ấy'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000358"
    choices:
      - "Trần thuật: giữ hình ảnh ẩn dụ 'Màn song tấu thở dài'."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000359"
    choices:
      - "Đại từ trần thuật & nghĩa: gọi tên 'Tanya' và quy chiếu bằng 'nó' theo DEC-P01-001; giữ trọn mạch suy nghĩ thực dụng về việc dùng câu chuyện làm chất liệu gắn kết với thuộc cấp."
