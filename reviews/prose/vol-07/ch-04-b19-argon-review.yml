  - segment_id: YS-LN07/Text/chapter016.xhtml/p000538
    terms: []
    pov_and_pronouns: "Trần thuật nối tiếp lập luận; giữ cấu trúc điều kiện phủ định ('không vận hành hiệu quả… thì rắc rối to')."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000539
    terms:
      - "đội tiên phong"
    pov_and_pronouns: "Thoại của Thiếu tá Weiss với Tanya; xưng 'Tôi', gộp chung 'chúng ta', kết câu bằng 'ạ'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000540
    terms:
      - "bộ binh"
      - "đơn vị pháp sư trên không"
      - "Quân đội Liên bang"
    pov_and_pronouns: "Trần thuật dùng 'nó' cho Tanya; trong thoại Tanya xưng 'Tôi', gọi đơn vị mình là 'chúng ta' và quân Liên bang là 'chúng'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000541
    terms: []
    pov_and_pronouns: "Câu đầu là ý nghĩ nội tâm ngắn tiếp nối bởi trần thuật ngôi thứ ba."
    emphasis: "In nghiêng đúng câu đầu '*Đúng vậy.*' theo DEC-P01-002."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000542
    terms: []
    pov_and_pronouns: "Trần thuật phân tích tâm lý chiến trường; giữ quan hệ tương phản giữa đường rút bị đe dọa và đường rút bị cắt đứt hoàn toàn."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000543
    terms: []
    pov_and_pronouns: "Thoại xác nhận mục tiêu tác chiến; dùng 'chúng ta' và 'quân địch'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000544
    terms:
      - "trận truy kích"
    pov_and_pronouns: "Thoại của Weiss hỏi Tanya; dịch ngôi thứ hai thành 'Trung tá' kèm 'ạ' cuối câu."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000545
    terms:
      - "Weiss"
      - "chú chó săn"
    pov_and_pronouns: "Trần thuật dùng 'nó' cho Tanya ('chú chó săn của nó') và dùng 'bạn' cho chủ thể khái quát ở câu cuối."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000546
    terms: []
    pov_and_pronouns: "Thoại của Tanya khích lệ cấp dưới; gọi địch là 'chúng'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000547
    terms:
      - "Trung tá"
    pov_and_pronouns: "Thoại của cấp dưới với Tanya; xưng 'tôi', gọi 'Trung tá', có 'ạ', gọi địch là 'chúng'."
    emphasis: "In nghiêng đúng danh xưng '*Trung tá*' tương ứng với phần nhấn mạnh trong nguồn theo DEC-P01-002."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000548
    terms: []
    pov_and_pronouns: "Thoại đáp lời của Tanya với các sĩ quan cấp dưới; xưng 'tôi', gọi các sĩ quan là 'mấy người', gọi địch là 'chúng'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000549
    terms:
      - "Quân đội Liên bang"
    pov_and_pronouns: "Đan xen giữa độc thoại nội tâm trực tiếp của Tanya (dùng 'chúng ta' và tự xưng 'mình' theo DEC-P01-001) với trần thuật ngôi thứ ba."
    emphasis: "In nghiêng đúng hai phần nội tâm '*Xem ra chúng ta có điểm chung ở chỗ đó nhỉ.*' và '*Quân đội Liên bang hẳn phải lạnh lẽo và xa cách lắm; mình dám chắc về mặt tổ chức thì chúng ta đang ở vào tình thế tốt hơn nhiều.*' theo DEC-P01-002."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000550
    terms:
      - "sở chỉ huy địch"
    pov_and_pronouns: "Thoại của Tanya dùng 'Chúng ta'; trần thuật quy chiếu Tanya bằng 'nó' và đại từ phản thân 'mình'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000551
    terms:
      - "tiểu đoàn pháp sư trên không"
    pov_and_pronouns: "Trần thuật nhận định chung; giữ quan hệ nhượng bộ và phủ định ('không thể thoát khỏi giới hạn về quân số')."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000552
    terms:
      - "nhiệm vụ ngăn chặn"
      - "đòn tấn công quấy rối"
    pov_and_pronouns: "Trần thuật ngôi thứ ba về quyết định chiến thuật của Tanya."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000553
    terms:
      - "Tiểu đoàn Pháp sư Trên không số 203"
      - "chiến thuật chặt đầu chỉ huy"
    pov_and_pronouns: "Trần thuật tổng kết kết quả tác chiến."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000554
    terms: []
    pov_and_pronouns: "Thoại hạ lệnh của Tanya; gọi thuộc cấp là 'toàn quân' và địch là 'chúng'."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000555
    terms:
      - "sở chỉ huy"
      - "pháp sư trên không"
      - "đám quân Liên bang"
      - "quyền kiểm soát bầu trời"
      - "Dacia"
    pov_and_pronouns: "Trần thuật dùng 'Nó' cho Tanya, 'họ' cho toàn đơn vị 203 và 'đám quân Liên bang' cho quân địch."
    emphasis: "Không dùng chữ nghiêng."
  - segment_id: YS-LN07/Text/chapter016.xhtml/p000556
    terms:
      - "Quân đội Liên bang"
