findings:
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000104"
    severity: "moderate"
    issue: "Cụm 'from their base' đang được dịch thành 'từ phần chân tháp', hiểu nhầm 'their' quy chiếu 'church towers'. Trong ngữ cảnh Tanya đang ở sở chỉ huy lâm thời quan sát khu dân cư sắp tiến đánh từ xa qua ống nhòm (p000085, p000089), trạng ngữ 'from their base' bổ nghĩa cho 'she could see' và chỉ tầm quan sát từ căn cứ/trận địa của đơn vị họ."
    recommendation: "Sửa 'cùng mọi thứ có thể nhìn thấy từ phần chân tháp' thành 'cùng mọi thứ nó có thể nhìn thấy từ căn cứ của họ' (hoặc 'cùng mọi thứ có thể nhìn thấy từ trận địa của họ')."
  - segment_id: "YS-LN07/Text/chapter012.xhtml/p000108"
    severity: "minor"
    issue: "Cụm 'not fibbing or anything' được dịch thành 'chẳng hề nói dối lấy lệ hay gì cả'. Từ 'fibbing' chỉ hành vi nói dối/bịa chuyện nhỏ, không có nét nghĩa 'lấy lệ' (qua loa chiếu lệ)."
    recommendation: "Lược bỏ 'lấy lệ', sửa thành 'Nó chẳng hề nói dối hay gì cả—nó thực tâm cảm kích...'."
