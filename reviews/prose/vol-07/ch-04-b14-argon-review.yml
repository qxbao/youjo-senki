findings:
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000355"
    severity: "minor"
    category: "terminology_consistency"
    issue: "Cụm 'fill the tank role' ở câu thứ ba được dịch thoát ý thành 'đảm nhận vai trò lá chắn', trong khi câu ngay sau đó và các đoạn p000356, p000362 lại dịch 'tanks' theo nghĩa đen là 'những chiếc xe tăng' / 'đám xe tăng đó', làm đứt mạch liên kết từ vựng giải thích vì sao Tanya ví đám pháp sư Liên bang như những chiếc xe tăng."
    rationale: "Trong độc thoại nội tâm của Tanya, phép ẩn dụ gọi pháp sư địch là 'xe tăng' ở cuối đoạn p000355 và các đoạn p000356, p000362 bắt nguồn trực tiếp từ nhận định chúng đóng vai trò 'tank' (đỡ đòn/lá chắn hạng nặng như xe tăng). Giữ từ 'xe tăng' ở cả hai câu và làm mượt cấu trúc phủ định 'never dreamed I’d...' sẽ giúp mạch liên tưởng chặt chẽ và tự nhiên hơn."
    suggested_fix: "Ở câu thứ ba và thứ tư, có thể chỉnh thành: 'Vậy nên về cơ bản, chúng đảm nhận vai trò đỡ đòn như xe tăng. Có nằm mơ mình cũng chẳng nghĩ tới việc sẽ có ngày phải tử chiến với những chiếc xe tăng như thế trong một cuộc chiến tranh.'"
  - segment_id: "YS-LN07/Text/chapter016.xhtml/p000369"
    severity: "minor"
    category: "pronouns_clarity"
    issue: "Đại từ 'nó' được dùng liên tiếp cho hai chủ thể khác nhau trong hai câu liền kề: câu đầu chỉ Tanya ('nó buộc phải khởi động Elinium Type 95'), câu sau chỉ quả cầu Elinium Type 95 ('ảnh hưởng của nó không phát tác tức thì')."
    rationale: "Theo DEC-P01-001, trần thuật ngôi thứ ba về Tanya dùng 'nó'. Để tránh trùng lặp đại từ quy chiếu giữa Tanya và khí tài trong hai mệnh đề sát nhau, nên dịch 'its influence' ở câu thứ hai bằng danh từ chỉ vật cụ thể như 'ảnh hưởng của quả cầu này' hoặc 'ảnh hưởng của thiết bị này'."
    suggested_fix: "Đổi 'Ngay cả khi ảnh hưởng của nó không phát tác tức thì' thành 'Ngay cả khi ảnh hưởng của quả cầu này không phát tác tức thì'."
