findings:
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter016.xhtml/p000172"
    issue: "Cụm 'nó cũng vào khoảng đơn vị chiến lược nhỏ nhất có thể' ghép từ chỉ ước lượng số lượng ('vào khoảng') trực tiếp với cụm danh từ so sánh nhất nên hơi cứng và dễ trùng đại từ 'nó' với đại từ trần thuật chỉ Tanya ở câu kế tiếp (p000173)."
    evidence: "Mệnh đề cuối của nguyên bản dùng giới từ chỉ mức độ xấp xỉ đi với cụm danh từ so sánh nhất để nhận định quy mô của Kampfgruppe Salamander."
    recommendation: "Diễn đạt tự nhiên hơn và làm rõ chủ thể đơn vị: 'đây cũng gần như là đơn vị chiến lược có quy mô nhỏ nhất có thể' (hoặc ở đầu p000173 dùng 'Nếu đơn vị định lao thẳng vào...')."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter016.xhtml/p000180"
    issue: "Thuật ngữ 'imperial ground troops' ở câu cuối đang dịch thu hẹp thành 'bộ binh Đế quốc', chưa thật đồng bộ với 'đơn vị mặt đất của Đế quốc' (p000181) và 'các lực lượng mặt đất' (p000185)."
    evidence: "Trong ngữ cảnh đối lập với cuộc không chiến trên bầu trời và chuẩn bị cho đợt đột phá gồm cả thiết giáp, pháo binh lẫn bộ binh cơ giới ở p000181–p000183, danh từ nguồn chỉ chung quân mặt đất của Đế quốc chứ không riêng binh chủng bộ binh."
    recommendation: "Đổi 'bộ binh Đế quốc' thành 'quân mặt đất Đế quốc' (hoặc 'lực lượng mặt đất của Đế quốc')."
