      - "Thoại, điểm nhìn, đại từ & thuật ngữ: Serebryakov xưng 'tôi'; 'the Rhine' -> 'mặt trận Rhine'; trần thuật gọi 'Serebryakov' và 'Tanya'; câu sau chuyển sang nội tâm dùng 'bọn mình'; 'HQ' -> 'sở chỉ huy'."
  - segment_id: "YS-LN07/Text/chapter002.xhtml/p000310"
    choices:
