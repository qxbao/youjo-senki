    segment_id: "YS-LN07/Text/chapter018.xhtml/p000114"
    issue: "Danh từ chỉ chức danh của Loria ('the commissar') đang được dịch là 'vị ủy viên dân ủy', bị trùng lặp yếu tố nghĩa ('dân ủy' vốn đã là từ rút gọn của 'ủy viên nhân dân') và chưa đồng bộ với cách gọi 'Đồng chí Dân ủy' đã khóa ở lô trước (p000070)."
    evidence: "Trong nguyên bản, danh từ chức danh đi kèm mạo từ xác định chỉ Loria (người đứng đầu Bộ Dân ủy Nội vụ); ở p000070 cùng chương đã thống nhất dùng 'Dân ủy'."
    recommendation: "Đổi 'vị ủy viên dân ủy' thành 'vị dân ủy' (hoặc 'vị ủy viên nhân dân')."
  - severity: "minor"
    segment_id: "YS-LN07/Text/chapter018.xhtml/p000137"
    issue: "Cụm từ chỉ thời kỳ quân chủ trước cách mạng ('during the czarist period') đang được dịch là 'dưới thời Nga hoàng', vô tình đưa quốc danh thế giới thực ('Nga') vào bối cảnh giả tưởng của tác phẩm (nơi quốc gia tiền thân của Liên bang được gọi là Russy)."
    evidence: "Trong hệ thống thuật ngữ của tác phẩm, các quốc danh thực tế đều được thay bằng tên giả tưởng (Đế quốc, Cộng hòa, Khối Thịnh vượng chung, Hợp chúng quốc, Liên bang / Russy); tính từ phái sinh từ tước hiệu quân chủ ở p000137 không gắn với chữ 'Nga'."
    recommendation: "Đổi 'dưới thời Nga hoàng' thành 'dưới thời Sa hoàng'."
