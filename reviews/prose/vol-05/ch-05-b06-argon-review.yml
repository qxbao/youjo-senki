findings:
  - segment_id: YS-LN05/Text/part0025.html/p000248
    severity: minor
    issue: "Ở vế sau dấu gạch ngang, cụm 'đơn vị của họ' hơi lệch mạch quy chiếu vì vế trước đang dùng đại từ ngôi thứ ba số ít 'nó' để chỉ Tanya."
    recommendation: "Đổi 'đơn vị của họ được phân công' thành 'đơn vị của nó được phân công' hoặc 'cả đơn vị được phân công' để mạch quy chiếu liền lạc hơn."
  - segment_id: YS-LN05/Text/part0025.html/p000253
    severity: minor
    issue: "Thán từ 'Ái chà' thường biểu thị sự ngạc nhiên hoặc cảm thán nhẹ, chưa thật khớp với tiếng rên ngao ngán, bực dọc của Tanya khi than thở về tình trạng thiếu cựu binh."
    recommendation: "Đổi 'Ái chà, đau đầu thật đấy.' thành 'Ôi trời, đau đầu thật đấy.' hoặc 'Trời ạ, đau đầu thật đấy.'."
  - segment_id: YS-LN05/Text/part0025.html/p000258
    severity: minor
    issue: "Cách kết hợp từ 'có hối hận bao nhiêu cũng không xuể' hơi gượng trong tiếng Việt vì 'không xuể' thường đi với động từ chỉ hành động đếm, kể hoặc xử lý khối lượng công việc."
    recommendation: "Đổi thành 'và nó hối hận không để đâu cho hết' hoặc 'và nó có hối hận bao nhiêu cũng chẳng đủ'."
