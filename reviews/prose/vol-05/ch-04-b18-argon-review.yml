    issue: "Cụm 'đó là kết luận mà đơn vị kiểm tra lần theo dấu vết chúng đưa ra!' đặt đại từ 'chúng' ngay trước động từ 'đưa ra', dễ gây hiểu nhầm chủ ngữ của hành động 'đưa ra' là 'chúng' thay vì 'đơn vị kiểm tra'."
    evidence: "Trong nguyên văn, mệnh đề quan hệ bổ nghĩa cho đơn vị kiểm tra đang lần theo dấu vết của đối phương, và chính đơn vị kiểm tra này là chủ thể đưa ra kết luận nhận dạng."
    recommendation: "Đề xuất ở bước chuốt văn cân nhắc chỉnh lại trật tự từ để tách rõ chủ ngữ – vị ngữ, chẳng hạn: 'đó là kết luận do đơn vị kiểm tra đang lần theo dấu vết của chúng đưa ra!'."
  - severity: "minor"
    segment_id: "YS-LN05/Text/part0022.html/p000732"
    issue: "Cụm 'Giờ thì người ta cứ nóng ran và bứt rứt cả lên' dễ bị đọc nhầm 'người ta' thành đại từ phiếm chỉ hoặc cách tự xưng suồng sã, thay vì nghĩa 'cơ thể ta / trong người ta'."
    evidence: "Nguyên văn dùng chủ ngữ ngôi thứ nhất với tính từ chỉ trạng thái cơ thể/tâm sinh lý đang nóng bừng và bứt rứt của Loria."
    recommendation: "Đề xuất ở bước chuốt văn cân nhắc đổi thành: 'Giờ thì cả người ta cứ nóng ran và bứt rứt hết lên' hoặc 'Giờ thì ta cứ thấy nóng ran và bứt rứt cả người'."
