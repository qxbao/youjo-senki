      - "Khóa đại từ 'ông ta' quy chiếu Thủ tướng Churbull trong suy nghĩ của Habergram."
  - segment_id: "YS-LN05/Text/part0016.html/p000404"
    choices:
      - "Khóa đại từ tự xưng 'tôi' của Churbull và cách gọi 'Quản gia của tôi'."
  - segment_id: "YS-LN05/Text/part0016.html/p000405"
    choices:
      - "Khóa 'hoàn cảnh phân phối thời chiến' và sắc thái lịch sự 'tôi xin nói rằng... đấy ạ' của Habergram với Thủ tướng."
  - segment_id: "YS-LN05/Text/part0016.html/p000406"
    choices:
