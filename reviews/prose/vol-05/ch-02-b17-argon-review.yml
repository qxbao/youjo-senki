  - segment_id: "YS-LN05/Text/part0016.html/p000400"
    choices:
      - "Giữ bước ngoặt nhận thức từ chỗ suýt tin theo nghĩa đen sang sự kinh ngạc không tin vào mắt mình của Habergram."
  - segment_id: "YS-LN05/Text/part0016.html/p000401"
    choices:
