  - segment_id: "YS-LN05/Text/part0016.html/p000407"
    choices:
      - "Giữ nét nghĩa 'những thứ đang vào đúng mùa ngon nhất' ('what is in its quality season') và phủ định 'chẳng lấy làm vui vẻ gì' khi buộc phải dùng đồ thay thế."
  - segment_id: "YS-LN05/Text/part0016.html/p000408"
    choices:
      - "Khóa 'Khối Thịnh vượng chung' và đại từ 'ông ta' chỉ Thủ tướng Churbull dưới điểm nhìn đánh giá của Habergram."
  - segment_id: "YS-LN05/Text/part0016.html/p000409"
    choices:
      - "Khóa 'các sản phẩm thay thế' ('ersatz products'), 'Vị thủ tướng' và 'Tướng Habergram'."
      - "Giữ cấu trúc phủ định kép 'không thể phủ nhận' và câu nói đùa 'Không có trà thì chẳng thể đánh đấm gì được'."
  - segment_id: "YS-LN05/Text/part0016.html/p000410"
    choices:
      - "Khóa 'các sĩ quan tình báo' ('intelligence officers') và 'lục địa phía nam' ('the southern continent')."
      - "Giữ tình thái nghe truyền lại 'nghe đâu' ('apparently') về việc vẫn xoay xở kiếm được trà giữa sa mạc."
  - segment_id: "YS-LN05/Text/part0016.html/p000411"
    choices:
      - "Giữ tình thái phỏng đoán hài hước của cấp trên ('Biết đâu họ vẫn đủ tài cán để hoàn thành nhiệm vụ ngay cả khi ông bắt họ làm việc vất vả thêm một chút')."
  - segment_id: "YS-LN05/Text/part0016.html/p000412"
    choices:
