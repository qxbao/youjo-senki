  - segment_id: "YS-LN05/Text/part0016.html/p000414"
    choices:
      - "Khóa 'người phụ trách ngành Tình báo' ('the one responsible for Intelligence') và đại từ tự quy chiếu 'mình' trong câu hỏi gián tiếp của Habergram."
  - segment_id: "YS-LN05/Text/part0016.html/p000415"
    choices:
      - "Khóa 'khu trục hạm' ('destroyers') và liệt kê tăng tiến từ nhu yếu phẩm, tàu chiến tới các quốc gia đồng minh văn minh, đáng tin cậy."
  - segment_id: "YS-LN05/Text/part0016.html/p000416"
    choices:
      - "Khóa 'Khối Thịnh vượng chung' ('the Commonwealth'), 'Cộng hòa' ('the Republic'), 'lục địa' ('the continent') và 'Đế quốc' ('the Empire')."
      - "Giữ đúng quan hệ nhân quả: không ngăn chặn được thất bại của Cộng hòa và can thiệp quá muộn nên giờ phải trả giá bằng cảnh đơn độc đối đầu với Đế quốc."
  - segment_id: "YS-LN05/Text/part0016.html/p000417"
    choices:
      - "Khóa 'Khối Thịnh vượng chung', 'nghị viện' ('parliament') và phép đối lập 'thời khắc huy hoàng nhất của bọn họ và là thời khắc tồi tệ nhất của chúng ta'."
  - segment_id: "YS-LN05/Text/part0016.html/p000418"
    choices:
      - "Khóa cách xưng hô kính trọng của Habergram với Thủ tướng Churbull ('ngài... thưa ngài')."
  - segment_id: "YS-LN05/Text/part0016.html/p000419"
    choices:
      - "Khóa lời xác nhận ngắn gọn 'Chính xác.'"
  - segment_id: "YS-LN05/Text/part0016.html/p000420"
    choices:
      - "Giữ đúng phạm vi nhấn mạnh Markdown '*Xem ra ông ta vẫn mê hút thuốc như vậy.*' cho suy nghĩ nội tâm của Habergram theo DEC-P01-002."
      - "Giữ phủ định cuối câu 'nhưng bản thân ông cũng chẳng phản đối gì chuyện đó'."
