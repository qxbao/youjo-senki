  - segment_id: "YS-LN05/Text/part0016.html/p000394"
    choices:
      - "Khóa 'Vị thủ tướng', 'người quản gia', 'Habergram' và 'Thủ tướng Churbull'."
      - "Giữ tình thái giả định quá khứ phủ định 'Trước chiến tranh, Habergram chưa bao giờ dám mơ rằng mình sẽ có dịp ngồi chung bàn với Thủ tướng Churbull'."
  - segment_id: "YS-LN05/Text/part0016.html/p000395"
    choices:
      - "Giữ quan hệ nhượng bộ - đối lập ('Dẫu rất vinh dự... lại chẳng mang đến cho ông chút niềm vui nào') và nguyên nhân tổ quốc đang lâm vào cảnh khốn đốn."
  - segment_id: "YS-LN05/Text/part0016.html/p000396"
    choices:
      - "Khóa 'Đội ngũ nhân viên phục vụ' và tình thái ước đoán độ tuổi 'Ngay cả người trẻ nhất chắc cũng phải ngoài năm mươi'."
  - segment_id: "YS-LN05/Text/part0016.html/p000397"
    choices:
      - "Giữ quan hệ nhân quả về việc quân đội đã vét gần hết thanh niên trai tráng và tâm trạng chạnh lòng u uẩn của Habergram trước bước đi của thời gian."
  - segment_id: "YS-LN05/Text/part0016.html/p000398"
    choices:
      - "Giữ sự tương phản giữa bộ đồng phục chỉnh tề hoàn hảo như xưa của những người mang bộ đồ trà với cảm giác trĩu nặng thực tại."
  - segment_id: "YS-LN05/Text/part0016.html/p000399"
    choices:
