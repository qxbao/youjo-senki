  - segment_id: "YS-LN05/Text/part0016.html/p000402"
    choices:
      - "Giữ câu hỏi tu từ về việc đánh bóng đồ bạc và tâm thế phân vân 'chẳng biết mình nên thán phục hay ngán ngẩm nữa' trong bối cảnh khan hiếm nhân công."
  - segment_id: "YS-LN05/Text/part0016.html/p000403"
    choices:
