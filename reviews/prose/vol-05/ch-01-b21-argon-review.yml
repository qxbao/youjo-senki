findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000767"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Độc thoại nội tâm ngôi thứ nhất của Tanya đang tự xưng là 'tôi' (3 lần) thay vì 'mình' theo quy ước đã duyệt tại DEC-P01-001 và checkpoint của handoff."
    basis: "DEC-P01-001 quy định trần thuật về Tanya dùng 'nó', còn nội tâm tự quy chiếu của Tanya dùng 'mình'. Việc dùng 'tôi' trong độc thoại nội tâm làm lệch giọng nội tâm đã khóa xuyên suốt và gây xung đột điểm nhìn với các đoạn trần thuật dùng 'nó'."
    recommendation: "Đổi đại từ tự quy chiếu ngôi thứ nhất đơn của Tanya trong độc thoại nội tâm từ 'tôi' sang 'mình' ('vì mình từng biết...', 'mình cũng từng phải chật vật...', 'lúc nào mình cũng chỉ muốn hét lên'); đại từ số nhiều chỉ bộ phận nhân sự kiếp trước có thể dùng 'chúng mình' hoặc giữ 'chúng tôi' tùy nhịp câu nhưng tự quy chiếu cá nhân phải là 'mình'."
  - segment_id: "YS-LN05/Text/part0010.html/p000771"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Độc thoại nội tâm của Tanya mở đầu câu bằng đại từ 'Tôi' ('Tôi chưa từng nghĩ mình sẽ bị...') thay vì 'Mình' theo DEC-P01-001."
    basis: "DEC-P01-001 quy định nội tâm tự quy chiếu của Tanya dùng 'mình'."
    recommendation: "Đổi 'Tôi chưa từng nghĩ mình sẽ bị...' thành 'Mình chưa từng nghĩ mình sẽ bị...' hoặc 'Mình chưa từng nghĩ sẽ bị...'."
  - segment_id: "YS-LN05/Text/part0010.html/p000775"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Nhận định nội tâm ngôi thứ nhất của Tanya dùng 'đích thân tôi thẩm vấn họ' thay vì 'đích thân mình thẩm vấn họ' theo DEC-P01-001."
    basis: "DEC-P01-001 quy định nội tâm tự quy chiếu của Tanya dùng 'mình'."
    recommendation: "Đổi 'đích thân tôi thẩm vấn họ' thành 'đích thân mình thẩm vấn họ'."
  - segment_id: "YS-LN05/Text/part0010.html/p000777"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Câu kết độc thoại nội tâm của Tanya dùng 'Tôi dám chắc Bộ Tổng tham mưu...' thay vì 'Mình dám chắc Bộ Tổng tham mưu...' theo DEC-P01-001."
    basis: "DEC-P01-001 quy định nội tâm tự quy chiếu của Tanya dùng 'mình'."
    recommendation: "Đổi 'Tôi dám chắc' thành 'Mình dám chắc'."
  - segment_id: "YS-LN05/Text/part0010.html/p000788"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Trong cùng một đoạn văn, câu đầu độc thoại nội tâm dùng 'tôi' ('chẳng hiểu tôi đang nói cái quái gì') nhưng câu thứ ba chuyển sang trần thuật ngôi thứ ba lại dùng 'Nó' ('Nó quay sang vị phó chỉ huy của mình'), gây đứt gãy điểm nhìn và trái với DEC-P01-001."
    basis: "DEC-P01-001 quy định nội tâm tự quy chiếu của Tanya dùng 'mình' và trần thuật dùng 'nó' để phân biệt rõ hai lớp điểm nhìn mà không tạo cảm giác có một người kể chuyện xưng 'tôi' tách biệt với 'nó'."
    recommendation: "Đổi 'tôi' ở câu đầu thành 'mình' ('Grantz rõ ràng chẳng hiểu mình đang nói cái quái gì'), giữ 'Nó' ở câu trần thuật thứ ba."
