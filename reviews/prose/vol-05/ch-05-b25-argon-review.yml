    category: "phủ định, giả định, tình thái và câu hỏi"
    choice: "Giữ đúng phủ định kèm giả định nhượng bộ trái thực tế trong quá khứ ('không tính đến... Mà ngay cả khi có tính đến, điều đó cũng còn tùy thuộc vào...') ở p000050, phủ định kép giải thích hợp lý ('chẳng trách khi anh không rõ...') ở p000053, điều kiện phủ định về tính cấp thiết ('Nếu không phải là thứ người lính có khả năng phải dùng đến ngay lập tức...') ở p000055, câu điều kiện loại 3 trái thực tế trong quá khứ ('Nếu chúng ta không trải qua một mùa đông ở Norden, thì hẳn chúng ta cũng chẳng có chút kinh nghiệm nào cả') ở p000056, suy đoán chắc chắn về quá khứ ('hẳn đã theo diện tốt nghiệp sớm') ở p000059, câu hỏi đuôi xác nhận ('chưa từng tham chiến ở Norden nhỉ?') ở p000060, phủ định kép nhấn mạnh ('không thể phủ nhận rằng kinh nghiệm của anh ta vẫn chưa đồng đều') ở p000061, mệnh đề nhượng bộ cực hạn ('ngay cả khi phải dùng hết toàn bộ quỹ mật phí') ở p000064, so sánh giả định ('như thể số trang bị đó dành cho...') ở p000066, sự hoài nghi thận trọng của Tanya ('nhưng tôi không chắc việc đó sẽ suôn sẻ đến đâu') ở p000067, câu ước trái thực tế ở hiện tại ('Ước gì mình có thể mang...') ở p000072, điều kiện loại trừ mỉa mai ('Miễn đó không phải là nơi...') ở p000080, quan hệ nhân quả đối lập giữa việc đã trù tính biên độ an toàn sớm hơn mọi năm với thực tế mùa đông ập tới còn sớm hơn nữa ở p000086, câu hỏi đuôi xác nhận sự bất ngờ ('chúng ta đã không lường trước được chuyện này, phải không?') ở p000087, giới hạn phạm vi tiếp tế ('nhưng chỉ đến được những đơn vị nằm trong tầm vươn tới của đường sắt thôi') ở p000092 và sự bất ngờ về thời điểm cấp bách ('không ngờ mình lại phải chuyển số hàng đó ra tiền tuyến ngay tức khắc thế này') ở p000093."
