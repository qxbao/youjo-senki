    category: "điểm nhìn, đại từ và xưng hô"
    choice: "Theo DEC-P01-001: ở nửa đầu (p000048–p000068), trần thuật ngôi thứ ba gọi Tanya là 'nó' (p000059, p000065, p000067) hoặc giữ tên riêng 'Tanya' (p000049, p000053, p000058, p000064); độc thoại nội tâm của Tanya dùng 'mình' và số nhiều 'bọn mình' (p000064). Trong thoại công vụ: Thiếu tá Weiss xưng 'tôi', gọi Trung úy Grantz là 'cậu / Trung úy' (p000048, p000052, p000060), gọi Tanya là 'thưa Trung tá' (p000066); Grantz đáp Weiss lễ phép kèm 'ạ' (p000051, p000057, p000061); Tanya xưng 'tôi', gọi Weiss là 'Thiếu tá Weiss / anh' (p000064, p000067), gọi Serebryakov là 'Trung úy Serebryakov / cô' (p000067) và gọi tập thể sĩ quan là 'tất cả các vị' (p000067); trần thuật gọi Weiss là 'anh' (p000053) và Grantz là 'anh ta' (p000053, p000059, p000061). Ở nửa sau tại Phòng Tác chiến Bộ Tổng tham mưu (p000069–p000094), trần thuật gọi Trung tướng Zettour là 'ông' (p000070, p000074, p000081, p000089, p000093), lời lẩm bẩm tự nhủ của Zettour dùng 'mình' (p000072), độc thoại chua chát dùng 'chúng ta' cho quân đội Đế quốc (p000080), và hai vị tướng đồng cấp Zettour – Rudersdorf xưng hô ngang hàng 'tôi – ông / chúng ta / chúng tôi' (p000087, p000091, p000092)."
