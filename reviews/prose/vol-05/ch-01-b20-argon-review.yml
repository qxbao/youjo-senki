    rationale: "Trong ngữ cảnh Tanya vừa chửi thề vì sự bất cẩn của bản thân và Đế quốc, thán từ mở đầu câu chửi thể hiện sự uất ức, điên tiết chứ không phải ngạc nhiên xã giao."
