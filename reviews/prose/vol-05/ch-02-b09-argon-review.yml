findings:
  - segment_id: YS-LN05/Text/part0016.html/p000091
    severity: minor
    category: terminology_and_style
    issue: "Cụm từ Pháp ngữ chỉ nghĩa vụ/trách nhiệm của giới quý tộc được dịch kèm phần giải nghĩa nối bằng dấu gạch ngang ở p000091 nhưng sang p000094 lại chỉ dùng phần dịch nghĩa tiếng Việt, chưa hoàn toàn đồng nhất giữa hai đoạn gần nhau (lưu ý không bọc nghiêng Markdown vì nguồn ở hai đoạn này không có thẻ nhấn mạnh)."
    recommendation: "Có thể giữ cách diễn đạt hiện tại hoặc thống nhất dùng 'tinh thần trách nhiệm của tầng lớp quý tộc (noblesse oblige)' / 'ý thức trách nhiệm của tầng lớp quý tộc' ở cả p000091 và p000094 khi chuốt văn, miễn không thêm dấu *...* trái DEC-P01-002."
  - segment_id: YS-LN05/Text/part0016.html/p000094
    severity: minor
    category: word_choice
    issue: "Dịch 'ground unit' thành 'đơn vị bộ binh' hơi thu hẹp phạm vi so với đơn vị mặt đất/lục quân nói chung."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi 'đơn vị bộ binh' thành 'đơn vị mặt đất' để sát nghĩa gốc hơn."
