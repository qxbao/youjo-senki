      - "Điểm nhìn nội tâm: giữ đại từ 'Mình / mình' và cụm 'một kẻ ngu xuẩn điển hình'."
  - segment_id: "YS-LN05/Text/part0020.html/p000407"
    choices:
      - "Thoại & phủ định kép: giữ '“Nhưng cũng đâu phải là chúng ta chẳng đạt được kết quả gì.”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000408"
    choices:
      - "Quân hàm & phủ định: khóa '“Thiếu tá Weiss, chừng đó thì cũng chẳng khác nào con số không.”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000409"
    choices:
      - "Thoại & xưng hô: khóa 'chúng ta', 'Trung tá' và chi tiết ảnh chụp cho thấy đã đánh trúng động cơ."
  - segment_id: "YS-LN05/Text/part0020.html/p000410"
    choices:
      - "Điểm nhìn nội tâm & tên nhân vật: khóa đại từ 'Mình / mình' và tên 'Weiss'."
  - segment_id: "YS-LN05/Text/part0020.html/p000411"
    choices:
      - "Điểm nhìn nội tâm & đối lập: khóa đại từ 'anh ta' (Weiss), 'bọn mình' và cặp đối lập 'một cách khách quan chứ không phải chủ quan'."
  - segment_id: "YS-LN05/Text/part0020.html/p000412"
    choices:
      - "Điểm nhìn nội tâm & nhấn mạnh Markdown: khóa đại từ 'Mình' mở đầu chuỗi ba câu hỏi tu từ và cụm in nghiêng '*Thì sao chứ?*' ở cuối theo đúng thẻ <em> của nguồn."
  - segment_id: "YS-LN05/Text/part0020.html/p000413"
    choices:
      - "Phủ định: giữ 'Bản thân những hành động đó chẳng mang ý nghĩa gì cả.'."
  - segment_id: "YS-LN05/Text/part0020.html/p000414"
    choices:
      - "Phủ định: giữ 'Ý định thế nào không quan trọng.'."
  - segment_id: "YS-LN05/Text/part0020.html/p000415"
    choices:
      - "Đối lập & sắc thái: giữ 'Thiện chí hay ác ý—cứ để dành mấy cái sự thật chủ quan đó mà trình bày với thẩm phán trước tòa.'."
