locked_choices:
  - segment_id: "YS-LN05/Text/part0016.html/p000344"
    choices:
      - "Giữ cấu trúc nhấn mạnh vai trò gánh vác nhu cầu tiếp tế quốc gia và ngữ khí chất vấn cuối câu ('các vị biết mà!')."
  - segment_id: "YS-LN05/Text/part0016.html/p000347"
    choices:
      - "Khóa 'Khối Thịnh vượng chung' ('The Commonwealth') và 'khai thông một tuyến đường phía bắc' ('opening up a northern route')."
  - segment_id: "YS-LN05/Text/part0016.html/p000348"
    choices:
      - "Khóa 'Tướng Habergram' ('General Habergram') và 'Liên bang' ('Federation')."
      - "Giữ đúng hai cụm nhấn mạnh Markdown '*Trong trường hợp đó…*' và '*Quả thực đó không phải… là một kế hoạch tồi. Nhưng chẳng phải như vậy là quá đỗi thuận lợi cho Liên bang hay sao?*' theo DEC-P01-002."
      - "Giữ phủ định bộ phận và câu hỏi phản vấn nghi ngờ mức độ có lợi cho Liên bang."
  - segment_id: "YS-LN05/Text/part0016.html/p000349"
    choices:
      - "Giữ sắc thái bề mặt 'Thoạt nhìn, kết luận ấy có vẻ nhằm theo đuổi lợi ích của Khối Thịnh vượng chung'."
  - segment_id: "YS-LN05/Text/part0016.html/p000350"
    choices:
      - "Khóa hô ngữ 'Thưa các quý ông' ('Gentlemen') và đại từ 'chúng ta' trong lời điều phối cuộc họp."
  - segment_id: "YS-LN05/Text/part0016.html/p000351"
    choices:
      - "Giữ tình thái phỏng đoán 'có lẽ' ('probably') và mệnh đề khái quát 'Sự đồng thuận tuyệt đối chính là điềm báo của tinh thần đoàn kết'."
  - segment_id: "YS-LN05/Text/part0016.html/p000352"
    choices:
      - "Khóa đại từ trần thuật 'ông' cho Tướng Habergram và chức vụ 'người đứng đầu cơ quan tình báo' ('the head of the intelligence agency')."
      - "Giữ quan hệ nhân quả nghịch lý: chính vì muốn tin mọi chuyện đang tốt đẹp nên người đứng đầu cơ quan tình báo từng trải qua nhiều gian truân lại không thể hoàn toàn chấp nhận điều đó."
  - segment_id: "YS-LN05/Text/part0016.html/p000353"
    choices:
      - "Khóa 'đơn vị pháp sư hải quân đánh bộ' ('marine mage unit'), 'tuyến đường phía bắc' ('northern route'), 'quân tình nguyện của Hợp chúng quốc' ('Unified States voluntary troops') và 'Thủ tướng Churbull' ('Prime Minister Churbull')."
      - "Giữ đúng phạm vi nhấn mạnh Markdown '*một chiếc tàu*' ('*one boat*') theo DEC-P01-002."
  - segment_id: "YS-LN05/Text/part0016.html/p000355"
    choices:
      - "Giữ tình thái giả định quá khứ ('thì còn dễ hiểu', 'hẳn đã nói chuyện trước') và câu hỏi nghi vấn nội tâm gián tiếp 'Nhưng… chỉ một chiếc tàu ư?' mà không tự thêm chữ nghiêng."
  - segment_id: "YS-LN05/Text/part0016.html/p000356"
    choices:
      - "Giữ đúng phạm vi nhấn mạnh Markdown '*Ồồồ.*' cho cảm thán nội tâm của Tướng Habergram trước khi ông điều chỉnh nhận định."
  - segment_id: "YS-LN05/Text/part0016.html/p000357"
    choices:
      - "Khóa 'Các đại diện hải quân' ('The navy representatives') và đại từ 'ông ta' quy chiếu Thủ tướng Churbull dưới góc nhìn của Habergram."
  - segment_id: "YS-LN05/Text/part0016.html/p000358"
    choices:
      - "Giữ phủ định nhấn mạnh 'thậm chí sẽ chẳng cần đến lực lượng hộ tống' và phản ứng hoảng loạn của phía hải quân."
  - segment_id: "YS-LN05/Text/part0016.html/p000359"
    choices:
      - "Giữ tật nói lắp do hốt hoảng 'X-x-xin khoan đã' và hô ngữ 'thưa Thủ tướng!'."
  - segment_id: "YS-LN05/Text/part0016.html/p000360"
    choices:
      - "Giữ phủ định tuyệt đối và lời can ngăn khẩn thiết ('Không được dùng chiếc đó. Bất cứ thứ gì cũng được trừ chiếc đó ra—ngài tuyệt đối không được làm thế!')."
  - segment_id: "YS-LN05/Text/part0016.html/p000363"
    choices:
      - "Khóa thuật ngữ 'tàu hộ tống' ('escort vessels') và đại từ đối thoại 'tôi - các vị' giữa Thủ tướng với đại diện hải quân."
  - segment_id: "YS-LN05/Text/part0016.html/p000365"
    choices:
      - "Khóa tên tàu 'RMS *Queen of Anjou*' với đúng phạm vi chữ nghiêng Markdown tại '*Queen of Anjou*' và cơ quan 'Bộ Tư lệnh Hạm đội' ('Fleet Command')."
  - segment_id: "YS-LN05/Text/part0016.html/p000367"
    choices:
      - "Khóa 'tàu viễn dương lớn nhất của Khối Thịnh vượng chung' ('the Commonwealth’s largest ocean liner')."
  - segment_id: "YS-LN05/Text/part0016.html/p000368"
    choices:
      - "Khóa 'tàu chở khách kiêm chở hàng' ('cargo-passenger ship') và 'tàu chở khách hạng sang' ('luxury passenger ship')."
  - segment_id: "YS-LN05/Text/part0016.html/p000369"
    choices:
      - "Giữ đúng ranh giới chuyển từ trần thuật sang độc thoại nội tâm in nghiêng bằng Markdown: 'Ông từng nghe nói nó đã bị trưng dụng, nhưng *ra là vậy. Nhìn mức độ hốt hoảng của bên hải quân thì… hẳn nó còn hữu dụng hơn cả lời đồn.*'"
  - segment_id: "YS-LN05/Text/part0016.html/p000371"
    choices:
      - "Khóa 'pháp sư hải quân đánh bộ' ('marine mages') và mệnh lệnh phủ định 'Đừng để con tàu ấy bị đánh chìm!' ('Don’t let her sink!')."
  - segment_id: "YS-LN05/Text/part0016.html/p000372"
    choices:
      - "Giữ sự đối lập hành vi giữa 'các thành viên hải quân' ('the navy members') và 'các thành viên lục quân' ('the army members')."
  - segment_id: "YS-LN05/Text/part0016.html/p000373"
    choices:
      - "Khóa 'Các sĩ quan không quân' ('The air force officers') và chi tiết thảo luận kỹ thuật về động cơ máy bay để tránh bị vạ lây."
  - segment_id: "YS-LN05/Text/part0016.html/p000374"
    choices:
      - "Khóa 'Bộ Ngoại giao' ('Foreign Office') và nét nghĩa phủ định 'chẳng mảy may liên quan gì đến họ'."
  - segment_id: "YS-LN05/Text/part0016.html/p000375"
    choices:
      - "Giữ đúng phạm vi nhấn mạnh Markdown cho toàn bộ khối độc thoại nội tâm đầu đoạn và đại từ tự xưng 'mình' của Habergram trong suy nghĩ."
  - segment_id: "YS-LN05/Text/part0016.html/p000377"
    choices:
      - "Giữ nhận định sửa lại 'hay đúng hơn là đang chế giễu họ' và định danh 'đích thân Thủ tướng Churbull'."
  - segment_id: "YS-LN05/Text/part0016.html/p000380"
    choices:
      - "Khóa cách xưng hô lịch thiệp của Churbull với Habergram ('tôi - ông', 'ông Habergram'), mốc thời gian 'ba giờ chiều mai' và địa điểm 'dinh thủ tướng'."
  - segment_id: "YS-LN05/Text/part0016.html/p000381"
    choices:
      - "Khóa cách đáp lễ của Habergram với Thủ tướng ('tôi - thưa ngài')."
  - segment_id: "YS-LN05/Text/part0016.html/p000382"
    choices:
      - "Giữ nghĩa 'trên thực tế chính là một mệnh lệnh' ('a de facto order') và điều kiện ngoại lệ giả định 'Trừ phi đã có hẹn dùng tiệc trà với nhà vua'."
  - segment_id: "YS-LN05/Text/part0016.html/p000383"
    choices:
      - "Khóa 'quản gia' ('butler') và câu hỏi lịch sự về bữa nhẹ ('Một bữa nhẹ nhàng chút có ổn với ông không?')."
  - segment_id: "YS-LN05/Text/part0016.html/p000384"
    choices:
      - "Khóa câu đáp 'Vâng, xin cảm ơn ngài, thưa Thủ tướng.'"
  - segment_id: "YS-LN05/Text/part0016.html/p000385"
    choices:
      - "Khóa dòng tiêu đề bối cảnh viết hoa 'MỘT NGÀY NỌ, THỦ ĐÔ LONDINIUM CỦA KHỐI THỊNH VƯỢNG CHUNG, DINH THỦ TƯỚNG'."
  - segment_id: "YS-LN05/Text/part0016.html/p000386"
    choices:
      - "Khóa cấp bậc đầy đủ 'Thiếu tướng Habergram' ('Major General Habergram') và 'dinh thủ tướng' ('the prime minister’s residence')."
  - segment_id: "YS-LN05/Text/part0016.html/p000387"
    choices:
      - "Giữ cấu trúc phủ định kép 'chẳng phải điều gì lạ lẫm' cho việc mặt trời không ló dạng trên bầu trời mùa thu."
