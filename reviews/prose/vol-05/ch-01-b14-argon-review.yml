findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000475"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Mệnh đề chỉ đạo đơn vị thiết giáp giả định về lực lượng dự bị của địch đang thêm từ hạn định 'mới chỉ là' ('cứ coi như đây mới chỉ là lực lượng dự bị của địch'), trong khi bản gốc không có từ giới hạn này; đồng thời cụm chỉ đại đội dự bị ở câu thứ ba đang dịch là 'đại đội dự phòng', hơi lệch nhẹ so với cách dịch 'nhiệm vụ dự bị' ở lô b13 (p000436)."
    rationale: "Trong mạch phân tích của Tanya, hai tiểu đoàn địch lộ diện ban đầu có thể là đòn nghi binh và đơn vị thiết giáp cần giả định lực lượng dự bị của địch vẫn đang chực chờ (hoặc coi lực lượng trước mắt là lực lượng dự bị của địch mà không hạ thấp bằng 'mới chỉ là'); việc đồng bộ cách gọi 'đại đội dự bị' cũng giúp giữ tính nhất quán với lô trước."
    recommendation: "Có thể chỉnh nhẹ ở bước chuốt văn thành 'Hãy báo cho đơn vị thiết giáp cứ giả định đây là lực lượng dự bị của địch... Nhưng hãy cho đại đội dự bị xuất kích khẩn cấp.'"
  - segment_id: "YS-LN05/Text/part0010.html/p000491"
    severity: "minor"
    category: "style_tone"
    issue: "Danh từ chỉ lực lượng lính nghĩa vụ bảo vệ sở chỉ huy ở p000491 ('đám lính nghĩa vụ') và nhân sự hậu phương ở p000498 ('đám nhân sự hậu phương') đang thêm lượng từ 'đám' mang sắc thái hơi suồng sã/hạ thấp đối với quân mình, dù nguồn chỉ dùng danh từ xác định trung tính."
    rationale: "Theo canon/style-guide.md, không thêm sắc thái phán xét hoặc miệt thị khi nguồn không có dấu hiệu tương ứng (khác với p000495 nơi nguồn có tính từ chỉ sự ngu ngốc)."
    recommendation: "Có thể lược chữ 'đám' hoặc đổi thành 'những người lính nghĩa vụ' (p000491) và 'các nhân sự hậu phương' (p000498) khi chuốt văn."
