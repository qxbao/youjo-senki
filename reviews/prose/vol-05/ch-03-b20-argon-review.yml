      - "Điểm nhìn, đại từ & phủ định: trần thuật dùng 'nó / Nó' cho Tanya và thống nhất dùng 'họ' (hoặc 'những người đã ngã xuống / đồng đội', tránh gán giới tính 'các anh' theo DEC-P01-001) cho các binh sĩ tử trận; giữ phủ định 'chẳng một ai đành lòng ruồng bỏ những người đã ngã xuống'."
  - segment_id: "YS-LN05/Text/part0020.html/p000445"
    choices:
      - "Giọng thoại & dấu câu: giữ dấu chấm lửng kết hợp chấm than '…!' và thống nhất đại từ tự xưng trong lời thoại có dấu ngoặc kép."
  - segment_id: "YS-LN05/Text/part0020.html/p000446"
    choices:
      - "Thuật ngữ, đại từ & phủ định: 'battlefield cross' -> 'cây thập tự chiến trường'; trần thuật dùng 'Nó / nó' theo DEC-P01-001; giữ phủ định tuyệt đối ở câu cuối 'Một vết đạn bắn xuyên đầu thì không cách nào cứu chữa được.'"
  - segment_id: "YS-LN05/Text/part0020.html/p000447"
    choices:
      - "Xưng hô & giọng thoại: Tanya gọi binh sĩ là 'toàn quân', xưng 'tôi' và 'Chúng ta'."
  - segment_id: "YS-LN05/Text/part0020.html/p000448"
    choices:
      - "Cấp bậc trong thoại: 'Colonel?' -> '“Thưa Trung tá?”' (giữ đúng quân hàm Trung tá của Tanya)."
  - segment_id: "YS-LN05/Text/part0020.html/p000449"
    choices:
      - "Giọng thoại, đại từ & giới hạn thời gian: trong lời phát biểu trước đơn vị, Tanya dùng 'chúng ta' và 'Hỡi những người đồng đội của tôi', giữ điều kiện hạn định mỉa mai '—nhưng chỉ sau khi chúng ta đã khuất bóng mà thôi'; phần dẫn trần thuật dùng 'Nó' theo DEC-P01-001."
  - segment_id: "YS-LN05/Text/part0020.html/p000450"
    choices:
      - "Tên riêng & phủ định: giữ nguyên tên đầy đủ 'Tanya von Degurechaff' và phủ định 'không tin vào thần thánh'."
  - segment_id: "YS-LN05/Text/part0020.html/p000451"
    choices:
      - "Thuật ngữ & phủ định: giữ nguyên định danh 'Being X' (theo P05-being-x); giữ cấu trúc điều kiện 'Chừng nào... còn...' và phủ định khả năng 'một đấng thiêng liêng tuyệt đối không thể nào tồn tại trên thế gian này'."
  - segment_id: "YS-LN05/Text/part0020.html/p000452"
    choices:
      - "Điểm nhìn & tình thái: dùng tên riêng 'Tanya'; giữ mức độ hạn định 'gần như là một tiên đề hiển nhiên'."
  - segment_id: "YS-LN05/Text/part0020.html/p000453"
    choices:
      - "Thuật ngữ & đại từ: 'God' -> 'Thượng đế'; dùng đại từ khái quát 'bạn' ở vế điều kiện giả định."
  - segment_id: "YS-LN05/Text/part0020.html/p000454"
    choices:
      - "Quan hệ điều kiện & phủ định: giữ hai vế điều kiện đối lập ('Nếu được cứu... Còn nếu không...'), đại từ khái quát 'bạn', và phủ định kết câu 'Đằng nào thì bạn cũng chẳng mất gì cả.'"
  - segment_id: "YS-LN05/Text/part0020.html/p000455"
    choices:
      - "Thuật ngữ & phủ định: 'God' -> 'Thượng đế'; giữ phủ định trong lời hưởng ứng 'vốn chẳng phải phong cách của chúng ta!'."
  - segment_id: "YS-LN05/Text/part0020.html/p000456"
    choices:
      - "Tên riêng & giọng thoại: giữ lời tán đồng ngắn gọn của Tanya với 'Weiss'."
  - segment_id: "YS-LN05/Text/part0020.html/p000457"
    choices:
      - "Giọng thoại: giữ câu rủ/đề nghị của Weiss dùng đại từ 'chúng ta'."
  - segment_id: "YS-LN05/Text/part0020.html/p000458"
    choices:
      - "Tên bài hát & xưng hô: giữ dấu nháy đơn quanh tên bài hát ('Chúng Ta Đã Có Một Người Đồng Chí'), gọi đơn vị là 'toàn quân' và 'mọi người', dùng 'chúng ta' ở vế rủ hát tiễn biệt."
  - segment_id: "YS-LN05/Text/part0020.html/p000459"
    choices:
      - "Điểm nhìn & sắc thái: giữ mô tả trần thuật ngôi thứ ba về giọng hát khàn đặc, run rẩy của những người lính; không có chữ nghiêng."
  - segment_id: "YS-LN05/Text/part0020.html/p000460"
    choices:
      - "Điểm nhìn & lời ca tiễn biệt: trần thuật dùng tên riêng 'Tanya'; lời hát tưởng niệm dùng 'chúng tôi' và gọi những người ngã xuống là 'những người đồng chí / các đồng chí' (hoặc phương án trung tính không suy diễn giới tính theo DEC-P01-001)."
  - segment_id: "YS-LN05/Text/part0020.html/p000461"
    choices:
      - "Thuật ngữ quân sự: 'Pistols' -> 'Súng ngắn'; 'Blanks' -> 'Đạn mã tử'; 'three-volley salute' -> 'Ba loạt súng tiễn biệt'; 'live bullet' -> 'đạn thật'; 'White Wings Grand Iron Cross' -> 'Đại Thập tự Sắt Cánh Trắng'; giữ nhịp câu ngắn dồn dập ở ba câu đầu."
  - segment_id: "YS-LN05/Text/part0020.html/p000462"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu bằng dấu sao '*...*' khớp chính xác với thẻ em trong XHTML (DEC-P01-002); 'sectionalism' -> 'thói cục bộ'."
  - segment_id: "YS-LN05/Text/part0020.html/p000463"
    choices:
      - "Nhấn mạnh Markdown & thuật ngữ: bọc toàn bộ câu bằng dấu sao '*...*' khớp chính xác với thẻ em trong XHTML (DEC-P01-002); 'Intelligence' -> 'bên Tình báo'."
