findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000506"
    severity: "minor"
    category: "meaning_nuance"
    issue: "Cụm chỉ mục đích cơ động của bộ binh Đế quốc đang dịch là 'để bồi thêm cho chúng thấm đòn', nghe thiên về việc tiếp tục giáng đòn tấn công vật lý hơn là làm cho đối phương nhận rõ thông điệp/tình thế (khuyên hàng ở đoạn p000504)."
    rationale: "Sau khi tiểu đoàn pháp sư đã chế áp từ trên không và khuyên hàng ở cuối lô trước, bộ binh Đế quốc cơ động áp sát nhằm khẳng định thông điệp và buộc quân Liên bang nhận rõ tình thế không thể kháng cự mà hạ vũ khí."
    recommendation: "Có thể chỉnh nhẹ ở bước chuốt văn thành 'tiến hành cơ động để làm cho chúng thấm thía tình thế' hoặc 'tiến hành cơ động để ép chúng hiểu rõ thông điệp của chúng ta'."
  - segment_id: "YS-LN05/Text/part0010.html/p000518"
    severity: "minor"
    category: "word_choice"
    issue: "Cụm chỉ việc thu xếp/xử lý công việc sau khi giao tranh kết thúc đang dịch là 'giải quyết hậu sự sao cho thỏa đáng sau khi giao tranh kết thúc'."
    rationale: "Trong tiếng Việt hiện đại, 'hậu sự' (lo hậu sự / giải quyết hậu sự) thường mang nghĩa chuyên biệt là việc tang lễ, ma chay cho người đã khuất, trong khi ngữ cảnh tại đây nói về công tác thu xếp hậu chiến như quản lý tù binh và chấn chỉnh kỷ luật lính tráng."
    recommendation: "Đổi 'giải quyết hậu sự' thành 'thu xếp mọi việc' hoặc 'giải quyết công việc sau khi giao tranh kết thúc' ở bước chuốt văn."
