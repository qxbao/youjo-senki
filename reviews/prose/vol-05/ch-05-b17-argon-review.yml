  - segment_id: YS-LN05/Text/part0025.html/p000662
    choices:
      - "Thoại báo cáo của Serebryakov với Tanya: gọi \"Trung tá\" (Colonel), thuật ngữ \"đơn vị tiền tiêu của Quân đội Liên bang\" (Federation Army's advance unit), giữ tình thái \"Có vẻ như\" (It seems like) và \"Chắc hẳn\" (must have been)."
  - segment_id: YS-LN05/Text/part0025.html/p000663
    choices:
