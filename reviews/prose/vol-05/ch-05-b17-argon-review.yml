      - "Đơn vị, cấp bậc & thuật ngữ: \"Tiểu đoàn Pháp sư Trên không số 203\" (203rd Aerial Mage Battalion), \"tác chiến trong mọi điều kiện thời tiết\" (all-weather combat), \"Trung úy Wüstemann và đại đội của anh ta\" (First Lieutenant Wüstemann and his company)."
  - segment_id: YS-LN05/Text/part0025.html/p000661
    choices:
