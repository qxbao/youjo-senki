    issue: "Trong cùng một câu thư gửi chung cho Mẹ và Bà (nhưng vế đầu nhắc trực tiếp đến món bánh của Bà), đại từ tự xưng ngôi thứ nhất chuyển đột ngột từ 'Con' ở đầu câu sang 'cháu' ở hai mệnh đề phụ phía sau, rồi ngay câu kế tiếp (p000013) lại quay về 'Con'."
    evidence: "Nguyên bản dùng cùng một đại từ ngôi thứ nhất số ít xuyên suốt bức thư và trong cả ba vị trí chủ ngữ của câu p000012."
    recommendation: "Đề xuất thống nhất đại từ tự xưng trong câu thành 'Con' ('Con có thể nói rằng con nhớ món bánh nướng nhân táo của Bà lắm, nhưng nếu con nói ở đây mình đã được ăn bánh táo hay chưa...') để liền mạch với toàn bộ bức thư từ p000002 đến p000018."
  - severity: "minor"
    segment_id: "YS-LN05/Text/part0018.html/p000008"
    issue: "Đại từ bất định chỉ tác nhân thứ ba chen ngang lấy mất chỗ trên tàu được cụ thể hóa thành 'một đơn vị nào khác chen ngang'."
    evidence: "Nguyên bản dùng đại từ bất định chỉ người/bên khác nói chung (có thể là sĩ quan cấp cao, cơ quan hoặc đơn vị khác có quyền ưu tiên), không đóng khung sẵn là 'đơn vị'."
    recommendation: "Có thể cân nhắc chỉnh nhẹ thành 'hoặc kẻ nào khác chen ngang' hay 'hoặc bên nào khác chen ngang' ở bước chuốt văn để giữ đúng độ mở của đại từ bất định."
