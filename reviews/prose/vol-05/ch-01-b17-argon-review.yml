findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000582"
    severity: "minor"
    category: "pronouns_voice"
    issue: "Câu trần thuật ngôi thứ ba dùng đại từ phản thân 'mình' trong cụm 'dù cảm thấy mình có thể trông cậy vào những cựu binh' dễ giao thoa với đại từ nội tâm tự quy chiếu theo DEC-P01-001."
    rationale: "Đoạn p000582 là lời trần thuật ngôi thứ ba ('kinh nghiệm của cô... Tanya vẫn nhận thấy...'). Dù 'mình' ở đây đóng vai trò đại từ phản thân tiếng Việt, việc lược bỏ hoặc thay bằng 'bản thân' / 'cô' sẽ giúp giữ ranh giới thật rạch ròi giữa trần thuật và độc thoại nội tâm."
    recommendation: "Có thể chỉnh nhẹ ở bước chuốt văn thành 'nhưng dù cảm thấy có thể trông cậy vào những cựu binh...' hoặc 'nhưng dù cảm thấy bản thân có thể trông cậy vào những cựu binh...'."
  - segment_id: "YS-LN05/Text/part0010.html/p000583"
    severity: "minor"
    category: "word_choice"
    issue: "Dịch 'serious injury' thành 'thương vong nghiêm trọng' làm mở rộng nghĩa sang cả tử vong."
    rationale: "Trong tiếng Việt, 'thương vong' bao gồm cả bị thương lẫn thiệt mạng (casualties), trong khi thuật ngữ nguồn ở đây chỉ nêu nguy cơ bị thương nặng / chấn thương nghiêm trọng do mệt mỏi tích tụ."
    recommendation: "Có thể chỉnh nhẹ ở bước chuốt văn thành 'chấn thương nghiêm trọng' hoặc 'bị thương nặng'."
