    issue: "Câu tự thuật ngôi thứ nhất ngoài lời thoại của Tanya tại p000110 đang dùng đại từ tự quy chiếu 'tôi' ('Tiễn cô ấy ra ngoài xong, tôi khóa cửa khoang tàu lại.'), lệch với đại từ 'Mình / mình' ở ngay đoạn liền trước (p000109) và chưa đồng bộ với quy ước DEC-P01-001 (tự quy chiếu nội tâm/tự thuật ngoài dấu ngoặc kép của Tanya dùng 'mình', phân biệt với 'tôi' trong lời thoại)."
    basis: "DEC-P01-001 trong canon/decisions.md và tính liên tục điểm nhìn với đoạn p000109 ngay trước đó."
    recommendation: "Đổi 'tôi' thành 'mình' ('Tiễn cô ấy ra ngoài xong, mình khóa cửa khoang tàu lại.')."
  - segment_id: "YS-LN05/Text/part0010.html/p000092"
    severity: "minor"
    category: "meaning_precision"
    issue: "Cụm danh từ chỉ vị trí ở cực tiền tuyến đang dịch là 'nơi tuyến đầu ác liệt nhất', tự thêm tính từ đánh giá mức độ giao tranh ('ác liệt') không có trong từ gốc chỉ vị trí không gian xa nhất ở phía trước."
    basis: "Nguyên tắc tại canon/style-guide.md: giữ đúng nghĩa và sắc thái của bản gốc, không tự thêm chi tiết ngoài nguồn."
    recommendation: "Đổi 'nơi tuyến đầu ác liệt nhất' thành 'nơi tuyến tiền tiêu xa nhất' (hoặc 'nơi tuyến đầu xa nhất')."
  - segment_id: "YS-LN05/Text/part0010.html/p000106"
    severity: "minor"
    category: "meaning_precision"
    issue: "Vị ngữ rủa thầm cấp trên ở cuối câu thứ hai đang dịch là 'cứ việc xuống địa ngục mà mục rữa đi', thêm cụm 'xuống địa ngục' không có trong động từ gốc chỉ trạng thái mục rữa."
    basis: "Nguyên tắc tại canon/style-guide.md: không tự thêm giải thích hay chi tiết ngoài nguồn."
    recommendation: "Lược cụm 'xuống địa ngục mà', chỉnh thành 'cứ việc mục rữa đi'."
