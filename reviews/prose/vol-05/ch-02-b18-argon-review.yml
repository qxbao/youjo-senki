    severity: "minor"
    category: "pronouns"
    issue: "Trong cùng lượt lời báo cáo của Habergram với Thủ tướng Churbull, câu đầu và câu cuối dùng 'chúng tôi' (chỉ ngành Tình báo), nhưng câu giữa lại chuyển sang 'chúng ta' khi nói về việc không thể loại trừ khả năng kẻ nội gián đã thành điệp viên nằm vùng."
    basis: "Đối chiếu mạch xưng hô đại diện cơ quan trong cùng lời thoại báo cáo tại p000429."
    recommendation: "Có thể giữ nguyên nếu hiểu là cách nói bao gộp người nghe trong nhận định chung, hoặc thống nhất thành 'chúng tôi' ở bước chuốt văn để liền mạch ngôi báo cáo."
  - segment_id: "YS-LN05/Text/part0016.html/p000457"
    severity: "minor"
    category: "style"
    issue: "Từ 'thái quá' trong câu nhận xét về các hướng nhìn nhận ở đoạn trước thiên về nghĩa 'vượt quá giới hạn hành xử', chưa thật sát nét nghĩa 'cực đoan / ở hai thái cực đối lập' của bản gốc."
    basis: "Đối chiếu với ba câu hỏi nội tâm đối chọi nhau ngay trước đó tại p000456 (tín hiệu đáng mừng, lũ ngốc cả tin hay sững sờ trước sự thành tâm)."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ thành 'Các hướng suy nghĩ mới cực đoan làm sao' / 'Các phương án lựa chọn mới cực đoan làm sao' ở bước chuốt văn."
