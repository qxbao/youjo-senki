      - "Giữ cấu trúc điều kiện 'Nếu đã được lệnh lên đường, ông chỉ còn biết đi và làm hết sức mình mà thôi.'."
  - segment_id: "YS-LN05/Text/part0016.html/p000462"
    choices:
      - "Khóa tên tàu 'RMS *Queen of Anjou*' với đúng phạm vi nhấn mạnh Markdown theo DEC-P01-002."
      - "Khóa 'Bộ Dân ủy Nội vụ' ('Commissariat for Internal Affairs') và 'cuộc trao đổi nhân sự không chính thức' ('unofficial exchange of personnel')."
  - segment_id: "YS-LN05/Text/part0016.html/p000463"
    choices:
      - "Giữ cấu trúc phủ định kép 'Sẽ là nói dối nếu tôi bảo mình không lấy làm hổ thẹn' và chuỗi biểu cảm 'lũ phản bội khốn kiếp, bọn bán nước cầu vinh và đám Cộng sản'."
  - segment_id: "YS-LN05/Text/part0016.html/p000464"
    choices:
      - "Giữ sự đối lập giữa 'chiếc mặt nạ cứng nhắc, gần như vô cảm' trước đó và biểu cảm 'nhẹ nhõm, sự chấp nhận, hay có lẽ là niềm vui mừng'."
  - segment_id: "YS-LN05/Text/part0016.html/p000465"
    choices:
      - "Giữ cấu trúc điều kiện phủ định 'Tôi chẳng thể phàn nàn gì nếu chúng ta có thể đưa người của mình trở về từ tay lũ sát thủ Cộng sản đó.'."
  - segment_id: "YS-LN05/Text/part0016.html/p000466"
    choices:
      - "Khóa 'Cơ quan tình báo của Khối Thịnh vượng chung' ('The Commonwealth’s intelligence agency') và 'những người Cộng sản' ('the Communists')."
      - "Giữ phủ định 'bặt vô âm tín' ('there had been no news') và 'chẳng hề ôm ấp chút ảo tưởng nào về độ lịch thiệp của những người Cộng sản'."
