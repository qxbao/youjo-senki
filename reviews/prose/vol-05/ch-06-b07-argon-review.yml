      - "Giữ nguyên sắc thái mỉa mai trong trần thuật về sự đồng thanh thiếu cá tính của các sĩ quan."
  - segment_id: "YS-LN05/Text/part0029.html/p000258"
    choices:
      - "Giữ nguyên ba lớp dấu ngoặc kép '“““Đi đâu ạ?”””' biểu thị nhiều người đồng thanh hỏi cấp trên."
  - segment_id: "YS-LN05/Text/part0029.html/p000259"
    choices:
      - "Trần thuật dùng 'Tanya' và 'Nó / nó'; thoại dùng 'đài vô tuyến', 'Tướng von Zettour', 'đúng mười hai giờ trưa nay', xưng hô thân mật hơn ở câu mời ăn trưa ('Chúng ta', 'Mấy anh')."
  - segment_id: "YS-LN05/Text/part0029.html/p000260"
    choices:
      - "Khóa dòng tiêu đề chuyển cảnh in hoa 'CÙNG NGÀY HÔM ĐÓ, LÃNH THỔ BỊ ĐẾ QUỐC CHIẾM ĐÓNG Ở PHÍA ĐÔNG'."
