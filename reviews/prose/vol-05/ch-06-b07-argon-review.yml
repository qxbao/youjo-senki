findings:
  - segment_id: "YS-LN05/Text/part0029.html/p000256"
    severity: "minor"
    category: "idiom_and_wordplay"
    issue: "Thành ngữ 'Trăm nghe không bằng một thấy' đã chứa sẵn yếu tố 'nghe' ở vế bị xem nhẹ, khiến câu đính chính nối tiếp chuyển sang 'nghe' hơi giảm độ sắc của phép chơi chữ đối ứng trong nguyên bản."
    rationale: "Nguyên bản đặt mệnh đề đầu xoay quanh việc nhìn thấy làm cơ sở tạo niềm tin, rồi lập tức đính chính sang hành động nghe vì cả nhóm chuẩn bị nghe bài phát biểu qua đài vô tuyến."
    recommendation: "Có thể giữ nguyên nếu ưu tiên thành ngữ quen thuộc, hoặc cân nhắc chỉnh ở bước chuốt văn thành 'Thấy tận mắt mới tin. Chà, tôi đoán trong trường hợp này thì phải là ‘nghe tận tai’ mới đúng.' để giữ trọn hiệu ứng chuyển từ nhìn sang nghe."
