    issue: "Thành ngữ 'left him high and dry' trong ngữ cảnh hai bên hải quân và không quân lập tức buông lời từ chối phũ phàng ở các đoạn kế tiếp nghiêng về nghĩa dội gáo nước lạnh hoặc đáp trả phũ phàng khiến người hỏi chưng hửng hơn là 'mặc kệ ông ta chơ vơ'."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi thành 'họ đáp trả phũ phàng khiến ông ta chưng hửng' hoặc 'họ thẳng thừng bỏ mặc ông ta chưng hửng'."
  - segment_id: YS-LN05/Text/part0016.html/p000230
    severity: minor
    category: word_choice
    issue: "Từ 'lẻ tẻ' trong cụm 'một xu lẻ tẻ' thường dùng cho số nhiều rải rác, kết hợp với danh từ số ít ('a single, measly pence') hơi kém tự nhiên."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi thành 'một đồng xu còm' hoặc 'một đồng pence lẻ'."
