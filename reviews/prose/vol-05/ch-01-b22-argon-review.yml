  - segment_id: "YS-LN05/Text/part0012.html/p000013"
    choices:
      - "Giữ đại từ nội tâm 'chúng ta'."

  - segment_id: "YS-LN05/Text/part0012.html/p000014"
    choices:
      - "Giữ thuật ngữ 'hoạt động chống nổi dậy' (counterinsurgency), 'Quân đội Anh', 'thuộc địa', 'Malaya', đại từ khái quát 'ta', và nhấn mạnh Markdown '*hửm*' ở cuối câu."

  - segment_id: "YS-LN05/Text/part0012.html/p000015"
    choices:
      - "Giữ thuật ngữ 'thuộc địa' và 'mẫu quốc' (suzerain state), cùng đại từ khái quát 'Người ta'."

  - segment_id: "YS-LN05/Text/part0012.html/p000016"
    choices:
      - "Giữ nhấn mạnh Markdown '*Ồ*' ở đầu câu đúng theo thẻ em (DEC-P01-002) và câu dẫn trần thuật 'Tanya thầm nghĩ'."

  - segment_id: "YS-LN05/Text/part0012.html/p000017"
    choices:
      - "Toàn bộ câu hỏi nội tâm bọc nhấn mạnh Markdown '*Đơn giản quá còn gì nữa?*' theo DEC-P01-002."

  - segment_id: "YS-LN05/Text/part0012.html/p000018"
    choices:
      - "Giữ nghĩa phủ định sự cần thiết phải đối đầu với toàn bộ kẻ địch, không thêm trạng ngữ thời gian 'cùng một lúc'."

  - segment_id: "YS-LN05/Text/part0012.html/p000019"
    choices:
      - "Giữ đại từ 'Chúng ta' và thành ngữ chiến lược 'chia để trị' (divide and conquer)."

  - segment_id: "YS-LN05/Text/part0012.html/p000020"
    choices:
      - "Câu dẫn trần thuật dùng 'Tanya'; câu cuối là nội tâm của Tanya khóa đại từ 'chúng ta' và làm rõ chủ thể giao chiến ('số lượng kẻ địch mà ta phải giao chiến')."

  - segment_id: "YS-LN05/Text/part0012.html/p000021"
    choices:
      - "Khóa thành ngữ 'dù tốt hay xấu' (for better or worse) và thuật ngữ 'quốc gia đa sắc tộc' (multiethnic state)."

  - segment_id: "YS-LN05/Text/part0012.html/p000022"
    choices:
      - "Giữ nhấn mạnh Markdown '*Chủ nghĩa Cộng sản lý tưởng*' đúng phạm vi thẻ em (DEC-P01-002)."
      - "Giữ mức độ giả định/khả năng ('Nếu... thì biết đâu lại có thể...', 'Nếu chỉ xét thuần túy về mặt khả năng... có tiềm năng...')."

  - segment_id: "YS-LN05/Text/part0012.html/p000023"
    choices:
      - "Giữ đại từ 'chúng ta', từ nguyên gốc 'hikikomori', và định danh 'Đế quốc', 'Liên bang'."

  - segment_id: "YS-LN05/Text/part0012.html/p000024"
    choices:
      - "Giữ đại từ 'chúng ta'."

  - segment_id: "YS-LN05/Text/part0012.html/p000025"
    choices:
      - "Thoại độc thoại của Tanya giữ đại từ 'Mình' theo DEC-P01-001."

  - segment_id: "YS-LN05/Text/part0012.html/p000026"
    choices:
      - "Độc thoại nội tâm kết chương của Tanya khóa đại từ 'mình' theo DEC-P01-001."
