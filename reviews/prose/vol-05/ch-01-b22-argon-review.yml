    issue: "Bản dịch chuyển sang đại từ 'tôi' ở các câu độc thoại nội tâm ngôi thứ nhất không in nghiêng của Tanya, gây vênh điểm nhìn với các câu tự nhủ/nội tâm liền kề dùng 'mình' (p000798, p000806, p000002, p000025) và chưa khớp quyết định DEC-P01-001."
    rationale: "Theo DEC-P01-001 trong canon/decisions.md, trần thuật về Tanya dùng 'nó' và nội tâm tự quy chiếu của Tanya dùng 'mình'. Toàn bộ chuỗi đoạn này là dòng tự vấn của Tanya khi ở một mình trong phòng chỉ huy."
    recommendation: "Thống nhất đại từ tự quy chiếu ngôi thứ nhất số ít trong độc thoại nội tâm của Tanya ở các đoạn trên thành 'mình' (hoặc kết hợp 'bản thân' ở vị trí tân ngữ/sở hữu như p000807, p000808 để tránh lặp từ)."

  - segment_id: "YS-LN05/Text/part0010.html/p000796"
    segment_ids:
      - "YS-LN05/Text/part0010.html/p000796"
      - "YS-LN05/Text/part0010.html/p000800"
      - "YS-LN05/Text/part0010.html/p000803"
      - "YS-LN05/Text/part0012.html/p000020"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Đại từ ngôi thứ nhất số nhiều trong độc thoại nội tâm của Tanya đang dịch là 'chúng tôi' ở p000796, p000800, p000803, p000020, không nhất quán với 'chúng ta' ở các câu liền kề (p000802, p000804, p000011, p000013, p000019, p000023, p000024)."
    rationale: "Trong độc thoại nội tâm khi Tanya tự suy xét về phía Đế quốc, đại từ số nhiều mang tính tự quy chiếu bao gộp là 'chúng ta' (phù hợp với mục viewpoint and radio dialogue pronouns trong pending-terms-index.yml). Việc xen 'chúng tôi' ngay giữa p000802 và p000804 làm đứt mạch giọng nội tâm."
    recommendation: "Đổi 'chúng tôi' thành 'chúng ta' tại p000796, p000800, p000803 và p000020."

  - segment_id: "YS-LN05/Text/part0012.html/p000009"
    severity: "moderate"
    category: "terminology"
    issue: "Thuật ngữ quân sự 'field army' đang được dịch là 'quân đoàn dã chiến', làm lệch cấp biên chế từ cấp tập đoàn quân/đạo quân dã chiến sang cấp quân đoàn (corps)."
    rationale: "Trong hệ thống thuật ngữ quân sự của truyện, 'corps' mới là 'quân đoàn', còn 'field army' chỉ lực lượng/đạo quân dã chiến (hoặc tập đoàn quân dã chiến) của đối phương trên chiến trường."
    recommendation: "Sửa 'quân đoàn dã chiến của địch' thành 'đạo quân dã chiến của địch' hoặc 'lực lượng dã chiến của địch'."

  - segment_id: "YS-LN05/Text/part0012.html/p000018"
    severity: "minor"
    category: "meaning_logic"
    issue: "Bản dịch thêm cụm 'cùng một lúc' ('đối đầu với tất cả bọn họ cùng một lúc'), làm hẹp nghĩa của 'take them all on' theo hướng đánh lần lượt theo thời gian thay vì không cần đối địch với toàn bộ các nhóm."
    rationale: "Mạch suy luận từ p000018 sang p000019–p000022 là chia rẽ kẻ địch để giảm số lượng kẻ thù phải đánh và lôi kéo một số nhóm sắc tộc làm đồng minh, chứ không phải đánh từng nhóm theo thứ tự thời gian."
    recommendation: "Lược bỏ 'cùng một lúc', chỉnh thành: 'Thành thật mà nói, chẳng việc gì phải đối đầu với tất cả bọn họ cả.'"

  - segment_id: "YS-LN05/Text/part0012.html/p000020"
    severity: "minor"
    category: "syntax_clarity"
    issue: "Cụm 'số lượng đối phương phải giao chiến sẽ giảm đi' dễ gây hiểu nhầm đối phương là chủ thể của 'phải giao chiến'."
    rationale: "Nguồn xác định rõ chủ thể phải giao chiến là phía người nói (ngôi 'you' khái quát), còn đối phương là tân ngữ của hành động giao chiến."
    recommendation: "Làm rõ quan hệ cú pháp thành: 'Nếu chia rẽ được kẻ địch thành công, số lượng kẻ địch mà ta phải giao chiến sẽ giảm đi.'"

  - segment_id: "YS-LN05/Text/part0012.html/p000021"
    severity: "minor"
    category: "modality_idiom"
    issue: "Cụm 'for better or worse' được dịch là 'dù muốn hay không', lệch nhẹ từ bình diện đánh giá hệ quả tốt/xấu sang ý muốn chủ quan."
    rationale: "Nhận định của Tanya đánh giá đặc điểm đa sắc tộc của Liên bang như một thực tế hai mặt (vừa tạo sức mạnh nhưng cũng vừa tạo kẽ hở để chia rẽ)."
    recommendation: "Đổi 'dù muốn hay không' thành 'dù tốt hay xấu' hoặc 'dù hay hay dở'."

