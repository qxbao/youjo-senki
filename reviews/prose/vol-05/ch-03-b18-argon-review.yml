  - segment_id: "YS-LN05/Text/part0020.html/p000345"
    choices:
      - "Thuật ngữ & kết quả: khóa 'viên đạn thuật thức', 'cự ly gần', 'thuật thức phát nổ' và chi tiết phần đầu quả lựu đạn vỡ tung tóe."
  - segment_id: "YS-LN05/Text/part0020.html/p000346"
    choices:
      - "Thoại cảm thán: giữ '“Á…… Hự…!”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000347"
    choices:
      - "Thoại: giữ '“Ha! Đáng đời lắm!”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000348"
    choices:
      - "Thoại: giữ '“Hạ được một tên! Tuyệt vời!”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000349"
    choices:
      - "Đại từ trần thuật, cách gọi & nhấn mạnh Markdown: khóa đại từ 'nó' cho Tanya, 'Nữ pháp sư kia / cô ả' cho địch, cùng hai phần in nghiêng '*ừ*' và '*Chẳng lẽ điều đó có nghĩa là…*' theo đúng thẻ <em> của nguồn."
  - segment_id: "YS-LN05/Text/part0020.html/p000350"
    choices:
      - "Nhấn mạnh Markdown & câu hỏi nội tâm: khóa toàn câu trong '*...*' ('*…cô ả đã gượng dậy được sao?*') theo đúng thẻ <em> của nguồn."
  - segment_id: "YS-LN05/Text/part0020.html/p000351"
    choices:
      - "Thoại & thuật ngữ: giữ phủ định 'không đâu' và 'một mục tiêu chưa xác nhận'."
  - segment_id: "YS-LN05/Text/part0020.html/p000352"
    choices:
      - "Xưng hô cấp dưới - cấp trên: khóa cách gọi 'Trung tá' cho đại từ ngôi thứ hai khi cấp dưới nói với Tanya."
  - segment_id: "YS-LN05/Text/part0020.html/p000353"
    choices:
      - "Thoại, tình thái & phủ định: giữ 'Có vẻ cô ả đã gượng lại được vào giây cuối cùng', lời dặn không tính chiến công chưa chắc chắn và so sánh 'khai khống thành tích'."
  - segment_id: "YS-LN05/Text/part0020.html/p000354"
    choices:
      - "Điểm nhìn nội tâm & tình thái: giữ đại từ 'mình', 'cô ả' và nhận định 'khả năng cao là sẽ được giải cứu'."
  - segment_id: "YS-LN05/Text/part0020.html/p000355"
    choices:
      - "Giả định & phủ định kép: giữ 'Ngay cả khi cô ả rơi xuống vùng biển giá buốt' và phủ định kép 'khả năng sống sót cũng không hề thấp'."
  - segment_id: "YS-LN05/Text/part0020.html/p000356"
    choices:
      - "Thoại & xưng hô: giữ ví von 'dai như gián', xưng hô 'tôi - chúng ta', cụm 'lính Đế quốc' và làm rõ quy chiếu người cha của nữ pháp sư địch."
  - segment_id: "YS-LN05/Text/part0020.html/p000357"
    choices:
      - "Quân hàm & xưng hô: khóa 'Trung tá' / 'thưa Trung tá' (Colonel)."
  - segment_id: "YS-LN05/Text/part0020.html/p000358"
    choices:
      - "Thoại & liên kết nội văn bản: giữ ý thành ngữ không đánh giá qua vẻ bề ngoài/trang bìa đồng bộ với phân tích ở p000362."
  - segment_id: "YS-LN05/Text/part0020.html/p000359"
    choices:
      - "Điểm nhìn nội tâm: giữ đại từ 'mình / Mình' và 'họ' (thuộc hạ của Tanya)."
  - segment_id: "YS-LN05/Text/part0020.html/p000360"
    choices:
      - "Thoại & phủ định: giữ đại từ 'tôi' và phủ định 'nhưng chuyện đang nói không phải là về cái đó'."
  - segment_id: "YS-LN05/Text/part0020.html/p000361"
    choices:
      - "Điểm nhìn nội tâm & câu hỏi tu từ: giữ đại từ 'mình', hình ảnh 'một bé gái' và 'đặc điểm nhận dạng'."
  - segment_id: "YS-LN05/Text/part0020.html/p000362"
    choices:
      - "Lập luận & thuật ngữ: giữ phân tích về câu nói 'đừng đánh giá cuốn sách qua trang bìa' và nhận định 'ngoại hình lại là dữ liệu vô cùng hữu ích' khi xét đến việc nhận diện."
  - segment_id: "YS-LN05/Text/part0020.html/p000363"
    choices:
      - "Điểm nhìn nội tâm & phủ định: giữ đại từ 'Mình' và phủ định 'chẳng thích bị chú ý trên chiến trường chỉ vì thân hình nhỏ nhắn chút nào'."
  - segment_id: "YS-LN05/Text/part0020.html/p000364"
    choices:
      - "Thoại & thuật ngữ: khóa đại từ 'Tôi / tôi' và 'câu lạc bộ sĩ quan' (officers’ club)."
  - segment_id: "YS-LN05/Text/part0020.html/p000365"
    choices:
      - "Quân hàm & sắc thái: khóa 'Xin Trung tá thứ lỗi' (Colonel) và nét nghĩa 'buồn cười không chịu được'."
  - segment_id: "YS-LN05/Text/part0020.html/p000366"
    choices:
      - "Quân hàm & xưng hô: khóa cách gọi 'Trung tá' (you), đại từ 'tôi' và danh xưng 'Thiếu tá Weiss' (Major Weiss)."
