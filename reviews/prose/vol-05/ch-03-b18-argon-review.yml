findings:
  - segment_id: "YS-LN05/Text/part0020.html/p000323"
    severity: "minor"
    issue: "Lời xin phép mở đầu qua vô tuyến của 05 đang dịch là 'cho phép tôi đề xuất một việc được không?', tự bổ sung trước nét nghĩa 'đề xuất một việc' khi nhân vật mới chỉ xin phép lên tiếng."
    evidence: "Ở p000323 nhân vật 05 mới hỏi xin phép ngắn gọn trước khi rút lui; đến p000325 mới nêu nội dung và p000326 trần thuật mới định danh đó là đề xuất của Grantz."
    recommendation: "Đề xuất đổi thành 'cho phép tôi nói một chút được không?' hoặc 'cho tôi xin phép một chút được không?'."
  - segment_id: "YS-LN05/Text/part0020.html/p000329"
    severity: "minor"
    issue: "Trong câu 'Vậy thì bọn mình nên trao cho chúng cơ hội để bảo vệ thứ quý giá của mình', đại từ phản thân 'của mình' đứng cuối câu có chủ ngữ 'bọn mình' dễ gây nhập nhằng quy chiếu với phe Tanya thay vì lực lượng hộ tống địch."
    evidence: "Câu trước vừa xác lập đối với lực lượng hộ tống thì con tàu này vô cùng quý giá, nên đối tượng cần bảo vệ là thứ quý giá đối với phía địch."
    recommendation: "Đề xuất đổi 'thứ quý giá của mình' thành 'thứ quý giá của chúng' hoặc 'thứ quý giá đối với chúng'."
  - segment_id: "YS-LN05/Text/part0020.html/p000331"
    severity: "minor"
    issue: "Câu 'Nó là một nàng công chúa' dùng đại từ 'Nó' cho con tàu dễ trùng với đại từ trần thuật chỉ Tanya theo DEC-P01-001, đồng thời lượng từ bất định 'một' chưa khớp với danh hiệu xác định của con tàu."
    evidence: "Ở các batch trước trong chương 3, chiếc RMS Queen of Anjou đã được gọi là nàng công chúa của biển cả, và câu kế tiếp nói ngay cả đám hiệp sĩ hải tặc này cũng không thể bỏ mặc công chúa của chúng."
    recommendation: "Đề xuất đổi thành 'Con tàu đó chính là nàng công chúa.' hoặc 'Đó chính là nàng công chúa của chúng.'."
  - segment_id: "YS-LN05/Text/part0020.html/p000356"
    severity: "minor"
    issue: "Trong câu thoại 'Mà sao cô ả lại dám chắc là tôi đã giết cha mình chứ?', đại từ phản thân 'mình' đặt sau chủ ngữ 'tôi' dễ bị đọc nhầm theo ngữ pháp tiếng Việt thành cha của người nói (Tanya)."
    evidence: "Ở p000282 (batch 17), nữ pháp sư địch vừa lao vào tấn công Tanya để trả thù cho cha của cô ả."
    recommendation: "Đề xuất đổi 'đã giết cha mình' thành 'đã giết cha cô ả' hoặc 'đã giết cha của ả'."
  - segment_id: "YS-LN05/Text/part0020.html/p000358"
    severity: "minor"
    issue: "Thành ngữ ở p000358 dịch thoát ý theo tục ngữ Việt là 'đừng trông mặt mà bắt hình dong', làm đứt mạch liên kết từ vựng trực tiếp với p000362 khi Tanya phân tích nghĩa đen của chính câu nói này ('đừng đánh giá cuốn sách qua trang bìa' và 'nội dung bên trong')."
    evidence: "Ở p000362, độc thoại nội tâm của Tanya nhắc lại câu nói nổi tiếng vừa nêu ở p000358 dựa trên hình ảnh trang bìa cuốn sách và nội dung bên trong."
    recommendation: "Đề xuất chỉnh p000358 thành '“Nhưng người ta vẫn bảo đừng đánh giá một cuốn sách qua trang bìa kia mà.”' để khớp mạch với p000362."
