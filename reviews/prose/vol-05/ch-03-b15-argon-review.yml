findings:
  - segment_id: "YS-LN05/Text/part0020.html/p000162"
    severity: "minor"
    issue: "Cụm 'your commander’s judgment' được dịch là 'phán đoán của chỉ huy các anh', tự thêm đại từ ngôi thứ hai chỉ nam giới ('các anh') khi đơn vị có cả nữ sĩ quan (như Serebryakov) và làm hẹp nghĩa 'your commander' (chỉ huy trực tiếp của từng đại đội)."
    evidence: "Trong p000161-p000162, Tanya tách tiểu đoàn tăng cường thành bốn đại đội tăng cường và yêu cầu binh sĩ tuân theo phán đoán của cấp chỉ huy (đối ứng với p000171 về 'each level’s commanders'). Theo DEC-P01-001, tránh tự suy diễn giới tính hoặc thu hẹp đối tượng xưng hô trong thoại mệnh lệnh chung."
    recommendation: "Đề xuất đổi 'chỉ huy các anh' thành 'cấp chỉ huy của mình' hoặc 'chỉ huy của mình'."
  - segment_id: "YS-LN05/Text/part0020.html/p000168"
    severity: "minor"
    issue: "Thuật ngữ 'Disciplined fire!' trong khẩu lệnh của Trung tá Drake đang dịch là 'Bắn có kiểm soát!', lệch nhẹ về mặt hình thức danh ngữ so với thuật ngữ pending đã khóa trong sổ ('hỏa lực có kiểm soát')."
    evidence: "Trong work/run-state/pending-terms-index.yml, 'disciplined fire' được thống nhất đề xuất là 'hỏa lực có kiểm soát'."
    recommendation: "Có thể giữ nếu ưu tiên nhịp khẩu lệnh ngắn, hoặc chỉnh thành 'Hỏa lực có kiểm soát!' / 'Duy trì hỏa lực có kiểm soát!' để đồng bộ tuyệt đối với sổ thuật ngữ pending."
  - segment_id: "YS-LN05/Text/part0020.html/p000170"
    severity: "minor"
    issue: "Câu thoại ngắn mang dấu '?!' ('Don’t take it?!') đang dịch theo thức mệnh lệnh ('Đừng đỡ trực diện?!'), làm mờ sắc thái hỏi lại đầy sửng sốt trước lệnh tản ra ('Break!') ngay trước đó và lệnh phản bác ('No, stop them!') ngay sau đó."
    evidence: "Trình tự ba câu thoại đầu của p000170 thể hiện sự rối loạn trong hàng ngũ địch: một bên hô tản ra tránh đòn xung phong, một người sững sờ hỏi lại vì sao không nghênh cản, và người tiếp theo bác bỏ để bắt chặn lại bảo vệ tàu."
    recommendation: "Đề xuất chỉnh 'Đừng đỡ trực diện?!' thành câu hỏi nghi vấn mang sắc thái bất ngờ như 'Không chặn đỡ sao?!' hoặc 'Không nghênh cản sao?!'."
  - segment_id: "YS-LN05/Text/part0020.html/p000191"
    severity: "minor"
    issue: "Cụm 'fire through your allies' dịch sát chữ là 'bắn xuyên qua đồng đội', dễ gợi nhầm nghĩa bắn xuyên qua cơ thể đồng đội thay vì bắn xuyên qua khe hở giữa đội hình quân mình."
    evidence: "Ngữ cảnh p000187-p000191 nói về việc các đại đội địch bám đuôi đang tách đội hình để mở đường bắn ('line of fire') cho tuyến trên bắn qua."
    recommendation: "Đề xuất làm rõ thành 'bắn xuyên qua đội hình đồng đội' hoặc 'bắn qua khe hở giữa đồng đội'."
