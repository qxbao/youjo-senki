findings:
  - segment_id: "YS-LN05/Text/part0016.html/p000563"
    severity: "minor"
    category: "register_and_nuance"
    issue: "Cụm thành ngữ chỉ những nhân vật có tầm ảnh hưởng lớn trên chính trường phương Tây đang được dịch là 'Những kẻ thao túng', thêm sắc thái miệt thị tiêu cực chưa có trực tiếp trong từ gốc (trong ngữ cảnh Loria đang đặt họ ngang hàng với tầng lớp tinh hoa như phía mình)."
    basis: "Nguyên tắc tại canon/style-guide.md: không thêm sắc thái phán xét hoặc miệt thị không có trong nguồn."
    recommendation: "Cân nhắc chỉnh thành 'Những nhân vật nắm quyền xoay chuyển trên chính trường' hoặc 'Những người có tầm ảnh hưởng lớn trên chính trường' ở bước chuốt văn."
  - segment_id: "YS-LN05/Text/part0016.html/p000565"
    severity: "minor"
    category: "word_choice"
    issue: "Tính từ bổ nghĩa cho hệ triết lý, mục tiêu và nguyên tắc phổ quát đang dịch là 'hào nhoáng' (thường hàm ý bóng bẩy giả tạo), chưa thật ăn khớp với mạch lập luận ngay sau đó về việc giành được sự cảm thông vì ai cũng ngưỡng mộ sự chính trực."
    basis: "Nguyên tắc tại canon/style-guide.md: giữ đúng bình diện đánh giá và quan hệ nhân quả theo ngữ cảnh."
    recommendation: "Cân nhắc đổi 'hào nhoáng' thành 'chói lọi' hoặc 'rực rỡ' ở bước chuốt văn."
  - segment_id: "YS-LN05/Text/part0016.html/p000581"
    severity: "minor"
    category: "address_and_hierarchy"
    issue: "Trong lời thoại của Loria (Bộ trưởng Bộ Dân ủy Nội vụ) giáo huấn viên cấp dưới đang lúng túng trước mặt mình, hô ngữ đang dịch là 'thưa đồng chí' làm đảo ngược sắc thái thứ bậc cấp trên – cấp dưới."
    basis: "Nguyên tắc tại canon/style-guide.md và DEC-P01-001: giữ giọng thoại nhất quán với vị thế và quan hệ nhân vật trong ngữ cảnh."
    recommendation: "Cân nhắc bỏ từ 'thưa', chỉnh thành 'Và một chiến thắng, đồng chí ạ, phải là thứ mà chúng ta có thể chấp nhận được.' ở bước chuốt văn."
