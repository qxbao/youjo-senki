    severity: "minor"
    category: "tone_and_register"
    issue: "Thán từ mở đầu đoạn p000166 được in nghiêng trong nguồn biểu thị tiếng rên bực dọc, ngao ngán của Tanya khi linh cảm chẳng lành thành sự thật, nhưng bản dịch hiện để là '*Ái chà.*' mang sắc thái ngạc nhiên thích thú hoặc cảm thán nhẹ nhàng, lệch với tâm trạng bức bối ở câu sau."
    basis: "Nguyên tắc tại canon/style-guide.md: giữ đúng sắc thái và giọng kể theo ngữ cảnh; DEC-P01-002 về giữ nhấn mạnh chữ nghiêng."
    recommendation: "Đổi '*Ái chà.*' thành '*Hự.*' hoặc '*Khốn thật.*' (giữ định dạng chữ nghiêng '*...*')."
  - segment_id: "YS-LN05/Text/part0010.html/p000174"
    severity: "minor"
    category: "pronouns_and_viewpoint"
    issue: "Trong độc thoại nội tâm bức xúc của Tanya ở p000174 và p000175 khi nói về bản thân cùng đơn vị, đại từ ngôi thứ nhất số nhiều đang dịch là 'chúng mình', mang sắc thái thân mật đời thường không hợp với giọng độc thoại quân sự gay gắt của Tanya."
    basis: "Nguyên tắc tại canon/style-guide.md và quy ước đại từ nội tâm trong pending-terms-index.yml: giữ giọng kể nhất quán theo ngữ cảnh, dùng 'chúng ta' (hoặc 'bọn mình') trong độc thoại nội tâm ngôi thứ nhất số nhiều của Tanya."
    recommendation: "Đổi 'chúng mình' ở p000174 (hai lần) và 'Chúng mình' ở đầu p000175 thành 'chúng ta' / 'Chúng ta' (hoặc 'bọn mình' / 'Bọn mình')."
