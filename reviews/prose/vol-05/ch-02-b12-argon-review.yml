findings:
  - segment_id: YS-LN05/Text/part0016.html/p000189
    severity: minor
    category: word_choice
    issue: "Cụm 'public schools' trong bối cảnh Khối Thịnh vượng chung (mô phỏng Anh) chỉ hệ thống trường công học/trường tư thục tinh hoa, dịch thành 'các trường danh tiếng' làm rõ hàm ý xã hội nhưng hơi thoát khỏi danh từ định chế gốc."
    recommendation: "Khi chuốt văn có thể cân nhắc 'các trường công học danh tiếng' hoặc giữ 'các trường danh tiếng' nếu ưu tiên nhịp đọc tự nhiên."
  - segment_id: YS-LN05/Text/part0016.html/p000219
    severity: minor
    category: word_choice
    issue: "Động từ 'shore them up' trong ngữ cảnh tính toán viện trợ quân sự nghiêng về nghĩa chống đỡ hoặc củng cố sức cầm cự hơn là 'vực dậy họ'."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi thành 'chống đỡ cho họ' hoặc 'củng cố sức cầm cự cho họ'."
