    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ thành 'Được thành lập nhanh chóng, đơn vị đã gặt hái thành công tương xứng...' ở bước chuốt văn."
  - segment_id: YS-LN05/Text/part0022.html/p000117
    severity: minor
    issue: "Trong lời thoại của Tanya (Trung tá, chỉ huy trực tiếp) nói với cấp dưới là Thiếu tá Weiss, tiểu từ 'ạ' trong cụm 'Thiếu tá Weiss ạ' dễ gợi sắc thái kính ngữ của cấp dưới thưa gửi cấp trên hơn là lối nói chêm mang giọng điệu nhắc nhở của chỉ huy."
    recommendation: "Có thể lược chữ 'ạ' thành 'Nói cách khác, Thiếu tá Weiss, tôi đang nghĩ…' (tương tự cách gọi ở p000130) hoặc 'Nói cách khác, Thiếu tá Weiss này, tôi đang nghĩ…'."
