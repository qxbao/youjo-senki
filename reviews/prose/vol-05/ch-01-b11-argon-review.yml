    rationale: "Ở các đoạn kế tiếp (p000352–p000377), Tanya trực tiếp đối đáp hai chiều rồi gác ống nghe; giữ cách diễn đạt mở sát với cụm giới từ chỉ nơi chốn của nguyên văn sẽ tự nhiên và khớp mạch hơn."
    recommendation: "Có thể lược chữ 'gửi về' thành 'Từ ngoài thực địa, thưa Trung tá.' hoặc 'Từ hiện trường, thưa Trung tá.' trong bước chuốt văn."
  - segment_id: "YS-LN05/Text/part0010.html/p000370"
    severity: "minor"
    category: "pronouns_reference"
    issue: "Chủ thể 'Communism' ở vế đầu là danh từ số ít chỉ ý thức hệ nhưng sang vế hai lại được quy chiếu bằng đại từ số nhiều 'chúng'."
    rationale: "Nguyên văn dùng đại từ ngôi thứ ba số ít ở vế phụ và lặp lại danh từ 'Communism' ở vế chính; dùng 'nó' hoặc giữ cấu trúc quy chiếu số ít sẽ khớp ngữ pháp và sắc thái châm biếm học thuyết hơn."
    recommendation: "Có thể chỉnh nhẹ thành 'thì trong khoản đập phá, nó chắc chắn là rất cừ.' khi chuốt văn."
