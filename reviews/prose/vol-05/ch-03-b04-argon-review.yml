findings:
  - segment_id: "YS-LN05/Text/part0018.html/p000095"
    severity: "minor"
    category: "diction"
    issue: "Động từ 'gasps' khi nghe tin đột ngột được dịch là 'nín thở' dễ gợi sắc thái chủ động giữ hơi thở chờ đợi hơn là phản xạ hít mạnh/nghẹn thở vì sững sờ."
    rationale: "Trong ngữ cảnh Tanya bàng hoàng trước mệnh lệnh giải thể đơn vị quá bất ngờ, động từ diễn tả phản xạ hít gấp hoặc nghẹn thở sẽ sát nghĩa và tự nhiên hơn."
    proposed_fix: "Đổi 'Tanya nín thở.' thành 'Tanya hít mạnh một hơi.' hoặc 'Tanya nghẹn thở.'."
  - segment_id: "YS-LN05/Text/part0018.html/p000133"
    severity: "minor"
    category: "grammar_and_meaning"
    issue: "Cụm 'quân đội sẽ lập tức xóa sổ' thiếu trợ từ bị động 'bị', làm câu mang nghĩa chủ động thay vì nghĩa nội động/bị động của cụm 'cease to exist'."
    rationale: "Trong tiếng Việt, 'xóa sổ' là ngoại động từ; khi dùng cho chủ ngữ 'quân đội' với nghĩa không còn tồn tại thì cần thêm 'bị' ('bị xóa sổ') hoặc dùng 'biến mất'."
    proposed_fix: "Đổi 'sẽ lập tức xóa sổ' thành 'sẽ lập tức bị xóa sổ' hoặc 'sẽ biến mất'."
