    recommendation: "Đề xuất chỉnh p000285 thành '“Đ-đ-đừng có mà đùa giỡn với tao!”' hoặc '“Đ-đ-đừng có mà giở trò đùa cợt với tao!”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000288"
