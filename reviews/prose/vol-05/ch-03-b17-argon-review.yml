      - "Thoại & xưng hô: giữ '“Bớt sủa nhặng lên đi! Bọn tôi đang vội.”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000304"
    choices:
      - "Điểm nhìn nội tâm & phủ định: giữ đại từ 'mình' và phủ định 'chẳng có thời gian đâu mà dây dưa vô bổ với một đối thủ dai dẳng'."
  - segment_id: "YS-LN05/Text/part0020.html/p000305"
    choices:
      - "Quân hàm: khóa '“Trung tá, nhanh lên!”' (Colonel, gọi Trung tá Tanya von Degurechaff)."
  - segment_id: "YS-LN05/Text/part0020.html/p000306"
    choices:
      - "Quân hàm & xưng hô: khóa 'Thiếu tá' (Major, gọi Thiếu tá Weiss) và đại từ 'Tôi'."
  - segment_id: "YS-LN05/Text/part0020.html/p000307"
    choices:
      - "Điểm nhìn nội tâm, thuật ngữ & quan hệ nhân quả: khóa đại từ 'mình', 'ba thuật thức phát nổ' (three explosion formulas) và quan hệ nhân quả ưu tiên phạm vi tác động hơn uy lực."
  - segment_id: "YS-LN05/Text/part0020.html/p000308"
    choices:
      - "Điểm nhìn nội tâm & phủ định: giữ đại từ 'mình', cách gọi 'Con nhỏ đầu đất' / 'cô ả', phủ định 'chưa bắn hạ được ả' và nhận xét về sức lì đòn của một tân binh."
  - segment_id: "YS-LN05/Text/part0020.html/p000309"
    choices:
      - "Thuật ngữ & điểm nhìn nội tâm: khóa 'lớp vỏ phòng thủ' (defensive shell), đại từ 'mình' và ý định muốn kết liễu đối phương ngay tại đây khi xét đến hậu họa về sau."
