  - segment_id: "YS-LN05/Text/part0020.html/p000295"
    severity: "minor"
    issue: "Cách dịch tình thái suy đoán có căn cứ thành 'Lẽ ra cũng phải bắn trúng trực diện vào động cơ được vài phát rồi, nhưng…' dễ bị hiểu nhầm thành giả định trái thực tế (lẽ ra phải bắn trúng nhưng thực tế lại trượt)."
    evidence: "Ở p000295–p000296, cấp dưới báo cáo kết quả oanh kích rằng theo lý/chắc hẳn đã có vài phát trúng trực diện vào động cơ nhưng chưa rõ mức độ phá hủy, nên Tanya mới dặn chỉ cần có tư liệu hình ảnh ghi lại là được."
    recommendation: "Đề xuất đổi 'Lẽ ra cũng phải bắn trúng...' thành 'Chắc hẳn chúng tôi cũng đã bắn trúng...' hoặc 'Theo lý thì cũng đã bắn trúng...'."
