findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000543"
    severity: "minor"
    category: "pronouns_voice"
    issue: "Lời thoại mở đầu bằng 'Mình hiểu chúng ta đang ở trên lãnh thổ địch...' khiến câu nói thành tiếng hơi giống độc thoại nội tâm (do DEC-P01-001 quy ước 'mình' cho nội tâm tự quy chiếu của Tanya)."
    rationale: "Ở đoạn p000541–p000543, Tanya đang càu nhàu thành tiếng sau cuộc tập kích vào sở chỉ huy trước khi ra lệnh trực tiếp cho binh lính ở p000548; trong lời nói thành tiếng, lược chủ ngữ hoặc dùng 'Tôi' sẽ tách bạch rõ hơn với dòng độc thoại nội tâm ở p000542 và p000544."
    recommendation: "Có thể chỉnh nhẹ ở bước chuốt văn thành 'Tôi hiểu là chúng ta đang ở trên lãnh thổ địch...' hoặc 'Biết là chúng ta đang ở trên lãnh thổ địch...'."
  - segment_id: "YS-LN05/Text/part0010.html/p000544"
    severity: "minor"
    category: "word_choice"
    issue: "Cụm 'đã nghĩ ra hai chữ *khu vực phi chiến sự* và *vùng hậu phương*' dùng 'hai chữ' để chỉ hai cụm thuật ngữ dài nhiều âm tiết."
    rationale: "Trong tiếng Việt, 'hai chữ' thường chỉ một từ ghép hai âm tiết; khi đi kèm hai cụm từ dài ('khu vực phi chiến sự' và 'vùng hậu phương'), cách gọi 'hai cụm từ' hoặc 'hai khái niệm' sẽ tự nhiên và chuẩn xác hơn."
    recommendation: "Đổi 'hai chữ' thành 'hai cụm từ' hoặc 'hai khái niệm' ở bước chuốt văn."
