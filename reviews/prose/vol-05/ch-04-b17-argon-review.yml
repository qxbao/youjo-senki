findings:
  - severity: "minor"
    segment_id: "YS-LN05/Text/part0022.html/p000640"
    issue: "Cụm 'lệnh giới nghiêm tắt đèn nghiêm ngặt' thêm từ 'giới nghiêm' và cụm 'hối hả ra vào bên trong' thêm từ 'hối hả' so với nguyên văn."
    evidence: "Nguyên văn chỉ nêu quy định tắt đèn/che chắn ánh sáng nghiêm ngặt thời chiến (người đi đường bên ngoài vẫn đi ngang qua được) và mô tả các viên chức ra vào bên trong mà không có trạng từ chỉ sự vội vã."
    recommendation: "Đề xuất ở bước chuốt văn cân nhắc chỉnh thành: 'Do quy định tắt đèn nghiêm ngặt, ánh sáng tuy không hẳn là tràn ra ngoài, nhưng nếu đi ngang qua, người ta vẫn có thể nhìn thấy các viên chức ra vào bên trong.'"
  - severity: "minor"
    segment_id: "YS-LN05/Text/part0022.html/p000680"
    issue: "Trong phần in nghiêng, cụm 'gã chỉ huy này' tự cụ thể hóa danh từ chỉ người chung trong nguyên văn thành 'chỉ huy', dễ làm người đọc nhầm đại từ 'gã' ở câu ngay sau ('Phải chăng gã đang cố đùn đẩy trách nhiệm?') cũng chỉ người chỉ huy đó thay vì viên sĩ quan chính trị viết báo cáo."
    evidence: "Nguyên văn chỉ dùng cụm danh từ thông tục chỉ người ('gã này' / 'tên này') trong lời đổ lỗi của báo cáo, còn đại từ ngôi thứ ba ở câu tiếp theo quy chiếu về tác giả bản báo cáo đang tìm cách thoái thác trách nhiệm (khớp với p000679 và p000681)."
    recommendation: "Đề xuất ở bước chuốt văn cân nhắc đổi 'gã chỉ huy này' thành 'gã này' hoặc 'tên này', đồng thời có thể đổi 'gã' ở câu sau thành 'hắn' để tách bạch rõ hai chủ thể (và ở p000674 có thể lược bớt một chữ 'phải' trong 'những kẻ phải chịu trách nhiệm phải hối hận')."
