  - segment_id: "YS-LN05/Text/part0022.html/p000640"
    choices:
      - "Địa danh và tổ chức: 'Moskva', 'tòa nhà Bộ Dân ủy Nội vụ', 'pháo đài không ngủ'; giữ cấu trúc nhượng bộ 'ánh sáng tuy không hẳn là tràn ra ngoài, nhưng nếu đi ngang qua, người ta vẫn có thể nhìn thấy'"
  - segment_id: "YS-LN05/Text/part0022.html/p000641"
    choices:
      - "Tổ chức và thuật ngữ: 'Bộ Dân ủy Nội vụ', 'duy trì nỗ lực thời chiến', 'công chức của Liên bang'"
  - segment_id: "YS-LN05/Text/part0022.html/p000642"
    choices:
      - "Hình ảnh ẩn dụ và thuật ngữ: 'đội tiên phong bọc thép của Chủ nghĩa Cộng sản'"
  - segment_id: "YS-LN05/Text/part0022.html/p000643"
    choices:
      - "Giữ chuỗi ba danh ngữ chủ ngữ: 'Hiệu suất làm việc, đức hy sinh quên mình cùng tinh thần không biết mệt mỏi'"
  - segment_id: "YS-LN05/Text/part0022.html/p000644"
    choices:
      - "Giữ quan hệ đối lập và phủ định: 'đại đa số họ đều là những con người bình thường. Thế nhưng điều đó chẳng hề làm suy giảm động lực làm việc của họ'"
  - segment_id: "YS-LN05/Text/part0022.html/p000645"
    choices:
      - "Giữ nhịp ngắt cuối đoạn: 'nguồn gốc cho sự mẫn cán ấy chính là… nỗi sợ hãi đơn thuần'"
  - segment_id: "YS-LN05/Text/part0022.html/p000646"
    choices:
      - "Xưng hô và thuật ngữ trong báo cáo trước Loria: 'Thưa Đồng chí Loria', 'Đợt thanh tra', 'hành vi biển thủ, tham nhũng hay sai phạm', 'phát ngôn phản động'; giữ phủ định kép ở cả hai câu"
  - segment_id: "YS-LN05/Text/part0022.html/p000647"
    choices:
      - "Tổ chức và đại từ trần thuật chỉ viên chức báo cáo: 'Một viên chức của Bộ Dân ủy Nội vụ', 'Anh ta'"
  - segment_id: "YS-LN05/Text/part0022.html/p000648"
    choices:
      - "Xưng hô của Loria với nhóm thanh tra và câu hỏi phủ định: 'Tôi' – 'các người', 'vạch trần những hành vi sai phạm', 'Các người thực sự không tìm ra bất cứ thứ gì sao?'"
  - segment_id: "YS-LN05/Text/part0022.html/p000649"
    choices:
      - "Xưng hô của cấp dưới với Loria: 'thưa Đồng chí', 'chúng tôi'"
  - segment_id: "YS-LN05/Text/part0022.html/p000650"
    choices:
      - "Tên riêng và hình ảnh miêu tả: 'Loria', 'hiện thân của sự nghiêm khắc tột cùng'"
  - segment_id: "YS-LN05/Text/part0022.html/p000651"
    choices:
      - "Đại từ trần thuật chỉ Loria và viên chức bị kết tội: 'ông ta' – 'gã viên chức'"
  - segment_id: "YS-LN05/Text/part0022.html/p000652"
    choices:
      - "Xưng hô và thuật ngữ kết tội của Loria: 'Các đồng chí lính gác', 'tên ngu xuẩn này', 'Hành vi phá hoại ngầm trong thời chiến là trọng tội chống lại quốc gia'"
  - segment_id: "YS-LN05/Text/part0022.html/p000653"
    choices:
      - "Khẩu lệnh đáp lời của lính gác: 'Rõ!'"
  - segment_id: "YS-LN05/Text/part0022.html/p000654"
    choices:
      - "Giữ nét lắp bắp hoảng loạn trong lời kêu oan: 'X-xin khoan đã! Chắc chắn phải có sự nhầm lẫn nào đó ở đây!'"
  - segment_id: "YS-LN05/Text/part0022.html/p000655"
    choices:
      - "Đại từ trần thuật và tên riêng: 'Gã đàn ông' – 'gã', 'đám lính gác', 'Loria'"
  - segment_id: "YS-LN05/Text/part0022.html/p000656"
    choices:
      - "Xưng hô và thuật ngữ của Loria: 'anh' – 'chúng ta' – 'Chúng tôi', 'cái bẫy giả', 'cuộc kiểm toán nội bộ', 'đối tượng thanh tra', 'thanh tra viên đã nhận hối lộ'"
  - segment_id: "YS-LN05/Text/part0022.html/p000657"
    choices:
      - "Giữ tiếng kêu đứt quãng: 'C-cái g—?!'"
  - segment_id: "YS-LN05/Text/part0022.html/p000658"
    choices:
      - "Giữ giả định trái thực tế ở quá khứ và xưng hô: 'Giá như anh chịu báo cáo chuyện đó… thì mọi việc đã khác', 'anh' – 'chúng tôi', 'Loria'"
  - segment_id: "YS-LN05/Text/part0022.html/p000659"
    choices:
      - "Đại từ trần thuật chỉ Loria và phủ định: 'Ông ta không có thời gian cho bất kỳ một hành động vô nghĩa nào'"
  - segment_id: "YS-LN05/Text/part0022.html/p000660"
    choices:
      - "Xưng hô và giọng điệu của Loria: 'Tôi', 'lũ ngu xuẩn này', 'Người tiếp theo!'"
  - segment_id: "YS-LN05/Text/part0022.html/p000661"
    choices:
      - "Xưng hô ngập ngừng của cấp dưới: 'Ơ, thưa Đồng chí Loria…'"
  - segment_id: "YS-LN05/Text/part0022.html/p000662"
    choices:
      - "Tên riêng và quan hệ cấp bậc: 'Loria', 'người cấp dưới đang ngập ngừng'"
  - segment_id: "YS-LN05/Text/part0022.html/p000663"
    choices:
      - "Giữ nhịp ba câu ngắn hối thúc của Loria: 'Chuyện gì? Nói ra xem nào. Nhanh lên!'"
  - segment_id: "YS-LN05/Text/part0022.html/p000664"
    choices:
      - "Tên gọi con tàu trong lời báo cáo: 'chiếc Nữ hoàng Biển cả'"
  - segment_id: "YS-LN05/Text/part0022.html/p000665"
    choices:
      - "Tên riêng và đại từ: 'Loria', 'ông ta'"
  - segment_id: "YS-LN05/Text/part0022.html/p000666"
    choices:
      - "Giữ tình thái phỏng đoán phủ định: 'Có lẽ chẳng có cách nào kìm nén nổi thoáng dao động cảm xúc ấy.'"
  - segment_id: "YS-LN05/Text/part0022.html/p000667"
    choices:
      - "Hình ảnh ẩn dụ trong ngoặc kép và tên riêng: '“tấm lá chắn đạn” quý giá — phải, xét theo một khía cạnh nào đó thì vô cùng quý giá — của họ', 'Loria'"
  - segment_id: "YS-LN05/Text/part0022.html/p000668"
    choices:
      - "Tên gọi và đại từ: 'đám John Bull', 'ông ta' – 'bọn họ', 'quan chức Liên bang'; giữ nhịp câu bỏ lửng 'Bao nhiêu công sức như thế, vậy mà…'"
  - segment_id: "YS-LN05/Text/part0022.html/p000669"
    choices:
      - "Thuật ngữ: 'Tuyến đường biển chi viện', 'biểu tượng cho cuộc đấu tranh chung của hai bên'"
  - segment_id: "YS-LN05/Text/part0022.html/p000670"
    choices:
      - "Đại từ và điều kiện phủ định: 'đám người đó', 'ông ta', 'nếu không thể bảo vệ nổi một con tàu duy nhất mà ông ta đã ra lệnh phải đem cả danh dự ra để bảo vệ'"
  - segment_id: "YS-LN05/Text/part0022.html/p000671"
    choices:
      - "Đại từ và thuật ngữ: 'Ông ta' – 'mình', 'các đơn vị cần thiết, lực lượng tác chiến lẫn quyền tự quyết'"
  - segment_id: "YS-LN05/Text/part0022.html/p000672"
    choices:
      - "Đại từ và câu hỏi phủ định: 'Thế mà chúng vẫn không làm nổi sao?'"
  - segment_id: "YS-LN05/Text/part0022.html/p000673"
    choices:
      - "Xưng hô trong thoại của Loria: 'Lũ khốn bất tài đó', 'Chúng', 'Anh', 'bản báo cáo chi tiết'"
  - segment_id: "YS-LN05/Text/part0022.html/p000674"
    choices:
      - "Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc mệnh đề độc thoại nội tâm '*Nếu chúng không ... qua nhiệm vụ này*', không bọc phần trần thuật 'Loria thề độc trong đầu khi yêu cầu bản báo cáo'; đại từ nội tâm của Loria: 'ta' – 'chúng'"
  - segment_id: "YS-LN05/Text/part0022.html/p000675"
    choices:
      - "Giữ giả định trái thực tế ở quá khứ: 'Giá như anh ta phạm sai lầm mà không mang chúng theo… thì chỉ có Chúa mới biết số phận của anh ta sẽ ra sao'; đại từ chỉ viên chức: 'anh ta'"
  - segment_id: "YS-LN05/Text/part0022.html/p000676"
    choices:
