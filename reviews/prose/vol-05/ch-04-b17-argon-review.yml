  - segment_id: "YS-LN05/Text/part0022.html/p000638"
    choices:
      - "Nhấn mạnh Markdown theo DEC-P01-002: bọc toàn bộ đoạn nội tâm '*Một bữa ăn ... niềm vui đã.*' đúng phạm vi thẻ em trong nguồn"
