findings:
  - segment_id: YS-LN05/Text/part0016.html/p000330
    severity: minor
    category: terminology
    issue: "Chức danh 'Sea Lords' trong cơ cấu Bộ Tư lệnh Hải quân Khối Thịnh vượng chung (mô phỏng Hải quân Hoàng gia Anh, song hành với 'First Lord of the Admiralty' ở p000308) chỉ các tướng lĩnh/ủy viên hải sự chuyên trách (First Sea Lord, Second Sea Lord...); dịch thành 'các vị Hải thần vương' dễ gây liên tưởng đến danh xưng thần thoại hơn là chức danh hải quân."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi 'các vị Hải thần vương' thành 'các vị Đại thần Hải vụ' hoặc 'các vị Ủy viên Hải quân' để đồng bộ với 'Đệ nhất Đại thần Hải quân' ở p000308."
  - segment_id: YS-LN05/Text/part0016.html/p000341
    severity: minor
    category: word_choice
    issue: "Danh từ chỉ khu vực nơi Hạm đội Biển khơi của Đế quốc đang hoạt động (đối lập với 'vùng biển ven bờ của chúng ta' ở câu trước) mang nghĩa vùng biển hoặc địa bàn hoạt động trên đại dương; dịch thành 'vùng lãnh hải' hơi thu hẹp vào khái niệm pháp lý vùng biển thuộc chủ quyền ven bờ."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi 'vùng lãnh hải' thành 'vùng biển' hoặc 'địa bàn'."
