    rationale: "Thuật ngữ hải chiến chuẩn tương ứng với học thuyết quyết chiến hạm đội (Kantai Kessen), đồng bộ với 'Học thuyết Quyết chiến' trong sổ pending-terms."
    alternatives_vi: []
    segment_ids:
      - YS-LN05/Text/part0016.html/p000319
