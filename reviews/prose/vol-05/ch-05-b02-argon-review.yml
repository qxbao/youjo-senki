    issue: "Cụm danh từ chỉ việc mất đi người thuộc cấp trong lời chia buồn được dịch là 'sự mất mát của thuộc cấp', tạo độ lưỡng nghĩa nhẹ về ngữ pháp (có thể hiểu nhầm thành nỗi mất mát mà người thuộc cấp phải gánh chịu thay vì việc người chỉ huy mất đi thuộc cấp)."
    recommendation: "Có thể giữ nguyên hoặc cân nhắc chỉnh thành 'việc mất đi thuộc cấp' / 'sự mất mát người thuộc cấp' để diễn đạt tường minh hơn."
  - segment_id: YS-LN05/Text/part0025.html/p000064
    severity: minor
    issue: "Cách dịch sở hữu cách ngôi thứ hai trong cụm 'đất nước các cô' mang sắc thái số nhiều giống cái, hơi lệch nhẹ so với giọng điệu ngoại giao trang trọng của Drake và cách ông dùng 'đất nước của cô' (p000076) hoặc 'các vị' (p000072)."
    recommendation: "Có thể giữ nguyên hoặc đổi thành 'đất nước của cô' / 'đất nước các vị' để nhất quán với p000072 và p000076."
