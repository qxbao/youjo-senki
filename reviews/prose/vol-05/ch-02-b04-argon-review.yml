    issue: "Danh từ chỉ nhóm ly khai trong lời thoại phân tích chiến lược của Zettour (lặp lại ở p000103) được dịch là 'những kẻ ly khai', mang sắc thái miệt thị nhẹ chưa thật trung tính khi hai bên đang bàn chuyện tìm kiếm sự đoàn kết/liên minh với nhóm này."
    evidence: "Từ nguyên gốc trong lời của Zettour ở p000095 và p000103 là danh từ định danh chính trị trung tính, đặt trong mạch bàn luận về khả năng biến họ thành đồng minh hoặc lực lượng hợp tác."
    recommendation: "Có thể cân nhắc chỉnh nhẹ ở bước chuốt văn thành 'các phần tử ly khai', 'những người theo phái ly khai' hoặc 'lực lượng ly khai' tại p000095 và p000103 để giữ sắc thái khách quan."
  - severity: "minor"
