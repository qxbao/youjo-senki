findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000035"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Đại từ tự quy chiếu ngôi thứ nhất trong độc thoại nội tâm của Tanya đang dịch là 'tôi' ('vừa đọc tôi vừa chỉ muốn bật cười thành tiếng'), trái với quy ước đã duyệt tại DEC-P01-001 ('nội tâm tự quy chiếu của Tanya dùng mình') và thiếu nhất quán với 'Mình' ở đoạn p000033."
    basis: "DEC-P01-001 trong canon/decisions.md quy định nội tâm tự quy chiếu của Tanya dùng 'mình'."
    recommendation: "Đổi 'tôi' thành 'mình' ('Kiến thức của các em ấy tường tận đến mức vừa đọc mình vừa chỉ muốn bật cười thành tiếng.')."
  - segment_id: "YS-LN05/Text/part0010.html/p000046"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Trong độc thoại nội tâm của Tanya khi quan sát mặt trận phía đông qua ống nhòm, đại từ ngôi thứ nhất số nhiều đang dịch là 'chúng tôi' ('chúng tôi vẫn không đủ nhân lực'), mang sắc thái đối thoại với người ngoài thay vì suy nghĩ nội tâm tự quy chiếu."
    basis: "Điểm nhìn độc thoại nội tâm tiếp nối p000045–p000047 và quy ước đại từ nội tâm 'mình / chúng ta' trong sổ pending."
    recommendation: "Đổi 'chúng tôi' thành 'chúng ta' (hoặc 'quân ta') để giữ đúng điểm nhìn nội tâm của Tanya."
  - segment_id: "YS-LN05/Text/part0010.html/p000051"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Đoạn p000051 mở đầu ý nghĩ âm ỉ trong lòng Tanya (tiếp nối trực tiếp p000049–p000050), nhưng đại từ tự quy chiếu lại dịch là 'tôi' ('mà tôi biết') thay vì 'mình' theo DEC-P01-001. Ngoài ra cụm 'quân đội Đức đã định sẵn số phận bị tiêu hao đến tan chảy' thiếu từ chỉ trạng thái bị động cho 'định sẵn số phận'."
    basis: "DEC-P01-001 trong canon/decisions.md và cấu trúc bị động của vị ngữ chỉ số phận trong nguyên bản."
    recommendation: "Đổi 'mà tôi biết' thành 'mà mình biết'; chỉnh nhẹ mệnh đề chính thành 'quân đội Đức đã bị định sẵn số phận tiêu hao đến tan chảy' (hoặc 'đã có số phận định sẵn là bị tiêu hao đến tan chảy')."
  - segment_id: "YS-LN05/Text/part0010.html/p000053"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Tiếp nối mạch độc thoại nội tâm của Tanya khi đối chiếu lịch sử hai cuộc Thế chiến, đại từ tự quy chiếu đang dịch là 'tôi' ('mà tôi nhớ') thay vì 'mình' theo DEC-P01-001."
    basis: "DEC-P01-001 trong canon/decisions.md quy định nội tâm tự quy chiếu của Tanya dùng 'mình'."
    recommendation: "Đổi 'mà tôi nhớ' thành 'mà mình nhớ'."
  - segment_id: "YS-LN05/Text/part0010.html/p000054"
    severity: "moderate"
    category: "pronouns_viewpoint"
    issue: "Ở câu kết chuỗi suy nghĩ nội tâm của Tanya, đại từ ngôi thứ nhất số nhiều đang dịch là 'chúng tôi' ('chúng tôi buộc phải thua ở phía đông') thay vì 'chúng ta', làm lệch điểm nhìn độc thoại nội tâm."
    basis: "Mạch độc thoại nội tâm liên tục từ p000051 đến p000054 và quy ước đại từ nội tâm 'mình / chúng ta'."
    recommendation: "Đổi 'chúng tôi' thành 'chúng ta' ('Tuy nhiên, điều đó cũng không có nghĩa là chúng ta buộc phải thua ở phía đông.')."
  - segment_id: "YS-LN05/Text/part0010.html/p000039"
    severity: "minor"
    category: "meaning_precision"
    issue: "Cụm từ dịch vật dụng uống cà phê ('chiếc cốc dã chiến quân dụng chẳng ra hình chiếc cốc') thêm chữ 'dã chiến' chưa có trực tiếp trong từ gốc chỉ nêu tính chất quân dụng và kiểu dáng giả cốc."
    basis: "Nguyên tắc tại canon/style-guide.md: không tự thêm giải thích ngoài chi tiết nguồn."
    recommendation: "Lược chữ 'dã chiến', giữ 'chiếc cốc quân dụng chẳng ra hình chiếc cốc' (hoặc 'chiếc ca quân dụng giả cốc')."
