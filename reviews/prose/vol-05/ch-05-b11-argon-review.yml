    category: phủ định, giả định và tình thái
    choice: "Giữ đúng phủ định và điều kiện ở p000413 ('Mình chẳng biết là kẻ quái nào, nhưng chúng hẳn phải to gan lớn mật lắm mới dám phá đám...'), phủ định ở p000421 ('không thể tránh khỏi cảnh bị áp đảo về quân số'), giả định tương lai trong quá khứ và mức độ chắc chắn ở p000422 ('một khi quân địch tấn công, sự chênh lệch lực lượng giữa hai bên sẽ càng gia tăng', 'chẳng còn là phỏng đoán nữa mà gần như là điều chắc chắn'), giả định trái thực tế ở quá khứ tại p000424 ('Giá như chúng lảng vảng quanh đây vào ban ngày thì việc đẩy lùi chúng bằng một đòn không kích đã là điều khả thi'), khả năng và điều kiện ở p000428 ('có thể bọn mình sẽ bị khiển trách vì quyết định đó, nhưng vào lúc không thể để lỡ một giây phút nào...'), mệnh lệnh phủ định ở p000431 ('tuyệt đối không được bắn nhầm vào các đơn vị tuần tra'), phủ định ở p000434 ('xác nhận không có gì hiểu lầm'), nhượng bộ và phủ định ở p000442 ('Ngay cả khi sĩ quan trực ban tối nay là Trung úy Wüstemann..., bọn mình vẫn còn may chán vì đó không phải là Trung úy Grantz'), phủ định ở p000445 ('chẳng thấy có lý do gì để xảy ra bất trắc cả'), phủ định hợp lý ở p000446–p000447 ('Việc Weiss không có mặt ở đó là lẽ đương nhiên', 'thì không cần phải có mặt tại buổi phổ biến tình hình'), khả năng phủ định ở p000450 ('mình có thể hiểu tại sao Đại úy Thon lại không thể tới được'), giả định trái thực tế ở quá khứ tại p000451 ('nếu có ai đó phải ở lại thì người ấy lẽ ra phải là Tospan mới đúng'), cùng điều kiện và phủ định ở p000452 ('nhưng nếu anh ta đánh giá thấp rủi ro khi toàn bộ các chỉ huy không thống nhất nắm chung tình hình, thì anh ta không đủ tư cách làm một chỉ huy tác chiến')."
