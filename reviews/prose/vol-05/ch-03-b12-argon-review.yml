findings:
  - segment_id: YS-LN05/Text/part0020.html/p000059
    severity: moderate
    issue: "Cụm động từ bị động chỉ hành động đang bị hỏa lực địch nhắm bắn trong độc thoại nội tâm của Tanya bị dịch thành 'đang bị cả một trung đoàn bắn trả', làm lệch trình tự nhân quả của trận đánh (ngụ ý đơn vị của Tanya đã nổ súng trước nên đối phương mới bắn trả, mâu thuẫn với lệnh hủy tấn công ở p000044 và chi tiết địch tấn công phủ đầu ở p000060). Đồng thời, đại từ sở hữu ngôi thứ nhất số nhiều trong câu nghĩ thầm này đang dùng 'chúng ta', chưa đồng nhất với 'bọn mình' trong chuỗi độc thoại nội tâm cùng cảnh (p000040, p000041, p000054, p000060)."
    recommendation: "Sửa 'bắn trả' thành 'nã đạn vào' hoặc 'bắn vào', đồng thời đổi 'chúng ta' thành 'bọn mình' trong phần in nghiêng: '*Tiểu đoàn tăng cường của bọn mình đang bị cả một trung đoàn nã đạn vào.*'"
  - segment_id: YS-LN05/Text/part0020.html/p000077
    severity: minor
    issue: "Động từ chỉ việc kìm giữ/ẩn dấu tín hiệu ma lực để tránh bị phát hiện sớm được dịch là 'ém nhẹm tín hiệu ma lực', mang sắc thái khẩu ngữ chỉ hành vi bưng bít thông tin hoặc che đậy sai phạm hơn là thao tác kỹ thuật – tác chiến."
    recommendation: "Đổi 'ém nhẹm' thành 'che giấu' hoặc 'kìm nén' ('Họ thậm chí đã che giấu tín hiệu ma lực của mình để không bị phát hiện từ trước.')."
