    choice: "Giữ đúng sự chua chát khi phải phục vụ một đảng phái mình không tin tưởng và lời tự trấn an rằng Chúa cũng sẽ thứ lỗi cho vài mánh khóe sinh tồn ở p000307; giả định mong muốn được chuẩn bị từ sớm nếu nhận nhiệm vụ trọng đại ở p000310; mệnh lệnh phối hợp bảo vệ tàu dân sự cùng các pháp sư hải quân đánh bộ của Khối Thịnh vượng chung trên tàu ở p000313; sự phi lý khi đảng từng nguyền rủa Khối Thịnh vượng chung là tay sai của chủ nghĩa đế quốc tư sản vài năm trước nay lại lệnh bảo vệ tàu của họ ở p000314–p000316; nhận định phủ định tuyệt đối về báo chí của đảng và việc phải đọc ẩn ý giữa các dòng chữ ở p000324; sự đính chính suy đoán của Mikel về lý do Trung ương cử chính ủy lên miền bắc ở p000326–p000327; phép so sánh úp mở của viên chính ủy rằng hàng hóa trên tàu không quan trọng bằng mục tiêu thực sự mà đơn vị phải phục vụ ở p000330; lập luận từ chối khéo của Mikel dựa trên việc thiếu huấn luyện hàng hải và học thuyết chống ngầm khi ngỡ phải hộ tống đoàn tàu ở p000333–p000335; và nghịch lý ở p000340–p000343 khi bảo vệ một con tàu vận tải khổng lồ duy nhất nhưng việc đi đơn độc giữa vùng biển có tàu ngầm Đế quốc rình rập lại được khẳng định là phương án an toàn nhất."
