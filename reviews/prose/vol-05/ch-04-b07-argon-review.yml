findings:
  - segment_id: "YS-LN05/Text/part0022.html/p000254"
    severity: "moderate"
    issue: "Danh từ chỉ thiết bị ma pháp của pháp sư đang được dịch là 'Bảo châu', lệch với thuật ngữ pending đã khóa thống nhất xuyên suốt từ vol-01 đến vol-05 trong work/run-state/pending-terms-index.yml là 'quả cầu' (hoặc 'quả cầu tính toán')."
    recommendation: "Đổi 'Bảo châu' thành 'quả cầu' ('Họ đã tịch thu quả cầu của ông, nhưng rồi quân đội lại cấp cho ông một mẫu mới.')."
  - segment_id: "YS-LN05/Text/part0022.html/p000259"
    severity: "moderate"
    issue: "Cụm danh từ chỉ các đơn vị pháp sư đang được dịch là 'các đơn vị ma đạo sư', lệch với thuật ngữ đã thống nhất toàn dự án trong work/run-state/pending-terms-index.yml ('các đơn vị pháp sư')."
    recommendation: "Đổi 'các đơn vị ma đạo sư' thành 'các đơn vị pháp sư' ('...quyết định tái lập các đơn vị pháp sư của những người Cộng sản...')."
  - segment_id: "YS-LN05/Text/part0022.html/p000261"
    severity: "moderate"
    issue: "Danh từ chỉ các pháp sư trung thành với chế độ cũ đang được dịch là 'những ma đạo sư', lệch với thuật ngữ 'pháp sư' đã thống nhất toàn dự án trong work/run-state/pending-terms-index.yml. Ngoài ra, trong câu độc thoại nội tâm in nghiêng của Đại tá Mikel, đại từ ngôi thứ nhất số nhiều đang dùng 'chúng mình', mang sắc thái hơi trẻ so với một đại tá cựu binh Liên bang vừa rời trại gulag (và DEC-P01-001 giới hạn quy ước tự xưng 'mình' cho nội tâm của Tanya)."
    recommendation: "Đổi 'những ma đạo sư' thành 'những pháp sư' (hoặc 'các pháp sư'), đồng thời đổi 'chúng mình' thành 'chúng ta' trong câu độc thoại nội tâm của Mikel ('*Ắt hẳn họ triệu tập chúng ta là vì đang thua trận.*')."
  - segment_id: "YS-LN05/Text/part0022.html/p000243"
    severity: "minor"
    issue: "Đại từ ngôi thứ nhất số nhiều chỉ đơn vị trong độc thoại nội tâm của Tanya đang dùng 'Chúng mình / chúng mình', lệch nhẹ so với 'bọn mình' được dùng xuyên suốt ở batch liền trước (ch-04-b06: p000200, p000215, p000218)."
    recommendation: "Có thể giữ nguyên hoặc đồng bộ thành 'Bọn mình / bọn mình' ở bước chuốt văn."
  - segment_id: "YS-LN05/Text/part0022.html/p000244"
    severity: "minor"
    issue: "Tương tự p000213 của batch ch-04-b06, tính từ bổ nghĩa cho Weiss với nghĩa 'chín chắn / có đầu óc hợp lý, thực tế' đang được dịch là 'Một người biết điều như Weiss', dễ gợi sắc thái khéo chiều ý cấp trên hơn là một cấp dưới có góc nhìn khách quan, hợp lý mà Tanya muốn tham khảo."
    recommendation: "Có thể giữ nguyên hoặc chỉnh nhẹ ở bước chuốt văn thành 'Một người chín chắn như Weiss cũng đã đồng tình.' hoặc 'Một người điềm đạm, hiểu chuyện như Weiss cũng đã đồng tình.'."
  - segment_id: "YS-LN05/Text/part0022.html/p000248"
    severity: "minor"
    issue: "Cụm ẩn dụ kinh điển trong lời của Tanya đang dịch là 'Bàn tay vô hình của Chúa', chưa đồng bộ hoàn toàn với mục đã khóa trong work/run-state/pending-terms-index.yml của vol-05 là 'bàn tay vô hình của Thượng đế'."
    recommendation: "Có thể đồng bộ thành 'Bàn tay vô hình của Thượng đế' để khớp với sổ pending của vol-05."
