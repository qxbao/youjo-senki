findings:
  - segment_id: "YS-LN05/Text/part0010.html/p000002"
    severity: "minor"
    category: "pronouns_consistency"
    issue: "Trong các đoạn độc thoại nội tâm / tự thuật ngôi thứ nhất không đặt trong ngoặc kép của Tanya (p000002–p000004, p000007, p000016, p000017, p000022), đại từ tự quy chiếu số ít đang dùng 'tôi' (thậm chí trộn lẫn 'mình' và 'tôi' trong cùng một câu ở p000002 và cùng một đoạn ở p000016), trong khi phần trần thuật ngôi thứ ba đan xen ngay kế tiếp (p000010) lại quy chiếu Tanya bằng 'nó'. Cách trộn 'tôi' và 'nó' ngoài lời thoại chưa đồng bộ với quy ước DEC-P01-001 (trần thuật dùng 'nó', nội tâm tự quy chiếu của Tanya dùng 'mình')."
    recommendation: "Đề xuất đổi đại từ tự quy chiếu ngôi thứ nhất số ít ngoài lời thoại từ 'tôi' sang 'mình' ở p000002, p000003 (lưu ý diễn đạt 'kéo giật mình đi khắp chốn' hoặc 'lôi mình quay cuồng khắp chốn' để tránh trùng với động từ 'giật mình'), p000004 ('Kampfgruppe của mình'), p000007 ('báo cho mình biết'), p000016 ('chính là mình'), p000017 ('Mình bị hối thúc... mình đã đang lắc lư') và p000022 ('thấp bé như mình'); giữ nguyên 'chúng tôi' khi chỉ tập thể đơn vị (p000004, p000007, p000014) và giữ 'tôi' / 'chúng tôi' trong lời thoại có dấu ngoặc kép (p000005, p000023)."
  - segment_id: "YS-LN05/Text/part0010.html/p000004"
    severity: "minor"
    category: "meaning_precision"
    issue: "Cụm động từ thể bị động mô tả việc đơn vị dần bị đẩy tiến xa hơn về phía đông vào lãnh thổ Liên bang đang được dịch theo hướng chủ động ('khi dần tiến sâu hơn về phía đông'), làm giảm nhẹ sắc thái bị cuốn/đẩy đi theo mệnh lệnh vốn nối mạch trực tiếp từ p000003."
    recommendation: "Cân nhắc chỉnh thành 'nhưng khi dần bị đẩy tiến xa hơn về phía đông vào lãnh thổ Liên bang' hoặc 'nhưng khi dần bị đẩy sâu hơn về phía đông vào lãnh thổ Liên bang'."
  - segment_id: "YS-LN05/Text/part0010.html/p000021"
    severity: "minor"
    category: "pronoun_clarity"
    issue: "Câu thứ ba dùng đại từ 'Nó' ở đầu câu ('Nó khác một trời một vực...') để chỉ toa tàu hạng nhất trên đoàn tàu quân sự, dễ gây nhầm thoáng qua với đại từ 'nó' dùng cho Tanya theo DEC-P01-001."
    recommendation: "Có thể đổi 'Nó khác một trời một vực' thành 'Toa tàu này khác một trời một vực' hoặc 'Nơi này khác một trời một vực' ở bước chuốt văn."
