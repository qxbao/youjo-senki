findings:
  - segment_id: YS-LN05/Text/part0022.html/p000006
    severity: minor
    issue: "Trong câu độc thoại lẩm bẩm thành tiếng của Tanya mở đầu bằng 'Chúng ta là quân đội' (và nối tiếp bằng 'chúng ta' ở p000016), việc dùng đại từ ngôi thứ nhất số ít 'Mình' tạo ra sự lệch cặp nhẹ về sắc thái tự xưng khi phát ngôn thành tiếng (dù là lẩm bẩm một mình hoặc nói bâng quơ), tuy vẫn hiểu được theo mạch độc thoại của Tanya."
    recommendation: "Có thể giữ nguyên nếu xem là lời lẩm bẩm độc thoại của riêng Tanya, hoặc cân nhắc đổi 'Mình hiểu' thành 'Tôi hiểu' để hài hòa hơn với 'Chúng ta' trong câu nói thành tiếng."
  - segment_id: YS-LN05/Text/part0022.html/p000014
    severity: minor
    issue: "Cụm từ chỉ 'cuộc chiến văn phòng / cuộc chiến giấy tờ' (chơi chữ từ chữ 'văn' trong văn thư/bút mực ở câu trước, trong tiếng Anh dịch thẳng thành 'culture battle') được dịch nguyên chữ là 'cuộc chiến văn hóa', hơi khó liên hệ ngay với mạch 'bút, giấy, mực' ở p000013 và 'bức tường quan liêu / thủ tục rườm rà' ở p000015 dù vẫn bám sát mặt chữ bản tiếng Anh."
    recommendation: "Có thể giữ 'cuộc chiến văn hóa' nếu ưu tiên bám sát chữ trong bản nguồn tiếng Anh, hoặc cân nhắc diễn đạt là 'cuộc chiến văn thư' / 'cuộc chiến chữ nghĩa' để gắn kết tự nhiên hơn với ngữ cảnh bàn giấy ở p000013–p000015."
