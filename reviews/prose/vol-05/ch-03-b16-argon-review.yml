    choices:
      - "Thoại đáp & quân hàm: giữ nét lắp bắp 'R-rõ' và cách thưa 'thưa Trung tá!' với Trung tá Drake."
  - segment_id: "YS-LN05/Text/part0020.html/p000239"
    choices:
      - "Điểm nhìn trần thuật: giữ đại từ 'cô' cho Mary và cấu trúc đồng vị 'Một cơ hội, kẻ thù của cô'."
  - segment_id: "YS-LN05/Text/part0020.html/p000240"
    choices:
      - "Nhấn mạnh Markdown: khóa '*Mình phải bảo vệ.*' theo thẻ <em> của nguồn."
  - segment_id: "YS-LN05/Text/part0020.html/p000241"
    choices:
      - "Nhấn mạnh Markdown & phủ định: khóa '*Mình không thể để chúng cướp đi thêm bất cứ thứ gì nữa.*' theo thẻ <em> của nguồn."
  - segment_id: "YS-LN05/Text/part0020.html/p000242"
    choices:
      - "Điểm nhìn trần thuật: giữ chủ ngữ 'Mary' và hành động nhìn lên quân địch đang bổ nhào xuống. Không dùng *...*."
  - segment_id: "YS-LN05/Text/part0020.html/p000243"
    choices:
      - "Nhấn mạnh Markdown: khóa '*Lần này chúng mình có thể làm được.*' theo thẻ <em> của nguồn."
  - segment_id: "YS-LN05/Text/part0020.html/p000244"
    choices:
      - "Nhấn mạnh Markdown & phủ định: khóa toàn câu trong '*...*' và giữ cấu trúc phủ định quyết tâm không để kẻ địch thoát."
  - segment_id: "YS-LN05/Text/part0020.html/p000245"
    choices:
      - "Điểm nhìn, phủ định kép & thành ngữ: chuyển điểm nhìn về 'Tanya'; giữ phủ định kép 'không phải là bất khả thi' (not impossible) và 'cắt lỗ' (cut their losses)."
  - segment_id: "YS-LN05/Text/part0020.html/p000246"
    choices:
      - "Đại từ trần thuật, phủ định & thuật ngữ: khóa đại từ 'nó' cho Tanya theo DEC-P01-001; giữ phủ định 'không muốn nói rằng nhiệm vụ này vô nghĩa' và thuật ngữ 'nguồn nhân lực' (human resources)."
  - segment_id: "YS-LN05/Text/part0020.html/p000247"
    choices:
      - "Thoại chiến trường: giữ mệnh lệnh dìu đồng đội bị thương '“Ai đó cho cậu ấy mượn bờ vai tựa vào đi! Đỡ cậu ấy dậy!”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000248"
    choices:
      - "Quân hàm: khóa 'Trung úy Grantz' (Lieutenant Grantz)."
  - segment_id: "YS-LN05/Text/part0020.html/p000249"
    choices:
      - "Quân hàm & cấu trúc so sánh: khóa 'Trung tá' (the colonel, chỉ Trung tá Tanya von Degurechaff) và 'trung úy' (first lieutenant, tự chỉ Grantz); giữ cấu trúc 'thà... còn hơn...'."
  - segment_id: "YS-LN05/Text/part0020.html/p000250"
    choices:
      - "Đại từ trần thuật & phủ định: khóa đại từ 'nó' cho Tanya theo DEC-P01-001 và phủ định 'không thể làm ngơ trước sự thật rằng họ đã có thương vong'."
  - segment_id: "YS-LN05/Text/part0020.html/p000251"
    choices:
      - "Điểm nhìn nội tâm & câu điều kiện giả định: khóa đại từ 'mình' của Tanya theo DEC-P01-001; giữ phủ định 'không muốn bắt họ phải gồng mình quá sức hơn mức cần thiết' và giả định trái thực tế 'Nếu có thể thắng một cuộc chiến chỉ bằng tinh thần duy ý chí, thì lũ cuồng vọng tự đại đã trở thành lực lượng mạnh nhất thế gian rồi'."
  - segment_id: "YS-LN05/Text/part0020.html/p000252"
    choices:
      - "Đại từ nội tâm & ẩn dụ: giữ 'mình' và hình ảnh 'đánh giá lại những quân bài trong tay'."
  - segment_id: "YS-LN05/Text/part0020.html/p000253"
    choices:
      - "Điểm nhìn & thuật ngữ: giữ 'Bọn mình', 'thương vong liên tiếp' và 'hỏa lực tầm xa' (long-range fire)."
  - segment_id: "YS-LN05/Text/part0020.html/p000254"
    choices:
      - "Thuật ngữ & tình thái: giữ 'Khối Thịnh vượng chung' (Commonwealth), tình thái suy đoán 'hẳn' (must have), 'bắn trượt một số phát' và thuật ngữ 'thuật thức bắn tỉa tầm xa' (long-range sniping formulas)."
  - segment_id: "YS-LN05/Text/part0020.html/p000255"
    choices:
      - "Quân hàm: khóa '“Trung tá?”' (Colonel?, gọi Trung tá Tanya von Degurechaff)."
  - segment_id: "YS-LN05/Text/part0020.html/p000256"
    choices:
      - "Khẩu lệnh: giữ '“Rút lui! Chúng ta rút lui!”'."
  - segment_id: "YS-LN05/Text/part0020.html/p000257"
    choices:
      - "Thuật ngữ, đại từ & phủ định: giữ 'phó chỉ huy' (vice commander), đại từ nội tâm 'mình', phủ định 'chẳng thể nào thản nhiên', 'không hoan nghênh' và thuật ngữ 'sự tiêu hao nhân lực' (human attrition)."
