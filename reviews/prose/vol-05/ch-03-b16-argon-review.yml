  - segment_id: "YS-LN05/Text/part0020.html/p000203"
    severity: "minor"
    issue: "Đại từ sở hữu ngôi thứ ba số nhiều chỉ đối phương trong cụm hỏi về 'status' đang dịch thành 'bên đó' ('Tình hình bên đó thế nào?!'), dễ gây hiểu nhầm là hỏi thăm tình hình của một đơn vị bạn thay vì hỏi thông tin/tình trạng của đơn vị Pháp sư Định danh địch vừa bị phát hiện."
    evidence: "Ở p000202, đài quan sát vừa báo cáo phát hiện bước sóng của một đơn vị Pháp sư Định danh địch đang tiếp cận, và câu trả lời ở p000204 xác nhận đó chính là đơn vị từng được ghi nhận ở mặt trận Rhine."
    recommendation: "Đề xuất chỉnh thành 'Tình trạng của chúng thế nào?!' hoặc 'Tình hình phía địch thế nào?!'."
  - segment_id: "YS-LN05/Text/part0020.html/p000218"
    severity: "minor"
    issue: "Cách gọi số nhiều cho nhóm của Mary Sue ở p000218 và p000221 đang dịch là 'Các cô' / 'của các cô', vô tình mặc định toàn bộ đơn vị tình nguyện đi cùng Mary đều là nữ giới."
    evidence: "Đơn vị pháp sư tình nguyện của Liên minh Hiệp ước bao gồm cả nam lẫn nữ; theo DEC-P01-001, tránh tự suy diễn giới tính của tập thể khi nguồn chỉ dùng đại từ ngôi thứ hai số nhiều chung."
    recommendation: "Đề xuất đổi 'Các cô' ở p000218 thành 'Đơn vị của cô' hoặc 'Nhóm các người', và 'của các cô' ở p000221 thành 'của đơn vị cô' hoặc 'của bên cô'."
  - segment_id: "YS-LN05/Text/part0020.html/p000224"
    severity: "minor"
    issue: "Thành ngữ chỉ việc ở lại canh giữ vị trí đang được dịch là 'trấn giữ hậu phương', dễ trùng lặp với thuật ngữ quân sự chỉ vùng hậu phương ('rear area' / 'home front') trong khi đơn vị của Mary đang làm nhiệm vụ yểm trợ trực tiếp ngay trên con tàu mục tiêu."
    evidence: "Ở p000218 và p000223, đơn vị của Mary ở lại trên tàu RMS Queen of Anjou để canh chừng tàu ngầm và bảo vệ mục tiêu ngay tại khu vực giao chiến."
    recommendation: "Đề xuất đổi 'trấn giữ hậu phương' thành 'chốt giữ tại chỗ' hoặc 'ở lại canh giữ'."
  - segment_id: "YS-LN05/Text/part0020.html/p000244"
    severity: "minor"
    issue: "Độc thoại nội tâm của Mary Sue chuyển đột ngột sang cặp đại từ 'Chúng tao - lũ mày', lệch giọng so với mạch tự xưng 'mình / chúng mình' xuyên suốt từ p000208 đến p000243."
    evidence: "Ngay câu trước ở p000243, nội tâm của Mary vẫn tự xưng là 'chúng mình', phù hợp với giọng điệu nghiêm túc và sùng đạo của nhân vật."
    recommendation: "Đề xuất giữ đại từ ngôi thứ nhất 'Chúng mình' hoặc 'Chúng tôi' (ví dụ: 'Chúng mình sẽ không để bọn ngươi thoát tội đâu.' hoặc 'Chúng tôi sẽ không để lũ các người thoát tội đâu.')."
  - segment_id: "YS-LN05/Text/part0020.html/p000248"
    severity: "minor"
    issue: "Binh sĩ cấp dưới xưng 'em' với Trung úy Grantz ('Trung úy Grantz, em không sao đâu…'), tự thêm sắc thái thân tộc/tuổi tác ngoài quy chuẩn quân ngũ."
    evidence: "Theo DEC-P01-001, không tự suy diễn quan hệ thân thuộc khi thiếu ngữ cảnh; trong quân đội Đế quốc, cấp dưới xưng 'tôi' với sĩ quan cấp trên."
    recommendation: "Đề xuất đổi 'em' thành 'tôi' ('Trung úy Grantz, tôi không sao đâu…')."
