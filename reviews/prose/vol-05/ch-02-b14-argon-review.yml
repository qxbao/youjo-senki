  - segment_id: YS-LN05/Text/part0016.html/p000269
    severity: minor
    category: word_choice
    issue: "Cụm 'Vấn đề thực sự đối với những người Cộng sản' dễ gây hiểu nhầm là vấn đề gây khó khăn cho phía Cộng sản thay vì vấn đề nằm ở bản chất của họ; ngoài ra đại từ phiếm chỉ 'bạn' trong 'trước khi bạn kịp nhận ra' hơi lệch tông trần thuật bám điểm nhìn của Tướng Habergram."
    recommendation: "Khi chuốt văn có thể cân nhắc đổi thành 'Vấn đề thực sự ở những người Cộng sản là khả năng sinh sôi và thâm nhập của họ. Họ sẽ rỉ vào như bộ binh qua một kẽ hở nào đó, và trước khi người ta kịp nhận ra thì cả một ổ của bọn họ đã thành hình rồi.'"
