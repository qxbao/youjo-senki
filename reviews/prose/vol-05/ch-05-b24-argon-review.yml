    choice: "Giữ đúng mệnh đề điều kiện và tình thái bắt buộc ('sẽ chiến thắng... buộc phải thắng') ở p000001, câu hỏi tu từ chỉ thời lượng ('còn có thể ngủ thêm được bao nhiêu đêm nữa mà không phải...') ở p000002, câu điều kiện giả định hệ quả bi thảm ('Nếu nó không thể chấp nhận... Nó sẽ biến thành...') ở p000006, cấu trúc loại trừ tuyệt đối ('Sao cũng được—miễn không phải là...') ở p000008, phủ định hoàn toàn về nhân sự dư thừa ở p000009, báo cáo thiếu hụt quân trang ở p000014–p000015, so sánh ưu tiên ('quan trọng hơn nhiều so với việc lo lắng...') ở p000022, câu hỏi tu từ mỉa mai ('Lẽ nào tôi nên dùng chúng để mua vé...') ở p000027, giả định ước muốn trái thực tế ('Sẽ tuyệt vời biết bao nếu được hét...') ở p000031, phủ định kèm điều kiện loại trừ ('nếu không ăn diện vào thì cũng chẳng giấu nổi... có lẽ chẳng ai ở đây biết nhảy đâu') ở p000033, phủ định mức độ kèm ngoại lệ ('không hề khắc nghiệt đến mức cực đoan, ngoại trừ vùng Norden') ở p000035, điều kiện rào đón ('đó là nếu các anh có kinh nghiệm') ở p000041, phủ định toàn phần và hầu như không có kinh nghiệm ở p000043–p000044, cùng câu hỏi đuôi mang tính cà khịa của Grantz ở p000045."
