    segment_id: "YS-LN05/Text/part0022.html/p000353"
    issue: "Đại từ ngôi thứ nhất số nhiều trong câu độc thoại nội tâm của Đại tá Mikel khi nhớ về thời gian ở trại cải tạo được dịch là 'chúng mình', hơi lệch sắc thái từng trải của một sĩ quan cấp đại tá và chưa đồng nhất với 'chúng ta' trong độc thoại nội tâm cùng nhân vật ở p000366."
    evidence: "Nguyên bản dùng cùng đại từ ngôi thứ nhất số nhiều trong các câu độc thoại nội tâm của Mikel ở p000353 và p000366; nhân vật là đại tá kỳ cựu kiêm tiểu đoàn trưởng."
    recommendation: "Đề xuất đổi 'chúng mình' thành 'chúng ta' ở bước chuốt văn để thống nhất giọng nội tâm của Đại tá Mikel với p000366."
  - severity: "minor"
    segment_id: "YS-LN05/Text/part0022.html/p000368"
    issue: "Trong lời của viên chính ủy, cách dịch 'cho đồng chí, thưa Đồng chí, cùng các đồng chí thuộc cấp của mình' thêm từ 'thưa' và 'thuộc cấp' chưa thật sát tương quan vị thế, đồng thời đại từ phản thân 'mình' đặt sau chủ ngữ 'ban lãnh đạo Đảng' dễ gây mơ hồ về đối tượng sở hữu."
    evidence: "Nguyên bản chỉ dùng hô ngữ 'Đồng chí' xen giữa đại từ ngôi thứ hai và cụm chỉ những người đồng chí của Mikel, không có từ chỉ cấp dưới và viên chính ủy không dùng kính ngữ kiểu cấp dưới thưa gửi cấp trên."
    recommendation: "Đề xuất chỉnh thành 'Đó là nhiệm vụ đặc biệt mà ban lãnh đạo Đảng giao phó cho đồng chí, người đồng chí ạ, cùng các đồng chí của đồng chí.' hoặc 'Đó là nhiệm vụ đặc biệt từ ban lãnh đạo Đảng dành cho đồng chí cùng các đồng chí trong đơn vị của đồng chí.'"
  - severity: "minor"
    segment_id: "YS-LN05/Text/part0022.html/p000382"
    issue: "Bản dịch thêm từ 'hết' trong cụm 'không truyền tải hết tới Đại tá Mikel', làm giảm mức độ phủ định từ hoàn toàn không nắm được ẩn ý thực sự thành chỉ nắm được một phần."
    evidence: "Nguyên bản dùng phủ định hoàn toàn đối với việc hàm ý thực sự đằng sau lời dặn của viên chính ủy đến được với Mikel (ông hoàn toàn không biết bí mật về yếu nhân trên tàu hay cơn thịnh nộ của Loria, chỉ cảm nhận được tính chất nguy cấp)."
    recommendation: "Đề xuất bỏ từ 'hết' ('không truyền tải được tới Đại tá Mikel' hoặc 'Đại tá Mikel không nắm được hàm ý thực sự...')."
