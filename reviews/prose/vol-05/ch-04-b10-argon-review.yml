  - segment_id: "YS-LN05/Text/part0022.html/p000375"
    choices:
      - "Tổ chức và đại từ: 'Bộ Dân ủy Nội vụ', 'hắn'"
  - segment_id: "YS-LN05/Text/part0022.html/p000376"
    choices:
      - "Tên gọi và đại từ: 'Đồng chí Loria', 'Hắn'; giữ dấu chấm lửng mở đầu đoạn"
  - segment_id: "YS-LN05/Text/part0022.html/p000377"
    choices:
      - "Tổ chức: 'Bộ Dân ủy Nội vụ'; giữ nguyên lối nói ẩn dụ 'biến một người đang ở thì hiện tại thành một người ở thì quá khứ'"
  - segment_id: "YS-LN05/Text/part0022.html/p000378"
    choices:
      - "Giữ cấu trúc câu nối tiếp bắt đầu bằng 'Và biết...' cùng cụm 'các nhân vật trọng yếu'"
  - segment_id: "YS-LN05/Text/part0022.html/p000379"
    choices:
      - "Giữ quan hệ nhân quả và thể bị động: 'Đó là lý do vì sao công việc này phải được thực hiện một cách hoàn hảo.'"
  - segment_id: "YS-LN05/Text/part0022.html/p000380"
    choices:
      - "Địa danh: 'Khối Thịnh vượng chung'; giữ chuỗi ba câu ngắn dồn dập và phủ định 'không để nó chịu thêm một vết xước nào nữa'"
  - segment_id: "YS-LN05/Text/part0022.html/p000381"
    choices:
      - "Hô ngữ, địa danh, tổ chức và chức danh: 'Đồng chí Đại tá', 'Moskva', 'Bộ Dân ủy Nội vụ', 'Đồng chí Tổng Bí thư Josef'"
  - segment_id: "YS-LN05/Text/part0022.html/p000382"
    choices:
      - "Thuật ngữ và quân hàm: 'viên chính ủy', 'Đại tá Mikel', đại từ 'ông'; giữ phủ định hoàn toàn ở vế nhượng bộ (sau khi bỏ từ 'hết' theo finding)"
  - segment_id: "YS-LN05/Text/part0022.html/p000383"
    choices:
      - "Chuyển đại từ ngôi thứ hai khái quát thành cấu trúc khách quan tự nhiên: 'Ở một khía cạnh nào đó, có thể nói đây là lần đầu tiên hai người họ đồng tình với nhau về một chuyện.'"
