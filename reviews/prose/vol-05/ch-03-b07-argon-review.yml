findings:
  - segment_id: "YS-LN05/Text/part0018.html/p000225"
    severity: "moderate"
    category: "terminology_and_rank"
    issue: "Cụm 'Colonel von Lergen' trong lời thoại của Uger đang được dịch là 'Đại tá von Lergen', lệch với cấp bậc đã khóa trong sổ pending và batch liền trước."
    rationale: "Theo quy ước gọi tắt quân hàm Lieutenant Colonel thành Colonel trong tiếng Anh quân sự của nguyên bản (tương tự 'Colonel von Degurechaff' -> 'Trung tá von Degurechaff' và 'Colonel Uger' -> 'Trung tá Uger') cùng mục 'Colonel von Lergen / Colonel / Lergen' -> 'Trung tá von Lergen / Trung tá / Lergen' trong work/run-state/pending-terms-index.yml của Tập 1 và Tập 5 (và đã khóa tại ch-03-b06), cấp bậc của von Lergen ở thời điểm này là Trung tá."
    proposed_fix: "Đổi 'Đại tá von Lergen' thành 'Trung tá von Lergen'."
  - segment_id: "YS-LN05/Text/part0018.html/p000240"
    severity: "moderate"
    category: "pronouns_and_address"
    issue: "Cách gọi kính ngữ quân sự của viên hạ sĩ đối với cấp trên nữ ('ma’am') đang được dịch là 'thưa bà', vừa lệch với cách xưng hô theo cấp bậc 'thưa Trung tá' ở p000236, p000248, p000256, vừa mâu thuẫn với ngữ cảnh Tanya là trẻ vị thành niên."
    rationale: "Trong tiếng Anh quân sự, 'ma’am' là kính ngữ chuẩn khi cấp dưới thưa gửi nữ sĩ quan cấp trên (tương đương 'sir' với nam sĩ quan). Dịch thành 'thưa bà' đối với Tanya (một thiếu nữ mười hai tuổi đang bị chặn cửa chính vì chưa đủ tuổi vị thành niên) gây kênh ngữ cảnh và thiếu nhất quán với cách gọi 'thưa Trung tá' trong cùng cuộc đối thoại."
    proposed_fix: "Đổi 'thưa bà' thành 'thưa Trung tá' ('“Xin hết sức thứ lỗi, thưa Trung tá, đó là quy định ạ!”')."
  - segment_id: "YS-LN05/Text/part0018.html/p000246"
    severity: "moderate"
    category: "pronouns_and_address"
    issue: "Kính ngữ quân sự 'ma’am' trong lời đáp của viên hạ sĩ với Tanya đang dịch là 'thưa bà', chưa đồng bộ với danh xưng quân hàm 'thưa Trung tá' trong cùng cảnh."
    rationale: "Giữ thống nhất cách cấp dưới xưng hô theo quân hàm 'thưa Trung tá' với p000236, p000240, p000248, p000256 và tránh dùng từ 'bà' không phù hợp với lứa tuổi vị thành niên của Tanya."
    proposed_fix: "Đổi 'thưa bà' thành 'thưa Trung tá' ('“Xin hết sức thứ lỗi, thưa Trung tá, quy định nghiêm cấm việc đó ạ.”')."
  - segment_id: "YS-LN05/Text/part0018.html/p000256"
    severity: "moderate"
    category: "pronouns_and_address"
    issue: "Trong cùng một lượt thoại của viên hạ sĩ, câu đầu gọi 'thưa Trung tá von Degurechaff' nhưng hai câu sau lại quy chiếu ngôi thứ hai bằng 'bà' ('ý định của bà', 'tuổi của bà') ngay khi đang giải thích rằng Tanya chưa đủ tuổi vị thành niên."
    rationale: "Theo canon/style-guide.md và DEC-P01-001 về giữ giọng thoại nhất quán theo ngữ cảnh, cấp dưới khi đang thưa gửi 'Trung tá von Degurechaff' và nhấn mạnh việc Tanya là trẻ vị thành niên cần quy chiếu ngôi thứ hai nhất quán bằng quân hàm 'Trung tá' thay vì 'bà'."
    proposed_fix: "Đổi hai cụm 'của bà' thành 'của Trung tá' ('“Tôi thành thật xin lỗi, thưa Trung tá von Degurechaff. Vấn đề không nằm ở ý định của Trung tá! Mà hoàn toàn là vì tuổi của Trung tá ạ!”')."
