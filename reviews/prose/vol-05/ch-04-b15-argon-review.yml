  - segment_id: "YS-LN05/Text/part0022.html/p000584"
    choices:
      - "Điểm nhìn trần thuật ngôi thứ ba theo Serebryakov: 'Cô' (phân biệt với 'nó' chỉ Tanya theo DEC-P01-001); đại từ chỉ Đại tá Mikel: 'ông ta'; thuật ngữ: 'kênh liên lạc mở', 'đường bay', 'đà bay'"
  - segment_id: "YS-LN05/Text/part0022.html/p000585"
    choices:
      - "Địa danh và thuật ngữ: 'vị chỉ huy bên phía Khối Thịnh vượng chung', 'ra lệnh cơ động né tránh'"
