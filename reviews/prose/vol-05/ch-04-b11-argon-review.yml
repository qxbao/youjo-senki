  - segment_id: "YS-LN05/Text/part0022.html/p000417"
    choices:
      - "Giữ dấu chấm lửng mở đầu câu hỏi ngắn: '“…Vậy tức là sao?”'"
  - segment_id: "YS-LN05/Text/part0022.html/p000418"
    choices:
      - "Trong thoại của von Schraft: đại từ 'chúng ta', cụm ẩn dụ 'nàng công chúa của biển cả'"
      - "Nhấn mạnh Markdown theo DEC-P01-002: chỉ bọc '*Chắc là họ cắt đuôi được chúng ta rồi.*' đúng phạm vi thẻ em trong nguồn"
  - segment_id: "YS-LN05/Text/part0022.html/p000419"
    choices:
      - "Tổ chức và thuật ngữ: 'Hải quân Đế quốc', 'đơn vị tàu ngầm'; đại từ chỉ von Schraft: 'anh ta'"
  - segment_id: "YS-LN05/Text/part0022.html/p000420"
    choices:
      - "Thuật ngữ: 'lính tàu ngầm'; giữ phủ định khái quát 'nhìn chung thường không bị trói buộc bởi các quy ước thông thường'"
  - segment_id: "YS-LN05/Text/part0022.html/p000421"
    choices:
      - "Giữ quan hệ điều kiện và phủ định: 'Chỉ cần họ tuân thủ những quy tắc tối thiểu, một người ngoài cuộc cũng chẳng thực sự có quyền phàn nàn.'"
  - segment_id: "YS-LN05/Text/part0022.html/p000422"
    choices:
      - "Phân biệt đại từ ngôi thứ nhất số nhiều trong thoại của von Schraft: 'chúng ta' (hai bên trên tàu hiện tại) và 'Lính tàu ngầm chúng tôi' / 'chúng tôi' (giới lính tàu ngầm)"
  - segment_id: "YS-LN05/Text/part0022.html/p000423"
    choices:
      - "Xưng hô trong thoại của Tanya: 'anh', 'chúng ta'; thuật ngữ và tổ chức: 'không hạm đội', 'cơ quan tình báo liên hợp của Bộ Tư lệnh Lục quân và Hải quân'"
  - segment_id: "YS-LN05/Text/part0022.html/p000424"
    choices:
      - "Xưng hô của von Schraft: 'Tôi'; giữ tình thái suy đoán 'nhưng có lẽ phía bên kia đang canh phòng rất nghiêm ngặt'"
  - segment_id: "YS-LN05/Text/part0022.html/p000425"
    choices:
      - "Thuật ngữ: 'các pháp sư', 'tàu ngầm', 'Tập kích bất ngờ'; giữ tình thái và phủ định nhấn mạnh 'Có lẽ họ nằm mơ cũng chẳng ngờ tới...'"
  - segment_id: "YS-LN05/Text/part0022.html/p000426"
    choices:
      - "Địa danh và ký hiệu chú thích: 'Trân Châu Cảng⁵', 'Scapa Flow⁶'; giữ tình thái giả định quá khứ 'đáng lý không bao giờ có thể thành công'"
