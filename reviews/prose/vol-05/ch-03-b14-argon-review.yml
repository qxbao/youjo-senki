findings:
  - segment_id: "YS-LN05/Text/part0020.html/p000147"
    severity: "moderate"
    issue: "Trong lời thoại của Thiếu tá Weiss (02) gửi cho chỉ huy trực tiếp là Trung tá Tanya von Degurechaff (01), câu hỏi gợi ý dùng cấu trúc tỉnh lược chủ ngữ ở nguyên bản bị dịch với đại từ ngôi thứ hai là 'cô' ('Sao thỉnh thoảng cô không cho thuộc cấp của mình một cơ hội để tỏa sáng nhỉ?'). Cách gọi 'cô' từ cấp dưới đối với tiểu đoàn trưởng mang sắc thái ngang hàng hoặc bề trên, lệch chuẩn tôn ti quân sự của Lục quân Đế quốc."
    recommendation: "Đổi 'cô' thành 'Trung tá' (hoặc lược đại từ ngôi thứ hai theo cấu trúc câu gợi ý) để giữ đúng lễ tiết quân sự giữa thuộc cấp và chỉ huy: 'Sao thỉnh thoảng Trung tá không cho thuộc cấp của mình một cơ hội để tỏa sáng nhỉ? Tôi tự tin là tôi hoặc 05 có thể làm được việc đó.'"
  - segment_id: "YS-LN05/Text/part0020.html/p000125"
    severity: "minor"
    issue: "Khẩu lệnh chỉ mục tiêu chọc thủng màn hỏa lực phòng ngự từ trên cao của địch được dịch thêm từ 'vòng vây' ('đây là trận chiến nhằm đột phá vòng vây!'), gây lệch bối cảnh chiến thuật không gian vì trung đoàn của Drake đang cất cánh từ mặt biển lên để bao vây tiểu đoàn địch (p000128–p000129) chứ không bị đối phương bao vây."
    recommendation: "Lược bỏ từ 'vòng vây', dịch sát hướng tác chiến là 'đây là trận chiến nhằm đột phá!' hoặc 'đây là trận đánh để chọc thủng tuyến địch!'."
  - segment_id: "YS-LN05/Text/part0020.html/p000138"
    severity: "minor"
    issue: "Đoạn văn mở đầu bằng điểm nhìn trần thuật ngôi thứ ba ('Tanya nhìn xuống...'), nhưng ở câu thứ hai—vốn là mệnh đề phân từ không có đại từ ngôi thứ nhất trong nguyên bản—bản dịch lại tự thêm đại từ nội tâm 'bọn mình' ('Ngay cả khi bọn mình đã trút hỏa lực xuống để ghìm chân...'), tạo sự chuyển ngôi đột ngột ngay trong cùng một đoạn trần thuật không đánh dấu chữ nghiêng."
    recommendation: "Lược bỏ 'bọn mình' ở câu thứ hai để giữ liền mạch điểm nhìn với câu đầu: 'Ngay cả khi đã trút hỏa lực xuống để ghìm chân, chúng vẫn chẳng hề giảm bớt chút khí thế nào.'"
