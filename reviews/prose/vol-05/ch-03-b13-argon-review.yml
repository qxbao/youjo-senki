findings:
  - segment_id: YS-LN05/Text/part0020.html/p000110
    severity: moderate
    issue: "Thành ngữ chỉ việc để tuột chiến thắng và chuốc lấy thất bại ngay khi thắng lợi đã ở rất gần bị dịch thành 'chứng kiến biết bao thất bại bị giật khỏi tay ngay trước ngưỡng cửa chiến thắng'. Trong tiếng Việt, 'thất bại bị giật khỏi tay' mang nghĩa đánh mất thất bại (tức thoát khỏi thất bại), làm đảo ngược ý cảnh giác của Drake rằng dù nắm ưu thế sát nút vẫn có thể nhận lấy thất bại ngay trước ngưỡng cửa chiến thắng."
    recommendation: "Diễn đạt lại đúng chiều nghĩa của thành ngữ, ví dụ: 'Ông đã chứng kiến biết bao cảnh phải chuốc lấy thất bại ngay trước ngưỡng cửa chiến thắng, khi thắng lợi chỉ còn cách một tầm tay.' hoặc 'Ông đã chứng kiến biết bao thất bại ập đến ngay từ ngưỡng cửa chiến thắng khi chỉ còn cách một tầm với.'"
  - segment_id: YS-LN05/Text/part0020.html/p000088
    severity: minor
    issue: "Câu thứ hai mở đầu bằng cấu trúc phủ định thể hiện ý nhận xét chua chát rằng giờ có nhận ra thì cũng chẳng làm được gì, nhưng bản dịch viết 'Dù giờ đây họ có thể làm gì được về chuyện đó nữa đâu' khiến liên từ nhượng bộ 'Dù' lệch khớp ngữ pháp với cấu trúc nghi vấn tu từ phía sau."
    recommendation: "Đổi sang câu phủ định hoặc chuyển tiếp tự nhiên hơn: 'Mà giờ đây họ cũng chẳng thể làm gì được về chuyện đó nữa.' hoặc 'Có điều giờ đây họ cũng đâu thể làm gì được về chuyện đó nữa.'"
  - segment_id: YS-LN05/Text/part0020.html/p000102
    severity: minor
    issue: "Trong cuộc trao đổi qua vô tuyến với Anjou CP, Drake dùng đại từ ngôi thứ nhất số nhiều 'chúng tôi' ở p000095 và p000107 để chỉ lực lượng pháp sư dưới quyền mình (đối lập với phía Anjou CP gọi Drake và đơn vị của ông là 'anh / các anh' ở p000101, p000106), nhưng ở p000102 khi đáp lại Anjou CP về việc đối đầu với tiểu đoàn địch và so sánh quân số lại chuyển sang 'chúng ta'."
    recommendation: "Đồng bộ đại từ thành 'chúng tôi' trong lời đáp của Drake với Anjou CP tại p000102 ('...vẫn sẽ là một cuộc vật lộn đầy cam go đối với chúng tôi. Đụng độ với các lực lượng khác của Đế quốc có quân số ngang ngửa chúng tôi còn dễ thở hơn nhiều.')."
  - segment_id: YS-LN05/Text/part0020.html/p000103
    severity: minor
    issue: "Động từ bị động ở câu cuối chỉ sự tiêu hao, bào mòn lực lượng qua thời gian chiến đấu từ đầu cuộc chiến bị dịch hẹp thành 'bị bào mòn sức lực', làm mờ quan hệ nhân quả trực tiếp với câu tiếp theo (p000104) nói về việc đơn vị đang phải bù đắp các tổn thất quân số bằng lính mới và tân binh."
    recommendation: "Lược chữ 'sức lực' hoặc diễn đạt theo hướng hao hụt lực lượng: 'Tuy nói vậy, lực lượng của họ đã bị bào mòn kể từ khi cuộc chiến bắt đầu.' (hoặc 'Tuy nói vậy, họ đã bị tiêu hao dần kể từ khi cuộc chiến bắt đầu.')."
