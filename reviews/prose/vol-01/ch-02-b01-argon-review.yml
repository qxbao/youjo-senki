  volume: vol-01
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1: giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba (“nó” / “Tanya”), độc thoại nội tâm ngôi thứ nhất (“mình”), thủ pháp tự tách góc nhìn giữa câu ở p000017, và xưng hô công vụ trong đối thoại trực tiếp (“Tôi”, “cô”)."
