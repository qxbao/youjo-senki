- id: ch02-b01-tanya-pronouns-and-pov-shift-p000017
  source_term: generic impersonal pronoun in magicology exposition, Tanya first-person interior monologue and third-person narration pronouns, intra-paragraph POV/pronoun shift in p000017, and formal military dialogue pronouns in p000018/p000020
  proposed_vi: phần thuyết minh khách quan mở đầu chương (p000003–p000004) dùng chủ ngữ phiếm chỉ “con người” / “người ta” cho đại từ khái quát ngôi thứ hai và “họ” cho những người chế tạo quả cầu tính toán tại Đế quốc; trong các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000008–p000010, p000016, p000019), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” theo đúng DEC-P01-001; trong các đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000011–p000013, p000015, p000021), dùng tên riêng/chức danh “Tanya” / “Thiếu úy Degurechaff” và đại từ trần thuật “nó” / “Nó” kết hợp đại từ phản thân “mình” theo DEC-P01-001 và chapter1_b02_decisions (tránh dùng “cô” trong lời kể ngôi thứ ba về Tanya; lưu ý từ “nó” tại p000005 quy chiếu công nghệ/thuật thức, tại p000014 quy chiếu động cơ, và ở câu thứ hai p000021 quy chiếu đề xuất); tại p000017, bảo toàn sự chuyển ngôi đặc trưng trong cùng một đoạn của văn bản nguồn bằng cách dùng “Thiếu úy Tanya Degurechaff” và “nó” ở hai câu đầu rồi chuyển sang ngôi thứ nhất nội tâm “việc thăng tiến của mình” đồng thời tách danh tính bên ngoài “Tanya” ở câu thứ ba (đồng bộ ch-01-b04 p000051, p000054 và ch-01-b11 p000191, p000192); trong lời thoại trực tiếp khi nhận công văn, Tanya tự xưng “Tôi” (p000018) và sĩ quan trao thông báo gọi Tanya bằng đại từ ngôi thứ hai công vụ “cô” (p000020 — đồng bộ Chương 1)
  alternatives_vi:
  - đồng chí / cậu (thay cho “cô” trong lời thoại của sĩ quan trao thông báo cho Tanya tại p000020 — ưu tiên “cô” vì chuẩn mực trong giao tiếp công vụ với nữ thiếu úy Quân đội Đế quốc và không vi phạm quy ước tránh dùng “cô” trong trần thuật ngôi thứ ba)
