locked_choices:
- segment_id: YS-LN01/Text/chapter005.xhtml/p000001
  locks:
  - Giữ tiêu đề mở đầu chương viết hoa toàn bộ “KHÔNG PHẬN PHÍA TRÊN PHÒNG THÍ NGHIỆM THỬ NGHIỆM KHÔNG QUÂN LỤC QUÂN KRUSKOS”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000002
  locks:
  - Giữ tên cơ sở “Phòng thí nghiệm Thử nghiệm Không quân Lục quân Kruskos” và địa danh “phía tây nam thủ đô Đế quốc Berun”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000003
  locks:
  - Giữ cặp khái niệm “Quả cầu và vương trượng”, thuật ngữ “ma pháp học hiện đại”, “quả cầu tính toán”, ví dụ bật bánh xe đá lửa của chiếc bật lửa bằng tay hoặc bằng sức mạnh ma pháp, và câu kết “Đúng vậy, ma pháp đã trở thành một công nghệ.”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000004
  locks:
  - Giữ phủ định mức độ “vẫn chưa được hiểu rõ cho lắm” đối với nguyên lý của “mana và thuật thức gây nhiễu”, cùng các thuật ngữ “Kỹ thuật ma pháp”, “ưu thế quân sự”, “Đế quốc”, “bộ tính toán số học tương tự” và “quả cầu tính toán”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000005
  locks:
  - Giữ các thuật ngữ “thuật thức hàng không”, “pháp sư”, “Súng trường gắn lưỡi lê”, “vương trượng”, “vật dẫn để thi triển phép” và “thuật thức chiến đấu trong tác chiến tầm xa”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000006
  locks:
  - Giữ quan hệ nhân quả giữa tầm quan trọng của các quả cầu và “cuộc chạy đua công nghệ giữa các cường quốc thế giới”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000007
  locks:
  - Giữ vị thế “nước tiên phong trong lĩnh vực này” của “Đế quốc”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000008
  locks:
  - Giữ đại từ nội tâm “mình” theo DEC-P01-001, con số độ cao “bốn nghìn” không tự thêm đơn vị đo, phép so sánh với lần suýt mất mạng vì dù không bung do độ ẩm, và nguy cơ “khiến các phép tính thất bại và làm động cơ của quả cầu bốc cháy”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000009
  locks:
  - Giữ đại từ nội tâm “mình”, cụm “tốc độ bay hành trình so với mặt đất theo đúng kế hoạch” và điều kiện phải tiếp tục bay lên cao chừng nào vẫn vượt qua các bài thử nghiệm mà không gặp sự cố.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000010
  locks:
  - Giữ đại từ nội tâm “mình”, dấu ngoặc kép của ““mẫu mới”” và cụm “một quả cầu nguyên mẫu cực kỳ thiếu ổn định và đầy rẫy khiếm khuyết tệ hại”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000011
  locks:
  - Giữ câu hỏi tu từ mở đầu đoạn, mệnh đề chêm giữa hai dấu gạch ngang dài “—việc sử dụng một thứ không có dung sai đòi hỏi sự cẩn trọng tột độ—” và tên riêng “Tanya” trong lời kể ngôi thứ ba.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000012
  locks:
  - Giữ giả định phản thực tại và đại từ trần thuật “nó” cho Tanya theo DEC-P01-001 (“Nếu không nhờ những tiến bộ của y học, hẳn nó đã phải sống suốt quãng đời còn lại chỉ với cánh tay trái.”).
- segment_id: YS-LN01/Text/chapter005.xhtml/p000013
  locks:
  - Giữ phép so sánh cầm quả cầu thiếu ổn định với cầm một quả lựu đạn, danh xưng “Thiếu úy Degurechaff” và đại từ trần thuật “Nó”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000014
  locks:
  - Giữ tiếng hét báo động khẩn cấp và khẩu lệnh lặp lại “Hủy thử nghiệm! Hủy thử nghiệm!”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000015
  locks:
  - Giữ cụm “Đài kiểm soát” và tên riêng “Tanya”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000016
  locks:
  - Giữ câu hỏi nội tâm tự vấn dùng đại từ “mình” và chi tiết “nhận lệnh điều về hậu phương sau khi bị thương ở phía bắc”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000017
  locks:
  - Giữ sự chuyển ngôi đặc trưng trong cùng đoạn theo đúng nguồn và DEC-P01-001: hai câu đầu dùng “Thiếu úy Tanya Degurechaff” và “nó”, câu thứ ba chuyển sang “việc thăng tiến của mình” đồng thời tách danh tính bên ngoài “giam chân Tanya ở tiền tuyến”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000018
  locks:
  - Giữ câu thoại ngắn gọn ““Tôi sẽ xem qua ngay đây.””.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000019
  locks:
  - Giữ đại từ nội tâm “mình”, bảo toàn chính xác nhấn mạnh `*Mình chỉ mong họ đừng điều mình ra lại tiền tuyến*` theo DEC-P01-002, cùng các thuật ngữ “Cục Nhân sự”, “lệnh điều động phục vụ trong nước chưa đề ngày tháng”, “sĩ quan cấp trên” và “lời mời nhận việc không chính thức theo tiêu chuẩn quân đội”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000020
  locks:
  - Giữ đại từ ngôi thứ hai công vụ “cô” dành cho Tanya và các thuật ngữ “thông báo không chính thức”, “phân công cô phục vụ trong nước tại đơn vị huấn luyện chiến đấu”, “biệt phái cô về bộ chỉ huy làm nhân sự kiểm định công nghệ”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000021
  locks:
  - Giữ các cụm “phục vụ ở hậu phương”, “đơn vị huấn luyện”, “nhân viên thử nghiệm”, “lộ trình thăng tiến vững chắc” và câu kết dùng đại từ trần thuật “Nó” kết hợp phản thân “mình” theo DEC-P01-001.
