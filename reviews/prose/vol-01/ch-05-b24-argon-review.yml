    terms_and_ranks: "đợt pháo kích dồn dập; điểm cố định."
    modality_and_negation: "Giữ cấu trúc phủ định kép 'không thể *không* trúng' và câu hỏi cảm thán hoài nghi cuối đoạn 'Sao cô ấy lại có thể thốt ra những lời như thế chứ…?'."
    emphasis: "Khóa chính xác 2 cụm nhấn mạnh Markdown: từ phủ định thứ hai '*không*' và cụm '*Tất cả mọi người đều rất có năng lực. Ngay cả tôi cũng tự hào về mọi người.*', khớp 1:1 với 2 thẻ <html:em> trong nguồn theo DEC-P01-002."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000609
    pov_and_pronouns: "Thoại của Tanya trước toàn đội: tự xưng 'tôi' / 'Tôi', gọi học viên là 'mọi người' / 'Mọi người' (kết hợp phản thân 'của mình'), quy chiếu bên pháo binh bằng 'Họ' / 'họ'."
    terms_and_ranks: "huấn luyện; hỏa lực dẫn đường của pháo binh; huấn luyện chống pháo binh; cuộc diễn tập phối hợp; các khẩu đội pháo; điểm chốt; trận chiến phòng ngự; mười lăm phút; đạn tập; ba mươi sáu tiếng."
    modality_and_negation: "Giữ nhượng bộ 'Đành rằng đây chỉ là huấn luyện, nhưng...', câu hỏi đuôi phủ định kép 'sẽ chẳng ổn chút nào nếu mọi người không trải qua..., đúng không?', mệnh lệnh phủ định 'đừng bày ra vẻ mặt lo lắng thế chứ', phủ định mức độ 'không có quá nhiều đạn tập đâu' và phỏng đoán 'Tôi đoán họ sẽ bắn hết sạch sau khoảng ba mươi sáu tiếng thôi'."
    emphasis: "Không dùng dấu *...*."
