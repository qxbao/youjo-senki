    severity: minor
    category: lexical_precision
    issue: "Cụm từ liệt kê người kể (Visha) và các thuộc cấp còn lại của vị đại úy được dịch là 'tôi cùng toàn bộ cấp dưới của cô ấy', lược mất sắc thái 'khác / còn lại' dù bản thân Visha cũng là cấp dưới của Tanya."
    basis: "Trong mạch trần thuật ngôi thứ nhất của Visha, nguồn dùng từ bổ nghĩa chỉ những cấp dưới còn lại ngoài người kể để thể hiện Visha nằm trong nhóm thuộc cấp của vị đại úy."
    recommendation: "Có thể cân nhắc chỉnh nhẹ ở bước chuốt văn thành 'tôi cùng toàn bộ các cấp dưới khác của cô ấy' hoặc 'tôi cùng toàn bộ số cấp dưới còn lại của cô ấy'; không ảnh hưởng nghĩa cốt lõi."
