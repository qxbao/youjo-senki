  proposed_vi: tiếp nối cảnh họp của Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc ngay sau khi trưởng ban tổng vụ bên Cục Nhân sự đồng ý giải mật hồ sơ cá nhân của ứng viên tại p000040, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn khách quan của hội đồng hay Cục Nhân sự): từ thời điểm danh tính và độ tuổi của Trung úy Ma pháp Tanya Degurechaff được lật mở (p000040–p000058), trong lời kể ngôi thứ ba khách quan của hội đồng tuyển sinh, quy chiếu Tanya nhất quán bằng đại từ “cô” kết hợp phản thân “mình” (và danh ngữ “cô bé” tại p000049 khi nhấn mạnh độ tuổi mười một), đồng bộ hoàn toàn với lời kể khách quan từ góc nhìn Lergen / Bộ Tổng Tham mưu ở ch-01-b15 → ch-01-b20 (lưu ý từ “nó” ở câu cuối p000056 chỉ quy chiếu danh từ bất động vật là “bài viết”, tuyệt đối không quy chiếu nhân vật); trong lời thoại trực tiếp của các thành viên hội đồng và người xét duyệt (p000044, p000046, p000050, p000052, p000054), quy chiếu Tanya bằng “cô ấy” / “Cô ấy”; quy chiếu trưởng ban tổng vụ bên Cục Nhân sự bằng đại từ “Ông” (p000040 — đồng bộ ch-04-b02 p000037–p000038), và quy chiếu tập thể hội đồng tuyển sinh (p000043, p000045), các sĩ quan ma pháp nói chung (p000048), các học viên sĩ quan nói chung (p000056), những người am hiểu về hậu cần (p000057) cùng đội ngũ Cục Đường sắt (p000058) bằng “Họ” / “họ”; trong lời thoại tại cuộc họp, Chuẩn tướng von Rudersdorf (p000041) và thành viên hội đồng (p000044) khi đặt câu hỏi cho người trình bày / Thiếu tá von Lergen dùng đại từ ngôi thứ hai “anh” (đồng bộ ch-04-b02 p000027), còn thành viên hội đồng phát biểu tại p000046 dùng “chúng ta”; bảo toàn chính xác các câu hỏi tại p000041, p000042, p000044, p000053, câu điều kiện giả định trái thực tế kèm chủ ngữ phiếm chỉ “người ta” tại p000050, các cấu trúc giả định/suy đoán tại p000040, p000051, p000052, p000056, và không sử dụng dấu `*...*` ở bất kỳ đoạn nào theo đúng DEC-P01-002 do nguồn không có thẻ nhấn mạnh
