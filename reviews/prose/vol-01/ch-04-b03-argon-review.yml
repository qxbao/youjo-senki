  rationale: "Kế thừa đồng bộ “vòng sàng lọc ẩn danh” (ch-04-b01 p000018–p000019), “Cục Đường sắt” (ch02-b02-instructor-unit-and-logistics-hq-transfer-terms), “học viên sĩ quan” (ch-01-b15/b16), “hậu cần”, “các tuyến tiếp tế”, “hậu phương” và “tiền tuyến” (Chương 1–2); khóa tạm “chương trình đào tạo cấp tốc” / “khóa cấp tốc”, “kiến thức chiến thuật” / “cấp độ chiến thuật”, “khóa bồi dưỡng sĩ quan nâng cao”, “Luận văn tốt nghiệp” / “bài luận văn”, tên đề tài “‘Hậu cần cho Triển khai Thần tốc’”, “các vấn đề chiến lược”, “đợt xét duyệt ẩn danh”, “kinh nghiệm tác chiến dã chiến”, “phân tích hậu cần”, “tổ chức hệ thống kho trạm”, “quy trình phân phối chuẩn hóa”, “lưu kho dài hạn”, “vật tư dự trữ khẩn cấp”, “tích trữ nguồn lực ở hậu phương” và “vật tư thiết yếu”."
