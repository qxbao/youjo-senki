  rationale: "Kế thừa đồng bộ “mạch điện” (ch-02-b05/b08/b17), “khiếm khuyết” (b07-flaw) và “quả cầu khiếm khuyết” (ch-02-b15 p000180 / ch-02-b17 p000242), “phủ được một lớp mana” (đồng bộ với “lớp phủ” tại ch-02-b17 p000235), “quả cầu” / “quả cầu tính toán” (chapter1_b01_pending_terms), “thực chiến” (ch-03-b08 p000128/p000145/p000147), “đồng bộ hóa” / “đồng bộ hóa bốn lõi” (ch-02-b05/b10–b12, ch-03-b08 p000145/p000148), “lượng mana gấp bốn lần bình thường” (ch-02-b03 p000064), “trung đội” (ch-03-b08 p000153), “giảng viên” (ch-01-b16, ch-04-b01/b05/b06), giữ nguyên “Central” theo sổ pending (b05-central-command), kết hợp “công nghệ tiên tiến” (ch-02-b09/b10) và “kiểm định công nghệ” (ch-02-b01/b02/b07/b10) thành “Đoàn Kiểm định Công nghệ Tiên tiến”, “Thiếu úy Degurechaff” (ch-03-b08 p000133), “Kỹ sư trưởng von Schugel” / “Kỹ sư trưởng Schugel” (ch-02-b09/b12, vol-02-ch-07-b10), giữ nguyên “Elinium Arms” (ch-03-b08 p000138) và dịch “Xưởng Vũ khí Elinium” đồng bộ cấu trúc với “Xưởng Vũ khí Kỹ thuật” (b02-technical-arsenal) cùng “Xưởng Vũ khí Volcker” (ch-01-b13), “cố định mana” (ch-03-b08 p000145), “làm tan chảy các lõi” (ch-02-b17 p000246), “giao thoa” (ch-02-b11 p000081), “Thượng đế” (review-God), “phép màu” (ch-03-b08 p000132), “Type 95”, “anh hùng” (ch-04-b09 p000193), “Huy hiệu Xung kích Cánh Bạc” (ch-03-b08 p000133) và “tuyên truyền” (ch-01-b15 p000279); khóa tạm “tự hủy”, “các đợt thử nghiệm thực chiến”, “các loạt mana”, “nhà phát triển”, “cuộc cách mạng công nghệ”, “ăn may”, “các giá trị quan sát được”, “phản ứng mana mất kiểm soát”, “các sóng giao thoa”, “hiện tượng hóa lỏng”, “lượng mana đang lồng lộn”, “sự trùng hợp kỳ diệu”, “báo cáo thí nghiệm”, “quyền năng của Thượng đế”, “sự báng bổ”, “những dân kỹ thuật cốt cán nhất” và “xác suất thành công”."
