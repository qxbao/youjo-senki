  source_term: review_board_conclusion_and_serebryakov_first_person_pov_pronouns_conditionals_and_emphasis_ch03_b09
  proposed_vi: trong hai phân cảnh của lô ch-03-b09 — (1) đoạn kết cuộc họp của Hội đồng Xét duyệt Phòng thí nghiệm Nghiên cứu Công nghệ Quân đội Đế quốc từ p000154 đến p000175 dưới góc nhìn trần thuật ngôi thứ ba khách quan tiếp nối trực tiếp ch-03-b08, và (2) phân cảnh Ký túc xá Trường Thiếu sinh quân sau dấu ngắt trang từ p000176 đến p000182 dưới điểm nhìn tự sự ngôi thứ nhất của Viktoriya Ivanovna Serebryakov (Visha): tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác) và DEC-P01-002; ở Phân cảnh 1 (p000154–p000175), tiếp tục quy chiếu Thiếu úy Tanya Degurechaff bằng danh ngữ “Thiếu úy Degurechaff” (p000157, p000161, p000173, p000175) và đại từ ngôi thứ ba “cô” trong lời kể khách quan (p000175 — đồng bộ ch-03-b08 p000133, p000135; lưu ý đại từ “nó” tại p000154, p000156, p000157, p000160, p000166, p000168, p000171, p000172 hoàn toàn chỉ quy chiếu danh từ bất động vật là quả cầu tính toán Type 95, trường hợp thử nghiệm, pho tượng hoặc điều bất khả thi), quy chiếu Kỹ sư trưởng von Schugel bằng đại từ “ông” (p000158, đồng bộ ch-02-b09/b11/b12), quy chiếu tập thể các kỹ sư / hội đồng bằng “họ” / “Họ” (p000158, p000159, p000162, p000165, p000166, p000172), dùng chủ ngữ khái quát “Người ta” / “một người” cho đại từ ngôi thứ hai phiếm chỉ tại p000166, p000169 theo quy ước direct-address choice, và giữ hệ xưng hô phòng họp đồng bộ với ch-03-b08 (sĩ quan chất vấn gọi bộ phận công nghệ là “các vị” tại p000160; kỹ sư đại diện tự xưng “Tôi” / “tôi”, gọi bộ phận mình là “chúng tôi” và gọi hội đồng là “các vị” tại p000161; dùng “chúng ta” / “Chúng ta” kết hợp phản thân “mình” cho tập thể chung tại p000168, p000171, p000174); ở Phân cảnh 2 (p000176–p000182), người kể chuyện ngôi thứ nhất Viktoriya Ivanovna Serebryakov tự xưng nhất quán bằng “Tôi” / “tôi” xuyên suốt các đoạn tự sự (p000177, p000180–p000182 — đồng bộ với điểm nhìn tự sự ngôi thứ nhất của Chuẩn úy Laeken tại ch-04-b08/b09), quy chiếu người bạn thân cùng ký túc xá Elya bằng tên riêng “Elya”, “cô bạn” và đại từ ngôi thứ ba “cô ấy” (p000180–p000182), đồng thời lược đại từ sở hữu ngôi thứ hai phiếm chỉ ở câu 2 p000182 theo quy ước direct-address choice; bảo toàn đầy đủ các câu hỏi trực tiếp trong cuộc họp (p000156, p000160, p000163, p000170), câu điều kiện giả định ở câu 2 p000154, giả định trái thực tế ở quá khứ tại câu 2 p000162 (`nếu cuộc thử nghiệm đó thất bại, toàn bộ Xưởng Vũ khí Elinium hẳn đã bị thổi bay thành từng mảnh vụn`), giả định đề xuất ở câu 1 p000166, cấu trúc tăng tiến `Không chỉ vậy, cô ấy còn...` ở câu 3 p000180, và bảo toàn chính xác duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tại câu 2 p000180 (`*mà*`) tương ứng với thẻ `<html:em>` trong nguồn theo đúng DEC-P01-002 (28/29 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - cậu ấy (thay cho “cô ấy” khi Visha quy chiếu Elya trong tự sự ngôi thứ nhất tại p000180–p000182 — ưu tiên “cô ấy” để giữ giọng tự sự chuẩn mực, tự nhiên và khớp với cụm “cô bạn xinh đẹp của tôi” ở đầu p000180) / *và* (thay cho `*mà*` tại câu 2 p000180 — ưu tiên cấu trúc tương hỗ `không những cao hơn tôi, *mà* dù mảnh mai như thế, cô ấy lại...` để lột tả tự nhiên nhất sắc thái nhấn mạnh liên từ nối hai phẩm chất đáng ghen tị của Elya trong tiếng Việt)
