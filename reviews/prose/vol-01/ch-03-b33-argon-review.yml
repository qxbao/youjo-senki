- id: ch03-b33-republican-intelligence-debriefing-and-devil-of-the-rhine-terms
  source_term: republican_intelligence_debriefing_and_devil_of_the_rhine_terms_ch03_b33
  proposed_vi: "bên Tình báo / tiền tuyến / đại đội / vùng chiến sự / Ác quỷ sông Rhine / Đại úy Cagire / Named / tín hiệu ma lực / sĩ quan tình báo / nhật ký dữ liệu / quả cầu tính toán / Tham mưu trưởng / quả cầu / thẩm vấn thu thập thông tin / đội đặc nhiệm / tầm bắn / Ác quỷ / các lõi bên trong / vũ khí thông thường / đại bác hạng nặng / hỏa lực áp đảo / bắn tỉa chính xác / mối đe dọa cấp chiến lược / thư viện dữ liệu / Quân đội Cộng hòa / hơn sáu mươi điểm hạ gục / đội tiễu trừ Named / Đại đội 106 / loạt đạn bắn đồng loạt / làn đạn đan chéo / ánh sáng ma lực / hỏa lực bắn có kỷ luật / Khả năng cơ động"
  alternatives_vi:
  - "Cục Tình báo / bộ phận Tình báo (thay cho “bên Tình báo” tại p000253, p000258, p000261 — ưu tiên “bên Tình báo” để đồng bộ trực tiếp với pending-terms-index.yml vol-01) / dấu hiệu ma lực (thay cho “tín hiệu ma lực” tại p000257, p000258, p000265, p000268 — ưu tiên “tín hiệu ma lực” để đồng bộ với ch-03-b27 p000124 và ch-03-b28 p000151) / tổ công tác đặc biệt (thay cho “đội đặc nhiệm” tại p000262 — ưu tiên “đội đặc nhiệm” vì gọn và chuẩn quân sự) / đội đặc nhiệm tiêu diệt Named (thay cho “đội tiễu trừ Named” tại p000270 — ưu tiên “đội tiễu trừ Named” để sát sắc thái nguyên gốc) / lưới lửa đan chéo (thay cho “làn đạn đan chéo” tại p000272 — cả hai đều tự nhiên, khóa tạm “làn đạn đan chéo”) / hỏa lực có kiểm soát (thay cho “hỏa lực bắn có kỷ luật” tại p000276 — ưu tiên “hỏa lực bắn có kỷ luật” để đồng bộ trực tiếp với B15-T11 và ch-03-b28 p000146)"
