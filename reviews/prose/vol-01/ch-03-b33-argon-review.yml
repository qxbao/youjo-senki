- id: ch03-b33-republican-council-pov-pronouns-and-emphasis
  source_term: republican_council_pov_pronouns_and_emphasis_ch03_b33
  proposed_vi: "Toàn bộ 25 đoạn của lô ch-03-b33 (chapter007b.xhtml/p000253–p000277) tiếp nối trực tiếp cuộc họp Hội đồng chiến thuật bên phía Bộ Tổng Tham mưu Cộng hòa từ ch-03-b32, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Tuân thủ giới hạn chủ thể và ngữ cảnh của DEC-P01-001: vì Tanya không phải là chủ thể điểm nhìn của phân cảnh này, bản dịch tuyệt đối không dùng đại từ trần thuật “nó” để chỉ pháp sư Đế quốc (từ “nó” ở câu 1 p000271 chỉ quy chiếu “một quả cầu tính toán”). Khi nguyên bản dùng danh ngữ trung tính hoặc đại từ số nhiều quy chiếu ngôi thứ ba chưa xác định danh tính/giới tính, bản dịch dùng các cách quy chiếu trung tính “người lính địch” / “một pháp sư” (p000253), “đối thủ” (p000254, p000269), “Một Named chưa rõ danh tính của địch” / “đối tượng” (p000257, p000269), “kẻ địch này” (p000258, p000272, p000274), “một pháp sư chưa được xác nhận” (p000261), “pháp sư đó” (p000268, p000276), “đối phương” (p000277); riêng tại p000264 và p000266, khi văn bản nguồn dùng đại từ nam giới theo suy đoán mặc định của phía Cộng hòa về pháp sư bí ẩn trên chiến trường, bản dịch bảo toàn chính xác đại từ “hắn” đồng bộ với ch-03-b27 (p000115, p000128, p000129, p000131). (2) Giữ chuẩn xác đại từ nhân xưng và thanh điệu trong cuộc họp: Tham mưu trưởng (chủ tọa cuộc họp) chất vấn bên Tình báo bằng “Các anh” (p000260), và trong câu diễn giải hàm ý mắng mỏ gay gắt dùng “Lũ khốn các người” (p000260); Đại úy Cagire (sĩ quan tình báo) báo cáo trước hội đồng tự xưng “chúng tôi” (p000257, p000261); các sĩ quan Cộng hòa trong phòng họp khi bình luận về tương quan chiến thuật dùng “chúng ta” (p000276, p000277); đại từ ngôi thứ hai phiếm chỉ trong câu giả định ở câu 3 p000267 được chuyển tự nhiên thành chủ ngữ khái quát “người ta” theo đúng quy ước direct-address choice. (3) Bảo toàn trọn vẹn mọi câu hỏi trực tiếp/gián tiếp, mệnh đề điều kiện, phủ định và cấu trúc song hành theo đúng canon/style-guide.md: câu hỏi chất vấn trực tiếp ở p000256, p000260, p000265, p000273, p000276, p000277; câu hỏi gián tiếp ở p000262 (“xem có dữ liệu nào cứu vãn được hay không”) và p000272 (“ai nấy đều tự hỏi rốt cuộc các binh sĩ đang nhắm vào đâu”); câu điều kiện suy luận ở p000258 (“Nếu họ chỉ có thể nhận diện kẻ địch này độc qua tín hiệu ma lực, điều đó có nghĩa là họ chẳng biết gì cả.”) và câu điều kiện ở p000269 (“nếu các hồ sơ ghi chép là chính xác...”); cấu trúc hai khả năng loại trừ “hoặc là... hoặc là...” ở p000259 và p000267; cấu trúc song hành “vừa có thể... vừa có thể...” ở p000268; cùng các mệnh đề phủ định tuyệt đối/ước đoán ở p000263, p000264, p000266, p000274, p000275. (4) Tuân thủ nghiêm ngặt DEC-P01-002 về nhấn mạnh Markdown: chỉ duy nhất 1/25 đoạn nguồn có thẻ `<html:em>` là p000260 (`<html:em>Are you bastards so inept that you couldn’t even do that much?!</html:em>`), được bảo toàn chính xác thành `*Lũ khốn các người bất tài vô dụng đến mức ngay cả chừng đó việc cũng không làm nổi sao?!*` trong khi phần dẫn nhập `Về thực chất, câu đó chẳng khác nào hỏi:` nằm ngoài dấu `*`; toàn bộ 24/25 đoạn còn lại không có nhấn mạnh trong XHTML nguồn và hoàn toàn không dùng dấu `*...*`."
  alternatives_vi:
  - "không có (việc phân biệt rạch ròi quy chiếu trung tính “đối tượng / kẻ địch / đối phương” với đại từ “hắn” tại đúng hai vị trí nguồn dùng đại từ nam giới ở p000264 và p000266, giữ “nó” ở p000271 chỉ quy chiếu quả cầu tính toán, và bảo toàn duy nhất một cụm nhấn mạnh Markdown tại p000260 theo DEC-P01-002 là phương án chuẩn xác và nhất quán nhất)"
