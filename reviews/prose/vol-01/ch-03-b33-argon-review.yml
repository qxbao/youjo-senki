  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 25 đoạn của ch-03-b33: giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa, phân biệt chính xác quy chiếu trung tính với đại từ nam giới mặc định theo nguồn ở p000264 và p000266, bảo toàn mọi câu hỏi, điều kiện và phủ định, đồng thời chỉ đánh dấu nhấn mạnh Markdown tại đúng 1 đoạn có `<html:em>` là p000260."
