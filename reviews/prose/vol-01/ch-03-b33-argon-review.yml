  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ quân sự, pháp thuật và định danh đã khóa tạm ở các lô trước của chương 3 (đặc biệt là ch-03-b27, b28, b32): “bên Tình báo” (pending-terms-index.yml vol-01: p000253, p000258, p000261), “Ác quỷ sông Rhine” / “Ác quỷ” (ch-03-b27 p000128, ch-03-b28 p000135: p000255, p000256, p000267, p000268, p000269, p000275), “Named” (ch-03-b27 p000125, ch-03-b32 p000223: p000257, p000268, p000270), “tín hiệu ma lực” (ch-03-b27 p000124, ch-03-b28 p000151: p000257, p000258, p000265, p000268), “nhật ký dữ liệu” và “quả cầu tính toán” / “quả cầu” (ch-03-b32 p000231, p000232: p000259, p000260, p000261, p000262, p000267, p000271), “thẩm vấn thu thập thông tin” (ch-03-b32 p000233: p000261), “tầm bắn” (ch-03-b27 p000115, ch-03-b28 p000145: p000266), “các lõi” (ch-03-b09 p000162, ch-03-b28 p000142: p000267), “bắn tỉa chính xác”, “mối đe dọa cấp chiến lược” và “thư viện dữ liệu” (ch-03-b27 p000124, p000128, ch-03-b28 p000138, p000151: p000268), “Quân đội Cộng hòa” và “hơn sáu mươi điểm hạ gục” (ch-03-b27 p000128, ch-03-b32 p000223: p000269), “Đại đội 106” (ch-03-b32 p000237, p000241, p000252: p000271), “ánh sáng ma lực” (ch-03-b22 p000498, ch-03-b26 p000071, ch-03-b28 p000142: p000274), “hỏa lực bắn có kỷ luật” (B15-T11, ch-03-b28 p000146: p000276), “Khả năng cơ động” (ch-02-b04 p000067, ch-03-b06 p000083: p000277); đồng thời khóa tạm các chức danh và thuật ngữ phát sinh trong lô: “Đại úy Cagire” (p000256), “sĩ quan tình báo” (p000258, p000259), “Tham mưu trưởng” (p000260), “đội đặc nhiệm” (p000262), “đội tiễu trừ Named” (p000270), “loạt đạn bắn đồng loạt” và “làn đạn đan chéo” (p000272)."
