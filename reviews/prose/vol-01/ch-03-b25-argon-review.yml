- id: ch03-b25-tanya-pov-pronouns-schones-serebryakov-dialogue-modality-and-single-emphasis
  source_term: tanya_pov_pronouns_schones_serebryakov_dialogue_modality_and_single_emphasis_ch03_b25
  proposed_vi: 'Tiếp nối trực tiếp ch-03-b24 (p000039–p000042) khi Tanya tuyên bố một mình nhận xử lý ba trung đội pháp sư Cộng hòa, toàn bộ 26 đoạn của lô ch-03-b25 (chapter007b.xhtml/p000043–p000068) tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Hệ đại từ trần thuật và độc thoại nội tâm của Tanya theo DEC-P01-001: trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000045–p000047, p000053–p000056, p000059, p000060), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” cho cá nhân Tanya (“thành tích của mình”, “ký ức của mình”, “chiến công của mình”, “nước Đức mà mình từng biết”, “một mình mình”, “sự nghiệp của mình”...) và dùng “chúng ta” khi đặt câu hỏi bao gồm toàn Đế quốc (“…Liệu chúng ta có thể thắng không?” ở p000054); trong trần thuật ngôi thứ ba về Tanya (p000050, p000057, p000061, p000068), giữ tên riêng “Tanya” (p000057, p000061, p000068) và đại từ ngôi thứ ba “nó” kết hợp phản thân “mình” (“nó phải được phép tận hưởng thành quả lao động của mình”, “nó sẽ được ở trong môi trường tốt nhất” ở p000050; “Câu trả lời của nó” ở p000061; “trong tim nó”, “Cơn thịnh nộ của nó” ở p000068), tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” cho Tanya; quy chiếu “Schwarkopf” bằng tên riêng kết hợp phản thân “mình” (p000052), quy chiếu “Trung sĩ Schones” / “Schones” bằng “anh ta” trong trần thuật (p000066), quy chiếu cặp đôi / nhóm nhân vật bằng “họ” (p000052, p000055, p000061, p000063, p000068); và chuyển đại từ ngôi thứ hai phiếm chỉ trong nguồn thành “ta” tự nhiên tại câu 3 p000047 (“nhưng giết cả đống người lại mang về cho ta một tấm huân chương”) và trong câu nói mang tính châm ngôn tại p000057 (“Chiến tranh chỉ vui khi ta đang chiến thắng thôi”) theo đúng quy ước direct-address choice (pending-terms.yml, đồng bộ ch-03-b20 p000425). (2) Hệ xưng hô trong hội thoại quân sự: Thiếu úy Tanya Degurechaff (p000044, p000048, p000051, p000057, p000061, p000064, p000067) tự xưng “tôi” / “Tôi” (và “chúng tôi” khi nói gộp cặp của mình với Hạ sĩ Serebryakov ở p000051), gọi cả trung đội là “mọi người” (p000048 — đồng bộ ch-03-b24 p000025, p000039), gọi hạ sĩ quan đi phối thuộc là “Trung sĩ” / “Trung sĩ Schones” và đại từ “anh” (p000044, p000051, p000064 — đồng bộ ch-03-b22 p000495, ch-03-b24 p000028), và gọi cấp dưới Serebryakov là “Hạ sĩ” (p000064 — đồng bộ ch-03-b22 p000474, p000492); Trung sĩ Schones (p000043, p000049, p000058, p000065) tự xưng “Tôi” / “tôi” kết hợp phản thân “mình” và gọi sĩ quan chỉ huy trực tiếp Tanya bằng cấp bậc “Thiếu úy” (p000043, p000058, p000065 — đồng bộ ch-03-b22 p000496); Hạ sĩ Serebryakov (p000062) khi rụt rè đặt câu hỏi với cấp trên trực tiếp là Tanya thì thưa “thưa Thiếu úy” / “Thiếu úy” kèm tiểu từ kính ngữ “ạ” (đồng bộ ch-03-b17, ch-03-b22 p000494). (3) Bảo toàn trọn vẹn các cấu trúc giả định, điều kiện, phủ định, câu hỏi nội tâm và dấu câu nối đoạn theo đúng canon/style-guide.md: điều kiện giả định ở p000044 và p000045, dấu gạch ngang dài (—) ở p000045 và p000047, phủ định tương lai và giả định đánh giá ở p000047, hai cụm dấu chấm lửng ngập ngừng ở p000051, sắc thái nhượng bộ ở p000052, câu điều kiện phủ định giả định ở câu 2 p000053, dấu chấm lửng mở đầu và độ mở của câu hỏi nội tâm “…Liệu chúng ta có thể thắng không?” ở p000054, câu điều kiện chắc chắn ở câu 2 cùng phủ định kép “không phải là bất khả thi” ở câu 3 và mệnh đề nhượng bộ - phủ định ở câu 4 p000055, câu hỏi nội tâm ở p000056, dấu chấm lửng mở đầu và điều kiện giả định ở p000059, phủ định khả năng ở câu 1 cùng cặp dấu gạch ngang dài (—) chêm ý phủ định ý muốn và mệnh đề nhượng bộ - phủ định sự chắc chắn ở câu 3 p000060, câu điều kiện phủ định ở câu 4 và câu hỏi tu từ ở câu 6 p000061, cấu trúc câu văn bị ngắt bởi lời thoại nối qua dấu gạch ngang dài (—) từ cuối p000061 sang đầu p000063, câu hỏi phủ định ở p000062, và câu hỏi tu từ ở câu 3 p000068. (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*muốn*` ở đúng 1 đoạn duy nhất có thẻ `<html:em>` trong `xhtml` nguồn là p000068 (`Có ai lại thực sự *muốn* vác súng trường ra trận cơ chứ?`), giữ toàn bộ phần còn lại của đoạn và 25/26 đoạn còn lại không có dấu `*` theo đúng DEC-P01-002.'
  alternatives_vi:
  - khi người ta đang chiến thắng thôi (thay cho “khi ta đang chiến thắng thôi” tại p000057 — ưu tiên “khi ta đang chiến thắng thôi” vì nhịp câu gọn, dứt khoát và đồng bộ với cách dịch đại từ phiếm chỉ bằng “ta” ở p000047 và ch-03-b20 p000425)
