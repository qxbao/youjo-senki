  - thời gian làm việc linh hoạt và quyền hành động tùy nghi có giới hạn (thay cho “chế độ giờ giấc linh hoạt” và “quyền tự quyết hành động trong phạm vi giới hạn” tại p000045 — ưu tiên “chế độ giờ giấc linh hoạt” vì tự nhiên với lăng kính nhân sự công ty của Tanya và “quyền tự quyết hành động trong phạm vi giới hạn” đồng bộ với “quyền tự quyết” ở ch-01-b16 p000004, p000011) / học thuyết kinh tế (thay cho “lý thuyết kinh tế” tại p000047) / sảnh bia (thay cho “quán bia” tại p000048 — ưu tiên “quán bia” đồng bộ với ch-04-b15 p000112) / tuyến sau (thay cho “hậu phương” tại p000050, p000053 — ưu tiên “hậu phương” đồng bộ với ch-01-b03 p000060, ch-02-b01 p000021, ch-03-b03 p000054) / các nhà quản lý tập đoàn (thay cho “giới quản lý doanh nghiệp” tại p000050) / khu điều trị tâm thần (thay cho “khoa tâm thần” tại p000053) / Chiến đấu trên hai mặt trận (thay cho “Tác chiến trên hai mặt trận” tại p000055) / độ cao tác chiến (thay cho “độ cao chiến đấu” tại p000068 — ưu tiên “độ cao chiến đấu” đồng bộ với ch-03-b04 p000082)
