  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 26 đoạn của ch-03-b25: giữ đại từ tự quy chiếu nội tâm “mình” / “Mình” và đại từ ngôi thứ ba “nó” kết hợp tên riêng “Tanya” trong trần thuật (tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” cho Tanya), giữ hệ xưng hô điều lệnh chuẩn xác giữa Thiếu úy Tanya Degurechaff, Trung sĩ Schones và Hạ sĩ Serebryakov, xử lý đại từ ngôi thứ hai phiếm chỉ tại p000047 và p000057 bằng “ta” theo direct-address choice, bảo toàn đầy đủ các câu hỏi nội tâm, cấu trúc giả định/điều kiện/phủ định, dấu gạch ngang dài nối đoạn p000061–p000063 và chính xác 1 vị trí nhấn mạnh `*muốn*` tại p000068."
