  volume: vol-01
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, danh hiệu và thuật ngữ quân sự – kinh tế đã khóa tạm từ Chương 1–2, ch-03-b01 → ch-03-b24 và Chương 4–5: “Thiếu úy” / “thưa Thiếu úy” (b02-second-lieutenant, ch-03-b22 p000494, p000496: p000043, p000058, p000062, p000065), “át chủ bài” (ch-02-b02 p000034, ch-03-b11 p000224, ch-03-b17 p000351: p000043, p000045) và “Ace of Aces” (ch-04-b03 p000042, ch-05-b06 p000121: p000045), “Trung sĩ” / “Trung sĩ Schones” / “Schones” (ch-03-b22 p000482, p000495, ch-03-b24 p000027, p000028: p000044, p000049, p000051, p000064, p000066), “Hạ sĩ Serebryakov” / “Hạ sĩ” (ch-03-b17, ch-03-b20–b22, ch-03-b24 p000042: p000049, p000063, p000064), “Schwarkopf” (ch-03-b12 p000241, ch-03-b21, ch-03-b22: p000052), “Type 95” (ch-02-b04, ch-03-b02, ch-03-b22 p000464: p000046, p000060) và “lời nguyền” (ch-02-b11 p000288, ch-04-b09 p000209: p000060), “bắn tỉa” (ch-03-b07, ch-03-b21 p000439: p000046), “quán bia” (ch-04-b15 p000112: p000048), “hậu phương” (ch-01-b03 p000060, ch-02-b01 p000021, ch-03-b03 p000054: p000050, p000053), “tiểu đội” (ch-03-b22 p000482: p000052), “pháp sư” (p000052) và “Đế quốc” (p000052, p000055), “nước Đức” (ch-04-b13 p000037, ch-04-b14 p000078: p000055) và “chiến tranh thế giới” (ch-04-b16 p000121, ch-05-b04 p000079: p000056), “phòng tuyến” (ch-03-b15 p000304, ch-03-b24 p000033: p000058), “hợp đồng” (b07-contract, ch-03-b20 p000430: p000061) và “ý chí tự do” (ch-01-b13 p000222, ch-03-b20 p000426: p000061), “hạ sĩ quan” (ch-01-b17 p000017, ch-03-b10 p000192, ch-03-b12 p000241, ch-04-b07 p000167: p000066), “độ cao chiến đấu” (ch-03-b04 p000082: p000068) và “súng trường” (ch-01-b01 p000002, ch-03-b19 p000401, ch-05-b06 p000112: p000068); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “chế độ giờ giấc linh hoạt” và “quyền tự quyết hành động trong phạm vi giới hạn” (p000045), “tội ác chiến tranh” và “lý thuyết kinh tế” (p000047), “giới quản lý doanh nghiệp” và “vốn xã hội” (p000050 — song hành với “vốn con người” ở P03-human-capital), “khoa tâm thần” (p000053), cùng “cỗ máy chiến tranh” và “Tác chiến trên hai mặt trận” (p000055)."
