- id: ch05-b02-general-staff-conference-pronouns-peer-address-conditionals-and-single-emphasis
  source_term: general_staff_conference_pronouns_peer_address_conditionals_and_single_emphasis_ch05_b02
  proposed_vi: 'tiếp nối trực tiếp ch-05-b01 (p000001–p000019) tại Phòng Hội nghị Số 1 thuộc Văn phòng Bộ Tổng Tham mưu, toàn bộ 22 đoạn của lô ch-05-b02 (chapter011.xhtml/p000020–p000041) diễn ra dưới góc nhìn trần thuật ngôi thứ ba khách quan xoay quanh cuộc thảo luận chiến lược giữa Chuẩn tướng von Zettour, Chuẩn tướng von Rudersdorf và các tướng lĩnh Bộ Tổng Tham mưu (Tanya không xuất hiện trong cảnh), tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác), DEC-P01-002 và style-guide.md: (1) Trong trần thuật ngôi thứ ba khách quan (p000020, p000022, p000023, p000027, p000029, p000030, p000032, p000034, p000036, p000038), quy chiếu tập thể Cục Quân vụ, Bộ Tổng Tham mưu và phía Đế quốc nhất quán bằng đại từ số nhiều trung tính “Họ” / “họ” kết hợp phản thân “mình” (p000020, p000022, p000030, p000034, p000038 — đồng bộ ch-01-b19/b20 và ch-05-b01), quy chiếu kẻ địch bằng “chúng” ở câu 2 p000022, và lưu ý từ “nó” duy nhất ở câu 2 p000036 (“nhưng nó đã phình ra quá lớn”) chỉ quy chiếu danh từ bất động vật là tổ chức “Đại Quân”; tại câu 2 p000022 và câu 4 p000032 có đại từ ngôi thứ hai phiếm chỉ trong nguồn, lược bỏ đại từ ngôi thứ hai phiếm chỉ theo đúng quy ước direct-address choice (pending-terms.yml). (2) Trong hội thoại thảo luận tại cuộc họp Bộ Tổng Tham mưu (p000021, p000024–p000026, p000028, p000031, p000033, p000035, p000037, p000039–p000041), người phát biểu tự xưng “Tôi” / “tôi” (p000021, p000026, p000033, p000041), dùng nhất quán đại từ ngôi thứ nhất số nhiều gộp “chúng ta” / “Chúng ta” / “ta” cho tập thể Bộ Tổng Tham mưu và Quân đội Đế quốc (p000021, p000024, p000026, p000028, p000033, p000039), và quy chiếu quân đội ở phía tây bằng “họ” tại p000041; trong đối đáp trực tiếp giữa hai vị chuẩn tướng ngang cấp tại p000025–p000026, Zettour gọi Rudersdorf bằng danh xưng “Tướng von Rudersdorf” (đồng bộ hoàn toàn với ch-01-b19 p000042) và Rudersdorf gọi Zettour lịch sự, chuẩn mực là “ông” (p000026). (3) Bảo toàn nguyên vẹn câu hỏi tu từ nội tâm tập thể mở đầu p000020, câu hỏi giả định mở đầu p000028 và câu hỏi xin ý kiến cuối p000031, dấu chấm lửng ngập ngừng ở p000021, phép ẩn dụ xây dựng chỗ trú ẩn phòng giông bão ở p000024 và hoán đổi tiền đạo với hậu vệ giữa trận bóng đá ở p000032, cùng chính xác thời gian, phủ định và mức độ chắc chắn của các cấu trúc giả định và điều kiện (phủ định khả thi ở p000020; giả định hệ quả trong kịch bản tồi tệ nhất ở p000026; điều kiện giả định trái thực tế ở câu 3 p000027; phủ định ngoại trừ “chẳng còn lựa chọn nào khác ngoài việc” ở p000028; nhượng bộ ở câu 1 và điều kiện giả định trái thực tế ở quá khứ tại câu 2 p000029; phủ định bộ phận “không hẳn là sai lầm” ở p000030; giả định kết quả ở câu 4 p000032; điều kiện bảo lưu “Tất nhiên là còn tùy thuộc vào quy mô” ở p000035; đặc biệt tại câu 3 p000036 bảo toàn chuẩn xác sự phân tách thời gian giữa vế kết quả trái thực tế ở quá khứ “vùng công nghiệp miền tây hẳn đã bị đánh chiếm” và vế kết quả giả định đang tiếp diễn ở hiện tại “và Đế quốc giờ đây hẳn đang phải soạn thảo các điều khoản cho cuộc đàm phán hòa bình” theo đúng style-guide.md; phủ định ở p000038, p000040). (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` cho đúng câu đầu tiên của đoạn p000027 (`*Giành ưu thế cục bộ và sử dụng các đạo quân khu vực để câu giờ cho đến khi đạt được chiến thắng chung cuộc.*`) tương ứng với thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô, giữ hai câu sau của p000027 và toàn bộ 21/22 đoạn còn lại hoàn toàn không có dấu `*` theo đúng DEC-P01-002'
  alternatives_vi:
  - ngài (thay cho đại từ ngôi thứ hai “ông” trong lời Chuẩn tướng von Rudersdorf nói với Chuẩn tướng von Zettour tại p000026 — ưu tiên “ông” vì hai người là chuẩn tướng đồng cấp trong Bộ Tổng Tham mưu đang trao đổi công việc trực tiếp, giữ sắc thái trang trọng, ngang hàng và tự nhiên)
