  rationale: "Kế thừa đồng bộ hệ thống danh xưng và thuật ngữ quân sự – chiến lược từ Chương 1–4 và ch-05-b01: “chiến tranh hai mặt trận” (b19-plan-315-and-interior-lines-strategy-terms / ch-01-b19 p000041, p000043, ch-05-b01 p000018, p000020, p000024), “Đại Quân” (ch-01-b03 p000040, ch-03-b13 p000265, ch-04-b18 p000157, ch-05-b01 p000007–p000009, p000012, p000016, p000020, p000029, p000036), “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms / ch-05-b01 p000011, p000012, p000022), “chiến lược nội tuyến” (vol02-ch02-b05-interior-lines / ch-01-b19 p000043, ch-05-b01 p000019, p000022, p000029), “Rudersdorf” / “Tướng von Rudersdorf” (ch-01-b19 p000033, p000042, ch-04-b18 p000148, p000150, ch-05-b01 p000017, p000023, p000025), “Zettour” (ch-01-b19 p000034, ch-05-b01 p000003, p000011, p000017, p000019, p000030, p000034, p000038), “Cục Tác chiến” (ch04-b17-zettour-world-war-shock-and-lergen-operations-division-promotion-terms / ch-04-b17 p000144, p000146, ch-04-b18 p000150, p000165, ch-05-b01 p000015, p000023, p000024, p000035, p000036), “Cục Quân vụ” và chức danh “phó cục trưởng” (ch04-b11-war-college-library-zettour-service-corps-and-white-silver-terms / ch-04-b11 p000233–p000234, ch-04-b16 p000102, ch-05-b01 p000003, p000014, p000018, p000019, p000030, p000034, p000036, p000037), “tập trung binh lực” (ch-03-b02 p000032, p000023), “tình thế địa chính trị của Đế quốc” / “bị bao vây tứ phía” / “sự tất yếu đơn thuần về mặt địa chính trị” (ch-01-b19 p000040, p000041, p000043, ch-01-b20 p000053, p000058, p000025, p000027), “phòng tuyến” / “giữ vững phòng tuyến” (ch-05-b01 p000005, p000008, p000026, p000029) và “thiếu hụt quân số” (ch-03-b12 p000244, p000026), “Quân đội Cộng hòa” (ch-03-b17 p000367, ch-03-b18 p000381, p000029), “quân khu” (P01-northern-military-district / ch-01-b01 p000006, p000031, p000032), “tái tổ chức” (ch-05-b01 p000008, p000009, p000032, p000039) và “thời bình” (ch-04-b20 p000203, p000032), “lực lượng phản ứng nhanh” / “khả năng phản ứng nhanh” (ch-05-b01 p000014, p000017, p000033, p000034, p000036), “đạo quân phía tây” (ch-05-b01 p000005, p000036), “lực lượng dự bị” (ch-03-b13 p000263, ch-03-b18 p000371, p000037), “Central” (b05-central-command / ch-05-b01 p000013, p000037, p000041), “Cụm tập đoàn quân phương Tây” (vol02-ch02-b12-western-army-group / ch-05-b01 p000008, p000037), “huân chương” (ch-01-b19 p000031, ch-03-b12 p000254, p000040) và “học viện chiến tranh” (ch-04-b01 p000002, p000005, ch-04-b11 p000220, p000041); khóa tạm “các học thuyết quân sự”, “các bộ tư lệnh khu vực” / “các bộ tư lệnh” và “các hoạt động cơ động tiến công” (p000020, p000032), “mặt trận thứ hai” (p000021), “quy tắc bất di bất dịch cấm phân tán binh lực” và “nguyên tắc vàng” (p000022), “đòn tấn công trực diện tổng lực” (p000023), “ưu thế cục bộ”, “các đạo quân khu vực”, “chiến thắng chung cuộc” và “chính thể” (p000027, p000028, p000039, p000041), “mạng lưới nội tuyến” (p000028), “lực lượng các khu vực” và “vùng công nghiệp miền tây” (p000029, p000036), “tái cơ cấu các quân khu trên quy mô lớn” (p000031), “tiền đạo” và “hậu vệ” (p000032), “khả năng cơ động chuyển đổi giữa các chiến trường” và “quy mô cỡ một đạo quân” (p000033, p000034), “các điều khoản cho cuộc đàm phán hòa bình” (p000036), “Cụm tập đoàn quân Trung tâm” (tách rõ thành hai phiên hiệu đầy đủ “Cụm tập đoàn quân phương Tây và Cụm tập đoàn quân Trung tâm” ở p000037), “lực lượng dự bị thường trực” (p000038), và “các suất đề cử tuyển sinh vào học viện chiến tranh theo thành tích” (p000041)."
