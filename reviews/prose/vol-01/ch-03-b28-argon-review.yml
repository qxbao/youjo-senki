  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, danh hiệu và vũ khí trang bị đã khóa tạm từ Chương 1–2, ch-03-b01 → ch-03-b27 và các chương/tập sau: “Degurechaff” (p000133) và “Tanya” (p000137); biệt danh “Ác quỷ sông Rhine” (ch-03-b27 p000128, vol02-ch02-b11-devil-of-rhine, vol02-ch05-b09-devil-rhine: p000135); “ý chí chiến đấu” (ch-03-b04 p000059, ch-03-b15 p000308: p000137); “Các động tác cơ động” (ch-03-b07 p000124: p000138) và “các động tác cơ động né tránh” (ch-03-b26 p000085: p000142, p000146); “Bắn tỉa chính xác” (ch-03-b27 p000129: p000138); “thuật thức” (P01-formulas: p000139, p000141, p000143, p000146); “Elinium Type 95” (vol02-ch05-b12-elinium-type-95, ch-02-b17 p000250, vol04-ch05-b01: p000139, p000142) và “các lõi” (ch-03-b09 p000162: p000142); “tín hiệu ma lực” và “thư viện dữ liệu” (ch-03-b27 p000124, vol02-ch02-b12 p000308: p000141, p000151); “giao chiến” (ch-03-b26 p000100, ch-03-b27 p000132: p000141); “ánh sáng ma lực” (ch-03-b22 p000498, ch-03-b26 p000071, p000098: p000142); “sóng xung kích” (ch-02-b04 p000071, ch-03-b06 p000090: p000143); thán từ mở đầu “Ừm” (b07-narrator-filler: p000144); “đơn vị sơn cước” (đồng bộ với “các trung đoàn sơn cước” ở ch-03-b27 p000109: p000145); “tám nghìn feet” và “thích nghi với độ cao” (ch-02-b03 p000052, ch-03-b26 p000099, p000100: p000145); “mồi nhử quang học” (ch-03-b26 p000085: p000145); “đạn ma pháp” (ch-02-b04 p000072: p000146); “hỏa lực bắn có kỷ luật” (B15-T11: p000146) và “kỷ luật hỏa lực” (ch03-b07-named-killer-fire-discipline-magic-sword-and-rtb-radio-terms, ch-03-b07 p000117: p000151); “lợi thế về quân số” / “ưu thế về quân số” (ch-03-b06 p000083, ch-03-b27 p000132: p000148, p000150); “pháp sư Đế quốc” / “Đế quốc” và “Cộng hòa” (p000149, p000150); giữ nguyên “Named” (ch-03-b07, ch-03-b27 p000125, p000127: p000150, p000152); “CP”, “đây là tình huống khẩn cấp” và “CP nghe rõ” (vol02-ch04-b08-cp, ch-03-b05 p000069–p000070, ch-03-b07 p000126: p000152, p000153); “quân tiếp viện” (ch-03-b23 p000015, ch-03-b27 p000124: p000153, p000156); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “các thuật thức hệ nổ”, “các thuật thức dẫn đường nhắm mục tiêu theo không gian”, “vận tốc tương đối”, “mạng lưới liên kết thần kinh”, “nồng độ ion” và “vỏ não vận động bậc cao” (p000139), giữ nguyên thán từ tiếng Đức ““Nicht!”” (p000140), “tín hiệu ma lực ngắm bắn giai đoạn đầu”, “đạn dẫn đường vô hình” và “đòn nổ thi triển theo không gian” (p000141), “kênh liên lạc mở” (p000148), “Bắn ma pháp theo loạt” (p000149), “các giảng viên tác chiến” (p000151), “xã hội của những sinh vật quân sự” (p000155 — đồng bộ “sinh vật xã hội” ở ch-04-b08 p000171), cùng “Đạo quân Quan Đông”, “người yêu nước” / “Những người yêu nước chân chính” và “Lòng yêu nước” (p000157–p000158)."
