- id: ch03-b28-tanya-pov-return-hybrid-narration-pronouns-radio-dialogue-and-five-emphases
  source_term: tanya_pov_return_hybrid_narration_pronouns_radio_dialogue_and_five_emphases_ch03_b28
  proposed_vi: 'Toàn bộ 26 đoạn của lô ch-03-b28 (chapter007b.xhtml/p000133–p000158) mở đầu bằng ngắt cảnh (`class="space-break1"` tại p000133) chuyển từ điểm nhìn tự sự ngôi thứ nhất của viên sĩ quan pháp sư Cộng hòa ở ch-03-b27 (p000103–p000132) về lại điểm nhìn của Tanya, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Bảo toàn chính xác cấu trúc đan xen giữa trần thuật ngôi thứ ba bám sát điểm nhìn và độc thoại nội tâm ngôi thứ nhất của Tanya theo đúng DEC-P01-001: trong các câu trần thuật ngôi thứ ba về Tanya (p000133, p000134, p000137, câu 3 p000139, câu 4–5 p000142, câu 1 p000150), giữ họ/tên riêng “Degurechaff” (p000133), “Tanya” (p000137) và đại từ ngôi thứ ba “Nó” / “nó” kết hợp phản thân “mình” (p000133, p000134, p000137, p000139, p000142, p000150 — tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” cho Tanya trong lời kể hay độc thoại nội tâm; lưu ý từ “nó” ở câu 1 p000158 chỉ quy chiếu danh từ trừu tượng “tình yêu Tổ quốc”); trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000138, p000141, câu 1–3 p000142, p000145, p000146, p000148, câu 2 p000150, p000151, p000155, p000157), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp phản thân “bản thân”, và dùng đại từ ngôi thứ nhất số nhiều “chúng tôi” khi chỉ tập thể các pháp sư Đế quốc tại câu 2 p000150 (“những Named mà chúng tôi luôn được cảnh báo”); đặc biệt bảo toàn chính xác sự chuyển đổi điểm nhìn ngay trong cùng một đoạn của nguyên bản tại p000142 (câu 1–3 dùng “mình” / “Mình”, câu 4–5 chuyển sang “nó”) và p000150 (câu 1 dùng “nó”, câu 2 chuyển sang “chúng tôi”). (2) Quy chiếu các chủ thể khác và xử lý đại từ ngôi thứ hai phiếm chỉ: quy chiếu đại đội pháp sư Cộng hòa, các pháp sư Đế quốc, sở chỉ huy và Đạo quân Quan Đông ở ngôi thứ ba số nhiều bằng “bọn chúng” / “Chúng” (p000134, p000148, p000157), “đối phương” / “kẻ địch” / “Đám người này” (p000137, p000138, p000141, p000145, p000148, p000150, p000151), và “họ” (p000145, p000146, p000149, p000150, p000151, p000155, p000157); đồng thời xử lý đại từ ngôi thứ hai phiếm chỉ trong các câu nhận định khái quát ở p000155 và p000158 theo đúng quy ước direct-address choice (work/run-state/pending-terms.yml): dùng chủ ngữ khái quát “người ta” ở câu 2 p000155 (“giúp người ta được tán dương”) và câu 2 p000158 (“Để thăng tiến, người ta phải làm cả hai.”), và chuyển câu 3 p000155 sang kết cấu khái quát không đại từ (“Khi ở trong một tập thể điên rồ trọng kẻ liều mạng hơn người thận trọng, làm kẻ tỉnh táo đúng là khổ sở thật.”). (3) Hệ xưng hô trong hội thoại và liên lạc vô tuyến: pháp sư Cộng hòa trên kênh vô tuyến mở gọi Tanya bằng biệt danh “Ác quỷ sông Rhine”, xưng hô đối địch “bọn ta – ngươi” (p000135) và thốt lên gọi đối phương là “một con quái vật” (p000147); Thiếu úy Tanya Degurechaff tự xưng “Tôi” / “tôi”, dùng “chúng ta” khi đáp lại kẻ địch (p000136) và gọi sở chỉ huy bằng định danh “CP” (p000152, p000156); sĩ quan trực đài CP đáp “CP nghe rõ”, tự xưng “Tôi” và gọi Thiếu úy Tanya là “cô” trong hội thoại vô tuyến (p000153). (4) Bảo toàn trọn vẹn các cấu trúc phủ định, câu hỏi nội tâm, giả định/khả thể và điều kiện theo đúng canon/style-guide.md: phủ định mong đợi và giả định ở p000133–p000134, bảo toàn nguyên vẹn đối tượng và độ mở của câu hỏi nội tâm ở câu 1 p000145 (“Mình nghĩ có lẽ đó là một đơn vị sơn cước, nhưng chẳng lẽ họ có thể vọt thẳng lên độ cao tám nghìn feet mà không cần thích nghi với độ cao sao?”) kèm câu điều kiện ở câu 4, câu hỏi cảm thán ở p000146, dấu gạch ngang dài (—) và suy đoán tất yếu ở p000150, khả thể nhẹ ở câu 1 p000155 (“Có lẽ mình nên lấy làm mừng vì họ đã không bảo mình đi chết đi”), cùng khả thể hệ quả ở câu 2 (“có thể ảnh hưởng bất lợi đến việc đánh giá thành tích của mình”), câu hỏi gián tiếp nội tâm ở câu 3, câu điều kiện ở câu 4 và phủ định tuyệt đối ở câu 5 p000157. (5) Bảo toàn chính xác 5 cụm nhấn mạnh Markdown `*...*` tại đúng 3 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: 2 cụm thông báo trạng thái tại p000139 (`*Đã khóa mục tiêu. Đã hiệu chỉnh theo vận tốc tương đối.*` và `*Tái thiết lập mạng lưới liên kết thần kinh, nồng độ ion bình thường, thông số vỏ não vận động bậc cao đã cập nhật. Toàn bộ hệ thống hoạt động tốt.*`, giữ câu 1 và câu 3 nằm ngoài dấu `*`), toàn bộ đoạn p000140 (`*“Nicht!”*`), và 2 cụm tách biệt tại p000141 (`*Phát hiện nhiều tín hiệu ma lực ngắm bắn giai đoạn đầu rất mờ nhạt. Các loại thuật thức bao gồm đạn dẫn đường vô hình và đòn nổ thi triển theo không gian.* *Kẻ địch đã ở đủ gần để giao chiến, vậy mà mình lại bị phân tâm bởi mấy lời tán nhảm vô nghĩa nên không hề nhận ra!*`), tuyệt đối không dùng dấu `*` ở 23/26 đoạn còn lại.'
  alternatives_vi:
  - Khi người ta ở trong một tập thể điên rồ trọng kẻ liều mạng hơn người thận trọng, làm kẻ tỉnh táo đúng là khổ sở thật (thay cho kết cấu khái quát không đại từ tại câu 3 p000155 — ưu tiên kết cấu khái quát không đại từ để tránh lặp “người ta” với ngay câu 2 p000155 và tuân thủ quy ước direct-address choice)
