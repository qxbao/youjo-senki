- id: ch03-b28-type95-parallel-casting-republican-named-volley-fire-and-kwantung-patriotism-terms
  source_term: type95_parallel_casting_republican_named_volley_fire_and_kwantung_patriotism_terms_ch03_b28
  proposed_vi: 'Degurechaff / đơn vị địch / đếm cua trong lỗ / Ác quỷ sông Rhine / Tanya / ý chí chiến đấu / tính toán chiến thuật / Các động tác cơ động / Bắn tỉa chính xác / các thuật thức hệ nổ / các thuật thức dẫn đường nhắm mục tiêu theo không gian / vận tốc tương đối / Elinium Type 95 / mạng lưới liên kết thần kinh / nồng độ ion / vỏ não vận động bậc cao / “Nicht!” / tín hiệu ma lực ngắm bắn giai đoạn đầu / đạn dẫn đường vô hình / đòn nổ thi triển theo không gian / giao chiến / các lõi của Elinium Type 95 / mất cân bằng hệ thống / các động tác cơ động né tránh / ánh sáng ma lực / sóng xung kích / luồng nhiễu động dữ dội / Ừm / đơn vị sơn cước / tám nghìn feet / thích nghi với độ cao / tầm bắn / mồi nhử quang học / ảo ảnh / đạn ma pháp / hỏa lực bắn có kỷ luật / kênh liên lạc mở / lợi thế về quân số / Bắn ma pháp theo loạt / pháp sư Đế quốc / kỹ năng cá nhân / Đế quốc / Cộng hòa / ưu thế về quân số / đội hình / Named / tín hiệu ma lực / thư viện dữ liệu / các giảng viên tác chiến / kỷ luật hỏa lực / CP / tình huống khẩn cấp / đại đội địch / CP nghe rõ / quân tiếp viện / xã hội của những sinh vật quân sự / sự thăng tiến / chiến trường / đánh giá thành tích / Đạo quân Quan Đông / người yêu nước / Những người yêu nước chân chính / tình yêu Tổ quốc / Lòng yêu nước'
  alternatives_vi:
  - 'mừng hụt quá sớm (thay cho “đếm cua trong lỗ” tại p000134 — ưu tiên thành ngữ tương đương “đếm cua trong lỗ” tự nhiên trong tiếng Việt) / các loại thuật thức nổ (thay cho “các thuật thức hệ nổ” tại p000139, p000143) / các thuật thức dẫn đường định vị không gian (thay cho “các thuật thức dẫn đường nhắm mục tiêu theo không gian” tại p000139) / vỏ não siêu vận động (thay cho “vỏ não vận động bậc cao” tại p000139) / đạn dẫn đường tàng hình và vụ nổ kích hoạt trong không gian (thay cho “đạn dẫn đường vô hình” và “đòn nổ thi triển theo không gian” tại p000141) / đơn vị cao nguyên hoặc đơn vị vùng cao (thay cho “đơn vị sơn cước” tại p000145 — ưu tiên “đơn vị sơn cước” để đồng bộ trực tiếp với “các trung đoàn sơn cước” ở ch-03-b27 p000109) / tám nghìn bộ (thay cho “tám nghìn feet” tại p000145 — ưu tiên giữ đơn vị “feet” đồng bộ xuyên suốt Chương 1–3) / hỏa lực có kiểm soát (thay cho “hỏa lực bắn có kỷ luật” tại p000146 — ưu tiên “hỏa lực bắn có kỷ luật” theo B15-T11 và khớp trực tiếp với “kỷ luật hỏa lực” ở p000151) / kênh tần số mở hoặc kênh vô tuyến mở (thay cho “kênh liên lạc mở” tại p000148) / Khai hỏa ma pháp đồng loạt (thay cho “Bắn ma pháp theo loạt” tại p000149 — ưu tiên “Bắn ma pháp theo loạt” để đồng bộ với “bắn loạt” ở vol02-ch04-b19 p000232) / dấu hiệu ma lực và thư viện (thay cho “tín hiệu ma lực” và “thư viện dữ liệu” tại p000141, p000151 — ưu tiên “tín hiệu ma lực” và “thư viện dữ liệu” để đồng bộ trực tiếp với ch-03-b27 p000124) / các huấn luyện viên chiến đấu (thay cho “các giảng viên tác chiến” tại p000151 — ưu tiên “các giảng viên tác chiến” đồng bộ với “giảng viên” ở Chương 4–5) / Quân đoàn Quan Đông (thay cho “Đạo quân Quan Đông” tại p000157 — ưu tiên “Đạo quân Quan Đông” vì là tên gọi lịch sử chuẩn trong tiếng Việt chỉ Kwantung Army) / nhà ái quốc và Chủ nghĩa yêu nước (thay cho “người yêu nước” / “Những người yêu nước chân chính” và “Lòng yêu nước” tại p000157–p000158)'
