  proposed_vi: “Pháo binh cày xới, pháp sư bổ xuống, và bộ binh tiến lên.” / lịch sử chiến tranh / Trường Thiếu sinh quân / Thiếu úy Degurechaff / Huy hiệu Xung kích Cánh Bạc / Đại đội trưởng / đợt pháo kích / tàn quân rải rác của lực lượng địch / mệnh lệnh truy kích / “Rõ” / thuật thức bắn tỉa quang học / thuật thức gây nổ / các thuật thức / thi triển thuật thức / Hạ sĩ Viktoriya Ivanovna Serebryakov / Visha / thương vong / trang bị / điểm tập kết / tiền tuyến / phòng tắm vòi sen dành cho nữ giới / Thượng đế / toàn đại đội / Trung úy Schwarkopf / giọng điệu điềm nhiên, đậm chất công vụ / sĩ quan chỉ huy / giọng điệu công vụ lạnh lùng / bức điện khẩn / Đại đội Pháp sư Xung kích số 403 / trận tao ngộ chiến / hai đại đội pháp sư địch đang thọc sâu / đợt tiến công tiếp theo của quân địch / lực lượng tiếp viện / quân tiếp viện / Pháo binh / quan sát viên / các pháp sư yểm trợ trực tiếp / đánh giá chính xác điểm chạm của đạn pháo / các sĩ quan cấp trên / hội quân / Đại đội 403 / ý chí chiến đấu / yêu cầu chi viện / ngoài Bắc / các pháp sư địch / người lính kỳ cựu / đôi mắt của pháo binh / kẻ thống trị chiến trường
  alternatives_vi:
  - Đại đội trưởng gửi toàn thể các thành viên (thay cho “Đại đội trưởng gọi toàn thể đơn vị” tại p000437 — ưu tiên “Đại đội trưởng gọi toàn thể đơn vị” vì ngắn gọn, chuẩn khẩu lệnh vô tuyến quân sự) / thuật thức bắn tỉa hệ quang học (thay cho “thuật thức bắn tỉa quang học” tại p000439 — ưu tiên “thuật thức bắn tỉa quang học” vì kết hợp trực tiếp “quang học” từ ch-02-b02 với “thuật thức bắn tỉa” từ ch-03-b07) / điểm hội quân (thay cho “điểm tập kết” tại p000443 — ưu tiên “điểm tập kết” đồng bộ với “điểm tập kết được chỉ định” ở ch-03-b11 p000231, còn tại p000453 dùng động từ “hội quân” khi cơ động hợp nhất lực lượng với Đại đội 403) / trận chạm trán bất ngờ và hai đại đội pháp sư địch đang đột nhập (thay cho “trận tao ngộ chiến” và “hai đại đội pháp sư địch đang thọc sâu” tại p000448 — ưu tiên “trận tao ngộ chiến” và “đang thọc sâu” vì chuẩn thuật ngữ tác chiến quân sự) / đánh giá chuẩn xác kết quả bắn trúng (thay cho “đánh giá chính xác điểm chạm của đạn pháo” tại p000451 — ưu tiên “đánh giá chính xác điểm chạm của đạn pháo” sát nghĩa nghiệp vụ chỉnh pháo của quan sát viên) / chúa tể chiến trường (thay cho “kẻ thống trị chiến trường” tại p000457)
