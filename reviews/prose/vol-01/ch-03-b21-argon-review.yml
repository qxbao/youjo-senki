  rationale: "Kế thừa đồng bộ hệ thống danh xưng và thuật ngữ đã khóa tạm từ Chương 1–2 và ch-03-b01 → ch-03-b20: “Trường Thiếu sinh quân” (ch-03-b09 p000176, p000182, ch-03-b16 p000325, p000348, ch-03-b17 p000353, p000357), “Thiếu úy Degurechaff” (b02-second-lieutenant, ch-03-b16–b18), “Huy hiệu Xung kích Cánh Bạc” (ch-03-b08–b12, ch-03-b17 p000351), “Đại đội trưởng” (ch-03-b11 p000232, p000234, ch-03-b17 p000349, p000367, p000369) và “sĩ quan chỉ huy” (ch-03-b11 p000237, p000238), “thuật thức” / “thuật thức gây nổ” (P01-formulas, ch-03-b20 p000420), “Hạ sĩ Viktoriya Ivanovna Serebryakov” đối lập với tên gọi thân mật “Visha” (ch-03-b09 p000178, ch-03-b17 p000358, p000361), “điểm tập kết” (ch-03-b11 p000231), “Thượng đế” (review-God, ch-03-b17 p000357, ch-03-b18 p000378–p000388), “toàn đại đội” (ch-03-b19 p000400), “Trung úy Schwarkopf” (ch-03-b16–b20), “giọng điệu điềm nhiên, đậm chất công vụ” / “giọng điệu công vụ lạnh lùng” (P01-matter-of-fact-register, ch-03-b12 p000249, ch-03-b13 p000278), “lực lượng tiếp viện” / “quân tiếp viện” (ch-03-b10 p000188, p000200, ch-03-b20 p000422), “quan sát viên” (chapter1_b01_pending_terms, ch-03-b18 p000380, ch-03-b19 p000393), “các pháp sư yểm trợ trực tiếp” (ch-03-b20 p000417), và “người lính kỳ cựu” (tránh dùng “cựu binh” cho quân nhân đang tại ngũ theo quy ước ch-01-b06, ch-03-b10–b19); khóa tạm câu khẩu quyết “Pháo binh cày xới, pháp sư bổ xuống, và bộ binh tiến lên.” (p000434), “thuật thức bắn tỉa quang học” (p000439), “Đại đội Pháp sư Xung kích số 403” / “Đại đội 403” (đồng bộ cấu trúc với “Đại đội Pháp sư Xung kích số 205” ở ch-03-b11–b19), “trận tao ngộ chiến” và “hai đại đội pháp sư địch đang thọc sâu” (p000448), “đánh giá chính xác điểm chạm của đạn pháo” (p000451), “hội quân” (p000453), cùng “đôi mắt của pháo binh” và “kẻ thống trị chiến trường” (p000457)."
