- id: ch03-b21-visha-first-person-pov-serebryakov-vs-visha-pronouns-dialogue-and-three-emphases
  source_term: visha_first_person_pov_serebryakov_vs_visha_pronouns_dialogue_and_three_emphases_ch03_b21
  proposed_vi: 'mở đầu cảnh mới sau ngắt đoạn (`class="space-break1"`) tại p000434, chuyển từ điểm nhìn của Tanya ở cuối ch-03-b20 (p000433) sang điểm nhìn tự sự ngôi thứ nhất của Hạ sĩ Viktoriya Ivanovna Serebryakov (Visha) tiếp nối trực tiếp ch-03-b16 (p000347–p000348), ch-03-b17 (p000349–p000369) và ch-03-b18 (p000370–p000390), toàn bộ 24 đoạn của lô ch-03-b21 (chapter007.xhtml/p000434–p000457) tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp dụng sang điểm nhìn của Visha), DEC-P01-002 và style-guide.md: (1) Trong mạch tự sự ngôi thứ nhất và suy nghĩ của Visha xuyên suốt lô (p000434–p000436, p000438–p000441, p000443–p000445, p000447, p000449, p000452, p000454), Visha tự xưng nhất quán là “Tôi” / “tôi” kết hợp đại từ phản thân “mình” (p000434, p000439, p000444, p000447), dùng “mình” trong câu tự nhủ thầm trực tiếp ở p000452 (`*A, mình lại phải đánh trận nữa rồi*` — đồng bộ ch-03-b10 p000202) trong khi câu dẫn tự sự ngay sau dùng “tôi”, và dùng đại từ ngôi thứ nhất số nhiều “chúng tôi” / “Chúng tôi” cho cặp bay hoặc toàn đại đội (p000436, p000443, p000445); quy chiếu cấp trên trực tiếp “Thiếu úy Degurechaff” ở ngôi thứ ba nhất quán bằng “cô ấy” (p000435, p000436, p000439, p000440, p000444 — đồng bộ hoàn toàn với ch-03-b16–b18); lưu ý từ “nó” duy nhất xuất hiện ở câu 3 p000449 hoàn toàn chỉ quy chiếu danh từ bất động vật là “Đầu óc tôi”. (2) Trong hội thoại quân sự: Trung úy Schwarkopf (p000437, p000442, p000446, p000448, p000451, p000453, p000455) tự xưng “tôi” (p000446), dùng đại từ gộp “Chúng ta” / “chúng ta” khi nói với đơn vị (p000442, p000448, p000453, p000455), quy chiếu cánh quân tiếp viện của địch bằng “bọn chúng” (p000451), quy chiếu người quan sát viên pháo binh đang bị vây đánh bằng “Anh ta” theo đúng đại từ nam ngôi thứ ba trong nguồn (p000455), và khi hỏi trực tiếp cấp dưới là Thiếu úy Degurechaff thì gọi bằng “cô” + “Thiếu úy Degurechaff” (p000455 — đồng bộ ch-03-b11–b19); Thiếu úy Tanya Degurechaff lẩm bẩm cộc lốc khi đi ngủ (“Đi ngủ đây. Ngủ ngon,” ở p000444), và khi hỏi cùng đáp lại đại đội trưởng Trung úy Schwarkopf thì giữ đúng tác phong điều lệnh cấp dưới thưa cấp trên: câu hỏi có kính ngữ “ạ” (“…Còn quân tiếp viện thì sao ạ?” ở p000450) và câu đáp thưa “Vâng, thưa ngài”, tự xưng “tôi” kèm “ạ” (“Vâng, thưa ngài, và tôi chẳng hề mong lặp lại chuyện đó chút nào đâu ạ.” ở p000456). (3) Xử lý đại từ ngôi thứ hai phiếm chỉ trong nguồn theo đúng quy ước direct-address choice (pending-terms.yml): chuyển thành chủ ngữ khái quát “người ta” ở câu 1 p000444 (“người ta đâu thể trông mong...”), lược đại từ phiếm chỉ ở câu 2 p000454 (“một khi đã buông lỏng nghỉ ngơi thì việc vực dậy lại ý chí chiến đấu đâu có dễ dàng gì”), và kết hợp cấu trúc phản thân/tỉnh lược/khái quát ở cả ba câu của p000457 (“tự vẽ một tấm bia ngắm lên lưng mình”, “nhắc đi nhắc lại rằng”, “số phận của người đó”), không để lọt từ “bạn”. (4) Bảo toàn nguyên vẹn sự đối xứng hai tư cách của Visha ở p000441 (“với tư cách là Hạ sĩ Viktoriya Ivanovna Serebryakov, tôi nên nổ súng, nhưng với tư cách là Visha, tôi chẳng có động cơ nào cả”), cặp dấu gạch ngang dài chêm ý ở p000447, câu hỏi gián tiếp nội tâm ở p000440 và p000444, câu hỏi trực tiếp mở đầu bằng dấu chấm lửng ở p000450, câu hỏi đuôi xác nhận ở cuối p000455, cùng chính xác thời gian và phủ định của các mệnh đề điều kiện/giả định (phủ định sự chắc chắn về thời điểm ở cuối p000434; phủ định triệt để “mà không hề trúng lấy một đòn nào” ở cuối p000435; điều kiện phủ định giả định trái thực tế “nếu hai chúng tôi về cơ bản không thuộc hai vũ trụ khác nhau, thì cô ấy đã chẳng bao giờ giành được...” ở p000436; phép điệp và các phủ định tương lai “sẽ không phải...” ở p000439; hai câu phủ định liên tiếp ở p000442; giả định nhiệm vụ ban đầu “những người đáng lẽ phải đang tấn công lực lượng tiếp viện của địch” ở p000449; nhân quả phủ định khả năng ở p000451; phủ định ở p000456; nhân quả và điều kiện giả định “Nếu làm đôi mắt cho kẻ thống trị chiến trường, số phận của người đó sẽ là...” ở p000457). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 3 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: động từ khẳng định `*có*` tại câu 2 p000444, câu cảm thán mở đầu `*Nguy rồi.*` tại câu 1 p000447, và câu tự nhủ thầm trực tiếp `*A, mình lại phải đánh trận nữa rồi*` tại vế đầu câu 2 p000452 (giữ phần câu dẫn “, tôi thở dài khi lĩnh hội được tình hình.” nằm ngoài dấu `*`), tuyệt đối không dùng dấu `*` ở 21/24 đoạn còn lại'
  alternatives_vi:
  - '*Thôi chết rồi.* (thay cho `*Nguy rồi.*` tại câu 1 p000447 — ưu tiên `*Nguy rồi.*` vì tự nhiên, gọn và sát sắc thái giật mình căng thẳng khi nghe cấp trên báo tin xấu) / “…Còn quân tiếp viện thì sao?” (không có tiểu từ “ạ” tại p000450 — ưu tiên có “ạ” vì căn cứ p000452 đây là câu hỏi của cấp dưới hỏi đại đội trưởng Trung úy Schwarkopf, đồng bộ với lời đáp lễ phép của Tanya ở p000456) / *A, tôi lại phải đánh trận nữa rồi* (thay cho `*A, mình lại phải đánh trận nữa rồi*` tại câu 2 p000452 — ưu tiên dùng “mình” trong câu tự nhủ thầm trực tiếp bọc trong `<html:em>` của Visha đồng bộ với ch-03-b10 p000202, còn câu dẫn tự sự bên ngoài dùng “tôi”)'
