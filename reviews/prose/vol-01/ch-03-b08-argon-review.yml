- id: ch03-b08-review-board-objective-pov-pronouns-conditionals-and-emphasis
  source_term: Objective third-person narration at the Imperial Army Technology Research Lab Board of Review after pagebreak across p000127–p000153, third-person references to Second Lieutenant Tanya Degurechaff in narration (p000133, p000135) and dialogue (p000134), collective references to engineers/tech department vs Operations/General Staff officers and pronoun disambiguation in p000141, generic second-person subject in p000145, conference dialogue pronouns across p000138/p000143–p000144/p000147/p000149/p000153, conditionals and past counterfactuals across p000128/p000133/p000139/p000149/p000152, and exact preservation of 2 italicized spans across p000145 and p000152
  proposed_vi: sau dấu ngắt trang (pagebreak) tại p000127, mạch truyện chuyển từ chiến trường sông Rhine dưới góc nhìn của Trung úy Michel Hosman (ch-03-b05–b07) về cuộc họp của Hội đồng Xét duyệt Phòng thí nghiệm Nghiên cứu Công nghệ Quân đội Đế quốc dưới góc nhìn trần thuật ngôi thứ ba khách quan (Tanya không có mặt trực tiếp trong cảnh mà chỉ được nhắc tới qua báo cáo thực chiến), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn khách quan của cuộc họp): quy chiếu Thiếu úy Tanya Degurechaff trong lời kể ngôi thứ ba (p000133, p000135) bằng danh ngữ “Thiếu úy Degurechaff” và đại từ “Cô” / “cô”, đồng thời quy chiếu trong lời thoại tại cuộc họp (p000134) bằng “cô ấy”, đồng bộ hoàn toàn với cảnh họp tại Ban Công nghệ ở ch-02-b08 → ch-02-b12 (p000037–p000041, p000066–p000067, p000090, p000092, p000094–p000095, p000100, p000102, p000105 — lưu ý từ “nó” trong các đoạn p000129, p000132, p000136, p000138, p000139, p000140, p000143, p000145, p000146, p000148, p000150 hoàn toàn chỉ quy chiếu danh từ bất động vật là quả cầu tính toán Type 95, công nghệ đồng bộ hóa hoặc mana, tuyệt đối không quy chiếu nhân vật); quy chiếu tập thể các kỹ sư, nhân sự công nghệ, bộ phận công nghệ và các sĩ quan dự họp bằng đại từ số nhiều “họ” / “Họ” kết hợp phản thân “mình” / “chính mình” (p000129, p000132, p000139, p000141, p000142, p000150, p000152), riêng tại câu 3 p000141 dịch rõ chủ ngữ là “Những người đó” (quy chiếu bên Tác chiến) để phân biệt rạch ròi với đại từ “Họ” (quy chiếu bộ phận công nghệ) ở câu 2 cùng đoạn; quy chiếu các pháp sư địch của Cộng hòa bị bắn hạ/mất tích tại p000131 bằng “tên” / “chúng”; dùng chủ ngữ phiếm chỉ “người ta” cho đại từ ngôi thứ hai khái quát tại câu 3 p000145 theo quy ước direct-address choice; trong lời thoại tại cuộc họp: các sĩ quan dự họp tự xưng “tôi” ở ngôi thứ nhất số ít (p000138, p000147), dùng “chúng ta” / “Chúng ta” ở ngôi thứ nhất số nhiều cho tập thể cuộc họp / phía quân đội Đế quốc (p000143, p000144, p000149), gọi bộ phận công nghệ bằng đại từ ngôi thứ hai số nhiều trang trọng “các vị” khi đặt câu hỏi chất vấn (p000143 — đồng bộ plural-address-p000076 và ch-02-b10–b12), còn đại diện bộ phận công nghệ khi báo cáo về vụ nổ trong phòng thí nghiệm trước phía Tác chiến / Bộ Tổng Tham mưu tại p000153 dùng đại từ ngôi thứ nhất số nhiều “chúng tôi” (đồng bộ ch-02-b12 p000117); bảo toàn đầy đủ cả 3 câu hỏi trực tiếp trong cuộc họp (p000130, p000143, p000151), cấu trúc điều kiện phủ định ở p000128, giả định trái thực tế ở quá khứ tại câu 2 p000133 (`nhưng chỉ riêng điều đó thôi thì đáng lẽ không thể đủ để vượt qua...`), câu điều kiện ở p000139, điều kiện ngoại trừ ở p000149 (`trừ phi chúng ta nói rằng mục tiêu chỉ đơn thuần là để xác minh công nghệ`), câu điều kiện giả định ở câu 2 và khả thể phủ định ở câu 3 p000152, cùng đúng 2 vị trí nhấn mạnh Markdown `*...*` trong 2 đoạn có thẻ `<html:em>` của nguyên tác là p000145 (`*nữa*`) và p000152 (`*duy nhất*`) theo đúng DEC-P01-002 (25/27 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
