  proposed_vi: tiếp nối trực tiếp lô ch-04-b11 (chapter009.xhtml/p000220–p000249), toàn bộ lô ch-04-b12 (chapter009b.xhtml/p000001–p000028) tiếp tục cuộc đối thoại giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour tại thư viện Học viện Chiến tranh Đế quốc dưới điểm nhìn của Tanya, tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya) và DEC-P01-002: trong đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000002), dùng tên riêng “Tanya” và đại từ trần thuật “nó” cho Tanya, đồng thời dùng đại từ trang trọng “ông” cho Chuẩn tướng von Zettour (lưu ý từ “nó” ở câu 3 p000020 và câu 1 p000021 chỉ quy chiếu danh từ bất động vật là cuộc chiến tranh); trong các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000005, p000007, p000008, p000014, p000021, p000025, p000028), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” và quy chiếu Zettour bằng “ông ấy” / “Ông ấy” (p000005, p000007, p000014, p000025, p000028), riêng tại câu 3 p000028 bảo toàn đại từ sở hữu số nhiều “của họ” khi nhắc tới những kẻ thù tiềm tàng khác của phía Đế quốc; trong các câu đúc kết nguyên tắc xử thế công sở / quân ngũ mang tính khái quát ở nội tâm (câu 2–3 p000007, câu 2–3 p000008, p000011, câu 3 p000015, câu 2–3 p000017), lược đại từ ngôi thứ hai phiếm chỉ và dùng phản thân “mình” theo đúng quy ước direct-address choice; trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (p000001, p000003, p000006, p000009, p000010, p000012, p000013, p000016, p000018, p000019, p000022, p000023, p000026, p000027), đồng bộ hoàn toàn với ch-04-b11: Tanya tự xưng “tôi” / “Tôi” (kết hợp phản thân “mình” tại p000010 và đại từ ngôi thứ nhất số nhiều “chúng ta” khi nói về phía Đế quốc tại p000023, p000026), gọi Zettour kính cẩn là “thưa ngài” / “ngài” kèm tiểu từ kính ngữ “ạ” (p000006, p000010, p000013, p000016, p000019, p000023), còn Chuẩn tướng von Zettour tự xưng “Tôi” / “tôi” (và “chúng ta” tại p000027), gọi Tanya lịch sự là “Trung úy” (p000003) và “cô” (p000001, p000003, p000009, p000012, p000022); bảo toàn đầy đủ các câu hỏi trực tiếp của Zettour (p000003, p000009, p000018, p000022), câu hỏi nội tâm của Tanya (p000020), sự đối lập mức độ chắc chắn giữa câu điều kiện giả định của Tanya tại p000026 (`“Nếu chúng ta giao chiến một chọi một với từng quốc gia, chắc chắn chúng ta sẽ giành chiến thắng.”`) với lời tán đồng thu hẹp phạm vi của Zettour tại p000027 (`“Phải. Nếu đối đầu với Cộng hòa, chúng ta có thể thắng.”`) cùng cụm trích dẫn lại trong ngoặc kép `“Nếu đối đầu với Cộng hòa”` tại p000028; bảo toàn tuyệt đối duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tại p000008 (`*và*`) tương ứng với thẻ `<html:em>` trong nguồn theo đúng DEC-P01-002 (27/28 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - người ta (thay cho cách lược chủ ngữ ngôi thứ hai phiếm chỉ trong các câu nguyên tắc khái quát tại p000007, p000008, p000011, p000015, p000017 — ưu tiên lược chủ ngữ kết hợp phản thân “mình” theo quy ước direct-address choice để giữ nhịp độc thoại nội tâm tự nhiên, sắc gọn của Tanya)
