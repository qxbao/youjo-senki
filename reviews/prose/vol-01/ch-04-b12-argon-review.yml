  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và tiếp nối liền mạch ch-04-b11: giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba về Tanya (“Tanya” / “nó”) và độc thoại nội tâm ngôi thứ nhất (“mình”), giữ chuẩn mực xưng hô quân đội lịch sự giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (“tôi – thưa ngài... ạ”, “tôi – Trung úy / cô”, “chúng ta”), bảo toàn chính xác độ tương phản về mức độ chắc chắn trong lập luận chiến lược tại p000026–p000028 và duy nhất 1 vị trí nhấn mạnh tại p000008."
