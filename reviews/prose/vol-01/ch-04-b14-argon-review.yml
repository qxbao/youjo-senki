- id: ch04-b14-tanya-zettour-strategic-debate-pronouns-conditionals-emphasis-and-footnote
  source_term: Tanya third-person narration in p000065 vs first-person interior monologue across p000056/p000059–p000060/p000067/p000071/p000073 and inclusive doctrinal reflection in p000077, generic second-person omission with reflexive “mình” in p000073, third-person references to Brigadier General von Zettour in interior monologue (p000056, p000059, p000067, p000071) and to mages/enemy/Germany across p000067/p000075/p000078, dialogue address and inclusive “chúng ta” between First Lieutenant Tanya Degurechaff and Brigadier General von Zettour across p000057–p000058/p000061–p000066/p000068–p000070/p000072/p000074–p000076, conditionals and negations across p000056–p000058/p000060–p000061/p000063/p000068/p000070–p000072/p000076–p000077, exact preservation of 4 italicized spans across p000065 and p000071, and footnote superscript preservation in p000056
  proposed_vi: tiếp nối trực tiếp lô ch-04-b13 (chapter009b.xhtml/p000029–p000055), toàn bộ lô ch-04-b14 (chapter009b.xhtml/p000056–p000078) tiếp tục cuộc đối thoại chiến lược giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour tại thư viện Học viện Chiến tranh Đế quốc dưới điểm nhìn của Tanya, tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya) và DEC-P01-002: trong câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (câu 2 p000065), quy chiếu Tanya bằng tên riêng “Tanya” và đại từ trần thuật “nó” (lưu ý từ “nó” ở câu 2 p000056 chỉ quy chiếu danh từ bất động vật là ý tưởng); trong các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000056, p000059, p000060, p000067, p000071, p000073), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp phản thân “bản thân”, dùng “chúng ta” / “Chúng ta” cho phía Đế quốc trong mệnh đề tường thuật lại lời nói ở p000071 và đoạn suy luận học thuyết quân sự nối tiếp trực tiếp lời thoại ở p000077, đồng thời quy chiếu Chuẩn tướng von Zettour bằng “ông ấy” (p000056, p000059, p000067, p000071 — đồng bộ ch-04-b11–b13); tại câu 3 p000073, lược đại từ ngôi thứ hai phiếm chỉ và dùng phản thân “mình” theo đúng quy ước direct-address choice; quy chiếu quân địch ở p000067 bằng “chúng”, quy chiếu các pháp sư ở p000075 bằng “họ”, và quy chiếu phía Đức trong Thế chiến thứ nhất ở p000078 bằng “họ” kết hợp phản thân “mình” (tránh dùng từ “nó” gây nhầm lẫn với quy ước đại từ của Tanya); trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (p000057, p000058, p000061–p000066, p000068–p000070, p000072, p000074–p000076), đồng bộ hoàn toàn với ch-04-b11–b13: Tanya tự xưng “tôi” / “Tôi”, dùng “chúng ta” / “Chúng ta” cho phía Đế quốc (p000061, p000063, p000065, p000068, p000070, p000074), gọi Zettour kính cẩn là “thưa Tướng quân” (p000061) và “thưa ngài” (p000063) kèm từ lễ phép “Vâng” và tiểu từ kính ngữ “ạ”, còn Chuẩn tướng von Zettour tự xưng “tôi” (p000075), dùng “chúng ta” / “Chúng ta” (p000064, p000069) và gọi Tanya lịch sự là “cô” / “Cô” (p000058, p000062, p000064, p000066, p000072); bảo toàn đầy đủ các câu hỏi trực tiếp của Zettour (p000058, p000062, p000064, p000066, p000069, p000072), câu hỏi tự chất vấn trong nội tâm Tanya (p000059), câu hỏi nội tâm lặp lại vấn đề (p000067), câu đề xuất dưới dạng câu hỏi thăm dò của Tanya (p000068), cùng các cấu trúc giả định, điều kiện và phủ định theo đúng style-guide.md (giả định hiện tại ở p000056; chuỗi giả định và điều kiện ở p000057; điều kiện phủ định “trừ phi” ở p000060; phủ định kép ở p000061; điều kiện phủ định và nhân quả giả định ở p000063; sự đối lập giữa bất khả khẳng định và khẳng định phủ định ở p000070–p000071; cấu trúc đối lập phủ định – khẳng định ở p000076–p000077); bảo toàn chính xác chỉ số chú thích trên cao `¹⁸` tại p000056 (`Napoleon¹⁸`) và đúng 4 vị trí nhấn mạnh Markdown `*...*` trong 2 đoạn có thẻ `<html:em>` của nguyên tác là p000065 (`*tiến hành*, *triệt để*, *nghiền nát*` — khớp nguyên văn với câu thoại mở đầu đoạn) và p000071 (`*đòn quyết định*` — khớp nguyên văn với câu thoại ở p000070) theo đúng DEC-P01-002 (21/23 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - người ta (thay cho cách lược đại từ ngôi thứ hai phiếm chỉ kết hợp phản thân “mình” tại câu 3 p000073 — cả hai cách đều thuộc quy ước direct-address choice; ưu tiên dùng phản thân “mình” để giữ mạch độc thoại nội tâm liền lạc với câu 4 p000073)
