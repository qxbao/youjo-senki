  volume: vol-01
  chapter: 4
  rationale: "Kế thừa đồng bộ “tiêu hao” (vol-04-ch-02-b18, p000057, p000068), “Cục Quân vụ” và “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms / ch-04-b11 p000233–p000234, p000059 — bảo toàn đúng chi tiết nội tâm ở p000059 gọi Zettour là “Cục trưởng Cục Quân vụ thuộc Bộ Tổng Tham mưu” theo sát văn bản nguồn), “tiền tuyến” (ch-04-b01/b03, p000060), “Tướng quân” (ch-01-b20 p000050 / ch-04-b11 p000224, p000235, p000061), “Đế quốc” và “kế hoạch quốc phòng” (ch-01-b20 p000059 / ch-03-b02 p000037, p000063), “làm địch đổ máu” (vol-02-ch-05-b23, p000065), “quân đoàn dã chiến” (ch-01-b19 p000043 / ch-01-b20 p000045, p000066, p000067), “nguồn nhân lực” (ch-01-b18, p000068), “bộ binh” và “pháp sư” (p000074, p000075), “các hoạt động cơ động tác chiến” (đồng bộ với “cơ động tác chiến” ở vol-04-ch-03-b18, p000077), “Pháp”, “Nga”, “Anh” (ch-04-b13 p000037, p000046, p000078), “cấp độ chiến thuật” (ch-04-b03 p000053, p000078) và “Hoa Kỳ” (vol-04-ch-02-b01 p000007, p000078); khóa tạm “chuyên môn quân sự”, “Napoleon¹⁸” (bảo toàn chỉ số chú thích trên cao ¹⁸ tương ứng với thẻ <html:sup>18</html:sup> trong nguồn), “Hannibal”, “giảng hòa”, “hạn chế tiêu hao”, “ý chí chiến đấu” (xuyên suốt p000058, p000059, p000073), “giáo sư đại học”, “tinh thần chiến đấu” (p000060, p000065), “giải cấu trúc các giả định của mình”, “khả năng tiếp tục chiến đấu” (p000065, p000077), “lập trường cứng rắn”, “phòng ngự trong chiến tranh trận địa”, “đòn quyết định” (p000070, p000071), “sự linh hoạt chiến lược” (đồng bộ cấu trúc với “sự linh hoạt chiến thuật” ở ch-01-b19 p000033), “bộ binh phòng ngự và pháp sư tiến công”, “sức tàn phá và uy lực chấn động”, “đánh chiếm các cứ điểm”, “chiếm đóng”, “tiêu diệt binh lính địch”, “chủ quyền”, “công dân của nước địch”, “chiến tranh tổng lực”, “Thế chiến thứ nhất” và “Bộ Tổng Tham mưu Đức”."
