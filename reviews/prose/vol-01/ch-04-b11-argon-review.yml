- id: ch04-b11-tanya-zettour-library-meeting-pov-dissociation-dialogue-pronouns-and-emphasis
  source_term: Tanya third-person narration and POV-dissociation pronouns vs first-person interior monologue pronouns across p000220–p000249, intra-paragraph and intra-sentence shifts between first-person and third-person in p000227 and p000228, generic second-person omission in p000225, third-person references to Brigadier General von Zettour in narration vs interior monologue, dialogue address between First Lieutenant Tanya Degurechaff and Brigadier General von Zettour across p000224/p000230/p000232–p000233/p000235/p000238–p000239/p000241–p000244/p000246–p000247, and exact preservation of italicized emphasis in p000237
  proposed_vi: tiếp nối trực tiếp lô ch-04-b10 (p000219), toàn bộ lô ch-04-b11 bám sát điểm nhìn của Tanya trong cuộc gặp tình cờ với Chuẩn tướng von Zettour tại thư viện Học viện Chiến tranh Đế quốc, tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya) và DEC-P01-002: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể tự tách góc nhìn nhắc tới cơ thể/danh tính bên ngoài (p000220, p000222, p000225, câu 1 và bổ ngữ “ngoại hình của nó” ở câu 2 p000227, câu 2 p000228, p000229, p000231, p000236, p000240), dùng nhất quán tên riêng “Tanya” và đại từ trần thuật “nó” / “Nó” kết hợp phản thân “bản thân” / “mình” (lưu ý từ “nó” ở cuối p000245 và ở vế hai p000248 chỉ quy chiếu danh từ bất động vật là việc cắt giảm nhân sự và cái biệt danh “Bạch Ngân”); trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất (p000226, chủ ngữ câu 2 p000227, câu 1 p000228, p000234, p000245, p000248, p000249), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình”; đặc biệt bảo toàn chính xác sự tách biệt chủ thể và chuyển đổi ngôi ngay trong cùng đoạn văn và cùng câu văn tại p000227 (câu 1 dùng “nó”; sang câu 2 chủ ngữ ngôi thứ nhất “mình” đánh giá việc tận dụng “ngoại hình của nó”) và p000228 (câu 1 dùng “mình”, câu 2 chuyển sang “nó”), đồng bộ hoàn toàn với ch-04-b07 (p000150) và ch-04-b10 (p000202–p000204, p000209); tại câu 3 p000225, lược đại từ ngôi thứ hai phiếm chỉ trong cấu trúc nhận định khái quát theo đúng quy ước direct-address choice; quy chiếu Chuẩn tướng von Zettour bằng đại từ trang trọng “ông” trong trần thuật ngôi thứ ba (p000223, p000231) và “Ông ấy” / “ông ấy” trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000234, p000245), quy chiếu các nhân vật cấp cao / tập thể Cục Quân vụ / đám giám đốc điều hành / lục quân bằng “họ” (p000223, p000236, p000245, p000248); trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (p000224, p000230, p000232, p000233, p000235, p000238, p000239, p000241–p000244, p000246, p000247), Tanya tự xưng “tôi” / “Tôi”, gọi Zettour kính cẩn là “thưa Tướng quân” (p000224, p000235 — giữ đúng danh xưng cấp tướng chung khi lời thoại dùng General) và “ngài” / “thưa ngài” kèm tiểu từ kính ngữ “ạ” (p000232, p000235, p000239, p000242, p000244, p000247), còn Chuẩn tướng von Zettour tự xưng “tôi” / “Tôi” và gọi Tanya lịch sự là “Trung úy” (p000238) và “cô” (p000230, p000238, p000241, p000246); bảo toàn tuyệt đối duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tại p000237 (`*may mắn*`) tương ứng với thẻ `<html:em>` trong nguồn theo đúng DEC-P01-002 (29/30 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - Rõ, thưa ngài. (thay cho “Vâng, thưa ngài.” tại p000244 — ưu tiên “Vâng, thưa ngài.” vì Zettour vừa bảo Tanya thả lỏng như trò chuyện với một cựu học viên khóa trước thay vì ra mệnh lệnh tác chiến)
