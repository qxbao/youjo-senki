  rationale: "Kế thừa đồng bộ “thư viện” (ch-04-b09/b10), “trung úy” / “Trung úy” (b06-first-lieutenant / ch-04-b04/b07/b08/b10), “học viện chiến tranh” và “khuôn viên” (ch-04-b01/b04/b07–b10), “Chủ nhật” (ch04-b08-sabbath-off-day-church-confession-and-icon-terms / ch-04-b10), “sĩ quan cấp trên” (ch-04-b06), “chuẩn tướng” và “Chuẩn tướng von Zettour” (ch-01-b19 p000032, p000034 / ch-04-b04 p000065), danh xưng cấp tướng chung “Tướng quân” (ch-01-b20 p000050), “chào điều lệnh” (ch-02-b01/b15, ch-04-b10), “Tanya Degurechaff”, “Đế quốc” và “trung úy ma pháp” (ch-04-b03 p000042), “Văn phòng Bộ Tổng Tham mưu” / “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms / ch-01-b15, ch-01-b19), “hậu phương” (ch-04-b03/b07/b10), “Cục Nhân sự thuộc Bộ Tổng Tham mưu” (ch-01-b15 p000277 / ch-04-b01/b02/b04), “cắt giảm nhân sự” (ch-00-b04 p000069), biệt danh ““Bạch Ngân”” (vol02-ch01-b10-white-silver / ch-01-b17 p000009, ch-04-b03 p000042) và “lục quân” (ch-04-b01/b06); khóa tạm “quân hàm trên cầu vai”, “chiến lược quân sự”, “cựu học viên khóa trước lớn tuổi hơn”, “Phó cục trưởng Cục Quân vụ thuộc Văn phòng Bộ Tổng Tham mưu” / “Cục Quân vụ” (đồng bộ cấp “Cục” với “Cục Nhân sự” / “Cục Đường sắt” và làm rõ nét nghĩa điều hành “chiến lược quản trị hành chính” ở p000236; ghi nhận phương án thay thế “Cục Hậu cần” / “Quân đoàn Công vụ”), “chiến lược quản trị hành chính”, “luật lệ cùng các sắc lệnh”, “giám đốc điều hành” và “nhân tài tinh hoa trẻ tuổi”."
