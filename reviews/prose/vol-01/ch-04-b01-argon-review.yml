- id: ch04-b01-admissions-committee-narration-pronouns-emphasis-and-counterfactuals
  source_term: Imperial War College Admissions Committee third-person narration pronouns for General Möltke the Great, Zettour, Rudersdorf, the presiding war college instructor, and collective committee/army/candidates, presiding instructor’s conference dialogue pronouns and historical reviewer quote in p000008, italicized emphasis in p000011, and counterfactual conditionals/modality in p000006/p000015/p000017/p000022
  proposed_vi: toàn bộ lô mở đầu Chương 4 diễn ra tại cuộc họp của Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc dưới góc nhìn trần thuật ngôi thứ ba khách quan (Tanya không xuất hiện trực tiếp trong cảnh và chỉ được nhắc tới gián tiếp qua danh ngữ “một ứng viên” / “ứng viên được đưa ra xét duyệt này” / “ứng viên đó” tại p000014, p000017, p000018, p000020); tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn hoặc chủ thể khác), trong lời kể ngôi thứ ba khách quan, quy chiếu Đại tướng Möltke Đại tài (p000008) và vị giảng viên học viện chiến tranh đang chủ tọa cuộc họp (p000017, p000022) bằng đại từ trang trọng trung tính “ông” kết hợp đại từ phản thân “mình” / “bản thân” (đồng bộ với cách quy chiếu các sĩ quan, tướng lĩnh trong lời kể khách quan ở Chương 1–2; lưu ý từ “nó” tại câu 2 p000022 chỉ quy chiếu danh từ bất động vật là “yêu cầu đó”, tuyệt đối không quy chiếu nhân vật), quy chiếu cặp Zettour và Rudersdorf bằng “người trước” / “người sau” và “Cả hai người họ” / “cả hai người họ” / “họ” (p000011, p000012), đồng thời quy chiếu tập thể hội đồng tuyển sinh, lục quân và các ứng viên số nhiều bằng “họ” (p000005, p000013, p000019); trong lời phát biểu điều hành cuộc họp của vị giảng viên học viện chiến tranh (p000002, p000004, p000009, p000014, p000018, p000021), chủ tọa tự xưng “tôi” ở ngôi thứ nhất số ít (p000002, p000009), dùng “chúng ta” / “Chúng ta” ở ngôi thứ nhất số nhiều cho toàn thể hội đồng tuyển sinh (p000004, p000009, p000014, p000021), và quy chiếu Thiếu tá von Lergen bằng “Thiếu tá von Lergen” / “vị thiếu tá” (p000014, p000021); trong câu trích dẫn lời phê bình trực tiếp của giám khảo năm xưa đối với Möltke tại p000008, người nói tự xưng “Tôi”; bảo toàn chính xác phạm vi nhấn mạnh `*sau khi*` tại p000011 theo DEC-P01-002 (không dùng `*...*` ở 21 đoạn còn lại), câu hỏi nội tâm tập thể “Rốt cuộc Thiếu tá von Lergen đang muốn nói điều gì?” kèm sắc thái suy đoán “có lẽ” tại p000017, câu điều kiện giả định tại p000006, phủ định theo thông lệ tại p000015, và câu điều kiện giả định trái thực tế trong quá khứ kèm mức độ khả năng “nếu yêu cầu đó không xuất phát từ... thì nhiều khả năng nó đã chẳng bao giờ được thông qua” tại p000022
  alternatives_vi:
  - hai vị ấy (thay cho “Cả hai người họ” / “cả hai người họ” tại p000011, p000012 — ưu tiên “Cả hai người họ” / “cả hai người họ” vì đoạn p000011 đang kể lại thời điểm Zettour và Rudersdorf còn là ứng viên dự thi học viện chiến tranh trước khi nối sang vị thế hiện tại ở p000012)
