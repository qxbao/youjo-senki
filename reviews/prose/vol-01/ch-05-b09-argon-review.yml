  proposed_vi: VĂN PHÒNG BỘ TỔNG THAM MƯU, PHÒNG ĂN SỐ 1 (LỤC QUÂN) / bạn đồng học / học viện chiến tranh / phòng ăn số 1 / Văn phòng Bộ Tổng Tham mưu / Quân đội Đế quốc / hải quân / lục quân / nhà ăn / tàu chiến / “khách sạn nổi” / phòng yến tiệc / Trung tá von Lergen / Cục Tác chiến / chuyến thị sát / mặt trận phía bắc và phía tây / Chuẩn tướng von Rudersdorf / phó cục trưởng Cục Tác chiến thuộc Bộ Tổng Tham mưu / cấp trên trực tiếp / cải tiến chiến thuật / tiểu đoàn phản ứng nhanh / pháp sư / Trung úy von Degurechaff / đại úy / Ban Công nghệ / đơn vị huấn luyện / giới chóp bu / tiểu đoàn thử nghiệm / Ôi Thượng đế ơi! / Bài viết / các giảng viên / giáo viên tại học viện / những điều kiện khắc nghiệt / chuyến đi thực tế tham mưu / Bộ Tổng Tham mưu / những cựu học viên tốt nghiệp học viện chiến tranh / lòng khát khao chiến trận / nhân cách / thượng đẳng / định kiến / Với tất cả sự kính trọng / học viện / sĩ quan tham mưu / tốt nghiệp loại ưu / hiệp sĩ
  alternatives_vi:
  - PHÒNG ĂN THỨ NHẤT / phòng ăn thứ nhất (thay cho “PHÒNG ĂN SỐ 1” / “phòng ăn số 1” tại p000196, p000197 — ưu tiên “PHÒNG ĂN SỐ 1” / “phòng ăn số 1” để đồng bộ cấu trúc trực tiếp với “PHÒNG HỘI NGHỊ SỐ 1” / “phòng hội nghị số 1” ở ch-05-b01 p000001, p000003) / phòng tiệc (thay cho “phòng yến tiệc” tại p000200 — ưu tiên “phòng yến tiệc” để làm nổi bật sắc thái xa hoa quá mức đang bị phê phán) / tiểu đoàn ứng phó nhanh (thay cho “tiểu đoàn phản ứng nhanh” tại p000205 — ưu tiên “tiểu đoàn phản ứng nhanh” để đồng bộ hoàn toàn với “lực lượng phản ứng nhanh” đã khóa ở ch-05-b01 → ch-05-b03) / ban lãnh đạo cấp cao hoặc cấp trên (thay cho “giới chóp bu” tại p000206 — ưu tiên “giới chóp bu” vì lột tả tự nhiên sắc thái bất ngờ pha chút bất lực của Lergen trước quyết định của thượng tầng) / ưu việt hoặc vượt trội (thay cho “thượng đẳng” tại p000211) / tốt nghiệp với thành tích xuất sắc (thay cho “tốt nghiệp loại ưu” tại p000216)
