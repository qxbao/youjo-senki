  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 21 đoạn của ch-05-b09: giữ đại từ “ông” / “Ông” cho Trung tá von Lergen trong trần thuật ngôi thứ ba, phân biệt rõ với “vị tướng” / “ông ấy” cho Chuẩn tướng von Rudersdorf ở p000204, phân tách 3 tầng quy chiếu Tanya (“cô” trong lời kể, “cô ta” trong nội tâm và lời cảnh báo của Lergen, “cô ấy” trong lời của Rudersdorf và các giảng viên học viện chiến tranh) mà tuyệt đối không dùng “nó”, giữ cặp xưng hô “Tôi – các ngài” và “tôi / chúng tôi / chúng ta – anh” tại bàn họp, xử lý đại từ ngôi thứ hai phiếm chỉ ở p000214 bằng “mình” theo direct-address choice, bảo toàn đầy đủ các cấu trúc giả định/điều kiện quá khứ và chính xác 1 đoạn nhấn mạnh `*...*` tại p000207."
