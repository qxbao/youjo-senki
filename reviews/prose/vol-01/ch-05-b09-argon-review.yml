  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, chức danh, quân hàm và tên gọi tổ chức đã khóa tạm từ Chương 1–4 và ch-05-b01 → ch-05-b08: “VĂN PHÒNG BỘ TỔNG THAM MƯU” / “Văn phòng Bộ Tổng Tham mưu” (ch-05-b01 p000001, p000003, ch-05-b08 p000195: p000196, p000197, p000198) và “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms: p000204, p000210); “bạn đồng học” (ch-05-b06 p000126, ch-05-b08 p000176, p000185: p000197); phân biệt rõ “học viện chiến tranh” (ch-04-b01, ch-05-b06–b08: p000197, p000206, p000208, p000210, p000214, p000215, p000216) và “các giảng viên” (ch-04-b01, ch-05-b08 p000193: p000208, p000210) với “học viện” (tức học viện quân sự đào tạo sĩ quan sơ cấp, ch-04-b02 p000027, p000034, ch-04-b04 p000062: p000209, p000213) và “giáo viên tại học viện” (p000209); “Quân đội Đế quốc” (b06-imperial-army: p000198), cặp đối lập “LỤC QUÂN” / “lục quân” – “hải quân” (vol02-ch04-b24-army-navy-contrast, ch-04-b01 p000008, ch-05-b08 p000195: p000196, p000198, p000199, p000200), “nhà ăn” (ch-04-b01 p000006, ch-05-b08 p000195: p000198) và “tàu chiến” (ch-02-b09 p000053: p000199); “Trung tá von Lergen” / “Lergen” (ch-04-b17 p000144, ch-04-b18 p000147 — giữ nguyên cách dịch danh xưng gọi rút gọn trong thoại của Rudersdorf ở p000203 là “Trung tá von Lergen” khớp quân hàm thực tế ở p000200: p000200, p000203, p000204, p000209, p000214); “Cục Tác chiến” (ch-04-b17 p000144, ch-05-b01 p000015: p000200, p000204), “Chuẩn tướng von Rudersdorf” và “phó cục trưởng Cục Tác chiến thuộc Bộ Tổng Tham mưu” (ch-04-b18 p000150: p000204); “chuyến thị sát” và “mặt trận phía bắc và phía tây” (ch-04-b18 p000152, p000165, p000169, ch-05-b01 p000002: p000200); “pháp sư” (p000205), “Trung úy von Degurechaff” (sau khi nhận tiền tố quý tộc *von* ở ch-05-b08 p000192: p000206) và “đại úy” (viết thường khi là danh từ chung theo b02-second-lieutenant: p000206); “Ban Công nghệ” (ch-02-b08 p000035–p000038, ch-02-b09 p000043: p000206) và “đơn vị huấn luyện” (ch-02-b01 p000021, ch-04-b03 p000042: p000206); “Ôi Thượng đế ơi!” (review-God / b07-god-vocative: p000207) và “Bài viết” (ch-04-b03 p000054, ch-04-b20 p000212: p000207); “những điều kiện khắc nghiệt” (ch-04-b21 p000222: p000210) và “chuyến đi thực tế tham mưu” (ch-04-b20 p000215: p000210); “nhân cách” (ch-04-b04 p000075, ch-04-b05 p000089: p000211), “định kiến” (ch-04-b01 p000019: p000212), “Với tất cả sự kính trọng” (ch-04-b08 p000177: p000213), “sĩ quan tham mưu” (ch-04-b17, ch-04-b20: p000214) và “hiệp sĩ” (ch-05-b07 p000128, ch-05-b08 p000193: p000216); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “PHÒNG ĂN SỐ 1” / “phòng ăn số 1” (p000196, p000197), ““khách sạn nổi”” (p000199), “phòng yến tiệc” (p000200), “cấp trên trực tiếp” và “cải tiến chiến thuật” (p000204), “tiểu đoàn phản ứng nhanh” (p000205 — phát triển trực tiếp từ “lực lượng phản ứng nhanh” ở ch-05-b01 → ch-05-b03), “giới chóp bu” và “tiểu đoàn thử nghiệm” (p000206), “lòng khát khao chiến trận” và “thượng đẳng” (p000211), cùng “tốt nghiệp loại ưu” (p000216)."
