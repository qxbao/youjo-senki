- id: ch05-b09-lergen-third-person-pov-pronouns-dialogue-modality-and-single-emphasis
  source_term: lergen_third_person_pov_pronouns_dialogue_modality_and_single_emphasis_ch05_b09
  proposed_vi: 'Toàn bộ 21 đoạn của lô ch-05-b09 (chapter011.xhtml/p000196–p000216) chuyển bối cảnh sau ngắt trang (`ns1:type="pagebreak"` tại p000196) sang cuộc họp ăn trưa tại Phòng ăn số 1 của Văn phòng Bộ Tổng Tham mưu, tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Điểm nhìn trần thuật ngôi thứ ba khách quan bám theo Trung tá von Lergen và giới hạn DEC-P01-001: vì Tanya không phải chủ thể điểm nhìn trong cảnh này, tuyệt đối không dùng đại từ “nó” để quy chiếu Tanya hay bất kỳ nhân vật nào (từ “nó” duy nhất xuất hiện ở câu 2 p000198 hoàn toàn chỉ quy chiếu danh từ bất động vật là “phòng ăn xa hoa”); quy chiếu Trung tá von Lergen nhất quán trong trần thuật ngôi thứ ba bằng tên riêng / quân hàm (“Trung tá von Lergen”, “Lergen”) và đại từ trang trọng “ông” / “Ông” kết hợp phản thân “mình” / “bản thân” (p000200, p000202, p000204, p000206, p000209, p000214 — đồng bộ hoàn toàn với ch-01-b15 → ch-01-b18 và ch-04-b02 → ch-04-b05, ch-04-b17 → ch-04-b20); quy chiếu Chuẩn tướng von Rudersdorf trong trần thuật ở p000204 bằng “Chuẩn tướng von Rudersdorf”, “vị tướng” và “ông ấy” để phân biệt rõ với “ông” đang quy chiếu Lergen trong cùng đoạn; quy chiếu Trung úy / Đại úy Tanya von Degurechaff theo đúng 3 tầng sắc thái: dùng “Trung úy von Degurechaff” và đại từ “cô” kết hợp phản thân “mình” trong lời kể ngôi thứ ba (p000206, p000209, p000210, p000211, p000214, p000216 — đồng bộ ch-04-b03 → ch-04-b05), dùng “cô ta” / “Cô ta” trong độc thoại nội tâm trực tiếp (p000207) và trong lời phát biểu cảnh báo gay gắt của Lergen (p000205, p000213 — đồng bộ ch-01-b15 p000280, ch-01-b18 p000021, ch-04-b04 p000080, p000083 và ch-04-b05 p000094, p000100–p000101), và dùng “cô ấy” / “Cô ấy” lịch sự, khách quan trong lời thoại của Rudersdorf và nhận xét trích dẫn của các giảng viên học viện chiến tranh (p000208, p000211, p000215); đồng thời xử lý đại từ ngôi thứ hai phiếm chỉ ở câu cuối p000214 bằng đại từ phản thân khái quát “mình” (“Lệ thường trong quân đội vốn là tin tưởng những người gần gũi nhất với mình.”) theo đúng quy ước direct-address choice (pending-terms.yml). (2) Hệ xưng hô trong hội thoại quân sự tại bàn họp: Trung tá von Lergen (p000201, p000205, p000213) tự xưng “Tôi”, gọi các tướng lĩnh / sĩ quan cấp cao quanh bàn ăn là “các ngài” kết hợp phản thân “mình” (p000205, p000213) và mở đầu câu chất vấn bằng cụm lễ tiết “Với tất cả sự kính trọng” (p000213); Chuẩn tướng von Rudersdorf / phía chủ trì bàn họp (p000203, p000208, p000212, p000215) tự xưng “tôi”, dùng “chúng tôi” khi đại diện cho ban lãnh đạo (p000208) và “chúng ta” khi nêu nhận định chung (p000215), gọi cấp dưới trực tiếp là “Trung tá von Lergen” và đại từ ngôi thứ hai “anh” / “Anh” kết hợp phản thân “mình” (p000203, p000208, p000212 — đồng bộ ch-04-b02 p000027, ch-04-b18 p000147, p000152, p000169, p000173). (3) Bảo toàn chính xác toàn bộ cấu trúc phủ định, câu hỏi phản vấn, dấu gạch ngang dài và thời gian/mức độ chắc chắn của các mệnh đề giả định/khả thể theo đúng canon/style-guide.md: dấu gạch ngang dài và vế nhượng bộ ở p000197, phủ định và dấu gạch ngang dài ở p000198, giả định tập quán và dấu gạch ngang dài ở p000200, phủ định tuyệt đối ở p000201–p000202, khả thể phủ định ở p000204, giả định hệ quả trong lời cảnh báo ở p000205, khả thể quá khứ và phủ định ở p000206, giả định hệ quả ở p000207, cấu trúc giả định phủ định kép ở quá khứ tại câu 3 p000210 (“cô không thể nào làm được những gì mình đã làm nếu không thực tâm nghĩ vậy”), câu hỏi phản vấn phủ định ở p000212–p000213, phủ định hoàn toàn ở p000215, và câu điều kiện giả định trái thực tế ở quá khứ tại câu 1 p000216 (“Nếu cô từng gây ra bất kỳ rắc rối nào tại học viện chiến tranh, kết quả đánh giá của cô hẳn đã rất tệ”). (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` bao trọn đoạn duy nhất có thẻ `<html:em>` trong `xhtml` nguồn là p000207 (`*Ôi Thượng đế ơi! Chuyện đó sẽ chẳng khác nào một cơn ác mộng. Cô ta quá đỗi nguy hiểm. Bài viết kia đã phơi bày bản chất thật của cô ta.*`), tuyệt đối không dùng dấu `*` ở 20/21 đoạn còn lại theo đúng DEC-P01-002.'
  alternatives_vi:
  - ngài (thay cho “các ngài” tại p000205, p000213 nếu hiểu Lergen chỉ đang hướng lời nói về riêng Chuẩn tướng von Rudersdorf — ưu tiên “các ngài” vì p000202, p000206 và p000208 xác lập rõ bối cảnh Lergen là tiếng nói phản đối đơn độc trước tập thể các sĩ quan cấp cao quanh bàn ăn và phía bên kia đáp lại bằng đại từ số nhiều “chúng tôi”)
