  volume: vol-01
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba (“Tanya” / “nó”), độc thoại nội tâm ngôi thứ nhất (“mình”), lời mắng thầm hướng trực tiếp tới Schugel trong tâm tưởng (“ông”), đại từ quy chiếu Schugel ở ngôi thứ ba (“ông ta”), và lời thoại trực tiếp giữa Tanya, Schugel cùng đội quan sát (“tôi / chúng ta – Tiến sĩ / ngài”, “tôi / chúng ta – Thiếu úy / cô”, “Chúng tôi – cô”)."
