- id: ch02-b16-tanya-pov-pronouns-apostrophe-shift-and-schugel-dialogue
  source_term: Tanya third-person narration/POV-dissociation pronouns and first-person interior monologue pronouns in p000192–p000217, intra-paragraph POV shifts and mental second-person apostrophes to Schugel in p000194/p000195/p000198/p000210, observation team radio address in p000205, and direct dialogue pronouns between Tanya and Chief Engineer von Schugel
  proposed_vi: tiếp nối trực tiếp điểm nhìn của Tanya tại bãi thử nghiệm từ ch-02-b15 và tuân thủ nghiêm ngặt DEC-P01-001, chapter1_b02_decisions cùng quy ước ch-02-b01 → ch-02-b08, ch-02-b15: trong các câu/mệnh đề trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể tự tách góc nhìn nhắc đến danh tính bên ngoài (p000192–p000195, p000198, p000200–p000202, p000204, p000208, p000210, p000212, p000214, p000217), dùng tên riêng “Tanya” và đại từ trần thuật “nó” kết hợp đại từ phản thân “mình” (p000192, p000201, p000202, p000204, p000208, p000210, p000217 — tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm của Tanya); trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000194, p000195, p000198, p000206, p000207, p000210, p000216), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” theo đúng DEC-P01-001; đặc biệt bảo toàn chính xác sự chuyển đổi điểm nhìn và ngôi nhân xưng ngay trong cùng đoạn văn tại p000194 (câu 1–3 lời thoại và trần thuật ngôi thứ ba, câu 4 chuyển sang ước muốn nội tâm ngôi thứ nhất “mình”), p000195 (câu 1 mắng thầm hướng trực tiếp tới Schugel dùng “ông” kết hợp phản thân “mình”, câu 3–4 chuyển sang độc thoại nội tâm ngôi thứ nhất “mình” và gọi ngôi thứ ba “gã nhà khoa học điên này”, câu 5 chuyển sang lời kể ngôi thứ ba “Tanya”), p000198 (câu 1 trần thuật ngôi thứ ba “Tanya”, câu 2–4 mắng thầm hướng trực tiếp tới Schugel dùng “ông” ở ngôi thứ hai và “mình” cho Tanya ở cuối câu 4), và p000210 (câu 1 trần thuật ngôi thứ ba “Tanya” / “nó” và “ông ta”, câu 2 chuyển sang độc thoại nội tâm ngôi thứ nhất “Mình”); quy chiếu Kỹ sư trưởng Adelheid von Schugel trong lời kể và nội tâm bằng “Schugel”, “Kỹ sư trưởng Adelheid von Schugel”, “gã nhà khoa học điên này”, “gã điên rao giảng đạo lý này”, “vị nhà khoa học này”, “vị tiến sĩ” / “Vị tiến sĩ” và đại từ ngôi thứ ba “ông ta” / “Ông ta” (p000193–p000195, p000198, p000201, p000202, p000208, p000210, p000212, p000214 — đồng bộ ch-02-b04 → ch-02-b08, ch-02-b15); quy chiếu đội ngũ phát triển và nhân viên chịu ảnh hưởng tà giáo bằng “họ” (p000193, p000216); trong lời thoại trực tiếp giữa Tanya và Schugel, Tanya tự xưng “tôi” / “Tôi”, gọi Schugel là “Tiến sĩ”, dùng đại từ ngôi thứ hai lịch sự “ngài” (p000192, p000196, p000199, p000211), dùng “chúng ta” khi đề nghị hủy bỏ thí nghiệm của cả hai (p000192), và thêm tiểu từ kính ngữ “ạ” ở câu hỏi thăm dò bằng giọng dịu dàng nhất có thể tại p000215 (khớp với mô tả ở p000217), còn Schugel tự xưng “tôi” / “Tôi”, gọi Tanya là “Thiếu úy”, dùng đại từ ngôi thứ hai “cô” (p000194, p000218 — đồng bộ ch-02-b04 → ch-02-b07, ch-02-b15) và dùng “chúng ta” khi kêu gọi hai người hợp tác (p000218); trong thông báo qua liên lạc của đội quan sát tại p000205, đội quan sát tự xưng “Chúng tôi” và gọi Tanya là “cô”; toàn bộ 27 đoạn không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*` theo DEC-P01-002
  alternatives_vi:
  - lão (thay cho “ông” khi Tanya mắng thầm trực tiếp Schugel tại p000195, p000198 hoặc thay cho “ông ta” trong lời kể/nội tâm — ưu tiên “ông” cho ngôi thứ hai trong tâm tưởng và “ông ta” cho ngôi thứ ba để đồng bộ hoàn toàn với ch-02-b04 → ch-02-b08, ch-02-b15)
