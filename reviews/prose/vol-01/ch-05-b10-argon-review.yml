- id: ch05-b10-lergen-to-tanya-pov-shift-pronouns-dialogue-modality-and-three-emphases
  source_term: lergen_to_tanya_pov_shift_pronouns_dialogue_modality_and_three_emphases_ch05_b10
  proposed_vi: 'Toàn bộ 27 đoạn của lô ch-05-b10 (chapter011.xhtml/p000217–p000243) gồm hai phân cảnh nối tiếp qua ngắt cảnh (`class="space-break1"` tại p000234) tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân cảnh 1 — Phần cuối cuộc họp ăn trưa tại Phòng ăn số 1 dưới điểm nhìn trần thuật ngôi thứ ba bám theo Trung tá von Lergen (p000217–p000233): tiếp nối trực tiếp ch-05-b09 (p000215–p000216), vì Tanya không phải chủ thể điểm nhìn trong cảnh này, tuyệt đối không dùng đại từ “nó” để quy chiếu Tanya hay bất kỳ nhân vật nào; quy chiếu Trung tá von Lergen nhất quán trong trần thuật ngôi thứ ba bằng tên riêng (“Lergen”) và đại từ trang trọng “ông” / “Ông” kết hợp phản thân “mình” / “bản thân” (p000218, p000222, p000224, p000229); giữ nguyên 3 tầng quy chiếu Tanya đồng bộ hoàn toàn với ch-05-b09: dùng “cô” trong lời kể ngôi thứ ba (p000218), dùng “cô ta” / “Cô ta” trong lời phản bác gay gắt của Lergen (p000217, p000219, p000223), và dùng “Trung úy von Degurechaff”, “Đại úy von Degurechaff” cùng đại từ lịch sự “Cô ấy” / “cô ấy” trong lời đáp và kết luận của Rudersdorf / phía chủ trì (p000220, p000230); trong hội thoại quân sự tại bàn họp, Lergen tự xưng “tôi”, dùng đại từ gộp “Chúng ta” khi nêu trách nhiệm chung (p000217), gọi các sĩ quan cấp cao tại bàn họp là “các ngài” (p000223) và thưa “thưa ngài” khi cáo lỗi nhượng bộ (p000228), còn Rudersdorf / phía chủ trì tự xưng “chúng tôi” (p000225) / “Tôi” (p000226), dùng “Chúng ta” khi điều hành cuộc họp (p000232), và gọi cấp dưới trực tiếp là “Trung tá von Lergen” cùng đại từ ngôi thứ hai “Anh” / “anh” (p000221, p000225, p000226). (2) Phân cảnh 2 — Chuyển về điểm nhìn trần thuật ngôi thứ ba bám sát Tanya khi dùng bữa tại phòng ăn Văn phòng Bộ Tổng Tham mưu sau `space-break1` (p000234–p000243): áp dụng nghiêm ngặt DEC-P01-001, quy chiếu Tanya nhất quán bằng tên riêng “Tanya” (p000235) và đại từ ngôi thứ ba “nó” / “Nó” kết hợp phản thân “mình” (p000235, p000236, p000237, p000239, p000240, p000241, p000243 — tuyệt đối không dùng “cô” / “cô ấy”; lưu ý từ “nó” ở câu 1 p000243 chỉ quy chiếu danh từ bất động vật là “thứ bánh K-Brot này”, còn “Nó” ở đầu câu 3 p000243 quy chiếu Tanya); đồng thời chuyển đại từ ngôi thứ hai phiếm chỉ ở câu 1 p000237 thành mệnh đề khái quát không đại từ (“những món trong thực đơn mà chỉ khi về lại đây mới có được”) kết hợp chủ ngữ khái quát “Người ta” ở câu 2 theo đúng quy ước direct-address choice (pending-terms.yml). (3) Bảo toàn chính xác toàn bộ các cấu trúc phủ định, câu hỏi phản vấn/nội tâm, dấu gạch ngang dài và thời gian/mức độ chắc chắn của các mệnh đề giả định/khả thể theo đúng canon/style-guide.md: dấu gạch ngang dài và phủ định khả năng tuyệt đối ở p000217, mệnh đề nhượng bộ và câu điều kiện giả định kèm khả thể ở p000218 (“Nếu cô được giao một tiểu đoàn, hoàn toàn có khả năng toàn bộ thành viên trong đó sẽ bỏ mạng dưới tay cô trước cả khi chạm trán kẻ địch”), điều kiện giả định ở câu 4 p000222 (“Giới chóp bu sẵn sàng nhắm mắt làm ngơ nếu các vấn đề chỉ ở mức nhỏ nhặt”), câu hỏi phản vấn phủ định ở p000223, chuỗi cấu trúc phủ định ở p000227, nhận định nguyên tắc ở p000229, độ mở của câu hỏi nội tâm về tương lai ở p000233 (“*…Liệu chuyện này có thực sự ổn không đây?*”), khả thể lập luận ở p000237 (“Người ta có thể lập luận rằng...”), so sánh phủ định “chẳng mấy chua mà cứ như một tảng muối mặn chát” và câu điều kiện giả định trái thực tế ở quá khứ tại câu 3 p000239 (“nếu không có khoai tây đi kèm, hẳn nó đã thẳng tay quẳng vào thùng rác rồi”), sắc thái ước muốn giả định ở câu 3 p000240 (“Nó chỉ muốn đòi họ cứ dọn lúa mì và khoai tây riêng ra như bình thường”), câu điều kiện giả định kèm nhượng bộ ở p000241, dấu gạch ngang dài và các cấu trúc phủ định ở p000242, cùng cấu trúc phủ định tăng tiến “thậm chí còn chẳng sánh nổi với..., chứ chưa nói đến...”, câu hỏi mỉa mai và so sánh giả định ở câu cuối p000243 (“Ngay cả món haggis cũng còn khá hơn.”). (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` tại đúng 3 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: câu hỏi nội tâm đầu đoạn p000229 (`*Vậy thực chất là họ đã quyết định xong xuôi cả rồi ư?*`, giữ phần trần thuật còn lại nằm ngoài dấu `*`), toàn bộ đoạn p000233 (`*…Liệu chuyện này có thực sự ổn không đây?*`), và tên món ăn tại p000236 (`*schlachtplatte*`), tuyệt đối không dùng dấu `*` ở 24/27 đoạn còn lại; đồng thời bảo toàn chính xác ký hiệu chú thích chữ số thượng `²⁰` sau `K-Brot.` tại p000240 tương ứng với thẻ `<html:sup>20</html:sup>`.'
  alternatives_vi:
  - ngài (thay cho “các ngài” tại p000223 nếu hiểu Lergen chỉ đang hướng lời nói về riêng Chuẩn tướng von Rudersdorf — ưu tiên “các ngài” để đồng bộ trực tiếp với p000205, p000213 ở ch-05-b09 và khớp với đại từ đáp lại “chúng tôi” ở p000225) / mà bạn chỉ có thể thưởng thức khi về lại đây (thay cho mệnh đề khái quát không đại từ “mà chỉ khi về lại đây mới có được” tại câu 1 p000237 — ưu tiên mệnh đề khái quát không đại từ để tuân thủ nghiêm ngặt quy ước direct-address choice trong pending-terms.yml)
