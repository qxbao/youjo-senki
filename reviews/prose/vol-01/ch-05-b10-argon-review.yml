  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt cả hai phân cảnh của ch-05-b10: giữ đại từ “ông” / “Ông” cho Trung tá von Lergen và 3 tầng quy chiếu Tanya (“cô” trong lời kể, “cô ta” trong lời phản bác của Lergen, “cô ấy” / “Trung úy von Degurechaff” / “Đại úy von Degurechaff” trong lời của Rudersdorf và phía chủ trì) mà tuyệt đối không dùng “nó” ở p000217–p000233; chuyển sang quy chiếu Tanya nhất quán bằng “Tanya” và đại từ “nó” / “Nó” – “mình” sau ngắt cảnh `space-break1` ở p000234–p000243; xử lý đại từ ngôi thứ hai phiếm chỉ ở p000237 bằng mệnh đề khái quát không đại từ theo direct-address choice; bảo toàn đầy đủ các cấu trúc giả định/điều kiện quá khứ, câu hỏi nội tâm, ký hiệu chú thích `²⁰` tại p000240 và chính xác 3 vị trí nhấn mạnh Markdown `*...*` tương ứng với `<html:em>` tại p000229, p000233, p000236."
