  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, chức danh, quân hàm và tên gọi tổ chức đã khóa tạm từ Chương 1–4, ch-05-b01 → ch-05-b09 và các tập sau: “bản chất thật” (ch-05-b09 p000207: p000217); “tiểu đoàn” (p000217, p000218, p000220, p000230), “đại đội” (p000220) và “chỉ huy tiểu đoàn” (p000231); “quân hàm” (ch-05-b08 p000193: p000219, p000220, p000231), “Trung úy von Degurechaff” (ch-05-b09 p000206: p000220), “đại úy” / “Đại úy von Degurechaff” (p000220, p000230) và “thiếu tá” (viết thường khi là danh từ chung theo b02-second-lieutenant: p000231); “Đế quốc” (p000221); “Rudersdorf” (p000222) và “Trung tá von Lergen” / “Lergen” (ch-04-b18 p000147, ch-05-b09 p000200, p000203: p000222, p000225, p000229); “phản ứng nhanh” (ch-05-b01 → ch-05-b03, ch-05-b09 p000205: p000222) và “Giới chóp bu” (ch-05-b09 p000206: p000222); “đơn vị huấn luyện” (ch-02-b01 p000021, ch-04-b03 p000042, ch-05-b09 p000206: p000223); “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms: p000224, p000226, p000227, p000229), “Văn phòng Bộ Tổng Tham mưu” (ch-05-b01 p000001, ch-05-b09 p000196–p000198: p000243) và “Trung ương” (vol-02-ch-03, vol-02-ch-04: p000229); “dây tua tham mưu” (ch-04-b18 p000155: p000229); “người lính cần vụ” (vol-02-ch-05 p000652, p000663: p000235); “chiến trường”, “chiến hào” và “hậu phương” (p000236), “tiền tuyến” (p000237); “Phòng ăn” / “phòng ăn” (ch-05-b09 p000197, p000198: p000237, p000242), “nhà ăn” (ch-04-b01 p000006, ch-05-b08 p000195, ch-05-b09 p000198: p000241) và “phòng yến tiệc” (ch-05-b09 p000200: p000243); “K-Brot” kèm ký hiệu chú thích chữ số thượng “²⁰” (vol-02-ch-06 p000330, b02-ICBM-note, ch-05-b08 p000192: p000240, p000243); cặp đối lập “hải quân” – “lục quân” (vol02-ch04-b24-army-navy-contrast, ch-05-b09 p000198–p000200: p000240–p000243); “Khối Thịnh vượng chung” (ch-04-b13 p000031, ch-04-b16 p000121, ch-04-b20 p000194, p000214, ch-05-b05 p000084–p000088: p000243); đồng thời khóa tạm các thuật ngữ và danh từ ẩm thực – sinh hoạt quân sự mới phát sinh trong lô: “trăm nghe không bằng một thấy” (p000234), tên món ăn tiếng Đức giữ nguyên in nghiêng “*schlachtplatte*” (p000236), “bánh mì lúa mạch đen” (p000240), “bí mật công khai” (p000242), cặp thuật ngữ không gian ăn uống trên chiến hạm hải quân “phòng ăn sĩ quan sơ cấp” – “phòng ăn sĩ quan cấp cao” và “món haggis” (p000243)."
