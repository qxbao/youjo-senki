locked_choices:
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000454
    choices:
      - "Đại từ (DEC-P01-001): quy chiếu Tanya trong trần thuật bằng 'nó'; giữ đại từ khái quát 'người ta... của mình' ở câu hai."
      - "Nghĩa & cấu trúc câu hỏi gián tiếp: khóa 'sự hậu thuẫn hùng hậu', 'súng trường' và mệnh đề nghi vấn gián tiếp cuối đoạn ('chỉ để kiểm tra xem đây có phải là hiện thực hay không')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000455
    choices:
      - "Đại từ, thuật ngữ & mệnh đề nhượng bộ: giữ 'nó' kết hợp phản thân 'mình'; khóa 'tôn ti cấp bậc của quân đội', 'tiểu đoàn tăng cường', 'thời hạn'; bảo toàn cấu trúc nhượng bộ ở câu đầu ('ngay cả khi sự cho phép... chỉ mang tính danh nghĩa, thì trên thực tế nó vẫn gần như được toàn quyền tự quyết')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000456
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002) & phân biệt điểm nhìn đại từ (DEC-P01-001): quy chiếu Tanya trong phần trần thuật bằng 'Tanya' và 'nó' / 'Nó' kèm phản thân 'mình'; khóa chính xác câu hỏi nội tâm trực tiếp giữa cặp dấu gạch ngang dài '*chẳng phải mình có thể dùng sĩ quan phụ tá làm thư ký sao?*' tương ứng 1:1 với thẻ <html:em> trong nguồn và dùng đại từ tự quy chiếu nội tâm 'mình'."
      - "Thuật ngữ: khóa 'sĩ quan phụ tá' và 'thư ký'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000457
    choices:
      - "Thoại gọi trực tiếp: khóa '“Phụ tá, phụ tá!”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000458
    choices:
      - "Đại từ, thuật ngữ & phủ định: giữ 'Tanya' / 'nó' / 'mình'; khóa 'Văn phòng Bộ Tổng Tham mưu', 'sĩ quan phụ tá', 'một tá những sĩ quan quân cảnh có quân hàm'; bảo toàn điều kiện 'Nếu có thể' và mệnh đề phủ định 'mà chẳng bao giờ bỏ sót một chi tiết nào'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000459
    choices:
      - "Xưng hô thoại (Serebryakov -> Tanya): khóa câu hỏi trình diện lễ phép '“Đại úy gọi tôi ạ?”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000460
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002) & đại từ (DEC-P01-001): khóa '*Hửm?*' chỉ ở thán từ nghi vấn đầu đoạn tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ câu trần thuật thứ hai nằm ngoài dấu '*...*' và quy chiếu Tanya bằng 'nó'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000461
    choices:
      - "Phân biệt điểm nhìn đại từ (DEC-P01-001): bảo toàn sự chuyển dịch ngôi tự sự ngay trong đoạn văn—các câu 1, 2, 5, 6 ở ngôi thứ ba quy chiếu Tanya bằng 'nó' kết hợp phản thân 'mình', còn câu 3–4 chuyển sang độc thoại nội tâm ngôi thứ nhất dùng 'mình' cho Tanya và quy chiếu người phụ tá nữ bằng 'quý cô này' / 'cô ấy'."
      - "Phủ định & hình ảnh so sánh: bảo toàn hai cấu trúc phủ định ('mà thậm chí còn chẳng buồn ngẩng lên', 'vốn không nằm trong vốn diễn xuất thường ngày của nó') và hình ảnh 'chẳng khác nào con chim bồ câu bị bắn trúng bằng ống thổi đậu'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000462
    choices:
      - "Quân hàm, tên riêng & điều lệnh: khóa '“Đã lâu không gặp ạ, Đại úy von Degurechaff. Thiếu úy Viktoriya Ivanova Serebryakov, báo cáo trình diện nhận nhiệm vụ!”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000463
    choices:
      - "Phân biệt đại từ giữa hai nhân vật nữ (DEC-P01-001): quy chiếu Tanya bằng 'Tanya' / 'nó', quy chiếu Serebryakov bằng 'Serebryakov' / 'cô ấy'."
      - "Thuật ngữ & tình thái suy luận quá khứ: khóa 'cấp dưới', 'phù hiệu cấp bậc', 'thiếu úy' (viết thường danh từ chung), 'chương trình đào tạo sĩ quan cấp tốc' và câu suy luận quá khứ 'Chắc hẳn cô ấy đã hoàn thành chương trình đào tạo sĩ quan cấp tốc và được thăng hàm'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000464
    choices:
      - "Xưng hô & quân hàm (Tanya -> Serebryakov): khóa 'Thiếu úy Serebryakov', gọi Serebryakov là 'cô' và giữ 'thăng quân hàm'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000465
    choices:
      - "Xưng hô thoại (Serebryakov -> Tanya): khóa '“Cảm ơn Đại úy ạ.”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000466
    choices:
      - "Cấu trúc điệp nhấn mạnh: bảo toàn nhịp điệp 'gặp một người không ngờ tới như vậy ở một nơi chẳng ngờ tới như thế này'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000467
    choices:
      - "Xưng hô & thuật ngữ (Tanya -> Serebryakov): giữ cặp đại từ 'tôi – cô' và khóa câu hỏi '“Vậy cô là sĩ quan phụ tá của tôi sao?”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000468
    choices:
      - "Lời đáp điều lệnh (Serebryakov -> Tanya): khóa '“Vâng, thưa Đại úy.”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000469
    choices:
      - "Phân biệt đại từ (DEC-P01-001), thuật ngữ & phủ định: giữ 'cấp trên' / 'họ', 'sĩ quan phụ tá'; phân biệt rạch ròi 'nó' (Tanya) và 'cô ấy' (Serebryakov) trong câu ba; bảo toàn mệnh đề phủ định ('Đằng nào thì nó cũng chẳng định giao cho cô ấy lo liệu chuyện cá nhân nào') và mệnh đề nhượng bộ cuối câu ('ngay cả khi cử chỉ ấy có phần không cần thiết')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000470
    choices:
      - "Phân biệt điểm nhìn đại từ (DEC-P01-001) & cấu trúc tăng tiến: các câu 1–3 ở ngôi thứ ba dùng 'Tanya' / 'Nó' kết hợp phản thân 'mình', câu 4 chuyển sang nội tâm ngôi thứ nhất dùng 'mình' cho Tanya và 'Cô ấy' / 'cô ấy' cho Serebryakov; bảo toàn cấu trúc 'không chỉ tháo vát mà còn xứng đáng được tin tưởng phần nào'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000471
    choices:
      - "Xưng hô & thuật ngữ (Tanya -> Serebryakov): gọi 'Thiếu úy', giữ cặp xưng hô 'tôi – cô', khóa 'chỉ huy đội cảnh vệ' và 'quân cảnh'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000472
    choices:
      - "Đại từ, thuật ngữ, phủ định & giả định: giữ 'nó', khóa 'văn phòng quân cảnh', 'đường dây bên ngoài', 'Văn phòng Bộ Tổng Tham mưu Lục quân', 'tổng đài điện thoại'; bảo toàn phủ định ('lại không được phép lắp tại bàn làm việc cá nhân') và hai vế phỏng đoán song song ('Có lẽ là để giữ bí mật, nhưng thật phiền phức; mà biết đâu chỉ là do họ chẳng muốn mất công lắp đặt một tổng đài điện thoại mà thôi')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000473
    choices:
      - "Xưng hô & câu hỏi thoại (Serebryakov -> Tanya): khóa '“Đã rõ, thưa Đại úy. Tôi nên hỏi mượn bao nhiêu quân cảnh ạ?”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000474
    choices:
      - "Xưng hô & điều kiện (Tanya -> Serebryakov): tự xưng 'tôi', bảo toàn mệnh đề điều kiện 'nhưng nếu có thể thì tôi muốn một tá' đồng bộ với p000458."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000475
    choices:
      - "Xưng hô thoại (Serebryakov -> Tanya): khóa '“Rõ rồi ạ. Tôi sẽ liên hệ với họ ngay lập tức.”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000476
    choices:
      - "Đại từ, thuật ngữ & phủ định có điều kiện thời gian: quy chiếu Tanya bằng 'Tanya' / 'Nó' / 'nó' kèm phản thân 'mình', quy chiếu chung Tanya và Serebryakov ở câu ba bằng 'họ'; khóa 'cấp dưới' và 'người tình nguyện'; bảo toàn phủ định giới hạn theo thời gian ('nó chưa thể thực sự khẳng định điều đó cho đến khi họ tập hợp được một số nhân lực')."
