locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000162
  locks:
  - Giữ đại từ nội tâm “mình”, sự tách biệt góc nhìn “theo ký ức của Tanya”, mức độ phỏng đoán “rất có khả năng bản thân chiếc máy vô tuyến đang gặp trục trặc” và nhận định đối lập “Vốn được đánh giá cao nhờ độ bền bỉ, thiết bị liên lạc chiến đấu đâu thể mong manh đến thế này.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000163
  locks:
  - Giữ cấu trúc tăng tiến “không chỉ ngăn mình báo cáo vị trí đạn pháo đang rơi xuống mà đáng lo hơn là còn khiến mình không thể thực hiện nhiệm vụ của một quan sát viên pháo binh, dù cho nguyên nhân là vì trục trặc kỹ thuật đi nữa” và đại từ “mình”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000164
  locks:
  - Giữ câu cảm thán “…Phát xạ radar ư?!”, cụm “nghe theo bản năng của Tanya”, thuật ngữ “thuật thức ma pháp” và câu kết “Kẻ địch đã tới.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000165
  locks:
  - Giữ khẩu lệnh cấp cứu “Mayday! Mayday! Fairy 08 gọi Norden Control! Fairy 08 gọi Norden Control! Cảnh báo chiến trường! Yêu cầu chi viện ngay lập tức!”, tên riêng “Tanya” trong lời trần thuật, và kết luận “tiếng nhiễu vừa rồi không phải do lỗi thiết bị mà là do địch gây nhiễu”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000166
  locks:
  - Giữ danh xưng “Liên minh Entente”, “Đế quốc”, đại từ “họ” và câu thành ngữ “kẻ thù của kẻ thù là bạn”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000167
  locks:
  - Giữ các danh xưng “Liên minh Entente”, “Quân đội Đế quốc”, “Norden”, “Liên minh”, đại từ nội tâm “mình” và câu kết giải thích nguyên nhân “Đó là lý do không một ai ngờ rằng lại có lực lượng pháp sư địch đặc biệt nguy hiểm nào ở vùng lân cận.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000168
  locks:
  - Giữ thuật ngữ “sở chỉ huy (CP)”, cấu trúc tăng tiến “Việc làm đó không chỉ có giá trị về mặt chiến thuật mà còn mang những hệ lụy chính trị to lớn vô cùng tận cần phải cân nhắc.”, và mạch nội tâm thực dụng của Tanya với đại từ “mình”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000169
  locks:
  - Giữ sự phân biệt giữa đại từ “Tôi” trong lời báo cáo vô tuyến và “mình” trong lời kể nội tâm, cùng thông số tọa độ “Tọa độ: Chiến trường α, phân khu tám. Độ cao: 4.300!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000170
  locks:
  - Giữ cụm “Bất kể xung đột nội bộ hay ý đồ chính trị của phía bên kia là gì”, đại từ “họ” cho những người lính địch và đại từ nội tâm “mình”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000171
  locks:
  - Giữ giả định điều kiện “Nếu quân địch chỉ chọc thủng đúng khu vực do mình phụ trách trong khi quân Đế quốc đang áp đảo trên hầu khắp chiến trường, thì chuyện đó sẽ theo đúng nghĩa đen mà đi vào lịch sử như vết nhơ duy nhất của Đế quốc trong cả trận đánh.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000172
  locks:
  - Giữ dấu ngoặc kép cho câu tự nhủ đầu đoạn “Sự bất tài của mình sẽ bị ghi nhận như thất bại duy nhất giữa muôn vàn thành công của tất cả những người khác.”, đại từ nội tâm “mình” xuyên suốt và câu kết “Và một khi cấp trên đã ban lệnh đánh chặn, đám lính quèn như mình không có quyền từ chối.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000173
  locks:
  - Giữ các thuật ngữ “cơ động né tránh bất quy tắc”, “lực G”, “đầu nổ thuật thức ma pháp” và sự đối lập giữa kỳ vọng thông thường với thực tế khắc nghiệt.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000174
  locks:
  - Giữ nhịp tự điều chỉnh nhận định “quân số của chúng ít nhất cũng đủ lập thành một trung đội. Không, đây có thể là một đội tinh nhuệ.” và đại từ nội tâm “mình”.
