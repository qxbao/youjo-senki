- id: b10-tanya-pronouns-and-radio-voice
  source_term: Tanya interior monologue self-reference, dissociated body/instinct reference, third-person narration reference, radio report voice, and enemy plural reference
  proposed_vi: độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng “mình” / “Mình” xuyên suốt (p000162–p000164, p000167–p000174) và ngôi thứ nhất số nhiều dùng “chúng ta” / “quân ta” (p000168, p000171); khi tách góc nhìn nhắc tới ký ức, bản năng của cơ thể hiện tại hoặc trong câu trần thuật ngôi thứ ba dùng tên riêng “Tanya” (p000162, p000164, p000165 — tránh dùng “cô”); trong lời thoại báo cáo vô tuyến trực tiếp tại p000169 tự xưng “Tôi” (đồng bộ p000002, p000010); quy chiếu pháp sư địch bằng “họ” khi nhận xét khái quát về lực lượng Liên minh Entente và tinh thần người lính (p000166, p000170) và bằng “chúng” khi chỉ mục tiêu tác chiến đang giao chiến trực diện (p000167–p000169, p000174)
  alternatives_vi:
