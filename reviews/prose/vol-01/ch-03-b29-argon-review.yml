  - "Giữ đại từ gộp “chúng ta”, đại từ “chúng” quy chiếu kẻ địch, dấu gạch ngang dài (—), mệnh đề phủ định “chúng ta không phân biệt đối xử”, cùng các thuật ngữ “đám ô hợp”, “Đế quốc”, “Liên minh Entente”, “Cộng hòa”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000160
  locks:
  - "Giữ đại từ độc thoại nội tâm “mình” theo DEC-P01-001 (từ “nó” ở câu 3 quy chiếu việc tôn vinh Being X), cùng các thuật ngữ “Elinium Type 95”, “lời nguyền”, “kẻ tự xưng là Thượng đế”, “Being X”, “học thuyết thăng tiến của Đạo quân Quan Đông”, “lòng yêu nước”."
