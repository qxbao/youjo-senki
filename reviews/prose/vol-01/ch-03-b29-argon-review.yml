  source_term: type95_curse_spatial_detonation_mana_noise_and_religious_proclamation_terms_ch03_b29
  proposed_vi: "đám ô hợp / Đế quốc / Liên minh Entente / Cộng hòa / Elinium Type 95 / lời nguyền / kẻ tự xưng là Thượng đế / Being X / học thuyết thăng tiến của Đạo quân Quan Đông / lòng yêu nước / Tsugene / cuộc sống nhàn hạ / tọa độ không gian / các đường né tránh khả dĩ / buồng giãn nở / ma lực / ưu thế về quân số / các pháp sư Cộng hòa / tỉa gọn từng tên / diệt khổng lồ / CP / cảnh báo chiến trường / kích nổ không gian / CP nghe rõ / cảnh báo kích nổ không gian / mana / hệ thống bốn lõi đồng bộ hóa / thuật thức nổ / vận hành hết công suất / chồng chất giao thoa / khu vực chiến sự / quả cầu khiếm khuyết / Trung sĩ Schones / Chuẩn bị đón chấn động! / nhiễu mana / tác chiến có tổ chức / đơn vị huấn luyện / thuật thức / tinh thần dân tộc / đức tin tôn giáo / Tổ quốc / Thượng đế / Các pháp sư địch / vùng hỏa lực đan chéo / Tanya / Hỡi Chúa / động tác cơ động gắt gao / những con người duy lý, biết tính toán kinh tế / tư duy logic, đầu óc kinh tế / theo đuổi lợi nhuận"
  alternatives_vi:
  - "Liên minh Hiệp ước (thay cho “Liên minh Entente” tại p000159 — ưu tiên giữ “Liên minh Entente” để đồng bộ xuyên suốt Tập 1 từ ch-01-b03 đến ch-05-b04) / các lộ trình cơ động né tránh tiềm năng và buồng khuếch trương (thay cho “các đường né tránh khả dĩ” và “buồng giãn nở” tại p000163) / hạ gục gã khổng lồ hoặc giữ nguyên giant killing (thay cho “diệt khổng lồ” tại p000165) / vụ nổ không gian (thay cho “kích nổ không gian” tại p000167, p000168 — ưu tiên “kích nổ không gian” để đồng bộ với “thuật thức kích nổ không gian” ở ch-03-b27 p000129) / thuật thức phát nổ (thay cho “thuật thức nổ” tại p000169, p000177 — ưu tiên “thuật thức nổ” đồng bộ với ch-03-b06/b07) / vận hành tối đa công suất, chồng lớp gây nhiễu và vùng chiến sự (thay cho “vận hành hết công suất”, “chồng chất giao thoa” và “khu vực chiến sự” tại p000169) / Chuẩn bị chịu va chấn! (thay cho “Chuẩn bị đón chấn động!” tại p000170) / tạp âm mana hoặc nhiễu ma lực (thay cho “nhiễu mana” tại p000171) / đơn vị giảng viên (thay cho “đơn vị huấn luyện” tại p000172 — ưu tiên “đơn vị huấn luyện” đồng bộ với ch-02-b01 p000020–p000021 và Tập 2–4) / chủ nghĩa dân tộc (thay cho “tinh thần dân tộc” tại p000174 — ưu tiên “tinh thần dân tộc” tự nhiên trong ngữ cảnh tuyên bố trước toàn chiến trường) / Lạy Chúa (thay cho “Hỡi Chúa” tại p000178 — ưu tiên “Hỡi Chúa” để giữ âm hưởng trang trọng đồng bộ với các lời cầu nguyện khi kích hoạt Type 95)"
