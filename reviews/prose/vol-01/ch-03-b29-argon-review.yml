- id: ch03-b29-tanya-pov-pronouns-radio-and-prayer-register-internal-questions-and-zero-emphasis
  source_term: tanya_pov_pronouns_radio_and_prayer_register_internal_questions_and_zero_emphasis_ch03_b29
  proposed_vi: "Toàn bộ 23 đoạn của lô ch-03-b29 (chapter007b.xhtml/p000159–p000181) tiếp nối trực tiếp cảnh tác chiến trên không của Thiếu úy Tanya Degurechaff từ ch-03-b28 và khép lại bằng ngắt cảnh (`space_break` trước p000182), tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân tách rạch ròi đại từ độc thoại nội tâm ngôi thứ nhất và trần thuật ngôi thứ ba của Tanya theo đúng DEC-P01-001: trong toàn bộ các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000160, p000164, p000165, p000166, p000171, p000174, p000175, p000179, p000181), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” (tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” hay “tôi” trong nội tâm; lưu ý từ “nó” ở câu 3 p000160 chỉ quy chiếu việc tôn vinh Being X, ở câu 1 p000169 quy chiếu “Elinium Type 95”, ở câu 2 p000171 và câu 1–2 p000172 quy chiếu chiêu thức / chiến thuật nổ, và từ “mình” ở câu 4 p000164 là đại từ phản thân quy chiếu chủ ngữ “chúng”); tại đoạn trần thuật ngôi thứ ba duy nhất về Tanya trong lô là p000177, giữ tên riêng “Tanya” và dùng đại từ ngôi thứ ba “nó” (“thay vì tập trung các phát bắn vào Tanya, họ định hành hạ nó đến chết giữa không trung”) theo đúng DEC-P01-001. (2) Xử lý đại từ ngôi thứ hai phiếm chỉ và quy chiếu các pháp sư Cộng hòa: tại câu điều kiện khái quát ở câu 1 p000161, lược đại từ ngôi thứ hai ở vế điều kiện và dùng chủ ngữ khái quát “người ta” ở vế chính (“nếu càng bắt chước mấy gã kiểu Tsugene chỉ giỏi to mồm đó thì người ta lại càng thăng tiến”) theo đúng quy ước direct-address choice (work/run-state/pending-terms.yml); quy chiếu toán pháp sư Cộng hòa ở ngôi thứ ba bằng “chúng” / “Bọn chúng” / “Đám người này” (p000159, p000164, p000165, p000179, câu 1–3 p000180), chuyển sang “Họ” / “họ” trong đoạn trần thuật khách quan hơn ở p000177, câu nhận định chung về giáo dục ở câu 4 p000180 và câu giả định đối phương cũng là những con người duy lý giống mình ở p000181, đồng thời dùng “các người” ở câu 3 p000179 khi Tanya cằn nhằn hướng trực tiếp tới đám người cuồng chiến. (3) Hệ xưng hô trong tuyên cáo trên chiến trường, liên lạc vô tuyến, mệnh lệnh và lời cầu nguyện: trong lời tuyên bố phát rộng khắp khu vực chiến sự (p000159, p000173, p000176), Tanya dùng đại từ gộp “chúng ta” và gọi kẻ địch là “chúng” (p000159), “lũ quân thù xấc xược” (p000173) hoặc “các ngươi” trong lời tuyên cáo mang âm hưởng kinh thánh cổ kính (p000176); trong liên lạc vô tuyến và chỉ huy tác chiến (p000167, p000168, p000170), giữ định danh “CP”, lời xác nhận “CP nghe rõ” và khẩu lệnh gọi cấp bậc + họ “Trung sĩ Schones!”; trong lời cầu nguyện bắt buộc khi kích hoạt Type 95 (p000178), dùng cụm hô gọi “Hỡi Chúa” và tự xưng “con” (đồng bộ ch-03-b18 p000386, p000388). (4) Bảo toàn trọn vẹn cấu trúc phủ định, tình thái giả định, điều kiện và toàn bộ các câu hỏi nội tâm theo đúng canon/style-guide.md: so sánh phủ định tuyệt đối ở p000162, nghi ngờ phủ định và điều kiện phỏng đoán ở p000164, phủ định khả năng ở p000165–p000166, dấu gạch ngang dài (—) ở p000159 và p000169, giả định hệ quả và phủ định ở p000171, sắc thái mỉa mai (“đã tử tế nhận xét rằng ngoài việc tự sát ra thì nó chẳng có tác dụng gì cả”) cùng điều kiện và tương phản ở p000172, mệnh đề nhượng bộ giả định ở p000175, và đặc biệt giữ nguyên đối tượng cùng độ mở của toàn bộ 6 câu hỏi nội tâm ở p000179–p000181 (câu hỏi ngỡ ngàng ở câu 1 p000179, hai câu hỏi trách móc ở câu 1–2 p000180 kèm suy luận quá khứ “Hẳn là...” ở câu 3, khả thể phỏng đoán “Hay biết đâu...” ở câu 1 p000181, câu hỏi điều kiện phủ định kèm dấu chấm lửng “...?” ở câu 3, và hai câu hỏi tự vấn ở câu 4–5 p000181). (5) Tuân thủ nghiêm ngặt DEC-P01-002: toàn bộ 23/23 đoạn trong `work/vol-01/batches/ch-03-b29-source.jsonl` đều không có thẻ `<html:em>`, nên bản dịch hoàn toàn không sử dụng dấu nhấn mạnh Markdown `*...*` ở bất kỳ đoạn nào (kể cả thông báo trạng thái quả cầu đặt trong ngoặc kép ở p000163, các lời cầu nguyện ở p000176, p000178 hay các câu độc thoại nội tâm)."
  alternatives_vi:
  - "bọn bây hoặc các ngươi (thay cho “các người” tại câu 3 p000179 — ưu tiên “các người” để giữ giọng cằn nhằn nội tâm tự nhiên của Tanya và phân biệt với sắc thái trang trọng cổ kính của “các ngươi” trong lời tuyên cáo ở p000176) / tự xưng tôi khi cầu nguyện (thay cho “con” tại p000178 — ưu tiên “con” trong văn phong cầu nguyện với Chúa/Thượng đế đồng bộ với ch-03-b18 p000386, p000388)"
