  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 23 đoạn của ch-03-b29: giữ đại từ nội tâm “mình” / “Mình” ở toàn bộ các đoạn độc thoại nội tâm và đại từ trần thuật ngôi thứ ba “nó” tại p000177, xử lý đại từ ngôi thứ hai phiếm chỉ ở p000161 bằng chủ ngữ khái quát “người ta”, phân biệt rõ thanh điệu giữa lời tuyên cáo trang trọng (“chúng ta – các ngươi” ở p000176), lời cầu nguyện (“Hỡi Chúa – con” ở p000178) và lời cằn nhằn nội tâm (“các người” ở p000179), bảo toàn nguyên vẹn đối tượng và độ mở của cả 6 câu hỏi nội tâm ở p000179–p000181, và tuyệt đối không thêm dấu `*...*` khi 23/23 đoạn nguồn không có nhấn mạnh."
