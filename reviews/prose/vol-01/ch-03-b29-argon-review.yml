  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm, định danh vô tuyến và khái niệm kỹ thuật/tôn giáo đã khóa tạm ở các lô trước: “đám ô hợp” (ch-03-b18 p000388: p000159), “Đế quốc”, “Liên minh Entente” (ch-01-b03–b14, ch-03-b14 p000283, ch-05-b03/b04: p000159, p000173) và “Cộng hòa” / “các pháp sư Cộng hòa” (p000159, p000164); “Elinium Type 95” (vol02-ch05-b12-elinium-type-95, ch-03-b28 p000139, p000142: p000160, p000169), “lời nguyền” (ch-03-b25 p000060: p000160, p000175), “kẻ tự xưng là Thượng đế” (ch-00-b05 p000094, p000101: p000160), “Being X” (P05-being-x: p000160, p000175), “Đạo quân Quan Đông” và “lòng yêu nước” (ch-03-b28 p000157, p000158: p000160); biệt danh “Tsugene” (ch-03-b14 p000285, ch-04-b15 p000082: p000161); “cuộc sống nhàn hạ” (ch-02-b19 p000309: p000162); “ưu thế về quân số” (ch-03-b28 p000150: p000164); “tỉa gọn từng tên” (ch-03-b28 p000134: p000165); “CP”, “CP nghe rõ” (vol02-ch04-b08-cp, ch-03-b05 p000070, ch-03-b28 p000152, p000153: p000167, p000168), “cảnh báo chiến trường” (ch-01-b09 p000147, p000148: p000167) và “kích nổ không gian” / “cảnh báo kích nổ không gian” (đồng bộ với “thuật thức kích nổ không gian” ở ch-03-b27 p000129: p000167, p000168); “mana”, “hệ thống bốn lõi đồng bộ hóa” (ch-02-b19 p000297, ch-03-b08 p000145, ch-03-b09 p000162: p000169), “thuật thức nổ” / “thuật thức” (P01-formulas, ch-03-b06 p000093, ch-03-b07 p000112: p000169, p000172, p000177) và “quả cầu khiếm khuyết” (ch-02-b15 p000180, ch-03-b09 p000175: p000169); “Trung sĩ Schones” (ch-03-b22 p000495, ch-03-b24 p000027, ch-03-b25 p000051: p000170); “đơn vị huấn luyện” (ch-02-b01 p000020, p000021: p000172); “đức tin tôn giáo” (ch-02-b13/b14, ch-02-b19 p000304: p000175); “Tổ quốc” (vol02-ch02-b01-fatherland, ch-03-b28 p000158: p000176, p000178), “Thượng đế” (review-God: p000176) và “Hỡi Chúa” (P06-lord: p000178); “Các pháp sư địch”, “vùng hỏa lực đan chéo” (ch-03-b06 p000091, p000092: p000177) và “Tanya” (p000177); đồng thời khóa tạm các cụm thuật ngữ phát sinh trong lô: “học thuyết thăng tiến của Đạo quân Quan Đông” (p000160), “tọa độ không gian”, “các đường né tránh khả dĩ” và “buồng giãn nở” (p000163), “diệt khổng lồ” (p000165), “vận hành hết công suất”, “chồng chất giao thoa” và “khu vực chiến sự” (p000169), “Chuẩn bị đón chấn động!” (p000170), “nhiễu mana” và “tác chiến có tổ chức” (p000171), “tinh thần dân tộc” (p000174), cùng “những con người duy lý, biết tính toán kinh tế”, “tư duy logic, đầu óc kinh tế” và “theo đuổi lợi nhuận” (p000181)."
