  proposed_vi: tiếp nối trực tiếp cảnh họp tại Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần từ ch-02-b08 → ch-02-b10 và tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của chủ thể khác), trong lời kể ngôi thứ ba khách quan từ góc nhìn của Ban Công nghệ, quy chiếu Kỹ sư trưởng von Schugel bằng tên riêng “Schugel” và đại từ trang trọng trung tính “ông” kết hợp đại từ phản thân “mình” (p000079, p000080 — đồng bộ ch-02-b09 p000043–p000046), quy chiếu Thiếu úy Tanya Degurechaff bằng tên riêng “Degurechaff” và đại từ “cô” (p000092 — đồng bộ ch-02-b08 → ch-02-b10), và quy chiếu tập thể Đế quốc, Ban Công nghệ, các phe phái hoặc những người lính thực tế bằng “họ” / “Họ” (p000076, p000079, p000085, p000086, p000092; lưu ý từ “Nó” / “nó” tại p000076, p000082, p000084, p000085, p000087, p000090, p000091 hoàn toàn chỉ quy chiếu danh từ bất động vật như dự án/quả cầu nguyên mẫu Type 95, ngân sách quân sự, vụ nổ/hiện tượng, ý tưởng/lý thuyết cố định mana, hoặc việc tạo ra vật thể bằng ý chí, tuyệt đối không quy chiếu nhân vật); trong lời thoại trực tiếp giữa các thành viên dự họp (p000077, p000078, p000089, p000090), gọi tập thể cuộc họp là “Chúng ta” / “chúng ta” (p000078, p000090), dùng đại từ ngôi thứ hai số nhiều trang trọng “Các vị” khi chất vấn hoặc phản biện phe đối lập trong phòng họp (p000078, p000089 — đồng bộ plural-address-p000076, ch-01-b20 và ch-02-b10 p000065), quy chiếu Kỹ sư trưởng von Schugel bằng “ông ấy” / “Ông ấy” (p000078, p000089 — đồng bộ ch-02-b09 p000044, p000052), và quy chiếu Thiếu úy Degurechaff bằng “Thiếu úy Degurechaff” và “cô ấy” (p000090 — đồng bộ ch-02-b08 p000039 và ch-02-b09 p000042, p000047, p000052); bảo toàn chặt chẽ cấu trúc tăng tiến khi chủ thể hai vế thay đổi tại p000082 (“Không chỉ bản thân nó là..., mà lượng mana... cũng...”) và p000087 (“không chỉ những người lính... mà cả bất kỳ ai... cũng...”), cùng dấu ngoặc kép mỉa mai quanh từ ““tốt đẹp”” tại p000093
  alternatives_vi:
  - các ngài (thay cho “Các vị” tại p000078, p000089 — ưu tiên “Các vị” để đồng bộ hoàn toàn với ch-02-b10 p000065 và ch-01-b20 trong bối cảnh tranh luận ngang hàng tại cuộc họp quân sự)
