  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–2: giữ sự nhất quán của điểm nhìn Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần nối tiếp ch-02-b08 → ch-02-b10 (trần thuật gọi Schugel là “ông”, gọi Degurechaff là “cô”, gọi tập thể Đế quốc/phe phái/binh lính là “họ”; lời thoại cuộc họp dùng “Chúng ta / chúng ta – Các vị – ông ấy / cô ấy”; kiểm tra chặt cấu trúc tăng tiến đổi chủ thể ở p000082 và p000087; toàn bộ 18 đoạn không có thẻ nhấn mạnh nên không dùng `*...*`)."
