locked_choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000024
  locks:
  - Giữ mốc thời gian–địa điểm “14 tháng Tám, năm 1971 Công nguyên, Hợp chúng quốc Hoa Kỳ”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000025
  locks:
  - Giữ danh xưng “Tiến sĩ Philip Zimbardo”, các tên tổ chức “Bộ Hải quân Hoa Kỳ”, “Văn phòng Nghiên cứu Hải quân (ONR)”, “Thủy quân lục chiến”, thời lượng dự kiến “chỉ kéo dài hai tuần” và mục tiêu thu thập dữ liệu sơ bộ.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000026
  locks:
  - Giữ mô tả sinh viên đại học bình thường khỏe mạnh cả về thể chất lẫn tinh thần và bước ngoặt sang ngày thứ hai vấp phải vấn đề nghiêm trọng về đạo đức.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000027
  locks:
  - Giữ quan hệ nhượng bộ “Bất chấp lệnh cấm”, sự tách bạch chủ thể hai vế (những người được giao vai cai ngục chửi bới, hạ nhục người đóng vai tù nhân; ngoài ra các hành vi bạo lực thể xác ngày càng phổ biến) theo style-guide, và kết quả buộc phải dừng cuộc thử nghiệm chỉ sáu ngày sau khi bắt đầu.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000028
  locks:
  - Giữ tên gọi “Thí nghiệm Nhà tù Stanford”, “Thí nghiệm Milgram”, và quan hệ tương phản giữa những bất cập đạo đức của dự án với kết quả giàu hàm ý cho ngành tâm lý học về bản chất con người.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000029
  locks:
  - Giữ cặp thuật ngữ “quyền lực và quyền uy”, tên hiện tượng trong ngoặc kép “sự phục tùng quyền uy”, cấu trúc phủ định “chẳng liên quan gì đến lý trí, khả năng cảm nhận hay tính cách của một người” và nguyên nhân “sự phi cá nhân hóa rõ rệt do việc phân vai khơi lên”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000030
  locks:
  - Giữ khả thể quá khứ “bất kỳ ai cũng có thể đã làm lính gác ở Auschwitz” theo đúng quy tắc bảo toàn thời gian của giả định trong style-guide, cùng hai thuật ngữ “khuynh hướng cá nhân” và “phẩm chất đạo đức”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000031
  locks:
  - Giữ so sánh vai trò của môi trường lớn hơn “những đặc điểm cá nhân”, đại từ ngôi thứ ba “anh” và nhận định “hợp lý chứ không hề sai” (không áp bình diện phán xét đạo đức).
- segment_id: YS-LN01/Text/chapter001.xhtml/p000032
  locks:
  - Giữ tình thái “Chắc hẳn”, bối cảnh “chương trình giáo dục bắt buộc ở tiểu học”, và sự đối lập giữa những lời khẳng định quen thuộc về bình đẳng/độc đáo với những chênh lệch thực tế.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000033
  locks:
  - Giữ toàn bộ câu hỏi nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002 và đại từ tự quy chiếu “mình” theo DEC-P01-001.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000034
  locks:
  - Giữ toàn bộ câu hỏi nội tâm trong dấu nghiêng `*...*` theo DEC-P01-002 và trò chơi “bóng né”.
