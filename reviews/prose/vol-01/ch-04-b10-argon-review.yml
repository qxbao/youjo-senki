- id: ch04-b10-tanya-pov-return-intra-paragraph-dissociation-pronouns-and-emphasis
  source_term: Tanya third-person narration and POV-dissociation pronouns vs first-person interior monologue pronouns after space-break1 across p000200–p000218, intra-paragraph and intra-sentence shifts between first-person and third-person in p000202–p000204 and p000209, spoken first-person plural self-talk in p000211, third-person references to Being X, college guards, and blind believers, military library entry announcement in p000219, and exact preservation of italicized emphasis in p000204 and footnote superscript 16 in p000206
  proposed_vi: sau ngắt cảnh (space-break1) tại p000200, mạch truyện chuyển từ góc nhìn ngôi thứ nhất của Chuẩn úy Laeken (ch-04-b08–b09) về lại điểm nhìn của Tanya tại Học viện Chiến tranh Đế quốc, tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya) và DEC-P01-002: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể tự tách góc nhìn (p000200, câu 2 p000202, vế phụ câu 1 p000203, câu 2 p000204, p000208, câu 3 p000209, p000212–p000218), dùng nhất quán tên riêng “Tanya” / “cá nhân Tanya Degurechaff” và đại từ trần thuật “nó” / “Nó” kết hợp phản thân “mình”; trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất (p000201, câu 1 p000202, mệnh đề chính câu 1 và câu 2–3 p000203, câu 1 và câu 3 p000204, p000205, p000206, câu 1–2 p000209), dùng nhất quán đại từ tự quy chiếu “mình” kết hợp “bản thân”; đặc biệt bảo toàn chính xác các vị trí chuyển đổi điểm nhìn và tách biệt chủ thể giữa ngôi thứ nhất nội tâm (“mình”) và ngôi thứ ba (“Tanya” / “nó”) ngay trong cùng đoạn văn hoặc cùng câu văn theo sát bản gốc tại p000202 (câu 1 dùng “mình”, câu 2 dùng “Tanya” và “nó”), p000203 (mệnh đề đầu câu 1 dùng “mình”, mệnh đề bổ ngữ phía sau chuyển sang “nó”, câu 2–3 quay lại “mình”), p000204 (câu 1 và 3 dùng “mình”, câu 2 dùng “Tanya”) và p000209 (câu 1–2 dùng “mình” nhìn nhận “Tanya” như một thực thể có nguy cơ bị lời nguyền của Elinium Type 95 biến thành tín đồ mộ đạo, sang câu 3 chuyển sang “Nó” / “nó”); tại p000211, trong câu tự nhủ lẩm bẩm thành tiếng của Tanya khi gộp hai bản ngã vừa tách biệt ở p000209 đồng thời mở ra luận đề về nhân loại ở p000212, dùng đại từ ngôi thứ nhất số nhiều “chúng ta” (`“…Hừ. Vậy là chúng ta không muốn làm những con búp bê sao?”`); tại p000219, dịch câu báo danh theo nghi thức quân đội khi mở cửa bước vào thư viện là `“Trung úy Degurechaff, xin phép bước vào.”`; quy chiếu Tồn tại X / gã tự xưng là Thượng đế bằng đại từ “hắn” (p000208, p000216), quy chiếu đội cảnh vệ học viện / con người nói chung bằng “họ” (p000200, p000203, p000204, p000212), và quy chiếu đám cuồng tín / những kẻ áp đặt giáo điều bằng “lũ đần độn ấy” / “chúng” (p000215); bảo toàn chính xác ký hiệu chú thích `¹⁶` ngay sau `raison d’être` tại p000206, và bảo toàn tuyệt đối duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tại p000204 (`*Con nhóc ngốc nghếch lúc nào cũng vác súng trường tới trường lại đến rồi kìa.*`) theo đúng DEC-P01-002 (19/20 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - Trung úy Degurechaff bước vào đây ạ. (thay cho “Trung úy Degurechaff, xin phép bước vào.” tại p000219 — ưu tiên “Trung úy Degurechaff, xin phép bước vào.” để phản ánh chuẩn mực lời báo danh theo điều lệnh quân đội Đế quốc khi bước vào phòng)
