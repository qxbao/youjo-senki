  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị và thuật ngữ quân sự – chiến lược từ Chương 1–4, ch-05-b01 và ch-05-b02: “Quân đội Đế quốc” (b06-imperial-army / ch-01-b15, ch-04-b04, p000042), sự phân biệt giữa “tái cơ cấu” (ch-05-b02 p000031, p000042) và “tái tổ chức” (ch-05-b01 p000008, p000009, ch-05-b02 p000032, p000039, p000058), “Cụm tập đoàn quân phương Tây” (vol02-ch02-b12-western-army-group / ch-05-b01 p000008, ch-05-b02 p000037, p000042, p000045, p000048, p000052, p000058), “Cụm tập đoàn quân phương Bắc” (vol02-ch02-b07-northern-army-group / ch-01-b15 p000281, ch-03-b02 p000034 — tách rõ hai phiên hiệu đầy đủ “Cụm tập đoàn quân phương Tây và Cụm tập đoàn quân phương Bắc” tại p000045 tương tự ch-05-b02 p000037), “Cụm tập đoàn quân phía Đông” (vol02-ch01-b10-eastern-army-group / ch-03-b02 p000034, p000042, p000044, p000046, p000050, p000051, p000058, p000059), “huân chương” (ch-05-b02 p000040, p000042), “các bộ tư lệnh khu vực” (ch-05-b02 p000020, p000042), “thư tiến cử” (ch-04-b04 p000065, p000042), “học viện chiến tranh” (ch-05-b02 p000041, p000042), “Cục Nhân sự” (b15-general-staff-personnel-and-achievement-assessment-terms / ch-01-b15, ch-04-b04, ch-04-b17, p000045, p000051), “Liên minh Entente” (ch-01-b03 p000040, ch-03-b01/b02, p000046) và “Cộng hòa” (vol02-ch02-b01-the-republic / ch-02-b19 p000308, p000046), “binh lính kỳ cựu” (ch-01-b06 p000100, ch-03-b05 p000068, ch-03-b18/b19, p000049 — tránh dùng “cựu binh” cho quân nhân đang tại ngũ), “lực lượng phản ứng nhanh” (ch-05-b01 p000017, ch-05-b02 p000033, p000034, p000051, p000054), “Rudersdorf”, “Cục Tác chiến” và “Zettour” (ch-05-b01, ch-05-b02, p000051, p000054, p000056), “sư đoàn” (ch-01-b03 p000040, ch-04-b21 p000241, p000053–p000055), “vật tư” (ch-01-b03 p000040, ch-04-b03 p000057, p000054), “Cục Đường sắt” (vol02-ch05-b08-railroad-department / ch-02-b02 p000024, ch-04-b03 p000053, p000058, p000054), “quân dự bị” / “lực lượng dự bị” (ch-03-b13 p000263, p000265, ch-05-b02 p000037, p000056, p000059), “lực lượng dự bị chiến lược” (ch-01-b09 p000155, p000059), “Đại Quân” (ch-05-b01, ch-05-b02, p000058) và “chiến lược quốc phòng” (ch-01-b20 p000061, ch-04-b16 p000105, ch-05-b01 p000018, p000058); khóa tạm “tiền thưởng” và “đội ngũ sĩ quan” (p000042), “góc độ nhân sự” (p000045), “những kẻ ăn không ngồi rồi” (p000046), “kinh nghiệm thực chiến” (p000047, p000048), “khả năng cơ động chiến lược” (p000053), “triển khai nhanh” và “cấp sư đoàn” (p000054), “sư đoàn dự bị” (p000055), cùng “lực lượng đồn trú tại chỗ” và “một tập đoàn quân” (p000059)."
