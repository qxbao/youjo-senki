  proposed_vi: Quân đội Đế quốc / tái cơ cấu / Cụm tập đoàn quân phương Tây / huân chương / tiền thưởng / các bộ tư lệnh khu vực / đội ngũ sĩ quan / thư tiến cử / học viện chiến tranh / Cụm tập đoàn quân phía Đông / Cục Nhân sự / góc độ nhân sự / Cụm tập đoàn quân phương Bắc / Liên minh Entente / Cộng hòa / những kẻ ăn không ngồi rồi / kinh nghiệm thực chiến / binh lính kỳ cựu / lực lượng phản ứng nhanh / Rudersdorf / Cục Tác chiến / sư đoàn / khả năng cơ động chiến lược / Zettour / triển khai nhanh / vật tư / cấp sư đoàn / Cục Đường sắt / sư đoàn dự bị / quân dự bị / tái tổ chức / Đại Quân / chiến lược quốc phòng / lực lượng đồn trú tại chỗ / một tập đoàn quân / lực lượng dự bị chiến lược / lực lượng dự bị
