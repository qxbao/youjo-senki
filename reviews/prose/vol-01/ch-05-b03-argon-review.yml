  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md xuyên suốt 18 đoạn thảo luận tại cuộc họp Bộ Tổng Tham mưu ở ch-05-b03: giữ đại từ số nhiều “họ” / “Họ” kết hợp phản thân “mình” cho các tập thể quân sự trong trần thuật ngôi thứ ba khách quan (từ “nó” ở cuối p000045 chỉ quy chiếu danh từ trừu tượng “nỗi sợ bị đàn em và đồng cấp vượt mặt”), giữ hệ đại từ “Tôi”, “chúng tôi” (cho nhóm đề xuất tại p000053), “Chúng ta” / “chúng ta” và đại từ ngôi thứ hai trang trọng “ông” (tại p000050) trong hội thoại, bảo toàn cấu trúc tăng tiến “không những... mà còn...” tại câu 5 p000042, các giả định/điều kiện và duy nhất 1 vị trí nhấn mạnh `*đang*` tại câu 2 p000046."
