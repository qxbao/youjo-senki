- id: ch05-b03-general-staff-personnel-operations-debate-pronouns-not-only-but-also-and-single-emphasis
  source_term: general_staff_personnel_operations_debate_pronouns_not_only_but_also_and_single_emphasis_ch05_b03
  proposed_vi: 'tiếp nối trực tiếp ch-05-b02 (p000020–p000041) tại Phòng Hội nghị Số 1 thuộc Văn phòng Bộ Tổng Tham mưu, toàn bộ 18 đoạn của lô ch-05-b03 (chapter011.xhtml/p000042–p000059) diễn ra dưới góc nhìn trần thuật ngôi thứ ba khách quan xoay quanh cuộc thảo luận giữa Cục Nhân sự, Cục Tác chiến (Chuẩn tướng von Rudersdorf) và nhóm của Zettour (Cục Quân vụ) về tình trạng bất mãn ở Cụm tập đoàn quân phía Đông và đề xuất thành lập lực lượng phản ứng nhanh cấp sư đoàn (Tanya không xuất hiện trong cảnh), tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác), DEC-P01-002 và style-guide.md: (1) Trong trần thuật ngôi thứ ba khách quan (p000042, p000045, p000048, p000049, p000051, p000052, p000054, p000056, p000058, p000059), quy chiếu tập thể Cụm tập đoàn quân phương Tây, Cụm tập đoàn quân phía Đông, binh lính ở phía đông, Cục Nhân sự, nhóm của Zettour và Bộ Tổng Tham mưu nhất quán bằng đại từ số nhiều trung tính “họ” / “Họ” kết hợp phản thân “mình” (p000042, p000045, p000048, p000051, p000052, p000054, p000058, p000059 — đồng bộ ch-05-b01 và ch-05-b02); lưu ý từ “nó” duy nhất ở mệnh đề cuối p000045 (“dù nó chỉ âm ỉ bên dưới bề mặt”) hoàn toàn chỉ quy chiếu danh từ trừu tượng bất động vật là “nỗi sợ bị đàn em và đồng cấp vượt mặt” / “mối lo ngại lớn lao”. (2) Trong hội thoại thảo luận tại cuộc họp Bộ Tổng Tham mưu (p000043, p000044, p000046, p000047, p000050, p000053, p000055, p000057), người phát biểu tự xưng “Tôi” (p000043, p000055), dùng “chúng tôi” khi đại diện cho nhóm của Zettour / Cục Quân vụ trình bày đề xuất thử nghiệm trước cuộc họp (p000053), dùng nhất quán đại từ ngôi thứ nhất số nhiều gộp “Chúng ta” / “chúng ta” cho tập thể Bộ Tổng Tham mưu và Quân đội Đế quốc (p000047, p000055, p000057), và quy chiếu Cụm tập đoàn quân phía Đông bằng “Họ” / “họ” (p000044, p000046); tại câu hỏi xác nhận ở p000050 khi Chuẩn tướng von Rudersdorf của Cục Tác chiến hỏi đại diện Cục Nhân sự (như được nêu rõ ở p000051), dùng đại từ ngôi thứ hai trang trọng “ông” (đồng bộ ch-05-b02 p000026). (3) Bảo toàn nguyên vẹn cấu trúc tăng tiến “không những... mà còn...” giữ cùng một chủ thể bị động (“Một số sĩ quan”) tại câu 5 p000042 theo đúng style-guide.md (“Một số sĩ quan không những bị chính các bạn đồng khóa cũ vượt mặt mà còn bị cả những đàn em vào ngành sau mình bỏ lại phía sau.”), câu hỏi xác nhận trực tiếp ở p000050 và câu hỏi gián tiếp ở p000051, cùng chính xác thời gian, phủ định và mức độ chắc chắn của các cấu trúc giả định và điều kiện (điều kiện giả định ở câu 1 p000042; phủ định thận trọng “không dám đánh giá thấp” ở p000043; phủ định ở câu 1 p000045 và câu 1 p000046; phủ định ở câu 2, giả định tiền đề ở câu 3 và giả định đánh giá ở câu 4 p000048; giả định phương án thực tế nhất ở câu 1 p000051; phủ định giả định, so sánh và mức độ khả năng “có khả năng” ở p000052; câu điều kiện giả định ở câu 3 p000054; giả định hệ quả ở p000057; quan hệ nhân quả ở câu 2 và mệnh đề nhượng bộ kèm giả định hệ quả ở câu 3 p000058). (4) Bảo toàn chính xác vị trí và phạm vi nhấn mạnh Markdown `*đang*` ở câu 2 của đoạn p000046 (`Họ *đang* trấn giữ biên giới phía đông đấy, nhưng người ta lại coi thường họ như những kẻ ăn không ngồi rồi.`) tương ứng với thẻ `<html:em>` duy nhất trong toàn bộ `xhtml` nguồn của lô, tuyệt đối không dùng dấu `*` ở bất kỳ vị trí nào trong 17/18 đoạn còn lại theo đúng DEC-P01-002'
  alternatives_vi:
  - các ông hoặc ngài (thay cho đại từ ngôi thứ hai “ông” trong câu hỏi xác nhận của Rudersdorf với đại diện Cục Nhân sự tại p000050 — ưu tiên “ông” đồng bộ với cách xưng hô công vụ trang trọng giữa các đại diện các cục thuộc Bộ Tổng Tham mưu ở ch-05-b02 p000026) / chúng ta (thay cho “chúng tôi” trong lời đề xuất của nhóm Zettour tại p000053 — ưu tiên “chúng tôi” vì p000054 làm rõ đây là đề xuất riêng của nhóm Zettour trình ra trước cuộc họp và đang vấp phải sự phản đối của Cục Tác chiến)
