- id: ch03-b02-tanya-pov-dissociation-pronouns-and-correlative-structure
  source_term: Tanya third-person narration/POV-dissociation pronouns and first-person interior monologue pronouns across p000024–p000029 and p000031–p000033, intra-paragraph POV shifts in p000026/p000027/p000028/p000033, correlative structure with subject shift in p000026, plural pronoun references to Imperial higher-ups and army groups in p000032–p000034/p000037, radio report in p000030, and absence of italicized emphasis across p000024–p000037
  proposed_vi: tiếp nối cảnh bay trinh sát đơn độc trên bầu trời mặt trận Rhine từ ch-03-b01, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–3: trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi Tanya tự tách góc nhìn nhắc tới danh tính bên ngoài (p000024, câu 4 p000026, câu 1 p000027, câu 2 p000028, p000031, câu 1 p000032), dùng tên riêng “Tanya” và đại từ trần thuật “nó” / “Nó” kết hợp phản thân “chính mình” (p000024, p000026, p000028, p000031 — tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm của Tanya); trong các câu độc thoại nội tâm ngôi thứ nhất của Tanya (p000025, câu 1 p000026, câu 2 p000027, câu 1 và 3 p000028, câu 1 p000029, câu 2 p000033), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “bản thân”; bảo toàn chính xác các vị trí chuyển đổi giữa ngôi thứ nhất nội tâm (“mình”) và ngôi thứ ba trần thuật/tự tách góc nhìn (“Tanya” / “nó”) ngay trong cùng đoạn văn tại p000026 (câu 1 dùng “mình”, câu 3 tự quy chiếu gián tiếp bằng “một cá nhân có tâm hồn tự do nọ”, câu 4 dùng “Tanya” và “nó”), p000027 (câu 1 dùng “Tanya”, câu 2 dùng “mình”), p000028 (câu 1 và 3 dùng “mình”, câu 2 dùng “Tanya” và “tâm trí nó”) và p000033 (câu 1 tiếp nối phân tích ngôi thứ ba dùng “họ”, câu 2 chuyển sang “Mình”); bảo toàn chính xác cấu trúc tăng tiến khi hai mệnh đề đổi chủ thể tại câu 4 p000026 (“Thiết bị này không những bị nguyền rủa, mà điều gây bực bội nhất trong tất cả lại là việc Tanya...”) theo đúng style-guide.md; quy chiếu cấp trên/giới chỉ huy Đế quốc (p000032–p000033), Cụm tập đoàn quân phương Bắc / các cụm tập đoàn quân (p000034) và những kẻ ngu xuẩn biện bạch (p000037) bằng đại từ số nhiều “họ” / “Họ”; bảo toàn câu điều kiện giả định ở câu 3 p000034 và không dùng `*...*` ở bất kỳ đoạn nào theo đúng DEC-P01-002 do nguồn không có thẻ nhấn mạnh
  alternatives_vi: []
