  rationale: "Kế thừa đồng bộ “quả cầu tính toán”, “nguyên mẫu”, “mana”, “người vận hành” và “dung sai” từ ch-02-b01/b02, cùng quy ước giữ nguyên định danh mẫu “Type 95”, tên nhà sản xuất “Elinium Arms” và cách dịch “con dấu “nghiên cứu kỹ thuật”” từ sổ pending (vol02-ch05-b12-elinium-type-95, chapter7_b10_argon_decisions); khóa tạm cụm định danh đầy đủ “nguyên mẫu quả cầu tính toán Type 95 của Elinium Arms” và hệ thống thuật ngữ kỹ thuật của Type 95 gồm “hiệu suất chuyển hóa ma pháp”, “trữ lượng mana”, “thông số kỹ thuật”, “lõi” / “đồng bộ hóa cả bốn lõi” / “kích hoạt đồng bộ bốn lõi” và “thu nhỏ”."
