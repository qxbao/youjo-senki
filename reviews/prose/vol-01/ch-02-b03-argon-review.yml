  - YS-LN01/Text/chapter005.xhtml/p000066
  volume: vol-01
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“mình”), trần thuật ngôi thứ ba (“Tanya” / “nó”), thủ pháp tự tách góc nhìn giữa hai mệnh đề trong câu p000059, câu ý nghĩ in nghiêng tại p000055, và xưng hô công vụ qua vô tuyến (“Thiếu úy Degurechaff / cô – tôi”)."
