- id: ch02-b03-tanya-pronouns-pov-dissociation-and-control-radio-dialogue
  source_term: Tanya first-person interior monologue and third-person narration pronouns, intra-sentence self-dissociation between first-person narrator and third-person Tanya in p000059, italicized inner thought in p000055, and formal radio dialogue pronouns between Control and Tanya in p000053/p000056
  proposed_vi: trong các đoạn/mệnh đề độc thoại nội tâm ngôi thứ nhất của Tanya (p000050–p000052, p000054, p000059, p000066), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” theo đúng DEC-P01-001; trong các đoạn/mệnh đề trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể nội tâm tự tách góc nhìn đối với danh tính bên ngoài (p000049, p000055, p000058, p000059), dùng tên riêng “Tanya” và đại từ trần thuật “nó” theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01/b02 (tuyệt đối tránh dùng “cô” trong lời kể hay nội tâm về Tanya; lưu ý từ “nó” tại p000057, p000060, p000061, p000063–p000066 quy chiếu quả cầu tính toán và tại p000058 quy chiếu khoảng cách chênh lệch về độ cao); đặc biệt tại p000059, bảo toàn chính xác sự chuyển ngôi ngay trong cùng một câu của văn bản nguồn từ ngôi thứ nhất “mình” ở vế giả định trước dấu chấm phẩy sang tên riêng “Tanya” ở vế thực tại sau dấu chấm phẩy; tại p000055, bảo toàn nhấn mạnh `*...*` theo DEC-P01-002 cho câu ý nghĩ in nghiêng; tại p000049, quy chiếu vị sĩ quan cấp trên bằng “Vị chỉ huy của nó” và đại từ “ông”; trong liên lạc vô tuyến với Đài kiểm soát, Đài kiểm soát gọi Tanya là “Thiếu úy Degurechaff” và dùng đại từ ngôi thứ hai công vụ “cô” (p000053), còn Tanya tự xưng “tôi” trong lời báo cáo và lời than thở thành tiếng (p000056)
  alternatives_vi:
  - cậu / đồng chí (thay cho “cô” trong lời gọi qua vô tuyến của Đài kiểm soát tại p000053 — ưu tiên “cô” đồng bộ với ch-02-b01/b02 và Chương 1 trong giao tiếp công vụ với nữ sĩ quan Đế quốc)
  segment_ids:
