  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001: giữ sự phân tách nhất quán giữa điểm nhìn của Thiếu tá von Lergen (dùng “ông” cho Lergen và “cô bé” / “cô” cho Tanya tùy theo bình diện tuổi tác hay chức trách sĩ quan) và giọng quát tháo uy áp “ta – ngươi” của Tanya khi trấn áp thuộc cấp bất tuân lệnh."
