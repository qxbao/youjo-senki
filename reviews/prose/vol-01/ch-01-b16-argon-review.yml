- id: b16-lergen-pov-pronouns-and-tanya-disciplinary-threat-voice
  source_term: Major von Lergen third-person pronouns, Tanya Degurechaff child/officer references from Lergen’s POV, insubordinate cadet reference, and Tanya’s direct disciplinary threat dialogue
  proposed_vi: trần thuật ngôi thứ ba tiếp tục đặt dưới điểm nhìn của Thiếu tá von Lergen, quy chiếu Lergen nhất quán bằng đại từ “ông” kết hợp tên riêng “Lergen” (p000285–p000287, p000289, p000290, p000293 — đồng bộ b15-lergen-pov-pronouns-and-tanya-reference); quy chiếu Tanya Degurechaff dưới góc nhìn của Lergen bằng “Cô bé” / “cô bé” trong ghi chú nội tâm và khi nhấn mạnh độ tuổi chưa tròn mười tuổi (p000285, p000287 — đồng thời dùng “các em” cho nhóm trẻ em tiểu học số nhiều tại p000286), và bằng “cô” kèm chức danh/tên riêng khi nói về tư cách học viên/sĩ quan (p000287–p000290, p000293 — tuân thủ nghiêm ngặt giới hạn DEC-P01-001: không dùng “nó” ngoài điểm nhìn của Tanya); quy chiếu học viên năm dưới vi phạm quân kỷ bằng “gã” / “tên học viên sĩ quan bất tuân thượng lệnh” (p000290, p000291, p000293); trong lời quát nạt đe dọa bổ đôi hộp sọ khi Tanya ghì chặt tên học viên bất tuân xuống đất và rút lưỡi kiếm ma pháp tại p000293, dùng cặp đại từ áp đảo “ta – ngươi”
  alternatives_vi:
  - tôi – anh (thay cho “ta – ngươi” trong tiếng hét của Tanya tại p000293 — ưu tiên “ta – ngươi” vì phản ánh đúng cơn thịnh nộ sát phạt và sát khí định xử tử tại chỗ khiến các giảng viên phải lao vào giữ lại)
  segment_ids:
