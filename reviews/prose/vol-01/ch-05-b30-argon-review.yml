findings:
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000110
    severity: minor
    category: pronoun_style
    issue: "Ở câu 3 của p000110 (trần thuật ngôi thứ ba từ điểm nhìn của đoàn thanh tra), cụm 'đơn vị của mình' dùng đại từ phản thân 'mình' cho chủ ngữ ngôi thứ ba ('cô'), trong khi câu 1 cùng đoạn đã dùng 'đơn vị của cô' (tương tự ở câu 2 của p000088 với cụm 'chức trách của mình' cho chủ ngữ phiếm chỉ ngôi thứ ba)."
    basis: "Dù 'mình' làm đại từ phản thân ngôi thứ ba là cách diễn đạt tự nhiên trong tiếng Việt, quy ước DEC-P01-001 đã dành đại từ 'mình' cho tự quy chiếu nội tâm ngôi thứ nhất của Tanya."
    recommendation: "Không ảnh hưởng nghĩa hay điểm nhìn; ở bước chuốt văn có thể cân nhắc lược bớt hoặc đổi thành 'đơn vị' / 'đơn vị của cô' tại câu 3 của p000110 (và 'xứng đáng với chức trách' tại câu 2 của p000088) để giữ 'mình' thuần túy cho độc thoại nội tâm của Tanya."
