    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000102
    pov_and_pronouns: "Thoại quát tháo qua vô tuyến của Tanya với các pháp sư trong tiểu đoàn: gọi 'Lũ đầu đất các người'."
    terms_and_ranks: "Không có thuật ngữ mới."
    modality_and_negation: "Giữ khẩu khí gay gắt và mệnh lệnh trực tiếp bắt bay cao hơn."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000103
    pov_and_pronouns: "Thoại của Tanya qua vô tuyến: gọi cấp dưới là 'Các người', tự xưng 'tôi'."
    terms_and_ranks: "tám nghìn feet."
    modality_and_negation: "Giữ câu cảm thán chê độ cao mới có tám nghìn feet, lời mắng 'Đồ yếu đuối.' và câu hỏi trách mắng phủ định 'Các người không nghe thấy tôi nói gì hả?'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000104
    pov_and_pronouns: "Trần thuật ngôi thứ ba từ điểm nhìn quan sát bên ngoài của đoàn thanh tra: theo đúng giới hạn của DEC-P01-001, quy chiếu Tanya là 'một đứa trẻ—một cô bé' / 'cô bé' / 'cô' (không dùng 'nó')."
    terms_and_ranks: "máy vô tuyến; mana."
    modality_and_negation: "Giữ sự tương phản ở câu 2 ('Thật khó tin, nhưng đó lại là giọng của một đứa trẻ—một cô bé.') và sự đe dọa không khoan nhượng ('sẵn sàng thẳng tay bắn rụng bất kỳ kẻ nào dám bay thấp hơn') ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000105
    pov_and_pronouns: "Thoại của Tanya qua vô tuyến: gọi các pháp sư là 'các người', dùng 'chúng ta' chỉ phía Quân đội Đế quốc."
    terms_and_ranks: "tài nguyên; đồng đội."
    modality_and_negation: "Giữ câu hỏi ngắn phủ định 'Không làm được hả?', chuỗi câu mệnh lệnh ngắn dồn dập và câu điều kiện thực dụng ở câu 4."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000106
    pov_and_pronouns: "Trần thuật ngôi thứ ba từ điểm nhìn bên ngoài: quy chiếu Tanya bằng 'cô', quy chiếu các pháp sư bằng 'họ'."
    terms_and_ranks: "thuật thức oanh kích; độ cao; mana; pháp sư."
    modality_and_negation: "Giữ câu điều kiện giả định ở câu 1, cấu trúc điều kiện loại trừ kép 'mà chưa ngất đi hoặc chưa cạn sạch mana trước đó thì chắc chắn sẽ bị bắn rụng khỏi bầu trời' ở câu 2, và mệnh đề phủ định 'các pháp sư cũng chẳng ngờ cô lại làm thật' đối lập với thực tế ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000107
    pov_and_pronouns: "Thoại mệnh lệnh của Tanya qua vô tuyến."
    terms_and_ranks: "Không có thuật ngữ mới."
    modality_and_negation: "Giữ cấu trúc lựa chọn mệnh lệnh đặc trưng 'hoặc là chết đi, hoặc là bay cao hơn nữa'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000108
    pov_and_pronouns: "Trần thuật ngôi thứ ba nhận định chung."
    terms_and_ranks: "tiền lệ."
    modality_and_negation: "Giữ câu khẳng định ngắn gọn 'Hôm nay lại là một ngày nữa phá vỡ mọi tiền lệ.'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000109
    pov_and_pronouns: "Lời lẩm bẩm của Thiếu tá von Degurechaff: dùng đại từ ngôi thứ nhất số nhiều 'chúng ta'."
    terms_and_ranks: "pháp sư; Quân đội Cộng hòa; tám nghìn; mười nghìn."
    modality_and_negation: "Giữ quan hệ kéo theo giữa khả năng của đối phương ('có thể vươn tới độ cao tám nghìn') và mục tiêu đặt ra cho đơn vị ('nên chúng ta phải nhắm tới mức mười nghìn')."
    emphasis: "Bảo toàn chính xác dấu *...* bao trọn toàn bộ câu tương ứng 1:1 với thẻ <html:em> trong xhtml nguồn theo DEC-P01-002."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000110
    pov_and_pronouns: "Trần thuật ngôi thứ ba từ góc nhìn đoàn thanh tra: gọi 'Thiếu tá von Degurechaff' và quy chiếu bằng 'cô' theo đúng giới hạn chủ thể của DEC-P01-001 (lưu ý gợi ý nhỏ ở findings về từ phản thân ở câu 3)."
    terms_and_ranks: "Thiếu tá von Degurechaff; đơn vị; các thanh tra viên; sáu nghìn feet; tám nghìn."
    modality_and_negation: "Giữ nguyên từ trong ngoặc kép '“lập tức”' ở câu 1, nhận định thông thường ('bị coi là tự sát') ở câu 2 và sự đối lập ('Thế nhưng cô lại thản nhiên ra lệnh...') ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000111
    pov_and_pronouns: "Trần thuật ngôi thứ ba khép lại chương 5 từ góc nhìn của các sĩ quan quan sát: quy chiếu Tanya bằng 'cô' / 'Cô', quy chiếu các pháp sư trong tiểu đoàn bằng 'họ'."
    terms_and_ranks: "đám lính bất tài; những quân nhân tinh nhuệ; lực lượng tinh nhuệ."
    modality_and_negation: "Giữ sự đối lập nhượng bộ ở câu 1 ('Chuyện đó nghe có vẻ điên rồ, nhưng cô hoàn toàn nghiêm túc...'), câu phủ định 'Cô không hề nói ngoa.' ở câu 2, câu khẳng định hoàn tất 'Cô đã làm được điều đó.' ở câu 3 và sự đối lập ở câu kết chương ('Cô đã quất roi rèn luyện họ đến mức đổ máu, nhưng họ đã thực sự trở thành lực lượng tinh nhuệ.')."
    emphasis: "Không dùng dấu *...*."
