- id: ch05-b04-general-staff-approval-and-1967-wtn-reporter-pov-pronouns-modality-and-emphasis
  source_term: general_staff_approval_and_1967_wtn_reporter_pov_pronouns_modality_and_emphasis_ch05_b04
  proposed_vi: 'Toàn bộ 26 đoạn của lô ch-05-b04 (chapter011.xhtml/p000060–p000085) gồm hai phân cảnh rõ rệt — phần kết cuộc họp tại Văn phòng Bộ Tổng Tham mưu phê chuẩn việc thành lập thử nghiệm tiểu đoàn pháp sư phản ứng nhanh của Chuẩn tướng von Zettour (p000060–p000077) và phân cảnh hậu chiến ngày 23 tháng 6 năm Thống nhất 1967 tại Phòng Báo chí WTN ở Londinium dưới góc nhìn tự sự ngôi thứ nhất của người phóng viên chiến trường (p000078–p000085) — tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (Tanya không xuất hiện trong cả hai phân cảnh; tuyệt đối không dùng đại từ “nó” ở bất kỳ đoạn nào), DEC-P01-002 và canon/style-guide.md: (1) Trong phân cảnh 1 tại cuộc họp Bộ Tổng Tham mưu (p000060–p000077): ở trần thuật ngôi thứ ba khách quan (p000062, p000064, p000066, p000067, p000070, p000071, p000073, p000075, p000077), quy chiếu Chuẩn tướng von Zettour nhất quán bằng tên riêng “Zettour” và đại từ trang trọng “ông” kết hợp phản thân “mình” (p000064, p000075, p000077 — đồng bộ ch-04-b16), quy chiếu tập thể Bộ Tổng Tham mưu, Cục Tác chiến, nhóm của Zettour / Cục Quân vụ và tiểu đoàn pháp sư bằng đại từ số nhiều “Họ” / “họ” kết hợp phản thân “mình” (p000062, p000066, p000067, p000070, p000075 — đồng bộ ch-05-b01 → ch-05-b03), và quy chiếu quân Liên minh Entente ở phía bắc bằng “bọn chúng” (p000062); trong hội thoại tại cuộc họp (p000060, p000061, p000063, p000065, p000068, p000069, p000072, p000074, p000076), dùng đại từ ngôi thứ nhất số nhiều gộp “chúng ta” cho tập thể cuộc họp (p000060, p000063, p000074, p000076), dùng “Chúng tôi” thể hiện thẩm quyền phê chuẩn chính thức của cấp lãnh đạo chủ trì cuộc họp tại p000072, giữ hệ xưng hô ngang cấp trang trọng “tôi – ông” / “Ông” khi đại diện Cục Tác chiến trao đổi với Zettour tại p000065, p000068 (đồng bộ ch-05-b02 p000026, ch-05-b03 p000050), và kế thừa danh xưng số nhiều trang trọng “thưa các vị” tại p000076 (plural-address-p000076 / chapter-zero-p076-address). (2) Trong phân cảnh 2 tại Phòng Báo chí WTN năm 1967 (p000078–p000085): dưới điểm nhìn tự sự ngôi thứ nhất của nhà báo hãng tin WTN (Andrew), người kể tự xưng “Tôi” / “tôi” khi nói về cá nhân mình (p000080–p000082) và dùng “chúng tôi” / “Chúng tôi” khi nói về nhóm làm phim tài liệu cùng những người bạn cùng chí hướng (p000081, p000083, p000084 — đồng bộ hoàn toàn với các phân cảnh phóng sự hậu chiến của Andrew ở Tập 2 và Tập 4). (3) Bảo toàn chính xác câu hỏi giả định ở p000060, mức độ dè dặt “Có lẽ” kèm điều kiện thời gian ở p000061, giả định tương lai, mệnh đề nhượng bộ, so sánh giả định và phủ định tuyệt đối ở p000062, câu hỏi đề xuất ở p000063, điều kiện giả định ở vế cuối p000066, câu hỏi xác nhận ở p000068, suy đoán hợp lý “hẳn vẫn còn” và giả định thuận lợi ở p000069, mệnh đề nhượng bộ giả định “Ngay cả khi... vẫn sẽ tương đối thấp” và điều kiện khả thể “Nếu cần, đơn vị này thậm chí còn có thể...” ở p000071, phủ định đánh giá ở p000073, mức độ chắc chắn cao “gần như chắc chắn sẽ dẫn tới” ở p000075, dự đoán tương lai từ điểm nhìn quá khứ ở câu 1 p000077, phủ định mục đích ở câu 1 p000081, câu hỏi trực tiếp và khả thể lập luận ở p000083, cùng câu hỏi tìm nguyên nhân và suy luận tất yếu “ắt hẳn phải có liên quan” ở p000085. (4) Bảo toàn chính xác cả 3 đoạn có nhấn mạnh Markdown `*...*` theo đúng DEC-P01-002 tương ứng với thẻ `<html:em>` trong xhtml nguồn tại p000080 (`*World Today News*`), p000081 (`*WTN*`) và p000085 (`*Hood*`); giữ nguyên “WTN” không bọc dấu `*` tại tiêu đề p000078 vì xhtml nguồn chỉ dùng `<html:span class="it1">` mà không có `<html:em>` hay `<html:i>`, và tuyệt đối không dùng dấu `*` ở 22 đoạn còn lại.'
  alternatives_vi:
  - tôi – ngài / Ngài (thay cho hệ xưng hô ngang cấp “tôi – ông” / “Ông” trong cuộc họp Bộ Tổng Tham mưu tại p000065, p000068 — ưu tiên “tôi – ông” / “Ông” đồng bộ với ch-05-b02 p000026 và ch-05-b03 p000050) / Chúng ta (thay cho “Chúng tôi” trong lời phê chuẩn chính thức tại p000072 — ưu tiên “Chúng tôi” để thể hiện rõ giọng thẩm quyền phê chuẩn của cấp chủ trì cuộc họp đối với đề xuất thử nghiệm của Zettour) / các quý ông (thay cho “các vị” tại p000076 — ưu tiên “thưa các vị” theo đề xuất đã khóa tạm ở plural-address-p000076 / chapter-zero-p076-address)
