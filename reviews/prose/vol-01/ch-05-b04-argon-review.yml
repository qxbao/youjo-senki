  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, địa danh và thuật ngữ quân sự – báo chí từ Chương 0–4, ch-05-b01 → ch-05-b03 và các tập sau: “đạo quân phía đông” / “đạo quân phía nam” (p000060, p000069 — viết thường danh từ chung tương ứng với nguồn để phân biệt với phiên hiệu viết hoa “Cụm tập đoàn quân phía Đông” ở p000070, đồng bộ với “đạo quân phía tây” ở ch-05-b01 p000005, ch-05-b02 p000036 và “các đạo quân khu vực ở phía đông và phía nam” ở ch-05-b02 p000039), “Liên minh Entente” (ch-01-b03 p000040, ch-05-b03 p000046, p000062), “truy quét” (ch-03-b20 p000422, p000062), “lực lượng chủ lực” và “Đại Quân” (ch-05-b01 p000007, p000062), “tiểu đoàn pháp sư” (ch-02-b04 p000003, ch-03-b12 p000244, p000063, p000067–p000070, p000072), “Central” (b05-central-command / ch-05-b01 p000013, ch-05-b02 p000037, p000041, p000063), “Cục Quân vụ”, “Zettour” và “Cục Tác chiến” (ch-05-b01 → ch-05-b03, p000064, p000066, p000077), “tiền tuyến” (ch-05-b01 p000005, p000067), “sức chiến đấu” (ch-05-b01 p000005, p000070), “Cụm tập đoàn quân phía Đông” (vol02-ch01-b10-eastern-army-group / ch-05-b03, p000070), “đại đội bộ binh” (p000070 — đồng bộ cấu trúc với “tiểu đoàn bộ binh” ở ch-04-b21/b22), “hậu cần” (b02-logistical-command, p000071), “Văn phòng Bộ Tổng Tham mưu” (ch-05-b01 p000001, p000003, p000072), “NĂM THỐNG NHẤT” (P01-unified-year, p000078), “LONDINIUM” (ch-01-b06 p000089, p000078), “WTN” / `*WTN*` / `*World Today News*` (vol-02-ch-03-b02, vol-02-ch-06-b01, vol-04-ch-01-b20, p000078, p000080, p000081), “chiến tranh thế giới” (ch-04-b16 p000121, p000079), “Đế quốc” (p000080), “bộ phim tài liệu” và “được giải mật” / “giải mật” (vol-02-ch-06-b01 p000004, p000026, p000081, p000083, p000084), “Khối Thịnh vượng chung” (ch-04-b13 p000031, ch-04-b19 p000194, ch-04-b20 p000214, p000084, p000085), “Hải đội 2” / “hải đội” (vol-02-ch-04-b07 p000154, p000085) và “kỳ hạm” (vol-02-ch-03-b12 p000134, p000085); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “đặt cái cày trước con trâu” và “đội cứu viện” (p000062), “Bộ Tư lệnh Sẵn sàng Chiến đấu” (p000063, p000074, p000075), “tiểu đoàn pháp sư phản ứng nhanh” (p000064, p000075), “Dự án tâm huyết” (p000065), “quy mô cấp tiểu đoàn” và “cấp quân đoàn” (p000066 — dịch chính xác danh từ chỉ bộ phận hành chính của Cục Tác chiến ở đầu câu 2 là “Cơ quan của họ” để không nhầm với đơn vị “sư đoàn”), “vận chuyển bằng đường không” (p000069), “nhu yếu phẩm theo tiêu chuẩn quy định” và “tác động về mặt hậu cần” (p000071), “quyền chỉ huy trực tiếp” (p000072), “PHÒNG BÁO CHÍ WTN” (p000078), “phóng viên chiến trường tác nghiệp theo các đơn vị quân đội” và “cuộc đại chiến” (p000080), “ban biên tập” (p000081), “Sự kiện Dakar” và “chiến thuật nghi binh” (p000084), cùng “Hải quân Khối Thịnh vượng chung”, `*Hood*` và “bị đóng dấu mật” (p000085)."
