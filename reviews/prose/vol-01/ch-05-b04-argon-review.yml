  - tập đoàn quân phía đông và tập đoàn quân phía nam (thay cho “đạo quân phía đông” và “đạo quân phía nam” tại p000060, p000069 — ưu tiên “đạo quân phía đông” / “đạo quân phía nam” viết thường danh từ chung để phân biệt rõ với phiên hiệu viết hoa “Cụm tập đoàn quân phía Đông” tại p000070 và đồng bộ với “đạo quân phía tây” ở ch-05-b01 p000005, ch-05-b02 p000036 cùng “các đạo quân khu vực ở phía đông và phía nam” ở ch-05-b02 p000039) / đặt cỗ xe trước con ngựa và đội ứng cứu (thay cho “đặt cái cày trước con trâu” và “đội cứu viện” tại p000062 — ưu tiên “đội cứu viện” đồng bộ với “lực lượng cứu viện” ở ch-05-b01 p000013) / Bộ Tư lệnh Ứng chiến hoặc Bộ Chỉ huy Sẵn sàng Chiến đấu (thay cho “Bộ Tư lệnh Sẵn sàng Chiến đấu” tại p000063, p000074, p000075 — ưu tiên “Bộ Tư lệnh Sẵn sàng Chiến đấu” để giữ đồng bộ cấu trúc “Bộ Tư lệnh” với “Bộ Tư lệnh Hậu cần” ở b02-logistical-command và “các bộ tư lệnh khu vực” ở ch-05-b02 p000020, ch-05-b03 p000042) / Dự án cưng (thay cho “Dự án tâm huyết” tại p000065) / vật tư tiếp tế theo cơ số quy định (thay cho “nhu yếu phẩm theo tiêu chuẩn quy định” tại p000071) / PHÒNG TIN TỨC WTN hoặc TÒA SOẠN WTN (thay cho “PHÒNG BÁO CHÍ WTN” tại p000078) / phóng viên đi theo quân đội (thay cho “phóng viên chiến trường tác nghiệp theo các đơn vị quân đội” tại p000080) / Biến cố Dakar (thay cho “Sự kiện Dakar” tại p000084) / Phân hạm đội 2, soái hạm và bị xếp vào diện mật (thay cho “Hải đội 2”, “kỳ hạm” và “bị đóng dấu mật” tại p000085 — ưu tiên “Hải đội 2” và “kỳ hạm” đồng bộ với Tập 2 tại vol-02-ch-04-b07 p000154 và vol-02-ch-03-b12 p000134)
