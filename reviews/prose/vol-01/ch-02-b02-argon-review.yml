locked_choices:
- segment_id: YS-LN01/Text/chapter005.xhtml/p000022
  locks:
  - Giữ các thuật ngữ “đơn vị huấn luyện chiến đấu trong nước”, “Quân đội Đế quốc”, “thánh địa nghiên cứu chiến đấu”, “đơn vị huấn luyện”, cấu trúc hai vế khác chủ thể “các thành viên ở đó không chỉ được cấp những trang bị tốt nhất mà nơi đây còn là thánh địa nghiên cứu chiến đấu”, và sự tách biệt giữa đại từ nội tâm “mình” với danh tính bên ngoài “Tanya” (“để mình trau dồi kỹ năng của Tanya”, “trong hồ sơ của Tanya”).
- segment_id: YS-LN01/Text/chapter005.xhtml/p000023
  locks:
  - Giữ các cụm “Yêu cầu biệt phái tạm thời”, “bộ chỉ huy”, “nhân sự kiểm định công nghệ”, “công tác hậu phương”, “người kiểm định công nghệ”, “hậu phương” và đại từ nội tâm “mình”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000024
  locks:
  - Giữ tên hai cơ quan “Cục Đường sắt” và “Bộ Tổng Tham mưu” cùng câu điều kiện giả định về xác suất xảy ra tai nạn thấp.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000025
  locks:
  - Giữ xưng hô công vụ “Tôi – cô” trong câu hỏi xác nhận của vị chỉ huy.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000026
  locks:
  - Giữ danh từ “vị chỉ huy”, tên riêng “Tanya”, đại từ trần thuật “nó” theo DEC-P01-001, và ba từ đồng nghĩa giữ nguyên đa ngôn ngữ ““yes”, “oui” hoặc “ja””.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000027
  locks:
  - Giữ câu đáp công vụ ““Vâng, tôi không có gì phàn nàn cả. Tôi xin khiêm tốn chấp nhận lệnh điều động của mình.””.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000028
  locks:
  - Giữ tên cơ quan “Bộ Chỉ huy Tiếp vận và Hậu cần”, “mẫu mới”, “đơn vị huấn luyện”, ““thông báo không chính thức””, đại từ “Cô” / “cô” trong lời thoại của vị chỉ huy, đại từ “Ông” cho vị chỉ huy trong lời kể và đại từ nội tâm “mình” cho Tanya.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000029
  locks:
