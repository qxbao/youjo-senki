- segment_id: YS-LN01/Text/chapter005.xhtml/p000030
  locks:
  - Giữ đại từ nội tâm “Mình” / “mình” và đại từ “Ông ấy” quy chiếu vị chỉ huy.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000031
  locks:
