- segment_id: YS-LN01/Text/chapter005.xhtml/p000038
  locks:
  - Giữ hô ngữ cấp bậc “Thiếu úy” và đại từ tự xưng “Tôi” trong lời đáp của vị chỉ huy.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000039
  locks:
  - Giữ sự chuyển đổi giữa trần thuật ngôi thứ ba (“Tanya”, “nó”) và nội tâm ngôi thứ nhất (“Mình”) trong cùng đoạn theo đúng nguồn và DEC-P01-001, cùng cụm “Sự an toàn khi phục vụ ở hậu phương quả thực tuyệt vời.”.
- segment_id: YS-LN01/Text/chapter005.xhtml/p000040
  locks:
