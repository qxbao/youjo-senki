- id: ch02-b02-tanya-pronouns-pov-dissociation-and-commander-dialogue
  source_term: Tanya first-person interior monologue and third-person narration pronouns, intra-sentence/intra-paragraph self-dissociation between first-person narrator and third-person Tanya, generic impersonal pronoun in p000045, and formal military dialogue pronouns between the commander and Tanya
  proposed_vi: trong các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000022–p000024, p000028, p000030, p000032, p000033, p000035, p000037, p000039, p000043, p000045, p000046), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “bản thân” theo đúng DEC-P01-001; trong các câu/đoạn trần thuật ngôi thứ ba hoặc khi chủ thể nội tâm tự tách góc nhìn để quy chiếu danh tính/cơ thể bên ngoài của Tanya (p000022, p000026, p000033, p000037, p000039, p000043, p000045), dùng tên riêng “Tanya” và đại từ trần thuật “nó” theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01-tanya-pronouns-and-pov-shift-p000017 (tuyệt đối tránh dùng “cô” trong lời kể hay nội tâm về Tanya; bảo toàn chính xác các vị trí chuyển ngôi hoặc tách góc nhìn ngay trong cùng câu/đoạn của văn bản nguồn tại p000022, p000033, p000037, p000039, p000043 và p000045); tại câu so sánh khái quát ở p000045, dùng chủ ngữ phiếm chỉ “người ta”; trong lời kể và nội tâm (p000026, p000028, p000030, p000039, p000045), quy chiếu vị sĩ quan cấp trên trao lệnh bằng “vị chỉ huy” / “vị sĩ quan cấp trên” và đại từ “ông” / “Ông” / “ông ấy” / “Ông ấy”; trong đối thoại công vụ trực tiếp (p000025, p000027–p000029, p000031, p000036, p000038, p000040, p000041, p000044, p000047, p000048), vị chỉ huy tự xưng “Tôi” / “tôi” và gọi Tanya là “cô” / “Cô” / “Thiếu úy”, còn Tanya tự xưng “tôi” / “Tôi” và dùng “cấp trên” cho chủ ngữ ngôi thứ hai khi hỏi về quyết định phân công (p000031, p000036 — đồng bộ ch-02-b01)
  alternatives_vi:
  - ngài (thay cho “cấp trên” khi Tanya đặt câu hỏi cho vị chỉ huy tại p000031, p000036 — ưu tiên “cấp trên” vì chủ ngữ ngôi thứ hai trong câu hỏi của Tanya vừa hướng tới vị chỉ huy trước mặt vừa chỉ chung phía chỉ huy/tổ chức ra quyết định điều động, giữ giọng công vụ điềm tĩnh đúng sắc thái nguồn)
  segment_ids:
