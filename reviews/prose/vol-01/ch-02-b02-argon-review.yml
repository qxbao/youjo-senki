- segment_id: YS-LN01/Text/chapter005.xhtml/p000042
  locks:
  - Giữ các thuật ngữ “Cục Nhân sự”, “pháp sư”, “tiền tuyến”, “công tác huấn luyện hoặc phát triển công nghệ”.
