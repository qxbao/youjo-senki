  volume: vol-01
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“mình”), trần thuật ngôi thứ ba và sự tự tách góc nhìn đối với danh tính bên ngoài (“Tanya” / “nó”), cùng xưng hô công vụ chuẩn mực trong đối thoại trực tiếp (“Tôi – cô / Thiếu úy”, “tôi – cấp trên”)."
  uncertainty: low
