  source_term: Imperial War College Admissions Committee third-person narration pronouns for Tanya, the chairman, Lergen, intelligence officers, committee members, and new recruits in p000114/p000116–p000117/p000120–p000122/p000124–p000125/p000128–p000130/p000132–p000133/p000135/p000138–p000140/p000143, conference dialogue pronouns between the chairman, committee members, and Major von Lergen in p000113/p000115–p000116/p000118–p000119/p000122–p000123/p000126–p000127/p000131/p000134/p000136–p000137/p000141–p000142, drill-ground trainer threat pronouns in p000124–p000125, counterfactual conditionals and double negation in p000114/p000121–p000123/p000128/p000132/p000139, and exact preservation of italicized spans in p000116/p000122/p000124/p000125
  proposed_vi: tiếp nối và khép lại cảnh họp của Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc từ ch-04-b05 dưới góc nhìn trần thuật ngôi thứ ba khách quan (xen kẽ nhận thức tập thể của hội đồng và góc nhìn của Thiếu tá von Lergen), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của hội đồng hay Lergen): trong lời kể ngôi thứ ba khách quan (p000114, p000121, p000128, p000132, p000133, p000135, p000138), quy chiếu Trung úy Tanya Degurechaff nhất quán bằng đại từ “cô”, đồng bộ hoàn toàn với ch-04-b03 → ch-04-b05 và ch-01-b15 → ch-01-b18; quy chiếu vị chủ tọa và Thiếu tá von Lergen bằng đại từ trang trọng trung tính “ông” / “Ông” kết hợp phản thân “mình” / “bản thân” (p000116, p000122, p000132, p000138–p000140); quy chiếu các sĩ quan tình báo / bên Tình báo và tập thể các thành viên hội đồng bằng “họ” / “bọn họ” (p000114, p000117, p000122, p000128–p000130, p000132, p000133, p000138) và quy chiếu đám tân binh bằng “chúng” tại p000130; trong lời thoại tại cuộc họp: vị chủ tọa và các thành viên hội đồng tự xưng “tôi” / “Tôi” ở ngôi thứ nhất số ít (p000115, p000116, p000131, p000134, p000136), dùng “chúng ta” / “Chúng ta” khi nói trong nội bộ hội đồng (p000116, p000123, p000137) và “Chúng tôi” khi đại diện hội đồng thông báo kết luận cuối cùng cho người đệ trình yêu cầu là Lergen (p000141), gọi Thiếu tá von Lergen bằng “Thiếu tá von Lergen” / “Thiếu tá” / “anh” (p000113, p000123, p000131, p000134, p000136, p000141 — đồng bộ ch-04-b02 → ch-04-b05) và quy chiếu Tanya bằng “cô ấy”; Lergen quy chiếu Tanya trong lời thoại bằng “cô ấy” / “Cô ấy” và quy chiếu học viên bị Tanya chĩa kiếm bằng “cậu ta” (p000118, p000122); trong các câu quát tháo mẫu của người huấn luyện trên thao trường (p000124, p000125), dùng cặp đại từ “Tao – mày” đúng sắc thái huấn luyện khắc nghiệt trong quân đội; bảo toàn chính xác toàn bộ các câu hỏi trực tiếp và câu hỏi nội tâm tập thể (p000113, p000116, p000117, p000119), cấu trúc phủ định kép tại p000132, các câu điều kiện giả định trái thực tế và suy diễn hệ quả tại p000114, p000121–p000123, p000128, p000139, và bảo toàn tuyệt đối phạm vi nhấn mạnh `*...*` tại p000116 (`*Chúng ta sẽ xác minh sự thật của chuyện này.*`), p000122 (`*Không, chuyện này khác hẳn!*`), p000124 (`*Tao sẽ giết mày!*`) và p000125 (`*Tao sẽ đập nát gáo mày ra!*` và `*Tao sẽ thổi bay cái đầu rỗng tuếch của mày!*`) theo đúng DEC-P01-002
