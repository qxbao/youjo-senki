- segment_id: YS-LN01/Text/chapter009.xhtml/p000023
  locks:
  - Giữ các cụm “các trường hợp trúng tuyển ngay từ vòng đầu tiên”, “vị giảng viên”, hai bậc điểm ““xuất sắc”” và ““ưu tú””, “các bản đánh giá ẩn danh”, “Thiếu tá von Lergen” và “ứng viên được đề cử đứng đầu”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000024
  locks:
  - Giữ câu điều kiện giả định trái thực tế kèm mức độ khả năng “Nếu ứng viên là... thì việc lo ngại về sự thiên vị có lẽ còn hợp lý hơn” và cấu trúc phủ định kép “không phải là chưa từng nghe tới”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000025
  locks:
  - Giữ chuỗi phủ định về lý lịch/quan hệ của ứng viên, cấu trúc tăng tiến “Không chỉ có vậy, tất cả các sĩ quan đứng ra tiến cử đều là...” và cụm “những cựu binh nghiêm cẩn”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000026
  locks:
  - Giữ cụm “sĩ quan tự thân lập nghiệp”, phủ định “là điều không phù hợp với truyền thống của quân đội” và “Thiếu tá von Lergen”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000027
  locks:
  - Giữ cặp đại từ “tôi – anh” khi Chuẩn tướng von Rudersdorf hỏi Thiếu tá von Lergen, đại từ “ông” quy chiếu Rudersdorf trong trần thuật, cách quy chiếu trung tính đối với ứng viên ẩn danh (“đây là một ứng viên tuyệt vời” / “vị sĩ quan này”), phạm vi nhấn mạnh `*Tại sao?*` theo DEC-P01-002, cùng các cụm “Chuẩn tướng von Rudersdorf”, “thư tiến cử từ đơn vị”, “thứ hạng tại học viện”, “kết quả thẩm tra lý lịch từ bên Tình báo” và “báo cáo điều tra của quân cảnh”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000028
  locks:
  - Giữ “Hình thức tiến cử theo thành tích”, cụm chêm giữa hai dấu gạch ngang dài “—thực chất là mới chập chững vào nghề—” và “lục quân”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000029
  locks:
  - Giữ “Thư tiến cử từ đơn vị”, đối lập giữa “Hồ sơ học tập cho thấy có phần hơi thiếu hụt về huấn luyện thực hành” và “kinh nghiệm thực chiến vượt trội đã bù đắp cho điểm đó”, cùng “điểm xét duyệt gần như tuyệt đối”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000030
  locks:
  - Giữ “bên Tình báo và quân cảnh” cùng câu hỏi tu từ “Chuyện như vậy từ trước đến nay đã xảy ra được mấy lần cơ chứ?”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000031
  locks:
  - Giữ các đại từ “Tôi – nhiều vị ở đây – chúng ta” trong lời Rudersdorf, cách quy chiếu trung tính “đây là một trong những ứng viên triển vọng nhất”, đại từ “ông” trong trần thuật, “Chuẩn tướng von Rudersdorf”, “yêu cầu đánh giá lại”, “Cục Nhân sự”, “khiếm khuyết”, và câu điều kiện giả định trái thực tế trong quá khứ ở câu cuối.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000032
  locks:
  - Giữ đại từ “tôi” trong lời phát biểu của Thiếu tá von Lergen, đại từ “ông” quy chiếu Lergen trong trần thuật, cùng các cụm “khó có thể tiếp nhận” và “yêu cầu đánh giá lại”.
- segment_id: YS-LN01/Text/chapter009.xhtml/p000033
  locks:
