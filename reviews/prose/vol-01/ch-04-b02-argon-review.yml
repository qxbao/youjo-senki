  source_term: Imperial War College Admissions Committee third-person narration pronouns for Brigadier General von Rudersdorf, Major von Lergen, the chief of general affairs in Personnel, and collective committee/Intelligence/candidates, conference dialogue pronouns of Rudersdorf, Lergen, committee members, and the chief of general affairs, gender-neutral reference to the anonymized candidate prior to dossier reveal, italicized emphasis in p000027/p000036, and counterfactual conditionals in p000024/p000031/p000036/p000039
  proposed_vi: tiếp nối trực tiếp cảnh họp của Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc từ ch-04-b01 dưới góc nhìn trần thuật ngôi thứ ba khách quan và tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn hoặc chủ thể khác), trong lời kể ngôi thứ ba khách quan, quy chiếu Chuẩn tướng von Rudersdorf (p000027, p000031), Thiếu tá von Lergen (p000031, p000032) và trưởng ban tổng vụ bên Cục Nhân sự (p000037, p000038) bằng đại từ trang trọng trung tính “ông” / “Ông” kết hợp đại từ phản thân “mình” (đồng bộ ch-04-b01 và Chương 1–2), đồng thời quy chiếu bên Tình báo (p000033), tập thể hội đồng tuyển sinh (p000036) và các ứng viên số nhiều (p000037) bằng “Họ” / “họ”; trong lời thoại tại cuộc họp, Chuẩn tướng von Rudersdorf (p000027, p000031) tự xưng “tôi” / “Tôi”, gọi cấp dưới là Thiếu tá von Lergen bằng “Thiếu tá von Lergen” / “anh” (p000027), gọi các thành viên hội đồng là “nhiều vị ở đây” và dùng “chúng ta” cho hội đồng/lục quân (p000031), Thiếu tá von Lergen (p000032) và trưởng ban tổng vụ bên Cục Nhân sự (p000037) đều tự xưng “tôi” / “Tôi”, còn các thành viên hội đồng phát biểu tại p000036 dùng “chúng ta”; đối với ứng viên đang được xét duyệt ẩn danh (thực chất là Tanya nhưng toàn bộ thông tin cá nhân, huân chương và niên khóa đã bị che đi theo p000018–p000019, p000034 và danh tính chỉ mới bắt đầu được mở ra ở cuối p000037), dùng cách quy chiếu trung tính không áp đặt giới tính (“đây là một ứng viên tuyệt vời” / “vị sĩ quan này” tại p000027, “đây là một trong những ứng viên triển vọng nhất” tại p000031, “Ứng viên này” / “đây là một người yêu nước” / “người này” tại p000033, “người này” tại p000034 và p000036, “Ứng viên này” tại p000039) để vừa trung thành với trạng thái hồ sơ ẩn danh vừa tránh tạo tiền giả định giới tính nam giả tạo trước khi danh tính Tanya được tiết lộ; bảo toàn chính xác hai vị trí nhấn mạnh Markdown `*Tại sao?*` tại p000027 và `*Xuất chúng*` tại p000036 theo đúng DEC-P01-002 (không dùng `*...*` ở 15 đoạn còn lại), cấu trúc tăng tiến “Không chỉ có vậy, tất cả các sĩ quan đứng ra tiến cử đều là...” tại p000025, cùng các câu điều kiện giả định trái thực tế tại p000024, p000031, p000036 và giả định theo thông lệ tại p000039
  alternatives_vi:
  - anh ta / cậu ta (thay cho cách quy chiếu trung tính “đây là một ứng viên...” / “vị sĩ quan này” / “Ứng viên này” / “người này” trong lời thoại của Rudersdorf và hội đồng tại p000027, p000031, p000033 — ưu tiên cách quy chiếu trung tính vì nguồn tiếng Anh chỉ dùng đại từ ngôi thứ ba mặc định cho một sĩ quan ẩn danh chưa rõ danh tính và DEC-P01-001 quy định không tự suy diễn/áp đặt giới tính khi ngữ cảnh trong cảnh chưa xác nhận)
