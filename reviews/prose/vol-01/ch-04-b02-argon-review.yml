  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–4: giữ sự nhất quán của điểm nhìn khách quan tại cuộc họp Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc nối tiếp ch-04-b01 (trần thuật dùng “ông” cho Rudersdorf, Lergen và trưởng ban tổng vụ bên Cục Nhân sự, dùng “họ” cho tập thể hội đồng/bên Tình báo/các ứng viên; lời thoại dùng “tôi – anh”, “Tôi – nhiều vị ở đây – chúng ta”; giữ cách quy chiếu trung tính đối với ứng viên ẩn danh; bảo toàn nhấn mạnh tại p000027 và p000036)."
