    choices:
      - "Số liệu, thuật ngữ & mệnh đề nhượng bộ: trong lời Đại úy von Degurechaff, khóa tỷ lệ 'năm cặp trên mười cặp', 'đạo quân trung ương', 'đại đội' và cấu trúc nhượng bộ 'Ngay cả khi tính thêm... chừng đó vẫn chỉ đủ cho một đại đội.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000564
    choices:
      - "Điểm nhìn & đại từ (DEC-P01-001), số liệu & điều kiện nhượng bộ: tiếp nối điểm nhìn của nhóm sĩ quan cấp cao tại Phòng tiếp khách số 7 (từ ch-05-b21 và ch-05-b22), quy chiếu Đại úy von Degurechaff bằng 'cô'; khóa 'mười hai người', 'vòng sàng lọc ban đầu', 'đại đội', '25 phần trăm' và điều kiện giả định 'Ngay cả khi nhận tất cả số đó, cô cũng chỉ có đủ người cho một đại đội.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000565
    choices:
      - "Xưng hô thoại, số liệu & thuật ngữ: trong lời Đại úy von Degurechaff nói với hội đồng, giữ tự xưng 'tôi', khóa 'sáu mươi lăm cặp còn lại' và 'đạo quân phía đông và đạo quân phía nam'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000566
    choices:
      - "Điểm nhìn, đại từ & phủ định: quy chiếu Đại úy von Degurechaff bằng 'cô'; bảo toàn phủ định bộ phận ở vế đầu ('không hoàn toàn bi quan') và phủ định ở vế hai ('chẳng kỳ vọng nhiều')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000567
    choices:
      - "Thuật ngữ & phủ định: khóa 'tỷ lệ vượt qua' và cấu trúc phủ định 'thế này thì không ổn rồi'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000568
    choices:
      - "Thuật ngữ, đại từ & giả định phủ định: khóa 'Các sĩ quan có quân hàm', 'đạo quân phía đông', 'Các pháp sư', 'Cụm tập đoàn quân phía Đông'; giữ 'Nó' ở câu 2 chỉ quy chiếu sự vật ('Lời phán quyết ấy'), bảo toàn so sánh ngang bằng ở câu 2 và phủ định giả định ở câu 4 ('Chẳng một ai trong số họ mong muốn đơn vị của mình bị đóng mác bất tài...')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000569
    choices:
      - "Xưng hô thoại, thuật ngữ & dấu câu: trong câu hỏi của các sĩ quan Cục Quân vụ với Đại úy von Degurechaff, gọi Tanya là 'Cô', khóa 'tiêu chuẩn tuyển nhận' và giữ dấu chấm lửng cuối câu hỏi."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000570
    choices:
      - "Xưng hô thoại, thuật ngữ & tình thái điều kiện: trong lời đáp của Đại úy von Degurechaff, giữ tự xưng 'tôi', khóa 'đào tạo lại', 'tập hợp' và sắc thái điều kiện tối thiểu ở cả hai câu."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000571
    choices:
      - "Thuật ngữ & câu hỏi gián tiếp: khóa 'Các sĩ quan thuộc Cục Quân vụ', 'lịch trình', 'những người đến từ phía đông', 'tiêu chuẩn tuyển nhận', 'thiết lập đơn vị' và câu hỏi gián tiếp không lời ở câu 2."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000572
    choices:
      - "Thuật ngữ, tình thái giả định & điều kiện: khóa 'Thời gian huấn luyện của đơn vị', 'những người lính kỳ cựu', 'tân binh', 'hoạt động tác chiến'; bảo toàn nhận định giả định ở câu 2 và câu điều kiện ở câu 4 ('Nếu sự chênh lệch năng lực giữa các thành viên quá lớn, điều đó có thể cản trở hoạt động tác chiến của họ.')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000573
    choices:
      - "Cấp bậc, thuật ngữ & điều kiện nhượng bộ: khóa 'đại đội', 'Đại úy von Degurechaff', 'lực lượng chiến đấu thực thụ', dịch rõ 'đơn vị ấy' và bảo toàn mệnh đề nhượng bộ giả định 'ngay cả khi họ lấy... việc nhào nặn đơn vị ấy thành một lực lượng chiến đấu thực thụ vẫn sẽ cần thời gian.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000574
    choices:
      - "Câu hỏi trực tiếp: giữ nguyên câu hỏi ngắn xác nhận thời gian '“Cụ thể là mất bao lâu?”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000575
    choices:
      - "Giọng thoại & đồng bộ trích dẫn: khóa câu trả lời lễ phép '“Khoảng một tháng ạ.”' của Đại úy von Degurechaff với cấp trên, giữ cụm 'một tháng' khớp trực tiếp với p000576."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000576
    choices:
      - "Cấp bậc, đại từ & thuật ngữ: khóa 'Đại úy von Degurechaff', quy chiếu Tanya bằng 'cô', khóa 'những quân nhân thuộc đạo quân phía đông', trích dẫn '“một tháng”', 'những người đến từ phía đông' và 'đào tạo lại'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000577
    choices:
      - "Đại từ, thuật ngữ & so sánh giả định: quy chiếu Tanya bằng 'cô', khóa 'các sĩ quan cấp cao' và cấu trúc so sánh giả định kèm phủ định 'cứ như thể đó chẳng phải chuyện gì to tát'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000578
    choices:
      - "Đại từ & điều kiện giả định: quy chiếu Tanya bằng 'cô', bảo toàn điều kiện 'chỉ cần cho cô một tháng, cô có thể rèn giũa ngay cả đám người vụng về vô tích sự này vào khuôn khổ'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000579
    choices:
      - "Cấp bậc danh từ chung, đại từ, thuật ngữ & điều kiện trái thực tế: viết thường danh từ chung 'đại úy', dùng 'anh ta' cho đại úy giả định nói chung và 'cô' cho Tanya; khóa 'tân binh', 'pháp sư', câu điều kiện trái thực tế ở câu 1 và mệnh đề nhượng bộ ở câu 3."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000580
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002) & phủ định: chỉ bọc '*Không thể nào! Không thể làm được đâu. Hoàn toàn phi thực tế.*' tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ phần dẫn trước dấu hai chấm nằm ngoài dấu '*...*'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000581
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002), cấp bậc, đại từ & điều kiện trái thực tế: khóa 'Đại úy von Degurechaff', quy chiếu Tanya bằng 'cô'; chỉ bọc '*Cứ chống mắt lên mà xem*' tương ứng 1:1 với thẻ <html:em> trong nguồn (giữ dấu phẩy ngoài dấu '*...*'); bảo toàn phủ định ở câu 1 và điều kiện giả định trái thực tế ở câu 3 ('Nếu cô chưa từng chứng minh được năng lực đủ để bảo chứng cho lời nói đó, thì sự tự tin mà cô đang thể hiện hẳn đã bị xem là tự phụ.')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000582
    choices:
      - "Điểm nhìn, đại từ, thuật ngữ & quan hệ hệ quả: từ điểm nhìn của các sĩ quan lớn tuổi, quy chiếu Tanya bằng 'một cô bé' / 'cô'; khóa 'Cụm tập đoàn quân phía Đông' và cấu trúc hệ quả 'đến độ chuyện tra vấn Cụm tập đoàn quân phía Đông đã tạm thời được gác lại'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000583
    choices:
      - "Mệnh lệnh thoại & đồng bộ từ vựng: trong lời Tướng von Zettour, khóa 'giáo dục lại họ', giữ dấu gạch ngang dài và cụm 'mạnh tay một chút nếu cần' khớp trực tiếp với cụm in nghiêng ở p000584."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000584
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002), cấp bậc, đại từ, tình thái & điều kiện phủ định: khóa 'Tướng von Zettour', quy chiếu Zettour bằng 'Ông' / 'ông' và Tanya bằng 'cô' (kèm phản thân 'mình'); chỉ bọc '*Mạnh tay một chút.*' ở câu 3 tương ứng 1:1 với thẻ <html:em> trong nguồn; bảo toàn tình thái 'có lẽ là người duy nhất' ở câu 1 và điều kiện phủ định 'miễn là không có ai thiệt mạng' ở câu 4."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000585
    choices:
      - "Thoại điều lệnh (Tanya -> Tướng von Zettour): khóa câu đáp nhận lệnh '“Rõ, thưa ngài.”' đồng bộ với các lô trước của chương 5."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000586
    choices:
      - "Cấp bậc, đại từ & hình ảnh so sánh: khóa 'Đại úy von Degurechaff', 'cấp trên của cô', giữ dấu gạch ngang dài và hai hình ảnh so sánh ở câu 2."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000587
    choices:
      - "Xưng hô thoại & thuật ngữ: trong mệnh lệnh của Tướng von Zettour, giữ tự xưng 'Tôi', khóa 'biên bản cuộc họp hôm nay', 'đơn vị huấn luyện', 'đào tạo lại' và 'đạo quân phía nam và đạo quân phía đông'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000588
    choices:
      - "Cấp bậc, đại từ, thuật ngữ & tương phản phủ định – khẳng định: khóa 'Tướng von Zettour', quy chiếu bằng 'ông', khóa 'các đạo quân khu vực' và cấu trúc đối lập 'không hề có ý định bỏ qua... Trái lại, ông định bụng sẽ chấn chỉnh triệt để vấn đề này.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000589
    choices:
      - "Xưng hô thoại, phủ định & thuật ngữ: trong lời kết của Tướng von Zettour trước hội đồng, khóa phủ định 'Chuyện này chẳng phải điềm lành gì', đại từ gộp 'chúng ta' và cụm 'thống nhất quan điểm về công tác huấn luyện'."
