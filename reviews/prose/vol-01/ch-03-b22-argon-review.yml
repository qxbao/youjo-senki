- id: ch03-b22-visha-first-person-pov-misunderstanding-tanya-and-republican-sniper-scene-shift-pronouns-and-emphases
  source_term: visha_first_person_pov_misunderstanding_tanya_and_republican_sniper_scene_shift_pronouns_and_emphases_ch03_b22
  proposed_vi: 'Toàn bộ 41 đoạn của lô ch-03-b22 (chapter007.xhtml/p000458–p000498) gồm hai phân cảnh nối tiếp — phần kết cảnh tự sự ngôi thứ nhất của Hạ sĩ Viktoriya Ivanovna Serebryakov (Visha) khi cô xung phong đi giải cứu quan sát viên và xuất kích cùng Thiếu úy Degurechaff cùng tiểu đội của Trung sĩ Schones (p000458–p000496), tiếp nối bằng ngắt cảnh (`class="space-break1"`) tại p000497 chuyển sang góc nhìn của toán pháp sư Cộng hòa đang bắn tỉa các quan sát viên Đế quốc dưới làn pháo kích hạng nặng (p000497–p000498, nối sang đầu chapter007b.xhtml ở ch-03-b23) — tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp dụng sang điểm nhìn của Visha hay trần thuật phía Cộng hòa; không xuất hiện từ “nó” ở bất kỳ vị trí nào trong cả 41 đoạn), DEC-P01-002 và canon/style-guide.md: (1) Trong phân cảnh 1 (p000458–p000496): ở lời kể và suy nghĩ nội tâm, Visha tự xưng nhất quán là “tôi” / “Tôi” kết hợp đại từ phản thân “mình” (p000459–p000461, p000465, p000468–p000470, p000473, p000476, p000485, p000487, p000491, p000493), gọi bạn thân “Elya” là “cậu” trong câu trách thầm trực tiếp ở p000458 (`*…Elya, đồ nói dối. Làm gì có chuyện cậu được an toàn ngồi uống trà ở tuyến sau chứ!*` — đồng bộ hệ xưng hô bạn bè “tớ – cậu” ở ch-03-b10 và ch-03-b18), quy chiếu “Thiếu úy Degurechaff” ở ngôi thứ ba nhất quán bằng “cô ấy” kết hợp phản thân “mình” (p000467, p000476, p000480, p000485, p000487, p000493 — đồng bộ ch-03-b16–b18 và ch-03-b21), quy chiếu người quan sát viên cần giải cứu bằng “anh ta” (p000460 — đồng bộ ch-03-b21 p000455), và quy chiếu các sĩ quan cấp trên cùng lực lượng chủ lực của đại đội bằng “bọn họ” / “họ” (p000469, p000491). (2) Trong hội thoại quân sự ở phân cảnh 1: đại đội trưởng Trung úy Schwarkopf (p000462, p000464, p000466, p000471, p000478, p000482, p000484, p000489) tự xưng “Tôi”, gọi Tanya là “Thiếu úy Degurechaff” / “Thiếu úy” và đại từ “cô” (p000462, p000464, p000478, p000484), quy chiếu Visha bằng “Cô ấy” (p000478, p000484), gọi Visha là “Hạ sĩ Serebryakov?” khi cô bất ngờ lên tiếng (p000471), và dùng “hai người” khi cử tiểu đội của Schones đi hộ tống cặp của Tanya và Visha (p000482); Thiếu úy Tanya Degurechaff khi thưa với cấp trên trực tiếp Trung úy Schwarkopf (p000463, p000465, p000479, p000483, p000488, p000490) tự xưng “Tôi”, dùng đại từ gộp “chúng ta” (p000465), gọi cấp trên là “Trung úy Schwarkopf” (p000479), “thưa Trung úy” (p000483), “Chỉ huy” (p000490) kèm tiểu từ kính ngữ “ạ” và quy chiếu Visha là “Hạ sĩ Serebryakov” / “cô ấy” (p000465), khi nói với cấp dưới Visha thì gọi “Hạ sĩ” / “Cô” (p000474, p000492), và khi giao việc cho hạ sĩ quan đi phối thuộc là Trung sĩ Schones thì tự xưng “tôi” và gọi “Trung sĩ Schones” / “anh” (“đội của anh”, p000495); Hạ sĩ Serebryakov (Visha) khi xin phép và thỉnh cầu đại đội trưởng Trung úy Schwarkopf (p000470, p000472, p000475, p000477) thưa “Thưa Chỉ huy”, tự xưng “tôi” / “Tôi” kết hợp phản thân “mình” kèm “ạ”, và khi đáp lệnh Thiếu úy Degurechaff ở p000494 thì đáp chuẩn điều lệnh “Rõ, thưa Thiếu úy.”; Trung sĩ Schones (p000496) đáp “Chắc chắn rồi, thưa Thiếu úy.” và tự xưng “Chúng tôi” cho tiểu đội của mình. (3) Trong phân cảnh 2 sau `space-break1` (p000497–p000498): ở câu thoại phẫn nộ p000497, pháp sư Cộng hòa dùng “chúng ta” cho đơn vị mình và “họ” cho “Bên Tình báo”; ở đoạn trần thuật ngôi thứ ba p000498, quy chiếu toán pháp sư Cộng hòa bằng “họ” và quy chiếu “người quan sát viên” Đế quốc kèm đại từ phản thân “mình”. (4) Bảo toàn trọn vẹn sắc thái hài hước do lệch điểm nhìn khi Visha hiểu lầm vẻ sững sờ trợn tròn mắt như cô bé mười tuổi của Tanya (thực chất vì mất cớ trốn nhiệm vụ nguy hiểm) thành sự giàu tình cảm và lo lắng thái quá cho cấp dưới (p000479–p000487), các cấu trúc phủ định, câu hỏi trực tiếp, điều kiện nhượng bộ (p000463, p000464, p000469, p000475), điều kiện giả định ở p000468, phủ định triệt để ở câu 5 p000498 (“chẳng hề làm giảm độ chính xác của pháo binh lấy một chút nào”) cùng hai mức độ phỏng đoán cỡ nòng pháo ở câu 6–7 p000498 (“có lẽ...”, “Trong tình huống xấu nhất, biết đâu...”). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 3 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: toàn bộ đoạn trách thầm Elya ở p000458 (`*…Elya, đồ nói dối. Làm gì có chuyện cậu được an toàn ngồi uống trà ở tuyến sau chứ!*`), động từ `*cảm thấy*` ở câu 3 p000461, và câu suy nghĩ nội tâm thứ hai ở p000485 (`*Có lẽ cô ấy giàu tình cảm hơn vẻ bề ngoài.*`, giữ câu 1 và câu 3–4 nằm ngoài dấu `*`), tuyệt đối không dùng dấu `*` ở 38/41 đoạn còn lại.'
  alternatives_vi:
  - cô / các cô (thay cho “hai người” khi Trung úy Schwarkopf cử tiểu đội của Schones đi hộ tống ở p000482 — ưu tiên “hai người” vì bao quát tự nhiên cặp bay gồm Thiếu úy Degurechaff và Hạ sĩ Serebryakov vừa tình nguyện đi cùng) / Vâng, thưa Thiếu úy (thay cho “Rõ, thưa Thiếu úy.” tại p000494 — ưu tiên “Rõ, thưa Thiếu úy.” để thể hiện khí thế tự hào, dứt khoát theo điều lệnh quân sự ngay sau khi Visha củng cố quyết tâm ở p000493) / lược danh xưng “thưa Thiếu úy” trong lời đáp của Trung sĩ Schones tại p000496 (ưu tiên có “thưa Thiếu úy” để giữ đúng lễ tiết hạ sĩ quan đáp lời sĩ quan chỉ huy trên chiến trường)
