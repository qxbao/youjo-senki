  volume: vol-01
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc và thuật ngữ quân sự – ma đạo đã khóa tạm từ Chương 1–2 và ch-03-b01 → ch-03-b21: “Elya” (ch-03-b09, b10, b17, b18), “tuyến sau” (ch-03-b10 p000214, ch-03-b17 p000369, ch-03-b18 p000371, p000390), “Các quan sát viên” / “quan sát viên” (chapter1_b01_pending_terms, ch-03-b18 p000380, ch-03-b21 p000451, p000455), “Thiếu úy Degurechaff” / “Thiếu úy” (b02-second-lieutenant, ch-03-b11–b21), “Cánh Bạc” (ch-03-b10 p000206, p000208, ch-03-b11 p000227), “Type 95” (ch-02-b12, ch-03-b02, ch-03-b11 p000223), “Hạ sĩ Serebryakov” / “Hạ sĩ” (ch-03-b17, b20, b21), “sĩ quan bất tài” và “cấp dưới” (ch-03-b11 p000226, ch-03-b17 p000364), “tách cặp ra” / “Một cặp là đơn vị cơ bản nhất” và “đồng đội bắt cặp” (ch-03-b17 p000359, ch-03-b18 p000370), “Trung úy Schwarkopf” / “thưa Trung úy” / “Chỉ huy” (ch-03-b11–b21), “không chiến” (ch-03-b01 p000017), “đại đội pháp sư” (ch-03-b21 p000448), “các sĩ quan cấp trên” (ch-03-b21 p000452), “người lính Đế quốc” (ch-03-b10 p000189, p000212, ch-03-b20 p000430), hình ảnh so sánh “ma cà rồng” (ch-03-b16 p000347, ch-03-b17 p000352), “lực lượng chủ lực” (ch-03-b04 p000053, ch-05-b01 p000007), “mặt trận Rhine” (ch-03-b01, ch-03-b10 p000188, ch-03-b17 p000352, ch-03-b19 p000410), “Bên Tình báo” (ch-04-b05 p000105, p000108), “các pháp sư Đế quốc”, “pháo binh” và cỡ nòng “pháo 120 mm” / “pháo 180 mm hoặc 240 mm” (ch-03-b19 p000392, p000397, ch-03-b20 p000418); đồng thời khóa tạm “chiến dịch giải cứu” / “nhiệm vụ giải cứu” (p000461, p000465, p000468, p000472), “tiểu đội của Schones” (p000482) và “Trung sĩ Schones” / “đội của anh” (p000495), “những động tác cơ động né tránh”, “thuật thức quang học” (đồng bộ với “thuật thức bắn tỉa quang học” ở ch-03-b21 p000439) và “cơn mưa ánh sáng ma lực” (p000498)."
