- id: b12-tanya-pronouns-and-radio-address
  source_term: Tanya interior monologue self-reference, direct curse address to the devil (Being X), Fairy 08 radio self-reference, spoken self-talk, and collective human/Imperial references
  proposed_vi: độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng “mình” / “Mình” / “bản thân” xuyên suốt (p000196, p000197, p000200–p000205, p000208–p000210, p000212, p000213) và câu tự nhủ thành tiếng một mình tại p000211 dùng “mình” (đồng bộ p000172 ở b10); trong hai câu đầu p000197 khi trực tiếp chửi rủa và thách thức “tên quỷ dữ kia” (Being X) dùng cặp đại từ đối kháng “ta – ngươi”; trong liên lạc vô tuyến tại p000198, Fairy 08 tự xưng “tôi” với Norden Control (đồng bộ b10, b11); khi nói về bản chất chung của nhân loại tại p000204 dùng “chúng ta”, khi chỉ phe Đế quốc trên chiến trường tại p000212 dùng “phe mình” / “pháo binh của ta”, và quy chiếu pháp sư địch bằng “chúng” / “đám này” / “lũ này” (p000196, p000197, p000209, p000210, p000212)
  alternatives_vi:
