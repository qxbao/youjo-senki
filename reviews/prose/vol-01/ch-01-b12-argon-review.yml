- segment_id: YS-LN01/Text/chapter003b.xhtml/p000196
  locks:
  - Giữ các thuật ngữ “một đại đội pháp sư”, “pháo binh”, “phân khu bên cạnh”, đại từ nội tâm “mình” và chuỗi câu hỏi bức xúc kết thúc bằng dấu “?!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000197
  locks:
  - Giữ tiếng chửi “Khốn kiếp, tên quỷ dữ kia. Ngươi vẫn còn nguyền rủa ta đấy à?!”, sự chuyển đổi mượt về đại từ nội tâm “mình” ở phần sau và cụm “kéo theo được cả một lũ giặc bay này chôn cùng.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000198
  locks:
  - Giữ lời đáp vô tuyến ““Fairy 08 đã rõ. Norden Control, tôi sẽ dốc toàn lực chiến đấu đến cùng!””.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000199
  locks:
  - Giữ lời đáp ngắn gọn ““Norden Control đã rõ. Chúc may mắn.””.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000200
  locks:
  - Giữ cụm trích dẫn lại ““chúc may mắn”” khớp với p000199, đại từ nội tâm “mình” và câu kết “Mình bất giác chau mày khi một linh cảm chẳng lành phập phồng trong lồng ngực.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000201
  locks:
  - Giữ điển tích lịch sử “quân Tokugawa đang áp đảo ở Trận Sekigahara lại đụng phải đạo quân Shimazu đầy quái dị” và đúng phạm vi nhấn mạnh Markdown `*Đừng có mò sang đây. Đi chỗ khác đi. Xéo đi.*` theo DEC-P01-002.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000202
  locks:
  - Giữ định danh “Being X”, thuật ngữ “một cuộc tác chiến phòng ngự trì hoãn ngay trong vùng không phận do địch làm chủ” và đại từ nội tâm “mình” / “bản thân”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000203
  locks:
