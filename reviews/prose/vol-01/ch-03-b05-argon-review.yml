  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–3: giữ sự phân biệt rạch ròi khi chuyển từ điểm nhìn của Tanya sang điểm nhìn ngôi thứ ba của Trung úy Michel Hosman và Đại đội Pháp sư Trinh sát số 228, bảo toàn sự mặc định về giới tính của pháp sư cảnh giới địch trong nhận thức của phía Cộng hòa (“gã này” / “hắn” / “đối thủ”), hệ thống đại từ vô tuyến và chỉ huy tác chiến (“Tôi”, “Chúng tôi”, “tôi / Chúng ta – các anh em”, “Bọn tôi”), cùng đúng 3 vị trí nhấn mạnh in nghiêng của nguyên tác."
