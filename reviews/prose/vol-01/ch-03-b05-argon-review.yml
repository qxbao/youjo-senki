- id: ch03-b05-hosman-republican-pov-pronouns-sentinel-gender-assumption-and-emphasis
  source_term: Third-person narration from First Lieutenant Michel Hosman and the 228th Reconnaissance Mage Company’s perspective after space-break1 across p000067–p000082, Republican default male/neutral references to the unidentified Imperial sentinel (Tanya) in p000071–p000075/p000078/p000081, generic second-person omission in p000068, radio and command dialogue pronouns among Golf 01 (Hosman), CP, and Platoon Mike’s leader in p000069–p000070/p000073/p000076/p000078/p000081, nested quotation in p000076, and exact preservation of italicized emphasis in p000068/p000071/p000075
  proposed_vi: sau ngắt cảnh (space-break1) tại p000067, mạch truyện chuyển từ góc nhìn của Tanya sang điểm nhìn ngôi thứ ba bám sát Trung úy Michel Hosman và Đại đội Pháp sư Trinh sát số 228 thuộc Quân đội Cộng hòa François, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của nhân vật khác): quy chiếu Trung úy Michel Hosman bằng tên riêng / cấp bậc (“Trung úy Michel Hosman”, “Trung úy Hosman”, “Hosman”), quy chiếu tập thể Đại đội Pháp sư Trinh sát số 228 / Trung đội Mike bằng đại từ số nhiều “họ” / “Họ” kết hợp phản thân “mình” (p000067, p000068, p000072, p000075, p000077, p000079, p000080, p000082), và quy chiếu Quân đội Đế quốc từ góc nhìn đối địch bằng “chúng” tại câu 1 p000068; đặc biệt bảo toàn chính xác giới hạn thông tin trong điểm nhìn của phía Cộng hòa đối với pháp sư cảnh giới Đế quốc (Tanya): do mới chỉ phát hiện tín hiệu từ xa và hoàn toàn chưa biết đối phương là một bé gái, Hosman và trung đội trưởng Trung đội Mike mặc định mục tiêu là một người lính nam giới hoặc gọi bằng danh ngữ trung tính — bản dịch phản ánh trung thực góc nhìn này bằng “gã này” (p000071), “tên lính cảnh giới” / “tên pháp sư” (p000071–p000073, p000075, p000078), “đối thủ” / “đối phương” (p000072, p000074) và “hắn” (p000081), không để lộ thông tin ngoài điểm nhìn của nhân vật; tại câu 1 p000068, lược đại từ ngôi thứ hai phiếm chỉ bằng trạng ngữ “nhân tiện” theo quy ước direct-address choice; trong liên lạc vô tuyến và mệnh lệnh chỉ huy: Golf 01 (Hosman) tự xưng “Tôi” khi báo cáo với CP (p000069), CP tự xưng “Chúng tôi” khi truyền đạt nhận định chỉ huy (p000070), Hosman khi phát lệnh trực tiếp cho đại đội tự xưng “tôi”, gọi chung đơn vị là “Chúng ta” và khích lệ thuộc cấp bằng “các anh em” (p000076, p000078), còn trung đội trưởng Trung đội Mike tự xưng đại diện cho trung đội là “Bọn tôi” khi đáp nhận lệnh (p000081); bảo toàn cặp dấu ngoặc đơn lồng trong dấu ngoặc kép cho lời nhại trẻ con (‘Cao quá! Cháu không với tới được!’) tại p000076, các cấu trúc giả định/nhượng bộ tại p000067, p000075, p000080, p000082, và bảo toàn tuyệt đối chính xác 3 vị trí nhấn mạnh Markdown `*...*` tại câu 1 p000068 (`*Nghiền nát đôi mắt của Quân đội Đế quốc khi chúng tìm cách gượng dậy khỏi cơn hỗn loạn, và nhân tiện cắt đứt luôn hệ thống liên lạc của chúng.*`), câu 1 p000071 (`*Vận may không đứng về phía gã này rồi.*`) và câu 2 p000075 (`*Không tệ chút nào.*`) theo đúng DEC-P01-002 (13/16 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - Chúng tôi (thay cho “Bọn tôi” trong lời nhận lệnh của trung đội trưởng Trung đội Mike tại p000081 — ưu tiên “Bọn tôi” để thể hiện sắc thái tự tin, dứt khoát của phân đội tinh nhuệ ngoài chiến trường)
  segment_ids:
