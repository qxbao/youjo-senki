- id: ch05-b11-tanya-pov-pronouns-general-staff-banquet-dialogue-generic-you-and-zero-emphasis
  source_term: tanya_pov_pronouns_general_staff_banquet_dialogue_generic_you_and_zero_emphasis_ch05_b11
  proposed_vi: 'Toàn bộ 31 đoạn của lô ch-05-b11 (chapter011.xhtml/p000244–p000274) tiếp nối trực tiếp cảnh dùng bữa tại phòng yến tiệc Văn phòng Bộ Tổng Tham mưu dưới điểm nhìn trần thuật ngôi thứ ba bám sát Tanya từ nửa sau ch-05-b10 (p000234–p000243), tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya xuyên suốt 31 đoạn: áp dụng nghiêm ngặt DEC-P01-001, quy chiếu Tanya nhất quán bằng tên riêng “Tanya” (p000255, p000261, p000270) và đại từ ngôi thứ ba “nó” / “Nó” kết hợp phản thân “mình” / “bản thân nó” (p000246, p000249, p000250, p000259, p000261–p000265, p000267, p000270, p000272, p000274 — tuyệt đối không dùng “cô” / “cô ấy” trong lời kể hay suy nghĩ nội tâm); quy chiếu riêng lẻ Đại tá von Kordel và Chuẩn tướng von Zettour trong lời kể bằng tên riêng (“Kordel”, “Zettour”), danh ngữ cấp bậc (“vị đại tá bên Cục Nhân sự”, “vị đại tá”) và đại từ trang trọng “ông” / “Ông” (p000250, p000255, p000259, p000261, p000263, p000274 — đồng bộ ch-04-b16 và ch-05-b01–b04); quy chiếu gộp cả hai sĩ quan cấp cao hoặc tập thể Cục Nhân sự / Bộ Tổng Tham mưu bằng “họ” (p000250, p000252, p000257, p000265, p000267, p000270); đồng thời xử lý nhất quán cả 3 vị trí có đại từ ngôi thứ hai phiếm chỉ trong câu nhận định khái quát (p000263, p000267, p000270) bằng kết cấu khái quát không đại từ (“một công cụ có thể dùng để thăm dò những điểm yếu của đối phương trong lúc đàm phán” ở p000263; “nếu trót làm mất lòng họ thì cứ xác định là sẽ phải trả giá” ở p000267; “cho dù họ có tỏ ra thân thiện đến đâu thì cũng không thể mất cảnh giác được” ở p000270) theo đúng quy ước direct-address choice (pending-terms.yml). (2) Hệ xưng hô trong hội thoại quân sự tại bàn tiệc: Đại tá von Kordel và Chuẩn tướng von Zettour khi nói với Tanya (p000245, p000250, p000253, p000258, p000266, p000268, p000273) gọi Tanya bằng quân hàm mới “Đại úy” / “Đại úy von Degurechaff” và đại từ ngôi thứ hai “Cô” / “cô” chuẩn mực quân đội, tự xưng “chúng ta” khi đùa đặt tên quán hoặc chuyển sang phần bàn việc chung (p000250, p000258), và tự xưng “chúng tôi” / “Chúng tôi” khi đại diện cho Cục Nhân sự / Bộ Tổng Tham mưu thông báo chủ trương phân công nhiệm sở (p000266, p000268); khi Kordel quay sang hỏi Chuẩn tướng von Zettour (p000248), gọi “Tướng von Zettour” và dùng đại từ kính trọng “ngài” đối với cấp tướng; ở chiều ngược lại, Đại úy Tanya von Degurechaff khi đáp lời hai sĩ quan cấp cao (p000247, p000251, p000254, p000260, p000269, p000271) tự xưng “tôi” / “Tôi”, thưa “thưa ngài”, “Xin hai ngài”, “Đại tá” kèm tiểu từ kính ngữ “ạ” giữ đúng lễ tiết khuôn mẫu của sĩ quan cấp dưới. (3) Bảo toàn chính xác toàn bộ các cấu trúc phủ định, câu hỏi phản vấn nội tâm, dấu gạch ngang dài và thời gian/mức độ chắc chắn của các mệnh đề giả định/khả thể/điều kiện theo đúng canon/style-guide.md: phủ định giả định ở p000244 (“Chẳng ai đời nào lại ăn món này vì sở thích cá nhân cả”) và p000246 (“Không, nó sẽ chẳng đời nào đến đây vì sở thích cá nhân, nhưng lời mời... thì không thể khước từ”), dấu gạch ngang dài ở p000247, p000253, p000255, p000267, câu hỏi phản vấn nội tâm ở p000249 (“nhưng thế này thì chẳng phải là hơi quá đáng sao?”), đề xuất đùa cợt ở p000250 (“Có lẽ chúng ta nên gọi nơi này là...”), suy đoán hợp lý ở p000252 (“Xem ra họ cũng chẳng phải vì hương vị mà tới đây”) và p000255 (“Chắc hẳn ông cũng hay trêu chọc... theo cùng kiểu ấy”), khả thể công cụ ở p000263, câu điều kiện nhân quả ở p000267, mệnh đề nhượng bộ cảnh giác ở p000270, và câu điều kiện giả định tương lai kèm mức độ chắc chắn tuyệt đối ở cuối p000274 (“nó không mảy may nghi ngờ rằng nếu mình đi sai một nước cờ, toàn bộ các lựa chọn của nó sẽ tan biến sạch, và nó sẽ bị tống tới nơi tồi tệ nhất có thể”). (4) Tuân thủ tuyệt đối DEC-P01-002: toàn bộ 31 đoạn trong `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` nào (0/31 đoạn), và bản dịch hoàn toàn không dùng dấu `*...*` ở bất kỳ đoạn nào.'
  alternatives_vi:
  - Xin ngài đừng bận tâm đến tôi hoặc Xin đừng bận tâm đến tôi ạ (thay cho “Xin hai ngài đừng bận tâm đến tôi” tại p000251 — ưu tiên “Xin hai ngài đừng bận tâm đến tôi” vì lời từ chối ăn thêm của Tanya hướng tới cả Kordel lẫn Zettour trên bàn tiệc và khớp trực tiếp với nhận xét số nhiều “Xem ra họ cũng chẳng phải vì hương vị mà tới đây” ngay ở p000252) / Tôi xin cảm ơn, thưa Đại tá (thay cho “Xin cảm ơn Đại tá ạ” tại p000260 — ưu tiên “Xin cảm ơn Đại tá ạ” vì ngắn gọn, dõng dạc đúng khuôn mẫu sĩ quan được mô tả ở p000261)
