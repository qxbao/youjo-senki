  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm và tên gọi tổ chức đã khóa tạm từ Chương 1–4, ch-05-b01 → ch-05-b10 và các tập sau: “Đại úy” / “đại úy” / “Đại úy von Degurechaff” (ch-05-b09 p000206, ch-05-b10 p000220, p000230: p000245, p000250, p000258, p000259); “Văn phòng Bộ Tổng Tham mưu” (ch-05-b01 p000001, ch-05-b09 p000196–p000198, ch-05-b10 p000243: p000245, p000255) và “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms: p000246, p000255, p000267); “Cục Nhân sự Bộ Tổng Tham mưu” / “Cục Nhân sự” (b15-general-staff-personnel-and-achievement-assessment-terms, ch-01-b15, ch-04-b17 p000141, ch-05-b03 p000045, p000051: p000246, p000263, p000270); “Chuẩn tướng von Zettour” / “Tướng von Zettour” / “Zettour” (ch-01-b19/b20, ch-04-b16 p000104, p000115: p000246, p000248, p000249, p000255) và “Cục Quân vụ” (ch-04-b11 p000233, ch-04-b16 p000102, ch-05-b01–b04: p000246); “chiến trường” (p000247), “các đơn vị tiền tuyến” và “hậu phương” (p000274); “phòng yến tiệc” (ch-05-b09 p000200, ch-05-b10 p000243: p000255); “giảng viên” và “học viện chiến tranh” (ch-04-b01, ch-05-b08 p000193, ch-05-b09 p000208, p000210: p000255, p000259, p000267); “người lính cần vụ” (vol-02-ch-05 p000652, ch-05-b10 p000235: p000257); “sĩ quan có quân hàm” (ch04-b08-laeken-guard-commander-war-college-ranks-and-aerial-field-service-badge-terms, ch04-b09-war-college-library-general-staff-strategy-section-and-guardroom-storage-terms: p000261); “pháp sư” và “sĩ quan” (p000274); đồng thời khóa tạm các nhân danh, chức danh và thuật ngữ mới phát sinh trong lô: “món đặc sản của Văn phòng Bộ Tổng Tham mưu” (p000245), “Đại tá von Kordel” / “Kordel” / “Đại tá” / “vị đại tá” (viết thường khi là danh từ chung theo b02-second-lieutenant: p000246, p000250, p000257, p000259, p000260, p000263, p000265, p000270, p000274), “Quán Cà phê Chiến trường Vĩnh cửu” (p000250), “những người mới được bổ nhiệm vào Bộ Tổng Tham mưu” (p000255), “Giấy quyết định thăng quân hàm” (p000264), “nơi nhận nhiệm sở” (p000266), “giám thị giảng viên” và “một nhóm nhỏ khép kín” (p000267), “những màn kịch tử tế giả tạo” (p000270), “khiêm cung chấp nhận” (p000271–p000272), “vị trí đồn trú” và “rút phải thăm xui” (p000272), “mẫu đơn yêu cầu nhân sự” và “tái tổ chức ở hậu phương” (p000274)."
