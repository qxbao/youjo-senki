  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 31 đoạn của ch-05-b11: giữ nhất quán đại từ “nó” / “Nó” – “mình” cho Tanya trong trần thuật ngôi thứ ba và “ông” / “Ông” cho Kordel và Zettour, giữ hệ xưng hô quân sự chuẩn mực tại bàn tiệc (“Đại úy” / “cô” – “tôi” / “thưa ngài” / “Xin hai ngài” / “Đại tá... ạ”), xử lý cả 3 vị trí đại từ ngôi thứ hai phiếm chỉ ở p000263, p000267, p000270 bằng kết cấu khái quát không đại từ theo direct-address choice, bảo toàn đầy đủ các cấu trúc giả định/điều kiện, câu hỏi phản vấn nội tâm, dấu gạch ngang dài và 0/31 đoạn nhấn mạnh Markdown `*...*`."
