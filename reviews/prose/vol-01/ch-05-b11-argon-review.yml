  proposed_vi: Đại úy / món đặc sản của Văn phòng Bộ Tổng Tham mưu / Đại tá von Kordel / Cục Nhân sự Bộ Tổng Tham mưu / Chuẩn tướng von Zettour / Cục Quân vụ / chiến trường / Tướng von Zettour / Zettour / Kordel / Quán Cà phê Chiến trường Vĩnh cửu / phòng yến tiệc / Văn phòng Bộ Tổng Tham mưu / những người mới được bổ nhiệm vào Bộ Tổng Tham mưu / giảng viên / học viện chiến tranh / người lính cần vụ / Đại úy von Degurechaff / đại úy / Đại tá / sĩ quan có quân hàm / vị đại tá bên Cục Nhân sự / Giấy quyết định thăng quân hàm / vị đại tá / nơi nhận nhiệm sở / giám thị giảng viên / Bộ Tổng Tham mưu / một nhóm nhỏ khép kín / Cục Nhân sự / những màn kịch tử tế giả tạo / khiêm cung chấp nhận / vị trí đồn trú / rút phải thăm xui / mẫu đơn yêu cầu nhân sự / các đơn vị tiền tuyến / pháp sư / sĩ quan / tái tổ chức ở hậu phương
  alternatives_vi:
  - Nhà hàng Chiến trường Vĩnh cửu hoặc Quán Chiến trường Thường trực (thay cho “Quán Cà phê Chiến trường Vĩnh cửu” tại p000250 — ưu tiên “Quán Cà phê Chiến trường Vĩnh cửu” vì giữ chuẩn sắc thái mỉa mai chơi chữ từ lời đáp “chiến trường hiện diện ở khắp mọi nơi” của Tanya ở p000247 và khớp với phục vụ cà phê tại bàn ăn ở p000257) / lính phục vụ (thay cho “người lính cần vụ” tại p000257 — ưu tiên “người lính cần vụ” đồng bộ trực tiếp với ch-05-b10 p000235 và Tập 2) / sĩ quan chính quy (thay cho “sĩ quan có quân hàm” tại p000261 — ưu tiên “sĩ quan có quân hàm” để đồng bộ với ch-04-b08 và ch-04-b09) / Giấy tờ thăng quân hàm (thay cho “Giấy quyết định thăng quân hàm” tại p000264 — ưu tiên “Giấy quyết định thăng quân hàm” chuẩn ngôn ngữ hành chính quân sự) / việc phân công công tác hoặc nhiệm sở (thay cho “nơi nhận nhiệm sở” tại p000266 và “vị trí đồn trú” tại p000272) / trưởng ban giảng huấn hoặc tổng giám thị huấn luyện (thay cho “giám thị giảng viên” tại p000267 — ưu tiên “giám thị giảng viên” vì trung tính, bám sát chức năng giám sát đội ngũ giảng viên học viện chiến tranh) / rút phải que thăm ngắn (thay cho “rút phải thăm xui” tại p000272 — ưu tiên thành ngữ tương đương “rút phải thăm xui” tự nhiên trong tiếng Việt) / phiếu yêu cầu nhân sự (thay cho “mẫu đơn yêu cầu nhân sự” tại p000274)
