  volume: vol-01
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và tiếp nối liền mạch ch-04-b14: phân biệt rạch ròi giữa trần thuật ngôi thứ ba về Tanya (“Tanya” / “nó” tại p000096, p000101) và độc thoại nội tâm ngôi thứ nhất (“mình” / “Mình”), giữ chuẩn mực xưng hô quân đội lịch sự giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (“tôi – thưa ngài... ạ”, “tôi – cô”, “chúng ta”), bảo toàn đầy đủ các câu hỏi, cấu trúc điều kiện/giả định và không thêm dấu `*...*` khi nguồn không có nhấn mạnh."
