- id: ch04-b15-tanya-zettour-library-conclusion-pronouns-conditionals-and-emphasis
  source_term: tanya_zettour_library_conclusion_pronouns_conditionals_and_emphasis_ch04_b15
  proposed_vi: 'tiếp nối trực tiếp lô ch-04-b14 (chapter009b.xhtml/p000056–p000078), toàn bộ lô ch-04-b15 (chapter009b.xhtml/p000079–p000101) khép lại cuộc đối thoại chiến lược giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour tại thư viện Học viện Chiến tranh Đế quốc dưới điểm nhìn của Tanya trước dấu ngắt trang, tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya) và DEC-P01-002: trong các đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000096, p000101), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại từ trần thuật “nó” kết hợp phản thân “bản thân”; trong các đoạn độc thoại nội tâm / tự thuật ngôi thứ nhất của Tanya (p000081–p000085, p000088, p000089, p000093–p000095, câu 1–2 p000098), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” (lưu ý từ “nó” ở cuối câu 2 p000098 chỉ quy chiếu danh từ bất động vật là câu hỏi của Zettour, và từ “mình” ở câu 1 p000083 là đại từ phản thân quy chiếu vị tướng kia trong lời gián tiếp), dùng “chúng ta” ở câu 3 p000089 khi nói về con người/nhân loại nói chung, và quy chiếu Chuẩn tướng von Zettour trong nội tâm bằng “ông ấy” / “Ông ấy” kết hợp phản thân “mình” (p000093 — đồng bộ ch-04-b11–b14); quy chiếu phía Đức / Bộ Tổng Tham mưu Đức trong Thế chiến thứ nhất ở p000079 và các pháp sư ở p000087 bằng “Họ” / “họ” (đồng bộ ch-04-b14 p000075, p000078); trong các câu nhận định khái quát, câu đề xuất học thuyết hoặc câu tự giễu có đại từ ngôi thứ hai phiếm chỉ trong nguồn (câu 5 p000079, câu 1 p000090, câu 3 p000094, câu 4 p000095), lược đại từ ngôi thứ hai phiếm chỉ và dùng phản thân “chính mình” (ở p000090) theo đúng quy ước direct-address choice; trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (p000080, p000086, p000087, p000090–p000092, p000097–p000100), đồng bộ hoàn toàn với ch-04-b11–b14: Tanya tự xưng “tôi” / “Tôi”, dùng “chúng ta” cho phía Đế quốc (p000080), gọi Zettour kính cẩn là “thưa ngài” / “ngài” (p000092, p000100) kèm tiểu từ kính ngữ “ạ”, còn Chuẩn tướng von Zettour tự xưng “tôi” (p000099) và gọi Tanya lịch sự là “Cô” / “cô” (p000091, p000097); bảo toàn đầy đủ đối tượng và độ mở của các câu hỏi trực tiếp trong thoại (p000086, p000090, p000097) và các câu hỏi tu từ / tự vấn trong độc thoại nội tâm của Tanya (p000082, p000083, p000089, p000095), các cấu trúc phủ định – khẳng định, giả định và điều kiện (mệnh đề nhượng bộ giả định quá khứ và câu điều kiện ở p000079; các mệnh đề điều kiện ở p000081, p000083, p000088–p000090, p000094, p000096; câu hỏi điều kiện giả định ở p000097; giả định theo thói quen thông thường ở p000101), và không sử dụng bất kỳ dấu nhấn mạnh Markdown `*...*` nào trong toàn bộ 23/23 đoạn do `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` theo đúng DEC-P01-002'
  alternatives_vi:
  - người ta (thay cho cách lược đại từ ngôi thứ hai phiếm chỉ tại câu 5 p000079 và câu 3 p000094 — cả hai cách đều thuộc quy ước direct-address choice; ưu tiên lược chủ ngữ để câu văn nghị luận và độc thoại nội tâm tự nhiên, gọn sắc)
