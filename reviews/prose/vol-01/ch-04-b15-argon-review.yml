  rationale: "Kế thừa đồng bộ “phòng tuyến” (vol-04-ch-03-b20, p000079), “chiến tranh tổng lực” (vol02-ch02-b06-total-war / ch-04-b14 p000077, p000079), “binh lính địch” (ch-04-b14 p000076, p000080, p000087), “pháp sư không quân” (chapter1_b01_pending_terms / ch-04-b03 p000047, p000080), “pháp sư” (p000081, p000086, p000087, p000090, p000095, p000097), “Tsugene” (vol-04-ch-01-b16 p000107 / vol-04-ch-03-b08 p000115, p000082), mô hình bảo toàn hậu tố chơi chữ “-guchi” cho biệt danh tướng Mutaguchi tại Imphal (vol02-ch01-b09-imphal-nickname, p000082), “yểm trợ” (p000086), “chiến tranh trận địa” (ch-04-b14 p000068, p000087), “pháo binh” và “bộ binh” (p000087), danh hiệu “Named” giữ nguyên (vol02-ch02-b10-named / ch-03-b07 p000107, p000124, p000088), “Tồn tại X” (đồng bộ trực tiếp với ch-04-b07 và ch-04-b10 trong cùng Chương 4, ghi kèm phương án “Being X” theo P05-being-x, p000089), “Thượng đế” (review-God, p000089 — phân biệt rõ với danh từ chung viết thường “một vị thần” kèm đại từ “ông ta” ở p000088), “quỷ dữ” (review-devil, p000089), “nhân sự” (p000094), “thư viện” (ch-04-b09–b11, p000096) và “tiểu đoàn” (ch-04-b03 p000045, p000098); khóa tạm “các định luật vật lý”, “gây rối loạn chiến thuật”, “các đợt đột kích xuyên sâu”, “Mãn Châu”, “Mông Cổ”, “Chiến dịch Imphal”, “phe Đồng minh”, “gã Bốc-phét-guchi, gã Hung-bạo-guchi”, “vị tướng lừa đảo”, “dàn xếp ngoài tòa”, “hiện thân của công lý”, “kẻ tử vì đạo đầy cam chịu”, “binh chủng lý tưởng”, “phòng ngự cơ động”, “những kẻ nghiện chiến tranh”, “tận thế Armageddon”, “Học thuyết Kiềm chế Tiêu hao” (đồng bộ giữa p000090 và p000097), “nhà đàm phán”, “chứng chỉ chuyên môn”, “sơ yếu lý lịch”, “những người lính giải ngũ”, “chứng chỉ hành nghề luật”, “nòng cốt” và “gánh nặng hậu cần”."
