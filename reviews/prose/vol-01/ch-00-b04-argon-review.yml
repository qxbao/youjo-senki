locked_choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000058
  locks:
  - Giữ mốc thời gian và địa điểm “Ngày 22 tháng 2 năm 2013, Tokyo, Nhật Bản” ở dạng văn bản thường, không tự thêm chữ nghiêng.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000059
  locks:
  - Giữ hai câu hỏi chất vấn liên tiếp trong thoại và đại từ tự xưng “tôi” của người nhân viên.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000060
  locks:
  - Giữ điểm nhìn ngôi thứ nhất “tôi” / “chúng tôi” (đại diện công ty), cách quy chiếu trung tính “nhân viên” / “nhân viên này”, cùng các thuật ngữ “hiệu quả chi phí”, “cấp trên trực tiếp”, “vay tiền mặt”, “bác sĩ y tế lao động” và chuỗi lý do dẫn đến kết luận nhân viên gây tốn kém, có nguy cơ làm tổn hại danh tiếng công ty.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000061
  locks:
  - Giữ đại từ “Tôi” / “chúng tôi”, cách gọi trung tính “nhân viên”, đúng phạm vi nhấn mạnh chữ nghiêng `*Có lý do gì để chúng tôi giữ lại nhân viên không?*` theo DEC-P01-002, và lý do ràng buộc pháp lý khiến nhân vật phải giấu kín suy nghĩ thật để đáp lại khéo léo.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000062
  locks:
  - Giữ sự đan xen giữa lời thoại công vụ và độc thoại nội tâm thực dụng, thuật ngữ viết tắt “PIP”, cụm “khóa đào tạo hoàn thành PIP”, “Nghỉ không phép”, sự đối lập giữa “công ty vì lợi nhuận” với “tổ chức từ thiện”, và cặp đối lập “tự nguyện xin nghỉ việc” hơn là “bị sa thải kỷ luật”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000063
  locks:
  - Giữ quan hệ nhượng bộ giữa việc thấy tốn thời gian với việc đây vẫn là một phần trong “mô tả công việc”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000064
  locks:
  - Giữ đại từ “tôi”, phủ định “Trước giờ tôi có phải đi gặp khách hàng đâu!” và câu hỏi phản ứng gay gắt của nhân viên về việc tính đó là đào tạo.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000065
  locks:
  - Giữ giọng điệu giải thích quy trình quản trị, các cụm “kết quả công việc sa sút”, “cấp trên”, “các nhân viên kinh doanh”, “phương pháp quản lý”, đại từ “chúng tôi” và cách tỉnh lược đại từ ngôi thứ hai khi nêu yêu cầu tham gia khóa đào tạo.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000066
  locks:
  - Giữ đại từ “tôi” / “chúng tôi”, cách tỉnh lược chủ ngữ ngôi thứ hai trong các mệnh đề điều kiện (“Nếu nghĩ…”, “nhưng nếu nghĩ… thì lầm to”), và ba danh xưng trong ngoặc kép “quái vật vô tình”, “con cưng của sếp”, “người máy”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000067
  locks:
  - Giữ đại từ “Tôi” và phản thân “mình”, cấu trúc phủ định kép khi tự so sánh với “những thiên tài” và “những người có năng khiếu”, cùng nhận định tự trào về tính cách méo mó và “một mớ phức cảm rối rắm”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000068
  locks:
  - Giữ sự đối lập giữa lòng kính phục “Những người thật sự nhân hậu” với nhận thức về “thói đạo đức giả” ở mức độ được xã hội xem là lành mạnh, và thái độ tự khinh bỉ sự thiếu chân thành của bản thân.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000069
  locks:
  - Giữ cấu trúc nhượng bộ tự nhận thức bản thân tệ hại nhưng vẫn ngạo mạn cho mình vượt trội hơn kẻ đang khóc lóc trước mặt, thuật ngữ “hiệu quả chi phí”, việc “tái cơ cấu các phòng ban được chỉ định sáp nhập bằng cách cắt giảm nhân sự”, tình thái dự đoán “hẳn là” và chức danh “giám đốc nhân sự”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000070
  locks:
  - Giữ tình thái giả định trái thực tế trong quá khứ “Đáng lẽ cuộc đời tôi phải khá suôn sẻ.” ở dạng văn bản thường.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000071
  locks:
  - Giữ toàn bộ câu trong dấu nghiêng `*…Đáng lẽ là vậy.*` theo DEC-P01-002 và sắc thái giả định dở dang nối tiếp p000070.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000072
  locks:
  - Giữ toàn bộ câu chuyển cảnh hồi ức trong dấu nghiêng `*Nghĩ đến đó, một chuyện khá khó chịu lại hiện lên trong đầu.*` theo DEC-P01-002.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000073
  locks:
  - Giữ mệnh đề “sinh vật chính trị”, thuật ngữ “giấy sa thải”, sự đối lập giữa “cảm xúc bản năng” với “lý lẽ hay những điều cấm kỵ được mọi người chấp nhận”, cụm trong ngoặc kép “đàng hoàng” đi với “giới tinh hoa học thuật”, chức danh “Giám đốc” và đại từ “ông ấy” khi nhắc lời cảnh báo phải đề phòng ở nhà ga.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000074
  locks:
  - Giữ đúng phạm vi chữ nghiêng cho từ tượng thanh `*Rầm!*` ở đầu đoạn theo DEC-P01-002, đại từ ngôi thứ nhất “tôi”, hình ảnh rơi khỏi sân ga trong “chuyển động chậm kỳ dị” và khoảnh khắc nhìn thấy đoàn tàu trước khi ý thức tắt lịm.
