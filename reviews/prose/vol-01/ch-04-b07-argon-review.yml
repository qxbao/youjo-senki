- id: ch04-b07-tanya-pov-return-dissociation-pronouns-and-war-college-dialogue
  source_term: Tanya third-person narration and POV-dissociation pronouns vs first-person interior monologue pronouns after space-break1 across p000144–p000156 and p000159, intra-paragraph and self-dissociated pronoun shifts in p000148 and p000150, third-person references to First Lieutenant Schwarkopf and Corporal Serebryakov in p000145, generic second-person omission in p000146, polite dialogue between Tanya and a fellow war college officer in p000156–p000158, and exact preservation of italicized emphasis in p000151
  proposed_vi: sau ngắt cảnh (space-break1) tại p000144, mạch truyện chuyển từ góc nhìn của Hội đồng Tuyển sinh / Thiếu tá von Lergen (ch-04-b01 → ch-04-b06) về lại điểm nhìn của Tanya tại mặt trận Rhine và Học viện Chiến tranh Đế quốc, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–3: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000144–p000146, câu 1 và vế đầu câu 2 p000148, p000149, câu 1 p000150, p000151–p000156, p000159), dùng tên riêng “Tanya” / “Trung úy Tanya Degurechaff” và đại từ trần thuật “nó” / “Nó” kết hợp phản thân “mình” (tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya); trong các câu độc thoại nội tâm ngôi thứ nhất của Tanya (vế sau câu 2 và câu 3 p000148, câu 2–3 p000150), dùng nhất quán đại từ tự quy chiếu “mình” theo đúng DEC-P01-001; đặc biệt bảo toàn chính xác sự chuyển đổi từ ngôi thứ ba (“Trung úy Tanya Degurechaff” / “nó”) sang ngôi thứ nhất nội tâm (“mình”) ngay trong cùng đoạn văn tại p000148, cũng như sự tách biệt chủ thể trong tâm lý của nhân vật chính tại câu 2 p000150 khi ngôi thứ nhất nội tâm (“mình”) nhìn nhận thân xác/danh tính “Tanya” từ góc độ người quản lý tiếp thị tài sản (“giá trị của con bé”; phương án thay thế: “giá trị của nó” / “giá trị của Tanya”); tại câu 3 p000145, quy chiếu Trung úy Schwarkopf bằng “anh” và Hạ sĩ Serebryakov bằng “cô” để phân biệt rạch ròi hai nhân vật với “Tanya” / “nó”; tại câu 2 p000146 và câu 3 p000154, lược đại từ ngôi thứ hai phiếm chỉ hoặc dùng chủ ngữ khái quát “người ta” theo quy ước direct-address choice; trong đoạn đối thoại trực tiếp giữa Tanya và vị sĩ quan đồng môn tại học viện chiến tranh (p000156–p000158): Tanya tự xưng “tôi” kèm tiểu từ lịch sự “ạ” và câu đáp lễ phép “Vâng, đại loại là như vậy ạ” / “Xin cứ xem... rồi cười xòa cho qua đi ạ” (giữ đúng sắc thái quân phong lễ phép mà không tự suy diễn cấp bậc cụ thể của người hỏi theo DEC-P01-001), còn vị sĩ quan đồng môn gọi Tanya là “cô” (p000157 — đồng bộ cách gọi lịch sự dành cho nữ sĩ quan ở Chương 1–3; từ “nó” trong lời thoại p000156–p000157 quy chiếu bộ trang bị / khẩu súng trường); quy chiếu Cục Nhân sự (p000146) và các học viên cùng lớp tại học viện chiến tranh (p000159) bằng đại từ số nhiều “họ”; bảo toàn chính xác cấu trúc tăng tiến đổi chủ thể tại p000144, cấu trúc khẳng định – phủ định kép tại p000153, câu hỏi xác nhận tại p000157, các cấu trúc giả định tại p000148, p000150, p000151, p000156, và bảo toàn tuyệt đối duy nhất cụm nhấn mạnh Markdown `*và*` tại câu 1 p000151 theo đúng DEC-P01-002 (15/16 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - giá trị của nó / giá trị của Tanya (thay cho “giá trị của con bé” tại câu 2 p000150 — ưu tiên “giá trị của con bé” để làm rõ khoảng cách tâm lý khi chủ thể “mình” nhìn nhận nhân vật “Tanya” như một nguồn vốn con người cần tiếp thị)
