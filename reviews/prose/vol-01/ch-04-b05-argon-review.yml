- id: ch04-b05-committee-interrogation-lergen-interior-monologue-pronouns-and-emphasis
  source_term: Imperial War College Admissions Committee third-person narration pronouns for Tanya, Lergen, Zettour, the academic advisor, Intelligence, and committee members in p000088/p000091/p000097–p000098/p000104–p000105/p000107–p000108/p000110–p000112, Lergen first-person interior monologue pronouns and wary reference to Tanya in p000094/p000100/p000101, conference dialogue pronouns between Brigadier General von Zettour, committee members, and Major von Lergen in p000089–p000090/p000092–p000093/p000095–p000096/p000098–p000099/p000102–p000103/p000106/p000109, counterfactual conditional and epistemic modality in p000094/p000105/p000108/p000109/p000111/p000112, and exact preservation of italicized spans in p000094/p000097/p000100/p000101
  proposed_vi: tiếp nối cảnh chất vấn giữa Chuẩn tướng von Zettour và Thiếu tá von Lergen tại Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc từ ch-04-b04 kết hợp ba đoạn độc thoại nội tâm của Thiếu tá von Lergen (p000094, p000100, p000101), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của hội đồng hay Lergen; lưu ý từ “nó” tại p000110 hoàn toàn chỉ quy chiếu danh từ bất động vật là “bài huấn luyện thâm nhập tầm xa”): trong lời kể ngôi thứ ba khách quan (p000088, p000091, p000097, p000098, p000104, p000105, p000107, p000108, p000110–p000112), quy chiếu Trung úy Tanya Degurechaff nhất quán bằng đại từ “cô” (và danh ngữ “đứa trẻ ấy” / “đứa trẻ này” / “Tanya” tại p000104, p000108, p000112), đồng bộ hoàn toàn với ch-04-b03, ch-04-b04 và ch-01-b15 → ch-01-b18; quy chiếu Thiếu tá von Lergen, Chuẩn tướng von Zettour và vị cố vấn học tập bằng đại từ trang trọng trung tính “ông” kết hợp phản thân “mình” / “bản thân” (p000088, p000091, p000097, p000098, p000104, p000105, p000111, p000112; tại câu 2 p000111 làm rõ danh ngữ “ngay cả người đó” cho người quen bên Tình báo để tránh nhập nhằng đại từ với Lergen); quy chiếu bên Tình báo và tập thể các thành viên hội đồng bằng “họ” (p000105, p000108, p000109, p000112) và dùng chủ ngữ phiếm chỉ “người ta” ở câu 1 p000111; trong các đoạn độc thoại nội tâm trực tiếp của Lergen (p000094, p000100, p000101), Lergen tự quy chiếu bằng “mình” / “Mình” và gọi Tanya bằng “cô ta” / “Cô ta” để khắc họa thái độ dè chừng, ghê sợ trước sự bất thường của Tanya, đồng bộ hoàn toàn với nội tâm của Lergen ở ch-04-b04 (p000080, p000083) và ch-01-b15 (p000280) / ch-01-b18 (p000021); trong lời thoại tại cuộc họp: Chuẩn tướng von Zettour và thành viên hội đồng đặt câu hỏi (p000089, p000095, p000102, p000106) gọi cấp dưới là Thiếu tá von Lergen bằng “anh” / “Anh” (đồng bộ ch-04-b02 → ch-04-b04) và quy chiếu Tanya bằng “Trung úy Degurechaff” / “cô ấy”; Thiếu tá von Lergen (p000090, p000093, p000096, p000099, p000103, p000109) tự xưng “Tôi” / “tôi” và quy chiếu Tanya bằng “cô ấy” / “Cô ấy”; bảo toàn chính xác toàn bộ các câu hỏi trực tiếp và câu hỏi tu từ/cảm thán (p000089, p000092, p000095, p000097, p000098, p000102, p000106, p000108, p000110), các cấu trúc giả định/suy đoán tại p000094, p000105, p000108, p000109, p000111, p000112, và bảo toàn tuyệt đối phạm vi nhấn mạnh `*...*` tại p000094 (in nghiêng toàn đoạn), p000097 (chính xác hai cụm `*bất thường*`), p000100 (in nghiêng toàn đoạn) và p000101 (in nghiêng toàn câu) theo đúng DEC-P01-002
  alternatives_vi:
  - cô ấy (thay cho “cô ta” / “Cô ta” trong độc thoại nội tâm của Lergen tại p000094, p000100, p000101 — ưu tiên “cô ta” / “Cô ta” để đồng bộ với ch-04-b04 p000080, p000083 và thể hiện rõ cảm giác rợn ngợp, dè chừng trong tâm tưởng của Lergen đối lập với cách gọi lịch sự “cô ấy” khi phát biểu trước hội đồng)
