- id: ch03-b06-hosman-pov-continuity-sentinel-thing-shift-and-emphasis
  source_term: Third-person narration from First Lieutenant Michel Hosman and the 228th Reconnaissance Mage Company’s perspective across p000083–p000103, shift in Republican references to the Imperial sentinel (Tanya) from default male/military terms (p000083–p000095) to inanimate terror references (p000096, p000100), Hosman interior plural self-reference in p000083, subordinate references in p000087/p000098/p000103, conditionals and past counterfactuals in p000090/p000092/p000095, and exact preservation of 6 italicized spans across 5 segments (p000083, p000090, p000096, p000099, p000101)
  proposed_vi: tiếp nối trực tiếp lô ch-03-b05, toàn bộ lô ch-03-b06 được trần thuật từ góc nhìn ngôi thứ ba bám sát Trung úy Michel Hosman và Đại đội Pháp sư Trinh sát số 228 thuộc Quân đội Cộng hòa François, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của nhân vật khác): quy chiếu Trung úy Michel Hosman bằng tên riêng / cấp bậc (“Trung úy Hosman”, “Hosman”) và đại từ “ông” / “Ông” (p000085, p000088, p000101), quy chiếu tập thể Trung đội Mike / đại đội bằng đại từ số nhiều “họ” kết hợp phản thân “mình” (p000085, p000088, p000090, p000092, p000096, p000101), quy chiếu từng thành viên thuộc cấp trong Trung đội Mike bằng “anh ta” / “Anh ta” (p000087, p000098, p000103), và dùng “Chúng ta” trong câu nhận định nội tâm của đại đội trưởng Hosman về đơn vị mình ở câu 4 p000083; đặc biệt bảo toàn chính xác sự chuyển biến tâm lý trong cách phía Cộng hòa quy chiếu pháp sư cảnh giới Đế quốc (Tanya) theo sát văn bản nguồn: từ p000083 đến p000095, khi chưa chứng kiến tận mắt sự phi nhân tính ở cự ly gần, Hosman và các thành viên Trung đội Mike tiếp tục gọi mục tiêu bằng các danh ngữ quân sự/trung tính hoặc đại từ nam giới mặc định (“tên lính cảnh giới kia” ở p000083, “tên lính địch”, “Mục tiêu địch”, “tên pháp sư đơn độc kia” ở p000085, “Hắn” / “hắn” ở p000086, p000091, p000092, “tên pháp sư” / “tên pháp sư địch” ở p000087, p000092, p000095, “Đối thủ gan dạ” ở p000090, “Tên khốn đó” ở p000094), nhưng từ p000096 đến p000100, khi mục tiêu lao xuyên qua biển lửa đạn thuật thức nổ mà không hề hấn gì và chém đôi Mike 3, nguồn chuyển sang gọi mục tiêu như một sinh vật phi nhân tính bằng danh từ chỉ vật và đại từ bất động vật — bản dịch phản ánh chính xác sự kinh hoàng này bằng “*Thứ* đó” và “nó” (p000096), “Thứ đó” và “Nó” (p000100), hoàn toàn tách biệt với đại từ trần thuật “nó” của Tanya theo DEC-P01-001; bảo toàn đầy đủ các câu hỏi trực tiếp trên vô tuyến và câu hỏi nội tâm/nghi vấn của Hosman (p000086, p000088, p000100, p000101, p000102), cấu trúc giả định quá khứ và điều kiện ở p000090, cấu trúc nhượng bộ ở p000092, giả định trái thực tế ở quá khứ cùng dấu chấm lửng ở p000095, và bảo toàn tuyệt đối chính xác 6 vị trí nhấn mạnh Markdown `*...*` trong 5 đoạn có thẻ in nghiêng của nguyên tác là p000083 (`*Chúng ta đang phải đối đầu với một đối thủ đáng gờm đây.*`), p000090 (`*Nhổ bỏ đôi mắt đó.*`), p000096 (`*Thứ*`), p000099 (`“*Pan-pan, pan-pan, pan-pan!*”`) và p000101 (`*Cái gì thế kia? Cái quái gì thế kia?*` và `*Một pháp sư thực sự có thể di chuyển… nhanh đến thế sao?*`) theo đúng DEC-P01-002 (16/21 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
