  source_term: Tanya interior monologue self-reference, staged radio monologue self-reference, and Lieutenant Colonel Sue third-person/dialogue/interior pronouns
  proposed_vi: độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng “mình” / “Mình” / “bản thân” xuyên suốt (p000214, p000217, p000218, p000220, p000221, p000223, p000225–p000228); trong các câu nói thành tiếng mà Tanya cố ý phát qua vô tuyến để sở chỉ huy (CP) nghe thấy và làm nhân chứng (p000215, p000219, p000222) dùng đại từ ngôi thứ nhất “tôi” / “Tôi” đồng bộ với xưng hô trên sóng vô tuyến của Fairy 08 ở b10–b12; ở nửa sau lô (p000229–p000236), trần thuật ngôi thứ ba quy chiếu Trung tá Sue bằng “ông” (đồng bộ b06-sue-cunningham-address), thuộc cấp gọi “Chỉ huy Sue” và tự xưng “tôi” (p000229), còn Trung tá Sue tự xưng “Tôi” và dùng “Chúng ta” trong đối thoại và câu hỏi nội tâm tập thể (p000234, p000235)
