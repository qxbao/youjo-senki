locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000214
  locks:
  - Giữ đại từ nội tâm “mình” và câu điều kiện giả định “Giờ thì lỡ tình huống tồi tệ nhất có xảy ra và quân địch bắn hạ mình, mình cũng sẽ có thể thoát thân mà không gục ngã vì đau đớn.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000215
  locks:
  - Giữ nhịp câu cảm thán hưng phấn giả tạo phát qua vô tuyến và đại từ “Tôi” ở câu cuối “Tôi gần như không kìm nổi lòng mình nữa rồi.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000216
  locks:
  - Giữ nguyên câu gọi hỏi lại trên vô tuyến ““Fairy 08?””.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000217
  locks:
  - Giữ thuật ngữ “sở chỉ huy (CP)”, đại từ nội tâm “mình” và nhận định “Ngay cả khi cả thế giới đang quay cuồng đầy khoái cảm, bộ não của một pháp sư vẫn duy trì được tư duy tỉnh táo.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000218
  locks:
  - Giữ đại từ nội tâm “mình” và mệnh đề nhượng bộ cuối câu “Mình thật may mắn khi là một pháp sư… dù cũng chẳng phải là mình muốn làm lính tráng gì đâu.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000219
  locks:
  - Giữ đại từ “Tôi” / “tôi” trong lời diễn kịch qua vô tuyến và cụm “ngôi sao của chiến trường, được một mình nghênh chiến với cả một đạo quân”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000220
  locks:
  - Giữ phủ định tuyệt đối “Tuyệt đối không đời nào mình lại phải bỏ mạng ở chốn này.”, thuật ngữ “thất bại thị trường” và cụm “Những khiếm khuyết của thị trường cần phải được uốn nắn.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000221
  locks:
  - Giữ các thuật ngữ kinh tế – thương mại “chi phí”, “chiến lược tiếp thị”, “tự quảng bá” và đại từ nội tâm “mình” / “bản thân”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000222
  locks:
  - Giữ đại từ “Tôi” / “tôi” trong lời thoại phát qua vô tuyến và hình ảnh đối lập “bị chìm nghỉm giữa cả quân ta lẫn quân địch trong cảnh hỗn loạn của trận chiến, nhưng thay vào đó tôi lại được đứng dưới ánh đèn sân khấu”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000223
  locks:
  - Giữ sự phủ định “Chuyện đó chẳng làm mình vui vẻ mảy may nào”, phần chú thích trong ngoặc đơn “(hay còn gọi là các sĩ quan cấp trên của mình)” và đại từ nội tâm “mình” / “bản thân”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000224
  locks:
  - Giữ nguyên cấu trúc dấu nháy đơn lồng trong ngoặc kép ““Thì ra cảm giác xúc động sâu sắc là như thế này đây. ‘Hôm nay là một ngày đẹp trời để chết…’ Khốn thật, đúng là thế thật.””.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000225
  locks:
  - Giữ các thuật ngữ “bộ thiết bị quan sát”, “các động tác cơ động không chiến cơ bản”, đại từ nội tâm “mình” và câu kết “điều duy nhất quan trọng lúc này là thực hiện phận sự và sống sót.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000226
  locks:
  - Giữ cụm “một màn quần thảo trên không ra dáng”, “pháo binh của ta” và đại từ nội tâm “mình”.
