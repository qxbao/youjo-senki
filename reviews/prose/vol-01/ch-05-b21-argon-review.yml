  - segment_id: YS-LN01/Text/chapter011.xhtml/p000526
    choices:
      - "Đại từ & nghĩa: quy chiếu viên thiếu úy trẻ bằng 'anh ta' và giữ nhận định 'cho thấy rõ rằng anh ta cho chuyện này thật lố bịch'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000527
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002), cấp bậc & xưng hô: khóa '*tôi xin lỗi*' chỉ ở cụm từ được nhấn mạnh tương ứng 1:1 với thẻ <html:em> trong nguồn, giữ phần còn lại nằm ngoài dấu '*...*'; trong thoại vị thiếu tá gọi đối phương là 'Thiếu úy' và xưng 'tôi – anh' (kèm phản thân 'mình'); trong trần thuật phân biệt rõ vị thiếu tá ('Vị thiếu tá' / 'một thiếu tá' / 'Ông' / 'ông') với viên thiếu úy ('anh ta' / 'một thiếu úy' / 'viên thiếu úy')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000528
    choices:
      - "Xưng hô thoại & dấu câu (thiếu úy -> thiếu tá): giữ dấu chấm lửng mở đầu '…', cặp xưng hô 'ngài – tôi' đồng bộ với p000524 và câu hỏi bất mãn."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000529
    choices:
      - "Xưng hô thoại & điều kiện (thiếu tá -> thiếu úy): giữ cặp 'Tôi / tôi – anh' đồng bộ với p000527 và bảo toàn câu điều kiện 'Nếu có dịp nào đó, tôi hy vọng anh sẽ tình nguyện tham gia.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000530
    choices:
      - "Đại từ, tình thái & nhân quả: quy chiếu vị thiếu tá bằng 'vị thiếu tá' / 'ông' và viên thiếu úy bằng 'viên sĩ quan trẻ' / 'anh ta'; bảo toàn tình thái 'Có lẽ' và quan hệ nhân quả 'bởi anh ta thả lỏng nắm đấm, thực hiện một động tác chào nhà binh hoàn hảo rồi cúi đầu trước khi bước ra ngoài'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000531
    choices:
      - "Thoại điều lệnh & cấp bậc (thiếu úy -> thiếu tá): khóa câu chào rút lui '“Tôi xin phép lui ra, thưa Thiếu tá.”'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000532
    choices:
      - "Cấp bậc, thuật ngữ, phủ định & nhân quả: khóa 'Viên thiếu úy' / 'Viên thiếu úy trẻ', 'vị thiếu tá', 'thuật thức quang học' và 'những người quan sát'; bảo toàn phủ định tuyệt đối 'không hề mảy may hay biết rằng mình đang bị quan sát' và quan hệ nhân quả ở câu cuối."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000533
    choices:
      - "Xưng hô thoại, đại từ, thuật ngữ & phủ định: giữ 'tôi' / 'chúng ta' trong thoại, khóa 'các biện pháp đối phó với thuật thức quang học', 'một sĩ quan có quân hàm' và 'vở kịch hạng ba'; quy chiếu sĩ quan lên tiếng bằng 'Ông', nhóm quan sát viên bằng 'Họ' / 'họ' và bảo toàn phủ định 'họ chẳng lấy gì làm vui vẻ về chuyện đó'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000534
    choices:
      - "Thuật ngữ, đại từ & phủ định: khóa 'bài kiểm tra', quy chiếu nhóm quan sát viên bằng 'họ' và bảo toàn cấu trúc phủ định 'đám ngốc cứ thế thao thao bất tuyệt mà chẳng hề nhận ra trò đánh lừa'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000535
    choices:
      - "Thuật ngữ & cơ chế giải thích: khóa 'một hình ảnh 3-D giả', 'các thuật thức hệ quang học', 'một người không có thật', 'ngụy trang', 'các thuật thức quang học' và 'bố cục nội thất'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000536
    choices:
      - "Thuật ngữ, cấp bậc, đại từ & nhượng bộ: khóa mệnh đề nhượng bộ ở câu 1, 'các sĩ quan cấp cao', 'Viên thiếu úy' (quy chiếu bằng 'anh ta' / 'Anh ta'), 'màn độc diễn' và 'hội đồng đánh giá'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000537
    choices:
      - "Thuật ngữ, phủ định & giả định trái thực tế: khóa 'pháp sư', 'năng lực nhận thức', 'lẽ thường', 'Viên thiếu úy', 'kinh nghiệm thực chiến', 'đạo quân phía đông' và 'bộ tổng tham mưu' (viết thường khi làm danh từ chung đi với phủ định); bảo toàn phủ định ở câu 1 cùng cấu trúc giả định và phủ định ở câu 3 'Chuyện đó hẳn sẽ rất đáng mừng nếu đối tượng của bài kiểm tra là quân địch, nhưng chẳng có bộ tổng tham mưu nào lại lấy làm vui vẻ khi chứng kiến lực lượng của chính mình kém cỏi đến nhường nào.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000538
    choices:
      - "Thoại, xử lý đại từ phiếm chỉ & thuật ngữ: khóa câu hỏi tán đồng 'Đúng vậy nhỉ?', xử lý đại từ ngôi thứ hai phiếm chỉ bằng cấu trúc khái quát không đại từ 'Mặc dù cũng khó mà trách họ vì có tầm nhìn hạn hẹp được.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000539
    choices:
      - "Điểm nhìn & đại từ (DEC-P01-001), cấp bậc & thuật ngữ: khóa 'Đại úy von Degurechaff', 'đạo quân phía đông' và đại từ 'cô' quy chiếu Tanya từ điểm nhìn bên ngoài của hội đồng đánh giá thuộc Bộ Tổng Tham mưu (không áp dụng 'nó' ngoài điểm nhìn trần thuật của Tanya theo giới hạn DEC-P01-001); bảo toàn tương phản thời gian 'Cho đến tận vài ngày trước... nhưng giờ đây mặt mày họ đều tái mét.'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000540
    choices:
      - "Đại từ (DEC-P01-001), thuật ngữ & phủ định: giữ 'cô' đồng bộ với p000539, khóa 'bài kiểm tra', 'đơn vị tinh nhuệ' và cấu trúc phủ định gần như tuyệt đối 'Việc hầu như chẳng có một ai từ phương đông vượt qua được đang thổi bùng lên một cơn bão phẫn nộ.'."
