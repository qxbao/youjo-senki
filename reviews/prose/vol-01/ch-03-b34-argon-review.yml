  rationale: "Kế thừa đồng bộ toàn bộ hệ thống thuật ngữ quân sự, pháp thuật, tôn giáo và câu thoại phát lại từ băng ghi hình đã khóa ở Chương 2 và các lô trước của Chương 3: “Quân đội Cộng hòa” (ch-03-b32 p000223, ch-03-b33 p000269: p000278, p000279), “kỷ luật hỏa lực” (ch-03-b07 p000117, ch-03-b28 p000151: p000278), “các pháp sư Đế quốc” / “pháp sư Đế quốc” (ch-03-b28 p000149, ch-03-b32 p000246: p000278, p000285), “học thuyết” và “ưu thế về quân số” (pending-terms-index.yml vol-04, ch-03-b28 p000150, ch-03-b29 p000164: p000279), “Ác quỷ” (ch-03-b33 p000267, p000269: p000280), “kích nổ không gian” và “giai đoạn ngắm bắn ban đầu” (ch-03-b27 p000129, ch-03-b28 p000141, ch-03-b29 p000167: p000280), “các động tác cơ động né tránh” (ch-03-b28 p000142, p000146, ch-03-b32 p000241: p000281), “hỏa lực bắn có kỷ luật”, “đạn dẫn đường”, “thuật thức nổ” và “đường bay” (B15-T11, ch-03-b28 p000141, p000146, ch-03-b29 p000169, ch-03-b33 p000276: p000282), “khóa mục tiêu” (ch-03-b28 p000139: p000283), “giá trị mana quan sát được”, “quả cầu tính toán” và “giao thoa phức hợp chồng chập” (ch-02-b15 p000184, ch-03-b09 p000162: p000284, p000313), “Thiết bị quan sát” (ch-02-b15 p000191, ch-02-b19 p000289: p000286, p000311), “phản ứng cố định mana” / “sự cố định”, “hiện tượng mana được thi triển” và “các tọa độ không gian” (ch-02-b11 p000088, ch-02-b15 p000184, p000186, ch-03-b08 p000145, ch-03-b29 p000163: p000288, p000289), “công nghệ pháp sư” (ch-03-b08 p000152: p000291), “Đại đội 106” (ch-03-b32 p000237, ch-03-b33 p000271: p000307), “Thượng đế” / “Chúa” / “ngài” (pending-terms-index.yml vol-01/vol-02: p000292, p000296, p000297, p000298, p000299, p000308, p000309, p000310, p000314, p000315); đặc biệt bảo toàn nguyên văn 100% tám đoạn trích lời cầu nguyện và cảnh báo của Tanya phát lại từ đoạn video thu được ở ch-03-b29, b30, b31 (p000292 = b29 p000176; p000297 = b29 p000178; p000299 = b30 p000186; p000301 + p000303 = b30 p000195; p000306 = b30 p000197; p000308 = b31 p000206; p000310 = b31 p000209; p000312 = b31 p000213)."
