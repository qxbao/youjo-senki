- id: ch03-b34-republican-council-pov-pronouns-and-emphasis
  source_term: republican_council_pov_pronouns_and_emphasis_ch03_b34
  proposed_vi: "Toàn bộ 38 đoạn của lô ch-03-b34 (chapter007b.xhtml/p000278–p000315, khép lại Chương 3) tiếp nối trực tiếp cuộc họp Hội đồng chiến thuật bên phía Bộ Tổng Tham mưu Cộng hòa từ ch-03-b33, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Tuân thủ giới hạn chủ thể và ngữ cảnh của DEC-P01-001: vì Tanya không phải là chủ thể điểm nhìn của phân cảnh này, bản dịch tuyệt đối không mở rộng đại từ trần thuật “nó” sang chỉ pháp sư Đế quốc (từ “nó” ở câu 2 p000293 chỉ quy chiếu danh từ vô tri “Hình ảnh”). Trước khi hình ảnh phóng cận cảnh lộ diện ở p000293–p000294, bản dịch giữ cách quy chiếu trung tính “Ác quỷ” (p000280), “kẻ địch / pháp sư này” (p000281, p000282), “đối thủ” (p000282, p000283), “một pháp sư Đế quốc” (p000285); từ p000294 trở đi, khi các sĩ quan Cộng hòa sững sờ nhận ra bóng hình trên màn hình là một đứa trẻ (“…Đó là một đứa trẻ!”) và nguyên bản chuyển sang dùng đại từ ngôi thứ ba giống cái theo điểm nhìn quan sát trực tiếp của hội đồng Cộng hòa, bản dịch chuyển sang dùng “cô bé” (p000295, p000298, p000300, p000302, p000304, p000305, p000307, p000309, p000313) rất tự nhiên và nhất quán. (2) Giữ chuẩn xác hệ thống đại từ nhân xưng trong thoại cuộc họp, nội tâm tập thể của các sĩ quan Cộng hòa và lời tuyên cáo phát lại trên màn hình: sĩ quan trong phòng họp hỏi người báo cáo bằng “anh” (p000281), trần thuật quy chiếu sĩ quan phát biểu và sĩ quan công nghệ bằng “anh ta” (p000288, p000291); câu hỏi nội tâm của các sĩ quan Cộng hòa hướng tới pháp sư trên màn hình dùng “ngươi” (p000296), tự quy chiếu tập thể bằng “chúng tôi” (p000300), cầu xin Thượng đế bằng “chúng con” (p000314) và gọi Thượng đế bằng “ngài” (p000309, p000315); các câu phát lại từ băng ghi hình giữ nguyên 100% hệ đại từ đã khóa ở ch-03-b29/b30/b31 (“các ngươi - chúng ta” ở p000292; “Chúa/Thượng đế - con/chúng con” ở p000297, p000299; “Các người - tôi/chúng tôi” ở p000301, p000303, p000306; “chúng ta” ở p000308, p000310, p000312). (3) Kiểm tra chặt cấu trúc tăng tiến, điều kiện, giả định, phủ định và câu hỏi theo canon/style-guide.md: cấu trúc “Không chỉ… mà… còn…” tại câu 2 p000284 giữ đúng phạm vi tăng tiến xoay quanh lượng mana của quả cầu tính toán địch; bảo toàn trọn vẹn các mệnh đề nhượng bộ và phủ định tuyệt đối (p000279, p000283, p000289, p000290, p000309), câu điều kiện bỏ lửng (p000287), mệnh đề giả định (p000296, p000309), tình thái phỏng đoán (p000280, p000293, p000307) và mọi câu hỏi trực tiếp/nội tâm (p000281, p000284, p000296, p000298, p000300, p000306, p000315). (4) Tuân thủ nghiêm ngặt DEC-P01-002 về nhấn mạnh Markdown: chỉ đúng 3/38 đoạn nguồn có thẻ nhấn mạnh là câu 1 p000296, vế đầu câu 1 p000300 và toàn bộ p000315, được bảo toàn chính xác phạm vi bằng dấu `*...*` trong khi phần trần thuật còn lại của p000296 và p000300 nằm ngoài dấu `*`; 35/38 đoạn còn lại không có nhấn mạnh trong XHTML nguồn và hoàn toàn không dùng `*...*`."
  alternatives_vi:
  - "cô (thay cho “cô bé” tại p000295, p000298, p000300, p000302, p000304, p000305, p000307, p000309, p000313 — ưu tiên “cô bé” vì gắn kết trực tiếp với tiếng thốt lên “…Đó là một đứa trẻ!” ở p000294 và mô tả “còn khá nhỏ tuổi” ở p000295 dưới góc nhìn bàng hoàng của các sĩ quan Cộng hòa)"
