- segment_id: YS-LN01/Text/chapter007b.xhtml/p000278
  locks:
  - "Giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa cùng các thuật ngữ “Quân đội Cộng hòa”, “kỷ luật hỏa lực”, “sự vượt trội đã biết của các pháp sư Đế quốc” và “những pháp sư địch quá tự tin vốn có xu hướng tách lẻ ra”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000279
  locks:
  - "Giữ mệnh đề nhượng bộ với thuật ngữ “học thuyết lấy ưu thế về quân số làm tiền đề”, “Quân đội Cộng hòa” và mệnh đề phủ định tuyệt đối ở câu 2 (“trên đời này chẳng có pháp sư nào có thể trụ lại trên không một khi lưới đạn màn đã khai màn”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000280
  locks:
  - "Giữ các thuật ngữ đồng bộ với ch-03-b27/b28/b29: “Ác quỷ”, “các đòn kích nổ không gian”, “giai đoạn ngắm bắn ban đầu” và tình thái suy đoán “Nhiều khả năng là sau khi phát hiện đòn tấn công ngay trong giai đoạn ngắm bắn ban đầu và thoát khỏi đó chỉ trong tích tắc.”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000281
  locks:
  - "Giữ đại từ “anh”, các thuật ngữ “các động tác cơ động né tránh”, “pháp sư này”, “mọi đòn tấn công ma thuật dẫn đường” và bảo toàn trọn vẹn hai câu hỏi trực tiếp (gồm câu hỏi phủ định suy luận ở câu 2)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000282
  locks:
  - "Giữ chuỗi thuật ngữ đồng bộ với ch-03-b28/b29/b33: “Nguyên lý cơ bản của hỏa lực bắn có kỷ luật”, “một loạt đạn dẫn đường quy mô lớn”, “bắn trúng trực diện”, “ước tính vận tốc của đối thủ”, “các thuật thức nổ” và “dọc theo đường bay để đón lõng”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000283
  locks:
  - "Giữ câu điều kiện phủ định với thuật ngữ “khóa mục tiêu hay đo đạc thông số của đối thủ”, dấu gạch ngang dài ở câu 2 và sắc thái dè dặt mức độ ở cuối câu 3 (“lợi ích của việc chiến đấu theo nhóm sẽ giảm đi rất nhiều, dù chưa phải là bằng không”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000284
  locks:
  - "Giữ cấu trúc tăng tiến “Không chỉ giá trị mana quan sát được từ quả cầu tính toán của địch đã vượt quá xa giới hạn, mà lượng mana đó còn đang thu hẹp lại—hội tụ—và khuếch đại.” và câu hỏi cảm thán với thuật ngữ đồng bộ ch-02-b15: “Những vụ va chạm mana do giao thoa phức hợp chồng chập kích hoạt đang tạo ra… nhiều quầng sáng ư?!”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000285
  locks:
  - "Giữ cấu trúc nhấn mạnh số lượng: “Chỉ một pháp sư Đế quốc duy nhất mà đã huy động được lượng mana ngang ngửa vài người thi triển cộng lại.”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000286
  locks:
  - "Giữ câu báo cáo với thuật ngữ đồng bộ ch-02-b15/b19: ““Thiết bị quan sát cũng trả về một giá trị vượt ngoài thang đo.””."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000287
  locks:
  - "Giữ nguyên tiếng thốt lên và câu điều kiện bỏ lửng bằng dấu gạch ngang dài: ““Phi lý! Nếu đúng là như vậy—””."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000288
  locks:
  - "Giữ đại từ “anh ta”, thuật ngữ “một phản ứng cố định mana” (đồng bộ ch-02-b15 và ch-03-b08/b09) và mệnh đề tương phản ở câu 3 (“một hiện tượng mà các pháp sư và các quốc gia từng nỗ lực đạt tới nhưng rốt cuộc đã phải từ bỏ”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000289
