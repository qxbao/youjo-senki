  - "hỏa lực có kiểm soát (thay cho “hỏa lực bắn có kỷ luật” tại p000282 — ưu tiên “hỏa lực bắn có kỷ luật” để đồng bộ trực tiếp với B15-T11, ch-03-b28 p000146 và ch-03-b33 p000276) / Khí cụ quan sát (thay cho “Thiết bị quan sát” tại p000286, p000311 — ưu tiên “Thiết bị quan sát” để đồng bộ trực tiếp với ch-02-b15 p000191 và ch-02-b19 p000289) / Sĩ quan kỹ thuật (thay cho “Sĩ quan công nghệ” tại p000291 — ưu tiên “Sĩ quan công nghệ” để hô ứng trực tiếp với “công nghệ pháp sư” trong cùng đoạn và “Ban Công nghệ Trung ương / Cục Công nghệ” trong pending-terms-index.yml vol-01) / thánh nữ đền thờ hoặc nữ tư tế (thay cho “vu nữ” tại p000302 — ưu tiên “vu nữ” vì ngắn gọn, giàu sắc thái trang nghiêm và sát nghĩa gốc)"
