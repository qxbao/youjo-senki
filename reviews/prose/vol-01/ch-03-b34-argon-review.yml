- id: ch03-b34-republican-fire-discipline-and-mana-fixation-terms
  source_term: republican_fire_discipline_and_mana_fixation_terms_ch03_b34
  proposed_vi: "Quân đội Cộng hòa / kỷ luật hỏa lực / các pháp sư Đế quốc / học thuyết / ưu thế về quân số / lưới đạn màn / Ác quỷ / các đòn kích nổ không gian / giai đoạn ngắm bắn ban đầu / các động tác cơ động né tránh / đòn tấn công ma thuật dẫn đường / hỏa lực bắn có kỷ luật / loạt đạn dẫn đường / bắn trúng trực diện / các thuật thức nổ / đường bay / khóa mục tiêu / giá trị mana quan sát được / quả cầu tính toán / thu hẹp lại—hội tụ—và khuếch đại / giao thoa phức hợp chồng chập / người thi triển / Thiết bị quan sát / vượt ngoài thang đo / phản ứng cố định mana / hiện tượng mana được thi triển / các tọa độ không gian / sự cố định / Sĩ quan công nghệ / công nghệ pháp sư / Tổ quốc / Thượng đế / vị thần hủy diệt / Chúa / lũ ngoại đạo / Đế quốc / vu nữ / thông điệp thần thánh / Đại đội 106 / các thánh đồ / phước lành / nhiễu sóng / làm chấn động cả không gian / miền đất hứa / chiếc hộp Pandora đã mở tung / màn hình / đoạn video"
  alternatives_vi:
  - "hỏa lực có kiểm soát (thay cho “hỏa lực bắn có kỷ luật” tại p000282 — ưu tiên “hỏa lực bắn có kỷ luật” để đồng bộ trực tiếp với B15-T11, ch-03-b28 p000146 và ch-03-b33 p000276) / Khí cụ quan sát (thay cho “Thiết bị quan sát” tại p000286, p000311 — ưu tiên “Thiết bị quan sát” để đồng bộ trực tiếp với ch-02-b15 p000191 và ch-02-b19 p000289) / Sĩ quan kỹ thuật (thay cho “Sĩ quan công nghệ” tại p000291 — ưu tiên “Sĩ quan công nghệ” để hô ứng trực tiếp với “công nghệ pháp sư” trong cùng đoạn và “Ban Công nghệ Trung ương / Cục Công nghệ” trong pending-terms-index.yml vol-01) / thánh nữ đền thờ hoặc nữ tư tế (thay cho “vu nữ” tại p000302 — ưu tiên “vu nữ” vì ngắn gọn, giàu sắc thái trang nghiêm và sát nghĩa gốc)"
