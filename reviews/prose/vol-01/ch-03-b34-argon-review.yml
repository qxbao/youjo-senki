  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 38 đoạn của ch-03-b34: giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa, chuyển từ cách quy chiếu trung tính sang “cô bé” đúng tại thời điểm các sĩ quan Cộng hòa nhận ra pháp sư trên màn hình là một đứa trẻ (p000294–p000313), đồng bộ 100% các câu thoại phát lại trên băng ghi hình với ch-03-b29/b30/b31, và chỉ đánh dấu nhấn mạnh Markdown tại đúng 3 vị trí có thẻ nhấn mạnh trong nguồn (p000296, p000300, p000315)."
