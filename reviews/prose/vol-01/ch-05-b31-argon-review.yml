    pov_and_pronouns: "Trần thuật ngôi thứ ba: quy chiếu Tanya bằng 'Cô' / 'cô', quy chiếu Elinium Arms bằng 'họ'."
    terms_and_ranks: "Elinium Arms; dự án tuyệt mật; Cục Mua sắm thuộc Bộ Tổng Tham mưu; Cục Quân vụ; viên quân cảnh."
    modality_and_negation: "Giữ giả định quá khứ phủ định kép 'Cô sẽ chẳng thể nào lấy được thứ gì từ họ nếu không có sự ngầm chấp thuận của...' ở câu 2 và giả định hệ quả đối lập 'Bằng không, viên quân cảnh có lẽ đã phải...' ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000133
    pov_and_pronouns: "Thoại của Tanya qua vô tuyến với các học viên: tự xưng 'Tôi', gọi 'các người' (lưu ý gợi ý nhỏ ở findings về từ 'mình' ở câu 2)."
    terms_and_ranks: "động tác cơ động; mục tiêu."
    modality_and_negation: "Giữ lời nhắc mệnh lệnh phủ định ở câu 1 ('Tôi đã bảo các người đừng có thực hiện...') và câu hỏi trách mắng phủ định ở câu 2 ('Sao các người không nhận ra...?')."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000134
    pov_and_pronouns: "Trần thuật ngôi thứ ba: gọi 'Thiếu tá von Degurechaff' và quy chiếu bằng 'cô'; quy chiếu các pháp sư trong tiểu đoàn bằng 'họ' và 'đám học viên'."
    terms_and_ranks: "tiểu đoàn; tám nghìn feet; Thiếu tá von Degurechaff; Pháp sư Định danh; học viên."
    modality_and_negation: "Giữ sự tương phản rõ nét giữa các thành viên tiểu đoàn đang chật vật bay chậm chạp với chuyển động mượt mà, nhanh nhẹn của Thiếu tá von Degurechaff."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000135
    pov_and_pronouns: "Thoại của Tanya qua vô tuyến."
    terms_and_ranks: "thực chiến."
    modality_and_negation: "Giữ hai câu ngắn chuyển sang bước huấn luyện thực chiến."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000136
    pov_and_pronouns: "Thoại hô lệnh khẩn cấp của một pháp sư trong tiểu đoàn."
    terms_and_ranks: "cơ động né tránh bất quy tắc."
    modality_and_negation: "Bảo toàn chi tiết nói lắp đầu câu 'C-cơ động né tránh bất quy tắc!' và mệnh lệnh khẩn cấp."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000137
    pov_and_pronouns: "Thoại của sĩ quan/kỹ sư quan sát: tự xưng 'Tôi', quy chiếu các pháp sư bằng 'Họ'."
    terms_and_ranks: "cơ động né tránh; duy trì song song các thuật thức."
    modality_and_negation: "Giữ dấu ba chấm mở đầu, câu phủ định 'Tôi không thể tin nổi.' ở câu 1 và câu hỏi kinh ngạc ở câu 2."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000138
    pov_and_pronouns: "Trần thuật ngôi thứ ba: quy chiếu đoàn thanh tra bằng 'họ' (câu 1), các pháp sư bằng 'họ' (câu 2), và chủ thể quan sát phiếm chỉ bằng 'người ta'."
    terms_and_ranks: "Bài diễn tập; pháp sư; tiểu đoàn."
    modality_and_negation: "Giữ sự tương phản bề ngoài khi nhìn từ góc độ không chuyên ('Trông cứ như thể họ đang chơi trò đuổi bắt, và thoạt nhìn, người ta sẽ tự hỏi liệu có thể thảm hại đến mức đó được hay không.')."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000139
    pov_and_pronouns: "Trần thuật ngôi thứ ba từ góc nhìn chuyên môn: quy chiếu các pháp sư bằng 'Họ'."
    terms_and_ranks: "các thuật thức song song; quả cầu tính toán; cơ động né tránh bất quy tắc; cơ động thực chiến."
    modality_and_negation: "Giữ sự đối lập ở câu 1, mệnh đề quan hệ giả định phủ định 'điều vốn dĩ phải là bất khả thi về mặt kỹ thuật' ở câu 2, và thành phần giải thích trong cặp dấu gạch ngang dài ở câu 3."
    emphasis: "Bảo toàn chính xác nhấn mạnh Markdown '*lẫn*' ở câu 3 tương ứng 1:1 với thẻ <html:em> trong xhtml nguồn theo DEC-P01-002."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000140
    pov_and_pronouns: "Trần thuật ngôi thứ ba."
    terms_and_ranks: "pháp sư; triển khai; mồi nhử quang học; hỏa lực đối phương."
    modality_and_negation: "Giữ câu chuyển ý tăng tiến ở câu 1 và hành động chủ động triển khai mồi nhử quang học ở câu 2."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000141
    pov_and_pronouns: "Thoại kinh ngạc của người quan sát: quy chiếu các pháp sư bằng 'Họ'."
    terms_and_ranks: "mồi nhử."
    modality_and_negation: "Giữ câu cảm thán ngắn nhấn mạnh việc tạo thêm mồi nhử."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000142
    pov_and_pronouns: "Trần thuật ngôi thứ ba: quy chiếu các pháp sư bằng 'họ'."
    terms_and_ranks: "tài nguyên dư thừa; mồi nhử quang học; hành động né tránh."
    modality_and_negation: "Giữ câu diễn giải làm rõ năng lực dư tải của quả cầu tính toán và pháp sư."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000143
    pov_and_pronouns: "Trần thuật ngôi thứ ba."
    terms_and_ranks: "mồi nhử; triển khai; hiệu năng; tiêu chuẩn hóa; sản xuất hàng loạt."
    modality_and_negation: "Giữ sắc thái ngoại hiện 'trông khá giống thật' ở câu 1, 'thậm chí dường như còn đang tự động hành động' ở câu 2, và câu nhận định tổng kết ở câu 3–4."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000144
    pov_and_pronouns: "Thoại của kỹ sư/sĩ quan Bộ Tổng Tham mưu: dùng đại từ 'chúng ta'."
    terms_and_ranks: "Mẫu mới của Elinium."
    modality_and_negation: "Giữ câu khẳng định mức độ vượt ngoài sức tưởng tượng của mẫu quả cầu mới."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000145
    pov_and_pronouns: "Trần thuật ngôi thứ ba kết hợp suy nghĩ chung của các kỹ sư/sĩ quan Bộ Tổng Tham mưu: dùng đại từ 'chúng ta'."
    terms_and_ranks: "đưa vào trang bị; độ tin cậy; đơn vị; bài kiểm tra sức bền."
    modality_and_negation: "Giữ tính bắt buộc ở câu 1, giả định phủ định 'Sẽ chẳng một ai nói khác đi khi được chứng kiến cảnh tượng này.' ở câu 2, và phủ định 'Chí ít thì độ tin cậy cũng không phải là vấn đề' ở câu 3."
    emphasis: "Bảo toàn chính xác nhấn mạnh Markdown '*Đây nhất định phải là thứ tiếp theo chúng ta đưa vào trang bị.*' ở câu 1 tương ứng 1:1 với thẻ <html:em> trong xhtml nguồn theo DEC-P01-002."
