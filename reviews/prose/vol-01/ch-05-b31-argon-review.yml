    severity: minor
    category: pronoun_style
    issue: "Ở câu 2 của p000133 (lời Tanya quát các học viên qua vô tuyến), câu hỏi 'Sao các người không nhận ra mình là những mục tiêu dễ xơi đến mức nào hả?!' dùng từ phản thân 'mình' quy chiếu cho chủ ngữ ngôi thứ hai số nhiều ('các người')."
    basis: "Dù 'mình' làm đại từ phản thân trong lời thoại là tự nhiên trong tiếng Việt, quy ước DEC-P01-001 ưu tiên dành 'mình' cho độc thoại nội tâm tự quy chiếu ngôi thứ nhất của Tanya."
    recommendation: "Không ảnh hưởng nghĩa hay điểm nhìn vì nằm trong lời thoại trực tiếp; ở bước chuốt văn có thể giữ nguyên hoặc cân nhắc đổi thành 'bản thân' / lặp lại 'các người' nếu muốn tách bạch tuyệt đối với đại từ nội tâm."
