locked_choices:
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000001
  locks:
  - Giữ thế đối lập giữa năng lực “sĩ quan xuất sắc ngoài tiền tuyến” và phủ định chắc chắn “nhưng đầu óc cô chắc chắn không bình thường”, cùng đại từ “cô” cho Degurechaff.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000002
  locks:
  - Giữ các thuật ngữ “Quân đội Đế quốc”, “điều lệnh và thao luyện”, “những quân nhân chiến đấu đã qua đào tạo” và quan hệ nhân quả trong việc rèn luyện người lính.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000003
  locks:
  - Giữ cơ quan “Cục Nhân sự”, đại từ “ông” (Lergen) và “cô” (Degurechaff), cùng sự đối lập giữa “hình mẫu sĩ quan lý tưởng” và nhận định “tiềm ẩn nguy hiểm ở một số khía cạnh”.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000004
  locks:
  - Giữ các thuật ngữ “sự gắn kết đơn vị”, “hành động theo quyền tự quyết”, “mối đe dọa tiềm tàng” và nhận định chốt đoạn “Cô thực sự là một kẻ khát chiến.”.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000005
  locks:
  - Giữ câu độc thoại lẩm bẩm ngắn gọn “…Chuyện này chẳng đùa được đâu.”.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000006
  locks:
  - Giữ quan hệ nhượng bộ giữa việc biết quan điểm của mình thuộc về thiểu số và động lực yêu cầu xem xét lại “tấm huân chương đang được đề xuất”.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000007
  locks:
  - Giữ các thuật ngữ “quân tiếp viện”, “bộ binh”, “quả cầu tính toán”, chi tiết “dùng răng cắn giữ quả cầu tính toán của mình” và mục đích chiến lược “câu giờ và liều mạng bảo vệ các vị trí trọng yếu trên cơ thể trong khi cầm chân lực lượng địch lâu nhất có thể”.
