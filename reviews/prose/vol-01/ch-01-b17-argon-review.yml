- id: b17-lergen-pov-pronouns-and-apostrophe-monologue
  source_term: Major von Lergen third-person/interior pronouns, Tanya Degurechaff third-person reference from Lergen’s POV, and Lergen’s italicized apostrophe address to Degurechaff
  proposed_vi: trần thuật ngôi thứ ba tiếp nối điểm nhìn của Thiếu tá von Lergen tại Cục Nhân sự, quy chiếu Lergen nhất quán bằng đại từ “ông” kết hợp tên riêng “Lergen” và đại từ phản thân “mình” / “bản thân” (p000003, p000004, p000006–p000010, p000013 — đồng bộ b15–b16); quy chiếu Tanya Degurechaff từ góc nhìn của Lergen trong lời kể ngôi thứ ba và hai câu đầu p000011 bằng “cô” / “Cô gái” kèm họ “Degurechaff” (p000001–p000004, p000007–p000011 — tuân thủ nghiêm ngặt giới hạn của DEC-P01-001: không dùng “nó” ngoài điểm nhìn của Tanya); trong đoạn độc thoại nội tâm in nghiêng tại p000011 khi Lergen chuyển từ nhận định khách quan sang lời khẩn cầu trực tiếp hướng tới Degurechaff trong tâm tưởng, dùng cặp đại từ “Tôi – cô” trang trọng, chuẩn mực quân ngũ; trong câu hỏi tự vấn nội tâm in nghiêng tại p000012 dùng đại từ phản thân “mình”
  alternatives_vi:
  - ta – cô (thay cho “Tôi – cô” trong đoạn độc thoại nội tâm hướng tới Degurechaff tại p000011 — ưu tiên “Tôi – cô” để đồng bộ với cách tự xưng “Tôi” của Lergen tại b15 p000280 và giữ đúng sắc thái khẩn cầu của một quan chức tham mưu)
