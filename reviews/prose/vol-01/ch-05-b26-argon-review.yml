    severity: minor
    category: word_choice_and_nuance
    issue: "Cụm 'cái xác tả tơi của tôi' dùng từ 'cái xác' (thường gợi nghĩa thi thể đã chết) cho cơ thể bị gãy chân, thương tích của người kể khi vẫn còn sống."
    basis: "Trong ngữ cảnh p000627–p000630, nữ ứng viên chỉ bị gãy chân sau trận tuyết lở và được Tanya cứu ra rồi quẳng sang một bên; dù khẩu ngữ có thể nói phóng đại là 'cái xác', cách diễn đạt 'cái thân xác tả tơi' hoặc 'tấm thân tả tơi' sẽ tự nhiên và rõ nghĩa cơ thể bị thương hơn."
    recommendation: "Có thể cân nhắc chỉnh nhẹ thành 'cái thân xác tả tơi của tôi' hoặc 'tấm thân tả tơi của tôi' ở bước chuốt văn; không ảnh hưởng nghĩa cốt lõi."
