- id: ch03-b07-hosman-republican-pov-continuity-interior-monologue-pronouns-and-emphasis
  source_term: Third-person narration from First Lieutenant Michel Hosman and the 228th Reconnaissance Mage Company’s perspective across p000104–p000126, Hosman first-person interior monologue pronouns (company plural vs personal singular) in p000124, Republican references to the enemy mage (Tanya) across p000109–p000110/p000112–p000113/p000115–p000118/p000120–p000121/p000124/p000126, radio dialogue pronouns of Hosman (Golf 01), Golf 02, and Republican mages in p000104/p000114/p000125, conditionals and counterfactuals in p000106/p000110/p000112/p000115/p000117, and exact preservation of 3 italicized spans across p000106, p000120, and p000124
  proposed_vi: tiếp nối trực tiếp lô ch-03-b05 và ch-03-b06, toàn bộ lô ch-03-b07 được trần thuật từ góc nhìn ngôi thứ ba bám sát Trung úy Michel Hosman và Đại đội Pháp sư Trinh sát số 228 thuộc Quân đội Cộng hòa François, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của nhân vật khác): trong trần thuật ngôi thứ ba, quy chiếu Trung úy Michel Hosman bằng tên riêng / cấp bậc (“Trung úy Hosman”, “Hosman”) và đại từ “Ông” / “ông” kết hợp phản thân “mình” (p000105, p000106, p000109, p000113, p000120, p000123, p000124 — lưu ý từ “nó” trong “gạt nó sang một bên” tại câu 3 p000109 chỉ quy chiếu danh từ bất động vật “Câu hỏi lởn vởn trong đầu ông”), quy chiếu tập thể đại đội / các trung đội thuộc quyền bằng đại từ số nhiều “họ” / “Họ” (p000107, p000109, p000110, p000112, p000117, p000124), và quy chiếu thuộc cấp Golf 02 bằng “anh ta” (p000115, p000121); quy chiếu pháp sư địch (Tanya) từ góc nhìn của phía Cộng hòa bằng các danh ngữ quân sự/nhận định (“Kẻ địch” / “kẻ địch”, “Đối thủ của họ”, “tên pháp sư đó”, “mục tiêu của họ”, “đối phương”, “Tên pháp sư địch” / “tên pháp sư địch”, “một con quái vật—một Named chưa từng được biết tới”) và đại từ nam giới mặc định “hắn” / “Hắn” trong lời thoại của binh sĩ Cộng hòa trên sóng vô tuyến tại p000116 và p000118 (đồng bộ với ch-03-b05 p000071, p000081 và ch-03-b06 p000086, p000091, p000092); trong lời thoại vô tuyến và độc thoại nội tâm trực tiếp: Hosman dùng “Chúng ta” khi ra lệnh cho hai trung đội Bravo và Golf quay lại yểm trợ Mike (p000104), dùng “chúng ta” / “Chúng ta” cho toàn đại đội bị chia cắt và tự xưng “tôi” khi tự trách bản thân trước thương vong của thuộc cấp trong 4 câu độc thoại nội tâm tại p000124 (tách biệt rạch ròi với đại từ nội tâm “mình” của Tanya theo DEC-P01-001); Golf 02 tự xưng “Tôi” / “tôi” khi hô lệnh lao vào cận chiến (p000114); người phát tín hiệu cấp cứu Mayday tự xưng đại diện đơn vị là “Chúng tôi” (p000125); bảo toàn đầy đủ các câu hỏi nội tâm và câu hỏi vô tuyến (p000106, p000110, p000113, p000118, p000120), các cấu trúc giả định nhượng bộ, so sánh trái thực tế và điều kiện (p000106, p000110, p000112, p000115), mệnh đề tự đính chính trái thực tế ở cuối p000117 (`—hay đúng hơn, lẽ ra phải là như vậy`), và bảo toàn tuyệt đối chính xác 3 vị trí nhấn mạnh Markdown `*...*` trong 3 đoạn có thẻ in nghiêng của nguyên tác là p000106 (`*Làm thế nào được chứ?*`), p000120 (`*Những thuật thức bắn tỉa đó có thể dễ dàng xuyên thủng các lớp vỏ phòng thủ kém chất lượng cơ mà. Làm sao có kẻ vẫn còn bay được sau đòn ấy chứ?*`) và p000124 (`*Việc vọt lên độ cao tám nghìn feet để trốn chạy chỉ là một mánh khóe nhằm chia cắt lực lượng của chúng ta. Lẽ thường đều cho rằng các động tác cơ động chiến đấu là bất khả thi ở độ cao tám nghìn… nhưng điều đó đã bị chứng minh là sai lầm. Chúng ta đã đâm đầu ngay vào cái bẫy này. Thuộc cấp của tôi đang bị hạ gục hết người này đến người khác, và tất cả là lỗi của tôi.*`) theo đúng DEC-P01-002 (20/23 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
