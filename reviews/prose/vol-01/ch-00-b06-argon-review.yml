locked_choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000102
  locks:
  - Giữ cụm “những quy luật phổ quát” và hai câu cảm thán lên án việc con người thời nay không còn phân biệt nổi phải trái.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000103
  locks:
  - Giữ định danh “Being X”, đại từ “ông ta” và “tôi”, cụm “những quy luật phổ quát”, cấu trúc tăng tiến phủ định “chưa từng thấy, huống hồ chưa từng đồng ý”, và cụm “năng lực thần giao cách cảm”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000104
  locks:
  - Giữ cặp đại từ “Ta - ngươi”, thuật ngữ “Mười Điều Răn” và giọng điệu khẳng định gay gắt của Being X.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000105
  locks:
  - Giữ cấu trúc mệnh lệnh cổ kính “Ngươi chớ có thần nào khác trước mặt ta.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000106
  locks:
  - Giữ cấu trúc “Ngươi chớ...” cùng cặp danh xưng “Chúa, Thượng đế của ngươi”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000107
  locks:
  - Giữ thuật ngữ “ngày Sa-bát” và cấu trúc mệnh lệnh “Hãy nhớ..., giữ ngày ấy làm ngày thánh.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000108
  locks:
  - Giữ động từ “hiếu kính” trong “Hãy hiếu kính cha mẹ ngươi.” để khớp trực tiếp với lời tự biện ở p000115.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000109
  locks:
  - Giữ câu răn ngắn gọn “Ngươi chớ giết.” không tự thu hẹp tân ngữ để khớp với mạch liên tưởng sang động vật ở p000118–p000119.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000110
  locks:
  - Giữ cấu trúc “Ngươi chớ phạm tội ngoại tình.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000111
  locks:
  - Giữ cấu trúc “Ngươi chớ trộm cắp.” để khớp với p000120.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000112
  locks:
  - Giữ cụm “làm chứng dối” và thuật ngữ “người lân cận”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000113
  locks:
  - Giữ cấu trúc “Ngươi chớ ham muốn vợ người lân cận.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000114
  locks:
  - Giữ cấu trúc “Ngươi chớ ham muốn tài sản của người lân cận.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000115
  locks:
  - Giữ đại từ “tôi”, các cụm “thần giao cách cảm”, “vùng đa thần giáo”, “khoan dung tôn giáo”, “hiếu kính cha mẹ”, “về mặt sinh học, tôi là nam giới”, ẩn dụ “lập trình” cho “bản năng tình dục” và câu giả định trái thực tế ở cuối đoạn.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000116
  locks:
  - Giữ đại từ tự xưng “Ta” của Being X và cụm “suốt đời” tạo tiền đề cho câu hỏi ở p000117.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000117
  locks:
  - Giữ danh xưng “Thượng đế”, đại từ “Tôi” / “tôi” và sắc thái tò mò “trên phương diện thuần túy học thuật”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000118
  locks:
  - Giữ đại từ “Tôi” / “tôi” / “mình”, cụm “game bắn súng góc nhìn thứ nhất”, lập luận so sánh “đâu khiến tôi khát máu hơn người bình thường”, và chi tiết ủng hộ “quyền động vật” qua việc giảm “các chương trình bắt rồi tiêu hủy động vật ở nhiều trại cứu hộ”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000119
  locks:
  - Giữ đại từ “ngươi” và câu hỏi vặn của Being X về việc “không tự tay nhúng chàm, nhưng vẫn khoái chí trước việc giết chóc”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000120
  locks:
  - Giữ đại từ “Tôi” / “tôi” / “mình”, các cụm đối chiếu với điều răn (“trộm cắp”, “làm chứng dối”, “chinh phục được trái tim một phụ nữ đã có chồng”), danh xưng “Thượng đế”, giả định quá khứ trái thực tế về việc nhận khải thị “nuôi tôm” lúc nhảy dù và sự đối lập với “các trò chơi trực tuyến”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000121
  locks:
  - Giữ cặp đại từ “ta - ngươi” và lời đe dọa giáng “hình phạt thích đáng” nếu không chịu “ăn năn”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000122
  locks:
  - Giữ đại từ “Tôi” / “tôi”, cụm “những lời buộc tội oan”, câu hỏi “Mà sao lại là tôi?” và nhận định kinh nghiệm không để mặc mọi chuyện tự diễn biến.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000123
  locks:
  - Giữ câu thoại lịch sự “Xin hãy chờ một lát.” của nhân vật chính.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000124
  locks:
  - Giữ câu quát gắt gỏng “Im đi!” của Being X.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000125
  locks:
  - Giữ cặp đại từ “tôi - ông” khi nhân vật chính hướng lời tới Being X, danh xưng “Đấng Tối Cao”, đại từ “anh ta” cho người quen làm luật sư và giọng điệu châm biếm điềm tĩnh.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000126
  locks:
  - Giữ đại từ tự xưng “Ta” của Being X và lời than quá tải vì “quản lý bảy tỷ linh hồn”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000127
  locks:
  - Giữ thuật ngữ “Kinh Thánh”, câu trích dẫn “Hãy sinh sôi nảy nở, làm cho đầy mặt đất.” khớp với từ “sinh sôi” đặt trong ngoặc kép ở câu sau, tên riêng “Malthus”, cặp đại từ “tôi - ông” và góc nhìn hành chính công sở (“công tác quản lý”, “mệnh lệnh”, “bị sa thải”, “cấp dưới”).
- segment_id: YS-LN01/Text/chapter001.xhtml/p000128
  locks:
  - Giữ đại từ “ông”, danh từ chỉ vai trò “người quản lý” và yêu cầu “chịu hoàn toàn trách nhiệm về những gì mình nói”.
