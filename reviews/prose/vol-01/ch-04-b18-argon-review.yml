  proposed_vi: Trung tá von Lergen / Trung tá / Lergen / Tướng von Rudersdorf / Rudersdorf / Cục Tác chiến / Phó cục trưởng / sĩ quan Bộ Tổng Tham mưu / mặt trận phía bắc / trình diện nhận nhiệm vụ / sự rối loạn về mặt chiến lược / dây tua tham mưu / cấp trên / cuộc động viên quy mô lớn / chiến dịch tiến công / Quân đội Đế quốc / ngoài dự tính / Đại Quân / các đạo quân / chiến trường / chiến lược nội tuyến / lãnh thổ trong nước / cải tổ nhân sự / Bộ Tổng Tham mưu / một đợt tổng tấn công lớn / cách chức hoặc giáng cấp / những nhân tài triển vọng / sĩ quan triển vọng / thị sát / sĩ quan tham mưu / hoạch định dài hạn / Đế quốc / Mặt trận phía tây / các sĩ quan tham mưu cấp cao / các sĩ quan tiền bối / bài luận / Zettour
