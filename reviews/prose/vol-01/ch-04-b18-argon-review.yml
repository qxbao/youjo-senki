  rationale: "Kế thừa đồng bộ danh xưng “Trung tá von Lergen” / “Trung tá” / “Lergen” (tiếp nối trực tiếp quân hàm trung tá vừa được thăng ở ch-04-b17 p000144–p000145; trong lời thoại tiếng Anh gọi gộp trung tá bằng từ chỉ cấp bậc đại tá, nhưng tiếng Việt giữ “Trung tá” để nhất quán với lời kể cho tới khi Lergen thăng đại tá ở các tập sau, p000147, p000151–p000153, p000155, p000162, p000170, p000172, p000173), “Tướng von Rudersdorf” / “Rudersdorf” (ch-01-b19 p000042, ch-04-b16 p000115, p000120, p000148, p000150, p000151), “Cục Tác chiến” (ch-04-b17 p000144, p000146, p000150, p000165, p000172), “Phó cục trưởng” (ch-04-b11 p000233, ch-04-b16 p000102, p000150), “sĩ quan Bộ Tổng Tham mưu” / “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms / ch-04-b16 p000112, ch-04-b17, p000150, p000161, p000162, p000165), “mặt trận phía bắc” (ch-03-b02 p000034, ch-04-b16 p000111, p000152), “trình diện nhận nhiệm vụ” (ch-04-b17 p000145, p000153), “cấp trên” (p000155, p000165, p000166), “cuộc động viên quy mô lớn” (ch-01-b19 p000043, ch-03-b03 p000045, p000156), “Quân đội Đế quốc” (b06-imperial-army, p000157), “ngoài dự tính” (ch-03-b02 p000035, p000157), “Đại Quân” (ch-01-b03 p000040, ch-03-b12 p000260, ch-03-b13, p000157), “chiến trường” (P01-norden-theater, p000158), “chiến lược nội tuyến” (vol02-ch02-b05-interior-lines / ch-03-b03 p000044, ch-03-b12 p000261, ch-03-b13 p000282, p000159), “thị sát” (ch-04-b05 p000093, p000165), “sĩ quan tham mưu” (ch-04-b16/b17, p000165), “Đế quốc” (p000166), “Mặt trận phía tây” (ch-04-b16 p000111, p000167), “các sĩ quan tham mưu cấp cao” (ch-04-b17 p000144, p000171), “bài luận” (ch-04-b04 p000060, p000062, p000175) và “Zettour” (p000175); khóa tạm “sự rối loạn về mặt chiến lược” (p000154), “dây tua tham mưu” (p000155), “các đạo quân” (p000158), “lãnh thổ trong nước” (p000159), “cải tổ nhân sự” (p000160), “một đợt tổng tấn công lớn”, “cách chức hoặc giáng cấp” và “những nhân tài triển vọng” (p000161), “hoạch định dài hạn” (p000165) cùng “các sĩ quan tiền bối” (p000172)."
