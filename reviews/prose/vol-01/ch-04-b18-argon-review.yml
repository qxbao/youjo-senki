- id: ch04-b18-lergen-pov-rudersdorf-dialogue-pronouns-conditionals-and-emphasis
  source_term: lergen_pov_rudersdorf_dialogue_pronouns_conditionals_and_emphasis_ch04_b18
  proposed_vi: 'tiếp nối trực tiếp Phân cảnh 2 của lô ch-04-b17 (chapter009b.xhtml/p000139–p000146), toàn bộ lô ch-04-b18 (chapter009b.xhtml/p000147–p000176) diễn ra tại Cục Tác chiến thuộc Bộ Tổng Tham mưu dưới điểm nhìn ngôi thứ ba của Trung tá von Lergen trong cuộc làm việc với Phó cục trưởng Cục Tác chiến là Tướng von Rudersdorf, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Trong trần thuật ngôi thứ ba (p000150, p000151, p000153, p000155, p000157–p000159, p000161, p000162, p000165, p000166, p000169–p000172), quy chiếu Trung tá von Lergen nhất quán bằng tên riêng “Lergen” và đại từ trang trọng “ông” / “Ông” kết hợp phản thân “mình” / “bản thân” (p000150, p000151, p000153, p000155, p000162, p000170, p000172 — đồng bộ ch-01-b15/b18, ch-04-b02/b04/b05 và ch-04-b17; lưu ý từ “Nó” ở câu 2 p000155 hoàn toàn chỉ quy chiếu danh từ bất động vật là “dây tua tham mưu”); quy chiếu Tướng von Rudersdorf bằng danh xưng “Tướng von Rudersdorf” / “Rudersdorf” / “vị tướng” / “vị cấp trên” và đại từ “ông” (p000150, p000151, p000153, p000155, p000169, p000170); quy chiếu hai người, phía Đế quốc / các đạo quân hoặc các sĩ quan tham mưu cấp cao bằng đại từ số nhiều “họ” (p000151, p000159, p000171). (2) Trong hội thoại giữa Tướng von Rudersdorf và Trung tá von Lergen (p000147–p000149, p000152, p000154, p000156, p000160, p000163, p000164, p000167–p000170, p000173–p000176): Tướng von Rudersdorf gọi cấp dưới mới về nhận việc là “Trung tá von Lergen” / “Trung tá” và dùng đại từ ngôi thứ hai “anh” / “Anh” (p000147, p000149, p000152, p000154, p000163, p000169, p000173 — đồng bộ ch-04-b02 p000027), tự xưng cá nhân là “tôi” (p000152), tự xưng đại diện Cục Tác chiến / ban lãnh đạo Bộ Tổng Tham mưu là “Chúng tôi” / “chúng tôi” (p000147, p000149, p000160, p000163), và dùng đại từ gộp “chúng ta” / “ta” khi nói về tình thế chung của Quân đội Đế quốc (p000156, p000163, p000167); Trung tá von Lergen đáp lễ cấp trên bằng cách tự xưng “tôi” / “Tôi”, dùng “chúng ta” khi hỏi xác nhận phương hướng chiến lược chung của Đế quốc (p000168), và thưa gửi kính trọng “ngài, Tướng von Rudersdorf” / “thưa ngài” / “ngài... ạ” (p000148, p000164, p000168, p000170, p000174, p000176). (3) Bảo toàn đầy đủ cả 3 câu hỏi xác nhận trực tiếp của Lergen (p000164, p000168, p000174), mệnh đề nhượng bộ giả định ở p000149, so sánh giả định ở p000151 và p000169, điều kiện phủ định và câu điều kiện ở p000159, suy luận giả định ở p000165, sự phân biệt mức độ chắc chắn giữa “chắc chắn” và “có lẽ” ở p000166, cùng phủ định dự tính trong quá khứ ở p000172. (4) Bảo toàn chính xác duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tại p000169 (`*Tốt lắm*`) tương ứng với thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô theo đúng DEC-P01-002 (29/30 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)'
  alternatives_vi:
  - cậu (thay cho “anh” khi Tướng von Rudersdorf gọi Trung tá von Lergen tại p000147, p000149, p000152, p000154, p000163, p000169, p000173 — ưu tiên “anh” để đồng bộ hoàn toàn với ch-04-b02 p000027 và phù hợp với vị thế một trung tá kiêm sĩ quan tham mưu cấp cao thuộc Bộ Tổng Tham mưu)
