  volume: vol-01
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md dưới điểm nhìn ngôi thứ ba của Trung tá von Lergen tại Cục Tác chiến: giữ đại từ “ông” kết hợp phản thân “mình” cho Lergen (đồng bộ ch-01-b15/b18, ch-04-b02/b04/b05 và ch-04-b17), giữ chuẩn mực xưng hô giữa Tướng von Rudersdorf và Trung tá von Lergen (“tôi / chúng tôi / chúng ta – anh” và “tôi / chúng ta – ngài / thưa ngài... ạ”), đồng thời bảo toàn chính xác cả 3 câu hỏi trực tiếp, các cấu trúc điều kiện/giả định/mức độ chắc chắn và vị trí nhấn mạnh in nghiêng duy nhất `*Tốt lắm*` tại p000169."
