locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000012
  locks:
  - Giữ hô hiệu “Goliath 07, rõ…” và các thuật ngữ pháo binh “Khẩu pháo chuẩn”, “bắn hiệu chỉnh”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000013
  locks:
  - Giữ các thuật ngữ “pháp sư không quân”, “Thiếu úy Tanya Degurechaff”, “quan sát viên pháo binh”, địa danh “vùng cực bắc Norden”, chi tiết máy vô tuyến “to gần bằng Tanya” (lặp tên Tanya, không dùng đại từ “cô”), và câu độc thoại nội tâm dùng đại từ “mình” cùng cấu trúc phủ định kép “không phải mình không tự hỏi hay nghi ngờ việc mình đang làm khi bay ra đây”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000014
  locks:
  - Giữ khẩu lệnh báo cáo “Đã xác nhận điểm rơi…”, tình thái ước lượng “Có vẻ trúng gần mục tiêu. Sai số có vẻ nằm trong giới hạn cho phép là mười mét.” và mệnh lệnh “Bắn hiệu lực.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000015
  locks:
  - Giữ hô hiệu “Goliath 07, rõ.” và khẩu lệnh “Bắt đầu nhiệm vụ bắn pháo ngay.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000016
  locks:
  - Giữ cấu trúc phủ định “không thể phủ nhận trong đó ánh lên vẻ bực bội”, đại từ nội tâm “mình”, thuật ngữ “tái sinh”, chi tiết “mang giới tính đối lập” và câu hỏi nội tâm không in nghiêng theo DEC-P01-002.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000017
  locks:
  - Giữ đại từ tự quy chiếu “mình”, quan hệ nhượng bộ–nhân quả “Ban đầu, dù con gái phát triển nhanh hơn con trai, chênh lệch kích thước quá lớn khiến mình không thể điều khiển cơ thể với khả năng giữ thăng bằng mà mình đã tin cậy suốt nhiều năm”, và nhận thức trở thành “một đứa trẻ bất lực” kể từ khi nhập ngũ.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000018
  locks:
  - Giữ đại từ “Mình / mình”, đại từ ngôi thứ ba “anh ta” cho bạn tập nam khi đấu tập, và các chi tiết khẩu súng quá to, ngắm bắn tệ hại, độ giật làm bầm tím vai cùng ánh mắt thoáng vẻ thương hại.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000019
  locks:
