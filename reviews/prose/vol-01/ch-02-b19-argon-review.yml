- id: ch02-b19-tanya-pov-return-to-test-site-pronouns-and-dialogue
  source_term: Tanya first-person interior monologue and narration pronouns from the familiar space back to the mortal realm test site in p000276–p000309, mental direct address to the supernatural beings in p000276 and to Chief Engineer von Schugel in p000283, third-person references to Schugel, Being X, the supernatural beings, and the observation team/engineers, direct dialogue pronouns between Tanya, the divine entity, Schugel, and Control, counterfactual conditionals in p000279/p000291/p000294, and absence of italicized emphasis across p000276–p000309
  proposed_vi: tiếp nối trực tiếp cuộc đối thoại của Tanya trong không gian quen thuộc từ cuối ch-02-b18 (p000276–p000278) và chuyển về bãi thử nghiệm ở cõi phàm cho đến hết Chương 2 (p000279–p000309), tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 0–2: trong các đoạn độc thoại nội tâm và lời kể ngôi thứ nhất của Tanya (p000279, p000281, p000285, p000288, p000291, p000293, p000296–p000299, p000301, p000303, p000307–p000309) cũng như câu lẩm bẩm tự hỏi bản thân tại p000302, dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “chính mình” theo đúng DEC-P01-001, dùng “chúng tôi” ở ngôi thứ nhất số nhiều cho nhóm thử nghiệm thu thập dữ liệu tại p000307 (đồng bộ ch-02-b15 p000184, p000191), và lược chủ ngữ tự nhiên ở câu kết chương p000309 (tuyệt đối không dùng đại từ “cô”; lưu ý từ “nó” / “Nó” tại p000292, p000294, p000296, p000298, p000300, p000308 hoàn toàn chỉ quy chiếu danh từ bất động vật như quả cầu Type 95, câu nói đùa ở p000294 hoặc tin báo tuyên chiến); trong lời vặn hỏi thầm hướng trực tiếp tới nhóm thực thể siêu nhiên (vừa tự xưng “bọn ta” ở p000275) tại p000276, dùng cặp đại từ “tôi – các người”; trong lời van nài/rủa thầm hướng trực tiếp tới Kỹ sư trưởng von Schugel trong tâm tưởng tại p000283, dùng cặp đại từ “Tôi / tôi – ngài” (đồng bộ ch-02-b05 p000091); quy chiếu Kỹ sư trưởng von Schugel ở ngôi thứ ba trong nội tâm của Tanya bằng “gã nhà khoa học điên” / “gã nhà khoa học điên khốn kiếp này” và đại từ “ông ta” / “Ông ta” kết hợp phản thân “mình” (p000281, p000285, p000293 — đồng bộ ch-02-b04 → ch-02-b08, ch-02-b15 → ch-02-b17); quy chiếu Tồn tại X bằng “Tồn tại X” và đại từ “hắn” (p000293 — đồng bộ ch-02-b17 p000248, p000252); quy chiếu các thực thể siêu nhiên bằng “Chúng” (p000288 — đồng bộ ch-02-b18 p000272–p000274); quy chiếu đội quan sát / các kỹ sư tại Đài kiểm soát bằng “họ” / “bọn họ” (p000288, p000291, p000301); trong lời thoại trực tiếp: thực thể thần thánh tại p000278 gọi chung những người tại hiện trường thử nghiệm (Tanya và Schugel) là “Các ngươi” ở câu 1 và gọi riêng Tanya là “ngươi” ở câu 2 (đồng bộ P05-being-x và ch-02-b17/b18); Tanya tự xưng “Tôi” / “tôi” khi hỏi thực thể siêu nhiên (p000277) cũng như khi nói với Schugel và Đài kiểm soát (p000290, p000294), dùng “chúng ta” (p000290, p000294) và gọi Schugel là “Kỹ sư trưởng” (p000282); Schugel tự xưng “tôi” (p000286, p000292, và dùng “Ta” trong câu thoại giả định xưng nhà tiên tri ở p000281), dùng “Chúng ta” (p000280, p000284, p000304), gọi Tanya là “Thiếu úy Degurechaff” / “Thiếu úy” (p000284, p000292, p000304) và quy chiếu Chúa bằng “ngài” (p000306 — đồng bộ review-God); nhân viên Đài kiểm soát tự xưng “tôi” / “Tôi” và gọi Tanya là “Thiếu úy” (p000289, p000295); toàn bộ 34 đoạn không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*` theo DEC-P01-002
  alternatives_vi:
