- id: ch03-b04-tanya-pov-shifts-hawkeye-lizard-withdrawal-radio-and-emphasis
  source_term: Tanya third-person narration/POV-dissociation pronouns in p000054/p000056/p000061/p000063, Tanya first-person interior monologue pronouns in p000059/p000061/p000064–p000066, intra-paragraph POV shift in p000061, radio withdrawal dialogue pronouns between Hawkeye 03 (Tanya) and Lizard 08 in p000052/p000055–p000058/p000060, front-line soldiers’ direct address to propaganda broadcasters/higher-ups in p000051, counterfactual/hypothetical constructions in p000050/p000051/p000063/p000065/p000066, and exact preservation of italicized emphasis in p000051
  proposed_vi: tiếp nối mạch phân tích chiến cục ngay sau ngắt cảnh (space-break1) và diễn biến rút lui trên bầu trời mặt trận Rhine từ ch-03-b03, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–3: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi Tanya tự tách góc nhìn nhắc tới danh tính bên ngoài (p000054, p000056, câu 2 p000061, p000063), dùng tên riêng “Tanya” / “Tanya Degurechaff” và đại từ trần thuật “nó” / “Nó” kết hợp phản thân “mình” theo đúng DEC-P01-001 (tuyệt đối tránh dùng đại từ “cô”); trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000059, câu 1 p000061, p000064–p000066), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “bản thân” (lưu ý từ “nó” ở câu 4 p000065 và câu 3 p000066 hoàn toàn chỉ quy chiếu danh từ bất động vật là quả cầu tính toán Type 95); đặc biệt bảo toàn chính xác sự chuyển đổi điểm nhìn nội đoạn tại p000061 (câu 1 là độc thoại nội tâm ngôi thứ nhất dùng “mình” / “bản thân”, sang câu 2 chuyển sang góc nhìn trần thuật bên ngoài mô tả đôi mắt xanh và chất giọng non nớt bằng tên riêng “Tanya” và đại từ “nó”); trong liên lạc vô tuyến công vụ giữa Hawkeye 03 (Tanya) và Lizard 08 (p000052, p000055–p000058, p000060), Tanya tự xưng “tôi” / “Tôi” đồng bộ với ch-03-b01 (p000019, p000022) và ch-03-b03 (p000041), còn phía Lizard 08 tự xưng “Bọn tôi” đồng bộ với ch-03-b01 (p000020); trong câu tiếng lòng của những người lính ngoài tiền tuyến tại câu 4 p000051, dùng đại từ ngôi thứ hai số nhiều “các người” hướng về phía bộ máy tuyên truyền/cấp trên (đồng bộ ch-01-b04 p000049 và ch-01-b11 p000189); bảo toàn chính xác cấu trúc lựa chọn loại trừ trong suy đoán về quá khứ ở câu 3 p000050, các cấu trúc điều kiện/giả định tại p000051, p000063, giả định tiếc nuối về quá khứ tại câu 4 p000065, câu hỏi giả định nội tâm tại câu 3 p000066, và bảo toàn tuyệt đối duy nhất câu nhấn mạnh Markdown `*Nếu các người còn dư dả nguồn lực để phát sóng tuyên truyền ra tận ngoài tiền tuyến, thì hãy điều thêm quân và vật tư tiếp tế tới đây đi.*` tại câu 4 p000051 theo đúng DEC-P01-002 (16/17 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
