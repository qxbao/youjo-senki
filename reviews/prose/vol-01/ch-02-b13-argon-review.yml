- id: ch02-b13-godly-realm-pronouns-counterfactuals-and-emphasis
  source_term: godly realm third-person narration pronouns for the gods and mankind, divine assembly dialogue pronouns (first-person singular/plural, second-person singular/plural address, and third-person references to humans), past counterfactual and subject-shift progression in p000136, generic reflexive pronoun in p000137, and italicized emphasis in p000132
  proposed_vi: toàn bộ lô diễn ra tại thần giới (“NƠI VƯỢT NGOÀI CÕI NHẬN THỨC”) và không có sự xuất hiện của Tanya; tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn hoặc chủ thể khác), trong lời kể ngôi thứ ba khách quan tại thần giới, quy chiếu các vị thần bằng “các vị thần”, “những vị” và đại từ “họ” (p000124, p000127, p000131, p000137, p000143; riêng tại câu 1–2 của p000136, dịch rõ chủ ngữ là “các vị thần” / “các ngài” để phân biệt rạch ròi với đại từ “họ” quy chiếu con người trong cùng câu), đồng thời quy chiếu con người / nhân loại bằng “con người”, “người đời”, “nhân loại” và đại từ “họ” (p000128, p000136, p000144, p000145; lưu ý từ “Nó” tại câu 2 p000132 quy chiếu hiện tượng siêu nhiên và từ “chúng” tại câu 2 p000142 quy chiếu các quốc gia phát triển, tuyệt đối không quy chiếu nhân vật); tại câu nhận định khái quát ở câu 2 p000137, dùng cấu trúc phản thân khái quát “của mình”; trong lời thoại trao đổi giữa các vị thần (p000123, p000125, p000126, p000129, p000130, p000133–p000135, p000138, p000140, p000141, p000146), người nói tự xưng “ta” / “Ta” ở ngôi thứ nhất số ít (p000123, p000133 — đồng bộ giọng thần linh ở Chương 0 P05-being-x) và dùng “chúng ta” ở ngôi thứ nhất số nhiều cho tập thể các vị thần (p000134, p000135, p000141, p000146), gọi các vị thần khác trong cuộc họp bằng đại từ ngôi thứ hai số nhiều trang trọng “Các vị” / “các vị” (p000123, p000125 — đồng bộ plural-address-p000076, ch-01-b20 và ch-02-b10 → b12), gọi một vị thần vừa phát biểu bằng đại từ ngôi thứ hai số ít trang trọng “ngài” (p000140 — đồng bộ review-God), và quy chiếu con người ở cõi phàm bằng “Họ” / “họ” (p000130, p000134, p000135, p000141, p000146); bảo toàn chính xác nhấn mạnh `*tại thời điểm đó*` tại p000132 theo DEC-P01-002, chuỗi giả định trái thực tế trong quá khứ cùng cấu trúc tăng tiến đổi chủ thể “Không chỉ vậy, một số người hẳn cũng đã...” tại p000136, và cấu trúc phủ định tăng tiến “Ngay cả... cũng chẳng thể..., huống chi là...” tại p000142
  alternatives_vi:
  - các ngài (thay cho “Các vị” / “các vị” trong lời thoại tại p000123, p000125 — ưu tiên “Các vị” / “các vị” để đồng bộ với plural-address-p000076 và giữ sắc thái trang trọng ngang hàng giữa các vị thần trong cuộc họp)
