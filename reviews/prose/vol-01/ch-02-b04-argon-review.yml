- id: ch02-b04-tanya-pronouns-pov-dissociation-and-schugel-radio-dialogue
  source_term: Tanya first-person interior monologue and third-person narration pronouns, intra-paragraph POV/pronoun shift between first-person narrator and third-person Tanya in p000069/p000070/p000072, italicized inner curse in p000069, and radio dialogue pronouns between Dr. von Schugel and Tanya
  proposed_vi: trong các đoạn/mệnh đề độc thoại nội tâm ngôi thứ nhất của Tanya (p000067, p000069, p000070, p000072, p000080–p000082), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “bản thân” theo đúng DEC-P01-001, và dùng “chúng ta” cho tính từ sở hữu ngôi thứ nhất số nhiều chỉ lãnh thổ phe mình tại p000074; trong các đoạn/mệnh đề trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể nội tâm tự tách góc nhìn đối với danh tính bên ngoài (p000068–p000070, p000072, p000075, p000079), dùng tên riêng “Tanya” và đại từ trần thuật “nó” theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01/b02/b03 (tuyệt đối tránh dùng “cô” trong lời kể hay nội tâm về Tanya; lưu ý từ “nó” tại p000067 quy chiếu mẫu mới, tại p000073 quy chiếu việc đầu ra tạo không khí phụ thuộc vào quả cầu tính toán, và tại p000082 quy chiếu cuộc khủng hoảng ở câu 1 cùng quả cầu nguyên mẫu ở câu 3); bảo toàn chính xác sự chuyển đổi giữa ngôi thứ nhất (“Mình” / “mình”) và ngôi thứ ba (“Tanya” / “nó”) ngay trong cùng một đoạn của văn bản nguồn tại p000069, p000070 và p000072; tại p000069, bảo toàn chính xác nhấn mạnh `*...*` theo DEC-P01-002 cho cụm từ rủa thầm in nghiêng; trong lời kể/nội tâm (p000070, p000077), quy chiếu Adelheid von Schugel bằng đại từ ngôi thứ ba “Ông ta” / “ông ta” (đồng bộ chapter7_b09_argon_decisions) và “tay kỹ sư này”; trong đối thoại qua vô tuyến (p000068, p000071, p000076, p000078), Schugel gọi Tanya bằng cấp bậc “Thiếu úy” và đại từ ngôi thứ hai công vụ “cô”, còn Tanya gọi Schugel là “Tiến sĩ von Schugel” / “Thưa Tiến sĩ” và dùng đại từ ngôi thứ hai lịch sự “ngài”; tại câu hỏi tu từ nội tâm cuối p000080, dùng “Các người” hướng về phía nhóm kỹ sư nghiên cứu
  alternatives_vi:
  - ông (thay cho “ngài” khi Tanya gọi Tiến sĩ von Schugel trong lời thoại tại p000071 — ưu tiên “ngài” để giữ đúng sắc thái lịch sự theo nghi thức công vụ khi Tanya cố kiềm chế cơn giận trước kỹ sư trưởng phụ trách dự án)
