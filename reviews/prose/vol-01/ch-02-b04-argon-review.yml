  rationale: "Kế thừa đồng bộ “mana”, “mẫu mới”, “cơ động không chiến”, “Thiếu úy”, “nguyên mẫu”, “quả cầu tính toán” / “quả cầu”, “bình oxy”, “pháp sư”, “thuật thức”, “nồng độ oxy thấp”, “người vận hành” từ ch-02-b01/b03, tên nhân vật “Adelheid von Schugel”, chức danh “kỹ sư trưởng” từ sổ pending (chapter7_b09_argon_decisions) và cụm “những trận không chiến quần vòng” (b13-economics-and-air-combat-maneuver-terms); khóa tạm danh xưng học hàm “Tiến sĩ von Schugel” / “Tiến sĩ”, các thuật ngữ thử nghiệm độ cao “lượng mana rò rỉ”, “bài thử nghiệm độ cao”, “nhà khoa học điên”, “máy bay chỉ huy”, “trang phục có sưởi ấm chứ không chỉ cách nhiệt”, “nguồn cấp khí”, “hoạt động tác chiến liên tục”, “dù nhảy” / “chiếc dù”, “bay thử nghiệm”, và giữ nguyên con số độ cao “mười tám nghìn” không tự thêm đơn vị đo tại p000068 đúng như văn bản nguồn."
  uncertainty: low
