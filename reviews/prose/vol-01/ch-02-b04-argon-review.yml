  volume: vol-01
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“mình”), trần thuật ngôi thứ ba (“Tanya” / “nó”), thủ pháp tự tách góc nhìn trong cùng đoạn tại p000069/p000070/p000072, cụm rủa thầm in nghiêng tại p000069, và xưng hô qua vô tuyến giữa Kỹ sư trưởng von Schugel với Tanya (“Thiếu úy / cô – Tiến sĩ von Schugel / ngài”)."
