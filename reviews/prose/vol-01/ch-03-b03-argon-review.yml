- id: ch03-b03-tanya-pov-pronouns-generic-omission-and-emphasis
  source_term: Tanya third-person narration pronoun in p000042, Tanya first-person interior monologue pronoun after space-break1 in p000047, Hawkeye 03 and Lizard 08 radio dialogue in p000041/p000043, generic second-person omission in p000048, metaphorical hypothetical question and strategic conditionals in p000039/p000045/p000046/p000048/p000049, and exact preservation of italicized emphasis in p000048
  proposed_vi: tiếp nối mạch phân tích chiến lược đan xen với cảnh bay trinh sát trên bầu trời mặt trận Rhine từ ch-03-b02, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–3: trong câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya tại p000042, dùng tên riêng “Tanya” và đại từ trần thuật “nó” theo đúng DEC-P01-001 (tuyệt đối tránh dùng đại từ “cô”); trong câu độc thoại nội tâm ngôi thứ nhất của Tanya ngay sau ngắt cảnh (space-break1) tại p000047, dùng đại từ tự quy chiếu “mình” theo DEC-P01-001; trong liên lạc vô tuyến công vụ giữa Hawkeye 03 (Tanya) và Lizard 08, Tanya tự xưng “Tôi” khi tiếp tục báo cáo tại p000041 (tiếp nối ch-03-b02 p000030 và đồng bộ ch-03-b01 p000019, p000022), còn Lizard 08 phát mệnh lệnh tác chiến trực tiếp tại p000043; ở câu 2–3 p000048, dùng cấu trúc khái quát lược đại từ ngôi thứ hai phiếm chỉ (“một chuyên gia hẳn sẽ bảo rằng nhận định ấy chưa hoàn toàn chuẩn xác”, “để lực lượng chủ lực bị cầm chân”) theo đúng quy ước direct-address choice, tránh tạo cảm giác đang đối thoại với một người nghe cụ thể; quy chiếu các chủ thể quốc gia và tập thể (Đế quốc, Cộng hòa François / giới lãnh đạo Cộng hòa, Liên minh Entente) bằng đại từ số nhiều “họ” kết hợp phản thân “mình” / “chính mình” (p000038–p000040, p000044–p000046, p000048–p000049); bảo toàn chính xác câu hỏi giả định ẩn dụ tại p000039, các cấu trúc điều kiện và giả định chiến lược tại p000045–p000046, p000048–p000049, đồng thời bảo toàn tuyệt đối duy nhất cụm nhấn mạnh Markdown `*quả thực*` tại câu 3 p000048 theo đúng DEC-P01-002 (11/12 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
