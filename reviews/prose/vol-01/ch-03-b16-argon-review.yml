- id: ch03-b16-tanya-to-visha-pov-shift-pronouns-conditionals-and-zero-emphasis
  source_term: tanya_to_visha_pov_shift_pronouns_conditionals_and_zero_emphasis_ch03_b16
  proposed_vi: 'tiếp nối trực tiếp câu hỏi đính chính của Tanya ở cuối lô ch-03-b15 (p000323), lô ch-03-b16 (chapter007.xhtml/p000324–p000348) gồm hai phân cảnh nối nhau qua đoạn trần thuật chuyển cảnh p000346 (class="space-break1"): Phân cảnh 1 (p000324–p000345) dưới điểm nhìn của Thiếu úy Tanya Degurechaff trong cuộc trao đổi nhận nhiệm vụ với Trung úy Ihlen Schwarkopf, và Phân cảnh 2 (p000347–p000348, mở đầu bằng class="space-break1a") chuyển sang điểm nhìn tự sự ngôi thứ nhất của Viktoriya Ivanovna Serebryakov (Visha), tuân thủ nghiêm ngặt DEC-P01-001 (dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu của Tanya, đồng thời không tự mở rộng quy ước này sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Ở Phân cảnh 1 (p000324–p000345), trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000325, p000326, câu 1–3 p000330, p000331, p000339–p000342, p000345), quy chiếu cái tôi nội tâm ở ngôi thứ nhất số ít nhất quán bằng đại từ tự quy chiếu “Mình” / “mình” kết hợp phản thân “bản thân” (p000326, câu 1–3 p000330, p000331, p000340–p000342, p000345); dùng “chúng tôi” khi Tanya tự gộp mình với trung đội hoặc những người lính ngoài chiến tuyến (p000326, p000339 — đồng bộ ch-03-b15 p000310), và dùng “chúng ta” / “Chúng ta” khi nói về phía quân đội Đế quốc nói chung ở câu 1 p000325 hoặc chủ thể quốc gia/xã hội khái quát ở câu 2 p000341; quy chiếu Trung úy Schwarkopf bằng “anh ấy” trong nhận định nội tâm ở p000326 (đồng bộ ch-03-b11 p000237, p000238, ch-03-b14 p000290) và gọi đối đáp ngầm trong đầu hướng tới Schwarkopf ở câu 1–2 p000330 bằng “anh”; quy chiếu các pháp sư tân binh trong trung đội bằng “họ” / “Họ” (p000325, p000326, p000330, p000331, p000345). (2) Trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya ở Phân cảnh 1 (câu 4–5 p000330, p000334), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại từ “nó” (tuyệt đối không dùng “cô”; lưu ý từ “nó” ở câu 1 p000330 chỉ quy chiếu danh từ bất động vật là “trung đội này”), bảo toàn nguyên vẹn sự chuyển dịch ngôi tự sự ngay trong cùng đoạn văn tại p000330, và quy chiếu Trung úy Schwarkopf ở p000334 bằng “anh ấy”. (3) Trong lời thoại quân ngũ giữa Trung úy Ihlen Schwarkopf và Thiếu úy Tanya Degurechaff (p000324, p000327–p000329, p000332, p000333, p000335–p000338, p000343, p000344): Schwarkopf tự xưng “Tôi” / “tôi” (p000324, p000328, p000344), dùng “chúng tôi” đại diện cho ban chỉ huy đại đội khi điều động Tanya (p000333) hoặc “chúng ta” khi nói gộp cả đại đội/mặt trận (p000336, p000338), và gọi Tanya là “Thiếu úy Degurechaff” / “cô” kết hợp phản thân “mình” (p000324, p000328, p000333, p000344 — đồng bộ ch-03-b11–b15); Tanya tự xưng “tôi” kết hợp phản thân “mình” (p000327, p000329, p000332), dùng “chúng ta” cho lực lượng chung của đơn vị (p000332) và “Chúng tôi” / “chúng tôi” kết hợp phản thân “mình” cho trung đội của mình (p000335, p000337), đồng thời gọi cấp trên trực tiếp là “Thưa Chỉ huy” (p000327 — đồng bộ ch-03-b11 p000235) và “ngài” kèm động từ kính ngữ “thưa” và tiểu từ “ạ” (p000329, p000332, p000335, p000337, p000343). (4) Ở đoạn chuyển cảnh p000346, trần thuật ngôi thứ ba khách quan đặt song song “thiếu nữ trẻ” (Visha) và “cô bé nhỏ tuổi” (Tanya; đồng bộ ch-03-b12 p000240) bằng cụm “hai người”. (5) Ở Phân cảnh 2 (p000347–p000348), tiếp nối trực tiếp mạch tự sự ngôi thứ nhất của Visha ở ch-03-b09 (p000177–p000182) và ch-03-b10 (p000183–p000220), Visha tự xưng “tôi” kết hợp phản thân “mình” (p000347, p000348), dùng “chúng tôi” cho tập thể tân binh được gọi tập hợp (p000348), và dưới góc nhìn quan sát từ bên ngoài của người lính cấp dưới đối với vị sĩ quan cấp trên trực tiếp trong lần đầu giáp mặt, quy chiếu Thiếu úy Degurechaff bằng danh ngữ “một đứa trẻ” và đại từ ngôi thứ ba “cô ấy” / “Cô ấy” kết hợp phản thân “mình” (p000347, p000348). (6) Bảo toàn nguyên vẹn đối tượng và sắc thái của hai câu hỏi trực tiếp trong thoại (p000335, p000337) cùng toàn bộ các câu hỏi nội tâm / câu hỏi tu từ (p000325, câu 1–3 p000330, câu 1–2 p000339, câu 1 p000340), thời gian và mức độ chắc chắn của các mệnh đề giả định, điều kiện và phủ định (p000324–p000326, p000329–p000336, p000339, p000340, p000345, p000346, p000348), chỉ số chú thích trên cao `¹⁴` ở cuối p000338 tương ứng với `<html:sup>14</html:sup>`, và không sử dụng bất kỳ dấu nhấn mạnh Markdown `*...*` nào trong toàn bộ 25/25 đoạn do `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` theo đúng DEC-P01-002'
  alternatives_vi:
  - chúng mình (thay cho “chúng tôi” trong độc thoại nội tâm của Tanya tại p000326 và p000339 — ưu tiên “chúng tôi” để đồng bộ với ch-03-b15 p000310) / cô hoặc con bé (thay cho “cô ấy” khi Visha quy chiếu cấp trên trực tiếp Thiếu úy Degurechaff trong mạch tự sự ngôi thứ nhất tại p000347–p000348 — ưu tiên “cô ấy” để giữ đúng giọng hồi thuật ngôi thứ nhất của người lính cấp dưới mới gặp sĩ quan chỉ huy trực tiếp lần đầu)
