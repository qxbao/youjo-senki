  rationale: "Kế thừa đồng bộ “trung đội” (ch-03-b11–b15), “pháp sư”, “Trường Thiếu sinh quân” (ch-03-b09 p000182, ch-03-b10 p000185, ch-03-b12 p000246), “đơn vị chiến đấu” (ch-03-b10 p000186), “đại đội”, “tiềm năng ma pháp” (ch-03-b10 p000187; mở rộng thành “tiềm năng ma pháp bẩm sinh”), “lính mới” (ch-03-b10 p000188, ch-03-b12 p000247), “điều lệnh quân đội” (ch-03-b11 p000234), “cuộc bắn gà tây” (vol02-ch01-b04-turkey-shoot), “bất hợp lý” (P03-rationality, ch-03-b05 p000083), “Chỉ huy” (ch-03-b11 p000235), “trung đội trưởng” (ch-03-b11 p000224, p000233, ch-03-b12 p000245), “Thiếu úy Degurechaff”, “trông trẻ” (ch-03-b12 p000247), “các trận đánh cơ động” (vol-04-ch-04-b02 p000047), “lũ bất tài” (ch-03-b11 p000226), “Tanya”, “học viện” (ch-03-b11 p000225), “vùng đất giữa hai chiến tuyến” (pending-terms.yml dòng 9443, 9679), “các nhiệm vụ du kích” (vol-04-ch-01-b19 p000230), “phòng tuyến” (ch-03-b13–b15), “Bộ chỉ huy” (ch-03-b13 p000276), “ý chí tự do” (ch-01-b13 p000222, ch-02-b13 p000143), “chủ nghĩa dân tộc” (ch-01-b13 p000237, ch-01-b15 p000279), “Đế quốc”, “đồng minh” (ch-03-b11 p000234), “lá chắn sống” (ch-03-b11 p000226), “cô bé nhỏ tuổi” (ch-03-b12 p000240), “lưỡi lê” (ch-01-b08 p000131, ch-02-b01 p000005), “mặt trận phía tây” (ch-03-b12 p000243, ch-03-b13 p000262), “Quân đội Đế quốc” (ch-03-b10 p000188), “Đại đội Pháp sư Xung kích số 205” (ch-03-b11 p000224, p000233, ch-03-b12 p000244, ch-03-b14 p000292), “Trung úy Schwarkopf” (ch-04-b07 p000145) và “thiếu úy” (b02-second-lieutenant); khóa tạm “non nớt và thiếu rèn giũa” (p000324), “khóa huấn luyện cơ bản”, “trò đùa Cá tháng Tư” và “các đội pháp sư” (p000325), “đủ khả năng chiến đấu” (p000326), “tác chiến độc lập” (p000329), “lực lượng đóng chốt cố định”, “tái đào tạo” và “bản mô tả công việc” (p000330), “đám lính non choẹt” (p000331), “lực lượng dự phòng” (p000333), “chiến thắng hoặc Valhalla” kèm chỉ số chú thích ¹⁴ (p000338), “thứ rác rưởi tự luyến nhảm nhí” (p000339), “chủ nghĩa dân chủ”, “chủ nghĩa đế quốc”, “trái phiếu chiến tranh” / “trái phiếu” và “siêu lạm phát” (p000341), “thiếu nữ trẻ”, “thứ cháo sệt như bùn” và “bánh quy” (p000346), “cấp trên trực tiếp”, “Cụm Xung kích số 7”, “đạo quân xung kích cơ động mặt trận phía tây” và ““ma cà rồng”” (p000347), cùng “mũ kê-pi” (p000348)."
