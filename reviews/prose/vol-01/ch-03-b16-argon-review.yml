ốc”, “trái phiếu chiến tranh” / “trái phiếu” và “siêu lạm phát” (p000341), “thiếu nữ trẻ”, “thứ cháo sệt như bùn” và “bánh quy” (p000346), “cấp trên trực tiếp”, “Cụm Xung kích số 7”, “đạo quân xung kích cơ động mặt trận phía tây” và ““ma cà rồng”” (p000347), cùng “mũ kê-pi” (p000348)."
