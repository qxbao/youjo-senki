  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md qua cả hai phân cảnh và bước chuyển điểm nhìn tại p000346–p000347: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“Mình” / “mình” / “chúng tôi” / “chúng ta”) và trần thuật ngôi thứ ba (“Tanya” / “nó”) dưới điểm nhìn của Tanya ở p000324–p000345, chuyển sang điểm nhìn tự sự ngôi thứ nhất của Visha (“tôi” / “chúng tôi” và quy chiếu cấp trên trực tiếp Thiếu úy Degurechaff bằng “cô ấy”) ở p000347–p000348 theo đúng giới hạn chủ thể của DEC-P01-001, bảo toàn chính xác các câu hỏi trực tiếp/nội tâm, cấu trúc điều kiện/phủ định/giả định, chỉ số chú thích `¹⁴` tại p000338 và việc không dùng `*...*` ở cả 25/25 đoạn."
