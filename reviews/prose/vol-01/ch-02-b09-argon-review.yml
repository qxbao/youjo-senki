  proposed_vi: tiếp nối cảnh họp của Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần từ ch-02-b08 (p000035–p000041) và tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của chủ thể khác), trong lời kể ngôi thứ ba khách quan từ góc nhìn của bộ máy quản lý Ban Công nghệ, quy chiếu Thiếu úy Tanya Degurechaff bằng tên riêng “Degurechaff” và đại từ “cô” (p000054–p000056 — đồng bộ ch-02-b08 p000037–p000041 và ch-01-b15 → b18), quy chiếu Kỹ sư trưởng von Schugel bằng chức danh/tên riêng “Kỹ sư trưởng von Schugel” / “Schugel” và đại từ trang trọng trung tính “Ông” / “ông” kết hợp đại từ phản thân “mình” (p000043, p000045, p000046 — phân biệt rõ với đại từ “ông ta” mang sắc thái bực bội trong nội tâm của Tanya ở ch-02-b04 → b08; lưu ý từ “nó” ở cuối p000045 quy chiếu danh từ bất động vật là lĩnh vực kỹ thuật ma pháp), và quy chiếu tập thể Ban Công nghệ / Bộ Chỉ huy Tiếp vận và Hậu cần / Đế quốc bằng “họ” / “Họ” (p000046, p000053–p000056, p000059); trong lời thoại trực tiếp giữa các trưởng bộ phận tại cuộc họp (p000042, p000044, p000047, p000048, p000051, p000052, p000057, p000058), người nói tự xưng “tôi” / “Tôi” khi nêu ý kiến cá nhân (p000052), dùng “chúng ta” / “Chúng ta” cho tập thể cuộc họp và Đế quốc (p000044, p000048, p000051, p000057), quy chiếu Degurechaff bằng “Cô ấy” / “cô ấy” (p000042, p000047, p000052 — đồng bộ ch-02-b08 p000039), và quy chiếu Schugel bằng “ông ấy” / “Tiến sĩ von Schugel” (p000044, p000052); tại p000056, bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo DEC-P01-002 cho câu thông điệp ngầm in nghiêng của cấp trên gửi tới Ban Công nghệ và nhóm thử nghiệm, dùng chủ ngữ ngôi thứ hai số nhiều “Các người” và tân ngữ ngôi thứ ba “cô ấy”
  alternatives_vi:
  - ông ta (thay cho “Ông” / “ông” trong lời kể ngôi thứ ba về Kỹ sư trưởng von Schugel tại p000043, p000045, p000046 — ưu tiên “Ông” / “ông” vì đoạn này phản ánh đánh giá chuyên môn khách quan, tôn trọng của Ban Công nghệ đối với cống hiến khoa học của vị kỹ sư trưởng, khác với điểm nhìn chủ quan bất mãn của Tanya ở các lô trước)
