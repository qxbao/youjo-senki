  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự nhất quán của điểm nhìn Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần nối tiếp ch-02-b08 (trần thuật gọi Degurechaff là “cô”, gọi Kỹ sư trưởng von Schugel là “Ông” / “ông”, gọi tập thể quản lý/Đế quốc là “họ”; lời thoại cuộc họp dùng “tôi / chúng ta – cô ấy / ông ấy”; câu thông điệp ngầm in nghiêng tại p000056 bảo toàn `*...*` và dùng “Các người – cô ấy”)."
