    terms_and_ranks: "Bộ Tổng Tham mưu; tập hợp đơn vị; triển khai; căn cứ ở phía đông nam; Ưu tiên cao nhất."
    modality_and_negation: "Giữ mệnh lệnh bắt buộc 'nhận lệnh phải hoàn tất... và lập tức triển khai...' cùng câu rút gọn cuối đoạn 'Ưu tiên cao nhất.'."
    emphasis: "Không dùng dấu *...*."
