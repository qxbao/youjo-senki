locked_choices:
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000021
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: tự quy chiếu bằng 'mình' / 'bản thân' theo DEC-P01-001; hô ngữ trực tiếp ở câu 3–4 gọi các thế lực siêu nhiên bằng 'Lũ ác quỷ kia!' và đại từ ngôi thứ hai số nhiều 'Các người—tất cả các người'."
    terms_and_ranks: "ghi chép; sự thao túng; tư duy; bản ngã; cá nhân yêu tự do."
    modality_and_negation: "Giữ phủ định khả năng 'không thể xác nhận bất kỳ sự thao túng nào đang diễn ra...' ở câu 1, khẳng định nhấn mạnh 'Nhưng mình thực sự có cảm giác...' ở câu 2 và câu hỏi chất vấn kèm cặp gạch ngang dài ở câu 4."
    emphasis: "Khóa chính xác hai câu cuối trong dấu nhấn mạnh Markdown '*Lũ ác quỷ kia! Các người—tất cả các người—định đùa bỡn với bản ngã của một cá nhân yêu tự do như mình sao?*' khớp 1:1 với thẻ <html:em> trong nguồn theo DEC-P01-002."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000022
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: tự quy chiếu 'mình'; đại từ 'nó' ở cuối câu chỉ quy chiếu 'cỗ tràng hạt'."
    terms_and_ranks: "cỗ tràng hạt; ký ức."
    modality_and_negation: "Giữ dấu chấm lửng mở đầu và mệnh đề quan hệ phủ định 'mà mình chẳng hề có ký ức gì về nó'."
    emphasis: "Không dùng dấu *...* (nguồn không nhấn mạnh)."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000023
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: tự quy chiếu 'Mình' / 'mình'; đại từ ngôi thứ hai phiếm chỉ được dịch tự nhiên thành 'người ta'; quy chiếu các nữ tu và những cỗ tràng hạt bằng 'chúng'."
    terms_and_ranks: "Đức Mẹ; nhà thờ; các nữ tu."
    modality_and_negation: "Giữ nhịp tự hỏi – tự đáp ngắn gọn ở câu 1–3, tần suất quá khứ 'từng nhiều lần thấy' ở câu 4 và giới hạn đối lập 'Nhưng mình mới chỉ đứng nhìn mà thôi' ở câu 5."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000024
    pov_and_pronouns: "Câu mệnh lệnh tự nhắc nhở bản thân trong độc thoại nội tâm của Tanya (lược chủ ngữ)."
    terms_and_ranks: "thực tại."
    modality_and_negation: "Giữ dấu chấm lửng mở đầu và thức mệnh lệnh tự cảnh tỉnh."
    emphasis: "Khóa toàn bộ câu trong dấu nhấn mạnh Markdown '*…Ngừng trốn chạy và đối mặt với thực tại đi.*' khớp 1:1 với thẻ <html:em> trong nguồn theo DEC-P01-002."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000025
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'mình'."
    terms_and_ranks: "cỗ tràng hạt; mất trí nhớ."
    modality_and_negation: "Giữ nguyên hai câu hỏi tự vấn liên tiếp về sự xuất hiện của cỗ tràng hạt và thời điểm bắt đầu mất trí nhớ."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000026
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'Mình' / 'bản thân'; quy chiếu cỗ tràng hạt bằng 'thứ này' / 'nó' (lưu ý tránh nhập nhằng đại từ phản thân ở cuối câu 4 như đã nêu tại findings)."
    terms_and_ranks: "ký ức; nhà thờ; lịch sử."
    modality_and_negation: "Giữ phủ định 'thực sự không thể tin tưởng vào ký ức của bản thân nữa rồi' ở câu 2, tương phản mức độ ở câu 3 và cách diễn đạt nhận định 'Có thể nói là...' ở câu 4."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000027
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'mình'; đại từ 'nó' chỉ quy chiếu cỗ tràng hạt."
    terms_and_ranks: "thế giới của mình; nhà thờ; thánh vật; quyên tặng."
    modality_and_negation: "Giữ thành ngữ rào đón mở đầu, cụm chêm giữa hai dấu gạch ngang dài '—ở thế giới của mình—', mức độ cực hạn 'Đến mức mình chỉ muốn...' và câu điều kiện giả định 'Nếu được như ý muốn, mình sẽ quyên tặng nó...'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000028
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: lược đại từ ngôi thứ hai phiếm chỉ ('khi đeo trên cổ') để tạo câu cảm nhận khái quát tự nhiên."
    terms_and_ranks: "Không có thuật ngữ mới."
    modality_and_negation: "Giữ dấu chấm lửng mở đầu và sắc thái cảm nhận sức nặng tâm lý tăng dần 'bắt đầu trở nên nặng trĩu đến kinh khủng'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000029
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'Mình' / 'mình'."
    terms_and_ranks: "đám ứng viên; quy trình tuyển chọn."
    modality_and_negation: "Giữ sự đối lập giữa ba câu khẳng định chắc chắn về ký ức có thật ('Mình biết...', 'Cũng đúng là mình từng định không cho bất kỳ ai vượt qua cả...', 'Ký ức của mình về tháng đó rất rõ ràng') với câu chuyển折 ngập ngừng có dấu gạch ngang dài 'Nhưng có gì đó—có gì đó không ổn.'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000030
    pov_and_pronouns: "Thoại độc thoại lẩm bẩm một mình của Tanya: tự quy chiếu 'mình'; đại từ 'nó' quy chiếu quả cầu Elinium Type 95."
    terms_and_ranks: "tám nghìn feet."
    modality_and_negation: "Giữ dấu ngoặc kép của câu nói thành tiếng và mức độ phỏng đoán 'Có lẽ sai lầm của mình là đã vô thức kích hoạt nó...'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000031
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'mình'; đại từ 'nó' ở câu 3 quy chiếu 'sự tha hóa tinh thần'."
    terms_and_ranks: "sai lầm chí mạng; Elinium Type 95; sự tha hóa tinh thần; chì."
    modality_and_negation: "Giữ khẳng định ở câu 1 và hai câu phỏng đoán giả thuyết liên tiếp ('Có lẽ mình nên cân nhắc khả năng...', 'Thay vì chỉ..., biết đâu nó lại tích tụ trong cơ thể giống như chì vậy')."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000032
    pov_and_pronouns: "Thoại tự vấn thành tiếng của Tanya (lược chủ ngữ)."
    terms_and_ranks: "sự tha hóa tinh thần."
    modality_and_negation: "Giữ nguyên cặp câu hỏi tự vấn trong ngoặc kép về việc đi kiểm tra và cơ sở hợp thức hóa."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000033
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: dùng 'chúng ta' cho tập thể quân nhân đi khám định kỳ, 'mình' / 'bản thân' để tự quy chiếu, và 'họ' cho cơ sở quân y."
    terms_and_ranks: "Cơ sở quân y; khám sức khỏe định kỳ; công nghệ ma pháp; tư duy; Hiệp hội Công nghệ RTI; phán đoán tỉnh táo."
    modality_and_negation: "Giữ câu điều kiện rào đón 'Nếu mình có thể tin tưởng họ, thì...' ở câu 2 và mức độ cân nhắc 'Có lẽ mình nên đi kiểm tra ngay bây giờ, khi bản thân vẫn còn có thể...' ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000034
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'mình'; quy chiếu những phụ nữ làm quản lý hành chính bằng 'họ'."
    terms_and_ranks: "người chỉ huy; vấn đề về tâm thần; quản lý hành chính; Đế quốc; bình đẳng giới; công việc cổ cồn trắng."
    modality_and_negation: "Giữ cấu trúc tăng tiến cùng chủ ngữ 'đe dọa không chỉ sự nghiệp tương lai mà còn cả cuộc đời của mình' ở câu 2, phủ định kép 'không phải là hiếm' kết hợp mệnh đề đối lập ở câu 3, và phủ định giả định 'sẽ chẳng tốt đẹp gì...' ở câu 4."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000035
    pov_and_pronouns: "Trần thuật ngôi thứ nhất của Tanya: tự quy chiếu 'mình' / 'Mình'; quy chiếu 'Visha' bằng 'cô ấy'."
    terms_and_ranks: "Visha; sĩ quan phụ tá."
    modality_and_negation: "Giữ nhịp chuyển cảnh từ trạng thái dằn vặt nội tâm sang tác phong làm việc quyết đoán khi Visha gõ cửa."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000036
    pov_and_pronouns: "Thoại báo cáo của Visha với Tanya: hô ngữ kính trọng 'Thưa Đại úy ... ạ'."
    terms_and_ranks: "Đại úy; công điện; Văn phòng Bộ Tổng Tham mưu."
    modality_and_negation: "Giữ câu thông báo ngắn gọn, đúng điều lệnh."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000037
    pov_and_pronouns: "Thoại của Tanya với Visha: quy chiếu Văn phòng Bộ Tổng Tham mưu bằng 'Họ'."
    terms_and_ranks: "phản hồi."
    modality_and_negation: "Giữ lời cảm ơn ngắn gọn và câu hỏi xác nhận mức độ khẩn cấp."
