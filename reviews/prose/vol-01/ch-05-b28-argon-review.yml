    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000044
    pov_and_pronouns: "Thoại của Tanya với Visha: gọi cấp dưới bằng quân hàm 'Thiếu úy' và tự xưng 'tôi'."
    terms_and_ranks: "Thiếu úy; Văn phòng Bộ Tổng Tham mưu."
    modality_and_negation: "Giữ dấu chấm lửng mở đầu, điệp cấu trúc tăng tiến '…Quá sớm. Vẫn còn quá đỗi sớm.' và mệnh lệnh nối máy điện thoại."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000045
    pov_and_pronouns: "Trần thuật ngôi thứ nhất của Tanya: tự quy chiếu 'Mình' / 'mình'; quy chiếu Visha là 'viên thiếu úy', Bộ Tổng Tham mưu là 'họ', và vị sĩ quan tham mưu cấp cao mới bước vào là 'ông ấy'."
    terms_and_ranks: "viên thiếu úy (viết thường danh từ chung); Bộ Tổng Tham mưu; sĩ quan tham mưu cấp cao; Văn phòng Bộ Tổng Tham mưu; đại úy quèn."
    modality_and_negation: "Giữ so sánh giả định 'cứ như thể họ đã lường trước...' ở câu 2 và sự tự đính chính khẳng định chắc chắn 'Không, chắc chắn là họ biết rõ, đó là lý do...' ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000046
    pov_and_pronouns: "Thoại của Trung tá von Lergen với Tanya: gọi bằng quân hàm mới 'Thiếu tá von Degurechaff'."
    terms_and_ranks: "Thiếu tá von Degurechaff."
    modality_and_negation: "Giữ phủ định can ngăn điềm tĩnh 'Việc đó không cần thiết đâu...'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000047
    pov_and_pronouns: "Thoại của Tanya với Lergen: gọi 'Trung tá von Lergen', tự xưng 'Tôi' và gọi cấp trên là 'ngài'."
    terms_and_ranks: "Trung tá von Lergen."
    modality_and_negation: "Giữ thán từ bất ngờ mở đầu và phủ định 'Tôi không biết là ngài đang ở đây.'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000048
    pov_and_pronouns: "Trần thuật ngôi thứ nhất của Tanya: 'mình'; quy chiếu 'Trung tá von Lergen' bằng 'Ông ấy'."
    terms_and_ranks: "Trung tá von Lergen; quân nhân; tiền tuyến."
    modality_and_negation: "Giữ nhận định đánh giá tích cực và thái độ 'phản đối việc đẩy trẻ con ra tiền tuyến'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000049
    pov_and_pronouns: "Thoại của Lergen với Tanya: tự xưng 'Tôi', gọi Tanya là 'cô' và 'Thiếu tá'."
    terms_and_ranks: "thăng hàm; Thiếu tá; phái viên."
    modality_and_negation: "Giữ lời chúc mừng thăng hàm, xác nhận vai trò phái viên và phỏng đoán 'Tôi đoán là cô có rất nhiều câu hỏi.'."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000050
    pov_and_pronouns: "Trần thuật ngôi thứ nhất của Tanya: 'Mình' / 'bản thân' / 'mình'; quy chiếu Lergen bằng danh từ chung 'Vị trung tá'."
    terms_and_ranks: "Vị trung tá (viết thường cấp bậc); thông báo không chính thức; thăng hàm; quan chức cấp cao; Văn phòng Bộ Tổng Tham mưu; giấy quyết định thăng hàm; tiểu đoàn trưởng."
    modality_and_negation: "Giữ so sánh giả định 'cứ như thể mọi chuyện đã được an bài' ở câu 1, phủ định kép 'không phải là không vui' đi kèm mệnh đề đối lập ở câu 2, và phủ định tuyệt đối theo thông lệ 'Thông thường, ... sẽ chẳng bao giờ...' ở câu 3."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000051
    pov_and_pronouns: "Thoại của Tanya: câu 1 nói với Lergen ('ngài'), câu 2 ra lệnh cho Visha ('Thiếu úy')."
    terms_and_ranks: "Thiếu úy."
    modality_and_negation: "Giữ dấu chấm lửng mở đầu, lời cảm ơn xã giao và mệnh lệnh cho cấp dưới lui ra."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000052
    pov_and_pronouns: "Thoại của Visha tuân lệnh Tanya: cập nhật cách xưng hô theo quân hàm mới 'thưa Thiếu tá' và tự xưng 'Tôi'."
    terms_and_ranks: "Thiếu tá."
    modality_and_negation: "Giữ câu đáp lễ phép khi rút lui khỏi phòng."
    emphasis: "Không dùng dấu *...*."
  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000053
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: tự quy chiếu 'Mình' / 'mình', kết hợp đại từ ngôi thứ nhất số nhiều 'chúng tôi' (Tanya và Trung tá von Lergen) ở câu 2."
    terms_and_ranks: "bên thứ ba; sĩ quan phụ tá; thăng hàm; tiểu đoàn; thực chiến; đơn vị; kỷ luật."
    modality_and_negation: "Giữ suy đoán 'mình ngờ rằng...' ở câu 3, tính tất yếu 'phải chuẩn bị sẵn sàng bước vào thực chiến' ở câu 4 và câu hỏi tự vấn nội tâm về việc tìm cớ trì hoãn ở câu 5."
    emphasis: "Khóa chính xác câu thứ năm trong dấu nhấn mạnh Markdown '*Liệu mình có thể câu thêm chút thời gian bằng cách nói rằng đơn vị vẫn còn thiếu kỷ luật hoặc chưa gắn kết ăn ý với nhau không nhỉ?*' khớp 1:1 với thẻ <html:em> trong nguồn theo DEC-P01-002."
