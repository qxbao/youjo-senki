    pov_and_pronouns: "Thoại đáp của Visha với Tanya: 'thưa Đại úy', quy chiếu ngôi thứ hai kính trọng bằng 'ngài'."
    terms_and_ranks: "Đại úy."
    modality_and_negation: "Giữ khẳng định lễ phép 'Vâng, thưa Đại úy. Đang có người đợi ngài đấy ạ.'."
