  - segment_id: YS-LN01/Text/chapter011b.xhtml/p000038
    pov_and_pronouns: "Độc thoại nội tâm của Tanya: 'mình'; đại từ 'đó' / 'nó' quy chiếu công việc trong bức điện."
    terms_and_ranks: "việc vặt vô bổ."
    modality_and_negation: "Giữ cả hai mệnh đề điều kiện đầu và cuối câu ('Nếu đó là..., mình muốn..., nếu có thể')."
    emphasis: "Không dùng dấu *...*."
