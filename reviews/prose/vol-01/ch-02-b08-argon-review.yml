- id: ch02-b08-tanya-pov-dissociation-and-technology-division-pov-transition
  source_term: Tanya first-person interior monologue and third-person narration pronouns in p000024–p000034, intra-paragraph POV/pronoun shifts between first-person narrator and third-person Tanya in p000027/p000031/p000032, and scene-level POV transition to Supply and Logistics Headquarters Technology Division third-person narration and dialogue in p000035–p000041
  proposed_vi: trong phần điểm nhìn của Tanya trước khi chuyển cảnh (p000024–p000034), các đoạn/mệnh đề độc thoại nội tâm ngôi thứ nhất (p000024–p000028, p000031–p000034) dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” theo đúng DEC-P01-001, còn các câu/mệnh đề trần thuật ngôi thứ ba hoặc khi chủ thể tự tách góc nhìn nhắc đến danh tính bên ngoài (p000027, p000029, p000031, p000032) dùng tên riêng “Tanya” và đại từ trần thuật “nó” (p000032) theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01 → ch02-b07 (tuyệt đối tránh dùng đại từ “cô” trong phần điểm nhìn của Tanya; lưu ý từ “nó” ở cuối p000026 quy chiếu quả cầu, và ở câu 2 p000027 quy chiếu cơ chế xả an toàn); đặc biệt tại p000027, p000031 và p000032, bảo toàn chính xác sự chuyển đổi giữa ngôi thứ nhất (“mình” / “Mình”) và ngôi thứ ba (“Tanya” / “nó”) ngay trong cùng một đoạn theo đúng văn bản nguồn; quy chiếu Kỹ sư trưởng von Schugel tại p000025 và p000032 bằng “ông ta” và “gã nhà khoa học điên đó” đồng bộ với ch-02-b04 → ch-02-b07; từ tiêu đề chuyển cảnh p000035 sang văn phòng Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần (p000035–p000041), tuân thủ giới hạn của DEC-P01-001 (không tự mở rộng quy ước dùng “nó” sang điểm nhìn của chủ thể khác; đồng bộ với phần điểm nhìn của Thiếu tá Lergen ở ch-01-b15 → b18) bằng cách dùng chức danh/tên riêng “Thiếu úy Ma pháp Tanya Degurechaff” / “Thiếu úy Tanya Degurechaff” / “Degurechaff” và đại từ ngôi thứ ba “cô” trong lời kể từ góc nhìn của bộ máy quản lý Ban Công nghệ (p000037, p000038, p000040, p000041) cùng đại từ “họ” cho Cục Nhân sự (p000040), đồng thời trong lời thoại trao đổi nội bộ giữa các nhân sự quản lý tại p000039 dùng “chúng ta” và gọi Degurechaff là “cô ấy”
  alternatives_vi:
  - cô ta (thay cho “cô” trong lời kể ngôi thứ ba từ góc nhìn của Ban Công nghệ tại p000037, p000038, p000040, p000041 — ưu tiên “cô” vì giữ thái độ hành chính chuyên nghiệp, trung tính của các sĩ quan quản lý đối với một thiếu úy có năng lực cao và đồng bộ với ch-01-b15 → b18)
