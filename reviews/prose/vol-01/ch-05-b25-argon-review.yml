    issue: "Thán từ mở đầu đoạn độc thoại nội tâm của Visha được dịch là 'A ha', dễ gợi sắc thái phát hiện hoặc cười đắc ý thay vì tiếng thở dài cảm thán trước nỗi kinh hoàng về vị chỉ huy."
