  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md dưới điểm nhìn của Thiếu úy Tanya Degurechaff trong cuộc trao đổi nhận nhiệm vụ với Trung úy Ihlen Schwarkopf: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“Mình” / “mình” / “chúng tôi”) và trần thuật ngôi thứ ba (“Tanya” / “nó” / “Nó”), giữ chuẩn mực xưng hô quân ngũ (“Tôi / Chúng ta – Thiếu úy / cô” và “tôi / chúng ta – thưa ngài / ngài... ạ”), xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice, bảo toàn chính xác mọi câu hỏi trực tiếp/nội tâm, các cấu trúc điều kiện/phủ định/giả định và vị trí nhấn mạnh in nghiêng duy nhất `*Thế này thì quá quắt lắm rồi!*` tại p000323."
