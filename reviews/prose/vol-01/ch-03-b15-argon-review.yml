  rationale: "Kế thừa đồng bộ “pháp sư”, “pháo binh”, “đội tiên phong” (ch-03-b04 p000052, ch-03-b13 p000265), “phòng tuyến” (ch-03-b13 p000282, ch-04-b15 p000079), “Tanya”, “xuất kích” (ch-03-b01 p000018), “tuyến sau” (ch-03-b13 p000279), “lực lượng xung kích cơ động” (ch-03-b14 p000292), “chiến hào” (ch-03-b14 p000298), “công sự” (ch-03-b14 p000299, p000300), “tiền tuyến”, “đợt phản công” / “cuộc phản công” / “phản công” (ch-03-b14 p000294, p000298), “Thiếu úy” (b02-second-lieutenant), “lá chắn” (ch-03-b11 p000226), “mồi nhử” (vol-04-ch-03-b20), “hợp đồng” (b07-contract), “tập kết” và “Đại Quân” (ch-03-b12 p000260, ch-03-b13 p000271, p000272), “phòng ngự cơ động” / “chiến lược phòng ngự cơ động” (ch-03-b13 p000278, p000279, ch-03-b14 p000292, ch-04-b15 p000088), “Đế quốc”, “mặt trận phía đông” (vol-04-ch-04-b03 p000062), “Thế chiến thứ nhất” (ch-04-b15 p000079), “trung đội” (ch-03-b11/b12), “cấp dưới” (ch-03-b11 p000225), “Cụm tập đoàn quân phương Tây” (ch-03-b12 p000261, ch-03-b13 p000264) và “tân binh” (ch-03-b12 p000245, p000246, ch-03-b14 p000291); khóa tạm “cứ điểm” (p000301), “các mũi đột phá của địch” / “các mũi đột phá”, “vị trí tiền tiêu”, “đánh bọc hậu quân địch” và “nhân lực phản công” (p000305, p000306), “ưu thế về quân số” (p000306), “tuyến tiền tiêu xa nhất” (p000307), “Nhân lực xung kích cơ động”, “Hợp vây” và “những tấm bia đỡ đạn được tô vẽ mỹ miều” (p000310), “các điểm chốt” (p000311), “kỹ năng quản trị khủng hoảng” (p000312), “các chiến dịch xung kích cơ động” (p000313), “điều kiện làm việc” và “lương cơ bản” (p000315), “sĩ quan mới ra lò” (p000320), “phòng ngự trì hoãn” (đồng bộ với “tác chiến trì hoãn” / “trận đánh trì hoãn” ở ch-03-b13 p000278, p000279) và “các toán quân đột kích” (p000321), cùng “nhân sự nòng cốt” (đồng bộ với “nhân sự” và “nòng cốt” ở ch-04-b15 p000094, p000097), “lực lượng bổ sung” (đồng bộ với “số lính bổ sung” ở ch-03-b14 p000291), “trung đội ba” (viết thường theo nguồn; đồng bộ với “Trung đội 3” ở ch-03-b11 p000224, p000233) và “lính mới tuyển chưa qua huấn luyện” (p000323)."
