- id: ch03-b15-tanya-pov-schwarkopf-briefing-pronouns-conditionals-and-emphasis
  source_term: tanya_pov_schwarkopf_briefing_pronouns_conditionals_and_emphasis_ch03_b15
  proposed_vi: 'tiếp nối trực tiếp phần phân tích chiến thuật của Tanya ở cuối lô ch-03-b14 (p000298–p000300), toàn bộ 23 đoạn của lô ch-03-b15 (chapter007.xhtml/p000301–p000323) diễn ra dưới điểm nhìn của Thiếu úy Tanya Degurechaff trong cuộc trao đổi nhận nhiệm vụ với Đại đội trưởng — Trung úy Ihlen Schwarkopf, tuân thủ nghiêm ngặt DEC-P01-001 (dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu của Tanya, tuyệt đối không dùng “cô” cho Tanya trong lời kể hay độc thoại nội tâm) và DEC-P01-002: (1) Trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000301, câu 2 p000306, p000309, câu 5 p000310, p000312, p000315, p000316, câu 3 p000321), quy chiếu cái tôi nội tâm ở ngôi thứ nhất số ít nhất quán bằng đại từ tự quy chiếu “Mình” / “mình” kết hợp phản thân “bản thân” (p000301, p000306, p000312, p000315, p000316, p000321), và ở câu 5 p000310 khi Tanya tự gộp mình với đơn vị đóng ở tiền tuyến (đối lập với cánh quân xuất phát từ tuyến sau) dùng đại từ ngôi thứ nhất số nhiều “chúng tôi” (“nhưng chúng tôi sẽ chỉ là những tấm bia đỡ đạn được tô vẽ mỹ miều mà thôi” — đồng bộ ch-03-b11 p000234 và vol-04-ch-03-b20). (2) Trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000302, câu 4 p000310, câu 2–5 p000323), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại từ “nó” / “Nó” kết hợp phản thân “mình” / “bản thân”, bảo toàn nguyên vẹn sự chuyển dịch ngôi tự sự ngay trong cùng đoạn văn tại p000310; lưu ý từ “nó” đầu tiên ở vế sau câu 2 p000323 (“nhưng nó lố bịch đến mức khiến não nó như đông cứng lại”) quy chiếu danh từ bất động vật là danh sách cấp dưới, còn từ “nó” thứ hai quy chiếu Tanya. (3) Quy chiếu đơn vị phản công, nhân lực xung kích cơ động, phía quân đội Đế quốc và đám lính mới bổ sung bằng đại từ số nhiều “họ” / “Họ” (p000306, p000310, p000321, p000323), và quy chiếu đội tiên phong cùng các toán quân đột kích của địch bằng đại từ “chúng” (p000301, p000321; đồng bộ với “chúng” trong lời thoại ở p000317, p000320). (4) Tại hai câu nhận định khái quát có đại từ ngôi thứ hai phiếm chỉ trong nguồn (câu 5 p000305, câu 3 p000315), theo đúng quy ước direct-address choice (pending-terms.yml), dùng chủ ngữ khái quát “người ta” ở câu 5 p000305 (“nằm ở chỗ người ta có thể ung dung thư giãn với tư cách nhân lực phản công ở tuyến sau...”) và lược đại từ ngôi thứ hai phiếm chỉ bằng cấu trúc danh hóa tự nhiên ở câu 3 p000315 (“Việc bắt một người làm việc quá sức cũng phải có giới hạn thôi chứ.”). (5) Trong lời thoại quân ngũ giữa Trung úy Ihlen Schwarkopf và Thiếu úy Tanya Degurechaff (p000303, p000304, p000307, p000308, p000311, p000313, p000314, p000317–p000320, p000322, p000323), Schwarkopf tự xưng “Tôi” (p000311), dùng đại từ gộp “Chúng ta” / “chúng ta” cho Đại đội Pháp sư Xung kích số 205 (p000307, p000311, p000317), quy chiếu quân địch bằng “chúng” (p000317) và gọi Tanya là “Thiếu úy” / “cô” (p000307, p000311, p000319, p000322 — đồng bộ ch-03-b11–b14), còn Tanya tự xưng “tôi” kết hợp phản thân “mình” (p000323), dùng đại từ gộp “Chúng ta” / “chúng ta” cho đơn vị và phía Đế quốc (p000304, p000313, p000320, p000323), quy chiếu lực lượng địch bằng “chúng” (p000320) và đám lính mới bổ sung bằng “họ” (p000323), đồng thời gọi cấp trên trực tiếp là “thưa ngài” / “ngài” kèm tiểu từ kính ngữ “ạ” (p000304, p000308, p000313, p000318, p000320, p000323). (6) Bảo toàn nguyên vẹn đối tượng và độ mở của tất cả các câu hỏi trực tiếp trong đối thoại (p000303, p000304, p000313, p000319, p000323) và các câu hỏi tự vấn nội tâm (p000310, p000312, p000315), cùng thời gian và mức độ chắc chắn của các mệnh đề điều kiện, phủ định và giả định (nhượng bộ so sánh ở p000301; câu điều kiện phủ định ở p000306; giả định điều kiện đối lập ở câu 4 p000310; khả thể ở p000311; giả định mong ước trái thực tế ở p000312; suy luận ở p000318; câu điều kiện kết hợp phủ định và khả thể ở p000320; phủ định khả thể, điều kiện phủ định và giả định đi kèm mức độ chắc chắn ở p000321; giả định diễn đạt suy nghĩ thành lời ở câu 5 p000323); bảo toàn chính xác duy nhất 1 vị trí nhấn mạnh Markdown `*Thế này thì quá quắt lắm rồi!*` tại p000323 tương ứng với thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô theo đúng DEC-P01-002 (22/23 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)'
  alternatives_vi:
  - chúng mình (thay cho “chúng tôi” ở câu 5 p000310 — ưu tiên “chúng tôi” để thể hiện sắc thái tách biệt giữa đơn vị tiền tiêu của Tanya và cánh quân tuyến sau, đồng bộ ch-03-b11 p000234) / lược chủ ngữ phiếm chỉ (thay cho chủ ngữ khái quát “người ta” ở câu 5 p000305 — cả hai cách đều thuộc quy ước direct-address choice; ưu tiên “người ta” để cấu trúc câu văn xuôi tự nhiên, rõ nghĩa)
