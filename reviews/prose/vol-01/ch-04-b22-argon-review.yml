- id: ch04-b22-tanya-pov-pronouns-instructor-dialogue-conditionals-and-single-emphasis
  source_term: tanya_pov_pronouns_instructor_dialogue_conditionals_and_single_emphasis_ch04_b22
  proposed_vi: 'tiếp nối trực tiếp ch-04-b21 (p000221–p000245), toàn bộ 30 đoạn của lô ch-04-b22 (chapter009b.xhtml/p000246–p000275) diễn ra dưới điểm nhìn xoay quanh Trung úy Tanya Degurechaff trong màn đối đáp chiến thuật căng thẳng với giảng viên Học viện Chiến tranh trên đường hành quân leo núi, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) Trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (câu 2 p000253, p000258, p000263, câu 1 p000271), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại từ ngôi thứ ba “nó” / “Nó” kết hợp phản thân “mình” theo đúng DEC-P01-001 (tuyệt đối không dùng đại từ “cô” trong trần thuật; lưu ý từ “nó” ở p000252, p000256 và p000257 chỉ quy chiếu danh từ bất động vật là trận địa / ngọn đồi / yêu cầu tác chiến). (2) Trong các câu độc thoại nội tâm ngôi thứ nhất của Tanya (p000246, p000249, p000250, câu 1 p000253, p000255, p000256, p000259, p000261, p000265, p000267–p000269, câu 2–4 p000271, p000272, p000274, p000275), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” ở ngôi thứ nhất số ít theo đúng DEC-P01-001, dùng đại từ ngôi thứ nhất số nhiều “chúng ta” / “Chúng ta” (hoặc “chúng mình” khi nhớ về thời ở học viện sĩ quan tại câu 2 p000267) khi suy tính về quân đội phe mình trong bài toán chiến thuật và nguyên tắc chung của sĩ quan (p000249, p000255, p000261, p000267, p000268); quy chiếu viên giảng viên trong nội tâm và trần thuật bằng “ông ta” / “Ông ta” hoặc “viên giảng viên”, và dùng “Ông” khi Tanya thầm chất vấn trực tiếp ông ta trong suy nghĩ (câu 3 p000255, câu 3 p000256); quy chiếu các học viên cùng khóa bằng “các bạn đồng môn” / “bọn họ” (p000258) và các giảng viên học viện trước đây bằng “họ” (p000268). (3) Trong các câu có đại từ ngôi thứ hai phiếm chỉ trong nguồn (câu 4 p000249, câu 4 p000271), chuyển thành chủ ngữ khái quát “người ta” theo đúng quy ước direct-address choice (đồng bộ ch-04-b21 p000221). (4) Trong đối thoại giữa giảng viên và Trung úy Tanya Degurechaff: giảng viên (p000247, p000251, p000254, p000260, p000273) tự xưng “Tôi”, gọi Tanya là “cô” và dùng “chúng ta” khi hô cả đội tiếp tục hành quân (p000273 — đồng bộ ch-04-b21 p000238, p000242); Tanya (p000248, p000252, p000257, p000262, p000264, p000266, p000270) tự xưng “tôi” kết hợp phản thân “mình” (p000262) và đại từ gộp “ta” trong khuyến nghị tác chiến (p000270), gọi giảng viên bằng “thưa ngài” / “Thưa ngài” đi kèm tiểu từ kính ngữ “ạ” chuẩn mực quân ngũ. (5) Bảo toàn nguyên vẹn đối tượng và độ mở của tất cả các câu hỏi trực tiếp và câu hỏi nội tâm (p000246, p000247, p000251–p000253, p000255, p000256, p000259, p000260, p000262, p000274), dấu nháy đơn nhấn mạnh từ lặp lại `‘Đánh chiếm’` ở p000252, dấu gạch ngang dài kẹp mệnh đề chêm ở câu 2 p000267, các dấu chấm lửng ở p000246, p000248, p000250, p000253 và p000275, cùng chính xác thời gian, phủ định và mức độ chắc chắn của các mệnh đề điều kiện/giả định (khả thể giả định và điều kiện nắm quyền chỉ huy ở p000249; câu hỏi điều kiện thu hẹp giả định ở p000247, p000251; câu điều kiện đe dọa ở p000254; giả định trái thực tế “Nếu có thể dùng bộ binh để đánh chiếm các trận địa, thì chúng ta đã chẳng phải tốn bao nhiêu thời gian đau đầu vì chiến tranh trận địa như thế này” ở p000255; câu hỏi trách móc giả định quá khứ ở p000259; chuỗi giả định chiến thuật và hệ quả ở p000261; giả định hành động của giảng viên ở p000267; giả định đánh giá ở p000268). (6) Bảo toàn chính xác 1 vị trí nhấn mạnh Markdown `*bất khả thi*` duy nhất tại p000258 tương ứng với thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô theo đúng DEC-P01-002 (29/30 đoạn còn lại chỉ có thẻ `<html:span>` nên hoàn toàn không dùng dấu `*`)'
  alternatives_vi:
  - chúng ta (thay cho “chúng mình” ở câu 2 p000267 khi Tanya nhớ lại lời dạy chung ở học viện sĩ quan — cả hai đều tự nhiên và đúng ngôi thứ nhất số nhiều trong độc thoại nội tâm của Tanya)
