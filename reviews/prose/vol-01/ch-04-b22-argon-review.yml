  volume: vol-01
  chapter: 4
  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ và danh xưng đã khóa tạm từ Chương 0–3 cùng ch-04-b01 → ch-04-b21: “Bộ Tổng Tham mưu” (ch-01-b03, ch-04-b01/b11/b16, p000246, p000265), “hỏa lực” (p000246), “pháp sư” và “pháp sư không quân” (b06-aerial-mage / ch-04-b21, p000248, p000249, p000256), “bộ binh” và “tiểu đoàn bộ binh” (ch-04-b21 p000227, p000241, p000248, p000249, p000251–p000253, p000255), “trận địa” / “trận địa phòng ngự” (ch-04-b21, p000249, p000251, p000255, p000261) phân biệt rõ với “công sự hỏa lực” (p000248, p000265), “đột phá” (ch-04-b21 p000230–p000232, p000249), “Tanya” (p000253, p000258), “chiến tranh trận địa” (ch-04-b14/b15, p000255), “công binh” (ch-03-b14, p000256), “giảng viên” / “viên giảng viên” (ch-04-b21, p000258, p000271), “Đại úy Uger” (ch-04-b04–b09, p000259), “súng máy hạng nặng” (ch-04-b21 p000223, p000259), “Quân đội Cộng hòa” (ch-03-b05, ch-03-b17, p000261), “sĩ quan tham mưu” (ch-04-b16–b21, p000262, p000264, p000265), “vị chuẩn tướng” và “phòng đọc sách” (ch-04-b10–b15, p000263), “tinh thần chiến đấu” (ch-04-b14, p000263, p000267), “học viện” (ch-04-b04/b10, p000267), “giáo dục cấp dưới” (ch-04-b13 p000029–p000030, p000268) và “doanh nhân” (ch-02-b05, p000271, p000274); khóa tạm “lấy thịt đè hỏa lực” (p000246), “chiến thuật giao tranh phân tán” và “công sự hỏa lực” (p000248, p000265), “kiểu Ba Viên Đạn Thịt” (p000256), “thứ hạng học tập” (p000258), “một Đế quốc Mặt trời nào đó”, “xung phong lưỡi lê”, “hỏa lực chế áp ngăn chặn”, “chọc vào tổ ong bắp cày”, “tập kích ban đêm” và “quy mô tiểu đoàn” (p000261), “chức trách cũng như nghĩa vụ” (p000262), “sự tự do nội tâm” (p000272), cùng sự đối chiếu giữa lời nói công vụ “ghi nhận ý kiến” của giảng viên (p000273) và cách hiểu khẩu ngữ lo âu “ghi sổ” trong nội tâm Tanya (p000274, p000275)."
