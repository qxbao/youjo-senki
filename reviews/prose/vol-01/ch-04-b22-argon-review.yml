  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md xuyên suốt 30 đoạn dưới điểm nhìn của Trung úy Tanya Degurechaff: giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba (“Tanya” / “nó” / “Nó” kết hợp phản thân “mình”), độc thoại nội tâm ngôi thứ nhất (“mình” / “Mình” / “chúng ta” / “chúng mình”, gọi giảng viên là “ông ta” hoặc chất vấn thầm “Ông”) và đối thoại quân ngũ với giảng viên (“Tôi – cô” và “tôi – thưa ngài... ạ”), xử lý đại từ ngôi thứ hai phiếm chỉ bằng “người ta” theo direct-address choice, bảo toàn đầy đủ các câu hỏi, cấu trúc điều kiện/giả định trái thực tế và duy nhất 1 vị trí nhấn mạnh `*bất khả thi*` tại p000258."
