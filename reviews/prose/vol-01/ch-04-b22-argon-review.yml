  source_term: staff_duty_defense_impossible_position_and_inner_freedom_terms_ch04_b22
  proposed_vi: Bộ Tổng Tham mưu / lấy thịt đè hỏa lực / hỏa lực / chiến thuật giao tranh phân tán / pháp sư / bộ binh / công sự hỏa lực / yểm trợ / pháp sư không quân / trận địa / thương vong / đột phá / tiểu đoàn bộ binh / Tanya / chiến tranh trận địa / công binh / kiểu Ba Viên Đạn Thịt / bạn đồng môn / *bất khả thi* / bất khả thi / giảng viên / viên giảng viên / thứ hạng học tập / Đại úy Uger / súng máy hạng nặng / một Đế quốc Mặt trời nào đó / xung phong lưỡi lê / hỏa lực chế áp ngăn chặn / trận địa phòng ngự / Quân đội Cộng hòa / chọc vào tổ ong bắp cày / tập kích ban đêm / quy mô tiểu đoàn / sĩ quan tham mưu / chức trách cũng như nghĩa vụ / vị chuẩn tướng / phòng đọc sách / tinh thần chiến đấu / học viện / giáo dục cấp dưới / doanh nhân / cánh nhà binh / giới nhà binh / sự tự do nội tâm / hành quân / ghi nhận ý kiến / ghi sổ
  alternatives_vi:
  - chiến thuật tán binh và trận địa hỏa lực (thay cho “chiến thuật giao tranh phân tán” tại p000248 và “công sự hỏa lực” tại p000248, p000265) / kiểu Nhục Đạn Tam Dũng Sĩ hoặc kiểu Ba Cảm Tử Quân Đạn Thịt (thay cho “kiểu Ba Viên Đạn Thịt” tại p000256) / một Đế quốc Mặt trời Mọc nào đó, hỏa lực phong tỏa hoặc hỏa lực ngăn chặn, và đánh đêm (thay cho “một Đế quốc Mặt trời nào đó”, “hỏa lực chế áp ngăn chặn” và “tập kích ban đêm” tại p000261) / nhân viên tham mưu (thay cho “sĩ quan tham mưu” tại p000262, p000264, p000265) / tự do trong tâm tưởng (thay cho “sự tự do nội tâm” tại p000272)
