  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md, tiếp nối liền mạch điểm nhìn tự sự ngôi thứ nhất của Viktoriya Ivanovna Serebryakov từ ch-03-b09 (p000177–p000182): dùng nhất quán “Tôi” / “tôi” và “chúng tôi” trong tự sự, “cô ấy” cho Elya, cùng hệ xưng hô bạn bè ngang hàng thân mật “tớ – cậu” và “bọn mình” trong đối thoại tại nhà ăn, đồng thời bảo toàn chính xác các câu hỏi nội tâm, câu điều kiện và cả 2 vị trí nhấn mạnh in nghiêng tại p000202 và p000212."
