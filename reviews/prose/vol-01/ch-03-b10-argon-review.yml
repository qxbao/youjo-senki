  rationale: "Kế thừa đồng bộ “Trường Thiếu sinh quân”, “ký túc xá”, “Visha”, “Elya” và “Serebryakov” từ ch-03-b09 (ch03-b09-cadet-corps-dormitory-serebryakov-visha-and-elya-terms), “pháp sư”, “trung sĩ” (ch-04-b09), “Thượng đế” (review-God), “các đơn vị chiến đấu” (ch-02-b16 p000215), “quân phục” (ch-04-b07 p000151), “ma pháp”, “Quân đội Đế quốc” (ch-03-b05/b08), giữ nguyên danh xưng “Reich” (ch04-b13-dominant-state-foreign-intervention-lend-lease-and-individualism-terms / vol-04-ch-01-b15), “Cụm tập đoàn quân phương Tây” (ch-03-b01 p000010 / vol02-ch02-b12-western-army-group), “lực lượng tiếp viện” / “quân tiếp viện” (ch-03-b02/b04), “mặt trận Rhine” (ch03-b01-rhine-front-solo-sortie-and-acm-skill-badge-terms), “tổ quốc” (ch-03-b03 p000049), giữ nguyên địa danh “Moskva” (Tập 2–4), “Đế quốc”, “hậu phương” (ch-03-b04, ch-04-b07/b11), “hạ sĩ quan” (chapter5_b19_reviewer_recommendations), “tiền tuyến”, “trung đội” và “trung đội trưởng” (ch-03-b05 p000082), “lính kỳ cựu” / “người lính kỳ cựu” (tránh dùng “cựu binh” cho quân nhân đang tại ngũ theo quy ước ch-01-b06 p000100 và ch-03-b05 p000068), “lục quân” (ch-03-b08, ch-04-b06/b11–b13), “Cục Nhân sự” (b15-general-staff-personnel-and-achievement-assessment-terms / ch-02-b11 p000093 / ch-04-b07 p000146), “Viễn Đông” (chapter6_b11_reviewer_recommendations), “Huy hiệu Xung kích Cánh Bạc” (ch-03-b08 p000133, ch-03-b09 p000175) cùng tên gọi tắt “Cánh Bạc”, “pháo binh” và “đội quan sát” (ch03-b08-tech-research-lab-board-of-review-and-type-95-combat-evaluation-terms, p000131 / ch-02-b16 p000205 / ch-02-b17 p000247); khóa tạm “cô học viên thiếu sinh quân kém may mắn này”, “các trung sĩ huấn luyện dữ như quỷ sứ”, “cô bạn chí cốt”, “tiềm năng ma pháp”, “lính mới”, “thần dân Đế quốc”, “những người lính Đế quốc”, cặp từ trung tính chỉ hai người họ hàng đã nhận nuôi Visha là “cô chú” (độ bất định trung bình do nguồn không nêu rõ bên nội hay bên ngoại), “miếng ăn hằng ngày”, “các nhà ăn hạ sĩ quan”, “khẩu phần chiến đấu”, “các sĩ quan nhân sự”, “ninja”, “Cô Serebryakov” và “viên kẹo caramel”."
