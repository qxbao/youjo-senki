  proposed_vi: Trường Thiếu sinh quân / pháp sư / cô học viên thiếu sinh quân kém may mắn này / các trung sĩ huấn luyện dữ như quỷ sứ / Thượng đế / cô bạn chí cốt / các đơn vị chiến đấu / quân phục / tiềm năng ma pháp / các pháp sư của Quân đội Đế quốc / Reich / lính mới / ký túc xá của Cụm tập đoàn quân phương Tây / lực lượng tiếp viện (quân tiếp viện) / mặt trận Rhine / tổ quốc / thần dân Đế quốc / Moskva / những người lính Đế quốc (người lính Đế quốc) / cô chú / miếng ăn hằng ngày / hậu phương / các nhà ăn hạ sĩ quan / tiền tuyến / khẩu phần chiến đấu / Visha / trung đội / trung đội trưởng / Elya / lính kỳ cựu (người lính kỳ cựu) / hạ sĩ quan / lục quân / các sĩ quan nhân sự / các sĩ quan từ Cục Nhân sự / ninja / Viễn Đông / Cô Serebryakov / Cánh Bạc / Huy hiệu Xung kích Cánh Bạc / pháo binh / đội quan sát / tuyến sau / viên kẹo caramel
  alternatives_vi:
