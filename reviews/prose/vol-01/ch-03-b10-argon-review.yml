- id: ch03-b10-serebryakov-first-person-pov-and-elya-mess-hall-dialogue-pronouns-conditionals-and-emphasis
  source_term: serebryakov_first_person_pov_and_elya_mess_hall_dialogue_pronouns_conditionals_and_emphasis_ch03_b10
  proposed_vi: 'tiếp nối trực tiếp Phân cảnh 2 của lô ch-03-b09 (p000176–p000182), toàn bộ 38 đoạn của lô ch-03-b10 (p000183–p000220) được thuật lại dưới điểm nhìn tự sự ngôi thứ nhất của Viktoriya Ivanovna Serebryakov (Visha) tại ký túc xá và nhà ăn trước giờ nhận lệnh phân công đơn vị, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác) và DEC-P01-002: trong các đoạn tự sự ngôi thứ nhất của Visha (p000183–p000190, p000192, p000194, p000198, p000199, p000202, p000207, p000212, p000216, p000220), Visha tự xưng nhất quán bằng đại từ “Tôi” / “tôi” kết hợp phản thân “mình” (riêng tại câu 2 p000185 bảo toàn lối tự quy chiếu ngôi thứ ba hóm hỉnh “cô học viên thiếu sinh quân kém may mắn này”, và tại câu 3 p000202 dùng “Mình” cho câu tự nhủ thầm trong đầu được đánh dấu in nghiêng trong nguồn), dùng “chúng tôi” / “hai đứa” khi gộp bản thân với Elya, các bạn đồng khóa hoặc gia đình lúc chạy nạn (p000186–p000189, p000192, p000194, p000212), và quy chiếu Elya ở ngôi thứ ba bằng tên riêng “Elya”, các danh ngữ “cô bạn tốt tính của mình”, “cô bạn chí cốt”, “cô bạn của tôi” cùng đại từ “cô ấy” (p000183, p000202, p000207, p000212 — đồng bộ ch-03-b09 p000180–p000182; lưu ý đại từ “nó” tại p000201 và p000219 hoàn toàn chỉ quy chiếu sự việc lập trung đội mới hoặc viên kẹo caramel, không quy chiếu nhân vật); trong các cấu trúc ngôi thứ hai phiếm chỉ ở p000192 và p000198, lược đại từ ngôi thứ hai phiếm chỉ hoặc dùng chủ ngữ khái quát “người ta” kết hợp phản thân “chính mình” theo đúng quy ước direct-address choice; trong hội thoại thân mật giữa hai người bạn đồng khóa Visha và Elya tại nhà ăn (p000191, p000193, p000195–p000197, p000200, p000201, p000203–p000206, p000208–p000211, p000213–p000215, p000217–p000219), dùng nhất quán cặp đại từ bạn bè ngang hàng thân thiết “tớ – cậu” (Tớ / tớ – cậu) và đại từ ngôi thứ nhất số nhiều gộp “Bọn mình” / “bọn mình” (p000200, p000217), đồng thời bảo toàn cách gọi trêu đùa kiểu quý cô lịch thiệp “Cô Serebryakov” của Elya tại p000204; bảo toàn nguyên vẹn đối tượng và độ mở của cả 3 câu hỏi nội tâm của Visha (p000183, p000202, p000212), đầy đủ các câu hỏi trực tiếp trong đối thoại (p000193, p000195, p000200, p000205, p000208, p000210, p000213, p000218), các mệnh đề phủ định và nhượng bộ (p000183–p000187, p000198, p000201, p000202, p000206, p000207, p000215, p000219), cấu trúc điều kiện phủ định và giả định trong lời thoại tại p000215 (`nếu không cẩn thận`) và p000217 (`nếu cứ đủng đỉnh thế này thì bọn mình sẽ hết giờ mất`), cùng chính xác cả 2 vị trí nhấn mạnh Markdown `*...*` tương ứng với thẻ `<html:em>` trong nguồn tại câu 3 p000202 (`*…Mình không nên nghĩ sâu quá làm gì.*`) và câu 2 p000212 (`*sống*`) theo đúng DEC-P01-002 (36/38 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)'
  alternatives_vi:
  - cậu ấy (thay cho “cô ấy” khi Visha quy chiếu Elya trong tự sự ngôi thứ nhất tại p000183, p000207, p000212 — ưu tiên “cô ấy” để đồng bộ hoàn toàn với ch-03-b09 p000180–p000182) / mình – cậu và chúng mình (thay cho “tớ – cậu” và “bọn mình” trong hội thoại giữa Visha và Elya — ưu tiên “tớ – cậu” và “bọn mình” vì tự nhiên, sinh động và tách biệt rõ lời thoại trực tiếp với đại từ phản thân “mình” trong tự sự) / *…Tôi không nên nghĩ sâu quá làm gì.* (thay cho `*…Mình không nên nghĩ sâu quá làm gì.*` tại câu 3 p000202 — ưu tiên dùng “Mình” cho câu tự nhủ thầm được đánh dấu in nghiêng trong đầu Visha)
