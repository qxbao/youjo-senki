  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“mình”), trần thuật ngôi thứ ba (“Tanya”), sự chuyển ngôi từ câu cầu khẩn hướng tới Schugel (“tôi – ngài”) sang nhận định nội tâm (“mình – vị tiến sĩ này”) tại p000091, câu nội tâm in nghiêng tại p000098, và xưng hô qua vô tuyến giữa Kỹ sư trưởng von Schugel với Tanya (“tôi – cô” / “tôi – Tiến sĩ von Schugel, ngài”)."
