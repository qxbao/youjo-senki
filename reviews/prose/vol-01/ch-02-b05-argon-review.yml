- id: ch02-b05-tanya-pronouns-apostrophe-shift-and-schugel-radio-clash
  source_term: Tanya first-person interior monologue and third-person narration pronouns, apostrophe address to Dr. von Schugel in p000091 sentence 1 shifting back to first-person monologue in sentence 2, italicized inner scream in p000098, and heated radio dialogue pronouns between Dr. von Schugel and Tanya
  proposed_vi: trong các đoạn/mệnh đề độc thoại nội tâm ngôi thứ nhất của Tanya (p000084, p000085, p000087, p000090, p000091, p000097, p000098, p000100, p000102–p000104), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” theo đúng DEC-P01-001; trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể nội tâm tự tách góc nhìn đối với danh tính bên ngoài (p000083, p000089), dùng tên riêng “Tanya” theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01 → ch02-b04 (tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm về Tanya; lưu ý từ “nó” tại p000083 quy chiếu vật không thể kiểm soát, tại p000084 quy chiếu quả cầu tính toán nguyên mẫu, tại p000085 quy chiếu nguyên mẫu ở câu 1 và việc sử dụng quả cầu ở câu 2, và tại p000090 quy chiếu hệ thống đồng bộ hóa bốn lõi; tại p000086 và câu cuối p000091 dùng cấu trúc phiếm chỉ/khái quát “Người ta” hoặc lược chủ ngữ đại từ khái quát); tại p000091, bảo toàn chính xác sự chuyển ngôi trong văn bản nguồn khi câu 1 là lời cầu khẩn trực tiếp trong tâm tưởng hướng tới Tiến sĩ von Schugel dùng cặp đại từ “tôi – ngài”, sang câu 2 chuyển về độc thoại nội tâm tự quy chiếu bằng “mình” và gọi ngôi thứ ba là “vị tiến sĩ này”; trong lời kể/nội tâm (p000087, p000090, p000091, p000097, p000098), quy chiếu Adelheid von Schugel bằng “vị kỹ sư trưởng”, “vị tiến sĩ này”, “người đàn ông này”, “cái gã này”, “gã lập dị cuồng công nghệ đó” và đại từ ngôi thứ ba “ông ta” (đồng bộ ch-02-b04); trong giao tiếp qua vô tuyến (p000088, p000092, p000094–p000096, p000099), Schugel tự xưng “tôi” và gọi Tanya bằng đại từ ngôi thứ hai “cô” / “Cô” (p000088, p000094, p000096 — đồng bộ ch-02-b04), còn Tanya tự xưng “tôi”, gọi Schugel là “Tiến sĩ von Schugel” và dùng đại từ ngôi thứ hai lịch sự “ngài” (p000092, p000095, p000099); tại câu nội tâm in nghiêng mà Tanya muốn hét lên ở cuối p000098, bảo toàn chính xác `*...*` theo DEC-P01-002 và dùng “các người” hướng về phía bộ máy quản trị nhân sự của Đế quốc (đồng bộ ch-02-b04 p000080)
  alternatives_vi:
  - ông (thay cho “ngài” khi Tanya gọi Tiến sĩ von Schugel trong lời thoại qua vô tuyến và câu cầu khẩn nội tâm tại p000091, p000092, p000095 — ưu tiên “ngài” để đồng bộ hoàn toàn với ch-02-b04 p000071 và giữ sự tương phản giữa nghi thức lịch sự bề ngoài của Tanya với cơn gào thét trẻ con của Schugel)
