- id: ch05-b08-uger-to-tanya-pov-shift-pronouns-modality-and-four-emphases
  source_term: uger_to_tanya_pov_shift_pronouns_modality_and_four_emphases_ch05_b08
  proposed_vi: 'Toàn bộ 35 đoạn của lô ch-05-b08 (chapter011.xhtml/p000161–p000195) gồm hai phân cảnh nối tiếp qua ngắt cảnh (`class="space-break1"` tại p000191) tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân cảnh 1 — Mạch tự sự ngôi thứ nhất của Đại úy Uger và đối thoại tại Quán cà phê Zolka (p000161–p000190): tiếp nối trực tiếp ch-05-b07 (p000160), tuyệt đối không áp dụng quy ước “nó” / “mình” của Tanya cho điểm nhìn của Uger (từ “nó” duy nhất xuất hiện ở câu 2 p000172 hoàn toàn chỉ quy chiếu danh từ sự vật là “cuộc chiến này”); trong lời kể và độc thoại suy nghĩ ngôi thứ nhất (p000161, p000163, p000166, p000168, p000169, p000171, p000174, p000178, p000181, p000185, p000186, p000188), Đại úy Uger tự xưng nhất quán là “tôi” / “Tôi” kết hợp đại từ phản thân “mình” / “Bản thân tôi”, dùng “chúng tôi” / “Chúng tôi” khi nói gộp bản thân với Tanya (p000171, p000185) hoặc với các chiến hữu (p000178), và quy chiếu Trung úy Tanya Degurechaff nhất quán bằng “cô ấy” / “Cô ấy”, “Trung úy Degurechaff” (p000169) và “Đứa trẻ mười một tuổi này” (p000181); trong đối thoại, Đại úy Uger (p000164, p000167, p000168, p000172, p000175, p000177, p000180, p000183, p000187, p000190) tự xưng “tôi” / “Tôi”, gọi Tanya là “cô” và dùng “chúng ta” (p000172, p000190), còn Trung úy Tanya Degurechaff (p000162, p000165, p000170, p000173, p000176, p000179, p000182, p000184, p000189) tự xưng “Tôi” / “tôi” (và “chúng ta” khi mời ăn trưa ở p000189), gọi Uger là “Thưa Đại úy” / “Đại úy” và đại từ ngôi thứ hai lịch sự “anh” / “Anh”, dùng tiểu từ kính ngữ “ạ” ở các câu hỏi thăm, chúc mừng và mời dùng bữa xã giao (p000162, p000165, p000189) đồng bộ hoàn toàn với ch-05-b06 và ch-05-b07. (2) Phân cảnh 2 — Chuyển về độc thoại nội tâm ngôi thứ nhất của Tanya sau `space-break1` (p000191–p000195): áp dụng nghiêm ngặt DEC-P01-001, dùng đại từ tự quy chiếu nội tâm “mình” / “Mình” xuyên suốt cả 5 đoạn (tuyệt đối không dùng “tôi”); quy chiếu Đại úy Uger ở ngôi thứ ba bằng “Đại úy Uger” và “anh ta” kết hợp phản thân “mình” (p000191, p000192, p000195 — đồng bộ ch-04-b17, ch-04-b22); và chuyển đại từ ngôi thứ hai phiếm chỉ ở câu 2 p000192 thành kết cấu danh động từ không đại từ (“chuyện thuyết phục khi đối phương đang yếu lòng”) theo đúng quy ước direct-address choice (pending-terms.yml). (3) Bảo toàn chính xác toàn bộ các cấu trúc phủ định, câu hỏi, so sánh đối chiếu và giả định/khả thể theo đúng canon/style-guide.md: suy đoán chắc chắn quá khứ ở p000163 (“Hẳn cô ấy đã nhận ra điều gì đó từ nỗi trăn trở của tôi”), cấu trúc đối chiếu “không mấy xuất phát từ... mà đúng hơn là vì...” và so sánh giả định “Cứ như thể...” ở p000166 và p000171, câu hỏi gián tiếp về tương lai ở p000167 và câu hỏi đuôi ở p000168, khả thể ở p000173 (“thực ra lại có thể là một lợi thế đấy”), phủ định tuyệt đối và câu hỏi tu từ ở p000177–p000178, chuỗi phủ định thể hiện sự bế tắc của Uger ở p000181, suy đoán ở p000185 và câu điều kiện nhượng bộ ở p000186, cặp câu điều kiện tương lai đối lập ở p000193 (“Về sau sẽ có rắc rối nếu mình leo lên quá cao, nhưng nếu quân hàm quá thấp thì mình lại chẳng thể hành động tự do được”), cùng phủ định bộ phận ở p000194 (“Vận may sẽ không phải lúc nào cũng đứng về phía mình”). (4) Bảo toàn chính xác 4 cụm nhấn mạnh Markdown `*...*` trong đúng 3 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: 2 cụm tại p000174 (`*Hãy suy nghĩ về điều đó đi*` và `*Anh nên rời đi thì hơn.*`), 1 cụm ở đầu p000188 (`*Cô nói đúng.*` — đồng bộ từ vựng với câu thoại của Uger ở p000187), và 1 cụm kèm ký hiệu chú thích tại p000192 (`*von*¹⁹`), tuyệt đối không dùng dấu `*` ở 32/35 đoạn còn lại.'
  alternatives_vi:
  - việc bảo vệ lập luận của bạn khi đối phương đang yếu lòng (thay cho kết cấu danh động từ không đại từ “chuyện thuyết phục khi đối phương đang yếu lòng” tại câu 2 p000192 — ưu tiên kết cấu danh động từ không đại từ để tuân thủ nghiêm ngặt quy ước direct-address choice trong pending-terms.yml và giữ giọng độc thoại nội tâm sắc lạnh của Tanya)
