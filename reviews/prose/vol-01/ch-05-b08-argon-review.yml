  proposed_vi: kinh nghiệm thực chiến / khói súng / Thưa Đại úy / Đại úy / Trung úy Degurechaff / vu nữ / thần dụ / xin giải ngũ / bạn đồng học / hậu phương / bạn đồng khóa / chiến hữu / Bộ Tổng Tham mưu / học viện chiến tranh / sĩ quan Bộ Tổng Tham mưu / Đại úy Uger / lộ trình thăng tiến / vị trí ở tuyến sau / học viên / *von*¹⁹ / điểm đánh giá “ưu tú” / Hiệp sĩ Học viện Chiến tranh / giảng viên / tinh thần chiến đấu / Văn phòng Bộ Tổng Tham mưu / nhà ăn / hải quân
