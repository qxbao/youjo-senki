  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, chức danh và tên gọi tổ chức đã khóa tạm từ Chương 1–4 và ch-05-b01 → ch-05-b07: “kinh nghiệm thực chiến” (ch-04-b08 p000161, ch-05-b03 p000047: p000161) và “khói súng” (ch-04-b07 p000144, ch-04-b09 p000188: p000161); “Thưa Đại úy” / “Đại úy” / “Đại úy Uger” (ch-04-b22 p000259, ch-05-b06, ch-05-b07: p000162, p000170, p000176, p000179, p000191, p000192, p000195) và “Trung úy Degurechaff” (b06-first-lieutenant, ch-05-b06, ch-05-b07: p000169); “bạn đồng học” (ch-05-b06 p000126: p000176, p000185) và “bạn đồng khóa” (ch-05-b06 p000108: p000178); “hậu phương” (ch-04-b07, ch-04-b10: p000176); “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms, ch-04-b17, ch-05-b01: p000183, p000185, p000192), “sĩ quan Bộ Tổng Tham mưu” (ch-05-b01: p000185) và “Văn phòng Bộ Tổng Tham mưu” (ch-05-b01 p000001: p000195); “học viện chiến tranh” (ch-04-b01, ch-05-b06, ch-05-b07: p000185, p000192, p000193), “học viên” (p000192) và “giảng viên” (ch-04-b01, ch-04-b10: p000193); “lộ trình thăng tiến” (ch-04-b07 p000151: p000192); “điểm đánh giá “ưu tú”” (ch-04-b01 p000018, ch-04-b02 p000023: p000193); “tinh thần chiến đấu” (ch-04-b22 p000263, p000267: p000194); “nhà ăn” (ch-04-b01 p000006, ch-05-b06 p000105: p000195) và “hải quân” (ch-04-b01 p000006, ch-05-b07 p000141: p000195); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “vu nữ” và “thần dụ” (p000169), “xin giải ngũ” (p000170, p000173), “vị trí ở tuyến sau” và tiền tố quý tộc kèm ký hiệu chú thích “*von*¹⁹” (p000192), cùng danh hiệu “Hiệp sĩ Học viện Chiến tranh” (p000193 — đồng bộ trực tiếp với “Mười Hai Hiệp sĩ” ở ch-05-b07 p000128)."
  uncertainty: low
  status: pending
