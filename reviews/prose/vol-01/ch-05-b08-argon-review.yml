  volume: vol-01
  chapter: 5
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt cả hai phân cảnh của ch-05-b08: giữ đại từ tự sự “tôi” / “Tôi” – “mình” cho Đại úy Uger và quy chiếu Tanya bằng “cô ấy” / “Trung úy Degurechaff” ở p000161–p000190, chuyển sang đại từ tự quy chiếu nội tâm “mình” / “Mình” của Tanya và quy chiếu Đại úy Uger bằng “anh ta” sau ngắt cảnh `space-break1` ở p000191–p000195, xử lý đại từ ngôi thứ hai phiếm chỉ bằng kết cấu danh động từ không đại từ tại p000192 theo direct-address choice, bảo toàn đầy đủ các câu hỏi, cấu trúc phủ định/giả định/điều kiện và chính xác 4 cụm nhấn mạnh Markdown `*...*` trong 3 đoạn có `<html:em>` (p000174, p000188, p000192)."
