- id: ch03-b17-visha-first-person-pov-tanya-speech-pronouns-conditionals-and-single-emphasis
  source_term: visha_first_person_pov_tanya_speech_pronouns_conditionals_and_single_emphasis_ch03_b17
  proposed_vi: 'tiếp nối trực tiếp Phân cảnh 2 ở cuối lô ch-03-b16 (p000347–p000348), toàn bộ 21 đoạn của lô ch-03-b17 (chapter007.xhtml/p000349–p000369) diễn ra dưới điểm nhìn tự sự ngôi thứ nhất của Hạ sĩ Viktoriya Ivanovna Serebryakov (Visha) trong buổi điểm danh ra mắt trung đội và đợt đánh giá kỹ năng thực chiến ngoài chiến hào, tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của Visha), DEC-P01-002 và style-guide.md: (1) Trong mạch tự sự ngôi thứ nhất của Visha (p000349–p000354, p000357, p000359, p000360, p000362–p000365, p000367–p000369), Visha tự xưng “tôi” / “Tôi” kết hợp phản thân “mình” (p000349, p000350, p000352–p000354, p000357, p000359, p000360, p000362, p000365), và dùng đại từ ngôi thứ nhất số nhiều “chúng tôi” / “Chúng tôi” kết hợp phản thân “mình” khi gộp nhóm ba tân binh mới về trung đội hoặc đơn vị tại mặt trận Rhine (p000349, p000350, p000352, p000353, p000359, p000367, p000368); dưới góc nhìn của người lính cấp dưới đối với vị trung đội trưởng trực tiếp, quy chiếu Thiếu úy Tanya Degurechaff ở ngôi thứ ba nhất quán bằng “Thiếu úy Degurechaff” / “vị thiếu úy” và đại từ “cô ấy” / “Cô ấy” kết hợp phản thân “mình” (p000349–p000353, p000360, p000364, p000365, p000367, p000369 — đồng bộ hoàn toàn với ch-03-b16 p000347–p000348); quy chiếu đại đội trưởng (Trung úy Schwarkopf) bằng “đại đội trưởng” (p000349, p000367, p000369), quy chiếu người bạn khóa huấn luyện bằng tên riêng “Elya” (p000351, p000357), quy chiếu phía quân đội ở p000353 bằng “họ”, và quy chiếu hai đồng đội tình nguyện Hạ sĩ Kurst von Walhorf cùng Hạ sĩ Harald von Vist bằng “họ”, “hai anh chàng từng có kinh nghiệm phối hợp với nhau kia”, “hai người đó” và “cặp đôi ấy” (p000357, p000359, p000369 — đặc biệt ở câu 2 p000369 phân biệt rõ chủ ngữ “họ” là đại đội trưởng và vị thiếu úy với tân ngữ “hai người đó” và chủ ngữ bị động “cặp đôi ấy” là Kurst và Harald để tránh mọi mơ hồ quy chiếu); ở câu cảm thán cuối p000357 hướng tới “Thượng đế” (review-God), gọi bằng “ngài” và tự xưng “tôi” (“Ôi, Thượng đế ơi, sao ngài cứ phải hành hạ tôi thế này?”); tại câu 1 p000359 có đại từ ngôi thứ hai phiếm chỉ trong nguồn, lược bỏ đại từ phiếm chỉ bằng cấu trúc trung tính (“Có thể nói là tôi cảm thấy hơi lạc lõng...”) theo đúng direct-address choice (pending-terms.yml). (2) Trong lời thoại trực tiếp: ba câu báo cáo điều lệnh của Hạ sĩ Kurst von Walhorf (p000355), Hạ sĩ Harald von Vist (p000356) và Hạ sĩ Viktoriya Ivanovna Serebryakov (p000358) giữ nguyên cấu trúc danh ngữ điều lệnh ngắn gọn và bảo toàn sự tương phản dấu câu cuối lời báo cáo giữa dấu chấm than dõng dạc của hai lính tình nguyện (`!`) với dấu chấm trầm xuống của Visha (`.`); khi khích lệ Visha ở p000361, Thiếu úy Tanya Degurechaff tự xưng “Tôi” và gọi cấp dưới là “cô” kết hợp phản thân “mình” đi kèm cấp bậc và họ tên đầy đủ “Hạ sĩ Viktoriya Ivanovna Serebryakov”; khi cảnh cáo hai nam hạ sĩ tình nguyện ở p000364 và p000366, Tanya tự xưng “tôi”, gọi họ ở ngôi thứ hai số nhiều là “mấy anh bạn” / “các anh” kết hợp phản thân “mình”, và nhắc tới Visha cùng bản thân là “Hạ sĩ Serebryakov và tôi”. (3) Bảo toàn nguyên vẹn câu hỏi than thở nội tâm ở cuối p000357, cấu trúc tăng tiến phủ định “chẳng những không... mà còn...” giữ cùng một chủ thể (“Chúng tôi” / “mình”) ở câu 2 p000368 theo style-guide.md, dấu ngoặc kép mang sắc thái châm biếm quanh “quà chuyển phát” (p000367) và “chỉnh đốn” (p000369), cùng chính xác thời gian, mức độ chắc chắn của các cấu trúc phủ định, so sánh giả định, khả thể và điều kiện (phủ định ở p000349, p000353, p000357, p000360, p000362, p000364, p000366, p000368, p000369; so sánh giả định và khả thể ở p000350; suy đoán phủ định ở p000352; giả định nhượng bộ ở p000353; điều kiện theo thông lệ ở p000359; ước muốn phủ định ở p000360; mệnh lệnh cảnh cáo phủ định và giả định hệ quả ở p000364; điều kiện giả định trái thực tế đối lập với thực tại và điều kiện mệnh lệnh ở p000366; suy đoán quá khứ và nhượng bộ ở p000367). (4) Bảo toàn chính xác 1 vị trí nhấn mạnh Markdown `*thẳng tay*` tại p000369 tương ứng với thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô theo đúng DEC-P01-002 (20/21 đoạn còn lại từ p000349 đến p000368 không có thẻ `<html:em>` hay `<html:i>` nên hoàn toàn không dùng dấu `*`)'
  alternatives_vi:
  - cô (thay cho “cô ấy” khi Visha quy chiếu Thiếu úy Degurechaff trong mạch tự sự ngôi thứ nhất — ưu tiên “cô ấy” để đồng bộ hoàn toàn với ch-03-b16 p000347–p000348) / các cậu (thay cho “các anh” khi Thiếu úy Degurechaff nói với hai nam hạ sĩ tình nguyện Kurst và Harald tại p000364, p000366 — ưu tiên “các anh” để giữ đúng khoảng cách công vụ lạnh lùng, sắc lẹm của sĩ quan chỉ huy trong quân đội Đế quốc)
