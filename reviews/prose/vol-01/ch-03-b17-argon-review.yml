  rationale: "Kế thừa đồng bộ “đại đội trưởng” (ch-03-b11 p000232, ch-03-b15 p000319), “Thiếu úy Degurechaff” / “vị thiếu úy” (b02-second-lieutenant, ch-03-b11–b16), “Elya” (ch-03-b10 p000199–p000220), “át chủ bài” (ch-02-b02 p000018, ch-03-b11 p000227; mở rộng thành “át chủ bài kỳ cựu”), “huân chương” (ch-01-b15 p000270, ch-03-b11 p000229), “Huy hiệu Xung kích Cánh Bạc” (ch-01-b17, ch-03-b08–b12), “như búp bê” (ch-01-b04 p000051), “mặt trận Rhine” (ch-03-b01 p000016, ch-03-b10 p000204), “ma cà rồng” (ch-03-b16 p000347), “giọng điệu điềm tĩnh, đậm chất công vụ” (P01-matter-of-fact-register, ch-03-b12 p000249), “Trường Thiếu sinh quân” (ch-03-b09 p000182, ch-03-b10 p000185, ch-03-b12 p000246, ch-03-b16 p000325, p000348), “học viên” (ch-03-b16 p000348), “pháp sư”, “sĩ quan”, “học viện” (ch-03-b11 p000225, ch-03-b16 p000330), “trung đội” / “trung đội trưởng” (ch-03-b11–b16), “tinh nhuệ” (ch-01-b03 p000032, ch-02-b10 p000097), cấp bậc “Hạ sĩ” và tên chuẩn “Viktoriya Ivanovna Serebryakov” (ch-03-b09 p000180), “Thượng đế” (review-God), “ý chí tự do” (ch-01-b13 p000222, ch-02-b13 p000143, ch-03-b16 p000340), “Đế quốc”, “bất tài” (ch-03-b11 p000226, ch-03-b16 p000330), “các trung sĩ huấn luyện” (ch-03-b10 p000185), “lính Đế quốc” (ch-03-b10 p000191), “quân phục” (ch-03-b16 p000348), “tổ quốc” (ch-03-b10 p000189, ch-03-b14 p000295), “tân binh” (ch-03-b11 p000226), “chiến hào” (ch-03-b14–b15), “Quân đội Cộng hòa” (ch-03-b05 p000090, vol-04-ch-04-b04) cùng “tiền tuyến” và “tuyến sau” (ch-03-b01 p000018, ch-03-b11 p000222); khóa tạm “đôi mắt lạnh băng” và “những món đồ đang chờ được định giá” (p000350), “chiến công xuất sắc” và “bầu không khí chiến trường đặc quánh” (p000351), “lính tình nguyện”, “lính nghĩa vụ”, “Tiểu đoàn C”, “Tiểu đoàn D” và “nghĩa vụ quân sự bắt buộc” (p000353, p000354, p000357, p000359, p000360), danh xưng “Hạ sĩ Kurst von Walhorf” và “Hạ sĩ Harald von Vist” cùng phiên hiệu “Đại đội 1, Tiểu đoàn C Idal-Stein” và “Đại đội 3, Tiểu đoàn D Idal-Stein” (p000355, p000356, p000358), “bị gọi nhập ngũ” (p000357), “lập thành một cặp” và “ghép cặp” (p000359), “đôi mắt hiếu chiến” (p000362), “nuôi báo cô” và “ứng viên sĩ quan bất tài” (p000364), “Hệ giá trị” và “được nhồi sọ vào đầu tôi” (p000365), “những đợt “quà chuyển phát” định kỳ” (p000367), cùng ““chỉnh đốn”” và “kỷ luật thẳng tay — từ khóa ở đây là *thẳng tay*” (p000369)."
