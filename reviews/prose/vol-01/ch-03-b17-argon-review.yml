  proposed_vi: đại đội trưởng / Thiếu úy Degurechaff / vị thiếu úy / đôi mắt lạnh băng / những món đồ đang chờ được định giá / Elya / át chủ bài kỳ cựu / huân chương / chiến công xuất sắc / Huy hiệu Xung kích Cánh Bạc / bầu không khí chiến trường đặc quánh / như búp bê / mặt trận Rhine / ma cà rồng / giọng điệu điềm tĩnh, đậm chất công vụ / Trường Thiếu sinh quân / học viên / lính tình nguyện / lính nghĩa vụ / pháp sư / Tiểu đoàn C / sĩ quan / học viện / Tiểu đoàn D / nghĩa vụ quân sự bắt buộc / trung đội / phần tử tinh nhuệ / Hạ sĩ Kurst von Walhorf / Hạ sĩ Harald von Vist / Đại đội 1, Tiểu đoàn C Idal-Stein / bị gọi nhập ngũ / Thượng đế / Hạ sĩ Viktoriya Ivanovna Serebryakov / Hạ sĩ Serebryakov / Đại đội 3, Tiểu đoàn D Idal-Stein / đại đội / lập thành một cặp / ghép cặp / trung đội trưởng / đôi mắt hiếu chiến / ý chí tự do / Đế quốc / nuôi báo cô / ứng viên sĩ quan bất tài / các trung sĩ huấn luyện / lính Đế quốc / Hệ giá trị / nhồi sọ / quân phục của tổ quốc / tân binh / chiến hào / những đợt “quà chuyển phát” định kỳ / Quân đội Cộng hòa / “chỉnh đốn” / kỷ luật thẳng tay — từ khóa ở đây là *thẳng tay* / tiền tuyến / tuyến sau
  alternatives_vi:
  - đôi mắt lạnh giá như băng và những vật thể đem ra thẩm định (thay cho “đôi mắt lạnh băng” và “những món đồ đang chờ được định giá” tại p000350) / cống hiến xuất sắc và hơi thở chiến trận nồng đậm (thay cho “chiến công xuất sắc” và “bầu không khí chiến trường đặc quánh” tại p000351) / thời hạn phục vụ bắt buộc (thay cho “nghĩa vụ quân sự bắt buộc” tại p000353) / những học viên ưu tú (thay cho “những phần tử tinh nhuệ” tại p000354) / Tiểu đoàn C Idal-Stein, Đại đội 1 và Tiểu đoàn D Idal-Stein, Đại đội 3 (thay cho “Đại đội 1, Tiểu đoàn C Idal-Stein” tại p000355–p000356 và “Đại đội 3, Tiểu đoàn D Idal-Stein” tại p000358 — ưu tiên trật tự từ đơn vị nhỏ đến lớn theo chuẩn phiên hiệu tiếng Việt) / đi nghĩa vụ hoặc tân binh nghĩa vụ (thay cho “bị gọi nhập ngũ” tại p000357 và “lính nghĩa vụ” tại p000360) / làm đồng đội bắt cặp với nhau (thay cho “lập thành một cặp” / “ghép cặp” tại p000359) / đôi mắt sặc mùi chiến tranh (thay cho “đôi mắt hiếu chiến” tại p000362) / bao nuôi hoặc chu cấp và học viên dự nguồn sĩ quan (thay cho “nuôi báo cô” và “ứng viên sĩ quan” tại p000364) / Quan niệm giá trị và được rèn giũa đóng đinh vào đầu tôi (thay cho “Hệ giá trị” và “được nhồi sọ vào đầu tôi” tại p000365) / những kiện hàng “giao tận nơi” định kỳ (thay cho “những đợt “quà chuyển phát” định kỳ” tại p000367) / “uốn nắn”, trực tiếp — từ khóa ở đây là *trực tiếp* hoặc ngay tại chỗ — từ khóa ở đây là *ngay tại chỗ*, và hậu phương (thay cho ““chỉnh đốn””, “thẳng tay — từ khóa ở đây là *thẳng tay*” và “tuyến sau” tại p000369)
