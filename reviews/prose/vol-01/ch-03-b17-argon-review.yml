  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md xuyên suốt 21 đoạn tự sự ngôi thứ nhất của Visha: giữ đại từ “tôi” / “chúng tôi” cho Visha và nhóm tân binh, quy chiếu Thiếu úy Degurechaff bằng “cô ấy” / “Cô ấy” theo đúng giới hạn chủ thể của DEC-P01-001, giữ xưng hô quân ngũ chuẩn mực trong lời thoại của Tanya (“Tôi – cô” với Visha ở p000361; “tôi – mấy anh bạn / các anh” với hai nam hạ sĩ tình nguyện ở p000364, p000366), xử lý đại từ ngôi thứ hai phiếm chỉ ở p000359 theo direct-address choice, phân biệt tường minh đại từ quy chiếu ở câu 2 p000369, bảo toàn cấu trúc tăng tiến “chẳng những không... mà còn...” cùng chủ thể ở p000368, các cấu trúc điều kiện/giả định/phủ định và duy nhất 1 vị trí nhấn mạnh `*thẳng tay*` tại p000369."
