  volume: vol-01
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md dưới điểm nhìn ngôi thứ ba của Trung tá von Lergen trên chuyến tàu ra mặt trận phía bắc: giữ đại từ “ông” / “Ông” kết hợp phản thân “mình” cho Lergen trong trần thuật và “mình” / “chúng ta” trong độc thoại nội tâm trực tiếp, giữ đại từ “ông” cho Chuẩn tướng von Zettour, đồng thời bảo toàn chính xác các câu hỏi thành tiếng/nội tâm/phản biện, các cấu trúc điều kiện/giả định/mức độ chắc chắn và cả 7 vị trí nhấn mạnh in nghiêng tại p000179, p000182, p000183, p000184, p000198, p000199 và p000200."
