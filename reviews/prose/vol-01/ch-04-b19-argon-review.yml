  proposed_vi: Trung tá von Lergen / Lergen / khoang hạng nhất / các quân nhân cấp cao / “Những dự đoán về hình thái và chiều hướng của cuộc chiến hiện tại.” / Phó cục trưởng Cục Quân vụ / Chuẩn tướng von Zettour / Zettour / học giả / lịch sử chiến tranh / Tướng von Rudersdorf / “Cuộc chiến hiện tại” / nhận thức chuyên môn / Bộ Tổng Tham mưu / chiến tranh toàn cầu / Những bài luận chiến lược / bài luận / ngoại tuyến / nội tuyến / chiến tranh thế giới / chiến lược nội tuyến / Đế quốc / xung đột toàn cầu / môi trường quốc phòng mong manh / quốc phòng / các cường quốc / vấn đề an ninh / mặt trận thống nhất / chiến lược bao vây ngoại tuyến / cán cân quyền lực / vòng vây / Vương quốc Ildoa / hiệp ước không xâm phạm / Liên bang Russy / Russy / một cuộc xung đột cục bộ bùng phát / Liên minh Entente / François / Cộng hòa François / Cộng hòa / vùng chiến sự đang diễn ra ác liệt / Khối Thịnh vượng chung / phản ứng dây chuyền / chủ nghĩa cộng sản / mặt trận thứ hai / quốc gia bá chủ / “chiến tranh tổng lực” / Chiến tranh tổng lực
