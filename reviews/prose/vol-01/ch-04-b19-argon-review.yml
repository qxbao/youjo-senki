  rationale: "Kế thừa đồng bộ danh xưng và thuật ngữ đã khóa tạm từ Chương 1–3 cùng ch-04-b01 → ch-04-b18: “Trung tá von Lergen” / “Lergen” (ch-04-b17 p000144–p000145, ch-04-b18, p000177–p000179, p000184, p000185, p000198), “Phó cục trưởng Cục Quân vụ” (ch-04-b11 p000233–p000234, ch-04-b16 p000102, p000178), “Chuẩn tướng von Zettour” / “Zettour” (ch-01-b19 p000034, ch-04-b16–b18, p000178, p000184), “học giả” (ch-01-b19 p000034, ch-04-b11 p000222, ch-04-b16 p000104, p000178, p000184), “Tướng von Rudersdorf” (ch-04-b18 p000148, p000150, p000179), “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms, p000184, p000185), cặp thuật ngữ “ngoại tuyến” và “nội tuyến” / “chiến lược nội tuyến” (vol02-ch02-b05-interior-lines / ch-01-b19 p000043, ch-03-b03 p000044, ch-03-b12 p000261, ch-04-b16 p000118, ch-04-b18 p000159, p000185, p000186, p000190, p000191), “chiến tranh thế giới” (ch-04-b12 p000016–p000021, ch-04-b16 p000121, ch-04-b17 p000125, p000186, p000198), “Đế quốc” (p000186, p000188–p000194, p000196, p000197), “quốc phòng” (ch-01-b19/b20, p000188), “các cường quốc” (ch-04-b12/b13, p000188, p000197), “vòng vây” (ch-01-b20 p000059, p000191), “Vương quốc Ildoa” và “Liên bang Russy” / “Russy” (ch-01-b20 p000046, ch-04-b13 p000031, p000192, p000196), “hiệp ước không xâm phạm” (vol-02-ch-01-b03, vol-03-ch-04-b14, p000192, p000196), “Liên minh Entente” (ch-01-b20 p000046, p000193, p000196, p000197), “François” / “Cộng hòa François” / “Cộng hòa” (ch-01-b20 p000046, ch-03-b12 p000260, ch-04-b12/b13, p000193, p000194, p000196, p000197), “Khối Thịnh vượng chung” (ch-01-b03 p000034, ch-04-b13 p000031, ch-04-b16 p000121, p000194), “quốc gia bá chủ” (ch04-b13-dominant-state-foreign-intervention-lend-lease-and-individualism-terms / ch-04-b13 p000034, p000035, p000040, p000197), “chiến tranh tổng lực” (vol02-ch02-b06-total-war / ch-04-b14 p000077, ch-04-b15 p000079, ch-04-b16 p000121, p000199, p000200), và “bài luận” (ch-04-b04 p000060, ch-04-b18 p000175, p000185, p000201); khóa tạm “khoang hạng nhất”, “các quân nhân cấp cao” và tiêu đề “Những dự đoán về hình thái và chiều hướng của cuộc chiến hiện tại.” (đồng bộ từ vựng “hình thái” và “chiều hướng” với ch-04-b12 p000009 và ch-04-b16 p000120, đồng thời đồng bộ cụm trích dẫn “Cuộc chiến hiện tại” ở p000182), “lịch sử chiến tranh” (p000178), “nhận thức chuyên môn” (p000183), “chiến tranh toàn cầu” (p000184), “Những bài luận chiến lược” (p000185), “xung đột toàn cầu” (p000187), “môi trường quốc phòng mong manh” (p000188), “vấn đề an ninh” (p000189), “mặt trận thống nhất”, “chiến lược bao vây ngoại tuyến” và “cán cân quyền lực” (p000190, p000194), “một cuộc xung đột cục bộ bùng phát” (p000192), “vùng chiến sự đang diễn ra ác liệt” (p000193), “phản ứng dây chuyền” (p000195), cùng “chủ nghĩa cộng sản” và “mặt trận thứ hai” (p000196)."
