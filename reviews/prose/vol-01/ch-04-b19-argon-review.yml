- id: ch04-b19-lergen-pov-train-monologue-pronouns-conditionals-and-emphasis
  source_term: lergen_pov_train_monologue_pronouns_conditionals_and_emphasis_ch04_b19
  proposed_vi: 'tiếp nối trực tiếp ch-04-b18 (p000147–p000176) sau khoảng ngắt cảnh (class="space-break1" tại p000177), toàn bộ lô ch-04-b19 (chapter009b.xhtml/p000177–p000201) diễn ra dưới điểm nhìn ngôi thứ ba của Trung tá von Lergen trên chuyến tàu ra mặt trận phía bắc khi đọc bài luận của Chuẩn tướng von Zettour, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Trong trần thuật ngôi thứ ba (p000177–p000180, p000182–p000186, p000195, p000198, p000199, p000201), quy chiếu Trung tá von Lergen nhất quán bằng danh xưng “Trung tá von Lergen” / “Lergen” và đại từ trang trọng “ông” / “Ông” kết hợp phản thân “mình” (đồng bộ hoàn toàn với ch-01-b15/b18, ch-04-b02/b04/b05 và ch-04-b17/b18; lưu ý từ “nó” ở p000179 chỉ quy chiếu bài viết, từ “nó” ở cuối p000186 chỉ quy chiếu danh từ bất động vật là “chiến lược nội tuyến”, và tại p000191–p000192 lặp lại danh xưng “Đế quốc” kết hợp phản thân “mình” thay vì dùng “nó” để tránh mọi nguy cơ nhập nhằng với quy ước đại từ của Tanya); quy chiếu Chuẩn tướng von Zettour bằng “Phó cục trưởng Cục Quân vụ, Chuẩn tướng von Zettour” / “Zettour” / “Vị sĩ quan mang phong thái học giả nhưng đầy thực tế ấy” và đại từ “ông” (p000178, p000184); quy chiếu Tướng von Rudersdorf bằng “Tướng von Rudersdorf” (p000179); quy chiếu tập thể Bộ Tổng Tham mưu, những người phụ trách quốc phòng của Đế quốc hoặc các quốc gia/cường quốc bên ngoài bằng đại từ số nhiều “họ” (p000184, p000188, p000189, p000194, p000197). (2) Trong các câu độc thoại nội tâm trực tiếp được đánh dấu `<html:em>` của Lergen (p000179, p000182–p000184, p000198–p000200), dùng đại từ tự quy chiếu ngôi thứ nhất số ít “mình” (p000179 — đồng bộ ch-04-b04 p000083) và đại từ gộp ngôi thứ nhất số nhiều “chúng ta” khi Lergen nghĩ về phía Đế quốc (p000199). (3) Bảo toàn nguyên vẹn đối tượng và độ mở của tất cả các câu hỏi thành tiếng kèm dấu chấm lửng (p000181, p000187), chuỗi 3 câu hỏi nội tâm trực tiếp (p000182) và các câu hỏi phản biện / giả định bỏ lửng trong dòng suy luận chiến lược (p000193, p000197), cùng suy đoán khả thể ở p000179, so sánh giả định ở p000180, điều kiện trái thực tế ở hiện tại tại câu 6 p000184 (“Giá như có thể cười xòa cho qua chuyện này thì ông sẽ hạnh phúc biết bao”), câu điều kiện giả định ở p000186 và p000193, giả định hệ quả ở p000188, giả định theo lẽ thường ở p000192, sự phân biệt mức độ chắc chắn giữa “có lẽ” và “hoàn toàn có khả năng” ở p000194, phủ định khả năng bác bỏ ở p000195 và nhận định khả thể ở p000197. (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở cả 7 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo đúng DEC-P01-002: câu 1 p000179 (`*Vậy có lẽ bài viết nêu ra một luận điểm thú vị nào đó, và đó là lý do Tướng von Rudersdorf đã đọc rồi giới thiệu nó cho mình.*`), ba câu hỏi đầu p000182 (`*Đây là…? “Cuộc chiến hiện tại” ư? Khoan đã, một cuộc chiến kiểu này liệu có thể xảy ra được sao?*`), câu 1 p000183 (`*…Có thể đấy.*`), câu 5 p000184 (`*Thật lố bịch.*`), câu 2 p000198 (`*Chuyện đó hoàn toàn có thể xảy ra.*`), câu 1 p000199 (`*Và rồi, khi chúng ta tiến hành chiến tranh chống lại cả thế giới…*`) và toàn bộ đoạn định nghĩa p000200 (`*Chiến tranh tổng lực: khi một quốc gia thấy cần phải huy động toàn bộ sức mạnh của mình để đạt được mục tiêu trong cuộc chiến.*`), đồng thời không tự ý thêm bất kỳ dấu `*` nào ở 18/25 đoạn còn lại'
  alternatives_vi:
  - '*Thật phi lý.* hoặc *Thật điên rồ.* (thay cho “*Thật lố bịch.*” tại câu 5 p000184) / *Điều đó là có thể.* (thay cho “*Chuyện đó hoàn toàn có thể xảy ra.*” tại câu 2 p000198)'
