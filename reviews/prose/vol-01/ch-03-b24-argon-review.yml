- id: ch03-b24-tanya-pov-return-pronouns-schones-dialogue-modality-and-two-emphases
  source_term: tanya_pov_return_pronouns_schones_dialogue_modality_and_two_emphases_ch03_b24
  proposed_vi: 'Mở đầu phân cảnh mới sau khoảng ngắt cảnh (`class="space-break1"`) tại p000021, chuyển từ góc nhìn đơn vị pháp sư Cộng hòa ở ch-03-b23 (p000001–p000020) về lại điểm nhìn của Thiếu úy Tanya Degurechaff đang dẫn trung đội cứu viện (gồm Tanya, Hạ sĩ Serebryakov và tiểu đội của Trung sĩ Schones đã xuất kích ở cuối ch-03-b22 tại p000491–p000496) bay tới giải cứu quan sát viên pháo binh, toàn bộ 22 đoạn của lô ch-03-b24 (chapter007b.xhtml/p000021–p000042) tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Hệ đại từ trần thuật và độc thoại nội tâm của Tanya theo DEC-P01-001: trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000023, p000024, p000034, p000040–p000042), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” cho cá nhân Tanya (“tâm trí mình”, “mình có thể làm”, “trung đội mình”, “năng lực của mình”, “Mình vốn đã bực bội”, “Mình có nằm mơ cũng chẳng bao giờ ngờ...”) và dùng “chúng ta” khi bao gồm cả trung đội (p000023, p000041); trong trần thuật ngôi thứ ba về Tanya (p000022, p000027, p000029, p000042), giữ danh xưng “Thiếu úy Tanya Degurechaff” / “Tanya” kết hợp đại từ phản thân “mình” (“đang bay phía sau mình” ở p000042) và lược từ sở hữu dư thừa trong thành ngữ “lập tức quay gót trở về căn cứ” (p000029), tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” cho Tanya; bảo toàn sự chuyển dịch điểm nhìn đặc trưng trong nguyên tác giữa ngôi thứ nhất nội tâm của Tanya (“mình”) và ngôi thứ ba số nhiều quy chiếu trung đội (“Họ” / “họ” kết hợp phản thân “mình” ở p000024, p000027, p000029, p000033, p000034, p000037, p000038, p000041); quy chiếu người pháp sư quan sát viên bị bắn hạ bằng “anh ta” (p000027 — đồng bộ ch-03-b21 p000455, ch-03-b22 p000460); quy chiếu “Hạ sĩ Serebryakov” ở ngôi thứ ba nhất quán bằng “cô ấy” / “Cô ấy” kết hợp phản thân “mình” (p000042 — đồng bộ ch-03-b20 p000423); quy chiếu quân địch trong lời nói/nội tâm của Tanya bằng “bọn chúng” (p000032, p000040); và chuyển đại từ ngôi thứ hai phiếm chỉ ở vế cuối câu 4 p000041 thành cấu trúc khái quát kết hợp “mình” (“nhưng đúng là ở đời chẳng biết lúc nào vận may lại mỉm cười với mình”) theo đúng quy ước direct-address choice (pending-terms.yml). (2) Hệ xưng hô trong hội thoại quân sự: thông báo vô tuyến từ Trung tâm Điều hành Tác chiến (p000021) hô khẩu lệnh “Toàn thể các đơn vị”, tự xưng “Tôi” (“Tôi nhắc lại”) và dùng “chúng ta”; Thiếu úy Tanya Degurechaff (p000022, p000025, p000028, p000030, p000032, p000036, p000039) lẩm bẩm mỉa mai “Hay thật đấy.” (p000022), tự xưng “Tôi” (p000030, p000039), dùng đại từ gộp “chúng ta” cho toàn trung đội (p000025, p000028, p000030), gọi các thành viên dưới quyền là “mọi người” / “các anh” (p000025, p000039), và khi trao đổi trực tiếp với hạ sĩ quan đi phối thuộc là Trung sĩ Schones thì gọi “Trung sĩ Schones” / “anh” (“ý kiến của anh” ở p000028 — đồng bộ ch-03-b22 p000495); Trung sĩ Schones (p000026) khi đặt câu hỏi cảnh báo với Tanya thì thưa “Thưa Thiếu úy Degurechaff” (đồng bộ ch-03-b22 p000496). (3) Bảo toàn trọn vẹn các cấu trúc giả định, điều kiện, phủ định và câu hỏi nội tâm theo đúng canon/style-guide.md: giả định trái thực tế trong quá khứ `*Giá mà chúng ta xuất kích sớm hơn một chút hoặc muộn hơn một chút thôi*` (p000023); tình thế tiến thoái lưỡng nan và thành ngữ đối xứng “chỉ toàn nhọc xác mà chẳng được tích sự gì” (p000024); câu hỏi phủ định cảnh báo ở p000026; câu điều kiện ở cuối p000027; giả định trái thực tế “Ngay cả Tanya cũng sẽ lập tức quay gót trở về căn cứ nếu giữa hai bên có đủ khoảng cách” và sự so sánh lựa chọn chiến thuật ở p000029; hai vế phủ định ở p000030; các mức độ phỏng đoán (“có lẽ là...”, “Chắc hẳn...”) và câu điều kiện giả định ở cuối p000033 (“Nếu pháo binh đến kịp vị trí của họ, một đợt pháo kích dọn dẹp chiến trường hoàn toàn có thể được thu xếp”); mệnh đề nhượng bộ - phủ định ở câu 1 và phủ định kép khẳng định cơ hội “không hề mong manh” ở câu 3 p000034; điều kiện giả định “Giả sử quân số ngang nhau, cán cân vẫn sẽ nghiêng hẳn về phía Đế quốc” ở p000035; phép đối lập “Một chọi sáu... nhưng một chọi một...” và câu điều kiện - phủ định ở p000038; dấu gạch ngang dài (—) và sự hồi đáp trực tiếp tình tiết Tanya định lấy cớ đồng đội bắt cặp kiệt sức để từ chối nhiệm vụ ở p000041; cùng giả định phủ định (“Mình có nằm mơ cũng chẳng bao giờ ngờ rằng...”) và ba câu hỏi nội tâm liên tiếp giữ nguyên đối tượng và độ mở ở p000042 (“Là vì tinh thần trách nhiệm ư? Lòng yêu nước? Hay tình cảm dành cho đồng đội bắt cặp của mình?”). (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 2 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: mệnh đề giả định mở đầu câu ở p000023 (`*Giá mà chúng ta xuất kích sớm hơn một chút hoặc muộn hơn một chút thôi*`, giữ phần câu dẫn “ là lời than vãn thoáng qua trong tâm trí mình.” nằm ngoài dấu `*`) và cụm từ nối mở đầu câu 1 ở p000042 (`*Dù sao thì*`, giữ toàn bộ phần còn lại của đoạn nằm ngoài dấu `*`), tuyệt đối không dùng dấu `*` ở 20/22 đoạn còn lại.'
  alternatives_vi:
  - Tuyệt thật đấy (thay cho “Hay thật đấy.” trong câu lẩm bẩm mỉa mai của Tanya tại p000022 — ưu tiên “Hay thật đấy.” vì tự nhiên và giàu sắc thái chán ngán mỉa mai khi nghe tin xấu) / chỉ chuốc lấy vất vả mà chẳng thu lại được gì (thay cho “chỉ toàn nhọc xác mà chẳng được tích sự gì” tại câu 3 p000024 — ưu tiên “chỉ toàn nhọc xác mà chẳng được tích sự gì” vì nhịp câu gọn, khẩu ngữ nội tâm sắc sảo đúng giọng Tanya)
