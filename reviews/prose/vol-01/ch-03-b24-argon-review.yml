  proposed_vi: Toàn thể các đơn vị / quan sát viên / Thiếu úy Tanya Degurechaff / xuất kích / Thưa Thiếu úy Degurechaff / trung đội / Trung sĩ Schones / đại đội trưởng / Trung tâm Điều hành Tác chiến / pháp sư / hai đại đội / truy kích / căn cứ / lực lượng thọc sâu / được trang bị để cơ động tầm xa / lực lượng tinh nhuệ / chọc thủng phòng tuyến của Đế quốc / các pháp sư Đế quốc / quân bạn / pháo binh / đợt pháo kích dọn dẹp chiến trường / chiến dịch càn quét / cấp trung đội / Quân đội Đế quốc / phía Cộng hòa / Đế quốc / hỏa lực yểm trợ / khẩu đội pháo binh / đạn mảnh / người đồng đội bắt cặp / đồng đội bắt cặp / cấp dưới / Hạ sĩ Serebryakov / hạ sĩ / lính trưng tập / bị cưỡng bức nhập ngũ / ngạch bậc / nguồn nhân lực
  alternatives_vi:
  - Trung tâm Điều phối Tác chiến hoặc Trung tâm Chỉ huy Tác chiến (thay cho “Trung tâm Điều hành Tác chiến” tại p000027 — ưu tiên “Trung tâm Điều hành Tác chiến” đồng bộ với ch-01-b06 p000098 và ch-01-b07 p000108) / quân đột nhập và được trang bị cho hành quân đường dài (thay cho “lực lượng thọc sâu” và “được trang bị để cơ động tầm xa” tại p000032 — ưu tiên “lực lượng thọc sâu” đồng bộ với “hai đại đội pháp sư địch đang thọc sâu” ở ch-03-b21 p000448 và “được trang bị để cơ động tầm xa” chuẩn thuật ngữ tác chiến không quân ma đạo) / đợt pháo kích truy quét (thay cho “đợt pháo kích dọn dẹp chiến trường” tại p000033) / chiến dịch truy quét (thay cho “chiến dịch càn quét” tại p000034 — ưu tiên “chiến dịch càn quét” chỉ hoạt động rải quân lùng diệt quan sát viên Đế quốc của hai đại đội pháp sư Cộng hòa ở ch-03-b23) / đạn ria hoặc đạn ghém (thay cho “đạn mảnh” tại p000041 — ưu tiên “đạn mảnh” chuẩn thuật ngữ pháo binh hiện đại) / cộng sự hoặc chiến hữu (thay cho “người đồng đội bắt cặp” / “đồng đội bắt cặp” tại p000041, p000042 — ưu tiên “đồng đội bắt cặp” đồng bộ với ch-03-b18 p000370 và ch-03-b22 p000468)
