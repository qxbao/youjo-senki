  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc và thuật ngữ quân sự – ma đạo đã khóa tạm từ Chương 1–2, ch-03-b01 → ch-03-b23 và Chương 4–5: “quan sát viên” (chapter1_b01_pending_terms, ch-03-b21–b23: p000021), “Thiếu úy Tanya Degurechaff” / “Thiếu úy Degurechaff” (b02-second-lieutenant, ch-03-b19 p000399, ch-03-b20 p000431, ch-03-b21, ch-03-b22: p000022, p000026), “xuất kích” (ch-03-b19 p000396, p000402: p000023), “trung đội” / “cấp trung đội” (p000026, p000029, p000034, p000036, p000039) và “đại đội” (p000027, p000032), “Trung sĩ Schones” (ch-03-b22 p000495: p000027, p000028) và “đại đội trưởng” (ch-03-b21 p000437: p000027), “Trung tâm Điều hành Tác chiến” (ch-01-b06 p000098, ch-01-b07 p000108: p000027), “truy kích” (ch-03-b21 p000437: p000027, p000029), “lực lượng tinh nhuệ” (ch-01-b03 p000043: p000033), “chọc thủng phòng tuyến” (ch-03-b18 p000381, ch-03-b23 p000002: p000033), “Đế quốc”, “các pháp sư Đế quốc” (ch-03-b22 p000498: p000033), “Quân đội Đế quốc” (b06-imperial-army: p000035) và “phía Cộng hòa” (p000035), “quân bạn” (ch-03-b02 p000027, ch-03-b04 p000059: p000033), “pháo binh” (p000033) và “khẩu đội pháo binh” (ch-01-b11 p000176, ch-03-b23 p000019: p000041), “người đồng đội bắt cặp” / “đồng đội bắt cặp” (ch-03-b18 p000370, ch-03-b22 p000468: p000041, p000042), “cấp dưới” và “Hạ sĩ Serebryakov” / “hạ sĩ” (ch-03-b17, ch-03-b20–b22: p000042), “lính trưng tập” / “bị cưỡng bức nhập ngũ” (ch-03-b09 p000185, ch-05-b06 p000127: p000042), cùng “nguồn nhân lực” (ch-01-b18 p000029, ch-02-b12 p000108, ch-03-b20 p000428, p000431, p000432: p000042); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “lực lượng thọc sâu” và “được trang bị để cơ động tầm xa” (p000032), “đợt pháo kích dọn dẹp chiến trường” (p000033), “chiến dịch càn quét” (p000034), “đạn mảnh” (p000041) và “ngạch bậc” (p000042)."
