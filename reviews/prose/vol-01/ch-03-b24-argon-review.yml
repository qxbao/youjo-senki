  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 22 đoạn của ch-03-b24: giữ đại từ tự quy chiếu nội tâm “mình” / “Mình” và danh xưng “Thiếu úy Tanya Degurechaff” / “Tanya” trong trần thuật ngôi thứ ba (tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” cho Tanya), quy chiếu Hạ sĩ Serebryakov bằng “cô ấy” / “Cô ấy”, giữ hệ xưng hô điều lệnh chuẩn xác giữa Thiếu úy Degurechaff, Trung sĩ Schones và trung đội, xử lý đại từ ngôi thứ hai phiếm chỉ tại p000041 theo direct-address choice, bảo toàn đầy đủ các câu hỏi nội tâm, cấu trúc giả định/điều kiện/phủ định và chính xác 2 vị trí nhấn mạnh `*...*` tại p000023 và p000042."
