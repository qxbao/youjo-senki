  source_term: Anson Sue, Darton, and Entente soldiers narration pronouns, dialogue address, and God reference
  proposed_vi: trần thuật quy chiếu Trung tá Anson Sue bằng tên “Sue” hoặc đại từ “anh”; trong đối thoại chỉ huy, Sue xưng “tôi” / “chúng ta” / “ta”, gọi Darton là “Darton” / “cậu”, gọi các trung đội và thuộc cấp là “các anh”; thuộc cấp gọi Sue là “Chỉ huy” / “Chỉ huy Sue” và xưng “tôi” / “chúng ta”; quy chiếu quân Đế quốc trong thoại và trần thuật chiến thuật bằng “chúng” (hoặc “họ” khi mô tả khách quan ở p000123); dịch danh xưng tôn giáo tại p000127–p000128 là “Chúa” / “Chúa ơi”
  alternatives_vi:
