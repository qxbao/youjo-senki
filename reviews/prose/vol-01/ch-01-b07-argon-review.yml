locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000101
  locks:
  - Giữ lời trích dẫn của “một phát ngôn viên Bộ Tổng Tham mưu Lục quân Đế quốc mà Sue đã đọc trên báo hai ngày trước”, các thuật ngữ “trạng thái sẵn sàng chiến tranh”, “chính phủ Liên minh Entente chỉ đang thực hiện chiến thuật ngoại giao bên miệng hố chiến tranh”, câu điều kiện phủ định “Ít nhất, Đế quốc sẽ không chơi trò nguy hiểm đến thế nếu chúng ta chưa sẵn sàng chấp nhận rủi ro chiến tranh.” và câu kết “Nhận xét ấy đã nói lên tất cả.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000102
  locks:
  - Giữ giả định quá khứ “Cùng lắm, hoạt động ngoại giao bên miệng hố chiến tranh của Liên minh Entente chỉ nên dừng ở việc để lộ dấu hiệu hoạt động quân sự gia tăng để thăm dò phản ứng của Đế quốc.”, hình ảnh so sánh “gương mặt nhăn nhó như vừa cắn phải thứ gì cực kỳ khó nuốt” và câu hỏi tu từ kết đoạn “Ai mà ngờ Liên minh Entente lại tiến hành những hoạt động quân sự có thể đem vận mệnh cả quốc gia ra đánh cược mà không chuẩn bị trước?”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000103
  locks:
  - Giữ cách xưng hô chỉ huy “Tôi – các anh – Chúng ta” và mệnh lệnh “Tôi không quan tâm các anh có dùng liên lạc tầm ngắn hay không. Đến nước này thì cứ nối máy thẳng với lực lượng mặt đất. Chúng ta sẽ giúp những đơn vị còn lại rút lui.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000104
  locks:
  - Giữ khẩu lệnh đáp ngắn gọn “Rõ.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000105
  locks:
