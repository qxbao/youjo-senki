  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, chức danh và tên riêng đã khóa tạm từ Chương 1–4, ch-05-b01 → ch-05-b05 và các tập sau: “học viện chiến tranh” (ch-04-b01 p000002, ch-05-b02 p000041, ch-05-b03 p000042, p000107, p000119), phân biệt rõ với “học viện quân sự” (ch-01-b02 p000026, ch-01-b15 p000283, p000109); “bạn đồng khóa” (ch-04-b17 p000142, ch-05-b03 p000042, p000108); “súng trường”, “quả cầu tính toán” (chapter1_b01_pending_terms / ch-04-b08 p000165, p000112) và “quân cảnh” (ch-01-b12 p000210, ch-04-b02 p000027, p000030, p000033, p000112); “Đại úy Uger” / “Đại úy” / “đại úy” (ch-04-b22 p000259, p000114, p000117, p000120, p000126) và “Trung úy Degurechaff” / “trung úy” (b06-first-lieutenant, ch-04-b08 p000162, p000163, p000115, p000118, p000125); “quân phục” và “thường phục” (p000118); “tờ *Londinium Times*” (vol-02-ch-03-b01 p000023, vol-02-ch-03-b02 p000056, p000119) và “*WTN*” (ch-05-b04, ch-05-b05, p000119); “pháp sư”, “Quân đội Đế quốc” (b06-imperial-army, p000121) và “Ace of Aces” (ch-04-b03 p000042, vol-02-ch-06-b16 p000493, p000121); “sĩ quan cấp trên” (ch-03-b21 p000452, ch-04-b11 p000220, p000126); đồng thời khóa tạm tiêu đề địa điểm viết hoa toàn bộ “PHỐ KLÜGEL, QUẬN 3, QUÁN CÀ PHÊ ZOLKA” (p000106), “chương trình học” (p000107), “Nhà thờ Thánh Gregorius” (p000112), “động tác chào kiểu nhà binh hoàn hảo” (p000115), “vật dụng cá nhân”, “ấn phẩm đặc biệt của *WTN*” và “các khu vực trung lập” (p000119), danh xưng dân sự “Cô Degurechaff” và “tình nguyện nhập ngũ” (p000122), “mặt nạ sắt” (p000125), “người bạn đồng học” (p000126), cùng “tố chất” và “bị trưng tập” (p000127)."
