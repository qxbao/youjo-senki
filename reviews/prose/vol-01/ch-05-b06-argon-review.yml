- id: ch05-b06-uger-first-person-pov-pronouns-counterfactuals-and-four-emphases
  source_term: uger_first_person_pov_pronouns_counterfactuals_and_four_emphases_ch05_b06
  proposed_vi: 'Mở đầu phân cảnh mới sau ngắt trang (`ns1:type="pagebreak"`) tại p000106, toàn bộ 22 đoạn của lô ch-05-b06 (chapter011.xhtml/p000106–p000127) dưới điểm nhìn tự sự ngôi thứ nhất của Đại úy Uger tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp dụng khi câu chuyện được kể từ điểm nhìn ngôi thứ nhất của Đại úy Uger; từ “nó” duy nhất xuất hiện ở câu 2 p000124 hoàn toàn chỉ quy chiếu danh từ bất động vật là “Câu hỏi thẳng thừng vừa rồi”), DEC-P01-002 và canon/style-guide.md: (1) Hệ đại từ tự sự và quy chiếu ngôi thứ ba: trong lời kể và suy nghĩ nội tâm (p000107–p000113, p000115, p000118, p000119, p000121, p000124–p000127), Đại úy Uger tự xưng nhất quán là “tôi” / “Tôi” kết hợp đại từ phản thân “mình”, dùng “chúng tôi” cho tập thể học viên học viện chiến tranh (p000119) và “hai chúng tôi” cho mình cùng Tanya (p000115); quy chiếu Trung úy Tanya Degurechaff nhất quán bằng “một cô bé” / “cô bé” / “Cô bé nhỏ nhắn này” khi miêu tả ngoại hình tuổi tác (p000112, p000121) và bằng “Trung úy Degurechaff” / “cô ấy” / “Cô ấy” xuyên suốt các đoạn còn lại (p000115, p000118, p000119, p000121, p000124–p000127 — đồng bộ với điểm nhìn ngôi thứ nhất của Chuẩn úy Laeken ở ch-04-b08 p000161–p000178); quy chiếu cha mẹ bằng “họ” (p000109), người quen bên quân cảnh bằng “anh ta” (p000113), người bồi bàn bằng “anh ta” (p000115), và dịch đại từ ngôi thứ hai phiếm chỉ ở cuối p000113 thành danh từ khái quát “khách” (“cho phép khách mang theo vũ khí bước vào”) theo quy ước direct-address choice. (2) Hệ xưng hô trong đối thoại giữa Đại úy Uger và Trung úy Tanya Degurechaff (p000114, p000116, p000117, p000120, p000122, p000123, p000126): Đại úy Uger (p000116, p000122, p000126) tự xưng “tôi”, gọi Tanya là “cô” và chuyển sang danh xưng dân sự “Cô Degurechaff” ở p000122 khi chủ động đặt câu hỏi với tư cách người cha / người bạn đồng học; Trung úy Tanya Degurechaff (p000114, p000117, p000120, p000123) khi chào và trò chuyện xã giao với Đại úy Uger (sĩ quan cấp trên một bậc nhưng đồng thời là bạn đồng khóa tại học viện chiến tranh) gọi “Đại úy Uger” / “Đại úy” và đại từ ngôi thứ hai lịch sự “anh” kèm tiểu từ kính ngữ “ạ” (p000114, p000117, p000120), và buột miệng thốt lên “Hả?” ở p000123 khi bất ngờ trước câu hỏi đường đột. (3) Bảo toàn chính xác toàn bộ các cấu trúc phủ định, suy đoán, nhượng bộ và điều kiện giả định trái thực tế: so sánh giả định và phủ định mức độ ở p000109 (“như thể chính họ mới là người làm được điều đó vậy”, “khó lòng xứng đáng”), suy đoán nguyên nhân và phủ định thời gian quá khứ ở p000111 (“Có lẽ chính việc vừa mới làm cha... mà trước đây tôi chưa từng mấy bận tâm”), điều kiện giả định trái thực tế ở câu 2 p000118 (“nếu bắt gặp cô ấy mặc thường phục, hẳn tôi sẽ chẳng thể nhận ra nổi”), phủ định kép và mức độ dè dặt ở p000119 (“chẳng có bất kỳ vật dụng cá nhân nào không phải do chính phủ cấp phát”, “Có chăng ta có thể tính cả...”, “Nhưng có lẽ hơi khiên cưỡng...”), mệnh đề nhượng bộ ở p000121 (“Dù tôi nghĩ cô ấy chẳng hề cố tình...”), phủ định tuyệt đối và dè dặt ở p000125 (“Có nằm mơ tôi cũng chẳng bao giờ ngờ rằng...”, “Có lẽ không nhiều, song dù nói ra điều này thì thật thất lễ...”), suy đoán chắc chắn ở p000126 (“hẳn cô phải có vô số lựa chọn”), và cả 3 cấu trúc điều kiện giả định trái thực tế liên tiếp ở p000127 (“Nếu cô ấy chẳng qua chỉ là một pháp sư có tài, các lựa chọn của cô ấy hẳn đã hạn hẹp hơn”, “sẽ chẳng có gì đáng ngạc nhiên cho lắm nếu cô ấy bị trưng tập bất chấp tuổi đời còn nhỏ”, “Nhưng nếu chỉ có vậy, cô ấy hẳn đã bị sử dụng như bao thứ vũ khí khác mà thôi”). (4) Bảo toàn chính xác 4 cụm nhấn mạnh Markdown `*...*` trong đoạn duy nhất có thẻ `<html:em>` là p000119 (`*Londinium Times*`, `*WTN*`, `*Londinium Times*`, `*WTN*`) theo đúng DEC-P01-002, tuyệt đối không dùng dấu `*` ở 21/22 đoạn còn lại.'
  alternatives_vi:
  - ngài hoặc ông (thay cho “anh” khi Trung úy Degurechaff chào Đại úy Uger tại p000114 — ưu tiên “Đại úy Uger... anh” kết hợp “Đại úy... ạ” ở p000117, p000120 vì vừa giữ đúng lễ tiết quân sự với cấp trên một bậc, vừa phù hợp với quan hệ bạn đồng khóa tại học viện chiến tranh) / Sao cơ ạ? (thay cho “Hả?” tại p000123 — ưu tiên “Hả?” để thể hiện phản xạ ngơ ngác tức thời khi Tanya bị hỏi bất ngờ, khớp với miêu tả “lộ vẻ bối rối” và “một nét gì đó giống con người” ở p000125)
