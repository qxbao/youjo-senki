locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000029
  locks:
  - Giữ các thuật ngữ “đồn an ninh”, “quỷ dữ”, “Liên minh Entente”, “chiến dịch xuyên biên giới quy mô lớn”, cùng các từ tình thái “hẳn” và “Có vẻ”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000030
  locks:
  - Giữ các thuật ngữ “Định hướng chính sách”, “Liên minh Entente”, “học thuyết”, “Quân đội Đế quốc”, “lời tuyên chiến”, cấu trúc tăng tiến “không chỉ Tanya mà cả những người trong Quân đội Đế quốc”, và câu hỏi nhấn mạnh `*Sao lại đúng lúc này?*` theo DEC-P01-002.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000031
  locks:
  - Giữ phần nhấn mạnh yêu sách `*Binh sĩ Đế quốc phải rút khỏi lãnh thổ nước chúng tôi trong vòng hai mươi bốn giờ.*` theo DEC-P01-002, cấp bậc khái quát “một sĩ quan cấp úy quèn”, thuật ngữ “giao chiến toàn diện” và hai tầng tình thái suy đoán “Có lẽ… nhưng có thể…”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000032
  locks:
  - Giữ cấu trúc điều kiện–khả năng ở câu đầu và hai câu hỏi nhấn mạnh `*Họ ngu ngốc thật sao?*`, `*Hay họ đã vạch ra kế hoạch vĩ đại nào đó để giành chiến thắng?*` theo DEC-P01-002.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000033
  locks:
  - Giữ các thuật ngữ “ý đồ hay mục tiêu”, “bộ máy hành chính và các tổ chức quân sự”, “đánh chặn lực lượng địch”, “tuyên truyền đối nội”, và cách lặp tên “Tanya” trong trần thuật ngôi thứ ba (không dùng đại từ “cô”).
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000034
  locks:
  - Giữ tên các chính thể “Liên bang”, “Liên minh Entente”, “Khối Thịnh vượng chung”, “Cộng hòa”, các cụm “hậu thuẫn”, “bước tiến tự sát”, “người trong quân đội”, và sắc thái suy đoán chắc chắn “hẳn / Hẳn”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000035
  locks:
  - Giữ phủ định “chẳng có cửa nào đối đầu trực diện với Đế quốc”, thuật ngữ “phân xử”, và cụm “các chính khách và nhà ngoại giao của hai bên đang đối đầu sẽ ngồi xuống dàn xếp”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000036
  locks:
  - Giữ mệnh đề xen trong dấu gạch ngang “—ngoại trừ Liên minh Entente, xem ra vậy—” và phạm vi nhấn mạnh “khiến tất cả mọi người đang sống trên đời trong thời đại này kinh ngạc”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000037
  locks:
  - Giữ lời tuyên bố trong ngoặc kép và tên lực lượng “Quân đội Liên minh Entente đang tiến quân”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000038
  locks:
  - Giữ từ trong ngoặc kép “gây sốc”, cụm “trong tâm thế không thể tin nổi”, cấu trúc phủ định bộ phận “không hoàn toàn nằm ngoài dự liệu” và sự bất ngờ trước việc sự kiện thực sự xảy ra.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000039
  locks:
  - Giữ tên riêng “Lergen”, cơ quan “Bộ Tổng Tham mưu Quân đội Đế quốc”, đại từ “Chúng ta / của chúng ta” trong lời trích dẫn hồi tưởng và cụm “các lãnh đạo quân đội”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000040
  locks:
