- segment_id: YS-LN01/Text/chapter003b.xhtml/p000129
  locks:
  - Giữ tên riêng “Tanya”, sự phân công nhiệm vụ rõ ràng giữa việc “dùng radio và bộ thiết bị quan sát để theo dõi các quả đạn rơi xuống”, “Kíp pháo binh tiếp nhận thông tin sẽ xử lý dữ liệu theo thời gian thực” và “Một nhân viên ở Norden Control đưa ra các mệnh lệnh chiến thuật”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000130
  locks:
  - Giữ đại từ tập thể “ta” và tự quy chiếu nội tâm “mình” theo DEC-P01-001, các thuật ngữ “pháo binh Đế quốc dùng đạn nổ trên không và bắn cho đạn cùng rơi trúng mục tiêu một lúc với trình độ đáng khen”, “cường quốc quân sự”, và cấu trúc tăng tiến ở câu kết “đến mức họ đã vượt qua niềm tin vào ưu thế hỏa lực để xem việc tuân theo ưu thế ấy như học thuyết được thừa nhận”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000131
  locks:
  - Giữ câu châm ngôn trong ngoặc kép “lưỡi lê không bao giờ nói dối, mà nguồn lực cũng vậy.”, danh hiệu “thần chiến tranh” của “Lục quân Đế quốc”, tên riêng “Tanya”, và phép so sánh mỉa mai “những vị thần tuyệt đối hơn hẳn một thực thể mờ ám nào đó tự tiện xưng mình là Thượng đế tối cao”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000132
  locks:
