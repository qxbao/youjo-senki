  source_term: Tanya interior monologue self-reference, third-person self-naming, collective Imperial army reference, and radio voice
  proposed_vi: giữ tên riêng “Tanya” khi câu mở đầu hoặc câu nhận định mang sắc thái tự quy chiếu ngôi thứ ba (p000129, p000131); độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng “mình” xuyên suốt (p000130, p000132, p000133, p000134, p000135, p000138, p000141, p000142); ngôi thứ nhất số nhiều chỉ phe Đế quốc / lực lượng pháp sư dùng “ta” / “phe ta” / “chúng ta” / “quân ta” / “Bọn pháp sư chúng ta” (p000130, p000132, p000134, p000135, p000138, p000141); thoại vô tuyến của Fairy 08 và Norden Control lược đại từ nhân xưng, xưng hô bằng hô hiệu công vụ ngắn gọn (p000136, p000137, p000139, p000140, p000143)
  alternatives_vi:
