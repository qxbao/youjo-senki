- segment_id: YS-LN01/Text/chapter003b.xhtml/p000133
  locks:
  - Giữ đại từ nội tâm “mình”, nhận xét “Công việc này vừa an toàn, ổn định lại vẫn được coi trọng. Mong là cứ thế này mãi.”, và hình ảnh so sánh liên tưởng “giữ vai trò chủ chốt trong màn trút xuống nhiều sắt thép đến mức khiến buổi trình diễn hỏa lực Fuji trông thật nhỏ bé”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000134
  locks:
  - Giữ phủ định kép mở đầu “Ngắm quân ta dễ dàng nghiền nát kẻ địch từ độ cao an toàn trên trời chẳng có gì khó chịu cả.”, trình tự hiệp đồng tác chiến “Pháo binh cày nát trận địa, rồi bộ binh và xe bọc thép tiến lên theo sau.”, các thuật ngữ “Bọn pháp sư chúng ta phụ trách yểm trợ không đối đất và tuần tra chiến đấu trên không.”, “phi đội hỗn hợp tiêm kích-ném bom tiến lên làm mũi nhọn cho đợt đột kích sâu”, cùng lời tán thưởng “Bộ Tổng Tham mưu” và đại từ nội tâm “Mình – mình” ở câu kết.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000135
  locks:
