  proposed_vi: tiếp nối trực tiếp cuộc thảo luận tại thần giới từ ch-02-b13 và tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn hoặc chủ thể khác), trong lời kể ngôi thứ ba khách quan tại thần giới, quy chiếu các vị thần bằng “Các vị thần” / “các vị thần” và đại từ “họ” (p000148, p000149, p000152, p000154, p000156, p000160, p000162, p000164, p000165, p000169; riêng tại câu 2 p000148, làm rõ chủ ngữ “các vị thần” và tân ngữ “nhân loại” để tránh nhập nhằng hai đại từ ngôi thứ ba số nhiều trong cùng câu, đồng bộ nguyên tắc xử lý tại ch-02-b13 p000136), quy chiếu một cherub phát biểu tại p000154 bằng “một vị trong số đó” / “Vị ấy” kết hợp đại từ phản thân “mình” (đồng bộ với “những vị” tại ch-02-b13 p000127), và quy chiếu nhân loại bằng “nhân loại”, “con người” và đại từ “họ” (p000148, p000149, p000162, p000164; lưu ý từ “chúng” tại câu 2 p000149 quy chiếu các ngành khoa học tự nhiên, từ “Chúng” / “chúng” tại p000161 và cuối p000164 quy chiếu các thánh vật, và từ “nó” tại p000150, cuối p000152, câu 2 p000171 quy chiếu việc có tác dụng ngược, vấn đề đang bàn hoặc vật phẩm đang nghiên cứu, tuyệt đối không quy chiếu nhân vật); trong lời thoại trao đổi giữa các vị thần (p000147, p000151, p000153, p000155, p000157–p000159, p000161, p000163, p000166–p000168, p000170–p000172, p000174–p000177) và mệnh đề mục tiêu dẫn trực tiếp ở đầu p000149, người nói tự xưng “Ta” / “ta” ở ngôi thứ nhất số ít (p000158, p000163, p000168, p000174 — đồng bộ ch-02-b13 p000123, p000133) và dùng “chúng ta” / “Chúng ta” ở ngôi thứ nhất số nhiều cho tập thể các vị thần (p000147, p000155, p000157, p000158, p000166, p000167, p000175; riêng ở câu in nghiêng mở đầu p000149, “Chúng ta” là chủ ngữ tập thể của con người đi tìm trật tự do Thượng đế tạo dựng), dùng “Có vị nào” khi đặt câu hỏi chung cho cuộc họp các vị thần (p000153), dùng đại từ ngôi thứ hai số ít trang trọng “ngài” / “Ngài” khi hỏi một vị thần vừa phát biểu (p000159, p000172, p000175 — đồng bộ ch-02-b13 p000140), quy chiếu con người ở cõi phàm bằng “họ” (p000147, p000155, p000163, p000166), và quy chiếu nhà nghiên cứu nam giới ở cõi phàm tại p000174 bằng “hắn” kết hợp đại từ phản thân “mình” từ góc nhìn bề trên của vị thần; bảo toàn chính xác nhấn mạnh `*Chúng ta phải đi tìm trật tự do Thượng đế tạo dựng.*` tại p000149 theo DEC-P01-002 và ký hiệu chú thích `¹¹` tại cuối p000158
  alternatives_vi:
  - ông ta / người đó (thay cho “hắn” trong lời vị thần nói về nhà nghiên cứu cõi phàm tại p000174 — ưu tiên “hắn” để thể hiện tự nhiên khoảng cách bề trên của một vị thần đối với một phàm nhân)
