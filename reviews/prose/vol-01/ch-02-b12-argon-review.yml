- id: ch02-b12-technology-division-meeting-pronouns-and-emphasis
  source_term: Supply and Logistics Headquarters Technology Division third-person narration pronouns for Chief Engineer von Schugel, Second Lieutenant Tanya Degurechaff, and collective conference participants/army, conference dialogue pronouns (first-person singular/plural, second-person singular/plural address, and third-person references to Schugel and Degurechaff), italicized emphasis in p000104, and additive progression in p000105
  proposed_vi: tiếp nối trực tiếp cảnh họp tại Bộ Chỉ huy Tiếp vận và Hậu cần từ ch-02-b08 → ch-02-b11 và tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của chủ thể khác), trong lời kể ngôi thứ ba khách quan từ góc nhìn của bộ máy quản lý tại cuộc họp, quy chiếu Thiếu úy Tanya Degurechaff bằng chức danh/tên riêng “Thiếu úy Ma pháp Tanya Degurechaff” / “Thiếu úy Degurechaff” / “Degurechaff” và đại từ “cô” (p000095, p000098, p000102, p000105 — đồng bộ ch-02-b08 → ch-02-b11), quy chiếu Kỹ sư trưởng von Schugel bằng chức danh “Kỹ sư trưởng von Schugel” và đại từ trang trọng trung tính “ông” (p000102–p000104 — đồng bộ ch-02-b09 và ch-02-b11), và quy chiếu tập thể những người tham dự cuộc họp / quân đội bằng “họ” / “Họ” (p000095, p000106, p000108, p000110, p000118, p000121; lưu ý từ “Nó” / “nó” tại p000095, p000099, p000105, p000108, p000109, p000113, p000114, p000117 hoàn toàn chỉ quy chiếu danh từ bất động vật như câu hỏi, biểu mẫu phân công nhân sự, cảm giác gượng gạo khi dẫn truyền mana, quả cầu nguyên mẫu Type 95 / mẫu thế hệ kế tiếp, việc phát triển dự án, hoặc cấu trúc quả cầu lõi kép, tuyệt đối không quy chiếu nhân vật); trong lời thoại trực tiếp giữa các thành viên dự họp (p000094, p000096, p000097, p000100, p000101, p000103, p000107, p000111, p000112, p000115–p000117, p000119, p000120), người phát biểu tự xưng “Tôi” khi nêu băn khoăn cá nhân (p000094), dùng “Chúng ta” / “chúng ta” cho tập thể cuộc họp / quân đội (p000096, p000111, p000112, p000115, p000120), dùng “chúng tôi” khi thành viên bộ phận công nghệ phát biểu đại diện cho bộ phận chuyên môn của mình trước phòng họp (p000117), dùng đại từ ngôi thứ hai “anh” khi phản hồi trực tiếp vị sĩ quan cấp trung vừa đặt câu hỏi ở đoạn trước (p000096), dùng đại từ ngôi thứ hai số nhiều trang trọng “Các vị” khi đặt câu hỏi chung cho cả phòng họp (p000112 — đồng bộ plural-address-p000076, ch-01-b20 và ch-02-b10/b11), quy chiếu Degurechaff bằng “cô ấy” (p000094, p000096, p000097, p000100, p000103), và quy chiếu Kỹ sư trưởng von Schugel bằng “Kỹ sư trưởng von Schugel” và “ông ấy” (p000100, p000101, p000103); bảo toàn chính xác nhấn mạnh `*đúng là*` tại p000104 theo DEC-P01-002 và cấu trúc tăng tiến “không chỉ vậy, cô còn...” tại p000105
  alternatives_vi:
  - các ngài (thay cho “Các vị” tại p000112 — ưu tiên “Các vị” để đồng bộ hoàn toàn với ch-02-b10/b11 và ch-01-b20 trong bối cảnh thảo luận tại phòng họp)
