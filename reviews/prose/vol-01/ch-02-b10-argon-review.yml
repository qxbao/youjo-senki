- id: ch02-b10-technology-division-meeting-pronouns-and-generic-subject
  source_term: Supply and Logistics Headquarters Technology Division third-person narration pronouns for Second Lieutenant Tanya Degurechaff, opposing/pro-development factions, Empire, and troops, conference dialogue pronouns (first-person singular/plural and second-person plural address), and generic second-person conditional subject in p000065
  proposed_vi: tiếp nối cảnh họp tại Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần từ ch-02-b08 (p000035–p000041) và ch-02-b09 (p000042–p000059), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của chủ thể khác), trong lời kể ngôi thứ ba khách quan từ góc nhìn của Ban Công nghệ (p000066, p000067), quy chiếu Thiếu úy Tanya Degurechaff bằng tên riêng “Degurechaff” và đại từ “cô” (lưu ý từ “nó” trong lô p000061–p000063, p000066–p000069, p000071, p000074, p000075 hoàn toàn chỉ quy chiếu danh từ bất động vật như việc đồng bộ hóa bốn lõi, dự án/quả cầu nguyên mẫu Type 95 hoặc bản báo cáo thử nghiệm, tuyệt đối không quy chiếu nhân vật); quy chiếu tập thể Đế quốc, Ban Công nghệ, phe phản đối, phe ủng hộ phát triển, kỹ sư hoặc binh lính trong lời kể ngôi thứ ba bằng “họ” / “Họ” (p000060, p000062, p000063, p000067, p000072, p000073, p000075); trong lời thoại trực tiếp giữa các thành viên dự họp (p000061, p000065, p000068, p000071, p000074), người phát biểu tự xưng “Tôi” (p000061), gọi tập thể cuộc họp là “chúng ta” (p000061, p000071), dùng đại từ ngôi thứ hai số nhiều trang trọng “Các vị” khi đặt câu hỏi trực tiếp cho các thành viên dự họp tại p000065 (đồng bộ với plural-address-p000076 và ch-01-b20), và dịch rõ chủ ngữ đại từ khái quát trong câu điều kiện giả định ở cuối p000065 là “người vận hành” để tránh hiểu nhầm thành ngôi thứ hai trực tiếp trong phòng họp
  alternatives_vi:
  - pháp sư / một người (thay cho “người vận hành” ở mệnh đề giả định cuối p000065 — ưu tiên “người vận hành” vì thể hiện chuẩn xác văn phong báo cáo kỹ thuật đang bàn về việc duy trì hoạt động của quả cầu tính toán)
