  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự nhất quán của điểm nhìn Ban Công nghệ thuộc Bộ Chỉ huy Tiếp vận và Hậu cần nối tiếp ch-02-b08/b09 (trần thuật gọi Degurechaff là “cô”, gọi tập thể quản lý/phe phái/Đế quốc/binh lính là “họ”; lời thoại cuộc họp dùng “Tôi / chúng ta – Các vị”; chủ ngữ giả định khái quát tại p000065 dịch là “người vận hành”; toàn bộ 16 đoạn không có thẻ nhấn mạnh nên không dùng `*...*`)."
