  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 20 đoạn mở đầu chapter007b.xhtml ở ch-03-b23: giữ trần thuật ngôi thứ ba khách quan quy chiếu đơn vị pháp sư và bộ binh Cộng hòa bằng “họ” / “Họ” – “mình” (tuyệt đối không dùng “nó” cho nhân vật), giữ hệ xưng hô quân sự chuẩn xác giữa chỉ huy và các pháp sư Cộng hòa cấp dưới (“Rõ, thưa ngài” – “chúng tôi” / “chúng ta” – “chúng”), xử lý đại từ ngôi thứ hai phiếm chỉ bằng “người ta” tại p000020 theo direct-address choice, bảo toàn đầy đủ các câu hỏi, cấu trúc “không chỉ... mà còn...”, mệnh đề điều kiện/giả định/phủ định và trạng thái 0/20 đoạn có nhấn mạnh `*...*`."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000001
  locks:
  - Giữ trần thuật ngôi thứ ba khách quan (tuyệt đối không dùng “nó” theo DEC-P01-001), đại từ “họ”, sắc thái khả thể nhượng bộ “có lẽ rất lý tưởng về mặt tốc độ, nhưng lại...” và các thuật ngữ “Lực lượng mặt đất”, “Đội hình đột phá”, “hỏa lực”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000002
  locks:
  - Giữ đại từ “họ”, các thuật ngữ “sự yểm trợ trực tiếp của pháp sư”, “chọc thủng phòng tuyến”, “Đài kiểm soát”, “đánh chặn”, cùng phủ định khả năng và so sánh giả định “chẳng khá hơn nhắm mắt bắn bừa là bao”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000003
  locks:
  - Giữ mệnh đề nhượng bộ, suy luận tất yếu “ắt hẳn đã được phát đi”, các thuật ngữ “các quan sát viên đơn lẻ của địch”, “gây nhiễu”, “lực lượng đánh chặn”, “lực lượng phản ứng nhanh”, “quân mặt đất”, và giả định tình huống xấu nhất ở câu 4 (từ “nó” ở câu 2 chỉ quy chiếu “Việc duy trì gây nhiễu”).
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000004
  locks:
  - Giữ khẩu lệnh quát tháo của chỉ huy đơn vị pháp sư Cộng hòa và cụm “thi triển thuật thức”: “Còn thời gian khua môi múa mép thì lo mà thi triển thuật thức đi! Lũ khốn này!”.
