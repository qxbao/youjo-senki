  proposed_vi: Lực lượng mặt đất / Đội hình đột phá / hỏa lực / sự yểm trợ trực tiếp của pháp sư / chọc thủng phòng tuyến / Đài kiểm soát / đánh chặn / các quan sát viên / quan sát viên / gây nhiễu / lực lượng đánh chặn / lực lượng phản ứng nhanh / quân mặt đất / thi triển thuật thức / bộ binh / pháo binh địch / trận pháo kích / pháo binh cấp quân đoàn / sư đoàn / tiểu đoàn / tác chiến chống pháp sư / thuật thức quang học / thuật thức gây nổ / đấu pháo / các toán trinh sát / màn hỏa lực áp chế chống bộ binh bằng đạn nổ mạnh / tiểu đội quan sát viên / đại đội pháp sư / đơn vị yểm trợ trực tiếp tiền phương / thuật thức / phản ứng ma lực cao / quân tiếp viện / các pháp sư / Học thuyết quân sự / học thuyết / thực chiến / đạo quân đi đầu / lực lượng yểm trợ / các đơn vị mặt đất / đột phá / đạo quân mặt đất / các khẩu đội pháo / toán pháp sư tiếp viện / không phận
  alternatives_vi:
  - Đội hình mũi nhọn đột kích (thay cho “Đội hình đột phá” tại p000001 — ưu tiên “Đội hình đột phá” để đồng bộ trực tiếp với thuật ngữ “đột phá” xuyên suốt p000018 và Chương 3–4) / Control hoặc Sở chỉ huy (thay cho “Đài kiểm soát” tại p000002 — ưu tiên “Đài kiểm soát” đồng bộ với ch-02-b01 p000015 và ch-03-b19 p000411) / pháo binh quân đoàn (thay cho “pháo binh cấp quân đoàn” tại p000005, p000006 — ưu tiên “pháo binh cấp quân đoàn” đồng bộ với ch-03-b19 p000397 và nhấn mạnh rõ phân cấp đối lập với sư đoàn/tiểu đoàn ở p000006) / chiến đấu chống pháp sư (thay cho “tác chiến chống pháp sư” tại p000006 — ưu tiên “tác chiến chống pháp sư” vì chuẩn thuật ngữ quân sự) / các đội trinh sát, màn hỏa lực chế áp sát thương sinh lực nổ mạnh và toán quan sát viên (thay cho “các toán trinh sát”, “màn hỏa lực áp chế chống bộ binh bằng đạn nổ mạnh” và “tiểu đội quan sát viên” tại p000011 — ưu tiên “màn hỏa lực áp chế chống bộ binh bằng đạn nổ mạnh” kế thừa trực tiếp b05-suppressive-fire “hỏa lực áp chế” ở ch-03-b18/b19 và “tiểu đội quan sát viên” chuẩn biên chế quân sự)
