- id: ch03-b23-republican-mages-third-person-pov-pronouns-dialogue-and-modality
  source_term: republican_mages_third_person_pov_pronouns_dialogue_and_modality_ch03_b23
  proposed_vi: 'Tiếp nối trực tiếp phân cảnh ở cuối ch-03-b22 (chapter007.xhtml/p000497–p000498), toàn bộ 20 đoạn mở đầu chapter007b.xhtml của lô ch-03-b23 (p000001–p000020) dưới góc nhìn trần thuật ngôi thứ ba khách quan bám theo đơn vị pháp sư yểm trợ trực tiếp tiền phương của Cộng hòa đang tìm cách chế áp các quan sát viên pháo binh Đế quốc để bảo vệ cuộc rút lui của bộ binh phe họ trước khi phát hiện toán pháp sư tiếp viện Đế quốc (tức đội của Thiếu úy Degurechaff, Hạ sĩ Serebryakov và tiểu đội của Trung sĩ Schones đã xuất kích ở cuối ch-03-b22) lao tới — tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (Tanya chưa xuất hiện trực tiếp trong cảnh; tuyệt đối không dùng đại từ “nó” quy chiếu bất kỳ nhân vật nào — từ “nó” duy nhất ở câu 2 p000003 hoàn toàn chỉ quy chiếu danh từ trừu tượng “Việc duy trì gây nhiễu”), DEC-P01-002 (0/20 đoạn có nhấn mạnh trong nguồn; 0/20 dòng dịch dùng dấu `*...*`) và canon/style-guide.md: (1) Trong trần thuật ngôi thứ ba khách quan (p000001–p000003, p000005, p000006, p000008, p000009, p000011, p000012, p000014, p000017–p000020): quy chiếu tập thể đơn vị pháp sư Cộng hòa và lực lượng mặt đất Cộng hòa nhất quán bằng đại từ số nhiều “họ” / “Họ” kết hợp đại từ phản thân “mình” (p000005, p000008), đồng thời dịch rõ các danh từ chỉ đối tượng (“pháo binh địch” / “chúng” ở p000005, “đối phương” / “kẻ địch của họ” ở p000008, p000012, “các quan sát viên” và “đạo quân mặt đất của họ” ở p000019) để phân biệt rạch ròi giữa lực lượng pháp sư Cộng hòa, bộ binh Cộng hòa và các đơn vị Đế quốc; tại câu 2 p000020 chuyển đại từ ngôi thứ hai phiếm chỉ trong nguồn thành chủ ngữ khái quát “người ta” (“Có những trận chiến mà người ta không thể chạy trốn.”) theo đúng quy ước direct-address choice (pending-terms.yml). (2) Trong hội thoại quân sự của đơn vị pháp sư Cộng hòa: chỉ huy đơn vị pháp sư Cộng hòa (p000004, p000013, p000016) quát thúc giục cấp dưới bằng khẩu lệnh chiến trường gay gắt (“Còn thời gian khua môi múa mép thì lo mà thi triển thuật thức đi! Lũ khốn này!” ở p000004), bác bỏ dứt khoát đề xuất dùng thuật thức gây nổ và quy chiếu các quan sát viên Đế quốc bằng “chúng” (p000013), rồi ra lệnh chuyển sang đánh chặn quân tiếp viện (p000016); các pháp sư Cộng hòa cấp dưới khi đáp lệnh và xin phép chỉ huy ở p000007 thì mở đầu chuẩn điều lệnh “Rõ, thưa ngài.” và tự xưng “chúng tôi” (“Xin hãy cấp phép cho chúng tôi sử dụng thuật thức gây nổ.”), khi than thở trong đội hình ở p000010 thì dùng đại từ gộp “chúng ta” và quy chiếu các quan sát viên địch bằng “chúng”, và khi báo động khẩn cấp ở p000015 thì dùng câu khẩu lệnh ngắn gọn kèm cặp dấu gạch ngang dài (—). (3) Bảo toàn trọn vẹn các cấu trúc khả thể, giả định, điều kiện, câu hỏi, phủ định và cấu trúc tăng tiến theo đúng canon/style-guide.md: khả thể nhượng bộ “có lẽ rất lý tưởng về mặt tốc độ, nhưng lại...” (p000001); phủ định khả năng và so sánh giả định “chẳng khá hơn nhắm mắt bắn bừa là bao” (p000002); mệnh đề nhượng bộ, suy luận tất yếu “ắt hẳn đã được phát đi”, giả định “phải giả định rằng...” và giả định tình huống xấu nhất ở câu 4 (p000003); câu hỏi nội tâm ngắn gọn “Bằng cách nào?” cùng giả định đối lập với đánh giá thực tế “có vẻ đó là pháo binh cấp quân đoàn” (p000005); điều kiện giả định trái thực tế “Nếu đó là pháo binh trực thuộc một sư đoàn hay một tiểu đoàn... sẽ cho họ một cơ hội, nhưng pháo binh cấp quân đoàn ắt sẽ lường trước...” và cấu trúc tăng tiến hai chủ thể tách bạch “Nhưng việc đó không chỉ tốn rất nhiều thời gian và công sức, mà hiệu quả cũng chẳng thể hiện rõ ngay tức thì.” ở câu 3 (p000006); điều kiện giả định ở câu 1, phủ định ở câu 2, 4 và cấu trúc tăng tiến giữ cùng chủ thể “Họ không chỉ phải hạ độ cao xuống một mức nhất định, mà còn phải bay lướt qua nhiều lượt để đảm bảo không bỏ sót bất cứ thứ gì.” ở câu 3 (p000008); hai mức độ suy đoán quá khứ “hẳn đã lan đi nhanh chóng” và “có lẽ đã chuyển sang ẩn nấp” cùng giả định tương lai ở câu 2 (p000009); phủ định mức độ ở p000010; điều kiện khả thể “Nếu gặp may, họ có thể diệt gọn...” ở câu 4 (p000011); các mệnh đề giả định và điều kiện ở cả ba câu của p000012; phép điệp liên kết “Về lâu dài” / “Nhưng về lâu dài” nối từ lời bác bỏ ở p000013 sang câu phủ định ở p000014; hai câu giả định trái thực tế về học thuyết quân sự ở câu 2–3 và câu điều kiện nhân quả “Vì đạo quân đi đầu vẫn chưa rút thoát xong, nên nếu lực lượng yểm trợ mà rút lui, đúng nghĩa đen là tất cả mọi người sẽ bị giết sạch.” ở câu 4 (p000017); sự tương phản tốc độ rút lui của bộ binh với pháp sư (p000018); hình dung viễn cảnh xấu ở p000019; và câu phủ định kết cảnh ở p000020.'
  alternatives_vi:
  - Không thể nào hoặc Không được phép (thay cho “Không thể chấp nhận được.” tại câu 1 p000013 — ưu tiên “Không thể chấp nhận được.” để thể hiện giọng bác bỏ dứt khoát của người chỉ huy trước lời xin phép dùng thuật thức gây nổ ở p000007) / tỉnh lược chủ ngữ phiếm chỉ thành “Có những trận chiến không thể chạy trốn.” (thay cho “Có những trận chiến mà người ta không thể chạy trốn.” tại câu 2 p000020 — ưu tiên dùng chủ ngữ khái quát “người ta” để giữ trọn nhịp câu chiêm nghiệm chiến trường khép lại phân cảnh trước space_break)
