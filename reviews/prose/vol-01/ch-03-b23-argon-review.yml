- segment_id: YS-LN01/Text/chapter007b.xhtml/p000006
  locks:
  - Giữ điều kiện giả định trái thực tế ở câu 1, các thuật ngữ “sư đoàn”, “tiểu đoàn”, “pháo binh cấp quân đoàn”, “tác chiến chống pháp sư”, “các quan sát viên”, và cấu trúc tăng tiến hai chủ thể tách bạch ở câu 3 (“Nhưng việc đó không chỉ tốn rất nhiều thời gian và công sức, mà hiệu quả cũng chẳng thể hiện rõ ngay tức thì.”).
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000007
  locks:
  - Giữ lời đáp và xin phép của pháp sư Cộng hòa cấp dưới: mở đầu “Rõ, thưa ngài.”, tự xưng “chúng tôi”, và cặp thuật ngữ “thuật thức quang học” – “thuật thức gây nổ”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000008
  locks:
  - Giữ điều kiện giả định ở câu 1, các phủ định ở câu 2 và câu 4, cấu trúc tăng tiến giữ cùng chủ thể “Họ không chỉ phải... mà còn phải...” ở câu 3, câu nhận định khái quát ở câu 5, cùng các thuật ngữ “thuật thức gây nổ”, “quan sát viên”, “thuật thức quang học”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000009
  locks:
  - Giữ hai cấp độ suy đoán quá khứ (“hẳn đã lan đi nhanh chóng”, “có lẽ đã chuyển sang ẩn nấp”), giả định tương lai ở câu 2 và thuật ngữ “những quan sát viên khác”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000010
  locks:
  - Giữ câu than thở phủ định dùng đại từ gộp “chúng ta” và quy chiếu các quan sát viên Đế quốc bằng “chúng”: “Cứ đà này, chúng ta sẽ chẳng thể diệt nổi lấy một nửa số chúng mất.”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000011
  locks:
  - Giữ điều kiện khả thể ở câu 4 (“Nếu gặp may, họ có thể diệt gọn cả tiểu đội quan sát viên.”) và các thuật ngữ “các trận đấu pháo”, “các toán trinh sát”, “màn hỏa lực áp chế chống bộ binh bằng đạn nổ mạnh”, “tiểu đội quan sát viên”, “hỏa lực”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000012
  locks:
  - Giữ các mệnh đề giả định và điều kiện ở cả ba câu, đại từ “họ”, cùng các thuật ngữ “đại đội pháp sư”, “hỏa lực”, “đơn vị yểm trợ trực tiếp tiền phương” và “thuật thức”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000013
  locks:
  - Giữ lời bác bỏ của chỉ huy pháp sư Cộng hòa, cụm mở đầu câu 2 “Về lâu dài” (để tạo phép điệp liên kết với p000014) và đại từ “chúng”: “Không thể chấp nhận được. Về lâu dài, làm vậy sẽ chỉ khiến việc tìm ra chúng càng thêm khó khăn thôi.”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000014
  locks:
  - Giữ phép điệp liên kết “Nhưng về lâu dài” và câu phủ định: “Nhưng về lâu dài, hôm nay thực sự không phải là ngày may mắn của họ.”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000015
  locks:
  - Giữ tiếng báo động khẩn cấp, cặp dấu gạch ngang dài (—) và các thuật ngữ “phản ứng ma lực cao”, “quân tiếp viện”, “các pháp sư”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000016
  locks:
  - Giữ mệnh lệnh chuyển mục tiêu tác chiến của chỉ huy pháp sư Cộng hòa và các thuật ngữ “quan sát viên”, “đánh chặn”: “A, chết tiệt! Quên chuyện săn lùng quan sát viên đi! Chuẩn bị đánh chặn!”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000017
  locks:
  - Giữ các mệnh đề giả định trái thực tế ở câu 2–3, câu điều kiện nhân quả ở câu 4 (“Vì đạo quân đi đầu vẫn chưa rút thoát xong, nên nếu lực lượng yểm trợ mà rút lui, đúng nghĩa đen là tất cả mọi người sẽ bị giết sạch.”), cùng các thuật ngữ “Học thuyết quân sự” / “học thuyết”, “thực chiến”, “đạo quân đi đầu”, “lực lượng yểm trợ”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000018
  locks:
  - Giữ sự tương phản tốc độ cơ động giữa bộ binh dưới đất và pháp sư, cùng các thuật ngữ “các đơn vị mặt đất”, “đột phá”, “các pháp sư”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000019
  locks:
  - Giữ hình dung viễn cảnh xấu (“Họ hoàn toàn có thể hình dung ra cảnh...”) và các thuật ngữ “các quan sát viên”, “các khẩu đội pháo”, “đạo quân mặt đất của họ”, “toán pháp sư tiếp viện”.
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000020
  locks:
  - Giữ thuật ngữ “không phận” ở câu 1 và câu phủ định dùng chủ ngữ khái quát “người ta” theo direct-address choice ở câu 2: “Có những trận chiến mà người ta không thể chạy trốn.”.
