  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ tổ chức, tác chiến pháo binh và ma đạo đã khóa tạm từ Chương 1–2, ch-03-b01 → ch-03-b22 và Chương 4–5: “Đài kiểm soát” (P01-norden-control, ch-02-b01 p000015, ch-03-b19 p000411: p000002), “đánh chặn” và “lực lượng đánh chặn” (ch-03-b20 p000416, ch-05-b05 p000086: p000002, p000003, p000016), “các quan sát viên” / “quan sát viên” (chapter1_b01_pending_terms, ch-03-b21, ch-03-b22: p000003, p000006, p000008, p000009, p000016, p000019), “gây nhiễu” (b02-magical-interference-formulas: p000003), “lực lượng phản ứng nhanh” (ch-05-b01 p000017, ch-05-b02 p000033, ch-05-b03 p000051: p000003), “thi triển thuật thức” / “thuật thức” (P01-formulas: p000004, p000008, p000012), “trận pháo kích” và “pháo binh cấp quân đoàn” (ch-03-b19 p000397, ch-03-b20 p000417: p000005, p000006), “sư đoàn” và “tiểu đoàn” (p000006), “thuật thức quang học” (ch-03-b22 p000498: p000007, p000008), “thuật thức gây nổ” (ch-03-b20 p000420, ch-03-b21 p000439: p000007, p000008), “đấu pháo” và “hỏa lực áp chế” (b05-suppressive-fire, ch-03-b18 p000372, ch-03-b19 p000396: p000011), “đại đội pháp sư” (ch-03-b21 p000448, ch-03-b22 p000468: p000012), “ma lực” (ch-03-b22 p000498: p000015), “quân tiếp viện” (ch-03-b20 p000422, ch-03-b21 p000450: p000015) và “toán pháp sư tiếp viện” (p000019), “Học thuyết quân sự” / “học thuyết” (ch-01-b03 p000037, ch-02-b01 p000002, ch-04-b16 p000105: p000017), “thực chiến” (ch-03-b20 p000424: p000017), “đột phá” (ch-04-b21, ch-04-b22: p000018), “các khẩu đội pháo” (ch-01-b02, ch-03-b18: p000019), và “không phận” (chapter1_b01_pending_terms, ch-05-b05 p000095: p000020); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “Đội hình đột phá” (p000001), “sự yểm trợ trực tiếp của pháp sư” (p000002) và “đơn vị yểm trợ trực tiếp tiền phương” (p000012 — đồng bộ với “các pháp sư yểm trợ trực tiếp” ở ch-03-b20 p000417, ch-03-b21 p000451), “tác chiến chống pháp sư” (p000006), “các toán trinh sát”, “màn hỏa lực áp chế chống bộ binh bằng đạn nổ mạnh” và “tiểu đội quan sát viên” (p000011)."
