  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm và tên gọi tổ chức đã khóa tạm từ Chương 1–4, ch-05-b01 → ch-05-b11 và các tập sau: “Văn phòng Bộ Tổng Tham mưu” (ch-05-b01, ch-05-b09–b11: p000275, p000279, p000286) và “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms: p000276, p000280, p000293, p000299, p000303); “mẫu đơn” (ch-05-b11 p000274: p000276), “nhận nhiệm sở” (ch-05-b11 p000266: p000276), “Cục Nhân sự” (ch-05-b11 p000263, p000270: p000277) và “các quyết định nhân sự” (ch-05-b11 p000267: p000279); “Đại tá von Kordel” / “Đại tá” / “Vị đại tá” / “vị đại tá” (ch-05-b11: p000282, p000287, p000290, p000291, p000292) và “Zettour” (p000292, p000295, p000299, p000307); “quân nhân” (ch-04-b16 p000104: p000282); “sĩ quan phụ tá” (vol-04-ch-05: p000292), “cấp trên trực tiếp” (ch-05-b09 p000204: p000293) và “thuộc cấp” (ch-03-b26 p000084, ch-04-b16 p000114: p000295); “Đại úy von Degurechaff” / “Đại úy” / “đại úy” (viết thường khi là danh từ chung theo b02-second-lieutenant: p000293, p000297, p000302, p000303); “học viện chiến tranh” (p000296, p000302, p000307), “giảng viên” (p000304), “hiệp sĩ” (ch-05-b09 p000216: p000296) và “kinh nghiệm thực chiến” (ch-04-b08 p000161, ch-05-b08 p000161: p000296); “sĩ quan có quân hàm” (ch-04-b08 p000163, ch-04-b09 p000187, ch-05-b11 p000261: p000299); “tiểu đoàn”, “đại đội” (ch-05-b10 p000220: p000301, p000303, p000304, p000308) và “tiểu đoàn trưởng” (ch-04-b09 p000192: p000302); “pháp sư”, “tiểu đoàn pháp sư”, “các sĩ quan pháp sư”, “đơn vị pháp sư” và “tiền tuyến” (p000304, p000305, p000307, p000308); đồng thời khóa tạm các cụm thuật ngữ mới phát sinh trong lô: “màn kịch” và “kịch bản hạng ba” (p000282), “các thủ thư”, “kho lưu trữ lịch sử quân sự” và “các cuộc cơ động cấp tiểu đoàn” (p000302), “năng lực tác chiến” và “phong cách tác chiến” (p000304), “sĩ quan dã chiến” và “nơi tuyến đầu ác liệt nhất” (p000305), “mới được tập hợp” (p000308–p000309), “xác lập uy quyền” và “một vài người lính kỳ cựu từng trải” (p000311)."
