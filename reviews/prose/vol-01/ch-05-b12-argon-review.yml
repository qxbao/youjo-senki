- id: ch05-b12-pov-transition-tanya-to-zettour-pronouns-and-exact-emphasis
  source_term: pov_transition_tanya_to_zettour_pronouns_and_exact_emphasis_ch05_b12
  proposed_vi: 'Toàn bộ 37 đoạn của lô ch-05-b12 (chapter011.xhtml/p000275–p000311) gồm 2 phân cảnh ngăn cách bởi thẻ ngắt cảnh `class="space-break1"` tại p000291, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân cảnh 1 (p000275–p000291 — Phần kết cuộc trao đổi nhân sự với Đại tá von Kordel dưới điểm nhìn trần thuật ngôi thứ ba bám sát Tanya, tiếp nối trực tiếp ch-05-b11): áp dụng nghiêm ngặt DEC-P01-001, quy chiếu Tanya trong lời kể nhất quán bằng đại từ “nó” / “Nó” kết hợp phản thân “mình” (p000276, p000280, p000282, p000285, p000288, p000289 — tuyệt đối không dùng “cô” / “cô ấy” trong trần thuật; lưu ý từ “mình” ở cuối câu 2 p000282 là đại từ phản thân quy chiếu danh ngữ “một người trẻ tuổi đầy nhiệt huyết” trong hình ảnh so sánh), và trong độc thoại nội tâm trực tiếp ở p000279 tự quy chiếu nhất quán bằng “mình”; quy chiếu Đại tá von Kordel trong lời kể bằng “Vị đại tá” / “vị đại tá” và đại từ trang trọng “ông” / “Ông” (p000276, p000282, p000285, p000288–p000290). (2) Phân cảnh 2 (p000292–p000311 — Chuyển sang điểm nhìn trần thuật ngôi thứ ba bám theo Chuẩn tướng von Zettour sau khi Kordel rời phòng tiệc): tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (“Không tự mở rộng quy ước này sang chủ thể hoặc giai đoạn khác”), tuyệt đối không dùng đại từ “nó” ở bất kỳ đoạn nào từ p000292 đến p000311; quy chiếu Chuẩn tướng von Zettour bằng “Zettour” và đại từ “ông” / “Ông” kết hợp phản thân “mình” (p000292, p000295, p000296, p000298, p000299, p000302, p000304, p000307), quy chiếu Kordel lúc rời đi ở câu 1–2 p000292 bằng “Vị đại tá” / “ông ta” để phân biệt rõ với “ông” (Zettour) trong cùng câu, và quy chiếu Đại úy Tanya von Degurechaff trong lời kể cùng suy nghĩ của Zettour nhất quán bằng “Đại úy von Degurechaff”, “vị đại úy nhỏ bé này” và đại từ “cô” / “Cô” kết hợp phản thân “mình” (p000292, p000296, p000298, p000299, p000301, p000302, p000304, p000305, p000311 — đồng bộ hoàn toàn với góc nhìn của Zettour ở ch-04-b04, ch-04-b16 và góc nhìn của Lergen ở ch-05-b09/b10). (3) Hệ xưng hô trong hội thoại quân sự: Kordel và Zettour khi nói với Tanya (p000277, p000281, p000286, p000293, p000303, p000308) tự xưng “Tôi” / “tôi” (và “Chúng ta” ở đầu p000293), gọi Tanya bằng “Đại úy” và “cô” / “Cô”; Zettour khi chào tiễn Kordel ở p000291 gọi “Đại tá von Kordel” và dùng đại từ ngôi thứ hai lịch sự “anh” của cấp tướng nói với cấp tá (đồng bộ cách Chuẩn tướng von Rudersdorf gọi Trung tá von Lergen ở ch-05-b09/b10); Tanya khi đáp lời hai sĩ quan cấp cao (p000278, p000284, p000287, p000294, p000306, p000309) tự xưng “tôi” / “Tôi”, thưa “thưa ngài”, “thưa Đại tá”, “Rõ, thưa ngài” kèm tiểu từ kính ngữ “ạ” đúng điều lệnh. (4) Tuân thủ tuyệt đối DEC-P01-002: bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 2/37 đoạn có thẻ `<html:em>` trong `xhtml` nguồn là p000279 (2 cặp dấu `*...*` bao quanh chữ `trông` không in nghiêng: `*Thực ra, chỉ* trông *như thể mình có quyền lựa chọn mà thôi. Văn phòng Bộ Tổng Tham mưu mới là nơi đưa ra các quyết định nhân sự. Chắc cũng phải khen họ tử tế khi đã cho mình biết có bao nhiêu lời mời gọi gửi tới.*`) và p000288 (chỉ nhấn mạnh câu đầu: `*Mọi điều may mắn nhất.*`, đồng bộ từ vựng với p000286); 35/37 đoạn còn lại hoàn toàn không dùng dấu `*`.'
  alternatives_vi:
  - Vâng, thưa ngài (thay cho “Rõ, thưa ngài” tại p000284 và p000294 — ưu tiên “Rõ, thưa ngài” vì khớp với tư thế ngồi thẳng tắp đáp lời điều lệnh ở p000285 và tinh thần công vụ nghiêm cẩn trước cấp tướng ở p000294–p000295) / Cảm ơn ông đã dành thời gian, Đại tá von Kordel, hẹn gặp lại ông sau (thay cho đại từ “anh” tại p000291 — ưu tiên “anh” đồng bộ với cách tướng lĩnh gọi sĩ quan cấp tá ở ch-05-b09 và ch-05-b10)
