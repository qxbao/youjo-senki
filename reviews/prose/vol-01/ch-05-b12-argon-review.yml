  proposed_vi: Văn phòng Bộ Tổng Tham mưu / mẫu đơn / Bộ Tổng Tham mưu / nhận nhiệm sở / Cục Nhân sự / các quyết định nhân sự / vị đại tá / màn kịch / quân nhân / kịch bản hạng ba / Đại tá / Đại tá von Kordel / Zettour / sĩ quan phụ tá / Đại úy / cấp trên trực tiếp / thuộc cấp / học viện chiến tranh / hiệp sĩ / kinh nghiệm thực chiến / đại úy / sĩ quan có quân hàm / tiểu đoàn / đại đội / các thủ thư / kho lưu trữ lịch sử quân sự / các cuộc cơ động cấp tiểu đoàn / Đại úy von Degurechaff / tiểu đoàn trưởng / tiểu đoàn pháp sư / năng lực tác chiến / giảng viên / tiền tuyến / phong cách tác chiến / sĩ quan dã chiến / pháp sư / nơi tuyến đầu ác liệt nhất / các sĩ quan pháp sư / đơn vị pháp sư / mới được tập hợp / xác lập uy quyền / một vài người lính kỳ cựu từng trải
  alternatives_vi:
  - vở kịch giả tạo (thay cho “màn kịch” tại p000282) / tác chiến cơ động quy mô tiểu đoàn (thay cho “các cuộc cơ động cấp tiểu đoàn” tại p000302 — ưu tiên “các cuộc cơ động cấp tiểu đoàn” để bám sát danh ngữ số nhiều trong nguồn) / chỉ huy tiểu đoàn (thay cho “tiểu đoàn trưởng” tại p000302 — ưu tiên “tiểu đoàn trưởng” đồng bộ với ch-04-b09 p000192 khi chỉ chức danh chính thức của Tanya) / sức chiến đấu và lối chiến đấu (thay cho “năng lực tác chiến” và “phong cách tác chiến” tại p000304) / sĩ quan chiến trường và tuyến tiền tiêu xa nhất (thay cho “sĩ quan dã chiến” và “nơi tuyến đầu ác liệt nhất” tại p000305 — ưu tiên “sĩ quan dã chiến” để chỉ sĩ quan tác chiến thực địa ở hàm Đại úy, phân biệt rõ với cấp bậc “sĩ quan cấp tá” ở ch-04-b04 và ch-04-b16) / mới được thành lập hoặc mới được biên chế (thay cho “mới được tập hợp” tại p000308–p000309 — ưu tiên “mới được tập hợp” để làm rõ tính chất đơn vị vừa gom quân, cần tổ chức và huấn luyện từ đầu ở p000311) / thiết lập thẩm quyền chỉ huy và một vài cựu binh dày dạn kinh nghiệm (thay cho “xác lập uy quyền” và “một vài người lính kỳ cựu từng trải” tại p000311)
