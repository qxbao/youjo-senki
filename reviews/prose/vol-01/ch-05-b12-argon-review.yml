  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 37 đoạn của ch-05-b12: phân tách chuẩn xác hệ đại từ theo sự chuyển đổi điểm nhìn qua `space-break1` tại p000291 (dùng “nó” – “mình” cho Tanya ở p000275–p000291 dưới điểm nhìn Tanya, chuyển sang “cô” – “mình” cho Tanya và “ông” – “mình” cho Zettour ở p000292–p000311 dưới điểm nhìn Zettour), giữ chuẩn hệ xưng hô hội thoại quân sự, bảo toàn đầy đủ các cấu trúc giả định/điều kiện trái thực tế (p000295, p000297, p000299, p000302, p000311), dấu gạch ngang dài (p000310) và chính xác phạm vi nhấn mạnh Markdown `*...*` tại 2/37 đoạn có `<html:em>` là p000279 và p000288."
