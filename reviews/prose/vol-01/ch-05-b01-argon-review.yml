  volume: vol-01
  chapter: 5
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md trong cảnh họp Bộ Tổng Tham mưu mở đầu Chương 5: giữ đại từ số nhiều “họ” / “Họ” kết hợp phản thân “mình” cho các tập thể quân sự và phía Đế quốc trong lời kể ngôi thứ ba khách quan (tránh dùng “nó” cho Đế quốc ở p000008; từ “nó” duy nhất ở p000019 chỉ quy chiếu danh từ bất động vật “chiến lược nội tuyến”), giữ đại từ nghị sự “chúng ta” / “ta” trong phát biểu của Zettour và Rudersdorf, bảo toàn đầy đủ điệp ngữ, các giả định dự kiến trước chiến tranh đối lập với thực tế, phép so sánh giả định và không thêm dấu `*...*` ngoài nguồn."
