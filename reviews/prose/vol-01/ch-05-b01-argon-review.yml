- id: ch05-b01-general-staff-conference-third-person-pronouns-dialogue-we-conditionals-and-no-emphasis
  source_term: general_staff_conference_third_person_pronouns_dialogue_we_conditionals_and_no_emphasis_ch05_b01
  proposed_vi: 'mở đầu Chương 5 tại Phòng Hội nghị Số 1 thuộc Văn phòng Bộ Tổng Tham mưu, toàn bộ 19 đoạn của lô ch-05-b01 (chapter011.xhtml/p000001–p000019) diễn ra dưới góc nhìn trần thuật ngôi thứ ba khách quan xoay quanh báo cáo của Chuẩn tướng von Zettour và sự đồng thuận với Chuẩn tướng von Rudersdorf (Tanya không xuất hiện trong cảnh), tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác), DEC-P01-002 và style-guide.md: (1) Trong trần thuật ngôi thứ ba khách quan (p000003, p000005, p000006, p000008, p000009, p000011–p000013, p000016, p000017, p000019), quy chiếu tập thể Bộ Tổng Tham mưu, đạo quân phía tây, Cụm tập đoàn quân phương Tây, Cục Quân vụ và phía Đế quốc nhất quán bằng đại từ số nhiều trung tính “họ” / “Họ” kết hợp đại từ phản thân “mình” (p000005, p000008, p000009, p000011–p000013, p000016, p000019 — đồng bộ ch-01-b19/b20); đặc biệt tại câu 2 p000008, dịch đại từ sở hữu quy chiếu “Đế quốc” bằng phản thân “của mình” (“lực lượng tác chiến chủ lực của mình”) thay vì “của nó” để tránh mọi sự trùng lặp hình thức với đại từ trần thuật của Tanya, và lưu ý từ “nó” duy nhất ở mệnh đề cuối p000019 (“giả vờ như nó vẫn đang vận hành hiệu quả”) hoàn toàn chỉ quy chiếu danh từ bất động vật là “chiến lược nội tuyến” (đồng bộ trực tiếp với ch-04-b19 p000186). (2) Trong các câu thoại báo cáo và kiến nghị tại cuộc họp Bộ Tổng Tham mưu của Chuẩn tướng von Zettour (p000002, p000004, p000007, p000010, p000014, p000018) và câu tán đồng của Chuẩn tướng von Rudersdorf đại diện Cục Tác chiến (p000015), dùng nhất quán đại từ ngôi thứ nhất số nhiều gộp “chúng ta” / “ta” cho tập thể Bộ Tổng Tham mưu và Quân đội Đế quốc (đồng bộ ch-01-b19/b20). (3) Bảo toàn nguyên vẹn định dạng tiêu đề chuyển cảnh viết hoa toàn bộ tại p000001, dấu chấm lửng mở đầu lời thoại tại p000010, điệp ngữ ba lần “Thời gian, thời gian, lại là thời gian.” tại p000011, cùng chính xác thời gian, phủ định và mức độ chắc chắn của các cấu trúc giả định và điều kiện (mức độ giảm nhẹ “phần nào” và phạm vi “nhìn chung” ở p000004; giả định dự kiến trước chiến tranh đối lập với thực tế ở p000008, p000009 và p000012; phủ định ở p000011, p000012; phép so sánh giả định “chẳng khác nào hất một chén nước nhỏ vào đám cháy dữ dội” và mệnh đề nhượng bộ giả định “Ngay cả khi họ có thể ứng phó nhanh chóng” ở p000013; giả định tương lai tùy thuộc tốc độ ở p000016; mệnh đề thời gian giả định ở p000017; giả định tiền đề chiến lược ở p000018). (4) Hoàn toàn không sử dụng dấu nhấn mạnh Markdown `*...*` ở bất kỳ đoạn nào trong toàn bộ 19/19 đoạn do `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` theo đúng DEC-P01-002'
  alternatives_vi:
  - của Đế quốc (thay cho phản thân sở hữu “của mình” trong cụm “lực lượng tác chiến chủ lực của mình” tại câu 2 p000008 — ưu tiên “của mình” để câu văn xuôi tự nhiên, tránh lặp lại từ “Đế quốc” ngay trong cùng mệnh đề và vẫn tuân thủ tuyệt đối DEC-P01-001)
