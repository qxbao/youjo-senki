  rationale: "Kế thừa đồng bộ hệ thống danh xưng và thuật ngữ quân sự – chiến lược từ Chương 1–4: “VĂN PHÒNG BỘ TỔNG THAM MƯU, PHÒNG HỘI NGHỊ SỐ 1” / “phòng hội nghị số 1 thuộc Văn phòng Bộ Tổng Tham mưu” / “Bộ Tổng Tham mưu” (b19-general-staff-war-room-and-high-command-ranks-terms / ch-01-b19 p000030–p000031, p000001, p000003, p000011, p000012), sự phân biệt giữa “mặt trận phía tây” (ch-03-b12 p000243, ch-03-b13 p000262, ch-04-b16 p000111, p000002, p000013) và “chiến trường phương Tây” (ch03-b04-northern-western-theater-propaganda-and-homefront-unit-deployment-terms / ch-03-b04 p000053, p000003), “Chuẩn tướng von Zettour” / “Zettour” (ch-01-b19 p000034, ch-04-b11 p000233, p000003, p000011, p000017, p000019), “Chuẩn tướng von Rudersdorf” (ch-01-b19 p000033, ch-04-b02 p000027, p000017), “Cục Quân vụ” (ch04-b11-war-college-library-zettour-service-corps-and-white-silver-terms / ch-04-b11 p000233–p000234, ch-04-b14 p000059, ch-04-b16 p000102, p000003, p000014, p000018, p000019), “Cục Tác chiến” (ch04-b17-zettour-world-war-shock-and-lergen-operations-division-promotion-terms / ch-04-b17 p000144, p000146, ch-04-b18 p000150, p000165, p000015), “Cộng hòa François” (b20-neighboring-powers-and-geopolitical-treaty-terms / ch-01-b20 p000046, p000005), “phòng tuyến” (ch-01-b20 p000060, ch-03-b13 p000282, ch-04-b15 p000079, p000005, p000008), “tiền tuyến” và “thương vong” (ch-04-b22 p000249, p000005), “tung quân nhỏ giọt” (b20-general-staff-strategic-debate-and-plan-315-terms / ch-01-b09, ch-01-b20 p000044, p000005), “tuyến sau” và “pháp sư địch” (ch-03-b03 p000041, ch-03-b13 p000279, ch-03-b17 p000369, p000006), “tập kết”, “điều động lại” và “tái tổ chức” (ch03-b13-western-army-group-delaying-battle-redeployment-and-mobile-defense-terms / ch-03-b12 p000260, ch-03-b13 p000271, p000272, p000275, p000277, p000007–p000009, p000012), “lực lượng chủ lực” và “Đại Quân” (ch-01-b03 p000040, ch-03-b03 p000049, ch-03-b04 p000053, ch-03-b13 p000265, ch-04-b18 p000157, p000007–p000009, p000012, p000016), “Cụm tập đoàn quân phương Tây” (vol02-ch02-b12-western-army-group / ch-03-b01 p000010, ch-03-b13 p000264, ch-04-b20 p000202, p000008), “kế hoạch quốc phòng”, “Kế hoạch 315”, “chiến lược quốc phòng” và “chiến tranh hai mặt trận” (b19-plan-315-and-interior-lines-strategy-terms, b20-general-staff-strategic-debate-and-plan-315-terms / ch-01-b19 p000039, p000041, p000043, ch-01-b20 p000058, p000061, ch-04-b16 p000105, p000008, p000018), “nội tuyến” / “chiến lược nội tuyến” (vol02-ch02-b05-interior-lines / ch-01-b19 p000043, ch-03-b03 p000044, ch-03-b13 p000282, ch-04-b18 p000159, ch-04-b19 p000186, p000012, p000019), “sự linh hoạt chiến lược” (ch-04-b14 p000070, p000012), “Central” (b05-central-command, ch-03-b12 p000240, ch-03-b13 p000265, p000013), “hỏa lực” (ch-04-b22 p000246, p000015) và ẩn dụ “chữa cháy” (ch-03-b14 p000293, p000017); khóa tạm “đạo quân phía tây” (viết thường để phân biệt với phiên hiệu “Cụm tập đoàn quân phương Tây” ở p000008), “vùng công nghiệp Rhine” và “sức chiến đấu” (p000005), “lực lượng tác chiến chủ lực” (p000008), “hệ thống đường sắt”, “nút thắt cổ chai cản trở khả năng cơ động” và “bức tường phòng thủ” (p000009), “các lực lượng thường trực” (đồng bộ với “quân thường trực” ở ch-03-b13 p000263) và “lực lượng cứu viện” (p000013), “một đơn vị có khả năng phản ứng nhanh” (p000014), “lực lượng cơ động” (p000015), “lịch trình đường sắt” (p000016 — đồng bộ với “lịch trình tàu hỏa” ở ch-01-b19 p000043), cùng “lực lượng phản ứng nhanh” và “đơn vị dự bị” (p000017)."
