- id: ch03-b20-tanya-assault-sweep-serebryakov-disambiguation-pronouns-and-five-emphases
  source_term: tanya_assault_sweep_serebryakov_disambiguation_pronouns_and_five_emphases_ch03_b20
  proposed_vi: 'tiếp nối trực tiếp ch-03-b19 (p000391–p000415) trong đợt xung kích càn quét của Đại đội Pháp sư Xung kích số 205 trên mặt trận Rhine cho tới ngắt cảnh (`space_break`) sau p000433, toàn bộ 18 đoạn của lô ch-03-b20 (chapter007.xhtml/p000416–p000433) xoay quanh trần thuật ngôi thứ ba, độc thoại nội tâm ngôi thứ nhất của Thiếu úy Tanya Degurechaff và 3 câu thoại ngắn trên chiến trường, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) Trong trần thuật ngôi thứ ba và độc thoại nội tâm của Tanya: quy chiếu Tanya trong lời kể ngôi thứ ba nhất quán bằng tên riêng “Tanya” / “Thiếu úy Tanya Degurechaff” (p000420, p000423, p000426, p000430, p000431, p000432) và đại từ “nó” kết hợp phản thân “mình” (p000420, p000423, p000427, p000432 — tuyệt đối không dùng đại từ “cô” cho Tanya); trong độc thoại nội tâm ngôi thứ nhất và lời tự nhủ thành tiếng của Tanya, dùng đại từ tự quy chiếu “Mình” / “mình” (p000424, p000429, p000430, p000432, p000433) và đại từ ngôi thứ nhất số nhiều “chúng ta” khi nói về nhiệm vụ càn quét chung của đại đội trên chiến trường (p000421). (2) Phân biệt rạch ròi quy chiếu chủ thể tại p000423 khi cả Tanya và Hạ sĩ Serebryakov cùng xuất hiện trong trần thuật ngôi thứ ba: dùng “Tanya” / “nó” kết hợp phản thân “mình” cho Tanya, và dùng “Hạ sĩ Serebryakov” / “cô ấy” cho Serebryakov ở các câu tiếp theo để loại bỏ hoàn toàn nguy cơ mơ hồ quy chiếu. (3) Xử lý đại từ ngôi thứ hai phiếm chỉ trong nguồn theo đúng quy ước direct-address choice (pending-terms.yml): lược đại từ trong mệnh đề điều kiện tại p000416 (“Nếu gặp may, một pháp sư sẽ lọt vào tầm ném...”), dịch thành “ta” khái quát trong lời cảm thán tại p000425 (“những gì ta có thể làm được chỉ bằng một chút huấn luyện”), và tích hợp tự nhiên vào cấu trúc phản thân tự quy chiếu “theo đúng ý mình” trong câu nội tâm của Tanya ở đầu p000432. (4) Bảo toàn nguyên vẹn các dấu gạch ngang dài giải thích/chêm câu (p000416, p000428, p000430), câu hỏi nội tâm mỉa mai ở đầu p000420, cùng chính xác thời gian, phủ định và mức độ chắc chắn của các mệnh đề điều kiện/giả định (điều kiện may mắn và giới hạn lựa chọn ở p000416; phỏng đoán “Có lẽ...” và mệnh đề nhượng bộ “ngay cả... cũng...” ở p000417; giả định thông thường đối lập với thực tế “Thông thường, quân tiếp viện tiềm tàng của địch sẽ là một mối lo ngại, nhưng lần này...” ở p000422; đối lập thời gian trước đây – hiện tại và một tháng trước – hiện tại cùng phủ định “không bao giờ hạ lớp vỏ phòng thủ xuống” và “chẳng tệ chút nào” ở p000423; suy luận cảm thán “hẳn phải... đến mức nào mới...” ở p000427; câu hỏi gián tiếp “liệu họ có nên... hay không” ở p000429; ước muốn trái thực tế “nhưng mình thực sự ước sao người ta hiểu được...” ở p000430; phủ định so sánh tuyệt đối “không có tội ác nào lớn hơn chiến tranh” ở p000431; mệnh đề nhượng bộ “Dù đó không phải là đất nước của mình...” và phỏng đoán “Có lẽ lúc nào cũng sẽ có...” ở p000432). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` tại đúng 4 đoạn (tổng cộng 5 cụm nhấn mạnh) tương ứng 1:1 với các thẻ `<html:em>` trong `xhtml` nguồn theo DEC-P01-002: câu hỏi nội tâm đầu p000420 (`*Chẳng phải điều đó quá hiển nhiên sao?*`), câu châm ngôn đầu p000426 (`*Đừng bao giờ đánh giá thấp tiềm năng của con người.*`), vế than thở đầu p000431 (`*Xét về mặt lãng phí nguồn nhân lực quý giá, không có tội ác nào lớn hơn chiến tranh*`), cùng 2 cụm tách biệt trong p000432 (`*Mọi chuyện chẳng bao giờ diễn ra theo đúng ý mình*` và `*lãng phí*`), giữ 14/18 đoạn còn lại hoàn toàn không có dấu `*`'
  alternatives_vi:
  - người ta có thể làm được (thay cho “ta có thể làm được” ở câu 2 p000425 — cả hai đều tự nhiên theo direct-address choice, ưu tiên “ta” vì gọn và hợp giọng cảm thán thành tiếng của Tanya trên chiến trường)
