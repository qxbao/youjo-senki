  rationale: "Kế thừa đồng bộ hệ thống danh xưng và thuật ngữ đã khóa tạm từ Chương 0–2 và ch-03-b01 → ch-03-b19: “Tanya” / “Thiếu úy Tanya Degurechaff” (b02-second-lieutenant, ch-03-b19 p000399), “Hạ sĩ Serebryakov” (ch-03-b17 p000358, p000364), “Trung úy Schwarkopf” (ch-03-b11–b19), “Quân đội Cộng hòa” / “Cộng hòa” (ch-03-b17, b18), “pháo 120 mm” (ch-03-b19 p000392), “màn hỏa lực tập trung dày đặc” (đồng bộ “Hỏa lực tập trung” ở ch-01-b08 và ch-03-b19 p000392), “đại đội thiếu hụt quân số” (đồng bộ “thiếu hụt quân số” ở ch-03-b12 p000244), “thuật thức” / “thuật thức gây nổ” / “thuật thức ma pháp” (P01-formulas), “lớp vỏ phòng thủ” (ch-01-b14 p000258, ch-03-b02 p000025, ch-03-b19 p000415), “phẩm giá con người” và “ý chí tự do” (ch-01-b13 p000222, ch-02-b13 p000143, ch-03-b16 p000340, ch-03-b17 p000362), “Sở chỉ huy”, “Viễn Đông”, “Liên bang”, “vốn con người” (P03-human-capital trong canon/glossary-pending.yml, phân biệt rõ với “nguồn nhân lực” trong cùng đoạn p000428 và p000431–p000432), “hợp đồng” (b07-contract) và “tổ quốc” (ch-03-b17 p000365); khóa tạm “lựu đạn” (p000416), “hệ thống chỉ huy”, “các pháp sư yểm trợ trực tiếp” và thành ngữ “lấy độc trị độc” (p000417), “thịt băm” (p000418, p000428), “các chỉ huy và thiết bị liên lạc của địch” cùng “những bộ điện đài đeo lưng đặc trưng” (p000419, p000420), “cụm binh lực hỗn hợp”, “đội xung kích cơ động” và “truy quét đám bộ binh còn sót lại” (p000422), “buổi diễn tập tác chiến” (p000424), “Lãnh địa Tự trị” và “sắt thép áp đảo máu thịt” (p000427), “tinh thần chủ động” (p000428), “nguyên tắc thị trường” (p000429), “những mảnh vụn hữu cơ” và khẩu hiệu “xa xỉ là kẻ thù” (p000432)."
