  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md trong cảnh càn quét bộ binh Cộng hòa và độc thoại về vốn con người của Tanya ở ch-03-b20: giữ đại từ “Tanya” / “nó” trong trần thuật và “Mình” / “mình” trong độc thoại nội tâm / lời tự nhủ (tuyệt đối không dùng “cô” cho Tanya), phân biệt rõ với “cô ấy” quy chiếu Hạ sĩ Serebryakov tại p000423, xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice tại p000416, p000425 và p000432, bảo toàn đầy đủ các giả định/phủ định và chính xác 5 cụm nhấn mạnh `*...*` tại p000420, p000426, p000431, p000432."
