locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000076
  locks:
  - Giữ nguyên dòng tiêu đề chuyển cảnh viết hoa “CÙNG NGÀY, LIÊN MINH ENTENTE, TRÊN BẦU TRỜI NORDLAND”, bảo toàn nguyên trạng địa danh “NORDLAND” theo nguồn mà không tự ý đồng nhất với “Norden”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000077
  locks:
  - Giữ đúng phạm vi nhấn mạnh chữ nghiêng Markdown `*Thượng đế ơi, tại sao? Sao chuyện này lại có thể xảy ra?*` theo DEC-P01-002, cấp bậc và họ tên “Trung tá Anson Sue”, đại từ phản thân “mình” đi với đại từ trần thuật “ông”, cùng các thuật ngữ “Quân đội Đế quốc”, “pháp sư không quân của Liên minh Entente”, cấu trúc đính chính phủ định “Không, bất cứ người lính tỉnh táo nào cũng sẽ gọi đó là một cuộc thảm sát, chứ không phải trận chiến.” và cặp đối chiếu “xe cơ giới không bọc giáp — bộ binh không giáp”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000078
  locks:
  - Giữ lời kêu thất thanh qua vô tuyến “Chuyện này đâu giống những gì bọn tôi được nghe! Bọn khốn đó nổ súng rồi!”, bảo toàn đúng nghĩa thông tin được phổ biến trước đó sai lệch với thực tế.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000079
  locks:
  - Giữ tiếng gọi cấp cứu dồn dập “Cứu với! Quân y! Mau lên! Lại đây!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000080
  locks:
  - Giữ khẩu lệnh rút quân và che chắn “Lùi lại! Rút lui! Dựng màn khói!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000081
  locks:
  - Giữ tiếng kêu hoảng loạn của thương binh “Cánh tay tôi! Tôi mất một cánh tay rồi!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000082
  locks:
  - Giữ câu than thiếu chi viện “Chúng ta vẫn chưa có yểm trợ đường không…!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000083
  locks:
