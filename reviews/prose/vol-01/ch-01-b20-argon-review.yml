  volume: vol-01
  chapter: 1
  rationale: "Kế thừa đồng bộ “Liên minh Entente”, “Đế quốc”, “Norden”, “Albion, François” (b01–b19), “Hiệp ước Londinium” (b06, b14) và “mối đe dọa tiềm tàng” (b17); khóa tạm tên đầy đủ của ba cường quốc láng giềng “Vương quốc Ildoa”, “Cộng hòa François”, “Liên bang Russy” (giữ nguyên tên riêng theo style guide) và các thuật ngữ ngoại giao – địa chính trị “vấn đề địa chính trị”, “môi trường địa chính trị”, “đường biên giới trên thực tế”."
