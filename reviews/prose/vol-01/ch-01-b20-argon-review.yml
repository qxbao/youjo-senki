- id: b20-war-room-debate-pronouns-and-source-consistency-p000053
  source_term: General Staff War Room third-person narrator pronouns for Ludwig, Rudersdorf, Zettour, and collective Empire/General Staff, conference dialogue pronouns/vocatives, collective italicized inner thought in p000061, and source subject preservation in p000053/p000055
  proposed_vi: trần thuật ngôi thứ ba tại Phòng Tác chiến thuộc Bộ Tổng Tham mưu tiếp tục quy chiếu các tướng lĩnh cấp cao (Trung tướng von Ludwig, Chuẩn tướng von Rudersdorf, Chuẩn tướng von Zettour) nhất quán bằng đại từ trang trọng “ông” kết hợp tên riêng/chức danh và đại từ phản thân “mình” / “bản thân” (p000047, p000048, p000051, p000055 — đồng bộ b19, tuân thủ nghiêm ngặt DEC-P01-001: không dùng “nó” cho nhân vật ngoài điểm nhìn của Tanya; từ “nó” tại p000048 chỉ quy chiếu danh từ bất động vật “Chiến thắng”), đồng thời quy chiếu tập thể Đế quốc / Bộ Tổng Tham mưu bằng “họ” (p000047, p000048, p000053–p000055, p000058, p000061, p000063); trong đối thoại hội nghị, người phát biểu tự xưng “Tôi” / “tôi”, gọi tập thể Đế quốc / Bộ Tổng Tham mưu là “chúng ta” / “Chúng ta” / “ta”, Tổng Tham mưu trưởng Ludwig gọi trực tiếp cấp dưới bằng tên “Zettour” (p000044), “Rudersdorf” (p000049), Rudersdorf nhắc đồng cấp là “Chuẩn tướng von Zettour” (p000048), thưa với cấp trên bằng hô ngữ “Thưa Tướng quân, với tất cả sự kính trọng” (p000050 — giữ đúng cấp tướng chung như nguồn), và các câu chất vấn trực diện giữa các phe trong phòng họp dùng đại từ ngôi thứ hai số nhiều trang trọng “Các vị” (p000056, p000059); tại câu in nghiêng thể hiện tiếng lòng chung của Bộ Tổng Tham mưu ở cuối p000061, bảo toàn `*...*` theo DEC-P01-002 và dùng “chúng ta” / “ta” / “Đế quốc”; tại p000053 và p000055, giữ nguyên chủ ngữ “Zettour” ở cả hai đoạn đúng theo văn bản nguồn tiếng Anh mà không tự ý đổi tên nhân vật để hợp thức hóa mạch lập luận
  alternatives_vi:
  - Các ngài (thay cho “Các vị” trong các câu hỏi chất vấn tại phòng họp ở p000056, p000059 — ưu tiên “Các vị” đồng bộ với plural-address-p000076 trong sổ pending và phản ánh đúng giọng tranh biện ngang hàng/tập thể quyết liệt tại hội nghị Bộ Tổng Tham mưu)
