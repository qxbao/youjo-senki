  volume: vol-01
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và nguyên tắc trung thành với văn bản nguồn: duy trì nhất quán hệ đại từ nghị sự Bộ Tổng Tham mưu từ b19, đồng thời bảo toàn nguyên trạng chủ ngữ Zettour ở p000053 và p000055 theo đúng nguồn tiếng Anh (ghi nhận bất nhất của bản dịch tiếng Anh mà không tự sửa đổi văn bản)."
