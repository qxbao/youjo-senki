  rationale: "Kế thừa đồng bộ “tung quân nhỏ giọt” (b09), “quân đoàn dã chiến”, “Tổng Tham mưu trưởng Ludwig”, “Chuẩn tướng von Zettour”, “tổng tư lệnh tối cao”, “Bộ Tổng Tham mưu”, “chính sách quốc phòng”, “Kế hoạch 315” và “cường quốc” (b19); khóa tạm các thuật ngữ tác chiến – chiến lược quốc phòng “động viên nhỏ giọt” (đối ứng trực tiếp với “tung quân nhỏ giọt” ở câu trước), “mục tiêu chiến thuật”, “cuộc xâm lược quy mô lớn”, sự phân biệt giữa “chính sách quốc phòng” (defense policy), “chương trình quốc phòng” (defense program), “kế hoạch quốc phòng” (defense plan) và “chiến lược quốc phòng” (defense strategy), cùng “an ninh quốc gia”, “hiệu ứng domino xâm lược”, “các đợt phản công hiệp đồng”, “vòng vây” và “phòng tuyến”."
