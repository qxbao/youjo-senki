  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md khi chuyển từ điểm nhìn của Visha (ch-03-b10) trở lại điểm nhìn của Tanya (ch-03-b11): giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“Mình” / “mình”) và trần thuật/tự tách mình ở ngôi thứ ba (“Tanya” / “nó”), đồng bộ đại từ “Anh” / “anh ấy” cho Trung úy Ihlen Schwarkopf với ch-04-b07, giữ chuẩn mực xưng hô quân đội giữa Tanya với cấp trên và đại đội trưởng mới, đồng thời bảo toàn chính xác các giả định, câu điều kiện và vị trí nhấn mạnh in nghiêng duy nhất tại p000223."
