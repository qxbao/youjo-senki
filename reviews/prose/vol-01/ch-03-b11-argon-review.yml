- id: ch03-b11-tanya-pov-reassignment-and-schwarkopf-reporting-pronouns-conditionals-and-emphasis
  source_term: tanya_pov_reassignment_and_schwarkopf_reporting_pronouns_conditionals_and_emphasis_ch03_b11
  proposed_vi: 'chuyển từ điểm nhìn tự sự ngôi thứ nhất của Visha ở cuối lô ch-03-b10 (p000220) trở lại điểm nhìn của Tanya vài ngày trước đó tại Thủ đô Đế quốc và căn cứ của Đại đội Pháp sư Xung kích số 205 trong toàn bộ 19 đoạn của lô ch-03-b11 (p000221–p000239), tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay độc thoại nội tâm) và DEC-P01-002: trong các câu/đoạn độc thoại nội tâm và tự sự ngôi thứ nhất của Tanya (câu 1, 4–5 p000223; p000225; p000226; câu 1 p000229; p000230; p000231; p000232; câu 2–3 p000234; câu 2–3 p000238), dùng nhất quán đại từ tự quy chiếu “Mình” / “mình” ở ngôi thứ nhất số ít, và dùng “cả hai chúng mình” / “Chúng tôi” khi gộp cả Tanya và Trung úy Schwarkopf với tư cách những người lính tại câu 3–4 p000234; trong các câu trần thuật ngôi thứ ba và những câu Tanya tự tách mình để quan sát ở ngôi thứ ba (câu 2–3 p000223; câu 2 p000228; câu 3–5 p000229; câu 1 p000237), quy chiếu Tanya bằng danh xưng “Thiếu úy Ma pháp Tanya Degurechaff” / “Tanya” cùng đại từ “nó” kết hợp phản thân “mình”, bảo toàn nguyên vẹn sự chuyển dịch ngôi tự sự ngay trong cùng một đoạn văn tại p000223 và p000229 (lưu ý đại từ “nó” ở cuối câu 2 p000223 chỉ quy chiếu danh từ bất động vật là thông báo thuyên chuyển); quy chiếu người quản lý ký túc xá tại p000230 bằng “ông ấy” / “ông”, và quy chiếu Trung úy Ihlen Schwarkopf bằng “Anh” trong câu trần thuật hành động tại p000234 (đồng bộ ch-04-b07 p000145) cùng “Anh ấy” / “anh ấy” trong các câu đánh giá nội tâm của Tanya tại p000237–p000238; trong đối thoại quân ngũ giữa sĩ quan cấp trên tại Thủ đô Đế quốc và Tanya (p000222, p000224, p000227, p000228), cấp trên tự xưng “chúng tôi” (đại diện cơ quan/cấp chỉ huy) và gọi Tanya là “Thiếu úy” / “Cô” / “cô”, còn Tanya đáp lễ “Cảm ơn ngài ạ.”; trong đối thoại trình diện và giao việc giữa Trung úy Ihlen Schwarkopf và Tanya (p000233–p000236, p000239), Tanya báo cáo trình diện trang trọng (p000233), gọi “Thưa Chỉ huy Schwarkopf”, tự xưng “tôi” và thưa “ngài ạ” / “thưa ngài” (p000235, p000239), còn Trung úy Schwarkopf tự xưng “tôi”, dùng “Chúng ta” khi rủ bắt đầu công việc và gọi Tanya là “Thiếu úy” / “Thiếu úy Degurechaff” / “cô” / “Cô” (p000234, p000236); bảo toàn đầy đủ câu hỏi xác nhận ngắn của Tanya (p000222) và câu hỏi trực tiếp của Trung úy Schwarkopf về kinh nghiệm chỉ huy trung đội (p000236), giả định trái thực tế trong quá khứ (`những công việc mà trước kia mình sẽ phải tự xoay xở một mình`), giả định tình huống xấu nhất và mệnh đề phủ định tại p000226, cùng các mệnh đề phủ định và cấu trúc điều kiện giả định tại p000234 và p000238; bảo toàn chính xác duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tương ứng với thẻ `<html:em>` trong nguồn tại câu 3 p000223 (`*cuối cùng*`) theo đúng DEC-P01-002 (18/19 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)'
  alternatives_vi:
  - ông ấy (thay cho “Anh” / “Anh ấy” / “anh ấy” khi quy chiếu Trung úy Ihlen Schwarkopf tại p000234, p000237, p000238 — ưu tiên “Anh” / “anh ấy” để đồng bộ hoàn toàn với đại từ đã dùng cho Trung úy Schwarkopf tại ch-04-b07 p000145) / chúng tôi (thay cho “cả hai chúng mình” tại câu 3 p000234 — ưu tiên giữ “cả hai chúng mình” ở câu 3 nối tiếp mạch tự sự nội tâm “mình” ở câu 2 trước khi chuyển sang nhận định khái quát “Chúng tôi đều là những người lính” ở câu 4)
