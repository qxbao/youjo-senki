  proposed_vi: (VÀI NGÀY TRƯỚC ĐÓ) THỦ ĐÔ ĐẾ QUỐC / tái phân công / bộ phận nghiên cứu công nghệ / chuột bạch / nhân viên thử nghiệm chuyên trách / quả cầu tính toán Type 95 / Thiếu úy Ma pháp Tanya Degurechaff / giới chỉ huy cấp cao / át chủ bài / trung đội trưởng / Trung đội 3 thuộc Đại đội Pháp sư Xung kích số 205 / đơn vị huấn luyện / tiền tuyến / học viện / chỉ huy một trung đội / cấp dưới / cấp trên / lá chắn sống / Thiếu úy / Cánh Bạc / Huy hiệu Xung kích Không quân / ký túc xá / quân phục / trợ cấp quân trang / đặt may riêng / túi hành lý sĩ quan / người quản lý ký túc xá / đợt biệt phái tạm thời / lệnh điều động / mệnh lệnh điều động ra tiền tuyến / Vùng Nhận dạng Phòng không / điểm tập kết được chỉ định / lục quân / hậu phương / đại đội trưởng / Trung úy Ihlen Schwarkopf / điều lệnh quân đội / Chỉ huy Schwarkopf / Thiếu úy Degurechaff / sĩ quan chỉ huy / pháp sư hết sức chính thống / trung úy / huân chương / kinh nghiệm thực chiến / vị quân nhân huyền thoại từng làm hỏng mặt trận Miến Điện – Imphal / “tai nạn đáng tiếc”
  alternatives_vi:
  - Điều chuyển công tác (thay cho “tái phân công” tại p000222, p000224) / phòng nghiên cứu công nghệ (thay cho “bộ phận nghiên cứu công nghệ” tại p000223) / Trung đội Ba thuộc Đại đội Pháp sư Xung kích số 205 (thay cho “Trung đội 3 thuộc Đại đội Pháp sư Xung kích số 205” tại p000224, p000233) / bia đỡ đạn (thay cho “lá chắn sống” tại p000226) / Huy hiệu Xung kích Trên không (thay cho “Huy hiệu Xung kích Không quân” tại p000227) / phụ cấp trang phục (thay cho “trợ cấp quân trang” tại p000229) / đợt công tác tạm thời (thay cho “đợt biệt phái tạm thời” tại p000230) / điểm hội quân được chỉ định (thay cho “điểm tập kết được chỉ định” tại p000231) / quy định quân đội (thay cho “điều lệnh quân đội” tại p000234) / pháp sư hết sức bài bản (thay cho “pháp sư hết sức chính thống” tại p000237) / mặt trận Burma – Imphal (thay cho “mặt trận Miến Điện – Imphal” tại p000238)
