  rationale: "Kế thừa đồng bộ “THỦ ĐÔ ĐẾ QUỐC” (ch-01-b15 p000275), “tái phân công” (ch-02-b08 p000041), “chuột bạch” (ch-02-b02 p000043), “nhân viên thử nghiệm chuyên trách” (ch-03-b02 p000026), “quả cầu tính toán Type 95” (chapter1_b01_pending_terms), “Thiếu úy Ma pháp Tanya Degurechaff” (ch-03-b01 p000002), “giới chỉ huy cấp cao” (b04-the-brass), “át chủ bài” (ch-02-b02 p000034), “trung đội trưởng” (ch-03-b05 p000082, ch-03-b10 p000193), “đơn vị huấn luyện” (b05-instructor-unit, ch-02-b01/b02/b08/b09/b15, ch-04-b03), “tiền tuyến”, “học viện” (ch-03-b01), “chỉ huy một trung đội” (ch-04-b03 p000050), “cấp dưới” (ch-04-b07 p000145, ch-04-b13), “cấp trên” (ch-02-b02/b08/b15, ch-03-b04), “Thiếu úy”, “Cánh Bạc” (ch-03-b10 p000206, p000208), “ký túc xá” (ch-03-b09/b10), “quân phục” (ch-03-b10 p000187), “Vùng Nhận dạng Phòng không” (chapter6_b14_reviewer_recommendations), “lục quân” (ch-03-b08, ch-03-b10 p000198), “hậu phương” (ch-03-b04, ch-03-b10 p000192), “đại đội trưởng” (ch-03-b06 p000101, ch-03-b07 p000102), “Trung úy Ihlen Schwarkopf” / “Chỉ huy Schwarkopf” (đồng bộ với “Trung úy Schwarkopf” ở ch-04-b07 p000145), “Thiếu úy Degurechaff” (ch-03-b08/b09), “sĩ quan chỉ huy” (ch-01-b18), “pháp sư”, “trung úy”, “huân chương” (ch-03-b08 p000136) và “kinh nghiệm thực chiến” (ch-04-b02/b08); khóa tạm “bộ phận nghiên cứu công nghệ” (đồng bộ với “bộ phận công nghệ” ở ch-02-b12 / ch-03-b08 và “nghiên cứu công nghệ ma pháp” ở ch-02-b09), phiên hiệu đơn vị mới “Trung đội 3 thuộc Đại đội Pháp sư Xung kích số 205” (xuyên suốt p000224, p000233), “lá chắn sống”, “Huy hiệu Xung kích Không quân”, “trợ cấp quân trang”, “đặt may riêng”, “túi hành lý sĩ quan” (phân biệt với “cặp tài liệu sĩ quan” ở ch-04-b07 p000150), “người quản lý ký túc xá”, “đợt biệt phái tạm thời”, “lệnh điều động”, “mệnh lệnh điều động ra tiền tuyến”, “điểm tập kết được chỉ định”, “điều lệnh quân đội”, “pháp sư hết sức chính thống”, liên hệ lịch sử thế giới cũ “vị quân nhân huyền thoại từng làm hỏng mặt trận Miến Điện – Imphal” và cụm từ trong ngoặc kép “tai nạn đáng tiếc”."
