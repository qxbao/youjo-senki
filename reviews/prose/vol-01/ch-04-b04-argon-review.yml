  rationale: "Kế thừa đồng bộ “Thiếu tá von Lergen” / “Lergen”, “công tâm”, “đánh giá lại”, “bên Tình báo”, “bảo mật” và “lộ trình tinh hoa” (ch-04-b01/b02), “bất thường” (ch-01-b18 p000026, ch-04-b03 p000041), “Quân đội Đế quốc” (b06-imperial-army) và “Thượng đế” (review-God); khóa tạm “nhân cách”, “trung tâm đầu não của Quân đội Đế quốc”, “kỳ đánh giá tâm thần”, “bài kiểm tra năng lực bảo mật”, “đợt thẩm định”, “lòng mộ đạo”, “các quân nhân chuyên nghiệp đã trưởng thành”, “những kẻ kỳ quặc” và “được ghi vào biên bản” / “bị ghi vào biên bản”."
