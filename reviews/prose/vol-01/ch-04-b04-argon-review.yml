- id: ch04-b04-committee-dialogue-lergen-interior-monologue-pronouns-and-emphasis
  source_term: Imperial War College Admissions Committee third-person narration pronouns for Tanya, Rudersdorf, Zettour, Valkov, Lergen, and field officers in p000059–p000087, Lergen first-person interior monologue pronouns and derogatory/wary reference to Tanya in p000080/p000083/p000084, conference dialogue pronouns between committee members, Brigadier General von Zettour, and Major von Lergen in p000061–p000063/p000065/p000069–p000073/p000075/p000078–p000079/p000081–p000082/p000085–p000086, counterfactual conditionals in p000060/p000064/p000080/p000087, and exact preservation of italicized spans in p000080/p000083/p000084
  proposed_vi: tiếp nối cảnh họp của Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc từ ch-04-b03 kết hợp độc thoại nội tâm của Thiếu tá von Lergen ở cuối lô (p000080, p000083, p000084), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không tự mở rộng sang điểm nhìn của hội đồng hay Lergen; lưu ý từ “nó” tại p000059 và p000065 hoàn toàn chỉ quy chiếu danh từ bất động vật là “bài viết” và “thư tiến cử”): trong lời kể ngôi thứ ba khách quan (p000060, p000064, p000066–p000068, p000074, p000076, p000077, câu cuối p000080), quy chiếu Trung úy Tanya Degurechaff nhất quán bằng đại từ “cô” / “Cô” (và danh ngữ “cô gái bất thường này” tại p000077), đồng bộ hoàn toàn với ch-04-b03 và ch-01-b15 → ch-01-b18; quy chiếu Chuẩn tướng von Rudersdorf, Chuẩn tướng von Zettour, Chuẩn tướng von Valkov và Thiếu tá von Lergen bằng đại từ trang trọng trung tính “ông” kết hợp phản thân “mình” (p000065, p000067, p000068, p000071, p000074, p000076, p000077, p000087; tại p000067 làm rõ danh ngữ “con người này” khi Zettour cảm nhận sự sắc sảo của Valkov để tránh nhập nhằng đại từ); quy chiếu các sĩ quan cấp tá đã đọc bài viết bằng “Họ” (p000059); trong các câu độc thoại nội tâm trực tiếp của Lergen (p000080, p000083, p000084), Lergen tự quy chiếu bằng “Mình” / “mình” và gọi Tanya bằng “cô ta” để khắc họa thái độ dè chừng, ghê sợ trước sự bất thường của Tanya, đồng bộ hoàn toàn với nội tâm của Lergen ở ch-01-b15 (p000280) và ch-01-b18 (p000021); trong lời thoại tại cuộc họp: các thành viên hội đồng phát biểu (p000061, p000063) tự xưng “tôi” / “Tôi”, gọi hội đồng là “các vị” (p000063 — đồng bộ plural-address-p000076) và quy chiếu Tanya bằng “cô ấy” (p000062); Chuẩn tướng von Zettour (p000065, p000069, p000071, p000073, p000078, p000081, p000085) tự xưng “Tôi” / “tôi”, gọi cấp dưới là Thiếu tá von Lergen bằng “Thiếu tá von Lergen” / “anh” / “Anh” (đồng bộ với Rudersdorf ở ch-04-b02 p000027 và ch-04-b03 p000041) và quy chiếu Tanya bằng “cô ấy”; Thiếu tá von Lergen (p000070, p000072, p000075, p000079, p000082, p000086) tự xưng “Tôi” / “tôi”, đáp lời cấp trên là Chuẩn tướng von Zettour bằng kính ngữ quân phong “thưa Chuẩn tướng, ngài cần gì ạ?” (p000072) / “Rõ, thưa Chuẩn tướng” (p000086) và quy chiếu Tanya bằng “cô ấy” / “Trung úy Degurechaff”; bảo toàn chính xác các cấu trúc giả định tại p000060, p000064, p000080, p000087, và bảo toàn tuyệt đối phạm vi nhấn mạnh `*...*` tại p000080 (tách riêng từ “sẽ” nằm ngoài thẻ nhấn mạnh ở câu 2 và giữ câu cuối không in nghiêng), p000083 (in nghiêng toàn đoạn) và p000084 (in nghiêng toàn câu) theo đúng DEC-P01-002
  alternatives_vi:
  - anh (thay cho “các vị” tại p000063 nếu hiểu câu hỏi chỉ hướng riêng về phía Lergen — ưu tiên “các vị” vì thành viên hội đồng đang đề nghị toàn bộ hội đồng kết thúc việc bàn thảo)
