locked_choices:
- segment_id: YS-LN01/Text/chapter001.xhtml/p000075
  locks:
  - Giữ điểm nhìn ngôi thứ nhất “tôi” và nhận định mở đầu về việc gặp phải “một bất công không thể nói thành lời” khi tỉnh lại.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000076
  locks:
  - Giữ đại từ số nhiều trung tính “Các vị” và câu hỏi nghi vấn về “sinh vật bằng xương bằng thịt”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000077
  locks:
  - Giữ câu hỏi lịch sự nhưng dè chừng “Xin lỗi, ông là ai?” với đại từ “ông” hướng tới ông lão trước mặt.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000078
  locks:
  - Giữ cách gọi “Một ông lão”, hình ảnh so sánh bước ra từ “cuốn tiểu thuyết rập khuôn”, đại từ “tôi” và câu dẫn vào “một trong ba khả năng:”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000079
  locks:
  - Giữ đại từ “Tôi” / “tôi”, tình thái suy đoán “có thể” và hai khả năng “mắt hoặc não tôi đã bị chấn thương nghiêm trọng”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000080
  locks:
  - Giữ đại từ “Tôi” / “tôi”, cặp thuật ngữ phân biệt “ảo tưởng hoặc ảo giác”, và tình thái phỏng đoán “Có lẽ” ở câu sau.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000081
  locks:
  - Giữ đại từ “Tôi” / “tôi”, sự đối lập giữa “giấc mơ” và “hiện thực” ở “thế giới thực”, cùng tình thái khả năng “Có thể tôi vẫn còn ngái ngủ.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000082
  locks:
  - Giữ cách xưng hô số nhiều “Cả đám các ngươi” của Being X và giọng điệu mắng mỏ gay gắt về “tính cách méo mó nhất trần đời”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000083
  locks:
  - Giữ đại từ “Ông ta” và “tôi”, câu hỏi nghi vấn về việc đọc suy nghĩ, và giọng điệu hành chính - pháp lý khi quy kết hành vi xâm phạm “quyền riêng tư” cùng “chuyện mật”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000084
  locks:
  - Giữ lời xác nhận thẳng thừng “Đúng vậy.” và cụm danh từ số nhiều “những kẻ vô tín không có lòng trắc ẩn”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000085
  locks:
  - Giữ đại từ “Tôi”, thuật ngữ “quỷ dữ” và giọng điệu mỉa mai tỉnh rụi khi nhận định chưa bao giờ tưởng tượng quỷ dữ lại có thật.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000086
  locks:
  - Giữ chủ thể phát ngôn là Being X với đại từ ngôi thứ hai “Ngươi” và câu cảm thán phản bác suy nghĩ điên rồ của nhân vật chính.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000087
  locks:
  - Giữ chuỗi tam đoạn luận chặt chẽ, các thuật ngữ “Thượng đế”, “quỷ dữ”, “các quy luật phổ quát”, định danh “Being X”, đại từ “ngài” khi quy chiếu Thượng đế trong mệnh đề giả định trái thực tế, đại từ “tôi” và câu chốt “Lập luận của tôi đã rõ.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000088
  locks:
  - Giữ đại từ số nhiều “Các ngươi”, cụm đồng vị “những kẻ vô tín”, danh xưng “Đấng Tạo Hóa của mình” (bảo toàn quan hệ sở hữu) và cấu trúc câu hỏi trách móc.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000089
  locks:
  - Giữ cụm trích dẫn trong ngoặc kép “Những kẻ vô tín”?, nhận xét ngữ pháp “Số nhiều.”, đại từ “ông ta”, đại từ “tôi” / “mình” / “bản thân”, và cấu trúc phủ định kép có mức độ (“không hẳn ghét bản thân, nhưng cũng chẳng đặc biệt yêu quý mình”).
- segment_id: YS-LN01/Text/chapter001.xhtml/p000090
  locks:
  - Giữ hệ đại từ “ta” - “ngươi” / “các ngươi” của Being X, cụm “những linh hồn loạn trí”, thuật ngữ “giác ngộ” và hai câu hỏi tu từ liên tiếp về tiến bộ nhân loại và việc giải thoát khỏi “xiềng xích trần thế”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000091
  locks:
  - Giữ đại từ “Tôi”, tình thái nhận định điềm tĩnh “cho rằng” và cụm “kết quả của tiến bộ xã hội”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000092
  locks:
  - Giữ thuật ngữ kèm ký hiệu chú thích “Lý thuyết công lý của Rawls²”, cặp đối lập “người có của và người tay trắng”, sự tương phản giữa “một giả thuyết” với thực tế “ngoài đời”, và hai câu hỏi tu từ cuối đoạn.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000093
  locks:
  - Giữ đại từ “tôi” / “mình”, câu hỏi thực dụng về số phận “linh hồn mình” nếu đã chết và thái độ đề nghị bàn bạc “một cách xây dựng”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000094
  locks:
  - Giữ cặp xưng hô “Ta - ngươi” trong thoại của Being X, các thuật ngữ “vòng sinh tử”, “tái sinh”, cụm “kẻ tự xưng là Thượng đế, Being X”, đại từ “ông ta” và “tôi” / “mình” / “chúng ta”, cùng lối tư duy công sở về “bổn phận giải thích”, “nhận trách nhiệm và hành động đúng pháp luật” với tư cách “thành viên xã hội — thành viên của một tổ chức”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000095
  locks:
  - Giữ giọng điệu chấp thuận ngắn gọn “Được thôi.” và cách gọi “ông” trong câu “Vậy cứ làm việc của ông đi.”
- segment_id: YS-LN01/Text/chapter001.xhtml/p000096
  locks:
  - Giữ đại từ “tôi”, cụm “ở kiếp sau”, cặp phân loại “hợp lý và bất hợp lý” và thuật ngữ chuyên ngành “kinh tế học hành vi”.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000097
  locks:
  - Giữ thán từ “…Chậc!” và đại từ tự xưng “Ta” trong câu bộc phát sự mất kiên nhẫn của Being X.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000098
  locks:
  - Giữ đại từ “ông ta” và “tôi” cùng trạng thái “bối rối” trước lời lẩm bẩm.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000099
  locks:
  - Giữ câu hỏi ngắn “Hả?” thể hiện phản ứng bất ngờ của nhân vật chính.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000100
  locks:
  - Giữ đại từ số nhiều “Các ngươi” trong lời than vãn của Being X, các thuật ngữ “giác ngộ”, “vòng sinh tử”, “đức tin”, cùng đại từ “ông ta” và “tôi” ở mệnh đề trần thuật.
- segment_id: YS-LN01/Text/chapter001.xhtml/p000101
  locks:
  - Giữ đại từ “tôi”, cụm định danh “Being X (kẻ tự xưng là Thượng đế)”, góc nhìn công sở “giữ chức vụ khá cao”, và cấu trúc giả định trái thực tế so sánh giữa “anime” (“trò gây cười”) với “ngoài đời”.
