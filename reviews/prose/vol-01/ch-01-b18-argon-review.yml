  - YS-LN01/Text/chapter003d.xhtml/p000028
  - YS-LN01/Text/chapter003d.xhtml/p000029
  volume: vol-01
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001: duy trì ranh giới điểm nhìn của Thiếu tá Lergen đồng bộ với các lô b15–b17 (dùng “ông” cho Lergen và “cô” cho Degurechaff trong lời kể ngôi thứ ba), đồng thời phân biệt chuẩn xác giọng độc thoại nội tâm tự vấn (“mình”, “chúng ta”, “Cô ta”) và giọng trả lời thi vấn đáp chính thức của Tanya (“tôi”)."
