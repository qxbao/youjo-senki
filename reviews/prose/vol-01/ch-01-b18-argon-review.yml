- segment_id: YS-LN01/Text/chapter003d.xhtml/p000022
  locks:
  - Giữ cấu trúc phủ định kép “chẳng phải là... mà cũng không phải là...”, danh xưng “Thiếu úy Degurechaff”, “học viện quân sự”, cụm chen giữa hai dấu gạch ngang dài “cô—con quái vật đội lốt một bé gái này—” và câu trả lời trích dẫn ““Đây là con đường duy nhất dành cho tôi.””.
- segment_id: YS-LN01/Text/chapter003d.xhtml/p000023
