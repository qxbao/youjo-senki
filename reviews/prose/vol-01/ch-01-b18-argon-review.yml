- id: b18-lergen-pov-pronouns-and-entrance-exam-quote-voice
  source_term: Major von Lergen third-person/interior pronouns, Tanya Degurechaff third-person/interior references from Lergen’s POV, and Tanya’s military academy entrance exam quote self-reference
  proposed_vi: trần thuật ngôi thứ ba tiếp nối điểm nhìn của Thiếu tá von Lergen tại Cục Nhân sự, quy chiếu Lergen nhất quán bằng đại từ “ông” kết hợp tên riêng “Lergen” (p000021–p000025, p000027, p000028 — đồng bộ b15–b17); quy chiếu Tanya Degurechaff trong lời kể ngôi thứ ba bằng “cô” kết hợp chức danh/họ “Thiếu úy Degurechaff” / “Degurechaff” và đại từ phản thân “mình” (p000021, p000022, p000025, p000026 — tuân thủ nghiêm ngặt giới hạn DEC-P01-001: không dùng “nó” ngoài điểm nhìn của Tanya); trong các đoạn độc thoại nội tâm in nghiêng của Lergen (p000021, p000024, p000028, p000029), tự quy chiếu ngôi thứ nhất số ít bằng “mình” (p000021 — đồng bộ p000012 ở b17), dùng đại từ ngôi thứ nhất số nhiều “chúng ta” / “Chúng ta” cho tập thể Quân đội Đế quốc / học viện quân sự (p000021, p000024, p000028, p000029), và quy chiếu Degurechaff bằng “Cô ta” ở p000021 để khắc họa sự kinh hãi, dè chừng (đồng bộ p000280 ở b15); trong câu trả lời phỏng vấn kỳ thi tuyển sinh học viện quân sự của Tanya được trích dẫn tại p000022 và lặp lại tại p000025 (“Đây là con đường duy nhất dành cho tôi.”), dùng đại từ tự xưng trang trọng “tôi”
  alternatives_vi:
  - cô ấy (thay cho “Cô ta” trong câu độc thoại nội tâm tại p000021 — ưu tiên “Cô ta” để đồng bộ với p000280 ở b15 và thể hiện rõ tâm lý kinh hãi của Lergen trước sự dị biệt của Degurechaff)
  segment_ids:
  - YS-LN01/Text/chapter003d.xhtml/p000021
  - YS-LN01/Text/chapter003d.xhtml/p000022
  - YS-LN01/Text/chapter003d.xhtml/p000023
