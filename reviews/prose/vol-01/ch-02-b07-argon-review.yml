- id: ch02-b07-tanya-pronouns-pov-dissociation-and-schugel-radio-debate
  source_term: Tanya first-person interior monologue and third-person narration pronouns, intra-paragraph POV shift between third-person Tanya and first-person narrator in p000015, generic conditional pronouns in p000020, italicized emphases in p000011/p000014/p000018, and radio dialogue pronouns between Dr. von Schugel and Tanya
  proposed_vi: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể tự tách góc nhìn nhắc đến danh tính bên ngoài (p000002, p000003, p000015, p000019), dùng tên riêng “Tanya” và đại từ trần thuật “nó” theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01 → ch02-b06 (tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm về Tanya; lưu ý từ “nó” tại p000001, p000008, p000015, p000017, p000018, p000021 quy chiếu quả cầu tính toán nguyên mẫu, còn tại p000006, p000007 quy chiếu chiếc máy bay); trong các đoạn/mệnh đề độc thoại nội tâm ngôi thứ nhất của Tanya (p000008, p000014, p000015, p000020, p000023), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” theo đúng DEC-P01-001; đặc biệt tại p000015, bảo toàn chính xác sự chuyển đổi từ việc nhắc tên riêng “Tanya” ở câu 2 sang đại từ nội tâm “mình” ở câu 3 đúng như văn bản nguồn; tại hai câu điều kiện khái quát ở p000020, dùng cấu trúc lược chủ ngữ phiếm chỉ tự nhiên; bảo toàn chính xác nhấn mạnh `*...*` theo DEC-P01-002 tại p000011 (`*không*`), p000014 (`*bảo trì*`) và p000018 (`*cô*`); trong lời kể/nội tâm (p000003, p000011, p000013–p000015, p000018, p000023), quy chiếu Kỹ sư trưởng Adelheid von Schugel bằng “Gã nhà khoa học điên này”, “vị kỹ sư trưởng”, “vị tiến sĩ” và đại từ ngôi thứ ba “ông ta” / “Ông ta” (đồng bộ ch-02-b04 → ch-02-b06); trong giao tiếp qua vô tuyến (p000001, p000005, p000009, p000010, p000016–p000018, p000021, p000022), Schugel tự xưng “tôi” (p000009), dùng “chúng ta” cho phía tiến hành thí nghiệm (p000022), gọi riêng Tanya là “cô” / “Cô” (p000001, p000016, p000018, p000022 — đồng bộ ch-02-b04 → ch-02-b06) và khi quát gộp đám binh lính thử nghiệm tại p000009 dùng “lũ cục súc các người” / “các người”, còn Tanya tự xưng “Tôi” / “tôi”, gọi Schugel là “Tiến sĩ von Schugel” và dùng đại từ ngôi thứ hai lịch sự “ngài” / “Ngài” (p000010, p000017, p000021 — đồng bộ ch-02-b04 → ch-02-b06)
  alternatives_vi:
  - ông (thay cho “ngài” / “Ngài” trong lời Tanya đáp trả Schugel qua vô tuyến tại p000010, p000017 — ưu tiên “ngài” / “Ngài” để đồng bộ hoàn toàn với ch-02-b04 → ch-02-b06 và giữ sự tương phản giữa nghi thức công vụ chuẩn mực của Tanya với thái độ gào thét của Schugel)
