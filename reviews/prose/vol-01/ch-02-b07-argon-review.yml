  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba (“Tanya” / “nó”), độc thoại nội tâm ngôi thứ nhất (“mình”), sự chuyển đổi từ “Tanya” sang “mình” trong cùng đoạn p000015, ba vị trí nhấn mạnh `*...*` tại p000011/p000014/p000018, và xưng hô qua vô tuyến giữa Schugel với Tanya (“tôi / chúng ta – cô / các người” và “Tôi / tôi – Tiến sĩ von Schugel / ngài”)."
