- id: ch02-b17-tanya-pov-pronouns-being-x-confrontation-and-familiar-space-shift
  source_term: Tanya third-person narration/POV-dissociation pronouns and first-person interior monologue pronouns in p000219–p000252, intra-paragraph POV shifts in p000226/p000242/p000244, direct dialogue pronouns between Tanya and Chief Engineer von Schugel, Tanya’s direct confrontation address to Being X/Devil in p000249, and divine entity address in p000250
  proposed_vi: tiếp nối trực tiếp điểm nhìn của Tanya tại bãi thử nghiệm từ ch-02-b16 (p000219–p000249) chuyển sang không gian quen thuộc sau khi bất tỉnh (p000250–p000252), tuân thủ nghiêm ngặt DEC-P01-001, chapter1_b02_decisions và quy ước ch-02-b01 → ch-02-b08, ch-02-b15, ch-02-b16: trong các câu/mệnh đề trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi chủ thể tự tách góc nhìn nhắc đến danh tính bên ngoài (p000226, p000229, p000242, p000244, p000247), dùng tên riêng “Tanya” và đại từ trần thuật “nó” kết hợp đại từ phản thân “mình” (p000229, p000242, p000247 — tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm của Tanya; lưu ý từ “nó” ở câu cuối p000229 và ở p000235 quy chiếu quả cầu nguyên mẫu Type 95); trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000222, p000225–p000227, p000230, p000235, p000237, p000238, p000242, p000244, p000248, p000251, p000252), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “bản thân” theo đúng DEC-P01-001; đặc biệt bảo toàn chính xác sự chuyển đổi giữa ngôi thứ nhất nội tâm (“mình”) và ngôi thứ ba trần thuật/tự tách góc nhìn (“Tanya” / “nó”) ngay trong cùng đoạn văn tại p000226 (câu 2 nội tâm ngôi thứ nhất “mình”, câu 3 chuyển sang lời kể ngôi thứ ba “Tanya”), p000242 (câu 3–4 lời kể ngôi thứ ba “Tanya” / “nó”, câu 6 chuyển sang độc thoại nội tâm ngôi thứ nhất “mình”), và p000244 (câu 1 nội tâm ngôi thứ nhất “mình”, câu 2 chuyển sang trần thuật ngôi thứ ba “Tanya”); quy chiếu Kỹ sư trưởng Adelheid von Schugel trong lời kể và nội tâm bằng “vị kỹ sư trưởng”, “gã điên” / “gã điên này”, “gã nhà khoa học điên” / “nhà khoa học điên” và đại từ ngôi thứ ba “Ông ta” / “ông ta” (p000226, p000229, p000230, p000241, p000242, p000244, p000251, p000252 — đồng bộ ch-02-b04 → ch-02-b08, ch-02-b15, ch-02-b16); quy chiếu Tồn tại X trong nội tâm căm phẫn của Tanya bằng “tên quỷ dữ khốn kiếp đó”, “Tồn tại X”, “tên quỷ dữ đê tiện” và đại từ “Hắn” / “hắn” (p000248, p000252), cùng “chúng” cho Tồn tại X và giáo phái của hắn (p000252); trong tiếng gào chửi trực tiếp đối kháng với Tồn tại X / Quỷ dữ tại p000249, dùng cặp đại từ “ta – Ngươi” và danh ngữ “tên Quỷ dữ kia” (đồng bộ hoàn toàn với ch-01-b12 p000197); trong lời thoại trực tiếp giữa Tanya và Schugel, Tanya tự xưng “tôi”, gọi Schugel là “Tiến sĩ”, dùng đại từ ngôi thứ hai lịch sự “ngài” (p000232, p000240, p000242), dùng “Chúng ta” ở câu đề nghị đầu p000242, và giữ tiểu từ kính ngữ “ạ” ở câu hỏi ngắn p000221 nối tiếp giọng dịu dàng ở cuối ch-02-b16, còn Schugel tự xưng “tôi” / “Tôi” (p000220, p000228, p000233, p000241), gọi Tanya là “Thiếu úy”, dùng đại từ ngôi thứ hai “cô” (p000243) và dùng “chúng ta” / “Chúng ta” khi rủ Tanya cùng cầu nguyện và cùng tử vì đạo (p000223, p000231, p000239, p000241, p000243); trong lời thoại của thực thể siêu nhiên nói với Tanya tại p000250, gọi Tanya là “ngươi” (đồng bộ P05-being-x); toàn bộ 34 đoạn không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*` theo DEC-P01-002
  alternatives_vi:
