  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 17 đoạn của ch-03-b30: giữ đại từ trần thuật ngôi thứ ba “nó” / “Nó” cho Tanya tại p000183, p000189, p000198 và đại từ nội tâm “mình” / “Mình” ở toàn bộ các câu độc thoại nội tâm, xử lý đại từ ngôi thứ hai phiếm chỉ ở p000182, p000183, p000191 bằng lược chủ ngữ hoặc dùng “người ta”, phân biệt rõ thanh điệu giữa lời cầu nguyện (“Hỡi Thượng đế – con / chúng con” ở p000186) với lời phát loa thăm dò đàm phán ôn hòa (“Các người – Chúng tôi / tôi” ở p000195, p000197), và tuyệt đối không thêm dấu `*...*` khi 17/17 đoạn nguồn không có nhấn mạnh."
