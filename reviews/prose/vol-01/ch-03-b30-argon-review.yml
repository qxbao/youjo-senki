- id: ch03-b30-game-theory-negotiation-military-law-and-historical-terms
  source_term: game_theory_negotiation_military_law_and_historical_terms_ch03_b30
  proposed_vi: "Lợi nhuận là trên hết / đàm phán / đối thoại / Tanya / nhân tính / trò chơi có tổng bằng không / xây dựng quan hệ hợp tác / dàn xếp cuộc chơi / thế giới của lý tính / giải pháp “đôi bên cùng thắng” / các nhà kinh tế học / số liệu thống kê / môn thể thao quốc gia của Nhật Bản / những trận đấu dàn xếp tỷ số / cuộc xâm lược của lũ ngoại đạo / Hỡi Thượng đế / thuật thức / CP / nhiễu mana / những định kiến / những người lính Cộng hòa / các khuôn mẫu rập khuôn / bản chất nội tâm thật sự / cá tính riêng biệt / tòa án binh / từ bỏ giao chiến / đào ngũ trước mặt quân địch / án tử hình bằng xử bắn / một cá nhân chính trực / những kẻ điên cuồng vì chiến tranh / vượt quá bậc lương của mình / hậu phương / rượu vang / cá áp chảo / Đế quốc / Tổ quốc / cỗ máy bạo lực / các hoàng đế / nước Phổ / quân đội sở hữu nhà nước thay vì nhà nước sở hữu quân đội / quê hương của chúng tôi"
  alternatives_vi:
  - "thao túng cuộc chơi và giải pháp “win-win” (thay cho “dàn xếp cuộc chơi” và “giải pháp “đôi bên cùng thắng”” tại p000184 — ưu tiên dịch nghĩa tiếng Việt tự nhiên “dàn xếp cuộc chơi” và “giải pháp “đôi bên cùng thắng”” đồng bộ với văn phong lý thuyết trò chơi của Tanya) / những trận đấu bán độ (thay cho “những trận đấu dàn xếp tỷ số” tại p000185 — ưu tiên “những trận đấu dàn xếp tỷ số” vì liên hệ trực tiếp tới nghiên cứu kinh tế học thống kê về môn sumo Nhật Bản) / cuộc xâm lược của kẻ dị giáo (thay cho “cuộc xâm lược của lũ ngoại đạo” tại p000186) / vượt quá ngạch lương của mình (thay cho “vượt quá bậc lương của mình” tại p000193) / cá xào bơ hoặc cá chiên áp chảo (thay cho “cá áp chảo” tại p000194)"
