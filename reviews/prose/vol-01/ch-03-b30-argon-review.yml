  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, định danh vô tuyến và khái niệm quân sự/tôn giáo/kinh tế đã khóa tạm ở các lô trước: “Tanya” (p000183, p000188), “Hỡi Thượng đế” (review-God, đồng bộ ch-03-b18 p000386, p000388: p000186), “thuật thức” (P01-formulas: p000187), “CP” (vol02-ch04-b08-cp: p000187), “nhiễu mana” (đồng bộ trực tiếp với ch-03-b29 p000171: p000187), “những người lính Cộng hòa” (ch-03-b24 p000037: p000189), “tòa án binh” (ch-01-b03 p000028, ch-02-b03 p000049, ch-03-b01 p000008: p000191), “đào ngũ trước mặt quân địch” (ch-01-b06 p000090, ch-03-b23 p000014: p000191), “án tử hình bằng xử bắn” (ch-01-b09 p000138, ch-02-b03 p000049, ch-03-b24 p000024: p000191), “hậu phương” (ch-01-b06 p000083, ch-03-b04 p000059, ch-03-b22 p000491: p000194), “Đế quốc” (p000195, p000197), “Tổ quốc” (vol02-ch02-b01-fatherland, ch-03-b28 p000158, ch-03-b29 p000176, p000178: p000195) và “quê hương của chúng tôi” (đồng bộ ch-03-b29 p000173: p000197); đồng thời khóa tạm các thuật ngữ lý thuyết trò chơi, kinh tế học và điển tích lịch sử phát sinh trong lô: “trò chơi có tổng bằng không” và “xây dựng quan hệ hợp tác” (p000183), “dàn xếp cuộc chơi”, “thế giới của lý tính” và “giải pháp “đôi bên cùng thắng”” (p000184), “các nhà kinh tế học”, “số liệu thống kê”, “môn thể thao quốc gia của Nhật Bản” và “những trận đấu dàn xếp tỷ số” (p000185), “cuộc xâm lược của lũ ngoại đạo” (p000186), “những định kiến” và “các khuôn mẫu rập khuôn” (p000189), “một cá nhân chính trực” và “những kẻ điên cuồng vì chiến tranh” (p000192), “vượt quá bậc lương của mình” (p000193), “cá áp chảo” (p000194), cùng “nước Phổ” và mệnh đề “nơi quân đội sở hữu nhà nước thay vì nhà nước sở hữu quân đội” (p000196)."
