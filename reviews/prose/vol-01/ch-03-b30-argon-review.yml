- id: ch03-b30-tanya-pov-pronouns-prayer-and-negotiation-broadcast-register-and-zero-emphasis
  source_term: tanya_pov_pronouns_prayer_and_negotiation_broadcast_register_and_zero_emphasis_ch03_b30
  proposed_vi: "Toàn bộ 17 đoạn của lô ch-03-b30 (chapter007b.xhtml/p000182–p000198) mở đầu ngay sau dấu ngắt cảnh (`class=\"space-break1\"` tại p000182) tiếp nối cuối ch-03-b29, khắc họa quá trình Thiếu úy Tanya Degurechaff nảy ra ý định dàn xếp cuộc chơi và phát thông điệp thăm dò đàm phán tới toán pháp sư Cộng hòa, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân tách chuẩn xác giữa trần thuật ngôi thứ ba mang điểm nhìn của Tanya và độc thoại nội tâm ngôi thứ nhất theo đúng DEC-P01-001: tại các câu/đoạn trần thuật ngôi thứ ba về Tanya (câu 1 p000183, câu 2 p000188, câu 3 p000189, câu 1 p000198), giữ tên riêng “Tanya” (p000183, p000188), dùng đại từ ngôi thứ ba “nó” / “Nó” (câu 1 p000183, câu 3 p000189, câu 1 p000198) và đại từ phản thân “mình” (câu 1 p000183, câu 2 p000188), tuyệt đối không dùng đại từ nữ “cô” / “cô ấy”; tại các câu/đoạn độc thoại nội tâm ngôi thứ nhất tự quy chiếu của Tanya (p000187, p000192, p000193, p000194, câu 2–3 p000198), dùng nhất quán “Mình” / “mình” (đặc biệt bảo toàn sự chuyển dịch điểm nhìn mượt mà ngay trong đoạn ở p000183 và p000198 từ câu trần thuật “Nó...” ở câu 1 sang độc thoại nội tâm “Mình...” ở câu 2–3); giữ đại từ ngôi thứ nhất số nhiều “Chúng ta” / “chúng ta” ở p000184, p000185 (quy chiếu Tanya và phía đối phương trong kế hoạch thông đồng dàn xếp trận đấu giả định) và ở câu 2 p000190 (nhận định khái quát kiểu quản trị nhân sự). (2) Xử lý đại từ ngôi thứ hai phiếm chỉ trong lập luận khái quát theo đúng quy ước direct-address choice (work/run-state/pending-terms.yml): lược đại từ ngôi thứ hai ở mệnh đề điều kiện câu 3 p000182 (“Nếu cho đối phương nổ tung trước cả khi bắt đầu đối thoại...”), và dùng chủ ngữ khái quát “người ta” hoặc cấu trúc bị động khách quan tại câu 2 p000183 (“Trừ phi thú vui của người ta là tử chiến đến cùng...”) cũng như xuyên suốt cả ba câu của p000191 (đồng bộ trực tiếp với ch-03-b28 p000155, p000158 và ch-03-b29 p000161). (3) Phân biệt rõ ba thanh điệu phát ngôn của Tanya trên chiến trường: trong lời cầu nguyện bắt buộc để vận hành Type 95 giả vờ nạp thuật thức (p000186), dùng cụm hô gọi trang trọng “Hỡi Thượng đế” và tự xưng “con” / “chúng con” (đồng bộ ch-03-b18 p000386, p000388 và ch-03-b29 p000178); trong thông điệp phát loa mở lời thăm dò đàm phán ôn hòa, lịch sự gửi tới các pháp sư Cộng hòa (p000195, p000197), dùng cặp đại từ ngoại giao trang trọng, chuẩn mực “Các người / các người – Chúng tôi / chúng tôi / tôi” (tách biệt rõ rệt với giọng lên gân cuồng tín “lũ quân thù xấc xược / các ngươi – chúng ta” khi bị lời nguyền Type 95 chi phối ở ch-03-b29 p000173, p000176); trong khi ở nội tâm, Tanya gọi phía pháp sư Cộng hòa và CP là “đối phương” / “họ” / “bọn họ” (p000182, p000187, p000189, p000192, p000194). (4) Bảo toàn trọn vẹn cấu trúc phủ định, tình thái giả định, điều kiện và câu hỏi trực tiếp theo canon/style-guide.md: điều kiện phủ định ở câu 3 p000182 và câu 2–3 p000183, dấu ngoặc kép quanh cụm ““đôi bên cùng thắng”” ở p000184, mệnh đề tương lai hoàn thành và liên hệ so sánh ở p000185, tình thái phỏng đoán (“có lẽ đã tới” ở p000188; “Biết đâu...”, “Có lẽ...” ở p000189), phủ định điều kiện ở câu 2 p000189, điều kiện và phủ định khả năng thoát án ở p000191, các mệnh đề điều kiện giả định ở p000192 và p000194, phủ định nghĩa vụ ở p000193, mệnh đề nhượng bộ và phủ định ở p000196 và p000198, cùng câu hỏi trực tiếp nguyên vẹn ở p000197. (5) Tuân thủ nghiêm ngặt DEC-P01-002: toàn bộ 17/17 đoạn trong `work/vol-01/batches/ch-03-b30-source.jsonl` đều không có thẻ `<html:em>`, nên bản dịch hoàn toàn không dùng dấu nhấn mạnh Markdown `*...*` ở bất kỳ đoạn nào."
  alternatives_vi:
  - "các anh – chúng tôi hoặc các ngươi – chúng ta (thay cho “Các người / các người – Chúng tôi / chúng tôi / tôi” tại p000195, p000197 — ưu tiên “Các người / các người – Chúng tôi / chúng tôi / tôi” vì giữ đúng sắc thái cảnh báo quân sự lịch sự, ôn hòa khi Tanya chủ động mở lời thăm dò đàm phán mà không suy diễn giới tính hay cấp bậc đối phương)"
