- id: ch03-b26-scene-split-tanya-pov-vs-republican-officer-first-person-pov-pronouns-and-single-emphasis
  source_term: scene_split_tanya_pov_vs_republican_officer_first_person_pov_pronouns_and_single_emphasis_ch03_b26
  proposed_vi: 'Toàn bộ 34 đoạn của lô ch-03-b26 (chapter007b.xhtml/p000069–p000102) chia thành hai phân cảnh rõ rệt qua ngắt trang tại p000083 (`ns1:type="pagebreak"`), tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân cảnh 1 (p000069–p000082) — Điểm nhìn của Thiếu úy Tanya Degurechaff: trong độc thoại nội tâm ngôi thứ nhất của Tanya (p000069, p000073, p000074, p000077, p000080), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” cho cá nhân Tanya và “chúng ta” / “Chúng ta” khi bao hàm các quân nhân / con người nói chung (p000074); trong trần thuật ngôi thứ ba về Tanya (p000069, p000072), dùng đại từ “nó” (“nó lẩm bẩm trong đầu khi lao vút ngang bầu trời” ở p000069; “điểm đánh giá của nó” ở p000072), tuyệt đối không dùng đại từ nữ “cô” / “cô ấy” cho Tanya; quy chiếu các pháp sư và sĩ quan tài chính bằng “họ” (p000072, p000073), và quy chiếu đại đội trưởng Trung úy Schwarkopf ở ngôi thứ ba bằng “anh ta” (p000080 — đồng bộ ch-03-b11 p000232, ch-03-b12 p000249, ch-03-b19 p000399); trong hội thoại quân sự với trung đội, Tanya tự xưng “tôi”, dùng đại từ gộp “Chúng ta” (p000071), gọi các thành viên trung đội là “các anh” khi ra kèo cá cược (p000079 — đồng bộ ch-03-b24 p000039) và quy chiếu quân địch bằng “bọn chúng” (p000071), còn Trung sĩ Schones / cấp dưới gọi Tanya bằng cấp bậc “Thiếu úy” / “Thiếu úy Degurechaff” (p000070, p000081), dùng “Chúng ta” / “chúng ta” khi đề xuất chung (p000075, p000078) và tự xưng “bọn tôi” khi thay mặt cả đội đặt cược tiền phụ cấp (p000081). (2) Phân cảnh 2 (p000083–p000102) — Điểm nhìn tự sự ngôi thứ nhất của sĩ quan thuộc đại đội pháp sư yểm trợ trực tiếp của Cộng hòa bị Tanya phục kích từ độ cao 12.000 feet: tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp dụng cho người kể chuyện phía Cộng hòa — không có từ “nó” nào trong suốt p000083–p000102); người kể chuyện phía Cộng hòa tự xưng nhất quán là “tôi” / “Tôi” kết hợp phản thân “mình” (p000085) và số nhiều “chúng tôi” / “Chúng tôi” cho đại đội / phe Cộng hòa; quy chiếu các thành viên trong đơn vị bằng “họ” (p000084, p000101); quy chiếu pháp sư địch (Tanya, khi chưa rõ nhân dạng) bằng “kẻ địch”, “tên khốn đó” (p000094 — đồng bộ ch-03-b06 p000094) và “tên pháp sư địch kia” (p000099); đồng thời xử lý đại từ ngôi thứ hai phiếm chỉ ở vế hai câu 1 p000095 bằng chủ ngữ khái quát “người ta” (“người ta sẽ cạn sạch mana”) theo đúng quy ước direct-address choice (pending-terms.yml). (3) Bảo toàn trọn vẹn các cấu trúc điều kiện, phủ định, câu hỏi nội tâm, cấu trúc tăng tiến đổi chủ thể và giả định trái thực tế theo đúng canon/style-guide.md: điều kiện phủ định ở câu 3 p000069, hai câu điều kiện nhân quả ở câu 3–4 p000072, phủ định và câu điều kiện ở p000077, câu điều kiện cá cược ở p000079 và p000081, suy đoán chắc chắn quá khứ (“Chắc hẳn anh ta đã thắng được...”) cùng câu điều kiện và mệnh đề nhượng bộ - phủ định ở p000080, giữ nguyên đối tượng và độ mở của hai câu hỏi nội tâm ngắn gọn cùng câu phủ định ở p000084 (“Đơn vị của tôi ư? Thuộc cấp của tôi ư? Tôi không còn tâm sức đâu mà lo cho họ nữa.”), mệnh đề nhượng bộ ở p000085 và p000086, phủ định trải nghiệm quá khứ ở p000088, so sánh phủ định giả định và mệnh đề nhượng bộ ở p000090, cấu trúc tăng tiến “không chỉ… mà còn…” khi hai vế đổi chủ thể ở câu 1 p000095 (“Đó không chỉ là một môi trường khắc nghiệt nơi nồng độ oxy chỉ bằng khoảng 60 phần trăm so với dưới mặt đất, mà vấn đề lớn hơn còn nằm ở chỗ người ta sẽ cạn sạch mana.”), câu hỏi phủ định ở p000096, câu hỏi nghi vấn gián tiếp rồi phủ định dứt khoát ở p000098, nhịp câu ngắn dồn dập cùng mệnh đề nhượng bộ và phủ định ở p000099, câu điều kiện kèm dấu gạch ngang dài (—) ở p000101, và giả định trái thực tế nhượng bộ kèm mức độ phỏng đoán ở câu 3 p000102 (“Ngay cả khi chúng tôi có tấn công ở trạng thái sung sức nhất đi chăng nữa, có lẽ chúng tôi vẫn sẽ phải trải qua một trận chiến vô cùng chật vật.”). (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 1 đoạn duy nhất có thẻ `<html:em>` trong `xhtml` nguồn là p000069 (`*Kệ cho cái thế giới bị nguyền rủa này đi đến chỗ diệt vong đi. Chà, cứ để mọi thứ trừ mình ra đi đến chỗ diệt vong hết đi. Còn nếu chuyện đó là bất khả thi, thì chí ít cũng cầu cho mình tránh được cảnh diệt vong*, nó lẩm bẩm trong đầu khi lao vút ngang bầu trời.`), giữ phần câu dẫn nằm ngoài dấu `*` và toàn bộ 33/34 đoạn còn lại không có dấu `*` theo đúng DEC-P01-002.'
  alternatives_vi:
  - ông ta (thay cho “anh ta” khi quy chiếu Trung úy Schwarkopf tại p000080 — ưu tiên “anh ta” để đồng bộ hoàn toàn với ch-03-b11 p000232, ch-03-b12 p000249 và ch-03-b19 p000399) / chúng tôi (thay cho “bọn tôi” trong lời đặt cược của Trung sĩ Schones tại p000081 — ưu tiên “bọn tôi” vì tự nhiên, sống động trong không khí cá cược giữa các thành viên trung đội với chỉ huy)
