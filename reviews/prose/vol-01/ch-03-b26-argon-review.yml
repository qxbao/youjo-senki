  alternatives_vi:
  - hào quang ma lực hoặc ánh sáng mana (thay cho “ánh sáng ma lực” tại p000071, p000098 — ưu tiên “ánh sáng ma lực” để đồng bộ với ch-03-b22 p000498) / kê khai thanh toán chi phí (thay cho “hạch toán vào công tác phí” tại p000072 — ưu tiên “hạch toán vào công tác phí” vì tự nhiên với lăng kính kinh doanh và tiếp khách của Tanya) / chăm sóc tâm lý (thay cho “chăm sóc tinh thần” tại p000074) / hộ chiếu và visa (thay cho “hộ chiếu và thị thực” tại p000075 — ưu tiên “hộ chiếu và thị thực” vì trang trọng, chuẩn mực trong câu nói đùa hành chính biên giới) / các chiến thuật văn minh (thay cho “các biện pháp ôn hòa” tại p000080) / khoản phụ cấp (thay cho “tiền phụ cấp” tại p000081) / mồi nhử khúc xạ quang học (thay cho “mồi nhử quang học khúc xạ” tại p000085) / người điều phối tiền phương hoặc kiểm soát viên tiền phương (thay cho “nhân viên kiểm soát tiền phương” tại p000088 — ưu tiên “nhân viên kiểm soát tiền phương” để đồng bộ cấu trúc với “nhân viên kiểm soát trên không” và “nhân viên kiểm soát tác chiến” ở ch-01-b09 p000148, p000155) / Tách ra! Tách ra! (thay cho “Tản ra! Tản ra!” tại p000089 — ưu tiên “Tản ra! Tản ra!” vì hô ứng trực tiếp với động từ “tản ra” ở câu 1 p000090 và đồng bộ với ch-03-b06 p000089) / Mười hai nghìn bộ (thay cho “Mười hai nghìn feet” tại p000094, p000102 — ưu tiên giữ đơn vị “feet” đồng bộ với ch-01-b01 p000006, ch-03-b02 p000026, ch-03-b05 p000072, p000082 và ch-03-b07 p000124) / phi cơ chiến đấu hoặc chiến đấu cơ (thay cho “máy bay tiêm kích” tại p000096 — ưu tiên “máy bay tiêm kích” đồng bộ với vol03-ch01-b03, vol04-ch05-b01) / các hạt mana (thay cho “các hạt ma lực” tại p000098 — ưu tiên “các hạt ma lực” để đồng bộ với “ánh sáng ma lực” trong cùng câu)
