  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 34 đoạn của ch-03-b26: phân tách rõ hệ đại từ điểm nhìn của Tanya ở Phân cảnh 1 (p000069–p000082: nội tâm “mình” / “Mình”, trần thuật ngôi thứ ba “nó”, tuyệt đối không dùng “cô”) với hệ đại từ tự sự ngôi thứ nhất của sĩ quan pháp sư Cộng hòa ở Phân cảnh 2 (p000083–p000102: “tôi” / “Tôi” / “chúng tôi”, tuyệt đối không dùng “nó”), xử lý đại từ ngôi thứ hai phiếm chỉ ở p000095 bằng “người ta” theo direct-address choice, bảo toàn đầy đủ các câu hỏi nội tâm ở p000084, cấu trúc “không chỉ… mà còn…” đổi chủ thể ở p000095, giả định trái thực tế nhượng bộ ở p000102 và chính xác phạm vi nhấn mạnh tại đoạn duy nhất có `<html:em>` là p000069."
