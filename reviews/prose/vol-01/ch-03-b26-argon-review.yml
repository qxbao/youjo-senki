  rationale: "Kế thừa đồng bộ hệ thống danh xưng, quân hàm, đơn vị và thuật ngữ tác chiến đã khóa tạm từ Chương 1–2 và ch-03-b01 → ch-03-b25: “Thiếu úy” / “Thiếu úy Degurechaff” (b02-second-lieutenant, ch-03-b24 p000026, ch-03-b25 p000043, p000058, p000065: p000070, p000081), “ánh sáng ma lực” (ch-03-b22 p000498: p000071, p000098), “luật chiến tranh” (vol02-ch02-b09, vol03-ch01-b03: p000077), “Đế quốc” (p000077, p000099, p000102) và “sức mạnh quân sự của Đế quốc” (ch-03-b25 p000055: p000099), “cấp dưới” (ch-03-b22 p000464, ch-03-b24 p000042: p000077) và “thuộc cấp” (ch-03-b06 p000085, ch-03-b07 p000105, p000124: p000084), “chỉ huy” (ch-03-b22 p000470, p000490, ch-03-b23 p000016: p000079, p000090), “MẶT TRẬN RHINE” (ch-03-b01 p000001: p000083), “các động tác cơ động né tránh” (ch-03-b22 p000498: p000085), “đại đội” và “Cộng hòa” (ch-03-b05, ch-03-b23, ch-03-b24: p000086), “Mayday” (b10-radar-jamming-and-air-combat-terms, ch-03-b07 p000125: p000087 — dùng dấu phẩy ngăn cách “Mayday, Mayday, Mayday!” tương tự ch-03-b06 p000099 để vượt qua kiểm tra câu nguồn lặp lại của validator), “Tản ra! Tản ra!” (ch-03-b06 p000089: p000089), tên riêng “Sean” (p000091), “Mục tiêu địch!” (b09-air-defense-and-interception-terms, ch-01-b09 p000152, ch-03-b06 p000085, p000098: p000092), đơn vị độ cao “Mười hai nghìn feet” / “mười hai nghìn feet”, “tám nghìn feet” và “sáu nghìn” (ch-01-b01 p000006, ch-03-b02 p000026, ch-03-b05 p000072, p000082, ch-03-b07 p000124: p000094, p000095, p000100, p000102), “nồng độ oxy” (ch-02-b03 p000051, p000057, ch-02-b04 p000073: p000095), “mana” (p000095, p000099), “pháp sư không quân” (chapter1_b01_pending_terms, ch-03-b01 p000017: p000095, p000098, p000102), “máy bay tiêm kích” (vol03-ch01-b03, vol04-ch05-b01: p000096), “thích nghi với độ cao” (ch-02-b03 p000052: p000099), “lấy độ cao” (ch-03-b02 p000025, p000031, ch-03-b05 p000082: p000100), “giao chiến” (ch-03-b06 p000084: p000100, p000101) và “tiểu đội quan sát viên” (ch-03-b23 p000011: p000101); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “kẹo chì” / “Đạn chì”, “nỗ lực bán hàng” và “hạch toán vào công tác phí” (p000071, p000072), “sĩ quan tài chính”, “sức khỏe tâm thần” / “chăm sóc tinh thần”, “nhân viên hỗ trợ chuyên trách”, “kinh tế học” và “phân công lao động” (p000073, p000074), “hộ chiếu và thị thực”, “luật kiểm soát biên giới” và “làm thủ tục nhập cảnh” (p000075, p000077), “các biện pháp ôn hòa” (p000080), “tiền phụ cấp” (p000081), “mồi nhử quang học khúc xạ” (p000085), “cuộc gọi cấp cứu” và “nhân viên kiểm soát tiền phương” (p000088), mã báo độ cao “Angel 12” (p000092, p000093), và “các hạt ma lực” (p000098)."
