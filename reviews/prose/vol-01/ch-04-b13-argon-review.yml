  rationale: "Kế thừa đồng bộ “lục quân” (ch-04-b01/b06/b11/b12), “bộ phận nhân sự” (ch-04-b12 p000011), tên các quốc gia “Khối Thịnh vượng chung” (ch-01-b03 p000034 / ch-01-b06 p000089), “Liên bang Russy” và “Vương quốc Ildoa” (ch-01-b20 p000046), “Reich” (giữ nguyên khi nguyên tác dùng danh xưng tiếng Đức để phân biệt với “Đế quốc”, đồng bộ vol-04-ch-01-b15), “Cộng hòa” (ch-03-b05–b07, ch-04-b05/b12), “Đế quốc” (ch-04-b11/b12), “các cường quốc” (ch-01-b03, ch-04-b05/b12), “hiệu ứng domino” (ch-01-b20 p000055), “Liên Xô” (ch-01-b02 p000023), “cảnh sát mật” và “an ninh quốc gia” (ch-01-b20 p000054); khóa tạm “cấp dưới”, “lớp đàn em”, “giới doanh nghiệp”, “lợi ích trực tiếp”, “cuộc trò chuyện có tri thức” / “cuộc trò chuyện trí thức”, “thành viên trưởng thành của xã hội”, “quốc gia bá chủ” (xuyên suốt p000034, p000035, p000040), cặp đối lập “lợi thế tương đối” — “ưu thế tuyệt đối”, các danh xưng lịch sử thế giới cũ “Đế quốc Đức”, “Pháp”, “Đế quốc Nga”, “Đế quốc Anh”, “quốc đảo”, “Đông Đức” và “Stasi”, cùng “lợi ích quốc gia”, “hỗ trợ tài chính”, “quân tình nguyện”, “chính sách Cho vay – Cho thuê¹⁷” (bảo toàn chỉ số chú thích trên cao ¹⁷ tương ứng với thẻ <html:sup>17</html:sup> trong nguồn), “những người Samaritan nhân hậu”, “giáo phái tà đạo” (đồng bộ với “giáo phái” ở ch-04-b07), “bản chất thực sự” / “bản tính con người”, “sự tự do về tinh thần”, “chủ nghĩa cá nhân”, “các chính sách an ninh quốc gia”, “tự do tư tưởng” và “phỏng đoán”."
