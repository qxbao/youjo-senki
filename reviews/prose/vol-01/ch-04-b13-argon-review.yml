- id: ch04-b13-tanya-zettour-geopolitical-analysis-pronouns-counterfactuals-and-footnote
  source_term: Tanya third-person narration in p000029 and p000033 vs first-person interior monologue across p000030/p000033/p000037–p000038/p000041–p000042/p000046/p000049–p000050/p000053, generic second-person references in p000029–p000030/p000033, third-person references to Brigadier General von Zettour in interior monologue (p000041–p000042) and to states/powers across p000032/p000034/p000037–p000038/p000040/p000043/p000045–p000046/p000049–p000050/p000052, dialogue address and inclusive “chúng ta” between First Lieutenant Tanya Degurechaff and Brigadier General von Zettour across p000031–p000032/p000034–p000036/p000039–p000040/p000043–p000045/p000047–p000048/p000051–p000052/p000054–p000055, past possibility and counterfactual conditionals in p000030/p000037/p000046, and footnote superscript preservation in p000046
  proposed_vi: tiếp nối trực tiếp lô ch-04-b12 (chapter009b.xhtml/p000001–p000028), toàn bộ lô ch-04-b13 (chapter009b.xhtml/p000029–p000055) tiếp tục cuộc đối thoại chiến lược giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour tại thư viện Học viện Chiến tranh Đế quốc dưới điểm nhìn của Tanya, tuân thủ nghiêm ngặt DEC-P01-001 (trần thuật về Tanya dùng “nó”, nội tâm tự quy chiếu của Tanya dùng “mình”; tuyệt đối không dùng đại từ “cô” cho Tanya trong lời kể hay nội tâm của Tanya) và DEC-P01-002: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000029, câu 1 p000033), quy chiếu Tanya bằng tên riêng “Tanya” và đại từ trần thuật “nó” / “Nó”; trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000030, câu 2–7 p000033, p000037, p000038, p000041, p000042, p000046, p000049, p000050, p000053), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” ở ngôi thứ nhất số ít và “Chúng ta” cho con người/nhân loại nói chung trong suy ngẫm triết lý tại p000049 (đồng bộ b07-human-we), đồng thời quy chiếu Chuẩn tướng von Zettour bằng “ông ấy” (p000041, p000042 — đồng bộ ch-04-b11 và ch-04-b12); trong các cấu trúc ngôi thứ hai phiếm chỉ ở lời kể và nội tâm (p000029, p000030, câu 4–5 p000033), dùng chủ ngữ khái quát “người ta” hoặc lược chủ ngữ kết hợp phản thân “mình” theo đúng quy ước direct-address choice; quy chiếu tập thể lục quân, các cường quốc và người dân bằng “họ” / “Họ” (p000029, p000030, p000032, p000034, p000037, p000038, p000040, p000043, p000045, p000046, p000050, p000052), riêng tại p000049 quy chiếu “Các quốc gia” (khi bị phê phán như những thực thể tà ác làm biến chất con người) bằng “Chúng” / “chúng”, và tại câu 1 p000052 bảo toàn đại từ sở hữu số ít “của nước đó” trước khi chuyển sang “họ” ở câu 2 theo sát văn bản nguồn; trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn tướng von Zettour (p000031, p000032, p000034–p000036, p000039, p000040, p000043–p000045, p000047, p000048, p000051, p000052, p000054, p000055), đồng bộ hoàn toàn với ch-04-b11 và ch-04-b12: Tanya tự xưng “tôi” / “Tôi” (dùng “chúng ta” cho phía Đế quốc ở p000036, p000039, và “cả hai chúng ta” cho cả Đế quốc lẫn Cộng hòa ở p000048) kèm các từ lễ phép “Vâng”, “Dạ” và tiểu từ kính ngữ “ạ”, còn Chuẩn tướng von Zettour tự xưng “Tôi” (p000047), dùng “chúng ta” (p000054) và gọi Tanya lịch sự là “cô” / “Cô” (p000040, p000044, p000047, p000054); bảo toàn chính xác thời gian và mức độ chắc chắn của các mệnh đề giả định và điều kiện theo đúng style-guide.md (bất khả thể quá khứ ở p000030; điều kiện phủ định ở p000033 và p000039; câu hỏi gián tiếp hai vế ở p000034; điều kiện giả định và cấu trúc đối lập ở p000036; khả thể quá khứ, câu hỏi tu từ quá khứ và giả định trái thực tế ở quá khứ dẫn tới hệ quả giả định ở hiện tại tại p000037; câu hỏi tu từ nội tâm ở p000038; chuỗi giả định tương lai và điều kiện ở p000046; các câu hỏi trực tiếp của Zettour ở p000035, p000040, p000044, p000051, p000054 và điều kiện nhượng bộ ở p000052); bảo toàn chính xác chỉ số chú thích trên cao `¹⁷` tại p000046 (`chính sách Cho vay – Cho thuê¹⁷`), và không sử dụng dấu `*...*` ở cả 27/27 đoạn do nguồn không có thẻ nhấn mạnh theo đúng DEC-P01-002
  alternatives_vi:
  - lược chủ ngữ kết hợp phản thân “mình” (thay cho chủ ngữ phiếm chỉ “người ta” tại p000029 và p000030 — cả hai cách đều thuộc quy ước direct-address choice; giữ “người ta ... cho mình” tại p000029–p000030 để câu đối sánh giữa lục quân và công ty rõ cấu trúc chủ–vị)
