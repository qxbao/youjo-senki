  rationale: "Kế thừa đồng bộ “Tanya” / “Thiếu úy Degurechaff” / “Degurechaff”, “Cộng hòa François” (ch-03-b12 p000261), “Liên minh Entente” (vol02-ch02-b03-entente-alliance, ch-01-b14), “Schwarkopf”, “giới chỉ huy cấp cao” (b04-the-brass, ch-03-b11 p000224, ch-03-b12 p000241), “Đế quốc”, tên riêng “Tsugene” (ch-04-b15 p000082, vol-04-ch-01-b16 p000107), “hậu phương” (ch-03-b11 p000232), “Những người lính dày dạn trận mạc” (đồng bộ ch-01-b06 p000100, ch-03-b05 p000068, ch-03-b10 p000197, ch-03-b12 p000241; tránh dùng “cựu binh” cho quân nhân đang tại ngũ), “người lính Đế quốc” (ch-03-b13 p000274), “trận phòng ngự” (ch-03-b13 p000282), “tân binh” và “cục nợ” (ch-03-b12 p000247), phiên hiệu “Đại đội Pháp sư Xung kích số 205” (ch-03-b11 p000224, p000233, ch-03-b12 p000244), “phòng ngự cơ động” (ch-03-b13 p000278, p000279, ch-04-b15 p000088), “đại đội”, “những trận đánh ban đầu” (ch-03-b12 p000261), “Trung úy”, “Tổ quốc” (vol02-ch02-b01-fatherland, ch-01-b13 p000236, ch-01-b14 p000243), “chiến hào” (ch-03-b02 p000037) và “những kẻ nghiệp dư” (ch-03-b02 p000033); khóa tạm “cấp độ chiến lược”, “chiến thuật kiềm chế tiêu hao” (đồng bộ với “Học thuyết Kiềm chế Tiêu hao” ở ch-04-b15 p000090, p000097), “pháo đài” (đồng bộ p000283, p000300), “chiến lược ngoại tuyến” (đồng bộ với “Chiến lược nội tuyến” ở ch-03-b13 p000282 và “ngoại tuyến” ở ch-04-b16 p000118) và “Những người lính cấp dưới” (p000283), “những chiến lược gia hàng đầu của quốc gia”, “bài diễn văn mang phong cách Tsugene¹³” (bảo toàn chỉ số chú thích trên cao ¹³) và “Lòng yêu nước” / “lòng yêu nước” (đồng bộ p000285–p000287), “những kẻ duy tâm”, “*lòng trung thành quả cảm*” và “lời tuyên xưng đức tin” (p000287), “người lính Đế quốc kiểu mẫu” và “học thuyết tác chiến hướng nhiệm vụ” (p000288), “nhân lực tốt” (p000290 — đồng bộ với “nhân lực quan trọng” ở ch-03-b12 p000243), “định hướng chiến lược”, “số lính bổ sung” và “nguồn lực quý giá” (p000291), “lực lượng xung kích cơ động” và “trận chiến phòng ngự cơ động” (p000292), “nhiệm vụ xung kích cơ động” và “tất tả chạy khắp nơi để chữa cháy” (p000293), “chốt chặn then chốt” và “cuộc phản công” (p000294), “lực lượng dự bị phản công” (p000298), “công sự dã chiến”, “bê tông cốt thép”, “súng máy”, “Tướng Nogi”, “cảng Lữ Thuận” / “căn cứ tại cảng Lữ Thuận” và từ ““tai nạn”” trong ngoặc kép (p000299, p000300), cùng “trọng pháo hải quân”, “Các công sự phòng thủ”, “pháo công thành” và “đơn vị cơ động” (p000300)."
