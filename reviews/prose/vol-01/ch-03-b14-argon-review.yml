  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md qua sự đan xen điểm nhìn giữa Thiếu úy Tanya Degurechaff và Trung úy Ihlen Schwarkopf: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“Mình” / “mình”) và trần thuật/tự tách mình ở ngôi thứ ba (“Tanya” / “nó”) khi ở điểm nhìn của Tanya, dùng “Anh” / “anh” cho Schwarkopf và “cô” cho Degurechaff khi ở góc nhìn quan sát từ bên ngoài của Schwarkopf (p000291), giữ chuẩn mực xưng hô quân ngũ, xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice, bảo toàn chính xác câu hỏi cảm thán nội tâm, các cấu trúc giả định/khả thể quá khứ, chỉ số chú thích trên cao “¹³” và cả 2 vị trí nhấn mạnh in nghiêng tại p000287."
