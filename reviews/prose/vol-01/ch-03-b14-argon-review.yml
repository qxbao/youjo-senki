  proposed_vi: Tanya / cấp độ chiến lược / chiến thuật kiềm chế tiêu hao / pháo đài / Cộng hòa François / chiến lược ngoại tuyến / Liên minh Entente / Những người lính cấp dưới / Schwarkopf / giới chỉ huy cấp cao / những chiến lược gia hàng đầu của quốc gia / Đế quốc / bài diễn văn mang phong cách Tsugene¹³ / Lòng yêu nước / lòng yêu nước / những kẻ duy tâm / hậu phương / *lòng yêu nước* / *lòng trung thành quả cảm* / Những người lính dày dạn trận mạc / lời tuyên xưng đức tin / Thiếu úy Degurechaff / người lính Đế quốc kiểu mẫu / học thuyết tác chiến hướng nhiệm vụ / nhân lực tốt / định hướng chiến lược / trận phòng ngự / số lính bổ sung / tân binh / cục nợ / Degurechaff / nguồn lực quý giá / Đại đội Pháp sư Xung kích số 205 / lực lượng xung kích cơ động / trận chiến phòng ngự cơ động / đại đội / những trận đánh ban đầu / nhiệm vụ xung kích cơ động / tất tả chạy khắp nơi để chữa cháy / chốt chặn then chốt / cuộc phản công / Trung úy / Tổ quốc / chiến hào / lực lượng dự bị phản công / công sự dã chiến / bê tông cốt thép / những kẻ nghiệp dư / súng máy / Tướng Nogi / cảng Lữ Thuận / “tai nạn” / căn cứ tại cảng Lữ Thuận / trọng pháo hải quân / Các công sự phòng thủ / pháo công thành / đơn vị cơ động
  alternatives_vi:
  - chiến thuật ngăn chặn tiêu hao (thay cho “chiến thuật kiềm chế tiêu hao” tại p000283) / đồn lũy (thay cho “pháo đài” tại p000283, p000300) / Những người lính cấp thấp (thay cho “Những người lính cấp dưới” tại p000283) / cấp trên (thay cho “giới chỉ huy cấp cao” tại p000284) / bài diễn thuyết kiểu Tsugene¹³ (thay cho “bài diễn văn mang phong cách Tsugene¹³” tại p000285) / những kẻ lý tưởng hóa và *tận trung báo quốc* hoặc *trung dũng* (thay cho “những kẻ duy tâm” và “*lòng trung thành quả cảm*” tại p000287) / học thuyết chiến tranh lấy nhiệm vụ làm trung tâm (thay cho “học thuyết tác chiến hướng nhiệm vụ” tại p000288) / quân bài đắc lực (thay cho “nhân lực tốt” tại p000290) / lực lượng thay thế (thay cho “số lính bổ sung” tại p000291) / lực lượng đột kích cơ động và trận đánh phòng ngự cơ động (thay cho “lực lượng xung kích cơ động” và “trận chiến phòng ngự cơ động” tại p000292, cùng “nhiệm vụ xung kích cơ động” tại p000293) / hạt nhân nòng cốt hoặc trụ cột then chốt và đợt phản kích (thay cho “chốt chặn then chốt” và “cuộc phản công” tại p000294) / đội dự bị phản kích (thay cho “lực lượng dự bị phản công” tại p000298) / Lữ Thuận Khẩu (thay cho “cảng Lữ Thuận” tại p000299, p000300) / hải pháo hạng nặng, Các công trình phòng ngự và trọng pháo công thành (thay cho “trọng pháo hải quân”, “Các công sự phòng thủ” và “pháo công thành” tại p000300)
