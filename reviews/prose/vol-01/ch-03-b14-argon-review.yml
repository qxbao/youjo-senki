- id: ch03-b14-tanya-schwarkopf-pov-alternation-pronouns-conditionals-and-emphasis
  source_term: tanya_schwarkopf_pov_alternation_pronouns_conditionals_and_emphasis_ch03_b14
  proposed_vi: 'tiếp nối trực tiếp phần phổ biến tình hình tại văn phòng chỉ huy đại đội ở cuối lô ch-03-b13 (p000282), lô ch-03-b14 (chapter007.xhtml/p000283–p000300) chuyển đổi linh hoạt giữa điểm nhìn của Tanya (p000283–p000289, câu 1 p000290, p000296–p000300) và điểm nhìn của Trung úy Ihlen Schwarkopf (câu 2–3 p000290, p000291, p000293), tuân thủ nghiêm ngặt DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không dùng “cô” cho Tanya khi ở điểm nhìn của Tanya và không áp quy ước “nó” sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Trong các câu/đoạn thuộc điểm nhìn của Tanya (p000283, p000285, p000286, câu 1 p000290, p000296–p000300), quy chiếu cái tôi nội tâm ở ngôi thứ nhất nhất quán bằng đại từ tự quy chiếu “Mình” / “mình” kết hợp phản thân “bản thân” (câu 3–5 p000285, p000286, câu 1 p000290, p000297, p000298, p000299), và quy chiếu Tanya ở ngôi thứ ba bằng tên riêng “Tanya” cùng đại từ “nó” kết hợp phản thân “mình” (p000283, câu 2 p000285, p000286, p000296, p000297, p000298, p000300), bảo toàn nguyên vẹn sự chuyển dịch ngôi tự sự và tách đôi chủ thể ngay trong cùng một đoạn hoặc cùng một câu tại p000285, p000286, p000297 và p000298; lưu ý từ “nó” ở câu 3 p000300 (“trước pháo công thành thì nó cũng chẳng khác gì một tấm bia tập bắn khác mà thôi”) hoàn toàn chỉ quy chiếu danh từ bất động vật là “một pháo đài”, và câu nhận định rút ra từ bài học lịch sử chung ở câu 3 p000300 dùng đại từ gộp “chúng ta” (“Lịch sử dạy cho chúng ta biết rằng...”). (2) Trong các đoạn trần thuật và đánh giá nội tâm dưới điểm nhìn của Trung úy Ihlen Schwarkopf (câu 2–3 p000290, p000291, p000293), quy chiếu Schwarkopf nhất quán bằng họ “Schwarkopf” và đại từ ngôi thứ ba “Anh” / “anh” kết hợp phản thân “mình” (còn trong câu độc thoại nội tâm của Tanya ở câu 1 p000290 quy chiếu Schwarkopf bằng “anh ấy” — đồng bộ hoàn toàn với ch-03-b11 p000234, p000237, p000238, ch-03-b12 p000240–p000250 và ch-03-b13 p000276); dưới góc nhìn quan sát bên ngoài của Trung úy Schwarkopf ở câu 3 p000291, quy chiếu Thiếu úy Tanya Degurechaff bằng họ “Degurechaff” và đại từ ngôi thứ ba “cô” (“chỉ riêng việc Degurechaff là một sĩ quan được việc thôi cũng đã biến cô thành một trong số ít những nguồn lực quý giá của anh” — đồng bộ hoàn toàn với ch-03-b12 p000241, p000243, p000248–p000250). (3) Quy chiếu nhân vật Tsugene ở câu 4 p000285 bằng đại từ “lão” (đồng bộ ch-04-b15 p000082, vol-04-ch-01-b16 p000107), và quy chiếu Cộng hòa François, những người lính cấp dưới, các chiến lược gia hàng đầu, binh lính và những người lính dày dạn trận mạc, đám tân binh bổ sung, Đại đội 205 cùng đơn vị cơ động bằng đại từ số nhiều “họ” kết hợp phản thân “mình” (p000283, p000285, p000287, p000291, p000293, p000300). (4) Tại câu 2 p000283 có đại từ ngôi thứ hai phiếm chỉ trong nguồn, theo đúng quy ước direct-address choice (pending-terms.yml), lược đại từ ngôi thứ hai phiếm chỉ ở vế điều kiện (“Nếu đã tính đánh theo chiến thuật kiềm chế tiêu hao”) và dùng chủ ngữ khái quát “người ta” ở vế chính (“thì lẽ ra người ta phải nghĩ tới chuyện củng cố biên giới bằng các pháo đài...”). (5) Trong lời thoại quân ngũ giữa Trung úy Ihlen Schwarkopf và Thiếu úy Tanya Degurechaff (p000284, p000288, p000289, p000292, p000294, p000295), Schwarkopf tự xưng “Tôi”, dùng đại từ gộp “Chúng ta” / “chúng ta” cho hai sĩ quan chỉ huy và Đại đội Pháp sư Xung kích số 205 (p000288, p000294), và gọi Tanya là “Thiếu úy Degurechaff” / “cô” (p000288, p000294), còn Tanya dùng “Chúng ta” / “chúng ta” khi phát biểu khái quát về bổn phận người lính (p000284), tự xưng “Tôi”, gọi cấp trên trực tiếp là “thưa ngài” (p000289) hoặc theo cấp bậc “Trung úy” đúng như nguồn (p000295) kèm tiểu từ kính ngữ “ạ”. (6) Bảo toàn nguyên vẹn câu hỏi cảm thán nội tâm dưới điểm nhìn của Trung úy Schwarkopf ở câu 2 p000291 (“...và người chỉ huy của họ lại là một cô bé sao?”), chỉ số chú thích trên cao “¹³” ngay sau “Tsugene¹³” ở p000285 tương ứng với thẻ `<html:sup>13</html:sup>` trong `xhtml` nguồn, cùng thời gian và mức độ chắc chắn của các mệnh đề giả định và điều kiện (khả thể quá khứ ở câu 2 p000283; câu điều kiện giả định ở câu 3 p000283; câu điều kiện trong thoại ở p000284; khả thể và các mệnh đề giả định/điều kiện ở câu 1, 4, 5 p000285; suy luận nội tâm ở câu 1 p000290; mệnh đề nhượng bộ giả định trong cặp dấu gạch ngang dài ở p000298; giả định phủ định kép về liên hệ lịch sử thế giới cũ ở câu 4 p000299); bảo toàn chính xác cả 2 vị trí nhấn mạnh Markdown `*lòng yêu nước*` và `*lòng trung thành quả cảm*` tại p000287 tương ứng với hai thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô theo đúng DEC-P01-002 (17/18 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)'
  alternatives_vi:
  - gã (thay cho “lão” khi quy chiếu Tsugene tại câu 4 p000285 — ưu tiên “lão” để đồng bộ với ch-04-b15 p000082 và vol-04-ch-01-b16 p000107) / “Rõ, thưa ngài!” (thay cho “Vâng, thưa ngài!” tại p000289 — ưu tiên “Vâng, thưa ngài!” để đồng bộ ch-03-b12 p000258 và ch-03-b13 p000281)
