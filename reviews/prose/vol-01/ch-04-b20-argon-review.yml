  proposed_vi: Văn phòng Bộ Tổng Tham mưu / Cụm tập đoàn quân phương Tây / cuộc đụng độ trực diện / cường quốc / thương vong chiến đấu / kế hoạch tuyển quân thời bình / tiêu hao / sự tiêu hao / sự hao phí vật chất / nền kinh tế quốc dân / “hy sinh” / “sự tiêu hao” / trên quy mô toàn cầu / ảo tưởng / những món hàng dùng một lần rồi bỏ / lý thuyết chiến tranh tổng lực / lý thuyết chiến tranh thế giới / chiến tranh tổng lực / chiến tranh thế giới / tiểu thuyết khoa học viễn tưởng / tiền tuyến / trung úy / Khối Thịnh vượng chung / tùy viên quân sự / hậu phương / sĩ quan tham mưu / công tác đào tạo sĩ quan tham mưu / Trung úy Tanya Degurechaff / Tanya / chuyến đi thực tế tham mưu / chương trình đào tạo quân sự / Mainen / điểm nghỉ dưỡng suối nước nóng / khu nghỉ dưỡng phục hồi sức khỏe / học viên học viện chiến tranh / quy trình tuyển sinh / một thế giới còn lâu mới xóa bỏ phân biệt giới tính / “ưu tiên phụ nữ” / chặng hành quân đường bộ / lục quân / vị sĩ quan cấp trên / các cơ sở của lục quân tại địa phương / binh chủng pháp sư / pháp sư / nữ sĩ quan / bộ quân quy / Đế quốc / nữ quân nhân / hoàng gia / công chúa hoàng gia / đoàn tùy tùng / phục vụ trên danh nghĩa / cẩm nang nghi thức lỗi thời / giới quý tộc / hoàng tộc
  alternatives_vi:
