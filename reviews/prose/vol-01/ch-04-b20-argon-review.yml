  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ và danh xưng đã khóa tạm từ Chương 0–3 cùng ch-04-b01 → ch-04-b19: “Văn phòng Bộ Tổng Tham mưu” (ch-01-b15, ch-04-b11/b16/b17, p000202), “Cụm tập đoàn quân phương Tây” (ch-03-b01 p000010, ch-03-b12 p000261, ch-03-b13 p000263, p000202), “cường quốc” (ch-04-b12/b19, p000202), “tiêu hao” / “sự tiêu hao” (ch-03-b14, ch-04-b14/b15, p000204, p000205), “trên quy mô toàn cầu” (ch-04-b12 p000019, p000205), “ảo tưởng” (P05-delusion / ch-04-b16 p000121, ch-04-b17 p000122, p000205), “chiến tranh tổng lực” và “chiến tranh thế giới” (vol02-ch02-b06-total-war / ch-04-b12–b19, p000207, p000210, p000212), “tiền tuyến” (p000213, p000220), “trung úy” viết thường khi đứng làm danh từ chung chỉ quân hàm (b06-first-lieutenant, p000214), “Khối Thịnh vượng chung” (ch-01-b03 p000034, ch-04-b13 p000031, ch-04-b16 p000121, ch-04-b19 p000194, p000214), “hậu phương” (p000214, p000220), “sĩ quan tham mưu” (ch-04-b16–b18, p000215), “Trung úy Tanya Degurechaff” / “Tanya” (ch-04-b07 p000148, p000151, p000215–p000218), “học viên học viện chiến tranh” (ch-04-b01/b07/b11, p000216), “lục quân” (p000218, p000219), “sĩ quan cấp trên” (ch-04-b06 p000130, ch-04-b11 p000220, p000218), “pháp sư” (p000219, p000220) và “Đế quốc” (p000219); khóa tạm “cuộc đụng độ trực diện” (p000202), “thương vong chiến đấu” và “kế hoạch tuyển quân thời bình” (p000203), “sự hao phí vật chất” và “nền kinh tế quốc dân” (p000204), “những món hàng dùng một lần rồi bỏ” (p000206), “tiểu thuyết khoa học viễn tưởng” (p000213), “tùy viên quân sự” (p000214), “công tác đào tạo sĩ quan tham mưu”, “chuyến đi thực tế tham mưu” và “chương trình đào tạo quân sự” (p000215), địa danh “Mainen”, “điểm nghỉ dưỡng suối nước nóng” và “khu nghỉ dưỡng phục hồi sức khỏe” (p000216), “quy trình tuyển sinh”, “một thế giới còn lâu mới xóa bỏ phân biệt giới tính” và ““ưu tiên phụ nữ”” (p000217), “chặng hành quân đường bộ” và “các cơ sở của lục quân tại địa phương” (p000218), “binh chủng pháp sư”, “nữ sĩ quan”, “bộ quân quy” và “nữ quân nhân” (đồng bộ p000219–p000220), cùng “hoàng gia” / “hoàng tộc”, “công chúa hoàng gia”, “đoàn tùy tùng”, “phục vụ trên danh nghĩa”, “cẩm nang nghi thức lỗi thời” và “giới quý tộc” (p000220)."
