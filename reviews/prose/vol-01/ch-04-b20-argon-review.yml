  volume: vol-01
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md qua sự chuyển cảnh từ điểm nhìn của Trung tá von Lergen sang điểm nhìn của Trung úy Tanya Degurechaff: giữ đại từ “ông” trong trần thuật và “Mình” / “mình” / “chúng ta” trong độc thoại nội tâm cho Lergen ở Phân cảnh 1 (p000202–p000214), chuyển sang “Trung úy Tanya Degurechaff” / “Tanya” và đại từ “Nó” / “nó” kết hợp phản thân “mình” cho Tanya ở Phân cảnh 2 (p000215–p000220), xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice, bảo toàn cấu trúc tăng tiến “không chỉ... mà còn...” cùng chủ thể ở p000218, các câu hỏi nội tâm/thành tiếng, các mệnh đề giả định/điều kiện và cả 10 đoạn có nhấn mạnh `<html:em>` (bao gồm 2 đoạn đảo ngược nhấn mạnh p000204 và p000212)."
