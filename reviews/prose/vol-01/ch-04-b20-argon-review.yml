- id: ch04-b20-lergen-to-tanya-pov-shift-pronouns-conditionals-and-inverted-emphasis
  source_term: lergen_to_tanya_pov_shift_pronouns_conditionals_and_inverted_emphasis_ch04_b20
  proposed_vi: 'tiếp nối trực tiếp ch-04-b19 (p000177–p000201), lô ch-04-b20 (chapter009b.xhtml/p000202–p000220) gồm hai phân cảnh chuyển tiếp từ điểm nhìn của Trung tá von Lergen trên chuyến tàu (p000202–p000214) sang điểm nhìn xoay quanh Trung úy Tanya Degurechaff trong chuyến đi thực tế tham mưu tại vùng núi Mainen sau khoảng ngắt cảnh (class="space-break1" ở p000215–p000220), tuân thủ nghiêm ngặt DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Ở Phân cảnh 1 (p000202–p000214), quy chiếu Trung tá von Lergen trong đoạn trần thuật ngôi thứ ba p000202 bằng đại từ trang trọng “ông” (đồng bộ ch-04-b17–b19); trong chuỗi các đoạn độc thoại nội tâm trực tiếp được đánh dấu `<html:em>` (p000203–p000208, p000210, p000212–p000214) và câu tự nhủ lẩm bẩm thành tiếng một mình (p000211), Lergen tự quy chiếu ở ngôi thứ nhất số ít bằng “Mình” / “mình” (đồng bộ ch-04-b19 p000179 và vol-04-ch-04-b02/b03), dùng đại từ gộp ngôi thứ nhất số nhiều “chúng ta” / “Chúng ta” khi nghĩ về phía Đế quốc (p000203, p000204, p000206 — đồng bộ ch-04-b19 p000199), và quy chiếu Chuẩn tướng von Zettour bằng “Ông ấy” (p000205; lưu ý từ “nó” ở p000206–p000208 và p000212–p000213 hoàn toàn chỉ quy chiếu danh từ bất động vật là lập luận / bài viết / khái niệm). (2) Ở Phân cảnh 2 (p000215–p000220), sau khoảng ngắt cảnh tại p000215, mạch truyện chuyển về trần thuật ngôi thứ ba bám sát Trung úy Tanya Degurechaff: quy chiếu Tanya nhất quán bằng danh xưng “Trung úy Tanya Degurechaff” / “Tanya” và đại từ ngôi thứ ba “Nó” / “nó” kết hợp phản thân “mình” theo đúng DEC-P01-001 (p000215–p000218; tuyệt đối không dùng “cô” cho Tanya; lưu ý từ “nó” ở câu 2 p000216 chỉ quy chiếu thị trấn nghỉ dưỡng Mainen), đồng thời quy chiếu nhóm học viên tham mưu bằng “họ” (p000218). (3) Trong các câu có đại từ ngôi thứ hai phiếm chỉ trong nguồn (p000205, p000219, p000220), lược đại từ ngôi thứ hai phiếm chỉ (p000205, p000220) hoặc dùng chủ ngữ khái quát “người ta” (p000219) theo đúng quy ước direct-address choice. (4) Bảo toàn nguyên vẹn đối tượng và độ mở của tất cả các câu hỏi độc thoại nội tâm trực tiếp (p000203–p000205, p000208, p000212–p000214) và câu hỏi lẩm bẩm thành tiếng kèm dấu chấm lửng (p000209, p000211) của Trung tá von Lergen, cấu trúc tăng tiến “không chỉ... mà còn...” giữ cùng một chủ thể (“Cánh đàn ông”) ở câu 2 p000218 theo style-guide.md, cùng chính xác thời gian và mức độ chắc chắn của các mệnh đề giả định và điều kiện (giả định chiến đấu và hệ quả tiêu hao ở p000204; giả định theo lẽ thường ở p000205; câu điều kiện ở p000206; giả định nhận thức kết hợp phủ định khả năng và so sánh giả định ở p000210; giả định phủ định “nơi các thành viên hoàng gia sẽ chẳng bao giờ bị cử tới” ở p000220). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở cả 10 đoạn có thẻ `<html:em>` trong `xhtml` nguồn theo đúng DEC-P01-002, đặc biệt là 2 đoạn có cấu trúc đảo ngược nhấn mạnh (`<html:span>` nằm xen giữa các thẻ `<html:em>`): bọc trọn đoạn bằng `*...*` tại 8 đoạn p000203, p000205–p000208, p000210, p000213 và p000214; giữ đúng 2 cụm `*...*` và để cụm “sự tiêu hao” ở câu 3 nằm ngoài dấu `*` tại p000204 (`*... Phải,* sự tiêu hao *sinh mạng con người. ...*`); giữ đúng 3 cụm `*...*` và để hai thuật ngữ “chiến tranh tổng lực” cùng “chiến tranh thế giới” nằm ngoài dấu `*` tại p000212 (`*Mình đã từng thấy nó trong một bài viết nào khác chăng? Không, không phải thế. Mình vừa mới nghe thấy hai từ* chiến tranh tổng lực *và* chiến tranh thế giới *lần đầu tiên ngay lúc này. Mình vừa mới biết đến chúng thôi.*`), đồng thời không tự ý thêm bất kỳ dấu `*` nào ở 9/19 đoạn còn lại (p000202, p000209, p000211, p000215–p000220)'
  alternatives_vi:
  - tôi (thay cho “mình” trong câu tự nhủ lẩm bẩm thành tiếng một mình của Lergen tại p000211 — ưu tiên “mình” để đồng bộ với dòng độc thoại nội tâm ngay trước và sau đó của Lergen cùng quy ước tự thoại ở vol-04-ch-04-b02/b03)
