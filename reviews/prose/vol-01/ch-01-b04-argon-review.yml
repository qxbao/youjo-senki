locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000044
  locks:
  - Giữ câu thành ngữ mở đầu “Nhưng sự thật còn lạ hơn hư cấu”, giả định phản thực tại ở quá khứ kèm tình thái phỏng đoán “Nếu khi ấy được nói thẳng những gì mình nghĩ, có lẽ Tanya đã mô tả…”, đại từ tự quy chiếu “mình” và cụm “khoảnh khắc một ý muốn chết thành hình”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000045
  locks:
  - Giữ giọng thông báo khẩn cấp qua đài phát thanh, cách xưng hô “Thưa mọi người, tôi xin nhắc lại… Chúng tôi nhận được tin…”, và các tên gọi “Đế quốc”, “Liên minh Entente Regadonia”, “Quân đội Liên minh Entente”, “Quân đội Đế quốc”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000046
  locks:
  - Giữ các thuật ngữ “lực lượng thiết giáp cùng các đơn vị khác của quân ta”, vị trí “phía dưới chỗ Tanya” (lặp tên Tanya, không dùng đại từ “cô”), “phóng viên chiến trường” và “qua sóng vô tuyến”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000047
  locks:
  - Giữ từ tình thái suy đoán “...Hẳn”, thuật ngữ “màn quảng bá”, cụm “quốc lực, trình độ công nghệ và vũ trang vượt trội hẳn” và không thêm dấu nhấn mạnh Markdown khi nguồn không có.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000048
  locks:
  - Giữ các thuật ngữ “giới chỉ huy cấp cao”, “tuyên truyền về một Đế quốc công minh, hùng mạnh”, “Liên minh Entente”, “danh nghĩa chính đáng”, “các phương tiện truyền thông đại chúng”, cùng cấu trúc phủ định–nhượng bộ “chẳng có gì phải che giấu, hoặc ít nhất có rất ít”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000049
  locks:
  - Giữ phân biệt đại từ “mình” (trong nội dung nghe tin tự quy chiếu) và “nó” (trong trần thuật theo DEC-P01-001), câu hét trong ngoặc kép “Mong các người thối rữa hết đi!”, cùng các cụm “huấn luyện thực địa”, “nhà nước quân sự”, “Being X” và “một người tốt, tử tế”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000050
  locks:
  - Giữ đại từ trần thuật “nó” song hành cùng tên “Tanya”, sự kiện so sánh “Chiến tranh Vùng Vịnh”, các cụm trong ngoặc kép “chẳng tệ”, “cân nhắc chính trị”, “chỉ có khổ mà chẳng được gì”, và các thuật ngữ “giới chỉ huy cấp cao”, “Quân đội Đế quốc”, “Lãnh thổ Norden đang có tranh chấp”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000051
  locks:
  - Giữ họ tên đầy đủ “Tanya Degurechaff”, các cụm “tốt nghiệp học viện quân sự”, “pháp sư tinh nhuệ”, sắc thái “thấy khó chịu trước gương mặt như búp bê của mình”, và sự tách biệt hai ngôi “Nếu mình không phải Tanya, mình cũng chẳng muốn dính dáng gì đến nó ngoài những việc bổn phận bắt buộc phải làm”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000052
  locks:
  - Giữ các thuật ngữ “nhận quân hàm sĩ quan trong Quân đội Đế quốc”, “các giáo quan”, “bậc lương”, cụm trong ngoặc kép “pháp sư bé gái”, đại từ trần thuật “nó” và nhịp ngắt bằng dấu gạch ngang dài “—cho đến lúc này”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000053
  locks:
  - Giữ đại từ trần thuật “nó”, sắc thái quy gán “Theo một nghĩa nào đó, họ đang bảo nó có khiếm khuyết”, và các cụm “nhiệm vụ trực tiếp chiến đấu”, “Quân đội Đế quốc dễ dàng làm chủ chiến trường—một vận may bất ngờ cho trận đầu tiên của nó”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000054
  locks:
  - Giữ từ tình thái “Có vẻ”, sự chuyển điểm nhìn tách bạch giữa “nó” và “Mình” ở câu “Mình cũng muốn nó tạo dựng được một vài mối quan hệ”, cùng cụm “được vinh danh và khen thưởng nhiều lần”.
