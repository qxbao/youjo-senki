- id: ch03-b01-tanya-pov-pronouns-and-hawkeye-lizard-radio-dialogue
  source_term: Tanya third-person narration/POV-dissociation pronouns and first-person interior monologue pronouns in p000002–p000010/p000012–p000013/p000015/p000017/p000021/p000023, intra-paragraph POV shifts in p000008/p000015, generic tactical statements in p000007/p000018, radio dialogue pronouns between Hawkeye 03 (Tanya) and Lizard 08 (Seventh Provisional Field Command) in p000011/p000014/p000016/p000019/p000020/p000022, and absence of italicized emphasis across p000001–p000023
  proposed_vi: mở đầu Chương 3 trên bầu trời mặt trận Rhine với điểm nhìn của Thiếu úy Ma pháp Tanya Degurechaff, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–2: trong các câu/đoạn trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya hoặc khi Tanya tự tách góc nhìn nhắc đến danh tính bên ngoài (p000002, câu 4 p000008, p000010, câu 2 p000015), dùng tên riêng “Thiếu úy Ma pháp Tanya Degurechaff” / “Tanya” và đại từ trần thuật “nó” / “Nó” (p000002, p000010 — tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm của Tanya); trong các câu/đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000003–p000009, p000012, p000013, p000015, p000017, p000021, p000023), dùng nhất quán đại từ tự quy chiếu “mình” theo đúng DEC-P01-001; đặc biệt bảo toàn chính xác sự chuyển đổi từ ngôi thứ nhất nội tâm (“mình”) sang việc dùng tên riêng “Tanya” ngay trong cùng đoạn văn tại p000008 (câu 1–2 nội tâm ngôi thứ nhất “mình”, câu 4 chuyển sang lời kể ngôi thứ ba “Tanya”) và ngay trong cùng câu văn tại câu 2 p000015 (“có lẽ mình vẫn còn may mắn khi bộ phận kiểm soát mặt đất rốt cuộc cũng kết nối được với một trong những cuộc gọi lặp đi lặp lại—và đầy bực dọc—của Tanya”); trong các câu nhận định chiến thuật khái quát tại câu 2 p000007 và p000018, dùng chủ ngữ phiếm chỉ “người ta” (p000007) hoặc cấu trúc vô nhân xưng tự nhiên (p000018) để tránh biến nhận định chung thành lời nói với người nghe trực tiếp; trong đối thoại vô tuyến giữa Hawkeye 03 (Tanya) và Lizard 08 (Bộ chỉ huy Dã chiến Lâm thời số 7): Hawkeye 03 tự xưng “tôi” / “Tôi” (p000019, p000022 — đồng bộ giọng công vụ trên sóng vô tuyến của Fairy 08 ở Chương 1) và gọi đơn vị đầu dây bên kia là “các vị” (p000019, p000022 — trung tính về cấp bậc của người trực máy, đồng bộ plural-address-p000076), còn phía Lizard 08 tự xưng đại diện cho lực lượng dưới mặt đất là “Bọn tôi” (p000020 — đồng bộ giọng lính chiến trường ở ch-01-b06 p000078) và gọi Hawkeye 03 là “cô” (p000020 — đồng bộ cách Norden Control và Đội quan sát gọi Tanya ở ch-01-b11 p000193 và ch-02-b16 p000205); bảo toàn chính xác các câu hỏi nội tâm/tu từ tại p000003, p000009, các cấu trúc điều kiện/giả định tại p000008, p000012, p000017, p000023, và không dùng `*...*` ở bất kỳ đoạn nào theo đúng DEC-P01-002 do nguồn không có thẻ nhấn mạnh
  alternatives_vi:
  - Chúng tôi (thay cho “Bọn tôi” trong lời đáp qua vô tuyến của Lizard 08 tại p000020 — ưu tiên “Bọn tôi” để thể hiện sắc thái mừng rỡ tự nhiên, gần gũi của các binh sĩ dưới mặt đất đang khao khát có thêm một đôi mắt hỗ trợ trên bầu trời)
