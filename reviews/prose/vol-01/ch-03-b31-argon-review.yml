- id: ch03-b31-tanya-pov-shifts-type95-liturgical-and-surrender-broadcast-registers-and-emphasis
  source_term: tanya_pov_shifts_type95_liturgical_and_surrender_broadcast_registers_and_emphasis_ch03_b31
  proposed_vi: "Toàn bộ 24 đoạn của lô ch-03-b31 (chapter007b.xhtml/p000199–p000222) tiếp nối trực tiếp cuối ch-03-b30 (p000198) và khép lại trước dấu ngắt cảnh ở p000223, khắc họa phản ứng hỏa lực của toán pháp sư Cộng hòa, quá trình Thiếu úy Tanya Degurechaff kích hoạt vụ nổ ma thuật tương tự nhiệt áp thông qua Elinium Type 95 dưới tác động cưỡng ép tinh thần của lời nguyền, cùng lời kêu gọi đầu hàng theo Công ước Worms, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Phân tách chuẩn xác giữa trần thuật ngôi thứ ba mang điểm nhìn của Tanya và độc thoại nội tâm ngôi thứ nhất theo đúng DEC-P01-001: tại các câu/đoạn trần thuật ngôi thứ ba về Tanya (câu 1 p000201, câu 1–2 p000203, p000207, câu 2 p000210, câu 1 p000217, câu 2 p000218, p000220), giữ tên riêng “Tanya” (p000203, p000207, p000220) hoặc họ “Degurechaff” (p000217) và dùng nhất quán đại từ ngôi thứ ba “Nó” / “nó” (câu 1 p000201, câu 2 p000203, câu 2–3 p000207, câu 2 p000210, câu 2 p000218, câu 2 p000220), tuyệt đối không dùng đại từ nữ “cô” / “cô ấy”; tại các câu/đoạn độc thoại nội tâm ngôi thứ nhất tự quy chiếu của Tanya (p000199, p000200, câu 2 p000201, p000205, câu 1 & 3 p000210, câu 1 p000212, p000221), dùng nhất quán “Mình” / “mình” (đặc biệt bảo toàn sự chuyển dịch điểm nhìn ngay trong đoạn ở p000201 và p000210 giữa trần thuật ngôi thứ ba “Nó / nó” và nội tâm ngôi thứ nhất, đồng thời dùng “hắn” ở câu 2 p000210 để chỉ Tồn tại X đúng với thái độ thù địch của Tanya). (2) Xử lý đại từ ngôi thứ hai phiếm chỉ trong nhận định khái quát theo đúng quy ước direct-address choice (work/run-state/pending-terms.yml): dùng “tâm trí người ta” ở p000208 và “người ta chết ngay tức khắc” ở câu 3 p000212 (đồng bộ trực tiếp với ch-03-b28–b30). (3) Phân biệt rõ ba thanh điệu thoại trong lô: trong thông báo vô tuyến từ sở chỉ huy (p000202), giữ giọng cảnh báo tác chiến ngắn gọn, chuẩn mực của “CP”; trong chuỗi lời cầu nguyện/hô gọi tôn giáo do lời nguyền của Elinium Type 95 cưỡng ép thốt ra khi giải phóng mana (p000206, p000209, p000213), dùng giọng sùng đạo trang trọng với “Hỡi các thánh đồ”, “Chúa chúng ta” / “Chúa” và đại từ gộp “chúng ta” / “mình”; trong thông điệp phát thanh kêu gọi đầu hàng gửi tới toán pháp sư Cộng hòa sau vụ nổ (p000219, p000222), dùng cụm hô gọi quân sự đĩnh đạc “Hỡi các chiến binh của Quân đội Cộng hòa, hãy nghe đây:” và cặp đại từ ngoại giao chuẩn mực “các người – chúng tôi” (đồng bộ trực tiếp với ch-03-b30 p000195, p000197); riêng ở nội tâm, Tanya gọi toán pháp sư Cộng hòa là “họ” / “Đám người này” / “những kẻ này” / “đám ngốc hiếu chiến này” (p000199, p000200, p000203, p000204, p000220). (4) Bảo toàn trọn vẹn cấu trúc câu hỏi, phủ định, điều kiện, tình thái và cấu trúc “không chỉ… mà còn…” theo canon/style-guide.md: câu hỏi tu từ ở p000199, câu hỏi phủ định và câu hỏi phỏng đoán cùng dấu gạch ngang dài ở p000200, dấu chấm lửng và phủ định ở p000201, điều kiện giả định ở p000203, câu hỏi tu từ kết hợp tình thái phỏng đoán và mệnh đề nhượng bộ – điều kiện ở p000204, phủ định ở p000207 và p000209, điều kiện giả định trái thực tế và tình thái phỏng đoán ở câu 2 p000210, cấu trúc đối lập phủ định – khẳng định (“không phải là muốn dừng mà không dừng được, mà là nếu dừng lại thì...”) và phủ định ở p000212, tình thái khả năng ở p000214 và p000215, mệnh đề nhượng bộ và điều kiện phủ định ở p000217, cấu trúc “Nó không chỉ cắt đứt liên lạc mà còn khiến việc duy trì các thuật thức bay trở nên khó khăn” giữ cùng một chủ ngữ “Nó” (nhiễu mana) ở câu 1 p000218 theo đúng quy tắc sau pilot-01 trong style-guide.md, câu hỏi gián tiếp và phủ định ở p000220, cùng mệnh đề điều kiện ở p000221 và p000222. (5) Tuân thủ nghiêm ngặt DEC-P01-002 về nhấn mạnh Markdown: chỉ duy nhất 1/24 đoạn nguồn có thẻ `<html:em>` là p000205 (`<html:em>I</html:em>`), được bảo toàn chính xác thành `*mình*` (“Ít nhất thì *mình* sẽ chọn một giải pháp hợp lý.”); toàn bộ 23/24 đoạn còn lại không có nhấn mạnh trong XHTML nguồn và hoàn toàn không dùng dấu `*...*`."
  alternatives_vi:
  - "không có (cách phân biệt đại từ trần thuật “Nó / nó” và nội tâm “Mình / mình” theo DEC-P01-001, xử lý đại từ ngôi thứ hai phiếm chỉ bằng “người ta” ở p000208 và p000212, giữ cặp xưng hô “các người – chúng tôi” ở p000222 và bảo toàn duy nhất một cụm nhấn mạnh `*mình*` ở p000205 theo DEC-P01-002 là phương án chuẩn xác và nhất quán nhất)"
