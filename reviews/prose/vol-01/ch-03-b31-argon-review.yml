  - "vụ nổ ma thuật không bị giam hãm (thay cho “vụ nổ ma thuật không giới hạn” tại p000214 — ưu tiên “vụ nổ ma thuật không giới hạn” ở p000214 kết hợp với “vụ nổ ma thuật lan tỏa tự do” ở p000217 để diễn đạt tự nhiên trạng thái mana thoát khỏi giới hạn nén và phát nổ trong không khí mở) / phù phổi (thay cho “xung huyết phổi” tại p000214 — ưu tiên “xung huyết phổi” vì sát nghĩa y khoa trực tiếp với thuật ngữ nguồn chỉ tình trạng ứ máu/xung huyết ở phổi do chấn thương áp suất) / Hiệp ước Worms (thay cho “Công ước Worms” tại p000222 — ưu tiên “Công ước Worms” vì quy định quyền lợi tù binh chiến tranh tương ứng với Công ước Geneva/Hague trong lịch sử quân sự)"
