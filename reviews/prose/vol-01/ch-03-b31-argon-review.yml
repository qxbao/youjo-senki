- segment_id: YS-LN01/Text/chapter007b.xhtml/p000199
  locks:
  - "Giữ đại từ độc thoại nội tâm ngôi thứ nhất “Mình” / “mình” theo DEC-P01-001, đại từ “họ” / “Đám người này” cho phía đối phương, câu hỏi tu từ ở câu 2 và mệnh đề phủ định “không khỏi nghi ngờ sự tỉnh táo của họ” ở câu 3."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000200
  locks:
  - "Giữ đại từ nội tâm “mình” theo DEC-P01-001, câu hỏi phủ định ở câu 1, câu hỏi phỏng đoán ở câu 2, dấu gạch ngang dài ở câu 4, cùng các cụm “doanh nhân hiện đại”, “kết quả hợp lý”, “nhân tính”, “đám ngốc hiếu chiến này”, “kịch bản tồi tệ nhất có thể xảy ra”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000201
  locks:
  - "Bảo toàn sự chuyển dịch điểm nhìn ngay trong đoạn theo đúng DEC-P01-001: dùng đại từ trần thuật ngôi thứ ba “Nó” ở câu 1 và chuyển sang đại từ tự quy chiếu nội tâm “Mình” / “mình” ở câu 2; giữ dấu chấm lửng cuối câu 1, cùng các cụm “tiền lương làm thêm giờ”, “khoản phụ cấp độc hại”, “môi trường làm việc nguy hiểm”, “gửi hóa đơn”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000202
  locks:
  - "Giữ thông báo vô tuyến từ sở chỉ huy với các thuật ngữ “CP”, “cảnh báo cho toàn chiến trường” và “nhiễu mana”: ““Đây là CP phát cảnh báo cho toàn chiến trường. Hãy coi chừng nhiễu mana.””."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000203
  locks:
  - "Giữ tên riêng “Tanya” ở câu 1 và đại từ trần thuật ngôi thứ ba “nó” ở câu 2 theo DEC-P01-001, bảo toàn mệnh đề điều kiện ở câu 3, cùng các cụm “CP”, “mana”, “biết suy tính logic và có đầu óc kinh tế”, “coi trọng con số một hơn con số không”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000204
  locks:
  - "Giữ câu hỏi tu từ ở câu 1, tình thái phỏng đoán (“Biết đâu...”) và phủ định (“không chịu mạo hiểm”) ở câu 2, mệnh đề nhượng bộ (“Kể cả có bị ăn bom trước đi nữa”) và điều kiện (“nếu còn sống sót”) ở câu 3, cùng các cụm “tín hiệu vô tuyến”, “những kẻ có lý trí”, “giải pháp hợp lý”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000205
  locks:
