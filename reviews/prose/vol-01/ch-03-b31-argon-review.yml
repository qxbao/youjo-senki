  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, định danh vô tuyến và khái niệm quân sự/tôn giáo/kinh tế đã khóa tạm ở `canon/glossary-pending.yml` và các lô trước: “nhân tính” (ch-03-b30 p000183: p000200), “CP” (vol02-ch04-b08-cp: p000202, p000203), “cảnh báo cho toàn chiến trường” và “nhiễu mana” (ch-03-b29 p000167, p000171; ch-03-b30 p000187: p000202, p000217), “Tanya” / “Degurechaff” (p000203, p000207, p000217, p000220), “Chúa” (P06-lord, đồng bộ ch-03-b29 p000178: p000206, p000209), “Elinium Type 95” (ch-03-b28 p000148, ch-03-b29 p000161: p000207), “Trường phái kinh tế Chicago” / “Trường phái Chicago” (P03-Chicago-school, đồng bộ ch-00-b03 p000046: p000211, p000212), “tám nghìn feet” (ch-03-b26 p000100, ch-03-b28 p000145: p000215), “pháp sư không quân” (ch-03-b26 p000083, ch-03-b27 p000130: p000215), “các thuật thức bay” (P01-formulas: p000218), “Quân đội Cộng hòa” (ch-03-b18 p000375, ch-03-b20 p000426: p000219), “đại đội” và “hậu phương” (ch-03-b25 p000050, ch-03-b30 p000194: p000221); đồng thời khóa tạm các thuật ngữ y sinh học, vật lý nổ, kinh tế học và luật chiến tranh phát sinh trong lô: “doanh nhân hiện đại” và “kết quả hợp lý” (p000200), “tiền lương làm thêm giờ”, “khoản phụ cấp độc hại”, “môi trường làm việc nguy hiểm” và “gửi hóa đơn” (p000201), “coi trọng con số một hơn con số không” (p000203), “giải pháp hợp lý” (p000204, p000205), “lời nguyền của Elinium Type 95” và “sự hưng phấn tôn giáo” (p000207), “đám cộng sản” và “gọi tôn giáo là thuốc phiện” (p000210), “ma túy” (p000211, p000212), “miền đất hứa” (p000213), “vụ nổ nhiệt áp”, “giới hạn nén áp suất”, “vụ nổ ma thuật không giới hạn”, “áp suất khí quyển”, “xẹp phổi” và “xung huyết phổi” (p000214, p000215), “tình trạng thiếu oxy” và “ngộ độc khí carbon monoxide” (p000215), “vụ nổ ma thuật lan tỏa tự do” (p000217), cùng “quyền lợi tù binh” và “Công ước Worms” (p000222)."
