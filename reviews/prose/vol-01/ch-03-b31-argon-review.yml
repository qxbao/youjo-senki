  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 24 đoạn của ch-03-b31: giữ đại từ trần thuật ngôi thứ ba “Nó” / “nó” cho Tanya tại p000201, p000203, p000207, p000210, p000218, p000220 và đại từ nội tâm “Mình” / “mình” ở toàn bộ các câu độc thoại nội tâm, xử lý đại từ ngôi thứ hai phiếm chỉ ở p000208 và p000212 bằng “người ta”, giữ cùng chủ ngữ cho cấu trúc “không chỉ… mà còn…” ở p000218, và chỉ đánh dấu nhấn mạnh `*mình*` tại đúng 1 vị trí có `<html:em>` ở p000205."
