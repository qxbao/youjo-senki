- id: ch03-b31-magic-explosion-chicago-school-medical-and-military-law-terms
  source_term: magic_explosion_chicago_school_medical_and_military_law_terms_ch03_b31
  proposed_vi: "doanh nhân hiện đại / kết quả hợp lý / nhân tính / tiền lương làm thêm giờ / khoản phụ cấp độc hại / môi trường làm việc nguy hiểm / gửi hóa đơn / CP / cảnh báo cho toàn chiến trường / nhiễu mana / Tanya / mana / coi trọng con số một hơn con số không / tín hiệu vô tuyến / giải pháp hợp lý / tạp âm trong suy nghĩ / Hỡi các thánh đồ / Chúa / lời nguyền của Elinium Type 95 / sự hưng phấn tôn giáo / đám cộng sản / gọi tôn giáo là thuốc phiện / Trường phái kinh tế Chicago / Trường phái Chicago / ma túy / miền đất hứa / vụ nổ nhiệt áp / giới hạn nén áp suất / vụ nổ ma thuật không giới hạn / áp suất khí quyển / xẹp phổi / xung huyết phổi / quá trình đốt cháy / nồng độ oxy / tình trạng thiếu oxy / ngộ độc khí carbon monoxide / tám nghìn feet / pháp sư không quân / Degurechaff / vụ nổ ma thuật lan tỏa tự do / các thuật thức bay / các chiến binh của Quân đội Cộng hòa / đại đội / hậu phương / giờ nghỉ uống trà / quyền lợi tù binh / Công ước Worms"
  alternatives_vi:
  - "vụ nổ ma thuật không bị giam hãm (thay cho “vụ nổ ma thuật không giới hạn” tại p000214 — ưu tiên “vụ nổ ma thuật không giới hạn” ở p000214 kết hợp với “vụ nổ ma thuật lan tỏa tự do” ở p000217 để diễn đạt tự nhiên trạng thái mana thoát khỏi giới hạn nén và phát nổ trong không khí mở) / phù phổi (thay cho “xung huyết phổi” tại p000214 — ưu tiên “xung huyết phổi” vì sát nghĩa y khoa trực tiếp với thuật ngữ nguồn chỉ tình trạng ứ máu/xung huyết ở phổi do chấn thương áp suất) / Hiệp ước Worms (thay cho “Công ước Worms” tại p000222 — ưu tiên “Công ước Worms” vì quy định quyền lợi tù binh chiến tranh tương ứng với Công ước Geneva/Hague trong lịch sử quân sự)"
