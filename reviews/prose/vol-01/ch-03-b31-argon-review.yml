- segment_id: YS-LN01/Text/chapter007b.xhtml/p000206
  locks:
  - "Giữ lời hô gọi tôn giáo khi vận hành Elinium Type 95 với “Hỡi các thánh đồ”, “phước lành của Chúa chúng ta” và đại từ gộp “chúng ta”: ““Hỡi các thánh đồ, hãy tin vào phước lành của Chúa chúng ta. Hãy để chúng ta không biết đến sợ hãi.””."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000207
  locks:
  - "Giữ tên riêng “Tanya” và đại từ trần thuật ngôi thứ ba “Nó” / “nó” theo đúng DEC-P01-001, bảo toàn phủ định ở câu 3 (“vẫn không sao quen nổi”), cùng các thuật ngữ “mana”, “lời nguyền của Elinium Type 95”, “sự hưng phấn tôn giáo”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000208
  locks:
