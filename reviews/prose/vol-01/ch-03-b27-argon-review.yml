- id: ch03-b27-republican-officer-first-person-pov-continuity-pronouns-and-single-emphasis
  source_term: republican_officer_first_person_pov_continuity_pronouns_and_single_emphasis_ch03_b27
  proposed_vi: 'Toàn bộ 30 đoạn của lô ch-03-b27 (chapter007b.xhtml/p000103–p000132) tiếp nối trực tiếp Phân cảnh 2 của ch-03-b26 (p000083–p000102) dưới điểm nhìn tự sự ngôi thứ nhất của viên sĩ quan thuộc đại đội pháp sư yểm trợ trực tiếp của Cộng hòa, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Tuân thủ giới hạn chủ thể của DEC-P01-001: quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp dụng cho người kể chuyện phía Cộng hòa (từ “nó” duy nhất xuất hiện ở câu 5 p000109 nằm trong cụm `*nó thực sự là chuyện bất khả thi*`, hoàn toàn chỉ quy chiếu danh từ sự việc “việc bay lên quá độ cao 6.800 feet” ở câu trước, tuyệt đối không quy chiếu nhân vật); người kể chuyện phía Cộng hòa tự xưng nhất quán là “tôi” / “Tôi” kết hợp phản thân “mình” (p000122) và số nhiều “chúng tôi” / “Chúng tôi” cho đại đội / phe Cộng hòa (p000109, p000111, p000115, p000117, p000119, p000120, p000122, p000124, p000130, p000132); quy chiếu các pháp sư không quân nói chung hoặc các pháp sư Cộng hòa bị thương bằng “họ” / “bọn họ” (p000106, p000130, p000131); và quy chiếu pháp sư địch (Tanya, khi phía Cộng hòa chưa biết nhân dạng thực sự và đinh ninh đối phương là nam giới trong nguyên bản) nhất quán bằng “Tên đó” / “tên đó” (p000108, p000132), “Tên pháp sư địch này” / “tên pháp sư địch kia” (p000109, p000111), “tên lính Đế quốc đó” (p000112), “tên pháp sư đó” / “tên khốn đó” (p000118 — đồng bộ ch-03-b26 p000094), “cái của nợ phiền phức này” (p000122), cùng đại từ ngôi thứ ba nam giới “hắn” (p000115, p000128, p000129, p000131) để giữ nguyên góc nhìn nhận thức hạn chế của người kể chuyện Cộng hòa trước khi giáp mặt Tanya ở ch-03-b28. (2) Xưng hô trong hội thoại quân sự phía Cộng hòa: người kể chuyện / cấp dưới gọi đại đội trưởng là “Đại úy” (p000103) và “Ngài” (p000113 — đồng bộ với cách thưa “thưa ngài” ở ch-03-b23 p000007) kèm đại từ gộp “Chúng ta” (p000113), còn đại đội trưởng dùng đại từ gộp “chúng ta” (p000112) và gọi toàn bộ thuộc cấp dưới quyền là “các anh” trong câu mệnh lệnh quyết tử ở p000118. (3) Xử lý đại từ ngôi thứ hai phiếm chỉ trong các câu nhận định khái quát và câu hỏi tu từ theo đúng quy ước direct-address choice (work/run-state/pending-terms.yml): dùng chủ ngữ khái quát “người ta” tại câu 4 p000110 và câu 2 p000126, dùng đại từ phản thân khái quát “mình” tại p000114 (“Để kẻ địch nắm đầu mình từ trên cao là cầm chắc cái chết.”), và chuyển sang cấu trúc khái quát vô nhân xưng kết hợp phản thân “bản thân” tại câu 3 p000131 (“Còn có thể gọi hắn là gì khác ngoài một con ác quỷ đây?”) và câu 3 p000132 (“cho dù có phi thường đến đâu đi chăng nữa, đó vẫn là chuyện không thể nào thực hiện nổi nếu không tự ép bản thân quá sức.”). (4) Bảo toàn trọn vẹn các cấu trúc điều kiện, nhượng bộ, phủ định, câu hỏi nội tâm và cấu trúc tăng tiến theo đúng canon/style-guide.md: mệnh đề nhượng bộ ở p000111, điều kiện phủ định ở p000112, chuỗi điều kiện phủ định – nhượng bộ – khả thể hệ quả ở p000115, giữ nguyên đối tượng và độ mở của câu hỏi nội tâm ở p000119 (“Đó là một mệnh lệnh hay một tiếng gào thét đây?”), mức độ phỏng đoán (“Có lẽ tất cả chúng tôi sẽ bị tiêu diệt sạch”) và khả thể (“có thể còn có cả quân chi viện”) ở p000122, so sánh phủ định tuyệt đối ở câu 3 p000127, cấu trúc tăng tiến “không chỉ… mà còn…” giữ cùng chủ thể “Việc đó” ở câu 2 p000130, câu hỏi tu từ ở p000131, và mệnh đề nhượng bộ kèm dấu gạch ngang dài (—) ở p000132. (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 1 đoạn duy nhất có thẻ `<html:em>` trong `xhtml` nguồn là câu 5 p000109 (`Không, *nó thực sự là chuyện bất khả thi*.`), giữ từ `Không,` và dấu chấm câu nằm ngoài dấu `*` và toàn bộ 29/30 đoạn còn lại không có dấu `*` theo đúng DEC-P01-002.'
  alternatives_vi:
  - Đại úy (thay cho “Ngài” trong lời đáp của người kể chuyện tại p000113 — ưu tiên “Ngài” để tự nhiên trong nhịp thoại tiếp nối p000103 và đồng bộ với ch-03-b23 p000007)
