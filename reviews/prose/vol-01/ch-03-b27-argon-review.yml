- id: ch03-b27-high-altitude-climb-awacs-named-registry-and-devil-of-the-rhine-terms
  source_term: high_altitude_climb_awacs_named_registry_and_devil_of_the_rhine_terms_ch03_b27
  proposed_vi: 'Đại úy / pháp sư không quân / máy bay / sáu nghìn feet / ma pháp / AWACS / hệ thống cảnh báo sớm và chỉ huy trên không (AWACS) / quy tắc giao chiến / 6.800 feet / Sáu nghìn feet / quả cầu tính toán / súng trường / các trung đoàn sơn cước / bảy nghìn / mười hai nghìn / phi công tiêm kích / động tác cơ động né tránh khẩn cấp / Đế quốc / lực lượng mặt đất / lấy độ cao / quân mặt đất / cuộc chiến tổng lực / mana / Sean / vị chỉ huy / Bravo / Đội Bravo / Thượng đế / quân chi viện / Ôi Thượng đế ơi! / thuật thức quan sát tầm xa / tín hiệu ma lực / thư viện dữ liệu / quân tiếp viện / Pháp sư Định danh / Named / đại đội / tiểu đoàn / át chủ bài / Ace of Aces / Cộng hòa / “Pháp sư Định danh: Định danh—‘Ác quỷ sông Rhine’” / Ác quỷ sông Rhine / thuật thức kích nổ không gian bằng ma lực hạng nặng / thuật thức bắn tỉa quang học chính xác / chiến thuật “mồi câu” / tay bắn tỉa / chăm sóc tích cực / quân y / giao chiến / mười hai nghìn feet / tám nghìn'
  alternatives_vi:
  - 'sáu nghìn bộ, 6.800 bộ, mười hai nghìn bộ (thay cho “sáu nghìn feet”, “6.800 feet”, “mười hai nghìn feet” tại p000106, p000109, p000132 — ưu tiên giữ đơn vị “feet” ở những nơi nguồn có ghi và lược đơn vị ở “bảy nghìn”, “mười hai nghìn” tại p000109–p000110 và “tám nghìn” tại p000132 để đồng bộ hoàn toàn với ch-01-b01 p000006, ch-03-b02 p000026, ch-03-b05 p000072, p000082, ch-03-b07 p000124 và ch-03-b26 p000094, p000095, p000100, p000102) / hệ thống cảnh báo sớm và kiểm soát trên không (AWACS) (thay cho “hệ thống cảnh báo sớm và chỉ huy trên không (AWACS)” tại p000109 — ưu tiên “hệ thống cảnh báo sớm và chỉ huy trên không (AWACS)” vì sát thuật ngữ quân sự tiếng Việt và kế thừa “cảnh báo sớm” ở ch-03-b01 p000010, p000012) / các trung đoàn cao nguyên hoặc các trung đoàn vùng cao (thay cho “các trung đoàn sơn cước” tại p000109 — ưu tiên “các trung đoàn sơn cước” vì đúng thuật ngữ biên chế quân sự chỉ các đơn vị tác chiến vùng núi cao) / trận chiến dốc toàn lực (thay cho “cuộc chiến tổng lực” tại p000116) / Ôi Chúa ơi! (thay cho “Ôi Thượng đế ơi!” tại p000123 — ưu tiên “Ôi Thượng đế ơi!” để đồng bộ trực tiếp với “Thượng đế” ở ngay p000122 cũng như review-God, b07-god-vocative và ch-05-b09 p000207) / dấu hiệu ma lực (thay cho “tín hiệu ma lực” tại p000124 — ưu tiên “tín hiệu ma lực” để đồng bộ với vol02-ch04-b17, vol02-ch05-b06, vol03-ch01-b12 và vol03-ch02-b18) / thư viện (thay cho “thư viện dữ liệu” tại p000124 — ưu tiên “thư viện dữ liệu” đồng bộ với vol02-ch02-b12 p000308 khi chỉ cơ sở dữ liệu nhận diện ma lực của quả cầu tính toán) / Pháp sư Đăng ký và “Pháp sư Đăng ký: Danh hiệu—‘Ác quỷ sông Rhine’” (thay cho “Pháp sư Định danh” và ““Pháp sư Định danh: Định danh—‘Ác quỷ sông Rhine’”” tại p000125, p000128 — ưu tiên “Pháp sư Định danh” để đồng bộ trực tiếp với ch-05-b05 p000096, vol04-ch04-b14 p000024 và vol04-ch05-b01 p000007) / thuật thức nổ không gian ma lực cao (thay cho “thuật thức kích nổ không gian bằng ma lực hạng nặng” tại p000129) / hồi sức tích cực hoặc điều trị tích cực (thay cho “chăm sóc tích cực” tại p000130)'
