  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, quân hàm, đơn vị, danh hiệu và vũ khí trang bị đã khóa tạm từ Chương 1–2, ch-03-b01 → ch-03-b26 và các chương/tập sau: “Đại úy” (p000103), “vị chỉ huy” (ch-03-b26 p000090: p000119), “đại đội” và “tiểu đoàn” (p000125); “pháp sư không quân” (chapter1_b01_pending_terms, ch-03-b26 p000095, p000098, p000102: p000105, p000106, p000109, p000114, p000125, p000128, p000130) và “máy bay” (ch-03-b26 p000098: p000105); các mức độ cao “sáu nghìn feet” / “Sáu nghìn feet”, “6.800 feet”, “bảy nghìn”, “mười hai nghìn” / “mười hai nghìn feet” và “tám nghìn” (ch-03-b26 p000094, p000095, p000100, p000102: p000106, p000109, p000110, p000132); “quy tắc giao chiến” (B13-T04, ch-01-b09 p000150, vol02-ch06-b05, vol03-ch02-b15: p000109); “quả cầu tính toán” và “súng trường” (chapter1_b01_pending_terms, ch-05-b06 p000112: p000109); “Đế quốc” (p000112) và “Cộng hòa” (p000128); “lực lượng mặt đất” (ch-03-b01 p000010, ch-03-b23 p000001: p000112, p000130) và “quân mặt đất” (ch-03-b23 p000003: p000115); “lấy độ cao” và “giao chiến” (ch-03-b26 p000100: p000115, p000121, p000132); “mana” và tên người chiến hữu tử trận “Sean” (ch-03-b26 p000091, p000095, p000099: p000117); “Bravo” / “Đội Bravo” (ch-03-b06 p000083, p000088, ch-03-b07 p000105: p000121, p000122); “Thượng đế” và “Ôi Thượng đế ơi!” (review-God, b07-god-vocative, ch-05-b09 p000207: p000122, p000123); “thuật thức quan sát tầm xa” (P01-formulas, vol03-ch02-b16 p000448: p000124), “tín hiệu ma lực” (vol02-ch04-b17, vol02-ch05-b06, vol03-ch01-b12, vol03-ch02-b18: p000124), “thư viện dữ liệu” (vol02-ch02-b12 p000308: p000124) và “quân tiếp viện” / “quân chi viện” (ch-03-b23 p000015: p000122, p000124); “Pháp sư Định danh” (ch-05-b05 p000096, vol04-ch04-b14 p000024, vol04-ch05-b01 p000007: p000125, p000128) và giữ nguyên “Named” (vol02-ch02-b10-named, ch-03-b07 p000107, p000117, p000124, p000126, ch-04-b15 p000088: p000125, p000127); “át chủ bài” và “Ace of Aces” (ch-03-b25 p000043, p000045, ch-04-b03 p000042, ch-05-b06 p000121: p000126); biệt danh “Ác quỷ sông Rhine” (vol02-ch02-b11-devil-of-rhine, vol02-ch05-b09-devil-rhine, vol03-ch01-b08, vol04-ch04-b14 p000021: p000128); “thuật thức bắn tỉa quang học chính xác” (ch-03-b21 p000439, vol03-ch02-b10 p000253, vol04-ch03-b12 p000240: p000129) và “tay bắn tỉa” (ch-03-b07 p000105, ch-03-b25 p000046: p000129); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “AWACS” và “hệ thống cảnh báo sớm và chỉ huy trên không (AWACS)” (p000107, p000109), “các trung đoàn sơn cước” (p000109), “phi công tiêm kích” và “động tác cơ động né tránh khẩn cấp” (p000110 — đồng bộ với “máy bay tiêm kích” và “các động tác cơ động né tránh” ở ch-03-b26 p000085, p000096), “cuộc chiến tổng lực” (p000116), “thuật thức kích nổ không gian bằng ma lực hạng nặng” và “chiến thuật “mồi câu”” (p000129), cùng “chăm sóc tích cực” và “quân y” (p000130)."
