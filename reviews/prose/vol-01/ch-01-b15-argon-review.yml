- id: b15-lergen-pov-pronouns-and-tanya-reference
  source_term: Major von Lergen third-person/spoken pronouns, subordinate officers silent question voice, and Tanya Degurechaff reference from Lergen’s POV
  proposed_vi: trần thuật ngôi thứ ba đặt dưới điểm nhìn của Thiếu tá von Lergen quy chiếu Lergen nhất quán bằng đại từ “ông” kết hợp tên riêng “Lergen” và đại từ phản thân “mình” / “chính mình” (p000276, p000278, p000279, p000281–p000284 — đồng bộ với các phân cảnh điểm nhìn Lergen trong sổ pending); quy chiếu Thiếu úy Tanya Degurechaff từ góc nhìn của Lergen trong lời kể ngôi thứ ba bằng “cô” / “Cô” (p000281–p000284) và trong câu miêu tả ngoại hình tuổi nhỏ ở p000284 dùng “cô bé” / “em” ở mệnh đề giả định về tuổi chơi đồ chơi trước khi chuyển lại về “cô” khi cầm quả cầu tính toán đánh dạt hàng học viên sĩ quan (tuân thủ nghiêm ngặt giới hạn của DEC-P01-001: chỉ dùng “nó” cho trần thuật bám sát điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Lergen); trong lời thì thầm trực tiếp lộ rõ sự bất an và ghê sợ của Lergen tại p000280, tự xưng “Tôi” và quy chiếu Tanya là “cô ta”; trong câu hỏi ngầm qua ánh mắt của các thuộc cấp hướng về Lergen tại p000279 dùng câu hỏi kính trọng `*Có chuyện gì thế ạ?*`
  alternatives_vi:
  - cô ấy / con bé đó (thay cho “cô ta” trong câu thì thầm của Lergen tại p000280 — ưu tiên “cô ta” vì phản ánh chuẩn xác sắc thái bất an và ghê sợ của Lergen trước cái tên trên hồ sơ)
