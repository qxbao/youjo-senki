- id: b14-sue-unit-pronouns-and-enemy-mage-neutral-reference
  source_term: Lieutenant Colonel Sue third-person/interior/dialogue pronouns, Entente subordinate officers address, and gender-neutral enemy mage reference from Sue’s POV
  proposed_vi: trần thuật ngôi thứ ba quy chiếu Trung tá Anson Sue nhất quán bằng “ông” (p000238, p000240, p000241, p000243, p000247, p000250, p000251, p000256, p000268, p000272 — đồng bộ b06-sue-cunningham-address, b13) và quy chiếu các sĩ quan cấp dưới trẻ hơn là Đại úy Lagarde, Trung úy Thor bằng “anh” (p000256, p000258, p000263); độc thoại nội tâm của Trung tá Sue tại p000238 tự quy chiếu bằng “mình” và gọi chung đơn vị là “chúng ta” (đồng bộ b06, b07, b13); trong đối thoại tác chiến, các thuộc cấp gọi Sue là “Chỉ huy Sue” / “Chỉ huy” và “ngài”, tự xưng “tôi”, gọi chung đơn vị là “chúng ta” / “ta” (p000237, p000245, p000249, p000257, p000264, p000273), còn Sue tự xưng “Tôi”, gọi chung đơn vị là “chúng ta” và gọi/quy chiếu các sĩ quan thuộc cấp thân cận (Lagarde, Baldr) là “cậu” / “cậu ấy” (p000239, p000246, p000253, p000255, p000265, p000274 — đồng bộ p000107 ở b07); trong tiếng hét trực diện với kẻ địch khi xung phong của Thor (p000257) và Baldr (p000267) dùng cặp đại từ đối kháng “tao – mày”; quy chiếu pháp sư địch (Tanya) từ góc nhìn đơn vị của Sue bằng các từ trung tính/quân sự “tên pháp sư địch”, “tên pháp sư đó”, “tên khốn đó”, “kẻ địch”, “đối phương”, “hắn” (không để lộ giới tính ngoài điểm nhìn)
  alternatives_vi:
  - anh / anh ấy (thay cho “cậu” / “cậu ấy” khi Trung tá Sue gọi/quy chiếu các sĩ quan thuộc cấp Lagarde, Baldr tại p000255, p000265 — ưu tiên “cậu” / “cậu ấy” để đồng bộ với cách Sue gọi Trung úy Cunningham tại p000107 ở b07)
