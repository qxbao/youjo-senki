  - cộng sự hoặc người đá cặp (thay cho “đồng đội bắt cặp” tại p000370) / học viên, thăng liền hai cấp hoặc đặc cách thăng hai cấp, và hậu phương (thay cho “học viên thiếu sinh quân”, “thăng vượt hai cấp” và “tuyến sau” tại p000371, p000390) / tập kích mạn sườn và những thành viên thâm niên trong đại đội (thay cho “đánh bọc sườn” và “các đàn anh kỳ cựu trong đại đội” tại p000372) / tiếp xúc với địch và một cách bài bản (thay cho “tiếp cận giao chiến với địch” và “một cách có hệ thống” tại p000373) / vị trí pháo phòng không (thay cho “trận địa pháo phòng không” tại p000374) / vị trí khai hỏa và hỏa lực phong tỏa khu vực dày đặc (thay cho “trận địa hỏa lực” và “hỏa lực bắn chặn theo khu vực dữ dội” tại p000375) / người tôn sùng hỏa lực đến tận xương tủy và chiến tranh cơ động (thay cho “tín đồ cuồng nhiệt đến tận xương tủy của hỏa lực” và “tác chiến cơ động” tại p000377) / những người theo chủ nghĩa hiện thực và nữ thần chiến tranh phụ trách ý nguyện của thần linh (thay cho “những kẻ thực dụng” và “nữ thần chiến tranh nắm giữ ý chỉ thần thánh” tại p000378) / các hỏa điểm và những lời sấm truyền thần thánh của pháo binh (thay cho “các ổ súng” và “những mặc khải thần thánh từ pháo binh” tại p000379) / yêu cầu hỏa lực yểm trợ (thay cho “gọi hỏa lực pháo binh” tại p000380) / cuộc xung kích trên không (thay cho “đợt đột kích đường không” tại p000381) / tân binh (thay cho “lính mới” tại p000382) / Chúa tể Chiến trường hoặc Thần Chiến trường và yêu cầu qua vô tuyến (thay cho “Vị thần Chiến trường” và “lời thỉnh cầu qua vô tuyến” tại p000385) / vị cứu tinh, những người lính lão luyện và Trung đội Một (thay cho “đấng cứu rỗi”, “những tay lính kỳ cựu” và “Trung đội 1” tại p000386–p000387) / đám tàn quân hỗn tạp (thay cho “đám ô hợp” tại p000388) / đợt bắn pháo dọn đường (thay cho “màn pháo kích chuẩn bị” tại p000389)
