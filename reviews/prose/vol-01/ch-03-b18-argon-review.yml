  rationale: "Kế thừa đồng bộ hệ thống danh xưng và thuật ngữ từ các batch trước: “Thiếu úy Degurechaff” (b02-second-lieutenant, ch-03-b11–b17), “Trung úy Schwarkopf” (ch-03-b11 p000233–p000234, ch-03-b16 p000348 — tách bạch rõ hai cấp bậc khác nhau thành “Trung úy Schwarkopf và Thiếu úy Degurechaff” tại p000375), “trung đội”, “đại đội”, “tiểu đoàn”, “pháp sư”, “pháo binh” / “Pháo binh”, “học viên thiếu sinh quân” (ch-03-b10 p000185, ch-03-b17 p000353), “tiền tuyến” và “tuyến sau” (ch-03-b17 p000369), “lô cốt” (vol-04-ch-01-b15 p000075), “lực lượng dự bị” (ch-03-b13 p000263, ch-03-b14 p000298), “cuộc phản công” / “phản công” (ch-03-b14 p000294, ch-03-b15 p000306, p000310), “Cộng hòa” / “Quân đội Cộng hòa” (ch-03-b17 p000367), “phòng tuyến” (ch-03-b13–b16), “hỏa lực áp chế” (pending-terms.yml dòng 1254, 1418), “pháo hạng nặng” (ch-01-b06 p000077, ch-04-b21 p000230), “súng máy” (ch-03-b14 p000299), “pháo phòng không” (pending-terms.yml dòng 6960; mở rộng thành “trận địa pháo phòng không” tại p000374), “trận địa hỏa lực” (ch-04-b21 p000227, p000230), “đồng minh” (ch-03-b11 p000234, ch-03-b16 p000345), “tác chiến cơ động” (vol-04-ch-01-b16 p000095), “Thượng đế” (review-God, ch-03-b17 p000357), “Elya” (ch-03-b10, ch-03-b17 p000351, p000357), “chiến hào” (ch-03-b14–b17), “các quan sát viên” (chapter1_b01_pending_terms: “quan sát viên pháo binh”), “lính mới” (ch-03-b10 p000188, ch-03-b16 p000325) và “cầm chân kẻ địch” (ch-03-b12 p000261); khóa tạm “đồng đội bắt cặp” (p000370, đồng bộ với “ghép cặp” ở ch-03-b17 p000359), “thăng vượt hai cấp” (p000371), “đánh bọc sườn” và “các đàn anh kỳ cựu trong đại đội” (p000372), “một cách có hệ thống” (p000373), “hỏa lực bắn chặn theo khu vực dữ dội” và “vị trí cố định” (p000375), “vị thần” và “chiếc búa sắt” (p000376), “tín đồ cuồng nhiệt đến tận xương tủy của hỏa lực” và “hiện thân hoàn hảo cho học thuyết tác chiến cơ động không khoan nhượng” (p000377), “những kẻ thực dụng” và “nữ thần chiến tranh nắm giữ ý chỉ thần thánh” (p000378), “những tín đồ sùng đạo”, “các ổ súng” và “những mặc khải thần thánh từ pháo binh” (p000379), “gọi hỏa lực pháo binh” (p000380), “đợt đột kích đường không”, “hỏa lực yểm trợ từ pháo binh” và “tấn công vào mạn sườn” (p000381), “Vị thần Chiến trường” và “lời thỉnh cầu qua vô tuyến” (p000385), “đấng cứu rỗi”, “những tay lính kỳ cựu” (tránh dùng “cựu binh” cho quân nhân đang tại ngũ), “Trung đội 1” (đồng bộ quy ước chữ số với “Trung đội 3” ở ch-03-b11 p000224, p000233) và “đơn vị phản công” (p000386–p000387), “đám ô hợp” (p000388), cùng “màn pháo kích chuẩn bị” và “một thê đội địch¹⁵” (p000389)."
