- id: ch03-b18-visha-first-person-pov-elya-letter-artillery-praise-pronouns-and-two-emphases
  source_term: visha_first_person_pov_elya_letter_artillery_praise_pronouns_and_two_emphases_ch03_b18
  proposed_vi: 'tiếp nối trực tiếp ch-03-b16 (p000347–p000348) và ch-03-b17 (p000349–p000369) sau khoảng ngắt cảnh (class="space-break1"), toàn bộ 21 đoạn của lô ch-03-b18 (chapter007.xhtml/p000370–p000390) diễn ra dưới điểm nhìn tự sự ngôi thứ nhất của Hạ sĩ Viktoriya Ivanovna Serebryakov (Visha) khi bắt cặp bay chiến đấu cùng Thiếu úy Tanya Degurechaff và chiêm nghiệm về “tôn giáo pháo binh” trên chiến trường Rhine, tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của Visha), DEC-P01-002 và style-guide.md: (1) Trong mạch tự sự ngôi thứ nhất và suy nghĩ nội tâm của Visha xuyên suốt lô (p000370–p000382, p000384, p000387–p000390), Visha tự xưng “tôi” kết hợp phản thân “mình” (p000370–p000373, p000375, p000377, p000378, p000380, p000382, p000384, p000387, p000389, p000390), dùng đại từ ngôi thứ nhất số nhiều “chúng tôi” / “Chúng tôi” kết hợp phản thân “mình” khi gộp mình với Thiếu úy Degurechaff hoặc Đại đội Pháp sư 205 (p000370, p000372–p000375, p000379–p000382, p000384, p000387–p000389), và dùng đại từ gộp khái quát “chúng ta” trong châm ngôn đúc kết bài học chiến trường ở câu 1 p000376; quy chiếu cấp trên trực tiếp “Thiếu úy Degurechaff” (“Chỉ huy của tôi” ở p000377) ở ngôi thứ ba nhất quán bằng “cô ấy” (p000370, p000377, câu 2 p000378, p000382 — đồng bộ hoàn toàn với ch-03-b16 và ch-03-b17); quy chiếu người bạn thân khóa huấn luyện “Elya” bằng đại từ “cậu ấy” kết hợp phản thân “mình” (câu 3–5 p000378, p000380) vừa thể hiện tình bạn đồng trang lứa vừa tách biệt hoàn toàn với đại từ “cô ấy” quy chiếu Thiếu úy Degurechaff ngay ở câu 2 p000378, đồng thời trong lời trích dẫn thư của Elya ở câu 3 p000378 Elya tự xưng “tớ” đồng bộ với hệ xưng hô “tớ – cậu” ở ch-03-b10 (p000193–p000219); tại câu 3 p000375, dịch rõ cấp bậc riêng của từng người là “Trung úy Schwarkopf và Thiếu úy Degurechaff” thay vì gộp chung danh từ cấp bậc số nhiều như tiếng Anh; quy chiếu hai học viên thiếu sinh quân chuyển về tuyến sau ở p000371, binh lính pháo binh ở p000384 và các thành viên kỳ cựu của Trung đội 1 ở p000387 bằng “Họ” / “họ”, quy chiếu vị thần pháo binh ở cuối p000376 bằng “ngài”, và quy chiếu đơn vị Quân đội Cộng hòa bằng “chúng” (p000372, p000381, p000387, p000388). (2) Tại các câu có đại từ ngôi thứ hai phiếm chỉ trong nguồn (câu 3 p000374, câu 3 p000375, câu 2 p000376, câu 2 p000388), lược bỏ đại từ ngôi thứ hai phiếm chỉ (p000374, p000376) hoặc chuyển thành chủ ngữ khái quát “một pháp sư” (p000375) / “người ta” (p000388) theo đúng quy ước direct-address choice (pending-terms.yml). (3) Trong lời thoại tung hô pháo binh trên chiến trường và lời cầu nguyện thầm: Trung úy Schwarkopf (p000383) và các lính kỳ cựu Trung đội 1 (p000385, p000386) ngợi ca “Thượng đế” / “Pháo binh” / “Vị thần Chiến trường” bằng đại từ tôn kính “Ngài”, dùng “chúng ta” ở p000385 và cặp xưng hô mang âm hưởng kinh cầu nguyện cổ kính “Ngài – chúng con” ở p000386; trong câu cầu nguyện thầm của Visha ở cuối p000388, gọi “Thượng đế yêu dấu ơi” và tự xưng “con”. (4) Bảo toàn nguyên vẹn câu hỏi mở đầu p000378 và câu hỏi tu từ cảm thán cuối p000383, cấu trúc tăng tiến phủ định “chẳng những... mà... còn...” khi chủ thể hai vế thay đổi ở câu 1 p000373 theo đúng style-guide.md (vế 1: “hầu như không có quả đạn pháo nào bay về phía chúng tôi”; vế 2: “chúng tôi còn chẳng chịu bất kỳ tổn thất thực sự nào trước khi tiếp cận giao chiến với địch”), chỉ số chú thích trên cao `¹⁵` ngay sau “một thê đội địch¹⁵” tại p000389 tương ứng với `<html:sup>15</html:sup>`, cùng chính xác các cấu trúc phủ định, khả thể, nhượng bộ và điều kiện giả định (khả thể và phủ định giới hạn ở p000371; giả định phủ định và đối lập phủ định ở p000372; điều kiện phủ định và nhượng bộ “quá... để...” ở p000374; điều kiện giả định kèm mức độ chắc chắn và tương quan tăng tiến “càng... bao nhiêu thì lại càng... bấy nhiêu” ở p000375; phủ định tuyệt đối và điều kiện ngoại trừ “trừ phi” ở p000376; giả định lý tưởng đối lập với thực tế ở p000382; phủ định ở p000384, p000389; nhượng bộ và phủ định bộ phận “không hoàn toàn sai” ở p000387; điều kiện ở p000388, p000390). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 2 đoạn có thẻ `<html:em>` trong `xhtml` nguồn là câu 2 p000384 (`*Gu âm nhạc của chúng tôi xem chừng có đôi chút khác biệt — tôi chỉ vừa đủ sức vượt qua những đợt pháo kích dữ dội này mà không bị âm thanh đó dọa cho phát hoảng lên thôi.*`) và câu 3 p000388 (`*Thượng đế yêu dấu ơi, xin hãy ban cho con sự chi viện của pháo binh.*`), tuyệt đối không dùng dấu `*` ở 19/21 đoạn còn lại theo đúng DEC-P01-002'
  alternatives_vi:
  - cô ấy (thay cho “cậu ấy” khi Visha quy chiếu người bạn đồng khóa Elya tại câu 3–5 p000378 và p000380 — ưu tiên “cậu ấy” để tách biệt hoàn toàn với đại từ “cô ấy” quy chiếu Thiếu úy Degurechaff ở câu 2 p000378 và ăn khớp với hệ xưng hô bạn bè thân thiết “tớ – cậu” từ ch-03-b10) / Người – chúng tôi hoặc Ngài – chúng ta (thay cho “Ngài – chúng con” trong lời tung hô nhại kinh cầu nguyện của Trung đội 1 tại p000386 và “con” trong lời cầu nguyện thầm tại p000388 — ưu tiên “Ngài – chúng con” / “con” để giữ trọn sắc thái cầu nguyện tôn giáo sùng kính đối với vị thần pháo binh)
