  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md xuyên suốt 21 đoạn tự sự ngôi thứ nhất của Visha: giữ đại từ “tôi” / “chúng tôi” / “chúng ta” cho Visha và đơn vị, quy chiếu Thiếu úy Degurechaff bằng “cô ấy” theo đúng giới hạn chủ thể của DEC-P01-001, phân biệt rõ với “cậu ấy” (và tự xưng “tớ” trong thư) cho người bạn thân Elya tại p000378 và p000380, dịch tường minh cấp bậc “Trung úy Schwarkopf và Thiếu úy Degurechaff” tại p000375, xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice tại p000374–p000376 và p000388, giữ sắc thái cầu nguyện tôn giáo “Ngài – chúng con” / “con” tại p000383, p000385, p000386, p000388, bảo toàn cấu trúc “chẳng những... mà... còn...” khi đổi chủ thể ở p000373, chỉ số chú thích `¹⁵` tại p000389, và chính xác 2 vị trí nhấn mạnh `*...*` tại câu 2 p000384 và câu 3 p000388."
