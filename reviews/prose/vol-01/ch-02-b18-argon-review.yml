  proposed_vi: tiếp nối trực tiếp cuộc đối thoại giữa Tanya và thực thể siêu nhiên (tổng lãnh thiên thần) trong không gian quen thuộc từ cuối ch-02-b17 (p000250–p000252), tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và quy ước Chương 0–2: trong toàn bộ các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000254–p000256, p000259, p000261–p000264, p000269, p000272–p000274), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “chính mình” theo đúng DEC-P01-001 (tuyệt đối không dùng đại từ “cô”; lưu ý từ “nó” ở câu 1 p000254 quy chiếu “Thực thể trước mặt mình”, ở câu 4 p000264 quy chiếu “sự tự do đó”, ở câu 2–3 p000265 quy chiếu “quả cầu tính toán”, và ở câu 6 p000272 quy chiếu “quả cầu tính toán bị nguyền rủa”); ở câu điều kiện khái quát mang tính triết lý đầu tư kinh doanh tại câu 3 p000262, dùng “chúng ta” cho chủ ngữ số nhiều khái quát; quy chiếu thực thể siêu nhiên đang đối thoại trước mặt trong độc thoại nội tâm của Tanya bằng “Thực thể trước mặt mình”, “tên này”, “gã này” và đại từ ngôi thứ ba “hắn” (p000254–p000256, p000259, p000269 — đồng bộ ch-02-b17 p000248, p000252); quy chiếu tập thể các thực thể siêu nhiên bằng “những thực thể này” / “Những thực thể này”, “Mấy kẻ độc ác này” và đại từ “chúng” / “Chúng” (p000262, p000272–p000274 — đồng bộ ch-02-b17 p000252; lưu ý từ “chúng” ở câu 3–4 p000262 quy chiếu “những ảo ảnh” và “bất kỳ kẻ điên nào”, còn ở câu 2 p000267 quy chiếu “Những lời ca tụng Chúa”); trong lời thoại trực tiếp giữa thực thể siêu nhiên và Tanya: thực thể siêu nhiên tự xưng “ta” ở ngôi thứ nhất số ít (p000257, p000270 — đồng bộ P05-being-x và ch-02-b13/b14), tự xưng “Bọn ta” / “bọn ta” ở ngôi thứ nhất số nhiều khi đại diện cho thần giới (p000265, p000275 — đồng bộ b07-being-x-we), gọi Tanya là “ngươi” kết hợp phản thân “mình” (p000257, p000260, p000265, p000267, p000270, p000275 — đồng bộ P05-being-x và ch-02-b17 p000250), và quy chiếu Chúa / Thượng đế bằng “Ngài” / “ngài” (p000257, p000265, p000270 — đồng bộ review-God), còn Tanya tự xưng “tôi” trong lời đáp trực tiếp lạnh nhạt (p000258, p000268 — đồng bộ Chương 0); bảo toàn chính xác phạm vi nhấn mạnh `*của mình*` tại câu 2 p000264 theo DEC-P01-002 (22 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - ông ta (thay cho “hắn” trong nội tâm của Tanya khi quy chiếu thực thể trước mặt — ưu tiên “hắn” kết hợp “tên này” / “gã này” để giữ đúng giọng điệu cảnh giác, khinh thường trong nội tâm của Tanya đối với kẻ cuồng tín siêu nhiên đang áp đặt tôn giáo lên mình, đồng bộ với p000248, p000252)
