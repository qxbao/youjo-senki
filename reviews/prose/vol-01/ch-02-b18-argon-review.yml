  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 0–2: giữ nhất quán đại từ nội tâm ngôi thứ nhất của Tanya (“mình”), đại từ quy chiếu thực thể siêu nhiên trong nội tâm (“hắn” cho cá nhân, “chúng” cho tập thể), cặp đại từ trong lời thoại của thực thể thần thánh (“ta / bọn ta – ngươi – Ngài / ngài”) và của Tanya (“tôi”), cùng duy nhất cụm nhấn mạnh `*của mình*` tại p000264."
