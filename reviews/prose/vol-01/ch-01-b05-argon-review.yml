- segment_id: YS-LN01/Text/chapter003b.xhtml/p000055
  locks:
  - Giữ tên riêng “Tanya”, hành động “bất giác cong đôi môi hồng thành một nụ cười khi đánh giá lại tình hình”, và câu nội tâm nhấn mạnh bằng chữ nghiêng Markdown `*Xét cho cùng, chuyện này có khi cũng không tệ đến thế.*` theo đúng DEC-P01-002.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000056
  locks:
  - Giữ phân biệt đại từ “mình” trong lời thì thầm tự nhủ và “nó” trong câu trần thuật theo DEC-P01-001, giả định phản thực tại “Cho dù có ai đang bay gần đó, tiếng pháo binh Đế quốc gầm rít bên dưới cũng đã át đi giọng nó”, cùng cụm “buổi trình diễn hỏa lực Fuji⁵ với tư cách khách VIP” kèm đúng dấu chú thích `⁵`.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000057
  locks:
  - Giữ nguyên hai hô hiệu “Fairy 08”, “Goliath 07” và câu yêu cầu công vụ ngắn gọn “Yêu cầu báo cáo kết quả bắn.”
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000058
  locks:
  - Giữ nguyên hai hô hiệu “Goliath 07”, “Fairy 08”, đại từ xưng hô “Tôi” và thuật ngữ đánh giá kết quả pháo kích “Hiệu lực tốt trên mục tiêu. Tôi nhắc lại, hiệu lực tốt.”
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000059
  locks:
  - Giữ đại từ trần thuật “nó” song hành cùng tên “Tanya”, và đầy đủ các thuật ngữ “các pháo đội”, “bộ vô tuyến”, “thuật thức bay”, “quả cầu tính toán của Quân đội Đế quốc”, “Lãnh thổ Norden đang có tranh chấp”, “Bộ Tư lệnh Central”, “được Central biệt phái”, “chương trình huấn luyện thực địa”.
