  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002, style-guide.md và quy ước Chương 1–2: giữ sự phân biệt rạch ròi giữa độc thoại nội tâm ngôi thứ nhất (“mình” / “Chúng tôi”), câu trần thuật/tự tách góc nhìn (“Thiếu úy Ma pháp Tanya Degurechaff” / “Tanya”), đại từ quy chiếu Schugel trong nội tâm Tanya (“ông ta”), và lời thoại trực tiếp của Schugel (“chúng ta”, “Thiếu úy / cô”)."
