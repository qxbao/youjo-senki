- id: ch02-b15-tanya-pov-return-pronouns-and-schugel-dialogue
  source_term: scene-level POV transition from godly realm back to Tanya’s first-person interior monologue and third-person narration/POV-dissociation pronouns in p000178–p000191, counterfactual wish and conditionals in p000180–p000182/p000188, and direct dialogue pronouns of Dr. von Schugel in p000182/p000189
  proposed_vi: chuyển cảnh từ thần giới (ch-02-b13/b14) quay trở lại điểm nhìn của Tanya tại bãi thử nghiệm và tuân thủ nghiêm ngặt DEC-P01-001, chapter1_b02_decisions cùng quy ước ch-02-b01 → ch-02-b08: trong các đoạn/mệnh đề độc thoại nội tâm ngôi thứ nhất của Tanya (p000179, p000180, p000184, p000186, p000188, p000190, p000191), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” ở ngôi thứ nhất số ít và dùng “Chúng tôi” ở ngôi thứ nhất số nhiều khi nói về nhóm thực hiện thử nghiệm / Tanya và Schugel tại hiện trường (p000184, p000191); trong câu trần thuật ngôi thứ ba mở đầu cảnh hoặc khi chủ thể tự tách góc nhìn nhắc đến danh tính bên ngoài của Tanya (p000178, p000185, p000187), dùng chức danh/tên riêng “Thiếu úy Ma pháp Tanya Degurechaff” / “Tanya” theo đúng văn bản nguồn và DEC-P01-001 (tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm của Tanya; lưu ý từ “nó” ở p000185–p000188 hoàn toàn chỉ quy chiếu danh từ bất động vật như cuộc thí nghiệm, lý thuyết cố định mana, quả cầu Type 95 hoặc lời giải thích của các kỹ sư); quy chiếu Kỹ sư trưởng Adelheid von Schugel trong nội tâm của Tanya bằng “gã nhà khoa học điên”, “gã điên đó”, “Schugel”, “vị tiến sĩ” và đại từ “ông ta” / “Ông ta” kết hợp đại từ phản thân “mình” (p000181–p000183, p000188, p000190, p000191 — đồng bộ ch-02-b04 → ch-02-b08); quy chiếu cấp trên, Ban Nhân sự và các kỹ sư/nhân sự khác trong đội thử nghiệm bằng “họ” (p000179, p000183, p000184, p000188, p000191); trong lời thoại trực tiếp của Tiến sĩ von Schugel, khi hô hào chung với bộ phận nghiên cứu tại p000182 dùng “chúng ta”, và khi hỏi trực tiếp Tanya tại p000189 dùng cấp bậc “Thiếu úy” kèm đại từ ngôi thứ hai “cô” (đồng bộ ch-02-b04 → ch-02-b07); bảo toàn đầy đủ câu ước muốn trái thực tế tại p000181, câu hỏi tu từ nội tâm tại p000183/p000190 và cấu trúc phủ định kép tại p000185; toàn bộ 14 đoạn không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*` theo DEC-P01-002
  alternatives_vi:
  - lão (thay cho “ông ta” trong nội tâm của Tanya khi quy chiếu Schugel — ưu tiên “ông ta” kết hợp danh ngữ “gã nhà khoa học điên” / “gã điên đó” / “vị tiến sĩ” để đồng bộ hoàn toàn với ch-02-b04 → ch-02-b08)
