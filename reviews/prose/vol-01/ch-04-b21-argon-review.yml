- id: ch04-b21-tanya-pov-pronouns-instructor-dialogue-conditionals-and-partial-emphasis
  source_term: tanya_pov_pronouns_instructor_dialogue_conditionals_and_partial_emphasis_ch04_b21
  proposed_vi: 'tiếp nối trực tiếp Phân cảnh 2 của ch-04-b20 (p000215–p000220), toàn bộ 25 đoạn của lô ch-04-b21 (chapter009b.xhtml/p000221–p000245) diễn ra dưới điểm nhìn xoay quanh Trung úy Tanya Degurechaff trong chuyến hành quân leo núi huấn luyện tham mưu của Học viện Chiến tranh Đế quốc, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) Trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000221–p000223, vế trần thuật cuối p000226, p000237, câu 4 p000239), quy chiếu Tanya nhất quán bằng danh xưng “Tanya” / “Trung úy Degurechaff” và đại từ ngôi thứ ba “nó” / “Nó” theo đúng DEC-P01-001 (tuyệt đối không dùng đại từ “cô” trong trần thuật; lưu ý từ “nó” ở câu 3 p000224 chỉ quy chiếu “chặng hành quân leo dốc này” và ở câu 2 p000230 chỉ quy chiếu “trận địa hỏa lực”). (2) Trong các câu độc thoại nội tâm ngôi thứ nhất của Tanya, dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” ở ngôi thứ nhất số ít (p000233, câu 6–7 p000239, p000241, p000242) theo đúng DEC-P01-001, và dùng đại từ ngôi thứ nhất số nhiều “chúng ta” / “Chúng ta” khi suy tính về phe mình / nhóm học viên trong bài toán chiến thuật giả định (p000230, câu 3 p000232, p000241); riêng ở 3 câu đầu của p000239 được đánh dấu `<html:em>`, khi Tanya thầm hướng lời trách móc trực tiếp tới đồng môn như một câu thoại tưởng tượng (`*Chết tiệt! Anh nợ tôi một món đấy nhé, Trung úy Viktor! Giá mà anh trả lời cho đàng hoàng thì đã chẳng có ai bị mắng rồi.*`), dùng cặp xưng hô “anh – tôi” chuẩn mực giữa hai học viên sĩ quan đồng cấp, rồi chuyển liền mạch về “Nó” ở câu trần thuật thứ 4 và “Mình” / “mình” ở hai câu tự nhủ cuối đoạn; quy chiếu đồng môn là Trung úy Viktor ở ngôi thứ ba bằng “Trung úy Viktor” / “Viktor” và “Anh ta” / “anh ta” (p000232, p000239), đồng thời quy chiếu vị giảng viên trong nội tâm của Tanya bằng “ông ta” (p000241, p000242). (3) Trong các câu có đại từ ngôi thứ hai phiếm chỉ trong nguồn (p000221, p000223, p000224, p000233), dùng chủ ngữ khái quát “người ta” (p000221), lược đại từ ngôi thứ hai phiếm chỉ (p000223, p000224) hoặc chuyển thành “quân ta” trong tình huống tác chiến giả định (p000233) theo đúng quy ước direct-address choice. (4) Trong đối thoại giữa giảng viên và các học viên sĩ quan (p000227, p000229, p000231, p000234–p000236, p000238, p000240, p000242–p000244): giảng viên gọi hỏi và quát mắng Trung úy Viktor bằng “Viktor” và đại từ ngôi thứ hai “Anh” / “anh” kết hợp phản thân “mình”, tự xưng “tôi” / “Tôi” kèm lời mắng “đồ ngu!” (p000227, p000234, p000236), còn Viktor đáp lại giảng viên bằng đại từ ngôi thứ nhất “tôi” (p000231); giảng viên gọi hỏi Trung úy Degurechaff bằng “Degurechaff” và đại từ ngôi thứ hai “cô” (p000238, và trong câu quát giả định ở p000242 — đồng bộ ch-04-b08/b11/b14), còn Tanya đáp lại giảng viên cấp trên bằng “Thưa ngài... ạ” / “ạ” và đại từ “chúng ta” / “tôi” (p000240, p000244). (5) Bảo toàn nguyên vẹn đối tượng và độ mở của tất cả các câu hỏi trực tiếp/nội tâm (p000226, p000230, p000235, p000238, p000240, p000242), cấu trúc tăng tiến “không chỉ... mà còn...” giữ cùng một chủ thể (“Việc hạ lệnh xung phong đánh vào một trận địa có tầm bắn thoáng đãng”) ở câu 4 p000245 theo style-guide.md, cùng chính xác thời gian và mức độ chắc chắn của các mệnh đề điều kiện/giả định (giả định quy chế/pháp lý ở p000222–p000223; câu hỏi giả định phủ định ở p000226; bài toán chiến thuật giả định ở p000227, p000230, p000233, p000238, p000241–p000243; câu điều kiện thách thức ở p000234, p000236; giả định trái thực tế trong quá khứ “Giá mà anh trả lời cho đàng hoàng thì đã chẳng có ai bị mắng rồi” ở p000239). (6) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` chỉ ở đúng 2 đoạn có thẻ `<html:em>` trong `xhtml` nguồn là p000226 (chỉ bọc vế câu hỏi nội tâm đầu đoạn và để vế trần thuật “nó không khỏi nghĩ thầm.” nằm ngoài dấu `*`) và p000239 (chỉ bọc 3 câu đầu trong thẻ `<html:em>` và để 4 câu sau trong thẻ `<html:span>` nằm ngoài dấu `*`), đồng thời không tự ý thêm bất kỳ dấu `*` nào ở 23/25 đoạn còn lại theo đúng DEC-P01-002'
  alternatives_vi:
  - cậu – tôi (thay cho “anh – tôi” khi Tanya thầm trách móc Trung úy Viktor trong câu thoại nội tâm hướng tới đồng môn tại p000239 — ưu tiên “anh – tôi” chuẩn mực quân ngũ giữa các sĩ quan học viên Học viện Chiến tranh)
