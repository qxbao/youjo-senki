  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md xuyên suốt 25 đoạn dưới điểm nhìn của Trung úy Tanya Degurechaff: giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba (“Tanya” / “Trung úy Degurechaff” / “nó” / “Nó”), độc thoại nội tâm ngôi thứ nhất (“mình” / “Mình” / “chúng ta” / “Chúng ta”), lời trách móc nội tâm hướng trực tiếp tới đồng môn (“anh – tôi” ở đầu p000239) và đối thoại quân ngũ với giảng viên (“tôi – Anh / anh” với Viktor; “tôi / chúng ta – Thưa ngài... ạ” và “Degurechaff / cô” với Tanya), xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice, bảo toàn cấu trúc tăng tiến “không chỉ... mà còn...” cùng chủ thể ở p000245, các câu hỏi, các mệnh đề điều kiện/giả định và phạm vi nhấn mạnh từng phần ở đúng 2 đoạn có thẻ `<html:em>` (p000226 và p000239)."
