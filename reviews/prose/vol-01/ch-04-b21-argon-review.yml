  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ và danh xưng đã khóa tạm từ Chương 0–3 cùng ch-04-b01 → ch-04-b20: “nữ sĩ quan” (ch-04-b20 p000219, p000220, p000221, p000222), “học viện chiến tranh” / “học viên học viện chiến tranh” (ch-04-b01/b07/b11/b20, p000221, p000222), “hoàng gia” (ch-04-b20 p000220, p000221), “Đế quốc” (p000221), “Tanya” / “Trung úy Degurechaff” / “Degurechaff” (p000221–p000223, p000237, p000238), “sĩ quan tham mưu” (ch-04-b16–b18, ch-04-b20 p000215, p000222, p000226), “giảng viên” (ch-04-b01/b10, p000222, p000237), “sĩ quan ma pháp” (ch-01-b01, ch-04-b02, p000222) và “sĩ quan pháp sư” (ch-04-b10, vol-02, p000222 — phân biệt đúng hai cách gọi xuất hiện trong cùng đoạn nguồn), “pháp sư” (p000223, p000230), “thuật thức” (P01-formulas; mở rộng thành “thuật thức hỗ trợ” tại p000223), “đầy đủ quân trang” / “quân trang” (ch-04-b05 p000111, p000223, p000224), “tiểu đoàn” / “tiểu đoàn bộ binh” (p000227, p000241), “pháo hạng nặng” (ch-01-b06 p000077, p000230, p000240, p000242), “pháo bộ binh” (vol-02 ch-05-b19 p000484, p000241), “sư đoàn” (p000241) và “pháo binh quân đoàn” (ch-01-b01 p000008, p000241); khóa tạm “cuốn cẩm nang quy chế của học viện chiến tranh” và “bộ máy quan liêu” (p000221), “huấn luyện sức bền” và “những quả mìn hạt nhân kiểu Tsugene” (p000222), “súng máy hạng nặng mô hình” và “ngược đãi trẻ em” (p000223), “đường mòn leo núi”, “quân sơn cước” / “bộ binh sơn cước”, “tên bạo dâm” và “chặng hành quân leo dốc” (p000224), “xét theo mục đích luận” (p000225), danh xưng đồng môn “Viktor” / “Trung úy Viktor” và “trận địa hỏa lực phòng ngự” / “trận địa hỏa lực” (p000227, p000230, p000232, p000239), “các mệnh lệnh tác chiến giả định” (p000228), “phương án tác chiến” (p000229), “đột phá” và “đi vòng qua” (p000230–p000233, p000236), “chiến thuật đi đường vòng đúng chuẩn sách giáo khoa” (p000232), “vật che chắn”, “điểm cao” và “những tấm bia sống” (p000233), “địa hình dốc đứng” và “địa hình” (p000236), “cột thu lôi” (p000239), cùng “sống núi” (p000244, p000245) và “tầm bắn thoáng đãng” (p000245)."
