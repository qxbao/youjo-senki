- id: b19-war-room-generals-pronouns-and-conference-register
  source_term: General Staff War Room third-person narrator pronouns for Rudersdorf, Zettour, Marchese, and Ludwig, and formal conference dialogue pronouns/vocatives
  proposed_vi: trần thuật ngôi thứ ba tại Phòng Tác chiến thuộc Bộ Tổng Tham mưu quy chiếu các tướng lĩnh cấp cao (Chuẩn tướng von Rudersdorf, Chuẩn tướng von Zettour, Tướng phụ tá Marchese, Trung tướng von Ludwig) nhất quán bằng đại từ trang trọng “ông” kết hợp cấp bậc/chức danh và tên riêng, dùng đại từ phản thân “mình” / “bản thân” (p000033–p000036, p000038, p000040 — tuân thủ nghiêm ngặt giới hạn DEC-P01-001: không dùng “nó” ngoài điểm nhìn của Tanya) và quy chiếu tập thể Đế quốc / quân đội ở p000043 bằng “họ”; trong phát biểu hội nghị chính thức của Rudersdorf, Zettour, Marchese và Ludwig (p000033–p000035, p000037, p000039, p000042), người nói tự xưng “Tôi” / “tôi” và dùng “chúng ta” / “Chúng ta” / “ta” cho phía Bộ Tổng Tham mưu và Quân đội Đế quốc; khi chủ tọa Marchese mời Tổng Tham mưu trưởng von Ludwig cho ý kiến tại p000035, dùng đại từ kính trọng “Ngài” kèm danh xưng “Tướng von Ludwig”; khi Chuẩn tướng von Rudersdorf trực tiếp can gián cấp trên tại p000039, dùng hô ngữ chuẩn quân phong “Thưa Trung tướng!”; khi Chuẩn tướng von Zettour nhắc tới người đồng cấp tại p000042, giữ danh xưng “Tướng von Rudersdorf”
  alternatives_vi:
  - Ông (thay cho “Ngài” trong câu mời phát biểu của chủ tọa Marchese gửi tới Tổng Tham mưu trưởng von Ludwig tại p000035 — ưu tiên “Ngài” vì phản ánh đúng nghi thức hội nghị trang trọng hướng tới vị đứng đầu Bộ Tổng Tham mưu)
