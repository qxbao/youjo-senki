- id: ch05-b13-zettour-pov-pronouns-dialogue-address-and-exact-emphasis
  source_term: zettour_pov_pronouns_dialogue_address_and_exact_emphasis_ch05_b13
  proposed_vi: "Toàn bộ 29 đoạn của lô ch-05-b13 (chapter011.xhtml/p000312–p000340) tiếp nối trực tiếp cuộc trao đổi riêng giữa Chuẩn tướng von Zettour và Đại úy Tanya von Degurechaff dưới điểm nhìn trần thuật ngôi thứ ba bám theo Zettour (từ p000292 của ch-05-b12), tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Điểm nhìn trần thuật và độc thoại nội tâm của Zettour: tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (“Không tự mở rộng quy ước này sang chủ thể hoặc giai đoạn khác”), tuyệt đối không dùng đại từ “nó” để quy chiếu nhân vật ở bất kỳ đoạn nào trong lô (lưu ý các từ “nó” tại p000312, p000315, p000336 và p000340 chỉ quy chiếu danh từ bất động vật là “tiểu đoàn”, “cơ chế sót lại từ ba trăm năm trước”, “tiểu đoàn phản ứng nhanh” hoặc mệnh đề sự việc phía trước); quy chiếu Chuẩn tướng von Zettour trong lời kể bằng đại từ “ông” / “Ông” kết hợp phản thân “mình” (p000314, p000318, p000319, p000321, p000325, p000334, p000337), và trong độc thoại nội tâm trực tiếp ở câu 1–2 p000319 tự quy chiếu bằng “Mình” / “mình”; quy chiếu Đại úy Tanya von Degurechaff trong lời kể bằng “Tanya”, “cô bé nhỏ tuổi” và đại từ “cô” / “Cô” kết hợp phản thân “mình” (p000312, p000318, p000319, p000321, p000324, p000325, p000327, p000331, p000332, p000334, p000340), và trong độc thoại nội tâm của Zettour ở p000319 bằng “cô bé này” / “Cô bé”; xử lý đại từ ngôi thứ hai phiếm chỉ ở p000314 và p000315 bằng thành ngữ tương đương không đại từ (“lấy độc trị độc”) và cấu trúc khái quát lược đại từ (“Tất cả những gì cần có để đủ tư cách nhận chức danh ấy...”). (2) Hệ xưng hô trong hội thoại quân sự: Zettour khi nói với Tanya (p000313, p000320, p000323, p000328, p000330, p000333, p000336, p000339) tự xưng “tôi” / “Tôi” (cùng “chúng tôi” ở p000330 đại diện cho Cục Quân vụ / Bộ Tổng Tham mưu và “chúng ta” ở p000336), gọi Tanya là “cô” / “Cô” kết hợp phản thân “mình”; khi Zettour nhắc lại lời thì thầm với Cục Tác chiến ở p000337 dùng đại từ ngôi thứ hai số nhiều trang trọng “các vị” (đồng bộ p000076); Tanya khi hỏi và đáp lời Zettour (p000317, p000322, p000326, p000329, p000335) tự xưng “tôi” / “Tôi”, gọi Zettour là “ngài” (“Xin cảm ơn ngài” ở p000335) kèm tiểu từ kính ngữ “ạ” đúng lễ tiết cấp dưới đối với cấp tướng. (3) Tuân thủ tuyệt đối DEC-P01-002: bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` ở đúng 2/29 đoạn có thẻ `<html:em>` trong `xhtml` nguồn là p000319 (chỉ nhấn mạnh 2 câu đầu: `*Mình có thể trông cậy vào cô bé này. Cô bé xuất sắc đến mức giá như là đàn ông thì mình rất sẵn lòng gả cháu gái cho.*`, giữ câu thứ 3 nằm ngoài dấu `*`) và p000337 (chỉ nhấn mạnh câu hỏi thì thầm: `*Liệu các vị có dùng nổi một lực lượng phản ứng nhanh bị thiếu hụt ngân sách hay không?*`, giữ phần dẫn trước và mệnh đề sau nằm ngoài dấu `*`); 27/29 đoạn còn lại hoàn toàn không dùng dấu `*`."
  alternatives_vi:
  - "Tôi có thể trông cậy vào cô ấy... (thay cho “Mình có thể trông cậy vào cô bé này...” trong độc thoại nội tâm của Zettour tại p000319 — ưu tiên “Mình” và “cô bé này” / “Cô bé” để thể hiện sắc thái suy ngẫm nội tâm tự nhiên của người ông khi nghĩ tới cháu gái mình và đối ứng trực tiếp với hình ảnh “một cô bé nhỏ tuổi” ở cuối đoạn) / Liệu các ông có dùng nổi... (thay cho đại từ “các vị” khi Zettour nói với Cục Tác chiến tại p000337 — ưu tiên “các vị” đồng bộ với p000076)"
