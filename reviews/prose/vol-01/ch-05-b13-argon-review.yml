  volume: vol-01
  chapter: 5
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 29 đoạn của ch-05-b13: duy trì nhất quán điểm nhìn ngôi thứ ba của Chuẩn tướng von Zettour (quy chiếu Zettour bằng “ông” – “mình” và Tanya bằng “cô” – “mình”, tuyệt đối không dùng “nó” cho nhân vật), giữ chuẩn xưng hô điều lệnh quân sự giữa cấp tướng và đại úy, bảo toàn đầy đủ các cấu trúc giả định trái thực tế và điều kiện (p000316, p000319, p000321, p000325, p000327), các cấu trúc phủ định (p000314, p000315, p000316, p000317, p000321, p000324, p000327, p000339, p000340), dấu gạch ngang dài (p000314) và chính xác phạm vi nhấn mạnh Markdown `*...*` tại 2/29 đoạn có `<html:em>` là p000319 và p000337."
