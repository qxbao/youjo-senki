- id: ch05-b13-formation-officer-augmented-quick-reaction-battalion-and-army-group-terms
  source_term: formation_officer_augmented_quick_reaction_battalion_and_army_group_terms_ch05_b13
  proposed_vi: "Quân đội Đế quốc / tiểu đoàn / sĩ quan lập đội / tiểu đoàn pháp sư / đại úy / đại đội / thời Trung Cổ / lính đánh thuê / quân chính quy / sĩ quan / đại đội trưởng / đơn vị lính đánh thuê / Tanya / thiếu tá / Cục Quân vụ / tiểu đoàn trưởng / thăng quân hàm / trung úy / chuẩn tướng / pháp sư / sĩ quan chỉ huy / búa rìu chỉ trích / các phòng ban khác / một điều dễ gây ác cảm / giới chóp bu / toàn quyền / việc thành lập đơn vị / nhân sự và trang thiết bị / Cục Nhân sự / Kordel / bốn mươi tám người / tiểu đoàn tăng cường / đơn vị thử nghiệm / tiểu đoàn phản ứng nhanh / lực lượng phản ứng nhanh / Cục Tác chiến / Rudersdorf / Cụm tập đoàn quân phương Tây / Cụm tập đoàn quân phương Bắc / binh lính tinh nhuệ / tiền tuyến / các bộ tư lệnh khu vực / các thành viên nòng cốt / kinh nghiệm thực chiến"
  alternatives_vi:
  - "sĩ quan biên chế hoặc sĩ quan thành lập đơn vị (thay cho “sĩ quan lập đội” tại p000313, p000315–p000317 — ưu tiên “sĩ quan lập đội” để gắn kết tự nhiên với nhiệm vụ tập hợp và tổ chức đơn vị mới, đồng thời nghe cô đọng như một chức danh lịch sử từ thời Trung Cổ) / chỉ huy đại đội và chỉ huy tiểu đoàn (thay cho “đại đội trưởng” tại p000315 và “tiểu đoàn trưởng” tại p000322 — ưu tiên “đại đội trưởng” và “tiểu đoàn trưởng” đồng bộ với ch-04-b09 p000192 và ch-05-b12 p000302) / mũi dùi công kích từ các cục khác (thay cho “búa rìu chỉ trích từ các phòng ban khác” tại p000325) / một điều dễ chuốc lấy sự bất bình (thay cho “một điều dễ gây ác cảm” tại p000326–p000327)"
