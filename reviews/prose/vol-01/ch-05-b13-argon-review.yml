  - "Giữ “Rudersdorf”, phép so sánh giá trị chiến thuật ở câu 2 và giả định đồng thuận ở câu 3."
- segment_id: YS-LN01/Text/chapter011.xhtml/p000339
  locks:
  - "Giữ đại từ “cô”, hai cấu trúc phủ định dứt khoát và tên gọi đầy đủ “Cụm tập đoàn quân phương Tây hay Cụm tập đoàn quân phương Bắc” đồng bộ với ch-05-b03 p000045."
- segment_id: YS-LN01/Text/chapter011.xhtml/p000340
  locks:
  - "Giữ “cô” quy chiếu Tanya, “binh lính tinh nhuệ”, “tiền tuyến”, “các bộ tư lệnh khu vực”, “Cục Tác chiến”, “các thành viên nòng cốt”, “kinh nghiệm thực chiến” và hai cấu trúc phủ định ở câu 2, cuối câu 3."
