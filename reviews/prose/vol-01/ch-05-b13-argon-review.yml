  volume: vol-01
  chapter: 5
  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm và tên gọi tổ chức đã khóa tạm từ Chương 1–4, ch-05-b01 → ch-05-b12 và work/run-state/pending-terms-index.yml: “Quân đội Đế quốc” (b06-imperial-army, ch-05-b03 p000042, ch-05-b09 p000198: p000312); “tiểu đoàn”, “đại đội”, “tiểu đoàn pháp sư” và “tiểu đoàn trưởng” (ch-04-b09 p000192, ch-05-b12 p000301–p000304: p000312, p000314, p000320, p000321, p000322, p000324, p000327, p000334); “đại úy”, “sĩ quan”, “thiếu tá”, “trung úy”, “chuẩn tướng” và “thăng quân hàm” (viết thường khi là danh từ chung theo b02-second-lieutenant: p000314, p000315, p000320, p000323, p000324); “Cục Quân vụ” (ch-04-b11 p000233, ch-05-b01–b04, ch-05-b11 p000246: p000321, p000331), “Cục Nhân sự” và “Kordel” (ch-05-b11–b12: p000331), “Cục Tác chiến” và “Rudersdorf” (ch-05-b01–b04, ch-05-b09–b10: p000337, p000338, p000340); “pháp sư” và “sĩ quan chỉ huy” (ch-01-b09 p000148, ch-02-b15 p000210: p000325); “giới chóp bu” (ch-05-b09 p000206, ch-05-b10 p000222: p000327); “tiểu đoàn tăng cường” (pending-terms-index.yml, vol-02: p000334, p000335, p000336), “đơn vị thử nghiệm” (đồng bộ với “tiểu đoàn thử nghiệm” ở ch-05-b09 p000206: p000334), “tiểu đoàn phản ứng nhanh” (ch-05-b04 p000064, ch-05-b09 p000205: p000336) và “lực lượng phản ứng nhanh” (ch-05-b01–b03: p000337); “Cụm tập đoàn quân phương Tây” và “Cụm tập đoàn quân phương Bắc” (ch-05-b03 p000045, pending-terms-index.yml: p000339); “tiền tuyến”, “các bộ tư lệnh khu vực” (ch-05-b02 p000020, ch-05-b03 p000042: p000340), “các thành viên nòng cốt” (ch-04-b15 p000097: p000340) và “kinh nghiệm thực chiến” (ch-04-b08 p000161, ch-05-b03 p000047, ch-05-b12 p000296: p000340); đồng thời khóa tạm nhất quán các cụm thuật ngữ mới trong lô: “sĩ quan lập đội” (p000313, p000315–p000317), “thời Trung Cổ”, “lính đánh thuê”, “quân chính quy” và “đại đội trưởng” (p000315), “búa rìu chỉ trích” và “các phòng ban khác” (p000325), “một điều dễ gây ác cảm” (p000326–p000327), “toàn quyền” và “việc thành lập đơn vị” (p000329)."
