  proposed_vi: trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000105, p000109), dùng tên riêng “Tanya” và đại từ trần thuật “nó” theo đúng DEC-P01-001, chapter1_b02_decisions và ch02-b01 → ch02-b05 (tuyệt đối tránh dùng đại từ “cô” trong lời kể hay nội tâm về Tanya; lưu ý từ “nó” ở cuối p000109 và câu 2 p000113 quy chiếu chiếc máy vô tuyến, còn ở p000124 quy chiếu món đồ phế phẩm lỗi); trong các đoạn độc thoại nội tâm ngôi thứ nhất của Tanya (p000106, p000107, p000110, p000111, p000113, p000115, p000117–p000121, p000123, p000125), dùng nhất quán đại từ tự quy chiếu “mình” / “Mình” kết hợp “bản thân” theo đúng DEC-P01-001; tại p000114, bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo DEC-P01-002 cho phần câu hỏi nhại lại bức điện lịch sử ở nửa sau câu; trong lời kể/nội tâm, quy chiếu người lính thông tin ở Đài kiểm soát bằng “người lính thông tin” và “anh ta” (p000113), quy chiếu Kỹ sư trưởng Adelheid von Schugel bằng “lão nhà khoa học tà ác”, “vị tiến sĩ”, “gã thiên tài điên rồ này” và đại từ ngôi thứ ba “ông ta” (p000113, p000119, p000120 — đồng bộ ch-02-b04/b05), đồng thời quy chiếu đầu mối liên lạc của Tanya ở Cục Nhân sự bằng đại từ “ông ấy” (p000120, p000121) để phân biệt rõ ràng chủ thể và sắc thái tôn trọng hơn so với “ông ta” (dành cho Schugel) ngay trong cùng đoạn p000120; trong giao tiếp qua vô tuyến (p000105, p000108, p000112, p000116, p000122, p000124), Tanya gọi “Đài kiểm soát”, dùng “bên đó” cho chủ ngữ ngôi thứ hai hỏi bộ phận kiểm soát và tự xưng “Tôi” (p000105), người lính thông tin gọi Schugel là “Tiến sĩ” và “ngài” khi can ngăn (p000108), Schugel gọi Tanya là “Thiếu úy Degurechaff” và dùng đại từ ngôi thứ hai “cô” kết hợp đại từ phản thân “mình” (p000112, p000122 — đồng bộ ch-02-b04/b05), còn Tanya tự xưng “tôi” / “Tôi” và gọi Schugel là “ngài” (p000116, p000124 — đồng bộ ch-02-b04/b05)
  alternatives_vi:
  - ông (thay cho “ngài” trong lời Tanya đáp trả Schugel qua vô tuyến tại p000124 — ưu tiên “ngài” để đồng bộ hoàn toàn với ch-02-b04/b05 và giữ đúng nghi thức công vụ của người lính Đế quốc ngay cả khi đang phản bác gay gắt)
