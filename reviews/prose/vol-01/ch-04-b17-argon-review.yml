- id: ch04-b17-zettour-to-lergen-pov-shift-pronouns-conditionals-and-emphasis
  source_term: zettour_to_lergen_pov_shift_pronouns_conditionals_and_emphasis_ch04_b17
  proposed_vi: 'tiếp nối trực tiếp lô ch-04-b16 tại Văn phòng Bộ Tổng Tham mưu, lô ch-04-b17 (chapter009b.xhtml/p000122–p000146) gồm hai phân cảnh dưới điểm nhìn của Chuẩn tướng von Zettour (p000122–p000138) và sau khoảng ngắt cảnh (class="space-break1" ở p000139) chuyển sang trần thuật ngôi thứ ba xoay quanh bước ngoặt thăng tiến của Thiếu tá / Trung tá von Lergen (p000139–p000146), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Ở Phân cảnh 1 (p000122–p000138), quy chiếu Chuẩn tướng von Zettour trong trần thuật ngôi thứ ba nhất quán bằng tên riêng “Zettour” và đại từ trang trọng “ông” / “Ông” kết hợp phản thân “mình” / “bản thân” (p000123–p000125, p000127–p000129, p000132–p000134, p000137 — đồng bộ ch-04-b16); trong các câu độc thoại nội tâm ngôi thứ nhất trực tiếp của Zettour (được đánh dấu `<html:em>` trong nguồn ở p000124, p000134, p000136, p000138), Zettour tự quy chiếu bằng “Mình” kết hợp “bản thân” (p000124, p000134, p000138) và dùng “chúng ta” cho phía Đế quốc (p000136); khi Zettour nghĩ và nhớ về Trung úy Tanya Degurechaff, quy chiếu Tanya bằng “Cô” / “cô” / “cô bé ấy” trong lời kể ngôi thứ ba (p000123, p000129, p000135) và “cô ấy” trong câu độc thoại nội tâm trực tiếp (p000136 — đồng bộ hoàn toàn với ch-04-b04 và ch-04-b16; lưu ý từ “nó” ở p000124 chỉ quy chiếu “cú sốc trí tuệ”, và từ “nó” ở p000134 chỉ quy chiếu lập luận/dự đoán); trong lời thoại của Zettour nói với các sĩ quan tham mưu thuộc cấp (p000125, p000130) và câu lẩm bẩm thành tiếng (p000137), Zettour tự xưng “Tôi” / “tôi”, gọi các thuộc cấp là “các anh” / “Các anh” và dùng “chúng ta” cho phía Đế quốc; trong câu hỏi ngầm qua biểu cảm của viên sĩ quan cấp dưới đối với vị chuẩn tướng cấp trên (p000126), dùng `*Ngài ấy bị làm sao thế nhỉ?*`. (2) Ở Phân cảnh 2 (p000139–p000146), quy chiếu Thiếu tá / Trung tá von Lergen nhất quán bằng danh xưng “Thiếu tá von Lergen” / “Trung tá von Lergen” / “vị trung tá” và đại từ trần thuật ngôi thứ ba “ông” kết hợp phản thân “mình” (p000141, p000142, p000144, p000145 — đồng bộ ch-01-b15/b18 và ch-04-b02/b04/b05; lưu ý từ “nó” ở câu 3 p000146 chỉ quy chiếu danh từ bất động vật là “Tòa nhà Bộ Tổng Tham mưu”). (3) Trong các câu nhận định khái quát có đại từ ngôi thứ hai phiếm chỉ trong nguồn (p000133, p000139, p000140, p000143), dùng chủ ngữ khái quát “một người” (p000139) hoặc lược đại từ ngôi thứ hai phiếm chỉ (p000133, p000140, p000143) theo đúng quy ước direct-address choice. (4) Bảo toàn đầy đủ câu hỏi trực tiếp của Zettour với các thuộc cấp (p000125), câu hỏi ngầm qua biểu cảm của viên sĩ quan cấp dưới (p000126), hai câu hỏi tu từ trong suy nghĩ của Zettour (p000132, p000133), câu hỏi giả định (p000135), câu hỏi tự vấn (p000137), cùng chính xác thời gian và mức độ chắc chắn của các mệnh đề giả định và điều kiện (giả định trái thực tế ở p000123; giả định ở p000127 và p000128; phủ định khả thể ở p000134; giả định hai bậc ở p000135; hai câu điều kiện nối tiếp ở p000136; giả định đánh giá ở p000137; tương lai trong quá khứ ở p000145). (5) Bảo toàn chính xác cả 5 vị trí nhấn mạnh Markdown `*...*` tương ứng với thẻ `<html:em>` trong `xhtml` nguồn tại p000124 (`*Mình không thể làm loạn trước mặt cấp dưới được*`), p000126 (`*Ngài ấy bị làm sao thế nhỉ?*`), p000134 (`*Chuyện như thế tuyệt đối không thể nào xảy ra được. Mình sẽ tìm ra lỗ hổng của nó ở đâu đó thôi*`), p000136 (`*Nếu chuyện đó xảy ra, giao cho cô ấy một tiểu đoàn cũng không phải là ý tồi. Nếu chúng ta không thể chiến thắng trừ phi hóa điên, thì chúng ta đành phải làm vậy thôi.*`) và p000138 (`*Haiz… Mình thật hối hận vì bản thân quá đỗi bất tài.*`), không phát sinh dấu `*` ngoài nguồn ở 20/25 đoạn còn lại theo đúng DEC-P01-002'
  alternatives_vi:
  - '*Ông ấy bị làm sao thế nhỉ?*' (thay cho `*Ngài ấy bị làm sao thế nhỉ?*` trong câu hỏi ngầm qua biểu cảm của viên sĩ quan cấp dưới đối với vị chuẩn tướng cấp trên tại p000126 — ưu tiên “Ngài ấy” để thể hiện khoảng cách cấp bậc với một chuẩn tướng thuộc Bộ Tổng Tham mưu) / '*À… Mình thật hối hận vì bản thân quá đỗi bất tài.*' (thay cho tiếng thở dài mở đầu `*Haiz…*` tại p000138)
