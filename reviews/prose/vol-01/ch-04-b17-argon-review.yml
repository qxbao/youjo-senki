  rationale: "Kế thừa đồng bộ “ảo tưởng” (P05-delusion / ch-04-b16 p000121, p000122), “Zettour” (p000123, p000127, p000128, p000137), “sĩ quan tham mưu” (ch-04-b16 p000110, p000112, p000124), “cấp dưới” / “thuộc cấp” (p000124, p000132), “chiến tranh thế giới” (ch-04-b12 p000016–p000021, ch-04-b16 p000121, p000125), “học viện chiến tranh” (ch-04-b01/b04/b11/b16, p000129), giữ nguyên danh xưng “Reich” khi nguồn dùng danh xưng tiếng Đức để phân biệt với “Đế quốc” ở p000135 (ch04-b13-dominant-state-foreign-intervention-lend-lease-and-individualism-terms / ch-03-b10, p000132), “Đế quốc” (p000135), “tiểu đoàn” (ch-04-b03 p000045, ch-04-b15 p000098, p000136), “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms, p000139, p000144, p000146), “Quân đội Đế quốc” (b06-imperial-army, p000139), “hậu phương” (ch-04-b07/b11, p000140), “lộ trình tinh hoa” (ch04-b01-first-screening-lergen-reassessment-and-elite-track-terms / ch-04-b01 p000020, ch-04-b04 p000087, p000140), “Thiếu tá von Lergen” (ch-01-b15, ch-04-b01/b02/b04, p000141), “Cục Nhân sự” (b15-general-staff-personnel-and-achievement-assessment-terms / ch-01-b15, ch-04-b01/b02/b04/b07/b11, p000141), “Văn phòng Bộ Tổng Tham mưu” (ch-01-b15, ch-04-b11/b16, p000141, p000142), “trưởng ban” (ch-01-b15 p000275, ch-04-b01 p000022, ch-04-b02 p000037, p000141), “Hội đồng Tuyển sinh Học viện Chiến tranh Đế quốc” (ch-04-b01 p000001, p000002, p000142), “ứng viên” (ch-04-b01–b05, p000142), cấp bậc “trung tá” / “Trung tá von Lergen” (p000144, p000145), “Cục Tác chiến” (đồng bộ cấp “Cục” với “Cục Nhân sự” và “Cục Quân vụ”, cùng sổ pending Tập 2–3, p000144, p000146), “lục quân” (ch-04-b01/b11–b13, p000145, p000146) và “thủ đô đế quốc” viết thường khi là danh từ chung (p000146); khóa tạm “những chuẩn mực sĩ quan” và “cú sốc trí tuệ” (p000124), “sĩ quan cấp dưới” (p000126), “dự đoán hoàn toàn có cơ sở” (p000127), “chiếc hộp Pandora” (p000129), cặp tính từ “cực đoan” và “cấp tiến” (đồng bộ giữa p000131 và p000133), cặp đối lập “chuyên gia” / “chuyên gia quân sự” và “nhà tổng quát” (đồng bộ giữa p000139, p000142 và p000143), “những cột mốc thuyên chuyển” (đồng bộ từ “cột mốc” giữa p000140 và p000141), “sĩ quan tham mưu cấp cao” (p000144), “kế hoạch tổng thể” và “truyền thống bóc lột sức lao động như nô lệ” (p000145)."
