  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md qua cả hai phân cảnh tại Bộ Tổng Tham mưu: giữ đại từ “ông” trong lời kể và “Mình” trong độc thoại nội tâm trực tiếp cho Chuẩn tướng von Zettour, giữ “cô” / “cô ấy” cho Trung úy Degurechaff trong góc nhìn của Zettour (đồng bộ ch-04-b04 và ch-04-b16), giữ đại từ “ông” cho Thiếu tá / Trung tá von Lergen (đồng bộ ch-01-b15/b18 và ch-04-b02/b04/b05), đồng thời bảo toàn chính xác các câu hỏi, cấu trúc giả định/điều kiện và cả 5 vị trí nhấn mạnh in nghiêng tại p000124, p000126, p000134, p000136 và p000138."
