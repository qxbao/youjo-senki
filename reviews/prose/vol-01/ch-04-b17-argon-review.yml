gia quân sự” và “nhà tổng quát” (đồng bộ giữa p000139, p000142 và p000143), “những cột mốc thuyên chuyển” (đồng bộ từ “cột mốc” giữa p000140 và p000141), “sĩ quan tham mưu cấp cao” (p000144), “kế hoạch tổng thể” và “truyền thống bóc lột sức lao động như nô lệ” (p000145)."
