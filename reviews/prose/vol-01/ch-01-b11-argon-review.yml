locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000175
  locks:
  - Giữ các thuật ngữ “yểm trợ trên không”, “các pháo đội của Đế quốc”, “mục tiêu chiến thuật tuyệt hảo”, “vô hiệu hóa hỏa lực chi viện” và kết luận “Dù sao đi nữa, tình hình lúc này cũng hết sức nguy ngập.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000176
  locks:
  - Giữ giả định trái thực tế “Mọi chuyện có lẽ đã chẳng tệ đến thế nếu quân đoàn sử dụng pháo tự hành, đằng này đại đa số lại là pháo kéo.” cùng các thuật ngữ “cơ giới hóa các khẩu đội pháo binh”, “các sư đoàn thiết giáp, lực lượng pháp sư và không quân” và “những khẩu lựu pháo cồng kềnh”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000177
  locks:
  - Giữ thuật ngữ “đội tuần tra chiến đấu trên không”, “một toán pháp sư quy mô cấp đại đội” và mục tiêu “cầm chân chúng cho đến khi các đơn vị không quân của ta kịp tập hợp đội hình”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000178
  locks:
  - Giữ khẩu lệnh ngắn gọn “Bắt đầu giao chiến!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000179
  locks:
  - Giữ khẩu lệnh “Norden Control gọi Fairy 08! Hãy báo cáo tình hình!”, thuật ngữ “các biện pháp chống đối kháng điện tử”, đại từ nội tâm “mình” / “bản thân” và độ mở của hai câu hỏi cuối đoạn “Vậy thì là gì chứ? Sao mình lại có linh cảm chẳng lành thế này?”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000180
  locks:
  - Giữ lời báo cáo vô tuyến “Đây là Fairy 08. Tôi đã tiếp xúc với địch. Xin nhắc lại, tôi đã tiếp xúc với địch. Một đại đội pháp sư địch đang xâm nhập không phận của ta.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000181
  locks:
  - Giữ mệnh lệnh vô tuyến “Norden Control nghe rõ. Hãy duy trì tiếp xúc và cầm chân địch. Ngoài ra, nếu có thể, hãy thu thập tin tình báo.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000182
  locks:
  - Giữ chuỗi câu hỏi bức xúc trong độc thoại nội tâm của Tanya và câu kết “Nếu họ định ra lệnh cho mình đi chết thì ước gì họ cứ nói thẳng toẹt ra luôn đi.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000183
