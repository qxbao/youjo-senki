  rationale: "Giữ nguyên định danh “Norden Control”, “Fairy 08” và khẩu lệnh “Xin nhắc lại” (b09-radio-callsigns-and-procedure-terms); đồng bộ “trung đội” (b10), “trực chờ trên không” (b09), “hậu phương” (b05) và “tuyến cảnh giới sớm” (phát triển từ “tuyến cảnh giới” ở b07/b09); khóa tạm phiên hiệu “Đại đội Pháp sư Cơ động số 7”, “tác chiến trì hoãn”, “đưa ra tòa án binh” và “quy luật nhân quả” tự nhiên, đúng văn phong quân sự."
