- id: b11-tanya-pronouns-and-norden-control-radio-address
  source_term: Tanya interior monologue self-reference, dissociated identity/body reference, Fairy 08 radio self-reference, and Norden Control dialogue address
  proposed_vi: độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng “mình” / “Mình” / “bản thân” xuyên suốt (p000179, p000182, p000185, p000186, p000189, p000191, p000192, p000194, p000195); khi tự tách góc nhìn để nói về độ tuổi cơ thể và danh tính bên ngoài tại p000191–p000192 dùng tên riêng “Tanya” / “Tanya Degurechaff” kết hợp đại từ phản thân “bản thân” (tuyệt đối tránh dùng đại từ “cô” trong lời kể/nội tâm theo chapter1_b02_decisions); trong đối thoại vô tuyến, Fairy 08 tự xưng “Tôi” (p000180) và dùng “ta” cho phe Đế quốc (p000180, p000190), còn Norden Control tự xưng “Tôi” / “chúng tôi” (p000184, p000188, p000193), gọi Fairy 08 là “cô” (p000193) và dùng “ta” cho các đơn vị phe Đế quốc; quy chiếu quân địch bằng “chúng” (p000175, p000177, p000182, p000188) và quy chiếu cấp chỉ huy/nhân viên kiểm soát ở hậu phương trong nội tâm Tanya bằng “họ” / “bọn họ” / “các người” (p000182, p000189, p000191, p000192)
  alternatives_vi:
  - đồng chí / cậu (thay cho “cô” trong lời thoại của Norden Control gọi Fairy 08 tại p000193 — ưu tiên “cô” vì tự nhiên trong liên lạc vô tuyến quân sự của Đế quốc với nữ thiếu úy ma pháp và không vi phạm quy ước tránh dùng “cô” trong lời kể ngôi thứ ba)
