locked_choices:
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000144
  locks:
  - Giữ định danh “Norden Control”, thuật ngữ “tình báo chiến trường”, ký hiệu “Khu vực α” và hiệu ứng ngắt quãng do nhiễu sóng “phân khu— Rè… xè…”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000145
  locks:
  - Giữ nguyên khẩu lệnh đáp vô tuyến “Norden Control, đây là Fairy 08. Tín hiệu thu kém. Nhiễu nặng lắm. Hết.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000146
  locks:
  - Giữ hai khả năng loại trừ “Hoặc là có nhiễu điện từ, hoặc chỉ đơn giản là thiết bị của mình đang giở chứng.”, câu hỏi tu từ “Sao chuyện đó không xảy ra vào lúc nào khác ngoài đúng thời khắc then chốt này chứ?”, đại từ nội tâm “mình” ở hai câu đầu chuyển sang tên riêng “Tanya” ở câu trần thuật thứ ba, và định danh “Norden Control”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000147
  locks:
  - Giữ hô hiệu “Cherubim Leader” và khẩu lệnh “Cherubim Leader phát cảnh báo chiến trường! Xin nhắc lại, cảnh báo chiến trường! Xác nhận một lượng lớn mục tiêu không xác định đang bay tới!”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000148
  locks:
  - Giữ cấu trúc phủ định “Đó không phải thông điệp thông thường hay thông điệp khẩn, mà là một cảnh báo chưa rõ tính chất.”, các thuật ngữ “nhân viên kiểm soát trên không”, “cảnh báo chiến trường”, “tuyến thứ nhất”, “tác chiến đánh chặn”, “tuyến cảnh giới phía trước tuyến tuần tra thứ nhất bị chọc thủng” và đại từ “anh ta”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000149
  locks:
  - Giữ đúng mức độ phỏng đoán “Có lẽ một toán binh sĩ mới đầy gờm ghiếc đã tham chiến.” và “Xem ra kẻ địch rốt cuộc cũng chẳng chịu gục ngã dễ dàng đến thế.”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000150
  locks:
  - Giữ khẩu lệnh “Norden Control gọi toàn bộ lực lượng đánh chặn trên không đang trực chờ.”, dấu chú thích `⁸` ngay sau lần xuất hiện đầu tiên của “quy tắc giao chiến⁸”, và cụm “từ tuần tra biên giới sang phòng không cơ động”.
- segment_id: YS-LN01/Text/chapter003b.xhtml/p000151
  locks:
