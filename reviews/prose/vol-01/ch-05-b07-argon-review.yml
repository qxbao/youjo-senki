  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, chức danh và tên gọi tổ chức đã khóa tạm từ Chương 1–4 và ch-05-b01 → ch-05-b06: “học viện chiến tranh” (ch-04-b01 p000002, ch-05-b06 p000107, p000119: p000128), phân biệt rõ với “học viện quân sự” (ch-01-b02 p000026, ch-01-b18 p000022, ch-05-b06 p000109: p000137); “nhà nghiên cứu” và “kỹ sư” (ch-02-b01 p000006, ch-02-b03 p000066: p000128); “Quân đội Đế quốc” (b06-imperial-army, ch-05-b06 p000121: p000131) và “Đế quốc” (p000155); “Trung úy Degurechaff” (b06-first-lieutenant, ch-05-b06 p000115, p000125: p000134, p000142, p000155) và “Thưa Đại úy” / “Đại úy Uger” (ch-04-b22 p000259, ch-05-b06 p000114, p000117, p000120: p000139, p000146, p000152); “thần đồng” (ch-01-b16 p000285, ch-04-b03 p000043: p000138); “hải quân” (ch-04-b01 p000002, p000006: p000141); “trại trẻ mồ côi” (b18-orphanage-investigation-and-personnel-psychology-terms / ch-01-b18 p000021: p000146, p000147) và “nhà thờ” (ch-05-b06 p000113: p000147); “những kẻ ăn không ngồi rồi” (ch-05-b03 p000046: p000150); đồng thời khóa tạm các thuật ngữ mới phát sinh trong lô: “Mười Hai Hiệp sĩ”, “tố chất ma pháp”, “Đại học Đế quốc”, “miễn học phí” và “học bổng sinh hoạt phí” (p000128), “đứa trẻ mồ côi” (p000135, p000143), “trường trung học” (p000137), “công chức cấp trung” và “lực lượng vũ trang” (p000141), “tiền tuất” (p000145), “đứa con hoang” (p000146), và “thiên chức” (p000151)."
