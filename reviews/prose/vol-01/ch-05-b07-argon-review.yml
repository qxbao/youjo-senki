  volume: vol-01
  chapter: 5
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 33 đoạn tiếp nối cảnh Quán cà phê Zolka dưới điểm nhìn ngôi thứ nhất của Đại úy Uger: giữ đại từ tự sự “tôi” / “Tôi” – “mình” cho Uger và quy chiếu Tanya bằng “cô ấy” / “một cô bé” mà tuyệt đối không dùng “nó” cho nhân vật, giữ cặp xưng hô chuẩn mực giữa hai học viên đồng khóa chênh một bậc quân hàm, bảo toàn toàn bộ các cấu trúc phủ định/nhượng bộ/giả định trái thực tế, cấu trúc “không chỉ... mà thậm chí còn...”, các câu hỏi nội tâm và chính xác 1 vị trí nhấn mạnh Markdown `*từng*` tương ứng với `<html:em>` tại p000131."
