- id: ch05-b07-uger-first-person-pov-pronouns-counterfactuals-and-single-emphasis
  source_term: uger_first_person_pov_pronouns_counterfactuals_and_single_emphasis_ch05_b07
  proposed_vi: 'Tiếp nối trực tiếp ch-05-b06 (chapter011.xhtml/p000127), toàn bộ 33 đoạn của lô ch-05-b07 (chapter011.xhtml/p000128–p000160) dưới điểm nhìn tự sự ngôi thứ nhất của Đại úy Uger trong cuộc trò chuyện với Trung úy Tanya Degurechaff tại Quán cà phê Zolka tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm tự quy chiếu chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp dụng khi câu chuyện được kể từ điểm nhìn ngôi thứ nhất của Đại úy Uger; từ “nó” duy nhất xuất hiện ở cuối câu 2 p000156 hoàn toàn chỉ quy chiếu danh từ trừu tượng là “bổn phận của tôi”), DEC-P01-002 và canon/style-guide.md: (1) Hệ đại từ tự sự và quy chiếu ngôi thứ ba: trong lời kể và độc thoại suy nghĩ ngôi thứ nhất (p000128, p000131, p000132, p000134, p000136, p000138, p000141, p000142, p000144, p000147, p000148, p000150–p000152, p000154, p000155, p000157, p000158, p000160), Đại úy Uger tự xưng nhất quán là “tôi” / “Tôi” kết hợp đại từ phản thân “mình” / “bản thân”, dùng “Chúng tôi” khi nói về gia đình xuất thân của mình (p000141); quy chiếu Trung úy Tanya Degurechaff nhất quán bằng “Trung úy Degurechaff”, “cô ấy” / “Cô ấy” và “một cô bé” (p000128, p000134, p000136, p000138, p000142, p000144, p000147, p000150, p000152, p000154, p000155, p000157, p000158, p000160 — đồng bộ hoàn toàn với ch-05-b06 p000112–p000127); quy chiếu phía quân đội và Đại học Đế quốc bằng “họ” (p000128), và các binh lính bằng “họ” (p000132, p000150). (2) Hệ xưng hô trong đối thoại giữa Đại úy Uger và Trung úy Tanya Degurechaff (p000129, p000130, p000133, p000135, p000137, p000139, p000140, p000143, p000145, p000146, p000149, p000152, p000153, p000156, p000159): Đại úy Uger (p000130, p000137, p000140, p000145, p000149, p000153, p000159) tự xưng “Tôi” / “tôi”, gọi Tanya là “cô” và quy chiếu cha của Tanya bằng “ông ấy” (p000130) đồng bộ với ch-05-b06; Trung úy Tanya Degurechaff (p000129, p000133, p000135, p000139, p000143, p000146, p000152, p000156) tự xưng “tôi” (và “Chúng tôi” khi nói gộp những đứa trẻ mồ côi ở p000135), gọi Uger là “Thưa Đại úy” / “Đại úy Uger” và đại từ ngôi thứ hai lịch sự “anh” kèm tiểu từ kính ngữ “ạ” (p000133, p000139, p000143, p000146), riêng tại p000152 khi tự ái và danh dự nhà binh bị chạm tới thì chất vấn lạnh lùng không dùng tiểu từ kính ngữ “ạ” (“…Đại úy Uger, anh nghi ngờ năng lực của tôi sao?”). (3) Bảo toàn chính xác sự liên kết từ vựng của dấu hiệu thời quá khứ qua ba đoạn liên tiếp p000129 (“từng”) → p000130 (“Từng ư?”) → p000131 (“Chữ *từng* đập vào tai tôi”), cấu trúc tăng tiến giữ cùng chủ thể ở câu 5 p000128 (“Đại học Đế quốc cho phép nhập học sớm, và họ không chỉ miễn học phí cho những sinh viên xuất sắc mà thậm chí còn cấp cả học bổng sinh hoạt phí.”), đối tượng và độ mở của các câu hỏi nội tâm tại p000134, p000138, p000147, p000154 và đặc biệt câu hỏi về bản ngã tại p000158 (“Con người thật của cô ấy nằm ở đâu?”), cùng toàn bộ các cấu trúc phủ định, nhượng bộ, suy đoán và điều kiện giả định trái thực tế tại p000128, p000134, p000137–p000140, p000144–p000148, p000150, p000152, p000154, p000155, p000157 và p000160. (4) Bảo toàn chính xác vị trí nhấn mạnh Markdown `*từng*` duy nhất tương ứng với thẻ `<html:em>` tại p000131 theo đúng DEC-P01-002, tuyệt đối không dùng dấu `*` ở 32/33 đoạn còn lại.'
  alternatives_vi:
  - đã từng hoặc từng là người trong quân ngũ (thay cho “từng” tại p000129–p000131 — ưu tiên trợ từ thời quá khứ đơn âm tiết “từng” / “Từng ư?” / “Chữ *từng*” để bảo toàn trọn vẹn nhịp bắt chữ tự nhiên và chính xác một từ in nghiêng duy nhất trong nguyên văn) / Bản chất thật của cô ấy là gì? (thay cho “Con người thật của cô ấy nằm ở đâu?” tại p000158 — ưu tiên “Con người thật của cô ấy nằm ở đâu?” để giữ nguyên đối tượng và độ mở của câu hỏi nội tâm theo đúng quy tắc bổ sung sau pilot-01 trong style-guide.md)
