  proposed_vi: học viện chiến tranh / Mười Hai Hiệp sĩ / tố chất ma pháp / nhà nghiên cứu / kỹ sư / Đại học Đế quốc / miễn học phí / học bổng sinh hoạt phí / Quân đội Đế quốc / Trung úy Degurechaff / đứa trẻ mồ côi / học viện quân sự / trường trung học / thần đồng / Thưa Đại úy / công chức cấp trung / hải quân / lực lượng vũ trang / tiền tuất / đứa con hoang / trại trẻ mồ côi / nhà thờ / những kẻ ăn không ngồi rồi / thiên chức / Đại úy Uger / Đế quốc
  alternatives_vi:
  - Thập Nhị Hiệp sĩ, độ tương thích ma pháp và trợ cấp sinh hoạt (thay cho “Mười Hai Hiệp sĩ”, “tố chất ma pháp” và “học bổng sinh hoạt phí” tại p000128 — ưu tiên “Mười Hai Hiệp sĩ” đồng bộ với các tập sau, “tố chất ma pháp” đồng bộ với “tố chất” ở ch-05-b06 p000127, và “học bổng sinh hoạt phí” ghép rõ nghĩa hỗ trợ sinh hoạt bên cạnh việc miễn học phí cho sinh viên xuất sắc) / viên chức cấp trung (thay cho “công chức cấp trung” tại p000141) / lương hưu hoặc trợ cấp quân nhân (thay cho “tiền tuất” tại p000145 — ưu tiên “tiền tuất” vì khớp trực tiếp với ngữ cảnh người cha quân nhân đã tử trận ở p000130–p000132) / đứa con ngoài giá thú và cô nhi viện (thay cho “đứa con hoang” và “trại trẻ mồ côi” tại p000146 — ưu tiên “đứa con hoang” giữ đúng sắc thái thẳng thừng, tự giễu lạnh lùng của Tanya và “trại trẻ mồ côi” kế thừa đồng bộ ch-01-b18 p000021) / những kẻ nhàn rỗi và nghề nghiệp (thay cho “những kẻ ăn không ngồi rồi” tại p000150 và “thiên chức” tại p000151 — ưu tiên “những kẻ ăn không ngồi rồi” đồng bộ với ch-05-b03 p000046 và “thiên chức” giữ đúng sắc thái đối lập bi kịch khi một đứa trẻ chọn lấy con đường binh nghiệp)
