- id: ch05-b05-andrew-first-person-pov-pronouns-modality-and-six-emphases
  source_term: andrew_first_person_pov_pronouns_modality_and_six_emphases_ch05_b05
  proposed_vi: 'Tiếp nối trực tiếp phân cảnh hậu chiến ngày 23 tháng 6 năm Thống nhất 1967 tại Phòng Báo chí WTN ở Londinium từ cuối ch-05-b04 (p000078–p000085), toàn bộ 20 đoạn của lô ch-05-b05 (chapter011.xhtml/p000086–p000105) dưới điểm nhìn tự sự ngôi thứ nhất của phóng viên đặc biệt Andrew tuân thủ nghiêm ngặt giới hạn chủ thể của DEC-P01-001 (Tanya không xuất hiện trực tiếp trong cảnh; tuyệt đối không áp dụng đại từ “nó” quy chiếu nhân vật ở bất kỳ đoạn nào), DEC-P01-002 và canon/style-guide.md: (1) Hệ đại từ tự sự và quy chiếu ngôi thứ ba: người kể Andrew tự xưng nhất quán là “Tôi” / “tôi” kết hợp đại từ phản thân “mình” khi nói về cá nhân (p000087, p000090, p000096–p000098, p000101, p000102) và dùng “Chúng tôi” / “chúng tôi” kết hợp phản thân “mình” khi nói về nhóm điều tra làm phim tài liệu hoặc khi đi cùng đồng nghiệp Craig (p000086, p000087, p000091–p000094, p000096, p000100, p000101, p000104 — đồng bộ ch-05-b04 và các tập sau); quy chiếu người quen là nhà sử học quân sự bằng đại từ lịch sự “Ông ấy” (p000090, p000091); quy chiếu hình tượng “Nữ thần Thứ Mười Một” bằng “bà ta” (p000092, p000100 — đồng thời dịch rõ đại từ trung tính quy chiếu biệt danh/mật danh ở cuối p000092 là “cái tên ấy”, và chỉ dùng “nó” ở câu 3 p000091 cho vật vô tri là “đoạn mã gồm mười một ký tự xxxxxxxxxxx”); quy chiếu những người từng ở ngoài tiền tuyến bằng “Họ” / “họ” (p000093); quy chiếu người pháp sư thân thiện trong ví dụ giả định ở quán bar bằng “anh ta” (p000097); quy chiếu người sĩ quan pháp sư không quân từng thân thiết với Andrew trước khi tử trận bằng “anh ấy” (p000098); và quy chiếu cựu thành viên Bộ Tổng Tham mưu bằng “Ông ấy” / “ông ấy” (p000101, p000102). (2) Bảo toàn chính xác giả thuyết và mức độ suy đoán ở p000086 (“Chúng tôi đặt giả thuyết rằng... Có lẽ điều đó giải thích tại sao...”), suy đoán ở p000087 (“Chúng tôi suy đoán rằng...”), phủ định và sự tương phản ở p000089, mệnh đề điều kiện-kết quả ở p000090 (“nếu tôi phân tích thật kỹ những lời đồn đại trên chiến trường, tôi sẽ tìm ra sự thật”), suy đoán ở p000091 (“Ông ấy suy đoán rằng...”), giả thuyết khả thể ở câu 5 p000092 (“giả thuyết rằng cái tên ấy có lẽ dùng để chỉ một điệp viên tình báo nào đó”), câu hỏi nghi vấn giả định ở câu 1 p000094 (“Phải chăng ẩn sau mười một chữ *x* ấy có nhiều hơn một ý nghĩa, và tất cả chúng đang bị trộn lẫn vào nhau?”), giả định tình huống ví dụ ở câu 1 và phủ định ở câu 3 p000097 (“Chẳng hạn, giả sử tôi gặp... Chuyện này chẳng phải điều gì hiếm gặp”), câu nói trực tiếp chứa phủ định ở p000098 (“Ở đằng kia, con người không còn là con người nữa”), suy luận tất yếu ở câu 2 p000099 (“Điều đó ắt hẳn phải có liên quan đến...”), cùng toàn bộ các mệnh đề phủ định ở p000101 (“khi chúng tôi không còn liên lạc được với ông ấy nữa”, “tôi đã không bao giờ nhận được hồi âm”, “cho đến tận ngày hôm nay tôi vẫn chưa thể liên lạc được với ông ấy”). (3) Bảo toàn chính xác cả 6 đoạn có nhấn mạnh Markdown `*...*` theo đúng DEC-P01-002 tương ứng với thẻ `<html:em>` trong xhtml nguồn tại p000094 (`*x*`), p000096 (`*WTN*`), p000099 (`*mật*`), p000100 (`*cần biết mới được phép biết*`), p000103 (`*V600.*`) và p000105 (`*WTN*`), tuyệt đối không dùng dấu `*` ở 14 đoạn còn lại.'
  alternatives_vi:
  - cô ấy hoặc nhân vật này (thay cho “bà ta” khi quy chiếu hình tượng “Nữ thần Thứ Mười Một” tại p000092, p000100 — ưu tiên “bà ta” vì phù hợp với sắc thái bí ẩn của hình tượng “Nữ thần” trên lá bài tarot và giả thuyết điệp viên/sĩ quan cấp cao trong góc nhìn điều tra của nhóm phóng viên)
