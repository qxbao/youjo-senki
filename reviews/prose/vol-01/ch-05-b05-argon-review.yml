  proposed_vi: Đế quốc / lực lượng đánh chặn / Dakar / Khối Thịnh vượng chung / Hải đội 2 / bị đóng dấu mật / các phi vụ ngầm mờ ám / phóng viên / được giải mật / Hải quân Khối Thịnh vượng chung / xxxxxxxxxxx / nhà sử học quân sự / mật danh / Nữ thần Thứ Mười Một / cơ quan tình báo / tranh chấp biên giới / điệp viên tình báo / tiền tuyến / mười một chữ *x* / Trận Không chiến Rhine / “30 phần trăm bầu trời và 70 phần trăm máu” / pháp sư / không phận / Craig / *WTN* / “Sông Rhine nơi lũ ác quỷ trú ngụ” / “nghĩa địa của các Pháp sư Định danh” / “chiến trường nơi ngay cả bạc cũng phải hoen gỉ” / sĩ quan pháp sư không quân / Mặt trận Rhine / những con dấu *mật* / Quân đội Đế quốc / bức tường *cần biết mới được phép biết* / Bộ Tổng Tham mưu / điều kiện giấu tên / *V600.* / Andrew, phóng viên đặc biệt của *WTN*
  alternatives_vi:
  - những giao dịch bẩn thỉu (thay cho “các phi vụ ngầm mờ ám” tại p000087) / đặc vụ tình báo (thay cho “điệp viên tình báo” tại p000092) / Trận chiến Không phận Rhine (thay cho “Trận Không chiến Rhine” tại p000095, p000100 — ưu tiên “Trận Không chiến Rhine” vì súc tích và chuẩn thuật ngữ lịch sử quân sự) / những Kẻ Được Định danh (thay cho “các Pháp sư Định danh” trong cụm “nghĩa địa của các Pháp sư Định danh” tại p000096 — ưu tiên “các Pháp sư Định danh” đồng bộ với ch-02-b10 p000116, ch-03-b12 p000237, ch-04-b01 p000014) / *chỉ người cần biết mới được biết* (thay cho `*cần biết mới được phép biết*` tại p000100) / điều kiện ẩn danh (thay cho “điều kiện giấu tên” tại p000102)
