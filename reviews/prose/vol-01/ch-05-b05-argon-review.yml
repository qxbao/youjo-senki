  volume: vol-01
  chapter: 5
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 20 đoạn phóng sự hậu chiến của phóng viên Andrew (WTN) ở cuối Chương 5: giữ hệ đại từ tự sự ngôi thứ nhất “Tôi” / “tôi” – “mình” (cá nhân Andrew) và “Chúng tôi” / “chúng tôi” – “mình” (nhóm điều tra làm phim tài liệu / đi cùng đồng nghiệp Craig), phân biệt rõ các đại từ ngôi thứ ba theo đúng đối tượng quy chiếu (“Ông ấy” / “ông ấy”, “bà ta”, “Họ” / “họ”, “anh ta”, “anh ấy”), bảo toàn toàn bộ các cấu trúc giả thuyết/điều kiện/phủ định và chính xác 6 vị trí nhấn mạnh Markdown `*...*` tương ứng với `<html:em>` tại p000094, p000096, p000099, p000100, p000103 và p000105."
