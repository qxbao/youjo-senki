  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng và chức danh từ Chương 1–4, ch-05-b04 cùng các tập sau: “Đế quốc” (p000086, p000092), “Dakar”, “Khối Thịnh vượng chung”, “Hải đội 2”, “Hải quân Khối Thịnh vượng chung”, “bị đóng dấu mật” / “những con dấu *mật*” và “được giải mật” (ch-05-b04 p000083–p000085, p000086–p000089, p000099), “phóng viên” (ch-05-b04 p000080, p000087), “mật danh” (ch-03-b01 p000008, p000091), “Nữ thần Thứ Mười Một” (vol-02-ch-03-b01 p000023, p000026, p000038; vol-02-ch-03-b02 p000041, p000050, p000053, p000091, p000092, p000100), “tiền tuyến” (ch-05-b01 p000005, ch-05-b04 p000067, p000093), “pháp sư” và “không phận” (ch-01-b01 p000003, p000095, p000097), “Craig” (vol-02-ch-06-b02 p000037, p000096), “các Pháp sư Định danh” (ch-02-b10 p000116, ch-03-b12 p000237, ch-04-b01 p000014, p000096), “sĩ quan pháp sư không quân” (chapter1_b01_pending_terms: “pháp sư không quân”, p000098), “Mặt trận Rhine” (ch-03-b12 p000234, ch-04-b09 p000181, p000099), “Quân đội Đế quốc” (b06-imperial-army, p000100), “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms, p000100), cùng “Andrew” và “phóng viên đặc biệt của *WTN*” (vol-02-ch-06-b01 p000003, vol-04-ch-01-b20 p000246, p000096, p000105); đồng thời khóa tạm các thuật ngữ và biểu thức mới phát sinh trong lô: “lực lượng đánh chặn” (p000086), “các phi vụ ngầm mờ ám” (p000087), giữ nguyên chuỗi mười một chữ x viết thường “xxxxxxxxxxx” (p000088, p000091, p000094, p000095), “nhà sử học quân sự” (p000090), “cơ quan tình báo”, “tranh chấp biên giới” và “điệp viên tình báo” (p000092), “Trận Không chiến Rhine” và “30 phần trăm bầu trời và 70 phần trăm máu” (p000095, p000100), ba tên gọi của chiến trường Rhine (“Sông Rhine nơi lũ ác quỷ trú ngụ”, “nghĩa địa của các Pháp sư Định danh”, “chiến trường nơi ngay cả bạc cũng phải hoen gỉ” ở p000096), bức tường `*cần biết mới được phép biết*` (p000100), “điều kiện giấu tên” (p000102) và mã `*V600.*` (p000103)."
