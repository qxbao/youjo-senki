- id: ch04-b08-laeken-first-person-pov-narration-pronouns-and-tanya-guard-commander-dialogue
  source_term: Warrant Officer Laeken first-person narration pronouns for self, First Lieutenant Tanya Degurechaff, commissioned officers, returning soldiers, and green second lieutenants after space-break1 across p000161/p000163–p000168/p000170/p000172–p000173/p000175–p000176/p000178, polite dialogue pronouns between First Lieutenant Tanya Degurechaff and Warrant Officer Laeken in p000160/p000162/p000169/p000171/p000174/p000177, generic second-person omission in p000165/p000170/p000172, conditionals and modality in p000161/p000163/p000166/p000168/p000176, and absence of italicized emphasis across all 19 segments
  proposed_vi: sau ngắt cảnh (space-break1) tại p000160, mạch truyện chuyển từ góc nhìn của Tanya sang điểm nhìn ngôi thứ nhất của Chuẩn úy Laeken (chỉ huy đội cảnh vệ trực ban tại Học viện Chiến tranh Đế quốc), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác): trong toàn bộ các đoạn độc thoại kể chuyện ngôi thứ nhất của Chuẩn úy Laeken (p000161, p000163–p000168, p000170, p000172, p000173, p000175, p000176, p000178), người kể tự xưng nhất quán bằng đại từ “tôi” / “Tôi” kết hợp phản thân “mình” / “bản thân tôi” và quy chiếu Trung úy Tanya Degurechaff nhất quán bằng đại từ “cô ấy” / “Cô ấy” kết hợp các danh ngữ “Trung úy Degurechaff”, “cô bé nhỏ nhắn này”, “vị trung úy nhỏ bé nhưng lẫy lừng chiến công ấy”, “vị trung úy này”; quy chiếu các sĩ quan có quân hàm (p000163), những người lính trở về từ chiến trường (p000166), các thiếu úy non nớt (p000172, p000173) và các sĩ quan nói chung (p000176) bằng đại từ số nhiều “họ”; tại câu 2 p000165, vế sau câu 3 p000170 và câu 2 p000172, lược đại từ ngôi thứ hai phiếm chỉ trong cấu trúc khái quát theo đúng quy ước direct-address choice; trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn úy Laeken (p000160, p000162, p000169, p000171, p000174, p000177): Tanya gọi vị chuẩn úy lớn tuổi giàu kinh nghiệm là “ông Laeken” (p000160) / “ông” (p000174 — phản ánh đúng nhận xét của Laeken ở p000167 rằng cô luôn xưng hô đúng mực với các hạ sĩ quan, đồng thời giữ đúng danh xưng lịch sự của nguồn mà không tự thay bằng quân hàm) và tự xưng “tôi” kèm từ đáp lịch sự “Vâng” (p000169, p000174); Chuẩn úy Laeken tự xưng “tôi” / “Tôi” và gọi cấp trên là Trung úy Degurechaff bằng “Trung úy Degurechaff” / “Trung úy” / “cô” kèm tiểu từ kính ngữ “ạ” (p000162, p000171, p000177); bảo toàn chính xác câu hỏi tự vấn trong độc thoại của Laeken tại p000161, hai câu hỏi lễ phép hướng tới Tanya tại p000162 và p000177, các cấu trúc suy đoán và điều kiện giả định tại p000163, p000166, p000168, p000176, và tuân thủ tuyệt đối DEC-P01-002 (toàn bộ 19/19 đoạn không có thẻ nhấn mạnh trong nguồn nên hoàn toàn không dùng dấu `*...*`)
  alternatives_vi:
  - anh Laeken / Chuẩn úy Laeken (thay cho “ông Laeken” tại p000160 — ưu tiên “ông Laeken” để giữ đúng sắc thái kính trọng của một sĩ quan trẻ đối với vị chuẩn úy kỳ cựu mà không tự ý đổi danh xưng lịch sự thành quân hàm)
  - mình / cô (thay cho “tôi” / “cô ấy” trong lời kể độc thoại của Chuẩn úy Laeken — ưu tiên “tôi” và “cô ấy” để giữ đúng giọng tự sự ngôi thứ nhất chững chạc của Laeken và phân biệt rạch ròi với nội tâm của Tanya theo DEC-P01-001)
