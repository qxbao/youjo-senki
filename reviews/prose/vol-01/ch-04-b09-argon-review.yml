- id: ch04-b09-laeken-first-person-pov-continuity-sergeant-dialogue-and-emphasis
  source_term: Warrant Officer Laeken first-person narration pronouns for self, First Lieutenant Tanya Degurechaff, and the subordinate sergeant across p000180–p000181/p000183/p000185/p000187/p000189/p000192–p000193/p000195–p000196, polite dialogue pronouns between First Lieutenant Tanya Degurechaff and Warrant Officer Laeken in p000179/p000182/p000184, command and reprimand dialogue between Warrant Officer Laeken and his subordinate sergeant in p000186/p000188/p000190–p000191/p000194/p000197–p000199, inanimate reference to the main computation orb in p000196–p000197, generic second-person handling in p000189/p000193, conditionals in p000189/p000192/p000198, and exact preservation of italicized emphasis in p000199
  proposed_vi: tiếp nối trực tiếp lô ch-04-b08, toàn bộ lô ch-04-b09 được thuật lại từ điểm nhìn ngôi thứ nhất của Chuẩn úy Laeken (chỉ huy đội cảnh vệ trực ban tại Học viện Chiến tranh Đế quốc), tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang chủ thể khác): trong toàn bộ các đoạn độc thoại kể chuyện ngôi thứ nhất của Chuẩn úy Laeken (p000180, p000181, p000183, p000185, p000187, p000189, p000192, p000193, p000195, p000196), người kể tự xưng nhất quán bằng đại từ “tôi” / “Tôi” kết hợp phản thân “mình” và quy chiếu Trung úy Tanya Degurechaff nhất quán bằng đại từ “cô ấy” / “Cô ấy” kết hợp các danh ngữ “Trung úy Degurechaff”, “cô bé này”, “vị trung úy này”, “một vị sĩ quan như thế” (lưu ý từ “nó” trong p000196 và p000197 hoàn toàn chỉ quy chiếu danh từ bất động vật là quả cầu tính toán chính của Tanya); trong độc thoại của Laeken tại p000187, p000195, p000196, quy chiếu viên trung sĩ thuộc cấp vừa phát ngôn thiếu suy nghĩ bằng đại từ “Hắn” / “hắn” và danh ngữ “một tên ngốc”, “cái gã đần độn này”, “một tên đầu gỗ như thế này”, “một gã” để phản ánh đúng thái độ bực dọc của chỉ huy đội cảnh vệ; tại câu 3 p000189 và câu 3 p000193, lược đại từ ngôi thứ hai phiếm chỉ hoặc dùng chủ ngữ khái quát “người ta” theo đúng quy ước direct-address choice; trong đối thoại trực tiếp giữa Trung úy Tanya Degurechaff và Chuẩn úy Laeken (p000179, p000182, p000184), đồng bộ hoàn toàn với ch-04-b08: Tanya tự xưng “Tôi” / “tôi”, gọi Laeken là “ông” và dùng từ đáp lịch sự “Vâng... ạ” (p000179, p000184), còn Laeken tự xưng “tôi”, gọi Tanya là “cô” kèm tiểu từ kính ngữ “ạ” (p000182); trong đối thoại và độc thoại hướng tới viên trung sĩ thuộc cấp (p000186, p000188, p000190, p000191, p000194, p000197–p000199): Chuẩn úy Laeken gọi thuộc cấp bằng quân hàm “Trung sĩ” (p000190) và đại từ ngôi thứ hai “Cậu” / “cậu” (p000188, p000190, p000194, p000199), còn viên trung sĩ tự xưng “tôi” (p000191) và quy chiếu Tanya bằng “Con nhóc còn tè dầm” (khi chê bai sau lưng ở p000186, đối ứng trực tiếp với lời quát mắng của Laeken về “mùi nước tiểu” ở p000188) rồi chuyển sang “cô ấy” sau khi bị chỉnh đốn (p000191, p000197); bảo toàn chính xác các câu hỏi và cấu trúc điều kiện/giả định tại p000181, p000188–p000190, p000192, p000198, p000199, và bảo toàn tuyệt đối chính xác duy nhất 1 vị trí nhấn mạnh Markdown `*...*` tại p000199 (`*…Khổ thật, cậu vẫn chỉ nghĩ về cô ấy được có bấy nhiêu thôi sao…?*`) theo đúng DEC-P01-002 (20/21 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)
  alternatives_vi:
  - Anh / anh (thay cho “Cậu” / “cậu” khi Chuẩn úy Laeken gọi viên trung sĩ thuộc cấp tại p000188, p000190, p000194, p000199 — ưu tiên “Cậu” / “cậu” để phản ánh khoảng cách tuổi tác, kinh nghiệm và giọng chỉnh đốn nghiêm khắc của vị chuẩn úy kỳ cựu đối với cấp dưới)
  - Anh ta / anh ta (thay cho “Hắn” / “hắn” trong độc thoại của Laeken về viên trung sĩ tại p000187 — ưu tiên “Hắn” / “hắn” để khớp với sắc thái bực dọc đi kèm các danh ngữ “một tên ngốc”, “cái gã đần độn này”, “một tên đầu gỗ”)
