  proposed_vi: Tanya / ống nhòm / phân bón / biến sự sống hữu cơ thành thì quá khứ / Hỏa lực tập trung / pháo 120 mm / Amen / Thiếu úy / quan sát viên / pháo binh / bắn hiệu lực / trường phái kinh tế Chicago / kinh tế học / sự dư thừa / chi phí / Đại đội Pháp sư Xung kích số 205 / Trung úy Schwarkopf / phát bắn hiệu chỉnh / vị trí xuất kích / màn pháo kích triệt để / bắn trả / cuộc đấu pháo / hỏa lực áp chế / vị trí tiền tiêu / Pháo binh cấp quân đoàn / đạn 120 mm / đám tàn quân sống sót / Thiếu úy Tanya Degurechaff / bộ binh địch / súng trường đã nạp đạn gắn thuật thức / quả cầu tính toán / đợt xung kích / những người lính kỳ cựu dày dạn kinh nghiệm / chiến hào / Being X / kén ăn / Chỉ huy Schwarkopf / diện tích bề mặt / Degurechaff / kiểm soát sự căng thẳng trước giờ xung kích / mặt trận Rhine / Đài kiểm soát / Thiếu úy Degurechaff / Chúa / vị trí xung kích / màn chắn bảo hộ / lớp vỏ phòng thủ / vũ khí hạng nặng
