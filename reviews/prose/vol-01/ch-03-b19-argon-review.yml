- id: ch03-b19-tanya-battlefield-pov-return-schwarkopf-banter-pronouns-and-zero-emphasis
  source_term: tanya_battlefield_pov_return_schwarkopf_banter_pronouns_and_zero_emphasis_ch03_b19
  proposed_vi: 'sau khoảng ngắt cảnh (class="space-break1") tại p000391 khép lại đoạn tự sự ngôi thứ nhất của Visha ở ch-03-b17–b18, toàn bộ 25 đoạn của lô ch-03-b19 (chapter007.xhtml/p000391–p000415) quay trở lại hiện trường tác chiến trên mặt trận Rhine dưới góc nhìn trần thuật ngôi thứ ba và độc thoại nội tâm xoay quanh Thiếu úy Tanya Degurechaff cùng chỉ huy Đại đội 205 là Trung úy Ihlen Schwarkopf ngay trước và trong thời khắc phát động xung kích, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md: (1) Trong trần thuật ngôi thứ ba và độc thoại nội tâm gắn với điểm nhìn của Tanya (p000391, p000394–p000396, p000399, p000401, p000404, p000405), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” / “Thiếu úy Tanya Degurechaff” / “Degurechaff” (p000391, p000399, p000401, p000404, p000409) và đại từ ngôi thứ ba “nó” kết hợp phản thân “mình” tại p000405 theo đúng DEC-P01-001 (tuyệt đối không dùng đại từ “cô” trong trần thuật hay nội tâm của Tanya); bảo toàn tự nhiên sự hòa trộn giữa lời kể ngôi thứ ba và nhận định chiến thuật ngôi thứ nhất số nhiều của phe Đế quốc/đại đội bằng “của quân ta” (p000396) và “chúng ta” / “phe mình” (p000399). (2) Trong các đoạn trần thuật ngôi thứ ba xoay quanh Trung úy Ihlen Schwarkopf và Đại đội Pháp sư Xung kích số 205 (p000395, p000399, p000402, p000404, p000409–p000411, p000413–p000415), quy chiếu Schwarkopf nhất quán bằng “Trung úy Schwarkopf” / “Schwarkopf” / “vị trung úy” và đại từ ngôi thứ ba “anh” / “Anh” kết hợp phản thân “mình” (p000410, p000411, p000413 — đồng bộ hoàn toàn với ch-03-b11–b15); quy chiếu các pháp sư và binh sĩ pháo binh bằng “họ” / “Họ” kết hợp phản thân “mình” (p000393, p000395, p000402, p000410, p000415). (3) Tại các cấu trúc có đại từ ngôi thứ hai phiếm chỉ trong nguồn (câu 1 p000405, câu 2 p000409), chuyển thành chủ ngữ khái quát “người ta” (p000405) hoặc lược chủ ngữ (“Chẳng cần phải nhìn lại lịch sử cũng biết rằng...” tại p000409) theo đúng quy ước direct-address choice (pending-terms.yml). (4) Trong hội thoại quân ngũ giữa Trung úy Schwarkopf, Thiếu úy Tanya Degurechaff và toàn Đại đội 205: Tanya (p000392, p000398, p000407) tự xưng “tôi”, gọi cấp trên trực tiếp là “thưa ngài” (p000392) và “Thưa Chỉ huy Schwarkopf” (p000407 — đồng bộ ch-03-b11 p000235) đi kèm tiểu từ kính ngữ “ạ” (p000398, p000407); Schwarkopf khi đối đáp với Tanya (p000393, p000406, p000408) tự xưng “tôi” (p000408) và gọi Tanya là “Thiếu úy” / “cô” / “Cô”, còn khi nói với toàn đại đội (p000397, p000400, p000412, p000413) dùng “Chúng ta” / “của ta” / “tất cả mọi người” / “Theo tôi!” và gọi Tanya là “Thiếu úy Degurechaff”; tại câu cảm thán trước giờ xuất kích không gắn nhãn người nói trực tiếp ở p000403, dịch trung tính không thêm đại từ nhân xưng (“Bắt tay vào việc thôi. Giá mà lần nào cũng vui thế này thì tốt biết mấy!”) để giữ trọn độ mở của nguyên tác. (5) Bảo toàn nguyên vẹn các dấu gạch ngang dài giải thích/chêm câu (p000391, p000395, p000399, p000404), dấu chấm lửng mở đầu lời thoại (p000408), cùng chính xác thời gian, phủ định và mức độ chắc chắn của các mệnh đề điều kiện và giả định (điều kiện “chừng nào...”, phủ định “không phải ngoại lệ” và “không phát sinh thêm chi phí nào” ở p000394; suy luận “Hẳn...” ở p000393, p000395; giả định thông thường đối lập với thực tế “Thông thường sẽ có nguy cơ... nhưng xem chừng...” ở p000396; câu ước giả định trái thực tế “Giá mà... thì tốt biết mấy!” ở p000403; giới hạn tương đối và phủ định động cơ ở p000404; câu điều kiện giả định “Nếu hỏi liệu nó có coi mình là hạnh phúc hay không, người ta sẽ hiểu rõ...” và phủ định kép “chẳng có gì sai” ở p000405; câu cảnh báo “đừng có... kẻo...” ở p000406; mệnh đề nhượng bộ “có thể là... nhưng ngay cả họ vẫn...” ở p000410; phủ định khả thể “chỉ vài phát đạn chẳng thể nào hạ gục được họ” ở p000415). (6) Hoàn toàn không sử dụng dấu nhấn mạnh Markdown `*...*` ở bất kỳ đoạn nào trong toàn bộ 25/25 đoạn do `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` theo đúng DEC-P01-002'
  alternatives_vi:
  - của chúng ta (thay cho “của quân ta” ở cuối p000396 — cả hai đều tự nhiên và giữ đúng ngôi thứ nhất số nhiều chỉ phe Đế quốc trên chiến trường)
