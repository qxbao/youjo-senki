  rationale: "Kế thừa đồng bộ hệ thống danh xưng và thuật ngữ đã khóa tạm từ Chương 0–2 và ch-03-b01 → ch-03-b18: “Tanya” / “Thiếu úy Tanya Degurechaff” / “Thiếu úy Degurechaff” / “Degurechaff” / “Thiếu úy” (b02-second-lieutenant, ch-03-b11–b18), “Trung úy Schwarkopf” / “Chỉ huy Schwarkopf” / “Schwarkopf” (ch-03-b11 p000233–p000235, ch-03-b16 p000348, ch-03-b18 p000375), “Đại đội Pháp sư Xung kích số 205” (ch-03-b11 p000224, p000233, ch-03-b12 p000244, ch-03-b14 p000292, ch-03-b16 p000347), “ống nhòm” (ch-01-b05 p000067), “Hỏa lực tập trung” (ch-01-b08 p000139, p000141), “quan sát viên” (chapter1_b01_pending_terms, ch-03-b18 p000380), “pháo binh” / “Pháo binh cấp quân đoàn” (ch-01-b01), cặp thuật ngữ tác xạ pháo binh “phát bắn hiệu chỉnh” (b02-calibration-fire) và “bắn hiệu lực” (b02-fire-for-effect), “trường phái kinh tế Chicago” (P03-Chicago-school), “hỏa lực áp chế” (b05-suppressive-fire, ch-03-b18 p000372), “vị trí tiền tiêu” (ch-03-b15 p000305), “bộ binh”, “súng trường đã nạp đạn gắn thuật thức” (P01-formulas, ch-01-b12 p000208), “quả cầu tính toán” (chapter1_b01_pending_terms), “những người lính kỳ cựu dày dạn kinh nghiệm” (ch-01-b06, ch-03-b12–b18; tránh dùng “cựu binh” cho quân nhân đang tại ngũ), “chiến hào” (ch-03-b14–b18), “Being X” (P05-being-x), “mặt trận Rhine” (ch-03-b01, ch-03-b17), “Đài kiểm soát” (P01-norden-control, ch-02-b01 p000015), “Chúa” (P06-lord / review-God), cùng cặp thuật ngữ phòng ngự ma đạo “màn chắn bảo hộ” và “lớp vỏ phòng thủ” (ch-01-b14 p000258, ch-03-b02 p000025); khóa tạm ẩn dụ “phân bón” và “biến sự sống hữu cơ thành thì quá khứ” (p000391), “pháo 120 mm” / “đạn 120 mm” (p000392, p000397), “sự dư thừa” và “chi phí” (p000394), “vị trí xuất kích”, “màn pháo kích triệt để” và “cuộc đấu pháo” (p000396), “đám tàn quân sống sót” (p000397), “kén ăn” và “diện tích bề mặt” (p000406–p000408, p000412), “kiểm soát sự căng thẳng trước giờ xung kích” (p000409), “vị trí xung kích” (p000414) và “vũ khí hạng nặng” (p000415)."
