  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md khi chuyển điểm nhìn từ tự sự ngôi thứ nhất của Visha ở ch-03-b18 về lại trần thuật ngôi thứ ba và độc thoại nội tâm gắn với Tanya trên chiến trường: dùng “Tanya” / “nó” / “mình” (tuyệt đối không dùng “cô” trong trần thuật/nội tâm), dùng “anh” cho Trung úy Schwarkopf, giữ hệ xưng hô điều lệnh “tôi – thưa ngài / Thưa Chỉ huy Schwarkopf... ạ” và “tôi – Thiếu úy / cô”, xử lý đại từ ngôi thứ hai phiếm chỉ theo direct-address choice tại p000405 và p000409, bảo toàn đầy đủ các giả định/phủ định và không dùng dấu `*...*` ở cả 25/25 đoạn."
