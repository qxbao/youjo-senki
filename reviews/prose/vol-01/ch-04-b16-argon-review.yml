- id: ch04-b16-zettour-pov-shift-pronouns-conditionals-and-emphasis
  source_term: zettour_pov_shift_pronouns_conditionals_and_emphasis_ch04_b16
  proposed_vi: 'sau dấu ngắt trang ở p000102, toàn bộ lô ch-04-b16 (chapter009b.xhtml/p000102–p000121) chuyển bối cảnh và điểm nhìn từ Tanya tại thư viện Học viện Chiến tranh Đế quốc (ch-04-b10–b15) sang trần thuật ngôi thứ ba xoay quanh Chuẩn tướng von Zettour và các sĩ quan dưới quyền tại Văn phòng Bộ Tổng Tham mưu, tuân thủ nghiêm ngặt giới hạn của DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không mở rộng sang điểm nhìn của chủ thể khác) và DEC-P01-002: quy chiếu Chuẩn tướng von Zettour nhất quán bằng tên riêng “Zettour” / “Chuẩn tướng von Zettour”, danh ngữ “vị sĩ quan cấp trên” / “vị chuẩn tướng” và đại từ trần thuật ngôi thứ ba trang trọng “ông” / “Ông” kết hợp phản thân “mình” / “bản thân” (p000104–p000106, p000108, p000110, p000114, p000116–p000121 — đồng bộ ch-01-b19/b20 và ch-04-b04/b05/b11/b12); khi Zettour hồi tưởng và suy ngẫm về Trung úy Tanya Degurechaff cùng những đề xuất chiến lược của cô (p000117, p000118, p000120, p000121), quy chiếu Tanya từ góc nhìn của Zettour bằng danh xưng “Trung úy Degurechaff” (p000120) và đại từ ngôi thứ ba “cô” / “Cô” (đồng bộ hoàn toàn với góc nhìn của Zettour và hội đồng tuyển sinh ở ch-04-b04 p000066–p000068; lưu ý từ “nó” ở p000113 chỉ quy chiếu danh từ bất động vật “kỳ nghỉ phép”, và từ “nó” ở cuối câu 4 p000121 chỉ quy chiếu cái “điều gì đó”); quy chiếu các binh lính Đế quốc, các sĩ quan tham mưu dưới quyền Zettour, các sĩ quan cấp tá, cũng như cặp Zettour và Rudersdorf (ở câu cuối p000121) bằng đại từ số nhiều “bọn họ” / “họ” kết hợp phản thân “mình” / “bản thân họ” (p000107, p000108, p000111–p000114, p000116, p000121); tại câu 3 p000105, lược đại từ ngôi thứ hai phiếm chỉ theo đúng quy ước direct-address choice; trong câu gọi hỏi trực tiếp của các sĩ quan cấp tá tại p000115, giữ cách gọi cấp tướng kèm họ “Tướng von Zettour?” (đồng bộ cấu trúc “Tướng von Rudersdorf” tại ch-01-b19 p000042); bảo toàn đầy đủ câu hỏi tu từ ở cuối câu 2 p000112, câu gọi hỏi trực tiếp ở p000115, câu hỏi nội tâm của Zettour ở câu 2 p000120, cùng các mệnh đề giả định và điều kiện (giả định về hiệu quả của mô thức hiện hữu ở p000105; khả thể ở p000106 và p000118; điều kiện “miễn là” ở p000108; mệnh đề nhượng bộ giả định sau dấu gạch ngang dài ở p000119; giả định “Bất kỳ ai khác nghe thấy điều đó hẳn sẽ bảo cô bị ảo tưởng” ở p000121); bảo toàn chính xác duy nhất 1 vị trí nhấn mạnh Markdown `*...*` bao trọn câu châm ngôn mở đầu tại p000103 tương ứng với thẻ `<html:em>` duy nhất trong `xhtml` nguồn của lô theo đúng DEC-P01-002 (19/20 đoạn còn lại không có thẻ nhấn mạnh trong nguồn nên không dùng `*...*`)'
  alternatives_vi:
  - người ta (thay cho cách lược đại từ ngôi thứ hai phiếm chỉ tại câu 3 p000105 — cả hai cách đều thuộc quy ước direct-address choice; ưu tiên lược chủ ngữ “Có thể gọi đó là...” để câu văn nghị luận tự nhiên, mạch lạc)
