  rationale: "Kế thừa đồng bộ “THỦ ĐÔ ĐẾ QUỐC” (ch-01-b15 p000275, ch-03-b11 p000221, p000102), “PHÓ CỤC TRƯỞNG CỤC QUÂN VỤ” (ch-04-b11 p000233–p000234, ch-04-b14 p000059, p000102), “BỘ TỔNG THAM MƯU” / “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms, p000102, p000109, p000120), “Văn phòng Bộ Tổng Tham mưu” (ch-01-b15 p000275, ch-01-b19 p000031, ch-04-b11 p000233, p000110, p000118), “các sĩ quan Bộ Tổng Tham mưu” (ch-03-b08 p000147, p000112), “Chuẩn tướng von Zettour” / “Tướng von Zettour” / “Zettour” (ch-01-b19/b20, ch-04-b01/b04/b11, p000104, p000105, p000107, p000109, p000115, p000120, p000121), “quân nhân” và “học giả” (ch-01-b19 p000034, ch-04-b11 p000222, p000104), “mô thức” (P03-paradigm-shift / ch-00-b03 p000043, p000105), “chiến lược quốc phòng” (ch-01-b20 p000061, p000105), “Đế quốc” (p000105) và “Quân đội Đế quốc” (b06-imperial-army / ch-01-b15, ch-04-b04, p000107, p000108), “khuynh hướng học thuật” (ch-04-b01 p000011, p000108), “mặt trận phía bắc” (ch-03-b02 p000034, p000111), “sĩ quan cấp trên” và danh từ chung “chuẩn tướng” viết thường (ch-04-b11/b12, p000114), “học viện chiến tranh” (ch-04-b01/b04/b11, p000114), “Các sĩ quan cấp tá” (vol02-ch03-b06-field-officer / ch-04-b04 p000059, p000116), “nội tuyến” (vol02-ch02-b05-interior-lines / ch-01-b19 p000043, ch-03-b03 p000044, p000118), “Chuẩn tướng von Rudersdorf” / “Rudersdorf” (ch-01-b19 p000033, ch-04-b02 p000027, p000120, p000121), “Trung úy Degurechaff” (ch-04-b04 p000066, ch-04-b10 p000219, p000120), “chiến tranh thế giới” (ch-04-b12 p000016–p000021, p000121), “chiến tranh tổng lực” (ch-04-b14 p000077, ch-04-b15 p000079, p000121), “ảo tưởng” (P05-delusion, p000121), “Liên bang” và “Khối Thịnh vượng chung” (ch-01-b03 p000034, ch-03-b02 p000034, ch-04-b13 p000031, p000121); khóa tạm “các nguyên lý chiến lược” (p000104), “ngọn đèn dẫn lối” (p000106), “kẻ dị đoan” (p000107), “các sĩ quan tham mưu” và “cuốn sách triết học” (p000110, p000112), “mặt trận phía tây” (p000111), “quán bia” (p000112), “ngoại tuyến” (đối lập trực tiếp với “nội tuyến” tại p000118) và “một sự thật bất tiện” (p000119)."
