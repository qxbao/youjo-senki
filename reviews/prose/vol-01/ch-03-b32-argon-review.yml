  volume: vol-01
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ quân sự, phiên hiệu đơn vị và khẩu lệnh vô tuyến đã khóa tạm ở các lô trước của chương 3 (đặc biệt là cảnh giao chiến gốc ở ch-03-b26, b27, b28 được phát lại qua băng ghi hình trong lô này): “Quân đội Cộng hòa” (ch-03-b31 p000219: p000223), “ưu thế quân số” (ch-03-b28 p000150, ch-03-b29 p000164: p000223, p000227), “Named” và “Pháp sư Định danh” (ch-03-b27 p000125, p000127, p000128: p000223, p000226, p000229, p000252), “Quân đội Đế quốc” (b06-imperial-army: p000226, p000250), “Liên minh Entente” (ch-03-b29 p000159: p000226), “chế áp”, “các quan sát viên của địch” và “đánh chặn” (ch-03-b23 p000002, p000003, ch-03-b26 p000101: p000228), “Bộ Tổng Tham mưu” (pending-terms-index.yml vol-01: p000230), “quả cầu tính toán” (chapter1_b01_pending_terms, ch-03-b27 p000109: p000231, p000232, p000250), “Mayday, Mayday, Mayday!” (ch-03-b26 p000087: p000236), “Tản ra! Tản ra!” (ch-03-b26 p000089: p000238), “pháp sư không quân” (ch-03-b26 p000095, ch-03-b31 p000215: p000224, p000239, p000246), “bắn tỉa” (ch-03-b25 p000046, ch-03-b28 p000138: p000240), “các động tác cơ động né tránh bất quy tắc” (ch-03-b28 p000142: p000241), “Sean?!” (ch-03-b26 p000091: p000242), “Mục tiêu địch!” và “Angels 12” (ch-03-b26 p000092, p000093: p000244, p000245), “mười hai nghìn feet” / “mười hai nghìn” (ch-03-b26 p000094, ch-03-b27 p000110, p000132: p000246, p000248), “máy bay tiêm kích” (ch-03-b26 p000096: p000249); đồng thời khóa tạm các phiên hiệu và thuật ngữ phân tích dữ liệu phát sinh trong lô: “Đại đội Pháp sư Trinh sát 106 và 107”, “Lữ đoàn Ma đạo 42” và “Sư đoàn Pháp sư Không quân số 4” (p000224, p000225), “Hội đồng chiến thuật” (p000225), “nhật ký dữ liệu” và “các thiết bị ghi hình” (p000231, p000232, p000240), “Việc thẩm vấn thu thập thông tin từ những người sống sót” (p000233), “Sĩ quan điều phối tác chiến tiền phương” (p000237), “kỹ thuật xử lý quang học” và “khẩu súng trường trang bị tiêu chuẩn của Quân đội Đế quốc” (p000250)."
