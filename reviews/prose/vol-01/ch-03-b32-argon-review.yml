locked_choices:
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000223
  locks:
  - "Giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa sau ngắt cảnh, các thuật ngữ “Quân đội Cộng hòa”, “ưu thế quân số”, “các Named”, “lực lượng tinh nhuệ của Đế quốc”, “giá trị chiến lược”, cùng đại từ ngôi thứ ba số nhiều “họ” / “những người này”."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000224
  locks:
  - "Giữ hệ thống phiên hiệu đơn vị Cộng hòa “Đại đội Pháp sư Trinh sát 106 và 107”, “Lữ đoàn Ma đạo 42”, “Sư đoàn Pháp sư Không quân số 4”, và mệnh đề giới hạn thời gian ở câu 2 (“Ít nhất là cho đến gần đây.”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000225
  locks:
  - "Giữ lời tuyên bố khai mạc cuộc họp trang trọng với các cụm “Hội đồng chiến thuật” và “Đại đội Pháp sư Trinh sát 106 và 107”: ““Hội đồng chiến thuật về vụ Đại đội Pháp sư Trinh sát 106 và 107 bị xóa sổ gần đây xin được bắt đầu.””."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000226
  locks:
  - "Giữ các thuật ngữ “Cộng hòa”, “các đơn vị ma đạo”, “Quân đội Đế quốc”, “các Named”, “tiền tuyến”, “Liên minh Entente”, và bảo toàn quan hệ nhân quả kết hợp giả định trái thực tế trong quá khứ (“nên lẽ ra các Named của họ cùng những đội quân tinh nhuệ không kém không thể nào bị xóa sổ sạch như thế được”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000227
  locks:
  - "Giữ sự tương phản ở câu 1, dấu gạch ngang dài và cụm “lợi thế áp đảo về quân số” cùng “một pháp sư duy nhất” ở câu 2 (trong đó “Nó” chỉ quy chiếu sự việc “chuyện đó”), phủ định tuyệt đối ở câu 3 (“không một ai tin nổi vào tai mình”) và tình thái suy đoán ở câu 4 (“hẳn phải có sự nhầm lẫn nào đó”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000228
  locks:
  - "Giữ lời báo cáo diễn biến trận đánh với các thuật ngữ “Đại đội 106 và 107”, “chế áp các quan sát viên của địch”, “một đơn vị pháp sư địch” và “đánh chặn” đồng bộ với ch-03-b23/b26."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000229
  locks:
  - "Giữ thuật ngữ “các đơn vị Named”, quan hệ nguyên nhân ở câu 1–2, cùng mệnh đề nhượng bộ kết hợp điều kiện và khả thể ở câu 3 (“Dù tin tức này khó tin đến đâu đi nữa, nếu một đơn vị kém hơn về quân số đã gây ra thiệt hại nặng nề cho họ, rất có khả năng việc đó sẽ kéo theo hệ lụy cho toàn bộ cuộc chiến.”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000230
  locks:
  - "Giữ thuật ngữ “Bộ Tổng Tham mưu” và cấu trúc nhận định nguyên nhân – hệ quả (“Chẳng trách các thành viên cấp cao của Bộ Tổng Tham mưu, những người hiểu rõ sự thật đó, lại mang vẻ mặt tối sầm đến vậy.”)."
- segment_id: YS-LN01/Text/chapter007b.xhtml/p000231
  locks:
