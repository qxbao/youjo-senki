  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md xuyên suốt 30 đoạn của ch-03-b32: giữ điểm nhìn trần thuật ngôi thứ ba bên phía Cộng hòa và quy chiếu trung tính đối với pháp sư Đế quốc chưa rõ diện mạo, đồng bộ hoàn toàn các đoạn thoại phát lại với ch-03-b26, bảo toàn mọi cấu trúc giả định trái thực tế và điều kiện, đồng thời chỉ dùng dấu nhấn mạnh `*muốn*` tại đúng 1 đoạn có `<html:em>` là p000234."
