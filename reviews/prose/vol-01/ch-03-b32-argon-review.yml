- id: ch03-b32-republican-general-staff-pov-neutral-enemy-reference-and-emphasis
  source_term: republican_general_staff_pov_neutral_enemy_reference_and_emphasis_ch03_b32
  proposed_vi: "Toàn bộ 30 đoạn của lô ch-03-b32 (chapter007b.xhtml/p000223–p000252) mở ra một phân cảnh mới sau dấu ngắt cảnh (`class=\"space-break1\"` ở p000223), chuyển hoàn toàn sang góc nhìn trần thuật ngôi thứ ba bên phía Quân đội Cộng hòa và Hội đồng chiến thuật của Bộ Tổng Tham mưu Cộng hòa khi phân tích nhật ký dữ liệu quả cầu tính toán, lời kể của những người sống sót và đoạn băng ghi hình vụ xóa sổ Đại đội Pháp sư Trinh sát 106 và 107, tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và canon/style-guide.md: (1) Tuân thủ giới hạn chủ thể và ngữ cảnh của DEC-P01-001: vì Tanya không phải là chủ thể điểm nhìn của phân cảnh này và phía Cộng hòa khi xem đoạn băng ghi hình từ khoảng cách xa chỉ nhận diện được một bóng dáng nhỏ bé mà chưa biết danh tính hay giới tính của đối phương, bản dịch quy chiếu pháp sư Đế quốc một cách trung tính tuyệt đối là “một pháp sư duy nhất” (p000227), “một đơn vị pháp sư địch” (p000228), “một pháp sư Đế quốc” (p000246), “đối thủ của họ” / “một pháp sư” (p000249), “người lính địch” / “pháp sư đó” / “kẻ thống trị bầu trời” (p000251), “một Pháp sư Định danh” / “một Named mới” / “mối đe dọa khôn lường này” (p000252), hoàn toàn không dùng đại từ “nó” (chỉ dùng cho trần thuật theo điểm nhìn Tanya) hay đại từ chỉ giới tính “cô” / “hắn”; riêng từ “Nó” ở đầu câu 2 p000227 và câu 3 p000248 chỉ quy chiếu sự việc (“chuyện đó”) và con số (“Con số mười hai nghìn”). (2) Giữ chuẩn xác đại từ và thanh điệu trong cuộc họp chiến thuật và trong đoạn băng phát lại: sĩ quan thuyết trình báo cáo trước hội đồng tự xưng “tôi” và gọi cử tọa là “mọi người” (p000231, p000235) với văn phong báo cáo quân sự trang trọng; sĩ quan điều phối tác chiến tiền phương trong báo cáo được quy chiếu ngôi thứ ba là “anh ta” (p000237); các đoạn âm thanh phát lại từ băng ghi hình (p000236, p000238, p000242, p000244, p000245) giữ nguyên khẩu lệnh khẩn trương và đồng bộ tuyệt đối với cảnh gốc tại ch-03-b26 (p000087, p000089, p000091–p000093); lời thốt lên bàng hoàng vô danh trong phòng họp ở p000247 giữ đúng dấu chấm lửng bỏ lửng và câu phủ định ngắn gọn (““Cái quái gì… Không thể nào.””). (3) Bảo toàn trọn vẹn quan hệ nhân quả, phủ định, câu hỏi gián tiếp và đặc biệt là chuỗi cấu trúc giả định trái thực tế trong quá khứ / điều kiện khả thể theo đúng canon/style-guide.md: giả định trái thực tế trong quá khứ ở p000226 (“nên lẽ ra... không thể nào bị xóa sổ sạch như thế được”), dấu gạch ngang dài, phủ định tuyệt đối và suy đoán ở p000227, mệnh đề nhượng bộ kết hợp điều kiện và khả thể ở p000229 (“Dù tin tức này khó tin đến đâu đi nữa, nếu..., rất có khả năng việc đó sẽ kéo theo hệ lụy cho toàn bộ cuộc chiến”), hai câu giả định trái thực tế liên tiếp ở p000234 (“Nếu thông tin đó không được nghe trực tiếp..., hẳn sẽ rất khó mà tin nổi. Không, họ sẽ chẳng *muốn* tin vào điều đó.”), giả định trái thực tế ở câu 3 p000237 (“Nếu đó là một tân binh thì có lẽ chuyện này còn đáng buồn cười, đằng này anh ta lại là một cựu binh dày dạn”), điều kiện hệ quả ở câu 4 p000246 (“Nếu điều đó là sự thật, toàn bộ các pháp sư không quân của họ coi như sẽ trở nên bất lực”), câu hỏi gián tiếp kết hợp khẳng định chắc chắn ở p000249, cùng cấu trúc phủ định tăng tiến “thậm chí còn chẳng biết..., huống hồ là...” ở câu cuối p000252. (4) Tuân thủ nghiêm ngặt DEC-P01-002 về nhấn mạnh Markdown: chỉ duy nhất 1/30 đoạn nguồn có thẻ `<html:em>` là p000234 (`<html:em>wanted</html:em>`), được bảo toàn chính xác thành `*muốn*` (“Không, họ sẽ chẳng *muốn* tin vào điều đó.”); toàn bộ 29/30 đoạn còn lại không có nhấn mạnh trong XHTML nguồn và hoàn toàn không dùng dấu `*...*`."
  alternatives_vi:
  - "không có (việc giữ quy chiếu trung tính “người lính địch / pháp sư đó” ở p000251 theo đúng giới hạn của DEC-P01-001, đồng bộ các câu thoại phát lại ở p000236, p000238, p000242, p000244, p000245 với ch-03-b26, và chỉ đánh dấu nhấn mạnh `*muốn*` tại đúng 1 vị trí có `<html:em>` ở p000234 theo DEC-P01-002 là phương án chuẩn xác và nhất quán nhất)"
