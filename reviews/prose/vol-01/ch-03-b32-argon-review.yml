- id: ch03-b32-republican-tactical-council-unit-designations-and-orb-log-analysis-terms
  source_term: republican_tactical_council_unit_designations_and_orb_log_analysis_terms_ch03_b32
  proposed_vi: "Quân đội Cộng hòa / ưu thế quân số / Named / lực lượng tinh nhuệ của Đế quốc / Đại đội Pháp sư Trinh sát 106 và 107 / Lữ đoàn Ma đạo 42 / Sư đoàn Pháp sư Không quân số 4 / Hội đồng chiến thuật / Cộng hòa / các đơn vị ma đạo / Quân đội Đế quốc / tiền tuyến / Liên minh Entente / Đại đội 106 và 107 / chế áp / các quan sát viên của địch / đơn vị pháp sư địch / đánh chặn / các đơn vị Named / Bộ Tổng Tham mưu / nhật ký dữ liệu / các quả cầu tính toán / các sĩ quan ma đạo / các thiết bị ghi hình / Việc thẩm vấn thu thập thông tin từ những người sống sót / Mayday / tín hiệu cấp cứu khẩn cấp / Sĩ quan điều phối tác chiến tiền phương / tân binh / cựu binh dày dạn / Đại đội 106 / Tản ra! Tản ra! / Các sĩ quan pháp sư không quân / bắn tỉa / các động tác cơ động né tránh bất quy tắc / Sean / Mục tiêu địch! / Angels 12 / mười hai nghìn feet / pháp sư Đế quốc / các pháp sư không quân / máy bay tiêm kích / kỹ thuật xử lý quang học / khẩu súng trường trang bị tiêu chuẩn của Quân đội Đế quốc / quả cầu tính toán chưa từng được biết tới / kẻ thống trị bầu trời / Pháp sư Định danh"
  alternatives_vi:
  - "Lữ đoàn Pháp sư 42 / Sư đoàn Pháp sư Trên không thứ Tư (thay cho “Lữ đoàn Ma đạo 42” và “Sư đoàn Pháp sư Không quân số 4” tại p000224 — ưu tiên “Lữ đoàn Ma đạo 42” và “Sư đoàn Pháp sư Không quân số 4” để phân biệt rõ hai tính từ chỉ binh chủng trong cùng danh ngữ và đồng bộ với “pháp sư không quân” ở ch-03-b26, b27, b31) / Cuộc họp chiến thuật (thay cho “Hội đồng chiến thuật” tại p000225 — ưu tiên “Hội đồng chiến thuật” vì mang sắc thái trang trọng của phiên họp phân tích cấp Bộ Tổng Tham mưu) / Nhân viên kiểm soát tác chiến tiền phương (thay cho “Sĩ quan điều phối tác chiến tiền phương” tại p000237 — cả hai đều hợp lệ và hô ứng với p000088 ở ch-03-b26, khóa tạm “Sĩ quan điều phối tác chiến tiền phương” tại p000237) / Pháp sư Đăng ký (thay cho “Pháp sư Định danh” tại p000252 — ưu tiên “Pháp sư Định danh” để đồng bộ trực tiếp với ch-03-b27 p000125, p000128)"
