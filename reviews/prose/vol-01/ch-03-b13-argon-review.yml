  rationale: "Kế thừa đồng bộ “mặt trận phía tây” (ch-03-b12 p000243, ch-04-b16 p000111), “Lực lượng dự bị” / “quân dự bị” (ch-01-b09 p000151, p000155, ch-03-b02 p000035), “quân thường trực” (đồng bộ với “đạo quân thường trực” ở ch-03-b03 p000045), “Bộ Tổng Tham mưu” (chapter1_b01_pending_terms), “Norden”, “kế hoạch quốc phòng” (ch-01-b20 p000058, ch-04-b14 p000063), “Cụm tập đoàn quân phương Tây” (ch-03-b01 p000010, ch-03-b10 p000188, ch-03-b12 p000261), “Central” (b05-central-command, ch-03-b12 p000240, p000261), “sư đoàn” (ch-01-b03 p000040), “đội tiên phong” (ch-03-b04 p000052, ch-04-b10 p000216), “Đại Quân” (ch-01-b03 p000040, ch-03-b12 p000260), “cầm chân quân địch” (đồng bộ với “cầm chân kẻ địch” ở ch-03-b12 p000261), “quân tiếp viện” (ch-03-b12 p000261), “cấp trên” (ch-03-b11 p000226, p000238, ch-03-b12 p000240), “đơn vị huấn luyện” (b05-instructor-unit, ch-03-b11 p000225, ch-03-b12 p000240), “Type 95”, “phòng thí nghiệm” (ch-03-b04 p000054, ch-03-b08), “Tanya”, “kế hoạch phòng thủ” (ch-03-b02 p000034), “Đế quốc”, “tái tổ chức” (ch-03-b12 p000260), “góc độ quân sự” (vol04-ch04-b01), “tập kết” (ch-03-b12 p000260), “tiền tuyến”, “những người lính Đế quốc” (ch-03-b10 p000190), “Schwarkopf”, “Bộ chỉ huy” (ch-01-b06 p000083), “hệ thống chỉ huy” (ch02-b16-field-hospital-chain-of-command-and-type-95-mana-supply-terms), “vật tư tiếp tế” (ch-03-b04 p000051), “giọng điệu điềm nhiên, đậm chất công vụ” (P01-matter-of-fact-register, ch-03-b12 p000249), “tác chiến trì hoãn” (ch-03-b02 p000034, ch-04-b09 p000192), “phòng ngự cơ động” / “chiến lược phòng ngự cơ động” (ch04-b15-attritional-containment-doctrine-penetrating-raids-and-battalion-proposal-terms, ch-04-b15 p000088), “tuyến sau” (ch-01-b02 p000027, ch-03-b10 p000214), “phòng ngự có chiều sâu” (vol04-ch03-b02), “Thiếu úy” (b02-second-lieutenant), “Chiến lược nội tuyến” (ch-03-b03 p000044, ch-03-b12 p000261) và “phòng tuyến” (ch-01-b20 p000060, ch-04-b15 p000079); khóa tạm “đòn phản kích” (p000263), “lệnh động viên”, “sư đoàn Cận vệ Đế quốc” và “quân chính quy” (p000265), “trận chiến phòng ngự” và “kháng cự trên quy mô lớn” (p000267), “bí mật quân sự” (p000269), “cục diện chiến sự” và “bảo mật” (p000270), “lực lượng tiến công chủ lực của Đế quốc”, “phán đoán chiến lược” và “điều động lại” / “Việc điều động lại” (đồng bộ p000271, p000275, p000277), “phương tiện cơ giới” (p000275), “bổ sung quân số và tiếp tế vật tư” (p000277), “phòng tuyến phía tây” (p000278), “pháo binh tầm xa của địch” và “trận đánh trì hoãn” (p000279), “đi trên băng mỏng”, “Phòng tuyến Maginot¹²” (bảo toàn chỉ số chú thích trên cao ¹²) và “mấy kẻ ru rú trong nhà” (p000282)."
