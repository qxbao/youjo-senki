- id: ch03-b13-western-front-briefing-tanya-pov-pronouns-conditionals-and-footnote
  source_term: western_front_briefing_tanya_pov_pronouns_conditionals_and_footnote_ch03_b13
  proposed_vi: 'tiếp nối trực tiếp phần phổ biến tình hình tại văn phòng chỉ huy đại đội ở cuối lô ch-03-b12 (p000260–p000261), lô ch-03-b13 (chapter007.xhtml/p000262–p000282) đan xen giữa lời thoại trao đổi của Trung úy Ihlen Schwarkopf với Thiếu úy Tanya Degurechaff và phần phân tích chiến lược bám sát điểm nhìn của Tanya, tuân thủ nghiêm ngặt DEC-P01-001 (quy ước dùng “nó” trong trần thuật cho điểm nhìn của Tanya, tuyệt đối không dùng “cô” cho Tanya trong lời kể hay nội tâm) và DEC-P01-002: (1) Trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000269, p000278), quy chiếu Tanya nhất quán bằng tên riêng “Tanya” và đại từ ngôi thứ ba “nó” (“cấp trên của nó” tại p000278); lưu ý từ “nó” ở cuối câu 2 p000269 (“tận dụng sức mạnh của nó”) và ở câu 1 p000277 (“nhưng nó bao hàm nhiều công đoạn hơn”) hoàn toàn chỉ quy chiếu danh từ bất động vật là quả cầu tính toán “Type 95” và “Việc điều động lại”. (2) Khi quy chiếu Trung úy Ihlen Schwarkopf trong lời kể tại p000276, dùng họ “Schwarkopf” và đại từ ngôi thứ ba “anh” (đồng bộ hoàn toàn với ch-03-b11 p000234, ch-03-b12 p000240–p000250 và ch-04-b07 p000145); quy chiếu Đại Quân, Cụm tập đoàn quân phương Tây, cấp trên và quân đội tại mặt trận phía tây bằng đại từ số nhiều “họ” / “Họ” kết hợp phản thân “mình” (p000265, p000266, p000269, p000270, p000273, p000276, p000282 — đồng bộ ch-03-b12 p000261). (3) Tại các câu nhận định học thuyết hoặc giả định khái quát có đại từ ngôi thứ hai phiếm chỉ trong nguồn (p000279, p000282), theo đúng quy ước direct-address choice (pending-terms.yml), lược đại từ ngôi thứ hai phiếm chỉ ở câu 1 p000279 (“Một khi đã xác định rằng...”) và dùng chủ ngữ khái quát “người ta” ở câu 2 p000279 (“Thông thường, người ta sẽ bố trí...”) cùng câu 4 p000282 (“Khi ấy người ta chỉ việc chui rúc trong đó...”). (4) Trong lời thoại quân ngũ giữa Trung úy Ihlen Schwarkopf và Thiếu úy Tanya Degurechaff (p000262, p000264, p000272, p000275, p000278, p000280, p000281), Schwarkopf tự xưng “tôi” kết hợp phản thân “mình” (p000280), dùng đại từ gộp “chúng ta” / “Chúng ta” cho lực lượng tại mặt trận phía tây (p000264, p000278), quy chiếu Đại Quân ở phía bắc bằng “họ” / “Họ” (p000264, p000275) và gọi Tanya là “Thiếu úy” / “cô” (p000280), còn Tanya tự xưng “tôi”, gọi cấp trên trực tiếp là “thưa ngài” kèm từ lễ phép “Vâng” và tiểu từ kính ngữ “ạ” ở cuối câu hỏi và câu đáp (p000272, p000281 — đồng bộ ch-03-b11 p000235 và ch-03-b12 p000249, p000258). (5) Bảo toàn nguyên vẹn đối tượng và độ mở của câu hỏi trực tiếp ở p000272 (“Việc tập kết Đại Quân đang diễn ra thế nào rồi ạ?”), cấu trúc tăng tiến “không chỉ... mà còn...” ở p000277, chỉ số chú thích trên cao “¹²” ngay sau “Phòng tuyến Maginot¹²” ở p000282 tương ứng với thẻ `<html:sup>12</html:sup>` trong `xhtml` nguồn, cùng thời gian và mức độ chắc chắn của các mệnh đề giả định và điều kiện (giả định chức năng dự kiến ở p000263 và p000269; giả định theo kế hoạch dự kiến ở p000265; nhượng bộ giả định ở p000266 và p000271; khả thể quá khứ và điều kiện phủ định kép ở p000270; giả định theo học thuyết thông thường ở p000279; khả thể giả định ở quá khứ về trận đánh đằng sau Phòng tuyến Maginot trong lịch sử thế giới cũ ở câu 3–4 p000282); không sử dụng bất kỳ dấu nhấn mạnh Markdown `*...*` nào trong toàn bộ 21/21 đoạn do `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` theo đúng DEC-P01-002'
  alternatives_vi:
  - anh ấy hoặc ông (thay cho “anh” khi quy chiếu Trung úy Ihlen Schwarkopf tại p000276 — ưu tiên “anh” để đồng bộ hoàn toàn với ch-03-b11 p000234, ch-03-b12 p000240–p000250 và ch-04-b07 p000145) / lược chủ ngữ phiếm chỉ (thay cho chủ ngữ khái quát “người ta” ở câu 2 p000279 và câu 4 p000282 — cả hai cách đều thuộc quy ước direct-address choice; ưu tiên “người ta” để cấu trúc câu văn xuôi tự nhiên, rõ nghĩa)
