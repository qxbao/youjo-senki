  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md trong suốt cuộc trao đổi phổ biến tình hình mặt trận phía tây dưới điểm nhìn của Tanya: giữ quy chiếu Tanya bằng “Tanya” và đại từ “nó” trong lời kể (tuyệt đối không dùng “cô”), giữ đại từ “anh” cho Trung úy Schwarkopf, giữ chuẩn mực xưng hô quân ngũ (“tôi – Thiếu úy/cô” và “tôi – thưa ngài... ạ”), xử lý đại từ ngôi thứ hai phiếm chỉ bằng cách lược chủ ngữ hoặc dùng “người ta” theo direct-address choice, bảo toàn chính xác câu hỏi trực tiếp, cấu trúc tăng tiến “không chỉ... mà còn...”, các giả định/khả thể quá khứ, chỉ số chú thích trên cao “¹²” và không thêm dấu `*...*` ngoài nguồn."
