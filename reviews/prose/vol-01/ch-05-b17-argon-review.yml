      - "Giả định & thời gian: bảo toàn cả hai cấu trúc điều kiện giả định trái thực tế ở câu hai, gồm giả định hiện tại ('có lẽ còn nghe có lý đôi chút nếu nó đang tuyển mộ sinh viên mới tốt nghiệp') và giả định quá khứ ('nên nếu có đợt tuyển dụng rộng rãi dành cho cựu học viên mới ra trường thì ngay cả nó cũng đã cân nhắc nộp đơn')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000442
    choices:
      - "Đại từ, thuật ngữ & phủ định: giữ 'nó' / 'mình', khóa 'các đạo quân khu vực', bảo toàn mức độ suy luận chắc chắn ('Đinh ninh rằng ắt hẳn đã có nhầm lẫn gì đó') và các cấu trúc phủ định ('đâu phải là chuyện đó', 'không hoàn toàn ăn khớp', 'chẳng hề có sai sót nào ở bất cứ đâu')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000443
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002) & tính đồng bộ: khóa dấu '*...*' bao trọn toàn đoạn văn bản thông báo tuyển mộ và giữ nguyên văn 100% bản dịch đã duyệt ở ch-05-b16 p000404 (phân biệt 'Chúng ta' ở khẩu hiệu đầu và 'Chúng tôi' ở câu tuyển dụng, giữ 'đồng đội' và 'rừng gươm mưa đạn')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000444
    choices:
      - "Đại từ, thuật ngữ & phủ định: phân biệt 'Họ' / 'họ' (các ứng viên) và 'nó' (Tanya); khóa 'tiền tuyến', 'phòng tuyến địch', 'nghĩa vụ giải trình', 'rừng gươm mưa đạn'; bảo toàn dấu gạch ngang dài và các mệnh đề phủ định ('mà không hề có lựa chọn đầu hàng hay rút lui', 'chẳng khác nào bảo rằng họ sẽ chẳng nhận được gì cả')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000445
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002) & đại từ: khóa '*Xin mời tham gia cùng tôi trong chuyến du lịch một chiều xuống Địa ngục, xin chân thành cảm ơn*' tương ứng 1:1 với thẻ <html:em> trong nguồn (dấu chấm câu nằm ngoài dấu '*'); dùng 'tôi' trong lời mời công khai giả định và 'nó' trong trần thuật; khóa 'Lương tri thông thường' và phủ định dự đoán ('sẽ chẳng có ai hưởng ứng')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000446
    choices:
      - "Đại từ, thuật ngữ & giả định quá khứ: giữ 'nó', khóa 'Cục Quân vụ', bảo toàn chính xác các giả định trái thực tế ở quá khứ ('Bản thân nó chắc chắn sẽ không đời nào đáp lại..., và nó tin chắc hầu hết binh lính cũng sẽ không. Có như vậy, nó mới có thể lấy cớ không có đủ người tình nguyện để câu giờ')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000447
    choices:
      - "Thuật ngữ & cấu trúc trích dẫn: khóa 'Các pháp sư', 'tầng lớp tinh hoa', 'Phố Wall', 'bồi thường tai nạn lao động', 'bảo hiểm y tế', 'nhà kinh tế học', 'nhà giao dịch'; giữ nguyên nội dung mẩu tin tuyển dụng giả định trong ngoặc kép và câu chú thích trong ngoặc đơn."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000448
    choices:
