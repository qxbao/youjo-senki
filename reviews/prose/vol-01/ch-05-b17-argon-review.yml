  - segment_id: YS-LN01/Text/chapter011.xhtml/p000452
    choices:
      - "Đại từ & thuật ngữ: giữ 'Tanya' / 'nó' / 'mình'; khóa 'Văn phòng Bộ Tổng Tham mưu', 'tiểu đoàn pháp sư phản ứng nhanh', 'Chuẩn tướng von Zettour' và 'giới chóp bu'."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000453
    choices:
      - "Nhấn mạnh Markdown (DEC-P01-002) & phân biệt điểm nhìn đại từ (DEC-P01-001): khóa chính xác hai cụm '*Mình không hiểu nổi!*' (tiếng hét nội tâm tự quy chiếu dùng 'Mình') và '*Là một người lính, không có điều gì làm tôi hạnh phúc hơn là được góp một phần vào công việc này*' (lời nói xã giao ngoài miệng với cấp trên dùng 'tôi', dấu phẩy đặt ngoài dấu '*'), kết hợp đại từ trần thuật 'nó' và mệnh đề phủ định kết cảnh."
