  - segment_id: YS-LN01/Text/chapter011.xhtml/p000450
    choices:
      - "Đại từ & phủ định: giữ 'Nó' / 'nó' kết hợp phản thân 'mình', đồng bộ 'núi đơn ứng tuyển' với p000441 và bảo toàn đầy đủ ba cấu trúc phủ định ('Kế hoạch không thành', 'chẳng một ai có thể tự mình giải quyết xuể', 'sẽ chẳng phải là chuyện đơn giản')."
  - segment_id: YS-LN01/Text/chapter011.xhtml/p000451
    choices:
