  rationale: "Kế thừa đồng bộ “Schwarkopf”, “Degurechaff” / “Thiếu úy Tanya Degurechaff” / “Tanya”, “cấp trên” (ch-03-b11 p000226, p000238), “pháp sư”, “đơn vị huấn luyện” (b05-instructor-unit, ch-03-b11 p000225), “Central” (b05-central-command, ch-03-b09 p000155), “mặt trận phía bắc” (ch-03-b01 p000009, ch-03-b02 p000034, ch-03-b03 p000047, ch-04-b16 p000111), “người lính kỳ cựu” / “lính kỳ cựu” (ch-03-b10 p000197; tránh dùng “cựu binh” cho quân nhân đang tại ngũ), “thiếu úy” / “Thiếu úy” (b02-second-lieutenant), “hạ sĩ quan” (ch-03-b10 p000192, p000198, ch-04-b08), “Huy hiệu Xung kích Cánh Bạc” / “Cánh Bạc” (ch-03-b08–b11), “giới chỉ huy cấp cao” (b04-the-brass, ch-03-b11 p000224), “kinh nghiệm thực chiến” (ch-03-b11 p000237), “trung đội”, “mặt trận phía tây” (ch-04-b16 p000111), “Đại đội Pháp sư Xung kích số 205” (ch-03-b11 p000224, p000233), “trung đội trưởng” (ch-03-b10 p000193, ch-03-b11), “đại đội”, “chỉ huy một trung đội” (ch-03-b11 p000225, p000236), “tân binh”, “Trường Thiếu sinh quân” (ch-03-b09 p000182, ch-03-b10 p000185, p000198), “lính mới” (ch-03-b10 p000188), “quân đội Đế quốc” / “Đế quốc”, “giọng điệu điềm tĩnh, đậm chất công vụ” (P01-matter-of-fact-register), “huân chương” (ch-03-b08 p000136, ch-03-b11 p000237), “tấm huy hiệu” (ch-01-b18 p000016, p000018), biệt danh “Bạch Ngân” (ch-01-b17 p000009, ch-04-b03 p000042, ch-04-b11 p000248), “lực lượng chủ lực” (ch-03-b03–b05), “Đại Quân” (ch-01-b03 p000040), “cuộc tập kích bất ngờ” (ch-03-b04/b05), “Cộng hòa François” (ch-03-b02–b08), “chiến lược nội tuyến” (ch-03-b03 p000044), “Cụm tập đoàn quân phương Tây” (ch-03-b01 p000010, ch-03-b10 p000188), “quân tiếp viện” (ch-03-b02/b10) và “cầm chân kẻ địch” (ch-01-b11 p000177, p000181, ch-03-b03 p000048); khóa tạm “văn phòng chỉ huy đại đội” (p000240), “hoạt động trong tình trạng thiếu hụt quân số” (p000244), “tân binh non nớt” (p000245), “đám lính mới chân ướt chân ráo” và “cục nợ” (p000247), “các đợt kiểm tra tâm thần” (p000255 — đồng bộ với “kỳ đánh giá tâm thần” ở ch-04-b04 p000078, p000080, p000083) và “chính sách quốc phòng” (p000261)."
