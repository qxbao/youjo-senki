  proposed_vi: Schwarkopf / Degurechaff / văn phòng chỉ huy đại đội / cấp trên / pháp sư / đơn vị huấn luyện / Central / mặt trận phía bắc / người lính kỳ cựu / thiếu úy / hạ sĩ quan / Huy hiệu Xung kích Cánh Bạc / giới chỉ huy cấp cao / kinh nghiệm thực chiến / trung đội / Thiếu úy / mặt trận phía tây / Đại đội Pháp sư Xung kích số 205 / hoạt động trong tình trạng thiếu hụt quân số / trung đội trưởng / đại đội / tân binh non nớt / lính kỳ cựu / chỉ huy một trung đội / tân binh / Trường Thiếu sinh quân / đám lính mới chân ướt chân ráo / cục nợ / quân đội Đế quốc / giọng điệu điềm tĩnh, đậm chất công vụ / người lính kỳ cựu dày dạn thực chiến / Tanya / tấm huân chương / Thiếu úy Tanya Degurechaff / tấm huy hiệu / Cánh Bạc / “Bạch Ngân” / các đợt kiểm tra tâm thần / lực lượng chủ lực / Đại Quân / Đế quốc / cuộc tập kích bất ngờ / Cộng hòa François / chính sách quốc phòng / chiến lược nội tuyến / Cụm tập đoàn quân phương Tây / quân tiếp viện / cầm chân kẻ địch
  alternatives_vi:
