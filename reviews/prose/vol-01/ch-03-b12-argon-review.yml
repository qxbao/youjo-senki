  volume: vol-01
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt DEC-P01-001, DEC-P01-002 và style-guide.md khi chuyển điểm nhìn từ Trung úy Ihlen Schwarkopf (p000240–p000253: dùng “Anh” / “anh” cho Schwarkopf và “cô” / “Cô” cho Thiếu úy Degurechaff dưới góc nhìn quan sát từ bên ngoài của Schwarkopf) sang điểm nhìn của Tanya (p000254–p000256: dùng “Tanya” / “nó” trong trần thuật ngôi thứ ba và “mình” trong độc thoại nội tâm ngôi thứ nhất), giữ chuẩn mực xưng hô quân ngũ (“tôi – Thiếu úy/cô” và “tôi – ngài/thưa ngài... ạ”), bảo toàn chính xác các cấu trúc giả định, điều kiện, tăng tiến và không thêm dấu `*...*` khi nguồn không có nhấn mạnh."
