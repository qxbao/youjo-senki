- id: ch03-b12-schwarkopf-to-tanya-pov-shift-pronouns-conditionals-and-emphasis
  source_term: schwarkopf_to_tanya_pov_shift_pronouns_conditionals_and_emphasis_ch03_b12
  proposed_vi: 'tiếp nối cảnh trình diện ở cuối lô ch-03-b11 (p000239), lô ch-03-b12 (p000240–p000261) mở đầu bằng chuỗi đoạn trần thuật và đánh giá nội tâm dưới điểm nhìn của Trung úy Ihlen Schwarkopf (p000240–p000253) rồi chuyển ngược về điểm nhìn của Tanya (p000254–p000256) trước khi bước vào phần phổ biến tình hình chiến lược chung (p000257–p000261), tuân thủ nghiêm ngặt DEC-P01-001 (quy ước dùng “nó” trong trần thuật và “mình” trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, tuyệt đối không áp sang điểm nhìn của chủ thể khác) và DEC-P01-002: (1) Trong các đoạn theo điểm nhìn quan sát của Trung úy Schwarkopf (p000240–p000253), quy chiếu Schwarkopf nhất quán bằng tên “Schwarkopf” và đại từ ngôi thứ ba “Anh” / “anh” kết hợp phản thân “mình” (đồng bộ ch-03-b11 p000234, p000237, p000238 và ch-04-b07 p000145), đồng thời dưới góc nhìn bên ngoài của Schwarkopf, quy chiếu Thiếu úy Tanya Degurechaff bằng họ “Degurechaff”, các danh ngữ (“một cô bé nhỏ tuổi”, “đứa trẻ còn nhỏ tuổi hơn cả con gái mình này”, “vị thiếu úy”, “người lính kỳ cựu dày dạn thực chiến này”) và đại từ ngôi thứ ba “cô” / “Cô” kết hợp phản thân “mình” (p000241, p000243, p000248–p000250 — đồng bộ với lời kể góc nhìn bên ngoài ở ch-03-b08/b09, ch-04-b01–b06 và ch-04-b16; lưu ý đại từ “Nó” ở đầu câu 2 p000247 hoàn toàn chỉ quy chiếu danh từ bất động vật là “trung đội này”). (2) Khi điểm nhìn chuyển về lại Tanya (p000254–p000256), trong các câu trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya (p000254, câu 1 p000255, câu 2 p000256), quy chiếu Tanya nhất quán bằng tên “Tanya” / “Thiếu úy Tanya Degurechaff” và đại từ “nó” kết hợp phản thân “mình” (tuyệt đối không dùng “cô” cho Tanya khi ở điểm nhìn của Tanya; lưu ý từ “nó” thứ hai ở câu 2 p000255 trong cụm “mà nó ép mình phải trải qua” quy chiếu danh từ bất động vật là tấm huy hiệu Cánh Bạc), còn trong các câu độc thoại nội tâm ngôi thứ nhất của Tanya (câu 2 p000255, câu 1 p000256) dùng nhất quán đại từ tự quy chiếu “mình”, bảo toàn nguyên vẹn sự chuyển dịch ngôi tự sự ngay trong cùng một đoạn văn tại p000255 và p000256. (3) Trong đoạn chuyển tiếp chung và bối cảnh chiến lược (p000259, p000261), quy chiếu cả hai sĩ quan ở p000259 bằng “cả hai” kết hợp phản thân “mình”, và quy chiếu phía Đế quốc cùng Cụm tập đoàn quân phương Tây ở p000261 bằng đại từ số nhiều “họ” (đồng bộ ch-03-b02/b03). (4) Trong lời thoại quân ngũ giữa Trung úy Ihlen Schwarkopf và Thiếu úy Tanya Degurechaff (p000242, p000244, p000246, p000249–p000252, p000257, p000258, p000260), Schwarkopf tự xưng “tôi” / “Tôi”, dùng “chúng ta” cho Đại đội Pháp sư Xung kích số 205 (p000244) và gọi Tanya là “Thiếu úy” / “Cô” / “cô”, còn Tanya tự xưng “tôi” / “Tôi” và gọi cấp trên trực tiếp là “ngài” / “thưa ngài” kèm tiểu từ kính ngữ “ạ” (đồng bộ ch-03-b11 p000235, p000239). (5) Bảo toàn đầy đủ câu hỏi gián tiếp nội tâm của Schwarkopf (p000241), câu hỏi trực tiếp kiểm tra năng lực chỉ huy của Tanya (p000246) và mệnh đề nghi vấn gián tiếp hai vế (p000248), cùng các giả định suy luận ở p000241, mệnh đề điều kiện phủ định kép ở p000243, nhượng bộ giả định ở p000245, cấu trúc tăng tiến “không chỉ... mà còn...” và giả định trái thực tế hiện tại ở p000247, câu điều kiện ở p000250; không sử dụng bất kỳ dấu nhấn mạnh Markdown `*...*` nào trong toàn bộ 22/22 đoạn do `xhtml` nguồn không có thẻ `<html:em>` hay `<html:i>` theo đúng DEC-P01-002'
  alternatives_vi:
  - Ông / ông (thay cho “Anh” / “anh” khi quy chiếu Trung úy Ihlen Schwarkopf tại p000240–p000250 — ưu tiên “Anh” / “anh” để đồng bộ hoàn toàn với ch-03-b11 p000234, p000237, p000238 và ch-04-b07 p000145) / chúng tôi (thay cho “chúng ta” trong lời thoại của đại đội trưởng Schwarkopf nói với trung đội trưởng mới về tình hình đại đội tại p000244 — ưu tiên “chúng ta” vì Tanya đã chính thức nhận nhiệm vụ tại Đại đội Pháp sư Xung kích số 205)
