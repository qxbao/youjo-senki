findings:
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000029"
    severity: "minor"
    issue: "Cụm danh từ ẩn dụ chỉ cỗ xe tăng hạng nặng ('steel monstrosity') đang dịch thành 'con quái vật bọc thép', làm nhạt bớt nhẹ ấn tượng trực quan về một khối thép khổng lồ so với 'con quái vật bằng thép' hoặc 'con quái vật sắt thép'."
    basis: "Đối chiếu p000029 và nguyên tắc giữ đúng sắc thái hình ảnh của bản gốc trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'một con quái vật bằng thép như thế' hoặc 'một con quái vật sắt thép như thế'; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000031"
    severity: "minor"
    issue: "Cụm trạng ngữ chỉ việc các sĩ quan đọc báo cáo từ vị trí hậu phương ('in the reports from the rear') được dịch thêm từ 'gửi về' ('trong những bản báo cáo gửi về từ hậu phương'), dễ gây hiểu nhầm chiều thông tin là hậu phương gửi báo cáo tác chiến ra tiền tuyến thay vì sĩ quan ngồi ở hậu phương đọc báo cáo."
    basis: "Đối chiếu mạch văn p000029, p000031, p000033 và nguyên tắc không tự thêm từ làm lệch quan hệ ngữ nghĩa trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher nên cân nhắc chỉnh thành 'qua những bản báo cáo khi ở hậu phương' hoặc 'từ hậu phương qua những bản báo cáo'; ý đối lập chính giữa báo cáo và thực địa vẫn rõ nên không bắt buộc chặn bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000038"
    severity: "minor"
    issue: "Trong lời thoại của Tham tán Conrad nói với Đại tá Lergen, đại từ ngôi thứ hai đang dùng 'anh' ('đưa ra cho anh một vài gợi ý'), trong khi ở p000037 trần thuật của Lergen gọi Conrad là 'ông' và tại Tập 10 (chương 1, chương 4) hai người xưng hô lịch thiệp 'tôi – ông' phù hợp với phong thái quý tộc ở p000039."
    basis: "Đối chiếu p000037–p000039 và tính nhất quán xưng hô giữa Tham tán Conrad với Đại tá Lergen tại Tập 10."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'anh' thành 'ông' ('xin cho phép tôi đưa ra cho ông một vài gợi ý') để đồng bộ với Tập 10 và phong thái quý tộc ở p000039, hoặc giữ nguyên nếu muốn nhấn sắc thái thân tình giữa hai người bạn đồng trang lứa ở p000037; không bắt buộc sửa bản chuẩn."
