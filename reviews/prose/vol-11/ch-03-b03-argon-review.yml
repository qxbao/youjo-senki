findings:
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000052"
    severity: "minor"
    category: "ngữ nghĩa / kết hợp từ"
    issue: "Dịch thái độ bất mãn, coi thường thành 'chia sẻ nỗi khinh ngạo' vừa bám sát máy móc động từ tiếng Anh vừa dùng từ 'khinh ngạo' (vốn chỉ tính cách kiêu căng, ngạo mạn) chưa khớp với sắc thái ngán ngẩm, khinh thường năng lực của giới ngoại giao."
    basis: "Trong ngữ cảnh Tướng Rudersdorf thở dài trước sự tắc trách của Bộ Ngoại giao sau khi nghe cấp dưới hỏi, đây là sự bộc lộ hoặc đồng cảm với nỗi ngán ngẩm, coi thường chứ không phải tính kiêu ngạo."
    recommendation: "Đề xuất chỉnh thành 'buông một tiếng thở dài, bộc lộ nỗi ngán ngẩm dành cho đám nhà ngoại giao nước mình' hoặc 'chia sẻ sự coi thường dành cho...' ở bước chuốt văn; không chặn lô."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000057"
    severity: "minor"
    category: "ngữ nghĩa / đại từ"
    issue: "Ở mệnh đề cuối, cụm từ chỉ đối tượng thụ hưởng của việc tìm công việc mới bị lược bỏ và chuyển thành cụm nhấn mạnh 'cho bằng được'."
    basis: "Cấu trúc nguồn nêu việc nhận ra vì sao người kia lại cố tìm một công việc mới cho đối phương (hoặc bản dịch tiếng Anh bị nhiễu đại từ phản thân), nhưng việc dịch thành 'cho bằng được' đã làm mất thành phần chỉ đối tượng thụ hưởng và thêm sắc thái quyết tâm cực độ không có trong nguồn."
    recommendation: "Đề xuất chỉnh lại theo hướng trung tính, bám sát mặt chữ là 'hiểu vì sao ông ấy lại cố tìm một công việc mới cho mình' (hoặc 'hiểu vì sao ông ấy lại cố tìm một công việc mới') ở bước chuốt văn; không chặn lô."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000069"
    severity: "minor"
    category: "giọng điệu nhân vật"
    issue: "Thêm cụm từ khẩu ngữ gay gắt 'cái quái gì' vào lời thoại của Trung tá Uger khi đang báo cáo và trao đổi trực tiếp với Tướng Rudersdorf."
    basis: "Xuyên suốt cuộc đối thoại từ p000047 đến p000076, Trung tá Uger dù bức xúc trước sai lầm của Bộ Ngoại giao nhưng luôn giữ thái độ chuẩn mực, lễ phép với cấp trên; câu nguồn chỉ dùng cấu trúc hỏi gián tiếp thông thường, không có từ chửi thề hay nhấn mạnh thô tục."
    recommendation: "Đề xuất đổi 'đang làm cái quái gì vậy' thành 'đang làm gì nữa' hoặc 'đang làm cái gì vậy' ở bước chuốt văn để giữ đúng chuẩn mực quân phong của Uger; không chặn lô."
