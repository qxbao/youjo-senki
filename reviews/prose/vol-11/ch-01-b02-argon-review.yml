  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000038"
    locks:
      - "Khóa tên riêng 'Zettour' và sắc thái 'chất chứa rõ sự thất vọng—hoặc có lẽ là cả nỗi tuyệt vọng' trong tiếng thở dài."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000039"
    locks:
      - "Khóa phân biệt đại từ trần thuật 'ông' (Zettour) và 'ông ta' (Rudersdorf), thuật ngữ 'Đế chế' (the Reich), tình thái suy đoán 'Có lẽ ông ta sẵn sàng làm bất cứ điều gì vì quốc gia của mình' và nhận định 'chẳng khác nào việc gào thét và than khóc trước viễn cảnh đánh mất tất cả'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000040"
    locks:
      - "Khóa nhấn mạnh Markdown theo DEC-P01-002 cho toàn bộ câu thúc giục nội tâm '*Chúng ta cần phải đưa ra lựa chọn ngay lúc này!*'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000041"
    locks:
      - "Khóa cặp xưng hô 'Tôi' – 'ông', tên riêng 'Rudersdorf' và lý do mở lời trên tư cách bạn bè."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000042"
    locks:
      - "Khóa đại từ 'ông' và lời đáp khích lệ nói tiếp của Rudersdorf ('Ồ? Để xem ông định nói gì nào.')."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000043"
    locks:
