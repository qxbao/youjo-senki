findings:
  - segment_id: "YS-LN11/Text/chapter008.xhtml/p000090"
    severity: "minor"
    issue: "Câu thứ hai trong lời thoại của Đại tá Calandro thêm động từ 'kết luận' ('vội vàng kết luận như vậy'), làm thu hẹp nhẹ phạm vi khuyên đừng nóng vội nói chung của nguyên bản."
    basis: "Đối chiếu p000090 và nguyên tắc không tự thu hẹp sắc thái hoặc thêm từ giải thích trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc rút gọn thành 'Ngài không cần phải nóng vội như vậy.' hoặc 'Chưa cần phải vội vàng đến thế đâu.'; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter008.xhtml/p000094"
    severity: "minor"
    issue: "Trong mệnh đề điều kiện cuối câu thoại, đại từ ngôi thứ ba quy chiếu về Đế quốc được chuyển sang ngôi thứ hai ('nếu phía các ngài không sẵn lòng...'), làm giảm nhẹ sắc thái giữ khoảng cách khách quan kiểu ngoại giao của Calandro."
    basis: "Đối chiếu p000094 và nguyên tắc giữ đúng điểm nhìn, sắc thái phát ngôn trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'phía các ngài' thành 'họ' hoặc 'phía Đế quốc' để giữ nguyên cách nói gián tiếp của nhà trung gian hòa giải; không làm sai lệch nghĩa nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter008.xhtml/p000104"
    severity: "minor"
    issue: "Câu thứ hai dùng hai trợ từ thời tương lai 'sẽ' ('sẽ tự động phát huy tác dụng, và tôi sẽ luôn thấy chân mình quay trở lại') để dịch cấu trúc diễn tả thói quen/phản xạ lặp lại trong quá khứ, khiến nhịp câu hơi lệch sang dự đoán tương lai so với mạch hồi tưởng."
    basis: "Đối chiếu p000104 và nguyên tắc giữ đúng thời gian, sắc thái tình thái trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc điều chỉnh thành 'luôn tự động phát huy tác dụng, để rồi lúc nào tôi cũng thấy chân mình quay trở lại Văn phòng Bộ Tổng tham mưu' nhằm khớp tự nhiên hơn với mạch hồi ký quá khứ; không bắt buộc sửa bản chuẩn."
