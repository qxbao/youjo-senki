findings:
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000201"
    severity: "minor"
    category: "pronouns_clarity"
    issue: "Cụm 'nhưng ông ấy không thể làm theo ý mình được' trong trần thuật góc nhìn Tanya dùng từ 'mình' trùng với đại từ tự quy chiếu nội tâm của Tanya, dễ gây hiểu nhầm là 'theo ý của Tanya', đồng thời chưa thật sát nghĩa việc Zettour không thể toại nguyện trước sự từ chối của Tanya."
    recommendation: "Đổi 'nhưng ông ấy không thể làm theo ý mình được' thành 'nhưng ông ấy không thể được như ý' hoặc 'nhưng ông ấy không thể đạt được ý muốn'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000226"
    severity: "minor"
    category: "pronouns_register"
    issue: "Trong độc thoại nội tâm của Tanya (vốn dùng 'mình' và 'chúng ta'), cụm 'Cả hai chúng tôi đều biết' chuyển sang dùng 'chúng tôi' của lời thoại đối ngoại; hiện tượng tương tự lặp lại ở đầu đoạn p000230 ('cả hai chúng tôi cùng thở dài') gây lệch với câu kế tiếp trong cùng đoạn ('số phận cay đắng của chúng ta')."
    recommendation: "Đổi 'Cả hai chúng tôi' ở p000226 và 'cả hai chúng tôi' ở p000230 thành 'Cả hai chúng ta' / 'cả hai chúng ta' để thống nhất hệ đại từ nội tâm."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000227"
    severity: "minor"
    category: "tone_register"
    issue: "Trong lời thoại của Tanya nói trực tiếp với cấp trên là Tướng Zettour, cụm 'khi thốt ra từ miệng một vị trung tướng' mang sắc thái hơi suồng sã, chưa khớp với vẻ lễ độ bề ngoài của Tanya."
    recommendation: "Đổi 'khi thốt ra từ miệng một vị trung tướng đấy ạ' thành 'khi được nghe từ một vị trung tướng đấy ạ'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000231"
    severity: "minor"
    category: "rank_address_register"
    issue: "Trong lời của Tướng Zettour nói với cấp dưới là Trung tá Tanya, cách gọi 'Trung tá ạ' có thêm tiểu từ kính ngữ 'ạ', làm đảo ngược tương quan thứ bậc quân hàm cấp trên – cấp dưới và lệch với cách Zettour gọi 'Trung tá' ở p000221, p000228."
    recommendation: "Bỏ từ 'ạ' sau 'Trung tá', giữ thành '“Đó là lý do vì sao, Trung tá, mọi chuyện có thể sẽ trở nên cam go đối với quân của cô đấy.”'."
