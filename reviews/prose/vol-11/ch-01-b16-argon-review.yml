findings:
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000098"
    severity: "minor"
    category: "word_choice"
    issue: "Cụm ẩn dụ y khoa ở p000098 (little surgical procedure) đang dịch là 'cuộc tiểu phẫu nhỏ', bị trùng nghĩa Hán-Việt ('tiểu' vốn đã là nhỏ) và chưa đồng bộ với p000108 khi cùng ẩn dụ (surgical procedures) được dịch là 'các ca phẫu thuật'."
    recommendation: "Đổi 'cuộc tiểu phẫu nhỏ của chúng ta' thành 'ca phẫu thuật nhỏ của chúng ta' (hoặc 'ca tiểu phẫu của chúng ta') để vừa tránh lặp nghĩa vừa khớp mạch ẩn dụ với p000108."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000101"
    severity: "minor"
    category: "meaning_and_pronouns"
    issue: "Tính từ unbecoming (không xứng với cương vị/tầm vóc) đang dịch thoát thành 'chẳng giống mình', đồng thời việc dùng đại từ phản thân 'mình' quy chiếu cho Zettour ngay trước câu có đại từ nội tâm 'mình' tự quy chiếu của Tanya ('vị cấp trên của mình') gây nhiễu điểm nhìn theo DEC-P01-001."
    recommendation: "Đổi 'sự thiếu sáng suốt chẳng giống mình ấy' thành 'sự thiếu sáng suốt chẳng xứng với tầm vóc của ông ấy chút nào' hoặc 'sự thiếu sáng suốt không hợp với cương vị của ông ấy'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000109"
    severity: "minor"
    category: "pronouns"
    issue: "Câu đầu dùng 'mình' để quy chiếu phản thân cho Zettour ('như thể mình là một giáo sư') ngay sát câu sau dùng 'Mình' làm đại từ nội tâm tự quy chiếu của Tanya ('Mình gần như có cảm giác...'), gây nhập nhằng chủ thể với quy ước DEC-P01-001."
    recommendation: "Sửa 'như thể mình là một giáo sư tại học viện quân sự vậy' thành 'như thể ông ấy là một giáo sư tại học viện quân sự vậy' (hoặc 'như một vị giáo sư tại học viện quân sự vậy')."
