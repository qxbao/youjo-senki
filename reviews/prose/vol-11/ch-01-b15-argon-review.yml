findings:
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000061"
    severity: "moderate"
    category: "meaning_and_register"
    issue: "Cụm từ chỉ hành động tùy hứng nhất thời (on a whim) trong ngữ cảnh phản đối việc sát hại nhân sự (murdering staff) đang được dịch là 'chỉ vì một phút hứng tình'. Trong tiếng Việt, 'hứng tình' mang nghĩa kích thích hoặc ham muốn về mặt tình dục, hoàn toàn lệch nghĩa và sai lệch phong cách nghiêm trọng so với ý gốc là bốc đồng, tùy hứng."
    recommendation: "Sửa 'chỉ vì một phút hứng tình' thành 'chỉ vì một phút bốc đồng', 'chỉ vì một phút hứng chí' hoặc 'theo hứng nhất thời'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000063"
    severity: "minor"
    category: "word_choice"
    issue: "Động từ advocate for lặp lại xuyên suốt cụm thoại p000061–p000063 đang được dịch đồng loạt là 'cổ xúy'. Trong tiếng Việt hiện đại, 'cổ xúy' thường mang sắc thái tiêu cực (khuyến khích, xúi giục điều xấu), nên khi dùng cho câu khẳng định của Tanya về hòa bình (peace) ở p000063 ('Tôi cổ xúy cho hòa bình ạ') và câu hỏi của Zettour ở p000062 sẽ gây nghịch nghĩa với thái độ trang trọng ở p000064."
    recommendation: "Cân nhắc đổi thành 'chủ trương' (hoặc 'ủng hộ') đồng bộ ở p000061–p000063 ('chủ trương chuyện sát hại nhân sự' / 'Vậy cô chủ trương điều gì?' / 'Tôi chủ trương hòa bình ạ') để vừa giữ phép lặp từ nối kết lời thoại, vừa tự nhiên ở cả hai sắc thái."
