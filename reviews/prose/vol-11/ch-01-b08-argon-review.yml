    severity: "minor"
    issue: "Thán từ mở đầu câu độc thoại cảm thán đang được dịch là 'Ái chà', vốn thường mang sắc thái ngạc nhiên hoặc cảm thán nhẹ nhàng thay vì tiếng rên bực dọc, ức chế vì áp lực tâm lý."
    basis: "Đối chiếu sắc thái biểu cảm tại p000225 với mạch tâm lý bị dồn ép ở p000224 và nguyên tắc giữ sắc thái trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'Chao ôi', 'Trời ạ' hoặc 'Khổ thật' để thể hiện rõ hơn sự bức bối khi không thể nói ra điều mình thực sự muốn; không làm sai nghĩa câu nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000228"
    severity: "minor"
    issue: "Cụm phản thân 'của riêng mình' ở cuối câu quy chiếu về Tướng Rudersdorf nhưng lại xuất hiện trong câu mở đầu bằng đại từ chủ ngữ nội tâm 'Mình' (chỉ Tanya), tạo sự lặp từ 'mình' cho hai chủ thể khác nhau."
    basis: "Đối chiếu p000228 với quy tắc giữ rõ điểm nhìn và chủ thể hành động trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'của riêng mình' ở cuối câu thành 'của riêng ông ấy' để tách bạch hoàn toàn với đại từ tự quy chiếu 'Mình' của Tanya; không gây hiểu lầm mạch sự kiện nên không bắt buộc chặn bản chuẩn."
