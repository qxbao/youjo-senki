findings:
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000251"
    severity: "minor"
    issue: "Câu cảm thán nội tâm gọi thẳng khái niệm trừu tượng đang chuyển đại từ tự quy chiếu của Tanya sang 'Ta' ('Ta khao khát mi biết nhường nào!'), lệch nhẹ so với đại từ nội tâm 'mình' ở các đoạn xung quanh dù vẫn nối sang 'Chúng ta' ở câu kế tiếp."
    basis: "Đối chiếu p000251 với quy ước đại từ nội tâm tự quy chiếu 'mình' trong DEC-P01-001 (canon/decisions.md)."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'Ta' thành 'Mình' (hoặc giữ nếu chủ đích nhấn giọng bi kịch trào phúng khi hô gọi khái niệm trừu tượng); không làm lệch nghĩa hay điểm nhìn nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000274"
    severity: "minor"
    issue: "Câu đầu đoạn độc thoại nội tâm hướng về Rudersdorf không nằm trong dấu ngoặc kép nhưng đang dùng cặp đại từ 'tôi' – 'ngài' như lời thoại trực tiếp nối tiếp p000273, thay vì đại từ nội tâm tự quy chiếu 'mình' theo quy ước."
    basis: "Đối chiếu cấu trúc không có dấu thoại tại p000274 với quy ước phân biệt đại từ nội tâm 'mình' trong DEC-P01-001 (canon/decisions.md)."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chuyển câu đầu sang đại từ nội tâm 'mình' – 'ông ấy'/'ngài' để tách bạch rõ lời nói thành tiếng ở p000273 với lời nghĩ thầm ở p000274; không làm sai nghĩa câu nên không bắt buộc chặn bản chuẩn."
