findings:
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000021"
    severity: "minor"
    category: "tình thái giả định"
    issue: "Dùng 'Giá mà đó là...' mang sắc thái mong ước/tiếc nuối thay vì giả định đối lập thuần túy cho cấu trúc đảo ngữ giả định quá khứ khi đặt giả thuyết về một thuyền trưởng mới vào nghề."
    basis: "Đối chiếu mạch văn từ p000020 sang p000021: người kể đang đối sánh tính điềm tĩnh, chuẩn mực của vị thuyền trưởng lão luyện với phản ứng bốc đồng giả định của một thuyền trưởng non kinh nghiệm, không phải mong muốn người báo cáo là lính mới."
    recommendation: "Đề xuất đổi 'Giá mà đó là' thành 'Nếu đó là' hoặc 'Phải chi người báo cáo là... thì hẳn...' theo hướng giả định trung tính ở bước chuốt văn; không chặn lô."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000031"
    severity: "minor"
    category: "ngữ nghĩa / sắc thái từ vựng"
    issue: "Dịch cụm từ chỉ tư cách hành khách ('passengers on foreign vessels') thành 'đi nhờ trên tàu thuyền nước ngoài' làm phát sinh nét nghĩa đi quá giang/miễn phí không có trong nguồn."
    basis: "Trong ngữ cảnh hàng hải quốc tế thời chiến, công dân nước trung lập mua vé đi trên tàu buôn hoặc tàu khách mang cờ nước ngoài với tư cách hành khách thông thường, không phải 'đi nhờ'."
    recommendation: "Đề xuất chỉnh thành 'khi là hành khách trên tàu thuyền nước ngoài' hoặc 'khi đi trên tàu thuyền nước ngoài' ở bước chuốt văn; không chặn lô."
