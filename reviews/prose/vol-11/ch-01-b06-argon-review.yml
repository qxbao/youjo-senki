    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'hạm đội không quân' để phân biệt rõ cấp biên chế với 'không đoàn'; không ảnh hưởng logic sự kiện nên không bắt buộc chặn bản chuẩn."
