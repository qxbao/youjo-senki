    basis: "Đối chiếu p000169 với nguyên tắc không tự thêm từ giải thích trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'khả năng tác chiến của các cô' hoặc 'khả năng tác chiến của bên cô' để vừa thể hiện phạm vi tập thể vừa không thêm danh từ ngoài nguồn; không làm sai lệch nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000177"
