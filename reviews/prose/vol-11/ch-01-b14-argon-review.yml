findings:
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000046"
    severity: "minor"
    category: "style_and_naturalness"
    issue: "Đại từ tự xưng 'mình' lặp ba lần trong một câu ngắn ('Mình quan sát cấp trên của mình, người chỉ lắc đầu trước mặt mình.'), tạo cảm giác hơi nặng nề về nhịp câu."
    evidence: "Đối chiếu câu độc thoại nội tâm ở p000030 ('trước ý định tàn nhẫn của cấp trên') khi chủ ngữ đã là 'mình' thì danh ngữ 'cấp trên' không cần lặp lại định ngữ sở hữu 'của mình'."
    recommendation: "Có thể lược bớt một từ 'mình' thành 'Mình quan sát cấp trên, người chỉ lắc đầu trước mặt mình.'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000055"
    severity: "minor"
    category: "pronouns_and_register"
    issue: "Đại từ ngôi thứ nhất số nhiều trong độc thoại nội tâm của Tanya khi gộp bản thân với Tướng Zettour ở p000055 và p000057 đang dịch là 'cả hai chúng mình' / 'Chúng mình', mang sắc thái thân mật đời thường hơn mức quan hệ cấp dưới - cấp trên trong Bộ Tổng tham mưu và chưa đồng nhất với đại từ 'chúng ta' dùng trong nội tâm ở p000034, p000060."
    evidence: "Đối chiếu work/run-state/pending-terms-index.yml ('mình / chúng ta (nội tâm)') cùng cách dùng 'chúng ta' trong nội tâm tại p000034, p000060 và lô trước p000021."
    recommendation: "Đổi 'cả hai chúng mình' / 'Chúng mình' ở p000055 và 'cả hai chúng mình' ở p000057 thành 'cả hai chúng ta' / 'Chúng ta' (hoặc rút gọn thành 'cả hai')."
