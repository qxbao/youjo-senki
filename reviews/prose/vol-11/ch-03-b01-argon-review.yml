    negation_and_modality: "Giữ quyết định đánh cược 'phóng toàn bộ số ngư lôi mình có' chỉ trong một đòn tấn công duy nhất và kết quả 'đánh trúng đích'."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000019"
    terms:
      - "vị thuyền trưởng dày dạn kinh nghiệm"
      - "sĩ quan hải quân"
      - "các bản báo cáo sau trận đánh"
    pronouns: "ông (vị thuyền trưởng); chúng (loạt ngư lôi)."
    negation_and_modality: "Giữ chi tiết xác nhận âm thanh vụ nổ nghe thấy khắp toàn bộ chiếc tàu ngầm."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000020"
    terms:
      - "bộ tư lệnh hải quân"
