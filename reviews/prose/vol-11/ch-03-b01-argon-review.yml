  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000004"
    pronouns: "họ (các chỉ huy Đế quốc)."
    negation_and_modality: "Giữ sắc thái ngộ nhận ban đầu 'Thoạt đầu, họ cứ ngỡ đó là tin tốt…' và dấu ba chấm cuối câu."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000005"
    terms:
