  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000005"
    severity: "minor"
    category: "thuật ngữ / ngữ nghĩa"
    issue: "Dịch 'its territory' (khu vực hoạt động/phạm vi kiểm soát của hạm đội tàu ngầm hoặc Đế quốc, tương ứng với vùng hạn chế tàu ngầm ở p000009 và khu vực hạn chế ở p000016) thành 'vùng lãnh hải của mình' làm hẹp nghĩa thành khái niệm pháp lý 'territorial waters' (lãnh hải)."
    basis: "Đối chiếu nội bộ với 'restricted submarine zone' tại p000009 và 'its restricted area' tại p000016: vụ đánh chìm tàu diễn ra trong vùng biển hạn chế/phong tỏa ngoài khơi bờ biển phía tây chứ không nhất thiết trong lãnh hải."
    recommendation: "Cân nhắc đổi 'vùng lãnh hải của mình' thành 'khu vực của mình', 'vùng biển thuộc phạm vi của mình' hoặc 'lãnh địa của mình' ở bước chuốt văn; không bắt buộc chặn lô vì đại ý mệnh lệnh công kích mọi tàu đi vào vùng cấm vẫn bảo toàn."
