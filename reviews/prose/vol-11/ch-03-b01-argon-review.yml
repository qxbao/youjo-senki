      - "các quan chức lục quân"
    viewpoint: "Trần thuật ngôi thứ ba; giữ sự tương phản giữa thái độ đắc thắng của hải quân và lời tán dương hiếm thấy từ lục quân."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000007"
