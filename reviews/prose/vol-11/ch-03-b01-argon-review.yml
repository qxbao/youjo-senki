    negation_and_modality: "Giữ các phủ định 'chẳng thể bắt bẻ được điểm nào', 'Chẳng ai cần phải kiểm tra', 'không chút phóng đại' và giới hạn 'chỉ chia sẻ những chi tiết mà đích thân ông đã xác nhận'."
