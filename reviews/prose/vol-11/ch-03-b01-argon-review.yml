      - "sổ ghi chép trên chiếc tàu ngầm"
      - "Hải quân Đế quốc"
    negation_and_modality: "Giữ phủ định toàn phần 'Chẳng thể tìm thấy lấy một sai sót nào' và khẳng định 'hội đủ mọi điều kiện'."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000016"
    terms:
