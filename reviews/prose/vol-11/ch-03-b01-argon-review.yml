      - "vật tư chiến tranh"
      - "Khối Thịnh vượng chung"
    negation_and_modality: "Giữ cấu trúc tăng tiến 'Không những trắng trợn phái một tàu chở hàng... họ còn cho một tàu chở khách đi kèm' và chi tiết 'bật đèn chiếu sáng quốc kỳ vào ban đêm'."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000010"
    terms:
      - "đại sứ quán"
      - "rắc rối ngoại giao"
    pronouns: "họ (Hợp chúng quốc); phân giải rõ chủ thể 'Đế quốc tấn công họ' ở mệnh đề điều kiện cuối để tránh nhập nhằng."
    emphasis: "Khóa nhấn mạnh Markdown '*trung lập*' khớp chính xác với thẻ em trong nguồn theo DEC-P01-002."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000011"
    terms:
      - "tuyến phong tỏa"
    negation_and_modality: "Giữ quan hệ điều kiện – hệ quả của thế tiến thoái lưỡng nan: tấn công thì tạo cớ cho đối phương tham chiến, để lọt thì tuyến phong tỏa mất hết ý nghĩa."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000012"
    pronouns: "các sĩ quan ấy / họ."
    negation_and_modality: "Giữ nhận định 'Lẽ đương nhiên là các sĩ quan ấy nhận ra rằng họ đã làm hỏng bét mọi chuyện'."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000013"
    terms:
      - "cấp trên"
      - "Bộ Ngoại giao"
    negation_and_modality: "Giữ quan hệ đồng thời giữa việc báo động và việc xác minh chi tiết cuộc chạm trán, cùng bước ngoặt phát hiện thêm nhiều vấn đề khác."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000014"
    negation_and_modality: "Giữ dấu ba chấm ngập ngừng ở câu đầu và quan hệ so sánh tăng cấp 'điều tồi tệ hơn gấp bội lại là toàn bộ những tình tiết xoay quanh cuộc tấn công ấy'."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000015"
    terms:
