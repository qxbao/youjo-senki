    negation_and_modality: "Giữ phủ định tuyệt đối 'chẳng bao giờ đến một mình' và cấu trúc 'chẳng hề nhận ra... cho đến tận rất, rất lâu về sau'."
    viewpoint: "Trần thuật ngôi thứ ba toàn tri."
    emphasis: "Không dùng nhấn mạnh Markdown."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000003"
    terms:
