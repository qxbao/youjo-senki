      - "các sĩ quan trực ban"
    negation_and_modality: "Giữ chi tiết 'tắt đèn di chuyển' và phủ định 'không hề có các dấu hiệu nhận biết được Đế quốc phê chuẩn nhằm cho thấy đây là tàu hồi hương công dân hay vận chuyển người bệnh'."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000017"
    terms:
