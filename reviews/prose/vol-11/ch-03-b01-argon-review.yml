      - "Văn phòng Bộ Tổng tham mưu"
    pronouns: "chúng ta (trong câu nghĩ thầm tập thể của các sĩ quan); bọn họ (trần thuật chỉ các sĩ quan)."
    viewpoint: "Trần thuật ngôi thứ ba kết hợp câu độc thoại nội tâm tập thể trực tiếp."
    emphasis: "Khóa nhấn mạnh Markdown '*Phen này chúng ta gây họa lớn rồi*' khớp chính xác với thẻ em trong nguồn theo DEC-P01-002."
  - segment_id: "YS-LN11/Text/chapter010.xhtml/p000009"
    terms:
