findings:
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000017"
    severity: "minor"
    issue: "Tính từ chỉ phẩm chất tri thức/học thức của giới sĩ quan tham mưu cao cấp ('intellectual') được dịch thành 'duy lý', làm dịch chuyển nhẹ sắc thái từ có đầu óc tri thức/học thuật sang thiên về lý tính."
    basis: "Đối chiếu p000017 và sự phân biệt với thuật ngữ 'rationality' trong canon/glossary-pending.yml."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'quá đỗi duy lý' thành 'quá đỗi có đầu óc tri thức' hoặc 'quá thiên về học thức'; không làm lệch mạch lập luận nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000020"
    severity: "minor"
    issue: "Câu cuối đoạn dùng 'Lẽ ra tôi nên bắt đầu bằng việc...' mang sắc thái giả định trái thực tế ở quá khứ, trong khi câu gốc là lời chuyển ý hướng về phần trình bày chi tiết ngay sau đó."
    basis: "Đối chiếu p000020 và quy tắc giữ đúng thời gian của tình thái trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'Tôi nên bắt đầu bằng việc mô tả chi tiết chuỗi sự kiện đã dẫn đến cơ sự này.' để khớp tự nhiên với mạch mở đầu giải thích ở p000021; không làm sai lệch cốt truyện nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000023"
    severity: "minor"
    issue: "Cụm 'so với thời hoàng kim trước kia' thêm từ 'thời hoàng kim' khi diễn đạt trạng thái trước đây của Đế chế."
    basis: "Đối chiếu p000023 và quy tắc không tự thêm chi tiết giải thích trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc rút gọn thành 'so với dáng vẻ trước kia của nó' hoặc 'so với trước kia'; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter006.xhtml/p000025"
    severity: "minor"
    issue: "Cụm 'những kẻ... vừa trốn tránh thực tại vừa lạc quan tếu' hơi tăng sắc thái miệt thị và khẩu ngữ so với cách nhận định khái quát trung tính của người kể chuyện."
    basis: "Đối chiếu p000025 và quy tắc không tự thêm sắc thái phán xét/miệt thị không có trong nguồn tại canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc điều chỉnh thành 'những người... thường là sự kết hợp giữa tâm lý trốn tránh thực tại và sự lạc quan'; không làm thay đổi lập luận nên không bắt buộc sửa bản chuẩn."
