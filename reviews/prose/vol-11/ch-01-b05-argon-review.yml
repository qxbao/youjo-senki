findings:
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000145"
    severity: "minor"
    issue: "Cụm từ chỉ phần mẩu thuốc lá còn thừa sau khi hút của loại thuốc lá quân đội rẻ tiền đang được dịch là 'đầu lọc thuốc lá quân đội rẻ tiền' (và lặp lại là 'đống đầu lọc' ở p000147), dễ gợi hình dung hiện đại về thuốc lá có đầu lọc thay vì mẩu/tàn thuốc lá nói chung."
    basis: "Đối chiếu p000145, p000147 và bối cảnh lịch sử - quân sự của tác phẩm theo canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'mẩu thuốc lá quân đội rẻ tiền' ở p000145 và 'đống mẩu thuốc' ở p000147 để tự nhiên và sát thực tế bối cảnh hơn; không làm sai lệch nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000149"
    severity: "minor"
    issue: "Thuật ngữ điều lệnh chỉ tư thế đứng nghiêm ('at attention') đang được dịch là 'trong tư thế chào', dễ lẫn với động tác giơ tay chào đã thực hiện ở p000139."
    basis: "Đối chiếu mạch hành động từ p000139 đến p000149 và thuật ngữ điều lệnh quân sự chuẩn trong tiếng Việt."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'Đứng thẳng cứng và đúng điều lệnh trong tư thế nghiêm' hoặc 'Đứng nghiêm trang và cứng nhắc trong tư thế nghiêm'; không ảnh hưởng logic sự kiện nên không bắt buộc chặn bản chuẩn."
