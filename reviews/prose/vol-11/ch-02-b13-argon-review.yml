findings:
  - segment_id: "YS-LN11/Text/chapter008.xhtml/p000112"
    severity: "minor"
    issue: "Cụm 'tai tiếng khét tiếng' lặp âm và trùng nét nghĩa ('tai tiếng' kết hợp với 'khét tiếng')."
    basis: "Đối chiếu p000112 và nguyên tắc viết tiếng Việt tự nhiên, rõ ràng trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'tai tiếng lừng lẫy' (sắc thái mỉa mai nhẹ) hoặc 'tiếng xấu khét tiếng' để tránh lặp từ; không ảnh hưởng nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter008.xhtml/p000126"
    severity: "minor"
    issue: "Ở câu thứ ba, trạng từ nhấn mạnh mức độ cực đoan ('ngay cả') trước chức danh 'Tổng tham mưu trưởng' được dịch thành 'đích thân', làm giảm nhẹ sắc thái so sánh bậc thang dù phía sau vẫn giữ trợ từ 'cũng là'."
    basis: "Đối chiếu p000126 và nguyên tắc giữ đúng sắc thái nhấn mạnh, mức độ trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'việc đích thân Tổng tham mưu trưởng' thành 'việc ngay cả Tổng tham mưu trưởng' để khớp sát hơn với cấu trúc tăng tiến; không làm sai lệch nghĩa nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter008.xhtml/p000128"
    severity: "minor"
    issue: "Ở câu thứ hai, cụm 'một phần' đặt ngay trước đại từ 'chúng tôi' ('có lẽ một phần chúng tôi đã tự vùi đầu...') dễ gây hiểu nhầm thành bộ phận chủ thể ('một bộ phận trong số chúng tôi') thay vì bổ nghĩa cho mục đích hành động ('một phần là để trốn tránh thực tại')."
    basis: "Đối chiếu p000128 và nguyên tắc giữ đúng phạm vi bổ nghĩa, quan hệ mục đích trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher nên chuyển vị trí thành 'có lẽ chúng tôi đã tự vùi đầu vào sự bận rộn ấy một phần là để trốn tránh thực tại'; không bắt buộc sửa bản chuẩn ở bước này."
