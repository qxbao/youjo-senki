  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000035"
    locks:
      - "Khóa cặp đại từ 'Ông' – 'tôi', 'cả hai ta' và hình ảnh ẩn dụ khép lại màn đối đáp 'theo đuổi một mối tình mà cả hai ta đều biết sẽ chẳng bao giờ đơm hoa kết trái'."
