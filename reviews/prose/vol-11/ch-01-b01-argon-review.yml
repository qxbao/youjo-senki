    basis: "Đối chiếu p000003 và nguyên tắc giữ đúng mức độ chắc chắn của giả định, không tự thu hẹp sắc thái trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi thành 'Nếu người đối thoại với ông vẫn như thường ngày, có lẽ ông ta đã nhận ra điều đó.' để giữ sát mức độ khả thể và sắc thái trung tính; không làm sai lệch cốt truyện nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000031"
    severity: "minor"
    issue: "Chức danh chỉ cấp phó của Bộ Tổng tham mưu ('deputy director of the general staff') được dịch là 'cục phó Bộ Tổng tham mưu'; cách ghép 'cục phó' với 'Bộ Tổng tham mưu' hơi lệch cấp đơn vị hành chính – quân sự và chưa khớp với phương án 'phó tổng tham mưu trưởng' đã khóa cho 'deputy director' ở cuối vol-10 trong work/run-state/pending-terms-index.yml."
    basis: "Đối chiếu p000031 và mục 'deputy director' ('vị phó tổng tham mưu trưởng') tại vol-10 trong work/run-state/pending-terms-index.yml."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc đổi 'cục phó Bộ Tổng tham mưu' thành 'phó tổng tham mưu trưởng' để thống nhất chức vụ với vol-10; không làm sai lệch nghĩa cốt lõi nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000032"
    severity: "minor"
    issue: "Cụm 'quê hương Heimat' bổ sung danh từ giải thích 'quê hương' trước thuật ngữ tiếng Đức 'Heimat' vốn đã hàm chứa nghĩa quê hương/tổ quốc."
    basis: "Đối chiếu p000032, mục 'Heimat' trong work/run-state/pending-terms-index.yml và nguyên tắc không tự thêm từ giải thích trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc giữ gọn là 'Heimat' ('nhử cả Heimat xuống địa ngục'); không ảnh hưởng đến mạch nghĩa nên không bắt buộc sửa bản chuẩn."
