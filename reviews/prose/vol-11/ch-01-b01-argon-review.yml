      - "Khóa tên riêng 'Zettour', đại từ 'ông', chi tiết binh sĩ hiến dâng mạng sống với 'niềm tin vào chiến thắng cuối cùng' và cấu trúc phủ định kép 'Không một ngày nào trôi qua mà những linh hồn đã khuất ấy không ám ảnh ông'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000030"
    locks:
      - "Khóa liên từ nhượng bộ 'Dẫu vậy', đại từ 'ông' và phủ định bất lực 'chẳng thể làm được gì để thay đổi thực tế đó'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000031"
    locks:
      - "Khóa cách gọi 'Ông lão' (chỉ Zettour), đại từ 'ông', định danh 'Đế quốc', biểu tượng 'Nữ thần Chiến thắng', chức vụ cấp phó tại 'Bộ Tổng tham mưu' và kết luận phủ định dứt khoát rằng Đế quốc 'không còn khả năng chạm tới Nữ thần Chiến thắng được nữa'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000032"
    locks:
      - "Khóa nhấn mạnh Markdown theo DEC-P01-002 chỉ tại câu đầu '*À phải, vị nữ thần chết tiệt đó.*', giữ văn bản thường cho phần còn lại với đại từ 'ả', thuật ngữ 'Heimat' và hình ảnh ẩn dụ 'dùng thứ mật ngọt hy vọng để nhử... xuống địa ngục'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000033"
    locks:
      - "Khóa cách gọi thân mật pha châm biếm 'ông bạn chậm hiểu của tôi', cặp đại từ 'tôi' – 'ông', 'Chúng ta', ẩn dụ coi việc theo đuổi Nữ thần Chiến thắng là 'ngoại tình' và câu hỏi móc máy 'Hay ông đã quên mất tình yêu nồng cháy với vợ mình rồi?'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000034"
    locks:
