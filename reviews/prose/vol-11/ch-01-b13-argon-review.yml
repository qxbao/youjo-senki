findings:
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000001"
    severity: "minor"
    category: "register_and_address"
    issue: "Tướng Zettour (cấp trên) khi gọi Trung tá Tanya (cấp dưới) đang dùng tiểu từ kính ngữ 'Trung tá ạ', làm lệch nhẹ tương quan cấp bậc trong thoại quân đội và trùng với sắc thái lễ phép mà Tanya dùng để thưa gửi Zettour ở p000005, p000011, p000024."
    evidence: "Đối chiếu cách Zettour gọi Tanya ở p000012 ('Đừng giả ngây nữa, Trung tá.') và ở lô trước p000370 ('Trung tá, tôi là một người tốt...')."
    recommendation: "Bỏ tiểu từ 'ạ', sửa ', Trung tá ạ.' thành ', Trung tá.'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000012"
    severity: "minor"
    category: "meaning_and_metaphor"
    issue: "Ở câu cuối, thành ngữ chỉ việc bày toàn bộ mọi thứ ra bàn đang được dịch cụ thể hóa thành 'bày hết mọi quân bài lên bàn', làm chuyển hướng sang ẩn dụ đánh bài và làm mờ nhẹ mạch liên kết trực tiếp với ẩn dụ đóng cửa tiệm / đợt xả hàng thanh lý mà Tanya liên tưởng ngay ở p000013."
    evidence: "Đối chiếu mạch ẩn dụ kinh doanh nối tiếp từ câu áp cuối p000012 ('đóng cửa dẹp tiệm') sang hai câu đầu p000013 ('tất toán mọi khoản nợ tồn đọng', 'một đợt xả hàng thanh lý để đóng cửa')."
    recommendation: "Đổi 'bày hết mọi quân bài lên bàn' thành 'bày hết mọi thứ lên bàn'."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000019"
    severity: "minor"
    category: "terminology_and_collocation"
    issue: "Cụm danh từ chỉ con người Zettour ở câu cuối đang dịch là 'cá nhân có tính hợp lý tên là Zettour kia', ghép trực tiếp danh từ 'tính hợp lý' vào danh từ chỉ người nên hơi cứng so với kết hợp từ tiếng Việt tự nhiên khi mô tả phẩm chất tư duy của một cá nhân."
    evidence: "Đối chiếu canon/glossary-pending.yml (mục P03-rationality có phương án 'tính hợp lý' / 'tính duy lý') và cách dùng tự nhiên cho danh từ chỉ người ('cá nhân duy lý' hoặc 'con người lý trí')."
    recommendation: "Có thể chỉnh mượt thành 'cá nhân duy lý tên là Zettour kia' (hoặc 'con người lý trí tên là Zettour kia')."
