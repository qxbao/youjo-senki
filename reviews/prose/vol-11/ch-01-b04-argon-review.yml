  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000140"
    locks:
      - "Khóa đại từ tự quy chiếu 'mình', nhận định bầu không khí căng thẳng đến mức gần như sờ thấy được và sự đối lập giữa dự tính ban đầu khi mở cửa với thực tế vượt xa mọi tưởng tượng."
