      - "Khóa bước chuyển điểm nhìn sang ngôi thứ nhất của Tanya với đại từ tự quy chiếu 'mình' theo DEC-P01-001, danh xưng 'Tướng Rudersdorf', đại từ 'ông ấy', địa điểm 'phòng chờ' và cấu trúc tương phản giữa độ vang của giọng nói với rắc rối mà nó mang theo."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000134"
    locks:
      - "Khóa nhận định nội tâm của Tanya 'Chắc là có cố trốn chạy thực tại thì cũng chẳng ích gì…'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000135"
    locks:
      - "Khóa đại từ tự quy chiếu 'mình' và chi tiết 'Nét bực dọc thoáng qua trên gương mặt mình biến mất hoàn toàn theo phản xạ'."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000136"
    locks:
