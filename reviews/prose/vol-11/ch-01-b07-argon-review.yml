    basis: "Đối chiếu p000211 với nguyên tắc không tự thêm từ giải thích ngoài câu nguồn trong canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'chẳng có gì cả' hoặc 'chẳng tìm ra gì cả' để sát bề mặt câu nguồn hơn; không làm sai lệch nghĩa ngữ cảnh nên không bắt buộc sửa bản chuẩn."
  - segment_id: "YS-LN11/Text/chapter002.xhtml/p000212"
    severity: "minor"
    issue: "Tính từ nhận xét của Rudersdorf về việc Tanya ít lên tiếng phản hồi đang được dịch là 'trầm ngâm' ('cô có vẻ trầm ngâm nhỉ'), hơi nghiêng sang sắc thái suy tư thay vì trạng thái im lặng hoặc kiệm lời."
    basis: "Đối chiếu p000212 với p000207-p000208 trong mạch hội thoại và canon/style-guide.md."
    recommendation: "Ở bước chuốt văn, polisher có thể cân nhắc chỉnh thành 'im lặng' hoặc 'kiệm lời' ('cô có vẻ kiệm lời nhỉ' / 'cô có vẻ trầm lặng nhỉ') để sát trực tiếp trạng thái ít nói sau câu đáp ngắn của Tanya; không ảnh hưởng logic hội thoại nên không bắt buộc chặn bản chuẩn."
