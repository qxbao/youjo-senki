findings:
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000137"
    severity: "minor"
    category: "pronouns"
    issue: "Trong câu trần thuật mang điểm nhìn nội tâm của Tanya, cụm 'một trong những người bạn thân nhất của mình' dùng 'mình' làm đại từ phản thân quy chiếu cho Zettour ngay sau đoạn p000136 vừa dùng 'Mình' để tự quy chiếu Tanya, dễ gây nhập nhằng chủ thể với quy ước DEC-P01-001 (tương tự ở cuối p000127 'Kế hoạch B của mình' đang quy chiếu cho Rudersdorf)."
    recommendation: "Đổi 'một trong những người bạn thân nhất của mình' ở p000137 thành 'một trong những người bạn thân nhất của ông ấy' (và có thể cân nhắc đổi 'Kế hoạch B của mình' ở p000127 thành 'Kế hoạch B của ông ta' để tách bạch hoàn toàn chủ thể)."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000145"
    severity: "minor"
    category: "pronouns"
    issue: "Câu cuối đoạn trần thuật nội tâm dùng 'quanh hai chúng tôi' (lệch sang đại từ 'tôi' của lời thoại thay vì hệ đại từ nội tâm của Tanya theo DEC-P01-001) và dùng 'mối bận tâm của mình' làm đại từ phản thân quy chiếu cho Zettour."
    recommendation: "Sửa 'quanh hai chúng tôi, ông ấy vừa nhả thêm một hơi khói vừa nói ra mối bận tâm của mình' thành 'quanh cả hai, ông ấy vừa nhả thêm một hơi khói vừa nói ra mối bận tâm của ông ấy' (hoặc 'quanh hai người, ông ấy vừa nhả thêm một hơi khói vừa nói ra nỗi bận tâm trong lòng')."
  - segment_id: "YS-LN11/Text/chapter004.xhtml/p000154"
    severity: "minor"
    category: "word_choice"
    issue: "Cụm 'ánh nhìn ghê tởm đó' trong tiếng Việt dễ bị hiểu theo hướng định ngữ phẩm chất ('một ánh nhìn đáng ghê tởm'), trong khi ngữ cảnh chỉ ánh mắt biểu lộ sự ghê tởm/chán ghét của Zettour trước đề xuất của Tanya."
    recommendation: "Đổi 'ánh nhìn ghê tởm đó' thành 'ánh nhìn đầy vẻ ghê tởm đó' hoặc 'ánh mắt tỏ vẻ ghê tởm đó'."
