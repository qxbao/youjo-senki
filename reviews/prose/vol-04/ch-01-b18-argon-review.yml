  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, quốc gia, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng B01–B17 của Tập 4 (`lũ Cộng sản`, `phe Cộng sản`, `khiếm khuyết`, `chính quốc`, `chiến tuyến chính`, `Năm Thống nhất 1926`, `Lục quân Đế quốc`, `Mặt trận phía Nam`, `lục địa phía nam`, `Tướng von Romel`, `cuộc chiến tiêu hao`, `tiêu hao`, `sĩ quan tham mưu`, `hậu phương`, `de Lugo`, `Tướng quân`, `Quân đội Cộng hòa Tự do`, `Đế quốc`, `phe Cộng hòa`, `các đơn vị thuộc địa`), đồng thời khóa tạm các thuật ngữ tác chiến và liên tưởng lịch sử xuất hiện trong batch (`nước Mỹ Vĩ đại`, `ném bom lửa xuống Tokyo`, `đòn nghi binh`, `Hang Cáo`, `tổ chức chống Đế quốc`, `chính sách chiếm đóng`, `trận phục kích`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_and_romel_staff_pronouns_and_address_vol04_ch01_b18
  proposed_vi: "Trong phân cảnh Mặt trận phía Đông (chapter001_d/p000155–p000172): trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (p000167, p000171) và giữ nguyên tên riêng `Tanya` (p000167, p000169); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (p000161, p000168, p000170) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị Tiểu đoàn 203 / phía Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (p000159, p000164, p000165); trong đối thoại giữa Tanya và Đại úy Weiss: Tanya tự xưng `tôi` (p000156, p000163), còn Weiss hỏi xác nhận và nhận lệnh dùng `chúng ta`, `tôi` kèm tiểu từ lễ phép `ạ` (p000157, p000162, p000166). Trong phân cảnh Mặt trận phía Nam (chapter001_d/p000173–p000193): trần thuật quy chiếu Tướng von Romel bằng `ông` (p000174, p000177, p000185, p000188, p000191, p000193) và quy chiếu Tướng de Lugo của phe Cộng hòa Tự do bằng `ông ta` (p000186); trong đối thoại giữa Romel và các sĩ quan tham mưu: Romel tự xưng `tôi`, gọi tập thể quân mình là `chúng ta` / `ta` (p000176, p000179, p000183, p000188, p000189, p000192), các sĩ quan tham mưu gọi Romel là `Tướng von Romel` / `Tướng quân` / `ngài`, dùng `chúng ta` kèm tiểu từ `ạ` (p000178, p000184, p000190) và trong ý nghĩ hoài nghi giả định dùng `tôi` – `chúng ta` (p000191); khi Romel thầm nhớ tới Tanya trong nội tâm dùng `cô ấy` (p000191)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_d/p000159, p000164, p000165 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B17, đồng thời phân biệt với `chúng ta` trong lời hỏi trực tiếp của Weiss tại p000162) / hắn (thay cho `ông ta` khi trần thuật nhắc tới de Lugo tại chapter001_d/p000186 — ưu tiên `ông ta` để đồng bộ với B04 và giữ giọng văn trần thuật quân sự khách quan khi đánh giá vị tướng lĩnh đối phương)
