  proposed_vi: "lá chắn phòng không, lũ Cộng sản, khiếm khuyết (chapter001_d/p000155) / phòng không của phe Cộng sản (chapter001_d/p000156) / đánh lạc hướng, màn phô diễn thị uy (chapter001_d/p000158) / nước Mỹ Vĩ đại, ném bom lửa xuống Tokyo, đòn nghi binh (chapter001_d/p000160) / chính quốc (chapter001_d/p000161, p000163, p000186) / chiến tuyến chính (chapter001_d/p000165) / lệnh phê chuẩn (chapter001_d/p000170) / Năm Thống nhất 1926, trận địa lâm thời của Lục quân Đế quốc trên Mặt trận phía Nam, Hang Cáo (chapter001_d/p000173) / Tướng von Romel, Lục quân Đế quốc, cuộc chiến tiêu hao, tiêu hao (chapter001_d/p000174, p000175, p000178, p000180, p000185, p000186, p000188) / tấn công trực diện, đấu đá sa lầy (chapter001_d/p000177) / sĩ quan tham mưu, điều kiện chiến thắng, lục địa phía nam (chapter001_d/p000180, p000191) / nguồn cung cấp nước, hậu phương (chapter001_d/p000181) / de Lugo, Tướng quân (chapter001_d/p000183–p000187) / Quân đội Cộng hòa Tự do, tổ chức chống Đế quốc (chapter001_d/p000185) / chính sách chiếm đóng, Đế quốc, trận quyết chiến (chapter001_d/p000186, p000187) / phe Cộng hòa, các đơn vị thuộc địa (chapter001_d/p000187) / trận phục kích (chapter001_d/p000189)"
  alternatives_vi:
  - đại đế quốc Mỹ (thay cho `nước Mỹ Vĩ đại` tại chapter001_d/p000160 — ưu tiên `nước Mỹ Vĩ đại` vì giữ đúng sắc thái mỉa mai khẩu ngữ trong độc thoại nội tâm của Tanya khi nhắc tới chiến dịch ném bom lửa xuống Tokyo ở thế giới cũ) / Sào huyệt Cáo (thay cho `Hang Cáo` tại chapter001_d/p000173 — ưu tiên `Hang Cáo` vì súc tích, tự nhiên khi làm tên địa danh sở chỉ huy dã chiến của Tướng von Romel trên Mặt trận phía Nam)
