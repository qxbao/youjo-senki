  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` ở phân cảnh của Tanya và Weiss, đồng thời giữ nhất quán quy ước xưng hô quân sự giữa Tướng von Romel, các sĩ quan tham mưu, Tướng de Lugo và cách Romel quy chiếu Tanya (`cô ấy`, tiếp nối cách gọi `cô` ở B04) trên Mặt trận phía Nam."
