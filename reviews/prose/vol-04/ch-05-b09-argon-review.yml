locked_choices:
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000238"
    choices:
      - "Bảo toàn nhấn mạnh Markdown '*Và chính vì vậy*' theo đúng thẻ in nghiêng của nguồn (DEC-P01-002) và sắc thái tình thái 'có lẽ cần phải nói rằng…'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000239"
    choices:
      - "Khóa 'Tiểu đoàn Pháp sư Trên không số 203', 'Đế quốc'; phân biệt đại từ phản thân trong trần thuật ('cấp dưới của mình') với độc thoại nội tâm của Tanya ('Mình', 'chúng ta') và giữ phủ định mức độ 'vẫn chưa bi đát đến mức... ngay lúc này'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000240"
    choices:
      - "Giữ sự chuyển điểm nhìn từ độc thoại nội tâm ngôi thứ nhất ('Mình', 'mình') sang trần thuật ngôi thứ ba dùng tên riêng 'Tanya' và phản thân 'mình'; khóa 'phe Cộng sản', 'thế giới tự do', 'Đế quốc' và lựa chọn 'phương án đỡ tệ nhất trong những lựa chọn tồi tệ nhất'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000241"
    choices:
      - "Khẩu lệnh quân sự ngắn gọn của Weiss: '“Tất cả các đơn vị, nghiêm!”'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000242"
    choices:
      - "Khóa quân hàm 'Đại úy Weiss', tên đơn vị 'Tiểu đoàn Pháp sư Trên không số 203' và đại từ 'họ' chỉ các thành viên tiểu đoàn."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000243"
    choices:
      - "Lời hô của Weiss trước toàn đơn vị: khóa 'Chỉ huy' và đại từ gộp 'chúng ta'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000244"
    choices:
      - "Khẩu lệnh 'Nghỉ.', khóa thuật ngữ pending 'trận không chiến tiêu diệt hoàn toàn', đại từ 'chúng ta' (phe Đế quốc) đối lập với 'Đám người này' / 'chúng' (đơn vị mới của địch), và bảo toàn nhấn mạnh Markdown '*tự do*' theo đúng nguồn (DEC-P01-002)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000245"
    choices:
      - "Trần thuật bám điểm nhìn đánh giá của Tanya về cấp dưới: giữ tên 'Tanya' và tương phản mức độ giữa việc giữ im lặng lắng nghe với việc đón nhận tin xấu mà không xao động."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000246"
    choices:
      - "Thoại mệnh lệnh của Tanya trước tiểu đoàn: xưng 'tôi' - gọi 'các anh' (và 'chúng ta' khi nói chung về đơn vị); khóa 'Bộ Tư lệnh', 'kiểm soát bầu trời', 'đánh giá kiểm chứng', 'nghiên cứu kỹ năng tác chiến', 'nhiệm vụ tấn công mặt đất'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000247"
    choices:
      - "Trần thuật giữ tên riêng 'Tanya' và 'Grantz', bảo toàn sắc thái nối tiếp tức thì 'vừa dứt lời... đã lập tức lên tiếng như mọi khi'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000248"
    choices:
      - "Thoại Grantz hỏi Tanya trước hàng quân: gọi 'Thưa Chỉ huy', xưng 'tôi' và có kính ngữ 'ạ'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000249"
    choices:
      - "Thoại Tanya đáp Grantz: khóa cấp bậc 'Trung úy Grantz'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000250"
    choices:
      - "Thoại Grantz: xưng 'tôi' / 'chúng ta', có kính ngữ 'sao ạ', khóa hướng 'phía tây' và cụm 'tập kích mặt đất'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000251"
    choices:
      - "Thoại Tanya giải thích cho Grantz: gọi 'Cậu', khóa 'tấn công mặt đất', 'không phận của Khối Thịnh vượng chung', 'nghiên cứu kỹ năng tác chiến', 'tập kích' và mệnh đề phủ định 'bản thân các đợt tập kích không phải là trọng tâm chính'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000252"
    choices:
      - "Thoại chất vấn tiếp theo của cấp dưới: gọi 'Thưa Thiếu tá', dùng 'chúng ta' và câu hỏi tu từ 'chẳng phải... nên yểm trợ cho các đơn vị còn lại sao ạ?'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000253"
    choices:
      - "Thoại Tanya đáp toàn tiểu đoàn: giữ cách gọi 'tiểu đoàn thân mến của tôi', đại từ 'chúng ta', khóa 'kiểm soát được bầu trời', 'các cơ sở dưới mặt đất', 'tập kích mặt đất' và 'nhiệm vụ giành ưu thế trên không'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000254"
    choices:
      - "Khóa tên 'Weiss', danh xưng 'Chỉ huy', cụm 'tập kích mặt đất' và mệnh lệnh 'Lấy khí tài và sẵn sàng xuất kích—khẩn trương lên!'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000255"
    choices:
      - "Khóa tên riêng 'Weiss', 'Grantz', 'Serebryakov', chức danh 'phó chỉ huy', đại từ 'anh' (Weiss) và 'họ' (Grantz và Serebryakov), cùng cấu trúc phủ định kép 'Cũng không phải là Grantz và Serebryakov phối hợp không tốt'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000256"
    choices:
      - "Thoại riêng của Weiss hỏi Tanya: gọi 'Thưa Thiếu tá…' và kết câu hỏi bằng kính ngữ 'sao ạ?'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000257"
    choices:
      - "Thoại Tanya nói riêng với Weiss: xưng 'tôi' - gọi 'anh', khóa 'Đại úy Weiss' và mệnh đề cấm đoán 'Anh không được tiết lộ chuyện này cho binh sĩ đâu đấy'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000258"
    choices:
      - "Trần thuật về Tanya dùng 'nó' và đại từ phản thân 'mình' (DEC-P01-001); giữ tên 'Weiss', 'người kế nhiệm' và cụm 'vấn đề trách nhiệm'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000259"
    choices:
      - "Trần thuật về Tanya dùng 'nó' (DEC-P01-001) và giữ tên 'Weiss'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000260"
    choices:
      - "Thoại Weiss hỏi Tanya: có kính ngữ 'ạ', khóa cụm thuật ngữ 'đội quân tình nguyện'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000261"
    choices:
      - "Trần thuật về Tanya dùng 'nó' và phản thân 'mình' (DEC-P01-001), quy chiếu Weiss bằng 'anh'; khóa 'phó chỉ huy', 'vật hiến tế sống' và 'hậu phương'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000262"
    choices:
      - "Thoại Tanya giải thích cho Weiss: dùng 'chúng ta' đối lập với 'Chúng' / 'chúng', khóa 'công dân Hợp chúng quốc', 'Khối Thịnh vượng chung' và 'những đám ô hợp tương tự'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000263"
    choices:
      - "Độc thoại nội tâm trực tiếp của Tanya: tự xưng 'mình' (DEC-P01-001) và gọi quân địch là 'bọn này'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000264"
    choices:
      - "Thoại Tanya với Weiss: khóa 'Đại úy Weiss', 'Khối Thịnh vượng chung', 'ưu thế trên không', đại từ 'Chúng ta' và sắc thái đánh giá 'lợi bất cập hại'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000265"
    choices:
      - "Thoại Weiss đáp Tanya: giữ 'Đã rõ.', đại từ 'chúng ta' và cách gọi 'thưa Thiếu tá?'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000266"
    choices:
      - "Trần thuật dùng 'Tanya' / 'Nó' (DEC-P01-001) và 'anh' (Weiss); trong thoại thì thầm của Tanya khóa 'Đại úy Weiss', xưng hô 'anh' / 'Chúng ta' và cấu trúc phủ định ngoại trừ 'chẳng cần bất cứ thứ gì ngoài việc là những kẻ vẫn còn đứng vững vào phút cuối cùng'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000267"
    choices:
      - "Nhận định của Tanya và câu trần thuật: giữ song hành 'Những kẻ còn sống đến phút cuối cùng, những kẻ vẫn còn đứng vững, mới là những kẻ vĩ đại', tên 'Tanya' và đại từ 'anh' (Weiss)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000268"
    choices:
      - "Thoại đáp của Weiss: dùng 'Chúng ta' và giữ nghĩa 'cố gắng trở thành những người chiến thắng vào phút cuối'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000269"
    choices:
      - "Thoại Tanya xưng 'tôi', phần dẫn thoại dùng 'nó' (DEC-P01-001); bảo toàn nhấn mạnh Markdown cho hai câu nội tâm cuối '*Nếu có thể. Sự sống còn của chúng ta quan trọng hơn chiến thắng.*' theo đúng nguồn (DEC-P01-002)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000270"
    choices:
      - "Khóa câu hỏi ngắn '“Thiếu tá?”' và tên 'Weiss' cùng hành động đứng thẳng dậy hỏi với giọng khó hiểu."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000271"
    choices:
      - "Khóa tên 'Tanya' ở câu trần thuật mở đầu; trong thoại khóa đại từ 'tôi' / 'chúng ta' và thuật ngữ nhiệm vụ 'tập kích mặt đất'."
