  volume: vol-04
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, tiếp nối liền mạch `vol-04-ch-04-b01` – `b04` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` cho Lergen, `ông` cho Zettour, `cô` / `Cô` trong lời kể khách quan và `cô ta` / `Cô ta` trong độc thoại nội tâm bàng hoàng của Lergen khi quy chiếu Thiếu tá von Degurechaff, `tôi – Thiếu tá / cô` và `Tôi / tôi – Thưa Tướng quân / thưa ngài / ngài... ạ` trong đối thoại giữa Tướng von Zettour và Thiếu tá von Degurechaff), đồng thời bảo toàn chính xác các cấu trúc giả định/điều kiện, câu hỏi trực tiếp/nội tâm và cả 8 đoạn có nhấn mạnh in nghiêng tại p000103, p000111, p000114, p000115, p000120, p000126, p000129 và p000132."
