- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000132
  locks:
  - "Giữ toàn bộ đoạn liên tưởng nội tâm nhấn mạnh in nghiêng `*Hẳn cảm giác khi nhìn ai đó nghịch diêm ngay gần kho thuốc súng chính là như thế này đây. Thấp thỏm tự hỏi không biết bao giờ nó sẽ phát nổ. Chẳng giống cảm giác bồn chồn đánh trống ngực, mà giống một cơn đau thắt quặn trong bụng hơn.*` (theo DEC-P01-002) và cụm `kho thuốc súng`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000133
  locks:
  - "Giữ tên riêng `Lergen`, các cụm `rượu whiskey`, `rượu vang` và các đại từ `chính mình`, `ông`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000134
  locks:
  - "Giữ câu điều kiện bỏ lửng `…Nếu như việc quên đi chuyện này thực sự có thể làm được.`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000135
  locks:
  - "Giữ lời đáp `Không đâu, thưa Tướng quân.`, cụm `quy tắc ứng xử`, đại từ `Tôi` / `tôi` và tiểu từ kính ngữ `ạ`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000136
  locks:
  - "Giữ các danh xưng `Vị thiếu tá`, `cấp trên`, cấu trúc so sánh giả định và các đại từ `mình`, `cô`."
