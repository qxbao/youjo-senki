  proposed_vi: "trung sĩ, trung đội huấn luyện, Thiếu tá Tanya von Degurechaff / Degurechaff / Thiếu tá / vị thiếu tá, con búp bê chiến đấu, vứt bỏ chức trách / thực thi chức trách, Tướng quân / Zettour / vị tướng, hậu phương, lục quân, Bộ Tổng tham mưu, nhiệm vụ tác chiến, phía đông / các chiến tuyến chính ở phía đông, phía tây, trong nước, Lergen, quân nhân tinh nhuệ, biệt danh, công tác ở hậu phương, pháp sư, các tuyến tiền tiêu, thủ đô Liên bang, phiên điều trần, góc nhìn của một người lính, nhiệm vụ đánh lạc hướng, sĩ quan, hành động quân sự, công tác tác chiến, kho thuốc súng, rượu whiskey, rượu vang, quy tắc ứng xử, cấp trên (chapter001_n/p000100, p000102–p000108, p000111, p000115, p000116, p000119–p000122, p000124, p000125, p000128–p000130, p000132, p000133, p000135, p000136)"
