  volume: vol-04
  chapter: 4
  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` – `b04` (`trung sĩ`, `Thiếu tá Tanya von Degurechaff` / `Degurechaff` / `Thiếu tá` / `vị thiếu tá`, `con búp bê chiến đấu`, `Tướng quân` / `Zettour` / `vị tướng`, `hậu phương`, `lục quân`, `Bộ Tổng tham mưu`, `Lergen`, `biệt danh`, `công tác ở hậu phương`, `pháp sư`, `các tuyến tiền tiêu`, `thủ đô Liên bang`, `phiên điều trần`, `góc nhìn của một người lính`, `nhiệm vụ đánh lạc hướng`, `công tác tác chiến`, `quy tắc ứng xử`, `cấp trên`), đồng thời khóa tạm các thuật ngữ mới phát sinh trong cuộc chất vấn trực diện giữa Tướng von Zettour và Thiếu tá von Degurechaff (`trung đội huấn luyện`, `vứt bỏ chức trách` / `thực thi chức trách`, `nhiệm vụ tác chiến`, `kho thuốc súng`)."
