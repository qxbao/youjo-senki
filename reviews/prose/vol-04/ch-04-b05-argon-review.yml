- source_term: lergen_pov_zettour_degurechaff_confrontation_pronouns_address_and_emphasis_vol04_ch04_b05
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` – `b04` trong toàn bộ 37 đoạn của `vol-04-ch-04-b05` (chapter001_n/p000100–p000136) khi Tướng von Zettour chất vấn gắt gao Thiếu tá Tanya von Degurechaff trước sự chứng kiến của Đại tá von Lergen: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen) và `DEC-P01-002`: (1) Trần thuật ngôi thứ ba và độc thoại nội tâm bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, đại từ `ông` / `Ông` và đại từ phản thân `mình` / `chính mình` (p000100, p000111, p000115, p000129, p000133); quy chiếu Tướng von Zettour bằng tên riêng `Zettour`, danh xưng `vị tướng`, `cấp trên` và đại từ `ông` (p000102, p000111, p000121, p000129, p000136); quy chiếu Thiếu tá Tanya von Degurechaff trong lời kể khách quan bằng `Thiếu tá Tanya von Degurechaff` / `Degurechaff` / `Vị thiếu tá`, đại từ `cô` / `Cô` kết hợp phản thân `mình` / `bản thân` (p000102, p000106, p000115, p000119, p000121, p000125, p000126, p000136), và dùng `cô ta` / `Cô ta` trong các câu độc thoại nội tâm trực tiếp đầy bàng hoàng của Lergen (p000103, p000114, p000115, p000120); trong câu lời nói giả định của một đứa trẻ khoe đi mua đồ giúp người lớn ở p000126, dùng cặp xưng hô tự nhiên `Cháu – bác... ạ`; tại câu độc thoại nội tâm p000129 có đại từ ngôi thứ hai phiếm chỉ trong nguồn, lược chủ ngữ phiếm chỉ (`*Ừm, thậm chí chẳng cần phải nhìn kỹ.*`) theo quy ước `direct-address choice`, và lưu ý đại từ `nó` ở p000132 chỉ quy chiếu danh từ bất động vật là `kho thuốc súng`. (2) Trong đối thoại quân ngũ giữa Tướng von Zettour và Thiếu tá Tanya von Degurechaff: Zettour (p000104, p000107, p000109, p000116, p000123, p000128, p000131) tự xưng `tôi`, gọi Tanya là `Thiếu tá` và `Cô` / `cô` kết hợp phản thân `mình` / `bản thân` (cùng câu diễn đạt hàm ý ngầm trong câu hỏi của Zettour ở p000111 dùng `Cô` / `mình`); Thiếu tá Tanya von Degurechaff (p000105, p000108, p000110, p000122, p000124, p000130, p000135) tự xưng `tôi` / `Tôi` kết hợp phản thân `mình`, gọi Zettour là `Thưa Tướng quân` / `thưa Tướng quân` / `thưa ngài` và `ngài` kèm tiểu từ kính ngữ `ạ`. (3) Bảo toàn chính xác cấu trúc tăng tiến `không những... mà còn...` (p000107), các mệnh đề giả định và điều kiện (p000106, p000126, p000129, p000130, p000133, p000134, p000136), các câu hỏi trực tiếp / nội tâm / tu từ (p000100, p000104, p000106, p000107, p000109, p000111, p000114–p000116, p000120, p000123, p000128, p000131), và cả 8 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000103 (`*Con… con búp bê chiến đấu ấy. Con người khoác lốt quái vật ấy. Trông cô ta như đang bị sốc.*`), p000111 (`*Cô không có lời giải thích nào cho việc tại sao mình lại yêu cầu một điều về thực chất chẳng khác gì vứt bỏ chức trách sao?*`), p000114 (`*Cô ta không hiểu sao?*`), p000115 (`*Cô ta đang nói cái gì thế?*` và `*Cái gì vừa thốt ra từ miệng cô ta vậy?*`), p000120 (`*Vậy mà giờ đây cô ta lại tìm cách trốn tránh nhiệm vụ tác chiến sao?*`), p000126 (`*Cháu đã đi mua số khoai tây mà bác dặn rồi đây ạ!*`), p000129 (`*Ừm, thậm chí chẳng cần phải nhìn kỹ.*`) và p000132 (`*Hẳn cảm giác khi nhìn ai đó nghịch diêm ngay gần kho thuốc súng chính là như thế này đây. Thấp thỏm tự hỏi không biết bao giờ nó sẽ phát nổ. Chẳng giống cảm giác bồn chồn đánh trống ngực, mà giống một cơn đau thắt quặn trong bụng hơn.*`), không phát sinh dấu `*` ngoài nguồn ở 29 đoạn còn lại."
  alternatives_vi:
  - người ta (thay cho cách lược đại từ ngôi thứ hai phiếm chỉ trong câu `*Ừm, thậm chí chẳng cần phải nhìn kỹ.*` tại chapter001_n/p000129 — cả hai cách đều thuộc quy ước `direct-address choice`; ưu tiên lược chủ ngữ phiếm chỉ để nhịp độc thoại nội tâm ngắn gọn, tự nhiên) / Con đã đi mua số khoai tây mà mẹ dặn rồi đây ạ! (thay cho `*Cháu đã đi mua số khoai tây mà bác dặn rồi đây ạ!*` tại chapter001_n/p000126 — ưu tiên cặp `Cháu – bác` trung tính vì nguồn không chỉ định người sai việc vặt là cha mẹ, giúp tránh suy diễn quan hệ gia đình theo tinh thần `DEC-P01-001`)
