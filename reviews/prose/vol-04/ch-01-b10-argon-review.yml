  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Thiếu tá Tanya von Degurechaff, Đại úy Weiss và binh sĩ dưới quyền trước giờ xuất kích nhảy dù."
