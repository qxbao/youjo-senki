  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, cơ quan tham mưu, nhân vật và thuật ngữ chính trị đã khóa tạm từ Tập 1–3 cùng B01–B09 của Tập 4 (`Liên bang`, `Cộng sản`, `Trung đội 437`, `raison d’état`, `phe Đỏ`, `Đại tá von Lergen`, `hai vị trung tướng Zettour và Rudersdorf`, `Bộ Tổng tham mưu`, `Weiss`), đồng thời khóa tạm các thuật ngữ chính trị – doanh nghiệp, tác chiến bí mật và điển tích lịch sử xuất hiện trong batch (`động vật chính trị`, `hồ sơ nhập ngũ`, `chiến sĩ tự do`, `hiến pháp hòa bình`, `nhiệm vụ phi quy ước`, `phòng pháp chế`, `*la France*`, `*raison d’humanité*`, `điểm tập kết xuất phát`, `Takeda Shingen`, `Stalin`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_pre_drop_morale_and_monologue_pronouns_and_address_vol04_ch01_b10
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000277, p000291) và giữ nguyên tên riêng `Tanya`; nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000281, p000288, p000292, p000294, p000297), ngôi thứ nhất số nhiều chỉ tập thể đơn vị trong độc thoại nội tâm dùng `chúng tôi` (chapter001_b/p000286, p000296), ngôi thứ nhất số nhiều trong phát biểu triết lý khái quát về bản chất chính trị của con người và cuộc đấu tranh cho tự do dùng `chúng ta` (chapter001_b/p000270, p000271, p000274, p000275), ngôi thứ hai khái quát dùng cấu trúc vô nhân xưng `có thể nói` hoặc `bạn` (chapter001_b/p000281, p000285, p000297), và quy chiếu Đại úy Weiss trong độc thoại nội tâm khen ngợi bằng `anh ấy` (chapter001_b/p000296); trong đối thoại khi Tanya phát biểu trước toàn tiểu đoàn: xưng `tôi` hoặc `chúng ta` (khi bao hàm toàn đơn vị), gọi binh sĩ là `các anh` (chapter001_b/p000272, p000276, p000283, p000289); khi Weiss bổ sung thông tin tình báo trước đơn vị: phát ngôn khách quan chuẩn mực quân sự (chapter001_b/p000295)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya về rủi ro đơn vị bị vứt bỏ và việc duy trì kỷ luật binh sĩ tại chapter001_b/p000286, p000296 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể Tiểu đoàn 203 trong độc thoại nội tâm suốt từ B01 đến B09, đồng thời phân biệt rõ với `chúng ta` dùng trong các câu triết lý chính trị khái quát tại p000270–p000275) / người ta (thay cho `bạn` tại chapter001_b/p000285, p000297 — ưu tiên `bạn` để đồng bộ với p000268 ở B09 và giữ đúng giọng văn châm biếm trực diện của Tanya)
