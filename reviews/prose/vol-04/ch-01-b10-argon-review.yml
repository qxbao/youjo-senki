- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000275
  locks:
  - "Giữ cụm `hiến pháp hòa bình của một quốc gia yêu chuộng hòa bình nọ`, đại từ `chúng ta`, danh xưng `đám Cộng sản toàn trị kinh tởm này` và bộ ba giá trị `tự do, công lý và nhân quyền`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000276
  locks:
  - "Giữ đại từ `chúng ta` trong lời Tanya nói với thuộc cấp."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000277
  locks:
  - "Giữ tên `Tanya`, hình ảnh ẩn dụ `bản dạ khúc rền rĩ của các động cơ` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000278
  locks:
  - "Giữ cụm `nhiệm vụ phi quy ước`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000279
  locks:
  - "Giữ cụm `xâm phạm lãnh thổ trung lập` và phép ví von về nhân viên văn phòng bị công ty đem ra làm tốt thí chịu trận."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000280
  locks:
  - "Giữ các cụm thuật ngữ doanh nghiệp `giao dịch nội gián`, `những khoản quyên góp có vấn đề`, `phòng pháp chế` và `thực thi tuân thủ pháp luật`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000281
  locks:
  - "Giữ toàn bộ phần độc thoại tự bào chữa in nghiêng ở đầu đoạn `*…Ý mình là… phòng pháp chế ở công ty mình tất nhiên tràn ngập sự tôn trọng pháp luật; nơi đó đầy nhiệt huyết trong việc thực hiện chức năng của mình trong xã hội. Đúng thế, mình chỉ nhắc tới chi tiết lúc nãy như một sự khái quát hóa thôi; có thể nói công ty mình, quân đội, vân vân chính là hiện thân của tinh thần thượng tôn pháp luật.*` theo DEC-P01-002, đại từ nội tâm `mình` theo DEC-P01-001 và cụm `những phản xạ có điều kiện từ kiếp trước`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000282
  locks:
  - "Giữ thành ngữ về báo đốm không đổi đốm trên mình và câu hỏi tu từ về bản tính của một quốc gia."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000283
  locks:
  - "Giữ tên đơn vị `Trung đội 437` đồng bộ với B07–B08 và cụm `tổ quốc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000284
  locks:
  - "Giữ cụm thuật ngữ chính trị `nguyên tắc raison d’état của lục địa` đồng bộ với Tập 2."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000285
  locks:
  - "Giữ danh xưng `phe Đỏ`, đại từ khái quát `bạn`, hai cụm tiếng Pháp in nghiêng `*la France*` và `*raison d’humanité*` (trong khi `raison d’état` không in nghiêng) khớp chính xác thẻ `<em>` trong nguồn theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000286
  locks:
  - "Giữ cụm trong ngoặc kép `“vì nhà nước”`, đại từ tập thể `chúng tôi` và hình ảnh so sánh `vứt bỏ như chiếc đuôi đứt lìa của con thằn lằn`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000287
  locks:
  - "Giữ nhận định về việc những nhân vật nắm quyền lực nhà nước hay đánh đồng quyền lực cá nhân với lợi ích quốc gia."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000288
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001 và các danh xưng `Đại tá von Lergen`, `hai vị trung tướng Zettour và Rudersdorf`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000289
  locks:
  - "Giữ các đại từ `chúng ta`, `các anh`, `tôi` và thành ngữ `rừng gươm mưa đạn` trong lời hiệu triệu pha trò của Tanya."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000290
  locks:
  - "Giữ danh xưng `Bộ Tổng tham mưu`, tên `Tanya` và cụm `giới chóp bu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000291
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và câu khích lệ in nghiêng ở cuối đoạn `*Cho bọn chúng biết tay đi nào!*` khớp thẻ `<em>` trong nguồn theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000292
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001 và nét nghĩa tự đánh giá về sự tin tưởng của thuộc cấp trước giờ xuất kích."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000293
  locks:
  - "Giữ nhận định quản trị về việc cấp trên không được thuộc cấp tin tưởng dễ bị bãi nhiệm vì thiếu năng lực quản lý."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000294
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000295
  locks:
  - "Giữ các danh xưng `Trung đội 437`, `điểm tập kết xuất phát của Liên bang`, `bên Tình báo` và tên `Weiss`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000296
  locks:
  - "Giữ đại từ `anh ấy` quy chiếu Weiss và đại từ tập thể `chúng tôi` trong độc thoại nội tâm của Tanya."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000297
  locks:
  - "Giữ tên riêng lịch sử `Takeda Shingen`, `Stalin`, đại từ khái quát `bạn`, ký hiệu chú thích cuối sách `⁵` ngay sau `Con người chính là tường đá của bạn…⁵` và đại từ nội tâm `mình`."
