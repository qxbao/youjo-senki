  proposed_vi: "động vật chính trị (chapter001_b/p000270) / Liên bang, hồ sơ nhập ngũ (chapter001_b/p000272, p000295) / chiến sĩ tự do, hiến pháp hòa bình, Cộng sản toàn trị (chapter001_b/p000274, p000275) / nhiệm vụ phi quy ước, lãnh thổ trung lập (chapter001_b/p000278, p000279) / giao dịch nội gián, phòng pháp chế, thực thi tuân thủ pháp luật (chapter001_b/p000280, p000281) / Trung đội 437 (chapter001_b/p000283, p000295) / nguyên tắc raison d’état của lục địa, phe Đỏ, *la France*, *raison d’humanité* (chapter001_b/p000284, p000285) / Đại tá von Lergen, hai vị trung tướng Zettour và Rudersdorf, Bộ Tổng tham mưu (chapter001_b/p000288, p000290) / điểm tập kết xuất phát, bên Tình báo, Weiss (chapter001_b/p000295) / Takeda Shingen, tường đá…⁵, Stalin (chapter001_b/p000297)"
  alternatives_vi:
  - bộ phận pháp lý (thay cho `phòng pháp chế` tại chapter001_b/p000280, p000281 — ưu tiên `phòng pháp chế` vì chuẩn thuật ngữ cơ cấu doanh nghiệp hiện đại khi đi cùng khái niệm `thực thi tuân thủ pháp luật` trong liên tưởng kiếp trước của Tanya) / lý do nhà nước (thay cho việc giữ nguyên cụm tiếng Pháp `raison d’état` tại chapter001_b/p000284, p000285 — ưu tiên giữ nguyên `raison d’état` và `*raison d’humanité*` để đồng bộ với tiền lệ từ Tập 2 và giữ nguyên phép chơi chữ tiếng Pháp với `*la France*` trong nguyên bản) / địa điểm tập kết (thay cho `điểm tập kết xuất phát` tại chapter001_b/p000295 — ưu tiên `điểm tập kết xuất phát` vì diễn đạt rõ bản chất quân sự của bàn đạp tập trung binh lực chuẩn bị triển khai tác chiến của Liên bang)
