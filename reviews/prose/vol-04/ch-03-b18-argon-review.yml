  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cơ quan và thuật ngữ quân sự/pháp lý đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b17` của Tập 4 (`Tanya`, `Tiegenhoff`, `nguy cơ bị bao vây`, `Lục quân Liên bang`, `hệ thống chỉ huy`, `Hồng quân`, `đám Cộng sản`, `Sở chỉ huy`, `cuộc tiến công lớn`, `Đại úy Weiss` / `Weiss`, `lực lượng tiếp viện` / `viện binh`, `xuất kích`, `đội tiên phong`, `Thiếu tá`, `quyền làm chủ bầu trời`, `đánh chặn`, `Sư đoàn số 3 và Sư đoàn số 32`, `sư đoàn bộ binh`, `Liên bang`, `khí tài hạng nặng`, `Tiểu đoàn Pháp sư Trên không số 203`, `tập trung binh lực`, `các đợt tấn công biển người`, `điều ước quốc tế`, `Luật chiến tranh`, `tác chiến trì hoãn`, `Serebryakov`, `Trung úy Grantz` / `Grantz`, `Bộ Tổng tham mưu`, `trận đánh cơ động`, `căn cứ tiền tiêu`, `lực lượng dự bị`, `Chỉ huy`, `mặt trận Rhine`, `quân đoàn`), đồng thời khóa tạm chú thích cuối sách `cuồng chiến¹²` và các cụm thuật ngữ tác chiến trong lô (`cơ động tác chiến`, `sở chỉ huy liên hợp`, `công tác chuẩn bị xuất kích khẩn cấp`, `Trinh sát đường không`, `đơn vị hạng nhẹ`, `lực lượng kỵ binh nhẹ truyền thống`, `đạo đức nghề nghiệp`)."
