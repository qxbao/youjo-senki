  proposed_vi: "Tanya, Tiegenhoff, cơ động tác chiến, nguy cơ bị bao vây, Lục quân Liên bang, hệ thống chỉ huy, Hồng quân, đám Cộng sản, Sở chỉ huy, cuộc tiến công lớn, Đại úy Weiss, cuồng chiến¹², sở chỉ huy liên hợp, các tư lệnh sư đoàn, lực lượng tiếp viện, viện binh, xuất kích, đội tiên phong, công tác chuẩn bị xuất kích khẩn cấp, Thiếu tá, quyền làm chủ bầu trời, đánh chặn, Sư đoàn số 3 và Sư đoàn số 32, Trinh sát đường không, sư đoàn bộ binh, Liên bang, khí tài hạng nặng, đơn vị hạng nhẹ, Tiểu đoàn Pháp sư Trên không số 203, tập trung binh lực, các đợt tấn công biển người, điều ước quốc tế, Luật chiến tranh, tác chiến trì hoãn, Serebryakov, Grantz, lực lượng kỵ binh nhẹ truyền thống, Bộ Tổng tham mưu, trận đánh cơ động, căn cứ tiền tiêu, lực lượng dự bị, Chỉ huy, Trung úy Grantz, mặt trận Rhine, quân đoàn, đạo đức nghề nghiệp (chapter001_l/p000442–p000445, p000447, p000449, p000451–p000474)"
  alternatives_vi:
  - cơ động binh lực (thay cho `cơ động tác chiến` tại chapter001_l/p000442 — ưu tiên `cơ động tác chiến` để đồng bộ với mạch thuật ngữ `kế hoạch cơ động` / `trận đánh cơ động` tại `vol-04-ch-03-b17`) / tác chiến làm chậm (thay cho `tác chiến trì hoãn` tại chapter001_l/p000465, p000468 — ưu tiên `tác chiến trì hoãn` vì chuẩn xác theo thuật ngữ quân sự đã dùng nhất quán từ Tập 1–3) / quy tắc đạo đức công việc (thay cho `đạo đức nghề nghiệp` tại chapter001_l/p000473 — ưu tiên `đạo đức nghề nghiệp` vì tự nhiên và lột tả đúng giọng điệu tư duy công sở của Tanya)
