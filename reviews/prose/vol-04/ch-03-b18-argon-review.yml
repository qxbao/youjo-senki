  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch tuyệt đối với `vol-04-ch-03-b17` ở cảnh tại Tiegenhoff (`Tanya` / `nó` trong trần thuật, `mình` / `chúng tôi` trong độc thoại nội tâm, `anh` cho Weiss và Grantz trong lời kể, `họ` cho đơn vị Đế quốc, `chúng` cho quân Liên bang, cùng hệ đối đáp chuẩn mực quân đội giữa Tanya với Serebryakov, Weiss và Grantz), đồng thời bảo toàn chính xác chỉ số chú thích `¹²` ở p000449 và vị trí nhấn mạnh in nghiêng duy nhất ở p000469."
