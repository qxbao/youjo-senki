- source_term: tiegenhoff_tanya_pov_narration_and_battalion_officers_dialogue_pronouns_and_emphasis_vol04_ch03_b18
  proposed_vi: "Trong toàn bộ lô `vol-04-ch-03-b18` (chapter001_l/p000442–p000474) tại Tiegenhoff với điểm nhìn của Thiếu tá Tanya Degurechaff cùng các cuộc trao đổi với Trung úy Serebryakov, Đại úy Weiss và Trung úy Grantz: tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b17`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya quy chiếu Tanya nhất quán bằng tên riêng `Tanya` và đại từ `nó` / `Nó` kết hợp phản thân `mình` / `bản thân` (p000442, p000451, p000453, p000454, p000459, p000466, p000469, p000474), tuyệt đối không dùng `cô` cho Tanya trong lời kể hay độc thoại nội tâm; trong câu độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng `mình` (p000449), và ngôi thứ nhất số nhiều chỉ tập thể lực lượng phòng thủ thành phố dùng `chúng tôi` (p000463). (2) Trong lời kể, quy chiếu Đại úy Weiss và Trung úy Grantz bằng `anh` (p000459, p000474), quy chiếu tập thể hai sư đoàn Đế quốc hoặc Tiểu đoàn 203 bằng `họ` / `Họ` (p000461, p000462, p000466, p000467, p000474), và quy chiếu quân địch Liên bang bằng `chúng` (p000443, p000444). (3) Trong hội thoại: Trung úy Serebryakov báo cáo với Tanya có tiểu từ kính ngữ `ạ` (p000447) và Tanya nhắc tới Đại úy Weiss ở ngôi thứ ba bằng `Anh ấy` (p000448); khi trao đổi trực tiếp với Đại úy Weiss (p000450, p000452, p000455–p000458, p000465, p000468, p000469), Tanya tự xưng `Tôi` / `tôi`, dùng `chúng ta` cho đơn vị và gọi Weiss là `Đại úy Weiss` / `anh`, còn Weiss tự xưng `Chúng tôi`, dùng `chúng ta` cho đơn vị và gọi Tanya là `thưa Thiếu tá` / `Thiếu tá` kèm `ạ`; khi đối đáp với Trung úy Grantz (p000470–p000473), Grantz gọi Tanya là `Chỉ huy` / `Thưa Chỉ huy` và `cô`, tự xưng `tôi` kèm `ạ`, còn Tanya gọi `Trung úy Grantz` và `Anh` / `anh`, tự xưng `tôi`. (4) Bảo toàn chính xác chỉ số chú thích trên cao `¹²` tại p000449 (`cuồng chiến¹²`) và duy nhất 1 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tại p000469 (`*Chưa kể là.*`), không phát sinh dấu `*` ngoài nguồn ở 32 đoạn còn lại."
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong câu độc thoại nội tâm của Tanya tại chapter001_l/p000463 — ưu tiên `chúng tôi` để giữ sắc thái tách biệt giữa nhận định nội tâm của Tanya và lời hiệu triệu `chúng ta` trong thoại trực tiếp tại p000465)
