  proposed_vi: "các đơn vị pháp sư, các sĩ quan chính trị, hỏa lực, pháo binh, bộ binh, hậu phương, không chiến, Moskva, Lục quân Liên bang, Đội bay của Lục quân Đế quốc, các lực lượng không quân, Liên bang, lực lượng ma pháp, lực lượng pháp sư (chapter001_l/p000370–p000376) / Sĩ quan Chobarkov, Bộ Dân ủy Nội vụ, điều trần, lẽ thường, công tác giáo dục tư tưởng¹¹, tiền tuyến, hệ tư tưởng (chapter001_l/p000377–p000386) / Cộng hòa, rút lui chiến thuật, vùng lõm hình bán nguyệt, Tiegenhoff, đơn vị pháp sư, quân tiếp viện, vòng vây, Đảng Cộng sản, giới tinh hoa của đảng, con dê tế thần, các sĩ quan quân sự, đi thị sát, kiến thức giáo dục quân sự (chapter001_l/p000387, p000389, p000390, p000392–p000394, p000397, p000399–p000401)"
