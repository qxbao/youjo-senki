  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cơ quan và thuật ngữ quân sự/chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b15` của Tập 4 (`các đơn vị pháp sư`, `các sĩ quan chính trị`, `hỏa lực`, `pháo binh`, `bộ binh`, `hậu phương`, `không chiến`, `Moskva`, `Lục quân Liên bang`, `Đội bay`, `Lục quân Đế quốc`, `các lực lượng không quân`, `Liên bang`, `Bộ Dân ủy Nội vụ`, `lẽ thường`, `tiền tuyến`, `hệ tư tưởng`, `Cộng hòa`, `rút lui chiến thuật`, `Tiegenhoff`, `quân tiếp viện`, `vòng vây`, `Đảng Cộng sản`, `con dê tế thần`), đồng thời khóa tạm các thuật ngữ và danh xưng mới xuất hiện trong lô (`lực lượng ma pháp` / `lực lượng pháp sư`, `Sĩ quan Chobarkov`, `công tác giáo dục tư tưởng¹¹`, `vùng lõm hình bán nguyệt`, `giới tinh hoa của đảng`, `các sĩ quan quân sự`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: federation_war_council_restricted_conversations_pronouns_and_emphasis_vol04_ch03_b16
  proposed_vi: "Trong phân cảnh các cuộc trò chuyện dè dặt giữa các sĩ quan quân sự và giữa các sĩ quan chính trị tại Sở chỉ huy Cụm Tiến công Chủ lực của Liên bang (chapter001_l/p000370–p000401): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b15`: (1) Trần thuật ngôi thứ ba khách quan và suy nghĩ tập thể tại Sở chỉ huy Cụm Tiến công Chủ lực (p000373–p000375, p000378, p000379, p000381–p000383, p000387–p000397, p000400, p000401): quy chiếu tập thể Lục quân Liên bang, các tướng lĩnh, sĩ quan quân sự và sĩ quan chính trị bằng đại từ trung tính `họ` / `Họ` / `bọn họ` kết hợp phản thân `mình`; quy chiếu vị sĩ quan thở dài tại p000381 bằng `ông`, và quy chiếu Sĩ quan Chobarkov tại p000377, p000379 bằng `anh ta`; trong suy nghĩ chung của các tướng lĩnh Liên bang (p000387, p000395), dùng `chúng` cho quân địch Đế quốc và `chúng ta` cho phía mình. (2) Lược đại từ ngôi thứ hai phiếm chỉ trong cấu trúc khái quát tại p000385 và p000399 theo quy ước `direct-address choice`. (3) Trong lời thoại trao đổi riêng giữa các sĩ quan quân sự và giữa các sĩ quan chính trị Liên bang (p000370–p000372, p000376, p000377, p000380, p000384–p000386, p000398, p000399): tự xưng `tôi` / `Tôi`, dùng `chúng ta` cho phía quân đội Liên bang, gọi người đối thoại cùng cấp là `đồng chí` (p000372, p000376, p000377) và quy chiếu quân địch Đế quốc bằng `đám người này` / `chúng` (p000371, p000399). (4) Bảo toàn chính xác chỉ số chú thích trên cao `¹¹` tại p000382 (`công tác giáo dục tư tưởng¹¹`) và phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại đúng 3 đoạn có thẻ in nghiêng trong nguồn là p000387 (`*Cuộc rút lui của Lục quân Đế quốc, giống như khi chúng đánh bại Cộng hòa, có lẽ nên được xem là một cuộc rút lui chiến thuật.*`), p000391 (`*Nhưng.*`) và p000395 (`*Chỉ cần một lời từ họ, đảng sẽ hiện thân, và chúng ta sẽ được cứu.*`), không phát sinh dấu `*` ngoài nguồn ở 29 đoạn còn lại."
  alternatives_vi:
  - anh (thay cho `ông` khi quy chiếu vị sĩ quan thở dài tại chapter001_l/p000381 — ưu tiên `ông` vì các sĩ quan tham dự hội đồng chiến tranh tại Sở chỉ huy Cụm Tiến công Chủ lực chủ yếu là các tướng lĩnh và sĩ quan cấp cao dày dạn kinh nghiệm)
