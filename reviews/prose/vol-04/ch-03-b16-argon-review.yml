  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch với `vol-04-ch-03-b15` tại Sở chỉ huy Cụm Tiến công Chủ lực của Liên bang: phân biệt rạch ròi giữa trần thuật khách quan (`họ` / `mình`, `ông`, `anh ta`), suy nghĩ nội tâm tập thể của các tướng lĩnh (`chúng ta` — `chúng`) và lời thoại trao đổi riêng giữa các sĩ quan cùng cấp (`tôi` – `đồng chí`, `chúng ta`), đồng thời bảo toàn chính xác chỉ số chú thích `¹¹` và cả 3 vị trí nhấn mạnh in nghiêng của nguyên tác."
