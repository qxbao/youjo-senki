  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ sự phân biệt rõ ràng giữa trần thuật ngôi thứ ba trang trọng (`ông`, `Họ` / `họ`), sự khử mơ hồ quy chiếu giữa hai chủ thể số nhiều ở p000098 (`Họ` – `giới sĩ quan ấy`), và giọng thoại điềm tĩnh, phảng phất phong thái quý tộc Anh của vị thủ tướng (`tôi` / `Tôi`, `chúng ta`, `tay phụ trách đối ngoại`)."
