  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, nhân vật, chức danh, công trình và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B14 Chương 2 của Tập 4 (`Liên bang`, `cuộc chiến tiêu hao`, `Đế quốc`, `thủ đô Liên bang`, `hậu phương`, `các tuyến chính`, `Khối Thịnh vượng chung`, `Lục quân Đế quốc`, `bên Tình báo`, `Moskva`, `sĩ khí`, `quán rượu`, `Habergram` / `Tướng Habergram`, `quốc ca Đế quốc`, `lá cờ đỏ` / `cờ đỏ`, `cờ Đế quốc`, `tệ sùng bái cá nhân`, `lăng mộ`, `các vị lãnh tụ cách mạng`, `cảnh sát mật`, `Điện Kremlin`, `giao lưu văn hóa`, `chính quốc`, `đồng minh`, `Cộng hòa Tự do`, `vị thủ tướng`, `Tướng de Lugo`, `kênh đào`), đồng thời khóa tạm các tổ hợp từ vựng trong phần đánh giá hệ lụy chiến lược tại mặt trận Liên bang, loạt lời đồn ở quán rượu và quyết định rút quân về bảo vệ chính quốc (`quốc gia chuyên chế`, `hạn chế tác chiến`, `trung tâm phát hành phim`, nhan đề phim `*Họ không tin vào những giọt nước mắt*`, `phòng thủ chính quốc`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: londinium_federation_assessment_and_prime_minister_decision_pronouns_vol04_ch02_b15
  proposed_vi: "Trong phần cuối cuộc họp nội các và chỉ huy quân sự Khối Thịnh vượng chung tại Londinium đánh giá hệ lụy từ cuộc tập kích Moskva đối với mặt trận Liên bang, điểm qua các lời đồn tại quán rượu và đi đến quyết định ưu tiên phòng thủ chính quốc (chapter001_h/p000088–p000118): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-02-b12` – `b14`: trần thuật ngôi thứ ba quy chiếu vị thủ tướng, Tướng Habergram và Tướng de Lugo bằng đại từ trang trọng `ông` (p000116) kết hợp tên riêng và chức danh/quân hàm xác định (`Habergram`, `Tướng Habergram`, `vị thủ tướng`, `Tướng de Lugo`) tại p000102, p000112, p000116, p000117; quy chiếu tập thể giới lãnh đạo/chỉ huy của Khối Thịnh vượng chung trong cuộc họp bằng `Họ` / `họ` (p000098, p000112, p000113, p000118) kết hợp đại từ phản thân `mình` (p000112), và quy chiếu phía Liên bang cùng giới sĩ quan Liên bang bằng `họ` / `giới sĩ quan ấy` (p000089, p000091, p000094, p000095, p000098) kết hợp đại từ phản thân `mình` (p000098); dùng chủ ngữ khái quát `Người ta` tại p000096. Trong đối thoại tại cuộc họp (p000088, p000091, p000093–p000095, p000100, p000101, p000115, p000117): các thành viên dự họp và vị thủ tướng dùng `Chúng ta` / `chúng ta` khi bàn về việc kiểm soát thông tin và quyết sách chung của Khối Thịnh vượng chung (p000088, p000100, p000115, p000117), dùng `Chúng tôi` khi đại diện bộ phận chức năng đồng thuận với nhận định tình báo (p000095); vị thủ tướng tự xưng `tôi` / `Tôi` (p000115, p000117) và dùng cách gọi thân mật kiểu quý tộc Anh `tay phụ trách đối ngoại của Cộng hòa Tự do` tại p000115"
  alternatives_vi:
  - họ (thay cho `giới sĩ quan ấy` ở câu thứ hai của chapter001_h/p000098 — ưu tiên `giới sĩ quan ấy` để phân biệt rạch ròi chủ thể chịu hạn chế tác chiến là các sĩ quan quân đội Liên bang với đại từ `Họ` đầu đoạn chỉ giới lãnh đạo Khối Thịnh vượng chung) / ngài đại diện ngoại giao (thay cho `tay phụ trách đối ngoại` tại chapter001_h/p000115 — ưu tiên `tay phụ trách đối ngoại` vì truyền tải sống động sắc thái khẩu ngữ quý tộc Anh của từ *foreign affairs chap* trong lời vị thủ tướng)
  segment_ids:
