  proposed_vi: "Liên bang, cuộc chiến tiêu hao, Đế quốc, thủ đô Liên bang, hậu phương, những tuyến chính, các tuyến chính (chapter001_h/p000088, p000089, p000090, p000092, p000094, p000097, p000111, p000112) / Khối Thịnh vượng chung, Lục quân Đế quốc, bên Tình báo (chapter001_h/p000090, p000092, p000095, p000096, p000099, p000101, p000103–p000110, p000112, p000118) / quốc gia chuyên chế, uy quyền chính trị và quân sự, các sĩ quan quân đội Liên bang, hạn chế tác chiến (chapter001_h/p000097, p000098) / Moskva, sĩ khí, quán rượu, Habergram, Tướng Habergram (chapter001_h/p000099, p000101–p000103, p000112) / quốc ca Đế quốc, ngọn cờ chiến thắng, lá cờ đỏ, cờ Đế quốc, trung tâm phát hành phim, cờ đỏ (chapter001_h/p000103–p000105) / tệ sùng bái cá nhân, lăng mộ, các vị lãnh tụ cách mạng, cảnh sát mật, truyền thông Liên bang, Điện Kremlin (chapter001_h/p000106–p000109) / Họ không tin vào những giọt nước mắt, giao lưu văn hóa (chapter001_h/p000110) / phòng thủ chính quốc, chính quốc, đồng minh, Cộng hòa Tự do, tay phụ trách đối ngoại, vị thủ tướng, Tướng de Lugo, kênh đào (chapter001_h/p000114–p000118)"
  alternatives_vi:
  - quốc gia độc đoán (thay cho `quốc gia chuyên chế` tại chapter001_h/p000097 — ưu tiên `quốc gia chuyên chế` vì chuẩn xác với sắc thái chính trị học của từ *despotic nation* khi Khối Thịnh vượng chung đánh giá thể chế cai trị của Liên bang) / phòng vệ bản thổ (thay cho `phòng thủ chính quốc` tại chapter001_h/p000114, p000117 — ưu tiên `phòng thủ chính quốc` vì bám sát từ *mainland defense* và đồng bộ trực tiếp với định danh `chính quốc của Khối Thịnh vượng chung` ở p000118 cũng như các tập trước)
