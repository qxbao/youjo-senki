  proposed_vi: "tội ác chiến tranh, Tanya, bốn điều kiện của lực lượng tham chiến, lực lượng chiến đấu không chính quy, các quy tắc và quy định chiến tranh, Hợp chúng quốc, đoàn giám sát nhân đạo, tù binh và thương binh, đại sứ quán, quốc gia trung lập, nước tham chiến, Stalin, trung gian trung thực, Bismarck, Fouché, sĩ quan Bộ Tổng tham mưu, chuyên gia pháp lý, giới chóp bu, Bộ Tư lệnh Tối cao, các chỉ huy tác chiến, Lục quân Đế quốc, thực địa, Bộ Tổng tham mưu, quân Đế quốc, tuyên truyền chống Đế quốc, Churchill, Trân Châu Cảng, Khối Thịnh vượng chung, Liên minh Hiệp ước, Đại Công quốc, Cộng hòa, Đế quốc, trung đoàn pháp sư trên không, quyền làm chủ bầu trời, trận chiến tiêu diệt hoàn toàn, lực lượng tình nguyện Hợp chúng quốc, Thiếu tá von Degurechaff (chapter001_r/p000110, p000113, p000114, p000118–p000122, p000125, p000126, p000128–p000130, p000132, p000133, p000136, p000143, p000145, p000148)"
  alternatives_vi:
  - bốn tiêu chuẩn của bên tham chiến (thay cho `bốn điều kiện của lực lượng tham chiến` tại chapter001_r/p000113 — ưu tiên `bốn điều kiện của lực lượng tham chiến` vì chuẩn xác theo thuật ngữ luật chiến tranh quốc tế khi xét tư cách pháp lý của cá nhân/đơn vị tham chiến) / nhóm quan sát nhân đạo (thay cho `đoàn giám sát nhân đạo` tại chapter001_r/p000114, p000118 — ưu tiên `đoàn giám sát nhân đạo` vì trang trọng, khớp văn phong ngoại giao chính thức của Hợp chúng quốc) / người môi giới trung thực (thay cho `trung gian trung thực` tại chapter001_r/p000121 — ưu tiên `trung gian trung thực` vì là cách dịch lịch sử – ngoại giao chuẩn mực gắn với điển tích Hội nghị Berlin của Bismarck)
