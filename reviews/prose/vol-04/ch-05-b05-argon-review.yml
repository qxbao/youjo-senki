- source_term: commanders_conference_tanya_pov_pronouns_generic_you_footnotes_and_six_emphases_vol04_ch05_b05
  proposed_vi: "Toàn bộ 39 đoạn trong `vol-04-ch-05-b05` (chapter001_r/p000110–p000148) nối tiếp trực tiếp cuộc họp các chỉ huy tác chiến bàn về tư cách pháp lý và phương án đối phó trung đoàn pháp sư tình nguyện Hợp chúng quốc từ cuối `vol-04-ch-05-b04`, tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`: (1) Tại p000118 và p000134 có đại từ ngôi thứ hai phiếm chỉ trong nguồn: chuyển sang cấu trúc phản thân/vô nhân xưng tự nhiên (`bảo vệ công dân nước mình` tại p000118; `chắc chắn có thể nói rằng` tại p000134) theo đúng quy ước `direct-address choice` trong `work/run-state/pending-terms.yml`. (2) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya: quy chiếu `Tanya` nhất quán bằng tên riêng và đại từ `nó` / `Nó` (p000110–p000112, p000114, p000118, p000126, p000129–p000131, p000133 — tuyệt đối không dùng `cô` / `cô ấy` cho Tanya trong lời kể hay độc thoại nội tâm); quy chiếu tập thể các sĩ quan chỉ huy, chuyên gia pháp lý, phía Hợp chúng quốc và các quốc gia đối địch bằng `họ` / `Họ` / `bọn họ` (p000111, p000118, p000125–p000127, p000134, p000137, p000146) và quy chiếu quân địch trong mệnh đề quan điểm của sĩ quan thực địa bằng `chúng` (p000125). (3) Trong độc thoại nội tâm và câu nhận định tự sự của Tanya (p000119–p000121, p000146): tự quy chiếu ngôi thứ nhất số ít bằng `Mình` (p000119, p000121) và ngôi thứ nhất số nhiều chỉ tập thể các chỉ huy đơn vị của mình bằng `chúng tôi` (p000146 — đồng bộ `vol-04-ch-05-b01` p000013 và `vol-04-ch-05-b02` p000050). (4) Trong hội thoại quân sự tại cuộc họp các chỉ huy tác chiến (p000113, p000114, p000116, p000117, p000122–p000124, p000128, p000132, p000135, p000136, p000141, p000143–p000145, p000147, p000148): Tanya (p000113, p000132, p000147) tự xưng `tôi`, dùng đại từ gộp `Chúng ta` / `chúng ta`, gọi các sĩ quan dự họp là `Các vị` (p000132 — đồng bộ `plural-address-p000076`) và dùng tiểu từ kính ngữ `ạ` khi xin phép phát biểu trước cấp chủ trì cuộc họp (p000147); các sĩ quan chỉ huy và chuyên gia pháp lý dùng đại từ gộp `chúng ta` / `người của ta`, quy chiếu phía Hợp chúng quốc / lực lượng pháp sư tình nguyện bằng `họ`, và gọi Tanya đúng quân hàm là `Thiếu tá von Degurechaff` (p000148). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 6 đoạn: p000120 (`*đó là công dân của chúng tôi*`), p000125 (`*Tất cả những gì chúng ta phải làm là bắn hạ chúng*`), p000129 (`*đồng tình hưởng ứng*`), p000130 (`*chúng ta không muốn khiêu khích họ*`), p000137 (`*Chà, nếu kẻ địch làm được, thì sao chúng ta lại không?*`), và p000138 (`*Nhưng*`), không phát sinh dấu `*` ngoài nguồn ở 33 đoạn còn lại; đồng thời bảo toàn chính xác 3 chỉ số chú thích trên cao `¹⁴`, `¹⁵`, `¹⁶` tại p000121."
  alternatives_vi:
  - Thế nên người ta chắc chắn có thể nói rằng (thay cho cấu trúc vô nhân xưng `Thế nên chắc chắn có thể nói rằng` tại chapter001_r/p000134 — ưu tiên `Thế nên chắc chắn có thể nói rằng` vì gọn, tự nhiên và tuân thủ quy ước `direct-address choice`)
