  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm, định danh quốc gia và cơ quan quân sự đã khóa tạm từ Tập 1–3, Chương 1–4 Tập 4 và `vol-04-ch-05-b01` → `vol-04-ch-05-b04` (`tội ác chiến tranh`, `Tanya`, `Hợp chúng quốc`, `sĩ quan Bộ Tổng tham mưu`, `chuyên gia pháp lý`, `giới chóp bu`, `Bộ Tư lệnh Tối cao`, `các chỉ huy tác chiến`, `Lục quân Đế quốc`, `thực địa`, `Bộ Tổng tham mưu`, `Khối Thịnh vượng chung`, `Liên minh Hiệp ước`, `Đại Công quốc`, `Cộng hòa`, `Đế quốc`, `trung đoàn pháp sư trên không`, `quyền làm chủ bầu trời`, `trận chiến tiêu diệt hoàn toàn`, `lực lượng tình nguyện Hợp chúng quốc`, `Thiếu tá von Degurechaff`), đồng thời khóa tạm các thuật ngữ luật chiến tranh quốc tế, ngoại giao và điển tích lịch sử mới phát sinh trong lô (`bốn điều kiện của lực lượng tham chiến`, `lực lượng chiến đấu không chính quy`, `các quy tắc và quy định chiến tranh`, `đoàn giám sát nhân đạo`, `Stalin`, `trung gian trung thực`, `Bismarck`, `Fouché`, `tuyên truyền chống Đế quốc`, `Churchill`, `Trân Châu Cảng`)."
