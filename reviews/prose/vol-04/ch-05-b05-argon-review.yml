  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, giữ đồng bộ hệ đại từ của Tanya (`nó` / `Nó` trong trần thuật, `Mình` trong nội tâm số ít, `chúng tôi` trong nhận định tự sự số nhiều, `tôi` / `chúng ta` / `Các vị` trong thoại hội nghị quân sự), xử lý tự nhiên hai đại từ ngôi thứ hai phiếm chỉ ở p000118 và p000134 theo `direct-address choice`, bảo toàn 3 chỉ số chú thích trên cao ở p000121 và phạm vi nhấn mạnh in nghiêng chính xác ở 6 đoạn p000120, p000125, p000129, p000130, p000137, p000138."
