- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000143
  locks:
  - "Giữ đại từ `chúng ta` và các cụm `Các chỉ huy ngoài thực địa`, `một trung đoàn pháp sư trên không dưới quyền chỉ huy của Khối Thịnh vượng chung`, `giành quyền làm chủ bầu trời`."
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000144
  locks:
  - "Giữ câu hỏi ngắn `“Vậy tức là sao?”`."
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000145
  locks:
  - "Giữ đại từ `chúng ta` / `Chúng ta` và các cụm `tiếp tục trận chiến tiêu diệt hoàn toàn`, `tăng số lượng quân địch dự kiến lên`, `khả năng xấu nhất là có sự hiện diện của lực lượng tình nguyện Hợp chúng quốc`."
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000146
  locks:
  - "Giữ các đại từ `họ`, `chúng tôi` (đồng bộ `vol-04-ch-05-b01` p000013 và `vol-04-ch-05-b02` p000050) và cụm `một kết luận tẻ nhạt, đậm chất thông báo hành chính vô cùng`."
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000147
  locks:
  - "Giữ đại từ `tôi` kèm tiểu từ kính ngữ `ạ` trong câu `“Nhìn chung tôi không có ý kiến phản đối nào, nhưng tôi xin phép nói một điều được không ạ?”`."
- segment_id: YS-LN04/Text/chapter001_r.xhtml/p000148
  locks:
  - "Giữ câu đáp và quân hàm `“Có chuyện gì vậy, Thiếu tá von Degurechaff?”`."
