  proposed_vi: "Liên bang, thủ đô địch, Bộ Tổng tham mưu, huân chương hạng nhất, Tiểu đoàn Pháp sư Trên không số 203, lá cờ Đế quốc, chiến công hạng nhất, vị chỉ huy tiểu đoàn, sĩ khí, đòn đánh lạc hướng (chapter001_h/p000149, p000151–p000153) / giảng hòa, Bộ Tư lệnh Tối cao, Bộ Ngoại giao, quốc gia trung lập, Lục quân Liên bang, Thần dân Đế quốc (chapter001_h/p000154, p000155, p000157, p000159, p000164, p000166) / bên Tình báo, các nhà ngoại giao, Cục Tác chiến, các tuyến chính, Cục Hậu cần, Bộ Tổng tham mưu Lục quân Đế quốc (chapter001_h/p000161–p000165, p000167) / mặt trận thứ hai, Đế quốc, tàn quân của Cộng hòa, Khối Thịnh vượng chung, phe thân Đế quốc, thanh trừng (chapter001_h/p000166–p000168) / bài toán hậu cần, phần tử theo chủ nghĩa dân tộc chống Đế quốc, Lục quân Đế quốc, các tuyến tiếp tế, sĩ quan tham mưu, các tập đoàn quân khu vực, bao vây và tiêu diệt (chapter001_h/p000171–p000174, p000177) / Degurechaff, Đại tá von Lergen, Tướng von Zettour, chó điên, sư tử điên, Lergen (chapter001_h/p000178, p000180, p000181)"
