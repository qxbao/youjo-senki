- source_term: imperial_general_staff_debate_and_lergen_monologue_pronouns_vol04_ch02_b17
  proposed_vi: "Trong phần kết cuộc thảo luận tại Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc về hệ lụy chiến lược sau cuộc tập kích Moskva và độc thoại nội tâm của Đại tá von Lergen (chapter001_h/p000149–p000183): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-02-b01` – `b05` cùng `b16`: (1) Trần thuật ngôi thứ ba đặt dưới điểm nhìn của tập thể Bộ Tổng tham mưu và Đại tá von Lergen, nên quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `cô` (p000149, p000150), danh xưng `vị chỉ huy tiểu đoàn` (p000152) và tên họ `Degurechaff` (p000178); còn trong độc thoại nội tâm đầy bức xúc pha lẫn kinh hãi của Lergen tại p000178 và p000180 dùng `cô ta` / `Cô ta`. (2) Quy chiếu Đại tá von Lergen và Tướng von Zettour trong trần thuật ngôi thứ ba bằng đại từ trang trọng `ông` / `Ông` kết hợp quân hàm – tên riêng (`Đại tá von Lergen`, `Tướng von Zettour`, `Lergen`) và đại từ phản thân `mình` (p000178, p000181, p000183); trong độc thoại nội tâm trực tiếp (p000178, p000179), Lergen tự quy chiếu ngôi thứ nhất số ít bằng `mình` và ngôi thứ nhất số nhiều bằng `chúng ta`. (3) Quy chiếu tập thể Bộ Tổng tham mưu, Tiểu đoàn 203 và phía Liên bang bằng `họ` / `Họ` kết hợp đại từ phản thân `mình` (p000162, p000172), riêng tại p000158 dùng `đối phương` / `người ta` cho phía Liên bang để phân biệt rạch ròi với chủ ngữ `họ` chỉ phía Đế quốc / Tiểu đoàn 203, tại p000162 dùng `bên ngoại giao` cho mệnh đề phụ để tránh nhập nhằng với tân ngữ `họ` chỉ quân đội, và tại p000177 dùng `chúng` cho quân địch trong đề xuất bao vây tiêu diệt ở phía đông. (4) Trong lời thoại của các sĩ quan tham mưu (p000151, p000154–p000156, p000161, p000163, p000164, p000167, p000170, p000173, p000175, p000177), người nói tự xưng `tôi` / `Tôi`, gọi đồng cấp là `Ông`, và dùng `Chúng ta` / `chúng ta` khi bàn về kế hoạch và phương hướng tác chiến chung của Đế quốc"
  alternatives_vi:
  - nó (thay cho `cô` trong trần thuật tại chapter001_h/p000149, p000150 hoặc thay cho `cô ta` / `Cô ta` trong độc thoại nội tâm của Lergen tại p000178, p000180 — bắt buộc giữ `cô` trong trần thuật và `cô ta` / `Cô ta` trong nội tâm của Lergen vì theo `DEC-P01-001` đại từ `nó` chỉ dùng cho trần thuật bám sát điểm nhìn của Tanya, còn ở đây điểm nhìn thuộc về Bộ Tổng tham mưu và Đại tá von Lergen, đồng bộ tuyệt đối với `vol-04-ch-02-b02` – `b05` và `b16`) / họ (thay cho `đối phương` / `người ta` ở chapter001_h/p000158 và `bên ngoại giao` ở p000162 — ưu tiên cách dịch khử mơ hồ chủ thể để câu văn sáng rõ, không trùng lặp đại từ `họ` của hai phe trong cùng một câu)
