  proposed_vi: "tự ý hành động / những hành động tự ý, sĩ quan Bộ Tổng tham mưu / Bộ Tổng tham mưu, phạm vi mệnh lệnh, tùy cơ ứng biến, bất tuân thượng lệnh, Zettour, Công tố viên, sĩ quan quân pháp / các sĩ quan quân pháp lục quân, lục quân, Tiểu đoàn Pháp sư Trên không số 203, phiên điều trần / quá trình điều trần / hội đồng điều trần, vai trò chủ trì / ghế chủ tọa, người dự thính, Thiếu tá von Degurechaff / Degurechaff, sĩ quan Lục quân Đế quốc, biên bản, Bộ Tư lệnh Tối cao, đòn phủ đầu, Cụm tập đoàn quân phía Đông, danh sách các cáo buộc, Lergen, đối tượng của phiên điều trần, tư cách sĩ quan, thành viên cốt cán, trò hề, hộp thuốc lá, bên bào chữa, chiếc búa gỗ, sự chênh lệch nhận thức nghiêm trọng, hậu phương, hậu phương trong nước, sĩ quan tham mưu, Cục Tác chiến, Lục quân Liên bang, trận đánh cơ động, tiền tuyến (chapter001_n/p000026–p000036, p000038–p000044, p000046–p000048)"
  alternatives_vi:
  - pháp quan quân sự / sĩ quan tư pháp (thay cho `sĩ quan quân pháp` tại chapter001_n/p000029–p000031, p000035, p000040, p000041, p000048 — ưu tiên `sĩ quan quân pháp` vì chuẩn xác theo thuật ngữ quân đội tiếng Việt và phân biệt rõ chức danh chuyên môn với vai trò `Công tố viên` trong phiên điều trần) / hậu phương nội địa (thay cho `hậu phương trong nước` tại chapter001_n/p000047 — ưu tiên `hậu phương trong nước` để vừa phân biệt tự nhiên với từ `hậu phương` đứng ngay trước trong cùng câu vừa giữ giọng văn mạch lạc) / tác chiến cơ động (thay cho `trận đánh cơ động` tại chapter001_n/p000047 — ưu tiên `một trận đánh cơ động đầy phá cách` để bám sát danh từ chỉ trận đánh cụ thể vừa tiêu diệt Lục quân Liên bang ở Chương 3)
