- source_term: lergen_pov_zettour_prosecutor_clash_pronouns_address_and_emphasis_vol04_ch04_b02
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` trong toàn bộ 23 đoạn của `vol-04-ch-04-b02` (chapter001_n/p000026–p000048) tại hội đồng điều trần ở Bộ Tổng tham mưu dưới điểm nhìn của Đại tá von Lergen: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen) và `DEC-P01-002`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, đại từ `ông` / `Ông` và đại từ phản thân `mình` (p000035, p000038, p000043, p000045–p000048); quy chiếu Trung tướng von Zettour bằng tên riêng `Zettour` và đại từ `ông` (p000027–p000032, p000038–p000040, p000042); quy chiếu Thiếu tá Tanya von Degurechaff từ góc nhìn khách quan của Lergen và hội đồng bằng `Thiếu tá von Degurechaff` / `Degurechaff` và đại từ `cô` (p000026, p000029, p000033, p000036, p000038); quy chiếu các sĩ quan Bộ Tổng tham mưu / các sĩ quan dự họp bằng `họ` (p000032, p000033, p000041, p000048; lưu ý từ `nó` ở câu cuối p000048 chỉ quy chiếu danh từ bất động vật là phiên điều trần); tại câu nhận định khái quát có đại từ ngôi thứ hai phiếm chỉ trong nguồn ở p000026, dùng chủ ngữ khái quát `người ta` theo quy ước `direct-address choice`. (2) Trong đối thoại và độc thoại nội tâm tại phiên điều trần: Trung tướng von Zettour khi răn đe vị sĩ quan quân pháp gọi chức danh `Công tố viên`, tự xưng `tôi` và gọi đối phương là `anh` / `Anh` (p000028, p000030); vị sĩ quan quân pháp (công tố viên) khi mở đầu cáo trạng trước hội đồng tự xưng `tôi` và quy chiếu Thiếu tá von Degurechaff ở ngôi thứ ba bằng `cô ấy` (p000034); Đại tá von Lergen tự nhủ và lẩm bẩm dùng `mình` ở câu cảm thán cá nhân (p000037) và dùng `chúng ta` khi tự vấn về tập thể quân đội – hậu phương Đế quốc (p000044, p000048). (3) Bảo toàn chính xác các giả định trái thực tế quá khứ (p000026, p000029, p000033, p000044, p000048), các câu hỏi tu từ / tự vấn (p000026, p000038, p000044, p000048), và cả 3 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000035 (`*Biết ngay mà.*`) và p000048 (`*Sao chúng ta lại đi đến bước đường này cơ chứ?*` cùng `*Tất cả những gì nó làm chỉ là khoét sâu thêm sự bất hòa mà thôi.*`), không phát sinh dấu `*` ngoài nguồn ở 21 đoạn còn lại."
  alternatives_vi:
  - lược chủ ngữ phiếm chỉ (thay cho chủ ngữ khái quát `người ta` trong cụm `Đó chính là điều người ta gọi là tùy cơ ứng biến` tại chapter001_n/p000026 — cả hai cách đều thuộc quy ước `direct-address choice`; ưu tiên `điều người ta gọi là` để nhịp văn xuôi tự nhiên, rõ nghĩa) / ông (thay cho `anh` khi Trung tướng von Zettour gọi vị công tố viên tại chapter001_n/p000030 — ưu tiên `anh` để phản ánh đúng vị thế áp đảo của một trung tướng thuộc Bộ Tổng tham mưu kiêm chủ tọa đang dằn mặt vị sĩ quan quân pháp cấp dưới)
