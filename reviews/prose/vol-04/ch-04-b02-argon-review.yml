  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, tiếp nối liền mạch `vol-04-ch-04-b01` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` cho Lergen, `ông` cho Zettour, `cô` / `cô ấy` cho Thiếu tá von Degurechaff trong góc nhìn khách quan của Lergen và lời công tố viên, `họ` cho các sĩ quan tham dự, `tôi – anh` khi Trung tướng von Zettour răn đe vị sĩ quan quân pháp), đồng thời bảo toàn chính xác các cấu trúc giả định quá khứ, câu hỏi tu từ và cả 3 vị trí nhấn mạnh in nghiêng tại p000035 và p000048."
