  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` (`tự ý hành động`, `sĩ quan Bộ Tổng tham mưu` / `Bộ Tổng tham mưu`, `Zettour`, `lục quân`, `Tiểu đoàn Pháp sư Trên không số 203`, `phiên điều trần` / `hội đồng điều trần`, `Thiếu tá von Degurechaff` / `Degurechaff`, `Lục quân Đế quốc`, `Bộ Tư lệnh Tối cao`, `Cụm tập đoàn quân phía Đông`, `Lergen`, `trò hề`, `búa gỗ`, `hậu phương`, `sĩ quan tham mưu`, `Cục Tác chiến`, `Lục quân Liên bang`, `tiền tuyến`), đồng thời khóa tạm các thuật ngữ pháp lý quân sự và chiến lược trong lô (`tùy cơ ứng biến`, `bất tuân thượng lệnh`, `Công tố viên`, `sĩ quan quân pháp` / `các sĩ quan quân pháp lục quân`, `người dự thính`, `biên bản`, `đòn phủ đầu`, `bên bào chữa`, `sự chênh lệch nhận thức nghiêm trọng`, `hậu phương trong nước`, `trận đánh cơ động`)."
