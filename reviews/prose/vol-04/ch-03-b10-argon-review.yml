  proposed_vi: "phe tự do, chiến tranh hạt nhân, chủ nghĩa Cộng sản, hậu phương (chapter001_l/p000171) / Thiếu tá (Thiếu tá von Degurechaff), Tanya, Đại úy (Đại úy Weiss / Weiss), pháo hạng nặng, mặt trận Rhine, đại pháo, tiền tuyến, Lục quân Liên bang (Liên bang) (chapter001_l/p000173–p000177, p000179–p000181, p000183–p000187, p000190–p000194, p000196) / Lục quân Cộng hòa, Lục quân Đế quốc, pháo binh, Tướng von Zettour, bộ binh, không ảnh, pháo kích (chapter001_l/p000177–p000179, p000184, p000195) / trận công thành, đám Cộng sản, các trận chiến cơ động, Tiegenhoff, vị trí tiền tiêu, nhiệm vụ cơ động (chapter001_l/p000182, p000184–p000186, p000194) / Trung úy Serebryakov (Serebryakov), các đơn vị tầm xa, pháo đường sắt, quyền làm chủ bầu trời, Tiểu đoàn Pháp sư Trên không số 203, trận địa pháo, hào giao thông, khẩu pháo Dora, Warsaw, công sự phòng thủ (chapter001_l/p000187–p000195)"
  alternatives_vi:
