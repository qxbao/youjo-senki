  volume: vol-04
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa trần thuật theo điểm nhìn của Tanya (`Nó` / `nó` cho Tanya, `anh` cho Weiss, `Họ` cho cánh pháo binh, `chúng` / `Chúng` cho quân Liên bang và pháo hạng nặng), nhận định nội tâm của Tanya (`người ta`, `chúng tôi` / `Chúng tôi`), và đối thoại quân vụ giữa chỉ huy tiểu đoàn với sĩ quan phó (`Tôi` – `thưa Đại úy` / `Đại úy Weiss` / `anh`, `tôi` – `Thiếu tá` / `thưa Thiếu tá von Degurechaff` / `cô` – `ạ`, `chúng ta`) cũng như với sĩ quan phụ tá (`tôi` – `Trung úy Serebryakov` / `Cô`, `Tôi` – `thưa Thiếu tá` – `ạ`, `chúng ta`)."
