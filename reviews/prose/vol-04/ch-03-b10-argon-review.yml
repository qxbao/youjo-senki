  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b09` của Tập 4 (`chủ nghĩa Cộng sản`, `đám Cộng sản`, `hậu phương`, `tiền tuyến`, `Thiếu tá` / `Thiếu tá von Degurechaff`, `Tanya`, `Đại úy` / `Đại úy Weiss` / `Weiss`, `pháo hạng nặng`, `mặt trận Rhine`, `Lục quân Liên bang` / `Liên bang`, `Lục quân Cộng hòa`, `Lục quân Đế quốc`, `pháo binh`, `Tướng von Zettour`, `bộ binh`, `không ảnh`, `Tiegenhoff`, `nhiệm vụ cơ động`, `Trung úy Serebryakov` / `Serebryakov`, `pháo đường sắt`, `quyền làm chủ bầu trời`, `Tiểu đoàn Pháp sư Trên không số 203`, `trận địa pháo`, `hào giao thông`), đồng thời khóa tạm các thuật ngữ trong phân cảnh Tanya đối chiếu không ảnh phát hiện sự vắng bóng pháo hạng nặng của Liên bang quanh Tiegenhoff và cảnh báo của Trung úy Serebryakov về tầm bắn của pháo đường sắt dọc biên giới (`phe tự do`, `chiến tranh hạt nhân`, `đại pháo`, `trận công thành`, `các trận chiến cơ động`, `vị trí tiền tiêu`, `các đơn vị tầm xa`, `khẩu pháo Dora`, `Warsaw`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: camp_21_battalion_hq_artillery_and_railway_gun_debate_pronouns_and_emphasis_vol04_ch03_b10
  proposed_vi: "Trong phân cảnh phân tích sự vắng bóng pháo hạng nặng của Liên bang quanh Tiegenhoff và tranh luận về mối đe dọa từ pháo đường sắt tại sở chỉ huy Tiểu đoàn 203 (chapter001_l/p000171–p000196): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b07` – `b09`: (1) Trần thuật ngôi thứ ba theo điểm nhìn của Tanya quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `Nó` / `nó` (p000171, p000196) kết hợp tên riêng `Tanya` (p000171, p000176, p000177, p000179, p000183, p000187, p000193, p000196); quy chiếu Đại úy Weiss bằng tên riêng `Weiss` và đại từ `anh` (p000176, p000183, p000187, p000193); quy chiếu Trung úy Serebryakov bằng tên riêng `Serebryakov` (p000187, p000191, p000195); quy chiếu chung Tanya và Weiss tại p000187 bằng `họ` / `hai người`; quy chiếu cánh pháo binh bằng `Họ` (p000178), và quy chiếu quân Liên bang / đám Cộng sản cùng các khẩu pháo hạng nặng bằng `chúng` / `Chúng` (p000177, p000181, p000184, p000195). (2) Trong các câu nhận định nội tâm và đánh giá chiến thuật của Tanya (p000172, p000176, p000181, p000184, p000195): dùng chủ ngữ khái quát `người ta` cho đại từ ngôi thứ hai phiếm chỉ trong các câu nhận định chung (p000172, p000176), và dùng ngôi thứ nhất số nhiều `chúng tôi` / `Chúng tôi` khi đại diện cho phía đơn vị/quân Đế quốc (p000181, p000184, p000195); đồng thời bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại hai cụm có thẻ in nghiêng trong nguồn là câu biểu thị thái độ qua nét mặt của Tanya ở p000179 (`*Tôi đã đoán đúng mà!*`) và thán từ sực tỉnh ở cuối p000196 (`*Ồ.*`), không phát sinh dấu `*` ngoài nguồn ở 24 đoạn còn lại. (3) Trong đối thoại quân vụ tại sở chỉ huy tiểu đoàn: giữa Tanya và Đại úy Weiss (p000173–p000177, p000179, p000182, p000185, p000186), Tanya gọi Weiss là `thưa Đại úy` / `Đại úy Weiss` / `anh`, tự xưng `Tôi` và dùng `chúng ta` / `quân ta` (p000174, p000177, p000179, p000185), còn Đại úy Weiss gọi Tanya là `Thiếu tá` / `thưa Thiếu tá von Degurechaff` và đại từ ngôi thứ hai `cô` (p000173, p000175, p000186), tự xưng `tôi`, dùng `chúng ta`, quy chiếu quân Liên bang bằng `chúng` (p000182), và thêm tiểu từ lễ phép `ạ` (p000173, p000175, p000186); giữa Tanya và Trung úy Serebryakov (p000188–p000190, p000192, p000194), Tanya gọi `Trung úy Serebryakov` / `Cô`, tự xưng `tôi`, dùng `chúng ta` và quy chiếu quân địch bằng `chúng` (p000189), còn Serebryakov gọi Tanya là `thưa Thiếu tá` / `Thưa Thiếu tá`, tự xưng `Tôi`, dùng `chúng ta`, quy chiếu quân Liên bang bằng `chúng`, và thêm tiểu từ lễ phép `ạ` (p000188, p000190, p000192, p000194)."
  alternatives_vi:
  - cô (thay cho `Nó` / `nó` trong trần thuật bám sát điểm nhìn của Tanya tại chapter001_l/p000171, p000196 — bắt buộc giữ `Nó` / `nó` trong trần thuật của Tanya theo đúng quy định đã duyệt tại `DEC-P01-001`) / cậu (thay cho `anh` khi Tanya nói chuyện với Đại úy Weiss tại chapter001_l/p000177 — bắt buộc giữ `anh` để đồng bộ tuyệt đối với cách xưng hô quân vụ giữa Tanya và Weiss ở `ch-03-b08` – `b09` và xuyên suốt Tập 1–4)
