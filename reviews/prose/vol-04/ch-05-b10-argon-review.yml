  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000297"
    choices:
      - "Thoại Tanya đáp Serebryakov: gọi 'cô', khóa cấp bậc 'Trung úy Serebryakov' và định danh 'Đài Kiểm soát'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000298"
    choices:
      - "Trần thuật dùng 'nó' / 'mình' (Tanya, DEC-P01-001) và 'Họ' (đơn vị); khóa 'súng trường bắn tỉa xuyên giáp', 'lựu đạn cầm tay', 'các cơ sở dưới mặt đất', 'bộc phá lõm'; bảo toàn nhấn mạnh Markdown cho câu độc thoại nội tâm '*Chúng ta sắp đánh một trận chiến xa hoa thật đấy.*' (DEC-P01-002)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000299"
    choices:
      - "Trần thuật về Tanya dùng 'nó' / 'Nó' (DEC-P01-001); bảo toàn nhấn mạnh Markdown cho câu nội tâm '*Xét về tổng thể thì chẳng hiệu quả chút nào, nhưng tình thế tiến thoái lưỡng nan ở đây là như vậy lại khá tiện lợi cho những người ngoài thực địa.*' (DEC-P01-002)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000300"
    choices:
      - "Trần thuật dùng 'nó' (Tanya, DEC-P01-001) và 'họ' (đơn vị); khóa 'Tiểu đoàn Pháp sư Trên không số 203', 'vùng lục địa chính của Khối Thịnh vượng chung' và 'nhiệm vụ thử nghiệm tấn công mặt đất'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000301"
    choices:
      - "Trần thuật giữ tên riêng 'Tanya'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000302"
    choices:
      - "Trần thuật về Tanya dùng 'Nó' / 'nó' (DEC-P01-001), giữ tình thái suy đoán 'Có lẽ vì không có đủ dữ liệu khí tượng' và khóa địa danh 'Eo biển Chim Dodo'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000303"
    choices:
      - "Thoại vô tuyến của Tanya: khóa mã gọi 'Fairy 01', 'Đài Kiểm soát Galba' và khẩu lệnh liên lạc 'Nghe rõ trả lời!'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000304"
    choices:
      - "Trần thuật về Tanya dùng 'Nó' (DEC-P01-001) và giữ mệnh đề phủ định 'nhưng chẳng có tiếng trả lời'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000305"
    choices:
      - "Thoại Tanya: giữ câu nhận định phủ định 'Không ăn thua rồi…', thuật ngữ 'Nhiễu khí quyển sao?' và đánh giá cảm thán cuối câu."
