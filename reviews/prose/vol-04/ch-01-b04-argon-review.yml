  - "Giữ câu chuyển ý ngắn gọn: `Và đó là lý do tại sao.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000083
  locks:
  - "Giữ lời dẫn mở đầu `Có hơi nhắc đi nhắc lại`, địa danh `lục địa phía nam`, thời hạn `chưa đầy sáu tháng`, đại từ `Nó` / `của mình`, và cụm `đơn vị pháp sư` nhận lệnh trở về nước theo `đợt luân chuyển phân công định kỳ`."
