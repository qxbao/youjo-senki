- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000085
  locks:
  - "Giữ đại từ `nó`, tên `Tướng von Romel` và phép điệp `rốt cuộc, rốt cuộc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000086
  locks:
