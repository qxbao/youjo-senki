- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000087
  locks:
  - "Giữ lời đáp hóm hỉnh mà lễ phép của Tanya: `người bạn thân mến của chúng ta`, xưng hô `tôi` – `ngài` kèm `ạ`, và quy chiếu de Lugo là `ông ta` (`đá văng chiếc gối của ông ta đi`)."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000088
  locks:
  - "Giữ đại từ `Ông` quy chiếu Romel, cấu trúc giả định quá khứ `Nếu người đó là Tướng von Zettour thì hẳn Tanya đã phải dè dặt không dám nói đùa như thế`, cùng sự phân tách đại từ `nó` (trần thuật) và `mình` (nội tâm tự quy chiếu)."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000089
  locks:
  - "Giữ đại từ `nó`, dấu ba chấm lửng, địa danh `mặt trận phía nam` và đại từ tự quy chiếu `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000090
  locks:
  - "Giữ sự đối sánh tại lục địa ấy (chỉ huy xuất sắc, binh lực tương đương, `binh sĩ Đế quốc` kỷ luật tốt hơn), hình ảnh `con chó bại trận` và nhận định thực lực quân địch thấp hơn vẻ bề ngoài trên lý thuyết."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000091
  locks:
  - "Giữ ẩn dụ `Một bầy cừu do sư tử dẫn dắt có thể rốt cuộc sẽ hóa thành đàn sói…` và mệnh đề điều kiện trái chiều về việc bầy cừu bị đánh bại trước khi con sư tử kịp dẫn đi bất cứ đâu khiến công cuộc tái huấn luyện chẳng mấy suôn sẻ."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000092
  locks:
  - "Giữ chi tiết vấn đề hậu cần giữa sa mạc đứng đầu là tiếp cận nguồn nước, câu hỏi tu từ liệt kê ba việc (đánh đập quân địch, thu về huân chương, dư dả thời gian huấn luyện binh lính) và kết luận khó nghĩ ra hoàn cảnh nào lý tưởng hơn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000093
  locks:
  - "Giữ địa danh `lục địa phía nam`, đại từ `nó` / `mình` và cụm `tương lai tươi sáng của công tác hậu phương`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000094
  locks:
  - "Giữ cụm `lãnh thổ chính quốc của Đế quốc`, đại từ `Nó` / `nó` / `mình`, và mốc thời gian mới chỉ vài giờ trôi qua kể từ lúc cất cánh."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000095
  locks:
  - "Giữ đại từ `Nó`, thời hạn thảnh thơi một tháng trong lúc `Đế quốc` tái tổ chức lực lượng, và kỳ vọng tận hưởng mùa xuân tại `Đế quốc` cho tới ít nhất là `tháng Tư`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000096
  locks:
  - "Giữ đại từ `nó` / `mình`, tên `Lục quân Cộng hòa`, cụm `cuộc chiến giả¹` (bảo toàn ký hiệu chú thích `¹`), tên `Khối Thịnh vượng chung` và hình ảnh `kỳ nghỉ phép có lương`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000097
  locks:
  - "Giữ dấu ba chấm mở đầu và từ trong ngoặc kép: `…Phải, chỉ là “tưởng tượng”.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000098
  locks:
  - "Giữ quan hệ tỷ lệ nghịch giữa số quyền tự do mà người lính có được với vô vàn nghĩa vụ của họ."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000099
  locks:
  - "Giữ phạm vi nhấn mạnh `*...*` cho đúng ba câu độc thoại nội tâm đầu đoạn với đại từ `mình` và thuật ngữ `các công ty quân sự tư nhân`, tách bạch với câu trần thuật cuối đoạn không in nghiêng theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000100
  locks:
  - "Giữ đại từ `nó`, cụm `tổ quốc` và `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000101
  locks:
  - "Giữ cụm `luật lệ chiến tranh`, tên `Liên bang` chưa phê chuẩn nhiều điều khoản và cụm `vùng xám pháp lý`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000102
  locks:
  - "Giữ câu hỏi tu từ về việc người lính chống lệnh trừ phi một việc rõ ràng vi phạm pháp luật, đại từ `Nó` / `nó` và tên `Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000103
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Nhưng thế này thì vẫn bất công quá.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000104
  locks:
  - "Giữ tên `Tanya` và đại từ tự quy chiếu `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000105
  locks:
  - "Giữ cụm in nghiêng `*Một chiến dịch nhắm vào Liên bang…*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000106
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, chú thích mỉa mai trong ngoặc `(hiểu là: “tra tấn”)` và danh xưng `những người Cộng sản`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000107
  locks:
  - "Giữ đại từ `Chúng tôi`, tên `Liên bang` và nhận định châm biếm về hình thức chính quyền mà ngay cả `những người Cộng sản` cũng khó lòng xây dựng nổi trong khi vẫn giữ được toàn mạng."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000108
  locks:
  - "Giữ nhận định nếu còn hy vọng trở về lành lặn thì đây không phải lúc làm qua loa đại khái."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000109
  locks:
  - "Giữ lời gọi của Tanya: `“Đại úy Weiss, anh có rảnh một lát không?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000110
  locks:
  - "Giữ câu đáp của Weiss: `“Có, thưa Thiếu tá!”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000111
  locks:
  - "Giữ cụm `vị phó chỉ huy đáng tin cậy của mình`, hành động liếc nhìn giờ trên đồng hồ đeo tay và chữ `May thay…` ở cuối đoạn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000112
  locks:
  - "Giữ câu nối tiếp có dấu ba chấm mở đầu: `…đây không phải là lúc bất tiện.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000113
  locks:
  - "Giữ lời gọi lịch sự của Tanya với Weiss: `“Xin lỗi, nhưng anh có thể lại đây một chút được không?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000114
  locks:
  - "Giữ cụm `Chiếc máy bay vận tải`, `trang thiết bị xâm nhập tầm thấp`, `vũ khí cùng đạn dược`, và `pháp sư trên không`."
