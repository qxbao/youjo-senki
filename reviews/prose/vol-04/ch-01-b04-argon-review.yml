  proposed_vi: "lục địa phía nam, đơn vị pháp sư, đợt luân chuyển phân công định kỳ (chapter001_b/p000083, p000093) / Bộ Tổng tham mưu, Tướng von Zettour (chapter001_b/p000084, p000088, p000102) / Tướng von Romel, de Lugo (chapter001_b/p000085, p000086) / mặt trận phía nam (chapter001_b/p000089) / công tác hậu phương, lãnh thổ chính quốc của Đế quốc (chapter001_b/p000093, p000094) / Lục quân Cộng hòa, cuộc chiến giả¹, Khối Thịnh vượng chung (chapter001_b/p000096) / các công ty quân sự tư nhân (chapter001_b/p000099) / Liên bang, luật lệ chiến tranh, vùng xám pháp lý (chapter001_b/p000100, p000101, p000105, p000107) / những người Cộng sản (chapter001_b/p000106, p000107) / Đại úy Weiss, phó chỉ huy (chapter001_b/p000109, p000111) / máy bay vận tải, trang thiết bị xâm nhập tầm thấp, pháp sư trên không (chapter001_b/p000114)"
  alternatives_vi:
  - đợt luân phiên điều động định kỳ (thay cho `đợt luân chuyển phân công định kỳ` tại chapter001_b/p000083 — ưu tiên `đợt luân chuyển phân công định kỳ` vì bám sát nghĩa điều chuyển vị trí công tác theo chu kỳ của đơn vị) / bản thổ Đế quốc (thay cho `lãnh thổ chính quốc của Đế quốc` tại chapter001_b/p000094 — ưu tiên `lãnh thổ chính quốc của Đế quốc` để đồng bộ với các tập trước khi phân biệt vùng lãnh thổ chính quốc với chiến trường hải ngoại/thuộc địa) / thiết bị đổ bộ độ cao thấp (thay cho `trang thiết bị xâm nhập tầm thấp` tại chapter001_b/p000114 — ưu tiên `trang thiết bị xâm nhập tầm thấp` vì phản ánh chuẩn xác tính chất nhiệm vụ thâm nhập bí mật qua biên giới ở độ cao thấp)
