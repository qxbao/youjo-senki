  volume: vol-04
  chapter: 1
  rationale: "Kế thừa nhất quán các thuật ngữ và danh xưng đã khóa tạm từ Tập 1–3 cùng B01–B03 của Tập 4 (`lục địa phía nam`, `Bộ Tổng tham mưu`, `Tướng von Zettour`, `Tướng von Romel`, `de Lugo`, `mặt trận phía nam`, `lãnh thổ chính quốc của Đế quốc`, `Lục quân Cộng hòa`, `cuộc chiến giả`, `Khối Thịnh vượng chung`, `Liên bang`, `những người Cộng sản`, `Đại úy Weiss`, `phó chỉ huy`, `pháp sư trên không`), đồng thời khóa tạm các cụm thuật ngữ tác chiến và kinh tế – quân sự trong batch (`đợt luân chuyển phân công định kỳ`, `các công ty quân sự tư nhân`, `trang thiết bị xâm nhập tầm thấp`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_romel_weiss_pronouns_and_address_vol04_ch01_b04
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000083–p000085, p000088, p000089, p000093–p000096, p000100, p000102), quy chiếu Tướng von Zettour và Tướng von Romel bằng `ông` (chapter001_b/p000084, p000088); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000083, p000088, p000089, p000093–p000096, p000099, p000104, p000111) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị dùng `chúng tôi` (chapter001_b/p000106, p000107); trong đối thoại chia tay tại chiến trường phía nam: Tướng von Romel gọi Tanya là `cô` và nhắc đến `de Lugo` (chapter001_b/p000086), Tanya đáp lại cấp trên bằng `tôi` – `ngài` kèm `ạ`, quy chiếu chung giữa hai người là `chúng ta` và quy chiếu de Lugo là `ông ta` (chapter001_b/p000087); trong đối thoại trên máy bay vận tải: Tanya gọi phó chỉ huy là `Đại úy Weiss` và `anh` (chapter001_b/p000109, p000113), Weiss đáp lễ chuẩn quân phong `Có, thưa Thiếu tá!` (chapter001_b/p000110)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong suy nghĩ của Tanya về nguy cơ toàn đơn vị bị bắt tại chapter001_b/p000106, p000107 — ưu tiên `chúng tôi` để đồng bộ với cách Tanya tự quy chiếu tập thể Tiểu đoàn 203 ở B01 và B03) / hắn (thay cho `ông ta` khi Tanya nhắc tới de Lugo trước mặt Tướng von Romel tại chapter001_b/p000087 — ưu tiên `ông ta` để giữ đúng sắc thái mỉa mai lịch thiệp kiểu sĩ quan trong lời bông đùa với cấp trên)
