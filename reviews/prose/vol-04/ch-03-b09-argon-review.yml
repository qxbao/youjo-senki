  proposed_vi: "Tiegenhoff, Thiếu tá, Bộ Tổng tham mưu, xuất kích (chapter001_l/p000136, p000137, p000140–p000142, p000145, p000146, p000148–p000151, p000153, p000155, p000170) / Trung tướng von Zettour (Tướng von Zettour), Trung tướng von Rudersdorf, chủ trương giảm thiểu thiệt hại (chapter001_l/p000138, p000157) / Đại úy Weiss (Weiss / Đại úy), Tanya, Cụm tập đoàn quân phía Đông, địa hình then chốt, hậu phương, biên giới phía đông, kế hoạch phòng thủ ban đầu, điểm tập kết (chapter001_l/p000140–p000142, p000146, p000148, p000149, p000155, p000156, p000160, p000161, p000168–p000170) / Trung úy Serebryakov (Serebryakov / Visha), người sĩ quan phụ tá, Trung úy Grantz, trận rút lui toàn diện, vị trí sống còn, đầu mối giao thông, tuyến giao thương, thành phố cảng, chi viện đường biển, trận chiến cơ động (chapter001_l/p000147–p000149, p000151, p000152, p000159, p000161, p000163, p000170) / binh lính Đế quốc, Liên bang, tác chiến đô thị, pháo hạng nặng, Cộng hòa, pháo công thành (chapter001_l/p000153, p000156, p000157) / các đạo quân phía đông, không ảnh, sĩ quan thông tin liên lạc, chiến sĩ tự do, chủ nghĩa Cộng sản, người theo chủ nghĩa tự do, đám Cộng sản, kết quả trinh sát, Sư đoàn số 3 và Sư đoàn số 32 (chapter001_l/p000160, p000162, p000164, p000166, p000167, p000169)"
