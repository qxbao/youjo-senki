  volume: vol-04
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa trần thuật theo điểm nhìn của Tanya (`nó` cho Tanya, `anh` cho Weiss, `họ` cho các tướng lĩnh và đơn vị), độc thoại nội tâm của Tanya (`mình`, `chúng tôi`, `Người ta`), và đối thoại quân vụ giữa chỉ huy tiểu đoàn với sĩ quan phó (`tôi` / `Tôi` – `Đại úy Weiss` / `anh`, `Tôi` – `Thiếu tá` – `ạ`, `chúng ta`) cũng như với sĩ quan phụ tá (`tôi` – `Trung úy Serebryakov`, `Visha`, `tôi` – `Thiếu tá` / `Đại úy` / `hai vị` – `ạ`, `anh ấy` cho Grantz, `anh ta` cho sĩ quan liên lạc)."
