  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b08` của Tập 4 (`Tiegenhoff`, `Thiếu tá`, `Bộ Tổng tham mưu`, `Trung tướng von Zettour` / `Tướng von Zettour`, `Trung tướng von Rudersdorf`, `Đại úy Weiss` / `Weiss` / `Đại úy`, `Tanya`, `Cụm tập đoàn quân phía Đông`, `hậu phương`, `biên giới phía đông`, `điểm tập kết`, `Trung úy Serebryakov` / `Serebryakov` / `Visha`, `sĩ quan phụ tá`, `Trung úy Grantz`, `đầu mối giao thông`, `binh lính Đế quốc`, `Liên bang`, `tác chiến đô thị`, `pháo hạng nặng`, `Cộng hòa`, `các đạo quân phía đông`, `sĩ quan thông tin liên lạc`, `chiến sĩ tự do`, `chủ nghĩa Cộng sản`, `đám Cộng sản`, `Sư đoàn số 3 và Sư đoàn số 32`), đồng thời khóa tạm các tổ hợp thuật ngữ trong phân cảnh Tanya nhận ra giá trị địa hình của Tiegenhoff trên bản đồ và quyết định lập phương án giải cứu (`chủ trương giảm thiểu thiệt hại`, `địa hình then chốt`, `trận rút lui toàn diện`, `vị trí sống còn`, `chi viện đường biển`, `trận chiến cơ động`, `pháo công thành`, `không ảnh`, `người theo chủ nghĩa tự do`, `kết quả trinh sát`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: camp_21_battalion_hq_tiegenhoff_map_analysis_pronouns_and_emphasis_vol04_ch03_b09
  proposed_vi: "Trong phân cảnh phân tích bản đồ Tiegenhoff và lập phương án giải cứu tại sở chỉ huy Tiểu đoàn 203 (chapter001_l/p000136–p000170): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b07` – `b08`: (1) Trần thuật ngôi thứ ba theo điểm nhìn của Tanya quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` (p000142) kết hợp tên riêng `Tanya` (p000140, p000148, p000168, p000170); quy chiếu Đại úy Weiss bằng tên riêng `Weiss` và đại từ `anh` (p000140, p000146, p000161, p000170); quy chiếu Trung úy Serebryakov bằng tên riêng `Serebryakov` và danh ngữ `người sĩ quan phụ tá` (p000148, p000161, p000170); quy chiếu các vị tướng Bộ Tổng tham mưu, các đạo quân phía đông và hai sư đoàn bị vây bằng `họ` (p000138, p000146, p000156, p000162). (2) Trong cụm độc thoại nội tâm trực tiếp in nghiêng tại p000168 (`*Nếu đã vậy thì…*` — bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002`, không phát sinh dấu `*` ngoài nguồn ở 34 đoạn còn lại) và các câu suy nghĩ ngôi thứ nhất của Tanya (p000138, p000139, p000141, p000162, p000166, p000167): tự quy chiếu ngôi thứ nhất số ít bằng `mình` (p000138, p000139, p000166), ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `chúng tôi` (p000141, p000162, p000166), và dùng chủ ngữ khái quát `Người ta` cho đại từ ngôi thứ hai phiếm chỉ trong câu nhận định chung tại p000167. (3) Trong đối thoại quân vụ tại sở chỉ huy tiểu đoàn: giữa Tanya và Đại úy Weiss (p000137, p000140, p000143, p000145, p000149, p000150, p000153–p000155, p000169, p000170), Tanya tự xưng `tôi` / `Tôi`, gọi Weiss là `Đại úy Weiss` / `anh` (p000149, p000153, p000155, p000169), dùng `chúng ta` / `Chúng ta` khi nói về đơn vị và đồng bào Đế quốc (p000153, p000169, p000170), còn Weiss gọi Tanya là `Thiếu tá`, tự xưng `Tôi`, dùng `chúng ta` / `quân ta`, và thêm tiểu từ lễ phép `ạ` (p000137, p000140, p000150, p000154); giữa Tanya, Đại úy Weiss và Trung úy Serebryakov (p000136, p000144, p000147, p000148, p000158–p000160, p000163–p000165), Tanya gọi `Trung úy Serebryakov` và tự xưng `tôi` (p000147), Weiss gọi thân mật theo tên `Visha` ở câu hỏi trực tiếp (p000159 — tiếp nối cách gọi tự nhiên của Weiss ở các chương trước), còn Serebryakov thưa với Tanya là `Vâng, thưa Thiếu tá` (p000148), thưa với Weiss là `thưa Đại úy` (p000160), gọi chung hai cấp trên đang chờ là `hai vị` (p000158), tự xưng `tôi`, dùng `chúng ta`, quy chiếu Trung úy Grantz bằng `anh ấy`, quy chiếu viên sĩ quan thông tin liên lạc của đạo quân phía đông bằng `anh ta` (p000164), và dùng tiểu từ lễ phép `ạ` (p000144, p000158, p000160, p000164). Bảo toàn ký hiệu chú thích `¹⁰` tại cuối p000142."
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật bám sát điểm nhìn của Tanya tại chapter001_l/p000142 — bắt buộc giữ `nó` trong trần thuật và `mình` trong nội tâm của Tanya theo đúng quy định đã duyệt tại `DEC-P01-001`) / cậu (thay cho `anh` khi Tanya nói chuyện với Đại úy Weiss tại chapter001_l/p000149, p000153, p000155 — bắt buộc giữ `anh` để đồng bộ tuyệt đối với cách xưng hô quân vụ giữa Tanya và Weiss xuyên suốt Tập 1–4)
