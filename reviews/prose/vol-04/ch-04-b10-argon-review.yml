- source_term: federation_politburo_resolution_and_john_tractor_shopping_pronouns_address_and_emphasis_vol04_ch04_b10
  proposed_vi: "Toàn bộ 41 đoạn của `vol-04-ch-04-b10` (chapter001_n/p000285–p000325) gồm hai phân cảnh nối tiếp (phần kết cuộc họp thượng tầng Liên bang tại căn hầm ngầm dưới Moskva ở p000285–p000306 và chuyến đàm phán mua sắm “máy kéo” của John tại một nhà máy ở Hợp chúng quốc ở p000307–p000325), tuân thủ nghiêm ngặt giới hạn chủ thể của `DEC-P01-001` (Tanya không xuất hiện trong cả hai cảnh; tuyệt đối không dùng đại từ `nó` cho bất kỳ nhân vật nào, từ `Nó` / `nó` tại p000311–p000313 hoàn toàn chỉ quy chiếu danh từ bất động vật là mẫu “máy kéo” mới nhất), `DEC-P01-002` và `canon/style-guide.md`: (1) Trong phân cảnh cuộc họp thượng tầng Liên bang (p000285–p000306): ở trần thuật ngôi thứ ba và độc thoại nội tâm tập thể, quy chiếu các ủy viên và chính ủy tham dự bằng `bọn họ` / `họ` / `Họ` kết hợp phản thân `mình` (p000288, p000289, p000293, p000294, p000297, p000298, p000302, p000303), dùng đại từ gộp `Chúng ta` / `chúng ta` trong câu hỏi nội tâm tập thể ở p000289, quy chiếu Loria bằng `Đồng chí Loria` / `Ông ta` (p000289) và `Loria` (p000293), quy chiếu Josef bằng `Đồng chí Tổng Bí thư Josef` / `vị tổng bí thư` (p000289), quy chiếu đám phiến loạn bị tống giam trong góc nhìn của các chính ủy ở p000298 bằng `chúng`, quy chiếu công dân Liên bang ở p000306 bằng `họ`, và dịch thoát tự nhiên các đại từ ngôi thứ hai phiếm chỉ ở p000297 và p000305 bằng cấu trúc vô nhân xưng (`Có thể nói`, `có được một lựa chọn thôi cũng đã là khá may mắn rồi`) theo quy ước `direct-address choice`; trong đối thoại tại cuộc họp, người tham dự phản đối tự xưng `tôi` (p000285), Loria (p000290, p000292, p000295) tự xưng `tôi` / `Tôi`, gọi người đảng viên phản đối là `Đồng chí` / `đồng chí`, dùng `chúng ta` cho tập thể đảng và thưa `Thưa Đồng chí Tổng Bí thư Josef, ý đồng chí thế nào?`, còn Tổng Bí thư Josef (p000296) gọi Loria là `Đồng chí` / `Đồng chí hãy...`. (2) Trong phân cảnh đàm phán mua sắm tại nhà máy Hợp chúng quốc (p000307–p000325): ở trần thuật ngôi thứ ba, quy chiếu điệp viên/đại diện mua sắm của Khối Thịnh vượng chung `John` bằng `anh` kết hợp phản thân `mình` (p000309, p000310 — đồng bộ hoàn toàn với `vol-03-ch-02-b19` và `vol-03-ch-06-b10`), quy chiếu tay nhân viên bán hàng của nhà máy bằng `Anh ta` (p000321), quy chiếu phía Khối Thịnh vượng chung và phía công ty/nhà máy Hợp chúng quốc bằng `họ` (p000311, p000313, p000322), quy chiếu mẫu máy kéo mới ở p000311–p000313 bằng `Nó` / `nó` và các mẫu máy kéo cũ ở p000324–p000325 bằng `chúng`, đồng thời chuyển đại từ ngôi thứ hai phiếm chỉ ở p000320 thành chủ ngữ khái quát `người ta`; trong đối thoại thương mại, nhân viên bán hàng (p000312, p000316, p000319) gọi John theo bí danh giao dịch là `Ông Johnson` / `ông`, tự xưng `tôi` và đại diện công ty xưng `chúng tôi` / `Chúng tôi`, còn John (p000315, p000318, p000323) tự xưng `Tôi` / `tôi`, đại diện bên mua xưng `chúng tôi` và gọi nhân viên bán hàng cùng phía công ty là `anh` / `các anh`. (3) Bảo toàn chính xác cấu trúc tăng tiến `không những... mà còn...` giữ cùng chủ thể `chúng` tại p000324, các mệnh đề giả định và điều kiện trái thực tế (p000286, p000289, p000293, p000294, p000298, p000299, p000305, p000312, p000316, p000317, p000322), và toàn bộ 2 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000287 (bọc toàn bộ câu hỏi nội tâm) và p000289 (chỉ bọc ba câu hỏi nội tâm ở nửa sau đoạn, hai câu trần thuật đầu đoạn nằm ngoài dấu `*`), không phát sinh dấu `*` ngoài nguồn ở 39 đoạn còn lại."
  alternatives_vi:
  - ngài (thay cho đại từ ngôi thứ hai `ông` khi nhân viên bán hàng gọi John là `Ông Johnson` / `ông` tại chapter001_n/p000312, p000319 — ưu tiên `Ông Johnson` / `ông` vì phản ánh tự nhiên văn phong giao dịch thương mại dân sự tại nhà máy Hợp chúng quốc)
