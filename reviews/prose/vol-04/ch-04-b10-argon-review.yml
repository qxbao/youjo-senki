  volume: vol-04
  chapter: 4
  rationale: "Kế thừa đồng bộ hệ thống danh xưng, địa danh, chính thể, cơ quan và thuật ngữ quân sự – chính trị đã khóa tạm từ các tập trước và Chương 1–4 của Tập 4 (`Liên bang`, `Đảng Cộng sản` tại ch-03-b17, `Đồng chí Tổng Bí thư Josef` / `vị tổng bí thư`, `Đồng chí Loria` / `Loria`, `sức chiến đấu`, `Moskva`, `trại tập trung` tại ch-04-b09 p000284, `Đế quốc`, `chính ủy` tại ch-03-b15 và ch-04-b09, `thanh trừng`, `NĂM THỐNG NHẤT`, `chủ nghĩa tư bản` / `nhà tư bản`, `John` tại vol-03-ch-02-b19 và ch-06-b10, `Khối Thịnh vượng chung`, `Hợp chúng quốc` tại Tập 2–3), đồng thời khóa tạm các thuật ngữ, định danh và cụm ẩn dụ thương mại – quân sự mới phát sinh trong lô (`kẻ thù của nhà nước`, `phần tử bất đồng chính kiến`, `Bộ Chính trị`, `sĩ quan và binh lính ma pháp`, dòng tiêu đề `MỘT NGÀY TRONG THÁNG 4, NĂM THỐNG NHẤT 1926, ĐÂU ĐÓ TẠI MỘT QUỐC GIA NỌ`, `thánh đường tối cao của chủ nghĩa tư bản`, `Philadel`, `“máy kéo”` / `máy kéo`, `mã lực`, bí danh `Ông Johnson`, `bí mật công nghiệp`, `Lục quân Hợp chúng quốc`, `quốc gia “trung lập”`, `danh sách “không được mua”`)."
