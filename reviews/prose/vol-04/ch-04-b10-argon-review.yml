  proposed_vi: "Liên bang, Đảng Cộng sản, Đồng chí Tổng Bí thư Josef / vị tổng bí thư, Đồng chí Loria / Loria, sức chiến đấu, Moskva, trại tập trung, Đế quốc, chính ủy, kẻ thù của nhà nước, thanh trừng, phần tử bất đồng chính kiến, Bộ Chính trị, sĩ quan và binh lính ma pháp, công dân Liên bang, MỘT NGÀY TRONG THÁNG 4, NĂM THỐNG NHẤT 1926, ĐÂU ĐÓ TẠI MỘT QUỐC GIA NỌ, thánh đường tối cao của chủ nghĩa tư bản / chủ nghĩa tư bản / nhà tư bản, John / Ông Johnson, Philadel, “máy kéo” / máy kéo, 41,9 tấn, năm trăm mã lực / bốn trăm mã lực, Khối Thịnh vượng chung, Hợp chúng quốc, bí mật công nghiệp, Lục quân Hợp chúng quốc, quốc gia “trung lập”, danh sách “không được mua” (chapter001_n/p000286, p000289, p000292–p000298, p000302–p000304, p000306, p000307, p000309–p000315, p000317, p000318, p000320, p000321, p000324, p000325)"
