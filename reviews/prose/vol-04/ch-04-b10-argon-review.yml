  - "Giữ cụm trong dấu nháy đơn `‘mẫu máy kéo mới nhất’` và cặp đại từ `Tôi` – `công ty anh`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000316
  locks:
  - "Giữ đại từ `chúng tôi`, cụm `nhu cầu trong nước` và dấu chấm lửng bỏ lửng cuối câu."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000317
  locks:
  - "Giữ danh xưng `Lục quân Hợp chúng quốc`, dấu gạch ngang dài giải thích, và hai từ trong ngoặc kép `“máy kéo”`, `quốc gia “trung lập”`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000318
  locks:
  - "Giữ tên riêng `Philadel`, các đại từ `Tôi`, `chúng tôi`, `các anh` và câu hỏi đuôi `phải không?`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000319
  locks:
  - "Giữ cặp đại từ `ông` – `Chúng tôi` và cụm `một mẫu cũ hơn`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000320
  locks:
  - "Giữ các cụm `tay nhân viên bán hàng`, `nhà tư bản`, tên riêng `John` và chủ ngữ khái quát `người ta`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000321
  locks:
  - "Giữ đại từ `Anh ta` và cụm `những chiếc máy kéo cũ hơn một chút`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000322
  locks:
  - "Giữ đại từ `họ`, cụm `các dây chuyền sản xuất` và phần bổ sung sau dấu gạch ngang dài `—ít nhất là đối với bên bán`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000323
  locks:
  - "Giữ thán từ `Than ôi`, đại từ `tôi`, cụm `sa mạc hay những vùng khí hậu nóng ẩm` và vế nhấn mạnh sau dấu gạch ngang dài `—và tệ nhất là chúng rất yếu`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000324
  locks:
  - "Giữ tên riêng `John`, cụm `danh sách “không được mua”` và cấu trúc tăng tiến cùng chủ thể `chúng không những mỏng manh mà còn chẳng có chút uy lực công kích nào`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000325
  locks:
  - "Giữ hai từ trong ngoặc kép `thứ “máy kéo” như vậy hoàn toàn chẳng thể gọi là “máy kéo”`, thông số `bốn trăm mã lực` và đại từ `chúng`."
