  - YS-LN04/Text/chapter001_b.xhtml/p000080
  - YS-LN04/Text/chapter001_b.xhtml/p000081
  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và phản ánh chính xác đợt thăng quân hàm của các sĩ quan Tiểu đoàn 203 ở Tập 4 theo hệ thống cấp bậc chuẩn của dự án (`thiếu úy` -> `trung úy` -> `đại úy`)."
