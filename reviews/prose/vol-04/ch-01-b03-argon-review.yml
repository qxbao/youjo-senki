  - YS-LN04/Text/chapter001_b.xhtml/p000081
  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ các thuật ngữ quân sự và danh xưng đã khóa tạm từ Tập 1–3 và B01–B02 của Tập 4 (`lục địa phía nam`, `Tướng von Romel`, `Đại tá von Lergen`, `Cục Tác chiến`, `Bộ Tổng tham mưu`, `Tiểu đoàn Pháp sư Trên không số 203`, `Cụm tập đoàn quân phía Đông`, `đội tác chiến đặc biệt`), đồng thời khóa tạm các thuật ngữ tác chiến, trang bị và liên hệ lịch sử kiếp trước của Tanya (`ban Trinh sát Chiến lược`, `khu tập kết`, `quả cầu tác chiến dự phòng`, `thao trường diễn tập`, `tiêm kích Zero`, `lực lượng phòng vệ thuộc địa của Hà Lan`, `pháo-kích-kèm-nguy-cơ-mưa-xác-chết`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: promoted_ranks_and_narration_pronouns_vol04_ch01_b03
  proposed_vi: "Cập nhật cấp bậc mới đầu Tập 4 cho các sĩ quan Tiểu đoàn 203: `hai trung úy nhẹ dạ là Grantz và Serebryakov` (chapter001_b/p000068, đã thăng từ thiếu úy lên trung úy) và `Đại úy Weiss` (chapter001_b/p000071, đã thăng từ trung úy lên đại úy), giữ nguyên `Thiếu tá Tanya von Degurechaff` (chapter001_b/p000080); trần thuật quy chiếu Tanya bằng `nó` (chapter001_b/p000051, p000056, p000061, p000064, p000075–p000077, p000080–p000081), Đại tá von Lergen bằng `ông` (chapter001_b/p000052), Serebryakov bằng `cô` (chapter001_b/p000070) và Đại úy Weiss bằng `anh` (chapter001_b/p000071); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000052, p000056, p000074, p000076, p000079) và ngôi thứ nhất số nhiều chỉ tập thể Tiểu đoàn 203 dùng `chúng tôi` (chapter001_b/p000056, p000074); trong thoại Tanya báo cáo Lergen dùng `chúng tôi` kèm `ạ` (chapter001_b/p000051) và khi nói bông đùa với thuộc cấp trên máy bay dùng `chúng ta` (chapter001_b/p000075)"
  alternatives_vi:
  - thượng úy (thay cho `trung úy` đối với Grantz và Serebryakov tại chapter001_b/p000068 — không chọn vì hệ thống quân hàm của dự án ánh xạ nhất quán cấp bậc trên thiếu úy và dưới đại úy là `trung úy`, như Weiss ở Tập 1–3 trước khi thăng lên `Đại úy` ở Tập 4)
  segment_ids:
