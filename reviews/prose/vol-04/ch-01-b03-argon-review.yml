locked_choices:
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000051
  locks:
  - "Giữ lời báo cáo của Tanya (`chúng tôi` – `ạ`), địa danh `lục địa phía nam`, tên và cấp bậc `Tướng von Romel`, cùng câu trần thuật giả định quá khứ `Đáng lẽ nó không nên mẫn cán báo cáo rằng thương vong rất ít như thế`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000052
  locks:
  - "Giữ đại từ nội tâm `mình` ở câu đầu (`Chuyện đã qua rồi nói lại thì lúc nào chẳng sáng tỏ, nhưng mình đã không né được một nhiệm vụ mà lẽ ra có thể tránh khỏi`) và câu trần thuật về `Đại tá von Lergen` (`ông`) tìm được kẻ để ép gánh vác một nhiệm vụ bất khả thi."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000053
  locks:
  - "Giữ câu ngắn: `Đó chính là khoảnh khắc mọi chuyện bắt đầu đổ bể.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000054
  locks:
  - "Giữ ước lượng thời gian: `Có lẽ chuyện đó chỉ mất chừng một tiếng đồng hồ.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000055
  locks:
  - "Giữ chi tiết một sĩ quan từ `ban Trinh sát Chiến lược thuộc Cục Tác chiến` xuất hiện với nụ cười và chạy bước nhỏ tới khi `Đại tá von Lergen` vẫy tay gọi, cùng cảm nhận của `Tanya` rằng có gì đó chẳng lành nhưng đã quá muộn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000056
  locks:
  - "Giữ cấu trúc giả định quá khứ `Đáng lẽ nó phải báo với Bộ Tổng tham mưu rằng đơn vị của mình đã kiệt sức và không đủ điều kiện tham chiến`, tên `Tiểu đoàn Pháp sư Trên không số 203`, cụm `chuỗi chỉ huy thuộc cụm tập đoàn quân khu vực` và đại từ `chúng tôi` khi nói về đặc quyền tự chọn nhiệm vụ cũng như việc không thể từ chối mệnh lệnh từ `Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000057
  locks:
  - "Giữ sự đối lập giữa việc thông thường sẽ có người trong chuỗi chỉ huy bác bỏ ý tưởng vì quá liều lĩnh với việc trong nội bộ `Bộ Tổng tham mưu`, theo nguyên tắc bảo mật, chuyện này phải giữ kín giữa người ra lệnh và `Tanya`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000058
  locks:
  - "Giữ nhận định không có cơ hội nào cho bên thứ ba can thiệp."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000059
  locks:
  - "Giữ dấu nhấn mạnh `*Nhờ ơn chuyện đó…*` đúng phạm vi thẻ `<em>` trong nguồn theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000060
  locks:
  - "Giữ dấu ba chấm mở đầu và tình cảnh hiện tại của `Tanya` đang mắc kẹt với việc chỉ huy một đội quân sự bí ẩn nào đó thực hiện nhiệm vụ mật vượt qua biên giới."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000061
  locks:
  - "Giữ câu đính chính thời gian ở tương lai gần với đại từ `nó`: `Nói chính xác hơn thì nó sắp phải làm vậy.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000062
  locks:
  - "Giữ chi tiết về mặt danh nghĩa, `Tanya` và những người khác trên chiếc `máy bay vận tải` đang bay qua `vùng biên giới phía đông Đế quốc` để diễn tập."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000063
  locks:
  - "Giữ nhận định kể cả khi đó chỉ là cái cớ chính thức thì hiện tại vị thế của họ vẫn là như vậy."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000064
  locks:
  - "Giữ đại từ `Nó` đã thông báo với các thuộc cấp theo chỉ thị từ cấp trên rằng lệnh diễn tập này đột ngột được gửi đến từ `Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000065
  locks:
  - "Giữ câu khẳng định chắc chắn chẳng một ai tin vào điều đó."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000066
  locks:
  - "Giữ thuật ngữ `khu tập kết`, chi tiết bị tống vội lên phi cơ mà `Bộ Tổng tham mưu` cho chờ sẵn cùng mệnh lệnh `“diễn tập”` đáng ngờ tột độ rồi cất cánh mà không được biết đang đi đâu."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000067
  locks:
  - "Giữ câu hỏi tu từ về chiếc `máy bay vận tải` lại còn là `phi cơ tác chiến đặc biệt` được trang bị cho các cuộc `cơ động ban đêm`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000068
  locks:
  - "Giữ cấp bậc đã thăng ở Tập 4 trong cụm `hai trung úy nhẹ dạ là Grantz và Serebryakov` và nhận định ai nấy đều nhận ra mệnh lệnh ẩn chứa nhiều uẩn khúc hơn vẻ bề ngoài."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000069
  locks:
  - "Giữ hành động của các sĩ quan dày dạn kinh nghiệm vơ vội bất cứ thứ gì chạm tay tới trong khoảng thời gian ngắn ngủi trước khi lên máy bay."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000070
  locks:
  - "Giữ chi tiết `Grantz` phụ trách vũ khí và đạn dược quẳng `những quả cầu tác chiến dự phòng` cùng `cơ số đạn đầy đủ` lên máy bay, còn `Serebryakov` (`cô`) mải mê kiểm tra `bộ điện đài` khéo léo kiếm chác được từ đâu đó."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000071
  locks:
  - "Giữ cấp bậc mới `Đại úy Weiss`, đại từ `anh`, sự so sánh bị quay như chong chóng chẳng kém gì `Tanya`, và hành động nhét thứ khoái khẩu của các `cựu binh trinh sát tầm xa`—`những thanh sô-cô-la`—vào ba lô của các đơn vị thuộc quyền."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000072
  locks:
  - "Giữ tên `Tiểu đoàn Pháp sư Trên không số 203` và chi tiết các thành viên đều biết cách định hướng đường bay."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000073
  locks:
  - "Giữ chi tiết định hướng ban đêm bằng kiến thức thiên văn học, nhận ra đang bay về `biên giới phía đông`, sự tự chủ của người lính và câu hỏi in nghiêng trong ánh mắt thắc mắc `*Chẳng phải thao trường diễn tập của Cụm tập đoàn quân phía Đông nằm ở hướng khác hay sao?*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000074
  locks:
  - "Giữ đại từ nội tâm `Mình` và đại từ tập thể `chúng tôi`, cùng cụm `phi công lái máy bay thuộc một đội tác chiến đặc biệt` và `thao trường diễn tập`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000075
  locks:
  - "Giữ câu nói vờ ngây ngô của `Tanya` (`chúng ta`), đại từ trần thuật `nó`, và chi tiết toàn bộ thuộc cấp đều biết ngay trước lúc cất cánh `nó` vừa trò chuyện sâu với một `sĩ quan thông tin từ ban Trinh sát Chiến lược thuộc Cục Tác chiến` về một `“việc vặt cá nhân”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000076
  locks:
  - "Giữ đại từ `nó` / `của mình` khi hy vọng lính tráng hùa theo diễn kịch và cảm thấy biết ơn vì chỉ dừng lại ở những ánh nhìn dò hỏi."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000077
  locks:
  - "Giữ cấu trúc giả định quá khứ `nếu biết trước mọi chuyện sẽ kết thúc thế này, thì đáng lẽ nó nên tiếp tục đùa giỡn với đội quân thuộc địa lỗi thời kia giữa sa mạc mênh mông rộng mở`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000078
  locks:
  - "Giữ phép so sánh liên hệ lịch sử kiếp trước: dùng `tiêm kích Zero` để áp đảo `lực lượng phòng vệ thuộc địa của Hà Lan`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000079
  locks:
  - "Giữ mốc thời gian `Hồi tháng Chín năm ngoái`, đại từ nội tâm `mình`, và sự đối sánh giữa `mặt trận phía đông lầy lội` với lời tán dương `sa mạc muôn năm`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000080
  locks:
  - "Giữ định danh `Thiếu tá Tanya von Degurechaff là một cựu binh…`, đại từ `Nó` không còn non nớt để tìm thấy sự lãng mạn trong chiến tranh, và quan điểm hỗ trợ đồng minh hùng mạnh nghiền nát kẻ thù yếu ớt đáng chuộng hơn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000081
  locks:
  - "Giữ đại từ `Nó` / `nó`, cụm ghép gạch nối `pháo-kích-kèm-nguy-cơ-mưa-xác-chết`, ước mong hòa bình của `Tanya` và mong muốn làm một `công việc trí thức phi bạo lực` bình yên vô sự ở `hậu phương`."
