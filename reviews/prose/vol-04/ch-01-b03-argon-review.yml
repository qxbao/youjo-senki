  proposed_vi: "lục địa phía nam, Tướng von Romel (chapter001_b/p000051) / Đại tá von Lergen (chapter001_b/p000052, p000055) / ban Trinh sát Chiến lược thuộc Cục Tác chiến, sĩ quan thông tin (chapter001_b/p000055, p000075) / Bộ Tổng tham mưu, Tiểu đoàn Pháp sư Trên không số 203, chuỗi chỉ huy thuộc cụm tập đoàn quân khu vực (chapter001_b/p000056, p000057, p000064, p000066, p000072) / khu tập kết (chapter001_b/p000066) / phi cơ tác chiến đặc biệt, cơ động ban đêm (chapter001_b/p000067) / những quả cầu tác chiến dự phòng, cơ số đạn đầy đủ, bộ điện đài (chapter001_b/p000070) / cựu binh trinh sát tầm xa (chapter001_b/p000071) / thao trường diễn tập, Cụm tập đoàn quân phía Đông, đội tác chiến đặc biệt (chapter001_b/p000073, p000074) / đội quân thuộc địa lỗi thời (chapter001_b/p000077) / tiêm kích Zero, lực lượng phòng vệ thuộc địa của Hà Lan (chapter001_b/p000078) / mặt trận phía đông lầy lội (chapter001_b/p000079) / pháo-kích-kèm-nguy-cơ-mưa-xác-chết, công việc trí thức phi bạo lực (chapter001_b/p000081)"
  alternatives_vi:
  - phòng Trinh sát Chiến lược (thay cho `ban Trinh sát Chiến lược` tại chapter001_b/p000055, p000075 — ưu tiên `ban Trinh sát Chiến lược` vì trực thuộc `Cục Tác chiến` trong Bộ Tổng tham mưu, giúp phân tầng cấp bậc hành chính rõ ràng) / bãi tập kết (thay cho `khu tập kết` tại chapter001_b/p000066 — ưu tiên `khu tập kết` vì trang trọng và chuẩn xác hơn trong ngữ cảnh quân sự) / quả cầu tính toán tác chiến dự phòng (thay cho `quả cầu tác chiến dự phòng` tại chapter001_b/p000070 — ưu tiên `quả cầu tác chiến dự phòng` vì bám sát cách gọi gọn chỉ loại quả cầu dùng cho thực chiến đối lập với loại huấn luyện) / bãi tập diễn tập (thay cho `thao trường diễn tập` tại chapter001_b/p000073, p000074 — ưu tiên `thao trường diễn tập` vì tự nhiên và chuẩn thuật ngữ quân sự)
