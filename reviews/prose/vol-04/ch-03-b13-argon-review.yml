  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b12` của Tập 4 (`tàn quân địch`, `Bộ Tổng tham mưu`, `Thiếu tá von Degurechaff`, `tiểu đoàn`, `Tiểu đoàn 203` / `Tiểu đoàn Pháp sư Trên không số 203`, `nhiệm vụ cơ động`, `Tanya`, `lục địa phía Nam`, `Thiếu tá Hofen` / `Hofen`, `sĩ quan tham mưu`, `pháp sư`, `học viện chiến tranh`, `học viện`, `sĩ quan Bộ Tổng tham mưu`, tiêu đề ngày/địa điểm `NGÀY 28 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, PHÒNG TÁC CHIẾN`, `đơn vị tiên phong`, `Tiegenhoff`, `Sư đoàn số 3`, `Sư đoàn số 32`, `Thượng đế`, `vòng vây`, `đơn vị cơ giới`, `bộ binh tiêu chuẩn`, `Rudersdorf`, `Phó cục trưởng Cục Tác chiến`, `hỏa lực chi viện`, `Lục quân Liên bang`, `Nữ thần May mắn`, `Đế quốc`, `Zettour`, `Tướng von Rudersdorf`, `các tuyến tiếp tế`), đồng thời khóa tạm các cụm từ mới xuất hiện trong lô (`sĩ quan trẻ con`, `giai thoại trên chiến trường`, `chứng xơ vữa động mạch`)."
