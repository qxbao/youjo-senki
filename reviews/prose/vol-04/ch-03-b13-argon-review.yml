- source_term: tiegenhoff_hofen_farewell_and_war_room_perspective_pronouns_and_emphasis_vol04_ch03_b13
  proposed_vi: "Trong phân cảnh chia tay giữa Thiếu tá Hofen với Thiếu tá Tanya von Degurechaff tại Tiegenhoff, cuộc trò chuyện giữa Hofen với thuộc cấp và cảnh hân hoan tại Phòng Tác chiến Bộ Tổng tham mưu (chapter001_l/p000259–p000297): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b01` – `b12`: (1) Trong phân cảnh đối thoại và điểm nhìn của Tanya (p000259–p000271): trần thuật bám sát điểm nhìn của Tanya quy chiếu Tanya bằng đại từ `nó` (p000267) kết hợp tên riêng `Tanya` (p000262, p000267, p000271), quy chiếu Thiếu tá Hofen bằng `ông` (p000262, p000265) và các đơn vị / thuộc cấp bằng `họ` (p000262, p000271); trong lời thoại giữa hai thiếu tá chỉ huy tiểu đoàn, Tanya tự xưng `tôi` / `Tôi` và `chúng tôi` / `Chúng tôi`, gọi Hofen là `Thiếu tá Hofen` (p000260, p000263, p000269), còn Hofen tự xưng `tôi` / `Tôi` và `chúng tôi` / `Chúng tôi` / `bọn tôi`, gọi Tanya lịch sự là `Thiếu tá` / `Thiếu tá von Degurechaff` / `cô` và gọi tập thể Tiểu đoàn 203 là `các vị` (p000259, p000261, p000264, p000268, p000270). (2) Trong phân cảnh điểm nhìn khách quan của Thiếu tá Hofen sau khi Tanya rời đi (p000272–p000285): tuân thủ giới hạn của `DEC-P01-001` (không mở rộng `nó` sang điểm nhìn của nhân vật khác), trần thuật và suy nghĩ theo góc nhìn của Hofen quy chiếu Tanya bằng `cô` (p000272, p000282), quy chiếu Hofen bằng `ông` kết hợp phản thân `mình` (p000272, p000275, p000276, p000280–p000282) và quy chiếu người thuộc cấp bằng `anh ta` (p000275); trong đối thoại, thuộc cấp gọi Hofen là `Chỉ huy` / `Thiếu tá` kèm kính ngữ `ạ` và quy chiếu Tanya là `cô ấy` (p000273, p000279, p000284), còn Hofen tự xưng `tôi` / `chúng ta`, quy chiếu Tanya là `cô ấy` và quân địch là `chúng` (p000274, p000278, p000285). (3) Trong phân cảnh Phòng Tác chiến Bộ Tổng tham mưu (p000286–p000297): trần thuật khách quan quy chiếu Trung tướng von Rudersdorf bằng `ông` (p000294) và các đơn vị / Bộ Tổng tham mưu bằng `họ` (p000293, p000297); trong lời thoại, các sĩ quan tham mưu và Rudersdorf dùng `chúng tôi` / `chúng ta` và gọi Rudersdorf là `Tướng von Rudersdorf` (p000287, p000290, p000291, p000295, p000296 — đồng bộ `ch-03-b01` – `b04`). (4) Bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại đúng 2 đoạn có thẻ in nghiêng trong nguồn là p000271 (`*Được rồi, sang công việc tiếp theo thôi.*`) và p000272 (`*Thiệt tình*`), không phát sinh dấu `*` ngoài nguồn ở 37 đoạn còn lại."
  alternatives_vi:
  - nó (thay cho `cô` trong trần thuật theo điểm nhìn của Thiếu tá Hofen tại chapter001_l/p000272, p000282 — bắt buộc giữ `cô` vì `DEC-P01-001` giới hạn đại từ `nó` cho trần thuật theo điểm nhìn của Tanya, không mở rộng sang góc nhìn của nhân vật khác)
