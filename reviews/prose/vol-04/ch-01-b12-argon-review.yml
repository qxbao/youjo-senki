  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, quốc gia, nhân vật và thuật ngữ đã khóa tạm từ Tập 1–3 cùng B01–B11 của Tập 4 (`Serebryakov`, `Trung úy Serebryakov`, `Visha`, `sĩ quan phụ tá`, `Grantz`, `Trung úy Grantz`, `Phó chỉ huy Weiss`, `Đại úy Weiss`, `Thiếu tá Tanya von Degurechaff`, `Liên bang`, `Đế quốc`, `chính quốc`, `lễ rửa tội bằng lửa đạn`, `điểm tập kết xuất phát`, `Nữ thần May mắn`, `trường quân sự`), đồng thời khóa tạm các thuật ngữ tác chiến mặt đất sau khi nhảy dù trong batch (`dù nhảy`, `chuẩn bị ẩn nấp`, `vành đai phòng ngự`, `vô tuyến tầm xa`, `hành quân không dùng ma pháp`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_serebryakov_weiss_post_drop_pronouns_and_address_vol04_ch01_b12
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000339, p000340, p000349, p000359) và giữ nguyên tên riêng `Tanya` (chapter001_b/p000339, p000349, p000355, p000358–p000360, p000362, p000366); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000338, p000340, p000342, p000344, p000358, p000367, p000370, p000371), ngôi thứ nhất số nhiều chỉ tập thể Tiểu đoàn 203 trong độc thoại nội tâm dùng `chúng tôi` (chapter001_b/p000357, p000358), và quy chiếu Đại úy Weiss trong độc thoại nội tâm bằng `anh ấy` cùng `hai đứa` khi so sánh thể hình hai người (chapter001_b/p000367, p000368, p000370, p000371); trong đối thoại giữa Tanya, Serebryakov và Weiss: Tanya gọi Serebryakov là `Trung úy Serebryakov` và dùng `chúng ta` (chapter001_b/p000345, p000356), Serebryakov báo cáo đáp `Rõ, thưa Thiếu tá` / `Rõ!`, xưng `chúng tôi` kèm tiểu từ lễ phép `ạ` (chapter001_b/p000346, p000348, p000358); Weiss báo cáo và đề nghị với Tanya gọi `thưa Thiếu tá` / `Thiếu tá` / `cô`, xưng `tôi` / `chúng tôi` / `chúng ta` kèm `ạ` khi xin phép (chapter001_b/p000350, p000352, p000354, p000359, p000361, p000363, p000365); Tanya trao đổi với Weiss xưng `tôi`, gọi `Đại úy` / `Đại úy Weiss` / `anh`, và quy chiếu Serebryakov là `Trung úy Serebryakov` / `cô ấy` (chapter001_b/p000351, p000360, p000362, p000364, p000369)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya về việc chuẩn bị rút quân tại chapter001_b/p000357, p000358 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị trong độc thoại nội tâm xuyên suốt B01–B11) / hắn hoặc cậu ta (thay cho `anh ấy` khi Tanya nghĩ về Weiss tại chapter001_b/p000367, p000368, p000370, p000371 — ưu tiên `anh ấy` để đồng bộ với B06, B08, B10 và phản ánh đúng thái độ trân trọng của Tanya đối với vị phó chỉ huy mẫn cán)
