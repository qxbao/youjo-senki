  proposed_vi: "dù nhảy, đổ bộ đường không (chapter001_b/p000338) / chuẩn bị ẩn nấp (chapter001_b/p000340) / Serebryakov, Grantz, trung đội, vành đai phòng ngự (chapter001_b/p000342) / lễ rửa tội bằng lửa đạn (chapter001_b/p000343) / Phó chỉ huy Weiss, Đại úy Weiss, Đại úy, Weiss (chapter001_b/p000344, p000349, p000351, p000359, p000362, p000367) / Trung úy Serebryakov, Visha, sĩ quan phụ tá (chapter001_b/p000345, p000356–p000360) / Thiếu tá, Thiếu tá Tanya von Degurechaff, Trung úy Grantz, Liên bang (chapter001_b/p000346, p000350, p000352, p000354, p000356, p000359, p000361, p000363, p000368) / điểm tập kết xuất phát, khu vực tập kết xuất phát (chapter001_b/p000348, p000361) / vô tuyến tầm xa, chính quốc, Đế quốc, gây nhiễu (chapter001_b/p000350, p000353, p000354) / Nữ thần May mắn (chapter001_b/p000358) / hành quân không dùng ma pháp (chapter001_b/p000365) / pháp sư, trường quân sự, cưỡng bách tòng quân (chapter001_b/p000371)"
  alternatives_vi:
  - dù đổ bộ (thay cho `dù nhảy` tại chapter001_b/p000338 — ưu tiên `dù nhảy` vì tự nhiên, gọn nhịp và tránh lặp từ với cụm `cuộc đổ bộ đường không` ở ngay câu sau) / công tác ngụy trang (thay cho `chuẩn bị ẩn nấp` tại chapter001_b/p000340 — ưu tiên `chuẩn bị ẩn nấp` vì bao quát đúng việc thu dọn dù, xóa dấu vết và thiết lập trạng thái ẩn mình ngay sau khi tiếp đất) / hành quân bộ không ma pháp (thay cho `hành quân không dùng ma pháp` tại chapter001_b/p000365 — ưu tiên `hành quân không dùng ma pháp` vì rõ nghĩa và khớp trực tiếp với việc tắt tín hiệu ma năng để di chuyển bằng thể lực thuần túy)
