  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Thiếu tá Tanya von Degurechaff, Đại úy Weiss và Trung úy Serebryakov sau khi đơn vị tiếp đất và tập hợp đội hình."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000338
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001 và các cụm thuật ngữ `dù nhảy`, `cuộc đổ bộ đường không`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000339
  locks:
  - "Giữ tên riêng `Tanya` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000340
  locks:
  - "Giữ đại từ trần thuật `Nó` và đại từ phản thân `mình` theo DEC-P01-001, cùng cụm `khâu chuẩn bị ẩn nấp`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000341
  locks:
  - "Giữ cụm `lính tinh nhuệ` và nét nghĩa về việc tập hợp lại đội hình suôn sẻ."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000342
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, tên riêng `Serebryakov`, `Grantz` và các thuật ngữ `trung đội`, `vành đai phòng ngự`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000343
  locks:
  - "Giữ thành ngữ quân sự `lễ rửa tội bằng lửa đạn` đồng bộ với các tập trước."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000344
  locks:
  - "Giữ danh xưng `Phó chỉ huy Weiss`, đại từ nội tâm `mình` theo DEC-P01-001 và nhận định về mô hình đơn vị hiệu quả."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000345
  locks:
  - "Giữ danh xưng `Trung úy Serebryakov` và đại từ `chúng ta`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000346
  locks:
  - "Giữ cách đáp `Rõ, thưa Thiếu tá`, các danh xưng `Đại đội của Trung úy Grantz`, `Liên bang`, đại từ `chúng tôi` và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000347
  locks:
  - "Giữ câu khen ngợi và câu hỏi ngắn gọn của Tanya."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000348
  locks:
  - "Giữ đại từ `Chúng tôi` / `chúng tôi`, cụm thuật ngữ `điểm tập kết xuất phát` đồng bộ với B10 và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000349
  locks:
  - "Giữ từ cảm thán in nghiêng ở đầu đoạn `*Tốt.*` theo DEC-P01-002, tên riêng `Tanya`, `Weiss` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000350
  locks:
  - "Giữ cách gọi `thưa Thiếu tá` và thuật ngữ `vô tuyến tầm xa`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000351
  locks:
  - "Giữ cách gọi `Đại úy`, đại từ `Tôi` và câu hỏi mang sắc thái phỏng đoán của Tanya."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000352
  locks:
  - "Giữ đại từ `Chúng tôi` và danh xưng `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000353
  locks:
  - "Giữ thuật ngữ `chính quốc` đồng bộ với B06."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000354
  locks:
  - "Giữ cách gọi `thưa Thiếu tá`, danh xưng `Đế quốc`, đại từ `chúng ta` và thuật ngữ `gây nhiễu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000355
  locks:
  - "Giữ tên `Tanya` và câu nhận định nội tâm in nghiêng ở cuối đoạn `*Vậy là nó vẫn chưa bắt đầu.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000356
  locks:
  - "Giữ đại từ `Chúng ta` / `chúng ta` và các danh xưng `Liên bang`, `Trung úy Serebryakov`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000357
  locks:
  - "Giữ tên `Serebryakov` và đại từ tập thể `chúng tôi` trong độc thoại nội tâm của Tanya."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000358
  locks:
  - "Giữ cụm `sĩ quan phụ tá của Tanya`, danh xưng ẩn dụ `Nữ thần May mắn`, tên `Serebryakov`, cùng đại từ tập thể `Chúng tôi` và đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000359
  locks:
  - "Giữ danh xưng `Thiếu tá`, các tên riêng `Visha`, `Weiss`, `Tanya`, `Serebryakov` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000360
  locks:
  - "Giữ tên `Tanya`, danh xưng `Trung úy Serebryakov`, đại từ `cô ấy` và đại từ ngôi thứ nhất `tôi` / `Tôi` trong lời thoại."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000361
  locks:
  - "Giữ cách xưng hô `Thiếu tá` / `Thưa Thiếu tá` / `cô` – `tôi` kèm tiểu từ `ạ` của Weiss và cụm `khu vực tập kết xuất phát của địch`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000362
  locks:
  - "Giữ mệnh đề hàm ý in nghiêng ở giữa đoạn `*Đâu phải là tôi không tin tưởng cả anh đâu*` theo DEC-P01-002, tên `Tanya` và danh xưng `Đại úy Weiss`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000363
  locks:
  - "Giữ cách gọi `Thưa Thiếu tá`, đại từ `tôi` và `cô`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000364
  locks:
  - "Giữ đại từ `anh` trong câu hỏi của Tanya dành cho Weiss."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000365
  locks:
  - "Giữ đại từ `Tôi`, cụm thuật ngữ `cuộc hành quân không dùng ma pháp`, danh xưng `Thiếu tá` và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000366
  locks:
  - "Giữ từ cảm thán in nghiêng ở đầu đoạn `*Ồ.*` theo DEC-P01-002 và tên `Tanya`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000367
  locks:
  - "Giữ đại từ nội tâm `Mình` / `mình` theo DEC-P01-001, tên `Weiss`, đại từ `anh ấy` và cụm `sự chênh lệch về thể hình giữa hai đứa`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000368
  locks:
  - "Giữ đại từ `anh ấy` và danh xưng đầy đủ `Thiếu tá Tanya von Degurechaff`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000369
  locks:
  - "Giữ đại từ `tôi` và `anh` trong lời từ chối khéo của Tanya với Weiss."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000370
  locks:
  - "Giữ đại từ `anh ấy`, đại từ nội tâm `mình` theo DEC-P01-001 và cụm `thiếu nữ mảnh mai`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000371
  locks:
  - "Giữ các cụm `pháp sư`, `trường quân sự`, `cưỡng bách tòng quân`, đại từ nội tâm `mình` theo DEC-P01-001 và đại từ `anh ấy` quy chiếu Weiss."
