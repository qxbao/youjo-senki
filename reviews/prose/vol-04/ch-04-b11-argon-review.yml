  rationale: "Kế thừa đồng bộ các tên gọi, địa danh, chính thể và thuật ngữ đã khóa tạm từ các tập và lô trước (`John` / bí danh `Johnson` đồng bộ với `Ông Johnson` tại vol-04-ch-04-b10 p000312, ẩn dụ thương mại `máy kéo`, `NĂM THỐNG NHẤT 1926`, `KHỐI THỊNH VƯỢNG CHUNG`, `học viên`, `sĩ quan cấp trên`, `Mary Sue`), đồng thời khóa tạm các thuật ngữ, mã mẫu thiết bị và địa danh mới phát sinh trong lô (`“máy kéo hạng trung”`, `“máy kéo hạng nặng”`, ẩn dụ chỉ quả cầu tính toán `“đồng hồ bỏ túi chính xác”`, `Hiệp hội Skunk`, `‘đồng hồ bỏ túi chính xác chống nước 6F’` / `mẫu 6F`, `danh sách “phải mua bằng được”`, `‘đồng hồ bỏ túi chính xác đa dụng 4U’` / `mẫu 4U`, `‘đồng hồ bỏ túi chính xác G58’`, `khả năng tương thích thiết bị ngoại vi`, `lô thử nghiệm sản xuất trước`, `dữ liệu vận hành thực tế`, và tiêu đề chuyển cảnh `NGÀY 18 THÁNG 4, NĂM THỐNG NHẤT 1926, KHỐI THỊNH VƯỢNG CHUNG, CĂN CỨ HUẤN LUYỆN HORTON BARD`)."
  uncertainty: low
