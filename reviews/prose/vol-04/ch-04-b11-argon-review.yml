  proposed_vi: "John / Johnson, “máy kéo hạng trung” / “máy kéo hạng nặng”, “đồng hồ bỏ túi chính xác” / ‘đồng hồ bỏ túi chính xác’, xe tăng hay phi cơ chủ lực, Hiệp hội Skunk, ‘đồng hồ bỏ túi chính xác chống nước 6F’ / mẫu 6F, danh sách “phải mua bằng được”, dây chuyền sản xuất, ‘đồng hồ bỏ túi chính xác đa dụng 4U’ / mẫu 4U, ‘đồng hồ bỏ túi chính xác G58’, khả năng tương thích với các thiết bị ngoại vi / khả năng tương thích thiết bị ngoại vi, lô thử nghiệm sản xuất trước, dữ liệu vận hành thực tế, NGÀY 18 THÁNG 4, NĂM THỐNG NHẤT 1926, KHỐI THỊNH VƯỢNG CHUNG, CĂN CỨ HUẤN LUYỆN HORTON BARD, học viên, sĩ quan cấp trên, Mary Sue (chapter001_n/p000327–p000341, p000343, p000346, p000347, p000349–p000351, p000353–p000356, p000358–p000360, p000363–p000366)"
  alternatives_vi:
