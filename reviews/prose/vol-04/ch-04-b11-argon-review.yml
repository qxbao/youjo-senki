  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, đồng bộ hoàn toàn hệ quy chiếu và xưng hô thương mại của `John` (`anh` trong lời kể; `mình` / `chúng ta` trong nội tâm; `ông` / `bên ông` – `tôi` / `chúng tôi` – `bên anh` trong đối thoại giao dịch) từ `vol-04-ch-04-b10`, giữ cùng chủ thể trong cấu trúc tăng tiến tại p000360, và bảo toàn chính xác phạm vi nhấn mạnh in nghiêng tại 7 đoạn có thẻ `<html:em>`."
