- source_term: john_skunk_association_negotiation_and_horton_bard_cadets_pronouns_address_and_emphasis_vol04_ch04_b11
  proposed_vi: "Toàn bộ 41 đoạn của `vol-04-ch-04-b11` (chapter001_n/p000326–p000366) gồm hai phân cảnh (cuộc đàm phán mua sắm “đồng hồ bỏ túi chính xác” giữa John và kỹ sư/đại diện Hiệp hội Skunk tại nhà máy Hợp chúng quốc ở p000326–p000364, và cảnh mở đầu tại Căn cứ Huấn luyện Horton Bard thuộc Khối Thịnh vượng chung ở p000365–p000366), tuân thủ nghiêm ngặt giới hạn chủ thể của `DEC-P01-001` (Tanya không xuất hiện trong cả hai phân cảnh; tuyệt đối không dùng đại từ `nó` cho bất kỳ nhân vật nào—các từ `Nó` / `nó` tại p000336–p000338, p000343, p000349, p000351, p000354, p000360 hoàn toàn chỉ quy chiếu danh từ bất động vật là các mẫu “đồng hồ bỏ túi chính xác”), `DEC-P01-002` và `canon/style-guide.md`: (1) Trong phân cảnh đàm phán với Hiệp hội Skunk (p000326–p000364): ở trần thuật ngôi thứ ba và độc thoại nội tâm, quy chiếu `John` nhất quán bằng đại từ `anh` / `Anh` trong lời kể (p000328, p000329, p000333, p000356, p000363, p000364 — đồng bộ hoàn toàn với `vol-04-ch-04-b10`) và tự quy chiếu bằng `mình` / `chúng ta` trong các câu độc thoại nội tâm trực tiếp (p000339, p000363); quy chiếu kỹ sư / đại diện bán hàng của Hiệp hội Skunk bằng `anh ta` / `Anh ta` trong lời kể (p000332, p000350), tự quy chiếu bằng `Mình` (kèm `vị này` chỉ John) tại p000359 và `Chúng mình` (khi nghĩ thay cho tập thể kỹ thuật viên Hiệp hội Skunk) tại p000360; quy chiếu tập thể Hiệp hội Skunk, đôi bên mua bán và những người lính đi biển bằng `họ` / `Họ` kết hợp phản thân `mình` (p000329, p000333, p000336, p000339, p000351, p000354, p000355, p000360, p000363); trong đối thoại thương mại, nhân viên nhà máy máy kéo (p000326, p000331) và kỹ sư / đại diện Hiệp hội Skunk (p000338, p000341, p000345, p000349, p000353, p000358, p000362) gọi John lịch sự là `ông` / `bên ông`, tự xưng `tôi` và đại diện tổ chức xưng `chúng tôi` / `Chúng tôi` (đồng bộ `vol-04-ch-04-b10`), còn John (p000330, p000334, p000344, p000348, p000352, p000357, p000361) tự xưng `Tôi` / `tôi` và gọi đối tác bán hàng là `bên anh`. (2) Trong phân cảnh Căn cứ Huấn luyện Horton Bard (p000365–p000366): quy chiếu tập thể `Các học viên` bằng đại từ số nhiều `họ` (p000366). (3) Bảo toàn chính xác cấu trúc tăng tiến `chẳng những... mà còn...` giữ cùng chủ thể `Họ` tại p000360, và toàn bộ 7 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000327, p000333, p000339, p000347, p000359, p000360 và p000363, không phát sinh dấu `*` ngoài nguồn ở 34 đoạn còn lại."
  alternatives_vi:
  - Chúng ta (thay cho `Chúng mình` trong độc thoại nội tâm của người đại diện Hiệp hội Skunk tại chapter001_n/p000360 — ưu tiên `Chúng mình` vì thể hiện tự nhiên tiếng lòng nội tâm thân mật của cánh kỹ thuật viên khi nghĩ về mong muốn thử nghiệm sản phẩm của nhóm mình, đồng thời phân biệt rõ với lời thoại đối ngoại)
