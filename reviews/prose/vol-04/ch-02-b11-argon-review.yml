- source_term: tanya_film_studio_requisition_and_loria_moskva_raid_pronouns_vol04_ch02_b11
  proposed_vi: "Trong hai phân cảnh kết thúc nhánh Moskva tại `chapter001_f.xhtml` (chapter001_f/p000327–p000370): (1) Ở phân cảnh Tiểu đoàn 203 đi trưng dụng cờ và thiết bị quay phim tại xưởng phim (p000327–p000339), tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối B07–B10: trần thuật ngôi thứ ba quy chiếu Trung úy Serebryakov bằng `cô` và tên riêng `Serebryakov`, giữ tên riêng `Tanya` (p000328); trong độc thoại nội tâm trực tiếp, Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` (p000332) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `Chúng tôi` / `chúng tôi` (p000329, p000331, p000332); dùng chủ ngữ khái quát `người ta` (p000331) và đại từ ngôi thứ hai `Bạn` cho câu hỏi tu từ hướng tới người đọc trong mạch tản mạn châm biếm (p000338); trong đối thoại (p000327, p000334–p000336), Serebryakov đáp lệnh Tanya bằng `Rõ ạ` và tự xưng `chúng tôi` (p000327), người chỉ huy giao việc ở p000335 tự xưng `Tôi` và gọi nhóm binh sĩ đi cùng là `Mấy người`, còn nhóm binh sĩ đáp lại lễ phép bằng `Rõ! Chúng tôi sẽ đợi ở đây ạ!` (p000336). (2) Ở phân cảnh nhìn từ đường phố Moskva và cơn mê đắm bệnh hoạn của Loria khi nhìn thấy Tanya (p000340–p000370), tiếp nối nhất quán B05–B07: trần thuật ngôi thứ ba quy chiếu Loria bằng `ông ta` / `Ông ta` xuyên suốt (p000357, p000358, p000363–p000365, p000367, p000369, p000370), kết hợp đại từ phản thân `mình` (p000367, p000369) và tên riêng `Loria` (p000346, p000349, p000355, p000359, p000360, p000363, p000366, p000370); trong độc thoại nội tâm trực tiếp (p000368, p000369), Loria tự quy chiếu ngôi thứ nhất bằng `mình`; quy chiếu những kẻ vô tín, lực lượng phòng thủ, sĩ quan Liên bang và các binh sĩ Đế quốc bằng `họ` / `bọn họ` (p000344, p000348, p000358, p000360, p000361); quy chiếu Tanya qua góc nhìn từ dưới mặt đất và ánh mắt săn mồi bệnh hoạn của Loria bằng `cô bé dẫn đầu` / `viên chỉ huy địch` / `một đứa trẻ` / `Con gái của một ai đó` (p000358) và `con bé` / `cô bé nhỏ nhắn kia` (p000366, p000369, p000370)"
  alternatives_vi:
  - hắn / gã (thay cho `ông ta` / `Ông ta` khi quy chiếu Loria trong trần thuật tại chapter001_f/p000357–p000370 — ưu tiên `ông ta` / `Ông ta` để giữ sự liền mạch tuyệt đối với B05–B06 cũng như tuân thủ quy tắc của `style-guide.md` về việc giữ giọng trần thuật khách quan, lạnh lùng) / nó (thay cho `con bé` / `cô bé nhỏ nhắn kia` khi quy chiếu Tanya từ góc nhìn của Loria tại chapter001_f/p000366, p000369, p000370 — bắt buộc giữ `con bé` / `cô bé nhỏ nhắn kia` vì theo `DEC-P01-001` đại từ trần thuật `nó` chỉ dùng cho điểm nhìn của Tanya, còn ở đây điểm nhìn thuộc về Loria và đồng bộ với hệ từ vựng góc nhìn săn mồi của Loria đã khóa ở B06)
