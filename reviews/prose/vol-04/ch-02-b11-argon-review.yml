  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, quốc gia, địa danh, cơ quan, công trình và thuật ngữ quân sự – chính trị – tôn giáo đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B10 Chương 2 của Tập 4 (`Tanya`, `Serebryakov`, `Moskva`, `bộ phim tuyên truyền`, `lũ Cộng sản`, `cờ Liên bang`, `cờ Đế quốc` / `lá cờ Đế quốc`, `Lá cờ đỏ Cộng sản`, `lăng mộ`, `Điện Kremlin`, `xưởng phim`, `NGÀY 16 THÁNG 3, NĂM THỐNG NHẤT 1926`, `tín đồ`, `ngôn ngữ chính thức của Liên bang`, `những kẻ vô tín`, `luyện ngục`, `cảnh sát mật`, `tiểu đoàn pháp sư`, `Lục quân Đế quốc`, `trận địa phòng không`, `Loria`, `thanh trừng`, `Josef`, `Lục quân Liên bang`, `tiền tuyến`, `hậu phương`), đồng thời khóa tạm các danh xưng và cách diễn đạt xuất hiện trong hai phân cảnh khép lại nửa đầu Chương 2 (`trưng dụng đúng quy trình`, `Quảng trường Cộng sản`, `giao lưu văn hóa`, `Tổng Bí thư`, `hổ giấy`, `bộ máy tổ chức đảng`, `người điều hành các cuộc thanh trừng`, `kiểu cười Cộng sản`, `tiếng sét ái tình`)."
