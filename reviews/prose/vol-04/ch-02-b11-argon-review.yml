  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, phân biệt rõ hai điểm nhìn giữa phân cảnh của Tanya/Serebryakov (`mình` / `chúng tôi` trong nội tâm Tanya, `cô` cho Serebryakov) và phân cảnh của Loria (`ông ta` trong trần thuật, `mình` trong độc thoại nội tâm của Loria, và `cô bé dẫn đầu` / `con bé` / `cô bé nhỏ nhắn kia` khi nhìn Tanya từ góc độ của Loria)."
