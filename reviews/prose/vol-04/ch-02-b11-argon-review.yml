- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000363
  locks:
  - "Giữ tên riêng `Loria`, cụm `các sĩ quan Liên bang`, đại từ `ông ta` và cấu trúc đối lập `chẳng có gì giống với cơn thịnh nộ mà trái lại là niềm hân hoan`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000364
  locks:
  - "Giữ đại từ `ông ta`, chủ ngữ khái quát `người ta`, cụm `kiểu cười Cộng sản` và mệnh đề `chiếc mặt nạ ấy đã bị lột sạch đến mức ông ta ngập ngừng bộc lộ trạng thái mê đắm tột cùng, thuần khiết và hiếm hoi bậc nhất đó`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000365
  locks:
  - "Giữ đại từ `ông ta` và câu `Đích ngắm trong ánh mắt ông ta là gương mặt ngọt ngào nhất đang đanh lại vì niềm xác tín.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000366
  locks:
  - "Giữ cách quy chiếu `con bé`, tên riêng `Loria` và câu `Chỉ riêng ý nghĩ bắt con bé phải khuất phục thôi cũng đã đẩy sự tự chủ của Loria đến bờ vực giới hạn.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000367
  locks:
  - "Giữ đại từ `ông ta`, `mình` và câu `Càng ngắm nhìn, ông ta càng phát điên. Bị bủa vây bởi một thứ cảm xúc không sao tả xiết, ông ta cảm nhận được tâm trí mình đang biến đổi theo một cách cũng khôn tả không kém.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000368
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng `*Ồ, đây chính là tiếng sét ái tình.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000369
  locks:
  - "Giữ đại từ `Ông ta`, `mình`, các cách quy chiếu `con bé`, `cô bé nhỏ nhắn kia` và câu độc thoại nội tâm in nghiêng `*Aaaa, mình muốn biết—mình muốn biết đến phát điên lên được, mình không chịu nổi nữa rồi.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000370
  locks:
  - "Giữ tên riêng `Loria`, cách quy chiếu `con bé`, đại từ `ông ta` và hai câu kết `Giờ đây trong mắt Loria chỉ còn mỗi hình bóng con bé. Chẳng còn thứ gì khác có ý nghĩa với ông ta nữa.`."
