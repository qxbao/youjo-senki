  proposed_vi: "trưng dụng đúng quy trình (chapter001_f/p000327) / Tanya, Serebryakov, Moskva, chào điều lệnh chuẩn mực (chapter001_f/p000328, p000340, p000343) / bộ phim tuyên truyền, lũ Cộng sản, máy quay của lũ Cộng sản (chapter001_f/p000329, p000330, p000338, p000339) / cờ Liên bang, cờ Đế quốc, lá cờ Đế quốc, Lá cờ đỏ Cộng sản, Quảng trường Cộng sản (chapter001_f/p000331, p000332, p000357) / lăng mộ, Lăng mộ, các vị lãnh tụ cách mạng, Điện Kremlin, Tổng Bí thư (chapter001_f/p000335, p000347) / xưởng phim, giao lưu văn hóa, quốc gia không giáp biển, hải quân (chapter001_f/p000337, p000339) / NGÀY 16 THÁNG 3, NĂM THỐNG NHẤT 1926, TRÊN ĐƯỜNG PHỐ THỦ ĐÔ MOSKVA CỦA LIÊN BANG (chapter001_f/p000340) / tín đồ, ngôn ngữ chính thức của Liên bang, vị vua trên thiên đàng, những kẻ vô tín, luyện ngục (chapter001_f/p000341, p000342, p000344) / cảnh sát mật, tiểu đoàn pháp sư, đơn vị pháp sư, một tiểu đoàn (chapter001_f/p000345, p000349, p000350) / Lục quân Đế quốc, những người lính Đế quốc, viên chỉ huy địch (chapter001_f/p000346, p000356, p000358) / các trận địa phòng không, hổ giấy (chapter001_f/p000348) / bộ máy tổ chức đảng, thanh trừng, người điều hành các cuộc thanh trừng, người hạ lệnh hành quyết (chapter001_f/p000352, p000353, p000359) / Loria, Josef, Lục quân Liên bang, các sĩ quan Lục quân Liên bang, các sĩ quan Liên bang, tiền tuyến, hậu phương (chapter001_f/p000346, p000349, p000355, p000359–p000361, p000363, p000366, p000370) / kiểu cười Cộng sản, tiếng sét ái tình (chapter001_f/p000364, p000368)"
