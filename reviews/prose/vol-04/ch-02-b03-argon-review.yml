  proposed_vi: "Degurechaff, Thiếu tá von Degurechaff, Tiểu đoàn Pháp sư Trên không số 203 (chapter001_f/p000053, p000056, p000069, p000071, p000078, p000083) / Lergen, Đại tá (chapter001_f/p000054, p000055, p000068, p000074, p000082) / Tướng von Zettour, Zettour (chapter001_f/p000056, p000082) / chiến trường Rhine, lưới phòng không của Cộng hòa, sở chỉ huy lục quân (chapter001_f/p000057) / con chó điên, chó săn, con chó săn chiến tranh điên cuồng (chapter001_f/p000063, p000064, p000069) / de Lugo (chapter001_f/p000064) / chỉ huy tiền tuyến (chapter001_f/p000065) / Trung tá, vị trung tá lớn tuổi hơn, sĩ quan thông tin liên lạc của Cụm tập đoàn quân phía Đông, sĩ quan thông tin liên lạc thuộc Cụm tập đoàn quân phía Đông, các đạo quân phía đông, Cụm tập đoàn quân phía Đông (chapter001_f/p000066–p000068, p000079, p000081, p000083) / lưỡi kiếm ma pháp, sĩ quan tập sự (chapter001_f/p000069) / sĩ quan cấp tá (chapter001_f/p000071, p000079) / những trận tác chiến cơ động trên lục địa phía nam, số đơn vị Đế quốc (chapter001_f/p000073) / Tướng von Romel (chapter001_f/p000074) / bản báo cáo chiến công, hậu phương (chapter001_f/p000081, p000083) / lực lượng phòng thủ thuộc địa của Cộng hòa, tàn quân của đạo quân chủ lực bên đó (chapter001_f/p000083)"
  alternatives_vi:
