  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ trần thuật `ông` và nội tâm tự quy chiếu `mình` của Đại tá von Lergen (tiếp nối B02), phân biệt mạch lạc các chủ thể nam ngôi thứ ba (`ông` cho Lergen, `ông ấy` cho Romel, `vị tướng` cho Zettour, `ông ta` cho viên trung tá thông tin liên lạc), giữ nhất quán `cô` / `cô ấy` khi quy chiếu Tanya từ góc nhìn Lergen, và đảm bảo chuẩn mực xưng hô quân sự trong cuộc họp Bộ Tổng tham mưu."
  uncertainty: low
  status: pending
  canon: false
