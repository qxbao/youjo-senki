  proposed_vi: "NGÀY 25 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU, PHÒNG TÁC CHIẾN, Văn phòng Bộ Tổng tham mưu, Đế quốc, Phòng Tác chiến (chapter001_j/p000001, p000002) / Liên bang, Lục quân Đế quốc, tuyến phòng ngự, Cụm tập đoàn quân phía Đông, Bộ Tổng tham mưu Lục quân Đế quốc, tiền tuyến, Lục quân Liên bang (chapter001_j/p000003–p000005, p000009, p000010, p000012–p000014, p000020) / Trung tướng von Rudersdorf, chiến lược nghênh kích, lực lượng dự bị chiến lược, mặt trận (chapter001_j/p000006, p000007) / Trung tướng von Zettour, Cục Tình báo, Zettour, Rudersdorf, sư đoàn, Dacia, bên Tình báo (chapter001_j/p000008, p000011, p000012, p000018, p000022) / hậu cần, tiềm lực quốc gia, tập trung binh lực, lực lượng dự bị, tổng động viên toàn bộ (chapter001_j/p000009–p000011) / đánh úp, những con chim hoàng yến cảnh giới, Bộ Tổng tham mưu, biên chế thời chiến (chapter001_j/p000013, p000014) / mặt trận phía tây, mặt trận Liên minh Hiệp ước cũ, sư đoàn cơ giới, sư đoàn bộ binh, lực lượng dự bị ứng phó tại chính quốc, Đại Quân (chapter001_j/p000015, p000016) / Cục Hậu cần, tân binh, quân dự bị, hậu phương, sĩ quan nòng cốt, mặt trận Rhine, quân số biên chế (chapter001_j/p000020, p000023) / sư đoàn bảo an tuyến hai, hậu tuyến, pháo binh, Lục quân Cộng hòa cũ, súng máy, các trận chiến chiến hào ở Rhine (chapter001_j/p000025)"
