  proposed_vi: "Trong phân cảnh mở đầu Chương 3 tại Phòng Tác chiến thuộc Văn phòng Bộ Tổng tham mưu Đế quốc giữa Trung tướng von Rudersdorf và Trung tướng von Zettour bàn về đợt tiến công 175 sư đoàn của Liên bang và tình trạng thiếu hụt binh lực của Đại Quân (chapter001_j/p000001–p000025): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch các chương trước: (1) Trần thuật ngôi thứ ba quy chiếu Trung tướng von Rudersdorf và Trung tướng von Zettour bằng đại từ trang trọng `ông` / `Ông` (p000006, p000008, p000018, p000024) kết hợp quân hàm – tên riêng (`Trung tướng von Rudersdorf`, `Trung tướng von Zettour`, `Zettour`, `Rudersdorf`) và đại từ phản thân `mình` (p000008, p000014, p000018); trong câu hỏi bằng ánh mắt in nghiêng của Rudersdorf tại p000018 dùng câu cảm thán ngắn `*Cái gì cơ?*`. (2) Quy chiếu tập thể Bộ Tổng tham mưu, Lục quân Đế quốc, Cụm tập đoàn quân phía Đông, Cục Tình báo và các sư đoàn huy động của Đế quốc bằng `họ` / `Họ` (p000003–p000005, p000007, p000008, p000015, p000019, p000021, p000023, p000025) kết hợp đại từ phản thân `mình` (p000007); quy chiếu phía Liên bang và Lục quân Liên bang bằng `chúng` / `Chúng` (p000008–p000011) kết hợp đại từ phản thân `mình` (p000010, p000013). (3) Trong đối thoại trực tiếp giữa hai vị trung tướng đồng cấp kiêm bạn hữu (p000007, p000008, p000011, p000015–p000017, p000019, p000022–p000025): người nói tự xưng `tôi` / `Tôi`, gọi đối phương là `ông`, và dùng `chúng ta` khi nói về Bộ Tổng tham mưu và Lục quân Đế quốc"
  alternatives_vi:
  - anh / cậu (thay cho `ông` trong đối thoại giữa Zettour và Rudersdorf tại chapter001_j/p000008, p000025 — bắt buộc giữ cặp `tôi` – `ông` để đồng bộ tuyệt đối với cách xưng hô trang trọng mà thân thiết giữa hai vị trung tướng đã khóa tạm xuyên suốt Tập 1–4) / họ (thay cho `chúng` / `Chúng` khi chỉ quân Liên bang tại chapter001_j/p000008–p000011 — ưu tiên `chúng` / `Chúng` vì phản ánh đúng góc nhìn tác chiến chống quân xâm lược của hai vị tướng Đế quốc và giúp phân tách rõ với đại từ `họ` chỉ Cục Tình báo và các đơn vị Đế quốc)
