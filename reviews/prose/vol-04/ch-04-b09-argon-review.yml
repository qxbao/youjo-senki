- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000283
  locks:
  - "Giữ cụm câu hỏi nội tâm bỏ lửng nhấn mạnh in nghiêng `*Đây có phải là…*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000284
  locks:
  - "Giữ 2 cụm nhấn mạnh in nghiêng tách biệt theo DEC-P01-002: hai câu hỏi nội tâm đầu đoạn `*Đây có phải là lời lẽ của kẻ mà mới chỉ vài ngày trước còn sai các sĩ quan chính trị của mình đi buộc tội người khác không? Của kẻ đã tống phần lớn pháp sư vào các trại tập trung ở Sildberia hoặc đem đi xử bắn không?*` và câu thoại giả định `*Sao đồng chí lại hỏi một điều hiển nhiên đến thế?*` (phần dẫn lời `Cứ như thể ông ta đang nói rằng:` và câu kết `Thật không tài nào hiểu thấu.` nằm ngoài dấu `*`)."
