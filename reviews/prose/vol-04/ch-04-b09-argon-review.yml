  proposed_vi: "Moskva, đảng / đảng viên, *nomenklatura*¹³, chế độ độc đảng, nhà độc tài vĩ đại, Cụm Tiến công Chủ lực, Đế quốc / Lục quân Đế quốc, Lục quân Liên bang, tội ác phản cách mạng / phản cách mạng, Cuộc Đại Thanh trừng, dê tế thần, quốc phòng, Đồng chí Tổng Bí thư Josef / Tổng Bí thư Josef / Đồng chí Tổng Bí thư / vị tổng bí thư, thanh trừng, Loria / Đồng chí Loria, Tổ quốc, đảng mẹ, Bộ Dân ủy Nội vụ, pháp sư, chế độ cũ, sĩ quan, chính ủy, chế độ độc tài, sĩ quan chính trị, âm mưu phản động, trại tập trung ở Sildberia (chapter001_n/p000251–p000259, p000264–p000280, p000282, p000284)"
  alternatives_vi:
  - Đại Thanh trừng (thay cho `Cuộc Đại Thanh trừng` tại chapter001_n/p000254 — ưu tiên `Cuộc Đại Thanh trừng` vì tự nhiên, trang trọng khi đứng sau giới từ `nạn nhân của`) / trại cải tạo ở Sildberia (thay cho `trại tập trung ở Sildberia` tại chapter001_n/p000284 — ưu tiên `trại tập trung ở Sildberia` vì bám sát trực diện nghĩa đen thuật ngữ nguồn và giữ nguyên sắc thái khắc nghiệt của hệ thống trại giam Sildberia đã khóa ở Chương 1–2)
