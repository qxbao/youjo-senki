  volume: vol-04
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, đồng bộ hệ quy chiếu và xưng hô nội bộ đảng Liên bang từ Chương 1–3 (`họ` / `mình` cho tập thể đảng viên tham dự, `ông ta` / `Hắn` / `kẻ` cho Loria tùy theo trần thuật khách quan hay nội tâm kinh sợ, `Đồng chí Tổng Bí thư Josef` / `vị tổng bí thư` cho Josef, `người ta` cho ngôi thứ hai phiếm chỉ ở p000258 và p000279, cùng hệ xưng hô `Thưa Đồng chí Tổng Bí thư` / `Đồng chí Loria` / `đồng chí` / `tôi` / `chúng ta` trong thoại), đồng thời bảo toàn chính xác chỉ số chú thích `¹³` và cả 6 đoạn có nhấn mạnh in nghiêng."
