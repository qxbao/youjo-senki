- source_term: federation_nomenklatura_bunker_meeting_josef_loria_pronouns_address_and_emphasis_vol04_ch04_b09
  proposed_vi: "Tiếp nối dòng tiêu đề thời gian – địa điểm `NGÀY 3 THÁNG 4, NĂM THỐNG NHẤT 1926, MỘT NƠI NÀO ĐÓ TẠI THỦ ĐÔ MOSKVA CỦA LIÊN BANG` ở cuối `vol-04-ch-04-b08` (`p000250`), toàn bộ 34 đoạn của `vol-04-ch-04-b09` (chapter001_n/p000251–p000284) chuyển sang cuộc họp khẩn cấp của giới chóp bu đảng Liên bang trong căn hầm ngầm dưới Moskva trước mặt Tổng Bí thư Josef và Loria, tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (Tanya không xuất hiện; tuyệt đối không dùng đại từ `nó` cho bất kỳ nhân vật nào), `DEC-P01-002` và `canon/style-guide.md`: (1) Trong trần thuật ngôi thứ ba và độc thoại nội tâm tập thể của các ủy viên hạt nhân đảng (`*nomenklatura*¹³`): quy chiếu tập thể các đảng viên tham dự bằng đại từ số nhiều `họ` / `Họ` kết hợp phản thân `mình` (p000251–p000254, p000257, p000258, p000267, p000274, p000276, p000279), quy chiếu cá nhân người đảng viên lên tiếng chất vấn ở p000276 bằng `ông ta` kết hợp phản thân `mình`, và dịch đại từ ngôi thứ hai phiếm chỉ trong câu hỏi nội tâm ở p000258 và p000279 thành chủ ngữ khái quát `người ta` theo đúng quy ước `direct-address choice`; quy chiếu Tổng Bí thư Josef bằng `nhà độc tài vĩ đại` (p000252), `Đồng chí Tổng Bí thư Josef` (p000257, p000274), `Tổng Bí thư Josef` (p000268), `vị tổng bí thư` (p000272) và `Đồng chí Tổng Bí thư` (p000279); quy chiếu Loria bằng tên riêng `Loria` / `Đồng chí Loria` / `Loria thuộc Bộ Dân ủy Nội vụ`, đại từ `ông ta` / `Ông ta` trong lời kể (p000267, p000268, p000280, p000284 — đồng bộ `vol-04-ch-02-b11` và `b12`), kết hợp đại từ `Hắn` trong ánh mắt hoài nghi thầm kín của các đảng viên ở p000274 (`*Hắn mất trí rồi sao?*`) và danh ngữ `kẻ` đi kèm phản thân `của mình` trong câu hỏi tu từ nội tâm ở p000284; quy chiếu các pháp sư và sĩ quan bị giam cầm bằng `họ` trong lời kiến nghị của Loria (p000271) và bằng `Bọn chúng` / `bọn chúng` trong lời phản bác mang tính tư tưởng của các đảng viên (p000275, p000281). (2) Trong đối thoại chính trị tại cuộc họp: Loria (p000259, p000261, p000264, p000266, p000269, p000271, p000277, p000282, cùng câu thoại giả định ở p000284) thưa `Thưa Đồng chí Tổng Bí thư` / `Vâng, thưa Đồng chí Tổng Bí thư`, tự xưng `tôi` / `Tôi` (p000259, p000271, p000282), dùng đại từ gộp `chúng ta` / `Chúng ta` khi nhân danh tập thể đảng và đất nước (p000261, p000264, p000266, p000269, p000271, p000277, p000282), và gọi người chất vấn trong câu nói ngầm ở p000284 là `đồng chí`; Tổng Bí thư Josef (p000260, p000265) đáp ngắn gọn bề trên và gọi Loria là `Đồng chí Loria` / `đồng chí`; các đảng viên tham dự (p000275, p000281) gọi `Đồng chí Loria` / `đồng chí` và dùng `chúng ta` cho phía đảng. (3) Bảo toàn chính xác chỉ số chú thích trên cao `¹³` ngay sau `*nomenklatura*¹³` tại p000251, các mệnh đề giả định / điều kiện trái thực tế (p000255, p000267, p000269, p000274, p000279, p000281, p000284), các câu hỏi trực tiếp / nội tâm / tu từ (p000260, p000265, p000274, p000275, p000279, p000282, p000283, p000284), và toàn bộ 6 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000251 (hai cụm tách biệt `*Thế nhưng*` và `*nomenklatura*¹³`), p000273 (chỉ bọc đại từ chỉ định `Loria *đó*`), p000274 (chỉ bọc câu hỏi nội tâm `*Hắn mất trí rồi sao?*`), p000279 (chỉ bọc hai câu hỏi nội tâm cuối đoạn), p000283 (`*Đây có phải là…*`) và p000284 (bọc tách biệt hai câu hỏi nội tâm đầu đoạn và câu thoại giả định `*Sao đồng chí lại hỏi một điều hiển nhiên đến thế?*` ở giữa câu thứ ba), không phát sinh dấu `*` ngoài nguồn ở 28 đoạn còn lại."
  alternatives_vi:
  - Ông ta mất trí rồi sao? (thay cho `*Hắn mất trí rồi sao?*` tại chapter001_n/p000274 — ưu tiên `*Hắn mất trí rồi sao?*` vì phản ánh chuẩn xác thái độ kinh sợ pha lẫn căm ghét thầm kín của các ủy viên trung ương đảng đối với tên đao phủ thanh trừng Loria, tương ứng với cách nhìn thầm kín ở p000273 `coi là một tên hung tàn` và p000284 `lời lẽ của kẻ...`)
