  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000205"
    choices:
      - "Nhận định mở đầu mạch suy ngẫm chiến lược: giữ cấu trúc giả định hệ quả 'Để lộ ra bất kỳ điểm yếu nào cũng đồng nghĩa với dấu chấm hết.'"
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000206"
    choices:
      - "Khóa tên riêng 'Hợp chúng quốc', 'Khối Thịnh vượng chung', giữ mệnh đề nhượng bộ 'Ngay cả khi... vẫn sẽ ung dung đưa đạo quân đã động viên thành công của họ đổ bộ lên bờ biển phía tây.'"
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000207"
    choices:
      - "Lời tự nhủ của Tanya: khóa 'Đế quốc', 'Khối Thịnh vượng chung', giữ quan hệ điều kiện - phủ định 'chừng nào vẫn còn... sẽ không tài nào rút ra đủ binh lực'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000208"
    choices:
      - "Khóa 'các phòng tuyến chính', 'Đại Quân', giữ tương phản 'Tuy Đại Quân đã được huy động và tiêu diệt được phần lớn đạo quân xâm lược… nhưng kết quả đó cũng chỉ làm suy suyển quân số địch vừa đủ'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000209"
    choices:
      - "Trần thuật bám điểm nhìn của Tanya: giữ 'Liên bang', 'Đế quốc', 'Trái Đất', 'Đế quốc Đức ngoài đời thực', 'Lục quân Đế quốc Nga', 'mặt trận phía đông', 'Đế quốc Nga'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000210"
    choices:
      - "Bảo toàn nhấn mạnh Markdown '*…Nhưng.*' theo đúng thẻ in nghiêng của nguồn (DEC-P01-002); câu trần thuật phía sau để ngoài dấu '*'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000211"
    choices:
      - "Khóa 'nước cờ cấm kỵ', 'các phần tử cách mạng cực đoan', 'Đế quốc Nga', 'Đảng Cộng sản', 'Liên bang'; giữ sắc thái đánh giá mức độ khả thi 'chẳng mấy khả thi'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000212"
    choices:
      - "Khóa 'Lục quân Đế quốc Đức', 'Đế quốc Nga', 'vật tư và trang bị quân sự', 'Hoa Kỳ' (phân biệt với Hợp chúng quốc trong thế giới hiện tại) và đối lập 'ngang ngửa trên chiến trường… nhưng cảnh khốn cùng ở hậu phương'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000213"
    choices:
      - "Câu hỏi tự vấn thành tiếng của Tanya: dùng đại từ gộp 'chúng ta', giữ câu hỏi nghi vấn về khả năng bảo đảm an toàn ở phía tây."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000214"
    choices:
      - "Trần thuật về Tanya dùng 'nó' (DEC-P01-001), quy chiếu phía Đế quốc là 'họ'; khóa cụm 'điều cấm kỵ trong chiến lược quân sự đối với việc tác chiến trên nhiều mặt trận'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000215"
    choices:
      - "Giữ giả định trái thực tế 'Nếu có đủ sức mạnh quân sự... thì ngay từ đầu đã chẳng cần đến chiến lược', khóa thuật ngữ 'vật tư và trang bị quân sự' và đại từ 'họ'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000216"
    choices:
      - "Khóa 'Quân đội Đế quốc', 'Đế quốc', 'Khối Thịnh vượng chung', 'Liên bang', 'Hợp chúng quốc'; giữ cấu trúc phủ định mức độ 'không phải là vô địch đến mức'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000217"
    choices:
      - "Khóa 'Khối Thịnh vượng chung', 'Hải quân Ildoa', 'Hạm đội Biển khơi', 'Đế quốc', 'Hạm đội bản thổ'; giữ nhận định 'hoàn toàn chỉ là chuyện viển vông'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000218"
    choices:
      - "Khóa 'Khối Thịnh vượng chung', 'Hạm đội Nội hải lẫn Hạm đội Ngoại hải', 'hạm đội phong tỏa Norden', 'Hải quân Đế quốc'; giữ sắc thái bi quan mỉa mai ở câu cuối."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000219"
    choices:
      - "Câu chuyển đoạn ngắn giữ tên riêng 'Tanya': 'Chỉ có một việc duy nhất Tanya có thể làm trong trường hợp này.'"
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000220"
    choices:
      - "Lời cảm thán ngắn gọn của Tanya: '“Sự vùng vẫy vô nghĩa. Một sự kháng cự vô ích.”'"
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000221"
    choices:
      - "Trần thuật về Tanya dùng 'nó' và đại từ sở hữu tự quy chiếu 'mình' ('phòng mình') theo DEC-P01-001."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000222"
    choices:
      - "Độc thoại nội tâm của Tanya dùng 'mình' / 'Mình' và 'bản thân' (DEC-P01-001); khóa 'Thượng đế' và tên khoa học 'Homo sapiens'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000223"
    choices:
      - "Lời tự vấn của Tanya: xưng 'mình', khóa 'công dân có học thức', 'kẻ theo thuyết định mệnh', và từ '‘số mệnh’' trong dấu nháy đơn."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000224"
    choices:
      - "Câu dẫn ngắn trước lời khẳng định: 'Nói thẳng ra là:'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000225"
    choices:
      - "Lời đáp phủ định dứt khoát: '“Không.”'"
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000226"
    choices:
      - "Độc thoại nội tâm khái quát về loài người: giữ 'Homo sapiens', dùng đại từ ngôi thứ nhất số nhiều 'chúng ta', giữ cấu trúc phủ định kép 'không có lý do gì... và cũng chẳng có lý do gì'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000227"
    choices:
      - "Độc thoại nội tâm tiếp nối: dùng 'Chúng ta', giữ hình ảnh 'mở lối tới tương lai'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000228"
    choices:
      - "Trần thuật hành động của Tanya: giữ tên riêng 'Tanya' và đại từ phản thân 'mình' ('lòng bàn tay mình')."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000229"
    choices:
      - "Trần thuật về Tanya dùng 'nó', giữ tương phản giữa 'Những ngón tay bé gái mảnh mai' và 'những vết chai sạn kỳ dị do quá trình huấn luyện'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000230"
    choices:
      - "Bảo toàn nhấn mạnh Markdown '*…Thế này là ổn rồi.*' theo đúng thẻ in nghiêng của nguồn (DEC-P01-002); câu trần thuật 'Nó mỉm cười.' để ngoài dấu '*' và dùng 'Nó' (DEC-P01-001)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000231"
    choices:
      - "Mệnh đề khái quát đầu đoạn dịch tự nhiên với 'chính mình'; câu cuối bọc nhấn mạnh Markdown '*Mình sẽ tự tay nắm lấy tương lai.*' theo đúng nguồn (DEC-P01-002) và dùng 'Mình' (DEC-P01-001)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000232"
    choices:
      - "Không bọc dấu '*' cho thẻ '<html:strong>' theo quy ước validator và DEC-P01-002; trần thuật về Tanya dùng 'nó' và phản thân 'mình'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000233"
    choices:
      - "Câu hỏi tu từ khái quát trong nội tâm: chuyển chủ thể ngôi thứ hai phiếm chỉ sang 'người ta', giữ 'điều kiện tiên quyết để có một cuộc sống đàng hoàng'."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000234"
    choices:
      - "Bảo toàn nhấn mạnh Markdown toàn câu '*Mình sẽ kháng cự, cho dù chỉ có một mình mình đi chăng nữa.*' (DEC-P01-002) và tự xưng 'Mình' / 'mình' (DEC-P01-001)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000235"
    choices:
      - "Trần thuật về Tanya dùng 'nó' / 'Nó' và 'mình' (DEC-P01-001); chỉ bọc nhấn mạnh Markdown cho thán từ '*Ồ.*' ở giữa đoạn theo đúng nguồn (DEC-P01-002)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000236"
    choices:
      - "Bảo toàn nhấn mạnh Markdown toàn câu '*Mình không hề đơn độc.*' (DEC-P01-002) và tự xưng 'Mình' (DEC-P01-001)."
  - segment_id: "YS-LN04/Text/chapter001_r.xhtml/p000237"
    choices:
      - "Chỉ bọc nhấn mạnh Markdown cho phần độc thoại nội tâm '*Mình có những người bạn tuyệt vời. Quả là một tin tức tuyệt vời*' theo đúng nguồn (DEC-P01-002); phần trần thuật phía sau để ngoài dấu '*' và dùng 'nó' (DEC-P01-001)."
