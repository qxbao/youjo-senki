  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, hô hiệu và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b19` của Tập 4 (`Dacia`, `Tanya`, `điện đài vô tuyến` / `sóng vô tuyến`, `rút lui`, `hỏa lực phòng không`, `bọn Cộng sản` / `đám Cộng sản`, `Thiếu tá`, `Tiểu đoàn Pháp sư Trên không số 203`, `những kẻ cuồng chiến`, `Fairy 01`, `đại đội`, `phòng tuyến của địch`, `truy tìm và tiêu diệt` / `quy trình tìm diệt` / `tìm diệt`, `lực lượng pháp sư` / `pháp sư`, `Weiss`, `Phó chỉ huy`, `lực lượng yểm trợ trên không`, `bia đỡ đạn`, `mồi nhử`, `chủ lực`, `công kích mục tiêu mặt đất`, `Lục quân Liên bang`, `lực lượng không quân`, `Sư đoàn số 3 và Sư đoàn số 32`, `Tiegenhoff`, `Liên bang`, `sinh lực tác chiến`, `lực lượng dự bị`, `hỏa lực đánh chặn phòng không`, `tầm bắn`, `Trung úy Serebryakov` / `Serebryakov`), đồng thời khóa tạm các thuật ngữ hải quân và hình ảnh chiến thuật trong lô (`08`, `01`, `nới rộng chiến quả`, `Hải quân Hoa Kỳ`, `các tàu canh giới radar`, `hạm đội`, `bẫy đèn`)."
