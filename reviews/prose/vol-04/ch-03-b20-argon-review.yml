- source_term: tiegenhoff_tanya_pov_narration_and_203rd_search_and_destroy_dialogue_pronouns_and_emphasis_vol04_ch03_b20
  proposed_vi: "Trong toàn bộ lô `vol-04-ch-03-b20` (chapter001_l/p000507–p000543) khi Tiểu đoàn Pháp sư Trên không số 203 rút lui sau đòn tập kích đầu tiên rồi tiếp tục thực hiện quy trình tìm diệt qua tám sư đoàn Liên bang dưới sự chỉ huy của Thiếu tá Tanya Degurechaff: tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b19`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya quy chiếu Tanya nhất quán bằng tên riêng `Tanya` và đại từ `nó` / `Nó` kết hợp phản thân `mình` / `bản thân` (p000508, p000512, p000516, p000519–p000521, p000524, p000529, p000533, p000536, p000537, p000541), tuyệt đối không dùng `cô` cho Tanya trong lời kể hay độc thoại nội tâm; trong các câu độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng `mình` / `Mình` (p000507, p000516, p000535), và ngôi thứ nhất số nhiều chỉ tập thể đơn vị dùng `chúng tôi` (p000516, p000520, p000535, p000541); tại câu điều kiện nhận định khái quát có đại từ ngôi thứ hai phiếm chỉ trong nguồn (p000541), lược đại từ ngôi thứ hai phiếm chỉ theo quy ước `direct-address choice`. (2) Trong lời kể và nội tâm, quy chiếu Phó chỉ huy Weiss bằng `anh` trong lời kể và `anh ấy` trong câu nhận định nội tâm của Tanya (p000520, p000521, p000524), quy chiếu Trung úy Serebryakov bằng `cô` kết hợp phản thân `mình` trong lời kể (p000543), quy chiếu tập thể Tiểu đoàn 203 / đơn vị bằng `họ` (p000516, p000517, p000519, p000531, p000532, p000539), và quy chiếu quân địch Liên bang / Cộng sản bằng `chúng` (p000517, p000527, p000535, p000540, p000541). (3) Trong hội thoại: giữa Tanya (`01` / `Fairy 01`) với thuộc cấp `08` và toàn tiểu đoàn (p000509–p000511, p000514, p000515, p000518, p000528), thuộc cấp gọi `Thiếu tá` và dùng `chúng ta` kèm `ạ`, còn Tanya dùng `Chúng ta` / `chúng ta` và tự xưng `Tôi` (p000528); khi trao đổi với Phó chỉ huy Weiss (p000522, p000523, p000525), Tanya gọi `Phó chỉ huy`, `anh` và dùng `chúng ta`, còn Weiss tự xưng `Tôi`, gọi Tanya là `thưa Thiếu tá` và dùng `chúng ta` / `quân ta` cho phía Đế quốc, `chúng` cho quân Liên bang; trong lời lẩm bẩm chất vấn quân Liên bang từ xa (p000534), Tanya gọi địch là `lũ khốn Liên bang các ngươi` / `Các ngươi` và tự xưng `Ta`; khi trao đổi với Trung úy Serebryakov (p000542, p000543), Tanya gọi `Trung úy Serebryakov`, còn Serebryakov gọi `Thưa Thiếu tá` và tự xưng đại diện đơn vị là `chúng tôi` kèm `ạ`. (4) Bảo toàn chính xác 8 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000507 (`*Cảnh này thực sự khiến mình nhớ lại trận đấu một chiều ở Dacia ngày trước.*`), p000508 (`*Nhưng.*`), p000516 (`*Mình hiểu cảm giác của họ, nhưng chúng tôi không thể lẫn lộn giữa mục tiêu và phương thức được.*`), p000521 (`*Được thôi.*`), p000533 (`*Vẫn còn nữa sao?*`), p000535 (`*Chỉ riêng trong khu vực mà chúng tôi đang phụ trách thôi thì đã có bao nhiêu quân rồi?*`), p000536 (`*Không.*`) và p000540 (`*Đây chính là cách làm việc của chúng sao?*`), không phát sinh dấu `*` ngoài nguồn ở 29 đoạn còn lại."
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_l/p000516, p000520, p000535, p000541 — ưu tiên `chúng tôi` để phân biệt rạch ròi giữa độc thoại nội tâm của Tanya và đại từ gộp `chúng ta` khi Tanya phát lệnh trong thoại trực tiếp, đồng bộ với `vol-04-ch-03-b19`)
