  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch tuyệt đối với `vol-04-ch-03-b19` (`Tanya` / `nó` trong trần thuật, `mình` / `chúng tôi` trong độc thoại nội tâm của Tanya, `anh` / `anh ấy` cho Weiss, `cô` cho Serebryakov, `họ` cho đơn vị Đế quốc, `chúng` cho quân Liên bang, cùng hệ xưng hô quân ngũ chuẩn mực giữa Tanya với thuộc cấp `08`, Phó chỉ huy Weiss, Trung úy Serebryakov và toàn tiểu đoàn), đồng thời bảo toàn chính xác cả 8 vị trí nhấn mạnh in nghiêng ở p000507, p000508, p000516, p000521, p000533, p000535, p000536 và p000540."
