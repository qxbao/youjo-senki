  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` của Tập 4 (`Tướng von Zettour` / `Zettour`, `Phó cục trưởng Cục Hậu cần`, `Bộ Tư lệnh Tối cao`, `Cục Nhân sự`, `Tướng von Rudersdorf` / `Rudersdorf`, `Dacia`, `phòng ngự có chiều sâu`, `chính quốc`, `Liên bang`, `mặt trận phía đông`, `Norden`, `sư đoàn`, `máy bay trinh sát`, `tiền tuyến`, `Lục quân Đế quốc`, `chiến lược nội tuyến`, `Bộ Tổng tham mưu`, `sức chiến đấu`, `Lục quân Liên bang`, `Đế quốc`, `Cục Tác chiến`), đồng thời khóa tạm các tổ hợp thuật ngữ quân sự phát sinh trong phân cảnh phân tích ba cụm quân Liên bang và học thuyết nội tuyến (`sư đoàn hạng nặng`, `Cụm A`, `Cụm B`, `Cụm C`, `tình báo tín hiệu`, `tấn công đa diện`, `ưu thế vật tư`, `chiến thuật biển người`, `bão hòa vật tư`, `quyền tự chủ tác chiến`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: imperial_general_staff_war_room_zettour_rudersdorf_pronouns_vol04_ch03_b02
  proposed_vi: "Trong phân cảnh thảo luận chiến lược tại Phòng Tác chiến thuộc Văn phòng Bộ Tổng tham mưu Đế quốc giữa Trung tướng von Zettour và Trung tướng von Rudersdorf về phương án điều quân sang phía đông và đánh giá ba cụm quân tiến công của Liên bang (chapter001_j/p000026–p000048): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-03-b01`: (1) Trần thuật ngôi thứ ba quy chiếu Trung tướng von Zettour và Trung tướng von Rudersdorf bằng đại từ trang trọng `ông` / `Ông` (p000029, p000041, p000048) kết hợp tên riêng (`Zettour`, `Rudersdorf`) và đại từ phản thân `mình` (p000046); trong câu cảm thán nội tâm in nghiêng tại p000028 (`*Đúng là tệ quan liêu điển hình.*`) và tiếng ngẫm nghĩ tại p000032 (`*Ừm.*`) dùng cấu trúc ngắn gọn tự nhiên. (2) Quy chiếu cặp đôi hai vị tướng, Lục quân Đế quốc, các đạo quân phía đông và những người đứng đầu Cục Tác chiến bằng `họ` (p000028, p000029, p000033, p000039, p000043, p000048) kết hợp đại từ phản thân `mình` (p000039); quy chiếu phía Liên bang và quân đội Liên bang bằng `chúng` (p000038, p000041, p000043). (3) Trong đối thoại trực tiếp giữa hai vị tướng đồng cấp kiêm bạn hữu (p000026, p000027, p000030, p000031, p000035–p000038, p000041, p000044, p000045, p000047): người nói tự xưng `tôi` / `Tôi`, gọi đối phương là `ông` kèm danh xưng `Tướng von Zettour` / `Tướng von Rudersdorf`, và dùng `chúng ta` khi nói về Bộ Tổng tham mưu và Lục quân Đế quốc"
  alternatives_vi:
  - anh / cậu (thay cho `ông` trong đối thoại giữa Zettour và Rudersdorf tại chapter001_j/p000026, p000035–p000037, p000044, p000045 — bắt buộc giữ cặp `tôi` – `ông` để đồng bộ tuyệt đối với `vol-04-ch-03-b01` và toàn bộ các phân cảnh giữa hai vị tướng ở Tập 1–4) / họ (thay cho `chúng` khi chỉ quân Liên bang tại chapter001_j/p000038, p000041, p000043 — ưu tiên `chúng` để giữ đúng góc nhìn đối kháng quân sự và tránh trùng với đại từ `họ` chỉ phía Đế quốc trong cùng đoạn p000043)
