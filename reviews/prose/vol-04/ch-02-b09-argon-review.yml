- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000285
  locks:
  - "Giữ tiếng cười cảm thán `“Ha-ha-ha-ha! Vui thật đấy!”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000286
  locks:
