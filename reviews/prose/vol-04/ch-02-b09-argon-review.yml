  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, đơn vị, quốc gia, địa danh, công trình, hô hiệu và thuật ngữ quân sự – ma pháp đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B08 Chương 2 của Tập 4 (`Tanya`, `Serebryakov`, `Thiếu tá`, `đại đội trưởng`, `pháo hiệu`, `Moskva` / `trung tâm Moskva`, `Đế quốc Mỹ`, `Liên bang`, `Lục quân Đế quốc`, `đội hình hộp chiến đấu`, `các pháp sư Đế quốc`, `quả cầu tính toán`, `Đại đội 1`, `Đại đội 4`, `lũ Cộng sản`, `Fairy 01` / `01`, `Sildberia`, `Cung điện Nhân dân`, `thuật thức` / `khởi phát thuật thức` / `thuật thức nổ`, `Điện Kremlin`), đồng thời khóa tạm các định danh lịch sử, hô hiệu và thuật ngữ tác chiến – tâm lý chiến xuất hiện trong đợt công kích mở màn tại Moskva (`đội hình đột kích`, `cuộc Không kích Tokyo của Doolittle.⁹`, `quốc ca` / `quốc ca Đế quốc`, `thuật thức khuếch đại âm thanh`, `Fairy 06` / `06`, `Fairy 09`, `*Jericho-Trompete*`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_moskva_raid_commencement_and_company_radio_pronouns_vol04_ch02_b09
  proposed_vi: "Trong phân cảnh Thiếu tá Tanya von Degurechaff phát lệnh mở màn cuộc oanh tạc phô trương thanh thế trên bầu trời Moskva, dẫn Đại đội 1 hát vang quốc ca Đế quốc và bắn sập Cung điện Nhân dân (chapter001_f/p000248–p000288): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối B07–B08, trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` / `Nó` xuyên suốt (p000264, p000265, p000268, p000271, p000272, p000276, p000281, p000284, p000286, p000287), kết hợp đại từ phản thân `mình` (p000256, p000263, p000264) và định danh bằng tên riêng `Tanya` (p000248, p000256, p000263, p000281, p000284, p000287); trong độc thoại nội tâm trực tiếp, Tanya tự quy chiếu ngôi thứ nhất số ít bằng `Mình` / `mình` (p000269, p000277, p000286) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `Chúng tôi` / `chúng tôi` (p000252–p000254, p000258, p000270, p000281); dùng chủ ngữ khái quát `người ta` cho đại từ ngôi thứ hai phiếm chỉ ở p000254; quy chiếu phía Liên bang / Cộng sản bằng `chúng` / `Chúng` / `đám người này` (p000251, p000254, p000255, p000257–p000260, p000269, p000281). Trong đối thoại và liên lạc vô tuyến nội bộ Tiểu đoàn 203 (p000249–p000251, p000256, p000260–p000262, p000266, p000267, p000273–p000275, p000278–p000280, p000282, p000283, p000285, p000287, p000288): Tanya (`Fairy 01` / `01`) tự xưng `Tôi` / `tôi`, dùng `chúng ta` khi bao hàm cả đơn vị, gọi các đơn vị là `Tất cả các đơn vị` / `tất cả các đơn vị`, `Đại đội 1`, `06`, và gọi ngôi thứ hai số nhiều là `các anh chị` (p000251, p000280); các sĩ quan và pháp sư thuộc cấp (`Fairy 06` / `06`, `Fairy 09` và các thành viên tiểu đoàn) tự xưng `tôi` / `Chúng tôi` / `chúng tôi`, dùng `chúng ta`, gọi Tanya lễ phép là `thưa Thiếu tá` / `Thiếu tá` kèm tiểu từ kính ngữ `ạ`, và đồng thanh đáp `“““Rõ, thưa Thiếu tá!”””` (p000261)"
  alternatives_vi:
  - cô (thay cho `nó` / `Nó` khi quy chiếu Tanya trong trần thuật ngôi thứ ba tại chapter001_f/p000264, p000265, p000268, p000271, p000272, p000276, p000281, p000284, p000286, p000287 — bắt buộc giữ `nó` / `Nó` theo quyết định đã duyệt `DEC-P01-001` trong `canon/decisions.md` vì toàn bộ phân cảnh bám sát điểm nhìn của Tanya) / các cậu (thay cho `các anh chị` khi Tanya truyền lệnh và khích lệ thuộc cấp qua vô tuyến tại chapter001_f/p000251, p000280 — ưu tiên `các anh chị` để giữ đúng phong thái chỉ huy lịch sự, chuyên nghiệp của Tanya trước toàn quân và đồng bộ tuyệt đối với `ch-02-b07` – `ch-02-b08`)
