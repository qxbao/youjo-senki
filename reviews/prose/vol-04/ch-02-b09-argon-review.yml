  proposed_vi: "Tanya, Serebryakov, đội hình đột kích (chapter001_f/p000248) / đại đội trưởng, pháo hiệu, truyền tin trên diện rộng (chapter001_f/p000249) / mục tiêu chiến thuật, mục tiêu tác chiến (chapter001_f/p000250, p000256) / sự tàn phá đầy sáng tạo (chapter001_f/p000251) / Moskva, trung tâm Moskva, cuộc Không kích Tokyo của Doolittle.⁹, Đế quốc Mỹ (chapter001_f/p000252, p000263, p000264, p000270, p000271) / Liên bang, tuyên truyền, đảng (chapter001_f/p000253, p000256, p000264) / viện binh, các tuyến chính, mổ xẻ hậu sự cố, tự phê bình (chapter001_f/p000255) / Lục quân Đế quốc, không phận thủ đô (chapter001_f/p000257) / Thiếu tá (chapter001_f/p000261, p000267, p000279, p000288) / đội hình hộp chiến đấu, các pháp sư Đế quốc (chapter001_f/p000263) / quả cầu tính toán (chapter001_f/p000264) / Đại đội 1, quốc ca, quốc ca Đế quốc, khúc quân nhạc (chapter001_f/p000266, p000271, p000279) / lũ Cộng sản, thuật thức khuếch đại âm thanh (chapter001_f/p000269, p000270, p000277, p000281, p000287) / Fairy 06, 06, Fairy 01, 01, Sildberia (chapter001_f/p000273–p000275, p000280, p000282, p000288) / huân chương (chapter001_f/p000277) / *Jericho-Trompete*, Cung điện Nhân dân (chapter001_f/p000281, p000286) / thuật thức, khởi phát thuật thức, thuật thức nổ (chapter001_f/p000282, p000284) / Đại đội 4, Fairy 09, Điện Kremlin (chapter001_f/p000287, p000288)"
