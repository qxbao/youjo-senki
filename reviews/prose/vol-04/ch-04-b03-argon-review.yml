  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, tiếp nối liền mạch `vol-04-ch-04-b01` – `b02` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` cho Lergen, `ông` cho Zettour, `cô` / `cô ấy` cho Thiếu tá von Degurechaff trong góc nhìn khách quan của Lergen, biên bản và lời lẩm bẩm, `anh ta` cho vị công tố viên, `họ` cho các sĩ quan tham dự / lực lượng Đế quốc / hậu phương, `chúng` cho quân địch, `chúng tôi` / `Tôi` – `cô` khi Trung tướng von Zettour tuyên đọc phán quyết), đồng thời bảo toàn chính xác cấu trúc `không những... mà còn...`, các câu hỏi tu từ / tự vấn và cả 2 vị trí nhấn mạnh in nghiêng tại p000054 và p000062."
