  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` – `b02` (`Degurechaff` / `Thiếu tá Tanya von Degurechaff` / `Thiếu tá von Degurechaff`, `thái độ điềm nhiên, đậm chất công vụ`, `công tố viên` / `bên công tố`, `bên bào chữa`, `những hành động tự ý`, `các sĩ quan Bộ Tổng tham mưu`, `biên bản`, `quá tay`, `lục quân`, `Zettour`, `trò hề`, `phiên điều trần`, `các cáo buộc`, `phán quyết`, `Huy hiệu Phục vụ Chiến trường`, `kinh nghiệm thực chiến`, `tiền tuyến`, `Lergen`, `Bộ Tư lệnh Tối cao`, `nội các`, `Moskva`, `Lục quân Đế quốc`, `quân Liên bang`, `biên giới phía đông`, `mặt trận Rhine`, `lực lượng không quân`, `mặt trận phía đông`, `hậu phương`, `đòn tấn công quấy rối`, `Đế quốc`, `hậu phương trong nước`), đồng thời khóa tạm các thuật ngữ hành chính – quân sự và chiến lược trong lô (`Người điều phối`, `các bản ghi nhớ của lục quân`, `Cục Tình báo Đối ngoại`, `các tuyến tiền tiêu`, `logic thời tiền chiến` / `tư duy logic thời tiền chiến`, `phạm vi thẩm quyền riêng của lục quân`)."
