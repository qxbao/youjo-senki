- source_term: lergen_pov_inquiry_close_and_reflection_pronouns_address_and_emphasis_vol04_ch04_b03
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` – `b02` trong toàn bộ 22 đoạn của `vol-04-ch-04-b03` (chapter001_n/p000049–p000070) từ lúc khép lại phiên điều trần tới khi Đại tá von Lergen rời phòng họp: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen) và `DEC-P01-002`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, đại từ `ông` / `Ông` và đại từ phản thân `mình` (p000049, p000057–p000060, p000064, p000067, p000068); quy chiếu Trung tướng von Zettour bằng tên riêng `Zettour` và đại từ `ông` (p000052–p000054); quy chiếu Thiếu tá Tanya von Degurechaff từ góc nhìn khách quan của Lergen và hội đồng bằng `Thiếu tá Tanya von Degurechaff` / `Thiếu tá von Degurechaff` / `Degurechaff` và đại từ `cô` (p000049, p000050, p000058–p000060, p000067); quy chiếu vị công tố viên ở p000052 bằng `vị công tố viên` và `anh ta`; quy chiếu các sĩ quan Bộ Tổng tham mưu, lực lượng Đế quốc hoặc phía hậu phương bằng `họ` / `Họ` / `bọn họ` kết hợp phản thân `mình` (p000050, p000054, p000065, p000066, p000068, p000069) và quy chiếu quân địch Liên bang bằng `chúng` (p000065); tại các câu nhận định có đại từ ngôi thứ hai phiếm chỉ trong nguồn ở p000060 và p000063, dùng chủ ngữ khái quát `người ta` theo quy ước `direct-address choice`. (2) Trong đối thoại, trích dẫn biên bản và lời tự vấn: ý kiến ghi trong biên bản (p000051) dùng `Cô ấy` / `cô ấy` khi nhắc tới Thiếu tá von Degurechaff và `Chúng ta` cho hội đồng/quân đội; Trung tướng von Zettour khi tuyên đọc phán quyết trước hội đồng (p000053, p000055) gọi `Thiếu tá Tanya von Degurechaff` và `cô`, dùng `chúng ta` khi mở lời với toàn bộ phòng họp (p000053) và khi nói về đại nghĩa chung (p000055), tự xưng `chúng tôi` khi đại diện hội đồng điều trần bác bỏ cáo buộc (p000053) và tự xưng `Tôi` khi chính thức tuyên bố khép lại phiên điều trần (p000055); Đại tá von Lergen khi tự vấn và lẩm bẩm một mình (p000061, p000063) tự xưng `mình`, quy chiếu Thiếu tá von Degurechaff ở ngôi thứ ba bằng `cô ấy`, và câu hồi tưởng lập luận tác chiến (p000062) dùng `chúng ta` cho phía Đế quốc. (3) Bảo toàn chính xác cấu trúc tăng tiến `không những... mà còn...` (p000058), các câu hỏi tu từ / tự vấn (p000054, p000061), câu điều kiện (p000062), và cả 2 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000054 (`*Vở kịch kết thúc rồi*`) và p000062 (`*Nếu chúng ta có thể đánh vào Moskva, chúng ta có thể kéo ít nhất một phần quân Liên bang ra khỏi cuộc giao tranh ở biên giới phía đông.*`), không phát sinh dấu `*` ngoài nguồn ở 20 đoạn còn lại."
  alternatives_vi:
  - lược chủ ngữ phiếm chỉ (thay cho chủ ngữ khái quát `người ta` tại chapter001_n/p000060 và p000063 — cả hai cách đều thuộc quy ước `direct-address choice`; ưu tiên `người ta` để nhịp câu văn xuôi tự nhiên, rõ nghĩa)
