  proposed_vi: "Degurechaff / Thiếu tá Tanya von Degurechaff / Thiếu tá von Degurechaff, thái độ điềm nhiên, đậm chất công vụ, Người điều phối, công tố viên / bên công tố, Bên bào chữa / bên bào chữa, danh dự của một sĩ quan, những hành động tự ý, các sĩ quan Bộ Tổng tham mưu, biên bản, quá tay, các cơ sở quân sự, các bản ghi nhớ của lục quân, các cơ sở dân sự, các cơ sở của đảng hoặc quân đội, Zettour, trò hề, Phiên điều trần / phiên điều trần, các cáo buộc, phán quyết, quân phục, Huy hiệu Phục vụ Chiến trường, kinh nghiệm thực chiến, tiền tuyến, đại nghĩa, Lergen, Bộ Tư lệnh Tối cao, Cục Tình báo Đối ngoại, nội các, Moskva, lục quân, sĩ quan Lục quân Đế quốc kiểu mẫu / Lục quân Đế quốc, quân Liên bang, biên giới phía đông, mặt trận Rhine, lực lượng không quân, mặt trận phía đông, góc nhìn của một người lính, hậu phương, các tuyến tiền tiêu, đòn tấn công quấy rối, thủ đô, Đế quốc, logic thời tiền chiến / tư duy logic thời tiền chiến, hậu phương trong nước, phạm vi thẩm quyền riêng của lục quân (chapter001_n/p000049–p000055, p000057–p000060, p000062–p000070)"
  alternatives_vi:
  - người chủ trì (thay cho `Người điều phối` tại chapter001_n/p000049 — ưu tiên `Người điều phối` để phản ánh sát nghĩa vai trò điều phối trung gian trên danh nghĩa được đặt cạnh `ghế chủ tọa` ở lô trước) / Ban Tình báo Đối ngoại hoặc Phòng Tình báo Đối ngoại (thay cho `Cục Tình báo Đối ngoại` tại chapter001_n/p000058 — ưu tiên cấp `Cục` để đồng bộ hệ thống tổ chức với `Cục Tác chiến`, `Cục Nhân sự`, `Cục Quân vụ` trong Bộ Tổng tham mưu / Bộ Tư lệnh Tối cao) / các tuyến tiền phương xa nhất (thay cho `các tuyến tiền tiêu` tại chapter001_n/p000065 — ưu tiên `các tuyến tiền tiêu` vì chuẩn xác, cô đọng trong thuật ngữ quân sự tiếng Việt)
