  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ trần thuật `ông` và nội tâm tự quy chiếu `mình` của Đại tá von Lergen, cách quy chiếu `cô` / `cô ấy` đối với Thiếu tá von Degurechaff từ góc nhìn Bộ Tổng tham mưu, cũng như chuẩn mực xưng hô quân sự giữa Trung tướng von Zettour, Đại tá von Lergen và các sĩ quan tham mưu."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000026
  locks:
  - "Giữ định danh `Văn phòng Bộ Tổng tham mưu` và câu `Và ở tâm điểm của cơn xoáy lốc ấy chính là Văn phòng Bộ Tổng tham mưu…`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000027
  locks:
  - "Giữ các danh xưng `Tiểu đoàn Pháp sư Trên không số 203`, `Thiếu tá Tanya von Degurechaff`, `Trung tướng von Zettour`, `Liên bang`, cách xưng hô `thưa các vị` – `tôi` và đại từ `Họ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000028
  locks:
  - "Giữ danh xưng `Bộ Tổng tham mưu` và cụm `một đơn vị trực thuộc Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000029
  locks:
  - "Giữ câu thoại của Zettour `“Đại tá von Lergen, hãy nghe xem anh có ý kiến gì.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000030
  locks:
  - "Giữ các thuật ngữ `các tập đoàn quân khu vực`, `Bộ Tổng tham mưu` và cụm `vượt cấp qua đầu các tập đoàn quân khu vực để xin chỉ thị thẳng từ Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000031
  locks:
  - "Giữ cấu trúc tăng tiến `chẳng những… lại còn…`, các danh xưng `Bộ Tổng tham mưu`, `Tiểu đoàn Pháp sư Trên không số 203`, `Liên bang` và đại từ `họ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000032
  locks:
  - "Giữ câu đáp của Lergen `“Thưa ngài, nếu có cơ hội thành công, tôi nghĩ cứ để cô ấy thử xem cũng đáng.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000033
  locks:
  - "Giữ câu `Đó là một kế hoạch đánh thẳng vào thủ đô.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000034
  locks:
  - "Giữ câu nội tâm in nghiêng `*Điều đáng kinh ngạc chính là lối tư duy của Thiếu tá von Degurechaff.*` theo DEC-P01-002, cùng tên riêng `Lergen` và cặp đại từ `ông` – `cô`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000035
  locks:
  - "Giữ toàn bộ đoạn độc thoại nội tâm in nghiêng theo DEC-P01-002, các thuật ngữ `các chiến tuyến phía đông`, `trận trì hoãn`, `hậu phương địch`, `Liên bang` và đại từ `cô ấy` / `chính họ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000036
  locks:
  - "Giữ hai cụm in nghiêng `*Không*` và `*ắt hẳn mình đã bị cuốn vào vòng ảnh hưởng của cô ấy mất rồi.*` theo DEC-P01-002, cùng đại từ trần thuật `ông` và nội tâm `mình` – `cô ấy`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000037
  locks:
  - "Giữ cấu trúc giả định trái thực tế, danh xưng `Liên bang` và cụm `lời khoác lác lố bịch ấy`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000038
  locks:
  - "Giữ câu thoại `“Nói thẳng ra, nếu tạm gác rủi ro sang một bên thì lợi ích thu về là khổng lồ. Mà khả năng thành công cũng tuyệt nhiên không hề thấp.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000039
  locks:
  - "Giữ danh xưng `Bộ Tổng tham mưu`, đại từ `cô` / `họ` và cụm `sự táo bạo lấn quyền của cô`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000040
  locks:
  - "Giữ câu `Lergen tin rằng việc đó có thể thực hiện được, ngay cả khi không một ai khác tin như vậy.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000041
  locks:
  - "Giữ câu thoại `“…Một cuộc tấn công trực diện vào thủ đô. Xét như một đòn nghi binh đánh lạc hướng, nó thật hoàn hảo.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000042
  locks:
  - "Giữ mệnh đề độc thoại nội tâm in nghiêng mở đầu câu theo DEC-P01-002, các thuật ngữ `trận trì hoãn`, `Tiểu đoàn Pháp sư Trên không số 203`, tên riêng `Lergen` và đại từ `mình` / `cô`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000043
  locks:
  - "Giữ câu thoại `“Bức điện của cô ấy nói rằng cô ấy xin phép thực hiện vì cân nhắc đến các yếu tố chính trị.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000044
  locks:
  - "Giữ câu nội tâm in nghiêng `*Chẳng bao giờ đoán được cô ấy đang nghĩ gì.*` theo DEC-P01-002, thuật ngữ `sĩ quan ma pháp` và tên riêng `Lergen`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000045
  locks:
  - "Giữ câu nội tâm in nghiêng `*Đây chắc chắn là ý tưởng của Thiếu tá von Degurechaff.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000046
  locks:
  - "Giữ từ chỉ định nhấn mạnh in nghiêng `Đây chính là vị thiếu tá *đó*.` theo DEC-P01-002 và cụm `thỉnh cầu một cách vòng vo để cấp trên bác bỏ ý tưởng đó đi`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000047
  locks:
  - "Giữ đại từ `cô` / `Cô` / `mình` và các cụm `chiếu cố cho đám thuộc cấp miễn cưỡng của mình`, `rào trước đón sau đâu vào đấy một cách đáng nể`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000048
  locks:
  - "Giữ đại từ `cô` và cụm `sự cố đánh chìm tàu ngầm của Khối Thịnh vượng chung`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000049
  locks:
  - "Giữ câu thoại `“Có khả năng kế hoạch sẽ hiệu quả. Hơn nữa nó sẽ là một đòn nghi binh tốt, nên tôi cho rằng chúng ta cứ để cô ấy thực hiện.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000050
  locks:
  - "Giữ danh xưng `Liên bang`, thuật ngữ `đòn nghi binh hoàn hảo`, đại từ `họ` và các cụm `rút bớt một phần thực lực về để bảo vệ thành phố`, `rút bớt quân khỏi tiền tuyến`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000051
  locks:
  - "Giữ danh xưng `Đại tá von Lergen` và các cụm `ví dụ điển hình của chuyện nói thì dễ hơn làm`, `kéo theo cả một núi khó khăn`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000052
  locks:
  - "Giữ từ nhấn mạnh in nghiêng `—*giả sử*—` theo DEC-P01-002, các danh xưng và thuật ngữ `thủ đô Dacia`, `sở chỉ huy Lục quân Cộng hòa trên mặt trận Rhine`, `sở chỉ huy địch trên chiến tuyến phía nam`, `Degurechaff`, `Tiểu đoàn Pháp sư Trên không số 203`, `chiến thuật chặt đầu`, `Quân đội Liên bang`, `chiến tuyến chính ở phía đông`, cùng các đại từ `Họ` / `họ` / `các vị` / `chúng ta`."
