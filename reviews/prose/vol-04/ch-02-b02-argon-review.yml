- source_term: imperial_general_staff_federation_capital_raid_deliberation_terms_vol04_ch02_b02
  proposed_vi: "Văn phòng Bộ Tổng tham mưu, Bộ Tổng tham mưu (chapter001_f/p000026, p000028, p000030, p000031, p000039) / Tiểu đoàn Pháp sư Trên không số 203, Thiếu tá Tanya von Degurechaff, Thiếu tá von Degurechaff, Degurechaff, Trung tướng von Zettour, Liên bang, thủ đô Liên bang, thủ đô của Liên bang (chapter001_f/p000027, p000031, p000034, p000035, p000037, p000042, p000045, p000050, p000052) / Đại tá von Lergen, Lergen (chapter001_f/p000029, p000034, p000040, p000042, p000044, p000051) / các tập đoàn quân khu vực (chapter001_f/p000030) / các chiến tuyến phía đông, trận trì hoãn, hậu phương địch (chapter001_f/p000035, p000042) / đòn nghi binh đánh lạc hướng, đòn nghi binh (chapter001_f/p000041, p000049, p000050) / sĩ quan ma pháp (chapter001_f/p000044) / sự cố đánh chìm tàu ngầm của Khối Thịnh vượng chung (chapter001_f/p000048) / thủ đô Dacia, sở chỉ huy Lục quân Cộng hòa trên mặt trận Rhine, sở chỉ huy địch trên chiến tuyến phía nam, chiến thuật chặt đầu, Quân đội Liên bang, chiến tuyến chính ở phía đông (chapter001_f/p000052)"
  alternatives_vi:
  - Lục quân Liên bang (thay cho `Quân đội Liên bang` tại chapter001_f/p000052 — cả hai phương án đều tự nhiên và chuẩn xác trong ngữ cảnh Lergen đánh giá sức ép quân sự tổng thể của đối phương lên chiến tuyến chính ở phía đông, tương tự cách dùng song song `Lục quân Đế quốc` / `Quân đội Đế quốc` ở Chương 1) / chiến thuật trảm thủ (thay cho `chiến thuật chặt đầu` tại chapter001_f/p000052 — ưu tiên `chiến thuật chặt đầu` vì đồng bộ tuyệt đối với thuật ngữ đã khóa tạm từ Tập 2–3 khi mô tả các đòn tập kích tiêu diệt sở chỉ huy đầu não đối phương của Tiểu đoàn 203)
