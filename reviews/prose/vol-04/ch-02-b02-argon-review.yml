  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan tham mưu, đơn vị, quốc gia, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01 Chương 2 của Tập 4 (`Văn phòng Bộ Tổng tham mưu`, `Bộ Tổng tham mưu`, `Tiểu đoàn Pháp sư Trên không số 203`, `Thiếu tá Tanya von Degurechaff` / `Thiếu tá von Degurechaff` / `Degurechaff`, `Trung tướng von Zettour`, `Đại tá von Lergen` / `Lergen`, `Liên bang`, `các tập đoàn quân khu vực`, `trận trì hoãn`, `sĩ quan ma pháp`, `Khối Thịnh vượng chung`, `Dacia`, `Lục quân Cộng hòa`, `mặt trận Rhine`, `chiến thuật chặt đầu`), đồng thời khóa tạm các cụm thuật ngữ tác chiến – chính trị xuất hiện trong cuộc họp bàn về kế hoạch đột kích thủ đô Liên bang (`đòn nghi binh đánh lạc hướng` / `đòn nghi binh`, `sự cố đánh chìm tàu ngầm của Khối Thịnh vượng chung`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: zettour_lergen_general_staff_meeting_and_tanya_reference_pronouns_vol04_ch02_b02
  proposed_vi: "Trong phân cảnh cuộc họp tại Văn phòng Bộ Tổng tham mưu do Trung tướng von Zettour chủ trì cùng Đại tá von Lergen và các sĩ quan tham mưu (chapter001_f/p000026–p000052): trần thuật điểm nhìn ngôi thứ ba quy chiếu Lergen bằng `ông` (p000034, p000036) kết hợp đại từ phản thân `mình` (p000042) và giữ nguyên tên riêng `Lergen` (p000034, p000040, p000042, p000044); quy chiếu tập thể các sĩ quan Bộ Tổng tham mưu / phía Liên bang / Tiểu đoàn 203 bằng `Họ` / `họ` theo ngữ cảnh (p000027, p000031, p000035, p000039, p000042, p000050, p000052); quy chiếu Thiếu tá Tanya von Degurechaff bằng `cô` trong trần thuật và suy nghĩ gián tiếp của Lergen (p000034, p000039, p000042, p000047, p000048) và bằng `cô ấy` trong lời thoại cũng như độc thoại nội tâm trực tiếp của Lergen (p000032, p000035, p000036, p000043, p000044, p000049); trong độc thoại nội tâm trực tiếp, Lergen tự quy chiếu ngôi thứ nhất bằng `mình` (p000036); trong đối thoại tại cuộc họp: Trung tướng von Zettour gọi các sĩ quan tham mưu là `thưa các vị`, tự xưng `tôi` (p000027), gọi Lergen là `Đại tá von Lergen` / `anh` (p000029); Lergen thưa Zettour là `Thưa ngài`, tự xưng `tôi`, dùng `chúng ta` khi bao hàm tập thể Bộ Tổng tham mưu, và hỏi ngược các sĩ quan tham mưu trong phòng họp bằng `các vị` (p000032, p000049, p000052); sĩ quan tham mưu chất vấn gọi Lergen là `Đại tá von Lergen` (p000051)"
  alternatives_vi:
  - nó (thay cho `cô` / `cô ấy` khi quy chiếu Tanya tại chapter001_f/p000032, p000034–p000036, p000039, p000042–p000044, p000047–p000049 — ưu tiên `cô` / `cô ấy` vì tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` là chỉ dùng `nó` cho trần thuật gắn với điểm nhìn của Tanya và không mở rộng sang chủ thể điểm nhìn khác, đồng thời nhất quán với cách Lergen và Romel quy chiếu Tanya ở các chương trước) / ông (thay cho `anh` khi Trung tướng von Zettour gọi Đại tá von Lergen tại chapter001_f/p000029 — ưu tiên `anh` để phản ánh tự nhiên tương quan cấp bậc và tuổi tác giữa vị trung tướng tiền bối chủ trì cuộc họp với vị đại tá thuộc cấp thân tín trong Bộ Tổng tham mưu)
  segment_ids:
