  volume: vol-04
  chapter: 4
  rationale: "Kế thừa đồng bộ các tên gọi, chính thể, biệt danh và thuật ngữ quân sự đã khóa tạm từ các tập và lô trước (`Mary`, `tân binh`, `giảng viên`, `sách giáo khoa`, `doanh trại`, `học viên`, `Khối Thịnh vượng chung`, `Liên minh Hiệp ước` tại `vol-04-ch-04-b12`–`b13`; `Ác quỷ sông Rhine`, `Pháp sư Định danh`, `thuật thức`, `sĩ quan ma pháp`, `triển khai thuật thức` từ Tập 1–3), đồng thời khóa tạm các thuật ngữ huấn luyện và đời sống quân ngũ khép lại Chương 4 (`thao trường`, `đại đội pháp sư của Khối Thịnh vượng chung`, `huyền thoại nơi chiến trường`, `các buổi tập bay`, `khởi động thuật thức`, `đấu tập`, `được trao huân chương`, `những người lính tình nguyện đến từ Liên minh Hiệp ước`, `lễ rửa tội bằng lửa đạn`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: mary_shooting_exam_completion_barracks_rumors_pronouns_address_and_emphasis_vol04_ch04_b14
  proposed_vi: "Toàn bộ 38 đoạn của `vol-04-ch-04-b14` (chapter001_p/p000005–p000042) nối tiếp trực tiếp cảnh giảng viên chỉ vào những chiếc hòm đựng súng trường ở cuối `vol-04-ch-04-b13` (chapter001_p/p000004) cho tới hết Chương 4, xoay quanh việc Mary Sue nhận lại khẩu súng trường riêng để hoàn thành bài kiểm tra bắn súng và buổi nghỉ nửa ngày trong doanh trại khi các học viên bàn tán về tin đồn Ác quỷ sông Rhine xóa sổ một đại đội pháp sư của Khối Thịnh vượng chung, tuân thủ nghiêm ngặt giới hạn chủ thể của `DEC-P01-001` (Tanya không xuất hiện trực tiếp trong cảnh mà chỉ được nhắc tới qua lời đồn là `Ác quỷ sông Rhine` / `Pháp sư Định danh`; tuyệt đối không dùng đại từ `nó` cho bất kỳ nhân vật nào—từ `nó` tại p000008 chỉ quy chiếu danh từ bất động vật là khẩu súng trường), `DEC-P01-002` và `canon/style-guide.md`: (1) Trong trần thuật ngôi thứ ba: quy chiếu `Mary` nhất quán bằng `cô bé` kết hợp phản thân `mình` (p000007, p000009–p000012, p000025, p000028, p000029, p000032 — đồng bộ hoàn toàn với Tập 3 và `vol-04-ch-04-b12`–`b13`); quy chiếu người giảng viên coi thi bằng `người giảng viên` / `giảng viên` và đại từ `ông ta` (p000006, p000007, p000009, p000032); quy chiếu tập thể các học viên/tân binh tình nguyện bằng đại từ số nhiều `họ` kèm phản thân `mình` (p000015–p000017, p000032, p000039–p000042); chuyển tự nhiên đại từ ngôi thứ hai phiếm chỉ ở p000009 sang cấu trúc vô nhân xưng (`Khó mà gọi đó là một phát bắn xuất sắc...`) theo quy ước `direct-address choice`. (2) Trong lời giảng giải của giảng viên với Mary (p000005–p000008): giảng viên gọi chung các tân binh là `các cô cậu` kèm phản thân `mình` (p000005), gọi riêng Mary là `cô` (p000008 — đồng bộ `vol-04-ch-04-b12`–`b13`), và bảo toàn quy ước mở ngoặc kép liên tiếp từ p000005 sang p000006 khi cùng một người nói tiếp lời. (3) Trong độc thoại nội tâm và hội thoại thân mật giữa Mary với các bạn học viên cùng khóa (p000009, p000012–p000014, p000019, p000021–p000027, p000030–p000039): dùng hệ xưng hô ngang hàng thân mật `mình` / `Mình` – `cậu` / `Cậu`, số nhiều `bọn mình` / `chúng mình` – `các cậu` / `tất cả mọi người`, ngôi thứ ba chỉ Mary trước cả phòng là `cậu ấy` (p000038); khi nhắc tới `Ác quỷ sông Rhine` / `Pháp sư Định danh` của đối phương trong lời đồn, các học viên khác dùng `ả ta` / `ả` (p000024, p000034) còn Mary dùng cách gọi trung tính dè dặt `người đó` / `một kẻ đáng sợ đến thế` (p000027, p000033) phù hợp với tính cách nhân vật ở giai đoạn này. (4) Trong câu trích dẫn lời người khác nói với Mary về cha cô bé là Anson Sue (p000029): giữ ngôi thứ hai lịch sự `Cha của cô` đặt trong ngoặc kép và in nghiêng đúng theo nguồn. (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 4 đoạn: p000009 (`*Ngắm và bắn như thường lệ.*`), p000025 (`*Không thể bỏ lỡ chuyện này được!*`), p000029 (`“*Cha của cô là một sĩ quan ma pháp xuất sắc*,”`) và p000035 (`*Ngay cả bọn mình cũng làm được!*`), không phát sinh dấu `*` ngoài nguồn ở 34 đoạn còn lại."
  alternatives_vi:
  - cô ả / mụ ta (thay cho `ả ta` / `ả` khi các học viên nhắc tới Pháp sư Định danh của đối phương tại chapter001_p/p000024, p000034 — ưu tiên `ả ta` / `ả` vì tự nhiên trong khẩu ngữ của đám tân binh trẻ tuổi khi nói về kẻ địch khét tiếng mà không bị già cỗi như `mụ ta`)
