  proposed_vi: "tân binh, người giảng viên / giảng viên, Mary, khẩu súng trường, sách giáo khoa, khóa huấn luyện kế tiếp, đời sống quân ngũ, bắn súng, đám bạn cùng khóa / các bạn học viên cùng khóa, thao trường, doanh trại, chế độ rèn luyện khắc nghiệt, đại đội pháp sư của Khối Thịnh vượng chung, học viên / người học viên, Ác quỷ sông Rhine, huyền thoại nơi chiến trường, bảng thành tích, Pháp sư Định danh / Pháp sư Định danh của địch, cựu binh, các buổi tập bay, khởi động thuật thức, sĩ quan ma pháp, triển khai thuật thức, đấu tập, được trao huân chương, những người lính tình nguyện đến từ Liên minh Hiệp ước, lễ rửa tội bằng lửa đạn (chapter001_p/p000005–p000016, p000019–p000021, p000023–p000029, p000031, p000032, p000034, p000036–p000039, p000042)"
  alternatives_vi:
