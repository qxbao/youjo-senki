  volume: vol-04
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, giữ đồng bộ hệ quy chiếu của `Mary` (`cô bé` trong trần thuật; `cô` trong lời giảng viên và lời người khác nhắc về cha cô bé; `mình` / `bọn mình` / `chúng mình` – `cậu` / `các cậu` trong hội thoại thân mật với bạn cùng khóa), phân biệt tự nhiên cách gọi `Ác quỷ sông Rhine` giữa các học viên (`ả ta` / `ả`) và Mary (`người đó`), và bảo toàn chính xác 4 đoạn có nhấn mạnh in nghiêng."
