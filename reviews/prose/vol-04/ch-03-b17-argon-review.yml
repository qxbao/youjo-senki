  proposed_vi: "Lục quân Liên bang, tuyến phòng ngự, các tướng lĩnh, rút lui, Moskva, việc đã rồi, sở chỉ huy Cụm Tiến công Chủ lực, Sĩ quan chính trị Chobarkov, chiến lược quân sự, các đơn vị pháp sư, sĩ quan chính trị, tiền tuyến, Bộ Dân ủy Nội vụ, các quan chức bộ máy đảng, đoàn chủ tịch, Tiegenhoff, Bộ Tổng tham mưu, hệ thống chỉ huy, cái vụ mà ai cũng biết ấy, đơn vị pháp sư, Liên bang, Đảng Cộng sản, nguy cơ bị bao vây (chapter001_l/p000402, p000403, p000405, p000406, p000408–p000411, p000413, p000415–p000417, p000419–p000424) / CÙNG NGÀY HÔM ĐÓ TẠI TIEGENHOFF, Thiếu tá, Tanya, Trung úy Serebryakov, nơi trú quân, cuộc tiến công, quân phục, đội bay, tám sư đoàn, máy bay trinh sát, cuộc tiến công lớn, hai bên sườn, kế hoạch cơ động, phe Cộng sản, mũi đột phá, tuyến giữa, mũi tiến công trung tâm, rò rỉ tình báo, Lục quân Đế quốc, trận đánh cơ động, trận Cannae, chiến thuật bao vây hai cánh (chapter001_l/p000425–p000429, p000431, p000434–p000441)"
  alternatives_vi:
