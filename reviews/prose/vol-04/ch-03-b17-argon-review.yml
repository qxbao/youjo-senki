  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch với `vol-04-ch-03-b16` ở cảnh các sĩ quan chính trị Liên bang (`họ` / `mình`, `tôi` – `đồng chí`, `chúng ta`, `các người`) và chuyển điểm nhìn chuẩn xác sang Tanya và Trung úy Serebryakov tại Tiegenhoff (`Tanya` / `nó` trong trần thuật, `cô` cho Serebryakov, `Thiếu tá... ạ` – `Trung úy Serebryakov` trong thoại), đồng thời bảo toàn chính xác cả 5 vị trí nhấn mạnh in nghiêng của nguyên tác."
