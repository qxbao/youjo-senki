  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cơ quan và thuật ngữ quân sự/chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b16` của Tập 4 (`Lục quân Liên bang`, `rút lui`, `Moskva`, `việc đã rồi`, `sở chỉ huy Cụm Tiến công Chủ lực`, `Sĩ quan chính trị Chobarkov` / `sĩ quan chính trị`, `các đơn vị pháp sư`, `tiền tuyến`, `Bộ Dân ủy Nội vụ`, `các quan chức bộ máy đảng`, `đoàn chủ tịch`, `Tiegenhoff`, `Bộ Tổng tham mưu`, `hệ thống chỉ huy`, `Liên bang`, `Đảng Cộng sản`, `Thiếu tá`, `Tanya`, `Trung úy Serebryakov`, `quân phục`, `đội bay`, `sư đoàn`, `máy bay trinh sát`, `Lục quân Đế quốc`, `trận Cannae`, `chiến thuật bao vây hai cánh`), đồng thời khóa tạm tiêu đề chuyển cảnh và các cụm thuật ngữ tác chiến trong lô (`CÙNG NGÀY HÔM ĐÓ TẠI TIEGENHOFF`, `nơi trú quân`, `kế hoạch cơ động`, `mũi tiến công trung tâm`, `rò rỉ tình báo`, `trận đánh cơ động`)."
