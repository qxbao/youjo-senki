- source_term: political_officers_deliberation_and_tiegenhoff_tanya_serebryakov_pronouns_and_emphasis_vol04_ch03_b17
  proposed_vi: "Trong hai phân cảnh của lô `vol-04-ch-03-b17` — (A) cuộc bàn bạc kín giữa các sĩ quan chính trị tại Sở chỉ huy Cụm Tiến công Chủ lực của Liên bang (chapter001_l/p000402–p000424) và (B) cảnh chuyển về Tiegenhoff với Thiếu tá Tanya Degurechaff và Trung úy Serebryakov (chapter001_l/p000425–p000441): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b16`: (1) Ở phân cảnh Sở chỉ huy Cụm Tiến công Chủ lực (p000402–p000424): trần thuật ngôi thứ ba khách quan quy chiếu tập thể các sĩ quan chính trị bằng đại từ trung tính `họ` / `Họ` kết hợp phản thân `mình`, và quy chiếu quân địch Đế quốc bằng `chúng` (p000402, p000404, p000409, p000411, p000413–p000415, p000417, p000418, p000420, p000423); trong hội thoại nội bộ giữa các sĩ quan chính trị (p000403, p000405–p000407, p000410, p000419, p000421, p000422, p000424), tự xưng `Tôi` / `tôi` và `chúng ta`, gọi người đối thoại cùng cấp là `đồng chí` (p000422), quy chiếu các tướng lĩnh quân đội Liên bang bằng `họ` (p000406, p000410, p000424) và quy chiếu quân Đế quốc bằng `chúng` (p000403, p000419); câu suy nghĩ tập thể ngầm hướng về giới tướng lĩnh quân đội tại p000412 dùng đại từ ngôi thứ hai số nhiều `các người` (`*Giờ thì đến lượt các người đấy.*`). (2) Ở phân cảnh tại Tiegenhoff sau tiêu đề `CÙNG NGÀY HÔM ĐÓ TẠI TIEGENHOFF` (p000425–p000441): trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya tuân thủ nghiêm ngặt `DEC-P01-001`, quy chiếu Tanya nhất quán bằng tên riêng `Tanya` và đại từ `nó` / `Nó` (p000427, p000431, p000432, p000436, p000438), tuyệt đối không dùng `cô` cho Tanya; quy chiếu Trung úy Serebryakov trong trần thuật bằng `Trung úy Serebryakov` và đại từ `cô` (p000427, p000430); quy chiếu chung đơn vị Đế quốc tại Tiegenhoff bằng `họ` (p000432, p000436) và quân Liên bang bằng `chúng` (p000436, p000438, p000439); trong hội thoại, Trung úy Serebryakov gọi Tanya là `Thiếu tá` kèm tiểu từ kính ngữ `ạ` (p000426, p000429, p000434), còn Tanya gọi thuộc cấp là `Trung úy Serebryakov`, dùng `chúng ta` kết hợp phản thân `mình` cho phía Đế quốc và `chúng` cho phía Liên bang (p000428, p000433, p000435, p000437, p000440). (3) Bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại đúng 4 đoạn (5 vị trí) có thẻ in nghiêng trong nguồn là p000412 (`*Giờ thì đến lượt các người đấy.*`), p000422 (`*cái vụ mà ai cũng biết ấy*`), p000435 (`*Tối thiểu*`) và p000436 (`*Thế thì đông quá mức rồi.*` và `*Không.*`), không phát sinh dấu `*` ngoài nguồn ở 36 đoạn còn lại."
  alternatives_vi:
  - các ông (thay cho `các người` trong câu suy nghĩ thầm của nhóm sĩ quan chính trị hướng về các tướng lĩnh tại chapter001_l/p000412 — ưu tiên `các người` để lột tả sắc thái đùn đẩy trách nhiệm đầy cay nghiệt giữa hai phe trong sở chỉ huy)
