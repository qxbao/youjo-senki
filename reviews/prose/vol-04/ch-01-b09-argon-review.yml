  proposed_vi: "Lục quân Đế quốc, Cộng hòa, mặt trận Rhine, Grantz, Serebryakov (chapter001_b/p000245, p000249, p000263, p000264) / Thượng đế, quỷ dữ, Satan, sĩ quan tham mưu, đại bản doanh Bộ Tổng tham mưu, Bộ Tổng tham mưu (chapter001_b/p000247, p000265) / Đại úy Weiss, phe Đỏ (chapter001_b/p000251, p000252) / Đơn vị Vận tải Hàng không số 22, lệnh cấm sử dụng ma năng, chế áp tín hiệu ma năng (chapter001_b/p000253, p000257) / Liên bang, sự cố kỹ thuật (chapter001_b/p000254) / sơn ngụy trang ban đêm, phi cơ tác chiến đặc biệt, cơ động thâm nhập tầm thấp, nhận diện quân nhà (chapter001_b/p000258) / nhảy dù đường không, liên lạc vô tuyến (chapter001_b/p000259, p000260) / Tiểu đoàn Pháp sư Trên không số 203, phương pháp suy đoán tọa độ (chapter001_b/p000262, p000263) / Dacia, Norden, lục địa phía nam (chapter001_b/p000263) / vốn con người (chapter001_b/p000267)"
  alternatives_vi:
