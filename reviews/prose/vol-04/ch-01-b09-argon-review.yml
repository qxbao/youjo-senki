  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, cơ quan tham mưu, địa danh chiến trường và thuật ngữ kinh tế đã khóa tạm từ Tập 1–3 cùng B01–B08 của Tập 4 (`Lục quân Đế quốc`, `Cộng hòa`, `mặt trận Rhine`, `Grantz`, `Serebryakov`, `Thượng đế`, `quỷ dữ`, `Satan`, `đại bản doanh Bộ Tổng tham mưu`, `Đại úy Weiss`, `phe Đỏ`, `Liên bang`, `tín hiệu ma năng`, `Tiểu đoàn Pháp sư Trên không số 203`, `Dacia`, `Norden`, `lục địa phía nam`, `vốn con người`), đồng thời khóa tạm các thuật ngữ tác chiến không vận và định hướng xuất hiện trong batch (`Đơn vị Vận tải Hàng không số 22`, `lệnh cấm sử dụng ma năng`, `phương pháp suy đoán tọa độ`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_troops_banter_and_drop_instructions_pronouns_and_address_vol04_ch01_b09
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000252, p000256, p000263) và giữ nguyên tên riêng `Tanya`; nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000252, p000261, p000268), ngôi thứ nhất số nhiều chỉ tập thể đơn vị/Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (chapter001_b/p000254, p000259, p000265), và ngôi thứ hai khái quát chỉ người học đại học nói chung dùng `bạn` (chapter001_b/p000268); trong đối thoại khi Tanya phát biểu và bông đùa với toàn tiểu đoàn: xưng `tôi` hoặc `chúng ta` (khi bao hàm toàn đơn vị), gọi binh sĩ là `các anh`, gọi Weiss là `Đại úy Weiss` (chapter001_b/p000247, p000249, p000251, p000253, p000255, p000257); khi binh sĩ hỏi đùa Tanya: gọi `Thiếu tá` kèm tiểu từ lễ phép `ạ` (chapter001_b/p000248)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_b/p000254, p000259, p000265 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm suốt từ B01 đến B08) / người ta (thay cho `bạn` khi dịch đại từ ngôi thứ hai khái quát tại chapter001_b/p000268 — ưu tiên `bạn` vì tự nhiên, sát cấu trúc câu bình luận về chương trình giáo dục đại học trong độc thoại của Tanya)
  segment_ids:
