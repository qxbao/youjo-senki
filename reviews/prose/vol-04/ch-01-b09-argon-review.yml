  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô giữa Thiếu tá Tanya von Degurechaff với binh sĩ Tiểu đoàn 203 trong màn bông đùa giảm căng thẳng và phổ biến mệnh lệnh nhảy dù trên khoang máy bay."
