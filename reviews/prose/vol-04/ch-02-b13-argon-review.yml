  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ sự phân biệt rõ ràng giữa trần thuật ngôi thứ ba trang trọng (`ông`, `họ`), độc thoại nội tâm của vị thủ tướng (`tôi` – `các ông` khi truyền thông điệp răn đe ngầm bằng ánh mắt, `mình` – `ông ta` khi tự vấn đánh giá thuộc cấp), và lời thoại chính trường – quân sự trong cuộc họp (`Tôi` / `chúng tôi` / `chúng ta`)."
