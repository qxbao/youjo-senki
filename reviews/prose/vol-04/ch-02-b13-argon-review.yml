  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, chức danh, cơ quan và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B12 Chương 2 của Tập 4 (`các pháp sư Đế quốc`, `trung đoàn`, `tiểu đoàn`, `Khối Thịnh vượng chung`, `Liên bang`, `Londinium`, `Hải quân Khối Thịnh vượng chung`, `hệ thống phòng không`, `lưới phòng không`, `trạm radar`, `vị thủ tướng`, `vị tổng tham mưu trưởng`, `lục địa phía nam`, `Cộng hòa`, `Cộng hòa Tự do`, `Bộ Ngoại giao`, `Hạm đội Cộng hòa`), đồng thời khóa tạm các thuật ngữ và định danh quân sự – chính trị xuất hiện trong cuộc họp khẩn cấp tại Londinium (`cuộc tập kích thâm nhập bất ngờ`, `Bức tường phòng thủ trên biển`, `vị trí cảnh giới an ninh`, `đảo chính`, `Quân đoàn Phòng thủ Bản thổ`, `Hạm đội Nội hải`, `bộ chỉ huy lực lượng khu vực`, `vùng đệm chiến lược`, `Areq`, `Vị bộ trưởng ngoại giao`, `bộ tham mưu hải quân`)."
  uncertainty: low
  status: pending
