findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000065"
    severity: "minor"
    category: "negation_and_style"
    issue: "Câu nội tâm đầu đoạn chuyển cấu trúc phủ định tình thái của nguyên bản thành câu khẳng định ('Chắc chúng ta sẽ xin phép quay về căn cứ dễ dàng thôi'), làm mất sắc thái phủ định và gây lặp từ 'dễ dàng' với vế sau ('quá đỗi dễ dàng')."
    rationale: "Theo handoffs/vol-04/ch-05-b13.yml và canon/style-guide.md, cần giữ đúng cấu trúc phủ định và tình thái giả định, đồng thời tránh lặp từ không có trong nguyên bản."
    suggestion: "Đổi câu nội tâm đầu đoạn thành '*Chắc chúng ta sẽ không gặp trở ngại gì khi xin phép quay về căn cứ đâu.*'"
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000083"
    severity: "moderate"
    category: "terminology_and_viewpoint"
    issue: "Dịch 'Peer pressure' trong ngữ cảnh giao tế công việc/quân ngũ thành 'Áp lực đồng trang lứa' gây lệch nghĩa sang áp lực cùng độ tuổi; đồng thời chuyển đại từ khái quát từ 'người ta' ở câu thứ hai sang 'bạn' ở câu thứ ba."
    rationale: "Trong tiếng Việt, 'đồng trang lứa' chỉ những người cùng lứa tuổi, không phù hợp với suy nghĩ của Tanya về áp lực từ đồng nghiệp/tập thể trong công việc và giữa các đơn vị quân đội. Bên cạnh đó, cần giữ nhất quán cách dịch đại từ khái quát trong lời trần thuật gián tiếp tự do."
    suggestion: "Đổi 'Áp lực đồng trang lứa' thành 'Áp lực từ đồng nghiệp' (hoặc 'Áp lực từ xung quanh') và đổi câu cuối thành 'Nhưng một khi đã bước vào cuộc chơi, người ta buộc phải dốc toàn lực.'"
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000085"
    severity: "minor"
    category: "pronouns_and_register"
    issue: "Dịch lời gọi chung toàn đơn vị ('troops') thành 'Các anh', vừa lược mất danh từ gọi đáp vừa dùng đại từ chỉ giới nam dù nhóm cấp dưới được nói tới ngay ở p000086 có Trung úy Serebryakov là nữ."
    rationale: "Giữ cách gọi bao quát toàn bộ cấp dưới trong đơn vị (gồm cả nam và nữ) và phản ánh đầy đủ danh từ hô gọi của nguồn."
    suggestion: "Đổi 'Các anh nghe thấy rồi chứ?' thành 'Các binh sĩ, mọi người nghe thấy rồi chứ?'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000086"
    severity: "minor"
    category: "style_and_grammar"
    issue: "Cụm nhấn mạnh '*Hãy cứu những quân mình đó*' kết hợp trực tiếp lượng từ 'những' với cụm danh từ tập hợp 'quân mình' khiến câu tiếng Việt thiếu tự nhiên."
    rationale: "Trong tiếng Việt, khi đi với lượng từ số nhiều 'những ... đó' cần có danh từ chỉ người hoặc diễn đạt lại cho tự nhiên mà vẫn giữ đúng nghĩa và phạm vi nhấn mạnh."
    suggestion: "Đổi '*Hãy cứu những quân mình đó*' thành '*Hãy cứu những người bên quân mình đó*' (hoặc '*Hãy cứu những đồng đội đó*')."
