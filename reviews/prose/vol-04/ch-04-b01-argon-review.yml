  volume: vol-04
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi khi chuyển từ điểm nhìn của Tanya ở Chương 3 sang điểm nhìn của Đại tá von Lergen ở đầu Chương 4 (`ông` / `mình` cho Lergen, `ông` cho Zettour và Rudersdorf, `cô` cho Thiếu tá von Degurechaff trong góc nhìn khách quan của Lergen, `họ` cho các sĩ quan tham dự và giới chính trị gia, `chúng` cho kẻ địch Liên bang, cùng hệ xưng hô chuẩn mực trong phiên điều trần giữa Trung tướng von Zettour và Thiếu tá von Degurechaff), đồng thời bảo toàn chính xác cả 3 vị trí nhấn mạnh in nghiêng tại p000003, p000006 và p000015."
