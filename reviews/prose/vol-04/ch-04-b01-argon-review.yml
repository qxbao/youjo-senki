- source_term: lergen_pov_court_of_inquiry_pronouns_address_and_emphasis_vol04_ch04_b01
  proposed_vi: "Trong toàn bộ lô mở đầu Chương 4 `vol-04-ch-04-b01` (chapter001_n/p000001–p000025) tại Văn phòng Bộ Tổng tham mưu dưới điểm nhìn của Đại tá von Lergen trong phiên điều trần về chiến dịch tập kích Moskva của Thiếu tá Tanya von Degurechaff: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen) và `DEC-P01-002`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng danh xưng `Đại tá von Lergen` / `Lergen`, đại từ `ông` / `Ông` và đại từ phản thân `mình` (p000002, p000003, p000005–p000007, p000012, p000015, p000017, p000018, p000021, p000022); quy chiếu Trung tướng von Zettour và Trung tướng von Rudersdorf bằng cấp bậc, họ và đại từ `ông` (p000010, p000012, p000014, p000020, p000021); quy chiếu Thiếu tá Tanya von Degurechaff từ góc nhìn khách quan của Lergen và hội đồng điều trần bằng `Thiếu tá von Degurechaff` / `Degurechaff` và đại từ `cô` (p000013, p000016, p000017, p000021); quy chiếu các sĩ quan tham dự và giới chính trị gia bằng `họ` / `Họ` (p000006, p000007, p000018) và quy chiếu phía kẻ địch Liên bang bằng `chúng` (p000018); tại câu nhận định cuối p000025 có đại từ ngôi thứ hai phiếm chỉ trong nguồn, dùng chủ ngữ khái quát `người ta` theo quy ước `direct-address choice`. (2) Trong đối thoại tại phiên điều trần: Trung tướng von Zettour khi chủ trì dùng `chúng ta` với hội đồng (p000009, p000024), gọi Tanya là `Thiếu tá von Degurechaff` và dùng đại từ `cô` / `Cô` (p000011, p000019, p000024); Thiếu tá Tanya von Degurechaff khi trả lời thẩm vấn trước hội đồng gọi Zettour là `Thưa Tướng quân` và `ngài`, tự xưng `Tôi` / `tôi` kèm tiểu từ kính ngữ `ạ` (p000023). (3) Bảo toàn chính xác 3 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000003 (`*Hẳn cảm giác chỉ muốn tìm đến rượu và thuốc lá để giải khuây nếu được phép chính là như thế này đây.*`), p000006 (`*Người ta thường có xu hướng lạm dụng những phiên điều trần kiểu này*`) và p000015 (`*Chà, thế cũng hợp lý thôi.*`), không phát sinh dấu `*` ngoài nguồn ở 22 đoạn còn lại."
  alternatives_vi:
  - lược chủ ngữ phiếm chỉ (thay cho chủ ngữ khái quát `người ta` trong cụm `những gì người ta vẫn gọi là các đợt tấn công quấy rối` tại chapter001_n/p000025 — cả hai đều thuộc quy ước `direct-address choice`; ưu tiên `người ta vẫn gọi là` để nhịp câu văn xuôi tự nhiên, rõ nghĩa)
  segment_ids:
