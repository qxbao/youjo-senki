  proposed_vi: "NGÀY 10 THÁNG 4, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU / Đại tá von Lergen / Lergen, sĩ quan Bộ Tổng tham mưu, người lính, sĩ quan, bổn phận, quân đội, yêu cầu chính trị, trò hề, sĩ quan cấp cao, phiên điều trần / Hội đồng điều trần, Bộ Tổng tham mưu, nhân viên tham mưu phụ trách công việc thường nhật, Mặt trận phía đông, búa gỗ, Trung tướng von Zettour / Zettour, Thiếu tá von Degurechaff / Degurechaff, Bộ Tư lệnh Tối cao, thủ đô Liên bang / Liên bang, chiến dịch, lục quân, quan chức dân sự, hậu phương, phán quyết, vô tội, chính phủ, các chính trị gia, quá tay, góc độ quân sự, thủ đô địch, sĩ quan tham mưu, góc độ chính trị, danh dự của kẻ địch, các biểu tượng quốc gia, những cáo buộc, sử dụng vũ lực quân sự quá mức trong khu vực đô thị, tự ý thực hiện các hành động quân sự / tự ý hành động, cấp trên trực tiếp, Trung tướng von Rudersdorf, Moskva, Thưa Tướng quân, Tiểu đoàn Pháp sư Trên không số 203, cuộc tập kích tầm xa, các đợt tấn công quấy rối (chapter001_n/p000001, p000002, p000005–p000008, p000010–p000014, p000016–p000025)"
  alternatives_vi:
  - ủy ban điều tra / tòa điều tra (thay cho `Hội đồng điều trần` / `phiên điều trần` tại chapter001_n/p000006, p000011, p000012, p000014, p000019 — ưu tiên `Hội đồng điều trần` và `phiên điều trần` để phản ánh đúng sắc thái thủ tục thẩm vấn nội bộ nhằm làm rõ nghi vấn thay vì phiên tòa xét xử hình sự) / viên chức dân sự (thay cho `quan chức dân sự` tại chapter001_n/p000013 — ưu tiên `quan chức dân sự` để tương xứng với tầm ảnh hưởng chính trị đối trọng cùng Bộ Tổng tham mưu)
