  volume: vol-04
  chapter: 4
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–3 của Tập 4 (`NĂM THỐNG NHẤT 1926`, `VĂN PHÒNG BỘ TỔNG THAM MƯU`, `Đại tá von Lergen` / `Lergen`, `Bộ Tổng tham mưu`, `sĩ quan Bộ Tổng tham mưu`, `sĩ quan cấp cao`, `Mặt trận phía đông`, `Trung tướng von Zettour` / `Zettour`, `Thiếu tá von Degurechaff` / `Degurechaff`, `Bộ Tư lệnh Tối cao`, `Liên bang` / `thủ đô Liên bang`, `lục quân`, `hậu phương`, `sĩ quan tham mưu`, `Trung tướng von Rudersdorf`, `Moskva`, `Thưa Tướng quân`, `Tiểu đoàn Pháp sư Trên không số 203`, `cuộc tập kích tầm xa`, `các đợt tấn công quấy rối`), đồng thời khóa tạm các thuật ngữ hành chính – pháp lý quân sự trong phiên điều trần mở đầu Chương 4 (`Hội đồng điều trần` / `phiên điều trần`, `nhân viên tham mưu phụ trách công việc thường nhật`, `quan chức dân sự`, `sử dụng vũ lực quân sự quá mức trong khu vực đô thị`, `tự ý thực hiện các hành động quân sự` / `tự ý hành động`)."
  uncertainty: low
  status: pending
