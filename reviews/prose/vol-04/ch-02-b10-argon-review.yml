  proposed_vi: "đạn thép xuyên phá công sự, đạn thép chuyên dụng để xuyên phá tường công sự (chapter001_f/p000290, p000293) / Điện Kremlin, bê tông cốt thép, Đại đội 4, Grantz, đại bác (chapter001_f/p000291, p000292, p000294–p000296, p000303) / khối thuốc nổ lõm, thuốc nổ, nhiệm vụ trinh sát tầm xa, đạn thuật thức (chapter001_f/p000293) / gã khốn Stalin (chapter001_f/p000294) / mục tiêu mềm (chapter001_f/p000295) / 09, Thiếu tá, Tanya (chapter001_f/p000296–p000298, p000302, p000312, p000321–p000323) / 04, 01, Ngài Josef, Josef (chapter001_f/p000299, p000304) / Cung điện Nhân dân, trụ sở cảnh sát mật, Đại đội 2, tệ sùng bái cá nhân (chapter001_f/p000303) / lá cờ Đế quốc, cờ Đế quốc, đảo Iwo Jima, Thủy quân Lục chiến (chapter001_f/p000304, p000305, p000307, p000308, p000320) / vẻ đẹp hình thức, lũ Cộng sản, tên Cộng sản, đám Cộng sản, cờ đỏ Cộng sản (chapter001_f/p000306–p000308, p000314, p000315, p000317, p000320) / thủ đô Liên bang, Moskva, vật tư và quân số, tiền tuyến, các tuyến chính, Tướng von Zettour (chapter001_f/p000308, p000309) / tuyên truyền, kiểm duyệt, đúng đắn về mặt chính trị, phim tuyên truyền chống Đế quốc, Đế quốc tà ác, đạo quân chính nghĩa, xưởng phim (chapter001_f/p000315–p000317, p000320, p000322) / Serebryakov, vô tuyến, Trung úy (chapter001_f/p000322–p000324) / trưng dụng vật tư ngay tại chỗ, quân phiếu, biên lai xác nhận thanh toán (chapter001_f/p000326)"
  alternatives_vi:
