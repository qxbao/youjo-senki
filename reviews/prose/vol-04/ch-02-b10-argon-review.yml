  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ chuẩn `nó` (trần thuật) – `mình` (nội tâm tự quy chiếu) – `chúng tôi` (nội tâm tập thể) của Tanya, phân biệt rõ đại từ `cô` dành cho Trung úy Serebryakov trong trần thuật và suy nghĩ của Tanya, đồng thời duy trì chuẩn mực xưng hô quân sự giữa Tanya với các đại đội và với Serebryakov."
