- source_term: tanya_kremlin_retargeting_and_film_studio_requisition_pronouns_vol04_ch02_b10
  proposed_vi: "Trong phân cảnh Thiếu tá Tanya von Degurechaff điều chỉnh mục tiêu của Đại đội 4 khỏi Điện Kremlin, nhận tin Đại đội 2 phá hủy tượng đài Josef và giao nhiệm vụ cho Trung úy Serebryakov trưng dụng cờ tại xưởng phim (chapter001_f/p000289–p000326): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối B07–B09, trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` / `Nó` (p000312) và định danh bằng tên riêng `Tanya` (p000298, p000302, p000312, p000322, p000323); trong độc thoại nội tâm trực tiếp, Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` xuyên suốt (p000294, p000304, p000305, p000308, p000309, p000322) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `chúng tôi` / `Chúng tôi` (p000293–p000295, p000304, p000306, p000307, p000309, p000317, p000318); dùng chủ ngữ khái quát `người ta` / `Người ta` và cấu trúc khái quát vô nhân xưng cho đại từ ngôi thứ hai phiếm chỉ ở p000314–p000316; quy chiếu tập thể Tiểu đoàn 203 / Đại đội 4 bằng `họ` / `Họ` (p000295, p000302, p000303), quy chiếu nhà độc tài Liên bang trong suy nghĩ của Tanya bằng `gã khốn Stalin` / `hắn` (p000294), quy chiếu phía Cộng sản bằng `chúng` (p000304, p000308, p000315, p000317, p000320), và quy chiếu Trung úy Serebryakov trong trần thuật cùng suy nghĩ của Tanya bằng tên riêng `Serebryakov` và đại từ `cô` (p000322, p000323). Trong liên lạc vô tuyến và đối thoại trực tiếp (p000289–p000291, p000296, p000297, p000299–p000301, p000310, p000311, p000313, p000319–p000321, p000324–p000326): Tanya (`01`) tự xưng `Tôi`, gọi đơn vị của Grantz là `Các anh` (p000289) hoặc hô hiệu `09` (p000296), và gọi Serebryakov là `Trung úy` / `cô` (p000324, p000326); các sĩ quan thuộc cấp (`09`, `04` và Serebryakov) tự xưng `tôi` / `Chúng tôi` / `chúng tôi`, thưa Tanya lễ phép là `thưa Thiếu tá` / `ngài ... thưa Thiếu tá` kèm tiểu từ kính ngữ `ạ`"
  alternatives_vi:
  - cô (thay cho `nó` / `Nó` khi quy chiếu Tanya trong trần thuật ngôi thứ ba tại chapter001_f/p000312 — bắt buộc giữ `nó` / `Nó` theo quyết định đã duyệt `DEC-P01-001` trong `canon/decisions.md` vì toàn bộ phân cảnh bám sát điểm nhìn của Tanya) / anh (thay cho `Các anh` khi Tanya hỏi ngược Fairy 09 / Đại đội 4 của Grantz tại chapter001_f/p000289 — ưu tiên `Các anh` vì vừa tiếp nối tự nhiên câu báo cáo dùng ngôi `chúng tôi` của Fairy 09 ở p000288 cuối B09, vừa phản ánh đúng thực tế cả Đại đội 4 đang hợp lực công kích tường thành Điện Kremlin)
