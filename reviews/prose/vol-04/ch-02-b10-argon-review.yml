  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, đơn vị, quốc gia, địa danh, công trình, hô hiệu và thuật ngữ quân sự – ma pháp đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B09 Chương 2 của Tập 4 (`Điện Kremlin`, `bê tông cốt thép`, `Đại đội 4`, `Grantz`, `nhiệm vụ trinh sát tầm xa`, `đạn thuật thức`, `09`, `04`, `01`, `Thiếu tá`, `Tanya`, `Josef` / `Ngài Josef`, `Cung điện Nhân dân`, `cảnh sát mật`, `Đại đội 2`, `lá cờ Đế quốc` / `cờ Đế quốc`, `lũ Cộng sản` / `đám Cộng sản` / `cờ đỏ Cộng sản`, `thủ đô Liên bang`, `Moskva`, `tiền tuyến`, `các tuyến chính`, `Tướng von Zettour`, `tuyên truyền`, `Serebryakov`, `vô tuyến`, `Trung úy`), đồng thời khóa tạm các thuật ngữ công sự, lịch sử quân sự và thủ tục trưng dụng tại chỗ trong phân cảnh chuyển hướng mục tiêu khỏi Điện Kremlin và tìm cờ cắm tại quảng trường (`đạn thép xuyên phá công sự`, `khối thuốc nổ lõm`, `gã khốn Stalin` — bảo toàn nguyên trạng chi tiết buột miệng dùng tên lịch sử kiếp trước của Tanya trong nguyên tác, `mục tiêu mềm`, `tệ sùng bái cá nhân`, `đảo Iwo Jima`, `Thủy quân Lục chiến`, `vẻ đẹp hình thức`, `đúng đắn về mặt chính trị`, `phim tuyên truyền chống Đế quốc`, `xưởng phim`, `trưng dụng vật tư ngay tại chỗ`, `quân phiếu`, `biên lai xác nhận thanh toán`)."
