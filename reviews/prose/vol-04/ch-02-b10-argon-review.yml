- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000325
  locks:
  - "Giữ tiểu từ kính ngữ `ạ`, đại từ `Tôi` / `tôi` và câu đáp `“Nếu nó vẫn còn nằm ở chỗ cũ ạ! Tôi không chắc mình có nhớ chính xác hay không, nhưng nếu vẫn giống như trên tấm bản đồ được phát trước đây thì tôi biết vị trí đó!”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000326
  locks:
  - "Giữ đại từ `cô`, các thuật ngữ `trưng dụng vật tư ngay tại chỗ`, `quân phiếu`, `biên lai xác nhận thanh toán` và câu mệnh lệnh `“Tuyệt lắm. Vậy lệnh cho cô là trưng dụng vật tư ngay tại chỗ. Đừng quên quân phiếu và biên lai xác nhận thanh toán đấy.”`."
