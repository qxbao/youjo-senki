- source_term: lergen_pov_zettour_degurechaff_federation_analysis_pronouns_address_and_emphasis_vol04_ch04_b07
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` – `b06` trong toàn bộ 31 đoạn của `vol-04-ch-04-b07` (chapter001_n/p000176–p000206) khi Thiếu tá Tanya von Degurechaff phân tích mô thức tư duy cùng động cơ sinh tồn của Liên bang với Tướng von Zettour trước sự chứng kiến của Đại tá von Lergen: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen), `DEC-P01-002` và `canon/style-guide.md`: (1) Trần thuật ngôi thứ ba và độc thoại nội tâm bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, đại từ `ông` / `Ông` kết hợp phản thân `mình` (p000179, p000183, p000193, p000194, p000196, p000200, p000201, p000206); quy chiếu Tướng von Zettour bằng tên riêng `Zettour` (p000185, p000193, p000196); quy chiếu Thiếu tá Tanya von Degurechaff bằng `Degurechaff` / `Thiếu tá Tanya von Degurechaff`, đại từ `cô` / `Cô` trong lời kể khách quan (p000184, p000191, p000194, p000200, p000203, p000204, p000205, p000206), dùng `cô ta` trong câu dự cảm nội tâm mang sắc thái cảnh giác của Lergen ở p000194 (đồng bộ `vol-04-ch-04-b05`), và dùng `Cô ấy` / `cô ấy` trong các câu suy ngẫm nội tâm trực tiếp ở p000201–p000202 (đồng bộ `vol-04-ch-04-b06`); quy chiếu Bộ Tổng tham mưu, hai người Zettour – Lergen và phía Liên bang bằng đại từ `họ` (p000179, p000184, p000188), lưu ý đại từ `nó` ở p000179, p000183, p000193 và p000205 chỉ quy chiếu danh từ bất động vật (`cuộc xâm lược`, `cuộc trò chuyện`, `câu hỏi của Zettour`, `khái niệm mới về chiến tranh tổng lực`), đồng thời lược chủ ngữ ngôi thứ hai phiếm chỉ ở p000189 (`Có thể nói rằng`) và p000199 (`Nếu đặt giả thuyết rằng`) theo quy ước `direct-address choice`. (2) Trong đối thoại quân ngũ giữa Tướng von Zettour và Thiếu tá Tanya von Degurechaff: Zettour (p000177, p000181, p000187, p000195, p000198) tự xưng `tôi`, dùng đại từ gộp `chúng ta` khi nói về phía Đế quốc (p000177, p000181), gọi Tanya là `Thiếu tá` và `cô`; Thiếu tá Tanya von Degurechaff (p000176, p000178, p000180, p000182, p000186, p000192, p000197, p000199) tự xưng `Tôi`, dùng đại từ gộp `chúng ta` khi nói về phía Đế quốc (p000176, p000178, p000180, p000197), quy chiếu Liên bang bằng `họ` (p000199), gọi Zettour là `thưa Tướng quân` / `Thưa Tướng quân` kèm tiểu từ kính ngữ `ạ`. (3) Bảo toàn chính xác cấu trúc tăng tiến `không chỉ… mà còn…` giữ cùng chủ thể `cô` ở câu cuối p000206, các mệnh đề điều kiện / giả định (p000181, p000182, p000184, p000186, p000199), các câu hỏi trực tiếp / nội tâm / tu từ (p000177, p000182, p000187, p000189, p000191, p000194, p000195, p000198, p000200, p000203, p000205), và cả 5 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000176 (`*không có lý do nào mà chúng ta được biết*`), p000194 (`*Câu trả lời của cô ta sẽ toàn là lời rác rưởi cho mà xem.*`), p000201 (`*Cô ấy là Thiếu tá Tanya von Degurechaff. Cô ấy là một sĩ quan ma pháp và cũng đã hoàn thành chương trình đào tạo sĩ quan Bộ Tổng tham mưu.*`), p000202 (`*Và cô ấy là một đứa trẻ.*`) và p000203 (`*Đây có phải là hình thái cuối cùng của người lính lý tưởng mà quốc gia hằng mong ước không?*`), không phát sinh dấu `*` ngoài nguồn ở 26 đoạn còn lại."
  alternatives_vi:
  - cô ấy (thay cho `cô ta` trong câu dự cảm nội tâm của Lergen tại chapter001_n/p000194 — ưu tiên `cô ta` ở p000194 vì phản ánh đúng phản xạ cảnh giác bản năng của Lergen khi lường trước một câu trả lời cực đoan từ sự bất thường của Degurechaff, trước khi ông sững sờ trước câu trả lời điềm tĩnh của cô và chuyển sang `Cô ấy` / `cô ấy` ở p000201–p000202)
