  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, tiếp nối liền mạch `vol-04-ch-04-b01` – `b06` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` cho Lergen, `cô` / `Cô` trong lời kể khách quan, `cô ta` trong câu dự cảm cảnh giác ở p000194 và `Cô ấy` / `cô ấy` trong suy ngẫm nội tâm trực tiếp ở p000201–p000202 khi quy chiếu Thiếu tá von Degurechaff, `tôi / chúng ta – Thiếu tá / cô` và `Tôi / chúng ta – thưa Tướng quân / Thưa Tướng quân... ạ` trong đối thoại giữa Tướng von Zettour và Thiếu tá von Degurechaff), đồng thời bảo toàn chính xác các cấu trúc giả định/điều kiện, cấu trúc `không chỉ… mà còn…` cùng chủ thể ở p000206, các câu hỏi trực tiếp/nội tâm và cả 5 đoạn có nhấn mạnh in nghiêng tại p000176, p000194, p000201, p000202 và p000203."
