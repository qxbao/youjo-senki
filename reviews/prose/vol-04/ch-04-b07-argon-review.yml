  proposed_vi: "Tướng quân / Zettour, Thiếu tá / Thiếu tá Tanya von Degurechaff / Degurechaff, Lergen, Bộ Tổng tham mưu, mô thức tư duy, thỏa thuận ngừng bắn / thỏa thuận ngừng bắn sớm, Liên bang, thể chế chính trị, cuộc họp chiến lược, tiền tuyến, đòn tập kích vào Moskva, nhu cầu tất yếu về mặt quân sự, Đế quốc, lục quân, chiếc hộp Pandora, bài ngoại và hoang tưởng, sĩ quan ma pháp, sĩ quan Bộ Tổng tham mưu, thế giới quan đặc thù, chiến lược gia, chiến tranh tổng lực, hậu cần, tiêu hao, đạo quân dã chiến, Cộng hòa, chiến thuật chặt đầu, mặt trận Rhine, sĩ quan cấp tá (chapter001_n/p000176, p000178–p000180, p000182–p000187, p000189–p000197, p000199–p000201, p000204–p000206)"
