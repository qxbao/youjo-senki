  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự – chiến lược đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` – `b06` (`Tướng quân` / `Zettour`, `Thiếu tá` / `Thiếu tá Tanya von Degurechaff` / `Degurechaff`, `Lergen`, `Bộ Tổng tham mưu`, `mô thức tư duy`, `Liên bang`, `tiền tuyến`, `đòn tập kích vào Moskva`, `Đế quốc`, `lục quân`, `chiếc hộp Pandora`, `sĩ quan ma pháp`, `sĩ quan Bộ Tổng tham mưu`, `chiến lược gia`, `chiến tranh tổng lực`, `hậu cần`, `tiêu hao`, `đạo quân dã chiến`, `Cộng hòa`, `chiến thuật chặt đầu`, `mặt trận Rhine`, `sĩ quan cấp tá`), đồng thời khóa tạm các cụm thuật ngữ và cách diễn đạt mới trong lô (`thỏa thuận ngừng bắn` / `thỏa thuận ngừng bắn sớm`, `thể chế chính trị`, `cuộc họp chiến lược`, `nhu cầu tất yếu về mặt quân sự`, `bài ngoại và hoang tưởng`, `thế giới quan đặc thù`)."
