  proposed_vi: "Thiếu tá (chapter001_d/p000040) / đại đội trưởng, mũi tiến công (chapter001_d/p000041, p000042) / đột kích chiều sâu, chiến trường sông Rhine, lục địa phía nam (chapter001_d/p000042) / Liên bang, học thuyết tác chiến pháp sư (chapter001_d/p000044, p000045, p000047, p000049, p000052, p000054) / tổ quốc (chapter001_d/p000049, p000056) / chiến sĩ tự do chống Cộng (chapter001_d/p000050) / Reich (chapter001_d/p000051) / Đế quốc (chapter001_d/p000052, p000055) / Cộng sản, chủ nghĩa Cộng sản, lũ Cộng sản, kali xyanua (chapter001_d/p000054, p000055, p000057, p000064, p000072) / chứng thiếu axit dạ dày (chapter001_d/p000058) / quả cầu tính toán (chapter001_d/p000061) / Tiểu đoàn Pháp sư Trên không số 203, Thiếu tá von Degurechaff (chapter001_d/p000067, p000085) / khu vực tập kết xuất phát (chapter001_d/p000068) / pháo đường sắt, hầm thuốc súng, Lục quân Liên bang (chapter001_d/p000070–p000072) / đánh nhanh rút gọn (chapter001_d/p000073) / thuật thức nổ, lô cốt, vụ nổ thứ cấp (chapter001_d/p000075–p000077) / Lục quân Dacia, tấn công mục tiêu mặt đất, công kích mục tiêu mặt đất, Chiến tranh Dacia (chapter001_d/p000079, p000084, p000085) / Đại úy Weiss, Trung úy Serebryakov, phó chỉ huy, Grantz (chapter001_d/p000081, p000082, p000084) / đánh chặn trên không (chapter001_d/p000083) / lễ rửa tội qua thực chiến (chapter001_d/p000085)"
  alternatives_vi:
  - đột kích thọc sâu (thay cho `đột kích chiều sâu` tại chapter001_d/p000042 — ưu tiên `đột kích chiều sâu` vì chuẩn thuật ngữ học thuyết quân sự và ăn khớp với tư duy tác chiến cơ động của Tiểu đoàn 203) / học thuyết pháp sư (thay cho `học thuyết tác chiến pháp sư` tại chapter001_d/p000045 — ưu tiên `học thuyết tác chiến pháp sư` vì diễn đạt rõ nghĩa nguyên lý sử dụng lực lượng pháp sư trên chiến trường) / kho thuốc phóng (thay cho `hầm thuốc súng` tại chapter001_d/p000071 — ưu tiên `hầm thuốc súng` vì tự nhiên và phân biệt rõ với cụm `nhà kho chứa chất nổ` đi liền ngay sau trong cùng câu)
