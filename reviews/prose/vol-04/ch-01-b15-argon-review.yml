  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, quốc gia, nhân vật, cấp bậc và thuật ngữ quân sự – hóa chất đã khóa tạm từ Tập 1–3 cùng B01–B14 của Tập 4 (`Thiếu tá`, `đại đội trưởng`, `chiến trường sông Rhine`, `lục địa phía nam`, `Liên bang`, `tổ quốc`, `Reich`, `Đế quốc`, `Cộng sản`, `chủ nghĩa Cộng sản`, `lũ Cộng sản`, `kali xyanua`, `quả cầu tính toán`, `Tiểu đoàn Pháp sư Trên không số 203`, `Thiếu tá von Degurechaff`, `khu vực tập kết xuất phát`, `pháo đường sắt`, `Lục quân Liên bang`, `thuật thức nổ`, `lô cốt`, `Lục quân Dacia`, `Chiến tranh Dacia`, `tấn công mục tiêu mặt đất` / `công kích mục tiêu mặt đất`, `Đại úy Weiss`, `phó chỉ huy`, `Trung úy Serebryakov`, `Grantz`, `lễ rửa tội`), đồng thời khóa tạm các thuật ngữ tác chiến và y sinh trong batch (`đột kích chiều sâu`, `học thuyết tác chiến pháp sư`, `chứng thiếu axit dạ dày`, `hầm thuốc súng`, `đánh nhanh rút gọn`, `vụ nổ thứ cấp`, `đánh chặn trên không`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_203rd_battalion_assault_speech_pronouns_and_address_vol04_ch01_b15
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_d/p000044, p000066, p000082) và giữ nguyên tên riêng `Tanya` (chapter001_d/p000044, p000048, p000066, p000070, p000073, p000082); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_d/p000047, p000050, p000058), ngôi thứ nhất số nhiều chỉ tập thể đơn vị Tiểu đoàn 203 / phía Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (chapter001_d/p000043, p000045, p000055, p000057, p000072), và câu nội tâm nhắn nhủ trực tiếp tới binh sĩ dùng `các anh` (chapter001_d/p000060); trong đối thoại giữa Tanya, Weiss và toàn tiểu đoàn: các đại đội trưởng và binh sĩ đồng thanh nhận lệnh đáp `Rõ, thưa Thiếu tá!` / `Rõ!` (chapter001_d/p000040, p000074); Tanya hạ lệnh và phát biểu khích lệ toàn tiểu đoàn xưng `tôi` / `chúng ta`, gọi thuộc cấp là `Các đại đội trưởng`, `Tất cả các đơn vị`, `các anh`, `hỡi những người anh em của tôi`, `Hỡi các binh sĩ` (chapter001_d/p000041, p000044, p000046, p000049, p000051, p000054, p000056, p000059, p000061, p000065, p000073, p000075); khi trao đổi riêng với phó chỉ huy trên không, Tanya xưng `tôi` / `chúng ta`, gọi `Đại úy Weiss` / `anh`, còn Weiss tự kiểm điểm sai sót xưng `tôi` kèm tiểu từ lễ phép `ạ` (chapter001_d/p000078–p000081)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_d/p000043, p000045, p000055, p000057, p000072 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B14, đồng thời phân biệt rõ với `chúng ta` dùng trong lời hiệu triệu trực tiếp trước toàn đơn vị tại p000044, p000051, p000054, p000056, p000073)
