  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch tuyệt đối với `vol-04-ch-03-b18` (`Tanya` / `nó` trong trần thuật, `chúng tôi` trong độc thoại nội tâm số nhiều của Tanya, `họ` cho đơn vị Đế quốc, `chúng` cho quân Liên bang, cùng hệ xưng hô quân ngũ chuẩn mực giữa Tanya với Weiss, Serebryakov và toàn tiểu đoàn), đồng thời bảo toàn chính xác cả 5 vị trí nhấn mạnh in nghiêng ở p000476, p000492, p000499, p000501 và p000503."
