  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, hô hiệu, khí tài và thuật ngữ quân sự/triết học đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b18` của Tập 4 (`Tanya`, `Thiếu tá`, `Đại úy Weiss`, `Lục quân Liên bang`, `Đám Cộng sản`, `hệ tư tưởng`, `nguyên tắc gây hại`, `Tiểu đoàn Pháp sư Trên không số 203`, `Liên bang`, `đội tiên phong`, `pháp sư trên không`, `sĩ quan phụ tá`, `Serebryakov`, `nhiệm vụ cảnh giới`, `Trung úy`, `Dacia`, `vùng hậu phương`, `trinh sát chiến đấu`, `phục kích`, `công kích mục tiêu mặt đất`, `lực lượng không quân`, `pháp sư`, `pháo hạng nặng`, `quyền làm chủ bầu trời`, `đánh chặn`, `Fairy 01`, `súng trường`, `đội hình công kích`, `đạn thuật thức`, `khởi phát thuật thức nổ` / `thuật thức nổ`, `quả cầu Type 97`, `tọa độ`, `bộ binh địch`, `vụ nổ thứ cấp`, `mảnh văng`), đồng thời khóa tạm các cách diễn đạt hình ảnh và chiến thuật trong lô (`trò đập chuột chũi hai búa`, `bức tường thịt`, `tầm bắn sát sạt`, `toán hộ tống đang quan sát`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tiegenhoff_tanya_pov_narration_and_203rd_sortie_dialogue_pronouns_and_emphasis_vol04_ch03_b19
  proposed_vi: "Trong toàn bộ lô `vol-04-ch-03-b19` (chapter001_l/p000475–p000506) khi Tiểu đoàn Pháp sư Trên không số 203 xuất kích trinh sát chiến đấu và công kích đội tiên phong Liên bang dưới sự chỉ huy của Thiếu tá Tanya Degurechaff: tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b18`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya quy chiếu Tanya nhất quán bằng tên riêng `Tanya` và đại từ `nó` / `Nó` kết hợp phản thân `mình` / `bản thân` (p000476, p000482, p000484, p000485, p000488, p000490, p000492, p000493, p000497, p000499, p000501–p000504, p000506), tuyệt đối không dùng `cô` cho Tanya trong lời kể hay độc thoại nội tâm; trong các câu độc thoại nội tâm ngôi thứ nhất số nhiều của Tanya chỉ tập thể đơn vị dùng `chúng tôi` / `Chúng tôi` (p000480, p000481, p000496); tại các câu nhận định khái quát có đại từ ngôi thứ hai phiếm chỉ trong nguồn, dùng chủ ngữ khái quát `người ta` (p000492) hoặc lược đại từ ngôi thứ hai phiếm chỉ (p000499) theo quy ước `direct-address choice`. (2) Trong lời kể, quy chiếu tập thể Tiểu đoàn 203 / đơn vị bằng `họ` (p000489, p000490, p000493, p000506), và quy chiếu quân địch Liên bang / Cộng sản bằng `chúng` / `Đám người này` (p000480, p000481, p000489, p000492–p000494, p000497). (3) Trong hội thoại: khi Tanya (`Fairy 01`) phát biểu và hạ lệnh cho toàn tiểu đoàn / đại đội (p000476, p000498, p000500, p000503), Tanya tự xưng `Tôi` / `tôi`, dùng `chúng ta` cho đơn vị và gọi thuộc cấp số nhiều là `Các anh chị` / `các anh chị` (p000476), `toàn tiểu đoàn`, `Các đại đội`, `Các thành viên đại đội`; khi đối đáp với Đại úy Weiss (p000477, p000478), Weiss gọi Tanya là `cô` và `thưa Thiếu tá`, còn Tanya gọi `Đại úy Weiss` và dùng `chúng ta`; khi trao đổi với Trung úy Serebryakov trên không (p000483, p000486–p000488, p000491, p000495), Tanya gọi `Trung úy`, dùng `chúng ta` cho đơn vị và `chúng` cho quân Liên bang, còn Serebryakov tự xưng `Tôi` / `tôi`, gọi Tanya là `cô` và `thưa Thiếu tá` / `Thiếu tá` kèm `ạ` (p000487). (4) Bảo toàn chính xác 5 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000476 (`*Xét cho cùng thì.*`), p000492 (`*Mà chính chúng mới là phe đang tấn công.*`), p000499 (`*Lên nào!*`), p000501 (`*Để chỉ huy đi đầu đúng là tuyệt thật.*`) và p000503 (`*Bây giờ sao? Bây giờ sao?*`), không phát sinh dấu `*` ngoài nguồn ở 27 đoạn còn lại."
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` / `Chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_l/p000480, p000481, p000496 — ưu tiên `chúng tôi` để phân biệt rạch ròi giữa độc thoại nội tâm của Tanya và đại từ gộp `chúng ta` khi Tanya phát lệnh trong thoại trực tiếp)
