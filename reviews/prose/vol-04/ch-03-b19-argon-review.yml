  proposed_vi: "Tanya, Thiếu tá, Đại úy Weiss, Lục quân Liên bang, Đám Cộng sản, hệ tư tưởng, nguyên tắc gây hại, Tiểu đoàn Pháp sư Trên không số 203, Liên bang, đội tiên phong, các đơn vị pháp sư trên không / pháp sư trên không, sĩ quan phụ tá, Serebryakov, nhiệm vụ cảnh giới, Trung úy, Dacia, vùng hậu phương, trinh sát chiến đấu, phục kích, công kích mục tiêu mặt đất, lực lượng không quân, pháp sư, pháo hạng nặng, quyền làm chủ bầu trời, đánh chặn, Fairy 01, trò đập chuột chũi hai búa, súng trường, đội hình công kích, bức tường thịt, tầm bắn sát sạt, lục quân địch, đạn thuật thức, khởi phát thuật thức nổ / thuật thức nổ, quả cầu Type 97, tọa độ, bộ binh địch, vụ nổ thứ cấp, mảnh văng, toán hộ tống đang quan sát (chapter001_l/p000476–p000483, p000485–p000495, p000498–p000506)"
  alternatives_vi:
  - nguyên lý gây hại (thay cho `nguyên tắc gây hại` tại chapter001_l/p000481 — ưu tiên `nguyên tắc gây hại` vì là thuật ngữ triết học chính trị–pháp lý chuẩn xác và tự nhiên của John Stuart Mill đã dùng nhất quán) / trinh sát hỏa lực (thay cho `trinh sát chiến đấu` tại chapter001_l/p000489, p000490 — ưu tiên `trinh sát chiến đấu` để đồng bộ với hệ thuật ngữ tác chiến đã khóa tạm từ Tập 1–3) / lá chắn thịt (thay cho `bức tường thịt` tại chapter001_l/p000501 — ưu tiên `bức tường thịt` để bám sát hình ảnh nguyên văn khi bố trí đội hình phía sau lưng)
