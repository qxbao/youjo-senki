  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000604"
    viewpoint: "Trần thuật mô tả bầu không khí ủ dột trong phòng họp."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000605"
    terms:
      - "Comrade General Secretary Josef: Đồng chí Tổng Bí thư Josef"
    pronouns: "Dùng 'họ' và 'lũ thất bại vô dụng' phản ánh thái độ khinh miệt trong điểm nhìn hạn tri của Loria."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000606"
    terms:
      - "Mr. Loria: ông Loria"
    emphasis: "Giữ nhấn mạnh Markdown '*Thật thảm hại hết chỗ nói*' khớp chính xác với thẻ em của nguyên bản."
    viewpoint: "Kết hợp câu cảm thán nội tâm trực tiếp của Loria và lời kể có sắc thái mỉa mai về sự miệt mài vì nhân dân, đất nước, đảng."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000607"
    terms:
      - "technocrat: nhà kỹ trị"
      - "Federation: Liên bang"
    pronouns: "Trần thuật gọi Loria là 'ông ta', tự quy chiếu gián tiếp là 'mình'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000608"
    terms:
      - "lageri: lageri"
    pronouns: "Trần thuật gọi Loria là 'ông ta'."
    emphasis: "Giữ đúng phạm vi nhấn mạnh Markdown cho câu hỏi nội tâm và đảo nghiêng (để chữ thường) từ 'lageri' đúng như cấu trúc thẻ em của nguồn, giữ chỉ số chú thích ¹⁸."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000609"
    terms:
      - "Loria: Loria"
    viewpoint: "Trần thuật chuyển tiếp hành động của Loria."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000610"
    terms:
      - "Comrade General Secretary: Đồng chí Tổng Bí thư"
      - "Imperial Army: Lục quân Đế quốc"
    pronouns: "Trong thoại báo cáo, Loria gọi Josef là 'Đồng chí Tổng Bí thư' và xưng hô ngôi thứ hai là 'đồng chí', gọi quân Đế quốc là 'chúng'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000611"
    terms:
      - "Commissariat for Internal Affairs: Bộ Dân ủy Nội vụ"
      - "field report: báo cáo thực địa"
      - "lageri: *lageri*"
    pronouns: "Trần thuật gọi Loria là 'ông ta'."
    emphasis: "Giữ nhấn mạnh Markdown '*lageri*' khớp với thẻ em trong nguyên bản."
    negation_modality: "Giữ câu điều kiện giả định ở quá khứ/thói quen của Loria tại Bộ Dân ủy Nội vụ (nếu không gói gọn trong ba dòng thì sẽ tống vào lageri)."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000612"
    terms:
      - "Federation: Liên bang"
      - "Comrade General Secretary: Đồng chí Tổng Bí thư"
    pronouns: "Trần thuật gọi Loria là 'Ông ta'."
    negation_modality: "Giữ phủ định toàn bộ 'chẳng có lấy một hệ thống nào vận hành theo cách đơn giản cả'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000613"
    pronouns: "Trong thoại của Josef: gọi các cấp dưới là 'các đồng chí' (comrades / you), tự quy chiếu tập thể là 'chúng ta' (our)."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000614"
    viewpoint: "Trần thuật nhận xét hàm ý đằng sau câu hỏi của Josef."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000615"
    terms:
      - "Comrade General Secretary Josef: Đồng chí Tổng Bí thư Josef"
    pronouns: "Chuyển đại từ khái quát 'you' thành 'người đó / kẻ đó' tự nhiên trong tiếng Việt; 'ông ta' quy chiếu Josef."
    negation_modality: "Giữ chuỗi giả định phân nhánh về các rủi ro chính trị khi trả lời câu hỏi của Josef."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000616"
    terms:
      - "Comrade General Secretary Josef: Đồng chí Tổng Bí thư Josef"
    negation_modality: "Giữ tương phản mỉa mai giữa ánh nhìn đầy vẻ quyết tâm sốt sắng và việc không một ai chịu hé răng."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000617"
    viewpoint: "Mệnh đề chuyển ý ngắn trong dòng suy nghĩ của Loria."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000618"
    pronouns: "Dùng 'lũ bất tài kia' (the inepts) đúng giọng điệu khinh miệt trong điểm nhìn của Loria."
    negation_modality: "Giữ sắc thái ví von giả định 'chẳng khác nào tự đặt cổ mình lên thớt'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000619"
    terms:
      - "lageri: lageri"
    pronouns: "Trần thuật gọi Loria là 'Ông ta', tự quy chiếu gián tiếp là 'mình'; trong câu độc thoại nội tâm trực tiếp, Loria xưng 'ta' và gọi đám quan chức bất tài là 'lũ các ngươi'."
    emphasis: "Giữ đúng phạm vi nhấn mạnh Markdown '*Sớm muộn gì ta cũng sẽ tống hết lũ các ngươi vào* lageri' (đảo nghiêng từ 'lageri' ngoài dấu sao) khớp chính xác với thẻ em của nguyên bản."
