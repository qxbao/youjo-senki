    viewpoint: "Trần thuật dẫn nhập dòng ghi chú ở cuối tài liệu mệnh lệnh."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000602"
    pronouns: "Dùng 'Hỡi ba quân' (Troops) và 'chúng ta' (our) phù hợp văn phong hiệu triệu quân sĩ trong mệnh lệnh."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000603"
    terms:
