  proposed_vi: "giảng viên / giảng viên đơn vị, doanh trại, Mary, giấy viết thư quân dụng do quân đội cấp phát, Khối Thịnh vượng chung, bánh táo, tân binh, quốc phòng, Hợp chúng quốc, Liên minh Hiệp ước / khu vực Liên minh Hiệp ước cũ, đậu nướng, lực lượng tình nguyện viễn chinh, cục nợ, các buổi tập bắn, ngắm chuẩn mục tiêu, ước lượng cự ly bằng mắt thường / đo khoảng cách một trăm mét bằng mắt thường, bia mục tiêu ở cự ly năm mươi mét hoặc hai trăm mét / bia hai trăm mét / tấm bia một trăm mét, trường bắn, đạn nguyên vỏ, đạn thật, đứng chờ lệnh / đứng chờ / tư thế đứng chờ lệnh, lời tuyên thệ trung thành, văn phòng tuyển quân (chapter001_n/p000367, p000368, p000370, p000372–p000376, p000378, p000379, p000382–p000395)"
  alternatives_vi:
  - huấn luyện viên (thay cho `giảng viên` tại chapter001_n/p000367, p000376, p000389, p000393 — ưu tiên `giảng viên` để đồng bộ với hệ thuật ngữ huấn luyện quân sự xuyên suốt các tập trước) / đạn hoàn chỉnh (thay cho `đạn nguyên vỏ` tại chapter001_n/p000390 — ưu tiên `đạn nguyên vỏ` vì phản ánh chuẩn xác cấu trúc kỹ thuật của viên đạn súng trường gồm vỏ đạn, thuốc phóng, hạt lửa và đầu đạn gắn liền dùng trong bắn đạn thật)
