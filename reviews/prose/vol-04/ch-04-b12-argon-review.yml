- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000370
  locks:
  - "Giữ toàn bộ đoạn thư nhấn mạnh in nghiêng `*Ở Khối Thịnh vượng chung con vẫn khỏe. Còn Mẹ và Bà dạo này thế nào ạ? Xin Mẹ và Bà hãy giữ gìn sức khỏe nhé.*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000371
  locks:
  - "Giữ toàn bộ đoạn thư nhấn mạnh in nghiêng `*Ờm, con đoán viết thế nghe hơi cứng nhắc nhỉ. Ở trong quân đội con hay bị mắng vì cách ăn nói của mình lắm. Nhưng cuộc sống ở đây lại ý nghĩa hơn con tưởng.*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000372
  locks:
  - "Giữ toàn bộ đoạn thư nhấn mạnh in nghiêng `*Nếu có điều gì khiến con bận tâm thì đó là chuyện ăn uống. Con cũng đã quen hơn một chút rồi, nhưng mà vẫn thế. Vì là trong quân đội nên chẳng được cái gì ngoài suất ăn thì rõ to, nhưng con nhớ những chiếc bánh táo mà bà cháu mình từng nướng quá, Bà ơi.*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000373
  locks:
  - "Giữ câu trần thuật đầu nằm ngoài dấu `*` với tên riêng `Mary`, và bọc chính xác câu nội tâm thứ hai kèm thời gian giả định quá khứ `*Lẽ ra mình nên thành thật hơn, và thay vì viết là nhớ nó, mình đã có thể nói rằng mình thậm chí còn nằm mơ thấy nó nữa.*` (theo DEC-P01-002; từ `nó` chỉ quy chiếu bánh táo)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000374
  locks:
