  volume: vol-04
  chapter: 4
  rationale: "Kế thừa đồng bộ các tên gọi, chính thể và thuật ngữ đã khóa tạm từ Tập 3 và các lô trước (`Mary`, `Khối Thịnh vượng chung`, `Hợp chúng quốc`, `Liên minh Hiệp ước`, `giảng viên`, `doanh trại`, `tân binh`, `bánh táo` tại Tập 3 Chương 1, `cục nợ`, `lời tuyên thệ trung thành`, `văn phòng tuyển quân` tại Tập 3 Chương 5), đồng thời khóa tạm các thuật ngữ sinh hoạt doanh trại và huấn luyện bắn súng mới phát sinh trong lô (`giấy viết thư quân dụng do quân đội cấp phát`, `giảng viên đơn vị`, `đậu nướng`, `lực lượng tình nguyện viễn chinh`, `khu vực Liên minh Hiệp ước cũ`, `các buổi tập bắn`, `ngắm chuẩn mục tiêu`, `ước lượng cự ly bằng mắt thường`, `trường bắn`, `đạn nguyên vỏ`, `đạn thật`, `đứng chờ lệnh` / `tư thế đứng chờ lệnh`)."
  uncertainty: low
  status: pending
