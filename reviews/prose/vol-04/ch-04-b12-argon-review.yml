  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, đồng bộ hoàn toàn hệ quy chiếu và xưng hô của `Mary` (`cô bé` trong lời kể; `con` – `Mẹ và Bà` / `Bà` / `bà cháu mình` trong thư gửi gia đình; `mình` / `bọn mình` trong nội tâm và lời tự nhủ; `Cô` trong lời giảng viên) từ Tập 3, xử lý đại từ phiếm chỉ theo `direct-address choice` tại p000386, giữ đúng thời gian giả định quá khứ tại p000373, và bảo toàn chính xác phạm vi nhấn mạnh in nghiêng tại 10 đoạn có thẻ `<html:em>`."
