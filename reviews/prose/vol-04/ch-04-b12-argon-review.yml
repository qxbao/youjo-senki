- source_term: mary_horton_bard_letter_soliloquy_and_shooting_drills_pronouns_address_and_emphasis_vol04_ch04_b12
  proposed_vi: "Toàn bộ 29 đoạn của `vol-04-ch-04-b12` (chapter001_n/p000367–p000395) tiếp nối mạch cảnh tại Căn cứ Huấn luyện Horton Bard thuộc Khối Thịnh vượng chung từ cuối `vol-04-ch-04-b11` (p000365–p000366), xoay quanh việc Mary Sue viết thư về cho mẹ và bà, nỗi niềm về chuyện ăn uống trong doanh trại và kỳ kiểm tra bắn đạn thật, tuân thủ nghiêm ngặt giới hạn chủ thể của `DEC-P01-001` (Tanya không xuất hiện trong toàn bộ lô; tuyệt đối không dùng đại từ `nó` cho bất kỳ nhân vật nào—các từ `nó` tại p000373, p000377 chỉ quy chiếu danh từ bất động vật là món bánh táo và đồ ăn quân đội), `DEC-P01-002` và `canon/style-guide.md`: (1) Trong trần thuật ngôi thứ ba: quy chiếu `Mary` nhất quán bằng `cô bé` kết hợp phản thân `mình` (p000368, p000374, p000378, p000381–p000383, p000388, p000389, p000391–p000395 — đồng bộ hoàn toàn với Tập 3); quy chiếu tập thể các học viên / tân binh và các giảng viên bằng đại từ số nhiều `họ` kèm phản thân `mình` (p000367, p000384–p000386, p000389, p000390, p000395 — nối mạch trực tiếp từ p000366); dịch thoát tự nhiên đại từ ngôi thứ hai phiếm chỉ tại p000386 thành cấu trúc danh động từ không đại từ (`việc ngắm chuẩn mục tiêu`) theo quy ước `direct-address choice`. (2) Trong nội dung bức thư gửi về gia đình (p000369–p000372): Mary tự xưng `con`, gọi hai người nhận là `Mẹ và Bà` / `Bà`, và dùng `bà cháu mình` khi nhắc lại kỷ niệm hai bà cháu cùng nướng bánh táo (p000372 — đồng bộ Tập 3 Chương 1). (3) Trong độc thoại nội tâm trực tiếp (p000373, p000379, p000382, p000384, p000392, p000394) và lời lẩm bẩm thành tiếng một mình (p000377, p000380, p000384): Mary tự quy chiếu số ít bằng `mình` / `Mình` và số nhiều gộp cùng các học viên khác bằng `bọn mình`. (4) Trong lời trêu của giảng viên với Mary (p000389): giảng viên gọi Mary là `Cô` kèm phản thân `mình` (`“Cô biết là mình đang nhắm vào bia hai trăm mét đấy chứ hả?”`). (5) Bảo toàn chính xác thời gian và sắc thái của giả định quá khứ tại p000373 (`Lẽ ra mình nên thành thật hơn, và thay vì viết là nhớ nó, mình đã có thể nói rằng mình thậm chí còn nằm mơ thấy nó nữa`), các cấu trúc điều kiện/giả định tại p000372, p000384, p000388, p000393, p000395, và toàn bộ 10 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000369–p000373, p000379, p000382 (2 cụm), p000384, p000392 (2 phần tách hai bên cụm chêm trần thuật) và p000394, không phát sinh dấu `*` ngoài nguồn ở 19 đoạn còn lại."
  alternatives_vi:
  - Em (thay cho đại từ `Cô` khi giảng viên trêu Mary tại chapter001_n/p000389 — ưu tiên `Cô` vì phù hợp với môi trường kỷ luật quân đội đối với nữ tân binh/học viên tại Khối Thịnh vượng chung, tránh sắc thái suồng sã cá nhân)
