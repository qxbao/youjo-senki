  proposed_vi: "Mary / Học viên Mary Sue / Học viên Sue, học viên, cuốn sổ tay pháp sư, Khối Thịnh vượng chung, trường bắn thi / trường bắn, bia mục tiêu, súng trường phục vụ kỳ thi, giảng viên / thưa Giảng viên, bài đánh giá bắn súng, bốt bắn, bài kiểm tra kỹ năng thực hành, đo khoảng cách tới mục tiêu bằng mắt thường / ước lượng khoảng cách tới mục tiêu bằng mắt thường / ước lượng khoảng cách bằng mắt thường, tự hiệu chỉnh sai số của mình / hiệu chỉnh sai số, bắn tự do, kiểm tra an toàn, vỏ đạn rỗng, đạn nguyên vỏ, thước ngắm, tháo rời và thông rửa khẩu súng / thông rửa khẩu súng, hộp đựng súng trường (chapter001_n/p000397–p000428, p000430, chapter001_p/p000001, p000003, p000004)"
  alternatives_vi:
  - buồng bắn / ô bắn (thay cho `bốt bắn` tại chapter001_n/p000407, p000408, p000410, p000415 — ưu tiên `bốt bắn` vì ngắn gọn, gợi đúng kết cấu vách ngăn cá nhân trên trường bắn và thuận miệng khi hô khẩu lệnh quân sự) / lau chùi khẩu súng (thay cho `thông rửa khẩu súng` tại chapter001_n/p000425, p000426, chapter001_p/p000003 — ưu tiên `thông rửa khẩu súng` khi đi kèm thao tác tháo rời bằng dụng cụ chuyên dụng của quân đội, đồng thời giữ `lau chùi khẩu súng` trong câu tự hỏi đời thường của Mary ở p000419)
