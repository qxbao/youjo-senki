  rationale: "Kế thừa đồng bộ các tên gọi, cấp bậc và thuật ngữ quân sự đã khóa tạm từ các tập và lô trước (`Mary`, `Học viên Mary Sue` / `Học viên Sue`, `học viên`, `Khối Thịnh vượng chung`, `giảng viên`, `trường bắn`, `bia mục tiêu`, `đo khoảng cách tới mục tiêu bằng mắt thường`, `đạn nguyên vỏ` tại `vol-04-ch-04-b12`), đồng thời khóa tạm các thuật ngữ quy trình kiểm tra bắn đạn thật và bảo dưỡng vũ khí mới phát sinh trong lô (`cuốn sổ tay pháp sư`, `trường bắn thi`, `súng trường phục vụ kỳ thi`, `bài đánh giá bắn súng`, `bốt bắn`, `bài kiểm tra kỹ năng thực hành`, `tự hiệu chỉnh sai số của mình`, `bắn tự do`, `kiểm tra an toàn`, `vỏ đạn rỗng`, `thước ngắm`, `tháo rời và thông rửa khẩu súng`, `hộp đựng súng trường`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: mary_shooting_evaluation_instructor_dialogue_and_soliloquy_pronouns_address_and_emphasis_vol04_ch04_b13
  proposed_vi: "Toàn bộ 39 đoạn của `vol-04-ch-04-b13` (chapter001_n/p000396–p000430 và chapter001_p/p000001–p000004) nối tiếp trực tiếp cảnh chờ kiểm tra bắn đạn thật tại Căn cứ Huấn luyện Horton Bard thuộc Khối Thịnh vượng chung từ cuối `vol-04-ch-04-b12`, xoay quanh lượt thi thực hành bắn súng của Học viên Mary Sue và việc cô bé nhận ra ẩn ý kiểm tra sai số của khẩu súng trường, tuân thủ nghiêm ngặt giới hạn chủ thể của `DEC-P01-001` (Tanya không xuất hiện trong toàn bộ lô; tuyệt đối không dùng đại từ `nó` cho bất kỳ nhân vật nào—các từ `nó` tại p000400, p000428 chỉ quy chiếu danh từ bất động vật là cuốn sổ tay pháp sư và khoảng thời gian chờ đợi), `DEC-P01-002` và `canon/style-guide.md`: (1) Trong trần thuật ngôi thứ ba: quy chiếu `Mary` nhất quán bằng `cô bé` kết hợp phản thân `mình` (p000396, p000398, p000400, p000401, p000403–p000405, p000407, p000410, p000414–p000416, p000420, p000428–p000430, chapter001_p/p000001, p000004 — đồng bộ hoàn toàn với Tập 3 và `vol-04-ch-04-b12`); quy chiếu người giảng viên coi thi bằng `người giảng viên` / `giảng viên` và đại từ `ông ta` (p000407, p000410, p000411, p000414, p000424, p000428, p000430, chapter001_p/p000001–p000004); quy chiếu tập thể các học viên và phía quân đội bằng đại từ số nhiều `họ` (p000404, p000410, p000418, p000421, chapter001_p/p000004). (2) Trong độc thoại nội tâm trực tiếp của Mary (p000417–p000419, p000421, p000430): tự quy chiếu số ít bằng `mình` và số nhiều gộp cùng các học viên khác bằng `Bọn mình` / `bọn mình` (đồng bộ `vol-04-ch-04-b12`). (3) Trong hội thoại giữa người bạn học viên cùng khóa với Mary (p000397, p000399): bạn cùng khóa gọi `Mary`, xưng hô ngang hàng thân mật `cậu`, Mary đáp `Cảm ơn nhé`. (4) Trong hội thoại quân sự giữa giảng viên và Học viên Mary Sue (p000402, p000406, p000408–p000411, p000413, p000422–p000427, p000430, chapter001_p/p000002, p000003): giảng viên gọi `Học viên Mary Sue` / `Học viên Sue`, dùng đại từ ngôi thứ hai `cô` / `Cô` (đồng bộ `vol-04-ch-04-b12` tại p000389), tự xưng `tôi` và đại diện ban giám khảo xưng `chúng ta` / `chúng tôi`; Mary đáp lễ theo đúng điều lệnh `Rõ, thưa ngài!` / `thưa ngài!` (p000408), gọi `thưa Giảng viên?` (p000422) và tự xưng `tôi` kèm tiểu từ kính ngữ `ạ` (p000425, p000427). (5) Xử lý chuẩn xác cấu trúc tăng tiến đổi chủ thể ở chapter001_p/p000003 (`chẳng những việc thông rửa khẩu súng sẽ ngốn thời gian, mà những người đang đứng chờ cũng sẽ đánh hơi được gợi ý rằng có yếu tố gây tốn thời gian ở đây`), và bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 10 đoạn: p000407 (`*May mắn thay*`), p000411, p000417, p000418, p000419 (2 cụm), p000420, p000421, p000424, p000430 (2 câu) và chapter001_p/p000004 (`*Cho nên.*`), không phát sinh dấu `*` ngoài nguồn ở 29 đoạn còn lại."
  alternatives_vi:
  - Báo cáo Giảng viên (thay cho `thưa Giảng viên` tại chapter001_n/p000422 — ưu tiên `thưa Giảng viên?` vì ở đoạn này Mary đang ngập ngừng đánh bạo đặt câu hỏi `“Ư-ừm, thưa Giảng viên?”` chứ không phải hô báo cáo điều lệnh dõng dạc như tại p000408)
