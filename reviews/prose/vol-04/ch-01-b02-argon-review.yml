  proposed_vi: "nơi đóng quân đã được chỉ định, luân chuyển nhân sự (chapter001_b/p000027) / Đại tá von Lergen, Thiếu tá Uger (chapter001_b/p000028, p000029, p000032, p000034, p000042, p000044, p000045, p000047, p000050) / Tiểu đoàn Pháp sư Trên không số 203, Bộ Tổng tham mưu, mặt trận phía nam (chapter001_b/p000030, p000035, p000040) / Quân đoàn Viễn chinh Phương Nam, báo cáo tác chiến (chapter001_b/p000031) / các đơn đề nghị trao thưởng huân chương (chapter001_b/p000033, p000034, p000036) / dịch vụ bưu chính quân sự (chapter001_b/p000037) / bộ phận vận tải (chapter001_b/p000045) / tài liệu phổ biến nhiệm vụ (chapter001_b/p000046) / lục địa phía nam (chapter001_b/p000048) / khuyết tật giao tiếp (chapter001_b/p000049) / quân số đầy đủ (chapter001_b/p000050)"
  alternatives_vi:
  - doanh trại chỉ định (thay cho `nơi đóng quân đã được chỉ định` tại chapter001_b/p000027 — ưu tiên `nơi đóng quân đã được chỉ định` vì diễn đạt chính xác điểm tập kết/trú quân được cấp trên phân bổ khi đơn vị hạ cánh) / hồ sơ đề xuất tuyên dương (thay cho `các đơn đề nghị trao thưởng huân chương` tại chapter001_b/p000033 — ưu tiên `các đơn đề nghị trao thưởng huân chương` để làm rõ đối tượng xin cấp huân chương mà Lergen hứa trao ở p000036) / phòng vận tải (thay cho `bộ phận vận tải` tại chapter001_b/p000045 — ưu tiên `bộ phận vận tải` để giữ tính trung tính về cấp biên chế cho mảng điều phối vận tải do Thiếu tá Uger phụ trách tại Bộ Tổng tham mưu, tránh nhầm với cấp sư đoàn chiến đấu) / rối loạn giao tiếp (thay cho `khuyết tật giao tiếp` tại chapter001_b/p000049 — ưu tiên `khuyết tật giao tiếp` vì giữ đúng sắc thái tự trào hiện đại sắc lạnh của Tanya)
