- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000027
  locks:
  - "Giữ cụm `nơi đóng quân đã được chỉ định`, niềm tin của `Tanya` rằng họ được gọi về nước để `nghỉ phép`, và đại từ `nó` suýt phải thán phục bộ chỉ huy vì `luân chuyển nhân sự` bài bản."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000028
  locks:
  - "Giữ tên và cấp bậc `Đại tá von Lergen` và `Thiếu tá Uger`, đại từ `nó` trong trần thuật, cùng sự ngưỡng mộ của `nó` trước `kỹ năng nhân sự` chu đáo của `Giới chóp bu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000029
  locks:
  - "Giữ đại từ `nó` cho phép binh sĩ dưới quyền `nghỉ tại chỗ`, chỉ thị các sĩ quan chăm lo cho lính tráng và quay sang `Đại tá von Lergen` để báo cáo."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000030
  locks:
  - "Giữ nguyên lời báo cáo quân sự chuẩn mực: `Tiểu đoàn Pháp sư Trên không số 203 trực thuộc Bộ Tổng tham mưu`, `Thiếu tá Tanya von Degurechaff`, đã trở về từ `mặt trận phía nam` mà không bỏ lại bất kỳ ai."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000031
  locks:
  - "Giữ xưng hô của Lergen (`Tôi` – `Thiếu tá von Degurechaff` / `các vị`), tên `Quân đoàn Viễn chinh Phương Nam`, và chi tiết xem `các báo cáo tác chiến`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000032
  locks:
  - "Giữ lời cảm ơn trang trọng của Tanya: `“Cảm ơn ngài, thưa Đại tá von Lergen!”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000033
  locks:
  - "Giữ cách Lergen gọi Tanya là `cô` khi nhắc tới `các đơn đề nghị trao thưởng huân chương` mà `cô` đã đệ trình cho binh sĩ dưới quyền, tự xưng `tôi`, và gọi tập thể đơn vị là `các vị` khi nhắc tới cống hiến xuất sắc ở phương nam."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000034
  locks:
  - "Giữ chi tiết trao nhau cái chào nhà binh và đại từ `ông` quy chiếu `Lergen`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000035
  locks:
  - "Giữ định danh `quân nhân chuyên nghiệp`, `sĩ quan Bộ Tổng tham mưu`, đại từ `ông` và hình ảnh lời hứa có sức nặng như một `bản hợp đồng`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000036
  locks:
  - "Giữ ngôi xưng `tôi` / `chúng tôi` của Lergen, tính giả định quá khứ `lẽ ra tôi rất muốn trao chúng ngay giây phút này`, và lý do bên hành chính cần thêm thời gian xử lý giấy tờ."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000037
  locks:
  - "Giữ lời đáp lễ phép của Tanya (`Không đâu ạ, tôi xin lỗi vì chúng tôi...`) và thuật ngữ `Dịch vụ bưu chính quân sự` ở vùng chiến sự hạn chế."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000038
  locks:
  - "Giữ nhận định màn trao đổi lời khách sáo và lấy làm tiếc đúng chuẩn sách giáo khoa về việc liên lạc bị gián đoạn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000039
  locks:
  - "Giữ sự đối sánh giữa `thư từ gửi bằng tàu thủy` với `điện báo hay thư điện tử`, và tầm quan trọng thiết yếu của việc trò chuyện trực tiếp mặt đối mặt."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000040
  locks:
  - "Giữ cấu trúc giả định quá khứ `Đáng lẽ nó phải...`, đại từ trần thuật `nó` kết hợp tự quy chiếu `mình` (`của mình`, `làm mình mủi lòng`), và tên `Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000041
  locks:
  - "Giữ mệnh đề độc thoại nội tâm in nghiêng `*…Đáng lẽ mình phải thận trọng hơn*` theo DEC-P01-001 và DEC-P01-002, cùng bối cảnh hiện tại trên khoang `máy bay vận tải`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000042
  locks:
  - "Giữ đại từ `nó` khi hồi tưởng thái độ của `Lergen`, và câu thoại của Lergen (`Tôi` – `các vị`)."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000043
  locks:
  - "Giữ sự kết hợp đại từ `mình` / `nó` đối với Tanya và `ông` đối với Lergen, cùng câu hỏi thăm tình hình chung ở thủ đô và quê nhà."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000044
  locks:
  - "Giữ chi tiết vẻ mặt ngập ngừng của `Thiếu tá Uger` khiến `nó` cuối cùng đánh hơi thấy điều kỳ lạ đang diễn ra."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000045
  locks:
  - "Giữ lời Lergen chuyển sang bàn công việc, quy chiếu `Thiếu tá Uger` bằng `anh ấy`, và yêu cầu giải thích cho `Thiếu tá von Degurechaff` về `bộ phận vận tải`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000046
  locks:
  - "Giữ câu đáp của Uger với Lergen (`Rõ, thưa Đại tá…`) và lời nói với Tanya (`Tôi` – `cô`, `tài liệu phổ biến nhiệm vụ`)."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000047
  locks:
  - "Giữ câu đáp lịch sự của Tanya với đồng cấp lớn tuổi hơn: `“Ông chu đáo quá, Thiếu tá Uger.”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000048
  locks:
  - "Giữ đại từ `nó` / `mình` ở câu trần thuật đầu và câu hỏi độc thoại nội tâm in nghiêng `*Phải chăng lục địa phía nam đã làm cùn mòn các giác quan của mình đến mức này ư?*` theo DEC-P01-001 và DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000049
  locks:
  - "Giữ câu tự trào ở ngôi thứ nhất dùng đại từ `mình` không in nghiêng (đúng nguồn XHTML không có thẻ `<em>`), cùng sự đối lập giữa `độ nhạy bén dành cho việc giết chóc` và chứng `khuyết tật giao tiếp` trong xã hội bình thường."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000050
  locks:
  - "Giữ câu hỏi giả định quá khứ in nghiêng `*Liệu mọi chuyện có rẽ sang hướng khác nếu mình ngập ngừng khi Lergen hỏi liệu mình có còn giữ được quân số đầy đủ hay không?*` với đại từ `mình` bên trong và `nó` ở mệnh đề dẫn theo DEC-P01-001 và DEC-P01-002."
