  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ các danh xưng và thuật ngữ quân sự đã khóa tạm ở các tập trước (`Đại tá von Lergen`, `Thiếu tá Uger`, `Tiểu đoàn Pháp sư Trên không số 203`, `Bộ Tổng tham mưu`, `Quân đoàn Viễn chinh Phương Nam`, `mặt trận phía nam`, `lục địa phía nam`) và khóa tạm các thuật ngữ hành chính – quân sự cùng cách nói tự trào của Tanya trong cảnh tiếp đón tại hậu phương (`nơi đóng quân đã được chỉ định`, `các đơn đề nghị trao thưởng huân chương`, `dịch vụ bưu chính quân sự`, `bộ phận vận tải`, `tài liệu phổ biến nhiệm vụ`, `khuyết tật giao tiếp`, `quân số đầy đủ`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_lergen_uger_pronouns_and_address_vol04_ch01_b02
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000025–p000029, p000040, p000042–p000044, p000048, p000050) và quy chiếu Đại tá von Lergen bằng `ông` (chapter001_b/p000034, p000035, p000043); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000024, p000040, p000041, p000043, p000048–p000050); khi Lergen nói với Tanya: tự xưng `tôi`, gọi tập thể Tiểu đoàn 203 là `các vị` (chapter001_b/p000031, p000033, p000042), gọi riêng Tanya là `cô` (chapter001_b/p000033) và quy chiếu cấp dưới Thiếu tá Uger bằng `anh ấy` (chapter001_b/p000045); khi Tanya đáp lời Lergen: xưng `tôi` / `chúng tôi`, gọi `ngài` / `thưa Đại tá von Lergen` kèm `ạ` (chapter001_b/p000032, p000037); khi Uger nhận lệnh Lergen và nói với Tanya: đáp `Rõ, thưa Đại tá…`, xưng `tôi`, gọi Tanya là `cô` (chapter001_b/p000046); khi Tanya nói với đồng cấp lớn tuổi hơn là Thiếu tá Uger: gọi `Ông` và `Thiếu tá Uger` (chapter001_b/p000047)"
  alternatives_vi:
  - ông ấy (thay cho `anh ấy` khi Đại tá von Lergen nhắc đến Thiếu tá Uger tại chapter001_b/p000045 — ưu tiên `anh ấy` vì Lergen là cấp trên trực tiếp tại Bộ Tổng tham mưu giới thiệu sĩ quan phụ trách dưới quyền) / Anh (thay cho `Ông` khi Tanya nói với Thiếu tá Uger tại chapter001_b/p000047 — ưu tiên `Ông` để kế thừa nhất quán tiền lệ xưng hô xã giao tôn trọng của Tanya đối với vị thiếu tá lớn tuổi đã có gia đình từ Tập 2)
