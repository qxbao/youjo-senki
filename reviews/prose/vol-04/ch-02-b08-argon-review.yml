- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000246
  locks:
  - "Giữ danh xưng `Viên sĩ quan phụ tá của nó`, tên riêng `Tanya`, các đại từ `nó` (theo DEC-P01-001), `cô`, `mình`, `họ` và câu độc thoại nội tâm `Bao che cho sai lầm của cấp dưới chẳng phải sở thích của mình hay gì cả, nhưng nếu có ai trong số họ bị chỉ trích dù làm đúng, mình sẽ không ngần ngại đứng ra bảo vệ họ.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000247
  locks:
  - "Giữ các đại từ `Tôi`, `cô`, `chúng ta` và các câu `Tôi sẽ trông cậy vào hiểu biết của cô về địa hình nơi đây đấy. Hãy làm việc thật tốt ngoài kia nhé. Tôi kỳ vọng chúng ta sẽ thực hiện được ước nguyện ấp ủ bấy lâu nay của cô.`."
