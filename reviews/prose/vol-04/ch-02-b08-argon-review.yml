  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, đơn vị, quốc gia, địa danh, công trình và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B07 Chương 2 của Tập 4 (`Liên minh Hiệp ước`, `Lục quân Đế quốc`, `Tanya` / `Thiếu tá` / `Tiểu đoàn trưởng`, `John Bull`, `lũ Cộng sản`, `Đại đội 1`, `Đại đội 2`, `Đại đội 3`, `Đại đội 4`, `Cung điện Nhân dân`, `Moskva`, `Josef`, `Sildberia`, `cảnh sát mật`, `Điện Kremlin`, `hỏa lực phòng không`, `pháo cao xạ`, `Tiểu đoàn Pháp sư Trên không số 203`, `Serebryakov` / `Trung úy` / `sĩ quan phụ tá`, `Liên bang`, `ROE`), đồng thời khóa tạm các định danh mục tiêu oanh tạc và liên tưởng lịch sử – chính trị của Tanya tại Moskva (`bay lướt qua`, `cơ sở chính quyền`, `xác ướp`, `lăng mộ`, `dân tư bản` / `nhà tư bản`, `những người chống Cộng cốt cán`, `tòa văn phòng công ty bảo hiểm cũ`, `tài liệu mật`, `Lục quân Mỹ`, `Hoàng cung`, `Lục quân Đức`, `hoàng gia Anh`, `trận địa phòng không`, `vị trí phòng ngự`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_company_orders_and_serebryakov_exchange_pronouns_vol04_ch02_b08
  proposed_vi: "Trong phân cảnh Thiếu tá Tanya von Degurechaff giao nhiệm vụ tấn công các mục tiêu tại thủ đô Moskva cho từng đại đội và trò chuyện với Trung úy Serebryakov dưới hỏa lực phòng không (chapter001_f/p000211–p000247): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối B07, trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` (p000211, p000214, p000236, p000246), kết hợp đại từ phản thân `mình` (p000212, p000219, p000240, p000243) và định danh bằng tên riêng `Tanya` (p000212, p000214, p000219, p000236, p000240, p000243, p000246); trong độc thoại nội tâm trực tiếp (p000216, p000219, p000220, p000222, p000225, p000246), Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình`, dùng `chúng tôi` / `Chúng tôi` cho ngôi thứ nhất số nhiều chỉ tập thể đơn vị (p000214, p000222, p000223, p000225, p000226, p000231) và dùng `Chúng ta` khi tự khích lệ tập thể lập kỳ tích lịch sử (p000219); dùng cấu trúc vô nhân xưng và chủ ngữ khái quát `người ta` cho đại từ ngôi thứ hai phiếm chỉ ở p000223; quy chiếu tập thể Tiểu đoàn 203 trong trần thuật bằng `họ` / `Họ` (p000211–p000214, p000246), quy chiếu phía Liên bang / Cộng sản bằng `chúng` / `bọn chúng` (p000214, p000223, p000232, p000235, p000241, p000244), và quy chiếu Trung úy Serebryakov trong trần thuật cùng suy nghĩ của Tanya bằng tên riêng `Serebryakov`, danh xưng `Viên sĩ quan phụ tá của nó` và đại từ `cô` (p000235, p000243, p000244, p000246). Trong mệnh lệnh vô tuyến gửi các đại đội và toàn tiểu đoàn (p000215, p000217, p000221, p000224, p000227, p000229, p000230): Tanya tự xưng `Tôi` / `tôi` hoặc định danh `Tiểu đoàn trưởng`, dùng `chúng ta`, gọi các đơn vị là `Đại đội 1`, `Đại đội 2`, `Đại đội 3`, `Đại đội 4`, `Những người còn lại`, `tất cả các đơn vị`, `toàn quân`, và gọi ngôi thứ hai số nhiều là `các anh chị` (p000217); toàn quân đồng thanh đáp `“““Rõ, thưa Thiếu tá!”””` (p000230). Trong đối thoại trực tiếp giữa Tanya và Serebryakov (p000235–p000239, p000241, p000242, p000245, p000247): Tanya tự xưng `Tôi` / `tôi`, dùng `Chúng ta` / `chúng ta` khi bao hàm cả hai / đơn vị, và gọi Serebryakov là `Trung úy` / `cô`; Serebryakov tự xưng `tôi`, dùng `chúng ta` và thưa Tanya lễ phép bằng `thưa Thiếu tá` kèm tiểu từ kính ngữ `ạ`"
  alternatives_vi:
  - cô (thay cho `nó` khi quy chiếu Tanya trong trần thuật ngôi thứ ba tại chapter001_f/p000211, p000214, p000236, p000246 — bắt buộc giữ `nó` theo quyết định đã duyệt `DEC-P01-001` trong `canon/decisions.md` vì toàn bộ phân cảnh bám sát điểm nhìn của Tanya) / các cậu (thay cho `các anh chị` khi Tanya giao nhiệm vụ cho Đại đội 2 tại chapter001_f/p000217 — ưu tiên `các anh chị` để giữ đúng sắc thái chỉ huy quân sự lịch sự, trang trọng của Tanya trước toàn quân và đồng bộ tuyệt đối với `p000199` ở `ch-02-b07`)
