  proposed_vi: "sức chiến đấu, đánh rồi rút, Liên minh Hiệp ước, Lục quân Đế quốc (chapter001_f/p000211, p000226) / Tanya, Thiếu tá (chapter001_f/p000212, p000214, p000219, p000230, p000236, p000239, p000240, p000242, p000243, p000246) / bay lướt qua, thị uy, John Bull, thủ đô địch (chapter001_f/p000213) / lũ Cộng sản, các tượng đài Cộng sản, dân tư bản, nhà tư bản, những người chống Cộng cốt cán (chapter001_f/p000214, p000218, p000219, p000227, p000228, p000236, p000238, p000244) / Đại đội 1, Cung điện Nhân dân, cơ sở chính quyền (chapter001_f/p000215) / Moskva, Sildberia (chapter001_f/p000216, p000221, p000223) / Đại đội 2, bức tượng đồng của Josef, xác ướp, lăng mộ (chapter001_f/p000217, p000218, p000220) / Đại đội 3, cảnh sát mật, tòa văn phòng công ty bảo hiểm cũ, tài liệu mật (chapter001_f/p000221–p000223) / Đại đội 4, Điện Kremlin, lũ gấu trong Điện Kremlin (chapter001_f/p000224, p000226) / Lục quân Mỹ, Hoàng cung, Lục quân Đức, hoàng gia Anh (chapter001_f/p000225) / Tiểu đoàn trưởng (chapter001_f/p000227) / hỏa lực phòng không, trận địa phòng không, pháo cao xạ, vị trí phòng ngự (chapter001_f/p000231–p000233, p000235, p000236) / Tiểu đoàn Pháp sư Trên không số 203 (chapter001_f/p000233) / Serebryakov, Trung úy, Liên bang, ROE, sĩ quan phụ tá (chapter001_f/p000235, p000238, p000241, p000243–p000246)"
  alternatives_vi:
