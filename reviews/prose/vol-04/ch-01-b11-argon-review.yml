  proposed_vi: "chủ nghĩa tư bản, chủ nghĩa Cộng sản (chapter001_b/p000298) / Trung úy Serebryakov, Trung đội 437, Lục quân Liên bang, Liên bang, tấn công phủ đầu, Đế quốc (chapter001_b/p000300, p000301, p000302, p000305, p000310, p000335) / những kẻ Cộng sản, lũ Cộng sản, nguyên lý thị trường, giao dịch và hợp đồng (chapter001_b/p000303, p000304, p000312, p000324) / biên giới phía đông (chapter001_b/p000305) / Trung úy Grantz (chapter001_b/p000307, p000308) / mồi nhử, không phận Liên bang, “máy bay vận tải”, điểm nhảy dù (chapter001_b/p000308, p000309, p000328) / máy bay tiêm kích, pháp sư, Quảng trường Đỏ, sân bay quốc tế (chapter001_b/p000311) / tổ quốc, vốn con người (chapter001_b/p000313, p000314, p000317) / chiến sĩ tự do, Hoàng đế Bệ hạ, Vinh quang thuộc về Đế quốc! (chapter001_b/p000316–p000318, p000329) / tiểu đoàn pháp sư, lính biệt kích nhảy dù, chuyên gia đổ bộ đường không (chapter001_b/p000319) / phe Đỏ, thuyết bất bạo động, quốc gia toàn trị (chapter001_b/p000322, p000323, p000325, p000331) / khu vực tác chiến, công dân gương mẫu, Tiểu đoàn trưởng (chapter001_b/p000327, p000332, p000333)"
  alternatives_vi:
  - đánh phủ đầu (thay cho `tấn công phủ đầu` tại chapter001_b/p000301 — ưu tiên `tấn công phủ đầu` vì trang trọng, chuẩn thuật ngữ quân sự khi Trung úy Serebryakov xin chỉ thị tác chiến từ Tanya) / lính dù biệt kích (thay cho `lính biệt kích nhảy dù` tại chapter001_b/p000319 — ưu tiên `lính biệt kích nhảy dù` và `chuyên gia đổ bộ đường không` để phân biệt rõ hai cách diễn đạt lực lượng nhảy dù chuyên nghiệp trong nguyên bản) / chủ nghĩa bất bạo động (thay cho `thuyết bất bạo động` tại chapter001_b/p000323 — ưu tiên `thuyết bất bạo động` vì đi cùng cụm `Trường phái tư tưởng rao giảng` rất tự nhiên trong tiếng Việt)
