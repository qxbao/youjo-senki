  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000326, p000328), giữ nguyên tên riêng `Tanya` (chapter001_b/p000302, p000308, p000326, p000335) và quy chiếu cơ trưởng máy bay vận tải bằng `ông` (chapter001_b/p000328); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000298, p000309, p000312, p000314, p000315, p000325, p000331, p000332), riêng câu trích dẫn danh ngôn lịch sử tại chapter001_b/p000330 dùng `tôi` (`Hãy cho tôi tự do hoặc cho tôi cái chết.`), ngôi thứ nhất số nhiều chỉ tập thể Tiểu đoàn 203 trong độc thoại nội tâm dùng `chúng tôi` (chapter001_b/p000304, p000309, p000320, p000322, p000329) và khi nêu mệnh đề nguyên lý chung hoặc khẩu hiệu tinh thần dùng `chúng ta` (chapter001_b/p000304, p000308, p000334); trong đối thoại giữa Serebryakov, Grantz, cơ trưởng và Tanya: Serebryakov hỏi và chào Tanya trước khi nhảy dù bằng `tôi` / `chúng ta` kèm `ạ` (chapter001_b/p000299, p000301, p000336), Tanya đáp lời Serebryakov bằng `Trung úy Serebryakov` / `cô` và gọi chung hai trung úy là `cả hai người, hai Trung úy` (chapter001_b/p000300, p000308), Grantz cảm thán dùng `Chúng ta` (chapter001_b/p000306), Serebryakov đồng tình với đồng cấp Grantz bằng `Tôi` – `cậu, Trung úy Grantz` (chapter001_b/p000307), cơ trưởng báo cáo gọi `Thưa Thiếu tá` và dùng `chúng ta` (chapter001_b/p000327), Tanya phát biểu và hạ lệnh cho toàn tiểu đoàn bằng `tôi` / `chúng ta` – `các anh` (chapter001_b/p000303, p000305, p000308, p000313, p000317, p000333, p000337)"
  alternatives_vi:
  - mình (thay cho `tôi` trong câu danh ngôn tại chapter001_b/p000330 — ưu tiên `Hãy cho tôi tự do hoặc cho tôi cái chết.` để giữ đúng âm hưởng trang trọng kinh điển của câu nói nổi tiếng trong lịch sử khi Tanya trích dẫn trong đầu) / anh (thay cho `cậu` khi Serebryakov nói với Grantz tại chapter001_b/p000307 — ưu tiên `cậu` để đồng bộ với quan hệ đồng đội ngang cấp thân thiết giữa hai trung úy Serebryakov và Grantz trong Tiểu đoàn 203)
