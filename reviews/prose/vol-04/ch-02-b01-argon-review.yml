  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, quốc gia, nhân vật và học thuyết quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1 Tập 4 (`NĂM THỐNG NHẤT 1926`, `VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC` / `Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc` / `Văn phòng Bộ Tổng tham mưu` / `Bộ Tổng tham mưu`, `Lục quân Liên bang`, `Lục quân Cộng hòa`, `mặt trận Rhine`, `thanh trừng`, `Sở chỉ huy Cụm tập đoàn quân phía Đông`, `trận tác chiến cơ động`, `Cục Hậu cần`, `Phó cục trưởng von Zettour`, `chiến lược nội tuyến`, `các tập đoàn quân khu vực`, `Đế quốc`, `Lục quân Đế quốc`, `Đại Quân`, `Cục Đường sắt`), đồng thời khóa tạm các định danh địa điểm và thuật ngữ tác chiến – hậu cần xuất hiện trong phần mở đầu Chương 2 (`PHÒNG HỌP SỐ 1` / `Phòng họp số 1`, `màn sương mù chiến trường`, `trạm tuần tra`, `chuyên viên phân tích`, `nền giáo dục tham mưu`, `phái nòng cốt`, `đội ngũ Đường sắt`, `kho tiếp vận`)."
