locked_choices:
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000001
  locks:
  - "Giữ tiêu đề mở đầu chương `NGÀY 15 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, PHÒNG HỌP SỐ 1`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000002
  locks:
  - "Giữ các định danh `Phòng họp số 1`, `Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc` và hình ảnh so sánh `chẳng khác nào boong tàu của một chiếc thuyền buồm vừa hứng trọn một cơn bão lớn`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000003
  locks:
  - "Giữ danh xưng `Lục quân Liên bang` và cụm `Tin dữ về cuộc xung đột quân sự toàn diện với Lục quân Liên bang ở phía đông đã truyền tới nơi.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000004
  locks:
  - "Giữ danh xưng `Bộ Tổng tham mưu`, hình ảnh `như những người thủy thủ đánh hơi thấy một cơn bão kinh hoàng đang ập tới` và phủ định kép `không một khâu chuẩn bị nào bị bỏ sót`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000005
  locks:
  - "Giữ đại từ `Họ`, các thuật ngữ `Lục quân Cộng hòa`, `mặt trận Rhine`, `thanh trừng` và cụm `Chuyện ngồi khoanh tay chờ đến lúc sự việc bùng nổ sẽ không được dung thứ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000006
  locks:
  - "Giữ câu khẩu hiệu in nghiêng `*Bộ Tổng tham mưu không được phép phạm thêm một sai lầm nào nữa.*` theo DEC-P01-002, cùng các cụm `mật khẩu cửa miệng`, `quyết tâm của các sĩ quan tham mưu` và `sự khước từ dứt khoát đối với sai lầm của những người tiền nhiệm`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000007
  locks:
