  proposed_vi: "NGÀY 15 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, PHÒNG HỌP SỐ 1 (chapter001_f/p000001) / Phòng họp số 1, Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc, Văn phòng Bộ Tổng tham mưu, Bộ Tổng tham mưu (chapter001_f/p000002, p000004, p000006, p000009, p000013) / Lục quân Liên bang (chapter001_f/p000003) / Lục quân Cộng hòa, mặt trận Rhine, thanh trừng (chapter001_f/p000005) / Sở chỉ huy Cụm tập đoàn quân phía Đông (chapter001_f/p000009) / trận tác chiến cơ động, Cục Hậu cần, Phó cục trưởng von Zettour, chiến lược nội tuyến (chapter001_f/p000010, p000020, p000022) / màn sương mù chiến trường (chapter001_f/p000012) / trạm tuần tra, các tập đoàn quân khu vực (chapter001_f/p000013) / chuyên viên phân tích, điểm bão hòa (chapter001_f/p000015) / Đế quốc, nền giáo dục tham mưu (chapter001_f/p000016) / phái nòng cốt, Lục quân Đế quốc (chapter001_f/p000017) / Đại Quân (chapter001_f/p000019) / Cục Đường sắt, đội ngũ Đường sắt (chapter001_f/p000020–p000022) / kho tiếp vận (chapter001_f/p000022)"
  alternatives_vi:
