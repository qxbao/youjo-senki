- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000008
  locks:
  - "Giữ đại từ `họ` và cụm `sức chiến đấu kỷ luật nghiêm minh của các binh sĩ tuyến đầu trong công cuộc phòng thủ phía đông`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000009
  locks:
  - "Giữ các định danh `Sở chỉ huy Cụm tập đoàn quân phía Đông` và `Văn phòng Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000010
  locks:
  - "Giữ các thuật ngữ và danh xưng `trận tác chiến cơ động`, `Cục Hậu cần`, `Phó cục trưởng von Zettour`, `chiến lược nội tuyến`, đại từ `họ` và cụm `ứng phó kịp thời với hoàn cảnh mà không hề chậm trễ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000011
  locks:
  - "Giữ đoạn chuyển ý in nghiêng `*Dẫu vậy…*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000012
  locks:
  - "Giữ cụm `màn sương mù chiến trường`, đại từ `họ` và cụm `một nhiệm vụ vô cùng đồ sộ đối với trí óc người phàm của họ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000013
  locks:
  - "Giữ các thuật ngữ `trạm tuần tra`, `các tập đoàn quân khu vực`, `Bộ Tổng tham mưu`, đại từ `họ` / `mình` và các cụm `những lời hỏi han mâu thuẫn nhau`, `năng lực xử lý của Bộ Tổng tham mưu vẫn có giới hạn`, `ắt vẫn phải có một ngưỡng tối đa`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000014
  locks:
  - "Giữ đại từ `họ` và câu `Cơn lũ báo cáo tình hình dễ dàng đập tan mọi dự tính của họ dành cho một cuộc diễn tập.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000015
  locks:
  - "Giữ đại từ `Họ` / `mình` / `chính họ` và các cụm `chuyên viên phân tích`, `phương án dự phòng`, `chạm tới điểm bão hòa`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000016
  locks:
  - "Giữ danh xưng `Đế quốc`, đại từ `mình` / `họ` và các cụm `kỹ năng tùy cơ ứng biến vốn được ca ngợi là tinh hoa trong nền giáo dục tham mưu của mình`, `gạt bỏ toàn bộ những dữ liệu vụn vặt ngay khoảnh khắc nhận thấy năng lực xử lý của mình đang bị quá tải`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000017
  locks:
  - "Giữ các thuật ngữ `phái nòng cốt`, `Lục quân Đế quốc` và cụm `giữ thái độ thực tế rằng thứ tự ưu tiên là trên hết`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000018
  locks:
  - "Giữ các cụm `bị gạt thẳng tay sang một bên không chút thương tiếc` và `toàn bộ ban tham mưu bắt đầu giải quyết công việc từ mức ưu tiên cao nhất trở xuống`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000019
  locks:
  - "Giữ đại từ `Họ` / `họ` / `mình`, danh xưng `Đại Quân` và cụm `triển khai thần tốc lực lượng của mình`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000020
  locks:
  - "Giữ các danh xưng `Cục Hậu cần`, `Cục Đường sắt`, đại từ `họ` và cụm `làm việc không ngủ không nghỉ để điều phối lịch trình chạy tàu`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000021
  locks:
  - "Giữ các cụm `các sĩ quan hậu cần phụ trách vật tư vừa rủa thầm trời đất vừa xoay xở tinh chỉnh lịch trình vận chuyển ngay tức khắc`, `kế hoạch tác chiến đưa ra vào phút chót` và `các thành viên của đội ngũ Đường sắt gần như gục ngã toàn bộ nhưng vẫn xoay xở hoàn thành nhiệm vụ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000022
  locks:
  - "Giữ chủ ngữ khái quát `người ta`, các thuật ngữ và danh xưng `chiến lược nội tuyến`, `Cục Đường sắt`, `kho tiếp vận`, `Cục Hậu cần`, cùng cụm `các chuyến bay đưa những sĩ quan tham mưu sang xác nhận tình hình cũng đang được thu xếp đúng theo kế hoạch`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000023
  locks:
  - "Giữ các cụm `không phải mọi thứ đều diễn ra đúng như dự kiến, như lẽ thường tình trên chiến trường` và `căn cứ theo các bản báo cáo thì tình hình quả thực có vẻ đang hỗn loạn`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000024
  locks:
  - "Giữ câu `Dù sao đi nữa, nơi này chẳng khác nào một sới bạc.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000025
  locks:
  - "Giữ đại từ `họ` và các câu `Liệu hành động của họ sẽ mang lại kết quả tốt hay xấu đây? Chuyện đó gần như chẳng khác gì đặt một ván cược. Nhìn đi đâu cũng thấy những sĩ quan với đôi mắt đỏ ngầu đang hối hả chạy ngược chạy xuôi.`."
