- source_term: imperial_general_staff_collective_narration_pronouns_vol04_ch02_b01
  proposed_vi: "Trong phân cảnh trần thuật ngôi thứ ba khách quan tại Phòng họp số 1 thuộc Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc (chapter001_f/p000001–p000025): quy chiếu tập thể Bộ Tổng tham mưu, các sĩ quan tham mưu, chuyên viên phân tích và các đơn vị phối thuộc bằng `Họ` / `họ` xuyên suốt (p000005, p000007, p000008, p000010, p000012–p000016, p000019, p000020, p000025), kết hợp đại từ phản thân `mình` ở các mệnh đề phụ thuộc tự quy chiếu (p000013, p000015, p000016, p000019); tại p000022 dùng chủ ngữ khái quát `người ta` cho nhận định truyền thống trong lục quân và tại p000025 dùng cấu trúc khái quát vô nhân xưng `Nhìn đi đâu cũng thấy` cho góc nhìn bao quát khắp phòng họp"
  alternatives_vi:
  - bạn (thay cho cấu trúc vô nhân xưng `Nhìn đi đâu cũng thấy` tại chapter001_f/p000025 — ưu tiên lược đại từ ngôi thứ hai phiếm chỉ để giữ giọng trần thuật quân sự khách quan, tránh cảm giác người kể chuyện đang trò chuyện trực tiếp với độc giả)
