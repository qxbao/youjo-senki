- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000160
  locks:
  - "Giữ câu cảm thán ngắn: `“Hả?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000161
  locks:
  - "Giữ đại từ `Tôi`, `chúng ta` và tên `Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000162
  locks:
  - "Giữ tên `Weiss` và lời lẩm bẩm khi chợt nhận ra: `“…À, tôi hiểu rồi.”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000163
  locks:
  - "Giữ dấu nhấn mạnh `*Chính xác.*` đúng phạm vi thẻ `<em>` trong nguồn theo DEC-P01-002, cùng tên `Tanya`, `Bộ Tổng tham mưu` và `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000164
  locks:
  - "Giữ các tên `Quân đội Đế quốc`, `Bộ Tổng tham mưu`, `Đế quốc`, đại từ tập thể `chúng tôi` và lập luận về hậu quả ngoại giao khôn lường trong thời bình."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000165
  locks:
  - "Giữ cụm `Cấp trên`, đại từ `chúng tôi` và tên `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000166
  locks:
  - "Giữ tên `Bộ Tổng tham mưu`, cụm `giới chóp bu` và thế đối lập `bước kiểm tra cuối cùng, chứ không phải một cuộc trinh sát dè dặt`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000167
  locks:
  - "Giữ chi tiết giả định chiến sự sẽ nổ ra và điều động một vài đơn vị vào vị trí."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000168
  locks:
  - "Giữ câu thoại ngắn: `“Vậy là chiến tranh rồi.”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000169
  locks:
  - "Giữ cách thưa gửi `Xin thứ lỗi, thưa Thiếu tá`, tên `Liên bang` và sự phân biệt giữa giả thuyết có khả năng đúng cao với điều khẳng định chắc chắn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000170
  locks:
  - "Giữ tên `Weiss`, `Tanya`, `Liên bang` và dấu nhấn mạnh `*mơ hồ*` đúng phạm vi thẻ `<em>` trong nguồn theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000171
  locks:
  - "Giữ các tên `Liên bang`, `Cộng hòa`, `lực lượng chủ lực của Đế quốc`, đại từ `Tôi` và hai câu hỏi nghi vấn `Liệu đó có phải là một kiểu phô trương thanh thế nào đó không? Một đòn hù dọa ngoại giao chăng?`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000172
  locks:
  - "Giữ tên `Tanya`, `Weiss`, đại từ `anh`, `Nó` / `nó`, cụm `vị phó chỉ huy của mình` và `một người có lương tri xuất sắc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000173
  locks:
  - "Giữ dấu nhấn mạnh `*…Những cuộc chiến mà nhân loại từng trải qua đã bắt đầu như thế nào?*` đúng phạm vi thẻ `<em>` trong nguồn theo DEC-P01-002 và kết luận `về bản chất chính là sự thất bại của lý trí`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000174
  locks:
  - "Giữ mệnh lệnh chuẩn bị của Tanya: `“Hãy lường trước tình huống xấu nhất. Chúng ta sẽ nhảy dù xuống với giả định là đang tiến thẳng vào giao chiến.”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000175
  locks:
  - "Giữ tiếng thốt sửng sốt của Weiss: `“Thiếu tá?!”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000176
  locks:
  - "Giữ sự phân tách đại từ `nó`, `anh`, `mình`, tên `Tanya`, thuật ngữ `chính quốc`, và lời nhờ vả ở cuối đoạn: `“Được rồi, Đại úy Weiss, nếu anh không có ý kiến phản đối nào, phiền anh phổ biến tình hình cho binh lính nhé?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000177
  locks:
  - "Giữ câu hỏi lại chuẩn mực quân đội của Weiss: `“Tôi sao, thưa Thiếu tá?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000178
  locks:
  - "Giữ đại từ `anh`, `nó`, tên `Tanya` và cụm trong ngoặc kép `“nỗi xấu hổ của nó”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000179
  locks:
  - "Giữ toàn bộ câu độc thoại nội tâm trong dấu nhấn mạnh theo DEC-P01-002 với đại từ `Mình` và `anh ấy`: `*…Mình ghen tị với việc anh ấy có thể phóng to giọng nói thật đấy.*`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000180
  locks:
  - "Giữ cách gọi `Đại úy ạ`, đại từ `tôi` và lời giải thích không thể nói thật to để vọng tới tất cả mọi người trong chiếc máy bay ồn ào."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000181
  locks:
  - "Giữ đại từ trần thuật `nó` / `Nó`, tên `Weiss` và chi tiết tiếng động cơ át mất giọng nói."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000182
  locks:
  - "Giữ đại từ `nó` và phép so sánh giữa một người đàn ông trưởng thành với một đứa trẻ khi cố nói vọng xuống cuối khoang máy bay."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000183
  locks:
  - "Giữ tên `Tanya`, đại từ `nó` và các thuật ngữ `thuật thức`, `cẩm nang không chiến`, `thuật thức khuếch đại giọng nói`, `tín hiệu ma năng`, `mạng lưới cảnh giới`."
