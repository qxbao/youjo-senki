  proposed_vi: "Liên bang, biên giới phía đông (chapter001_b/p000152, p000155, p000158, p000163, p000165, p000169, p000170, p000171) / Đế quốc, Quân đội Đế quốc, lực lượng chủ lực của Đế quốc (chapter001_b/p000153, p000158, p000164, p000171) / Đại tá von Lergen, Thiếu tá Uger, khả năng giao tiếp phi ngôn ngữ (chapter001_b/p000154) / Bộ Tổng tham mưu, lực lượng dự bị (chapter001_b/p000155, p000156, p000157, p000161, p000163, p000164, p000166) / Đại úy Weiss, phó chỉ huy (chapter001_b/p000157, p000172, p000176) / Cộng hòa, phô trương thanh thế, đòn hù dọa ngoại giao (chapter001_b/p000171, p000172) / sự thất bại của lý trí (chapter001_b/p000173) / nhảy dù, chính quốc (chapter001_b/p000174, p000176) / cẩm nang không chiến, thuật thức khuếch đại giọng nói, tín hiệu ma năng, mạng lưới cảnh giới (chapter001_b/p000183)"
  alternatives_vi:
  - năng lực giao tiếp phi ngôn từ (thay cho `khả năng giao tiếp phi ngôn ngữ` tại chapter001_b/p000154 — ưu tiên `khả năng giao tiếp phi ngôn ngữ` vì tự nhiên, chuẩn thuật ngữ tâm lý học – nhân sự hiện đại và liên kết trực tiếp với cụm `khuyết tật giao tiếp` ở B02) / sổ tay tác chiến đường không (thay cho `cẩm nang không chiến` tại chapter001_b/p000183 — ưu tiên `cẩm nang không chiến` để giữ cách gọi gọn, đồng bộ với các tập trước) / lưới cảnh báo phòng không (thay cho `mạng lưới cảnh giới` tại chapter001_b/p000183 — ưu tiên `mạng lưới cảnh giới` vì bám sát nghĩa hệ thống trinh sát cảnh giới phát hiện tín hiệu ma năng mà không tự bó hẹp phạm vi)
