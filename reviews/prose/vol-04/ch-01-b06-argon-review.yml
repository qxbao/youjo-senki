  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, quốc gia và thuật ngữ ma pháp đã khóa tạm từ Tập 1–3 cùng B01–B05 của Tập 4 (`Liên bang`, `Đế quốc`, `Đại tá von Lergen`, `Thiếu tá Uger`, `Bộ Tổng tham mưu`, `Đại úy Weiss`, `Cộng hòa`, `phó chỉ huy`, `chính quốc`, `thuật thức`, `tín hiệu ma năng`), đồng thời khóa tạm các cụm thuật ngữ phân tích chiến lược và tác chiến thâm nhập trên khoang máy bay (`khả năng giao tiếp phi ngôn ngữ`, `đòn hù dọa ngoại giao`, `cẩm nang không chiến`, `thuật thức khuếch đại giọng nói`, `mạng lưới cảnh giới`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_cabin_dialogue_pronouns_and_address_vol04_ch01_b06
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000154, p000172, p000176, p000178, p000181–p000183) và quy chiếu Đại úy Weiss bằng `anh` (chapter001_b/p000172, p000176, p000178); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000154, p000172, p000176, p000179), quy chiếu Weiss trong độc thoại nội tâm bằng `anh ấy` (chapter001_b/p000179) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị trong suy nghĩ dùng `chúng tôi` (chapter001_b/p000156, p000164, p000165); trong đối thoại bàn luận chiến cục và giao việc trên khoang máy bay giữa Tanya và Weiss: Tanya xưng `tôi`, gọi `Đại úy Weiss` / `Đại úy` / `anh` (chapter001_b/p000157, p000159, p000176, p000180), dùng `chúng ta` khi bao hàm cả hai hoặc toàn đơn vị (chapter001_b/p000161, p000174, p000176); Weiss xưng `tôi`, gọi Tanya là `thưa Thiếu tá` / `Thiếu tá` (chapter001_b/p000158, p000162, p000169, p000171, p000175, p000177)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong suy nghĩ của Tanya về việc đơn vị được cử vượt biên giới tại chapter001_b/p000156, p000164, p000165 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể Tiểu đoàn 203 đối lập với Bộ Tổng tham mưu từ B01 đến B05)
