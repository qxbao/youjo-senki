  proposed_vi: "Cụm A, Norden, Cụm C, khu vực Dacia, Đại Quân, các đạo quân phía đông, Cụm tập đoàn quân phía Đông, tập trung binh lực (chapter001_j/p000049, p000050) / Zettour, sức chiến đấu, Dacia, mặt trận Dacia, Rudersdorf, quân tiếp viện (chapter001_j/p000051–p000053, p000059, p000062, p000065, p000067, p000068, p000071–p000073) / Lục quân Đế quốc, Cộng hòa, chiến trường Rhine, nguồn tiếp tế (chapter001_j/p000054–p000057, p000060) / cơ sở hạ tầng, chính quốc, trận cơ động đánh chặn, biên giới phía đông, tác chiến trì hoãn, trận chiến chiến hào (chapter001_j/p000059, p000065, p000075) / chiến lược nội tuyến, trận chiến tiến công tầm xa, Cục Tác chiến, kiềm chế tiêu hao, phòng tuyến vững chắc, người phụ trách tác chiến (chapter001_j/p000060, p000061, p000065, p000066, p000070, p000072, p000073) / dư địa chiến lược, Lục quân Liên bang, thế chủ động, sĩ quan tham mưu, công tác hậu cần (chapter001_j/p000070, p000072–p000074) / Cục Đường sắt, chính sách tiêu thổ, các đơn vị không quân và pháp sư, lực lượng không quân, trận chiến tiêu thổ, phi đội, Cụm B, Liên bang (chapter001_j/p000075–p000078) / mặt trận phía đông, binh lực trên không, đơn vị máy bay ném bom, Bộ Tổng tham mưu (chapter001_j/p000077, p000078)"
  alternatives_vi:
  - ngăn chặn bằng tiêu hao (thay cho `kiềm chế tiêu hao` tại chapter001_j/p000065 — ưu tiên `kiềm chế tiêu hao` vì cô đọng, chuẩn văn phong học thuyết quân sự trong chuỗi ba khái niệm song hành của Zettour) / không gian xoay xở chiến lược (thay cho `dư địa chiến lược` tại chapter001_j/p000070 — ưu tiên `dư địa chiến lược` vì súc tích và lột tả tự nhiên khái niệm biên độ linh hoạt để điều động binh lực trong chiến lược nội tuyến) / chiến thuật vườn không nhà trống (thay cho `chính sách tiêu thổ` / `trận chiến tiêu thổ` tại chapter001_j/p000075, p000076 — ưu tiên `chính sách tiêu thổ` và `trận chiến tiêu thổ` để giữ đúng sắc thái thuật ngữ quân sự hiện đại của Bộ Tổng tham mưu Đế quốc)
