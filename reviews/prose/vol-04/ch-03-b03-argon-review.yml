  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, cơ quan, đơn vị, nhân vật và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b02` của Tập 4 (`Cụm A`, `Norden`, `Cụm B`, `Cụm C`, `Dacia`, `mặt trận Dacia`, `Đại Quân`, `các đạo quân phía đông`, `Cụm tập đoàn quân phía Đông`, `tập trung binh lực`, `Zettour`, `Rudersdorf`, `sức chiến đấu`, `Lục quân Đế quốc`, `Cộng hòa`, `chiến trường Rhine`, `chính quốc`, `tác chiến trì hoãn`, `trận chiến chiến hào`, `chiến lược nội tuyến`, `Cục Tác chiến`, `Lục quân Liên bang`, `sĩ quan tham mưu`, `hậu cần`, `Cục Đường sắt`, `pháp sư`, `lực lượng không quân`, `mặt trận phía đông`, `máy bay ném bom`, `Bộ Tổng tham mưu`), đồng thời khóa tạm các tổ hợp thuật ngữ tác chiến trong cuộc tranh luận giữa Zettour và Rudersdorf về mặt trận Dacia và phân bổ không quân (`trận cơ động đánh chặn`, `kiềm chế tiêu hao`, `dư địa chiến lược`, `chính sách tiêu thổ` / `trận chiến tiêu thổ`)."
  uncertainty: low
  status: pending
