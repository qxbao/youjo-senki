  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm, địa danh và định danh quốc gia/quân đội đã khóa tạm từ Tập 1–3, Chương 1–4 Tập 4 và `vol-04-ch-05-b01` → `vol-04-ch-05-b03` (`Tanya`, `nghiên cứu kỹ năng tác chiến`, `Đại úy`, `thực địa`, `phiên điều trần`, `Trung tướng von Zettour`, `hậu phương`, `các phòng tuyến phía tây`, `Weiss`, `giới tư vấn`, `các đoàn điều tra`, `Thiếu tá`, `mặt trận Rhine`, `Serebryakov`, `Hợp chúng quốc`, `Khối Thịnh vượng chung`, `Lục quân Hợp chúng quốc`, `Lục quân Khối Thịnh vượng chung`, `quy tắc giao chiến`, `Đế quốc`), đồng thời khóa tạm các thuật ngữ quản trị, quân sự – pháp lý quốc tế và liên tưởng tiền kiếp mới phát sinh trong lô (`mô hình kinh doanh`, `các chỉ huy tác chiến`, `lực lượng pháp sư tình nguyện quy mô cấp trung đoàn`, `tiền lệ và nguyên tắc pháp lý`, `quân đội chính quy`, `chuyên gia pháp lý`, `các quy định về việc đối xử với tù binh`, `Quân đoàn Lê dương Pháp`, `những người lính Mỹ có thẻ xanh`, `binh lính Khối Thịnh vượng chung`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_briefing_and_commanders_conference_pronouns_address_and_five_emphases_vol04_ch05_b04
  proposed_vi: "Toàn bộ 30 đoạn trong `vol-04-ch-05-b04` (chapter001_r/p000080–p000109) gồm hai phân cảnh nối tiếp qua ngắt cảnh `space-break` tại p000095 (phần cuối buổi giao nhiệm vụ khảo sát thực địa của Tanya với Đại úy Weiss tại p000080–p000094, và cuộc họp các chỉ huy tác chiến bàn về tư cách pháp lý cùng quy định tù binh đối với trung đoàn pháp sư tình nguyện Hợp chúng quốc dưới quyền chỉ huy của Khối Thịnh vượng chung tại p000095–p000109) tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`: (1) Tại p000080 có đại từ ngôi thứ hai phiếm chỉ trong nguồn: chuyển sang chủ ngữ khái quát `người ta` (`Nếu người ta hợp tác trả lời phỏng vấn...`) theo đúng quy ước `direct-address choice` trong `work/run-state/pending-terms.yml`. (2) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya: quy chiếu `Tanya` nhất quán bằng tên riêng và đại từ `nó` kết hợp phản thân `mình` (p000081, p000083–p000085, p000093, p000094, p000098, p000104, p000105, p000107 — tuyệt đối không dùng `cô` / `cô ấy` cho Tanya trong lời kể hay độc thoại nội tâm); quy chiếu vị chuyên gia pháp lý bằng `anh ta` (p000099); quy chiếu tập thể đơn vị, các đơn vị tiền tuyến, giới tư vấn, các chỉ huy tác chiến và lực lượng pháp sư tình nguyện bằng `họ` / `Họ` / `bọn họ` (p000084, p000088, p000095, p000099, p000107, p000108). (3) Trong độc thoại nội tâm và câu suy nghĩ gián tiếp của Tanya (p000085, p000088, p000094): tại p000088, độc thoại nội tâm hồi tưởng kiến thức tiền kiếp của Tanya tự quy chiếu bằng `Mình`; tại p000085, lời nhắn nhủ in nghiêng hướng tới Weiss dùng cặp `Tôi` — `anh` (`*Tôi cần anh làm cho thật tốt đấy.*`); tại p000094, câu độc thoại nội tâm in nghiêng quy chiếu Weiss và Serebryakov bằng `Anh ấy và Serebryakov`. (4) Trong hội thoại quân sự (p000082, p000086, p000090–p000092, p000096, p000097, p000099, p000100, p000102, p000109): khi trao đổi với Đại úy Weiss (p000082, p000086, p000090, p000092), Tanya tự xưng `tôi` / `Tôi`, dùng đại từ gộp `chúng ta`, gọi Weiss là `Đại úy` và `anh`, còn Weiss (p000091) thưa `Thiếu tá` kèm tiểu từ kính ngữ `ạ`; trong cuộc họp các chỉ huy tác chiến (p000096, p000097, p000099, p000100, p000102, p000109), các chỉ huy và chuyên gia pháp lý dùng `chúng ta` / `chúng tôi`, quy chiếu lực lượng pháp sư tình nguyện bằng `họ` / `Họ`, và khi Tanya chất vấn vị sĩ quan chuyên gia pháp lý tại p000109 thì dùng cặp đại từ lịch sự chuẩn điều lệnh `chúng ta` — `anh` / `Anh`. (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 5 đoạn: p000085 (`*Tôi cần anh làm cho thật tốt đấy.*`), p000094 (`*Anh ấy và Serebryakov chắc chắn sẽ có thể thực hiện một cuộc khảo sát đàng hoàng.*`), p000098 (`*hừm*`), p000099 (`*Thế kết luận là gì?*`), và p000103 (`*Vậy là quyết định xong rồi nhé*`), không phát sinh dấu `*` ngoài nguồn ở 25 đoạn còn lại."
  alternatives_vi:
  - Khi hợp tác trả lời phỏng vấn mà kết quả lại bị bóp méo (thay cho chủ ngữ khái quát `Nếu người ta hợp tác trả lời phỏng vấn rồi kết quả lại bị bóp méo` tại chapter001_r/p000080 — ưu tiên `Nếu người ta hợp tác trả lời phỏng vấn...` vì giữ rõ cấu trúc điều kiện `Nếu... thì chẳng trách sao...` và tuân thủ quy ước `direct-address choice`)
