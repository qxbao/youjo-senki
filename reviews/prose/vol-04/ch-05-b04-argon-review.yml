  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm, địa danh và định danh quốc gia/quân đội đã khóa tạm từ Tập 1–3, Chương 1–4 Tập 4 và `vol-04-ch-05-b01` → `vol-04-ch-05-b03` (`Tanya`, `nghiên cứu kỹ năng tác chiến`, `Đại úy`, `thực địa`, `phiên điều trần`, `Trung tướng von Zettour`, `hậu phương`, `các phòng tuyến phía tây`, `Weiss`, `giới tư vấn`, `các đoàn điều tra`, `Thiếu tá`, `mặt trận Rhine`, `Serebryakov`, `Hợp chúng quốc`, `Khối Thịnh vượng chung`, `Lục quân Hợp chúng quốc`, `Lục quân Khối Thịnh vượng chung`, `quy tắc giao chiến`, `Đế quốc`), đồng thời khóa tạm các thuật ngữ quản trị, quân sự – pháp lý quốc tế và liên tưởng tiền kiếp mới phát sinh trong lô (`mô hình kinh doanh`, `các chỉ huy tác chiến`, `lực lượng pháp sư tình nguyện quy mô cấp trung đoàn`, `tiền lệ và nguyên tắc pháp lý`, `quân đội chính quy`, `chuyên gia pháp lý`, `các quy định về việc đối xử với tù binh`, `Quân đoàn Lê dương Pháp`, `những người lính Mỹ có thẻ xanh`, `binh lính Khối Thịnh vượng chung`)."
  uncertainty: low
  status: pending
