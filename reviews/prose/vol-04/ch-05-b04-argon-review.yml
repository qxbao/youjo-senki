  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, giữ đồng bộ hệ đại từ của Tanya (`nó` trong trần thuật, `Mình` trong nội tâm, `tôi` / `chúng ta` trong thoại chỉ huy), hệ xưng hô điều lệnh với Đại úy Weiss và chuyên gia pháp lý trong cuộc họp chỉ huy tác chiến, chủ ngữ khái quát `người ta` ở p000080, cùng phạm vi nhấn mạnh in nghiêng chính xác ở 5 đoạn p000085, p000094, p000098, p000099 và p000103."
