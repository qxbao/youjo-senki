  proposed_vi: "Tanya, nghiên cứu kỹ năng tác chiến, Đại úy, thực địa, phiên điều trần, Trung tướng von Zettour, hậu phương, các phòng tuyến phía tây, Weiss, mô hình kinh doanh, giới tư vấn, các đoàn điều tra, Thiếu tá, mặt trận Rhine, Serebryakov, các chỉ huy tác chiến, lực lượng pháp sư tình nguyện quy mô cấp trung đoàn, Hợp chúng quốc, Khối Thịnh vượng chung, Lục quân Hợp chúng quốc, Lục quân Khối Thịnh vượng chung, quy tắc giao chiến, tiền lệ và nguyên tắc pháp lý, quân đội chính quy, chuyên gia pháp lý, các quy định về việc đối xử với tù binh, Đế quốc, Quân đoàn Lê dương Pháp, những người lính Mỹ có thẻ xanh, binh lính Khối Thịnh vượng chung (chapter001_r/p000081–p000096, p000098–p000109)"
  alternatives_vi:
