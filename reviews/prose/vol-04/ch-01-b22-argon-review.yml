  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, học viện, nhân vật và thuật ngữ chính trị – tâm lý đã khóa tạm từ Tập 1–3 cùng B01–B21 của Tập 4 (`Liên bang`, `Cộng sản`, `chứng hoang tưởng`, `ảo tưởng`, `Andrew, phóng viên đặc biệt thuộc đài WTN`, `Giáo sư Sherlock`, `khoa Khoa học Chính trị`, `Đại học Londinium`, `Loria`), đồng thời khóa tạm các thuật ngữ và danh xưng xuất hiện trong phần kết buổi phỏng vấn và trích đoạn sách giáo khoa lịch sử thiếu nhi của Liên bang (`phân tích tâm lý`, `cơn ảo tưởng tập thể`, `SÁCH GIÁO KHOA DÀNH CHO CÔNG DÂN NHỎ TUỔI: LỊCH SỬ NƯỚC TA`, `bác Josef`, `Đồng chí Loria`, `Đồng chí Iezhov`, `Sildberia`, `tắm rừng`, `rượu vang Georziya`, `thiên khải`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: wtn_closing_and_little_citizens_textbook_pronouns_and_address_vol04_ch01_b22
  proposed_vi: "Trong phần kết cuộc phỏng vấn truyền hình giữa phóng viên đặc biệt Andrew và Giáo sư Sherlock (chapter001_d/p000315–p000320): Giáo sư Sherlock dùng `chúng tôi` khi chỉ giới nghiên cứu đánh giá tài liệu giải mật (p000315); phóng viên Andrew gọi Giáo sư Sherlock là `ông` (p000316) và dùng `chúng ta` khi bao hàm người dẫn cùng khán giả/khách mời (p000316, p000319). Trong trích đoạn sách giáo khoa thiếu nhi của Liên bang (chapter001_d/p000321–p000361): tiêu đề dùng `NƯỚC TA` (p000321); lãnh tụ Josef được gọi thân mật – tôn kính theo văn phong tuyên truyền thiếu nhi Xô viết là `bác Josef` và quy chiếu ngôi thứ ba bằng `bác` xuyên suốt (p000322–p000324, p000326, p000328, p000329, p000332, p000334, p000339, p000350–p000354, p000359–p000361); Loria được gọi là `Đồng chí Loria`, quy chiếu ngôi thứ ba bằng `đồng chí` (p000329–p000343, p000350, p000352–p000354, p000356–p000359) và dùng `mình` ở mệnh đề tự quy chiếu nội tâm gián tiếp (p000358); khi quy chiếu chung cả Josef và Loria dùng `Hai người` / `cả hai người họ` / `họ` / `cả hai` (p000353, p000361)"
  alternatives_vi:
  - ông Josef và ông / ông ấy (thay cho `bác Josef` và đại từ `bác` tại chapter001_d/p000322–p000361 — ưu tiên `bác Josef` và `bác` vì truyền tải chuẩn xác giọng điệu tuyên truyền sùng bái lãnh tụ vừa gần gũi vừa tôn kính trong sách giáo khoa dành cho các công dân nhỏ tuổi của chế độ Cộng sản, đồng thời tạo hiệu ứng châm biếm đen tối sắc nét khi đặt cạnh nội dung thanh trừng và đày ải đi đếm cây ở Sildberia)
