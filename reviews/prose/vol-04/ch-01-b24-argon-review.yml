  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, nhân vật và thuật ngữ chính trị – quân sự – tôn giáo đã khóa tạm từ Tập 1–3 cùng B01–B23 của Tập 4 (`rượu vang Georziya`, `thanh trừng`, `Josef`, `Loria`, `Kinh Thánh`, `pháp sư`, `Cộng sản`, `Dzhugashvili`, `Thượng đế`, `Đế quốc`, `Liên bang`, `Lục quân Đế quốc`), đồng thời khóa tạm các thuật ngữ thần học, an ninh nội bộ và chính sách kinh tế – xã hội xuất hiện trong phân cảnh cơn ác mộng của Josef và quyết định tổng động viên tại Moskva năm 1926 (`những phần tử bất đồng chính kiến`, `người đứng đầu bộ phận an ninh`, `bộ phận an ninh`, `kẻ bội giáo`, `sứ đồ`, `lũ man rợ phương đông`, `sự *oán hận*`, `chính sách tập thể hóa`, `cỗ máy chiến tranh`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: moskva_1926_josef_revelation_and_subordinate_pronouns_vol04_ch01_b24
  proposed_vi: "Trong phân cảnh trần thuật và độc thoại nội tâm của Josef tại Moskva năm 1926 (chapter001_d/p000407–p000451): tiếp nối B23, trần thuật ngôi thứ ba quy chiếu Josef bằng `Ông ta` / `ông ta` xuyên suốt (p000407–p000410, p000412–p000414, p000417, p000420–p000422, p000424, p000426, p000427, p000430, p000432, p000434, p000436, p000437, p000440, p000444, p000449, p000450), dùng `mình` ở các mệnh đề phụ thuộc phản thân (p000408, p000410, p000424, p000430, p000434, p000436, p000437, p000450) và định danh bằng tên riêng `Josef` (p000413, p000418, p000442, p000447, p000451); trong độc thoại nội tâm trực tiếp (p000416, p000434, p000446, p000447), Josef tự quy chiếu ngôi thứ nhất bằng `mình`, và khi tự nhủ về Thượng đế ở p000430 dùng đại từ `ngài` (viết thường theo quy ước tại `pending-terms.yml`). Trong lời phán truyền siêu nhiên qua giấc mơ và ống nghe (p000423, p000425): giọng nói tự xưng `ta`, gọi phe Cộng sản và Josef là `các ngươi` / `lũ chó săn Cộng sản` / `Dzhugashvili, kẻ bội giáo kia` / `ngươi`. Trong lời nói của Josef và đối thoại với thuộc cấp (p000435, p000438–p000443): Josef tự xưng `ta` khi quát đáp lại giọng nói trong ảo giác (p000435) cũng như khi nói với cấp dưới (p000439, p000443), gọi cấp dưới là `ngươi`, trần thuật quy chiếu cấp dưới bằng `tên cấp dưới` / `gã` (p000440, p000441), còn cấp dưới gọi Josef là `Thưa ngài` (p000438)"
  alternatives_vi:
  - tôi – đồng chí (thay cho `ta` – `ngươi` khi Josef nói với tên cấp dưới tại chapter001_d/p000439, p000443 — ưu tiên `ta` – `ngươi` kết hợp lời thưa `Thưa ngài` ở p000438 để khắc họa sắc nét thực chất quyền lực độc tài chuyên chế dựa trên nỗi sợ hãi bị tống đi biệt xứ ở p000441–p000442, đối lập hoàn toàn với lớp vỏ tuyên truyền `bác Josef` / `đồng chí` trong sách giáo khoa ở B22–B23)
