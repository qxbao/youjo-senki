  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ trần thuật `ông ta` và nội tâm tự quy chiếu `mình` của Josef (tiếp nối B23), đồng thời phân biệt sắc nét giọng phán truyền cổ kính uy nghiêm `ta` – `các ngươi` / `ngươi` của thực thể siêu nhiên với giọng bề trên lạnh lùng `ta` – `ngươi` của nhà độc tài trước thuộc cấp."
