  proposed_vi: "rượu vang Georziya, thanh trừng, các cuộc thanh trừng (chapter001_d/p000408, p000413, p000414, p000449) / Josef, Loria (chapter001_d/p000413, p000418, p000442, p000447, p000451) / Kinh Thánh (chapter001_d/p000417) / pháp sư (chapter001_d/p000420, p000449) / những phần tử bất đồng chính kiến, người đứng đầu bộ phận an ninh, bộ phận an ninh (chapter001_d/p000421, p000437) / lũ chó săn Cộng sản, Dzhugashvili, kẻ bội giáo, Thượng đế, sứ đồ, lũ man rợ phương đông (chapter001_d/p000425–p000429, p000433) / Đế quốc, Liên bang, Lục quân Đế quốc (chapter001_d/p000432, p000433, p000450) / sự *oán hận*, chính sách tập thể hóa (chapter001_d/p000449) / cỗ máy chiến tranh (chapter001_d/p000450)"
  alternatives_vi:
