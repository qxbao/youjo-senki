  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ trần thuật `ông ta` và nội tâm tự quy chiếu `mình` của Josef (tiếp nối B23), đồng thời phân biệt sắc nét giọng phán truyền cổ kính uy nghiêm `ta` – `các ngươi` / `ngươi` của thực thể siêu nhiên với giọng bề trên lạnh lùng `ta` – `ngươi` của nhà độc tài trước thuộc cấp."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000407
  locks:
  - "Giữ câu mở đầu `Ông ta vẫn luôn bị những giấc mơ giày vò.`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000408
  locks:
  - "Giữ đại từ `ông ta`, `mình`, danh xưng `ly rượu vang Georziya` và các cụm `đám quân nhân cấp cao chướng tai gai mắt`, `thanh trừng thành công`, `ngủ gật đi rồi giật mình choàng tỉnh`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000409
  locks:
  - "Giữ câu `Có kẻ nào đó vừa lên tiếng nói với ông ta.`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000410
  locks:
  - "Giữ đại từ `Ông ta`, `mình` và các cụm `vừa mang vẻ mời gọi lại vừa đầy quả quyết`, `một giọng nói hiền từ, thế nhưng vẫn gây kinh hãi cho người nghe`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000411
  locks:
  - "Giữ chuỗi âm thanh đứt quãng `“…là…tồn…vấn đề. …, …nghĩ…”` khớp với câu hoàn chỉnh ở p000423."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000412
  locks:
  - "Giữ đại từ `ông ta`, cụm `một lời kêu gọi nào đó` và câu nội tâm in nghiêng `*Giờ mà nói chuyện đó thì hơi muộn rồi đấy nhỉ?*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000413
  locks:
  - "Giữ đại từ `Ông ta`, thuật ngữ `các cuộc thanh trừng`, danh xưng `Josef` và cụm `Chút nhân tính cuối cùng còn sót lại trong con người Josef đã tan biến cùng cái chết của người vợ yêu dấu`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000414
  locks:
  - "Giữ đại từ `ông ta`, thuật ngữ `các cuộc thanh trừng` và các cụm `một mất một còn, không giết người thì người giết mình`, `bỏ mạng dưới lưỡi dao của một kẻ phản bội`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000415
  locks:
  - "Giữ chuỗi âm thanh đứt quãng `“…, sa…nghĩ…, …đơn giản.”` khớp với câu hoàn chỉnh ở p000423."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000416
  locks:
  - "Giữ câu hỏi nội tâm in nghiêng `*Nó đang bảo mình phải suy nghĩ lại mọi chuyện ư?*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000417
  locks:
  - "Giữ đại từ `Ông ta` / `ông ta`, danh xưng `Kinh Thánh` và cụm `chẳng thể cứu rỗi ông ta`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000418
  locks:
  - "Giữ các cụm `khai sáng cho đám người mê tín dị đoan`, `xóa sổ bọn họ` và các danh xưng `Loria`, `Josef`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000419
  locks:
  - "Giữ chuỗi âm thanh đứt quãng `“…s…giải…”` khớp với câu hoàn chỉnh ở p000425."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000420
  locks:
  - "Giữ đại từ `ông ta`, thuật ngữ `đám pháp sư` / `pháp sư` và các cụm `những kẻ mà ông ta có thể cắt cổ bất cứ lúc nào`, `để than hồng vương vãi khắp nơi`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000421
  locks:
  - "Giữ đại từ `ông ta` và các cụm `những phần tử bất đồng chính kiến`, `một sự can thiệp nào đó diễn ra nằm ngoài tầm hiểu biết`, `nhấc ống nghe để gọi cho người đứng đầu bộ phận an ninh`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000422
  locks:
  - "Giữ đại từ `ông ta` và các cụm `hối hận suốt phần đời còn lại vì đã nhấc chiếc ống nghe ấy lên`, `ngập tràn tiếng nhiễu sóng`, `vang lên rõ mồn một từ trong cỗ máy`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000423
  locks:
  - "Giữ đại từ `các ngươi` và toàn bộ lời phán truyền khớp với các mảnh đứt quãng tại p000411, p000415."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000424
  locks:
  - "Giữ đại từ `Ông ta` / `ông ta`, `mình` và các cụm `một nỗi sợ hãi lạnh sống lưng…`, `trái tim ông ta thắt lại`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000425
  locks:
  - "Giữ các danh xưng và đại từ phán truyền `lũ chó săn Cộng sản`, `ta`, `các ngươi`, `Dzhugashvili, kẻ bội giáo kia`, `Thượng đế`, `ngươi`, `sứ đồ`, `vị sứ đồ`, `lũ man rợ phương đông`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000426
  locks:
  - "Giữ câu `“Một sứ đồ ư?” ông ta bất giác vặn lại.`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000427
  locks:
  - "Giữ đại từ `Ông ta` / `ông ta`, danh xưng `Thượng đế`, `các sứ đồ` và cụm `vừa để cứu rỗi vừa để phán xét`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000428
  locks:
  - "Giữ câu nội tâm in nghiêng `*Thượng đế chỉ là sản phẩm của trí tưởng tượng.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000429
  locks:
  - "Giữ câu nội tâm in nghiêng `*Thượng đế không hề tồn tại.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000430
  locks:
  - "Giữ vế in nghiêng `*Tất nhiên là ngài không tồn tại rồi*` theo DEC-P01-002, cùng các đại từ `ông ta` và `mình`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000431
  locks:
  - "Giữ cụm in nghiêng `*…Phương tây.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000432
  locks:
  - "Giữ câu `Phải, phương tây. Ông ta không thể làm ngơ trước Đế quốc ở phương tây.`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000433
  locks:
  - "Giữ các danh xưng `Đế quốc`, `Thượng đế`, `Liên bang`, `Lục quân Đế quốc hùng mạnh khôn lường kia` và cụm `bị tấn công từ cả ba hướng mà lần nào cũng giành phần thắng`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000434
  locks:
  - "Giữ đúng hai cụm in nghiêng `*Mình không muốn nghĩ tới chuyện đó, nhưng nhỡ đâu…*` và `*Kẻ nào bày ra trò này? Đây ắt hẳn là tác phẩm của lũ bất lương kia.*` theo DEC-P01-002, cùng đại từ `ông ta` / `mình` ở câu trần thuật xen giữa."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000435
  locks:
  - "Giữ đại từ `ta` và câu thoại `“Ha, ta không mắc bẫy đâu. Đừng có đem cái trò nhảm nhí vớ vẩn này ra dọa ta.”`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000436
  locks:
  - "Giữ đại từ `Ông ta`, `mình` và các cụm `dập mạnh ống nghe xuống`, `rơi vào trạng thái ngơ ngác`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000437
  locks:
  - "Giữ đại từ `Ông ta` / `ông ta`, `mình` và các cụm `đánh rơi ly rượu vang`, `chạm vào ống nghe để gọi bộ phận an ninh`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000438
  locks:
  - "Giữ câu thoại `“Thưa ngài? Có tiếng động gì thế ạ?!”`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000439
  locks:
  - "Giữ câu thoại `“À, không có gì. Ta chỉ lỡ tay làm rơi cái ly thôi.”`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000440
  locks:
  - "Giữ đại từ `Ông ta`, cụm `tên cấp dưới` và phần in nghiêng sau dấu gạch ngang dài `—*Đừng bận tâm đến chuyện đó*.` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000441
  locks:
  - "Giữ các cụm `nỗi sợ hãi bị tống đi biệt xứ`, `Phản xạ đã thành thói quen này` và đại từ `gã`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000442
  locks:
  - "Giữ danh xưng `Josef` và cụm `chìa khóa để kiểm soát con người chính là nỗi sợ hãi này`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000443
  locks:
  - "Giữ câu thoại `“Phiền ngươi dọn sạch chỗ này giúp ta.”`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000444
  locks:
  - "Giữ đại từ `ông ta` và cụm `giữ thể diện trong tình huống này`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000445
  locks:
  - "Giữ các cụm `suốt nhiều đêm liền`, `người đàn ông có thần kinh thép này` và `khuất phục trước những cơn ác mộng`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000446
  locks:
  - "Giữ câu nội tâm in nghiêng `*Mình phải loại bỏ nó.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000447
  locks:
  - "Giữ câu in nghiêng `*Mình nhất định phải loại bỏ nó.*` theo DEC-P01-002, danh xưng `Josef` và cụm `không thể dung thứ cho các mối đe dọa từ bên ngoài thêm một khắc nào nữa`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000448
  locks:
  - "Giữ câu chuyển đoạn `Chính vì thế…`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000449
  locks:
  - "Giữ các cụm `thiếu hụt sĩ quan do các cuộc thanh trừng`, `sự *oán hận* của nông dân bắt nguồn từ chính sách tập thể hóa` (với từ `*oán hận*` in nghiêng theo DEC-P01-002), `thanh trừng các pháp sư`, đại từ `ông ta` và `buộc phải huy động quân đội`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000450
  locks:
  - "Giữ đại từ `Ông ta`, `mình` và cụm `lao đội quân còn khiếm khuyết của mình vào cỗ máy chiến tranh mang tên Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000451
  locks:
  - "Giữ câu kết chương `Tất nhiên, ở đất nước của Josef, lính tráng mọc trên cây.`."
