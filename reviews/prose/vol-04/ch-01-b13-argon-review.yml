  proposed_vi: "tiểu đoàn tăng cường, toán làm nhiệm vụ trinh sát (chapter001_b/p000375) / Lục quân Đế quốc (chapter001_b/p000376) / Lục quân Liên bang, quy trình tiêu chuẩn dành cho trinh sát ban đêm, toán trinh sát (chapter001_b/p000377, p000378) / Serebryakov, Liên bang (chapter001_b/p000379, p000397, p000403, p000404) / tuần tra cấp sĩ quan (chapter001_b/p000381) / Weiss, Tiểu đoàn Pháp sư Trên không số 203, mặt trận phía nam (chapter001_b/p000382, p000385, p000399) / Trung đội 437 (chapter001_b/p000388) / sư đoàn thiết giáp, pháo đường sắt, vị trí tiền tiêu (chapter001_b/p000391–p000394, p000398) / Thiếu tá, Grantz (chapter001_b/p000395, p000396) / đòn gió (chapter001_b/p000397) / im lặng vô tuyến, Đế quốc (chapter001_b/p000398) / máy truyền tin mã hóa tầm xa, bộ điện đài vô tuyến, sổ mã dùng một lần (chapter001_b/p000399, p000400) / tấn công phủ đầu, lũ Cộng sản (chapter001_b/p000403, p000407)"
  alternatives_vi:
  - tuần tra sĩ quan (thay cho `tuần tra cấp sĩ quan` tại chapter001_b/p000381 — ưu tiên `tuần tra cấp sĩ quan` vì làm rõ thành phần đội trinh sát chỉ gồm các sĩ quan chỉ huy thay vì binh sĩ thông thường) / sư đoàn xe tăng (thay cho `sư đoàn thiết giáp` tại chapter001_b/p000391 — ưu tiên `sư đoàn thiết giáp` vì trang trọng và chuẩn thuật ngữ biên chế quân sự cấp sư đoàn) / máy báo hiệu mã hóa tầm xa (thay cho `máy truyền tin mã hóa tầm xa` tại chapter001_b/p000399 — ưu tiên `máy truyền tin mã hóa tầm xa` vì mô tả đúng chức năng thiết bị mã hóa tín hiệu đấu nối vào bộ điện đài vô tuyến để gửi báo cáo về hậu phương)
