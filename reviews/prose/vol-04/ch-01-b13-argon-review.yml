  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, quốc gia, nhân vật và vũ khí – khí tài đã khóa tạm từ Tập 1–3 cùng B01–B12 của Tập 4 (`tiểu đoàn tăng cường`, `Lục quân Đế quốc`, `Lục quân Liên bang`, `Liên bang`, `Đế quốc`, `Serebryakov`, `Weiss`, `Grantz`, `Thiếu tá`, `Tiểu đoàn Pháp sư Trên không số 203`, `mặt trận phía nam`, `Trung đội 437`, `pháo đường sắt`, `đòn gió`, `sổ mã dùng một lần`, `tấn công phủ đầu`, `lũ Cộng sản`), đồng thời khóa tạm các thuật ngữ trinh sát ban đêm và thông tin liên lạc trong batch (`trinh sát ban đêm`, `tuần tra cấp sĩ quan`, `sư đoàn thiết giáp`, `im lặng vô tuyến`, `máy truyền tin mã hóa tầm xa`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_grantz_officers_patrol_pronouns_and_address_vol04_ch01_b13
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000374, p000376, p000379, p000380, p000389, p000396), giữ nguyên tên riêng `Tanya` (chapter001_b/p000374, p000379, p000383, p000385, p000396) và quy chiếu Đại úy Weiss trong trần thuật bằng `anh` (chapter001_b/p000382); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000374, p000390, p000394, p000407), ngôi thứ nhất số nhiều chỉ tập thể đơn vị / phía Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (chapter001_b/p000400–p000407), và quy chiếu Đại úy Weiss trong độc thoại nội tâm bằng `anh ấy` (chapter001_b/p000400); trong đối thoại giữa Tanya, Weiss và Grantz: Weiss xin lỗi, hỏi và nhận lệnh từ Tanya xưng `tôi` / `chúng ta`, đáp `Rõ. Tôi sẽ làm ngay.` và kèm tiểu từ lễ phép `ạ` ở câu xin lỗi / câu hỏi (chapter001_b/p000373, p000378, p000381, p000399); Tanya trao đổi với Weiss và hạ lệnh cho nhóm sĩ quan xưng `tôi` / `chúng ta`, gọi Weiss là `anh` và gọi nhóm sĩ quan đi cùng là `các vị` (chapter001_b/p000374, p000377, p000379, p000384, p000388, p000398); Grantz khẽ báo hiệu cho Tanya gọi `Thiếu tá` (chapter001_b/p000395)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya về tình thế tiến thoái lưỡng nan trên lãnh thổ Liên bang tại chapter001_b/p000400–p000407 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B12) / các anh (thay cho `các vị` khi Tanya gọi nhóm sĩ quan tại chapter001_b/p000384 — ưu tiên `các vị` vì bao hàm cả nữ sĩ quan Trung úy Serebryakov trong đội tuần tra cấp sĩ quan)
