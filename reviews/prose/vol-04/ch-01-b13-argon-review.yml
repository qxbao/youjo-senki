- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000376
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và danh xưng `Lục quân Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000377
  locks:
  - "Giữ đại từ `Chúng ta` / `tôi`, danh xưng `Lục quân Liên bang` và cụm `quy trình tiêu chuẩn dành cho trinh sát ban đêm`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000378
  locks:
  - "Giữ cụm `toán trinh sát` và tiểu từ lễ phép `ạ` trong câu hỏi của Weiss."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000379
  locks:
  - "Giữ cặp đại từ `Tôi` – `anh` trong lời thoại, tên `Serebryakov`, `Tanya`, danh xưng `Liên bang` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000380
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 xuyên suốt đoạn suy xét trách nhiệm chỉ huy."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000381
  locks:
  - "Giữ đại từ `chúng ta` / `Chúng ta` và cụm thuật ngữ `tuần tra cấp sĩ quan`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000382
  locks:
  - "Giữ tên `Weiss`, đại từ trần thuật `anh`, danh xưng `Tiểu đoàn Pháp sư Trên không số 203` và cụm `mặt trận phía nam`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000383
  locks:
  - "Giữ tên `Tanya` và quyết định dẫn các sĩ quan đi trinh sát."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000384
  locks:
  - "Giữ cách gọi `các vị` dành cho nhóm sĩ quan đi cùng."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000385
  locks:
  - "Giữ tên `Tanya`, danh xưng `Tiểu đoàn Pháp sư Trên không số 203` và chi tiết tiếp cận bằng đường bộ không dùng ma pháp."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000386
  locks:
  - "Giữ mạch trần thuật chuyển tiếp sang cảnh quan sát."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000387
  locks:
  - "Giữ các từ ngữ `ống nhòm`, `quân nhu`, `đạn thật` và `cuộc tập trận`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000388
  locks:
  - "Giữ danh xưng `Trung đội 437` đồng bộ với B07–B11 và đại từ `chúng ta`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000389
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và chi tiết các doanh trại hoạt động tấp nập sau khi mặt trời lặn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000390
  locks:
  - "Giữ cụm chuyển ý in nghiêng ở đầu đoạn `*Chưa dừng lại ở đó*` theo DEC-P01-002 và đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000391
  locks:
  - "Giữ các cụm thuật ngữ `sư đoàn thiết giáp`, `pháo đường sắt` và `vị trí tiền tiêu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000392
  locks:
  - "Giữ cụm `pháo đường sắt` và nhận định về hành động tương đương lời tuyên chiến."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000393
  locks:
  - "Giữ cụm `pháo đường sắt` và chi tiết các nòng pháo đang chầm chậm điều chỉnh để chuẩn bị cho một cuộc tiến công."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000394
  locks:
  - "Giữ cụm `Nòng pháo đường sắt` và đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000395
  locks:
  - "Giữ cách gọi `Thiếu tá` trong câu báo hiệu của Grantz."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000396
  locks:
  - "Giữ tên riêng `Tanya`, `Grantz` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000397
  locks:
  - "Giữ cụm `đòn gió` đồng bộ với B12 và danh xưng `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000398
  locks:
  - "Giữ các cụm thuật ngữ `im lặng vô tuyến`, `pháo đường sắt` và danh xưng `Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000399
  locks:
  - "Giữ lời đáp `Rõ. Tôi sẽ làm ngay.`, tên `Weiss` và các cụm thuật ngữ `máy truyền tin mã hóa tầm xa`, `bộ điện đài vô tuyến`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000400
  locks:
  - "Giữ đại từ `Anh ấy` quy chiếu Weiss trong độc thoại nội tâm của Tanya, thuật ngữ `sổ mã dùng một lần` đồng bộ với Tập 2 và đại từ tập thể `chúng tôi`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000401
  locks:
  - "Giữ đại từ tập thể `chúng tôi` trong độc thoại nội tâm của Tanya."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000402
  locks:
  - "Giữ đại từ tập thể `chúng tôi` và nhận định về việc chưa chính thức bước vào tình trạng chiến tranh."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000403
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, thuật ngữ `tấn công phủ đầu` đồng bộ với B11 và cụm `lực lượng Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000404
  locks:
  - "Giữ đại từ tập thể `chúng tôi` và cụm `lãnh thổ Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000405
  locks:
  - "Giữ đại từ tập thể `chúng tôi` và mệnh đề nghi vấn in nghiêng ở cuối đoạn `*ngay từ đầu chúng tôi đã làm cái quái gì ở đó*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000406
  locks:
  - "Giữ đại từ tập thể `chúng tôi` và cụm `cách hành xử chuẩn mực về mặt chính trị`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000407
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, đại từ tập thể `chúng tôi` và cụm `lũ Cộng sản` đồng bộ với B11."
