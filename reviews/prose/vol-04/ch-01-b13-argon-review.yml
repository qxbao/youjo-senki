  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Thiếu tá Tanya von Degurechaff, Đại úy Weiss và các sĩ quan trong cuộc tuần tra trinh sát ban đêm."
