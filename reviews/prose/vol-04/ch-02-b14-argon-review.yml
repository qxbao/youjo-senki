  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ sự phân biệt rõ ràng giữa trần thuật ngôi thứ ba trang trọng (`Ông` / `ông`, `họ`), độc thoại nội tâm (`chúng ta` khi phản ánh suy nghĩ chung của giới lãnh đạo Khối Thịnh vượng chung, `Ông ấy` – `mình` khi tự nhủ nắm lấy gợi ý của đồng cấp), chủ ngữ khái quát (`người ta`) và lời thoại chính trường – quân sự (`tôi`, `chúng ta` / `Chúng ta`)."
