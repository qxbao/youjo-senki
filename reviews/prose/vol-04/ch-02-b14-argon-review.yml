  proposed_vi: "vùng đệm chiến lược, kênh đào, các thuộc địa, tàn quân của Cộng hòa, Cộng hòa (chapter001_h/p000061, p000062) / vị bộ trưởng tài chính (chapter001_h/p000064, p000076) / Lục quân Đế quốc, tiểu đoàn pháp sư, bên lục quân (chapter001_h/p000067, p000068, p000081) / đơn vị huấn luyện, Xưởng Vũ khí Kỹ thuật, tiểu đoàn tân binh bổ sung, đám tân binh (chapter001_h/p000070, p000072, p000073) / sức chiến đấu, Vị Đệ nhất Lãnh chúa Hải quân (chapter001_h/p000071) / bên Tình báo, tiền tuyến, cựu binh (chapter001_h/p000073, p000085) / cuộc tập kích bất ngờ, tập kích bất ngờ, Đế quốc, Liên bang (chapter001_h/p000075, p000076, p000080, p000081, p000087) / quan chức dân sự (chapter001_h/p000078) / Trận chiến sông Rhine, các tuyến cảnh giới phòng không, mặt trận Rhine, màn chắn đánh chặn, các vị trí phòng ngự, Các màn chắn cảnh giới, các tuyến cảnh giới, Tướng Habergram (chapter001_h/p000079–p000083) / cuộc tấn công quấy rối, hải quân, các pháp sư thủy quân lục chiến, hạm đội, ưu thế trên không, lãnh thổ địch (chapter001_h/p000083–p000085) / quân chủng, Khối Thịnh vượng chung, cuộc phản công (chapter001_h/p000086, p000087)"
  alternatives_vi:
