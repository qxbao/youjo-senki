  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, chức danh, đơn vị và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B13 Chương 2 của Tập 4 (`vùng đệm chiến lược`, `kênh đào`, `thuộc địa`, `tàn quân`, `Cộng hòa`, `vị bộ trưởng tài chính`, `Lục quân Đế quốc`, `tiểu đoàn pháp sư`, `bên lục quân`, `đơn vị huấn luyện`, `Xưởng Vũ khí Kỹ thuật`, `sức chiến đấu`, `Vị Đệ nhất Lãnh chúa Hải quân`, `bên Tình báo`, `tiền tuyến`, `cuộc tập kích bất ngờ` / `tập kích bất ngờ`, `Đế quốc`, `Liên bang`, `Trận chiến sông Rhine`, `mặt trận Rhine`, `tuyến cảnh giới`, `vị trí phòng ngự`, `Tướng Habergram`, `pháp sư thủy quân lục chiến`, `hạm đội`, `ưu thế trên không`, `lãnh thổ địch`, `Khối Thịnh vượng chung`), đồng thời khóa tạm các tổ hợp thuật ngữ quân sự trong phần thảo luận về khả năng tập kích ngược thủ đô Đế quốc (`tiểu đoàn tân binh bổ sung`, `các tuyến cảnh giới phòng không`, `màn chắn đánh chặn`, `Các màn chắn cảnh giới`, `cuộc tấn công quấy rối`, `quân chủng`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: londinium_imperial_capital_counterraid_debate_pronouns_vol04_ch02_b14
  proposed_vi: "Trong phần tiếp theo của cuộc họp nội các và chỉ huy quân sự Khối Thịnh vượng chung tại Londinium bàn về việc duy trì tàn quân Cộng hòa làm vùng đệm và đánh giá tính khả thi của phương án tập kích ngược vào thủ đô Đế quốc (chapter001_h/p000061–p000087): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-02-b12` – `b13`: trần thuật ngôi thứ ba quy chiếu vị bộ trưởng tài chính, người hưởng ứng đề xuất, vị Đệ nhất Lãnh chúa Hải quân và Tướng Habergram bằng đại từ trang trọng `Ông` / `ông` (p000064, p000066) kết hợp các chức danh xác định (`vị bộ trưởng tài chính`, `Vị Đệ nhất Lãnh chúa Hải quân`, `Tướng Habergram`) tại p000064, p000071, p000076, p000082; quy chiếu tập thể bộ tham mưu hải quân / giới hoạch định của Khối Thịnh vượng chung, bên lục quân và các quan chức dự họp bằng `họ` (p000061, p000068, p000071, p000083, p000085, p000087), và quy chiếu phía Đế quốc / các thành viên đơn vị huấn luyện của Đế quốc bằng `họ` (p000067, p000071, p000073, p000074, p000079, p000081, p000082) kết hợp đại từ phản thân `mình` (p000081, p000082, p000087); trong độc thoại nội tâm trực tiếp, câu suy nghĩ chung của phía Khối Thịnh vượng chung về quan hệ với Cộng hòa tại p000062 dùng `chúng ta`, còn câu suy nghĩ cá nhân của người hưởng ứng gợi ý từ vị bộ trưởng tài chính tại p000066 tự quy chiếu ngôi thứ nhất bằng `mình` và quy chiếu vị bộ trưởng tài chính bằng `Ông ấy`; dùng chủ ngữ khái quát `người ta` và cấu trúc vô nhân xưng `Có thể nói` cho đại từ ngôi thứ hai phiếm chỉ tại p000080, p000087. Trong đối thoại tại cuộc họp (p000063, p000065, p000067, p000069, p000070, p000072, p000075, p000079, p000086): các thành viên tham dự cuộc họp tự xưng `tôi` (`Cá nhân tôi` ở p000065) và dùng `chúng ta` / `Chúng ta` khi bàn về hành động, năng lực tác chiến và kết luận chung của Khối Thịnh vượng chung"
  alternatives_vi:
  - ông ta (thay cho `Ông ấy` khi người tiếp lời nghĩ về vị bộ trưởng tài chính trong độc thoại nội tâm tại chapter001_h/p000066 — ưu tiên `Ông ấy` vì người tiếp lời đang cảm kích việc vị bộ trưởng tài chính tung ra chiếc phao cứu sinh đổi chủ đề đúng lúc, khác với sắc thái đánh giá bề trên của vị thủ tướng ở B13) / bạn (thay cho chủ ngữ khái quát `người ta` và cấu trúc vô nhân xưng tại chapter001_h/p000080, p000087 — ưu tiên `người ta` và `Có thể nói` để giữ giọng trần thuật quân sự – chính trị khách quan, đĩnh đạc)
