    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000217"
    terms: []
    pronouns_and_pov: "Andrew kể tiếp giai thoại: gọi Salamander là 'nó'."
    modality_and_negation: "Phủ định 'chẳng có ai dạy cho nó biết phân biệt phải trái đúng sai'."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000218"
    terms:
      - "Salamander"
    pronouns_and_pov: "Andrew kể tiếp giai thoại: gọi Salamander là 'nó'."
    modality_and_negation: "Quan hệ nhân quả ('Thế nên') kết hợp phủ định ('chẳng bao giờ nhận ra') dẫn tới kết cục làm cạn sạch sự kiên nhẫn của mọi người."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000219"
    terms: []
    pronouns_and_pov: "Ngôi thứ nhất của Andrew: xưng 'tôi'."
    modality_and_negation: "Lời rào đón chuyển ý kèm câu cảm thán bỏ lửng."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000220"
    terms:
      - "Salamander"
      - "chó chăn cừu Đức"
    pronouns_and_pov: "Andrew kể tiếp giai thoại: gọi Salamander là 'nó'."
    modality_and_negation: "Nhận định ngoại hình và sức mạnh của Salamander qua phép so sánh với chó chăn cừu Đức."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000221"
    terms: []
    pronouns_and_pov: "Trần thuật giai thoại kết hợp câu hỏi nội tâm tập thể dùng 'Chúng ta'."
    modality_and_negation: "Câu hỏi băn khoăn về cách xử lý."
    markdown_emphasis: "*Chúng ta phải làm gì đây?* (khớp thẻ <em> trong nguồn theo DEC-P01-002)"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000222"
    terms: []
    pronouns_and_pov: "Lời bình của Andrew."
    modality_and_negation: "Khẳng định tính dị bản của đoạn kết tùy theo người kể."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000223"
    terms: []
    pronouns_and_pov: "Lời dẫn của Andrew, dùng phản thân 'mình' cho các bậc phụ huynh."
    modality_and_negation: "Mệnh đề chỉ khả năng ứng dụng câu chuyện để răn dạy con cái."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000224"
    terms:
      - "Tom"
      - "Salamander"
    pronouns_and_pov: "Thoại giả định của phụ huynh nói với con: gọi 'Tom', 'con'."
    modality_and_negation: "Câu hỏi phủ định tu từ mang tính nhắc nhở ('chẳng phải con đang hơi giống Salamander đấy sao?')."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000225"
    terms:
      - "Salamander"
      - "hậu phương"
    pronouns_and_pov: "Ngôi thứ nhất của Andrew: xưng 'tôi', gọi người cựu binh là 'ông ấy', những người lính là 'họ', lũ trẻ là 'chúng'."
    modality_and_negation: "Tiết lộ bản chất hình tượng Salamander chính là con cái bị chiều hư khi người lính để lại nơi hậu phương."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000226"
    terms: []
    pronouns_and_pov: "Lời bình của Andrew."
    modality_and_negation: "Tình thái suy đoán chắc chắn ('hẳn là... chỉ là... mà thôi') về nỗi lo chung của cha mẹ trên thế giới."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000227"
    terms: []
    pronouns_and_pov: "Andrew nhắn nhủ khán giả: xưng 'tôi', gọi 'quý vị'."
    modality_and_negation: "Đúc kết bài học đạo đức bằng câu mệnh lệnh phủ định và lời nhắn khán giả hứa không chiều hư con."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000228"
    terms: []
    pronouns_and_pov: "Lời dẫn của Andrew."
    modality_and_negation: "Câu hỏi chuyển mạch tìm hiểu nguồn gốc truyền thuyết."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000229"
    terms:
      - "chiến trường"
    pronouns_and_pov: "Andrew nói với khán giả: gọi 'quý vị'."
    modality_and_negation: "Tình thái khả năng ('Có thể quý vị sẽ ngạc nhiên') khi tiết lộ nguồn gốc từ chiến trường."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000230"
    terms:
      - "Đại chiến"
    pronouns_and_pov: "Lời dẫn của Andrew: gọi câu chuyện là 'nó'."
    modality_and_negation: "Giới thiệu bối cảnh lan truyền trong thời kỳ Đại chiến kèm câu hỏi về nội dung thực sự."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000231"
    terms:
      - "tiền tuyến"
    pronouns_and_pov: "Lời giải thích của Andrew: gọi những người lính là 'họ', con cái là 'chúng'."
    modality_and_negation: "Tình thái dè dặt ('xem chừng') và quan hệ nhân quả từ việc không thể gặp con dẫn tới gửi quá nhiều quà cáp làm hư con."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000232"
    terms:
      - "Salamander"
      - "Giáng sinh"
    pronouns_and_pov: "Lời dẫn của Andrew: dùng 'họ', phản thân 'mình' cho những người lính, và 'chúng ta' bao gộp khán giả."
    modality_and_negation: "Chuỗi nhân quả khi chiến tranh kết thúc và người lính trở về, tạo nên giai thoại mắng mỏ đám nhóc Salamander vào dịp Giáng sinh đầu tiên."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000233"
    terms: []
    pronouns_and_pov: "Andrew kết chương trình: phân biệt rõ 'chúng ta' (cùng khán giả), 'Tôi', 'quý vị' và 'chúng tôi' (nhóm sản xuất)."
    modality_and_negation: "Tổng kết nội dung phát sóng và bày tỏ hy vọng khán giả đón nhận hướng tiếp cận mới mẻ."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000234"
    terms: []
    pronouns_and_pov: "Lời chào kết của Andrew gửi tới 'quý vị'."
    modality_and_negation: "Câu chúc xã giao cuối bản tin."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000235"
    terms:
      - "NĂM THỐNG NHẤT 1926"
      - "TÒA NHÀ CHÍNH CỦA BỘ TỔNG THAM MƯU"
    pronouns_and_pov: "Tiêu đề mốc thời gian và địa điểm chuyển cảnh."
    modality_and_negation: "Giữ nguyên định dạng in hoa của tiêu đề phân đoạn."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000236"
    terms:
      - "cơ sở điều dưỡng của Bộ Tổng tham mưu"
      - "Tanya"
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'Tanya' và đại từ 'nó' theo DEC-P01-001."
    modality_and_negation: "Mô tả việc Tanya chuyển về văn phòng mới tại thủ đô và đối mặt với xấp tài liệu cho thấy tình hình trái ý."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000237"
    terms:
      - "Trung tướng von Zettour"
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'Nó' / 'nó' cho Tanya theo DEC-P01-001."
    modality_and_negation: "Tương phản giữa nỗi sợ câu nói của Zettour về đám lính mới và việc tạm thời trốn chạy nỗi sợ bằng cách tập trung giải quyết thủ tục thành lập đơn vị."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000238"
    terms: []
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'nó' cho Tanya."
    modality_and_negation: "Khẳng định thời khắc buộc phải đối mặt với nỗi sợ đã điểm."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000239"
    terms:
      - "Trung úy Grantz"
      - "Bộ Tổng tham mưu"
      - "Cục Quân vụ"
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'nó' cho Tanya, 'anh ta' cho Grantz."
    modality_and_negation: "Mô tả việc Grantz mang phong bì từ Cục Quân vụ tới và Tanya nhận ra tài liệu đã báo trước đã đến."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000240"
    terms:
      - "Tanya"
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'Tanya' và 'nó' theo DEC-P01-001."
    modality_and_negation: "Mô tả sự sụp đổ của mọi quyết tâm chuẩn bị từ trước khi Tanya mở phong bì."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000241"
    terms: []
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'nó' và phản thân 'mình' cho Tanya theo DEC-P01-001."
    modality_and_negation: "Phép so sánh ánh nhìn của Tanya hướng vào bản danh sách như nhìn kẻ thù không đội trời chung."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000242"
    terms:
      - "Grantz"
      - "Bộ Tổng tham mưu"
      - "Tanya"
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'Tanya', 'nó' và 'họ' (Bộ Tổng tham mưu)."
    modality_and_negation: "Giải thích nội dung tài liệu là danh sách đơn vị và nhân sự có thể cấp cho Tanya mà chính nó đã yêu cầu."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000243"
    terms:
      - "Zettour"
    pronouns_and_pov: "Trần thuật ngôi thứ ba pha độc thoại nội tâm gián tiếp: dùng 'nó' và phản thân 'mình' theo DEC-P01-001."
    modality_and_negation: "Đính chính nhận thức: từ chỗ tưởng đã chuẩn bị tâm lý đón nhận đợt phân bổ quân tệ hại sang nhận ra mình mới chỉ tưởng là đã chuẩn bị."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000244"
    terms: []
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'nó' cho Tanya."
    modality_and_negation: "Đối lập giữa sự chuẩn bị tâm lý trước đó và thực tế khi nhìn vào tài liệu khiến mọi sự chuẩn bị tan biến."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000245"
    terms:
      - "tiểu đoàn bộ binh dự bị hạng hai"
      - "đại đội pháo binh bổ sung"
    pronouns_and_pov: "Thoại lẩm bẩm của Tanya (dùng 'chúng ta', 'họ'), câu hỏi nội tâm trực tiếp (dùng 'Mình') và trần thuật ngôi thứ ba (dùng 'nó' / 'Nó') theo DEC-P01-001."
    modality_and_negation: "Câu hỏi bàng hoàng về thành phần đơn vị được cấp, kèm câu hỏi nội tâm nghi ngờ thị giác và phủ định việc chữ trên giấy thay đổi."
    markdown_emphasis: "*Mình có đọc nhầm không đấy?* (khớp thẻ <em> trong nguồn theo DEC-P01-002)"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000246"
    terms:
      - "Grantz"
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'Nó' / 'nó' và phản thân 'mình' cho Tanya."
