findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000184"
    severity: "minor"
    category: "style_and_collocation"
    issue: "Ở câu thứ ba ('Hãy làm bất cứ giá nào để chiếm giữ một bãi đáp và yểm trợ họ!'), cụm 'Hãy làm bất cứ giá nào' bị chập cấu trúc giữa 'Hãy làm mọi cách / bất cứ điều gì cần thiết' và 'Bằng bất cứ giá nào'."
    rationale: "Theo canon/style-guide.md, cần ưu tiên kết hợp từ tiếng Việt tự nhiên, chuẩn xác trong mệnh lệnh tác chiến."
    suggestion: "Đổi 'Hãy làm bất cứ giá nào' thành 'Hãy làm mọi cách' (hoặc 'Bằng bất cứ giá nào cũng phải'): 'Hãy làm mọi cách để chiếm giữ một bãi đáp và yểm trợ họ!'"
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000209"
    severity: "minor"
    category: "modality_and_tense"
    issue: "Câu trần thuật ('Và ngay chính Trung tá Drake, khi gọi cho Tiểu đoàn Yankee, cũng sẵn lòng thừa nhận rằng đúng là như vậy thật.') lược mất tình thái giả định nối tiếp câu p000207, khiến câu văn đọc như một hành động thừa nhận đã diễn ra trong thực tế thay vì điều ông sẵn lòng thừa nhận trong giả định."
    rationale: "Theo canon/style-guide.md và checkpoints của handoff, cần giữ đồng thời tính giả định, mức chắc chắn và thời gian của giả định."
    suggestion: "Bổ sung tình thái từ giả định 'hẳn cũng sẽ' (hoặc 'cũng hẳn đã'): 'Và ngay chính Trung tá Drake, khi gọi cho Tiểu đoàn Yankee, hẳn cũng sẽ sẵn lòng thừa nhận rằng đúng là như vậy thật.'"
