findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000328"
    severity: "minor"
    category: "terminology"
    issue: "Thuật ngữ chỉ tín hiệu nhận diện của pháp sư trong nguồn được dịch bổ sung thành 'tín hiệu ma thuật', dùng từ 'ma thuật' chưa đồng nhất với hệ thuật ngữ 'ma pháp' đang áp dụng xuyên suốt vol-04."
    recommendation: "Đổi 'tín hiệu ma thuật' thành 'tín hiệu ma pháp' (hoặc giữ ngắn gọn là 'tín hiệu' sát với nguyên văn)."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000341"
    severity: "minor"
    category: "terminology_consistency"
    issue: "Thuật ngữ lóng quân sự 'the package' (chỉ mục tiêu cần giải cứu trong nhiệm vụ CSAR) đã được ghi nhận trong pending-terms-index.yml của vol-04 với phương án đề xuất 'gói hàng', nhưng tại đây đang dịch là 'kiện hàng'."
    recommendation: "Cân nhắc đồng bộ 'kiện hàng' thành 'gói hàng' ở cả hai câu trong đoạn để thống nhất với sổ thuật ngữ pending của chương, hoặc giữ nhất quán một lựa chọn trong toàn chương."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000368"
    severity: "minor"
    category: "tone_and_register"
    issue: "Lời cầu nguyện xen lẫn tiếng kêu tuyệt vọng và căm uất hướng tới Thượng đế lại thêm tiểu từ lễ phép 'ạ' ở cuối câu ('tại sao vậy ạ…?'), tạo sắc thái giao tiếp đời thường trẻ con, làm giảm tính trang trọng và bi phẫn của lời khấn."
    recommendation: "Bỏ tiểu từ 'ạ', đổi thành '*Kính lạy Thượng đế, tại sao vậy…?*' hoặc '*Lạy Thượng đế, tại sao chứ…?*' để đồng nhất giọng điệu với p000370–p000371."
