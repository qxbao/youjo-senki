  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000173"
    terms: []
    pronouns_and_pov: "Độc thoại nội tâm tiếp nối vế bỏ lửng trong lời đáp với Zettour: dùng 'chúng tôi'."
    modality_and_negation: "Phủ định tuyệt đối khả năng kịp thời hạn và cấu trúc tăng tiến 'không chỉ khó khăn đâu; nó là bất khả thi'."
    markdown_emphasis: "*Không đời nào chúng tôi kịp thời hạn được. Chuyện này không chỉ khó khăn đâu; nó là bất khả thi.* (khớp thẻ <em> trong nguồn theo DEC-P01-002)"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000174"
    terms: []
    pronouns_and_pov: "Trần thuật ngôi thứ ba: dùng 'nó' cho Tanya."
    modality_and_negation: "Nhận định mang tính khái quát hóa ('Có thể nói...') về lời thỉnh cầu ngầm mong rút lại mệnh lệnh."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000175"
    terms:
      - "Kampfgruppe"
      - "Tanya"
    pronouns_and_pov: "Trần thuật ngôi thứ ba ('nó', 'Tanya') dẫn vào câu hỏi nội tâm ngôi thứ nhất ('tôi' trong câu hỏi hướng tới Zettour)."
    modality_and_negation: "Tạm gác nghi vấn về việc ra tuyến đầu để nhấn mạnh câu hỏi cốt lõi về cách thức thành lập đơn vị mới."
    markdown_emphasis: "*Rốt cuộc tôi phải làm thế nào để thành lập cái loại hình đơn vị mới này đây?* (khớp thẻ <em> trong nguồn theo DEC-P01-002)"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000176"
    terms:
      - "Trung tá"
      - "Kampfgruppe"
      - "nghiên cứu khảo sát"
      - "Bộ Tổng tham mưu"
    pronouns_and_pov: "Thoại của Zettour với Tanya: gọi 'Trung tá', 'cô', xưng 'ta' / 'Ta' (kèm phản thân 'mình')."
    modality_and_negation: "Dẫn lại chính lời Tanya đã viết để bác bỏ sự chần chừ, thừa nhận yêu cầu là vô lý nhưng vẫn hạ lệnh phải hoàn thành bằng mọi giá."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000177"
    terms: []
    pronouns_and_pov: "Thoại ngắn nhận lệnh của Tanya với Zettour, có kính ngữ 'ạ'."
    modality_and_negation: "Khẳng định chấp hành mệnh lệnh sau thoáng ngập ngừng."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000178"
    terms:
      - "Zettour"
      - "Tanya"
      - "quân lệnh"
    pronouns_and_pov: "Trần thuật ngôi thứ ba."
    modality_and_negation: "Phủ định 'không cho phép bất kỳ sự hiểu lầm nào' khẳng định tính chất dứt khoát của quân lệnh."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000179"
    terms:
      - "quân đội"
      - "thẩm quyền tuyệt đối"
    pronouns_and_pov: "Trần thuật khái quát ngôi thứ ba."
    modality_and_negation: "Khẳng định nguyên tắc thẩm quyền tuyệt đối của mệnh lệnh trong cơ cấu quân đội."
    markdown_emphasis: "none"
