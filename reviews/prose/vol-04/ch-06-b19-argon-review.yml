findings:
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000623"
    severity: "minor"
    issue: "Thành ngữ liên kết 'by the same token' mang nghĩa 'đồng thời cũng vì lý do đó / xét theo cùng lẽ đó', dịch thành 'xét theo chiều ngược lại' hơi lệch sang sắc thái đối lập hoàn toàn dù ý chung của câu vẫn thông suốt."
    rationale: "Cơ sở hạ tầng lạc hậu vừa là bất lợi cho đất nước vừa vì chính lý do đó mà gây khó khăn cho quân tiến công; có thể tinh chỉnh nhẹ ở bước chuốt văn."
    recommendation: "Có thể đổi 'song xét theo chiều ngược lại' thành 'song cũng chính vì lẽ đó' hoặc 'song xét ở khía cạnh tương ứng' trong bước polish."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000625"
    severity: "minor"
    issue: "Đại từ 'họ' ở câu cuối ('chắc chắn họ sẽ giành chiến thắng') quy chiếu sang phe có một trăm người, dễ trùng bề mặt với 'họ' ở câu trước vốn chỉ nhóm mười kẻ mạnh."
    rationale: "Ngữ cảnh số học 'một trăm chọi một' vẫn giúp người đọc hiểu đúng phe thắng, nhưng làm rõ chủ thể ở bước chuốt văn sẽ giúp câu mạch lạc hơn."
    recommendation: "Có thể tinh chỉnh ở bước polish thành 'chắc chắn phe một trăm người sẽ giành chiến thắng' hoặc 'chắc chắn phía đông người sẽ giành chiến thắng'."
