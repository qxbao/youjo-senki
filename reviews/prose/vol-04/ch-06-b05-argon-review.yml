      - "Kampfgruppe"
    pronouns_and_pov: "Thoại câu hỏi ngắn của Tanya với Zettour, có kính ngữ 'ạ'."
    modality_and_negation: "Câu hỏi xác nhận lại thông tin."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000138"
    terms:
      - "Tanya"
    pronouns_and_pov: "Trần thuật ngôi thứ ba, dùng 'nó' cho Tanya."
    modality_and_negation: "Mệnh đề nhượng bộ 'dù cho có xả hết một ngày trời cũng chưa hết...', phủ định hiệu quả 'Làm thế cũng chẳng giúp nó rút lại được mệnh lệnh' và khẳng định sự khôn ngoan tìm hướng tích cực."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000139"
    terms:
      - "Kampfgruppe"
      - "tiểu đoàn"
      - "Tanya"
    pronouns_and_pov: "Câu hỏi suy tính gián tiếp tự do tiếp nối bằng trần thuật ngôi thứ ba ('mình', 'Tanya')."
    modality_and_negation: "Câu hỏi phủ định giả định 'chẳng phải... có thể trở thành cái cớ để câu giờ hay sao?' và khẳng định giữ tinh thần lạc quan."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000140"
    terms:
      - "học thuyết Kampfgruppe"
      - "thực địa"
    pronouns_and_pov: "Thoại của Zettour với Tanya: xưng 'Chúng ta' (đại diện Bộ Tổng tham mưu) và 'ta' (cá nhân Zettour), gọi 'cô'."
    modality_and_negation: "Khẳng định triển khai học thuyết ngay trên thực địa và điều kiện 'Chừng nào cô còn sử dụng đơn vị một cách thỏa đáng, ta sẽ tôn trọng quyền tự quyết của cô hết mức có thể'."
    markdown_emphasis: "none"
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000141"
    terms:
      - "Tanya"
