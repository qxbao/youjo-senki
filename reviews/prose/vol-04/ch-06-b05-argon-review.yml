    pronouns_and_pov: "Thoại của Zettour với Tanya: xưng 'Ta' / 'ta', gọi 'cô' và 'Trung tá von Degurechaff'."
    modality_and_negation: "Câu điều kiện 'Nếu cô có thể kiểm chứng... ta sẽ chẳng tiếc công sức để áp dụng...' và lời khích lệ cuối câu."
    markdown_emphasis: "*Sử dụng Đơn vị và Cơ động Chiến dịch trong Cuộc chiến Hiện tại* (khớp thẻ <em> tên tài liệu trong nguồn theo DEC-P01-002)"
