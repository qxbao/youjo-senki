  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, tiếp nối liền mạch `vol-04-ch-04-b01` – `b07` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` / `chúng ta` cho Lergen, `ông` / `ông ấy` cho Zettour, `cô` trong lời kể khách quan, `cô ấy` ở p000209 và `cô ta` / `Cô ta` trong độc thoại nội tâm kinh hãi ở p000225, p000233–p000234, p000236–p000238, p000249 khi quy chiếu Thiếu tá von Degurechaff, `ngài` khi hướng tới Thượng đế ở p000243, cùng hệ thống xưng hô quân ngũ chuẩn mực giữa Zettour, Lergen và Degurechaff), đồng thời bảo toàn chính xác các cấu trúc giả định/điều kiện, câu hỏi trực tiếp/nội tâm và cả 16 đoạn có nhấn mạnh in nghiêng."
