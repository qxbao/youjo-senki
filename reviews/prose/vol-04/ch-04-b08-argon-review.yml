- source_term: lergen_pov_zettour_degurechaff_total_war_debate_pronouns_address_and_emphasis_vol04_ch04_b08
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` – `b07` trong toàn bộ 44 đoạn của `vol-04-ch-04-b08` (chapter001_n/p000207–p000250) khi Thiếu tá Tanya von Degurechaff tranh luận với Tướng von Zettour và Đại tá von Lergen về nỗi sợ sinh tồn của Liên bang, cuộc chiến tranh hủy diệt / chiến tranh tổng lực và nhận lệnh điều động hai tháng sang mặt trận phía tây: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen), `DEC-P01-002` và `canon/style-guide.md`: (1) Trần thuật ngôi thứ ba và độc thoại nội tâm bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, đại từ `ông` / `Ông` kết hợp phản thân `mình` trong trần thuật (p000215, p000218, p000219, p000224, p000228, p000235, p000239–p000242, p000249), và tự quy chiếu bằng `mình` / `chúng ta` trong các câu độc thoại nội tâm trực tiếp (p000209, p000225, p000229, p000233); quy chiếu Tướng von Zettour bằng tên riêng `Zettour`, danh xưng `cấp trên` và đại từ `ông` / `ông ấy` (p000212, p000219, p000239, p000249); quy chiếu Thiếu tá Tanya von Degurechaff bằng `Degurechaff` / `Thiếu tá von Degurechaff` / `vị thiếu tá`, đại từ `cô` trong lời kể khách quan (p000215, p000224, p000227, p000232, p000233, p000239), dùng `cô ấy` ở câu suy ngẫm nội tâm đầu lô khi đang tiếp mạch khen ngợi tài năng chiến lược của cô từ cuối lô trước (p000209 — tiếp nối p000201–p000202 của b07), và chuyển sang `cô ta` / `Cô ta` trong chuỗi độc thoại nội tâm bàng hoàng, rùng mình kinh hãi của Lergen khi nhận ra sự điên rồ của Tanya và thực tại chiến tranh tổng lực (p000225, p000233, p000234, p000236–p000238, p000249 — đồng bộ `vol-04-ch-04-b05` và `b07`); trong câu cảm thán nội tâm hướng tới `Thượng đế` ở p000243, dùng đại từ ngôi thứ hai kính trọng `ngài` theo đúng `review-God` và `b07-god-vocative`; lưu ý đại từ `nó` ở p000249 chỉ quy chiếu danh từ bất động vật (`con mắt chiến lược`). (2) Trong đối thoại quân ngũ giữa Tướng von Zettour, Đại tá von Lergen và Thiếu tá Tanya von Degurechaff: Zettour (p000210, p000212, p000214, p000244, p000246, p000248) tự xưng `Tôi` / `tôi`, dùng `chúng ta` khi nói về phía Đế quốc / lục quân (p000214, p000244, p000248) và `Chúng tôi` khi đại diện cho cấp chỉ huy Bộ Tổng tham mưu (p000248), gọi Tanya là `Thiếu tá` / `Thiếu tá von Degurechaff` và `Cô` / `cô`; Lergen (p000218, p000220, p000222) thưa `Thưa Tướng von Zettour` và tự xưng `tôi` khi xin phép cấp trên (p000218), gọi Tanya là `cô` và dùng `chúng ta` cho phía Đế quốc khi chất vấn cô (p000220, p000222); Thiếu tá Tanya von Degurechaff (p000207, p000211, p000213, p000216, p000221, p000226, p000230, p000232, p000245, p000247, cùng câu thoại giả định qua nụ cười ở p000227) tự xưng `tôi` / `Tôi`, dùng `chúng ta` cho phía Đế quốc (p000211, p000230, p000245), quy chiếu Liên bang bằng `họ` / `Họ` (p000207, p000221, p000230), gọi Zettour là `Thưa Tướng quân` / `thưa ngài` / `Ngài` và gọi Lergen là `Thưa Đại tá von Lergen` / `thưa Đại tá` / `ngài` kèm tiểu từ kính ngữ `ạ`. (3) Bảo toàn chính xác các mệnh đề điều kiện / giả định / thời gian của giả định (p000209, p000211, p000214, p000216, p000221, p000227, p000230, p000233, p000234, p000237, p000239, p000249), các câu hỏi trực tiếp / nội tâm / tu từ (p000209, p000210, p000212, p000213, p000214, p000216, p000220, p000222, p000225, p000229, p000231, p000232, p000238, p000243, p000244, p000247, p000249), và cả 16 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000209, p000212 (chỉ bọc hai câu nội tâm ở giữa đoạn), p000215 (chỉ bọc mệnh đề cuối đoạn), p000217, p000223, p000225, p000227 (chỉ bọc mệnh đề cuối đoạn), p000229, p000233 (chỉ bọc câu nội tâm cuối đoạn), p000234, p000236, p000237, p000238, p000239 (chỉ bọc câu nội tâm đầu đoạn), p000243 và p000249 (bọc tách biệt cụm cảm thán đầu câu và ba câu nội tâm cuối đoạn, giữ phần trần thuật ở giữa nằm ngoài dấu `*`), không phát sinh dấu `*` ngoài nguồn ở 28 đoạn còn lại."
  alternatives_vi:
  - cô ấy (thay cho `cô ta` / `Cô ta` trong chuỗi độc thoại nội tâm của Lergen tại chapter001_n/p000225, p000233–p000234, p000236–p000238, p000249 — ưu tiên chuyển từ `cô ấy` ở p000209 sang `cô ta` / `Cô ta` từ p000225 trở đi vì phản ánh chuẩn xác bước ngoặt tâm lý của Lergen khi từ chỗ thán phục tài năng chiến lược của Tanya chuyển sang bàng hoàng, rùng mình kinh hãi trước nụ cười điềm nhiên và tư duy chiến tranh hủy diệt điên rồ của cô, đồng bộ hoàn toàn với `vol-04-ch-04-b05` và `b07`)
