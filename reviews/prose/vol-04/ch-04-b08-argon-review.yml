  proposed_vi: "Tướng quân / Tướng von Zettour / Zettour, hành động quân sự, lục quân, con mắt chiến lược, Đế quốc, Liên bang, Thiếu tá / Thiếu tá von Degurechaff / Degurechaff, Cộng hòa, Lergen / Đại tá von Lergen / Đại tá, quyết định hợp lý, chiến trường Rhine, chiến tranh hủy diệt, chiến tranh tổng lực, có lý trí, mô thức tư duy, quân nhân cấp cao của Đế quốc, Thượng đế, công tác ở hậu phương / hậu phương, sức mạnh quân sự, mặt trận phía tây, phòng tuyến phía tây, nghiên cứu kỹ năng tác chiến, Phòng Nghiên cứu Chiến lược, phân công nhiệm vụ, Năm Thống nhất 1926, thủ đô Moskva của Liên bang (chapter001_n/p000207–p000208, p000211–p000212, p000214–p000216, p000218–p000221, p000226, p000229, p000231–p000232, p000235, p000237, p000239, p000242–p000245, p000248–p000250)"
  alternatives_vi:
