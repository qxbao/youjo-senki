  - "Giữ toàn bộ hai câu nội tâm nhấn mạnh in nghiêng `*Một cuộc chiến khổng lồ. Một cuộc chiến khổng lồ sẽ chỉ ngày càng phình to hơn.*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000224
  locks:
  - "Giữ cụm `vị thiếu tá trước mắt ông`, `nụ cười ngây thơ` và đại từ `ông`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000225
  locks:
  - "Giữ toàn bộ hai câu hỏi nội tâm nhấn mạnh in nghiêng `*Sao cô ta có thể mỉm cười được chứ? Sao cô ta có thể mỉm cười với mình một cách điềm nhiên đến thế?*` (theo DEC-P01-002) và các đại từ `cô ta`, `mình`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000226
  locks:
  - "Giữ lời đáp ngắn `“Không có đâu, thưa Đại tá.”`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000227
  locks:
  - "Giữ đại từ `cô` ở phần dẫn lời nằm ngoài dấu `*`, và câu nội tâm giả định nhấn mạnh in nghiêng ở cuối đoạn `*Tôi rất mừng vì ngài cũng nhìn nhận sự việc giống tôi.*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000228
  locks:
  - "Giữ đại từ `Ông` / `ông` và cấu trúc đối lập `muốn tin rằng điều đó không phải sự thật, nhưng đồng thời, ý nghĩ rằng quả đúng là như vậy lại trào dâng`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000229
  locks:
  - "Giữ toàn bộ hai câu nội tâm nhấn mạnh in nghiêng `*Một cuộc chiến khổng lồ, kinh hoàng. Chẳng lẽ chúng ta sẽ lại tạo ra một địa ngục khác giống như chiến trường Rhine sao?*` (theo DEC-P01-002), đại từ `chúng ta` và cụm `chiến trường Rhine`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000230
  locks:
  - "Giữ cấu trúc lựa chọn loại trừ `Hoặc chúng ta sụp đổ, hoặc họ sụp đổ—chỉ có một trong hai kết cục đó mà thôi ạ.`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000231
  locks:
  - "Giữ câu hỏi thuật ngữ `“Một cuộc chiến tranh hủy diệt ư?”`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000232
  locks:
  - "Giữ cụm `chiến tranh tổng lực`, tiểu từ kính ngữ `ạ`, đại từ `cô` và cấu trúc tăng tiến phủ định `không chút ngập ngừng, chứ chưa nói đến vẻ băn khoăn`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000233
  locks:
  - "Giữ đại từ `cô` ở câu trần thuật đầu đoạn nằm ngoài dấu `*`, và câu nội tâm nhấn mạnh in nghiêng ở cuối đoạn `*Nếu cô ta có thể đáp lại đầy tự tin đến thế, thì… mình đã nhìn lầm cô ta rồi.*` (theo DEC-P01-002)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000234
  locks:
  - "Giữ toàn bộ câu nội tâm nhấn mạnh in nghiêng `*Cô ta ắt hẳn phải là một kẻ ngốc thiển cận hết thuốc chữa, hoặc là một kẻ điên sinh ra để dành cho thực tại điên rồ này.*` (theo DEC-P01-002) và đại từ `Cô ta`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000235
  locks:
  - "Giữ tên riêng `Lergen` và cụm `thực sự cảm thấy rùng mình sợ hãi`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000236
  locks:
  - "Giữ toàn bộ hai câu nội tâm nhấn mạnh in nghiêng `*Thực tại đã hóa điên. Điều đó có nghĩa là trong thực tại điên rồ này, cô ta…*` (theo DEC-P01-002), đại từ `cô ta` và dấu chấm lửng."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000237
  locks:
  - "Giữ toàn bộ câu nội tâm nhấn mạnh in nghiêng `*Cô ta, Thiếu tá von Degurechaff điên rồ ấy, biết đâu lại là người có lý trí.*` (theo DEC-P01-002), đại từ `Cô ta`, danh xưng `Thiếu tá von Degurechaff` và cụm `có lý trí`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000238
  locks:
  - "Giữ toàn bộ câu hỏi nội tâm nhấn mạnh in nghiêng `*Nói cách khác, cô ta thấu hiểu thứ logic vặn vẹo trong cái thế giới loạn trí này ư?*` (theo DEC-P01-002) và đại từ `cô ta`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000239
  locks:
  - "Giữ câu nội tâm nhấn mạnh in nghiêng ở đầu đoạn `*Có lẽ Zettour kìm nén được cơn giận của mình là bởi ông đã cân nhắc tới điều đó.*` (theo DEC-P01-002), câu trần thuật phía sau nằm ngoài dấu `*`, các tên riêng `Zettour`, `Lergen`, đại từ `cô` và cụm `một người có lý trí`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000240
  locks:
  - "Giữ các đại từ `Ông`, `mình`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000241
  locks:
  - "Giữ các đại từ `ông`, `mình` và cấu trúc phủ định mức độ `không thực sự nghĩ rằng mình có thể lĩnh hội trọn vẹn điều đó`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000242
  locks:
  - "Giữ câu ngắn đầu đoạn `Dẫu vậy.`, các cụm `mô thức tư duy`, `sự linh hoạt về mặt trí tuệ`, `quân nhân cấp cao của Đế quốc` và đại từ `ông`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000243
  locks:
  - "Giữ toàn bộ hai câu cảm thán nội tâm nhấn mạnh in nghiêng `*Ôiii, ôiii, ôi Thượng đế ơi. Sao ngài có thể để chuyện này xảy ra cơ chứ?*` (theo DEC-P01-002), danh xưng `Thượng đế` và đại từ `ngài`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000244
  locks:
  - "Giữ cách gọi `Thiếu tá von Degurechaff`, cụm `công tác ở hậu phương`, câu hỏi trực tiếp `Cô muốn làm gì?` và các đại từ `cô` / `Cô`, `chúng ta`, `Tôi`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000245
  locks:
  - "Giữ cụm `Sức mạnh quân sự`, các đại từ `Tôi`, `chúng ta` và tiểu từ kính ngữ `ạ`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000246
  locks:
  - "Giữ dấu chấm lửng mở đầu và câu thoại `“…Tôi sẽ cho cô hai tháng.”`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000247
  locks:
  - "Giữ câu hỏi ngắn `“Thưa ngài?”`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000248
  locks:
  - "Giữ các cụm `mặt trận phía tây`, `hậu phương`, `phòng tuyến phía tây`, `nghiên cứu kỹ năng tác chiến`, `Phòng Nghiên cứu Chiến lược`, `phân công nhiệm vụ`, và các đại từ `Tôi`, `cô` / `Cô`, `chúng ta`, `Chúng tôi`."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000249
  locks:
  - "Giữ 2 cụm nhấn mạnh in nghiêng tách biệt theo DEC-P01-002: cụm cảm thán đầu câu `*Chà, chết tiệt thật*` và ba câu nội tâm cuối đoạn `*Kể cả khi con mắt chiến lược của cô ta có loạn trí đi chăng nữa, thì nó vẫn rất vững chắc. Vậy ra ông ấy muốn biết chắc điều đó ư? Ắt hẳn ông ấy định xem kẻ điên này phân tích cái thế giới điên rồ này ra sao rồi mới quyết định phải xử trí cô ta thế nào dựa trên kết quả đó.*` (phần trần thuật dẫn lời `, Lergen thầm nghĩ khi đọc được ý đồ của cấp trên.` ở giữa nằm ngoài dấu `*`)."
- segment_id: YS-LN04/Text/chapter001_n.xhtml/p000250
  locks:
  - "Giữ dòng tiêu đề thời gian – địa điểm viết hoa toàn bộ `NGÀY 3 THÁNG 4, NĂM THỐNG NHẤT 1926, MỘT NƠI NÀO ĐÓ TẠI THỦ ĐÔ MOSKVA CỦA LIÊN BANG`."
