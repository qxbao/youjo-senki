  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự – chiến lược đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` – `b07` (`Tướng quân` / `Tướng von Zettour` / `Zettour`, `hành động quân sự`, `lục quân`, `con mắt chiến lược`, `Đế quốc`, `Liên bang`, `Thiếu tá` / `Thiếu tá von Degurechaff` / `Degurechaff`, `Cộng hòa`, `Lergen` / `Đại tá von Lergen` / `Đại tá`, `quyết định hợp lý` / `có lý trí` theo sự phân tách ngữ cảnh `P03-rationality`, `chiến trường Rhine`, `chiến tranh tổng lực`, `mô thức tư duy`, `Thượng đế` theo `review-God`, `công tác ở hậu phương` / `hậu phương`, `sức mạnh quân sự`, `mặt trận phía tây`, `phòng tuyến phía tây`, `phân công nhiệm vụ`, `Năm Thống nhất 1926`, `thủ đô Moskva của Liên bang`), đồng thời khóa tạm các thuật ngữ mới xuất hiện trong lô (`chiến tranh hủy diệt`, `quân nhân cấp cao của Đế quốc`, `nghiên cứu kỹ năng tác chiến`, `Phòng Nghiên cứu Chiến lược`)."
