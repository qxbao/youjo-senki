- source_term: imperial_general_staff_war_room_zettour_rudersdorf_pronouns_vol04_ch03_b05
  proposed_vi: "Trong phân cảnh tiếp theo tại Phòng Tác chiến thuộc Văn phòng Bộ Tổng tham mưu Đế quốc sau cú đấm vỡ kính cửa sổ của Trung tướng von Rudersdorf và màn phân tích thực trạng hậu cần – áp lực chính trị của Trung tướng von Zettour (chapter001_l/p000001–p000028): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-03-b01` – `b04`: (1) Trần thuật ngôi thứ ba quy chiếu Trung tướng von Zettour và Trung tướng von Rudersdorf bằng đại từ trang trọng `ông` (p000002, p000004, p000008, p000017, p000019, p000025) kết hợp tên riêng (`Zettour`, `Rudersdorf`) và đại từ phản thân `mình` (p000002, p000008); trong các cụm biểu cảm/nội tâm in nghiêng: thông điệp ngầm qua ánh mắt của Rudersdorf tại p000014 (`*Tôi hiểu, nhưng ông không thể xoay xở cách nào sao?*`), ý nghĩ chợt hiểu ra của Zettour tại p000023 (`*Ồ, ra vậy*`), cái gật đầu xác nhận của Rudersdorf tại p000025 (`*Chính xác*`), và từ cảm thán được nhắc lại trong lời kể tại p000027 (`*Thiệt tình*` — đồng bộ với lời thoại của Zettour ở p000006) đều giữ đúng ngôi và sắc thái giữa hai vị tướng. (2) Quy chiếu cặp đôi hai vị tướng, Lục quân Đế quốc và các sĩ quan hiện tại trong Bộ Tổng tham mưu bằng `họ` / `Họ` / `cả hai` (p000008, p000015, p000016, p000018, p000023, p000026) kết hợp đại từ phản thân `mình` (p000017); quy chiếu hệ thống đường sắt tại p000017 bằng `chúng`. (3) Trong đối thoại trực tiếp giữa hai vị trung tướng đồng cấp kiêm bạn hữu (p000002, p000003, p000005–p000007, p000009, p000011–p000014, p000020–p000022, p000024, p000028): người nói tự xưng `tôi` / `Tôi` (hoặc `chúng tôi` khi Zettour đại diện cho bộ phận hậu cần ở p000014), gọi đối phương là `ông` / `Ông` kèm tên riêng `Rudersdorf` hoặc danh xưng `Giáo sư von Zettour` (p000007), `Tướng von Rudersdorf` (p000014), dùng `chúng ta` khi nói về Bộ Tổng tham mưu và Lục quân Đế quốc (p000011, p000024), và quy chiếu quân địch Liên bang bằng `chúng` / `Chúng` (p000011, p000012, p000024)"
  alternatives_vi:
  - anh / cậu (thay cho `ông` / `Ông` trong đối thoại giữa Zettour và Rudersdorf tại chapter001_l/p000002, p000003, p000006, p000007, p000009, p000011, p000013, p000014, p000020 — bắt buộc giữ cặp `tôi` – `ông` để đồng bộ tuyệt đối với `vol-04-ch-03-b01` – `b04` và toàn bộ các phân cảnh giữa hai vị tướng ở Tập 1–4) / họ (thay cho `chúng` / `Chúng` khi chỉ quân Liên bang tại chapter001_l/p000011, p000012, p000024 — ưu tiên `chúng` / `Chúng` để giữ đúng góc nhìn đối kháng quân sự và đồng bộ với các lô trước của Chương 3)
