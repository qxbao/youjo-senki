  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba trang trọng (`ông`, `họ` / `Họ` / `cả hai`, `chúng`), các mệnh đề biểu cảm/nội tâm in nghiêng tại p000014, p000023, p000025, p000027, và giọng đối thoại thẳng thắn, ăn ý giữa hai vị trung tướng trụ cột của Bộ Tổng tham mưu Đế quốc (`tôi` / `Tôi` / `chúng tôi` – `ông` / `Ông`, `chúng ta`)."
