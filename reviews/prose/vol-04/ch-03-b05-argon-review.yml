  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b04` của Tập 4 (`Zettour`, `Giáo sư von Zettour`, `Tướng von Rudersdorf` / `Rudersdorf`, `Lục quân Đế quốc`, `hậu cần` / `công tác hậu cần`, `quyền làm chủ bầu trời`, `các tuyến tiếp tế`, `Dacia`, `Lục quân Liên bang`, `Tiểu đoàn Pháp sư Trên không số 203`, `kho tiếp tế`, `Liên bang`, `pháp sư trên không`, `thanh trừng`, `pháo đài`, `không kích`, `Cục Tác chiến`, `chiến lược nội tuyến`, `phòng tuyến`, `cơ sở hạ tầng`, `Đế quốc`, `Norden`, `Rhine`, `Bộ Tổng tham mưu`), đồng thời khóa tạm các tổ hợp thuật ngữ quân sự – hậu cần trong phân cảnh Zettour vạch rõ nút thắt tiếp tế tới Dacia và sức ép chính trị từ tiền lệ mặt trận Rhine (`Lực xung kích`, `văn phòng nghiên cứu`, `học thuyết chiến lược nội tuyến trong phạm vi quốc nội`, `vận tải đường bộ`, `người sơ tán`, `hoàng cung`)."
  uncertainty: low
  status: pending
