  proposed_vi: "Zettour, Lực xung kích, Lục quân Đế quốc, Rudersdorf, Giáo sư von Zettour, văn phòng nghiên cứu (chapter001_l/p000002–p000004, p000007–p000010) / công tác hậu cần, hậu cần, quyền làm chủ bầu trời, các tuyến tiếp tế, Dacia, Lục quân Liên bang, Tiểu đoàn Pháp sư Trên không số 203, kho tiếp tế (chapter001_l/p000010, p000011, p000013) / Liên bang, pháp sư trên không, thanh trừng, pháo đài, đạn dược và nhiên liệu, không kích (chapter001_l/p000012, p000013) / Tướng von Rudersdorf, Cục Tác chiến, học thuyết chiến lược nội tuyến trong phạm vi quốc nội, phòng tuyến, cơ sở hạ tầng (chapter001_l/p000014–p000016) / đường sắt, vận tải đường bộ, xe tải và ngựa, dầu mỏ, cao su làm lốp xe, nông nghiệp (chapter001_l/p000017–p000019) / Đế quốc, Norden, Rhine, Bộ Tổng tham mưu, người sơ tán, hoàng cung (chapter001_l/p000022, p000024–p000026, p000028)"
