    category: "thuật ngữ quân sự"
    status: proposed
    rationale: "Phân biệt rõ tuyến phát hiện sớm ('tuyến cảnh giới') đi kèm trạm radar với ranh giới tác chiến phòng không ở cực nam ('tuyến phòng không cực nam')."
    alternatives_vi:
