      - "YS-LN04/Text/chapter001_t.xhtml/p000021"
      - "YS-LN04/Text/chapter001_t.xhtml/p000022"
  - source_term: "Commonwealth marine mage"
    proposed_vi: "pháp sư hải quân đánh bộ của Khối Thịnh vượng chung"
    category: "thuật ngữ quân sự"
    status: proposed
    rationale: "Dịch chuẩn quân chủng 'marine' là 'hải quân đánh bộ' kết hợp với danh xưng quốc gia đã dùng thống nhất trong chương."
    alternatives_vi:
