- source_term: sealed_orders_and_eastern_border_intelligence_terms_vol04_ch01_b05
  proposed_vi: "phương tiện vận tải quân sự, sĩ quan thuộc cấp (chapter001_b/p000115) / Trung úy Serebryakov, Trung úy Grantz (chapter001_b/p000119) / phong bì niêm phong, Bộ Tổng tham mưu, Đại úy Weiss (chapter001_b/p000122, p000123, p000134, p000137, p000140, p000147, p000148) / chỉ huy trưởng và sĩ quan cao cấp thuộc Tiểu đoàn Pháp sư Trên không số 203 (chapter001_b/p000125) / công văn mật (chapter001_b/p000126) / nhiệm vụ trinh sát, lực lượng Liên bang (chapter001_b/p000130, p000134) / “đốt sau khi đọc”, chim hoàng yến nơi biên giới, báo động giả (chapter001_b/p000135, p000136, p000145) / những người Cộng sản, điệp viên nằm vùng dài hạn (chapter001_b/p000136, p000137) / Lục quân Đế quốc (chapter001_b/p000137, p000140, p000142) / Cụm tập đoàn quân phía Đông, mặt trận phía bắc, Liên minh Hiệp ước, Cộng hòa, mặt trận Rhine, Dacia (chapter001_b/p000139, p000140, p000142, p000143) / đòn tấn công gọng kìm (chapter001_b/p000140) / Đại Quân (chapter001_b/p000142) / Lục quân Cộng hòa (chapter001_b/p000144) / bản tóm tắt tình hình (chapter001_b/p000146) / Lục quân Liên bang, luật lệ chiến tranh (chapter001_b/p000147)"
  alternatives_vi:
  - sĩ quan thâm niên (thay cho `sĩ quan cao cấp` tại chapter001_b/p000125 — ưu tiên `sĩ quan cao cấp` vì diễn đạt chuẩn xác vị trí sĩ quan đứng thứ hai sau chỉ huy trưởng trong thủ tục chứng kiến mở công văn mật của đơn vị) / tiêu hủy sau khi đọc (thay cho `đốt sau khi đọc` tại chapter001_b/p000135 — ưu tiên `đốt sau khi đọc` để giữ sát nghĩa đen hình ảnh đóng dấu bảo mật thời chiến) / cơ sở ngầm dài hạn (thay cho `điệp viên nằm vùng dài hạn` tại chapter001_b/p000136 — ưu tiên `điệp viên nằm vùng dài hạn` vì rõ nghĩa và tự nhiên trong ngữ cảnh tình báo biên giới)
