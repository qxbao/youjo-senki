  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Tanya, Đại úy Weiss và hai trung úy Serebryakov, Grantz."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000115
  locks:
  - "Giữ cụm `phương tiện vận tải quân sự`, `sĩ quan thuộc cấp` và chi tiết không thể gọi lại gần mà không có vài người khác bị huých khuỷu tay cho dạt sang bên."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000116
  locks:
  - "Giữ tên `Tanya` và chi tiết phải cao giọng lên bằng không tiếng nói sẽ chẳng thể vọng tới nơi."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000117
  locks:
  - "Giữ sự đối lập giữa `phương tiện quân sự` / `máy bay quân sự` với `máy bay chở khách`, nhận xét động cơ có thể xem là êm so với máy bay quân sự nhưng vẫn khiến `Tanya` bực mình khôn tả vì phải gào lên mới át được tiếng gầm rú không dứt."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000118
  locks:
  - "Giữ đại từ trần thuật `nó` và chi tiết điểm vớt vát duy nhất là không phải lo đám thuộc cấp đang dỏng tai lên nghe ngóng có thể nghe lỏm được câu chuyện giữa hai người."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000119
  locks:
  - "Giữ lời gọi đúng cấp bậc mới ở Tập 4: `“Trung úy Serebryakov! Trung úy Grantz! Xin lỗi, nhưng hai người hãy kiểm tra trang bị của tất cả mọi người đi!”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000120
  locks:
  - "Giữ cặp dấu ngoặc kép đồng thanh và câu đáp: `““Rõ, thưa Thiếu tá!””`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000121
  locks:
  - "Giữ tên `Serebryakov`, `Grantz`, `Tanya`, đại từ tự quy chiếu `mình` và chi tiết lấy một vật được bọc đệm dày từ trong chiếc cặp đặt dưới chân ra."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000122
  locks:
  - "Giữ tên `Weiss`, đại từ `anh`, cụm `phong bì niêm phong thuộc loại mà Bộ Tổng tham mưu thường dùng` và tên `Tanya`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000123
  locks:
  - "Giữ cách gọi `Đại úy Weiss`, xưng hô `Tôi` – `anh` và yêu cầu xác nhận thời gian ghi trên phong bì đối chiếu với đồng hồ xem có khớp với giờ hiện tại không."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000124
  locks:
  - "Giữ câu đáp của Weiss: `“Có, thưa Thiếu tá. Trên đồng hồ của tôi thì đã khớp.”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000125
  locks:
  - "Giữ lời tuyên bố mở phong bì theo đúng thủ tục dưới sự chứng kiến của `chỉ huy trưởng và sĩ quan cao cấp thuộc Tiểu đoàn Pháp sư Trên không số 203` với đại từ `tôi` và `chúng ta`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000126
  locks:
  - "Giữ tên `Tanya`, thuật ngữ `công văn mật`, `bản tóm tắt`, cùng sự phân tách đại từ trần thuật `nó` và tự quy chiếu `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000127
  locks:
  - "Giữ đại từ `Nó` / `của mình` và hành động tạm thời giữ lại lời bình luận rồi đưa xấp giấy tờ cho `Weiss`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000128
  locks:
  - "Giữ câu cảm thán ngập ngừng: `“…Chuyện này…”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000129
  locks:
  - "Giữ đại từ `anh` quy chiếu Weiss buột miệng rên lên một tiếng khi vừa đọc xong."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000130
  locks:
  - "Giữ đại từ `Chúng ta`, cụm `nhiệm vụ trinh sát nhằm thăm dò lực lượng Liên bang` và nhận định chẳng trách cấp trên muốn làm mọi giá để xác minh tình hình."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000131
  locks:
  - "Giữ lời đáp của Weiss: `Vâng, thưa Thiếu tá`, đại từ `tôi` và `chúng ta`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000132
  locks:
  - "Giữ đại từ `Nó` / `mình` cho Tanya, tên `Weiss` cùng đại từ `anh`, và sự tương đồng với nước da tái nhợt như người ốm của `nó`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000133
  locks:
  - "Giữ câu nhận định: `Tình hình đúng với định nghĩa chuẩn xác nhất của từ nghiêm trọng.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000134
  locks:
  - "Giữ dấu ba chấm mở đầu, tên `Bộ Tổng tham mưu`, `lực lượng Liên bang` và chi tiết tập kết dọc theo toàn tuyến biên giới để chuẩn bị cho một cuộc tổng tấn công quy mô lớn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000135
  locks:
  - "Giữ nhãn bảo mật `“đốt sau khi đọc”`, hình ảnh ẩn dụ `nhiều chim hoàng yến nơi biên giới đang hót vang lời cảnh báo` và nhận định khả năng `báo động giả` là cực kỳ thấp."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000136
  locks:
  - "Giữ các danh xưng `Liên bang`, `Đế quốc`, `những người Cộng sản`, cùng thuật ngữ `chim hoàng yến` và `điệp viên nằm vùng dài hạn` bố trí tại khu vực biên giới phía đông."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000137
  locks:
  - "Giữ tên `Bộ Tổng tham mưu`, `Lục quân Đế quốc` và `những người Cộng sản`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000138
  locks:
  - "Giữ câu chuyển đoạn bỏ lửng: `Đó là lý do vì sao…`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000139
  locks:
  - "Giữ dấu ba chấm mở đầu và đầy đủ tên đơn vị/chiến trường: `Cụm tập đoàn quân phía Đông`, `mặt trận phía bắc`, `Liên minh Hiệp ước`, `Cộng hòa`, `mặt trận Rhine`, và `Dacia` hướng về phía nam."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000140
  locks:
  - "Giữ cụm `đòn tấn công gọng kìm cùng phe Cộng hòa`, `Bộ Tổng tham mưu Lục quân Đế quốc`, `Đế quốc` và `Liên bang` đánh thốc từ phía sau."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000141
  locks:
  - "Giữ câu ngắn: `Chừng đó là điều hiển nhiên.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000142
  locks:
  - "Giữ tên `Lục quân Đế quốc`, `Cộng hòa` và `Đại Quân`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000143
  locks:
  - "Giữ tên `Đế quốc`, `mặt trận Rhine` và chi tiết các đạo quân ở phía đông vẫn duy trì tình trạng `báo động toàn diện`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000144
  locks:
  - "Giữ sự đối sánh lực lượng chủ lực của `Đế quốc` xóa sổ quân chủ lực của `Lục quân Cộng hòa`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000145
  locks:
  - "Giữ dấu ba chấm mở đầu, đại từ nội tâm `Mình`, tên `Liên bang` và cụm `báo động giả`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000146
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, tên `Liên bang` và cụm `bản tóm tắt tình hình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000147
  locks:
  - "Giữ tên `Lục quân Liên bang`, `Đế quốc`, `Bộ Tổng tham mưu` và cụm `vi phạm luật lệ chiến tranh`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000148
  locks:
  - "Giữ tên `Bộ Tổng tham mưu`, `Tanya`, các đại từ trong thoại `chúng ta`, `tôi` và `các anh` khi xin lỗi thuộc cấp trong tiểu đoàn vì không thể cho nghỉ ngơi."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000149
  locks:
  - "Giữ lời đáp của Weiss phân biệt rõ `chúng tôi` (bổn phận trước Thiếu tá) và `chúng ta` (tình thế chung không có lựa chọn nào khác)."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000150
  locks:
  - "Giữ câu nói nửa đùa nửa thật của Tanya: `“Vậy thì tôi đoán chúng ta chỉ còn biết tự thương hại chính mình thôi, nhỉ?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000151
  locks:
  - "Giữ dấu nhấn mạnh `*Mình sẽ còn phải thở dài bao nhiêu lần nữa đây?*` đúng phạm vi thẻ `<em>` trong nguồn theo DEC-P01-002 và tách bạch với mệnh đề trần thuật cuối đoạn."
