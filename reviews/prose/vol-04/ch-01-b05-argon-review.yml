  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, địa danh chiến trường và cấp bậc đã khóa tạm từ Tập 1–3 cùng B01–B04 của Tập 4 (`Trung úy Serebryakov`, `Trung úy Grantz`, `Đại úy Weiss`, `Bộ Tổng tham mưu`, `Tiểu đoàn Pháp sư Trên không số 203`, `Liên bang`, `những người Cộng sản`, `Lục quân Đế quốc`, `Cụm tập đoàn quân phía Đông`, `Liên minh Hiệp ước`, `Cộng hòa`, `mặt trận Rhine`, `Dacia`, `Đại Quân`, `Lục quân Cộng hòa`, `Lục quân Liên bang`, `luật lệ chiến tranh`), đồng thời khóa tạm các thuật ngữ bảo mật – tình báo trong cảnh mở phong bì mật lệnh trên máy bay (`sĩ quan cao cấp`, `công văn mật`, `“đốt sau khi đọc”`, `chim hoàng yến`, `điệp viên nằm vùng dài hạn`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_subordinates_pronouns_and_address_vol04_ch01_b05
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000118, p000126, p000127, p000132) và quy chiếu Đại úy Weiss bằng `anh` (chapter001_b/p000122, p000129, p000132); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000121, p000126, p000127, p000132, p000145, p000151) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị dùng `chúng tôi` (chapter001_b/p000146); khi Tanya giao việc cho hai thuộc cấp Serebryakov và Grantz: gọi `Trung úy Serebryakov! Trung úy Grantz!` và `hai người` (chapter001_b/p000119), cả hai đồng thanh đáp `““Rõ, thưa Thiếu tá!””` (chapter001_b/p000120); trong đối thoại xác nhận và bàn bạc mật lệnh giữa Tanya và Weiss: Tanya xưng `tôi`, gọi `Đại úy Weiss` / `anh` (chapter001_b/p000123, p000125, p000148, p000150), dùng `chúng ta` khi bao hàm cả hai hoặc toàn đơn vị (chapter001_b/p000125, p000130, p000148, p000150) và dùng `các anh` khi xin lỗi tập thể thuộc cấp trong tiểu đoàn vì không thể cho nghỉ ngơi (chapter001_b/p000148); Weiss đáp lễ chuẩn quân phong `Có, thưa Thiếu tá` / `Vâng, thưa Thiếu tá`, xưng `tôi` (chapter001_b/p000124, p000131), dùng `chúng tôi` khi nói về bổn phận của thuộc cấp trước chỉ huy và `chúng ta` khi nói về tình thế chung của đơn vị (chapter001_b/p000131, p000149)"
  alternatives_vi:
  - mọi người (thay cho `các anh` khi Tanya nói lời xin lỗi với Weiss về việc không thể cho đơn vị nghỉ ngơi tại chapter001_b/p000148 — ưu tiên `các anh` vì giữ đúng giọng chỉ huy quân đội nói với phó chỉ huy đại diện cho các sĩ quan và binh lính dưới quyền) / chúng ta (thay cho `chúng tôi` ở vế đầu của Weiss tại chapter001_b/p000149 — ưu tiên `chúng tôi` ở câu nói về bổn phận thuộc cấp đối với lời xin lỗi của Thiếu tá, rồi chuyển sang `chúng ta` ở câu nhận định hoàn cảnh chung để giữ sắc thái quân kỷ chuẩn mực)
