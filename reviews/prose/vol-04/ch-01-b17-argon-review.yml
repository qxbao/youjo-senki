- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000121
  locks:
  - "Giữ danh xưng `Thiếu tá`, đại từ `Tôi`, `chúng ta` và tiểu từ lễ phép `ạ` trong lời của Weiss."
