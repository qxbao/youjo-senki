  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, quốc gia, nhân vật, cấp bậc và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng B01–B16 của Tập 4 (`lũ Cộng sản`, `kẻ Cộng sản`, `Thiếu tá`, `Weiss`, `Đại úy Weiss`, `Grantz`, `Liên bang`, `mặt trận Rhine`, `các đạo quân phía đông`, `chính quốc`, `trận trì hoãn`, `Elinium Type 95`, `ảo giác`, `Dacia`, `cá nhân duy lý`, `Quảng trường Đỏ`), đồng thời khóa tạm các thuật ngữ tác chiến phòng không và liên tưởng lịch sử Xô viết xuất hiện trong batch (`ROE`, `chế độ tổng động viên toàn dân`, `ủy viên nhân dân phụ trách lương thực`, `đội trưng thu`, `tệ sùng bái cá nhân`, `Josefgrad`, `Hồng quân`, `Cessna`, `Sân bay Quốc tế Quảng trường Đỏ`, `kỹ thuật bay thâm nhập tầm thấp`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_capital_raid_plan_pronouns_and_address_vol04_ch01_b17
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_d/p000146, p000147); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_d/p000120, p000125, p000127, p000135, p000136, p000138, p000139, p000140), ngôi thứ nhất số nhiều chỉ tập thể đơn vị Tiểu đoàn 203 / phía Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (chapter001_d/p000123, p000124, p000127, p000129, p000130, p000133, p000134, p000141, p000143, p000149), và quy chiếu Đại úy Weiss trong độc thoại nội tâm bằng `anh ấy` (chapter001_d/p000122); trong đối thoại giữa Tanya và Đại úy Weiss: Weiss hỏi ý kiến và bày tỏ lo ngại với Tanya gọi `Thiếu tá`, xưng `tôi`, dùng `chúng ta` khi bao hàm toàn đơn vị kèm tiểu từ lễ phép `ạ` (chapter001_d/p000121, p000131, p000145, p000151); Tanya trao đổi phương án tác chiến và trấn an Weiss gọi `Đại úy Weiss` và dùng `chúng ta` (chapter001_d/p000126, p000132, p000144, p000150, p000153)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_d/p000123, p000124, p000127, p000129, p000130, p000133, p000134, p000141, p000143, p000149 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B16, đồng thời phân biệt rõ với `chúng ta` dùng trong đối thoại trực tiếp giữa Tanya và Weiss tại p000121, p000131, p000132, p000144, p000145, p000151)
