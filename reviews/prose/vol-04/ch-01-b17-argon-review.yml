  proposed_vi: "lũ Cộng sản, kẻ Cộng sản (chapter001_d/p000120, p000123, p000125, p000133, p000134, p000138, p000140, p000142, p000149, p000150) / Thiếu tá (chapter001_d/p000121) / Weiss, đại đội của Grantz, truy kích (chapter001_d/p000122, p000147) / Liên bang, chiến thuật du kích, đơn vị du kích (chapter001_d/p000123, p000137, p000145) / chiến trường tác chiến, mặt trận Rhine, chiến tuyến chính (chapter001_d/p000124, p000126) / các đạo quân phía đông (chapter001_d/p000127) / mồi nhử đánh lạc hướng (chapter001_d/p000132, p000143) / chính quốc, trận trì hoãn, ROE (chapter001_d/p000133) / tổng công kích toàn dân (chapter001_d/p000134) / chế độ tổng động viên toàn dân (chapter001_d/p000135) / ủy viên nhân dân phụ trách lương thực, đơn vị cướp bóc, đội trưng thu (chapter001_d/p000136) / thành phần tham chiến, Elinium Type 95 (chapter001_d/p000138) / thờ cúng ngẫu tượng, tệ sùng bái cá nhân, Josefgrad (chapter001_d/p000140) / lưới phòng không, nhiệm vụ đánh chặn, xuất kích khẩn cấp, ảo giác (chapter001_d/p000142, p000150) / Dacia, hệ thống cảnh báo (chapter001_d/p000145) / cá nhân duy lý (chapter001_d/p000147) / Hồng quân, Cessna, Sân bay Quốc tế Quảng trường Đỏ (chapter001_d/p000152) / Đại úy Weiss (chapter001_d/p000153) / lực lượng tuần tra biên giới, kỹ thuật bay thâm nhập tầm thấp (chapter001_d/p000154)"
  alternatives_vi:
  - quy tắc giao chiến (thay cho `ROE` tại chapter001_d/p000133 — ưu tiên giữ chữ viết tắt `ROE` như nguyên bản để phản ánh đúng thói quen dùng thuật ngữ viết tắt quân sự hiện đại trong độc thoại nội tâm của Tanya) / lệnh trưng tập toàn dân (thay cho `chế độ tổng động viên toàn dân` tại chapter001_d/p000135 — ưu tiên `chế độ tổng động viên toàn dân` vì diễn đạt chuẩn xác và tự nhiên khái niệm quân sự lịch sử huy động toàn bộ lực lượng dân sự vào quân ngũ thời chiến) / đội thu mua lương thực (thay cho `đội trưng thu` tại chapter001_d/p000136 — ưu tiên `đội trưng thu` vì phản ánh đúng bản chất cưỡng bức thu gom lương thực thời kỳ Cộng sản thời chiến mà Tanya đang liên tưởng tới một đơn vị cướp bóc)
