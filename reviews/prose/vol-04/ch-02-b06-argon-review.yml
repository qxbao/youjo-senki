  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, quốc gia, địa danh, cơ quan an ninh và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B05 Chương 2 của Tập 4 (`tiền tuyến`, `thanh lọc`, `Đế quốc` / `người của Đế quốc`, `Loria`, `Moskva`, `Bộ Dân ủy Nội vụ`, `không quân`, `pháp sư`, `các trại tập trung`), đồng thời khóa tạm các thuật ngữ quân sự – an ninh xuất hiện trong phân cảnh Loria đi xe qua nội đô Moskva và phát hiện mục tiêu bay xâm nhập (`các chính ủy`, `trạm kiểm soát`, `căn cứ phòng không`, `chiếc xe công vụ mang biển số đặc biệt`, `lớp ngụy trang`, `vùng cấm bay`, `cuộc duyệt binh`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: loria_city_drive_inner_monologue_and_driver_dialogue_pronouns_vol04_ch02_b06
  proposed_vi: "Trong phân cảnh Loria rời trụ sở Bộ Dân ủy Nội vụ đi xe dạo quanh Moskva và phát hiện những chấm đen trên bầu trời (chapter001_f/p000138–p000169): tiếp nối B05 (và B23–B24 Chương 1), trần thuật ngôi thứ ba quy chiếu Loria bằng `ông ta` / `Ông ta` xuyên suốt (p000139, p000140, p000142, p000146, p000147, p000149–p000157, p000159, p000162–p000164, p000168), kết hợp đại từ phản thân `mình` / `bản thân` (p000139, p000143, p000146, p000149, p000151, p000153, p000159, p000163) và định danh bằng tên riêng `Loria` (p000146, p000162, p000169); trong độc thoại nội tâm trực tiếp (p000153, p000163, p000169), Loria tự quy chiếu ngôi thứ nhất bằng `mình`; trong lời thoại độc thoại hoặc khi ra lệnh cho cấp dưới và tài xế (p000138, p000141, p000145, p000148, p000158), Loria tự xưng `ta` uy quyền, bề trên; người tài xế hỏi Loria bằng câu hỏi lễ phép có tiểu từ kính ngữ `ạ` (`“Có chuyện gì vậy ạ?”` ở p000160); quy chiếu đám cấp dưới bằng `chúng` (p000147), các lính gác thuộc Bộ Dân ủy Nội vụ bằng `họ` (p000150), các học sinh / nữ sinh trên phố qua góc nhìn săn mồi của Loria bằng `chúng` / `một đứa` / `Đứa kia` / `một cô bé` / `con bé` / `nó` / `mấy đứa này` / `những cô bé` / `đứa nào` (p000151, p000153–p000159, p000161, p000162), và quy chiếu những kẻ bay trên bầu trời bằng `chúng` / `Lũ ngu xuẩn nào` / `Lũ suy đồi vô kỷ luật kia` / `đám ngu ngốc đó` / `đám không quân hay lũ pháp sư` / `bọn chúng` (p000164, p000165, p000168, p000169)"
  alternatives_vi:
  - hắn / gã (thay cho `ông ta` khi quy chiếu Loria trong trần thuật tại chapter001_f/p000139–p000168 — ưu tiên `ông ta` để giữ sự liền mạch tuyệt đối với B05 và B23–B24 Chương 1 cũng như tuân thủ quy tắc của `style-guide.md` về việc giữ giọng trần thuật khách quan, lạnh lùng, để chính hành vi và suy nghĩ bệnh hoạn của nhân vật tự bộc lộ bản chất thay vì dùng đại từ trần thuật mang sẵn sắc thái miệt thị)
