  - "Giữ câu thoại mệnh lệnh `“Ta đây. Phải, điều xe của ta ra đi.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000142
  locks:
  - "Giữ các thuật ngữ `các chính ủy`, `tiền tuyến`, đại từ `ông ta` và cụm `Sự chờ đợi khiến ông ta phát bực—ông ta vốn chẳng có tính kiên nhẫn.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000143
  locks:
  - "Giữ đại từ phản thân `mình`, cụm `phần thân dưới` và phần in nghiêng `*xả hơi một chút*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000144
  locks:
  - "Giữ cụm `tìm kiếm một phát hiện mới` và mệnh đề ngạn ngữ in nghiêng `*Anh hùng hào kiệt ắt hẳn phải háo sắc*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000145
  locks:
  - "Giữ đại từ `ta`, thuật ngữ `thanh lọc` và cụm `bất kỳ kẻ nào từng tiếp xúc với người của Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000146
  locks:
  - "Giữ đại từ `bản thân`, `ông ta`, `mình`, tên riêng `Loria` và các cụm `bậc vĩ nhân`, `đam mê thú vui xác thịt`, `ưu tiên sở thích cá nhân của mình`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000147
  locks:
  - "Giữ đại từ `Ông ta`, `chúng`, danh xưng `Đế quốc` và các cụm `xử lý triệt để bất kỳ ai có dính líu tới Đế quốc`, `người tài xế vốn đã nắm rõ ngọn ngành`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000148
  locks:
  - "Giữ câu thoại `“Ta muốn đi dạo một vòng bằng xe. Cứ như mọi khi nhé.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000149
  locks:
  - "Giữ địa danh `trung tâm Moskva`, các thuật ngữ `trạm kiểm soát` / `các trạm kiểm soát`, `căn cứ phòng không` / `những căn cứ phòng không` và đại từ `Ông ta` / `ông ta`, `mình`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000150
  locks:
  - "Giữ cơ quan `Bộ Dân ủy Nội vụ`, cụm `chiếc xe công vụ mang biển số đặc biệt` và các đại từ `ông ta`, `họ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000151
  locks:
  - "Giữ đại từ `Ông ta`, `mình`, `chúng`, cụm `với vẻ háo hức của một con thú săn mồi` và câu nội tâm in nghiêng `*Để xem nào…*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000152
  locks:
  - "Giữ đại từ `ông ta` và câu `Dạo gần đây bận rộn đến mức đã khá lâu rồi ông ta mới lại được tận hưởng thú vui thế này.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000153
  locks:
  - "Giữ câu nội tâm in nghiêng `*Mình đúng là chẳng còn chút kiên nhẫn nào nữa rồi…*` theo DEC-P01-002, cùng đại từ `Ông ta` / `ông ta`, `chính mình`, `mình` và cụm `hau háu dán mắt vào những nữ sinh đi ngang qua`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000154
  locks:
  - "Giữ câu thoại `“Đứa kia thì sao nhỉ? …Ừm, không ổn lắm.”` và câu trần thuật `Ông ta thở dài.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000155
  locks:
  - "Giữ cách gọi `một cô bé` / `con bé` và đại từ `ông ta`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000156
  locks:
  - "Giữ các cụm `vấn đề về độ chín`, `quá đỗi phổng phao so với khẩu vị của ông ta`, giả định quá khứ `Giá như con bé nhỏ tuổi hơn thì hẳn đã đúng gu của ông ta rồi` và cách quy chiếu `con bé` / `nó`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000157
  locks:
  - "Giữ hình ảnh đối lập `giống một trái chín hơn là một quả non xanh`, cấu trúc phủ định kép `Cũng chẳng phải là nó không khơi gợi được chút cảm xúc nào trong ông ta` và cụm `những khiếm khuyết lại càng trở nên chướng mắt`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000158
  locks:
  - "Giữ đại từ `ta`, cách gọi `con bé` và giả định quá khứ `“Chưa đúng lắm… Giá mà ta tìm thấy con bé sớm hơn một chút thì hẳn đã là một món ngon tuyệt hảo rồi.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000159
  locks:
  - "Giữ đại từ `ông ta`, `mình`, cách quy chiếu `con bé` / `nó`, giả định quá khứ `chỉ vài năm trước thôi chắc chắn ông ta đã thèm muốn con bé; hẳn ông ta đã bế thốc nó ngay trên phố rồi` và nghịch lý `bất chấp nét trưởng thành dở dang đầy lạc lõng kia thực chất lại làm giảm đi dục vọng của ông ta—thật là một bi kịch`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000160
  locks:
  - "Giữ câu hỏi lễ phép của tài xế `“Có chuyện gì vậy ạ?”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000161
  locks:
  - "Giữ câu đáp của Loria `“À, mấy đứa này vẫn chưa đúng ý lắm. Cứ lái tiếp đi.”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000162
  locks:
  - "Giữ tên riêng `Loria`, đại từ `Ông ta` / `ông ta` và các cụm `tìm kiếm một đóa hoa để ngắt lấy`, `một hình hài đã tàn phai của hình mẫu lý tưởng trong lòng`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000163
  locks:
  - "Giữ câu hỏi nội tâm in nghiêng `*Hay là mình thử qua chỗ khác nhỉ?*` theo DEC-P01-002, cùng đại từ `ông ta` và `mình`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000164
  locks:
  - "Giữ cụm cảm thán in nghiêng `*Haiz, chán thật*` theo DEC-P01-002, đại từ `ông ta`, `chúng` và các cụm `những chấm đen đang lơ lửng trên bầu trời phía tây`, `khoác trên mình lớp ngụy trang`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000165
  locks:
  - "Giữ câu thoại `“Hả? Lũ ngu xuẩn nào thế kia?”`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000166
  locks:
  - "Giữ địa danh `Moskva` và các thuật ngữ `vùng cấm bay`, `một cuộc duyệt binh hay nghi lễ`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000167
  locks:
  - "Giữ câu `Đương nhiên, đây là một hành vi vi phạm quy định trắng trợn.`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000168
  locks:
  - "Giữ câu mắng nội tâm in nghiêng `*Lũ suy đồi vô kỷ luật kia!*` theo DEC-P01-002, đại từ `ông ta` và cụm `ánh mắt ngập tràn sát khí đến mức có thể giết người chỉ bằng một cái lườm`."
- segment_id: YS-LN04/Text/chapter001_f.xhtml/p000169
  locks:
  - "Giữ hai câu độc thoại nội tâm in nghiêng `*Đúng là vì thế này nên mình mới chẳng thể tin tưởng nổi đám không quân hay lũ pháp sư. Mình đã tống biết bao nhiêu đứa vào các trại tập trung rồi mà bọn chúng vẫn chẳng chịu chừa!*` theo DEC-P01-002, các thuật ngữ `không quân`, `pháp sư`, `các trại tập trung` và cụm `đầu óc xảo quyệt của Loria chợt nảy ra một mối nghi vấn`."
