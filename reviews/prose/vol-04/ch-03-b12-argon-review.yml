  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b11` của Tập 4 (`cựu binh`, `pháp sư`, `vật tư sơ cứu`, `Tanya`, `tiểu đoàn`, `đường băng`, `Cụm tập đoàn quân phía Đông`, `tiền tuyến`, `ý chí tự do`, `Tiểu đoàn Pháp sư Trên không số 203`, `Tiegenhoff`, `vòng vây`, `đội hình tác chiến`, `tao ngộ chiến`, `truy tìm và tiêu diệt`, `mặt trận Rhine`, `tiểu đoàn tăng cường`, `Lục quân Đế quốc`, `Lục quân Liên bang`, `công kích mặt đất`, `quân Đế quốc`, `hỏa lực chế áp`, `thuật thức nổ văng mảnh`, `thuật thức bắn tỉa quang học`, `lớp vỏ phòng ngự`, `Lục quân Cộng hòa`, `Thiếu tá`, `Serebryakov`, `thuật thức`, `Sư đoàn số 3`, `Thiếu tá von Degurechaff`, `Bộ Tổng tham mưu`, `pháo hạng nặng`, `học viện`, `sở chỉ huy sư đoàn`), đồng thời khóa tạm các định danh mới xuất hiện khi Tiểu đoàn 203 hội quân cùng lực lượng phòng thủ Tiegenhoff (`Thiếu tá Hofen` / `Hofen`, `Tiểu đoàn Pháp sư số 213`)."
