findings:
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000332"
    severity: "minor"
    category: "modality_precision"
    issue: "Tăng mức độ chắc chắn của động từ tình thái chỉ suy đoán hợp lý ở câu đầu thành khẳng định tuyệt đối ('chắc chắn')."
    evidence: "Nguồn dùng cấu trúc tình thái chỉ kỳ vọng hợp lý dựa trên điều kiện giả định (cũng xuất hiện tương tự ở cuối p000327), không phải khẳng định chắc chắn tuyệt đối."
    recommendation: "Đổi 'chắc chắn yêu cầu này sẽ được thông qua' thành 'hẳn là yêu cầu này sẽ được thông qua' hoặc 'lẽ ra yêu cầu này phải được thông qua' (tương tự ở p000327 có thể đổi 'chắc chắn là làm được thôi' thành 'hẳn là làm được thôi')."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000338"
    severity: "minor"
    category: "meaning_precision"
    issue: "Dịch cụm chỉ vị trí quy chiếu về Xưởng Kỹ thuật thành 'ở dưới đó' làm phát sinh sắc thái không gian/cấp bậc không có trong nguồn."
    evidence: "Cụm trạng từ chỉ nơi chốn trong nguồn chỉ quy chiếu về cơ sở hậu phương vừa nhắc ở câu trước (Xưởng Kỹ thuật), không mang nghĩa 'ở bên dưới'."
    recommendation: "Đổi 'ở dưới đó' thành 'ở bên đó' hoặc 'ở chỗ đó'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000356"
    severity: "minor"
    category: "terminology_consistency"
    issue: "Dịch cụm trạng ngữ chỉ phương thức tác chiến hiệp đồng thành 'theo lối hiệp đồng tích hợp' hơi trùng nghĩa."
    evidence: "Trong sổ pending của tập 4, khái niệm 'integrated operation' đã được đề xuất là 'tác chiến hiệp đồng'; việc ghép cả 'hiệp đồng' lẫn 'tích hợp' tạo cảm giác lặp từ."
    recommendation: "Đổi 'vận hành thành công theo lối hiệp đồng tích hợp' thành 'tác chiến hiệp đồng thành công' hoặc 'vận hành thành công theo phương thức hiệp đồng'."
