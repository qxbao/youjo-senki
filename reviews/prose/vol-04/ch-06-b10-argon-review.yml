findings:
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000284"
    severity: "minor"
    category: "style_guide_literalness"
    issue: "Tự thêm sắc thái đánh giá 'ác liệt nhất' khi dịch cụm chỉ vị trí không gian ở câu đầu."
    evidence: "Cụm từ nguồn chỉ nêu vị trí tuyến tiền tiêu xa nhất/sát địch nhất để đối lập với vùng lãnh thổ chiếm đóng phía sau, không có tính từ mô tả mức độ ác liệt."
    recommendation: "Đổi 'tuyến đầu ác liệt nhất' thành 'tuyến tiền tiêu xa nhất' hoặc 'tuyến sát mặt trận nhất'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000292"
    severity: "minor"
    category: "meaning_precision"
    issue: "Thu hẹp phạm vi đại từ tổng quát ở cuối đoạn thành 'cả đôi bên'."
    evidence: "Sau khi nêu lợi ích của Tanya và Romel, câu kết dùng đại từ chỉ tất cả mọi người (nối sang p000293 khẳng định không ai chịu thiệt trong giao dịch này, bao gồm cả phía cấp phát); dịch thành 'cả đôi bên' làm hẹp phạm vi lập luận vị lợi."
    recommendation: "Đổi 'giúp cả đôi bên cùng vui vẻ' thành 'giúp tất cả mọi người cùng vui vẻ' hoặc 'làm ai nấy đều vui vẻ'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000319"
    severity: "minor"
    category: "meaning_precision"
    issue: "Lệch hướng quy chiếu của trạng từ đánh giá trong cụm mô tả sự im lặng của viên trưởng nhóm."
    evidence: "Cụm trạng từ + tính từ trong nguồn thể hiện đánh giá từ điểm nhìn của Tanya rằng sự im lặng của đối phương thật đáng thất vọng/nhạt nhẽo (vì không đưa ra nổi lý lẽ phản bác nào ở câu sau), chứ không phải viên trưởng nhóm mang tâm trạng thất vọng ('im lặng đầy thất vọng')."
    recommendation: "Đổi 'chỉ im lặng đầy thất vọng' thành 'lại im lặng một cách đáng thất vọng'."
