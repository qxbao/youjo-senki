  proposed_vi: "Dacia (chapter001_d/p000086) / đòn đánh chống mục tiêu mặt đất, pháo đường sắt (chapter001_d/p000087, p000088, p000100) / Weiss (chapter001_d/p000088) / Liên bang, khu vực tập kết xuất phát (chapter001_d/p000090) / đợt đấu tranh lao động mùa xuân, cắt giảm nhân sự hàng loạt (chapter001_d/p000091) / Trung úy Grantz, Thiếu tá (chapter001_d/p000092, p000096, p000103, p000106) / đội hậu vệ (chapter001_d/p000093) / ổ đề kháng (chapter001_d/p000094) / tác chiến cơ động (chapter001_d/p000095) / tấn công truy quét, cơ sở hậu cần (chapter001_d/p000098) / sở chỉ huy (chapter001_d/p000103, p000105) / các đạo quân phía đông (chapter001_d/p000106) / mệnh lệnh bay, tự do hành động, Tsugene, gã Khốn-guchi (chapter001_d/p000107) / Tướng von Zettour, vốn xã hội (chapter001_d/p000108) / bên liên quan, cá nhân duy lý, xơ cứng động mạch (chapter001_d/p000110) / đám Cộng sản, Cộng sản, lũ khốn Cộng sản, lũ Cộng sản (chapter001_d/p000111, p000112, p000115, p000119) / Adam Smith, bàn tay vô hình của Thượng đế, bàn tay vô hình của thị trường (chapter001_d/p000113) / trận trì hoãn, Đại Quân (chapter001_d/p000117)"
  alternatives_vi:
  - tổng tiến công lao động mùa xuân (thay cho `đợt đấu tranh lao động mùa xuân` tại chapter001_d/p000091 — ưu tiên `đợt đấu tranh lao động mùa xuân` vì là cách dịch chuẩn và quen thuộc cho khái niệm thương lượng lương bổng thường niên *shuntō* của công đoàn Nhật Bản trong liên tưởng công sở của Tanya) / bên hữu quan (thay cho `bên liên quan` tại chapter001_d/p000110 — ưu tiên `bên liên quan` vì tự nhiên trong ngôn ngữ quản trị doanh nghiệp hiện đại khi Tanya ví Tướng von Zettour như người bảo trợ chiến lược của mình) / tác chiến trì hoãn (thay cho `trận trì hoãn` tại chapter001_d/p000117 — ưu tiên `trận trì hoãn` vì bám sát danh từ đếm được trong câu lệnh trực tiếp `đánh một trận trì hoãn`)
