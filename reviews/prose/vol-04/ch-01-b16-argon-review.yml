  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Thiếu tá Tanya von Degurechaff và các thuộc cấp khi mở đợt công kích thứ hai vào trận địa pháo đường sắt và nhận bức điện chỉ thị từ sở chỉ huy."
  uncertainty: low
  status: pending
  canon: false
locked_choices:
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000086
  locks:
  - "Giữ địa danh `Dacia`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000087
  locks:
  - "Giữ đại từ tập thể `Chúng tôi`, `chúng tôi` và các thuật ngữ `đòn đánh chống mục tiêu mặt đất`, `pháo đường sắt`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000088
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, thuật ngữ `pháo đường sắt` và tên riêng `Weiss`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000089
  locks:
  - "Giữ lời cảm thán về việc quân tiếp viện của địch toàn là bộ binh."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000090
  locks:
  - "Giữ đại từ tập thể `Chúng tôi`, `chúng tôi`, danh xưng `Liên bang`, cụm thuật ngữ `khu vực tập kết xuất phát` và tên `Tanya`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000091
  locks:
  - "Giữ các cụm `đợt đấu tranh lao động mùa xuân` và `cắt giảm nhân sự hàng loạt`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000092
  locks:
  - "Giữ các danh xưng `Trung úy Grantz`, `thưa Thiếu tá` và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000093
  locks:
  - "Giữ tên `Tanya` và thuật ngữ `đội hậu vệ`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000094
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và cụm `ổ đề kháng`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000095
  locks:
  - "Giữ cụm thuật ngữ `tác chiến cơ động`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000096
  locks:
  - "Giữ lời nhận lệnh `“Rõ, thưa Thiếu tá. Triển khai ngay đây ạ.”`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000097
  locks:
  - "Giữ tên `Tanya` và đại từ trần thuật `Nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000098
  locks:
  - "Giữ câu hỏi nội tâm in nghiêng `*Nhưng nghiêm túc đấy, các pháp sư của địch rốt cuộc đang ở đâu cơ chứ?*` theo DEC-P01-002, tên `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001 và các cụm `tấn công truy quét`, `cơ sở hậu cần`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000099
  locks:
  - "Giữ nhận định về việc cử đơn vị pháp sư tiếp viện."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000100
  locks:
  - "Giữ câu in nghiêng `*Thực hiện một đòn đánh thăm dò chống mục tiêu mặt đất rồi xử lý lực lượng tiếp viện kéo tới mà không hề hay biết điều gì đang chờ đợi mình.*` theo DEC-P01-002 và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000101
  locks:
  - "Giữ đại từ nội tâm `Mình` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000102
  locks:
  - "Giữ lời cảm thán nội tâm của Tanya."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000103
  locks:
  - "Giữ danh xưng `Thiếu tá`, cụm `sở chỉ huy` và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000104
  locks:
  - "Giữ lời đáp ngắn gọn `“Kết nối được rồi sao? Đọc đi.”`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000105
  locks:
  - "Giữ đại từ trần thuật `nó` theo DEC-P01-001 và cụm `sở chỉ huy`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000106
  locks:
  - "Giữ lời báo cáo `Rõ, thưa Thiếu tá`, cụm `các đạo quân phía đông`, đại từ `cô` và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000107
  locks:
  - "Giữ đại từ nội tâm `mình` theo DEC-P01-001, các cụm `mệnh lệnh bay`, `tự do hành động`, các biệt danh `Tsugene`, `gã Khốn-guchi` và ký hiệu chú thích `⁶`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000108
  locks:
  - "Giữ danh xưng `Tướng von Zettour`, đại từ nội tâm `mình` theo DEC-P01-001, đại từ `ông ấy` / `Ông ấy` và thuật ngữ `vốn xã hội`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000109
  locks:
  - "Giữ đại từ `Tôi` và từ `tiền tuyến`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000110
  locks:
  - "Giữ các cụm thuật ngữ `bên liên quan`, `cá nhân duy lý`, `xơ cứng động mạch` và đại từ nội tâm `mình` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000111
  locks:
  - "Giữ cụm `đám Cộng sản`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000112
  locks:
  - "Giữ từ `Cộng sản`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000113
  locks:
  - "Giữ đại từ `chúng ta`, tên riêng `Adam Smith`, đại từ nội tâm `mình` theo DEC-P01-001 và các cụm `bàn tay vô hình của Thượng đế`, `bàn tay vô hình của thị trường`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000114
  locks:
  - "Giữ cụm `giới học giả`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000115
  locks:
  - "Giữ cụm `lũ khốn Cộng sản thô bỉ`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000116
  locks:
  - "Giữ các cụm `Quân ta`, `chúng ta` và tiểu từ lễ phép `ạ`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000117
  locks:
  - "Giữ cụm thuật ngữ `trận trì hoãn` và danh xưng `Đại Quân`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000118
  locks:
  - "Giữ đại từ tập thể `Chúng tôi`, `chúng tôi` trong độc thoại nội tâm."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000119
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, cụm `lũ Cộng sản` và đại từ nội tâm `mình` theo DEC-P01-001."
