  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Thiếu tá Tanya von Degurechaff và các thuộc cấp khi mở đợt công kích thứ hai vào trận địa pháo đường sắt và nhận bức điện chỉ thị từ sở chỉ huy."
