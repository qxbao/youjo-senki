  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, quốc gia, nhân vật, cấp bậc và thuật ngữ quân sự – kinh tế đã khóa tạm từ Tập 1–3 cùng B01–B15 của Tập 4 (`Dacia`, `đòn đánh chống mục tiêu mặt đất`, `pháo đường sắt`, `Weiss`, `Liên bang`, `khu vực tập kết xuất phát`, `Trung úy Grantz`, `Thiếu tá`, `đội hậu vệ`, `tác chiến cơ động`, `sở chỉ huy`, `mệnh lệnh bay`, `tự do hành động`, `gã Khốn-guchi`, `Tướng von Zettour`, `Cộng sản` / `đám Cộng sản` / `lũ Cộng sản`, `Thượng đế`, `bàn tay vô hình`, `Đại Quân`), đồng thời khóa tạm các thuật ngữ tác chiến và liên tưởng quản trị – kinh tế xuất hiện trong batch (`đợt đấu tranh lao động mùa xuân`, `tấn công truy quét`, `Tsugene`, `vốn xã hội`, `bên liên quan`, `xơ cứng động mạch`, `bàn tay vô hình của Thượng đế`, `bàn tay vô hình của thị trường`, `trận trì hoãn`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_subordinates_hq_orders_pronouns_and_address_vol04_ch01_b16
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_d/p000094, p000097, p000098, p000100, p000105) và giữ nguyên tên riêng `Tanya` (chapter001_d/p000090, p000093, p000097, p000098); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_d/p000100, p000101, p000107, p000108, p000110, p000113, p000119), ngôi thứ nhất số nhiều chỉ tập thể đơn vị Tiểu đoàn 203 / phía Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (chapter001_d/p000087, p000088, p000090, p000118, p000119), câu nêu nguyên lý kinh tế khái quát đối lập với phe Cộng sản dùng `chúng ta` (chapter001_d/p000113), và quy chiếu Tướng von Zettour trong độc thoại nội tâm bằng `ông ấy` (chapter001_d/p000108); trong đối thoại giữa Tanya và thuộc cấp (Weiss / Serebryakov): thuộc cấp báo cáo và nhận lệnh gọi `thưa Thiếu tá` / `Thiếu tá` / `cô`, dùng `chúng ta` / `quân ta` kèm tiểu từ lễ phép `ạ` (chapter001_d/p000092, p000096, p000103, p000106, p000116); Tanya hỏi tình hình và hạ lệnh xưng `tôi` với câu mệnh lệnh dứt khoát (chapter001_d/p000095, p000104, p000109, p000117)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_d/p000087, p000088, p000090, p000118, p000119 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B15, đồng thời phân biệt với `chúng ta` dùng trong mệnh đề nguyên lý kinh tế chung tại p000113 và trong lời báo cáo trực tiếp tại p000116)
