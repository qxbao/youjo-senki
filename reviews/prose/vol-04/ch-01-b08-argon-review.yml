  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, cơ quan tham mưu và quốc gia đã khóa tạm từ Tập 1–3 cùng B01–B07 của Tập 4 (`Trung đội 437`, `trung đội trinh sát đặc biệt chiến thuật`, `chim hoàng yến`, `Liên bang`, `Lục quân Liên bang`, `đại đội trưởng`, `Đại úy Weiss`, `Trung úy Serebryakov`, `Grantz`, `Lục quân Đế quốc`, `Bộ Tổng tham mưu`, `Tiểu đoàn Pháp sư Trên không số 203`, `chỉ huy tiền tuyến`, `mặt trận Rhine`), đồng thời khóa tạm các thuật ngữ chính trị – quân sự và tình báo xuất hiện trong batch (`đám Liên bang Đỏ`, `phe Đỏ`, `Hợp chúng quốc`, `đám Yankee`, `quân cảnh`, `xử bắn tại chỗ không cần xét xử`, `tình báo con người (HUMINT)`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_battalion_briefing_conclusion_pronouns_and_address_vol04_ch01_b08
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000220, p000227, p000238, p000239, p000242) và quy chiếu Đại úy Weiss bằng `anh` (chapter001_b/p000229, p000233, p000242); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000220, p000226, p000227, p000230, p000234, p000237, p000238, p000242), quy chiếu Weiss trong độc thoại nội tâm khen ngợi bằng `anh ấy` (chapter001_b/p000234) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị trong độc thoại nội tâm dùng `chúng tôi` (chapter001_b/p000219, p000221, p000223–p000226); khi Weiss phổ biến nhiệm vụ cho toàn tiểu đoàn: xưng `tôi` hoặc `chúng ta` (khi bao hàm toàn tiểu đoàn), gọi binh sĩ là `các anh` / `tất cả các anh` (chapter001_b/p000217, p000228, p000232, p000240); khi Tanya cảm ơn Weiss và phát biểu khích lệ toàn tiểu đoàn: gọi `Đại úy Weiss` / `anh` (chapter001_b/p000241), hô `Hỡi những người anh em trong tiểu đoàn`, gọi `Weiss`, xưng `tôi` và dùng `chúng ta` khi bao hàm toàn đơn vị (chapter001_b/p000244)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_b/p000219, p000221, p000223–p000226 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể Tiểu đoàn 203 trong độc thoại nội tâm suốt từ B01 đến B07) / các đồng chí trong tiểu đoàn (thay cho `Hỡi những người anh em trong tiểu đoàn` tại chapter001_b/p000244 — ưu tiên `Hỡi những người anh em trong tiểu đoàn` để giữ sát nghĩa đen lời hiệu triệu chiến hữu trong quân đội Đế quốc mà không bị lẫn sắc thái từ vựng của phe Cộng sản Liên bang)
