- source_term: eastern_recon_platoons_and_humint_security_terms_vol04_ch01_b08
  proposed_vi: "Trung đội 437, trung đội trinh sát đặc biệt chiến thuật, chim hoàng yến trong hầm mỏ (chapter001_b/p000217) / đám Liên bang Đỏ, toán cảnh giới, quốc gia trung lập (chapter001_b/p000219, p000232) / phe Đỏ, Liên bang, Lục quân Liên bang (chapter001_b/p000221, p000222, p000224, p000226, p000232, p000237, p000239, p000240) / Hợp chúng quốc, đám Yankee, quân cảnh, xử bắn tại chỗ không cần xét xử (chapter001_b/p000222, p000223) / tâm lý học chiến trường, thí nghiệm tái hiện (chapter001_b/p000225) / đại đội trưởng, Đại úy Weiss, Trung úy Serebryakov, Grantz, Lục quân Đế quốc (chapter001_b/p000229–p000231, p000233, p000235, p000241, p000242, p000244) / Bộ Tổng tham mưu, tính bảo mật (chapter001_b/p000235, p000236, p000244) / Tiểu đoàn Pháp sư Trên không số 203, tình báo con người (HUMINT)⁴ (chapter001_b/p000237) / chỉ huy tiền tuyến (chapter001_b/p000242) / mặt trận Rhine (chapter001_b/p000244)"
  alternatives_vi:
  - bọn Đỏ Liên bang (thay cho `đám Liên bang Đỏ` tại chapter001_b/p000219 — ưu tiên `đám Liên bang Đỏ` và `phe Đỏ` để giữ tự nhiên trong độc thoại nội tâm của Tanya khi gọi lóng lực lượng Cộng sản Liên bang) / hành quyết tóm tắt (thay cho `xử bắn tại chỗ không cần xét xử` tại chapter001_b/p000223 — ưu tiên `xử bắn tại chỗ không cần xét xử` vì diễn đạt chuẩn xác, rõ nghĩa trong ngữ cảnh tù binh chiến trường bị bắn bỏ khi vắng mặt quân cảnh) / tình báo nhân lực (thay cho `tình báo con người (HUMINT)` tại chapter001_b/p000237 — ưu tiên `tình báo con người (HUMINT)` để khớp chuẩn thuật ngữ chuyên ngành tình báo và giữ chữ viết tắt đi kèm chú thích cuối sách `⁴`)
