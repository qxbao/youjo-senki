- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000219
  locks:
  - "Giữ dấu nhấn mạnh toàn đoạn theo DEC-P01-002, đại từ tập thể `chúng tôi` và các cụm `Đám Liên bang Đỏ`, `toán cảnh giới`, `quốc gia trung lập`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000220
  locks:
  - "Giữ tên `Tanya`, đại từ tự quy chiếu `mình` và đại từ trần thuật `Nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000221
  locks:
  - "Giữ dấu nhấn mạnh toàn câu theo DEC-P01-002, cụm `phe Đỏ` và đại từ tập thể `chúng tôi`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000222
  locks:
  - "Giữ cấu trúc giả định đối sánh giữa `Liên bang` và `Hợp chúng quốc`, cùng nguy cơ bị bắt sống của lính nhảy dù thọc sâu vào lãnh thổ địch."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000223
  locks:
  - "Giữ cụm `đám Yankee hung hăng kia`, `quân cảnh` và `xử bắn tại chỗ không cần xét xử`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000224
  locks:
  - "Giữ câu ngắn đối lập: `Nhưng đối thủ của chúng tôi lại là phe Đỏ.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000225
  locks:
  - "Giữ ký hiệu chú thích `³`, đại từ `chúng tôi`, tên `Tanya` và các cụm `tâm lý học chiến trường`, `thí nghiệm tái hiện`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000226
  locks:
  - "Giữ sự chuyển tiếp đại từ tập thể `chúng tôi`, cụm `phe Đỏ` và đại từ cá nhân `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000227
  locks:
  - "Giữ mệnh đề nhấn mạnh `*Nếu có điểm nào may mắn trong chuyện này, thì đó là…*` theo DEC-P01-002, tên `Tanya` và đại từ `nó`, `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000228
  locks:
  - "Giữ đại từ `chúng ta` – `các anh` trong lời kết luận của Weiss."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000229
  locks:
  - "Giữ tên `Weiss`, đại từ `anh` và `họ`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000230
  locks:
  - "Giữ các chức danh và cấp bậc `đại đội trưởng`, `Đại úy Weiss`, `Trung úy Serebryakov`, `Grantz` và đại từ `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000231
  locks:
  - "Giữ cụm `quân nhân tinh nhuệ` và `Lục quân Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000232
  locks:
  - "Giữ đại từ `chúng ta` và các danh xưng `Lục quân Liên bang`, `quốc gia trung lập`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000233
  locks:
  - "Giữ tên `Weiss` và đại từ `anh` trong mô tả nỗ lực giữ giọng điềm tĩnh của người chuyên nghiệp."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000234
  locks:
  - "Giữ đại từ nội tâm `Mình` và đại từ quy chiếu Weiss là `anh ấy` đồng bộ với B06."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000235
  locks:
  - "Giữ tên `Weiss`, `Tanya` và `Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000236
  locks:
  - "Giữ lập luận tách biệt giữa `tính bảo mật` và việc được cung cấp thông tin cần thiết."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000237
  locks:
  - "Giữ câu nhấn mạnh `*Mình chẳng mấy nghĩ là có kẻ nào thuộc phe Đỏ trong Tiểu đoàn Pháp sư Trên không số 203 đâu…*` theo DEC-P01-002, tên `Tanya`, thuật ngữ `tình báo con người (HUMINT)` kèm ký hiệu chú thích `⁴` và cụm `phe Đỏ`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000238
  locks:
  - "Giữ đại từ `nó` và `mình`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000239
  locks:
  - "Giữ cụm `phe Đỏ`, đại từ `nó` và hình ảnh ẩn dụ `bầy lửng chó ranh mãnh và lũ cáo già xảo quyệt`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000240
  locks:
  - "Giữ đại từ `Chúng ta`, `tất cả các anh`, `tôi` và tên `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000241
  locks:
  - "Giữ lời cảm ơn ngắn gọn của Tanya: `“Cảm ơn anh, Đại úy Weiss.”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000242
  locks:
  - "Giữ tên `Weiss`, `Tanya`, đại từ `anh`, `nó` và câu độc thoại nhấn mạnh cuối đoạn `*Ngay lúc này, mình phải hoàn thành chức trách của một người chỉ huy tiền tuyến.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000243
  locks:
  - "Giữ thành ngữ `bánh vẽ trên trời` cho những kế hoạch nếu không sống sót qua ngày mai."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000244
  locks:
  - "Giữ lời hiệu triệu `Hỡi những người anh em trong tiểu đoàn`, các danh xưng `Weiss`, `Bộ Tổng tham mưu`, `mặt trận Rhine` và đại từ `Chúng ta`, `Tôi`."
