  proposed_vi: "Weiss, Serebryakov, Tanya, báo cáo hậu chiến, biểu mẫu, Grantz, mệnh lệnh tác chiến, tố chất, công việc hành chính, Thiếu tá, cuộc họp các chỉ huy, sĩ quan phụ tá, Trung úy Serebryakov, Trung úy Grantz, không đoàn tiêm kích, Đại úy Weiss, đơn vị nghiên cứu điều tra, năng lực ứng phó, Trung úy, Không đoàn Tiêm kích số 103, Bộ Tổng tham mưu, hệ thống chỉ huy, các mối quan hệ ngang cấp, mặt trận Rhine, Norden, cựu binh mặt trận Rhine, các đoàn điều tra, giới tư vấn (chapter001_r/p000055–p000060, p000062–p000068, p000070–p000079)"
  alternatives_vi:
  - báo cáo sau tác chiến (thay cho `báo cáo hậu chiến` tại chapter001_r/p000055 — ưu tiên `báo cáo hậu chiến` vì cô đọng, tự nhiên trong văn phong hành chính quân sự) / đơn vị điều tra nghiên cứu (thay cho `đơn vị nghiên cứu điều tra` tại chapter001_r/p000071 — ưu tiên `đơn vị nghiên cứu điều tra` vì giữ đúng cấu trúc bổ nghĩa và đồng bộ với `đơn vị nghiên cứu kỹ năng tác chiến` ở `vol-04-ch-05-b02` p000050) / các mối quan hệ chiều ngang (thay cho `các mối quan hệ ngang cấp` tại chapter001_r/p000073 — ưu tiên `các mối quan hệ ngang cấp` vì diễn đạt tự nhiên, rõ nghĩa quan hệ phối hợp giữa các đơn vị không chung hệ thống chỉ huy dọc)
