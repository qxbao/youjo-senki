  proposed_vi: "Toàn bộ 26 đoạn trong `vol-04-ch-05-b03` (chapter001_r/p000054–p000079) xoay quanh việc giao toàn bộ báo cáo hậu chiến còn lại cho Trung úy Grantz để rèn luyện năng lực xử lý công việc hành chính, lời dặn riêng của Tanya với Trung úy Serebryakov và Đại úy Weiss trước buổi giao lưu với Không đoàn Tiêm kích số 103 nhằm xây dựng mối quan hệ ngang cấp, tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`: (1) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya: quy chiếu `Tanya` nhất quán bằng tên riêng và đại từ `nó` kết hợp phản thân `mình` / `bản thân` (p000059, p000060, p000063, p000064, p000070, p000071, p000078 — tuyệt đối không dùng `cô` / `cô ấy` cho Tanya trong lời kể hay độc thoại nội tâm); quy chiếu Trung úy Grantz bằng `cậu ta` / `Cậu ta` (p000058, p000059, p000063); quy chiếu sĩ quan phụ tá Serebryakov bằng `cô` (p000064, p000066); quy chiếu cặp Weiss – Serebryakov, tập thể Tiểu đoàn 203, các đơn vị khác và giới tư vấn bằng `họ` / `bọn họ` (p000055, p000071, p000074, p000079); chuyển đại từ ngôi thứ hai phiếm chỉ trong hai mệnh đề khái quát tại p000070 và p000074 sang kết cấu khái quát vô nhân xưng (`chỉ cần có ý chí sắt đá là làm được tất cả` ở p000070; `sợi dây gắn kết đáng tin cậy nhất chính là tình bằng hữu` ở p000074) theo quy ước `direct-address choice`. (2) Trong độc thoại nội tâm và lời cổ vũ gián tiếp của Tanya (p000063, p000070): tại p000063, câu khích lệ in nghiêng hướng tới Grantz dùng cặp xưng hô `Tôi` — `cậu` (`*Tôi trông cậy vào cậu đấy*`); tại p000070, độc thoại nội tâm trực tiếp của Tanya tự quy chiếu bằng `mình` / `Mình` và quy chiếu Serebryakov bằng `cô ấy`. (3) Trong hội thoại quân sự (p000054, p000056, p000057, p000061, p000062, p000064–p000073, p000075–p000078): Tanya tự xưng `tôi` / `Tôi`, dùng đại từ gộp `chúng ta`, gọi cặp Weiss – Serebryakov là `hai người` (p000054 — đồng bộ `vol-04-ch-05-b02` p000047), gọi Grantz là `cậu` (p000061) và quy chiếu Grantz khi nói với Serebryakov là `Trung úy Grantz` / `cậu ta` (p000066), gọi Serebryakov là `Trung úy Serebryakov` / `Trung úy` / `cô` (p000064, p000066, p000068, p000073) và quy chiếu Serebryakov khi nói với Weiss là `Trung úy Serebryakov` / `cô ấy` (p000078), gọi Weiss là `Đại úy Weiss` (p000078); ở chiều ngược lại, Đại úy Weiss, Trung úy Grantz và Trung úy Serebryakov đều thưa `thưa Thiếu tá` / `Thiếu tá` kèm tiểu từ kính ngữ `ạ`, tự xưng `tôi` / `chúng tôi` / `chúng ta`, và Serebryakov khi nhắc tới đồng cấp Grantz trong lời thưa với Tanya ở p000067 dùng đại từ lịch sự `anh ấy`. (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 2 đoạn: p000063 (`*Tôi trông cậy vào cậu đấy*`) và p000070 (`*À, chắc cô ấy tưởng mình là kiểu người ép cấp dưới phải tin rằng chỉ cần có ý chí sắt đá là làm được tất cả rồi. Mình làm cô ấy hoảng sợ mất rồi.*`), không phát sinh dấu `*` ngoài nguồn ở 24 đoạn còn lại."
  alternatives_vi:
  - sợi dây gắn kết mà ta có thể tin cậy nhất chính là tình bằng hữu (thay cho kết cấu khái quát vô nhân xưng `sợi dây gắn kết đáng tin cậy nhất chính là tình bằng hữu` tại chapter001_r/p000074 — ưu tiên kết cấu vô nhân xưng để giữ nhịp câu trần thuật gián tiếp cô đọng, tự nhiên và tuân thủ quy ước `direct-address choice`)
