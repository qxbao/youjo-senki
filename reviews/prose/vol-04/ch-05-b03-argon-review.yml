  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm và định danh đơn vị đã khóa tạm từ Tập 1–3, Chương 1–4 Tập 4 và `vol-04-ch-05-b01` → `vol-04-ch-05-b02` (`Weiss`, `Serebryakov`, `Tanya`, `Grantz`, `mệnh lệnh tác chiến`, `tố chất`, `Thiếu tá`, `cuộc họp các chỉ huy`, `sĩ quan phụ tá`, `Trung úy Serebryakov`, `Trung úy Grantz`, `Đại úy Weiss`, `Trung úy`, `Không đoàn Tiêm kích số 103` / `không đoàn tiêm kích`, `Bộ Tổng tham mưu`, `hệ thống chỉ huy`, `mặt trận Rhine`, `Norden`, `cựu binh mặt trận Rhine`), đồng thời khóa tạm các thuật ngữ hành chính – tổ chức quân sự mới phát sinh trong lô (`báo cáo hậu chiến`, `biểu mẫu`, `công việc hành chính`, `đơn vị nghiên cứu điều tra`, `năng lực ứng phó`, `các mối quan hệ ngang cấp`, `các đoàn điều tra`, `giới tư vấn`)."
