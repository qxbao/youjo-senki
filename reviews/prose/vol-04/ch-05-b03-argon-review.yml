  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, giữ đồng bộ hệ đại từ của Tanya (`nó` trong trần thuật, `mình` / `Mình` trong nội tâm, `tôi` / `chúng ta` trong thoại chỉ huy), hệ xưng hô điều lệnh với Đại úy Weiss, Trung úy Serebryakov và Trung úy Grantz, kết cấu khái quát vô nhân xưng ở p000070 & p000074, cùng phạm vi nhấn mạnh in nghiêng ở 2 đoạn p000063 và p000070."
