  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm, địa danh, cơ quan và đơn vị quân sự đã khóa tạm từ Tập 1–3, Chương 1–4 Tập 4 và `vol-04-ch-05-b01` → `vol-04-ch-05-b05` (`đơn vị nghiên cứu điều tra`, `Bộ Tổng tham mưu`, `Hợp chúng quốc`, `mặt trận Rhine`, `Lục quân Đế quốc`, `Lục quân Cộng hòa`, `Liên minh Hiệp ước`, `Khối Thịnh vượng chung`, `hải quân đánh bộ`, `pháp sư hải quân đánh bộ`, `lực lượng tình nguyện`, `Tanya`, `Đế quốc`, `giành quyền làm chủ bầu trời`, `Eo biển Chim Dodo`, `Thiếu tá von Degurechaff`, `ưu thế trên không`, `Degurechaff`, `Với tất cả sự kính trọng`, `Bộ Ngoại giao`, `quyền tự quyết`, `ngoài thực địa`, `hậu phương`, `Tanya von Degurechaff`), đồng thời khóa tạm các thuật ngữ học thuyết sử dụng pháp sư của các nước, đại chiến lược và pháp lý – triết học mới phát sinh trong lô (`quân tình nguyện`, `học thuyết`, `đơn vị đặc nhiệm`, `đơn vị hỗn hợp`, `bộ binh biết bay`, `binh chủng độc lập`, `đội xung kích`, `toán đổ bộ đột kích giữa các chiến hạm`, `yểm trợ đường không tầm gần`, `hệ quả thứ cấp`, `đại chiến lược`, `góc nhìn sắc sảo`, `dung hợp để vượt qua mâu thuẫn`, `kẽ hở pháp lý`, `vùng xám`, `vùng đen`)."
