  locks:
  - "Giữ đại từ trần thuật `Nó` (theo DEC-P01-001), tên riêng `Tanya von Degurechaff`, đại từ `họ` và các cụm `kẽ hở pháp lý`, `Vùng xám muôn năm`, `vùng đen`, `bất cứ thứ gì không phải màu đen thì đều là màu trắng`."
