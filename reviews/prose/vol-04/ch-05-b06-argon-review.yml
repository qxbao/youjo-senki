- source_term: commanders_conference_debate_tanya_pov_pronouns_generic_you_and_three_emphases_vol04_ch05_b06
  proposed_vi: "Toàn bộ 30 đoạn trong `vol-04-ch-05-b06` (chapter001_r/p000149–p000178) nối tiếp trực tiếp phần phát biểu đề xuất của Tanya và cuộc tranh luận tại hội nghị các chỉ huy tác chiến ở cuối `vol-04-ch-05-b05`, tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`: (1) Tại p000153, p000157 và p000167 có đại từ ngôi thứ hai phiếm chỉ trong nguồn: chuyển tự nhiên sang kết cấu khái quát vô nhân xưng (`Có thể xem đó là...` tại p000153; `Đó là lý do dẫn đến những kiểu tác chiến như...` tại p000157; `Nếu xét đến khả năng...` tại p000167) theo đúng quy ước `direct-address choice` trong `work/run-state/pending-terms.yml`. (2) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya: quy chiếu `Tanya` / `Degurechaff` / `Tanya von Degurechaff` nhất quán bằng tên riêng và đại từ `nó` / `Nó` kết hợp phản thân `mình` (p000151, p000160, p000162, p000169, p000176–p000178 — tuyệt đối không dùng `cô` / `cô ấy` cho Tanya trong lời kể hay độc thoại nội tâm); quy chiếu các sĩ quan dự họp và các đơn vị pháp sư bằng `họ` / `Họ` (p000152, p000153, p000155, p000156, p000165, p000178). (3) Trong nhận định nội tâm của Tanya (p000161): dùng đại từ gộp `chúng ta` chỉ toàn phía Đế quốc (`Sớm muộn gì Hợp chúng quốc cũng sẽ đánh chúng ta thôi.`). (4) Trong hội thoại quân sự tại cuộc họp các chỉ huy tác chiến (p000149–p000151, p000154, p000158–p000160, p000163, p000164, p000166, p000167, p000170–p000172, p000174–p000176): Tanya (p000149, p000151, p000154, p000159, p000160, p000163, p000176) tự xưng `tôi`, dùng `chúng tôi` khi chỉ riêng đơn vị nghiên cứu điều tra của mình (p000149), dùng `chúng ta` / `Chúng ta` khi gộp chung các chỉ huy tại hội nghị, và dùng tiểu từ kính ngữ `ạ` khi nêu đề xuất hoặc xin phép phát biểu trước cấp chủ trì (p000149, p000176); người chủ trì và các sĩ quan dự họp tự xưng `tôi` / `Tôi`, dùng đại từ gộp `chúng ta` / `Chúng ta`, gọi Tanya là `cô` (p000150) và `Thiếu tá von Degurechaff` (p000167), gọi tập thể các sĩ quan dự họp là `Các vị` (p000164 — đồng bộ `plural-address-p000076`), và gọi đồng cấp đang tranh luận trực tiếp là `anh` / `Anh` kèm cụm lễ tiết `Với tất cả sự kính trọng` (p000171, p000172 — đồng bộ `vol01_ch05_b09_argon_decisions`). (5) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 3 đoạn: p000151 (`*Đúng vậy.*`), p000162 (`*Chính vì thế*`), và p000177 (`*Chúng ta cứ dung hợp để vượt qua mâu thuẫn này đi*`), không phát sinh dấu `*` ngoài nguồn ở 27 đoạn còn lại."
  alternatives_vi:
  - Người ta có thể xem đó là (thay cho cấu trúc vô nhân xưng `Có thể xem đó là` tại chapter001_r/p000153 — ưu tiên `Có thể xem đó là` vì gọn, tự nhiên và tuân thủ quy ước `direct-address choice`)
