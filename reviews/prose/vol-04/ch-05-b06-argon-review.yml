  proposed_vi: "đơn vị nghiên cứu điều tra, Bộ Tổng tham mưu, quân tình nguyện, Hợp chúng quốc, học thuyết, đơn vị pháp sư, mặt trận Rhine, Lục quân Đế quốc, yểm trợ bộ binh, Lục quân Cộng hòa, đơn vị đặc nhiệm, Liên minh Hiệp ước, đơn vị hỗn hợp, các chiến dịch trên không, lực lượng không quân, Khối Thịnh vượng chung, bộ binh biết bay, binh chủng độc lập, đội xung kích, tàu ngầm, toán đổ bộ đột kích giữa các chiến hạm, yểm trợ đường không tầm gần, hải quân đánh bộ, pháp sư hải quân đánh bộ, lực lượng tình nguyện, hệ quả thứ cấp, Tanya, Đế quốc, phe chống Đế quốc, leo thang xung đột, mục tiêu chiến lược, giành quyền làm chủ bầu trời, Eo biển Chim Dodo, đại chiến lược, Thiếu tá von Degurechaff, góc nhìn sắc sảo, ưu thế trên không, Degurechaff, sức mạnh không quân trong khu vực, dư luận, Với tất cả sự kính trọng, Bộ Ngoại giao, quyền tự quyết, ngoài thực địa, hậu phương, dung hợp để vượt qua mâu thuẫn, Tanya von Degurechaff, kẽ hở pháp lý, vùng xám, vùng đen (chapter001_r/p000149, p000151–p000163, p000166–p000172, p000174, p000176–p000178)"
