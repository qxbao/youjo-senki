  volume: vol-04
  chapter: 3
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa phân cảnh đối thoại của hai vị trung tướng tại Bộ Tổng tham mưu (`tôi` – `ông`, `chúng ta`, `Chúng tôi`, `họ`) và phân cảnh điểm nhìn của Tanya tại Doanh trại Lâm thời số 21 (trần thuật dùng `nó` cho Tanya, `anh` cho Weiss và Grantz, `họ` cho đơn vị; nội tâm của Tanya dùng `mình`, `chúng tôi` / `Chúng tôi`; đối thoại quân vụ giữa chỉ huy và thuộc cấp dùng `tôi` / `Tôi` – `anh` / `cô` / `Thiếu tá`, và giữa Weiss với Grantz dùng `Cậu` – `Đại úy Weiss ... ạ`)."
