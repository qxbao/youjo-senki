  proposed_vi: "Cục Hậu cần, cụm dự bị thuộc Bộ Tổng tham mưu, Bộ Tổng tham mưu, lực lượng dự bị chiến lược (chapter001_l/p000064, p000102) / Cụm A, Cụm B, kế hoạch nội tuyến, các yêu cầu về lịch trình đường sắt, Rudersdorf, Zettour, Cục Đường sắt (chapter001_l/p000066–p000069) / NĂM THỐNG NHẤT 1926, DOANH TRẠI LÂM THỜI SỐ 21, CỤM TẬP ĐOÀN QUÂN PHÍA ĐÔNG (Cụm tập đoàn quân phía Đông), LỤC QUÂN ĐẾ QUỐC (chapter001_l/p000070, p000096) / Moskva, Tiểu đoàn Pháp sư Trên không số 203, tác chiến phi quy ước, đội ngũ nhân sự hậu phương, bộ chỉ huy căn cứ (chapter001_l/p000071–p000073, p000080) / Thiếu tá von Degurechaff (Thiếu tá / Tanya), Đại úy Weiss (Weiss), nhiệm vụ trực ban, Trung úy Serebryakov (Serebryakov), sở chỉ huy tiểu đoàn (chapter001_l/p000074, p000077, p000081, p000083, p000086, p000090, p000092, p000096–p000098) / Trung úy Grantz (Trung úy / Grantz), mặt trận Rhine, huấn luyện chấn chỉnh lại từ đầu, buổi phổ biến nhiệm vụ, thông báo chung, lệnh trực chờ (chapter001_l/p000084, p000086, p000088, p000089, p000091, p000093, p000094, p000098, p000102)"
  alternatives_vi:
