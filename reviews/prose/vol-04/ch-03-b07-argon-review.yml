  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b06` của Tập 4 (`Cục Hậu cần`, `Bộ Tổng tham mưu`, `lực lượng dự bị chiến lược`, `Cụm A`, `Cụm B`, `kế hoạch nội tuyến`, `Rudersdorf`, `Zettour`, `Cục Đường sắt`, `NĂM THỐNG NHẤT 1926`, `Cụm tập đoàn quân phía Đông`, `Lục quân Đế quốc`, `Moskva`, `Tiểu đoàn Pháp sư Trên không số 203`, `Thiếu tá von Degurechaff` / `Thiếu tá` / `Tanya`, `Đại úy Weiss` / `Weiss`, `Trung úy Serebryakov` / `Serebryakov`, `sở chỉ huy tiểu đoàn`, `Trung úy Grantz` / `Trung úy` / `Grantz`, `mặt trận Rhine`, `buổi phổ biến nhiệm vụ`), đồng thời khóa tạm các tổ hợp thuật ngữ trong phân cảnh Zettour – Rudersdorf thống nhất phương án nội tuyến tiêu diệt Cụm A, Cụm B và phân cảnh Tiểu đoàn 203 nhận lệnh báo động khẩn tại Doanh trại Lâm thời số 21 (`cụm dự bị thuộc Bộ Tổng tham mưu`, `các yêu cầu về lịch trình đường sắt`, `DOANH TRẠI LÂM THỜI SỐ 21`, `tác chiến phi quy ước`, `đội ngũ nhân sự hậu phương`, `bộ chỉ huy căn cứ`, `huấn luyện chấn chỉnh lại từ đầu`, `thông báo chung`, `lệnh trực chờ`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: war_room_zettour_rudersdorf_and_camp_21_tanya_203rd_pronouns_vol04_ch03_b07
  proposed_vi: "Trong hai phân cảnh chuyển tiếp của lô (chapter001_l/p000064–p000102): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-03-b01` – `b06` cùng các phân cảnh Tiểu đoàn 203 ở Chương 1–2: (1) Trong phân cảnh kết thúc cuộc trao đổi giữa Trung tướng von Zettour và Trung tướng von Rudersdorf tại Phòng Tác chiến Bộ Tổng tham mưu (p000064–p000069): trần thuật ngôi thứ ba quy chiếu hai vị tướng bằng tên riêng (`Rudersdorf`, `Zettour`) và danh ngữ `Đôi bạn lâu năm` (p000068); ba cụm biểu cảm/nội tâm in nghiêng tại p000068 dùng `*Cứ để đó cho tôi*`, `*Trông cậy cả vào ông đấy*` và `*Nếu có ai làm được việc này, thì đó chính là ông ấy*` (bảo toàn đúng `DEC-P01-002`); trong đối thoại trực tiếp giữa hai vị trung tướng đồng cấp kiêm bạn hữu (p000064–p000067, p000069), người nói tự xưng `tôi`, gọi đối phương là `ông`, dùng `chúng ta` khi nói về Bộ Tổng tham mưu / Lục quân Đế quốc (p000067), dùng `Chúng tôi` khi Rudersdorf đại diện cho Cục Tác chiến (p000067), và quy chiếu Cục Đường sắt bằng `họ` (p000069). (2) Trong phân cảnh Tiểu đoàn 203 tại Doanh trại Lâm thời số 21 (p000070–p000102): trần thuật ngôi thứ ba theo điểm nhìn của Tanya quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` (p000074, p000075, p000087, p000093) kết hợp danh xưng `Thiếu tá von Degurechaff` / `Tanya` (p000074, p000081, p000086) và đại từ phản thân `mình` (p000076); trong câu độc thoại nội tâm in nghiêng tại p000098 (`*Chà, họ đã trưởng thành và trở thành những người mà mình có thể tin dùng rồi.*`) và các đoạn suy nghĩ ngôi thứ nhất của Tanya (p000099–p000102), tự quy chiếu ngôi thứ nhất số ít bằng `mình` (p000098, p000101), ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `chúng tôi` / `Chúng tôi` (p000100, p000102), và dùng chủ ngữ khái quát `Người ta` cho đại từ ngôi thứ hai phiếm chỉ tại p000099; quy chiếu Đại úy Weiss và Trung úy Grantz trong trần thuật bằng `anh` (p000077, p000086, p000088, p000093), quy chiếu tập thể Tiểu đoàn 203 và các sĩ quan thuộc quyền bằng `họ` (p000072, p000073, p000078, p000087, p000098). (3) Trong đối thoại tại căn cứ: Tanya tự xưng `tôi` / `Tôi` (p000075, p000089, p000094, p000096), gọi Grantz là `Trung úy Grantz` / `Trung úy` / `anh` (p000089, p000094), gọi Serebryakov là `Trung úy Serebryakov` / `cô` (p000096), và hô khẩu lệnh báo thức chung bằng `Tất cả các đơn vị` (p000079); Đại úy Weiss hô tập hợp đơn vị bằng `Toàn tiểu đoàn` / `anh em` (p000082) và gọi Grantz là `Cậu` / `Trung úy Grantz` (p000084); Grantz gọi Weiss là `Đại úy Weiss` kèm tiểu từ lễ phép `ạ` (p000083), và thưa với Tanya là `Thiếu tá` / `R-rõ, thưa Thiếu tá!` / `Rõ!` (p000090, p000092, p000095); Serebryakov tự xưng `Tôi` và thưa với Tanya bằng `ạ` / `Xin phép Thiếu tá!` (p000097)"
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật bám sát điểm nhìn của Tanya tại chapter001_l/p000074, p000075, p000087, p000093 — bắt buộc giữ `nó` trong trần thuật và `mình` trong nội tâm của Tanya theo đúng quy định đã duyệt tại `DEC-P01-001`) / cậu (thay cho `anh` khi Tanya nói chuyện với Trung úy Grantz tại chapter001_l/p000089, p000094 — ưu tiên `anh` để giữ đúng tác phong quân vụ nghiêm khắc của chỉ huy tiểu đoàn đối với sĩ quan cấp dưới và đồng bộ với các tập trước, phân biệt với cách gọi thân mật `Cậu` của Đại úy Weiss dành cho Grantz ở p000084)
