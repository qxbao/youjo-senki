findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000030"
    severity: "minor"
    category: "pronouns_and_register"
    issue: "Dùng 'kẻ đó' và 'tên pháp sư' cho đối tượng mà Mary đã biết là nữ (đại từ nguồn chỉ giới nữ), tạo sắc thái thiên nam giới/miệt thị chưa khớp ngữ cảnh."
    rationale: "Theo canon/style-guide.md, không tự thêm sắc thái miệt thị không có trong nguồn. Mary đã nghe danh đối phương là nữ pháp sư nên cần dùng đại từ trung tính nhất quán."
    suggestion: "Đổi 'kẻ đó' thành 'cô ta' và đổi 'tên pháp sư trong cuộc bàn tán ấy' thành 'pháp sư trong cuộc bàn tán ấy'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000031"
    severity: "moderate"
    category: "pronouns_and_register"
    issue: "Dịch đại từ ngôi thứ ba chỉ nữ trong báo cáo tình báo quân sự thành 'Ả' (3 lần), làm tăng sắc thái miệt thị không có trong nguyên bản."
    rationale: "Đây là lời phổ biến thông tin tình báo chính thức của chỉ huy đơn vị dựa trên nguồn từ sĩ quan Khối Thịnh vượng chung; nguyên bản dùng đại từ ngôi thứ ba trung tính."
    suggestion: "Đổi cả ba từ 'Ả'/'ả' thành 'Cô ta'/'cô ta'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000039"
    severity: "moderate"
    category: "pronouns_and_register"
    issue: "Dịch đại từ ngôi thứ ba chỉ nữ trong lời cảnh báo nghiêm túc của Trung tá Drake thành 'ả' (2 lần)."
    rationale: "Trung tá Drake đang phát biểu với tư cách sĩ quan liên lạc cảnh báo nghiêm túc về năng lực của đối phương; dùng 'ả' làm lệch giọng điệu quân sự chuẩn mực và vi phạm quy tắc không tự thêm sắc thái miệt thị trong canon/style-guide.md."
    suggestion: "Đổi 'ả' thành 'cô ta' ở cả hai vị trí."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000040"
    severity: "minor"
    category: "modality_and_meaning"
    issue: "Cụm 'chẳng kém gì lời nói' làm mất sắc thái giả định quá khứ ở động từ khuyết thiếu của nguồn (lẽ ra miệng bà có thể nói ra)."
    rationale: "Chỉ huy đơn vị không trực tiếp thốt ra câu nghi ngờ đó bằng lời mà biểu lộ qua nét mặt rõ ràng chẳng kém gì khi nói ra thành lời."
    suggestion: "Sửa thành 'Gương mặt bà cũng nói lên điều đó rõ ràng chẳng kém gì khi thốt ra thành lời: *Chắc hẳn ngài đang làm quá lên rồi.*'"
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000041"
    severity: "moderate"
    category: "pronouns_and_register"
    issue: "Dùng đại từ 'ả' (3 lần) trong lời nhận xét đầy thận trọng và đánh giá cao năng lực chỉ huy lẫn sức chiến đấu của đối phương từ Trung tá Drake."
    rationale: "Đoạn p000044 xác nhận thái độ của Drake là vô cùng nghiêm túc và dè chừng thực sự. Việc dùng 'ả' mâu thuẫn với thái độ tôn trọng năng lực tác chiến đối phương của một sĩ quan chuyên nghiệp."
    suggestion: "Đổi 'ả'/'Ả' thành 'cô ta'/'Cô ta' ở cả ba vị trí."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000042"
    severity: "moderate"
    category: "pronouns_and_register"
    issue: "Dùng đại từ 'Ả' trong câu hỏi xác nhận của chỉ huy đơn vị về tài chỉ huy của đối phương."
    rationale: "Giữ giọng điệu quân sự trung tính, không thêm sắc thái miệt thị theo canon/style-guide.md."
    suggestion: "Đổi 'Ả là một chỉ huy tài năng ư?' thành 'Cô ta là một chỉ huy tài năng ư?'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000043"
    severity: "moderate"
    category: "pronouns_and_register"
    issue: "Dùng đại từ 'ả' (2 lần) trong phân tích chiến thuật của Trung tá Drake."
    rationale: "Thống nhất đại từ 'cô ta' trong toàn bộ phần nhận định chuyên môn quân sự của Drake."
    suggestion: "Đổi cả hai từ 'ả' thành 'cô ta'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000053"
    severity: "moderate"
    category: "terminology_and_meaning"
    issue: "Dịch 'the mainland' thành 'lục địa chính' gây nhầm lẫn địa lý với lục địa châu Âu (nơi Đế quốc kiểm soát), và dịch 'recover you' thành 'thu hồi và cứu hộ các bạn' dùng từ 'thu hồi' vốn chỉ đồ vật cho con người."
    rationale: "Bối cảnh diễn ra trên không phận Khối Thịnh vượng chung (quốc đảo, tương ứng thuật ngữ pending 'Home Fleet' = 'Hạm đội bản thổ' và đối lập với 'trên đất địch' ở vế sau); từ nguồn ở đây chỉ vùng lãnh thổ chính/bản thổ. Ngoài ra đối với sinh mạng phi công/pháp sư bị bắn rơi, chỉ nên dùng 'cứu hộ' hoặc 'đón về', không thêm 'thu hồi'."
    suggestion: "Đổi 'phòng thủ lục địa chính' thành 'phòng thủ bản thổ' và đổi 'thu hồi và cứu hộ các bạn' thành 'cứu hộ các bạn'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000054"
    severity: "minor"
    category: "viewpoint_and_pronouns"
    issue: "Dùng đại từ 'bạn' trong câu trần thuật gián tiếp tự do thể hiện nhận thức của Mary nghe giống văn phong dịch sát từ đại từ khái quát tiếng Anh."
    rationale: "Trong trần thuật tiếng Việt bám điểm nhìn nhân vật, lược đại từ khái quát sẽ tự nhiên và giữ đúng mạch suy nghĩ nội tâm gián tiếp hơn."
    suggestion: "Đổi câu cuối thành 'Ngay cả khi bị rơi xuống, chỉ cần còn sống là vẫn có thể chiến đấu vào một ngày khác.'"
