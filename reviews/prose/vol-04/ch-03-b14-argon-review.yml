  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa trần thuật khách quan tại Phòng Tác chiến (`ông` / `mình` cho Rudersdorf, `anh ta` cho viên sĩ quan tham mưu, `họ` cho phía Đế quốc, `chúng` cho phía Liên bang) với hệ thống xưng hô chuẩn quân phong trong lời thoại giữa Phó cục trưởng Cục Tác chiến và các sĩ quan tham mưu cấp dưới, đồng thời bảo toàn chính xác cả 5 vị trí nhấn mạnh in nghiêng của nguyên tác."
