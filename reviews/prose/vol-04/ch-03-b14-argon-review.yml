- source_term: war_room_rudersdorf_staff_perspective_pronouns_and_emphasis_vol04_ch03_b14
  proposed_vi: "Trong phân cảnh suy ngẫm của Trung tướng von Rudersdorf và cuộc trao đổi với các sĩ quan tham mưu tại Phòng Tác chiến Bộ Tổng tham mưu Lục quân Đế quốc (chapter001_l/p000298–p000330): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b01` – `b13`: (1) Trần thuật ngôi thứ ba khách quan tại Phòng Tác chiến quy chiếu Trung tướng von Rudersdorf bằng đại từ trang trọng trung tính `ông` kết hợp phản thân `mình` (p000299, p000307, p000317, p000319, p000321) và tên riêng `Rudersdorf` (p000301–p000303, p000316, p000320, p000327, p000330); quy chiếu viên sĩ quan tham mưu đối thoại trực tiếp với Rudersdorf bằng danh ngữ `người đối diện` / `Viên sĩ quan tham mưu` / `viên sĩ quan` và đại từ `anh ta` (p000316, p000327, p000330); quy chiếu tập thể Bộ Tổng tham mưu / Lục quân Đế quốc bằng `họ` kết hợp phản thân `mình` (p000304, p000307, p000312) và quy chiếu quân đội Liên bang bằng `chúng` (p000317, p000319, p000320, p000324). (2) Trong lời thoại tại Phòng Tác chiến: Trung tướng von Rudersdorf tự xưng `tôi` / `Tôi` và `chúng ta` / `Chúng ta`, gọi sĩ quan tham mưu cấp dưới là `anh`, và gọi quân địch Liên bang là `chúng` / `Lũ khốn này` (p000300, p000305, p000308, p000314, p000316, p000318, p000322, p000324, p000326, p000328); các sĩ quan tham mưu tự xưng `tôi` / `Chúng tôi` và `chúng ta` / `quân ta`, gọi Rudersdorf kính cẩn là `Tướng quân` / `Tướng von Rudersdorf` kèm kính ngữ `ạ`, và quy chiếu quân địch Liên bang là `chúng` (p000309, p000311, p000313, p000315, p000325, p000329). (3) Bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại đúng 5 đoạn có thẻ in nghiêng trong nguồn là p000306 (`*Lo liệu từ trước là phòng ngừa hậu họa.*`), p000310 (`*Nhưng*`), p000321 (`*Thiệt tình.*`), p000327 (`*Tại sao ạ?*`) và p000330 (`*Cuộc chiến này không có quy tắc nào hết!*`), không phát sinh dấu `*` ngoài nguồn ở 28 đoạn còn lại."
  alternatives_vi:
  - ngài (thay cho `ông` trong trần thuật quy chiếu Rudersdorf tại chapter001_l/p000299, p000307, p000317, p000319, p000321 — ưu tiên `ông` để giữ giọng trần thuật khách quan trung tính nhất quán với `vol-04-ch-03-b01` – `b13`)
