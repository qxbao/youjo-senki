  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự/pháp lý đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b13` của Tập 4 (`tác chiến cơ động`, `Trung tướng von Zettour` / `Zettour`, `pháo tự hành`, `pháo hạng nặng`, `Rudersdorf` / `Tướng von Rudersdorf` / `Tướng quân`, `Thượng đế`, `Bộ Tổng tham mưu Lục quân Đế quốc`, `sĩ quan Bộ Tổng tham mưu`, `Norden`, `mặt trận Rhine`, `tiền tuyến`, `lực lượng không quân Đế quốc`, `Tiegenhoff`, `Lục quân Liên bang`, `Liên bang`, `đòn nghi binh`, `Arene`, `Lục quân Đế quốc`, `tác chiến đô thị`, `luật pháp quốc tế`, `luật chiến tranh`, `công ước tôn trọng luật chiến tranh trên bộ`, `tù binh`), đồng thời khóa tạm các cụm từ mới xuất hiện trong lô (`các pha cơ động nội tuyến`, `người hùng ngồi bàn giấy`, `Lo liệu từ trước là phòng ngừa hậu họa.`, `lối tấn công phân tán`)."
