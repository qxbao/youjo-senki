  proposed_vi: "cứ điểm đang bị bao vây, chiến trường phía đông, tác chiến cơ động, Trung tướng von Zettour, bộ binh địch, pháo binh, pháo tự hành, đại bác, pháo hạng nặng, hỏa lực vượt trội, Rudersdorf, Thượng đế, các pha cơ động nội tuyến, Bộ Tổng tham mưu Lục quân Đế quốc, sĩ quan Bộ Tổng tham mưu, người hùng ngồi bàn giấy, Norden, mặt trận Rhine, tiền tuyến, Lo liệu từ trước là phòng ngừa hậu họa., Tướng quân, lực lượng không quân Đế quốc, Tiegenhoff, thế gọng kìm (chapter001_l/p000298–p000306, p000309, p000311) / lối tấn công phân tán, Lục quân Liên bang, các lộ trình tiến công, đòn nghi binh, Tướng von Rudersdorf, Liên bang, đòn đánh úp, Zettour, căn cứ kháng cự, luật chiến tranh, Arene, Lục quân Đế quốc, tác chiến đô thị, luật pháp quốc tế, công ước tôn trọng luật chiến tranh trên bộ, viên sĩ quan tham mưu, tù binh (chapter001_l/p000313, p000315–p000320, p000322–p000325, p000327–p000330)"
  alternatives_vi:
  - cơ động tuyến trong (thay cho `các pha cơ động nội tuyến` tại chapter001_l/p000304 — ưu tiên `các pha cơ động nội tuyến` để nhất quán với thuật ngữ quân sự `nội tuyến` đã khóa tạm ở các tập trước) / anh hùng bàn giấy (thay cho `người hùng ngồi bàn giấy` tại chapter001_l/p000305 — ưu tiên `người hùng ngồi bàn giấy` để tránh sắc thái tiếng lóng mạng hiện đại và giữ đúng ngữ cảnh sĩ quan tham mưu ngồi bàn giấy tại tổng hành dinh) / Phòng bệnh hơn chữa bệnh. (thay cho `Lo liệu từ trước là phòng ngừa hậu họa.` tại chapter001_l/p000306 — ưu tiên `Lo liệu từ trước là phòng ngừa hậu họa.` để sát nghĩa chuẩn bị công tác tham mưu/hậu cần từ trước nhằm ngăn chặn rủi ro chiến sự)
