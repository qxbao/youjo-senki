  proposed_vi: "luật pháp quốc tế, Liên bang, Đế quốc, Cục Hậu cần, công ước, nguyên tắc có đi có lại, Đảng Cộng sản, xử bắn, bạo lực nội bộ kiểu Gewalt (chapter001_l/p000331–p000333) / NGÀY 28 THÁNG 3, NĂM THỐNG NHẤT 1926, SỞ CHỈ HUY CỤM TIẾN CÔNG CHỦ LỰC, Lục quân Đế quốc, Cụm B, Cụm Tiến công Chủ lực, tác chiến trì hoãn, Cụm tập đoàn quân phía Đông, cuộc họp hội đồng chiến tranh, sở chỉ huy, tướng lĩnh, sĩ quan tham mưu, pháo hạng nặng, cách mạng, pháo binh chi viện, Lục quân Liên bang, các Đồng chí Tướng quân, Đồng chí Chính ủy, các sĩ quan chính trị, các chỉ thị của Đảng, công tác chính trị trong quân đội, vị chủ tọa, Thiệt tình (chapter001_l/p000334–p000336, p000338, p000340, p000341, p000343–p000349, p000351–p000353) / Moskva, môi trường chính trị đặc thù, tiền tuyến, hậu phương, xa rời thực tế, học thuyết, Đại Quân, chi viện, không chiến, các đơn vị pháp sư, hoàn cảnh cấp bách (chapter001_l/p000355, p000357, p000358, p000360–p000363, p000365, p000366, p000368, p000369)"
  alternatives_vi:
