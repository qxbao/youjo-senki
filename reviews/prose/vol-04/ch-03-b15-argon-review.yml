  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch ở cuối cảnh Phòng Tác chiến Đế quốc (`chúng ta` / `anh` — `Chúng ta... ạ`) và sự phân biệt rạch ròi giữa trần thuật khách quan tại Sở chỉ huy Cụm Tiến công Chủ lực (`họ` / `mình`, `người ta`) với hệ thống xưng hô đặc trưng của quân đội Liên bang (`các Đồng chí Tướng quân` — `Đồng chí Chính ủy`, `tôi` / `chúng tôi` – `đồng chí` / `các đồng chí`, `chúng ta`), đồng thời bảo toàn chính xác cả 5 vị trí nhấn mạnh in nghiêng của nguyên tác."
