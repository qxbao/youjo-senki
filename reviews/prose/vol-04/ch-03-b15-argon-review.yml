  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự/pháp lý đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b14` của Tập 4 (`luật pháp quốc tế`, `Liên bang`, `Đế quốc`, `Cục Hậu cần`, `xử bắn`, `NĂM THỐNG NHẤT 1926`, `Lục quân Đế quốc`, `Cụm B`, `tác chiến trì hoãn`, `Cụm tập đoàn quân phía Đông`, `sĩ quan tham mưu`, `pháo hạng nặng`, `Lục quân Liên bang`, `Đồng chí Chính ủy`, `vị chủ tọa`, `Moskva`, `tiền tuyến`, `hậu phương`, `học thuyết`, `Đại Quân`, `không chiến`, `các đơn vị pháp sư`), đồng thời khóa tạm các thuật ngữ và danh xưng mới xuất hiện trong lô (`nguyên tắc có đi có lại`, `Đảng Cộng sản`, `bạo lực nội bộ kiểu Gewalt`, `SỞ CHỈ HUY CỤM TIẾN CÔNG CHỦ LỰC` / `Cụm Tiến công Chủ lực`, `cuộc họp hội đồng chiến tranh`, `các Đồng chí Tướng quân`, `các sĩ quan chính trị`, `các chỉ thị của Đảng`, `công tác chính trị trong quân đội`)."
  uncertainty: low
  status: pending
