- source_term: war_room_conclusion_and_federation_war_council_pronouns_and_emphasis_vol04_ch03_b15
  proposed_vi: "Trong đoạn kết cuộc trao đổi tại Phòng Tác chiến Bộ Tổng tham mưu Đế quốc (chapter001_l/p000331–p000333) và phân cảnh cuộc họp hội đồng chiến tranh tại Sở chỉ huy Cụm Tiến công Chủ lực của Liên bang (chapter001_l/p000334–p000369): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b01` – `b14`: (1) Đoạn kết tại Phòng Tác chiến Bộ Tổng tham mưu Đế quốc (p000331–p000333): Trung tướng von Rudersdorf dùng `chúng ta` cho phía Đế quốc và gọi viên sĩ quan tham mưu cấp dưới là `anh` (p000331, p000333); viên sĩ quan tham mưu dùng `Chúng ta` kèm tiểu từ kính ngữ `ạ` ở cuối câu (p000332). (2) Trần thuật ngôi thứ ba khách quan và suy nghĩ tập thể tại Sở chỉ huy Cụm Tiến công Chủ lực của Liên bang (p000335–p000338, p000341–p000343, p000346, p000350, p000352–p000363, p000366–p000368): quy chiếu tập thể Cụm Tiến công Chủ lực, các tướng lĩnh, sĩ quan tham mưu và sĩ quan chính trị của Lục quân Liên bang bằng đại từ trung tính `họ` / `Họ` kết hợp phản thân `mình`; dùng chủ ngữ khái quát `người ta` ở p000359 và p000363 cho các nhận định khái quát. (3) Trong lời thoại tại cuộc họp hội đồng chiến tranh và trao đổi riêng giữa các sĩ quan Liên bang (p000339, p000340, p000344, p000345, p000347–p000349, p000351, p000364, p000365, p000369): giữa Chính ủy và các tướng lĩnh Liên bang dùng danh xưng chuẩn mực `các Đồng chí Tướng quân` — `Đồng chí Chính ủy`, xưng hô `tôi` / `Tôi` – `chúng tôi` / `Chúng tôi` và `đồng chí` / `các đồng chí` (p000344, p000345, p000347–p000349); vị chủ tọa gọi các thành viên dự họp là `thưa các vị` (p000351); trong báo cáo chung và trao đổi riêng giữa các sĩ quan (p000339, p000340, p000364, p000365, p000369), tự xưng `tôi` / `Tôi`, dùng `chúng ta` cho phía quân đội Liên bang và gọi đối phương bằng `đồng chí` (p000365). (4) Bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại đúng 5 đoạn có thẻ in nghiêng trong nguồn là p000352 (`*Thiệt tình*`), p000358 (`*Nhưng*`), p000363 (`*xa rời thực tế*`), p000364 (`*thực chất*`) và p000367 (`*Và tệ nhất là…*`), không phát sinh dấu `*` ngoài nguồn ở 34 đoạn còn lại."
  alternatives_vi:
  - các đồng chí (thay cho `các vị` trong lời của vị chủ tọa tại chapter001_l/p000351 — ưu tiên `thưa các vị` để bám sát sắc thái lịch sự xã giao của từ gốc khi vị chủ tọa đứng ra làm dịu bầu không khí căng thẳng)
