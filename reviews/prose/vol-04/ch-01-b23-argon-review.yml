  proposed_vi: "Trong phần kết trích đoạn sách giáo khoa thiếu nhi của Liên bang (chapter001_d/p000362–p000385): tiếp nối B22, lãnh tụ Josef được gọi là `Bác Josef` / `bác Josef` / `bác Josef kính yêu` và quy chiếu ngôi thứ ba bằng `bác` xuyên suốt (p000364, p000365, p000367, p000369–p000377, p000380–p000383), dùng `mình` ở cụm sở hữu phản thân (p000374); Loria được gọi là `Đồng chí Loria` (p000364, p000377, p000381); khi quy chiếu chung cả Josef và Loria hoặc phía Liên bang dùng `hai người họ` / `họ` (p000362, p000363, p000377–p000379), gọi các kẻ thù đế quốc quân phiệt là `bọn chúng` (p000379) và người dân Liên bang là `họ` / `mình` (p000383). Trong phân cảnh trần thuật lịch sử tại thủ đô Moskva năm 1926 (chapter001_d/p000386–p000406): chuyển sang giọng trần thuật khách quan, sắc lạnh phơi bày quá trình thâu tóm quyền lực độc tài của Josef bằng cách quy chiếu ngôi thứ ba là `Ông ta` / `ông ta` xuyên suốt (p000387–p000397, p000400–p000402), dùng `mình` ở mệnh đề phụ thuộc phản thân (p000390, p000391, p000400), và định danh là `người đàn ông tên Josef` / `tên độc tài` / `Josef` (p000399, p000406)"
  alternatives_vi:
  - hắn / hắn ta (thay cho `ông ta` trong phần trần thuật lịch sử về Josef tại chapter001_d/p000387–p000402 — ưu tiên `ông ta` vì giữ được giọng văn biên niên sử chính trị đanh thép, lạnh lùng và khách quan của người kể chuyện ngôi thứ ba, đồng thời tạo độ tương phản sắc sảo với đại từ tôn kính giả tạo `bác` trong cuốn sách giáo khoa thiếu nhi ngay trước đó mà không rơi vào khẩu ngữ suồng sã)
