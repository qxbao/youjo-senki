  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán tuyệt đối quy ước xưng hô quân sự trên Mặt trận phía Nam giữa Tướng von Romel, các sĩ quan tham mưu, Tướng de Lugo và cách Romel quy chiếu vị tiểu đoàn trưởng thuộc cấp cũ Thiếu tá Tanya von Degurechaff (`cô ấy`, đồng bộ với B04 và B18)."
