- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000235
  locks:
  - "Giữ ba câu suy nghĩ nội tâm nhấn mạnh `*Mình đoán tất cả những gì mình có thể làm là chúc Thiếu tá von Degurechaff may mắn. Việc mình tin rằng cô ấy chẳng cần tới những lời chúc tốt đẹp của mình hẳn có nghĩa là mình đã quá tin tưởng cô ấy rồi. Chà, thế cũng chẳng sao.*` theo DEC-P01-002 và tên riêng `Romel` ở câu trần thuật kết đoạn."
