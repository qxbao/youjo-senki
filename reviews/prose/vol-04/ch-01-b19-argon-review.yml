  proposed_vi: "quân Cộng hòa, Romel (chapter001_d/p000194, p000196, p000198, p000231, p000235) / Lục quân Đế quốc, toán quân khóa đuôi, bẫy phương tiện bỏ hoang, bẫy mìn (chapter001_d/p000196, p000206) / Tướng quân, pháp sư (chapter001_d/p000202, p000203, p000218–p000220, p000227, p000229, p000231) / lũ ngốc Cộng hòa, vị trí phòng ngự (chapter001_d/p000205) / sĩ khí (chapter001_d/p000206, p000211) / đơn vị trung tâm, tái tổ chức lực lượng (chapter001_d/p000207, p000219) / chuỗi chỉ huy (chapter001_d/p000208) / lực lượng chủ lực (chapter001_d/p000209) / trận trì hoãn (chapter001_d/p000210) / bao vây, phá vây tháo chạy, siết chặt vòng vây (chapter001_d/p000211, p000212, p000214) / tầm nhìn hạn hẹp, mạn sườn sơ hở (chapter001_d/p000215) / Lục quân Cộng hòa, de Lugo (chapter001_d/p000216) / Thiếu tá von Degurechaff (chapter001_d/p000222, p000235) / chính quốc (chapter001_d/p000226) / Liên bang (chapter001_d/p000228, p000230, p000232) / bộ chỉ huy (chapter001_d/p000229) / Tiểu đoàn Pháp sư Trên không số 203, tác chiến cơ động theo lối du kích, Bộ Tổng tham mưu, Cộng hòa, đơn vị cơ động (chapter001_d/p000230, p000231) / tiểu đoàn Tanya, hậu cần (chapter001_d/p000231)"
  alternatives_vi:
  - phương tiện bỏ lại gài bẫy (thay cho `bẫy phương tiện bỏ hoang` tại chapter001_d/p000196 — ưu tiên `bẫy phương tiện bỏ hoang` vì cô đọng, sát cấu trúc danh ngữ quân sự trong nguồn và tạo nhịp sóng đôi tự nhiên với `bẫy mìn` ở vế sau) / cánh quân trung tâm (thay cho `đơn vị trung tâm` tại chapter001_d/p000207, p000219 — ưu tiên `đơn vị trung tâm` vì giữ nguyên cấp độ đơn vị trung tính của nguyên bản khi Romel điều phối đội hình câu giờ ở chính diện)
