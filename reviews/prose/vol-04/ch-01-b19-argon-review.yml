  proposed_vi: "Trần thuật từ điểm nhìn của Tướng von Romel quy chiếu Romel bằng `ông` (chapter001_d/p000198, p000200, p000201, p000208, p000220, p000223, p000226, p000227, p000229, p000231) và giữ nguyên tên riêng `Romel` (chapter001_d/p000194, p000196, p000198, p000231, p000235); quy chiếu Tướng de Lugo của phe Cộng hòa bằng `ông ta` (chapter001_d/p000216); quy chiếu Thiếu tá Tanya von Degurechaff trong mạch lời kể gián tiếp tự do bám sát hồi tưởng của Romel bằng `cô ấy` (chapter001_d/p000223, p000226, p000229) và giữ nguyên tên riêng `Tanya` (chapter001_d/p000231); nội tâm tự quy chiếu ngôi thứ nhất số ít của Romel dùng `mình` (chapter001_d/p000200, p000235), riêng câu độc thoại nội tâm hướng trực tiếp về phía đối phương trên chiến trường dùng `tôi` (chapter001_d/p000217), và quy chiếu Tanya bằng `Thiếu tá von Degurechaff` / `cô ấy` (chapter001_d/p000235); trong đối thoại giữa Romel và các sĩ quan tham mưu: Romel tự xưng `tôi`, gọi tập thể quân mình là `chúng ta`, quy chiếu Tanya bằng `Thiếu tá von Degurechaff` / `cô ấy` (chapter001_d/p000198, p000203, p000207, p000209, p000214, p000219, p000222, p000225, p000232, p000234), còn các sĩ quan tham mưu báo cáo, hỏi xin chỉ thị và nhận lệnh bằng `Rõ`, `Thưa Tướng quân`, xưng `tôi` / `chúng ta` kèm tiểu từ lễ phép `ạ` (chapter001_d/p000195, p000202, p000213, p000218, p000221, p000228, p000233)"
  alternatives_vi:
  - nó (thay cho `cô ấy` khi quy chiếu Tanya trong mạch trần thuật điểm nhìn Romel tại chapter001_d/p000223, p000226, p000229 — ưu tiên `cô ấy` vì tuân thủ đúng giới hạn của `DEC-P01-001` là không tự mở rộng đại từ `nó` sang chủ thể điểm nhìn khác ngoài Tanya, đồng thời tiếp nối liền mạch cách Romel gọi Tanya là `cô` ở B04 và nghĩ về Tanya là `cô ấy` tại p000191 của B18 cũng như p000225, p000235 của B19)
