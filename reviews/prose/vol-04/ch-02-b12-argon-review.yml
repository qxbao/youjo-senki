  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, chức danh, quốc gia, địa danh, cơ quan và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B11 Chương 2 của Tập 4 (`Moskva`, `quốc ca Đế quốc`, `pháp sư`, `Sildberia`, `NGÀY 17 THÁNG 3, NĂM THỐNG NHẤT 1926, KHỐI THỊNH VƯỢNG CHUNG, LONDINIUM`, `Khối Thịnh vượng chung`, `Londinium`, `Đệ nhất Lãnh chúa Hải quân`, `Hải quân`, `đại sứ quán`, `Tình báo` / `sĩ quan Tình báo`, `Thiếu tướng Habergram`, `Cục Chiến lược Đối ngoại`, `đơn vị pháp sư`, `pháp sư Đế quốc`, `chiến dịch tuyên truyền`, `phô diễn thị uy`, `sĩ khí`, `Liên bang`, `trung đoàn`, `trụ sở cảnh sát mật`, `lá cờ Đế quốc`, `Điện Kremlin`), đồng thời khóa tạm các thuật ngữ và danh xưng xuất hiện trong hai phân cảnh mở đầu `chapter001_h.xhtml` (`đối thủ chính trị`, `phần tử bất đồng chính kiến`, `hệ tư tưởng`, `các tuyến giao thương` / `các tuyến thương mại`, `Quảng trường Cách mạng` — tên gọi chính thức trong báo cáo ngoại giao của Khối Thịnh vượng chung, phân biệt hợp lý với cách gọi châm biếm `Quảng trường Cộng sản` của Tanya ở B11)."
  uncertainty: low
  status: pending
