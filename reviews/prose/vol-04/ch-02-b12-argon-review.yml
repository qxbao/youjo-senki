  proposed_vi: "Trong hai phân cảnh mở đầu `chapter001_h.xhtml` (chapter001_h/p000001–p000034): (1) Ở phân cảnh cơn cuồng si bệnh hoạn và độc thoại của Loria tại Moskva (p000001–p000017), tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch B05–B07 cùng B11: trần thuật ngôi thứ ba quy chiếu Loria bằng `Ông ta` / `ông ta` xuyên suốt (p000002, p000003, p000009, p000014, p000015) kết hợp đại từ phản thân `mình` (p000002, p000009, p000015); trong độc thoại nội tâm trực tiếp (p000006–p000009, p000012, p000016, p000017), Loria tự quy chiếu ngôi thứ nhất bằng `Mình` / `mình`; trong lời thoại lẩm bẩm thành tiếng (p000001, p000011, p000013), Loria tự xưng `Ta` / `ta` (đồng bộ với B06); quy chiếu Tanya qua góc nhìn săn mồi bệnh hoạn của Loria bằng `con bé` xuyên suốt cả lời thoại, trần thuật lẫn nội tâm (p000001–p000009, p000011, p000012, p000014–p000016), kết hợp hình ảnh ẩn dụ `Con búp bê hoàn hảo của mình` (p000012) và `đóa hoa ấy` (p000017). (2) Ở phân cảnh Thiếu tướng Habergram báo cáo tin cuộc đột kích Moskva cho vị Đệ nhất Lãnh chúa Hải quân tại Londinium (p000018–p000034), tiếp nối `vol-02-ch-03-b21` – `b22` và `vol-04-ch-01-b20`: trần thuật ngôi thứ ba quy chiếu vị Đệ nhất Lãnh chúa Hải quân và Thiếu tướng Habergram bằng đại từ trang trọng `Ông` / `ông` (p000024, p000029) kết hợp đại từ phản thân `mình` (p000024) và chức danh/quân hàm đầy đủ (`vị Đệ nhất Lãnh chúa Hải quân`, `Thiếu tướng Habergram thuộc Cục Chiến lược Đối ngoại`); quy chiếu những người đứng đầu chính phủ Khối Thịnh vượng chung và nhân sự tại đại sứ quán bằng `họ` / `Họ` (p000020, p000030, p000034); trong đối thoại (p000021, p000025, p000031), câu hỏi của vị Đệ nhất Lãnh chúa Hải quân (p000021) và câu tóm tắt báo cáo của Habergram (p000031) dùng cấu trúc ngắn gọn trực tiếp, còn câu xác nhận ở p000025 của Habergram thưa cấp trên trọng thị bằng `Thưa ngài, đúng vậy ạ`"
  alternatives_vi:
  - hắn / gã (thay cho `Ông ta` / `ông ta` khi quy chiếu Loria trong trần thuật tại chapter001_h/p000002, p000003, p000009, p000014, p000015 — ưu tiên `Ông ta` / `ông ta` để giữ sự liền mạch tuyệt đối với B05–B07 và B11 cũng như tuân thủ quy tắc của `style-guide.md` về việc giữ giọng trần thuật khách quan) / Tôi (thay cho `Ta` / `ta` trong lời thoại độc thoại thành tiếng của Loria tại chapter001_h/p000001, p000011, p000013 — ưu tiên `Ta` / `ta` vì thể hiện đúng uy quyền tối cao của người đứng đầu cơ quan mật vụ Liên bang khi lẩm bẩm một mình và đồng bộ với B06)
