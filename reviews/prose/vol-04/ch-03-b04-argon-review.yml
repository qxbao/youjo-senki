  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ sự phân biệt rạch ròi giữa trần thuật ngôi thứ ba trang trọng (`ông`, `họ` / `Họ`, `chúng`), các mệnh đề biểu cảm/nội tâm in nghiêng tại p000087, p000095, p000104, và giọng đối thoại thẳng thắn, quyết liệt giữa hai vị trung tướng trụ cột của Bộ Tổng tham mưu Đế quốc (`tôi` / `Tôi` – `ông` / `Ông`, `chúng ta` / `Chúng ta`)."
