  proposed_vi: "Zettour, Rudersdorf, lực lượng không quân, Cục Hậu cần, biên giới phía đông, kế hoạch phòng thủ quốc gia, kiểm soát biên giới (chapter001_j/p000080–p000082, p000084–p000086, p000091, p000095, p000100, p000101, p000104) / Cục Tác chiến, tác chiến trì hoãn, sự chênh lệch về vật tư, nhiệm vụ phòng không, quyền làm chủ bầu trời, lực lượng mặt đất, trận quyết chiến (chapter001_j/p000083–p000086, p000101) / Dacia, Lục quân Liên bang, cường quốc hàng đầu, cấp độ bảo an biên giới, Đại Quân, sức chiến đấu (chapter001_j/p000087–p000089, p000096) / Tướng von Zettour, lực lượng dự bị, đơn vị huấn luyện, đơn vị thẩm định, thủ đô, tiền tuyến, học viên sĩ quan, mặt trận (chapter001_j/p000092, p000093, p000101, p000102) / phòng thủ chính quốc, quân tiếp viện, mặt trận phía đông, chính quốc, tính linh hoạt chiến lược, Khối Thịnh vượng chung, mặt trận phía tây (chapter001_j/p000094–p000096) / Lục quân Khối Thịnh vượng chung, con hổ giấy, Cục Tình báo, sư đoàn, tàn quân của Lục quân Cộng hòa, lực lượng thuộc địa, các lãnh thổ tự trị (chapter001_j/p000095) / cựu binh, mặt trận Rhine, sức mạnh hải quân, Lục quân Đế quốc, phòng ngự bị động, hậu phương (chapter001_j/p000096, p000097, p000101)"
  alternatives_vi:
  - quyền chế không (thay cho `quyền làm chủ bầu trời` tại chapter001_j/p000084 — ưu tiên `quyền làm chủ bầu trời` vì tự nhiên, sáng nghĩa và đồng bộ với cách diễn đạt tác chiến không quân ở các tập trước) / đơn vị khảo nghiệm (thay cho `đơn vị thẩm định` tại chapter001_j/p000093 — ưu tiên `đơn vị thẩm định` vì chuẩn xác cho các đơn vị chuyên kiểm nghiệm học thuyết – vũ khí thuộc Cục Hậu cần của Zettour) / phòng thủ thụ động (thay cho `phòng ngự bị động` tại chapter001_j/p000097 — ưu tiên `phòng ngự bị động` để đồng bộ với hệ thuật ngữ `phòng ngự có chiều sâu` và `tác chiến phòng ngự` trong Chương 3)
