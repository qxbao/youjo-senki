  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b03` của Tập 4 (`Tướng von Zettour` / `Zettour`, `Rudersdorf`, `lực lượng không quân`, `Cục Hậu cần`, `biên giới phía đông`, `Cục Tác chiến`, `tác chiến trì hoãn`, `phòng không`, `Dacia`, `Lục quân Liên bang`, `Đại Quân`, `sức chiến đấu`, `lực lượng dự bị`, `đơn vị huấn luyện`, `thủ đô`, `tiền tuyến`, `học viên sĩ quan`, `phòng thủ chính quốc`, `chính quốc`, `quân tiếp viện`, `mặt trận phía đông`, `Khối Thịnh vượng chung`, `mặt trận phía tây`, `Lục quân Khối Thịnh vượng chung`, `Cục Tình báo`, `sư đoàn`, `tàn quân của Lục quân Cộng hòa`, `cựu binh`, `mặt trận Rhine`, `Lục quân Đế quốc`, `hậu phương`), đồng thời khóa tạm các tổ hợp thuật ngữ quân sự trong phần kết cuộc tranh luận giữa Zettour và Rudersdorf (`kế hoạch phòng thủ quốc gia`, `quyền làm chủ bầu trời`, `trận quyết chiến`, `đơn vị thẩm định`, `tính linh hoạt chiến lược`, `lực lượng thuộc địa`, `các lãnh thổ tự trị`, `phòng ngự bị động`)."
