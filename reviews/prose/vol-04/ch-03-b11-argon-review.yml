  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b10` của Tập 4 (`Trung úy Serebryakov` / `Serebryakov`, `pháo hạng nặng`, `mặt trận Rhine`, `Thiếu tá`, `Đại úy Weiss` / `Weiss` / `Đại úy`, `Tanya`, `bắn gián tiếp`, `Đế quốc`, `Cộng hòa`, `trinh sát pháo binh`, `pháp sư không quân`, `quan sát viên`, `trinh sát viên` / `trinh sát viên quan sát`, `tiền tuyến`, `lực lượng mặt đất`, `pháo binh`, `Lục quân Liên bang`, `người chỉ điểm pháo binh`, `nhiệm vụ cơ động`, `Sư đoàn số 3`, `Sư đoàn số 32`, `tấn công biển người`, `hậu phương`, `Bộ Tổng tham mưu`, `vật tư sơ cứu` / `vật tư quân y`, `lục địa phía Nam`, `quân bưu`, `tổng hành dinh bộ tham mưu quân viễn chinh lục địa phía Nam`, `Cụm tập đoàn quân phía Đông`, `Grantz`, `bộ tham mưu phía đông`), đồng thời khóa tạm các thuật ngữ phát sinh trong phân cảnh giải thích điều kiện bắn gián tiếp và chuẩn bị tiếp tế cho chiến dịch giải cứu hai sư đoàn (`Paris`, `khẩu Pháo Paris`, `thả tiếp tế từ trên không`, `kho quỹ của tiểu đoàn`)."
  uncertainty: low
  status: pending
