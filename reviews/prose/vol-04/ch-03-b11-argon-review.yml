  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa trần thuật theo điểm nhìn của Tanya (`nó` / `mình` cho Tanya, `Cô` / `cô` cho Serebryakov, `anh` cho Grantz, `Họ` / `họ` cho sĩ quan cấp dưới, Bộ Tổng tham mưu và tiểu đoàn, `chúng` cho quan sát viên của địch), nhận định nội tâm của Tanya (`người ta`), và đối thoại quân vụ giữa chỉ huy tiểu đoàn với sĩ quan phó (`tôi` / `Tôi` – `Đại úy Weiss` / `Đại úy` / `anh`, `Tôi` / `tôi` – `Thiếu tá` / `thưa Thiếu tá` / `cô` – `ạ`, `chúng ta`) cũng như với sĩ quan phụ tá (`tôi` – `Trung úy Serebryakov` / `cô` / `Cô`, `Tôi` / `tôi` – `thưa Thiếu tá` / `Thiếu tá` / `cô` – `ạ`, `Chúng ta`)."
