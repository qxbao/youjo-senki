  proposed_vi: "Trung úy Serebryakov (Serebryakov), pháo hạng nặng, mặt trận Rhine, Thiếu tá, Đại úy Weiss (Weiss / Đại úy), Tanya (chapter001_l/p000197–p000201, p000203, p000204, p000206, p000210–p000229) / bắn gián tiếp, Đế quốc, Cộng hòa, trinh sát pháo binh, tuyến tiền tiêu, pháp sư không quân, quan sát viên, đại bác, trinh sát viên, Paris, khẩu Pháo Paris (chapter001_l/p000201–p000203, p000206) / tiền tuyến, lực lượng mặt đất, trinh sát viên quan sát, pháo binh, Lục quân Liên bang, người chỉ điểm pháo binh, tiểu đoàn (chapter001_l/p000204–p000206, p000211) / nhiệm vụ cơ động, Sư đoàn số 3, Sư đoàn số 32, tấn công biển người, hậu phương, Bộ Tổng tham mưu (chapter001_l/p000207, p000208, p000228) / vật tư sơ cứu, vật tư quân y, thả tiếp tế từ trên không, kho quỹ của tiểu đoàn, lục địa phía Nam, quân bưu, tổng hành dinh bộ tham mưu quân viễn chinh lục địa phía Nam, tổng hành dinh (chapter001_l/p000213, p000214, p000217, p000219, p000221, p000222, p000227) / Cụm tập đoàn quân phía Đông, Grantz, bộ tham mưu phía đông (chapter001_l/p000229)"
  alternatives_vi:
  - đại pháo Paris (thay cho `khẩu Pháo Paris` tại chapter001_l/p000202 — ưu tiên `khẩu Pháo Paris` để diễn đạt tự nhiên, chuẩn xác tên gọi lịch sử của vũ khí pháo binh siêu tầm xa trong liên tưởng của Tanya) / ngân quỹ tiểu đoàn (thay cho `kho quỹ của tiểu đoàn` tại chapter001_l/p000219, p000221, p000227 — ưu tiên `kho quỹ của tiểu đoàn` vì bao quát được cả khía cạnh quản lý tài chính lẫn nơi lưu giữ hiện vật/rượu chiến lợi phẩm của đơn vị) / thả dù tiếp tế (thay cho `thả tiếp tế từ trên không` tại chapter001_l/p000214 — ưu tiên `thả tiếp tế từ trên không` vì bám sát nghĩa gốc trước khi vế câu sau nêu chỉ dẫn gắn dù)
