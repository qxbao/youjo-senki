- source_term: rescue_mission_decision_and_battalion_treasury_banter_pronouns_and_emphasis_vol04_ch03_b11
  proposed_vi: "Trong phân cảnh Tanya giải thích sự vắng bóng của trinh sát viên quan sát địch, quyết định xin phép giải cứu Sư đoàn số 3 và 32, cùng cuộc đối thoại về số rượu chiến lợi phẩm trong kho quỹ tiểu đoàn (chapter001_l/p000197–p000229): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b07` – `b10`: (1) Trần thuật ngôi thứ ba theo điểm nhìn của Tanya quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` (p000212, p000213, p000217, p000218) và đại từ phản thân `mình` (p000212, p000217, p000221), kết hợp tên riêng `Tanya` (p000200, p000206, p000210, p000212, p000215, p000218, p000221, p000224, p000227–p000229); quy chiếu Đại úy Weiss bằng tên riêng `Weiss` (p000206, p000211, p000218, p000224); quy chiếu Trung úy Serebryakov bằng tên riêng `Serebryakov` và đại từ `Cô` / `cô` (p000206, p000211, p000213, p000217, p000227, p000229); quy chiếu Trung úy Grantz bằng tên riêng `Grantz` và đại từ `anh` (p000229); quy chiếu các sĩ quan cấp dưới, Bộ Tổng tham mưu và toàn tiểu đoàn bằng `Họ` / `họ` (p000200, p000206, p000210, p000212, p000228, p000229); quy chiếu các quan sát viên của địch bằng `chúng` (p000206). (2) Trong các câu nhận định nội tâm và tự nhủ của Tanya (p000200, p000202, p000209, p000215, p000228): dùng chủ ngữ khái quát `người ta` cho đại từ ngôi thứ hai phiếm chỉ trong các câu nhận định chung (p000202, p000209), và bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002` tại 4 đoạn có thẻ in nghiêng trong nguồn là p000200 (`*Họ đã học hỏi quá nhiều từ kinh nghiệm của chính mình rồi.*`), p000206 (`*Đúng như cô nói, thưa Thiếu tá*`), p000215 (`*Nói cách khác*`) và p000228 (`*Chuyện đó để sau khi hoàn thành nhiệm vụ giải cứu này đã.*`), không phát sinh dấu `*` ngoài nguồn ở 29 đoạn còn lại. (3) Trong đối thoại tại sở chỉ huy tiểu đoàn: Tanya gọi Serebryakov là `Trung úy Serebryakov` / `cô` / `Cô` (p000197, p000214), gọi Weiss là `Đại úy Weiss` / `Đại úy` / `anh` (p000199, p000204, p000220, p000223), tự xưng `tôi` / `Tôi`, dùng `chúng ta` / `Chúng ta` (p000201, p000214, p000215), quy chiếu hai sư đoàn quân bạn đang bị bao vây bằng `họ` (p000217) và pháo hạng nặng của địch bằng `chúng` (p000197); Đại úy Weiss gọi Tanya là `Thiếu tá` / `thưa Thiếu tá` và đại từ ngôi thứ hai `cô` (p000203, p000206, p000219), tự xưng `Tôi` / `tôi`, gọi cấp dưới bằng chức danh `Trung úy Serebryakov` (p000224) và thêm tiểu từ lễ phép `ạ` (p000219, p000222, p000224); Trung úy Serebryakov gọi Tanya là `thưa Thiếu tá` / `Thiếu tá` và đại từ `cô` (p000198, p000216), tự xưng `Tôi` / `tôi`, quy chiếu quân Liên bang bằng `chúng` (p000205) và thêm tiểu từ lễ phép `ạ` (p000198, p000205, p000217, p000226)."
  alternatives_vi:
  - cô (thay cho `nó` trong trần thuật bám sát điểm nhìn của Tanya tại chapter001_l/p000212, p000213, p000217, p000218 — bắt buộc giữ `nó` trong trần thuật của Tanya theo đúng quy định đã duyệt tại `DEC-P01-001`) / cậu (thay cho `anh` khi Tanya nói chuyện với Đại úy Weiss tại chapter001_l/p000199, p000220, p000223 — bắt buộc giữ `anh` để đồng bộ tuyệt đối với cách xưng hô quân vụ giữa Tanya và Weiss ở `ch-03-b08` – `b10` và xuyên suốt Tập 1–4)
