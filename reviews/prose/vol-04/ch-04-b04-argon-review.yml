  proposed_vi: "lục quân, Thiếu tá Tanya von Degurechaff / Thiếu tá von Degurechaff / Degurechaff / Thiếu tá, Lergen / vị đại tá, hội đồng điều trần / các thành viên hội đồng / phiên điều trần, phán quyết tuyên bố Degurechaff vô tội, hồ sơ công khai, hậu phương, thẩm quyền của Bộ Tư lệnh Tối cao, hậu phương trong nước, tiền tuyến / nhiệm vụ ở tiền tuyến, tiểu đoàn, Văn phòng Bộ Tổng tham mưu, Thiếu tá Uger, bạn đồng khóa, học viện chiến tranh, động tác chào chuẩn xác như sách giáo khoa, giọng điệu điềm nhiên, đậm chất công vụ, tân binh, lính bổ sung, sở chỉ huy của Quân đội Cộng hòa, mặt trận Rhine, thủ tục hành chính, nước đi mở màn, quân nhân, tuyến tiền tiêu, Ngân Gỉ, công tác ở hậu phương, người kế nhiệm, chỉ huy mới của Tiểu đoàn Pháp sư Trên không số 203 / Tiểu đoàn Pháp sư Trên không số 203, phó chỉ huy, Đại úy Weiss, Tướng von Zettour / Zettour, bản ghi nhớ, nguyện vọng phân công nhiệm vụ (chapter001_n/p000071–p000077, p000079, p000080, p000084–p000089, p000092–p000099)"
