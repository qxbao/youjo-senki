  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` – `b03` (`lục quân`, `Thiếu tá Tanya von Degurechaff` / `Thiếu tá von Degurechaff` / `Degurechaff` / `Thiếu tá`, `Lergen` / `vị đại tá`, `hội đồng điều trần` / `phiên điều trần`, `hậu phương`, `Bộ Tư lệnh Tối cao`, `hậu phương trong nước`, `tiền tuyến`, `tiểu đoàn`, `Văn phòng Bộ Tổng tham mưu`, `Thiếu tá Uger`, `học viện chiến tranh`, `giọng điệu điềm nhiên, đậm chất công vụ`, `tân binh`, `lính bổ sung`, `Quân đội Cộng hòa`, `mặt trận Rhine`, `quân nhân`, `tuyến tiền tiêu`, `Ngân Gỉ`, `Tiểu đoàn Pháp sư Trên không số 203`, `phó chỉ huy`, `Đại úy Weiss`, `Tướng von Zettour` / `Zettour`, `bản ghi nhớ`), đồng thời khóa tạm các thuật ngữ hành chính – quân sự trong cuộc trao đổi nguyện vọng điều động sau phiên điều trần (`hồ sơ công khai`, `công tác ở hậu phương`, `người kế nhiệm`, `nguyện vọng phân công nhiệm vụ`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: lergen_pov_degurechaff_interview_and_zettour_entrance_pronouns_address_and_emphasis_vol04_ch04_b04
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` – `b03` trong toàn bộ 29 đoạn của `vol-04-ch-04-b04` (chapter001_n/p000071–p000099) khi Đại tá von Lergen gặp riêng Thiếu tá Tanya von Degurechaff để hỏi nguyện vọng điều động và Tướng von Zettour xông vào văn phòng: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen) và `DEC-P01-002`: (1) Trần thuật ngôi thứ ba bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, danh xưng `vị đại tá`, đại từ `ông` / `Ông` và đại từ phản thân `mình` (p000072, p000073, p000075–p000079, p000081, p000083, p000085, p000086, p000090, p000091, p000096, p000097, p000099); quy chiếu Tướng von Zettour bằng danh xưng `Tướng von Zettour` / `Zettour` và đại từ `ông` (p000095–p000099); quy chiếu Thiếu tá Tanya von Degurechaff từ góc nhìn khách quan của Lergen bằng `Thiếu tá Tanya von Degurechaff` / `Thiếu tá von Degurechaff` / `Degurechaff`, đại từ `cô` / `Cô` và phản thân `mình` (p000074–p000077, p000079, p000081, p000083, p000085, p000086, p000092, p000094–p000098); quy chiếu phía hậu phương, các thành viên hội đồng điều trần hoặc cấp trên trong Bộ Tổng tham mưu bằng `họ` / `Họ` (p000071, p000074, p000076); tại các câu nhận định có đại từ ngôi thứ hai phiếm chỉ trong nguồn ở p000086 và p000090, lược đại từ ngôi thứ hai phiếm chỉ bằng cấu trúc trung tính (`có thể coi là`, `có thể nói`) theo quy ước `direct-address choice`. (2) Trong đối thoại và lời tự nhủ: Đại tá von Lergen khi lẩm bẩm một mình (p000072) dùng `chúng ta` cho phía lục quân / Bộ Tổng tham mưu; khi trao đổi trực tiếp với Thiếu tá Tanya von Degurechaff (p000080, p000082, p000084, p000087, p000089), Lergen tự xưng `tôi`, dùng `chúng ta` khi mở lời bàn công việc (p000082), gọi Tanya là `Thiếu tá` / `Thiếu tá von Degurechaff` và `cô` / `Cô`; Thiếu tá Tanya von Degurechaff khi đáp lời Đại tá von Lergen (p000085, p000088, p000093) thưa `Vâng, thưa Đại tá`, tự xưng `Tôi` / `tôi` kết hợp phản thân `mình` kèm tiểu từ kính ngữ `ạ`; Tướng von Zettour khi xông vào văn phòng chất vấn (p000096) dùng `Chúng ta` trong câu mở lời trực diện. (3) Bảo toàn chính xác các giả định trái thực tế và điều kiện (p000075, p000077, p000085, p000099), các câu hỏi trực tiếp / nội tâm / tu từ (p000082, p000084, p000085, p000089, p000092, p000094, p000096), và cả 5 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000071 (`*Nói cho đẹp mặt thì có lẽ họ tin tưởng lục quân… Còn nói trắng ra thì đơn giản là họ chẳng hiểu gì cả.*`), p000076 (`*Chà, đây cũng là một cơ hội tốt.*`), p000077 (`*Biết đâu ngay cả một người đang bực dọc vì phiên điều trần không mong muốn cũng sẽ thả lỏng phần nào nếu có mặt một người bạn đồng khóa ở học viện chiến tranh.*`), p000085 (`*Cuộc chiến đang hồi ác liệt mà Thiếu tá von Degurechaff… lại không muốn phục vụ ở tiền tuyến ư?*`) và p000095 (`*Cũng dễ hiểu thôi*`), không phát sinh dấu `*` ngoài nguồn ở 24 đoạn còn lại."
  alternatives_vi:
  - người ta (thay cho cách lược đại từ ngôi thứ hai phiếm chỉ trong cụm `có thể coi là` tại chapter001_n/p000086 và `có thể nói` tại chapter001_n/p000090 — cả hai cách đều thuộc quy ước `direct-address choice`; ưu tiên lược chủ ngữ phiếm chỉ để nhịp câu văn xuôi tự nhiên, gọn gàng) / Vâng, thưa ngài (thay cho `Vâng, thưa Đại tá` khi Thiếu tá von Degurechaff đáp lời Đại tá von Lergen tại chapter001_n/p000085 và p000088 — ưu tiên `Vâng, thưa Đại tá` để thể hiện rõ lễ tiết quân ngũ chính quy đối với cấp bậc của Lergen tại phòng họp Bộ Tổng tham mưu)
