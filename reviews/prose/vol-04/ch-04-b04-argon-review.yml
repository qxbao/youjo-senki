  volume: vol-04
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, tiếp nối liền mạch `vol-04-ch-04-b01` – `b03` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` cho Lergen, `ông` cho Zettour, `cô` / `Cô` cho Thiếu tá von Degurechaff trong góc nhìn khách quan của Lergen, `họ` cho phía hậu phương / các thành viên hội đồng / Bộ Tổng tham mưu, `tôi – Thiếu tá / cô` và `Tôi / tôi – thưa Đại tá... ạ` trong đối thoại giữa Đại tá von Lergen và Thiếu tá von Degurechaff), đồng thời bảo toàn chính xác các cấu trúc giả định/điều kiện, câu hỏi trực tiếp/nội tâm và cả 5 vị trí nhấn mạnh in nghiêng tại p000071, p000076, p000077, p000085 và p000095."
