- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000312
  locks:
  - "Giữ cụm `Tài liệu mật của Lục quân Đế quốc ư?` và đại từ `Các ông`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000313
  locks:
  - "Giữ các danh xưng và thuật ngữ `Chủ tịch Hội đồng Dân ủy Dzhugashvili`, `kẻ bị quỷ ám`, `người đứng đầu Bộ Dân ủy Nội vụ, Loria` và `kẻ mắc chứng cuồng độc tôn`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000314
