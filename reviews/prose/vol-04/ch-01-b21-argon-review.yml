  proposed_vi: "Lục quân Đế quốc, tuyến phòng ngự, lực lượng chi viện (chapter001_d/p000275, p000312) / Tướng von Zettour, hai vị tướng von Zettour và Rudersdorf (chapter001_d/p000276, p000277) / Giáo sư Sherlock, khoa Khoa học Chính trị, Đại học Londinium, Liên bang (chapter001_d/p000279–p000291, p000298, p000299, p000303, p000307, p000309, p000310) / Kremlin học (chapter001_d/p000281, p000282) / Bộ Ngoại giao, thị thực nhập cảnh, Ngày Tưởng niệm (chapter001_d/p000285) / cảnh sát biên phòng, Sở Y tế Công cộng, Bộ Tuyên truyền, giấy phép quay phim (chapter001_d/p000286) / Đế quốc, Đại chiến, tài liệu mật của Đế quốc (chapter001_d/p000289, p000290) / chứng hoang tưởng tập thể, tâm lý học, ảo tưởng (chapter001_d/p000292, p000295–p000297, p000299) / các quốc gia Cộng sản, bí mật quốc gia (chapter001_d/p000305) / hoàng gia, tạp chí lá cải (chapter001_d/p000306) / Khối Thịnh vượng chung (chapter001_d/p000307, p000309, p000310) / Bộ Tổng tham mưu Lục quân Đế quốc, quân đội các nước đồng minh (chapter001_d/p000311) / Chủ tịch Hội đồng Dân ủy Dzhugashvili, Bộ Dân ủy Nội vụ, Loria, kẻ mắc chứng cuồng độc tôn (chapter001_d/p000313)"
  alternatives_vi:
  - Hội đồng Ủy viên Nhân dân và Bộ Ủy viên Nhân dân Nội vụ (thay cho `Hội đồng Dân ủy` và `Bộ Dân ủy Nội vụ` tại chapter001_d/p000313 — ưu tiên `Hội đồng Dân ủy` và `Bộ Dân ủy Nội vụ` vì là thuật ngữ lịch sử chính trị tiếng Việt chuẩn xác, cô đọng cho cơ quan hành pháp tối cao *Sovnarkom* và cơ quan an ninh nội vụ *NKVD* kiểu Xô viết, đồng bộ tuyệt đối với `Bộ Dân ủy Ngoại giao` tại B20) / chứng cuồng ám đơn độc (thay cho `chứng cuồng độc tôn` tại chapter001_d/p000313 — ưu tiên `kẻ mắc chứng cuồng độc tôn` vì diễn đạt sắc nét chứng rối loạn tâm thần ám ảnh cố chấp độc nhất vào một ý niệm, khớp với sắc thái đánh giá cực đoan trong tài liệu mật của Bộ Tổng tham mưu Lục quân Đế quốc về Loria)
