- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000310
  locks:
  - "Giữ các cụm `các chính trị gia của Khối Thịnh vượng chung`, `Nhóm phóng viên chúng tôi`, danh xưng `Liên bang` và cặp đại từ `tôi` – `ông`."
