  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán tuyệt đối phong cách dẫn chương trình truyền hình `tôi` – `quý vị` – `chúng ta` / `chúng tôi` của phóng viên đặc biệt Andrew thuộc đài WTN (tiếp nối Tập 2 và B20), cũng như cặp xưng hô chuẩn mực `tôi` – `Giáo sư` / `ông` và `tôi` – `anh` trong cuộc tọa đàm học thuật trên sóng truyền hình với Giáo sư Sherlock."
