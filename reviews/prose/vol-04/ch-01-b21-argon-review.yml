  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quốc gia, tổ chức, học viện, nhân vật, cấp bậc và thuật ngữ quân sự – chính trị – tâm lý đã khóa tạm từ Tập 1–3 cùng B01–B20 của Tập 4 (`Lục quân Đế quốc`, `Đế quốc`, `Liên bang`, `Cộng sản`, `Khối Thịnh vượng chung`, `Đại chiến`, `các nước đồng minh`, `Bộ Tổng tham mưu Lục quân Đế quốc`, `Tướng von Zettour`, `hai vị tướng von Zettour và Rudersdorf`, `Đại học Londinium`, `ảo tưởng`), đồng thời khóa tạm các thuật ngữ chính trị học, hành chính và danh xưng lãnh đạo Liên bang xuất hiện trong cuộc phỏng vấn Giáo sư Sherlock (`Giáo sư Sherlock`, `khoa Khoa học Chính trị`, `Kremlin học`, `Ngày Tưởng niệm`, `cảnh sát biên phòng`, `Sở Y tế Công cộng`, `Bộ Tuyên truyền`, `chứng hoang tưởng tập thể`, `Chủ tịch Hội đồng Dân ủy Dzhugashvili`, `Bộ Dân ủy Nội vụ`, `Loria`, `kẻ mắc chứng cuồng độc tôn`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: andrew_sherlock_interview_pronouns_and_address_vol04_ch01_b21
  proposed_vi: "Trong cuộc phỏng vấn truyền hình giữa phóng viên đặc biệt Andrew và Giáo sư Sherlock thuộc Đại học Londinium (chapter001_d/p000275–p000314): Andrew tự xưng `tôi` xuyên suốt (p000276, p000279, p000282, p000285, p000288, p000296, p000297, p000300, p000304, p000306, p000310) và dùng `mình` ở mệnh đề tự quy chiếu phụ thuộc trong cùng câu (p000297); gọi khách mời trọng thị là `Giáo sư Sherlock` / `thưa Giáo sư` / `Giáo sư` / `ông` (p000279, p000280, p000282, p000285, p000288, p000291, p000293, p000294, p000296, p000298, p000300, p000302, p000304, p000308, p000310, p000314) và dùng `Các ông` khi hỏi về nhóm nghiên cứu của vị giáo sư (p000312); gọi khán giả truyền hình là `quý vị` / `quý vị khán giả` (p000290, p000297), dùng `chúng ta` / `nước ta` khi bao hàm người dẫn cùng khán giả/khách mời hoặc người dân Khối Thịnh vượng chung (p000277, p000290, p000306, p000307) và dùng `chúng tôi` khi chỉ đoàn làm phim / nhóm phóng viên WTN (p000285, p000286, p000310); Giáo sư Sherlock tự xưng `tôi` (p000281, p000287, p000301, p000303, p000309), dùng `chúng tôi` khi chỉ giới nghiên cứu tiếp cận tư liệu giải mật (p000289, p000311), và gọi phóng viên Andrew là `anh` (p000281)"
  alternatives_vi:
  - ông (thay cho `anh` khi Giáo sư Sherlock gọi phóng viên Andrew tại chapter001_d/p000281 — ưu tiên `anh` để phản ánh tự nhiên tương quan vị thế và độ tuổi giữa một học giả uy tín của Đại học Londinium với vị phóng viên truyền hình trẻ trung, năng động đang tự nhận mình là một học trò trước mặt giáo sư tại p000297)
