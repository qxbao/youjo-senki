- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000275
  locks:
  - "Giữ các cụm `Lục quân Đế quốc`, `các tuyến phòng ngự` và `việc triển khai lực lượng chi viện`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000276
  locks:
  - "Giữ đại từ `tôi`, danh xưng `Tướng von Zettour` và câu cảm thán trong ngoặc `(“Thật hết sức vô lý—”)` đồng bộ từng chữ với B03 và B20."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000277
  locks:
  - "Giữ đại từ `chúng ta` và cụm `hai vị tướng von Zettour và Rudersdorf`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000278
  locks:
  - "Giữ cụm `giới học thuật đã đạt được bước tiến đáng kể`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000279
  locks:
  - "Giữ đại từ `tôi` và các danh xưng `Giáo sư Sherlock thuộc khoa Khoa học Chính trị của Đại học Londinium`, `các nhân vật chủ chốt của Liên bang`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000280
  locks:
  - "Giữ cách xưng hô trọng thị `ông` và `thưa Giáo sư Sherlock`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000281
  locks:
  - "Giữ cặp đại từ `anh` – `tôi` và thuật ngữ `ngành Kremlin học`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000282
  locks:
  - "Giữ cách xưng hô `Vâng, thưa Giáo sư`, `Tôi` – `ông` và cụm định nghĩa `Kremlin học, tức ngành phân tích về các nhà lãnh đạo Liên bang`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000283
  locks:
  - "Giữ phép so sánh `giải một vụ án trinh thám tìm thủ phạm`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000284
  locks:
  - "Giữ danh xưng `Liên bang` và cụm `kín tiếng đến tận xương tủy`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000285
  locks:
  - "Giữ các đại từ `Ông`, `chúng tôi`, `tôi` và các danh xưng `Bộ Ngoại giao nước này`, `thị thực nhập cảnh`, `Ngày Tưởng niệm`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000286
  locks:
  - "Giữ các danh xưng `cảnh sát biên phòng`, `Sở Y tế Công cộng`, `Bộ Tuyên truyền`, cụm `giấy phép quay phim` và đại từ `chúng tôi`."
