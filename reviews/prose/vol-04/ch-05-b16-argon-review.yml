findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000152"
    severity: "minor"
    category: "terminology_and_style"
    issue: "Bản dịch thêm danh từ 'biên đội' vào trước cả hai thuật ngữ tiếng Đức in nghiêng ('Chiến thuật biên đội *Kette* ư…? ... cô nên dùng biên đội *Schwärme*'), khiến vế giải thích ngay câu sau ('Tôi sẽ cử cho cô bốn chiếc, tức một biên đội') bị trùng lặp từ 'biên đội' ba lần liên tiếp và làm mờ tác dụng giải nghĩa của cụm 'tức một biên đội'."
    rationale: "Theo canon/style-guide.md, không tự thêm từ giải thích làm lặp ý khi câu kế tiếp trong nguyên bản đã trực tiếp giải nghĩa quy mô bốn chiếc của *Schwärme* là 'một biên đội'."
    suggestion: "Lược từ 'biên đội' được thêm trước hai thuật ngữ in nghiêng, ví dụ: 'Chiến thuật *Kette* ư…? Nhưng tôi nghĩ với một nhiệm vụ đặc biệt thì cô nên dùng một *Schwärme*. Tôi sẽ cử cho cô bốn chiếc, tức một biên đội.'"
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000165"
    severity: "minor"
    category: "pronouns_and_viewpoint"
    issue: "Ở câu cuối ('Và đáng bực mình hơn nữa là chúng đang ở ngay trên sân nhà của mình'), dùng đại từ phản thân 'mình' để chỉ quyền sở hữu của quân địch ('chúng') trong mạch trần thuật bám điểm nhìn của Tanya dễ gây nhầm lẫn thoáng qua với đại từ tự quy chiếu 'mình' của Tanya/phe Đế quốc theo DEC-P01-001."
    rationale: "Theo DEC-P01-001 và canon/style-guide.md, cần giữ ranh giới đại từ rõ ràng giữa Tanya/phe mình và phe địch để người đọc nhận diện ngay đối tượng sở hữu 'sân nhà' là hai tiểu đoàn pháp sư địch."
    suggestion: "Đổi 'sân nhà của mình' thành 'sân nhà của chúng' (hoặc 'chính sân nhà của chúng'): 'Và đáng bực mình hơn nữa là chúng đang ở ngay trên sân nhà của chúng.'"
