  proposed_vi: "Toàn bộ 29 đoạn mở đầu Chương 5 trong `vol-04-ch-05-b01` (chapter001_r/p000001–p000029) xoay quanh cuộc rút quân của Tiểu đoàn Pháp sư Trên không số 203 qua Eo biển Chim Dodo sau trận không chiến tiêu diệt hoàn toàn một đơn vị địch, sự giằng xé của Tanya trước hiện tượng ô nhiễm tâm lý từ Elinium Type 95 và tình huống máy bay tiêm kích địch lao tới truy kích từ hướng sáu giờ, tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`: (1) Trong trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya: quy chiếu `Thiếu tá Tanya von Degurechaff` / `Tanya` nhất quán bằng tên riêng và đại từ `nó` kết hợp phản thân `mình` / `bản thân` (p000007, p000010, p000013, p000014, p000023, p000027, p000028 — tuyệt đối không dùng `cô` / `cô ấy` cho Tanya trong trần thuật hay nội tâm); quy chiếu Phó chỉ huy Đại úy Weiss bằng `anh` (p000013); quy chiếu các đơn vị pháp sư Đế quốc bằng `họ` (p000003, p000004) và máy bay tiêm kích địch bằng `Chúng` (p000027); chuyển tự nhiên đại từ ngôi thứ hai phiếm chỉ trong câu nhận định khái quát ở p000029 sang cấu trúc khái quát vô nhân xưng (`Mang thân xác con người mà cố đua tốc độ hay đua vọt cao với máy bay thì về cơ bản đã cầm chắc phần thua.`) theo quy ước `direct-address choice`. (2) Trong độc thoại nội tâm và lời tự nhủ thành tiếng của Tanya (p000013, p000014, p000023–p000026): tự quy chiếu ngôi thứ nhất số ít nhất quán bằng `mình` / `Mình` kết hợp phản thân `mình` / `bản thân`, ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `chúng tôi` (p000013), và gọi trực tiếp `Being X` trong câu nguyền rủa ở p000025 là `ngươi` (đồng bộ `P05-being-x`). (3) Trong hội thoại quân sự (p000006, p000008–p000022, p000027): Tanya (`Fairy 01`) tự xưng `tôi` / `Tôi`, dùng đại từ gộp `chúng ta` / `Chúng ta` cho toàn tiểu đoàn, gọi Weiss là `Phó chỉ huy` và gọi Serebryakov là `Trung úy Serebryakov` / `cô`; Đại úy Weiss (`Fairy 02`) và Trung úy Serebryakov khi báo cáo hoặc đáp lời Tanya tự xưng `tôi` / `Tôi`, gọi Tanya là `Thưa Thiếu tá` / `thưa Thiếu tá` / `Thiếu tá` (p000009, p000016, p000020) và `thưa Chỉ huy` (p000018) kèm tiểu từ kính ngữ `ạ` đúng điều lệnh; bảo toàn trọn vẹn nét chơi chữ hai nghĩa trong màn tung hứng giữa Tanya và Weiss ở p000017–p000019 (`Ở phía sau nhớ cẩn thận đấy nhé!` → `người theo chủ nghĩa dị tính cực đoan` sẵn sàng hy sinh vì đức tin → Tanya lỡ miệng nhắc tới `chiến binh của Thượng đế`). (4) Bảo toàn chính xác phạm vi nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại đúng 3 đoạn: p000010 (`*Tốt.*`), p000013 (`*Xét về năng lực thì Grantz không tệ… nhưng đáng tiếc là nhóm bổ sung gia nhập cùng chúng tôi ở mặt trận Rhine lại chưa có kinh nghiệm tác chiến chống hạm.*`) và p000014 (`*Có sĩ quan phụ tá ở bên cạnh thì sẽ thuận tiện hơn.*`), không phát sinh dấu `*` ngoài nguồn ở 26 đoạn còn lại."
  alternatives_vi:
  - Ở hậu đội nhớ cẩn thận đấy nhé (thay cho `Ở phía sau nhớ cẩn thận đấy nhé!` tại chapter001_r/p000017 — ưu tiên `Ở phía sau nhớ cẩn thận đấy nhé!` để giữ trọn nét chơi chữ hai nghĩa tự nhiên dẫn sang câu trả lời hài hước của Weiss ở p000018)
