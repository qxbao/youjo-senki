  proposed_vi: "NGÀY 28 THÁNG 4, NĂM THỐNG NHẤT 1926, TRÊN BẦU TRỜI EO BIỂN, Lục quân Đế quốc, Cộng hòa cũ, quân quản, Londinium, truy thăng hai cấp, sức chiến đấu, dân quân, pháp sư Đế quốc, Tiểu đoàn Pháp sư Trên không số 203, Bộ Tổng tham mưu, Thiếu tá Tanya von Degurechaff, pháp sư trên không, Pháp sư Định danh, Fairy 01, Fairy 02, Phó chỉ huy, Đại úy Weiss, mặt trận Rhine, Eo biển Chim Dodo, Trung úy Grantz, Trung úy Serebryakov, tác chiến chống hạm, sĩ quan phụ tá, người theo chủ nghĩa dị tính cực đoan, Thượng đế, nhiệm vụ trinh sát chiến đấu, trận không chiến tiêu diệt hoàn toàn, Being X, sự ô nhiễm tâm lý, Elinium Type 95, hướng sáu giờ, máy bay tiêm kích, chỉ huy đơn vị phòng không, những động tác cơ động ba chiều hiểm hóc (chapter001_r/p000001–p000005, p000007, p000008, p000010, p000012–p000015, p000017–p000019, p000021, p000023, p000025–p000029)"
  alternatives_vi:
