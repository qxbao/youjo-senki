  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, giữ đồng bộ hệ đại từ của Tanya (`nó` trong trần thuật, `mình` trong nội tâm và lời tự rủa, `tôi` / `chúng ta` trong thoại chỉ huy), hệ xưng hô điều lệnh với Đại úy Weiss và Trung úy Serebryakov, cấu trúc khái quát vô nhân xưng ở p000029 và phạm vi nhấn mạnh in nghiêng ở 3 đoạn p000010, p000013, p000014."
