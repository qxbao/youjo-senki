  volume: vol-04
  chapter: 1
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán tuyệt đối quy ước xưng hô của Tướng von Romel và sĩ quan tham mưu trên Mặt trận phía Nam (tiếp nối B18–B19) cũng như phong cách dẫn chương trình truyền hình `tôi` – `quý vị` – `chúng ta` của phóng viên đặc biệt Andrew thuộc đài WTN (tiếp nối Tập 2)."
