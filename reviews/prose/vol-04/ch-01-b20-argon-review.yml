  proposed_vi: "Cộng hòa (chapter001_d/p000240, p000250, p000251, p000270) / NĂM THỐNG NHẤT 1980, THỦ ĐÔ LIÊN BANG (chapter001_d/p000241) / Andrew, phóng viên đặc biệt của WTN, nhóm phóng viên WTN (chapter001_d/p000243, p000244) / Ngày Tưởng niệm Chiến tranh Vệ quốc Vĩ đại, Moskva (chapter001_d/p000244) / cựu chiến binh (chapter001_d/p000245) / mặt trận phía đông, Rhine, mặt trận Rhine (chapter001_d/p000246, p000250, p000270) / Liên bang, Đế quốc, Đại chiến (chapter001_d/p000249–p000254, p000257, p000260, p000261, p000263, p000265–p000268, p000271, p000273, p000274) / Lục quân Đế quốc, cuộc tấn công bão hòa đa mặt trận (chapter001_d/p000250) / cơ quan tình báo Cộng hòa, trung lập thiện chí, Cộng hòa Tự do, Tướng de Lugo, đội quân tình nguyện (chapter001_d/p000251) / Bộ Dân ủy Ngoại giao (chapter001_d/p000252) / Hiệp ước Rappalo, hiệp ước không xâm phạm (chapter001_d/p000253) / Quân đội Cộng hòa Tự do, Quân đội Khối Thịnh vượng chung, lục địa phía nam (chapter001_d/p000255, p000258) / Bộ Ngoại giao Khối Thịnh vượng chung (chapter001_d/p000256) / Thiếu tướng (vào thời điểm ấy) Habergram, Cục Chiến lược Đối ngoại (chapter001_d/p000258) / tinh thần John Bull⁷ (chapter001_d/p000259) / Tướng von Zettour, các nước đồng minh, sĩ quan phụ tá, Lục quân Liên bang, Tướng von Rudersdorf (chapter001_d/p000261, p000272) / điểm tập kết xuất phát, bắn đạn thật (chapter001_d/p000265) / lệnh động viên (chapter001_d/p000266) / Tình báo Đế quốc (chapter001_d/p000267) / Bộ Tổng tham mưu Lục quân Đế quốc, màn phô diễn thị uy (chapter001_d/p000268) / Ủy ban Quốc phòng Nhà nước (chapter001_d/p000274)"
