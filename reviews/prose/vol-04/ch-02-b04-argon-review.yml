  proposed_vi: "thanh tra, viên thanh tra, Cụm tập đoàn quân phía Đông, tiểu đoàn của Degurechaff, Thiếu tá von Degurechaff, Thiếu tá Tanya von Degurechaff, Tiểu đoàn Pháp sư Trên không số 203 (chapter001_f/p000084, p000088, p000089, p000094, p000099, p000116) / sĩ quan ma pháp, đơn vị trinh sát tầm xa, trinh sát tầm xa, lãnh thổ địch (chapter001_f/p000086, p000089) / bản ghi nhận chiến công, bảng điểm chiến tích, khai khống chiến tích (chapter001_f/p000088, p000090) / viên quan chức hành chính, đợt xuất kích khẩn cấp, trận đánh chặn, chính quốc (chapter001_f/p000089) / tập kích thâm nhập, Quân đội Cộng hòa Tự do, đột phá chính diện, sở chỉ huy (chapter001_f/p000092) / pha cơ động chiến thuật (chapter001_f/p000093) / Huy hiệu Đột kích Cánh bạc đính Lá sồi, Huy hiệu Đột kích Cánh bạc, Lá sồi (chapter001_f/p000095, p000097) / Zettour, Tướng quân, sĩ quan tham mưu, Bộ Tổng tham mưu, lẽ thường (chapter001_f/p000103, p000106, p000115) / Lergen (chapter001_f/p000105, p000107, p000116) / đơn vị tinh nhuệ, sĩ khí (chapter001_f/p000109, p000110)"
  alternatives_vi:
