  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ trần thuật `ông` và nội tâm tự quy chiếu `mình` của Đại tá von Lergen (tiếp nối B02–B03), phân biệt mạch lạc các chủ thể trong trần thuật và nội tâm (`ông` cho Lergen và Zettour theo chủ ngữ từng câu, `Ông ấy` khi Lergen nghĩ về Zettour, `ông ta` cho viên thanh tra hành chính, `cô` / `cô ấy` cho Tanya, `họ` / `chúng ta` cho tập thể sĩ quan tham mưu), và giữ chuẩn mực xưng hô tôn kính trong cuộc họp Bộ Tổng tham mưu."
