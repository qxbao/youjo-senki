  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, đơn vị, huân huy chương và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng B01–B03 Chương 2 Tập 4 (`Cụm tập đoàn quân phía Đông`, `Degurechaff` / `Thiếu tá von Degurechaff` / `Thiếu tá Tanya von Degurechaff`, `Tiểu đoàn Pháp sư Trên không số 203`, `sĩ quan ma pháp`, `đơn vị trinh sát tầm xa` / `trinh sát tầm xa`, `đợt xuất kích khẩn cấp`, `trận đánh chặn`, `chính quốc`, `Quân đội Cộng hòa Tự do`, `đột phá chính diện`, `sở chỉ huy`, `Huy hiệu Đột kích Cánh bạc đính Lá sồi` / `Huy hiệu Đột kích Cánh bạc` / `Lá sồi`, `Zettour` / `Tướng quân`, `Lergen`, `sĩ quan tham mưu`, `Bộ Tổng tham mưu`, `lẽ thường`, `đơn vị tinh nhuệ`, `sĩ khí`), đồng thời khóa tạm các cụm thuật ngữ kiểm tra quân chính và tác chiến trong phân cảnh tranh luận và phê chuẩn tại Phòng họp số 1 (`thanh tra` / `viên thanh tra`, `bản ghi nhận chiến công`, `khai khống chiến tích`, `tập kích thâm nhập`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: lergen_comms_officer_exchange_and_zettour_verdict_pronouns_vol04_ch02_b04
  proposed_vi: "Trong phân cảnh đối đáp giữa Đại tá von Lergen với viên trung tá thông tin liên lạc của Cụm tập đoàn quân phía Đông và quyết định phê chuẩn của Trung tướng von Zettour tại Phòng họp số 1 thuộc Bộ Tổng tham mưu (chapter001_f/p000084–p000116): tiếp nối B02–B03, trần thuật ngôi thứ ba theo điểm nhìn của Lergen quy chiếu Lergen bằng `Ông` / `ông` (p000087, p000099–p000101) và giữ tên riêng `Lergen` (p000105, p000107, p000116); quy chiếu Zettour bằng tên riêng `Zettour` kết hợp đại từ `ông` khi Zettour là chủ thể hành động chính của câu trần thuật (p000103, p000114) và bằng `Ông ấy` trong độc thoại nội tâm trực tiếp của Lergen (p000105); trong độc thoại nội tâm trực tiếp (p000088, p000090, p000091, p000097, p000098, p000101, p000105, p000116), Lergen tự quy chiếu ngôi thứ nhất bằng `mình`, dùng chủ ngữ khái quát `Người ta` (p000088) và cấu trúc vô nhân xưng `có thể nói` (p000098) cho đại từ ngôi thứ hai phiếm chỉ; quy chiếu viên thanh tra hành chính trong giai thoại bằng `viên quan chức hành chính tội nghiệp ấy` / `ông ta` / `viên thanh tra` (p000089) và dùng `họ` cho đại từ số nhiều phiếm chỉ chỉ thanh tra giả định ở p000094; quy chiếu Thiếu tá Tanya von Degurechaff bằng `cô` trong trần thuật và suy nghĩ gián tiếp của Lergen (p000089, p000093, p000099–p000101, p000111) và bằng `cô ấy` trong lời thoại cũng như độc thoại nội tâm trực tiếp (p000088, p000094, p000095, p000097, p000104, p000112); quy chiếu Tiểu đoàn 203 bằng `họ` (p000088–p000090), Quân đội Cộng hòa Tự do bằng `họ` / `chúng` (p000092), và các sĩ quan Bộ Tổng tham mưu bằng `Họ` / `họ` trong trần thuật (p000107, p000108, p000110, p000111, p000114, p000115) cùng `chúng ta` trong độc thoại nội tâm tập thể của họ (p000108, p000109). Trong đối thoại: Lergen và viên trung tá thông tin liên lạc tiếp tục xưng hô lịch sự `tôi` – `ông` (p000084–p000086, p000094–p000096); Trung tướng von Zettour tự xưng `Tôi` kết hợp phản thân `mình`, gọi tập thể cuộc họp là `chúng ta` (p000102, p000104, p000112); các sĩ quan tham mưu thốt lên gọi Zettour là `““Thưa Tướng quân?!””` (p000106) và `“Ngài nói nghiêm túc đấy ạ?!”` (p000113)"
  alternatives_vi:
  - anh nói nghiêm túc đấy chứ?! (thay cho `Ngài nói nghiêm túc đấy ạ?!` tại chapter001_f/p000113 — ưu tiên `Ngài nói nghiêm túc đấy ạ?!` vì câu thoại p000113 là lời các sĩ quan tham mưu bàng hoàng hỏi ngược Trung tướng von Zettour ngay sau tuyên bố đặt cược chai rượu yêu thích của Zettour ở p000112 và được xác nhận trực tiếp ở câu trần thuật p000114, do đó phải dùng ngôi kính trọng `Ngài ... ạ` tương ứng với tiếng hô `““Thưa Tướng quân?!””` ở p000106)
  segment_ids:
