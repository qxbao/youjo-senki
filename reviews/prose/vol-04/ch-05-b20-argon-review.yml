findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000295"
    severity: "minor"
    category: "terminology_and_pronouns"
    issue: "Ở câu đầu, đại từ 'nó' được dùng để dịch đại từ vô nhân xưng chỉ pha lao lên của địch, ngay trước câu sau mở đầu bằng 'Nó' chỉ Tanya, dễ gây nhiễu quy chiếu với quy ước đại từ trần thuật 'nó' của Tanya. Ngoài ra, cách gọi lóng quân sự 'the package' (chỉ nhân sự/mục tiêu cần giải cứu trong nhiệm vụ CSAR) đang được diễn giải thẳng thành 'mục tiêu cần giải cứu', làm nhạt sắc thái thuật ngữ lóng của Tanya."
    recommendation: "Đổi 'nó cũng gây nguy hiểm' ở câu đầu thành 'pha lao lên ấy cũng gây nguy hiểm' hoặc 'điều đó cũng gây nguy hiểm' để tách bạch với đại từ 'Nó' chỉ Tanya ở câu kế tiếp; cân nhắc dịch 'the package' là 'gói hàng' (hoặc giữ cách gọi lóng quân sự tương đương) để bảo toàn giọng điệu thực dụng của Tanya."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000297"
    severity: "minor"
    category: "tone"
    issue: "Thán từ mở đầu câu thoại chỉ sự bực bội, chán ghét khi nhớ lại một trải nghiệm cận chiến tồi tệ nhưng đang dịch là 'Ái chà', vốn mang sắc thái ngạc nhiên thích thú hoặc bông đùa nhẹ nhàng, chưa khớp với tâm trạng cáu kỉnh của Tanya."
    recommendation: "Đổi 'Ái chà' thành thán từ bực dọc như 'Gừ', 'Chết tiệt' hoặc 'Ác thật'."
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000303"
    severity: "minor"
    category: "word_choice"
    issue: "Tiếng rên đau đớn và tức thở của pháp sư địch khi bị thúc mạnh báng súng vào bụng (được đoạn p000304 gọi là 'groan') đang dịch là 'Ực…', dễ bị hiểu nhầm thành tiếng nuốt nước bọt thay vì tiếng kêu tức ngực/đau đớn."
    recommendation: "Đổi 'Ực…' thành 'Hự…' hoặc 'Khự…' để khớp với tiếng rên khi trúng đòn vào vùng bụng ở đoạn tiếp theo."
