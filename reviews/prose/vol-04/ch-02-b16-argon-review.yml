  proposed_vi: "Trong phần kết cuộc họp tại Londinium (chapter001_h/p000119–p000121) và phân cảnh tại Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc khi nhận báo cáo về cuộc tập kích Moskva của Tiểu đoàn 203 (chapter001_h/p000122–p000148): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-02-b01` – `b05` cùng `b15`: (1) Ở câu thoại khép lại cảnh Londinium tại p000119, quy chiếu Tướng de Lugo (được nhắc tên ở p000117 cuối B15) bằng `ông ấy` và dùng chủ ngữ khái quát `người ta`. (2) Ở phân cảnh Bộ Tổng tham mưu Lục quân Đế quốc (p000122–p000148), điểm nhìn thuộc về tập thể Bộ Tổng tham mưu và Trung tướng von Zettour, nên trần thuật ngôi thứ ba quy chiếu Thiếu tá Tanya von Degurechaff từ góc nhìn của các tướng lĩnh tham mưu bằng `Thiếu tá von Degurechaff` (p000134, p000137, p000142, p000147, p000148), cụm mô tả ngoại hình `một cô bé` (p000142) và đại từ `cô` xuyên suốt (p000134, p000137, p000141, p000142, p000145–p000148); quy chiếu Trung tướng von Zettour trong trần thuật ngôi thứ ba bằng đại từ trang trọng `ông` kết hợp quân hàm đầy đủ `Trung tướng von Zettour` (p000145); trong lời thoại cảm thán của Zettour tại p000144, dùng cặp đại từ `Tôi` / `tôi` – `cô ấy`; quy chiếu tập thể các sĩ quan Bộ Tổng tham mưu, công chúng/các phe phái chính trị và Tiểu đoàn 203 bằng `họ` / `bọn họ` / `các sĩ quan ở đây` (riêng tại p000141 dùng `các sĩ quan ở đây` cho vế chính để phân biệt rạch ròi với đại từ `họ` chỉ đơn vị của Tanya ở mệnh đề phụ đứng trước), kết hợp đại từ phản thân `mình` (p000125) và chủ ngữ khái quát `người ta` (p000125); quy chiếu phe Đỏ bằng `chúng` (p000146)"
  alternatives_vi:
  - nó (thay cho `cô` khi quy chiếu Thiếu tá von Degurechaff trong trần thuật tại chapter001_h/p000134, p000137, p000141, p000142, p000145–p000148 — bắt buộc giữ `cô` vì theo `DEC-P01-001` đại từ `nó` chỉ dùng cho trần thuật bám sát điểm nhìn của Tanya, còn tại phân cảnh Văn phòng Bộ Tổng tham mưu điểm nhìn thuộc về các sĩ quan tham mưu và Trung tướng von Zettour, đồng bộ tuyệt đối với `vol-04-ch-02-b02` – `b05`) / họ (thay cho `các sĩ quan ở đây` ở vế sau của chapter001_h/p000141 — ưu tiên `các sĩ quan ở đây` để tránh nhập nhằng với đại từ `họ` ngay phía trước chỉ binh sĩ Tiểu đoàn 203 đã đốt cờ đỏ)
