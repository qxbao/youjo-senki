  proposed_vi: "các nhà ngoại giao Khối Thịnh vượng chung, góc nhìn duy lý (chapter001_h/p000120, p000121) / NGÀY 18 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC (chapter001_h/p000122) / Lục quân Đế quốc, thủ đô địch, lời tuyên chiến đơn phương, phe cực hữu, phe cực tả (chapter001_h/p000128, p000129) / đơn vị tác chiến đặc biệt của Đế quốc, Moskva, Bộ Tổng tham mưu, các yếu tố chính trị (chapter001_h/p000130, p000132–p000134) / Thiếu tá von Degurechaff, cuộc tập kích đánh lạc hướng, đòn nghi binh, màn bay lướt qua để phô diễn thị uy, sĩ quan tham mưu (chapter001_h/p000134–p000137, p000142, p000147, p000148) / tiểu đoàn, không phận thủ đô, Liên bang, tuyên truyền (chapter001_h/p000137, p000145, p000148) / trung tâm đầu não chính trị, trụ sở cảnh sát mật, biểu tượng chính trị, quốc kỳ, quốc ca, ba tiếng hô vạn tuế, ảnh lưu niệm, cờ đỏ, bộ phim kỷ niệm, sĩ quan Bộ Tổng tham mưu (chapter001_h/p000140–p000142) / Trung tướng von Zettour, chiến tranh tổng lực, phe Đỏ, hoạt động gián điệp (chapter001_h/p000145, p000146) / cuộc chiến trên hai mặt trận, Chiến lược nội tuyến, “nhử mồi và tiêu diệt”, Cộng hòa, Đế quốc, đòn tấn công toàn diện, các mối quan ngại chính trị (chapter001_h/p000147, p000148)"
