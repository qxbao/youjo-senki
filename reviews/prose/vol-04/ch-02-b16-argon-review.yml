  volume: vol-04
  chapter: 2
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ theo điểm nhìn của Bộ Tổng tham mưu và Trung tướng von Zettour (`ông` cho Zettour, `cô` cho Thiếu tá von Degurechaff trong trần thuật và hồi tưởng của Zettour, `Tôi` – `cô ấy` trong lời thoại của Zettour, và khử mơ hồ chủ thể số nhiều ở p000141)."
