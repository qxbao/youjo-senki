  proposed_vi: "pháp sư, cuộc săn lùng—không phải săn phù thủy mà là săn pháp sư (chapter001_f/p000170, p000171, p000177–p000179, p000181, p000182, p000210) / Loria (chapter001_f/p000177, p000179) / đội hình công kích mục tiêu mặt đất (chapter001_f/p000178, p000208) / Lục quân Liên bang, Liên bang, thanh trừng (chapter001_f/p000179–p000182, p000184, p000185, p000195) / giới pháp sư nắm quyền trước đây, phần tử phản động, Sildberia, Lãnh địa Tự trị Akitsushima, cuộc xung đột biên giới (chapter001_f/p000181) / Lục quân Đế quốc (chapter001_f/p000183, p000186) / NGÀY 16 THÁNG 3, NĂM THỐNG NHẤT 1926, TRÊN BẦU TRỜI THỦ ĐÔ MOSKVA CỦA LIÊN BANG, thủ đô Moskva của Liên bang, Moskva, trung tâm Moskva (chapter001_f/p000184–p000186, p000198, p000209) / Tiểu đoàn Pháp sư Trên không số 203, Thiếu tá Tanya von Degurechaff, Tanya (chapter001_f/p000185, p000186, p000188, p000191, p000195, p000198, p000208–p000210) / “sân bay quốc tế mang đậm tính đô thị nhất thế giới”, Cung điện Nhân dân (chapter001_f/p000186, p000187) / lũ Cộng sản, “Một tên Đỏ tốt là một tên Đỏ đã chết.”, các thỏa ước quốc tế (chapter001_f/p000189–p000191, p000202) / Fairy 01, 01, 02 (chapter001_f/p000192, p000197, p000199, p000205, p000208) / hỏa lực phòng không, cuộc đánh chặn, tập kích thâm nhập tầm xa, hệ thống phòng không của Liên bang (chapter001_f/p000193, p000195) / Đại úy Weiss, Weiss, phó chỉ huy, hai Trung úy Serebryakov và Grantz, Grantz (chapter001_f/p000198, p000200, p000202, p000206) / lãnh thổ địch, rượu etylic, sĩ khí (chapter001_f/p000202, p000206) / đội hình hộp chiến đấu (chapter001_f/p000209)"
