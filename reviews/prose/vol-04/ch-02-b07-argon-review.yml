- source_term: loria_panic_and_tanya_203rd_battalion_moskva_raid_banter_pronouns_vol04_ch02_b07
  proposed_vi: "Trong phân cảnh Loria dưới mặt đất ở Moskva bàng hoàng nhận ra pháp sư Đế quốc (chapter001_f/p000170–p000183): tiếp nối B05–B06, trần thuật ngôi thứ ba quy chiếu Loria bằng `ông ta` / `Ông ta` xuyên suốt (p000171, p000175, p000177, p000178, p000180–p000182) và định danh bằng tên riêng `Loria` (p000177, p000179); dùng chủ ngữ khái quát `người ta` cho đại từ ngôi thứ hai phiếm chỉ ở p000178; quy chiếu các pháp sư / phần tử phản động của Liên bang từng bị thanh trừng bằng `bọn họ` (p000180, p000181) và nhóm pháp sư xâm nhập trên bầu trời bằng `Đám pháp sư` / `chúng` (p000178, p000182). Trong phân cảnh Thiếu tá Tanya von Degurechaff và Tiểu đoàn 203 trên bầu trời thủ đô Moskva (chapter001_f/p000184–p000210): tuân thủ nghiêm ngặt `DEC-P01-001`, trần thuật ngôi thứ ba quy chiếu Tanya bằng `nó` (p000186, p000208, p000210), kết hợp đại từ phản thân `mình` (p000185, p000208) và định danh bằng `Thiếu tá Tanya von Degurechaff` / `Tanya` (p000185, p000186, p000188, p000191, p000195, p000198, p000208, p000210); trong độc thoại nội tâm trực tiếp (p000189, p000190, p000194, p000206, p000208), Tanya tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` và ngôi thứ nhất số nhiều chỉ tập thể đơn vị bằng `chúng tôi` (p000206) hoặc `Chúng ta` khi tự khích lệ toàn quân (p000208); dùng chủ ngữ khái quát `Người ta` cho đại từ ngôi thứ hai phiếm chỉ ở p000202; quy chiếu tập thể Tiểu đoàn 203 trong trần thuật bằng `Họ` / `họ` (p000186, p000195, p000208–p000210) và quy chiếu Đại úy Weiss bằng `Đại úy Weiss` / `Weiss` kết hợp phản thân `mình` (p000198). Trong liên lạc vô tuyến nội bộ Tiểu đoàn 203 (p000192, p000196–p000201, p000203–p000205, p000208): Tanya (`Fairy 01` / `01`) tự xưng `Tôi` / `tôi`, gọi Đại úy Weiss (`02`) là `anh`, gọi toàn tiểu đoàn là `toàn quân` / `các anh chị` / `tất cả các đơn vị`, và dùng `chúng ta` khi bao hàm cả đơn vị; Đại úy Weiss (`02`) đáp lại Tanya lễ phép bằng `Thiếu tá ... ạ` (p000197) và gọi đám thuộc cấp đang đòi uống rượu của mình là `Các người` (p000205); các sĩ quan thuộc cấp (Serebryakov, Grantz và các đại đội trưởng khác) tự xưng `tôi` / `chúng tôi`, dùng `chúng ta`, gọi Weiss là `phó chỉ huy` / `anh` và kèm tiểu từ lễ phép `ạ` / `nhé` (p000200, p000201, p000203, p000204)"
  alternatives_vi:
  - cô (thay cho `nó` khi quy chiếu Tanya trong trần thuật ngôi thứ ba tại chapter001_f/p000186, p000208, p000210 — bắt buộc giữ `nó` theo quyết định đã duyệt `DEC-P01-001` trong `canon/decisions.md` vì đây là phân cảnh trần thuật bám sát điểm nhìn của Tanya) / các cậu (thay cho `Các người` khi Đại úy Weiss mắng yêu các sĩ quan thuộc cấp qua vô tuyến tại chapter001_f/p000205 — ưu tiên `Các người` trong câu cảm thán `“Các người cũng to gan gớm nhỉ!”` vì vừa giữ được sắc thái nghiêm nghị giả vờ của vị tiểu đoàn phó trước cả nhóm thuộc cấp nam lẫn nữ gồm Serebryakov, Grantz, Koenig, Neumann, vừa tự nhiên trong đối đáp nhà binh)
