  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, cấp bậc, đơn vị, quốc gia, địa danh, hô hiệu và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B06 Chương 2 của Tập 4 (`pháp sư`, `săn phù thủy`, `Loria`, `Lục quân Liên bang`, `Liên bang`, `thanh trừng`, `phần tử phản động`, `Sildberia`, `Lục quân Đế quốc`, `NGÀY 16 THÁNG 3, NĂM THỐNG NHẤT 1926`, `Moskva` / `trung tâm Moskva`, `Tiểu đoàn Pháp sư Trên không số 203`, `Thiếu tá Tanya von Degurechaff` / `Tanya`, `Đại úy Weiss` / `Weiss`, `phó chỉ huy`, `hai Trung úy Serebryakov và Grantz` / `Grantz`, `lũ Cộng sản`, `Fairy 01` / `01` / `02`, `hỏa lực phòng không` / `hệ thống phòng không`, `cuộc đánh chặn`, `tập kích thâm nhập tầm xa`, `lãnh thổ địch`, `sĩ khí`, `đội hình công kích mục tiêu mặt đất`), đồng thời khóa tạm các định danh chính thể, công trình và thuật ngữ tác chiến xuất hiện trong phân cảnh Loria nhận diện pháp sư Đế quốc và Tiểu đoàn 203 tiến vào bầu trời Moskva (`giới pháp sư nắm quyền trước đây`, `Lãnh địa Tự trị Akitsushima`, `cuộc xung đột biên giới`, `“sân bay quốc tế mang đậm tính đô thị nhất thế giới”`, `Cung điện Nhân dân`, `“Một tên Đỏ tốt là một tên Đỏ đã chết.”`, `rượu etylic`, `đội hình hộp chiến đấu`)."
  uncertainty: low
