findings:
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000467"
    severity: "minor"
    category: "idiom_and_nuance"
    issue: "Thành ngữ ẩn dụ bóng chày ở cuối câu thoại của Degurechaff chỉ việc lời đề nghị thành công mỹ mãn ngay lập tức đang được dịch thành hành động của đối phương ('nghe xong là đớp lấy ngay lập tức'), làm đổi nhẹ chủ thể của hình ảnh ẩn dụ và tăng sắc thái khẩu ngữ suồng sã."
    recommendation: "Có thể cân nhắc chỉnh thành 'Họ đang khát trận đến mức chỉ tung ra một cú là trúng phóc ngay' hoặc 'Họ đang khát trận đến mức vừa mở lời là thành công mỹ mãn ngay' (tuy nhiên cách dịch hiện tại vẫn truyền tải đúng ý kết quả thực tế)."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000474"
    severity: "minor"
    category: "pronouns_consistency"
    issue: "Ở p000474 và p000475, khi điểm nhìn trần thuật chuyển từ Weiss sang bám sát Tanya, đại từ ngôi thứ ba chỉ Tanya đang chuyển từ 'cô' (dùng xuyên suốt p000430–p000469 và các lô trước của tập 4) sang 'nó'. Quy ước DEC-P01-001 chỉ khóa 'nó' cho giai đoạn đầu tập 1 và lưu ý không tự mở rộng sang giai đoạn khác, còn sổ pending tập 2–4 đang ghi nhận đại từ ngôi thứ ba của Tanya là 'cô'."
    recommendation: "Đề xuất thống nhất dùng 'cô' cho trần thuật ngôi thứ ba ở p000474–p000475 để đồng bộ với toàn bộ tập 4, trong khi vẫn giữ đại từ tự quy chiếu 'mình' cho độc thoại nội tâm ở p000476."
