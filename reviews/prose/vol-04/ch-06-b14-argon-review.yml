      - "Nhấn mạnh Markdown: chỉ bọc '*À. Thúc ép người ta đưa ra câu trả lời có hoặc không quả là bõ công mà*' khớp thẻ em trong XHTML (DEC-P01-002)."
      - "Đại từ trần thuật: khuyến nghị đổi 'nó' thành 'cô' để đồng bộ với phần trên của batch và toàn tập 4."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000475"
    choices:
      - "Tình thái & thuật ngữ: giữ tình thái 'Xem chừng'; 'front lines' -> 'tiền tuyến'; khuyến nghị đổi đại từ trần thuật 'nó' thành 'cô' đồng bộ với p000474."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000476"
    choices:
      - "Đại từ nội tâm & giả định: độc thoại nội tâm của Tanya dùng đại từ tự quy chiếu 'Mình / mình' (DEC-P01-001); không bọc chữ nghiêng vì nguồn không có thẻ em (DEC-P01-002); giữ câu điều kiện 'Nếu xoay xở sống sót được, ít nhất mình cũng có thể đào thoát sang phương Tây'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000477"
    choices:
      - "Tiêu đề cảnh & thuật ngữ: 'UNIFIED YEAR' -> 'NĂM THỐNG NHẤT'; 'GENERAL STAFF OFFICE' -> 'BỘ TỔNG THAM MƯU'; 'LARGE CONFERENCE ROOM' -> 'PHÒNG HỌP LỚN'."
  - segment_id: "YS-LN04/Text/chapter001_v.xhtml/p000478"
    choices:
      - "Điểm nhìn & thuật ngữ: ngôi thứ nhất số nhiều 'Chúng tôi'; 'Kampfgruppe' -> 'Kampfgruppe'; 'General Staff / General Staff Office' -> 'Bộ Tổng tham mưu'; giữ tình thái suy đoán 'có lẽ'."
