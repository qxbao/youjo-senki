    issue: "Cụm 'gấp rút đào tạo cấp tốc' bị trùng nghĩa giữa 'gấp rút' và 'cấp tốc'."
    evidence: "Thành ngữ trong nguồn chỉ hành động đẩy mạnh tiến độ/ráo riết bồi dưỡng thêm một số pháp sư trái đợt tuyển quân thông thường."
    recommendation: "Có thể tinh giản thành 'ráo riết đào tạo cấp tốc' hoặc 'đẩy nhanh việc bồi dưỡng'."
