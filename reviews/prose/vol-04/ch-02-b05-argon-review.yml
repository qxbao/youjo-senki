  - hắn / gã (thay cho `ông ta` khi quy chiếu Loria trong trần thuật tại chapter001_f/p000128–p000137 — ưu tiên `ông ta` vì giữ nguyên giọng trần thuật lịch sử – chính trị khách quan, lạnh lùng khi khắc họa một viên quan chức hành chính ngoài bốn mươi tuổi coi con người như những con số thống kê, đồng bộ tuyệt đối với cách dùng `ông ta` cho Josef ở `ch-01-b23` và `ch-01-b24` cũng như quy tắc của `style-guide.md` về việc không tự thêm sắc thái miệt thị ngoài văn cảnh)
