  proposed_vi: "lẽ thường (chapter001_f/p000117) / Lergen, phòng thông tin liên lạc, Tanya (chapter001_f/p000119) / Liên bang, NGÀY 16 THÁNG 3, NĂM THỐNG NHẤT 1926, THỦ ĐÔ MOSKVA CỦA LIÊN BANG, thủ đô Moskva, Bộ Dân ủy Nội vụ, bộ dân ủy (chapter001_f/p000120–p000122, p000124, p000125, p000128, p000137) / lực lượng cảnh sát *mật* (chapter001_f/p000123) / “người bạn của nhân dân”, tầng lớp đặc quyền gồm các quan chức bộ máy đảng, cuộc thanh lọc đoàn chủ tịch trung ương đảng (chapter001_f/p000124) / tập thể hóa nông nghiệp, thanh trừng các phần tử phản động, các thế lực phản động, thanh trừng, phanh phui các hành vi phá hoại, phá hoại, trấn áp hoạt động liên lạc ngầm với gián điệp nước ngoài (chapter001_f/p000126, p000136, p000137) / cuộc săn phù thủy thời hiện đại, Ủy viên Nhân dân phụ trách Nội vụ—Đồng chí Loria, Loria (chapter001_f/p000127, p000129, p000132) / viên quan chức hành chính mẫn cán (chapter001_f/p000129) / các trại tập trung ở Sildberia, các trại tập trung, viên quản lý trại (chapter001_f/p000130, p000137) / tiền tuyến, hậu phương (chapter001_f/p000131) / Đế quốc, binh lính Đế quốc (chapter001_f/p000133, p000137) / tầng lớp dao động, phe phái chống đối chế độ (chapter001_f/p000137)"
  alternatives_vi:
  - Bộ trưởng Dân ủy Nội vụ (thay cho `Ủy viên Nhân dân phụ trách Nội vụ` tại chapter001_f/p000127 — ưu tiên `Ủy viên Nhân dân phụ trách Nội vụ` vì dịch chuẩn xác chức danh cá nhân *People’s Commissar for Internal Affairs* đứng đầu `Bộ Dân ủy Nội vụ` [*People’s Commissariat for Internal Affairs*] theo hệ thống danh xưng chính trị Xô viết – Liên bang) / cán bộ chuyên trách của đảng (thay cho `các quan chức bộ máy đảng` tại chapter001_f/p000124 — ưu tiên `các quan chức bộ máy đảng` vì giải nghĩa tự nhiên, rõ ràng khái niệm chính trị Nga *apparatchiks* khi đi kèm cụm định danh `tầng lớp đặc quyền`)
