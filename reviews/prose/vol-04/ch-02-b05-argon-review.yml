  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, giữ nhất quán hệ đại từ trần thuật `ông` và nội tâm `mình` của Đại tá von Lergen cùng lời phê chuẩn của Trung tướng von Zettour ở phần kết cuộc họp Bộ Tổng tham mưu, đồng thời xác lập hệ đại từ trần thuật `ông ta` khách quan, sắc lạnh cho Loria tại thủ đô Moskva (tiếp nối quy ước của `ch-01-b23` – `ch-01-b24`)."
