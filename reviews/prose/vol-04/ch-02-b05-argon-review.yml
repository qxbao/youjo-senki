  volume: vol-04
  chapter: 2
  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, quốc gia, địa danh, cơ quan và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1 và B01–B04 Chương 2 của Tập 4 (`lẽ thường`, `Lergen`, `Tanya`, `Liên bang`, `Đế quốc`, `NGÀY 16 THÁNG 3, NĂM THỐNG NHẤT 1926, THỦ ĐÔ MOSKVA CỦA LIÊN BANG`, `Moskva`, `Đồng chí Loria` / `Loria`, `Sildberia`, `thanh trừng`, `phá hoại`, `cuộc săn phù thủy`, `viên quan chức hành chính`, `tiền tuyến`, `hậu phương`), đồng thời khóa tạm các định danh thiết chế an ninh và thuật ngữ chính trị nội bộ của Liên bang trong phần mở đầu phân cảnh tại Moskva (`phòng thông tin liên lạc`, `Bộ Dân ủy Nội vụ` / `bộ dân ủy`, `Ủy viên Nhân dân phụ trách Nội vụ`, `lực lượng cảnh sát *mật*`, `các quan chức bộ máy đảng`, `đoàn chủ tịch trung ương đảng`, `tập thể hóa nông nghiệp`, `các phần tử phản động` / `các thế lực phản động`, `các trại tập trung`, `viên quản lý trại`, `tầng lớp dao động`, `phe phái chống đối chế độ`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: lergen_exit_and_moskva_loria_bureaucratic_narration_pronouns_vol04_ch02_b05
  proposed_vi: "Trong phần kết cuộc họp tại Bộ Tổng tham mưu Đế quốc (chapter001_f/p000117–p000120): tiếp nối B02–B04, Trung tướng von Zettour tự xưng `tôi` và quy chiếu Tanya là `cô ấy` khi ra lệnh phê chuẩn (p000118); trần thuật ngôi thứ ba quy chiếu Đại tá von Lergen bằng `ông` và tên riêng `Lergen` (p000119, p000120); trong độc thoại nội tâm trực tiếp, Lergen dùng `người ta` cho đại từ ngôi thứ hai khái quát (p000117), quy chiếu các sĩ quan tham mưu bằng `họ` (p000119) và tự quy chiếu ngôi thứ nhất bằng `Mình` (p000120); câu hỏi nội tâm giả định của Tanya dùng `Chúng ta` bao hàm bản thân và Tiểu đoàn 203 (p000119). Trong phân cảnh tại Bộ Dân ủy Nội vụ ở thủ đô Moskva (chapter001_f/p000121–p000137): tiếp nối giọng trần thuật lịch sử sắc lạnh về giới chóp bu Liên bang ở Chương 1 (B23–B24), quy chiếu Loria ở ngôi thứ ba bằng `ông ta` / `Ông ta` xuyên suốt (p000128–p000137), kết hợp đại từ phản thân `mình` / `bản thân` (p000129, p000131, p000132) và định danh bằng `Ủy viên Nhân dân phụ trách Nội vụ—Đồng chí Loria` / `Loria` (p000127, p000129, p000132); câu tự vấn nội tâm của công dân Liên bang dùng `mình` (p000122); đại từ ngôi thứ hai phiếm chỉ trong câu nhận định khái quát dùng `người ta` (p000123) và cấu trúc bất định `ai ... người đó ... kẻ đó` (p000125); quy chiếu Bộ Dân ủy Nội vụ và đội ngũ nhân viên bằng `nó` / `họ` / `đám người này` / `bọn họ` kết hợp phản thân `mình` (p000122, p000124–p000127), và quy chiếu các tù nhân lao động trong lời thoại của Loria bằng `bọn họ` (p000130)"
  alternatives_vi:
  - hắn / gã (thay cho `ông ta` khi quy chiếu Loria trong trần thuật tại chapter001_f/p000128–p000137 — ưu tiên `ông ta` vì giữ nguyên giọng trần thuật lịch sử – chính trị khách quan, lạnh lùng khi khắc họa một viên quan chức hành chính ngoài bốn mươi tuổi coi con người như những con số thống kê, đồng bộ tuyệt đối với cách dùng `ông ta` cho Josef ở `ch-01-b23` và `ch-01-b24` cũng như quy tắc của `style-guide.md` về việc không tự thêm sắc thái miệt thị ngoài văn cảnh)
