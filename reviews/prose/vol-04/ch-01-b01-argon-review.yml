  rationale: "Phản ánh chuẩn xác ngữ cảnh kỹ thuật hàng không, tác chiến bí mật vượt biên giới và thủ tục cảnh giới phòng không nhiều tầng trên bầu trời thủ đô Đế quốc."
  uncertainty: low
