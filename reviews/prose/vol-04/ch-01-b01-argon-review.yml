locked_choices:
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000001
  locks:
  - "Giữ dòng tiêu đề thời gian – địa điểm viết hoa toàn bộ: `NGÀY 15 THÁNG 3, NĂM THỐNG NHẤT 1926, TRÊN BẦU TRỜI VÙNG BIÊN GIỚI PHÍA ĐÔNG ĐẾ QUỐC`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000002
  locks:
  - "Giữ mô tả `chiếc máy bay vận tải hai động cơ` bay lặng lẽ trên bầu trời biên giới phía đông Đế quốc và hình ảnh `Ngựa thồ của Đơn vị Vận tải Hàng không Lục quân Đế quốc` thực hiện chuyến bay đêm hiếm hoi."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000003
  locks:
  - "Giữ chi tiết `Đèn dẫn đường` thường bật sáng và rõ hết mức trong `không phận quân nhà` để tránh va chạm nay đã bị tắt đi và dấu ba chấm cuối đoạn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000004
  locks:
  - "Giữ chi tiết thân máy bay sơn ngụy trang bay thong thả dưới màn đêm không phát ra tiếng động ngoài tiếng rì rầm khe khẽ của động cơ, cùng tỷ lệ `Trong một trăm người ngước nhìn lên bầu trời thì có đến chín mươi chín người` không thể biết có thứ gì trên đó."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000005
  locks:
  - "Giữ mục đích lớp sơn được thiết kế để bay vào lãnh thổ địch, khiến không thể phân biệt rõ quốc tịch."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000006
  locks:
  - "Giữ thông tin nguồn gốc `Vốn là một chiếc tiêm kích`, được trang bị mọi biện pháp chống phát hiện của `bộ chỉ huy không quân thuộc một đội tác chiến đặc biệt` chẳng ngần ngại xâm phạm biên giới."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000007
  locks:
  - "Giữ tên `Trung tâm Điều hành Tác chiến Phòng không phía Đông` trực thuộc `Cụm tập đoàn quân phía Đông của Đế quốc`, giả định nhân viên kiểm soát thấy thứ kỳ lạ trên màn hình radar cũng không được ghi nhận chính thức, và câu nói giả định của các sĩ quan `Bộ Tổng tham mưu` có dấu nhấn mạnh `*Các anh đã không nhìn thấy gì hết*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000008
  locks:
  - "Giữ nhận định nhân sự trên phi cơ hầu như là `bí mật quân sự của Đế quốc`, đơn vị là `đứa con cưng của Bộ Tổng tham mưu`, sẵn sàng làm cả `những công việc bẩn thỉu` khi cấp bách."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000009
  locks:
  - "Giữ sự đồng nhất giữa việc được đưa vào `đội tác chiến đặc biệt` này với sự công nhận là `tinh hoa bậc nhất của Lục quân Đế quốc`, cùng thái độ hết mực kính nể của hầu hết các sĩ quan trước lòng dũng cảm và kỹ năng huyền thoại của họ."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000010
  locks:
  - "Giữ dấu ba chấm mở đầu và sự đối lập rằng đối với vị chỉ huy của đơn vị đang được nhắc tới thì sự kính nể ấy hoàn toàn không cần thiết."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000011
  locks:
  - "Giữ câu độc thoại nội tâm in nghiêng toàn bộ `*Tất cả những gì mình muốn là có ai đó đổi chỗ cho mình.*` với đại từ `mình` theo DEC-P01-001 và DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000012
  locks:
  - "Giữ định danh `người đứng đầu đội tác chiến đặc biệt được giao nhiệm vụ trinh sát tầm xa sâu trong hậu phương địch ấy, Thiếu tá Tanya von Degurechaff`, và tiếng thở dài khẽ trong lòng."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000013
  locks:
  - "Giữ sự chuyển đổi đại từ chuẩn xác giữa nội tâm (`mình`, `bản thân`) khi nhìn đôi bàn tay nhỏ nhắn, mong muốn yêu cầu sự bảo vệ dành cho người vị thành niên, và câu trần thuật kết đoạn (`Tanya`, `nó`) phủ định khả năng rời tiền tuyến bằng cách lôi lá bài trẻ con ra nói rằng `nó không muốn chiến đấu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000014
  locks:
  - "Giữ tên `Tiểu đoàn Pháp sư Trên không số 203` dưới quyền chỉ huy trực tiếp của `Bộ Tổng tham mưu Lục quân Đế quốc`, thẩm quyền hành động độc lập, đại từ `chúng tôi` khi nhìn nhận sai lầm vì đã chứng tỏ bản thân hữu dụng và việc được thành lập nhờ sự hậu thuẫn của Bộ Tổng tham mưu ở quê nhà khiến đơn vị trở thành công cụ tiện lợi cho cấp trên."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000015
  locks:
  - "Giữ đại từ `chúng tôi` bị quăng lên khắp mọi mặt trận, nhào nặn thành đám cựu binh dày dạn, và cụm `Từ Chỉ huy von Degurechaff trở xuống, mọi sĩ quan lão luyện trong tiểu đoàn đều mang danh tinh nhuệ`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000016
  locks:
  - "Giữ hình ảnh Tanya ôm đầu than thở và câu nội tâm có dấu nhấn mạnh `*Mình không muốn chiến đấu, nhưng xem chừng lúc này khó lòng mà trốn thoát được*` theo DEC-P01-001 và DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000017
  locks:
  - "Giữ đại từ `nó` ngẫm lại chuyện vài giờ trước và niềm vui ngắn ngủi khi đáp xuống trở lại `thủ đô Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000018
  locks:
  - "Giữ câu dẫn chuyển cảnh ngắn gọn: `Hãy quay ngược lại vài giờ trước.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000019
  locks:
  - "Giữ đại từ `nó`, cảm giác bầu trời `thủ đô Đế quốc` chật chội vì `tuyến đánh chặn dày đặc`, và sự phát ngấy mỗi khi đi qua `khu vực phòng không nhiều tầng` lại bị dưới mặt đất `tra hỏi nhận dạng`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000020
  locks:
  - "Giữ chi tiết họ có thể kiêm nhiệm vụ tuần tra nhưng việc phải chào hỏi cả những đồng đội của `nó` thuộc `đơn vị huấn luyện` cũng thường gây phiền phức."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000021
  locks:
  - "Giữ nhận định con người vốn chẳng được tạo ra để thích thú việc `bị chĩa súng tra hỏi nhận dạng`, kể cả bởi `quân nhà` đang đơn thuần làm nhiệm vụ."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000022
  locks:
  - "Giữ mạch đối lập `Dẫu vậy, vài giờ trước`, khi `Tanya` bay dọc theo `lộ trình đã được ấn định sẵn` phía trên thủ đô, `nó` có được cảm giác bình yên trọn vẹn đến mức những thủ tục rắc rối chẳng làm `nó` bận tâm."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000023
  locks:
  - "Giữ đại từ `nó` khi cuối cùng đã trở về được thủ đô, tâm trạng phấn chấn của cả đơn vị khi thành phố hiện ra từ đằng xa, và niềm vui sướng không sao giấu nổi của các binh sĩ khi được triệu hồi về tổ quốc, rời xa vùng cát cằn cỗi mênh mông vô tận của `mặt trận phía nam`."
