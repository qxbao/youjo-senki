- source_term: covert_mission_and_air_defense_terms_vol04_ch01_b01
  proposed_vi: "máy bay vận tải hai động cơ, ngựa thồ (chapter001_b/p000002) / đèn dẫn đường, không phận quân nhà (chapter001_b/p000003) / công việc bẩn thỉu (chapter001_b/p000008) / nhiệm vụ trinh sát tầm xa sâu trong hậu phương địch (chapter001_b/p000012) / tuyến đánh chặn dày đặc, khu vực phòng không nhiều tầng, tra hỏi nhận dạng (chapter001_b/p000019, p000021)"
  alternatives_vi:
  - phi vụ ướt / ám sát ngầm (thay cho `công việc bẩn thỉu` tại chapter001_b/p000008 — ưu tiên `công việc bẩn thỉu` vì truyền tải tự nhiên nghĩa ẩn dụ hoạt động ngầm đen tối mà không thu hẹp quá mức phạm vi nhiệm vụ) / thẩm vấn nhận dạng (thay cho `tra hỏi nhận dạng` tại chapter001_b/p000019, p000021 — ưu tiên `tra hỏi nhận dạng` để phản ánh đúng thủ tục kiểm soát gác phòng không/tuần tra)
  segment_ids:
