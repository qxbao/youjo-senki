  rationale: "Kế thừa nhất quán các danh xưng quân sự đã khóa tạm ở các tập trước (`Lục quân Đế quốc`, `Bộ Tổng tham mưu`, `Cụm tập đoàn quân phía Đông`, `Tiểu đoàn Pháp sư Trên không số 203`, `đơn vị huấn luyện`) và khóa đồng bộ các đơn vị xuất hiện đầu Tập 4 gồm `Đơn vị Vận tải Hàng không Lục quân Đế quốc` (`p000002`), `Trung tâm Điều hành Tác chiến Phòng không phía Đông` (`p000007`) và `đội tác chiến đặc biệt` (`p000006`, `p000009`, `p000012`)."
