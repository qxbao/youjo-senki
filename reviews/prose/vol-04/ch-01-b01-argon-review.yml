  proposed_vi: "Đơn vị Vận tải Hàng không Lục quân Đế quốc (chapter001_b/p000002) / Trung tâm Điều hành Tác chiến Phòng không phía Đông, Cụm tập đoàn quân phía Đông của Đế quốc (chapter001_b/p000007) / đội tác chiến đặc biệt, bộ chỉ huy không quân (chapter001_b/p000006, p000009, p000012) / Tiểu đoàn Pháp sư Trên không số 203, Bộ Tổng tham mưu Lục quân Đế quốc (chapter001_b/p000007, p000008, p000014) / đơn vị huấn luyện (chapter001_b/p000020)"
  alternatives_vi:
