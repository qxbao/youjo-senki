- source_term: tanya_narration_and_general_staff_address_vol04_ch01_b01
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000013, p000017, p000019–p000023); độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000011, p000013, p000016); khi tự quy chiếu tập thể Tiểu đoàn 203 ở ngôi thứ nhất số nhiều dùng `chúng tôi` (chapter001_b/p000014–p000015); sĩ quan Bộ Tổng tham mưu gọi nhân viên kiểm soát radar là `Các anh` (chapter001_b/p000007)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` tại chapter001_b/p000014–p000015 — không chọn vì `chúng tôi` phân biệt rõ tập thể Tiểu đoàn 203 với lời dẫn chuyển cảnh ở p000018) / Các cậu (thay cho `Các anh` tại chapter001_b/p000007 — ưu tiên `Các anh` để giữ sắc thái công vụ quân sự trang trọng khi sĩ quan Bộ Tổng tham mưu phát ngôn)
