- source_term: camp_21_battalion_hq_tanya_weiss_serebryakov_pronouns_and_emphasis_vol04_ch03_b08
  proposed_vi: "Trong phân cảnh tại sở chỉ huy Tiểu đoàn 203 ở Doanh trại Lâm thời số 21 (chapter001_l/p000103–p000135): tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b07`: (1) Trần thuật ngôi thứ ba theo điểm nhìn của Tanya quy chiếu Thiếu tá Tanya von Degurechaff bằng đại từ `nó` / `Nó` (p000103, p000109, p000120, p000123, p000135) kết hợp tên riêng `Tanya` (p000103, p000111, p000112, p000119–p000121, p000129, p000132, p000135) và đại từ phản thân `mình` (p000129, p000132); quy chiếu Đại úy Weiss bằng tên riêng `Weiss` và đại từ `anh` (p000103, p000109, p000110, p000112); quy chiếu người lính truyền tin bằng `anh ta` (p000120); quy chiếu các đạo quân phía đông và binh lính thuộc quyền bằng `họ` (p000104, p000120). (2) Trong độc thoại nội tâm trực tiếp in nghiêng (p000120, p000133, p000134 — bảo toàn chính xác phạm vi nhấn mạnh `*...*` theo `DEC-P01-002`, cùng từ cảm thán `*Ồ?*` tại p000119) và các câu suy nghĩ ngôi thứ nhất của Tanya (p000105, p000109, p000115, p000116): tự quy chiếu ngôi thứ nhất số ít bằng `mình` / `Mình` (p000105, p000120, p000133, p000134), ngôi thứ nhất số nhiều chỉ tập thể đơn vị / phía Đế quốc bằng `chúng tôi` (p000109, p000116), và dùng chủ ngữ khái quát `ai đó` / `người ta` cho đại từ ngôi thứ hai phiếm chỉ trong câu nhận định chung (p000105, p000111). (3) Trong đối thoại quân vụ tại sở chỉ huy tiểu đoàn: giữa Tanya và Đại úy Weiss (p000106–p000108, p000110, p000112–p000114, p000117, p000118), Tanya tự xưng `Tôi`, gọi Weiss là `Đại úy Weiss` / `Đại úy` / `Anh` / `anh` (p000112), dùng `chúng ta` / `Chúng ta` khi nói về quân đội Đế quốc và đơn vị (p000112, p000118), quy chiếu quân Liên bang bằng `chúng` (p000108) và gã khổng lồ Liên bang bằng `nó` (p000114), còn Weiss tự xưng `tôi` / `Tôi`, dùng `Chúng ta` / `chúng ta`, và thêm tiểu từ lễ phép `ạ` khi báo cáo/hỏi xin ý kiến cấp chỉ huy (p000107, p000110, p000113, p000117); giữa Tanya với Trung úy Serebryakov và lính truyền tin (p000120, p000122, p000124–p000126, p000128–p000131), Tanya tự xưng `tôi` / `Tôi`, gọi `Trung úy Serebryakov` (p000126, p000129, p000130), còn Serebryakov và lính truyền tin gọi `Thiếu tá von Degurechaff` / `Thiếu tá`, tự xưng `Tôi`, và dùng `ạ` / `Vâng, thưa Thiếu tá.` (p000122, p000125, p000128, p000131)"
  alternatives_vi:
  - cô (thay cho `nó` / `Nó` trong trần thuật bám sát điểm nhìn của Tanya tại chapter001_l/p000103, p000109, p000120, p000123, p000135 — bắt buộc giữ `nó` trong trần thuật và `mình` trong nội tâm của Tanya theo đúng quy định đã duyệt tại `DEC-P01-001`) / cậu (thay cho `anh` / `Anh` khi Tanya nói chuyện với Đại úy Weiss tại chapter001_l/p000112 — bắt buộc giữ `anh` / `Anh` để đồng bộ tuyệt đối với cách xưng hô quân vụ giữa Tanya và Weiss xuyên suốt Tập 1–4)
