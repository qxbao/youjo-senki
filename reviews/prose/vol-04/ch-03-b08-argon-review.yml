  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự phân biệt rạch ròi giữa trần thuật theo điểm nhìn của Tanya (`nó` / `Nó` cho Tanya, `anh` cho Weiss, `anh ta` cho lính truyền tin, `họ` cho đơn vị), độc thoại nội tâm của Tanya (`mình` / `Mình`, `chúng tôi`), và đối thoại quân vụ giữa chỉ huy tiểu đoàn với sĩ quan phó (`Tôi` – `Đại úy Weiss` / `Đại úy` / `anh`, `tôi` – `ạ`, `chúng ta`) cũng như với sĩ quan phụ tá và lính truyền tin (`tôi` / `Tôi` – `Trung úy Serebryakov`, `Tôi` – `Thiếu tá von Degurechaff` / `Thiếu tá` – `ạ`)."
