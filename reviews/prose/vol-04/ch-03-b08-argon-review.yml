  proposed_vi: "Tanya (Thiếu tá von Degurechaff / Thiếu tá), Đại úy Weiss (Weiss / Đại úy), cà phê thay thế, sở chỉ huy tiểu đoàn (chapter001_l/p000103, p000109–p000112, p000119–p000122, p000125, p000128, p000129, p000131, p000132, p000135) / phòng ngự trì hoãn, vừa rút lui vừa tác chiến, tiền tuyến, biên giới phía đông (chapter001_l/p000104–p000106) / Cụm tập đoàn quân phía Đông, Lục quân Liên bang, đám Cộng sản, Đế quốc, Liên bang, mặt trận phía đông (chapter001_l/p000107–p000110, p000112, p000114, p000121) / hậu phương, Bộ Tổng tham mưu, chính trị trong nước, các chính ủy, cơ cấu chỉ huy, Tsugene, Lục quân Đế quốc Nhật Bản cũ, Tướng Khốn-guchi (chapter001_l/p000112, p000115, p000121, p000128, p000133) / người lính truyền tin (lính truyền tin), Grantz, trực chờ xuất kích, các đạo quân phía đông, Trung úy Serebryakov (Serebryakov), Sư đoàn số 3 và Sư đoàn số 32, lực lượng đoạn hậu, tác chiến trì hoãn, Tiegenhoff, bộ chỉ huy, nhiệm vụ cơ động, lập đội hình tiến công tầm xa (chapter001_l/p000120–p000123, p000125, p000127, p000128, p000130, p000134)"
