  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự – lịch sử đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b07` của Tập 4 (`Tanya` / `Thiếu tá von Degurechaff` / `Thiếu tá`, `Đại úy Weiss` / `Weiss`, `cà phê thay thế`, `sở chỉ huy tiểu đoàn`, `tiền tuyến`, `biên giới phía đông`, `Cụm tập đoàn quân phía Đông`, `Lục quân Liên bang`, `đám Cộng sản`, `Đế quốc`, `Liên bang`, `mặt trận phía đông`, `hậu phương`, `Bộ Tổng tham mưu`, `các chính ủy`, `cơ cấu chỉ huy`, `Tsugene`, `Tướng Khốn-guchi`, `Grantz`, `các đạo quân phía đông`, `Trung úy Serebryakov` / `Serebryakov`, `lực lượng đoạn hậu`, `tác chiến trì hoãn`, `bộ chỉ huy`, `nhiệm vụ cơ động`), đồng thời khóa tạm các tổ hợp thuật ngữ trong phân cảnh Tanya và Weiss phân tích điểm yếu cơ cấu chính ủy của Liên bang và nhận tin Sư đoàn số 3, Sư đoàn số 32 bị bao vây tại Tiegenhoff cùng lúc với lệnh cơ động từ Bộ Tổng tham mưu (`phòng ngự trì hoãn`, `vừa rút lui vừa tác chiến`, `Lục quân Đế quốc Nhật Bản cũ`, `lính truyền tin`, `trực chờ xuất kích`, `Sư đoàn số 3 và Sư đoàn số 32`, `Tiegenhoff`, `lập đội hình tiến công tầm xa`)."
  uncertainty: low
