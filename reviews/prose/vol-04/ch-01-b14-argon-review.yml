- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000038
  locks:
  - "Giữ các cụm `đám lý luận gia Cộng sản` và `báo cáo của đoàn thanh tra nhà máy`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000039
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, đại từ nội tâm `mình` theo DEC-P01-001, cụm `môn đồ của chủ nghĩa tư bản` và tên viết tắt `NRA`."
