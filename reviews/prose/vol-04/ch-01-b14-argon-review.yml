- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000022
  locks:
  - "Giữ câu nội tâm in nghiêng `*Xem ra chúng tôi biết phải làm gì rồi.*` theo DEC-P01-002 và tên `Tanya`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000023
  locks:
