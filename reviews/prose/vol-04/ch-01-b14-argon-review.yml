  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và giữ nhất quán quy ước xưng hô trong nội bộ Tiểu đoàn 203 giữa Thiếu tá Tanya von Degurechaff, Đại úy Weiss, Trung úy Serebryakov và Trung úy Grantz tại thời khắc chiến tranh với Liên bang chính thức bùng nổ."
