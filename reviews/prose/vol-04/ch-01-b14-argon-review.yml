- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000004
  locks:
  - "Giữ các cụm thuật ngữ `viên sĩ quan phụ tá`, `tín hiệu quang học định hướng`, `kỷ luật hỏa lực`, đại từ `cô` quy chiếu Serebryakov, tên `Tanya` và danh xưng `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000005
  locks:
  - "Giữ câu đầu in nghiêng `*Kẻ địch hẳn đang mơ mộng về một cuộc tấn công một chiều nhắm vào Đế quốc.*` theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000006
  locks:
  - "Giữ đại từ tập thể `chúng tôi`, đại từ phản thân `mình`, danh xưng `Liên bang` và cụm `bộ máy tuyên truyền của phe Cộng sản`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000007
  locks:
  - "Giữ tên địa danh lịch sử `Bắc Triều Tiên`, `Nam Triều Tiên` và cụm `thân Cộng sản`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000008
  locks:
  - "Giữ đại từ tập thể `chúng tôi` trong độc thoại nội tâm của Tanya."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000009
  locks:
  - "Giữ danh xưng `Lục quân Liên bang`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000010
  locks:
  - "Giữ từ mở đầu in nghiêng `*Được rồi*` theo DEC-P01-002, tên `Tanya` và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000011
  locks:
  - "Giữ cụm thuật ngữ `pháo đường sắt` và `trận địa của Liên bang`."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000012
  locks:
  - "Giữ cụm cảm thán nội tâm in nghiêng `*Cái quái—?*` theo DEC-P01-002 và đại từ trần thuật `nó` theo DEC-P01-001."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000013
  locks:
