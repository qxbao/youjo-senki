  locks:
  - "Giữ danh xưng `phe Đỏ` và cấu trúc điệp khúc dồn dập."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000029
  locks:
  - "Giữ tên `Tanya`, đại từ trần thuật `nó` theo DEC-P01-001 và cụm in nghiêng `*tức tốc*` ở cuối câu theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_d.xhtml/p000030
  locks:
