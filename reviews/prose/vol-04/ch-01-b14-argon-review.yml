  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng đơn vị, quốc gia, nhân vật, vũ khí – khí tài và thuật ngữ chính trị – kinh tế đã khóa tạm từ Tập 1–3 cùng B01–B13 của Tập 4 (`Serebryakov`, `sĩ quan phụ tá`, `Liên bang`, `Đế quốc`, `Cộng sản`, `Lục quân Liên bang`, `pháo đường sắt`, `Grantz`, `điểm tập kết xuất phát`, `Thiếu tá`, `Weiss`, `điện đài vô tuyến`, `chính quốc`, `phe Đỏ`, `quân Đỏ`, `Cụm tập đoàn quân phía Đông`, `lũ Cộng sản`, `chủ nghĩa hòa bình`, `chủ nghĩa tư bản`), đồng thời khóa tạm các thuật ngữ tác chiến và liên tưởng lịch sử – kinh tế xuất hiện trong batch (`tín hiệu quang học định hướng`, `kỷ luật hỏa lực`, `Bắc Triều Tiên`, `Nam Triều Tiên`, `kế hoạch ứng phó thời chiến`, `đội hình xung kích`, `đoàn thanh tra nhà máy`, `NRA`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_serebryakov_grantz_weiss_war_outbreak_pronouns_and_address_vol04_ch01_b14
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_d/p000010, p000012, p000025, p000029), giữ nguyên tên riêng `Tanya` (chapter001_d/p000004, p000010, p000022, p000024, p000029, p000035, p000036) và quy chiếu Trung úy Serebryakov trong trần thuật bằng `cô` (chapter001_d/p000004); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_d/p000001, p000006, p000031, p000033, p000036, p000037, p000039), và ngôi thứ nhất số nhiều chỉ tập thể đơn vị Tiểu đoàn 203 / phía Đế quốc trong độc thoại nội tâm dùng `chúng tôi` (chapter001_d/p000006, p000008, p000021, p000022, p000033, p000035, p000039); trong đối thoại giữa Tanya, Serebryakov, Grantz và Weiss: Tanya hạ lệnh qua Serebryakov, hỏi thông tin từ Weiss và phát lệnh tác chiến cho toàn đơn vị bằng `Serebryakov`, dùng `chúng ta` khi bao hàm toàn đơn vị (chapter001_d/p000002, p000019, p000023, p000030, p000032, p000034); Serebryakov nhận lệnh đáp `R-rõ ạ.` (chapter001_d/p000003); Grantz buột miệng cảm thán trước cảnh pháo đường sắt Liên bang khai hỏa (chapter001_d/p000013); Weiss khẩn cấp báo cáo tin tức từ điện đài vô tuyến gọi `Thiếu tá!` (chapter001_d/p000017, p000018, p000020)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_d/p000006, p000008, p000021, p000022, p000033, p000035, p000039 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B13, đồng thời phân biệt rõ với `chúng ta` dùng trong lời thoại mệnh lệnh trực tiếp trước toàn đơn vị tại p000032, p000034)
