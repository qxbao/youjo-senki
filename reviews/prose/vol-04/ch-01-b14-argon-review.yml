  proposed_vi: "Serebryakov (chapter001_d/p000002) / sĩ quan phụ tá, tín hiệu quang học định hướng, kỷ luật hỏa lực, Liên bang (chapter001_d/p000004, p000006, p000011, p000016–p000018) / Đế quốc, phe Cộng sản (chapter001_d/p000005, p000006, p000016, p000018, p000025, p000033) / Bắc Triều Tiên, Nam Triều Tiên, Cộng sản (chapter001_d/p000007) / Lục quân Liên bang (chapter001_d/p000009, p000032) / pháo đường sắt, trận địa của Liên bang (chapter001_d/p000011, p000015, p000016, p000025) / Grantz (chapter001_d/p000014) / điểm tập kết xuất phát (chapter001_d/p000015) / Thiếu tá, Weiss, điện đài vô tuyến (chapter001_d/p000017, p000024) / chính quốc (chapter001_d/p000019) / kế hoạch ứng phó thời chiến (chapter001_d/p000023) / phe Đỏ, quân Đỏ (chapter001_d/p000026–p000028, p000033) / Cụm tập đoàn quân phía Đông, cơ động tấn công (chapter001_d/p000032) / kho dự trữ, đội hình xung kích (chapter001_d/p000034) / lũ Cộng sản, chủ nghĩa hòa bình, kinh tế học, xưởng gốm sứ (chapter001_d/p000035, p000037) / lý luận gia Cộng sản, đoàn thanh tra nhà máy (chapter001_d/p000038) / chủ nghĩa tư bản, NRA (chapter001_d/p000039)"
  alternatives_vi:
  - truyền tin quang học có hướng (thay cho `tín hiệu quang học định hướng` tại chapter001_d/p000004 — ưu tiên `tín hiệu quang học định hướng` vì gọn, tự nhiên và thể hiện rõ động tác phát tín hiệu ánh sáng chiếu thẳng về phía đội hình phía sau để giữ bí mật vô tuyến) / phương án tác chiến thời chiến (thay cho `kế hoạch ứng phó thời chiến` tại chapter001_d/p000023 — ưu tiên `kế hoạch ứng phó thời chiến` vì sát nghĩa nguyên bản và phản ánh đúng quy trình chuyển trạng thái từ trinh sát thời bình sang ứng chiến ngay khi chiến tranh bùng nổ) / đội hình đột kích (thay cho `đội hình xung kích` tại chapter001_d/p000034 — ưu tiên `đội hình xung kích` vì mang âm hưởng mệnh lệnh quân sự dứt khoát của pháp sư không quân khi lao vào công kích mục tiêu)
