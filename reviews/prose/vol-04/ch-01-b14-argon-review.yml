  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_d/p000006, p000008, p000021, p000022, p000033, p000035, p000039 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể đơn vị Tiểu đoàn 203 và phía Đế quốc trong độc thoại nội tâm xuyên suốt B01–B13, đồng thời phân biệt rõ với `chúng ta` dùng trong lời thoại mệnh lệnh trực tiếp trước toàn đơn vị tại p000032, p000034)
