- source_term: tiegenhoff_tanya_pov_to_rudersdorf_general_staff_pov_pronouns_and_emphasis_vol04_ch03_b21
  proposed_vi: "Trong toàn bộ lô `vol-04-ch-03-b21` (chapter001_l/p000544–p000577) khép lại Chương 3 Tập 4 qua hai phân cảnh: tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và tiếp nối liền mạch `vol-04-ch-03-b13`–`b20`: (1) Phân cảnh 1 (p000544–p000567) theo điểm nhìn của Thiếu tá Tanya von Degurechaff khi kết thúc đợt tìm diệt tám sư đoàn Liên bang và rút về Tiegenhoff: trần thuật ngôi thứ ba bám sát điểm nhìn của Tanya quy chiếu Tanya nhất quán bằng tên riêng `Tanya` và đại từ `nó` / `Nó` kết hợp phản thân `mình` (p000544, p000545, p000549, p000552, p000556, p000560, p000561, p000565), tuyệt đối không dùng `cô` cho Tanya trong lời kể hay độc thoại nội tâm; trong độc thoại nội tâm ngôi thứ nhất số ít của Tanya dùng `mình` (p000559, p000566), và ngôi thứ nhất số nhiều chỉ tập thể đơn vị dùng `chúng tôi` (p000559); trong lời kể, quy chiếu Trung úy Grantz bằng `anh` kết hợp phản thân `mình` (p000565), quy chiếu tập thể Tiểu đoàn 203 / phía Đế quốc bằng `họ` (p000545, p000556, p000561, p000562), và quy chiếu quân địch Liên bang bằng `chúng` (p000553); trong hội thoại giữa Tanya và Trung úy Serebryakov (p000546–p000550, p000552–p000555, p000557, p000558, p000563), Tanya tự xưng `tôi`, dùng `chúng ta` / `Chúng ta` cho đơn vị, gọi Serebryakov là `Trung úy Serebryakov` và `Cô` / `cô`, quy chiếu Thiếu tá Hofen bằng `ông ấy` (p000563), quy chiếu hạm đội không quân phía đông bằng `Họ` / `họ` (p000554) và quân địch bằng `chúng`, còn Serebryakov tự xưng `tôi`, dùng `chúng ta` cho đơn vị và gọi Tanya là `thưa Thiếu tá` kèm tiểu từ kính ngữ `ạ`. (2) Phân cảnh 2 (p000568–p000577) theo điểm nhìn khách quan của Trung tướng von Rudersdorf tại Văn phòng Bộ Tổng tham mưu Lục quân Đế quốc: tuân thủ giới hạn của `DEC-P01-001` (không mở rộng đại từ `nó` sang điểm nhìn nhân vật khác ngoài Tanya) và đồng bộ với `vol-04-ch-03-b13`–`b14`, trần thuật quy chiếu Rudersdorf bằng `Trung tướng von Rudersdorf` / `Rudersdorf` và đại từ trang trọng trung tính `ông` (p000569, p000571, p000574), quy chiếu Thiếu tá Tanya von Degurechaff qua bản báo cáo bằng `Thiếu tá Tanya von Degurechaff` / `Degurechaff` và đại từ `Cô` / `cô` kết hợp phản thân `bản thân` (p000569–p000572), quy chiếu phía Đế quốc bằng `họ` (p000574) và quân Liên bang bằng `chúng` (p000569, p000572); câu độc thoại nội tâm của Rudersdorf tại p000575 dùng đại từ ngôi thứ nhất số nhiều `Chúng ta` (`*Chúng ta thắng rồi.*`). (3) Bảo toàn chính xác 8 vị trí nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000544 (`*Chắc đã đến lúc rồi.*`), p000551 (`*Lục quân Liên bang không có lực lượng pháp sư trên không ư?*`), p000556 (`*Đúng thế thật.*`), p000559 (`*Nếu vậy thì chắc mình đã đọc sai tình hình rồi.*` và `*Thay vì bận tâm tới chuyện lùng sục, đáng lẽ chúng tôi nên tập trung toàn lực vào việc công kích mục tiêu mặt đất mới phải.*`), p000565 (`*Xem chừng Grantz mê rượu chè ra trò. Thế là không tốt đâu*`), p000566 (`*Vừa rồi mình định can thiệp vào quyền tự do cá nhân của người khác đấy ư?*`), p000567 (`*…Lại còn dựa trên những cơ sở đạo đức đáng ngờ nữa chứ?*`) và p000575 (`*Chúng ta thắng rồi.*`), không phát sinh dấu `*` ngoài nguồn ở 26 đoạn còn lại."
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong độc thoại nội tâm của Tanya tại chapter001_l/p000559 — ưu tiên `chúng tôi` để phân biệt rạch ròi giữa độc thoại nội tâm của Tanya và đại từ gộp `chúng ta` khi Tanya trao đổi trong thoại trực tiếp, đồng bộ với `vol-04-ch-03-b19`–`b20`)
