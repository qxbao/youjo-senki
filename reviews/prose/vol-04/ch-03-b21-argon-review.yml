  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, giữ sự liền mạch tuyệt đối với các lô trước của Chương 3 ở cả hai điểm nhìn: góc nhìn Tanya trên chiến trường Tiegenhoff (`Tanya` / `nó` trong lời kể, `mình` / `chúng tôi` trong nội tâm, thoại quân ngũ chuẩn mực với Trung úy Serebryakov) và góc nhìn Trung tướng von Rudersdorf tại Bộ Tổng tham mưu (`ông` cho Rudersdorf, `Cô` / `cô` cho Degurechaff qua báo cáo, `Chúng ta` trong nội tâm của Rudersdorf), đồng thời bảo toàn chính xác cả 8 đoạn có nhấn mạnh in nghiêng."
