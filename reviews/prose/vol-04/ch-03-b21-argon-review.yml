  proposed_vi: "Tanya / Thiếu tá Tanya von Degurechaff / Degurechaff, tiểu đoàn, trinh sát chiến đấu, đơn vị pháp sư trên không / lực lượng pháp sư trên không, quả cầu tính toán, công kích mục tiêu mặt đất, đạn thuật thức, thuộc cấp, sư đoàn / tám sư đoàn, hạm đội không quân, Serebryakov / Trung úy Serebryakov, lực lượng không quân / lực lượng không quân Liên bang, Thiếu tá, Lục quân Liên bang / quân Liên bang, quân đội Dacia, Cộng sản, Liên bang, cường quốc, quyền làm chủ bầu trời, các đơn vị pháp sư / một đơn vị pháp sư / các pháp sư / pháp sư địch / lực lượng pháp sư địch, pháp sư Đế quốc, Khối Thịnh vượng chung, Tiểu đoàn Pháp sư Trên không số 203, rút lui, Tiegenhoff, lực lượng mặt đất, Thiếu tá Hofen, Tiểu đoàn Pháp sư số 213, Grantz, NGÀY 29 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC, Trung tướng von Rudersdorf / Rudersdorf, phòng ngự cơ động, lực lượng dự bị, Đế quốc (chapter001_l/p000544–p000559, p000562–p000565, p000568–p000572, p000577)"
