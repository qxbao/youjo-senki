  rationale: "Kế thừa đồng bộ hệ thống danh xưng nhân vật, địa danh, đơn vị, tiêu đề mốc thời gian – địa điểm và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b20` của Tập 4 (`Tanya` / `Thiếu tá Tanya von Degurechaff` / `Degurechaff`, `trinh sát chiến đấu`, `đơn vị pháp sư trên không` / `lực lượng pháp sư trên không`, `quả cầu tính toán`, `công kích mục tiêu mặt đất`, `đạn thuật thức`, `thuộc cấp`, `sư đoàn` / `tám sư đoàn`, `hạm đội không quân`, `Serebryakov` / `Trung úy Serebryakov`, `lực lượng không quân`, `Thiếu tá`, `Lục quân Liên bang` / `quân Liên bang`, `quân đội Dacia`, `Cộng sản`, `Liên bang`, `cường quốc`, `quyền làm chủ bầu trời`, `pháp sư Đế quốc`, `Khối Thịnh vượng chung`, `Tiểu đoàn Pháp sư Trên không số 203`, `rút lui`, `Tiegenhoff`, `lực lượng mặt đất`, `Thiếu tá Hofen`, `Tiểu đoàn Pháp sư số 213`, `Grantz`, `NGÀY 29 THÁNG 3, NĂM THỐNG NHẤT 1926, VĂN PHÒNG BỘ TỔNG THAM MƯU LỤC QUÂN ĐẾ QUỐC`, `Trung tướng von Rudersdorf` / `Rudersdorf`, `phòng ngự cơ động`, `lực lượng dự bị`, `Đế quốc`)."
  uncertainty: low
  status: pending
