findings:
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000123"
    severity: "minor"
    category: "pronouns_and_viewpoint"
    issue: "Ở câu cuối, vế đầu dùng đại từ 'họ' để chỉ phía cảnh sát Khối Thịnh vượng chung ('Không những họ giúp chúng ta đỡ tốn thời gian...'), nhưng sang vế sau lại dùng 'họ' để chỉ những người trên chiếc máy bay Đế quốc bị rơi còn phía cảnh sát địch đổi thành 'chúng' ('...biết họ đang ở đâu và chúng đang áp giải họ đi đâu'), gây nhập nhằng đối tượng quy chiếu trong cùng một câu."
    rationale: "Theo canon/style-guide.md, cần giữ cách quy chiếu rõ ràng và nhất quán giữa các mệnh đề trong câu để người đọc không nhầm chủ thể giữa hai vế cấu trúc 'Không những... mà... còn...'."
    suggestion: "Đổi đại từ chỉ phía địch ở vế đầu thành 'chúng' (hoặc làm rõ đối tượng) để phân biệt rạch ròi với 'họ' (những người gặp nạn phe mình) ở vế sau, ví dụ: 'Không những chúng giúp chúng ta đỡ tốn thời gian và công sức tìm kiếm, mà chúng ta thậm chí còn biết họ đang ở đâu và chúng đang áp giải họ đi đâu.'"
  - segment_id: "YS-LN04/Text/chapter001_t.xhtml/p000143"
    severity: "minor"
    category: "meaning_and_register"
    issue: "Trong câu độc thoại nội tâm thứ hai của Tanya ngay sau khi nảy ra sáng kiến và mỉm cười, cụm cảm thán thể hiện sự chợt nhận ra vấn đề hóa ra rất đơn giản được dịch là 'À, kệ đi.' mang sắc thái buông xuôi hoặc bỏ qua, chưa khớp với mạch reo vui 'Chuyện này đơn giản mà! Chúng ta từng làm việc này rồi.'"
    rationale: "Theo canon/style-guide.md, cần giữ đúng sắc thái và quan hệ cảm xúc trong độc thoại nội tâm khi nhân vật tìm ra lời giải."
    suggestion: "Đổi '*À, kệ đi. Chuyện này đơn giản mà! Chúng ta từng làm việc này rồi.*' thành '*À, có gì đâu. Chuyện này đơn giản mà! Chúng ta từng làm việc này rồi.*' (hoặc '*À, tưởng gì. Chuyện này đơn giản mà! Chúng ta từng làm việc này rồi.*')."
