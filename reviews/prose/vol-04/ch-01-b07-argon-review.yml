  volume: vol-04
  chapter: 1
  rationale: "Kế thừa đồng bộ hệ thống danh xưng quân sự, cơ quan tham mưu và quốc gia đã khóa tạm từ Tập 1–3 cùng B01–B06 của Tập 4 (`Đại úy Weiss`, `Serebryakov`, `Grantz`, `tiểu đoàn trưởng`, `Liên bang`, `Bộ Tổng tham mưu`, `trinh sát tầm xa`, `quy tắc giao chiến`, `Cụm tập đoàn quân phía Đông`, `Các Cụm tập đoàn quân phía Bắc, phía Tây và phía Nam`, `Bộ Tư lệnh Tối cao`, `Đế quốc`, `ban Trinh sát Chiến lược thuộc Cục Tác chiến của Bộ Tổng tham mưu`), đồng thời khóa tạm các thuật ngữ kinh tế học và trinh sát biên giới xuất hiện trong batch (`công thức về lợi thế so sánh của Ricardo`, `Trung đội Trinh sát Đặc biệt Chiến thuật số 437` / `Trung đội 437`, `người Siberia`, `Tuyến Cảnh giới số Một`)."
  uncertainty: low
  status: pending
  canon: false
- source_term: tanya_weiss_troops_briefing_pronouns_and_address_vol04_ch01_b07
  proposed_vi: "Trần thuật quy chiếu Thiếu tá Tanya von Degurechaff bằng `nó` (chapter001_b/p000188, p000189, p000200) và quy chiếu Đại úy Weiss bằng `anh` (chapter001_b/p000188–p000190, p000192, p000195, p000199, p000200); nội tâm tự quy chiếu ngôi thứ nhất số ít của Tanya dùng `mình` (chapter001_b/p000188) và ngôi thứ nhất số nhiều chỉ tập thể đơn vị dùng `chúng tôi` (chapter001_b/p000184); trong đối thoại giữa Tanya và Weiss trước khi phổ biến nhiệm vụ: Weiss xưng `tôi`, gọi `thưa Thiếu tá` / `Thiếu tá` kèm `ạ` (chapter001_b/p000185, p000187), Tanya xưng `tôi`, gọi `Đại úy Weiss` / `anh` (chapter001_b/p000186); khi Weiss hô khẩu lệnh và phổ biến nhiệm vụ cho toàn tiểu đoàn: hô `Tất cả các đơn vị, nghiêm!` (chapter001_b/p000191), gọi tập thể binh sĩ là `Thưa toàn đơn vị` / `Toàn đơn vị` / `các anh`, xưng `tôi` hoặc `chúng ta` (khi bao hàm toàn tiểu đoàn) và quy chiếu Tanya là `tiểu đoàn trưởng của chúng ta` (chapter001_b/p000195, p000198, p000202, p000210)"
  alternatives_vi:
  - chúng ta (thay cho `chúng tôi` trong câu độc thoại nội tâm mở đầu của Tanya tại chapter001_b/p000184 — ưu tiên `chúng tôi` để giữ nhất quán tuyệt đối với cách Tanya tự quy chiếu tập thể Tiểu đoàn 203 trong độc thoại nội tâm suốt từ B01 đến B06) / Toàn quân (thay cho `Toàn đơn vị` trong lời Weiss nói với tiểu đoàn tại chapter001_b/p000195, p000198 — ưu tiên `Thưa toàn đơn vị` / `Toàn đơn vị` để đúng quy mô cấp tiểu đoàn trên máy bay vận tải)
