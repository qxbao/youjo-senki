- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000190
  locks:
  - "Giữ tên `Weiss`, đại từ `Anh` và chi tiết vướng víu giữa khoang máy bay chật hẹp bởi vóc người to lớn."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000191
  locks:
  - "Giữ khẩu lệnh tập hợp: `“Tất cả các đơn vị, nghiêm!”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000192
  locks:
  - "Giữ tên `Serebryakov`, `Grantz`, tiếng hô lặp lại `“Nghiêm!”` và phản ứng đồng loạt dừng kiểm tra trang bị."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000193
  locks:
  - "Giữ tên `Tanya` và `Weiss` cùng mô tả động tác quay sang nhịp nhàng tuyệt đối."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000194
  locks:
  - "Giữ nhận định về hình mẫu của kỷ luật và trật tự."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000195
  locks:
  - "Giữ cách mở đầu `Thưa toàn đơn vị`, chức danh `tiểu đoàn trưởng của chúng ta`, đại từ `Anh` và cái cớ sự cố diễn tập dẫn tới trinh sát bên kia biên giới trong lãnh thổ `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000196
  locks:
  - "Giữ sự tương phản giữa hai lời tuyên bố vênh nhau và thái độ lặng lẽ lắng nghe của các pháp sư."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000197
  locks:
  - "Giữ tên `Tanya` và lời khen những người lính đáng tin cậy."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000198
  locks:
  - "Giữ các thuật ngữ `Bộ Tổng tham mưu`, `trinh sát tầm xa`, `quy tắc giao chiến` và lời nhấn mạnh `Toàn đơn vị, nhiệm vụ này cực kỳ hệ trọng.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000199
  locks:
  - "Giữ tên `Weiss`, `Tanya` và chi tiết chất giọng trời phú đủ lớn để vang khắp khoang máy bay."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000200
  locks:
  - "Giữ thế đối sánh đại từ `anh` và `nó`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000201
  locks:
  - "Giữ câu ngạn ngữ `“Ai có nghề nấy”`, cụm `công thức về lợi thế so sánh của Ricardo` kèm ký hiệu chú thích `²` và tên `Tanya`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000202
  locks:
  - "Giữ đại từ `tôi` – `các anh` và thông tin nhiều nguồn báo cáo hành vi khả nghi ở phía đông."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000203
  locks:
  - "Giữ tên `Weiss` và `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000204
  locks:
  - "Giữ tên `Cụm tập đoàn quân phía Đông` và `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000205
  locks:
  - "Giữ câu hỏi thầm của binh lính: `“…Vậy là chuyện đó rốt cuộc cũng xảy ra rồi sao?”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000206
  locks:
  - "Giữ câu đáp nối tiếp: `“Tôi chẳng thấy chuyện này có thể mang ý nghĩa nào khác được…”`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000207
  locks:
  - "Giữ mô tả ánh nhìn dao động và tiếng xầm xì hiếm thấy của binh lính."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000208
  locks:
  - "Giữ đầy đủ các danh xưng `Các Cụm tập đoàn quân phía Bắc, phía Tây và phía Nam`, `Cụm tập đoàn quân phía Đông`, `Bộ Tư lệnh Tối cao`, `Liên bang` và `Đế quốc`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000209
  locks:
  - "Giữ cụm `Binh sĩ Đế quốc` và tên `Liên bang`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000210
  locks:
  - "Giữ đại từ `chúng ta` và các danh xưng `Bộ Tổng tham mưu`, `Trung đội Trinh sát Đặc biệt Chiến thuật số 437 thuộc Cụm tập đoàn quân phía Đông`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000211
  locks:
  - "Giữ đúng hai cụm nhấn mạnh `*Liệu có khi nào?*` và `*Vậy đó là sự thật*` khớp thẻ `<em>` trong nguồn theo DEC-P01-002."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000212
  locks:
  - "Giữ tên `Tanya` và cái gật đầu xác nhận."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000213
  locks:
  - "Giữ câu ngắn: `Tình hình rất đơn giản.`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000214
  locks:
  - "Giữ các tên gọi và thuật ngữ `Liên bang`, `trung đội trinh sát đặc biệt chiến thuật`, `trinh sát chiều sâu`, `Trung đội 437`, `người Siberia`, `ban Trinh sát Chiến lược thuộc Cục Tác chiến của Bộ Tổng tham mưu`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000215
  locks:
  - "Giữ các thuật ngữ `Liên bang`, `Tuyến Cảnh giới số Một` và `tín hiệu mã hóa`."
- segment_id: YS-LN04/Text/chapter001_b.xhtml/p000216
  locks:
  - "Giữ tên `Weiss` và nhận định kết đoạn về việc chỉ có tân binh mới còn mơ hồ về bản chất nhiệm vụ."
