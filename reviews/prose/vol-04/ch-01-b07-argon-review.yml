  proposed_vi: "Đại úy Weiss, Serebryakov, Grantz, tiểu đoàn trưởng (chapter001_b/p000186, p000190, p000192, p000193, p000195, p000199, p000203, p000216) / Liên bang (chapter001_b/p000195, p000203, p000204, p000208, p000209, p000214, p000215) / Bộ Tổng tham mưu, trinh sát tầm xa, quy tắc giao chiến (chapter001_b/p000198, p000210, p000214) / công thức về lợi thế so sánh của Ricardo² (chapter001_b/p000201) / Cụm tập đoàn quân phía Đông, Các Cụm tập đoàn quân phía Bắc, phía Tây và phía Nam, Bộ Tư lệnh Tối cao, Đế quốc (chapter001_b/p000204, p000208, p000209, p000210) / Trung đội Trinh sát Đặc biệt Chiến thuật số 437, trung đội trinh sát đặc biệt chiến thuật, Trung đội 437 (chapter001_b/p000210, p000214) / trinh sát chiều sâu, người Siberia, ban Trinh sát Chiến lược thuộc Cục Tác chiến của Bộ Tổng tham mưu (chapter001_b/p000214) / Tuyến Cảnh giới số Một, tín hiệu mã hóa (chapter001_b/p000215)"
  alternatives_vi:
