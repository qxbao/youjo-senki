  proposed_vi: "01, những động tác cơ động ba chiều, trang bị hạng nặng, C-Chỉ huy, Weiss, Tanya, hướng sáu giờ, đơn vị không quân, Fairy 01, tốc độ chiến đấu tối đa, phù hiệu nhận dạng, tín hiệu nhận dạng, pháp sư hải quân đánh bộ, Mosquito 01, Sông Rhine, mặt trận Rhine, Cộng hòa, Không đoàn Tiêm kích số 103, Cụm tập đoàn quân phía Tây, quyền làm chủ bầu trời, Đế quốc, mặt trận phía tây, pháp sư trên không, tốc độ bay hành trình, máy bay tiêm kích, tài liệu tác chiến, Grantz, Serebryakov, Đại úy Weiss, Trung úy Serebryakov, quỹ tiểu đoàn, Thiếu tá, Hợp chúng quốc, hội nghị bàn phương án tác chiến phối hợp, đơn vị nghiên cứu kỹ năng tác chiến, đơn vị kiểm chứng đặc biệt, đơn vị huấn luyện, đơn vị tác chiến, Bộ Tổng tham mưu (chapter001_r/p000030–p000042, p000045–p000050, p000052, p000053)"
  alternatives_vi:
  - pháp sư thủy quân lục chiến (thay cho `pháp sư hải quân đánh bộ` tại chapter001_r/p000035 — ưu tiên `pháp sư hải quân đánh bộ` để đồng bộ với hệ thống thuật ngữ lực lượng đổ bộ đường biển đã dùng trong Tập 2–4) / Liên đoàn Tiêm kích số 103 (thay cho `Không đoàn Tiêm kích số 103` tại chapter001_r/p000041, p000047, p000053 — ưu tiên `Không đoàn Tiêm kích số 103` vì tự nhiên, chuẩn xác với cấp đơn vị không quân tiêm kích trực thuộc Cụm tập đoàn quân phía Tây) / hội nghị bàn giáo trình tác chiến liên hợp (thay cho `hội nghị bàn phương án tác chiến phối hợp` tại chapter001_r/p000049 — ưu tiên `hội nghị bàn phương án tác chiến phối hợp` vì diễn đạt tự nhiên, rõ nghĩa bản chất cuộc họp chỉ huy khẩn cấp trước sự xuất hiện của pháp sư Hợp chúng quốc)
