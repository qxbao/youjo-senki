  volume: vol-04
  chapter: 5
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001`, `DEC-P01-002` và `canon/style-guide.md`, giữ đồng bộ hệ đại từ của Tanya (`nó` trong trần thuật, `mình` / `chúng tôi` trong nội tâm và nhận định tự nghiệm, `tôi` / `chúng ta` trong thoại chỉ huy), hệ xưng hô lịch sự ngang hàng với `Mosquito 01` và điều lệnh với Đại úy Weiss – Trung úy Serebryakov, cùng phạm vi nhấn mạnh in nghiêng ở 2 đoạn p000046 và p000050."
  uncertainty: low
