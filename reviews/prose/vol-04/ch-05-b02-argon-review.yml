  rationale: "Kế thừa đồng bộ hệ thống thuật ngữ, tên riêng, quân hàm và đơn vị đã khóa tạm từ Tập 1–3, Chương 1–4 Tập 4 và `vol-04-ch-05-b01` (`những động tác cơ động ba chiều`, `hướng sáu giờ`, `Fairy 01`, `tốc độ chiến đấu tối đa`, `Sông Rhine` / `mặt trận Rhine`, `Cộng hòa`, `Đế quốc`, `Cụm tập đoàn quân phía Tây`, `quyền làm chủ bầu trời`, `mặt trận phía tây`, `pháp sư trên không`, `máy bay tiêm kích`, `Đại úy Weiss`, `Trung úy Serebryakov`, `Grantz`, `Thiếu tá`, `Hợp chúng quốc`, `Bộ Tổng tham mưu`), đồng thời khóa tạm các định danh đơn vị và thuật ngữ tác chiến – hành chính quân sự mới trong lô (`trang bị hạng nặng`, `phù hiệu nhận dạng`, `tín hiệu nhận dạng`, `pháp sư hải quân đánh bộ`, `Mosquito 01`, `Không đoàn Tiêm kích số 103`, `tốc độ bay hành trình`, `tài liệu tác chiến`, `quỹ tiểu đoàn`, `hội nghị bàn phương án tác chiến phối hợp`, `đơn vị nghiên cứu kỹ năng tác chiến`, `đơn vị kiểm chứng đặc biệt`)."
