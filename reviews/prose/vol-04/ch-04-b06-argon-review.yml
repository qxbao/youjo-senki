- source_term: zettour_restraint_lergen_rebellious_phase_guess_and_federation_war_premise_terms_vol04_ch04_b06
  proposed_vi: "Thiếu tá / vị thiếu tá / Thiếu tá von Degurechaff / Degurechaff, vị tướng / Tướng quân / Zettour, Lergen, sử gia, con mắt chiến lược, quân đội, phiên điều trần, giai đoạn nổi loạn, ý nghĩa quân sự, cuộc tập kích vào Moskva, các chiến tuyến chính ở phía đông, Liên bang, thuốc giảm đau, tiểu đoàn pháp sư trên không, Huy hiệu Đột kích Cánh bạc đính Lá sồi, anh hùng, biệt danh, Bạch Ngân, Ngân Gỉ, tiền tuyến, công tác ở hậu phương, một nền hòa bình sớm, tiền đề, Đế quốc, Cộng hòa, cường quốc, những vụ đụng độ ngoài ý muốn ở biên giới, sĩ quan tham mưu, Văn phòng Bộ Tổng tham mưu (chapter001_n/p000137, p000139, p000141–p000146, p000149–p000160, p000163–p000167, p000169, p000171, p000173–p000175)"
  alternatives_vi:
  - nhãn quan chiến lược (thay cho `con mắt chiến lược` tại chapter001_n/p000143 — ưu tiên `con mắt chiến lược` vì giữ sát hình ảnh ẩn dụ trực quan trong lời khen kìm nén của Tướng von Zettour) / thời kỳ phản kháng (thay cho `giai đoạn nổi loạn` tại chapter001_n/p000151 — ưu tiên `giai đoạn nổi loạn` vì diễn đạt tự nhiên, chuẩn xác thuật ngữ tâm lý lứa tuổi khi Đại tá von Lergen liên tưởng tới sự bướng bỉnh trẻ con của Tanya)
