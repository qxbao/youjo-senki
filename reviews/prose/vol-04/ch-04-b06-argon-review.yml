  rationale: "Kế thừa đồng bộ hệ thống danh xưng cơ quan, đơn vị, nhân vật, cấp bậc, huân chương và thuật ngữ quân sự đã khóa tạm từ Tập 1–3 cùng Chương 1–3 và `vol-04-ch-04-b01` – `b05` (`Thiếu tá` / `vị thiếu tá` / `Thiếu tá von Degurechaff` / `Degurechaff`, `vị tướng` / `Tướng quân` / `Zettour`, `Lergen`, `phiên điều trần`, `cuộc tập kích vào Moskva`, `các chiến tuyến chính ở phía đông`, `Liên bang`, `tiểu đoàn pháp sư trên không`, `Huy hiệu Đột kích Cánh bạc đính Lá sồi`, `biệt danh`, `Bạch Ngân`, `Ngân Gỉ`, `tiền tuyến`, `công tác ở hậu phương`, `Đế quốc`, `Cộng hòa`, `cường quốc`, `sĩ quan tham mưu`, `Văn phòng Bộ Tổng tham mưu`), đồng thời khóa tạm các cụm thuật ngữ và cách diễn đạt mới trong lô (`con mắt chiến lược`, `giai đoạn nổi loạn`, `một nền hòa bình sớm`, `những vụ đụng độ ngoài ý muốn ở biên giới`)."
