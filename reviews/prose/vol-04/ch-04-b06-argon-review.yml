  volume: vol-04
  chapter: 4
  rationale: "Tuân thủ nghiêm ngặt `DEC-P01-001` và `DEC-P01-002`, tiếp nối liền mạch `vol-04-ch-04-b01` – `b05` dưới điểm nhìn của Đại tá von Lergen (`ông` / `mình` cho Lergen, `ông` cho Zettour, `cô` / `Cô` trong lời kể khách quan và khi hướng ý nghĩ trực tiếp về phía Tanya, `cô ấy` / `Cô ấy` trong suy ngẫm nội tâm ngôi thứ ba của Lergen khi quy chiếu Thiếu tá von Degurechaff, `tôi / Tôi – Thiếu tá / cô / Cô` và `tôi / Tôi / chúng ta – Thưa Tướng quân / thưa Tướng quân / thưa ngài... ạ` trong đối thoại giữa Tướng von Zettour và Thiếu tá von Degurechaff), đồng thời bảo toàn chính xác các cấu trúc giả định/điều kiện, câu hỏi trực tiếp/nội tâm và cả 10 đoạn có nhấn mạnh in nghiêng tại p000140, p000147, p000148, p000151, p000152, p000157, p000158, p000159, p000160 và p000175."
