- source_term: lergen_pov_zettour_degurechaff_shift_to_strategic_discussion_pronouns_address_and_emphasis_vol04_ch04_b06
  proposed_vi: "Tiếp nối trực tiếp `vol-04-ch-04-b01` – `b05` trong toàn bộ 39 đoạn của `vol-04-ch-04-b06` (chapter001_n/p000137–p000175) khi Tướng von Zettour kìm nén cơn giận để chuyển từ chất vấn sang thảo luận chiến lược với Thiếu tá Tanya von Degurechaff trước sự chứng kiến của Đại tá von Lergen: tuân thủ nghiêm ngặt giới hạn của `DEC-P01-001` (quy ước dùng `nó` trong trần thuật và `mình` trong nội tâm chỉ áp dụng cho điểm nhìn của Tanya, không áp dụng sang điểm nhìn của Đại tá von Lergen) và `DEC-P01-002`: (1) Trần thuật ngôi thứ ba và độc thoại nội tâm bám sát điểm nhìn của Đại tá von Lergen quy chiếu Lergen nhất quán bằng tên riêng `Lergen`, đại từ `ông` / `Ông` trong trần thuật (p000139, p000141, p000146, p000147, p000149, p000152, p000156, p000163, p000164, p000169, p000173, p000174, p000175) và tự quy chiếu bằng `mình` trong câu độc thoại nội tâm tự vấn (p000140); quy chiếu Tướng von Zettour bằng tên riêng `Zettour`, danh xưng `vị tướng` và đại từ `ông` / `Ông` kết hợp phản thân `mình` (p000137, p000138, p000144, p000149, p000155, p000163, p000166, p000173); quy chiếu Thiếu tá Tanya von Degurechaff bằng `Thiếu tá von Degurechaff` / `Degurechaff` / `vị thiếu tá`, đại từ `cô` / `Cô` kết hợp phản thân `mình` trong lời kể khách quan (p000145, p000146, p000149, p000150, p000151, p000155, p000156, p000166, p000173, p000174), dùng `Cô` khi Lergen hướng ý nghĩ nhận xét trực tiếp về phía Tanya (p000147, p000157), và dùng `cô ấy` / `Cô ấy` kết hợp phản thân `mình` trong các câu suy ngẫm nội tâm ngôi thứ ba của Lergen (p000151, p000158, p000159, p000160); quy chiếu hai người Degurechaff – Zettour ở p000173 và phía Liên bang ở p000174 bằng đại từ `họ`, lưu ý đại từ `nó` ở p000154 và p000168 chỉ quy chiếu danh từ bất động vật (`cuộc tập kích vào Moskva` và `một nền hòa bình sớm`). (2) Trong đối thoại quân ngũ giữa Tướng von Zettour và Thiếu tá Tanya von Degurechaff: Zettour (p000137, p000143, p000153, p000161, p000165, p000167, p000170, p000172) tự xưng `tôi` / `Tôi`, gọi Tanya là `Thiếu tá` và `cô` / `Cô`; Thiếu tá Tanya von Degurechaff (p000142, p000145, p000154, p000162, p000166, p000168, p000171) tự xưng `tôi` / `Tôi`, dùng đại từ gộp `chúng ta` khi nói về phía Đế quốc (p000171), gọi Zettour là `Thưa Tướng quân` / `thưa Tướng quân` / `thưa ngài` kèm tiểu từ kính ngữ `ạ`. (3) Bảo toàn chính xác các giả định trái thực tế trong quá khứ và mệnh đề điều kiện (p000139, p000144, p000151, p000158, p000174), các câu hỏi trực tiếp / nội tâm / tu từ (p000137, p000140, p000148, p000151, p000157, p000160, p000167, p000169, p000170, p000171, p000175), và cả 10 đoạn có nhấn mạnh Markdown `*...*` theo `DEC-P01-002` tương ứng với thẻ `<html:em>` trong nguồn tại p000140 (`*Đó thực sự là điều đang ở trong tâm trí mình ngay lúc này sao?*`), p000147 (`*Cô đang cư xử như một đứa trẻ cố đòi bằng được theo ý mình vậy*`), p000148 (`*…Một đứa trẻ cố đòi bằng được theo ý mình ư?*`), p000151 (`*Chẳng lẽ cô ấy đang trải qua giai đoạn nổi loạn sao?*`), p000152 (`*Đùa nhau chắc.*`), p000157 (`*Cô tự hào về việc đó nhưng đồng thời lại dỗi hờn vì bị chỉ trích vì chính việc đó sao?*`), p000158 (`*Nếu con quái vật dẫn dắt một tiểu đoàn pháp sư trên không lại là một người lính có tâm tính thế này, thì thật trớ trêu hết sức. Cô ấy sở hữu Huy hiệu Đột kích Cánh bạc đính Lá sồi. Những chiến công của cô ấy hầu như đòi hỏi người ta phải mô tả cô ấy là một anh hùng.*`), p000159 (`*Nhưng biệt danh Bạch Ngân của cô ấy có lẽ lại quá xa rời sự thật. Thay vì là một Bạch Ngân thanh tao, cô ấy là một kẻ địch đáng sợ bị ăn mòn bởi máu bắn tung tóe và xứng với cái tên Ngân Gỉ hơn.*`), p000160 (`*Dẫu vậy, bên trong cô ấy lại là một đứa trẻ đang rên rỉ rằng mình không muốn ra tiền tuyến chỉ vì có người nổi giận với mình sao?*`) và p000175 (`*Tại sao?!*`), không phát sinh dấu `*` ngoài nguồn ở 29 đoạn còn lại."
  alternatives_vi:
  - cô ta (thay cho `cô ấy` trong các câu suy ngẫm nội tâm của Lergen tại chapter001_n/p000151, p000158, p000159, p000160 — ưu tiên `cô ấy` vì tại đây Lergen đã chuyển từ cơn bàng hoàng sửng sốt ở b05 sang suy ngẫm pha lẫn cảm thông và bối rối khi nhận ra Tanya vẫn chỉ là một đứa trẻ nhỏ tuổi và là một anh hùng mang Huy hiệu Đột kích Cánh bạc đính Lá sồi)
