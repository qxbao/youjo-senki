- source_term: imperial_general_staff_war_room_zettour_rudersdorf_degurechaff_pronouns_vol04_ch03_b06
  proposed_vi: "Trong phân cảnh đối thoại giữa Trung tướng von Zettour và Trung tướng von Rudersdorf tại Phòng Tác chiến thuộc Văn phòng Bộ Tổng tham mưu Đế quốc về làn sóng chỉ trích cuộc tập kích Moskva, phẩm chất sĩ quan Bộ Tổng tham mưu của Thiếu tá von Degurechaff và đề xuất điều động Tiểu đoàn 203 làm lực lượng tiên phong ở mặt trận phía đông (chapter001_l/p000029–p000063): tuân thủ nghiêm ngặt `DEC-P01-001` và tiếp nối liền mạch `vol-04-ch-02-b16` – `b17` cùng `vol-04-ch-03-b01` – `b05`: (1) Trần thuật ngôi thứ ba đặt dưới điểm nhìn của Trung tướng von Zettour quy chiếu Zettour và Rudersdorf bằng đại từ trang trọng `ông` / `Ông` (p000035, p000036, p000040, p000044, p000046, p000052–p000054) kết hợp tên riêng (`Rudersdorf`, `Zettour`) và đại từ phản thân `mình` (p000054); quy chiếu Thiếu tá Tanya von Degurechaff từ góc nhìn của Zettour bằng đại từ `cô` / `Cô` (p000044, p000046, p000053, p000054) kết hợp đại từ phản thân `mình` (p000046); quy chiếu những người chỉ trích và Lergen bằng `họ` (p000044). (2) Trong độc thoại nội tâm trực tiếp in nghiêng của Zettour (p000044, p000047, p000058): tự quy chiếu ngôi thứ nhất bằng `mình` (p000044, p000058), quy chiếu Thiếu tá von Degurechaff bằng danh xưng `Thiếu tá von Degurechaff` và đại từ `cô ấy` (p000044, p000047, p000058), và quy chiếu Rudersdorf bằng `Ông ta` (p000058). (3) Trong đối thoại trực tiếp giữa hai vị trung tướng đồng cấp kiêm bạn hữu (p000029, p000030, p000032–p000034, p000037–p000039, p000041–p000043, p000045, p000048–p000052, p000055–p000057, p000059–p000063): người nói tự xưng `tôi` / `Tôi`, gọi đối phương là `ông` / `Ông` kèm tên riêng `Zettour`, `Rudersdorf` hoặc danh xưng `Tướng von Zettour` (p000063), dùng `chúng ta` / `Chúng ta` khi nói về Bộ Tổng tham mưu và quân đội Đế quốc (p000030, p000032–p000034, p000057), quy chiếu Thiếu tá von Degurechaff bằng `Thiếu tá von Degurechaff` và `cô ấy` (p000045, p000048, p000052, p000055–p000057), và quy chiếu Tiểu đoàn 203 cùng các đạo quân ở miền đông bằng `họ` (p000059, p000061)"
  alternatives_vi:
  - nó (thay cho `cô` / `Cô` trong trần thuật tại chapter001_l/p000044, p000046, p000053, p000054 hoặc thay cho `cô ấy` trong độc thoại nội tâm của Zettour tại p000044, p000047, p000058 — bắt buộc giữ `cô` / `Cô` trong trần thuật và `cô ấy` trong nội tâm của Zettour vì theo `DEC-P01-001` đại từ `nó` chỉ dùng cho trần thuật bám sát điểm nhìn của Tanya, còn ở đây điểm nhìn thuộc về Trung tướng von Zettour, đồng bộ tuyệt đối với các phân cảnh của Zettour và Lergen ở Tập 1–4) / anh – cậu (thay cho `ông` / `Ông` trong đối thoại giữa Zettour và Rudersdorf tại chapter001_l/p000029, p000037, p000039, p000042, p000043, p000048, p000051, p000055–p000057, p000060, p000063 — bắt buộc giữ cặp `tôi` – `ông` để đồng bộ tuyệt đối với `vol-04-ch-03-b01` – `b05`)
