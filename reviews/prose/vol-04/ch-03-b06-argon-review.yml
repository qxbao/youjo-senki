  volume: vol-04
  chapter: 3
  rationale: "Kế thừa đồng bộ hệ thống danh xưng địa danh, cơ quan, đơn vị, nhân vật, cấp bậc và thuật ngữ quân sự – chính trị đã khóa tạm từ Tập 1–3 cùng Chương 1–2 và `ch-03-b01` – `b05` của Tập 4 (`hoàng cung`, `Tướng von Zettour` / `Zettour`, `Rudersdorf`, `các yếu tố chính trị`, `Tiểu đoàn Pháp sư Trên không số 203` / `Tiểu đoàn 203`, `Moskva`, `hậu phương`, `Đại tá von Lergen`, `sĩ quan ma pháp`, `Thiếu tá von Degurechaff`, `sĩ quan Bộ Tổng tham mưu`, `Bộ Tổng tham mưu`, `chó điên`, `nguyên tắc raison d’état`, `Cục Hậu cần`, `Cục Tác chiến`, `cấp độ chiến lược`, `cấp độ chiến thuật`, `trường quân sự cao cấp`, `Cụm tập đoàn quân phía Đông`), đồng thời khóa tạm các tổ hợp thuật ngữ trong phân cảnh Zettour đánh giá phẩm chất tham mưu của Thiếu tá von Degurechaff và Rudersdorf mượn Tiểu đoàn 203 làm lực lượng tiên phong (`quan chức quân sự`, `chức trưởng ban`, `nhiệm vụ cơ động`, `lực lượng tiên phong`, `mũi đột phá`, `lực lượng cơ động`)."
