  proposed_vi: "hoàng cung, Zettour, Rudersdorf, các yếu tố chính trị, sức mạnh quân sự, quan chức quân sự (chapter001_l/p000029–p000031, p000033, p000035, p000040, p000044, p000048, p000051, p000058, p000061, p000062) / Tiểu đoàn Pháp sư Trên không số 203, Moskva, hậu phương, Đại tá von Lergen, sĩ quan ma pháp (chapter001_l/p000039, p000043, p000044, p000048) / Thiếu tá von Degurechaff, sĩ quan Bộ Tổng tham mưu, con chó điên, chiến lược, nguyên tắc raison d’état, chức trưởng ban, Cục Hậu cần, Cục Tác chiến (chapter001_l/p000047, p000048, p000052, p000053) / cấp độ chiến lược, cấp độ chiến thuật, Bộ Tổng tham mưu, trường quân sự cao cấp, Tiểu đoàn 203 (chapter001_l/p000053, p000054, p000056, p000057, p000063) / nhiệm vụ cơ động, lực lượng tiên phong, Cụm tập đoàn quân phía Đông, các đạo quân ở miền đông, mũi đột phá, Tướng von Zettour, lực lượng cơ động (chapter001_l/p000059–p000061, p000063)"
  alternatives_vi:
