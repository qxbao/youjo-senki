- segment_id: YS-LN09/Text/chapter006.xhtml/p000398
  severity: style_only
  description: Bản ứng viên thêm phó từ chỉ mức độ ("không đặt kỳ vọng quá cao") so
    với bản gốc và bản đã duyệt ("không đặt kỳ vọng cao"), chỉ tinh chỉnh nhịp điệu
    và không làm sai lệch ý nghĩa hoặc điểm nhìn.
