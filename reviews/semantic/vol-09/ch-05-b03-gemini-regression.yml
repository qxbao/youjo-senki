- segment_id: YS-LN09/Text/chapter018.xhtml/p000094
  severity: style_only
  description: Bản ứng viên đổi cụm mô tả nụ cười từ "gượng gạo" sang "tươi" cho cách
    cười xã giao đắp lên mặt, làm sắc thái nhẹ hơn so với bản chuẩn nhưng vẫn giữ
    nguyên ý chính là ông ta mỉm cười tỏ ý không ghét lời tâng bốc và không vi phạm
    các lựa chọn đã khóa.
